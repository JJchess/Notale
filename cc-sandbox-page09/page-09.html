<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #p9-root { position: relative; }

  #p9-root .ledger-strip {
    align-items: flex-end;
    justify-content: space-between;
  }
  #p9-root .p9-lead {
    margin-top: 6px;
    max-width: 62ch;
  }
  #p9-root .p9-summary {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex: 0 0 auto;
    white-space: nowrap;
  }
  #p9-root .p9-summary .p9-loss-line {
    font-size: var(--fs-body);
    color: var(--muted);
  }

  #p9-root .ledger-cols > .p9-rail {
    flex: 0 0 302px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #p9-root .p9-invariant {
    font-size: var(--fs-label);
    color: var(--muted);
    line-height: 1.5;
  }
  #p9-root .p9-invariant b {
    font-family: var(--font-mono);
    color: var(--text);
    font-weight: 600;
  }
  #p9-root .p9-rail .hint {
    align-self: flex-start;
  }
  #p9-root .p9-closing {
    margin-top: auto;
    font-size: var(--fs-sec);
    color: var(--text);
    line-height: 1.5;
    border-left: 2px solid var(--ink);
    padding-left: 12px;
  }
  #p9-root .p9-spark-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #p9-root .p9-spark-label {
    font-size: var(--fs-label);
    color: var(--muted);
  }
  #p9-root .p9-spark {
    display: block;
    width: 100%;
    height: 158px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--paper);
  }
  #p9-root .p9-spark-area { fill: rgba(43, 76, 126, .14); stroke: none; }
  #p9-root .p9-spark-line { fill: none; stroke: var(--ink); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
  #p9-root .p9-spark-dot { fill: var(--accent); }
  #p9-root .p9-spark-axis { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
  #p9-root .p9-spark text { font-family: var(--font-mono); font-size: 12px; fill: var(--muted); }

  #p9-root .p9-history-panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #p9-root .p9-rows {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 0;
    min-height: 0;
    padding-left: 40px;
  }
  #p9-root .p9-axis-line {
    position: absolute;
    left: 15px;
    top: 18px;
    bottom: 18px;
    width: 2px;
    background: var(--line);
  }
  #p9-root .p9-row {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 3px 14px;
    border-radius: 8px;
    opacity: .62;
    background: rgba(43, 76, 126, .035);
  }
  #p9-root .p9-row-main {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  #p9-root .p9-row-note {
    font-size: var(--fs-sec);
    line-height: 1.25;
    color: var(--muted);
    padding-left: 2px;
  }
  #p9-root .p9-row.is-current .p9-row-note { color: var(--text); }
  #p9-root .p9-row.is-current { opacity: 1; background: rgba(43, 76, 126, .07); }
  #p9-root .p9-row.is-pending {
    opacity: .42;
    background: transparent;
    border: 1px dashed var(--line);
  }
  #p9-root .p9-row.is-pending .p9-vals { color: var(--muted); }
  #p9-root .p9-idx {
    position: absolute;
    left: -40px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--paper);
    border: 1.5px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: var(--fs-tick);
    color: var(--muted);
    flex: 0 0 auto;
  }
  #p9-root .p9-row.is-current .p9-idx {
    border-color: var(--ink);
    color: var(--ink);
    font-weight: 700;
    background: var(--paper);
  }
  #p9-root .p9-vals {
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex: 0 0 auto;
  }
  #p9-root .p9-bar-track {
    position: relative;
    flex: 1;
    height: 24px;
    min-width: 60px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    border-radius: 7px;
    background: rgba(43, 76, 126, .07);
    border: 1px solid var(--line-soft);
    overflow: hidden;
    font-size: var(--fs-label);
    color: var(--ink);
    white-space: nowrap;
  }
  #p9-root .p9-row.is-pending .p9-bar-track {
    background: transparent;
    border-style: dashed;
    color: var(--muted);
  }
  #p9-root .p9-bar-fill {
    position: absolute;
    inset: 0 auto 0 0;
    background: var(--ink);
    opacity: .30;
    border-radius: 8px 0 0 8px;
  }
  #p9-root .p9-row.is-current .p9-bar-fill { opacity: .45; }
  #p9-root .p9-grad {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 0 0 auto;
  }
  #p9-root .p9-grad .p9-tri {
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-bottom: 11px solid var(--accent);
  }
  #p9-root .p9-grad.dir-up .p9-tri { transform: rotate(0deg); }
  #p9-root .p9-grad.dir-down .p9-tri { transform: rotate(180deg); }
  #p9-root .p9-grad .p9-grad-val {
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    min-width: 4.2em;
  }
  #p9-root .p9-arrow-row {
    display: flex;
    justify-content: flex-start;
    padding-left: 5px;
    height: 5px;
    align-items: center;
  }
  #p9-root .p9-arrow-row .arw {
    transform: rotate(90deg);
    min-width: 16px;
  }

  #p9-root .p9-nextq {
    flex: 0 0 auto;
    margin-top: 18px;
    font-size: var(--fs-sec);
    color: var(--muted);
  }

  @media (prefers-reduced-motion: no-preference) {
    #p9-root .p9-row { transition: opacity .25s ease; }
    #p9-root .p9-row.is-entering { animation: p9-enter .28s ease both; }
    @keyframes p9-enter {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  }
</style>
</head>
<body data-page="09" data-total="18">
<div id="stage">

  <div class="ledger" id="p9-root">
    <div class="ledger-strip">
      <div class="head-stack">
        <span class="kicker">KEEP-GOING</span>
        <h1>反复算方向、挪一步，误差一路降下来</h1>
        <p class="lead p9-lead">不是一步到位，是同一个动作做了很多次，误差才慢慢趴下去。</p>
      </div>
      <div class="p9-summary">
        <span class="tag accent" id="p9-step-tag">第 1 次尝试</span>
        <span class="p9-loss-line">损失 <span class="num" id="p9-loss-val">0.2026</span></span>
      </div>
    </div>

    <div class="ledger-cols">
      <div class="panel p9-rail">
        <p class="p9-invariant">
          固定条件：输入 <b>(1, 1)</b> → 目标 <b>1</b>　学习率 <b>0.1</b>　激活 <b>sigmoid</b>
        </p>
        <div class="btns">
          <button class="btn primary" id="p9-next" type="button">下一步</button>
          <button class="btn" id="p9-play" type="button">连续播放</button>
          <button class="btn" id="p9-reset" type="button">重来</button>
        </div>
        <p class="hint" id="p9-hint">还能再走 9 步</p>
        <div class="p9-spark-wrap">
          <span class="p9-spark-label">损失随步数变化</span>
          <svg class="p9-spark" id="p9-spark" viewBox="0 0 280 158" role="img" aria-label="损失随步数下降的折线">
            <title>损失随步数下降</title>
            <line class="p9-spark-axis" x1="8" y1="138" x2="272" y2="138"></line>
            <polygon class="p9-spark-area" id="p9-spark-area"></polygon>
            <polyline class="p9-spark-line" id="p9-spark-line"></polyline>
            <circle class="p9-spark-dot" id="p9-spark-dot" r="3.5"></circle>
          </svg>
        </div>
        <p class="p9-closing">每一步都在做同一件事：算错多少、算往哪改、挪一小步。权重一点点变大，损失一点点变小。</p>
      </div>

      <div class="panel q p9-history-panel">
        <div class="p9-rows" id="p9-rows" role="list" aria-label="逐步梯度下降记录">
          <div class="p9-axis-line" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <p class="p9-nextq">一个神经元能学会这些，但它能画出的边界，够用吗？</p>
  </div>

  <div class="sr-only" id="p9-status" aria-live="polite"></div>

</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function () {
  Deck.init({ index: 9, total: 18 });

  var INPUTS = Lec.K.LOGIC_INPUTS[3];       // (1,1)
  var TARGET = Lec.K.AND_TARGETS[3];        // 1
  var LR = Lec.K.LR_DEFAULT;                // 0.1
  var MAX_STEPS = 10;
  var PLAY_INTERVAL_MS = 600;

  var rowsEl = document.getElementById('p9-rows');
  var stepTagEl = document.getElementById('p9-step-tag');
  var lossValEl = document.getElementById('p9-loss-val');
  var hintEl = document.getElementById('p9-hint');
  var statusEl = document.getElementById('p9-status');
  var nextBtn = document.getElementById('p9-next');
  var playBtn = document.getElementById('p9-play');
  var resetBtn = document.getElementById('p9-reset');
  var sparkLine = document.getElementById('p9-spark-line');
  var sparkArea = document.getElementById('p9-spark-area');
  var sparkDot = document.getElementById('p9-spark-dot');

  var history = [];
  var timer = null;

  function computeNext() {
    var prevW = history.length ? history[history.length - 1].newWeights : [0.1, 0.1];
    var prevB = history.length ? history[history.length - 1].newBias : 0;
    var r = Lec.P.neuronGradientStep(INPUTS, TARGET, prevW, prevB, 'sigmoid', LR);
    history.push({
      idx: history.length + 1,
      w: prevW,
      b: prevB,
      a: r.a,
      loss: r.loss,
      gradW: r.gradW,
      newWeights: r.newWeights,
      newBias: r.newBias
    });
  }

  function stopPlay() {
    if (timer) { window.clearInterval(timer); timer = null; }
    playBtn.textContent = '连续播放';
  }

  function renderSpark() {
    var loss0 = history[0].loss;
    var x0 = 8, x1 = 272, y0 = 138, y1 = 14;
    var n = history.length;
    var pts = history.map(function (rec, i) {
      var x = n > 1 ? x0 + (x1 - x0) * (i / (n - 1)) : x0;
      var t = loss0 > 0 ? Math.max(0, Math.min(1, rec.loss / loss0)) : 0;
      var y = y0 + (y1 - y0) * (1 - t);
      return [x, y];
    });
    var lineD = pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    sparkLine.setAttribute('points', lineD);
    var areaD = (x0 + ',' + y0 + ' ') + lineD + (' ' + pts[pts.length - 1][0] + ',' + y0);
    sparkArea.setAttribute('points', areaD);
    var last = pts[pts.length - 1];
    sparkDot.setAttribute('cx', last[0]);
    sparkDot.setAttribute('cy', last[1]);
  }

  function render(announce) {
    var loss0 = history[0].loss;
    var frag = document.createDocumentFragment();
    var line = rowsEl.querySelector('.p9-axis-line');
    rowsEl.innerHTML = '';
    rowsEl.appendChild(line);

    for (var i = 0; i < MAX_STEPS; i++) {
      var rec = history[i];
      var isLast = i === history.length - 1;
      var row = document.createElement('div');
      row.setAttribute('role', 'listitem');

      if (rec) {
        var ratio = loss0 > 0 ? Math.max(0, Math.min(1, rec.loss / loss0)) : 0;
        var barPct = Math.max(4, Math.round(ratio * 100));
        var dir = rec.gradW[0] < 0 ? 'up' : 'down';
        var gv = (-rec.gradW[0]).toFixed(2);

        row.className = 'p9-row' + (isLast ? ' is-current is-entering' : '');
        row.innerHTML =
          '<div class="p9-row-main">' +
          '<span class="p9-idx">' + rec.idx + '</span>' +
          '<span class="p9-vals">w=[' + rec.w[0].toFixed(2) + ', ' + rec.w[1].toFixed(2) + ']　b=' + rec.b.toFixed(2) + '　L=' + rec.loss.toFixed(4) + '</span>' +
          '<span class="p9-bar-track"><span class="p9-bar-fill" style="width:' + barPct + '%"></span>误差余量 ' + barPct + '%</span>' +
          '<span class="p9-grad dir-' + dir + '"><span class="p9-tri" aria-hidden="true"></span><span class="p9-grad-val">Δw ' + gv + '</span></span>' +
          '</div>' +
          '<div class="p9-row-note">输出 a=' + rec.a.toFixed(3) + '，离目标 1 还差 ' + (1 - rec.a).toFixed(3) + '，权重按梯度方向挪了一小步</div>';
      } else {
        row.className = 'p9-row is-pending';
        row.innerHTML =
          '<div class="p9-row-main">' +
          '<span class="p9-idx">' + (i + 1) + '</span>' +
          '<span class="p9-vals">w=[--, --]　b=--　L=--</span>' +
          '<span class="p9-bar-track">尚未计算</span>' +
          '<span class="p9-grad"><span class="p9-grad-val">Δw --</span></span>' +
          '</div>' +
          '<div class="p9-row-note">还没轮到这一步 · 继续点下一步或连续播放</div>';
      }
      frag.appendChild(row);

      if (i < MAX_STEPS - 1) {
        var arrowRow = document.createElement('div');
        arrowRow.className = 'p9-arrow-row';
        arrowRow.setAttribute('aria-hidden', 'true');
        arrowRow.innerHTML = '<span class="arw ink"></span>';
        frag.appendChild(arrowRow);
      }
    }
    rowsEl.appendChild(frag);
    renderSpark();

    var last = history[history.length - 1];
    stepTagEl.textContent = '第 ' + last.idx + ' 次尝试';
    lossValEl.textContent = last.loss.toFixed(4);

    var atMax = history.length >= MAX_STEPS;
    nextBtn.disabled = atMax;
    playBtn.disabled = atMax;
    hintEl.textContent = atMax
      ? '已到第 10 次尝试'
      : '还能再走 ' + (MAX_STEPS - history.length) + ' 步';

    if (atMax) stopPlay();

    if (announce) {
      statusEl.textContent = '第 ' + last.idx + ' 次尝试，损失 ' + last.loss.toFixed(4);
    }
  }

  function addStep(announce) {
    if (history.length >= MAX_STEPS) return false;
    computeNext();
    render(announce !== false);
    return true;
  }

  function resetAll() {
    stopPlay();
    history = [];
    addStep(false);
    statusEl.textContent = '已重来，回到第 1 次尝试';
  }

  nextBtn.addEventListener('click', function () {
    stopPlay();
    addStep(true);
  });

  playBtn.addEventListener('click', function () {
    if (timer) { stopPlay(); return; }
    if (history.length >= MAX_STEPS) return;
    playBtn.textContent = '暂停';
    timer = window.setInterval(function () {
      var added = addStep(true);
      if (!added) stopPlay();
    }, PLAY_INTERVAL_MS);
  });

  resetBtn.addEventListener('click', resetAll);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopPlay();
  });

  // 首屏已含可讲信息：直接算出第 1 次尝试
  addStep(false);
})();
</script>
</body>
</html>
