<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="一个关于路径效率的互动割草实验。用方向键走遍草坪，再和最短路线比较。"
    />
    <title>草坪上的最短路</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="story-shell">
      <header class="intro">
        <p class="kicker">一个可以亲手验证的路径问题</p>
        <h1>你会怎样剪完<br />这块草坪？</h1>
        <p class="lede">
          石块把简单的往返路线打乱了。试着走遍每一格草地，看看你的直觉离最短路径有多远。
        </p>
      </header>

      <section class="experiment" aria-labelledby="experiment-title">
        <div class="experiment-heading">
          <h2 id="experiment-title">轮到你了。你能多高效？</h2>
          <button class="text-button" id="skipButton" type="button">直接看示例</button>
        </div>

        <div class="game-meta" aria-live="polite">
          <span id="moveLabel">第 1 步</span>
          <span id="coverageLabel">已修剪 1 / 49 格</span>
        </div>

        <div class="board-wrap" id="boardWrap">
          <canvas
            id="gameCanvas"
            width="512"
            height="512"
            tabindex="0"
            role="img"
            aria-label="8 乘 8 的草坪。开始后使用方向键移动割草机，绕开石块并修剪所有草地。"
          ></canvas>
          <div class="start-layer" id="startLayer">
            <button class="primary-button" id="startButton" type="button">开始割草</button>
          </div>
          <p class="canvas-error" id="canvasError" hidden>
            当前浏览器无法绘制草坪，请更换现代浏览器后重试。
          </p>
        </div>

        <p class="instruction" id="instruction">使用方向键移动。碰到石块不会计步。</p>

        <div class="dpad" aria-label="移动控制">
          <button type="button" data-direction="up" aria-label="向上移动">↑</button>
          <button type="button" data-direction="left" aria-label="向左移动">←</button>
          <button type="button" data-direction="down" aria-label="向下移动">↓</button>
          <button type="button" data-direction="right" aria-label="向右移动">→</button>
        </div>
      </section>

      <section class="results" id="results" aria-labelledby="results-title" hidden>
        <p class="results-copy" id="results-title"></p>

        <div class="comparison">
          <figure>
            <figcaption>你的路线</figcaption>
            <canvas
              id="playerResultCanvas"
              width="512"
              height="512"
              role="img"
              aria-label="你的割草路线图"
            ></canvas>
          </figure>
          <figure>
            <figcaption>一条最短路线</figcaption>
            <canvas
              id="optimalResultCanvas"
              width="512"
              height="512"
              role="img"
              aria-label="49 步的最短割草路线图"
            ></canvas>
          </figure>
        </div>

        <div class="result-actions">
          <button class="primary-button" id="replayButton" type="button">再试一次</button>
        </div>

        <aside class="takeaway">
          <h2>草地消失后，只剩一个图论问题。</h2>
          <p>
            每块草地是一个节点，相邻方格是边。石块改变了连接关系，而重复经过的每一格都会降低效率。
          </p>
        </aside>
      </section>
    </main>

    <footer>
      <p>用键盘、触摸按钮或在草坪上滑动。</p>
    </footer>

    <script src="./app.js"></script>
  </body>
</html>
