<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__PAGE_TITLE__</title>
<style>
  :root{ --bg:#ffffff; --ink:#1a2233; --sub:#7c89a3; --line:#c9d2e3; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Segoe UI','Microsoft YaHei',system-ui,Arial,sans-serif;padding:18px}
  .bar{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
  .bar h1{font-size:16px;margin:0;font-weight:700}
  .bar .sp{flex:1}
  .tabs{display:flex;gap:6px}
  .tab{font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line);
    background:#f4f7fb;color:#33405c;border-radius:8px;padding:7px 14px;transition:.15s}
  .tab:hover{border-color:#7aa0d8}
  .tab.on{background:linear-gradient(135deg,#3aa0ff,#2fd6c4);color:#06121f;border-color:transparent}
  .btn{font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);
    background:#f4f7fb;color:#33405c;border-radius:8px;padding:7px 12px}
  #stage{width:100%;overflow:auto;border:1px solid #eef1f6;border-radius:12px;background:#fff}
  svg{display:block}
  .hint{color:var(--sub);font-size:12px;margin-top:10px;line-height:1.6}
</style>
</head>
<body>
  <div class="bar">
    <h1 id="ttl">__PAGE_TITLE__</h1>
    <span class="sp"></span>
    <div class="tabs" id="tabs"></div>
    <button class="btn" id="dl">⬇ Download SVG</button>
  </div>
  <div id="stage"></div>
  <div class="hint" id="hint"></div>

<script>
/* ============================================================================
 *  HTML/SVG DIAGRAM ENGINE  —  spec -> orthogonal layered SVG
 *  Layouts: "bands" (explicit layers) | "flow" (auto-ranked DAG) | "free" (grid coords)
 *  This engine block is STABLE — the skill only edits the SPEC block far below.
 * ==========================================================================*/

/* default node-class palette (specs may add/override via spec.classes) */
const NODE_CLASS_DEFAULT = {
  common : {fill:"#e8eef7", stroke:"#5b6b85", text:"#1a2233", w:1.4},
  green  : {fill:"#d7f3e3", stroke:"#2e9e63", text:"#0f3d27", w:2},
  orange : {fill:"#ffe9cc", stroke:"#e08a2b", text:"#5a3408", w:2},
  pink   : {fill:"#ffd6e7", stroke:"#d6256e", text:"#5e0f33", w:2.6},
  teal   : {fill:"#cfeeee", stroke:"#1f8a8a", text:"#0c3636", w:2},
  purple : {fill:"#e6dcff", stroke:"#7a4fd6", text:"#2c1860", w:2},
  blue   : {fill:"#dce9ff", stroke:"#2f6fdb", text:"#0e2c5e", w:2},
  amber  : {fill:"#fff3c4", stroke:"#cf9b06", text:"#5c4204", w:2},
  na     : {fill:"#f3f4f6", stroke:"#aab4c4", text:"#8892a6", w:1.4, dash:"5 4"},
};
/* default edge-class palette */
const EDGE_CLASS_DEFAULT = {
  flow  : {color:"#5b6b85", w:1.3},
  pink  : {color:"#d6256e", w:1.7},
  orange: {color:"#e08a2b", w:1.5},
  green : {color:"#2e9e63", w:1.4},
  teal  : {color:"#1f8a8a", w:1.4},
  purple: {color:"#7a4fd6", w:1.6},
  blue  : {color:"#2f6fdb", w:1.4},
  infra : {color:"#9aa3b5", w:1.2, dot:true},
};
/* default band-tint palette (soft panel background for "bands" layers, echoes NODE_CLASS_DEFAULT hues).
 * A layer with no `tint` field keeps the neutral background below (backward compatible). */
const BAND_TINT_DEFAULT = {
  common: {fill:"#f4f6fa", stroke:"#c9d2e3"},
  green : {fill:"#eafaf1", stroke:"#bfe8d4"},
  orange: {fill:"#fff6ea", stroke:"#f3daac"},
  pink  : {fill:"#fff0f6", stroke:"#f3c3da"},
  teal  : {fill:"#eafbfb", stroke:"#bfe6e6"},
  purple: {fill:"#f5f1ff", stroke:"#dccdf7"},
  blue  : {fill:"#eef4ff", stroke:"#c7d9f7"},
  amber : {fill:"#fffaf0", stroke:"#f0e0a0"},
};

const FONT = "'Segoe UI','Microsoft YaHei',system-ui,Arial,sans-serif";
const G = {
  OUTER:30, TITLE_H:44, GUTTER:58, BAND_GAP:74, FLOW_GAP:58,
  BAND_LABEL_H:26, BAND_PAD:18, NODE_H:56, NODE_GAP:30,
  NPADX:18, LINEH:18, FS:13.5, MINW:118,
};

/* text measurement (hidden canvas) so boxes hug their text */
const _mc = document.createElement("canvas").getContext("2d");
_mc.font = `${G.FS}px ${FONT}`;
const lineW = s => _mc.measureText(s).width;
function nodeWidth(label){
  const lines = String(label).split("\n");
  return Math.max(G.MINW, Math.round(Math.max(...lines.map(lineW)) + 2*G.NPADX));
}

/* ---- turn any spec into a uniform {rows:[[nodeSpec...]], labels:[], drawBands} ---- */
function toRows(spec){
  const mode = spec.layout || (spec.layers ? "bands" : "flow");
  if(mode === "bands"){
    return {rows: spec.layers.map(L=>L.nodes), labels: spec.layers.map(L=>L.label||""),
            tints: spec.layers.map(L=>L.tint), drawBands:true, gap:G.BAND_GAP};
  }
  if(mode === "free"){
    // nodes carry {row,col}; bin by row, order by col
    const byRow = {};
    spec.nodes.forEach(n=>{ (byRow[n.row||0]=byRow[n.row||0]||[]).push(n); });
    const rows = Object.keys(byRow).map(Number).sort((a,b)=>a-b)
      .map(r=>byRow[r].slice().sort((a,b)=>(a.col||0)-(b.col||0)));
    return {rows, labels:rows.map(()=> ""), drawBands:false, gap:G.FLOW_GAP};
  }
  // flow: longest-path ranking over forward edges
  const nodes = spec.nodes, idset = new Set(nodes.map(n=>n.id));
  const rank = {}; nodes.forEach(n=> rank[n.id]= n.rank!=null ? n.rank : 0);
  // dashed edges are treated as feedback/back-edges and do NOT influence ranking
  const edges = (spec.edges||[]).filter(e=>idset.has(e.f)&&idset.has(e.t)&&!e.d);
  for(let pass=0; pass<nodes.length; pass++){
    let changed=false;
    for(const e of edges){ if(rank[e.t] < rank[e.f]+1){ rank[e.t]=rank[e.f]+1; changed=true; } }
    if(!changed) break;
  }
  const byRank = {};
  nodes.forEach(n=>{ (byRank[rank[n.id]]=byRank[rank[n.id]]||[]).push(n); });
  const rows = Object.keys(byRank).map(Number).sort((a,b)=>a-b).map(r=>byRank[r]);
  return {rows, labels:rows.map(()=> ""), drawBands:false, gap:G.FLOW_GAP};
}

/* ---- layout: assign geometry to every node + band rects ---- */
function layout(spec){
  const {rows, labels, tints, drawBands, gap} = toRows(spec);
  const N = {};
  const info = rows.map(rs=>{
    const widths = rs.map(n=>nodeWidth(n.t));
    const total = widths.reduce((a,b)=>a+b,0) + (rs.length-1)*G.NODE_GAP;
    return {rs, widths, total};
  });
  const maxTotal = Math.max(1, ...info.map(li=>li.total));
  const bandW = maxTotal + 2*G.BAND_PAD;
  const bandX = G.OUTER + G.GUTTER;
  const W = bandX + bandW + G.GUTTER + G.OUTER;
  const labelH = drawBands ? G.BAND_LABEL_H : 0;
  const bandH = labelH + G.BAND_PAD + G.NODE_H + G.BAND_PAD;

  let y = G.OUTER + G.TITLE_H, bands = [];
  info.forEach((li,i)=>{
    const band = {x:bandX, y, w:bandW, h:bandH, label:labels[i], tint: tints && tints[i], draw:drawBands, top:y, bottom:y+bandH};
    let cx = bandX + (bandW - li.total)/2;
    const nodeY = y + labelH + G.BAND_PAD, cy = nodeY + G.NODE_H/2;
    li.rs.forEach((n,k)=>{
      const w = li.widths[k];
      N[n.id] = {id:n.id,t:n.t,c:n.c||"common",x:cx,y:nodeY,w,h:G.NODE_H,
                 cx:cx+w/2,cy,layer:i,order:k,left:cx,right:cx+w,topY:nodeY,botY:nodeY+G.NODE_H};
      cx += w + G.NODE_GAP;
    });
    bands.push(band); y += bandH + gap;
  });
  return {N, bands, W, H:y-gap+G.OUTER+10, bandX, bandW};
}

/* ---- orthogonal router (lane-separated; works for all modes) ---- */
function routeEdges(spec, lay){
  const {N, bands, bandX, bandW} = lay, paths=[];
  const gapLane={}, dipLane={}; let rGut=0, lGut=0;
  const rGutX0 = bandX+bandW+16, lGutX0 = bandX-16;
  for(const e of (spec.edges||[])){
    const a=N[e.f], b=N[e.t]; if(!a||!b) continue;
    const dir = b.layer-a.layer; let pts;
    if(dir===0){
      if(Math.abs(a.order-b.order)===1){
        pts = a.order<b.order ? [[a.right,a.cy],[b.left,b.cy]] : [[a.left,a.cy],[b.right,b.cy]];
      } else {
        const gi=a.layer; dipLane[gi]=(dipLane[gi]||0)+1;
        const yL=bands[gi].bottom+18+dipLane[gi]*9;
        pts=[[a.cx,a.botY],[a.cx,yL],[b.cx,yL],[b.cx,b.botY]];
      }
    } else if(dir===1){
      const gi=a.layer; gapLane[gi]=(gapLane[gi]||0)+1;
      const yL=bands[gi].bottom+14+gapLane[gi]*9;
      pts = Math.abs(a.cx-b.cx)<1 ? [[a.cx,a.botY],[b.cx,b.topY]]
                                  : [[a.cx,a.botY],[a.cx,yL],[b.cx,yL],[b.cx,b.topY]];
    } else {
      const goRight = (a.cx+b.cx)/2 >= (bandX+bandW/2);
      let gx; if(goRight){rGut++;gx=rGutX0+rGut*11;} else {lGut++;gx=lGutX0-lGut*11;}
      const aX=goRight?a.right:a.left, bX=goRight?b.right:b.left;
      pts=[[aX,a.cy],[gx,a.cy],[gx,b.cy],[bX,b.cy]];
    }
    paths.push({pts, cls:e.c||"flow", d:!!e.d});
  }
  return paths;
}

/* ---- SVG builders ---- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const polyPath = pts => "M "+pts.map(p=>`${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" L ");

function nodeSVG(n, NC){
  const cl = NC[n.c] || NC.common;
  const lines = String(n.t).split("\n");
  const y0 = n.cy - (lines.length-1)*G.LINEH/2 + G.FS*0.34;
  const ts = lines.map((ln,i)=>`<tspan x="${n.cx}" y="${(y0+i*G.LINEH).toFixed(1)}">${esc(ln)}</tspan>`).join("");
  const dash = cl.dash?`stroke-dasharray="${cl.dash}"`:"";
  return `<g><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="9" ry="9"
    fill="${cl.fill}" stroke="${cl.stroke}" stroke-width="${cl.w}" ${dash}/>
    <text text-anchor="middle" font-size="${G.FS}" font-weight="600" fill="${cl.text}" font-family="${FONT}">${ts}</text></g>`;
}
function bandSVG(b, BT){
  if(!b.draw) return "";
  const t = (b.tint && BT[b.tint]) || {fill:"#fbfcfe", stroke:"#c9d2e3"};
  return `<g><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="12" ry="12"
    fill="${t.fill}" stroke="${t.stroke}" stroke-width="1.2"/>
    <text x="${b.x+16}" y="${b.y+17}" font-size="13" font-weight="600" fill="#7c89a3" font-family="${FONT}">${esc(b.label)}</text></g>`;
}
function markers(EC){
  return Object.entries(EC).map(([k,v])=>
    `<marker id="arw-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="${v.color}"/></marker>`).join("");
}
function legendSVG(spec, lay, NC, EC){
  const items = spec.legend||[]; if(!items.length) return "";
  const lw=258, lx=lay.W-G.OUTER-lw, ly=lay.H-10-(items.length*22+30);
  let rows=`<text x="${lx+10}" y="${ly+18}" font-size="12.5" font-weight="700" fill="#33405c">Legend</text>`;
  items.forEach((it,i)=>{
    const yy=ly+30+i*22; let sw;
    if(it.node){ const cl=NC[it.node]||NC.common; const d=cl.dash?`stroke-dasharray="${cl.dash}"`:"";
      sw=`<rect x="${lx+10}" y="${yy}" width="22" height="14" rx="3" fill="${cl.fill}" stroke="${cl.stroke}" stroke-width="${cl.w}" ${d}/>`;
    } else { const cl=EC[it.edge]||EC.flow; const d=it.d?`stroke-dasharray="6 5"`:(cl.dot?`stroke-dasharray="1.5 4"`:"");
      sw=`<line x1="${lx+10}" y1="${yy+7}" x2="${lx+32}" y2="${yy+7}" stroke="${cl.color}" stroke-width="${cl.w+0.6}" ${d}/>`; }
    rows+=sw+`<text x="${lx+40}" y="${yy+11}" font-size="11.5" fill="#44506a">${esc(it.label)}</text>`;
  });
  return `<g><rect x="${lx}" y="${ly}" width="${lw}" height="${items.length*22+30}" rx="8" fill="#fff" stroke="#c9d2e3" stroke-width="1"/>${rows}</g>`;
}

function buildSVG(spec){
  const NC = Object.assign({}, NODE_CLASS_DEFAULT, spec.classes||{});
  const EC = Object.assign({}, EDGE_CLASS_DEFAULT, spec.edgeClasses||{});
  const BT = Object.assign({}, BAND_TINT_DEFAULT, spec.bandTints||{});
  const lay = layout(spec);
  const edges = routeEdges(spec, lay).map(e=>{
    const cl = EC[e.cls]||EC.flow;
    const dash = e.d?`stroke-dasharray="6 5"`:(cl.dot?`stroke-dasharray="1.5 4"`:"");
    return `<path d="${polyPath(e.pts)}" fill="none" stroke="${cl.color}" stroke-width="${cl.w}" ${dash}
      marker-end="url(#arw-${e.cls})" stroke-linejoin="round"/>`;
  }).join("\n");
  const nodeS = Object.values(lay.N).map(n=>nodeSVG(n,NC)).join("\n");
  const bandS = lay.bands.map(b=>bandSVG(b,BT)).join("\n");
  const title = spec.title ? `<text x="${lay.W/2}" y="${G.OUTER+8}" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2233" font-family="${FONT}">${esc(spec.title)}</text>` : "";
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${lay.W}" height="${lay.H}" viewBox="0 0 ${lay.W} ${lay.H}">
    <defs>${markers(EC)}</defs>${title}${bandS}${edges}${nodeS}${legendSVG(spec,lay,NC,EC)}</svg>`;
}

// ===================== DIAGRAM SPEC START =====================
const PAGE_TITLE = "LectureDoc v1 — Schema 架构";
const DIAGRAMS = {
  main: {
    title: "LectureDoc v1：Deck → Scene → Block（含 freeform 逃生舱）",
    layout: "bands",
    layers: [
      { label: "Deck 级 · 一门课的元信息与横切能力", tint: "blue", nodes: [
        { id: "DECK",  t: "📄 LectureDoc\nid·title·language·theme", c: "blue" },
        { id: "TUTOR", t: "🤖 tutor\nsuggestions[] + kb[]", c: "blue" },
      ]},
      { label: "Scene · 页（4 种 kind，决定页框架）", tint: "purple", nodes: [
        { id: "SK_HERO",      t: "🎬 hero\n封面/收尾", c: "purple" },
        { id: "SK_CONTENT",   t: "📃 content\n常规内容页", c: "purple" },
        { id: "SK_QUIZ",      t: "❓ quiz(页)\n测验页", c: "purple" },
        { id: "SK_STATEMENT", t: "💬 statement\n全课大字陈述", c: "purple" },
      ]},
      { label: "Block · 内容类（10 种，纯展示，无运行时逻辑）", tint: "green", nodes: [
        { id: "B_HERO",      t: "🎬 hero", c: "green" },
        { id: "B_STATEMENT", t: "💬 statement", c: "green" },
        { id: "B_LIST",      t: "🔢 list\n编号要点", c: "green" },
        { id: "B_AGENDA",    t: "📋 agenda\n等高编号行", c: "green" },
        { id: "B_CALLOUT",   t: "💡 callout\n顶线小结", c: "green" },
        { id: "B_FORMULA",   t: "∑ formula\nLaTeX 展示公式", c: "green" },
        { id: "B_FLOW",      t: "➡️ flow\n流程节点图", c: "green" },
        { id: "B_TABLE",     t: "📊 table\nledger 表格", c: "green" },
        { id: "B_CODE",      t: "💻 code\n静态代码卡", c: "green" },
        { id: "B_COMPARE",   t: "⚖️ compare\n两栏对照", c: "green" },
      ]},
      { label: "Block · 交互类（4 种，含运行时/沙箱逻辑）", tint: "teal", nodes: [
        { id: "B_QUIZ",     t: "❓ quiz\nobjective / subjective", c: "teal" },
        { id: "B_SIM",      t: "🎛️ sim\ndynamics1d / searchCompare\n+ custom ⚠", c: "teal" },
        { id: "B_RUNNABLE", t: "▶️ runnable\npython + js · Pyodide", c: "teal" },
        { id: "B_EMBED",    t: "🔌 embed\n保留位 ⚠ 后端三产品", c: "teal" },
      ]},
      { label: "逃生舱 · freeform（第 15 种，稀有出口 + 净化流程）", tint: "amber", nodes: [
        { id: "FREEFORM", t: "🚨 freeform\n最后手段 + rationale", c: "pink" },
        { id: "GATE1",    t: "✅ validate.mjs\n静态危险标签检查", c: "amber" },
        { id: "GATE2",    t: "🧼 运行时净化\nsanitizeFreeformHtml", c: "amber" },
        { id: "RENDER",   t: "🚩 显眼渲染\n虚线框+⚠标签+rationale", c: "amber" },
      ]},
    ],
    edges: [
      { f: "DECK", t: "TUTOR", c: "infra", d: true },
      { f: "DECK", t: "SK_HERO", c: "flow" },
      { f: "DECK", t: "SK_CONTENT", c: "flow" },
      { f: "DECK", t: "SK_QUIZ", c: "flow" },
      { f: "DECK", t: "SK_STATEMENT", c: "flow" },

      { f: "SK_HERO", t: "B_HERO", c: "purple" },
      { f: "SK_STATEMENT", t: "B_STATEMENT", c: "purple" },
      { f: "SK_QUIZ", t: "B_QUIZ", c: "purple" },
      { f: "SK_CONTENT", t: "B_LIST", c: "purple", d: true },
      { f: "SK_CONTENT", t: "B_SIM", c: "purple", d: true },
      { f: "SK_CONTENT", t: "B_RUNNABLE", c: "purple", d: true },

      { f: "B_SIM", t: "FREEFORM", c: "amber", d: true },
      { f: "B_EMBED", t: "FREEFORM", c: "amber", d: true },

      { f: "FREEFORM", t: "GATE1", c: "flow" },
      { f: "GATE1", t: "GATE2", c: "flow" },
      { f: "GATE2", t: "RENDER", c: "flow" },
    ],
    legend: [
      { node: "blue",   label: "Deck 级字段（整门课元信息 + 横切能力）" },
      { node: "purple", label: "Scene 种类（页框架，4 种 kind）" },
      { node: "green",  label: "Block · 内容类（10 种，纯展示）" },
      { node: "teal",   label: "Block · 交互类（4 种，含运行时/沙箱逻辑）" },
      { node: "pink",   label: "🚨 freeform 逃生舱（第 15 种，永远显眼渲染，绝不悄悄融入排版）" },
      { node: "amber",  label: "freeform 的两道净化关 + 强制渲染样式" },
      { edge: "flow",   label: "包含 / 派生关系" },
      { edge: "purple", label: "scene → 必含或可组合的 block 类型" },
      { edge: "amber",  label: "同属\"灵活出口\"家族（sim.custom、embed 与 freeform 呼应）", d: true },
      { edge: "infra",  label: "deck 级横切能力（每页可唤起）", d: true },
    ],
  },
};
const ORDER = Object.keys(DIAGRAMS);
// ===================== DIAGRAM SPEC END =====================

/* ============================================================================
 *  UI (event-driven; render once per tab switch — no animation loop)
 * ==========================================================================*/
document.getElementById("ttl").textContent = PAGE_TITLE;
document.title = PAGE_TITLE;
let current = ORDER[0];
const stage=document.getElementById("stage"), tabsEl=document.getElementById("tabs");
const render = () => { stage.innerHTML = buildSVG(DIAGRAMS[current]); };
if(ORDER.length>1){
  ORDER.forEach(k=>{
    const b=document.createElement("button");
    b.className="tab"+(k===current?" on":""); b.textContent=k;
    b.onclick=()=>{ current=k; [...tabsEl.children].forEach(c=>c.classList.toggle("on",c===b)); render(); };
    tabsEl.appendChild(b);
  });
}
document.getElementById("dl").onclick=()=>{
  const blob=new Blob([buildSVG(DIAGRAMS[current])],{type:"image/svg+xml"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`diagram_${current}.svg`; a.click(); URL.revokeObjectURL(a.href);
};
render();
</script>
</body>
</html>
