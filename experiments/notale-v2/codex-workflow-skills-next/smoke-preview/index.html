<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Workflow Skills Smoke Preview</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #15171a; color: #f1f2f4; }
    header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 18px 28px; background: rgba(21,23,26,.94); border-bottom: 1px solid #35383e; backdrop-filter: blur(12px); }
    h1 { margin: 0; font-size: 20px; font-weight: 650; }
    nav { display: flex; gap: 8px; flex-wrap: wrap; }
    button { padding: 8px 13px; border: 1px solid #484c54; border-radius: 6px; background: #22252a; color: inherit; cursor: pointer; }
    button[aria-selected="true"] { border-color: #d9dde5; background: #f1f2f4; color: #15171a; }
    main { padding: 24px 28px 40px; }
    .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 18px; margin: 0 auto 12px; max-width: 1600px; }
    h2 { margin: 0; font-size: 17px; }
    a { color: #bfc7d6; font-size: 13px; }
    .frame { max-width: 1600px; margin: auto; background: white; box-shadow: 0 18px 55px rgba(0,0,0,.32); }
    iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; }
    @media (max-width: 760px) { header { align-items: flex-start; flex-direction: column; } main { padding: 18px 12px; } .meta { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <header>
    <h1>Workflow Skills Smoke</h1>
    <nav aria-label="实验结果">
      <button type="button" data-result="cover" aria-selected="true">标题页</button>
      <button type="button" data-result="chart" aria-selected="false">内容页 · Chart</button>
      <button type="button" data-result="interaction" aria-selected="false">交互页</button>
    </nav>
  </header>
  <main>
    <div class="meta">
      <h2 id="title">传染病在接触网络中的传播</h2>
      <a id="open" target="_blank" rel="noopener">在新窗口打开 1600×900 页面</a>
    </div>
    <div class="frame"><iframe id="preview" title="实验页面"></iframe></div>
  </main>
  <script>
    const results = {
      cover: {
        title: "传染病在接触网络中的传播",
        path: "../.runs/cover-page-smoke-20260831-v2/repeat-01/cover-generative-epidemic/arms/full/pages/page-01.html"
      },
      chart: {
        title: "基本再生数与群体免疫阈值",
        path: "../.runs/cover-page-smoke-20260831-v2/repeat-01/page-chart-epidemic-threshold/arms/full/pages/page-08.html"
      },
      interaction: {
        title: "免疫者如何截断传播链？",
        path: "../.runs/interaction-smoke-20260831-v2/repeat-01/interaction-general-immunity/arms/full/pages/page-14.html"
      }
    };
    const frame = document.querySelector("#preview");
    const title = document.querySelector("#title");
    const open = document.querySelector("#open");
    function select(id) {
      const result = results[id];
      title.textContent = result.title;
      frame.src = result.path;
      open.href = result.path;
      document.querySelectorAll("[data-result]").forEach(button => {
        button.setAttribute("aria-selected", String(button.dataset.result === id));
      });
      history.replaceState(null, "", `#${id}`);
    }
    document.querySelector("nav").addEventListener("click", event => {
      const button = event.target.closest("[data-result]");
      if (button) select(button.dataset.result);
    });
    select(results[location.hash.slice(1)] ? location.hash.slice(1) : "cover");
  </script>
</body>
</html>
