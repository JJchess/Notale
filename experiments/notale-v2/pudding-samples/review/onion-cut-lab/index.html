<main><header><a href="../../">← 备选库</a><span>THE PUDDING / SOURCE STUDY 06</span><a href="https://pudding.cool/2025/08/onions/" target="_blank" rel="noreferrer">原作 ↗</a></header><section class="intro"><div><div class="letters" aria-label="ONION"><img src="assets/O.png" alt=""><img src="assets/N.png" alt=""><img src="assets/I.png" alt=""><img src="assets/O.png" alt=""><img src="assets/N.png" alt=""></div><h1>刀尖向下，切得更均匀？</h1></div><p>一颗洋葱，四种切法。调整刀线的汇聚点，再把碎块散开，看看大小差异。<small>原作的二维剖面模型 · 用面积比较，不代表真实体积</small></p></section>
