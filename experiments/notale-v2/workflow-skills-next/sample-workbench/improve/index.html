<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sample Improvement Review</title>
  <style>
    :root{font-family:Arial,"Noto Sans SC",sans-serif;color:#171714;background:#e9e7df}
    *{box-sizing:border-box}body{margin:0}.bar{height:64px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid #171714;background:#f4f2eb}.bar h1{margin:0 auto 0 0;font-size:18px}.bar select,.bar a{height:34px;border:1px solid #171714;border-radius:0;background:#fff;color:inherit;padding:0 11px;font:13px/32px inherit;text-decoration:none}.metric{min-width:180px;font:12px/1.35 ui-monospace,monospace;color:#55554e}.pair{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#171714;height:calc(100vh - 64px)}.pane{min-width:0;background:#d7d5cd;display:grid;grid-template-rows:38px 1fr}.head{display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#f4f2eb;font:12px/1 ui-monospace,monospace}.head a{color:inherit}.viewport{position:relative;overflow:hidden}.viewport iframe{position:absolute;left:50%;top:50%;width:1600px;height:900px;border:0;background:#fff;transform-origin:50% 50%}
    @media(max-width:900px){.bar{height:auto;min-height:64px;flex-wrap:wrap;padding:12px}.bar h1{width:100%}.metric{margin-left:auto}.pair{grid-template-columns:1fr;height:auto}.pane{height:calc(50vh - 20px)}}
  </style>
</head>
<body>
  <header class="bar">
    <h1>完整 Sample 无损优化</h1>
    <label for="sample">样本</label>
    <select id="sample"></select>
    <span class="metric" id="metric">等待候选报告</span>
    <a href="../../">返回 archive</a>
  </header>
  <main class="pair">
    <section class="pane">
      <div class="head"><strong>BASELINE</strong><a id="openBaseline" target="_blank">单独打开</a></div>
      <div class="viewport"><iframe id="baseline" title="Baseline sample"></iframe></div>
    </section>
    <section class="pane">
      <div class="head"><strong>CANDIDATE</strong><a id="openCandidate" target="_blank">单独打开</a></div>
      <div class="viewport"><iframe id="candidate" title="Candidate sample"></iframe></div>
    </section>
  </main>
  <script>
    const samples = [
      ['climate-zones-title','cover-composition/climate-zones-title','../../build-cover/samples/composition/climate-zones-title/pages/'],
      ['prism-light','cover-composition/prism-light','../../build-cover/samples/composition/prism-light/pages/'],
      ['grid-to-preview','cover-composition/grid-to-preview','../../build-cover/samples/composition/grid-to-preview/pages/'],
      ['lawn-path','interaction-general/lawn-path','../../build-interaction/samples/general/lawn-path/pages/'],
      ['gimbal','page-3d/gimbal','../../build-page/samples/3d/gimbal/pages/'],
      ['magnetic-field','cover-generative/magnetic-field','../../build-cover/samples/generative/magnetic-field/pages/'],
      ['mycelium-growth','cover-generative/mycelium-growth','../../build-cover/samples/generative/mycelium-growth/pages/'],
      ['lenna-pixel-field','cover-generative/lenna-pixel-field','../../build-cover/samples/generative/lenna-pixel-field/pages/'],
      ['neural-signal-network','cover-generative/neural-signal-network','../../build-cover/samples/generative/neural-signal-network/pages/'],
      ['tactile-grid','cover-generative/tactile-grid','../../build-cover/samples/generative/tactile-grid/pages/'],
      ['telescope-zoom','cover-motion/telescope-zoom','../../build-cover/samples/motion/telescope-zoom/pages/'],
      ['future-climate-analogy','interaction-general/future-climate-analogy','../../build-interaction/samples/general/future-climate-analogy/pages/'],
      ['motif-match','interaction-general/motif-match','../../build-interaction/samples/general/motif-match/pages/'],
      ['lenna-image-lineage','page-general/lenna-image-lineage','../../build-page/samples/general/lenna-image-lineage/output/pages/'],
      ['population-mountains','page-3d/population-mountains','../../build-page/samples/3d/population-mountains/pages/'],
      ['lenna-scroll-bars','page-chart/lenna-scroll-bars','../../build-page/samples/chart/lenna-scroll-bars/pages/'],
      ['neuron-to-formula','page-general/neuron-to-formula','../../build-page/samples/general/neuron-to-formula/pages/'],
      ['climate-zone-shift-map','page-chart/climate-zone-shift-map','../../build-page/samples/chart/climate-zone-shift-map/pages/'],
      ['solar-storage','page-chart/solar-storage','../../build-page/samples/chart/solar-storage/pages/'],
      ['pollinator-network','page-chart/pollinator-network','../../build-page/samples/chart/pollinator-network/pages/'],
      ['swarm-spectrum','page-chart/swarm-spectrum','../../build-page/samples/chart/swarm-spectrum/pages/'],
      ['escapement','page-general/escapement','../../build-page/samples/general/escapement/pages/'],
      ['rain-paths','page-general/rain-paths','../../build-page/samples/general/rain-paths/pages/']
    ];
    const select = document.querySelector('#sample');
    for (const [name] of samples) select.add(new Option(name,name));
    function fit(){
      document.querySelectorAll('.viewport').forEach(box=>{
        const frame=box.querySelector('iframe');
        frame.style.transform=`translate(-50%,-50%) scale(${Math.min(box.clientWidth/1600,box.clientHeight/900)})`;
      });
    }
    async function show(name){
      const [,path,baseline]=samples.find(([id])=>id===name);
      const candidate=`${path}/candidate/pages/`;
      document.querySelector('#baseline').src=baseline;
      document.querySelector('#candidate').src=candidate;
      document.querySelector('#openBaseline').href=baseline;
      document.querySelector('#openCandidate').href=candidate;
      history.replaceState(null,'',`#${name}`);
      const metric=document.querySelector('#metric');
      metric.textContent='等待候选报告';
      try{
        const report=await fetch(`${path}/report.json?${Date.now()}`).then(r=>{if(!r.ok)throw Error();return r.json()});
        const files=report.author_files || [];
        const total=(side)=>files.reduce((sum,file)=>sum + (file[`${side}_chars`] ?? file[side]?.chars ?? 0),0);
        const before=report.formal_current?.total_chars ?? report.author_layer?.formal_current_chars ?? report.cross_audit?.formal_at_audit_start?.chars ?? report.chars?.before ?? report.size?.before_chars ?? report.author_layer?.before_chars ?? report.author_layer?.before?.chars ?? report.author_layer?.before?.total_chars ?? report.author_layer?.baseline?.total_chars ?? report.before_chars ?? (files.length ? total('before') || total('baseline') : undefined);
        const after=report.chars?.after ?? report.size?.after_chars ?? report.author_layer?.after_chars ?? report.author_layer?.candidate_chars ?? report.author_layer?.after?.chars ?? report.author_layer?.after?.total_chars ?? report.author_layer?.candidate?.total_chars ?? report.after_chars ?? (files.length ? total('after') || total('candidate') : undefined);
        metric.textContent=Number.isFinite(before)&&Number.isFinite(after)
          ? `${before.toLocaleString()} -> ${after.toLocaleString()} chars (${Math.round((after/before-1)*100)}%)`
          : (report.status || '报告已生成');
      }catch{}
    }
    select.addEventListener('change',()=>show(select.value));
    new ResizeObserver(fit).observe(document.querySelector('.pair'));
    const requested=location.hash.slice(1);
    select.value=samples.some(([id])=>id===requested)?requested:samples[0][0];
    show(select.value); fit();
  </script>
</body>
</html>
