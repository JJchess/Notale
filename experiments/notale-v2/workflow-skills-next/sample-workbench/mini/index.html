<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mini Sample Archive</title>
  <style>
    :root{font-family:Arial,"Noto Sans SC",sans-serif;color:#171714;background:#e9e7df}
    *{box-sizing:border-box}body{margin:0}.bar{min-height:64px;display:flex;align-items:center;gap:14px;padding:10px 22px;border-bottom:1px solid #171714;background:#f4f2eb}.bar h1{margin:0 auto 0 0;font-size:18px}.bar select,.bar a{height:34px;border:1px solid #171714;border-radius:0;background:#fff;color:inherit;padding:0 10px;font:13px/32px inherit;text-decoration:none}.metric{min-width:245px;font:12px/1.4 ui-monospace,monospace;color:#55554e}.metric[data-state="pass"]{color:#17613d}.metric[data-state="fail"]{color:#a11f18}.pair{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#171714;height:calc(100vh - 64px)}.pane{min-width:0;background:#d7d5cd;display:grid;grid-template-rows:38px 1fr}.head{display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#f4f2eb;font:12px/1 ui-monospace,monospace}.head a{color:inherit}.viewport{position:relative;overflow:hidden}.viewport iframe{position:absolute;left:50%;top:50%;width:1600px;height:900px;border:0;background:#fff;transform-origin:50% 50%}.pending{position:absolute;inset:0;display:grid;place-items:center;background:#e9e7df;color:#66665e;font:13px/1.5 ui-monospace,monospace;z-index:1}.pending[hidden]{display:none}
    @media(max-width:900px){.bar{align-items:flex-start;flex-wrap:wrap}.bar h1{width:100%}.metric{margin-left:auto}.pair{grid-template-columns:1fr;height:auto}.pane{height:calc(50vh - 20px)}}
  </style>
</head>
<body>
  <header class="bar">
    <h1>Mini Sample Archive</h1>
    <label for="sample">样本</label>
    <select id="sample"></select>
    <span class="metric" id="metric">读取 manifest</span>
    <a href="../../">返回 archive</a>
  </header>
  <main class="pair">
    <section class="pane">
      <div class="head"><strong>FULL</strong><a id="openFull" target="_blank">单独打开</a></div>
      <div class="viewport"><iframe id="full" title="Full sample"></iframe></div>
    </section>
    <section class="pane">
      <div class="head"><strong>MINI ARCHIVE</strong><a id="openMini" target="_blank">单独打开</a></div>
      <div class="viewport"><div class="pending" id="pending">归档版本不可用</div><iframe id="mini" title="Archived mini sample"></iframe></div>
    </section>
  </main>
  <script>
    const select=document.querySelector('#sample');
    const metric=document.querySelector('#metric');
    const pending=document.querySelector('#pending');
    let samples=[];

    function fit(){
      document.querySelectorAll('.viewport iframe').forEach(frame=>{
        const box=frame.parentElement;
        frame.style.transform=`translate(-50%,-50%) scale(${Math.min(box.clientWidth/1600,box.clientHeight/900)})`;
      });
    }

    async function show(key){
      const sample=samples.find(item=>item.key===key);
      const full=sample.full;
      const mini=sample.mini;
      document.querySelector('#full').src=full;
      document.querySelector('#openFull').href=full;
      document.querySelector('#openMini').href=mini;
      document.querySelector('#mini').src='about:blank';
      pending.hidden=false;
      metric.dataset.state='';
      metric.textContent=`${sample.full_chars.toLocaleString()} → pending · target <10,000`;
      history.replaceState(null,'',`#${key}`);
      try{
        const report=await fetch(`${sample.key}/report.json?${Date.now()}`).then(response=>{
          if(!response.ok) throw Error('pending');
          return response.json();
        });
        const miniChars=report.mini_chars;
        const passed=Number.isInteger(miniChars)&&miniChars<10000&&!report.checks?.some(check=>check.status==='fail');
        const audited=report.cross_audit?.status==='pass';
        metric.dataset.state=passed?'pass':'fail';
        metric.textContent=`${sample.full_chars.toLocaleString()} → ${Number(miniChars).toLocaleString()} chars · ${passed?'archived':'archive invalid'} · ${audited?'cross-audit pass':'audit pending'}`;
        pending.hidden=true;
        document.querySelector('#mini').src=mini;
      }catch{}
      fit();
    }

    async function init(){
      const manifest=await fetch(`manifest.json?${Date.now()}`).then(response=>response.json());
      samples=manifest.samples.filter(sample=>sample.decision==='required'&&sample.status==='promoted');
      for(const sample of samples) select.add(new Option(sample.key,sample.key));
      const requested=decodeURIComponent(location.hash.slice(1));
      select.value=samples.some(sample=>sample.key===requested)?requested:samples[0].key;
      select.addEventListener('change',()=>show(select.value));
      new ResizeObserver(fit).observe(document.querySelector('.pair'));
      show(select.value);
    }
    init();
  </script>
</body>
</html>
