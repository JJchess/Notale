<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>你能装得像随机吗？</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/lab.css">
</head>
<body>
<main id="stage">
  <header class="top">
    <div><h1>你能装得像随机吗？</h1><p>凭感觉排出 12 次硬币结果，让它看起来像真的抛掷。</p></div>
    <button id="reset" type="button">清空全部</button>
  </header>

  <section class="bench" aria-labelledby="question">
    <div class="bench-head"><h2 id="question">构造你的序列</h2><output id="count" aria-live="polite">还差 12 次</output></div>
    <div class="work">
      <div class="rail min0">
        <ol id="slots" class="slots" aria-label="你的十二次硬币序列"></ol>
        <div id="phrases" class="phrases" aria-label="增量 LZ 短语划分"></div>
        <p id="previous" class="previous" hidden></p>
      </div>
      <div class="controls" aria-label="输入硬币结果">
        <button class="coin head" data-bit="1" type="button" aria-label="输入正面，快捷键 H"><b>正</b><kbd>H</kbd></button>
        <button class="coin tail" data-bit="0" type="button" aria-label="输入反面，快捷键 T"><b>反</b><kbd>T</kbd></button>
        <button id="undo" class="minor" type="button">撤回一次</button>
        <button id="retry" type="button" hidden>再试一次</button>
      </div>
    </div>
    <i id="scanner" aria-hidden="true"></i>
  </section>

  <section class="evidence" aria-label="复杂度证据">
    <article class="reading min0">
      <div class="scoreline" aria-live="polite"><span>近似复杂度</span><strong id="score">等待序列</strong><small id="delta"></small></div>
      <dl class="features">
        <div><dt>LZ 短语</dt><dd><i><b id="lzbar"></b></i><span id="lz">待计算</span></dd></div>
        <div><dt>二/三位块</dt><dd><i><b id="blockbar"></b></i><span id="blocks">待计算</span></dd></div>
        <div><dt>换面与重复</dt><dd><i><b id="structurebar"></b></i><span id="structure">待计算</span></dd></div>
      </dl>
      <p id="meaning" class="meaning">公平硬币允许连续出现相同面。输入后，轨道会显示可复用的短语；第 12 次结束时再与两套基准比较。</p>
      <p class="method"><b>这是近似复杂度，不是原作 CTM/acss 分数。</b> 它综合 LZ 短语、二/三位块多样性和重复结构；高分表示更难压缩，不能证明序列真的来自硬币。</p>
    </article>

    <figure class="compare min0">
      <figcaption><b>同一把尺，两套基准</b></figcaption>
      <p class="compare-note">橙线标记本轮，虚线保留上一轮。</p>
      <div class="plot-row">
        <div class="plot-label"><strong>公平硬币</strong><b id="theory-pos">等待标记</b><small id="theory-meta"></small></div>
        <svg id="theory-chart" viewBox="0 0 760 118" role="img"></svg>
      </div>
      <div class="plot-row">
        <div class="plot-label"><strong>人类作答</strong><b id="human-pos">等待标记</b><small id="human-meta"></small></div>
        <svg id="human-chart" viewBox="0 0 760 118" role="img"></svg>
      </div>
    </figure>
  </section>

  <noscript>此离线实验需要启用 JavaScript 才能计算序列。</noscript>
</main>
<script src="assets/base.js"></script>
<script src="assets/model.js"></script>
<script src="assets/human-data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
