<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>100 集里的 206 次删减</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" tabindex="0" aria-label="前 100 集删减片段时间线">
    <figure aria-labelledby="chart-title chart-caption">
      <figcaption id="chart-caption" class="sr-only" aria-live="polite"></figcaption>
      <h1 id="chart-title" class="sr-only">前 100 集删减片段时间线</h1>
      <div id="plot" class="plot" aria-hidden="true">
        <span class="time start">0 分钟</span><span class="time end">21 分钟</span>
        <span class="episode first">第 1 集</span><span class="episode last">第 100 集</span>
        <div id="rows" class="rows"></div><div id="scenes" class="scenes"></div>
        <aside id="example" class="example"></aside>
      </div>
      <article id="story" aria-live="polite"></article>
      <p class="source">数据：前 100 集逐集对照记录</p>
      <button id="reset" type="button">重置</button>
      <p id="fallback" class="fallback" hidden>本地删减记录没有载入，图表已停止渲染。</p>
    </figure>
  </main>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
