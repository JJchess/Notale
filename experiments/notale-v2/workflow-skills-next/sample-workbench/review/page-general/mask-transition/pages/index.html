<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一浅一深，才是一年</title><link rel="stylesheet" href="assets/base.css"><style>
:root{--bg:#151b17;--text:#223028;--focus:#a54827;--font-sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;--serif:"Songti SC","STSong",serif;--paper:#dfe3d6;--ink:#243128;--muted:#4e6056;--line:#9aa899;--ember:#a54827;--pad-x:72px}body{background:var(--bg)}button{border:0}#stage{padding:0 var(--pad-x);background:var(--paper);color:var(--ink);isolation:isolate}header{position:absolute;left:72px;right:72px;top:52px;height:126px;border-bottom:1px solid var(--line)}h1{width:800px;font:600 68px/1 var(--serif);letter-spacing:-.05em}header p{position:absolute;right:0;top:6px;width:555px;font-size:22px;line-height:1.55;color:var(--muted)}main{position:absolute;left:72px;top:202px;width:1456px;height:566px;overflow:hidden;background:#e4cfb0;touch-action:none}.scene{position:absolute;inset:0;background:#e4cfb0}.scene img{width:980px;height:566px;object-fit:cover}.copy{position:absolute;right:0;top:0;width:476px;height:100%;padding:70px 54px;border-left:1px solid #89998b;background:var(--paper)}.copy h2{font:600 45px/1.16 var(--serif);letter-spacing:-.035em}.copy strong{display:block;margin:54px 0 20px;color:var(--ember);font:600 34px/1.2 var(--serif)}.copy p{font-size:23px;line-height:1.65;color:#43554a}nav{position:absolute;left:72px;right:72px;bottom:34px;height:70px;display:flex;align-items:end;border-top:1px solid var(--line);gap:46px}nav button{height:58px;min-width:118px;padding:0;background:transparent;border-bottom:4px solid transparent;text-align:left;font-size:21px;cursor:pointer;touch-action:manipulation}nav button[aria-current=true]{border-color:var(--ember);color:var(--ember)}#reset{margin-left:auto;min-width:70px;text-align:right;color:var(--muted)}.wipe{-webkit-mask:url(media/growth-mask.svg) 0 0/2400% 100% no-repeat;mask:url(media/growth-mask.svg) 0 0/2400% 100% no-repeat;animation:cut 1.25s steps(23) forwards}@keyframes cut{to{-webkit-mask-position:100% 0;mask-position:100% 0}}.no-mask .wipe{-webkit-mask:none;mask:none;animation:fade .32s ease forwards}@keyframes fade{to{opacity:0}}
</style></head><body><div id="stage"><header><h1>一浅一深，才是一年</h1><p>许多温带阔叶树的早材孔大、常显浅，晚材孔小、常显深。两段相接，构成一个生长季。</p></header><main aria-live="polite"><section class="scene"><img src="media/overview.svg" alt="树干横截面有七道深色年界，浅色宽带与深色窄带交替。"><div class="copy"><h2>深色晚材标出生长季的终点</h2><strong>疏 → 密</strong><p>早材导水孔大、细胞壁薄；晚材孔小、壁厚，颜色随之加深。</p></div></section><section class="scene" hidden><img src="media/cells.svg" alt="放大的年轮显示导水孔由大变小，深色晚材细胞排列更密。"><div class="copy"><h2>一圈内部，孔径由大变小</h2><strong>早材不是另一圈</strong><p>它与随后形成的晚材属于同一个生长季。下一排大孔出现时，新的年份才开始。</p></div></section><section class="scene" hidden><img src="media/scar.svg" alt="树干右侧的旧伤口被后来形成的年轮从两侧逐年包围。"><div class="copy"><h2>伤口让后来的年轮改道</h2><strong>生长没有穿过伤口</strong><p>形成层从缺口两侧继续增生，新木材逐年包围旧伤；弯曲的位置因此保留了受损记录。</p></div></section></main><nav aria-label="浏览预设证据"><button data-i="0" aria-current="true">完整年轮</button><button data-i="1">组织放大</button><button data-i="2">伤口愈合</button><button id="reset" aria-label="重置到完整年轮">重置</button></nav></div><script src="assets/base.js"></script><script>
(function(){
  "use strict";
  Deck.init({title:"一浅一深，才是一年",keys:false});
  const scenes=[...document.querySelectorAll(".scene")];
  const buttons=[...document.querySelectorAll("[data-i]")];
  const main=document.querySelector("main");
  const stage=document.querySelector("#stage");
  const resetButton=document.querySelector("#reset");
  const reduced=matchMedia("(prefers-reduced-motion: reduce)");
  let current=0,target=0,outgoing=null,timer=0,pointerX=null,disposed=false;
  const supportsMask=CSS.supports("mask-image","url(x)")||CSS.supports("-webkit-mask-image","url(x)");
  if(!supportsMask)stage.classList.add("no-mask");

  function mark(index){
    buttons.forEach((button,i)=>i===index?button.setAttribute("aria-current","true"):button.removeAttribute("aria-current"));
  }

  function finish(){
    clearTimeout(timer);
    if(outgoing){
      outgoing.hidden=true;
      outgoing.classList.remove("wipe");
    }
    current=target;
    timer=0;
    outgoing=null;
  }

  function go(index){
    index=(index+scenes.length)%scenes.length;
    if(timer)finish();
    if(index===current)return;
    target=index;
    outgoing=scenes[current];
    scenes[index].hidden=false;
    scenes[index].style.zIndex=1;
    outgoing.style.zIndex=2;
    outgoing.classList.add("wipe");
    mark(index);
    if(reduced.matches)finish();
    else timer=setTimeout(finish,1280);
  }

  function reset(){
    if(timer)finish();
    scenes.forEach((scene,index)=>{
      scene.hidden=index>0;
      scene.classList.remove("wipe");
      scene.style.zIndex="";
    });
    current=target=0;
    outgoing=null;
    mark(0);
  }

  function onButton(event){go(Number(event.currentTarget.dataset.i));}
  function onKey(event){
    if(event.metaKey||event.ctrlKey||event.altKey)return;
    if(event.key==="ArrowRight"){event.preventDefault();go(current+1);}
    else if(event.key==="ArrowLeft"){event.preventDefault();go(current-1);}
    else if(event.key==="Home"||event.key.toLowerCase()==="r"){event.preventDefault();reset();}
  }
  function onPointerDown(event){
    pointerX=Deck.pt(main,event).x;
    if(main.setPointerCapture)main.setPointerCapture(event.pointerId);
  }
  function onPointerUp(event){
    if(pointerX===null)return;
    const delta=Deck.pt(main,event).x-pointerX;
    pointerX=null;
    if(Math.abs(delta)>90)go(current+(delta<0?1:-1));
  }
  function onPointerCancel(){pointerX=null;}
  function onReducedChange(event){if(event.matches&&timer)finish();}
  function dispose(){
    if(disposed)return;
    disposed=true;
    clearTimeout(timer);
    buttons.forEach(button=>button.removeEventListener("click",onButton));
    resetButton.removeEventListener("click",reset);
    window.removeEventListener("keydown",onKey);
    main.removeEventListener("pointerdown",onPointerDown);
    main.removeEventListener("pointerup",onPointerUp);
    main.removeEventListener("pointercancel",onPointerCancel);
    reduced.removeEventListener("change",onReducedChange);
    window.removeEventListener("pagehide",dispose);
  }

  buttons.forEach(button=>button.addEventListener("click",onButton));
  resetButton.addEventListener("click",reset);
  window.addEventListener("keydown",onKey);
  main.addEventListener("pointerdown",onPointerDown);
  main.addEventListener("pointerup",onPointerUp);
  main.addEventListener("pointercancel",onPointerCancel);
  reduced.addEventListener("change",onReducedChange);
  window.addEventListener("pagehide",dispose);
}());
</script></body></html>
