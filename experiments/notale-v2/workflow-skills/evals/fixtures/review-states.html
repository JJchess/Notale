<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/base.css"><title>设备选择</title><style>
:root{--bg:#11151c;--text:#edf1f7;--font-sans:system-ui,sans-serif}#stage{padding:50px;background:#11151c}h1{font-size:42px}.choices{display:flex;gap:16px;margin:50px 0}.choice{width:300px;height:190px;color:#fff;background:#263244;border:0;border-radius:20px;font-size:20px}.choice.on{background:#276c58}.result{font-size:24px;color:#79e2bd}
</style></head><body><main id="stage"><h1>最多选择两项冗余设备</h1><p>点击设备，为生命保障系统增加冗余。</p><div class="choices"><button class="choice">备用氧气罐<br>80 kg</button><button class="choice">备用净水泵<br>55 kg</button><button class="choice">备用电池<br>70 kg</button></div><p class="result">你的方案质量始终合格，而且风险已经最低。</p></main><script src="assets/base.js"></script><script>

</script></body></html>
