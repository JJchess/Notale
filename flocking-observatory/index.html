<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>暮羽 / Flocking Observatory</title>
  <script>window.p5DisableFriendlyErrors = true;</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style>
    :root { --ink:#182019; --paper:#e8dfc8; --accent:#ef6c42; --line:rgba(24,32,25,.18); }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; overflow:hidden; background:#ded5be; color:var(--ink); }
    body { font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif; }
    .shell { height:100%; display:grid; grid-template-columns:minmax(248px,22vw) 1fr; padding:14px; gap:10px; }
    aside { position:relative; padding:26px 24px 18px; border:1px solid var(--line); background:rgba(238,231,211,.82); overflow:auto; }
    aside:before { content:""; position:absolute; inset:7px; border:1px solid rgba(24,32,25,.08); pointer-events:none; }
    .eyebrow,.section-label,.metric small,.hint { font:600 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.16em; text-transform:uppercase; }
    .eyebrow { color:#a44d34; }
    h1 { margin:12px 0 8px; font:500 clamp(30px,3.3vw,50px)/.88 Georgia,"Songti SC",serif; letter-spacing:-.06em; }
    .desc { margin:0 0 26px; max-width:28ch; color:#657067; font-size:11px; line-height:1.6; }
    .rule { height:1px; background:var(--line); margin:0 0 20px; }
    .section-label { display:flex; justify-content:space-between; margin-bottom:17px; color:#657067; }
    .control { margin-bottom:18px; }
    .control label { display:flex; align-items:baseline; justify-content:space-between; font-size:12px; margin-bottom:9px; }
    .control output { font:700 11px ui-monospace,monospace; color:#a44d34; }
    input[type=range] { width:100%; height:12px; appearance:none; background:transparent; cursor:pointer; }
    input[type=range]::-webkit-slider-runnable-track { height:2px; background:linear-gradient(90deg,#313c34 var(--fill),rgba(24,32,25,.15) var(--fill)); }
    input[type=range]::-webkit-slider-thumb { appearance:none; width:11px; height:11px; margin-top:-4.5px; border:2px solid #e8dfc8; border-radius:50%; background:#ef6c42; box-shadow:0 0 0 1px #a44d34; }
    .buttons { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:22px; }
    button { border:1px solid var(--line); padding:9px 8px; color:var(--ink); background:rgba(255,255,255,.22); font:600 9px ui-monospace,monospace; letter-spacing:.08em; cursor:pointer; }
    button:hover { background:var(--ink); color:var(--paper); }
    .hint { margin-top:18px; color:#7b827a; line-height:1.7; letter-spacing:.08em; }
    main { position:relative; min-width:0; overflow:hidden; background:#182019; }
    #canvas-wrap,canvas { width:100%!important; height:100%!important; display:block; }
    .topbar { position:absolute; z-index:2; top:0; left:0; right:0; display:flex; justify-content:space-between; padding:18px 20px; color:#eee4cd; pointer-events:none; }
    .live { display:flex; align-items:center; gap:8px; font:600 9px ui-monospace,monospace; letter-spacing:.14em; }
    .dot { width:6px; height:6px; border-radius:50%; background:#ef6c42; box-shadow:0 0 12px #ef6c42; animation:pulse 2s infinite; }
    @keyframes pulse { 50%{opacity:.3} }
    .metrics { position:absolute; z-index:2; right:18px; bottom:18px; display:flex; border-top:1px solid rgba(238,228,205,.25); color:#eee4cd; pointer-events:none; }
    .metric { min-width:82px; padding:9px 4px 0 18px; text-align:right; }
    .metric small { display:block; color:#9b9d8f; font-size:7px; }
    .metric b { display:block; margin-top:3px; font:400 19px Georgia,serif; }
    @media(max-width:760px){ .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:8px}.desc,.rule,.hint{display:none} aside{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px 20px} aside header{grid-column:1/-1}h1{font-size:28px;margin:4px 0}.controls{display:contents}.section-label{display:none}.control{margin:0}.buttons{margin:0}.metrics{display:none} }
  </style>
</head>
<body>
<div class="shell">
  <aside>
    <header><div class="eyebrow">Field study · 07</div><h1>暮羽</h1><p class="desc">一座观察秩序如何从局部规则中浮现、受惊，又重新缝合的空域实验室。</p><div class="rule"></div></header>
    <div class="controls">
      <div class="section-label"><span>行为向量</span><span>实时</span></div>
      <div class="control"><label>分离 <output id="separation-v">1.25</output></label><input id="separation" type="range" min="0" max="3" step=".05" value="1.25"></div>
      <div class="control"><label>对齐 <output id="alignment-v">1.00</output></label><input id="alignment" type="range" min="0" max="2.5" step=".05" value="1"></div>
      <div class="control"><label>聚合 <output id="cohesion-v">0.90</output></label><input id="cohesion" type="range" min="0" max="2.5" step=".05" value=".9"></div>
      <div class="control"><label>捕食者 <output id="predator-v">1.40</output></label><input id="predator" type="range" min="0" max="3" step=".05" value="1.4"></div>
      <div class="buttons"><button id="reset">重置群落</button><button id="pause">暂停观察</button></div>
      <div class="hint">移动鼠标：追猎鸟群<br>点击空域：释放惊群脉冲<br>S：保存观测图</div>
    </div>
  </aside>
  <main>
    <div class="topbar"><div class="live"><i class="dot"></i> LIVE / AIRSPACE 31°14′N</div><div class="live" id="clock">T+ 000.0</div></div>
    <div id="canvas-wrap"></div>
    <div class="metrics"><div class="metric"><small>个体</small><b id="m-count">180</b></div><div class="metric"><small>同步率</small><b id="m-sync">—</b></div><div class="metric"><small>展开度</small><b id="m-span">—</b></div></div>
  </main>
</div>
<script>
const CFG={seed:7319,count:180,separation:1.25,alignment:1,cohesion:.9,predator:1.4};
let birds=[],trail,pulse=null,paused=false,started=performance.now();
const wrap=document.getElementById('canvas-wrap');
for(const id of ['separation','alignment','cohesion','predator']){
  const el=document.getElementById(id), out=document.getElementById(id+'-v');
  const sync=()=>{CFG[id]=+el.value;out.value=(+el.value).toFixed(2);el.style.setProperty('--fill',(+el.value/+el.max*100)+'%')};
  el.addEventListener('input',sync); sync();
}
document.getElementById('reset').onclick=()=>initialize();
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续观察':'暂停观察'};

function setup(){
  p5.disableFriendlyErrors=true; pixelDensity(1);
  const c=createCanvas(wrap.clientWidth,wrap.clientHeight);c.parent(wrap); colorMode(HSB,360,100,100,100);
  trail=createGraphics(width,height);trail.pixelDensity(1);trail.colorMode(HSB,360,100,100,100); initialize();
}
function initialize(){
  randomSeed(CFG.seed++);noiseSeed(CFG.seed);birds=[];trail.clear();pulse=null;started=performance.now();
  const cx=width*.47,cy=height*.52;
  for(let i=0;i<CFG.count;i++){const a=random(TWO_PI),r=Math.sqrt(random())*min(width,height)*.28;birds.push(new Bird(cx+cos(a)*r,cy+sin(a)*r,i));}
}
function draw(){
  renderAtmosphere(); if(!paused){stepFlock();fadeTrail();} image(trail,0,0); drawField();
  if(pulse){pulse.r+=9;pulse.life-=3;if(pulse.life<=0)pulse=null;}
  if(frameCount%12===0) updateMetrics();
}
function renderAtmosphere(){
  background(152,23,12); noStroke();
  for(let i=0;i<9;i++){const y=i*height/8, n=noise(i*.27,frameCount*.001);fill(42-18*n,42,17+i*1.25,25);rect(0,y,width,height/8+2)}
  fill(38,45,70,4);circle(width*.72,height*.28,min(width,height)*.62);
}
function stepFlock(){for(const b of birds)b.flock(birds);for(const b of birds){b.update();b.edges();b.render(trail);}}
function fadeTrail(){trail.noStroke();trail.fill(150,25,10,8);trail.rect(0,0,width,height);}
function drawField(){
  stroke(45,14,82,12);strokeWeight(.7);noFill();const gap=70;
  for(let x=gap;x<width;x+=gap)line(x,0,x,height);for(let y=gap;y<height;y+=gap)line(0,y,width,y);
  const mx=mouseX,my=mouseY,active=mx>0&&my>0&&mx<width&&my<height;
  if(active){stroke(12,75,86,62);circle(mx,my,24+sin(frameCount*.08)*6);line(mx-16,my,mx+16,my);line(mx,my-16,mx,my+16)}
  if(pulse){stroke(14,70,90,pulse.life);strokeWeight(1.2);circle(pulse.x,pulse.y,pulse.r*2)}
}
function updateMetrics(){
  let vx=0,vy=0,cx=0,cy=0;for(const b of birds){vx+=b.vel.x/b.vel.mag();vy+=b.vel.y/b.vel.mag();cx+=b.pos.x;cy+=b.pos.y}cx/=birds.length;cy/=birds.length;
  let spread=0;for(const b of birds)spread+=dist(b.pos.x,b.pos.y,cx,cy);spread/=birds.length;
  document.getElementById('m-sync').textContent=Math.round(Math.sqrt(vx*vx+vy*vy)/birds.length*100)+'%';
  document.getElementById('m-span').textContent=Math.round(spread)+'m';document.getElementById('clock').textContent='T+ '+((performance.now()-started)/1000).toFixed(1).padStart(5,'0');
}
class Bird{
  constructor(x,y,i){this.pos=createVector(x,y);this.prev=this.pos.copy();this.vel=p5.Vector.fromAngle(random(TWO_PI)).mult(random(1.4,2.8));this.acc=createVector();this.maxSpeed=random(2.3,3.15);this.maxForce=.055;this.size=random(3.5,6);this.phase=random(TWO_PI);this.hue=random()<.12?19:random(37,54);}
  flock(all){let sep=createVector(),ali=createVector(),coh=createVector(),ns=0,na=0,nc=0;const sr=23,ar=58,cr=72;
    for(const o of all){if(o===this)continue;const dx=o.pos.x-this.pos.x,dy=o.pos.y-this.pos.y,d2=dx*dx+dy*dy;if(d2<sr*sr&&d2>0){sep.x-=dx/d2;sep.y-=dy/d2;ns++}if(d2<ar*ar){ali.add(o.vel);na++}if(d2<cr*cr){coh.add(o.pos);nc++}}
    if(ns){sep.div(ns).setMag(this.maxSpeed).sub(this.vel).limit(this.maxForce).mult(CFG.separation*1.65);this.acc.add(sep)}
    if(na){ali.div(na).setMag(this.maxSpeed).sub(this.vel).limit(this.maxForce).mult(CFG.alignment);this.acc.add(ali)}
    if(nc){coh.div(nc).sub(this.pos).setMag(this.maxSpeed).sub(this.vel).limit(this.maxForce).mult(CFG.cohesion);this.acc.add(coh)}
    this.avoid(mouseX,mouseY,CFG.predator,150);if(pulse)this.avoid(pulse.x,pulse.y,CFG.predator*2.2,max(40,pulse.r));
    const wa=noise(this.pos.x*.003,this.pos.y*.003,frameCount*.002)*TWO_PI*2;this.acc.add(cos(wa)*.008,sin(wa)*.008);
  }
  avoid(x,y,power,radius){if(x<0||y<0||x>width||y>height||!power)return;const d=p5.Vector.dist(this.pos,createVector(x,y));if(d<radius&&d>0){const f=p5.Vector.sub(this.pos,createVector(x,y)).setMag(this.maxSpeed).sub(this.vel).limit(this.maxForce*3).mult(power*(1-d/radius));this.acc.add(f)}}
  update(){this.prev.set(this.pos);this.vel.add(this.acc).limit(this.maxSpeed);this.pos.add(this.vel);this.acc.mult(0)}
  edges(){const m=18;if(this.pos.x< -m){this.pos.x=width+m;this.prev.set(this.pos)}if(this.pos.x>width+m){this.pos.x=-m;this.prev.set(this.pos)}if(this.pos.y< -m){this.pos.y=height+m;this.prev.set(this.pos)}if(this.pos.y>height+m){this.pos.y=-m;this.prev.set(this.pos)}}
  render(g){const a=this.vel.heading(),speed=this.vel.mag();g.stroke(this.hue,34,90,17);g.strokeWeight(.65);g.line(this.prev.x,this.prev.y,this.pos.x,this.pos.y);g.push();g.translate(this.pos.x,this.pos.y);g.rotate(a);const flap=Math.sin(frameCount*.22+this.phase)*1.6;g.noStroke();g.fill(this.hue,35,94,84);g.beginShape();g.vertex(this.size*1.65,0);g.vertex(-this.size*.75,-this.size*.45-flap);g.vertex(-this.size*.15,0);g.vertex(-this.size*.75,this.size*.45+flap);g.endShape(CLOSE);g.fill(18,70,95,55);g.circle(this.size*.45,0,1.2+speed*.15);g.pop()}
}
function mousePressed(){if(mouseX>=0&&mouseY>=0&&mouseX<width&&mouseY<height)pulse={x:mouseX,y:mouseY,r:8,life:82};}
function keyPressed(){if(key==='s'||key==='S')saveCanvas('muyu-flock-'+CFG.seed,'png');if(key===' ')paused=!paused;}
function windowResized(){resizeCanvas(wrap.clientWidth,wrap.clientHeight);trail=createGraphics(width,height);trail.pixelDensity(1);trail.colorMode(HSB,360,100,100,100);initialize();}
</script>
</body>
</html>
