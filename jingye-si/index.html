<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>静夜思 · 月引诗行</title>
  <style>
    :root{--paper:#eee7d5;--ink:#17211e;--cinnabar:#a74936;--mist:#aebcb3}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink)}
    body{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;overscroll-behavior:none;touch-action:none}
    canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}canvas.dragging{cursor:grabbing}
    .head{position:fixed;z-index:2;top:max(22px,env(safe-area-inset-top));left:max(24px,env(safe-area-inset-left));color:var(--paper);pointer-events:none}
    .head b{display:block;font-size:clamp(18px,2vw,28px);font-weight:400;letter-spacing:.28em}.head span{display:block;margin-top:7px;color:#91a099;font:9px/1.5 ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase}
    .seal{position:fixed;z-index:2;right:max(22px,env(safe-area-inset-right));top:max(22px,env(safe-area-inset-top));width:29px;height:29px;border:1px solid rgba(232,198,172,.5);color:#d88465;display:grid;place-items:center;font-size:11px;line-height:1.05;writing-mode:vertical-rl;pointer-events:none}
    .hint{position:fixed;z-index:2;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);color:#87968f;font:9px ui-monospace,monospace;letter-spacing:.16em;white-space:nowrap;pointer-events:none;transition:opacity .8s}
    .hint.hide{opacity:0}
    .grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.15;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E")}
    @media(max-width:600px){.head span{display:none}.seal{top:auto;bottom:22px}.hint{bottom:25px}}
    @media(prefers-reduced-motion:reduce){.hint{transition:none}}
  </style>
</head>
<body>
  <div class="head"><b>静夜思</b><span>Li Bai · Tang Dynasty / drag the moon</span></div>
  <div class="seal">太白</div>
  <canvas id="stage" aria-label="可拖动月亮，使《静夜思》的诗句围绕月亮聚散重排"></canvas>
  <div class="hint" id="hint">拖动月亮 · 诗随月行</div><div class="grain"></div>
<script type="module">
const canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d',{alpha:false});
const hint=document.querySelector('#hint');
const verses=['床前明月光','疑是地上霜','举头望明月','低头思故乡'];
const segmenter=new Intl.Segmenter('zh-CN',{granularity:'grapheme'});
const glyphs=verses.flatMap((line,lineIndex)=>[...segmenter.segment(line)].map((s,charIndex)=>({char:s.segment,lineIndex,charIndex,x:0,y:0,vx:0,vy:0,tx:0,ty:0,angle:0,ta:0,alpha:0})));
let W=0,H=0,dpr=1,fontSize=44,font='',prepared=[],lineWidths=[];
let moon={x:0,y:0,tx:0,ty:0,r:72,vx:0,vy:0},pointer=null,dragging=false,lastMove=0,burst=0,ready=false,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

// Pretext is the layout oracle; the fallback preserves first paint if the CDN is unavailable.
let pretext=null;
try{pretext=await import('https://esm.sh/@chenglou/pretext@0.0.6');}catch(error){console.warn('Pretext unavailable; using Canvas measurements.',error)}

function measurePoem(){
  fontSize=Math.max(28,Math.min(52,Math.min(W,H)*.058));
  font=`400 ${fontSize}px "Songti SC", "STSong", serif`;
  ctx.font=font;
  if(pretext){
    prepared=verses.map(v=>pretext.prepareWithSegments(v,font)); // once per text + font pair
    lineWidths=prepared.map(p=>pretext.layoutWithLines(p,W*.8,fontSize*1.45).lines[0]?.width||ctx.measureText(verses[0]).width);
  }else lineWidths=verses.map(v=>ctx.measureText(v).width);
}
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!ready){moon.x=moon.tx=W*.55;moon.y=moon.ty=H*.49}
  measurePoem();moon.r=Math.max(48,Math.min(82,Math.min(W,H)*.105));placeTargets();
  if(!ready){glyphs.forEach(g=>{g.x=g.tx+(Math.random()-.5)*W*.3;g.y=g.ty+(Math.random()-.5)*H*.3});ready=true}
}
function placeTargets(){
  const compact=W<620, speed=Math.hypot(moon.vx,moon.vy);
  const restRadius=compact?Math.max(moon.r*2.05,fontSize*4.55):Math.max(moon.r*1.72,fontSize*3.4);
  const spread=restRadius+Math.min(70,speed*8)+burst*62;
  const tilt=(moon.x/W-.5)*.5, orbit=moon.y/H*Math.PI*.35;
  glyphs.forEach(g=>{
    const count=5, lineAngle=-Math.PI*.7+g.lineIndex*(Math.PI*1.4/3)+orbit;
    const tangent=(g.charIndex-(count-1)/2)*(fontSize*(compact?.94:1.08));
    const radial=spread+g.lineIndex%2*fontSize*.48;
    g.tx=moon.x+Math.cos(lineAngle)*radial-Math.sin(lineAngle)*tangent;
    g.ty=moon.y+Math.sin(lineAngle)*radial+Math.cos(lineAngle)*tangent;
    // Measured line width subtly corrects tangent scale, keeping Chinese spacing optically even.
    const correction=lineWidths[g.lineIndex]/Math.max(1,fontSize*count);
    g.tx=moon.x+(g.tx-moon.x)*(1+(correction-1)*.18);
    let readingAngle=lineAngle+Math.PI/2+tilt;
    if(Math.cos(readingAngle)<0)readingAngle+=Math.PI; // Chinese glyphs remain upright on the lower arc
    g.ta=Math.atan2(Math.sin(readingAngle),Math.cos(readingAngle));
  });
}
function drawBackground(t){
  const grad=ctx.createRadialGradient(moon.x,moon.y,0,W*.5,H*.5,Math.max(W,H)*.8);grad.addColorStop(0,'#263630');grad.addColorStop(.42,'#17231f');grad.addColorStop(1,'#0c1211');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(185,205,193,.045)';ctx.lineWidth=1;
  const gap=72;ctx.beginPath();for(let x=(t*.002)%gap;x<W;x+=gap){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=0;y<H;y+=gap){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
}
function drawMoon(t){
  const pulse=reduced?0:Math.sin(t*.0013)*2, r=moon.r+pulse;
  const glow=ctx.createRadialGradient(moon.x-r*.2,moon.y-r*.22,r*.06,moon.x,moon.y,r*2.6);glow.addColorStop(0,'rgba(255,246,207,.72)');glow.addColorStop(.28,'rgba(229,220,178,.22)');glow.addColorStop(1,'rgba(201,219,202,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(moon.x,moon.y,r*2.6,0,Math.PI*2);ctx.fill();
  const disk=ctx.createRadialGradient(moon.x-r*.3,moon.y-r*.35,2,moon.x,moon.y,r);disk.addColorStop(0,'#fff9dc');disk.addColorStop(.72,'#dedbbd');disk.addColorStop(1,'#aeb9a4');ctx.fillStyle=disk;ctx.beginPath();ctx.arc(moon.x,moon.y,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(80,102,89,.1)';ctx.beginPath();ctx.ellipse(moon.x-r*.22,moon.y+r*.18,r*.28,r*.16,-.35,0,Math.PI*2);ctx.ellipse(moon.x+r*.31,moon.y-r*.28,r*.18,r*.25,.4,0,Math.PI*2);ctx.fill();
  if(dragging){ctx.strokeStyle='rgba(233,204,156,.48)';ctx.setLineDash([3,7]);ctx.beginPath();ctx.arc(moon.x,moon.y,r+14,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}
}
function drawGlyphs(t){
  ctx.font=font;ctx.textAlign='center';ctx.textBaseline='middle';
  glyphs.forEach((g,i)=>{
    const spring=reduced?1:.075,damp=reduced?0:.76;
    g.vx=(g.vx+(g.tx-g.x)*spring)*damp;g.vy=(g.vy+(g.ty-g.y)*spring)*damp;g.x+=g.vx;g.y+=g.vy;g.angle+=(g.ta-g.angle)*.09;g.alpha+=(1-g.alpha)*.04;
    const shimmer=reduced?1:.9+Math.sin(t*.0017+i*.8)*.1;
    ctx.save();ctx.translate(g.x,g.y);ctx.rotate(g.angle);ctx.fillStyle=`rgba(238,231,213,${g.alpha*shimmer})`;ctx.shadowColor='rgba(232,210,157,.22)';ctx.shadowBlur=8;ctx.fillText(g.char,0,0);ctx.restore();
  });
}
function frame(t){
  moon.vx=(moon.tx-moon.x)*.22;moon.vy=(moon.ty-moon.y)*.22;moon.x+=moon.vx;moon.y+=moon.vy;burst*=.94;placeTargets();drawBackground(t);drawGlyphs(t);drawMoon(t);requestAnimationFrame(frame);
}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{const p=point(e);if(Math.hypot(p.x-moon.x,p.y-moon.y)<=moon.r*1.45){dragging=true;pointer=e.pointerId;canvas.setPointerCapture(pointer);canvas.classList.add('dragging');hint.classList.add('hide');burst=.28;lastMove=performance.now();e.preventDefault()}});
canvas.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==pointer)return;const p=point(e),pad=moon.r+8;moon.tx=Math.max(pad,Math.min(W-pad,p.x));moon.ty=Math.max(pad,Math.min(H-pad,p.y));burst=Math.min(1,burst+.08);lastMove=performance.now();e.preventDefault()},{passive:false});
function release(e){if(!dragging||e.pointerId!==pointer)return;dragging=false;pointer=null;canvas.classList.remove('dragging');burst=1}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
canvas.addEventListener('dblclick',()=>{moon.tx=W*.55;moon.ty=H*.49;burst=1});
addEventListener('resize',resize,{passive:true});resize();requestAnimationFrame(frame);
</script>
</body>
</html>
