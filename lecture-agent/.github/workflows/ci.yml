name: ci
on:
  push:
    branches: [main, "phase*"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lecture-agent
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Sync deps
        run: uv sync --all-extras
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Types (mypy)
        run: uv run mypy
      - name: Decoupling contract (import-linter)
        run: uv run lint-imports
      - name: Tests (pytest, replay/fake only — no live LLM)
        run: uv run pytest -q
