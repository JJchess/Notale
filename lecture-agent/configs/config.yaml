# 旋钮唯一真相源。_target_ 在各组里把具体 adapter 绑到 port（组合根在 app/container.py）。
defaults:
  - llm: replay          # 默认离线可复现；跑真生成用 `llm=deepseek_v3`
  - generator: full
  - _self_

seed: 0
project: lecture-agent   # wandb project
tags: []

# —— 生成参数（命令行覆盖：topic=梯度下降 pages=8 ...）——
topic: null              # 必填（generate 时给 topic=...）
pages: 8
theme: ""
audience: ""
wants: ""
extra: ""
coverage: false
out_dir: data/corpus
