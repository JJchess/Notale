# 旋钮唯一真相源。_target_ 在各组里把具体 adapter 绑到 port（组合根 app/generate.py，
# 共享装配 helper 在 app/build.py）。
defaults:
  - llm: replay          # 默认离线可复现；跑真生成用 `llm=deepseek_v3`
  - sim_llm: gemini_3_6_flash # create-sim 的 widget:* 独立模型路由
  - generator: full
  - media: default       # 配图 provider 配置；只在 GeneratorOptions.media=true 时才实例化/真调，默认零成本
  - _self_

seed: 0
project: lecture-agent   # wandb project
tags: []

# —— 生成参数（命令行覆盖：topic=梯度下降 pages=8 ...）——
topic: null              # 必填（generate 时给 topic=...）
pages: 8
theme: ""
audience: ""
wants: ""
extra: ""
coverage: false
out_dir: experiments/corpus
