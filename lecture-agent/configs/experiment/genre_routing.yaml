# @package _global_
# genre 均衡路由实验：题集锚定 PPTAgent(5域: Culture/Education/Science/Society/Tech)
# ∪ SlidesBench(10域: Art/Business/Career/Design/Entrepreneur/Environment/Food/
# Marketing/Social Media/Technology)，跨「互动友好(STEM)↔互动排斥(人文/艺术)」两极。
# 详见 examples/benchmark_topics.md（题材溯源 + 每题的路由假设）。
#
# 真跑（需 SILICONFLOW_API_KEY，见 lecture-agent/.env）：
#   uv run python scripts/run_experiment.py +experiment=genre_routing llm=glm_5_2
# 干跑校验配置（不打 API）：
#   uv run python scripts/run_experiment.py +experiment=genre_routing llm=replay --cfg job
defaults:
  - override /generator: full

generator:
  media: true # 打开封面配图(默认关是为了其它跑法零成本；这套实验专门检查 hero_image 冷门是否只是配置开关)

tags: [genre_routing]
topics:
  # —— interactive：STEM/量化，冷格(sim/runnable/formula)应回暖 ——
  - 梯度下降与学习率 # domain=tech/ml expect=interactive (基线锚点)
  - 二分查找 # domain=tech/cs expect=interactive (基线锚点)
  - 快速排序 # domain=tech/cs expect=interactive
  - 简谐振动与阻尼 # domain=science/phys expect=interactive
  - 傅里叶级数 # domain=science/math expect=interactive
  - 贝叶斯定理 # domain=science/math expect=interactive
  - 神经网络的反向传播 # domain=tech/ml expect=interactive
  # —— data：定量但偏图表/统计，非仿真 ——
  - 供需曲线与市场均衡 # domain=society/econ expect=data
  - 复利与长期投资 # domain=business expect=data
  - 全球气候变化的关键数据 # domain=society/env expect=data
  - 光合作用的机制 # domain=science/bio expect=data (机制→diagram/flow)
  # —— prose：人文/艺术，适配门应挡住互动 ——
  - 宋代文人画的美学 # domain=culture/art expect=prose
  - 法国大革命的起因 # domain=society/hist expect=prose
  - 唐诗中的意象 # domain=culture/lit expect=prose
  - 存在主义哲学入门 # domain=culture/phil expect=prose
seeds: [0]
