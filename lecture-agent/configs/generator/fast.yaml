# fast 档：延迟旋钮全开（配合 llm 的关思考 fast_extra_body）。目标 15 页 ≤5min。
# 与 full 的差异：视角 3→1、并发 4→8、关章节分隔页。fanout/revise 保留以守结构质量。
fanout: true
revise: true
evolve: false
plan_perspectives: 1  # 跳过多视角发现调用
tools: false
concurrency: 8        # 有界提高 fan-out/notes 并发（别无界：限流+吞吐饱和）
sections: false       # 关章节分隔（省一次规划调用+少几页）
render_rounds: 1      # fast 档只做一轮真机验收+回炉（省一次浏览器往返；full 档 2 轮）
quality_rounds: 0     # fast 以时延优先；正式交付请用 full 的逐页质量门
plan_quality_rounds: 0
