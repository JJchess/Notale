# 生成器变体（消融轴）。full = 完整流水线；消融版把开关关掉即可。
fanout: true          # 逐块并行 fan-out
revise: true          # 校验失败→定向重生成
evolve: false         # 自演化提案（默认关，实验时开）
plan_perspectives: 3  # 多视角规划数（single_pass 版设 1）
tools: false          # sim 块生成走 tool-loop（模型用 calc 验证表达式）；默认关=零回归
media: false          # 封面配图（真调图库/文生图，见 configs/media/default.yaml）；默认关=零外部调用
record: true          # 记录本次生成到 results/ledger.jsonl（默认开，关用 generator.record=false）
render_rounds: 2      # 真机无头渲染验收 → 溢出页回炉精简的最大轮数；0=关。
                      # 无 node/无 Edge 的机器上 HeadlessVerifier 自动退化为 no-op(仅 warning)，不必手动关。
