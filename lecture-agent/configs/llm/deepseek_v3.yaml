# 真调 LLM 并录制。模型版本 pin 在此，不用浮动别名。
_target_: lecture_agent.adapters.llm.cassette.CassetteClient
mode: live                       # live=真调+录制 / replay=只回放
fixtures_dir: fixtures
namespace: ""                    # 扁平，与 replay 对齐；按模型隔离时改成模型名
inner:
  _target_: lecture_agent.adapters.llm.client.HttpxClient
  base_url: https://api.siliconflow.cn/v1
  model: deepseek-ai/DeepSeek-V3
  temperature: 0.0               # 确定性优先
  seed: ${seed}
  api_key_env: SILICONFLOW_API_KEY
