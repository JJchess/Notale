# GLM-5.2（智谱最新）· 经硅基流动 OpenAI 兼容端点 · live 录制。
# namespace 按模型隔离：prompt-hash 相同也不会跨模型串包 fixture。
_target_: lecture_agent.adapters.llm.cassette.CassetteClient
mode: live
fixtures_dir: fixtures
namespace: glm_5_2
inner:
  _target_: lecture_agent.adapters.llm.client.HttpxClient
  base_url: https://api.siliconflow.cn/v1
  model: zai-org/GLM-5.2
  temperature: 0.0
  seed: ${seed}
  api_key_env: SILICONFLOW_API_KEY
  timeout: 600                    # reasoning 模型 12 页单调用可能 >120s

# fast 档关思考参数（per-model；bench 的 fast 变体注入 inner.extra_body，slow 忽略）
fast_extra_body: { enable_thinking: false }
