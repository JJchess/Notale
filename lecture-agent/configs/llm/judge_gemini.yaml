# 去偏评委 = Gemini 3.5 Flash（不在被测 5 模型之列，彻底避自偏）。
# 走 Google 的 OpenAI 兼容端点；境外端点需显式走本机翻墙代理（与国内直连相反）。
_target_: lecture_agent.adapters.llm.cassette.CassetteClient
mode: live
fixtures_dir: fixtures
namespace: judge_gemini
inner:
  _target_: lecture_agent.adapters.llm.client.HttpxClient
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  model: gemini-3.5-flash
  temperature: 0.0
  seed: null                          # Gemini OpenAI 兼容端点不接受 seed 字段（会 400）
  api_key_env: GEMINI_API_KEY
  timeout: 300
  proxy: http://127.0.0.1:7897        # 境外端点走 clash http 口
