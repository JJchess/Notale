# Media provider（GeneratorOptions.media=auto|true 时实例化；auto 仅对 planner 选中的 media 请求调用）。
# finder：图库检索(Pixabay，实测直连可通不需代理)；generator：文生图兜底(Gemini nano-banana pro，境外端点需代理)。
finder:
  _target_: lecture_agent.adapters.media.pixabay.PixabayProvider
  api_key_env: PIXABAY_API_KEY
  timeout: 20

generator:
  _target_: lecture_agent.adapters.media.gemini_image.GeminiImageProvider
  model: nano-banana-pro-preview
  api_key_env: GEMINI_API_KEY
  proxy: http://127.0.0.1:7897
  timeout: 60
