# create-sim 专用模型。OpenAI 兼容端点用 reasoning_effort 映射 Gemini thinking_level。
_target_: lecture_agent.adapters.llm.cassette.CassetteClient
mode: live
fixtures_dir: experiments/fixtures
namespace: sim_gemini_3_6_flash_low_t07
inner:
  _target_: lecture_agent.adapters.llm.client.HttpxClient
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  model: gemini-3.6-flash
  temperature: 0.7
  seed: null
  api_key_env: GEMINI_API_KEY
  timeout: 300
  proxy: http://127.0.0.1:7897
  extra_body:
    reasoning_effort: low
