# ============================================================================
# Hermes 配置样例 —— 把我们的 lecture-agent 技能挂进 Hermes，并配一条 loop 路由
# 用法：参考 refs/hermes-agent/cli-config.yaml.example 的完整字段；把下面这几块合并进你的
#       Hermes 配置（Windows: %LOCALAPPDATA%\hermes\config.yaml，或 `hermes` 交互里配）。
#       这是**样例**，键名以 refs/hermes-agent/cli-config.yaml.example 为准，跑前对一遍。
# ============================================================================

model:
  # 已配：硅基流动 (SiliconFlow)，OpenAI 兼容。key/base_url 在仓库根 .env（已 .gitignore）。
  default: "deepseek-ai/DeepSeek-V3"       # 冒烟已验证可稳定产出合法 block；也可换 DeepSeek-V3.2 / Qwen3.5-27B 等
  provider: "custom"                        # OpenAI 兼容端点走 custom
  base_url: "https://api.siliconflow.cn/v1"
  # key 从环境读：OPENAI_API_KEY（.env 里已设为硅基流动 key）。不要把 key 写进本文件。

skills:
  # 关键：让 Hermes 原地读我们仓库里的技能，不必 copy 进 %LOCALAPPDATA%\hermes\skills
  external_dirs:
    - "D:/.zhuIvan/Desktop/ws2/lecture-agent/skills"   # ← 改成你机器上的绝对路径

delegation:
  max_concurrent_children: 6    # per-block 并行度（生成一节课的 fan-out）
  max_spawn_depth: 2

# ---- loop 能力：一条 cron 路由，周期性从题材队列生成并聚合自演化信号 ----
# 具体调度语法以 `hermes cron` / refs/hermes-agent/cron 为准；这里表达意图。
cron:
  jobs:
    - name: "generate-lecture-batch"
      schedule: "0 3 * * *"        # 每天 03:00（示例）
      prompt: |
        读取 lecture-agent/hermes/topics.sample.jsonl 里未完成的课题，逐个用 generate-lecture 生成到
        lecture-agent/out/<id>/course.lecture.json；每个都跑 assemble.mjs + validate.mjs + render-verify.mjs。
        全部完成后，运行 evolve-schema 的 aggregate.mjs 扫描 lecture-agent/out，把「反复出现的 freeform 诉求 /
        主题 / 引擎信号」整理成提案摘要，等人类 review（不要自己改 schema）。
