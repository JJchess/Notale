<style>
  .lab { background: #F3F1FA; border-radius: 16px; padding: 20px; color: #23203A; font-family: var(--font-sans); }
  .lab canvas { display: block; width: 100%; max-width: 680px; height: auto; margin: 0 auto;
                background: #FBFAFE; border-radius: 12px; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .lab label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #6B6385; }
  .lab input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 4px; background: #DDD6EC; border-radius: 2px; }
  .lab input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px;
    border-radius: 50%; background: #0E7490; cursor: pointer; }
  .val { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-variant-numeric: tabular-nums;
         font-size: 14px; color: #0E7490; min-width: 48px; text-align: right; }
  .lab button { background: #ECE8F6; color: #23203A; border: 1px solid rgba(90,78,128,.25);
                border-radius: 8px; padding: 6px 18px; font-size: 14px; cursor: pointer;
                transition: background .15s, transform .1s; }
  .lab button:hover { background: #E0D9F0; }
  .lab button:active { transform: scale(.97); }
  [data-theme="dark"] .lab { background: #131028; color: #E8E0F0; }
  [data-theme="dark"] .lab canvas { background: linear-gradient(180deg, #131028, #1A1438); }
  [data-theme="dark"] .lab label { color: #A89BBE; }
  [data-theme="dark"] .lab input[type=range] { background: #2E2553; }
  [data-theme="dark"] .lab input[type=range]::-webkit-slider-thumb { background: #22D3EE; }
  [data-theme="dark"] .val { color: #22D3EE; }
  [data-theme="dark"] .lab button { background: #241D40; color: #E8E0F0; border-color: rgba(168,155,190,.25); }
  [data-theme="dark"] .lab button:hover { background: #2E2553; }
</style>
<div class="lab">
  <canvas id="stage" width="680" height="320"></canvas>
  <div class="row">
    <label for="damp">Damping</label>
    <input type="range" id="damp" min="0" max="0.2" step="0.01" value="0.05">
    <span class="val" id="dampVal">0.05</span>
    <button id="reset">Reset</button>
  </div>
</div>
<script>
  const root = document.documentElement;
  const PAL = {
    light: { grid: 'rgba(90,78,128,.10)', tick: 'rgba(90,78,128,.40)', mute: '#6B6385',
             rod: '#6B6385', accent: '#0E7490', blur: 0 },
    dark:  { grid: 'rgba(168,155,190,.10)', tick: 'rgba(168,155,190,.40)', mute: '#A89BBE',
             rod: '#A89BBE', accent: '#22D3EE', blur: 14 }
  };
  const pal = () => PAL[root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'];
  const ctx = document.getElementById('stage').getContext('2d');
  let damp = 0.05, theta = Math.PI / 3, omega = 0;
  const L = 220, ox = 340, oy = 30;
  document.getElementById('damp').addEventListener('input', (e) => {
    damp = parseFloat(e.target.value);
    document.getElementById('dampVal').textContent = damp.toFixed(2);
  });
  document.getElementById('reset').addEventListener('click', () => { theta = Math.PI / 3; omega = 0; });
  function step(dt) {
    omega += (-9.8 / 2.4 * Math.sin(theta) - damp * omega) * dt;
    theta += omega * dt;
  }
  function draw() {
    const p = pal();
    ctx.clearRect(0, 0, 680, 320);
    ctx.strokeStyle = p.grid;
    ctx.lineWidth = 1;
    for (let x = 40; x < 680; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 320); ctx.stroke(); }
    ctx.strokeStyle = p.tick;
    for (let x = 40; x <= 640; x += 20) {
      ctx.beginPath(); ctx.moveTo(x, 312); ctx.lineTo(x, 312 - (x % 100 === 40 ? 9 : 4)); ctx.stroke();
    }
    ctx.fillStyle = p.mute;
    ctx.font = '11px ui-monospace, Consolas, monospace';
    ctx.fillText('theta ' + (theta >= 0 ? '+' : '') + theta.toFixed(2) + ' rad', 16, 24);
    const bx = ox + L * Math.sin(theta), by = oy + L * Math.cos(theta);
    ctx.strokeStyle = p.rod; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(bx, by); ctx.stroke();
    if (p.blur) { ctx.shadowColor = p.accent; ctx.shadowBlur = p.blur; }
    ctx.fillStyle = p.accent;
    ctx.beginPath(); ctx.arc(bx, by, 12, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    if (!p.blur) { ctx.lineWidth = 2; ctx.strokeStyle = p.accent; ctx.beginPath(); ctx.arc(bx, by, 17, 0, Math.PI * 2); ctx.globalAlpha = .35; ctx.stroke(); ctx.globalAlpha = 1; }
  }
  let last = performance.now();
  (function loop(now) {
    step(Math.min((now - last) / 1000, 0.03)); last = now;
    draw();
    requestAnimationFrame(loop);
  })(performance.now());
</script>
