[project]
name = "lecture-agent"
version = "0.2.0"
description = "Self-evolving agent that turns a topic into an interactive LectureDoc lecture. Python rewrite (hexagonal, reproducible)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "AICosmos" }]
keywords = ["lecture", "courseware", "agent", "llm", "reveal.js", "education", "self-evolving", "reproducible"]

dependencies = [
    "pydantic>=2.7",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
]

[project.scripts]
lecture-agent = "lecture_agent.app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# flat layout：包直接位于项目根（旧 Node 已归档进 legacy/）。
[tool.hatch.build.targets.wheel]
packages = ["lecture_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["lecture_agent", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 提示词/文档含大量长中文行（ruff 按字符计宽，CJK 视觉双宽）；代码仍由 formatter 保持 100 列。
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["lecture_agent"]
# Third-party libs without stubs:
[[tool.mypy.overrides]]
module = ["hydra.*", "omegaconf.*"]
ignore_missing_imports = true
