<style>
  .lab { background: var(--bg2); border-radius: var(--radius, 12px); padding: 20px; color: var(--ink); }
  .lab canvas { display: block; width: 100%; max-width: 680px; height: auto; margin: 0 auto;
                background: var(--card); border-radius: var(--radius, 8px); }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .lab label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text2); }
  .lab input[type=range] { flex: 1; accent-color: var(--accent); }
  .val { font-family: var(--mono); font-variant-numeric: tabular-nums;
         font-size: 14px; color: var(--accent); min-width: 48px; text-align: right; }
</style>
<div class="lab">
  <canvas id="stage" width="680" height="320"></canvas>
  <div class="row">
    <label for="damp">阻尼</label>
    <input type="range" id="damp" min="0" max="0.2" step="0.01" value="0.05">
    <span class="val mono" id="dampVal">0.05</span>
    <button id="reset">重置</button>
  </div>
</div>
<script>
  const root = document.documentElement;
  const tok = n => getComputedStyle(root).getPropertyValue(n).trim();
  const ctx = document.getElementById('stage').getContext('2d');
  let damp = 0.05, theta = Math.PI / 3, omega = 0;
  const L = 220, ox = 340, oy = 30;
  document.getElementById('damp').addEventListener('input', e => {
    damp = parseFloat(e.target.value);
    document.getElementById('dampVal').textContent = damp.toFixed(2);
  });
  document.getElementById('reset').addEventListener('click', () => { theta = Math.PI / 3; omega = 0; });
  function step(dt) {
    omega += (-9.8 / 2.4 * Math.sin(theta) - damp * omega) * dt;
    theta += omega * dt;
  }
  function draw() {
    const ink = tok('--ink'), accent = tok('--accent'), line = tok('--line'), mute = tok('--text2');
    const dark = root.getAttribute('data-theme') === 'lab';
    ctx.clearRect(0, 0, 680, 320);
    ctx.strokeStyle = line; ctx.lineWidth = 1;
    for (let x = 40; x < 680; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 320); ctx.stroke(); }
    ctx.fillStyle = mute; ctx.font = '11px ' + tok('--mono');
    ctx.fillText('theta ' + (theta >= 0 ? '+' : '') + theta.toFixed(2) + ' rad', 16, 24);
    const bx = ox + L * Math.sin(theta), by = oy + L * Math.cos(theta);
    ctx.strokeStyle = mute; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(bx, by); ctx.stroke();
    if (dark) { ctx.shadowColor = accent; ctx.shadowBlur = 14; }
    ctx.fillStyle = accent;
    ctx.beginPath(); ctx.arc(bx, by, 12, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  let last = performance.now();
  (function loop(now) {
    step(Math.min((now - last) / 1000, 0.03)); last = now;
    draw();
    requestAnimationFrame(loop);
  })(performance.now());
</script>
