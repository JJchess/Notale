<main class="graph-view">
  <p class="scope" aria-hidden="true">
    <span>DIJKSTRA</span><i>/</i><span>SOURCE A</span>
  </p>

  <p class="queue" id="queueReadout">
    <span>PRIORITY QUEUE</span>
    <strong id="queueItems">A · 0</strong>
  </p>

  <svg id="network" viewBox="0 0 700 540" role="img" aria-labelledby="graphTitle graphDescription">
    <title id="graphTitle">Dijkstra 最短路径执行图</title>
    <desc id="graphDescription">从 A 出发的带权图，节点显示暂定距离。</desc>
    <g class="edge-layer" id="edgeLayer"></g>
    <g class="node-layer" id="nodeLayer"></g>
  </svg>

  <div class="operation" id="operation" data-tone="neutral">
    <span class="operation-label" id="operationLabel">WAITING</span>
    <strong class="operation-expression" id="operationExpression">d(A) = 0</strong>
    <span class="operation-detail" id="operationDetail">A 将首先出队</span>
  </div>

  <p class="progress" id="graphProgress" aria-live="polite">SETTLED 0 · FRONTIER 1</p>
</main>
