<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="在浏览器中编辑、运行并可视化 Python 数据结构与算法。" />
    <title>Python 排序运行时</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="assets/base.css" />
    <link rel="stylesheet" href="assets/lib/vscode-codicons/codicon.css" />
    <link rel="stylesheet" href="styles.css?v=20260830-native-view" />
  </head>
  <body>
    <main id="stage" aria-label="代码学习工作台">
      <div class="workbench" id="workbench" data-runtime-state="loading">
        <header class="titlebar">
          <div class="product-mark" aria-hidden="true">
            <span class="codicon codicon-code"></span>
          </div>
          <div class="title-copy">
            <span class="title-name" id="lessonTitle">Python 排序运行时</span>
            <span class="title-separator">—</span>
            <span class="title-context" id="titleContext">正在载入课程…</span>
          </div>
          <div class="runtime-chip" id="runtimeChip" data-kind="loading" role="status">
            <span class="runtime-dot" aria-hidden="true"></span>
            <span id="runtimeText">Python 准备中</span>
          </div>
        </header>

        <div class="workspace">
          <section class="editor-pane min0" id="editorPane" aria-label="代码编辑区">
            <div class="editor-tabs-row">
              <div class="file-tabs" id="fileTabs" role="tablist" aria-label="课程文件"></div>
              <div class="editor-actions" aria-label="编辑器操作">
                <button class="editor-action" id="resetButton" type="button" title="恢复全部初始代码" aria-label="恢复全部初始代码">
                  <span class="codicon codicon-discard" aria-hidden="true"></span>
                </button>
                <button class="editor-action run-action" id="runButton" type="button" title="运行代码（Ctrl 或 Command + Enter）" aria-label="运行代码" disabled>
                  <span class="codicon codicon-loading codicon-modifier-spin" id="runButtonIcon" aria-hidden="true"></span>
                  <span class="sr-only" id="runButtonLabel">准备 Python</span>
                </button>
              </div>
            </div>

            <div class="breadcrumbs" aria-label="当前文件路径">
              <span class="codicon codicon-folder-opened breadcrumb-icon" aria-hidden="true"></span>
              <span id="lessonSlug">code-lesson</span>
              <span class="codicon codicon-chevron-right breadcrumb-chevron" aria-hidden="true"></span>
              <span class="codicon codicon-python breadcrumb-file-icon" aria-hidden="true"></span>
              <span id="breadcrumbFile">starter.py</span>
            </div>

            <div class="editor-shell min0" id="editorShell">
              <div id="editor" aria-label="Python 代码编辑器"></div>
              <div class="editor-loading" id="editorLoading" role="status">
                <span class="loading-caret" aria-hidden="true"></span>
                <span>正在载入编辑器…</span>
              </div>
            </div>

            <div
              class="panel-sash"
              id="panelSash"
              role="separator"
              aria-label="调整代码编辑器和输出面板高度"
              aria-orientation="horizontal"
              aria-controls="editorShell outputPanel"
              aria-valuemin="88"
              aria-valuemax="360"
              aria-valuenow="138"
              tabindex="0"
              title="拖拽或用方向键调整 Output 高度，双击恢复"
            ></div>

            <section class="output-panel min0" id="outputPanel" aria-labelledby="outputTitle" data-kind="idle">
              <div class="output-heading">
                <div class="output-tabs">
                  <span class="output-tab" id="outputTitle">输出</span>
                  <span class="output-source" id="outputSource">starter.py</span>
                </div>
                <button class="panel-action" id="clearOutputButton" type="button" title="清除输出" aria-label="清除输出">
                  <span class="codicon codicon-clear-all" aria-hidden="true"></span>
                </button>
              </div>
              <pre class="output-content" id="outputContent" aria-live="polite">运行结果、测试与错误会显示在这里。</pre>
            </section>
          </section>

          <section class="visualization-pane min0" id="visualizationPane" aria-label="代码执行可视化">
            <div class="visualizer-shell min0">
              <div id="visualizer" class="visualizer min0" role="region" aria-label="算法状态可视化"></div>
              <p class="visualizer-error" id="visualizerError" hidden></p>
            </div>

            <div class="playback-panel">
              <div class="playback-actions" aria-label="执行轨迹控制">
                <button class="icon-button" id="previousButton" type="button" disabled aria-label="上一步" title="上一步">
                  <span class="codicon codicon-debug-step-back" aria-hidden="true"></span>
                </button>
                <button class="icon-button play-toggle" id="playButton" type="button" disabled aria-label="播放" title="播放">
                  <span class="codicon codicon-play play-icon" aria-hidden="true"></span>
                  <span class="codicon codicon-debug-pause pause-icon" aria-hidden="true"></span>
                </button>
                <button class="icon-button" id="nextButton" type="button" disabled aria-label="下一步" title="下一步">
                  <span class="codicon codicon-debug-step-over" aria-hidden="true"></span>
                </button>
              </div>
              <div class="progress-copy">
                <span id="frameProgress">初始状态</span>
                <span class="progress-detail" id="progressDetail"></span>
              </div>
              <label class="speed-control" for="speedSelect">
                <span>速度</span>
                <select id="speedSelect" aria-label="播放速度">
                  <option value="0.5">0.5×</option>
                  <option value="1" selected>1×</option>
                  <option value="2">2×</option>
                  <option value="4">4×</option>
                </select>
              </label>
            </div>

            <p class="sr-only" id="screenReaderStatus" aria-live="polite"></p>
          </section>
        </div>
      </div>
    </main>

    <noscript>这个课程需要 JavaScript 才能运行浏览器内代码。</noscript>
    <script src="assets/base.js"></script>
    <script src="assets/lib/monaco-editor/min/vs/loader.js"></script>
    <script type="module" src="core/workbench.js?v=20260830-native-view"></script>
  </body>
</html>
