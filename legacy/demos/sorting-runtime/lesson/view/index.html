<main class="sequence-view">
  <p class="scope" aria-hidden="true">
    <span id="algorithmName">SEQUENCE</span>
    <span class="scope-separator">/</span>
    <span id="sampleCount">N = 0</span>
  </p>

  <section class="spectrum" id="spectrum" aria-label="当前序列">
    <div class="plot-guides" aria-hidden="true">
      <i></i><i></i><i></i><i></i>
    </div>
    <div class="rangeLayer" id="rangeLayer" aria-hidden="true"></div>
    <div class="bars" id="bars"></div>
    <div class="baseline" aria-hidden="true"><span>0</span></div>
  </section>

  <p class="annotation" id="viewAnnotation" aria-live="polite"></p>
  <dl class="metrics" id="viewMetrics" aria-label="当前指标"></dl>
</main>
