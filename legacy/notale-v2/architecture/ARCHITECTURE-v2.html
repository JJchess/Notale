<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notale v2 Architecture</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #e9edf2;
      --paper: #fcfdfe;
      --ink: #172231;
      --muted: #687486;
      --hairline: #d7dee8;
      --blue: #2f78d6;
      --blue-soft: #eef5ff;
      --violet: #7652d6;
      --violet-soft: #f4f0ff;
      --green: #237650;
      --green-soft: #eff8f2;
      --green-node: #d7efdf;
      --green-line: #2f8a60;
      --slate: #7b8697;
      --slate-node: #eceff4;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 1080px;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      overflow: auto;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
      background:
        linear-gradient(rgba(23, 34, 49, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 34, 49, 0.035) 1px, transparent 1px),
        var(--canvas);
      background-size: 28px 28px;
    }

    main {
      width: 100%;
      height: 100dvh;
      padding: 32px;
      display: grid;
      place-items: center;
    }

    .architecture {
      width: min(100%, 1640px, calc((100dvh - 128px) * 1.6129));
      margin: 0;
      display: grid;
      gap: 12px;
    }

    .diagram {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 20px 42px rgba(23, 34, 49, 0.11));
    }

    .model-call,
    .tool-use,
    .decision,
    .terminal,
    .fixed {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 150ms ease, filter 150ms ease;
      animation: enter 320ms cubic-bezier(.2, .75, .25, 1) both;
    }

    .model-call:hover,
    .tool-use:hover,
    .decision:hover,
    .terminal:hover,
    .fixed:hover {
      transform: translateY(-1px);
      filter: drop-shadow(0 4px 5px rgba(23, 34, 49, 0.10));
    }

    text { user-select: none; }

    @keyframes enter {
      from { opacity: 0; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .model-call, .tool-use, .decision, .terminal, .fixed {
        animation: none;
        transition: none;
      }
    }

    @media print {
      body { background: white; }
      main { padding: 0; }
      .architecture { width: 100%; }
      .diagram { filter: none; }
    }
  </style>
</head>
<body>
<p style="padding:12px;text-align:center">历史架构，仅供追溯。当前入口：<a href="../../../notale-v2/ARCHITECTURE-v4.html">架构 v4</a> · <a href="../../../notale-v2/PLAN-style-control.md">风格契约</a></p>

    <figure class="architecture">
      <svg class="diagram" width="100%" viewBox="0 0 1000 620" role="img" aria-labelledby="diagram-title diagram-description" xmlns="http://www.w3.org/2000/svg">
      <title id="diagram-title">Notale v2 讲义生成流水线架构</title>
      <desc id="diagram-description">Planner 通常一次模型调用完成 deck 规划；每次响应必须同时提交 Write theme.css 与 Write pages.md 两个工具调用。harness 校验两个调用的目标与内容，合格后才落盘；不合格时把驳回原因写回下一次请求，总尝试最多三次，仍失败则写 deck.rejected.json 并走终止分支。随后 harness 固定执行逐页切分、可选图池和 briefs.json 生成。Builder 按页面标签路由到四个 workflow，再由 ThreadPoolExecutor 并发运行 N 个相互独立的 build_one 页面循环；图中以三层错位卡片表示这些并发实例。每个实例维护追加式 history：模型响应含一到多个工具调用时，harness 按列出顺序执行典型的读取、生成修改与验收工具，并把全部 tool results 追加回同一 history；响应不含工具时终止。循环结束后独立审计，最后把逐次调用、run 元数据与逐页结果写入三份记录文件。</desc>

        <title>ThreadPoolExecutor 按 --concurrency 并发运行选中的页面；每页拥有独立 history 和 build_one() 循环。guard 只隔离 build_one() 内的单页异常，其他页继续执行</title>
      </g>

      <!-- one build_one session: model response branches into a visible tool-result ring -->
      <g class="model-call" data-node-type="model-call" style="animation-delay: 270ms">
        <rect x="594" y="344" width="188" height="44" rx="6" fill="white" stroke="var(--blue)" stroke-width="0.8"/>
        <text x="688" y="358" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="var(--blue)">模型响应</text>
        <text x="688" y="375" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="var(--ink)">0 或 1..n 个工具调用</text>
        <title>IDENTITY 要求通常 4–7 次、最多 11 次响应，但 RESPONSE_TARGET=11 只是提示与事后统计，harness 不会在第 11 次强制截断；harness 不做创作状态机、不补催、不重启</title>
      </g>
      <path d="M594 360H568" fill="none" stroke="var(--green-line)" stroke-width="1.2" marker-end="url(#arrow-green)"/>

      <g class="tool-use" data-node-type="tool-use" style="animation-delay: 300ms">
        <rect x="378" y="344" width="188" height="140" rx="6" fill="var(--green-node)" fill-opacity="0.45" stroke="var(--green-line)" stroke-width="0.7"/>
        <text x="472" y="357" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#174f38">工具调用 · 典型路径</text>
        <text x="472" y="372" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#287052">同一响应 1..n 个 · 按列出顺序</text>

        <rect x="388" y="382" width="168" height="22" rx="4" fill="white" stroke="var(--green-line)" stroke-width="0.5"/>
        <text x="472" y="393" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="#174f38">读证据 · Read / Look*</text>
        <path d="M472 404V408" fill="none" stroke="var(--green-line)" stroke-width="1" marker-end="url(#arrow-green)"/>

        <rect x="388" y="410" width="168" height="40" rx="4" fill="#c9e9d5" stroke="var(--green-line)" stroke-width="0.5"/>
        <text x="472" y="421" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#174f38">普通页 · Write / Patch / Bash</text>
        <text x="472" y="439" text-anchor="middle" dominant-baseline="central" font-size="9.2" fill="#174f38">代码页 · CodeScaffold / Write / Edit</text>
        <path d="M472 450V454" fill="none" stroke="var(--green-line)" stroke-width="1" marker-end="url(#arrow-green)"/>

        <rect x="388" y="456" width="168" height="22" rx="4" fill="white" stroke="var(--green-line)" stroke-width="0.5"/>
        <text x="472" y="467" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="#174f38">验收证据 · Check</text>
        <title>这是提示词引导的典型工具路径，不是 harness 强制状态机。普通视觉页暴露 Read、Write、Patch、Check、Bash，并在 vision_input=true 时暴露 Look；代码页暴露 CodeScaffold、Read、Write、Edit、Check，并同样按 vision_input 决定是否暴露 Look。同一响应可选择其中任意一个或多个调用，harness 严格按模型列出的顺序执行。提示词要求把已确认修正合并成一次 Patch；代码页外壳和运行时只读，只能编辑 CodeScaffold 返回的 lesson 文件</title>
      </g>

      <path d="M472 478V490" fill="none" stroke="var(--green-line)" stroke-width="1.2" marker-end="url(#arrow-green)"/>
      <g class="fixed" data-node-type="tool-results" style="animation-delay: 315ms">
        <rect x="378" y="492" width="188" height="26" rx="5" fill="white" stroke="var(--green-line)" stroke-width="0.7"/>
        <text x="472" y="505" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="500" fill="var(--green)">tool results → 追加 history</text>
        <title>每个 function_call_output 都追加到本页 history；Check 或 Look 返回的图片再作为 user image 追加。完成整批后进入下一次模型调用</title>
      </g>
      <path d="M566 505H580V376H592" fill="none" stroke="var(--green-line)" stroke-width="1.2" marker-end="url(#arrow-green)"/>

      <!-- zero-tool response leaves the ring -->
      <path d="M688 388V400" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow-muted)"/>
      <g class="terminal" data-node-type="termination" style="animation-delay: 330ms">
        <rect x="594" y="402" width="188" height="46" rx="5" fill="white" stroke="var(--muted)" stroke-width="0.7" stroke-dasharray="3 2"/>
        <text x="688" y="415" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="var(--ink)">0 tool → 循环终止</text>
        <text x="688" y="433" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="var(--muted)">另含超时 · 页内异常</text>
        <title>三类退出汇合：模型响应不含工具调用时自然停止；新一轮开始前发现单页墙钟超过 3600 秒时停止；build_one() 抛出的页内异常由 guard 捕获。三者之后都运行独立审计</title>
      </g>

      <g class="fixed" data-node-type="deterministic" style="animation-delay: 360ms">
        <rect x="594" y="462" width="188" height="56" rx="5" fill="var(--slate-node)" stroke="var(--slate)" stroke-width="0.7"/>
        <text x="688" y="474" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#3d4859">运行时兜底</text>
        <text x="688" y="491" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--muted)">&gt;150k → 仅留最近 2 图</text>
        <text x="688" y="507" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--muted)">3600s 后不再开新轮</text>
        <title>evict_images() 只在已完成调用的输入峰值超过 150,000 token 时改写旧图片消息，并保留最近两张；否则 append-only 历史一个字节都不动，以保留可复用前缀。MAX_SECONDS=3600 在每次新模型调用前检查，不会取消已经发出的请求</title>
      </g>
      <path d="M688 462V450" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow-muted)"/>

      <!-- every page termination is audited once; audit never re-enters the loop -->
      <path d="M782 425H812V350H826" fill="none" stroke="var(--violet)" stroke-width="1.2" marker-end="url(#arrow-violet)"/>
      <g class="fixed" data-node-type="deterministic" style="animation-delay: 390ms">
        <rect x="828" y="306" width="144" height="224" rx="8" fill="var(--violet-soft)" stroke="var(--violet)" stroke-width="0.7"/>
        <text x="900" y="326" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="var(--violet)">独立审计</text>
        <text x="900" y="348" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--ink)">任一终止后 · 一次</text>
        <text x="900" y="370" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="var(--violet)">结果绝不回喂</text>
        <text x="900" y="400" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--muted)">致命错误</text>
        <text x="900" y="420" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--muted)">视觉警告</text>
        <text x="900" y="440" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--muted)">代码页工作台自检</text>
        <text x="900" y="470" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--muted)">token 账 · 步数</text>
        <text x="900" y="490" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--muted)">缓存命中 · 终止原因</text>
        <title>build_one() 因无工具响应或超时退出后都会调用 audit_delivery()；guard 捕获页内 agent 异常后也会调用。目标缺失直接记致命错误；其余页面运行一次无截图 Check，代码页再加工作台浏览器自检。审计与产物分开记录，结果绝不回喂模型</title>
      </g>

      <!-- common outputs from the concurrent batch and its audits -->
      <path d="M472 518V540" fill="none" stroke="var(--slate)" stroke-width="1"/>
      <path d="M900 530V540" fill="none" stroke="var(--violet)" stroke-width="1"/>
      <g class="fixed" data-node-type="outputs" style="animation-delay: 420ms">
        <rect x="350" y="542" width="622" height="30" rx="5" fill="white" stroke="var(--slate)" stroke-width="0.7"/>
        <text x="366" y="557" dominant-baseline="central" font-size="11" font-weight="500" fill="#3d4859">outputs</text>
        <rect x="416" y="548" width="100" height="18" rx="4" fill="var(--slate-node)"/>
        <text x="466" y="557" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#3d4859">page-NN.html</text>
        <rect x="524" y="548" width="88" height="18" rx="4" fill="var(--slate-node)"/>
        <text x="568" y="557" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#3d4859">trace.jsonl</text>
        <rect x="620" y="548" width="154" height="18" rx="4" fill="var(--slate-node)"/>
        <text x="697" y="557" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#3d4859">builder-manifest.json</text>
        <rect x="782" y="548" width="158" height="18" rx="4" fill="var(--violet-soft)"/>
        <text x="861" y="557" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="var(--violet)">builder-results.json</text>
        <title>页面循环写 page-NN.html；每次模型调用追加 trace.jsonl；builder-manifest.json 在 run 开始与结束时记录 profile、并发臂和汇总；全部页面完成后，builder-results.json 写逐页终止原因、审计、usage 和工具轨迹</title>
      </g>
      </svg>
    </figure>
