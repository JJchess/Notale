<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notale v2 Architecture · v3 修订（媒体 + 视觉主题包）</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #e9edf2;
      --paper: #fcfdfe;
      --ink: #172231;
      --muted: #687486;
      --hairline: #d7dee8;
      --blue: #2f78d6;
      --blue-soft: #eef5ff;
      --violet: #7652d6;
      --violet-soft: #f4f0ff;
      --green: #237650;
      --green-soft: #eff8f2;
      --green-node: #d7efdf;
      --green-line: #2f8a60;
      --slate: #7b8697;
      --slate-node: #eceff4;
      --amber: #b45309;
      --amber-soft: #fff4e5;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 1080px;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      overflow: auto;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
      background:
        linear-gradient(rgba(23, 34, 49, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 34, 49, 0.035) 1px, transparent 1px),
        var(--canvas);
      background-size: 28px 28px;
    }

    main {
      width: 100%;
      height: 100dvh;
      padding: 32px;
      display: grid;
      place-items: center;
    }

    .architecture {
      width: min(100%, 1720px, calc((100dvh - 128px) * 1.7143));
      margin: 0;
      display: grid;
      gap: 12px;
    }

    .diagram {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 20px 42px rgba(23, 34, 49, 0.11));
    }

    .model-call,
    .tool-use,
    .decision,
    .terminal,
    .fixed {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 150ms ease, filter 150ms ease;
    }

    .model-call:hover,
    .tool-use:hover,
    .decision:hover,
    .terminal:hover,
    .fixed:hover {
      transform: translateY(-1px);
      filter: drop-shadow(0 4px 5px rgba(23, 34, 49, 0.10));
    }

    text { user-select: none; }

    @keyframes enter {
      from { opacity: 0; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .model-call, .tool-use, .decision, .terminal, .fixed {
        animation: none;
        transition: none;
      }
    }

    @media print {
      body { background: white; }
      main { padding: 0; }
      .architecture { width: 100%; }
      .diagram { filter: none; }
    }
  </style>
</head>

<desc id="diagram-description">媒体 A 已验证，Director 已默认开启；其余风格升级待实施。唯一实施依据为 PLAN-style-control.md。编排先 seed，Planner 与 Director 独立并行，不交换页表或概念映射；两者成功后启动 N 路 Builder。Director 自动选样后看图写主题；用户参考跳过选样，有效成品主题无修改要求则直接复用。主题以 CSS、INTERFACE 与本地资源表达；html 的 data-variant 同时选择背景与前景，stage 多重背景原生合成，品牌层独立。公共承载面许可收紧，具名局部实现允许；修订保留候选与错误。视觉页只预载主题接口，按需提供用户样张，不全量注入 CSS；代码页保持隔离。复杂背景报告未测区域并实际看图。琥珀色节点和“改”表示待实施设计。</desc>
