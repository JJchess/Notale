<!doctype html><html><head><meta charset="utf-8"></head><body><script>
const channel=new URL(location.href).searchParams.get('channel');
function initialize(event){
 if(event.source!==parent||event.data?.source!=='notale-film-init'||event.data.channel!==channel)return;
 window.removeEventListener('message',initialize);
 document.open();document.write(event.data.html);document.close();
}
window.addEventListener('message',initialize);
parent.postMessage({source:'notale-film-shell',channel},'*');
</script></body></html>
