name: notale-film
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: film_editor
      POSTGRES_PASSWORD: film-editor-local
      POSTGRES_DB: film_editor
    # Avoid allocating a shared Docker subnet; bind only the reserved loopback port.
    network_mode: host
    command: ["postgres", "-p", "55449", "-c", "listen_addresses=127.0.0.1"]
    volumes:
      - ../../../.local/motale-film/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 55449 -U film_editor -d film_editor"]
      interval: 2s
      timeout: 2s
      retries: 15
