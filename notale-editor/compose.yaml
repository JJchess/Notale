services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notale_editor
      POSTGRES_PASSWORD: local-editor-development
      POSTGRES_DB: notale_editor
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - editor_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notale_editor"]
      interval: 2s
      retries: 20
volumes:
  editor_pg:
