<style>
:root { color-scheme: light; --canvas: #e9edf2; --ink: #172231; --muted: #687486;

* { box-sizing: border-box; }
html, body { margin: 0; min-width: 1080px; min-height: 100%; }
body { display: grid; place-items: center; color: var(--ink); background:
       linear-gradient(rgba(23,34,49,.035) 1px, transparent 1px),
       linear-gradient(90deg, rgba(23,34,49,.035) 1px, transparent 1px), var(--canvas);
       background-size: 28px 28px;
       font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; }
main { width: 100%; min-height: 100dvh; padding: 32px; display: grid; place-items: center; }
.architecture { width: min(100%, 1720px, calc((100dvh - 200px) * 3.16)); margin: 0; display: grid; gap: 12px; }
.diagram { display: block; width: 100%; height: auto;
           filter: drop-shadow(0 20px 42px rgba(23,34,49,.11)); }
[data-node] { transform-box: fill-box; transform-origin: center;
              transition: transform 150ms ease, filter 150ms ease; }
[data-node]:hover { transform: translateY(-1px); filter: drop-shadow(0 4px 5px rgba(23,34,49,.1)); }
text { user-select: none; }
figcaption { font-size: 13px; line-height: 1.7; background: var(--paper); padding: 14px 18px;
             border-radius: 10px; }
figcaption p { margin: 0 0 8px; color: var(--muted); }
figcaption p:first-child { color: var(--ink); }
figcaption p:last-child { margin-bottom: 0; }
figcaption code { font-size: 12px; }
@media (prefers-reduced-motion: reduce) { [data-node] { transition: none; } }
@media print { body { background: white; } main { padding: 0; } .diagram { filter: none; } }
</style>

<figcaption>
<p>每轮只发两条消息：一条恒定的 <code>SYSTEM</code>（1028 字符：命令词表、硬性限制、插入互动怎么写），一条由 <code>prompt()</code> 现拼的 user。</p>
<p><strong>主题</strong>按 <code>doc.theme → layout.theme → slide.theme</code> 三层合并，后盖前，和 <code>render.ts:105-111</code> 渲染时同一套顺序；各层先过 <code>rebaseTheme</code> 按页面路径重写相对资源，否则深层页面引的图会指错。<strong>页面感知</strong>是两半：<code>describeSlide()</code> 给对象清单（<code>inspectSlide()</code> 去掉 <code>html</code>，留 7 个字段，<code>text</code> 截 120 字），<code>pageCss()</code> 给页面样式（页内 <code>&lt;style&gt;</code> 加 <code>&lt;link&gt;</code> 解析后的资产正文，≤ 8 KB）。后者是 class 驱动页面能跟色的前提——那种页的对象身上一个颜色一个字体都没有。</p>
<p>刻意不做的：不摘要调色板（会丢掉 class → 颜色的对应关系，而模型要的正是这个对应）、不主动灌其它页面（大纲内联、正文与截图按需 Read/Look）、不给资产正文。<strong>唯一的已知缺口</strong>是预置风格与模板库——作者在 UI 里选了哪套预设，模型不知道，只能从合并后的主题变量和页面 CSS 反推。</p>
<p><strong>循环</strong>由 <code>@earendil-works/pi-agent-core</code> 驱动：模型有四个 tool——<code>List / Read / Look</code> 读讲义任一页，<code>Patch</code> 一次提交本轮全部改动，它的 <code>execute</code> 就是整条闸门（词表 → zod → 按页作用域 → 试跑）；过了 <code>terminate</code>，没过 throw，原因作为 tool 结果回给模型，下一轮自改，最多 16 轮。每次发请求前 <code>pruneContext()</code> 按预算折叠最旧的读取结果。模型不调 tool 直接回话也允许，前端当一轮显示。<strong>页面截图</strong>复用 PosterService，与侧栏缩略图同一缓存 key；实测带图 1 轮 3.2 s 把三条要点等距拉开，不带图 2 轮 9.2 s。细节见 <code>notale-editor/docs/AI-EDITS.md</code>。</p>
