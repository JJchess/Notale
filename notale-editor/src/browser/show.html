<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notale · 放映</title>
    <link rel="stylesheet" href="/reveal.css" />
    <style>
      body {
        margin: 0;
        background: #171d2b;
        color: #edf2fc;
        font: 14px system-ui;
      }
      .reveal {
        height: calc(100vh - 54px);
      }
      .reveal .slides section {
        height: 100%;
        padding: 0;
      }
      .reveal iframe {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        border: 0;
        margin: 0;
      }
      .controls-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 20;
        background: #171d2b;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      button {
        background: #2b3650;
        color: white;
        border: 1px solid #465571;
        padding: 7px 14px;
        border-radius: 5px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #control-status {
        color: #a5b6d2;
        font-size: 12px;
      }
      button:focus-visible {
        outline: 3px solid #9db5ff;
      }
      #counter {
        font: 13px monospace;
      }
      #speaker-panel {
        display: none;
      }
      body.speaker .reveal {
        width: 68vw;
        height: 70vh;
      }
      body.speaker #speaker-panel {
        display: block;
        position: absolute;
        left: 70vw;
        top: 20px;
        right: 20px;
        bottom: 70px;
        overflow: auto;
      }
      #next-preview {
        width: 100%;
        aspect-ratio: 16/9;
        border: 0;
        background: white;
      }
      #notes {
        white-space: pre-wrap;
        font-size: 17px;
        line-height: 1.9;
      }
      #timer {
        font: 32px monospace;
        margin: 15px 0;
      }
      .speaker-title {
        font-size: 12px;
        color: #a5b6d2;
      }
      body.blank .reveal {
        visibility: hidden;
      }
      .reveal .slide-number {
        font: 16px monospace;
        background: #1d274bcc;
      }
      #show-step {
        max-width: 260px;
        padding: 6px;
      }
      #step-title {
        font-size: 18px;
      }
      #next-step {
        font-size: 13px;
        color: #a5b6d2;
      }
      #error {
        color: #ffbd9c;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <div class="reveal"><div class="slides" id="slides"></div></div>
    <aside id="speaker-panel">
      <p class="speaker-title">下一页</p>
      <iframe
        id="next-preview"
        sandbox="allow-scripts allow-same-origin allow-forms"
        title="下一页预览"
      ></iframe>
      <div id="timer">00:00</div>
      <button id="reset-timer">重置计时</button>
      <p class="speaker-title">演讲者备注</p>
      <h2 id="step-title"></h2>
      <p id="next-step"></p>
      <div id="notes"></div>
    </aside>
    <nav class="controls-bar">
      <button id="prev">←</button><span id="counter"></span
      ><select id="show-step" aria-label="讲授步骤"></select
      ><button id="next">→</button><button id="overview">总览</button
      ><button id="blank">黑屏</button><button id="fullscreen">全屏</button
      ><button id="speaker">演讲者视图</button><button id="audience">打开观众窗口</button>
      <span id="control-status" role="status"></span
      ><button id="take-control" hidden>接管放映</button>
    </nav>
    <div id="error" role="alert"></div>
    <script type="module" src="/show.js"></script>
  </body>
</html>
