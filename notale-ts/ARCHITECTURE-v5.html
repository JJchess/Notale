<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notale TS Architecture · v5 现状</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #e9edf2;
      --paper: #fcfdfe;
      --ink: #172231;
      --muted: #687486;
      --hairline: #d7dee8;
      --blue: #2f78d6;
      --blue-soft: #eef5ff;
      --violet: #7652d6;
      --violet-soft: #f4f0ff;
      --green: #237650;
      --green-soft: #eff8f2;
      --green-node: #d7efdf;
      --green-line: #2f8a60;
      --slate: #7b8697;
      --slate-node: #eceff4;
      --band: #f6f8fa;
      --band-line: #e2e8f0;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 1080px;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      overflow: auto;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
      background:
        linear-gradient(rgba(23, 34, 49, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 34, 49, 0.035) 1px, transparent 1px),
        var(--canvas);
      background-size: 28px 28px;
    }

    main {
      width: 100%;
      min-height: 100dvh;
      padding: 32px;
      display: grid;
      place-items: center;
    }

    .architecture {
      width: min(100%, 1720px, calc((100dvh - 128px) * 1.875));
      margin: 0;
      display: grid;
      gap: 12px;
    }

    .diagram {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 20px 42px rgba(23, 34, 49, 0.11));
    }

    .model-call,
    .tool-use,
    .decision,
    .terminal,
    .fixed {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 150ms ease, filter 150ms ease;
    }

    .model-call:hover,
    .tool-use:hover,
    .decision:hover,
    .terminal:hover,
    .fixed:hover {
      transform: translateY(-1px);
      filter: drop-shadow(0 4px 5px rgba(23, 34, 49, 0.10));
    }

    text { user-select: none; }

    figcaption { font-size: 13px; line-height: 1.65; }
    figcaption table { width: 100%; border-collapse: collapse; background: var(--paper); }
    figcaption th, figcaption td { padding: 9px 14px; border-bottom: 1px solid var(--hairline); text-align: left; vertical-align: top; }
    figcaption th { width: 150px; font-weight: 500; white-space: nowrap; }
    figcaption p { margin: 8px 0 0; color: var(--muted); }
    figcaption a { color: var(--blue); }

    @media (prefers-reduced-motion: reduce) {
      .model-call, .tool-use, .decision, .terminal, .fixed {
        animation: none;
        transition: none;
      }
    }

    @media print {
      body { background: white; }
      main { padding: 0; }
      .architecture { width: 100%; }
      .diagram { filter: none; }
    }
  </style>
</head>

<g aria-label="N 路并发的页面 agent"><title>按页型路由与每 workflow 的共享前缀在循环前一次性做完，outputs 与交付是循环结束后的汇总；中间这一整段才是按 --concurrency（默认 100）并发的，交付审计闸也在每页自己的循环里。每页有自己的 history、自己的 buildOne() 循环和自己的 trace 会话 ID，互不共享上下文。代码页在进循环之前由宿主先建好观察者脚手架，把 CURRENT FILES 清单写进首条 user 消息，模型不再自己调脚手架工具。单页抛异常由 buildRun 捕获，记 agent_exception 并补跑一次交付审计，其他页照跑；worker 本身的拒绝才会让整批失败。IDENTITY 建议通常 4–7 次、最多 11 次响应，RESPONSE_TARGET=11 只进统计不强制截断。取消信号一路穿到模型调用、工具与浏览器。</title><rect x="564" y="280" width="608" height="248" rx="8" fill="var(--slate-node)" stroke="var(--slate)" stroke-width="0.6"/><text x="580" y="288" text-anchor="start" dominant-baseline="central" font-size="9" font-weight="500" fill="var(--muted)">page-NN · buildOne()</text><rect x="556" y="292" width="616" height="236" rx="8" fill="#f3f5f8" stroke="var(--slate)" stroke-width="0.6"/><text x="572" y="300" text-anchor="start" dominant-baseline="central" font-size="9" font-weight="500" fill="var(--muted)">page-02 · buildOne()</text><rect x="548" y="308" width="624" height="220" rx="8" fill="white" stroke="var(--slate)" stroke-width="1"/><path d="M548 336H1172" fill="none" stroke="var(--hairline)" stroke-width="0.6"/><text x="564" y="322" text-anchor="start" dominant-baseline="central" font-size="10.5" font-weight="600" fill="var(--ink)">page-01 · buildOne()</text></g>
<g class="tool-use" data-node-type="tool"><rect x="564" y="344" width="240" height="176" rx="6" fill="var(--green-node)" fill-opacity="0.45" stroke="var(--green-line)" stroke-width="1"/><text x="684" y="358" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="600" fill="#174f38">agent 循环</text><rect x="576" y="364" width="216" height="16" rx="4" fill="white" stroke="var(--green-line)" stroke-width="0.6"/><text x="684" y="372" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="500" fill="#174f38">Read · ImageSearch · ImageGen</text><rect x="604" y="388" width="160" height="24" rx="4" fill="#c9e9d5" stroke="var(--green-line)" stroke-width="1"/><text x="684" y="400" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="600" fill="#174f38">Write</text><rect x="604" y="420" width="160" height="24" rx="4" fill="white" stroke="var(--green-line)" stroke-width="1"/><text x="684" y="432" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="600" fill="#174f38">Check</text><path d="M684 452L764 468L684 484L604 468Z" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1"/><text x="684" y="468" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="500" fill="var(--blue)">还有违约？</text><rect x="604" y="492" width="160" height="24" rx="4" fill="#c9e9d5" stroke="var(--green-line)" stroke-width="1"/><text x="684" y="504" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="600" fill="#174f38">Patch</text><title>这个面板就是本页循环的一轮：菱形是模型的那一次响应（ModelRuntime.respondCanonical，按 5 / 15 / 40 / 90 / 180 / 300 / 300 / 300 秒加抖动退避重试；三种线协议由 adapter 适配，请求体统一是 Responses 形状），绿色的是它在这次响应里点的工具。菱形是模型看完 Check 结果后的下一次响应：还有具体违约就把已确认的问题合并成一次修补再接 Check，证据完整就不再调用任何工具。Write 与它下面的 Check、Patch 与它回到的 Check，各自是同一次模型响应里的两个调用 —— IDENTITY 要求写入或修正后同轮接 Check。这个节律由提示词规定，harness 不强制：一次响应可以带任意几个工具调用，按它们列出的顺序整批执行完才进下一次模型调用。首轮按页型 SKILL 的加载规则取材料并按需取图；材料够了直接写完整首版、不写占位空壳，并在同一响应里接 Check；之后每轮把已确认的问题合并成一次修补再接 Check；证据完整且没有具体违约时，下一次响应直接结束。两类页面都用 Patch 做局部修正，Write 只用于创建或整体重构。代码页的工作台由宿主预建、当前文件与 observer 参考已预载，Read 非必需。每个工具输出都追加进本页 history，Check、Read 与取图返回的图片再作为独立的 user image 消息追加在这些输出之后；整批执行完才进入下一次模型调用。每轮末尾还跑一次上下文回收：已完成调用的输入峰值超过 CONTEXT_SOFT=150,000 token 时改写旧图片消息、保留最近 KEEP_IMAGES=2 张，否则只追加的历史一个字节都不动，以保住可复用前缀；同一轮里 Bash 硬超时 120 秒，工具输出截到 3 万字符（workflow 资源放宽到 16 万）。看图合并在 Check 里：Playwright Chromium 以 1600×900 打开页面，默认等 1200 ms，收 pageerror、console.error、失败请求与 HTTP ≥400，另跑一次 800×450 的契约探针；整页截图落盘前缩到 800×450，局部按 box 裁切、zoom 默认 2，至多内联首末两张，其余给路径供 Read。非视觉 profile 强制 shot=false 并摘掉 box/zoom，只拿文本报告。视觉页暴露 Read、Write、Patch、Check、Bash（开 vision_input 才追加 ImageSearch / ImageGen）；代码页只暴露 Read、Write、Patch、Check，没有 Bash —— 脚手架不再是模型工具，进循环前由宿主建好，文件清单以 CURRENT FILES 写进首条 user 消息，模型只能改宿主声明的四个观察者课程文件 starter.py、observe.py、tests.py、view/render.js。有内容文件时两类都追加 SearchSources / ReadSource。派发前的越界检查把路径锁在 pages/ 内，assets/sources 与别页的 assets/img 只读，别页的 page-NN.html 一律拒绝；代码页再过 codeGuard，只能改 assets/lessons/&amp;lt;pid&amp;gt;/lesson/** 且只能 Check 本页。代码页每次 Check 后追加真工作台检查（Monaco 与 Pyodide 跑 run / step / reset），至多并两张截图。</title></g>

      <figcaption>
        <p class="lead"><b>图 1</b> · 两条独立并行的规划分支汇合之后，才启动 N 路并发的页面 agent 循环；每页的自然结束都要先过交付审计闸。</p>
        <p>默认模型：Planner、Style Director 与视觉 Builder 用 Gemini 3.8 Flash low（<code>gemini38-google-low</code>），代码 Builder 用 DeepSeek V4 Flash low（<code>deepseek-v4-flash-low</code>，不接收图片输入）；Director 与 Planner 共用同一个 <code>ModelRuntime</code> 实例，只能整体替换，显式 profile 与 <code>--uniform</code> 可覆盖默认，一切以每次的 manifest 与 trace 为准。</p>
        <p>模型调用边界：Director 的 auto 路线最短是选方向加写主题两次，reuse 为零次；参考图、修改与精确命中的 <code>--style</code> 跳过选方向，但 Read、媒体工具与技术修订都会增加响应次数。Builder 的响应目标 11 次只进统计（<code>within_response_target</code>），不强制截断；模型响应数不等于媒体工具内部的 API 请求数。</p>
        <p>终止与审计：只有 <code>no_tool_use</code>、<code>max_seconds</code>、<code>agent_exception</code> 三类。模型不再调用工具时先跑交付审计，有致命错误就 <code>premature_stops++</code> 退回重来 —— 视觉页在同一 history 上原样重来、不回喂审计结论，代码页则会把本次响应与交付检查结果一起推回 history；审计结论只进 <code>trace.jsonl</code> 与 <code>builder-results.json</code>。重来不计次数，视觉页由 <code>MAX_SECONDS=3600</code> 兜住，代码页另有整页 480 秒与单次请求 300 秒的硬超时。页面要「产物存在 + <code>no_tool_use</code> + 审计无致命错误」三条全中才算 ready，否则整个 run 在 polish 阶段失败。</p>
