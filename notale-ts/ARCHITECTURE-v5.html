<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notale TS Architecture · v5 现状</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #e9edf2;
      --paper: #fcfdfe;
      --ink: #172231;
      --muted: #687486;
      --hairline: #d7dee8;
      --blue: #2f78d6;
      --blue-soft: #eef5ff;
      --violet: #7652d6;
      --violet-soft: #f4f0ff;
      --green: #237650;
      --green-soft: #eff8f2;
      --green-node: #d7efdf;
      --green-line: #2f8a60;
      --slate: #7b8697;
      --slate-node: #eceff4;
      --band: #f6f8fa;
      --band-line: #e2e8f0;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 1080px;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      overflow: auto;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
      background:
        linear-gradient(rgba(23, 34, 49, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 34, 49, 0.035) 1px, transparent 1px),
        var(--canvas);
      background-size: 28px 28px;
    }

    main {
      width: 100%;
      min-height: 100dvh;
      padding: 32px;
      display: grid;
      place-items: center;
    }

    .architecture {
      width: min(100%, 1720px, calc((100dvh - 128px) * 1.875));
      margin: 0;
      display: grid;
      gap: 12px;
    }

    .diagram {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 20px 42px rgba(23, 34, 49, 0.11));
    }

    .model-call,
    .tool-use,
    .decision,
    .terminal,
    .fixed {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 150ms ease, filter 150ms ease;
    }

    .model-call:hover,
    .tool-use:hover,
    .decision:hover,
    .terminal:hover,
    .fixed:hover {
      transform: translateY(-1px);
      filter: drop-shadow(0 4px 5px rgba(23, 34, 49, 0.10));
    }

    text { user-select: none; }

    figcaption { font-size: 13px; line-height: 1.65; }
    figcaption table { width: 100%; border-collapse: collapse; background: var(--paper); }
    figcaption th, figcaption td { padding: 9px 14px; border-bottom: 1px solid var(--hairline); text-align: left; vertical-align: top; }
    figcaption th { width: 150px; font-weight: 500; white-space: nowrap; }
    figcaption p { margin: 8px 0 0; color: var(--muted); }
    figcaption a { color: var(--blue); }

    @media (prefers-reduced-motion: reduce) {
      .model-call, .tool-use, .decision, .terminal, .fixed {
        animation: none;
        transition: none;
      }
    }

    @media print {
      body { background: white; }
      main { padding: 0; }
      .architecture { width: 100%; }
      .diagram { filter: none; }
    }
  </style>
</head>

<title id="diagram-title">Notale 互动讲义流水线 · v5：notale-ts 生成后端的实际实现</title>
<desc id="diagram-description">2026-09-15 按 notale-ts 工作树核对；画面只画阶段、分支、循环与产物，开关名、默认值、阈值与属性说明都在节点的悬停文本里。配色只有一条轴 —— 这一步是谁在做：蓝是模型响应，绿是模型点、harness 执行的工具，灰是 harness 固定流程，虚线是终止或可选；分栏不带色，紫线只表示跨阶段交接与审计裁决。CLI 与 Fastify 共用同一个 core：RunService 按 ideate / create / polish 三阶段跑，RunStore 写 run.json 快照与有序 events.jsonl，回放与订阅在同一队列槽内完成，SSE 重连没有历史与实时的缝。planRun 里 Planner 分支（可选的 Sources.prepare 串在它前面）与默认开启的 Style Director 分支独立并行，互不读对方产物，用 Promise.allSettled 汇合，两路都成功才发布 briefs 并启动并发 Builder。Director 有 reuse / modify / reference / auto 四条路线，pptx 模板走另一套 Director，--no-style-director 则整列不跑；auto 看轻索引与接触印相表选样，选中详情、原图与中英字体声明自动预载，pick 与 theme 共用同一 history。Builder 按页型一对一路由四个 workflow，每页独立 history；视觉页默认 Gemini 3.8 Flash low，代码页默认 DeepSeek V4 Flash low。模型不再调用工具时先跑交付审计，有致命错误就退回重来且不回喂，通过才算自然结束；终止只有三类。产物经 lecturePreview 与 publishOutput 交付，再由 publication 与 .notale v1 打包，均不调用模型。</desc>

</g>

        <title>这个面板就是本页循环的一轮：菱形是模型的那一次响应（ModelRuntime.respondCanonical，按 5 / 15 / 40 / 90 / 180 / 300 / 300 / 300 秒加抖动退避重试；三种线协议由 adapter 适配，请求体统一是 Responses 形状），绿色的是它在这次响应里点的工具。菱形是模型看完 Check 结果后的下一次响应：还有具体违约就把已确认的问题合并成一次修补再接 Check，证据完整就不再调用任何工具。Write 与它下面的 Check、Patch 与它回到的 Check，各自是同一次模型响应里的两个调用 —— IDENTITY 要求写入或修正后同轮接 Check。这个节律由提示词规定，harness 不强制：一次响应可以带任意几个工具调用，按它们列出的顺序整批执行完才进下一次模型调用。首轮按页型 SKILL 的加载规则取材料并按需取图；材料够了直接写完整首版、不写占位空壳，并在同一响应里接 Check；之后每轮把已确认的问题合并成一次修补再接 Check；证据完整且没有具体违约时，下一次响应直接结束。两类页面都用 Patch 做局部修正，Write 只用于创建或整体重构。代码页的工作台由宿主预建、当前文件与 observer 参考已预载，Read 非必需。每个工具输出都追加进本页 history，Check、Read 与取图返回的图片再作为独立的 user image 消息追加在这些输出之后；整批执行完才进入下一次模型调用。每轮末尾还跑一次上下文回收：已完成调用的输入峰值超过 CONTEXT_SOFT=150,000 token 时改写旧图片消息、保留最近 KEEP_IMAGES=2 张，否则只追加的历史一个字节都不动，以保住可复用前缀；同一轮里 Bash 硬超时 120 秒，工具输出截到 3 万字符（workflow 资源放宽到 16 万）。看图合并在 Check 里：Playwright Chromium 以 1600×900 打开页面，默认等 1200 ms，收 pageerror、console.error、失败请求与 HTTP ≥400，另跑一次 800×450 的契约探针；整页截图落盘前缩到 800×450，局部按 box 裁切、zoom 默认 2，至多内联首末两张，其余给路径供 Read。非视觉 profile 强制 shot=false 并摘掉 box/zoom，只拿文本报告。视觉页暴露 Read、Write、Patch、Check、Bash（开 vision_input 才追加 ImageSearch / ImageGen）；代码页只暴露 Read、Write、Patch、Check，没有 Bash —— 脚手架不再是模型工具，进循环前由宿主建好，文件清单以 CURRENT FILES 写进首条 user 消息，模型只能改宿主声明的四个观察者课程文件 starter.py、observe.py、tests.py、view/render.js。有内容文件时两类都追加 SearchSources / ReadSource。派发前的越界检查把路径锁在 pages/ 内，assets/sources 与别页的 assets/img 只读，别页的 page-NN.html 一律拒绝；代码页再过 codeGuard，只能改 assets/lessons/&lt;pid&gt;/lesson/** 且只能 Check 本页。代码页每次 Check 后追加真工作台检查（Monaco 与 Pyodide 跑 run / step / reset），至多并两张截图。</title>
