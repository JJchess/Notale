<p class="lead"><b>图 1</b> · 单页 artifact 与多页讲义是两条并列的编排，复用同一个页面 agent 循环与同一套工具；改动是新增一条编排，加三处按模式分叉。</p><p>六处「改」：CLI 按 mode 派发（<code>cli/main.ts</code>）、<code>seed()</code> 加模式参数（<code>orchestration.ts:25</code>）、新文件 <code>core/artifact.ts</code> 的 <code>planArtifact</code> 与 <code>buildArtifact</code>、<code>instructionBlocks()</code> 加一个提前返回（<code>builder-context.ts:91</code>）、Check 的探针按模式分叉、<code>publishArtifact()</code> 新出口（与 <code>publication.ts:204</code> 并列）。</p><p>刻意不动的：<code>PAGE_WORKFLOWS</code> 不加 <code>build-artifact</code>，于是 planner 描述、<code>workflow_profiles</code> 校验、模板版式表与全部 parity 测试零改动；单页不写 <code>pages.md</code>，于是 <code>routePage()</code>、<code>briefs()</code>、页头四标签正则与 <code>LABEL_WORKFLOWS</code> 都不用碰；循环本身、<code>auditDelivery()</code> 交付闸、Style Director、<code>baseline-pipeline</code> 与 RunService 一行不改。</p><p>Check 那处分叉比看上去深：<code>selfcheck-probe.json</code> 的 <code>PROBE</code> 把契约体内联在自己第一条语句里并提前返回，只加一个 <code>CONTRACT_FREE</code> 不够，必须给 <code>PROBE</code> 加一个默认参数；<code>check.ts</code> 里写死的 1600×900 裁图数学也要解耦。</p><p>颜色只表示这一步是谁在做：蓝是模型的一次响应，绿是模型点、harness 执行的工具，灰是模型不参与的固定流程，虚线是终止或出口。紫线只有跨阶段交接与审计闸放行。琥珀「改」字标本次要动的环节。</p>
