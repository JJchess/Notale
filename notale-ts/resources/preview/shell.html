<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>预览 · {n} 页</title>
<link rel="stylesheet" href="{reveal_css}">
<style>
 :root {{color-scheme:dark}} html,body {{background:#111;margin:0}}
 .reveal .slides section {{padding:0;width:1600px;height:900px}}
 .reveal iframe {{width:1600px;height:900px;border:0;display:block;background:#fff}}
 .reveal .fragment {{position:absolute;width:0;height:0;overflow:hidden}}
 .overview-card {{display:none;width:1600px;height:900px;position:absolute;inset:0;background:#222}}
 .reveal .overview-card img {{margin:0;border:0;width:100%;height:100%;max-width:none;max-height:none;object-fit:contain}}
 .overview-label {{position:absolute;bottom:0;left:0;right:0;padding:18px;background:#000c;color:#fff;font:28px sans-serif}}
 .reveal.overview .overview-card {{display:block}}
 /* Reveal 5.1 limits overview visibility to 10 nearby slides (6 on mobile).
    Show all static cards without loading any additional iframe documents. */
 .reveal.overview .slides > section {{display:block!important}}
 .reveal.overview .preview-frame {{visibility:hidden}}
 .reveal:not(.overview) .slides > section[data-preview-preparing] {{display:block!important;visibility:visible!important;opacity:0!important;transform:none!important;pointer-events:none!important}}
 #preview-status {{position:fixed;z-index:60;bottom:38px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 32px);box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:9px 14px;border-radius:6px;background:#202326;color:#f5f5f5;font:13px/1.5 system-ui,sans-serif;box-shadow:0 2px 12px #0002}}
 #preview-status[hidden] {{display:none}}
 #preview-status button,#preview-status a {{font:inherit;color:inherit;background:transparent;border:0;padding:2px 4px;text-decoration:underline;cursor:pointer}}
 #preview-status :focus-visible {{outline:2px solid #f5f5f5;outline-offset:3px}}
 .hint {{position:fixed;top:10px;z-index:50;background:#000b;padding:4px 9px;border-radius:4px;font:12px/1.4 sans-serif;pointer-events:none}}
 .hint {{right:10px;color:#aaa}}
 /* The keys fade after a few seconds; they come back near the corner or with ? (no standing instructions). */
 .hint {{opacity:1;transition:opacity .3s ease}}
 .hint.is-idle {{opacity:0}}
 /* Inside the viewer (?embed=1): no backdrop of its own, the viewer's stage shows through. */
 html.embed {{color-scheme:light}}
 html.embed, html.embed body, html.embed body.reveal-viewport, html.embed #preview-poster {{background:transparent}}
 /* …and its page number and arrows in the viewer's quiet greys rather than a black box. */
 html.embed .reveal .slide-number {{background:transparent;color:#77747e;font:12px/1.4 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}}
 html.embed .reveal .slide-number a {{color:inherit}}
 html.embed .reveal .controls {{color:#77747e}}
 #preview-poster {{position:fixed;inset:0;z-index:20;pointer-events:none;background:#111}}
 #preview-poster[hidden] {{display:none}}
 #preview-poster img {{width:100%;height:100%;object-fit:contain}}
</style></head><body>
<div class="hint">← → 步进 · Shift + ← → 翻页 · O 总览 · F 全屏</div>
<div id="preview-poster" aria-hidden="true" hidden><img alt=""></div>
<div id="preview-status" role="status" aria-live="polite" hidden><span></span><button type="button" data-retry hidden>重试</button><button type="button" data-cancel>取消</button><a target="_blank" rel="noopener" hidden>单独打开页面</a></div>
<div class="reveal"><div class="slides">{sections}</div></div>
<script src="{reveal_js}"></script><script src="{preview_js}"></script>
</body></html>
