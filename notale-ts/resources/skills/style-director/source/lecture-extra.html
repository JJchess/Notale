<script>
const rows={
"01-minimalism":["minimal","构图 / 留白","留白如何\n聚焦视线","元素变少以后，位置与尺度承担更多责任。先确定唯一焦点，再安排辅助说明。","焦点与边界","圆形之外的大面积空白，让视线先落在主体，再回到文字。","少量元素　·　清楚关系","空间与尺度"],
"02-swiss":["swiss","信息设计 / 网格","同一条轴线，\n让信息成组","网格不必显露，但对齐关系可以被看见。标题、图形和说明共享少数几条轴线。","对齐关系","红点所在的交叉位置连接了横向与纵向两组信息。","GRID / ALIGN / SPACE","网格与排印"],
"03-editorial":["editorial","出版设计 / 阅读节奏","一页文章，\n怎样安排停顿？","标题提出问题；引言给出方向；正文与图注承担细节。不同字阶决定阅读速度。","编排顺序","大标题之后留出呼吸，窄栏正文适合连续阅读。","标题　／　导语　／　正文","编辑与阅读"],
"05-bento-grid":["bento","信息分组 / 网格","把一个过程\n拆成相关区域","光合作用需要光、水和二氧化碳，植物生成糖，并释放氧气。不同尺度的格子表达输入与结果。","读图顺序","先看最大结果区，再沿相邻小格回溯三个输入条件。","输入 → 过程 → 结果","信息分组"],
"06-neumorphism":["neumo","材质语言 / 明暗","同一块表面，\n怎样显出凸凹？","成对的亮边与暗边暗示光源方向。凸起和凹陷依赖同一底色，状态仍需文字辅助。","观察光源","左上亮、右下暗的组合使中心圆面浮起；阴影反向时像是压入表面。","光从左上方来","界面材质"],
"07-skeuomorphism":["skeuo","实体线索 / 操作","一个旋钮，\n为何知道怎么转？","实体控制器把形状、刻度与阻尼感连在一起。拟物界面借用这些可辨识线索提示操作。","操作线索","旋钮的圆周与指向标记共同告诉使用者：这里可以旋转。","形状　·　厚度　·　触感","实体与界面"],
"09-neo-brutalism":["neo","图形语言 / 状态","轮廓先说话，\n颜色再补充","粗描边、平涂色块和硬偏移阴影把对象分开。状态变化仍应通过形状与文字被读懂。","边界关系","偏移阴影显示层级，粗轮廓保持对象边界清楚。","轮廓 / 色块 / 偏移","对象边界"],
"10-retro-web":["retro","媒介史 / 超链接","早期网页，\n如何提示可点击？","带下划线的链接、窗口边框和位图式图标，保留了早期桌面与网页的操作痕迹。","识别线索","蓝色下划线明确标记链接；窗口标题与按钮区分内容和操作。","HOME.HTML  /  INDEX","网页媒介"],
"11-y2k":["y2k","视觉文化 / 千禧年","未来曾经长得\n像液态金属","世纪之交的数字想象常用金属反光、透明塑料和充气轮廓。材料组合比单一银色更重要。","材料对照","看反光从硬边金属过渡到柔软透明体，两个材质形成张力。","METAL / GEL / GLOSS","数字时代想象"],
"12-retrofuturism":["retrofuture","视觉文化 / 未来想象","过去的人，\n如何画未来？","复古未来主义让旧时代的印刷语言与想象中的新技术并置。观察年代感从何而来。","年代线索","色彩、纸感与建筑曲线一起塑造过去想象中的未来。","ARCHIVE / FUTURE","未来想象史"],
"14-dark-tech":["darktech","传感技术 / 光","暗处的边缘，\n为什么更清楚？","稀疏的侧光勾出传感器轮廓。集中亮部让视线聚焦在真实结构，而非铺满装饰发光。","观察重点","沿金属边缘追踪光线，区分外壳、镜头口和内部感光面。","LIGHT → SENSOR → SIGNAL","光与感测"],
"15-3d-immersive":["immersive","地球科学 / 地层","地层怎样记录\n先后顺序？","沉积层不断叠置；在未受扰动的序列中，下层通常比上层形成得早。","空间线索","从露出的切面辨认不同层位，再看遮挡与侧面如何表现厚度。","上层 / 中层 / 下层","地层与时间"],
"16-motion-first":["motion","动态表达 / 时序","动作的三个时刻，\n如何连成一次变化？","起点、过渡和终点共享一条运动路径。静止画面也要保留位置与时间的连续关系。","读图路径","沿细线从左到右看，间距和透明度提示速度变化。","T0 → T1 → T2","时间与运动"],
"17-maximalism":["maximal","声音结构 / 层次","密度可以很高，\n层级仍要清楚","基音、泛音和节奏在同一时间叠加。排版用尺度、方向和重复建立聚集与间隔。","观察层级","先读最大音型，再比较重复的小节与不同频段的纹理。","基音 / 泛音 / 节奏","声音与节奏"],
"19-hand-drawn":["handdrawn","植物观察 / 结构","一朵花，\n由哪些部分构成？","观察花瓣、花蕊、叶片与根的相对位置。手绘线条的轻重可标出结构的前后。","读图顺序","从花瓣向内看花蕊，再沿茎下行至叶片与根。","花瓣 → 花蕊 → 茎 → 根","植物结构"],
"20-pixel":["pixel","数字图像 / 像素簇","放大以后，\n边缘由什么组成？","低分辨率画面靠像素簇形成轮廓。局部块的选择，比随机加方格更能维持形体。","观察轮廓","同色像素连成块，阶梯状边缘让曲线在低分辨率中仍可辨认。","16 × 16 / PIXEL GRID","数字图像"],
"21-bauhaus":["bauhaus","基础构成 / 形状","圆、方、三角，\n怎样彼此平衡？","大小和位置决定视觉重量；重复与非对称让简单形状产生方向感。","构成关系","三个基本形体互相靠近，但仍保留各自的轮廓与负空间。","FORM / COLOR / BALANCE","形状与比例"],
"22-memphis":["memphis","图案语言 / 重复","图案为什么\n需要停顿？","点、线和几何形错位重复，形成活跃节奏。空白区域让不同图案仍能被区分。","观察节奏","比较密集斑点与大色块之间的间距：疏密本身也是构成。","点 / 线 / 面","图案与节奏"],
"24-terminal-ui":["terminal","计算表达 / 命令","命令与结果，\n如何分得清？","终端依靠字符行列和提示符组织信息。输入与输出保持明确顺序，读者才能复现过程。","真实示例","下面的命令把 3、1、2 排序；输出顺序是 1、2、3。","$ INPUT  →  OUTPUT","字符界面"],
"25-dashboard":["dashboard","数据阅读 / 比较","四天的数据，\n怎样一起比较？","同一尺度的条形图能比较每日练习时长。数据仅为教学示例，不代表真实用户记录。","阅读任务","先找最长的一天，再看四天之间的变化幅度。","教学数据 · 单位：分钟","数据比较"],
"26-claymorphism":["clay","材质表达 / 体积","柔软的边缘，\n如何显出体积？","圆润的几何体通过漫反射与接触阴影呈现塑形感。比较不同形状的着地方式。","观察接触","立方体、圆柱和球体的影子宽度不同，提示各自与地面的接触。","立方体　圆柱　球体","形体与材质"],
"28-organic-shapes":["organic","曲线构成 / 负空间","不规则曲线，\n如何组织画面？","曲线的伸展与回收形成有方向的负空间。流动感来自轮廓关系，不需要到处加波浪。","观察方向","沿一条连续轮廓看形体怎样向右展开，再回到中央的留白。","轮廓 / 围合 / 留白","曲线与空间"],
"29-gradient-mesh":["mesh","颜色结构 / 过渡","颜色的焦点，\n也有位置","渐变网格由多个色域共同形成。各色域的位置与面积决定画面的亮度重心。","观察色域","从右上暖色亮部移动到下方冷色区域，留意中间的混合带。","CONTROL POINTS / COLOR FIELDS","颜色与空间"],
"30-monoline-illustration":["monoline","线描语言 / 结构","一根线，\n怎样画出形体？","接近一致的线宽可以描述外轮廓和内部结构。转角、线帽与疏密决定清晰程度。","观察线条","线不断开也能交代物体的转折；少量填充只提示最关键的面。","单线 / 转角 / 留白","线与形体"],
"31-luxury-minimal":["luxury","材料观察 / 光","细节很少，\n质感从哪里来？","丝绸的折叠和黄铜的反光占据视觉中心。大幅暗部让材料细节成为唯一重点。","观察材质","比较柔软织物的漫反射与金属的集中高光。","SILK / BRASS / LIGHT","材料与光"],
"32-japandi":["japandi","空间观察 / 材料","一间安静的房间，\n靠什么成立？","木、织物与灰泥的纹理不同，却共享克制的色阶。自然光把它们组织到一起。","观察空间","从木格到墙面再到布帘，比较粗细与明暗的变化。","WOOD / LINEN / LIGHT","材料与留白"],
"33-eco-nature":["eco","生态观察 / 地表","森林地面，\n藏着哪些层次？","落叶、苔藓、细根和幼芽共享同一片地表。近看材料层次，才能理解生长环境。","观察顺序","先找到幼芽，再沿土面观察覆盖物、苔藓与根部。","落叶 / 苔藓 / 根系","森林生态"],
"35-abstract-geometry":["geometry","几何构成 / 关系","两个形状重叠，\n会出现什么？","交叠让新边界与新色块同时出现。即使没有具象对象，大小、方向与比例仍能形成秩序。","观察交叠","比较圆与方的共有区域，以及它们在空白中留下的形状。","OVERLAP / SPACE","抽象构成"],
"36-scrollytelling":["scroll","叙事设计 / 进度","变化如何沿着\n一条路径展开？","连续视觉锚点把三个生长阶段连起来。滚动时每一步改变内容，但保留前后的关系。","阶段顺序","种子、萌芽和幼株共享一条垂直轴，读者能追踪同一对象的变化。","阶段 1 / 2 / 3","连续叙事"],
"37-split-screen":["split","图像比较 / 光","同一物体，\n两种光线","把同一个球体放在明暗两侧，差异可以直接比较。分屏边界本身就是阅读线索。","比较方式","先看左侧高光，再看右侧边缘；物体不变，光照关系改变。","LEFT / RIGHT","并置与对照"],
"38-fashion-editorial":["fashion","服装观察 / 廓形","剪裁如何改变\n一件衣服的轮廓？","肩线、翻领和衣身的折线共同决定廓形。黑白影像让结构比颜色更突出。","观察结构","先看肩线，再沿翻领与门襟向下读出整体轮廓。","SILHOUETTE / SEAM","服装结构"],
"40-experimental-typography":["type","排印实验 / 空间","文字本身，\n也可以成为图形","字形、方向与间距改变视觉路径。文字仍需可读，实验不能让核心信息消失。","阅读路径","同一个“光”字被放大、拆分与转向；尺度关系比装饰更重要。","字形 / 尺度 / 方向","文字与空间"]
};
