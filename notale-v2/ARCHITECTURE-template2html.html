    :root {

      width: 100%;
      height: 100dvh;
      padding: 32px;
      display: grid;
      place-items: center;
    }

      width: min(100%, 1720px, calc((100dvh - 128px) * 1.7143));

      display: grid;
      gap: 12px;

    .diagram {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 20px 42px rgba(23, 34, 49, 0.11));
    }

    .model-call,
    .tool-use,
    .decision,
    .terminal,
    .fixed {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 150ms ease, filter 150ms ease;
    }

    .model-call:hover,
    .tool-use:hover,
    .decision:hover,
    .terminal:hover,
    .fixed:hover {
      transform: translateY(-1px);
      filter: drop-shadow(0 4px 5px rgba(23, 34, 49, 0.10));
    }

    text { user-select: none; }

    @media (prefers-reduced-motion: reduce) {
      .model-call, .tool-use, .decision, .terminal, .fixed {
        animation: none;
        transition: none;
      }
    }

    @media print {
      body { background: white; }
      main { padding: 0; }
      .architecture { width: 100%; }
      .diagram { filter: none; }
    }

document.querySelector('#size').addEventListener('click',e=>{const native=document.querySelector('.viewport').classList.toggle('native');e.currentTarget.setAttribute('aria-pressed',String(native));e.currentTarget.textContent=native?'适应窗口':'放大查看';});
function exportSVG(){const copy=svg.cloneNode(true);copy.setAttribute('role','img');copy.removeAttribute('width');copy.querySelectorAll('.selected').forEach(n=>n.classList.remove('selected'));copy.querySelectorAll('.node').forEach(n=>{n.removeAttribute('tabindex');n.removeAttribute('role');n.removeAttribute('aria-controls');});const style=getComputedStyle(document.documentElement);return new XMLSerializer().serializeToString(copy).replace(/var\((--[\w-]+)\)/g,(_,key)=>style.getPropertyValue(key).trim());}window.exportHarnessSVG=exportSVG;
document.querySelector('#export').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([exportSVG()],{type:'image/svg+xml;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='ARCHITECTURE-template2html.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
</script></body></html>
