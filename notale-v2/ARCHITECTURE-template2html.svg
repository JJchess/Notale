<marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#687486" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7652d6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><rect x="12" y="12" width="1176" height="676" rx="12" fill="#fcfdfe" stroke="#cfd7e2" stroke-width="0.7"/><path d="M28 74H1172" stroke="#d7dee8" stroke-width="0.5"/>
