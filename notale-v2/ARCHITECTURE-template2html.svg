<text x="560.0" y="160" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#172231">一个上下文 · 短 policy + 环境 + 用户任务</text>
<text x="560.0" y="181" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="400" fill="#687486">后续直接追加模型响应、配对工具结果和实际图像；不做自动摘要</text>
</g>
<g id="model" class="node model-call" data-node-type="model-call" data-owner="agent" aria-label="Gemini 3.8 Flash · 唯一 code agent：查看机制与源码"><title>模型固定为 gemini-3.8-flash，采用已在主项目实验中使用的 Google Chat 路线与 low effort。单个 code agent 自主决定解析、实现、看图与修正方法。通用内核不包含 PPTX 规则，外部回调提供唯一交付存在性 gate。本目录尚未运行真实模型端到端转换，质量仍待实物评估。</title>
<rect class="node-shape" x="306" y="236" width="240" height="118" rx="5" fill="white" stroke="#2f78d6" stroke-width="0.7"/>
<text x="426.0" y="250" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#2f78d6">Gemini 3.8 Flash · 唯一 code agent</text>
<text x="426.0" y="275" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#687486">理解 PPTX → 写代码 → 看结果</text>
<text x="426.0" y="299" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="400" fill="#687486">自主决定如何解析、实现与修正</text>
<text x="426.0" y="323" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#687486">不预设模型的能力边界</text>
<text x="426.0" y="342" text-anchor="middle" dominant-baseline="central" font-size="9.7" font-weight="400" fill="#687486">真实模型端到端转换仍待验证</text>
</g>
<g id="toolkit" class="node tool-use" data-node-type="tool-use" data-owner="tool" aria-label="基础工具 · 直接 function call：查看机制与源码"><title>目录内 tools.py 仅实现命令执行、进程续接和看图三个工具。shell 支持读写编辑、解析和浏览器脚本，进程用 session_id 续接；看图直接回传像素。sandbox.py 提供只读输入和工作区隔离。没有 JS cell、Node RPC、store/load、图片模型或对 infra/core 的代码依赖。</title>
<rect class="node-shape" x="570" y="236" width="248" height="118" rx="5" fill="#d7efdf" stroke="#2f8a60" stroke-width="0.7"/>
<text x="694.0" y="250" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#2f8a60">基础工具 · 直接 function call</text>
<text x="694.0" y="272" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="400" fill="#687486">exec_command · 读 / 写 / 改 / 执行</text>
<text x="694.0" y="296" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="400" fill="#687486">write_stdin · 长进程续接</text>
<text x="694.0" y="320" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#687486">view_image · 图像回传给同一模型</text>
<text x="694.0" y="342" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="400" fill="#687486">独立工具体；不启动 Code-mode worker</text>
</g>
<g id="feedback" class="node fixed" data-node-type="deterministic" data-owner="runtime" aria-label="结果 → 同一 history：查看机制与源码"><title>直接执行本轮函数调用，按 call_id 追加输出；view_image 的像素在配对结果后作为 user 图片消息追加。工具失败回传 error，模型可以检查原因后继续。纯 commentary 不表示最终交付。不存在额外的评分、图片选择或修正编排器。</title>
<rect class="node-shape" x="306" y="404" width="240" height="60" rx="5" fill="white" stroke="#7b8697" stroke-width="0.7"/>
