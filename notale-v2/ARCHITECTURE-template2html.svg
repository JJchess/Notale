<text x="426.0" y="437" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#687486">call_id 配对文本 / 错误；另附图像</text>
<text x="426.0" y="453" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="400" fill="#687486">模型继续决定下一步</text>
</g>
<g id="unfinished" class="node terminal" data-node-type="termination" data-owner="runtime" aria-label="预算 / 请求异常 → 未完成，保留记录：查看机制与源码"><title>用户显式设置的轮数预算耗尽时返回 budget_exhausted；API 异常或不完整响应记为 error。文件和原始记录保留，关闭运行中的工具进程；不自动重试其他模型或恢复上次进程。</title>
<rect class="node-shape" x="306" y="494" width="240" height="28" rx="5" fill="white" stroke="#687486" stroke-width="0.7" stroke-dasharray="3 2"/>
<text x="426.0" y="508.0" text-anchor="middle" dominant-baseline="central" font-size="10.2" font-weight="500" fill="#172231">预算 / 请求异常 → 未完成，保留记录</text>
</g>
<g id="gate" class="node decision" data-node-type="validator" data-owner="workflow" aria-label="output/ 中有非空 HTML？：查看机制与源码"><title>run.py 的 check_delivery 是唯一领域 gate：output 下至少有一个非空 HTML/HTM 文件且未通过符号链接指向外部。无固定 schema、浏览器或视觉评分；没有文件时返回提醒，由通用 agent 循环继续；存在文件时返回 delivered_unreviewed。</title><path class="node-shape" d="M1019 212.0L1170.0 254L1019 296.0L868.0 254Z" fill="white" stroke="#7b8697" stroke-width="0.8"/>
<text x="1019" y="246" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#172231">output/ 中有非空 HTML？</text>
<text x="1019" y="264" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="400" fill="#687486">只看产物存在；不判断质量</text>
</g>
<g id="delivered" class="node terminal" data-node-type="termination" data-owner="workflow" aria-label="delivered_unreviewed：查看机制与源码"><title>该状态仅表示有非空 HTML 文件可交付人工查看，不表示浏览器可运行、版式保真、可编辑性或交互已通过检查。宿主不执行自动质量验收，也不把未经验证的结果包装成成功复现。</title>
<rect class="node-shape" x="868" y="328" width="302" height="68" rx="5" fill="white" stroke="#687486" stroke-width="0.7" stroke-dasharray="3 2"/>
<text x="1019.0" y="342" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#172231">delivered_unreviewed</text>
<text x="1019.0" y="363" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#687486">保存 HTML / 资源 / final.md</text>
<text x="1019.0" y="381" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#687486">存在文件 ≠ 已验证转换质量</text>
