<marker id="arrow-green-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2f8a60" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
