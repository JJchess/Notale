<text x="871" y="41" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#172231">harness 固定流程</text>
<rect x="1008" y="34" width="18" height="13" rx="3" fill="white" stroke="#687486" stroke-width="0.7" stroke-dasharray="3 2"/>
<text x="1033" y="41" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#172231">循环终止</text>
<text x="30" y="62" text-anchor="start" dominant-baseline="central" font-size="10" font-weight="400" fill="#687486">先观察模型在简单架构中的能力；新增机制必须来自实际运行中出现的问题。</text>
<g id="controller" class="node fixed" data-node-type="deterministic" data-owner="runtime" aria-label="1 个 Gemini 3.8 Flash code agent + 3 个基础工具 + 1 个 HTML 存在性 gate ｜ 无固定阶段，无其他模型，无自动质量判定：查看机制与源码"><title>独立目录 pptx2html-harness 的 run.py 启动 agent.py。没有 infra/core/采集 kit 的 Python 依赖。模型固定 gemini-3.8-flash，采用 Google Chat Completions 路线，reasoning_effort=low；无其他模型、图片模型、自动 fallback 或 Code-mode。唯一交付 gate 在 run.py，仅检查非空 HTML。本目录的真实 Gemini 转换仍未运行，协议与运行机制使用本地 HTTP 替身检查。</title>
