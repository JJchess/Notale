<g id="prepare" class="node fixed" data-node-type="deterministic" data-owner="workflow" aria-label="prepare · 复制输入与建目录：查看机制与源码"><title>独立 run.py 只建立目录、复制输入并设置只读；sandbox.py 直接调用 bwrap 只读挂载输入，不导入采集 kit、不启动 Codex。可使用 PATH/BWRAP 或本机已有独立 bwrap 二进制。准备时不解析 PPTX、不进行固定渲染或字体预检。</title>
<rect class="node-shape" x="46" y="146" width="206" height="126" rx="5" fill="#eceff4" stroke="#7b8697" stroke-width="0.7"/>
<text x="149.0" y="160" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#172231">prepare · 复制输入与建目录</text>
<text x="149.0" y="182" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#687486">输入：input/template.pptx</text>
<text x="149.0" y="204" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#687486">输出：output/；临时目录：.tmp/</text>
<text x="149.0" y="226" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="400" fill="#687486">输入只读；独立隔离运行环境</text>
<text x="149.0" y="251" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#687486">不预先解析 PPTX 或生成参照</text>
</g>
<g id="seed" class="node fixed" data-node-type="deterministic" data-owner="workflow" aria-label="短工作约束 + 用户任务：查看机制与源码"><title>minimal-policy.md 只规定目标、工具用法、只读输入和唯一模型。任务书保留视觉、可替换性、交互示例及来源说明等交付目标，但不强制 structure.json、PPTTemplate 接口、逐布局覆盖或固定修正次数。这些要求交给模型完成与自查，宿主不将其逐项转成 gate。</title>
<rect class="node-shape" x="46" y="310" width="206" height="142" rx="5" fill="#eceff4" stroke="#7b8697" stroke-width="0.7"/>
<text x="149.0" y="324" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#172231">短工作约束 + 用户任务</text>
<text x="149.0" y="348" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#687486">视觉特征 / 可编辑 / 可替换</text>
<text x="149.0" y="371" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#687486">可接入最小交互；说明已知限制</text>
<text x="149.0" y="398" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="400" fill="#687486">实现方式、工具顺序、验证方法</text>
<text x="149.0" y="420" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#687486">由同一模型根据输入决定</text>
</g>
<g id="boundary" class="node fixed" data-node-type="deterministic" data-owner="runtime" aria-label="运行边界 · 不是质量闸：查看机制与源码"><title>保留输入隔离和显式轮数预算，预算耗尽标为未完成。一次运行只接受 Gemini 3.8 Flash，不暴露其他模型、图片生成或 fallback。重复实验使用新目录，开始标记防止同目录同时启动两个控制器；不恢复旧进程或调用。供应商是否确实提供该模型仍需真实接入验证。</title>
<rect class="node-shape" x="46" y="532" width="206" height="114" rx="5" fill="#eceff4" stroke="#7b8697" stroke-width="0.7"/>
