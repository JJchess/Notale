</g>
<g id="history" class="node fixed" data-node-type="deterministic" data-owner="runtime" aria-label="一个上下文 · 短 policy + 环境 + 用户任务：查看机制与源码"><title>agent.py 使用原生 Chat messages 维护单一 history。完整 tool_calls（含 extra_content.google.thought_signature）回放，tool 结果按 tool_call_id 配对，图像用 image_url 附到后续 user 消息。没有 Responses 转换层、自动摘要、阶段状态机或多 agent。Gemini 路线来自主项目已有配置，但运行不读取上层配置或凭据文件。</title>
