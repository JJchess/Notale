<svg class="diagram" viewBox="0 0 1200 700" role="img" aria-labelledby="diagram-title diagram-description" xmlns="http://www.w3.org/2000/svg" font-family="Avenir Next, Avenir, Segoe UI, system-ui, sans-serif">
<title id="diagram-title">PPTX → HTML · 最小 v1 · 单 agent / 三工具 / 一 gate</title>
<desc id="diagram-description">以 Gemini 3.8 Flash 的能力为基线。一个通用 code agent，一条 history，直接调用命令执行、进程续接与看图三个工具。模型决定解析、实现与验证方法；宿主只有一个质量无关的交付存在性检查：output 下存在非空 HTML。通过后状态为 delivered_unreviewed，不代表视觉或可编辑性通过。保留只读输入、轨迹与显式预算；复杂 Code-mode、断点恢复、固定结构和浏览器质量闸已移出默认链路。Gemini 的真实供应商接入仍待验证。</desc><defs>
