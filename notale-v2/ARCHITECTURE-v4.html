<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notale v2 Architecture · v4 现状</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #e9edf2;
      --paper: #fcfdfe;
      --ink: #172231;
      --muted: #687486;
      --hairline: #d7dee8;
      --blue: #2f78d6;
      --blue-soft: #eef5ff;
      --violet: #7652d6;
      --violet-soft: #f4f0ff;
      --green: #237650;
      --green-soft: #eff8f2;
      --green-node: #d7efdf;
      --green-line: #2f8a60;
      --slate: #7b8697;
      --slate-node: #eceff4;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 1080px;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      overflow: auto;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
      background:
        linear-gradient(rgba(23, 34, 49, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 34, 49, 0.035) 1px, transparent 1px),
        var(--canvas);
      background-size: 28px 28px;
    }

    main {
      width: 100%;
      min-height: 100dvh;
      padding: 32px;
      display: grid;
      place-items: center;
    }

    .architecture {
      width: min(100%, 1720px, calc((100dvh - 128px) * 1.7143));
      margin: 0;
      display: grid;
      gap: 12px;
    }

    .diagram {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 20px 42px rgba(23, 34, 49, 0.11));
    }

    .model-call,
    .tool-use,
    .decision,
    .terminal,
    .fixed {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 150ms ease, filter 150ms ease;
    }

    .model-call:hover,
    .tool-use:hover,
    .decision:hover,
    .terminal:hover,
    .fixed:hover {
      transform: translateY(-1px);
      filter: drop-shadow(0 4px 5px rgba(23, 34, 49, 0.10));
    }

    text { user-select: none; }

    figcaption { font-size: 13px; line-height: 1.65; }
    figcaption table { width: 100%; border-collapse: collapse; background: var(--paper); }
    figcaption th, figcaption td { padding: 9px 14px; border-bottom: 1px solid var(--hairline); text-align: left; vertical-align: top; }
    figcaption th { width: 150px; font-weight: 500; white-space: nowrap; }
    figcaption p { margin: 8px 0 0; color: var(--muted); }
    figcaption a { color: var(--blue); }

    @media (prefers-reduced-motion: reduce) {
      .model-call, .tool-use, .decision, .terminal, .fixed {
        animation: none;
        transition: none;
      }
    }

    @media print {
      body { background: white; }
      main { padding: 0; }
      .architecture { width: 100%; }
      .diagram { filter: none; }
    }
  </style>
</head>
