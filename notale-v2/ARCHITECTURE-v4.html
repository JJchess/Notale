<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notale v2 Architecture · v4 现状</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #e9edf2;
      --paper: #fcfdfe;
      --ink: #172231;
      --muted: #687486;
      --hairline: #d7dee8;
      --blue: #2f78d6;
      --blue-soft: #eef5ff;
      --violet: #7652d6;
      --violet-soft: #f4f0ff;
      --green: #237650;
      --green-soft: #eff8f2;
      --green-node: #d7efdf;
      --green-line: #2f8a60;
      --slate: #7b8697;
      --slate-node: #eceff4;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 1080px;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      overflow: auto;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
      background:
        linear-gradient(rgba(23, 34, 49, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 34, 49, 0.035) 1px, transparent 1px),
        var(--canvas);
      background-size: 28px 28px;
    }

    main {
      width: 100%;
      height: 100dvh;
      padding: 32px;
      display: grid;
      place-items: center;
    }

    .architecture {
      width: min(100%, 1720px, calc((100dvh - 128px) * 1.7143));
      margin: 0;
      display: grid;
      gap: 12px;
    }

    .diagram {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 20px 42px rgba(23, 34, 49, 0.11));
    }

    .model-call,
    .tool-use,
    .decision,
    .terminal,
    .fixed {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 150ms ease, filter 150ms ease;
    }

    .model-call:hover,
    .tool-use:hover,
    .decision:hover,
    .terminal:hover,
    .fixed:hover {
      transform: translateY(-1px);
      filter: drop-shadow(0 4px 5px rgba(23, 34, 49, 0.10));
    }

    text { user-select: none; }

    @media (prefers-reduced-motion: reduce) {
      .model-call, .tool-use, .decision, .terminal, .fixed {
        animation: none;
        transition: none;
      }
    }

    @media print {
      body { background: white; }
      main { padding: 0; }
      .architecture { width: 100%; }
      .diagram { filter: none; }
    }
  </style>
</head>

<desc id="diagram-description">只画已实现的现状。没有编排模块：两个 CLI 进程由 shell（run12.sh / scripts/style_e2e.py）拼接，core.planner 先跑，退出码为 0 且 briefs.json 非空才启动 core.builder。Style Director 是 planner 进程内的线程，与页表调用并行，两路共享一个加锁的 trace.jsonl，互不读对方产物；planner 丢弃线程返回值，主题从磁盘重读。Director 在任何模型调用之前定四条路线：有效成品主题无修改要求走 reuse，零模型调用；有原主题加明确要求走 modify；只给参考图走 reference；都没有才走 auto 的选样。选样只看文本索引和实测调色板，不发图；写主题时才发画廊截图、用户样张与风格详情图，可按需取图，Write 必须独占一次响应，技术校验含静态闸与真实 headless Chromium 逐 variant 检查。视觉页只预载主题的 INTERFACE 块，用户样张随首条 user 消息附上；代码页既无主题也无样张。Look 已合并进 Check 的 box/zoom。Builder 按页标签一对一路由到四个 workflow，system 前缀按 workflow 至多四份且跨页字节相同，每页独立 history，终止分六类，终止后跑一次绝不回喂的独立审计。</desc>
