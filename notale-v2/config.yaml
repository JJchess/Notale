# 模型基础设施。端点是量出来的,不是选出来的 ——
# 8 并发同时打两个端点,同一个模型:
#
#   api.999555999   6/8 成功   墙钟 180.8s   吞吐  2.0 次/分   2 次超时
#   llmapi.paratera 8/8 成功   墙钟  12.8s   吞吐 37.4 次/分   0 次失败
#
# 差 18.7 倍。之前 20 并发跑 builder 累计空等 84 分钟,根源就是前者扛不住并发。
model:
  base_url: https://llmapi.paratera.com/v1
  name: AWS-GPT-5.6-Sol
  api_key_env: PARATERA_API_KEY
  wire_api: responses
  http_timeout_sec: 900
  max_output_tokens: 128000
  reasoning_effort: medium

planner:
  # 步骤顺序是从 nn-06 主 agent 的动作时间线抄下来的,不是设计的:
  #   探环境 → theme.css → lec.js → PLAN.md → CONTRACT.md → 建骨架
  # nn-03 是同一条线,两轮一致,所以固定成流水线而不是让模型自己决定。
  reasoning_effort: high
