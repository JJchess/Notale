<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AdaBoosting workflow skill test</title>
  <style>
    *{box-sizing:border-box}
    :root{font-family:"Noto Sans CJK SC",system-ui,sans-serif;color:#111820;background:#e6e9ee}
    body{margin:0}
    header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 24px;background:#f8f9fb;border-bottom:1px solid #c8d0db}
    h1{margin:0;font-size:18px;letter-spacing:-.02em}
    nav{display:flex;gap:6px}
    button{height:36px;padding:0 14px;border:1px solid #aeb9c7;border-radius:3px;background:#fff;color:#111820;cursor:pointer}
    button[aria-selected="true"]{border-color:#164e9b;background:#164e9b;color:#fff}
    main{padding:20px 24px 30px}
    .meta{display:flex;align-items:baseline;justify-content:space-between;max-width:1600px;margin:0 auto 10px}
    h2{margin:0;font-size:16px}
    a{font-size:13px;color:#164e9b}
    .frame{max-width:1600px;margin:auto;background:#fff;border:1px solid #c8d0db}
    iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
    @media(max-width:760px){header,.meta{align-items:flex-start;flex-direction:column}nav{flex-wrap:wrap}main{padding:14px 10px}}
  </style>
</head>
<body>
  <header>
    <h1>AdaBoosting算法 · full skill arm</h1>
    <nav aria-label="页面选择">
      <button type="button" data-page="cover" aria-selected="true">标题页</button>
      <button type="button" data-page="lesson" aria-selected="false">算法讲解</button>
      <button type="button" data-page="code" aria-selected="false">代码实操</button>
    </nav>
  </header>
  <main>
    <div class="meta">
      <h2 id="title"></h2>
      <a id="open" target="_blank" rel="noopener">在新窗口打开 1600×900 页面</a>
    </div>
    <div class="frame"><iframe id="preview" title="AdaBoosting 实验页面"></iframe></div>
  </main>
  <script>
    const pages={
      cover:{title:"[标题页] AdaBoosting算法",path:"../.runs/adaboost-smoke-20260831-v1/repeat-01/cover-composition-adaboost/arms/full/pages/page-01.html"},
      lesson:{title:"[内容页] AdaBoosting算法讲解",path:"../.runs/adaboost-smoke-20260831-v1/repeat-01/page-general-adaboost/arms/full/pages/page-08.html"},
      code:{title:"[交互页] 代码实操AdaBoosting算法",path:"../.runs/adaboost-smoke-20260831-v1/repeat-01/interaction-code-adaboost/arms/full/pages/page-14.html"}
    };
    const frame=document.querySelector("#preview"),title=document.querySelector("#title"),open=document.querySelector("#open");
    function select(id){const page=pages[id];frame.src=page.path;title.textContent=page.title;open.href=page.path;document.querySelectorAll("[data-page]").forEach(button=>button.setAttribute("aria-selected",String(button.dataset.page===id)));history.replaceState(null,"",`#${id}`)}
    document.querySelector("nav").addEventListener("click",event=>{const button=event.target.closest("[data-page]");if(button)select(button.dataset.page)});
    select(pages[location.hash.slice(1)]?location.hash.slice(1):"cover");
  </script>
</body>
</html>
