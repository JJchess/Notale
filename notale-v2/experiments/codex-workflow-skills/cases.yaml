schema_version: 1
model: gpt-5.6-sol
reasoning_effort: low
service_tier: fast

cases:
  # Retained only to decode and rescore the completed 2026-08-29 historical run.
  # These media capabilities are now Builder tools, not active workflow skills.
  - id: photo-life-support
    skill: get-photo-ref
    active: false
    kind: typical
    title: 阿波罗生命保障实物证据
    interactive: false
    task: >-
      为“宇航员依靠生命保障系统生存”页面找到一张可核验的 ISS 或阿波罗生命保障设备实物图，
      下载到本地并把关键设备区域做成可读的证据构图；保留来源页面、作者或机构、许可、原始标题
      与不遮挡教学的署名。最终页面不得从远端加载图片。

  - id: photo-hand-axe
    skill: get-photo-ref
    active: false
    kind: boundary
    title: 史前石器的准确身份
    interactive: false
    task: >-
      为“阿舍利手斧不是普通石块”页面找到带机构或馆藏身份的真实手斧图，避免复原画和无出处图片；
      让学生能比较对称刃缘、握持端与尺寸线索。下载候选并留下可审计 attribution.json，页面只使用
      最终选择的本地文件。

  - id: illustration-savanna
    skill: get-illustration
    active: false
    kind: typical
    title: 无文字的生境剖面
    interactive: false
    task: >-
      真实生成并整合一张远古旱季稀树草原的横向环境插画，左侧保留动物与水源，右侧留出讲解空间；
      所有物种名、气候数值和箭头必须由页面代码叠加，像素中不得承载答案。保存本地图片、生成 prompt
      日志，并在页面保留不遮挡内容的“AI生成”标记。

  - id: illustration-materials
    skill: get-illustration
    active: false
    kind: boundary
    title: 同系列材料隐喻
    interactive: false
    task: >-
      为“肉体适应与技术外骨骼”真实生成并整合左右连续、处理一致的石质与航天织物材料隐喻；
      它们只承担氛围和材质，不伪装成真实标本或精确结构图。保留本地文件、prompt 日志和“AI生成”标记。

  - id: page-water-scale
    skill: build-page
    kind: typical
    title: 同尺度生存预算
    interactive: false
    task: >-
      在同一尺度上比较猿人一天携带的水与宇航员生命支持系统一天循环的水；构图必须让相同维度同行、
      共享基线，并把一句结论置于证据之后。做成清晰的 1600×900 静态投影页，不为装饰添加运动。

  - id: page-oxygen-loop
    skill: build-page
    kind: boundary
    title: 氧气闭环分阶段显现
    interactive: true
    task: >-
      用一条可控制的时间序列解释“呼出二氧化碳—吸收—电解—氧气返回”四步闭环；运动建立阅读顺序，
      学生可播放、暂停、继续和复位，减少动态时保留完整信息。稳定的 ready、change、evidence、settled
      状态必须都能单独读懂。

  - id: interaction-stability
    skill: build-interaction
    kind: typical
    title: 拖动改变支撑面积
    interactive: true
    task: >-
      让学生拖动脚掌姿态，观察支撑多边形和稳定余量同步变化；只保留一个主动作，反馈贴着变化对象出现，
      并提供按钮或键盘等价路径与明确复位。

  - id: interaction-redundancy
    skill: build-interaction
    kind: boundary
    title: 键盘与触摸都可完成的取舍
    interactive: true
    task: >-
      让学生在质量受限的生命保障模块中选择两项冗余设备并看到剩余质量与风险变化；按钮必须支持键盘
      和触摸，非法第三项得到就地反馈，固定文案不得与状态冲突，复位后回到完全相同的初始状态。

  - id: chart-temperature
    skill: build-chart
    kind: typical
    title: 温度生存窗口
    interactive: true
    task: >-
      用共享温标比较裸露人体、衣物、航天服的可生存温区；提供一个拖动环境温度的动作，让图表、读数
      与结论同步。常规轴和图例使用本地 ECharts SVG 渲染，保留单位、来源、caption 与数据替代。

  - id: chart-evidence-network
    skill: build-chart
    kind: boundary
    title: 证据关系网络
    interactive: true
    task: >-
      用本地 D3 构建“化石、工具、环境代理指标”如何共同支撑迁徙判断的关系图；选择节点时只突出相关
      证据链，不把力导向动画本身当成教学内容。提供键盘选择、确定性复位和文字关系清单。

  - id: sim-forklift
    skill: build-2d-sim
    kind: typical
    title: 重心与稳定性
    interactive: true
    task: >-
      构建一辆可辨认的侧视叉车稳定模型，至少呈现车架、前后轮、门架、货叉、驾驶位与货箱；学生移动
      货箱时实时看到合成重心与支撑区。碰撞体不能直接充当成品外观，模型可复位、可复现，标签在 DOM。

  - id: sim-radiation
    skill: build-2d-sim
    kind: boundary
    title: 辐射粒子的群体效应
    interactive: true
    task: >-
      同时显示数千个粒子穿过三种屏蔽材料的统计结果；用本地 PixiJS 承担大量运动，以固定种子保证重开
      一致，DOM 中保留说明和关键读数，切换材料必须改变真实统计状态并支持减少动态模式。

  - id: scene-spacesuit
    skill: build-3d-scene
    kind: typical
    title: 航天服分层结构
    interactive: true
    task: >-
      用本地 Three.js 做可旋转的航天服材料分层模型；隐藏文字时仍能从头盔环、躯干、肩臂关节、腰部
      与生命保障背包认出航天服。材料层包覆同一轮廓并有序拉开，选择层后在 DOM 中显示功能。

  - id: scene-storm
    skill: build-3d-scene
    kind: boundary
    title: 风暴中的落脚点
    interactive: true
    task: >-
      构建低多边形地形与风暴方向场，学生改变风向后选择安全落脚区；天气效果、相机与地形共用同一
      可序列化状态，低性能、WebGL 失败或减少动态时提供有意义的静态俯视替代。

  - id: game-excavation
    skill: build-learning-game
    kind: typical
    title: 发掘现场的证据侦探
    interactive: true
    task: >-
      把“证据还是想象”做成可重玩的发掘现场游戏：玩家在六格遗址中用有限行动选择刷土、测层或取样，
      发现会改变现场、剩余行动与下一步策略；行动耗尽前拼出可追溯证据链。不得做逐题分类或正确率 quiz。

  - id: game-mass-tradeoff
    skill: build-learning-game
    kind: boundary
    title: 有限质量下的生存取舍
    interactive: true
    task: >-
      做一个只有一轮核心决策的资源权衡游戏：在固定发射质量内组合氧、水、屏蔽和冗余；每次选择改变
      后续可行方案，结局由透明规则计算而非任意分数，失败和成功都能复位并用不同策略重玩。

  - id: check-density
    skill: check-page
    kind: typical
    title: 修复拥挤比较页
    interactive: false
    fixture: review-density.html
    task: >-
      审查并原地修复现有水资源比较页。保留全部事实与对照任务，解决阅读顺序、卡片堆叠、字号、对齐
      和投影可读性问题；不得换成无关主题，必须用相同尺寸的前后渲染证据确认。

  - id: check-states
    skill: check-page
    kind: boundary
    title: 修复矛盾状态与访问路径
    interactive: true
    fixture: review-states.html
    task: >-
      审查并原地修复现有设备选择页。保留“最多选择两项”的任务，补齐非法动作反馈、键盘、状态一致性
      和复位，修正固定结论文案与可变选择冲突；必须保留设备名称和质量数据。
