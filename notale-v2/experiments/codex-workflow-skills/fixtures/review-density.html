<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/base.css"><title>水资源比较</title><style>
:root{--bg:#101724;--text:#eef5ff;--font-sans:system-ui,sans-serif}#stage{padding:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:linear-gradient(135deg,#101724,#1f4167)}
h1{grid-column:1/-1;font-size:28px;margin:0}.card{background:#19304c;border-radius:18px;padding:12px;box-shadow:0 8px 24px #0008}.card h2{font-size:16px;margin:0 0 6px}.card p{font-size:12px;line-height:1.15;margin:3px}.big{font-size:34px;color:#69d8ff}.note{grid-column:1/-1;font-size:12px;background:#16263b;padding:8px;border-radius:16px}
</style></head><body><main id="stage"><h1>水决定谁能在极端环境里活下来</h1><section class="card"><h2>猿人</h2><div class="big">3 L</div><p>一天饮水量约三升，需要每天重新寻找水源。</p><p>河流的位置也决定迁徙路线。</p></section><section class="card"><h2>宇航员携带</h2><div class="big">3 L</div><p>人体需求没有消失，离开地球后补给变得昂贵。</p><p>所有水都要跟着火箭上天。</p></section><section class="card"><h2>空间站回收</h2><div class="big">90%</div><p>净化设备把尿液和空气中的水重新变成可用水。</p><p>回收率越高，补给质量越少。</p></section><section class="card"><h2>相同点</h2><p>两者都不能没有水。</p></section><section class="card"><h2>不同点</h2><p>一个寻找自然水源，一个建造人工循环。</p></section><section class="card"><h2>结论</h2><p>技术把寻找变成回收。</p></section><p class="note">请依次阅读六张卡片并记住三个数字，然后比较它们。</p></main><script src="assets/base.js"></script></body></html>
