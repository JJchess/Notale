<template v-if="s.c===2">
<div class="sceneInside rightSide">
<img class="sceneImage" alt="scene of grandma making kimchi" :src="a+'scene2/background.png'" draggable="false" @click="close">
<button v-for="h in s.h" :key="h.num" :class="['hintContainer','keyboardSelect'+h.keyboardSelect,h.addclass,'touch'+h.notouch,'clickable-'+h.clickable+'-'+h.clicked,{selected:s.i===h.num}]" :style="{width:h.width/22+'%',left:h.x+'%',top:h.y+'%',pointerEvents:h.notouch}" :num="h.num" :image="h.image" :aria-label="h.hed||h.alt" :tabindex="h.notouch==='none'||h.hed==='speaker'?-1:0" @click="choose(h)">
<img v-if="h.image" class="hoverHint" :src="a+'scene2/'+h.image" :alt="h.alt" draggable="false">
<div v-if="h.addclass.includes('speaker')" class="quotebox perma" :class="h.xPos">
<template v-if="!s.r">
<span v-if="!all()">Bring me these ingredients. <div class="quote_hint"><img :src="a+'universal/keyboard.png'"></div></span><span v-else>Kimchi is almost ready!</span>
<div class="hintImageContainer"><div v-for="item in ingredients()" class="hintImage" :class="item.clicked==='false'?'unclicked':'clicked'"><img :src="a+'scene2/'+item.image" :alt="h.alt"></div></div>
</template>
<template v-else><div class="buttonWrapper"><img class="eatkimchi" :src="a+'scene2/kimchi.png'" alt="kimchi"><button class="button bounce2" @click.stop="restart(3)">Eat kimchi<div class="button_hint">Click or press enter</div></button></div></template>
</div>
<div v-else-if="h.type!=='bigImage'" class="quotebox" :class="[h.xPos,h.yPos]">{{h.words}}</div>
</button>
</div>
<div v-if="s.m" class="modal bigImage" role="dialog" aria-modal="true" :aria-label="s.m.alt" @click="close"><object class="desktopImage" type="image/svg+xml" :data="a+'desktop/scene2/'+s.m.image.replace('.png','.svg')" :aria-label="s.m.alt"><img class="desktopImage" :src="a+'desktop/scene2/'+s.m.image.replace('.png','.svg')" :alt="s.m.alt" draggable="false"></object><button class="closeModal" type="button">Close · Escape</button></div>
</template>
<div v-else-if="s.c<4" class="sceneInside cutscene" @click="next()"><div class="visualContainer"></div><div class="introWords"><div class="insideIntroWords"><p v-for="(text,i) in copy['scene'+s.c].slice(0,s.t+1)" :style="{opacity:i===s.t?1:i===0?.1:i/s.t/2}" v-html="text"></p></div></div></div>
<div v-else class="ending"><img :src="a+'scene2/kimchi.png'" alt="Grandma’s freshly made kimchi"><h2>“You’ll never forget this flavor.”</h2><p>The 1996 chapter ends here. Continue the original story to follow the search through 2005, 2015 and 2022.</p><button @click="restart()">Return to the kitchen</button><a href="https://pudding.cool/2023/05/kimchi/" target="_blank" rel="noopener">Continue the original story ↗</a></div>
