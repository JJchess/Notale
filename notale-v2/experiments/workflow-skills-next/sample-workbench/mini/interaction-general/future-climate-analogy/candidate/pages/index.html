<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Future climate analogue</title>
<link rel="stylesheet" href="assets/base.css">
<style>
:root{
 --bg:#e9eeee;--paper:#f7f9f7;--text:#172429;--muted:#627075;--rule:#aebbbb;
 --accent:#e3a72f;--cold:#5869a3;--temperate:#287982;--tropical:#39805a;
 --arid:#ad593d;--font-sans:Arial,sans-serif;--focus:#172429
}
#stage{padding:45px 58px}
button{border:1px solid var(--rule);background:transparent}
main{display:grid;grid-template-columns:940px 1fr;height:800px}
.cases{display:flex;gap:25px;width:900px;height:45px}
.cases button{border:0;color:var(--muted)}
.cases [aria-pressed=true]{color:var(--text);box-shadow:inset 0 -3px var(--accent)}
#reset{margin-left:auto}
#map{
 width:900px;height:570px;
 background:linear-gradient(90deg,#edf0f6 0 25%,#e7f0f0 0 50%,#e9f1ec 0 75%,#f3eae7 0)
}
.tick{stroke:#9eabaa}
#route{fill:none;stroke:var(--accent);stroke-width:5;stroke-dasharray:1;stroke-dashoffset:1}
.marker circle{fill:var(--text);stroke:var(--paper);stroke-width:3}
#map[data-phase=revealed] #traveler{transition:transform .85s ease}
#traveler circle{fill:var(--accent)}
#ghost,#analogue{opacity:0}#ghost circle{fill:none;stroke:var(--muted);stroke-width:3}
#analogue circle{fill:var(--paper);stroke:var(--text);stroke-width:3;stroke-dasharray:5 4}
#map[data-phase=revealed] #route{
 stroke-dashoffset:0;transition:stroke-dashoffset .8s ease
}
#map[data-phase=revealed] #ghost,#map[data-phase=revealed] #analogue{
 opacity:1;transition:opacity .3s .3s
}
#map.instant *{transition:none!important}
.lab{padding:37px 0 0 45px;border-left:1px solid var(--rule)}
.lab h2{font-size:30px}
#present{margin-top:13px;color:var(--muted)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:26px}
.choice{height:48px;padding:0 13px;text-align:left;border-color:var(--zone);color:var(--zone)}
.choice[aria-pressed=true]{background:var(--zone);color:var(--paper);box-shadow:0 0 0 2px var(--text)}
.z-cold{--zone:var(--cold)}.z-temperate{--zone:var(--temperate)}
.z-tropical{--zone:var(--tropical)}.z-arid{--zone:var(--arid)}
#confirm{width:100%;height:47px;margin-top:11px;background:var(--text);color:var(--paper)}
#confirm:disabled{opacity:.3}
#status{min-height:30px;margin-top:18px;color:var(--muted)}
#evidence{margin-top:7px;padding-top:19px;border-top:1px solid var(--rule);line-height:1.5}
#next{margin-top:10px;padding:8px}
.fallback{margin:130px 50px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){#traveler,#route,#ghost,#analogue{transition:none!important}}
</style>
</head>
<body><div id="stage"><main>
 <section class="world" id="world">
  <nav class="cases">
   <button data-case="0" aria-pressed="true">Oslo</button>
   <button data-case="1" aria-pressed="false">New Delhi</button>
   <button id="reset">Reset both</button>
  </nav>
  <svg id="map" viewBox="0 0 900 570" aria-hidden="true">
   <g>
    <text class="zone-label" y="35" text-anchor="middle">
     <tspan x="180">Cold</tspan><tspan x="380">Temperate</tspan>
     <tspan x="580">Tropical</tspan><tspan x="780">Arid</tspan>
    </text>
    <path class="tick" d="M70 80H875M70 260H875M70 440H875"/>
    <text class="tick-label" x="61" text-anchor="end">
     <tspan y="84">32°C</tspan><tspan x="61" y="264">16°C</tspan><tspan x="61" y="444">0°C</tspan>
    </text>
   </g>
   <path id="route" pathLength="1"/>
   <g id="ghost" class="marker"><circle r="10"/></g>
   <g id="analogue" class="marker"><circle r="15"/></g>
   <g id="traveler" class="marker"><circle r="11"/></g>
  </svg>
 </section>
 <section class="lab" id="lab">
  <h2 id="question"></h2><p id="present"></p>
  <div class="choices">
   <button class="choice z-cold" data-zone="Cold">Cold</button>
   <button class="choice z-temperate" data-zone="Temperate">Temperate</button>
   <button class="choice z-tropical" data-zone="Tropical">Tropical</button>
   <button class="choice z-arid" data-zone="Arid">Arid</button>
  </div>
  <button id="confirm" disabled>Commit prediction</button>
  <div id="status" role="status"></div><div id="evidence"></div>
  <button id="next" hidden></button>
 </section>
</main></div>
<script src="assets/base.js"></script><script src="assets/cities.js"></script>
<script src="app.js"></script>
</body></html>
