schema_version: 1
mode: isolated-experiment
model: AWS-GPT-5.6-Terra
workflows:
  - name: collect-visual-references
    category: media
    sources: [web-media-getter, web-access]
  - name: generate-illustration
    category: media
    sources: [make-illustration]
  - name: set-visual-direction
    category: design
    sources: [frontend-design, design-taste-frontend, theme-factory, skeuomorphic-ui, glass-dark-ui, ambient-section-particles, atmosphere-background, background-grid-webgl, css-border-gradient, dither-background, falling-leaves, gooey-blob-system, corner-diagonals, corner-lasers]
  - name: compose-page
    category: design
    sources: [technical-wireframe-info-layout, container-lines]
  - name: shape-typography
    category: design
    sources: [frontend-design, design-taste-frontend]
  - name: design-interaction
    category: interaction
    sources: [css-alpha-masking, pointer-trail-emitter, progressive-blur, reveal-hover-effect]
  - name: design-motion
    category: interaction
    sources: [animation-systems, animejs, gsap-core, gsap-scrolltrigger, gsap-timeline, lottie-animations, marquee-loop]
  - name: visualize-data
    category: representation
    sources: [d3-viz]
  - name: simulate-2d
    category: representation
    sources: [matterjs, pixijs-2d]
  - name: build-3d-scene
    category: representation
    sources: [cobejs, globe-gl, globe-particles, lightweight-3d-effects, threejs-landscape, threejs-towers, threejs-weather, threejs-webgl, vantajs, webgl-3d-object, webgl-laser]
  - name: build-learning-game
    category: learning
    sources: [mini-game]
  - name: review-page
    category: review
    sources: [frontend-design, design-taste-frontend, animation-systems]
not_imported:
  - name: babylonjs-engine
    reason: The Notale chassis ships Three.js, not Babylon.js; parallel engine guidance would create an unusable route.
  - name: barba-js
    reason: Cross-page route transitions do not match independent fixed-canvas lecture pages.
  - name: locomotive-scroll
    reason: Smooth-scroll infrastructure does not match the fixed 1600x900 page chassis.
  - name: scroll-reveal-libraries
    reason: Generic scroll reveal is replaced by state- and teaching-driven motion guidance.
