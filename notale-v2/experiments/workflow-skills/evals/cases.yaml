schema_version: 1
cases:
  - id: refs-typical
    workflow: collect-visual-references
    kind: typical
    title: 阿波罗实物证据
    interactive: false
    task: 为“宇航员依靠生命保障系统生存”页面找到一张可核验的 ISS 或阿波罗生命保障设备实物图，下载到本地并把关键设备区域做成可读的证据构图；保留来源、许可与不遮挡教学的署名。
  - id: refs-boundary
    workflow: collect-visual-references
    kind: boundary
    title: 史前石器的准确身份
    interactive: false
    task: 为“阿舍利手斧不是普通石块”页面找到带机构或馆藏身份的真实手斧图，避免复原画和无出处图片；让学生能比较对称刃缘、握持端与尺寸线索。

  - id: illustration-typical
    workflow: generate-illustration
    kind: typical
    title: 无文字的生境剖面
    interactive: false
    task: 生成并整合一张远古旱季稀树草原的横向环境插画，左侧保留动物与水源，右侧留出讲解空间；所有物种名、气候数值和箭头必须由页面代码叠加，像素中不得承载答案。
  - id: illustration-boundary
    workflow: generate-illustration
    kind: boundary
    title: 同系列材料隐喻
    interactive: false
    task: 为“肉体适应与技术外骨骼”制作左右连续、风格一致的两幅材料隐喻：粗糙石质与航天织物；它们只承担氛围和材质，不伪装成真实标本或精确结构图。

  - id: direction-biology
    workflow: set-visual-direction
    kind: typical
    title: 古人类野外记录
    interactive: false
    task: 为讲解古人类足迹证据的页面建立像野外记录本与地层标记结合的视觉世界；要专业、可投影，避免米色衬底加衬线大标题的模板化答案。
  - id: direction-engineering
    workflow: set-visual-direction
    kind: boundary
    title: 舱内生命支持
    interactive: false
    task: 为航天器闭环生命保障页面建立克制的工程诊断视觉方向，以管路、回路和材料语言组织信息；不要做成通用深色 SaaS 仪表盘或霓虹科幻背景。

  - id: composition-comparison
    workflow: compose-page
    kind: typical
    title: 同尺度生存预算
    interactive: false
    task: 在同一尺度上比较猿人一天携带的水与宇航员生命支持系统一天循环的水；构图必须让相同维度同行、共享基线，并把一句结论置于证据之后。
  - id: composition-process
    workflow: compose-page
    kind: boundary
    title: 从威胁到适应
    interactive: false
    task: 把“环境压力—身体或工具响应—生存收益—新限制”组成一条可见路径，同时展示地球与太空两条并行分支；不得退化成八张独立卡片。

  - id: typography-chinese
    workflow: shape-typography
    kind: typical
    title: 中文讲解与短标签
    interactive: false
    task: 排一页包含中文主张、两段短解释、六个图内标签和三个大数字的课堂讲义；建立清晰角色层级，处理中文换行和投影尺寸，不靠过多字重与颜色区分。
  - id: typography-formula
    workflow: shape-typography
    kind: boundary
    title: 公式、单位与口语解释
    interactive: false
    task: 在同一页安排火箭方程的 KaTeX 公式、变量定义、m/s 与 km/s 单位、中文口语解释和一个关键读数；公式不是海报装饰，嵌套字形与单位都必须可读。

  - id: interaction-drag
    workflow: design-interaction
    kind: typical
    title: 拖动改变支撑面积
    interactive: true
    task: 让学生拖动脚掌姿态，观察支撑多边形和稳定余量同步变化；只保留一个主动作，反馈贴着变化对象出现，并提供明确复位。
  - id: interaction-keyboard
    workflow: design-interaction
    kind: boundary
    title: 键盘与触摸都可完成的取舍
    interactive: true
    task: 让学生在质量受限的生命保障模块中选择两项冗余设备并看到剩余质量与风险变化；按钮必须支持键盘和触摸，非法第三项要得到就地反馈，固定文案不能与状态冲突。

  - id: motion-sequence
    workflow: design-motion
    kind: typical
    title: 氧气闭环分阶段显现
    interactive: true
    task: 用一条可控制的时间序列解释“呼出二氧化碳—吸收—电解—氧气返回”四步闭环；运动建立阅读顺序，学生可暂停、继续和复位，减少动态时保留完整信息。
  - id: motion-state
    workflow: design-motion
    kind: boundary
    title: 故障切换的连续性
    interactive: true
    task: 在主循环泵故障并切换到备份泵时，用空间连续性说明流向改变；不要靠闪烁或全页转场，动画结束后状态与数值必须稳定可读。

  - id: data-chart
    workflow: visualize-data
    kind: typical
    title: 温度生存窗口
    interactive: true
    task: 用共享温标比较裸露人体、衣物、航天服的可生存温区；提供一个拖动环境温度的动作，让图表、读数与结论同步，常规轴和图例使用 ECharts SVG 渲染。
  - id: data-network
    workflow: visualize-data
    kind: boundary
    title: 证据关系网络
    interactive: true
    task: 用 D3 构建“化石、工具、环境代理指标”如何共同支撑迁徙判断的关系图；选择节点时只突出相关证据链，不把力导向动画本身当成教学内容。

  - id: simulation-physics
    workflow: simulate-2d
    kind: typical
    title: 重心与稳定性
    interactive: true
    task: 构建一辆可辨认的侧视叉车稳定模型，至少呈现车架、前后轮、门架、货叉、驾驶位与货箱；玩家移动货箱时实时看到合成重心与支撑区。碰撞体不能直接充当成品外观：若用 Matter.js，它只负责物理，画面需用自绘 SVG/Canvas 或本地素材形成连贯叉车轮廓。模型可复位、可复现，标签放在可访问的 DOM 层。
  - id: simulation-many
    workflow: simulate-2d
    kind: boundary
    title: 辐射粒子的群体效应
    interactive: true
    task: 同时显示数千个粒子穿过三种屏蔽材料的统计结果；用 PixiJS 承担大量运动，以固定种子保证重开一致，DOM 中保留说明和关键读数，切换材料必须改变真实统计状态。

  - id: scene-structure
    workflow: build-3d-scene
    kind: typical
    title: 航天服分层结构
    interactive: true
    task: 用 Three.js 做可旋转的航天服材料分层模型；紧凑状态即使隐藏文字，也必须从头盔环、躯干、肩臂关节、腰部与生命保障背包认出航天服。各材料层应包覆同一人体轮廓并能有序拉开，禁止用棺材状平板或几块平行薄片代替。选择层后在 DOM 中显示功能，三维深度必须帮助理解层间关系。
  - id: scene-environment
    workflow: build-3d-scene
    kind: boundary
    title: 风暴中的落脚点
    interactive: true
    task: 构建一个低多边形地形与风暴方向场，学生改变风向后选择安全落脚区；天气效果、相机与地形共用同一状态，低性能或减少动态时提供静态俯视替代。

  - id: game-classify
    workflow: build-learning-game
    kind: typical
    title: 发掘现场的证据侦探
    interactive: true
    task: 把“证据还是想象”做成一个可重玩的发掘现场小游戏：玩家在六格遗址中用有限行动选择刷土、测层或取样，发现会改变现场、剩余行动与下一步策略；在行动耗尽前拼出一条可追溯的证据链。不得出现逐题选择类别、答题卡或按正确率结算；成功与失败由发现的线索、工具顺序和证据链规则推导，并提供明确游戏反馈与重玩。
  - id: game-tradeoff
    workflow: build-learning-game
    kind: boundary
    title: 有限质量下的生存取舍
    interactive: true
    task: 做一个只有一轮核心决策的资源权衡游戏：在固定发射质量内组合氧、水、屏蔽和冗余；结局必须由真实规则计算，不使用任意分数，失败和成功都能复位重试。

  - id: review-density
    workflow: review-page
    kind: typical
    title: 修复拥挤比较页
    interactive: false
    fixture: review-density.html
    task: 审查并修复现有的水资源比较页。保留其事实与对照任务，解决阅读顺序、卡片堆叠、字号、对齐和投影可读性问题；用前后渲染证据确认，而不是另做一个主题。
  - id: review-states
    workflow: review-page
    kind: boundary
    title: 修复矛盾状态与访问路径
    interactive: true
    fixture: review-states.html
    task: 审查并修复现有设备选择页。保留“最多选择两项”的学习任务，补齐非法动作反馈、键盘、状态一致性和复位，修正固定结论文案与可变选择冲突的问题。
