<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root{ --bg:#EEF1F5; --text:#111820; --font-sans:"Noto Sans CJK SC",ui-sans-serif,system-ui,sans-serif; }
  #stage{
    position:relative; overflow:hidden;
    background:var(--bg); color:var(--text);
    font-family:var(--font-sans);
  }
  #field{ position:absolute; inset:0; z-index:1; }
  .copy{
    position:absolute; z-index:5;
    left:112px; top:0; bottom:0;
    width:640px;
    display:flex; flex-direction:column; justify-content:center;
    pointer-events:none;
  }
  .kicker{
    color:var(--weight); font:600 15px/1 "JetBrains Mono",ui-monospace,Consolas,monospace;
    letter-spacing:.12em;
  }
  h1{
    margin:18px 0 0; font-family:"Clear Sans","Noto Sans CJK SC",ui-sans-serif,sans-serif;
    font-weight:700; font-size:96px; line-height:1.02; letter-spacing:-.01em;
    color:var(--text);
  }
  h1 .en{
    display:block; margin-top:6px;
    font-size:34px; font-weight:600; letter-spacing:.01em;
    color:var(--muted);
  }
  .lead{
    margin-top:30px; max-width:560px;
    font-size:22px; line-height:1.6; color:var(--text);
  }
  .lead strong{ color:var(--weight); font-weight:600; }
  .legend{
    margin-top:38px; display:flex; gap:32px;
  }
  .legend .li{ display:flex; align-items:center; gap:10px; font-size:15px; color:var(--muted); }
  .legend .sw{ width:14px; height:14px; border-radius:50%; flex:none; }
  .legend .sw.weak{ background:var(--weak); }
  .legend .sw.error{ background:var(--error); }
  .legend .sw.correct{ background:var(--correct); }
  .legend .sw.weight{ background:var(--weight); border-radius:3px; }
</style>
</head>
<body data-page="01" data-total="16">
<div id="stage" tabindex="0" aria-label="AdaBoosting 算法。多条弱分类器依次尝试划分样本，错分样本权重被放大，多条弱边界叠加成一条更强的组合边界。">
  <canvas id="field" class="cv-fill" aria-hidden="true"></canvas>
  <div class="copy">
    <p class="kicker">ENSEMBLE · 自适应提升</p>
    <h1>AdaBoosting<span class="en">算法</span></h1>
    <p class="lead">
      一条弱分类器只能勉强分对一部分样本。把<strong>被它分错的样本权重调高</strong>，
      交给下一条弱分类器重点纠正，如此反复——多条弱分类器按各自的准确度加权叠加，
      最终组合成一条强分类边界。
    </p>
    <div class="legend" aria-hidden="true">
      <div class="li"><span class="sw weak"></span>弱分类器</div>
      <div class="li"><span class="sw error"></span>当前错分样本</div>
      <div class="li"><span class="sw correct"></span>已分对样本</div>
      <div class="li"><span class="sw weight"></span>权重越高·点越大</div>
    </div>
  </div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
(() => {
  "use strict";

  // ---- 概念：样本权重驱动的序列纠错 ----
  // 一批带权重的点分布在两类之间；每一轮一条"弱分类器"(倾斜阈值线)
  // 尝试划分它们，分错的点权重被放大(变大变亮)，
  // 下一轮的弱分类器角度会向这些重点样本偏移；
  // 若干条弱线按各自的准确度加权叠加，画出一条更强的组合边界。

  const CONFIG = Object.freeze({
    seed: "adaboost-cover-v1",
    n: 150,
    rounds: 4,
    roundPeriod: 3400,   // 每轮的时长(ms)
    margin: 40
  });

  const TITLE_FIELD = { x: 112, y: 0, w: 660, h: 900 }; // 逻辑坐标下的标题排斥区(左侧)

  const stage = document.querySelector("#stage");
  const canvas = document.querySelector("#field");
  const reducedMotion = Deck.reduced();

  let ctx, W = 1600, H = 900;
  let samples = [];
  let classifiers = []; // {a,b,c, acc, alpha}  ax+by+c=0 定义的方向线
  let disposed = false;
  let stopLoop = () => {};
  let removeResize = () => {};

  let weakCol, errCol, correctCol, weightCol, lineCol, muted;

  function inTitleField(x, y) {
    return x >= TITLE_FIELD.x - 20 && x <= TITLE_FIELD.x + TITLE_FIELD.w &&
           y >= TITLE_FIELD.y && y <= TITLE_FIELD.y + TITLE_FIELD.h;
  }

  // 数据区限制在标题右侧 (x > 800 大致对应 copy 区右边界之后留白)
  const DATA_X0 = 820, DATA_X1 = 1560, DATA_Y0 = 90, DATA_Y1 = 810;

  function buildSamples(random) {
    const list = [];
    // 两个重叠的类簇：class -1 偏左下，class +1 偏右上，带有交界噪声
    for (let i = 0; i < CONFIG.n; i++) {
      const cls = i % 2 === 0 ? -1 : 1;
      const cx = cls === -1 ? DATA_X0 + (DATA_X1 - DATA_X0) * 0.36 : DATA_X0 + (DATA_X1 - DATA_X0) * 0.64;
      const cy = cls === -1 ? DATA_Y0 + (DATA_Y1 - DATA_Y0) * 0.62 : DATA_Y0 + (DATA_Y1 - DATA_Y0) * 0.38;
      const spread = 195;
      const x = Deck.clamp(cx + (random() - 0.5) * spread * 2.1, DATA_X0, DATA_X1);
      const y = Deck.clamp(cy + (random() - 0.5) * spread * 1.7, DATA_Y0, DATA_Y1);
      list.push({ x, y, cls, w: 1 });
    }
    return list;
  }

  // 以簇中心连线的法线方向为基准，生成一条带角度扰动的弱分类线，
  // 并向"当前权重最大的错分点"偏移，模拟"重点纠正"
  function fitWeakClassifier(pts, random, biasPoint) {
    // 基准方向：让分割线大致垂直于两类中心连线
    let sx1 = 0, sy1 = 0, n1 = 0, sx2 = 0, sy2 = 0, n2 = 0;
    for (const p of pts) {
      if (p.cls === -1) { sx1 += p.x; sy1 += p.y; n1++; }
      else { sx2 += p.x; sy2 += p.y; n2++; }
    }
    const c1x = sx1 / n1, c1y = sy1 / n1, c2x = sx2 / n2, c2y = sy2 / n2;
    let dx = c2x - c1x, dy = c2y - c1y;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;

    // 法线方向作为分割线方向，加角度抖动
    let angle = Math.atan2(dy, dx) + Math.PI / 2 + (random() - 0.5) * 0.7;
    // 向偏置点(权重最大的错分点)方向拉一点，模拟"聚焦难分样本"
    if (biasPoint) {
      const bx = biasPoint.x - (c1x + c2x) / 2;
      const by = biasPoint.y - (c1y + c2y) / 2;
      const bAngle = Math.atan2(by, bx);
      angle = angle * 0.7 + bAngle * 0.3;
    }
    const nx = Math.cos(angle), ny = Math.sin(angle);
    const midx = (c1x + c2x) / 2 + (random() - 0.5) * 90;
    const midy = (c1y + c2y) / 2 + (random() - 0.5) * 90;
    const c = -(nx * midx + ny * midy);

    // 判断方向：让 class -1 落在负侧
    let side1 = nx * c1x + ny * c1y + c;
    let sign = side1 < 0 ? 1 : -1;

    return { a: nx * sign, b: ny * sign, c: c * sign, midx, midy, nx: nx * sign, ny: ny * sign };
  }

  function classify(line, p) {
    return line.a * p.x + line.b * p.y + line.c >= 0 ? 1 : -1;
  }

  function runRound(random) {
    // 找当前权重最大的点作为"聚焦目标"（模拟被反复分错的难样本）
    let biasPoint = null, maxW = -1;
    for (const p of samples) if (p.w > maxW) { maxW = p.w; biasPoint = p; }

    const line = fitWeakClassifier(samples, random, classifiers.length ? biasPoint : null);

    // 计算加权错误率
    let wrongW = 0, totalW = 0;
    for (const p of samples) {
      totalW += p.w;
      const pred = classify(line, p);
      if (pred !== p.cls) wrongW += p.w;
    }
    const err = Math.max(1e-3, Math.min(0.499, wrongW / totalW));
    const alpha = 0.5 * Math.log((1 - err) / err);
    const acc = 1 - err;

    // 更新样本权重：分错的点权重放大，然后归一化
    for (const p of samples) {
      const pred = classify(line, p);
      const wrong = pred !== p.cls;
      p.wrong = wrong;
      p.w = p.w * Math.exp(alpha * (wrong ? 1 : -1));
    }
    let sumW = 0;
    for (const p of samples) sumW += p.w;
    for (const p of samples) p.w = p.w / sumW * CONFIG.n; // 归一化到均值 1 附近

    classifiers.push({ ...line, acc, alpha, err });
    if (classifiers.length > CONFIG.rounds) classifiers.shift();
  }

  function resetModel() {
    const random = new Math.seedrandom(CONFIG.seed);
    samples = buildSamples(random);
    classifiers = [];
    for (let i = 0; i < CONFIG.rounds; i++) runRound(random);
  }

  function lineEndpoints(line) {
    // 在数据区域内裁出线段：沿方向向量 (-b, a) 画一条足够长的线，再与矩形相交（近似：直接延伸后由 clip 裁剪）
    const dirx = -line.ny, diry = line.nx;
    const L = 900;
    return {
      x1: line.midx - dirx * L, y1: line.midy - diry * L,
      x2: line.midx + dirx * L, y2: line.midy + diry * L
    };
  }

  function rgba(rgb, a) { return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`; }

  function draw(progress) {
    if (!ctx || disposed) return;
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    ctx.beginPath();
    ctx.rect(DATA_X0 - 30, DATA_Y0 - 30, DATA_X1 - DATA_X0 + 60, DATA_Y1 - DATA_Y0 + 60);
    ctx.clip();

    // 组合边界的进度：0..rounds 之间平滑过渡，展示"逐轮叠加"
    const roundFloat = progress * CONFIG.rounds;
    const activeRound = Math.min(CONFIG.rounds - 1, Math.floor(roundFloat));
    const roundT = Deck.clamp(roundFloat - activeRound, 0, 1);

    // 已完成的弱分类线：淡显示
    for (let i = 0; i < classifiers.length; i++) {
      const shown = i < activeRound ? 1 : (i === activeRound ? roundT : 0);
      if (shown <= 0) continue;
      const line = classifiers[i];
      const { x1, y1, x2, y2 } = lineEndpoints(line);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      const isCurrent = i === activeRound;
      ctx.strokeStyle = rgba(weakCol, isCurrent ? 0.55 * shown : 0.22);
      ctx.lineWidth = isCurrent ? 2.4 : 1.3;
      ctx.setLineDash(isCurrent ? [] : [7, 6]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 样本点：按"到当前轮次为止"的加权错分状态着色
    // 用离散轮次索引重演该时刻应有的分类结果（用 classifiers 前 activeRound+1 条加权投票近似强分类器状态）
    for (const p of samples) {
      let vote = 0, wsum = 0;
      const upto = Math.min(classifiers.length, activeRound + 1);
      for (let i = 0; i < upto; i++) {
        const c = classifiers[i];
        const w = i === activeRound ? c.alpha * roundT : c.alpha;
        vote += w * classify(c, p);
        wsum += Math.abs(w);
      }
      const combinedPred = wsum > 0 ? (vote >= 0 ? 1 : -1) : 0;
      const misclassified = combinedPred !== 0 && combinedPred !== p.cls;

      const baseR = 3.4 + Math.min(2.6, (p.w - 1) * 1.6);
      const r = misclassified ? baseR * 1.25 : baseR;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = misclassified ? rgba(errCol, 0.92) : rgba(correctCol, 0.72);
      ctx.fill();
      if (misclassified) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, r + 2.4, 0, Math.PI * 2);
        ctx.strokeStyle = rgba(errCol, 0.35);
        ctx.lineWidth = 1.4;
        ctx.stroke();
      }
    }

    ctx.restore();

    // 右上角：当前轮次读数（用真实计算出的准确度/alpha）
    const shownIdx = Math.min(classifiers.length - 1, activeRound);
    const c = classifiers[shownIdx];
    if (c) {
      const label = `第 ${shownIdx + 1}/${CONFIG.rounds} 轮弱分类器 · 准确率 ${(c.acc * 100).toFixed(0)}% · 权重 α=${c.alpha.toFixed(2)}`;
      ctx.font = "13px 'JetBrains Mono',ui-monospace,Consolas,monospace";
      ctx.fillStyle = rgba(muted, 0.85);
      ctx.textAlign = "right";
      ctx.fillText(label, DATA_X1 - 10, DATA_Y0 - 12);
    }
  }

  let startTime = null;
  function renderFrame(time) {
    if (startTime === null) startTime = time;
    const elapsed = time - startTime;
    const totalPeriod = CONFIG.roundPeriod * CONFIG.rounds;
    const t = reducedMotion ? 0.999 : (elapsed % totalPeriod) / totalPeriod;
    draw(t);
  }

  function readColors() {
    weakCol = Deck.rgb("weak");
    errCol = Deck.rgb("error");
    correctCol = Deck.rgb("correct");
    weightCol = Deck.rgb("weight");
    lineCol = Deck.rgb("line");
    muted = Deck.rgb("muted");
  }

  function boot() {
    ctx = Deck.fit(canvas);
    readColors();
    resetModel();
    if (reducedMotion) {
      draw(0.999);
    } else {
      stopLoop = Deck.loop(renderFrame, { still: 0.999 });
    }
    removeResize = Deck.onResize(() => {
      if (disposed) return;
      ctx = Deck.fit(canvas);
      draw(reducedMotion ? 0.999 : 0);
    });
  }

  function dispose() {
    if (disposed) return;
    disposed = true;
    stopLoop();
    removeResize();
  }
  window.addEventListener("pagehide", dispose, { once: true });

  Deck.init({ keys: false });
  boot();
})();
</script>
</body>
</html>
