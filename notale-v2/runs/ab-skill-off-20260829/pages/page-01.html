<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>神经网络是怎么学会的</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .cover{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;z-index:1}.cover header{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;max-width:1320px;padding-top:10px}.cover h1{font-size:58px;line-height:1.1;letter-spacing:-.035em}.cover .lead{max-width:1120px;color:var(--muted)}
    .hero{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:34px;align-items:stretch;padding-top:28px;padding-bottom:8px}.loop-board{position:relative;min-width:0;min-height:0;border-top:2px solid var(--text);border-bottom:2px solid var(--text);background:rgba(255,255,255,.7);overflow:hidden}.loop-board svg{display:block;width:100%;height:100%}
    .node,.edge,.edge-label,.stepmark{transition:opacity .22s ease,stroke-width .22s ease,fill .22s ease,stroke .22s ease}.node text{font-family:var(--font-sans);fill:var(--text)}.node .sym{font-family:var(--font-num);font-weight:600}.node .sub{font-size:15px;fill:var(--muted)}.edge{fill:none;stroke-width:4}.edge.forward{stroke:var(--model)}.edge.observed{stroke:var(--observed)}.edge.backward{stroke:var(--gradient);stroke-dasharray:10 8}.edge.adjust{stroke:var(--gradient)}.edge-label{font-family:var(--font-sans);font-size:15px;font-weight:600}.stepmark{fill:var(--surface);stroke:var(--rule);stroke-width:2}.stepnum{font-family:var(--font-num);font-size:14px;font-weight:600;fill:var(--muted)}
    .loop-board[data-step="1"] .phase:not(.p1),.loop-board[data-step="2"] .phase:not(.p2),.loop-board[data-step="3"] .phase:not(.p3),.loop-board[data-step="4"] .phase:not(.p4){opacity:.24}.loop-board[data-step="1"] .p1.edge,.loop-board[data-step="2"] .p2.edge,.loop-board[data-step="3"] .p3.edge,.loop-board[data-step="4"] .p4.edge{stroke-width:7}.loop-board[data-step="1"] .p1 .stepmark,.loop-board[data-step="2"] .p2 .stepmark,.loop-board[data-step="3"] .p3 .stepmark,.loop-board[data-step="4"] .p4 .stepmark{fill:var(--attention-soft);stroke:var(--attention)}
    .side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;border-left:2px solid var(--rule);padding-left:32px}.eyebrow{font-family:var(--font-num);font-size:var(--fs-label);font-weight:600;letter-spacing:.06em;color:var(--muted);margin-bottom:12px}.state-title{font-size:var(--fs-h2);line-height:1.25;margin-bottom:12px}.state-copy{font-size:var(--fs-sec);line-height:1.55;color:var(--muted);min-height:82px}.readline{margin-top:24px;padding:18px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}.readline .flow{font-family:var(--font-num);font-size:var(--fs-body);line-height:1.5;font-weight:600}.flow .f{color:var(--model)}.flow .o{color:var(--observed)}.flow .b{color:var(--gradient)}.side .btns{margin-top:24px}.side .hint{margin-top:14px}.corner-note{position:absolute;left:24px;bottom:18px;color:var(--muted);font-size:var(--fs-label);line-height:1.4}@media (prefers-reduced-motion:reduce){.node,.edge,.edge-label,.stepmark{transition:none}}
  </style>
</head>
<body data-page="01" data-total="25">
  <div id="stage">
    <section class="cover"><header><div class="kicker">NEURAL NETWORKS · LEARNING LOOP</div><h1>神经网络是怎么学会的</h1><p class="lead">从一个神经元出发，追踪预测、误差与反向传播如何连成学习闭环。</p></header>
      <main class="hero min0"><div class="loop-board min0" id="loopBoard" data-step="0" role="img" aria-label="输入经过神经元得到预测，预测与目标比较形成误差，误差反向传播并调整参数，再开始下一次预测">
        <svg viewBox="0 0 1030 590" aria-hidden="true"><defs><marker id="arrowF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1F5FAE"/></marker><marker id="arrowO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24705A"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C94F20"/></marker></defs>
          <g class="phase p1"><path class="edge forward p1" d="M150 255 C235 255 250 255 325 255" marker-end="url(#arrowF)"/><path class="edge forward p1" d="M505 255 C590 255 605 255 680 255" marker-end="url(#arrowF)"/><text class="edge-label" x="216" y="228" fill="#1F5FAE">加权求和</text><g transform="translate(238 178)"><circle class="stepmark" r="17"/><text class="stepnum" text-anchor="middle" dy="5">1</text></g></g>
          <g class="node phase p1" transform="translate(70 205)"><rect width="120" height="100" rx="10" fill="#E4F1EC" stroke="#24705A" stroke-width="3"/><text x="60" y="42" text-anchor="middle" font-size="21" font-weight="650">输入</text><text class="sym" x="60" y="72" text-anchor="middle" font-size="18">x</text></g><g class="node phase p1 p4" transform="translate(325 175)"><circle cx="90" cy="80" r="78" fill="#E4EEF9" stroke="#1F5FAE" stroke-width="4"/><text x="90" y="65" text-anchor="middle" font-size="22" font-weight="650">一个神经元</text><text class="sym" x="90" y="94" text-anchor="middle" font-size="18">w · x + b</text><text class="sub" x="90" y="121" text-anchor="middle">参数决定输出</text></g><g class="node phase p1 p2" transform="translate(680 205)"><rect width="130" height="100" rx="10" fill="#E4EEF9" stroke="#1F5FAE" stroke-width="3"/><text x="65" y="42" text-anchor="middle" font-size="21" font-weight="650">预测</text><text class="sym" x="65" y="72" text-anchor="middle" font-size="18">ŷ</text></g>
          <g class="phase p2"><path class="edge observed p2" d="M875 110 L875 200" marker-end="url(#arrowO)"/><path class="edge forward p2" d="M810 255 L895 255" marker-end="url(#arrowF)"/><g transform="translate(850 178)"><circle class="stepmark" r="17"/><text class="stepnum" text-anchor="middle" dy="5">2</text></g></g><g class="node phase p2" transform="translate(817 34)"><rect width="116" height="76" rx="10" fill="#E4F1EC" stroke="#24705A" stroke-width="3"/><text x="58" y="32" text-anchor="middle" font-size="19" font-weight="650">目标</text><text class="sym" x="58" y="57" text-anchor="middle" font-size="17">y</text></g><g class="node phase p2 p3" transform="translate(895 205)"><rect width="112" height="100" rx="10" fill="#FBE9E2" stroke="#C94F20" stroke-width="3"/><text x="56" y="42" text-anchor="middle" font-size="21" font-weight="650">误差</text><text class="sym" x="56" y="72" text-anchor="middle" font-size="18">L</text></g>
          <g class="phase p3"><path class="edge backward p3" d="M949 305 C945 435 730 474 515 427" marker-end="url(#arrowB)"/><text class="edge-label" x="710" y="473" fill="#C94F20">梯度反向传递</text><g transform="translate(825 430)"><circle class="stepmark" r="17"/><text class="stepnum" text-anchor="middle" dy="5">3</text></g></g><g class="node phase p3 p4" transform="translate(365 377)"><rect width="150" height="96" rx="10" fill="#FBE9E2" stroke="#C94F20" stroke-width="3"/><text x="75" y="39" text-anchor="middle" font-size="21" font-weight="650">参数调整</text><text class="sym" x="75" y="69" text-anchor="middle" font-size="17">w, b</text></g>
          <g class="phase p4"><path class="edge adjust p4" d="M365 425 C225 415 145 355 130 305" marker-end="url(#arrowB)"/><text class="edge-label" x="165" y="402" fill="#C94F20">更新后再预测</text><g transform="translate(276 374)"><circle class="stepmark" r="17"/><text class="stepnum" text-anchor="middle" dy="5">4</text></g></g></svg><p class="corner-note">同一批参数重复经历这个闭环，预测才会逐次改变。</p></div>
        <aside class="side min0" aria-live="polite"><div class="eyebrow" id="stateKicker">全景</div><h2 class="state-title" id="stateTitle">学习不是一次算出答案</h2><p class="state-copy" id="stateCopy">神经元先给出预测，再用误差决定参数该往哪里改。更新后的参数进入下一轮计算。</p><div class="readline"><div class="flow"><span class="f">预测</span> · <span class="o">目标</span> · <span class="b">误差与梯度</span></div></div><div class="btns"><button class="btn" id="nextBtn" type="button">逐段查看学习闭环</button><button class="btn" id="resetBtn" type="button" disabled>恢复全景</button></div><p class="hint">每次点击突出一段信息流</p></aside></main></section>
  </div>
  <script src="assets/base.js"></script><script>
    Deck.init({index:1,total:25});const board=document.getElementById('loopBoard'),nextBtn=document.getElementById('nextBtn'),resetBtn=document.getElementById('resetBtn'),kicker=document.getElementById('stateKicker'),title=document.getElementById('stateTitle'),copy=document.getElementById('stateCopy');const states=[['全景','学习不是一次算出答案','神经元先给出预测，再用误差决定参数该往哪里改。更新后的参数进入下一轮计算。'],['前向计算','输入变成预测','输入与参数在神经元中组合，产生当前预测。参数不同，预测也会不同。'],['计算误差','预测与目标相比较','目标来自训练数据。预测和目标的差异被写成损失，用来衡量这次预测偏了多少。'],['反向传播','误差信息沿计算关系返回','梯度说明每个参数对误差造成了多大影响，并给出降低误差的调整方向。'],['更新参数','带着新参数进入下一轮','权重和偏置调整后，神经元重新计算。反复循环，预测逐步贴近训练目标。']];let step=0;function render(){board.dataset.step=String(step);kicker.textContent=states[step][0];title.textContent=states[step][1];copy.textContent=states[step][2];resetBtn.disabled=step===0;nextBtn.textContent=step===4?'从前向计算重新查看':'查看下一段信息流';nextBtn.setAttribute('aria-label',nextBtn.textContent)}nextBtn.addEventListener('click',()=>{step=step===4?1:step+1;render()});resetBtn.addEventListener('click',()=>{step=0;render()});render();
  </script>
</body>
</html>
