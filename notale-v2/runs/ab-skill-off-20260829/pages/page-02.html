<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学习路线｜神经网络是怎么学会的</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .route-page{display:grid;grid-template-rows:auto minmax(0,1fr);gap:24px;flex:1;min-height:0;position:relative;z-index:1}.route-page>header{display:flex;flex-direction:column;gap:8px;max-width:1260px}.route-page h1{max-width:1220px}.lead{max-width:1220px;color:var(--muted)}
    .route-main{display:grid;grid-template-rows:minmax(0,1fr) 188px;gap:22px;min-height:0}.route-map{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;gap:18px;padding:18px 20px 12px}.route-map::before{content:"";position:absolute;left:10%;right:10%;top:50%;height:3px;background:var(--rule);transform:translateY(-1px);z-index:0}
    .step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}.step:nth-child(2n){transform:translateY(54px)}.step:nth-child(2n+1){transform:translateY(-54px)}.step-btn{width:112px;height:112px;border:3px solid var(--rule);border-radius:50%;background:var(--surface);color:var(--text);font-family:var(--font-num);font-size:28px;font-weight:600;cursor:pointer;box-shadow:0 7px 18px rgba(23,33,43,.08);transition:border-color .18s ease,background .18s ease,transform .18s ease}.step-btn:hover{border-color:var(--text);transform:translateY(-2px)}.step-btn:focus-visible{outline:4px solid var(--focus);outline-offset:4px}.step-btn[aria-selected="true"]{border-color:var(--attention);background:var(--attention-soft);box-shadow:inset 0 0 0 3px var(--attention)}
    .step-label{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-height:72px}.step-label strong{font-size:var(--fs-body);line-height:1.3}.step-label span{color:var(--muted);font-size:var(--fs-label);line-height:1.35}.bridge{position:absolute;z-index:2;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--muted)}.bridge svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.b1{left:20.5%}.b2{left:40%}.b3{left:60%}.b4{left:79.5%}
    .detail{display:grid;grid-template-columns:238px minmax(0,1fr) 310px;align-items:center;gap:26px;padding:22px 28px}.detail-index{display:flex;align-items:baseline;gap:12px;color:var(--model)}.detail-index .big{font-size:68px}.detail-index .unit{font-size:var(--fs-sec)}.detail-copy{display:grid;gap:7px;padding:0 26px;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}.detail-copy p{color:var(--muted);font-size:var(--fs-sec);line-height:1.48}.detail-role{display:grid;gap:7px}.detail-role .role-label{color:var(--muted);font-family:var(--font-num);font-size:var(--fs-label);letter-spacing:.06em}.detail-role strong{font-size:var(--fs-lead);line-height:1.35;color:var(--observed)}@media (prefers-reduced-motion:reduce){.step-btn{transition:none}}
  </style>
</head>
<body data-page="02" data-total="25">
  <div id="stage"><section class="route-page"><header><div class="kicker">学习路线 · 5 个连续问题</div><h1>神经网络的学习，是一条从计算到更新的信号链</h1><p class="lead">全套依次回答：神经元怎样计算、误差怎样度量、梯度怎样指路、误差信号怎样反传，以及训练怎样真正发生。</p></header>
    <main class="route-main min0"><nav class="route-map min0" aria-label="课程的五个问题">
      <div class="step"><button class="step-btn" type="button" aria-selected="true" data-step="0" aria-controls="route-detail">01</button><div class="step-label"><strong>神经元怎样计算</strong><span>输入汇成一次预测</span></div></div>
      <div class="step"><button class="step-btn" type="button" aria-selected="false" data-step="1" aria-controls="route-detail">02</button><div class="step-label"><strong>误差怎样度量</strong><span>预测与目标相比较</span></div></div>
      <div class="step"><button class="step-btn" type="button" aria-selected="false" data-step="2" aria-controls="route-detail">03</button><div class="step-label"><strong>梯度怎样指路</strong><span>找到降低误差的方向</span></div></div>
      <div class="step"><button class="step-btn" type="button" aria-selected="false" data-step="3" aria-controls="route-detail">04</button><div class="step-label"><strong>信号怎样反传</strong><span>把责任逐层送回去</span></div></div>
      <div class="step"><button class="step-btn" type="button" aria-selected="false" data-step="4" aria-controls="route-detail">05</button><div class="step-label"><strong>训练怎样发生</strong><span>反复更新参数</span></div></div>
      <span class="bridge b1" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h13m-4-4 4 4-4 4"/></svg></span><span class="bridge b2" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h13m-4-4 4 4-4 4"/></svg></span><span class="bridge b3" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h13m-4-4 4 4-4 4"/></svg></span><span class="bridge b4" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h13m-4-4 4 4-4 4"/></svg></span>
    </nav>
    <section class="panel detail" id="route-detail" aria-live="polite"><div class="detail-index"><span class="big" id="detail-num">01</span><span class="unit">起点</span></div><div class="detail-copy min0"><h2 id="detail-title">先算出一个结果</h2><p id="detail-text">输入乘以权重，再加上偏置；激活函数把总和变成神经元的输出。</p></div><div class="detail-role"><span class="role-label">这一问交给下一问</span><strong id="detail-next">预测值</strong></div></section></main>
  </section></div>
  <script src="assets/base.js"></script><script>
    Deck.init({index:2,total:25});
    const items=[{num:'01',unit:'起点',title:'先算出一个结果',text:'输入乘以权重，再加上偏置；激活函数把总和变成神经元的输出。',next:'预测值'},{num:'02',unit:'比较',title:'给偏差一个数值',text:'损失函数比较预测值与目标值，把差距压缩成一个可计算的标量。',next:'损失'},{num:'03',unit:'方向',title:'判断参数该往哪边动',text:'梯度描述参数轻微变化时，损失会怎样变化；沿反方向更新可让损失下降。',next:'每个参数的梯度'},{num:'04',unit:'归因',title:'把误差信号逐层送回',text:'链式法则沿计算关系反向传播，把输出端的变化分配到前面每一层。',next:'各层的梯度'},{num:'05',unit:'循环',title:'用反馈反复改参数',text:'一次训练包含前向计算、度量损失、反向传播与参数更新；多轮重复后，预测逐渐贴近目标。',next:'更合适的参数'}];
    const buttons=[...document.querySelectorAll('.step-btn')],num=document.getElementById('detail-num'),unit=document.querySelector('.detail-index .unit'),title=document.getElementById('detail-title'),text=document.getElementById('detail-text'),next=document.getElementById('detail-next');
    function select(i){buttons.forEach((b,j)=>b.setAttribute('aria-selected',String(i===j)));const d=items[i];num.textContent=d.num;unit.textContent=d.unit;title.textContent=d.title;text.textContent=d.text;next.textContent=d.next}buttons.forEach((b,i)=>b.addEventListener('click',()=>select(i)));
  </script>
</body></html>
