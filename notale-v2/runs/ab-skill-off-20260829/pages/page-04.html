<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{background-image:none}.diagram{gap:18px}.diagram>header{max-width:1280px}.lead{color:var(--muted)}.diagram>main{position:relative;padding-top:58px}
.neuron-map{height:100%;display:grid;grid-template-columns:minmax(0,1.04fr) 110px minmax(0,1fr) 110px minmax(0,.88fr);align-items:stretch;counter-reset:calcstep}.step{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:28px 32px;border:2px solid var(--rule);border-radius:10px;background:var(--surface);box-shadow:0 7px 18px rgba(23,33,43,.08)}.weighted{border-color:var(--model)}.activated{border-color:var(--gradient)}.output{border-color:var(--observed)}
.step-head{display:flex;align-items:baseline;gap:14px}.step-head:before{counter-increment:calcstep;content:counter(calcstep,decimal-leading-zero);color:var(--muted);font-family:var(--font-num);font-size:var(--fs-label);font-weight:600}.input-list{display:grid;gap:13px}.input-row{display:grid;grid-template-columns:54px 42px minmax(0,1fr);align-items:center;gap:10px;color:var(--muted);font-size:var(--fs-sec)}.symbol{font-family:var(--font-num);font-size:var(--fs-body);font-weight:600;color:var(--observed)}.times{color:var(--rule);text-align:center;font-family:var(--font-num)}.weight{color:var(--model);font-family:var(--font-num);font-weight:600}
.formula{padding:20px 0;border-top:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);font-family:var(--font-num);font-size:31px;line-height:1.35;text-align:center;color:var(--model);white-space:nowrap}.formula .bias{color:var(--text)}.formula.grad{color:var(--gradient)}.formula sub{font-size:.55em}.explain{color:var(--muted);font-size:var(--fs-sec);line-height:1.55}.explain strong{color:var(--text)}.activation-plot{height:188px}.activation-plot svg{overflow:visible}.output-value{font-family:var(--font-num);color:var(--observed);font-size:66px;line-height:1;font-weight:600;text-align:center}.output-label{text-align:center;color:var(--muted);font-size:var(--fs-sec)}
.connector{position:relative;min-width:0}.connector:before{content:"";position:absolute;top:50%;left:18px;right:27px;height:3px;background:currentColor;transform:translateY(-50%)}.connector:after{content:"";position:absolute;top:50%;right:18px;width:16px;height:16px;border-top:3px solid currentColor;border-right:3px solid currentColor;transform:translateY(-50%) rotate(45deg)}.connector.forward{color:var(--model)}.connector.nonlinear{color:var(--gradient)}.connector span{position:absolute;top:calc(50% - 42px);left:50%;transform:translateX(-50%);white-space:nowrap;color:var(--muted);font-size:var(--fs-label)}.takeaway{position:absolute;right:0;top:4px;width:276px;padding-top:12px;border-top:3px solid var(--text);color:var(--text);font-size:var(--fs-sec);line-height:1.5;font-weight:600}
</style>
</head>
<body data-page="04" data-total="25">
<div id="stage">
<section class="diagram"><header><div class="kicker">单个神经元 · 两步计算</div><h1>神经元先加权汇总，再用激活函数产生输出</h1><p class="lead">它是一个可训练的计算单元，不是缩小版的生物神经元。</p></header>
<main class="min0"><p class="takeaway">训练会调整权重与偏置；激活函数规定这个单元怎样响应汇总结果。</p><div class="neuron-map">
<article class="step weighted min0"><div class="step-head"><h2>对输入加权汇总</h2></div><div class="input-list" aria-label="输入与权重相乘"><div class="input-row"><span class="symbol">x<sub>1</sub></span><span class="times">×</span><span class="weight">w<sub>1</sub></span></div><div class="input-row"><span class="symbol">x<sub>2</sub></span><span class="times">×</span><span class="weight">w<sub>2</sub></span></div><div class="input-row"><span class="symbol">⋮</span><span></span><span class="weight">⋮</span></div><div class="input-row"><span class="symbol">x<sub>n</sub></span><span class="times">×</span><span class="weight">w<sub>n</sub></span></div></div><div class="formula">z = Σ w<sub>i</sub>x<sub>i</sub> <span class="bias">+ b</span></div><p class="explain"><strong>权重 w</strong> 决定各输入的影响，<strong>偏置 b</strong> 平移响应门槛。</p></article>
<div class="connector forward" aria-hidden="true"><span>汇总值 z</span></div>
<article class="step activated min0"><div class="step-head"><h2>经过激活函数</h2></div><div class="activation-plot cvbox" role="img" aria-label="激活函数把汇总值 z 映射成输出 a"><svg viewBox="0 0 360 190" aria-hidden="true"><line x1="38" y1="155" x2="334" y2="155" stroke="#AAB4BE" stroke-width="2"/><line x1="180" y1="174" x2="180" y2="20" stroke="#AAB4BE" stroke-width="2"/><path d="M48 148 C108 146 137 137 158 111 C178 86 185 63 210 48 C239 31 280 28 326 27" fill="none" stroke="#C94F20" stroke-width="6" stroke-linecap="round"/><circle cx="180" cy="83" r="7" fill="#E3A51A"/><line x1="180" y1="83" x2="180" y2="155" stroke="#E3A51A" stroke-width="2" stroke-dasharray="6 6"/><line x1="180" y1="83" x2="38" y2="83" stroke="#E3A51A" stroke-width="2" stroke-dasharray="6 6"/><text x="339" y="161" fill="#55616D" font-size="15">z</text><text x="28" y="25" fill="#55616D" font-size="15">a</text><text x="202" y="102" fill="#C94F20" font-size="17">a = f(z)</text></svg></div><div class="formula grad">a = f(z)</div><p class="explain">激活函数 <strong>f</strong> 引入非线性，决定汇总值如何变成可传给下一层的信号。</p></article>
<div class="connector nonlinear" aria-hidden="true"><span>输出 a</span></div>
<article class="step output min0"><div class="step-head"><h2>把结果传给下一层</h2></div><div class="output-value">a</div><p class="output-label">单个标量输出</p><p class="explain">下一层把这个 <strong>a</strong> 当作自己的一个输入，继续执行同样的两步计算。</p></article>
</div></main></section>
</div>
<script src="assets/base.js"></script>
<script>Deck.init({index:4,total:25});</script>
</body>
</html>
