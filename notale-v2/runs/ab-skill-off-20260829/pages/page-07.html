<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>激活函数把加权和变成输出</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
.workbench{gap:18px 32px;grid-template-columns:minmax(0,1.68fr) minmax(390px,.72fr)}
.workbench>header{max-width:1260px}.lead{max-width:1080px;color:var(--muted)}
.experiment{display:flex;flex-direction:column;gap:12px}.plot-panel{flex:1;min-height:0;padding:16px 18px 14px;display:flex;flex-direction:column;gap:10px}
.plot-top{display:flex;align-items:center;justify-content:space-between;gap:24px}.formula{font-family:var(--font-num);font-size:var(--fs-body);font-weight:600;color:var(--model)}.legend{justify-content:flex-end}
.plot-wrap{flex:1;min-height:0;position:relative}#plot{width:100%;height:100%;display:block}.axis{stroke:var(--rule);stroke-width:2}.tick{stroke:var(--rule);stroke-width:1.5}.curve{fill:none;stroke:var(--model);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:var(--attention);stroke-width:2.5;stroke-dasharray:8 7}.marker{fill:var(--attention);stroke:var(--text);stroke-width:3}.axis-label,.tick-label,.callout{font-family:var(--font-sans);fill:var(--muted);font-size:15px}.tick-label{font-family:var(--font-num);font-size:13px}.callout{fill:var(--text);font-weight:600}
.flow-strip{display:grid;grid-template-columns:1fr 44px 1fr 44px 1fr;align-items:center;gap:4px}.flow-node{padding:10px 12px;border-top:2px solid var(--rule);display:grid;gap:2px}.flow-node strong{font-size:var(--fs-label)}.flow-node output{font-family:var(--font-num);font-size:var(--fs-body);font-weight:600}.flow-node.in output{color:var(--observed)}.flow-node.mid output{color:var(--attention)}.flow-node.out output{color:var(--model)}.flow-arrow{height:2px;background:var(--rule);position:relative}.flow-arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:9px solid var(--rule);border-top:6px solid transparent;border-bottom:6px solid transparent}
.controls{display:flex;flex-direction:column;gap:14px}.control-panel{display:flex;flex-direction:column;gap:16px;padding:18px}.control-panel h2{font-size:var(--fs-h2)}.fn-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fn-tabs .btn{padding-left:8px;padding-right:8px}.readout{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);padding:15px 0}.readout-label{font-size:var(--fs-label);font-weight:650;color:var(--muted)}.equation{font-family:var(--font-num);font-size:var(--fs-sec);line-height:1.55;color:var(--text);min-height:54px}.out-box{padding-top:2px;display:grid;gap:6px}.out-box .big{color:var(--model)}.status{min-height:68px;padding:12px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);font-size:var(--fs-label);line-height:1.45}.status strong{color:var(--model)}
</style>
</head>
<body data-page="07" data-total="25">
<div id="stage">
<section class="workbench">
<header><div class="kicker">激活函数 · 从得分到输出</div><h1>激活函数决定神经元怎样响应加权和</h1><p class="lead">移动加权和 <span class="num">z</span>，比较连续得分经过 Sigmoid、tanh 与 ReLU 后，是被压进固定区间，还是把负值直接截断。</p></header>
<div class="experiment min0"><div class="panel plot-panel">
<div class="plot-top"><div class="formula" id="formula">a = σ(z)</div><div class="legend" aria-label="图例"><span class="li" style="color:var(--model)"><span class="sw line"></span>激活函数</span><span class="li" style="color:var(--attention)"><span class="sw"></span>当前输入与输出</span></div></div>
<div class="plot-wrap min0"><svg id="plot" viewBox="0 0 920 430" role="img" aria-labelledby="plotTitle plotDesc" preserveAspectRatio="none"><title id="plotTitle">激活函数输入输出图</title><desc id="plotDesc">横轴是加权和 z，纵轴是神经元输出 a。移动滑块会更新曲线上的标记。</desc><g id="axes"></g><path id="curve" class="curve"></path><line id="vGuide" class="guide"></line><line id="hGuide" class="guide"></line><circle id="marker" class="marker" r="9"></circle><text id="pointLabel" class="callout"></text></svg></div>
<div class="flow-strip" aria-label="一次前向计算"><div class="flow-node in"><strong>输入与权重汇总</strong><output id="flowInput">z = 2.40</output></div><span class="flow-arrow" aria-hidden="true"></span><div class="flow-node mid"><strong id="flowFnName">应用 Sigmoid</strong><output id="flowRule">σ(z)</output></div><span class="flow-arrow" aria-hidden="true"></span><div class="flow-node out"><strong>神经元输出</strong><output id="flowOutput">a = 0.917</output></div></div>
</div></div>
<aside class="controls min0" aria-label="激活函数控制台"><div class="panel control-panel"><h2>选择响应方式</h2><div class="fn-tabs" role="group" aria-label="选择激活函数"><button class="btn" type="button" data-fn="sigmoid" aria-pressed="true">Sigmoid</button><button class="btn" type="button" data-fn="tanh" aria-pressed="false">tanh</button><button class="btn" type="button" data-fn="relu" aria-pressed="false">ReLU</button></div><label class="ctl" for="zRange"><span>移动加权和 <span class="num">z</span></span><input id="zRange" type="range" min="-6" max="6" step="0.1" value="2.4"></label><div class="readout"><span class="readout-label">当前加权和</span><output id="zRead" class="big sm" for="zRange">2.40</output></div><div class="equation" id="equation">a = 1 / (1 + e<sup>−2.40</sup>)</div><div class="out-box"><span class="unit">神经元输出 a</span><output id="aRead" class="big lg">0.917</output></div><p class="status" id="status"><strong>压缩：</strong>即使 z 继续增大，输出也只会趋近 1，不会超过 1。</p><p class="hint">拖动滑块，再切换函数比较同一个 z</p></div></aside>
</section>
</div>
<script src="assets/base.js"></script>
<script>
Deck.init({index:7,total:25});
(()=>{const axes=document.getElementById('axes'),curve=document.getElementById('curve'),marker=document.getElementById('marker'),vg=document.getElementById('vGuide'),hg=document.getElementById('hGuide'),pointLabel=document.getElementById('pointLabel'),range=document.getElementById('zRange'),zRead=document.getElementById('zRead'),aRead=document.getElementById('aRead'),equation=document.getElementById('equation'),formula=document.getElementById('formula'),status=document.getElementById('status'),flowInput=document.getElementById('flowInput'),flowFnName=document.getElementById('flowFnName'),flowRule=document.getElementById('flowRule'),flowOutput=document.getElementById('flowOutput'),buttons=[...document.querySelectorAll('[data-fn]')],NS='http://www.w3.org/2000/svg',L=76,R=886,T=30,B=374;let fn='sigmoid';
const defs={sigmoid:{name:'Sigmoid',short:'σ(z)',f:z=>1/(1+Math.exp(-z)),y:[-.1,1.1],ticks:[0,.5,1],formula:'a = σ(z)'},tanh:{name:'tanh',short:'tanh(z)',f:z=>Math.tanh(z),y:[-1.2,1.2],ticks:[-1,0,1],formula:'a = tanh(z)'},relu:{name:'ReLU',short:'max(0, z)',f:z=>Math.max(0,z),y:[-1,6.5],ticks:[0,2,4,6],formula:'a = max(0, z)'}};
const xPos=z=>L+(z+6)/12*(R-L),yPos=(v,d)=>B-(v-d.y[0])/(d.y[1]-d.y[0])*(B-T);function el(name,attrs,text){const n=document.createElementNS(NS,name);Object.entries(attrs||{}).forEach(([k,v])=>n.setAttribute(k,v));if(text!==undefined)n.textContent=text;return n}
function drawAxes(d){axes.innerHTML='';const y0=yPos(0,d);axes.append(el('line',{x1:L,y1:y0,x2:R,y2:y0,class:'axis'}),el('line',{x1:xPos(0),y1:T,x2:xPos(0),y2:B,class:'axis'}));[-6,-4,-2,0,2,4,6].forEach(v=>{const x=xPos(v);axes.append(el('line',{x1:x,y1:y0-5,x2:x,y2:y0+5,class:'tick'}),el('text',{x,y:Math.min(B+23,y0+23),'text-anchor':'middle',class:'tick-label'},String(v)))});d.ticks.forEach(v=>{const y=yPos(v,d);axes.append(el('line',{x1:xPos(0)-5,y1:y,x2:xPos(0)+5,y2:y,class:'tick'}),el('text',{x:xPos(0)-12,y:y+5,'text-anchor':'end',class:'tick-label'},String(v)))});axes.append(el('text',{x:R,y:Math.min(B+45,y0+45),'text-anchor':'end',class:'axis-label'},'加权和 z'),el('text',{x:xPos(0)+12,y:T+4,class:'axis-label'},'输出 a'));let path='';for(let i=0;i<=240;i++){const z=-6+i/20;path+=(i?'L':'M')+xPos(z).toFixed(2)+','+yPos(d.f(z),d).toFixed(2)}curve.setAttribute('d',path)}
function explain(z){if(fn==='sigmoid')return z>=0?'<strong>压缩：</strong>即使 z 继续增大，输出也只会趋近 1，不会超过 1。':'<strong>压缩：</strong>负的 z 被映射到 0 与 0.5 之间，输出仍保持连续。';if(fn==='tanh')return Math.abs(z)<.6?'<strong>过零点：</strong>z 接近 0 时，输出也接近 0，并保留正负方向。':'<strong>压缩：</strong>输出被限制在 −1 到 1 之间，并保留 z 的正负方向。';return z<=0?'<strong>截断：</strong>z 不大于 0，ReLU 把输出直接置为 0。':'<strong>保留：</strong>z 大于 0，ReLU 原样输出，正值不被压缩。'}
function update(){const d=defs[fn],z=Number(range.value),a=d.f(z),x=xPos(z),y=yPos(a,d),y0=yPos(0,d),x0=xPos(0);marker.setAttribute('cx',x);marker.setAttribute('cy',y);vg.setAttribute('x1',x);vg.setAttribute('x2',x);vg.setAttribute('y1',y0);vg.setAttribute('y2',y);hg.setAttribute('x1',x0);hg.setAttribute('x2',x);hg.setAttribute('y1',y);hg.setAttribute('y2',y);pointLabel.setAttribute('x',Math.min(x+14,R-120));pointLabel.setAttribute('y',Math.max(T+18,y-14));pointLabel.textContent=`(${z.toFixed(1)}, ${a.toFixed(3)})`;zRead.textContent=z.toFixed(2);aRead.textContent=a.toFixed(3);flowInput.textContent=`z = ${z.toFixed(2)}`;flowFnName.textContent=`应用 ${d.name}`;flowRule.textContent=d.short;flowOutput.textContent=`a = ${a.toFixed(3)}`;formula.textContent=d.formula;if(fn==='sigmoid')equation.innerHTML=`a = 1 / (1 + e<sup>${(-z).toFixed(2)}</sup>)`;else if(fn==='tanh')equation.textContent=`a = tanh(${z.toFixed(2)})`;else equation.textContent=`a = max(0, ${z.toFixed(2)})`;status.innerHTML=explain(z)}
function choose(next){fn=next;buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.fn===fn)));drawAxes(defs[fn]);update()}range.addEventListener('input',update);buttons.forEach(b=>b.addEventListener('click',()=>choose(b.dataset.fn)));drawAxes(defs[fn]);update()})();
</script>
</body>
</html>
