<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage { padding: 28px 56px; }
  .chapter-page {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, .82fr) minmax(0, 1.18fr);
    gap: 54px;
    align-items: stretch;
    position: relative;
    z-index: 1;
  }
  .intro {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 42px 0 36px;
  }
  .chapter-no {
    color: var(--model);
    font-family: var(--font-num);
    font-size: var(--fs-label);
    line-height: 1.35;
    letter-spacing: .1em;
    font-weight: 600;
  }
  h1 {
    max-width: 680px;
    margin-top: 18px;
    font-size: var(--fs-h1);
    line-height: 1.14;
    letter-spacing: -.035em;
  }
  .lead {
    max-width: 650px;
    margin-top: 28px;
    color: var(--muted);
    font-size: var(--fs-lead);
    line-height: 1.6;
  }
  .chapter-index {
    margin-top: auto;
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding-top: 34px;
    border-top: 2px solid var(--text);
  }
  .chapter-index strong {
    color: var(--model);
    font-family: var(--font-num);
    line-height: .9;
    letter-spacing: -.06em;
  }
  .chapter-index span {
    color: var(--muted);
    font-size: var(--fs-label);
    line-height: 1.45;
    font-weight: 600;
    letter-spacing: .06em;
  }
  .visual {
    min-width: 0;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 0;
  }
  .map {
    width: 100%;
    height: 704px;
    max-height: 100%;
    position: relative;
    overflow: hidden;
    border: 2px solid var(--rule);
    border-radius: 10px;
    background: var(--surface);
    box-shadow: 0 9px 24px rgba(23,33,43,.09);
  }
  .map::before {
    content: "误差如何成为学习信号";
    position: absolute;
    top: 24px;
    left: 28px;
    z-index: 2;
    color: var(--text);
    font-family: var(--font-display);
    font-size: var(--fs-h2);
    line-height: 1.25;
    font-weight: 650;
  }
  .map svg { width: 100%; height: 100%; display: block; }
  .map .small-label {
    font-family: var(--font-sans);
    font-size: var(--fs-sec);
    font-weight: 600;
    fill: var(--muted);
  }
  .map .node-label {
    font-family: var(--font-sans);
    font-size: var(--fs-body);
    font-weight: 650;
    fill: var(--text);
  }
  .map .symbol {
    font-family: var(--font-num);
    font-size: var(--fs-h1);
    font-weight: 600;
  }
  .map .loss-symbol {
    font-family: var(--font-num);
    font-size: var(--fs-h1);
    font-weight: 600;
    fill: var(--gradient);
  }
  .map .explain {
    font-family: var(--font-sans);
    font-size: var(--fs-sec);
    font-weight: 500;
    fill: var(--muted);
  }
  .map .flow {
    fill: none;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .map .guide {
    fill: none;
    stroke: var(--rule-soft);
    stroke-width: 2;
  }
  .map .node {
    fill: var(--surface);
    stroke-width: 3;
  }
  .map .loss-box {
    fill: var(--gradient-soft);
    stroke: var(--gradient);
    stroke-width: 3;
  }
  .map .opt-line {
    stroke-dasharray: 10 9;
  }
  @media (prefers-reduced-motion: no-preference) {
    .map .flow {
      stroke-dasharray: 500;
      stroke-dashoffset: 500;
      animation: draw-line 900ms ease-out forwards;
    }
    .map .flow.delay { animation-delay: 240ms; }
    .map .loss-box, .map .loss-copy {
      opacity: 0;
      animation: reveal 380ms ease-out 700ms forwards;
    }
    @keyframes draw-line { to { stroke-dashoffset: 0; } }
    @keyframes reveal { to { opacity: 1; } }
  }
</style>
</head>
<body data-page="08" data-total="25">
<div id="stage">
  <main class="chapter-page">
    <section class="intro min0" aria-labelledby="page-title">
      <div class="chapter-no">第二章 · 损失函数</div>
      <h1 id="page-title">模型怎么知道自己错了？</h1>
      <p class="lead">目标值、预测值与损失函数，把“差得多远”变成一个可以优化的量。</p>
      <div class="chapter-index" aria-label="第二章">
        <strong class="big lg">02</strong>
        <span>从误差<br>到学习信号</span>
      </div>
    </section>

    <section class="visual min0" aria-label="目标值、预测值与损失函数的关系图">
      <div class="map">
        <svg viewBox="0 0 820 700" role="img" aria-labelledby="diagram-title diagram-desc">
          <title id="diagram-title">误差转化为学习信号</title>
          <desc id="diagram-desc">目标值与预测值共同进入损失函数，损失函数输出一个标量，优化过程据此调整模型。</desc>
          <defs>
            <marker id="arrow-model" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L10,5.5 L0,11 Z" fill="#1F5FAE"/>
            </marker>
            <marker id="arrow-observed" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L10,5.5 L0,11 Z" fill="#24705A"/>
            </marker>
            <marker id="arrow-gradient" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L10,5.5 L0,11 Z" fill="#C94F20"/>
            </marker>
          </defs>

          <path class="guide" d="M70 104 H750"/>
          <text x="70" y="142" class="small-label">两个数进入同一个比较规则</text>

          <rect class="node" x="74" y="184" width="250" height="132" rx="10" stroke="#24705A"/>
          <text x="102" y="224" class="small-label" fill="#24705A">外部给定</text>
          <text x="102" y="275" class="node-label">目标值</text>
          <text x="244" y="275" class="symbol" fill="#24705A">y</text>

          <rect class="node" x="74" y="368" width="250" height="132" rx="10" stroke="#1F5FAE"/>
          <text x="102" y="408" class="small-label" fill="#1F5FAE">模型计算</text>
          <text x="102" y="459" class="node-label">预测值</text>
          <text x="232" y="459" class="symbol" fill="#1F5FAE">ŷ</text>

          <path class="flow" d="M324 250 C390 250 392 304 450 318" stroke="#24705A" marker-end="url(#arrow-observed)"/>
          <path class="flow" d="M324 434 C390 434 392 380 450 366" stroke="#1F5FAE" marker-end="url(#arrow-model)"/>

          <rect class="loss-box" x="462" y="256" width="286" height="176" rx="10"/>
          <g class="loss-copy">
            <text x="496" y="297" class="small-label" fill="#C94F20">比较并压成一个标量</text>
            <text x="496" y="357" class="loss-symbol">L(y, ŷ)</text>
            <text x="496" y="397" class="explain">损失越大，当前预测偏得越远</text>
          </g>

          <path class="flow delay opt-line" d="M606 432 V552" stroke="#C94F20" marker-end="url(#arrow-gradient)"/>
          <text x="630" y="505" class="small-label" fill="#C94F20">优化方向</text>

          <path d="M470 616 C510 586 548 603 580 574 C614 542 650 555 694 512" fill="none" stroke="#C94F20" stroke-width="4" stroke-linecap="round"/>
          <circle cx="694" cy="512" r="8" fill="#E3A51A" stroke="#17212B" stroke-width="2"/>
          <text x="470" y="659" class="node-label">调整模型，让损失减小</text>
        </svg>
      </div>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script>Deck.init({ index: 8, total: 25 });</script>
</body>
</html>
