<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>预测、目标与损失</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .compare > header { max-width: 1260px; }
    .lead { color: var(--muted); }
    .comparison { grid-column:1/-1; min-width:0; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 190px minmax(0,1fr); grid-template-rows:minmax(0,1fr) auto; align-items:stretch; gap:18px 26px; }
    .datum { min-width:0; min-height:0; display:flex; flex-direction:column; justify-content:center; padding:34px 42px; border:2px solid var(--rule); border-radius:10px; background:var(--surface); box-shadow:0 7px 18px rgba(23,33,43,.08); }
    .datum.prediction { border-color:var(--model); }
    .datum.target { border-color:var(--observed); }
    .datum-label { margin-bottom:24px; font-family:var(--font-num); font-size:var(--fs-label); line-height:1.35; letter-spacing:.08em; font-weight:600; }
    .prediction .datum-label, .prediction .symbol { color:var(--model); }
    .target .datum-label, .target .symbol { color:var(--observed); }
    .symbol { font-family:var(--font-num); font-size:78px; line-height:1; font-weight:600; letter-spacing:-.04em; }
    .datum h2 { margin-top:22px; }
    .datum p { margin-top:12px; max-width:480px; color:var(--muted); }
    .measure { min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; color:var(--gradient); text-align:center; }
    .measure svg { width:168px; height:112px; overflow:visible; }
    .loss-symbol { font-family:var(--font-num); font-size:34px; line-height:1.15; font-weight:600; color:var(--gradient); }
    .measure p { font-size:var(--fs-label); line-height:1.4; color:var(--muted); }
    .conclusion { grid-column:1/-1; display:grid; grid-template-columns:auto 1fr; align-items:center; gap:24px; padding:20px 26px; border:2px solid var(--gradient); border-radius:10px; background:var(--gradient-soft); }
    .conclusion strong { color:var(--gradient); font-family:var(--font-display); font-size:var(--fs-h2); line-height:1.25; white-space:nowrap; }
    .conclusion p { font-size:var(--fs-lead); line-height:1.45; }
  </style>
</head>
<body data-page="09" data-total="25">
  <div id="stage">
    <section class="compare">
      <header>
        <div class="kicker">学习信号 · 三个角色</div>
        <h1>损失衡量预测与目标之间的差距</h1>
        <p class="lead">预测是模型当前给出的答案，目标是数据提供的参照；损失只负责比较两者。</p>
      </header>
      <main class="comparison min0" aria-label="预测、目标与损失的关系图">
        <article class="datum prediction min0">
          <div class="datum-label">PREDICTION</div>
          <div class="symbol" aria-label="y hat">ŷ</div>
          <h2>预测：模型算出的当前答案</h2>
          <p>输入经过权重和激活函数后，前向计算得到 ŷ。训练会改变这个结果。</p>
        </article>
        <div class="measure" aria-label="损失函数比较预测与目标">
          <svg viewBox="0 0 168 112" role="img" aria-label="两端输入损失函数进行比较">
            <path d="M3 28 H45 C62 28 62 56 78 56" fill="none" stroke="var(--model)" stroke-width="4" stroke-linecap="round"/>
            <path d="M165 84 H123 C106 84 106 56 90 56" fill="none" stroke="var(--observed)" stroke-width="4" stroke-linecap="round"/>
            <circle cx="84" cy="56" r="11" fill="var(--surface)" stroke="var(--gradient)" stroke-width="4"/>
            <path d="M79 56 H89 M84 51 V61" stroke="var(--gradient)" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <div class="loss-symbol">L(ŷ, y)</div>
          <p>损失函数读取两者<br>并输出差距的度量</p>
        </div>
        <article class="datum target min0">
          <div class="datum-label">TARGET</div>
          <div class="symbol">y</div>
          <h2>目标：数据给出的参照答案</h2>
          <p>标签或期望输出提供 y。它来自训练数据，不是模型再次计算出的预测。</p>
        </article>
        <div class="conclusion">
          <strong>损失不是第三个答案</strong>
          <p>它是一把标尺：差距越大，当前预测与目标越不一致；训练据此调整权重。</p>
        </div>
      </main>
    </section>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({ index:9, total:25 });</script>
</body>
</html>
