<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>误差方向不同，平方损失相同</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .workbench{gap:20px 30px;grid-template-columns:minmax(0,1.72fr) minmax(360px,.68fr)}
    .workbench>header{max-width:1240px}
    .lead{color:var(--muted)}
    .experiment{display:flex;flex-direction:column;gap:12px}
    .plot-panel{flex:1;min-height:0;padding:16px 18px 14px;display:flex;flex-direction:column}
    .plot-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:8px}
    .plot-copy{display:grid;gap:4px}
    .formula{font-family:var(--font-num);font-size:var(--fs-lead);color:var(--gradient);font-weight:600;white-space:nowrap}
    .chart-wrap{position:relative;flex:1;min-height:0}
    #lossPlot{width:100%;height:100%;display:block;touch-action:none;cursor:ew-resize}
    .drag-hint{position:absolute;right:8px;top:6px;padding:5px 9px;background:rgba(255,255,255,.92);color:var(--muted);font-size:var(--fs-label);border:1px solid var(--rule-soft);border-radius:6px;pointer-events:none}
    .controls{display:flex;flex-direction:column;gap:14px}
    .control-panel{display:flex;flex-direction:column;gap:18px;min-height:0}
    .target-row{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--rule-soft)}
    .target-row strong{font-size:var(--fs-sec)}
    .target-value{color:var(--observed);font-family:var(--font-num);font-size:30px;font-weight:600}
    .readout{display:grid;grid-template-columns:1fr auto;align-items:end;gap:4px 14px}
    .readout .label{font-size:var(--fs-label);color:var(--muted)}
    .readout .big{grid-row:1/3;grid-column:2}
    .readout .detail{font-family:var(--font-num);font-size:var(--fs-sec);color:var(--model)}
    .mirror{display:grid;gap:8px;padding-top:14px;border-top:1px solid var(--rule-soft)}
    .mirror-line{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;font-size:var(--fs-sec)}
    .mirror-line output{font-family:var(--font-num);font-weight:600}
    .equation{padding:12px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);font-family:var(--font-num);font-size:var(--fs-label);line-height:1.5}
    .same{color:var(--observed);font-weight:700}
    .status{min-height:48px;padding:11px 13px;border:2px solid var(--observed);border-radius:8px;background:var(--observed-soft);font-size:var(--fs-label);line-height:1.45}
    .status strong{color:var(--observed)}
    .btn{width:100%}
    @media (prefers-reduced-motion:no-preference){#point,#mirrorPoint{transition:cx .12s ease-out,cy .12s ease-out}.guide{transition:x1 .12s ease-out,x2 .12s ease-out,y1 .12s ease-out,y2 .12s ease-out}}
  </style>
</head>
<body data-page="10" data-total="25">
  <div id="stage">
    <section class="workbench">
      <header>
        <div class="kicker">平方损失 · 拖动实验</div>
        <h1>偏高或偏低，只要误差一样大，惩罚就一样</h1>
        <p class="lead">目标值固定为 <span class="num" style="color:var(--observed)">0.60</span>。拖动预测点，比较曲线另一侧的对称预测。</p>
      </header>

      <div class="experiment min0">
        <div class="panel plot-panel">
          <div class="plot-head">
            <div class="plot-copy">
              <h2>预测值与损失</h2>
              <p class="small">曲线最低点位于目标值；离开目标值的水平距离决定损失。</p>
            </div>
            <div class="formula" aria-label="损失等于预测值减目标值的平方">L = (ŷ − y)²</div>
          </div>
          <div class="chart-wrap min0">
            <svg id="lossPlot" viewBox="0 0 900 520" role="img" aria-labelledby="plotTitle plotDesc">
              <title id="plotTitle">平方损失曲线</title>
              <desc id="plotDesc">目标值为零点六。可拖动当前预测点，并显示曲线另一侧误差大小相同的预测点。</desc>
              <g id="grid"></g>
              <g id="curveLayer"></g>
              <g id="dynamicLayer">
                <line id="targetLine" x1="0" y1="54" x2="0" y2="452" stroke="var(--observed)" stroke-width="3" stroke-dasharray="8 7"/>
                <text id="targetLabel" y="42" fill="var(--observed)" font-size="17" font-weight="700" text-anchor="middle">目标 y = 0.60</text>
                <line id="guideA" class="guide" stroke="var(--attention)" stroke-width="2" stroke-dasharray="5 5"/>
                <line id="guideB" class="guide" stroke="var(--model)" stroke-width="2" stroke-dasharray="5 5" opacity=".7"/>
                <circle id="mirrorPoint" r="10" fill="var(--surface)" stroke="var(--model)" stroke-width="4"/>
                <circle id="point" r="13" fill="var(--attention)" stroke="var(--text)" stroke-width="3"/>
                <text id="pointText" font-size="17" font-weight="700" fill="var(--text)" text-anchor="middle">当前预测</text>
                <text id="mirrorText" font-size="16" font-weight="700" fill="var(--model)" text-anchor="middle">对称预测</text>
              </g>
            </svg>
            <div class="drag-hint">拖动黄色预测点</div>
          </div>
        </div>
      </div>

      <aside class="controls min0">
        <div class="panel control-panel">
          <div class="target-row"><strong>固定目标值 y</strong><span class="target-value">0.60</span></div>

          <div class="readout">
            <span class="label">当前预测 ŷ</span>
            <span id="deltaText" class="detail">误差 −0.30</span>
            <output id="predBig" class="big sm" for="pred">0.30</output>
          </div>

          <label class="ctl" for="pred">
            <span>拖动预测值，观察损失变化</span>
            <input id="pred" type="range" min="0.20" max="1.00" step="0.01" value="0.30">
          </label>

          <div class="mirror">
            <div class="mirror-line"><span>当前损失</span><output id="lossNow">0.0900</output></div>
            <div class="mirror-line"><span>对称预测 <span id="mirrorPred">0.90</span> 的损失</span><output id="lossMirror">0.0900</output></div>
            <div id="equation" class="equation">(0.30 − 0.60)² = (0.90 − 0.60)²</div>
          </div>

          <div id="status" class="status" role="status" aria-live="polite"><strong>损失相同。</strong> 两个预测的方向相反，误差大小都是 0.30。</div>
          <button id="swap" class="btn" type="button">切换到曲线另一侧的预测</button>
          <p class="hint">也可以直接拖动图中的黄色点</p>
        </div>
      </aside>
    </section>
  </div>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({index:10,total:25});
    const target=0.60;
    const slider=document.getElementById('pred');
    const svg=document.getElementById('lossPlot');
    const NS='http://www.w3.org/2000/svg';
    const box={l:72,r:862,t:54,b:452};
    const xMin=0.20,xMax=1.00,yMax=0.18;
    const sx=v=>box.l+(v-xMin)/(xMax-xMin)*(box.r-box.l);
    const sy=v=>box.b-v/yMax*(box.b-box.t);
    const loss=v=>(v-target)*(v-target);
    const make=(name,attrs,parent)=>{const el=document.createElementNS(NS,name);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));parent.appendChild(el);return el};
    const grid=document.getElementById('grid');
    [0,.04,.08,.12,.16].forEach(v=>{
      make('line',{x1:box.l,y1:sy(v),x2:box.r,y2:sy(v),stroke:'var(--rule-soft)','stroke-width':1},grid);
      const t=make('text',{x:box.l-14,y:sy(v)+5,'text-anchor':'end',fill:'var(--muted)','font-size':14},grid);t.textContent=v.toFixed(2);
    });
    [.2,.4,.6,.8,1].forEach(v=>{
      make('line',{x1:sx(v),y1:box.t,x2:sx(v),y2:box.b,stroke:'var(--rule-soft)','stroke-width':1},grid);
      const t=make('text',{x:sx(v),y:box.b+30,'text-anchor':'middle',fill:'var(--muted)','font-size':14},grid);t.textContent=v.toFixed(2);
    });
    make('line',{x1:box.l,y1:box.b,x2:box.r,y2:box.b,stroke:'var(--text)','stroke-width':2},grid);
    make('line',{x1:box.l,y1:box.t,x2:box.l,y2:box.b,stroke:'var(--text)','stroke-width':2},grid);
    let d='';for(let i=0;i<=160;i++){const v=xMin+(xMax-xMin)*i/160;d+=(i?'L':'M')+sx(v)+' '+sy(loss(v))+' '}
    make('path',{d,fill:'none',stroke:'var(--gradient)','stroke-width':5,'stroke-linecap':'round'},document.getElementById('curveLayer'));
    const xl=make('text',{x:(box.l+box.r)/2,y:510,'text-anchor':'middle',fill:'var(--text)','font-size':17,'font-weight':700},grid);xl.textContent='预测值 ŷ';
    const yl=make('text',{x:20,y:(box.t+box.b)/2,transform:'rotate(-90 20 '+((box.t+box.b)/2)+')','text-anchor':'middle',fill:'var(--text)','font-size':17,'font-weight':700},grid);yl.textContent='损失 L';
    document.getElementById('targetLine').setAttribute('x1',sx(target));
    document.getElementById('targetLine').setAttribute('x2',sx(target));
    document.getElementById('targetLabel').setAttribute('x',sx(target));

    function update(v){
      v=Math.max(xMin,Math.min(xMax,Math.round(v*100)/100));
      slider.value=v.toFixed(2);
      const mirror=2*target-v;
      const lv=loss(v);
      const delta=v-target;
      document.getElementById('predBig').textContent=v.toFixed(2);
      document.getElementById('deltaText').textContent='误差 '+(delta>=0?'+':'−')+Math.abs(delta).toFixed(2);
      document.getElementById('lossNow').textContent=lv.toFixed(4);
      document.getElementById('mirrorPred').textContent=mirror.toFixed(2);
      document.getElementById('lossMirror').textContent=loss(mirror).toFixed(4);
      document.getElementById('equation').textContent='('+v.toFixed(2)+' − 0.60)² = ('+mirror.toFixed(2)+' − 0.60)²';
      const amount=Math.abs(delta).toFixed(2);
      document.getElementById('status').innerHTML=amount==='0.00'?'<strong>损失为 0。</strong> 预测正好等于目标值。':'<strong>损失相同。</strong> 两个预测的方向相反，误差大小都是 '+amount+'。';
      const px=sx(v),py=sy(lv),mx=sx(mirror),my=sy(loss(mirror));
      const point=document.getElementById('point'),mp=document.getElementById('mirrorPoint');
      point.setAttribute('cx',px);point.setAttribute('cy',py);mp.setAttribute('cx',mx);mp.setAttribute('cy',my);
      const ga=document.getElementById('guideA'),gb=document.getElementById('guideB');
      [['x1',px],['x2',px],['y1',py],['y2',box.b]].forEach(([a,n])=>ga.setAttribute(a,n));
      [['x1',mx],['x2',mx],['y1',my],['y2',box.b]].forEach(([a,n])=>gb.setAttribute(a,n));
      const pt=document.getElementById('pointText'),mt=document.getElementById('mirrorText');
      pt.setAttribute('x',px);pt.setAttribute('y',Math.max(box.t+18,py-22));
      mt.setAttribute('x',mx);mt.setAttribute('y',Math.max(box.t+18,my-22));
      if(Math.abs(delta)<.015){mp.style.opacity='0';mt.style.opacity='0';gb.style.opacity='0'}else{mp.style.opacity='1';mt.style.opacity='1';gb.style.opacity='.7'}
    }
    slider.addEventListener('input',()=>update(Number(slider.value)));
    document.getElementById('swap').addEventListener('click',()=>update(2*target-Number(slider.value)));
    let dragging=false;
    function fromPointer(e){const p=Deck.pt(svg,e);update(xMin+(p.x-box.l)/(box.r-box.l)*(xMax-xMin))}
    svg.addEventListener('pointerdown',e=>{dragging=true;svg.setPointerCapture(e.pointerId);fromPointer(e)});
    svg.addEventListener('pointermove',e=>{if(dragging)fromPointer(e)});
    svg.addEventListener('pointerup',e=>{dragging=false;svg.releasePointerCapture(e.pointerId)});
    svg.addEventListener('pointercancel',()=>dragging=false);
    update(Number(slider.value));
  </script>
</body>
</html>
