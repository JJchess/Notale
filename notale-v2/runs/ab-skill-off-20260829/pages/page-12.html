<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .chapter {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr);
      align-items: stretch;
      gap: 68px;
      position: relative;
      z-index: 1;
    }
    .copy {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 34px 0 30px;
    }
    .copy .kicker { margin-bottom: 24px; }
    .copy h1 {
      max-width: 680px;
      font-size: 78px;
      line-height: 1.08;
      letter-spacing: -.045em;
    }
    .copy h1 .accent { color: var(--gradient); }
    .chapter-rule {
      width: 116px;
      height: 4px;
      margin: 30px 0 24px;
      background: var(--gradient);
    }
    .lead {
      max-width: 660px;
      color: var(--text);
      line-height: 1.58;
    }
    .route {
      margin-top: 34px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--muted);
      font-size: var(--fs-label);
      font-weight: 600;
    }
    .route .term { white-space: nowrap; }
    .route .link {
      width: 42px;
      height: 1px;
      position: relative;
      background: var(--rule);
    }
    .route .link::after {
      content: "";
      position: absolute;
      right: -1px;
      top: -4px;
      width: 7px;
      height: 7px;
      border-top: 2px solid var(--rule);
      border-right: 2px solid var(--rule);
      transform: rotate(45deg);
    }
    .figure {
      min-width: 0;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .figure::before {
      content: "";
      position: absolute;
      inset: 46px 0 46px 4px;
      border: 2px solid var(--rule);
      border-radius: 10px;
      background: rgba(255,255,255,.84);
      box-shadow: 0 10px 26px rgba(23,33,43,.08);
    }
    .figure svg {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .axis { stroke: var(--rule); stroke-width: 2; }
    .curve { fill: none; stroke: var(--gradient); stroke-width: 8; stroke-linecap: round; }
    .tangent { stroke: var(--gradient); stroke-width: 4; stroke-dasharray: 11 9; }
    .update { fill: none; stroke: var(--model); stroke-width: 5; stroke-linecap: round; }
    .point { fill: var(--attention); stroke: var(--text); stroke-width: 3; }
    .target { fill: var(--surface); stroke: var(--observed); stroke-width: 4; }
    .svg-title { font: 600 25px var(--font-sans); fill: var(--text); }
    .svg-label { font: 600 17px var(--font-sans); fill: var(--muted); }
    .svg-label.gradient { fill: var(--gradient); }
    .svg-label.model { fill: var(--model); }
    .svg-label.observed { fill: var(--observed); }
    .formula { font: 600 19px var(--font-num); fill: var(--text); }
    .corner-note {
      position: absolute;
      z-index: 2;
      right: 27px;
      bottom: 66px;
      color: var(--muted);
      font-size: var(--fs-label);
      line-height: 1.4;
    }
  </style>
</head>
<body data-page="12" data-total="25">
  <div id="stage">
    <main class="chapter">
      <section class="copy min0" aria-labelledby="chapter-title">
        <div class="kicker">第三章 · 参数更新</div>
        <h1 id="chapter-title">梯度怎样<br><span class="accent">指路</span></h1>
        <div class="chapter-rule" aria-hidden="true"></div>
        <p class="lead">本章回答局部斜率如何告诉参数该往哪边改，以及步子为何不能随便定。</p>
        <div class="route" aria-label="本章内容：测量局部斜率，判断更新方向，选择更新步长">
          <span class="term">局部斜率</span><span class="link" aria-hidden="true"></span>
          <span class="term">更新方向</span><span class="link" aria-hidden="true"></span>
          <span class="term">更新步长</span>
        </div>
      </section>

      <section class="figure min0" aria-label="损失曲线上的当前位置、局部斜率与参数更新方向示意图">
        <svg viewBox="0 0 760 780" role="img" aria-labelledby="fig-title fig-desc">
          <title id="fig-title">梯度在损失曲线上指示参数更新方向</title>
          <desc id="fig-desc">当前位置位于损失曲线右坡。局部切线向右上方倾斜，更新箭头朝左下方指向低损失区域。步长决定一次移动的距离。</desc>
          <defs>
            <marker id="arrow-model" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F5FAE"></path>
            </marker>
          </defs>
          <text x="76" y="105" class="svg-title">沿着损失曲线找低处</text>
          <line x1="92" y1="642" x2="684" y2="642" class="axis"></line>
          <line x1="92" y1="642" x2="92" y2="164" class="axis"></line>
          <text x="644" y="678" class="svg-label">参数</text>
          <text x="48" y="190" class="svg-label" transform="rotate(-90 48 190)">损失</text>
          <path d="M 132 226 C 230 310, 252 554, 370 584 C 468 608, 504 458, 626 240" class="curve"></path>
          <circle cx="548" cy="388" r="12" class="point"></circle>
          <text x="565" y="375" class="svg-label">当前位置</text>
          <line x1="448" y1="520" x2="648" y2="242" class="tangent"></line>
          <text x="545" y="218" class="svg-label gradient">局部斜率</text>
          <path d="M 531 409 C 505 447, 466 490, 414 533" class="update" marker-end="url(#arrow-model)"></path>
          <text x="451" y="474" class="svg-label model">参数更新</text>
          <circle cx="370" cy="584" r="15" class="target"></circle>
          <text x="307" y="620" class="svg-label observed">较低损失</text>
          <text x="122" y="720" class="formula">方向由斜率决定 · 距离由步长决定</text>
        </svg>
        <p class="corner-note">示意图：斜率只描述当前位置附近</p>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({ index: 12, total: 25 });</script>
</body>
</html>
