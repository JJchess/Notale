<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>梯度是局部信息</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{background-image:none}.diagram{gap:20px}.diagram>header{max-width:1330px}.lead{color:var(--muted)}
.lesson{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(390px,.78fr);gap:30px;min-height:0;align-items:stretch}
.graph-panel{display:flex;flex-direction:column;min-height:0;padding:18px 22px 16px}.graph-head{display:flex;justify-content:space-between;align-items:baseline;gap:24px;padding-bottom:10px;border-bottom:1px solid var(--rule-soft)}.graph-head p{color:var(--muted);font-size:var(--fs-label)}.plot{flex:1;min-height:0;position:relative}.plot svg{width:100%;height:100%;display:block}
.side{display:flex;flex-direction:column;gap:16px;min-height:0}.definition{padding:22px 24px}.definition h2{margin-bottom:15px}.fraction{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:13px;margin:10px 0 15px;color:var(--gradient);font-family:var(--font-num)}.frac{display:grid;justify-items:center;font-size:27px;line-height:1.15;font-weight:600}.frac span:first-child{padding:0 10px 6px;border-bottom:2px solid currentColor}.frac span:last-child{padding-top:6px}.approx{font-size:27px;color:var(--muted)}.grad-symbol{font-size:38px;font-weight:600}
.reading{display:grid;grid-template-columns:104px minmax(0,1fr);gap:0 16px;padding:17px 0;border-top:1px solid var(--rule-soft)}.reading:first-of-type{border-top:0}.reading .term{color:var(--gradient);font-weight:700;font-size:var(--fs-sec)}.reading p{font-size:var(--fs-sec);line-height:1.45}
.not-destination{flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 24px;border:2px dashed var(--rule);border-radius:10px}.not-destination h2{margin-bottom:12px}.not-destination p{font-size:var(--fs-sec)}.sequence{display:flex;align-items:center;gap:10px;margin-top:18px;color:var(--muted);font-size:var(--fs-label);font-weight:600}.sequence .node{flex:1;padding:9px 8px;text-align:center;border-bottom:3px solid var(--rule)}.sequence .node.active{color:var(--gradient);border-color:var(--gradient)}.sequence .arrow{color:var(--rule);font-family:var(--font-num)}
.axis{stroke:var(--rule);stroke-width:2}.curve{fill:none;stroke:var(--model);stroke-width:6;stroke-linecap:round}.tangent{stroke:var(--gradient);stroke-width:4;stroke-linecap:round}.guide{stroke:var(--rule);stroke-width:2;stroke-dasharray:7 7}.delta{stroke:var(--gradient);stroke-width:3;fill:none}.point{fill:var(--surface);stroke:var(--gradient);stroke-width:5}.ghost-point{fill:var(--surface);stroke:var(--gradient);stroke-width:3}.svg-label{font-family:var(--font-sans);font-size:18px;fill:var(--muted)}.svg-strong{font-family:var(--font-sans);font-size:20px;font-weight:700;fill:var(--text)}.svg-gradient{fill:var(--gradient)}.svg-model{fill:var(--model)}.axis-label{font-family:var(--font-sans);font-size:18px;font-weight:600;fill:var(--text)}
</style>
</head>
<body data-page="13" data-total="25">
<div id="stage">
<section class="diagram">
<header><div class="kicker">梯度 · 局部变化率</div><h1>梯度只描述脚下的坡，不直接标出谷底</h1><p class="lead">它回答：参数稍微改变时，损失变化得多快、朝哪个方向变化。</p></header>
<main class="lesson min0">
<section class="panel graph-panel min0" aria-labelledby="plot-title">
<div class="graph-head"><h2 id="plot-title">在当前参数附近量一次坡度</h2><p>蓝线：损失曲线　橙线：当前位置的切线</p></div>
<div class="plot min0"><svg viewBox="0 0 920 555" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">损失曲线当前位置的局部梯度</title><desc id="svg-desc">损失曲线在当前参数处有一条向右下方倾斜的切线。参数增加一小段，损失下降一小段，二者比值近似当前梯度。曲线谷底在更右侧，但切线本身没有直接给出谷底位置。</desc>
<defs><marker id="axisArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="none" stroke="#AAB4BE" stroke-width="1.8"/></marker><marker id="gradArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L9 5L0 10" fill="none" stroke="#C94F20" stroke-width="1.8"/></marker></defs>
<line class="axis" x1="88" y1="477" x2="866" y2="477" marker-end="url(#axisArrow)"/><line class="axis" x1="88" y1="477" x2="88" y2="56" marker-end="url(#axisArrow)"/><text class="axis-label" x="826" y="516">参数 θ</text><text class="axis-label" x="34" y="47">损失 L</text>
<path class="curve" d="M125 89C215 122 292 208 376 306C450 393 522 438 618 430C705 423 765 364 830 255"/><text class="svg-label svg-model" x="699" y="333">完整损失曲线</text>
<line class="tangent" x1="235" y1="178" x2="580" y2="477"/><text class="svg-label svg-gradient" x="206" y="151">当前位置的切线</text>
<line class="guide" x1="370" y1="300" x2="370" y2="477"/><circle class="point" cx="370" cy="300" r="10"/><text class="svg-strong" x="294" y="333">当前参数</text><text class="svg-label" x="350" y="509">θ</text>
<line class="guide" x1="495" y1="408" x2="495" y2="477"/><circle class="ghost-point" cx="495" cy="408" r="8"/><text class="svg-label" x="471" y="509">θ+Δθ</text>
<line class="delta" x1="376" y1="455" x2="489" y2="455" marker-start="url(#gradArrow)" marker-end="url(#gradArrow)"/><text class="svg-strong svg-gradient" x="411" y="444">Δθ</text>
<line class="delta" x1="516" y1="307" x2="516" y2="401" marker-start="url(#gradArrow)" marker-end="url(#gradArrow)"/><line class="guide" x1="380" y1="300" x2="526" y2="300"/><line class="guide" x1="503" y1="408" x2="526" y2="408"/><text class="svg-strong svg-gradient" x="530" y="360">ΔL</text>
<path d="M640 421C654 444 676 457 706 460" fill="none" stroke="#AAB4BE" stroke-width="2" marker-end="url(#axisArrow)"/><text class="svg-label" x="628" y="399">谷底在别处</text>
</svg></div></section>
<aside class="side min0" aria-label="梯度含义">
<section class="panel definition"><h2>梯度是一条局部读数</h2><div class="fraction" aria-label="损失变化量除以参数变化量，近似梯度"><div class="frac"><span>ΔL</span><span>Δθ</span></div><span class="approx">≈</span><span class="grad-symbol">∂L/∂θ</span></div><div class="reading"><div class="term">正负号</div><p>说明参数朝增大方向移动时，损失会上升还是下降。</p></div><div class="reading"><div class="term">绝对值</div><p>说明参数改动一点，损失对这次改动有多敏感。</p></div></section>
<section class="not-destination" aria-labelledby="limit-title"><h2 id="limit-title">它不是最佳参数的坐标</h2><p>梯度只在当前位置附近可靠。优化器要反复读取梯度、更新参数，才逐步接近较低的损失。</p><div class="sequence" aria-label="训练循环：读取局部梯度，更新参数，再读取"><span class="node active">读取坡度</span><span class="arrow" aria-hidden="true">›</span><span class="node">更新参数</span><span class="arrow" aria-hidden="true">›</span><span class="node">重新读取</span></div></section>
</aside></main></section></div>
<script src="assets/base.js"></script><script>Deck.init({index:13,total:25});</script>
</body></html>
