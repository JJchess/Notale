<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .page-head .lead{max-width:1160px;color:var(--muted)}
    .experiment.panel{padding:18px 22px 16px;display:flex;flex-direction:column;gap:12px}
    .plot-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
    .plot-head h2{margin-bottom:5px}.plot-head .small{max-width:680px}
    .read-strip{display:flex;align-items:baseline;gap:28px}.read-strip div{display:grid;gap:2px}
    .read-strip span:first-child{font-size:var(--fs-label);color:var(--muted)}
    .read-strip output{font-family:var(--font-num);font-size:25px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
    .chart-wrap{flex:1;min-height:0;position:relative}#plot{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
    .chart-hint{position:absolute;left:58px;top:10px;padding:5px 9px;background:rgba(255,255,255,.9);border:1px solid var(--rule-soft);border-radius:6px;color:var(--muted);font-size:var(--fs-label);pointer-events:none}
    .legend{justify-content:center}.controls.panel{display:flex;flex-direction:column;gap:18px;padding:22px}
    .control-section{display:grid;gap:10px}.control-section+.control-section{border-top:1px solid var(--rule-soft);padding-top:17px}
    .step-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.step-buttons .btn{min-height:58px;padding:8px 10px}
    .formula{font-family:var(--font-num);font-size:var(--fs-sec);line-height:1.55;color:var(--text)}.formula strong{color:var(--gradient);font-weight:600}
    .result{display:grid;gap:8px;min-height:126px;padding-top:2px}.result-main{font-size:var(--fs-lead);line-height:1.35;font-weight:650}
    .result-main.down{color:var(--model)}.result-main.up{color:var(--gradient)}
    .delta{font-family:var(--font-num);font-size:var(--fs-body);font-weight:600;font-variant-numeric:tabular-nums}
    .reset-row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.reset-row .btn{min-height:42px}
    .mini-label{font-size:var(--fs-label);color:var(--muted);line-height:1.35}
    svg text{font-family:var(--font-sans);fill:var(--muted)}svg .tick{font-family:var(--font-num);font-size:13px}svg .axis-label{font-size:15px;font-weight:600;fill:var(--text)}
  </style>
</head>
<body data-page="14" data-total="25">
<div id="stage">
  <section class="workbench">
    <header class="page-head"><div class="kicker">梯度下降 · 单步实验</div><h1>负梯度指向损失下降最快的一侧</h1><p class="lead">在曲线上选一个参数位置，再分别沿负梯度和正梯度试走一步，比较损失怎样变化。</p></header>
    <div class="experiment panel min0" aria-labelledby="plot-title">
      <div class="plot-head"><div><h2 id="plot-title">损失曲线 L(w)</h2><p class="small">曲线斜率就是当前位置的梯度；橙色切线显示它的符号与大小。</p></div><div class="read-strip" aria-live="polite"><div><span>当前位置 w</span><output id="wRead">−2.00</output></div><div><span>梯度 dL/dw</span><output id="gRead">−1.92</output></div></div></div>
      <div class="chart-wrap min0"><svg id="plot" role="img" aria-label="可交互的抛物线损失曲线。点击图中任意横向位置可选择参数位置。"></svg><div class="chart-hint">点击图中任意横向位置，选择起点</div></div>
      <div class="legend" aria-hidden="true"><span class="li" style="color:var(--model)"><span class="sw line"></span>损失曲线</span><span class="li" style="color:var(--attention)"><span class="sw"></span>当前起点</span><span class="li" style="color:var(--gradient)"><span class="sw line"></span>当前位置的切线</span></div>
    </div>
    <aside class="controls panel min0" aria-label="单步实验控制区">
      <div class="control-section"><h2>选择起点</h2><label class="ctl" for="wSlider">参数位置 w <output id="wOut">−2.00</output></label><input id="wSlider" type="range" min="-4" max="6" value="-2" step="0.1"></div>
      <div class="control-section"><label class="ctl" for="etaSlider">步长 η <output id="etaOut">0.40</output></label><input id="etaSlider" type="range" min="0.1" max="0.8" value="0.4" step="0.1"><div class="formula">更新量 = <strong>方向</strong> × η × dL/dw</div></div>
      <div class="control-section"><h3>选方向，试走一步</h3><div class="step-buttons"><button id="negBtn" class="btn" type="button" aria-pressed="false">沿负梯度走</button><button id="posBtn" class="btn" type="button" aria-pressed="false">沿正梯度走</button></div></div>
      <div class="control-section result" aria-live="polite"><div id="resultMain" class="result-main">先选一个方向</div><div id="delta" class="delta">损失变化：等待试走</div><p id="explain" class="small">负号会把梯度方向反过来，使参数朝曲线下坡的一侧移动。</p></div>
      <div class="reset-row"><span class="mini-label">每次试走都从黄色起点出发</span><button id="resetBtn" class="btn" type="button">恢复初始位置</button></div>
    </aside>
  </section>
</div>
<script src="assets/base.js"></script>
<script>
(()=>{Deck.init({index:14,total:25});
const svg=document.getElementById('plot'),wSlider=document.getElementById('wSlider'),etaSlider=document.getElementById('etaSlider'),wOut=document.getElementById('wOut'),etaOut=document.getElementById('etaOut'),wRead=document.getElementById('wRead'),gRead=document.getElementById('gRead'),resultMain=document.getElementById('resultMain'),delta=document.getElementById('delta'),explain=document.getElementById('explain'),negBtn=document.getElementById('negBtn'),posBtn=document.getElementById('posBtn');
let w=-2,eta=.4,trial=null;const loss=x=>.32*(x-1)*(x-1)+.7,grad=x=>.64*(x-1);const fmt=(v,d=2)=>(v<0?'−':'')+Math.abs(v).toFixed(d),signed=(v,d=2)=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(d);
function resetTrial(){trial=null;negBtn.setAttribute('aria-pressed','false');posBtn.setAttribute('aria-pressed','false');resultMain.className='result-main';resultMain.textContent='先选一个方向';delta.textContent='损失变化：等待试走';explain.textContent='负号会把梯度方向反过来，使参数朝曲线下坡的一侧移动。'}
function sync(){wSlider.value=w;wOut.textContent=fmt(w);etaOut.textContent=eta.toFixed(2);wRead.textContent=fmt(w);gRead.textContent=signed(grad(w));draw()}
function tryStep(sign){const g=grad(w),next=Math.max(-4,Math.min(6,w+sign*eta*g)),before=loss(w),after=loss(next),change=after-before;trial={next,before,after,change,sign};negBtn.setAttribute('aria-pressed',sign===-1?'true':'false');posBtn.setAttribute('aria-pressed',sign===1?'true':'false');const down=change<-.0005,flat=Math.abs(change)<=.0005;resultMain.className='result-main '+(down?'down':flat?'':'up');resultMain.textContent=flat?'几乎没有移动：这里接近最低点':down?'损失下降了':'损失上升了';delta.textContent=`L: ${before.toFixed(2)} → ${after.toFixed(2)}　变化 ${signed(change)}`;explain.textContent=flat?'梯度接近 0，两个方向给出的更新量都很小。':sign===-1?`负梯度把参数从 ${fmt(w)} 推到 ${fmt(next)}，移动方向与切线上升方向相反。`:`正梯度把参数从 ${fmt(w)} 推到 ${fmt(next)}，沿切线上升方向移动。`;draw()}
function draw(){const W=Math.max(700,svg.clientWidth||900),H=Math.max(400,svg.clientHeight||500);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);const m={l:70,r:28,t:34,b:54},pw=W-m.l-m.r,ph=H-m.t-m.b,xmin=-4,xmax=6,ymin=0,ymax=9.2,X=x=>m.l+(x-xmin)/(xmax-xmin)*pw,Y=y=>m.t+(ymax-y)/(ymax-ymin)*ph;let path='';for(let i=0;i<=180;i++){const x=xmin+(xmax-xmin)*i/180;path+=(i?'L':'M')+X(x).toFixed(1)+','+Y(loss(x)).toFixed(1)}const g=grad(w),span=1.15,tx1=w-span,tx2=w+span,ty1=loss(w)+g*(tx1-w),ty2=loss(w)+g*(tx2-w);let h=`<line x1="${m.l}" y1="${Y(0)}" x2="${W-m.r}" y2="${Y(0)}" stroke="var(--rule)" stroke-width="2"/><line x1="${X(0)}" y1="${m.t}" x2="${X(0)}" y2="${H-m.b}" stroke="var(--rule)" stroke-width="2"/>`;[-4,-2,0,1,2,4,6].forEach(x=>h+=`<line x1="${X(x)}" y1="${Y(0)}" x2="${X(x)}" y2="${Y(0)+7}" stroke="var(--rule)" stroke-width="1.5"/><text class="tick" x="${X(x)}" y="${Y(0)+25}" text-anchor="middle">${x}</text>`);[2,4,6,8].forEach(y=>h+=`<line x1="${X(0)-7}" y1="${Y(y)}" x2="${X(0)}" y2="${Y(y)}" stroke="var(--rule)" stroke-width="1.5"/><text class="tick" x="${X(0)-13}" y="${Y(y)+5}" text-anchor="end">${y}</text>`);h+=`<text class="axis-label" x="${W-m.r}" y="${H-14}" text-anchor="end">参数 w</text><text class="axis-label" x="${m.l}" y="18">损失 L</text><path d="${path}" fill="none" stroke="var(--model)" stroke-width="5" stroke-linecap="round"/><line x1="${X(tx1)}" y1="${Y(ty1)}" x2="${X(tx2)}" y2="${Y(ty2)}" stroke="var(--gradient)" stroke-width="4" stroke-linecap="round"/>`;if(trial){const x1=X(w),y1=Y(loss(w)),x2=X(trial.next),y2=Y(trial.after),ang=Math.atan2(y2-y1,x2-x1),ah=12;h+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--text)" stroke-width="3" stroke-dasharray="8 7"/><path d="M${x2},${y2} L${x2-ah*Math.cos(ang-.55)},${y2-ah*Math.sin(ang-.55)} L${x2-ah*Math.cos(ang+.55)},${y2-ah*Math.sin(ang+.55)} Z" fill="var(--text)"/><circle cx="${x2}" cy="${y2}" r="9" fill="var(--surface)" stroke="var(--text)" stroke-width="4"/><text x="${x2}" y="${Math.max(24,y2-17)}" text-anchor="middle" style="font-size:15px;font-weight:600;fill:var(--text)">试走后</text>`}h+=`<circle cx="${X(w)}" cy="${Y(loss(w))}" r="11" fill="var(--attention)" stroke="var(--surface)" stroke-width="4"/><text x="${X(w)}" y="${Math.max(24,Y(loss(w))-20)}" text-anchor="middle" style="font-size:15px;font-weight:600;fill:var(--text)">起点</text>`;svg.innerHTML=h}
wSlider.addEventListener('input',()=>{w=Number(wSlider.value);resetTrial();sync()});etaSlider.addEventListener('input',()=>{eta=Number(etaSlider.value);resetTrial();sync()});negBtn.addEventListener('click',()=>tryStep(-1));posBtn.addEventListener('click',()=>tryStep(1));document.getElementById('resetBtn').addEventListener('click',()=>{w=-2;eta=.4;resetTrial();sync()});svg.addEventListener('pointerdown',e=>{const p=Deck.pt(svg,e),W=svg.clientWidth,left=70,right=28;w=Math.round((-4+Deck.clamp((p.x-left)/(W-left-right),0,1)*10)*10)/10;resetTrial();sync()});Deck.onResize(draw);sync()})();
</script>
</body></html>
