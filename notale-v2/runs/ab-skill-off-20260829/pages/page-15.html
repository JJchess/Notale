<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{padding:28px 56px}.workbench{grid-template-columns:minmax(0,1.7fr) minmax(360px,.62fr);gap:20px 30px}.workbench>header{gap:6px}.lead{color:var(--muted)}
    .experiment{display:grid;grid-template-rows:minmax(0,1fr) 176px;gap:16px}.mainplot{display:flex;flex-direction:column;padding:18px 20px 14px}.plothead{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:8px}.formula{font-family:var(--font-num);font-size:var(--fs-label);color:var(--muted);white-space:nowrap}.chartwrap{position:relative;flex:1;min-height:0}#trajectory,#reference{width:100%;height:100%;display:block}
    .refs{display:grid;grid-template-columns:180px minmax(0,1fr);align-items:stretch;padding:14px 18px;gap:16px}.refs-intro{display:flex;flex-direction:column;justify-content:center;gap:6px;border-right:1px solid var(--rule-soft);padding-right:16px}.refs-intro p{font-size:var(--fs-label);color:var(--muted);line-height:1.4}
    .controls{display:flex;flex-direction:column;gap:16px;padding:20px}.readout{display:flex;align-items:baseline;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--rule-soft)}.readout .big{font-size:62px}.status{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule-soft)}.status-mark{width:14px;height:14px;margin-top:5px;border-radius:50%;flex:none;background:var(--attention);border:2px solid var(--text)}.status strong{display:block;font-size:var(--fs-body);margin-bottom:3px}.status span{display:block;color:var(--muted);font-size:var(--fs-label);line-height:1.4}.preset-label{font-size:var(--fs-label);font-weight:650;margin-bottom:-6px}.btns .btn{flex:1;padding-left:9px;padding-right:9px}.metrics{display:grid;border-top:1px solid var(--rule-soft)}.metric{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 0;border-bottom:1px solid var(--rule-soft)}.metric span{font-size:var(--fs-label);color:var(--muted)}.metric output{font-family:var(--font-num);font-weight:600;color:var(--text);font-size:var(--fs-sec)}.note{margin-top:auto}
    svg text{font-family:var(--font-sans)}.gridline{stroke:var(--rule-soft);stroke-width:1}.zero{stroke:var(--observed);stroke-width:2;stroke-dasharray:7 5}.path-active{fill:none;stroke:var(--model);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.pt-active{fill:var(--surface);stroke:var(--model);stroke-width:3}.pt-last{fill:var(--attention);stroke:var(--text);stroke-width:2}.refpath{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.tick{fill:var(--muted);font-size:13px}.label{fill:var(--text);font-size:15px;font-weight:600}.caption{fill:var(--muted);font-size:13px}
  </style>
</head>
<body data-page="15" data-total="25">
<div id="stage"><section class="workbench">
<header><div class="kicker">学习率 · 参数更新幅度</div><h1>一步迈多远，决定训练是停滞、收敛还是越界</h1><p class="lead">拖动学习率 η。每一步都按同一条规则更新权重，目标位置始终是 <span class="num">w = 0</span>。</p></header>
<main class="experiment min0"><section class="panel mainplot min0" aria-labelledby="plot-title"><div class="plothead"><div><h2 id="plot-title">当前训练轨迹</h2><p class="small">横轴是更新次数，纵轴是权重 w</p></div><div class="formula">wₜ₊₁ = (1 − η)wₜ</div></div><div class="chartwrap min0"><svg id="trajectory" role="img" aria-label="当前学习率下，权重随训练步数变化的折线图"></svg></div></section>
<section class="panel refs min0" aria-labelledby="ref-title"><div class="refs-intro"><h3 id="ref-title">三条参照轨迹</h3><p>起点相同，只有学习率不同。</p></div><svg id="reference" role="img" aria-label="过小、适中和过大学习率的三条参照轨迹"></svg></section></main>
<aside class="controls panel min0" aria-label="学习率控制与训练读数"><div><div class="small">当前学习率</div><div class="readout"><output id="etaBig" class="big" for="eta">0.70</output><span class="unit">η</span></div></div>
<label class="ctl" for="eta">调节每次更新的步幅<input id="eta" type="range" min="0.02" max="2.20" value="0.70" step="0.01"></label>
<div class="status" aria-live="polite"><span class="status-mark" id="statusMark"></span><div><strong id="statusTitle">稳定下降</strong><span id="statusText">每一步都靠近目标，且不会跨过目标点。</span></div></div>
<div class="preset-label">跳到三种典型情况</div><div class="btns" aria-label="典型学习率"><button class="btn" type="button" data-eta="0.08">过小 0.08</button><button class="btn" type="button" data-eta="0.70" aria-pressed="true">适中 0.70</button><button class="btn" type="button" data-eta="2.10">过大 2.10</button></div>
<div class="metrics"><div class="metric"><span>每步保留倍率 |1−η|</span><output id="factor">0.30</output></div><div class="metric"><span>第 12 步 |w|</span><output id="lastWeight">0.000</output></div><div class="metric"><span>第 12 步损失 ½w²</span><output id="loss">0.0000</output></div></div><p class="note">η 在 0 与 1 之间时同侧靠近；1 与 2 之间时越过目标后收敛；大于 2 时越界幅度逐步放大。</p></aside>
</section></div>
<script src="assets/base.js"></script>
<script>
Deck.init({index:15,total:25});
const etaInput=document.getElementById('eta'),etaBig=document.getElementById('etaBig'),factor=document.getElementById('factor'),lastWeight=document.getElementById('lastWeight'),loss=document.getElementById('loss'),statusTitle=document.getElementById('statusTitle'),statusText=document.getElementById('statusText'),statusMark=document.getElementById('statusMark'),mainSvg=document.getElementById('trajectory'),refSvg=document.getElementById('reference'),NS='http://www.w3.org/2000/svg';
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function seq(eta,n=12){let a=[4];for(let i=0;i<n;i++)a.push(a[a.length-1]*(1-eta));return a}
function el(name,attrs,parent){const node=document.createElementNS(NS,name);Object.entries(attrs||{}).forEach(([k,v])=>node.setAttribute(k,v));(parent||mainSvg).appendChild(node);return node}
function txt(parent,x,y,s,cls,anchor='start'){const t=el('text',{x,y,class:cls,'text-anchor':anchor},parent);t.textContent=s;return t}
function pathFor(values,x,y,w,h,yMax){return values.map((v,i)=>(i?'L':'M')+(x+i*w/(values.length-1)).toFixed(1)+','+(y+h/2-v/yMax*h/2).toFixed(1)).join(' ')}
function drawMain(eta){const w=Math.max(620,mainSvg.clientWidth),h=Math.max(330,mainSvg.clientHeight);mainSvg.setAttribute('viewBox',`0 0 ${w} ${h}`);mainSvg.innerHTML='';const m={l:58,r:22,t:18,b:42},pw=w-m.l-m.r,ph=h-m.t-m.b,values=seq(eta),raw=Math.max(4.4,...values.map(Math.abs)),yMax=Math.min(14,Math.max(4.4,raw*1.12));[-1,-.5,0,.5,1].forEach(q=>{const yy=m.t+ph*(1-q)/2;el('line',{x1:m.l,y1:yy,x2:w-m.r,y2:yy,class:q===0?'zero':'gridline'},mainSvg);txt(mainSvg,m.l-10,yy+4,(q*yMax).toFixed(q===0?0:1),'tick','end')});[0,2,4,6,8,10,12].forEach(i=>{const xx=m.l+i*pw/12;el('line',{x1:xx,y1:m.t,x2:xx,y2:h-m.b,class:'gridline'},mainSvg);txt(mainSvg,xx,h-14,String(i),'tick','middle')});txt(mainSvg,w-m.r,h-14,'更新次数','caption','end');txt(mainSvg,m.l,m.t-5,'w','label');txt(mainSvg,w-m.r,m.t+ph/2-8,'目标 w = 0','caption','end');el('path',{d:pathFor(values,m.l,m.t,pw,ph,yMax),class:'path-active'},mainSvg);values.forEach((v,i)=>{const cx=m.l+i*pw/12,cy=m.t+ph/2-v/yMax*ph/2;el('circle',{cx,cy,r:i===12?6:4,class:i===12?'pt-last':'pt-active'},mainSvg)});if(raw>14)txt(mainSvg,w-m.r,m.t+18,'图形已截到 ±14；数值仍按公式计算','caption','end')}
function drawRefs(){const w=Math.max(650,refSvg.clientWidth),h=Math.max(130,refSvg.clientHeight);refSvg.setAttribute('viewBox',`0 0 ${w} ${h}`);refSvg.innerHTML='';[{e:.08,n:'过小  η=0.08',c:css('--rule')},{e:.7,n:'适中  η=0.70',c:css('--model')},{e:2.1,n:'过大  η=2.10',c:css('--gradient')}].forEach((r,j)=>{const top=7+j*h/3,rowH=h/3-7,x=148,pw=w-x-14,mid=top+rowH/2;el('line',{x1:x,y1:mid,x2:w-14,y2:mid,class:'zero'},refSvg);txt(refSvg,4,mid+5,r.n,'label');el('path',{d:pathFor(seq(r.e),x,top,pw,rowH,7),class:'refpath',stroke:r.c},refSvg)})}
function update(){const eta=Number(etaInput.value),vals=seq(eta),last=vals[12],f=Math.abs(1-eta);etaBig.value=eta.toFixed(2);factor.value=f.toFixed(2);lastWeight.value=Math.abs(last).toFixed(3);loss.value=(.5*last*last).toFixed(4);let title,text,color;if(eta<.2){title='步幅过小，训练近似停滞';text='方向正确，但 12 步后仍离目标较远。';color='var(--rule)'}else if(eta<=1){title='稳定下降';text='每一步都靠近目标，且不会跨过目标点。';color='var(--model)'}else if(eta<2){title='来回越界，但仍会收敛';text='每步跨过目标，偏差的绝对值继续缩小。';color='var(--gradient)'}else if(eta===2){title='来回越界，无法靠近';text='每一步都跨过目标，偏差大小保持不变。';color='var(--gradient)'}else{title='步幅过大，越界幅度放大';text='每步跨过目标，偏差的绝对值反而增大。';color='var(--gradient)'}statusTitle.textContent=title;statusText.textContent=text;statusMark.style.background=color;document.querySelectorAll('[data-eta]').forEach(b=>b.setAttribute('aria-pressed',Math.abs(Number(b.dataset.eta)-eta)<.001?'true':'false'));drawMain(eta)}
etaInput.addEventListener('input',update);document.querySelectorAll('[data-eta]').forEach(b=>b.addEventListener('click',()=>{etaInput.value=b.dataset.eta;update()}));Deck.onResize(()=>{drawRefs();update()});drawRefs();update();
</script></body></html>
