<body data-page="17" data-total="25">
<div id="stage"><main class="focus"><header><div class="kicker">链式法则 · 一条计算路径</div><h1>总影响等于路径上各段局部影响相乘</h1><p class="lead">固定 <b>x = 2</b>，先向前算出损失，再沿同一条路读取局部导数。</p></header><section class="board min0"><div class="chain" aria-label="从输入到损失的短计算链"><div class="node observed"><small>输入</small><strong>x = 2</strong><span>外部给定</span></div><div class="edge"><i>→</i><b>∂z/∂x = 3</b><i>←</i></div><div class="node model"><small>线性变换</small><strong>z = 6</strong><span>z = 3x</span></div><div class="edge"><i>→</i><b>∂ŷ/∂z = 12</b><i>←</i></div><div class="node model"><small>非线性变换</small><strong>ŷ = 36</strong><span>ŷ = z²</span></div><div class="edge"><i>→</i><b>∂L/∂ŷ = 52</b><i>←</i></div><div class="node loss"><small>损失</small><strong>L = 676</strong><span>L = (ŷ − 10)²</span></div></div><div class="formula"><div><span>∂L/∂x</span> = <b>∂L/∂ŷ</b> × <b>∂ŷ/∂z</b> × <b>∂z/∂x</b><em>= 52 × 12 × 3</em></div><output>1872</output></div><div class="why"><h2>为什么是乘法？</h2><p><b>x</b> 的微小变化先把 <b>z</b> 改变 3 倍，随后又被后两段分别放大 12 倍和 52 倍。</p></div></section></main></div>
