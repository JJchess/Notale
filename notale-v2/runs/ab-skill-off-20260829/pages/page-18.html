<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
.workbench{grid-template-columns:minmax(0,1.55fr) minmax(390px,.72fr);gap:20px 32px}.lead{max-width:1160px;color:var(--muted)}
.experiment{display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px}.equation{display:flex;align-items:baseline;justify-content:space-between;gap:24px;padding:0 4px}.equation strong{font-family:var(--font-num);font-size:var(--fs-lead);color:var(--gradient)}.equation .small{font-size:var(--fs-label)}
.chain{height:100%;display:grid;grid-template-columns:210px minmax(0,1fr) 190px;grid-template-rows:repeat(5,minmax(0,1fr));align-items:center;padding:18px 24px}.node{display:flex;align-items:center;gap:14px}.node-bubble{width:66px;height:54px;display:grid;place-items:center;border:2px solid var(--rule);border-radius:10px;background:var(--surface);font-family:var(--font-num);font-size:var(--fs-lead);font-weight:600}.loss .node-bubble{border-color:var(--gradient);color:var(--gradient)}.param .node-bubble{border-color:var(--model);color:var(--model)}.node-name{font-size:var(--fs-label);color:var(--muted);line-height:1.35}
.signal{position:relative;height:54px;display:flex;align-items:center;padding-right:28px}.signal:before{content:"";position:absolute;left:0;right:0;top:26px;border-top:2px solid var(--rule-soft)}.signal-line{position:relative;height:8px;min-width:4px;max-width:100%;background:var(--gradient);border-radius:2px;transition:width .22s ease,opacity .22s ease}.signal-line:before{content:"";position:absolute;left:-1px;top:-6px;border-top:10px solid transparent;border-bottom:10px solid transparent;border-right:15px solid var(--gradient)}.signal.zero .signal-line{width:4px!important;height:18px;border-radius:0;background:var(--text);opacity:.35}.signal.zero .signal-line:before{display:none}.local{text-align:right}.local .sym{font-family:var(--font-num);font-size:var(--fs-label);color:var(--muted)}.local .val{font-family:var(--font-num);font-size:var(--fs-lead);font-weight:600;color:var(--observed)}.local.na .val{color:var(--muted)}
.controls{display:flex;flex-direction:column;gap:12px;padding:18px}.controls h2{font-size:var(--fs-h2)}.slider-list{display:grid;gap:10px;padding:10px 0;border-top:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft)}.ctl-head{display:flex;justify-content:space-between;gap:14px;align-items:baseline}.ctl output{font-size:var(--fs-sec);font-weight:600;color:var(--observed)}.result{display:grid;grid-template-columns:1fr auto;align-items:end;gap:8px 18px}.result .label{font-size:var(--fs-label);color:var(--muted)}.result .big{grid-column:1/-1;color:var(--gradient);font-size:52px}.classification{grid-column:1/-1;font-size:var(--fs-sec);font-weight:650;min-height:26px}.btns{margin-top:auto}.btn{flex:1 1 110px}.explain{padding-top:8px;border-top:1px solid var(--rule-soft);color:var(--muted);font-size:var(--fs-label);line-height:1.5}@media(prefers-reduced-motion:reduce){.signal-line{transition:none}}
</style>
</head>
<body data-page="18" data-total="25">
<div id="stage">
<section class="workbench">
<header><div class="kicker">CHAIN RULE · 反向传播</div><h1>局部导数相乘，决定误差信号能传多远</h1><p class="lead">拖动任一环节。左侧从损失 <span class="num">L</span> 向参数 <span class="num">θ</span> 回看，每经过一环都乘上该处的局部导数。</p></header>
<div class="experiment min0"><div class="equation"><strong id="formula"></strong><span class="small">橙线长度表示累计梯度的绝对值</span></div>
<div class="panel chain min0" aria-label="反向传播链：从损失传向参数">
<div class="node loss"><div class="node-bubble">L</div><div class="node-name">损失<br>起始信号</div></div><div class="signal" data-signal><div class="signal-line"></div></div><div class="local na"><div class="sym">累计梯度</div><div class="val">1.000</div></div>
<div class="node"><div class="node-bubble">ŷ</div><div class="node-name">预测值</div></div><div class="signal" data-signal><div class="signal-line"></div></div><div class="local"><div class="sym">∂L / ∂ŷ</div><div class="val" data-local>1.00</div></div>
<div class="node"><div class="node-bubble">z</div><div class="node-name">激活前</div></div><div class="signal" data-signal><div class="signal-line"></div></div><div class="local"><div class="sym">∂ŷ / ∂z</div><div class="val" data-local>0.80</div></div>
<div class="node"><div class="node-bubble">a</div><div class="node-name">上一层输出</div></div><div class="signal" data-signal><div class="signal-line"></div></div><div class="local"><div class="sym">∂z / ∂a</div><div class="val" data-local>1.20</div></div>
<div class="node param"><div class="node-bubble">θ</div><div class="node-name">更早参数<br>接收更新</div></div><div class="signal" data-signal><div class="signal-line"></div></div><div class="local"><div class="sym">∂a / ∂θ</div><div class="val" data-local>0.60</div></div>
</div></div>
<aside class="controls panel min0"><div><h2>改动任一局部导数</h2><p class="small">范围 −2.00 至 2.00；步长 0.05</p></div>
<div class="slider-list">
<label class="ctl"><span class="ctl-head"><span>损失对预测值的导数</span><output for="d0">1.00</output></span><input id="d0" type="range" min="-2" max="2" step="0.05" value="1"></label>
<label class="ctl"><span class="ctl-head"><span>预测值对激活前值的导数</span><output for="d1">0.80</output></span><input id="d1" type="range" min="-2" max="2" step="0.05" value="0.8"></label>
<label class="ctl"><span class="ctl-head"><span>激活前值对上一层输出的导数</span><output for="d2">1.20</output></span><input id="d2" type="range" min="-2" max="2" step="0.05" value="1.2"></label>
<label class="ctl"><span class="ctl-head"><span>上一层输出对参数的导数</span><output for="d3">0.60</output></span><input id="d3" type="range" min="-2" max="2" step="0.05" value="0.6"></label>
</div>
<div class="result" aria-live="polite"><span class="label">传到参数 θ 的梯度</span><span class="unit">∂L / ∂θ</span><output class="big" id="total">0.576</output><div class="classification" id="classification"></div></div>
<div class="btns"><button class="btn" type="button" data-preset="fade">逐级削弱</button><button class="btn" type="button" data-preset="cut">中途截断</button><button class="btn" type="button" data-preset="amplify">连续放大</button><button class="btn" type="button" data-preset="reset">恢复初值</button></div><p class="explain" id="explain"></p>
</aside></section></div>
<script src="assets/base.js"></script>
<script>
Deck.init({index:18,total:25});
const sliders=[0,1,2,3].map(i=>document.getElementById('d'+i)),outs=sliders.map(s=>document.querySelector('output[for="'+s.id+'"]')),locals=[...document.querySelectorAll('[data-local]')],signals=[...document.querySelectorAll('[data-signal]')],total=document.getElementById('total'),formula=document.getElementById('formula'),classification=document.getElementById('classification'),explain=document.getElementById('explain');
const fmt=v=>Math.abs(v)<.0005?'0.00':v.toFixed(2);
function render(){const v=sliders.map(s=>Number(s.value)),cum=[1];v.forEach((n,i)=>cum.push(cum[i]*n));v.forEach((n,i)=>{outs[i].value=fmt(n);locals[i].textContent=fmt(n)});const max=Math.max(1,...cum.map(Math.abs));signals.forEach((el,i)=>{const n=cum[i];el.classList.toggle('zero',Math.abs(n)<.0005);el.querySelector('.signal-line').style.width=Math.max(4,Math.abs(n)/max*100)+'%';el.querySelector('.signal-line').style.opacity=n<0?'.58':'1';el.setAttribute('aria-label','累计梯度 '+n.toFixed(3))});const p=cum[4];total.value=p.toFixed(3);formula.textContent='∂L/∂θ = '+v.map(fmt).join(' × ')+' = '+p.toFixed(3);if(Math.abs(p)<.0005){classification.textContent='信号被截断，参数 θ 收不到本次误差。';explain.textContent='链中只要有一个局部导数为 0，整条乘积就为 0，更早的参数不会更新。'}else if(Math.abs(p)>1.001){classification.textContent='信号被放大，参数 θ 收到更强更新。';explain.textContent='多个绝对值大于 1 的局部导数连续相乘，会把传向前层的梯度放大。'}else{classification.textContent='信号被削弱，仍能传到参数。';explain.textContent='当前乘积的绝对值小于起始信号 1，较早参数收到的更新更弱。'}if(p<0)classification.textContent+=' 方向发生反转。'}
sliders.forEach(s=>s.addEventListener('input',render));const presets={fade:[.7,.7,.7,.7],cut:[1.2,0,1.4,.8],amplify:[1.4,1.3,1.25,1.2],reset:[1,.8,1.2,.6]};document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{presets[b.dataset.preset].forEach((n,i)=>sliders[i].value=n);render()}));render();
</script>
</body>
</html>
