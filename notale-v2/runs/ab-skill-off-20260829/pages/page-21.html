<section class="intro min0" aria-labelledby="title"><div class="kicker">CHAPTER 05 · 训练循环</div><h1 id="title">一次训练<br>怎样变成学会</h1><p class="dek">一次参数更新只改动一点点。<strong>前向、算损失、反向求梯度、更新参数</strong>反复循环，模型的表现才出现可观察的变化。</p><div class="chapter-line" aria-hidden="true"></div></section>
<section class="cycle min0" aria-labelledby="cycle-title"><header class="cycle-head"><div><h2 id="cycle-title">沿着一次训练循环走一圈</h2><p>每次点击推进一个环节</p></div><div class="counter" id="counter">1 / 4</div></header>
<div class="diagram-area" aria-live="polite"><svg class="path-svg" viewBox="0 0 680 410" role="img" aria-label="前向、损失、反向和更新构成闭环"><defs><marker id="arrow-model" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1F5FAE"/></marker><marker id="arrow-grad" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#C94F20"/></marker></defs><path class="path-base" d="M205 62 H475 Q600 62 600 172 V240 Q600 350 475 350 H205 Q80 350 80 240 V172 Q80 62 205 62 Z"/><path id="flow" class="path-flow" pathLength="100" marker-end="url(#arrow-model)" d="M205 62 H475 Q600 62 600 172 V240 Q600 350 475 350 H205 Q80 350 80 240 V172 Q80 62 205 62 Z"/></svg>
<div class="node n1 active"><span class="n">01</span><strong>前向计算</strong><span>输入经过当前参数</span></div><div class="node n2"><span class="n">02</span><strong>计算损失</strong><span>预测与目标比较</span></div><div class="node n3"><span class="n">03</span><strong>反向求梯度</strong><span>误差信息逐层返回</span></div><div class="node n4"><span class="n">04</span><strong>更新参数</strong><span>沿降低损失的方向微调</span></div><div class="center-readout" aria-hidden="true"><div class="label">反复执行</div><div class="value">预测逐步<br>贴近目标</div></div></div>
<div class="controls-row"><div class="status"><span class="status-mark" aria-hidden="true"></span><span id="status">先用当前参数算出预测。</span></div><div class="btns"><button class="btn secondary" id="reset" type="button">回到前向计算</button><button class="btn" id="next" type="button">推进到计算损失</button></div></div></section>

<script>
Deck.init({index:21,total:25});const nodes=[...document.querySelectorAll('.node')],labels=['前向计算','计算损失','反向求梯度','更新参数'],messages=['先用当前参数算出预测。','比较预测与目标，得到本轮误差。','把误差对各参数的影响算回来。','微调参数，再用新参数开始下一轮。'],flow=document.getElementById('flow'),counter=document.getElementById('counter'),status=document.getElementById('status'),next=document.getElementById('next'),reset=document.getElementById('reset');let step=0;function render(){nodes.forEach((node,i)=>{node.classList.toggle('active',i===step);node.classList.toggle('done',i<step)});counter.textContent=(step+1)+' / 4';status.textContent=messages[step];next.textContent=step===3?'开始下一轮':'推进到'+labels[step+1];const length=[9,34,59,84][step];flow.style.strokeDasharray=length+' '+(100-length);flow.style.stroke=step>=2?'var(--gradient)':'var(--model)';flow.setAttribute('marker-end',step>=2?'url(#arrow-grad)':'url(#arrow-model)')}next.addEventListener('click',()=>{step=(step+1)%4;render()});reset.addEventListener('click',()=>{step=0;render()});render();
