<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>训练中，边界与参数一起移动</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
.workbench{gap:18px 30px}.workbench>header{gap:5px}.lead{max-width:1180px;color:var(--muted)}
.experiment{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,.72fr);gap:18px;min-height:0}
.map-panel,.trace-panel,.controls{display:flex;flex-direction:column;min-height:0}.panel{padding:18px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:10px}.panel-head h2{font-size:var(--fs-body)}.legend{justify-content:flex-end}
.map-wrap{flex:1;min-height:0;border-top:1px solid var(--rule-soft);padding-top:10px}.map-wrap canvas,.loss-wrap canvas{display:block;width:100%;height:100%}
.trace-panel{gap:14px}.loss-block{display:flex;flex-direction:column;flex:0 0 235px;min-height:0}.loss-wrap{flex:1;min-height:0;border-top:1px solid var(--rule-soft);padding-top:8px}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid var(--rule-soft);padding-top:14px}.readout label{display:block;color:var(--muted);font-size:var(--fs-label);margin-bottom:5px}.readout .big{font-size:36px}
.param-block{flex:1;min-height:0;border-top:1px solid var(--rule-soft);padding-top:13px}.param-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.weight{font-family:var(--font-num);font-size:var(--fs-label);text-align:right;padding:8px 6px;border:1px solid var(--rule-soft);border-radius:4px;background:var(--surface);font-variant-numeric:tabular-nums}.weight.changed{color:var(--gradient);border-color:var(--gradient)}
.controls{gap:15px}.status-line{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--rule-soft);padding-bottom:13px}.status{font-weight:700;color:var(--observed)}
.controls .btns{display:grid;grid-template-columns:1fr 1fr}.controls .btn{width:100%}.formula{font-family:var(--font-num);font-size:var(--fs-label);line-height:1.6;color:var(--muted);border-top:1px solid var(--rule-soft);padding-top:13px}
.instruction{margin-top:auto;padding-top:13px;border-top:1px solid var(--rule-soft)}.checkpoint{color:var(--text);font-size:var(--fs-sec);line-height:1.48;margin-bottom:8px}.checkpoint strong{color:var(--gradient)}.sw.a{color:var(--observed)}.sw.b{color:var(--gradient)}
</style>
</head>
<body data-page="23" data-total="25">
<div id="stage">
<section class="workbench">
<header><div class="kicker">训练实验 · 二分类</div><h1>训练中，决策边界、损失和参数一起移动</h1><p class="lead">启动一个含 2 个输入、4 个隐藏单元和 1 个输出的小网络；暂停后对照三处读数。</p></header>
<div class="experiment min0">
<section class="panel map-panel min0" aria-labelledby="map-title"><div class="panel-head"><div><h2 id="map-title">决策平面</h2><p class="small">底色是模型给出类别 B 的概率</p></div><div class="legend" aria-label="图例"><span class="li"><span class="sw a"></span>类别 A</span><span class="li"><span class="sw b"></span>类别 B</span><span class="li"><span class="sw line" style="color:var(--text)"></span>p = 0.5</span></div></div><div class="map-wrap cvbox"><canvas id="map" aria-label="训练样本与当前决策边界"></canvas></div></section>
<section class="panel trace-panel min0" aria-label="训练读数"><div class="loss-block min0"><div class="panel-head"><h2>总体损失</h2><span class="unit">binary cross-entropy</span></div><div class="loss-wrap cvbox"><canvas id="loss" aria-label="总体损失随更新轮次变化"></canvas></div></div><div class="readouts"><div class="readout"><label>已完成更新</label><output id="stepOut" class="big">0</output></div><div class="readout"><label>当前总体损失</label><output id="lossOut" class="big">0.000</output></div></div><div class="param-block min0"><div class="param-title"><h2>输出层参数</h2><span class="unit">w₁…w₄, b</span></div><div class="matrix" id="weights" aria-live="polite"></div></div></section>
</div>
<aside class="panel controls min0" aria-label="训练控制"><div class="status-line"><span class="unit">网络状态</span><output id="status" class="status">等待启动</output></div><div class="btns"><button id="toggle" class="btn" type="button">启动训练</button><button id="reset" class="btn" type="button">恢复初始参数</button></div><label class="ctl" for="speed">每秒更新轮数 <output id="speedOut">12</output><input id="speed" type="range" min="2" max="30" step="2" value="12"></label><div class="formula">网络：2 → tanh(4) → sigmoid(1)<br>学习率：0.18　样本数：48<br>训练：全样本梯度下降</div><div class="instruction"><p class="checkpoint" id="checkpoint">先看初始边界，再启动训练。</p><p class="hint">训练几轮后暂停，对照边界、损失曲线和红色参数。</p></div></aside>
</section>
</div>
<script src="assets/base.js"></script>
<script>
(()=>{
Deck.init({index:23,total:25});
const map=document.getElementById('map'),lossCv=document.getElementById('loss'),toggle=document.getElementById('toggle'),reset=document.getElementById('reset'),speed=document.getElementById('speed'),speedOut=document.getElementById('speedOut'),stepOut=document.getElementById('stepOut'),lossOut=document.getElementById('lossOut'),status=document.getElementById('status'),weightsEl=document.getElementById('weights'),checkpoint=document.getElementById('checkpoint');
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim(),C={text:css('--text'),muted:css('--muted'),rule:css('--rule'),surface:css('--surface'),model:css('--model'),gradient:css('--gradient'),observed:css('--observed')};
const data=[],centers=[[-.62,-.58,0],[.62,.58,0],[-.62,.58,1],[.62,-.58,1]];centers.forEach((c,k)=>{for(let i=0;i<12;i++){const a=i*2.399963+k*.51,r=.08+.018*(i%5);data.push({x:c[0]+Math.cos(a)*r,y:c[1]+Math.sin(a)*r,t:c[2]})}});
const initial={W1:[[.42,-.31,.17,.28],[-.22,.36,.33,-.41]],b1:[.05,-.03,.08,-.06],W2:[.24,-.19,.31,.16],b2:.02};let p,steps,history,running=false,last=0,acc=0,lastW=[];const clone=o=>JSON.parse(JSON.stringify(o)),sig=z=>1/(1+Math.exp(-Math.max(-20,Math.min(20,z))));
function forward(x,y){const h=p.b1.map((b,j)=>Math.tanh(x*p.W1[0][j]+y*p.W1[1][j]+b));return{h,y:sig(h.reduce((s,v,j)=>s+v*p.W2[j],p.b2))}}
function calcLoss(){let s=0;data.forEach(d=>{const q=Math.max(1e-7,Math.min(1-1e-7,forward(d.x,d.y).y));s+=-(d.t*Math.log(q)+(1-d.t)*Math.log(1-q))});return s/data.length}
function train(){const g={W1:[[0,0,0,0],[0,0,0,0]],b1:[0,0,0,0],W2:[0,0,0,0],b2:0};data.forEach(d=>{const f=forward(d.x,d.y),dz=f.y-d.t;g.b2+=dz;for(let j=0;j<4;j++){g.W2[j]+=dz*f.h[j];const dh=dz*p.W2[j]*(1-f.h[j]*f.h[j]);g.W1[0][j]+=dh*d.x;g.W1[1][j]+=dh*d.y;g.b1[j]+=dh}});const lr=.18/data.length;for(let j=0;j<4;j++){p.W2[j]-=lr*g.W2[j];p.b1[j]-=lr*g.b1[j];p.W1[0][j]-=lr*g.W1[0][j];p.W1[1][j]-=lr*g.W1[1][j]}p.b2-=lr*g.b2;steps++;history.push(calcLoss());if(history.length>240)history.shift()}
function fit(cv){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));const ctx=cv.getContext('2d');ctx.setTransform(d,0,0,d,0,0);return{ctx,w:r.width,h:r.height}}
function drawMap(){const{ctx,w,h}=fit(map),m={l:48,r:18,t:16,b:40},pw=w-m.l-m.r,ph=h-m.t-m.b,N=40;ctx.clearRect(0,0,w,h);for(let gy=0;gy<N;gy++)for(let gx=0;gx<N;gx++){const x=-1+(gx+.5)*2/N,y=1-(gy+.5)*2/N,q=forward(x,y).y;ctx.fillStyle=q>.5?`rgba(201,79,32,${.08+.34*(q-.5)*2})`:`rgba(36,112,90,${.08+.34*(.5-q)*2})`;ctx.fillRect(m.l+gx*pw/N,m.t+gy*ph/N,pw/N+1,ph/N+1)}ctx.strokeStyle=C.text;ctx.lineWidth=2;ctx.beginPath();for(let gx=0;gx<=100;gx++){const x=-1+2*gx/100;let by=-1,bd=2;for(let iy=0;iy<=100;iy++){const y=-1+2*iy/100,d=Math.abs(forward(x,y).y-.5);if(d<bd){bd=d;by=y}}const X=m.l+(x+1)*pw/2,Y=m.t+(1-by)*ph/2;gx?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}ctx.stroke();data.forEach(d=>{const X=m.l+(d.x+1)*pw/2,Y=m.t+(1-d.y)*ph/2;ctx.beginPath();ctx.arc(X,Y,6,0,Math.PI*2);ctx.fillStyle=d.t?C.gradient:C.observed;ctx.fill();ctx.strokeStyle=C.surface;ctx.lineWidth=2;ctx.stroke()});ctx.strokeStyle=C.rule;ctx.lineWidth=1;ctx.strokeRect(m.l,m.t,pw,ph);ctx.fillStyle=C.muted;ctx.font='13px monospace';ctx.textAlign='center';[-1,0,1].forEach(v=>ctx.fillText(v,m.l+(v+1)*pw/2,h-14));ctx.textAlign='right';[-1,0,1].forEach(v=>ctx.fillText(v,m.l-10,m.t+(1-v)*ph/2+4));ctx.fillStyle=C.text;ctx.font='15px sans-serif';ctx.fillText('输入 x₁',w-18,h-14);ctx.save();ctx.translate(16,m.t+ph/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText('输入 x₂',0,0);ctx.restore()}
function drawLoss(){const{ctx,w,h}=fit(lossCv),m={l:45,r:10,t:10,b:28},pw=w-m.l-m.r,ph=h-m.t-m.b,max=Math.max(.72,...history),min=Math.min(.05,...history);ctx.clearRect(0,0,w,h);ctx.strokeStyle=C.rule;ctx.beginPath();ctx.moveTo(m.l,m.t);ctx.lineTo(m.l,h-m.b);ctx.lineTo(w-m.r,h-m.b);ctx.stroke();ctx.fillStyle=C.muted;ctx.font='13px monospace';ctx.textAlign='right';ctx.fillText(max.toFixed(2),m.l-7,m.t+5);ctx.fillText(min.toFixed(2),m.l-7,h-m.b+4);ctx.textAlign='center';ctx.fillText(String(steps),w-m.r,h-7);ctx.strokeStyle=C.model;ctx.lineWidth=3;ctx.beginPath();history.forEach((v,i)=>{const x=m.l+(history.length===1?0:i/(history.length-1))*pw,y=m.t+(max-v)/(max-min||1)*ph;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
function update(){const l=calcLoss();stepOut.textContent=steps;lossOut.textContent=l.toFixed(3);const vals=[...p.W2,p.b2],labs=['w₁','w₂','w₃','w₄','b'];weightsEl.innerHTML=vals.map((v,i)=>`<span class="weight ${Math.abs(v-lastW[i])>.0005?'changed':''}">${labs[i]} ${v>=0?'+':''}${v.toFixed(3)}</span>`).join('');lastW=vals.slice();if(steps===0)checkpoint.textContent='先看初始边界，再启动训练。';else checkpoint.innerHTML=`已更新 <strong>${steps}</strong> 轮；暂停后数值保持不动，可逐项核对。`;drawMap();drawLoss()}
function resetAll(){running=false;p=clone(initial);steps=0;history=[calcLoss()];lastW=[...p.W2,p.b2];toggle.textContent='启动训练';toggle.setAttribute('aria-pressed','false');status.textContent='等待启动';update()}
toggle.addEventListener('click',()=>{running=!running;toggle.textContent=running?'暂停检查':'继续训练';toggle.setAttribute('aria-pressed',running);status.textContent=running?'正在更新':'已暂停';if(running)last=performance.now();update()});reset.addEventListener('click',resetAll);speed.addEventListener('input',()=>speedOut.textContent=speed.value);
function frame(t){if(running){const interval=1000/Number(speed.value);acc+=Math.min(80,t-last);while(acc>=interval){train();acc-=interval}if(t-last>40)update()}last=t;requestAnimationFrame(frame)}window.addEventListener('resize',update);resetAll();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
