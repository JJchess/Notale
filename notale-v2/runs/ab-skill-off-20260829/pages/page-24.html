<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{background-image:none}.diagnosis{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:20px;flex:1;min-height:0}.diagnosis>header{display:flex;flex-direction:column;gap:8px;max-width:1240px}.lead strong{color:var(--gradient)}.chart-panel{min-height:0;padding:20px 22px 16px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px}.chart-head{display:flex;align-items:center;justify-content:space-between;gap:24px}.chart-head .note{max-width:540px}.triptych{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));min-height:0}.case{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0;padding:0 24px}.case:first-child{padding-left:4px}.case:last-child{padding-right:4px}.case+.case{border-left:1px solid var(--rule)}.case-title{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:4px 2px 8px}.case-title span{color:var(--muted);font-size:var(--fs-label);line-height:1.35;font-weight:600}.plot{min-height:0}.plot svg{width:100%;height:100%;display:block}.axis{stroke:var(--rule);stroke-width:2;fill:none}.train,.valid{stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.train{stroke:var(--gradient)}.valid{stroke:var(--observed)}.guide{stroke:var(--attention);stroke-width:2;stroke-dasharray:8 7}.guide-fill{fill:var(--attention-soft)}.svg-label,.svg-small{font-family:var(--font-sans);font-weight:600}.svg-label{font-size:var(--fs-label);fill:var(--muted)}.svg-small{font-size:var(--fs-tick);fill:var(--attention)}.verdict{border-top:1px solid var(--rule-soft);padding-top:10px;min-height:72px;color:var(--text);font-size:var(--fs-sec);line-height:1.45}.verdict strong{font-weight:700}.diagnostic{display:grid;grid-template-columns:210px minmax(0,1fr);align-items:center;gap:24px;padding:16px 20px;border:2px solid var(--text);border-radius:10px;background:var(--surface)}.diagnostic h2{color:var(--model)}.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.check{display:flex;align-items:flex-start;gap:12px;padding:3px 22px;font-size:var(--fs-sec);line-height:1.45}.check+.check{border-left:1px solid var(--rule)}.check b{flex:0 0 auto;color:var(--model);font-family:var(--font-num);font-size:var(--fs-label)}
</style>
</head>
<body data-page="24" data-total="25">
<div id="stage">
<section class="diagnosis min0">
<header><div class="kicker">训练诊断</div><h1>训练损失下降，模型仍可能没有学会泛化</h1><p class="lead">同时看训练集与验证集：两条曲线的<strong>高度、间距和波动</strong>，分别暴露三类问题。</p></header>
<main class="panel chart-panel min0" aria-labelledby="curve-title">
<div class="chart-head"><div class="legend" id="curve-title" aria-label="曲线图例"><span class="li" style="color:var(--gradient)"><span class="sw line"></span>训练损失</span><span class="li" style="color:var(--observed)"><span class="sw line"></span>验证损失</span></div><p class="note">示意图只表达趋势，不读取纵轴数值。横向均为训练轮次。</p></div>
<div class="triptych min0">
<section class="case min0" aria-labelledby="underfit-title"><div class="case-title"><h2 id="underfit-title">欠拟合</h2><span>都降不下去</span></div><div class="plot min0"><svg viewBox="0 0 430 285" role="img" aria-label="欠拟合时，训练损失和验证损失都停在较高位置"><path class="axis" d="M48 20V244H410"/><text class="svg-label" x="6" y="28">损失</text><text class="svg-label" x="332" y="274">训练轮次</text><path class="train" d="M62 72 C112 84 143 111 181 132 C224 155 276 162 326 165 C358 166 383 166 401 166"/><path class="valid" d="M62 56 C112 72 144 101 184 121 C230 143 278 151 329 153 C359 154 383 154 401 154"/><text class="svg-small" x="252" y="126">较早停滞</text><path class="guide" d="M305 132V190"/></svg></div><p class="verdict"><strong>表现：</strong>训练集也解释不好。增加训练轮次通常只会继续停滞。</p></section>
<section class="case min0" aria-labelledby="overfit-title"><div class="case-title"><h2 id="overfit-title">过拟合</h2><span>验证曲线反弹</span></div><div class="plot min0"><svg viewBox="0 0 430 285" role="img" aria-label="过拟合时，训练损失继续下降，验证损失先降后升"><path class="axis" d="M48 20V244H410"/><text class="svg-label" x="6" y="28">损失</text><text class="svg-label" x="332" y="274">训练轮次</text><path class="guide-fill" d="M246 35H410V244H246Z" opacity=".72"/><path class="train" d="M62 58 C104 82 151 118 193 151 C247 190 318 215 401 226"/><path class="valid" d="M62 48 C106 76 148 113 190 139 C215 154 236 159 253 156 C298 149 336 119 401 76"/><path class="guide" d="M246 32V244"/><text class="svg-small" x="258" y="55">泛化开始变差</text></svg></div><p class="verdict"><strong>表现：</strong>训练损失继续下降，验证损失却上升。两者间距持续扩大。</p></section>
<section class="case min0" aria-labelledby="unstable-title"><div class="case-title"><h2 id="unstable-title">优化不稳定</h2><span>方向频繁反转</span></div><div class="plot min0"><svg viewBox="0 0 430 285" role="img" aria-label="优化不稳定时，训练损失和验证损失大幅波动"><path class="axis" d="M48 20V244H410"/><text class="svg-label" x="6" y="28">损失</text><text class="svg-label" x="332" y="274">训练轮次</text><path class="train" d="M62 74 L92 108 L120 62 L150 142 L179 91 L210 172 L241 118 L271 190 L302 129 L333 201 L366 150 L401 211"/><path class="valid" d="M62 51 L92 86 L120 44 L150 116 L179 72 L210 146 L241 95 L271 166 L302 108 L333 177 L366 125 L401 187"/><text class="svg-small" x="232" y="52">更新幅度过大或噪声高</text></svg></div><p class="verdict"><strong>表现：</strong>单次下降不能说明收敛。连续轮次的波动会遮住总体趋势。</p></section>
</div></main>
<aside class="diagnostic" aria-labelledby="diagnostic-title"><h2 id="diagnostic-title">判断“学得更好”</h2><div class="checks"><div class="check"><b>01</b><span>先看验证损失是否同步下降</span></div><div class="check"><b>02</b><span>再看训练与验证的间距是否扩大</span></div><div class="check"><b>03</b><span>最后看趋势是否稳定，而非只看单点</span></div></div></aside>
</section></div>
<script src="assets/base.js"></script><script>Deck.init({index:24,total:25});</script>
</body></html>
