<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>从计算到更新：神经网络学习的五个问题</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .toc-page{flex:1;min-height:0;display:flex;flex-direction:column;gap:22px;position:relative;z-index:1}
    .toc-head{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;max-width:1240px}
    .toc-head .lead{color:var(--muted);max-width:1180px}
    .journey{flex:1;min-height:0;position:relative;background:var(--surface);border:2px solid var(--rule);border-radius:10px;box-shadow:0 7px 18px rgba(23,33,43,.08);overflow:hidden;padding:34px 38px 28px;display:flex;flex-direction:column}
    .rail{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;align-items:start;padding-top:40px;counter-reset:chapter}
    .rail-svg{position:absolute;left:4.5%;top:30px;width:91%;height:148px;overflow:visible;pointer-events:none}
    .stop{counter-increment:chapter;position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--text)}
    .node{position:relative;z-index:2;width:104px;height:104px;border:3px solid currentColor;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--font-num);font-size:34px;font-weight:600;box-shadow:0 0 0 9px var(--surface)}
    .node::before{content:counter(chapter, decimal-leading-zero)}
    .stop h2{margin-top:25px;font-size:var(--fs-h2);line-height:1.2}
    .stop p{margin-top:9px;max-width:225px;color:var(--muted);font-size:var(--fs-sec);line-height:1.48}
    .stop .verb{margin-top:17px;font-family:var(--font-num);font-size:var(--fs-label);font-weight:600;letter-spacing:.04em}
    .stop.model{color:var(--model)}
    .stop.observed{color:var(--observed)}
    .stop.gradient{color:var(--gradient)}
    .stop p,.stop h2{color:var(--text)}
    .stop:nth-of-type(2),.stop:nth-of-type(4){padding-top:56px}
    .journey-foot{flex:0 0 auto;border-top:1px solid var(--rule-soft);padding-top:22px;display:flex;align-items:center;justify-content:space-between;gap:30px}
    .cycle{display:flex;align-items:center;gap:13px;min-width:0}
    .cycle-mark{width:42px;height:42px;flex:0 0 auto;color:var(--gradient)}
    .cycle strong{font-size:var(--fs-body)}
    .cycle span{display:block;margin-top:3px;color:var(--muted);font-size:var(--fs-label)}
    .legend{justify-content:flex-end;flex:0 0 auto}
    .legend .li{font-weight:600}
    .legend .li.model{color:var(--model)}
    .legend .li.observed{color:var(--observed)}
    .legend .li.gradient{color:var(--gradient)}
    @media (prefers-reduced-motion:no-preference){
      .node{animation:enter .45s ease-out both}
      .stop:nth-of-type(2) .node{animation-delay:.06s}.stop:nth-of-type(3) .node{animation-delay:.12s}.stop:nth-of-type(4) .node{animation-delay:.18s}.stop:nth-of-type(5) .node{animation-delay:.24s}
      @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    }
  </style>
</head>
<body data-page="02" data-total="25">
  <div id="stage">
    <section class="toc-page min0" aria-labelledby="page-title">
      <header class="toc-head">
        <p class="kicker">学习路线</p>
        <h1 id="page-title">从计算到更新：神经网络学习的五个问题</h1>
        <p class="lead">沿着一次训练的信号流，依次看清每一步在算什么、把什么传给下一步。</p>
      </header>

      <main class="journey min0" aria-label="课程的五段学习路线">
        <div class="rail min0">
          <svg class="rail-svg" viewBox="0 0 1320 148" role="img" aria-label="五个主题按顺序相连，训练更新后回到下一次计算">
            <defs>
              <marker id="arrowModel" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#1F5FAE"/></marker>
              <marker id="arrowGrad" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#C94F20"/></marker>
            </defs>
            <path d="M65 52 C150 52 178 108 270 108 S390 52 528 52" fill="none" stroke="#1F5FAE" stroke-width="4" marker-end="url(#arrowModel)"/>
            <path d="M528 52 C650 52 690 108 792 108 S920 52 1055 52 S1175 108 1255 108" fill="none" stroke="#C94F20" stroke-width="4" marker-end="url(#arrowGrad)"/>
          </svg>

          <section class="stop model">
            <div class="node" aria-hidden="true"></div>
            <h2>神经元怎样计算</h2>
            <p>输入、权重与偏置怎样合成一个输出？</p>
            <span class="verb">前向计算</span>
          </section>
          <section class="stop observed">
            <div class="node" aria-hidden="true"></div>
            <h2>误差怎样度量</h2>
            <p>预测和目标之间的差距怎样写成损失？</p>
            <span class="verb">比较目标</span>
          </section>
          <section class="stop gradient">
            <div class="node" aria-hidden="true"></div>
            <h2>梯度怎样指路</h2>
            <p>参数往哪个方向改，损失才会下降？</p>
            <span class="verb">求局部斜率</span>
          </section>
          <section class="stop gradient">
            <div class="node" aria-hidden="true"></div>
            <h2>误差怎样反传</h2>
            <p>后层的误差信号怎样传到前层参数？</p>
            <span class="verb">逐层传回</span>
          </section>
          <section class="stop model">
            <div class="node" aria-hidden="true"></div>
            <h2>训练怎样发生</h2>
            <p>更新参数并重复计算，模型怎样逐轮改变？</p>
            <span class="verb">更新并重复</span>
          </section>
        </div>

        <footer class="journey-foot">
          <div class="cycle">
            <svg class="cycle-mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M37 17A15 15 0 1 0 38 29" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M32 10l7 7-9 2" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div><strong>更新不是终点</strong><span>新参数回到前向计算，下一轮训练从这里继续。</span></div>
          </div>
          <div class="legend" aria-label="颜色图例">
            <span class="li model"><i class="sw line"></i>模型前向计算</span>
            <span class="li observed"><i class="sw line"></i>外部目标</span>
            <span class="li gradient"><i class="sw line"></i>损失与反传</span>
          </div>
        </footer>
      </main>
    </section>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({index:2,total:25});</script>
</body>
</html>
