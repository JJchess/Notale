<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>第一章：一个神经元怎样做预测</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage { gap: 0; }
    .chapter {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }
    .chapter-head {
      flex: 0 0 auto;
      padding-top: 42px;
      max-width: 1260px;
    }
    .chapter-head .kicker { margin-bottom: 16px; }
    .chapter-head h1 {
      max-width: 1180px;
      font-size: 72px;
      line-height: 1.08;
      letter-spacing: -.04em;
    }
    .chapter-head h1 strong { color: var(--model); font-weight: 700; }
    .chapter-head .lead {
      max-width: 1080px;
      margin-top: 24px;
      color: var(--muted);
    }
    .neuron-map {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      padding-top: 28px;
      padding-bottom: 20px;
    }
    .map-frame {
      width: 100%;
      height: 330px;
      position: relative;
      overflow: hidden;
      border-top: 2px solid var(--rule);
      border-bottom: 2px solid var(--rule);
      background: rgba(255,255,255,.64);
    }
    .map-frame svg { width: 100%; height: 100%; display: block; }
    .stage-label {
      font-family: var(--font-sans);
      font-size: 17px;
      font-weight: 650;
      fill: var(--text);
    }
    .math {
      font-family: var(--font-num);
      font-size: 27px;
      font-weight: 600;
      fill: var(--text);
    }
    .math-lg {
      font-family: var(--font-num);
      font-size: 36px;
      font-weight: 600;
      fill: var(--model);
    }
    .minor {
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 500;
      fill: var(--muted);
    }
    .input-mark { fill: var(--observed); }
    .model-stroke { stroke: var(--model); }
    .observed-stroke { stroke: var(--observed); }
    .neutral-stroke { stroke: var(--rule); }
    .formula-strip {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      padding: 7px 15px;
      color: var(--muted);
      font-family: var(--font-num);
      font-size: var(--fs-label);
      line-height: 1.35;
      white-space: nowrap;
      background: var(--surface);
      border: 1px solid var(--rule-soft);
      border-radius: 6px;
    }
  </style>
</head>
<body data-page="03" data-total="25">
  <div id="stage">
    <section class="chapter min0" aria-labelledby="page-title">
      <header class="chapter-head">
        <div class="kicker">第一章 · 从输入到预测</div>
        <h1 id="page-title">一个神经元怎样做出<strong>预测</strong></h1>
        <p class="lead">输入乘上权重，再加偏置；激活函数把合计值变成输出。</p>
      </header>

      <main class="neuron-map min0" aria-label="神经元从输入到输出的计算关系">
        <div class="map-frame">
          <svg viewBox="0 0 1488 330" role="img" aria-labelledby="map-title map-desc">
            <title id="map-title">一个神经元的前向计算</title>
            <desc id="map-desc">输入与权重相乘后汇入加权和，加上偏置，再经过激活函数产生预测输出。</desc>
            <defs>
              <marker id="arrowModel" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
                <path d="M0,0 L10,5 L0,10 Z" fill="#1F5FAE"></path>
              </marker>
            </defs>

            <text x="54" y="48" class="stage-label">输入</text>
            <text x="383" y="48" class="stage-label">权重决定影响大小</text>
            <text x="752" y="48" class="stage-label">加权和 + 偏置</text>
            <text x="1051" y="48" class="stage-label">激活函数</text>
            <text x="1360" y="48" class="stage-label">输出</text>

            <circle cx="82" cy="105" r="10" class="input-mark"></circle>
            <circle cx="82" cy="165" r="10" class="input-mark"></circle>
            <circle cx="82" cy="225" r="10" class="input-mark"></circle>
            <text x="112" y="114" class="math">x₁</text>
            <text x="112" y="174" class="math">x₂</text>
            <text x="112" y="234" class="math">xₙ</text>
            <text x="77" y="199" class="minor">⋮</text>

            <line x1="153" y1="105" x2="638" y2="155" class="observed-stroke" stroke-width="3"></line>
            <line x1="153" y1="165" x2="638" y2="165" class="observed-stroke" stroke-width="3"></line>
            <line x1="153" y1="225" x2="638" y2="175" class="observed-stroke" stroke-width="3"></line>
            <text x="356" y="111" class="math">× w₁</text>
            <text x="356" y="158" class="math">× w₂</text>
            <text x="356" y="219" class="math">× wₙ</text>

            <circle cx="718" cy="165" r="72" fill="#FFFFFF" stroke="#1F5FAE" stroke-width="3"></circle>
            <text x="718" y="174" text-anchor="middle" class="math-lg">Σ + b</text>
            <text x="718" y="271" text-anchor="middle" class="minor">偏置 b 调整整体门槛</text>

            <line x1="791" y1="165" x2="998" y2="165" class="model-stroke" stroke-width="4" marker-end="url(#arrowModel)"></line>
            <rect x="1015" y="105" width="172" height="120" rx="60" fill="#E4EEF9" stroke="#1F5FAE" stroke-width="3"></rect>
            <text x="1101" y="176" text-anchor="middle" class="math-lg">φ(z)</text>

            <line x1="1188" y1="165" x2="1340" y2="165" class="model-stroke" stroke-width="4" marker-end="url(#arrowModel)"></line>
            <circle cx="1394" cy="165" r="43" fill="#FFFFFF" stroke="#1F5FAE" stroke-width="4"></circle>
            <text x="1394" y="176" text-anchor="middle" class="math-lg">ŷ</text>
          </svg>
          <div class="formula-strip" aria-hidden="true">z = Σ wᵢxᵢ + b　·　ŷ = φ(z)</div>
        </div>
      </main>
    </section>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({ index: 3, total: 25 });</script>
</body>
</html>
