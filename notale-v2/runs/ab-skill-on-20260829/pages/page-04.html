<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .neuron-page{flex:1;min-height:0;display:flex;flex-direction:column;gap:22px;position:relative;z-index:1}
  .neuron-page>header{flex:0 0 auto;display:flex;flex-direction:column;gap:7px;max-width:1220px}
  .neuron-page .lead{color:var(--muted)}
  .process-panel{flex:1;min-height:0;display:flex;flex-direction:column;padding:24px 30px 22px}
  .process-head{display:flex;align-items:flex-start;justify-content:space-between;gap:28px;padding-bottom:16px;border-bottom:1px solid var(--rule-soft)}
  .process-head h2{max-width:880px}
  .math-note{flex:0 0 auto;max-width:390px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45;text-align:right}
  .math-note strong{color:var(--text);font-weight:700}
  .diagram-wrap{flex:1;min-height:0;display:flex;align-items:stretch;padding-top:10px}
  .diagram-wrap svg{display:block;width:100%;height:100%;min-height:440px}
  .stage-label{font-family:var(--font-sans);font-size:17px;font-weight:700;letter-spacing:.03em}
  .main-label{font-family:var(--font-sans);font-size:22px;font-weight:700;fill:var(--text)}
  .sub-label{font-family:var(--font-sans);font-size:16px;fill:var(--muted)}
  .math{font-family:var(--font-num);font-size:21px;font-weight:600;fill:var(--text)}
  .math-small{font-family:var(--font-num);font-size:17px;font-weight:600}
  .input-name{font-family:var(--font-num);font-size:21px;font-weight:600;fill:var(--observed)}
  .step-num{font-family:var(--font-num);font-size:16px;font-weight:600}
  .conclusion{fill:var(--text);font-family:var(--font-sans);font-size:18px;font-weight:600}
  .footline{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:18px;padding-top:17px;border-top:1px solid var(--rule-soft)}
  .footline .formula{font-family:var(--font-num);font-size:24px;font-weight:600;color:var(--model)}
  .footline .plain{font-size:var(--fs-sec);color:var(--muted)}
</style>
</head>
<body data-page="04" data-total="25">
<div id="stage">
  <section class="neuron-page">
    <header>
      <div class="kicker">单个神经元 · 两步计算</div>
      <h1>神经元先加权汇总，再决定输出</h1>
      <p class="lead">它是一个数学计算单元，不是缩小版的生物神经元。</p>
    </header>

    <main class="panel process-panel min0" aria-labelledby="process-title">
      <div class="process-head">
        <h2 id="process-title">三路输入沿同一条计算链，最后得到一个输出</h2>
        <p class="math-note"><strong>权重 w</strong> 决定每路输入的影响；<strong>偏置 b</strong> 调整总和的基准。</p>
      </div>

      <div class="diagram-wrap min0">
        <svg viewBox="0 0 1420 490" role="img" aria-labelledby="diagram-title diagram-desc">
          <title id="diagram-title">单个神经元的两步计算</title>
          <desc id="diagram-desc">输入 x1、x2、x3 分别乘权重 w1、w2、w3，与偏置 b 相加得到 z；z 再进入激活函数 f，得到输出 y。</desc>
          <defs>
            <marker id="arrowModel" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L10,5.5 L0,11 Z" fill="var(--model)"/>
            </marker>
            <marker id="arrowObserved" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L10,5.5 L0,11 Z" fill="var(--observed)"/>
            </marker>
          </defs>

          <text x="70" y="40" class="stage-label" fill="var(--observed)">外部给定的输入</text>
          <text x="492" y="40" class="stage-label" fill="var(--model)">加权汇总</text>
          <text x="946" y="40" class="stage-label" fill="var(--gradient)">激活函数</text>
          <text x="1280" y="40" class="stage-label" fill="var(--model)">输出</text>

          <line x1="201" y1="42" x2="430" y2="42" stroke="var(--rule)" stroke-width="2"/>
          <line x1="597" y1="42" x2="878" y2="42" stroke="var(--rule)" stroke-width="2"/>
          <line x1="1058" y1="42" x2="1224" y2="42" stroke="var(--rule)" stroke-width="2"/>

          <g>
            <circle cx="106" cy="122" r="37" fill="var(--observed-soft)" stroke="var(--observed)" stroke-width="3"/>
            <text x="106" y="130" text-anchor="middle" class="input-name">x₁</text>
            <circle cx="106" cy="232" r="37" fill="var(--observed-soft)" stroke="var(--observed)" stroke-width="3"/>
            <text x="106" y="240" text-anchor="middle" class="input-name">x₂</text>
            <circle cx="106" cy="342" r="37" fill="var(--observed-soft)" stroke="var(--observed)" stroke-width="3"/>
            <text x="106" y="350" text-anchor="middle" class="input-name">x₃</text>
          </g>

          <g fill="none" stroke="var(--observed)" stroke-width="3" marker-end="url(#arrowObserved)">
            <path d="M145 122 C250 122, 330 151, 456 190"/>
            <path d="M145 232 L450 232"/>
            <path d="M145 342 C250 342, 330 313, 456 274"/>
          </g>
          <g class="math-small" fill="var(--model)">
            <text x="255" y="120">× w₁</text>
            <text x="255" y="220">× w₂</text>
            <text x="255" y="340">× w₃</text>
          </g>

          <g>
            <circle cx="544" cy="232" r="93" fill="var(--model-soft)" stroke="var(--model)" stroke-width="4"/>
            <text x="544" y="205" text-anchor="middle" class="main-label">求和</text>
            <text x="544" y="244" text-anchor="middle" class="math">Σ wᵢxᵢ + b</text>
            <text x="544" y="275" text-anchor="middle" class="sub-label">得到中间量 z</text>
          </g>
          <path d="M180 411 H514 Q544 411 544 381 V332" fill="none" stroke="var(--rule)" stroke-width="2" stroke-dasharray="7 7"/>
          <text x="180" y="404" class="math-small" fill="var(--muted)">偏置 b</text>

          <line x1="638" y1="232" x2="861" y2="232" stroke="var(--model)" stroke-width="4" marker-end="url(#arrowModel)"/>
          <text x="750" y="207" text-anchor="middle" class="math" fill="var(--model)">z</text>
          <text x="750" y="270" text-anchor="middle" class="sub-label">汇总结果继续向前</text>

          <g>
            <path d="M885 150 Q885 126 909 126 H1044 Q1068 126 1068 150 V314 Q1068 338 1044 338 H909 Q885 338 885 314 Z" fill="var(--gradient-soft)" stroke="var(--gradient)" stroke-width="4"/>
            <path d="M921 279 C945 279, 946 185, 975 185 C1003 185, 1004 153, 1032 153" fill="none" stroke="var(--gradient)" stroke-width="4"/>
            <text x="976" y="377" text-anchor="middle" class="math" fill="var(--gradient)">f(z)</text>
            <text x="976" y="408" text-anchor="middle" class="sub-label">把 z 变成可用的输出</text>
          </g>

          <line x1="1069" y1="232" x2="1237" y2="232" stroke="var(--model)" stroke-width="4" marker-end="url(#arrowModel)"/>
          <g>
            <circle cx="1301" cy="232" r="57" fill="var(--surface)" stroke="var(--model)" stroke-width="4"/>
            <text x="1301" y="243" text-anchor="middle" class="math" fill="var(--model)">y</text>
            <text x="1301" y="321" text-anchor="middle" class="sub-label">一个数值</text>
          </g>

          <g>
            <circle cx="475" cy="100" r="18" fill="var(--attention)"/>
            <text x="475" y="106" text-anchor="middle" class="step-num" fill="var(--text)">1</text>
            <circle cx="907" cy="100" r="18" fill="var(--attention)"/>
            <text x="907" y="106" text-anchor="middle" class="step-num" fill="var(--text)">2</text>
          </g>

          <path d="M445 452 H1072" stroke="var(--rule)" stroke-width="1"/>
          <text x="758" y="480" text-anchor="middle" class="conclusion">一个神经元 = 一次加权汇总 + 一次激活</text>
        </svg>
      </div>

      <div class="footline">
        <span class="formula">y = f(w₁x₁ + w₂x₂ + w₃x₃ + b)</span>
        <span class="plain">同一条公式，把两步计算连在一起。</span>
      </div>
    </main>
  </section>
</div>
<script src="assets/base.js"></script>
<script>Deck.init({index:4,total:25});</script>
</body>
</html>
