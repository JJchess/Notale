<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>权重决定每项输入的影响</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:22px}
    .page-head{display:flex;flex-direction:column;gap:8px;flex:0 0 auto;max-width:1220px;position:relative;z-index:1}
    .page-head .lead{color:var(--muted);max-width:1080px}
    #weight-lab{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(390px,.72fr);gap:28px;position:relative;z-index:1}
    #weight-lab .model-stage{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--rule);border-radius:10px;box-shadow:0 7px 18px rgba(23,33,43,.08);overflow:hidden}
    #weight-lab .stage-top{display:grid;grid-template-columns:92px 200px minmax(0,1fr);align-items:end;gap:22px;padding:18px 28px 12px;border-bottom:1px solid var(--rule-soft);color:var(--muted);font-size:var(--fs-label);font-weight:600}
    #weight-lab .stage-top span:last-child{display:flex;justify-content:space-between}
    #weight-lab .lanes{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:8px 28px 4px}
    #weight-lab .lane{display:grid;grid-template-columns:92px 200px minmax(0,1fr);align-items:center;gap:22px;min-height:132px;border-bottom:1px solid var(--rule-soft)}
    #weight-lab .lane:last-child{border-bottom:0}
    #weight-lab .input-read{display:flex;flex-direction:column;gap:4px}
    #weight-lab .input-read .num{font-size:30px;color:var(--observed)}
    #weight-lab .input-read .unit{font-family:var(--font-sans)}
    #weight-lab .weight-control{display:grid;grid-template-columns:1fr 58px;gap:8px 10px;align-items:center}
    #weight-lab .weight-control label{grid-column:1 / -1;color:var(--model);font-size:var(--fs-label);font-weight:650}
    #weight-lab .weight-control output{text-align:right;color:var(--model);font-family:var(--font-num);font-weight:600}
    #weight-lab .contribution{display:grid;grid-template-columns:minmax(0,1fr) 74px;gap:14px;align-items:center}
    #weight-lab .bar-field{position:relative;height:58px;background:linear-gradient(90deg,transparent calc(50% - 1px),var(--rule) calc(50% - 1px),var(--rule) calc(50% + 1px),transparent calc(50% + 1px))}
    #weight-lab .bar-field::before,#weight-lab .bar-field::after{position:absolute;top:20px;color:var(--muted);font-family:var(--font-num);font-size:var(--fs-tick)}
    #weight-lab .bar-field::before{content:'−4';left:0}
    #weight-lab .bar-field::after{content:'+4';right:0}
    #weight-lab .bar{position:absolute;top:9px;height:30px;border:2px solid var(--model);background:var(--model-soft);transition:width .12s ease,left .12s ease}
    #weight-lab .bar.negative{border-color:var(--gradient);background:var(--gradient-soft)}
    #weight-lab .contrib-value{text-align:right;font-family:var(--font-num);font-weight:600;font-size:22px;color:var(--model)}
    #weight-lab .contrib-value.negative{color:var(--gradient)}
    #weight-lab .formula-strip{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:10px;min-height:66px;padding:10px 24px;background:var(--bg);border-top:2px solid var(--rule);font-family:var(--font-num);font-size:var(--fs-sec)}
    #weight-lab .term{font-weight:600}
    #weight-lab .op{color:var(--muted)}
    #weight-lab .summary{min-width:0;min-height:0;display:flex;flex-direction:column;gap:18px}
    #weight-lab .sum-block{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--surface);border:2px solid var(--rule);border-radius:10px;box-shadow:0 7px 18px rgba(23,33,43,.08);padding:28px}
    #weight-lab .sum-block::before{content:'';position:absolute;left:-30px;top:50%;width:28px;border-top:3px solid var(--model)}
    #weight-lab .sum-block::after{content:'';position:absolute;left:-9px;top:calc(50% - 6px);width:10px;height:10px;border-top:3px solid var(--model);border-right:3px solid var(--model);transform:rotate(45deg)}
    #weight-lab .sum-label{color:var(--muted);font-size:var(--fs-label);font-weight:650;letter-spacing:.04em}
    #weight-lab .sum-eq{margin-top:12px;font-family:var(--font-num);font-size:var(--fs-sec);color:var(--muted)}
    #weight-lab #sum-value{margin-top:18px}
    #weight-lab .reading{margin-top:24px;min-height:58px;max-width:330px;font-size:var(--fs-sec);line-height:1.5;font-weight:500}
    #weight-lab .reading strong{color:var(--model)}
    #weight-lab .controls-foot{display:flex;flex-direction:column;gap:12px;padding:18px 20px;border:2px solid var(--rule);border-radius:10px;background:transparent}
    #weight-lab .controls-foot .btns{display:grid;grid-template-columns:1fr 1fr}
    #weight-lab .controls-foot .hint{min-height:44px}
    @media (prefers-reduced-motion:reduce){#weight-lab .bar{transition:none}}
  </style>
</head>
<body data-page="05" data-total="25">
  <div id="stage">
    <header class="page-head">
      <div class="kicker">一个神经元 · 加权求和</div>
      <h1>权重决定每项输入能影响多少</h1>
      <p class="lead">输入保持不变。拖动任一权重，比较它的贡献 <span class="num">x × w</span> 与最终加权和。</p>
    </header>

    <main id="weight-lab" class="min0" aria-label="加权和实验">
      <section class="model-stage min0" aria-label="三个输入及其贡献">
        <div class="stage-top" aria-hidden="true">
          <span>固定输入 x</span>
          <span>调节权重 w</span>
          <span><b>贡献 x × w</b><b>负 ← 0 → 正</b></span>
        </div>
        <div class="lanes">
          <div class="lane" data-row="0">
            <div class="input-read"><span class="num">2.0</span><span class="unit">输入 1</span></div>
            <div class="weight-control">
              <label for="weight-0">输入 1 的权重</label>
              <input id="weight-0" type="range" min="-2" max="2" step="0.1" value="0.7">
              <output for="weight-0">+0.7</output>
            </div>
            <div class="contribution">
              <div class="bar-field" aria-hidden="true"><div class="bar"></div></div>
              <output class="contrib-value">+1.40</output>
            </div>
          </div>
          <div class="lane" data-row="1">
            <div class="input-read"><span class="num">−1.0</span><span class="unit">输入 2</span></div>
            <div class="weight-control">
              <label for="weight-1">输入 2 的权重</label>
              <input id="weight-1" type="range" min="-2" max="2" step="0.1" value="0.4">
              <output for="weight-1">+0.4</output>
            </div>
            <div class="contribution">
              <div class="bar-field" aria-hidden="true"><div class="bar negative"></div></div>
              <output class="contrib-value negative">−0.40</output>
            </div>
          </div>
          <div class="lane" data-row="2">
            <div class="input-read"><span class="num">0.5</span><span class="unit">输入 3</span></div>
            <div class="weight-control">
              <label for="weight-2">输入 3 的权重</label>
              <input id="weight-2" type="range" min="-2" max="2" step="0.1" value="-0.6">
              <output for="weight-2">−0.6</output>
            </div>
            <div class="contribution">
              <div class="bar-field" aria-hidden="true"><div class="bar negative"></div></div>
              <output class="contrib-value negative">−0.30</output>
            </div>
          </div>
        </div>
        <div class="formula-strip" aria-label="当前加权和展开式">
          <span class="term">2.0 × 0.7</span><span class="op">+</span>
          <span class="term">−1.0 × 0.4</span><span class="op">+</span>
          <span class="term">0.5 × −0.6</span>
        </div>
      </section>

      <aside class="summary min0">
        <section class="sum-block" aria-labelledby="sum-heading">
          <div id="sum-heading" class="sum-label">加权和 z = Σ(x × w)</div>
          <div class="sum-eq" id="sum-eq">+1.40 − 0.40 − 0.30</div>
          <output id="sum-value" class="big lg" aria-live="polite">0.70</output>
          <p id="reading" class="reading">输入 1 当前贡献最大，<strong>加权和更在意它</strong>。</p>
        </section>
        <section class="controls-foot" aria-label="实验快捷操作">
          <div class="btns">
            <button type="button" class="btn" id="solo">只保留输入 1</button>
            <button type="button" class="btn" id="reset">恢复初始权重</button>
          </div>
          <p class="hint">试着把某个权重调到 0：该输入仍存在，但贡献归零。</p>
        </section>
      </aside>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      const root = document.getElementById('weight-lab');
      const inputs = [2, -1, 0.5];
      const initial = [0.7, 0.4, -0.6];
      let state = { weights: initial.slice() };
      let destroyed = false;
      const lanes = [...root.querySelectorAll('.lane')];
      const ranges = lanes.map(lane => lane.querySelector('input[type="range"]'));
      const fmtSigned = (v, d) => `${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v).toFixed(d)}`;
      const fmtFactor = v => `${v < 0 ? '−' : ''}${Math.abs(v).toFixed(1)}`;

      function interpretation(contribs) {
        const abs = contribs.map(Math.abs);
        const max = Math.max(...abs);
        if (max < 0.005) return '三个贡献都为 0，加权和暂时不在意任何输入。';
        const winners = abs.map((v, i) => Math.abs(v - max) < 0.005 ? i + 1 : 0).filter(Boolean);
        if (winners.length > 1) return `输入 ${winners.join('、')} 的贡献并列最大。`;
        return `输入 ${winners[0]} 当前贡献最大，<strong>加权和更在意它</strong>。`;
      }

      function render(announce = false) {
        if (destroyed) return;
        const contribs = inputs.map((x, i) => x * state.weights[i]);
        const sum = contribs.reduce((a, b) => a + b, 0);
        lanes.forEach((lane, i) => {
          const w = state.weights[i];
          const c = contribs[i];
          ranges[i].value = w;
          lane.querySelector('.weight-control output').textContent = fmtSigned(w, 1);
          const bar = lane.querySelector('.bar');
          const width = Math.min(50, Math.abs(c) / 4 * 50);
          bar.style.width = `${width}%`;
          bar.style.left = c >= 0 ? '50%' : `${50 - width}%`;
          bar.classList.toggle('negative', c < 0);
          const out = lane.querySelector('.contrib-value');
          out.textContent = fmtSigned(c, 2);
          out.classList.toggle('negative', c < 0);
          lane.querySelector('.term');
        });
        root.querySelectorAll('.formula-strip .term').forEach((term, i) => {
          term.textContent = `${fmtFactor(inputs[i])} × ${fmtFactor(state.weights[i])}`;
        });
        root.querySelector('#sum-eq').textContent = contribs.map((v, i) => i === 0 ? fmtSigned(v, 2) : `${v >= 0 ? '+' : '−'} ${Math.abs(v).toFixed(2)}`).join(' ');
        root.querySelector('#sum-value').textContent = (Math.abs(sum) < 0.005 ? 0 : sum).toFixed(2);
        root.querySelector('#reading').innerHTML = interpretation(contribs);
      }

      function setWeights(values, announce = true) {
        state = { weights: values.map(v => Math.max(-2, Math.min(2, Number(v)))) };
        render(announce);
      }

      const controller = new AbortController();
      ranges.forEach((range, i) => {
        range.addEventListener('input', () => {
          const next = state.weights.slice();
          next[i] = Number(range.value);
          setWeights(next, false);
        }, { signal: controller.signal });
        range.addEventListener('change', () => render(true), { signal: controller.signal });
      });
      root.querySelector('#solo').addEventListener('click', () => setWeights([1, 0, 0]), { signal: controller.signal });
      root.querySelector('#reset').addEventListener('click', () => setWeights(initial), { signal: controller.signal });

      function destroy() {
        if (destroyed) return;
        destroyed = true;
        controller.abort();
      }
      root.weightLab = { setWeights, reset: () => setWeights(initial), destroy };
      render();
      Deck.init({ index: 5, total: 25 });
    })();
  </script>
</body>
</html>
