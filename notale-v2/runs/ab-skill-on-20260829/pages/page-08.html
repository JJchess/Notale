<div id="stage">

      <h1 id="page-title">模型怎么知道自己错了？</h1>
      <p class="lead">目标值与预测值之间的差距，要先写成损失，模型才能沿着它调整参数。</p>
    </header>

    <main class="chapter-main min0">
      <div class="relation min0" role="img" aria-label="目标值和预测值在同一尺度上形成差距，损失函数把这段差距转换成可优化的量。">
        <svg viewBox="0 0 1488 520" aria-hidden="true">
          <defs>
            <marker id="arrow-gradient" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L12,6 L0,12 Z" fill="#C94F20"></path>
            </marker>
          </defs>

          <text x="52" y="78" class="svg-small">同一把尺度</text>
          <line x1="52" y1="240" x2="780" y2="240" stroke="#AAB4BE" stroke-width="3"></line>
          <line x1="180" y1="224" x2="180" y2="256" stroke="#AAB4BE" stroke-width="2"></line>
          <line x1="650" y1="224" x2="650" y2="256" stroke="#AAB4BE" stroke-width="2"></line>

          <circle cx="180" cy="240" r="18" fill="#24705A"></circle>
          <circle cx="650" cy="240" r="18" fill="#1F5FAE"></circle>
          <text x="180" y="195" text-anchor="middle" class="svg-label" fill="#24705A">目标值 y</text>

          <text x="650" y="195" text-anchor="middle" class="svg-label" fill="#1F5FAE">预测值 ŷ</text>
          <text x="650" y="286" text-anchor="middle" class="svg-small">模型当前的输出</text>

          <line x1="204" y1="142" x2="626" y2="142" stroke="#C94F20" stroke-width="4"></line>

          <line x1="626" y1="130" x2="626" y2="154" stroke="#C94F20" stroke-width="4"></line>
          <text x="415" y="116" text-anchor="middle" class="svg-label" fill="#C94F20">差得多远</text>

          <path d="M780 240 C850 240, 860 240, 920 240" fill="none" stroke="#C94F20" stroke-width="4" marker-end="url(#arrow-gradient)"></path>

          <rect x="956" y="146" width="260" height="188" rx="10" fill="#FFFFFF" stroke="#C94F20" stroke-width="3"></rect>

          <text x="1086" y="255" text-anchor="middle" class="svg-math" fill="#C94F20">L(ŷ, y)</text>
          <text x="1086" y="298" text-anchor="middle" class="svg-label">把差距变成一个量</text>

          <path d="M1216 240 L1300 240" fill="none" stroke="#C94F20" stroke-width="4" marker-end="url(#arrow-gradient)"></path>
          <text x="1334" y="213" class="svg-big">可优化</text>
          <text x="1334" y="251" class="svg-small">参数调整有了方向</text>

          <line x1="52" y1="404" x2="1436" y2="404" stroke="#D7DEE5" stroke-width="2"></line>
