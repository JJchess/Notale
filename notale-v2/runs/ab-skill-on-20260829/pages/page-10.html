<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #loss-widget{width:100%;height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:18px;}
    #loss-widget .stage-panel{position:relative;min-height:0;padding:18px 22px 14px;background:var(--surface);border:2px solid var(--rule);border-radius:10px;box-shadow:0 7px 18px rgba(23,33,43,.08);}
    #loss-widget .plot{width:100%;height:100%;min-height:0;display:block;touch-action:none;cursor:ew-resize;}
    #loss-widget .plot:focus-visible{outline:4px solid var(--focus);outline-offset:3px;border-radius:6px;}
    #loss-widget .axis{stroke:var(--rule);stroke-width:2;vector-effect:non-scaling-stroke;}
    #loss-widget .guide{stroke:var(--rule-soft);stroke-width:1.5;stroke-dasharray:7 8;vector-effect:non-scaling-stroke;}
    #loss-widget .curve{fill:none;stroke:var(--gradient);stroke-width:5;vector-effect:non-scaling-stroke;}
    #loss-widget .drop{stroke:var(--model);stroke-width:3;stroke-dasharray:7 6;vector-effect:non-scaling-stroke;}
    #loss-widget .target-line{stroke:var(--observed);stroke-width:3;vector-effect:non-scaling-stroke;}
    #loss-widget .point{fill:var(--model);stroke:var(--surface);stroke-width:5;vector-effect:non-scaling-stroke;}
    #loss-widget .handle{fill:var(--attention);stroke:var(--text);stroke-width:3;vector-effect:non-scaling-stroke;cursor:grab;}
    #loss-widget .hit{fill:transparent;cursor:ew-resize;}
    #loss-widget .tick{fill:var(--muted);font:500 15px var(--font-num);}
    #loss-widget .svg-label{fill:var(--text);font:600 17px var(--font-sans);}
    #loss-widget .svg-small{fill:var(--muted);font:500 15px var(--font-sans);}
    #loss-widget .observed-text{fill:var(--observed);font:650 16px var(--font-sans);}
    #loss-widget .loss-text{fill:var(--gradient);font:650 17px var(--font-sans);}
    #loss-widget .rail{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(350px,.9fr);gap:24px;align-items:center;}
    #loss-widget .ctl{gap:5px;}
    #loss-widget .ctl-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;}
    #loss-widget .ctl-head output{font-size:22px;color:var(--model);}
    #loss-widget .presets{display:flex;gap:10px;align-items:center;}
    #loss-widget .readout{display:grid;grid-template-columns:auto auto;column-gap:22px;row-gap:5px;padding-left:24px;border-left:1px solid var(--rule);}
    #loss-widget .formula{grid-column:1/-1;color:var(--muted);font-size:var(--fs-label);}
    #loss-widget .metric{display:flex;align-items:baseline;gap:7px;white-space:nowrap;}
    #loss-widget .metric .num{font-size:28px;}
    #loss-widget .metric.loss .num{color:var(--gradient);}
    #loss-widget .metric.error .num{color:var(--model);}
    #loss-widget .conclusion{position:absolute;right:42px;top:32px;max-width:390px;padding:10px 13px;background:var(--gradient-soft);border:1px solid var(--gradient);border-radius:8px;color:var(--text);font-size:var(--fs-label);line-height:1.45;opacity:0;transform:translateY(-4px);transition:opacity .18s ease,transform .18s ease;pointer-events:none;}
    #loss-widget[data-compared="true"] .conclusion{opacity:1;transform:none;}
    @media (prefers-reduced-motion:reduce){#loss-widget .conclusion{transition:none;}}
  </style>
</head>
<body data-page="10" data-total="25">
  <div id="stage">
    <section class="diagram">
      <header>
        <div class="kicker">损失函数 · 平方误差</div>
        <h1>偏差没有方向偏好，距离却会被平方放大</h1>
        <p class="lead">目标值固定为 <span class="num" style="color:var(--observed)">0</span>。拖动预测值，观察误差如何落到损失曲线上。</p>
      </header>
      <main class="min0">
        <div id="loss-widget" aria-label="平方误差交互实验">
          <div class="stage-panel min0">
            <svg class="plot no-pan" viewBox="0 0 1420 520" role="slider" tabindex="0" aria-label="拖动预测值" aria-valuemin="-3" aria-valuemax="3" aria-valuenow="1.5" aria-valuetext="预测值 1.5，损失 2.25">
              <g aria-hidden="true">
                <line class="guide" x1="100" y1="398" x2="1340" y2="398"/>
                <line class="guide" x1="100" y1="278" x2="1340" y2="278"/>
                <line class="guide" x1="100" y1="158" x2="1340" y2="158"/>
                <line class="axis" x1="100" y1="458" x2="1340" y2="458"/>
                <line class="axis" x1="720" y1="476" x2="720" y2="54"/>
                <line class="target-line" x1="720" y1="476" x2="720" y2="82"/>
                <text class="observed-text" x="736" y="82">目标 y = 0（保持不变）</text>
                <path class="curve" id="loss-curve" d="M100 98 C306.667 338 513.333 458 720 458 C926.667 458 1133.333 338 1340 98"/>
                <text class="loss-text" x="1090" y="124">L = (ŷ − y)²</text>
                <text class="svg-label" x="1350" y="464">预测 ŷ</text>
                <text class="svg-label" x="733" y="43">损失 L</text>
                <g id="x-ticks"></g>
                <g id="y-ticks"></g>
                <line class="drop" id="drop-line" x1="1030" y1="368" x2="1030" y2="458"/>
                <circle class="point" id="curve-point" cx="1030" cy="368" r="10"/>
                <circle class="handle" id="handle" cx="1030" cy="458" r="14"/>
                <circle class="hit" id="hit" cx="1030" cy="458" r="34"/>
                <text class="svg-small" id="error-label" x="875" y="443">偏差 +1.50</text>
              </g>
            </svg>
            <div class="conclusion" id="conclusion">已比较 −2 与 +2：方向相反，损失都为 4。</div>
          </div>
          <div class="rail">
            <label class="ctl" for="prediction">
              <span class="ctl-head"><span>拖动预测值，范围 −3 到 3</span><output id="prediction-out">ŷ = 1.50</output></span>
              <input id="prediction" type="range" min="-3" max="3" step="0.05" value="1.5">
            </label>
            <div class="presets btns" aria-label="对称偏差快捷比较">
              <button class="btn" type="button" data-value="-2">设为 −2</button>
              <button class="btn" type="button" data-value="2">设为 +2</button>
              <button class="btn" type="button" data-reset>复位</button>
            </div>
            <div class="readout" aria-live="off">
              <div class="metric error"><span>有符号误差</span><span class="num" id="error-out">+1.50</span></div>
              <div class="metric loss"><span>损失</span><span class="num" id="loss-out">2.25</span></div>
              <div class="formula" id="formula-out" aria-live="polite">(1.50 − 0)² = 2.25</div>
            </div>
          </div>
        </div>
      </main>
    </section>
  </div>
  <script src="assets/base.js"></script>
  <script>
  (()=>{
    const root=document.getElementById('loss-widget');
    const q=s=>root.querySelector(s);
    const svg=q('.plot'), slider=q('#prediction'), predOut=q('#prediction-out');
    const errorOut=q('#error-out'), lossOut=q('#loss-out'), formulaOut=q('#formula-out');
    const drop=q('#drop-line'), point=q('#curve-point'), handle=q('#handle'), hit=q('#hit');
    const errorLabel=q('#error-label');
    const initial=1.5, X0=100, X1=1340, Y0=458, top=98, maxLoss=9;
    let state={prediction:initial,visitedNeg:false,visitedPos:false,dragId:null};
    const xFor=v=>X0+(v+3)/6*(X1-X0);
    const yForLoss=L=>Y0-(L/maxLoss)*(Y0-top);
    const fmtSigned=v=>(v>=0?'+':'−')+Math.abs(v).toFixed(2);
    function render(announce=false){
      const v=state.prediction, loss=v*v, x=xFor(v), y=yForLoss(loss);
      drop.setAttribute('x1',x);drop.setAttribute('x2',x);drop.setAttribute('y1',y);drop.setAttribute('y2',Y0);
      point.setAttribute('cx',x);point.setAttribute('cy',y);handle.setAttribute('cx',x);hit.setAttribute('cx',x);
      errorLabel.setAttribute('x',v>=0?720+(x-720)/2-52:x+(720-x)/2-52);
      errorLabel.textContent='偏差 '+fmtSigned(v);
      slider.value=v; predOut.textContent='ŷ = '+v.toFixed(2); errorOut.textContent=fmtSigned(v); lossOut.textContent=loss.toFixed(2);
      formulaOut.textContent='('+v.toFixed(2)+' − 0)² = '+loss.toFixed(2);
      svg.setAttribute('aria-valuenow',v.toFixed(2));svg.setAttribute('aria-valuetext','预测值 '+v.toFixed(2)+'，损失 '+loss.toFixed(2));
      root.dataset.compared=String(state.visitedNeg&&state.visitedPos);
    }
    function setValue(v,announce=false){
      v=Math.max(-3,Math.min(3,Math.round(v*20)/20));
      state.prediction=v;
      if(Math.abs(v+2)<.001)state.visitedNeg=true;
      if(Math.abs(v-2)<.001)state.visitedPos=true;
      render(announce);
    }
    function valueFromEvent(e){
      const p=Deck.pt(svg,e); return -3+(p.x-X0)/(X1-X0)*6;
    }
    function down(e){if(e.button!==undefined&&e.button!==0)return;state.dragId=e.pointerId;svg.setPointerCapture(e.pointerId);setValue(valueFromEvent(e));}
    function move(e){if(e.pointerId===state.dragId)setValue(valueFromEvent(e));}
    function end(e){if(e.pointerId!==state.dragId)return;setValue(valueFromEvent(e),true);if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId);state.dragId=null;}
    svg.addEventListener('pointerdown',down);svg.addEventListener('pointermove',move);svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',()=>{state.dragId=null;});
    svg.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();e.stopPropagation();const v=e.key==='Home'?-3:e.key==='End'?3:state.prediction+(e.key==='ArrowLeft'?-.05:.05);setValue(v,true);});
    slider.addEventListener('input',()=>setValue(Number(slider.value)));
    slider.addEventListener('change',()=>setValue(Number(slider.value),true));
    root.querySelectorAll('[data-value]').forEach(b=>b.addEventListener('click',()=>setValue(Number(b.dataset.value),true)));
    q('[data-reset]').addEventListener('click',()=>{state={prediction:initial,visitedNeg:false,visitedPos:false,dragId:null};render(true);});
    const xt=q('#x-ticks'),yt=q('#y-ticks');
    [-3,-2,-1,0,1,2,3].forEach(v=>{const x=xFor(v);xt.insertAdjacentHTML('beforeend','<line class="axis" x1="'+x+'" y1="458" x2="'+x+'" y2="468"/><text class="tick" x="'+x+'" y="493" text-anchor="middle">'+(v<0?'−'+Math.abs(v):v)+'</text>');});
    [0,1.5,4.5,9].forEach(v=>{const y=yForLoss(v);yt.insertAdjacentHTML('beforeend','<line class="axis" x1="710" y1="'+y+'" x2="720" y2="'+y+'"/><text class="tick" x="698" y="'+(y+5)+'" text-anchor="end">'+v+'</text>');});
    render();
    Deck.init({index:10,total:25});
  })();
  </script>
</body>
</html>
