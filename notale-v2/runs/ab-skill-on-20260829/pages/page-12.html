<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>第三章：梯度怎样指路</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      background-image: none;
    }
    .chapter {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }
    .chapter-head {
      flex: 0 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 64px;
      padding-top: 20px;
    }
    .title-block {
      width: 920px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chapter h1 {
      font-size: 78px;
      line-height: 1.06;
      letter-spacing: -.045em;
    }
    .chapter h1 .accent {
      color: var(--gradient);
    }
    .chapter .lead {
      max-width: 890px;
      color: var(--muted);
    }
    .chapter-mark {
      flex: 0 0 245px;
      padding-top: 10px;
      border-top: 2px solid var(--text);
      color: var(--muted);
      font-size: var(--fs-label);
      line-height: 1.45;
      text-align: right;
    }
    .chapter-mark strong {
      display: block;
      margin-bottom: 7px;
      color: var(--text);
      font-family: var(--font-num);
      font-size: var(--fs-h2);
      letter-spacing: .04em;
    }
    .landscape {
      flex: 1;
      min-height: 0;
      margin-top: 18px;
      position: relative;
    }
    .landscape svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
    .formula {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      white-space: nowrap;
      padding: 12px 20px;
      background: var(--surface);
      border: 2px solid var(--rule);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--font-num);
      font-size: var(--fs-lead);
      font-weight: 600;
      box-shadow: 0 7px 18px rgba(23, 33, 43, .08);
    }
    .formula .g { color: var(--gradient); }
    .formula .m { color: var(--model); }
    .formula .a { color: #946400; }
    .svg-label {
      font-family: var(--font-sans);
      font-size: 18px;
      fill: var(--text);
      font-weight: 600;
    }
    .svg-small {
      font-family: var(--font-sans);
      font-size: 15px;
      fill: var(--muted);
      font-weight: 500;
    }
    .svg-math {
      font-family: var(--font-num);
      font-size: 17px;
      font-weight: 600;
    }
  </style>
</head>
<body data-page="12" data-total="25">
  <div id="stage">
    <section class="chapter min0" aria-labelledby="page-title">
      <header class="chapter-head">
        <div class="title-block min0">
          <p class="kicker">CHAPTER 03 · GRADIENT</p>
          <h1 id="page-title"><span class="accent">梯度</span>怎样指路</h1>
          <p class="lead">局部斜率告诉参数该往哪边改；学习率决定这一步走多远。</p>
        </div>
        <div class="chapter-mark" aria-label="本章学习范围">
          <strong>从斜率到更新</strong>
          方向来自梯度<br>步长来自学习率
        </div>
      </header>

      <main class="landscape min0" aria-label="损失曲线上的梯度与参数更新示意图">
        <svg viewBox="0 0 1488 520" role="img" aria-labelledby="diagram-title diagram-desc">
          <title id="diagram-title">梯度在损失曲线上指示参数更新方向</title>
          <desc id="diagram-desc">参数位于损失曲线右坡。该点的局部切线向右上方倾斜，负梯度指向左侧较低损失处，学习率控制移动距离。</desc>
          <defs>
            <marker id="arrow-gradient" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L10,5.5 L0,11 Z" fill="#C94F20"></path>
            </marker>
            <marker id="arrow-model" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L10,5.5 L0,11 Z" fill="#1F5FAE"></path>
            </marker>
          </defs>

          <line x1="84" y1="430" x2="1412" y2="430" stroke="#AAB4BE" stroke-width="2"></line>
          <line x1="84" y1="430" x2="84" y2="54" stroke="#AAB4BE" stroke-width="2"></line>
          <text x="104" y="76" class="svg-small">损失 J(θ)</text>
          <text x="1360" y="462" class="svg-small">参数 θ</text>

          <path d="M110 104 C280 310 412 412 650 414 C866 416 1044 330 1210 112 C1270 42 1330 42 1390 80"
                fill="none" stroke="#17212B" stroke-width="6" stroke-linecap="round"></path>
          <path d="M110 104 C280 310 412 412 650 414 C866 416 1044 330 1210 112"
                fill="none" stroke="#1F5FAE" stroke-width="3" stroke-linecap="round" opacity=".35"></path>

          <line x1="865" y1="436" x2="1228" y2="122" stroke="#C94F20" stroke-width="5" stroke-linecap="round"></line>
          <circle cx="1070" cy="260" r="13" fill="#FFFFFF" stroke="#C94F20" stroke-width="6"></circle>
          <line x1="1070" y1="260" x2="850" y2="350" stroke="#C94F20" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-gradient)"></line>

          <path d="M1060 278 C985 326 910 354 824 374" fill="none" stroke="#1F5FAE" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-model)"></path>
          <circle cx="804" cy="380" r="11" fill="#FFFFFF" stroke="#1F5FAE" stroke-width="5"></circle>

          <line x1="1070" y1="286" x2="1070" y2="430" stroke="#AAB4BE" stroke-width="2" stroke-dasharray="7 7"></line>
          <line x1="804" y1="400" x2="804" y2="430" stroke="#AAB4BE" stroke-width="2" stroke-dasharray="7 7"></line>
          <path d="M820 444 L1054 444" fill="none" stroke="#E3A51A" stroke-width="4" stroke-linecap="round"></path>
          <line x1="820" y1="435" x2="820" y2="453" stroke="#E3A51A" stroke-width="4"></line>
          <line x1="1054" y1="435" x2="1054" y2="453" stroke="#E3A51A" stroke-width="4"></line>

          <g transform="translate(1150 260)">
            <rect x="0" y="0" width="236" height="78" rx="10" fill="#FFFFFF" stroke="#AAB4BE" stroke-width="2"></rect>
            <rect x="18" y="18" width="12" height="12" fill="#C94F20"></rect>
            <text x="42" y="30" class="svg-label">局部斜率给出方向</text>
            <text x="42" y="57" class="svg-small">沿负梯度，损失下降</text>
          </g>

          <g transform="translate(444 298)">
            <rect x="0" y="0" width="270" height="78" rx="10" fill="#FFFFFF" stroke="#AAB4BE" stroke-width="2"></rect>
            <rect x="18" y="18" width="12" height="12" fill="#E3A51A"></rect>
            <text x="42" y="30" class="svg-label">学习率限制移动距离</text>
            <text x="42" y="57" class="svg-small">过小很慢，过大可能越过低点</text>
          </g>

          <text x="1088" y="245" class="svg-math" fill="#C94F20">θ<tspan baseline-shift="sub" font-size="12">t</tspan></text>
          <text x="748" y="372" class="svg-math" fill="#1F5FAE">θ<tspan baseline-shift="sub" font-size="12">t+1</tspan></text>
          <text x="900" y="482" class="svg-math" fill="#946400">η · |∇J|</text>
        </svg>
        <div class="formula" aria-label="参数更新公式">
          <span class="m">θ<sub>new</sub></span> = θ − <span class="a">η</span><span class="g">∇J(θ)</span>
        </div>
      </main>
    </section>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({ index: 12, total: 25 });</script>
</body>
</html>
