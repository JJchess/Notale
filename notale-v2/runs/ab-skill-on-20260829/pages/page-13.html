<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage { background-image: none; }
    .diagram { gap: 18px; }
    .diagram > header { max-width: 1380px; }
    .lead { color: var(--muted); }
    .lesson {
      height: 650px;
      display: flex;
      flex-direction: column;
      padding: 20px 24px 18px;
    }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--rule-soft);
    }
    .equation {
      display: flex;
      align-items: baseline;
      gap: 12px;
      white-space: nowrap;
      font-family: var(--font-num);
      font-size: var(--fs-body);
      font-weight: 600;
    }
    .equation strong { color: var(--gradient); font-size: 27px; }
    .plot {
      flex: 1;
      min-height: 0;
      padding: 8px 0 2px;
    }
    .plot svg { width: 100%; height: 100%; display: block; }
    .plot text { font-family: var(--font-sans); fill: var(--text); }
    .plot .mono { font-family: var(--font-num); }
    .plot .muted { fill: var(--muted); }
    .plot .grad { fill: var(--gradient); }
    .plot .model { fill: var(--model); }
    .plot .obs { fill: var(--observed); }
    .takeaway {
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      align-items: center;
      gap: 24px;
      min-height: 92px;
      padding-top: 12px;
      border-top: 1px solid var(--rule-soft);
    }
    .takeaway .rule { width: 1px; height: 62px; background: var(--rule); }
    .statement { display: flex; align-items: flex-start; gap: 14px; }
    .statement .mark {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      margin-top: 6px;
      border-radius: 50%;
      background: var(--gradient);
    }
    .statement.no .mark {
      border-radius: 0;
      background: transparent;
      border: 2px solid var(--muted);
      transform: rotate(45deg);
    }
    .statement p { font-size: var(--fs-sec); line-height: 1.45; color: var(--muted); }
    .statement strong { display: block; margin-bottom: 2px; font-size: var(--fs-body); color: var(--text); }
  </style>
</head>
<body data-page="13" data-total="25">
  <div id="stage">
    <section class="diagram min0">
      <header>
        <div class="kicker">梯度读法</div>
        <h1>梯度描述当前位置附近，不会直接交出最佳参数</h1>
        <p class="lead">把参数轻推一点，观察损失变化的快慢与方向。</p>
      </header>

      <main class="panel lesson min0" aria-labelledby="figure-title">
        <div class="topline">
          <div class="legend" aria-label="图例">
            <span class="li" style="color:var(--model)"><span class="sw line"></span>当前位置附近的损失</span>
            <span class="li" style="color:var(--gradient)"><span class="sw line"></span>该点的梯度</span>
            <span class="li" style="color:var(--observed)"><span class="sw"></span>试探后的损失</span>
          </div>
          <div class="equation"><span>梯度</span><strong>≈ ΔL / Δw</strong></div>
        </div>

        <figure class="plot min0" style="margin:0">
          <svg viewBox="0 0 1400 450" role="img" aria-labelledby="figure-title figure-desc">
            <title id="figure-title">损失曲线当前位置的梯度</title>
            <desc id="figure-desc">在参数 w0 附近，参数增加时损失上升，切线斜率为正，因此减小损失的局部方向是向左。但视野外曲线未知，梯度不能直接确定最佳参数。</desc>
            <defs>
              <marker id="arrow-grad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--gradient)"/>
              </marker>
              <marker id="arrow-model" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--model)"/>
              </marker>
            </defs>

            <line x1="110" y1="374" x2="1290" y2="374" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-model)"/>
            <line x1="110" y1="374" x2="110" y2="52" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-model)"/>
            <text x="1310" y="381" font-size="17" class="mono">参数 w</text>
            <text x="83" y="42" font-size="17" text-anchor="middle" class="mono">损失 L</text>

            <rect x="116" y="58" width="260" height="300" fill="var(--bg)" opacity=".88"/>
            <rect x="1036" y="58" width="246" height="300" fill="var(--bg)" opacity=".88"/>
            <line x1="376" y1="70" x2="376" y2="358" stroke="var(--rule)" stroke-width="2" stroke-dasharray="8 8"/>
            <line x1="1036" y1="70" x2="1036" y2="358" stroke="var(--rule)" stroke-width="2" stroke-dasharray="8 8"/>
            <text x="246" y="205" font-size="18" text-anchor="middle" class="muted">这里的曲线未知</text>
            <text x="1158" y="205" font-size="18" text-anchor="middle" class="muted">这里的曲线未知</text>

            <path d="M376 326 C500 320 606 293 706 246 C812 196 910 136 1036 83" fill="none" stroke="var(--model)" stroke-width="7" stroke-linecap="round"/>
            <text x="515" y="288" font-size="17" class="model">局部损失曲线</text>

            <line x1="546" y1="338" x2="960" y2="116" stroke="var(--gradient)" stroke-width="4"/>
            <text x="910" y="95" font-size="18" text-anchor="middle" class="grad">切线斜率 &gt; 0</text>

            <line x1="648" y1="270" x2="648" y2="374" stroke="var(--rule)" stroke-width="2" stroke-dasharray="5 7"/>
            <line x1="780" y1="210" x2="780" y2="374" stroke="var(--rule)" stroke-width="2" stroke-dasharray="5 7"/>
            <line x1="908" y1="142" x2="908" y2="374" stroke="var(--rule)" stroke-width="2" stroke-dasharray="5 7"/>

            <circle cx="648" cy="270" r="9" fill="var(--observed)" stroke="var(--surface)" stroke-width="4"/>
            <circle cx="780" cy="210" r="11" fill="var(--gradient)" stroke="var(--surface)" stroke-width="4"/>
            <circle cx="908" cy="142" r="9" fill="var(--observed)" stroke="var(--surface)" stroke-width="4"/>

            <text x="648" y="402" font-size="16" text-anchor="middle" class="mono muted">w₀−Δw</text>
            <text x="780" y="402" font-size="18" text-anchor="middle" class="mono grad">w₀</text>
            <text x="908" y="402" font-size="16" text-anchor="middle" class="mono muted">w₀+Δw</text>

            <line x1="931" y1="207" x2="931" y2="146" stroke="var(--observed)" stroke-width="3" marker-start="url(#arrow-model)" marker-end="url(#arrow-model)"/>
            <text x="951" y="182" font-size="16" class="mono obs">ΔL &gt; 0</text>

            <line x1="770" y1="324" x2="610" y2="324" stroke="var(--gradient)" stroke-width="5" marker-end="url(#arrow-grad)"/>
            <text x="690" y="306" font-size="18" text-anchor="middle" class="grad">让损失下降：向左走</text>

            <path d="M622 76 L622 60 L936 60 L936 76" fill="none" stroke="var(--attention)" stroke-width="3"/>
            <text x="779" y="45" font-size="16" text-anchor="middle" fill="var(--attention)">梯度只概括这一小段</text>
          </svg>
        </figure>

        <div class="takeaway">
          <div class="statement">
            <span class="mark" aria-hidden="true"></span>
            <p><strong>梯度给出的信息</strong>参数稍微改变时，损失变化多快；正负号说明哪个方向会增大损失。</p>
          </div>
          <span class="rule" aria-hidden="true"></span>
          <div class="statement no">
            <span class="mark" aria-hidden="true"></span>
            <p><strong>梯度没有给出的信息</strong>最佳参数 <span class="num">w*</span> 在哪里；还要反复更新参数并重新计算梯度。</p>
          </div>
        </div>
      </main>
    </section>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({ index: 13, total: 25 });</script>
</body>
</html>
