<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学习率决定每一步跨多远</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage { gap: 20px; }
    #stage > header { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 7px; flex: 0 0 auto; }
    #stage > header .lead { max-width: 1200px; color: var(--muted); }
    #lr-lab { flex: 1; min-height: 0; position: relative; z-index: 1; display: grid; grid-template-rows: auto minmax(0,1fr) auto; gap: 14px; }
    #lr-lab .instrument-rail { display: grid; grid-template-columns: minmax(520px,1fr) auto auto; align-items: end; gap: 22px; padding: 15px 20px 13px; background: var(--surface); border: 2px solid var(--rule); border-radius: 10px; box-shadow: 0 7px 18px rgba(23,33,43,.08); }
    #lr-lab .slider-wrap { display: grid; grid-template-columns: 190px minmax(260px,1fr); align-items: center; gap: 18px; }
    #lr-lab .readout { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
    #lr-lab .readout .big { font-size: 42px; }
    #lr-lab .range-box { display: grid; gap: 1px; }
    #lr-lab .ticks { display: flex; justify-content: space-between; color: var(--muted); font-family: var(--font-num); font-size: var(--fs-tick); padding: 0 4px; }
    #lr-lab .presets { display: flex; align-items: center; gap: 8px; }
    #lr-lab .preset { min-width: 88px; }
    #lr-lab .reset { color: var(--muted); border-color: var(--rule); }
    #lr-lab .viz { min-height: 0; display: grid; grid-template-columns: minmax(0,1.5fr) minmax(390px,.74fr); gap: 18px; }
    #lr-lab .plot, #lr-lab .trace { min-width: 0; min-height: 0; position: relative; background: var(--surface); border: 2px solid var(--rule); border-radius: 10px; overflow: hidden; }
    #lr-lab .plot-head, #lr-lab .trace-head { position: absolute; z-index: 2; left: 20px; top: 16px; right: 20px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; pointer-events: none; }
    #lr-lab .plot-head h2, #lr-lab .trace-head h2 { font-size: var(--fs-body); }
    #lr-lab .plot-head span, #lr-lab .trace-head span { color: var(--muted); font-size: var(--fs-label); }
    #lr-lab svg { display: block; width: 100%; height: 100%; }
    #lr-lab .grid-line { stroke: var(--rule-soft); stroke-width: 1; }
    #lr-lab .axis { stroke: var(--rule); stroke-width: 2; }
    #lr-lab .curve { fill: none; stroke: var(--text); stroke-width: 3; }
    #lr-lab .trajectory { fill: none; stroke: var(--model); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    #lr-lab .step-line { stroke: var(--model); stroke-width: 2.5; opacity: .62; }
    #lr-lab .point { fill: var(--surface); stroke: var(--model); stroke-width: 3; }
    #lr-lab .point.start { fill: var(--observed); stroke: var(--observed); }
    #lr-lab .point.end { fill: var(--attention); stroke: var(--text); stroke-width: 2; }
    #lr-lab .target { fill: var(--observed); }
    #lr-lab .offscale { fill: var(--gradient); stroke: var(--surface); stroke-width: 2; }
    #lr-lab .history { fill: none; stroke: var(--model); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    #lr-lab .history-area { fill: var(--model-soft); opacity: .78; }
    #lr-lab .tick-label, #lr-lab .axis-label { fill: var(--muted); font-family: var(--font-num); font-size: 13px; }
    #lr-lab .svg-label { fill: var(--text); font-family: var(--font-sans); font-size: 15px; font-weight: 600; }
    #lr-lab .status-band { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; min-height: 58px; padding: 10px 16px; border-top: 1px solid var(--rule-soft); background: rgba(255,255,255,.72); }
    #lr-lab .state-mark { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; white-space: nowrap; }
    #lr-lab .state-mark::before { content:""; width: 13px; height: 13px; border: 3px solid currentColor; border-radius: 50%; }
    #lr-lab[data-regime="slow"] .state-mark { color: var(--muted); }
    #lr-lab[data-regime="steady"] .state-mark { color: var(--observed); }
    #lr-lab[data-regime="cross"] .state-mark, #lr-lab[data-regime="diverge"] .state-mark { color: var(--gradient); }
    #lr-lab .verdict { font-size: var(--fs-sec); line-height: 1.4; }
    #lr-lab .metric { text-align: right; white-space: nowrap; color: var(--muted); font-size: var(--fs-label); }
    #lr-lab .metric strong { color: var(--text); font-family: var(--font-num); font-size: var(--fs-body); }
    #lr-lab .compare-strip { display: grid; grid-template-columns: 160px repeat(3,minmax(0,1fr)); min-height: 70px; border: 2px solid var(--rule); border-radius: 10px; background: var(--surface); overflow: hidden; }
    #lr-lab .compare-title { display: flex; flex-direction: column; justify-content: center; padding: 10px 15px; border-right: 1px solid var(--rule-soft); }
    #lr-lab .compare-title strong { font-size: var(--fs-label); }
    #lr-lab .compare-title span { color: var(--muted); font-size: var(--fs-tick); }
    #lr-lab .mini { display: grid; grid-template-columns: 104px 1fr; align-items: center; gap: 8px; padding: 9px 14px; border-right: 1px solid var(--rule-soft); }
    #lr-lab .mini:last-child { border-right: 0; }
    #lr-lab .mini-label { font-size: var(--fs-label); line-height: 1.25; }
    #lr-lab .mini-label b { display: block; font-family: var(--font-num); }
    #lr-lab .spark { height: 38px; }
    #lr-lab .spark polyline { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-reduced-motion: reduce) { #lr-lab * { scroll-behavior: auto; } }
  </style>
</head>
<body data-page="15" data-total="25">
  <div id="stage">
    <header>
      <div class="kicker">优化 · 学习率</div>
      <h1>学习率决定每一步跨多远</h1>
      <p class="lead">从同一个起点沿同一条损失曲线下降，只改学习率：步子太小几乎不动，合适时稳定靠近最低点，太大则反复跨过最低点。</p>
    </header>

    <main id="lr-lab" class="min0" data-regime="steady">
      <section class="instrument-rail" aria-label="学习率控制">
        <label class="slider-wrap" for="lr-range">
          <span class="readout"><span>学习率 α</span><output id="lr-output" class="big sm">0.45</output></span>
          <span class="range-box">
            <input id="lr-range" type="range" min="0.02" max="2.30" step="0.01" value="0.45" aria-describedby="lr-status">
            <span class="ticks" aria-hidden="true"><span>0.02</span><span>0.50</span><span>1.00</span><span>1.50</span><span>2.30</span></span>
          </span>
        </label>
        <div class="presets" aria-label="典型学习率">
          <button class="btn preset" type="button" data-value="0.05">过小 0.05</button>
          <button class="btn preset" type="button" data-value="0.45" aria-pressed="true">适中 0.45</button>
          <button class="btn preset" type="button" data-value="2.15">过大 2.15</button>
        </div>
        <button class="btn reset" id="reset" type="button">恢复适中值</button>
      </section>

      <section class="viz min0" aria-label="梯度下降轨迹与损失记录">
        <div class="plot min0">
          <div class="plot-head"><h2>参数在损失曲面上的位置</h2><span>固定起点 w₀ = 4，运行 10 次更新</span></div>
          <svg id="landscape" viewBox="0 0 920 470" role="img" aria-labelledby="land-title land-desc">
            <title id="land-title">当前学习率对应的梯度下降轨迹</title>
            <desc id="land-desc">同一二次损失函数上，从参数四开始迭代十次。调节学习率会改变每一步的跨度。</desc>
            <defs>
              <marker id="lr-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="var(--model)"></path></marker>
            </defs>
            <g id="land-grid"></g>
            <g id="land-model"></g>
          </svg>
        </div>

        <div class="trace min0">
          <div class="trace-head"><h2>每次更新后的损失</h2><span>L = ½w²</span></div>
          <svg id="history" viewBox="0 0 500 470" role="img" aria-labelledby="hist-title hist-desc">
            <title id="hist-title">十次迭代的损失变化</title>
            <desc id="hist-desc">纵轴是损失，横轴是更新次数，坐标范围在所有学习率下保持不变。</desc>
            <g id="hist-grid"></g>
            <g id="hist-model"></g>
          </svg>
        </div>
      </section>

      <section aria-label="结果与典型轨迹">
        <div class="status-band" aria-live="polite" aria-atomic="true">
          <span class="state-mark" id="regime-name">稳定下降</span>
          <span class="verdict" id="lr-status">每一步都缩短与最低点的距离，10 次后已经贴近最低点。</span>
          <span class="metric">第 10 次损失 <strong id="final-loss">0.000</strong></span>
        </div>
        <div class="compare-strip" aria-label="三个固定学习率的参考轨迹">
          <div class="compare-title"><strong>同起点对照</strong><span>纵轴范围相同</span></div>
          <div class="mini"><span class="mini-label">停滞<b>α 0.05</b></span><svg class="spark" data-alpha="0.05" viewBox="0 0 190 42" aria-hidden="true"></svg></div>
          <div class="mini"><span class="mini-label">稳定下降<b>α 0.45</b></span><svg class="spark" data-alpha="0.45" viewBox="0 0 190 42" aria-hidden="true"></svg></div>
          <div class="mini"><span class="mini-label">来回越界<b>α 2.15</b></span><svg class="spark" data-alpha="2.15" viewBox="0 0 190 42" aria-hidden="true"></svg></div>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      const root = document.getElementById('lr-lab');
      const range = root.querySelector('#lr-range');
      const output = root.querySelector('#lr-output');
      const status = root.querySelector('#lr-status');
      const regimeName = root.querySelector('#regime-name');
      const finalLoss = root.querySelector('#final-loss');
      const landGrid = root.querySelector('#land-grid');
      const landModel = root.querySelector('#land-model');
      const histGrid = root.querySelector('#hist-grid');
      const histModel = root.querySelector('#hist-model');
      const presets = [...root.querySelectorAll('.preset')];
      const resetButton = root.querySelector('#reset');
      const NS = 'http://www.w3.org/2000/svg';
      const initial = 0.45;
      let state = { alpha: initial };
      let destroyed = false;

      const el = (name, attrs = {}, text = '') => {
        const node = document.createElementNS(NS, name);
        Object.entries(attrs).forEach(([k,v]) => node.setAttribute(k, v));
        if (text) node.textContent = text;
        return node;
      };
      const loss = w => 0.5 * w * w;
      const run = alpha => {
        const ws = [4];
        for (let i = 0; i < 10; i++) ws.push(ws[ws.length - 1] * (1 - alpha));
        return ws;
      };
      const regime = alpha => alpha < 0.14 ? 'slow' : alpha <= 1 ? 'steady' : alpha < 2 ? 'cross' : 'diverge';
      const setText = (node, value) => { if (node.textContent !== value) node.textContent = value; };

      function drawStatic() {
        const x0=66, x1=888, y0=420, y1=72;
        const X = w => x0 + (w + 6) / 12 * (x1-x0);
        const Y = l => y0 - Math.min(l,20) / 20 * (y0-y1);
        [-6,-4,-2,0,2,4,6].forEach(v => {
          landGrid.append(el('line',{x1:X(v),y1:y1,x2:X(v),y2:y0,class:'grid-line'}));
          landGrid.append(el('text',{x:X(v),y:446,'text-anchor':'middle',class:'tick-label'},String(v)));
        });
        [0,5,10,15,20].forEach(v => {
          landGrid.append(el('line',{x1:x0,y1:Y(v),x2:x1,y2:Y(v),class:'grid-line'}));
          landGrid.append(el('text',{x:52,y:Y(v)+5,'text-anchor':'end',class:'tick-label'},String(v)));
        });
        landGrid.append(el('line',{x1:x0,y1:y0,x2:x1,y2:y0,class:'axis'}));
        landGrid.append(el('line',{x1:X(0),y1:y1,x2:X(0),y2:y0,class:'axis'}));
        landGrid.append(el('text',{x:884,y:447,'text-anchor':'end',class:'axis-label'},'参数 w'));
        landGrid.append(el('text',{x:48,y:84,'text-anchor':'end',class:'axis-label'},'损失'));
        let d=''; for(let i=0;i<=180;i++){const w=-6+i/15; d += `${i?'L':'M'}${X(w).toFixed(1)},${Y(loss(w)).toFixed(1)} `;}
        landGrid.append(el('path',{d,class:'curve'}));
        landGrid.append(el('circle',{cx:X(0),cy:Y(0),r:7,class:'target'}));
        landGrid.append(el('text',{x:X(0)+12,y:Y(0)-12,class:'svg-label'},'最低点 w = 0'));

        const hx0=54,hx1=474,hy0=420,hy1=72;
        [0,2,4,6,8,10].forEach(v=>{const x=hx0+v/10*(hx1-hx0);histGrid.append(el('line',{x1:x,y1:hy1,x2:x,y2:hy0,class:'grid-line'}));histGrid.append(el('text',{x,y:446,'text-anchor':'middle',class:'tick-label'},String(v)));});
        [0,5,10,15,20].forEach(v=>{const y=hy0-v/20*(hy0-hy1);histGrid.append(el('line',{x1:hx0,y1:y,x2:hx1,y2:y,class:'grid-line'}));histGrid.append(el('text',{x:43,y:y+5,'text-anchor':'end',class:'tick-label'},String(v)));});
        histGrid.append(el('line',{x1:hx0,y1:hy0,x2:hx1,y2:hy0,class:'axis'}));
        histGrid.append(el('line',{x1:hx0,y1:hy1,x2:hx0,y2:hy0,class:'axis'}));
        histGrid.append(el('text',{x:474,y:446,'text-anchor':'end',class:'axis-label'},'更新次数'));
        histGrid.append(el('text',{x:44,y:84,'text-anchor':'end',class:'axis-label'},'L'));

        root.querySelectorAll('.spark').forEach(svg => {
          const a=Number(svg.dataset.alpha), ws=run(a); let points='';
          ws.forEach((w,i)=>{const x=3+i/10*184,y=38-Math.min(loss(w),20)/20*34;points+=`${x},${y} `;});
          svg.append(el('line',{x1:2,y1:38,x2:188,y2:38,stroke:'var(--rule-soft)','stroke-width':'1'}));
          svg.append(el('polyline',{points,stroke:a===.45?'var(--observed)':a>2?'var(--gradient)':'var(--muted)'}));
        });
      }

      function render() {
        if (destroyed) return;
        const a=state.alpha, ws=run(a), mode=regime(a);
        root.dataset.regime=mode;
        range.value=a.toFixed(2); setText(output,a.toFixed(2));
        presets.forEach(b=>b.setAttribute('aria-pressed',Math.abs(Number(b.dataset.value)-a)<.005?'true':'false'));
        const names={slow:'几乎停滞',steady:'稳定下降',cross:'反复越界',diverge:'越界并发散'};
        const copy={
          slow:'10 次更新后仍离最低点很远；方向没错，但每一步太短。',
          steady:'每一步都缩短与最低点的距离，10 次后已经贴近最低点。',
          cross:'每一步都会跨过最低点；距离仍在缩短，但轨迹左右摆动。',
          diverge:'每一步都跨过最低点，而且离最低点更远；继续训练会使损失增大。'
        };
        setText(regimeName,names[mode]); setText(status,copy[mode]);
        const lastLoss=loss(ws[ws.length-1]); setText(finalLoss,lastLoss<.001?'< 0.001':lastLoss.toFixed(3));
        landModel.replaceChildren(); histModel.replaceChildren();
        const x0=66,x1=888,y0=420,y1=72,X=w=>x0+(w+6)/12*(x1-x0),Y=l=>y0-Math.min(l,20)/20*(y0-y1);
        for(let i=0;i<ws.length-1;i++){
          const w=ws[i],n=ws[i+1], inside=Math.abs(w)<=6 && loss(w)<=20;
          if(inside){
            const nx=Math.max(-6,Math.min(6,n));
            landModel.append(el('line',{x1:X(w),y1:Y(loss(w)),x2:X(nx),y2:Y(loss(nx)),class:'step-line','marker-end':'url(#lr-arrow)'}));
          }
        }
        ws.forEach((w,i)=>{
          if(Math.abs(w)<=6 && loss(w)<=20) landModel.append(el('circle',{cx:X(w),cy:Y(loss(w)),r:i===0?7:i===ws.length-1?8:5,class:`point ${i===0?'start':''} ${i===ws.length-1?'end':''}`}));
          else if(i>0){ const edge=w>0?6:-6; landModel.append(el('path',{d:w>0?`M${X(edge)-13},${y1+5} L${X(edge)},${y1+5} L${X(edge)},${y1+18} Z`:`M${X(edge)+13},${y1+5} L${X(edge)},${y1+5} L${X(edge)},${y1+18} Z`,class:'offscale'})); }
        });
        landModel.append(el('text',{x:X(4)+10,y:Y(loss(4))-12,class:'svg-label'},'固定起点'));
        if(mode==='diverge') landModel.append(el('text',{x:74,y:104,class:'svg-label',fill:'var(--gradient)'},'轨迹超出共同坐标范围'));

        const hx0=54,hx1=474,hy0=420,hy1=72,HX=i=>hx0+i/10*(hx1-hx0),HY=l=>hy0-Math.min(l,20)/20*(hy0-hy1);
        let points=ws.map((w,i)=>`${HX(i)},${HY(loss(w))}`).join(' ');
        let area=`M${hx0},${hy0} L${points.replaceAll(' ',',')} L${hx1},${hy0} Z`;
        histModel.append(el('path',{d:area,class:'history-area'}));
        histModel.append(el('polyline',{points,class:'history'}));
        ws.forEach((w,i)=>histModel.append(el('circle',{cx:HX(i),cy:HY(loss(w)),r:i===10?6:3,fill:i===10?'var(--attention)':'var(--model)'})));
      }

      function setAlpha(value) { state={alpha:Math.max(.02,Math.min(2.3,Number(value)))}; render(); }
      const onInput=e=>setAlpha(e.target.value);
      const onPreset=e=>setAlpha(e.currentTarget.dataset.value);
      const onReset=()=>setAlpha(initial);
      range.addEventListener('input',onInput);
      range.addEventListener('change',()=>status.setAttribute('aria-label',`${regimeName.textContent}，学习率 ${state.alpha.toFixed(2)}`));
      presets.forEach(b=>b.addEventListener('click',onPreset));
      resetButton.addEventListener('click',onReset);
      function destroy(){if(destroyed)return;destroyed=true;range.removeEventListener('input',onInput);presets.forEach(b=>b.removeEventListener('click',onPreset));resetButton.removeEventListener('click',onReset);}
      window.addEventListener('pagehide',destroy,{once:true});
      drawStatic(); render();
      Deck.init({index:15,total:25});
    })();
  </script>
</body>
</html>
