<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>链式法则：沿路径相乘</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage { gap: 20px; }
    .page-head { flex: 0 0 auto; display: flex; flex-direction: column; gap: 7px; max-width: 1260px; }
    .page-head .lead { color: var(--muted); }
    .chain-board { flex: 1; min-height: 0; position: relative; background: var(--surface); border: 2px solid var(--rule); border-radius: 10px; box-shadow: 0 7px 18px rgba(23,33,43,.08); overflow: hidden; }
    .chain-board svg { width: 100%; height: 100%; display: block; }
    .node { fill: var(--surface); stroke-width: 3; }
    .node.input { stroke: var(--observed); }
    .node.middle, .node.output { stroke: var(--model); }
    .node-title { font: 600 17px var(--font-sans); fill: var(--muted); }
    .node-var { font: 600 42px var(--font-num); fill: var(--text); }
    .node-value { font: 600 25px var(--font-num); }
    .observed-text { fill: var(--observed); }
    .model-text { fill: var(--model); }
    .formula { font: 600 25px var(--font-num); fill: var(--text); }
    .edge { stroke: var(--model); stroke-width: 4; fill: none; }
    .edge-label { font: 600 19px var(--font-sans); fill: var(--model); }
    .slope-box { fill: var(--model-soft); stroke: var(--model); stroke-width: 2; }
    .slope-kicker { font: 600 15px var(--font-sans); fill: var(--muted); }
    .slope-value { font: 600 29px var(--font-num); fill: var(--model); }
    .guide { stroke: var(--rule); stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
    .brace { stroke: var(--gradient); stroke-width: 3; fill: none; }
    .result-band { fill: var(--gradient-soft); stroke: var(--gradient); stroke-width: 2; }
    .result-label { font: 600 17px var(--font-sans); fill: var(--gradient); }
    .result-formula { font: 600 32px var(--font-num); fill: var(--text); }
    .result-value { font: 600 44px var(--font-num); fill: var(--gradient); }
    .caption { font: 500 17px var(--font-sans); fill: var(--muted); }
    .step-no { font: 600 15px var(--font-num); fill: var(--muted); letter-spacing: .06em; }
  </style>
</head>
<body data-page="17" data-total="25">
  <div id="stage">
    <header class="page-head">
      <div class="kicker">链式法则 · 短计算链</div>
      <h1>总影响等于路径上各段局部影响相乘</h1>
      <p class="lead">先沿前向计算得到中间值，再沿同一条路径读取每一段的斜率。</p>
    </header>

    <main class="chain-board min0" aria-labelledby="diagram-title">
      <svg viewBox="0 0 1484 670" role="img" aria-labelledby="diagram-title diagram-desc">
        <title id="diagram-title">从 x 经过 z 到 y 的链式法则计算</title>
        <desc id="diagram-desc">输入 x 等于 2，先乘 3 得到 z 等于 6，再平方得到 y 等于 36。局部影响分别是 dz 除以 dx 等于 3，以及 dy 除以 dz 等于 2z 等于 12。沿路径相乘得到 dy 除以 dx 等于 36。</desc>
        <defs>
          <marker id="arrow-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F5FAE"></path>
          </marker>
        </defs>

        <text x="76" y="54" class="step-no">前向：代入数值</text>

        <rect x="80" y="92" width="250" height="150" rx="10" class="node input"></rect>
        <text x="205" y="126" text-anchor="middle" class="node-title">输入</text>
        <text x="205" y="181" text-anchor="middle" class="node-var">x</text>
        <text x="205" y="218" text-anchor="middle" class="node-value observed-text">= 2</text>

        <path d="M 332 167 H 570" class="edge" marker-end="url(#arrow-model)"></path>
        <text x="451" y="133" text-anchor="middle" class="edge-label">乘 3</text>
        <text x="451" y="202" text-anchor="middle" class="formula">z = 3x</text>

        <rect x="580" y="92" width="250" height="150" rx="10" class="node middle"></rect>
        <text x="705" y="126" text-anchor="middle" class="node-title">中间值</text>
        <text x="705" y="181" text-anchor="middle" class="node-var">z</text>
        <text x="705" y="218" text-anchor="middle" class="node-value model-text">= 6</text>

        <path d="M 832 167 H 1070" class="edge" marker-end="url(#arrow-model)"></path>
        <text x="951" y="133" text-anchor="middle" class="edge-label">平方</text>
        <text x="951" y="202" text-anchor="middle" class="formula">y = z²</text>

        <rect x="1080" y="92" width="250" height="150" rx="10" class="node output"></rect>
        <text x="1205" y="126" text-anchor="middle" class="node-title">输出</text>
        <text x="1205" y="181" text-anchor="middle" class="node-var">y</text>
        <text x="1205" y="218" text-anchor="middle" class="node-value model-text">= 36</text>

        <path d="M 451 222 V 286" class="guide"></path>
        <path d="M 951 222 V 286" class="guide"></path>
        <text x="76" y="318" class="step-no">局部：分别求每一段斜率</text>

        <rect x="284" y="344" width="334" height="112" rx="10" class="slope-box"></rect>
        <text x="451" y="377" text-anchor="middle" class="slope-kicker">x 改变 1 单位时，z 改变多少</text>
        <text x="451" y="426" text-anchor="middle" class="slope-value">dz/dx = 3</text>

        <rect x="784" y="344" width="334" height="112" rx="10" class="slope-box"></rect>
        <text x="951" y="377" text-anchor="middle" class="slope-kicker">z = 6 处，z 改变 1 单位时</text>
        <text x="951" y="426" text-anchor="middle" class="slope-value">dy/dz = 2z = 12</text>

        <path d="M 451 458 V 494 Q 451 514 471 514 H 686" class="brace"></path>
        <path d="M 951 458 V 494 Q 951 514 931 514 H 716" class="brace"></path>
        <circle cx="701" cy="514" r="20" fill="#FFFFFF" stroke="#C94F20" stroke-width="3"></circle>
        <text x="701" y="523" text-anchor="middle" class="result-value" style="font-size:30px">×</text>

        <rect x="304" y="548" width="794" height="88" rx="10" class="result-band"></rect>
        <text x="339" y="581" class="result-label">沿路径相乘</text>
        <text x="701" y="607" text-anchor="middle" class="result-formula">dy/dx = (dy/dz)(dz/dx) = 12 × 3 =</text>
        <text x="1048" y="608" text-anchor="end" class="result-value">36</text>
        <text x="1130" y="581" class="caption">两段局部影响共同决定 x 对 y 的总影响</text>
      </svg>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({ index: 17, total: 25 });</script>
</body>
</html>
