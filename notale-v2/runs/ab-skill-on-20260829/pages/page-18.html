<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #chain-lab { flex:1; min-height:0; display:grid; grid-template-rows:auto minmax(0,1fr); gap:18px; }
    #chain-lab .intro { display:flex; flex-direction:column; gap:7px; max-width:1320px; }
    #chain-lab .lead { color:var(--muted); }
    #chain-lab .lab { min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:24px; }
    #chain-lab .stage-panel { min-width:0; min-height:0; padding:18px 24px 20px; display:grid; grid-template-rows:minmax(0,1fr) auto; gap:12px; }
    #chain-lab .diagram-wrap { min-width:0; min-height:0; position:relative; }
    #chain-lab svg { width:100%; height:100%; display:block; }
    #chain-lab .node { fill:var(--surface); stroke:var(--text); stroke-width:2.5; }
    #chain-lab .node.loss { stroke:var(--gradient); }
    #chain-lab .node-param { fill:var(--model-soft); stroke:var(--model); }
    #chain-lab .forward { stroke:var(--model); stroke-width:3; fill:none; opacity:.58; }
    #chain-lab .back-base { stroke:var(--rule-soft); stroke-width:14; fill:none; stroke-linecap:round; }
    #chain-lab .back-signal { stroke:var(--gradient); fill:none; stroke-linecap:round; transition:stroke-width .18s ease, opacity .18s ease; }
    #chain-lab .back-signal.cut { stroke-dasharray:7 7; }
    #chain-lab .svg-label { fill:var(--text); font-family:var(--font-sans); font-size:20px; font-weight:650; text-anchor:middle; }
    #chain-lab .svg-sub { fill:var(--muted); font-family:var(--font-sans); font-size:15px; text-anchor:middle; }
    #chain-lab .svg-grad { fill:var(--gradient); font-family:var(--font-num); font-size:18px; font-weight:600; text-anchor:middle; }
    #chain-lab .signal-title { fill:var(--gradient); font-family:var(--font-sans); font-size:15px; font-weight:650; }
    #chain-lab .fwd-title { fill:var(--model); font-family:var(--font-sans); font-size:15px; font-weight:650; }
    #chain-lab .controls-row { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    #chain-lab .deriv { border-top:1px solid var(--rule-soft); padding-top:11px; display:grid; gap:5px; }
    #chain-lab .deriv-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-size:var(--fs-label); font-weight:650; }
    #chain-lab .deriv output { color:var(--gradient); font-family:var(--font-num); font-size:var(--fs-sec); }
    #chain-lab .scale { display:flex; justify-content:space-between; color:var(--muted); font-family:var(--font-num); font-size:var(--fs-tick); }
    #chain-lab .rail { min-width:0; min-height:0; display:flex; flex-direction:column; gap:16px; }
    #chain-lab .readout { padding:20px; display:grid; gap:10px; }
    #chain-lab .readout h2 { font-size:var(--fs-body); }
    #chain-lab .formula { display:flex; align-items:baseline; flex-wrap:wrap; gap:7px; font-family:var(--font-num); font-size:var(--fs-sec); color:var(--muted); }
    #chain-lab .formula strong { color:var(--gradient); font-size:24px; }
    #chain-lab .magnitude { height:16px; border:1px solid var(--rule); border-radius:4px; overflow:hidden; background:var(--bg); }
    #chain-lab .magnitude > span { display:block; width:0; height:100%; background:var(--gradient); transition:width .18s ease; }
    #chain-lab .feedback { min-height:70px; color:var(--text); font-size:var(--fs-sec); line-height:1.5; }
    #chain-lab .feedback strong { color:var(--gradient); }
    #chain-lab .preset-block { display:grid; gap:9px; padding:0 2px; }
    #chain-lab .preset-label { font-size:var(--fs-label); font-weight:650; }
    #chain-lab .btns { display:grid; grid-template-columns:1fr 1fr; }
    #chain-lab .btn { width:100%; }
    #chain-lab .invariant { margin-top:auto; padding-top:14px; border-top:1px solid var(--rule); color:var(--muted); font-size:var(--fs-label); line-height:1.5; }
    #chain-lab .invariant b { color:var(--text); }
    #chain-lab .zero-mark { stroke:var(--text); stroke-width:1.5; }
  </style>
</head>
<body data-page="18" data-total="25">
  <div id="stage">
    <section id="chain-lab" aria-labelledby="page-title">
      <header class="intro">
        <div class="kicker">反向传播 · 链式法则</div>
        <h1 id="page-title">一处局部导数，会改写整条上游误差信号</h1>
        <p class="lead">拖动任一边上的局部导数。橙色反向信号逐段相乘，越靠左包含的因子越多。</p>
      </header>

      <main class="lab min0">
        <section class="panel stage-panel min0" aria-label="局部导数与反向误差信号实验">
          <div class="diagram-wrap min0">
            <svg viewBox="0 0 1040 430" role="img" aria-labelledby="chain-title chain-desc">
              <title id="chain-title">四节点计算链上的反向传播</title>
              <desc id="chain-desc">正向计算从参数 theta 经过 h1、h2 到损失 L。反向误差信号从 L 向左传播，并在每条边乘以该边的局部导数。</desc>
              <defs>
                <marker id="arrow-blue-18" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1F5FAE"/></marker>
                <marker id="arrow-orange-18" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C94F20"/></marker>
              </defs>

              <text class="fwd-title" x="34" y="54">前向计算</text>
              <path class="forward" d="M155 103H365 M415 103H625 M675 103H885" marker-end="url(#arrow-blue-18)"/>

              <text class="signal-title" x="34" y="214">误差信号反传</text>
              <path class="back-base" d="M885 250H675"/><path class="back-base" d="M625 250H415"/><path class="back-base" d="M365 250H155"/>
              <path id="sig-c" class="back-signal" d="M885 250H675" marker-end="url(#arrow-orange-18)"/>
              <path id="sig-b" class="back-signal" d="M625 250H415" marker-end="url(#arrow-orange-18)"/>
              <path id="sig-a" class="back-signal" d="M365 250H155" marker-end="url(#arrow-orange-18)"/>

              <g transform="translate(105 73)"><rect class="node node-param" width="100" height="60" rx="8"/><text class="svg-label" x="50" y="28">参数 θ</text><text class="svg-sub" x="50" y="49">更早参数</text></g>
              <g transform="translate(365 73)"><rect class="node" width="100" height="60" rx="8"/><text class="svg-label" x="50" y="37">h₁</text></g>
              <g transform="translate(625 73)"><rect class="node" width="100" height="60" rx="8"/><text class="svg-label" x="50" y="37">h₂</text></g>
              <g transform="translate(885 73)"><rect class="node loss" width="100" height="60" rx="8"/><text class="svg-label" x="50" y="28">损失 L</text><text class="svg-sub" x="50" y="49">起点梯度 1</text></g>

              <text id="grad-theta" class="svg-grad" x="155" y="296">−0.58</text>
              <text id="grad-h1" class="svg-grad" x="415" y="296">−0.72</text>
              <text id="grad-h2" class="svg-grad" x="675" y="296">−0.60</text>
              <text class="svg-grad" x="935" y="296">1.00</text>
              <text class="svg-sub" x="155" y="321">∂L/∂θ</text><text class="svg-sub" x="415" y="321">∂L/∂h₁</text><text class="svg-sub" x="675" y="321">∂L/∂h₂</text><text class="svg-sub" x="935" y="321">∂L/∂L</text>

              <text id="edge-a" class="svg-sub" x="285" y="232">× 0.80</text>
              <text id="edge-b" class="svg-sub" x="545" y="232">× 1.20</text>
              <text id="edge-c" class="svg-sub" x="805" y="232">× −0.60</text>
              <line class="zero-mark" x1="285" y1="241" x2="285" y2="259"/><line class="zero-mark" x1="545" y1="241" x2="545" y2="259"/><line class="zero-mark" x1="805" y1="241" x2="805" y2="259"/>
            </svg>
          </div>

          <div class="controls-row">
            <label class="deriv ctl" for="da">
              <span class="deriv-head"><span>θ → h₁ 的局部导数</span><output id="out-a" for="da">0.80</output></span>
              <input id="da" type="range" min="-2" max="2" step="0.05" value="0.8">
              <span class="scale"><span>−2</span><span>0</span><span>+2</span></span>
            </label>
            <label class="deriv ctl" for="db">
              <span class="deriv-head"><span>h₁ → h₂ 的局部导数</span><output id="out-b" for="db">1.20</output></span>
              <input id="db" type="range" min="-2" max="2" step="0.05" value="1.2">
              <span class="scale"><span>−2</span><span>0</span><span>+2</span></span>
            </label>
            <label class="deriv ctl" for="dc">
              <span class="deriv-head"><span>h₂ → L 的局部导数</span><output id="out-c" for="dc">−0.60</output></span>
              <input id="dc" type="range" min="-2" max="2" step="0.05" value="-0.6">
              <span class="scale"><span>−2</span><span>0</span><span>+2</span></span>
            </label>
          </div>
        </section>

        <aside class="rail min0">
          <section class="panel readout" aria-labelledby="result-title">
            <h2 id="result-title">传到参数 θ 的梯度</h2>
            <div class="big sm" id="result">−0.576</div>
            <div class="formula" aria-label="链式法则乘积">
              <span>1 ×</span><span id="fc">−0.60</span><span>×</span><span id="fb">1.20</span><span>×</span><span id="fa">0.80</span><span>=</span><strong id="formula-result">−0.576</strong>
            </div>
            <div class="magnitude" aria-hidden="true"><span id="magbar"></span></div>
            <p class="feedback" id="feedback" aria-live="polite">当前信号<strong>被削弱并翻转方向</strong>：三个局部导数的乘积绝对值小于 1。</p>
          </section>

          <section class="preset-block" aria-label="诊断状态">
            <div class="preset-label">直接比较三种典型结果</div>
            <div class="btns">
              <button class="btn" type="button" data-preset="amplify">逐段放大</button>
              <button class="btn" type="button" data-preset="cut">中途截断</button>
              <button class="btn" type="button" data-preset="reverse">只翻转方向</button>
              <button class="btn" type="button" data-preset="reset">恢复初值</button>
            </div>
          </section>

          <p class="invariant"><b>保持不变：</b>网络结构与损失端梯度始终相同。只改变边上的局部导数，便能比较它们对更早参数的影响。</p>
        </aside>
      </main>
    </section>
  </div>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      const root = document.getElementById('chain-lab');
      const ctrl = new AbortController();
      const initial = Object.freeze({ a: 0.8, b: 1.2, c: -0.6 });
      let state = { ...initial };
      const $ = (sel) => root.querySelector(sel);
      const inputs = { a: $('#da'), b: $('#db'), c: $('#dc') };
      const outs = { a: $('#out-a'), b: $('#out-b'), c: $('#out-c') };
      const edgeText = { a: $('#edge-a'), b: $('#edge-b'), c: $('#edge-c') };
      const signal = { a: $('#sig-a'), b: $('#sig-b'), c: $('#sig-c') };
      const fmt = (v, digits=2) => `${v < 0 ? '−' : ''}${Math.abs(v).toFixed(digits)}`;
      const widthFor = (v) => v === 0 ? 2 : Math.min(18, 3.5 + Math.sqrt(Math.abs(v)) * 6);

      function interpretation(product) {
        const abs = Math.abs(product);
        if (abs < 0.0005) return '信号在零导数处被截断；它左侧所有更早参数的梯度都变为 0。';
        const direction = product < 0 ? '并翻转方向' : '且方向不变';
        if (abs > 1.001) return `信号被放大${direction}：局部因子的乘积绝对值大于 1。`;
        if (abs < 0.999) return `信号被削弱${direction}：局部因子的乘积绝对值小于 1。`;
        return `信号幅度保持为 1${direction}。`;
      }

      function render(announce=false) {
        const gH2 = state.c;
        const gH1 = state.b * state.c;
        const gTheta = state.a * state.b * state.c;
        for (const k of ['a','b','c']) {
          inputs[k].value = state[k];
          outs[k].textContent = fmt(state[k]);
          edgeText[k].textContent = `× ${fmt(state[k])}`;
        }
        $('#grad-h2').textContent = fmt(gH2);
        $('#grad-h1').textContent = fmt(gH1);
        $('#grad-theta').textContent = fmt(gTheta);
        $('#result').textContent = fmt(gTheta, 3);
        $('#fa').textContent = fmt(state.a);
        $('#fb').textContent = fmt(state.b);
        $('#fc').textContent = fmt(state.c);
        $('#formula-result').textContent = fmt(gTheta, 3);
        signal.c.style.strokeWidth = widthFor(gH2);
        signal.b.style.strokeWidth = widthFor(gH1);
        signal.a.style.strokeWidth = widthFor(gTheta);
        for (const [k, v] of Object.entries({ c:gH2, b:gH1, a:gTheta })) {
          signal[k].style.opacity = Math.abs(v) < .0005 ? '.45' : '1';
          signal[k].classList.toggle('cut', Math.abs(v) < .0005);
        }
        $('#magbar').style.width = `${Math.min(100, Math.abs(gTheta) / 4 * 100)}%`;
        const text = interpretation(gTheta);
        const strongEnd = text.indexOf('：');
        if (strongEnd > 0) $('#feedback').innerHTML = `${text.slice(0,strongEnd)}：<strong>${text.slice(strongEnd+1)}</strong>`;
        else $('#feedback').textContent = text;
        if (announce) $('#feedback').setAttribute('aria-label', `参数梯度 ${fmt(gTheta,3)}。${text}`);
      }

      function setState(next, announce=true) {
        state = { a:Number(next.a), b:Number(next.b), c:Number(next.c) };
        render(announce);
      }

      for (const k of ['a','b','c']) {
        inputs[k].addEventListener('input', () => {
          state = { ...state, [k]: Number(inputs[k].value) };
          render(false);
        }, { signal:ctrl.signal });
        inputs[k].addEventListener('change', () => render(true), { signal:ctrl.signal });
        inputs[k].addEventListener('keydown', (e) => {
          if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown'].includes(e.key)) e.stopPropagation();
        }, { signal:ctrl.signal });
      }

      root.querySelectorAll('[data-preset]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const p = btn.dataset.preset;
          if (p === 'amplify') setState({ a:1.5, b:1.5, c:1.5 });
          if (p === 'cut') setState({ a:1.4, b:0, c:1.6 });
          if (p === 'reverse') setState({ a:1, b:1, c:-1 });
          if (p === 'reset') setState(initial);
        }, { signal:ctrl.signal });
      });

      window.addEventListener('pagehide', () => ctrl.abort(), { once:true });
      Deck.init({ index:18, total:25 });
      render(false);
    })();
  </script>
</body>
</html>
