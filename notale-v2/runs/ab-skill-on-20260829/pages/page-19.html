<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>反向传播复用前向中间量</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage { background-image: none; }
    .diagram-page {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 18px;
    }
    .page-head {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-width: 1320px;
    }
    .page-head .lead { color: var(--muted); }
    .graph-wrap {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 296px;
      gap: 26px;
      align-items: stretch;
    }
    .graph-panel {
      min-width: 0;
      min-height: 0;
      padding: 16px 18px 14px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 9px;
    }
    .lane-heads {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 4px;
    }
    .lane-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: var(--fs-sec);
      font-weight: 700;
    }
    .lane-title small {
      color: var(--muted);
      font-size: var(--fs-label);
      font-weight: 500;
    }
    .lane-title.forward { color: var(--model); }
    .lane-title.backward { color: var(--gradient); }
    .graph-figure { min-height: 0; margin: 0; }
    .graph-figure svg { width: 100%; height: 100%; display: block; }
    .graph-caption {
      display: flex;
      justify-content: center;
      gap: 28px;
      color: var(--muted);
      font-size: var(--fs-label);
      line-height: 1.4;
    }
    .graph-caption span { display: inline-flex; align-items: center; gap: 8px; }
    .graph-caption i { width: 28px; height: 0; border-bottom: 4px solid currentColor; }
    .graph-caption .f { color: var(--model); }
    .graph-caption .b { color: var(--gradient); }
    .side {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }
    .side-block {
      padding: 18px 0;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }
    .side-block h2 { margin-bottom: 10px; }
    .side-block p { font-size: var(--fs-sec); line-height: 1.55; }
    .side-block strong { color: var(--gradient); }
    .reuse-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }
    .reuse-list li {
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 10px;
      align-items: baseline;
      font-size: var(--fs-sec);
    }
    .reuse-list code {
      color: var(--observed);
      font-family: var(--font-num);
      font-size: var(--fs-sec);
      font-weight: 600;
    }
    .takeaway {
      border: 2px solid var(--gradient);
      border-radius: 10px;
      background: var(--gradient-soft);
      padding: 17px 18px;
    }
    .takeaway .tagline {
      color: var(--gradient);
      font-family: var(--font-num);
      font-size: var(--fs-label);
      font-weight: 600;
      letter-spacing: .06em;
      margin-bottom: 7px;
    }
    .takeaway p { font-size: var(--fs-sec); line-height: 1.5; font-weight: 600; }
    svg text { font-family: var(--font-sans); fill: var(--text); }
    svg .mono { font-family: var(--font-num); }
    svg .node { fill: var(--surface); stroke: var(--text); stroke-width: 2; }
    svg .node.model { stroke: var(--model); }
    svg .node.loss { stroke: var(--gradient); }
    svg .forward-line { fill: none; stroke: var(--model); stroke-width: 4; marker-end: url(#arrowForward); }
    svg .back-line { fill: none; stroke: var(--gradient); stroke-width: 4; marker-end: url(#arrowBack); }
    svg .save-line { fill: none; stroke: var(--observed); stroke-width: 2; stroke-dasharray: 6 5; }
    svg .save-box { fill: var(--observed-soft); stroke: var(--observed); stroke-width: 2; }
    svg .grad-box { fill: var(--gradient-soft); stroke: var(--gradient); stroke-width: 2; }
    svg .axis-note { fill: var(--muted); font-size: 15px; }
    svg .formula { font-size: 22px; font-weight: 600; }
    svg .label { font-size: 17px; font-weight: 600; }
    svg .small-label { font-size: 15px; }
    svg .ftext { fill: var(--model); }
    svg .btext { fill: var(--gradient); }
    svg .otext { fill: var(--observed); }
  </style>
</head>
<body data-page="19" data-total="25">
  <div id="stage">
    <section class="diagram-page">
      <header class="page-head">
        <div class="kicker">同一计算图 · 两个方向</div>
        <h1>反向传播复用前向中间量，不是倒放预测</h1>
        <p class="lead">前向传播算出预测与损失，同时保存局部计算需要的量；反向传播沿图反向应用链式法则。</p>
      </header>

      <main class="graph-wrap min0">
        <section class="panel graph-panel min0" aria-labelledby="graph-heading">
          <div class="lane-heads">
            <div class="lane-title forward" id="graph-heading">前向传播 <small>从输入到损失</small></div>
            <div class="lane-title backward">反向传播 <small>从损失到参数梯度</small></div>
          </div>

          <figure class="graph-figure min0">
            <svg viewBox="0 0 1120 570" role="img" aria-labelledby="svg-title svg-desc">
              <title id="svg-title">前向传播与反向传播共用同一计算图</title>
              <desc id="svg-desc">前向依次计算线性组合、激活和损失，并保存输入、线性结果、激活值和目标；反向从损失梯度出发，复用这些保存量计算参数梯度。</desc>
              <defs>
                <marker id="arrowForward" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                  <path d="M0 0L10 5L0 10Z" fill="#1F5FAE"/>
                </marker>
                <marker id="arrowBack" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                  <path d="M0 0L10 5L0 10Z" fill="#C94F20"/>
                </marker>
              </defs>

              <text x="18" y="68" class="label ftext">计算值</text>
              <path class="forward-line" d="M132 118 H318"/>
              <path class="forward-line" d="M454 118 H642"/>
              <path class="forward-line" d="M778 118 H968"/>

              <rect class="node" x="18" y="78" width="114" height="80" rx="10"/>
              <text x="75" y="111" text-anchor="middle" class="formula mono">x,w,b</text>
              <text x="75" y="138" text-anchor="middle" class="small-label">输入与参数</text>

              <rect class="node model" x="318" y="78" width="136" height="80" rx="10"/>
              <text x="386" y="111" text-anchor="middle" class="formula mono">z=wx+b</text>
              <text x="386" y="138" text-anchor="middle" class="small-label ftext">线性组合</text>

              <rect class="node model" x="642" y="78" width="136" height="80" rx="10"/>
              <text x="710" y="111" text-anchor="middle" class="formula mono">a=ReLU(z)</text>
              <text x="710" y="138" text-anchor="middle" class="small-label ftext">激活</text>

              <rect class="node loss" x="968" y="78" width="136" height="80" rx="10"/>
              <text x="1036" y="111" text-anchor="middle" class="formula mono">L=(a−y)²</text>
              <text x="1036" y="138" text-anchor="middle" class="small-label btext">损失</text>

              <text x="18" y="224" class="label otext">前向时保存</text>
              <path class="save-line" d="M75 158 V247"/>
              <path class="save-line" d="M386 158 V247"/>
              <path class="save-line" d="M710 158 V247"/>
              <path class="save-line" d="M1036 158 V247"/>

              <rect class="save-box" x="20" y="247" width="110" height="48" rx="8"/>
              <text x="75" y="278" text-anchor="middle" class="mono label otext">x</text>
              <rect class="save-box" x="331" y="247" width="110" height="48" rx="8"/>
              <text x="386" y="278" text-anchor="middle" class="mono label otext">z</text>
              <rect class="save-box" x="655" y="247" width="110" height="48" rx="8"/>
              <text x="710" y="278" text-anchor="middle" class="mono label otext">a</text>
              <rect class="save-box" x="981" y="247" width="110" height="48" rx="8"/>
              <text x="1036" y="278" text-anchor="middle" class="mono label otext">a, y</text>

              <text x="18" y="365" class="label btext">复用保存量，算局部梯度</text>
              <path class="back-line" d="M968 420 H784"/>
              <path class="back-line" d="M642 420 H460"/>
              <path class="back-line" d="M318 420 H138"/>

              <path class="save-line" d="M1036 295 V382"/>
              <path class="save-line" d="M710 295 V382"/>
              <path class="save-line" d="M386 295 V382"/>
              <path class="save-line" d="M75 295 V382"/>

              <rect class="grad-box" x="968" y="382" width="136" height="76" rx="10"/>
              <text x="1036" y="414" text-anchor="middle" class="mono label btext">∂L/∂a</text>
              <text x="1036" y="441" text-anchor="middle" class="small-label">用 a, y</text>

              <rect class="grad-box" x="642" y="382" width="142" height="76" rx="10"/>
              <text x="713" y="414" text-anchor="middle" class="mono label btext">∂L/∂z</text>
              <text x="713" y="441" text-anchor="middle" class="small-label">用 z</text>

              <rect class="grad-box" x="318" y="382" width="142" height="76" rx="10"/>
              <text x="389" y="414" text-anchor="middle" class="mono label btext">∂L/∂w, ∂L/∂b</text>
              <text x="389" y="441" text-anchor="middle" class="small-label">用 x</text>

              <rect class="grad-box" x="18" y="382" width="120" height="76" rx="10"/>
              <text x="78" y="414" text-anchor="middle" class="mono label btext">梯度就绪</text>
              <text x="78" y="441" text-anchor="middle" class="small-label">供优化器更新</text>

              <path d="M390 477 H718" stroke="#AAB4BE" stroke-width="2"/>
              <path d="M390 477 V495 M718 477 V495" stroke="#AAB4BE" stroke-width="2"/>
              <text x="554" y="522" text-anchor="middle" class="axis-note">每个节点只算自己的局部导数，再与上游梯度相乘</text>
            </svg>
          </figure>

          <figcaption class="graph-caption">
            <span class="f"><i></i>蓝线传递数值</span>
            <span class="b"><i></i>橙线传递梯度</span>
          </figcaption>
        </section>

        <aside class="side min0" aria-label="图解说明">
          <section class="side-block">
            <h2>保存什么</h2>
            <ul class="reuse-list">
              <li><code>x</code><span>线性层求参数梯度</span></li>
              <li><code>z</code><span>判断 ReLU 的局部导数</span></li>
              <li><code>a,y</code><span>求损失对预测的导数</span></li>
            </ul>
          </section>

          <section class="side-block">
            <h2>反向在做什么</h2>
            <p>从 <span class="num">∂L/∂L=1</span> 出发，把上游梯度乘上每个节点的局部导数，得到 <strong>∂L/∂w</strong> 与 <strong>∂L/∂b</strong>。</p>
          </section>

          <section class="takeaway">
            <div class="tagline">不是倒放</div>
            <p>反向传播不重新生成输入，也不撤销预测；它高效回答“每个参数该往哪边改”。</p>
          </section>
        </aside>
      </main>
    </section>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({ index: 19, total: 25 });</script>
</body>
</html>
