<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>分叉网络的误差责任</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #responsibility-widget {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 16px;
    }
    #responsibility-widget .model-stage {
      position: relative;
      min-height: 0;
      background: var(--surface);
      border: 2px solid var(--rule);
      border-radius: 10px;
      box-shadow: 0 7px 18px rgba(23,33,43,.08);
      overflow: hidden;
    }
    #responsibility-widget svg { width: 100%; height: 100%; display: block; }
    #responsibility-widget .wire { fill: none; stroke: var(--model); stroke-width: 5; }
    #responsibility-widget .wire.fixed { stroke-width: 4; }
    #responsibility-widget .node { fill: var(--surface); stroke: var(--text); stroke-width: 3; }
    #responsibility-widget .fork { fill: var(--model-soft); stroke: var(--model); stroke-width: 3; }
    #responsibility-widget .sum { fill: var(--gradient-soft); stroke: var(--gradient); stroke-width: 3; }
    #responsibility-widget .param { fill: var(--surface); stroke: var(--model); stroke-width: 3; }
    #responsibility-widget .grad-path {
      fill: none;
      stroke: var(--gradient);
      stroke-width: 5;
      stroke-dasharray: 11 8;
      opacity: 0;
      transition: opacity .2s ease;
    }
    #responsibility-widget[data-revealed="true"] .grad-path { opacity: 1; }
    #responsibility-widget .svg-main { font: 600 20px var(--font-sans); fill: var(--text); }
    #responsibility-widget .svg-small { font: 500 16px var(--font-sans); fill: var(--muted); }
    #responsibility-widget .svg-num { font: 600 18px var(--font-num); fill: var(--model); }
    #responsibility-widget .grad-label { font: 600 17px var(--font-num); fill: var(--gradient); opacity: 0; transition: opacity .2s ease; }
    #responsibility-widget[data-revealed="true"] .grad-label { opacity: 1; }
    #responsibility-widget .invariant-strip {
      position: absolute;
      left: 22px;
      top: 18px;
      display: flex;
      gap: 22px;
      color: var(--muted);
      font-size: var(--fs-label);
      line-height: 1.4;
    }
    #responsibility-widget .invariant-strip b { color: var(--observed); font-family: var(--font-num); }
    #responsibility-widget .task-note {
      position: absolute;
      right: 22px;
      top: 16px;
      max-width: 440px;
      color: var(--text);
      font-size: var(--fs-sec);
      line-height: 1.45;
      text-align: right;
    }
    #responsibility-widget .allocation {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 245px;
      gap: 14px;
      align-items: stretch;
    }
    #responsibility-widget .alloc {
      display: grid;
      grid-template-columns: 58px minmax(0,1fr) 42px;
      grid-template-rows: auto auto;
      align-items: center;
      gap: 6px 12px;
      padding: 13px 16px;
      background: var(--surface);
      border: 2px solid var(--rule);
      border-radius: 10px;
    }
    #responsibility-widget .alloc label { font-size: var(--fs-label); font-weight: 650; }
    #responsibility-widget .alloc .value { color: var(--attention); font: 600 25px/1 var(--font-num); text-align: right; }
    #responsibility-widget .alloc input { grid-column: 1 / -1; }
    #responsibility-widget .alloc[data-match="true"] { border-color: var(--gradient); }
    #responsibility-widget .actual {
      display: none;
      color: var(--gradient);
      font: 600 15px/1.3 var(--font-num);
    }
    #responsibility-widget[data-revealed="true"] .actual { display: block; }
    #responsibility-widget .action-box {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 9px;
      padding-left: 4px;
    }
    #responsibility-widget .sumline { font-size: var(--fs-label); color: var(--muted); min-height: 22px; }
    #responsibility-widget .sumline strong { color: var(--text); font-family: var(--font-num); }
    #responsibility-widget .sumline[data-ok="false"] strong { color: var(--gradient); }
    #responsibility-widget .action-box .btns { flex-wrap: nowrap; }
    #responsibility-widget .feedback {
      min-height: 42px;
      color: var(--muted);
      font-size: var(--fs-label);
      line-height: 1.4;
    }
    #responsibility-widget[data-revealed="true"] .feedback { color: var(--text); }
    @media (prefers-reduced-motion: reduce) {
      #responsibility-widget .grad-path, #responsibility-widget .grad-label { transition: none; }
    }
  </style>
</head>
<body data-page="20" data-total="25">
  <div id="stage">
    <section class="diagram min0">
      <header>
        <div class="kicker">误差归因 · 先判断再验算</div>
        <h1>分叉以后，一个参数的责任要把所有路径相加</h1>
        <p class="lead">把 6 份误差责任分给 <span class="num">w、a、b</span>。提交后沿反向路径计算梯度，检查“影响的支路多就该多负责”是否成立。</p>
      </header>
      <main id="responsibility-widget" class="min0" data-revealed="false" aria-label="分叉网络误差责任分配器">
        <div class="model-stage min0">
          <div class="invariant-strip" aria-label="固定条件">
            <span>固定前向值 <b>x=w=a=b=1</b></span>
            <span>输出误差信号 <b>∂L/∂ŷ = +1</b></span>
          </div>
          <div class="task-note">责任份数按梯度绝对值分配；梯度正负另行保留。</div>
          <svg viewBox="0 0 1440 440" role="img" aria-labelledby="netTitle netDesc">
            <title id="netTitle">含共享参数与上下分支的计算图</title>
            <desc id="netDesc">参数 w 位于分叉前，参数 a 和 b 分别位于上下支路。上支路固定乘以正三，下支路固定乘以负二，最后相加得到预测值。</desc>
            <defs>
              <marker id="p20-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1F5FAE"/></marker>
              <marker id="p20-red-arrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0L0 5L10 10Z" fill="#C94F20"/></marker>
            </defs>
            <g aria-hidden="true">
              <path class="wire" marker-end="url(#p20-blue-arrow)" d="M145 240H300"/>
              <path class="wire" marker-end="url(#p20-blue-arrow)" d="M365 240H500"/>
              <path class="wire" d="M540 240C625 240 620 130 710 130"/>
              <path class="wire" d="M540 240C625 240 620 350 710 350"/>
              <path class="wire" marker-end="url(#p20-blue-arrow)" d="M775 130H930"/>
              <path class="wire" marker-end="url(#p20-blue-arrow)" d="M775 350H930"/>
              <path class="wire fixed" d="M990 130C1080 130 1095 210 1170 220"/>
              <path class="wire fixed" d="M990 350C1080 350 1095 270 1170 250"/>
              <path class="wire" marker-end="url(#p20-blue-arrow)" d="M1230 235H1350"/>
              <path class="grad-path" marker-end="url(#p20-red-arrow)" d="M1338 263H1245"/>
              <path class="grad-path" marker-end="url(#p20-red-arrow)" d="M1165 215C1095 204 1080 130 1000 130H790"/>
              <path class="grad-path" marker-end="url(#p20-red-arrow)" d="M1165 255C1095 270 1080 350 1000 350H790"/>
              <path class="grad-path" marker-end="url(#p20-red-arrow)" d="M700 130C620 130 620 225 545 225H380"/>
              <path class="grad-path" marker-end="url(#p20-red-arrow)" d="M700 350C620 350 620 255 545 255H380"/>
            </g>
            <g>
              <circle class="node" cx="110" cy="240" r="35"/><text class="svg-main" x="110" y="247" text-anchor="middle">x</text>
              <rect class="param" x="300" y="203" width="70" height="74" rx="10"/><text class="svg-main" x="335" y="247" text-anchor="middle">w</text>
              <circle class="fork" cx="520" cy="240" r="26"/><text class="svg-small" x="520" y="294" text-anchor="middle">分叉</text>
              <rect class="param" x="705" y="93" width="75" height="74" rx="10"/><text class="svg-main" x="742" y="137" text-anchor="middle">a</text>
              <rect class="param" x="705" y="313" width="75" height="74" rx="10"/><text class="svg-main" x="742" y="357" text-anchor="middle">b</text>
              <circle class="node" cx="965" cy="130" r="35"/><text class="svg-num" x="965" y="137" text-anchor="middle">× +3</text>
              <circle class="node" cx="965" cy="350" r="35"/><text class="svg-num" x="965" y="357" text-anchor="middle">× −2</text>
              <circle class="sum" cx="1200" cy="235" r="37"/><text class="svg-main" x="1200" y="242" text-anchor="middle">求和</text>
              <circle class="node" cx="1380" cy="263" r="34"/><text class="svg-main" x="1380" y="270" text-anchor="middle">ŷ</text>
              <text class="svg-small" x="860" y="98" text-anchor="middle">上支路</text>
              <text class="svg-small" x="860" y="412" text-anchor="middle">下支路</text>
              <text class="grad-label" x="565" y="116">w 路径一：+3</text>
              <text class="grad-label" x="565" y="390">w 路径二：−2</text>
              <text class="grad-label" x="1060" y="103">∂L/∂a = +3</text>
              <text class="grad-label" x="1058" y="397">∂L/∂b = −2</text>
              <text class="grad-label" x="280" y="328">∂L/∂w = +3 + (−2) = +1</text>
            </g>
          </svg>
        </div>
        <div class="allocation" aria-label="分配六份误差责任">
          <div class="alloc" data-param="w">
            <label for="alloc-w">分给 w</label><span class="actual">实际 |梯度| 1</span><output class="value" for="alloc-w">2</output>
            <input id="alloc-w" type="range" min="0" max="6" step="1" value="2" aria-label="分给参数 w 的责任份数">
          </div>
          <div class="alloc" data-param="a">
            <label for="alloc-a">分给 a</label><span class="actual">实际 |梯度| 3</span><output class="value" for="alloc-a">2</output>
            <input id="alloc-a" type="range" min="0" max="6" step="1" value="2" aria-label="分给参数 a 的责任份数">
          </div>
          <div class="alloc" data-param="b">
            <label for="alloc-b">分给 b</label><span class="actual">实际 |梯度| 2</span><output class="value" for="alloc-b">2</output>
            <input id="alloc-b" type="range" min="0" max="6" step="1" value="2" aria-label="分给参数 b 的责任份数">
          </div>
          <div class="action-box">
            <div class="sumline" data-ok="true">已分配 <strong>6 / 6</strong> 份</div>
            <div class="btns">
              <button class="btn reveal" type="button">沿路径验算</button>
              <button class="btn reset" type="button">重置分配</button>
            </div>
            <div class="feedback" aria-live="polite">先调整三条滑杆，三者合计必须为 6。</div>
          </div>
        </div>
      </main>
    </section>
  </div>
  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 20, total: 25 });
    (() => {
      const root = document.getElementById('responsibility-widget');
      const sliders = [...root.querySelectorAll('input[type="range"]')];
      const reveal = root.querySelector('.reveal');
      const reset = root.querySelector('.reset');
      const sumline = root.querySelector('.sumline');
      const feedback = root.querySelector('.feedback');
      const actual = { w: 1, a: 3, b: 2 };
      const initial = { w: 2, a: 2, b: 2 };
      let state = { values: { ...initial }, revealed: false };
      const cleanups = [];

      function render() {
        const total = Object.values(state.values).reduce((s, v) => s + v, 0);
        root.dataset.revealed = String(state.revealed);
        sliders.forEach(input => {
          const key = input.id.slice(-1);
          input.value = state.values[key];
          input.disabled = state.revealed;
          const box = input.closest('.alloc');
          box.querySelector('.value').textContent = state.values[key];
          box.dataset.match = String(state.revealed && state.values[key] === actual[key]);
        });
        sumline.dataset.ok = String(total === 6);
        sumline.innerHTML = `已分配 <strong>${total} / 6</strong> 份`;
        reveal.disabled = state.revealed || total !== 6;
        if (state.revealed) {
          const exact = Object.keys(actual).every(k => state.values[k] === actual[k]);
          feedback.textContent = exact
            ? '分配吻合。w 经过两条路径，+3 与 −2 抵消后只剩 1 份责任。'
            : '实际责任为 w:a:b = 1:3:2。w 虽影响两条支路，两条贡献会带符号求和。';
        } else if (total !== 6) {
          feedback.textContent = total > 6
            ? `多分了 ${total - 6} 份；先把合计调回 6 再验算。`
            : `还差 ${6 - total} 份；先把合计补到 6 再验算。`;
        } else {
          feedback.textContent = '预测已可提交。关注 w 的两条反向路径会怎样合并。';
        }
      }

      sliders.forEach(input => {
        const onInput = () => {
          if (state.revealed) return;
          const key = input.id.slice(-1);
          state = { values: { ...state.values, [key]: Number(input.value) }, revealed: false };
          render();
        };
        input.addEventListener('input', onInput);
        cleanups.push(() => input.removeEventListener('input', onInput));
      });
      const onReveal = () => { state = { ...state, revealed: true }; render(); };
      const onReset = () => { state = { values: { ...initial }, revealed: false }; render(); };
      reveal.addEventListener('click', onReveal);
      reset.addEventListener('click', onReset);
      cleanups.push(() => reveal.removeEventListener('click', onReveal), () => reset.removeEventListener('click', onReset));
      root.destroy = () => { while (cleanups.length) cleanups.pop()(); };
      render();
    })();
  </script>
</body>
</html>
