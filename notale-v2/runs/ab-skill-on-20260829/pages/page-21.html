<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>第五章：一次训练怎样变成学会</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage { position: relative; }
    .chapter-page {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, .82fr) minmax(0, 1.18fr);
      align-items: stretch;
      gap: 66px;
      position: relative;
      z-index: 1;
    }
    .chapter-copy {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-bottom: 18px;
    }
    .chapter-copy .kicker { margin-bottom: 15px; }
    .chapter-copy h1 {
      max-width: 640px;
      font-size: 58px;
      line-height: 1.13;
      letter-spacing: -.035em;
    }
    .chapter-copy h1 strong { color: var(--model); font-weight: 700; white-space: nowrap; }
    .chapter-copy .lead {
      max-width: 610px;
      margin-top: 30px;
      color: var(--text);
    }
    .chapter-copy .summary {
      max-width: 600px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 2px solid var(--rule);
      color: var(--muted);
      font-size: var(--fs-sec);
      line-height: 1.55;
    }
    .cycle-wrap {
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .cycle-field {
      width: 100%;
      height: 704px;
      position: relative;
    }
    .cycle-field svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .route {
      fill: none;
      stroke: var(--rule);
      stroke-width: 3;
    }
    .route.forward { stroke: var(--model); }
    .route.backward { stroke: var(--gradient); }
    .arrowhead.forward { fill: var(--model); }
    .arrowhead.backward { fill: var(--gradient); }
    .cycle-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 330px;
      height: 330px;
      transform: translate(-50%, -50%);
      border: 2px solid var(--rule);
      border-radius: 50%;
      background: var(--surface);
      box-shadow: 0 10px 26px rgba(23,33,43,.09);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 42px;
    }
    .cycle-center .round {
      font-family: var(--font-num);
      font-size: var(--fs-label);
      font-weight: 600;
      letter-spacing: .06em;
      color: var(--muted);
      margin-bottom: 13px;
    }
    .cycle-center .main {
      font-family: var(--font-display);
      font-size: 29px;
      line-height: 1.3;
      font-weight: 700;
      color: var(--text);
    }
    .cycle-center .main span { color: var(--observed); }
    .cycle-center .minor {
      margin-top: 15px;
      color: var(--muted);
      font-size: var(--fs-label);
      line-height: 1.45;
    }
    .step {
      position: absolute;
      width: 250px;
      min-height: 128px;
      padding: 16px 18px 15px;
      background: var(--surface);
      border: 2px solid var(--rule);
      border-radius: 10px;
      box-shadow: 0 6px 16px rgba(23,33,43,.07);
    }
    .step .step-no {
      display: block;
      font-family: var(--font-num);
      font-size: var(--fs-label);
      font-weight: 600;
      line-height: 1;
      margin-bottom: 9px;
    }
    .step h2 { font-size: var(--fs-h2); margin-bottom: 7px; }
    .step p { color: var(--muted); font-size: var(--fs-label); line-height: 1.4; }
    .step.forward { border-color: var(--model); }
    .step.forward .step-no, .step.forward h2 { color: var(--model); }
    .step.observed { border-color: var(--observed); }
    .step.observed .step-no, .step.observed h2 { color: var(--observed); }
    .step.backward { border-color: var(--gradient); }
    .step.backward .step-no, .step.backward h2 { color: var(--gradient); }
    .s1 { left: 50%; top: 8px; transform: translateX(-50%); }
    .s2 { right: 0; top: 50%; transform: translateY(-50%); }
    .s3 { left: 50%; bottom: 8px; transform: translateX(-50%); }
    .s4 { left: 0; top: 50%; transform: translateY(-50%); }
    .axis-note {
      position: absolute;
      right: 14px;
      bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: var(--fs-label);
      line-height: 1.35;
    }
    .axis-note::before {
      content: "";
      width: 38px;
      height: 2px;
      background: var(--observed);
    }
  </style>
</head>
<body data-page="21" data-total="25">
  <div id="stage">
    <main class="chapter-page">
      <section class="chapter-copy min0" aria-labelledby="page-title">
        <div class="kicker">第五章 · 训练循环</div>
        <h1 id="page-title">一次训练，怎样变成<strong>学会</strong></h1>
        <p class="lead">一次更新只改动一点参数。前向、损失、梯度和更新反复衔接，模型的预测才逐轮改变。</p>
        <p class="summary">本章沿着一轮训练走一遍：先看预测怎样产生，再追踪误差怎样返回每个参数，最后观察下一轮发生了什么。</p>
      </section>

      <section class="cycle-wrap min0" aria-label="一轮训练的四步循环图">
        <div class="cycle-field">
          <svg viewBox="0 0 800 704" role="img" aria-label="前向计算、计算损失、反向求梯度、更新参数依次循环">
            <defs>
              <marker id="headBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
                <path class="arrowhead forward" d="M0,0 L10,5 L0,10 Z"></path>
              </marker>
              <marker id="headOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
                <path class="arrowhead backward" d="M0,0 L10,5 L0,10 Z"></path>
              </marker>
            </defs>
            <path class="route forward" marker-end="url(#headBlue)" d="M 520 90 C 675 120, 724 218, 713 294"></path>
            <path class="route backward" marker-end="url(#headOrange)" d="M 713 411 C 696 540, 613 608, 520 620"></path>
            <path class="route backward" marker-end="url(#headOrange)" d="M 280 620 C 139 601, 84 506, 87 411"></path>
            <path class="route forward" marker-end="url(#headBlue)" d="M 87 294 C 95 178, 174 101, 280 88"></path>
          </svg>

          <article class="step forward s1">
            <span class="step-no">01</span>
            <h2>做一次前向计算</h2>
            <p>输入沿当前权重得到预测。</p>
          </article>
          <article class="step observed s2">
            <span class="step-no">02</span>
            <h2>算预测与目标的差</h2>
            <p>损失把偏差压成一个可比较的量。</p>
          </article>
          <article class="step backward s3">
            <span class="step-no">03</span>
            <h2>反向求每个梯度</h2>
            <p>链式法则分配各参数的责任。</p>
          </article>
          <article class="step backward s4">
            <span class="step-no">04</span>
            <h2>沿梯度更新参数</h2>
            <p>新参数进入下一轮前向计算。</p>
          </article>

          <div class="cycle-center" aria-hidden="true">
            <div class="round">第 t 轮 → 第 t+1 轮</div>
            <div class="main">参数改变<br><span>预测随之改变</span></div>
            <div class="minor">循环带来可观察的学习过程</div>
          </div>
          <div class="axis-note">每一轮都从更新后的参数重新开始</div>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({ index: 21, total: 25 });</script>
</body>
</html>
