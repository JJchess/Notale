<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>训练中的协同变化</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#trainer{width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1.62fr) minmax(360px,.76fr);grid-template-rows:minmax(0,1fr) auto;gap:16px 24px;min-height:0}
#trainer .field{position:relative;min-width:0;min-height:0;background:var(--surface);border:2px solid var(--rule);border-radius:10px;overflow:hidden;box-shadow:0 7px 18px rgba(23,33,43,.08)}
#trainer .field canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#trainer .field-head{position:absolute;left:18px;right:18px;top:14px;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#trainer .field-head strong{font-size:var(--fs-sec);line-height:1.35;background:rgba(255,255,255,.9);padding:4px 7px;border-radius:4px}
#trainer .field-head span{font-family:var(--font-num);font-size:var(--fs-label);color:var(--muted);background:rgba(255,255,255,.9);padding:4px 7px;border-radius:4px}
#trainer .side{display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0}
#trainer .summary{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--rule-soft)}
#trainer .readout{min-width:0}
#trainer .readout .lab{color:var(--muted);font-size:var(--fs-label);line-height:1.35;margin-bottom:5px}
#trainer .readout .big{font-size:42px}
#trainer .loss .big{color:var(--gradient)}
#trainer .history{height:142px;display:flex;flex-direction:column;gap:6px}
#trainer .history-head{display:flex;justify-content:space-between;align-items:baseline}
#trainer .history-head strong{font-size:var(--fs-sec)}
#trainer .history-head span{color:var(--muted);font:500 var(--fs-label)/1.3 var(--font-num)}
#trainer #lossSvg{width:100%;height:112px;overflow:visible}
#trainer .params{min-height:0;display:flex;flex-direction:column;gap:8px}
#trainer .params h2{font-size:var(--fs-sec)}
#trainer .prow{display:grid;grid-template-columns:46px 1fr 66px;gap:9px;align-items:center;font-size:var(--fs-label)}
#trainer .prow .track{height:9px;background:var(--rule-soft);border-radius:2px;overflow:hidden}
#trainer .prow .fill{height:100%;background:var(--model);transform-origin:left center}
#trainer .prow output{text-align:right;font:500 var(--fs-label)/1.2 var(--font-num);color:var(--model)}
#trainer .network{height:96px;border-top:1px solid var(--rule-soft);padding-top:9px}
#trainer .network svg{width:100%;height:100%}
#trainer .rail{grid-column:1/-1;display:flex;align-items:center;gap:12px;min-width:0;padding-top:2px}
#trainer .rail .btn.primary{background:var(--model);border-color:var(--model);color:white;min-width:112px}
#trainer .rail .status{margin-left:auto;min-width:300px;text-align:right;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
#trainer .rail .status strong{color:var(--text)}
#trainer .class-key{position:absolute;left:18px;bottom:14px;z-index:2;display:flex;gap:16px;padding:5px 8px;background:rgba(255,255,255,.9);border-radius:4px;color:var(--muted);font-size:var(--fs-label)}
#trainer .key-item{display:flex;gap:7px;align-items:center}.key-dot{width:12px;height:12px;border:2px solid currentColor}.key-dot.a{border-radius:50%;color:var(--observed);background:var(--observed-soft)}.key-dot.b{color:var(--gradient);background:var(--gradient-soft)}
@media (prefers-reduced-motion:reduce){#trainer *{transition:none!important}}
</style>
</head>
<body data-page="23" data-total="25">
<div id="stage">
  <section class="diagram">
    <header>
      <div class="kicker">训练现场 · 小网络</div>
      <h1>边界、损失和参数在同一轮更新里一起改变</h1>
      <p class="lead">启动训练，再随时暂停。画面中的分类边界、总体损失与全部参数都来自同一个当前模型。</p>
    </header>
    <main class="min0">
      <div id="trainer" aria-label="小型神经网络训练观察器">
        <div class="field min0" role="img" aria-label="固定的四簇训练样本，以及当前网络输出为两类的区域">
          <canvas id="fieldCanvas" aria-hidden="true"></canvas>
          <div class="field-head"><strong>决策边界</strong><span id="fieldStamp">第 0 轮</span></div>
          <div class="class-key" aria-hidden="true"><span class="key-item"><i class="key-dot a"></i>类别 A</span><span class="key-item"><i class="key-dot b"></i>类别 B</span></div>
        </div>
        <aside class="side min0" aria-label="训练读数">
          <div class="summary">
            <div class="readout loss"><div class="lab">总体交叉熵</div><output class="big" id="lossValue">0.000</output></div>
            <div class="readout"><div class="lab">训练轮数</div><output class="big" id="epochValue">0</output></div>
          </div>
          <div class="history">
            <div class="history-head"><strong>损失轨迹</strong><span>固定样本 · 全批量</span></div>
            <svg id="lossSvg" viewBox="0 0 360 112" role="img" aria-label="损失随训练轮数的变化">
              <line x1="8" y1="101" x2="352" y2="101" stroke="var(--rule)" stroke-width="1"/>
              <path id="lossPath" fill="none" stroke="var(--gradient)" stroke-width="3" vector-effect="non-scaling-stroke"/>
              <circle id="lossPoint" r="5" fill="var(--gradient)"/>
            </svg>
          </div>
          <div class="params">
            <h2>参数组的均方根</h2>
            <div class="prow"><span>W₁</span><span class="track"><i class="fill" id="barW1"></i></span><output id="valW1"></output></div>
            <div class="prow"><span>b₁</span><span class="track"><i class="fill" id="barB1"></i></span><output id="valB1"></output></div>
            <div class="prow"><span>W₂</span><span class="track"><i class="fill" id="barW2"></i></span><output id="valW2"></output></div>
            <div class="prow"><span>b₂</span><span class="track"><i class="fill" id="barB2"></i></span><output id="valB2"></output></div>
          </div>
          <div class="network" aria-hidden="true"><svg id="netSvg" viewBox="0 0 360 88"></svg></div>
        </aside>
        <div class="rail" aria-label="训练控制">
          <button class="btn primary" id="runBtn" type="button" aria-pressed="false">启动训练</button>
          <button class="btn" id="stepBtn" type="button">训练 20 轮</button>
          <button class="btn" id="resetBtn" type="button">恢复初始参数</button>
          <div class="status" id="statusText" aria-live="polite"><strong>已暂停</strong>，边界尚未贴合四簇样本。</div>
        </div>
      </div>
    </main>
  </section>
</div>
<script src="assets/base.js"></script>
<script>
Deck.init({index:23,total:25});
(function(){
  const root=document.getElementById('trainer');
  const q=s=>root.querySelector(s);
  const cv=q('#fieldCanvas'), ctx=cv.getContext('2d');
  const els={run:q('#runBtn'),step:q('#stepBtn'),reset:q('#resetBtn'),loss:q('#lossValue'),epoch:q('#epochValue'),stamp:q('#fieldStamp'),path:q('#lossPath'),point:q('#lossPoint'),status:q('#statusText'),net:q('#netSvg')};
  const samples=[];
  const centers=[[-.62,-.58,0],[.62,.58,0],[-.62,.58,1],[.62,-.58,1]];
  centers.forEach((c,ci)=>{for(let i=0;i<10;i++){const a=(i*2.399963+ci*.41),r=.07+.025*(i%4);samples.push({x:c[0]+Math.cos(a)*r,y:c[1]+Math.sin(a)*r,t:c[2]});}});
  const initial=()=>({epoch:0,running:false,W1:[[.44,-.73],[.28,.61],[-.52,.36],[.67,.18]],b1:[.08,-.12,.05,-.04],W2:[.36,-.41,.57,-.33],b2:.02,history:[]});
  let state=initial(), timer=null, destroyed=false;
  const sig=x=>1/(1+Math.exp(-Math.max(-20,Math.min(20,x))));
  function forward(x,y,s=state){const h=s.W1.map((w,j)=>Math.tanh(w[0]*x+w[1]*y+s.b1[j]));return {h,p:sig(h.reduce((v,z,j)=>v+z*s.W2[j],s.b2))};}
  function calcLoss(){let L=0;for(const d of samples){const p=forward(d.x,d.y).p;L+=-(d.t*Math.log(p+1e-9)+(1-d.t)*Math.log(1-p+1e-9));}return L/samples.length;}
  function trainOne(){
    const gW1=state.W1.map(()=>[0,0]),gb1=[0,0,0,0],gW2=[0,0,0,0];let gb2=0;
    for(const d of samples){const o=forward(d.x,d.y),dz=o.p-d.t;gb2+=dz;for(let j=0;j<4;j++){gW2[j]+=dz*o.h[j];const dh=dz*state.W2[j]*(1-o.h[j]*o.h[j]);gW1[j][0]+=dh*d.x;gW1[j][1]+=dh*d.y;gb1[j]+=dh;}}
    const lr=.34/samples.length;
    for(let j=0;j<4;j++){state.W2[j]-=lr*gW2[j];state.W1[j][0]-=lr*gW1[j][0];state.W1[j][1]-=lr*gW1[j][1];state.b1[j]-=lr*gb1[j];}state.b2-=lr*gb2;state.epoch++;
    if(state.epoch%5===0||state.epoch===1)state.history.push({e:state.epoch,l:calcLoss()});
    if(state.history.length>180)state.history.shift();
  }
  function rms(a){const f=a.flat(Infinity);return Math.sqrt(f.reduce((s,v)=>s+v*v,0)/f.length);}
  function drawField(){
    const rect=cv.getBoundingClientRect(),w=Math.max(1,Math.round(rect.width)),h=Math.max(1,Math.round(rect.height)),dpr=Math.min(2,window.devicePixelRatio||1);
    if(cv.width!==w*dpr||cv.height!==h*dpr){cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}else ctx.setTransform(dpr,0,0,dpr,0,0);
    const imgW=72,imgH=52,off=document.createElement('canvas');off.width=imgW;off.height=imgH;const oc=off.getContext('2d'),im=oc.createImageData(imgW,imgH);
    const ca=[228,241,236],cb=[251,233,226];
    for(let py=0;py<imgH;py++)for(let px=0;px<imgW;px++){const x=px/(imgW-1)*2-1,y=1-py/(imgH-1)*2,p=forward(x,y).p,k=(py*imgW+px)*4;for(let c=0;c<3;c++)im.data[k+c]=Math.round(ca[c]*(1-p)+cb[c]*p);im.data[k+3]=255;}
    oc.putImageData(im,0,0);ctx.imageSmoothingEnabled=true;ctx.drawImage(off,0,0,w,h);
    ctx.strokeStyle='rgba(23,33,43,.16)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
    const gx=x=>(x+1)*.5*w,gy=y=>(1-y)*.5*h;
    for(const d of samples){ctx.beginPath();if(d.t===0){ctx.arc(gx(d.x),gy(d.y),7,0,Math.PI*2);}else{ctx.rect(gx(d.x)-6,gy(d.y)-6,12,12);}ctx.fillStyle=d.t===0?'#E4F1EC':'#FBE9E2';ctx.fill();ctx.strokeStyle=d.t===0?'#24705A':'#C94F20';ctx.lineWidth=2.5;ctx.stroke();}
    ctx.strokeStyle='#17212B';ctx.lineWidth=2.5;ctx.beginPath();for(let py=0;py<imgH-1;py++)for(let px=0;px<imgW-1;px++){const x=px/(imgW-1)*2-1,y=1-py/(imgH-1)*2,a=forward(x,y).p-.5,b=forward(x+2/(imgW-1),y).p-.5,c=forward(x,y-2/(imgH-1)).p-.5;if(a*b<0){const xx=gx(x+1/(imgW-1));ctx.moveTo(xx,gy(y));ctx.lineTo(xx,gy(y-2/(imgH-1)));}if(a*c<0){const yy=gy(y-1/(imgH-1));ctx.moveTo(gx(x),yy);ctx.lineTo(gx(x+2/(imgW-1)),yy);}}ctx.stroke();
  }
  function drawHistory(current){
    const hist=[{e:0,l:state.initialLoss||current},...state.history],min=.05,max=Math.max(.78,...hist.map(d=>d.l)),eMax=Math.max(120,state.epoch);const pts=hist.map(d=>[8+d.e/eMax*344,101-(d.l-min)/(max-min)*91]);
    els.path.setAttribute('d',pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '));const p=pts[pts.length-1];els.point.setAttribute('cx',p[0]);els.point.setAttribute('cy',p[1]);
  }
  function drawNet(){const xs=[36,174,326],ys=[[28,62],[12,33,55,76],[44]],lines=[];for(let i=0;i<2;i++)for(let j=0;j<4;j++){const v=state.W1[j][i];lines.push(`<line x1="${xs[0]}" y1="${ys[0][i]}" x2="${xs[1]}" y2="${ys[1][j]}" stroke="${v>=0?'#1F5FAE':'#C94F20'}" stroke-opacity=".7" stroke-width="${1+Math.min(5,Math.abs(v)*3)}"/>`)}for(let j=0;j<4;j++){const v=state.W2[j];lines.push(`<line x1="${xs[1]}" y1="${ys[1][j]}" x2="${xs[2]}" y2="${ys[2][0]}" stroke="${v>=0?'#1F5FAE':'#C94F20'}" stroke-opacity=".7" stroke-width="${1+Math.min(5,Math.abs(v)*3)}"/>`)}els.net.innerHTML=lines.join('')+ys.flatMap((a,col)=>a.map(y=>`<circle cx="${xs[col]}" cy="${y}" r="${col===1?6:7}" fill="white" stroke="#17212B" stroke-width="2"/>`)).join('');}
  function render(announce=false){const loss=calcLoss();if(state.initialLoss==null)state.initialLoss=loss;els.loss.textContent=loss.toFixed(3);els.epoch.textContent=String(state.epoch);els.stamp.textContent='第 '+state.epoch+' 轮';
    const vals={W1:rms(state.W1),B1:rms(state.b1),W2:rms(state.W2),B2:Math.abs(state.b2)};for(const k in vals){q('#val'+k).textContent=vals[k].toFixed(3);q('#bar'+k).style.width=Math.min(100,vals[k]/1.6*100)+'%';}
    els.run.textContent=state.running?'暂停检查':'启动训练';els.run.setAttribute('aria-pressed',String(state.running));els.step.disabled=state.running;
    const fit=loss<.24?'边界已把交错类别分开。':loss<.48?'弯曲边界正在靠近四簇样本。':'边界尚未贴合四簇样本。';els.status.innerHTML='<strong>'+(state.running?'训练中':'已暂停')+'</strong>，'+fit;if(announce)els.status.setAttribute('data-announced',state.epoch);
    drawField();drawHistory(loss);drawNet();
  }
  function pause(announce=true){if(timer){clearInterval(timer);timer=null;}state.running=false;render(announce);}
  function start(){if(state.running)return;state.running=true;render();timer=setInterval(()=>{for(let i=0;i<5;i++)trainOne();if(state.epoch>=1200)pause(true);else render(false);},80);}
  function toggle(){state.running?pause(true):start();}
  function step20(){pause(false);for(let i=0;i<20;i++)trainOne();render(true);}
  function reset(){pause(false);state=initial();render(true);}
  els.run.addEventListener('click',toggle);els.step.addEventListener('click',step20);els.reset.addEventListener('click',reset);
  const ro=new ResizeObserver(()=>render(false));ro.observe(cv.parentElement);
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.running)pause(false);});
  window.addEventListener('pagehide',()=>{destroyed=true;if(timer)clearInterval(timer);ro.disconnect();},{once:true});
  render(false);
})();
</script>
</body>
</html>
