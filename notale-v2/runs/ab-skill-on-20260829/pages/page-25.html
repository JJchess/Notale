<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>把学习过程接成闭环</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{gap:20px}
  .page-head{flex:0 0 auto;display:flex;flex-direction:column;gap:7px;max-width:1240px;position:relative;z-index:1}
  .page-head .lead{color:var(--muted)}
  .board{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.72fr) minmax(360px,.68fr);gap:28px;position:relative;z-index:1}
  .loop-zone{min-width:0;min-height:0;display:flex;flex-direction:column;gap:16px;padding:22px 24px 20px;background:rgba(255,255,255,.7);border:2px solid var(--rule);border-radius:10px;box-shadow:0 7px 18px rgba(23,33,43,.08)}
  .zone-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
  .zone-top h2{margin-bottom:4px}
  .zone-top .small{max-width:620px}
  .counter{font-family:var(--font-num);font-size:var(--fs-label);font-weight:600;color:var(--muted);white-space:nowrap;padding-top:5px}
  .sequence{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;counter-reset:slot;position:relative}
  .sequence::before{content:"";position:absolute;left:8%;right:8%;top:62px;border-top:3px solid var(--rule);z-index:0}
  .piece-wrap{counter-increment:slot;position:relative;z-index:1;min-width:0}
  .piece-wrap:not(:last-child)::after{content:"";position:absolute;right:-18px;top:55px;width:12px;height:12px;border-top:3px solid var(--rule);border-right:3px solid var(--rule);transform:rotate(45deg);background:var(--bg)}
  .piece{width:100%;height:126px;border:3px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--text);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:8px;padding:16px;text-align:left;cursor:grab;box-shadow:0 4px 0 rgba(23,33,43,.12);transition:transform .16s ease,border-color .16s ease,background .16s ease}
  .piece:hover{border-color:var(--text)}
  .piece:active{cursor:grabbing}
  .piece[aria-pressed="true"]{border-color:var(--attention);background:var(--attention-soft);box-shadow:inset 0 0 0 2px var(--attention)}
  .piece.current{border-color:var(--model);background:var(--model-soft);transform:translateY(-5px)}
  .piece.failed{border-color:var(--gradient);background:var(--gradient-soft)}
  .piece.passed{border-color:var(--observed);background:var(--observed-soft)}
  .slot-no{font-family:var(--font-num);font-size:var(--fs-label);color:var(--muted)}
  .slot-no::before{content:counter(slot,"decimal-leading-zero")}
  .piece strong{font-family:var(--font-display);font-size:var(--fs-h2);line-height:1.15}
  .piece span:last-child{font-size:var(--fs-label);line-height:1.35;color:var(--muted)}
  .move-row{display:flex;align-items:center;gap:10px;min-height:46px;padding-bottom:2px;border-bottom:1px solid var(--rule-soft)}
  .move-row .hint{margin-right:auto}
  .move-row .btn{min-height:40px;padding:6px 13px}
  .evidence{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 238px;gap:18px;align-items:stretch}
  .track{min-width:0;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;gap:14px;padding:20px 14px;border-bottom:2px solid var(--rule);position:relative}
  .signal{min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);text-align:center}
  .signal-dot{width:34px;height:34px;border:3px solid currentColor;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--font-num);font-size:var(--fs-label);font-weight:600}
  .signal.active{color:var(--attention)}
  .signal.ok{color:var(--observed)}
  .signal.bad{color:var(--gradient)}
  .signal-label{font-size:var(--fs-label);line-height:1.3;min-height:38px;display:flex;align-items:flex-start}
  .closure{display:flex;flex-direction:column;justify-content:center;gap:10px;padding-left:18px;border-left:2px dashed var(--rule)}
  .closure svg{width:100%;height:96px;overflow:visible}
  .closure path{fill:none;stroke:var(--rule);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .closure circle{fill:var(--surface);stroke:var(--rule);stroke-width:3}
  .closure.done path,.closure.done circle{stroke:var(--observed)}
  .closure p{font-size:var(--fs-label);line-height:1.4;color:var(--muted)}
  .control-panel{min-width:0;min-height:0;display:flex;flex-direction:column;gap:18px}
  .control-panel .panel{padding:20px}
  .rule-box{display:flex;flex-direction:column;gap:13px}
  .rule-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  .rule-list li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:var(--fs-sec);line-height:1.42}
  .rule-mark{font-family:var(--font-num);font-size:var(--fs-label);font-weight:600;color:var(--model);padding-top:2px}
  .run-box{flex:1;display:flex;flex-direction:column;gap:14px;justify-content:space-between}
  .run-box h2{font-size:var(--fs-body)}
  .status{min-height:118px;padding-top:12px;border-top:1px solid var(--rule-soft);display:flex;flex-direction:column;gap:8px}
  .status strong{font-size:var(--fs-body);line-height:1.35}
  .status p{font-size:var(--fs-sec);line-height:1.45;color:var(--muted)}
  .status[data-state="success"] strong{color:var(--observed)}
  .status[data-state="error"] strong{color:var(--gradient)}
  .actions{display:grid;gap:10px}
  .actions .btn{width:100%}
  .primary{background:var(--model);border-color:var(--model);color:var(--surface);box-shadow:0 3px 0 #16477f}
  .primary:hover{background:#184f92}
  .primary:disabled{background:var(--bg);color:var(--disabled);border-color:var(--rule)}
  @media (prefers-reduced-motion:reduce){.piece{transition:none}}
</style>
</head>
<body data-page="25" data-total="25">
<div id="stage">
  <header class="page-head">
    <div class="kicker">学习闭环 · 终局检验</div>
    <h1>把四个环节接对，神经网络才能继续学</h1>
    <p class="lead">拖动环节，或选中后移动；再让信号沿你的顺序运行一圈。</p>
  </header>

  <main class="board min0">
    <section class="loop-zone min0" aria-labelledby="loop-title">
      <div class="zone-top">
        <div>
          <h2 id="loop-title">搭建学习链</h2>
          <p class="small">每个环节的产物，必须正好成为下一个环节的依据。</p>
        </div>
        <div class="counter" id="moveCount">已移动 0 次</div>
      </div>

      <ol class="sequence no-pan" id="sequence" aria-label="当前环节顺序"></ol>

      <div class="move-row">
        <p class="hint" id="selectionHint">选中一个环节后可逐格移动</p>
        <button class="btn" id="moveLeft" type="button" disabled>向前移一格</button>
        <button class="btn" id="moveRight" type="button" disabled>向后移一格</button>
      </div>

      <div class="evidence min0" aria-label="学习链运行证据">
        <div class="track" id="track"></div>
        <div class="closure" id="closure">
          <svg viewBox="0 0 210 100" role="img" aria-label="末端返回开头的闭环">
            <path d="M22 72 C28 18, 158 12, 184 52 M174 42 L184 52 L171 58"></path>
            <circle cx="22" cy="72" r="8"></circle>
          </svg>
          <p id="closureText">运行后检查：更新后的参数能否进入下一轮预测。</p>
        </div>
      </div>
    </section>

    <aside class="control-panel min0" aria-label="规则与运行控制">
      <section class="panel rule-box">
        <h2>四个接口</h2>
        <ul class="rule-list">
          <li><span class="rule-mark">P</span><span><strong>预测</strong>产生模型输出</span></li>
          <li><span class="rule-mark">C</span><span><strong>比较</strong>用标签得到误差</span></li>
          <li><span class="rule-mark">A</span><span><strong>归责</strong>把误差分给参数</span></li>
          <li><span class="rule-mark">U</span><span><strong>更新</strong>按梯度调整参数</span></li>
        </ul>
      </section>

      <section class="panel run-box">
        <div>
          <h2>运行结果</h2>
          <div class="status" id="status" aria-live="polite" data-state="idle">
            <strong>学习链尚未运行</strong>
            <p>先调整顺序。运行会停在第一个接口不匹配的位置。</p>
          </div>
        </div>
        <div class="actions">
          <button class="btn primary" id="runBtn" type="button">运行这条学习链</button>
          <button class="btn" id="resetBtn" type="button">恢复打乱顺序</button>
        </div>
      </section>
    </aside>
  </main>
</div>
<script src="assets/base.js"></script>
<script>
(() => {
  'use strict';
  Deck.init({index:25,total:25});

  const defs = {
    predict: {name:'预测', code:'P', product:'模型输出'},
    compare: {name:'比较', code:'C', product:'误差'},
    assign: {name:'归责', code:'A', product:'参数梯度'},
    update: {name:'更新', code:'U', product:'新参数'}
  };
  const follows = {predict:'compare', compare:'assign', assign:'update', update:'predict'};
  const startOrder = ['update','predict','assign','compare'];
  const sequence = document.getElementById('sequence');
  const track = document.getElementById('track');
  const status = document.getElementById('status');
  const moveCount = document.getElementById('moveCount');
  const selectionHint = document.getElementById('selectionHint');
  const moveLeft = document.getElementById('moveLeft');
  const moveRight = document.getElementById('moveRight');
  const runBtn = document.getElementById('runBtn');
  const resetBtn = document.getElementById('resetBtn');
  const closure = document.getElementById('closure');
  const closureText = document.getElementById('closureText');
  let timers = [];
  let state;

  function fresh(){ return {order:[...startOrder], selected:null, moves:0, phase:'idle', active:-1, passed:[], failed:-1}; }
  function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
  function transition(action){
    if(action.type === 'reset') return fresh();
    const next = {...state, order:[...state.order], passed:[...state.passed]};
    if(action.type === 'select' && next.phase !== 'running') next.selected = next.selected === action.id ? null : action.id;
    if(action.type === 'move' && next.selected && next.phase !== 'running'){
      const from = next.order.indexOf(next.selected);
      const to = from + action.delta;
      if(to >= 0 && to < next.order.length){
        [next.order[from], next.order[to]] = [next.order[to], next.order[from]];
        next.moves += 1; next.phase='idle'; next.active=-1; next.passed=[]; next.failed=-1;
      }
    }
    if(action.type === 'drop' && next.phase !== 'running'){
      const from = next.order.indexOf(action.id), to = action.to;
      if(from >= 0 && to >= 0 && to < next.order.length && from !== to){
        next.order.splice(from,1); next.order.splice(to,0,action.id);
        next.moves += 1; next.selected=action.id; next.phase='idle'; next.active=-1; next.passed=[]; next.failed=-1;
      }
    }
    if(action.type === 'run'){ next.phase='running'; next.selected=null; next.active=0; next.passed=[]; next.failed=-1; }
    if(action.type === 'step'){
      const i=action.index, here=next.order[i], after=next.order[(i+1)%next.order.length];
      next.active=i;
      if(follows[here] === after){ next.passed.push(i); }
      else { next.failed=i; next.phase='error'; }
    }
    if(action.type === 'advance') next.active=action.index;
    if(action.type === 'complete'){ next.phase='success'; next.active=-1; }
    return next;
  }
  function dispatch(action){ state=transition(action); render(); }

  function render(){
    sequence.innerHTML='';
    state.order.forEach((id,i) => {
      const li=document.createElement('li'); li.className='piece-wrap';
      const b=document.createElement('button');
      b.type='button'; b.className='piece'; b.draggable=state.phase!=='running'; b.dataset.id=id;
      b.setAttribute('aria-pressed', String(state.selected===id));
      b.setAttribute('aria-label', `第${i+1}位，${defs[id].name}，产物是${defs[id].product}`);
      if(state.active===i) b.classList.add('current');
      if(state.passed.includes(i)) b.classList.add('passed');
      if(state.failed===i) b.classList.add('failed');
      b.innerHTML=`<span class="slot-no" aria-hidden="true"></span><strong>${defs[id].name}</strong><span>产物：${defs[id].product}</span>`;
      b.addEventListener('click',()=>dispatch({type:'select',id}));
      b.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move';});
      li.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';});
      li.addEventListener('drop',e=>{e.preventDefault();dispatch({type:'drop',id:e.dataTransfer.getData('text/plain'),to:i});});
      li.appendChild(b); sequence.appendChild(li);
    });
    track.innerHTML='';
    state.order.forEach((id,i)=>{
      const s=document.createElement('div'); s.className='signal';
      if(state.active===i) s.classList.add('active');
      if(state.passed.includes(i)) s.classList.add('ok');
      if(state.failed===i) s.classList.add('bad');
      s.innerHTML=`<span class="signal-dot">${defs[id].code}</span><span class="signal-label">${defs[id].product}</span>`;
      track.appendChild(s);
    });
    moveCount.textContent=`已移动 ${state.moves} 次`;
    const index=state.selected ? state.order.indexOf(state.selected) : -1;
    moveLeft.disabled=index<=0 || state.phase==='running';
    moveRight.disabled=index<0 || index>=state.order.length-1 || state.phase==='running';
    selectionHint.textContent=state.selected ? `已选中“${defs[state.selected].name}”` : '选中一个环节后可逐格移动';
    runBtn.disabled=state.phase==='running';
    closure.classList.toggle('done',state.phase==='success');
    if(state.phase==='idle'){
      status.dataset.state='idle'; status.innerHTML='<strong>学习链尚未运行</strong><p>先调整顺序。运行会停在第一个接口不匹配的位置。</p>';
      closureText.textContent='运行后检查：更新后的参数能否进入下一轮预测。';
    } else if(state.phase==='running'){
      const id=state.order[state.active]; status.dataset.state='idle';
      status.innerHTML=`<strong>正在检查“${defs[id].name}”</strong><p>它产出的“${defs[id].product}”能否交给下一个环节？</p>`;
    } else if(state.phase==='error'){
      const i=state.failed, here=state.order[i], after=state.order[(i+1)%4], expected=follows[here];
      status.dataset.state='error'; status.innerHTML=`<strong>信号停在“${defs[here].name}”之后</strong><p>“${defs[here].product}”应交给“${defs[expected].name}”，现在接到的是“${defs[after].name}”。调整后再运行。</p>`;
      closureText.textContent='链条尚未闭合：先修复标出的接口。';
    } else {
      status.dataset.state='success'; status.innerHTML='<strong>学习闭环已接通</strong><p>预测产生输出，比较得到误差，归责算出梯度，更新后的参数回到下一轮预测。</p>';
      closureText.textContent='新参数已返回预测端，下一轮可以开始。';
    }
  }

  function run(){
    clearTimers(); dispatch({type:'run'});
    const delay=Deck.reduced()?40:430;
    state.order.forEach((id,i)=>{
      timers.push(setTimeout(()=>{
        if(state.phase!=='running') return;
        dispatch({type:'step',index:i});
        if(state.phase==='error') return;
        if(i===state.order.length-1) timers.push(setTimeout(()=>dispatch({type:'complete'}),delay));
        else timers.push(setTimeout(()=>{ if(state.phase==='running') dispatch({type:'advance',index:i+1}); },Math.round(delay*.55)));
      },i*delay));
    });
  }
  moveLeft.addEventListener('click',()=>dispatch({type:'move',delta:-1}));
  moveRight.addEventListener('click',()=>dispatch({type:'move',delta:1}));
  runBtn.addEventListener('click',run);
  resetBtn.addEventListener('click',()=>{clearTimers();dispatch({type:'reset'});sequence.querySelector('button')?.focus();});
  window.addEventListener('pagehide',clearTimers,{once:true});
  state=fresh(); render();
})();
</script>
</body>
</html>
