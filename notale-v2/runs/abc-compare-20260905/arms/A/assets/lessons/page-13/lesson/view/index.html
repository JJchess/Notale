<main class="rf-workbench" aria-label="随机森林训练代价与泛化表现视图">
  <!-- 顶部状态栏 -->
  <header class="rf-header">
    <div class="rf-title-group">
      <span class="rf-tag">RANDOM FOREST TRACE</span>
      <strong id="rfModelStatus" class="rf-status">等待执行 · 5 棵树 (max_features=2)</strong>
    </div>
    <div class="rf-kpi-group">
      <div class="kpi-item">
        <span class="kpi-label">切分评估代价</span>
        <span id="kpiCost" class="kpi-val cost-color">0</span>
      </div>
      <div class="kpi-item">
        <span class="kpi-label">OOB 泛化准确率</span>
        <span id="kpiOob" class="kpi-val acc-color">0.0%</span>
      </div>
    </div>
  </header>

  <!-- 主分析区域：两栏 -->
  <div class="rf-grid">
    <!-- 左半：基学习器卡片流 -->
    <section class="rf-panel" aria-label="各基学习器采样与切分决策">
      <h3 class="panel-h3">已构建决策基学习器 (Base Trees)</h3>
      <div id="treesContainer" class="trees-container">
        <!-- 动态注入树卡片 -->
      </div>
    </section>

    <!-- 右半：泛化表现与代价趋势对比 -->
    <section class="rf-panel" aria-label="随树增多的成本与准确率曲线">
      <h3 class="panel-h3">训练代价与 OOB 准确率收敛</h3>
      <div class="chart-box">
        <svg id="chartSvg" class="chart-svg" viewBox="0 0 380 200" preserveAspectRatio="none">
          <!-- 刻度线 -->
          <line x1="40" y1="30" x2="360" y2="30" class="grid-line" />
          <line x1="40" y1="90" x2="360" y2="90" class="grid-line" />
          <line x1="40" y1="150" x2="360" y2="150" class="grid-line" />
          <!-- 坐标轴 -->
          <line x1="40" y1="160" x2="365" y2="160" class="axis-line" />
          <line x1="40" y1="20" x2="40" y2="160" class="axis-line" />
          <!-- 折线 path -->
          <path id="pathAcc" class="path-acc" d="" />
          <path id="pathCost" class="path-cost" d="" />
          <!-- 数据点容器 -->
          <g id="chartPoints"></g>
        </svg>
        <div class="chart-legend">
          <span class="legend-item"><i class="sw-acc"></i> OOB 泛化准确率 (%)</span>
          <span class="legend-item"><i class="sw-cost"></i> 累积计算耗费</span>
        </div>
      </div>

      <!-- 核心教学对比小结 -->
      <div class="insights-card">
        <div class="insight-row">
          <span class="insight-label">特征子采样影响:</span>
          <span class="insight-desc">max_features 越小，单树耗时越低且树间相关性越低；但特征过少会削弱单树拟合能力。</span>
        </div>
        <div class="insight-row">
          <span class="insight-label">基学习器规模:</span>
          <span class="insight-desc">n_estimators 增加使 OOB 误差趋于平稳收敛（不增加过拟合风险），代价随树线性增加。</span>
        </div>
      </div>
    </section>
  </div>

  <!-- 底部注记与提示 -->
  <footer class="rf-footer">
    <p id="rfAnnotation" class="rf-annotation">运行 starter.py 查看随机森林构建过程，观察树数量与特征随机性如何影响耗费与准确率。</p>
  </footer>
</main>
