<main class="boosting-view">
  <header class="proof-heading">
    <div class="scope-tags">
      <span class="scope-tag">BOOSTING STUMPS</span>
      <span class="scope-divider">/</span>
      <span id="roundIndicator" class="scope-val">ROUND 0/6</span>
    </div>
    <div class="metric-badge" id="mseBadge">MSE: 1.6240</div>
  </header>

  <!-- 上图：输入空间 x 上的拟合曲线与真实样本 -->
  <section class="chart-section" aria-label="拟合曲线与样本散点">
    <div class="chart-header">
      <span class="chart-title">输入空间与集成预测 F_m(x)</span>
      <div class="chart-legend">
        <span class="legend-item"><i class="dot sample-dot"></i>真实观测 y</span>
        <span class="legend-item"><i class="line pred-line"></i>集成曲线 F_m(x)</span>
        <span class="legend-item"><i class="line stump-line"></i>当前桩划分点 s_m</span>
      </div>
    </div>
    <div class="canvas-wrap" id="fitCanvasWrap">
      <svg id="fitSvg" class="plot-svg" viewBox="0 0 520 180" preserveAspectRatio="none">
        <g id="fitGrid" class="grid-layer"></g>
        <line id="splitLine" class="split-line" x1="0" y1="0" x2="0" y2="180" visibility="hidden"></line>
        <path id="fitPath" class="fit-path" d=""></path>
        <g id="samplePoints"></g>
      </svg>
    </div>
  </section>

  <!-- 下图：当前轮次拟合的残差分布 -->
  <section class="chart-section" aria-label="残差与弱学习器拟合">
    <div class="chart-header">
      <span class="chart-title">当前残差 r_i = y_i - F_{m-1}(x_i) 及基桩拟合台阶</span>
      <span class="step-desc" id="stumpDesc">等待运行...</span>
    </div>
    <div class="canvas-wrap" id="resCanvasWrap">
      <svg id="resSvg" class="plot-svg" viewBox="0 0 520 120" preserveAspectRatio="none">
        <line class="zero-line" x1="0" y1="60" x2="520" y2="60"></line>
        <g id="resBars"></g>
        <path id="stumpStepPath" class="stump-path" d=""></path>
      </svg>
    </div>
  </section>

  <footer class="view-footer">
    <p class="annotation" id="viewAnnotation" aria-live="polite">初态：总预测为均值，点击「运行」查看逐步拟合。</p>
    <dl class="metrics-grid" id="metricsGrid"></dl>
  </footer>
</main>
