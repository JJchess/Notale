<main class="rf-view" aria-label="随机森林实验监控视图">
  <!-- 顶栏状态 -->
  <header class="rf-header">
    <div class="rf-title-group">
      <span class="rf-kicker">ENSEMBLE DYNAMICS</span>
      <h2 id="rfStatusTitle" class="rf-status-title">随机森林待运行</h2>
    </div>
    <div class="rf-badge-group">
      <div class="rf-badge">
        <span class="badge-label">树数量 T</span>
        <strong id="badgeTrees" class="badge-val">12</strong>
      </div>
      <div class="rf-badge">
        <span class="badge-label">特征抽样 m/M</span>
        <strong id="badgeFeatures" class="badge-val">3 / 8</strong>
      </div>
      <div class="rf-badge highlight">
        <span class="badge-label">当前 OOB 误差</span>
        <strong id="badgeOOB" class="badge-val">0.4500</strong>
      </div>
    </div>
  </header>

  <!-- 主分析仪表盘：分上下两层 -->
  <div class="rf-dashboard">
    <!-- 上半区：特征子空间采样矩阵 + 当前树特征激活 -->
    <section class="rf-panel feature-panel" aria-label="特征空间随机子采样">
      <div class="panel-head">
        <span class="panel-tag">FEATURE SUBSAMPLING</span>
        <span class="panel-subtitle">每次分裂从 8 个特征中随机抽取 <b id="subFeatureCount">3</b> 个候选</span>
      </div>
      <div class="features-pool" id="featuresPool">
        <!-- 8 个特征插槽 -->
      </div>
      <div class="trees-strip-container">
        <div class="strip-label">基学习器特征指纹列阵（最新 16 棵树）：</div>
        <div class="trees-matrix" id="treesMatrix"></div>
      </div>
    </section>

    <!-- 下半区：OOB 泛化误差收敛曲线 + 训练耗时条 -->
    <section class="rf-panel error-panel" aria-label="OOB泛化误差收敛曲线">
      <div class="panel-head">
        <span class="panel-tag">GENERALIZATION & COST</span>
        <span class="panel-subtitle">OOB 误差随树数量增加的收敛衰减曲线</span>
      </div>
      
      <div class="chart-wrapper">
        <svg id="oobChartSvg" class="chart-svg" viewBox="0 0 540 160" preserveAspectRatio="none">
          <defs>
            <linearGradient id="oobGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#b63b24" stop-opacity="0.32" />
              <stop offset="100%" stop-color="#b63b24" stop-opacity="0.02" />
            </linearGradient>
          </defs>
          <!-- 参考辅助线 -->
          <line x1="36" y1="20" x2="520" y2="20" class="guide-line" />
          <line x1="36" y1="65" x2="520" y2="65" class="guide-line" />
          <line x1="36" y1="110" x2="520" y2="110" class="guide-line" />
          <line x1="36" y1="140" x2="520" y2="140" class="axis-line" />
          <line x1="36" y1="10" x2="36" y2="140" class="axis-line" />

          <!-- 刻度文字 -->
          <text x="30" y="24" class="chart-tick">0.45</text>
          <text x="30" y="69" class="chart-tick">0.30</text>
          <text x="30" y="114" class="chart-tick">0.15</text>
          <text x="30" y="144" class="chart-tick">0.00</text>
          
          <!-- 面积与折线 -->
          <polygon id="oobArea" points="" fill="url(#oobGrad)" />
          <polyline id="oobPolyline" points="" fill="none" stroke="#b63b24" stroke-width="2.5" stroke-linejoin="round" />
          <g id="oobPoints"></g>
        </svg>
      </div>

      <!-- 成本与收益读数栏 -->
      <div class="cost-summary">
        <div class="cost-col">
          <span class="cost-label">累计特征分裂开销：</span>
          <span id="costValue" class="cost-data">0</span>
        </div>
        <div class="cost-col">
          <span class="cost-label">集成方差降低效果：</span>
          <span id="varianceEffect" class="cost-data" style="color: #275d91;">初始状态</span>
        </div>
      </div>
    </section>
  </div>

  <!-- 底部注记栏 -->
  <footer class="rf-footer">
    <p id="viewAnnotation" class="rf-annotation">运行代码开始训练随机森林，观察树逐步增加时 OOB 误差的收敛轨迹与特征采样分布。</p>
  </footer>
</main>
