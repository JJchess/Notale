<main class="boosting-view">
  <!-- 顶部状态栏：实验参数与轮数 -->
  <header class="boosting-header">
    <div class="header-tags">
      <span class="badge badge-lr" id="tagLr">η = 0.40</span>
      <span class="badge badge-round" id="tagRound">Round 0 / 12</span>
    </div>
    <div class="header-overfit-alert" id="overfitBadge" hidden>
      <span class="alert-dot"></span> 过拟合预警：验证误差回升
    </div>
  </header>

  <!-- 上半区：数据散点与 Boosting 拟合曲线对比 -->
  <section class="chart-section" aria-label="拟合曲线与样本点">
    <div class="chart-title-bar">
      <span class="chart-label">拟合状态 (F_m(x) 与样本点)</span>
      <div class="chart-legend">
        <span class="leg-item"><i class="leg-dot train-dot"></i>训练样本</span>
        <span class="leg-item"><i class="leg-dot val-dot"></i>验证样本</span>
        <span class="leg-item"><i class="leg-line model-line"></i>模型预测 F_m(x)</span>
        <span class="leg-item"><i class="leg-line stump-split"></i>当前树桩切分</span>
      </div>
    </div>
    <div class="chart-canvas-wrap">
      <svg id="fitSvg" class="fit-svg" viewBox="0 0 540 220" preserveAspectRatio="none">
        <!-- 网格背景 -->
        <g class="grid-lines" id="fitGrid"></g>
        <!-- 树桩当前切分垂直线 -->
        <line id="stumpSplitLine" class="split-line" y1="15" y2="205" x1="-10" x2="-10" />
        <!-- 模型阶梯预测线 -->
        <path id="fitModelPath" class="model-path" d="" />
        <!-- 样本点连线或点 -->
        <g id="dataPoints"></g>
      </svg>
    </div>
  </section>

  <!-- 下半区：双轴学习曲线（训练 MSE vs 验证 MSE） -->
  <section class="chart-section" aria-label="训练与验证误差演进">
    <div class="chart-title-bar">
      <span class="chart-label">误差演进曲线 (过拟合监控)</span>
      <div class="chart-legend">
        <span class="leg-item"><i class="leg-line-dot train-loss-line"></i>训练 MSE</span>
        <span class="leg-item"><i class="leg-line-dot val-loss-line"></i>验证 MSE</span>
      </div>
    </div>
    <div class="chart-canvas-wrap">
      <svg id="lossSvg" class="loss-svg" viewBox="0 0 540 160" preserveAspectRatio="none">
        <g class="grid-lines" id="lossGrid"></g>
        <path id="trainLossPath" class="loss-path train-loss" d="" />
        <path id="valLossPath" class="loss-path val-loss" d="" />
        <g id="lossPoints"></g>
      </svg>
    </div>
  </section>

  <!-- 底部教学解读与核心度量 -->
  <footer class="boosting-footer">
    <p class="annotation" id="viewAnnotation" aria-live="polite">
      初始基准预测 F0(x) 为均值；准备逐轮由决策树桩拟合负梯度（残差）。
    </p>
    <dl class="metrics" id="viewMetrics" aria-label="核心指标读数"></dl>
  </footer>
</main>
