<main class="forest-view">
  <header class="forest-header">
    <div class="scope" aria-hidden="true">
      <span id="algorithmName">RANDOM FOREST</span>
      <span class="scope-separator">/</span>
      <span id="sampleCount">T = 0 TREES</span>
    </div>
    <div class="legend-strip">
      <span class="legend-item"><i class="dot learner"></i>单树阶段指标</span>
      <span class="legend-item"><i class="dot aggregate"></i>集成累计测试准度</span>
    </div>
  </header>

  <section class="forest-chart-area" aria-label="随机森林学习动态图">
    <div class="plot-bg-lines" aria-hidden="true">
      <div class="grid-line" style="top: 0%"><span class="tick-label">100%</span></div>
      <div class="grid-line" style="top: 25%"><span class="tick-label">75%</span></div>
      <div class="grid-line" style="top: 50%"><span class="tick-label">50%</span></div>
      <div class="grid-line" style="top: 75%"><span class="tick-label">25%</span></div>
      <div class="grid-line" style="top: 100%"><span class="tick-label">0%</span></div>
    </div>
    <svg class="chart-svg" id="chartSvg" viewBox="0 0 600 320" preserveAspectRatio="none">
      <defs>
        <linearGradient id="accGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#b63b24" stop-opacity="0.32" />
          <stop offset="100%" stop-color="#b63b24" stop-opacity="0.0" />
        </linearGradient>
      </defs>
      <path id="accArea" class="chart-area" d="" />
      <path id="accPath" class="chart-line" d="" />
      <g id="pointsGroup"></g>
    </svg>
    <div class="trees-ribbon" id="treesRibbon" aria-label="树成员状态列表"></div>
  </section>

  <footer class="forest-footer">
    <p class="annotation" id="viewAnnotation" aria-live="polite">准备训练随机森林...</p>
    <dl class="metrics" id="viewMetrics" aria-label="当前指标"></dl>
  </footer>
</main>
