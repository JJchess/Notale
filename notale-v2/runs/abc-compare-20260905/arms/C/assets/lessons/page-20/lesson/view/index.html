<main class="boosting-view">
  <header class="view-header">
    <div class="header-left">
      <span class="badge" id="roundBadge">ROUND 0 / 6</span>
      <span class="lr-badge" id="lrBadge">η = 0.3</span>
    </div>
    <div class="header-right">
      <div class="legend-item"><span class="dot train-dot"></span>训练样本 y</div>
      <div class="legend-item"><span class="dot test-dot"></span>测试样本 y_test</div>
      <div class="legend-item"><span class="line-swatch pred-swatch"></span>当前总预测 F_m(x)</div>
    </div>
  </header>

  <!-- 上半区：拟合曲线与样本点 -->
  <section class="fit-stage" aria-label="拟合曲线与样本分布">
    <svg id="fitSvg" class="fit-svg" viewBox="0 0 540 240" preserveAspectRatio="none">
      <!-- 网格与刻度 -->
      <g id="gridLines" class="grid-lines"></g>
      <!-- 切分竖线指示 -->
      <line id="splitLine" class="split-line" x1="0" y1="0" x2="0" y2="240" style="display:none;"></line>
      <!-- 集成预测折线/分段线 -->
      <path id="predPath" class="pred-path" d=""></path>
      <!-- 样本散点 -->
      <g id="testPointsGroup"></g>
      <g id="trainPointsGroup"></g>
    </svg>
    <div class="axis-label x-axis">特征 x (1.0 ~ 8.0)</div>
    <div class="axis-label y-axis">目标 y</div>
  </section>

  <!-- 中间：单轮弱桩与残差拟合状态指示 -->
  <section class="residual-bar" aria-label="当前轮次信息">
    <div class="res-info">
      <span class="label">当前动作</span>
      <strong id="opTitle" class="value">初始常数预测</strong>
    </div>
    <div class="res-split" id="splitInfo">
      <span class="label">决策桩切分</span>
      <strong id="splitVal" class="value">—</strong>
    </div>
    <div class="res-step">
      <span class="label">更新步长</span>
      <strong id="stepVal" class="value">η · h_m(x)</strong>
    </div>
  </section>

  <!-- 下半区：残差分布小图 + 误差指标跟踪 -->
  <footer class="view-footer">
    <div class="res-stage" aria-label="样本残差分布">
      <div class="res-stage-title">负梯度 / 待拟合残差 (r = y - F)</div>
      <svg id="residualSvg" class="res-svg" viewBox="0 0 300 70" preserveAspectRatio="none">
        <line class="zero-line" x1="0" y1="35" x2="300" y2="35"></line>
        <g id="resLollipops"></g>
      </svg>
    </div>
    <div class="metrics-card">
      <div class="metric-row">
        <span class="m-label">训练 MSE:</span>
        <span id="trainMseVal" class="m-val train-val">1.684</span>
      </div>
      <div class="metric-row">
        <span class="m-label">测试 MSE:</span>
        <span id="testMseVal" class="m-val test-val">1.750</span>
      </div>
      <div class="metric-desc" id="mseDesc">
        低学习率可精细修正，需更多轮次；高学习率轮数过多易过度拟合噪声。
      </div>
    </div>
  </footer>

  <p id="viewAnnotation" class="view-annotation" aria-live="polite">
    初始常数预测 F_0(x)；运行后观察弱桩如何沿梯度方向逐轮拟合残差。
  </p>
</main>
