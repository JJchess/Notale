<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      position: relative;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: var(--pad-y) var(--pad-x);
    }

    #field-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .header-block {
      position: relative;
      z-index: 2;
      max-width: 760px;
      margin-top: 48px;
    }

    .chapter-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-sec);
      font-weight: 600;
      color: var(--learner);
      letter-spacing: 0.04em;
      margin-bottom: 16px;
    }

    .chapter-tag::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--learner);
    }

    h1.title {
      font-size: var(--fs-h1);
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      margin: 0 0 16px 0;
    }

    p.lead-text {
      font-size: var(--fs-lead);
      line-height: 1.5;
      color: var(--muted);
      margin: 0;
      max-width: 680px;
    }

    /* 底部章节概览指标卡 */
    .footer-dock {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 1080px;
      margin-bottom: 24px;
    }

    .dock-card {
      background: rgba(247, 250, 252, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid var(--surface-strong);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .dock-card .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: var(--fs-sec);
      color: var(--muted);
      font-weight: 600;
    }

    .dock-card .card-val {
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .dock-card .card-desc {
      font-size: var(--fs-label);
      color: var(--muted);
      line-height: 1.45;
    }

    .ensemble-indicator {
      position: absolute;
      right: var(--pad-x);
      top: 48px;
      z-index: 2;
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: var(--fs-label);
      color: var(--muted);
      background: rgba(247, 250, 252, 0.75);
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--surface-strong);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dot-learner {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--learner);
    }

    .dot-agg {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--aggregate);
    }
  </style>
</head>
<body data-page="07" data-total="27">
  <div id="stage">
    <canvas id="field-canvas" class="cv-fill" aria-hidden="true"></canvas>

    <div class="ensemble-indicator">
      <div class="legend-row">
        <span class="legend-item"><span class="dot-learner"></span>独立决策树分支 (Bootstrap 抽样)</span>
        <span class="legend-item"><span class="dot-agg"></span>多数表决合流 (方差衰减)</span>
      </div>
    </div>

    <header class="header-block">
      <div class="chapter-tag">CHAPTER 02 · 并行集成范式</div>
      <h1 class="title">Bagging 与随机森林</h1>
      <p class="lead-text">
        通过有放回抽样制造互有差异的训练子集，并引入随机特征子采样，
        让不稳定的单棵决策树在投票合流中瓦解方差。
      </p>
    </header>

    <div class="footer-dock">
      <div class="dock-card">
        <div class="card-head">
          <span>抽样重合度</span>
          <span style="color: var(--learner)">1 - 1/e</span>
        </div>
        <div class="card-val">≈ 63.2% 覆盖</div>
        <div class="card-desc">Bootstrap 每次约留出 36.8% 袋外样本作为天然验证集。</div>
      </div>
      <div class="dock-card">
        <div class="card-head">
          <span>核心消除目标</span>
          <span style="color: var(--aggregate)">Variance</span>
        </div>
        <div class="card-val">降低模型方差</div>
        <div class="card-desc">基学习器保持低偏差与强拟合，由并行平均平抑预测波动。</div>
      </div>
      <div class="dock-card">
        <div class="card-head">
          <span>去相关机制</span>
          <span style="color: var(--learner)">Random Subspace</span>
        </div>
        <div class="card-val">特征随机子空间</div>
        <div class="card-desc">节点分裂仅随机考察 √d 个特征，彻底打破强特征垄断。</div>
      </div>
    </div>
  </div>

  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("field-canvas");
      let ctx = null;

      // 确定性伪随机数发生器
      function createRng(seed) {
        let s = seed >>> 0;
        return () => {
          s = (s + 0x6d2b79f5) >>> 0;
          let n = s;
          n = Math.imul(n ^ (n >>> 15), n | 1);
          n ^= n + Math.imul(n ^ (n >>> 7), n | 61);
          return ((n ^ (n >>> 14)) >>> 0) / 4294967296;
        };
      }

      // 生成多棵决策树的分裂与汇入模型
      // 树的根节点分布在画布右半区 (x: 820 ~ 1520, y: 720 ~ 840)
      // 树枝向上随机分叉扩散，最后各个树的终点汇总流向中央/右上方的集成投票焦点
      const SEED = 20240907;
      let forestData = null;

      function buildForest() {
        const rng = createRng(SEED);
        const trees = [];
        const treeCount = 7; // 7棵并行决策树代表群落

        const titleBox = { x: 56, y: 40, w: 740, h: 420 };
        const dockBox = { x: 56, y: 640, w: 1040, h: 220 };

        function hitAvoid(x, y) {
          if (x >= titleBox.x && x <= titleBox.x + titleBox.w && y >= titleBox.y && y <= titleBox.y + titleBox.h) return true;
          if (x >= dockBox.x && x <= dockBox.x + dockBox.w && y >= dockBox.y && y <= dockBox.y + dockBox.h) return true;
          return false;
        }

        // 目标汇总点：多数表决中枢
        const consensusPoint = { x: 1360, y: 220 };

        for (let t = 0; t < treeCount; t++) {
          const rootX = 900 + t * 90 + (rng() - 0.5) * 50;
          const rootY = 820 + (rng() - 0.5) * 40;

          // 用有向递归分支生成树结构
          const branches = [];
          const leafNodes = [];

          function grow(x1, y1, angle, length, depth, maxDepth) {
            if (depth > maxDepth) {
              leafNodes.push({ x: x1, y: y1, depth });
              return;
            }
            const nx = x1 + Math.cos(angle) * length;
            const ny = y1 + Math.sin(angle) * length;
            branches.push({
              x1, y1, x2: nx, y2: ny,
              depth,
              treeIndex: t,
              isAvoided: hitAvoid(nx, ny)
            });

            // 分裂出 2 个分支 (二叉决策树)
            const spread = 0.38 + rng() * 0.22;
            const lenDecay = 0.72 + rng() * 0.12;

            // 子分支1
            grow(nx, ny, angle - spread, length * lenDecay, depth + 1, maxDepth);
            // 子分支2
            grow(nx, ny, angle + spread, length * lenDecay, depth + 1, maxDepth);
          }

          const baseAngle = -Math.PI / 2 + (rng() - 0.5) * 0.3;
          grow(rootX, rootY, baseAngle, 105 + rng() * 30, 1, 4);

          trees.push({
            root: { x: rootX, y: rootY },
            branches,
            leaves: leafNodes
          });
        }

        // 生成从各树主要叶节点连接到 consensusPoint 的集成连接流线 (Voting ensemble cords)
        const ensembleCords = [];
        trees.forEach((tree, tidx) => {
          // 每棵树挑选 3 个代表性强叶节点流向共识点
          const sampled = [tree.leaves[0], tree.leaves[Math.floor(tree.leaves.length / 2)], tree.leaves[tree.leaves.length - 1]];
          sampled.forEach(leaf => {
            if (leaf) {
              ensembleCords.push({
                x1: leaf.x,
                y1: leaf.y,
                x2: consensusPoint.x,
                y2: consensusPoint.y,
                treeIndex: tidx
              });
            }
          });
        });

        // 空间数据点 (模拟被决策边界划分的样本点)
        const samples = [];
        for (let i = 0; i < 90; i++) {
          const sx = 840 + rng() * 700;
          const sy = 120 + rng() * 680;
          if (!hitAvoid(sx, sy)) {
            samples.push({
              x: sx,
              y: sy,
              cls: rng() > 0.48 ? 1 : 0,
              size: 3 + rng() * 2.5
            });
          }
        }

        return { trees, ensembleCords, consensusPoint, samples };
      }

      function drawScene(ctx) {
        const W = 1600;
        const H = 900;
        ctx.clearRect(0, 0, W, H);

        if (!forestData) forestData = buildForest();
        const { trees, ensembleCords, consensusPoint, samples } = forestData;

        // 1. 绘制网格参考线底衬 (轻微仪器感)
        ctx.save();
        ctx.strokeStyle = "rgba(83, 103, 119, 0.08)";
        ctx.lineWidth = 1;
        for (let x = 800; x <= 1550; x += 60) {
          ctx.beginPath();
          ctx.moveTo(x, 40);
          ctx.lineTo(x, 860);
          ctx.stroke();
        }
        for (let y = 100; y <= 840; y += 60) {
          ctx.beginPath();
          ctx.moveTo(800, y);
          ctx.lineTo(1550, y);
          ctx.stroke();
        }
        ctx.restore();

        // 2. 绘制散落的数据样本点
        samples.forEach(pt => {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
          if (pt.cls === 1) {
            ctx.fillStyle = "rgba(39, 93, 145, 0.28)";
          } else {
            ctx.fillStyle = "rgba(182, 59, 36, 0.22)";
          }
          ctx.fill();
        });

        // 3. 绘制各决策树的树干和分支
        trees.forEach((tree, tidx) => {
          // 树根基座
          ctx.fillStyle = "rgba(39, 93, 145, 0.6)";
          ctx.beginPath();
          ctx.arc(tree.root.x, tree.root.y, 4, 0, Math.PI * 2);
          ctx.fill();

          tree.branches.forEach(b => {
            ctx.beginPath();
            ctx.moveTo(b.x1, b.y1);
            ctx.lineTo(b.x2, b.y2);
            const alpha = 0.55 - b.depth * 0.08;
            ctx.strokeStyle = `rgba(39, 93, 145, ${alpha.toFixed(2)})`;
            ctx.lineWidth = Math.max(1.2, 4.5 - b.depth * 0.8);
            ctx.lineCap = "round";
            ctx.stroke();

            // 在节点分裂处画决策判定小圆
            if (b.depth <= 3) {
              ctx.beginPath();
              ctx.arc(b.x1, b.y1, 2.5, 0, Math.PI * 2);
              ctx.fillStyle = "rgba(215, 225, 232, 0.9)";
              ctx.fill();
              ctx.strokeStyle = "rgba(39, 93, 145, 0.7)";
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          });

          // 叶节点
          tree.leaves.forEach(lf => {
            ctx.beginPath();
            ctx.arc(lf.x, lf.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(39, 93, 145, 0.75)";
            ctx.fill();
          });
        });

        // 4. 绘制汇入共识中枢的贝塞尔曲线 (Ensemble cords)
        ensembleCords.forEach(cord => {
          ctx.beginPath();
          ctx.moveTo(cord.x1, cord.y1);
          const cp1x = cord.x1 + (consensusPoint.x - cord.x1) * 0.3;
          const cp1y = cord.y1 - 60;
          const cp2x = cord.x1 + (consensusPoint.x - cord.x1) * 0.7;
          const cp2y = consensusPoint.y + 40;
          ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, consensusPoint.x, consensusPoint.y);
          ctx.strokeStyle = "rgba(182, 59, 36, 0.32)";
          ctx.lineWidth = 1.4;
          ctx.setLineDash([4, 4]);
          ctx.stroke();
          ctx.setLineDash([]);
        });

        // 5. 绘制集成决策共识中枢 (Consensus Node)
        ctx.save();
        // 外发光环
        ctx.beginPath();
        ctx.arc(consensusPoint.x, consensusPoint.y, 36, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(182, 59, 36, 0.08)";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(consensusPoint.x, consensusPoint.y, 22, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(182, 59, 36, 0.16)";
        ctx.fill();

        // 核心实心圆
        ctx.beginPath();
        ctx.arc(consensusPoint.x, consensusPoint.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = "#B63B24";
        ctx.fill();

        // 中枢标注
        ctx.font = "600 13px 'DIN Alternate', var(--font-sans)";
        ctx.fillStyle = "#B63B24";
        ctx.textAlign = "center";
        ctx.fillText("MAJORITY VOTE", consensusPoint.x, consensusPoint.y + 42);
        ctx.font = "13px var(--font-sans)";
        ctx.fillStyle = "#536777";
        ctx.fillText("多数表决合流 (降低方差)", consensusPoint.x, consensusPoint.y + 60);
        ctx.restore();
      }

      Deck.init({ index: 7, total: 27 });
      Deck.autofit(canvas, (c) => {
        ctx = c;
        drawScene(ctx);
      });
    })();
  </script>
</body>
</html>
