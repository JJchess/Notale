<main class="rf-diagnostics">
  <header class="rf-header">
    <div class="rf-kicker">RANDOM FOREST · OOB & IMPORTANCE</div>
    <div class="rf-summary-strip">
      <div class="summary-pill">
        <span class="pill-label">OOB 准确率</span>
        <strong id="oobReadout" class="pill-val">100.0%</strong>
      </div>
      <div class="summary-pill">
        <span class="pill-label">树总数</span>
        <strong id="treeCountReadout" class="pill-val">5 棵</strong>
      </div>
      <div class="summary-pill">
        <span class="pill-label">特征候选数</span>
        <strong class="pill-val">max_features=2</strong>
      </div>
    </div>
  </header>

  <section class="rf-body">
    <!-- 左/上半：森林各基学习器状态表 -->
    <div class="trees-panel">
      <div class="panel-caption">
        <span>基学习器列表 (Bootstrap & 子采样)</span>
        <span class="sub-hint">每棵树仅见约 63.2% 独有样本，其余作为袋外验证</span>
      </div>
      <div id="treesList" class="trees-grid" role="list"></div>
    </div>

    <!-- 右/下半：特征重要性条形图 -->
    <div class="importance-panel">
      <div class="panel-caption">
        <span>特征重要性诊断 (分裂频次占比)</span>
        <span class="sub-hint">噪声特征 f2 几乎不被选为分裂点</span>
      </div>
      <div id="importanceBars" class="bars-stack"></div>
    </div>
  </section>

  <footer class="rf-footer">
    <p id="viewAnnotation" class="rf-annotation" aria-live="polite">
      随机森林模型概览：5 棵树通过样本与特征双重随机性集成，兼顾低偏差与低方差。
    </p>
    <div id="statusMetrics" class="status-metrics"></div>
  </footer>
</main>
