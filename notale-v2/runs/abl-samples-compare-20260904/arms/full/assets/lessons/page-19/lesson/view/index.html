<main class="curve-workbench">
  <header class="curve-header">
    <div class="header-left">
      <span class="badge">GRADIENT BOOSTING CURVE</span>
      <h2 id="statusTitle">训练与验证集均方误差 (MSE) 演化</h2>
    </div>
    <div class="legend-group">
      <div class="legend-item train">
        <span class="legend-line train-line"></span>
        <span>训练集 (Train MSE)</span>
      </div>
      <div class="legend-item val">
        <span class="legend-line val-line"></span>
        <span>验证集 (Val MSE)</span>
      </div>
      <div class="legend-item early-stop">
        <span class="legend-marker"></span>
        <span>最优早停点 (Best)</span>
      </div>
    </div>
  </header>

  <!-- SVG 图表区 -->
  <section class="chart-container" aria-label="梯度提升学习曲线图">
    <svg id="curveSvg" class="curve-svg" viewBox="0 0 760 360" preserveAspectRatio="none">
      <!-- 坐标网格 -->
      <g id="gridLayer" class="grid-layer"></g>
      <!-- 背景警戒区域（迭代不足 / 良好 / 迭代过度） -->
      <g id="zoneLayer" class="zone-layer"></g>
      <!-- 曲线折线 -->
      <path id="trainPath" class="path-line path-train" d=""></path>
      <path id="valPath" class="path-line path-val" d=""></path>
      <!-- 数据点与早停标线 -->
      <g id="pointsLayer" class="points-layer"></g>
      <g id="bestMarkerLayer" class="marker-layer"></g>
      <!-- 坐标轴标签 -->
      <g id="axisLayer" class="axis-layer"></g>
    </svg>
  </section>

  <!-- 底部指标与诊断状态栏 -->
  <footer class="curve-footer">
    <div class="status-box">
      <div class="status-label">诊断与机制提示</div>
      <div id="statusDesc" class="status-desc">运行代码后将实时显示模型处于迭代不足、最优还是过度区间。</div>
    </div>
    <div class="metric-strip" id="metricStrip">
      <div class="metric-card">
        <span class="lbl">当前轮数 m</span>
        <strong id="metricStep" class="val">-</strong>
      </div>
      <div class="metric-card">
        <span class="lbl">训练集 MSE</span>
        <strong id="metricTrain" class="val text-train">-</strong>
      </div>
      <div class="metric-card">
        <span class="lbl">验证集 MSE</span>
        <strong id="metricVal" class="val text-val">-</strong>
      </div>
      <div class="metric-card highlight">
        <span class="lbl">最优验证轮次</span>
        <strong id="metricBest" class="val text-best">-</strong>
      </div>
    </div>
  </footer>
</main>
