<!doctype html>
<html lang="zh">
<head>

  <title>集成学习：让一组模型共同作出更稳健的判断</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F6F8;
      --text: #122634;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
    }
    #stage {
      position: relative;
      overflow: hidden;
      background: radial-gradient(1200px 700px at 78% 46%, rgba(39, 100, 143, 0.08), transparent 70%),
                  radial-gradient(900px 600px at 15% 85%, rgba(47, 117, 104, 0.07), transparent 65%),
                  #F2F6F8;
      padding: var(--pad-y) var(--pad-x);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
    }
    #cover-cv {
      z-index: 1;
      pointer-events: none;
    }
    .hero-wrap {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      max-width: 780px;
      margin-top: 30px;
    }
    .chapter-tag {
      font-size: 15px;
      font-weight: 600;
      color: var(--model);
      letter-spacing: 0.12em;
      margin-bottom: 22px;
    }
    .hero-title {
      font-size: 58px;
      font-weight: 800;
      line-height: 1.15;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }
    .hero-title em {
      font-style: normal;

    }
    .hero-lead {
      font-size: var(--fs-lead);

    .core-pillars {

    .pillar-val {
      font-size: 17px;

    .pillar-sep {
      width: 1px;

    }

    /* 底部统计与交互说明 */
    .foot-bar {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 12px;
      border-top: 1px solid rgba(83, 106, 120, 0.15);
      padding-top: 18px;
    }
    .foot-note {
      font-size: 14px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ensemble-flow-hint {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 14px;
      font-family: var(--font-num);
      color: var(--muted);
    }
    .ensemble-flow-hint span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .ensemble-flow-hint strong {
      color: var(--text);
      font-weight: 600;
    }
    .interactive-badge {
      display: inline-block;
      padding: 3px 10px;

      color: var(--model);
      font-size: 13px;

      border-radius: 4px;
    }
  </style>
</head>
<body data-page="01" data-total="27">
  <div id="stage" tabindex="0" aria-label="集成学习封面。移动指针可在生成场中产生扰动，点击画面激发多模型向统一判断汇聚的决策流。">
    <canvas id="cover-cv" class="cv-fill no-pan" aria-hidden="true"></canvas>

    <div class="hero-wrap">
      <p class="chapter-tag">机器学习概论 · 第八讲</p>
      <h1 class="hero-title">集成学习<br><em>多模型共识</em>构筑稳健判断</h1>
      <p class="hero-lead">单模型易受噪声扰动与方差制约；集成方法通过多样化基学习器的差异预测与协同聚合，将弱学习器熔铸为低方差、低偏差的稳健系统。</p>

      <div class="core-pillars">
        <div class="pillar-item">
          <span class="pillar-label">多样性来源</span>
          <span class="pillar-val"><i class="dot-indicator dot-sample"></i>样本与特征重采样</span>
        </div>
        <div class="pillar-sep"></div>
        <div class="pillar-item">
          <span class="pillar-label">基学习器群</span>
          <span class="pillar-val"><i class="dot-indicator dot-model"></i>差异化成员模型</span>
        </div>
        <div class="pillar-sep"></div>
        <div class="pillar-item">
          <span class="pillar-label">聚合机制</span>
          <span class="pillar-val"><i class="dot-indicator dot-agg"></i>投票 · 平均 · 堆叠元学习</span>
        </div>
      </div>
    </div>

    <footer class="foot-bar">
      <div class="foot-note">
        <span class="interactive-badge">系统生成流</span>
        <span>轻触画布注入预测脉冲，观察多样化基模型轨迹如何收敛于稳健共识点。</span>
      </div>
      <div class="ensemble-flow-hint" aria-hidden="true">
        <span>基模型候选: <strong id="stat-models">7</strong> 组</span>
        <span>采样分布: <strong id="stat-samples">90</strong> 点</span>
        <span>共识置信度: <strong id="stat-confidence" style="color:var(--aggregate)">98.4%</strong></span>
      </div>
    </footer>
  </div>

  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("cover-cv");
      const stage = document.getElementById("stage");
      let ctx = null;

      // 视觉生成参数
      const W = 1600;
      const H = 900;
      const AGGREGATE_POINT = { x: 1220, y: 440 }; // 最终收敛的汇聚点
      const MODEL_SOURCES = [
        { x: 920, y: 160, label: "M1" },
        { x: 1040, y: 220, label: "M2" },
        { x: 960, y: 340, label: "M3" },
        { x: 880, y: 520, label: "M4" },
        { x: 970, y: 640, label: "M5" },
        { x: 900, y: 760, label: "M6" },
        { x: 1080, y: 710, label: "M7" }
      ];

      // 样本点群 (在左中与中间分布，表示训练与特征空间)
      const SAMPLE_COUNT = 90;
      const samples = [];
      let seed = 12345;
      function rnd() {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      }

      for (let i = 0; i < SAMPLE_COUNT; i++) {
        // 分布在 780~1450, 100~820 区域，但避开左侧文字排版区域 (0~760, 100~800)
        const x = 820 + rnd() * 700;
        const y = 90 + rnd() * 720;
        const baseSpeed = 0.2 + rnd() * 0.4;
        const angle = rnd() * Math.PI * 2;
        const cluster = rnd() > 0.5 ? 1 : -1;
        samples.push({
          x, y,
          ox: x, oy: y,
          vx: Math.cos(angle) * baseSpeed,
          vy: Math.sin(angle) * baseSpeed,
          r: 2.2 + rnd() * 2.2,
          cluster,
          alpha: 0.25 + rnd() * 0.45
        });
      }

      // 流动粒子 (模拟预测脉冲从基模型流向共识收敛点)
      const STREAM_COUNT = 36;
      const streams = [];
      for (let i = 0; i < STREAM_COUNT; i++) {
        const src = MODEL_SOURCES[i % MODEL_SOURCES.length];
        streams.push({
          src,
          t: rnd(), // 进度 0~1
          speed: 0.0035 + rnd() * 0.0045,
          offsetY: (rnd() - 0.5) * 40,
          offsetX: (rnd() - 0.5) * 30,
          colorType: rnd() > 0.25 ? "model" : "sample"
        });
      }

      // 交互脉冲
      const ripples = [];
      function triggerPulse(px, py) {
        ripples.push({
          x: px,
          y: py,
          r: 5,
          maxR: 240,
          alpha: 0.8
        });
      }

      let pointer = { x: -1000, y: -1000, active: false };

      stage.addEventListener("pointermove", (e) => {
        const pt = Deck.pt(canvas, e);
        pointer.x = pt.x;
        pointer.y = pt.y;
        pointer.active = true;
      });

      stage.addEventListener("pointerleave", () => {
        pointer.active = false;
      });

      stage.addEventListener("pointerdown", (e) => {
        const pt = Deck.pt(canvas, e);
        triggerPulse(pt.x, pt.y);
      });

      let clock = 0;

      function render() {
        if (!ctx) return;
        clock += 0.016;

        ctx.clearRect(0, 0, W, H);

        // 1. 绘制背景微弱的模型拓扑连线 (基学习器连接到聚合节点)
        ctx.save();
        MODEL_SOURCES.forEach((src, idx) => {
          // 连线到收敛点
          ctx.beginPath();
          ctx.moveTo(src.x, src.y);
          // 使用带弯曲的贝塞尔曲线
          const cx1 = (src.x + AGGREGATE_POINT.x) / 2 + (idx % 2 === 0 ? 30 : -30);
          const cy1 = (src.y + AGGREGATE_POINT.y) / 2 + (idx % 3 === 0 ? 25 : -25);
          ctx.quadraticCurveTo(cx1, cy1, AGGREGATE_POINT.x, AGGREGATE_POINT.y);
          ctx.strokeStyle = "rgba(39, 100, 143, 0.18)";
          ctx.lineWidth = 1.2;
          ctx.stroke();

          // 基学习器节点光晕与圆点
          ctx.beginPath();
          ctx.arc(src.x, src.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = "#27648F";
          ctx.fill();

          ctx.beginPath();
          ctx.arc(src.x, src.y, 10, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(39, 100, 143, 0.25)";
          ctx.lineWidth = 1;
          ctx.stroke();

          // 标注
          ctx.font = "600 13px var(--font-num)";
          ctx.fillStyle = "rgba(39, 100, 143, 0.9)";
          ctx.fillText(src.label, src.x - 26, src.y + 4);
        });
        ctx.restore();

        // 2. 绘制样本特征散点场
        ctx.save();
        samples.forEach((s) => {
          // 缓动漂移
          s.x += s.vx;
          s.y += s.vy;
          if (s.x < 800 || s.x > 1540) s.vx *= -1;
          if (s.y < 80 || s.y > 820) s.vy *= -1;

          // 指针斥力
          if (pointer.active) {
            const dx = s.x - pointer.x;
            const dy = s.y - pointer.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 140 && dist > 1) {
              const f = (1 - dist / 140) * 4;
              s.x += (dx / dist) * f;
              s.y += (dy / dist) * f;
            }
          }

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          if (s.cluster === 1) {
            ctx.fillStyle = `rgba(47, 117, 104, ${s.alpha})`; // --sample
          } else {
            ctx.fillStyle = `rgba(39, 100, 143, ${s.alpha * 0.8})`; // --model
          }
          ctx.fill();
        });
        ctx.restore();

        // 3. 绘制流动预测信号 (从基模型流向收敛点)
        ctx.save();
        streams.forEach((st) => {
          st.t += st.speed;
          if (st.t > 1) st.t = 0;

          // 沿路径插值
          const src = st.src;
          const cx = (src.x + AGGREGATE_POINT.x) / 2 + st.offsetX;
          const cy = (src.y + AGGREGATE_POINT.y) / 2 + st.offsetY;

          // 二次贝塞尔曲线公式 B(t) = (1-t)^2*P0 + 2*(1-t)*t*P1 + t^2*P2
          const t = st.t;
          const px = (1 - t) * (1 - t) * src.x + 2 * (1 - t) * t * cx + t * t * AGGREGATE_POINT.x;
          const py = (1 - t) * (1 - t) * src.y + 2 * (1 - t) * t * cy + t * t * AGGREGATE_POINT.y;

          // 头尾透明度淡入淡出
          const fade = Math.sin(t * Math.PI);

          ctx.beginPath();
          ctx.arc(px, py, 2.5, 0, Math.PI * 2);
          if (st.colorType === "model") {
            ctx.fillStyle = `rgba(39, 100, 143, ${fade * 0.85})`;
          } else {
            ctx.fillStyle = `rgba(47, 117, 104, ${fade * 0.85})`;
          }
          ctx.fill();
        });
        ctx.restore();

        // 4. 绘制终极聚合点 (Aggregate Anchor)
        ctx.save();
        const pulseBreath = 1 + Math.sin(clock * 3) * 0.08;
        const aggX = AGGREGATE_POINT.x;
        const aggY = AGGREGATE_POINT.y;

        // 外层脉冲共鸣圈
        ctx.beginPath();
        ctx.arc(aggX, aggY, 28 * pulseBreath, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(195, 75, 34, 0.07)";
        ctx.fill();
        ctx.strokeStyle = "rgba(195, 75, 34, 0.35)";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 核心集成预测点
        ctx.beginPath();
        ctx.arc(aggX, aggY, 7, 0, Math.PI * 2);
        ctx.fillStyle = "#C34B22";
        ctx.fill();

        // 标签：集成共识输出
        ctx.font = "600 15px var(--font-sans)";
        ctx.fillStyle = "#C34B22";
        ctx.fillText("集成决策聚合 (Ensemble Consensus)", aggX + 42, aggY - 2);

        ctx.font = "13px var(--font-sans)";
        ctx.fillStyle = "rgba(83, 106, 120, 0.95)";
        ctx.fillText("降低个体方差与随机扰动偏差", aggX + 42, aggY + 20);
        ctx.restore();

        // 5. 交互点击涟漪扩散
        ctx.save();
        for (let i = ripples.length - 1; i >= 0; i--) {
          const r = ripples[i];
          r.r += 3.5;
          r.alpha -= 0.015;
          if (r.alpha <= 0 || r.r >= r.maxR) {
            ripples.splice(i, 1);
            continue;
          }
          ctx.beginPath();
          ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(39, 100, 143, ${r.alpha * 0.6})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
        ctx.restore();
      }

      Deck.init({ index: 1, total: 27 });
      ctx = Deck.fit(canvas);
      Deck.onResize(() => {
        ctx = Deck.fit(canvas);
        render();
      });

      if (Deck.reduced()) {
        render();
      } else {
        Deck.loop(render);
      }
    })();
  </script>
</body>
</html>
