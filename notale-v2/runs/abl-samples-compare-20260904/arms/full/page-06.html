<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Bagging 与随机森林</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
:root{
  --stage-w: 1600px;
  --stage-h: 900px;
}

#stage{
  position: relative;
  width: 1600px;
  height: 900px;
  padding: var(--pad-y) var(--pad-x);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  box-sizing: border-box;
}

.canvas-layer{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* 标题区：左侧保护区，排版克制严肃 */
.cover-header{
  position: absolute;
  left: 88px;
  top: 140px;
  width: 620px;
  z-index: 10;
  display: flex;
  flex-direction: column;
}

.chapter-badge{
  font-family: var(--font-sans);
  font-size: var(--fs-label);
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--model);
  margin-bottom: 22px;
  text-transform: uppercase;
}

.cover-title{
  font-family: var(--font-sans);
  font-size: 56px;
  line-height: 1.15;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
  margin: 0 0 28px 0;
}

.cover-lead{
  font-family: var(--font-sans);
  font-size: var(--fs-lead);
  line-height: 1.6;
  color: var(--muted);
  margin: 0;
  max-width: 540px;
}

.ensemble-summary{
  margin-top: 48px;
  padding-top: 28px;
  border-top: 1px solid rgba(83, 106, 120, 0.25);
  display: flex;
  gap: 36px;
}

.summary-item{
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.summary-item .num{
  font-family: var(--font-num);
  font-size: 26px;
  font-weight: 600;
  color: var(--text);
}

.summary-item .label{
  font-size: var(--fs-sec);
  color: var(--muted);
}

/* 底部微注：说明算法生成与章节定位 */
.cover-footer{
  position: absolute;
  left: 88px;
  bottom: 40px;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: var(--fs-label);
  color: var(--muted);
}

.cover-footer .ensemble-mark{
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
  </style>
</head>
<body data-page="06" data-total="27">
  <div id="stage">
    <canvas id="forest-canvas" class="canvas-layer"></canvas>
    <canvas id="ambient-canvas" class="canvas-layer"></canvas>

    <header class="cover-header">
      <div class="chapter-badge">第二章 · 并行集成</div>
      <h1 class="cover-title">Bagging 与随机森林</h1>
      <p class="cover-lead">
        通过自助重采样构建相互扰动的平行子集，训练多棵深度生长的高方差决策树。
        随机引入特征子空间划分，打断强特征主导造成的树间相关性，最终以均值聚合抵消方差波动。
      </p>

      <div class="ensemble-summary">
        <div class="summary-item">
          <span class="num">B = 100</span>
          <span class="label">Bootstrap 采样树基</span>
        </div>
        <div class="summary-item">
          <span class="num">m = &radic;p</span>
          <span class="label">特征子采样打散相关</span>
        </div>
        <div class="summary-item">
          <span class="num">1 - 1/e &asymp; 63.2%</span>
          <span class="label">袋内率与袋外独立评估</span>
        </div>
      </div>
    </header>

    <footer class="cover-footer">
      <span class="ensemble-mark">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="4" cy="5" r="2.5" fill="#27648F"/>
          <circle cx="4" cy="13" r="2.5" fill="#27648F"/>
          <circle cx="14" cy="9" r="3" fill="#C34B22"/>
          <path d="M6.5 5L11 8.2M6.5 13L11 9.8" stroke="#536A78" stroke-width="1.4"/>
        </svg>
        <span>平行弱相关基学习器 &rarr; 方差缩减聚合</span>
      </span>
    </footer>
  </div>

  <script src="assets/base.js"></script>
  <script>
  (function(){
    'use strict';

    var freeze = Object.freeze;
    var CONFIG = freeze({
      seed: 8842,
      treeCount: 5,
      titleZone: freeze({ x: 50, y: 120, w: 640, h: 480 }),
      canvasW: 1600,
      canvasH: 900
    });

    // 随机数生成器
    function rngFrom(seed){
      var s = (seed >>> 0) || 1;
      return function(){
        s += 0x6D2B79F5;
        var t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    var forestCanvas = document.getElementById('forest-canvas');
    var ambientCanvas = document.getElementById('ambient-canvas');

    // 预定义 5 棵决策树的生长根位置、倾角与特征（呈扇形/林区分布在右半侧）
    var TREE_ROOTS = [
      { x: 840, y: 770, baseAngle: -Math.PI / 2 + 0.12, len: 135, maxDepth: 6, trunkWidth: 7.5 },
      { x: 990, y: 800, baseAngle: -Math.PI / 2 + 0.04, len: 150, maxDepth: 6, trunkWidth: 8.5 },
      { x: 1150, y: 760, baseAngle: -Math.PI / 2 - 0.06, len: 146, maxDepth: 6, trunkWidth: 8 },
      { x: 1310, y: 790, baseAngle: -Math.PI / 2 - 0.18, len: 140, maxDepth: 6, trunkWidth: 7.5 },
      { x: 1450, y: 750, baseAngle: -Math.PI / 2 - 0.28, len: 128, maxDepth: 5, trunkWidth: 7 }
    ];

    // 汇聚中心点（集成输出的聚合锚点，位于右上区域）
    var AGGREGATE_POINT = { x: 1180, y: 130 };

    var model = null;

    function buildModel(){
      var rng = rngFrom(CONFIG.seed);
      var branches = [];
      var leaves = [];
      var pathsToAggregate = [];

      TREE_ROOTS.forEach(function(root, treeIdx){
        var treeSegments = [];

        function grow(x, y, angle, length, depth, width){
          var x2 = x + Math.cos(angle) * length;
          var y2 = y + Math.sin(angle) * length;

          // 标题保护区检测：如果在标题左侧区域且高度进入导语行，抑制向左延伸
          if(x2 < CONFIG.titleZone.x + CONFIG.titleZone.w && y2 > CONFIG.titleZone.y && y2 < CONFIG.titleZone.y + CONFIG.titleZone.h){
            return;
          }

          var seg = {
            treeIdx: treeIdx,
            depth: depth,
            x1: x, y1: y,
            x2: x2, y2: y2,
            w: Math.max(1, width)
          };
          branches.push(seg);
          treeSegments.push(seg);

          if(depth >= root.maxDepth || length < 18){
            // 叶节点：做一次预测产出
            var leaf = {
              treeIdx: treeIdx,
              x: x2,
              y: y2,
              val: rng() > 0.5 ? 1 : 0
            };
            leaves.push(leaf);
            return;
          }

          // 二叉决策分支（模拟特征划分，分叉角度因特征子采样而各具差异）
          var spread = 0.42 + rng() * 0.25;
          var asymmetry = (rng() - 0.5) * 0.18;
          var shrinkL = 0.72 + rng() * 0.14;
          var shrinkR = 0.72 + rng() * 0.14;

          grow(x2, y2, angle - spread / 2 + asymmetry, length * shrinkL, depth + 1, width * 0.72);
          grow(x2, y2, angle + spread / 2 + asymmetry, length * shrinkR, depth + 1, width * 0.72);
        }

        grow(root.x, root.y, root.baseAngle, root.len, 0, root.trunkWidth);
      });

      // 从每棵树的顶层若干显著叶节点，产生通往上方“聚合节点”的汇聚流线（贝塞尔控制点）
      var sampleLeaves = [];
      for(var i = 0; i < leaves.length; i += 4){
        sampleLeaves.push(leaves[i]);
      }

      sampleLeaves.forEach(function(lf, idx){
        // 生成贝塞尔曲线从 leaf -> AGGREGATE_POINT
        var cpx = (lf.x + AGGREGATE_POINT.x) * 0.5 + (rng() - 0.5) * 60;
        var cpy = Math.min(lf.y, AGGREGATE_POINT.y) - 40 - rng() * 60;
        pathsToAggregate.push({
          treeIdx: lf.treeIdx,
          p0: { x: lf.x, y: lf.y },
          p1: { x: cpx, y: cpy },
          p2: { x: AGGREGATE_POINT.x, y: AGGREGATE_POINT.y },
          speed: 0.00035 + rng() * 0.00025,
          offset: rng()
        });
      });

      return {
        branches: branches,
        leaves: leaves,
        flows: pathsToAggregate
      };
    }

    // 贝塞尔求值
    function bezierPoint(p0, p1, p2, t){
      var u = 1 - t;
      return {
        x: u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x,
        y: u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y
      };
    }

    function drawStatic(ctx, w, h){
      if(!model) return;
      ctx.clearRect(0, 0, w, h);

      // 1. 底层环境细微横向梯度与网格标尺感
      ctx.save();
      var grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#F2F6F8');
      grad.addColorStop(1, '#E6EFF4');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // 弱结构网格（实验纸背景）
      ctx.strokeStyle = 'rgba(83, 106, 120, 0.06)';
      ctx.lineWidth = 1;
      for(var x = 80; x < w; x += 120){
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for(var y = 60; y < h; y += 120){
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      // 2. 绘制树干与分叉分支（基学习器群，蓝灰色调）
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      model.branches.forEach(function(b){
        ctx.beginPath();
        ctx.moveTo(b.x1, b.y1);
        ctx.lineTo(b.x2, b.y2);
        // 根据深度赋予透明度与粗细
        var alpha = Math.max(0.35, 0.95 - b.depth * 0.09);
        ctx.strokeStyle = Deck.rgba('model', alpha);
        ctx.lineWidth = b.w;
        ctx.stroke();
      });

      // 3. 绘制叶节点（预测输出点）
      model.leaves.forEach(function(lf){
        ctx.beginPath();
        ctx.arc(lf.x, lf.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = lf.val === 1 ? Deck.rgba('sample', 0.95) : Deck.rgba('model', 0.95);
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      });

      // 4. 汇聚导线（从叶部通向集成聚合点的细虚线线束）
      ctx.save();
      ctx.setLineDash([4, 5]);
      model.flows.forEach(function(fl, idx){
        if(idx % 2 !== 0) return; // 隔条绘制保持通透
        ctx.beginPath();
        ctx.moveTo(fl.p0.x, fl.p0.y);
        ctx.quadraticCurveTo(fl.p1.x, fl.p1.y, fl.p2.x, fl.p2.y);
        ctx.strokeStyle = Deck.rgba('muted', 0.38);
        ctx.lineWidth = 1.2;
        ctx.stroke();
      });
      ctx.restore();

      // 5. 汇聚主锚点（Ensemble Aggregate Output）
      ctx.save();
      var ag = AGGREGATE_POINT;

      // 聚合光晕层
      var halo = ctx.createRadialGradient(ag.x, ag.y, 4, ag.x, ag.y, 70);
      halo.addColorStop(0, Deck.rgba('aggregate', 0.28));
      halo.addColorStop(1, Deck.rgba('aggregate', 0));
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(ag.x, ag.y, 70, 0, Math.PI * 2);
      ctx.fill();

      // 核心聚合圆环与实心
      ctx.beginPath();
      ctx.arc(ag.x, ag.y, 16, 0, Math.PI * 2);
      ctx.strokeStyle = Deck.rgba('aggregate', 0.9);
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(ag.x, ag.y, 7, 0, Math.PI * 2);
      ctx.fillStyle = Deck.rgba('aggregate', 1);
      ctx.fill();

      // 聚合点旁文字标注
      ctx.font = '700 16px "Noto Sans SC", sans-serif';
      ctx.fillStyle = Deck.rgba('aggregate', 1);
      ctx.fillText('平均 / 多数投票汇聚', ag.x + 24, ag.y + 2);

      ctx.font = '500 14px "Noto Sans SC", sans-serif';
      ctx.fillStyle = Deck.rgba('text', 0.85);
      ctx.fillText('Var(f̄) = ρσ² + (1-ρ)σ²/B', ag.x + 24, ag.y + 24);

      // 每棵树底座根部标签
      TREE_ROOTS.forEach(function(r, idx){
        // 树基座地平线短线
        ctx.beginPath();
        ctx.moveTo(r.x - 30, r.y);
        ctx.lineTo(r.x + 30, r.y);
        ctx.strokeStyle = Deck.rgba('model', 0.4);
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.font = '700 14px "Noto Sans SC", sans-serif';
        ctx.fillStyle = Deck.rgba('model', 0.95);
        ctx.fillText('Tree ' + (idx + 1), r.x - 22, r.y + 24);
        ctx.font = '13px "Noto Sans SC", sans-serif';
        ctx.fillStyle = Deck.rgba('muted', 0.85);
        ctx.fillText('Bootstrap D(' + (idx + 1) + ')', r.x - 36, r.y + 42);
      });

      ctx.restore();
    }

    var ambientCtx = null;
    function drawAmbient(time){
      if(!ambientCtx || !model) return;
      var ctx = ambientCtx;
      var w = CONFIG.canvasW;
      var h = CONFIG.canvasH;
      ctx.clearRect(0, 0, w, h);

      // 汇聚流动的光斑粒子，体现多树决策源源不断向集成核心传输
      ctx.save();
      model.flows.forEach(function(fl, idx){
        var progress = ((time * fl.speed) + fl.offset) % 1;
        var pt = bezierPoint(fl.p0, fl.p1, fl.p2, progress);

        // 粒子随接近聚合点由基学习器蓝演变为集成橙
        var r = Deck.lerp(39, 195, progress);
        var g = Deck.lerp(100, 75, progress);
        var b = Deck.lerp(143, 34, progress);
        var alpha = Math.sin(progress * Math.PI) * 0.85;

        ctx.fillStyle = 'rgba(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ',' + alpha + ')';
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 2.2, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    var motionStop = null;
    function startMotion(){
      if(motionStop){ motionStop(); motionStop = null; }
      motionStop = Deck.loop(function(t){
        drawAmbient(t);
      }, { still: 2400 });
    }

    function init(){
      Deck.init({ index: 6, total: 27, keys: false });
      model = buildModel();

      Deck.autofit(forestCanvas, function(ctx, w, h){
        drawStatic(ctx, w || 1600, h || 900);
      });
      Deck.autofit(ambientCanvas, function(ctx){
        ambientCtx = ctx;
        drawAmbient(2400);
      });

      startMotion();
    }

    init();
  })();
  </script>
</body>
</html>
