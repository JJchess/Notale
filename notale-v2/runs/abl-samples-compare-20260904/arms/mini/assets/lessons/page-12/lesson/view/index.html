<main class="rf-dashboard">
  <!-- 顶栏状态与说明 -->
  <header class="dash-head">
    <div class="dash-badge">
      <span class="pulse-dot"></span>
      <span id="rfStatus">RANDOM FOREST · 5 TREES</span>
    </div>
    <div class="oob-pill" id="oobPill">
      OOB 准确率: <strong id="oobScore">--</strong>
    </div>
  </header>

  <!-- 上半部：5 棵树的 Bootstrap 与 OOB 状态矩阵 -->
  <section class="forest-view-card" aria-label="树成员与袋外分布">
    <div class="card-title-row">
      <h3 class="card-title">树成员采样子集与 OOB 分布（12 样本）</h3>
      <span class="card-legend">
        <span class="leg-item"><span class="sw-in"></span>袋内训练 (In-Bag)</span>
        <span class="leg-item"><span class="sw-oob"></span>袋外评估 (OOB)</span>
      </span>
    </div>
    <div class="trees-grid" id="treesGrid">
      <!-- 动态填充 5 行/列 -->
    </div>
  </section>

  <!-- 下半部左右双栏：左边为 OOB 样本汇聚表，右边为特征置换重要性柱状图 -->
  <div class="bottom-split">
    <!-- 左栏：OOB 预测投票汇聚 -->
    <section class="panel-card oob-panel" aria-label="袋外投票汇总">
      <h3 class="card-title">袋外样本预测聚合 (OOB Ensemble)</h3>
      <div class="oob-samples-container" id="oobSamplesList">
        <!-- 动态生成 12 个样本的 OOB 投票与真实标签对比 -->
      </div>
    </section>

    <!-- 右栏：置换重要性诊断 -->
    <section class="panel-card imp-panel" aria-label="特征重要性诊断">
      <div class="card-title-row">
        <h3 class="card-title">特征置换重要性 (Permutation Importance)</h3>
        <span class="sub-label">打乱特征后 OOB 准确率降幅</span>
      </div>
      <div class="bars-container" id="importanceBars">
        <!-- 动态填充 3 个特征的柱状图 -->
      </div>
    </section>
  </div>

  <!-- 底部注记与指标 -->
  <footer class="dash-foot">
    <p class="annotation-text" id="viewAnnotation">运行代码以开始构建随机森林与诊断。</p>
    <div class="quick-metrics" id="dashMetrics"></div>
  </footer>
</main>
