<main class="gb-study">
  <header class="proof-heading">
    <div class="kicker-wrap">
      <span class="viz-kicker">GRADIENT BOOSTING DYNAMICS</span>
      <span class="stage-tag" id="stageTag">READY</span>
    </div>
    <div class="readout-group">
      <div class="readout-item">
        <span class="readout-label">当前轮次</span>
        <strong id="roundReadout" class="readout-val">0 / 12</strong>
      </div>
      <div class="readout-item">
        <span class="readout-label">训练 MSE</span>
        <strong id="trainMseReadout" class="readout-val train-val">—</strong>
      </div>
      <div class="readout-item">
        <span class="readout-label">验证 MSE</span>
        <strong id="valMseReadout" class="readout-val val-val">—</strong>
      </div>
    </div>
  </header>

  <section class="chart-stage" id="chartStage" aria-label="损失曲线追踪">
    <!-- SVG 双曲线图 -->
    <svg id="curveSvg" class="curve-svg" viewBox="0 0 740 320" preserveAspectRatio="none">
      <defs>
        <linearGradient id="trainGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#27648F" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#27648F" stop-opacity="0.0"/>
        </linearGradient>
        <linearGradient id="valGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#C34B22" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#C34B22" stop-opacity="0.0"/>
        </linearGradient>
      </defs>

      <!-- 背景网格线 -->
      <g id="gridLines" class="grid-lines"></g>

      <!-- 区域底色 -->
      <path id="trainArea" class="area-train" d=""></path>
      <path id="valArea" class="area-val" d=""></path>

      <!-- 曲线路径 -->
      <path id="trainPath" class="path-train" d=""></path>
      <path id="valPath" class="path-val" d=""></path>

      <!-- 标记点 -->
      <g id="dataPoints"></g>

      <!-- 最佳轮次指示线 -->
      <g id="bestMarker" class="best-marker" style="display:none;">
        <line id="bestLine" x1="0" y1="20" x2="0" y2="280"></line>
        <circle id="bestDot" cx="0" cy="0" r="5"></circle>
        <text id="bestText" x="0" y="15">最佳泛化点 (Early Stop)</text>
      </g>
    </svg>

    <!-- 图例 -->
    <div class="chart-legend">
      <div class="legend-item">
        <span class="sw-line train-sw"></span>
        <span>训练集损失 (Train MSE)</span>
      </div>
      <div class="legend-item">
        <span class="sw-line val-sw"></span>
        <span>验证集损失 (Val MSE)</span>
      </div>
      <div class="legend-item">
        <span class="sw-dot best-sw"></span>
        <span>最优早停点</span>
      </div>
    </div>
  </section>

  <!-- 三阶段状态说明带 -->
  <section class="phases-strip" aria-label="训练迭代三阶段">
    <div class="phase-card" id="phaseUnder">
      <div class="phase-hdr">
        <span class="phase-badge">1~3 轮</span>
        <strong class="phase-title">迭代不足 (欠拟合)</strong>
      </div>
      <p class="phase-desc">弱分类器累加过少，模型尚未学全主干模式，双误差皆处于高位。</p>
    </div>
    <div class="phase-card" id="phaseOptimal">
      <div class="phase-hdr">
        <span class="phase-badge">4~6 轮</span>
        <strong class="phase-title">最佳泛化区间</strong>
      </div>
      <p class="phase-desc">验证误差探底，模型拟合信号同时未记忆样本特有噪声，泛化最佳。</p>
    </div>
    <div class="phase-card" id="phaseOver">
      <div class="phase-hdr">
        <span class="phase-badge">7+ 轮</span>
        <strong class="phase-title">迭代过度 (过拟合)</strong>
      </div>
      <p class="phase-desc">新树开始强行拟合训练集噪声，训练误差续跌而验证误差反弹抬升。</p>
    </div>
  </section>

  <p id="viewAnnotation" class="annotation" aria-live="polite">准备就绪，点击运行开始逐步观测梯度提升迭代过程。</p>
</main>
