<main class="rf-view">
  <p class="scope" aria-hidden="true">
    <span id="algorithmName">RANDOM FOREST</span>
    <span class="scope-separator">/</span>
    <span id="sampleCount">N = 8</span>
  </p>
  <div class="rf-stat-badge" id="oobBadge">OOB 准确率: 100%</div>

  <section class="rf-section oob-section" aria-label="Bootstrap 与袋外样本划分">
    <div class="section-title">树采样与袋外分布 (Bootstrap & OOB)</div>
    <div class="trees-container" id="treesContainer">
    </div>
  </section>

  <section class="rf-section importance-section" aria-label="置换特征重要性诊断">
    <div class="section-title">置换特征重要性 (Permutation Feature Importance)</div>
    <div class="importance-bars" id="importanceBars">
    </div>
  </section>

  <p class="annotation" id="viewAnnotation" aria-live="polite">等待执行轨迹...</p>
  <dl class="metrics" id="viewMetrics" aria-label="当前指标"></dl>
</main>
