<main class="gbdt-study">
  <header class="gbdt-heading">
    <div class="kicker-wrap">
      <span class="badge-title">GRADIENT BOOSTING DYNAMICS</span>
      <span class="kicker-sep">/</span>
      <span id="currentStatusText" class="badge-sub">ITERATION 0 OF 25</span>
    </div>
    <div class="readout-group">
      <div class="readout-item">
        <span class="readout-label">训练 MSE</span>
        <strong id="trainMseReadout" class="readout-val text-train">—</strong>
      </div>
      <div class="readout-item">
        <span class="readout-label">验证 MSE</span>
        <strong id="valMseReadout" class="readout-val text-val">—</strong>
      </div>
      <div class="readout-item">
        <span class="readout-label">验证最优 (早停点)</span>
        <strong id="bestValReadout" class="readout-val text-best">—</strong>
      </div>
    </div>
  </header>

  <section class="chart-container" aria-label="训练与验证均方误差变化曲线">
    <div class="chart-legend" aria-hidden="true">
      <div class="legend-entry">
        <span class="legend-line line-train"></span>
        <span>训练集误差 (Train MSE)</span>
      </div>
      <div class="legend-entry">
        <span class="legend-line line-val"></span>
        <span>验证集误差 (Val MSE)</span>
      </div>
      <div class="legend-entry">
        <span class="legend-marker marker-best">★</span>
        <span>最低验证误差点 (Early Stopping)</span>
      </div>
    </div>

    <div class="svg-stage-wrap">
      <svg id="curveSvg" viewBox="0 0 540 280" class="curve-svg" preserveAspectRatio="none">
        <defs>
          <linearGradient id="trainGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(39, 100, 143, 0.28)" />
            <stop offset="100%" stop-color="rgba(39, 100, 143, 0.0)" />
          </linearGradient>
          <linearGradient id="valGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(195, 75, 34, 0.22)" />
            <stop offset="100%" stop-color="rgba(195, 75, 34, 0.0)" />
          </linearGradient>
        </defs>

        <!-- 背景网格与轴线 -->
        <g id="gridLines" class="grid-lines"></g>
        <g id="axisLabels" class="axis-labels"></g>

        <!-- 拟合状态背景分界区（欠拟合/最优区间/过拟合） -->
        <rect id="overfitZone" class="overfit-zone" x="0" y="0" width="0" height="0" />

        <!-- 曲线图层 -->
        <path id="trainArea" class="area-train" d="" />
        <path id="valArea" class="area-val" d="" />
        <path id="trainPath" class="path-train" d="" />
        <path id="valPath" class="path-val" d="" />

        <!-- 关键标记点与垂线 -->
        <line id="bestRoundLine" class="best-line" x1="0" y1="0" x2="0" y2="0" />
        <circle id="bestValPoint" class="best-pt" cx="-20" cy="-20" r="5" />
        <circle id="currentValPoint" class="current-pt current-val" cx="-20" cy="-20" r="4.5" />
        <circle id="currentTrainPoint" class="current-pt current-train" cx="-20" cy="-20" r="4.5" />
      </svg>
    </div>

    <!-- 底部状态指示条：欠拟合 / 最优泛化 / 迭代过度 -->
    <div class="phase-bar" id="phaseBar" aria-hidden="true">
      <div class="phase-indicator phase-under" id="phaseUnder">欠拟合阶段 (Underfitting)</div>
      <div class="phase-indicator phase-opt" id="phaseOpt">最优早停点 (Optimal)</div>
      <div class="phase-indicator phase-over" id="phaseOver">过拟合抬升 (Overfitting)</div>
    </div>
  </section>

  <!-- 底部解说与指标卡 -->
  <footer class="gbdt-footer">
    <div class="annotation-box">
      <p id="viewAnnotation" class="view-annotation" aria-live="polite">
        观察梯度提升在每轮残差累加下的误差收敛情况。
      </p>
    </div>
    <dl class="metrics-grid" id="viewMetrics" aria-label="关键诊断指标"></dl>
  </footer>
</main>
