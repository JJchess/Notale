<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F6F8;
      --surface: #FFFFFF;
      --surface-strong: #E2EBF0;
      --text: #122634;
      --muted: #536A78;
      --model: #27648F;
      --sample: #2F7568;
      --aggregate: #C34B22;
      --answer: #237052;
      --focus: #9B3F11;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
      --font-num: "DIN Alternate", "Segoe UI", system-ui, sans-serif;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #ensemble-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* 标题排版 */
    .title-block {
      position: relative;
      z-index: 5;
      max-width: 660px;
      margin-top: 60px;
      margin-left: 20px;
      pointer-events: auto;
    }

    h1.title-main {
      font-size: 46px;
      line-height: 1.24;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      margin: 0 0 28px 0;
    }

    .title-lead {
      font-size: var(--fs-lead);
      line-height: 1.62;
      color: var(--muted);
      margin: 0;
      max-width: 620px;
    }

    /* 下方指标/解构卡片 */
    .footer-block {
      position: relative;
      z-index: 5;
      display: flex;
      gap: 24px;
      margin-left: 20px;
      margin-bottom: 24px;
      max-width: 820px;
    }

    .concept-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(83, 106, 120, 0.2);
      border-radius: 8px;
      padding: 18px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(18, 38, 52, 0.04);
    }

    .concept-tag {
      font-size: var(--fs-label);
      font-weight: 700;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .concept-tag.model { color: var(--model); }
    .concept-tag.sample { color: var(--sample); }
    .concept-tag.aggregate { color: var(--aggregate); }

    .concept-tag .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .concept-text {
      font-size: var(--fs-sec);
      color: var(--muted);
      line-height: 1.5;
      margin: 0;
    }

    /* 右侧图例与引导 */
    .focus-legend {
      position: absolute;
      right: 76px;
      bottom: 50px;
      z-index: 5;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(83, 106, 120, 0.2);
      border-radius: 8px;
      padding: 16px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 250px;
    }

    .legend-title {
      font-size: var(--fs-label);
      font-weight: 700;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: var(--fs-tick);
      color: var(--muted);
    }

    .legend-sym {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .legend-line {
      width: 14px;
      height: 2px;
      border-radius: 1px;
    }
  </style>
</head>
<body data-page="01" data-total="27">
  <div id="stage">
    <canvas id="ensemble-canvas" class="cv-fill"></canvas>

    <!-- 顶部标题 -->
    <header class="title-block">
      <h1 class="title-main">集成学习<br>让一组模型共同作出更稳健的判断</h1>
      <p class="title-lead">
        单模型容易受训练波动、噪声或特定假设的局限而犯错。集成学习通过构建多个具差异性的基学习器，并依聚合规则熔铸共识，降低方差与偏差，形成更抗扰的稳健决策边界。
      </p>
    </header>

    <!-- 底部概念解构 -->
    <footer class="footer-block">
      <div class="concept-card">
        <div class="concept-tag sample"><span class="dot"></span>样本与子空间</div>
        <p class="concept-text">重采样与特征扰动制造多样性，确保每个成员观察到不同的数据切片。</p>
      </div>
      <div class="concept-card">
        <div class="concept-tag model"><span class="dot"></span>基学习器群</div>
        <p class="concept-text">个体模型各自学习、探索独立的假设曲面，避免全盘同时失误。</p>
      </div>
      <div class="concept-card">
        <div class="concept-tag aggregate"><span class="dot"></span>聚合判定</div>
        <p class="concept-text">投票或加权平均抵消个体偶发扰动，最终收敛于高置信度的稳健解。</p>
      </div>
    </footer>

    <!-- 右侧图注 -->
    <aside class="focus-legend">
      <div class="legend-title">
        <span>多源汇流场</span>
        <span class="ensemble-mark"></span>
      </div>
      <div class="legend-row">
        <div class="legend-sym"><div class="legend-line" style="background: var(--sample);"></div></div>
        <span>训练样本重采样流</span>
      </div>
      <div class="legend-row">
        <div class="legend-sym"><div class="legend-line" style="background: var(--model); height: 3px;"></div></div>
        <span>基学习器判定轨迹 (K=5)</span>
      </div>
      <div class="legend-row">
        <div class="legend-sym"><div class="legend-line" style="background: var(--aggregate); height: 4px;"></div></div>
        <span>集成汇聚决策中心</span>
      </div>
    </aside>
  </div>

  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      Deck.init({ index: 1, total: 27, keys: false });

      const canvas = document.getElementById("ensemble-canvas");
      const SEED = "ensemble-cover-42";
      const WIDTH = 1600;
      const HEIGHT = 900;

      // 聚合中心 (汇聚焦点在右侧 1180, 430)
      const AGGREGATOR = { x: 1180, y: 430 };
      
      // 5个基学习器源头点 (位于画布中右侧圆周上，环绕但向外展开)
      const BASE_MODELS = [
        { id: 1, x: 880, y: 190, label: "基学习器 h₁(x)" },
        { id: 2, x: 980, y: 285, label: "基学习器 h₂(x)" },
        { id: 3, x: 840, y: 430, label: "基学习器 h₃(x)" },
        { id: 4, x: 920, y: 575, label: "基学习器 h₄(x)" },
        { id: 5, x: 1040, y: 690, label: "基学习器 h₅(x)" },
      ];

      // 标题安全区，避免流线穿插造成文字识别困难
      const TITLE_SAFE = { x1: 0, y1: 0, x2: 740, y2: 600 };

      let ctx;
      let streamlines = [];
      let modelFlows = [];
      let particles = [];

      function buildSystem() {
        const rng = new Math.seedrandom(SEED);

        streamlines = [];
        modelFlows = [];
        particles = [];

        // 1. 生成大尺度背景样本流场 (从左下/底部/右上方汇聚向基学习器与聚合核)
        for (let i = 0; i < 90; i++) {
          const startX = 640 + rng() * 920;
          const startY = rng() < 0.5 ? rng() * 220 : 660 + rng() * 240;
          const pts = [{ x: startX, y: startY }];
          let curX = startX;
          let curY = startY;

          for (let step = 0; step < 70; step++) {
            // 趋向 AGGREGATOR 的引力 + 微扰
            const dx = AGGREGATOR.x - curX;
            const dy = AGGREGATOR.y - curY;
            const dist = Math.hypot(dx, dy) || 1;
            const flowSpeed = 6.5;
            
            // 旋流分量与前向分量
            const perpX = -dy / dist;
            const perpY = dx / dist;
            const swirl = Math.sin(curY * 0.008 + i) * 0.8;

            const vx = (dx / dist) * flowSpeed + perpX * swirl * 2.2;
            const vy = (dy / dist) * flowSpeed + perpY * swirl * 2.2;

            curX += vx;
            curY += vy;

            // 避开标题区
            if (curX < TITLE_SAFE.x2 && curY < TITLE_SAFE.y2) {
              break;
            }

            pts.push({ x: curX, y: curY });
            if (Math.hypot(curX - AGGREGATOR.x, curY - AGGREGATOR.y) < 45) break;
          }

          if (pts.length > 8) {
            streamlines.push({
              pts,
              alpha: 0.08 + rng() * 0.12,
              width: 0.8 + rng() * 1.2,
              colorType: rng() > 0.4 ? "sample" : "model"
            });
          }
        }

        // 2. 基学习器到最终决策核心的强力主汇聚通道 (5束)
        BASE_MODELS.forEach((m, idx) => {
          const beamCount = 9;
          for (let b = 0; b < beamCount; b++) {
            const spread = (b - (beamCount - 1) / 2) * 4.5;
            const pts = [];
            // 三次贝塞尔曲线路径
            const p0 = { x: m.x + (rng() - 0.5) * 8, y: m.y + (rng() - 0.5) * 8 };
            const p3 = { x: AGGREGATOR.x + spread * 0.6, y: AGGREGATOR.y + (rng() - 0.5) * 12 };
            const ctrlOffset = (idx - 2) * 35 + spread * 2;
            const p1 = { x: m.x + 140, y: m.y + ctrlOffset * 0.5 };
            const p2 = { x: AGGREGATOR.x - 120, y: AGGREGATOR.y + ctrlOffset * 0.3 };

            const steps = 60;
            for (let t = 0; t <= steps; t++) {
              const u = t / steps;
              const omt = 1 - u;
              const x = omt*omt*omt*p0.x + 3*omt*omt*u*p1.x + 3*omt*u*u*p2.x + u*u*u*p3.x;
              const y = omt*omt*omt*p0.y + 3*omt*omt*u*p1.y + 3*omt*u*u*p2.y + u*u*u*p3.y;
              pts.push({ x, y });
            }

            modelFlows.push({
              pts,
              modelIdx: idx,
              alpha: 0.28 + rng() * 0.25,
              width: 1.2 + rng() * 1.8
            });
          }
        });

        // 3. 动态脉冲粒子 (沿汇聚束运动)
        for (let p = 0; p < 36; p++) {
          const flow = modelFlows[Math.floor(rng() * modelFlows.length)];
          particles.push({
            flow,
            progress: rng(),
            speed: 0.003 + rng() * 0.004,
            size: 2.2 + rng() * 2.5,
            isCore: rng() > 0.6
          });
        }
      }

      function drawStatic(c) {
        // 背景微冷渐变
        const bgGrad = c.createRadialGradient(AGGREGATOR.x, AGGREGATOR.y, 80, AGGREGATOR.x, AGGREGATOR.y, 900);
        bgGrad.addColorStop(0, "rgba(226, 235, 240, 0.85)");
        bgGrad.addColorStop(0.6, "rgba(242, 246, 248, 0.95)");
        bgGrad.addColorStop(1, "rgba(242, 246, 248, 1)");
        c.fillStyle = bgGrad;
        c.fillRect(0, 0, WIDTH, HEIGHT);

        const sampleRgb = Deck.rgb("sample");
        const modelRgb = Deck.rgb("model");
        const aggregateRgb = Deck.rgb("aggregate");

        // 绘制背景微弱流线
        streamlines.forEach(line => {
          c.beginPath();
          c.moveTo(line.pts[0].x, line.pts[0].y);
          for (let i = 1; i < line.pts.length; i++) {
            c.lineTo(line.pts[i].x, line.pts[i].y);
          }
          const rgb = line.colorType === "sample" ? sampleRgb : modelRgb;
          c.strokeStyle = `rgba(${rgb.join(",")}, ${line.alpha})`;
          c.lineWidth = line.width;
          c.stroke();
        });

        // 绘制各基学习器外围源节点
        BASE_MODELS.forEach(m => {
          // 柔和发光晕圈
          const halo = c.createRadialGradient(m.x, m.y, 2, m.x, m.y, 44);
          halo.addColorStop(0, `rgba(${modelRgb.join(",")}, 0.25)`);
          halo.addColorStop(1, `rgba(${modelRgb.join(",")}, 0)`);
          c.fillStyle = halo;
          c.beginPath();
          c.arc(m.x, m.y, 44, 0, Math.PI * 2);
          c.fill();

          // 核心圆环
          c.beginPath();
          c.arc(m.x, m.y, 14, 0, Math.PI * 2);
          c.fillStyle = "#FFFFFF";
          c.fill();
          c.strokeStyle = `rgba(${modelRgb.join(",")}, 0.9)`;
          c.lineWidth = 2.5;
          c.stroke();

          // 核心实心圆
          c.beginPath();
          c.arc(m.x, m.y, 5, 0, Math.PI * 2);
          c.fillStyle = `rgb(${modelRgb.join(",")})`;
          c.fill();

          // 标签背景与文字 (向左悬挂，确保不与圆圈或引线冲突)
          c.font = "600 13px system-ui, sans-serif";
          const textMetrics = c.measureText(m.label);
          const bgW = textMetrics.width + 14;
          const bgH = 22;
          const bgX = m.x - 22 - bgW;
          const bgY = m.y - 11;

          c.fillStyle = "rgba(255, 255, 255, 0.9)";
          c.fillRect(bgX, bgY, bgW, bgH);
          c.strokeStyle = "rgba(83, 106, 120, 0.25)";
          c.lineWidth = 1;
          c.strokeRect(bgX, bgY, bgW, bgH);

          c.fillStyle = Deck.token("text");
          c.fillText(m.label, bgX + 7, m.y + 4.5);
        });

        // 绘制基学习器到聚合焦点的汇流束
        modelFlows.forEach(beam => {
          c.beginPath();
          c.moveTo(beam.pts[0].x, beam.pts[0].y);
          for (let i = 1; i < beam.pts.length; i++) {
            c.lineTo(beam.pts[i].x, beam.pts[i].y);
          }
          c.strokeStyle = `rgba(${modelRgb.join(",")}, ${beam.alpha})`;
          c.lineWidth = beam.width;
          c.stroke();
        });

        // 聚合决策中心 (波纹与能量核)
        for (let r = 70; r >= 20; r -= 15) {
          c.beginPath();
          c.arc(AGGREGATOR.x, AGGREGATOR.y, r, 0, Math.PI * 2);
          c.strokeStyle = `rgba(${aggregateRgb.join(",")}, ${0.12 + (80 - r) * 0.005})`;
          c.lineWidth = 1.5;
          c.setLineDash([4, 6]);
          c.stroke();
          c.setLineDash([]);
        }

        // 聚合核心盘面
        const aggGrad = c.createRadialGradient(AGGREGATOR.x, AGGREGATOR.y, 4, AGGREGATOR.x, AGGREGATOR.y, 32);
        aggGrad.addColorStop(0, `rgba(${aggregateRgb.join(",")}, 0.3)`);
        aggGrad.addColorStop(1, `rgba(${aggregateRgb.join(",")}, 0.02)`);
        c.fillStyle = aggGrad;
        c.beginPath();
        c.arc(AGGREGATOR.x, AGGREGATOR.y, 32, 0, Math.PI * 2);
        c.fill();

        // 核心实心圆
        c.beginPath();
        c.arc(AGGREGATOR.x, AGGREGATOR.y, 16, 0, Math.PI * 2);
        c.fillStyle = `rgb(${aggregateRgb.join(",")})`;
        c.fill();
        c.lineWidth = 3;
        c.strokeStyle = "#FFFFFF";
        c.stroke();

        // 核心文字
        c.font = "700 14px system-ui, sans-serif";
        c.fillStyle = Deck.token("text");
        c.textAlign = "center";
        c.fillText("H(x)", AGGREGATOR.x, AGGREGATOR.y + 44);
        c.font = "500 12px system-ui, sans-serif";
        c.fillStyle = Deck.token("muted");
        c.fillText("稳健共识决策", AGGREGATOR.x, AGGREGATOR.y + 62);
        c.textAlign = "start";
      }

      function drawParticles(c) {
        const aggregateRgb = Deck.rgb("aggregate");
        const modelRgb = Deck.rgb("model");

        particles.forEach(p => {
          p.progress = (p.progress + p.speed) % 1;
          const idx = Math.floor(p.progress * (p.flow.pts.length - 1));
          const pt = p.flow.pts[idx];
          if (!pt) return;

          // 随着趋向中心，颜色渐变向聚合色
          const mix = p.progress;
          const r = Math.round(modelRgb[0] * (1 - mix) + aggregateRgb[0] * mix);
          const g = Math.round(modelRgb[1] * (1 - mix) + aggregateRgb[1] * mix);
          const b = Math.round(modelRgb[2] * (1 - mix) + aggregateRgb[2] * mix);

          c.beginPath();
          c.arc(pt.x, pt.y, p.size, 0, Math.PI * 2);
          c.fillStyle = `rgba(${r},${g},${b},${0.6 + mix * 0.35})`;
          c.fill();
        });
      }

      function frame() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        drawStatic(ctx);
        drawParticles(ctx);
      }

      function init() {
        ctx = Deck.fit(canvas);
        buildSystem();
        frame();

        // 动画循环
        Deck.loop(() => {
          frame();
        }, { still: 1500 });
      }

      Deck.onResize(() => {
        ctx = Deck.fit(canvas);
        frame();
      });

      init();
    })();
  </script>
</body>
</html>
