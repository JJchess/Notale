<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>集成学习的基本结构</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F6F8;
      --surface: #FFFFFF;
      --surface-strong: #E2EBF0;
      --text: #122634;
      --muted: #536A78;
      --model: #27648F;
      --sample: #2F7568;
      --aggregate: #C34B22;
      --answer: #237052;
      --focus: #9B3F11;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
      --stage-w: 1600;
      --stage-h: 900;
    }

    #stage {
      padding: 24px 48px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-sizing: border-box;
      user-select: none;
      width: 1600px;
      height: 900px;
      overflow: hidden;
    }

    /* 顶栏 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--surface-strong);
    }
    .header h1 {
      font-size: 30px;
      color: var(--text);
      font-weight: 700;
      margin: 0 0 4px 0;
      line-height: 1.15;
    }
    .header .subtitle {
      font-size: var(--fs-sec);
      color: var(--muted);
      margin: 0;
    }
    .header .tag-wrap {
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--model);
    }

    /* 交互视口 */
    .main-grid {
      display: grid;
      grid-template-columns: 1060px 420px;
      gap: 24px;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .pipeline-stage {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--surface-strong);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .canvas-container {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    /* 控制栏与样本切换 */
    .pipeline-controls {
      height: 64px;
      background: var(--bg);
      border-top: 1px solid var(--surface-strong);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .sample-selector {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sample-label {
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--muted);
    }
    .sample-tabs {
      display: flex;
      gap: 8px;
    }
    .sample-tab {
      background: var(--surface);
      border: 1px solid var(--surface-strong);
      color: var(--text);
      padding: 6px 16px;
      font-size: var(--fs-label);
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      transition: all var(--duration) var(--ease);
    }
    .sample-tab:hover {
      border-color: var(--model);
    }
    .sample-tab.active {
      background: var(--model);
      color: #FFF;
      border-color: var(--model);
    }

    .rule-selector {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .rule-label {
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--muted);
    }
    .rule-btns {
      display: flex;
      gap: 8px;
    }
    .rule-btn {
      background: var(--surface);
      border: 1px solid var(--surface-strong);
      color: var(--text);
      padding: 6px 14px;
      font-size: var(--fs-label);
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      transition: all var(--duration) var(--ease);
    }
    .rule-btn:hover {
      border-color: var(--aggregate);
    }
    .rule-btn.active {
      background: var(--aggregate);
      color: #FFF;
      border-color: var(--aggregate);
    }

    /* 右侧解析面板 */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--surface-strong);
      border-radius: 8px;
      padding: 16px 20px;
    }
    .card-title {
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
      margin: 0 0 10px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot-sample { background: var(--sample); }
    .dot-model { background: var(--model); }
    .dot-aggregate { background: var(--aggregate); }

    .card-text {
      font-size: var(--fs-sec);
      color: var(--muted);
      line-height: 1.5;
      margin: 0;
    }

    /* 实时计算表格面板 */
    .calc-card {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .calc-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: var(--fs-label);
    }
    .calc-table th {
      text-align: left;
      padding: 8px 6px;
      color: var(--muted);
      border-bottom: 1px solid var(--surface-strong);
      font-weight: 600;
    }
    .calc-table td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--surface-strong);
      color: var(--text);
    }
    .calc-table tr.total td {
      border-bottom: none;
      font-weight: 700;
      font-size: var(--fs-sec);
      color: var(--aggregate);
      padding-top: 12px;
    }
    .tag-correct {
      color: var(--answer);
      font-weight: 600;
    }
    .tag-wrong {
      color: var(--aggregate);
      font-weight: 600;
    }
    .verdict-box {
      margin-top: auto;
      background: var(--surface-strong);
      border-radius: 6px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .verdict-header {
      font-size: var(--fs-label);
      color: var(--muted);
    }
    .verdict-value {
      font-size: var(--fs-body);
      font-weight: 700;
      color: var(--text);
    }
  </style>
</head>
<body data-page="02" data-total="27">
  <div id="stage">
    <!-- 页眉 -->
    <header class="header min0">
      <div>
        <h1>集成学习的三层骨架：输入、基学习器与聚合规则</h1>
        <p class="subtitle">无论是并行重采样还是串行加权，所有集成模型都建立在「产生差异」与「规则合成」之上</p>
      </div>
      <div class="tag-wrap">
        <span>体系结构概览</span>
      </div>
    </header>

    <!-- 主体区域 -->
    <div class="main-grid min0">
      <!-- 流程可视化主视口 -->
      <div class="pipeline-stage min0">
        <div class="canvas-container min0">
          <canvas id="pipeline-cv" class="cv-fill"></canvas>
        </div>
        <!-- 底部控制条 -->
        <div class="pipeline-controls min0">
          <div class="sample-selector">
            <span class="sample-label">输入测试样本 x:</span>
            <div class="sample-tabs">
              <button class="sample-tab active" data-sample="0">样本 A (经典特征)</button>
              <button class="sample-tab" data-sample="1">样本 B (边界模糊)</button>
              <button class="sample-tab" data-sample="2">样本 C (极端噪声)</button>
            </div>
          </div>
          <div class="rule-selector">
            <span class="rule-label">聚合规则 g(·):</span>
            <div class="rule-btns">
              <button class="rule-btn active" data-rule="majority">多数票 (Majority)</button>
              <button class="rule-btn" data-rule="weighted">加权表决 (Weighted)</button>
              <button class="rule-btn" data-rule="soft">软投票均值 (Soft)</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 右侧分析卡片 -->
      <div class="sidebar min0">
        <!-- 结构卡片 1 -->
        <div class="card min0">
          <div class="card-title"><span class="dot dot-sample"></span> 1. 差异化基学习器 {f_t}</div>
          <p class="card-text">
            通过不同子集、不同特征或模型架构诱导预测差异。若所有成员输出完全相同，聚合无法消除系统误差。
          </p>
        </div>

        <!-- 结构卡片 2 -->
        <div class="card min0">
          <div class="card-title"><span class="dot dot-aggregate"></span> 2. 聚合机制 g(·)</div>
          <p class="card-text">
            将成员预测汇总。多数表决抵消单模型偶发错误，加权表决倚重强学习器，概率均值保留置信度信息。
          </p>
        </div>

        <!-- 动态表格 -->
        <div class="card calc-card min0">
          <div class="card-title"><span class="dot dot-model"></span> 实时聚合结果</div>
          <table class="calc-table">
            <thead>
              <tr>
                <th>学习器</th>
                <th>预测类别</th>
                <th>P(正类)</th>
                <th>权重</th>
              </tr>
            </thead>
            <tbody id="calc-body">
              <!-- 由 JS 渲染 -->
            </tbody>
          </table>

          <div class="verdict-box" id="verdict-box">
            <div class="verdict-header">集成模型输出预测 F(x):</div>
            <div class="verdict-value" id="verdict-text">计算中...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/base.js"></script>
  <script>
    (function () {
      "use strict";

      // 样本数据定义：包含 3 个具有教学对照性的样本
      // 成员模型: 1. 决策树 (轻量、规则分明) 2. 逻辑回归 (线性边界) 3. SVM (高维间隔) 4. 神经网络 (非线性表达)
      const SAMPLES = [
        {
          name: "样本 A",
          features: "x = [0.82, 0.45, 1.20]",
          desc: "特征清晰，属于正类 (+1)",
          groundTruth: "+1",
          predictions: [
            { id: "f₁ (决策树)", cls: "+1", prob: 0.88, weight: 0.20 },
            { id: "f₂ (逻辑回归)", cls: "+1", prob: 0.76, weight: 0.25 },
            { id: "f₃ (SVM)", cls: "+1", prob: 0.82, weight: 0.30 },
            { id: "f₄ (神经网络)", cls: "-1", prob: 0.42, weight: 0.25 }
          ]
        },
        {
          name: "样本 B",
          features: "x = [0.12, -0.05, 0.33]",
          desc: "边界样本，分歧明显，真值 (+1)",
          groundTruth: "+1",
          predictions: [
            { id: "f₁ (决策树)", cls: "-1", prob: 0.45, weight: 0.20 },
            { id: "f₂ (逻辑回归)", cls: "-1", prob: 0.48, weight: 0.25 },
            { id: "f₃ (SVM)", cls: "+1", prob: 0.68, weight: 0.30 },
            { id: "f₄ (神经网络)", cls: "+1", prob: 0.72, weight: 0.25 }
          ]
        },
        {
          name: "样本 C",
          features: "x = [-1.45, 2.10, -0.88]",
          desc: "含高频噪声，真值 (-1)",
          groundTruth: "-1",
          predictions: [
            { id: "f₁ (决策树)", cls: "+1", prob: 0.58, weight: 0.20 },
            { id: "f₂ (逻辑回归)", cls: "-1", prob: 0.32, weight: 0.25 },
            { id: "f₃ (SVM)", cls: "-1", prob: 0.20, weight: 0.30 },
            { id: "f₄ (神经网络)", cls: "-1", prob: 0.15, weight: 0.25 }
          ]
        }
      ];

      // 状态管理
      let currentSampleIdx = 0;
      let currentRule = "majority"; // majority | weighted | soft
      let animProgress = 1.0;
      let animStartTime = performance.now();

      const canvas = document.getElementById("pipeline-cv");
      const calcBody = document.getElementById("calc-body");
      const verdictText = document.getElementById("verdict-text");
      const sampleTabs = document.querySelectorAll(".sample-tab");
      const ruleBtns = document.querySelectorAll(".rule-btn");

      // 布局常量 (基于逻辑视口尺寸)
      // canvas 容器宽约 1120，高约 640
      function computeAggregation(sample, rule) {
        const preds = sample.predictions;
        let finalCls = "+1";
        let detail = "";

        if (rule === "majority") {
          let posVotes = 0;
          let negVotes = 0;
          preds.forEach(p => {
            if (p.cls === "+1") posVotes++;
            else negVotes++;
          });
          finalCls = posVotes >= negVotes ? "+1" : "-1";
          detail = `多数决: +1 有 ${posVotes} 票，-1 有 ${negVotes} 票`;
        } else if (rule === "weighted") {
          let posWeight = 0;
          let negWeight = 0;
          preds.forEach(p => {
            if (p.cls === "+1") posWeight += p.weight;
            else negWeight += p.weight;
          });
          finalCls = posWeight >= negWeight ? "+1" : "-1";
          detail = `加权和: +1 得 ${posWeight.toFixed(2)}，-1 得 ${negWeight.toFixed(2)}`;
        } else if (rule === "soft") {
          let avgProb = 0;
          preds.forEach(p => { avgProb += p.prob; });
          avgProb /= preds.length;
          finalCls = avgProb >= 0.5 ? "+1" : "-1";
          detail = `均值置信度 P(+1) = ${(avgProb * 100).toFixed(1)}%`;
        }

        const isCorrect = finalCls === sample.groundTruth;
        return { finalCls, detail, isCorrect };
      }

      function updateTableAndSidebar() {
        const sample = SAMPLES[currentSampleIdx];
        const res = computeAggregation(sample, currentRule);

        calcBody.innerHTML = "";
        sample.predictions.forEach(p => {
          const tr = document.createElement("tr");
          const clsColor = p.cls === "+1" ? "var(--model)" : "var(--aggregate)";
          tr.innerHTML = `
            <td><strong>${p.id}</strong></td>
            <td style="color:${clsColor};font-weight:700;">${p.cls}</td>
            <td>${(p.prob * 100).toFixed(0)}%</td>
            <td>${p.weight.toFixed(2)}</td>
          `;
          calcBody.appendChild(tr);
        });

        const correctTag = res.isCorrect
          ? `<span class="tag-correct">正确判别</span>`
          : `<span class="tag-wrong">判别失误</span>`;

        verdictText.innerHTML = `
          <div style="font-size:22px;color:var(--aggregate);margin-bottom:2px;">
            F(x) = ${res.finalCls} ${correctTag}
          </div>
          <div style="font-size:var(--fs-label);color:var(--muted);font-weight:normal;">
            ${res.detail} (真值: ${sample.groundTruth})
          </div>
        `;
      }

      // 绘制逻辑
      function drawPipeline(ctx, width, height) {
        ctx.clearRect(0, 0, width, height);

        const sample = SAMPLES[currentSampleIdx];
        const res = computeAggregation(sample, currentRule);

        // 统一网格坐标
        // 1. 输入节点: X ~ 140, Y ~ height / 2
        // 2. 基学习器节点群: X ~ 520, Y 分布在 110, 230, 350, 470
        // 3. 聚合规则运算节点: X ~ 880, Y ~ height / 2
        // 4. 最终输出节点: X ~ 1060, Y ~ height / 2
        const inputPos = { x: 130, y: height / 2 };
        const modelX = 460;
        const modelYs = [
          height * 0.17,
          height * 0.39,
          height * 0.61,
          height * 0.83
        ];
        const aggPos = { x: 790, y: height / 2 };
        const outPos = { x: 970, y: height / 2 };

        // 阶段连线绘制 (先画线，避免遮挡节点)
        // 输入 -> 基学习器 (4条流动贝塞尔线)
        modelYs.forEach((my, idx) => {
          ctx.beginPath();
          ctx.moveTo(inputPos.x + 65, inputPos.y);
          ctx.bezierCurveTo(
            (inputPos.x + modelX) / 2, inputPos.y,
            (inputPos.x + modelX) / 2, my,
            modelX - 85, my
          );
          ctx.strokeStyle = "rgba(47, 117, 104, 0.35)";
          ctx.lineWidth = 2.5;
          ctx.stroke();

          // 绘制输入流动粒子点 (动画修饰)
          const t = ((animProgress + idx * 0.25) % 1);
          const px = Math.pow(1 - t, 3) * (inputPos.x + 65) +
                     3 * Math.pow(1 - t, 2) * t * ((inputPos.x + modelX) / 2) +
                     3 * (1 - t) * Math.pow(t, 2) * ((inputPos.x + modelX) / 2) +
                     Math.pow(t, 3) * (modelX - 85);
          const py = Math.pow(1 - t, 3) * inputPos.y +
                     3 * Math.pow(1 - t, 2) * t * inputPos.y +
                     3 * (1 - t) * Math.pow(t, 2) * my +
                     Math.pow(t, 3) * my;
          ctx.beginPath();
          ctx.arc(px, py, 4, 0, Math.PI * 2);
          ctx.fillStyle = "#2F7568";
          ctx.fill();
        });

        // 基学习器 -> 聚合器 (4条带权重的连线)
        modelYs.forEach((my, idx) => {
          const pred = sample.predictions[idx];
          ctx.beginPath();
          ctx.moveTo(modelX + 85, my);
          ctx.bezierCurveTo(
            (modelX + aggPos.x) / 2, my,
            (modelX + aggPos.x) / 2, aggPos.y,
            aggPos.x - 70, aggPos.y
          );

          // 根据预测类别给线路上色
          const isPos = pred.cls === "+1";
          ctx.strokeStyle = isPos ? "rgba(39, 100, 143, 0.45)" : "rgba(195, 75, 34, 0.45)";
          ctx.lineWidth = currentRule === "weighted" ? (pred.weight * 12) : 3;
          ctx.stroke();

          // 连线上标注单模型预测结果
          const midX = (modelX + aggPos.x) / 2 + 10;
          const midY = (my + aggPos.y) / 2;
          ctx.fillStyle = isPos ? "#27648F" : "#C34B22";
          ctx.font = "bold 13px 'Noto Sans SC', sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(`f_${idx + 1}(x) = ${pred.cls}`, midX, midY + (idx < 2 ? -8 : 16));
        });

        // 聚合器 -> 最终输出
        ctx.beginPath();
        ctx.moveTo(aggPos.x + 70, aggPos.y);
        ctx.lineTo(outPos.x - 52, outPos.y);
        ctx.strokeStyle = "rgba(195, 75, 34, 0.8)";
        ctx.lineWidth = 4;
        ctx.stroke();

        // 绘制箭头
        Deck.arrow(ctx, aggPos.x + 70, aggPos.y, outPos.x - 55, outPos.y, 8);

        // ================= 节点绘制 =================

        // 1. 输入节点 [原始特征样本]
        ctx.save();
        ctx.shadowColor = "rgba(18, 38, 52, 0.06)";
        ctx.shadowBlur = 10;
        ctx.fillStyle = "#FFFFFF";
        Deck.rr(ctx, inputPos.x - 65, inputPos.y - 50, 130, 100, 8);
        ctx.fill();
        ctx.strokeStyle = "var(--sample)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = "#2F7568";
        ctx.font = "bold 15px 'Noto Sans SC', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("输入向量 x", inputPos.x, inputPos.y - 22);

        ctx.fillStyle = "#122634";
        ctx.font = "14px 'Noto Sans SC', sans-serif";
        ctx.fillText(sample.name, inputPos.x, inputPos.y);

        ctx.fillStyle = "#536A78";
        ctx.font = "12px monospace";
        ctx.fillText(sample.features, inputPos.x, inputPos.y + 24);

        // 2. 基学习器节点群
        modelYs.forEach((my, idx) => {
          const pred = sample.predictions[idx];
          ctx.save();
          ctx.shadowColor = "rgba(18, 38, 52, 0.05)";
          ctx.shadowBlur = 8;
          ctx.fillStyle = "#FFFFFF";
          Deck.rr(ctx, modelX - 85, my - 34, 170, 68, 6);
          ctx.fill();
          ctx.strokeStyle = "#27648F";
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.restore();

          // 学习器名称
          ctx.fillStyle = "#27648F";
          ctx.font = "bold 14px 'Noto Sans SC', sans-serif";
          ctx.textAlign = "left";
          ctx.fillText(pred.id, modelX - 72, my - 10);

          // 预测值与置信度
          ctx.fillStyle = pred.cls === "+1" ? "#27648F" : "#C34B22";
          ctx.font = "bold 13px 'Noto Sans SC', sans-serif";
          ctx.fillText(`预测: ${pred.cls}`, modelX - 72, my + 14);

          ctx.fillStyle = "#536A78";
          ctx.font = "12px 'Noto Sans SC', sans-serif";
          ctx.textAlign = "right";
          ctx.fillText(`P(+1): ${(pred.prob * 100).toFixed(0)}%`, modelX + 72, my + 14);
        });

        // 3. 聚合规则运算节点
        ctx.save();
        ctx.shadowColor = "rgba(18, 38, 52, 0.06)";
        ctx.shadowBlur = 12;
        ctx.fillStyle = "#FFFFFF";
        Deck.rr(ctx, aggPos.x - 70, aggPos.y - 55, 140, 110, 8);
        ctx.fill();
        ctx.strokeStyle = "#C34B22";
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = "#C34B22";
        ctx.font = "bold 15px 'Noto Sans SC', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("聚合机制 g(·)", aggPos.x, aggPos.y - 25);

        ctx.fillStyle = "#122634";
        ctx.font = "bold 14px 'Noto Sans SC', sans-serif";
        const ruleNameMap = {
          majority: "多数票表决",
          weighted: "加权求和",
          soft: "概率均值 (软投票)"
        };
        ctx.fillText(ruleNameMap[currentRule], aggPos.x, aggPos.y - 2);

        ctx.fillStyle = "#536A78";
        ctx.font = "12px 'Noto Sans SC', sans-serif";
        ctx.fillText("合并成员差异", aggPos.x, aggPos.y + 22);

        // 4. 最终模型决策节点
        ctx.save();
        ctx.shadowColor = "rgba(195, 75, 34, 0.12)";
        ctx.shadowBlur = 10;
        ctx.fillStyle = "#FFFFFF";
        Deck.rr(ctx, outPos.x - 52, outPos.y - 52, 104, 104, 8);
        ctx.fill();
        ctx.strokeStyle = "var(--aggregate)";
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = "var(--aggregate)";
        ctx.font = "bold 13px 'Noto Sans SC', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("集成决策 F(x)", outPos.x, outPos.y - 24);

        ctx.fillStyle = res.finalCls === "+1" ? "var(--model)" : "var(--aggregate)";
        ctx.font = "bold 28px 'Noto Sans SC', sans-serif";
        ctx.fillText(res.finalCls, outPos.x, outPos.y + 6);

        ctx.font = "bold 13px 'Noto Sans SC', sans-serif";
        ctx.fillStyle = res.isCorrect ? "var(--answer)" : "var(--aggregate)";
        ctx.fillText(res.isCorrect ? "判别正确" : "判别失误", outPos.x, outPos.y + 32);

        // 顶部区域指示文字（指示输入层、基模型层、聚合层）
        ctx.fillStyle = "#536A78";
        ctx.font = "13px 'Noto Sans SC', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("【数据/特征层】", inputPos.x, 36);
        ctx.fillText("【多样性基模型层】", modelX, 36);
        ctx.fillText("【规则聚合层】", aggPos.x, 36);
        ctx.fillText("【最终决策】", outPos.x, 36);
      }

      // 初始化画布与动画
      let cvCtx = null;
      function renderLoop() {
        if (!cvCtx) return;
        const rect = canvas.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          animProgress = (performance.now() - animStartTime) / 2400;
          drawPipeline(cvCtx, canvas.width / (window.devicePixelRatio || 1), canvas.height / (window.devicePixelRatio || 1));
        }
        requestAnimationFrame(renderLoop);
      }

      function init() {
        Deck.init({ index: 2, total: 27, keys: false });
        cvCtx = Deck.fit(canvas);
        updateTableAndSidebar();

        // 重新适配尺寸
        Deck.onResize(() => {
          cvCtx = Deck.fit(canvas);
          drawPipeline(cvCtx, canvas.width / (window.devicePixelRatio || 1), canvas.height / (window.devicePixelRatio || 1));
        });

        // 监听样本切换
        sampleTabs.forEach(tab => {
          tab.addEventListener("click", () => {
            sampleTabs.forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            currentSampleIdx = parseInt(tab.dataset.sample, 10);
            updateTableAndSidebar();
          });
        });

        // 监听规则切换
        ruleBtns.forEach(btn => {
          btn.addEventListener("click", () => {
            ruleBtns.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentRule = btn.dataset.rule;
            updateTableAndSidebar();
          });
        });

        renderLoop();
      }

      window.addEventListener("DOMContentLoaded", init);
    })();
  </script>
</body>
</html>
