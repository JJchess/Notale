<main class="forest-view">
  <header class="forest-header">
    <div class="scope-tags">
      <span class="tag-title" id="rfScopeTitle">RANDOM FOREST TRACE</span>
      <span class="scope-sep">/</span>
      <span class="scope-info" id="rfScopeInfo">5 TREES · OOB EVAL</span>
    </div>
  </header>

  <!-- 顶部：特征重要性对比栏 -->
  <section class="panel-section importance-panel" aria-label="特征重要性诊断">
    <div class="section-title">
      <span>特征重要性诊断（基尼不纯度减少占比）</span>
      <span class="title-sub" id="importanceSub">Σ Gain 归一化权重</span>
    </div>
    <div class="importance-bars">
      <div class="imp-item" id="imp0Container">
        <div class="imp-label-row">
          <span class="imp-name">特征 0 (核心主特征 X[0])</span>
          <span class="imp-val" id="imp0Text">0.0%</span>
        </div>
        <div class="imp-track">
          <div class="imp-fill imp-fill-core" id="imp0Bar" style="width: 0%;"></div>
        </div>
      </div>
      <div class="imp-item" id="imp1Container">
        <div class="imp-label-row">
          <span class="imp-name">特征 1 (弱/噪声特征 X[1])</span>
          <span class="imp-val" id="imp1Text">0.0%</span>
        </div>
        <div class="imp-track">
          <div class="imp-fill imp-fill-weak" id="imp1Bar" style="width: 0%;"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 中部：决策树桩成员与袋外样本矩阵 -->
  <section class="panel-section trees-panel" aria-label="森林基学习器与袋外样本分布">
    <div class="section-title">
      <span>基学习器 (树桩) 与袋外 (OOB) 样本切分矩阵</span>
      <span class="title-sub">样本总数 N=8, 虚线圈为 OOB 袋外验证样本</span>
    </div>
    <div class="trees-container" id="treesContainer">
      <!-- 动态填充树桩卡片 -->
    </div>
  </section>

  <!-- 底部：说明与实时量化指标 -->
  <footer class="forest-footer">
    <p class="annotation" id="viewAnnotation" aria-live="polite">等待运行随机森林代码……</p>
    <dl class="metrics-grid" id="viewMetrics" aria-label="森林诊断指标"></dl>
  </footer>
</main>
