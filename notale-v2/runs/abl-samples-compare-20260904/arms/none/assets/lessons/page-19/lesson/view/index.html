<main class="gb-view">
  <div class="view-header">
    <div class="header-status">
      <span class="status-badge" id="statusBadge">准备就绪</span>
      <span class="params-info" id="paramsInfo">n_estimators: 35 | lr: 0.15</span>
    </div>
    <div class="legend-box">
      <div class="legend-item"><span class="legend-color train-color"></span>训练集 (Train)</div>
      <div class="legend-item"><span class="legend-color val-color"></span>验证集 (Validation)</div>
      <div class="legend-item"><span class="legend-color best-color"></span>最佳验证折点</div>
    </div>
  </div>

  <div class="charts-container">
    <!-- 图表 1: 学习曲线 MSE 变化 -->
    <section class="card chart-card">
      <div class="card-title">
        <span>MSE 学习曲线（随迭代轮数更新）</span>
        <span class="card-subtitle" id="mseTrendSubtitle">观察过早停止 vs 过拟合反弹</span>
      </div>
      <div class="svg-wrapper">
        <svg id="lossSvg" viewBox="0 0 540 220" preserveAspectRatio="none">
          <!-- 网格线和坐标轴 -->
          <g class="grid-lines" id="lossGrid"></g>
          <!-- 区域背景高亮 -->
          <rect id="overfitRegion" class="overfit-highlight" x="0" y="0" width="0" height="180" />
          <!-- 曲线 -->
          <path id="trainLine" class="loss-path train-path" d="" />
          <path id="valLine" class="loss-path val-path" d="" />
          <!-- 散点与最佳点标记 -->
          <g id="lossPoints"></g>
          <g id="bestPointMarker" style="display:none;">
            <circle class="best-dot" cx="0" cy="0" r="5" />
            <line class="best-line" x1="0" y1="0" x2="0" y2="180" />
            <text class="best-text" x="0" y="20">最佳轮数</text>
          </g>
        </svg>
      </div>
      <div class="axis-labels">
        <span>轮数 1</span>
        <span id="maxRoundLabel">轮数 35</span>
      </div>
    </section>

    <!-- 图表 2: 数据拟合与回归曲面 -->
    <section class="card fit-card">
      <div class="card-title">
        <span>数据点与当前集成拟合曲线</span>
        <span class="card-subtitle" id="fitSubtitle">弱树逐棵叠加拟合目标函数</span>
      </div>
      <div class="svg-wrapper">
        <svg id="fitSvg" viewBox="0 0 540 180" preserveAspectRatio="none">
          <g class="grid-lines" id="fitGrid"></g>
          <!-- 样本散点 -->
          <g id="samplePoints"></g>
          <!-- 拟合曲线 -->
          <path id="fitPath" class="fit-path" d="" />
        </svg>
      </div>
      <div class="axis-labels">
        <span>X = -3.0</span>
        <span>X = 0.0</span>
        <span>X = +3.0</span>
      </div>
    </section>
  </div>

  <div class="view-footer">
    <p class="annotation" id="viewAnnotation" aria-live="polite">运行代码观察梯度提升学习曲线与过拟合动态。</p>
    <dl class="metrics" id="viewMetrics" aria-label="当前关键指标"></dl>
  </div>
</main>
