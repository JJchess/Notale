<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F6F8;
      --text: #122634;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 40px var(--pad-x);
    }

    /* 生成式画布承载整个森林与分支汇聚系统 */
    .forest-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 标题排版区：严格限制在左下区域，避开生成流的动态汇聚中心 */
    .hero-layout {
      position: relative;
      z-index: 2;
      width: 100%;
      flex: 1;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-sizing: border-box;
    }

    .title-block {
      max-width: 640px;
      pointer-events: auto;
    }

    .hero-title {
      margin: 0;
      font-size: 48px;
      font-weight: 700;
      line-height: 1.15;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .hero-desc {
      margin: 14px 0 0 0;
      font-size: var(--fs-lead);
      line-height: 1.5;
      color: var(--muted);
    }

    .header-bar {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .module-badge {
      font-size: var(--fs-label);
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .module-badge::before {
      content: "";
      display: inline-block;
      width: 20px;
      height: 2px;
      background: var(--aggregate);
    }

    .concept-dock {
      display: flex;
      gap: 16px;
      pointer-events: auto;
    }

    .dock-pill {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(83, 106, 120, 0.18);
      border-radius: 4px;
      padding: 12px 18px;
      box-shadow: 0 4px 16px rgba(18, 38, 52, 0.05);
    }

    .dock-label {
      font-size: var(--fs-tick);
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
      letter-spacing: 0.04em;
    }

    .dock-val {
      font-size: var(--fs-sec);
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dock-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot-sample { background: var(--sample); }
    .dot-model { background: var(--model); }
    .dot-agg { background: var(--aggregate); }
  </style>
</head>
<body data-page="06" data-total="27">
  <div id="stage">
    <canvas id="forestCanvas" class="forest-canvas"></canvas>

    <div class="header-bar">
      <div class="module-badge">模块二 · 并行集成与去相关</div>
      <div class="concept-dock">
        <div class="dock-pill">
          <div class="dock-label">样本扰动 (ROWS)</div>
          <div class="dock-val"><span class="dock-dot dot-sample"></span>Bootstrap 重采样</div>
        </div>
        <div class="dock-pill">
          <div class="dock-label">特征扰动 (COLS)</div>
          <div class="dock-val"><span class="dock-dot dot-model"></span>随机特征子集</div>
        </div>
        <div class="dock-pill">
          <div class="dock-label">目标收益 (GOAL)</div>
          <div class="dock-val"><span class="dock-dot dot-agg"></span>降低方差 · 去相关</div>
        </div>
      </div>
    </div>

    <div class="hero-layout">
      <div class="title-block">
        <h1 class="hero-title">Bagging 与随机森林</h1>
        <p class="hero-desc">
          通过自主抽样与随机子空间制造独立多样性，并行训练大量深度决策树，并在投票与平均中抵消单一树的过度拟合与高方差。
        </p>
      </div>
    </div>
  </div>

  <script src="assets/base.js"></script>
  <script>
    // 伪随机数发生器（保持生成式系统的确定性可复现）
    function sfc32(a, b, c, d) {
      return function() {
        a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0; 
        var t = (a + b | 0) + d | 0;
        d = d + 1 | 0;
        a = b ^ b >>> 9;
        b = c + (c << 3) | 0;
        c = (c << 21 | c >>> 11);
        c = c + t | 0;
        return (t >>> 0) / 4294967296;
      }
    }

    const SEED = 20240906;
    const rng = sfc32(SEED, 0x9E3779B9, 0x6A09E667, 0xBB67AE85);

    const cv = document.getElementById('forestCanvas');
    const ctx = cv.getContext('2d');

    // 配色与概念语义映射
    const COLOR_SAMPLE = '#2F7568';    // 数据重采样
    const COLOR_MODEL = '#27648F';     // 树分支/模型
    const COLOR_AGG = '#C34B22';       // 汇聚投票/集成
    const COLOR_MUTED = '#536A78';

    // 森林中单棵树的模型结构生成
    const TREE_COUNT = 9;
    const trees = [];
    const startX = 460;
    const endX = 1480;

    function buildForestModel() {
      trees.length = 0;
      const stepX = (endX - startX) / (TREE_COUNT - 1);

      for (let i = 0; i < TREE_COUNT; i++) {
        const rootX = startX + i * stepX + (rng() - 0.5) * 40;
        const rootY = 220 + (rng() - 0.5) * 30;
        
        // 生成一棵分叉决策树（2~3层）
        const branches = [];
        const leaves = [];

        function growBranch(x, y, angle, length, depth, branchIdx) {
          const nx = x + Math.cos(angle) * length;
          const ny = y + Math.sin(angle) * length;
          
          branches.push({
            x1: x, y1: y,
            x2: nx, y2: ny,
            depth: depth,
            thickness: Math.max(1, 4 - depth * 0.9),
            splitFeature: Math.floor(rng() * 6) + 1 // 模拟随机选取的特征
          });

          if (depth >= 3) {
            // 叶子节点：给出局部预测倾向 (+1 或 -1)
            const pred = rng() > 0.45 ? 1 : -1;
            leaves.push({ x: nx, y: ny, pred: pred, r: 3.5 + rng() * 2 });
            return;
          }

          // 左右分叉（角度加入随机子空间扰动）
          const spread = 0.38 + rng() * 0.22;
          const lenL = length * (0.7 + rng() * 0.15);
          const lenR = length * (0.7 + rng() * 0.15);

          growBranch(nx, ny, angle - spread, lenL, depth + 1, branchIdx * 2);
          growBranch(nx, ny, angle + spread, lenR, depth + 1, branchIdx * 2 + 1);
        }

        // 树向下生长
        growBranch(rootX, rootY, Math.PI / 2 + (rng() - 0.5) * 0.2, 70 + rng() * 20, 1, 1);

        trees.push({
          id: i + 1,
          rootX: rootX,
          rootY: rootY,
          branches: branches,
          leaves: leaves,
          bootstrapSeed: Math.floor(rng() * 900) + 100,
          sampleCount: 63 + Math.floor(rng() * 5), // 约 63.2% 原样本
          treeAggX: rootX,
          treeAggY: rootY + 180 + (rng() - 0.5) * 20
        });
      }
    }

    buildForestModel();

    // 绘制离线静态森林与连线结构图
    function render(timeOffset = 0) {
      const w = 1600;
      const h = 900;
      
      // 高清画布设置
      const dpr = window.devicePixelRatio || 1;
      cv.width = w * dpr;
      cv.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      ctx.clearRect(0, 0, w, h);

      // 1. 顶部：原始总体数据集池 D (Data Pool)
      const poolX = 700;
      const poolY = 82;
      
      // 绘制顶部数据来源流光
      ctx.save();
      ctx.font = '13px "Noto Sans SC", sans-serif';
      ctx.fillStyle = '#536A78';
      ctx.textAlign = 'center';
      ctx.fillText('原始训练集 D (有放回随机抽样 N 次)', poolX, poolY - 26);

      // 绘制顶部数据样本点簇
      const pRng = sfc32(1122, 3344, 5566, 7788);
      for (let i = 0; i < 48; i++) {
        const px = poolX + (pRng() - 0.5) * 380;
        const py = poolY + (pRng() - 0.5) * 26;
        ctx.beginPath();
        ctx.arc(px, py, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(47, 117, 104, 0.45)';
        ctx.fill();
      }
      ctx.restore();

      // 2. 从总体到每棵树的 Bootstrap 抽样流线 (带箭头暗示)
      trees.forEach((tree, idx) => {
        ctx.save();
        ctx.strokeStyle = 'rgba(47, 117, 104, 0.22)';
        ctx.lineWidth = 1.2;
        ctx.setLineDash([4, 4]);
        
        ctx.beginPath();
        ctx.moveTo(poolX + (idx - 4) * 55, poolY + 16);
        ctx.bezierCurveTo(
          poolX + (idx - 4) * 60, poolY + 80,
          tree.rootX, tree.rootY - 70,
          tree.rootX, tree.rootY
        );
        ctx.stroke();
        ctx.restore();

        // 标注袋内样本比例 63.2%
        ctx.save();
        ctx.font = '11px "JetBrains Mono", monospace, sans-serif';
        ctx.fillStyle = 'rgba(47, 117, 104, 0.85)';
        ctx.textAlign = 'center';
        ctx.fillText(`D*_${idx+1}`, tree.rootX, tree.rootY - 24);
        ctx.font = '10px "Noto Sans SC", sans-serif';
        ctx.fillText(`(约63.2%)`, tree.rootX, tree.rootY - 10);
        ctx.restore();
      });

      // 3. 绘制各决策树的骨架结构（随机特征分裂）
      trees.forEach((tree, idx) => {
        // 树根节点
        ctx.beginPath();
        ctx.arc(tree.rootX, tree.rootY, 5, 0, Math.PI * 2);
        ctx.fillStyle = COLOR_MODEL;
        ctx.fill();

        // 分支线条
        tree.branches.forEach(b => {
          ctx.beginPath();
          ctx.moveTo(b.x1, b.y1);
          ctx.lineTo(b.x2, b.y2);
          ctx.strokeStyle = `rgba(39, 100, 143, ${0.85 - b.depth * 0.15})`;
          ctx.lineWidth = b.thickness;
          ctx.stroke();

          // 在树干上标记随机子空间选中的局部特征 m << p
          if (b.depth <= 2 && (idx % 2 === 0)) {
            ctx.save();
            ctx.font = '10px "JetBrains Mono", monospace, sans-serif';
            ctx.fillStyle = 'rgba(83, 106, 120, 0.6)';
            ctx.fillText(`x_${b.splitFeature}`, (b.x1 + b.x2) / 2 + 6, (b.y1 + b.y2) / 2);
            ctx.restore();
          }
        });

        // 叶节点输出倾向（正负预测以微色差展现微弱但独立的弱分类器）
        tree.leaves.forEach(leaf => {
          ctx.beginPath();
          ctx.arc(leaf.x, leaf.y, leaf.r, 0, Math.PI * 2);
          ctx.fillStyle = leaf.pred > 0 ? 'rgba(39, 100, 143, 0.85)' : 'rgba(195, 75, 34, 0.75)';
          ctx.fill();
        });

        // 树的输出汇总点
        const aggPointY = tree.treeAggY;
        ctx.save();
        ctx.strokeStyle = 'rgba(39, 100, 143, 0.2)';
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 3]);
        tree.leaves.forEach(leaf => {
          ctx.beginPath();
          ctx.moveTo(leaf.x, leaf.y);
          ctx.lineTo(tree.treeAggX, aggPointY);
          ctx.stroke();
        });
        ctx.restore();

        // 单树预测标记 T_b(x)
        ctx.beginPath();
        ctx.arc(tree.treeAggX, aggPointY, 4, 0, Math.PI * 2);
        ctx.fillStyle = COLOR_MODEL;
        ctx.fill();

        ctx.save();
        ctx.font = '12px "JetBrains Mono", monospace, sans-serif';
        ctx.fillStyle = COLOR_MODEL;
        ctx.textAlign = 'center';
        ctx.fillText(`h_${idx+1}(x)`, tree.treeAggX, aggPointY + 18);
        ctx.restore();
      });

      // 4. 汇聚流：从各棵独立树流向最终集成决断中心 (Voting / Averaging Center)
      const finalX = 1080;
      const finalY = 740;

      trees.forEach((tree, idx) => {
        ctx.save();
        // 动态呼吸流动感线段
        ctx.strokeStyle = 'rgba(195, 75, 34, 0.35)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(tree.treeAggX, tree.treeAggY + 24);
        ctx.bezierCurveTo(
          tree.treeAggX, tree.treeAggY + 80,
          finalX + (idx - 4) * 22, finalY - 60,
          finalX, finalY
        );
        ctx.stroke();
        ctx.restore();
      });

      // 5. 绘制集成决策中心 (Ensemble Consensus Center)
      ctx.save();
      // 外层扩散圆环
      ctx.beginPath();
      ctx.arc(finalX, finalY, 36, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(195, 75, 34, 0.08)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(195, 75, 34, 0.3)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // 内层核心圆
      ctx.beginPath();
      ctx.arc(finalX, finalY, 20, 0, Math.PI * 2);
      ctx.fillStyle = COLOR_AGG;
      ctx.fill();

      // 集成公式 H(x) = sign(sum h_b(x))
      ctx.font = 'bold 15px "JetBrains Mono", monospace, sans-serif';
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('H(x)', finalX, finalY);

      // 下方公式说明
      ctx.font = '13px "JetBrains Mono", monospace, sans-serif';
      ctx.fillStyle = COLOR_AGG;
      ctx.textAlign = 'center';
      ctx.fillText('H(x) = (1/B) ∑ h_b(x)   [ 方差降至: ρσ² + (1-ρ)/B · σ² ]', finalX, finalY + 44);
      ctx.restore();

      // 6. 去除左侧多余的竖向标尺文字，保持画面纯粹清爽
    }

    render(0);

    // 响应视口或缩放变化自动重新绘制
    window.addEventListener('resize', () => render(0));

    //底盘交互与快捷键
    Deck.init({ index: 6, total: 27, keys: true });
  </script>
</body>
</html>
