<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      position: relative;
    }

    /* 顶部导航与章节标记 */
    .header-zone {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      z-index: 2;
    }

    .chapter-indicator {
      font-size: var(--fs-label);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .chapter-meta {
      font-size: var(--fs-sec);
      color: var(--muted);
      font-feature-settings: "tnum";
    }

    /* 主舞台双栏布局：左侧标题与导读，右侧汇聚图解 */
    .cover-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 56px;
      z-index: 2;
      min-height: 0;
      padding: 10px 0;
    }

    .title-field {
      width: 520px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .cover-title {
      font-size: 64px;
      line-height: 1.12;
      font-weight: 800;
      color: var(--text);
      margin: 0;
      letter-spacing: -0.02em;
    }

    .cover-lead {
      font-size: 20px;
      line-height: 1.6;
      color: var(--muted);
      margin: 0;
    }

    .method-strip {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    .method-card {
      background: var(--surface);
      border: 1px solid rgba(83, 106, 120, 0.18);
      border-radius: 10px;
      padding: 14px 18px;
      box-shadow: 0 4px 16px rgba(18, 38, 52, 0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .method-card .name {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 140px;
    }

    .method-card .desc {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.4;
      margin: 0;
      flex: 1;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-bagging { background: var(--sample); }
    .dot-boosting { background: var(--model); }
    .dot-stacking { background: var(--aggregate); }

    /* 右侧主角：三路范式收束矢量图解 */
    .diagram-stage {
      flex: 1;
      height: 580px;
      background: var(--surface);
      border: 1px solid rgba(83, 106, 120, 0.18);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(18, 38, 52, 0.06);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      box-sizing: border-box;
    }

    .diagram-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* 底栏注记 */
    .footer-zone {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(83, 106, 120, 0.18);
      padding-top: 16px;
      font-size: var(--fs-sec);
      color: var(--muted);
      z-index: 2;
    }

    .footer-left {
      display: flex;
      gap: 32px;
    }

    .footer-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-item strong {
      color: var(--text);
      font-weight: 600;
    }
  </style>
</head>
<body data-page="24" data-total="27">
  <div id="stage">
    <header class="header-zone">
      <span class="chapter-indicator">第五部分 · 体系总结与实践权衡</span>
      <span class="chapter-meta">第 24 / 27 页</span>
    </header>

    <main class="cover-body">
      <section class="title-field min0">
        <h1 class="cover-title">方法选择<br>与收束</h1>
        <p class="cover-lead">
          集成学习并非单一算法，而是管理偏差与方差的三种不同机制。面对实际任务时，需根据数据规模、噪声水平与基模型多样性，在降方差、降偏差与元学习之间做出取舍。
        </p>
        
        <div class="method-strip">
          <div class="method-card">
            <div class="name" style="color: var(--sample);">
              <span class="dot dot-bagging"></span>Bagging
            </div>
            <p class="desc">并行独立采样，对同质深树平均，核心目标是<strong>抑制高方差</strong></p>
          </div>
          <div class="method-card">
            <div class="name" style="color: var(--model);">
              <span class="dot dot-boosting"></span>Boosting
            </div>
            <p class="desc">串行关注残差，逐步迭代补偿弱学习器，核心目标是<strong>降低高偏差</strong></p>
          </div>
          <div class="method-card">
            <div class="name" style="color: var(--aggregate);">
              <span class="dot dot-stacking"></span>Stacking
            </div>
            <p class="desc">严密折外交叉预测，以次级模型组合异质算法，核心目标是<strong>优势互补</strong></p>
          </div>
        </div>
      </section>

      <section class="diagram-stage min0" aria-label="三类集成机制的收束示意图">
        <svg class="diagram-svg" viewBox="0 0 820 520" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- 刻度与辅助基线 -->
          <line x1="40" y1="45" x2="780" y2="45" stroke="#E2EBF0" stroke-width="1.5" stroke-dasharray="4 4" />
          <line x1="40" y1="480" x2="780" y2="480" stroke="#E2EBF0" stroke-width="1.5" stroke-dasharray="4 4" />
          <line x1="280" y1="45" x2="280" y2="480" stroke="#E2EBF0" stroke-width="1.5" stroke-dasharray="4 4" />
          <line x1="520" y1="45" x2="520" y2="480" stroke="#E2EBF0" stroke-width="1.5" stroke-dasharray="4 4" />

          <!-- 列阶段说明文字 -->
          <text x="160" y="34" fill="#536A78" font-size="15" font-weight="700" text-anchor="middle" font-family="var(--font-sans)">基学习器构建与训练</text>
          <text x="400" y="34" fill="#536A78" font-size="15" font-weight="700" text-anchor="middle" font-family="var(--font-sans)">信息传递与集成结合机制</text>
          <text x="660" y="34" fill="#536A78" font-size="15" font-weight="700" text-anchor="middle" font-family="var(--font-sans)">最终决策目标</text>

          <!-- 1. Bagging 路径 (上行: 绿色系 var(--sample) #2F7568) -->
          <g class="path-bagging">
            <!-- 独立并行节点 -->
            <rect x="60" y="80" width="180" height="40" rx="8" fill="#F2F6F8" stroke="#2F7568" stroke-width="1.8" />
            <text x="150" y="105" fill="#2F7568" font-size="15" font-weight="700" text-anchor="middle" font-family="var(--font-sans)">自助采样深树群 (1..B)</text>

            <rect x="60" y="132" width="180" height="36" rx="8" fill="#F2F6F8" stroke="#2F7568" stroke-width="1.5" stroke-dasharray="3 3" />
            <text x="150" y="155" fill="#536A78" font-size="13" text-anchor="middle" font-family="var(--font-sans)">同质独立高方差模型</text>

            <!-- 连线到聚合 -->
            <path d="M 240 100 C 300 100, 330 125, 370 125" stroke="#2F7568" stroke-width="2.2" fill="none" />
            <path d="M 240 150 C 300 150, 330 125, 370 125" stroke="#2F7568" stroke-width="1.8" stroke-dasharray="4 4" fill="none" />
            
            <circle cx="370" cy="125" r="24" fill="#FFFFFF" stroke="#2F7568" stroke-width="2.2" />
            <text x="370" y="131" fill="#2F7568" font-size="16" font-weight="800" text-anchor="middle" font-family="var(--font-sans)">均值</text>
            <text x="370" y="165" fill="#536A78" font-size="13" font-weight="600" text-anchor="middle" font-family="var(--font-sans)">简单算术平均 / 多数票</text>

            <!-- 汇聚到中心决策 -->
            <path d="M 394 125 C 470 125, 500 220, 560 240" stroke="#2F7568" stroke-width="3" stroke-linecap="round" fill="none" />
          </g>

          <!-- 2. Boosting 路径 (中行: 蓝色系 var(--model) #27648F) -->
          <g class="path-boosting">
            <!-- 串行依赖节点 -->
            <rect x="50" y="235" width="88" height="42" rx="8" fill="#F2F6F8" stroke="#27648F" stroke-width="1.8" />
            <text x="94" y="261" fill="#27648F" font-size="15" font-weight="700" text-anchor="middle" font-family="var(--font-sans)">基树 h₁(x)</text>

            <path d="M 138 256 L 158 256" stroke="#27648F" stroke-width="2.2" marker-end="url(#arrow-boosting)" />
            
            <rect x="160" y="235" width="98" height="42" rx="8" fill="#F2F6F8" stroke="#27648F" stroke-width="1.8" />
            <text x="209" y="261" fill="#27648F" font-size="15" font-weight="700" text-anchor="middle" font-family="var(--font-sans)">残差树 h₂(x)</text>

            <!-- 连线到加权聚合 -->
            <path d="M 258 256 L 346 256" stroke="#27648F" stroke-width="2.2" fill="none" />
            
            <circle cx="370" cy="256" r="24" fill="#FFFFFF" stroke="#27648F" stroke-width="2.2" />
            <text x="370" y="262" fill="#27648F" font-size="18" font-weight="800" text-anchor="middle" font-family="var(--font-sans)">Σ</text>
            <text x="370" y="296" fill="#536A78" font-size="13" font-weight="600" text-anchor="middle" font-family="var(--font-sans)">加权步进累加器</text>

            <!-- 汇聚到中心决策 -->
            <path d="M 394 256 C 460 256, 500 262, 555 264" stroke="#27648F" stroke-width="3" stroke-linecap="round" fill="none" />
          </g>

          <!-- 3. Stacking 路径 (下行: 砖红系 var(--aggregate) #C34B22) -->
          <g class="path-stacking">
            <!-- 异质模型列 -->
            <rect x="60" y="365" width="180" height="38" rx="8" fill="#F2F6F8" stroke="#C34B22" stroke-width="1.8" />
            <text x="150" y="389" fill="#C34B22" font-size="14" font-weight="700" text-anchor="middle" font-family="var(--font-sans)">异质基学习器 (SVM/RF/MLP)</text>

            <rect x="60" y="412" width="180" height="36" rx="8" fill="#F2F6F8" stroke="#C34B22" stroke-width="1.5" stroke-dasharray="3 3" />
            <text x="150" y="435" fill="#536A78" font-size="13" text-anchor="middle" font-family="var(--font-sans)">K 折严格折外交叉预测</text>

            <!-- 连线到元学习器 -->
            <path d="M 240 384 C 290 384, 330 390, 346 390" stroke="#C34B22" stroke-width="2.2" fill="none" />
            <path d="M 240 430 C 290 430, 330 390, 346 390" stroke="#C34B22" stroke-width="1.8" stroke-dasharray="4 4" fill="none" />

            <circle cx="370" cy="390" r="24" fill="#FFFFFF" stroke="#C34B22" stroke-width="2.2" />
            <text x="370" y="396" fill="#C34B22" font-size="14" font-weight="800" text-anchor="middle" font-family="var(--font-sans)">Meta</text>
            <text x="370" y="430" fill="#536A78" font-size="13" font-weight="600" text-anchor="middle" font-family="var(--font-sans)">次级特征泛化学习器</text>

            <!-- 汇聚到中心决策 -->
            <path d="M 394 390 C 470 390, 500 310, 560 286" stroke="#C34B22" stroke-width="3" stroke-linecap="round" fill="none" />
          </g>

          <!-- 终局汇聚区：稳健综合判断 -->
          <g class="convergence-target">
            <!-- 外框卡片 -->
            <rect x="560" y="185" width="210" height="155" rx="16" fill="#FFFFFF" stroke="#122634" stroke-width="2.5" filter="drop-shadow(0 12px 32px rgba(18, 38, 52, 0.08))" />
            
            <text x="665" y="225" fill="#122634" font-size="20" font-weight="800" text-anchor="middle" font-family="var(--font-sans)">最优泛化决策</text>
            <text x="665" y="252" fill="#536A78" font-size="14" font-weight="600" text-anchor="middle" font-family="var(--font-sans)">误差平衡与稳健性收敛</text>
            
            <line x1="585" y1="270" x2="745" y2="270" stroke="#E2EBF0" stroke-width="1.5" />
            
            <text x="665" y="296" fill="#237052" font-size="15" font-weight="700" text-anchor="middle" font-family="var(--font-sans)">高方差 · 高偏差 · 异质空间</text>
            <text x="665" y="320" fill="#536A78" font-size="13" text-anchor="middle" font-family="var(--font-sans)">权衡算力成本与过拟合边界</text>
          </g>

          <!-- 箭头标识 -->
          <defs>
            <marker id="arrow-boosting" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#27648F" />
            </marker>
          </defs>
        </svg>
      </section>
    </main>

    <footer class="footer-zone">
      <div class="footer-left">
        <div class="footer-item">
          <span>下节导读：</span>
          <strong>三大范式的选型决策树与边界</strong>
        </div>
        <div class="footer-item">
          <span>核心权衡：</span>
          <strong>方差抑制 · 步进拟合 · 元空间融合</strong>
        </div>
      </div>
      <div class="footer-right">
        <span>机器学习概论第八讲 · 终章前哨</span>
      </div>
    </footer>
  </div>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 24, total: 27 });
  </script>
</body>
</html>
