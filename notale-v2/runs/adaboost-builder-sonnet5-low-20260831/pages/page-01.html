<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root{
    --bg:#EEF1F5;
    --text:#111820;
    --font-sans:"Noto Sans CJK SC",ui-sans-serif,system-ui,sans-serif;
  }
  #stage{
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
    background:var(--bg);
  }
  #field{
    position:absolute;
    inset:0;
    z-index:1;
  }
  .copy{
    position:absolute;
    z-index:5;
    left:56px;
    top:0;
    bottom:0;
    width:640px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    pointer-events:none;
  }
  .kicker{
    color:var(--weight);
    font:600 15px/1 var(--font-mono);
    letter-spacing:.16em;
  }
  h1{
    margin:18px 0 0;
    color:var(--text);
    font-family:var(--font-display);
    font-size:88px;
    font-weight:700;
    line-height:1.02;
    letter-spacing:-.01em;
  }
  h1 .en{
    display:block;
    margin-top:10px;
    color:var(--weak);
    font-family:var(--font-mono);
    font-size:34px;
    font-weight:600;
    letter-spacing:.01em;
  }
  .rule{
    width:88px;
    height:3px;
    margin-top:30px;
    background:var(--weight);
  }
  .dek{
    margin-top:26px;
    max-width:520px;
    color:var(--muted);
    font-size:22px;
    line-height:1.68;
  }
  .dek strong{
    color:var(--correct);
    font-weight:600;
  }
  .legend{
    position:absolute;
    z-index:5;
    right:56px;
    bottom:56px;
    display:flex;
    flex-direction:column;
    gap:10px;
    pointer-events:none;
  }
  .legend .li{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--muted);
    font:14px/1 var(--font-mono);
  }
  .legend .sw{
    width:20px;
    height:0;
    border-top:2px solid;
  }
  .legend .sw.dot{
    width:11px;
    height:11px;
    border-radius:50%;
    border-top:none;
  }
  .readout{
    position:absolute;
    z-index:5;
    right:56px;
    top:56px;
    text-align:right;
    font-family:var(--font-mono);
    pointer-events:none;
  }
  .readout .num{
    color:var(--weight);
    font-size:40px;
    font-weight:700;
    line-height:1;
  }
  .readout .lbl{
    margin-top:6px;
    color:var(--muted);
    font-size:14px;
    letter-spacing:.06em;
  }
</style>
</head>
<body data-page="01" data-total="16">
<div id="stage" tabindex="0" aria-label="AdaBoost 算法封面。多条较弱的分类直线按权重叠加，逐步合成一条准确的决策边界；空格重放。">
  <canvas id="field" class="cv-fill no-pan" aria-hidden="true"></canvas>

  <div class="copy">
    <p class="kicker">ENSEMBLE · BOOSTING</p>
    <h1>AdaBoost 算法<span class="en">Adaptive Boosting</span></h1>
    <div class="rule"></div>
    <p class="dek">没有一个分类器足够聪明，但每一轮都<strong>多纠正一批错误</strong>。把很多个只比瞎猜好一点的弱分类器按权重叠加，就能合成一个准确的强分类器。</p>
  </div>

  <div class="readout" aria-hidden="true">
    <div class="num" id="roundNum">0</div>
    <div class="lbl">当前叠加轮数</div>
  </div>

  <div class="legend" aria-hidden="true">
    <div class="li"><span class="sw" style="border-color:var(--weak)"></span>单轮弱分类器</div>
    <div class="li"><span class="sw" style="border-color:var(--weight);border-top-width:3px"></span>加权合成边界</div>
    <div class="li"><span class="sw dot" style="background:var(--correct)"></span>已分类正确</div>
    <div class="li"><span class="sw dot" style="background:var(--error)"></span>当前仍分类错误</div>
  </div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
(() => {
  "use strict";

  const stage = document.querySelector("#stage");
  const canvas = document.querySelector("#field");
  const roundEl = document.querySelector("#roundNum");
  const W = 1600, H = 900;

  // ---- title exclusion field (copy block occupies left ~700px, full height) ----
  function titleField(x, y) {
    // returns 0 (fully inside, avoid) .. 1 (fully outside, draw freely)
    const fx = (x - 56) / 700;
    const fy = 1;
    if (x < 780) {
      const d = Math.max(0, Math.min(1, (780 - x) / 220));
      return 1 - d;
    }
    return 1;
  }

  // ---- deterministic sample data: two classes in the right-hand field ----
  const rand = new Math.seedrandom("adaboost-cover-v1");
  const AREA = { x0: 860, y0: 130, x1: 1560, y1: 800 };
  const N_POINTS = 46;
  const points = [];
  for (let i = 0; i < N_POINTS; i++) {
    // two soft clusters with a curved true boundary, some overlap noise
    const cls = i % 2 === 0 ? 1 : -1;
    const cx = cls === 1 ? AREA.x0 + 190 : AREA.x1 - 190;
    const cy = AREA.y0 + (AREA.y1 - AREA.y0) * rand();
    const x = Deck.clamp(cx + (rand() - 0.5) * 420, AREA.x0 + 20, AREA.x1 - 20);
    const y = Deck.clamp(cy + (rand() - 0.5) * 90, AREA.y0 + 20, AREA.y1 - 20);
    points.push({ x, y, cls });
  }

  // ---- weak classifiers: simple oriented lines, each only decent, not great ----
  // each: point p0 on line, direction angle, side sign, weight (assigned by boosting-like schedule)
  const CLASSIFIERS = [
    { angle: 0.15,  cy: 300, weight: 0.62 },
    { angle: -0.35, cy: 480, weight: 0.51 },
    { angle: 0.55,  cy: 620, weight: 0.44 },
    { angle: -0.10, cy: 380, weight: 0.38 },
    { angle: 0.30,  cy: 700, weight: 0.30 },
    { angle: -0.60, cy: 220, weight: 0.24 }
  ];
  const TOTAL_ROUNDS = CLASSIFIERS.length;

  function classifierSide(clf, x, y) {
    // line: y = cy + tan(angle)*(x - cx0); side = sign of (y - line)
    const cx0 = (AREA.x0 + AREA.x1) / 2;
    const lineY = clf.cy + Math.tan(clf.angle) * (x - cx0);
    return y < lineY ? 1 : -1;
  }

  function ensembleScore(rounds, x, y) {
    let s = 0;
    for (let i = 0; i < rounds; i++) {
      const clf = CLASSIFIERS[i];
      s += clf.weight * classifierSide(clf, x, y);
    }
    return s;
  }

  let context;
  let clock = 0;
  const reduced = Deck.reduced();
  const ROUND_DURATION = 1400; // ms per round reveal
  const HOLD_AFTER = 2600;     // hold at full rounds before looping
  const CYCLE = TOTAL_ROUNDS * ROUND_DURATION + HOLD_AFTER;

  function currentRoundState(t) {
    const cycleT = t % CYCLE;
    const roundsFloat = Math.min(TOTAL_ROUNDS, cycleT / ROUND_DURATION);
    return roundsFloat;
  }

  function rgba(rgb, a) { return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`; }

  function draw(t) {
    if (!context) return;
    const roundsFloat = currentRoundState(t);
    const roundsInt = Math.floor(roundsFloat + 1e-6);
    const partial = roundsFloat - roundsInt; // 0..1 progress of the currently-appearing line

    context.clearRect(0, 0, W, H);

    const weakColor = Deck.rgb("weak");
    const weightColor = Deck.rgb("weight");
    const correctColor = Deck.rgb("correct");
    const errorColor = Deck.rgb("error");
    const lineColor = Deck.rgb("line");

    // subtle field grid, only in the right-hand data area, faded near title
    context.strokeStyle = rgba(lineColor, 0.5);
    context.lineWidth = 1;
    for (let gx = AREA.x0; gx <= AREA.x1; gx += 60) {
      const a = titleField(gx, 0);
      if (a <= 0.02) continue;
      context.globalAlpha = a;
      context.beginPath();
      context.moveTo(gx, AREA.y0);
      context.lineTo(gx, AREA.y1);
      context.stroke();
    }
    for (let gy = AREA.y0; gy <= AREA.y1; gy += 60) {
      context.globalAlpha = 1;
      context.beginPath();
      context.moveTo(Math.max(780, AREA.x0), gy);
      context.lineTo(AREA.x1, gy);
      context.stroke();
    }
    context.globalAlpha = 1;

    // decision-boundary field via ensemble score sign, drawn as soft background tint
    const cellSize = 14;
    for (let gx = AREA.x0; gx < AREA.x1; gx += cellSize) {
      const a = titleField(gx, 0);
      if (a <= 0.02) continue;
      for (let gy = AREA.y0; gy < AREA.y1; gy += cellSize) {
        const cxp = gx + cellSize / 2, cyp = gy + cellSize / 2;
        const score = ensembleScore(roundsInt, cxp, cyp) +
          (partial > 0 ? CLASSIFIERS[roundsInt] ? CLASSIFIERS[roundsInt].weight * classifierSide(CLASSIFIERS[roundsInt], cxp, cyp) * partial : 0 : 0);
        const strength = Math.min(1, Math.abs(score) / 0.9);
        if (strength < 0.05) continue;
        const col = score > 0 ? correctColor : weightColor;
        context.globalAlpha = a * strength * 0.14;
        context.fillStyle = rgba(col, 1);
        context.fillRect(gx, gy, cellSize, cellSize);
      }
    }
    context.globalAlpha = 1;

    // faint fully-formed weak lines already folded in (thin, weak color)
    for (let i = 0; i < roundsInt; i++) {
      drawClassifierLine(CLASSIFIERS[i], weakColor, 0.22, 1.2);
    }
    // currently animating-in line, slightly stronger
    if (roundsInt < TOTAL_ROUNDS) {
      drawClassifierLine(CLASSIFIERS[roundsInt], weakColor, 0.28 + 0.4 * partial, 1.6);
    }

    // thick combined boundary: trace where ensemble score crosses zero, sampled per column
    context.beginPath();
    let started = false;
    for (let gx = AREA.x0; gx <= AREA.x1; gx += 6) {
      const a = titleField(gx, 0);
      if (a <= 0.02) { started = false; continue; }
      let bestY = null, bestAbs = Infinity;
      for (let gy = AREA.y0; gy <= AREA.y1; gy += 4) {
        const score = ensembleScore(roundsInt, gx, gy) +
          (roundsInt < TOTAL_ROUNDS ? CLASSIFIERS[roundsInt].weight * classifierSide(CLASSIFIERS[roundsInt], gx, gy) * partial : 0);
        const abs = Math.abs(score);
        if (abs < bestAbs) { bestAbs = abs; bestY = gy; }
      }
      if (bestY === null || bestAbs > 0.35) { started = false; continue; }
      if (!started) { context.moveTo(gx, bestY); started = true; }
      else context.lineTo(gx, bestY);
    }
    context.strokeStyle = rgba(weightColor, 0.92);
    context.lineWidth = 3.2;
    context.lineJoin = "round";
    context.stroke();

    // data points colored by whether current ensemble already classifies them correctly
    for (const p of points) {
      const a = titleField(p.x, p.y);
      if (a <= 0.05) continue;
      const score = ensembleScore(roundsInt, p.x, p.y) +
        (roundsInt < TOTAL_ROUNDS ? CLASSIFIERS[roundsInt].weight * classifierSide(CLASSIFIERS[roundsInt], p.x, p.y) * partial : 0);
      const predicted = score >= 0 ? 1 : -1;
      const correct = predicted === p.cls;
      const col = correct ? correctColor : errorColor;
      context.globalAlpha = a;
      context.beginPath();
      context.arc(p.x, p.y, p.cls === 1 ? 6 : 5.4, 0, Math.PI * 2);
      context.fillStyle = rgba(col, 0.92);
      context.fill();
      if (p.cls === -1) {
        context.lineWidth = 1.6;
        context.strokeStyle = rgba(col, 0.92);
        context.stroke();
        context.globalAlpha = 1;
      } else {
        context.globalAlpha = 1;
      }
    }

    roundEl.textContent = String(roundsInt);
  }

  function drawClassifierLine(clf, color, alpha, width) {
    const cx0 = (AREA.x0 + AREA.x1) / 2;
    const x0 = AREA.x0, x1 = AREA.x1;
    const y0 = clf.cy + Math.tan(clf.angle) * (x0 - cx0);
    const y1 = clf.cy + Math.tan(clf.angle) * (x1 - cx0);
    // clip to title field on the left edge by fading, drawn as straight segment (region already right-of-title)
    context.beginPath();
    context.moveTo(x0, Deck.clamp(y0, AREA.y0 - 40, AREA.y1 + 40));
    context.lineTo(x1, Deck.clamp(y1, AREA.y0 - 40, AREA.y1 + 40));
    context.strokeStyle = rgba(color, alpha);
    context.lineWidth = width;
    context.setLineDash([9, 7]);
    context.stroke();
    context.setLineDash([]);
  }

  function renderFrame(t) {
    clock = reduced ? CYCLE - 1 : t;
    draw(clock);
  }

  context = Deck.fit(canvas);
  Deck.onResize(() => { context = Deck.fit(canvas); draw(clock); });

  let stop = Deck.loop(renderFrame, { still: CYCLE - 1 });

  stage.addEventListener("keydown", (e) => {
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      clock = 0;
      if (reduced) { draw(CYCLE - 1); }
    }
  });
  stage.focus({ preventScroll: true });
})();
</script>
</body>
</html>
