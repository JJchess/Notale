<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/lib/katex.min.css">
  <style>
    :root{
      --bg:#EEF1F5; --text:#111820; --font-sans:"Noto Sans CJK SC",ui-sans-serif,system-ui,sans-serif;
    }
    #stage{
      display:flex; flex-direction:column;
      font-family:var(--font-sans); color:var(--text);
    }
    .head{ flex:0 0 auto; }
    .head h1{
      font-family:"Clear Sans","Noto Sans CJK SC",ui-sans-serif,sans-serif;
      font-size:40px; font-weight:700; letter-spacing:-.01em; line-height:1.15;
    }
    .head p{
      margin-top:6px; font-size:18px; line-height:1.5; color:var(--muted);
      max-width:1250px;
    }
    .body{
      flex:1; min-height:0; margin-top:16px;
      display:flex; flex-direction:column; gap:12px;
    }
    /* rounds row */
    .rounds{
      flex:1 1 auto; min-height:0;
      display:flex; gap:14px;
    }
    .round{
      flex:1; min-width:0;
      background:#FAFBFC; border:1px solid #C8D0DB;
      border-radius:4px; padding:16px 18px;
      display:flex; flex-direction:column;
    }
    .round-title{
      display:flex; align-items:baseline; gap:10px; flex:0 0 auto;
      margin-bottom:10px;
    }
    .round-title .rn{
      font-family:var(--font-mono,"JetBrains Mono",monospace);
      font-size:22px; font-weight:700; color:#164E9B;
    }
    .round-title .rt{ font-size:18px; font-weight:700; }
    .step{
      flex:0 0 auto; margin-bottom:10px;
    }
    .step:last-child{ margin-bottom:0; }
    .step-label{
      font-size:14px; color:#657181; margin-bottom:6px;
    }
    /* sample bars */
    .samples{
      display:flex; gap:8px;
    }
    .sample{
      flex:1; min-width:0;
      display:flex; flex-direction:column; align-items:center;
      gap:4px;
    }
    .sample .id{
      font-family:var(--font-mono,monospace); font-size:13px; color:#657181;
    }
    .wbar-track{
      width:100%; height:14px; background:#EEF1F5; border:1px solid #C8D0DB; border-radius:2px;
      overflow:hidden; position:relative;
    }
    .wbar-fill{
      position:absolute; left:0; top:0; bottom:0;
      background:#617CA8;
    }
    .wbar-fill.hi{ background:#164E9B; }
    .wval{
      font-family:var(--font-mono,monospace); font-size:13px; font-weight:700;
    }
    .pred{
      display:flex; align-items:center; justify-content:center;
      width:26px; height:26px; border-radius:50%;
      font-family:var(--font-mono,monospace); font-size:14px; font-weight:700;
      border:1.5px solid;
    }
    .pred.ok{ color:#294E86; border-color:#294E86; background:rgba(41,78,134,.08); }
    .pred.bad{ color:#C64232; border-color:#C64232; background:rgba(198,66,50,.1); }
    .calc-row{
      display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    }
    .calc-block{
      display:flex; align-items:center; gap:8px;
      font-size:15px;
    }
    .calc-eq{ font-family:var(--font-mono,monospace); }
    .calc-val{
      font-family:var(--font-mono,monospace); font-weight:700; font-size:16px; color:#164E9B;
    }
    .arrow-down{
      display:flex; justify-content:center; margin:4px 0;
      color:#657181; font-size:16px;
    }
    .katex-box{ font-size:24px; }
    .katex-box .katex{ font-size:1em; }
    /* final weight table */
    .final{
      flex:0 0 auto;
      background:#FAFBFC; border:1px solid #C8D0DB; border-radius:4px;
      padding:14px 20px;
      display:flex; align-items:center; gap:22px;
    }
    .final-label{ font-size:16px; font-weight:700; flex:0 0 auto; }
    .final-note{ font-size:14px; color:#657181; flex:1; }
    .final-weights{ display:flex; gap:20px; flex:0 0 auto; }
    .fw-item{ display:flex; align-items:center; gap:6px; font-size:15px; }
    .fw-item .id{ font-family:var(--font-mono,monospace); color:#657181; }
    .fw-item .v{ font-family:var(--font-mono,monospace); font-weight:700; color:#164E9B; font-size:17px; }
    .legend-row{
      display:flex; gap:22px; align-items:center; flex:0 0 auto;
      font-size:14px; color:#657181;
    }
    .legend-row .li{ display:flex; align-items:center; gap:6px; }
    .legend-row .sw{ width:14px; height:14px; border-radius:50%; border:1.5px solid; }
  </style>
</head>
<body data-page="08" data-total="16">
  <div id="stage">
    <header class="head">
      <h1>每一轮：算出误差，换算权重，再纠偏</h1>
      <p>三个训练样本，权重从均匀开始。每一轮弱分类器犯的错，都会被换算成一个数字 α，再回头调大错分样本的权重——下一轮的分类器不得不认真对付它们。</p>
    </header>
    <div class="body">
      <div class="rounds">
        <div class="round" id="round1"></div>
        <div class="round" id="round2"></div>
      </div>
      <div class="final" id="final"></div>
    </div>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lib/katex.min.js"></script>
  <script>
  (function(){
    'use strict';

    // ---- canonical data (real computed values) ----
    var IDS = ['x₁','x₂','x₃'];
    var round1 = {
      w:   [1/3, 1/3, 1/3],
      correct: [true, true, false],   // x3 misclassified
      errIdx: 2,
      eps: 1/3,
      alpha: 0.5*Math.log((1-1/3)/(1/3)),
      wNextRaw: null,
      wNext: [0.25, 0.25, 0.5]
    };
    var round2 = {
      w: round1.wNext,
      correct: [false, true, true],   // x1 misclassified this round
      errIdx: 0,
      eps: 0.25,
      alpha: 0.5*Math.log((1-0.25)/0.25),
      wNext: [0.5, 1/6, 1/3]
    };

    function fmt(v, d){ return v.toFixed(d==null?3:d); }
    function fmtFrac(v){
      // pretty-print common fractions used in this page
      var map = {
        '0.333': '1/3', '0.250':'1/4', '0.500':'1/2', '0.167':'1/6'
      };
      var key = v.toFixed(3);
      return map[key] || v.toFixed(3);
    }

    function katexHtml(tex){
      var span = document.createElement('span');
      katex.render(tex, span, {throwOnError:false});
      return span.outerHTML;
    }

    function buildSamplesRow(weights, correctness, maxW){
      var html = '<div class="samples">';
      for (var i=0;i<3;i++){
        var w = weights[i];
        var pct = (w/maxW*100).toFixed(1);
        var isErr = !correctness[i];
        html += '' +
          '<div class="sample">' +
            '<div class="id">'+IDS[i]+'</div>' +
            '<div class="wbar-track"><div class="wbar-fill'+(isErr?' hi':'')+'" style="width:'+pct+'%"></div></div>' +
            '<div class="wval">'+fmtFrac(w)+'</div>' +
            '<div class="pred '+(isErr?'bad':'ok')+'">'+(isErr?'✕':'✓')+'</div>' +
          '</div>';
      }
      html += '</div>';
      return html;
    }

    function buildRound(container, roundNum, data){
      var maxW = Math.max.apply(null, data.w.concat(data.wNext));
      var errId = IDS[data.errIdx];
      var html = '';

      html += '<div class="round-title"><span class="rn">R'+roundNum+'</span><span class="rt">第 '+(roundNum===1?'一':'二')+'轮</span></div>';

      html += '<div class="step">';
      html += '<div class="step-label">本轮样本权重 · 弱分类器判断对错</div>';
      html += buildSamplesRow(data.w, data.correct, maxW);
      html += '</div>';

      html += '<div class="arrow-down">↓ 只统计错分样本的权重</div>';

      html += '<div class="step">';
      html += '<div class="step-label">误差率 ε（错分样本的权重之和）</div>';
      html += '<div class="calc-row">';
      html += '<div class="katex-box">'+katexHtml('\\varepsilon_'+roundNum+' = w_{'+ (data.errIdx+1) +'} = '+fmtFrac(data.eps))+'</div>';
      html += '</div></div>';

      html += '<div class="arrow-down">↓ 误差越小，分类器越可信</div>';

      html += '<div class="step">';
      html += '<div class="step-label">分类器权重 α（这一轮的话语权）</div>';
      html += '<div class="calc-row">';
      html += '<div class="katex-box">'+katexHtml('\\alpha_'+roundNum+' = \\tfrac12\\ln\\dfrac{1-\\varepsilon_'+roundNum+'}{\\varepsilon_'+roundNum+'} = '+fmt(data.alpha,3))+'</div>';
      html += '</div></div>';

      html += '<div class="arrow-down">↓ 错分样本权重乘 e^α，正确样本乘 e^\u207B\u1D43，再归一化</div>';

      html += '<div class="step">';
      html += '<div class="step-label">更新倍数：错分样本被放大、正确样本被缩小</div>';
      html += '<div class="calc-row">';
      html += '<div class="katex-box">'+katexHtml('e^{\\alpha_'+roundNum+'} = '+fmt(Math.exp(data.alpha),3)+'\\quad\\quad e^{-\\alpha_'+roundNum+'} = '+fmt(Math.exp(-data.alpha),3))+'</div>';
      html += '</div></div>';

      html += '<div class="arrow-down">↓ 乘完之后除以总和 Z，让权重仍然合计为 1</div>';

      html += '<div class="step">';
      html += '<div class="step-label">更新后的权重（下一轮起点）</div>';
      html += buildSamplesRow(data.wNext, [true,true,true].map(function(_,i){return i!==data.errIdx || roundNum!==roundNum;}), maxW);
      // second row we don't mark error/ok since it's the *result*, show neutral bars with err-sample highlighted
      html += '</div>';

      container.innerHTML = html;

      // re-render second sample row to highlight the sample that WAS misclassified (now heavier), neutral pred marks removed
      var rows = container.querySelectorAll('.samples');
      var second = rows[1];
      var bars = second.querySelectorAll('.sample');
      bars.forEach(function(bar, i){
        var predEl = bar.querySelector('.pred');
        if (predEl) predEl.remove();
        var fill = bar.querySelector('.wbar-fill');
        if (i === data.errIdx) fill.classList.add('hi');
        else fill.classList.remove('hi');
      });
    }

    buildRound(document.getElementById('round1'), 1, round1);
    buildRound(document.getElementById('round2'), 2, round2);

    // final summary strip
    (function(){
      var el = document.getElementById('final');
      var html = '';
      html += '<div class="final-label">第三轮起点</div>';
      html += '<div class="final-weights">';
      for (var i=0;i<3;i++){
        html += '<div class="fw-item"><span class="id">'+IDS[i]+'</span><span class="v">'+fmtFrac(round2.wNext[i])+'</span></div>';
      }
      html += '</div>';
      html += '<div class="final-note">两轮下来，x₁ 的权重从 1/3 涨到 1/2——它被两轮弱分类器合计判错的次数最多，第三轮必须优先纠正它。</div>';
      el.innerHTML = html;
    })();

  })();
  </script>
</body>
</html>
