<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{
    isolation:isolate;
    position:relative;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
  }

  #field{
    z-index:1;
    max-width:none;
    pointer-events:none;
  }

  .cover-copy{
    position:absolute;
    left:56px;
    top:120px;
    width:620px;
    z-index:5;
    pointer-events:none;
  }

  .kicker{
    color:var(--weight);
    font-family:var(--font-mono);
    font-size:var(--fs-label);
    font-weight:600;
    letter-spacing:.16em;
  }

  h1{
    margin:14px 0 0;
    color:var(--text);
    font-size:64px;
    font-weight:700;
    line-height:1.12;
    letter-spacing:-.01em;
  }

  .lead{
    margin-top:22px;
    max-width:560px;
    color:var(--muted);
    font-size:var(--fs-lead);
    line-height:1.5;
  }

  .legend-row{
    position:absolute;
    left:56px;
    bottom:40px;
    z-index:5;
    display:flex;
    gap:34px;
    pointer-events:none;
  }

  .legend-item{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:var(--font-mono);
    font-size:var(--fs-label);
    color:var(--muted);
  }

  .legend-dot{
    width:14px;
    height:14px;
    border-radius:50%;
    flex:0 0 auto;
  }

  .legend-dot.heavy{ background:var(--weight); }
  .legend-dot.light{ background:var(--rule); }
  .legend-line{
    width:26px;
    height:0;
    border-top:2px dashed var(--ensemble);
  }
</style>
</head>
<body data-page="06" data-total="26">
<div id="stage">
  <canvas id="field" class="cv-fill" aria-hidden="true"></canvas>

  <div class="cover-copy">
    <p class="kicker">第二章</p>
    <h1>谁被算法记住了</h1>
    <p class="lead">每一轮分类之后，AdaBoost 都会重新称量每个样本：分对的变轻，分错的变重。下一个弱学习器，只盯着变重的那些样本。</p>
  </div>

  <div class="legend-row">
    <span class="legend-item"><span class="legend-dot light"></span>分类正确 · 权重降低</span>
    <span class="legend-item"><span class="legend-dot heavy"></span>分类错误 · 权重升高</span>
    <span class="legend-item"><span class="legend-line"></span>当前弱分类器边界</span>
  </div>
</div>

<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/base.js"></script>
<script>
(function(){
  'use strict';

  var W = 1600, H = 900;
  var REPRESENTATIVE_MS = 5400;

  var CONFIG = Object.freeze({
    seed: 'adaboost-ch2-weights',
    count: 130,
    roundPeriod: 3800,     // ms per boundary sweep / reweight cycle
    minR: 3.4,
    maxR: 12.5,
    titleField: Object.freeze({ x: 40, y: 96, w: 660, h: 300 })
  });

  var canvas = document.getElementById('field');
  var ctx = null;
  var points = [];
  var boundary = null;
  var lastTime = REPRESENTATIVE_MS;
  var stopLoop = function(){};
  var offResize = function(){};
  var paused = false;
  var cleaned = false;
  var resizeQueued = 0;

  Deck.init({ index: 6, total: 26, keys: true });

  var palette = {};
  function readPalette(){
    palette.bg      = Deck.rgb('bg');
    palette.rule    = Deck.rgb('rule');
    palette.weight  = Deck.rgb('weight');
    palette.ensemble= Deck.rgb('ensemble');
    palette.text    = Deck.rgb('text');
  }

  function rgba(rgb, a){ return 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+a+')'; }

  function inTitleField(x, y){
    var f = CONFIG.titleField;
    return x >= f.x && x <= f.x + f.w && y >= f.y && y <= f.y + f.h;
  }

  // Two loosely separated clusters (a toy binary classification cloud),
  // with a handful of "hard" points sitting near/inside the opposite cluster.
  function buildModel(){
    var rng = new Math.seedrandom(CONFIG.seed);
    var pts = [];
    var i;

    // Keep the title's screen region sparsely populated: bias sampling toward
    // the right two-thirds of the canvas and the lower band.
    function sampleXY(cx, cy, sx, sy){
      var x, y, tries = 0;
      do {
        var u1 = rng(), u2 = rng();
        var r = Math.sqrt(-2*Math.log(Math.max(u1,1e-6)));
        var th = 2*Math.PI*u2;
        x = cx + r*Math.cos(th)*sx;
        y = cy + r*Math.sin(th)*sy;
        tries++;
      } while (inTitleField(x,y) && tries < 12);
      return { x: Deck.clamp(x, 30, W-30), y: Deck.clamp(y, 30, H-30) };
    }

    var nA = Math.round(CONFIG.count * 0.5);
    var nB = CONFIG.count - nA;

    for (i = 0; i < nA; i++){
      var p = sampleXY(980, 300, 210, 150);
      pts.push({ x:p.x, y:p.y, label:1, w:1, seed: rng() });
    }
    for (i = 0; i < nB; i++){
      var p2 = sampleXY(1080, 640, 220, 160);
      pts.push({ x:p2.x, y:p2.y, label:-1, w:1, seed: rng() });
    }

    // Sprinkle a few genuinely hard points that live on the wrong side
    // of the natural separation, so they get repeatedly misclassified.
    var hardIdx = [];
    for (i = 0; i < pts.length; i++){
      if (rng() < 0.16) hardIdx.push(i);
    }
    hardIdx.forEach(function(idx){
      var p = pts[idx];
      // nudge toward the opposite cluster's territory
      if (p.label === 1) p.y += 190 + rng()*70;
      else p.y -= 190 + rng()*70;
      p.hard = true;
    });

    // Boundary sweeps: a small set of candidate weak-learner lines
    // (near-horizontal splits at varying y and slight tilt), cycled each round.
    var lines = [];
    for (i = 0; i < 5; i++){
      lines.push({
        y0: 430 + (rng()-0.5)*140,
        tilt: (rng()-0.5)*0.34
      });
    }

    return { points: pts, lines: lines };
  }

  function boundaryYAt(line, x){
    // tilt applied around canvas center x
    return line.y0 + (x - 800) * line.tilt;
  }

  function sideOf(line, x, y){
    return y > boundaryYAt(line, x) ? 1 : -1;
  }

  // Weight evolution: at time t, we are in round r = floor(t / roundPeriod).
  // Within a round, weights ease from the previous round's distribution to
  // the new one, driven by whether the *current* boundary misclassifies each point.
  function computeWeights(model, t, roundIndexFloat){
    var r = Math.floor(roundIndexFloat);
    var frac = roundIndexFloat - r; // 0..1 progress inside this round
    var ease = frac*frac*(3-2*frac);
    var line = model.lines[r % model.lines.length];

    return model.points.map(function(p){
      // "correct" label convention: cluster A wants side -1, cluster B wants side +1
      // (arbitrary but fixed), errors are points landing on the wrong side.
      var predictedSide = sideOf(line, p.x, p.y);
      var wantSide = p.label === 1 ? -1 : 1;
      var misclassified = predictedSide !== wantSide;

      // target weight for this round: heavier if misclassified, lighter if correct,
      // clamped, with hard points naturally drifting heavier over rounds.
      var base = misclassified ? 1.65 : 0.62;
      if (p.hard) base *= 1.22;
      var targetLog = Math.log(base);

      // previous round's target (r-1), recursively influences via decay chain;
      // approximate using stored p.wLog carried across the same session.
      if (p.wLogRound !== r){
        p.wLogPrev = (p.wLogRound === undefined) ? targetLog : p.wLogCurrent;
        p.wLogCurrent = targetLog;
        p.wLogRound = r;
      }
      var wLog = Deck.lerp(p.wLogPrev, p.wLogCurrent, ease);
      var w = Math.exp(wLog);
      return { p: p, w: w, misclassified: misclassified, line: line, roundFrac: frac };
    });
  }

  function radiusFor(w){
    // w roughly in [0.5, 2.2] across rounds; map to visual radius range
    var t = Deck.clamp((w - 0.45) / (2.3 - 0.45), 0, 1);
    return Deck.lerp(CONFIG.minR, CONFIG.maxR, t);
  }

  function render(time){
    if (!ctx || !points.model) return;
    var model = points.model;
    var roundIndexFloat = time / CONFIG.roundPeriod;
    var weighted = computeWeights(model, time, roundIndexFloat);
    var line = weighted.length ? weighted[0].line : model.lines[0];
    var frac = weighted.length ? weighted[0].roundFrac : 0;

    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = rgba(palette.bg, 1);
    ctx.fillRect(0,0,W,H);

    // decision boundary line, fading in/out slightly across the round
    var lineAlpha = 0.5 + 0.18*Math.sin(frac*Math.PI);
    ctx.save();
    ctx.setLineDash([10,9]);
    ctx.strokeStyle = rgba(palette.ensemble, lineAlpha);
    ctx.lineWidth = 2;
    ctx.beginPath();
    var x0 = 40, x1 = W-40;
    ctx.moveTo(x0, boundaryYAt(line, x0));
    ctx.lineTo(x1, boundaryYAt(line, x1));
    ctx.stroke();
    ctx.restore();

    // points: radius encodes current weight; color encodes correct/misclassified
    weighted.forEach(function(item){
      var p = item.p;
      var r = radiusFor(item.w);
      var inField = inTitleField(p.x, p.y);
      var alphaMul = inField ? 0.35 : 1;

      var color = item.misclassified ? palette.weight : palette.rule;
      ctx.beginPath();
      ctx.fillStyle = rgba(color, (item.misclassified ? 0.92 : 0.55) * alphaMul);
      ctx.arc(p.x, p.y, r, 0, Math.PI*2);
      ctx.fill();

      if (item.misclassified && r > 6){
        ctx.beginPath();
        ctx.strokeStyle = rgba(palette.weight, 0.9 * alphaMul);
        ctx.lineWidth = 1.4;
        ctx.arc(p.x, p.y, r + 3, 0, Math.PI*2);
        ctx.stroke();
      }

      // small marker for label shape: triangle vs circle-notch to distinguish classes subtly
      if (p.label === 1){
        ctx.beginPath();
        ctx.fillStyle = rgba(palette.text, 0.55*alphaMul);
        ctx.arc(p.x, p.y, Math.max(1.4, r*0.22), 0, Math.PI*2);
        ctx.fill();
      }
    });
  }

  function rebuild(){
    ctx = Deck.fit(canvas);
    if (!ctx) return;
    readPalette();
    var model = buildModel();
    points.model = model;
    render(lastTime);
  }

  function startMotion(){
    stopMotion();
    if (Deck.reduced() || paused || cleaned){
      render(REPRESENTATIVE_MS);
      lastTime = REPRESENTATIVE_MS;
      return;
    }
    var base = lastTime;
    var lastPaint = -100;
    stopLoop = Deck.loop(function(elapsed){
      lastTime = base + elapsed;
      if (elapsed - lastPaint < 32) return;
      lastPaint = elapsed;
      render(lastTime);
    }, { still: 0 });
  }

  function stopMotion(){ stopLoop(); stopLoop = function(){}; }

  function onResize(){
    window.cancelAnimationFrame(resizeQueued);
    resizeQueued = window.requestAnimationFrame(function(){
      resizeQueued = 0;
      rebuild();
    });
  }

  function onMotionPreference(){
    stopMotion();
    lastTime = REPRESENTATIVE_MS;
    paused = false;
    render(lastTime);
    if (!Deck.reduced()) startMotion();
  }

  var media = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  if (media){
    if (media.addEventListener) media.addEventListener('change', onMotionPreference);
    else if (media.addListener) media.addListener(onMotionPreference);
  }

  function cleanup(){
    if (cleaned) return;
    cleaned = true;
    stopMotion();
    offResize();
    window.cancelAnimationFrame(resizeQueued);
  }
  window.addEventListener('pagehide', cleanup);

  offResize = Deck.onResize(onResize);
  rebuild();
  startMotion();
})();
</script>
</body>
</html>
