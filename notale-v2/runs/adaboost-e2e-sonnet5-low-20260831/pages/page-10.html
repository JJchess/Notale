<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/lib/katex.min.css">
<style>
  #stage{
    display:flex;
    flex-direction:column;
    gap:16px;
    font-family:var(--font-sans);
    color:var(--text);
  }
  .head{ flex:0 0 auto; }
  .kicker{
    font-size:var(--fs-label);
    color:var(--weight);
    font-weight:600;
    letter-spacing:.02em;
  }
  h1{
    font-size:var(--fs-h1);
    margin:2px 0 4px;
    font-weight:700;
    line-height:1.2;
  }
  .lead{
    font-size:var(--fs-lead);
    color:var(--muted);
    max-width:1100px;
    line-height:1.4;
  }

  .body{
    flex:1;
    min-height:0;
    display:flex;
    gap:20px;
  }

  .sidebar{
    flex:0 0 388px;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .stagearea{
    flex:1;
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .panel{
    background:var(--surface);
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .panel.q{ background:transparent; padding:16px 18px; }

  .step-title{
    font-size:var(--fs-h2);
    font-weight:700;
    margin-bottom:6px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .step-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px;height:26px;
    border-radius:50%;
    background:var(--ensemble);
    color:#fff;
    font-size:14px;
    font-weight:700;
    font-family:var(--font-mono);
    flex:0 0 auto;
  }
  .step-badge.done{ background:var(--weak); }
  .step-body{
    font-size:var(--fs-body);
    line-height:1.5;
    color:var(--text);
  }
  .step-body .small{
    font-size:var(--fs-sec);
    color:var(--muted);
    margin-top:6px;
  }

  .formula-row{
    margin:10px 0;
    padding:10px 12px;
    background:var(--surface-strong);
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .input-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .input-row label{
    font-size:var(--fs-label);
    color:var(--muted);
  }
  input[type=number]{
    width:110px;
    font-family:var(--font-mono);
    font-size:16px;
    padding:6px 8px;
    border-radius:6px;
    border:var(--line) solid var(--rule);
    background:var(--surface);
    color:var(--text);
  }
  input[type=number]:focus{
    outline:2px solid var(--focus);
    outline-offset:1px;
  }
  input[type=number]:disabled{
    background:var(--surface-strong);
    color:var(--muted);
  }

  .btn{
    font-family:var(--font-sans);
    font-size:var(--fs-label);
    font-weight:600;
    padding:8px 16px;
    border-radius:6px;
    border:var(--line) solid var(--rule);
    background:var(--surface);
    color:var(--text);
    cursor:pointer;
  }
  .btn:hover{ background:var(--surface-strong); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .btn.primary{
    background:var(--ensemble);
    border-color:var(--ensemble);
    color:#fff;
  }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.primary:disabled{ background:var(--surface-strong); border-color:var(--rule); color:var(--muted); }

  .fb{
    margin-top:10px;
    font-size:var(--fs-sec);
    line-height:1.45;
    border-radius:6px;
    padding:8px 10px;
  }
  .fb.ok{ background:rgba(82,113,45,.14); color:var(--weak); }
  .fb.bad{ background:rgba(196,94,18,.14); color:var(--weight); }
  .fb.hidden{ display:none; }

  /* --- stage: sample strip --- */
  .strip-wrap{
    flex:0 0 auto;
    background:var(--surface);
    border-radius:var(--radius);
    padding:14px 18px 10px;
  }
  .strip-title{
    font-size:var(--fs-label);
    color:var(--muted);
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
  }
  .strip{
    display:flex;
    gap:8px;
  }
  .sample{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:8px 4px 10px;
    border-radius:6px;
    background:var(--surface-strong);
    position:relative;
  }
  .sample .idx{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--muted);
  }
  .sample .mark{
    width:30px;height:30px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);
    font-size:15px;
    font-weight:700;
    color:#fff;
    background:var(--rule);
  }
  .sample.correct .mark{ background:var(--weak); }
  .sample.wrong .mark{ background:var(--weight); }
  .sample .tag{
    font-size:11px;
    color:var(--muted);
    font-family:var(--font-mono);
  }
  .sample .wbar-track{
    width:100%;
    height:64px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .sample .wbar{
    width:16px;
    border-radius:3px 3px 0 0;
    background:var(--ensemble);
    transition:height .5s cubic-bezier(.4,0,.2,1), background .3s;
  }
  .sample .wval{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text);
  }

  /* --- chart panel --- */
  .chart-wrap{
    flex:1;
    min-height:0;
    background:var(--surface);
    border-radius:var(--radius);
    padding:14px 18px;
    display:flex;
    flex-direction:column;
  }
  .chart-title{
    font-size:var(--fs-label);
    color:var(--muted);
    margin-bottom:4px;
  }
  #chart{ flex:1; min-height:0; }

  .legend{
    display:flex;
    gap:18px;
    font-size:var(--fs-label);
    color:var(--muted);
    margin-top:2px;
  }
  .legend .li{ display:flex; align-items:center; gap:6px; }
  .legend .sw{ width:12px;height:12px;border-radius:3px; }

  .progress-dots{
    display:flex;
    gap:6px;
    margin-top:2px;
  }
  .progress-dots .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--rule);
  }
  .progress-dots .dot.active{ background:var(--ensemble); }
  .progress-dots .dot.done{ background:var(--weak); }
</style>
</head>
<body data-page="10" data-total="26">
<div id="stage">

  <div class="head">
    <div class="kicker">第二章 · 权重怎样更新</div>
    <h1>算一轮权重更新，看误分类的样本会不会真的变重</h1>
    <div class="lead">左边三步各自算一个数；算对才能进入下一步。右边始终显示 8 个样本当前的权重条。</div>
  </div>

  <div class="body">

    <div class="sidebar">

      <div class="panel step1">
        <div class="step-title"><span class="step-badge" id="badge1">1</span>加权错误率 ε</div>
        <div class="step-body">
          右侧条形图旁标了 <span class="tagx wrong">✕</span> 的 3 个样本被本轮弱学习器分错了。
          ε 就是这些样本当前权重之和。
        </div>
        <div class="formula-row" id="f-eps"></div>
        <div class="input-row">
          <label for="in-eps">ε =</label>
          <input type="number" id="in-eps" step="0.001" placeholder="0.000">
          <button class="btn primary" id="check1">检查</button>
        </div>
        <div class="fb hidden" id="fb1"></div>
      </div>

      <div class="panel step2">
        <div class="step-title"><span class="step-badge" id="badge2">2</span>模型权重 α</div>
        <div class="step-body">
          ε 越小，说明这个弱学习器越靠谱，应该给它更大的话语权。
        </div>
        <div class="formula-row" id="f-alpha"></div>
        <div class="input-row">
          <label for="in-alpha">α =</label>
          <input type="number" id="in-alpha" step="0.001" placeholder="0.000" disabled>
          <button class="btn primary" id="check2" disabled>检查</button>
        </div>
        <div class="fb hidden" id="fb2"></div>
      </div>

      <div class="panel step3">
        <div class="step-title"><span class="step-badge" id="badge3">3</span>更新并归一化</div>
        <div class="step-body">
          分错的样本权重乘 <span class="katex-inline" id="f-up"></span>，分对的乘
          <span class="katex-inline" id="f-down"></span>，再让全体权重重新加起来等于 1。
        </div>
        <div class="input-row">
          <button class="btn primary" id="apply3" disabled>对每个样本应用更新</button>
        </div>
        <div class="fb hidden" id="fb3"></div>
      </div>

    </div>

    <div class="stagearea">

      <div class="strip-wrap">
        <div class="strip-title">
          <span>8 个训练样本 · 当前权重（本轮更新前）</span>
          <span id="stripState">第 0 轮更新前</span>
        </div>
        <div class="strip" id="strip"></div>
      </div>

      <div class="chart-wrap">
        <div class="chart-title">权重变化：更新前 → 更新并归一化后</div>
        <div id="chart"></div>
        <div class="legend">
          <span class="li"><span class="sw" style="background:var(--rule)"></span>更新前</span>
          <span class="li"><span class="sw" style="background:var(--weight)"></span>误分类样本的新权重</span>
          <span class="li"><span class="sw" style="background:var(--weak)"></span>正确分类样本的新权重</span>
        </div>
      </div>

    </div>

  </div>

</div>

<script src="assets/base.js"></script>
<script src="assets/lib/katex.min.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------- 数据：8 个样本，本轮弱学习器的预测结果 ----------
  // 权重均匀初始化 1/8；第 4、5、7 号（下标从 0）被这一轮弱学习器分错。
  var N = 8;
  var wrongIdx = [3, 4, 7];
  var initW = new Array(N).fill(1 / N);
  var wrongSet = new Set(wrongIdx);

  var eps = wrongIdx.reduce(function(s, i){ return s + initW[i]; }, 0);   // 0.375
  var alpha = 0.5 * Math.log((1 - eps) / eps);                            // ≈0.2554

  function computeUpdated(){
    var raw = initW.map(function(w, i){
      return wrongSet.has(i) ? w * Math.exp(alpha) : w * Math.exp(-alpha);
    });
    var Z = raw.reduce(function(a,b){ return a+b; }, 0);
    return raw.map(function(v){ return v / Z; });
  }
  var updatedW = computeUpdated();

  // ---------- state ----------
  var state = {
    step: 1,           // 1,2,3,4(完成)
    eps: null,
    alpha: null,
    applied: false,
  };

  var TOL = 0.01;

  // ---------- DOM refs ----------
  var $ = function(id){ return document.getElementById(id); };
  var elStrip = $("strip");
  var elStripState = $("stripState");
  var chart = echarts.init($("chart"), null, { renderer: "svg" });

  // ---------- KaTeX static formulas ----------
  katex.render("\\varepsilon_t=\\sum_{i:\\,h_t(x_i)\\neq y_i} w_i^{(t)}", $("f-eps"), { throwOnError:false });
  katex.render("\\alpha_t=\\dfrac{1}{2}\\ln\\dfrac{1-\\varepsilon_t}{\\varepsilon_t}", $("f-alpha"), { throwOnError:false });
  katex.render("e^{\\alpha_t}", $("f-up"), { throwOnError:false });
  katex.render("e^{-\\alpha_t}", $("f-down"), { throwOnError:false });

  // ---------- render sample strip ----------
  function renderStrip(weights, opts){
    opts = opts || {};
    elStrip.innerHTML = "";
    var maxW = Math.max.apply(null, weights.concat(initW)) * 1.15;
    for (var i = 0; i < N; i++){
      var wrong = wrongSet.has(i);
      var div = document.createElement("div");
      div.className = "sample " + (wrong ? "wrong" : "correct");
      var barColor = wrong ? "var(--weight)" : "var(--weak)";
      if (!opts.updated) barColor = "var(--ensemble)";
      var h = Math.max(4, (weights[i] / maxW) * 64);
      div.innerHTML =
        '<span class="idx">#' + (i+1) + '</span>' +
        '<span class="mark">' + (wrong ? "✕" : "✓") + '</span>' +
        '<span class="tag">' + (wrong ? "分错" : "分对") + '</span>' +
        '<span class="wbar-track"><span class="wbar" style="height:' + h.toFixed(1) + 'px;background:' + barColor + '"></span></span>' +
        '<span class="wval">' + weights[i].toFixed(3) + '</span>';
      elStrip.appendChild(div);
    }
  }
  renderStrip(initW, { updated:false });

  // ---------- chart ----------
  function renderChart(showUpdated){
    var cats = [];
    for (var i=0;i<N;i++) cats.push("#" + (i+1));
    var before = initW.slice();
    var afterWrong = [], afterCorrect = [];
    for (var i=0;i<N;i++){
      if (showUpdated){
        afterWrong.push(wrongSet.has(i) ? updatedW[i] : 0);
        afterCorrect.push(wrongSet.has(i) ? 0 : updatedW[i]);
      } else {
        afterWrong.push(0);
        afterCorrect.push(0);
      }
    }
    chart.setOption({
      textStyle: { fontSize: 16, fontFamily: "IBM Plex Sans, Noto Sans SC, sans-serif" },
      grid: { left: 48, right: 20, top: 24, bottom: 30 },
      xAxis: {
        type: "category", data: cats,
        axisLabel: { fontSize: 14, color: "#52636B" },
        axisLine: { lineStyle: { color: "#91A2AA" } }
      },
      yAxis: {
        type: "value", name: "权重", nameTextStyle: { fontSize: 14, color:"#52636B" },
        min: 0, max: 0.3,
        axisLabel: { fontSize: 12, color: "#52636B" },
        splitLine: { lineStyle: { color: "#DCE5E9" } }
      },
      series: [
        {
          name: "更新前", type: "bar", data: before,
          barGap: "-100%", barWidth: 26,
          itemStyle: { color: "#91A2AA", opacity: 0.55 },
          z: 1
        },
        {
          name: "误分类样本的新权重", type: "bar", data: afterWrong,
          barWidth: 12, barGap: "10%",
          itemStyle: { color: "#C45E12" },
          z: 2
        },
        {
          name: "正确分类样本的新权重", type: "bar", data: afterCorrect,
          barWidth: 12, barGap: "10%",
          itemStyle: { color: "#52712D" },
          z: 2
        }
      ],
      animationDuration: 500
    });
  }
  renderChart(false);

  window.addEventListener("resize", function(){ chart.resize(); });
  Deck.onResize && Deck.onResize(function(){ chart.resize(); });

  // ---------- step 1: eps ----------
  var badge1 = $("badge1"), fb1 = $("fb1"), inEps = $("in-eps"), check1 = $("check1");

  function showFb(el, ok, msg){
    el.className = "fb " + (ok ? "ok" : "bad");
    el.textContent = msg;
  }

  check1.addEventListener("click", function(){
    var v = parseFloat(inEps.value);
    if (isNaN(v)){
      showFb(fb1, false, "先填一个数：把 #4、#5、#8 三个分错样本的权重加起来。");
      return;
    }
    if (Math.abs(v - eps) < TOL){
      state.eps = v;
      badge1.classList.add("done");
      badge1.textContent = "✓";
      showFb(fb1, true, "对。3 个分错样本各占 1/8，加起来 ε = 3/8 = " + eps.toFixed(3) + "。");
      inEps.disabled = true;
      check1.disabled = true;
      $("in-alpha").disabled = false;
      $("check2").disabled = false;
      state.step = 2;
    } else {
      showFb(fb1, false, "不对。分错的是 #4、#5、#8，每个当前权重都是 1/8，三个加起来是多少？");
    }
  });

  // ---------- step 2: alpha ----------
  var badge2 = $("badge2"), fb2 = $("fb2"), inAlpha = $("in-alpha"), check2 = $("check2");

  check2.addEventListener("click", function(){
    if (state.step < 2) return;
    var v = parseFloat(inAlpha.value);
    if (isNaN(v)){
      showFb(fb2, false, "代入 ε = " + eps.toFixed(3) + " 算一下 α = 0.5·ln((1-ε)/ε)。");
      return;
    }
    if (Math.abs(v - alpha) < TOL){
      state.alpha = v;
      badge2.classList.add("done");
      badge2.textContent = "✓";
      showFb(fb2, true, "对。α = 0.5·ln(0.625/0.375) ≈ " + alpha.toFixed(3) + "，是正数——这个弱学习器比瞎猜强，值得给票权。");
      inAlpha.disabled = true;
      check2.disabled = true;
      $("apply3").disabled = false;
      state.step = 3;
    } else {
      showFb(fb2, false, "不对。ε<0.5 时 α 应该是正数；再代入公式算一次，保留三位小数。");
    }
  });

  // ---------- step 3: apply update ----------
  var badge3 = $("badge3"), fb3 = $("fb3"), apply3 = $("apply3");

  apply3.addEventListener("click", function(){
    if (state.step < 3 || state.applied) return;
    state.applied = true;
    badge3.classList.add("done");
    badge3.textContent = "✓";
    apply3.disabled = true;
    apply3.textContent = "已应用";

    renderStrip(updatedW, { updated:true });
    elStripState.textContent = "第 1 轮更新后";
    renderChart(true);

    var sum = updatedW.reduce(function(a,b){return a+b;}, 0);
    var wrongSum = wrongIdx.reduce(function(s,i){ return s+updatedW[i]; }, 0);
    var correctSum = sum - wrongSum;
    showFb(fb3, true,
      "更新后权重和 = " + sum.toFixed(3) + "（归一化生效）。" +
      "3 个分错样本合计占 " + (wrongSum*100).toFixed(1) + "%，" +
      "5 个分对样本合计占 " + (correctSum*100).toFixed(1) + "%——" +
      "分错的样本确实变重了，下一轮弱学习器会被逼着更关注它们。"
    );
  });

})();
</script>
</body>
</html>
