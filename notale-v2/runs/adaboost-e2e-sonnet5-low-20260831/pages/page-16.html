<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{
  position:relative;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}
#field{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
  pointer-events:none;
}
.cover-copy{
  position:absolute;
  left:56px;
  top:150px;
  width:620px;
  z-index:5;
  pointer-events:none;
}
.kicker{
  color:var(--weight);
  font-size:15px;
  font-weight:600;
  letter-spacing:.22em;
}
h1{
  margin-top:18px;
  color:var(--text);
  font-size:64px;
  font-weight:700;
  line-height:1.16;
  letter-spacing:-.01em;
}
h1 .accent{ color:var(--ensemble); }
.lead{
  margin-top:26px;
  color:var(--muted);
  font-size:22px;
  line-height:1.55;
  max-width:560px;
}
.legend{
  position:absolute;
  left:56px;
  bottom:56px;
  z-index:5;
  display:flex;
  flex-direction:column;
  gap:10px;
  pointer-events:none;
}
.legend .li{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:15px;
  color:var(--muted);
}
.legend .sw{
  width:26px;
  height:2px;
  flex:0 0 auto;
}
.legend .sw.dot{
  width:9px;
  height:9px;
  border-radius:50%;
}
</style>
</head>
<body data-page="16" data-total="26">
<div id="stage">
  <canvas id="field" aria-hidden="true"></canvas>

  <section class="cover-copy" aria-label="章节标题">
    <p class="kicker">第四章</p>
    <h1>为什么<span class="accent">有效</span>，又在何处<span class="accent">失效</span></h1>
    <p class="lead">中心区域，弱学习器的投票一致收敛；边缘的重叠与噪声样本，投票仍在摇摆。本章从指数损失与分类间隔出发，找到这条边界。</p>
  </section>

  <div class="legend" aria-hidden="true">
    <div class="li"><span class="sw" style="background:var(--ensemble)"></span>加权投票收敛区</div>
    <div class="li"><span class="sw dot" style="background:var(--weight)"></span>投票仍在摇摆的样本</div>
  </div>
</div>
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/base.js"></script>
<script>
(function () {
  'use strict';

  var W = 1600, H = 900;
  var REPRESENTATIVE_MS = 4200;

  var CONFIG = Object.freeze({
    seed: 'adaboost-margin-16',
    learnerCount: 46,
    center: Object.freeze({ x: 1108, y: 470 }),
    quiet: Object.freeze({ cx: 366, cy: 420, rx: 372, ry: 330 })
  });

  var canvas = document.getElementById('field');
  var media = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var staticLayer = document.createElement('canvas');
  var ctx = null;
  var model = null;
  var stopLoop = function(){};
  var offResize = function(){};
  var lastTime = REPRESENTATIVE_MS;
  var resizeQueued = 0;
  var noop = function(){};

  Deck.init({ keys: false });

  var palette = {};
  function readPalette() {
    palette.ensemble = Deck.rgb('ensemble');
    palette.weak = Deck.rgb('weak');
    palette.weight = Deck.rgb('weight');
    palette.rule = Deck.rgb('rule');
    palette.bg = Deck.rgb('bg');
  }

  function rgba(rgb, a) {
    return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')';
  }

  function quietDistance(x, y) {
    var q = CONFIG.quiet;
    return Math.hypot((x - q.cx) / q.rx, (y - q.cy) / q.ry);
  }

  // 每个弱学习器是一条带方向的直线（一个轴对齐或斜的决策边界）
  function buildLearners() {
    var rng = new Math.seedrandom(CONFIG.seed + '/learners');
    var learners = [];
    var c = CONFIG.center;
    for (var i = 0; i < CONFIG.learnerCount; i++) {
      // 角度围绕中心分布，越靠后的学习器角度扰动更小（代表越训练越聚焦）
      var baseAngle = rng() * Math.PI;
      var jitter = (rng() - 0.5) * 0.9;
      var angle = baseAngle + jitter * (1 - i / CONFIG.learnerCount) * 0.6;
      var offset = (rng() - 0.5) * 210;
      var weight = 0.35 + rng() * 0.9;
      learners.push({
        angle: angle,
        nx: Math.cos(angle), ny: Math.sin(angle),
        offset: offset,
        weight: weight,
        cx: c.x + Math.cos(angle + Math.PI / 2) * offset * 0.4,
        cy: c.y + Math.sin(angle + Math.PI / 2) * offset * 0.4
      });
    }
    return learners;
  }

  // 在点 (x,y) 处，汇总所有弱学习器的加权投票，得到集成得分
  function voteAt(x, y, learners) {
    var sum = 0, totalW = 0;
    for (var i = 0; i < learners.length; i++) {
      var L = learners[i];
      var dx = x - L.cx, dy = y - L.cy;
      var side = dx * (-L.ny) + dy * L.nx; // 到分割线的有符号距离方向
      var vote = Math.tanh(side / 90);
      sum += vote * L.weight;
      totalW += L.weight;
    }
    return sum / totalW; // [-1,1]，越接近 ±1 表示越多学习器一致
  }

  function buildNoisyPoints() {
    var rng = new Math.seedrandom(CONFIG.seed + '/noise');
    var pts = [];
    var candidates = [
      { x: 1360, y: 240 }, { x: 1420, y: 640 }, { x: 980, y: 760 },
      { x: 1240, y: 780 }, { x: 1080, y: 190 }, { x: 1470, y: 430 }
    ];
    for (var i = 0; i < candidates.length; i++) {
      pts.push({
        x: candidates[i].x + (rng() - 0.5) * 20,
        y: candidates[i].y + (rng() - 0.5) * 20,
        phase: rng()
      });
    }
    return pts;
  }

  function buildModel() {
    var learners = buildLearners();
    var noisyPoints = buildNoisyPoints();
    return { learners: learners, noisyPoints: noisyPoints };
  }

  // 静态层：投票场的等势带 + 弱学习器线条痕迹
  function drawStatic() {
    var ratio = canvas.__r || 1;
    if (staticLayer.width !== canvas.width || staticLayer.height !== canvas.height) {
      staticLayer.width = canvas.width;
      staticLayer.height = canvas.height;
    }
    var g = staticLayer.getContext('2d');
    g.setTransform(ratio, 0, 0, ratio, 0, 0);
    g.clearRect(0, 0, W, H);

    g.fillStyle = rgba(palette.bg, 1);
    g.fillRect(0, 0, W, H);

    var step = 6;
    for (var y = 40; y < 900; y += step) {
      for (var x = 700; x < 1560; x += step) {
        if (quietDistance(x, y) < 1.02) continue;
        var v = voteAt(x, y, model.learners);
        var mag = Math.abs(v);
        var alpha = 0;
        var color = null;
        if (mag > 0.9) {
          alpha = (mag - 0.9) * 3.2;
          color = v > 0 ? palette.ensemble : palette.weak;
        }
        if (alpha > 0.02) {
          g.fillStyle = rgba(color, Math.min(alpha, 0.5));
          g.fillRect(x, y, step, step);
        }
      }
    }

    // 弱学习器的边界线，越靠后的越清晰、越靠前的越淡
    g.save();
    g.lineCap = 'round';
    for (var i = 0; i < model.learners.length; i++) {
      var L = model.learners[i];
      var late = i / model.learners.length;
      var len = 480;
      var px = -L.ny, py = L.nx;
      var x1 = L.cx - px * len, y1 = L.cy - py * len;
      var x2 = L.cx + px * len, y2 = L.cy + py * len;
      if (quietDistance((x1+x2)/2, (y1+y2)/2) < 0.85) continue;
      g.strokeStyle = rgba(palette.rule, 0.05 + late * 0.1);
      g.lineWidth = 0.6 + late * 0.5;
      g.beginPath();
      g.moveTo(x1, y1);
      g.lineTo(x2, y2);
      g.stroke();
    }
    g.restore();

    // 中心收敛核：加权投票最一致的地方，画一条清晰分割带
    g.save();
    g.strokeStyle = rgba(palette.ensemble, 0.55);
    g.lineWidth = 2;
    g.beginPath();
    var cx = CONFIG.center.x, cy = CONFIG.center.y;
    g.moveTo(cx - 260, cy + 40);
    g.bezierCurveTo(cx - 100, cy - 60, cx + 100, cy + 90, cx + 300, cy - 30);
    g.stroke();
    g.restore();
  }

  function drawDynamic(time) {
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(staticLayer, 0, 0, W, H);

    // 边缘摇摆的噪声点：投票在正负间脉动，代表间隔不稳定的样本
    for (var i = 0; i < model.noisyPoints.length; i++) {
      var p = model.noisyPoints[i];
      var t = (time / 1000) * 0.5 + p.phase * 10;
      var wobble = Math.sin(t) * 0.5 + 0.5;
      var color = wobble > 0.5 ? palette.ensemble : palette.weak;
      var r = 5 + wobble * 2.5;

      ctx.save();
      ctx.strokeStyle = rgba(palette.weight, 0.85);
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r + 5, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = rgba(color, 0.9);
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function render(time) {
    if (!ctx || !model) return;
    readPalette.call(null);
    palette.ensemble = Deck.rgb('ensemble');
    palette.weak = Deck.rgb('weak');
    palette.weight = Deck.rgb('weight');
    drawDynamic(time);
  }

  function rebuild() {
    ctx = Deck.fit(canvas);
    if (!ctx) return;
    readPalette();
    model = buildModel();
    drawStatic();
    render(lastTime);
  }

  function startMotion() {
    stopMotion();
    if (Deck.reduced()) {
      render(REPRESENTATIVE_MS);
      lastTime = REPRESENTATIVE_MS;
      return;
    }
    var lastPaint = -100;
    stopLoop = Deck.loop(function (elapsed) {
      lastTime = elapsed;
      if (elapsed - lastPaint < 32) return;
      lastPaint = elapsed;
      render(elapsed);
    }, { still: REPRESENTATIVE_MS });
  }

  function stopMotion() {
    stopLoop();
    stopLoop = noop;
  }

  function onResize() {
    window.cancelAnimationFrame(resizeQueued);
    resizeQueued = window.requestAnimationFrame(function () {
      resizeQueued = 0;
      rebuild();
      render(lastTime);
    });
  }

  function onMotionPreference() {
    stopMotion();
    lastTime = REPRESENTATIVE_MS;
    render(lastTime);
    if (!Deck.reduced()) startMotion();
  }

  offResize = Deck.onResize(onResize);
  if (media) {
    if (media.addEventListener) media.addEventListener('change', onMotionPreference);
    else if (media.addListener) media.addListener(onMotionPreference);
  }
  window.addEventListener('pagehide', function () {
    stopMotion();
    offResize();
  }, { once: true });

  rebuild();
  startMotion();
})();
</script>
</body>
</html>
