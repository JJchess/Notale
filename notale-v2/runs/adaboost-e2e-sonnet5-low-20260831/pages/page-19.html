<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/lib/seedrandom.min.js"></script>
<style>
  #stage{display:flex;flex-direction:column}
  .head{flex:0 0 auto;margin-bottom:14px}
  h1{font-size:var(--fs-h1);font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
  .lead{font-size:var(--fs-lead);color:var(--text);margin:0;max-width:1180px}
  .lead b{color:var(--ensemble)}

  .row{flex:1;min-height:0;display:flex;gap:20px}
  .panel-case{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);
    border-radius:var(--radius);padding:14px 16px 12px;box-shadow:0 0 0 var(--line) var(--rule) inset}
  .case-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .case-name{font-size:var(--fs-h2);font-weight:700;color:var(--text)}
  .case-acc{font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--ensemble)}
  .case-acc .unit{font-size:14px;color:var(--muted);font-weight:400;margin-left:2px}
  .case-note{flex:0 0 auto;font-size:var(--fs-sec);color:var(--muted);margin:0 0 8px;line-height:1.4}
  .cvbox{flex:1;min-height:0;position:relative;border-radius:var(--radius);overflow:hidden;
    box-shadow:0 0 0 1px var(--rule) inset;background:#fff}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .err-tag{flex:0 0 auto;margin-top:8px;font-size:var(--fs-label);color:var(--muted);
    display:flex;justify-content:space-between}
  .err-tag .num{color:var(--weight);font-weight:700}

  .foot{flex:0 0 auto;margin-top:14px;font-size:var(--fs-sec);color:var(--muted);line-height:1.5}
  .foot b{color:var(--text);font-weight:700}
</style>
</head>
<body data-page="19" data-total="26">
<div id="stage">

  <div class="head">
    <h1>三种数据分布下的 AdaBoost</h1>
    <p class="lead">同一套 <b>40 轮决策树桩 AdaBoost</b>，分别在易分、重叠、带噪声的数据上训练。
      背景色是最终集成的决策边界，圆点是训练样本，环粗代表该样本在训练结束时的权重。</p>
  </div>

  <div class="row" id="row"></div>

  <div class="foot" id="foot"></div>
</div>

<script src="assets/base.js"></script>
<script>
Deck.init({ index: 19, total: 26, keys: false });

// ---------- 数据生成（固定种子，三种分布） ----------
function makeCase(kind, seed){
  var rng = new Math.seedrandom(seed);
  function gauss(){ // Box-Muller
    var u = rng()||1e-9, v = rng();
    return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
  }
  var pts = [], N = 90;
  if (kind === 'easy'){
    for (var i=0;i<N;i++){
      var y = i % 2;
      var cx = y ? 1.6 : -1.6, cy = y ? 1.2 : -1.2;
      pts.push({x: cx + gauss()*0.55, y: cy + gauss()*0.55, t: y?1:-1});
    }
  } else if (kind === 'overlap'){
    for (var i=0;i<N;i++){
      var y = i % 2;
      var cx = y ? 0.75 : -0.75, cy = y ? 0.55 : -0.55;
      pts.push({x: cx + gauss()*1.05, y: cy + gauss()*1.05, t: y?1:-1});
    }
  } else { // noisy: 结构清晰但 10% 标签翻转
    for (var i=0;i<N;i++){
      var y = i % 2;
      var cx = y ? 1.6 : -1.6, cy = y ? 1.2 : -1.2;
      var t = y?1:-1;
      if (rng() < 0.12) t = -t; // 标签噪声
      pts.push({x: cx + gauss()*0.55, y: cy + gauss()*0.55, t: t});
    }
  }
  return pts;
}

// ---------- 决策树桩弱学习器 ----------
function bestStump(data, w){
  var best = null;
  ['x','y'].forEach(function(dim){
    var vals = data.map(function(d){return d[dim];}).slice().sort(function(a,b){return a-b;});
    var thresholds = [];
    for (var i=0;i<vals.length-1;i++) thresholds.push((vals[i]+vals[i+1])/2);
    thresholds.forEach(function(th){
      [1,-1].forEach(function(dir){
        var err = 0;
        for (var i=0;i<data.length;i++){
          var pred = (data[i][dim] <= th ? -1 : 1) * dir;
          if (pred !== data[i].t) err += w[i];
        }
        if (!best || err < best.err) best = {dim:dim, th:th, dir:dir, err:err};
      });
    });
  });
  return best;
}
function stumpPredict(stump, x, y){
  var v = stump.dim === 'x' ? x : y;
  return (v <= stump.th ? -1 : 1) * stump.dir;
}

function trainAdaBoost(data, rounds){
  var n = data.length;
  var w = new Array(n).fill(1/n);
  var ensemble = [];
  for (var r=0;r<rounds;r++){
    var stump = bestStump(data, w);
    var err = Math.max(1e-6, Math.min(1-1e-6, stump.err));
    var alpha = 0.5 * Math.log((1-err)/err);
    ensemble.push({stump:stump, alpha:alpha});
    var z = 0;
    for (var i=0;i<n;i++){
      var pred = stumpPredict(stump, data[i].x, data[i].y);
      w[i] = w[i] * Math.exp(-alpha * data[i].t * pred);
      z += w[i];
    }
    for (var i=0;i<n;i++) w[i] /= z;
  }
  return {ensemble: ensemble, finalWeight: w};
}
function ensemblePredict(ensemble, x, y){
  var s = 0;
  for (var k=0;k<ensemble.length;k++){
    s += ensemble[k].alpha * stumpPredict(ensemble[k].stump, x, y);
  }
  return s; // 符号即分类，绝对值即置信度
}

// ---------- 三个案例 ----------
var ROUNDS = 40;
var cases = [
  { key:'easy',    name:'易分数据',   desc:'两类中心分离清楚，类间几乎无重叠。' , seed:'p19-easy'},
  { key:'overlap', name:'重叠数据',   desc:'两类中心靠近，方差增大，分布本身有交叠区域。', seed:'p19-overlap'},
  { key:'noisy',   name:'噪声数据',   desc:'结构与易分数据相同，但 12% 的标签被随机翻转。', seed:'p19-noisy'}
];

cases.forEach(function(c){
  c.data = makeCase(c.key, c.seed);
  c.result = trainAdaBoost(c.data, ROUNDS);
  var correct = 0;
  c.data.forEach(function(d){
    var pred = ensemblePredict(c.result.ensemble, d.x, d.y) >= 0 ? 1 : -1;
    if (pred === d.t) correct++;
  });
  c.trainAcc = correct / c.data.length;
  // 噪声数据的“真实”标签（未翻转前的结构标签）用于估计真实误差
  if (c.key === 'noisy'){
    var trueCorrect = 0;
    var rngTrue = new Math.seedrandom(c.seed);
    // 重新按相同规则生成真实标签序列做对照
    var trueLabels = [];
    for (var i=0;i<c.data.length;i++) trueLabels.push(i%2 ? 1 : -1);
    c.data.forEach(function(d,i){
      var pred = ensemblePredict(c.result.ensemble, d.x, d.y) >= 0 ? 1 : -1;
      if (pred === trueLabels[i]) trueCorrect++;
    });
    c.trueAcc = trueCorrect / c.data.length;
  }
});

// ---------- 渲染 ----------
var COLORS = { pos: '#175D8A', neg: '#C45E12' };
var row = document.getElementById('row');
cases.forEach(function(c, idx){
  var wrap = document.createElement('div');
  wrap.className = 'panel-case';
  wrap.innerHTML =
    '<div class="case-head"><span class="case-name">'+c.name+'</span>' +
    '<span class="case-acc">'+(c.trainAcc*100).toFixed(1)+'<span class="unit">% 训练准确率</span></span></div>' +
    '<p class="case-note">'+c.desc+'</p>' +
    '<div class="cvbox"><canvas id="cv-'+c.key+'"></canvas></div>' +
    '<div class="err-tag"><span>弱学习器：决策树桩 &times; '+ROUNDS+' 轮</span>' +
    '<span>误分类样本 <span class="num">'+Math.round((1-c.trainAcc)*c.data.length)+'</span> / '+c.data.length+'</span></div>';
  row.appendChild(wrap);
});

function drawCase(c){
  var cv = document.getElementById('cv-'+c.key);
  var ctx = Deck.fit(cv);
  var host = cv.parentElement;
  var W = host.clientWidth, H = host.clientHeight;

  var range = 3.6;
  function toPx(x,y){ return [ (x+range)/(2*range)*W, H - (y+range)/(2*range)*H ]; }

  // 决策边界背景
  var res = 70;
  for (var j=0;j<res;j++){
    for (var i=0;i<res;i++){
      var x = -range + (i+0.5)/res*2*range;
      var y = -range + (j+0.5)/res*2*range;
      var s = ensemblePredict(c.result.ensemble, x, y);
      var conf = Math.max(-1, Math.min(1, s/3));
      var col = conf >= 0
        ? 'rgba(23,93,138,'+(0.10+0.22*conf)+')'
        : 'rgba(196,94,18,'+(0.10+0.22*(-conf))+')';
      ctx.fillStyle = col;
      ctx.fillRect(i/res*W, j/res*H, W/res+1, H/res+1);
    }
  }

  // 样本点，环粗代表最终权重
  var w = c.result.finalWeight;
  var maxW = Math.max.apply(null, w), minW = Math.min.apply(null, w);
  c.data.forEach(function(d, i){
    var p = toPx(d.x, d.y);
    var norm = (w[i]-minW)/Math.max(1e-9, maxW-minW);
    var ringW = 1 + norm*4.5;
    var r = 5.5;
    ctx.beginPath();
    ctx.arc(p[0], p[1], r, 0, Math.PI*2);
    ctx.fillStyle = d.t===1 ? COLORS.pos : COLORS.neg;
    ctx.fill();
    ctx.lineWidth = ringW;
    ctx.strokeStyle = 'rgba(23,35,41,0.65)';
    ctx.stroke();
  });
}

cases.forEach(drawCase);
Deck.onResize(function(){ cases.forEach(drawCase); });

var foot = document.getElementById('foot');
var noisy = cases[2];
foot.innerHTML = '易分数据上 40 轮后训练准确率 <b>'+(cases[0].trainAcc*100).toFixed(1)+'%</b>，' +
  '重叠数据受类间交叠限制，准确率降到 <b>'+(cases[1].trainAcc*100).toFixed(1)+'%</b>——' +
  '这是分布本身的极限，不是算法的错。噪声数据训练准确率达到 <b>'+(noisy.trainAcc*100).toFixed(1)+'%</b>，' +
  '高于对真实结构标签的还原率 <b>'+(noisy.trueAcc*100).toFixed(1)+'%</b>：' +
  'AdaBoost 持续增大误分类样本的权重，会把力气花在拟合被翻转的噪声标签上，这正是它对噪声敏感的原因。';
</script>
</body>
</html>
