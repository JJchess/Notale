<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Python 工作流：数据、训练、预测、评估</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{ display:flex; flex-direction:column; gap:16px; }

  .head{ flex:0 0 auto; }

  .body{
    flex:1; min-height:0;
    display:flex; gap:22px;
  }

  /* ---- left: step rail ---- */
  .rail{
    flex:0 0 300px;
    display:flex; flex-direction:column; gap:10px;
    min-height:0;
  }
  .step{
    flex:1;
    display:flex; flex-direction:column; justify-content:center; gap:4px;
    padding:14px 18px;
    border-radius:var(--radius);
    background:var(--surface);
    border:1px solid var(--rule);
    cursor:pointer;
    text-align:left;
    font-family:var(--font-sans);
    transition:background .15s ease, border-color .15s ease;
  }
  .step:hover{ border-color:var(--ensemble); }
  .step[aria-current="true"]{
    background:var(--surface-strong);
    border-color:var(--ensemble);
  }
  .step .idx{
    font-family:var(--font-mono); font-size:var(--fs-tick);
    color:var(--muted); letter-spacing:.02em;
  }
  .step[aria-current="true"] .idx{ color:var(--ensemble); }
  .step .name{
    font-size:var(--fs-h2); font-weight:600; color:var(--text);
    line-height:1.2;
  }
  .step .sub{
    font-size:var(--fs-sec); color:var(--muted); line-height:1.35;
  }

  /* ---- middle: code panel ---- */
  .codepanel{
    flex:1 1 46%; min-width:0;
    display:flex; flex-direction:column;
    background:#1b232b;
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--rule);
  }
  .codepanel .bar{
    flex:0 0 auto;
    padding:9px 16px;
    background:var(--surface-strong);
    border-bottom:1px solid var(--rule);
    font-family:var(--font-mono); font-size:var(--fs-label);
    color:var(--muted);
  }
  .codepanel pre{
    flex:1; min-height:0; margin:0;
    padding:18px 20px;
    overflow:auto;
    font-family:var(--font-mono);
    font-size:16px; line-height:1.7;
    color:#dce6ea;
  }
  .codepanel code .c{ color:#6f8a96; }
  .codepanel code .k{ color:#e79a4e; }
  .codepanel code .s{ color:#8fbf8f; }
  .codepanel code .fn{ color:#7cb0d9; }
  .codepanel code .hl{ background:rgba(23,93,138,.28); display:inline-block; width:100%; }

  /* ---- right: evidence ---- */
  .evidence{
    flex:1 1 34%; min-width:0;
    display:flex; flex-direction:column; gap:12px;
  }
  .evidence .panel{ flex:0 0 auto; }
  .evidence .panel.grow{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .evidence .lbl{
    font-size:var(--fs-label); color:var(--muted); margin-bottom:8px;
  }
  .rows{ display:flex; flex-direction:column; gap:7px; font-family:var(--font-mono); font-size:15px; }
  .rows .r{ display:flex; justify-content:space-between; color:var(--text); }
  .rows .r span:first-child{ color:var(--muted); font-family:var(--font-sans); font-size:var(--fs-label); }
  .chart{ flex:1; min-height:0; position:relative; }
  .chart canvas{ position:absolute; inset:0; width:100%; height:100%; }
</style>
</head>
<body data-page="22" data-total="26">
<div id="stage">

  <div class="head">
    <div class="kicker">Python 实践</div>
    <h1 style="font-size:var(--fs-h1); font-weight:700; color:var(--text); margin:6px 0 4px;">
      四个环节衔接成一条流水线：数据、训练、预测、评估
    </h1>
    <p class="lead" style="font-size:var(--fs-lead); color:var(--muted); max-width:1200px;">
      sklearn 里 <code style="font-family:var(--font-mono);color:var(--text);">AdaBoostClassifier</code> 的接口和其他分类器一致，
      但训练内部每一轮都在重新加权样本——右侧证据用同一批数据当场算出，随你点选的环节联动变化。
    </p>
  </div>

  <div class="body">

    <div class="rail" role="tablist" aria-label="四个工作流环节">
      <button class="step" data-step="0" role="tab" aria-current="true">
        <span class="idx">STEP 1</span>
        <span class="name">准备数据</span>
        <span class="sub">拆分训练集与测试集，检查类别是否均衡</span>
      </button>
      <button class="step" data-step="1" role="tab">
        <span class="idx">STEP 2</span>
        <span class="name">训练模型</span>
        <span class="sub">拟合 AdaBoostClassifier，逐轮生成弱学习器</span>
      </button>
      <button class="step" data-step="2" role="tab">
        <span class="idx">STEP 3</span>
        <span class="name">生成预测</span>
        <span class="sub">对测试集做类别预测与概率估计</span>
      </button>
      <button class="step" data-step="3" role="tab">
        <span class="idx">STEP 4</span>
        <span class="name">评估效果</span>
        <span class="sub">看准确率随轮次的变化，判断是否过拟合</span>
      </button>
    </div>

    <div class="codepanel">
      <div class="bar" id="codeBar">data_prep.py</div>
      <pre><code id="codeBody"></code></pre>
    </div>

    <div class="evidence">
      <div class="panel">
        <div class="lbl" id="evTitle">当前数据集</div>
        <div class="rows" id="evRows"></div>
      </div>
      <div class="panel grow">
        <div class="lbl" id="chartTitle">训练集样本分布（40 个点，2 个特征）</div>
        <div class="chart"><canvas id="cv" class="cv-fill"></canvas></div>
      </div>
    </div>

  </div>

</div>

<script src="assets/base.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------- 1. 生成可复现的教学数据集（当场计算，不预录结果） ----------
  var rng = new Math.seedrandom('page-22-adaboost');
  var N_TOTAL = 40, N_TRAIN = 30, N_TEST = 10;
  var pts = [];
  // 两个重叠的高斯团 + 少量噪声点，制造一个"不是线性可分但可学"的问题
  function gauss(){ var u=rng(), v=rng(); return Math.sqrt(-2*Math.log(u+1e-9))*Math.cos(2*Math.PI*v); }
  for(var i=0;i<N_TOTAL/2;i++){
    pts.push({ x: -1.1 + gauss()*0.55, y: -0.6 + gauss()*0.55, t: -1 });
  }
  for(var i=0;i<N_TOTAL/2;i++){
    pts.push({ x: 1.0 + gauss()*0.55, y: 0.6 + gauss()*0.55, t: 1 });
  }
  // 打乱后拆分（模拟 train_test_split 的效果，固定种子保证可复现）
  for(var i=pts.length-1;i>0;i--){
    var j = Math.floor(rng()*(i+1));
    var tmp=pts[i]; pts[i]=pts[j]; pts[j]=tmp;
  }
  var train = pts.slice(0, N_TRAIN);
  var test  = pts.slice(N_TRAIN, N_TRAIN+N_TEST);

  // ---------- 2. 手写一个决策树桩 + AdaBoost（真实训练，非展示假数字） ----------
  function trainStump(data, w){
    // 遍历 x / y 两个特征、若干阈值，选加权误差最小的轴对齐分裂
    var best = null;
    ['x','y'].forEach(function(axis){
      var vals = data.map(function(d){ return d[axis]; }).sort(function(a,b){return a-b;});
      for(var k=0;k<vals.length-1;k++){
        var thresh = (vals[k]+vals[k+1])/2;
        [1,-1].forEach(function(sign){
          var err = 0;
          for(var i=0;i<data.length;i++){
            var pred = (data[i][axis] <= thresh ? 1 : -1) * sign;
            if(pred !== data[i].t) err += w[i];
          }
          if(!best || err < best.err){ best = { axis:axis, thresh:thresh, sign:sign, err:err }; }
        });
      }
    });
    return best;
  }
  function stumpPredict(stump, d){
    return (d[stump.axis] <= stump.thresh ? 1 : -1) * stump.sign;
  }

  var N_ROUNDS = 6;
  var weights = train.map(function(){ return 1/train.length; });
  var ensemble = []; // {stump, alpha}
  var roundLog = [];

  for(var r=0;r<N_ROUNDS;r++){
    var stump = trainStump(train, weights);
    var err = Math.min(Math.max(stump.err, 1e-6), 1-1e-6);
    var alpha = 0.5 * Math.log((1-err)/err);
    // 更新权重
    var newW = train.map(function(d,i){
      var pred = stumpPredict(stump, d);
      return weights[i] * Math.exp(-alpha * pred * d.t);
    });
    var sum = newW.reduce(function(a,b){return a+b;},0);
    newW = newW.map(function(v){ return v/sum; });
    ensemble.push({ stump:stump, alpha:alpha });
    roundLog.push({ round:r+1, err:err, alpha:alpha });
    weights = newW;
  }

  function ensembleScore(subset, upTo){
    var correct = 0;
    subset.forEach(function(d){
      var s = 0;
      for(var k=0;k<upTo;k++){ s += ensemble[k].alpha * stumpPredict(ensemble[k].stump, d); }
      var pred = s >= 0 ? 1 : -1;
      if(pred === d.t) correct++;
    });
    return correct/subset.length;
  }
  var stagedTrainAcc = [], stagedTestAcc = [];
  for(var k=1;k<=N_ROUNDS;k++){
    stagedTrainAcc.push(ensembleScore(train, k));
    stagedTestAcc.push(ensembleScore(test, k));
  }
  var finalTrainAcc = stagedTrainAcc[N_ROUNDS-1];
  var finalTestAcc  = stagedTestAcc[N_ROUNDS-1];

  // ---------- 3. 代码文本（每个环节对应一段真实可运行的 sklearn 代码） ----------
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function hl(code){
    code = esc(code);
    code = code.replace(/#.*$/gm, function(m){ return '<span class="c">'+m+'</span>'; });
    code = code.replace(/(['"])(.*?)\1/g, function(m){ return '<span class="s">'+m+'</span>'; });
    code = code.replace(/\b(from|import|def|return|for|in|if|else)\b/g, '<span class="k">$1</span>');
    code = code.replace(/\b([a-z_]+)(\()/g, function(m,name,p){ return '<span class="fn">'+name+'</span>'+p; });
    return code;
  }

  var STEPS = [
    {
      file: 'data_prep.py',
      code:
"from sklearn.model_selection import train_test_split\n\n" +
"# X: (40, 2) 两个特征；y: 取值 -1 / 1\n" +
"X_train, X_test, y_train, y_test = train_test_split(\n" +
"    X, y, test_size=10, random_state=0)\n\n" +
"print(X_train.shape, X_test.shape)\n" +
"# -> (30, 2) (10, 2)",
      evTitle: '拆分结果（本页固定种子生成）',
      rows: [
        ['总样本数', N_TOTAL + ' 个'],
        ['训练集', N_TRAIN + ' 个'],
        ['测试集', N_TEST + ' 个'],
        ['两类占比', '各 50%']
      ],
      chartTitle: '训练集样本分布（30 个点，2 个特征）',
      chartMode: 'train'
    },
    {
      file: 'train.py',
      code:
"from sklearn.tree import DecisionTreeClassifier\n" +
"from sklearn.ensemble import AdaBoostClassifier\n\n" +
"base = DecisionTreeClassifier(max_depth=1)  # 决策树桩\n" +
"clf = AdaBoostClassifier(\n" +
"    estimator=base, n_estimators=6,\n" +
"    algorithm='SAMME', random_state=0)\n\n" +
"clf.fit(X_train, y_train)\n" +
"# 每一轮：训练一个树桩 -> 算加权误差\n" +
"# -> 算该轮模型权重 alpha -> 更新样本权重",
      evTitle: '本页当场训练出的 ' + N_ROUNDS + ' 轮结果',
      rows: roundLog.map(function(r){
        return ['第 ' + r.round + ' 轮误差 / 权重', r.err.toFixed(3) + ' / α=' + r.alpha.toFixed(2)];
      }),
      chartTitle: '各轮弱学习器的加权误差与模型权重',
      chartMode: 'rounds'
    },
    {
      file: 'predict.py',
      code:
"y_pred = clf.predict(X_test)\n" +
"proba  = clf.predict_proba(X_test)\n\n" +
"# y_pred: 长度 10 的数组，取值 -1 / 1\n" +
"# proba:  形状 (10, 2)，每行两个类的概率\n" +
"print(y_pred[:5])\n" +
"print(proba[:5].round(2))",
      evTitle: '测试集前 5 个样本的预测',
      rows: test.slice(0,5).map(function(d,i){
        var s = 0;
        ensemble.forEach(function(e){ s += e.alpha * stumpPredict(e.stump, d); });
        var pred = s>=0?1:-1;
        var proba = 1/(1+Math.exp(-2*s));
        return ['样本 ' + (i+1) + '（真实 ' + (d.t>0?'+1':'-1') + '）', '预测 ' + (pred>0?'+1':'-1') + ' · p=' + proba.toFixed(2)];
      }),
      chartTitle: '测试集：真实类别 vs 预测类别',
      chartMode: 'predict'
    },
    {
      file: 'evaluate.py',
      code:
"from sklearn.metrics import accuracy_score\n\n" +
"acc = accuracy_score(y_test, y_pred)\n\n" +
"# staged_score 逐轮给出中间集成的准确率\n" +
"# 用它判断轮数是否已经足够、是否过拟合\n" +
"for k, s in enumerate(clf.staged_score(X_test, y_test), 1):\n" +
"    print(k, round(s, 3))",
      evTitle: '训练集 / 测试集准确率（本页真实计算）',
      rows: [
        ['训练集准确率（' + N_ROUNDS + ' 轮后）', (finalTrainAcc*100).toFixed(1) + '%'],
        ['测试集准确率（' + N_ROUNDS + ' 轮后）', (finalTestAcc*100).toFixed(1) + '%'],
        ['差距', (Math.abs(finalTrainAcc-finalTestAcc)*100).toFixed(1) + ' 个百分点']
      ],
      chartTitle: '逐轮 staged_score：训练集与测试集准确率',
      chartMode: 'staged'
    }
  ];

  // ---------- 4. 渲染：代码 + 数值行 ----------
  var codeBar = document.getElementById('codeBar');
  var codeBody = document.getElementById('codeBody');
  var evTitle = document.getElementById('evTitle');
  var evRows = document.getElementById('evRows');
  var chartTitle = document.getElementById('chartTitle');
  var stepButtons = [].slice.call(document.querySelectorAll('.step'));

  function renderRows(rows){
    evRows.innerHTML = rows.map(function(r){
      return '<div class="r"><span>'+r[0]+'</span><span class="num">'+r[1]+'</span></div>';
    }).join('');
  }

  function setStep(i){
    var s = STEPS[i];
    codeBar.textContent = s.file;
    codeBody.innerHTML = hl(s.code);
    evTitle.textContent = s.evTitle;
    renderRows(s.rows);
    chartTitle.textContent = s.chartTitle;
    stepButtons.forEach(function(btn, idx){
      btn.setAttribute('aria-current', idx===i ? 'true' : 'false');
    });
    drawChart(s.chartMode);
  }

  stepButtons.forEach(function(btn, idx){
    btn.addEventListener('click', function(){ setStep(idx); });
  });

  // ---------- 5. 画布：四种证据视图共用一套坐标 ----------
  var cv = document.getElementById('cv');
  var colorEnsemble, colorWeak, colorWeight, colorMuted, colorText, colorRule;

  function refreshColors(){
    colorEnsemble = Deck.rgb('ensemble');
    colorWeak = Deck.rgb('weak');
    colorWeight = Deck.rgb('weight');
    colorMuted = Deck.rgb('muted');
    colorText = Deck.rgb('text');
    colorRule = Deck.rgb('rule');
  }

  function toRgba(c, a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }

  var DATA_X0=-3, DATA_X1=3, DATA_Y0=-2.2, DATA_Y1=2.2;
  function dataToPx(ctx, d){
    var w = ctx.canvas.logicalW, h = ctx.canvas.logicalH;
    var pad = 26;
    var px = pad + (d.x - DATA_X0)/(DATA_X1-DATA_X0) * (w-2*pad);
    var py = h - pad - (d.y - DATA_Y0)/(DATA_Y1-DATA_Y0) * (h-2*pad);
    return [px, py];
  }

  function drawScatter(ctx, points, opts){
    points.forEach(function(d){
      var p = dataToPx(ctx, d);
      ctx.beginPath();
      ctx.arc(p[0], p[1], opts.r ? opts.r(d) : 6, 0, Math.PI*2);
      ctx.fillStyle = d.t>0 ? toRgba(colorEnsemble, opts.a||0.9) : toRgba(colorWeak, opts.a||0.9);
      ctx.fill();
      if(opts.ring && opts.ring(d)){
        ctx.beginPath();
        ctx.arc(p[0], p[1], (opts.r?opts.r(d):6)+4, 0, Math.PI*2);
        ctx.lineWidth = 2;
        ctx.strokeStyle = toRgba(colorWeight, 0.9);
        ctx.stroke();
      }
    });
  }

  function drawAxes(ctx){
    var w = ctx.canvas.logicalW, h = ctx.canvas.logicalH;
    ctx.strokeStyle = toRgba(colorRule, 0.5);
    ctx.lineWidth = 1;
    ctx.beginPath();
    var zero = dataToPx(ctx, {x:0,y:0});
    ctx.moveTo(26, zero[1]); ctx.lineTo(w-26, zero[1]);
    ctx.moveTo(zero[0], 26); ctx.lineTo(zero[0], h-26);
    ctx.stroke();
  }

  function drawChart(mode){
    Deck.autofit(cv, function(ctx){
      ctx.canvas.logicalW = Deck.W ? (cv.parentElement.clientWidth) : 600;
      ctx.canvas.logicalH = cv.parentElement.clientHeight;
      var w = ctx.canvas.logicalW, h = ctx.canvas.logicalH;
      ctx.clearRect(0,0,w,h);

      if(mode==='train'){
        drawAxes(ctx);
        drawScatter(ctx, train, { r:function(){return 6;} });
      } else if(mode==='rounds'){
        // 折线：误差 与 alpha 随轮次
        var pad = {l:40,r:16,t:16,b:30};
        var iw = w-pad.l-pad.r, ih = h-pad.t-pad.b;
        var maxAlpha = Math.max.apply(null, roundLog.map(function(r){return r.alpha;}));
        function xAt(i){ return pad.l + i/(N_ROUNDS-1)*iw; }
        function yErr(v){ return pad.t + (1 - v/0.5)*ih; }
        function yAlpha(v){ return pad.t + (1 - v/(maxAlpha*1.15))*ih; }
        ctx.strokeStyle = toRgba(colorRule,0.4); ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(pad.l,pad.t); ctx.lineTo(pad.l,h-pad.b); ctx.lineTo(w-pad.r,h-pad.b); ctx.stroke();
        // 误差线
        ctx.beginPath();
        roundLog.forEach(function(r,i){ var x=xAt(i), y=yErr(r.err); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
        ctx.strokeStyle = toRgba(colorWeak,0.95); ctx.lineWidth=2.5; ctx.stroke();
        // alpha 线
        ctx.beginPath();
        roundLog.forEach(function(r,i){ var x=xAt(i), y=yAlpha(r.alpha); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
        ctx.strokeStyle = toRgba(colorEnsemble,0.95); ctx.lineWidth=2.5; ctx.stroke();
        roundLog.forEach(function(r,i){
          var x=xAt(i);
          ctx.beginPath(); ctx.arc(x,yErr(r.err),4,0,Math.PI*2); ctx.fillStyle=toRgba(colorWeak,1); ctx.fill();
          ctx.beginPath(); ctx.arc(x,yAlpha(r.alpha),4,0,Math.PI*2); ctx.fillStyle=toRgba(colorEnsemble,1); ctx.fill();
        });
        ctx.font = '13px ' + getComputedStyle(document.body).fontFamily;
        ctx.fillStyle = toRgba(colorMuted,1); ctx.textAlign='center';
        roundLog.forEach(function(r,i){ ctx.fillText('R'+r.round, xAt(i), h-pad.b+16); });
        ctx.textAlign='left';
        ctx.fillStyle = toRgba(colorWeak,1); ctx.fillText('误差', pad.l, 14);
        ctx.fillStyle = toRgba(colorEnsemble,1); ctx.fillText('模型权重 α', pad.l+60, 14);
      } else if(mode==='predict'){
        drawAxes(ctx);
        test.forEach(function(d){
          var s=0;
          ensemble.forEach(function(e){ s += e.alpha*stumpPredict(e.stump,d); });
          var pred = s>=0?1:-1;
          var p = dataToPx(ctx,d);
          ctx.beginPath(); ctx.arc(p[0],p[1],7,0,Math.PI*2);
          ctx.fillStyle = d.t>0?toRgba(colorEnsemble,0.9):toRgba(colorWeak,0.9);
          ctx.fill();
          if(pred!==d.t){
            ctx.beginPath(); ctx.arc(p[0],p[1],11,0,Math.PI*2);
            ctx.lineWidth=2.5; ctx.strokeStyle=toRgba(colorWeight,1); ctx.stroke();
          }
        });
        ctx.font='13px '+getComputedStyle(document.body).fontFamily;
        ctx.fillStyle=toRgba(colorWeight,1); ctx.textAlign='left';
        ctx.fillText('橙色外圈＝预测错误', 26, 20);
      } else if(mode==='staged'){
        var pad = {l:40,r:16,t:16,b:30};
        var iw = w-pad.l-pad.r, ih = h-pad.t-pad.b;
        function xAt(i){ return pad.l + i/(N_ROUNDS-1)*iw; }
        function yAt(v){ return pad.t + (1-v)*ih; }
        ctx.strokeStyle = toRgba(colorRule,0.4); ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(pad.l,pad.t); ctx.lineTo(pad.l,h-pad.b); ctx.lineTo(w-pad.r,h-pad.b); ctx.stroke();
        [0.5,0.75,1].forEach(function(v){
          ctx.beginPath(); ctx.moveTo(pad.l,yAt(v)); ctx.lineTo(w-pad.r,yAt(v));
          ctx.strokeStyle=toRgba(colorRule,0.25); ctx.stroke();
          ctx.fillStyle=toRgba(colorMuted,1); ctx.font='12px '+getComputedStyle(document.body).fontFamily;
          ctx.textAlign='right'; ctx.fillText((v*100).toFixed(0)+'%', pad.l-6, yAt(v)+4);
        });
        function plot(arr,color){
          ctx.beginPath();
          arr.forEach(function(v,i){ var x=xAt(i), y=yAt(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
          ctx.strokeStyle=toRgba(color,0.95); ctx.lineWidth=2.5; ctx.stroke();
          arr.forEach(function(v,i){
            ctx.beginPath(); ctx.arc(xAt(i),yAt(v),4,0,Math.PI*2); ctx.fillStyle=toRgba(color,1); ctx.fill();
          });
        }
        plot(stagedTrainAcc, colorEnsemble);
        plot(stagedTestAcc, colorWeak);
        ctx.textAlign='center'; ctx.fillStyle=toRgba(colorMuted,1);
        stagedTrainAcc.forEach(function(v,i){ ctx.fillText('R'+(i+1), xAt(i), h-pad.b+16); });
        ctx.textAlign='left';
        ctx.fillStyle=toRgba(colorEnsemble,1); ctx.fillText('训练集', pad.l, 14);
        ctx.fillStyle=toRgba(colorWeak,1); ctx.fillText('测试集', pad.l+56, 14);
      }
    });
  }

  refreshColors();
  Deck.onResize(function(){ refreshColors(); drawChart(STEPS[currentIdx].chartMode); });
  var currentIdx = 0;
  setStep(0);

})();
</script>
