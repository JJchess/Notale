<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>AdaBoosting 算法</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root{
    --bg:#EEF1F5;
    --text:#111820;
    --font-sans:"Noto Sans CJK SC",ui-sans-serif,system-ui,sans-serif;
  }
  #stage{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    overflow:hidden;
  }
  #field{
    position:absolute;
    inset:0;
  }
  .copy{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    padding:36px 64px;
    text-align:center;
  }
  .copy h1{
    margin:0;
    font-family:var(--font-display,"Clear Sans","Noto Sans CJK SC",ui-sans-serif,sans-serif);
    font-size:64px;
    font-weight:700;
    letter-spacing:.5px;
    color:var(--text);
  }
  .copy .lead{
    margin:0;
    font-size:var(--fs-lead,22px);
    color:var(--muted,#657181);
    max-width:760px;
    line-height:1.5;
  }
  .eq{
    margin-top:6px;
    font-family:var(--font-mono,"JetBrains Mono",ui-monospace,monospace);
    font-size:20px;
    color:var(--weight,#164E9B);
    letter-spacing:.3px;
  }
  .eq .op{ color:var(--muted,#657181); margin:0 6px; }
</style>
</head>
<body data-page="01" data-total="8">
<div id="stage">
  <canvas id="field" class="cv-fill" aria-hidden="true"></canvas>
  <div class="copy">
    <h1>AdaBoosting 算法</h1>
    <p class="lead">多个"仅比随机猜测略好"的弱分类器，按误差被重新加权、依次训练，再加权投票，逐轮收敛成一个强分类器。</p>
    <p class="eq">H(x) = sign<span class="op">(</span>&alpha;&#8321;h&#8321;(x) + &alpha;&#8322;h&#8322;(x) + &hellip; + &alpha;&#8339;h&#8339;(x)<span class="op">)</span></p>
  </div>
</div>
<script src="assets/base.js"></script>
<script>
(function(){
  'use strict';

  var CONFIG = Object.freeze({
    seed: 7031,
    n: 46,                 // 样本点数
    rounds: 5,             // 弱分类器轮数
    roundDuration: 1400,   // 每轮动画时长 ms
    holdAfter: 1400,       // 最终结果停留 ms
    titleZone: Object.freeze({x: 430, y: 330, w: 740, h: 300})
  });

  function rngFrom(seed){
    var state = (seed >>> 0) || 1;
    return function(){
      state += 0x6D2B79F5;
      var t = state;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('field');
  var W = 1600, H = 900;

  // ---- 确定性生成：样本点 + 弱分类器序列（真实 AdaBoost 式重加权） ----
  function buildModel(){
    var rng = rngFrom(CONFIG.seed);
    var pts = [];
    var i;
    for(i=0;i<CONFIG.n;i++){
      var x = 90 + rng()*1420;
      var y = 90 + rng()*720;
      if(x>CONFIG.titleZone.x-40 && x<CONFIG.titleZone.x+CONFIG.titleZone.w+40 &&
         y>CONFIG.titleZone.y-40 && y<CONFIG.titleZone.y+CONFIG.titleZone.h+40){
        // 标题区内的点整体推到外圈，保持数量确定
        var ang = rng()*Math.PI*2;
        var r = 360+rng()*140;
        x = 800+Math.cos(ang)*r;
        y = 450+Math.sin(ang)*r*0.62;
        x = Math.max(70,Math.min(1530,x));
        y = Math.max(70,Math.min(830,y));
      }
      // 真实标签：由一个隐藏的曲线边界决定（非线性，弱分类器无法一次学对）
      var boundary = 450 + 160*Math.sin(x*0.0032) + 70*Math.cos(x*0.0071+1.3);
      var label = y < boundary ? 1 : -1;
      pts.push({x:x, y:y, label:label, w:1/CONFIG.n});
    }

    // 弱分类器：随机方向的分割线（垂直或水平阈值），贪心选出降低加权误差最多的
    function candidateStumps(){
      var stumps = [];
      var k;
      for(k=0;k<14;k++){
        var vertical = rng()<0.5;
        var pos = vertical ? (150+rng()*1300) : (130+rng()*650);
        var sign = rng()<0.5 ? 1 : -1;
        stumps.push({vertical:vertical, pos:pos, sign:sign});
      }
      return stumps;
    }

    function weightedError(stump, points){
      var err = 0, tot = 0;
      for(var j=0;j<points.length;j++){
        var p = points[j];
        var side = stump.vertical ? (p.x<stump.pos?1:-1) : (p.y<stump.pos?1:-1);
        var pred = side*stump.sign;
        tot += p.w;
        if(pred!==p.label) err += p.w;
      }
      return err/tot;
    }

    var rounds = [];
    var alphaSum = 0;
    for(var r=0;r<CONFIG.rounds;r++){
      var stumps = candidateStumps();
      var best=null, bestErr=1;
      for(var s=0;s<stumps.length;s++){
        var e = weightedError(stumps[s], pts);
        var e2 = e>0.5 ? 1-e : e; // 允许反向翻转
        if(e2<bestErr){ bestErr=e2; best=stumps[s]; if(e>0.5) best={vertical:stumps[s].vertical,pos:stumps[s].pos,sign:-stumps[s].sign}; }
      }
      bestErr = Math.max(0.02, Math.min(0.48, bestErr));
      var alpha = 0.5*Math.log((1-bestErr)/bestErr);
      alphaSum += alpha;

      // 记录本轮分类前的权重快照（用于动画），再更新权重
      var snapshot = pts.map(function(p){ return {x:p.x,y:p.y,label:p.label,w:p.w}; });
      var Z = 0;
      for(var j=0;j<pts.length;j++){
        var p = pts[j];
        var side = best.vertical ? (p.x<best.pos?1:-1) : (p.y<best.pos?1:-1);
        var pred = side*best.sign;
        var correct = pred===p.label;
        p.w = p.w*Math.exp(correct? -alpha : alpha);
        Z += p.w;
      }
      for(var j2=0;j2<pts.length;j2++) pts[j2].w /= Z;

      rounds.push({
        stump: best,
        alpha: alpha,
        err: bestErr,
        before: snapshot,
        after: pts.map(function(p){ return {w:p.w}; })
      });
    }

    return { points: pts, rounds: rounds, alphaSum: alphaSum };
  }

  var model = buildModel();

  function color(name, a){ return Deck.rgba(name, a); }

  function drawAxesHint(ctx){
    ctx.save();
    ctx.strokeStyle = color('line', 0.5);
    ctx.lineWidth = 1;
    ctx.setLineDash([2,6]);
    ctx.beginPath();
    ctx.moveTo(40, 450); ctx.lineTo(1560, 450);
    ctx.stroke();
    ctx.restore();
  }

  function pointRadius(w, maxW){
    var t = Math.min(1, w/maxW);
    return 4 + t*9;
  }

  function drawRoundStump(ctx, stump, alpha){
    ctx.save();
    ctx.strokeStyle = color('weak', 0.85);
    ctx.lineWidth = 2.5;
    ctx.setLineDash([]);
    if(stump.vertical){
      ctx.beginPath(); ctx.moveTo(stump.pos, 60); ctx.lineTo(stump.pos, 840); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(60, stump.pos); ctx.lineTo(1540, stump.pos); ctx.stroke();
    }
    ctx.restore();
  }

  function drawPoints(ctx, points, maxW, highlightErrors, stump){
    for(var i=0;i<points.length;i++){
      var p = points[i];
      var r = pointRadius(p.w, maxW);
      var isError = false;
      if(stump){
        var side = stump.vertical ? (p.x<stump.pos?1:-1) : (p.y<stump.pos?1:-1);
        var pred = side*stump.sign;
        isError = pred!==p.label;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI*2);
      if(highlightErrors && isError){
        ctx.fillStyle = color('error', 0.88);
      } else if(p.label===1){
        ctx.fillStyle = color('correct', 0.8);
      } else {
        ctx.fillStyle = color('weight', 0.55);
      }
      ctx.fill();
      if(p.label===-1){
        ctx.save();
        ctx.strokeStyle = color('text', 0.5);
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  function drawFinalBoundary(ctx, rounds){
    // 用累积加权投票画出最终边界：对每个 x 采样，求 sign(sum alpha*h(x,y))
    ctx.save();
    ctx.strokeStyle = color('weight', 0.95);
    ctx.lineWidth = 3.4;
    ctx.beginPath();
    var first = true;
    for(var x=70; x<=1530; x+=6){
      // 二分找该 x 下votes变号的 y
      var lo=60, hi=840;
      function voteAt(xx,yy){
        var sum=0;
        for(var r=0;r<rounds.length;r++){
          var st = rounds[r].stump;
          var side = st.vertical ? (xx<st.pos?1:-1) : (yy<st.pos?1:-1);
          sum += rounds[r].alpha*side*st.sign;
        }
        return sum;
      }
      var vLo = voteAt(x,lo), vHi = voteAt(x,hi);
      if(vLo*vHi>0){ continue; }
      for(var iter=0; iter<22; iter++){
        var mid=(lo+hi)/2;
        var vMid=voteAt(x,mid);
        if(vMid*vLo>0){ lo=mid; vLo=vMid; } else { hi=mid; }
      }
      var y=(lo+hi)/2;
      if(first){ ctx.moveTo(x,y); first=false; } else { ctx.lineTo(x,y); }
    }
    ctx.stroke();
    ctx.restore();
  }

  // ---- 时间轴编排 ----
  var totalRounds = CONFIG.rounds;
  var perRound = CONFIG.roundDuration;
  var totalMain = perRound*totalRounds;
  var holdAfter = CONFIG.holdAfter;
  var cycleLen = totalMain + holdAfter;
  var STILL = totalMain + holdAfter*0.5;

  function maxWeightIn(points){
    var m=0;
    for(var i=0;i<points.length;i++) if(points[i].w>m) m=points[i].w;
    return m;
  }

  function draw(ctx, w, h, time){
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = Deck.token('--bg');
    ctx.fillRect(0,0,w,h);
    drawAxesHint(ctx);

    var t = ((time % cycleLen) + cycleLen) % cycleLen;
    var roundIdx = Math.min(totalRounds-1, Math.floor(t/perRound));
    var roundT = (t - roundIdx*perRound)/perRound; // 0..1 within round

    if(t >= totalMain){
      // 收尾阶段：展示最终加权边界与当前点权重（全部轮次已应用）
      var lastPts = model.points;
      var maxW = maxWeightIn(lastPts);
      drawPoints(ctx, lastPts, maxW, false, null);
      for(var r=0;r<model.rounds.length;r++){
        ctx.save();
        ctx.globalAlpha = 0.22;
        drawRoundStump(ctx, model.rounds[r].stump, model.rounds[r].alpha);
        ctx.restore();
      }
      drawFinalBoundary(ctx, model.rounds);
      return;
    }

    var round = model.rounds[roundIdx];
    // phase 1 (0-0.45): 展示当轮弱分类器 + 标出误分点（用轮前权重）
    // phase 2 (0.45-1): 权重向误分点转移的过渡动画
    var phase = roundT < 0.45 ? 0 : 1;
    var localT = phase===0 ? roundT/0.45 : (roundT-0.45)/0.55;

    var beforePts = round.before;
    var maxWBefore = maxWeightIn(beforePts.map(function(p){return {w:p.w};}));

    if(phase===0){
      // 淡入该轮分类线并标出误分点
      ctx.save();
      ctx.globalAlpha = Math.min(1, localT*2);
      drawRoundStump(ctx, round.stump, round.alpha);
      ctx.restore();
      drawPoints(ctx, beforePts, maxWBefore, localT>0.3, round.stump);
    } else {
      // 权重插值：从 before.w 到 after.w
      var interp = beforePts.map(function(p,i){
        var aw = round.after[i].w;
        var w = Deck.lerp(p.w, aw, localT);
        return {x:p.x, y:p.y, label:p.label, w:w};
      });
      var maxWMix = maxWeightIn(interp);
      ctx.save();
      ctx.globalAlpha = 0.55;
      drawRoundStump(ctx, round.stump, round.alpha);
      ctx.restore();
      drawPoints(ctx, interp, maxWMix, localT<0.7, round.stump);

      // 已完成的过往轮次分类线，弱化显示
      for(var pr=0; pr<roundIdx; pr++){
        ctx.save();
        ctx.globalAlpha = 0.14;
        drawRoundStump(ctx, model.rounds[pr].stump, model.rounds[pr].alpha);
        ctx.restore();
      }
    }
  }

  var currentCtx = null;
  var autofitHandle = Deck.autofit(canvas, function(ctx){
    currentCtx = ctx;
    draw(ctx, W, H, Deck.reduced() ? STILL : (window.__adaTime||STILL));
  });

  if(!Deck.reduced()){
    Deck.loop(function(t){
      window.__adaTime = t;
      if(currentCtx) draw(currentCtx, W, H, t);
    }, {still: STILL});
  } else if(currentCtx){
    draw(currentCtx, W, H, STILL);
  }

  Deck.init({ index:1, total:8, keys:false });
})();
</script>
</body>
</html>
