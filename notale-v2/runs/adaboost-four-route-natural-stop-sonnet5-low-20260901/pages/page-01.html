<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdaBoost 算法</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root{
    --bg: #EEF1F5;
    --text: #111820;
    --font-sans: "Noto Sans CJK SC", ui-sans-serif, system-ui, sans-serif;
  }
  #stage{
    position: relative;
    background: var(--bg);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #field{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .cover-copy{
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    pointer-events: none;
    text-align: center;
  }
  .cover-copy h1{
    margin: 0;
    font-family: "Clear Sans","Noto Sans CJK SC",ui-sans-serif,sans-serif;
    font-weight: 700;
    font-size: 96px;
    letter-spacing: 2px;
    color: var(--text);
    line-height: 1.05;
  }
  .cover-copy h1 .accent{
    color: var(--weight);
  }
  .cover-copy .subtitle{
    margin: 0;
    font-size: var(--fs-lead);
    color: var(--muted);
    font-family: var(--font-sans);
    letter-spacing: 1px;
  }
  .sr-only{
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
  }
</style>
</head>
<body data-page="01" data-total="16">
  <div id="stage">
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="cover-copy" aria-label="封面标题">
      <h1>Ada<span class="accent">Boost</span> 算法</h1>
      <p class="subtitle">许多个仅略强于随机猜测的弱分类器，按各自准确度加权叠加成一个强分类器</p>
    </div>
    <span id="live-status" class="sr-only" aria-live="polite"></span>
  </div>

  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
  (function () {
    'use strict';

    var W = 1600, H = 900;
    var REPRESENTATIVE_MS = 4600;

    // ---- 概念规则 ----
    // AdaBoost: 每个弱分类器只是一条略优于随机猜测的分割线（错误率略低于0.5）。
    // 把很多这样的弱分类器按权重 alpha = 0.5*ln((1-err)/err) 加权求和取符号，
    // 就得到一条判别力强得多的组合边界。可视化把这个求和过程画出来：
    // 大量浅淡的弱分割线 + 由它们符号加权累加而成的一条清晰强边界轮廓。

    var CONFIG = Object.freeze({
      seed: 'adaboost-cover-01',
      nPoints: 170,
      nWeak: 46,
      quiet: Object.freeze({ cx: 470, cy: 430, rx: 440, ry: 260 })
    });

    var canvas = document.getElementById('field');
    var liveStatus = document.getElementById('live-status');
    var media = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    var staticLayer = document.createElement('canvas');
    var ctx = null;
    var model = null;
    var stopLoop = function(){};
    var offResize = function(){};
    var lastTime = REPRESENTATIVE_MS;
    var cleaned = false;
    var resizeQueued = 0;
    var palette = {};

    Deck.init({ index: 0, total: 16, keys: false });

    function readPalette() {
      palette.bg = Deck.rgb('bg');
      palette.weak = Deck.rgb('weak');
      palette.correct = Deck.rgb('correct');
      palette.weight = Deck.rgb('weight');
      palette.error = Deck.rgb('error');
      palette.line = Deck.rgb('line');
    }

    function rgba(rgb, a) { return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')'; }

    function quietDistance(x, y) {
      var q = CONFIG.quiet;
      return Math.sqrt(Math.pow((x - q.cx) / q.rx, 2) + Math.pow((y - q.cy) / q.ry, 2));
    }

    // 真实的目标概念：一条横贯全图的弯曲边界，把平面分成两类
    function trueLabel(x, y) {
      var nx = (x - 800) / 800;
      var ny = (y - 450) / 380;
      var boundary = 0.5 * Math.sin(nx * 2.6) + 0.16 * nx;
      return (ny - boundary) > 0 ? 1 : -1;
    }

    function buildModel() {
      var rng = new Math.seedrandom(CONFIG.seed + '/points');
      var points = [];
      for (var i = 0; i < CONFIG.nPoints; i += 1) {
        var x = 60 + rng() * 1480;
        var y = 70 + rng() * 760;
        if (quietDistance(x, y) < 1.0) continue;
        points.push({ x: x, y: y, label: trueLabel(x, y), weight: 1 });
      }

      // 依次生成弱分类器：每次基于当前样本权重挑一条最能纠偏的随机线
      // （角度、截距随机，只保留错误率 < 0.5 的“弱”分类器），
      // 并按 AdaBoost 公式更新权重与 alpha。
      var stumpRng = new Math.seedrandom(CONFIG.seed + '/stumps');
      var weakClassifiers = [];
      var n = points.length;
      for (var t = 0; t < CONFIG.nWeak; t += 1) {
        var best = null;
        for (var trial = 0; trial < 10; trial += 1) {
          var angle = stumpRng() * Math.PI;
          var nx = Math.cos(angle), ny = Math.sin(angle);
          var cx = 60 + stumpRng() * 1480;
          var cy = 70 + stumpRng() * 760;
          var offset = nx * cx + ny * cy;
          var sign = stumpRng() < 0.5 ? 1 : -1;
          var errW = 0, totalW = 0;
          for (var p = 0; p < n; p += 1) {
            var pt = points[p];
            var side = sign * ((nx * pt.x + ny * pt.y) - offset >= 0 ? 1 : -1);
            totalW += pt.weight;
            if (side !== pt.label) errW += pt.weight;
          }
          var err = errW / totalW;
          if (!best || err < best.err) best = { nx: nx, ny: ny, offset: offset, sign: sign, err: err };
        }
        var err = Math.min(Math.max(best.err, 0.02), 0.49);
        var alpha = 0.5 * Math.log((1 - err) / err);
        // 更新样本权重
        var norm = 0;
        for (var p2 = 0; p2 < n; p2 += 1) {
          var pt2 = points[p2];
          var side2 = best.sign * ((best.nx * pt2.x + best.ny * pt2.y) - best.offset >= 0 ? 1 : -1);
          var wrong = side2 !== pt2.label;
          pt2.weight *= Math.exp(alpha * (wrong ? 1 : -1));
          norm += pt2.weight;
        }
        for (var p3 = 0; p3 < n; p3 += 1) points[p3].weight /= (norm / n);

        weakClassifiers.push({ nx: best.nx, ny: best.ny, offset: best.offset, sign: best.sign, alpha: alpha, err: best.err });
      }

      return { points: points, weak: weakClassifiers };
    }

    function ensembleValue(x, y, count) {
      var sum = 0;
      var k = Math.min(count, model.weak.length);
      for (var i = 0; i < k; i += 1) {
        var c = model.weak[i];
        var side = c.sign * ((c.nx * x + c.ny * y) - c.offset >= 0 ? 1 : -1);
        sum += c.alpha * side;
      }
      return sum;
    }

    function drawWeakLines(g, count) {
      g.save();
      var k = Math.min(count, model.weak.length);
      for (var i = 0; i < k; i += 1) {
        var c = model.weak[i];
        // 画出这条弱分割线：与法线垂直的方向
        var dx = -c.ny, dy = c.nx;
        var cx = c.nx * c.offset, cy = c.ny * c.offset;
        var len = 1300;
        var x1 = cx - dx * len, y1 = cy - dy * len;
        var x2 = cx + dx * len, y2 = cy + dy * len;
        var alphaWeight = Deck.clamp(c.alpha / 1.4, 0.05, 1);
        g.strokeStyle = rgba(palette.weak, 0.1 + alphaWeight * 0.16);
        g.lineWidth = 1.1;
        g.beginPath();
        g.moveTo(x1, y1);
        g.lineTo(x2, y2);
        g.stroke();
      }
      g.restore();
    }

    function drawStrongBoundary(g, count) {
      // 按列扫描找 ensembleValue 的过零点，得到边界曲线在每一列的 y 坐标，
      // 再把相邻列的过零点连成一条连续折线，画出组合边界。
      var colStep = 8;
      var rowStep = 4;
      var boundaryPts = [];
      for (var x = 60; x <= 1540; x += colStep) {
        var prevVal = null, prevY = null, foundY = null;
        for (var y = 70; y <= 830; y += rowStep) {
          var v = ensembleValue(x, y, count);
          if (prevVal !== null && (prevVal < 0) !== (v < 0)) {
            var t = prevVal / (prevVal - v);
            foundY = prevY + t * rowStep;
            break;
          }
          prevVal = v; prevY = y;
        }
        boundaryPts.push(foundY === null ? null : { x: x, y: foundY });
      }

      g.save();
      g.strokeStyle = rgba(palette.weight, 0.9);
      g.lineWidth = 3;
      g.lineJoin = 'round';
      g.lineCap = 'round';
      g.beginPath();
      var drawing = false;
      for (var i = 0; i < boundaryPts.length; i += 1) {
        var pt = boundaryPts[i];
        if (!pt || quietDistance(pt.x, pt.y) < 1.05) { drawing = false; continue; }
        if (!drawing) { g.moveTo(pt.x, pt.y); drawing = true; }
        else g.lineTo(pt.x, pt.y);
      }
      g.stroke();
      g.restore();
    }

    function drawPoints(g, count) {
      g.save();
      for (var i = 0; i < model.points.length; i += 1) {
        var pt = model.points[i];
        var v = ensembleValue(pt.x, pt.y, count);
        var predicted = v >= 0 ? 1 : -1;
        var correct = predicted === pt.label;
        var color = correct ? palette.correct : palette.error;
        g.fillStyle = rgba(color, correct ? 0.72 : 0.9);
        g.beginPath();
        var r = pt.label === 1 ? 4.2 : 3.6;
        if (pt.label === 1) {
          g.arc(pt.x, pt.y, r, 0, Math.PI * 2);
          g.fill();
        } else {
          g.save();
          g.translate(pt.x, pt.y);
          g.rotate(Math.PI / 4);
          g.fillRect(-r, -r, r * 2, r * 2);
          g.restore();
        }
      }
      g.restore();
    }

    function stageForTime(ms) {
      // 慢慢把弱分类器一个个叠加进去，最终停在全部叠加完成的代表帧
      var duration = 4200;
      var t = Deck.clamp(ms / duration, 0, 1);
      var eased = t * t * (3 - 2 * t);
      return Math.round(eased * CONFIG.nWeak);
    }

    function render(ms) {
      if (!ctx || !model) return;
      var count = stageForTime(ms);
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = rgba(palette.bg, 1);
      ctx.fillRect(0, 0, W, H);
      drawWeakLines(ctx, count);
      drawStrongBoundary(ctx, count);
      drawPoints(ctx, count);
    }

    function rebuild() {
      ctx = Deck.fit(canvas);
      if (!ctx) return;
      readPalette();
      model = buildModel();
      render(lastTime);
    }

    function startMotion() {
      stopMotion();
      if (Deck.reduced() || cleaned) {
        render(REPRESENTATIVE_MS);
        lastTime = REPRESENTATIVE_MS;
        return;
      }
      var baseTime = 0;
      stopLoop = Deck.loop(function (elapsed) {
        var ms = Math.min(elapsed, REPRESENTATIVE_MS);
        lastTime = ms;
        render(ms);
        if (ms >= REPRESENTATIVE_MS) stopMotion();
      }, { still: REPRESENTATIVE_MS });
    }

    function stopMotion() { stopLoop(); stopLoop = function(){}; }

    function onResize() {
      window.cancelAnimationFrame(resizeQueued);
      resizeQueued = window.requestAnimationFrame(function () {
        resizeQueued = 0;
        rebuild();
        startMotion();
      });
    }

    function onMotionPreference() {
      stopMotion();
      lastTime = REPRESENTATIVE_MS;
      render(lastTime);
      if (!Deck.reduced()) startMotion();
    }

    function cleanup() {
      if (cleaned) return;
      cleaned = true;
      stopMotion();
      offResize();
      window.cancelAnimationFrame(resizeQueued);
      window.removeEventListener('pagehide', cleanup);
      if (media) {
        if (media.removeEventListener) media.removeEventListener('change', onMotionPreference);
        else if (media.removeListener) media.removeListener(onMotionPreference);
      }
    }

    window.addEventListener('pagehide', cleanup);
    if (media) {
      if (media.addEventListener) media.addEventListener('change', onMotionPreference);
      else if (media.addListener) media.addListener(onMotionPreference);
    }
    offResize = Deck.onResize(onResize);

    rebuild();
    startMotion();
  })();
  </script>
</body>
</html>
