<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{ position:relative; padding:0; overflow:hidden; }
  #field{ position:absolute; inset:0; width:100%; height:100%; }

  .cover-copy{
    position:absolute;
    left:50%; top:120px;
    transform:translateX(-50%);
    text-align:center;
    width:820px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    pointer-events:none;
  }
  .cover-copy h1{
    font-size:56px;
    letter-spacing:.03em;
    line-height:1.15;
    margin:0;
    color:var(--text);
  }
  .cover-copy .subtitle{
    font-size:var(--fs-lead);
    color:var(--muted);
    margin:0;
    letter-spacing:.02em;
  }
  .cover-copy .rule{
    width:64px;
    height:2px;
    background:var(--ensemble);
    margin:2px 0;
  }

  .legend-row{
    position:absolute;
    left:50%;
    bottom:32px;
    transform:translateX(-50%);
    display:flex;
    gap:28px;
    align-items:center;
    font-size:var(--fs-label);
    color:var(--muted);
    pointer-events:none;
  }
  .cover-note{
    position:absolute;
    left:50%;
    bottom:66px;
    transform:translateX(-50%);
    width:660px;
    text-align:center;
    font-size:var(--fs-sec);
    color:var(--muted);
    line-height:1.5;
    margin:0;
    pointer-events:none;
  }
  .legend-row .li{ display:flex; align-items:center; gap:8px; }
  .legend-row .sw{ width:16px; height:16px; border-radius:50%; display:inline-block; flex:none; }
  .legend-row .sw.dot-pos{ background:var(--panel-bg); border:2px solid var(--text); }
  .legend-row .sw.dot-neg{ background:var(--text); }
  .legend-row .sw.line-weak{ width:20px; height:0; border-top:2px dashed var(--weak); border-radius:0; }
  .legend-row .sw.line-ens{ width:20px; height:0; border-top:3px solid var(--ensemble); border-radius:0; }

  .round-tag{
    position:absolute;
    right:56px; top:36px;
    font-family:var(--font-num);
    font-size:var(--fs-label);
    color:var(--muted);
    letter-spacing:.02em;
    text-align:right;
    white-space:nowrap;
    pointer-events:none;
  }
  .round-tag b{
    color:var(--ensemble);
    font-weight:700;
  }

  .stump-mark{
    position:absolute;
    left:56px; top:40px;
    display:flex;
    align-items:center;
    gap:10px;
    pointer-events:none;
    white-space:nowrap;
  }
  .stump-mark svg{ display:block; flex:none; }
  .stump-mark span{
    font-size:var(--fs-label);
    color:var(--muted);
    letter-spacing:.06em;
    white-space:nowrap;
  }
</style>
</head>
<body data-page="01" data-total="8">
<div id="stage">
  <canvas id="field" aria-hidden="true"></canvas>

  <div class="stump-mark" aria-hidden="true">
    <svg width="30" height="24" viewBox="0 0 30 24">
      <line x1="15" y1="24" x2="15" y2="12" stroke="var(--muted)" stroke-width="2"/>
      <line x1="15" y1="12" x2="4" y2="2" stroke="var(--muted)" stroke-width="2"/>
      <line x1="15" y1="12" x2="26" y2="2" stroke="var(--muted)" stroke-width="2"/>
    </svg>
    <span>弱分类器 · 逐轮分裂</span>
  </div>

  <div class="round-tag" aria-hidden="true">
    第 <b id="round-now">1</b> / <span id="round-total">8</span> 轮加权投票
  </div>

  <section class="cover-copy" aria-label="封面标题">
    <h1>AdaBoosting 算法</h1>
    <div class="rule"></div>
    <p class="subtitle">让一群"只能猜个大概"的弱分类器，投票投出一个可靠的判断</p>
  </section>

  <p class="cover-note" aria-hidden="true">每一条虚线是一个只会切一刀的弱分类器；被切错的点在下一轮被放大权重，八轮之后它们的加权投票拼出图中那条实线</p>

  <div class="legend-row" aria-hidden="true">
    <span class="li"><i class="sw dot-pos"></i>正类样本</span>
    <span class="li"><i class="sw dot-neg"></i>负类样本</span>
    <span class="li"><i class="sw line-weak"></i>单个弱分类器</span>
    <span class="li"><i class="sw line-ens"></i>加权集成边界</span>
  </div>
</div>

<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/base.js"></script>
<script>
(function(){
  "use strict";

  var W = 1600, H = 900;
  var canvas = document.getElementById('field');
  var roundNowEl = document.getElementById('round-now');

  var CONFIG = Object.freeze({
    seed: 'notale-adaboost-cover-v1',
    nPoints: 130,
    rounds: 8,
    titleField: { cx: 800, cy: 255, rx: 440, ry: 175 },
    noteField: { x0: 470, y0: 742, x1: 1130, y1: 900 }
  });

  var palette = {};
  function readPalette(){
    palette.weak = Deck.rgb('weak');
    palette.wrong = Deck.rgb('wrong');
    palette.correct = Deck.rgb('correct');
    palette.ensemble = Deck.rgb('ensemble');
    palette.text = Deck.rgb('text');
    palette.line = Deck.rgb('line');
    palette.muted = Deck.rgb('muted');
    palette.panel = Deck.rgb('panel-bg');
  }
  function rgba(rgb, a){ return 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+a+')'; }

  function inTitleField(x, y){
    var t = CONFIG.titleField;
    var dx = (x - t.cx) / t.rx, dy = (y - t.cy) / t.ry;
    return (dx*dx + dy*dy) < 1;
  }
  function inNoteField(x, y){
    var n = CONFIG.noteField;
    return x > n.x0 && x < n.x1 && y > n.y0 && y < n.y1;
  }

  // 真实标签由一条不可被单个树桩分开的曲线决定：双频正弦形边界，
  // 逼迫弱分类器在水平/竖直方向之间来回切换才能逐步逼近它
  // 真实标签由一条阶梯状边界决定：每一段常数高度都需要一次新的树桩才能覆盖，
  // 逼迫弱分类器逐段接管，最终的加权集成边界呈现出台阶状的组合痕迹
  function boundaryY(x){
    if (x < 260) return 470;
    if (x < 520) return 640;
    if (x < 790) return 430;
    if (x < 1060) return 690;
    if (x < 1320) return 500;
    return 660;
  }
  function trueLabel(x, y){
    return (y - boundaryY(x)) > 0 ? 1 : -1;
  }

  function buildPoints(){
    var rng = new Math.seedrandom(CONFIG.seed + '/points');
    var pts = [];
    var guard = 0;
    while (pts.length < CONFIG.nPoints && guard < 4000){
      guard++;
      var x = 70 + rng() * (W - 140);
      var y = 300 + rng() * (H - 440);
      if (inTitleField(x, y) || inNoteField(x, y)) continue;
      var label = trueLabel(x, y);
      // 阶梯边界附近加一点噪声，制造单刀无法完美分开的重叠区
      if (Math.abs(y - boundaryY(x)) < 26 && rng() < 0.42) label = -label;
      pts.push({ x:x, y:y, label:label, w: 1/CONFIG.nPoints });
    }
    return pts;
  }

  // 候选树桩：水平线 y=c 或竖直线 x=c，两种方向各自 +1/-1 分支
  function bestStump(pts){
    var xs = pts.map(function(p){return p.x;}).sort(function(a,b){return a-b;});
    var ys = pts.map(function(p){return p.y;}).sort(function(a,b){return a-b;});
    var best = null;

    function evalThreshold(axis, threshold, sign){
      var err = 0;
      for (var i = 0; i < pts.length; i++){
        var p = pts[i];
        var v = axis === 'x' ? p.x : p.y;
        var pred = (v > threshold ? 1 : -1) * sign;
        if (pred !== p.label) err += p.w;
      }
      return err;
    }

    [['x', xs], ['y', ys]].forEach(function(pair){
      var axis = pair[0], arr = pair[1];
      for (var i = 1; i < arr.length; i += 1){
        var threshold = (arr[i-1] + arr[i]) / 2;
        [1, -1].forEach(function(sign){
          var err = evalThreshold(axis, threshold, sign);
          if (!best || err < best.err){
            best = { axis: axis, threshold: threshold, sign: sign, err: err };
          }
        });
      }
    });
    return best;
  }

  function runAdaboost(pts){
    var stumps = [];
    var totalW = pts.length;
    pts.forEach(function(p){ p.w = 1/totalW; });

    for (var r = 0; r < CONFIG.rounds; r++){
      var sumW = pts.reduce(function(s,p){return s+p.w;}, 0);
      pts.forEach(function(p){ p.w /= sumW; });

      var stump = bestStump(pts);
      var err = Math.max(1e-6, Math.min(1 - 1e-6, stump.err));
      var alpha = 0.5 * Math.log((1-err)/err);
      stump.alpha = alpha;

      pts.forEach(function(p){
        var v = stump.axis === 'x' ? p.x : p.y;
        var pred = (v > stump.threshold ? 1 : -1) * stump.sign;
        p.w *= Math.exp(-alpha * pred * p.label);
        p.lastWrong = (pred !== p.label);
      });

      stumps.push(stump);
    }
    return stumps;
  }

  function stumpPredict(stump, x, y){
    var v = stump.axis === 'x' ? x : y;
    return (v > stump.threshold ? 1 : -1) * stump.sign;
  }

  function ensemblePredict(stumps, uptoIdx, x, y){
    var s = 0;
    for (var i = 0; i <= uptoIdx; i++){
      s += stumps[i].alpha * stumpPredict(stumps[i], x, y);
    }
    return s;
  }

  // 在网格上求集成函数符号变化的等值线（marching squares 简化版：逐行找符号翻转点连线）
  function traceEnsembleBoundary(stumps, uptoIdx){
    var step = 8;
    var segments = [];
    var cols = Math.floor(W/step)+1;
    var rows = Math.floor(H/step)+1;
    var field = new Float32Array(cols*rows);
    for (var j=0;j<rows;j++){
      for (var i=0;i<cols;i++){
        field[j*cols+i] = ensemblePredict(stumps, uptoIdx, i*step, j*step);
      }
    }
    function at(i,j){ return field[j*cols+i]; }
    function lerpEdge(x1,y1,v1,x2,y2,v2){
      var t = v1 / (v1 - v2);
      return { x: x1 + (x2-x1)*t, y: y1 + (y2-y1)*t };
    }
    for (var j=0;j<rows-1;j++){
      for (var i=0;i<cols-1;i++){
        var v00=at(i,j), v10=at(i+1,j), v01=at(i,j+1), v11=at(i+1,j+1);
        var x0=i*step, x1=(i+1)*step, y0=j*step, y1=(j+1)*step;
        var pts=[];
        if ((v00>0)!==(v10>0)) pts.push(lerpEdge(x0,y0,v00,x1,y0,v10));
        if ((v10>0)!==(v11>0)) pts.push(lerpEdge(x1,y0,v10,x1,y1,v11));
        if ((v11>0)!==(v01>0)) pts.push(lerpEdge(x1,y1,v11,x0,y1,v01));
        if ((v01>0)!==(v00>0)) pts.push(lerpEdge(x0,y1,v01,x0,y0,v00));
        if (pts.length===2) segments.push([pts[0], pts[1]]);
      }
    }
    return segments;
  }

  var model = null;
  var ctx = null;
  var ROUND_MS = 900;
  var HOLD_MS = 2200;
  var TOTAL_MS = CONFIG.rounds * ROUND_MS + HOLD_MS;

  function buildModel(){
    var pts = buildPoints();
    var stumps = runAdaboost(pts.map(function(p){ return {x:p.x,y:p.y,label:p.label,w:p.w}; }));
    // 重新计算每轮末尾每个点的“当前权重”“是否被最新树桩分错”供可视化
    var pts2 = buildPoints();
    var history = []; // history[r] = {stump, weights:[...], wrong:[bool]}
    var sumW = pts2.length;
    pts2.forEach(function(p){ p.w = 1/sumW; });
    for (var r=0;r<stumps.length;r++){
      var stump = stumps[r];
      var wrongFlags = [];
      pts2.forEach(function(p){
        var pred = stumpPredict(stump, p.x, p.y);
        wrongFlags.push(pred !== p.label);
      });
      var snapshot = pts2.map(function(p){ return p.w; });
      history.push({ stump: stump, weights: snapshot, wrong: wrongFlags });
      var norm = 0;
      pts2.forEach(function(p, idx){
        var pred = stumpPredict(stump, p.x, p.y);
        p.w *= Math.exp(-stump.alpha * pred * p.label);
        norm += p.w;
      });
      pts2.forEach(function(p){ p.w /= norm; });
    }
    return { points: pts2, stumps: stumps, history: history };
  }

  function drawStumpLine(g, stump, alphaMul){
    g.save();
    g.strokeStyle = rgba(palette.weak, 0.55 * alphaMul);
    g.lineWidth = 1.6;
    g.setLineDash([9, 7]);
    if (stump.axis === 'x'){
      g.beginPath(); g.moveTo(stump.threshold, 0); g.lineTo(stump.threshold, H); g.stroke();
    } else {
      g.beginPath(); g.moveTo(0, stump.threshold); g.lineTo(W, stump.threshold); g.stroke();
    }
    g.restore();
  }

  function drawPoints(g, points, weights, wrongFlags){
    for (var i=0;i<points.length;i++){
      var p = points[i];
      var w = weights ? weights[i] : (1/points.length);
      var radius = 4 + Math.min(10, w * points.length * 4.2);
      var wrong = wrongFlags ? wrongFlags[i] : false;

      g.beginPath();
      g.arc(p.x, p.y, radius, 0, Math.PI*2);
      if (p.label === 1){
        g.fillStyle = rgba(palette.panel, 1);
        g.lineWidth = wrong ? 2.6 : 1.8;
        g.strokeStyle = wrong ? rgba(palette.wrong, 0.95) : rgba(palette.text, 0.75);
        g.fill();
        g.stroke();
      } else {
        g.fillStyle = wrong ? rgba(palette.wrong, 0.92) : rgba(palette.text, 0.82);
        g.fill();
        if (wrong){
          g.lineWidth = 1.6;
          g.strokeStyle = rgba(palette.wrong, 0.5);
          g.stroke();
        }
      }
    }
  }

  function drawEnsemble(g, stumps, uptoIdx, alpha){
    var segments = traceEnsembleBoundary(stumps, uptoIdx);
    g.save();
    g.strokeStyle = rgba(palette.ensemble, alpha);
    g.lineWidth = 3.4;
    g.lineCap = 'round';
    segments.forEach(function(seg){
      // 跳过穿过标题安全区的线段，保持标题干净
      var mx = (seg[0].x+seg[1].x)/2, my=(seg[0].y+seg[1].y)/2;
      if (inTitleField(mx,my) || inNoteField(mx,my)) return;
      g.beginPath();
      g.moveTo(seg[0].x, seg[0].y);
      g.lineTo(seg[1].x, seg[1].y);
      g.stroke();
    });
    g.restore();
  }

  function render(timeMs){
    if (!ctx || !model) return;
    ctx.clearRect(0,0,W,H);

    var round = Math.min(CONFIG.rounds, Math.floor(timeMs / ROUND_MS));
    var frac = Deck.clamp((timeMs - round*ROUND_MS)/ROUND_MS, 0, 1);
    var displayRound = Math.min(CONFIG.rounds, round + (frac>0?1:0));
    if (timeMs >= CONFIG.rounds*ROUND_MS) displayRound = CONFIG.rounds;
    roundNowEl.textContent = String(Math.max(1, displayRound));

    var idx = Math.max(0, Math.min(CONFIG.rounds-1, round));
    var snap = model.history[idx];

    // 历史弱分类器线：已经出现的轮次画淡线
    for (var r=0;r<CONFIG.rounds;r++){
      if (r < round){
        drawStumpLine(ctx, model.history[r].stump, 0.6);
      } else if (r === round && timeMs < CONFIG.rounds*ROUND_MS){
        drawStumpLine(ctx, model.history[r].stump, 0.6 * frac);
      }
    }

    var weights = snap.weights;
    var wrongFlags = snap.wrong;
    drawPoints(ctx, model.points, weights, wrongFlags);

    // 集成边界：轮次越多，累计的弱分类器越多，边界越清晰
    var ensembleUpto = Math.max(0, round - 1);
    var ensembleAlpha = 0.85;
    if (timeMs < CONFIG.rounds*ROUND_MS && round === 0){
      ensembleAlpha = 0;
    } else {
      var appear = Deck.clamp((timeMs - ROUND_MS) / (ROUND_MS*1.4), 0, 1);
      ensembleAlpha = 0.85 * appear;
    }
    if (ensembleUpto >= 0 && ensembleAlpha > 0.01){
      drawEnsemble(ctx, model.stumps, Math.min(ensembleUpto, model.stumps.length-1), ensembleAlpha);
    }
  }

  function rebuild(){
    ctx = Deck.fit(canvas);
    if (!ctx) return;
    readPalette();
    model = buildModel();
    render(Deck.reduced() ? TOTAL_MS : 0);
  }

  var stopLoop = function(){};
  function startMotion(){
    stopLoop();
    if (Deck.reduced()){
      render(TOTAL_MS);
      return;
    }
    stopLoop = Deck.loop(function(elapsed){
      var t = Math.min(elapsed, TOTAL_MS);
      render(t);
    }, { still: TOTAL_MS });
  }

  Deck.onResize(function(){ rebuild(); });
  rebuild();
  startMotion();
})();
</script>
</body>
</html>
