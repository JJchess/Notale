<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdaBoost 算法讲解</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{
  --bg:#EEF1F5; --text:#111820; --font-sans:"Noto Sans CJK SC",ui-sans-serif,system-ui,sans-serif;
}
#stage{
  display:flex; flex-direction:column; gap:18px;
  font-family:var(--font-sans); color:var(--text);
}
h1{
  font-family:var(--font-display,"Clear Sans","Noto Sans CJK SC",sans-serif);
  font-size:40px; font-weight:700; margin:0; letter-spacing:-.01em;
}
.lead{ font-size:var(--fs-lead); color:var(--muted); margin:4px 0 0; max-width:1100px; line-height:1.5; }

.main{ flex:1; min-height:0; display:flex; gap:24px; }
.split-l{ width:40%; min-width:0; display:flex; flex-direction:column; gap:14px; }
.split-r{ width:60%; min-width:0; display:flex; flex-direction:column; gap:0; }

.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:4px;
  padding:18px 20px;
}
.step-title{ font-size:var(--fs-h2); font-weight:700; margin:0 0 6px; }
.step-copy{ font-size:var(--fs-body); line-height:1.6; color:var(--text); margin:0; }
.step-copy b{ color:var(--weight); }

.formula-row{ display:flex; align-items:baseline; gap:10px; font-family:var(--font-mono); font-size:20px; margin-top:10px; }
.formula-row .val{ color:var(--weight); font-weight:700; }

.beats{ display:flex; gap:8px; }
.beat-btn{
  flex:1; text-align:left; border:1px solid var(--line); background:var(--surface);
  border-radius:3px; padding:10px 12px; cursor:pointer; font-family:var(--font-sans);
  font-size:var(--fs-label); color:var(--muted); transition:border-color .15s, color .15s;
}
.beat-btn .n{ font-family:var(--font-mono); font-weight:700; margin-right:6px; }
.beat-btn[aria-current="step"]{ border-color:var(--weight); color:var(--text); }
.beat-btn[aria-current="step"] .n{ color:var(--weight); }
.beat-btn:hover{ color:var(--text); }

.stage-wrap{ flex:1; min-height:0; background:var(--surface); border:1px solid var(--line); border-radius:4px; display:flex; flex-direction:column; padding:16px 20px; }
.stage-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
.stage-head .cap{ font-size:var(--fs-h2); font-weight:700; }
.stage-head .sub{ font-size:var(--fs-sec); color:var(--muted); font-family:var(--font-mono); }
.cvbox{ position:relative; flex:1; min-height:0; }
svg.scene{ position:absolute; inset:0; width:100%; height:100%; }

.legend{ display:flex; gap:22px; margin-top:8px; }
.legend .li{ display:flex; align-items:center; gap:7px; font-size:var(--fs-label); color:var(--muted); }
.legend .sw{ width:12px; height:12px; border-radius:50%; display:inline-block; }
</style>
</head>
<body data-page="08" data-total="16">
<div id="stage">
  <header>
    <h1>AdaBoost 算法：一轮迭代的四个动作</h1>
    <p class="lead">每一轮里，算法先用当前权重训练一个弱分类器，再算它的误差和话语权，最后用话语权更新样本权重——下一轮就从新的权重出发。</p>
  </header>

  <div class="main">
    <div class="split-l">
      <div class="beats" role="group" aria-label="选择步骤">
        <button class="beat-btn" data-step="0" aria-current="step"><span class="n">1</span>当前权重</button>
        <button class="beat-btn" data-step="1"><span class="n">2</span>训练弱分类器</button>
        <button class="beat-btn" data-step="2"><span class="n">3</span>计算权重</button>
        <button class="beat-btn" data-step="3"><span class="n">4</span>累加强分类器</button>
      </div>
      <div class="panel" style="flex:1;">
        <div class="step-title" id="stepTitle">当前权重分布</div>
        <p class="step-copy" id="stepCopy">
          8 个样本，第一轮权重均为 <b>w = 1/8 = 0.125</b>。圆点面积表示权重大小，此刻所有点一样大。
        </p>
        <div class="formula-row" id="formulaRow"></div>
      </div>
    </div>

    <div class="split-r">
      <div class="stage-wrap">
        <div class="stage-head">
          <span class="cap">特征空间 x</span>
          <span class="sub" id="stageSub">轮次 t = 1</span>
        </div>
        <div class="cvbox">
          <svg class="scene" viewBox="0 0 900 560" role="img" aria-label="8个样本点在数轴上的分布与弱分类器分割线">
            <line x1="60" y1="480" x2="840" y2="480" stroke="#C8D0DB" stroke-width="1"/>
            <g id="ticks"></g>
            <line id="splitLine" x1="450" y1="80" x2="450" y2="480" stroke="#617CA8" stroke-width="2" stroke-dasharray="6 5" opacity="0"/>
            <text id="splitLabel" x="450" y="66" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#617CA8" opacity="0">x = 4.5</text>
            <g id="predBands" opacity="0">
              <rect x="60" y="490" width="390" height="26" fill="none"/>
              <text x="255" y="508" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#657181">预测 +1</text>
              <text x="645" y="508" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#657181">预测 -1</text>
            </g>
            <g id="points"></g>
            <g id="alphaMark" opacity="0">
              <text x="450" y="530" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#164E9B" font-weight="700"></text>
            </g>
          </svg>
        </div>
        <div class="legend">
          <span class="li"><span class="sw" style="background:#294E86"></span>真实类别 +1</span>
          <span class="li"><span class="sw" style="background:#111820"></span>真实类别 -1</span>
          <span class="li"><span class="sw" style="background:#C64232"></span>被弱分类器误分</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/base.js"></script>
<script>
Deck.init({ index: 7, total: 16, keys: true });

// ---- canonical data ----
// x in [1,8], class +1 or -1. Splitter at x=4.5 predicts +1 if x<4.5 else -1.
const POINTS = [
  { x: 1.3, cls: 1 },
  { x: 2.1, cls: 1 },
  { x: 3.4, cls: 1 },
  { x: 6.6, cls: 1 },   // misclassified (x>=4.5 but true +1)
  { x: 5.2, cls: -1 },
  { x: 6.0, cls: -1 },
  { x: 7.5, cls: -1 },
  { x: 3.0, cls: -1 }   // misclassified (x<4.5 but true -1)
];
const N = POINTS.length;
const EPS = 2 / N;                       // 0.25
const ALPHA = 0.5 * Math.log((1 - EPS) / EPS); // 0.5493...
const W0 = 1 / N;                        // 0.125
const wCorrectRaw = W0 * Math.exp(-ALPHA);
const wWrongRaw = W0 * Math.exp(ALPHA);
const total = wCorrectRaw * 6 + wWrongRaw * 2;
const W1_CORRECT = wCorrectRaw / total;  // ~0.0833
const W1_WRONG = wWrongRaw / total;      // 0.25

POINTS.forEach(p => {
  p.pred = p.x < 4.5 ? 1 : -1;
  p.wrong = p.pred !== p.cls;
});

const fmt = (n, d=3) => n.toFixed(d);
const xScale = x => 60 + (x - 0.5) * (780 / 8);
const yBase = 480;

const svgNS = 'http://www.w3.org/2000/svg';
const ticksG = document.getElementById('ticks');
const pointsG = document.getElementById('points');
for (let i = 1; i <= 8; i++) {
  const t = document.createElementNS(svgNS, 'text');
  t.setAttribute('x', xScale(i));
  t.setAttribute('y', 502);
  t.setAttribute('text-anchor', 'middle');
  t.setAttribute('font-family', 'JetBrains Mono, monospace');
  t.setAttribute('font-size', '13');
  t.setAttribute('fill', '#657181');
  t.textContent = i;
  ticksG.appendChild(t);
}

const nodes = POINTS.map((p, i) => {
  const g = document.createElementNS(svgNS, 'g');
  const c = document.createElementNS(svgNS, 'circle');
  c.setAttribute('cx', xScale(p.x));
  c.setAttribute('cy', p.cls === 1 ? 300 : 200);
  g.appendChild(c);
  pointsG.appendChild(g);
  return { g, c, p };
});

const R0 = 14; // radius for w=0.125 baseline
function radiusFor(w) {
  // area proportional to weight; baseline w0=0.125 maps to R0
  return R0 * Math.sqrt(w / W0);
}

function colorFor(p, step) {
  if (step >= 1 && p.wrong) return '#C64232';
  return p.cls === 1 ? '#294E86' : '#111820';
}

const STEPS = [
  {
    title: '当前权重分布',
    copy: `8 个样本，第一轮权重均为 <b>w = 1/8 = 0.125</b>。圆点面积表示权重大小，此刻所有点一样大。`,
    formula: `w<sub>i</sub> = 1/N = <span class="val">0.125</span>`,
    sub: '轮次 t = 1 · 初始权重',
    showSplit: false, showBands: false, showAlpha: false,
    weights: () => W0
  },
  {
    title: '训练一个弱分类器',
    copy: `按当前权重找一条分割线 <b>x = 4.5</b>：左侧预测 +1，右侧预测 -1。8 个点里有 2 个被分错，误差率 <b>ε = 2/8 = 0.25</b>。`,
    formula: `ε = <span class="val">0.250</span>`,
    sub: '轮次 t = 1 · 弱分类器 G₁(x)',
    showSplit: true, showBands: true, showAlpha: false,
    weights: () => W0
  },
  {
    title: '计算这个分类器的话语权',
    copy: `误差越小，话语权越大：<b>α = ½ln((1-ε)/ε)</b>。ε=0.25 时 α ≈ 0.549——这一轮分类器会用这个权重参与最终投票。`,
    formula: `α = ½ln((1-0.25)/0.25) = <span class="val">${fmt(ALPHA)}</span>`,
    sub: '轮次 t = 1 · 分类器权重 α₁',
    showSplit: true, showBands: true, showAlpha: true,
    weights: () => W0
  },
  {
    title: '更新样本权重',
    copy: `分对的样本权重乘 <b>e<sup>-α</sup></b> 变小，分错的样本权重乘 <b>e<sup>α</sup></b> 变大，归一化后进入下一轮。被误分的两个点权重从 0.125 升到 <b>0.25</b>，其余降到 <b>0.083</b>。`,
    formula: `w<sub>对</sub>=<span class="val">${fmt(W1_CORRECT)}</span> &nbsp; w<sub>错</sub>=<span class="val">${fmt(W1_WRONG,2)}</span>`,
    sub: '轮次 t = 1 → 2 · 下一轮起点',
    showSplit: true, showBands: false, showAlpha: false,
    weights: (p) => p.wrong ? W1_WRONG : W1_CORRECT
  }
];

const stepTitle = document.getElementById('stepTitle');
const stepCopy = document.getElementById('stepCopy');
const formulaRow = document.getElementById('formulaRow');
const stageSub = document.getElementById('stageSub');
const splitLine = document.getElementById('splitLine');
const splitLabel = document.getElementById('splitLabel');
const predBands = document.getElementById('predBands');
const alphaMark = document.getElementById('alphaMark');
const beatButtons = [...document.querySelectorAll('.beat-btn')];

let current = 0;

function render(step) {
  current = step;
  const S = STEPS[step];
  stepTitle.textContent = S.title;
  stepCopy.innerHTML = S.copy;
  formulaRow.innerHTML = S.formula;
  stageSub.textContent = S.sub;
  splitLine.style.opacity = S.showSplit ? 1 : 0;
  splitLabel.style.opacity = S.showSplit ? 1 : 0;
  predBands.style.opacity = S.showBands ? 1 : 0;
  alphaMark.style.opacity = S.showAlpha ? 1 : 0;
  if (S.showAlpha) {
    alphaMark.querySelector('text').textContent = `α₁ = ${fmt(ALPHA)}`;
  }

  nodes.forEach(n => {
    const w = S.weights(n.p);
    n.c.setAttribute('r', radiusFor(w).toFixed(2));
    n.c.setAttribute('fill', colorFor(n.p, step));
    n.c.setAttribute('stroke', '#FAFBFC');
    n.c.setAttribute('stroke-width', '1.5');
  });

  beatButtons.forEach((b, i) => {
    if (i === step) b.setAttribute('aria-current', 'step');
    else b.removeAttribute('aria-current');
  });
}

beatButtons.forEach(b => {
  b.addEventListener('click', () => render(Number(b.dataset.step)));
});

render(0);
</script>
</body>
</html>
