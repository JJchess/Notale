<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>AdaBoosting 算法</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F6F8;
      --surface: #E3EBEF;
      --text: #14272E;
      --muted: #50656D;
      --focus: #9B3217;
      --weak: #526A73;
      --weight: #B43A13;
      --ensemble: #17617B;
      --confirmed: #2F6B4F;
      --font-sans: "Source Han Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-num: "DIN Alternate", -apple-system, sans-serif;
      --ease-out: cubic-bezier(.16, 1, .3, 1);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      margin: 0;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      padding: var(--pad-y) var(--pad-x);
      overflow: hidden;
      box-sizing: border-box;
      background: var(--bg);
      isolation: isolate;
    }

    /* 背景微弱技术坐标线阵 */
    .bg-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.45;
      background-image:
        linear-gradient(to right, rgba(80, 101, 109, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(80, 101, 109, 0.08) 1px, transparent 1px);
      background-size: 80px 80px;
      z-index: 1;
    }

    /* 左侧排版区：标题与核心概念断言 */
    .cover-copy {
      position: absolute;
      left: 80px;
      top: 110px;
      width: 660px;
      z-index: 10;
      pointer-events: none;
    }

    .topic-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .vote-mark-hero {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 28px;
    }

    .vote-mark-hero span {
      display: block;
      background: var(--weak);
      border-radius: 2px;
    }

    .vote-mark-hero span:nth-child(1) { width: 5px; height: 16px; opacity: 0.6; }
    .vote-mark-hero span:nth-child(2) { width: 7px; height: 22px; opacity: 0.8; }
    .vote-mark-hero span:nth-child(3) { width: 10px; height: 28px; background: var(--ensemble); }

    .topic-meta {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--ensemble);
      text-transform: uppercase;
    }

    .cover-title {
      margin: 0;
      font-size: 58px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--text);
    }

    .cover-title .highlight {
      color: var(--ensemble);
      position: relative;
      display: inline-block;
    }

    .cover-lead {
      margin: 28px 0 0 0;
      font-size: 21px;
      line-height: 1.6;
      color: var(--muted);
      font-weight: 400;
      max-width: 580px;
    }

    .cover-lead strong {
      color: var(--text);
      font-weight: 700;
    }

    /* 机制指标条：弱分类器 -> 权重放大 -> 加权集成 */
    .concept-trio {
      display: flex;
      gap: 16px;
      margin-top: 56px;
    }

    .concept-card {
      background: rgba(227, 235, 239, 0.7);
      border: 1px solid rgba(80, 101, 109, 0.18);
      border-radius: 8px;
      padding: 16px 18px;
      width: 195px;
      box-sizing: border-box;
    }

    .concept-card[data-kind="weak"] { border-top: 3px solid var(--weak); }
    .concept-card[data-kind="weight"] { border-top: 3px solid var(--weight); }
    .concept-card[data-kind="ensemble"] { border-top: 3px solid var(--ensemble); }

    .concept-card .title {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .concept-card .val {
      font-size: 19px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    .concept-card .note {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* 右侧图解系统：SVG 视觉主体 */
    .scene-svg {
      position: absolute;
      right: 56px;
      top: 55px;
      width: 860px;
      height: 780px;
      z-index: 4;
    }

    /* 动画编排 */
    .is-entering .cover-copy { animation: copy-settle 900ms var(--ease-out) both; }
    .is-entering .weak-group-1 { animation: step-fade 800ms 150ms var(--ease-out) both; }
    .is-entering .weak-group-2 { animation: step-fade 800ms 320ms var(--ease-out) both; }
    .is-entering .weak-group-3 { animation: step-fade 800ms 480ms var(--ease-out) both; }
    .is-entering .ensemble-group { animation: step-fade 950ms 650ms var(--ease-out) both; }
    .is-entering .flow-links { animation: link-draw 1100ms 400ms var(--ease-out) both; }

    @keyframes copy-settle {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes step-fade {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes link-draw {
      from { opacity: 0; stroke-dashoffset: 40; }
      to { opacity: 1; stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .is-entering .cover-copy,
      .is-entering .weak-group-1,
      .is-entering .weak-group-2,
      .is-entering .weak-group-3,
      .is-entering .ensemble-group,
      .is-entering .flow-links {
        animation: none !important;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body data-page="01" data-total="5">

  <script src="assets/base.js"></script>
  <script>
    (function() {
      'use strict';
      var stage = document.getElementById('stage');
      var motionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
      var settleTimer = 0;
      var disposed = false;

      function reduced() {
        return motionQuery ? motionQuery.matches : Deck.reduced();
      }

      function settle() {
        if (disposed) return;
        stage.classList.remove('is-entering');
        stage.classList.add('is-settled');
      }

      function syncMotion() {
        stage.classList.toggle('is-reduced', reduced());
        if (reduced()) {
          clearTimeout(settleTimer);
          settle();
        }
      }

      function replay() {
        if (disposed) return;
        clearTimeout(settleTimer);
        stage.classList.remove('is-entering', 'is-settled');
        void stage.offsetWidth;

        if (reduced()) {
          stage.classList.add('is-settled');
          return;
        }

        stage.classList.add('is-entering');
        settleTimer = setTimeout(settle, 1400);
      }

      function onKeydown(event) {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        var key = event.key;
        if (key === 'r' || key === 'R' || key === 'Home' || ((key === 'Enter' || key === ' ') && event.target === stage)) {
          event.preventDefault();
          replay();
        }
      }

      function onVisibility() {
        stage.classList.toggle('is-paused', document.hidden);
      }

      function dispose() {
        if (disposed) return;
        disposed = true;
        clearTimeout(settleTimer);
        document.removeEventListener('keydown', onKeydown);
        document.removeEventListener('visibilitychange', onVisibility);
        if (motionQuery) {
          if (motionQuery.removeEventListener) motionQuery.removeEventListener('change', syncMotion);
          else if (motionQuery.removeListener) motionQuery.removeListener(syncMotion);
        }
      }

      document.addEventListener('keydown', onKeydown);
      document.addEventListener('visibilitychange', onVisibility);
      if (motionQuery) {
        if (motionQuery.addEventListener) motionQuery.addEventListener('change', syncMotion);
        else if (motionQuery.addListener) motionQuery.addListener(syncMotion);
      }
      window.addEventListener('pagehide', dispose, { once: true });

      syncMotion();
      replay();

      Deck.init({ index: 1, total: 5 });
    })();
  </script>
</body>
</html>
