<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>AdaBoosting 算法</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{
  --bg:#EEF1F5;
  --text:#111820;
  --font-sans:"Noto Sans CJK SC",ui-sans-serif,system-ui,sans-serif;
}
#stage{
  position:relative;
  width:1600px;height:900px;
  background:var(--bg);
  overflow:hidden;
  font-family:var(--font-sans);
  color:var(--text);
}
#field{ position:absolute; inset:0; }
.hero{
  position:absolute;
  left:120px; top:340px;
  width:760px;
  pointer-events:none;
}
.kicker{
  font-family:var(--font-mono,ui-monospace,monospace);
  font-size:14px;
  letter-spacing:.16em;
  color:var(--muted,#657181);
}
h1{
  margin:14px 0 0;
  font-family:"Clear Sans","Noto Sans CJK SC",ui-sans-serif,sans-serif;

  letter-spacing:-.01em;
  color:var(--text);
}
h1 .accent{ color:var(--weight,#164E9B); }
.dek{
  margin-top:22px;
  font-size:22px;
  line-height:1.6;
  color:#3a4453;
  max-width:640px;
}
.legend{
  position:absolute;
  left:120px; bottom:64px;
  display:flex;

  font-family:var(--font-mono,ui-monospace,monospace);

  color:var(--muted,#657181);
}

.legend .sw{ width:22px; height:2px; border-radius:1px; display:inline-block; }
</style>
</head>
<body data-page="01" data-total="16">
<div id="stage" tabindex="0" aria-label="AdaBoost 集成过程示意：若干条弱分类器分割线各自倾斜漂移，按权重叠加汇聚为一条稳定的组合边界。">
  <canvas id="field" class="cv-fill no-pan" aria-hidden="true"></canvas>
  <div class="hero">
    <p class="kicker">ENSEMBLE OF WEAK LEARNERS</p>
    <h1>Ada<span class="accent">Boost</span><br>算法</h1>
    <p class="dek">把一群只比随机猜测强一点的弱分类器，按各自的准确度加权叠加，汇聚成一个强分类器。</p>
  </div>
  <div class="legend" aria-hidden="true">
    <span class="li"><i class="sw" style="background:var(--weak,#617CA8)"></i>弱分类器判定线</span>
    <span class="li"><i class="sw" style="background:var(--error,#C64232)"></i>被当前分类器误判的样本</span>
    <span class="li"><i class="sw" style="background:var(--weight,#164E9B);height:3px"></i>加权汇聚的强分类器</span>
  </div>
</div>
<script src="assets/base.js"></script>
<script>
(() => {
  "use strict";

  // 概念种子：多条各自不完美的分割线（弱分类器），按各自权重叠加，
  // 汇聚成一条更稳定、更准的组合边界（强分类器）；被误判的样本点会短暂标红。
  const CONFIG = Object.freeze({
    seed: 20260902,
    pointCount: 130,
    weakCount: 5,
    cycleMs: 9600
  });

  const canvas = document.getElementById("field");
  const stage = document.getElementById("stage");
  const reducedMotion = Deck.reduced();
  let ctx;
  let W = 1600, H = 900;

  // 标题保护区（逻辑坐标），弱线/样本在这一带内降低密度与对比
  function titleFieldDensity(x, y) {
    const cx = 500, cy = 500, rx = 480, ry = 320;
    const d = Math.hypot((x - cx) / rx, (y - cy) / ry);
    if (d < 0.72) return 0.12;
    if (d < 1.05) return 0.12 + (d - 0.72) / 0.33 * 0.88;
    return 1;
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  let points = [];      // {x,y,label}
  let weakLearners = []; // {a,b,c, weight, phase, driftSpeed}  a*x+b*y+c=0，label = sign
  let strongColor, weakColor, errorColor, lineColor;

  function buildModel() {
    const rand = mulberry32(CONFIG.seed);
    points = [];
    for (let i = 0; i < CONFIG.pointCount; i++) {
      let x, y, tries = 0;
      do {
        x = 40 + rand() * (W - 80);
        y = 40 + rand() * (H - 80);
        tries++;
      } while (titleFieldDensity(x, y) < 0.25 && tries < 10);
      // 真实标签由一条隐藏的“真实边界”决定：一条斜线 + 少量噪声
      const trueBoundary = (x - W * 0.42) - (y - H * 0.5) * 0.62;
      const noise = (rand() - 0.5) * 130;
      const label = (trueBoundary + noise) > 0 ? 1 : -1;
      points.push({ x, y, label, weight: 1 });
    }

    weakLearners = [];
    for (let i = 0; i < CONFIG.weakCount; i++) {
      const angle = -0.9 + i * 0.42 + (rand() - 0.5) * 0.25;
      const cx = W * (0.3 + rand() * 0.45);
      const cy = H * (0.3 + rand() * 0.45);
      const a = Math.cos(angle), b = Math.sin(angle);
      const c = -(a * cx + b * cy);
      weakLearners.push({
        a, b, c,
        weight: 0.5 + i * 0.32,
        phase: rand() * Math.PI * 2,
        driftAmp: 8 + rand() * 10,
        driftSpeed: 0.15 + rand() * 0.12
      });
    }
  }

  function signAt(learner, x, y) {
    return (learner.a * x + learner.b * y + learner.c) >= 0 ? 1 : -1;
  }

  // 组合边界：加权平均法向的等效直线（用于绘制汇聚后的强分类器方向指示）
  function combinedLine(t) {
    let sa = 0, sb = 0, sc = 0, sw = 0;
    for (const l of weakLearners) {
      const drift = Math.sin(t * l.driftSpeed + l.phase) * l.driftAmp;
      sa += l.a * l.weight;
      sb += l.b * l.weight;
      sc += (l.c + drift * 0.02) * l.weight;
      sw += l.weight;
    }
    return { a: sa / sw, b: sb / sw, c: sc / sw };
  }

  function drawLine(line, x1, x2, extra) {
    // a*x + b*y + c = 0  =>  y = -(a*x+c)/b
    if (Math.abs(line.b) < 1e-6) return;
    const y1 = -(line.a * x1 + line.c) / line.b;
    const y2 = -(line.a * x2 + line.c) / line.b;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    if (extra) extra(x1, y1, x2, y2);
  }

  function render(t) {
    ctx.clearRect(0, 0, W, H);

    const time = t / 1000;

    // 弱分类器线：各自缓慢漂移，透明度随权重
    weakLearners.forEach((l, i) => {
      const drift = Math.sin(time * l.driftSpeed + l.phase) * l.driftAmp;
      const line = { a: l.a, b: l.b, c: l.c + drift * 0.02 * W };
      const alpha = 0.16 + (l.weight / 2.6) * 0.28;
      ctx.setLineDash([10, 8]);
      ctx.lineWidth = 1.3 + l.weight * 0.5;
      ctx.strokeStyle = `rgba(97,124,168,${alpha})`;
      drawLine(line, -40, W + 40);
    });
    ctx.setLineDash([]);

    // 组合（强）分类器：加权叠加后的稳定边界，穿过场景中段，避开标题区右下留白
    const strong = combinedLine(time);
    ctx.lineWidth = 4.2;
    ctx.strokeStyle = "rgba(22,78,155,0.9)";
    drawLine(strong, -40, W + 40);

    // 样本点：按真实标签着色；若被某条弱线在当前时刻误判，短暂标红提示
    const primaryWeak = weakLearners[weakLearners.length - 1];
    const primaryDrift = Math.sin(time * primaryWeak.driftSpeed + primaryWeak.phase) * primaryWeak.driftAmp;
    const primaryLine = { a: primaryWeak.a, b: primaryWeak.b, c: primaryWeak.c + primaryDrift * 0.02 * W };

    for (const p of points) {
      const density = titleFieldDensity(p.x, p.y);
      if (density < 0.2) continue;
      const predicted = signAt(primaryLine, p.x, p.y);
      const misclassified = predicted !== p.label;
      const r = misclassified ? 5.4 : (p.label === 1 ? 4.2 : 3.6);
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      if (misclassified) {
        ctx.fillStyle = `rgba(198,66,50,${0.55 + 0.4 * density})`;
      } else if (p.label === 1) {
        ctx.fillStyle = `rgba(41,78,134,${0.5 * density})`;
      } else {
        ctx.fillStyle = `rgba(97,124,168,${0.4 * density})`;
      }
      ctx.fill();
    }
  }

  function resizeAndDraw() {
    ctx = Deck.fit(canvas);
    W = Deck.W; H = Deck.H;
    buildModel();
  }

  Deck.init();
  resizeAndDraw();
  Deck.onResize(resizeAndDraw);
  Deck.loop((t) => render(t), { still: 2400 });
})();
</script>
</body>
</html>
