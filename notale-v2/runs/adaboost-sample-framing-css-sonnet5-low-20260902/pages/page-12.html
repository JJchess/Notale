<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>模拟训练 AdaBoosting 模型</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{
  --bg:#EEF1F5; --text:#111820; --font-sans:"Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box;}
#stage{
  width:1600px;height:900px;padding:28px 56px;display:flex;flex-direction:column;
  font-family:var(--font-sans);color:var(--text);
}
h1{
  font-family:"Clear Sans","Noto Sans SC",sans-serif;
  font-size:29px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em;
}
.lead{font-size:16px;color:var(--muted);margin:0;line-height:1.4;}
.body{flex:1;min-height:0;display:flex;gap:22px;margin-top:14px;}

/* ---- left: control + stage world ---- */
.world{
  flex:0 0 900px;min-width:0;display:flex;flex-direction:column;gap:12px;
}
.panel{
  background:var(--surface);border:1px solid var(--line);padding:16px 18px;
}
.plot-wrap{flex:1;min-height:0;position:relative;}
.plot-wrap canvas{position:absolute;inset:0;width:100%;height:100%;}

.ctl-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.ctl-group{display:flex;align-items:center;gap:8px;}
.ctl-label{font-size:14px;color:var(--muted);font-family:var(--font-mono,monospace);}
.btns{display:flex;gap:0;}
.btn{
  appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);
  font-family:var(--font-sans);font-size:14px;padding:7px 14px;cursor:pointer;
}
.btn+.btn{border-left:none;}
.btn.active{background:var(--weight);color:#fff;border-color:var(--weight);}
.btn.primary{
  background:var(--weight);color:#fff;border-color:var(--weight);
  padding:9px 20px;font-size:15px;font-weight:600;
}
.btn.primary:disabled{background:#B9C3D2;border-color:#B9C3D2;cursor:not-allowed;}
.btn.ghost{background:var(--surface);color:var(--muted);}
.btn.ghost:hover{color:var(--text);}
input[type=range]{width:220px;accent-color:var(--weight);}

.readout{display:flex;gap:26px;align-items:baseline;margin-left:auto;}
.readout .item{text-align:right;}
.readout .num{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--weight);}
.readout .unit{font-size:13px;color:var(--muted);margin-left:2px;}
.readout .lbl{font-size:13px;color:var(--muted);display:block;margin-bottom:2px;}

/* ---- right: history & ensemble ---- */
.side{flex:0 0 480px;min-width:0;display:flex;flex-direction:column;gap:14px;}
.side .panel{flex:none;}
.side .hist-wrap{flex:1;min-height:0;display:flex;flex-direction:column;}
table.hist{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:14px;}
table.hist th{
  text-align:right;font-family:var(--font-sans);font-size:13px;color:var(--muted);
  font-weight:400;padding:4px 6px;border-bottom:1px solid var(--line);
}
table.hist th:first-child,table.hist td:first-child{text-align:left;}
table.hist td{text-align:right;padding:5px 6px;border-bottom:1px solid var(--line);}
table.hist tr.current td{color:var(--weight);font-weight:700;}
.acc-canvas-wrap{position:relative;height:120px;margin-top:8px;}
.acc-canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;}
.note{font-size:14px;color:var(--muted);line-height:1.5;margin-top:8px;}
.note b{color:var(--text);}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;}
.legend .li{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);}
.legend .sw{width:11px;height:11px;border-radius:50%;display:inline-block;}
.status{font-size:14px;color:var(--text);min-height:20px;}
.status .err{color:var(--error);font-weight:700;}
</style>
</head>
<body data-page="12" data-total="16">
<div id="stage">
  <h1>模拟训练 AdaBoosting 模型</h1>
  <p class="lead">数据呈异或分布，任何单个决策树桩都分不对全部样本。拖动阈值、选择切分轴与方向，观察加权错误率如何决定这一轮分类器的权重 α，再确认提交看样本权重与集成边界如何变化。</p>

  <div class="body">
    <div class="world">
      <div class="panel" style="flex:1;min-height:0;display:flex;flex-direction:column;">
        <div class="plot-wrap min0" id="plotWrap">
          <canvas id="plot" class="cv-fill"></canvas>
        </div>
      </div>
      <div class="panel">
        <div class="ctl-row">
          <div class="ctl-group">
            <span class="ctl-label">切分轴</span>
            <div class="btns" role="group" aria-label="选择切分轴">
              <button class="btn active" id="axisX" type="button">X 特征</button>
              <button class="btn" id="axisY" type="button">Y 特征</button>
            </div>
          </div>
          <div class="ctl-group">
            <span class="ctl-label">方向</span>
            <div class="btns" role="group" aria-label="选择判定方向">
              <button class="btn active" id="polLeft" type="button">&lt; 阈值 → 蓝</button>
              <button class="btn" id="polRight" type="button">&gt; 阈值 → 蓝</button>
            </div>
          </div>
          <div class="ctl-group">
            <span class="ctl-label">阈值</span>
            <input type="range" id="thresh" min="0" max="100" value="50" step="1">
          </div>
          <div class="readout">
            <div class="item">
              <span class="lbl">加权错误 e</span>
              <span class="num" id="errVal">0.000</span>
            </div>
            <div class="item">
              <span class="lbl">分类器权重 α</span>
              <span class="num" id="alphaVal">0.000</span>
            </div>
          </div>
        </div>
        <div class="ctl-row" style="margin-top:12px;">
          <button class="btn primary" id="commitBtn" type="button">确认本轮分类器</button>
          <button class="btn ghost" id="resetBtn" type="button" style="margin-left:auto;">重置训练</button>
          <span class="status" id="status"></span>
        </div>
      </div>
    </div>

    <div class="side">
      <div class="panel">
        <div style="font-size:16px;font-weight:700;margin-bottom:8px;">训练轮次记录</div>
        <table class="hist" id="histTable">
          <thead><tr><th>轮</th><th>轴/方向</th><th>阈值</th><th>e</th><th>α</th></tr></thead>
          <tbody id="histBody"></tbody>
        </table>
        <div class="legend">
          <span class="li"><span class="sw" style="background:var(--correct)"></span>+1 类（正确判定）</span>
          <span class="li"><span class="sw" style="background:var(--weak)"></span>-1 类（正确判定）</span>
          <span class="li"><span class="sw" style="background:var(--error)"></span>被本轮误分类</span>
        </div>
      </div>
      <div class="panel" style="flex:1;min-height:0;display:flex;flex-direction:column;">
        <div style="font-size:16px;font-weight:700;">集成模型累计准确率</div>
        <div class="acc-canvas-wrap min0"><canvas id="accChart" class="cv-fill"></canvas></div>
        <div class="note" id="noteBox">点越大代表样本当前权重越高——异或结构下，单一轮次无法覆盖所有样本，点会在错分后变大，逼迫下一轮分类器去关注它们。</div>
      </div>
    </div>
  </div>
</div>
<script src="assets/base.js"></script>
<script>
(function(){
  "use strict";

  // ---------- canonical data ----------
  // XOR-pattern dataset in [0,10]x[0,10]; label +1 or -1.
  const RAW = [
    [2,2,1],[3,3,1],[1.3,3.4,1],[2.4,1.2,1],[3.6,2.1,1],
    [8,8,1],[7,7,1],[9,7,1],[8.6,9,1],[7.2,8.6,1],
    [2,8,-1],[3,7,-1],[1.3,6.8,-1],[3.4,8.6,-1],[1.6,7.6,-1],
    [8,2,-1],[7,3,-1],[9,3,-1],[8.6,1.2,-1],[7.2,1.6,-1]
  ];
  const N = RAW.length;
  const MAX_ROUNDS = 6;

  function createInitialState(){
    return {
      axis: 'x',          // 'x' or 'y'
      pol: 'left',        // 'left': value<thresh -> +1 ; 'right': value>thresh -> +1
      thresh: 5.0,        // in data units [0,10]
      weights: new Array(N).fill(1/N),
      round: 1,
      history: [],        // {axis,pol,thresh,err,alpha}
      ensemble: [],        // committed stumps for ensemble decision
      done: false
    };
  }
  let state = createInitialState();

  // ---------- model functions ----------
  function stumpPredict(axis, pol, thresh, p){
    const v = axis === 'x' ? p[0] : p[1];
    const leftIsPos = pol === 'left';
    const isLeft = v < thresh;
    return (isLeft === leftIsPos) ? 1 : -1;
  }
  function weightedError(axis, pol, thresh, weights){
    let e = 0;
    for(let i=0;i<N;i++){
      const pred = stumpPredict(axis, pol, thresh, RAW[i]);
      if(pred !== RAW[i][2]) e += weights[i];
    }
    return e;
  }
  function computeAlpha(e){
    const eps = 1e-6;
    const ec = Math.min(Math.max(e, eps), 1-eps);
    return 0.5 * Math.log((1-ec)/ec);
  }
  function updateWeights(weights, axis, pol, thresh, alpha){
    const next = new Array(N);
    let sum = 0;
    for(let i=0;i<N;i++){
      const pred = stumpPredict(axis, pol, thresh, RAW[i]);
      const y = RAW[i][2];
      const w = weights[i] * Math.exp(-alpha * y * pred);
      next[i] = w;
      sum += w;
    }
    for(let i=0;i<N;i++) next[i] /= sum;
    return next;
  }
  function ensemblePredict(ensemble, p){
    let s = 0;
    for(const stump of ensemble){
      s += stump.alpha * stumpPredict(stump.axis, stump.pol, stump.thresh, p);
    }
    return s >= 0 ? 1 : -1;
  }
  function ensembleAccuracy(ensemble){
    if(ensemble.length===0) return null;
    let correct = 0;
    for(let i=0;i<N;i++) if(ensemblePredict(ensemble, RAW[i]) === RAW[i][2]) correct++;
    return correct / N;
  }

  // ---------- derived (live, pre-commit) evidence ----------
  function liveEvidence(){
    const e = weightedError(state.axis, state.pol, state.thresh, state.weights);
    const alpha = computeAlpha(e);
    return { e, alpha };
  }

  // ---------- DOM refs ----------
  const axisXBtn = document.getElementById('axisX');
  const axisYBtn = document.getElementById('axisY');
  const polLeftBtn = document.getElementById('polLeft');
  const polRightBtn = document.getElementById('polRight');
  const threshInput = document.getElementById('thresh');
  const errVal = document.getElementById('errVal');
  const alphaVal = document.getElementById('alphaVal');
  const commitBtn = document.getElementById('commitBtn');
  const resetBtn = document.getElementById('resetBtn');
  const statusEl = document.getElementById('status');
  const histBody = document.getElementById('histBody');
  const noteBox = document.getElementById('noteBox');

  function threshFromSlider(v){ return (v/100)*10; }
  function sliderFromThresh(t){ return Math.round((t/10)*100); }

  // ---------- rendering: main plot ----------
  const plotCv = document.getElementById('plot');
  const plotCtx = Deck.fit(plotCv);
  const PAD = 46;

  function dataToPlot(px, py, w, h){
    // data coords [0,10]x[0,10] -> plot pixel, y flipped
    const x = PAD + (px/10) * (w - 2*PAD);
    const y = (h - PAD) - (py/10) * (h - 2*PAD);
    return [x,y];
  }

  function drawPlot(){
    const w = plotCv.clientWidth, h = plotCv.clientHeight;
    const ctx = plotCtx;
    ctx.clearRect(0,0,w,h);

    // background ensemble decision region (only after >=1 committed stump)
    if(state.ensemble.length > 0){
      const cell = 8;
      for(let gx=PAD; gx<w-PAD; gx+=cell){
        for(let gy=PAD; gy<h-PAD; gy+=cell){
          const dx = ((gx-PAD)/(w-2*PAD))*10;
          const dy = ((h-PAD-gy)/(h-2*PAD))*10;
          const pred = ensemblePredict(state.ensemble, [dx,dy]);
          ctx.fillStyle = pred === 1 ? 'rgba(41,78,134,0.08)' : 'rgba(97,124,168,0.10)';
          ctx.fillRect(gx,gy,cell,cell);
        }
      }
    }

    // axes
    ctx.strokeStyle = Deck.token('--line');
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(PAD, h-PAD); ctx.lineTo(w-PAD, h-PAD);
    ctx.moveTo(PAD, PAD); ctx.lineTo(PAD, h-PAD);
    ctx.stroke();
    ctx.fillStyle = Deck.token('--muted');
    ctx.font = '12px ' + Deck.token('--font-mono');
    ctx.textAlign = 'center';
    ctx.fillText('特征 X', w/2, h-14);
    ctx.save();
    ctx.translate(16, h/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText('特征 Y', 0, 0);
    ctx.restore();

    // current threshold line (live, pre-commit)
    const t = state.thresh;
    ctx.strokeStyle = Deck.token('--weight');
    ctx.lineWidth = 2;
    ctx.setLineDash([6,5]);
    ctx.beginPath();
    if(state.axis === 'x'){
      const [x1,y1] = dataToPlot(t, 0, w, h);
      const [x2,y2] = dataToPlot(t, 10, w, h);
      ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    } else {
      const [x1,y1] = dataToPlot(0, t, w, h);
      const [x2,y2] = dataToPlot(10, t, w, h);
      ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // committed stump lines (faint, history)
    ctx.lineWidth = 1;
    state.ensemble.forEach((s)=>{
      ctx.strokeStyle = 'rgba(22,78,155,0.35)';
      ctx.beginPath();
      if(s.axis === 'x'){
        const [x1,y1] = dataToPlot(s.thresh, 0, w, h);
        const [x2,y2] = dataToPlot(s.thresh, 10, w, h);
        ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
      } else {
        const [x1,y1] = dataToPlot(0, s.thresh, w, h);
        const [x2,y2] = dataToPlot(10, s.thresh, w, h);
        ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
      }
      ctx.stroke();
    });

    // points: size by weight, color by class, ring if misclassified by live stump
    const maxW = Math.max(...state.weights);
    RAW.forEach((p,i)=>{
      const [x,y] = dataToPlot(p[0], p[1], w, h);
      const wRatio = state.weights[i] / maxW;
      const r = 6 + wRatio * 12;
      const pred = stumpPredict(state.axis, state.pol, state.thresh, p);
      const wrong = pred !== p[2];
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle = p[2] === 1 ? Deck.token('--correct') : Deck.token('--weak');
      ctx.fill();
      if(wrong){
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = Deck.token('--error');
        ctx.stroke();
      }
    });
  }

  // ---------- rendering: accuracy history chart ----------
  const accCv = document.getElementById('accChart');
  const accCtx = Deck.fit(accCv);
  function drawAcc(){
    const w = accCv.clientWidth, h = accCv.clientHeight;
    const ctx = accCtx;
    ctx.clearRect(0,0,w,h);
    const padL = 34, padR = 10, padT = 10, padB = 20;
    ctx.strokeStyle = Deck.token('--line');
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, h-padB); ctx.lineTo(w-padR, h-padB);
    ctx.moveTo(padL, padT); ctx.lineTo(padL, h-padB);
    ctx.stroke();
    ctx.fillStyle = Deck.token('--muted');
    ctx.font = '11px ' + Deck.token('--font-mono');
    ctx.textAlign = 'right';
    ctx.fillText('100%', padL-4, padT+8);
    ctx.fillText('50%', padL-4, h-padB - 0.5*(h-padB-padT) + 4);

    const accs = state.history.map((_,idx)=> ensembleAccuracy(state.ensemble.slice(0, idx+1)) );
    if(accs.length === 0){
      ctx.fillStyle = Deck.token('--muted');
      ctx.textAlign = 'left';
      ctx.font = '13px ' + Deck.token('--font-sans');
      ctx.fillText('确认第一轮分类器后开始记录', padL, (padT+h-padB)/2);
      return;
    }
    const n = accs.length;
    const plotW = w - padL - padR;
    const stepX = n > 1 ? plotW/(n-1) : 0;
    function yFor(a){ return (h-padB) - a * (h-padB-padT); }
    ctx.strokeStyle = Deck.token('--weight');
    ctx.lineWidth = 2;
    ctx.beginPath();
    accs.forEach((a,idx)=>{
      const x = padL + (n>1 ? idx*stepX : plotW/2);
      const y = yFor(a);
      if(idx===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
    accs.forEach((a,idx)=>{
      const x = padL + (n>1 ? idx*stepX : plotW/2);
      const y = yFor(a);
      ctx.beginPath();
      ctx.arc(x,y,3.5,0,Math.PI*2);
      ctx.fillStyle = Deck.token('--weight');
      ctx.fill();
    });
    ctx.fillStyle = Deck.token('--text');
    ctx.font = '12px ' + Deck.token('--font-mono');
    ctx.textAlign = 'center';
    ctx.fillText((accs[n-1]*100).toFixed(0)+'%', padL + (n>1?(n-1)*stepX:plotW/2), yFor(accs[n-1]) - 10);
  }

  // ---------- render controls & readouts ----------
  function renderControls(){
    axisXBtn.classList.toggle('active', state.axis==='x');
    axisYBtn.classList.toggle('active', state.axis==='y');
    polLeftBtn.classList.toggle('active', state.pol==='left');
    polRightBtn.classList.toggle('active', state.pol==='right');
    threshInput.value = sliderFromThresh(state.thresh);

    const {e, alpha} = liveEvidence();
    errVal.textContent = e.toFixed(3);
    alphaVal.textContent = alpha.toFixed(3);
    errVal.parentElement.querySelector('.num').style.color = e > 0.5 ? 'var(--error)' : 'var(--weight)';

    const roundDone = state.round > MAX_ROUNDS;
    commitBtn.disabled = roundDone;
    commitBtn.textContent = roundDone ? '训练已完成 ' + MAX_ROUNDS + ' 轮' : '确认第 ' + state.round + ' 轮分类器';

    if(roundDone){
      const finalAcc = ensembleAccuracy(state.ensemble);
      statusEl.innerHTML = '集成模型在全部 ' + N + ' 个样本上的准确率为 <b>' + (finalAcc*100).toFixed(0) + '%</b>。';
      noteBox.textContent = '异或结构需要至少两个不同轴向的树桩才能分开全部样本；单轮弱分类器的加权错误始终接近或高于随机猜测的水平，但加权投票后集成边界能覆盖单个树桩覆盖不到的区域。';
    } else if(e >= 0.5){
      statusEl.innerHTML = '<span class="err">加权错误 e ≥ 0.5</span>，这一分类器不比随机猜测好，α 会变为 0 或负值，调整方向或阈值。';
      noteBox.textContent = '当前切分把大多数高权重样本分错了。尝试切换方向按钮，或把阈值移到另一半样本上。';
    } else {
      statusEl.textContent = '调整切分轴、方向与阈值，使加权错误 e 更小，α 更大，再确认提交本轮。';
    }
  }

  function renderHistory(){
    histBody.innerHTML = '';
    state.history.forEach((h, idx)=>{
      const tr = document.createElement('tr');
      const axisLabel = (h.axis==='x'?'X':'Y') + ' / ' + (h.pol==='left'?'<':'>');
      tr.innerHTML = '<td>'+(idx+1)+'</td><td>'+axisLabel+'</td><td>'+h.thresh.toFixed(1)+'</td>'+
        '<td>'+h.err.toFixed(3)+'</td><td>'+h.alpha.toFixed(3)+'</td>';
      histBody.appendChild(tr);
    });
  }

  function renderAll(){
    drawPlot();
    drawAcc();
    renderControls();
    renderHistory();
  }

  // ---------- dispatch ----------
  function dispatch(action){
    if(action.type === 'RESET'){
      state = createInitialState();
      return renderAll();
    }
    if(state.round > MAX_ROUNDS && action.type !== 'RESET') return; // locked
    if(action.type === 'AXIS'){ state.axis = action.axis; return renderAll(); }
    if(action.type === 'POL'){ state.pol = action.pol; return renderAll(); }
    if(action.type === 'THRESH'){ state.thresh = action.value; return renderAll(); }
    if(action.type === 'COMMIT'){
      const {e, alpha} = liveEvidence();
      state.weights = updateWeights(state.weights, state.axis, state.pol, state.thresh, alpha);
      state.ensemble.push({axis: state.axis, pol: state.pol, thresh: state.thresh, alpha});
      state.history.push({axis: state.axis, pol: state.pol, thresh: state.thresh, err: e, alpha});
      state.round += 1;
      return renderAll();
    }
  }

  axisXBtn.addEventListener('click', ()=> dispatch({type:'AXIS', axis:'x'}));
  axisYBtn.addEventListener('click', ()=> dispatch({type:'AXIS', axis:'y'}));
  polLeftBtn.addEventListener('click', ()=> dispatch({type:'POL', pol:'left'}));
  polRightBtn.addEventListener('click', ()=> dispatch({type:'POL', pol:'right'}));
  threshInput.addEventListener('input', (e)=> dispatch({type:'THRESH', value: threshFromSlider(+e.target.value)}));
  commitBtn.addEventListener('click', ()=> dispatch({type:'COMMIT'}));
  resetBtn.addEventListener('click', ()=> dispatch({type:'RESET'}));

  Deck.onResize(renderAll);
  Deck.init({ index:12, total:16 });
  renderAll();
})();
</script>
</body>
</html>
