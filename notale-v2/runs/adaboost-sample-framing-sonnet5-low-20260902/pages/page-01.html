<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>AdaBoosting 算法</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root{
    --bg:#EEF1F5;
    --text:#111820;
    --font-sans:"Noto Sans CJK SC",ui-sans-serif,system-ui,sans-serif;
  }
  #stage{ position:relative; overflow:hidden; background:var(--bg); }
  #net{ position:absolute; inset:0; }
  .titlebox{
    position:absolute;
    left:56px; top:0; bottom:0;
    width:640px;
    display:flex; flex-direction:column; justify-content:center;
    pointer-events:none;
  }
  .titlebox h1{
    font-family:"Clear Sans","Noto Sans CJK SC",ui-sans-serif,sans-serif;
    font-size:64px;
    line-height:1.14;
    font-weight:700;
    color:var(--text);
    margin:0 0 20px 0;
    letter-spacing:.5px;
  }
  .titlebox h1 em{
    font-style:normal;
    color:var(--weight);
  }
  .titlebox .rule{
    width:64px; height:4px; background:var(--weight); margin:0 0 22px 0;
  }
  .titlebox p.dek{
    font-size:22px;
    line-height:1.55;
    color:var(--muted);
    margin:0;
    max-width:520px;
  }
  .titlebox p.dek strong{
    color:var(--text);
    font-weight:700;
  }
  .legend{
    position:absolute;
    left:56px; bottom:56px;
    display:flex; gap:28px;
    font-family:var(--font-mono);
    font-size:14px;
    color:var(--muted);
    pointer-events:none;
  }
  .legend .li{ display:flex; align-items:center; gap:8px; }
  .legend .sw{ width:20px; height:3px; border-radius:2px; display:inline-block; }
</style>
</head>
<body data-page="01" data-total="16">
<div id="stage" tabindex="0" aria-label="AdaBoost 算法标题页：多条弱分类线围绕一组样本点漂移，误分样本权重增大后，弱分类线逐渐收敛成一条加权组合的强分类边界。">
  <canvas id="net" class="cv-fill no-pan" aria-hidden="true"></canvas>
  <div class="titlebox">
    <h1>Ada<em>Boost</em><br>算法</h1>
    <div class="rule"></div>
    <p class="dek">让一群<strong>只比瞎猜强一点</strong>的弱分类器，靠反复关注被分错的样本，一轮轮叠加投票权重，合成一个<strong>足够强</strong>的分类器。</p>
  </div>
  <div class="legend" aria-hidden="true">
    <span class="li"><i class="sw" style="background:var(--weak)"></i>弱分类器</span>
    <span class="li"><i class="sw" style="background:var(--error)"></i>当前错分样本</span>
    <span class="li"><i class="sw" style="background:var(--weight)"></i>加权合成边界</span>
  </div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
(() => {
  "use strict";

  // 概念规则：一组数据点分两类；多条弱分类线各自随机切分空间，
  // 大多犯错；被反复误分的点权重（半径/亮度）增大，把更多弱分类线的
  // 注意力拉向它们；所有弱线按"表现好坏"加权叠加，逐渐画出一条更贴合
  // 真实分界的粗合成线——用可见的收敛过程演绎 AdaBoost 的核心机制。
  const CONFIG = Object.freeze({
    seed: "adaboost-cover-v1",
    pointCount: 46,
    weakCount: 7,
    cycleMs: 5400,      // 一轮"新弱分类器登场→评估→并入合成线"的周期
    driftSpeed: .10
  });

  const stage = document.querySelector("#stage");
  const canvas = document.querySelector("#net");
  const reducedMotion = Deck.reduced();
  const random = (typeof Math.seedrandom === "function")
    ? new Math.seedrandom(CONFIG.seed)
    : Math.random;

  let ctx, W = 1600, H = 900;
  let points = [];      // {x,y,label,weight}
  let weakClf = [];     // {a,b,c, sign, alpha, bornAt}  ax+by+c=0, sign 决定正类在哪一侧
  let clock = 0;
  let stopLoop = () => {};
  let removeResize = () => {};
  let disposed = false;

  const weakColor = () => Deck.rgb("weak");
  const errColor = () => Deck.rgb("error");
  const weightColor = () => Deck.rgb("weight");
  const correctColor = () => Deck.rgb("correct");
  const lineColor = () => Deck.rgb("line");

  // 标题排斥场：左侧 56..696, 全高 用于降低该区域密度
  function titleField(x, y) {
    if (x > 760) return 1;
    const dx = Math.max(0, 760 - x) / 760;
    return Deck.clamp(1 - dx * .94, .06, 1);
  }

  function trueBoundary(x) {
    // 真实分界：一条轻微弯曲的曲线，作为生成标签的依据
    return 470 + 90 * Math.sin(x / 260) - (x - 900) * .10;
  }

  function resetModel() {
    points = [];
    const cx0 = 860, cx1 = 1560;
    for (let i = 0; i < CONFIG.pointCount; i++) {
      const x = cx0 + random() * (cx1 - cx0);
      const y = 140 + random() * 620;
      const label = y < trueBoundary(x) ? 1 : -1;
      points.push({ x, y, label, weight: 1 / CONFIG.pointCount, err: 0 });
    }
    weakClf = [];
    clock = 0;
    for (let i = 0; i < CONFIG.weakCount; i++) {
      spawnWeak(-CONFIG.cycleMs * (CONFIG.weakCount - i) * .55);
    }
  }

  function spawnWeak(bornAt) {
    // 随机方向的一条分割直线：法向 (a,b)，偏移 c
    const angle = random() * Math.PI;
    const a = Math.cos(angle), b = Math.sin(angle);
    const cx = 900 + random() * 620, cy = 180 + random() * 560;
    const c = -(a * cx + b * cy);
    const sign = random() < .5 ? 1 : -1;
    weakClf.push({ a, b, c, sign, cx, cy, angle, bornAt, alpha: 0 });
    if (weakClf.length > CONFIG.weakCount) weakClf.shift();
  }

  function classify(clf, x, y) {
    const v = clf.a * x + clf.b * y + clf.c;
    return (v >= 0 ? 1 : -1) * clf.sign;
  }

  function updateWeightsAndAlpha() {
    // 依据当前权重评估每条弱分类线的加权错误率，得到 alpha（表现越好权重越大）
    const totalW = points.reduce((s, p) => s + p.weight, 0) || 1;
    for (const p of points) p.weight /= totalW;

    for (const clf of weakClf) {
      let errW = 0;
      for (const p of points) {
        if (classify(clf, p.x, p.y) !== p.label) errW += p.weight;
      }
      errW = Deck.clamp(errW, .02, .92);
      clf.alpha = .5 * Math.log((1 - errW) / errW);
      clf.errW = errW;
    }

    // 用最新一条弱线的表现更新样本权重：错分的点权重上升
    const latest = weakClf[weakClf.length - 1];
    if (latest) {
      for (const p of points) {
        const wrong = classify(latest, p.x, p.y) !== p.label;
        p.err = wrong ? Math.min(1, p.err + .34) : Math.max(0, p.err - .12);
        if (wrong) p.weight *= Math.exp(latest.alpha);
      }
    }
  }

  function combinedScore(x, y) {
    let s = 0, wsum = 0;
    for (const clf of weakClf) {
      s += clf.alpha * classify(clf, x, y);
      wsum += Math.abs(clf.alpha);
    }
    return wsum > 0 ? s / wsum : 0;
  }

  function drawWeakLine(clf, alphaVis) {
    const len = 1200;
    const dx = -clf.b, dy = clf.a;
    const x1 = clf.cx - dx * len, y1 = clf.cy - dy * len;
    const x2 = clf.cx + dx * len, y2 = clf.cy + dy * len;
    const col = weakColor();
    const density = titleField(clf.cx, clf.cy);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${.22 * alphaVis * density})`;
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }

  function drawCombinedBoundary() {
    // 扫描 x，为每个 x 找到 combinedScore 的零交叉 y，画出合成边界
    const col = weightColor();
    ctx.beginPath();
    let started = false;
    for (let x = 820; x <= 1580; x += 6) {
      let bestY = null, bestAbs = Infinity;
      for (let y = 120; y <= 800; y += 6) {
        const s = combinedScore(x, y);
        const a = Math.abs(s);
        if (a < bestAbs) { bestAbs = a; bestY = y; }
      }
      if (bestY == null) continue;
      const density = titleField(x, bestY);
      if (density < .12) { started = false; continue; }
      if (!started) { ctx.moveTo(x, bestY); started = true; }
      else ctx.lineTo(x, bestY);
    }
    ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},.85)`;
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.stroke();
  }

  function drawPoints() {
    const cCorrect = correctColor(), cErr = errColor(), lc = lineColor();
    for (const p of points) {
      const density = titleField(p.x, p.y);
      if (density < .1) continue;
      const r = 4 + p.weight * CONFIG.pointCount * 3.2;
      const isErr = p.err > .05;
      const col = isErr ? cErr : cCorrect;
      const alpha = (isErr ? .55 + p.err * .4 : .5) * density;
      ctx.beginPath();
      if (p.label === 1) {
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      } else {
        ctx.rect(p.x - r * .82, p.y - r * .82, r * 1.64, r * 1.64);
      }
      ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(${lc[0]},${lc[1]},${lc[2]},${.5 * density})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function drawFrame() {
    if (!ctx || disposed) return;
    ctx.clearRect(0, 0, W, H);

    for (const clf of weakClf) {
      const age = clock - clf.bornAt;
      const fadeIn = Deck.clamp(age / 900, 0, 1);
      drawWeakLine(clf, fadeIn);
    }
    drawCombinedBoundary();
    drawPoints();
  }

  function tick(_t, dt) {
    clock = reducedMotion ? CONFIG.cycleMs * CONFIG.weakCount : clock + Math.min(dt, 50);
    if (!reducedMotion) {
      // 缓慢漂移弱分类线角度，制造"仍在调整"的动态
      for (const clf of weakClf) {
        clf.angle += CONFIG.driftSpeed * .0016 * Math.min(dt, 50);
        clf.a = Math.cos(clf.angle);
        clf.b = Math.sin(clf.angle);
        clf.c = -(clf.a * clf.cx + clf.b * clf.cy);
      }
      const last = weakClf[weakClf.length - 1];
      if (clock - last.bornAt > CONFIG.cycleMs) spawnWeak(clock);
    }
    updateWeightsAndAlpha();
    drawFrame();
  }

  function dispose() {
    if (disposed) return;
    disposed = true;
    stopLoop();
    removeResize();
  }
  window.addEventListener("pagehide", dispose, { once:true });

  Deck.init({ keys:false });
  ctx = Deck.fit(canvas);
  W = Deck.W; H = Deck.H;
  resetModel();
  updateWeightsAndAlpha();
  drawFrame();

  removeResize = Deck.onResize(() => {
    if (disposed) return;
    ctx = Deck.fit(canvas);
    W = Deck.W; H = Deck.H;
    drawFrame();
  });
  stopLoop = Deck.loop(tick, { still: CONFIG.cycleMs * CONFIG.weakCount });
})();
</script>
</body>
</html>
