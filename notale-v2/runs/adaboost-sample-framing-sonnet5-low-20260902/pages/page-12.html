<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>模拟训练 AdaBoost 模型</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root{
    --bg:#EEF1F5; --text:#111820; --font-sans:"Noto Sans CJK SC",ui-sans-serif,system-ui,sans-serif;
  }
  #stage{
    width:1600px; height:900px; padding:28px 56px; box-sizing:border-box;
    display:flex; flex-direction:column; gap:16px;
    font-family:var(--font-sans); color:var(--text);
  }
  h1{
    font-family:"Clear Sans","Noto Sans CJK SC",sans-serif;
    font-size:34px; font-weight:700; margin:0; line-height:1.2;
  }
  .lead{ font-size:18px; color:var(--muted); margin:4px 0 0; max-width:1100px; }

  .body{ flex:1; min-height:0; display:flex; gap:20px; }
  .left{ width:520px; flex:none; display:flex; flex-direction:column; gap:14px; min-height:0; }
  .right{ flex:1; min-width:0; display:flex; flex-direction:column; gap:12px; }

  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:4px;
    padding:16px 18px;
  }
  .panel h2{ font-size:20px; margin:0 0 10px; font-weight:700; }

  .ctl-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .btn{
    font-family:var(--font-sans); font-size:15px; font-weight:600;
    background:var(--weight); color:#fff; border:none; border-radius:2px;
    padding:10px 18px; cursor:pointer;
  }
  .btn:disabled{ background:#B7C2D3; cursor:not-allowed; }
  .btn.ghost{
    background:transparent; color:var(--text); border:1px solid var(--line);
  }

  .round-badge{
    font-family:var(--font-mono); font-size:16px; color:var(--weight); font-weight:700;
  }

  .stat-grid{ display:flex; gap:0; }
  .stat{ flex:1; padding:8px 10px; border-right:1px solid var(--line); }
  .stat:last-child{ border-right:none; }
  .stat .lbl{ font-size:13px; color:var(--muted); margin-bottom:4px; }
  .stat .val{ font-family:var(--font-mono); font-size:22px; font-weight:700; color:var(--text); }
  .stat .val.err{ color:var(--error); }
  .stat .val.wt{ color:var(--weight); }

  .history{ flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .hist-row{
    display:flex; align-items:center; gap:8px; font-size:14px; padding:6px 8px;
    border-bottom:1px solid var(--line); font-family:var(--font-mono);
  }
  .hist-row .idx{ color:var(--muted); width:16px; }
  .hist-row .rule{ flex:1; color:var(--text); }
  .hist-row .a{ color:var(--weight); font-weight:700; }

  .legend{ display:flex; gap:18px; flex-wrap:wrap; font-size:14px; color:var(--muted); }
  .legend .li{ display:flex; align-items:center; gap:6px; }
  .legend .sw{ width:12px; height:12px; border-radius:50%; display:inline-block; }

  .stage-evidence{ flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; }
  .board-wrap{ flex:1; min-height:0; position:relative; background:var(--surface); border:1px solid var(--line); border-radius:4px; }
  .note{ font-size:14px; color:var(--muted); }

  .err-chart-wrap{ height:170px; background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:8px 12px; box-sizing:border-box; }
  .err-chart-wrap h2{ font-size:15px; margin:0 0 2px; font-weight:700; }
  #errChart{ width:100%; height:128px; }
</style>
</head>
<body data-page="12" data-total="16">
<div id="stage">
  <div>
    <h1>模拟训练 AdaBoost 模型</h1>
    <p class="lead">12 个样本分成两类。每一轮从候选分割线中选出加权错误率最小的弱分类器，用它的准确率算出分类器权重 α，再重新分配样本权重——错分的样本权重上升，下一轮的分割线会因此改变。</p>
  </div>

  <div class="body">
    <div class="left">
      <div class="panel">
        <h2>第 <span class="round-badge" id="roundNum">1</span> 轮</h2>
        <div class="ctl-row">
          <button class="btn" id="stepBtn">训练这一轮</button>
          <button class="btn ghost" id="resetBtn">重置</button>
        </div>
        <div class="stat-grid" style="margin-top:14px;">
          <div class="stat">
            <div class="lbl">本轮加权错误率 ε</div>
            <div class="val err" id="epsVal">—</div>
          </div>
          <div class="stat">
            <div class="lbl">分类器权重 α</div>
            <div class="val wt" id="alphaVal">—</div>
          </div>
          <div class="stat">
            <div class="lbl">强分类器训练误差</div>
            <div class="val" id="ensembleErr">100%</div>
          </div>
        </div>
      </div>

      <div class="panel" style="flex:1; min-height:0; display:flex; flex-direction:column;">
        <h2>已选弱分类器</h2>
        <div class="history" id="history"></div>
      </div>

      <div class="legend">
        <span class="li"><span class="sw" style="background:var(--correct); border-radius:50%"></span>正类样本(圆)</span>
        <span class="li"><span class="sw" style="background:var(--weak); border-radius:2px"></span>负类样本(方)</span>
        <span class="li"><span class="sw" style="background:var(--error)"></span>当前被错分</span>
      </div>
    </div>

    <div class="right">
      <div class="stage-evidence">
        <div class="board-wrap">
          <canvas class="cv-fill" id="board"></canvas>
        </div>
        <p class="note" id="boardNote">点越大代表这个样本当前的权重越高——它对下一轮分割线的选择影响越大。</p>
      </div>

      <div class="err-chart-wrap">
        <h2>强分类器训练误差 · 逐轮下降</h2>
        <div id="errChart"></div>
      </div>
    </div>
  </div>
</div>

<script src="assets/base.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(() => {
  "use strict";

  // ---------- 数据：12 个二维样本，标签 +1 / -1，非线性可分 ----------
  const POINTS = [
    { x: 1.0, y: 1.0, y_: +1 },
    { x: 1.6, y: 2.4, y_: +1 },
    { x: 2.2, y: 1.2, y_: +1 },
    { x: 2.8, y: 3.0, y_: +1 },
    { x: 1.2, y: 3.6, y_: +1 },
    { x: 3.4, y: 1.6, y_: +1 },
    { x: 4.4, y: 4.2, y_: -1 },
    { x: 5.2, y: 2.8, y_: -1 },
    { x: 4.0, y: 3.4, y_: -1 },
    { x: 5.6, y: 4.6, y_: -1 },
    { x: 4.8, y: 1.0, y_: -1 },   // 与正类交叠的噪声点
    { x: 3.0, y: 4.4, y_: -1 },
  ];
  const N = POINTS.length;
  const MAX_ROUNDS = 6;

  // ---------- 候选弱分类器：对 x、y 两个维度的阈值分割，两个方向 ----------
  function buildStumps() {
    const stumps = [];
    ["x", "y"].forEach(dim => {
      const vals = [...new Set(POINTS.map(p => p[dim]))].sort((a, b) => a - b);
      const thresholds = [];
      for (let i = 0; i < vals.length - 1; i++) thresholds.push((vals[i] + vals[i + 1]) / 2);
      thresholds.push(vals[0] - 0.5, vals[vals.length - 1] + 0.5);
      thresholds.forEach(t => {
        [1, -1].forEach(dir => {
          stumps.push({ dim, t, dir }); // dir=1: value>=t 判 +1；dir=-1: value>=t 判 -1
        });
      });
    });
    return stumps;
  }
  const STUMPS = buildStumps();

  function predictStump(stump, p) {
    const v = p[stump.dim];
    const above = v >= stump.t;
    return above ? stump.dir : -stump.dir;
  }

  // ---------- 规范状态 ----------
  function createInitialState() {
    return {
      round: 0,                       // 已完成轮数
      weights: new Array(N).fill(1 / N),
      history: [],                    // { stump, eps, alpha, wasCorrect:[bool] }
    };
  }
  let state = createInitialState();

  // 用历史里的弱分类器 + alpha 算强分类器在某点上的输出符号
  function ensemblePredict(history, p) {
    let s = 0;
    history.forEach(h => { s += h.alpha * predictStump(h.stump, p); });
    return s >= 0 ? 1 : -1;
  }

  function ensembleTrainError(history) {
    if (!history.length) return 1;
    let wrong = 0;
    POINTS.forEach(p => { if (ensemblePredict(history, p) !== p.y_) wrong++; });
    return wrong / N;
  }

  // 执行一轮：在当前权重下选出加权错误率最小的 stump，计算 alpha，更新权重
  function runRound() {
    if (state.round >= MAX_ROUNDS) return;
    let best = null;
    STUMPS.forEach(stump => {
      let err = 0;
      POINTS.forEach((p, i) => {
        if (predictStump(stump, p) !== p.y_) err += state.weights[i];
      });
      if (!best || err < best.eps) best = { stump, eps: err };
    });
    // 避免 eps=0 或 eps=1 导致 alpha 发散，做数值保护
    const eps = Math.min(Math.max(best.eps, 1e-6), 1 - 1e-6);
    const alpha = 0.5 * Math.log((1 - eps) / eps);

    const wasCorrect = POINTS.map(p => predictStump(best.stump, p) === p.y_);
    const newWeights = state.weights.map((w, i) => {
      const factor = wasCorrect[i] ? Math.exp(-alpha) : Math.exp(alpha);
      return w * factor;
    });
    const z = newWeights.reduce((a, b) => a + b, 0);
    state.weights = newWeights.map(w => w / z);

    state.history.push({ stump: best.stump, eps, alpha, wasCorrect });
    state.round += 1;

    render();
  }

  function resetAll() {
    state = createInitialState();
    render();
  }

  // ---------- 画板：Canvas ----------
  const DATA_MIN = 0, DATA_MAX = 6;
  const cv = document.getElementById("board");
  let fit = null;

  function dataToLocal(x, y, w, h) {
    const pad = 36;
    const sx = (w - 2 * pad) / (DATA_MAX - DATA_MIN);
    const sy = (h - 2 * pad) / (DATA_MAX - DATA_MIN);
    return { x: pad + (x - DATA_MIN) * sx, y: h - pad - (y - DATA_MIN) * sy, sx, sy, pad };
  }

  function drawBoard(ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    const pad = 36;

    // 坐标边框
    ctx.strokeStyle = Deck.token("line");
    ctx.lineWidth = 1;
    ctx.strokeRect(pad, pad, w - 2 * pad, h - 2 * pad);

    // 累积强分类器的决策区域：网格采样着色
    if (state.history.length) {
      const step = 0.12;
      for (let gx = DATA_MIN; gx < DATA_MAX; gx += step) {
        for (let gy = DATA_MIN; gy < DATA_MAX; gy += step) {
          const pred = ensemblePredict(state.history, { x: gx + step / 2, y: gy + step / 2 });
          const p0 = dataToLocal(gx, gy, w, h);
          const p1 = dataToLocal(gx + step, gy + step, w, h);
          ctx.fillStyle = pred === 1
            ? "rgba(41,78,134,0.08)"
            : "rgba(97,124,168,0.10)";
          ctx.fillRect(p0.x, p1.y, p1.x - p0.x, p0.y - p1.y);
        }
      }
    }

    // 当前轮选出的分割线（若已训练过至少一轮，画最新一条，突出显示）
    if (state.history.length) {
      const last = state.history[state.history.length - 1];
      const { stump } = last;
      ctx.strokeStyle = Deck.token("weight");
      ctx.lineWidth = 2.5;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      if (stump.dim === "x") {
        const a = dataToLocal(stump.t, DATA_MIN, w, h);
        const b = dataToLocal(stump.t, DATA_MAX, w, h);
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      } else {
        const a = dataToLocal(DATA_MIN, stump.t, w, h);
        const b = dataToLocal(DATA_MAX, stump.t, w, h);
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 样本点：半径按当前权重映射，颜色按真实类别，若上一轮错分描红边框
    const maxW = Math.max(...state.weights);
    const minW = Math.min(...state.weights);
    const lastWrong = state.history.length
      ? state.history[state.history.length - 1].wasCorrect.map(c => !c)
      : new Array(N).fill(false);

    POINTS.forEach((p, i) => {
      const { x, y } = dataToLocal(p.x, p.y, w, h);
      const norm = maxW > minW ? (state.weights[i] - minW) / (maxW - minW) : 0.5;
      const r = 9 + norm * 16;
      ctx.fillStyle = p.y_ === 1 ? Deck.token("correct") : Deck.token("weak");
      if (p.y_ === 1) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(x - r * 0.85, y - r * 0.85, r * 1.7, r * 1.7);
      }
      if (lastWrong[i]) {
        ctx.lineWidth = 3;
        ctx.strokeStyle = Deck.token("error");
        if (p.y_ === 1) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); }
        else ctx.strokeRect(x - r * 0.85, y - r * 0.85, r * 1.7, r * 1.7);
      }
    });
  }

  // ---------- ECharts：训练误差曲线 ----------
  let chart = null;
  function initChart() {
    chart = echarts.init(document.getElementById("errChart"), null, { renderer: "svg" });
  }
  function renderChart() {
    const rounds = [0, ...state.history.map((_, i) => i + 1)];
    const errs = [1];
    for (let i = 1; i <= state.history.length; i++) {
      errs.push(ensembleTrainError(state.history.slice(0, i)));
    }
    chart.setOption({
      grid: { left: 44, right: 20, top: 16, bottom: 28 },
      xAxis: {
        type: "category", data: rounds,
        name: "轮次", nameLocation: "middle", nameGap: 24,
        axisLabel: { fontSize: 12, color: "#657181" },
        axisLine: { lineStyle: { color: "#C8D0DB" } },
      },
      yAxis: {
        type: "value", min: 0, max: 1,
        axisLabel: { fontSize: 12, color: "#657181", formatter: v => (v * 100).toFixed(0) + "%" },
        splitLine: { lineStyle: { color: "#C8D0DB" } },
      },
      series: [{
        type: "line", data: errs, symbolSize: 7,
        lineStyle: { color: "#164E9B", width: 2.5 },
        itemStyle: { color: "#164E9B" },
      }],
      animationDuration: 260,
    });
  }

  // ---------- 渲染整体 ----------
  function dimName(d) { return d === "x" ? "特征 x" : "特征 y"; }

  function render() {
    document.getElementById("roundNum").textContent = Math.min(state.round + 1, MAX_ROUNDS);
    const last = state.history[state.history.length - 1];
    document.getElementById("epsVal").textContent = last ? (last.eps * 100).toFixed(1) + "%" : "—";
    document.getElementById("alphaVal").textContent = last ? last.alpha.toFixed(3) : "—";
    document.getElementById("ensembleErr").textContent =
      (ensembleTrainError(state.history) * 100).toFixed(1) + "%";

    const stepBtn = document.getElementById("stepBtn");
    if (state.round >= MAX_ROUNDS) {
      stepBtn.disabled = true;
      stepBtn.textContent = "已完成 " + MAX_ROUNDS + " 轮训练";
    } else {
      stepBtn.disabled = false;
      stepBtn.textContent = state.round === 0 ? "训练第 1 轮" : "训练第 " + (state.round + 1) + " 轮";
    }

    const histEl = document.getElementById("history");
    histEl.innerHTML = state.history.map((h, i) => {
      const rule = `${dimName(h.stump.dim)} ${h.stump.dir === 1 ? "≥" : "<"} ${h.stump.t.toFixed(2)} → 正类`;
      return `<div class="hist-row">
        <span class="idx">${i + 1}</span>
        <span class="rule">${rule}　ε=${(h.eps * 100).toFixed(0)}%</span>
        <span class="a">α=${h.alpha.toFixed(2)}</span>
      </div>`;
    }).join("") || `<div class="hist-row"><span class="rule" style="color:var(--muted)">还没有训练任何一轮。点击左上角按钮开始第 1 轮。</span></div>`;
    histEl.scrollTop = histEl.scrollHeight;

    document.getElementById("boardNote").textContent = state.history.length
      ? "虚线是本轮选出的分割线；背景浅色区域是当前累积强分类器的判定结果；红边样本是本轮分类器判错的点，它们在下一轮的权重会升高。"
      : "点越大代表这个样本当前的权重越高——它对下一轮分割线的选择影响越大。";

    if (fit) fit.redraw();
    if (chart) renderChart();
  }

  // ---------- 接线 ----------
  document.getElementById("stepBtn").addEventListener("click", runRound);
  document.getElementById("resetBtn").addEventListener("click", resetAll);

  fit = Deck.autofit(cv, (ctx, w, h) => drawBoard(ctx, w, h));
  initChart();
  Deck.onResize(() => chart && chart.resize());
  render();

  window.addEventListener("pagehide", () => {
    fit && fit.stop();
    chart && chart.dispose();
  }, { once: true });
})();
</script>
</body>
</html>
