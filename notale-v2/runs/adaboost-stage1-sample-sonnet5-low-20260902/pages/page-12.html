<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>模拟训练 AdaBoosting 模型</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{
  --bg:#EEF1F5; --text:#111820;
  --font-sans:"Noto Sans CJK SC",ui-sans-serif,system-ui,sans-serif;
}
#stage{
  padding:28px 56px; box-sizing:border-box;
  display:flex; flex-direction:column; gap:16px;
  font-family:var(--font-sans); color:var(--text);
}
h1{
  font-family:"Clear Sans","Noto Sans CJK SC",sans-serif;
  font-size:32px; font-weight:700; margin:0; letter-spacing:-.01em;
}
.lead{ font-size:16px; color:var(--muted); margin:2px 0 0; line-height:1.4; }
.body{ flex:1; min-height:0; display:flex; gap:20px; }
.left{ flex:0 0 720px; min-height:0; display:flex; flex-direction:column; gap:10px; }
.right{ flex:1; min-width:0; display:flex; flex-direction:column; gap:12px; }

.panel{
  background:#FAFBFC; border:1px solid #C8D0DB;
}
.stage-wrap{ position:relative; flex:1; min-height:0; }
.stage-wrap canvas{ position:absolute; inset:0; width:100%; height:100%; }

.controls{
  display:flex; align-items:center; gap:12px; padding:10px 14px;
  background:#FAFBFC; border:1px solid #C8D0DB;
}
.btn{
  appearance:none; border:1px solid #164E9B; background:#164E9B; color:#fff;
  font-family:var(--font-sans); font-size:15px; font-weight:600;
  padding:9px 18px; cursor:pointer; border-radius:0;
}
.btn:hover{ background:#123f7d; }
.btn:disabled{ background:#B9C3D1; border-color:#B9C3D1; cursor:not-allowed; color:#657181; }
.btn.ghost{ background:transparent; color:#164E9B; }
.btn.ghost:hover{ background:#e5ebf3; }
.round-label{ font-family:var(--font-mono); font-size:15px; color:var(--muted); }
.round-label b{ color:var(--text); font-size:18px; }

.readouts{ display:flex; gap:1px; background:#C8D0DB; border:1px solid #C8D0DB; }
.ro{ flex:1; background:#FAFBFC; padding:12px 14px; }
.ro .rl{ font-size:14px; color:var(--muted); }
.ro .rv{ font-family:var(--font-mono); font-size:25px; font-weight:600; margin-top:2px; }
.ro .ru{ font-size:14px; color:var(--muted); margin-left:3px; }
.ro.err .rv{ color:#C64232; }
.ro.alpha .rv{ color:#164E9B; }
.ro.acc .rv{ color:#294E86; }

.stumps{
  flex:0 0 auto; padding:10px 14px; background:#FAFBFC; border:1px solid #C8D0DB;
  display:flex; flex-direction:column; gap:6px;
}
.stumps .stitle{ font-size:14px; color:var(--muted); }
.stump-list{ display:flex; flex-direction:column; gap:3px; max-height:130px; overflow:auto; }
.stump-row{
  display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:13px;
  padding:3px 6px; border-left:3px solid transparent;
}
.stump-row.active{ background:#EEF1F5; border-left-color:#164E9B; }
.stump-row .sw{ color:var(--muted); width:28px; }
.stump-row .sd{ flex:1; color:var(--text); }
.stump-row .sa{ color:#294E86; font-weight:600; }

.chart-wrap{ flex:0 0 220px; min-height:0; padding:8px 14px 6px; background:#FAFBFC; border:1px solid #C8D0DB; }
.chart-title{ font-size:14px; color:var(--muted); margin-bottom:2px; }
#accChart{ width:100%; height:186px; }

.legend{ display:flex; gap:18px; align-items:center; font-size:14px; color:var(--muted); }
.legend .li{ display:flex; align-items:center; gap:6px; }
.legend .sw{ width:11px; height:11px; border-radius:50%; display:inline-block; }
</style>
</head>
<body data-page="12" data-total="16">
<div id="stage">
  <div>
    <h1>模拟训练 AdaBoosting 模型</h1>
    <p class="lead">每点一次"训练下一轮"，算法就在当前样本权重下挑一个最优决策树桩，计算它的加权错误率、分类器权重 α，再据此更新每个样本的权重。</p>
  </div>

  <div class="body">
    <div class="left">
      <div class="panel stage-wrap">
        <canvas id="mainCanvas"></canvas>
      </div>
      <div class="legend">
        <span class="li"><span class="sw" style="background:#294E86"></span>正类，分类正确</span>
        <span class="li"><span class="sw" style="background:#617CA8"></span>负类，分类正确</span>
        <span class="li"><span class="sw" style="background:#C64232"></span>当前集成判错（气泡越大权重越高）</span>
      </div>
    </div>

    <div class="right">
      <div class="controls">
        <button class="btn" id="stepBtn">训练下一轮弱分类器</button>
        <button class="btn ghost" id="resetBtn">重置</button>
        <span class="round-label">当前轮次 <b id="roundNum">0</b> / 6</span>
      </div>

      <div class="readouts">
        <div class="ro err">
          <div class="rl">本轮加权错误率 ε</div>
          <div class="rv" id="roEps">—</div>
        </div>
        <div class="ro alpha">
          <div class="rl">分类器权重 α</div>
          <div class="rv" id="roAlpha">—</div>
        </div>
        <div class="ro acc">
          <div class="rl">集成训练准确率</div>
          <div class="rv" id="roAcc">—<span class="ru">%</span></div>
        </div>
      </div>

      <div class="stumps">
        <div class="stitle">已加入集成的弱分类器（树桩）</div>
        <div class="stump-list" id="stumpList"></div>
      </div>

      <div class="chart-wrap">
        <div class="chart-title">集成训练准确率随轮次变化</div>
        <canvas id="accChart"></canvas>
      </div>
    </div>
  </div>
</div>

<script src="assets/base.js"></script>
<script>
(() => {
  "use strict";

  // ---------- 数据：16 个点，标签由一个非线性 XOR 型边界决定，单个轴对齐树桩无法完全分开 ----------
  const RAW = [
    [-3.2, 3.0, +1], [-2.0, 2.2, +1], [-3.6, 1.0, +1], [-1.2, 3.4, +1],
    [3.0, -2.6, +1], [2.2, -1.4, +1], [3.6, -3.4, +1], [1.4, -3.0, +1],
    [-3.0, -2.8, -1], [-1.6, -1.8, -1], [-2.6, -3.6, -1], [-1.0, -3.0, -1],
    [3.2, 2.4, -1], [1.8, 3.2, -1], [2.8, 1.2, -1], [1.0, 2.6, -1],
  ];
  const N = RAW.length;
  const X = RAW.map(r => [r[0], r[1]]);
  const Y = RAW.map(r => r[2]);
  const DOMAIN = { xmin:-5, xmax:5, ymin:-5, ymax:5 };
  const MAX_ROUNDS = 6;

  // 候选树桩：对每个特征维，在排序后的中点上取阈值，两种朝向
  function buildStumpCandidates() {
    const stumps = [];
    for (let dim = 0; dim < 2; dim++) {
      const vals = [...new Set(X.map(p => p[dim]))].sort((a,b)=>a-b);
      const thresholds = [];
      for (let i = 0; i < vals.length - 1; i++) thresholds.push((vals[i]+vals[i+1])/2);
      thresholds.push(vals[0]-1); thresholds.push(vals[vals.length-1]+1);
      for (const th of thresholds) {
        for (const sign of [1, -1]) {
          stumps.push({ dim, th, sign });
        }
      }
    }
    return stumps;
  }
  const CANDIDATES = buildStumpCandidates();

  function stumpPredict(stump, p) {
    const v = p[stump.dim];
    return (v <= stump.th ? 1 : -1) * stump.sign;
  }

  function createInitialState() {
    return {
      round: 0,
      weights: new Array(N).fill(1/N),
      ensemble: [],           // { stump, alpha, eps }
      accHistory: [1/2],      // round 0: 未训练时准确率视为基线 50%（无模型）
    };
  }

  let state = createInitialState();

  // ---------- 模型：选出当前权重下加权错误率最小的树桩，计算 alpha，更新权重 ----------
  function trainOneRound(s) {
    let best = null;
    for (const stump of CANDIDATES) {
      let err = 0;
      for (let i = 0; i < N; i++) {
        if (stumpPredict(stump, X[i]) !== Y[i]) err += s.weights[i];
      }
      if (best === null || err < best.eps - 1e-12) best = { stump, eps: err };
    }
    let eps = Math.min(Math.max(best.eps, 1e-6), 1 - 1e-6);
    const alpha = 0.5 * Math.log((1 - eps) / eps);

    const newWeights = s.weights.map((w, i) => {
      const pred = stumpPredict(best.stump, X[i]);
      return w * Math.exp(-alpha * Y[i] * pred);
    });
    const Z = newWeights.reduce((a,b)=>a+b, 0);
    const normWeights = newWeights.map(w => w / Z);

    const ensemble = [...s.ensemble, { stump: best.stump, alpha, eps }];
    const acc = ensembleAccuracy(ensemble);

    return {
      round: s.round + 1,
      weights: normWeights,
      ensemble,
      accHistory: [...s.accHistory, acc],
    };
  }

  function ensembleScore(ensemble, p) {
    return ensemble.reduce((sum, c) => sum + c.alpha * stumpPredict(c.stump, p), 0);
  }
  function ensemblePredict(ensemble, p) {
    return ensembleScore(ensemble, p) >= 0 ? 1 : -1;
  }
  function ensembleAccuracy(ensemble) {
    if (ensemble.length === 0) return 0.5;
    let correct = 0;
    for (let i = 0; i < N; i++) if (ensemblePredict(ensemble, X[i]) === Y[i]) correct++;
    return correct / N;
  }

  // ---------- 渲染：主舞台 ----------
  const cv = document.getElementById("mainCanvas");
  const PAD = 40;

  function toPx(w, h, x, y) {
    const px = PAD + (x - DOMAIN.xmin) / (DOMAIN.xmax - DOMAIN.xmin) * (w - 2*PAD);
    const py = h - PAD - (y - DOMAIN.ymin) / (DOMAIN.ymax - DOMAIN.ymin) * (h - 2*PAD);
    return [px, py];
  }

  function drawMain(ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#FAFBFC";
    ctx.fillRect(0, 0, w, h);

    const hasModel = state.ensemble.length > 0;

    // 决策区域背景（当前集成）
    if (hasModel) {
      const step = 6;
      for (let py = PAD; py < h - PAD; py += step) {
        for (let px = PAD; px < w - PAD; px += step) {
          const x = DOMAIN.xmin + (px - PAD) / (w - 2*PAD) * (DOMAIN.xmax - DOMAIN.xmin);
          const y = DOMAIN.ymin + (h - PAD - py) / (h - 2*PAD) * (DOMAIN.ymax - DOMAIN.ymin);
          const pred = ensemblePredict(state.ensemble, [x, y]);
          ctx.fillStyle = pred === 1 ? "rgba(41,78,134,0.08)" : "rgba(97,124,168,0.10)";
          ctx.fillRect(px, py, step, step);
        }
      }
    }

    // 坐标轴
    ctx.strokeStyle = "#C8D0DB";
    ctx.lineWidth = 1;
    ctx.beginPath();
    const [ox, oy] = toPx(w, h, 0, 0);
    ctx.moveTo(PAD, oy); ctx.lineTo(w-PAD, oy);
    ctx.moveTo(ox, PAD); ctx.lineTo(ox, h-PAD);
    ctx.stroke();

    // 最新树桩的分界线（红色虚线高亮）
    if (hasModel) {
      const latest = state.ensemble[state.ensemble.length - 1].stump;
      ctx.save();
      ctx.strokeStyle = "#164E9B";
      ctx.lineWidth = 2;
      ctx.setLineDash([8,5]);
      ctx.beginPath();
      if (latest.dim === 0) {
        const [px] = toPx(w, h, latest.th, 0);
        ctx.moveTo(px, PAD); ctx.lineTo(px, h-PAD);
      } else {
        const [,py] = toPx(w, h, 0, latest.th);
        ctx.moveTo(PAD, py); ctx.lineTo(w-PAD, py);
      }
      ctx.stroke();
      ctx.restore();
    }

    // 样本点：大小 = 权重，颜色 = 是否被当前集成分类正确
    const maxW = Math.max(...state.weights);
    for (let i = 0; i < N; i++) {
      const [px, py] = toPx(w, h, X[i][0], X[i][1]);
      const r = 6 + (state.weights[i] / maxW) * 12;
      const wrong = hasModel && ensemblePredict(state.ensemble, X[i]) !== Y[i];
      let fill;
      if (wrong) fill = "#C64232";
      else fill = Y[i] === 1 ? "#294E86" : "#617CA8";

      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI*2);
      ctx.fillStyle = fill;
      ctx.globalAlpha = 0.88;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = Y[i] === 1 ? "#111820" : "#FAFBFC";
      ctx.stroke();

      ctx.fillStyle = "#fff";
      ctx.font = "11px " + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(Y[i] === 1 ? "+" : "−", px, py+0.5);
    }
  }

  let mainFit = null;

  // ---------- 渲染：控件与文字 ----------
  const el = {
    stepBtn: document.getElementById("stepBtn"),
    resetBtn: document.getElementById("resetBtn"),
    roundNum: document.getElementById("roundNum"),
    roEps: document.getElementById("roEps"),
    roAlpha: document.getElementById("roAlpha"),
    roAcc: document.getElementById("roAcc"),
    stumpList: document.getElementById("stumpList"),
  };

  function renderPanel() {
    el.roundNum.textContent = state.round;
    const last = state.ensemble[state.ensemble.length - 1];
    el.roEps.textContent = last ? last.eps.toFixed(3) : "—";
    el.roAlpha.textContent = last ? last.alpha.toFixed(3) : "—";
    const acc = state.accHistory[state.accHistory.length - 1];
    el.roAcc.textContent = (acc * 100).toFixed(1);

    el.stumpList.innerHTML = state.ensemble.map((c, i) => {
      const dimName = c.stump.dim === 0 ? "x" : "y";
      const dir = c.stump.sign === 1 ? "≤" : ">";
      const cls = i === state.ensemble.length - 1 ? "stump-row active" : "stump-row";
      return `<div class="${cls}">
        <span class="sw">#${i+1}</span>
        <span class="sd">${dimName} ${dir} ${c.stump.th.toFixed(2)}</span>
        <span class="sa">α=${c.alpha.toFixed(2)}</span>
      </div>`;
    }).join("") || `<div class="stump-row" style="color:var(--muted)">尚未训练任何弱分类器</div>`;

    el.stepBtn.disabled = state.round >= MAX_ROUNDS;
    el.stepBtn.textContent = state.round >= MAX_ROUNDS
      ? "已达到最多 6 轮"
      : "训练下一轮弱分类器";
  }

  // ---------- 渲染：准确率曲线 ----------
  const chartCv = document.getElementById("accChart");
  let chartFit = null;

  function drawChart(ctx, w, h) {
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = "#FAFBFC";
    ctx.fillRect(0,0,w,h);
    const pad = { l:38, r:14, t:14, b:24 };
    const plotW = w - pad.l - pad.r;
    const plotH = h - pad.t - pad.b;

    // 网格 + y 轴标签 (0%, 50%, 100%)
    ctx.strokeStyle = "#C8D0DB";
    ctx.fillStyle = "#657181";
    ctx.font = "12px " + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    [0, 0.5, 1].forEach(v => {
      const y = pad.t + plotH * (1 - v);
      ctx.beginPath();
      ctx.moveTo(pad.l, y); ctx.lineTo(w-pad.r, y);
      ctx.stroke();
      ctx.fillText((v*100).toFixed(0), pad.l - 6, y);
    });

    // x 轴刻度
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    for (let r = 0; r <= MAX_ROUNDS; r++) {
      const x = pad.l + plotW * (r / MAX_ROUNDS);
      ctx.fillText(r, x, pad.t + plotH + 6);
    }

    // 折线
    const pts = state.accHistory.map((acc, r) => [
      pad.l + plotW * (r / MAX_ROUNDS),
      pad.t + plotH * (1 - acc),
    ]);
    ctx.strokeStyle = "#294E86";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    pts.forEach(([x,y], i) => i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y));
    ctx.stroke();
    pts.forEach(([x,y], i) => {
      ctx.beginPath();
      ctx.arc(x, y, i === pts.length-1 ? 5 : 3.5, 0, Math.PI*2);
      ctx.fillStyle = i === pts.length-1 ? "#164E9B" : "#294E86";
      ctx.fill();
    });
  }

  function renderAll() {
    renderPanel();
    mainFit.redraw();
    chartFit.redraw();
  }

  function step() {
    if (state.round >= MAX_ROUNDS) return;
    state = trainOneRound(state);
    renderAll();
  }

  function reset() {
    state = createInitialState();
    renderAll();
  }

  el.stepBtn.addEventListener("click", step);
  el.resetBtn.addEventListener("click", reset);

  mainFit = Deck.autofit(cv, (ctx, w, h) => drawMain(ctx, w, h));
  chartFit = Deck.autofit(chartCv, (ctx, w, h) => drawChart(ctx, w, h));
  renderAll();
})();
</script>
</body>
</html>
