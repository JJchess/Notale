<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdaBoosting算法</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{
  --bg:#EEF1F5;
  --text:#111820;
  --font-sans:"Noto Sans CJK SC",ui-sans-serif,system-ui,sans-serif;
}

#stage{
  position:relative;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

#field{ position:absolute; inset:0; z-index:1; }

.cover-copy{
  position:absolute;
  left:96px;
  top:120px;
  z-index:5;
  pointer-events:none;
}

.kicker{
  font-family:var(--font-mono);
  font-size:16px;
  letter-spacing:.24em;
  color:var(--weight);
  font-weight:600;
}

h1{
  margin:14px 0 0;
  font-family:var(--font-display);
  font-size:96px;
  font-weight:700;
  line-height:1.02;
  letter-spacing:-.01em;
  color:var(--text);
}

.lead{
  margin-top:26px;
  max-width:560px;
  font-size:var(--fs-lead);
  line-height:1.5;
  color:var(--muted);
}

.formula-row{
  margin-top:34px;
  display:flex;
  align-items:baseline;
  gap:14px;
  font-family:var(--font-mono);
  font-size:22px;
  color:var(--weight);
}

.formula-row .sep{
  width:36px;
  height:1px;
  background:var(--line);
}
</style>
</head>
<body data-page="1" data-total="16">
<div id="stage">
  <canvas id="field" class="cv-fill" aria-hidden="true"></canvas>

  <div class="cover-copy">
    <div class="kicker">ENSEMBLE OF WEAK CLASSIFIERS</div>
    <h1>AdaBoost<br>算法</h1>
    <p class="lead">把许多个只比随机猜测略强的简单分类器，按各自的准确程度加权叠加，就能组合成一个远比它们中任何一个都强的分类器。</p>
    <div class="formula-row">
      <span>H(x) = sign</span><span class="sep"></span><span>Σ α<sub>t</sub> h<sub>t</sub>(x)</span>
    </div>
  </div>
</div>

<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/base.js"></script>
<script>
(function () {
  'use strict';

  var W = 1600, H = 900;
  var REPRESENTATIVE_MS = 9600;

  var CONFIG = Object.freeze({
    seed: 'adaboost-cover-01',
    nPoints: 46,
    nStumps: 7,
    quiet: Object.freeze({ x0: 40, y0: 90, x1: 700, y1: 760 }) // title exclusion (logical coords)
  });

  var canvas = document.getElementById('field');
  var ctx = null;
  var media = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var stopLoop = function(){};
  var offResize = function(){};
  var model = null;
  var palette = {};

  function readPalette() {
    palette.bg = Deck.rgb('bg');
    palette.line = Deck.rgb('line');
    palette.muted = Deck.rgb('muted');
    palette.weak = Deck.rgb('weak');
    palette.correct = Deck.rgb('correct');
    palette.weight = Deck.rgb('weight');
    palette.error = Deck.rgb('error');
    palette.text = Deck.rgb('text');
  }

  function rgba(rgb, a) { return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')'; }

  function inQuiet(x, y) {
    var q = CONFIG.quiet;
    return x > q.x0 && x < q.x1 && y > q.y0 && y < q.y1;
  }

  // Deterministic dataset: two interleaved clusters in the plotting field (right 2/3 of stage),
  // avoiding the title exclusion zone on the left.
  function buildModel() {
    var rng = new Math.seedrandom(CONFIG.seed + '/points');
    var plot = { x0: 760, y0: 120, x1: 1540, y1: 800 };
    var points = [];

    for (var i = 0; i < CONFIG.nPoints; i += 1) {
      var label = i % 2 === 0 ? 1 : -1;
      var cx = label === 1 ? plot.x0 + (plot.x1 - plot.x0) * 0.36 : plot.x0 + (plot.x1 - plot.x0) * 0.66;
      var cy = plot.y0 + (plot.y1 - plot.y0) * 0.5;
      var spread = 235;
      var x = cx + (rng() - 0.5) * spread + (rng() - 0.5) * spread * 0.6;
      var y = cy + (rng() - 0.5) * (plot.y1 - plot.y0) * 0.86;
      x = Deck.clamp(x, plot.x0 + 20, plot.x1 - 20);
      y = Deck.clamp(y, plot.y0 + 20, plot.y1 - 20);
      points.push({ x: x, y: y, label: label });
    }

    // Weak stumps: simple vertical/horizontal/diagonal threshold lines, each slightly
    // better than random, chosen deterministically to roughly split the two clusters
    // when combined. Each stump gets an appear time and a weight (alpha).
    var stumpRng = new Math.seedrandom(CONFIG.seed + '/stumps');
    var stumps = [];
    var baseAngles = [4, -6, 10, -3, 7, -9, 2]; // small tilts, degrees
    for (var s = 0; s < CONFIG.nStumps; s += 1) {
      var t = s / (CONFIG.nStumps - 1);
      var cx2 = plot.x0 + (plot.x1 - plot.x0) * (0.42 + (stumpRng() - 0.5) * 0.12);
      var angleDeg = baseAngles[s % baseAngles.length] + (stumpRng() - 0.5) * 3;
      var angle = angleDeg * Math.PI / 180;
      // error rate: weak learners start higher error, later ones lower (boosting narrative)
      var err = 0.42 - t * 0.22 + stumpRng() * 0.03;
      var alpha = 0.5 * Math.log((1 - err) / Math.max(err, 0.02));
      stumps.push({
        cx: cx2,
        cy: plot.y0 + (plot.y1 - plot.y0) * 0.5,
        angle: angle,
        alpha: alpha,
        appearAt: 900 + s * 1050,
        holdAt: 900 + s * 1050 + 620
      });
    }

    return { points: points, stumps: stumps, plot: plot };
  }

  function stumpEndpoints(stump, plot) {
    var len = 460;
    var dx = Math.sin(stump.angle) * len;
    var dy = Math.cos(stump.angle) * len;
    return {
      x1: stump.cx - dx, y1: stump.cy - dy,
      x2: stump.cx + dx, y2: stump.cy + dy
    };
  }

  function drawGrid(g, plot) {
    g.save();
    g.strokeStyle = rgba(palette.line, 0.5);
    g.lineWidth = 1;
    for (var gx = plot.x0; gx <= plot.x1; gx += 130) {
      g.beginPath(); g.moveTo(gx, plot.y0); g.lineTo(gx, plot.y1); g.stroke();
    }
    for (var gy = plot.y0; gy <= plot.y1; gy += 113) {
      g.beginPath(); g.moveTo(plot.x0, gy); g.lineTo(plot.x1, gy); g.stroke();
    }
    g.restore();
  }

  function drawPoints(g, points, time) {
    points.forEach(function (p) {
      var color = p.label === 1 ? palette.correct : palette.error;
      g.fillStyle = rgba(color, 0.92);
      g.beginPath();
      if (p.label === 1) {
        g.arc(p.x, p.y, 6.2, 0, Math.PI * 2);
      } else {
        g.rect(p.x - 5.4, p.y - 5.4, 10.8, 10.8);
      }
      g.fill();
    });
  }

  function stumpProgress(stump, time) {
    if (time <= stump.appearAt) return 0;
    if (time >= stump.holdAt) return 1;
    return (time - stump.appearAt) / (stump.holdAt - stump.appearAt);
  }

  function drawStumps(g, stumps, plot, time) {
    stumps.forEach(function (stump, i) {
      var prog = stumpProgress(stump, time);
      if (prog <= 0) return;
      var pts = stumpEndpoints(stump, plot);
      var ex = Deck.lerp(pts.x1, pts.x2, prog);
      var ey = Deck.lerp(pts.y1, pts.y2, prog);
      var isLast = i === stumps.length - 1;
      var settled = time >= stump.holdAt;
      var alphaVis = settled ? (isLast ? 0.9 : 0.22) : 0.85;
      var widthVis = settled ? (isLast ? 3.2 : 1.3) : 2.2;
      g.save();
      g.strokeStyle = rgba(palette.weak, alphaVis);
      g.lineWidth = widthVis;
      g.setLineDash(settled && !isLast ? [7, 6] : []);
      g.beginPath();
      g.moveTo(pts.x1, pts.y1);
      g.lineTo(ex, ey);
      g.stroke();
      g.restore();

      // weight label near the line when it's actively drawing
      if (!settled && prog > 0.55) {
        g.save();
        g.fillStyle = rgba(palette.weight, Math.min(1, (prog - 0.55) / 0.45));
        g.font = '600 15px "JetBrains Mono", ui-monospace, monospace';
        g.fillText('\u03B1' + (i + 1) + ' = ' + stump.alpha.toFixed(2), ex + 10, ey - 8);
        g.restore();
      }
    });
  }

  // Combined strong boundary: weighted vote of all stump signed distances, sampled
  // along y to draw the emergent decision curve once all stumps have appeared.
  function combinedSign(x, y, stumps, upto) {
    var sum = 0;
    for (var i = 0; i < upto; i += 1) {
      var st = stumps[i];
      var nx = Math.cos(st.angle);
      var ny = -Math.sin(st.angle);
      var d = (x - st.cx) * nx + (y - st.cy) * ny;
      sum += st.alpha * Math.sign(d || 1);
    }
    return sum;
  }

  function drawStrongBoundary(g, model, time) {
    var stumps = model.stumps;
    var lastHold = stumps[stumps.length - 1].holdAt;
    if (time < lastHold) return;
    var revealT = Deck.clamp((time - lastHold) / 900, 0, 1);
    var plot = model.plot;
    var step = 6;
    var prevX = null, prevY = null;
    var pts = [];
    for (var y = plot.y0; y <= plot.y1; y += step) {
      // binary search x where combinedSign crosses zero
      var lo = plot.x0, hi = plot.x1;
      var slo = combinedSign(lo, y, stumps, stumps.length);
      for (var iter = 0; iter < 22; iter += 1) {
        var mid = (lo + hi) / 2;
        var smid = combinedSign(mid, y, stumps, stumps.length);
        if ((smid > 0) === (slo > 0)) { lo = mid; slo = smid; } else { hi = mid; }
      }
      pts.push({ x: (lo + hi) / 2, y: y });
    }

    var visibleCount = Math.round(pts.length * revealT);
    if (visibleCount < 2) return;
    g.save();
    g.strokeStyle = rgba(palette.weight, 0.95);
    g.lineWidth = 4.4;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.beginPath();
    for (var k = 0; k < visibleCount; k += 1) {
      if (k === 0) g.moveTo(pts[k].x, pts[k].y);
      else g.lineTo(pts[k].x, pts[k].y);
    }
    g.stroke();
    g.restore();
  }

  function render(time) {
    if (!ctx || !model) return;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = rgba(palette.bg, 1);
    ctx.fillRect(0, 0, W, H);
    drawGrid(ctx, model.plot);
    drawStumps(ctx, model.stumps, model.plot, time);
    drawStrongBoundary(ctx, model, time);
    drawPoints(ctx, model.points, time);
  }

  function rebuild() {
    ctx = Deck.fit(canvas);
    if (!ctx) return;
    readPalette();
    model = buildModel();
    render(Deck.reduced() ? REPRESENTATIVE_MS : 0);
  }

  function startMotion() {
    stopMotion();
    if (Deck.reduced()) {
      render(REPRESENTATIVE_MS);
      return;
    }
    var loopMs = model.stumps[model.stumps.length - 1].holdAt + 2600;
    stopLoop = Deck.loop(function (elapsed) {
      var t = elapsed % loopMs;
      render(t);
    });
  }

  function stopMotion() { stopLoop(); stopLoop = function(){}; }

  function onResize() {
    rebuild();
    startMotion();
  }

  function onMotionPreference() {
    stopMotion();
    render(Deck.reduced() ? REPRESENTATIVE_MS : 0);
    if (!Deck.reduced()) startMotion();
  }

  if (media) {
    if (media.addEventListener) media.addEventListener('change', onMotionPreference);
    else if (media.addListener) media.addListener(onMotionPreference);
  }
  offResize = Deck.onResize(onResize);

  rebuild();
  startMotion();
})();
</script>
</body>
</html>
