<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{
  --bg:#EEF1F5;
  --text:#111820;
  --surface:#FAFBFC;
  --muted:#657181;
  --weak:#617CA8;
  --correct:#294E86;
  --weight:#164E9B;
  --error:#C64232;
  --line:#C8D0DB;
  --focus:#164E9B;
  --font-sans:"Noto Sans CJK SC",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --font-display:"Clear Sans","Noto Sans CJK SC",ui-sans-serif,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);}
#stage{
  width:1600px;height:900px;padding:28px 56px;
  display:flex;flex-direction:column;gap:16px;
}
h1{
  font-family:var(--font-display);font-size:32px;font-weight:700;margin:0;
  letter-spacing:-.01em;
}
.lead{font-size:var(--fs-sec,16px);color:var(--muted);margin:2px 0 0;line-height:1.4;}

.main{flex:1;min-height:0;display:flex;gap:24px;}

/* ---- left: controls & readouts ---- */
.left{flex:0 0 500px;display:flex;flex-direction:column;gap:14px;min-height:0;}

.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:16px 18px;
}
.panel h2{
  font-family:var(--font-display);font-size:18px;font-weight:700;margin:0 0 10px;
}

.round-row{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;}
.round-row .big{font-family:var(--font-mono);font-size:44px;font-weight:700;color:var(--weight);line-height:1;}
.round-row .unit{font-size:14px;color:var(--muted);}

.readouts{display:flex;gap:0;border-top:1px solid var(--line);padding-top:10px;}
.readout{flex:1;padding-right:12px;}
.readout+.readout{border-left:1px solid var(--line);padding-left:12px;}
.readout .lbl{font-size:13px;color:var(--muted);letter-spacing:.02em;}
.readout .val{font-family:var(--font-mono);font-size:24px;font-weight:700;margin-top:2px;}
.readout .val.err{color:var(--error);}
.readout .val.alpha{color:var(--weight);}

.stump-desc{
  margin-top:10px;font-size:15px;line-height:1.5;color:var(--text);
  border-top:1px solid var(--line);padding-top:10px;
}
.stump-desc b{font-family:var(--font-mono);color:var(--weight);font-weight:700;}

.btn-row{display:flex;gap:10px;margin-top:14px;}
.btn{
  font-family:var(--font-sans);font-size:15px;font-weight:600;
  padding:10px 18px;border:1px solid var(--text);border-radius:2px;
  background:var(--text);color:var(--surface);cursor:pointer;
}
.btn:disabled{opacity:.35;cursor:default;}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line);}
.btn.ghost:hover:not(:disabled){border-color:var(--text);}

.history-panel{flex:1;min-height:0;display:flex;flex-direction:column;}
.history-list{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px;}
.hist-row{display:flex;align-items:center;gap:10px;font-size:14px;}
.hist-row .t{font-family:var(--font-mono);width:22px;color:var(--muted);}
.hist-row .bar-wrap{flex:1;height:14px;background:#E4E8EE;border-radius:2px;overflow:hidden;}
.hist-row .bar{height:100%;background:var(--error);}
.hist-row .errval{width:56px;text-align:right;font-family:var(--font-mono);color:var(--muted);}
.hist-row.dim{opacity:.3;}

/* ---- right: scene ---- */
.right{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;}
.scene-panel{
  flex:1;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:14px 18px;display:flex;flex-direction:column;
}
.scene-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.scene-head h2{font-family:var(--font-display);font-size:18px;font-weight:700;margin:0;}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);}
.legend .li{display:flex;align-items:center;gap:6px;}
.legend .sw{width:11px;height:11px;border-radius:50%;display:inline-block;}

.cvbox{position:relative;flex:1;min-height:0;}
.cvbox canvas{position:absolute;inset:0;width:100%;height:100%;}

.note{font-size:14px;color:var(--muted);line-height:1.4;margin-top:8px;}
</style>
</head>
<body data-page="12" data-total="16">
<div id="stage">
  <div>
    <h1>模拟训练 AdaBoost 模型</h1>
    <p class="lead">10 个样本、两个类别。每点一次「训练下一轮」，算法就在当前样本权重下真正挑一个最优树桩，计算它的权重 α，再更新全部样本权重——不是预先写好的动画。</p>
  </div>

  <div class="main">
    <div class="left">
      <div class="panel">
        <h2>本轮结果</h2>
        <div class="round-row">
          <span class="unit">第</span><span class="big" id="roundNum">0</span><span class="unit">轮</span>
        </div>
        <div class="readouts">
          <div class="readout">
            <div class="lbl">加权误差率 ε</div>
            <div class="val err" id="errVal">—</div>
          </div>
          <div class="readout">
            <div class="lbl">分类器权重 α</div>
            <div class="val alpha" id="alphaVal">—</div>
          </div>
        </div>
        <div class="stump-desc" id="stumpDesc">点击下方按钮，训练第 1 个弱分类器。</div>
        <div class="btn-row">
          <button class="btn" id="stepBtn">训练下一轮</button>
          <button class="btn ghost" id="resetBtn">重置</button>
        </div>
      </div>

      <div class="panel history-panel">
        <h2>各轮加权误差率</h2>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>

    <div class="right">
      <div class="scene-panel">
        <div class="scene-head">
          <h2>样本权重与当前弱分类器</h2>
          <div class="legend">
            <span class="li"><span class="sw" style="background:var(--correct)"></span>+1 类</span>
            <span class="li"><span class="sw" style="background:var(--error)"></span>−1 类</span>
            <span class="li">气泡大小 = 样本权重</span>
          </div>
        </div>
        <div class="cvbox"><canvas id="scatter"></canvas></div>
        <p class="note" id="sceneNote">背景色块是累计强分类器 F(x) 目前的判定区域；虚线是本轮新选出的树桩分割线。</p>
      </div>
    </div>
  </div>
</div>

<script src="assets/base.js"></script>
<script>
(() => {
"use strict";

// ---- 固定数据集：10 个二维点，标签 +-1（其中 2 个越界噪声点） ----
const POINTS = [
  {x:1,   y:6,   label:+1},
  {x:2,   y:3,   label:+1},
  {x:1.5, y:7,   label:+1},
  {x:3,   y:5,   label:+1},
  {x:7,   y:2,   label:-1},
  {x:8,   y:6,   label:-1},
  {x:6,   y:4,   label:-1},
  {x:8,   y:3,   label:-1},
  {x:6.5, y:7.5, label:+1},
  {x:1.5, y:1,   label:-1},
];
const N = POINTS.length;
const MAX_ROUNDS = 4;
const DOMAIN = {xmin:0, xmax:9, ymin:0, ymax:8.5};

function stumpCandidates(){
  const cands = [];
  const xs = [...new Set(POINTS.map(p=>p.x))].sort((a,b)=>a-b);
  const ys = [...new Set(POINTS.map(p=>p.y))].sort((a,b)=>a-b);
  for(let i=0;i<xs.length-1;i++) cands.push({axis:'x', thresh:(xs[i]+xs[i+1])/2});
  for(let i=0;i<ys.length-1;i++) cands.push({axis:'y', thresh:(ys[i]+ys[i+1])/2});
  return cands;
}
const CANDS = stumpCandidates();

function stumpPredict(stump, p){
  const v = stump.axis==='x' ? p.x : p.y;
  const pred = v < stump.thresh ? 1 : -1;
  return pred * stump.polarity;
}

function bestStump(w){
  let best = null;
  for(const c of CANDS){
    for(const polarity of [1,-1]){
      const stump = {axis:c.axis, thresh:c.thresh, polarity};
      let err = 0;
      const preds = POINTS.map(p=>stumpPredict(stump,p));
      for(let i=0;i<N;i++) if(preds[i]!==POINTS[i].label) err += w[i];
      if(best===null || err < best.err - 1e-12){
        best = {err, stump, preds};
      }
    }
  }
  return best;
}

// ---- canonical state ----
function createInitialState(){
  return {
    round: 0,
    w: new Array(N).fill(1/N),
    rounds: [],   // {stump, err, alpha, wBefore, wAfter, preds}
  };
}
let state = createInitialState();

function trainNextRound(){
  if(state.round >= MAX_ROUNDS) return;
  const wBefore = state.w.slice();
  const {err, stump, preds} = bestStump(wBefore);
  const errC = Math.min(Math.max(err, 1e-10), 1-1e-10);
  const alpha = 0.5*Math.log((1-errC)/errC);
  const raw = wBefore.map((wi,i)=> wi*Math.exp(-alpha*POINTS[i].label*preds[i]));
  const Z = raw.reduce((a,b)=>a+b,0);
  const wAfter = raw.map(v=>v/Z);
  state.rounds.push({stump, err, alpha, wBefore, wAfter, preds});
  state.w = wAfter;
  state.round += 1;
}

function strongScore(p, upto){
  let s = 0;
  for(let t=0;t<upto;t++){
    const r = state.rounds[t];
    s += r.alpha * stumpPredict(r.stump, p);
  }
  return s;
}

// ---- DOM ----
const $ = id => document.getElementById(id);
const ui = {
  roundNum: $('roundNum'),
  errVal: $('errVal'),
  alphaVal: $('alphaVal'),
  stumpDesc: $('stumpDesc'),
  stepBtn: $('stepBtn'),
  resetBtn: $('resetBtn'),
  historyList: $('historyList'),
  sceneNote: $('sceneNote'),
  scatter: $('scatter'),
};

function axisLabel(axis){ return axis==='x' ? 'x' : 'y'; }

function describeStump(r, roundIdx){
  const side = r.stump.polarity===1 ? '小于' : '大于等于';
  return `第 ${roundIdx+1} 轮选中 <b>${axisLabel(r.stump.axis)} ${r.stump.polarity===1?'<':'≥'} ${r.stump.thresh.toFixed(2)}</b> 判为 +1（其余判 −1）。`
    + `这是当前权重下加权误差最小的树桩：ε=${r.err.toFixed(3)}，α=${r.alpha.toFixed(3)}。`;
}

function render(){
  ui.roundNum.textContent = state.round;
  ui.stepBtn.disabled = state.round >= MAX_ROUNDS;
  ui.stepBtn.textContent = state.round >= MAX_ROUNDS ? '已训练全部轮次' : '训练下一轮';

  if(state.round === 0){
    ui.errVal.textContent = '—';
    ui.alphaVal.textContent = '—';
    ui.stumpDesc.innerHTML = '点击下方按钮，训练第 1 个弱分类器。';
  } else {
    const r = state.rounds[state.round-1];
    ui.errVal.textContent = r.err.toFixed(3);
    ui.alphaVal.textContent = r.alpha.toFixed(3);
    ui.stumpDesc.innerHTML = describeStump(r, state.round-1);
  }

  renderHistory();
  drawScene();
}

function renderHistory(){
  ui.historyList.innerHTML = '';
  const maxErr = 0.5;
  for(let t=0;t<MAX_ROUNDS;t++){
    const row = document.createElement('div');
    row.className = 'hist-row' + (t < state.round ? '' : ' dim');
    const done = t < state.round;
    const err = done ? state.rounds[t].err : 0;
    row.innerHTML = `
      <span class="t">${t+1}</span>
      <span class="bar-wrap"><span class="bar" style="width:${done ? (err/maxErr*100).toFixed(1) : 0}%"></span></span>
      <span class="errval">${done ? err.toFixed(3) : '—'}</span>
    `;
    ui.historyList.appendChild(row);
  }
}

// ---- canvas 场景 ----
let fit = null;
function ensureFit(){
  if(fit) return;
  fit = Deck.autofit(ui.scatter, (ctx, w, h) => drawScatter(ctx, w, h));
}
function drawScene(){ if(fit) fit.redraw(); else ensureFit(); }

function toPx(p, w, h, pad){
  const x = pad + (p.x - DOMAIN.xmin)/(DOMAIN.xmax-DOMAIN.xmin) * (w-2*pad);
  const y = h - pad - (p.y - DOMAIN.ymin)/(DOMAIN.ymax-DOMAIN.ymin) * (h-2*pad);
  return {x,y};
}

function drawScatter(ctx, w, h){
  ctx.clearRect(0,0,w,h);
  const pad = 44;

  // 背景：累计强分类器判定区域（按当前 state.round 的树桩集合）
  if(state.round > 0){
    const cell = 6;
    for(let py=pad; py<h-pad; py+=cell){
      for(let px=pad; px<w-pad; px+=cell){
        const dx = DOMAIN.xmin + (px-pad)/(w-2*pad)*(DOMAIN.xmax-DOMAIN.xmin);
        const dy = DOMAIN.ymin + (1-(py-pad)/(h-2*pad))*(DOMAIN.ymax-DOMAIN.ymin);
        const s = strongScore({x:dx,y:dy}, state.round);
        ctx.fillStyle = s>=0 ? 'rgba(41,78,134,0.08)' : 'rgba(198,66,50,0.08)';
        ctx.fillRect(px,py,cell,cell);
      }
    }
  }

  // 坐标轴
  ctx.strokeStyle = Deck.rgba('line',1);
  ctx.lineWidth = 1;
  ctx.strokeRect(pad,pad,w-2*pad,h-2*pad);

  // 当前轮新树桩分割线（虚线）
  if(state.round > 0){
    const r = state.rounds[state.round-1];
    ctx.save();
    ctx.strokeStyle = Deck.rgba('weight',1);
    ctx.lineWidth = 2.5;
    ctx.setLineDash([8,6]);
    ctx.beginPath();
    if(r.stump.axis==='x'){
      const px = pad + (r.stump.thresh-DOMAIN.xmin)/(DOMAIN.xmax-DOMAIN.xmin)*(w-2*pad);
      ctx.moveTo(px,pad); ctx.lineTo(px,h-pad);
    } else {
      const py = h-pad - (r.stump.thresh-DOMAIN.ymin)/(DOMAIN.ymax-DOMAIN.ymin)*(h-2*pad);
      ctx.moveTo(pad,py); ctx.lineTo(w-pad,py);
    }
    ctx.stroke();
    ctx.restore();
  }

  // 样本点：气泡大小 = 当前权重；本轮预测错误的点描边高亮
  const wArr = state.w;
  const maxW = Math.max(...wArr);
  const curPreds = state.round>0 ? state.rounds[state.round-1].preds : null;
  POINTS.forEach((p,i)=>{
    const {x,y} = toPx(p, w, h, pad);
    const r = 7 + (wArr[i]/maxW) * 15;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = p.label===1 ? Deck.rgba('correct', 0.85) : Deck.rgba('error', 0.85);
    ctx.fill();
    if(curPreds && curPreds[i] !== p.label){
      ctx.lineWidth = 3;
      ctx.strokeStyle = Deck.rgb('error').length ? '#111820' : '#111820';
      ctx.stroke();
    }
  });

  // 轴标签
  ctx.fillStyle = Deck.rgba('muted',1);
  ctx.font = '12px ' + getComputedStyle(document.body).getPropertyValue('--font-mono');
  ctx.textAlign='center';
  ctx.fillText('x', w-pad+14, h-pad+4);
  ctx.textAlign='left';
  ctx.fillText('y', pad-6, pad-10);
}

// ---- events ----
ui.stepBtn.addEventListener('click', () => {
  trainNextRound();
  render();
});
ui.resetBtn.addEventListener('click', () => {
  state = createInitialState();
  render();
});

Deck.onResize(() => drawScene());
render();
})();
</script>
</body>
</html>
