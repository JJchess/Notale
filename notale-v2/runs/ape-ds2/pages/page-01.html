<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/lib/gsap.min.js"></script>
<style>
:root{
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
  --gold: #d4a853;
}
body{
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
}
/* Full-width cover — no card, no column limit */
#stage{
  padding: 0;
  overflow: hidden;
}
.p01-cover{
  position: relative;
  width: 100%;
  height: 100%;
  background: radial-gradient(ellipse at center, #111926 0%, #000 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.p01-kicker{
  position: absolute;
  top: 110px;
  font-size: 15px;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  font-weight: 600;
  opacity: 0;
}
.p01-title{
  font-size: 96px;
  letter-spacing: 0.55em;
  font-weight: 700;
  color: #fff;
  opacity: 0;
  line-height: 1.2;
  text-align: center;
  width: 100%;
  padding: 0 40px;
  box-sizing: border-box;
}
/* Axis: a horizontal line with two labelled endpoints */
.p01-axis{
  position: relative;
  width: 80%;
  max-width: 1200px;
  height: 60px;
  margin: 24px auto 0;
}
.p01-line{
  position: absolute;
  top: 50%;
  left: 0;
  right: 2%;
  height: 1px;
  background: rgba(255,255,255,0.25);
  transform: translateY(-50%);
}
.p01-endpoint{
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 19px;
  color: rgba(255,255,255,0.55);
  font-weight: 600;
  letter-spacing: 0.06em;
}
.p01-endpoint-left{ left: 0; }
.p01-endpoint-right{ right: 0; }
/* Traveling light point */
.p01-traveler{
  position: absolute;
  top: 50%;
  left: 0;
  width: 3px;
  height: 3px;
  background: #fff;
  border-radius: 50%;
  transform: translate(-50%,-50%);
  box-shadow: 0 0 8px rgba(255,255,255,0.9);
  opacity: 0;
}
/* Moon dot — sand-gold, at the line's right end */
.p01-moon{
  position: absolute;
  top: 50%;
  right: 0;
  width: 7px;
  height: 7px;
  background: var(--gold);
  border-radius: 50%;
  transform: translate(50%,-50%);
  box-shadow: 0 0 10px rgba(212,168,83,0.5);
  opacity: 0;
}
.p01-claim{
  font-size: 19px;
  color: rgba(255,255,255,0.88);
  text-align: center;
  margin-top: 40px;
  line-height: 1.6;
  max-width: 700px;
  opacity: 0;
}
.p01-footer{
  position: absolute;
  bottom: 100px;
  font-size: 16px;
  color: rgba(255,255,255,0.12);
  text-align: center;
  opacity: 0;
}
</style>
</head>
<body data-page="01" data-total="50">
<div id="stage">
  <div class="p01-cover">
    <div class="p01-kicker">第 0 章 · 开场 — APEMAN – SPACEMAN</div>
    <div class="p01-title">从人猿到太空人</div>
    <div class="p01-axis">
      <div class="p01-line"></div>
      <span class="p01-endpoint p01-endpoint-left">人猿</span>
      <span class="p01-endpoint p01-endpoint-right">太空人</span>
      <div class="p01-traveler"></div>
      <div class="p01-moon"></div>
    </div>
    <div class="p01-claim">我们身体里住着猿，脚步已经踏上月球。</div>
    <div class="p01-footer">一段从脚印到脚印的旅程</div>
  </div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Deck.init({ index: 1, total: 50 });

document.addEventListener('DOMContentLoaded', function(){
  Lec.mount({
    index: 1,
    kicker: '第 0 章 · 开场',
    title: 'Apeman – Spaceman',
    take: '从人猿到太空人'
  });

  if(Deck.reduced()){
    /* reduced-motion: show everything immediately */
    gsap.set('.p01-kicker, .p01-title, .p01-claim, .p01-footer, .p01-moon', { autoAlpha: 1 });
    gsap.set('.p01-traveler', { autoAlpha: 0 });
    return;
  }

  var axis = document.querySelector('.p01-axis');
  var axisW = axis.offsetWidth;
  var endX = axisW * 0.97;  /* right edge of the line */

  var tl = gsap.timeline({ defaults: { ease: 'power2.out' } });

  tl.to('.p01-kicker', { autoAlpha: 1, duration: 0.5 })
    .to('.p01-title',  { autoAlpha: 1, duration: 0.7 }, '-=0.2')
    .to('.p01-traveler', { autoAlpha: 1, duration: 0.2 }, '-=0.4')
    .to('.p01-traveler', {
      x: endX,
      duration: 1.8,
      ease: 'power1.inOut'
    })
    .to('.p01-moon', { autoAlpha: 1, scale: 1, duration: 0.4 }, '-=0.15')
    .to('.p01-traveler', { autoAlpha: 0, duration: 0.15 }, '-=0.15')
    .to('.p01-claim', { autoAlpha: 1, duration: 0.5 }, '-=0.1')
    .to('.p01-footer', { autoAlpha: 1, duration: 0.5 }, '-=0.2');
});
</script>
</body>
</html>
