<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}

#main {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* === Ledger Paper === */
.ledger {
  width: 100%;
  max-width: 1408px;
  background: #f5f0e6;
  border-radius: 4px;
  padding: 40px 64px 28px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  position: relative;
  /* ruled ledger lines */
  background-image: repeating-linear-gradient(
    transparent 0px,
    transparent 36px,
    rgba(0,0,0,0.04) 36px,
    rgba(0,0,0,0.04) 37px
  );
  background-position: 0 28px;
  background-repeat: repeat;
}

/* red margin line (ledger motif) */
.ledger::before {
  content: '';
  position: absolute;
  left: 56px;
  top: 0;
  bottom: 0;
  width: 1px;
  background: rgba(180, 60, 60, 0.15);
}

/* === Station Grid === */
.ledger-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 0;
  position: relative;
  margin-bottom: 0;
}

.ledger-station {
  text-align: center;
  position: relative;
  padding: 28px 0 20px;
}

/* Vertical dividers between columns */
.ledger-station + .ledger-station::before {
  content: '';
  position: absolute;
  left: 0;
  top: 20%;
  bottom: 20%;
  width: 1px;
  background: rgba(0,0,0,0.07);
}

.station-num {
  font-size: 14px;
  font-weight: 600;
  color: rgba(0,0,0,0.30);
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
  margin-bottom: 14px;
}

.station-name {
  font-size: 30px;
  font-weight: 700;
  color: #1a1a1a;
  letter-spacing: 0.08em;
  line-height: 1.3;
}

/* === Route Line === */
.route-line {
  position: relative;
  height: 2px;
  background: rgba(0,0,0,0.12);
  margin: 0 0 24px;
}

.route-line .dot {
  position: absolute;
  top: 50%;
  width: 10px;
  height: 10px;
  background: #4f6ef2;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 0 2px rgba(79, 110, 242, 0.15);
}

/* === Description === */
.ledger-desc {
  font-size: 16px;
  color: rgba(0,0,0,0.55);
  text-align: center;
  line-height: 1.55;
  margin: 0 auto;
  max-width: 85%;
  padding-bottom: 8px;
}
</style>
</head>
<body data-page="02" data-total="50">
<div id="stage">
<main id="main">
  <div class="ledger">
    <div class="ledger-grid" id="ledgerGrid"></div>
    <div class="route-line" id="routeLine"></div>
    <p class="ledger-desc">这七站不是七段无关的课，而是一条连续的路：从深时出发，经过身体、火、语言与文化，最后到太空，再回头望。</p>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 2,
  kicker: 'ROAD MAP',
  title: '七站，一条路',
  take: '七站路线图：深时、身体、火、语言、文化、太空、回望'
});

(function() {
  var stations = ['深时', '身体', '火', '语言', '文化', '太空', '回望'];
  var grid = document.getElementById('ledgerGrid');
  var route = document.getElementById('routeLine');

  stations.forEach(function(name, i) {
    var div = document.createElement('div');
    div.className = 'ledger-station';
    div.innerHTML = '<div class="station-num">' + String(i + 1).padStart(2, '0') + '</div><div class="station-name">' + name + '</div>';
    grid.appendChild(div);

    var dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.left = ((i + 0.5) / stations.length * 100) + '%';
    route.appendChild(dot);
  });
})();
</script>
</body>
</html>
