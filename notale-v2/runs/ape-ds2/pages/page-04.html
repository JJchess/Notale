<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
  --accent-glow: #4f6ef2;
  --node-dim: rgba(255, 255, 255, 0.15);
  --node-bright: #6b8aff;
  --label-bg: rgba(11, 14, 20, 0.88);
  --strip-bg: rgba(255, 255, 255, 0.04);
  --strip-border: rgba(255, 255, 255, 0.08);
  --mark-color: rgba(255, 255, 255, 0.15);
  --mark-label: rgba(255, 255, 255, 0.35);
}

/* 内容容器：约束在 stage 的 content 区域内 */
.tl-wrapper {
  position: relative;
  width: var(--content-w);
  height: var(--content-h);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-sizing: border-box;
}

/* ---- 读出行 ---- */
.tl-readout {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  flex: 0 0 auto;
  padding: 6px 0 0;
}

.tl-readout-date {
  font-size: var(--fs-h2);
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.04em;
  font-family: var(--font-mono), monospace;
}

.tl-readout-years {
  font-size: var(--fs-lead);
  color: var(--muted);
  font-family: var(--font-mono), monospace;
}

.tl-readout-divider {
  width: 1px;
  height: 26px;
  background: rgba(255, 255, 255, 0.12);
}

/* ---- 时间轴主体 ---- */
.tl-body {
  flex: 1 1 auto;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 0;
  padding: 0 48px;
}

/* 标签区域 - 在时间轴上方 */
.tl-labels-area {
  position: relative;
  height: 130px;
  flex: 0 0 auto;
  overflow: visible;
}

.tl-label {
  position: absolute;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.45s ease;
  white-space: nowrap;
  z-index: 3;
}

.tl-label.visible {
  opacity: 1;
}

.tl-label .label-text {
  display: inline-block;
  background: var(--label-bg);
  border: 1px solid var(--strip-border);
  border-radius: 6px;
  padding: 3px 10px 4px;
  font-size: var(--fs-label);
  color: var(--text);
  line-height: 1.4;
  position: relative;
}

.tl-label .label-text::after {
  content: '';
  position: absolute;
  left: 50%;
  bottom: -40px;
  width: 1px;
  height: 40px;
  background: rgba(255, 255, 255, 0.12);
  transform: translateX(-50%);
}

.tl-label .label-text .years {
  color: var(--muted);
  font-size: var(--fs-tick);
  display: block;
  margin-top: 1px;
  font-weight: 400;
}

/* 脚印标记 */
.tl-footprint {
  position: absolute;
  font-size: 28px;
  opacity: 0;
  transition: opacity 0.6s ease;
  pointer-events: none;
  z-index: 4;
}

.tl-footprint.visible {
  opacity: 1;
}

/* 引线通过 CSS ::after 实现 */

/* ---- 时间轴条 ---- */
.tl-strip {
  position: relative;
  height: 56px;
  flex: 0 0 auto;
  width: 100%;
  background: var(--strip-bg);
  border: 1px solid var(--strip-border);
  border-radius: 8px;
  cursor: pointer;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  box-sizing: border-box;
}

/* 轨道线 */
.tl-track-line {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 2px;
  background: rgba(255, 255, 255, 0.06);
  transform: translateY(-50%);
}

/* 事件节点 */
.tl-event-nodes {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
}

.tl-event-node {
  position: absolute;
  top: 50%;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--node-dim);
  border: 2px solid rgba(255, 255, 255, 0.08);
  transform: translate(-50%, -50%);
  transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
  z-index: 3;
}

.tl-event-node.lit {
  background: var(--node-bright);
  border-color: var(--node-bright);
  box-shadow: 0 0 12px rgba(107, 138, 255, 0.5);
}

/* 扫描线 */
.tl-scan-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  margin-left: -1px;
  background: var(--accent-glow);
  z-index: 5;
  pointer-events: none;
  box-shadow: 0 0 6px rgba(79, 110, 242, 0.5), 0 0 16px rgba(79, 110, 242, 0.2);
}

/* 光迹（已过区域） */
.tl-trail {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 0;
  background: linear-gradient(90deg,
    rgba(79, 110, 242, 0.06) 0%,
    rgba(79, 110, 242, 0.02) 85%,
    transparent 100%
  );
  pointer-events: none;
  z-index: 1;
}

/* ---- 月份标记（独立于时间轴条，避免被裁） ---- */
.tl-month-marks {
  position: relative;
  height: 26px;
  flex: 0 0 auto;
  pointer-events: none;
  margin: 0 48px;
}

.tl-month-mark {
  position: absolute;
  top: 0;
  width: 1px;
  height: 8px;
  background: var(--mark-color);
}

.tl-month-mark::after {
  content: attr(data-label);
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: var(--fs-tick);
  color: var(--mark-label);
  white-space: nowrap;
}

/* ---- 底部 ---- */
.tl-footer {
  flex: 0 0 auto;
  padding: 4px 0 4px;
  text-align: center;
}

.tl-hint {
  font-size: var(--fs-sec);
  color: var(--muted);
  line-height: 1.5;
}

.tl-key-insight {
  font-size: var(--fs-body);
  color: var(--text);
  margin-top: 4px;
  opacity: 0;
  transition: opacity 1s ease;
  line-height: 1.5;
}

.tl-key-insight.visible {
  opacity: 1;
}

.tl-key-insight .highlight {
  color: var(--node-bright);
  font-weight: 600;
}

.tl-kbd-hint {
  font-size: var(--fs-label);
  color: rgba(255, 255, 255, 0.25);
  margin-top: 2px;
}

/* 焦点样式 */
.tl-scan-line:focus-visible {
  outline: 2px solid var(--accent-glow);
  outline-offset: 4px;
}

body {
  background: var(--bg);
  color: var(--text);
}
</style>
</head>
<body data-page="04" data-total="50">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  'use strict';

  function ready() {
    if (!window.Lec || !window.Deck) { setTimeout(ready, 50); return; }

    // 压缩年历的表示常数：365 天（仅用于年历日期显示，不作为科学口径复用）
    var COMPRESSED_YEAR_DAYS = 365;
    var COMPRESSED_YEAR_MINUTES = COMPRESSED_YEAR_DAYS * 24 * 60;

    var EARTH_AGE = Lec.K.EARTH_AGE_YEARS;

    // 事件数据（按时间顺序）
    var events = [
      { id: 'earth',    label: '地球形成', yearsAgo: EARTH_AGE },
      { id: 'life',     label: '最早生命', yearsAgo: Lec.K.FIRST_LIFE_YEARS_AGO },
      { id: 'dino',     label: '恐龙灭绝', yearsAgo: Lec.K.DINOSAURS_EXTINCT_YEARS_AGO },
      { id: 'hominin',  label: '人猿分叉', yearsAgo: Lec.K.HOMININS_SPLIT_YEARS_AGO },
      { id: 'sapiens',  label: '智人出现', yearsAgo: Lec.K.HOMO_SAPIENS_YEARS_AGO }
    ];

    // 计算每个事件的 fraction
    events.forEach(function(e) {
      if (e.id === 'earth') {
        e.fraction = 0;
      } else {
        e.fraction = Lec.P.earthFraction(e.yearsAgo);
      }
    });

    // 格式化压缩年历日期
    function calendarDate(fraction) {
      var totalMinutes = Math.floor(fraction * COMPRESSED_YEAR_MINUTES);
      totalMinutes = Math.min(totalMinutes, COMPRESSED_YEAR_MINUTES - 1);
      if (totalMinutes < 0) totalMinutes = 0;

      var dayOfYear = Math.floor(totalMinutes / (24 * 60));
      var minuteOfDay = totalMinutes % (24 * 60);
      var hour = Math.floor(minuteOfDay / 60);
      var minute = minuteOfDay % 60;

      var monthDays = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      var month = 0;
      var day = dayOfYear;
      for (var i = 0; i < 12; i++) {
        if (day < monthDays[i]) {
          month = i + 1;
          day = day + 1;
          break;
        }
        day -= monthDays[i];
      }
      if (month === 0) { month = 12; day = 31; }

      return month + '月' + day + '日 ' +
        String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
    }

    // 格式化真实年代
    function formatYearsAgo(years) {
      if (years === 0) return '现在';
      var abs = Math.abs(years);
      if (abs >= 1e8) return (abs / 1e8).toFixed(0) + '亿年前';
      if (abs >= 1e4) return (abs / 1e4).toFixed(0) + '万年前';
      return Math.round(abs) + '年前';
    }

    function formatEventYears(years) {
      return formatYearsAgo(years);
    }

    // ---- 构建 DOM ----
    var main = document.getElementById('main');
    main.innerHTML = '';

    // 挂载页眉页脚
    Lec.mount({
      index: 4,
      kicker: '深时 · 压缩年历',
      title: '把地球史，压进一年',
      sub: '智人出现在12月31日23:37',
      take: '智人出现在12月31日23:37'
    });

    // 整体容器
    var wrapper = document.createElement('div');
    wrapper.className = 'tl-wrapper';
    main.appendChild(wrapper);

    // ---- 读出行 ----
    var readout = document.createElement('div');
    readout.className = 'tl-readout';
    wrapper.appendChild(readout);

    var dateSpan = document.createElement('span');
    dateSpan.className = 'tl-readout-date';
    dateSpan.id = 'tl-date';
    dateSpan.textContent = '1月1日 00:00';
    readout.appendChild(dateSpan);

    var divider = document.createElement('span');
    divider.className = 'tl-readout-divider';
    readout.appendChild(divider);

    var yearsSpan = document.createElement('span');
    yearsSpan.className = 'tl-readout-years';
    yearsSpan.id = 'tl-years';
    yearsSpan.textContent = formatYearsAgo(EARTH_AGE);
    readout.appendChild(yearsSpan);

    // ---- 时间轴主体 ----
    var body = document.createElement('div');
    body.className = 'tl-body';
    wrapper.appendChild(body);

    // 标签区域
    var labelsArea = document.createElement('div');
    labelsArea.className = 'tl-labels-area';
    labelsArea.id = 'tl-labels-area';
    body.appendChild(labelsArea);

    // 创建标签
    var labelEls = [];
    events.forEach(function(e) {
      var label = document.createElement('div');
      label.className = 'tl-label';
      label.id = 'label-' + e.id;

      // 靠右的事件用 right 定位避免被截断
      if (e.id === 'dino') {
        label.style.left = 'auto';
        label.style.right = '80px';
      } else if (e.id === 'hominin') {
        label.style.left = 'auto';
        label.style.right = '160px';
      } else if (e.id === 'sapiens') {
        label.style.left = 'auto';
        label.style.right = '10px';
      } else {
        label.style.left = (e.fraction * 100) + '%';
      }

      var text = document.createElement('span');
      text.className = 'label-text';
      text.innerHTML = e.label;

      var yearsEl = document.createElement('span');
      yearsEl.className = 'years';
      yearsEl.textContent = formatEventYears(e.yearsAgo);
      text.appendChild(yearsEl);

      label.appendChild(text);
      labelsArea.appendChild(label);

      labelEls.push(label);
    });

    // 脚印标记（智人节点）
    var footprint = document.createElement('div');
    footprint.className = 'tl-footprint';
    footprint.id = 'tl-footprint';
    footprint.textContent = '\u{1F463}';
    footprint.style.right = '60px';
    footprint.style.top = '50%';
    footprint.style.transform = 'translateY(-50%)';
    labelsArea.appendChild(footprint);

    // 引线通过 CSS ::after 实现，不需要 SVG

    // ---- 时间轴条 ----
    var strip = document.createElement('div');
    strip.className = 'tl-strip';
    strip.id = 'tl-strip';
    body.appendChild(strip);

    // 轨道线
    var trackLine = document.createElement('div');
    trackLine.className = 'tl-track-line';
    strip.appendChild(trackLine);

    // 光迹（已过区域）
    var trail = document.createElement('div');
    trail.className = 'tl-trail';
    trail.id = 'tl-trail';
    strip.appendChild(trail);

    // 事件节点
    var nodesEl = document.createElement('div');
    nodesEl.className = 'tl-event-nodes';
    strip.appendChild(nodesEl);

    var nodeEls = [];
    events.forEach(function(e) {
      var node = document.createElement('div');
      node.className = 'tl-event-node';
      node.id = 'node-' + e.id;
      node.style.left = (e.fraction * 100) + '%';
      nodesEl.appendChild(node);
      nodeEls.push(node);
    });

    // 扫描线
    var scanLine = document.createElement('div');
    scanLine.className = 'tl-scan-line';
    scanLine.id = 'tl-scan';
    scanLine.setAttribute('tabindex', '0');
    scanLine.setAttribute('role', 'slider');
    scanLine.setAttribute('aria-label', '压缩年历扫描线');
    scanLine.setAttribute('aria-valuemin', '0');
    scanLine.setAttribute('aria-valuemax', '100');
    scanLine.setAttribute('aria-valuenow', '0');
    strip.appendChild(scanLine);

    // ---- 月份标记（独立于时间轴条下方） ----
    var marksEl = document.createElement('div');
    marksEl.className = 'tl-month-marks';
    body.appendChild(marksEl);

    // 显示月份：1月, 3月, 5月, 7月, 9月, 11月
    var monthBoundaries = [
      { month: 1, day: 0 },
      { month: 3, day: 59 },
      { month: 5, day: 120 },
      { month: 7, day: 181 },
      { month: 9, day: 243 },
      { month: 11, day: 304 }
    ];

    monthBoundaries.forEach(function(m) {
      var mark = document.createElement('div');
      mark.className = 'tl-month-mark';
      mark.setAttribute('data-label', m.month + '月');
      mark.style.left = (m.day / COMPRESSED_YEAR_DAYS * 100) + '%';
      marksEl.appendChild(mark);
    });

    // ---- 底部 ----
    var footer = document.createElement('div');
    footer.className = 'tl-footer';
    wrapper.appendChild(footer);

    var hint = document.createElement('div');
    hint.className = 'tl-hint';
    hint.textContent = '← 拖动扫描线，穿越地球的45亿年 →';
    footer.appendChild(hint);

    var insight = document.createElement('div');
    insight.className = 'tl-key-insight';
    insight.id = 'tl-insight';
    insight.innerHTML = '把地球史压进一年，<span class="highlight">智人</span>直到最后一天的最后时刻才出现。';
    footer.appendChild(insight);

    var kbdHint = document.createElement('div');
    kbdHint.className = 'tl-kbd-hint';
    kbdHint.textContent = '← → 方向键移动';
    footer.appendChild(kbdHint);

    // ---- 状态变量 ----
    var currentFraction = 0;
    var isDragging = false;
    var stripRect = null;

    // ---- 更新函数 ----
    function updatePosition(fraction) {
      fraction = Deck.clamp(fraction, 0, 1);
      currentFraction = fraction;

      // 更新扫描线位置
      scanLine.style.left = (fraction * 100) + '%';
      scanLine.setAttribute('aria-valuenow', String(Math.round(fraction * 100)));

      // 更新光迹
      trail.style.width = (fraction * 100) + '%';

      // 更新读数
      dateSpan.textContent = calendarDate(fraction);
      var yearsAgo = (1 - fraction) * EARTH_AGE;
      yearsSpan.textContent = formatYearsAgo(yearsAgo);

      // 更新节点状态
      events.forEach(function(e, i) {
        var lit = fraction >= e.fraction - 0.0001;
        nodeEls[i].classList.toggle('lit', lit);
        labelEls[i].classList.toggle('visible', lit);
      });

      // 脚印标记（智人节点）
      var sapiensLit = fraction >= events[4].fraction - 0.0001;
      footprint.classList.toggle('visible', sapiensLit);

      // 关键洞察文字
      insight.classList.toggle('visible', fraction > 0.95);
    }

    // ---- 坐标换算 ----
    function fractionFromPointer(e) {
      if (!stripRect) stripRect = strip.getBoundingClientRect();
      var pt = Deck.pt(strip, e);
      var f = pt.x / stripRect.width;
      return Deck.clamp(f, 0, 1);
    }

    function refreshRect() {
      stripRect = strip.getBoundingClientRect();
    }

    // ---- 交互：拖拽 ----
    function onPointerDown(e) {
      isDragging = true;
      refreshRect();
      var f = fractionFromPointer(e);
      updatePosition(f);
      scanLine.focus();
      e.preventDefault();
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      var f = fractionFromPointer(e);
      updatePosition(f);
      e.preventDefault();
    }

    function onPointerUp(e) {
      isDragging = false;
    }

    // 鼠标事件
    strip.addEventListener('mousedown', onPointerDown);
    document.addEventListener('mousemove', onPointerMove);
    document.addEventListener('mouseup', onPointerUp);

    // 触摸事件
    strip.addEventListener('touchstart', function(e) {
      refreshRect();
      var touch = e.touches[0];
      var f = fractionFromPointer(touch);
      isDragging = true;
      updatePosition(f);
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      var touch = e.touches[0];
      var f = fractionFromPointer(touch);
      updatePosition(f);
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchend', function(e) {
      isDragging = false;
    });

    // 键盘交互
    scanLine.addEventListener('keydown', function(e) {
      var step = 0.002;
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
        e.preventDefault();
        updatePosition(currentFraction + step);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
        e.preventDefault();
        updatePosition(currentFraction - step);
      } else if (e.key === 'Home') {
        e.preventDefault();
        updatePosition(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        updatePosition(1);
      }
    });

    // 窗口大小变化时刷新坐标
    window.addEventListener('resize', refreshRect);

    // 初始状态：显示开头
    updatePosition(0);
  }

  ready();
})();
</script>
</body>
</html>
