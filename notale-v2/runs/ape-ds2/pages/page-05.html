<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/lib/gsap.min.js"></script>
<style>
/* ==== Page 05: Midnight Magnifier — Dark Midnight Theme ==== */

:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;

  /* override theme tokens for dark midnight */
  --accent: #f0b429;           /* midnight gold */
  --accent-soft: rgba(240, 180, 41, 0.12);
  --muted: #88909c;
  --border: #2a2d35;
  --panel-bg: #13161e;
  --diff-bg: rgba(240, 180, 41, 0.08);
}

#main {
  width: 100%;
  max-width: 100%;
  height: 100%;
}

/* ---- layout: split left-right ---- */
.page-split {
  display: flex;
  flex-direction: row;
  height: 100%;
  align-items: stretch;
  gap: 0;
}

.col-left {
  flex: 0 0 55%;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-right: 0;
  min-width: 0;
}

.col-right {
  flex: 0 0 45%;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-left: 0;
  min-width: 0;
}

/* ---- connector line ---- */
.connector-wrap {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 40px;
  pointer-events: none;
  z-index: 1;
}
.connector-line {
  position: absolute;
  right: 0;
  top: 50%;
  width: 100%;
  height: 2px;
  background: linear-gradient(to right, transparent, var(--accent));
  transform: translateY(-50%);
}
.connector-line::after {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  width: 8px;
  height: 8px;
  background: var(--accent);
  border-radius: 50%;
  transform: translate(50%, -50%);
  box-shadow: 0 0 12px rgba(240, 180, 41, 0.5);
}

/* ---- timeline ---- */
.timeline-wrap {
  width: 100%;
  padding: 0 20px 0 0;
  position: relative;
}

.timeline-label-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  padding: 0 4px;
}
.timeline-label-row .label {
  font-size: var(--fs-tick);
  color: var(--muted);
  font-family: var(--font-mono, monospace);
  letter-spacing: 0.02em;
}

.timeline-track {
  position: relative;
  height: 60px;
  cursor: pointer;
  touch-action: none;
  user-select: none;
}

.timeline-bar {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  transform: translateY(-50%);
}

.timeline-bar-fill {
  position: absolute;
  right: 0;
  top: 50%;
  height: 4px;
  background: linear-gradient(to left, var(--accent), transparent);
  border-radius: 2px;
  transform: translateY(-50%);
  width: 0%;
}

/* midnight anchor */
.midnight-anchor {
  position: absolute;
  right: -2px;
  top: -8px;
  bottom: -8px;
  width: 3px;
  background: var(--accent);
  box-shadow: 0 0 12px rgba(240, 180, 41, 0.4);
  z-index: 2;
  pointer-events: none;
}
.midnight-anchor::after {
  content: '24:00';
  position: absolute;
  bottom: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: var(--fs-tick);
  color: var(--accent);
  font-family: var(--font-mono, monospace);
  white-space: nowrap;
}

/* viewfinder */
.viewfinder {
  position: absolute;
  top: -18px;
  bottom: -18px;
  width: 4px;
  z-index: 5;
  pointer-events: none;
  transition: left 0.05s linear;
}
.viewfinder-line {
  position: absolute;
  inset: 0;
  background: var(--text);
  opacity: 0.7;
  border-radius: 2px;
}
.viewfinder-bracket {
  position: absolute;
  left: -8px;
  right: -8px;
  height: 12px;
  border: 2px solid var(--text);
  opacity: 0.5;
  border-radius: 2px;
}
.viewfinder-bracket.top {
  top: -2px;
  border-bottom: none;
  border-radius: 2px 2px 0 0;
}
.viewfinder-bracket.bottom {
  bottom: -2px;
  border-top: none;
  border-radius: 0 0 2px 2px;
}

/* timeline reading */
.timeline-reading {
  margin-top: 14px;
  text-align: right;
  padding-right: 4px;
  height: 28px;
}
.timeline-reading .rl {
  font-size: var(--fs-label);
  color: var(--muted);
}
.timeline-reading .rv {
  font-size: var(--fs-lead);
  color: var(--text);
  font-weight: 600;
  font-family: var(--font-mono, monospace);
}
.timeline-reading .ru {
  font-size: var(--fs-label);
  color: var(--muted);
}

/* ---- magnifier viewport ---- */
.magnifier-wrap {
  width: 100%;
  padding: 0 0 0 20px;
  position: relative;
}

.magnifier-label {
  font-size: var(--fs-label);
  color: var(--muted);
  margin-bottom: 8px;
  letter-spacing: 0.03em;
}

.magnifier-viewport {
  position: relative;
  width: 100%;
  height: 140px;
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.magnifier-inner {
  position: absolute;
  left: 20px;
  right: 20px;
  top: 0;
  bottom: 0;
}

/* scale ticks */
.magnifier-scale {
  position: absolute;
  left: 0;
  right: 0;
  top: 30px;
  height: 40px;
}

.scale-tick {
  position: absolute;
  top: 0;
  width: 1px;
  height: 10px;
  background: var(--muted);
  opacity: 0.4;
}
.scale-tick.major {
  height: 16px;
  opacity: 0.7;
}
.scale-tick-label {
  position: absolute;
  top: 18px;
  font-size: var(--fs-tick);
  color: var(--muted);
  font-family: var(--font-mono, monospace);
  transform: translateX(-50%);
  white-space: nowrap;
}

/* timeline bar inside magnifier */
.mag-timeline-bar {
  position: absolute;
  left: 0;
  right: 0;
  top: 78px;
  height: 3px;
  background: var(--border);
  border-radius: 1.5px;
}

/* markers */
.marker {
  position: absolute;
  top: 0;
  bottom: 0;
  opacity: 0;
  pointer-events: none;
}
.marker.visible {
  opacity: 1;
}
.marker-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  border-radius: 1px;
}
.marker-label {
  position: absolute;
  top: 4px;
  left: 8px;
  font-size: var(--fs-label);
  font-weight: 600;
  white-space: nowrap;
  padding: 2px 8px;
  border-radius: 4px;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  line-height: 1.3;
}
.marker-label.flip {
  left: auto;
  right: 8px;
  text-align: right;
}
.marker-sub {
  font-size: var(--fs-label);
  font-weight: 400;
  opacity: 0.7;
  margin-left: 4px;
}

/* hs marker */
.marker-hs .marker-line {
  background: #4fc3f7;
  box-shadow: 0 0 8px rgba(79, 195, 247, 0.5);
}
.marker-hs .marker-label {
  color: #4fc3f7;
  border-left: 3px solid #4fc3f7;
}
.marker-hs .marker-label.flip {
  border-left: none;
  border-right: 3px solid #4fc3f7;
}

/* written history marker */
.marker-wh .marker-line {
  background: #ffb74d;
  box-shadow: 0 0 8px rgba(255, 183, 77, 0.5);
}
.marker-wh .marker-label {
  color: #ffb74d;
  border-left: 3px solid #ffb74d;
}
.marker-wh .marker-label.flip {
  border-left: none;
  border-right: 3px solid #ffb74d;
}
.marker-wh .marker-line-fill {
  position: absolute;
  top: 50%;
  height: 2px;
  background: #ffb74d;
  opacity: 0.4;
}

/* ---- big reading ---- */
.big-reading {
  margin-top: 16px;
  text-align: center;
}
.big-reading .br-val {
  font-size: 48px;
  font-weight: 300;
  color: var(--text);
  font-family: var(--font-mono, monospace);
  line-height: 1;
  letter-spacing: -0.02em;
}
.big-reading .br-unit {
  font-size: var(--fs-lead);
  color: var(--muted);
  margin-left: 6px;
}
.big-reading .br-label {
  display: block;
  font-size: var(--fs-label);
  color: var(--muted);
  margin-top: 4px;
}

/* ---- legend ---- */
.legend {
  display: flex;
  justify-content: center;
  gap: 28px;
  margin-top: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--fs-label);
  color: var(--muted);
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex: 0 0 auto;
}
.legend-dot.hs {
  background: #4fc3f7;
  box-shadow: 0 0 6px rgba(79, 195, 247, 0.4);
}
.legend-dot.wh {
  background: #ffb74d;
  box-shadow: 0 0 6px rgba(255, 183, 77, 0.4);
}

/* ---- key insight ---- */
.insight {
  margin-top: 18px;
  text-align: center;
  font-size: var(--fs-sec);
  color: var(--muted);
  line-height: 1.5;
  max-width: 90%;
  margin-left: auto;
  margin-right: auto;
  opacity: 0.75;
}

/* ---- reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
  .viewfinder {
    transition: none;
  }
  .marker {
    transition: opacity 0.01ms;
  }
}

/* ---- focus visible for viewfinder ---- */
.viewfinder:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}

</style>
</head>
<body data-page="05" data-total="50">
<div id="stage">
  <main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  'use strict';

  // ---- mount header/footer ----
  Lec.mount({
    title: '如果地球史是一天',
    sub: '智人出现在午夜前约 4 秒，有文字的历史只有最后 0.1 秒'
  });

  var main = document.getElementById('main');
  if (!main) return;

  // ---- constants ----
  var DAY_SECONDS = 24 * 60 * 60; // 86400
  var WRITTEN_HISTORY_YEARS = 5000; // "全套口径"

  // Compute from Lec.K
  var EARTH_AGE = Lec.K.EARTH_AGE_YEARS; // 4.54e9
  var HS_YEARS = Lec.K.HOMO_SAPIENS_YEARS_AGO; // 300000

  // Function to compute seconds before midnight for a given years-ago value
  function secsBeforeMidnight(yearsAgo) {
    var frac = Lec.P.earthFraction(yearsAgo); // fraction from start of Earth
    var secsFromStart = frac * DAY_SECONDS;
    return DAY_SECONDS - secsFromStart;
  }

  var HS_SECS = secsBeforeMidnight(HS_YEARS);   // ~5.71 sec
  var WH_SECS = secsBeforeMidnight(WRITTEN_HISTORY_YEARS); // ~0.095 sec

  // ---- build DOM ----
  main.innerHTML =
    '<div class="page-split">' +
      '<div class="col-left">' +
        '<div class="timeline-wrap" id="timelineWrap">' +
          '<div class="timeline-label-row">' +
            '<span class="label">0:00</span>' +
            '<span class="label">6:00</span>' +
            '<span class="label">12:00</span>' +
            '<span class="label">18:00</span>' +
            '<span class="label" style="opacity:0.5">24:00</span>' +
          '</div>' +
          '<div class="timeline-track" id="timelineTrack" role="slider" tabindex="0" ' +
            'aria-label="拖动查看地球史一天中的不同时刻" aria-valuemin="0" aria-valuemax="86400" aria-valuenow="86400">' +
            '<div class="timeline-bar"></div>' +
            '<div class="timeline-bar-fill" id="barFill"></div>' +
            '<div class="midnight-anchor"></div>' +
            '<div class="viewfinder" id="viewfinder">' +
              '<div class="viewfinder-bracket top"></div>' +
              '<div class="viewfinder-line"></div>' +
              '<div class="viewfinder-bracket bottom"></div>' +
            '</div>' +
          '</div>' +
          '<div class="timeline-reading" id="timelineReading">' +
            '<span class="rl">距午夜 </span>' +
            '<span class="rv" id="tlReading">0.0</span>' +
            '<span class="ru"> 秒</span>' +
          '</div>' +
        '</div>' +
        '<div class="connector-wrap">' +
          '<div class="connector-line"></div>' +
        '</div>' +
      '</div>' +
      '<div class="col-right">' +
        '<div class="magnifier-wrap" id="magnifierWrap">' +
          '<div class="magnifier-label">午夜前 20 秒 · 放大视口</div>' +
          '<div class="magnifier-viewport" id="magnifierViewport">' +
            '<div class="magnifier-inner" id="magInner">' +
              '<div class="magnifier-scale" id="magScale"></div>' +
              '<div class="mag-timeline-bar"></div>' +
              '<!-- markers -->' +
              '<div class="marker marker-hs" id="markerHs">' +
                '<div class="marker-line"></div>' +
                '<div class="marker-label">智人 <span class="marker-sub"></span></div>' +
              '</div>' +
              '<div class="marker marker-wh" id="markerWh">' +
                '<div class="marker-line"></div>' +
                '<div class="marker-label">最早的文字 <span class="marker-sub"></span></div>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="big-reading">' +
            '<span class="br-val" id="brVal">0.0</span>' +
            '<span class="br-unit">秒前</span>' +
            '<span class="br-label">距午夜</span>' +
          '</div>' +
          '<div class="legend">' +
            '<div class="legend-item"><span class="legend-dot hs"></span>智人出现</div>' +
            '<div class="legend-item"><span class="legend-dot wh"></span>最早的文字</div>' +
          '</div>' +
          '<div class="insight">人类文明不是深时的主角，它是刚落在深夜的一粒沙。</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  // ---- DOM refs ----
  var track = document.getElementById('timelineTrack');
  var viewfinder = document.getElementById('viewfinder');
  var barFill = document.getElementById('barFill');
  var tlReading = document.getElementById('tlReading');
  var brVal = document.getElementById('brVal');
  var magScale = document.getElementById('magScale');
  var markerHs = document.getElementById('markerHs');
  var markerWh = document.getElementById('markerWh');
  var magInner = document.getElementById('magInner');

  // ---- state ----
  var pos = DAY_SECONDS; // current viewfinder position (seconds from start of day)
  var isDragging = false;
  var markerHsShown = false;
  var markerWhShown = false;

  // ---- build scale ticks in magnifier ----
  function buildScale() {
    magScale.innerHTML = '';
    var tickCount = 21; // 0 to 20 seconds
    for (var i = 0; i < tickCount; i++) {
      var tick = document.createElement('div');
      tick.className = 'scale-tick' + (i % 5 === 0 ? ' major' : '');
      tick.style.left = (i / 20 * 100) + '%';
      magScale.appendChild(tick);

      if (i % 5 === 0) {
        var lbl = document.createElement('div');
        lbl.className = 'scale-tick-label';
        lbl.textContent = (20 - i) + 's';
        lbl.style.left = (i / 20 * 100) + '%';
        magScale.appendChild(lbl);
      }
    }
  }
  buildScale();

  // ---- update viewport ----
  function updateViewport() {
    var distFromMidnight = DAY_SECONDS - pos; // seconds before midnight

    // Update readings
    var displayVal = distFromMidnight < 1 ? distFromMidnight.toFixed(2) : distFromMidnight.toFixed(1);
    tlReading.textContent = displayVal;
    brVal.textContent = displayVal;

    // Update bar fill (from midnight inward)
    var fillPct = (1 - pos / DAY_SECONDS) * 100;
    barFill.style.width = fillPct + '%';

    // Update viewfinder position
    var pct = pos / DAY_SECONDS * 100;
    viewfinder.style.left = pct + '%';

    // Update magnifier scale: show 20 seconds ending at current position
    // The markers are fixed positions in the 20-second window
    var magW = magInner.offsetWidth || 500;

    // Check if markers are in the 20-second window
    // The window shows from (pos-20) to pos
    // HS marker is at DAY_SECONDS - HS_SECS
    var hsPos = DAY_SECONDS - HS_SECS; // position in day seconds
    var whPos = DAY_SECONDS - WH_SECS; // position in day seconds

    var hsInView = (pos - hsPos >= 0) && (pos - hsPos <= 20);
    var whInView = (pos - whPos >= 0) && (pos - whPos <= 20);

    // Update HS marker
    if (hsInView) {
      var hsOffset = hsPos - (pos - 20); // offset from left edge of window
      var hsPct = hsOffset / 20 * 100;
      markerHs.style.left = hsPct + '%';

      // Flip label if marker is in right half of viewport
      var hsLabelEl = markerHs.querySelector('.marker-label');
      if (hsPct > 50) {
        hsLabelEl.classList.add('flip');
      } else {
        hsLabelEl.classList.remove('flip');
      }

      // Update label with distance
      var hsLabel = markerHs.querySelector('.marker-sub');
      hsLabel.textContent = '午夜前 ' + HS_SECS.toFixed(1) + ' 秒';

      if (!markerHsShown) {
        markerHsShown = true;
        markerHs.classList.add('visible');
        // Pulse animation
        gsap.fromTo(markerHs.querySelector('.marker-line'),
          { scaleY: 0.3, opacity: 0 },
          { scaleY: 1, opacity: 1, duration: 0.5, ease: 'back.out(2)' }
        );
        gsap.fromTo(markerHs.querySelector('.marker-label'),
          { opacity: 0, x: -10 },
          { opacity: 1, x: 0, duration: 0.4, delay: 0.15, ease: 'power2.out' }
        );
        // Glow pulse
        gsap.to(markerHs.querySelector('.marker-line'), {
          boxShadow: '0 0 20px rgba(79, 195, 247, 0.8)',
          duration: 0.3,
          yoyo: true,
          repeat: 1,
          ease: 'power2.inOut'
        });
      }
    } else {
      if (markerHsShown) {
        markerHsShown = false;
        markerHs.classList.remove('visible');
      }
    }

    // Update WH marker
    if (whInView) {
      var whOffset = whPos - (pos - 20);
      var whPct = whOffset / 20 * 100;
      markerWh.style.left = whPct + '%';

      // Flip label if marker is in right half of viewport
      var whLabelEl = markerWh.querySelector('.marker-label');
      if (whPct > 50) {
        whLabelEl.classList.add('flip');
      } else {
        whLabelEl.classList.remove('flip');
      }

      var whLabel = markerWh.querySelector('.marker-sub');
      whLabel.textContent = '午夜前 ' + WH_SECS.toFixed(2) + ' 秒';

      if (!markerWhShown) {
        markerWhShown = true;
        markerWh.classList.add('visible');
        gsap.fromTo(markerWh.querySelector('.marker-line'),
          { scaleY: 0.3, opacity: 0 },
          { scaleY: 1, opacity: 1, duration: 0.5, ease: 'back.out(2)' }
        );
        gsap.fromTo(markerWh.querySelector('.marker-label'),
          { opacity: 0, x: -10 },
          { opacity: 1, x: 0, duration: 0.4, delay: 0.15, ease: 'power2.out' }
        );
        gsap.to(markerWh.querySelector('.marker-line'), {
          boxShadow: '0 0 20px rgba(255, 183, 77, 0.8)',
          duration: 0.3,
          yoyo: true,
          repeat: 1,
          ease: 'power2.inOut'
        });
      }
    } else {
      if (markerWhShown) {
        markerWhShown = false;
        markerWh.classList.remove('visible');
      }
    }

    // Update ARIA
    track.setAttribute('aria-valuenow', Math.round(pos));
  }

  // ---- position from pointer event ----
  function posFromPointer(clientX) {
    var rect = track.getBoundingClientRect();
    var scale = track.offsetWidth ? rect.width / track.offsetWidth : 1;
    var relX = (clientX - rect.left) / scale;
    var pct = Deck.clamp(relX / track.offsetWidth, 0, 1);
    return pct * DAY_SECONDS;
  }

  // ---- pointer handlers ----
  function onPointerDown(e) {
    e.preventDefault();
    isDragging = true;
    track.setPointerCapture(e.pointerId);
    var newPos = posFromPointer(e.clientX);
    pos = newPos;
    updateViewport();
  }

  function onPointerMove(e) {
    if (!isDragging) return;
    var newPos = posFromPointer(e.clientX);
    pos = newPos;
    updateViewport();
  }

  function onPointerUp(e) {
    if (!isDragging) return;
    isDragging = false;
    track.releasePointerCapture(e.pointerId);
  }

  // ---- click on track to jump ----
  function onClick(e) {
    if (isDragging) return;
    var newPos = posFromPointer(e.clientX);
    pos = newPos;
    updateViewport();
  }

  // ---- keyboard ----
  function onKeyDown(e) {
    var key = e.key;
    if (key === 'ArrowLeft') {
      e.preventDefault();
      pos = Math.max(0, pos - DAY_SECONDS / 200); // ~432 sec per step
      updateViewport();
    } else if (key === 'ArrowRight') {
      e.preventDefault();
      pos = Math.min(DAY_SECONDS, pos + DAY_SECONDS / 200);
      updateViewport();
    } else if (key === 'Home') {
      e.preventDefault();
      pos = 0;
      updateViewport();
    } else if (key === 'End') {
      e.preventDefault();
      pos = DAY_SECONDS;
      updateViewport();
    }
  }

  // ---- attach events ----
  track.addEventListener('pointerdown', onPointerDown);
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
  track.addEventListener('click', onClick);
  track.addEventListener('keydown', onKeyDown);

  // ---- initial render ----
  pos = DAY_SECONDS; // start at midnight
  updateViewport();

  // ---- initial pulse animation on load ----
  // (markers will appear immediately since we start at midnight)
  // Force the pulse on first render
  setTimeout(function() {
    if (markerHs.classList.contains('visible')) {
      gsap.fromTo(markerHs.querySelector('.marker-line'),
        { scaleY: 0.3, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.6, ease: 'back.out(2)' }
      );
      gsap.fromTo(markerHs.querySelector('.marker-label'),
        { opacity: 0, x: -10 },
        { opacity: 1, x: 0, duration: 0.4, delay: 0.2, ease: 'power2.out' }
      );
    }
    if (markerWh.classList.contains('visible')) {
      gsap.fromTo(markerWh.querySelector('.marker-line'),
        { scaleY: 0.3, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.6, ease: 'back.out(2)' }
      );
      gsap.fromTo(markerWh.querySelector('.marker-label'),
        { opacity: 0, x: -10 },
        { opacity: 1, x: 0, duration: 0.4, delay: 0.3, ease: 'power2.out' }
      );
    }
  }, 100);

})();
</script>
</body>
