<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/lib/d3.min.js"></script>
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}
#main {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  gap: 0;
  padding: 0;
  box-sizing: border-box;
}
.reading-panel {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 28px;
  box-shadow: 0 1px 2px rgba(16,24,40,0.06);
  margin-bottom: 8px;
}
.reading-panel .val {
  font-size: 26px;
  font-weight: 700;
  font-family: var(--font-mono);
  color: var(--accent);
}
.reading-panel .unit {
  font-size: var(--fs-label);
  color: var(--muted);
  margin-left: 2px;
}
.reading-panel .sep {
  font-size: 20px;
  color: var(--muted);
}
.viz-wrap {
  position: relative;
  width: 1300px;
  height: 340px;
  flex: 0 0 auto;
}
#log-axis-svg {
  display: block;
  width: 100%;
  height: 100%;
}
.ctl-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  width: 1300px;
  margin-top: 4px;
}
.ctl-row .label {
  font-size: var(--fs-label);
  color: var(--muted);
  white-space: nowrap;
  font-family: var(--font-mono);
}
.ctl-row input[type="range"] {
  flex: 1;
  height: 6px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--border);
  border-radius: 3px;
  outline: none;
  cursor: pointer;
}
.ctl-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  cursor: pointer;
}
.ctl-row input[type="range"]::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  cursor: pointer;
}
.explain-text {
  font-size: var(--fs-sec);
  color: var(--muted);
  text-align: center;
  max-width: 1000px;
  line-height: 1.5;
  margin-top: 10px;
}
/* event label tooltip */
.event-tip {
  font-size: 14px;
  font-weight: 600;
  fill: var(--accent);
}
</style>
</head>
<body data-page="06" data-total="50">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function(){
  'use strict';

  /* ===== 常量 ===== */
  var SECONDS_PER_YEAR = 365.25 * 24 * 60 * 60; // 全套口径
  var HEARTBEAT_SECONDS = 1;                     // 全套口径：教学近似

  /* ===== 事件数据 ===== */
  var events = [
    {
      id: 'heartbeat',
      label: '一次心跳',
      seconds: HEARTBEAT_SECONDS,
      logVal: 0,
      desc: '一次心跳'
    },
    {
      id: 'lifespan',
      label: '人的一生',
      seconds: 80 * SECONDS_PER_YEAR,
      logVal: Math.log10(80 * SECONDS_PER_YEAR),
      desc: '人的一生'
    },
    {
      id: 'history',
      label: '有文字的历史',
      seconds: 5000 * SECONDS_PER_YEAR,
      logVal: Math.log10(5000 * SECONDS_PER_YEAR),
      desc: '有文字的历史'
    },
    {
      id: 'earth',
      label: '地球年龄',
      seconds: Lec.K.EARTH_AGE_YEARS * SECONDS_PER_YEAR,
      logVal: Math.log10(Lec.K.EARTH_AGE_YEARS * SECONDS_PER_YEAR),
      desc: '地球年龄'
    },
    {
      id: 'universe',
      label: '宇宙年龄',
      seconds: Lec.K.UNIVERSE_AGE_YEARS * SECONDS_PER_YEAR,
      logVal: Math.log10(Lec.K.UNIVERSE_AGE_YEARS * SECONDS_PER_YEAR),
      desc: '宇宙年龄'
    }
  ];

  /* ===== 格式化 ===== */
  function fmtSci(val) {
    if (val === 0) return '0';
    if (val >= 1e15) {
      var e = Math.floor(Math.log10(val));
      var m = val / Math.pow(10, e);
      return m.toFixed(2) + ' × 10^' + e;
    }
    if (val >= 1e3) {
      return val.toExponential(2);
    }
    return val.toFixed(2);
  }

  function fmtSciShort(val) {
    if (val === 0) return '0';
    var e = Math.floor(Math.log10(val));
    var m = val / Math.pow(10, e);
    return m.toFixed(2) + 'e' + e;
  }

  /* ===== 构建 DOM ===== */
  var main = document.getElementById('main');

  // 读数面板
  var panel = document.createElement('div');
  panel.className = 'reading-panel';
  panel.innerHTML =
    '<span class="val" id="read-sec">1.00</span><span class="unit">s</span>' +
    '<span class="sep">≈</span>' +
    '<span class="val" id="read-yr">3.17e-8</span><span class="unit">yr</span>';
  main.appendChild(panel);

  // SVG 容器
  var vizWrap = document.createElement('div');
  vizWrap.className = 'viz-wrap';
  vizWrap.innerHTML = '<svg id="log-axis-svg"></svg>';
  main.appendChild(vizWrap);

  // 控件行
  var ctl = document.createElement('div');
  ctl.className = 'ctl-row';
  ctl.innerHTML =
    '<span class="label">10⁰ s</span>' +
    '<input type="range" id="log-slider" min="0" max="18" step="0.001" value="0" tabindex="0">' +
    '<span class="label">10¹⁸ s</span>';
  main.appendChild(ctl);

  // 说明文字
  var exp = document.createElement('div');
  exp.className = 'explain-text';
  exp.textContent = '拖动滑块，从一次心跳到地球年龄，时间跨度相差约 17 个数量级';
  main.appendChild(exp);

  /* ===== d3 绘图 ===== */
  var svg = d3.select('#log-axis-svg');
  var W = 1300, H = 370;
  var M = { top: 50, right: 40, bottom: 80, left: 40 };
  var innerW = W - M.left - M.right;
  var innerH = H - M.top - M.bottom;

  // 比例尺
  var xScale = d3.scaleLinear()
    .domain([0, 18])
    .range([0, innerW]);

  // 主群组
  var g = svg.append('g')
    .attr('transform', 'translate(' + M.left + ',' + M.top + ')');

  // 轴线
  var axisY = innerH * 0.55;
  g.append('line')
    .attr('x1', 0)
    .attr('y1', axisY)
    .attr('x2', innerW)
    .attr('y2', axisY)
    .attr('stroke', '#667085')
    .attr('stroke-width', 2);

  // 刻度
  var tickVals = [0, 3, 6, 9, 12, 15, 18];
  var superscripts = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};

  tickVals.forEach(function(v) {
    var x = xScale(v);
    var expStr = String(v).split('').map(function(c){ return superscripts[c] || c; }).join('');
    // 刻度线
    g.append('line')
      .attr('x1', x)
      .attr('y1', axisY + 4)
      .attr('x2', x)
      .attr('y2', axisY + 22)
      .attr('stroke', '#667085')
      .attr('stroke-width', 1.5);
    // 刻度标签
    g.append('text')
      .attr('x', x)
      .attr('y', axisY + 55)
      .attr('text-anchor', 'middle')
      .attr('fill', '#667085')
      .attr('font-size', '14px')
      .attr('font-family', 'var(--font-mono)')
      .text('10' + expStr);
  });

  // 次要刻度（每 1 格）
  for (var i = 0; i <= 18; i++) {
    if (tickVals.indexOf(i) >= 0) continue;
    var x2 = xScale(i);
    g.append('line')
      .attr('x1', x2)
      .attr('y1', axisY + 4)
      .attr('x2', x2)
      .attr('y2', axisY + 9)
      .attr('stroke', '#667085')
      .attr('stroke-width', 0.5)
      .attr('opacity', 0.3);
  }

  // 事件气泡
  var dotR = 10;
  var eventGroups = [];

  events.forEach(function(ev, i) {
    var x = xScale(ev.logVal);
    // stagger y positions for close events: heartbeat (near x=0/tick "10⁰") and earth (near universe)
    var isHeartbeat = (ev.id === 'heartbeat');
    var isUniverse = (ev.id === 'universe');
    var labelY = isUniverse ? axisY - 42 : axisY - 18;
    var valY = isUniverse ? axisY - 62 : axisY - 38;
    // heartbeat label to the right of the dot
    var labelAnchor = isHeartbeat ? 'start' : 'middle';
    var labelX = isHeartbeat ? x + 16 : x;

    // 外圈光晕
    g.append('circle')
      .attr('class', 'ev-halo ev-' + ev.id)
      .attr('cx', x)
      .attr('cy', axisY)
      .attr('r', dotR + 6)
      .attr('fill', 'none')
      .attr('stroke', '#4f6ef2')
      .attr('stroke-width', 2)
      .attr('opacity', 0);

    // 主圆点
    g.append('circle')
      .attr('class', 'ev-dot ev-' + ev.id)
      .attr('cx', x)
      .attr('cy', axisY)
      .attr('r', dotR)
      .attr('fill', '#4f6ef2')
      .attr('opacity', 0.85)
      .attr('stroke', '#fff')
      .attr('stroke-width', 2);

    // 标签
    g.append('text')
      .attr('class', 'ev-label ev-' + ev.id)
      .attr('x', labelX)
      .attr('y', labelY)
      .attr('text-anchor', labelAnchor)
      .attr('fill', '#e6e6e6')
      .attr('font-size', '14px')
      .attr('font-weight', '600')
      .text(ev.label);

    // 数值标签
    g.append('text')
      .attr('class', 'ev-val ev-' + ev.id)
      .attr('x', labelX)
      .attr('y', valY)
      .attr('text-anchor', labelAnchor)
      .attr('fill', '#667085')
      .attr('font-size', '14px')
      .attr('font-family', 'var(--font-mono)')
      .text(fmtSciShort(ev.seconds) + ' s');

    eventGroups.push({
      id: ev.id,
      logVal: ev.logVal,
      label: ev.label,
      seconds: ev.seconds
    });
  });

  // 游标组
  var cursorGroup = g.append('g').attr('class', 'cursor-group');

  // 游标竖线
  cursorGroup.append('line')
    .attr('class', 'cursor-line')
    .attr('x1', xScale(0))
    .attr('y1', axisY - 32)
    .attr('x2', xScale(0))
    .attr('y2', axisY + 4)
    .attr('stroke', '#4f6ef2')
    .attr('stroke-width', 2.5)
    .attr('stroke-dasharray', '4,3');

  // 游标圆点
  cursorGroup.append('circle')
    .attr('class', 'cursor-dot')
    .attr('cx', xScale(0))
    .attr('cy', axisY)
    .attr('r', 6)
    .attr('fill', '#4f6ef2')
    .attr('stroke', '#fff')
    .attr('stroke-width', 2.5);

  // 游标读数标签
  cursorGroup.append('text')
    .attr('class', 'cursor-read')
    .attr('x', xScale(0))
    .attr('y', axisY - 64)
    .attr('text-anchor', 'middle')
    .attr('fill', '#4f6ef2')
    .attr('font-size', '14px')
    .attr('font-weight', '700')
    .attr('font-family', 'var(--font-mono)')
    .text('1.00 s');

  // 接近事件时的提示标签
  cursorGroup.append('text')
    .attr('class', 'cursor-tip')
    .attr('x', xScale(0))
    .attr('y', axisY - 82)
    .attr('text-anchor', 'middle')
    .attr('fill', '#4f6ef2')
    .attr('font-size', '14px')
    .attr('font-weight', '600')
    .attr('opacity', 0)
    .text('');

  /* ===== 更新函数 ===== */
  var slider = document.getElementById('log-slider');
  var readSec = document.getElementById('read-sec');
  var readYr = document.getElementById('read-yr');

  function updateCursor(index) {
    var x = xScale(index);
    var seconds = Math.pow(10, index);
    var years = seconds / SECONDS_PER_YEAR;

    // 移动游标
    cursorGroup.select('.cursor-line')
      .attr('x1', x).attr('x2', x);
    cursorGroup.select('.cursor-dot')
      .attr('cx', x);
    cursorGroup.select('.cursor-read')
      .attr('x', x)
      .text(fmtSciShort(seconds) + ' s');

    // 更新读数面板
    readSec.textContent = fmtSciShort(seconds);
    readYr.textContent = fmtSciShort(years);

    // 检查事件高亮
    var closest = null;
    var minDist = Infinity;
    eventGroups.forEach(function(ev) {
      var dist = Math.abs(index - ev.logVal);
      if (dist < minDist) {
        minDist = dist;
        closest = ev;
      }
    });

    // 高亮逻辑
    eventGroups.forEach(function(ev) {
      var dot = g.select('.ev-dot.ev-' + ev.id);
      var halo = g.select('.ev-halo.ev-' + ev.id);
      var label = g.select('.ev-label.ev-' + ev.id);
      var valText = g.select('.ev-val.ev-' + ev.id);

      if (index >= ev.logVal - 0.5) {
        // 已越过或接近
        if (ev.id === closest.id && minDist < 0.5) {
          // 当前最接近的
          dot.transition().duration(200).attr('r', 13).attr('opacity', 1);
          halo.transition().duration(200).attr('opacity', 0.3);
          label.transition().duration(200).attr('fill', '#4f6ef2').attr('font-weight', '700');
          valText.transition().duration(200).attr('opacity', 1);
        } else {
          // 已越过
          dot.transition().duration(200).attr('r', 10).attr('opacity', 0.4);
          halo.transition().duration(200).attr('opacity', 0);
          label.transition().duration(200).attr('fill', '#667085').attr('font-weight', '400');
          valText.transition().duration(200).attr('opacity', 0.5);
        }
      } else {
        // 尚未到达
        dot.transition().duration(200).attr('r', 10).attr('opacity', 0.85);
        halo.transition().duration(200).attr('opacity', 0);
        label.transition().duration(200).attr('fill', '#e6e6e6').attr('font-weight', '600');
        valText.transition().duration(200).attr('opacity', 1);
      }
    });

    // 显示提示标签
    var tip = cursorGroup.select('.cursor-tip');
    if (closest && minDist < 0.3) {
      tip.attr('x', x)
        .text('← ' + closest.label)
        .transition().duration(150).attr('opacity', 1);
    } else {
      tip.transition().duration(150).attr('opacity', 0);
    }
  }

  // 滑杆事件
  slider.addEventListener('input', function() {
    var val = parseFloat(this.value);
    updateCursor(val);
  });

  // 键盘支持
  slider.addEventListener('keydown', function(e) {
    var step = 0.1;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
      e.preventDefault();
      this.value = Math.min(18, parseFloat(this.value) + step);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      e.preventDefault();
      this.value = Math.max(0, parseFloat(this.value) - step);
    } else if (e.key === 'Home') {
      e.preventDefault();
      this.value = 0;
    } else if (e.key === 'End') {
      e.preventDefault();
      this.value = 18;
    }
    this.dispatchEvent(new Event('input'));
  });

  // 初始状态：游标在略高于一次心跳的位置
  slider.value = 1.5;
  updateCursor(1.5);

  // 响应 resize
  Deck.onResize(function() {
    // 画布缩放由 base.js 处理，SVG 按百分比自适应
  });

  /* ===== mount ===== */
  Lec.mount({
    index: 6,
    kicker: '深时',
    title: '从一次心跳到地球年龄',
    take: '从一次心跳到地球年龄，时间跨度相差约 17 个数量级。演化需要的时间，远超人一生的直觉。'
  });
})();
</script>
</body>
</html>
