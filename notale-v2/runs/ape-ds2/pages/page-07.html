<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{
  --bg:        #0b0e14;
  --text:      #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}
body {
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}
#stage {
  position: relative;
}
#main {
  position: relative;
  width: 100%;
  height: 100%;
}
/* Tree SVG */
#tree-svg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: all;
}
.tree-node circle {
  fill: #4fc3f7;
  stroke: #29b6f6;
  stroke-width: 1.5;
  transition: r 0.3s;
}
.tree-node.root circle {
  fill: #81c784;
  stroke: #66bb6a;
  stroke-width: 2;
}
.tree-node.event circle {
  fill: #ffb74d;
  stroke: #ffa726;
  stroke-width: 1;
  r: 4;
}
.tree-node.highlight circle {
  fill: #fff176;
  stroke: #ffee58;
  stroke-width: 2;
  animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; r: 6; }
  50% { opacity: 0.7; r: 9; }
}
.tree-link {
  fill: none;
  stroke: #26a69a;
  stroke-width: 1.5;
  opacity: 0.5;
}
.tree-link.decorative {
  stroke: #26a69a;
  stroke-width: 0.8;
  opacity: 0.2;
  stroke-dasharray: 3 3;
}
.tree-label {
  fill: #e0e0e0;
  font-family: var(--font-sans);
  font-size: 14px;
  dominant-baseline: middle;
  text-shadow: 0 0 6px rgba(0,0,0,0.8), 0 0 12px rgba(0,0,0,0.6);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.4s;
}
.tree-label.visible {
  opacity: 1;
}
.tree-label.event-label {
  fill: #ffcc80;
  font-size: 14px;
}
.tree-label.human-label {
  fill: #fff176;
  font-size: 16px;
  font-weight: 700;
}
/* Time axis - removed, time info in node labels */
/* Overlay UI */
#breadcrumb {
  position: absolute;
  bottom: 20px;
  left: 20px;
  z-index: 10;
  font-family: var(--font-sans);
  font-size: 14px;
  color: #90a4ae;
  text-shadow: 0 0 8px rgba(0,0,0,0.9);
  pointer-events: none;
  line-height: 1.5;
}
#breadcrumb .sep {
  color: #546e7a;
  margin: 0 4px;
}
#breadcrumb .active {
  color: #e0e0e0;
  font-weight: 600;
}
#reset-btn {
  position: absolute;
  bottom: 20px;
  right: 20px;
  z-index: 10;
  background: rgba(38, 166, 154, 0.15);
  border: 1px solid rgba(38, 166, 154, 0.4);
  color: #80cbc4;
  font-family: var(--font-sans);
  font-size: 14px;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  pointer-events: all;
  transition: background 0.2s, border-color 0.2s;
}
#reset-btn:hover {
  background: rgba(38, 166, 154, 0.3);
  border-color: #26a69a;
}
#reset-btn:focus-visible {
  outline: 2px solid var(--focus, #4f6ef2);
  outline-offset: 2px;
}
#footer-note {
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  font-family: var(--font-sans);
  font-size: 14px;
  color: #455a64;
  text-shadow: 0 0 4px rgba(0,0,0,0.8);
  pointer-events: none;
  white-space: nowrap;
}
/* Decorative branch dots */
.deco-dot {
  fill: #26a69a;
  opacity: 0.15;
}
</style>
</head>
<body data-page="07" data-total="50">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  'use strict';

  // ---- mount ----
  Lec.mount({
    index: 7,
    kicker: 'DEEP TIME · 生命树',
    title: '末端一小枝',
    take: '生命树已经长到 38 亿年，「人类」只是最末端的一小枝。'
  });

  // Override kicker text (hardcoded in mount as "Apeman · Spaceman")
  var kickerEl = document.querySelector('.lec-kicker');
  if (kickerEl) kickerEl.textContent = 'DEEP TIME · 生命树';

  // ---- page constants (from p07.md spec) ----
  var PAGE = {
    BACTERIA_YEARS_AGO: 35e8,
    ARCHAEA_YEARS_AGO: 35e8,
    PHOTOSYNTHESIS_YEARS_AGO: 30e8,
    EUKARYOTES_YEARS_AGO: 20e8,
    MULTICELLULAR_YEARS_AGO: 10e8,
    PLANTS_YEARS_AGO: 10e8,
    ANIMALS_YEARS_AGO: 7e8,
    VERTEBRATES_YEARS_AGO: 5e8,
    TETRAPODS_YEARS_AGO: 3.7e8,
    LANDING_PLANTS_YEARS_AGO: 4.7e8,
    LANDING_TETRAPODS_YEARS_AGO: 3.7e8,
    DINOSAURS_APPEAR_YEARS_AGO: 2.3e8,
    MAMMALS_YEARS_AGO: 2.25e8,
    PRIMATES_YEARS_AGO: 55e6
  };

  // ---- tree data ----
  // Each node: { id, label, type: 'branch'|'event', timeYearsAgo, humanLabel? }
  // Events are side-annotations on branches, not full branches.
  // The tree is a hierarchy: root → domains → kingdoms → phyla → classes → orders → humans
  var treeData = {
    id: 'root',
    label: '生命起源',
    type: 'branch',
    timeYearsAgo: Lec.K.FIRST_LIFE_YEARS_AGO,
    children: [
      {
        id: 'bacteria',
        label: '细菌',
        type: 'branch',
        timeYearsAgo: PAGE.BACTERIA_YEARS_AGO,
        children: [
          { id: 'photosynthesis', label: '光合作用', type: 'event', timeYearsAgo: PAGE.PHOTOSYNTHESIS_YEARS_AGO }
        ]
      },
      {
        id: 'archaea',
        label: '古菌',
        type: 'branch',
        timeYearsAgo: PAGE.ARCHAEA_YEARS_AGO
      },
      {
        id: 'eukaryotes',
        label: '真核生物',
        type: 'branch',
        timeYearsAgo: PAGE.EUKARYOTES_YEARS_AGO,
        children: [
          {
            id: 'multicellular',
            label: '多细胞生物',
            type: 'branch',
            timeYearsAgo: PAGE.MULTICELLULAR_YEARS_AGO,
            children: [
              {
                id: 'plants',
                label: '植物',
                type: 'branch',
                timeYearsAgo: PAGE.PLANTS_YEARS_AGO,
                children: [
                  { id: 'plant_landing', label: '植物登陆', type: 'event', timeYearsAgo: PAGE.LANDING_PLANTS_YEARS_AGO }
                ]
              },
              {
                id: 'animals',
                label: '动物',
                type: 'branch',
                timeYearsAgo: PAGE.ANIMALS_YEARS_AGO,
                children: [
                  {
                    id: 'vertebrates',
                    label: '脊椎动物',
                    type: 'branch',
                    timeYearsAgo: PAGE.VERTEBRATES_YEARS_AGO,
                    children: [
                      {
                        id: 'tetrapods',
                        label: '四足动物',
                        type: 'branch',
                        timeYearsAgo: PAGE.TETRAPODS_YEARS_AGO,
                        children: [
                          { id: 'animal_landing', label: '动物登陆', type: 'event', timeYearsAgo: PAGE.LANDING_TETRAPODS_YEARS_AGO },
                          {
                            id: 'dinosaurs',
                            label: '恐龙',
                            type: 'branch',
                            timeYearsAgo: PAGE.DINOSAURS_APPEAR_YEARS_AGO,
                            children: [
                              { id: 'dino_extinct', label: '恐龙灭绝', type: 'event', timeYearsAgo: Lec.K.DINOSAURS_EXTINCT_YEARS_AGO }
                            ]
                          },
                          {
                            id: 'mammals',
                            label: '哺乳类',
                            type: 'branch',
                            timeYearsAgo: PAGE.MAMMALS_YEARS_AGO,
                            children: [
                              {
                                id: 'primates',
                                label: '灵长类',
                                type: 'branch',
                                timeYearsAgo: PAGE.PRIMATES_YEARS_AGO
                              },
                              {
                                id: 'humans',
                                label: '人类',
                                type: 'branch',
                                timeYearsAgo: Lec.K.HOMININS_SPLIT_YEARS_AGO,
                                humanLabel: '人类 —— 约 700 万年前；智人 20 万年前',
                                extra: 'HOMO_SAPIENS_YEARS_AGO: ' + Lec.K.HOMO_SAPIENS_YEARS_AGO
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ]
  };

  // ---- build the tree ----
  var main = document.getElementById('main');
  var W = 1600;
  var H = 900;
  var margin = { top: 60, right: 80, bottom: 40, left: 60 };

  var svg = d3.select('#main')
    .append('svg')
    .attr('id', 'tree-svg')
    .attr('viewBox', '0 0 ' + W + ' ' + H)
    .attr('preserveAspectRatio', 'xMidYMid meet')
    .style('position', 'absolute')
    .style('top', '0')
    .style('left', '0')
    .style('width', '100%')
    .style('height', '100%');

  // ---- helper: format time ----
  function fmtTime(years) {
    if (years >= 1e8) return '约 ' + (years / 1e8).toFixed(1) + ' 亿年前';
    if (years >= 1e7) return '约 ' + (years / 1e7).toFixed(1) + ' 亿年前';
    if (years >= 1e6) return '约 ' + (years / 1e6).toFixed(0) + ' 万年前';
    if (years >= 1e4) return '约 ' + (years / 1e4).toFixed(0) + ' 万年前';
    return '约 ' + (years / 1e3).toFixed(0) + ' 千年前';
  }

  // ---- compute hierarchy ----
  var root = d3.hierarchy(treeData);
  var treeLayout = d3.tree()
    .size([H - margin.top - margin.bottom, W - margin.left - margin.right])
    .separation(function(a, b) {
      // Events are close to their parent; branches spread more
      var base = (a.parent === b.parent) ? 1.2 : 2;
      if (a.data.type === 'event' || b.data.type === 'event') return base * 0.6;
      return base;
    });

  root = treeLayout(root);

  // Swap x/y for horizontal tree (left-to-right)
  root.each(function(d) {
    var tmp = d.x;
    d.x = d.y + margin.left;
    d.y = tmp + margin.top;
  });

  // ---- time-based x adjustment ----
  // The tree layout gives x based on depth, but we want x to roughly
  // correspond to time (older = left, newer = right).
  // We'll nudge each node's x based on its time value.
  var timeMin = Lec.K.FIRST_LIFE_YEARS_AGO; // 38亿
  var timeMax = 0; // present
  var xMin = margin.left + 40;
  var xMax = W - margin.right - 40;

  root.each(function(d) {
    if (d.data.timeYearsAgo != null) {
      var t = d.data.timeYearsAgo;
      // Map time to x: 0=present(right), max=oldest(left)
      var frac = 1 - (t - timeMax) / (timeMin - timeMax);
      var timeX = xMin + frac * (xMax - xMin);
      // Blend: 60% tree layout x + 40% time-based x
      d.x = d.x * 0.4 + timeX * 0.6;
    }
  });

  // ---- assign depth levels ----
  root.each(function(d) {
    d.depthLevel = d.depth;
    if (d.data.type === 'event') d.depthLevel = d.parent ? d.parent.depthLevel + 0.5 : 0.5;
  });

  // ---- zoom thresholds per depth ----
  // Depth 0 (root): visible at k >= 0.4
  // Depth 1 (domains): visible at k >= 1.2
  // Depth 2 (multicellular): visible at k >= 2.5
  // Depth 3 (plants, animals): visible at k >= 4
  // Depth 4 (vertebrates, tetrapods): visible at k >= 6
  // Depth 5 (dinosaurs, mammals): visible at k >= 10
  // Depth 6 (primates, humans): visible at k >= 16
  // Events: visible at their parent's depth + 0.5
  function getDepthThreshold(depthLevel) {
    if (depthLevel <= 0) return 0.2;   // root always visible
    if (depthLevel <= 1) return 0.8;   // 3 domains visible in panorama
    if (depthLevel <= 2) return 2.2;   // multicellular
    if (depthLevel <= 3) return 3.5;   // plants, animals
    if (depthLevel <= 4) return 5.5;   // vertebrates, tetrapods
    if (depthLevel <= 5) return 9;     // dinosaurs, mammals
    return 15;                           // primates, humans
  }

  // ---- draw links ----
  var linkGroup = svg.append('g').attr('class', 'links');

  function linkPath(d) {
    var p = d.parent;
    if (!p) return '';
    // Slight curve: cubic bezier
    var mx = (d.x + p.x) / 2;
    return 'M' + p.x + ',' + p.y +
           'C' + (p.x + (d.x - p.x) * 0.3) + ',' + p.y +
           ' ' + (p.x + (d.x - p.x) * 0.7) + ',' + d.y +
           ' ' + d.x + ',' + d.y;
  }

  linkGroup.selectAll('path')
    .data(root.links())
    .join('path')
    .attr('class', 'tree-link')
    .attr('d', function(d) { return linkPath(d.target); });

  // ---- decorative extra branches ----
  // Add a few unlabeled branches from main nodes to convey "tree is huge"
  var decoBranches = [
    { from: 'bacteria', count: 3, spread: 60 },
    { from: 'archaea', count: 2, spread: 40 },
    { from: 'eukaryotes', count: 4, spread: 80 },
    { from: 'multicellular', count: 3, spread: 50 },
    { from: 'animals', count: 3, spread: 60 },
    { from: 'tetrapods', count: 2, spread: 40 },
    { from: 'mammals', count: 2, spread: 30 }
  ];

  var decoGroup = svg.append('g').attr('class', 'deco-branches');

  var nodesMap = {};
  root.each(function(d) { nodesMap[d.data.id] = d; });

  decoBranches.forEach(function(b) {
    var parent = nodesMap[b.from];
    if (!parent) return;
    var rng = seedRandom('deco-' + b.from);
    for (var i = 0; i < b.count; i++) {
      var yOff = (rng() - 0.5) * b.spread;
      var xOff = 30 + rng() * 60;
      var endX = parent.x + xOff;
      var endY = parent.y + yOff;
      // Short branch
      decoGroup.append('path')
        .attr('class', 'tree-link decorative')
        .attr('d', 'M' + parent.x + ',' + parent.y +
               'C' + (parent.x + xOff * 0.3) + ',' + parent.y +
               ' ' + (parent.x + xOff * 0.7) + ',' + endY +
               ' ' + endX + ',' + endY);
      decoGroup.append('circle')
        .attr('class', 'deco-dot')
        .attr('cx', endX)
        .attr('cy', endY)
        .attr('r', 1.5 + rng() * 2);
    }
  });

  // ---- draw nodes ----
  var nodeGroup = svg.append('g').attr('class', 'nodes');

  // Determine which nodes are highlighted (key events + human)
  var highlightIds = {
    photosynthesis: true,
    plant_landing: true,
    animal_landing: true,
    dino_extinct: true,
    humans: true
  };

  nodeGroup.selectAll('g')
    .data(root.descendants())
    .join('g')
    .attr('class', function(d) {
      var cls = 'tree-node';
      if (d.data.type === 'event') cls += ' event';
      if (d.depth === 0) cls += ' root';
      if (highlightIds[d.data.id]) cls += ' highlight';
      return cls;
    })
    .attr('transform', function(d) { return 'translate(' + d.x + ',' + d.y + ')'; })
    .each(function(d) {
      var el = d3.select(this);
      var isEvent = d.data.type === 'event';
      var isRoot = d.depth === 0;
      var r = isEvent ? 4 : (isRoot ? 8 : 5);
      if (highlightIds[d.data.id]) r = isEvent ? 5 : 7;
      el.append('circle')
        .attr('r', r)
        .attr('data-id', d.data.id);
    });

  // ---- labels ----
  var labelGroup = svg.append('g').attr('class', 'labels');

  function getNodeLabel(d) {
    if (d.data.humanLabel) return d.data.humanLabel;
    if (d.data.type === 'event') return d.data.label;
    if (d.data.label) {
      var timeStr = '';
      if (d.data.timeYearsAgo != null) {
        timeStr = ' ' + fmtTime(d.data.timeYearsAgo);
      }
      return d.data.label + timeStr;
    }
    return '';
  }

  labelGroup.selectAll('text')
    .data(root.descendants())
    .join('text')
    .attr('class', function(d) {
      var cls = 'tree-label';
      if (d.data.type === 'event') cls += ' event-label';
      if (d.data.id === 'humans') cls += ' human-label';
      return cls;
    })
    .attr('x', function(d) {
      var offset = (d.data.type === 'event') ? 8 : 10;
      // Position human label to the left (it's near the right edge)
      if (d.data.id === 'humans') return d.x - offset;
      return d.x + offset;
    })
    .attr('y', function(d) { return d.y; })
    .attr('text-anchor', function(d) {
      if (d.data.id === 'humans') return 'end';
      return 'start';
    })
    .text(function(d) { return getNodeLabel(d); });

  // ---- time axis ticks ----
  // Not drawn: time information is encoded in node labels.
  // Removing to avoid overlap with tree nodes.

  // ---- zoom behavior ----
  var zoomG = svg.append('g').attr('class', 'zoom-g');
  // Move all existing elements into zoomG
  zoomG.append(function() { return linkGroup.node(); });
  zoomG.append(function() { return decoGroup.node(); });
  zoomG.append(function() { return nodeGroup.node(); });
  zoomG.append(function() { return labelGroup.node(); });

  // Compute initial zoom to fit the whole tree
  var padding = 80;
  var treeExtent = { x1: Infinity, y1: Infinity, x2: -Infinity, y2: -Infinity };
  root.each(function(d) {
    if (d.x < treeExtent.x1) treeExtent.x1 = d.x;
    if (d.y < treeExtent.y1) treeExtent.y1 = d.y;
    if (d.x > treeExtent.x2) treeExtent.x2 = d.x;
    if (d.y > treeExtent.y2) treeExtent.y2 = d.y;
  });
  var treeW = treeExtent.x2 - treeExtent.x1 + padding * 2;
  var treeH = treeExtent.y2 - treeExtent.y1 + padding * 2;
  var initScale = Math.min(W / treeW, H / treeH, 1.2);
  var initX = (W - (treeExtent.x1 + treeExtent.x2)) / 2;
  var initY = (H - (treeExtent.y1 + treeExtent.y2)) / 2;

  var zoomBehavior = d3.zoom()
    .scaleExtent([0.3, 40])
    .on('zoom', zoomed);

  svg.call(zoomBehavior);

  // Set initial transform
  svg.call(zoomBehavior.transform, d3.zoomIdentity.translate(initX, initY).scale(initScale));

  // ---- breadcrumb ----
  var breadcrumb = document.createElement('div');
  breadcrumb.id = 'breadcrumb';
  breadcrumb.innerHTML = '<span class="active">全景</span>';
  main.appendChild(breadcrumb);

  // ---- reset button ----
  var resetBtn = document.createElement('button');
  resetBtn.id = 'reset-btn';
  resetBtn.textContent = '回到全景';
  resetBtn.setAttribute('tabindex', '0');
  main.appendChild(resetBtn);
  resetBtn.addEventListener('click', function() {
    svg.transition().duration(500).call(zoomBehavior.transform, d3.zoomIdentity.translate(initX, initY).scale(initScale));
  });

  // ---- footer note ----
  var footerNote = document.createElement('div');
  footerNote.id = 'footer-note';
  footerNote.textContent = '示意树，分支点时间约数，不按精确比例';
  main.appendChild(footerNote);

  // ---- zoom handler ----
  function zoomer(event) {
    var t = event.transform;
    zoomG.attr('transform', t);
    updateVisibility(t.k);
    updateBreadcrumb(t);
  }

  var zoomed = zoomer;

  // ---- update label visibility based on zoom level ----
  function updateVisibility(k) {
    labelGroup.selectAll('text')
      .attr('class', function(d) {
        var cls = 'tree-label';
        if (d.data.type === 'event') cls += ' event-label';
        if (d.data.id === 'humans') cls += ' human-label';
        var threshold = getDepthThreshold(d.depthLevel);
        if (k >= threshold) cls += ' visible';
        return cls;
      });
    // Also update node opacity
    nodeGroup.selectAll('g')
      .style('opacity', function(d) {
        var threshold = getDepthThreshold(d.depthLevel);
        return k >= threshold ? 1 : 0.15;
      });
  }

  // ---- update breadcrumb ----
  function updateBreadcrumb(t) {
    var k = t.k;
    // Find the deepest visible branch node (not event)
    var deepest = null;
    root.each(function(d) {
      if (d.data.type === 'event') return;
      var threshold = getDepthThreshold(d.depthLevel);
      if (k >= threshold && d.data.label) {
        if (!deepest || d.depthLevel > deepest.depthLevel) {
          deepest = d;
        }
      }
    });

    if (!deepest) {
      breadcrumb.innerHTML = '<span class="active">全景</span>';
      return;
    }

    // Trace path from root to deepest
    var path = [];
    var node = deepest;
    while (node) {
      if (node.data.label) {
        path.unshift({ label: node.data.label, id: node.data.id });
      }
      node = node.parent;
    }

    var html = '';
    for (var i = 0; i < path.length; i++) {
      if (i > 0) html += '<span class="sep">/</span>';
      var cls = (i === path.length - 1) ? 'active' : '';
      html += '<span class="' + cls + '">' + path[i].label + '</span>';
    }
    breadcrumb.innerHTML = html;
  }

  // ---- click on node to zoom ----
  nodeGroup.selectAll('g')
    .style('cursor', function(d) {
      return d.data.type === 'event' ? 'default' : 'pointer';
    })
    .on('click', function(event, d) {
      if (d.data.type === 'event') return;
      event.stopPropagation();
      // Zoom to this node: center it and zoom to reveal its children
      // Compute bounding box of node and its children
      var xMin = d.x, xMax = d.x, yMin = d.y, yMax = d.y;
      if (d.children) {
        d.children.forEach(function(c) {
          if (c.x < xMin) xMin = c.x;
          if (c.x > xMax) xMax = c.x;
          if (c.y < yMin) yMin = c.y;
          if (c.y > yMax) yMax = c.y;
        });
      }
      var cw = Math.max(xMax - xMin + 80, 160);
      var ch = Math.max(yMax - yMin + 60, 60);
      var scale = Math.min(W / cw, H / ch, 30);
      // Ensure minimum zoom to reveal next level
      var nextThreshold = getDepthThreshold(d.depthLevel + 1);
      scale = Math.max(scale, nextThreshold * 1.1);
      scale = Math.min(scale, 30);
      var tx = W / 2 - d.x * scale;
      var ty = H / 2 - d.y * scale;
      svg.transition().duration(500)
        .call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
    });

  // ---- initial visibility ----
  updateVisibility(initScale);

  // ---- keyboard for zoom ----
  svg.attr('tabindex', '0');
  svg.on('keydown', function(event) {
    if (event.key === '+' || event.key === '=') {
      event.preventDefault();
      zoomBehavior.scaleBy(svg, 1.3);
    } else if (event.key === '-') {
      event.preventDefault();
      zoomBehavior.scaleBy(svg, 1 / 1.3);
    } else if (event.key === 'r' || event.key === 'R') {
      resetBtn.click();
    }
  });

  // ---- seedRandom for decorative branches ----
  function seedRandom(seed) {
    var s = 0;
    for (var i = 0; i < seed.length; i++) {
      s = ((s * 31) + seed.charCodeAt(i)) & 0x7fffffff;
    }
    return function() {
      s = (s * 1664525 + 1013904223) & 0x7fffffff;
      return s / 0x7fffffff;
    };
  }

  // ---- supporting: Deck.init for keyboard nav ----
  Deck.init({ index: 7, total: 50 });

})();
</script>
