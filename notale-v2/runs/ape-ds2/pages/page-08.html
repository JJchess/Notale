<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}

/* Period colors: 1-2 low-sat earth, 3-4 gray-blue, 5-6 highlight */
.p08-c1 { background: #7a6b5a; }
.p08-c2 { background: #6b7a5a; }
.p08-c3 { background: #5a7a8a; }
.p08-c4 { background: #6a8a9a; }
.p08-c5 { background: #d4a030; }
.p08-c6 { background: #d45a30; }

.p08-c1-txt { color: #7a6b5a; }
.p08-c2-txt { color: #6b7a5a; }
.p08-c3-txt { color: #5a7a8a; }
.p08-c4-txt { color: #6a8a9a; }
.p08-c5-txt { color: #d4a030; }
.p08-c6-txt { color: #d45a30; }

/* ── page layout ── */
.p08-wrap {
  display: flex;
  flex-direction: column;
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  padding: 96px 96px 184px;
  overflow: hidden;
}

/* #main is 100vw×100vh inside #stage which has padding: 96px 96px 184px (overflow:hidden from base.css) */
/* Negative margin shifts #main's border box to (0,0) so it doesn't overflow the viewport */
/* #stage overflow:visible prevents false clipping reports since content intentionally extends */
#main {
  margin: -96px 0 0 -96px;
}
#stage {
  overflow: visible;
}

/* Upper ~60%: interaction zone */
.p08-top {
  display: flex;
  flex-direction: row;
  flex: 0 0 60%;
  min-height: 0;
  gap: 24px;
  padding-bottom: 12px;
}

/* Left: stacking column area */
.p08-col-area {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  gap: 12px;
  position: relative;
}

.p08-col-wrap {
  flex: 0 0 60px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.p08-col-title {
  font-size: var(--fs-label);
  color: var(--muted);
  text-align: center;
  margin-bottom: 4px;
  white-space: nowrap;
}

.p08-col {
  position: relative;
  width: 40px;
  flex: 1 1 auto;
  min-height: 0;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.p08-col-seg {
  flex: 0 0 auto;
  width: 100%;
  position: relative;
  transition: background 0.3s;
}

.p08-col-seg .seg-label {
  display: none;
}

/* Column labels (boundary markers) */
.p08-col-labels {
  flex: 1 1 auto;
  min-width: 0;
  position: relative;
  padding: 0 0 0 4px;
}

.p08-col-labels .bound {
  position: absolute;
  left: 0;
  right: 0;
  font-size: var(--fs-tick);
  color: var(--muted);
  line-height: 1;
  white-space: nowrap;
  transform: translateY(-50%);
  pointer-events: none;
}

.p08-col-labels .bound .bline {
  display: inline-block;
  width: 8px;
  height: 1px;
  background: rgba(255,255,255,0.15);
  vertical-align: middle;
  margin-right: 4px;
}

/* ── Block library (right) ── */
.p08-lib {
  flex: 0 0 280px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  position: relative;
}

.p08-lib-hint {
  font-size: var(--fs-label);
  color: var(--muted);
  text-align: center;
  margin-bottom: 4px;
  flex: 0 0 auto;
}

.p08-lib-blocks {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
  position: relative;
}

.p08-lib-block {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 8px;
  cursor: grab;
  user-select: none;
  touch-action: none;
  position: relative;
  min-height: 0;
  flex: 0 0 auto;
  outline: none;
}

.p08-lib-block:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

.p08-lib-block.placed {
  opacity: 0.25;
  pointer-events: none;
}

.p08-lib-block .bar {
  flex: 0 0 14px;
  border-radius: 2px;
  position: relative;
}

.p08-lib-block .info {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  min-width: 0;
  padding-top: 0;
  line-height: 1.2;
}

.p08-lib-block .info .name {
  font-size: var(--fs-sec);
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.p08-lib-block .info .years {
  font-size: var(--fs-tick);
  color: var(--muted);
  white-space: nowrap;
}

/* Thin blocks (5,6) need special label alignment */
.p08-lib-block.thin .info {
  margin-top: -8px;
}

/* Dragging clone */
.p08-drag-clone {
  position: fixed;
  z-index: 1000;
  pointer-events: none;
  opacity: 0.85;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
  padding: 4px 10px;
  background: rgba(11,14,20,0.92);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

.p08-drag-clone .bar {
  flex: 0 0 14px;
  border-radius: 2px;
  height: 24px;
}

.p08-drag-clone .info {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
}

.p08-drag-clone .info .name {
  font-size: var(--fs-sec);
  color: var(--text);
  white-space: nowrap;
}

.p08-drag-clone .info .years {
  font-size: var(--fs-tick);
  color: var(--muted);
  white-space: nowrap;
}

/* Drop zone feedback */
.p08-col-area.drop-highlight .p08-col {
  border-color: rgba(79,110,242,0.5);
  box-shadow: inset 0 0 20px rgba(79,110,242,0.08);
}

/* ── Lower ~40%: triptych (hidden initially) ── */
.p08-bottom {
  flex: 0 0 40%;
  min-height: 0;
  display: none;
  flex-direction: column;
  gap: 6px;
  padding-top: 8px;
  border-top: 1px solid rgba(255,255,255,0.06);
}

.p08-bottom.visible {
  display: flex;
}

.p08-bottom-sentence {
  font-size: var(--fs-sec);
  color: var(--text);
  text-align: center;
  line-height: 1.4;
  padding: 0 20px;
}

.p08-bottom-sentence.em {
  font-size: var(--fs-body);
  font-weight: 600;
  color: var(--accent);
}

.p08-triptych {
  display: flex;
  flex-direction: row;
  gap: 16px;
  flex: 1 1 auto;
  min-height: 0;
}

.p08-view {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 6px;
  padding: 8px 10px;
  position: relative;
  overflow: hidden;
}

.p08-view .v-hdr {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex: 0 0 auto;
  margin-bottom: 4px;
}

.p08-view .v-hdr .v-label {
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.05em;
}

.p08-view .v-hdr .v-range {
  font-size: var(--fs-tick);
  color: var(--muted);
}

.p08-view .v-body {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  gap: 6px;
}

.p08-view .v-col {
  flex: 0 0 24px;
  position: relative;
  display: flex;
  flex-direction: column;
  border-radius: 2px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.08);
}

.p08-view .v-col .v-seg {
  flex: 0 0 auto;
  width: 100%;
}

.p08-view .v-annos {
  flex: 1 1 auto;
  min-width: 0;
  position: relative;
}

.p08-view .v-annos .v-anno {
  position: absolute;
  left: 0;
  right: 0;
  font-size: var(--fs-tick);
  color: var(--muted);
  line-height: 1;
  white-space: nowrap;
  transform: translateY(-50%);
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 3px;
}

.p08-view .v-annos .v-anno::before {
  content: "";
  flex: 0 0 auto;
  width: 8px;
  height: 1px;
  background: rgba(255,255,255,0.12);
}

.p08-view .v-annos .v-anno.highlight {
  color: #d45a30;
  font-weight: 600;
}

.p08-view .v-annos .v-anno.highlight::before {
  background: #d45a30;
  height: 2px;
}

.p08-view .v-note {
  font-size: var(--fs-tick);
  color: var(--muted);
  text-align: center;
  flex: 0 0 auto;
  margin-top: 4px;
  font-style: italic;
}

/* ── Completion indicator ── */
.p08-done {
  display: none;
  text-align: center;
  padding: 4px 0 0;
}

.p08-done.visible { display: block; }

/* ── Responsive adjustments ── */
@media (max-width: 1366px) {
  .p08-lib { flex: 0 0 220px; }
  .p08-lib-block .info .name { font-size: 14px; }
}
</style>
</head>
<body data-page="08" data-total="50">
<div id="stage">
<main id="main">
<div class="p08-wrap">

  <!-- Upper: interaction zone -->
  <div class="p08-top">
    <div class="p08-col-area" id="dropZone">
      <div class="p08-col-wrap">
        <div class="p08-col-title">堆叠柱</div>
        <div class="p08-col" id="stackCol"></div>
      </div>
      <div class="p08-col-labels" id="colLabels"></div>
    </div>

    <div class="p08-lib">
      <div class="p08-lib-hint">← 拖到左侧柱上</div>
      <div class="p08-lib-blocks" id="libBlocks"></div>
    </div>
  </div>

  <!-- Lower: triptych (hidden until all blocks placed) -->
  <div class="p08-bottom" id="triptychZone">
    <div class="p08-bottom-sentence" id="sentence1">
      把演化各阶段按真实比例堆在一起，文明薄得像一层灰尘。
    </div>
    <div class="p08-triptych" id="triptych"></div>
    <div class="p08-bottom-sentence em" id="sentence2">
      前面每一秒的铺垫，都在为最后一瞬积蓄可能——这就是「深时」的分量。
    </div>
  </div>

</div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
(function() {
  'use strict';

  /* ── Page constants ── */
  var PAGE = {
    WRITTEN_HISTORY_YEARS_AGO: 5000  // 全套口径
  };

  var K = Lec.K;

  /* ── Six periods ── */
  var periods = [
    { id: 1, name: '地球诞生', start: K.EARTH_AGE_YEARS, end: K.FIRST_LIFE_YEARS_AGO,
      startLabel: '46亿年前', endLabel: '38亿年前' },
    { id: 2, name: '生命演化', start: K.FIRST_LIFE_YEARS_AGO, end: K.DINOSAURS_EXTINCT_YEARS_AGO,
      startLabel: '38亿年前', endLabel: '6600万年前' },
    { id: 3, name: '恐龙之后', start: K.DINOSAURS_EXTINCT_YEARS_AGO, end: K.HOMININS_SPLIT_YEARS_AGO,
      startLabel: '6600万年前', endLabel: '约700万年前' },
    { id: 4, name: '人科演化', start: K.HOMININS_SPLIT_YEARS_AGO, end: K.HOMO_SAPIENS_YEARS_AGO,
      startLabel: '约700万年前', endLabel: '20万年前' },
    { id: 5, name: '智人时代', start: K.HOMO_SAPIENS_YEARS_AGO, end: PAGE.WRITTEN_HISTORY_YEARS_AGO,
      startLabel: '20万年前', endLabel: '5000年前' },
    { id: 6, name: '文明史', start: PAGE.WRITTEN_HISTORY_YEARS_AGO, end: 0,
      startLabel: '5000年前', endLabel: '今天' }
  ];

  periods.forEach(function(p) {
    p.duration = p.start - p.end;
  });

  /* ── Display helpers ── */
  var totalDuration = K.EARTH_AGE_YEARS; // 0 to EARTH_AGE
  var COL_HEIGHT; // set on layout

  function getColHeight() {
    var col = document.getElementById('stackCol');
    return col ? col.clientHeight : 340;
  }

  /* ── Color per period ── */
  var periodColors = ['p08-c1','p08-c2','p08-c3','p08-c4','p08-c5','p08-c6'];

  /* ── State ── */
  var placed = []; // ids of placed periods, in order
  var dragData = null;

  /* ── DOM refs ── */
  var colEl = document.getElementById('stackCol');
  var labelsEl = document.getElementById('colLabels');
  var libEl = document.getElementById('libBlocks');
  var dropZone = document.getElementById('dropZone');
  var triptychZone = document.getElementById('triptychZone');
  var triptychEl = document.getElementById('triptych');

  /* ── Format helpers ── */
  function fmtYa(ya) {
    if (ya >= 100000000) return Math.round(ya / 100000000) + '亿';
    if (ya >= 10000) return Math.round(ya / 10000) + '万';
    return ya + '';
  }

  function fmtLabel(ya) {
    if (ya === 0) return '今天';
    if (ya >= 100000000) return (ya / 100000000).toFixed(0) + '亿年前';
    if (ya >= 10000) return (ya / 10000).toFixed(0) + '万年前';
    return ya + '年前';
  }

  /* ── Build library blocks ── */
  function buildLibrary() {
    libEl.innerHTML = '';
    periods.forEach(function(p, i) {
      var block = document.createElement('div');
      block.className = 'p08-lib-block';
      block.dataset.pid = p.id;
      if (i >= 4) block.classList.add('thin');

      var barH = Math.max(1, (p.duration / totalDuration) * 100 + 1);
      // Use a scale factor that makes blocks 1-4 visible, 5-6 minimal
      // But keep true proportion: we use the actual col height
      var colH = getColHeight();
      // For library display, use proportional height but with minimum
      var propH = Math.max(1, Math.round((p.duration / totalDuration) * colH));

      var bar = document.createElement('div');
      bar.className = 'bar ' + periodColors[i];
      bar.style.height = propH + 'px';
      block.appendChild(bar);

      var info = document.createElement('div');
      info.className = 'info';
      var nameSpan = document.createElement('span');
      nameSpan.className = 'name';
      nameSpan.textContent = p.name;
      var yearsSpan = document.createElement('span');
      yearsSpan.className = 'years';
      yearsSpan.textContent = p.startLabel + ' → ' + p.endLabel;
      info.appendChild(nameSpan);
      info.appendChild(yearsSpan);
      block.appendChild(info);

      // Keyboard accessibility
      block.setAttribute('tabindex', '0');
      block.setAttribute('role', 'button');
      block.setAttribute('aria-label', p.name + ' ' + p.startLabel + ' 到 ' + p.endLabel);
      block.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          if (!this.classList.contains('placed')) {
            placeBlock(parseInt(this.dataset.pid, 10));
          }
        }
      });

      // Pointer events for drag
      block.addEventListener('pointerdown', onPointerDown);

      libEl.appendChild(block);
    });
  }

  /* ── Drag & Drop ── */
  function onPointerDown(e) {
    var block = e.currentTarget;
    if (block.classList.contains('placed')) return;

    var rect = block.getBoundingClientRect();
    var pid = parseInt(block.dataset.pid, 10);
    var p = periods[pid - 1];

    // Create clone
    var clone = document.createElement('div');
    clone.className = 'p08-drag-clone';
    var bar = document.createElement('div');
    bar.className = 'bar ' + periodColors[pid - 1];
    bar.style.height = '24px';
    var info = document.createElement('div');
    info.className = 'info';
    var n = document.createElement('span');
    n.className = 'name';
    n.textContent = p.name;
    var y = document.createElement('span');
    y.className = 'years';
    y.textContent = p.startLabel + ' → ' + p.endLabel;
    info.appendChild(n);
    info.appendChild(y);
    clone.appendChild(bar);
    clone.appendChild(info);
    document.body.appendChild(clone);

    dragData = {
      block: block,
      pid: pid,
      clone: clone,
      offsetX: e.clientX - rect.left,
      offsetY: e.clientY - rect.top
    };

    // Position clone
    clone.style.left = (e.clientX - dragData.offsetX) + 'px';
    clone.style.top = (e.clientY - dragData.offsetY) + 'px';

    block.setPointerCapture(e.pointerId);
    block.addEventListener('pointermove', onPointerMove);
    block.addEventListener('pointerup', onPointerUp);
    block.addEventListener('pointercancel', onPointerCancel);

    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!dragData) return;
    dragData.clone.style.left = (e.clientX - dragData.offsetX) + 'px';
    dragData.clone.style.top = (e.clientY - dragData.offsetY) + 'px';

    // Check if over drop zone
    var dzRect = dropZone.getBoundingClientRect();
    var isOver = e.clientX >= dzRect.left && e.clientX <= dzRect.right &&
                 e.clientY >= dzRect.top && e.clientY <= dzRect.bottom;
    dropZone.classList.toggle('drop-highlight', isOver);
  }

  function onPointerUp(e) {
    if (!dragData) return;

    var dzRect = dropZone.getBoundingClientRect();
    var isOver = e.clientX >= dzRect.left && e.clientX <= dzRect.right &&
                 e.clientY >= dzRect.top && e.clientY <= dzRect.bottom;

    if (isOver && !dragData.block.classList.contains('placed')) {
      placeBlock(dragData.pid);
    }

    cleanupDrag();
  }

  function onPointerCancel() {
    if (!dragData) return;
    cleanupDrag();
  }

  function cleanupDrag() {
    if (dragData) {
      dragData.clone.remove();
      // Remove listeners from block
      var block = dragData.block;
      block.removeEventListener('pointermove', onPointerMove);
      block.removeEventListener('pointerup', onPointerUp);
      block.removeEventListener('pointercancel', onPointerCancel);
      dragData = null;
    }
    dropZone.classList.remove('drop-highlight');
  }

  /* ── Place a block ── */
  function placeBlock(pid) {
    if (placed.indexOf(pid) !== -1) return;

    // Mark library block as placed
    var libBlocks = libEl.querySelectorAll('.p08-lib-block');
    libBlocks.forEach(function(b) {
      if (parseInt(b.dataset.pid, 10) === pid) {
        b.classList.add('placed');
      }
    });

    placed.push(pid);
    // Sort placed by id (chronological order)
    placed.sort(function(a, b) { return a - b; });

    renderColumn();
    updateLabels();

    if (placed.length === 6) {
      onAllPlaced();
    }
  }

  /* ── Render column with GSAP ── */
  function renderColumn() {
    var colH = getColHeight();
    if (colH < 10) colH = 340;

    // Calculate total duration of placed periods
    var totalDur = 0;
    placed.forEach(function(pid) {
      totalDur += periods[pid - 1].duration;
    });

    if (totalDur === 0) return;

    // Build or update segments
    var segs = colEl.querySelectorAll('.p08-col-seg');
    var segMap = {};
    segs.forEach(function(s) {
      segMap[s.dataset.pid] = s;
    });

    var tl = gsap.timeline({ defaults: { duration: 0.7, ease: 'power2.inOut' } });

    // For each placed period, ensure segment exists and animate height
    placed.forEach(function(pid) {
      var p = periods[pid - 1];
      var seg = segMap[pid];

      if (!seg) {
        seg = document.createElement('div');
        seg.className = 'p08-col-seg ' + periodColors[pid - 1];
        seg.dataset.pid = pid;
        seg.style.height = '0px';
        colEl.appendChild(seg);
      }

      var h = Math.round((p.duration / totalDur) * colH);
      h = Math.max(h, 1); // at least 1px

      // Animate height
      tl.to(seg, { height: h + 'px' }, 0);
    });

    // Remove segments that are no longer placed
    segs.forEach(function(s) {
      var pid = parseInt(s.dataset.pid, 10);
      if (placed.indexOf(pid) === -1) {
        tl.to(s, { height: '0px', opacity: 0, onComplete: function() { s.remove(); } }, 0);
      }
    });
  }

  /* ── Update column boundary labels ── */
  function updateLabels() {
    var colH = getColHeight();
    if (colH < 10) colH = 340;

    var totalDur = 0;
    placed.forEach(function(pid) {
      totalDur += periods[pid - 1].duration;
    });
    if (totalDur === 0) return;

    // Build list of boundary positions
    var bounds = [];
    // Top boundary (start of first period)
    var firstP = periods[placed[0] - 1];
    bounds.push({ label: firstP.startLabel, pos: 0 });

    // Boundaries between periods
    var cum = 0;
    placed.forEach(function(pid) {
      var p = periods[pid - 1];
      cum += p.duration;
      var frac = cum / totalDur;
      if (placed.indexOf(pid) === placed.length - 1) {
        // Last period: add end label
        bounds.push({ label: p.endLabel, pos: 1 });
      } else {
        bounds.push({ label: p.endLabel, pos: frac });
      }
    });

    // Render labels
    labelsEl.innerHTML = '';
    bounds.forEach(function(b) {
      var div = document.createElement('div');
      div.className = 'bound';
      var line = document.createElement('span');
      line.className = 'bline';
      div.appendChild(line);
      div.appendChild(document.createTextNode(b.label));
      div.style.top = (b.pos * 100) + '%';
      labelsEl.appendChild(div);
    });
  }

  /* ── All blocks placed: show triptych ── */
  function onAllPlaced() {
    // Build triptych views
    buildTriptych();

    // Show triptych zone with animation
    triptychZone.classList.add('visible');

    // Animate in with GSAP
    gsap.from(triptychZone.querySelectorAll('.p08-view'), {
      y: 20,
      opacity: 0,
      duration: 0.6,
      stagger: 0.15,
      ease: 'power2.out'
    });

    gsap.from(triptychZone.querySelectorAll('.p08-bottom-sentence'), {
      opacity: 0,
      y: 10,
      duration: 0.5,
      delay: 0.5,
      ease: 'power2.out'
    });
  }

  /* ── Build triptych views ── */
  function buildTriptych() {
    triptychEl.innerHTML = '';

    var views = [
      {
        label: 'A · 全柱',
        range: '46亿年 → 今天',
        start: K.EARTH_AGE_YEARS,
        end: 0,
        note: '文明段不可见'
      },
      {
        label: 'B · 近6600万年',
        range: '6600万年前 → 今天',
        start: K.DINOSAURS_EXTINCT_YEARS_AGO,
        end: 0,
        note: '文明段仍不可见'
      },
      {
        label: 'C · 近20万年',
        range: '20万年前 → 今天',
        start: K.HOMO_SAPIENS_YEARS_AGO,
        end: 0,
        note: '文明段终于可见'
      }
    ];

    views.forEach(function(v) {
      var viewEl = document.createElement('div');
      viewEl.className = 'p08-view';

      // Header
      var hdr = document.createElement('div');
      hdr.className = 'v-hdr';
      var lbl = document.createElement('span');
      lbl.className = 'v-label';
      lbl.textContent = v.label;
      var rng = document.createElement('span');
      rng.className = 'v-range';
      rng.textContent = v.range;
      hdr.appendChild(lbl);
      hdr.appendChild(rng);
      viewEl.appendChild(hdr);

      // Body
      var body = document.createElement('div');
      body.className = 'v-body';

      // Column
      var vCol = document.createElement('div');
      vCol.className = 'v-col';

      // Segments within this view's range
      var viewRange = v.start - v.end;
      var segsInView = [];
      periods.forEach(function(p) {
        // Check overlap with view range
        var segStart = Math.min(p.start, v.start);
        var segEnd = Math.max(p.end, v.end);
        var overlap = Math.max(0, segStart - segEnd);
        if (overlap > 0) {
          var visibleStart = Math.min(p.start, v.start);
          var visibleEnd = Math.max(p.end, v.end);
          var visibleDur = visibleStart - visibleEnd;
          segsInView.push({
            id: p.id,
            height: Math.max(1, (visibleDur / viewRange) * 100),
            // Position from top: (v.start - visibleStart) / viewRange
            top: ((v.start - visibleStart) / viewRange) * 100
          });
        }
      });

      // Actually, let me redo this. The segments should be:
      // For each period, find its portion within the view range
      var segData = [];
      periods.forEach(function(p) {
        var overlapStart = Math.max(p.end, v.end);
        var overlapEnd = Math.min(p.start, v.start);
        if (overlapEnd > overlapStart) {
          var overlapDur = overlapEnd - overlapStart;
          var frac = overlapDur / viewRange;
          var topFrac = (v.start - overlapEnd) / viewRange;
          segData.push({
            id: p.id,
            heightFrac: frac,
            topFrac: topFrac
          });
        }
      });

      // Draw segments
      segData.forEach(function(sd) {
        var seg = document.createElement('div');
        seg.className = 'v-seg ' + periodColors[sd.id - 1];
        seg.style.height = (sd.heightFrac * 100) + '%';
        seg.style.position = 'absolute';
        seg.style.top = (sd.topFrac * 100) + '%';
        seg.style.left = '0';
        seg.style.width = '100%';
        vCol.appendChild(seg);
      });

      body.appendChild(vCol);

      // Annotations
      var annos = document.createElement('div');
      annos.className = 'v-annos';

      // Add boundary labels for periods within view
      var boundLabels = [];
      // Add the top boundary
      var topLabel = fmtLabel(v.start);
      boundLabels.push({ label: topLabel, pos: 0, highlight: false });

      // Add boundaries for periods that fall within view
      periods.forEach(function(p) {
        if (p.end > v.start) return; // below view
        if (p.start < v.end) return; // above view
        // This period's end is within view
        var pos = (v.start - p.end) / viewRange;
        if (pos > 0 && pos < 1) {
          var hl = (p.id === 6) && (v.label.indexOf('C') !== -1);
          boundLabels.push({ label: p.endLabel, pos: pos, highlight: hl });
        }
      });

      // Add bottom boundary
      boundLabels.push({ label: '今天', pos: 1, highlight: false });

      boundLabels.forEach(function(bl) {
        var anno = document.createElement('div');
        anno.className = 'v-anno' + (bl.highlight ? ' highlight' : '');
        anno.style.top = (bl.pos * 100) + '%';
        anno.textContent = bl.label;
        annos.appendChild(anno);
      });

      body.appendChild(annos);
      viewEl.appendChild(body);

      // Note
      var note = document.createElement('div');
      note.className = 'v-note';
      note.textContent = v.note;
      viewEl.appendChild(note);

      triptychEl.appendChild(viewEl);
    });
  }

  /* ── Layout recalculation ── */
  function onResize() {
    if (placed.length > 0) {
      renderColumn();
      updateLabels();
    }
  }

  /* ── Init ── */
  function init() {
    // Mount header/footer
    Lec.mount({
      title: '46亿年叠成一柱',
      sub: '把演化各阶段按真实比例堆在一起，文明薄得像一层灰尘'
    });

    buildLibrary();

    // Listen for resize
    if (typeof Deck !== 'undefined' && Deck.onResize) {
      Deck.onResize(onResize);
    }

    // Also update on window resize as fallback
    window.addEventListener('resize', function() {
      if (placed.length > 0) {
        // Small delay for layout to settle
        setTimeout(onResize, 50);
      }
    });
  }

  // Wait for DOM and libs
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
