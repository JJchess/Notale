<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== 页面级样式 ===== */
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}

/* #main 重写以适应画布场景 */
#main {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  z-index: 0;
}

/* 场景容器 — 填满整个 #stage (1600×900), 在页眉页脚下方 */
#scene-root {
  position: absolute;
  top: 0;
  left: 0;
  width: 1600px;
  height: 900px;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
#bg-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
#silhouettes-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}
#pixi-container {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
}
#pixi-container canvas {
  display: block;
  width: 100% !important;
  height: 100% !important;
}

/* ===== 玻璃面板 (glass-dark-ui) ===== */
.glass-panel {
  background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01));
  background-color: rgba(11, 14, 20, 0.65);
  border-radius: 14px;
  box-shadow: 0 16px 40px rgba(2, 6, 23, 0.5), inset 0 1px 0 rgba(255,255,255,0.10);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border: 1px solid rgba(255,255,255,0.08);
  pointer-events: auto;
  color: var(--text);
}

/* ===== 能量读数 (右上) ===== */
#energy-readout {
  position: absolute;
  top: 14px;
  right: 18px;
  z-index: 10;
  padding: 8px 14px;
  min-width: 130px;
  text-align: right;
  pointer-events: none;
}
#energy-readout .val {
  font-size: var(--fs-lead);
  font-weight: 700;
  color: #fbbf24;
  line-height: 1.2;
  font-family: var(--font-mono);
}
#energy-readout .label {
  font-size: var(--fs-label);
  color: #94a3b8;
  margin-top: 2px;
}
#energy-readout .semantic {
  font-size: var(--fs-sec);
  color: #60a5fa;
  margin-top: 3px;
  line-height: 1.3;
}

/* ===== 维度表 (左侧) ===== */
#dimension-panel {
  position: absolute;
  top: 50%;
  left: 14px;
  transform: translateY(-50%);
  z-index: 10;
  padding: 12px 16px;
  min-width: 360px;
  max-width: 400px;
  pointer-events: none;
}
#dimension-panel .panel-title {
  font-size: var(--fs-label);
  font-weight: 700;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
}
#dimension-panel .k-comparison {
  --k-comp-cols: 2;
  grid-template-columns: minmax(80px, 0.4fr) 1fr 1fr;
  column-gap: 8px;
  row-gap: 4px;
  font-size: 16px;
}
#dimension-panel .k-comparison .hdr {
  font-size: 16px;
  padding-bottom: 4px;
}
#dimension-panel .k-comparison .dim {
  font-size: 16px;
  padding-right: 4px;
}
#dimension-panel .k-comparison .pre-val,
#dimension-panel .k-comparison .post-val {
  font-size: 16px;
  line-height: 1.35;
  padding: 2px 5px;
  border-radius: 4px;
  transition: opacity 0.5s ease, background 0.5s ease;
}
#dimension-panel .k-comparison .pre-val.active {
  opacity: 1;
  background: rgba(251, 191, 36, 0.12);
}
#dimension-panel .k-comparison .pre-val.inactive {
  opacity: 0.3;
  background: transparent;
}
#dimension-panel .k-comparison .post-val.active {
  opacity: 1;
  background: rgba(96, 165, 250, 0.12);
}
#dimension-panel .k-comparison .post-val.inactive {
  opacity: 0.3;
  background: transparent;
}
#dimension-panel .k-comparison .rowline {
  grid-column: 1 / -1;
  border-top: 1px solid rgba(255,255,255,0.06);
}

/* ===== 滑杆面板 (底部) ===== */
#slider-panel {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  padding: 10px 20px 14px;
  width: 60%;
  max-width: 800px;
  pointer-events: auto;
}
#slider-panel .slider-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 5px;
}
#slider-panel .slider-label .left {
  font-size: var(--fs-label);
  color: #94a3b8;
}
#slider-panel .slider-label .right {
  font-size: var(--fs-label);
  color: var(--accent);
  font-family: var(--font-mono);
}
#slider-panel input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(90deg, #334155, #4f6ef2);
  outline: none;
  cursor: pointer;
}
#slider-panel input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #e2e8f0;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  border: 2px solid var(--accent);
}
#slider-panel input[type="range"]::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #e2e8f0;
  cursor: pointer;
  border: 2px solid var(--accent);
}
#slider-panel .tick-labels {
  display: flex;
  justify-content: space-between;
  margin-top: 5px;
  font-size: 14px;
  color: #64748b;
  line-height: 1.3;
}
#slider-panel .tick-labels span {
  text-align: center;
  flex: 1;
}
#slider-panel .tick-labels span.highlight {
  color: #60a5fa;
  font-weight: 600;
}

/* ===== 过渡遮罩 ===== */
#flash-overlay {
  position: absolute;
  inset: 0;
  z-index: 3;
  background: #fff;
  opacity: 0;
  pointer-events: none;
}

/* ===== 缩减动画 ===== */
@media (prefers-reduced-motion: reduce) {
  #flash-overlay { display: none; }
  .pre-val, .post-val { transition: none !important; }
}
</style>

<script>
(function() {
  'use strict';

  // ===== 常量 =====
  var EXP_MIN = 15, EXP_MAX = 24;
  var THRESHOLD = 23;
  var ASTEROID_IMPACT_ENERGY_JOULES = 1e23; // 全套口径：希克苏鲁伯级撞击当量

  // ===== 语义标签 =====
  var SEMANTIC_LABELS = [
    [15, 17, '区域性灾难'],
    [18, 20, '大陆级灾害'],
    [21, 22, '全球气候扰动'],
    [23, 24, '全球生态系统崩溃']
  ];

  function getSemanticLabel(exp) {
    for (var i = 0; i < SEMANTIC_LABELS.length; i++) {
      if (exp >= SEMANTIC_LABELS[i][0] && exp <= SEMANTIC_LABELS[i][1]) {
        return SEMANTIC_LABELS[i][2];
      }
    }
    return '—';
  }

  // ===== DOM 引用 =====
  var bgCanvas = document.getElementById('bg-canvas');
  var ctx = Deck.fit(bgCanvas);
  var dinoGroup = document.getElementById('dino-group');
  var mammalGroup = document.getElementById('mammal-group');
  var flashOverlay = document.getElementById('flash-overlay');
  var slider = document.getElementById('energy-slider');
  var sliderReadout = document.getElementById('slider-readout');
  var energyVal = document.getElementById('energy-val');
  var energySemantic = document.getElementById('energy-semantic');
  var preVals = document.querySelectorAll('.pre-val');
  var postVals = document.querySelectorAll('.post-val');
  var tickLabels = document.querySelectorAll('.tick-labels span');

  // ===== 状态 =====
  var currentExp = EXP_MIN;
  var sceneState = 'pre';
  var isTransitioning = false;
  var pixiApp = null;
  var particles = [];
  var shockwave = null;

  // ===== 场景绘制 =====
  function drawScene(state, progress) {
    var p = (progress !== undefined) ? progress : (state === 'post' ? 1 : 0);
    var w = bgCanvas.width, h = bgCanvas.height;
    if (w === 0 || h === 0) return;

    var skyH = h * 0.45;
    var groundH = h * 0.35;

    function lerpColor(c1, c2, t) {
      var r = Math.round(c1[0] + (c2[0]-c1[0]) * t);
      var g = Math.round(c1[1] + (c2[1]-c1[1]) * t);
      var b = Math.round(c1[2] + (c2[2]-c1[2]) * t);
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }

    var preSkyTop = [210, 140, 60];
    var preSkyMid = [230, 190, 130];
    var preSkyBot = [240, 220, 180];
    var preGround = [139, 105, 20];
    var preHorizon = [122, 90, 26];

    var postSkyTop = [60, 70, 90];
    var postSkyMid = [100, 115, 135];
    var postSkyBot = [140, 155, 170];
    var postGround = [70, 85, 70];
    var postHorizon = [55, 70, 55];

    var skyGrad = ctx.createLinearGradient(0, 0, 0, skyH);
    skyGrad.addColorStop(0, lerpColor(preSkyTop, postSkyTop, p));
    skyGrad.addColorStop(0.5, lerpColor(preSkyMid, postSkyMid, p));
    skyGrad.addColorStop(1, lerpColor(preSkyBot, postSkyBot, p));
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, w, skyH);

    ctx.fillStyle = lerpColor(preGround, postGround, p);
    ctx.fillRect(0, skyH, w, groundH + h * 0.20);

    ctx.strokeStyle = lerpColor(preHorizon, postHorizon, p);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, skyH);
    ctx.lineTo(w, skyH);
    ctx.stroke();

    ctx.strokeStyle = lerpColor([100, 75, 15], [50, 65, 50], p);
    ctx.lineWidth = 1.5;
    for (var i = 0; i < 20; i++) {
      var x = (i / 20) * w + Math.random() * 20;
      var y = skyH + groundH + Math.random() * 30;
      var vegH = 8 + Math.random() * 16;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x - 3, y - vegH, x + 2, y - vegH * 0.7);
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.moveTo(0, skyH + groundH * 0.25);
    for (var j = 0; j < 12; j++) {
      var cx = (j / 12) * w;
      var cy = skyH + groundH * 0.25 + Math.sin(j * 1.5) * 20 + Math.cos(j * 0.7) * 15;
      ctx.lineTo(cx, cy);
    }
    ctx.lineTo(w, skyH + groundH);
    ctx.lineTo(0, skyH + groundH);
    ctx.closePath();
    ctx.fillStyle = lerpColor([110, 85, 25], [60, 72, 58], p);
    ctx.globalAlpha = 0.3;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ===== PixiJS 粒子系统 =====
  function initPixi() {
    if (pixiApp) return;

    var container = document.getElementById('pixi-container');
    pixiApp = new PIXI.Application({
      width: 1600,
      height: 900,
      transparent: true,
      antialias: true,
      resolution: 1
    });
    container.appendChild(pixiApp.view);
    pixiApp.view.style.position = 'absolute';
    pixiApp.view.style.inset = '0';

    for (var i = 0; i < 80; i++) {
      var g = new PIXI.Graphics();
      if (i < 30) {
        g.beginFill(0xff6b35, 0.8);
        g.drawCircle(0, 0, 2 + Math.random() * 4);
        g.endFill();
        g.type = 'fire';
      } else {
        var gray = 80 + Math.floor(Math.random() * 60);
        var c = (gray << 16) | (gray << 8) | gray;
        g.beginFill(c, 0.5);
        g.drawCircle(0, 0, 4 + Math.random() * 8);
        g.endFill();
        g.type = 'smoke';
      }
      g.visible = false;
      g.vx = 0;
      g.vy = 0;
      g.life = 0;
      g.maxLife = 0;
      g.originX = 0;
      g.originY = 0;
      g.targetScale = 1;
      pixiApp.stage.addChild(g);
      particles.push(g);
    }

    shockwave = new PIXI.Graphics();
    shockwave.visible = false;
    pixiApp.stage.addChild(shockwave);
  }

  function emitParticles(exp, cx, cy) {
    var intensity = (exp - EXP_MIN) / (EXP_MAX - EXP_MIN);
    var count = Math.floor(10 + intensity * 40);
    var fireCount = Math.floor(count * 0.4);
    var smokeCount = count - fireCount;

    var fireIdx = 0;
    var smokeIdx = 0;

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (p.type === 'fire' && fireIdx < fireCount) {
        var angle = Math.random() * Math.PI * 2;
        var speed = 1 + intensity * 6 + Math.random() * 3;
        p.position.set(cx, cy);
        p.vx = Math.cos(angle) * speed;
        p.vy = Math.sin(angle) * speed - 1;
        p.life = 1;
        p.maxLife = 0.6 + Math.random() * 0.8;
        p.targetScale = 1 + intensity * 2;
        p.scale.set(0.5);
        p.alpha = 0.9;
        p.visible = true;
        var r = 255, g = Math.floor(100 + intensity * 60), b = Math.floor(20 + intensity * 30);
        var color = (Math.min(r,255) << 16) | (Math.min(g,255) << 8) | Math.min(b,255);
        p.tint = color;
        fireIdx++;
      } else if (p.type === 'smoke' && smokeIdx < smokeCount) {
        var a2 = (Math.random() - 0.5) * Math.PI * 0.6 - Math.PI * 0.3;
        var s2 = 0.5 + intensity * 3 + Math.random() * 2;
        p.position.set(cx + (Math.random()-0.5)*20, cy - 10);
        p.vx = Math.cos(a2) * s2 * 0.5;
        p.vy = Math.sin(a2) * s2 * 0.5 - 0.5 - intensity * 1.5;
        p.life = 1;
        p.maxLife = 1.5 + intensity * 2 + Math.random();
        p.targetScale = 1.5 + intensity * 4;
        p.scale.set(0.3);
        p.alpha = 0.4;
        p.visible = true;
        smokeIdx++;
      }
    }

    shockwave.visible = true;
    shockwave.clear();
    var swRadius = 10 + intensity * 30;
    shockwave.lineStyle(2, 0xffffff, 0.3 + intensity * 0.4);
    shockwave.drawCircle(cx, cy, swRadius);
    shockwave.alpha = 0.6;
    shockwave._expandSpeed = 3 + intensity * 5;
    shockwave._maxRadius = 80 + intensity * 200;
    shockwave._currentRadius = swRadius;
  }

  function updateParticles(dt) {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (!p.visible) continue;
      p.life -= dt / p.maxLife;
      if (p.life <= 0) {
        p.visible = false;
        continue;
      }
      p.position.x += p.vx * dt * 60;
      p.position.y += p.vy * dt * 60;
      p.vy += 0.08 * dt * 60;
      var s = p.targetScale * (1 - p.life * 0.5);
      p.scale.set(Math.max(s, 0.1));
      p.alpha = p.life * 0.8;
    }

    if (shockwave && shockwave.visible) {
      shockwave._currentRadius += shockwave._expandSpeed * dt * 60;
      shockwave.alpha -= dt * 0.5;
      if (shockwave.alpha <= 0 || shockwave._currentRadius > shockwave._maxRadius) {
        shockwave.visible = false;
      } else {
        shockwave.clear();
        shockwave.lineStyle(2, 0xffffff, shockwave.alpha);
        shockwave.drawCircle(800, 380, shockwave._currentRadius);
      }
    }
  }

  function clearParticles() {
    for (var i = 0; i < particles.length; i++) {
      particles[i].visible = false;
    }
    if (shockwave) {
      shockwave.visible = false;
      shockwave.clear();
    }
  }

  // ===== 场景更新 =====
  function updateScene(exp) {
    if (isTransitioning) return;

    currentExp = exp;
    var isAboveThreshold = exp >= THRESHOLD;

    var energyStr = '10^' + Math.floor(exp) + ' J';
    energyVal.textContent = energyStr;
    sliderReadout.textContent = energyStr;
    energySemantic.textContent = getSemanticLabel(exp);

    for (var t = 0; t < tickLabels.length; t++) {
      var te = parseFloat(tickLabels[t].getAttribute('data-exp'));
      tickLabels[t].classList.toggle('highlight', Math.abs(te - exp) < 1.5);
    }

    if (isAboveThreshold && sceneState === 'pre') {
      transitionToPost();
    } else if (!isAboveThreshold && sceneState === 'post') {
      transitionToPre();
    } else if (!isAboveThreshold) {
      drawScene('pre', 0);
      updateSilhouettes(exp);
      updateImpactEffects(exp);
    }
  }

  function updateSilhouettes(exp) {
    if (exp >= 21) {
      var fadeStart = 21;
      var fadeEnd = THRESHOLD;
      var fadeProgress = (exp - fadeStart) / (fadeEnd - fadeStart);
      var dinoAlpha = 1 - fadeProgress * 0.9;
      var paths = dinoGroup.querySelectorAll('path');
      for (var i = 0; i < paths.length; i++) {
        var shouldHide = Math.random() > fadeProgress - 0.5;
        paths[i].style.opacity = shouldHide ? '0' : String(dinoAlpha);
      }
    } else {
      dinoGroup.style.opacity = '1';
      var paths2 = dinoGroup.querySelectorAll('path');
      for (var j = 0; j < paths2.length; j++) {
        paths2[j].style.opacity = '1';
      }
    }
  }

  function updateImpactEffects(exp) {
    var intensity = (exp - EXP_MIN) / (THRESHOLD - EXP_MIN);
    if (intensity < 0.05) {
      clearParticles();
      return;
    }

    var cx = 800, cy = 380;

    if (Math.random() < 0.1 + intensity * 0.4) {
      emitParticles(exp, cx, cy);
    }

    var skyProgress = Math.min(intensity * 1.2, 1);
    drawScene('pre', skyProgress * 0.5);
  }

  function transitionToPost() {
    if (isTransitioning) return;
    isTransitioning = true;

    var tl = gsap.timeline({
      onComplete: function() {
        sceneState = 'post';
        dinoGroup.style.opacity = '0';
        mammalGroup.style.opacity = '1';
        drawScene('post', 1);
        clearParticles();
        for (var i = 0; i < preVals.length; i++) {
          preVals[i].className = 'pre-val inactive';
          postVals[i].className = 'post-val active';
        }
        isTransitioning = false;
      }
    });

    tl.to(flashOverlay, { opacity: 0.85, duration: 0.15, ease: 'power2.out' })
      .to(flashOverlay, { opacity: 0, duration: 0.6, ease: 'power2.in' }, '+=0.1')
      .to(dinoGroup, { opacity: 0, duration: 0.3 }, '-=0.4')
      .to(mammalGroup, { opacity: 1, duration: 0.8 }, '-=0.2')
      .to({}, { duration: 0.2 }, '+=0.1');
  }

  function transitionToPre() {
    if (isTransitioning) return;
    isTransitioning = true;

    sceneState = 'pre';
    dinoGroup.style.opacity = '1';
    mammalGroup.style.opacity = '0';
    drawScene('pre', 0);
    clearParticles();

    for (var i = 0; i < preVals.length; i++) {
      preVals[i].className = 'pre-val active';
      postVals[i].className = 'post-val inactive';
    }

    var paths = dinoGroup.querySelectorAll('path');
    for (var j = 0; j < paths.length; j++) {
      paths[j].style.opacity = '1';
    }

    gsap.to({}, {
      duration: 0.5,
      onComplete: function() {
        isTransitioning = false;
      }
    });
  }

  // ===== 滑杆事件 =====
  function initSlider() {
    slider.addEventListener('input', function() {
      var exp = parseFloat(this.value);
      updateScene(exp);
    });

    slider.addEventListener('keydown', function(e) {
      var step = 0.1;
      var val = parseFloat(this.value);
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
        e.preventDefault();
        this.value = Math.min(EXP_MAX, val + step);
        updateScene(parseFloat(this.value));
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
        e.preventDefault();
        this.value = Math.max(EXP_MIN, val - step);
        updateScene(parseFloat(this.value));
      }
    });
  }

  // ===== PixiJS 动画循环 =====
  function pixiLoop() {
    if (!pixiApp) return;
    pixiApp.ticker.add(function(dt) {
      updateParticles(dt);
    });
  }

  // ===== 初始化 =====
  function init() {
    drawScene('pre', 0);

    initPixi();
    pixiLoop();

    initSlider();

    for (var t = 0; t < tickLabels.length; t++) {
      var te = parseFloat(tickLabels[t].getAttribute('data-exp'));
      tickLabels[t].classList.toggle('highlight', te === 15);
    }

    Lec.mount({
      index: 9,
      kicker: '深时 · 撞击',
      title: '一场灭绝如何腾出舞台',
      take: '6600万年前，一颗小行星终结了恐龙时代，为哺乳动物腾出了演化的舞台。'
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
