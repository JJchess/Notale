<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ====== page-12 specific ====== */
:root {
  --bone: #e8dcc8;
  --bone-highlight: #ffd700;
  --bone-dim: #8a7e6a;
  --skin: rgba(220, 200, 180, 0.12);
  --label-bg: rgba(11,14,20,0.85);
  --connector: rgba(255,255,255,0.25);
}

/* Ensure main fills the stage content area */
#main { width: 100%; height: 100%; box-sizing: border-box; }

/* split-lr layout */
.page-12 {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  width: 100%;
  height: 100%;
  gap: 0;
  position: relative;
  overflow: hidden;
}

/* Left column: 60% */
.left-col {
  flex: 0 0 60%;
  min-width: 0;
  min-height: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#hand-viewport {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  position: relative;
  overflow: hidden;
  border-radius: 6px;
  background: radial-gradient(ellipse at 50% 60%, rgba(20,25,35,1) 0%, rgba(10,12,18,1) 100%);
}
#hand-viewport canvas {
  display: block;
  position: absolute;
  inset: 0;
  width: 100% !important;
  height: 100% !important;
}

/* Connector overlay for labels */
#connector-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  overflow: visible;
}

/* Stage label bar at bottom of left col */
.stage-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 14px;
  background: rgba(255,255,255,0.04);
  border-top: 1px solid rgba(255,255,255,0.06);
  min-height: 34px;
  flex: 0 0 auto;
}
.stage-bar .stage-name {
  font-size: var(--fs-lead);
  font-weight: 700;
  color: var(--accent);
}
.stage-bar .stage-obj {
  font-size: var(--fs-label);
  color: var(--muted);
}

/* Divider */
.col-divider {
  flex: 0 0 1px;
  background: rgba(255,255,255,0.08);
  margin: 0;
}

/* Right column: 40% */
.right-col {
  flex: 0 0 40%;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 8px 16px 8px 20px;
  gap: 6px;
  overflow: hidden;
}

/* Dial area */
.dial-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 0 0 auto;
  position: relative;
}
#dial-canvas {
  display: block;
  cursor: pointer;
  touch-action: none;
  width: 200px;
  height: 140px;
}

/* Stage description */
.stage-info {
  flex: 0 0 auto;
  min-height: 0;
}
.stage-desc {
  font-size: var(--fs-sec);
  line-height: 1.5;
  color: var(--text);
  margin: 0;
}

/* Transition arrows */
.arrow-questions {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 0 0 auto;
  padding: 4px 0 2px 0;
  border-top: 1px solid rgba(255,255,255,0.06);
  min-height: 0;
}
.arrow-q {
  font-size: var(--fs-label);
  line-height: 1.4;
  color: var(--muted);
  margin: 0;
  padding-left: 14px;
  position: relative;
}
.arrow-q::before {
  content: "→";
  position: absolute;
  left: 0;
  color: var(--accent);
  font-weight: 700;
}

/* Core sentence */
.core-sentence {
  flex: 0 0 auto;
  padding: 6px 10px;
  background: var(--accent-soft);
  border-left: 3px solid var(--accent);
  border-radius: 0 6px 6px 0;
  margin: 2px 0;
}
.core-sentence p {
  font-size: var(--fs-sec);
  line-height: 1.5;
  color: var(--text);
  margin: 0;
  font-weight: 600;
}
.core-sentence .em {
  color: var(--accent);
}

/* Auto demo button */
.auto-btn {
  align-self: center;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 16px;
  border: 1px solid var(--accent);
  border-radius: 20px;
  background: transparent;
  color: var(--accent);
  font-size: var(--fs-label);
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s ease;
  flex: 0 0 auto;
}
.auto-btn:hover {
  background: var(--accent-soft);
}
.auto-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.auto-btn.playing {
  background: var(--accent);
  color: #fff;
}
</style>
</head>
<body data-page="12" data-total="50">
<div id="stage">
<main id="main">
<div class="page-12">
  <!-- Left: 3D hand scene -->
  <div class="left-col min0">
    <div id="hand-viewport" class="min0">
      <svg id="connector-overlay" width="100%" height="100%" style="overflow:visible"></svg>
    </div>
    <div class="stage-bar">
      <span class="stage-name" id="stage-name-label">悬垂抓握</span>
      <span class="stage-obj" id="stage-obj-label">手持：粗树枝</span>
    </div>
  </div>

  <!-- Divider -->
  <div class="col-divider"></div>

  <!-- Right: dial + info -->
  <div class="right-col min0">
    <div class="dial-area">
      <canvas id="dial-canvas" width="440" height="300"></canvas>
    </div>
    <div class="stage-info">
      <p class="stage-desc" id="stage-desc">指骨细长、弯曲；拇指相对短小，与其他四指大致同向；腕关节活动范围大，掌面不形成稳定拱</p>
    </div>
    <div class="arrow-questions" id="arrow-questions">
      <p class="arrow-q" id="arrow-q1">腕部从钩挂时的多向摆动转向握持时的稳定承重</p>
      <p class="arrow-q" id="arrow-q2" style="opacity:0.4">拇指从侧向接触变为指腹对指腹</p>
    </div>
    <div class="core-sentence">
      <p>从悬垂抓握到精细对握，<span class="em">手的解放</span>让捏住一块石头成为可能。</p>
    </div>
    <button class="auto-btn" id="auto-btn" tabindex="0" aria-label="自动演示">▶ 自动演示</button>
  </div>
</div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/three.min.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
// =====================================================================
// Page 12 — 从悬垂到对握
// 3D hand bone anatomy with circular stage selector
// =====================================================================

(function() {
  'use strict';

  // ---- Page data: p12 exclusive ----
  var STAGES = [
    {
      name: '悬垂抓握',
      desc: '指骨细长、弯曲；拇指相对短小，与其他四指大致同向；腕关节活动范围大，掌面不形成稳定拱',
      object: '粗树枝',
      highlightGroups: [0],
      highlightNames: ['细长指骨', '腕关节'],
      cameraPos: { x: 0.3, y: 0.6, z: 3.8 },
      pose: { curl: 0.9, oppose: 0.0, spread: 0.3 }
    },
    {
      name: '掌面握持',
      desc: '拇指开始加长并转向其他手指侧面；掌骨与腕骨开始形成稳定拱；手指仍可弯曲，但不再只为钩挂',
      object: '中等树枝',
      highlightGroups: [1, 2],
      highlightNames: ['拇指', '掌骨拱'],
      cameraPos: { x: 0.5, y: 0.4, z: 3.5 },
      pose: { curl: 0.5, oppose: 0.4, spread: 0.5 }
    },
    {
      name: '精细对握',
      desc: '拇指更长、更粗，能旋转到与食指指腹正对；指骨相对变短，指垫宽展；屈肌肌腱独立化',
      object: '天然卵石',
      highlightGroups: [3, 4, 5],
      highlightNames: ['拇指鞍状关节', '食指指腹', '拇指指腹'],
      cameraPos: { x: 0.8, y: 0.2, z: 3.0 },
      pose: { curl: 0.15, oppose: 0.95, spread: 0.7 }
    }
  ];

  var TRANSITION_QS = [
    null,
    '腕部从钩挂时的多向摆动转向握持时的稳定承重，拇指从跟随者变成侧向参与者',
    '拇指从侧向接触变为指腹对指腹，掌弓固定住物体，指尖触觉反馈成为操纵的基础'
  ];

  // ---- DOM refs ----
  var viewport = document.getElementById('hand-viewport');
  var dialCanvas = document.getElementById('dial-canvas');
  var overlay = document.getElementById('connector-overlay');
  var stageNameEl = document.getElementById('stage-name-label');
  var stageObjEl = document.getElementById('stage-obj-label');
  var stageDescEl = document.getElementById('stage-desc');
  var arrowQ1 = document.getElementById('arrow-q1');
  var arrowQ2 = document.getElementById('arrow-q2');
  var autoBtn = document.getElementById('auto-btn');

  // ---- State ----
  var currentStage = 0;
  var targetStage = 0;
  var isAnimating = false;
  var isAutoPlaying = false;

  // ===================================================================
  // Three.js Scene
  // ===================================================================
  var scene, camera, renderer;
  var handGroup, boneGroups = [];
  var skinMesh;
  var clock = new THREE.Clock();
  var cameraAnimating = false;
  var mouseX = 0, mouseY = 0;
  var isDragging = false;
  var prevMouseX = 0, prevMouseY = 0;

  function initScene() {
    var rect = viewport.getBoundingClientRect();
    var w = rect.width || viewport.clientWidth || 600;
    var h = rect.height || viewport.clientHeight || 400;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0c12);

    camera = new THREE.PerspectiveCamera(35, w / h, 0.1, 20);
    camera.position.set(0.3, 0.6, 3.8);
    camera.lookAt(0, 0.4, 0);

    renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    viewport.insertBefore(renderer.domElement, overlay);
    renderer.domElement.style.position = 'absolute';
    renderer.domElement.style.inset = '0';
    renderer.domElement.style.width = '100%';
    renderer.domElement.style.height = '100%';

    // Lights
    var ambient = new THREE.AmbientLight(0x404060, 0.6);
    scene.add(ambient);

    var keyLight = new THREE.DirectionalLight(0xffeedd, 2.0);
    keyLight.position.set(3, 5, 4);
    scene.add(keyLight);

    var fillLight = new THREE.DirectionalLight(0x8888ff, 0.6);
    fillLight.position.set(-3, 1, -2);
    scene.add(fillLight);

    var rimLight = new THREE.DirectionalLight(0xffffff, 0.4);
    rimLight.position.set(0, 2, -5);
    scene.add(rimLight);

    // Create hand model
    createHand();

    // Mouse interaction for camera orbit
    renderer.domElement.addEventListener('mousedown', onPointerDown);
    renderer.domElement.addEventListener('mousemove', onPointerMove);
    renderer.domElement.addEventListener('mouseup', onPointerUp);
    renderer.domElement.addEventListener('mouseleave', onPointerUp);
    renderer.domElement.addEventListener('touchstart', onTouchStart, { passive: false });
    renderer.domElement.addEventListener('touchmove', onTouchMove, { passive: false });
    renderer.domElement.addEventListener('touchend', onPointerUp, { passive: false });

    // Resize
    Deck.onResize(function() {
      var r = viewport.getBoundingClientRect();
      var w2 = r.width || 600;
      var h2 = r.height || 400;
      camera.aspect = w2 / h2;
      camera.updateProjectionMatrix();
      renderer.setSize(w2, h2);
    });
  }

  // ---- Hand Model ----
  function createBone(length, radius, color) {
    var geo = new THREE.CylinderGeometry(radius * 0.9, radius, length, 8, 1);
    var mat = new THREE.MeshStandardMaterial({
      color: color || 0xe8dcc8,
      roughness: 0.5,
      metalness: 0.1,
      emissive: new THREE.Color(0x000000),
      emissiveIntensity: 0
    });
    var mesh = new THREE.Mesh(geo, mat);
    return mesh;
  }

  function createJointSphere(radius, color) {
    var geo = new THREE.SphereGeometry(radius, 8, 8);
    var mat = new THREE.MeshStandardMaterial({
      color: color || 0xd4c8b0,
      roughness: 0.6,
      metalness: 0.05
    });
    var mesh = new THREE.Mesh(geo, mat);
    return mesh;
  }

  function createHand() {
    handGroup = new THREE.Group();
    scene.add(handGroup);

    var boneColor = 0xe8dcc8;
    var jointColor = 0xd4c8b0;

    // Carpals (wrist) - cluster of small bones
    var carpalGroup = new THREE.Group();
    for (var ci = 0; ci < 5; ci++) {
      var angle = (ci / 5) * Math.PI * 0.6 - 0.3;
      var r = 0.06 + Math.random() * 0.02;
      var cbone = new THREE.Mesh(
        new THREE.SphereGeometry(r * 0.8, 6, 6),
        new THREE.MeshStandardMaterial({
          color: 0xc8b898,
          roughness: 0.7,
          metalness: 0.05,
          emissive: new THREE.Color(0x000000),
          emissiveIntensity: 0
        })
      );
      cbone.position.set(
        Math.sin(angle) * 0.12,
        -0.05 + Math.random() * 0.05,
        Math.cos(angle) * 0.12 - 0.1
      );
      cbone.userData.highlightable = true;
      carpalGroup.add(cbone);
    }
    handGroup.add(carpalGroup);

    // Bone groups for highlighting
    boneGroups = [
      carpalGroup,        // 0: carpals
      new THREE.Group(),  // 1: thumb metacarpal
      new THREE.Group(),  // 2: metacarpal arch (palm)
      new THREE.Group(),  // 3: thumb CMC joint area
      new THREE.Group(),  // 4: index finger
      new THREE.Group()   // 5: thumb tip
    ];
    for (var gi = 1; gi < boneGroups.length; gi++) {
      handGroup.add(boneGroups[gi]);
    }

    // Finger definitions
    var fingerDefs = [
      { name: 'thumb',  base: [-0.25, 0.0, 0.15], scale: 1.0, angle: -0.5, segments: 3 },
      { name: 'index',  base: [-0.10, 0.0, 0.35], scale: 1.0, angle: -0.1, segments: 4 },
      { name: 'middle', base: [0.0, 0.0, 0.38],   scale: 1.05, angle: 0.0, segments: 4 },
      { name: 'ring',   base: [0.10, 0.0, 0.35],  scale: 0.95, angle: 0.1, segments: 4 },
      { name: 'little', base: [0.20, 0.0, 0.28],  scale: 0.8,  angle: 0.2, segments: 4 }
    ];

    // Create each finger
    fingerDefs.forEach(function(fd, fi) {
      var fingerGroup = new THREE.Group();
      handGroup.add(fingerGroup);

      var isThumb = (fi === 0);
      var segCount = fd.segments;
      var mcLen = isThumb ? 0.18 : 0.16;
      var proxLen = isThumb ? 0.14 : 0.14;
      var midLen = isThumb ? 0 : 0.11;
      var distLen = isThumb ? 0.10 : 0.08;
      var boneR = isThumb ? 0.035 : 0.03;
      var segLen = [];
      if (mcLen > 0) segLen.push(mcLen);
      if (proxLen > 0) segLen.push(proxLen);
      if (midLen > 0) segLen.push(midLen);
      if (distLen > 0) segLen.push(distLen);

      var posY = 0;

      for (var si = 0; si < segLen.length; si++) {
        var len = segLen[si];
        var radius = boneR * (1 - si * 0.12);
        var bone = createBone(len, radius, boneColor);
        bone.position.y = posY + len / 2;
        bone.userData.highlightable = true;
        bone.userData.fingerIndex = fi;
        bone.userData.segmentIndex = si;
        fingerGroup.add(bone);

        // Assign to bone group for highlighting
        if (isThumb) {
          if (si === 0) { boneGroups[1].add(bone); } // thumb metacarpal
          else if (si === 2) { boneGroups[5].add(bone); } // thumb tip
          else { boneGroups[3].add(bone); } // thumb CMC
        } else {
          boneGroups[2].add(bone); // metacarpals/palm
          if (fi === 1) boneGroups[4].add(bone); // index finger
        }

        // Joint sphere
        if (si < segLen.length - 1) {
          var joint = createJointSphere(radius * 0.8, jointColor);
          joint.position.y = posY + len;
          joint.userData.highlightable = true;
          fingerGroup.add(joint);
        }

        posY += len;
      }

      fingerGroup.position.set(fd.base[0], fd.base[1], fd.base[2]);
      fingerGroup.rotation.x = -Math.PI / 2 + fd.angle;
      fingerGroup.rotation.z = fd.angle * 0.3;
    });

    // Create palm (metacarpal arch)
    var palmShape = new THREE.Shape();
    palmShape.moveTo(-0.35, -0.05);
    palmShape.quadraticCurveTo(-0.2, 0.15, 0, 0.18);
    palmShape.quadraticCurveTo(0.2, 0.15, 0.35, -0.05);
    palmShape.quadraticCurveTo(0.2, -0.1, 0, -0.08);
    palmShape.quadraticCurveTo(-0.2, -0.1, -0.35, -0.05);

    var extrudeSettings = { depth: 0.06, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.01 };
    var palmGeo = new THREE.ExtrudeGeometry(palmShape, extrudeSettings);
    var palmMat = new THREE.MeshStandardMaterial({
      color: 0xc8b898,
      roughness: 0.7,
      metalness: 0.05,
      transparent: true,
      opacity: 0.3
    });
    var palmMesh = new THREE.Mesh(palmGeo, palmMat);
    palmMesh.position.set(0, -0.02, 0.1);
    palmMesh.rotation.x = Math.PI / 2;
    palmMesh.userData.highlightable = true;
    handGroup.add(palmMesh);

    // Skin - semi-transparent hand envelope
    createSkin();

    // Apply initial pose
    applyPose(0);
  }

  function createSkin() {
    var points = [];
    var profile = [
      [0, 0], [0.02, 0.02], [0.04, 0.05], [0.06, 0.1],
      [0.08, 0.2], [0.09, 0.35], [0.08, 0.5], [0.07, 0.65],
      [0.06, 0.8], [0.05, 0.95], [0.04, 1.1], [0.03, 1.2],
      [0.02, 1.3], [0.01, 1.35], [0, 1.38]
    ];
    profile.forEach(function(p) {
      points.push(new THREE.Vector2(p[0], p[1]));
    });

    var skinGeo = new THREE.LatheGeometry(points, 16);
    var skinMat = new THREE.MeshPhysicalMaterial({
      color: 0xd4c0a8,
      roughness: 0.8,
      metalness: 0,
      transparent: true,
      opacity: 0.08,
      side: THREE.DoubleSide,
      clearcoat: 0.05,
      clearcoatRoughness: 0.4
    });
    skinMesh = new THREE.Mesh(skinGeo, skinMat);
    skinMesh.position.set(0, 0.05, 0.1);
    skinMesh.scale.set(1.0, 0.7, 0.6);
    skinMesh.rotation.x = Math.PI / 2;
    handGroup.add(skinMesh);
  }

  // ---- Pose System ----
  function applyPose(stageIndex) {
    var stage = STAGES[stageIndex];
    if (!stage) return;

    var pose = stage.pose;
    var curl = pose.curl;
    var oppose = pose.oppose;

    handGroup.children.forEach(function(group) {
      if (!group.isGroup) return;
      var firstChild = group.children[0];
      if (!firstChild || !firstChild.isMesh) return;
      var fi = firstChild.userData.fingerIndex;
      if (fi === undefined) return;

      var isThumb = (fi === 0);

      if (isThumb) {
        group.rotation.y = oppose * 0.8;
        var tCurl = Math.max(0, 1 - oppose * 1.2) * 0.6;
        group.children.forEach(function(child) {
          if (child.isMesh && child.userData.segmentIndex !== undefined) {
            var si = child.userData.segmentIndex || 0;
            var bendAngle = 0;
            if (si === 1) bendAngle = tCurl * 0.5;
            if (si === 2) bendAngle = tCurl * 0.8;
            child.rotation.x = bendAngle;
          }
        });
      } else {
        var fIdx = fi - 1;
        var fingerCurl = curl;
        if (curl < 0.3) {
          if (fIdx <= 1) fingerCurl = curl * 0.6;
          else fingerCurl = curl * 0.8;
        }
        group.children.forEach(function(child) {
          if (child.isMesh && child.userData.segmentIndex !== undefined) {
            var si = child.userData.segmentIndex || 0;
            if (si === 0) return;
            var bendAngle = fingerCurl * (0.4 + si * 0.2);
            child.rotation.x = bendAngle;
          }
        });
      }
    });
  }

  // ---- Highlight System ----
  function setHighlights(stageIndex) {
    var stage = STAGES[stageIndex];
    if (!stage) return;

    // Reset all highlights
    handGroup.traverse(function(child) {
      if (child.isMesh && child.material && child.userData.highlightable) {
        child.material.emissive = new THREE.Color(0x000000);
        child.material.emissiveIntensity = 0;
      }
    });

    // Highlight bone groups for this stage
    var groups = stage.highlightGroups;
    groups.forEach(function(gi) {
      if (gi < boneGroups.length) {
        boneGroups[gi].traverse(function(child) {
          if (child.isMesh && child.material) {
            child.material.emissive = new THREE.Color(0xffd700);
            child.material.emissiveIntensity = 0.4;
          }
        });
      }
    });

    updateLabels(stageIndex);
  }

  function updateLabels(stageIndex) {
    var stage = STAGES[stageIndex];
    if (!stage) return;

    overlay.innerHTML = '';

    var names = stage.highlightNames;
    var groups = stage.highlightGroups;
    var ns = 'http://www.w3.org/2000/svg';

    // For each label, find the highlighted bone group center
    groups.forEach(function(gi, idx) {
      if (idx >= names.length) return;

      var center = new THREE.Vector3();
      var count = 0;
      if (gi < boneGroups.length) {
        boneGroups[gi].traverse(function(child) {
          if (child.isMesh) {
            var wp = new THREE.Vector3();
            child.getWorldPosition(wp);
            center.add(wp);
            count++;
          }
        });
      }
      if (count === 0) return;
      center.divideScalar(count);

      // Project to screen
      var projected = center.clone().project(camera);
      var x = (projected.x * 0.5 + 0.5) * 100;
      var y = (1 - (projected.y * 0.5 + 0.5)) * 100;

      // Position label towards the right side of the viewport
      var labelX = 78;
      var labelY = 10 + idx * 18;

      // Connector line
      var line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', x + '%');
      line.setAttribute('y1', y + '%');
      line.setAttribute('x2', labelX + '%');
      line.setAttribute('y2', labelY + '%');
      line.setAttribute('stroke', 'rgba(255,255,255,0.2)');
      line.setAttribute('stroke-width', '0.5');
      line.setAttribute('stroke-dasharray', '2,2');
      overlay.appendChild(line);

      // Label text - use absolute pixel position
      var vpW = viewport.clientWidth || 600;
      var vpH = viewport.clientHeight || 400;
      var lx = labelX / 100 * vpW;
      var ly = labelY / 100 * vpH;

      var text = document.createElementNS(ns, 'text');
      text.setAttribute('x', String(lx));
      text.setAttribute('y', String(ly));
      text.setAttribute('fill', 'rgba(255,255,255,0.8)');
      text.setAttribute('font-size', '14');
      text.setAttribute('font-family', 'ui-monospace, monospace');
      text.textContent = names[idx];
      overlay.appendChild(text);
    });
  }

  // ---- Camera Control ----
  function animateCamera(stageIndex) {
    var stage = STAGES[stageIndex];
    if (!stage) return;

    gsap.to(camera.position, {
      x: stage.cameraPos.x,
      y: stage.cameraPos.y,
      z: stage.cameraPos.z,
      duration: 1.2,
      ease: 'power2.inOut',
      onUpdate: function() {
        camera.lookAt(0, 0.4, 0);
      }
    });
  }

  // ---- Pointer Interaction for Camera Orbit ----
  function onPointerDown(e) {
    isDragging = true;
    prevMouseX = e.clientX;
    prevMouseY = e.clientY;
  }

  function onPointerMove(e) {
    if (isDragging && !cameraAnimating) {
      var dx = e.clientX - prevMouseX;
      var dy = e.clientY - prevMouseY;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;

      var pivot = new THREE.Vector3(0, 0.4, 0);
      var offset = camera.position.clone().sub(pivot);
      var angle = dx * 0.005;
      var euler = new THREE.Euler(0, angle, 0, 'YXZ');
      offset.applyEuler(euler);
      var upAngle = -dy * 0.003;
      var upAxis = new THREE.Vector3(-1, 0, 0);
      upAxis.applyQuaternion(camera.quaternion);
      offset.applyAxisAngle(upAxis, upAngle);
      camera.position.copy(pivot.clone().add(offset));
      camera.lookAt(pivot);
    }
  }

  function onPointerUp(e) {
    isDragging = false;
  }

  function onTouchStart(e) {
    e.preventDefault();
    var touch = e.touches[0];
    isDragging = true;
    prevMouseX = touch.clientX;
    prevMouseY = touch.clientY;
  }

  function onTouchMove(e) {
    e.preventDefault();
    if (!isDragging) return;
    var touch = e.touches[0];
    var dx = touch.clientX - prevMouseX;
    var dy = touch.clientY - prevMouseY;
    prevMouseX = touch.clientX;
    prevMouseY = touch.clientY;

    if (!cameraAnimating) {
      var pivot = new THREE.Vector3(0, 0.4, 0);
      var offset = camera.position.clone().sub(pivot);
      var angle = dx * 0.005;
      var euler = new THREE.Euler(0, angle, 0, 'YXZ');
      offset.applyEuler(euler);
      var upAngle = -dy * 0.003;
      var upAxis = new THREE.Vector3(-1, 0, 0);
      upAxis.applyQuaternion(camera.quaternion);
      offset.applyAxisAngle(upAxis, upAngle);
      camera.position.copy(pivot.clone().add(offset));
      camera.lookAt(pivot);
    }
  }

  // ===================================================================
  // Dial
  // ===================================================================
  var DIAL = {
    cx: 220, cy: 150,
    radius: 90,
    startAngle: -Math.PI * 0.75,
    endAngle: Math.PI * 0.75,
    currentAngle: -Math.PI * 0.75,
    targetAngle: -Math.PI * 0.75,
    dragging: false,
    hoverPos: -1
  };

  function initDial() {
    dialCanvas.width = 440;
    dialCanvas.height = 300;
    drawDial();
    setupDialInteraction();
  }

  function getStageAngle(index) {
    var totalSpan = DIAL.endAngle - DIAL.startAngle;
    return DIAL.startAngle + (index / (STAGES.length - 1)) * totalSpan;
  }

  function getAngleFromPointer(clientX, clientY) {
    var rect = dialCanvas.getBoundingClientRect();
    var scaleX = dialCanvas.width / rect.width;
    var scaleY = dialCanvas.height / rect.height;
    var x = (clientX - rect.left) * scaleX - DIAL.cx;
    var y = (clientY - rect.top) * scaleY - DIAL.cy;
    return Math.atan2(y, x);
  }

  function getNearestStage(angle) {
    var minDist = Infinity;
    var nearest = 0;
    for (var i = 0; i < STAGES.length; i++) {
      var a = getStageAngle(i);
      var dist = Math.abs(angle - a);
      if (dist > Math.PI) dist = 2 * Math.PI - dist;
      if (dist < minDist) {
        minDist = dist;
        nearest = i;
      }
    }
    return nearest;
  }

  function clampAngleToArc(angle) {
    var start = DIAL.startAngle;
    var end = DIAL.endAngle;
    while (angle < start) angle += Math.PI * 2;
    while (angle > end) angle -= Math.PI * 2;
    if (angle < start) angle = start;
    if (angle > end) angle = end;
    return angle;
  }

  function drawDial() {
    var ctx = dialCanvas.getContext('2d');
    var w = dialCanvas.width;
    var h = dialCanvas.height;
    ctx.clearRect(0, 0, w, h);

    var cx = DIAL.cx, cy = DIAL.cy, r = DIAL.radius;

    // Arc track
    ctx.beginPath();
    ctx.arc(cx, cy, r, DIAL.startAngle, DIAL.endAngle);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Position markers
    for (var i = 0; i < STAGES.length; i++) {
      var angle = getStageAngle(i);
      var px = cx + Math.cos(angle) * r;
      var py = cy + Math.sin(angle) * r;

      // Marker circle
      ctx.beginPath();
      ctx.arc(px, py, 6, 0, Math.PI * 2);
      ctx.fillStyle = (i === currentStage) ? 'rgba(79,110,242,0.8)' :
                       (i === DIAL.hoverPos) ? 'rgba(79,110,242,0.4)' : 'rgba(255,255,255,0.2)';
      ctx.fill();
      if (i === currentStage) {
        ctx.strokeStyle = 'rgba(79,110,242,0.6)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // Label
      ctx.fillStyle = (i === currentStage) ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.4)';
      ctx.font = '14px "Noto Sans SC", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      var labelR = r + 20;
      var lx = cx + Math.cos(angle) * labelR;
      var ly = cy + Math.sin(angle) * labelR;
      ctx.fillText(STAGES[i].name, lx, ly);
    }

    // Pointer
    var angle = DIAL.currentAngle;
    var px = cx + Math.cos(angle) * (r - 14);
    var py = cy + Math.sin(angle) * (r - 14);

    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(angle) * 10, cy + Math.sin(angle) * 10);
    ctx.lineTo(px, py);
    ctx.strokeStyle = 'rgba(79,110,242,0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(px, py, 8, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(79,110,242,0.9)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fill();
  }

  function setupDialInteraction() {
    dialCanvas.addEventListener('mousedown', function(e) {
      var rect = dialCanvas.getBoundingClientRect();
      var scaleX = dialCanvas.width / rect.width;
      var scaleY = dialCanvas.height / rect.height;
      var x = (e.clientX - rect.left) * scaleX - DIAL.cx;
      var y = (e.clientY - rect.top) * scaleY - DIAL.cy;
      var dist = Math.sqrt(x * x + y * y);

      if (dist < DIAL.radius + 20) {
        DIAL.dragging = true;
        var angle = getAngleFromPointer(e.clientX, e.clientY);
        var clamped = clampAngleToArc(angle);
        var nearest = getNearestStage(clamped);
        goToStage(nearest);
      }
    });

    dialCanvas.addEventListener('mousemove', function(e) {
      var rect = dialCanvas.getBoundingClientRect();
      var scaleX = dialCanvas.width / rect.width;
      var scaleY = dialCanvas.height / rect.height;
      var x = (e.clientX - rect.left) * scaleX - DIAL.cx;
      var y = (e.clientY - rect.top) * scaleY - DIAL.cy;
      var dist = Math.sqrt(x * x + y * y);

      if (dist < DIAL.radius + 20) {
        var angle = getAngleFromPointer(e.clientX, e.clientY);
        DIAL.hoverPos = getNearestStage(angle);
        dialCanvas.style.cursor = 'pointer';
      } else {
        DIAL.hoverPos = -1;
        dialCanvas.style.cursor = 'default';
      }

      if (DIAL.dragging) {
        var angle = getAngleFromPointer(e.clientX, e.clientY);
        var clamped = clampAngleToArc(angle);
        var nearest = getNearestStage(clamped);
        if (nearest !== currentStage) {
          goToStage(nearest);
        }
      }
      drawDial();
    });

    dialCanvas.addEventListener('mouseup', function() {
      DIAL.dragging = false;
    });

    dialCanvas.addEventListener('mouseleave', function() {
      DIAL.dragging = false;
      DIAL.hoverPos = -1;
      drawDial();
    });

    dialCanvas.addEventListener('touchstart', function(e) {
      e.preventDefault();
      var touch = e.touches[0];
      var rect = dialCanvas.getBoundingClientRect();
      var scaleX = dialCanvas.width / rect.width;
      var scaleY = dialCanvas.height / rect.height;
      var x = (touch.clientX - rect.left) * scaleX - DIAL.cx;
      var y = (touch.clientY - rect.top) * scaleY - DIAL.cy;
      var dist = Math.sqrt(x * x + y * y);

      if (dist < DIAL.radius + 20) {
        DIAL.dragging = true;
        var angle = getAngleFromPointer(touch.clientX, touch.clientY);
        var nearest = getNearestStage(angle);
        goToStage(nearest);
      }
    }, { passive: false });

    dialCanvas.addEventListener('touchmove', function(e) {
      e.preventDefault();
      if (!DIAL.dragging) return;
      var touch = e.touches[0];
      var angle = getAngleFromPointer(touch.clientX, touch.clientY);
      var clamped = clampAngleToArc(angle);
      var nearest = getNearestStage(clamped);
      if (nearest !== currentStage) {
        goToStage(nearest);
      }
      drawDial();
    }, { passive: false });

    dialCanvas.addEventListener('touchend', function() {
      DIAL.dragging = false;
      drawDial();
    });

    // Keyboard support
    dialCanvas.setAttribute('tabindex', '0');
    dialCanvas.setAttribute('role', 'slider');
    dialCanvas.setAttribute('aria-label', '手骨姿态选择器');
    dialCanvas.setAttribute('aria-valuemin', '1');
    dialCanvas.setAttribute('aria-valuemax', '3');
    dialCanvas.setAttribute('aria-valuenow', '1');

    dialCanvas.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        e.preventDefault();
        var next = Math.min(currentStage + 1, STAGES.length - 1);
        goToStage(next);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        var prev = Math.max(currentStage - 1, 0);
        goToStage(prev);
      }
    });
  }

  // ===================================================================
  // Stage Transition
  // ===================================================================
  function goToStage(index) {
    if (index === currentStage && !isAnimating) return;
    if (isAnimating) return;

    targetStage = index;
    isAnimating = true;

    // Update dial pointer
    var targetAngle = getStageAngle(index);
    gsap.to(DIAL, {
      currentAngle: targetAngle,
      duration: 0.4,
      ease: 'power2.out',
      onUpdate: function() { drawDial(); },
      onComplete: function() {
        DIAL.currentAngle = targetAngle;
        drawDial();
      }
    });

    // Animate hand pose
    applyPoseInterpolated(index);

    // Animate camera
    animateCamera(index);

    // Update UI after a short delay
    setTimeout(function() {
      currentStage = index;
      isAnimating = false;
      updateStageUI(index);
      setHighlights(index);
      drawDial();
      dialCanvas.setAttribute('aria-valuenow', String(index + 1));
    }, 600);
  }

  function applyPoseInterpolated(targetIndex) {
    var startCurl = STAGES[currentStage].pose.curl;
    var endCurl = STAGES[targetIndex].pose.curl;
    var startOppose = STAGES[currentStage].pose.oppose;
    var endOppose = STAGES[targetIndex].pose.oppose;

    gsap.to({}, {
      duration: 0.5,
      ease: 'power2.inOut',
      onUpdate: function() {
        var progress = this.progress();
        // Interpolate pose
        var interpCurl = startCurl + (endCurl - startCurl) * progress;
        var interpOppose = startOppose + (endOppose - startOppose) * progress;
        // Apply intermediate pose
        STAGES[targetIndex].pose.curl = interpCurl;
        STAGES[targetIndex].pose.oppose = interpOppose;
        applyPose(targetIndex);
        // Restore
        STAGES[targetIndex].pose.curl = endCurl;
        STAGES[targetIndex].pose.oppose = endOppose;
      },
      onComplete: function() {
        STAGES[targetIndex].pose.curl = endCurl;
        STAGES[targetIndex].pose.oppose = endOppose;
        applyPose(targetIndex);
      }
    });
  }

  function updateStageUI(index) {
    var stage = STAGES[index];
    stageNameEl.textContent = stage.name;
    stageObjEl.textContent = '手持：' + stage.object;
    stageDescEl.textContent = stage.desc;

    if (index === 0) {
      arrowQ1.textContent = TRANSITION_QS[1] || '';
      arrowQ1.style.opacity = '0.4';
      arrowQ2.textContent = TRANSITION_QS[2] || '';
      arrowQ2.style.opacity = '0.25';
    } else if (index === 1) {
      arrowQ1.textContent = TRANSITION_QS[1] || '';
      arrowQ1.style.opacity = '0.8';
      arrowQ2.textContent = TRANSITION_QS[2] || '';
      arrowQ2.style.opacity = '0.4';
    } else {
      arrowQ1.textContent = TRANSITION_QS[1] || '';
      arrowQ1.style.opacity = '0.6';
      arrowQ2.textContent = TRANSITION_QS[2] || '';
      arrowQ2.style.opacity = '0.8';
    }
  }

  // ===================================================================
  // Auto Demo
  // ===================================================================
  function startAutoDemo() {
    if (isAutoPlaying) {
      stopAutoDemo();
      return;
    }

    isAutoPlaying = true;
    autoBtn.textContent = '⏹ 停止';
    autoBtn.classList.add('playing');

    var tl = gsap.timeline({
      onComplete: function() {
        isAutoPlaying = false;
        autoBtn.textContent = '▶ 自动演示';
        autoBtn.classList.remove('playing');
      }
    });

    tl.call(function() { goToStage(0); }, [], '+=0')
      .to({}, { duration: 2.0, ease: 'none' })
      .call(function() { goToStage(1); }, [], '+=0')
      .to({}, { duration: 2.0, ease: 'none' })
      .call(function() { goToStage(2); }, [], '+=0')
      .to({}, { duration: 2.0, ease: 'none' });
  }

  function stopAutoDemo() {
    isAutoPlaying = false;
    autoBtn.textContent = '▶ 自动演示';
    autoBtn.classList.remove('playing');
    gsap.killTweensOf(DIAL);
    gsap.killTweensOf(camera.position);
    drawDial();
  }

  autoBtn.addEventListener('click', startAutoDemo);

  // ===================================================================
  // Animation Loop
  // ===================================================================
  function animate() {
    if (!renderer || !scene || !camera) return;

    if (!isDragging && !cameraAnimating && !isAutoPlaying) {
      handGroup.rotation.y += 0.001;
    }

    renderer.render(scene, camera);
  }

  // ===================================================================
  // Init
  // ===================================================================
  function init() {
    Lec.mount({ title: '从悬垂到对握', sub: '猿的身体 · 手' });

    initScene();
    initDial();

    currentStage = 0;
    targetStage = 0;
    DIAL.currentAngle = getStageAngle(0);
    updateStageUI(0);
    setHighlights(0);
    drawDial();

    Deck.loop(animate);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
