<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/lib/d3.min.js"></script>
<style>
/* ============================================================
   page-13 · 脑容量时间线
   知识结构：generalization —— 主张—支撑
   ============================================================ */

/* ── 主题变量 ── */
:root {
  --bg:   #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}

/* ── 通用布局 ── */
#stage {
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
}

#main {
  max-width: 100%;
}

/* ── generalization 骨架 ── */
.k-generalization {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 0 0;
}

/* 主张 */
.k-generalization .claim {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 20px;
  background: var(--accent-soft);
  border-left: 6px solid var(--accent);
  border-radius: 0 10px 10px 0;
  padding: 14px 24px;
  margin-bottom: 8px;
  flex-shrink: 0;
}

.claim .ratio-badge {
  flex-shrink: 0;
  font-size: 40px;
  font-weight: 800;
  color: var(--accent);
  line-height: 1;
  letter-spacing: -0.02em;
  white-space: nowrap;
}

.claim .claim-text {
  font-size: var(--fs-lead);
  line-height: 1.5;
  color: var(--text);
  font-weight: 600;
}

.claim .claim-text .sub {
  display: block;
  font-weight: 400;
  font-size: var(--fs-body);
  color: var(--muted);
  margin-top: 2px;
}

/* 支撑区 */
.k-generalization .supports {
  position: relative;
  z-index: 1;
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 0 0;
  border-top: 2px solid var(--accent);
  padding-top: 10px;
}

/* ── 时间轴 SVG 容器 ── */
#timeline-wrap {
  position: relative;
  width: 100%;
  flex-shrink: 0;
  height: 130px;
}

#timeline-wrap svg {
  display: block;
  width: 100%;
  height: 100%;
}

/* ── 账目行 ── */
#ledger {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 6px;
  padding: 4px 0;
}

.ledger-row {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 8px 16px;
  border-radius: 6px;
  background: rgba(255,255,255,0.03);
  border: 1px solid transparent;
  transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
}

.ledger-row.highlighted {
  background: var(--accent-soft);
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.ledger-row .idx {
  flex: 0 0 30px;
  font-size: var(--fs-label);
  color: var(--muted);
  text-align: center;
  font-weight: 600;
}

.ledger-row .species {
  flex: 0 0 200px;
  font-size: var(--fs-body);
  font-weight: 600;
  color: var(--text);
}

.ledger-row .species .latin {
  display: inline-block;
  font-weight: 400;
  font-size: var(--fs-label);
  color: var(--muted);
  margin-left: 8px;
  font-style: italic;
}

.ledger-row .years {
  flex: 0 0 140px;
  font-size: var(--fs-sec);
  color: var(--muted);
  text-align: center;
}

.ledger-row .volume {
  flex: 0 0 100px;
  font-size: var(--fs-body);
  color: var(--text);
  text-align: center;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.ledger-row .vol-dot {
  flex: 0 0 10px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  margin-left: 8px;
  opacity: 0.4;
  transition: opacity 0.25s, transform 0.25s;
}

.ledger-row.highlighted .vol-dot {
  opacity: 1;
  transform: scale(1.3);
}

/* ── 体积读数── */
.volume-badge {
  position: absolute;
  right: 0;
  top: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 18px;
  background: rgba(11,14,20,0.85);
  border: 1px solid var(--border);
  border-radius: 10px;
  backdrop-filter: blur(4px);
  min-width: 120px;
}

.volume-badge .vol-num {
  font-size: 48px;
  font-weight: 800;
  line-height: 1;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.volume-badge .vol-unit {
  font-size: var(--fs-label);
  color: var(--muted);
  margin-top: 2px;
}

.volume-badge .vol-label {
  font-size: var(--fs-label);
  color: var(--muted);
  margin-top: 4px;
  opacity: 0.7;
}

/* ── 控件 ── */
.ctl-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 0 0;
  flex-shrink: 0;
}

.ctl-row input[type="range"] {
  flex: 1 1 auto;
  min-width: 0;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--border);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}

.ctl-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg);
  cursor: pointer;
  box-shadow: 0 0 0 1px var(--accent);
}

.ctl-row input[type="range"]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg);
  cursor: pointer;
}

.ctl-row .play-btn {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--accent);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, color 0.2s;
  line-height: 1;
  padding: 0;
}

.ctl-row .play-btn:hover {
  background: var(--accent);
  color: var(--bg);
}

.ctl-row .play-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.ctl-row .play-btn.playing {
  background: var(--accent-soft);
}

/* ── 推测提示 ── */
.speculative-note {
  position: absolute;
  left: 0;
  bottom: 0;
  font-size: var(--fs-label);
  color: var(--muted);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.speculative-note.visible {
  opacity: 1;
}

/* ── 扫描线 ── */
.scan-line {
  stroke: var(--accent);
  stroke-width: 2;
  stroke-opacity: 0.8;
  pointer-events: none;
}

/* ── 分叉标注 ── */
.split-label {
  font-size: var(--fs-label);
  fill: var(--muted);
  text-anchor: middle;
}

/* ── 响应式微调 ── */
@media (max-width: 1400px) {
  .claim .ratio-badge {
    font-size: 34px;
  }
}
</style>
</head>

<script>
/* ============================================================
   page-13 · 脑容量时间线
   知识结构：generalization
   ============================================================ */

(function() {
  'use strict';

  // ---------------------------------------------------------------
  // 1. 常量（全套口径）
  // ---------------------------------------------------------------
  var AUSTRALOPITHECUS_BRAIN_ML = 400;
  var HOMO_SAPIENS_BRAIN_ML = 1400;
  var AUSTRALOPITHECUS_YEARS_AGO = 4_000_000;
  var HOMO_HABILIS_BRAIN_ML = 600;
  var HOMO_HABILIS_YEARS_AGO = 2_000_000;
  var HOMO_ERECTUS_BRAIN_ML = 900;
  var HOMO_ERECTUS_YEARS_AGO = 1_000_000;
  var SPLIT_YEARS_AGO = Lec.K.HOMININS_SPLIT_YEARS_AGO; // 约 650 万年前
  var HOMO_SAPIENS_YEARS_AGO = Lec.K.HOMO_SAPIENS_YEARS_AGO; // 约 30 万年前——按最新化石证据

  // 计算比值
  var RATIO = HOMO_SAPIENS_BRAIN_ML / AUSTRALOPITHECUS_BRAIN_ML;
  var RATIO_DISPLAY = RATIO.toFixed(1) + '×';

  // ---------------------------------------------------------------
  // 2. 物种数据（从古到今）
  // ---------------------------------------------------------------
  var SPECIES = [
    {
      name: '南方古猿',
      latin: 'Australopithecus',
      yearsAgo: AUSTRALOPITHECUS_YEARS_AGO,
      brainML: AUSTRALOPITHECUS_BRAIN_ML,
      label: '南方古猿'
    },
    {
      name: '能人',
      latin: 'Homo habilis',
      yearsAgo: HOMO_HABILIS_YEARS_AGO,
      brainML: HOMO_HABILIS_BRAIN_ML,
      label: '能人'
    },
    {
      name: '直立人',
      latin: 'Homo erectus',
      yearsAgo: HOMO_ERECTUS_YEARS_AGO,
      brainML: HOMO_ERECTUS_BRAIN_ML,
      label: '直立人'
    },
    {
      name: '智人',
      latin: 'Homo sapiens',
      yearsAgo: HOMO_SAPIENS_YEARS_AGO,
      brainML: HOMO_SAPIENS_BRAIN_ML,
      label: '智人'
    }
  ];

  // ---------------------------------------------------------------
  // 3. 插值函数
  // ---------------------------------------------------------------
  function interpolateBrainVolume(yearsAgo) {
    var pts = SPECIES; // already sorted oldest → newest
    // pts[0] = 南方古猿 (4M, 400), pts[3] = 智人 (200k, 1400)

    if (yearsAgo >= pts[0].yearsAgo) return pts[0].brainML;
    if (yearsAgo <= pts[pts.length - 1].yearsAgo) return pts[pts.length - 1].brainML;

    for (var i = 0; i < pts.length - 1; i++) {
      if (yearsAgo <= pts[i].yearsAgo && yearsAgo >= pts[i + 1].yearsAgo) {
        var span = pts[i].yearsAgo - pts[i + 1].yearsAgo;
        if (span === 0) return pts[i].brainML;
        var t = (pts[i].yearsAgo - yearsAgo) / span;
        return pts[i].brainML + t * (pts[i + 1].brainML - pts[i].brainML);
      }
    }
    return pts[pts.length - 1].brainML;
  }

  function isSpeculative(yearsAgo) {
    return yearsAgo > SPECIES[0].yearsAgo;
  }

  // ---------------------------------------------------------------
  // 4. 挂载 Lec
  // ---------------------------------------------------------------
  Lec.mount({
    index: 13,
    kicker: '猿的身体',
    title: '400 → 1400：脑容量的三倍半扩张',
    take: '七百万年，脑容量从约 400 mL 涨到约 1400 mL——接近三倍半。' +
          '它不是一条匀速上升：早期很长一段保持低平，陡峭的扩张集中在最近的约两百万年。' +
          '这是演化史上最剧烈的器官扩张之一。'
  });

  // ---------------------------------------------------------------
  // 5. 构建页面
  // ---------------------------------------------------------------
  var main = document.getElementById('main');

  // 构建 generalization 结构
  var gen = document.createElement('div');
  gen.className = 'k-generalization';

  // ── 主张 ──
  var claim = document.createElement('div');
  claim.className = 'claim';
  claim.innerHTML =
    '<span class="ratio-badge">≈' + RATIO_DISPLAY + '</span>' +
    '<span class="claim-text">' +
      '七百万年，脑容量从约 400 mL 涨到约 1400 mL——接近三倍半' +
      '<span class="sub">它不是一条匀速上升：早期很长一段保持低平，陡峭的扩张集中在最近的约两百万年。这是演化史上最剧烈的器官扩张之一。</span>' +
    '</span>';
  gen.appendChild(claim);

  // ── 支撑 ──
  var supports = document.createElement('div');
  supports.className = 'supports';

  // 体积读数 badge
  var badge = document.createElement('div');
  badge.className = 'volume-badge';
  badge.innerHTML =
    '<span class="vol-num" id="vol-num">400</span>' +
    '<span class="vol-unit">mL</span>' +
    '<span class="vol-label" id="vol-label">当前脑容量</span>';

  // 时间轴容器
  var tw = document.createElement('div');
  tw.id = 'timeline-wrap';

  // 推测提示
  var specNote = document.createElement('div');
  specNote.className = 'speculative-note';
  specNote.id = 'spec-note';
  specNote.textContent = '← 早期线索稀疏，推测段';

  supports.appendChild(tw);
  supports.appendChild(badge);
  supports.appendChild(specNote);

  // 账目行
  var ledger = document.createElement('div');
  ledger.id = 'ledger';
  supports.appendChild(ledger);

  // 控件行
  var ctl = document.createElement('div');
  ctl.className = 'ctl-row';
  ctl.innerHTML =
    '<input type="range" id="scanner" min="0" max="1000" value="0" step="1" aria-label="拖动滑块浏览时间线">' +
    '<button class="play-btn" id="play-btn" aria-label="自动播放">▶</button>';
  supports.appendChild(ctl);

  gen.appendChild(supports);
  main.appendChild(gen);

  // ---------------------------------------------------------------
  // 6. 构建账目行
  // ---------------------------------------------------------------
  for (var i = 0; i < SPECIES.length; i++) {
    var s = SPECIES[i];
    var row = document.createElement('div');
    row.className = 'ledger-row';
    row.dataset.index = i;
    row.innerHTML =
      '<span class="idx">' + (i + 1) + '</span>' +
      '<span class="species">' + s.name + '<span class="latin">' + s.latin + '</span></span>' +
      '<span class="years">约' + formatYA(s.yearsAgo) + '年前</span>' +
      '<span class="volume">' + s.brainML + ' mL</span>' +
      '<span class="vol-dot"></span>';
    ledger.appendChild(row);
  }

  function formatYA(ya) {
    if (ya >= 1000000) {
      var m = ya / 1000000;
      return m.toFixed(0) + '万';
    }
    if (ya >= 10000) {
      var w = ya / 10000;
      return w.toFixed(0) + '万';
    }
    return ya.toLocaleString();
  }

  // ---------------------------------------------------------------
  // 7. d3 时间轴
  // ---------------------------------------------------------------
  function buildTimeline() {
    var container = document.getElementById('timeline-wrap');
    var rect = container.getBoundingClientRect();
    var w = rect.width || 1200;
    var h = rect.height || 130;

    // 清除旧 SVG
    d3.select(container).selectAll('svg').remove();

    var margin = { top: 10, right: 30, bottom: 30, left: 30 };
    var innerW = w - margin.left - margin.right;
    var innerH = h - margin.top - margin.bottom;

    var svg = d3.select(container)
      .append('svg')
      .attr('width', w)
      .attr('height', h)
      .attr('viewBox', '0 0 ' + w + ' ' + h)
      .style('display', 'block');

    var g = svg.append('g')
      .attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');

    // 时间刻度
    var xScale = d3.scaleLinear()
      .domain([SPLIT_YEARS_AGO, 0])
      .range([0, innerW]);

    // 轴线
    g.append('line')
      .attr('x1', 0)
      .attr('y1', innerH - 2)
      .attr('x2', innerW)
      .attr('y2', innerH - 2)
      .attr('stroke', 'rgba(255,255,255,0.15)')
      .attr('stroke-width', 1);

    // 分叉标记
    g.append('line')
      .attr('x1', xScale(SPLIT_YEARS_AGO))
      .attr('y1', 0)
      .attr('x2', xScale(SPLIT_YEARS_AGO))
      .attr('y2', innerH - 2)
      .attr('stroke', 'rgba(255,255,255,0.2)')
      .attr('stroke-dasharray', '3,3')
      .attr('stroke-width', 1);

    // 分叉标注
    g.append('text')
      .attr('x', xScale(SPLIT_YEARS_AGO))
      .attr('y', 10)
      .attr('class', 'split-label')
      .attr('text-anchor', 'middle')
      .attr('fill', 'rgba(255,255,255,0.35)')
      .style('font-size', '15px')
      .text('人科与黑猩猩谱系分开');

    // 早期稀疏渐变区（分叉 → 第一个数据点）
    g.append('rect')
      .attr('x', xScale(SPLIT_YEARS_AGO))
      .attr('y', 0)
      .attr('width', xScale(SPECIES[0].yearsAgo) - xScale(SPLIT_YEARS_AGO))
      .attr('height', innerH - 2)
      .attr('fill', 'url(#early-grad)')
      .attr('opacity', 0.3);

    // 渐变定义
    var defs = svg.append('defs');
    var grad = defs.append('linearGradient')
      .attr('id', 'early-grad')
      .attr('x1', '0%')
      .attr('y1', '0%')
      .attr('x2', '100%')
      .attr('y2', '0%');
    grad.append('stop')
      .attr('offset', '0%')
      .attr('stop-color', 'rgba(255,255,255,0)');
    grad.append('stop')
      .attr('offset', '100%')
      .attr('stop-color', 'rgba(255,255,255,0.08)');

    // 虚线趋势线（全部连接）
    var lineGen = d3.line()
      .x(function(d) { return xScale(d.yearsAgo); })
      .y(function(d) { return innerH - 2 - 10 - (d.brainML - 300) / 1200 * (innerH - 20); })
      .curve(d3.curveMonotoneX);

    // 趋势线 - 虚线（全部）
    g.append('path')
      .datum(SPECIES)
      .attr('d', lineGen)
      .attr('fill', 'none')
      .attr('stroke', 'rgba(255,255,255,0.2)')
      .attr('stroke-width', 2)
      .attr('stroke-dasharray', '5,4')
      .attr('class', 'trend-dashed');

    // 趋势线 - 实线（已扫过的部分，初始为空）
    g.append('path')
      .datum(SPECIES)
      .attr('d', null)
      .attr('fill', 'none')
      .style('stroke', 'var(--accent)')
      .attr('stroke-width', 2.5)
      .attr('class', 'trend-solid');

    // 扫描线
    g.append('line')
      .attr('x1', xScale(SPLIT_YEARS_AGO))
      .attr('y1', 0)
      .attr('x2', xScale(SPLIT_YEARS_AGO))
      .attr('y2', innerH - 2)
      .attr('class', 'scan-line')
      .attr('id', 'scan-line');

    // 数据点
    g.selectAll('.data-dot')
      .data(SPECIES)
      .enter()
      .append('circle')
      .attr('class', 'data-dot')
      .attr('cx', function(d) { return xScale(d.yearsAgo); })
      .attr('cy', function(d) { return innerH - 2 - 10 - (d.brainML - 300) / 1200 * (innerH - 20); })
      .attr('r', 6)
      .style('fill', 'var(--accent)')
      .style('stroke', 'var(--bg)')
      .attr('stroke-width', 2);

    // 刻度标记
    var tickPositions = [
      { value: SPLIT_YEARS_AGO, label: '700万' },
      { value: 4000000, label: '400万' },
      { value: 2000000, label: '200万' },
      { value: 1000000, label: '100万' },
      { value: 500000, label: '50万' },
      { value: 0, label: '今天' }
    ];

    g.selectAll('.tick-label')
      .data(tickPositions)
      .enter()
      .append('text')
      .attr('class', 'tick-label')
      .attr('x', function(d) { return xScale(d.value); })
      .attr('y', innerH + 16)
      .attr('text-anchor', 'middle')
      .attr('fill', 'rgba(255,255,255,0.4)')
      .style('font-size', '14px')
      .text(function(d) { return d.label; });

    return { xScale: xScale, innerW: innerW, innerH: innerH, g: g, svg: svg, lineGen: lineGen };
  }

  // ---------------------------------------------------------------
  // 8. 交互逻辑
  // ---------------------------------------------------------------
  var timeline;
  var isPlaying = false;
  var playTimer = null;
  var slider = document.getElementById('scanner');
  var playBtn = document.getElementById('play-btn');
  var volNum = document.getElementById('vol-num');
  var volLabel = document.getElementById('vol-label');
  var specNoteEl = document.getElementById('spec-note');

  function initTimeline() {
    timeline = buildTimeline();
  }

  // 延迟初始化，确保布局完成
  requestAnimationFrame(function() {
    initTimeline();

    // 初始更新
    updateScanner(0);
  });

  // 尺寸变化时重建
  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      initTimeline();
      updateScanner(parseFloat(slider.value) / 1000);
    }, 150);
  });

  function updateScanner(normalized) {
    if (!timeline) return;

    var xScale = timeline.xScale;
    var innerW = timeline.innerW;
    var innerH = timeline.innerH;
    var g = timeline.g;
    var lineGen = timeline.lineGen;

    // normalized: 0 → 最古老 (SPLIT), 1 → 今天 (0)
    var yearsAgo = SPLIT_YEARS_AGO * (1 - normalized);
    var xPos = xScale(yearsAgo);

    // 更新扫描线
    g.select('#scan-line')
      .attr('x1', xPos)
      .attr('x2', xPos);

    // 更新趋势实线（只画到当前位置）
    var visiblePoints = [];
    for (var i = 0; i < SPECIES.length; i++) {
      if (SPECIES[i].yearsAgo >= yearsAgo) {
        visiblePoints.push(SPECIES[i]);
      }
    }
    // 加上当前插值点
    var currentBrainML = interpolateBrainVolume(yearsAgo);
    var currentY = innerH - 2 - 10 - (currentBrainML - 300) / 1200 * (innerH - 20);

    if (visiblePoints.length > 0) {
      var fullData = [];
      for (var j = 0; j < visiblePoints.length; j++) {
        fullData.push(visiblePoints[j]);
      }
      // 如果当前在最后一个可见点之后或之间，添加一个插值点
      var lastVis = visiblePoints[visiblePoints.length - 1];
      if (yearsAgo < lastVis.yearsAgo) {
        fullData.push({ yearsAgo: yearsAgo, brainML: currentBrainML });
      }
      g.select('.trend-solid')
        .datum(fullData)
        .attr('d', lineGen);
    } else {
      g.select('.trend-solid')
        .attr('d', null);
    }

    // 更新体积读数
    volNum.textContent = Math.round(currentBrainML);

    // 推测提示
    var isSpec = isSpeculative(yearsAgo);
    if (isSpec) {
      specNoteEl.classList.add('visible');
    } else {
      specNoteEl.classList.remove('visible');
    }

    // 更新账目行高亮
    var rows = document.querySelectorAll('.ledger-row');
    var activeIndex = -1;
    for (var k = 0; k < SPECIES.length; k++) {
      if (yearsAgo >= SPECIES[k].yearsAgo) {
        activeIndex = k;
      }
    }
    // 如果当前在第一个点之前，不高亮
    if (yearsAgo > SPECIES[0].yearsAgo) {
      activeIndex = -1;
    }

    for (var r = 0; r < rows.length; r++) {
      rows[r].classList.remove('highlighted');
      if (r === activeIndex && activeIndex >= 0) {
        rows[r].classList.add('highlighted');
      }
    }
  }

  // 滑块事件
  slider.addEventListener('input', function() {
    if (isPlaying) {
      stopPlay();
    }
    var val = parseFloat(this.value) / 1000;
    updateScanner(val);
  });

  // 键盘支持
  slider.addEventListener('keydown', function(e) {
    var step = 20;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
      e.preventDefault();
      this.value = Math.min(1000, parseFloat(this.value) + step);
      var val = parseFloat(this.value) / 1000;
      updateScanner(val);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      e.preventDefault();
      this.value = Math.max(0, parseFloat(this.value) - step);
      var val = parseFloat(this.value) / 1000;
      updateScanner(val);
    }
  });

  // 播放
  function startPlay() {
    isPlaying = true;
    playBtn.textContent = '⏸';
    playBtn.classList.add('playing');

    var startVal = parseFloat(slider.value);
    var duration = 8000; // 8 秒自动播放
    var startTime = Date.now();

    playTimer = setInterval(function() {
      var elapsed = Date.now() - startTime;
      var progress = elapsed / duration;
      if (progress >= 1) {
        slider.value = 1000;
        updateScanner(1);
        stopPlay();
        return;
      }
      var val = startVal + progress * (1000 - startVal);
      slider.value = Math.min(1000, val);
      updateScanner(parseFloat(slider.value) / 1000);
    }, 16);
  }

  function stopPlay() {
    isPlaying = false;
    playBtn.textContent = '▶';
    playBtn.classList.remove('playing');
    if (playTimer) {
      clearInterval(playTimer);
      playTimer = null;
    }
  }

  playBtn.addEventListener('click', function() {
    if (isPlaying) {
      stopPlay();
    } else {
      // 如果已经在末尾，重新开始
      if (parseFloat(slider.value) >= 1000) {
        slider.value = 0;
        updateScanner(0);
      }
      startPlay();
    }
  });

  // 重绘时保留播放状态
  // 窗口 resize 时如果正在播放，停止
  var origResize = window.addEventListener('resize', function() {
    if (isPlaying) stopPlay();
  });

  // 初始状态
  // 滑块默认在 0（最古老），显示第一个数据点之前
  // 更新账目高亮——初始时没有高亮（在第一个数据点之前）
  // 所有行初始为不高亮

  // 初始时显示第一个数据点之后的最近值，让第一行高亮
  // 默认显示在第一个数据点 (南方古猿)
  setTimeout(function() {
    // 移动到第一个数据点
    var firstYA = SPECIES[0].yearsAgo;
    var normVal = 1 - firstYA / SPLIT_YEARS_AGO;
    slider.value = normVal * 1000;
    updateScanner(normVal);
  }, 100);

})();
</script>
</body>
</html>
