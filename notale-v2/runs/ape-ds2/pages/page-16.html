<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<style>
/* ===== page-specific tokens ===== */
:root {
  --p16-col-human: #4f6ef2;
  --p16-col-chimp: #e8854a;
  --p16-col-bonobo: #5cb87a;
  --p16-col-gorilla: #9b72cf;
  --p16-grid: rgba(255,255,255,0.07);
  --p16-grid-dim: rgba(255,255,255,0.04);
  --p16-card-bg: rgba(255,255,255,0.04);
  --p16-card-hover: rgba(255,255,255,0.08);
  --p16-card-active: rgba(255,255,255,0.10);
}

/* ===== layout ===== */
#main {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  min-height: 0;
  max-width: 100%;
  overflow: hidden;
}

.page-row {
  display: flex;
  flex-direction: row;
  flex: 1 1 auto;
  min-height: 0;
  gap: 20px;
}

.chart-area {
  flex: 1 1 0;
  min-width: 0;
  position: relative;
  display: flex;
  flex-direction: column;
}

.chart-area svg {
  display: block;
  width: 100%;
  height: 100%;
}

/* ===== species cards ===== */
.species-cards {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 200px;
  flex: 0 0 auto;
  padding-top: 4px;
}

.species-card {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 10px 14px;
  border-radius: 8px;
  background: var(--p16-card-bg);
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
  user-select: none;
  min-height: 52px;
}

.species-card:hover {
  background: var(--p16-card-hover);
}

.species-card.active {
  background: var(--p16-card-active);
}

.species-card .card-name {
  font-size: var(--fs-sec);
  font-weight: 600;
  line-height: 1.3;
  color: var(--text);
}

.species-card .card-stat {
  font-size: var(--fs-label);
  color: var(--muted);
  font-family: var(--font-mono);
  line-height: 1.3;
  margin-top: 2px;
}

.species-card[data-species="human"] { border-color: transparent; }
.species-card[data-species="human"].active,
.species-card[data-species="human"]:hover { border-color: var(--p16-col-human); }

.species-card[data-species="chimpanzee"] { border-color: transparent; }
.species-card[data-species="chimpanzee"].active,
.species-card[data-species="chimpanzee"]:hover { border-color: var(--p16-col-chimp); }

.species-card[data-species="bonobo"] { border-color: transparent; }
.species-card[data-species="bonobo"].active,
.species-card[data-species="bonobo"]:hover { border-color: var(--p16-col-bonobo); }

.species-card[data-species="gorilla"] { border-color: transparent; }
.species-card[data-species="gorilla"].active,
.species-card[data-species="gorilla"]:hover { border-color: var(--p16-col-gorilla); }

/* ===== bottom ledger ===== */
.bottom-ledger {
  flex: 0 0 auto;
  padding: 10px 0 4px 0;
  border-top: 1px solid var(--p16-grid);
  margin-top: 4px;
}

.ledger-row {
  display: flex;
  flex-direction: row;
  gap: 0;
  align-items: center;
  width: 100%;
}

.ledger-item {
  flex: 1 1 0;
  min-width: 0;
  text-align: center;
  padding: 6px 8px;
  font-size: var(--fs-label);
  font-family: var(--font-mono);
  color: var(--muted);
  transition: color 0.3s, background 0.3s;
  border-radius: 4px;
  position: relative;
}

.ledger-item + .ledger-item::before {
  content: "";
  position: absolute;
  left: 0;
  top: 20%;
  bottom: 20%;
  width: 1px;
  background: var(--p16-grid);
}

.ledger-item .ledger-species {
  font-size: 14px;
  color: var(--muted);
  opacity: 0.7;
  display: block;
  margin-bottom: 2px;
  font-family: var(--font-sans, system-ui);
}

.ledger-item .ledger-value {
  font-size: var(--fs-body);
  font-weight: 700;
  display: block;
  font-family: var(--font-mono);
}

.ledger-item.highlight {
  color: var(--text);
  background: rgba(255,255,255,0.04);
}

.ledger-item[data-species="human"] .ledger-value { color: var(--p16-col-human); }
.ledger-item[data-species="chimpanzee"] .ledger-value { color: var(--p16-col-chimp); }
.ledger-item[data-species="bonobo"] .ledger-value { color: var(--p16-col-bonobo); }
.ledger-item[data-species="gorilla"] .ledger-value { color: var(--p16-col-gorilla); }

/* ===== d3 chart overrides ===== */
.chart-area .grid-line {
  stroke: var(--p16-grid);
  stroke-width: 0.5;
  stroke-dasharray: 3 3;
}

.chart-area .grid-line-zero {
  stroke: var(--p16-grid-dim);
  stroke-width: 0.5;
}

.chart-area .axis-label {
  fill: var(--muted);
  font-size: 13px;
  font-family: var(--font-mono);
}

.chart-area .axis-title {
  fill: var(--muted);
  font-size: 15px;
  font-family: var(--font-sans, system-ui);
}

.chart-area .curve-human {
  fill: none;
  stroke: var(--p16-col-human);
  stroke-width: 2.5;
  stroke-linejoin: round;
}

.chart-area .curve-ape {
  fill: none;
  stroke-width: 2;
  stroke-linejoin: round;
  stroke-dasharray: 6 4;
  opacity: 0;
  transition: opacity 0.4s;
}

.chart-area .curve-ape.visible {
  opacity: 1;
}

.chart-area .event-dot {
  fill: var(--p16-col-human);
  cursor: pointer;
  transition: r 0.2s;
}

.chart-area .event-dot-ape {
  cursor: pointer;
  transition: r 0.2s;
}

.chart-area .event-dot:hover,
.chart-area .event-dot-ape:hover {
  r: 7;
}

.chart-area .event-label {
  font-size: 14px;
  fill: var(--text);
  font-family: var(--font-sans, system-ui);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  dominant-baseline: middle;
  text-anchor: start;
}

.chart-area .event-label.visible {
  opacity: 1;
}

.chart-area .event-connector {
  stroke: var(--p16-grid);
  stroke-width: 0.5;
  opacity: 0;
  transition: opacity 0.2s;
}

.chart-area .event-connector.visible {
  opacity: 1;
}

/* ===== accessibility ===== */
.species-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ===== reduced motion ===== */
@media (prefers-reduced-motion: reduce) {
  .curve-ape { transition: none; }
  .species-card { transition: none; }
  .ledger-item { transition: none; }
  .event-label { transition: none; }
  .event-connector { transition: none; }
}

/* ===== tick labels ===== */
.chart-area .tick text {
  font-family: var(--font-mono);
  font-size: 13px;
  fill: var(--muted);
}

.chart-area .tick line {
  stroke: var(--p16-grid);
  stroke-width: 0.5;
}

.chart-area .domain {
  stroke: var(--p16-grid);
  stroke-width: 0.5;
}
</style>
</head>
<body data-page="16" data-total="50">
<div id="stage">
<main id="main">
  <!-- main row: chart + species cards -->
  <div class="page-row">
    <div class="chart-area">
      <svg id="chart-svg"></svg>
    </div>
    <div class="species-cards" role="radiogroup" aria-label="选择物种比较">
      <div class="species-card active" data-species="human" tabindex="0" role="radio" aria-checked="true">
        <span class="card-name">人类</span>
        <span class="card-stat">依赖期 12.5 年</span>
      </div>
      <div class="species-card" data-species="chimpanzee" tabindex="0" role="radio" aria-checked="false">
        <span class="card-name">黑猩猩</span>
        <span class="card-stat">依赖期 1 年</span>
      </div>
      <div class="species-card" data-species="bonobo" tabindex="0" role="radio" aria-checked="false">
        <span class="card-name">倭黑猩猩</span>
        <span class="card-stat">依赖期 1 年</span>
      </div>
      <div class="species-card" data-species="gorilla" tabindex="0" role="radio" aria-checked="false">
        <span class="card-name">大猩猩</span>
        <span class="card-stat">依赖期 1 年</span>
      </div>
    </div>
  </div>
  <!-- bottom ledger -->
  <div class="bottom-ledger">
    <div class="ledger-row">
      <div class="ledger-item highlight" data-species="human">
        <span class="ledger-species">人类</span>
        <span class="ledger-value">12.5 年</span>
      </div>
      <div class="ledger-item" data-species="chimpanzee">
        <span class="ledger-species">黑猩猩</span>
        <span class="ledger-value">1 年</span>
      </div>
      <div class="ledger-item" data-species="bonobo">
        <span class="ledger-species">倭黑猩猩</span>
        <span class="ledger-value">1 年</span>
      </div>
      <div class="ledger-item" data-species="gorilla">
        <span class="ledger-species">大猩猩</span>
        <span class="ledger-value">1 年</span>
      </div>
    </div>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  'use strict';

  /* ===== 全套口径：发育事件典型值 ===== */
  var DEV_EVENTS = {
    human:      { wean: 2.5, independent: 15,  sexualMaturity: 14, firstBirth: 19.5 },
    chimpanzee: { wean: 4.5, independent: 5.5, sexualMaturity: 11, firstBirth: 14 },
    bonobo:     { wean: 4.5, independent: 5.5, sexualMaturity: 11, firstBirth: 14.5 },
    gorilla:    { wean: 3,   independent: 4,   sexualMaturity: 9,  firstBirth: 11 }
  };

  var SPECIES_INFO = {
    human:      { label: '人类',     color: '#4f6ef2', dashed: false },
    chimpanzee: { label: '黑猩猩',   color: '#e8854a', dashed: true },
    bonobo:     { label: '倭黑猩猩', color: '#5cb87a', dashed: true },
    gorilla:    { label: '大猩猩',   color: '#9b72cf', dashed: true }
  };

  var DEPENDENCY = {
    human:      12.5,
    chimpanzee: 1,
    bonobo:     1,
    gorilla:    1
  };

  /* ===== 曲线生成：分段线性插值 ===== */
  function generateCurveData(species) {
    var ev = DEV_EVENTS[species];
    var keyPoints = [
      { age: 0, independence: 0 },
      { age: ev.wean, independence: 5 },
      { age: ev.independent, independence: 70 },
      { age: ev.sexualMaturity, independence: 85 },
      { age: ev.firstBirth, independence: 100 }
    ];

    var data = [];
    for (var a = 0; a <= 22; a += 0.1) {
      var age = Math.round(a * 10) / 10;
      var indep = 100;
      for (var i = 0; i < keyPoints.length - 1; i++) {
        if (age >= keyPoints[i].age && age < keyPoints[i + 1].age) {
          var t = (age - keyPoints[i].age) / (keyPoints[i + 1].age - keyPoints[i].age);
          indep = keyPoints[i].independence + t * (keyPoints[i + 1].independence - keyPoints[i].independence);
          break;
        }
      }
      data.push({ age: age, independence: Math.round(indep * 10) / 10 });
    }
    return data;
  }

  /* ===== 获取关键事件点 ===== */
  function getEventPoints(species) {
    var ev = DEV_EVENTS[species];
    return [
      { age: 0,          independence: 0,   label: '出生' },
      { age: ev.wean,    independence: 5,   label: '断奶 ' + ev.wean + ' 岁' },
      { age: ev.independent, independence: 70, label: '独立觅食 ' + ev.independent + ' 岁' },
      { age: ev.sexualMaturity, independence: 85, label: '性成熟 ' + ev.sexualMaturity + ' 岁' },
      { age: ev.firstBirth, independence: 100, label: '首次生育 ' + ev.firstBirth + ' 岁' }
    ];
  }

  /* ===== 状态 ===== */
  var currentSelection = 'human'; // 'human' means no overlay

  /* ===== 初始化 d3 图表 ===== */
  var svg = d3.select('#chart-svg');
  var margin = { top: 20, right: 30, bottom: 36, left: 46 };
  var width, height, innerW, innerH;
  var xScale, yScale;
  var humanData = generateCurveData('human');

  var apeCurveGroup = svg.append('g').attr('class', 'ape-curve-group');
  var apeDotsGroup = svg.append('g').attr('class', 'ape-dots-group');
  var apeLabelsGroup = svg.append('g').attr('class', 'ape-labels-group');

  function getDimensions() {
    var rect = document.getElementById('chart-svg').getBoundingClientRect();
    width = rect.width;
    height = rect.height || 340;
    innerW = width - margin.left - margin.right;
    innerH = height - margin.top - margin.bottom;
  }

  function drawChart() {
    getDimensions();
    svg.selectAll('g:not(.ape-curve-group):not(.ape-dots-group):not(.ape-labels-group)').remove();

    xScale = d3.scaleLinear()
      .domain([0, 22])
      .range([0, innerW]);

    yScale = d3.scaleLinear()
      .domain([0, 100])
      .range([innerH, 0]);

    var g = svg.append('g')
      .attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');

    /* ---- grid lines ---- */
    for (var y = 0; y <= 100; y += 20) {
      g.append('line')
        .attr('class', y === 0 ? 'grid-line-zero' : 'grid-line')
        .attr('x1', 0).attr('x2', innerW)
        .attr('y1', yScale(y)).attr('y2', yScale(y));
    }
    for (var x = 0; x <= 22; x += 2) {
      g.append('line')
        .attr('class', 'grid-line')
        .attr('x1', xScale(x)).attr('x2', xScale(x))
        .attr('y1', 0).attr('y2', innerH);
    }

    /* ---- axes ---- */
    var xAxis = d3.axisBottom(xScale)
      .tickValues(d3.range(0, 23, 2))
      .tickFormat(function(d) { return d + '岁'; });

    var yAxis = d3.axisLeft(yScale)
      .tickValues([0, 25, 50, 75, 100])
      .tickFormat(function(d) { return d + '%'; });

    g.append('g')
      .attr('transform', 'translate(0,' + innerH + ')')
      .call(xAxis);

    g.append('g')
      .call(yAxis);

    /* ---- axis titles ---- */
    g.append('text')
      .attr('class', 'axis-title')
      .attr('x', innerW / 2)
      .attr('y', innerH + 32)
      .attr('text-anchor', 'middle')
      .text('年龄');

    g.append('text')
      .attr('class', 'axis-title')
      .attr('x', -36)
      .attr('y', innerH / 2)
      .attr('text-anchor', 'middle')
      .attr('transform', 'rotate(-90, -36, ' + (innerH / 2) + ')')
      .text('自立程度');

    /* ---- human curve (always visible) ---- */
    var lineGen = d3.line()
      .x(function(d) { return xScale(d.age); })
      .y(function(d) { return yScale(d.independence); })
      .curve(d3.curveMonotoneX);

    g.append('path')
      .datum(humanData)
      .attr('class', 'curve-human')
      .attr('d', lineGen);

    /* ---- human event dots ---- */
    var humanEvents = getEventPoints('human');
    var dotGroup = g.append('g').attr('class', 'human-dots');

    dotGroup.selectAll('circle')
      .data(humanEvents)
      .join('circle')
      .attr('class', 'event-dot')
      .attr('cx', function(d) { return xScale(d.age); })
      .attr('cy', function(d) { return yScale(d.independence); })
      .attr('r', 5)
      .attr('tabindex', 0)
      .on('mouseenter', showLabel)
      .on('mouseleave', hideLabel)
      .on('focus', showLabel)
      .on('blur', hideLabel);

    /* ---- hidden labels for human events ---- */
    var labelGroup = g.append('g').attr('class', 'human-labels');

    labelGroup.selectAll('g')
      .data(humanEvents)
      .join('g')
      .each(function(d) {
        var el = d3.select(this);
        var x = xScale(d.age);
        var y = yScale(d.independence);
        var labelX = x + 10;
        var labelY = y - 12;

        // connector line
        el.append('line')
          .attr('class', 'event-connector')
          .attr('x1', x + 5).attr('y1', y)
          .attr('x2', labelX - 2).attr('y2', labelY + 4);

        // label bg
        el.append('rect')
          .attr('class', 'event-label')
          .attr('x', labelX - 4)
          .attr('y', labelY - 10)
          .attr('rx', 3)
          .attr('ry', 3)
          .attr('fill', 'rgba(0,0,0,0.75)')
          .attr('width', d.label.length * 8 + 8)
          .attr('height', 20);

        // label text
        el.append('text')
          .attr('class', 'event-label')
          .attr('x', labelX)
          .attr('y', labelY + 4)
          .attr('fill', '#fff')
          .attr('font-size', 14)
          .text(d.label);
      });

    // re-draw ape overlay if needed
    if (currentSelection !== 'human') {
      drawApeOverlay(currentSelection, g);
    }

    // connect event dots to label hover
    dotGroup.selectAll('circle').each(function(d, i) {
      var idx = i;
      d3.select(this).on('mouseenter', function() {
        var labels = labelGroup.selectAll('g');
        labels.each(function(p, j) {
          if (j === idx) {
            d3.select(this).selectAll('.event-label, .event-connector').classed('visible', true);
          }
        });
      }).on('mouseleave', function() {
        labelGroup.selectAll('.event-label, .event-connector').classed('visible', false);
      }).on('focus', function() {
        var labels = labelGroup.selectAll('g');
        labels.each(function(p, j) {
          if (j === idx) {
            d3.select(this).selectAll('.event-label, .event-connector').classed('visible', true);
          }
        });
      }).on('blur', function() {
        labelGroup.selectAll('.event-label, .event-connector').classed('visible', false);
      });
    });
  }

  function drawApeOverlay(species, g) {
    if (!g) {
      g = svg.select('g').node() ? svg.select('g') : null;
      if (!g) return;
    }
    var info = SPECIES_INFO[species];
    if (!info || info.dashed === false) return;

    var data = generateCurveData(species);
    var events = getEventPoints(species);
    var lineGen = d3.line()
      .x(function(d) { return xScale(d.age); })
      .y(function(d) { return yScale(d.independence); })
      .curve(d3.curveMonotoneX);

    /* ---- clear previous ape overlay ---- */
    apeCurveGroup.selectAll('*').remove();
    apeDotsGroup.selectAll('*').remove();
    apeLabelsGroup.selectAll('*').remove();

    /* ---- ape curve ---- */
    var path = apeCurveGroup.append('path')
      .datum(data)
      .attr('class', 'curve-ape')
      .attr('stroke', info.color)
      .attr('d', lineGen);

    /* ---- animate with gsap ---- */
    var pathNode = path.node();
    if (pathNode) {
      var length = pathNode.getTotalLength();
      path.attr('stroke-dasharray', length + ' ' + length)
        .attr('stroke-dashoffset', length)
        .classed('visible', true);
      gsap.to(pathNode, {
        strokeDashoffset: 0,
        duration: 0.8,
        ease: 'power2.out'
      });
    }

    /* ---- ape event dots ---- */
    apeDotsGroup.selectAll('circle')
      .data(events)
      .join('circle')
      .attr('class', 'event-dot-ape')
      .attr('cx', function(d) { return xScale(d.age); })
      .attr('cy', function(d) { return yScale(d.independence); })
      .attr('r', 5)
      .attr('fill', info.color)
      .attr('stroke', 'rgba(0,0,0,0.3)')
      .attr('stroke-width', 1)
      .attr('tabindex', 0)
      .on('mouseenter', function(ev, d) { showApeLabel(ev, d, species); })
      .on('mouseleave', hideApeLabel)
      .on('focus', function(ev, d) { showApeLabel(ev, d, species); })
      .on('blur', hideApeLabel);

    /* ---- ape labels (hidden initially) ---- */
    apeLabelsGroup.selectAll('g')
      .data(events)
      .join('g')
      .each(function(d) {
        var el = d3.select(this);
        var x = xScale(d.age);
        var y = yScale(d.independence);
        var labelX = x + 10;
        var labelY = y - 12;

        el.append('line')
          .attr('class', 'event-connector')
          .attr('x1', x + 5).attr('y1', y)
          .attr('x2', labelX - 2).attr('y2', labelY + 4);

        el.append('rect')
          .attr('class', 'event-label')
          .attr('x', labelX - 4)
          .attr('y', labelY - 10)
          .attr('rx', 3)
          .attr('ry', 3)
          .attr('fill', 'rgba(0,0,0,0.75)')
          .attr('width', d.label.length * 8 + 8)
          .attr('height', 20);

        el.append('text')
          .attr('class', 'event-label')
          .attr('x', labelX)
          .attr('y', labelY + 4)
          .attr('fill', '#fff')
          .attr('font-size', 14)
          .text(d.label);
      });

    // animate dots appearance
    gsap.fromTo(apeDotsGroup.selectAll('circle').nodes(), {
      scale: 0,
      transformOrigin: 'center'
    }, {
      scale: 1,
      duration: 0.4,
      stagger: 0.08,
      ease: 'back.out(1.5)',
      delay: 0.3
    });
  }

  function showLabel(ev, d) {
    var idx = humanEvents.indexOf(d);
    // find the label group
    var labels = d3.select('.human-labels');
    labels.selectAll('g').each(function(p, i) {
      if (i === idx) {
        d3.select(this).selectAll('.event-label, .event-connector').classed('visible', true);
      }
    });
  }

  var humanEvents = getEventPoints('human');

  function showApeLabel(ev, d, species) {
    var idx = getEventPoints(species).indexOf(d);
    apeLabelsGroup.selectAll('g').each(function(p, i) {
      if (i === idx) {
        d3.select(this).selectAll('.event-label, .event-connector').classed('visible', true);
      }
    });
  }

  function hideLabel() {
    d3.selectAll('.human-labels .event-label, .human-labels .event-connector').classed('visible', false);
  }

  function hideApeLabel() {
    apeLabelsGroup.selectAll('.event-label, .event-connector').classed('visible', false);
  }

  /* ===== 物种卡片交互 ===== */
  function selectSpecies(species) {
    if (species === currentSelection) return;
    currentSelection = species;

    // update cards
    d3.selectAll('.species-card').classed('active', false)
      .attr('aria-checked', 'false');
    d3.select('.species-card[data-species="' + species + '"]')
      .classed('active', true)
      .attr('aria-checked', 'true');

    // update ledger
    d3.selectAll('.ledger-item').classed('highlight', false);
    d3.select('.ledger-item[data-species="' + species + '"]')
      .classed('highlight', true);

    if (species === 'human') {
      // clear ape overlay
      apeCurveGroup.selectAll('*').remove();
      apeDotsGroup.selectAll('*').remove();
      apeLabelsGroup.selectAll('*').remove();
    } else {
      // redraw on existing chart
      var g = svg.select('g');
      if (g.node()) {
        drawApeOverlay(species, g);
      }
    }
  }

  function setupCards() {
    d3.selectAll('.species-card').on('click', function() {
      var species = d3.select(this).attr('data-species');
      selectSpecies(species);
    }).on('keydown', function(ev) {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        var species = d3.select(this).attr('data-species');
        selectSpecies(species);
      }
    });
  }

  /* ===== resize handler ===== */
  var resizeTimer;
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      drawChart();
      if (currentSelection !== 'human') {
        var g = svg.select('g');
        if (g.node()) {
          drawApeOverlay(currentSelection, g);
        }
      }
    }, 150);
  }

  /* ===== 初始化 ===== */
  function init() {
    /* ---- mount Lec ---- */
    Lec.mount({
      index: 16,
      kicker: '猿的身体 · 演化权衡',
      title: '长得慢，学得多',
      take: '人类童年比任何猿类都长——更长依赖期换来更长的学习期'
    });

    /* ---- draw chart ---- */
    drawChart();
    setupCards();
    window.addEventListener('resize', onResize);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
