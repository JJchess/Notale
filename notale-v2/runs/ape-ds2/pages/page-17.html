<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
  --panel-bg: rgba(255,255,255,0.06);
  --panel-border: rgba(255,255,255,0.12);
  --border: rgba(255,255,255,0.12);
  --accent: #6b8aff;
  --accent-soft: rgba(107,138,255,0.18);
  --muted: #8896ab;
  --success: #4ade80;
  --fail: #f87171;
  --bg-dark: #080b10;
}

/* Override theme.css k-process for dark bg */
.k-process::before { background: var(--panel-border); }
.k-process > .step { background: var(--panel-bg); border-color: var(--panel-border); color: var(--text); padding: 6px 8px; }
.k-process > .step.current { border-color: var(--accent); background: var(--accent-soft); }
.k-process > .step.done { opacity: 0.5; }
.k-process > .arw { color: var(--muted); width: 22px; font-size: var(--fs-sec); }

/* Fix overflow from #main (100vw/100vh) exceeding stage's padded area */
#main { width: 100%; height: 100%; overflow: hidden; }

/* Page layout - constrained to stage padded area */
#pg17 {
  position: relative;
  width: var(--content-w);
  max-width: 100%;
  height: var(--content-h);
  max-height: 100%;
  display: flex;
  flex-direction: column;
  gap: 0;
  box-sizing: border-box;
  overflow: hidden;
}

/* Process chain */
#process-chain {
  flex: 0 0 auto;
  padding: 0;
  margin-bottom: 6px;
  z-index: 10;
}
#process-chain .step {
  cursor: default;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 44px;
}
#process-chain .step .step-label {
  font-size: var(--fs-sec);
  font-weight: 600;
  line-height: 1.2;
}
#process-chain .step .step-sub {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.2;
  margin-top: 1px;
}
#process-chain .step.current .step-sub { color: var(--accent); }

/* Loop arrow */
.loop-wrap {
  position: relative;
  flex: 0 0 auto;
  align-self: center;
  width: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.loop-wrap .arw-down {
  color: var(--accent);
  font-size: 13px;
  line-height: 1;
}
.loop-wrap .arw-down::before { content: "↻"; }

/* Arrow tooltip */
.arw-tip {
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  display: none;
  pointer-events: none;
  margin-top: 2px;
  max-width: 180px;
  text-align: center;
  line-height: 1.2;
  z-index: 20;
}
.k-process > .arw:hover .arw-tip,
.k-process > .arw:focus-within .arw-tip { display: block; }
.k-process > .arw { position: relative; }

/* Game area */
#game-area {
  flex: 1 1 auto;
  position: relative;
  min-height: 0;
  overflow: hidden;
  border-radius: 6px;
  background: var(--bg-dark);
}

#three-container {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
#three-container canvas { display: block; }

/* Overlays */
.game-overlay {
  position: absolute;
  z-index: 5;
  pointer-events: none;
}
.game-overlay > * { pointer-events: auto; }

#attempts-panel {
  top: 8px;
  left: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  background: rgba(0,0,0,0.75);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  backdrop-filter: blur(6px);
}
#attempts-panel .label { font-size: 13px; color: var(--muted); }
#attempts-panel .count { font-size: 17px; font-weight: 700; color: var(--text); min-width: 16px; text-align: center; }
#attempts-panel .count.low { color: var(--fail); }

#progress-panel {
  bottom: 8px;
  right: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  background: rgba(0,0,0,0.75);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  backdrop-filter: blur(6px);
}
#progress-panel .label { font-size: 13px; color: var(--muted); }
#progress-panel .bar-track {
  width: 50px;
  height: 5px;
  background: rgba(255,255,255,0.12);
  border-radius: 3px;
  overflow: hidden;
}
#progress-panel .bar-fill {
  height: 100%;
  width: 0%;
  background: var(--success);
  border-radius: 3px;
  transition: width 0.5s ease;
}
#progress-panel .pcount { font-size: 14px; color: var(--muted); min-width: 20px; text-align: right; }

/* Controls */
#controls-area {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  pointer-events: none;
}
#controls-area > * { pointer-events: auto; }

.ctl-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  background: rgba(0,0,0,0.8);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  backdrop-filter: blur(6px);
}
.ctl-row .ctl-label { font-size: var(--fs-label); color: var(--muted); margin-right: 2px; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 4px 10px;
  font-size: var(--fs-label);
  font-weight: 600;
  border: 1px solid var(--panel-border);
  border-radius: 5px;
  background: rgba(255,255,255,0.08);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  line-height: 1.2;
  min-height: 28px;
}
.btn:hover { background: rgba(255,255,255,0.14); }
.btn:active { transform: scale(0.97); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #5a7ae6; }
.btn.primary:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.force-btn { min-width: 40px; }
.btn.force-btn.selected { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.dir-btn { min-width: 34px; }
.btn.dir-btn.selected { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* Feedback - invisible until triggered */
#feedback-area {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 6;
  pointer-events: none;
  text-align: center;
  max-width: 80%;
  display: none;
}
#feedback-text {
  display: inline-block;
  padding: 8px 16px;
  background: rgba(0,0,0,0.85);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  backdrop-filter: blur(6px);
  font-size: var(--fs-body);
  color: var(--text);
  line-height: 1.4;
  max-width: 380px;
}
#feedback-text.show { display: inline-block; }
#feedback-text.success { border-color: var(--success); }
#feedback-text.fail { border-color: var(--fail); }

/* Prompt */
#prompt-text {
  position: absolute;
  bottom: 56px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  font-size: var(--fs-sec);
  color: var(--muted);
  background: rgba(0,0,0,0.6);
  padding: 4px 14px;
  border-radius: 5px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  white-space: nowrap;
}
#prompt-text.show { opacity: 1; }

/* Rotate hint */
#rotate-hint {
  position: absolute;
  bottom: 56px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 4;
  font-size: 12px;
  color: rgba(255,255,255,0.25);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.5s;
  white-space: nowrap;
}
#rotate-hint.show { opacity: 1; }
#rotate-hint.hidden { opacity: 0; }

/* Complete overlay */
#complete-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  pointer-events: none;
}
#complete-overlay.show { display: flex; pointer-events: auto; }
#complete-overlay .big-text {
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 10px;
}
#complete-overlay .sub-text {
  font-size: var(--fs-body);
  color: var(--muted);
  margin-bottom: 20px;
  max-width: 380px;
  text-align: center;
  line-height: 1.5;
}
#complete-overlay .btn { pointer-events: auto; }

/* Year label */
#year-label {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  font-size: var(--fs-label);
  color: var(--muted);
  background: rgba(0,0,0,0.5);
  padding: 3px 10px;
  border-radius: 4px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.5s;
}
#year-label.show { opacity: 1; }
</style>
</head>
<body data-page="17" data-total="50">
<div id="stage">
  <main id="main">
    <div id="pg17">
      <!-- Process chain -->
      <div class="k-process" id="process-chain">
        <div class="step current" data-step="0">
          <div class="step-label">石料</div>
          <div class="step-sub">选原石</div>
        </div>
        <div class="arw" tabindex="0" data-q="0">
          →
          <span class="arw-tip">为什么选这一块？<br>内部可产生刃口</span>
        </div>
        <div class="step" data-step="1">
          <div class="step-label">计划</div>
          <div class="step-sub">台面·方向·力度</div>
        </div>
        <div class="arw" tabindex="0" data-q="1">
          →
          <span class="arw-tip">打在这个台面？<br>外倾角让薄片离开</span>
        </div>
        <div class="step" data-step="2">
          <div class="step-label">打击</div>
          <div class="step-sub">落锤</div>
        </div>
        <div class="arw" tabindex="0" data-q="2">
          →
          <span class="arw-tip">这个力度？<br>薄片整体脱落</span>
        </div>
        <div class="step" data-step="3">
          <div class="step-label">刃口</div>
          <div class="step-sub">新刃口</div>
        </div>
        <div class="loop-wrap">
          <div class="arw-down"></div>
        </div>
      </div>

      <!-- Game area -->
      <div id="game-area">
        <div id="three-container"></div>

        <!-- Year label -->
        <div id="year-label"></div>

        <!-- Rotate hint -->
        <div id="rotate-hint">拖拽旋转 · 观察石核</div>

        <!-- Attempts -->
        <div id="attempts-panel" class="game-overlay">
          <span class="label">剩余尝试</span>
          <span class="count" id="attempts-count">5</span>
        </div>

        <!-- Progress -->
        <div id="progress-panel" class="game-overlay">
          <span class="label">刃口</span>
          <div class="bar-track"><div class="bar-fill" id="bar-fill"></div></div>
          <span class="pcount" id="progress-count">0/2</span>
        </div>

        <!-- Feedback -->
        <div id="feedback-area">
          <div id="feedback-text"></div>
        </div>

        <!-- Prompt -->
        <div id="prompt-text">点击台面选择打击位置</div>

        <!-- Controls -->
        <div id="controls-area">
          <div class="ctl-row" id="dir-row" style="display:none">
            <span class="ctl-label">方向</span>
            <button class="btn dir-btn" data-dir="0">A</button>
            <button class="btn dir-btn" data-dir="1">B</button>
            <button class="btn dir-btn" data-dir="2">C</button>
          </div>
          <div class="ctl-row" id="force-row" style="display:none">
            <span class="ctl-label">力度</span>
            <button class="btn force-btn" data-force="0">轻</button>
            <button class="btn force-btn" data-force="1">中</button>
            <button class="btn force-btn" data-force="2">重</button>
          </div>
          <div class="ctl-row" id="strike-row" style="display:none">
            <button class="btn primary" id="strike-btn" disabled>落锤</button>
          </div>
          <div class="ctl-row" id="reset-row" style="display:none">
            <button class="btn" id="reset-btn">重新开始</button>
          </div>
        </div>

        <!-- Complete overlay -->
        <div id="complete-overlay">
          <div class="big-text">一件石器完成了</div>
          <div class="sub-text" id="complete-msg"></div>
          <button class="btn primary" id="complete-restart-btn">重新开始</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/three.min.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
(function() {
  'use strict';

  /* ========== CONSTANTS (全套口径) ========== */
  var LOMEKWI3_YEARS_AGO = 3.3e6;
  var PLATFORM_COUNT = 4;
  var SUCCESS_THRESHOLD = 2;
  var MAX_ATTEMPTS = 5;

  /* ========== LEC MOUNT ========== */
  Lec.mount({
    index: 17,
    kicker: '第3章 · 火与认知',
    title: '石器打制台',
    take: '约 330 万年前，一块被刻意敲出刃口的石头，要求的是「事先计划」'
  });

  /* ========== DOM REFS ========== */
  var threeContainer = document.getElementById('three-container');
  var yearLabel = document.getElementById('year-label');
  var rotateHint = document.getElementById('rotate-hint');
  var attemptsCount = document.getElementById('attempts-count');
  var barFill = document.getElementById('bar-fill');
  var progressCount = document.getElementById('progress-count');
  var feedbackText = document.getElementById('feedback-text');
  var promptText = document.getElementById('prompt-text');
  var dirRow = document.getElementById('dir-row');
  var forceRow = document.getElementById('force-row');
  var strikeRow = document.getElementById('strike-row');
  var resetRow = document.getElementById('reset-row');
  var strikeBtn = document.getElementById('strike-btn');
  var resetBtn = document.getElementById('reset-btn');
  var completeOverlay = document.getElementById('complete-overlay');
  var completeMsg = document.getElementById('complete-msg');
  var completeRestartBtn = document.getElementById('complete-restart-btn');
  var steps = document.querySelectorAll('#process-chain .step');
  var dirBtns = document.querySelectorAll('.dir-btn');
  var forceBtns = document.querySelectorAll('.force-btn');

  /* ========== THREE.JS SCENE ========== */
  var scene, camera, renderer, coreGroup, coreMesh;
  var platforms = [];
  var hammerGroup, hammerHead, hammerHandle;
  var platformData = [];
  var isDragging = false, prevPointer = null;
  var autoRotate = true;
  var animFrame = null;

  // Platform positions on the stone surface
  var platformPositions = [
    { dir: [0.6, 0.4, 0.7] },
    { dir: [-0.5, 0.6, -0.6] },
    { dir: [0.7, -0.3, -0.5] },
    { dir: [-0.6, -0.5, 0.5] }
  ];

  // Direction options per platform
  var directionOptions = [
    [ [0.2, 0.1, 0.8], [0.8, 0.0, 0.3], [0.4, 0.5, 0.6] ],
    [ [-0.3, 0.2, -0.8], [-0.7, 0.1, -0.4], [-0.5, 0.6, -0.3] ],
    [ [0.5, -0.2, -0.7], [0.3, -0.6, -0.5], [0.7, -0.4, -0.2] ],
    [ [-0.5, -0.3, 0.6], [-0.2, -0.7, 0.4], [-0.6, -0.5, 0.2] ]
  ];

  function initScene() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080b10);

    var w = threeContainer.clientWidth;
    var h = threeContainer.clientHeight;
    camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 20);
    camera.position.set(3.5, 2.0, 4.5);
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    threeContainer.appendChild(renderer.domElement);
    renderer.domElement.classList.add('cv-fill');

    // Lights
    var ambient = new THREE.AmbientLight(0x404060, 0.6);
    scene.add(ambient);

    var keyLight = new THREE.DirectionalLight(0xffeedd, 1.8);
    keyLight.position.set(5, 8, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 512;
    keyLight.shadow.mapSize.height = 512;
    scene.add(keyLight);

    var fillLight = new THREE.DirectionalLight(0x8888ff, 0.5);
    fillLight.position.set(-4, 2, -3);
    scene.add(fillLight);

    var rimLight = new THREE.DirectionalLight(0x88aaff, 0.6);
    rimLight.position.set(0, -3, -6);
    scene.add(rimLight);

    // Ground plane
    var groundGeo = new THREE.PlaneGeometry(8, 8);
    var groundMat = new THREE.MeshStandardMaterial({
      color: 0x0a0d14,
      roughness: 1,
      metalness: 0,
      transparent: true,
      opacity: 0.5
    });
    var ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.8;
    ground.receiveShadow = true;
    scene.add(ground);

    // Core group
    coreGroup = new THREE.Group();
    scene.add(coreGroup);

    createStoneCore();
    createPlatforms();
    createHammer();

    resizeRenderer();
    startRenderLoop();
  }

  function createStoneCore() {
    var geo = new THREE.IcosahedronGeometry(1.4, 3);
    var pos = geo.attributes.position;
    var colorArr = new Float32Array(pos.count * 3);
    for (var i = 0; i < pos.count; i++) {
      var x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      var len = Math.sqrt(x*x + y*y + z*z);
      var noise = 0.82 + 0.36 * Math.random();
      var nx = x / len * noise;
      var ny = y / len * noise;
      var nz = z / len * noise;
      pos.setXYZ(i, nx, ny, nz);
      var base = 0.55 + 0.15 * Math.random();
      colorArr[i*3] = base + 0.05 * Math.random();
      colorArr[i*3+1] = base + 0.02 * Math.random();
      colorArr[i*3+2] = base - 0.05 * Math.random();
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colorArr, 3));
    geo.computeVertexNormals();

    var mat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.85,
      metalness: 0.05,
      flatShading: false
    });
    coreMesh = new THREE.Mesh(geo, mat);
    coreMesh.castShadow = true;
    coreMesh.receiveShadow = true;
    coreGroup.add(coreMesh);
  }

  function createPlatforms() {
    for (var i = 0; i < PLATFORM_COUNT; i++) {
      var pd = platformPositions[i];
      var dir = new THREE.Vector3(pd.dir[0], pd.dir[1], pd.dir[2]).normalize();
      var pos = dir.clone().multiplyScalar(1.45);

      // Platform ring
      var ringGeo = new THREE.RingGeometry(0.16, 0.28, 12);
      var ringMat = new THREE.MeshBasicMaterial({
        color: 0x6b8aff,
        transparent: true,
        opacity: 0.0,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      var ring = new THREE.Mesh(ringGeo, ringMat);
      ring.position.copy(pos);
      ring.lookAt(0, 0, 0);
      ring.userData = { platformIndex: i };

      // Highlight disc
      var discGeo = new THREE.CircleGeometry(0.30, 12);
      var discMat = new THREE.MeshBasicMaterial({
        color: 0x6b8aff,
        transparent: true,
        opacity: 0.0,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      var disc = new THREE.Mesh(discGeo, discMat);
      disc.position.copy(pos);
      disc.lookAt(0, 0, 0);

      // Target outline
      var targetGeo = new THREE.RingGeometry(0.18, 0.24, 12);
      var targetMat = new THREE.MeshBasicMaterial({
        color: 0x8896ab,
        transparent: true,
        opacity: 0.12,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      var target = new THREE.Mesh(targetGeo, targetMat);
      target.position.copy(pos);
      target.lookAt(0, 0, 0);

      coreGroup.add(ring);
      coreGroup.add(disc);
      coreGroup.add(target);
      platforms.push({ ring: ring, disc: disc, target: target, pos: pos, dir: dir, index: i });
    }
  }

  function createHammer() {
    hammerGroup = new THREE.Group();
    coreGroup.add(hammerGroup);

    var handleMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9, metalness: 0 });
    var handleGeo = new THREE.CylinderGeometry(0.06, 0.08, 1.2, 6);
    hammerHandle = new THREE.Mesh(handleGeo, handleMat);
    hammerHandle.position.set(0, -0.7, 0);
    hammerHandle.rotation.x = 0.2;
    hammerGroup.add(hammerHandle);

    var headMat = new THREE.MeshStandardMaterial({ color: 0x7a7a7a, roughness: 0.85, metalness: 0.1 });
    var headGeo = new THREE.SphereGeometry(0.22, 8, 8);
    hammerHead = new THREE.Mesh(headGeo, headMat);
    hammerHead.position.set(0, 0.55, 0);
    hammerHead.scale.set(1, 0.8, 1);
    hammerGroup.add(hammerHead);

    hammerGroup.position.set(2.0, 1.5, 1.0);
    hammerGroup.rotation.set(0.3, -0.4, 0.1);
  }

  function resizeRenderer() {
    var w = threeContainer.clientWidth;
    var h = threeContainer.clientHeight;
    if (w < 1 || h < 1) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }

  function startRenderLoop() {
    function render() {
      if (autoRotate && !isDragging && coreGroup) {
        coreGroup.rotation.y += 0.003;
      }
      renderer.render(scene, camera);
      animFrame = requestAnimationFrame(render);
    }
    animFrame = requestAnimationFrame(render);
  }

  /* ========== ORBIT CONTROLS ========== */
  function setupOrbitControls() {
    var canvas = renderer.domElement;
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointerleave', onPointerUp);
  }

  function onPointerDown(e) {
    if (e.button !== 0) return;
    var rect = renderer.domElement.getBoundingClientRect();
    var x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    var y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    var raycaster = new THREE.Raycaster();
    var mouse = new THREE.Vector2(x, y);
    raycaster.setFromCamera(mouse, camera);

    if (gameState === 'IDLE') {
      var meshes = platforms.map(function(p) { return p.ring; });
      var intersects = raycaster.intersectObjects(meshes);
      if (intersects.length > 0) {
        var idx = intersects[0].object.userData.platformIndex;
        selectPlatform(idx);
        return;
      }
    }

    isDragging = true;
    autoRotate = false;
    prevPointer = { x: e.clientX, y: e.clientY };
  }

  function onPointerMove(e) {
    if (!isDragging || !prevPointer) return;
    var dx = e.clientX - prevPointer.x;
    var dy = e.clientY - prevPointer.y;
    prevPointer = { x: e.clientX, y: e.clientY };
    coreGroup.rotation.y += dx * 0.01;
    coreGroup.rotation.x += dy * 0.005;
    coreGroup.rotation.x = Math.max(-0.8, Math.min(0.8, coreGroup.rotation.x));
  }

  function onPointerUp() {
    isDragging = false;
    setTimeout(function() { autoRotate = true; }, 2000);
  }

  /* ========== GAME STATE ========== */
  var gameState = 'IDLE';
  var attempts = MAX_ATTEMPTS;
  var progress = 0;
  var selectedPlatformIdx = -1;
  var selectedDirection = -1;
  var selectedForce = 1;
  var hammerRestPos = new THREE.Vector3(2.0, 1.5, 1.0);
  var hammerRestRot = { x: 0.3, y: -0.4, z: 0.1 };

  function updateStepChain(state) {
    var stepIdx = 0;
    if (state === 'IDLE') stepIdx = 0;
    else if (state === 'PLATFORM_SELECTED' || state === 'DIRECTION_SELECTED' || state === 'FORCE_SELECTED') stepIdx = 1;
    else if (state === 'STRIKING') stepIdx = 2;
    else if (state === 'RESULT' || state === 'COMPLETE') stepIdx = 3;

    steps.forEach(function(s, i) {
      s.classList.remove('current', 'done');
      if (i < stepIdx) s.classList.add('done');
      else if (i === stepIdx) s.classList.add('current');
    });
  }

  function showPrompt(text) {
    promptText.textContent = text;
    promptText.classList.add('show');
  }

  function hidePrompt() {
    promptText.classList.remove('show');
  }

  function showFeedback(text, type) {
    feedbackText.textContent = text;
    feedbackText.className = '';
    if (type) feedbackText.classList.add(type);
    feedbackText.classList.add('show');
    document.getElementById('feedback-area').style.display = 'block';
  }

  function hideFeedback() {
    feedbackText.classList.remove('show');
    feedbackText.className = '';
    document.getElementById('feedback-area').style.display = 'none';
  }

  function selectPlatform(idx) {
    if (gameState !== 'IDLE') return;
    selectedPlatformIdx = idx;
    gameState = 'PLATFORM_SELECTED';
    autoRotate = false;

    platforms.forEach(function(p, i) {
      p.disc.material.opacity = (i === idx) ? 0.5 : 0.0;
      p.ring.material.opacity = (i === idx) ? 0.7 : 0.0;
    });

    dirRow.style.display = 'flex';
    dirBtns.forEach(function(b) {
      b.classList.remove('selected');
      b.disabled = false;
    });
    forceRow.style.display = 'none';
    strikeRow.style.display = 'none';
    hideFeedback();
    showPrompt('选择击打方向');
    updateStepChain(gameState);

    var pd = platformPositions[idx];
    var angle = Math.atan2(pd.dir[0], pd.dir[2]);
    gsap.to(coreGroup.rotation, { y: -angle, duration: 0.6, ease: 'power2.out' });
  }

  function selectDirection(dirIdx) {
    if (gameState !== 'PLATFORM_SELECTED') return;
    selectedDirection = dirIdx;
    gameState = 'DIRECTION_SELECTED';

    dirBtns.forEach(function(b, i) {
      b.classList.toggle('selected', i === dirIdx);
    });

    forceRow.style.display = 'flex';
    forceBtns.forEach(function(b) { b.classList.remove('selected'); });
    strikeRow.style.display = 'none';
    showPrompt('选择力度');
    updateStepChain(gameState);
    showDirectionArrow(selectedPlatformIdx, dirIdx);
  }

  function selectForce(forceIdx) {
    if (gameState !== 'DIRECTION_SELECTED') return;
    selectedForce = forceIdx;
    gameState = 'FORCE_SELECTED';

    forceBtns.forEach(function(b, i) {
      b.classList.toggle('selected', i === forceIdx);
    });

    strikeRow.style.display = 'flex';
    strikeBtn.disabled = false;
    showPrompt('准备落锤');
    updateStepChain(gameState);
  }

  function showDirectionArrow(platformIdx, dirIdx) {
    var oldArrow = coreGroup.getObjectByName('dirArrow');
    if (oldArrow) coreGroup.remove(oldArrow);

    var dirVec = new THREE.Vector3(
      directionOptions[platformIdx][dirIdx][0],
      directionOptions[platformIdx][dirIdx][1],
      directionOptions[platformIdx][dirIdx][2]
    ).normalize();
    var startPos = new THREE.Vector3(
      platformPositions[platformIdx].dir[0],
      platformPositions[platformIdx].dir[1],
      platformPositions[platformIdx].dir[2]
    ).normalize().multiplyScalar(1.5);

    var arrow = new THREE.ArrowHelper(dirVec, startPos, 0.8, 0x6b8aff, 0.25, 0.12);
    arrow.name = 'dirArrow';
    coreGroup.add(arrow);
  }

  function clearDirectionArrow() {
    var oldArrow = coreGroup.getObjectByName('dirArrow');
    if (oldArrow) {
      coreGroup.remove(oldArrow);
      oldArrow.dispose && oldArrow.dispose();
    }
  }

  function performStrike() {
    if (gameState !== 'FORCE_SELECTED') return;
    gameState = 'STRIKING';
    strikeBtn.disabled = true;
    hidePrompt();
    hideFeedback();
    updateStepChain(gameState);

    var pd = platformPositions[selectedPlatformIdx];
    var dirVec = new THREE.Vector3(
      directionOptions[selectedPlatformIdx][selectedDirection][0],
      directionOptions[selectedPlatformIdx][selectedDirection][1],
      directionOptions[selectedPlatformIdx][selectedDirection][2]
    ).normalize();
    var normal = new THREE.Vector3(pd.dir[0], pd.dir[1], pd.dir[2]).normalize();
    var angle = dirVec.angleTo(normal);
    var success = angle < (Math.PI / 4);

    var strikePos = new THREE.Vector3(pd.dir[0], pd.dir[1], pd.dir[2]).normalize().multiplyScalar(1.6);
    var retreatPos = strikePos.clone().add(new THREE.Vector3(0.4, 0.3, 0.4));

    var speeds = [0.35, 0.22, 0.12];
    var strikeDuration = speeds[selectedForce] || 0.22;
    var retreatDuration = 0.18;

    var tl = gsap.timeline({
      onComplete: function() {
        onStrikeComplete(success);
      }
    });

    tl.to(hammerGroup.position, {
      x: strikePos.x, y: strikePos.y, z: strikePos.z,
      duration: strikeDuration,
      ease: 'power2.in'
    }, 0);

    tl.to(hammerGroup.rotation, {
      x: -0.5, y: 0, z: 0,
      duration: strikeDuration * 0.7,
      ease: 'power1.in'
    }, 0);

    tl.to(coreGroup.position, {
      x: 0.03, y: 0.02, z: 0,
      duration: 0.04,
      ease: 'none',
      yoyo: true,
      repeat: 3
    }, strikeDuration * 0.8);

    tl.to(hammerGroup.position, {
      x: retreatPos.x, y: retreatPos.y, z: retreatPos.z,
      duration: retreatDuration,
      ease: 'power1.out'
    }, strikeDuration + 0.05);

    tl.to(hammerGroup.rotation, {
      x: 0.3, y: -0.4, z: 0.1,
      duration: retreatDuration,
      ease: 'power1.out'
    }, strikeDuration + 0.05);
  }

  function onStrikeComplete(success) {
    attempts--;
    attemptsCount.textContent = attempts;
    attemptsCount.classList.toggle('low', attempts <= 0);

    if (success) {
      progress++;
      var pct = (progress / SUCCESS_THRESHOLD) * 100;
      barFill.style.width = pct + '%';
      progressCount.textContent = progress + '/' + SUCCESS_THRESHOLD;

      animateFlakeDetachment(selectedPlatformIdx);
      animateEdgeGlow(selectedPlatformIdx);
      showFeedback('这一击，剥下了一片刃口。', 'success');

      if (progress >= SUCCESS_THRESHOLD) {
        gameState = 'COMPLETE';
        setTimeout(function() { showComplete(); }, 1200);
      } else {
        gameState = 'RESULT';
        showPrompt('继续下一片刃口');
        setTimeout(function() { resetForNextFlake(); }, 1500);
      }
    } else {
      animateFailure(selectedPlatformIdx);
      showFeedback('这一击没有形成刃口——事前没有把它放进计划。', 'fail');

      if (attempts <= 0) {
        gameState = 'EMPTY';
        setTimeout(function() {
          animateShatter();
          setTimeout(function() { resetGame(); }, 1500);
        }, 1000);
      } else {
        gameState = 'RESULT';
        showPrompt('再试一次');
        setTimeout(function() { resetForNextFlake(); }, 2000);
      }
    }
    updateStepChain(gameState);
  }

  function animateFlakeDetachment(platformIdx) {
    var pd = platformPositions[platformIdx];
    var pos = new THREE.Vector3(pd.dir[0], pd.dir[1], pd.dir[2]).normalize().multiplyScalar(1.4);
    var dir = new THREE.Vector3(pd.dir[0], pd.dir[1], pd.dir[2]).normalize();

    var flakeGeo = new THREE.CircleGeometry(0.18, 8);
    var flakeMat = new THREE.MeshStandardMaterial({
      color: 0xc8c8c8,
      roughness: 0.7,
      metalness: 0.1,
      side: THREE.DoubleSide
    });
    var flake = new THREE.Mesh(flakeGeo, flakeMat);
    flake.position.copy(pos);
    flake.lookAt(0, 0, 0);
    flake.position.add(dir.clone().multiplyScalar(0.05));
    coreGroup.add(flake);

    var fallDir = new THREE.Vector3(
      (Math.random() - 0.5) * 0.4,
      -0.5 - Math.random() * 0.3,
      (Math.random() - 0.5) * 0.4
    ).normalize();
    var fallTarget = pos.clone().add(fallDir.clone().multiplyScalar(0.5));
    fallTarget.y -= 0.3;

    gsap.to(flake.position, {
      x: fallTarget.x, y: fallTarget.y, z: fallTarget.z,
      duration: 0.7,
      ease: 'power2.out'
    });
    gsap.to(flake.rotation, {
      x: Math.random() * 2, y: Math.random() * 2, z: Math.random() * 2,
      duration: 0.8,
      ease: 'power1.out'
    });
    gsap.to(flake.material, {
      opacity: 0,
      duration: 1.2,
      delay: 0.4,
      onComplete: function() {
        coreGroup.remove(flake);
        flake.geometry.dispose();
        flake.material.dispose();
      }
    });
  }

  function animateEdgeGlow(platformIdx) {
    var pd = platformPositions[platformIdx];
    var pos = new THREE.Vector3(pd.dir[0], pd.dir[1], pd.dir[2]).normalize().multiplyScalar(1.45);

    var glowGeo = new THREE.RingGeometry(0.22, 0.32, 12);
    var glowMat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    var glow = new THREE.Mesh(glowGeo, glowMat);
    glow.position.copy(pos);
    glow.lookAt(0, 0, 0);
    glow.name = 'edgeGlow';
    coreGroup.add(glow);

    gsap.to(glow.material, { opacity: 0.7, duration: 0.25, ease: 'power2.out' });
    gsap.to(glow.material, { opacity: 0.15, duration: 1.2, delay: 0.3, ease: 'power1.inOut' });

    platforms[platformIdx].ring.material.color.set(0xffffff);
    gsap.to(platforms[platformIdx].ring.material, { opacity: 0.5, duration: 0.25 });
  }

  function animateFailure(platformIdx) {
    var pd = platformPositions[platformIdx];
    var pos = new THREE.Vector3(pd.dir[0], pd.dir[1], pd.dir[2]).normalize().multiplyScalar(1.4);

    var flashGeo = new THREE.SphereGeometry(0.25, 6, 6);
    var flashMat = new THREE.MeshBasicMaterial({
      color: 0xf87171,
      transparent: true,
      opacity: 0.4
    });
    var flash = new THREE.Mesh(flashGeo, flashMat);
    flash.position.copy(pos);
    flash.name = 'failFlash';
    coreGroup.add(flash);

    gsap.to(flash.material, {
      opacity: 0, duration: 0.5, ease: 'power2.out',
      onComplete: function() {
        coreGroup.remove(flash);
        flash.geometry.dispose();
        flash.material.dispose();
      }
    });

    gsap.to(coreGroup.position, {
      x: 0.04, y: 0.02, z: 0,
      duration: 0.03,
      yoyo: true,
      repeat: 5,
      ease: 'none',
      onComplete: function() { coreGroup.position.set(0, 0, 0); }
    });
  }

  function animateShatter() {
    coreMesh.visible = false;
    for (var i = 0; i < 15; i++) {
      var fragGeo = new THREE.DodecahedronGeometry(0.06 + Math.random() * 0.12);
      var fragMat = new THREE.MeshStandardMaterial({
        color: 0x8a8a8a, roughness: 0.9, metalness: 0
      });
      var frag = new THREE.Mesh(fragGeo, fragMat);
      var dir = new THREE.Vector3(
        (Math.random() - 0.5) * 2,
        Math.random() * 1.5,
        (Math.random() - 0.5) * 2
      );
      frag.position.copy(dir.clone().multiplyScalar(0.3));
      frag.name = 'shatter';
      coreGroup.add(frag);

      gsap.to(frag.position, {
        x: dir.x * (0.4 + Math.random() * 0.7),
        y: dir.y * (0.2 + Math.random() * 0.4) - 0.5,
        z: dir.z * (0.4 + Math.random() * 0.7),
        duration: 0.7 + Math.random() * 0.4,
        ease: 'power2.out'
      });
      gsap.to(frag.rotation, {
        x: Math.random() * 6, y: Math.random() * 6, z: Math.random() * 6,
        duration: 0.8 + Math.random() * 0.4,
        ease: 'power1.out'
      });
      gsap.to(frag.material, {
        opacity: 0, duration: 0.8, delay: 0.4,
        onComplete: function() {
          coreGroup.remove(frag);
          frag.geometry.dispose();
          frag.material.dispose();
        }
      });
    }
  }

  function clearOldEffects() {
    var toRemove = [];
    coreGroup.children.forEach(function(child) {
      if (child.name === 'edgeGlow' || child.name === 'dirArrow' || child.name === 'failFlash' || child.name === 'shatter') {
        toRemove.push(child);
      }
    });
    toRemove.forEach(function(child) {
      coreGroup.remove(child);
      if (child.geometry) child.geometry.dispose();
      if (child.material) child.material.dispose();
    });
  }

  function resetForNextFlake() {
    clearOldEffects();
    clearDirectionArrow();
    coreMesh.visible = true;

    platforms.forEach(function(p) {
      p.disc.material.opacity = 0;
      p.ring.material.opacity = 0;
      p.ring.material.color.set(0x6b8aff);
    });

    dirRow.style.display = 'none';
    forceRow.style.display = 'none';
    strikeRow.style.display = 'none';
    dirBtns.forEach(function(b) { b.classList.remove('selected'); });
    forceBtns.forEach(function(b) { b.classList.remove('selected'); });
    hideFeedback();
    hidePrompt();

    gsap.to(hammerGroup.position, {
      x: hammerRestPos.x, y: hammerRestPos.y, z: hammerRestPos.z,
      duration: 0.4, ease: 'power2.out'
    });
    gsap.to(hammerGroup.rotation, {
      x: hammerRestRot.x, y: hammerRestRot.y, z: hammerRestRot.z,
      duration: 0.4, ease: 'power2.out'
    });

    gameState = 'IDLE';
    selectedPlatformIdx = -1;
    selectedDirection = -1;
    autoRotate = true;
    updateStepChain(gameState);
    showPrompt('点击台面选择打击位置');
  }

  function showComplete() {
    hidePrompt();
    hideFeedback();
    dirRow.style.display = 'none';
    forceRow.style.display = 'none';
    strikeRow.style.display = 'none';
    resetRow.style.display = 'flex';

    var yearStr = '约 ' + formatYear(LOMEKWI3_YEARS_AGO) + ' 年前';
    completeMsg.innerHTML = yearStr + '，这就够了。<br>计划不是与打击同时发生的，<br>而是在打击之前就已经存在——<br>这个「事先」是演化上的新开关。';
    completeOverlay.classList.add('show');

    autoRotate = true;
    coreGroup.rotation.y = 0;
  }

  function resetGame() {
    clearOldEffects();
    clearDirectionArrow();
    coreMesh.visible = true;
    coreGroup.position.set(0, 0, 0);
    coreGroup.rotation.set(0, 0, 0);

    platforms.forEach(function(p) {
      p.disc.material.opacity = 0;
      p.ring.material.opacity = 0;
      p.ring.material.color.set(0x6b8aff);
      p.target.material.opacity = 0.12;
    });

    gsap.to(hammerGroup.position, {
      x: hammerRestPos.x, y: hammerRestPos.y, z: hammerRestPos.z,
      duration: 0.4, ease: 'power2.out'
    });
    gsap.to(hammerGroup.rotation, {
      x: hammerRestRot.x, y: hammerRestRot.y, z: hammerRestRot.z,
      duration: 0.4, ease: 'power2.out'
    });

    attempts = MAX_ATTEMPTS;
    progress = 0;
    attemptsCount.textContent = attempts;
    attemptsCount.classList.remove('low');
    barFill.style.width = '0%';
    progressCount.textContent = '0/' + SUCCESS_THRESHOLD;
    gameState = 'IDLE';
    selectedPlatformIdx = -1;
    selectedDirection = -1;
    autoRotate = true;

    dirRow.style.display = 'none';
    forceRow.style.display = 'none';
    strikeRow.style.display = 'none';
    resetRow.style.display = 'none';
    completeOverlay.classList.remove('show');
    dirBtns.forEach(function(b) { b.classList.remove('selected'); });
    forceBtns.forEach(function(b) { b.classList.remove('selected'); });
    hideFeedback();
    hidePrompt();
    updateStepChain(gameState);
    showPrompt('点击台面选择打击位置');
  }

  function formatYear(years) {
    if (years >= 1e6) return (years / 1e6).toFixed(0) + ' 万';
    if (years >= 1e4) return (years / 1e4).toFixed(0) + ' 万';
    return years.toFixed(0);
  }

  /* ========== EVENT BINDING ========== */
  dirBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      selectDirection(parseInt(this.dataset.dir));
    });
    btn.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        selectDirection(parseInt(this.dataset.dir));
      }
    });
  });

  forceBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      selectForce(parseInt(this.dataset.force));
    });
    btn.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        selectForce(parseInt(this.dataset.force));
      }
    });
  });

  strikeBtn.addEventListener('click', performStrike);
  strikeBtn.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      performStrike();
    }
  });

  resetBtn.addEventListener('click', resetGame);
  resetBtn.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      resetGame();
    }
  });
  completeRestartBtn.addEventListener('click', resetGame);
  completeRestartBtn.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      resetGame();
    }
  });

  /* ========== INIT ========== */
  function init() {
    initScene();
    setupOrbitControls();

    yearLabel.textContent = '约 ' + formatYear(LOMEKWI3_YEARS_AGO) + ' 年前';
    yearLabel.classList.add('show');
    // Don't show rotate-hint when prompt is shown (avoid text overlap)
    showPrompt('点击台面选择打击位置');
    updateStepChain('IDLE');

    window.addEventListener('resize', function() { resizeRenderer(); });

    window.addEventListener('keydown', function(e) {
      if (e.key === 'r' || e.key === 'R') resetGame();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
