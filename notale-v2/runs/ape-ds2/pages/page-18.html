<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== page-18: 用火证据时间轴 ===== */

/* 保持在 #stage 边界内 */
#main {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

/* 整体布局上下分栏 —— 内容区 1408×620 */
#ev-wrap {
  display: flex;
  flex-direction: column;
  width: 1408px;
  height: 620px;
  margin: 0 auto;
  box-sizing: border-box;
}

/* 上栏：时间轴 64% ≈ 397px */
#ev-timeline-area {
  flex: 0 0 397px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 0;
  overflow: hidden;
}

/* 下栏：证据卡 36% ≈ 223px */
#ev-card-area {
  flex: 0 0 223px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  position: relative;
}

/* 时间轴轨道 */
.ev-track {
  position: relative;
  width: 1240px;
  height: 220px;
  flex: 0 0 auto;
  margin: 0 auto;
}

/* 虚线轨道（全宽） */
.ev-track-line {
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 0;
  border-top: 2px dashed rgba(255,255,255,0.15);
  transform: translateY(-50%);
  pointer-events: none;
  z-index: 1;
}

/* 高亮进度线（从左到游标） */
.ev-progress-line {
  position: absolute;
  top: 50%;
  left: 0;
  height: 3px;
  background: var(--accent);
  transform: translateY(-50%);
  pointer-events: none;
  z-index: 2;
  border-radius: 0 2px 2px 0;
  box-shadow: 0 0 8px rgba(79, 110, 242, 0.4);
  width: 0;
}

/* 点击感应条 */
.ev-hitzone {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 3;
  cursor: pointer;
}

/* 证据节点 */
.ev-node {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 4;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  border: 2px solid rgba(255,255,255,0.2);
  transition: background 0.4s, border-color 0.4s, box-shadow 0.4s;
  pointer-events: none;
}
.ev-node.active {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 12px rgba(79, 110, 242, 0.5);
}
.ev-node.passed {
  background: rgba(79, 110, 242, 0.3);
  border-color: var(--accent);
}

/* 节点标签（上方） */
.ev-node-label {
  position: absolute;
  top: calc(50% - 34px);
  transform: translateX(-50%);
  z-index: 4;
  font-size: var(--fs-label);
  color: rgba(255,255,255,0.35);
  transition: color 0.4s;
  white-space: nowrap;
  pointer-events: none;
  text-align: center;
}
.ev-node-label.active {
  color: var(--text);
  font-weight: 600;
}
.ev-node-label.passed {
  color: rgba(255,255,255,0.5);
}

/* 节点年份标签（下方） */
.ev-node-year {
  position: absolute;
  top: calc(50% + 24px);
  transform: translateX(-50%);
  z-index: 4;
  font-size: var(--fs-tick);
  color: rgba(255,255,255,0.25);
  transition: color 0.4s;
  white-space: nowrap;
  pointer-events: none;
  text-align: center;
}
.ev-node-year.active {
  color: var(--accent);
  font-weight: 600;
}
.ev-node-year.passed {
  color: rgba(255,255,255,0.4);
}

/* 游标把手 */
#ev-handle {
  position: absolute;
  top: 50%;
  z-index: 5;
  width: 28px;
  height: 28px;
  background: var(--accent);
  border: 3px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 16px rgba(79, 110, 242, 0.6), 0 2px 8px rgba(0,0,0,0.4);
  transform: translate(-50%, -50%);
  cursor: grab;
  transition: box-shadow 0.2s;
}
#ev-handle:active {
  cursor: grabbing;
  box-shadow: 0 0 24px rgba(79, 110, 242, 0.8), 0 2px 12px rgba(0,0,0,0.5);
}
#ev-handle:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}

/* 游标底部小三角指示 */
#ev-handle::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-top: 8px solid var(--accent);
  margin-top: 2px;
}

/* 单位标注 */
.ev-scale-label {
  position: absolute;
  bottom: 8px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: var(--fs-label);
  color: rgba(255,255,255,0.2);
  pointer-events: none;
  z-index: 1;
}

/* ===== 证据卡片 ===== */
.ev-card {
  display: flex;
  align-items: center;
  gap: 24px;
  width: 1240px;
  padding: 20px 28px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  min-height: 0;
  opacity: 1;
  transform: translateY(0);
}

/* 卡片左侧图标 */
.ev-card-icon {
  flex: 0 0 72px;
  width: 72px;
  height: 72px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 700;
  color: #fff;
  background: rgba(79, 110, 242, 0.15);
  border: 1px solid rgba(79, 110, 242, 0.2);
  overflow: hidden;
  position: relative;
}

/* 卡片中间：名称+年代 */
.ev-card-info {
  flex: 0 0 240px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.ev-card-name {
  font-size: var(--fs-h2);
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
}
.ev-card-years {
  font-size: var(--fs-lead);
  color: var(--accent);
  font-weight: 600;
}

/* 卡片右侧：地点+说明 */
.ev-card-desc {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.ev-card-site {
  font-size: var(--fs-sec);
  color: rgba(255,255,255,0.5);
  font-weight: 500;
}
.ev-card-site::before {
  content: "📍 ";
}
.ev-card-note {
  font-size: var(--fs-body);
  color: var(--text);
  line-height: 1.4;
}

/* 键盘提示 */
.ev-kbd-hint {
  position: absolute;
  bottom: 6px;
  right: 16px;
  font-size: var(--fs-label);
  color: rgba(255,255,255,0.15);
  pointer-events: none;
}

/* 空状态 */
.ev-empty-placeholder {
  color: rgba(255,255,255,0.2);
  font-size: var(--fs-sec);
}

/* 入场动画：卡片 decrement */
.card-enter {
  animation: cardFadeIn 0.5s ease-out;
}
@keyframes cardFadeIn {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* 关键句 */
.ev-insight {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  font-size: var(--fs-sec);
  color: rgba(255,255,255,0.3);
  text-align: center;
  white-space: nowrap;
  pointer-events: none;
  z-index: 1;
}
</style>
</head>
<body data-page="18" data-total="50">
<div id="stage">
<main id="main">
<div id="ev-wrap">
  <!-- 上栏：时间轴 -->
  <div id="ev-timeline-area">
    <div class="ev-track" id="ev-track">
      <!-- 虚线 -->
      <div class="ev-track-line"></div>
      <!-- 高亮进度线 -->
      <div class="ev-progress-line" id="ev-progress-line"></div>
      <!-- 点击感应层 -->
      <div class="ev-hitzone" id="ev-hitzone"></div>
      <!-- 节点由 JS 动态生成 -->
      <!-- 游标把手 -->
      <div id="ev-handle" tabindex="0" role="slider" aria-label="用火证据时间轴游标" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      <!-- 刻度单位 -->
      <div class="ev-scale-label">距今（万年）</div>
    </div>
    <div class="ev-insight">拖动时间轴，探索用火证据的逐步累积</div>
  </div>

  <!-- 下栏：证据卡片 -->
  <div id="ev-card-area">
    <div class="ev-card" id="ev-card">
      <div class="ev-card-icon" id="ev-card-icon"></div>
      <div class="ev-card-info">
        <div class="ev-card-name" id="ev-card-name"></div>
        <div class="ev-card-years" id="ev-card-years"></div>
      </div>
      <div class="ev-card-desc">
        <div class="ev-card-site" id="ev-card-site"></div>
        <div class="ev-card-note" id="ev-card-note"></div>
      </div>
    </div>
    <div class="ev-kbd-hint">← → 键盘切换</div>
  </div>
</div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lib/anime.min.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  'use strict';

  // ===== 常量区 =====
  // 证据数据（本页口径）
  var FIRE_EVIDENCE = [
    { label: '烧骨',            yearsAgo: 1200000, site: '南非 Swartkrans 洞穴',  note: '最早的可疑用火痕迹之一；无法排除自然火。',             iconBg: '#8B6914' },
    { label: '灰烬层',          yearsAgo: 1000000, site: '南非 Wonderwerk 洞穴',  note: '洞穴深处的灰烬层与烧骨，难以用野火解释；视为系统性用火证据。', iconBg: '#6B5B4B' },
    { label: '烧石与木屑',      yearsAgo: 790000,  site: '以色列 Gesher Benot Ya\'aqov', note: '营地内被火烧过的石料与木屑，火已出现在生活场所。',   iconBg: '#5A4A3A' },
    { label: '反复使用的灶坑',  yearsAgo: 400000,  site: '以色列 Qesem 洞穴',      note: '多层灰烬与烧石叠压，说明火被固定在同一地点反复生起。',     iconBg: '#8A3A1A' },
    { label: '烤焦的种子',      yearsAgo: 200000,  site: '非洲南部遗址',           note: '炭化植物种子显示火已用于处理植物性食物。',               iconBg: '#4A6A2A' }
  ];

  // 时间轴范围
  var MAX_YA = 1200000; // 最老（左端）
  var MIN_YA = 200000;  // 最新（右端）
  var RANGE = MAX_YA - MIN_YA;

  // DOM 引用
  var track = document.getElementById('ev-track');
  var progressLine = document.getElementById('ev-progress-line');
  var handle = document.getElementById('ev-handle');
  var hitzone = document.getElementById('ev-hitzone');
  var card = document.getElementById('ev-card');
  var cardIcon = document.getElementById('ev-card-icon');
  var cardName = document.getElementById('ev-card-name');
  var cardYears = document.getElementById('ev-card-years');
  var cardSite = document.getElementById('ev-card-site');
  var cardNote = document.getElementById('ev-card-note');

  // 状态
  var currentPos = 0;   // 0~1
  var currentIndex = -1; // 初始为 -1，确保首次更新触发卡片显示
  var isDragging = false;
  var isAnimating = false;
  var nodeEls = [];
  var labelEls = [];
  var yearEls = [];

  // ===== 工具函数 =====
  function getPosFromYA(ya) {
    return (MAX_YA - ya) / RANGE; // 0~1, 左=0, 右=1
  }

  function getYAFromPos(pos) {
    return MAX_YA - pos * RANGE;
  }

  function getClosestIndex(pos) {
    // 找到 pos 左侧最近的那个证据节点
    for (var i = FIRE_EVIDENCE.length - 1; i >= 0; i--) {
      if (getPosFromYA(FIRE_EVIDENCE[i].yearsAgo) <= pos) {
        return i;
      }
    }
    return 0;
  }

  function formatWan(yearsAgo) {
    var wan = Math.round(yearsAgo / 10000);
    return wan + '万年前';
  }

  function formatWanNum(yearsAgo) {
    return Math.round(yearsAgo / 10000) + '万';
  }

  // ===== 构建时间轴节点 =====
  function buildNodes() {
    // 清除旧节点（保留虚线、进度线、hitzone、handle）
    var existing = track.querySelectorAll('.ev-node, .ev-node-label, .ev-node-year');
    existing.forEach(function(el) { el.remove(); });

    nodeEls = [];
    labelEls = [];
    yearEls = [];

    FIRE_EVIDENCE.forEach(function(ev, i) {
      var pos = getPosFromYA(ev.yearsAgo);
      var pct = (pos * 100).toFixed(2) + '%';

      // 节点圆
      var node = document.createElement('div');
      node.className = 'ev-node';
      node.style.left = pct;
      node.dataset.index = i;
      track.insertBefore(node, handle);
      nodeEls.push(node);

      // 标签（上方）
      var label = document.createElement('div');
      label.className = 'ev-node-label';
      label.style.left = pct;
      label.textContent = ev.label;
      track.insertBefore(label, handle);
      labelEls.push(label);

      // 年份（下方）
      var year = document.createElement('div');
      year.className = 'ev-node-year';
      year.style.left = pct;
      year.textContent = formatWanNum(ev.yearsAgo);
      track.insertBefore(year, handle);
      yearEls.push(year);
    });
  }

  // ===== 更新显示 =====
  function updateDisplay(pos) {
    currentPos = Math.max(0, Math.min(1, pos));
    var idx = getClosestIndex(currentPos);

    // 更新 handle 位置
    var handlePct = (currentPos * 100).toFixed(2) + '%';
    handle.style.left = handlePct;
    handle.setAttribute('aria-valuenow', Math.round(currentPos * 100));

    // 更新进度线宽度
    progressLine.style.width = handlePct;

    // 更新节点状态
    var activeYA = FIRE_EVIDENCE[idx].yearsAgo;
    var activePos = getPosFromYA(activeYA);

    for (var i = 0; i < FIRE_EVIDENCE.length; i++) {
      var nodePos = getPosFromYA(FIRE_EVIDENCE[i].yearsAgo);
      var isActive = (i === idx);
      var isPassed = (nodePos <= activePos);

      nodeEls[i].classList.toggle('active', isActive);
      nodeEls[i].classList.toggle('passed', isPassed && !isActive);
      labelEls[i].classList.toggle('active', isActive);
      labelEls[i].classList.toggle('passed', isPassed && !isActive);
      yearEls[i].classList.toggle('active', isActive);
      yearEls[i].classList.toggle('passed', isPassed && !isActive);
    }

    // 更新卡片（只在索引变化时触发动画）
    if (idx !== currentIndex) {
      currentIndex = idx;
      showCard(idx, true);
    }
  }

  function showCard(idx, doAnimate) {
    var ev = FIRE_EVIDENCE[idx];
    cardIcon.textContent = ev.label.charAt(0);
    cardIcon.style.background = ev.iconBg;
    cardName.textContent = ev.label;
    cardYears.textContent = formatWan(ev.yearsAgo);
    cardSite.textContent = ev.site;
    cardNote.textContent = ev.note;

    if (doAnimate) {
      card.classList.remove('card-enter');
      void card.offsetWidth;
      card.classList.add('card-enter');
    }
  }

  // ===== 交互：拖拽 =====
  function getTrackPos(clientX) {
    var rect = track.getBoundingClientRect();
    return (clientX - rect.left) / rect.width;
  }

  function onPointerDown(e) {
    if (isAnimating) return;
    isDragging = true;
    handle.setPointerCapture(e.pointerId);
    var pos = getTrackPos(e.clientX);
    updateDisplay(pos);
  }

  function onPointerMove(e) {
    if (!isDragging) return;
    var pos = getTrackPos(e.clientX);
    updateDisplay(pos);
  }

  function onPointerUp(e) {
    if (!isDragging) return;
    isDragging = false;
    handle.releasePointerCapture(e.pointerId);
  }

  // 点击轨道
  function onTrackClick(e) {
    if (isDragging || isAnimating) return;
    if (e.target === handle) return;
    var pos = getTrackPos(e.clientX);
    updateDisplay(pos);
  }

  // 专门处理 Handle 上的键盘事件
  function onHandleKeyDown(e) {
    if (isAnimating) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      var nextIdx = Math.min(currentIndex + 1, FIRE_EVIDENCE.length - 1);
      var pos = getPosFromYA(FIRE_EVIDENCE[nextIdx].yearsAgo);
      updateDisplay(pos);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      var prevIdx = Math.max(currentIndex - 1, 0);
      var pos = getPosFromYA(FIRE_EVIDENCE[prevIdx].yearsAgo);
      updateDisplay(pos);
    } else if (e.key === 'Home') {
      e.preventDefault();
      updateDisplay(0);
    } else if (e.key === 'End') {
      e.preventDefault();
      updateDisplay(1);
    }
  }

  // ===== 入场自动播放（animejs） =====
  function autoPlay() {
    isAnimating = true;

    // 此时第一个卡片已由 init 显示，记录当前索引
    var lastShownIdx = currentIndex;

    // 用 animejs 做缓动动画
    var data = { t: 0 };
    var anim = anime({
      targets: data,
      t: 1,
      duration: 5000,
      easing: 'easeInOutQuad',
      update: function() {
        // 只更新位置和节点状态，不更新卡片
        currentPos = Math.max(0, Math.min(1, data.t));
        var handlePct = (currentPos * 100).toFixed(2) + '%';
        handle.style.left = handlePct;
        handle.setAttribute('aria-valuenow', Math.round(currentPos * 100));
        progressLine.style.width = handlePct;

        var idx = getClosestIndex(currentPos);
        var activeYA = FIRE_EVIDENCE[idx].yearsAgo;
        var activePos = getPosFromYA(activeYA);

        for (var i = 0; i < FIRE_EVIDENCE.length; i++) {
          var nodePos = getPosFromYA(FIRE_EVIDENCE[i].yearsAgo);
          var isActive = (i === idx);
          var isPassed = (nodePos <= activePos);
          nodeEls[i].classList.toggle('active', isActive);
          nodeEls[i].classList.toggle('passed', isPassed && !isActive);
          labelEls[i].classList.toggle('active', isActive);
          labelEls[i].classList.toggle('passed', isPassed && !isActive);
          yearEls[i].classList.toggle('active', isActive);
          yearEls[i].classList.toggle('passed', isPassed && !isActive);
        }

        // 经过新节点时，带动画切换卡片
        if (idx !== lastShownIdx) {
          lastShownIdx = idx;
          showCard(idx, true);
        }
      },
      complete: function() {
        isAnimating = false;
        currentIndex = lastShownIdx;
        // 停在最后一个节点，不再触发卡片动画（卡片已正确显示）
        var lastIdx = FIRE_EVIDENCE.length - 1;
        var pos = getPosFromYA(FIRE_EVIDENCE[lastIdx].yearsAgo);
        currentPos = pos;
        var handlePct = (pos * 100).toFixed(2) + '%';
        handle.style.left = handlePct;
        handle.setAttribute('aria-valuenow', Math.round(pos * 100));
        progressLine.style.width = handlePct;
        handle.focus();
      }
    });
  }

  // ===== 初始化 =====
  function init() {
    // 挂载页眉页脚
    Lec.mount({
      title: '从灰烬到种子：用火证据的时间轴',
      sub: '跨越约一百万年，从疑似到明确的证据链',
      foot: '18 / 50'
    });

    // 构建节点
    buildNodes();

    // 初始状态：显示第一个证据
    updateDisplay(0);

    // 绑定事件
    handle.addEventListener('pointerdown', onPointerDown);
    handle.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
    hitzone.addEventListener('click', onTrackClick);
    handle.addEventListener('keydown', onHandleKeyDown);

    // 防止拖拽时选中文本
    track.addEventListener('dragstart', function(e) { e.preventDefault(); });

    // 延迟启动自动播放
    setTimeout(autoPlay, 600);
  }

  // 等待 DOM 就绪
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
