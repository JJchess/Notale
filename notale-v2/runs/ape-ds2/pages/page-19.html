<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}

/* ---- page-specific layout ---- */
#main {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  height: 100%;
  width: 100%;
  overflow: hidden;
  box-sizing: border-box;
}

.main-row {
  flex: 1;
  display: flex;
  flex-direction: row;
  gap: var(--space-6);
  min-height: 0;
}

/* left column: stove */
.stove-col {
  flex: 0 0 520px;
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  min-width: 0;
}

.stove-canvas-wrap {
  flex: 1;
  position: relative;
  min-height: 0;
  border-radius: 10px;
  overflow: hidden;
  background: #12141c;
  border: 1px solid var(--border);
}

.stove-canvas-wrap canvas {
  display: block;
}

/* right column: comparison table */
.comp-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  min-width: 0;
}

/* comparison grid customisation */
.k-comparison.fire-comp {
  grid-template-columns: minmax(110px, 0.8fr) 1fr 36px 1fr;
}

.k-comparison.fire-comp .val {
  font-size: var(--fs-lead);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  padding: 4px 0;
  transition: color 0.2s;
}

.k-comparison.fire-comp .val.up {
  color: #34d399;
}

.k-comparison.fire-comp .val.down {
  color: #f87171;
}

.k-comparison.fire-comp .arw-cell {
  text-align: center;
  font-size: 18px;
  color: var(--accent);
  line-height: 1;
  padding: 0;
}

.k-comparison.fire-comp .hdr {
  font-size: var(--fs-label);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  text-align: center;
}

.k-comparison.fire-comp .hdr:first-child {
  text-align: right;
}

.k-comparison.fire-comp .dim {
  font-size: var(--fs-sec);
  text-align: right;
  padding-right: 12px;
}

/* bottom summary */
.summary-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-4);
  padding: var(--space-3) var(--space-5);
  background: var(--accent-soft);
  border-radius: 10px;
  border: 1px solid rgba(79, 110, 242, 0.2);
  min-height: 60px;
}

.summary-row .label {
  font-size: var(--fs-sec);
  color: var(--muted);
  white-space: nowrap;
}

.summary-row .delta-val {
  font-size: var(--fs-lead);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: #34d399;
  min-width: 40px;
  text-align: center;
}

.summary-row .arrow {
  font-size: 24px;
  color: var(--accent);
}

.summary-row .brain-icon {
  width: 40px;
  height: 40px;
  flex: 0 0 auto;
  transition: filter 0.3s, opacity 0.3s;
}

.summary-row .brain-icon svg {
  width: 100%;
  height: 100%;
}

/* model note */
.model-note {
  font-size: var(--fs-sec);
  color: var(--muted);
  opacity: 0.5;
  text-align: right;
  margin-top: -4px;
}

/* slider */
.ctl input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(to right, var(--accent-soft), var(--accent));
  outline: none;
  cursor: pointer;
}

.ctl input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid #fff;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}

.ctl input[type="range"]::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid #fff;
  cursor: pointer;
}

.ctl .doneness-label {
  font-size: var(--fs-label);
  color: var(--muted);
  min-width: 60px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* accessibility */
.ctl input[type="range"]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}

/* k-comparison rowline override for dark bg */
.k-comparison.fire-comp .rowline {
  border-top-color: rgba(208, 213, 221, 0.15);
}

.k-comparison.fire-comp .hdr {
  border-bottom-color: rgba(208, 213, 221, 0.25);
}

.k-comparison.fire-comp .diff {
  background: rgba(254, 243, 199, 0.1);
}
</style>
</head>
<body data-page="19" data-total="50">
<div id="stage">
<main id="main">
  <div class="main-row">
    <!-- left: stove -->
    <div class="stove-col">
      <div class="stove-canvas-wrap">
        <canvas id="stove-cv"></canvas>
      </div>
      <div class="ctl">
        <label for="doneness-slider" class="label">火候</label>
        <input type="range" id="doneness-slider" min="0" max="100" value="0" step="1"
               aria-label="火候调节 0 到 100">
        <span class="doneness-label" id="doneness-display">0</span>
      </div>
    </div>

    <!-- right: comparison -->
    <div class="comp-col">
      <div class="k-comparison fire-comp">
        <div class="hdr" style="grid-column:1;">指标</div>
        <div class="hdr" style="grid-column:2;">生食</div>
        <div class="hdr" style="grid-column:3;color:var(--muted);font-size:var(--fs-label);">→</div>
        <div class="hdr" style="grid-column:4;">熟食</div>

        <div class="rowline"></div>

        <!-- 可吸收能量 -->
        <div class="dim">可吸收能量</div>
        <div class="val" id="v-absorb-raw">65</div>
        <div class="arw-cell">→</div>
        <div class="val up" id="v-absorb-cooked">90</div>

        <div class="rowline"></div>

        <!-- 消化耗能 -->
        <div class="dim">消化耗能</div>
        <div class="val" id="v-digest-raw">15</div>
        <div class="arw-cell">→</div>
        <div class="val down" id="v-digest-cooked">5</div>

        <div class="rowline"></div>

        <!-- 净能量 -->
        <div class="dim">净能量</div>
        <div class="val" id="v-net-raw">50</div>
        <div class="arw-cell">→</div>
        <div class="val up" id="v-net-cooked">85</div>

        <div class="rowline"></div>

        <!-- 消化器官大小 -->
        <div class="dim">消化器官</div>
        <div class="val" id="v-gut-raw">1.0</div>
        <div class="arw-cell">→</div>
        <div class="val down" id="v-gut-cooked">0.6</div>
      </div>

      <!-- bottom summary -->
      <div class="summary-row" id="summary-row">
        <span class="label">净能量差额</span>
        <span class="delta-val" id="delta-val">+0</span>
        <span class="arrow">→</span>
        <div class="brain-icon" id="brain-icon">
          <svg viewBox="0 0 40 40" fill="none">
            <path d="M20 4C13 4 8 9 8 15c0 3 1.2 5.6 3 7.5V33c0 1.5 1.5 3 3 3h12c1.5 0 3-1.5 3-3v-10.5c1.8-1.9 3-4.5 3-7.5 0-6-5-11-12-11z"
                  fill="currentColor" opacity="0.3" id="brain-path"/>
            <path d="M14 17h12M14 21h10M16 13h8"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
          </svg>
        </div>
        <span class="label" style="color:var(--accent);font-weight:600;">大脑</span>
      </div>

      <div class="model-note">* 示意模型，数值为相对单位</div>
    </div>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function(){
  'use strict';

  /* ---- mount header/footer ---- */
  Lec.mount({
    index: 19,
    kicker: 'COOKING LEAP',
    title: '熟食的能量账本',
    take: '火的本质是一个装在身体外面的消化器官——它替身体先做了一部分消化。'
  });

  /* ---- model constants ---- */
  var P19 = {
    RAW_ABSORB: 65,
    RAW_DIGEST: 15,
    RAW_NET: 50,
    COOKED_ABSORB: 90,
    COOKED_DIGEST: 5,
    COOKED_NET: 85,
    GUT_RAW: 1.0,
    GUT_COOKED: 0.6
  };

  function lerp(a, b, t) { return a + (b - a) * t; }
  function round1(v) { return Math.round(v * 10) / 10; }

  /* ---- DOM refs ---- */
  var slider = document.getElementById('doneness-slider');
  var display = document.getElementById('doneness-display');
  var el = {
    absorbRaw: document.getElementById('v-absorb-raw'),
    absorbCooked: document.getElementById('v-absorb-cooked'),
    digestRaw: document.getElementById('v-digest-raw'),
    digestCooked: document.getElementById('v-digest-cooked'),
    netRaw: document.getElementById('v-net-raw'),
    netCooked: document.getElementById('v-net-cooked'),
    gutRaw: document.getElementById('v-gut-raw'),
    gutCooked: document.getElementById('v-gut-cooked'),
    delta: document.getElementById('delta-val'),
    brain: document.getElementById('brain-icon')
  };

  /* ---- canvas stove ---- */
  var cv = document.getElementById('stove-cv');
  var ctx = Deck.fit(cv);
  var cw = cv.width, ch = cv.height;

  function drawStove(t) {
    var doneness = slider.value / 100;
    var time = (t || 0) / 1000;

    cw = cv.width;
    ch = cv.height;

    ctx.clearRect(0, 0, cw, ch);

    // background
    ctx.fillStyle = '#12141c';
    ctx.fillRect(0, 0, cw, ch);

    // stone hearth
    var hx = cw * 0.15;
    var hy = ch * 0.62;
    var hw = cw * 0.7;
    var hh = ch * 0.3;

    // hearth stones
    ctx.fillStyle = '#3a3a44';
    ctx.beginPath();
    ctx.ellipse(cw/2, hy + hh*0.4, hw/2, hh*0.5, 0, Math.PI, 0);
    ctx.fill();

    ctx.fillStyle = '#2e2e38';
    ctx.beginPath();
    ctx.ellipse(cw/2, hy + hh*0.3, hw*0.42, hh*0.35, 0, Math.PI, 0);
    ctx.fill();

    // inner hearth
    ctx.fillStyle = '#1a1a28';
    ctx.beginPath();
    ctx.ellipse(cw/2, hy + hh*0.2, hw*0.35, hh*0.25, 0, Math.PI, 0);
    ctx.fill();

    // fire - animated flames
    var fireBaseY = hy + hh * 0.15;
    var flameCount = 7;
    for (var i = 0; i < flameCount; i++) {
      var fi = i / flameCount;
      var fx = cw/2 + (fi - 0.5) * hw * 0.55;
      var fh = (25 + doneness * 55) * (0.7 + 0.3 * Math.sin(time * 3.5 + i * 1.2));
      var fw = (14 + doneness * 18) * (0.85 + 0.15 * Math.sin(time * 2.8 + i * 0.9));

      var grad = ctx.createRadialGradient(fx, fireBaseY - fh*0.4, 0, fx, fireBaseY - fh*0.3, fh);
      grad.addColorStop(0, 'rgba(255, 220, 80, ' + (0.6 + doneness * 0.4) + ')');
      grad.addColorStop(0.3, 'rgba(255, 140, 30, ' + (0.5 + doneness * 0.4) + ')');
      grad.addColorStop(0.6, 'rgba(200, 70, 10, ' + (0.3 + doneness * 0.3) + ')');
      grad.addColorStop(1, 'rgba(150, 30, 0, 0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(fx, fireBaseY - fh*0.5, fw/2, fh/2, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // glow beneath food
    if (doneness > 0.05) {
      var glow = ctx.createRadialGradient(cw/2, fireBaseY - 40, 0, cw/2, fireBaseY - 40, 40 + doneness * 30);
      glow.addColorStop(0, 'rgba(255, 180, 60, ' + (0.15 * doneness) + ')');
      glow.addColorStop(1, 'rgba(255, 180, 60, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(cw/2 - 60, fireBaseY - 80, 120, 60);
    }

    // food
    var foodY = fireBaseY - 42 - doneness * 5;
    var foodW = 70 + doneness * 6;
    var foodH = 36 + doneness * 4;

    // raw → cooked color
    var r = Math.round(210 - doneness * 90);
    var g = Math.round(120 - doneness * 20 + doneness * 30);
    var b = Math.round(110 - doneness * 85);

    // food body
    ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
    ctx.beginPath();
    ctx.ellipse(cw/2, foodY, foodW/2, foodH/2, 0, 0, Math.PI * 2);
    ctx.fill();

    // food surface highlight
    var hlGrad = ctx.createRadialGradient(cw/2 - foodW*0.15, foodY - foodH*0.25, 0, cw/2, foodY, foodH*0.6);
    hlGrad.addColorStop(0, 'rgba(255,255,255,' + (0.15 + doneness * 0.05) + ')');
    hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hlGrad;
    ctx.beginPath();
    ctx.ellipse(cw/2, foodY, foodW*0.7, foodH*0.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // food outline
    ctx.strokeStyle = 'rgba(0,0,0,' + (0.25 + doneness * 0.2) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(cw/2, foodY, foodW/2, foodH/2, 0, 0, Math.PI * 2);
    ctx.stroke();

    // grill lines beneath food
    ctx.strokeStyle = 'rgba(100, 100, 110, 0.4)';
    ctx.lineWidth = 2;
    for (var gi = 0; gi < 3; gi++) {
      var gx = cw/2 - 25 + gi * 25;
      ctx.beginPath();
      ctx.moveTo(gx, foodY + foodH/2 + 2);
      ctx.lineTo(gx, fireBaseY - 5);
      ctx.stroke();
    }

    // steam
    if (doneness > 0.15) {
      var steamCount = Math.floor(doneness * 10);
      for (var si = 0; si < steamCount; si++) {
        var sx = cw/2 + (si / steamCount - 0.5) * foodW * 0.7 + Math.sin(time * 1.5 + si * 2.1) * 12;
        var sy = foodY - 16 - si * 12 - (time * 25) % 50;
        var sr = 3 + Math.sin(time * 2 + si * 1.3) * 2;

        var alpha = Math.max(0, 0.3 * (1 - (foodY - sy) / 80) * doneness);
        ctx.fillStyle = 'rgba(200, 200, 210, ' + alpha + ')';
        ctx.beginPath();
        ctx.arc(sx, sy, sr, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  /* ---- update values ---- */
  function updateValues() {
    var d = slider.value / 100;

    var absorb = lerp(P19.RAW_ABSORB, P19.COOKED_ABSORB, d);
    var digest = lerp(P19.RAW_DIGEST, P19.COOKED_DIGEST, d);
    var net = absorb - digest;
    var gut = lerp(P19.GUT_RAW, P19.GUT_COOKED, d);
    var delta = net - P19.RAW_NET;

    // raw column stays fixed at endpoint values
    el.absorbRaw.textContent = P19.RAW_ABSORB;
    el.digestRaw.textContent = P19.RAW_DIGEST;
    el.netRaw.textContent = P19.RAW_NET;
    el.gutRaw.textContent = P19.GUT_RAW.toFixed(1);

    // cooked column shows current interpolated values
    el.absorbCooked.textContent = Math.round(absorb);
    el.digestCooked.textContent = Math.round(digest);
    el.netCooked.textContent = Math.round(net);
    el.gutCooked.textContent = gut.toFixed(1);

    // delta display
    el.delta.textContent = (delta >= 0 ? '+' : '') + Math.round(delta);

    // brain glow
    var brainBrightness = 0.3 + d * 0.7;
    var brainPath = document.getElementById('brain-path');
    if (brainPath) {
      brainPath.setAttribute('opacity', brainBrightness);
    }
    el.brain.style.opacity = 0.5 + d * 0.5;
    el.brain.style.color = d > 0.5 ? '#4f6ef2' : '#667085';

    // cooked values highlight
    var cookedVals = [el.absorbCooked, el.digestCooked, el.netCooked, el.gutCooked];
    var directions = ['up', 'down', 'up', 'down'];
    var baseCooked = [P19.COOKED_ABSORB, P19.COOKED_DIGEST, P19.COOKED_NET, P19.GUT_COOKED];
    for (var i = 0; i < cookedVals.length; i++) {
      var current = i === 3 ? gut : (i === 0 ? absorb : (i === 1 ? digest : net));
      var target = baseCooked[i];
      var progress = Math.abs(current - (i === 3 ? P19.GUT_RAW : (i === 0 ? P19.RAW_ABSORB : (i === 1 ? P19.RAW_DIGEST : P19.RAW_NET)))) / Math.abs(target - (i === 3 ? P19.GUT_RAW : (i === 0 ? P19.RAW_ABSORB : (i === 1 ? P19.RAW_DIGEST : P19.RAW_NET))));
      cookedVals[i].style.opacity = 0.5 + progress * 0.5;
    }

    display.textContent = Math.round(d * 100);
  }

  /* ---- slider event ---- */
  slider.addEventListener('input', function() {
    updateValues();
  });

  /* ---- keyboard support (already built into range input) ---- */

  /* ---- canvas animation loop ---- */
  var stopLoop = Deck.loop(function(t) {
    drawStove(t);
  });

  /* ---- resize handler ---- */
  Deck.onResize(function() {
    ctx = Deck.fit(cv);
    cw = cv.width;
    ch = cv.height;
    drawStove(performance.now());
  });

  /* ---- initial draw ---- */
  updateValues();
  drawStove(0);

})();
</script>
</body>
</html>
