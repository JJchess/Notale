<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}

/* ---- constrain #main to fit within padded stage area ---- */
#main {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* ---- content wrapper fills the visible padded area of #stage ---- */
.page-content {
  position: absolute;
  inset: 0;
  overflow: hidden;
  z-index: 1;
}

/* ---- atmosphere canvas ---- */
#atmosphere-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ---- fire glow ---- */
.fire-glow {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  height: 400px;
  background: radial-gradient(
    ellipse 300px 200px at 50% 90%,
    rgba(255, 140, 20, 0.12) 0%,
    rgba(255, 80, 0, 0.06) 35%,
    transparent 70%
  );
  z-index: 1;
  pointer-events: none;
}

/* ---- enumeration row ---- */
.enum-row {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 120px;
  z-index: 10;
  justify-content: center;
  align-items: flex-start;
}

.enum-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 180px;
  opacity: 0;
  animation: enumFadeIn 1.8s ease forwards;
}
.enum-item:nth-child(1) { animation-delay: 0.6s; }
.enum-item:nth-child(2) { animation-delay: 1.0s; }
.enum-item:nth-child(3) { animation-delay: 1.4s; }

@keyframes enumFadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.enum-icon {
  width: 40px;
  height: 40px;
  margin-bottom: 2px;
}

.enum-word {
  font-size: var(--fs-h2);
  font-weight: 700;
  color: #f0e6d0;
  letter-spacing: 0.06em;
  line-height: 1.2;
}

.enum-caption {
  font-size: var(--fs-label);
  color: #94a3b8;
  text-align: center;
  line-height: 1.5;
  max-width: 170px;
}

/* ---- campfire container ---- */
.campfire-wrap {
  position: absolute;
  left: 50%;
  bottom: 160px;
  transform: translateX(-50%);
  z-index: 5;
  pointer-events: none;
}

/* ---- silhouettes ---- */
.silhouettes-wrap {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 3;
  pointer-events: none;
  height: 100px;
  overflow: visible;
}

/* ---- main text ---- */
.main-text {
  position: absolute;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  text-align: center;
  width: 90%;
  max-width: 860px;
  opacity: 0;
  animation: textFadeIn 2s ease 2.2s forwards;
}

@keyframes textFadeIn {
  from { opacity: 0; transform: translateX(-50%) translateY(8px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}

.main-text p {
  font-size: var(--fs-body);
  line-height: 1.6;
  color: #c8cdd3;
  margin: 0 0 6px;
}

/* ---- chapter transition ---- */
.chapter-transition {
  position: absolute;
  top: 6px;
  right: 8px;
  z-index: 10;
  font-size: var(--fs-label);
  color: #667085;
  letter-spacing: 0.04em;
}
</style>
</head>

<script src="assets/lec.js"></script>
<script>
// -- mount header/footer --
Lec.mount({
  index: 21,
  kicker: 'FIRELIGHT',
  title: '篝火之夜',
  take: ''
});

// -- atmosphere background canvas --
(function() {
  var cv = document.getElementById('atmosphere-canvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var W, H;

  function resize() {
    var par = cv.parentElement;
    if (!par) return;
    W = par.clientWidth;
    H = par.clientHeight;
    if (W < 10) { W = 1408; H = 620; }
    cv.width = W;
    cv.height = H;
  }
  resize();

  // create vertical folds
  var folds = [];
  var numFolds = 6;
  for (var i = 0; i < numFolds; i++) {
    folds.push({
      x: (i + 0.5) / numFolds * W,
      width: 40 + Math.random() * 80,
      amp: 8 + Math.random() * 25,
      speed: 0.0002 + Math.random() * 0.0004,
      phase: Math.random() * Math.PI * 2,
      opacity: 0.06 + Math.random() * 0.10
    });
  }

  var time = 0;

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // draw vertical light folds
    for (var i = 0; i < folds.length; i++) {
      var f = folds[i];
      var dx = Math.sin(time * f.speed * 60 + f.phase) * f.amp;
      var cx = f.x + dx;

      var grad = ctx.createRadialGradient(cx, H * 0.75, 0, cx, H * 0.75, f.width * 1.8);
      grad.addColorStop(0, 'rgba(80, 120, 220, ' + (f.opacity * 0.9) + ')');
      grad.addColorStop(0.4, 'rgba(60, 100, 200, ' + (f.opacity * 0.5) + ')');
      grad.addColorStop(0.7, 'rgba(40, 70, 160, ' + (f.opacity * 0.2) + ')');
      grad.addColorStop(1, 'transparent');

      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = grad;
      ctx.fillRect(cx - f.width * 1.8, 0, f.width * 3.6, H);
    }

    ctx.globalCompositeOperation = 'source-over';

    // warm center glow
    var glow = ctx.createRadialGradient(W / 2, H * 0.85, 0, W / 2, H * 0.85, 300);
    glow.addColorStop(0, 'rgba(255, 150, 50, 0.05)');
    glow.addColorStop(0.4, 'rgba(255, 100, 20, 0.025)');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    time++;
  }

  function loop() {
    draw();
    requestAnimationFrame(loop);
  }
  loop();

  window.addEventListener('resize', resize);
})();
</script>
</body>
