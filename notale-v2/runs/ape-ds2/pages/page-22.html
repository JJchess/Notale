<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
  --panel-bg: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.12);
  --accent: #6b8cff;
  --accent-soft: rgba(107,140,255,0.15);
  --muted: #8892a8;
}

/* ── constrain #main to stage content area ── */
#main{
  width:100% !important;
  height:100% !important;
}

/* ── page layout ── */
.page-p22{
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
  height:100%;
  padding:6px 0 4px;
}

/* ── lead ── */
.p22-lead{
  font-size:var(--fs-sec);
  color:var(--text);
  text-align:center;
  line-height:1.5;
  opacity:0.92;
  margin-bottom:10px;
  flex:0 0 auto;
  max-width:92%;
}

/* ── triptych ── */
.p22-triptych{
  display:flex;
  align-items:stretch;
  gap:0;
  width:100%;
  flex:0 0 auto;
  max-width:100%;
}
.trip-step{
  flex:1 1 0;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:8px 10px 10px;
  background:var(--panel-bg);
  border:1px solid var(--border);
  border-radius:8px;
  transition:opacity 0.4s, border-color 0.4s, background 0.4s;
}
.trip-step.active{
  border-color:var(--accent);
  background:var(--accent-soft);
}
.trip-arrow{
  flex:0 0 30px;
  align-self:center;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  color:var(--accent);
  user-select:none;
  line-height:1;
}
.step-header{
  font-size:var(--fs-label);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--accent);
  margin-bottom:6px;
}
.step-img{
  width:90px;
  height:90px;
  border-radius:6px;
  overflow:hidden;
  margin-bottom:6px;
  background:rgba(0,0,0,0.3);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
}
.step-img svg{
  width:100%;
  height:100%;
  display:block;
}
.step-text{
  font-size:var(--fs-sec);
  line-height:1.5;
  text-align:center;
  color:var(--text);
}
.step-site{
  font-size:var(--fs-sec);
  line-height:1.5;
  text-align:center;
  color:var(--text);
  margin-top:4px;
}
.step-years{
  font-size:var(--fs-label);
  color:var(--accent);
  font-weight:600;
  margin-top:4px;
}

/* ── wheel ── */
.wheel-section{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:0;
  margin-top:6px;
  width:100%;
}
.wheel-container{
  position:relative;
  width:200px;
  height:200px;
  flex:0 0 auto;
}
.wheel-pointer{
  position:absolute;
  top:-8px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  width:0; height:0;
  border-left:10px solid transparent;
  border-right:10px solid transparent;
  border-top:14px solid var(--accent);
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));
}
.wheel-pointer::after{
  content:"";
  position:absolute;
  top:-18px;
  left:50%;
  transform:translateX(-50%);
  width:3px;
  height:6px;
  background:var(--accent);
  border-radius:2px;
}
.wheel-surface{
  position:absolute;
  inset:8px;
  border-radius:50%;
  background:
    radial-gradient(ellipse at 35% 30%, rgba(255,255,255,0.12), transparent 60%),
    radial-gradient(ellipse at 50% 50%, #2a3040, #141820);
  box-shadow:
    0 6px 24px rgba(0,0,0,0.5),
    inset 0 2px 0 rgba(255,255,255,0.15),
    inset 0 -2px 0 rgba(0,0,0,0.4),
    0 0 0 1px rgba(255,255,255,0.08);
  cursor:grab;
  user-select:none;
  touch-action:none;
}
.wheel-surface:active{
  cursor:grabbing;
}
.wheel-surface::before{
  content:"";
  position:absolute;
  inset:3px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.06);
  pointer-events:none;
}
.wheel-surface::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    radial-gradient(ellipse at 30% 25%, rgba(255,255,255,0.08) 0%, transparent 50%);
  pointer-events:none;
}
.wheel-rotator{
  position:absolute;
  inset:6px;
  border-radius:50%;
  transition:transform 0.1s ease-out;
}
.wheel-item{
  position:absolute;
  width:44px;
  height:44px;
  top:50%;
  left:50%;
  margin:-22px 0 0 -22px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:opacity 0.3s, filter 0.3s;
  border-radius:50%;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.10);
  backdrop-filter:blur(2px);
  outline:none;
}
.wheel-item:hover{
  background:rgba(255,255,255,0.12);
  border-color:var(--accent);
}
.wheel-item:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
}
.wheel-item.active-symbol{
  background:var(--accent-soft);
  border-color:var(--accent);
  box-shadow:0 0 10px rgba(107,140,255,0.3);
}
.wheel-item.inactive-symbol{
  opacity:0.35;
  filter:saturate(0.3);
}
.wi-icon{
  width:22px;
  height:22px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.wi-icon svg{
  width:100%;
  height:100%;
  display:block;
}
.wi-label{
  font-size:12px;
  color:var(--text);
  line-height:1.1;
  text-align:center;
  white-space:nowrap;
}

/* ── note ── */
.p22-note{
  font-size:var(--fs-sec);
  color:var(--muted);
  text-align:center;
  line-height:1.5;
  padding:4px 0 0;
  flex:0 0 auto;
  max-width:88%;
}
.p22-note em{
  color:var(--accent);
  font-style:normal;
}
.p22-note .nl{
  display:block;
  margin-top:2px;
}
</style>
</head>
<body data-page="22" data-total="50">
<div id="stage">
<main id="main">
<div class="page-p22">

  <!-- lead -->
  <div class="p22-lead">
    在语言之前，人类把意义放进一块赭石、一枚贝壳、一道刻痕——<br>
    意义第一次离开身体，可以抵达不在场的人。
  </div>

  <!-- triptych -->
  <div class="p22-triptych" id="triptych">
    <div class="trip-step active" data-pane="encode">

    <div class="trip-arrow">→</div>
    <div class="trip-step" data-pane="decode">
      <div class="step-header">DECODE</div>
      <div class="step-text" id="stepDecode"></div>

  </div>

  <!-- wheel -->
  <div class="wheel-section">
    <div class="wheel-container" id="wheelContainer">
      <div class="wheel-pointer" aria-hidden="true"></div>
      <div class="wheel-surface" id="wheelSurface" role="slider" aria-label="符号解码盘" tabindex="0"
           aria-valuemin="0" aria-valuemax="2" aria-valuenow="0" aria-valuetext="赭石块">
        <div class="wheel-rotator" id="wheelRotator">
          <div class="wheel-item active-symbol" data-symbol="ochre" tabindex="-1" role="button" aria-label="赭石块">

                <line x1="9" y1="5" x2="9" y2="17" stroke="#7a5530" stroke-width="0.4" opacity="0.4"/>
                <line x1="13" y1="5" x2="13" y2="17" stroke="#7a5530" stroke-width="0.4" opacity="0.4"/>
              </svg>
            </div>
            <div class="wi-label">赭石块</div>
          </div>
          <div class="wheel-item inactive-symbol" data-symbol="beads" tabindex="-1" role="button" aria-label="贝壳珠串">
            <div class="wi-icon">
              <svg viewBox="0 0 22 22" fill="none">
                <circle cx="11" cy="11" r="8" fill="#e8d8c0" stroke="#c4b090" stroke-width="0.8"/>
                <circle cx="11" cy="11" r="3" fill="#0b0e14" stroke="#c4b090" stroke-width="0.5"/>
                <path d="M3 11 Q8 9 10 11" stroke="#c4b090" stroke-width="0.6" fill="none"/>
                <path d="M19 11 Q14 13 12 11" stroke="#c4b090" stroke-width="0.6" fill="none"/>
              </svg>
            </div>
            <div class="wi-label">贝壳珠串</div>
          </div>
          <div class="wheel-item inactive-symbol" data-symbol="bone" tabindex="-1" role="button" aria-label="刻痕骨片">
            <div class="wi-icon">
              <svg viewBox="0 0 22 22" fill="none">
                <ellipse cx="11" cy="11" rx="4" ry="9" fill="#f0e8d8" stroke="#d0c8b0" stroke-width="0.8"/>
                <line x1="11" y1="3" x2="11" y2="19" stroke="#d0c8b0" stroke-width="0.4" opacity="0.4"/>
                <line x1="8" y1="5" x2="8" y2="7" stroke="#bba080" stroke-width="1.2" stroke-linecap="round"/>
                <line x1="14" y1="7" x2="14" y2="9" stroke="#bba080" stroke-width="1.2" stroke-linecap="round"/>
                <line x1="8" y1="10" x2="8" y2="12" stroke="#bba080" stroke-width="1.2" stroke-linecap="round"/>
                <line x1="14" y1="13" x2="14" y2="15" stroke="#bba080" stroke-width="1.2" stroke-linecap="round"/>
                <line x1="8" y1="16" x2="8" y2="18" stroke="#bba080" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="wi-label">刻痕骨片</div>
          </div>
        </div>
      </div>
    </div>
    <div class="p22-note">
      符号与意义之间没有天然联系，只有被同一个<em>约定</em>包裹的人才能解读它。
      <span class="nl">工具改造物质世界，符号改造信息世界——这一步为累积文化打开了门。</span>
    </div>
  </div>

</div>
</main>
</div>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
/* ── page-22: 把意义放进一个符号 ── */

Lec.mount({
  index: 22,
  kicker: "PRE-LANGUAGE SYMBOLS",
  title: "把意义放进一个符号",
  take: "在语言之前，赭石、贝壳珠和刻痕已经证明人类能把「意义」放进一个符号里"
});

/* ── data ── */
var DATA = {
  ochre: {
    label: '赭石块',
    angle: 0,
    svg: '<svg viewBox="0 0 90 90" fill="none"><rect x="6" y="14" width="78" height="62" rx="5" fill="#c4915a" stroke="#a07545" stroke-width="1.5"/><line x1="14" y1="26" x2="76" y2="26" stroke="#7a5530" stroke-width="1.5"/><line x1="14" y1="34" x2="76" y2="34" stroke="#7a5530" stroke-width="1.5"/><line x1="14" y1="42" x2="76" y2="42" stroke="#7a5530" stroke-width="1.5"/><line x1="14" y1="50" x2="76" y2="50" stroke="#7a5530" stroke-width="1.5"/><line x1="14" y1="58" x2="76" y2="58" stroke="#7a5530" stroke-width="1.5"/><line x1="30" y1="18" x2="30" y2="72" stroke="#7a5530" stroke-width="0.8" opacity="0.35"/><line x1="48" y1="18" x2="48" y2="72" stroke="#7a5530" stroke-width="0.8" opacity="0.35"/><line x1="66" y1="18" x2="66" y2="72" stroke="#7a5530" stroke-width="0.8" opacity="0.35"/></svg>',
    encode: '用尖头石器在赭石表面刻出交叉图案，使之成为有意识的符号载体。',
    carry: '出土于南非布隆伯斯洞穴',
    years: '约 10 万年前',
    decode: '被考古学家解释为有组织的符号制作行为——线条被赋予可辨认的意义。'
  },
  beads: {
    label: '贝壳珠串',
    angle: 120,
    svg: '<svg viewBox="0 0 90 90" fill="none"><circle cx="45" cy="45" r="32" fill="#e8d8c0" stroke="#c4b090" stroke-width="1.5"/><circle cx="45" cy="45" r="12" fill="#0b0e14" stroke="#c4b090" stroke-width="1"/><path d="M13 45 Q22 37 30 43" stroke="#c4b090" stroke-width="1.2" fill="none"/><path d="M77 45 Q68 53 60 47" stroke="#c4b090" stroke-width="1.2" fill="none"/><circle cx="18" cy="54" r="5" fill="#e8d8c0" stroke="#c4b090" stroke-width="0.8"/><circle cx="72" cy="36" r="5" fill="#e8d8c0" stroke="#c4b090" stroke-width="0.8"/></svg>',
    encode: '穿孔串连作为身体装饰，是「我属于某个群体」的物化表达。',
    carry: '以斯库尔洞穴为代表，同类型见于多地',
    years: '约 10 万年前',
    decode: '被解释为个人装饰物，承载身份标记与群体归属的意义。'
  },
  bone: {
    label: '刻痕骨片',
    angle: 240,
    svg: '<svg viewBox="0 0 90 90" fill="none"><ellipse cx="45" cy="45" rx="17" ry="37" fill="#f0e8d8" stroke="#d0c8b0" stroke-width="1.5"/><line x1="45" y1="11" x2="45" y2="79" stroke="#d0c8b0" stroke-width="0.6" opacity="0.35"/><line x1="34" y1="18" x2="34" y2="24" stroke="#bba080" stroke-width="2.5" stroke-linecap="round"/><line x1="56" y1="27" x2="56" y2="33" stroke="#bba080" stroke-width="2.5" stroke-linecap="round"/><line x1="34" y1="36" x2="34" y2="42" stroke="#bba080" stroke-width="2.5" stroke-linecap="round"/><line x1="56" y1="45" x2="56" y2="51" stroke="#bba080" stroke-width="2.5" stroke-linecap="round"/><line x1="34" y1="54" x2="34" y2="60" stroke="#bba080" stroke-width="2.5" stroke-linecap="round"/><line x1="56" y1="63" x2="56" y2="69" stroke="#bba080" stroke-width="2.5" stroke-linecap="round"/></svg>',
    encode: '在骨面上连续刻下规律痕迹，记录数量或事件序列。',
    carry: '出土于南非边界洞穴',
    years: '约 8 万年前',
    decode: '被解释为计数或记事的尝试——把数量信息储存在骨头上。'
  }
};

var SYMBOL_KEYS = ['ochre', 'beads', 'bone'];
var currentSymbol = 'ochre';
var isDragging = false;
var dragStartAngle = 0;
var targetRotation = 0;

/* ── DOM refs ── */
var wheelSurface = document.getElementById('wheelSurface');
var wheelRotator = document.getElementById('wheelRotator');
var stepImg = document.getElementById('stepImg');
var stepEncode = document.getElementById('stepEncode');
var stepSite = document.getElementById('stepSite');
var stepYears = document.getElementById('stepYears');
var stepDecode = document.getElementById('stepDecode');
var wheelItems = document.querySelectorAll('.wheel-item');

/* ── position wheel items in a circle ── */
var RADIUS = 64;
var cx = 0, cy = 0;
wheelItems.forEach(function(item, i){
  var angle = i * 120 * Math.PI / 180;
  var tx = RADIUS * Math.sin(angle);
  var ty = -RADIUS * Math.cos(angle);
  item.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
});

/* ── wheel geometry ── */
function getWheelCenter(el){
  var r = el.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}

function angleFromCenter(center, px, py){
  return Math.atan2(py - center.y, px - center.x) * 180 / Math.PI;
}

/* ── update content ── */
function updateContent(key, animate){
  var d = DATA[key];
  if (!d) return;
  var delay = 0;

  if (animate) {
    /* encode (0ms) */
    gsap.to(stepImg, { opacity:0, duration:0.12, delay:delay, onComplete:function(){
      stepImg.innerHTML = d.svg;
      gsap.to(stepImg, { opacity:1, duration:0.2 });
    }});
    gsap.to(stepEncode, { opacity:0, duration:0.12, delay:delay+0.04, onComplete:function(){
      stepEncode.textContent = d.encode;
      gsap.to(stepEncode, { opacity:1, duration:0.2 });
    }});
    /* carry (200ms) */
    delay = 0.2;
    gsap.to(stepSite, { opacity:0, duration:0.12, delay:delay, onComplete:function(){
      stepSite.textContent = d.carry;
      gsap.to(stepSite, { opacity:1, duration:0.2 });
    }});
    gsap.to(stepYears, { opacity:0, duration:0.12, delay:delay+0.04, onComplete:function(){
      stepYears.textContent = d.years;
      gsap.to(stepYears, { opacity:1, duration:0.2 });
    }});
    /* decode (400ms) */
    delay = 0.4;
    gsap.to(stepDecode, { opacity:0, duration:0.12, delay:delay, onComplete:function(){
      stepDecode.textContent = d.decode;
      gsap.to(stepDecode, { opacity:1, duration:0.2 });
    }});
  } else {
    stepImg.innerHTML = d.svg;
    stepEncode.textContent = d.encode;
    stepSite.textContent = d.carry;
    stepYears.textContent = d.years;
    stepDecode.textContent = d.decode;
    gsap.set([stepImg, stepEncode, stepSite, stepYears, stepDecode], { opacity:1 });
  }

  /* wheel items */
  wheelItems.forEach(function(item){
    var sym = item.getAttribute('data-symbol');
    item.classList.toggle('active-symbol', sym === key);
    item.classList.toggle('inactive-symbol', sym !== key);
  });

  wheelSurface.setAttribute('aria-valuenow', SYMBOL_KEYS.indexOf(key));
  wheelSurface.setAttribute('aria-valuetext', d.label);
  currentSymbol = key;
}

/* ── snap to symbol ── */
function snapToSymbol(key, animate){
  var d = DATA[key];
  if (!d) return;
  var target = -d.angle;
  targetRotation = target;

  updateContent(key, animate);

  if (animate) {
    gsap.to(wheelRotator, {
      rotation: target,
      duration: 0.55,
      ease: 'back.out(1.4)',
      overwrite: 'auto'
    });
  } else {
    gsap.set(wheelRotator, { rotation: target });
  }
}

/* ── drag interaction ── */
function onPointerDown(e){
  isDragging = true;
  var rect = wheelSurface.getBoundingClientRect();
  var cx = rect.left + rect.width/2;
  var cy = rect.top + rect.height/2;
  dragStartAngle = angleFromCenter({x:cx, y:cy}, e.clientX, e.clientY) - targetRotation;
  wheelSurface.setPointerCapture(e.pointerId);
  wheelSurface.classList.add('no-pan');
}

function onPointerMove(e){
  if (!isDragging) return;
  var rect = wheelSurface.getBoundingClientRect();
  var cx = rect.left + rect.width/2;
  var cy = rect.top + rect.height/2;
  var currentAngle = angleFromCenter({x:cx, y:cy}, e.clientX, e.clientY);
  var newRot = currentAngle - dragStartAngle;
  gsap.set(wheelRotator, { rotation: newRot });
}

function onPointerUp(e){
  if (!isDragging) return;
  isDragging = false;
  wheelSurface.releasePointerCapture(e.pointerId);
  wheelSurface.classList.remove('no-pan');

  var currentRot = gsap.getProperty(wheelRotator, 'rotation');
  var norm = ((currentRot % 360) + 360) % 360;
  var closest = null;
  var minDist = Infinity;
  SYMBOL_KEYS.forEach(function(key){
    var targetAngle = ((360 - DATA[key].angle) % 360 + 360) % 360;
    var dist = Math.abs(norm - targetAngle);
    if (dist > 180) dist = 360 - dist;
    if (dist < minDist){
      minDist = dist;
      closest = key;
    }
  });
  if (closest){
    snapToSymbol(closest, true);
  }
}

/* ── click on symbol items ── */
wheelItems.forEach(function(item){
  item.addEventListener('click', function(e){
    var key = item.getAttribute('data-symbol');
    if (key && key !== currentSymbol){
      snapToSymbol(key, true);
    }
  });
  item.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      var key = item.getAttribute('data-symbol');
      if (key && key !== currentSymbol){
        snapToSymbol(key, true);
      }
    }
  });
});

/* ── wheel pointer events ── */
wheelSurface.addEventListener('pointerdown', onPointerDown);
document.addEventListener('pointermove', onPointerMove);
document.addEventListener('pointerup', onPointerUp);

/* ── keyboard support ── */
wheelSurface.addEventListener('keydown', function(e){
  var idx = SYMBOL_KEYS.indexOf(currentSymbol);
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown'){
    e.preventDefault();
    snapToSymbol(SYMBOL_KEYS[(idx + 1) % 3], true);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){
    e.preventDefault();
    snapToSymbol(SYMBOL_KEYS[(idx - 1 + 3) % 3], true);
  }
});

/* ── init ── */
snapToSymbol('ochre', false);
</script>
