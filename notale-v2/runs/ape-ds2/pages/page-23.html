<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ---- page-23: 音节拼装机 ---- */
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;

  /* dark-adapted skeuomorphic tokens */
  --sk-bg-top: #2a3142;
  --sk-bg-mid: #1e2435;
  --sk-bg-bottom: #151a28;
  --sk-edge-top: rgba(160, 180, 220, 0.2);
  --sk-edge-bottom: rgba(0, 0, 0, 0.5);
  --sk-shadow: rgba(0, 0, 0, 0.4);
  --sk-shadow-deep: rgba(0, 0, 0, 0.55);
  --sk-highlight: rgba(160, 180, 220, 0.12);
  --sk-text: #d4d8e0;
  --sk-text-dim: #8890a0;
  --sk-accent: #4f6ef2;
  --sk-slot-bg: #0f1320;
  --sk-slot-border: #2a3142;
  --sk-slot-glow: rgba(79, 110, 242, 0.15);
  --sk-arrow: #4f6ef2;
  --sk-row-bg: rgba(15, 19, 32, 0.6);
  --sk-row-alt: rgba(79, 110, 242, 0.06);
  --sk-∞: #f59e0b;
}

/* Override theme.css panel-bg for dark */
.panel, .box { background: var(--panel-bg); }
.k-classification .box { background: rgba(30, 36, 53, 0.85); border-color: rgba(60, 70, 100, 0.4); }
.k-classification .box .bt { color: var(--sk-text-dim); }
.k-classification .lv { border-left-color: var(--sk-accent); }
.k-classification .lv .lv { border-left-color: rgba(79, 110, 242, 0.5); }

/* ---- page-23 specific ---- */
#stage { overflow: hidden; }
#main {
  width: calc(100vw - 2 * var(--side-margin));
  height: calc(100vh - var(--header-h) - var(--footer-h) - var(--footer-gap));
  min-height: 0;
  min-width: 0;
}
.page-classification { width: 100%; height: 100%; min-height: 0; }
.k-classification > .lv { min-height: 0; }

/* ---- skeuomorphic assembler machine ---- */
.assembler-machine {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 20px 24px 16px;
  border: 1px solid transparent;
  border-radius: 14px;
  background:
    linear-gradient(180deg, var(--sk-bg-top), var(--sk-bg-mid) 48%, var(--sk-bg-bottom)) padding-box,
    linear-gradient(180deg, var(--sk-edge-top), rgba(255,255,255,0.08) 45%, var(--sk-edge-bottom)) border-box;
  box-shadow:
    0 8px 24px var(--sk-shadow),
    0 3px 8px rgba(0,0,0,0.2),
    inset 0 1px 0 var(--sk-highlight),
    inset 0 -1px 0 rgba(0,0,0,0.3);
  min-height: 0;
}

.assembler-machine::after {
  content: "";
  position: absolute;
  inset: 1px 1px auto;
  height: 32%;
  border-radius: 13px 13px 0 0;
  background: linear-gradient(180deg, rgba(160,180,220,0.08), transparent);
  pointer-events: none;
}

/* ---- sentence display ---- */
.sentence-display {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
}

.sentence-label {
  font-size: var(--fs-label, 15px);
  color: var(--sk-text-dim);
  flex-shrink: 0;
}

.current-sentence {
  font-size: var(--fs-lead, 19px);
  font-weight: 600;
  color: var(--sk-accent);
  font-family: var(--font-mono, monospace);
  letter-spacing: 0.06em;
  min-height: 1.4em;
  min-width: 60px;
}

/* ---- sentence track (slots) ---- */
.sentence-track {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 12px 14px;
  background: var(--sk-slot-bg);
  border: 1px solid var(--sk-slot-border);
  border-radius: 10px;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
  min-height: 48px;
  align-items: center;
}

.slot {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border: 1px dashed rgba(100, 120, 180, 0.25);
  border-radius: 8px;
  font-size: 18px;
  font-weight: 600;
  color: var(--sk-text);
  font-family: var(--font-mono, monospace);
  background: rgba(0,0,0,0.2);
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
}

.slot.filled {
  border-style: solid;
  border-color: var(--sk-accent);
  background: rgba(79, 110, 242, 0.08);
  box-shadow: 0 0 8px var(--sk-slot-glow);
}

.slot.empty {
  border-color: rgba(100, 120, 180, 0.15);
}

/* ---- syllable block (clickable) ---- */
.syllable-block {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 48px;
  font-size: 18px;
  font-weight: 700;
  font-family: var(--font-mono, monospace);
  color: var(--sk-text);
  cursor: pointer;
  user-select: none;
  border: 1px solid transparent;
  border-radius: 10px;
  background:
    linear-gradient(180deg, var(--sk-bg-top), var(--sk-bg-mid) 50%, var(--sk-bg-bottom)) padding-box,
    linear-gradient(180deg, var(--sk-edge-top), rgba(255,255,255,0.06) 45%, var(--sk-edge-bottom)) border-box;
  box-shadow:
    0 4px 10px var(--sk-shadow),
    inset 0 1px 0 var(--sk-highlight),
    inset 0 -1px 0 rgba(0,0,0,0.25);
  transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  position: relative;
  outline: none;
}

.syllable-block:hover {
  transform: translateY(-2px);
  box-shadow:
    0 6px 16px var(--sk-shadow),
    inset 0 1px 0 var(--sk-highlight),
    inset 0 -1px 0 rgba(0,0,0,0.25);
  background:
    linear-gradient(180deg, #33405a, #252d42 50%, #1a2235) padding-box,
    linear-gradient(180deg, rgba(160,180,220,0.3), rgba(255,255,255,0.08) 45%, var(--sk-edge-bottom)) border-box;
}

.syllable-block:active,
.syllable-block.is-pressed {
  transform: translateY(1px);
  box-shadow:
    inset 0 4px 10px rgba(0,0,0,0.3),
    inset 0 -1px 0 rgba(160,180,220,0.1),
    0 2px 6px rgba(0,0,0,0.15);
  background:
    linear-gradient(180deg, #1a2235, #252d42 52%, #2a3142) padding-box,
    linear-gradient(180deg, rgba(0,0,0,0.3), rgba(255,255,255,0.06)) border-box;
}

.syllable-block:focus-visible {
  outline: 2px solid var(--sk-accent);
  outline-offset: 2px;
}

.syllable-block::after {
  content: "";
  position: absolute;
  inset: 1px 1px auto;
  height: 30%;
  border-radius: 9px 9px 0 0;
  background: linear-gradient(180deg, rgba(160,180,220,0.1), transparent);
  pointer-events: none;
}

/* ---- syllable pool ---- */
.syllable-pool {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 6px 0;
}

.pool-label {
  font-size: var(--fs-label, 15px);
  color: var(--sk-text-dim);
  margin-right: 8px;
  display: flex;
  align-items: center;
}

/* ---- counter panel ---- */
.counter-panel {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 8px 14px;
  background: rgba(0,0,0,0.2);
  border-radius: 8px;
  border: 1px solid rgba(60, 70, 100, 0.2);
}

.counter-item {
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.counter-label {
  font-size: var(--fs-label, 15px);
  color: var(--sk-text-dim);
}

.counter-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--sk-accent);
  font-family: var(--font-mono, monospace);
  font-variant-numeric: tabular-nums;
}

.counter-unit {
  font-size: var(--fs-sec, 16px);
  color: var(--sk-text-dim);
}

/* ---- reset button ---- */
.reset-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  font-size: var(--fs-label, 15px);
  font-weight: 600;
  color: var(--sk-text);
  cursor: pointer;
  border: 1px solid transparent;
  border-radius: 8px;
  background:
    linear-gradient(180deg, #3a4055, #2a3042 50%, #1f2537) padding-box,
    linear-gradient(180deg, rgba(160,180,220,0.15), rgba(0,0,0,0.3)) border-box;
  box-shadow:
    0 3px 8px var(--sk-shadow),
    inset 0 1px 0 rgba(160,180,220,0.15),
    inset 0 -1px 0 rgba(0,0,0,0.2);
  transition: transform 0.12s, box-shadow 0.12s;
  user-select: none;
  outline: none;
  font-family: var(--font-sans);
}

.reset-btn:hover {
  transform: translateY(-1px);
  box-shadow:
    0 5px 14px var(--sk-shadow),
    inset 0 1px 0 rgba(160,180,220,0.2);
}

.reset-btn:active {
  transform: translateY(1px);
  box-shadow:
    inset 0 3px 8px rgba(0,0,0,0.3),
    0 2px 4px rgba(0,0,0,0.15);
}

.reset-btn:focus-visible {
  outline: 2px solid var(--sk-accent);
  outline-offset: 2px;
}

/* ---- length table ---- */
.length-table-wrap {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
  position: relative;
}

.length-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-sec, 16px);
}

.length-table th {
  text-align: left;
  padding: 6px 10px;
  font-size: var(--fs-label, 15px);
  color: var(--sk-text-dim);
  font-weight: 600;
  border-bottom: 1px solid rgba(60, 70, 100, 0.3);
  position: sticky;
  top: 0;
  background: rgba(15, 19, 32, 0.95);
  z-index: 1;
}

.length-table td {
  padding: 6px 10px;
  border-bottom: 1px solid rgba(60, 70, 100, 0.1);
  font-family: var(--font-mono, monospace);
  font-variant-numeric: tabular-nums;
  color: var(--sk-text);
}

.length-table .row-l {
  color: var(--sk-text-dim);
  font-weight: 500;
}

.length-table .row-count {
  text-align: right;
  font-weight: 600;
  color: var(--sk-accent);
}

.length-table .row-∞ td {
  color: var(--sk-∞);
  font-weight: 700;
  border-top: 2px solid rgba(245, 158, 11, 0.3);
  border-bottom: none;
}

.length-table .row-∞ .row-count {
  font-size: 18px;
  color: var(--sk-∞);
}

.length-table .row-new {
  animation: rowFadeIn 0.35s ease-out;
}

@keyframes rowFadeIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---- arrow connecting layers ---- */
.flow-arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--sk-arrow);
  font-size: 16px;
  padding: 2px 0;
  opacity: 0.6;
  gap: 6px;
}

.flow-arrow .arrow-line {
  flex: 1;
  height: 2px;
  background: linear-gradient(90deg, var(--sk-arrow), transparent);
  max-width: 60px;
}

.flow-arrow .arrow-head {
  font-size: 14px;
}

/* ---- big arrow from finite to infinite ---- */
.main-arrow {
  position: absolute;
  left: -20px;
  top: 0;
  bottom: 0;
  width: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--sk-arrow);
  opacity: 0.5;
  font-size: 12px;
  gap: 0;
}

.main-arrow .arrow-shaft {
  flex: 1;
  width: 2px;
  background: linear-gradient(180deg, var(--sk-arrow), transparent 60%);
  min-height: 20px;
}

/* ---- table row animation ---- */
@keyframes countRoll {
  from { opacity: 0.3; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.count-roll {
  animation: countRoll 0.3s ease-out;
}

/* ---- info text ---- */
.info-text {
  font-size: var(--fs-sec, 16px);
  color: var(--sk-text-dim);
  line-height: 1.4;
  padding: 6px 0;
}

/* ---- scrollbar ---- */
.length-table-wrap::-webkit-scrollbar {
  width: 4px;
}
.length-table-wrap::-webkit-scrollbar-track {
  background: transparent;
}
.length-table-wrap::-webkit-scrollbar-thumb {
  background: rgba(60, 70, 100, 0.3);
  border-radius: 2px;
}

/* ---- tooltip for reset ---- */
.reset-hint {
  font-size: var(--fs-label, 15px);
  color: var(--sk-text-dim);
  opacity: 0.7;
}
</style>
</head>
<body data-page="23" data-total="50">
<div id="stage">
<main id="main">

<div class="k-classification page-classification" style="height: 100%;">

  <!-- Level 1: 句子表 (outermost layer — infinite sentences) -->
  <div class="lv" style="height: 100%; border-left: none; margin-left: 0; padding-left: 0;">
    <div class="box" style="height: 100%; border: none; background: transparent; padding: 0;">

      <div class="row" style="height: 100%; gap: 20px;">

        <!-- ======== LEFT SIDE: 拼装机 + 音节库 ======== -->
        <div class="col grow" style="gap: 6px; min-width: 0; height: 100%; position: relative;">

          <!-- Big arrow on the left connecting finite → infinite -->
          <div class="main-arrow" aria-hidden="true">
            <div class="arrow-shaft"></div>
            <span style="font-size:14px; color: var(--sk-arrow); opacity:0.5; writing-mode:vertical-lr; letter-spacing:4px; padding:4px 0;">有限 → 无限</span>
          </div>

          <!-- Level 2: 拼装机 (middle layer — combination mechanism) -->
          <div class="lv" style="flex: 1; min-height: 0;">
            <div class="box" style="height: 100%; display: flex; flex-direction: column; min-height: 0;">
              <div class="bt">拼装机</div>

              <div class="assembler-machine">
                <!-- Sentence display -->
                <div class="sentence-display">
                  <span class="sentence-label">当前句子</span>
                  <span class="current-sentence" id="sentence-display">—</span>
                </div>

                <!-- Sentence track (slots) -->
                <div class="sentence-track" id="sentence-track">
                  <!-- slots inserted by JS -->
                </div>

                <!-- Counter panel -->
                <div class="counter-panel">
                  <div class="counter-item">
                    <span class="counter-label">L =</span>
                    <span class="counter-value" id="current-l">3</span>
                  </div>
                  <div class="counter-item" style="flex:1;">
                    <span class="counter-label">可能句子数</span>
                    <span class="counter-value" id="possible-count">512</span>
                  </div>
                </div>
                <div class="info-text" style="font-size: var(--fs-label, 15px); padding: 2px 0;">
                  L 每增加 1，句子数 × 8 — 增长是指数的
                </div>

                <!-- Control row -->
                <div class="ctl" style="padding: 0; gap: 12px;">
                  <button class="reset-btn" id="reset-btn" tabindex="0">↺ 重置</button>
                  <span class="reset-hint">点击音节块填入句子槽</span>
                </div>
              </div>

              <!-- Level 3: 音节库 (innermost layer — finite syllable set) -->
              <div class="lv" style="margin-top: 6px;">
                <div class="box">
                  <div class="bt">音节库 · <span id="syllable-count">8</span> 个音节</div>
                  <div class="syllable-pool" id="syllable-pool">
                    <!-- syllable blocks inserted by JS -->
                  </div>
                  <div class="info-text" style="margin-top: 6px;">
                    音节有限，但每个位置都可以从 8 个中任选一个。
                    每增加一个音节位置，可能性就乘以 8。
                  </div>
                </div>
              </div>

            </div>
          </div>

        </div>

        <!-- ======== RIGHT SIDE: 句子表 (length table) ======== -->
        <div class="lv no-shrink" style="width: 360px; height: 100%;">
          <div class="box" style="height: 100%; display: flex; flex-direction: column; min-height: 0;">
            <div class="bt">句子表</div>
            <div class="length-table-wrap" id="table-wrap">
              <table class="length-table" id="length-table">
                <thead>
                  <tr>
                    <th>长度 L</th>
                    <th style="text-align:right;">可能句子数</th>
                  </tr>
                </thead>
                <tbody id="table-body">
                  <!-- rows inserted by JS -->
                </tbody>
              </table>
            </div>
            <div class="info-text" style="margin-top: 4px; font-size: var(--fs-label, 15px);">
              长度没有上限 → 语言永远无法被列成一张清单
            </div>
          </div>
        </div>

      </div><!-- /row -->

    </div>
  </div>

</div><!-- /k-classification -->

</main>
</div>

<script src="assets/base.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/lec.js"></script>
<script>
(function () {
  'use strict';

  /* ---- Constants ---- */
  // 本页演示用：8 个示例音节
  var SYLLABLE_LIST = ['pa', 'ta', 'ki', 'lo', 'mu', 'sa', 'ri', 'ne'];
  var SYLLABLE_COUNT = SYLLABLE_LIST.length;
  var INITIAL_L = 3;
  var MAX_VISIBLE_L = 10; // cap visible rows to avoid overflow

  /* ---- State ---- */
  var currentSentence = [];    // array of syllable indices
  var currentL = INITIAL_L;
  var slots = [];             // array of syllable indices (or null for empty)
  var nextSlotIndex = 0;       // which slot to fill next

  /* ---- DOM refs ---- */
  var trackEl = document.getElementById('sentence-track');
  var sentenceDisplay = document.getElementById('sentence-display');
  var currentLEl = document.getElementById('current-l');
  var countEl = document.getElementById('possible-count');
  var tableBody = document.getElementById('table-body');
  var syllablePool = document.getElementById('syllable-pool');
  var resetBtn = document.getElementById('reset-btn');
  var syllableCountEl = document.getElementById('syllable-count');

  /* ---- Helper: format large numbers ---- */
  function fmtNum(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(1) + '亿';
    if (n >= 1e8) return (n / 1e8).toFixed(1) + '亿';
    if (n >= 1e4) return n.toLocaleString('zh-CN');
    return String(n);
  }

  /* ---- Calculate possible sentences ---- */
  function possibleSentences(L) {
    return Math.pow(SYLLABLE_COUNT, L);
  }

  /* ---- Render slots ---- */
  function renderSlots() {
    var html = '';
    for (var i = 0; i < currentL; i++) {
      var val = slots[i] !== undefined && slots[i] !== null ? SYLLABLE_LIST[slots[i]] : '';
      var cls = val ? 'slot filled' : 'slot empty';
      html += '<div class="' + cls + '" data-slot="' + i + '">' + (val || '') + '</div>';
    }
    trackEl.innerHTML = html;
  }

  /* ---- Update sentence display ---- */
  function updateSentenceDisplay() {
    var filled = [];
    for (var i = 0; i < currentL; i++) {
      if (slots[i] !== undefined && slots[i] !== null) {
        filled.push(SYLLABLE_LIST[slots[i]]);
      } else {
        break;
      }
    }
    if (filled.length === 0) {
      sentenceDisplay.textContent = '—';
    } else {
      sentenceDisplay.textContent = filled.join(' ');
    }
  }

  /* ---- Update counter ---- */
  function updateCounter(animate) {
    var newL = currentL;
    var newCount = possibleSentences(newL);

    currentLEl.textContent = newL;

    if (animate) {
      // Animate counter with GSAP
      var obj = { val: parseInt(countEl.textContent.replace(/,/g, '')) || 0 };
      if (!isFinite(obj.val)) obj.val = 0;
      gsap.to(obj, {
        val: newCount,
        duration: 0.5,
        ease: 'power2.out',
        onUpdate: function () {
          var v = Math.round(obj.val);
          countEl.textContent = fmtNum(v);
        },
        onComplete: function () {
          countEl.textContent = fmtNum(newCount);
        }
      });
    } else {
      countEl.textContent = fmtNum(newCount);
    }
  }

  /* ---- Render table ---- */
  function renderTable(animateLast) {
    var html = '';
    var maxL = Math.min(currentL, MAX_VISIBLE_L);
    for (var L = 1; L <= maxL; L++) {
      var count = possibleSentences(L);
      var isNew = animateLast && L === currentL;
      html += '<tr class="' + (isNew ? 'row-new' : '') + '">' +
        '<td class="row-l">' + L + '</td>' +
        '<td class="row-count">' + fmtNum(count) + '</td>' +
        '</tr>';
    }
    // ∞ row (always present)
    html += '<tr class="row-∞">' +
      '<td class="row-l">∞</td>' +
      '<td class="row-count">→ ∞</td>' +
      '</tr>';
    tableBody.innerHTML = html;
  }

  /* ---- Reset state ---- */
  function resetAll() {
    currentL = INITIAL_L;
    slots = [];
    for (var i = 0; i < currentL; i++) slots[i] = null;
    nextSlotIndex = 0;
    currentSentence = [];

    renderSlots();
    updateSentenceDisplay();
    updateCounter(false);
    renderTable(false);

    // Scroll table to top
    var wrap = document.getElementById('table-wrap');
    if (wrap) wrap.scrollTop = 0;
  }

  /* ---- Fill next slot ---- */
  function fillSlot(sylIndex) {
    // Find next empty slot
    var idx = -1;
    for (var i = 0; i < currentL; i++) {
      if (slots[i] === null || slots[i] === undefined) {
        idx = i;
        break;
      }
    }

    if (idx === -1) {
      // All slots filled → add a new slot (increase L)
      currentL++;
      slots.push(sylIndex);
      nextSlotIndex = currentL; // all filled
      currentSentence.push(sylIndex);

      // Update UI
      renderSlots();
      updateSentenceDisplay();
      updateCounter(true);
      renderTable(true);

      // Animate the last slot appearing
      var allSlots = trackEl.querySelectorAll('.slot');
      var lastSlot = allSlots[allSlots.length - 1];
      if (lastSlot) {
        gsap.from(lastSlot, {
          scale: 0.5,
          opacity: 0,
          duration: 0.3,
          ease: 'back.out(1.5)'
        });
      }
    } else {
      // Fill the empty slot
      slots[idx] = sylIndex;
      currentSentence.push(sylIndex);

      renderSlots();
      updateSentenceDisplay();

      // No need to update counter or table since L hasn't changed
      // Animate the newly filled slot
      var slotEls = trackEl.querySelectorAll('.slot');
      if (slotEls[idx]) {
        gsap.from(slotEls[idx], {
          scale: 0.3,
          opacity: 0,
          duration: 0.3,
          ease: 'back.out(2)'
        });
      }
    }
  }

  /* ---- Handle syllable click ---- */
  function onSyllableClick(e) {
    var block = e.currentTarget;
    var idx = parseInt(block.getAttribute('data-index'), 10);
    if (!isFinite(idx)) return;

    // Press animation
    block.classList.add('is-pressed');
    setTimeout(function () { block.classList.remove('is-pressed'); }, 150);

    // Fill slot
    fillSlot(idx);
  }

  /* ---- Initialize ---- */
  function init() {
    syllableCountEl.textContent = SYLLABLE_COUNT;

    // Build syllable pool
    var poolHtml = '';
    for (var i = 0; i < SYLLABLE_COUNT; i++) {
      poolHtml += '<div class="syllable-block" data-index="' + i +
        '" tabindex="0" role="button" aria-label="音节 ' + SYLLABLE_LIST[i] + '">' +
        SYLLABLE_LIST[i] + '</div>';
    }
    syllablePool.innerHTML = poolHtml;

    // Attach click/keyboard handlers to syllable blocks
    var blocks = syllablePool.querySelectorAll('.syllable-block');
    for (var i = 0; i < blocks.length; i++) {
      blocks[i].addEventListener('click', onSyllableClick);
      blocks[i].addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          onSyllableClick(e);
        }
      });
    }

    // Reset button
    resetBtn.addEventListener('click', resetAll);
    resetBtn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        resetAll();
      }
    });

    // Initial state
    resetAll();
  }

  /* ---- Mount ---- */
  Lec.mount({
    index: 23,
    title: '音节拼装机',
    sub: '语言靠组合工作：有限音节，无限句子'
  });

  // Wait for DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
