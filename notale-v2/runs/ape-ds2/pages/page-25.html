<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}
/* ====== layout ====== */
.page-content {
  display: flex;
  flex-direction: row;
  gap: var(--space-5);
  height: 100%;
  align-items: stretch;
}
.chain-panel {
  flex: 0 0 58%;
  min-width: 0;
  display: flex;
  flex-direction: column;
  height: 100%;
}
.diff-panel {
  flex: 0 0 42%;
  min-width: 0;
  display: flex;
  flex-direction: column;
  height: 100%;
}
/* ====== chain ====== */
.chain-scroll {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0;
  padding: var(--space-1) 0;
  scrollbar-width: thin;
}
.chain-node {
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: var(--fs-body);
  line-height: 1.5;
  position: relative;
  max-width: 100%;
}
.chain-node .step-tag {
  display: inline-block;
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--muted);
  background: var(--accent-soft);
  border-radius: 4px;
  padding: 1px 8px;
  margin-right: 6px;
  vertical-align: middle;
  line-height: 1.6;
}
.chain-node .node-text {
  vertical-align: middle;
}
.chain-node .mutation-hl {
  background: #fbbf24;
  color: #1a1a1a;
  border-radius: 3px;
  padding: 0 3px;
  font-weight: 600;
}
.chain-node .delta-note {
  font-size: var(--fs-sec);
  color: var(--muted);
  margin-top: 4px;
  padding-left: 4px;
  border-left: 2px solid #fbbf24;
}
.chain-node .delta-note .delta-sym {
  color: #f59e0b;
  font-weight: 700;
  margin-right: 4px;
}
.chain-arrow {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 28px;
  color: var(--accent);
  font-size: 18px;
  opacity: 0.7;
  flex-shrink: 0;
}
.chain-arrow::before {
  content: "↓";
}
/* ====== diff panel ====== */
.diff-panel-inner {
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  flex: 1;
}
.diff-header {
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.diff-section {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.diff-section .diff-label {
  font-size: var(--fs-sec);
  color: var(--muted);
  font-weight: 600;
}
.diff-section .diff-line {
  font-size: var(--fs-body);
  line-height: 1.6;
  padding: 6px 10px;
  background: rgba(0,0,0,0.04);
  border-radius: 6px;
  word-break: break-all;
}
.diff-section .diff-line .w-same {
  color: var(--text);
}
.diff-section .diff-line .w-diff {
  background: #fef3c7;
  color: #92400e;
  border-radius: 3px;
  padding: 0 2px;
}
.diff-section .diff-line .w-miss {
  color: #d94a4a;
  text-decoration: line-through;
  opacity: 0.6;
}
.diff-stats {
  font-size: var(--fs-sec);
  color: var(--muted);
  text-align: center;
  padding: 6px;
  border-top: 1px solid var(--border);
  margin-top: auto;
}
.diff-stats strong {
  color: #f59e0b;
}
/* ====== takeaways ====== */
.takeaways {
  margin-top: var(--space-3);
  padding: 10px 14px;
  background: var(--accent-soft);
  border-left: 3px solid var(--accent);
  border-radius: 0 6px 6px 0;
  font-size: var(--fs-sec);
  line-height: 1.5;
  color: var(--text);
}
.takeaways p {
  margin: 4px 0;
}
.takeaways .highlight {
  color: #f59e0b;
  font-weight: 600;
}
/* ====== controls ====== */
.ctl-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: var(--space-2) 0;
  gap: var(--space-3);
}
.btn-primary {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 9px 28px;
  font-size: var(--fs-body);
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
  font-family: var(--font-sans);
  letter-spacing: 0.02em;
}
.btn-primary:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.btn-primary:hover:not(:disabled) {
  opacity: 0.88;
}
.btn-primary:active:not(:disabled) {
  transform: scale(0.97);
}
.btn-secondary {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 8px 24px;
  font-size: var(--fs-body);
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
  font-family: var(--font-sans);
}
.btn-secondary:hover {
  background: var(--accent-soft);
}
.step-indicator {
  font-size: var(--fs-sec);
  color: var(--muted);
}
/* ====== revisited node clickable ====== */
.chain-node.clickable {
  cursor: pointer;
}
.chain-node.clickable:hover {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}
.chain-node.active-review {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}
</style>
</head>
<body data-page="25" data-total="50">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 25,
  kicker: 'CULTURAL COPY',
  title: '每一次传错，都可能是创新',
  take: '累积文化，正是从这条误差链上启动的。'
});

// ====== DATA ======
var steps = [
  { text: "看到云往山里跑，天就要下雨了，把兽皮收进洞里。", delta: "" },
  { text: "云往山里跑，天就要下雨了，把兽皮收进洞里。", delta: "删「看到」" },
  { text: "云往山里跑，天要下雨，把兽皮收进洞。", delta: "「就要」→「要」；删「里」" },
  { text: "云往山里跑，雨要来，把兽皮收进洞。", delta: "「天要下雨」→「雨要来」" },
  { text: "云往山里跑，雨要来，快收兽皮。", delta: "「把兽皮收进洞」→「快收兽皮」" },
  { text: "云进山，雨要来，快收兽皮。", delta: "「往山里跑」→「进山」" },
];

// For each step (1-5), define which chars in the text are mutations (relative to previous)
// {s: start index, e: end index, txt: highlighted text}
var mutations = [
  [],
  [],                                // s1: deletion noted in delta
  [{s: 7, e: 8, txt: "要"}],         // s2: "要" replaces "就要"
  [{s: 6, e: 9, txt: "雨要来"}],     // s3: "雨要来" replaces "天要下雨"
  [{s: 10, e: 14, txt: "快收兽皮"}], // s4: "快收兽皮" replaces "把兽皮收进洞"
  [{s: 1, e: 3, txt: "进山"}],       // s5: "进山" replaces "往山里跑"
];

// ====== STATE ======
var currentStep = 0;
var isAnimating = false;
var isComplete = false;

// ====== RENDER FUNCTIONS ======

function buildNodeHTML(stepIdx) {
  var s = steps[stepIdx];
  var m = mutations[stepIdx] || [];
  var text = s.text;
  var html = '';

  if (m.length === 0) {
    html = text;
  } else {
    var parts = [];
    var last = 0;
    var sorted = m.slice().sort(function(a, b) { return a.s - b.s; });
    for (var i = 0; i < sorted.length; i++) {
      var mu = sorted[i];
      if (mu.s > last) {
        parts.push(text.slice(last, mu.s));
      }
      parts.push('<span class="mutation-hl">' + mu.txt + '</span>');
      last = mu.e;
    }
    if (last < text.length) {
      parts.push(text.slice(last));
    }
    html = parts.join('');
  }

  var deltaHTML = '';
  if (s.delta) {
    deltaHTML = '<div class="delta-note"><span class="delta-sym">Δ</span>' + s.delta + '</div>';
  }

  return '<span class="step-tag">s' + stepIdx + '</span><span class="node-text">' + html + '</span>' + deltaHTML;
}

// Compute diff segments between two sentences
function computeDiff(orig, curr) {
  var o = orig.split('');
  var c = curr.split('');
  var oi = 0, ci = 0;
  var oSegs = [], cSegs = [];

  while (oi < o.length || ci < c.length) {
    if (oi < o.length && ci < c.length && o[oi] === c[ci]) {
      var same = '';
      while (oi < o.length && ci < c.length && o[oi] === c[ci]) {
        same += o[oi];
        oi++;
        ci++;
      }
      oSegs.push({type: 'same', text: same});
      cSegs.push({type: 'same', text: same});
    } else {
      var found = false;
      // Look ahead in original (original has extra chars)
      for (var look = 1; look <= 8 && !found; look++) {
        if (oi + look < o.length && ci < c.length && o[oi + look] === c[ci]) {
          var extra = '';
          for (var k = 0; k < look; k++) extra += o[oi + k];
          oSegs.push({type: 'miss', text: extra});
          cSegs.push({type: 'gap', text: ''});
          oi += look;
          found = true;
        }
      }
      // Look ahead in current (current has extra chars)
      for (var look2 = 1; look2 <= 8 && !found; look2++) {
        if (oi < o.length && ci + look2 < c.length && o[oi] === c[ci + look2]) {
          var extra2 = '';
          for (var k2 = 0; k2 < look2; k2++) extra2 += c[ci + k2];
          oSegs.push({type: 'gap', text: ''});
          cSegs.push({type: 'diff', text: extra2});
          ci += look2;
          found = true;
        }
      }
      if (!found) {
        // No match — treat as substitution
        if (oi < o.length && ci < c.length) {
          oSegs.push({type: 'diff', text: o[oi]});
          cSegs.push({type: 'diff', text: c[ci]});
          oi++;
          ci++;
        } else if (oi < o.length) {
          oSegs.push({type: 'miss', text: o[oi]});
          cSegs.push({type: 'gap', text: ''});
          oi++;
        } else if (ci < c.length) {
          oSegs.push({type: 'gap', text: ''});
          cSegs.push({type: 'diff', text: c[ci]});
          ci++;
        } else {
          break;
        }
      }
    }
  }
  return {orig: oSegs, curr: cSegs};
}

function buildDiffHTML(segs) {
  var html = '';
  for (var i = 0; i < segs.length; i++) {
    var seg = segs[i];
    if (seg.type === 'same') {
      html += '<span class="w-same">' + seg.text + '</span>';
    } else if (seg.type === 'diff') {
      html += '<span class="w-diff">' + seg.text + '</span>';
    } else if (seg.type === 'miss') {
      html += '<span class="w-miss">' + seg.text + '</span>';
    }
    // gap: render nothing
  }
  return html;
}

function countDiffPositions(segs) {
  var count = 0;
  for (var i = 0; i < segs.length; i++) {
    if (segs[i].type === 'diff' && segs[i].text.length > 0) count++;
    if (segs[i].type === 'miss' && segs[i].text.length > 0) count++;
  }
  return count;
}

function renderDiff(stepIdx) {
  var orig = steps[0].text;
  var curr = steps[stepIdx].text;
  var diff = computeDiff(orig, curr);

  var diffOrig = document.getElementById('diffOrig');
  var diffCurr = document.getElementById('diffCurr');
  var diffStats = document.getElementById('diffStats');

  diffOrig.innerHTML = buildDiffHTML(diff.orig);
  diffCurr.innerHTML = buildDiffHTML(diff.curr);

  var dc = countDiffPositions(diff.curr) + countDiffPositions(diff.orig);
  diffStats.innerHTML = '差异位置：<strong>' + dc + '</strong> 处';

  if (stepIdx === 5 && isComplete) {
    diffStats.innerHTML += ' · 这个变体被社群保留了下来';
  }
}

// ====== CHAIN NODE ANIMATION ======
function addNodeToChain(stepIdx) {
  // Add arrow before node (except s0)
  if (stepIdx > 0) {
    var arrow = document.createElement('div');
    arrow.className = 'chain-arrow';
    arrow.style.opacity = '0';
    document.getElementById('chain').appendChild(arrow);
    gsap.to(arrow, {opacity: 0.7, duration: 0.25, ease: 'power2.out'});
  }

  var node = document.createElement('div');
  node.className = 'chain-node';
  node.dataset.step = stepIdx;
  node.innerHTML = buildNodeHTML(stepIdx);
  node.style.opacity = '0';
  node.style.transform = 'translateY(12px)';
  document.getElementById('chain').appendChild(node);

  var tl = gsap.timeline();
  tl.to(node, {opacity: 1, y: 0, duration: 0.35, ease: 'power2.out'});

  // Flash mutation highlight
  if (stepIdx > 0 && mutations[stepIdx] && mutations[stepIdx].length > 0) {
    var hlSpans = node.querySelectorAll('.mutation-hl');
    if (hlSpans.length > 0) {
      tl.to(hlSpans, {scale: 1.15, duration: 0.15, ease: 'power1.out'}, '+=0.1');
      tl.to(hlSpans, {scale: 1, duration: 0.3, ease: 'elastic.out(1, 0.4)'});
      tl.to({}, {duration: 0.15});
    }
  }

  return tl;
}

// ====== BUILD PAGE ======
(function build() {
  var stage = document.getElementById('stage');
  stage.innerHTML =
    '<div class="page-content">' +
      '<!-- Left: Chain panel -->' +
      '<div class="chain-panel">' +
        '<div id="chain" class="chain-scroll"></div>' +
        '<div class="ctl-bar">' +
          '<span id="stepIndicator" class="step-indicator">已传 0 次</span>' +
          '<button id="nextBtn" class="btn-primary">传给下一位</button>' +
        '</div>' +
        '<div class="takeaways">' +
          '<p>知识靠模仿传递，但模仿从来不是复印——<span class="highlight">每一次传话都会留下变异</span>。</p>' +
          '<p>多数变异是噪音，可一旦社群觉得某个变体更顺口、更有用，它就会被保留——<span class="highlight">这就是创新</span>。</p>' +
        '</div>' +
      '</div>' +
      '<!-- Right: Diff panel -->' +
      '<div class="diff-panel">' +
        '<div class="diff-panel-inner">' +
          '<div class="diff-header">⟷ 逐词比较</div>' +
          '<div class="diff-section">' +
            '<div class="diff-label">原始句</div>' +
            '<div id="diffOrig" class="diff-line"></div>' +
          '</div>' +
          '<div class="diff-section">' +
            '<div class="diff-label">当前句</div>' +
            '<div id="diffCurr" class="diff-line"></div>' +
          '</div>' +
          '<div id="diffStats" class="diff-stats">差异位置：0 处</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  // Show s0
  var chain = document.getElementById('chain');
  var s0node = document.createElement('div');
  s0node.className = 'chain-node';
  s0node.dataset.step = 0;
  s0node.innerHTML = buildNodeHTML(0);
  chain.appendChild(s0node);
  renderDiff(0);
})();

// ====== INTERACTION ======
document.getElementById('nextBtn').addEventListener('click', function() {
  if (isAnimating) return;

  if (!isComplete) {
    var next = currentStep + 1;
    if (next > 5) return;

    isAnimating = true;
    this.disabled = true;

    var btn = this;
    var tl = addNodeToChain(next);
    tl.call(function() {
      currentStep = next;
      renderDiff(currentStep);
      document.getElementById('stepIndicator').textContent = '已传 ' + currentStep + ' 次';

      if (currentStep === 5) {
        isComplete = true;
        btn.textContent = '回看全链';
        btn.className = 'btn-secondary';
        // Make all nodes clickable for review
        var nodes = document.querySelectorAll('.chain-node');
        for (var i = 0; i < nodes.length; i++) {
          (function(el) {
            el.classList.add('clickable');
            el.addEventListener('click', function() {
              var step = parseInt(this.dataset.step);
              // highlight active
              document.querySelectorAll('.chain-node').forEach(function(n) {
                n.classList.remove('active-review');
              });
              el.classList.add('active-review');
              renderDiff(step);
            });
          })(nodes[i]);
        }
        // Show completion in diff
        var ds = document.getElementById('diffStats');
        ds.innerHTML += ' · 这个变体被社群保留了下来';
      }

      isAnimating = false;
      btn.disabled = false;
    });
    tl.play();
  }
});
</script>
</body>
</html>
