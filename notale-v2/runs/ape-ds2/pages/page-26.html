<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== page-26 specific ===== */
:root {
  --gold: #d4a843;
  --gold-dim: rgba(212, 168, 67, 0.35);
  --gold-bright: #f0d080;
  --gold-glow: rgba(212, 168, 67, 0.25);
  --platform-line: rgba(212, 168, 67, 0.08);
}

#stage {
  position: relative;
}

#main {
  width: 100%;
  height: 100%;
}

.tree-wrap {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  overflow: hidden;
}

#tree-cv {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* Key points text overlay */
.tree-text {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  pointer-events: none;
  z-index: 2;
}
.tree-text .kp {
  margin: 0;
  font-size: var(--fs-sec);
  line-height: 1.35;
  letter-spacing: 0.02em;
  text-align: center;
  white-space: nowrap;
}
.tree-text .kp-1 { color: var(--gold); font-weight: 600; }
.tree-text .kp-2 { color: rgba(230, 230, 230, 0.6); }
.tree-text .kp-3 { color: rgba(212, 168, 67, 0.55); }

/* Slider panel */
.slider-panel {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  background: rgba(11, 14, 20, 0.78);
  border: 1px solid rgba(212, 168, 67, 0.2);
  border-radius: 10px;
  padding: 8px 24px 6px;
  min-width: 680px;
  box-sizing: border-box;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.slider-labels {
  display: flex;
  justify-content: space-between;
  margin-bottom: 1px;
  padding: 0 2px;
}
.slider-labels .sl {
  font-size: var(--fs-label);
  color: var(--muted);
  cursor: pointer;
  transition: color 0.2s;
  padding: 2px 4px;
  border-radius: 3px;
  user-select: none;
  -webkit-user-select: none;
}
.slider-labels .sl:hover { color: var(--gold); }
.slider-labels .sl.active { color: var(--gold-bright); font-weight: 600; }

#step-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  background: rgba(212, 168, 67, 0.2);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
  margin: 3px 0;
}
#step-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--gold);
  border: 2px solid rgba(11, 14, 20, 0.8);
  box-shadow: 0 0 8px var(--gold-glow);
  cursor: pointer;
  transition: box-shadow 0.2s;
}
#step-slider::-webkit-slider-thumb:hover {
  box-shadow: 0 0 14px var(--gold-glow);
}
#step-slider::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--gold);
  border: 2px solid rgba(11, 14, 20, 0.8);
  box-shadow: 0 0 8px var(--gold-glow);
  cursor: pointer;
}

.slider-value {
  text-align: center;
  font-size: var(--fs-label);
  color: var(--gold);
  margin-top: 1px;
  letter-spacing: 0.03em;
  min-height: 1.4em;
}

/* Hover tooltip (DOM overlay) */
.tree-tip {
  position: absolute;
  z-index: 3;
  pointer-events: none;
  background: rgba(11, 14, 20, 0.85);
  border: 1px solid var(--gold);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: var(--fs-sec);
  color: var(--gold-bright);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.15s;
  line-height: 1.35;
  max-width: 400px;
}
.tree-tip.show { opacity: 1; }
</style>
</head>
<body data-page="26" data-total="50">
<div id="stage">
<main id="main">
<div class="tree-wrap">
  <canvas id="tree-cv" class="cv-fill no-pan"></canvas>
  <div class="tree-text">
    <p class="kp kp-1">每一代人都在前一代的平台上开始</p>
    <p class="kp kp-2">文化进化代际累积、指数加速，不必等基因突变</p>
    <p class="kp kp-3">旧平台没有消失，只是沉入底层</p>
  </div>
  <div class="slider-panel">
    <div class="slider-labels" id="slider-labels">
      <span class="sl" data-step="0">手斧</span>
      <span class="sl" data-step="1">火</span>
      <span class="sl" data-step="2">农业</span>
      <span class="sl" data-step="3">文字</span>
      <span class="sl" data-step="4">印刷</span>
      <span class="sl" data-step="5">蒸汽机</span>
      <span class="sl" data-step="6">互联网</span>
    </div>
    <input type="range" id="step-slider" min="0" max="6" value="0" step="1" aria-label="技术树推进">
    <div class="slider-value" id="slider-value">手斧 — 约170万年前</div>
  </div>
  <div class="tree-tip" id="tree-tip"></div>
</div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
(function() {
  'use strict';

  /* ===================== Lec.mount ===================== */
  Lec.mount({
    index: 26,
    kicker: 'CULTURAL ACCUMULATION',
    title: '技术树累积器',
    take: '从手斧到互联网，每一代人都在前人的肩膀上'
  });

  /* ===================== Constants ===================== */
  var P26 = {
    HAND_AXE_YEARS_AGO: 1_700_000,
    FIRE_USE_YEARS_AGO: 1_000_000,
    AGRICULTURE_YEARS_AGO: 10_000,
    WRITING_YEARS_AGO: 5_000,
    PRINTING_YEAR: 1450,
    STEAM_ENGINE_YEAR: 1712,
    INTERNET_YEAR: 1969
  };

  var now = new Date().getFullYear();
  var steps = [
    { id: 'hand-axe',   label: '手斧',   time: '约170万年前',  yearsAgo: P26.HAND_AXE_YEARS_AGO,        platform: '切削、规划、双手解放' },
    { id: 'fire',        label: '火',     time: '约100万年前',  yearsAgo: P26.FIRE_USE_YEARS_AGO,        platform: '稳定能量、夜间照明、驱兽' },
    { id: 'agriculture', label: '农业',   time: '约1万年前',    yearsAgo: P26.AGRICULTURE_YEARS_AGO,     platform: '定居、剩余食物' },
    { id: 'writing',     label: '文字',   time: '约5000年前',   yearsAgo: P26.WRITING_YEARS_AGO,         platform: '外部记忆' },
    { id: 'printing',    label: '印刷',   time: '约' + (now - P26.PRINTING_YEAR) + '年前', yearsAgo: now - P26.PRINTING_YEAR, platform: '知识的批量复制' },
    { id: 'steam',       label: '蒸汽机', time: '约' + (now - P26.STEAM_ENGINE_YEAR) + '年前', yearsAgo: now - P26.STEAM_ENGINE_YEAR, platform: '超越肌肉的动力' },
    { id: 'internet',    label: '互联网', time: '约' + (now - P26.INTERNET_YEAR) + '年前', yearsAgo: now - P26.INTERNET_YEAR, platform: '即时全球连接' }
  ];

  var arrows = [
    { from: 'hand-axe',   to: 'fire',        label: '控制自然物' },
    { from: 'fire',        to: 'agriculture', label: '清理土地、管理生态' },
    { from: 'agriculture', to: 'writing',     label: '剩余需要记账' },
    { from: 'writing',     to: 'printing',    label: '手抄复制遇到瓶颈' },
    { from: 'printing',    to: 'steam',       label: '标准化零件与知识扩散' },
    { from: 'steam',       to: 'internet',    label: '电网与工业制造支撑信息网络' }
  ];

  var stepIndex = {}; steps.forEach(function(s, i) { stepIndex[s.id] = i; });

  /* ===================== DOM refs ===================== */
  var cv = document.getElementById('tree-cv');
  var slider = document.getElementById('step-slider');
  var sliderVal = document.getElementById('slider-value');
  var sliderLabels = document.querySelectorAll('.sl');
  var tip = document.getElementById('tree-tip');
  var wrap = document.querySelector('.tree-wrap');

  /* ===================== State ===================== */
  var currentStep = 0;
  var targetStep = 0;
  var animProgress = 0;
  var hoveredNode = -1;
  var nodePositions = [];
  var W = 0, H = 0, dpr = 1;

  /* ===================== d3 tree layout ===================== */
  function computeLayout(w, h) {
    var treeData = { id: 'root', children: [] };
    var cur = treeData;
    steps.forEach(function(s) {
      var node = { id: s.id, label: s.label };
      cur.children = [node];
      cur = node;
    });

    var root = d3.hierarchy(treeData);
    var cluster = d3.cluster().size([w - 120, 0]);
    cluster(root);

    var positions = [];
    root.each(function(d) {
      if (!d.children || d.children.length === 0) {
        positions.push({
          x: d.x + 60,
          y: h * 0.5,
          index: positions.length
        });
      }
    });
    positions.sort(function(a, b) { return a.x - b.x; });
    return positions;
  }

  /* ===================== Drawing helpers ===================== */
  function drawGlow(ctx, x, y, radius, alpha) {
    var grad = ctx.createRadialGradient(x, y, 0, x, y, radius * 2.5);
    var a = alpha * 0.3;
    grad.addColorStop(0, 'rgba(212, 168, 67, ' + a + ')');
    grad.addColorStop(0.5, 'rgba(212, 168, 67, ' + (a * 0.25) + ')');
    grad.addColorStop(1, 'rgba(212, 168, 67, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, radius * 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawNode(ctx, x, y, radius, alpha, isActive, isHovered) {
    drawGlow(ctx, x, y, radius, isActive ? 0.6 : 0.15);

    ctx.save();
    ctx.globalAlpha = alpha;

    // Outer ring
    if (isActive) {
      ctx.shadowColor = 'rgba(212, 168, 67, 0.5)';
      ctx.shadowBlur = 20;
    }
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fillStyle = isActive ? '#d4a843' : 'rgba(212, 168, 67, 0.25)';
    ctx.fill();
    ctx.shadowBlur = 0;

    // Inner circle
    ctx.beginPath();
    ctx.arc(x, y, radius * 0.6, 0, Math.PI * 2);
    ctx.fillStyle = isActive ? '#f0d080' : 'rgba(212, 168, 67, 0.4)';
    ctx.fill();

    // Border
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.strokeStyle = isActive ? 'rgba(240, 208, 128, 0.8)' : 'rgba(212, 168, 67, 0.2)';
    ctx.lineWidth = isActive ? 2 : 1;
    ctx.stroke();

    // Hover highlight ring
    if (isHovered) {
      ctx.beginPath();
      ctx.arc(x, y, radius + 4, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(240, 208, 128, 0.6)';
      ctx.lineWidth = 2;
      ctx.setLineDash([3, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();
  }

  function drawIcon(ctx, id, x, y, size, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.fillStyle = '#0b0e14';
    ctx.strokeStyle = '#0b0e14';
    ctx.lineWidth = 1.5;

    var s = size * 0.4;

    switch (id) {
      case 'hand-axe':
        ctx.beginPath();
        ctx.moveTo(0, -s * 0.6);
        ctx.lineTo(-s * 0.5, s * 0.6);
        ctx.lineTo(s * 0.5, s * 0.6);
        ctx.closePath();
        ctx.fill();
        break;
      case 'fire':
        ctx.beginPath();
        ctx.moveTo(0, -s * 0.7);
        ctx.quadraticCurveTo(s * 0.5, -s * 0.1, s * 0.4, s * 0.3);
        ctx.quadraticCurveTo(0, s * 0.7, -s * 0.4, s * 0.3);
        ctx.quadraticCurveTo(-s * 0.5, -s * 0.1, 0, -s * 0.7);
        ctx.fill();
        break;
      case 'agriculture':
        ctx.beginPath();
        ctx.moveTo(0, s * 0.7);
        ctx.lineTo(0, -s * 0.3);
        ctx.stroke();
        for (var i = -2; i <= 2; i++) {
          ctx.beginPath();
          ctx.arc(i * s * 0.15, -s * 0.3 - s * 0.1, s * 0.08, 0, Math.PI * 2);
          ctx.fill();
        }
        break;
      case 'writing':
        ctx.fillRect(-s * 0.4, -s * 0.55, s * 0.8, s * 1.1);
        ctx.strokeRect(-s * 0.4, -s * 0.55, s * 0.8, s * 1.1);
        ctx.strokeStyle = '#0b0e14';
        ctx.lineWidth = 1;
        for (var j = -2; j <= 1; j++) {
          ctx.beginPath();
          ctx.moveTo(-s * 0.25, j * s * 0.2);
          ctx.lineTo(s * 0.25, j * s * 0.2);
          ctx.stroke();
        }
        break;
      case 'printing':
        ctx.fillRect(-s * 0.45, -s * 0.5, s * 0.4, s * 1.0);
        ctx.fillRect(-s * 0.05, -s * 0.55, s * 0.45, s * 1.1);
        ctx.strokeRect(-s * 0.45, -s * 0.5, s * 0.4, s * 1.0);
        ctx.strokeRect(-s * 0.05, -s * 0.55, s * 0.45, s * 1.1);
        break;
      case 'steam':
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.4, 0, Math.PI * 2);
        ctx.fill();
        for (var k = 0; k < 8; k++) {
          var a = k * Math.PI / 4;
          ctx.fillRect(Math.cos(a) * s * 0.4 - s * 0.08, Math.sin(a) * s * 0.4 - s * 0.08, s * 0.16, s * 0.16);
        }
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.15, 0, Math.PI * 2);
        ctx.fillStyle = '#d4a843';
        ctx.fill();
        break;
      case 'internet':
        var pts = [[0, -s * 0.5], [s * 0.5, s * 0.3], [-s * 0.5, s * 0.3]];
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        ctx.lineTo(pts[1][0], pts[1][1]);
        ctx.lineTo(pts[2][0], pts[2][1]);
        ctx.closePath();
        ctx.stroke();
        pts.forEach(function(p) {
          ctx.beginPath();
          ctx.arc(p[0], p[1], s * 0.1, 0, Math.PI * 2);
          ctx.fill();
        });
        break;
    }
    ctx.restore();
  }

  function drawArrow(ctx, x1, y1, x2, y2, alpha, label) {
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;

    var dx = x2 - x1;
    var dy = y2 - y1;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len < 1) { ctx.restore(); return; }

    var mx = (x1 + x2) / 2;
    var my = (y1 + y2) / 2 - 16;

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(mx, my, x2, y2);
    ctx.strokeStyle = 'rgba(212, 168, 67, ' + (0.5 * alpha) + ')';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    var angle = Math.atan2(y2 - my, x2 - mx);
    var headLen = 8;
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headLen * Math.cos(angle - 0.4), y2 - headLen * Math.sin(angle - 0.4));
    ctx.lineTo(x2 - headLen * Math.cos(angle + 0.4), y2 - headLen * Math.sin(angle + 0.4));
    ctx.closePath();
    ctx.fillStyle = 'rgba(212, 168, 67, ' + (0.5 * alpha) + ')';
    ctx.fill();

    if (label) {
      ctx.fillStyle = 'rgba(212, 168, 67, ' + (0.6 * alpha) + ')';
      ctx.font = '14px "Noto Sans SC", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(label, mx, my - 4);
    }

    ctx.restore();
  }

  function drawPlatformLine(ctx, x, y, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha * 0.12;
    ctx.beginPath();
    ctx.moveTo(40, y + 30);
    ctx.lineTo(x, y + 30);
    ctx.strokeStyle = '#d4a843';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  /* ===================== Main draw ===================== */
  function drawScene(progress) {
    var ctx = Deck.fit(cv);
    if (!ctx) return;
    dpr = window.devicePixelRatio || 1;
    W = cv.width / dpr;
    H = cv.height / dpr;

    ctx.clearRect(0, 0, cv.width, cv.height);

    // Background
    ctx.fillStyle = '#0b0e14';
    ctx.fillRect(0, 0, cv.width, cv.height);

    if (nodePositions.length === 0) {
      nodePositions = computeLayout(W, H);
    }

    var nodeRadius = 24;
    var currentIdx = Math.min(Math.floor(progress), steps.length - 1);
    var frac = progress - currentIdx;

    // Draw platform lines
    for (var i = 0; i <= currentIdx; i++) {
      var np = nodePositions[i];
      var nodeAlpha = (i < currentIdx) ? 0.5 : (i === currentIdx ? 1 : 0);
      if (i === currentIdx && frac > 0) nodeAlpha = Math.min(1, frac * 2);
      drawPlatformLine(ctx, np.x, np.y, nodeAlpha);
    }

    // Draw arrows
    for (var a = 0; a < arrows.length; a++) {
      var arrow = arrows[a];
      var fromIdx = stepIndex[arrow.from];
      var toIdx = stepIndex[arrow.to];
      if (toIdx > currentIdx) continue;
      if (toIdx === currentIdx && frac < 0.4) continue;

      var fromP = nodePositions[fromIdx];
      var toP = nodePositions[toIdx];
      var arrowAlpha = 1;
      if (toIdx === currentIdx) {
        arrowAlpha = Math.min(1, (frac - 0.3) * 3);
      }
      if (arrowAlpha > 0) {
        drawArrow(ctx, fromP.x + nodeRadius, fromP.y, toP.x - nodeRadius, toP.y, arrowAlpha, arrow.label);
      }
    }

    // Draw nodes
    for (var i = 0; i <= currentIdx; i++) {
      var np = nodePositions[i];
      var isActive = (i === currentIdx);
      var isHovered = (i === hoveredNode);
      var nodeAlpha = (i < currentIdx) ? 0.55 : (i === currentIdx ? 1 : 0);
      if (i === currentIdx && frac > 0) {
        var appearScale = Math.min(1, frac * 1.5);
        nodeAlpha = appearScale;
        var srcX = (i > 0) ? nodePositions[i - 1].x : np.x;
        var srcY = (i > 0) ? nodePositions[i - 1].y : np.y;
        var drawX = np.x + (srcX - np.x) * (1 - appearScale);
        var drawY = np.y + (srcY - np.y) * (1 - appearScale) - 16 * (1 - appearScale);
        drawNode(ctx, drawX, drawY, nodeRadius * appearScale, nodeAlpha, isActive, isHovered);
        drawIcon(ctx, steps[i].id, drawX, drawY, nodeRadius * 2, nodeAlpha);
      } else {
        drawNode(ctx, np.x, np.y, nodeRadius, nodeAlpha, isActive, isHovered);
        drawIcon(ctx, steps[i].id, np.x, np.y, nodeRadius * 2, nodeAlpha);
      }
    }

    // Draw node labels
    for (var i = 0; i <= currentIdx; i++) {
      var np = nodePositions[i];
      var nodeAlpha = (i < currentIdx) ? 0.55 : (i === currentIdx ? 1 : 0);
      if (i === currentIdx) {
        var appearScale = Math.min(1, frac * 1.5);
        nodeAlpha = appearScale;
      }

      ctx.save();
      ctx.globalAlpha = nodeAlpha;

      ctx.fillStyle = (i === currentIdx) ? '#f0d080' : 'rgba(212, 168, 67, 0.6)';
      ctx.font = '15px "Noto Sans SC", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(steps[i].label, np.x, np.y + nodeRadius + 8);

      ctx.fillStyle = (i === currentIdx) ? 'rgba(240, 208, 128, 0.6)' : 'rgba(212, 168, 67, 0.35)';
      ctx.font = '14px "Noto Sans SC", system-ui, sans-serif';
      ctx.fillText(steps[i].time, np.x, np.y + nodeRadius + 26);

      ctx.restore();
    }
  }

  /* ===================== Update from slider ===================== */
  function updateStep(step) {
    if (step < 0) step = 0;
    if (step > 6) step = 6;
    targetStep = step;

    gsap.to({ v: animProgress }, {
      v: targetStep,
      duration: 0.6,
      ease: 'power2.out',
      onUpdate: function() {
        animProgress = this.targets()[0].v;
        drawScene(animProgress);
      },
      onComplete: function() {
        animProgress = targetStep;
        drawScene(animProgress);
      }
    });

    currentStep = step;
    slider.value = step;

    sliderLabels.forEach(function(el) {
      var s = parseInt(el.getAttribute('data-step'));
      el.classList.toggle('active', s === step);
    });

    var s = steps[step];
    var rel = s.label + ' — ' + s.time;
    if (step > 0) {
      rel += ' · 平台：' + s.platform;
    }
    sliderVal.textContent = rel;
  }

  /* ===================== Hover detection ===================== */
  function findNodeAt(px, py) {
    var nodeRadius = 24;
    for (var i = 0; i < nodePositions.length; i++) {
      if (i > currentStep) continue;
      var np = nodePositions[i];
      var dx = px - np.x;
      var dy = py - np.y;
      if (dx * dx + dy * dy < (nodeRadius + 8) * (nodeRadius + 8)) {
        return i;
      }
    }
    return -1;
  }

  cv.addEventListener('mousemove', function(e) {
    var pt = Deck.pt(cv, e);
    var idx = findNodeAt(pt.x, pt.y);
    if (idx !== hoveredNode) {
      hoveredNode = idx;
      drawScene(animProgress);
      if (idx >= 0) {
        var s = steps[idx];
        var ancestors = [];
        for (var i = 0; i <= idx; i++) {
          ancestors.push(steps[i].label);
        }
        tip.textContent = s.label + '：' + s.platform + ' · 踩在' + ancestors.join('、') + '之上';
        // Position tooltip within tree-wrap bounds
        var elRect = wrap.getBoundingClientRect();
        var tipX = pt.x + 20;
        var tipY = pt.y - 40;
        if (tipX + 300 > W) tipX = pt.x - 300;
        if (tipY < 0) tipY = pt.y + 30;
        tip.style.left = tipX + 'px';
        tip.style.top = tipY + 'px';
        tip.classList.add('show');
      } else {
        tip.classList.remove('show');
      }
    }
  });

  cv.addEventListener('mouseleave', function() {
    hoveredNode = -1;
    tip.classList.remove('show');
    drawScene(animProgress);
  });

  /* ===================== Keyboard & Slider ===================== */
  slider.addEventListener('input', function() {
    updateStep(parseInt(this.value));
  });

  slider.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      e.preventDefault();
      updateStep(parseInt(this.value) - 1);
    } else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
      e.preventDefault();
      updateStep(parseInt(this.value) + 1);
    }
  });

  sliderLabels.forEach(function(el) {
    el.addEventListener('click', function() {
      updateStep(parseInt(this.getAttribute('data-step')));
    });
    el.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        updateStep(parseInt(this.getAttribute('data-step')));
      }
    });
    el.setAttribute('tabindex', '0');
    el.setAttribute('role', 'button');
  });

  /* ===================== Init ===================== */
  function init() {
    W = cv.parentElement.clientWidth;
    H = cv.parentElement.clientHeight;
    nodePositions = computeLayout(W, H);
    animProgress = 0;
    drawScene(0);
    sliderLabels[0].classList.add('active');
    sliderVal.textContent = steps[0].label + ' — ' + steps[0].time;
  }

  if (document.readyState === 'complete') {
    init();
  } else {
    window.addEventListener('load', init);
  }
})();
</script>
</body>
</html>
