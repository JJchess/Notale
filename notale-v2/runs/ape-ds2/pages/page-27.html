<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root { --bg: #0b0e14; --text: #e6e6e6; --font-sans: "Noto Sans SC", system-ui, sans-serif; }

#stage { padding: 0; display: flex; }
#main { display: flex; flex-direction: column; height: 100%; width: 100%; padding: var(--header-h) var(--side-margin) calc(var(--footer-h) + var(--footer-gap)); box-sizing: border-box; }

.fields-row { flex: 1; min-height: 0; display: flex; gap: 3px; position: relative; }
.field-half { flex: 1; min-width: 0; position: relative; overflow: hidden; border-radius: 6px; background: #060810; }
.field-half canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.field-tag { position: absolute; top: 14px; left: 20px; pointer-events: none; z-index: 2; }
.field-tag .name { font-size: var(--fs-label); color: #aabbcc; font-weight: 600; }
.field-tag .desc { font-size: var(--fs-label); color: #556677; margin-top: 2px; }
.field-unit-tag { position: absolute; top: 14px; right: 20px; font-size: var(--fs-label); color: #445566; pointer-events: none; z-index: 2; }

.controls-row { height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 4px; }
.controls-row input[type="range"] { flex: 1; height: 4px; -webkit-appearance: none; appearance: none; background: #2a2d35; border-radius: 2px; outline: none; cursor: pointer; margin: 0; }
.controls-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #4f6ef2; border: 2px solid #6a8aff; cursor: pointer; }
.controls-row input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #4f6ef2; border: 2px solid #6a8aff; cursor: pointer; }
.controls-row input[type="range"]:focus-visible { outline: 2px solid #4f6ef2; outline-offset: 3px; }
.slider-label { font-size: var(--fs-sec); color: #8899aa; white-space: nowrap; min-width: 96px; text-align: center; font-variant-numeric: tabular-nums; }

.key-note { flex-shrink: 0; padding: 0 4px 4px; text-align: center; font-size: var(--fs-sec); color: #667788; line-height: 1.5; }

.conclusion { position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%); font-size: var(--fs-lead); color: #e6e6e6; text-align: center; opacity: 0; transition: opacity 1.2s ease; pointer-events: none; z-index: 5; background: rgba(11, 14, 20, 0.88); padding: 14px 28px; border-radius: 8px; border: 1px solid rgba(79, 110, 242, 0.25); max-width: 80%; line-height: 1.5; }
.conclusion.visible { opacity: 1; }
</style>
</head>
<body data-page="27" data-total="50">
<div id="stage">
<main id="main">
<div class="fields-row">
  <div class="field-half" id="field-left">
    <div class="field-tag"><div class="name">生物演化</div><div class="desc">单源 · 缓慢扩散</div></div>
    <div class="field-unit-tag">万年尺度</div>
  </div>
  <div class="field-half" id="field-right">
    <div class="field-tag"><div class="name">文化演化</div><div class="desc">多源 · 快速喷射</div></div>
    <div class="field-unit-tag">代人尺度</div>
  </div>
</div>
<div class="key-note">同一时间跨度，生物演化几乎纹丝不动；文化演化已足够让一种行为被成百代人复制与改造。人类的适应快车道是文化——适应新环境不必等 DNA 改变。</div>
<div class="controls-row">
  <span class="slider-label" id="label-left">距今 0 万年</span>
  <input type="range" id="time-slider" min="0" max="1" step="0.001" value="0" aria-label="拖动时间滑块，观察生物演化与文化演化的速度差异">
  <span class="slider-label" id="label-right">0 代</span>
</div>
<div class="conclusion" id="conclusion">万年的刻度，早已在代人的接力里跑完</div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/pixi.min.js"></script>
<script>
(function() {
  'use strict';

  // ---- 常量 ----
  var HOMO_SAPIENS_YEARS_AGO = Lec.K.HOMO_SAPIENS_YEARS_AGO; // 300,000
  var GEN_INTERVAL = 25; // 一代 25 年（全套口径，本页自行定义）
  var TOTAL_GENERATIONS = Math.round(HOMO_SAPIENS_YEARS_AGO / GEN_INTERVAL);
  var GEN_PER_10K = 10000 / GEN_INTERVAL; // 400 轮/万年

  // ---- 挂载页眉页脚 ----
  Lec.mount({
    index: 27,
    kicker: '第 4 章 · 累积文化',
    title: '生物演化以万年计，文化演化以代人计',
    take: '万年的刻度，早已在代人的接力里跑完',
    sub: '万年的刻度，早已在代人的接力里跑完'
  });

  // ---- DOM 引用 ----
  var leftEl = document.getElementById('field-left');
  var rightEl = document.getElementById('field-right');
  var slider = document.getElementById('time-slider');
  var labelLeft = document.getElementById('label-left');
  var labelRight = document.getElementById('label-right');
  var conclusion = document.getElementById('conclusion');

  // ---- 粒子纹理发生器 ----
  function makeGlowTexture(size) {
    var c = document.createElement('canvas');
    c.width = size * 2;
    c.height = size * 2;
    var ctx = c.getContext('2d');
    var g = ctx.createRadialGradient(size, size, 0, size, size, size);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.15, 'rgba(255,255,255,0.85)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.25)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(size, size, size, 0, Math.PI * 2);
    ctx.fill();
    return PIXI.Texture.from(c);
  }

  // ---- 粒子系统 ----
  var leftApp, rightApp;
  var leftParticles = [];
  var rightParticles = [];
  var leftSources = [];
  var rightSources = [];
  var targetProgress = 0;
  var currentProgress = 0;
  var animating = false;

  function initPixi() {
    var s = Deck.s;
    var lr = leftEl.getBoundingClientRect();
    var w = Math.round(lr.width / s);
    var h = Math.round(lr.height / s);

    var res = Math.min(window.devicePixelRatio || 1, 2);

    // ---- 左半场：PixiJS ----
    leftApp = new PIXI.Application({
      width: w,
      height: h,
      backgroundColor: 0x060810,
      antialias: true,
      resolution: res
    });
    leftEl.insertBefore(leftApp.view, leftEl.firstChild);
    leftApp.view.style.position = 'absolute';
    leftApp.view.style.inset = '0';
    leftApp.view.style.width = '100%';
    leftApp.view.style.height = '100%';

    var amberTex = makeGlowTexture(5);
    var leftC = new PIXI.Container();
    leftApp.stage.addChild(leftC);

    leftParticles = [];
    var cx = w / 2;
    var cy = h / 2;
    for (var i = 0; i < 130; i++) {
      var sp = new PIXI.Sprite(amberTex);
      sp.anchor.set(0.5);
      var shade = 0xbb7700 + Math.floor(Math.random() * 0x443300);
      sp.tint = shade;
      var angle = Math.random() * Math.PI * 2;
      var maxR = 30 + Math.random() * 200;
      sp.scale.set(0.4 + Math.random() * 0.7);
      sp.alpha = 0.3 + Math.random() * 0.4;
      sp.x = cx;
      sp.y = cy;
      leftC.addChild(sp);
      leftParticles.push({
        sp: sp, angle: angle, maxR: maxR,
        cx: cx, cy: cy, curR: 0,
        phase: Math.random() * 100
      });
    }

    // ---- 右半场：PixiJS ----
    rightApp = new PIXI.Application({
      width: w,
      height: h,
      backgroundColor: 0x060810,
      antialias: true,
      resolution: res
    });
    rightEl.insertBefore(rightApp.view, rightEl.firstChild);
    rightApp.view.style.position = 'absolute';
    rightApp.view.style.inset = '0';
    rightApp.view.style.width = '100%';
    rightApp.view.style.height = '100%';

    var blueTex = makeGlowTexture(4);
    var brightTex = makeGlowTexture(3);
    var rightC = new PIXI.Container();
    rightApp.stage.addChild(rightC);

    // 生成 8 个随机源点
    rightSources = [];
    for (var si = 0; si < 8; si++) {
      rightSources.push({
        x: w * (0.1 + Math.random() * 0.8),
        y: h * (0.1 + Math.random() * 0.8)
      });
    }

    rightParticles = [];
    for (var j = 0; j < 450; j++) {
      var src = rightSources[Math.floor(Math.random() * rightSources.length)];
      var sp2 = new PIXI.Sprite(Math.random() > 0.35 ? blueTex : brightTex);
      sp2.anchor.set(0.5);
      sp2.tint = Math.random() > 0.4 ? 0x4488ff : (Math.random() > 0.5 ? 0x88ccff : 0xaaddff);
      var a2 = Math.random() * Math.PI * 2;
      var mr2 = 20 + Math.random() * 300;
      sp2.scale.set(0.3 + Math.random() * 0.6);
      sp2.alpha = 0.4 + Math.random() * 0.5;
      sp2.x = src.x;
      sp2.y = src.y;
      rightC.addChild(sp2);
      rightParticles.push({
        sp: sp2, src: src, angle: a2, maxR: mr2,
        curR: 0, phase: Math.random() * 100,
        speed: 0.5 + Math.random() * 2
      });
    }
  }

  // ---- 更新粒子 ----
  function updateParticles(progress) {
    // progress: 0 (present) ~ 1 (300,000 years ago)
    if (!leftApp || !rightApp) return;

    // ---- 左场：生物演化，缓慢扩散 ----
    // 用高次方让前段几乎不动，后段才逐渐推开
    var leftSpread = Math.pow(progress, 2.8) * 0.55;
    for (var i = 0; i < leftParticles.length; i++) {
      var p = leftParticles[i];
      var targetR = p.maxR * leftSpread;
      p.curR += (targetR - p.curR) * 0.025;
      var jitter = Math.sin(p.phase + Date.now() * 0.0003) * 2;
      p.sp.x = p.cx + Math.cos(p.angle) * (p.curR + jitter);
      p.sp.y = p.cy + Math.sin(p.angle) * (p.curR + jitter);
      p.sp.alpha = 0.25 + leftSpread * 0.5;
      p.sp.scale.set(0.4 + leftSpread * 0.3);
    }

    // ---- 右场：文化演化，快速扩散 ----
    // 用低次方让前段快速爆发
    var rightSpread = Math.pow(progress, 0.35) * 1.0;
    for (var j = 0; j < rightParticles.length; j++) {
      var q = rightParticles[j];
      var tR = q.maxR * rightSpread;
      q.curR += (tR - q.curR) * 0.06;
      var jx = Math.sin(q.phase + Date.now() * 0.002) * (3 + rightSpread * 8);
      var jy = Math.cos(q.phase * 1.3 + Date.now() * 0.0015) * (3 + rightSpread * 8);
      q.sp.x = q.src.x + Math.cos(q.angle) * q.curR + jx;
      q.sp.y = q.src.y + Math.sin(q.angle) * q.curR + jy;
      q.sp.alpha = 0.3 + rightSpread * 0.6;
      var sc = 0.3 + rightSpread * 0.5 + Math.sin(q.phase + Date.now() * 0.003) * 0.15;
      q.sp.scale.set(Math.max(0.2, sc));
    }
  }

  // ---- 更新标签 ----
  function updateLabels(progress) {
    var yearsAgo = progress * HOMO_SAPIENS_YEARS_AGO;
    var tenThousand = Math.round(yearsAgo / 10000);
    var generations = Math.round(yearsAgo / GEN_INTERVAL);
    labelLeft.textContent = '距今 ' + tenThousand + ' 万年';
    labelRight.textContent = generations + ' 代';

    if (progress > 0.95) {
      conclusion.classList.add('visible');
    } else {
      conclusion.classList.remove('visible');
    }
  }

  // ---- 重置粒子到初始状态 ----
  function resetParticles() {
    for (var i = 0; i < leftParticles.length; i++) {
      var p = leftParticles[i];
      p.curR = 0;
      p.sp.x = p.cx;
      p.sp.y = p.cy;
      p.sp.alpha = 0.25;
      p.sp.scale.set(0.4);
    }
    for (var j = 0; j < rightParticles.length; j++) {
      var q = rightParticles[j];
      q.curR = 0;
      q.sp.x = q.src.x;
      q.sp.y = q.src.y;
      q.sp.alpha = 0.3;
      q.sp.scale.set(0.3);
    }
  }

  // ---- 滑块事件 ----
  slider.addEventListener('input', function() {
    targetProgress = parseFloat(this.value);
    updateLabels(targetProgress);
    if (!animating) {
      currentProgress = targetProgress;
      updateParticles(currentProgress);
    }
  });

  // ---- 键盘支持 ----
  slider.addEventListener('keydown', function(e) {
    var step = 0.005;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
      e.preventDefault();
      this.value = Math.min(1, parseFloat(this.value) + step);
      this.dispatchEvent(new Event('input'));
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      e.preventDefault();
      this.value = Math.max(0, parseFloat(this.value) - step);
      this.dispatchEvent(new Event('input'));
    }
  });

  // ---- 启动动画循环 (在 PixiJS 就绪后调用) ----
  function startAnimation() {
    if (!Deck.reduced()) {
      animating = true;
      leftApp.ticker.add(function() {
        currentProgress += (targetProgress - currentProgress) * 0.08;
        if (Math.abs(currentProgress - targetProgress) < 0.001) {
          currentProgress = targetProgress;
        }
        updateParticles(currentProgress);
      });
      // 右场只需确保渲染循环运行
      rightApp.ticker.add(function() {});
    } else {
      animating = false;
      resetParticles();
      updateParticles(0);
      leftApp.renderer.render(leftApp.stage);
      rightApp.renderer.render(rightApp.stage);
    }
  }

  // ---- 初始化 (在 PixiJS 就绪后调用) ----
  function init() {
    initPixi();
    currentProgress = 0;
    targetProgress = 0;
    resetParticles();
    updateParticles(0);
    updateLabels(0);
    startAnimation();
  }

  // 等待 DOM 就绪
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // ---- 窗口尺寸变化 ----
  Deck.onResize(function() {
    var savedProgress = targetProgress;
    if (leftApp) {
      leftApp.destroy(true, { children: true, texture: true });
    }
    if (rightApp) {
      rightApp.destroy(true, { children: true, texture: true });
    }
    leftParticles = [];
    rightParticles = [];
    initPixi();
    currentProgress = savedProgress;
    targetProgress = savedProgress;
    updateParticles(savedProgress);
    updateLabels(savedProgress);
    startAnimation();
  });

})();
</script>
</body>
</html>
