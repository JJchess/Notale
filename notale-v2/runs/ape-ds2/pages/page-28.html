<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<style>
/* ── page-specific tokens ── */
:root {
  --p28-gold: #c4a35a;
  --p28-stem: #5a8a3c;
  --p28-leaf: #6ba34a;
  --p28-soil: #4a3728;
  --p28-bg-dim: rgba(11, 14, 20, 0.55);
  --p28-glass: rgba(15, 18, 28, 0.82);
  --p28-glass-border: rgba(255, 255, 255, 0.08);
  --p28-accent-gold: #d4b06a;
  --p28-success: #4ade80;
  --p28-warn: #fbbf24;
  --p28-danger: #f87171;
  --p28-selected: rgba(79, 110, 242, 0.35);
  --p28-selected-border: #4f6ef2;
}

/* ── layout ── */
#main {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
}

/* background layer */
#bg-layer {
  position: absolute;
  inset: 0;
  background: url(assets/img/p28-bg.png) center / cover no-repeat;
  opacity: 0.35;
  pointer-events: none;
}

/* top overlay */
#top-overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  padding: 20px 32px 12px;
  background: linear-gradient(180deg, var(--p28-bg-dim) 60%, transparent);
  pointer-events: none;
}
#top-overlay .kicker {
  font-size: var(--fs-label);
  color: var(--p28-accent-gold);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 600;
  margin-bottom: 4px;
}
#top-overlay .ptitle {
  font-size: var(--fs-h2);
  font-weight: 700;
  color: #fff;
  line-height: 1.25;
}
#top-overlay .instruction {
  font-size: var(--fs-sec);
  color: var(--muted);
  margin-top: 6px;
  pointer-events: auto;
}

/* main content area */
#content-area {
  position: absolute;
  inset: 80px 0 72px 0;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 0;
  z-index: 2;
}

/* plant field */
#field-area {
  flex: 1 1 auto;
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 8px;
}

#plant-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 8px;
  width: 100%;
  max-width: 780px;
  height: 100%;
  max-height: 480px;
  padding: 8px;
}

.plant-cell {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.2s, box-shadow 0.2s;
  padding: 4px;
  min-height: 0;
}
.plant-cell:hover {
  background: rgba(255, 255, 255, 0.06);
}
.plant-cell.selected {
  background: var(--p28-selected);
  box-shadow: 0 0 0 2px var(--p28-selected-border);
}
.plant-cell .plant-svg-wrap {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.plant-cell .plant-svg-wrap svg {
  width: 100%;
  height: 100%;
  max-width: 72px;
  max-height: 140px;
}
.plant-cell .plant-shatter-badge {
  position: absolute;
  bottom: 2px;
  font-size: 12px;
  color: var(--muted);
  opacity: 0.6;
  line-height: 1;
}
.plant-cell .plant-index {
  position: absolute;
  top: 2px;
  right: 4px;
  font-size: 12px;
  color: rgba(255,255,255,0.2);
}

/* data panel */
#data-panel {
  position: relative;
  flex: 0 0 320px;
  min-width: 0;
  height: 100%;
  max-height: 520px;
  margin-right: 16px;
  background: var(--p28-glass);
  border: 1px solid var(--p28-glass-border);
  border-radius: 12px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow-y: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

#data-panel .panel-title {
  font-size: var(--fs-label);
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
  margin-bottom: 2px;
}

#data-panel .stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
#data-panel .stat-row .label {
  font-size: var(--fs-label);
  color: var(--muted);
}
#data-panel .stat-row .value {
  font-size: var(--fs-body);
  font-weight: 600;
  color: #fff;
  font-variant-numeric: tabular-nums;
}
#data-panel .stat-row .value.negative {
  color: var(--p28-danger);
}
#data-panel .stat-row .value.positive {
  color: var(--p28-success);
}

#data-panel .chart-container {
  width: 100%;
  height: 80px;
  margin: 2px 0;
  position: relative;
}
#data-panel .chart-container .chart-label {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 2px;
}
#data-panel .chart-container svg {
  width: 100%;
  height: 100%;
}
#data-panel .chart-container svg text {
  fill: var(--muted);
  font-size: 12px;
}

/* status icons row */
#status-row {
  display: flex;
  gap: 16px;
  padding: 6px 0;
  margin-top: 4px;
  border-top: 1px solid rgba(255,255,255,0.06);
}
#status-row .status-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-label);
  color: var(--muted);
  opacity: 0.35;
  transition: opacity 0.4s;
}
#status-row .status-item.active {
  opacity: 1;
  color: var(--p28-success);
}
#status-row .status-item .status-icon {
  width: 28px;
  height: 28px;
  border-radius: 4px;
  background-size: cover;
  background-position: center;
  filter: grayscale(1);
  transition: filter 0.4s;
}
#status-row .status-item.active .status-icon {
  filter: grayscale(0);
}
#status-row .status-item .status-icon.icon-house {
  background-image: url(assets/img/p28-house.png);
}
#status-row .status-item .status-icon.icon-granary {
  background-image: url(assets/img/p28-granary.png);
}

/* result message */
#result-msg {
  text-align: center;
  font-size: var(--fs-sec);
  padding: 4px 0;
  min-height: 22px;
  font-weight: 600;
}
#result-msg.win {
  color: var(--p28-success);
}
#result-msg.lose {
  color: var(--p28-danger);
}

/* bottom controls */
#bottom-controls {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 10;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  background: linear-gradient(0deg, var(--p28-bg-dim) 60%, transparent);
  pointer-events: none;
}
#bottom-controls > * {
  pointer-events: auto;
}

#bottom-controls .btn {
  padding: 8px 20px;
  border: none;
  border-radius: 6px;
  font-size: var(--fs-label);
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  font-family: inherit;
}
#bottom-controls .btn:active {
  transform: scale(0.96);
}
#bottom-controls .btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  transform: none;
}
#bottom-controls .btn-sow {
  background: var(--p28-accent-gold);
  color: #1a1a2e;
}
#bottom-controls .btn-sow:not(:disabled):hover {
  opacity: 0.9;
}
#bottom-controls .btn-reset {
  background: rgba(255,255,255,0.08);
  color: var(--muted);
  border: 1px solid rgba(255,255,255,0.1);
}
#bottom-controls .btn-reset:hover {
  background: rgba(255,255,255,0.14);
}
#bottom-controls .sel-count {
  font-size: var(--fs-sec);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
#bottom-controls .sel-count .num {
  color: #fff;
  font-weight: 600;
}

/* process annotation */
#process-annotation {
  position: absolute;
  right: 356px;
  bottom: 72px;
  z-index: 5;
  text-align: center;
  pointer-events: none;
}
#process-annotation .cycle-line {
  font-size: 14px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.04em;
}
#process-annotation .cycle-line .arrow {
  display: inline-block;
  margin: 0 4px;
  color: var(--p28-accent-gold);
}
#process-annotation .cycle-note {
  font-size: 16px;
  color: rgba(255,255,255,0.3);
  font-style: italic;
  margin-top: 2px;
}
#process-annotation .causal-line {
  font-size: 16px;
  color: rgba(255,255,255,0.35);
  margin-top: 6px;
  max-width: 300px;
  line-height: 1.35;
}

/* generation counter in panel */
#gen-display {
  font-size: var(--fs-h2);
  font-weight: 700;
  color: var(--p28-accent-gold);
  text-align: center;
  padding: 4px 0;
}
#gen-display .gen-total {
  font-size: var(--fs-sec);
  color: var(--muted);
  font-weight: 400;
}

/* responsive adjustments */
@media (max-width: 1400px) {
  #data-panel { flex-basis: 280px; }
  #plant-grid { max-width: 660px; }
}
</style>
</head>
<body data-page="28" data-total="50">
<div id="stage">
<main id="main">
  <div id="bg-layer"></div>

  <div id="top-overlay">
    <div class="kicker">DOMESTICATION</div>
    <div class="ptitle">农业不是发明，是年年留种</div>
    <div class="instruction">每代选 3 株留种 → 点击穗部选中，再点「播种」</div>
  </div>

  <div id="content-area">
    <div id="field-area">
      <div id="plant-grid"></div>
    </div>
    <div id="data-panel">
      <div class="panel-title">世代数据</div>
      <div id="gen-display">第 <span id="gen-cur">0</span> <span class="gen-total">/ 8 代</span></div>
      <div class="stat-row">
        <span class="label">家庭人口</span>
        <span class="value" id="stat-family">5</span>
      </div>
      <div class="stat-row">
        <span class="label">收获</span>
        <span class="value" id="stat-harvest">0</span>
      </div>
      <div class="stat-row">
        <span class="label">需要</span>
        <span class="value" id="stat-need">15</span>
      </div>
      <div class="stat-row">
        <span class="label">剩余</span>
        <span class="value" id="stat-surplus">0</span>
      </div>

      <div class="chart-container">
        <div class="chart-label">不落粒比例</div>
        <div id="chart-shatter"></div>
      </div>
      <div class="chart-container">
        <div class="chart-label">平均穗大小</div>
        <div id="chart-size"></div>
      </div>

      <div id="status-row">
        <div class="status-item" id="status-settle">
          <div class="status-icon icon-house"></div>
          <span>定居</span>
        </div>
        <div class="status-item" id="status-surplus">
          <div class="status-icon icon-granary"></div>
          <span>剩余</span>
        </div>
      </div>

      <div id="result-msg"></div>
    </div>
  </div>

  <div id="process-annotation">
    <div class="cycle-line">
      <span class="arrow">←</span> 采集 <span class="arrow">→</span> 留种 <span class="arrow">→</span> 播种 <span class="arrow">→</span> 再采集 <span class="arrow">→</span>
    </div>
    <div class="cycle-note">无意识选择——每次选的只是来年的口粮</div>
    <div class="causal-line">驯化让人定居，定居与剩余让人口增长</div>
  </div>

  <div id="bottom-controls">
    <button class="btn btn-reset" id="btn-reset">↺ 重置</button>
    <span class="sel-count">已选：<span class="num" id="sel-count">0</span> / 3</span>
    <button class="btn btn-sow" id="btn-sow" disabled>播种</button>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function(){
  'use strict';

  /* ── 本页专用模拟参数，非全套口径 ── */
  var P28 = {
    N_PLANTS: 12,
    SELECT_N: 3,
    GENERATIONS: 8,
    SEED_SMALL: 4,
    SEED_MEDIUM: 5,
    SEED_LARGE: 6,
    SHATTER_LOSS: 0.8,
    FOOD_PER_PERSON: 3,
    FAMILY_START: 5,
    FAMILY_CAP: 15,
    SETTLE_CONSECUTIVE_SURPLUS: 2,
    SURPLUS_GRANARY: 4,
    MUTATE_RATE: 0.2
  };

  /* ── DOM refs ── */
  var gridEl = document.getElementById('plant-grid');
  var genCur = document.getElementById('gen-cur');
  var statFamily = document.getElementById('stat-family');
  var statHarvest = document.getElementById('stat-harvest');
  var statNeed = document.getElementById('stat-need');
  var statSurplus = document.getElementById('stat-surplus');
  var selCount = document.getElementById('sel-count');
  var btnSow = document.getElementById('btn-sow');
  var btnReset = document.getElementById('btn-reset');
  var resultMsg = document.getElementById('result-msg');
  var statusSettle = document.getElementById('status-settle');
  var statusSurplus = document.getElementById('status-surplus');

  var chartShatter = document.getElementById('chart-shatter');
  var chartSize = document.getElementById('chart-size');

  /* ── Game state ── */
  var G = {};

  function initState() {
    G.generation = 0;
    G.plants = [];
    G.selected = [];
    G.familySize = P28.FAMILY_START;
    G.history = {
      nonShatterRatio: [],
      avgSpikeSize: [],
      population: [P28.FAMILY_START]
    };
    G.consecutiveSurplus = 0;
    G.settled = false;
    G.surplus = false;
    G.gameOver = false;
    G.won = false;
    G.harvestThisGen = 0;
    G.surplusThisGen = 0;

    // Initial: 9 shatter-small, 3 non-shatter-medium
    for (var i = 0; i < P28.N_PLANTS; i++) {
      G.plants.push({
        shatter: i < 9,
        size: i < 9 ? 0 : 1, // 0=small, 1=medium, 2=large
        id: i
      });
    }
  }

  /* ── Plant SVG drawing ── */
  function plantSVG(plant, selected) {
    var w = 60, h = 100;
    var stemColor = '#5a8a3c';
    var grainColor = '#c4a35a';
    var grainColor2 = '#b8953a';
    var fallColor = 'rgba(196, 163, 90, 0.6)';

    var size = plant.size; // 0,1,2
    var shatter = plant.shatter;

    // grain counts per size
    var grains = size === 0 ? 3 : (size === 1 ? 5 : 7);
    var grainR = size === 0 ? 3 : (size === 1 ? 3.5 : 4);

    // stem curve
    var cx = 30, cy = 90;
    var stem = 'M' + cx + ',' + cy + ' Q' + (cx-4) + ',' + (cy-30) + ' ' + cx + ',' + (cy-70);

    // build grain positions
    var grainPositions = [];
    var startY = 18;
    for (var g = 0; g < grains; g++) {
      var side = g % 2 === 0 ? -1 : 1;
      var offsetY = startY + g * 3;
      grainPositions.push({ x: cx + side * (5 + (g%3)*1.5), y: offsetY });
    }

    var lines = [];
    lines.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 100" width="60" height="100">');

    // stem
    lines.push('<path d="' + stem + '" stroke="' + stemColor + '" stroke-width="2.5" fill="none"/>');

    // leaves
    lines.push('<path d="M30,70 Q20,60 15,65" stroke="' + stemColor + '" stroke-width="1.5" fill="none"/>');
    lines.push('<path d="M30,55 Q40,45 45,50" stroke="' + stemColor + '" stroke-width="1.5" fill="none"/>');

    // spike head - awn lines
    for (var g = 0; g < grainPositions.length; g++) {
      var p = grainPositions[g];
      var awnLen = 8 + (g % 2) * 4;
      var awnDir = p.x < cx ? -1 : 1;
      lines.push('<line x1="' + p.x + '" y1="' + (p.y - grainR) + '" x2="' + (p.x + awnDir * awnLen) + '" y2="' + (p.y - grainR - 6) + '" stroke="' + grainColor2 + '" stroke-width="1" opacity="0.6"/>');
    }

    // grains
    var visibleGrains = shatter ? Math.max(1, Math.floor(grains * 0.6)) : grains;
    var fallingGrains = shatter ? grains - visibleGrains : 0;

    for (var g = 0; g < visibleGrains; g++) {
      var p = grainPositions[g];
      lines.push('<ellipse cx="' + p.x + '" cy="' + p.y + '" rx="' + (grainR * 0.7) + '" ry="' + grainR + '" fill="' + grainColor + '" stroke="' + grainColor2 + '" stroke-width="0.5"/>');
    }

    // falling grains (for shattering)
    if (shatter && fallingGrains > 0) {
      for (var f = 0; f < fallingGrains; f++) {
        var fx = cx + (f % 2 === 0 ? -1 : 1) * (8 + f * 4);
        var fy = 40 + f * 8;
        lines.push('<circle cx="' + fx + '" cy="' + fy + '" r="' + (grainR * 0.5) + '" fill="' + fallColor + '"/>');
        // trajectory line
        lines.push('<line x1="' + grainPositions[visibleGrains + f].x + '" y1="' + (grainPositions[visibleGrains + f].y + 2) + '" x2="' + fx + '" y2="' + fy + '" stroke="' + fallColor + '" stroke-width="0.5" stroke-dasharray="2,2"/>');
      }
    }

    // selection indicator
    if (selected) {
      lines.push('<rect x="2" y="2" width="56" height="96" rx="4" fill="none" stroke="' + '#4f6ef2' + '" stroke-width="2" opacity="0.8"/>');
    }

    // size indicator text
    var sizeLabels = ['小穗', '中穗', '大穗'];
    lines.push('<text x="30" y="96" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.35)">' + sizeLabels[size] + (shatter ? '·落' : '·固') + '</text>');

    lines.push('</svg>');
    return lines.join('\n');
  }

  /* ── Render grid ── */
  function renderGrid(animate) {
    gridEl.innerHTML = '';
    for (var i = 0; i < P28.N_PLANTS; i++) {
      var plant = G.plants[i];
      var cell = document.createElement('div');
      cell.className = 'plant-cell' + (G.selected.indexOf(i) !== -1 ? ' selected' : '');
      cell.dataset.index = i;

      var wrap = document.createElement('div');
      wrap.className = 'plant-svg-wrap';
      wrap.innerHTML = plantSVG(plant, G.selected.indexOf(i) !== -1);
      cell.appendChild(wrap);

      cell.addEventListener('click', (function(idx) {
        return function() { onPlantClick(idx); };
      })(i));

      if (G.gameOver) {
        cell.style.cursor = 'default';
      }

      gridEl.appendChild(cell);

      // GSAP entry animation
      if (animate) {
        gsap.fromTo(cell, { scale: 0.3, opacity: 0 }, {
          scale: 1, opacity: 1,
          duration: 0.4,
          delay: i * 0.04,
          ease: 'back.out(1.2)'
        });
      }
    }
  }

  /* ── Plant click handler ── */
  function onPlantClick(idx) {
    if (G.gameOver) return;

    var pos = G.selected.indexOf(idx);
    if (pos !== -1) {
      // deselect
      G.selected.splice(pos, 1);
    } else {
      if (G.selected.length >= P28.SELECT_N) return;
      G.selected.push(idx);
    }

    updateUI();
  }

  /* ── Data panel update ── */
  function updateUI() {
    selCount.textContent = G.selected.length;
    btnSow.disabled = G.selected.length !== P28.SELECT_N || G.gameOver;

    genCur.textContent = G.generation;
    statFamily.textContent = G.familySize;

    // compute harvest & need
    var totalHarvest = 0;
    for (var i = 0; i < P28.N_PLANTS; i++) {
      var p = G.plants[i];
      var base = p.size === 0 ? P28.SEED_SMALL : (p.size === 1 ? P28.SEED_MEDIUM : P28.SEED_LARGE);
      var actual = p.shatter ? Math.round(base * (1 - P28.SHATTER_LOSS)) : base;
      totalHarvest += actual;
    }
    var need = G.familySize * P28.FOOD_PER_PERSON;
    var surplus = totalHarvest - need;

    G.harvestThisGen = totalHarvest;
    G.surplusThisGen = surplus;

    statHarvest.textContent = totalHarvest;
    statNeed.textContent = need;
    statSurplus.textContent = (surplus >= 0 ? '+' : '') + surplus;
    statSurplus.className = 'value' + (surplus >= 0 ? ' positive' : ' negative');

    // status icons
    if (G.settled) {
      statusSettle.classList.add('active');
    }
    if (G.surplus) {
      statusSurplus.classList.add('active');
    }

    // result message
    if (G.gameOver) {
      if (G.won) {
        resultMsg.textContent = '✅ 驯化成功！8 代后家业兴旺，人口增长。';
        resultMsg.className = 'win';
      } else {
        resultMsg.textContent = '❌ 人口归零，部落消亡。重新开始？';
        resultMsg.className = 'lose';
      }
    } else {
      resultMsg.textContent = '';
      resultMsg.className = '';
    }

    // update charts
    drawCharts();
  }

  /* ── d3 Charts ── */
  var chartInstances = {};

  function drawCharts() {
    drawShatterChart();
    drawSizeChart();
  }

  function drawShatterChart() {
    var data = G.history.nonShatterRatio;
    var container = d3.select(chartShatter);
    container.selectAll('*').remove();

    var w = chartShatter.clientWidth || 280;
    var h = 72;
    var margin = { top: 4, right: 4, bottom: 16, left: 28 };
    var iw = w - margin.left - margin.right;
    var ih = h - margin.top - margin.bottom;

    if (data.length === 0) {
      container.append('text').attr('x', 4).attr('y', 14).attr('fill', 'rgba(255,255,255,0.15)').attr('font-size', '12px').text('等待数据…');
      return;
    }

    var svg = container.append('svg').attr('width', w).attr('height', h);
    var g = svg.append('g').attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');

    var x = d3.scaleLinear().domain([0, P28.GENERATIONS]).range([0, iw]);
    var y = d3.scaleLinear().domain([0, 100]).range([ih, 0]);

    // grid lines
    g.append('line').attr('x1', 0).attr('y1', y(0)).attr('x2', iw).attr('y2', y(0)).attr('stroke', 'rgba(255,255,255,0.05)');
    g.append('line').attr('x1', 0).attr('y1', y(50)).attr('x2', iw).attr('y2', y(50)).attr('stroke', 'rgba(255,255,255,0.05)');
    g.append('line').attr('x1', 0).attr('y1', y(100)).attr('x2', iw).attr('y2', y(100)).attr('stroke', 'rgba(255,255,255,0.05)');

    // axis
    var xAxis = d3.axisBottom(x).ticks(P28.GENERATIONS).tickFormat(d3.format('d'));
    g.append('g').attr('transform', 'translate(0,' + ih + ')').call(xAxis).selectAll('text').attr('fill', 'rgba(255,255,255,0.3)').attr('font-size', '12px');
    g.selectAll('.domain, .tick line').attr('stroke', 'rgba(255,255,255,0.08)');

    // line
    var line = d3.line()
      .x(function(d, i) { return x(i); })
      .y(function(d) { return y(d); })
      .curve(d3.curveMonotoneX);

    g.append('path')
      .datum(data)
      .attr('fill', 'none')
      .attr('stroke', '#4ade80')
      .attr('stroke-width', 2)
      .attr('d', line);

    // dots
    g.selectAll('circle')
      .data(data)
      .join('circle')
      .attr('cx', function(d, i) { return x(i); })
      .attr('cy', function(d) { return y(d); })
      .attr('r', 2.5)
      .attr('fill', '#4ade80');
  }

  function drawSizeChart() {
    var data = G.history.avgSpikeSize;
    var container = d3.select(chartSize);
    container.selectAll('*').remove();

    var w = chartSize.clientWidth || 280;
    var h = 72;
    var margin = { top: 4, right: 4, bottom: 16, left: 28 };
    var iw = w - margin.left - margin.right;
    var ih = h - margin.top - margin.bottom;

    if (data.length === 0) {
      container.append('text').attr('x', 4).attr('y', 14).attr('fill', 'rgba(255,255,255,0.15)').attr('font-size', '12px').text('等待数据…');
      return;
    }

    var svg = container.append('svg').attr('width', w).attr('height', h);
    var g = svg.append('g').attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');

    var x = d3.scaleLinear().domain([0, P28.GENERATIONS]).range([0, iw]);
    var y = d3.scaleLinear().domain([0, 2]).range([ih, 0]);

    // grid lines
    g.append('line').attr('x1', 0).attr('y1', y(0)).attr('x2', iw).attr('y2', y(0)).attr('stroke', 'rgba(255,255,255,0.05)');
    g.append('line').attr('x1', 0).attr('y1', y(1)).attr('x2', iw).attr('y2', y(1)).attr('stroke', 'rgba(255,255,255,0.05)');
    g.append('line').attr('x1', 0).attr('y1', y(2)).attr('x2', iw).attr('y2', y(2)).attr('stroke', 'rgba(255,255,255,0.05)');

    // y-axis labels
    g.append('text').attr('x', -4).attr('y', y(0)).attr('text-anchor', 'end').attr('fill', 'rgba(255,255,255,0.2)').attr('font-size', '12px').attr('dy', '0.3em').text('小');
    g.append('text').attr('x', -4).attr('y', y(1)).attr('text-anchor', 'end').attr('fill', 'rgba(255,255,255,0.2)').attr('font-size', '12px').attr('dy', '0.3em').text('中');
    g.append('text').attr('x', -4).attr('y', y(2)).attr('text-anchor', 'end').attr('fill', 'rgba(255,255,255,0.2)').attr('font-size', '12px').attr('dy', '0.3em').text('大');

    // x axis
    var xAxis = d3.axisBottom(x).ticks(P28.GENERATIONS).tickFormat(d3.format('d'));
    g.append('g').attr('transform', 'translate(0,' + ih + ')').call(xAxis).selectAll('text').attr('fill', 'rgba(255,255,255,0.3)').attr('font-size', '12px');
    g.selectAll('.domain, .tick line').attr('stroke', 'rgba(255,255,255,0.08)');

    var line = d3.line()
      .x(function(d, i) { return x(i); })
      .y(function(d) { return y(d); })
      .curve(d3.curveMonotoneX);

    g.append('path')
      .datum(data)
      .attr('fill', 'none')
      .attr('stroke', '#d4b06a')
      .attr('stroke-width', 2)
      .attr('d', line);

    g.selectAll('circle')
      .data(data)
      .join('circle')
      .attr('cx', function(d, i) { return x(i); })
      .attr('cy', function(d) { return y(d); })
      .attr('r', 2.5)
      .attr('fill', '#d4b06a');
  }

  /* ── Next generation ── */
  function nextGeneration() {
    if (G.selected.length !== P28.SELECT_N) return;

    // Record history for current generation
    var nonShatterCount = 0;
    var totalSize = 0;
    for (var i = 0; i < P28.N_PLANTS; i++) {
      if (!G.plants[i].shatter) nonShatterCount++;
      totalSize += G.plants[i].size;
    }
    G.history.nonShatterRatio.push(Math.round(nonShatterCount / P28.N_PLANTS * 100));
    G.history.avgSpikeSize.push(totalSize / P28.N_PLANTS);

    // Compute family changes
    var need = G.familySize * P28.FOOD_PER_PERSON;
    var surplus = G.harvestThisGen - need;

    if (surplus >= 0) {
      G.consecutiveSurplus++;
      G.familySize = Math.min(G.familySize + 1, P28.FAMILY_CAP);
    } else {
      G.consecutiveSurplus = 0;
      G.familySize = Math.max(G.familySize - 1, 0);
    }

    G.history.population.push(G.familySize);

    // Check settlement (settle = consecutive surplus >= 2)
    if (G.consecutiveSurplus >= P28.SETTLE_CONSECUTIVE_SURPLUS) {
      G.settled = true;
    }
    // Check surplus state
    if (surplus >= P28.SURPLUS_GRANARY) {
      G.surplus = true;
    }

    // Check game over
    if (G.familySize <= 0) {
      G.gameOver = true;
      G.won = false;
      updateUI();
      renderGrid(false);
      return;
    }

    // Advance generation
    G.generation++;

    if (G.generation >= P28.GENERATIONS) {
      // Check win condition
      G.gameOver = true;
      G.won = G.familySize >= 12;
      updateUI();
      renderGrid(false);
      return;
    }

    // Generate new plants from selected parents
    var parents = G.selected.map(function(idx) { return G.plants[idx]; });
    var newPlants = [];

    for (var i = 0; i < P28.N_PLANTS; i++) {
      var parent = parents[i % parents.length];
      var child = {
        shatter: parent.shatter,
        size: parent.size,
        id: i
      };

      // Mutation
      if (Math.random() < P28.MUTATE_RATE) {
        if (Math.random() < 0.5) {
          child.shatter = !child.shatter;
        } else {
          var delta = Math.random() < 0.5 ? 1 : -1;
          child.size = Math.max(0, Math.min(2, child.size + delta));
        }
      }

      newPlants.push(child);
    }

    G.plants = newPlants;
    G.selected = [];

    updateUI();
    renderGrid(true);
  }

  /* ── Reset ── */
  function resetAll() {
    initState();
    resultMsg.textContent = '';
    resultMsg.className = '';
    statusSettle.classList.remove('active');
    statusSurplus.classList.remove('active');
    updateUI();
    renderGrid(false);
  }

  /* ── Event binding ── */
  btnSow.addEventListener('click', function() {
    if (G.selected.length !== P28.SELECT_N || G.gameOver) return;

    // GSAP timeline: fade out current plants, then generate next
    var cells = gridEl.querySelectorAll('.plant-cell');
    var tl = gsap.timeline({
      onComplete: function() {
        nextGeneration();
      }
    });

    tl.to(cells, {
      scale: 0.5,
      opacity: 0,
      duration: 0.3,
      ease: 'power2.in',
      stagger: 0.02
    });
  });

  btnReset.addEventListener('click', resetAll);

  /* ── Keyboard support ── */
  btnSow.setAttribute('tabindex', '0');
  btnReset.setAttribute('tabindex', '0');

  btnSow.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      btnSow.click();
    }
  });
  btnReset.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      btnReset.click();
    }
  });

  // Plant cells get keyboard support via click simulation
  // (click on SVG elements handled by parent click)

  /* ── Init ── */
  function init() {
    // Set CSS vars for theme
    document.documentElement.style.setProperty('--bg', '#0b0e14');
    document.documentElement.style.setProperty('--text', '#e6e6e6');
    document.documentElement.style.setProperty('--font-sans', '"Noto Sans SC", system-ui, sans-serif');

    initState();
    updateUI();
    renderGrid(false);
  }

  // Wait for DOM
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
