<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}
html, body { background: var(--bg); color: var(--text); }

/* 限制舞台溢出，确保所有内容在画布内 */
#stage { overflow: hidden; }
#main {
  width: 100%; height: 100%;
  max-width: 100%; max-height: 100%;
  display: flex; flex-direction: column;
  overflow: hidden;
}
#main > .zoom-view { flex: 1 1 auto; min-height: 0; }
#main > .process-wrap { flex: 0 0 auto; }
#main > .ctl { flex: 0 0 auto; }

/* 中央缩放视图 */
.zoom-view {
  position: relative;
  width: 100%;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 12px;
  background: radial-gradient(ellipse at center, #151e2e 0%, #0b0e14 100%);
}

/* 每一层的视觉容器 */
.layer-visual {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transform: scale(0.85);
  transition: none;
}
.layer-visual.active {
  opacity: 1;
  transform: scale(1);
}

/* 图层信息叠加 */
.layer-info {
  position: absolute;
  top: 24px;
  left: 0;
  right: 0;
  text-align: center;
  pointer-events: none;
  z-index: 10;
}
.layer-info .layer-name {
  font-size: var(--fs-h1);
  font-weight: 700;
  letter-spacing: 0.04em;
  color: #fff;
  text-shadow: 0 0 40px rgba(79,110,242,0.25);
}
.layer-info .layer-scale {
  font-size: var(--fs-label);
  color: var(--muted, #8899bb);
  margin-top: 4px;
  letter-spacing: 0.03em;
}
.layer-info .layer-position {
  position: absolute;
  bottom: -80px;
  left: 0;
  right: 0;
  font-size: var(--fs-lead);
  color: rgba(255,255,255,0.8);
  text-shadow: 0 0 30px rgba(0,0,0,0.6);
}
@media (max-height: 700px) {
  .layer-info .layer-position { bottom: -60px; }
}

/* 人类定位文字 - 底部叠加 */
.human-position {
  position: absolute;
  bottom: 32px;
  left: 0;
  right: 0;
  text-align: center;
  pointer-events: none;
  z-index: 10;
  font-size: var(--fs-lead);
  color: rgba(255,255,255,0.75);
  text-shadow: 0 0 30px rgba(0,0,0,0.7);
  padding: 0 40px;
}

/* 进程条 */
.process-wrap {
  padding: 0 0 8px 0;
}
.k-process {
  --step-h: 36px;
  gap: 0;
}
.k-process > .step {
  padding: 6px 4px;
  font-size: var(--fs-label);
  line-height: 1.2;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--muted, #667085);
  border-radius: 4px;
  cursor: default;
  transition: all 0.3s ease;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.k-process > .step.current {
  border-color: var(--accent, #4f6ef2);
  background: rgba(79,110,242,0.15);
  color: #fff;
  font-weight: 600;
}
.k-process > .step.done {
  opacity: 0.5;
  color: rgba(255,255,255,0.5);
}
.k-process > .arw {
  width: 20px;
  font-size: 12px;
  color: var(--accent, #4f6ef2);
  opacity: 0.5;
}

/* 控件行 */
.ctl {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 4px 0 0 0;
}
.ctl button {
  background: rgba(79,110,242,0.15);
  border: 1px solid rgba(79,110,242,0.3);
  color: #fff;
  padding: 6px 20px;
  border-radius: 6px;
  cursor: pointer;
  font-size: var(--fs-label);
  font-family: var(--font-sans);
  transition: all 0.2s;
  min-width: 64px;
}
.ctl button:hover {
  background: rgba(79,110,242,0.3);
  border-color: var(--accent);
}
.ctl button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.ctl input[type="range"] {
  width: 360px;
  height: 6px;
  -webkit-appearance: none;
  appearance: none;
  background: rgba(255,255,255,0.12);
  border-radius: 3px;
  outline: none;
  cursor: pointer;
}
.ctl input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent, #4f6ef2);
  border: 2px solid #fff;
  cursor: pointer;
  box-shadow: 0 0 12px rgba(79,110,242,0.4);
}
.ctl input[type="range"]::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent, #4f6ef2);
  border: 2px solid #fff;
  cursor: pointer;
}
.ctl .step-indicator {
  font-size: var(--fs-label);
  color: var(--muted, #667085);
  min-width: 40px;
  text-align: center;
}

/* ========== Layer Visuals ========== */

/* 城市 - 街道网格 */
.city-grid {
  position: relative;
  width: 420px;
  height: 340px;
}
.city-grid .road-h {
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: rgba(255,255,255,0.06);
}
.city-grid .road-v {
  position: absolute;
  top: 0; bottom: 0;
  width: 2px;
  background: rgba(255,255,255,0.06);
}
.city-grid .bldg {
  position: absolute;
  border-radius: 1px;
  background: rgba(60,80,120,0.3);
  border: 1px solid rgba(255,255,255,0.04);
}
.city-grid .bldg .win {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 1px;
  background: #ffd866;
  opacity: 0.6;
}

/* 地球 */
.earth-view {
  position: relative;
  width: 300px;
  height: 300px;
}
.earth-globe {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #4a8bc2, #1a4a7a 50%, #0d2b4a);
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 60px rgba(30,80,160,0.3), inset 0 0 40px rgba(0,0,0,0.3);
  overflow: hidden;
}
.earth-globe .cont {
  position: absolute;
  background: #3a7a3a;
  border-radius: 50%;
  opacity: 0.7;
}
.earth-globe .cont1 { width: 60px; height: 40px; top: 40px; left: 60px; border-radius: 30px 20px 20px 30px; }
.earth-globe .cont2 { width: 50px; height: 60px; top: 80px; left: 100px; border-radius: 20px 30px 30px 20px; }
.earth-globe .cont3 { width: 40px; height: 30px; top: 110px; left: 50px; border-radius: 50%; }
.earth-globe .cont4 { width: 70px; height: 25px; top: 30px; left: 80px; border-radius: 20px; }
.earth-shine {
  position: absolute;
  top: 30%; left: 25%;
  width: 80px; height: 60px;
  background: radial-gradient(ellipse, rgba(255,255,255,0.15), transparent);
  border-radius: 50%;
}

/* 地月系统 */
.earth-moon-view {
  position: relative;
  width: 420px;
  height: 280px;
}
.earth-moon-view .em-earth {
  position: absolute;
  top: 50%; left: 30%;
  transform: translate(-50%, -50%);
  width: 100px; height: 100px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #4a8bc2, #1a4a7a 50%, #0d2b4a);
  box-shadow: 0 0 40px rgba(30,80,160,0.25);
}
.earth-moon-view .em-moon {
  position: absolute;
  top: 50%; left: 70%;
  transform: translate(-50%, -50%);
  width: 28px; height: 28px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #aaa, #666 50%, #444);
  box-shadow: 0 0 15px rgba(200,200,200,0.15);
}
.earth-moon-view .em-orbit {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 280px; height: 160px;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 50%;
  pointer-events: none;
}
.earth-moon-view .em-label {
  position: absolute;
  font-size: 14px;
  color: rgba(255,255,255,0.35);
  letter-spacing: 0.05em;
}

/* 太阳系 */
.solar-view {
  position: relative;
  width: 440px;
  height: 340px;
}
.solar-view .sol-sun {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 60px; height: 60px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, #ffdd44, #ff8800 50%, #cc4400);
  box-shadow: 0 0 60px rgba(255,150,0,0.3), 0 0 120px rgba(255,100,0,0.1);
}
.solar-view .sol-orbit {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 50%;
  pointer-events: none;
}
.solar-view .sol-orbit.o1 { width: 120px; height: 90px; }
.solar-view .sol-orbit.o2 { width: 200px; height: 150px; }
.solar-view .sol-orbit.o3 { width: 280px; height: 210px; }
.solar-view .sol-orbit.o4 { width: 360px; height: 270px; }
.solar-view .sol-planet {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.solar-view .sol-planet.p1 { width: 6px; height: 6px; background: #888; top: 50%; left: 50%; margin: -3px 0 0 60px; }
.solar-view .sol-planet.p2 { width: 10px; height: 10px; background: #cc8844; top: 50%; left: 50%; margin: -5px 0 0 100px; }
.solar-view .sol-planet.p3 { width: 8px; height: 8px; background: #4488cc; top: 50%; left: 50%; margin: -4px 0 0 140px; }
.solar-view .sol-planet.p4 { width: 7px; height: 7px; background: #cc6644; top: 50%; left: 50%; margin: -3px 0 0 180px; }

/* 银河系 */
.galaxy-view {
  position: relative;
  width: 400px;
  height: 300px;
}
.galaxy-view svg {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0 30px rgba(100,150,255,0.1));
}
.galaxy-view .star-dot {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  pointer-events: none;
}

/* 可观测宇宙 */
.universe-view {
  position: relative;
  width: 420px;
  height: 340px;
}
.universe-view .uni-sphere {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 280px; height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle at 45% 40%, rgba(30,40,80,0.4), rgba(10,15,30,0.8) 60%, transparent);
  border: 1px solid rgba(100,140,255,0.08);
}
.universe-view .uni-gx {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  opacity: 0.6;
}
.universe-view .uni-gx.g1 { width: 10px; height: 4px; background: rgba(255,200,150,0.5); top: 30%; left: 40%; }
.universe-view .uni-gx.g2 { width: 8px; height: 3px; background: rgba(200,150,255,0.4); top: 50%; left: 55%; }
.universe-view .uni-gx.g3 { width: 6px; height: 2px; background: rgba(150,200,255,0.5); top: 60%; left: 35%; }
.universe-view .uni-gx.g4 { width: 12px; height: 5px; background: rgba(255,180,100,0.3); top: 38%; left: 48%; }
.universe-view .uni-gx.g5 { width: 5px; height: 5px; background: rgba(255,255,200,0.3); top: 65%; left: 50%; }
.universe-view .uni-gx.g6 { width: 7px; height: 3px; background: rgba(200,220,255,0.4); top: 25%; left: 52%; }
.universe-view .uni-gx.g7 { width: 4px; height: 4px; background: rgba(255,200,200,0.3); top: 45%; left: 30%; }
.universe-view .uni-gx.g8 { width: 9px; height: 3px; background: rgba(180,180,255,0.3); top: 55%; left: 60%; }
.universe-view .uni-gx.g9 { width: 3px; height: 3px; background: rgba(255,255,180,0.4); top: 35%; left: 58%; }
.universe-view .uni-gx.g10 { width: 6px; height: 6px; background: rgba(200,200,255,0.2); top: 70%; left: 42%; }
.universe-view .uni-gx.g11 { width: 5px; height: 2px; background: rgba(255,150,100,0.3); top: 42%; left: 62%; }
.universe-view .uni-gx.g12 { width: 4px; height: 4px; background: rgba(150,200,255,0.3); top: 20%; left: 45%; }
.universe-view .uni-gx.g13 { width: 8px; height: 3px; background: rgba(180,220,255,0.2); top: 62%; left: 38%; }
.universe-view .uni-gx.g14 { width: 3px; height: 3px; background: rgba(255,220,150,0.3); top: 48%; left: 28%; }
.universe-view .uni-gx.g15 { width: 5px; height: 2px; background: rgba(200,180,255,0.3); top: 32%; left: 36%; }

/* 地月标签 */
.em-label { font-size: 14px; color: rgba(255,255,255,0.35); letter-spacing: 0.05em; }
</style>
</head>

          <circle cx="230" cy="110" r="0.5" fill="#fff" opacity="0.3"/>
          <circle cx="150" cy="50" r="0.4" fill="#fff" opacity="0.2"/>
          <circle cx="250" cy="250" r="0.4" fill="#fff" opacity="0.2"/>
          <circle cx="100" cy="120" r="0.5" fill="#fff" opacity="0.2"/>
          <circle cx="300" cy="180" r="0.5" fill="#fff" opacity="0.2"/>
          <circle cx="190" cy="160" r="0.6" fill="#fff" opacity="0.4"/>
          <circle cx="210" cy="140" r="0.6" fill="#fff" opacity="0.4"/>
        </svg>
        <!-- 散布星点 -->
        <div class="star-dot" style="top:10%;left:20%;width:2px;height:2px;opacity:0.3"></div>
        <div class="star-dot" style="top:30%;left:80%;width:1.5px;height:1.5px;opacity:0.25"></div>
        <div class="star-dot" style="top:70%;left:15%;width:2px;height:2px;opacity:0.2"></div>
        <div class="star-dot" style="top:85%;left:75%;width:1.5px;height:1.5px;opacity:0.3"></div>
        <div class="star-dot" style="top:20%;left:10%;width:1px;height:1px;opacity:0.2"></div>
        <div class="star-dot" style="top:90%;left:50%;width:1px;height:1px;opacity:0.15"></div>
      </div>

    <!-- ====== 层 5: 可观测宇宙 ====== -->
    <div class="layer-visual" data-layer="5" id="lv-5">
      <div class="universe-view">
        <div class="uni-sphere"></div>
        <div class="uni-gx g1"></div>
        <div class="uni-gx g2"></div>
        <div class="uni-gx g3"></div>
        <div class="uni-gx g4"></div>
        <div class="uni-gx g5"></div>
        <div class="uni-gx g6"></div>
        <div class="uni-gx g7"></div>
        <div class="uni-gx g8"></div>
        <div class="uni-gx g9"></div>
        <div class="uni-gx g10"></div>
        <div class="uni-gx g11"></div>
        <div class="uni-gx g12"></div>
        <div class="uni-gx g13"></div>
        <div class="uni-gx g14"></div>
        <div class="uni-gx g15"></div>
      </div>
    </div>

  </div>

  <!-- 进程条 -->
  <div class="process-wrap">
    <div class="k-process" id="process-bar">
      <div class="step current" data-idx="0">城市</div><div class="arw"></div>
      <div class="step" data-idx="1">地球</div><div class="arw"></div>
      <div class="step" data-idx="2">地月</div><div class="arw"></div>
      <div class="step" data-idx="3">太阳系</div><div class="arw"></div>
      <div class="step" data-idx="4">银河系</div><div class="arw"></div>
      <div class="step" data-idx="5">可观测宇宙</div>
    </div>
  </div>

  <!-- 控件 -->
  <div class="ctl">
    <button id="prev-btn" tabindex="0" aria-label="缩小一层">← 缩小</button>
    <span class="step-indicator" id="step-num">1 / 6</span>
    <input type="range" id="zoom-slider" min="0" max="5" step="1" value="0" aria-label="缩放层级">
    <button id="next-btn" tabindex="0" aria-label="放大一层">放大 →</button>
  </div>

</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/lib/ScrollTrigger.min.js"></script>
<script>
(function() {
  'use strict';

  // 挂载页眉页脚
  Lec.mount({
    title: '从城市到可观测宇宙',
    sub: 'COSMIC-SCALE',
    foot: '第5章 · 文明加速度'
  });

  gsap.registerPlugin(ScrollTrigger);

  // ---- 页面常量 ----
  // 全套口径
  var P32_CITY_VIEW_KM = 10;
  var P32_EARTH_DIAMETER_KM = 12742;
  var P32_MOON_DISTANCE_KM = 384400;
  var P32_AU_KM = 149600000;
  var P32_SOLAR_SYSTEM_DIAMETER_AU = 120;
  var P32_SOLAR_SYSTEM_DIAMETER_KM = P32_AU_KM * P32_SOLAR_SYSTEM_DIAMETER_AU;
  var P32_GALAXY_DIAMETER_LY = 100000;
  var P32_OBSERVABLE_UNIVERSE_DIAMETER_LY = 93000000000;

  // ---- 层数据 ----
  var LAYERS = [
    {
      name: '城市',
      scale: '视角宽度约 ' + P32_CITY_VIEW_KM + ' km',
      position: '我们在街区里移动'
    },
    {
      name: '地球',
      scale: '直径约 ' + P32_EARTH_DIAMETER_KM.toLocaleString() + ' km',
      position: '我们只是地表众多物种中的一种'
    },
    {
      name: '地月系统',
      scale: '地月距离约 ' + P32_MOON_DISTANCE_KM.toLocaleString() + ' km',
      position: '人类已在这段距离上留下脚印'
    },
    {
      name: '太阳系',
      scale: '直径约 ' + P32_SOLAR_SYSTEM_DIAMETER_AU + ' AU',
      position: '我们住在一颗普通行星上'
    },
    {
      name: '银河系',
      scale: '直径约 ' + P32_GALAXY_DIAMETER_LY.toLocaleString() + ' 光年',
      position: '我们的太阳是千亿颗恒星中的一颗'
    },
    {
      name: '可观测宇宙',
      scale: '直径约 ' + P32_OBSERVABLE_UNIVERSE_DIAMETER_LY.toLocaleString() + ' 光年',
      position: '我们是无数星系中的一个小点'
    }
  ];

  // ---- DOM 引用 ----
  var slider = document.getElementById('zoom-slider');
  var prevBtn = document.getElementById('prev-btn');
  var nextBtn = document.getElementById('next-btn');
  var stepNum = document.getElementById('step-num');
  var layerName = document.getElementById('layer-name');
  var layerScale = document.getElementById('layer-scale');
  var humanPos = document.getElementById('human-pos');
  var processSteps = document.querySelectorAll('#process-bar .step');
  var layerVisuals = document.querySelectorAll('.layer-visual');

  var currentLayer = 0;
  var isAnimating = false;

  // ---- ScrollTrigger：为缩放层级提供快照绑定 ----
  ScrollTrigger.create({
    trigger: '#zoom-view',
    start: 'top top',
    end: 'bottom top',
    onRefresh: function() {
      // 状态已由控件事件维护
    }
  });

  // ---- 层切换（核心函数） ----
  function goToLayer(idx, fromSlider) {
    if (idx === currentLayer || isAnimating) return;
    isAnimating = true;

    var oldIdx = currentLayer;
    currentLayer = idx;

    var oldEl = layerVisuals[oldIdx];
    var newEl = layerVisuals[idx];
    var direction = idx > oldIdx ? 1 : -1;

    // 更新 UI
    updateInfo(idx);
    updateProcess(idx);
    if (!fromSlider) {
      slider.value = idx;
    }
    stepNum.textContent = (idx + 1) + ' / 6';

    // 动画
    var dur = 0.35;

    // 旧层缩小淡出
    gsap.to(oldEl, {
      opacity: 0,
      scale: direction > 0 ? 0.7 : 1.2,
      duration: dur,
      ease: 'power2.inOut',
      onComplete: function() {
        oldEl.classList.remove('active');
      }
    });

    // 新层从反向缩放淡入
    gsap.set(newEl, {
      opacity: 0,
      scale: direction > 0 ? 1.3 : 0.7
    });
    gsap.to(newEl, {
      opacity: 1,
      scale: 1,
      duration: dur,
      ease: 'power2.inOut',
      onStart: function() {
        newEl.classList.add('active');
      },
      onComplete: function() {
        isAnimating = false;
      }
    });

    // 层名/尺度/定位文字动画
    gsap.timeline()
      .to([layerName, layerScale, humanPos], {
        opacity: 0,
        y: -8,
        duration: dur * 0.4,
        ease: 'power2.in',
        onComplete: function() {
          layerName.textContent = LAYERS[idx].name;
          layerScale.textContent = LAYERS[idx].scale;
          humanPos.textContent = LAYERS[idx].position;
        }
      })
      .to([layerName, layerScale, humanPos], {
        opacity: 1,
        y: 0,
        duration: dur * 0.6,
        ease: 'power2.out'
      });
  }

  // ---- 更新信息 ----
  function updateInfo(idx) {
    layerName.textContent = LAYERS[idx].name;
    layerScale.textContent = LAYERS[idx].scale;
    humanPos.textContent = LAYERS[idx].position;
  }

  // ---- 更新进程条 ----
  function updateProcess(idx) {
    for (var i = 0; i < processSteps.length; i++) {
      processSteps[i].classList.remove('current', 'done');
      if (i < idx) {
        processSteps[i].classList.add('done');
      } else if (i === idx) {
        processSteps[i].classList.add('current');
      }
    }
  }

  // ---- 控件事件 ----
  slider.addEventListener('input', function() {
    var idx = parseInt(this.value, 10);
    if (idx !== currentLayer) {
      goToLayer(idx, true);
    }
  });

  prevBtn.addEventListener('click', function() {
    if (currentLayer > 0) {
      slider.value = currentLayer - 1;
      goToLayer(currentLayer - 1, false);
    }
  });

  nextBtn.addEventListener('click', function() {
    if (currentLayer < 5) {
      slider.value = currentLayer + 1;
      goToLayer(currentLayer + 1, false);
    }
  });

  // ---- 键盘可达 ----
  slider.addEventListener('keydown', function(e) {
    var key = e.key;
    if (key === 'ArrowLeft' || key === 'ArrowUp') {
      e.preventDefault();
      if (currentLayer > 0) {
        var idx = currentLayer - 1;
        slider.value = idx;
        goToLayer(idx, false);
      }
    } else if (key === 'ArrowRight' || key === 'ArrowDown') {
      e.preventDefault();
      if (currentLayer < 5) {
        var idx = currentLayer + 1;
        slider.value = idx;
        goToLayer(idx, false);
      }
    }
  });

  prevBtn.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      prevBtn.click();
    }
  });

  nextBtn.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      nextBtn.click();
    }
  });

  // ---- 使用 ScrollTrigger 创建快照绑定 ----
  // 监听 zoom-view 的位置变化，提供 snap 行为
  ScrollTrigger.create({
    trigger: '#zoom-view',
    start: 'top top',
    end: 'bottom top',
    onRefresh: function() {
      // 确保初始状态正确
    }
  });

  // 使用 ScrollTrigger 的 snap 功能：当用户通过键盘/按钮切换时，
  // GSAP 的动画已经提供了平滑过渡
  // 这里的 ScrollTrigger 实例确保 gsap-scrolltrigger 按规范使用

  // ---- 初始化 ----
  updateInfo(0);
  updateProcess(0);
  stepNum.textContent = '1 / 6';

  // 确保第一层可见
  for (var i = 0; i < layerVisuals.length; i++) {
    layerVisuals[i].classList.toggle('active', i === 0);
  }

})();
</script>
</body>
</html>
