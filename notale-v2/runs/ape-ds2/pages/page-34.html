<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== page-34 specific ===== */
:root{
  --bg:        #0b0e14;
  --text:      #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
  --accent:    #6c8cff;
  --accent-soft: rgba(108,140,255,0.12);
  --muted:     #8892a8;
  --border:    #2a2f3a;
  --panel-bg:  #11161f;
  --focus:     #6c8cff;
}

/* override #main to fit within stage padding */
#main {
  width: 100%;
  height: 100%;
}

/* content area: 1408 × 620 */
.p34-root {
  display: flex;
  flex-direction: row;
  gap: 24px;
  width: 1408px;
  height: 620px;
  align-items: stretch;
}
.p34-left {
  flex: 6 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.p34-right {
  flex: 5 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* network container */
#net-wrap {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
#net-svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* slider */
.p34-ctl {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex-shrink: 0;
}
.p34-ctl input[type=range] {
  width: 100%;
  height: 6px;
  -webkit-appearance: none;
  appearance: none;
  background: linear-gradient(to right, var(--border), var(--accent));
  border-radius: 3px;
  outline: none;
  cursor: pointer;
}
.p34-ctl input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid #fff;
  cursor: pointer;
  box-shadow: 0 0 6px rgba(108,140,255,0.4);
}
.p34-ctl input[type=range]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid #fff;
  cursor: pointer;
}
.p34-ticks {
  display: flex;
  justify-content: space-between;
  font-size: var(--fs-label);
  color: var(--muted);
  padding: 0 2px;
}
.p34-ticks .tick {
  text-align: center;
  flex: 1;
}
.p34-ticks .tick.active {
  color: var(--accent);
  font-weight: 600;
}
.p34-rad-label {
  text-align: center;
  font-size: var(--fs-label);
  color: var(--accent);
  font-weight: 600;
  height: 20px;
  line-height: 20px;
}

/* right panel process */
.p34-process {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  position: relative;
  padding: 2px 0;
  gap: 0;
}
/* vertical connecting line */
.p34-process::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 26px;
  width: 2px;
  background: var(--border);
  z-index: 0;
}
.p34-step {
  position: relative;
  z-index: 1;
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 4px 10px 4px 44px;
  background: transparent;
  border-radius: 8px;
  border: 1px solid transparent;
  transition: all 0.3s ease;
}
.p34-step::before {
  content: "";
  position: absolute;
  left: 18px;
  top: 50%;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--border);
  border: 2px solid var(--bg);
  transform: translateY(-50%);
  transition: all 0.3s ease;
}
.p34-step.current {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.p34-step.current::before {
  background: var(--accent);
  box-shadow: 0 0 8px rgba(108,140,255,0.5);
}
.p34-step.done {
  opacity: 0.55;
}
.p34-step.done::before {
  background: var(--muted);
}
.p34-step .step-era {
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.05em;
  margin-bottom: 1px;
}
.p34-step .step-line {
  font-size: var(--fs-sec);
  color: var(--text);
  line-height: 1.35;
}
.p34-step.current .step-line {
  color: var(--text);
}
.p34-step .step-line .hl {
  color: var(--accent);
  font-weight: 600;
}
.p34-arrow {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  height: 28px;
  gap: 6px;
  color: var(--muted);
  font-size: var(--fs-tick);
  line-height: 1;
  flex-shrink: 0;
}
.p34-arrow .arw-mult {
  font-size: var(--fs-label);
  color: var(--accent);
  font-weight: 600;
}
.p34-arrow .arw-text {
  font-size: var(--fs-label);
  color: var(--muted);
}
.p34-arrow .arw-arrow {
  font-size: 14px;
  color: var(--accent);
  line-height: 1;
}

/*收束主张 */
.p34-take {
  border-top: 1px solid var(--border);
  padding: 6px 10px 2px 10px;
  font-size: var(--fs-sec);
  color: var(--muted);
  line-height: 1.4;
  text-align: center;
  flex-shrink: 0;
}
.p34-take strong {
  color: var(--accent);
  font-weight: 600;
}

/* network node/link styles */
.net-link {
  stroke: var(--border);
  stroke-width: 1.2;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.net-link.era-visible {
  opacity: 0.5;
}
.net-link.hub-link {
  stroke: var(--accent);
  stroke-width: 1.5;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.net-link.hub-link.era-visible {
  opacity: 0.6;
}
.net-link.global-link {
  stroke: #5a7aff;
  stroke-width: 0.8;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.net-link.global-link.era-visible {
  opacity: 0.35;
}
.net-node {
  cursor: pointer;
  transition: r 0.3s ease;
}
.net-cluster-label {
  font-size: 14px;
  fill: var(--muted);
  text-anchor: middle;
  font-weight: 500;
}
.net-radius-circle {
  fill: none;
  stroke: var(--accent);
  stroke-width: 1.5;
  stroke-dasharray: 4 3;
  opacity: 0.5;
  transition: all 0.4s ease;
}
.net-radius-label {
  font-size: 14px;
  fill: var(--muted);
  text-anchor: middle;
  opacity: 0.7;
}
</style>
</head>
<body data-page="34" data-total="50">
<div id="stage">
<main id="main">
<div class="p34-root">
  <!-- LEFT: network graph -->
  <div class="p34-left">
    <div id="net-wrap">
      <svg id="net-svg"></svg>
    </div>
    <div class="p34-ctl">
      <div class="p34-rad-label" id="rad-label">口头 · 半径约 10 km</div>
      <input type="range" id="era-slider" min="0" max="2" step="0.005" value="0" aria-label="信息传播时代选择">
      <div class="p34-ticks">
        <span class="tick active" data-era="0">口头</span>
        <span class="tick" data-era="1">文字</span>
        <span class="tick" data-era="2">电子网络</span>
      </div>
    </div>
  </div>

  <!-- RIGHT: process steps -->
  <div class="p34-right">
    <div class="p34-process" id="process-steps">
      <div class="p34-step current" data-era="0">
        <div class="step-era">口头传播</div>
        <div class="step-line"><span class="hl">媒介</span> 面对面言语</div>
        <div class="step-line"><span class="hl">半径</span> 约 10 km</div>
        <div class="step-line"><span class="hl">重排</span> 聚落、族群——当面信任决定社会</div>
      </div>
      <div class="p34-arrow" data-era="0">
        <span class="arw-mult" id="mult-1">半径 ×300</span>
        <span class="arw-arrow">↓</span>
        <span class="arw-text">半径每扩大一次，文明就重排一次</span>
      </div>
      <div class="p34-step" data-era="1">
        <div class="step-era">文字</div>
        <div class="step-line"><span class="hl">媒介</span> 文字，约 5000 年前起</div>
        <div class="step-line"><span class="hl">半径</span> 约 3,000 km</div>
        <div class="step-line"><span class="hl">重排</span> 法律、税收——帝国行政成为可能</div>
      </div>
      <div class="p34-arrow" data-era="1">
        <span class="arw-mult" id="mult-2">半径 ×13</span>
        <span class="arw-arrow">↓</span>
        <span class="arw-text">半径每扩大一次，文明就重排一次</span>
      </div>
      <div class="p34-step" data-era="2">
        <div class="step-era">电子网络</div>
        <div class="step-line"><span class="hl">媒介</span> 电子网络</div>
        <div class="step-line"><span class="hl">半径</span> 约 40,000 km</div>
        <div class="step-line"><span class="hl">重排</span> 全球同步协作——金融、供应链、即时新闻</div>
      </div>
    </div>
    <div class="p34-take">
      <strong>信息传播的半径每扩大一次，</strong>文明就重排成更大的连接网络——从血缘族群到帝国行政再到全球协作。<br>
      变的不是人，而是<strong>连接方式</strong>。
    </div>
  </div>
</div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
// ===== constants =====
var P34_ORAL_RADIUS_KM = 10;          // 全套口径：口头协调半径
var P34_WRITTEN_RADIUS_KM = 3e3;      // 全套口径：文字协调半径
var P34_ELECTRONIC_RADIUS_KM = 4e4;   // 全套口径：电子网络半径（地球周长约 4 万 km）

// computed multipliers
var MULT_1 = P34_WRITTEN_RADIUS_KM / P34_ORAL_RADIUS_KM;  // 300
var MULT_2 = P34_ELECTRONIC_RADIUS_KM / P34_WRITTEN_RADIUS_KM; // ~13.3

// update multiplier displays
document.getElementById('mult-1').textContent = '半径 ×' + Math.round(MULT_1);
document.getElementById('mult-2').textContent = '半径 ×' + Math.round(MULT_2);

// ===== Lec mount =====
Lec.mount({
  index: 34,
  kicker: '文明加速度',
  title: '信息半径每扩大一次，文明就重排一次',
  take: '信息传播的半径每扩大一次，文明就把自己重新组织成更大的连接网络——从血缘族群，到帝国行政，再到全球协作。变的从来不是人，而是连接方式。'
});

// ===== network data =====
var NUM_CLUSTERS = 5;
var NODES_PER_CLUSTER = 6;
var TOTAL_NODES = NUM_CLUSTERS * NODES_PER_CLUSTER;

// cluster colors
var CLUSTER_COLORS = ['#6c8cff', '#5ce0b0', '#f0c45a', '#ff7a7a', '#b07aff'];

// generate nodes with fixed positions
var nodes = [];
var cx = 340, cy = 255;
var ringR = 150;
var clusterLabels = ['聚落 A', '聚落 B', '聚落 C', '聚落 D', '聚落 E'];

// Use a simple seeded random for reproducibility
var seed = 42;
function seededRandom() {
  seed = (seed * 9301 + 49297) % 233280;
  return seed / 233280;
}

for (var c = 0; c < NUM_CLUSTERS; c++) {
  var angle = (c / NUM_CLUSTERS) * Math.PI * 2 - Math.PI / 2;
  var ccx = cx + ringR * Math.cos(angle);
  var ccy = cy + ringR * Math.sin(angle);
  for (var n = 0; n < NODES_PER_CLUSTER; n++) {
    var a2 = (n / NODES_PER_CLUSTER) * Math.PI * 2 + seededRandom() * 0.4;
    var r2 = 16 + seededRandom() * 22;
    nodes.push({
      id: 'n' + (c * NODES_PER_CLUSTER + n),
      cluster: c,
      x: ccx + r2 * Math.cos(a2),
      y: ccy + r2 * Math.sin(a2),
      label: null
    });
  }
}

// hub node at center
var hubNode = { id: 'hub', cluster: -1, x: cx, y: cy, label: '行政中枢' };

// generate links for each era
function genLinksOral() {
  var links = [];
  for (var c = 0; c < NUM_CLUSTERS; c++) {
    var idxs = [];
    for (var n = 0; n < NODES_PER_CLUSTER; n++) idxs.push(c * NODES_PER_CLUSTER + n);
    for (var i = 0; i < idxs.length; i++) {
      for (var j = i + 1; j < idxs.length; j++) {
        links.push({ source: idxs[i], target: idxs[j], type: 'cluster' });
      }
    }
  }
  return links;
}

function genLinksWritten() {
  var links = genLinksOral();
  for (var i = 0; i < TOTAL_NODES; i++) {
    links.push({ source: 'hub', target: i, type: 'hub' });
  }
  return links;
}

function genLinksElectronic() {
  var links = genLinksWritten();
  for (var c1 = 0; c1 < NUM_CLUSTERS; c1++) {
    for (var c2 = c1 + 1; c2 < NUM_CLUSTERS; c2++) {
      for (var n = 0; n < NODES_PER_CLUSTER; n++) {
        var i = c1 * NODES_PER_CLUSTER + n;
        for (var k = 0; k < 2; k++) {
          var j = c2 * NODES_PER_CLUSTER + ((n + k + 1) % NODES_PER_CLUSTER);
          links.push({ source: i, target: j, type: 'global' });
        }
      }
    }
  }
  return links;
}

var linksOral = genLinksOral();
var linksWritten = genLinksWritten();
var linksElectronic = genLinksElectronic();

// ===== d3 drawing =====
var svg = d3.select('#net-svg');
var wrap = document.getElementById('net-wrap');

var W, H, g;

function resizeNet() {
  W = wrap.clientWidth;
  H = wrap.clientHeight;
  svg.attr('viewBox', '0 0 ' + W + ' ' + H);
  g = svg.select('g.main-group');
  if (g.empty()) {
    g = svg.append('g').attr('class', 'main-group');
  }
}

resizeNet();

// groups
var radiusGroup = g.append('g').attr('class', 'radius-group');
var linkGroup = g.append('g').attr('class', 'link-group');
var nodeGroup = g.append('g').attr('class', 'node-group');
var labelGroup = g.append('g').attr('class', 'label-group');

// radius circles
var rOral = 50;
var rWritten = 140;
var rElectronic = Math.min(W, H) * 0.4;

var radiusCircle = radiusGroup.append('circle')
  .attr('class', 'net-radius-circle')
  .attr('cx', cx)
  .attr('cy', cy)
  .attr('r', rOral);

var radiusLabel = radiusGroup.append('text')
  .attr('class', 'net-radius-label')
  .attr('x', cx)
  .attr('y', cy - rOral - 6)
  .text('半径 10 km');

// build links
function buildLinksData(era) {
  if (era <= 0.5) return linksOral;
  if (era <= 1.5) return linksWritten;
  return linksElectronic;
}

// draw links
function drawLinks(era) {
  var links = buildLinksData(era);
  
  var linkSel = linkGroup.selectAll('line').data(links, function(d, i) {
    var s = (d.source && d.source.id) || d.source;
    var t = (d.target && d.target.id) || d.target;
    return s + '-' + t;
  });
  
  linkSel.exit().remove();
  
  var linkEnter = linkSel.enter().append('line')
    .attr('class', function(d) {
      if (d.type === 'hub') return 'net-link hub-link';
      if (d.type === 'global') return 'net-link global-link';
      return 'net-link';
    });
  
  linkSel.merge(linkEnter)
    .attr('x1', function(d) {
      var s = d.source;
      if (typeof s === 'number') return nodes[s].x;
      if (s.id === 'hub') return hubNode.x;
      return s.x || 0;
    })
    .attr('y1', function(d) {
      var s = d.source;
      if (typeof s === 'number') return nodes[s].y;
      if (s.id === 'hub') return hubNode.y;
      return s.y || 0;
    })
    .attr('x2', function(d) {
      var t = d.target;
      if (typeof t === 'number') return nodes[t].x;
      if (t.id === 'hub') return hubNode.x;
      return t.x || 0;
    })
    .attr('y2', function(d) {
      var t = d.target;
      if (typeof t === 'number') return nodes[t].y;
      if (t.id === 'hub') return hubNode.y;
      return t.y || 0;
    });
  
  updateLinkVisibility(era);
}

function updateLinkVisibility(era) {
  linkGroup.selectAll('line').each(function(d) {
    var el = d3.select(this);
    var visible = false;
    if (d.type === 'cluster') {
      visible = true;
    } else if (d.type === 'hub') {
      visible = era >= 0.5;
    } else if (d.type === 'global') {
      visible = era >= 1.5;
    }
    el.classed('era-visible', visible);
  });
}

// draw nodes
var nodeSel = nodeGroup.selectAll('circle.node').data(nodes, function(d) { return d.id; });
nodeSel.exit().remove();
var nodeEnter = nodeSel.enter().append('circle')
  .attr('class', 'net-node node');
nodeSel.merge(nodeEnter)
  .attr('cx', function(d) { return d.x; })
  .attr('cy', function(d) { return d.y; })
  .attr('r', 5)
  .attr('fill', function(d) { return CLUSTER_COLORS[d.cluster]; });

// hub node
var hubSel = nodeGroup.selectAll('circle.hub-node').data([hubNode]);
hubSel.exit().remove();
var hubEnter = hubSel.enter().append('circle')
  .attr('class', 'net-node hub-node');
hubSel.merge(hubEnter)
  .attr('cx', function(d) { return d.x; })
  .attr('cy', function(d) { return d.y; })
  .attr('fill', '#fff')
  .attr('stroke', 'var(--accent)')
  .attr('stroke-width', 2)
  .attr('r', 0)
  .attr('opacity', 0);

// cluster labels
var labelSel = labelGroup.selectAll('text.cluster-label').data(clusterLabels);
labelSel.exit().remove();
var labelEnter = labelSel.enter().append('text')
  .attr('class', 'net-cluster-label');
labelSel.merge(labelEnter)
  .attr('x', function(d, i) {
    var angle = (i / NUM_CLUSTERS) * Math.PI * 2 - Math.PI / 2;
    return cx + (ringR + 28) * Math.cos(angle);
  })
  .attr('y', function(d, i) {
    var angle = (i / NUM_CLUSTERS) * Math.PI * 2 - Math.PI / 2;
    return cy + (ringR + 28) * Math.sin(angle);
  })
  .text(function(d) { return d; });

// initial draw
drawLinks(0);
updateLinkVisibility(0);

// ===== slider state management =====
var slider = document.getElementById('era-slider');
var ticks = document.querySelectorAll('.p34-ticks .tick');
var radLabel = document.getElementById('rad-label');
var steps = document.querySelectorAll('.p34-step');
var isPlaying = false;

var radiusLabels = [
  '半径约 10 km',
  '半径约 3,000 km',
  '半径约 40,000 km'
];
var eraNames = ['口头', '文字', '电子网络'];

function updateUI(era) {
  var v = Math.max(0, Math.min(2, era));
  
  slider.value = v;
  
  var nearest = Math.round(v);
  ticks.forEach(function(t, i) {
    t.classList.toggle('active', i === nearest);
  });
  
  radLabel.textContent = eraNames[nearest] + ' · ' + radiusLabels[nearest];
  
  // radius circle interpolation
  var r;
  if (v <= 0.5) {
    r = rOral;
  } else if (v <= 1.5) {
    var t = v - 0.5;
    r = rOral + (rWritten - rOral) * t;
  } else {
    var t = v - 1.5;
    r = rWritten + (rElectronic - rWritten) * t;
  }
  radiusCircle.attr('r', r);
  radiusLabel
    .attr('y', cy - r - 6)
    .text(radiusLabels[nearest]);
  
  updateLinkVisibility(v);
  
  // hub node visibility
  var hubOpacity = v >= 0.3 ? Math.min(1, (v - 0.3) / 0.3) : 0;
  nodeGroup.selectAll('circle.hub-node')
    .attr('r', 4 + 2 * hubOpacity)
    .attr('opacity', hubOpacity);
  
  // update process steps
  steps.forEach(function(step, i) {
    step.classList.toggle('current', i === nearest);
    step.classList.toggle('done', i < nearest);
  });
}

slider.addEventListener('input', function() {
  isPlaying = false;
  updateUI(parseFloat(this.value));
});

// keyboard support
slider.addEventListener('keydown', function(e) {
  var step = 0.05;
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
    e.preventDefault();
    this.value = Math.min(2, parseFloat(this.value) + step);
    isPlaying = false;
    updateUI(parseFloat(this.value));
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
    e.preventDefault();
    this.value = Math.max(0, parseFloat(this.value) - step);
    isPlaying = false;
    updateUI(parseFloat(this.value));
  }
});

// ===== auto-play =====
function autoPlay() {
  if (isPlaying) return;
  isPlaying = true;
  
  var startVal = 0;
  var endVal = 2;
  var duration = 14;
  
  var startTime = performance.now();
  
  function tick(now) {
    if (!isPlaying) return;
    var elapsed = (now - startTime) / 1000;
    var progress = Math.min(1, elapsed / duration);
    var eased = progress < 0.5 
      ? 2 * progress * progress 
      : 1 - Math.pow(-2 * progress + 2, 2) / 2;
    var val = startVal + (endVal - startVal) * eased;
    updateUI(val);
    if (progress < 1) {
      requestAnimationFrame(tick);
    } else {
      isPlaying = false;
    }
  }
  requestAnimationFrame(tick);
}

if (!Deck.reduced()) {
  setTimeout(autoPlay, 800);
}

slider.addEventListener('pointerdown', function() { isPlaying = false; });
slider.addEventListener('touchstart', function() { isPlaying = false; });

// ===== resize handler =====
window.addEventListener('resize', function() {
  resizeNet();
  rElectronic = Math.min(W, H) * 0.4;
  updateUI(parseFloat(slider.value));
});
</script>
