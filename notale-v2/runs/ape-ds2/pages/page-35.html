<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}

/* #main 撑满整个 stage */
#main {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  overflow: hidden;
  background: #0b0e14;
}

/* 3D canvas 在 #main 中全屏 */
#cv {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 1;
}

/* 所有覆盖层 */
.overlay-elem {
  position: absolute;
  z-index: 20;
  pointer-events: none;
}
.overlay-elem > * {
  pointer-events: auto;
}

/* 底部左 —— 讲解面板 */
.explain-panel {
  position: absolute;
  left: 24px;
  bottom: 112px;
  z-index: 20;
  max-width: 440px;
  background: rgba(11, 14, 20, 0.82);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 12px 16px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.explain-panel .take {
  font-size: 18px;
  font-weight: 700;
  color: #c8d6e5;
  line-height: 1.4;
  margin: 0 0 4px 0;
}
.explain-panel .note {
  font-size: 16px;
  color: #8a9bb5;
  line-height: 1.4;
  margin: 0;
}

/* 底部右 —— 质量托盘 */
.mass-tray {
  position: absolute;
  right: 24px;
  bottom: 112px;
  z-index: 20;
  display: flex;
  flex-direction: row;
  gap: 8px;
  align-items: center;
  background: rgba(11, 14, 20, 0.75);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 8px 12px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.mass-tray .mass-label {
  font-size: 15px;
  color: #8a9bb5;
  margin-right: 2px;
}
.mass-tray .mass-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.2);
  cursor: grab;
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  line-height: 1;
  transition: border-color 0.2s, transform 0.15s;
}
.mass-tray .mass-btn:hover {
  border-color: rgba(255,255,255,0.5);
  transform: scale(1.08);
}
.mass-tray .mass-btn.moon {
  background: radial-gradient(circle at 35% 35%, #b0b8c8, #6a7280);
}
.mass-tray .mass-btn.earth {
  background: radial-gradient(circle at 35% 35%, #6b93d6, #2a4a7f);
}
.mass-tray .mass-btn.sun {
  background: radial-gradient(circle at 35% 35%, #f5d76e, #e67e22);
}

/* 右侧 —— 三张案例卡 */
.case-cards {
  position: absolute;
  right: 24px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 20;
  width: 270px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.case-cards .it {
  background: rgba(11, 14, 20, 0.80);
  border: 1px solid rgba(255,255,255,0.08);
  border-left: 3px solid #4f6ef2;
  border-radius: 0 8px 8px 0;
  padding: 6px 12px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  font-size: 16px;
  color: #c8d6e5;
  line-height: 1.35;
}
.case-cards .it .card-title {
  font-weight: 700;
  font-size: 18px;
  color: #e6e6e6;
}
.case-cards .it .card-detail {
  font-size: 16px;
  color: #8a9bb5;
}
.case-cards .it .card-speed {
  font-size: 15px;
  color: #4f6ef2;
  font-weight: 600;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.case-cards .it .card-footnote {
  font-size: 14px;
  color: #6a7280;
  font-style: italic;
  border-top: 1px solid rgba(255,255,255,0.06);
  padding-top: 2px;
  margin-top: 1px;
}

/* 拖拽克隆体 */
.drag-clone {
  position: fixed;
  z-index: 100;
  pointer-events: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  opacity: 0.85;
}
</style>
</head>
<body data-page="35" data-total="50">
<div id="stage">
<main id="main">
  <canvas id="cv"></canvas>

  <!-- 讲解面板：左下 -->
  <div class="explain-panel">
    <p class="take">轨道不是太空里预先画好的圆环，而是行星在弯曲空间里一直往下落——永远差一点点，落不到地面。</p>
    <p class="note">质量把空间压弯，弯曲的空间把「直线」变成圆。没有神秘力量在拉，轨道只是弯曲空间中的自由下落。</p>
  </div>

  <!-- 质量托盘：右下 -->
  <div class="mass-tray">
    <span class="mass-label">质量</span>
    <div class="mass-btn moon" data-mass-key="MOON" data-rel-mass="1">月</div>
    <div class="mass-btn earth" data-mass-key="EARTH" data-rel-mass="10">地</div>
    <div class="mass-btn sun" data-mass-key="SUN" data-rel-mass="100">日</div>
  </div>

  <!-- 三张案例卡：右侧 -->
  <div class="case-cards k-enumeration" id="caseCards">
    <div class="it">
      <div class="card-title">月球绕地球</div>
      <div class="card-detail">距离约 384,400 km</div>
      <div class="card-speed" id="speedMoon">—</div>
      <div class="card-footnote">自由下落（沿测地线）</div>
    </div>
    <div class="it">
      <div class="card-title">地球绕太阳</div>
      <div class="card-detail">距离 1 AU（约 1.5 亿 km）</div>
      <div class="card-speed" id="speedEarth">—</div>
      <div class="card-footnote">自由下落（沿测地线）</div>
    </div>
    <div class="it">
      <div class="card-title">你画出的圈</div>
      <div class="card-detail">拖入质量，观察轨迹</div>
      <div class="card-speed">⋯</div>
      <div class="card-footnote">自由下落（沿测地线）</div>
    </div>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/three.min.js"></script>
<script>
(function() {
  'use strict';

  /* ==== 挂载页眉页脚 ==== */
  Lec.mount({
    index: 35,
    title: '一直下落，却永远落不到地面',
    sub: '太空时代 · 引力',
    foot: '第 6 章 · 太空时代'
  });

  /* ==== 计算轨道速度，填入案例卡 ==== */
  var G = Lec.K.GRAVITATIONAL_CONSTANT;

  function orbitalSpeedKmS(massKg, radiusM) {
    return Math.sqrt(G * massKg / radiusM) / 1000;
  }

  var vMoon = orbitalSpeedKmS(Lec.K.EARTH_MASS_KG, Lec.K.MOON_DISTANCE_METERS);
  document.getElementById('speedMoon').textContent = '约 ' + vMoon.toFixed(1) + ' km/s';

  var vEarth = orbitalSpeedKmS(Lec.K.SUN_MASS_KG, Lec.K.METERS_PER_AU);
  document.getElementById('speedEarth').textContent = '约 ' + vEarth.toFixed(1) + ' km/s';

  /* ==== Three.js 场景 ==== */
  var canvas = document.getElementById('cv');
  var main = document.getElementById('main');

  var W = 1600;
  var H = 900;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0e14);

  var camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 100);
  camera.position.set(0, 12, 15);
  camera.lookAt(0, -2, 0);

  var renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true,
    alpha: false
  });
  renderer.setSize(W, H, false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  /* 灯光 */
  var ambient = new THREE.AmbientLight(0x404060, 0.4);
  scene.add(ambient);

  var dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dirLight.position.set(8, 20, 12);
  scene.add(dirLight);

  var fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
  fillLight.position.set(-5, 5, -10);
  scene.add(fillLight);

  /* 星点背景 */
  var starGeo = new THREE.BufferGeometry();
  var starCount = 1500;
  var starPos = new Float32Array(starCount * 3);
  for (var i = 0; i < starCount; i++) {
    var theta = Math.random() * Math.PI * 2;
    var phi = Math.acos(2 * Math.random() - 1);
    var r = 50 + Math.random() * 30;
    starPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
    starPos[i*3+1] = Math.abs(r * Math.cos(phi));
    starPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  var starMat = new THREE.PointsMaterial({
    color: 0xccd8e8,
    size: 0.12,
    transparent: true,
    opacity: 0.7,
    sizeAttenuation: true
  });
  var stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  /* ===== 网格膜（弹性毯面） ===== */
  var GRID_SIZE = 22;
  var GRID_SUBD = 48;
  var GRID_HALF = GRID_SIZE / 2;

  var gridGeo = new THREE.BufferGeometry();
  var vertCount = (GRID_SUBD + 1) * (GRID_SUBD + 1);
  var positions = new Float32Array(vertCount * 3);
  var uvs = new Float32Array(vertCount * 2);
  var indices = [];

  var step = GRID_SIZE / GRID_SUBD;
  var idx = 0;
  for (var iz = 0; iz <= GRID_SUBD; iz++) {
    for (var ix = 0; ix <= GRID_SUBD; ix++) {
      var x = -GRID_HALF + ix * step;
      var z = -GRID_HALF + iz * step;
      positions[idx*3] = x;
      positions[idx*3+1] = 0;
      positions[idx*3+2] = z;
      uvs[idx*2] = ix / GRID_SUBD;
      uvs[idx*2+1] = iz / GRID_SUBD;
      idx++;
    }
  }
  for (var iz = 0; iz < GRID_SUBD; iz++) {
    for (var ix = 0; ix < GRID_SUBD; ix++) {
      var a = iz * (GRID_SUBD + 1) + ix;
      var b = iz * (GRID_SUBD + 1) + ix + 1;
      var c = (iz + 1) * (GRID_SUBD + 1) + ix;
      var d = (iz + 1) * (GRID_SUBD + 1) + ix + 1;
      indices.push(a, b, c);
      indices.push(b, d, c);
    }
  }
  gridGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  gridGeo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  gridGeo.setIndex(indices);
  gridGeo.computeVertexNormals();

  /* 网格材质 */
  var gridMat = new THREE.MeshStandardMaterial({
    color: 0x2a4a6a,
    emissive: 0x0a1a2a,
    emissiveIntensity: 0.12,
    roughness: 0.6,
    metalness: 0.05,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.85
  });
  var gridMesh = new THREE.Mesh(gridGeo, gridMat);
  scene.add(gridMesh);

  /* 网格线 */
  var wireMat = new THREE.MeshBasicMaterial({
    color: 0x3a6a9a,
    wireframe: true,
    transparent: true,
    opacity: 0.20
  });
  var wireMesh = new THREE.Mesh(gridGeo.clone(), wireMat);
  scene.add(wireMesh);

  var origPos = new Float32Array(positions);

  /* ===== 发光小球 ===== */
  var ballGeo = new THREE.SphereGeometry(0.30, 12, 12);
  var ballMat = new THREE.MeshStandardMaterial({
    color: 0x88ddff,
    emissive: 0x44aadd,
    emissiveIntensity: 0.5,
    roughness: 0.2,
    metalness: 0.1
  });
  var ball = new THREE.Mesh(ballGeo, ballMat);
  ball.position.set(-8, 0.5, 0);
  scene.add(ball);

  var glowGeo = new THREE.SphereGeometry(0.50, 8, 8);
  var glowMat = new THREE.MeshBasicMaterial({
    color: 0x88ddff,
    transparent: true,
    opacity: 0.12
  });
  var glow = new THREE.Mesh(glowGeo, glowMat);
  ball.add(glow);

  /* ===== 物理状态 ===== */
  var ballPos = new THREE.Vector2(-8, 0);
  var ballVel = new THREE.Vector2(0.55, 0.12);
  var BALL_SPEED = 0.58;

  var masses = [];
  var massMeshes = [];

  function computeHeight(x, z) {
    var h = 0;
    for (var i = 0; i < masses.length; i++) {
      var dx = x - masses[i].x;
      var dz = z - masses[i].z;
      var dist2 = dx*dx + dz*dz;
      h += -masses[i].strength / Math.sqrt(dist2 + 0.6);
    }
    return h;
  }

  function computeGradient(x, z) {
    var eps = 0.01;
    var hx = (computeHeight(x + eps, z) - computeHeight(x - eps, z)) / (2 * eps);
    var hz = (computeHeight(x, z + eps) - computeHeight(x, z - eps)) / (2 * eps);
    return { x: hx, z: hz };
  }

  function updateGrid() {
    var pos = gridGeo.attributes.position.array;
    for (var i = 0; i < pos.length / 3; i++) {
      var x = origPos[i*3];
      var z = origPos[i*3+2];
      pos[i*3] = x;
      pos[i*3+1] = computeHeight(x, z);
      pos[i*3+2] = z;
    }
    gridGeo.attributes.position.needsUpdate = true;
    gridGeo.computeVertexNormals();
    var wpos = wireMesh.geometry.attributes.position.array;
    for (var i = 0; i < wpos.length / 3; i++) {
      wpos[i*3] = pos[i*3];
      wpos[i*3+1] = pos[i*3+1];
      wpos[i*3+2] = pos[i*3+2];
    }
    wireMesh.geometry.attributes.position.needsUpdate = true;
  }

  function updateBall(dt) {
    var half = GRID_HALF - 0.3;
    if (ballPos.x < -half) { ballPos.x = -half; ballVel.x = Math.abs(ballVel.x); }
    if (ballPos.x > half) { ballPos.x = half; ballVel.x = -Math.abs(ballVel.x); }
    if (ballPos.y < -half) { ballPos.y = -half; ballVel.y = Math.abs(ballVel.y); }
    if (ballPos.y > half) { ballPos.y = half; ballVel.y = -Math.abs(ballVel.y); }

    var grad = computeGradient(ballPos.x, ballPos.y);

    ballVel.x -= grad.x * dt * 0.7;
    ballVel.y -= grad.z * dt * 0.7;

    var speed = Math.sqrt(ballVel.x * ballVel.x + ballVel.y * ballVel.y);
    if (speed > 0.001) {
      ballVel.x = (ballVel.x / speed) * BALL_SPEED;
      ballVel.y = (ballVel.y / speed) * BALL_SPEED;
    }

    ballPos.x += ballVel.x * dt;
    ballPos.y += ballVel.y * dt;

    var h = computeHeight(ballPos.x, ballPos.y);
    ball.position.x = ballPos.x;
    ball.position.y = h + 0.45;
    ball.position.z = ballPos.y;
  }

  function placeMass(screenX, screenY, relMass) {
    /* 将屏幕坐标转换到 3D 场景坐标 */
    var rect = canvas.getBoundingClientRect();
    var scaleX = W / rect.width;
    var scaleY = H / rect.height;
    var mx = (screenX - rect.left) * scaleX;
    var my = (screenY - rect.top) * scaleY;

    /* 用 Three.js 射线 */
    var ndcX = (mx / W) * 2 - 1;
    var ndcY = -(my / H) * 2 + 1;

    var raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), camera);

    var plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    var intersect = new THREE.Vector3();
    raycaster.ray.intersectPlane(plane, intersect);

    if (!intersect) return;

    var x = intersect.x;
    var z = intersect.z;

    var half = GRID_HALF - 0.3;
    x = Math.min(Math.max(x, -half), half);
    z = Math.min(Math.max(z, -half), half);

    var strengthMap = { MOON: 2.0, EARTH: 4.0, SUN: 10.0 };
    var strength = strengthMap[relMass] || 4.0;

    masses.push({ x: x, z: z, strength: strength });

    var sizes = { MOON: 0.4, EARTH: 0.55, SUN: 0.9 };
    var colors = { MOON: 0x8899aa, EARTH: 0x4488cc, SUN: 0xee8833 };
    var size = sizes[relMass] || 0.5;
    var color = colors[relMass] || 0x888888;

    var mGeo = new THREE.SphereGeometry(size, 12, 12);
    var mMat = new THREE.MeshStandardMaterial({
      color: color,
      emissive: color,
      emissiveIntensity: 0.08,
      roughness: 0.4,
      metalness: 0.2
    });
    var mMesh = new THREE.Mesh(mGeo, mMat);
    var h = computeHeight(x, z);
    mMesh.position.set(x, h + size * 0.5, z);
    scene.add(mMesh);
    massMeshes.push(mMesh);

    updateGrid();
  }

  function resetBall() {
    ballPos.set(-8, 0);
    ballVel.set(0.55, 0.12);
    var h = computeHeight(ballPos.x, ballPos.y);
    ball.position.x = ballPos.x;
    ball.position.y = h + 0.45;
    ball.position.z = ballPos.y;
  }

  /* ===== 拖拽交互 ===== */
  var dragData = null;

  function startDrag(clientX, clientY, relMass) {
    var clone = document.createElement('div');
    clone.className = 'drag-clone';
    var bgColors = {
      MOON: 'radial-gradient(circle at 35% 35%, #b0b8c8, #6a7280)',
      EARTH: 'radial-gradient(circle at 35% 35%, #6b93d6, #2a4a7f)',
      SUN: 'radial-gradient(circle at 35% 35%, #f5d76e, #e67e22)'
    };
    clone.style.background = bgColors[relMass] || '#888';
    document.body.appendChild(clone);
    dragData = { relMass: relMass, clone: clone };
    clone.style.left = clientX + 'px';
    clone.style.top = clientY + 'px';
  }

  function endDrag(clientX, clientY) {
    if (!dragData) return;
    if (clientX != null) {
      var rect = canvas.getBoundingClientRect();
      var cx = (clientX - rect.left) * (W / rect.width);
      var cy = (clientY - rect.top) * (H / rect.height);
      if (cx >= 0 && cx <= W && cy >= 0 && cy <= H) {
        placeMass(clientX, clientY, dragData.relMass);
        resetBall();
      }
    }
    if (dragData.clone && dragData.clone.parentNode) {
      dragData.clone.parentNode.removeChild(dragData.clone);
    }
    dragData = null;
  }

  main.addEventListener('mousedown', function(e) {
    var target = e.target;
    if (!target.classList.contains('mass-btn')) return;
    e.preventDefault();
    startDrag(e.clientX, e.clientY, target.dataset.massKey);
  });

  window.addEventListener('mousemove', function(e) {
    if (!dragData) return;
    dragData.clone.style.left = e.clientX + 'px';
    dragData.clone.style.top = e.clientY + 'px';
  });

  window.addEventListener('mouseup', function(e) {
    if (!dragData) return;
    endDrag(e.clientX, e.clientY);
  });

  main.addEventListener('touchstart', function(e) {
    var touch = e.changedTouches[0];
    var target = document.elementFromPoint(touch.clientX, touch.clientY);
    if (target && target.classList.contains('mass-btn')) {
      e.preventDefault();
      startDrag(touch.clientX, touch.clientY, target.dataset.massKey);
    }
  }, { passive: false });

  window.addEventListener('touchmove', function(e) {
    if (!dragData) return;
    e.preventDefault();
    var touch = e.changedTouches[0];
    dragData.clone.style.left = touch.clientX + 'px';
    dragData.clone.style.top = touch.clientY + 'px';
  }, { passive: false });

  window.addEventListener('touchend', function(e) {
    if (!dragData) return;
    var touch = e.changedTouches[0];
    endDrag(touch.clientX, touch.clientY);
  }, { passive: false });

  /* ===== 动画循环 ===== */
  var clock = new THREE.Clock();

  function animate() {
    var dt = Math.min(clock.getDelta(), 0.05);
    updateBall(dt);
    updateGrid();
    stars.rotation.y += dt * 0.005;
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  animate();

  /* 初始：放置一个地球质量，形成轨道 */
  setTimeout(function() {
    placeMass(W * 0.5, H * 0.5, 'EARTH');
    resetBall();
  }, 400);

  /* 键盘：+ 加质量，- 移除质量 */
  window.addEventListener('keydown', function(e) {
    if (e.key === '+' || e.key === '=') {
      e.preventDefault();
      placeMass(W * 0.5, H * 0.5, 'EARTH');
      resetBall();
    } else if (e.key === '-' || e.key === '_') {
      e.preventDefault();
      if (masses.length > 0) {
        masses.pop();
        var mesh = massMeshes.pop();
        scene.remove(mesh);
        mesh.geometry.dispose();
        mesh.material.dispose();
        updateGrid();
        resetBall();
      }
    }
  });

})();
</script>
</body>
</html>
