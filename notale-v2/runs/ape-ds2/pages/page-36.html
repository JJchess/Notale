<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}

/* constrain #main to the stage's content area */
#main {
  width: 100%;
  height: 100%;
}

/* ---------- page-36 layout ---------- */
.p36-wrap {
  display: flex;
  flex-direction: row;
  width: 100%;
  height: 100%;
  min-height: 0;
}

/* left: 58% - canvas + controls */
.p36-left {
  flex: 0 0 58%;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  position: relative;
  border-right: 1px solid rgba(255,255,255,0.06);
}

/* right: 42% - comparison cards */
.p36-right {
  flex: 0 0 42%;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 16px 20px 12px 20px;
  gap: 10px;
}

/* canvas area */
.p36-canvas-wrap {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  overflow: hidden;
}
.p36-canvas-wrap canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* control row */
.p36-ctl {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px 10px 16px;
  border-top: 1px solid rgba(255,255,255,0.06);
  flex: 0 0 auto;
}
.p36-ctl > label {
  font-size: var(--fs-label, 15px);
  color: #8892a0;
  white-space: nowrap;
}
.p36-ctl input[type="range"] {
  flex: 1 1 auto;
  min-width: 0;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: #1e2530;
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
.p36-ctl input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #4f6ef2;
  border: 2px solid #0b0e14;
  cursor: pointer;
  box-shadow: 0 0 0 1px rgba(79,110,242,0.3);
}
.p36-ctl input[type="range"]::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #4f6ef2;
  border: 2px solid #0b0e14;
  cursor: pointer;
}
.p36-speed-readout {
  font-family: var(--font-mono, ui-monospace, monospace);
  font-size: var(--fs-lead, 19px);
  font-weight: 700;
  color: #e6e6e6;
  min-width: 68px;
  text-align: right;
  letter-spacing: 0.02em;
}
.p36-speed-readout .unit {
  font-size: var(--fs-label, 15px);
  font-weight: 400;
  color: #667085;
  margin-left: 2px;
}
.p36-btn {
  font-size: var(--fs-label, 15px);
  font-weight: 600;
  padding: 5px 16px;
  border: 1px solid rgba(79,110,242,0.4);
  border-radius: 6px;
  background: rgba(79,110,242,0.12);
  color: #4f6ef2;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.p36-btn:hover {
  background: rgba(79,110,242,0.22);
  border-color: rgba(79,110,242,0.6);
}
.p36-btn:active {
  background: rgba(79,110,242,0.35);
}
.p36-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

/* regime badge overlay */
.p36-badge {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  font-weight: 700;
  padding: 4px 16px;
  border-radius: 14px;
  background: rgba(0,0,0,0.75);
  border: 1px solid rgba(255,255,255,0.1);
  color: #8892a0;
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
  white-space: nowrap;
}
.p36-badge.visible { opacity: 1; }
.p36-badge.fallback { color: #f97066; border-color: rgba(249,112,102,0.3); }
.p36-badge.orbit   { color: #4f6ef2; border-color: rgba(79,110,242,0.3); }
.p36-badge.escape  { color: #12b76a; border-color: rgba(18,183,106,0.3); }

/* launch point label */
.p36-launch-label {
  position: absolute;
  font-size: 14px;
  color: #4a5260;
  pointer-events: none;
  white-space: nowrap;
  font-family: var(--font-mono, ui-monospace, monospace);
}

/* ---------- speed axis (right column) ---------- */
.p36-speed-axis {
  flex: 0 0 auto;
  position: relative;
  padding: 24px 0 0 0;
}
.p36-axis-line {
  position: relative;
  height: 3px;
  background: #1e2530;
  border-radius: 2px;
  margin: 0 2px;
}
.p36-axis-tick {
  position: absolute;
  top: -6px;
  width: 2px;
  height: 14px;
  background: #667085;
  transform: translateX(-50%);
}
.p36-axis-tick.critical {
  height: 18px;
  top: -8px;
  background: #4f6ef2;
  width: 3px;
}
.p36-axis-tick.critical::before {
  content: attr(data-label);
  position: absolute;
  top: -22px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-mono, ui-monospace, monospace);
  font-size: 12px;
  color: #8892a0;
  white-space: nowrap;
}
.p36-axis-end-label {
  position: absolute;
  top: -22px;
  font-size: 12px;
  color: #667085;
  font-family: var(--font-mono, ui-monospace, monospace);
}
.p36-axis-end-label.left  { left: 0; }
.p36-axis-end-label.right { right: 0; }

/* three regime zones below axis */
.p36-regime-zones {
  display: flex;
  flex-direction: row;
  width: 100%;
  height: 22px;
  margin-top: 4px;
  gap: 0;
}
.p36-zone {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  color: #4a5260;
  transition: color 0.3s, background 0.3s;
}
.p36-zone.active {
  color: #e6e6e6;
  background: rgba(79,110,242,0.08);
  border-radius: 3px;
}
.p36-zone.fallback.active { color: #f97066; background: rgba(249,112,102,0.08); }
.p36-zone.orbit.active    { color: #4f6ef2; background: rgba(79,110,242,0.12); }
.p36-zone.escape.active   { color: #12b76a; background: rgba(18,183,106,0.08); }

/* ---------- two comparison cards ---------- */
.p36-cards {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1 1 auto;
  min-height: 0;
}
.p36-card {
  flex: 1 1 50%;
  min-height: 0;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px;
  background: rgba(255,255,255,0.02);
  transition: border-color 0.3s, background 0.3s;
}
.p36-card.highlight {
  border-color: rgba(79,110,242,0.3);
  background: rgba(79,110,242,0.06);
}
.p36-card.escape-card.highlight {
  border-color: rgba(18,183,106,0.3);
  background: rgba(18,183,106,0.06);
}
.p36-card-speed {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 72px;
}
.p36-card-speed .num {
  font-family: var(--font-mono, ui-monospace, monospace);
  font-size: 26px;
  font-weight: 700;
  color: #4a5260;
  line-height: 1.1;
  transition: color 0.3s;
}
.p36-card.highlight .p36-card-speed .num {
  color: #4f6ef2;
}
.p36-card.escape-card.highlight .p36-card-speed .num {
  color: #12b76a;
}
.p36-card-speed .unit-sm {
  font-size: var(--fs-label, 15px);
  color: #667085;
  font-weight: 400;
}
.p36-card-body {
  flex: 1 1 auto;
  min-width: 0;
}
.p36-card-body .title {
  font-size: var(--fs-lead, 19px);
  font-weight: 700;
  color: #4a5260;
  line-height: 1.2;
  transition: color 0.3s;
}
.p36-card.highlight .p36-card-body .title {
  color: #4f6ef2;
}
.p36-card.escape-card.highlight .p36-card-body .title {
  color: #12b76a;
}
.p36-card-body .desc {
  font-size: var(--fs-sec, 16px);
  color: #4a5260;
  line-height: 1.35;
  transition: color 0.3s;
  margin-top: 1px;
}
.p36-card.highlight .p36-card-body .desc {
  color: #8892a0;
}
.p36-card.escape-card.highlight .p36-card-body .desc {
  color: #8892a0;
}
.p36-card-state {
  flex: 0 0 auto;
  font-size: 14px;
  color: #4a5260;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.06);
  transition: all 0.3s;
  white-space: nowrap;
}
.p36-card.highlight .p36-card-state {
  color: #4f6ef2;
  border-color: rgba(79,110,242,0.3);
  background: rgba(79,110,242,0.08);
}
.p36-card.escape-card.highlight .p36-card-state {
  color: #12b76a;
  border-color: rgba(18,183,106,0.3);
  background: rgba(18,183,106,0.08);
}
</style>
</head>
<body data-page="36" data-total="50">
<div id="stage">
<main id="main">
<div class="p36-wrap min0">
  <!-- left: canvas + controls -->
  <div class="p36-left min0">
    <div class="p36-canvas-wrap min0">
      <canvas id="rocket-canvas" class="cv-fill"></canvas>
      <div class="p36-badge" id="regime-badge"></div>
      <span class="p36-launch-label" id="launch-label" style="display:none;">从地表水平发射</span>
    </div>
    <div class="p36-ctl">
      <label for="speed-slider">初速</label>
      <input type="range" id="speed-slider" min="0" max="12" step="0.1" value="4.0">
      <span class="p36-speed-readout" id="speed-readout">4.0<span class="unit">km/s</span></span>
      <button class="p36-btn" id="launch-btn">发射</button>
    </div>
  </div>
  <!-- right: speed axis + comparison cards -->
  <div class="p36-right min0">
    <div class="p36-speed-axis min0">
      <div class="p36-axis-line" id="axis-line">
        <span class="p36-axis-end-label left">0</span>
        <span class="p36-axis-end-label right">12 km/s</span>
      </div>
      <div class="p36-regime-zones" id="regime-zones">
        <div class="p36-zone fallback" data-zone="fallback" style="width:0;">落回</div>
        <div class="p36-zone orbit" data-zone="orbit" style="width:0;">绕行</div>
        <div class="p36-zone escape" data-zone="escape" style="width:0;">逃离</div>
      </div>
    </div>
    <div class="p36-cards">
      <div class="p36-card" id="orbit-card">
        <div class="p36-card-speed">
          <span class="num" id="orbit-speed-val">--</span>
          <span class="unit-sm">km/s</span>
        </div>
        <div class="p36-card-body">
          <div class="title">绕行</div>
          <div class="desc">火箭持续下落但永远落不到地面</div>
        </div>
        <span class="p36-card-state" id="orbit-state">等待</span>
      </div>
      <div class="p36-card escape-card" id="escape-card">
        <div class="p36-card-speed">
          <span class="num" id="escape-speed-val">--</span>
          <span class="unit-sm">km/s</span>
        </div>
        <div class="p36-card-body">
          <div class="title">逃离</div>
          <div class="desc">离地球而去不再返回</div>
        </div>
        <span class="p36-card-state" id="escape-state">等待</span>
      </div>
    </div>
  </div>
</div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  'use strict';

  /* ---- constants ---- */
  var R_EARTH = Lec.K.EARTH_RADIUS_METERS;    /* 6371000 m */
  var M_EARTH = Lec.K.EARTH_MASS_KG;           /* 5.972e24 kg */
  var G = Lec.K.GRAVITATIONAL_CONSTANT;         /* 6.674e-11 */
  var GM = G * M_EARTH;                         /* ~3.986e14 */
  var LEO_ALT = 200000;                         /* 近地参考高度 m (全套口径) */
  var R_ORBIT = R_EARTH + LEO_ALT;              /* 轨道半径 m */
  var SPEED_MAX = 12;                           /* 滑块最大 km/s */

  /* computed critical speeds */
  var V_ORB_RAW = Lec.P.orbitalVelocity(M_EARTH, R_ORBIT);  /* m/s */
  var V_ESC_RAW = Lec.P.escapeVelocity(M_EARTH, R_EARTH);   /* m/s */
  var V_ORB = V_ORB_RAW / 1000;                 /* km/s */
  var V_ESC = V_ESC_RAW / 1000;                 /* km/s */

  /* ---- DOM refs ---- */
  var canvas = document.getElementById('rocket-canvas');
  var slider = document.getElementById('speed-slider');
  var readout = document.getElementById('speed-readout');
  var btn = document.getElementById('launch-btn');
  var badge = document.getElementById('regime-badge');
  var label = document.getElementById('launch-label');
  var orbitCard = document.getElementById('orbit-card');
  var escapeCard = document.getElementById('escape-card');
  var orbitState = document.getElementById('orbit-state');
  var escapeState = document.getElementById('escape-state');
  var orbitSpeedVal = document.getElementById('orbit-speed-val');
  var escapeSpeedVal = document.getElementById('escape-speed-val');
  var axisLine = document.getElementById('axis-line');
  var regimeZones = document.getElementById('regime-zones');

  /* set critical speed values */
  orbitSpeedVal.textContent = V_ORB.toFixed(1);
  escapeSpeedVal.textContent = V_ESC.toFixed(1);

  /* ---- state ---- */
  var state = {
    speed: 4.0,
    launched: false,
    animating: false,
    trajectory: [],
    canvasPts: [],
    progress: 0,
    phase: 'idle',
    regime: 'fallback'
  };

  /* ---- helpers ---- */
  function getRegimeForSpeed(v) {
    if (v < V_ORB) return 'fallback';
    if (v < V_ESC) return 'orbit';
    return 'escape';
  }

  function getTrajectoryColor(regime) {
    return regime === 'fallback' ? '#f97066' :
           regime === 'orbit' ? '#4f6ef2' : '#12b76a';
  }

  /* ---- build speed axis ticks ---- */
  function buildAxis() {
    var line = axisLine;
    var ticks = line.querySelectorAll('.p36-axis-tick');
    for (var i = 0; i < ticks.length; i++) ticks[i].remove();

    var w = line.offsetWidth || 300;
    if (w < 10) w = 300;

    function addTick(pct, label, critical) {
      var el = document.createElement('span');
      el.className = 'p36-axis-tick' + (critical ? ' critical' : '');
      el.style.left = pct + '%';
      if (critical) el.setAttribute('data-label', label);
      line.appendChild(el);
    }

    addTick(0, '0', false);
    var pctOrb = (V_ORB / SPEED_MAX) * 100;
    var pctEsc = (V_ESC / SPEED_MAX) * 100;
    addTick(pctOrb, V_ORB.toFixed(1), true);
    addTick(pctEsc, V_ESC.toFixed(1), true);
    addTick(100, '12', false);

    /* set regime zone widths */
    var zones = regimeZones.querySelectorAll('.p36-zone');
    if (zones.length >= 3) {
      zones[0].style.width = pctOrb + '%';
      zones[1].style.width = (pctEsc - pctOrb) + '%';
      zones[2].style.width = (100 - pctEsc) + '%';
    }
  }

  setTimeout(buildAxis, 80);
  window.addEventListener('resize', function() {
    setTimeout(buildAxis, 80);
  });

  /* ---- trajectory computation ---- */
  function computeTrajectory(v0_ms) {
    var R = R_EARTH;
    var mu = GM;
    var eps = 0.5 * v0_ms * v0_ms - mu / R;
    var h_spec = R * v0_ms;
    var vCirc = Math.sqrt(mu / R);
    var pts = [];

    /* no horizontal speed */
    if (v0_ms < 1) {
      pts.push({x: R, y: 0});
      pts.push({x: R, y: -R * 0.15});
      return pts;
    }

    var step = 0.008;
    var maxPts = 4000;

    if (v0_ms < vCirc) {
      /* suborbital — launch at apoapsis, θ = π */
      var a = -mu / (2 * eps);
      var e = Math.sqrt(Math.max(0, 1 + 2 * eps * h_spec * h_spec / (mu * mu)));
      if (e >= 1) { pts.push({x: R, y: 0}); return pts; }
      var theta = Math.PI;
      var count = 0;
      while (theta < 2 * Math.PI + 0.1 && count < maxPts) {
        var denom = 1 + e * Math.cos(theta);
        if (Math.abs(denom) < 1e-10) break;
        var r = a * (1 - e * e) / denom;
        if (r < R) break;
        if (r > R * 4) break;
        pts.push({x: r * Math.cos(theta), y: r * Math.sin(theta)});
        theta += step;
        count++;
      }
    } else if (v0_ms < Math.sqrt(2) * vCirc) {
      /* elliptical orbit — launch at periapsis, θ = 0 */
      var a = -mu / (2 * eps);
      var e = Math.sqrt(Math.max(0, 1 + 2 * eps * h_spec * h_spec / (mu * mu)));
      if (e >= 1) { pts.push({x: R, y: 0}); return pts; }
      var count = 0;
      for (var theta = 0; theta <= 2 * Math.PI + 0.01 && count < maxPts; theta += step) {
        var denom = 1 + e * Math.cos(theta);
        if (Math.abs(denom) < 1e-10) continue;
        var r = a * (1 - e * e) / denom;
        if (r > R * 6) break;
        pts.push({x: r * Math.cos(theta), y: r * Math.sin(theta)});
        count++;
      }
    } else {
      /* hyperbolic escape — launch at periapsis, θ = 0 */
      var a = mu / (2 * eps);
      var e = Math.sqrt(1 + 2 * eps * h_spec * h_spec / (mu * mu));
      if (e <= 1) { pts.push({x: R, y: 0}); return pts; }
      var thetaMax = Math.acos(-1 / e) * 0.92;
      var count = 0;
      for (var theta = -thetaMax; theta <= thetaMax && count < maxPts; theta += step) {
        var denom = 1 + e * Math.cos(theta);
        if (Math.abs(denom) < 1e-10) continue;
        var r = a * (e * e - 1) / denom;
        if (r > R * 6) break;
        pts.push({x: r * Math.cos(theta), y: r * Math.sin(theta)});
        count++;
      }
    }

    if (pts.length < 3) {
      pts = [{x: R, y: 0}, {x: R, y: -R * 0.1}];
    }
    return pts;
  }

  /* ---- canvas drawing ---- */
  var ctx = null;
  var cvW = 0, cvH = 0;
  var cx = 0, cy = 0, R_px = 0, scale = 0;

  function setupCanvas() {
    var rect = canvas.parentElement.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    cvW = canvas.width = Math.round(rect.width * dpr);
    cvH = canvas.height = Math.round(rect.height * dpr);
    ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    cvW = rect.width;
    cvH = rect.height;

    cx = cvW * 0.16;
    cy = cvH * 0.78;
    R_px = Math.min(cvW * 0.22, cvH * 0.30);
    scale = R_px / R_EARTH;

    /* launch label */
    var lx = cx;
    var ly = cy - R_px - 6;
    label.style.left = (lx - 36) + 'px';
    label.style.top = (ly - 16) + 'px';
    label.style.display = 'block';
  }

  function worldToCanvas(worldPts) {
    if (!worldPts || worldPts.length === 0) return [];
    var out = [];
    for (var i = 0; i < worldPts.length; i++) {
      var wp = worldPts[i];
      out.push({x: cx + wp.y * scale, y: cy - wp.x * scale});
    }
    return out;
  }

  function drawScene(trajCanvasPts, prog, regime, showLabel) {
    if (!ctx) setupCanvas();
    var w = cvW, h = cvH;

    ctx.clearRect(0, 0, w, h);

    /* Earth */
    ctx.beginPath();
    ctx.arc(cx, cy, R_px, 0, Math.PI * 2);
    ctx.fillStyle = '#0f141e';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 1;
    ctx.stroke();

    /* atmosphere ring */
    ctx.beginPath();
    ctx.arc(cx, cy, R_px + 3, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(79,110,242,0.05)';
    ctx.lineWidth = 2;
    ctx.stroke();

    if (!trajCanvasPts || trajCanvasPts.length < 2) return;

    /* full trajectory ghost */
    ctx.beginPath();
    ctx.moveTo(trajCanvasPts[0].x, trajCanvasPts[0].y);
    for (var i = 1; i < trajCanvasPts.length; i++) {
      ctx.lineTo(trajCanvasPts[i].x, trajCanvasPts[i].y);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    ctx.stroke();

    /* active trajectory */
    var endIdx = Math.floor(prog * (trajCanvasPts.length - 1));
    endIdx = Math.min(endIdx, trajCanvasPts.length - 1);
    var col = getTrajectoryColor(regime);

    if (endIdx > 0) {
      ctx.beginPath();
      ctx.moveTo(trajCanvasPts[0].x, trajCanvasPts[0].y);
      for (var j = 1; j <= endIdx; j++) {
        ctx.lineTo(trajCanvasPts[j].x, trajCanvasPts[j].y);
      }
      ctx.strokeStyle = col;
      ctx.lineWidth = 2;
      ctx.stroke();

      /* glow */
      ctx.beginPath();
      ctx.moveTo(trajCanvasPts[0].x, trajCanvasPts[0].y);
      for (var k = 1; k <= endIdx; k++) {
        ctx.lineTo(trajCanvasPts[k].x, trajCanvasPts[k].y);
      }
      ctx.strokeStyle = col.replace(')', ',0.12)').replace('rgb', 'rgba');
      ctx.lineWidth = 6;
      ctx.stroke();
    }

    /* rocket */
    if (endIdx >= 0 && endIdx < trajCanvasPts.length) {
      var rx = trajCanvasPts[endIdx].x;
      var ry = trajCanvasPts[endIdx].y;
      var dirIdx = Math.min(endIdx + 1, trajCanvasPts.length - 1);
      var dx = trajCanvasPts[dirIdx].x - trajCanvasPts[Math.max(0, endIdx - 1)].x;
      var dy = trajCanvasPts[dirIdx].y - trajCanvasPts[Math.max(0, endIdx - 1)].y;
      var len = Math.sqrt(dx * dx + dy * dy);
      if (len > 0.001) { dx /= len; dy /= len; }
      else { dx = 1; dy = 0; }
      var angle = Math.atan2(dy, dx);

      ctx.save();
      ctx.translate(rx, ry);
      ctx.rotate(angle);
      var rs = 5;
      ctx.beginPath();
      ctx.moveTo(rs, 0);
      ctx.lineTo(-rs * 0.6, -rs * 0.5);
      ctx.lineTo(-rs * 0.6, rs * 0.5);
      ctx.closePath();
      ctx.fillStyle = col;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 0.5;
      ctx.stroke();
      ctx.restore();
    }

    /* launch point marker */
    if (trajCanvasPts.length > 0) {
      ctx.beginPath();
      ctx.arc(trajCanvasPts[0].x, trajCanvasPts[0].y, 3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fill();
    }

    /* regime label on canvas */
    if (showLabel && prog >= 0.95) {
      var labelText = regime === 'fallback' ? '落回' :
                      regime === 'orbit' ? '绕行' : '逃离';
      ctx.save();
      ctx.font = '15px "Noto Sans SC", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      var lx2 = w / 2;
      var ly2 = h - 10;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      var tw = ctx.measureText(labelText).width;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(lx2 - tw/2 - 12, ly2 - 20, tw + 24, 24, 12);
      } else {
        ctx.rect(lx2 - tw/2 - 12, ly2 - 20, tw + 24, 24);
      }
      ctx.fill();
      ctx.fillStyle = col;
      ctx.fillText(labelText, lx2, ly2 - 2);
      ctx.restore();
    }
  }

  /* ---- update UI ---- */
  function updateUI(speed, animating) {
    var regime = getRegimeForSpeed(speed);
    var isOrbit = regime === 'orbit';
    var isEscape = regime === 'escape';

    orbitCard.classList.toggle('highlight', isOrbit || isEscape);
    escapeCard.classList.toggle('highlight', isEscape);

    if (isEscape) {
      orbitState.textContent = '已越过';
      escapeState.textContent = '已越过';
    } else if (isOrbit) {
      orbitState.textContent = '已越过';
      escapeState.textContent = '未达到';
    } else {
      orbitState.textContent = '未达到';
      escapeState.textContent = '未达到';
    }

    var zones = regimeZones.querySelectorAll('.p36-zone');
    for (var i = 0; i < zones.length; i++) zones[i].classList.remove('active');
    if (regime === 'fallback' && zones[0]) zones[0].classList.add('active');
    if (isOrbit && zones[1]) zones[1].classList.add('active');
    if (isEscape && zones[2]) zones[2].classList.add('active');

    if (!animating) {
      badge.textContent = regime === 'fallback' ? '弹道亚轨道' :
                          regime === 'orbit' ? '椭圆轨道' : '双曲逃逸';
      badge.className = 'p36-badge visible ' + regime;
    }
  }

  /* ---- launch ---- */
  function launch() {
    if (state.animating) return;
    var speed = parseFloat(slider.value);
    state.speed = speed;
    state.launched = true;
    state.animating = true;
    state.phase = 'launching';
    state.progress = 0;
    state.regime = getRegimeForSpeed(speed);
    btn.disabled = true;
    badge.className = 'p36-badge';

    var v0_ms = speed * 1000;
    var worldPts = computeTrajectory(v0_ms);
    state.trajectory = worldPts;
    state.canvasPts = worldToCanvas(worldPts);

    var duration = 3000;
    var startTime = null;

    function animate(ts) {
      if (!startTime) startTime = ts;
      var elapsed = ts - startTime;
      var prog = Math.min(elapsed / duration, 1);
      state.progress = prog;
      var eased = prog < 0.5 ? 2 * prog * prog : 1 - Math.pow(-2 * prog + 2, 2) / 2;
      drawScene(state.canvasPts, eased, state.regime, false);
      if (prog >= 1) {
        state.phase = 'done';
        state.animating = false;
        btn.disabled = false;
        drawScene(state.canvasPts, 1, state.regime, true);
        updateUI(speed, false);
        setTimeout(function() {
          if (!state.animating) {
            state.launched = false;
            state.phase = 'idle';
            drawScene(state.canvasPts, 0, state.regime, false);
            updateUI(parseFloat(slider.value), false);
          }
        }, 2500);
        return;
      }
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  }

  /* ---- slider ---- */
  slider.addEventListener('input', function() {
    if (state.animating) return;
    var v = parseFloat(slider.value);
    state.speed = v;
    readout.innerHTML = v.toFixed(1) + '<span class="unit">km/s</span>';
    if (!state.launched) {
      var v0_ms = v * 1000;
      var worldPts = computeTrajectory(v0_ms);
      state.trajectory = worldPts;
      state.canvasPts = worldToCanvas(worldPts);
      state.regime = getRegimeForSpeed(v);
      drawScene(state.canvasPts, 1, state.regime, false);
    }
    updateUI(v, false);
  });

  /* ---- button ---- */
  btn.addEventListener('click', launch);
  btn.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      launch();
    }
  });

  /* ---- keyboard slider ---- */
  slider.addEventListener('keydown', function(e) {
    var v = parseFloat(slider.value);
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
      e.preventDefault();
      v = Math.min(SPEED_MAX, v + 0.1);
    } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
      e.preventDefault();
      v = Math.max(0, v - 0.1);
    } else return;
    slider.value = v.toFixed(1);
    slider.dispatchEvent(new Event('input'));
  });

  /* ---- resize ---- */
  function handleResize() {
    setupCanvas();
    if (!state.launched) {
      var v = parseFloat(slider.value);
      var v0_ms = v * 1000;
      state.trajectory = computeTrajectory(v0_ms);
      state.canvasPts = worldToCanvas(state.trajectory);
      state.regime = getRegimeForSpeed(v);
    }
    drawScene(state.canvasPts, state.launched ? 1 : 1, state.regime, false);
    buildAxis();
  }

  window.addEventListener('resize', handleResize);

  /* ---- mount header/footer ---- */
  Lec.mount({
    index: 36,
    kicker: 'SPACE AGE',
    title: '7.9 绕行，11.2 逃离',
    sub: '从地面到太空，关键不是高度，而是横着飞的速度'
  });

  /* ---- init ---- */
  setupCanvas();
  var initV = parseFloat(slider.value);
  state.speed = initV;
  state.regime = getRegimeForSpeed(initV);
  var v0_ms = initV * 1000;
  state.trajectory = computeTrajectory(v0_ms);
  state.canvasPts = worldToCanvas(state.trajectory);
  drawScene(state.canvasPts, 1, state.regime, false);
  updateUI(initV, false);
  readout.innerHTML = initV.toFixed(1) + '<span class="unit">km/s</span>';
})();
</script>
</body>
</html>
