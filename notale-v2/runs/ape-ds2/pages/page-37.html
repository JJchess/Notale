<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
  --fuel-bar: #8b5e3c;
  --fuel-bar-dim: #5a3d27;
  --struct-bar: #5a6a7a;
  --struct-bar-dim: #3d4a57;
  --payload-bar: #4f6ef2;
  --bar-bg: rgba(255,255,255,0.05);
  --bar-border: rgba(255,255,255,0.10);
  --label-muted: #8895a7;
  --step-bg: rgba(255,255,255,0.03);
  --step-border: rgba(255,255,255,0.08);
  --badge-bg: rgba(79,110,242,0.15);
  --badge-border: rgba(79,110,242,0.30);
}

#stage {
  padding: var(--header-h) var(--side-margin) calc(var(--footer-h) + var(--footer-gap));
  display: flex;
  flex-direction: column;
  font-size: var(--fs-body);
  line-height: var(--lh-text);
  box-sizing: border-box;
  height: 100%;
  overflow: hidden;
}
/* Override theme.css #main{width:100vw;height:100vh} — #main is inside
   the 1600px #stage, must fit within the stage, not the viewport. */
#main {
  width: 100%;
  height: 100%;
  min-height: 0;
}

/* === Main layout: rocket + ledger side by side === */
.page-37-layout {
  display: flex;
  gap: 28px;
  flex: 1;
  min-height: 0;
  min-width: 0;
  align-items: stretch;
  width: 100%;
  max-width: 100%;
}

/* Saturn V silhouette column */
.rocket-col {
  flex: 0 0 76px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding-bottom: 6px;
}
.rocket-col img {
  width: 100%;
  height: auto;
  max-height: 480px;
  object-fit: contain;
  display: block;
  opacity: 0.6;
}

/* === Ledger (stripping chain via k-process pattern) === */
.ledger {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0;
}

/* Each step card */
.ledger.k-process.is-vertical {
  /* Neutralize the vertical line from k-process skeleton */
  position: relative;
}
.ledger.k-process.is-vertical::before {
  display: none;
}
.ledger.k-process.is-vertical > .step {
  flex: 0 0 auto;
  text-align: left;
  padding: 10px 16px;
  background: var(--step-bg);
  border: 1px solid var(--step-border);
  border-radius: 6px;
  transition: opacity 0.5s, border-color 0.3s, background 0.3s;
}
  padding: 10px 16px;
  background: var(--step-bg);
  border: 1px solid var(--step-border);
  border-radius: 6px;
  transition: opacity 0.5s, border-color 0.3s, background 0.3s;
}
.ledger.k-process.is-vertical > .step.stripped {
  opacity: 0.18;
}
.ledger.k-process.is-vertical > .step.stripped .bar-fill {
  opacity: 0.08;
}

/* Arrow between steps */
.ledger .arw-step {
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--label-muted);
  font-size: 11px;
  letter-spacing: 2px;
}
.ledger .arw-step .arw-line {
  display: block;
  width: 50px;
  height: 1px;
  background: rgba(255,255,255,0.08);
}
.ledger .arw-step .arw-head {
  font-size: 12px;
  color: rgba(255,255,255,0.20);
  line-height: 1;
}

/* Row inside step: name | bar | values */
.step-row {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

/* Stage name */
.step-name {
  flex: 0 0 90px;
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.3;
}
.step-name .sub {
  display: block;
  font-size: 14px;
  font-weight: 400;
  color: var(--label-muted);
  margin-top: 1px;
  line-height: 1.2;
}

/* Bar area */
.bar-area {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  position: relative;
}
.bar-track {
  flex: 1;
  height: 22px;
  background: var(--bar-bg);
  border: 1px solid var(--bar-border);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}
.bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
.bar-fill.type-fuel { background: var(--fuel-bar); }
.bar-fill.type-struct { background: var(--struct-bar); }
.bar-fill.type-payload { background: var(--payload-bar); }

/* Mass values */
.mass-vals {
  flex: 0 0 210px;
  display: flex;
  gap: 6px;
  font-size: 14px;
  font-family: var(--font-mono, monospace);
  color: var(--label-muted);
  text-align: right;
  justify-content: flex-end;
  white-space: nowrap;
  align-items: center;
}
.mass-vals .mv {
  display: inline-block;
}
.mass-vals .mv strong {
  color: var(--text);
  font-weight: 600;
}
.mass-vals .mv-seg {
  min-width: 58px;
}
.mass-vals .mv-rem {
  min-width: 58px;
}
.mass-vals .mv-rem strong {
  color: var(--payload-bar);
}
.mass-vals .mv-pct {
  min-width: 42px;
  color: var(--label-muted);
  text-align: right;
}
.mass-vals .mv-sep {
  color: rgba(255,255,255,0.10);
  font-weight: 300;
  font-size: 12px;
}

/* Annotation */
.step-anno {
  font-size: 16px;
  color: var(--label-muted);
  margin-top: 2px;
  padding-left: 102px;
  line-height: 1.35;
  opacity: 0.75;
}

/* Payload callout icon */
.payload-callout {
  position: absolute;
  right: -10px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  border: 1.5px solid var(--payload-bar);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--payload-bar);
  cursor: help;
  background: var(--bg);
  z-index: 5;
  flex-shrink: 0;
}

/* === Control bar === */
.ctl-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0 2px 0;
  border-top: 1px solid var(--step-border);
  flex-shrink: 0;
  min-width: 0;
  width: 100%;
  max-width: 100%;
}
.ctl-bar .slider-wrap {
  flex: 1;
  min-width: 80px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ctl-bar .slider-wrap label {
  font-size: 14px;
  color: var(--label-muted);
  white-space: nowrap;
  flex-shrink: 0;
}
.ctl-bar input[type="range"] {
  flex: 1;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--bar-border);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
  min-width: 60px;
}
.ctl-bar input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--payload-bar);
  border: 2px solid var(--bg);
  cursor: pointer;
  box-shadow: 0 0 8px rgba(79,110,242,0.4);
}
.ctl-bar input[type="range"]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--payload-bar);
  border: 2px solid var(--bg);
  cursor: pointer;
}
.ctl-bar .slider-readout {
  font-size: 14px;
  color: var(--text);
  font-family: var(--font-mono, monospace);
  white-space: nowrap;
  flex-shrink: 0;
  min-width: 55px;
  text-align: right;
}

/* Preset buttons */
.ctl-bar .presets {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}
.ctl-bar .presets button {
  background: transparent;
  border: 1px solid var(--step-border);
  color: var(--label-muted);
  font-size: 14px;
  padding: 4px 9px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-sans);
  line-height: 1.3;
}
.ctl-bar .presets button:hover,
.ctl-bar .presets button.active {
  border-color: var(--payload-bar);
  color: var(--payload-bar);
  background: rgba(79,110,242,0.08);
}
.ctl-bar .presets button:focus-visible {
  outline: 2px solid var(--payload-bar);
  outline-offset: 2px;
}

/* Strip button */
#strip-btn {
  background: transparent;
  border: 1px solid var(--payload-bar);
  color: var(--payload-bar);
  font-size: 14px;
  padding: 5px 16px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-sans);
  white-space: nowrap;
  flex-shrink: 0;
  line-height: 1.3;
}
#strip-btn:hover {
  background: rgba(79,110,242,0.12);
}
#strip-btn:focus-visible {
  outline: 2px solid var(--payload-bar);
  outline-offset: 2px;
}
#strip-btn:disabled {
  opacity: 0.4;
  cursor: default;
}

/* Ratio badge */
.ratio-badge {
  font-size: 15px;
  font-weight: 600;
  color: var(--payload-bar);
  background: var(--badge-bg);
  border: 1px solid var(--badge-border);
  padding: 4px 14px;
  border-radius: 20px;
  white-space: nowrap;
  font-family: var(--font-mono, monospace);
  flex-shrink: 0;
}
</style>
</head>
<body data-page="37" data-total="50">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
(function () {
  'use strict';

  /* === Constants (from PLAN.md p37, Saturn V / Apollo 11 reference) === */
  var LAUNCH_MASS  = 2850;   // t, Saturn V launch mass
  var PAYLOAD_TLI  = 45;     // t, TLI payload
  var STAGE_1_MASS = 2235;   // t, stage 1 total mass
  var STAGE_2_MASS = 471;    // t, stage 2 total mass
  var STAGE_3_MASS = 99;     // t, stage 3 total mass
  // Source: PLAN.md p37 constants table

  var MASS_RATIO   = LAUNCH_MASS / PAYLOAD_TLI;  // 63.33
  var PAYLOAD_FRAC = 1 / MASS_RATIO;              // ~1.58%

  /* Stage data — the stripping chain */
  var STAGES = [
    { id:'launch',   name:'满箭起飞',   sub:'起飞',        segMass:LAUNCH_MASS,  remaining:LAUNCH_MASS,  pct:100,  color:'type-fuel',   anno:'' },
    { id:'stage1',   name:'一级烧完',   sub:'抛弃第一级',  segMass:STAGE_1_MASS, remaining:LAUNCH_MASS - STAGE_1_MASS, pct:78,   color:'type-fuel',   anno:'最大的一段，几乎全是燃料' },
    { id:'stage2',   name:'二级烧完',   sub:'抛弃第二级',  segMass:STAGE_2_MASS, remaining:LAUNCH_MASS - STAGE_1_MASS - STAGE_2_MASS, pct:16.5, color:'type-struct', anno:'烧完，再扔' },
    { id:'stage3',   name:'三级烧完',   sub:'抛弃第三级',  segMass:STAGE_3_MASS, remaining:LAUNCH_MASS - STAGE_1_MASS - STAGE_2_MASS - STAGE_3_MASS, pct:3.5,  color:'type-struct', anno:'仍然烧完就扔' },
    { id:'payload',  name:'有效载荷',   sub:'飞往月球',    segMass:PAYLOAD_TLI,   remaining:PAYLOAD_TLI,  pct:1.6,  color:'type-payload', anno:'这就是你要送的东西' }
  ];

  /* Scale all masses by factor = payloadT / PAYLOAD_TLI */
  function scaleStages(payloadT) {
    var r = payloadT / PAYLOAD_TLI;
    return STAGES.map(function(s) {
      return {
        id: s.id, name: s.name, sub: s.sub,
        segMass: s.segMass * r,
        remaining: s.remaining * r,
        pct: s.pct,
        color: s.color,
        anno: s.anno
      };
    });
  }

  /* Slider: payloadT = 10^(-3 + 4.699 * x), x ∈ [0,1] */
  function sliderToPayload(x) {
    return Math.pow(10, -3 + 4.699 * x);
  }
  function payloadToSlider(v) {
    return (Math.log10(v) + 3) / 4.699;
  }

  /* === Build DOM === */
  var main = document.getElementById('main');
  main.innerHTML = '';

  var layout = document.createElement('div');
  layout.className = 'page-37-layout';

  // Rocket silhouette
  var rocketCol = document.createElement('div');
  rocketCol.className = 'rocket-col';
  var rImg = document.createElement('img');
  rImg.src = 'assets/img/p37-saturn-v.png';
  rImg.alt = '土星五号轮廓';
  rImg.title = '土星五号 Saturn V — NASA 公共领域资料';
  rocketCol.appendChild(rImg);
  layout.appendChild(rocketCol);

  // Ledger
  var ledger = document.createElement('div');
  ledger.className = 'ledger k-process is-vertical';

  var stepEls = [], barFills = [], segEls = [], remEls = [], pctEls = [];

  STAGES.forEach(function(s, i) {
    // Arrow between steps
    if (i > 0) {
      var arw = document.createElement('div');
      arw.className = 'arw-step';
      var line = document.createElement('span');
      line.className = 'arw-line';
      arw.appendChild(line);
      var head = document.createElement('span');
      head.className = 'arw-head';
      head.textContent = '▼';
      arw.appendChild(head);
      ledger.appendChild(arw);
    }

    var step = document.createElement('div');
    step.className = 'step';
    step.dataset.step = i;

    var row = document.createElement('div');
    row.className = 'step-row';

    // Name column
    var nameCol = document.createElement('div');
    nameCol.className = 'step-name';
    nameCol.textContent = s.name;
    var sub = document.createElement('span');
    sub.className = 'sub';
    sub.textContent = s.sub;
    nameCol.appendChild(sub);
    row.appendChild(nameCol);

    // Bar area
    var barArea = document.createElement('div');
    barArea.className = 'bar-area';

    var track = document.createElement('div');
    track.className = 'bar-track';
    var fill = document.createElement('div');
    fill.className = 'bar-fill ' + s.color;
    fill.style.width = '0%';
    track.appendChild(fill);
    barArea.appendChild(track);

    // Payload callout
    if (s.id === 'payload') {
      var callout = document.createElement('div');
      callout.className = 'payload-callout';
      callout.title = '有效载荷仅占起飞质量的约 1.6%';
      callout.textContent = 'ⓘ';
      barArea.appendChild(callout);
    }

    row.appendChild(barArea);

    // Mass values: [本段质量] → [剩余质量] [占比]
    var mv = document.createElement('div');
    mv.className = 'mass-vals';

    var segSpan = document.createElement('span');
    segSpan.className = 'mv mv-seg';
    if (i === 0 || i === 4) {
      segSpan.innerHTML = '—';
    } else {
      segSpan.innerHTML = '<strong>0</strong> t';
    }

    var sep = document.createElement('span');
    sep.className = 'mv-sep';
    sep.textContent = '→';

    var remSpan = document.createElement('span');
    remSpan.className = 'mv mv-rem';
    remSpan.innerHTML = '<strong>0</strong> t';

    var pctSpan = document.createElement('span');
    pctSpan.className = 'mv mv-pct';
    pctSpan.textContent = '0%';

    mv.appendChild(segSpan);
    mv.appendChild(sep);
    mv.appendChild(remSpan);
    mv.appendChild(pctSpan);
    row.appendChild(mv);

    step.appendChild(row);

    // Annotation
    if (s.anno) {
      var anno = document.createElement('div');
      anno.className = 'step-anno';
      anno.textContent = s.anno;
      step.appendChild(anno);
    }

    ledger.appendChild(step);
    stepEls.push(step);
    barFills.push(fill);
    segEls.push(segSpan);
    remEls.push(remSpan);
    pctEls.push(pctSpan);
  });

  layout.appendChild(ledger);
  main.appendChild(layout);

  // === Control bar ===
  var ctlBar = document.createElement('div');
  ctlBar.className = 'ctl-bar';

  // Slider
  var sw = document.createElement('div');
  sw.className = 'slider-wrap';
  var sl = document.createElement('label');
  sl.htmlFor = 'mass-slider';
  sl.textContent = '有效载荷';
  var slider = document.createElement('input');
  slider.type = 'range';
  slider.id = 'mass-slider';
  slider.min = '0';
  slider.max = '1';
  slider.step = '0.001';
  slider.value = payloadToSlider(PAYLOAD_TLI).toString();
  slider.tabIndex = 0;
  var sro = document.createElement('span');
  sro.className = 'slider-readout';
  sro.textContent = '45 t';
  sw.appendChild(sl);
  sw.appendChild(slider);
  sw.appendChild(sro);
  ctlBar.appendChild(sw);

  // Presets
  var presets = document.createElement('div');
  presets.className = 'presets';
  var presetVals = [
    { label:'1 kg', v:0.001 },
    { label:'1 t',  v:1 },
    { label:'3 t',  v:3 },
    { label:'15 t', v:15 },
    { label:'45 t', v:45 }
  ];
  var presetBtns = [];
  presetVals.forEach(function(p) {
    var btn = document.createElement('button');
    btn.textContent = p.label;
    btn.dataset.value = p.v;
    btn.tabIndex = 0;
    btn.addEventListener('click', function() { setPayload(p.v); });
    btn.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setPayload(p.v); }
    });
    presets.appendChild(btn);
    presetBtns.push(btn);
  });
  ctlBar.appendChild(presets);

  // Strip button
  var stripBtn = document.createElement('button');
  stripBtn.id = 'strip-btn';
  stripBtn.textContent = '▶ 剥离播放';
  stripBtn.tabIndex = 0;
  ctlBar.appendChild(stripBtn);

  // Ratio badge
  var badge = document.createElement('div');
  badge.className = 'ratio-badge';
  badge.textContent = '质量比 ' + Math.round(MASS_RATIO) + ' : 1';
  ctlBar.appendChild(badge);

  main.appendChild(ctlBar);

  /* === State === */
  var currentPayloadT = PAYLOAD_TLI;
  var isAnimating = false;
  var tl = null;

  /* === Update function === */
  function update(payloadT) {
    currentPayloadT = payloadT;
    var scaled = scaleStages(payloadT);
    var maxSeg = scaled[0].segMass;

    // Readout
    sro.textContent = payloadT < 0.01 ? (payloadT * 1000).toFixed(0) + ' kg' : payloadT.toFixed(1) + ' t';

    // Ratio
    var ratio = maxSeg / payloadT;
    badge.textContent = '质量比 ' + (ratio > 100 ? ratio.toFixed(0) : ratio.toFixed(1)) + ' : 1';

    scaled.forEach(function(s, i) {
      var pct = maxSeg > 0 ? (s.segMass / maxSeg) * 100 : 0;
      barFills[i].style.width = Math.max(0.5, pct) + '%';

      // Format masses
      var segStr = s.segMass >= 1 ? s.segMass.toFixed(0) + ' t' : (s.segMass * 1000).toFixed(0) + ' kg';
      var remStr = s.remaining >= 1 ? s.remaining.toFixed(0) + ' t' : (s.remaining * 1000).toFixed(0) + ' kg';

      if (i === 0) {
        // Launch: show full mass as remaining
        segEls[i].innerHTML = '—';
        remEls[i].innerHTML = '<strong>' + segStr + '</strong>';
      } else if (i === 4) {
        // Payload: show as remaining
        segEls[i].innerHTML = '—';
        remEls[i].innerHTML = '<strong>' + segStr + '</strong>';
      } else {
        segEls[i].innerHTML = '<strong>' + segStr + '</strong>';
        remEls[i].innerHTML = '<strong>' + remStr + '</strong>';
      }

      pctEls[i].textContent = (i === 0 ? 100 : s.pct) + '%';
    });
  }

  function setPayload(payloadT) {
    if (isAnimating) return;
    payloadT = Math.max(0.001, Math.min(50, payloadT));
    slider.value = payloadToSlider(payloadT).toString();
    update(payloadT);

    // Reset stripped state
    stepEls.forEach(function(el) { el.classList.remove('stripped'); });

    // Highlight active preset
    presetBtns.forEach(function(btn) {
      var val = parseFloat(btn.dataset.value);
      btn.classList.toggle('active', Math.abs(val - payloadT) < 0.001);
    });
  }

  // Slider input
  slider.addEventListener('input', function() {
    var x = parseFloat(slider.value);
    setPayload(sliderToPayload(x));
  });
  slider.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
      e.preventDefault();
      slider.value = Math.min(1, parseFloat(slider.value) + 0.01);
      slider.dispatchEvent(new Event('input'));
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      e.preventDefault();
      slider.value = Math.max(0, parseFloat(slider.value) - 0.01);
      slider.dispatchEvent(new Event('input'));
    }
  });

  /* === Strip animation === */
  function playStrip() {
    if (isAnimating) return;
    if (tl) { tl.kill(); tl = null; }
    isAnimating = true;
    stripBtn.disabled = true;
    stripBtn.textContent = '⋯ 剥离中';

    // Reset
    stepEls.forEach(function(el) { el.classList.remove('stripped'); });

    tl = gsap.timeline({
      defaults: { ease: 'power2.inOut' },
      onComplete: function() {
        isAnimating = false;
        stripBtn.disabled = false;
        stripBtn.textContent = '▶ 剥离播放';
        tl = null;
      }
    });

    // Stage 1 (index 1) fades out → 2850 → 615
    tl.to(stepEls[1], { opacity: 0.18, duration: 0.5 })
      .to(barFills[1], { opacity: 0.08, duration: 0.3 }, '<')
      .call(function() { stepEls[1].classList.add('stripped'); }, [], '<')

    // Stage 2 (index 2) fades out → 615 → 144
    .to(stepEls[2], { opacity: 0.18, duration: 0.5 }, '+=0.3')
    .to(barFills[2], { opacity: 0.08, duration: 0.3 }, '<')
    .call(function() { stepEls[2].classList.add('stripped'); }, [], '<')

    // Stage 3 (index 3) fades out → 144 → 45
    .to(stepEls[3], { opacity: 0.18, duration: 0.5 }, '+=0.3')
    .to(barFills[3], { opacity: 0.08, duration: 0.3 }, '<')
    .call(function() { stepEls[3].classList.add('stripped'); }, [], '<')

    // Highlight payload (index 4)
    .to(stepEls[4], { borderColor: '#4f6ef2', backgroundColor: 'rgba(79,110,242,0.08)', duration: 0.4 }, '+=0.2');
  }

  stripBtn.addEventListener('click', playStrip);
  stripBtn.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); playStrip(); }
  });

  /* === Mount === */
  Lec.mount({
    index: 37,
    kicker: '质量比',
    title: '你拿了多少，火箭就要拿多少',
    take: '火箭大，不是因为它装得多，而是因为它要搬运自己的燃料——每 1 克有效载荷，约需 63 克整枚火箭。'
  });

  /* === Initial render === */
  setPayload(PAYLOAD_TLI);

})();
</script>
