<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/lib/matter.min.js"></script>
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}
/* #main from theme.css has width:100vw but sits inside padded #stage.
   Override to fill the stage's content area (1408×620) instead. */
#main {
  width: 100%;
  height: 100%;
  overflow: hidden;
}
/* simulation canvas container */
.sim-wrap {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  border-radius: 10px;
  overflow: hidden;
  background: #0f172a;
  border: 1px solid rgba(255,255,255,0.08);
}
#simCanvas {
  display: block;
}
/* right panel */
.info-panel {
  flex: 0 0 auto;
  width: 380px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow: hidden;
}
/* momentum bar track */
.mbar-track {
  position: relative;
  height: 20px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 4px;
  overflow: hidden;
}
.mbar-track .midline {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 2px;
  background: rgba(255,255,255,0.2);
  transform: translateX(-50%);
}
.mbar-fill {
  position: absolute;
  top: 2px;
  bottom: 2px;
  border-radius: 3px;
  transition: width 0.25s ease;
}
.mbar-fill.gas {
  right: 50%;
  background: #ef4444;
}
.mbar-fill.boat {
  left: 50%;
  background: #3b82f6;
}
/* inflate button */
#inflateBtn {
  padding: 8px 28px;
  border: 1px solid var(--accent);
  background: var(--accent-soft);
  border-radius: 6px;
  cursor: pointer;
  color: var(--text);
  font-size: var(--fs-body);
  font-weight: 600;
  transition: background 0.15s, transform 0.1s;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
#inflateBtn:hover {
  background: rgba(79, 110, 242, 0.22);
}
#inflateBtn:active {
  transform: scale(0.96);
}
#inflateBtn.active {
  background: rgba(239, 68, 68, 0.25);
  border-color: #ef4444;
}
#inflateBtn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
#inflateBtn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
/* speed slider */
.speed-ctl {
  display: flex;
  align-items: center;
  gap: 8px;
}
.speed-ctl input[type="range"] {
  width: 120px;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
  outline: none;
}
.speed-ctl input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 2px solid var(--bg);
}
.speed-ctl input[type="range"]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 2px solid var(--bg);
}
/* annotation for simulation */
.sim-note {
  position: absolute;
  font-size: var(--fs-label);
  color: rgba(255,255,255,0.35);
  pointer-events: none;
}
/* momentum value labels */
.momentum-label {
  font-size: var(--fs-label);
  color: var(--muted);
  white-space: nowrap;
}
.momentum-value {
  font-size: var(--fs-label);
  font-family: var(--font-mono);
  font-weight: 600;
}
</style>
</head>
<body data-page="38" data-total="50">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  'use strict';

  /* ---- 页装 ---- */
  Lec.mount({
    index: 38,
    title: '动量守恒的气球船',
    sub: '向后喷出气体，船体向前——动量守恒把化学能变成推力',
    foot: '按住「充气」蓄力，松开后观察动量守恒'
  });

  /* ---- 全套口径常量 ---- */
  // 单次喷出气体质量取 5 g = 0.005 kg（交互体验标定值）
  function exhaustMass() { return 0.005; }
  // 模型船体质量取 0.5 kg（便于数值可读）
  function boatMass() { return 0.5; }
  // 充气速率：每秒累积的气体质量
  var GAS_RATE = 0.002; // kg/s
  // 最大充气时间
  var MAX_INFLATE = 3; // seconds

  /* ---- DOM 引用 ---- */
  var main = document.getElementById('main');
  var stage = document.getElementById('stage');

  /* ---- HTML 结构 ---- */
  main.innerHTML =
    '<div class="row gap-4" style="height:100%;">' +
      /* 左侧：仿真画布 */
      '<div class="sim-wrap">' +
        '<canvas id="simCanvas"></canvas>' +
      '</div>' +
      /* 右侧：信息面板 */
      '<div class="info-panel">' +
        /* 对比表 */
        '<div class="k-comparison" style="--k-comp-cols:2;">' +
          '<div class="hdr">维度</div>' +
          '<div class="hdr">喷出前</div>' +
          '<div class="hdr">喷出后</div>' +
          '<div class="dim">气体动量</div>' +
          '<div id="gBefore" class="momentum-value" style="color:#ef4444;">0</div>' +
          '<div id="gAfter" class="momentum-value" style="color:#ef4444;">—</div>' +
          '<div class="dim">船体动量</div>' +
          '<div id="bBefore" class="momentum-value" style="color:#3b82f6;">0</div>' +
          '<div id="bAfter" class="momentum-value" style="color:#3b82f6;">—</div>' +
          '<div class="dim">系统总动量</div>' +
          '<div id="tBefore" class="momentum-value">0</div>' +
          '<div id="tAfter" class="momentum-value">0</div>' +
        '</div>' +
        /* 动量条面板 */
        '<div class="panel" style="flex:0 0 auto; display:flex; flex-direction:column; gap:6px; padding:12px 16px;">' +
          '<div class="row items-center" style="height:18px; gap:8px;">' +
            '<span class="no-shrink momentum-label" style="width:48px; color:#ef4444;">气体</span>' +
            '<div class="mbar-track grow">' +
              '<div class="midline"></div>' +
              '<div id="gasBar" class="mbar-fill gas" style="width:0%;"></div>' +
            '</div>' +
          '</div>' +
          '<div class="row items-center" style="height:18px; gap:8px;">' +
            '<span class="no-shrink momentum-label" style="width:48px; color:#3b82f6;">船体</span>' +
            '<div class="mbar-track grow">' +
              '<div class="midline"></div>' +
              '<div id="boatBar" class="mbar-fill boat" style="width:0%;"></div>' +
            '</div>' +
          '</div>' +
          '<div class="row justify-between items-center" style="margin-top:2px;">' +
            '<span class="momentum-label" style="font-size:var(--fs-label);">← 向后</span>' +
            '<span class="momentum-label" style="font-size:var(--fs-label);">向前 →</span>' +
          '</div>' +
        '</div>' +
        /* 数值显示 */
        '<div class="row justify-between items-center" style="padding:0 4px;">' +
          '<div class="col">' +
            '<span class="momentum-label" style="font-size:var(--fs-sec);">气体动量</span>' +
            '<span id="gasMomentumDisp" class="momentum-value" style="font-size:var(--fs-body); color:#ef4444;">0 kg·m/s</span>' +
          '</div>' +
          '<div class="col" style="text-align:right;">' +
            '<span class="momentum-label" style="font-size:var(--fs-sec);">船体动量</span>' +
            '<span id="boatMomentumDisp" class="momentum-value" style="font-size:var(--fs-body); color:#3b82f6;">0 kg·m/s</span>' +
          '</div>' +
        '</div>' +
        /* 总动量 */
        '<div class="note" style="font-size:var(--fs-body); font-weight:700; margin:0;">' +
          '系统总动量 = <span id="totalDisp" style="font-family:var(--font-mono);">0</span> kg·m/s' +
        '</div>' +
        '<div class="note" style="font-size:var(--fs-sec); margin:0; text-align:left;">' +
          '火箭在真空中也能推进——它不靠推空气，而是把自身的一部分向后抛出去。' +
        '</div>' +
        '<div class="note" style="font-size:var(--fs-sec); margin:0; text-align:left;">' +
          '喷得越快、喷得越多，船获得的速度就越大。试试调节滑块和充气时长。' +
        '</div>' +
        /* 控件 */
        '<div class="ctl row items-center gap-3" style="padding:4px 0;flex-wrap:wrap;">' +
          '<button id="inflateBtn">充气</button>' +
          '<div class="speed-ctl">' +
            '<label class="fs-label no-shrink">喷气速度</label>' +
            '<input type="range" id="speedSlider" min="5" max="20" value="10" step="1">' +
            '<span id="speedVal" class="fs-label" style="min-width:44px;font-family:var(--font-mono);">10</span>' +
            '<span class="fs-label">m/s</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  /* ---- DOM 缓存 ---- */
  var cv = document.getElementById('simCanvas');
  var gasBar = document.getElementById('gasBar');
  var boatBar = document.getElementById('boatBar');
  var gasMomentumDisp = document.getElementById('gasMomentumDisp');
  var boatMomentumDisp = document.getElementById('boatMomentumDisp');
  var totalDisp = document.getElementById('totalDisp');
  var gBefore = document.getElementById('gBefore');
  var gAfter = document.getElementById('gAfter');
  var bBefore = document.getElementById('bBefore');
  var bAfter = document.getElementById('bAfter');
  var tBefore = document.getElementById('tBefore');
  var tAfter = document.getElementById('tAfter');
  var inflateBtn = document.getElementById('inflateBtn');
  var speedSlider = document.getElementById('speedSlider');
  var speedVal = document.getElementById('speedVal');

  /* ---- 仿真状态 ---- */
  var sim = {
    phase: 'idle',      // idle | inflating | firing | settling
    inflateTime: 0,     // seconds of inflation
    gasMass: 0,         // kg
    exhaustSpeed: 10,   // m/s
    gasMom: 0,          // kg·m/s (negative = leftward)
    boatMom: 0,         // kg·m/s (positive = rightward)
    boatX: 0,           // pixels from center (read from Matter body)
    particles: [],      // {x, y, vx, vy, life, maxLife}
    balloonRadius: 0,
    firingTimer: 0,
    lastTime: 0
  };

  var BOAT_WIDTH = 100;
  var BOAT_HEIGHT = 24;
  var BOAT_Y = 240;  // water level Y

  /* ---- Matter.js ---- */
  var MatterObj = window.Matter;
  var Engine = MatterObj.Engine;
  var Bodies = MatterObj.Bodies;
  var Body = MatterObj.Body;
  var Composite = MatterObj.Composite;

  var engine = Engine.create({
    gravity: { x: 0, y: 0 },
    enableSleeping: false
  });

  // Boat body — only horizontal motion, frictionAir handles deceleration
  var boatBody = Bodies.rectangle(0, BOAT_Y, BOAT_WIDTH, BOAT_HEIGHT, {
    frictionAir: 0.03,
    restitution: 0,
    mass: boatMass()   // 0.5 kg
  });
  Composite.add(engine.world, boatBody);

  // Keep boat at water level, no rotation, read X from body
  function lockBoat() {
    Body.setPosition(boatBody, {
      x: boatBody.position.x,
      y: BOAT_Y
    });
    Body.setAngle(boatBody, 0);
    Body.setVelocity(boatBody, {
      x: boatBody.velocity.x,
      y: 0
    });
  }

  /* ---- Canvas 尺寸 ---- */
  var W, H, ctx, ratio;

  function resizeCanvas() {
    var rect = cv.parentElement.getBoundingClientRect();
    W = Math.round(rect.width);
    H = Math.round(rect.height);
    ctx = Deck.fit(cv);
    // Set logical size for Matter.js coordinate system
    cv.width = W;
    cv.height = H;
    ratio = cv.width / cv.offsetWidth || 1;
    // Reset boat position
    Body.setPosition(boatBody, { x: 0, y: BOAT_Y });
    sim.boatX = 0;
  }

  /* ---- 绘制 ---- */
  var WATER_Y = 280;

  function drawScene() {
    var ctx2d = ctx;
    var w = cv.width;
    var h = cv.height;
    if (!w || !h) return;

    // Clear
    ctx2d.clearRect(0, 0, w, h);

    // Sky gradient
    var skyGrad = ctx2d.createLinearGradient(0, 0, 0, WATER_Y);
    skyGrad.addColorStop(0, '#0f172a');
    skyGrad.addColorStop(1, '#1e293b');
    ctx2d.fillStyle = skyGrad;
    ctx2d.fillRect(0, 0, w, WATER_Y + 4);

    // Water
    var waterGrad = ctx2d.createLinearGradient(0, WATER_Y, 0, h);
    waterGrad.addColorStop(0, '#1a3a5c');
    waterGrad.addColorStop(0.5, '#0f2847');
    waterGrad.addColorStop(1, '#0a1a30');
    ctx2d.fillStyle = waterGrad;
    ctx2d.fillRect(0, WATER_Y, w, h - WATER_Y);

    // Water surface line
    ctx2d.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx2d.lineWidth = 1;
    ctx2d.beginPath();
    ctx2d.moveTo(0, WATER_Y);
    ctx2d.lineTo(w, WATER_Y);
    ctx2d.stroke();

    // Water ripples
    ctx2d.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx2d.lineWidth = 1;
    var t = performance.now() / 1000;
    for (var i = 0; i < 6; i++) {
      var y = WATER_Y + 6 + i * 12;
      ctx2d.beginPath();
      for (var x = 0; x < w; x += 2) {
        var yy = y + Math.sin(x * 0.03 + t * 0.8 + i * 1.5) * 2;
        if (x === 0) ctx2d.moveTo(x, yy);
        else ctx2d.lineTo(x, yy);
      }
      ctx2d.stroke();
    }

    // Boat position (in canvas coords)
    var cx = w / 2 + sim.boatX;
    var by = BOAT_Y;

    // Gas particles
    for (var pi = sim.particles.length - 1; pi >= 0; pi--) {
      var p = sim.particles[pi];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05; // slight downward drift
      p.life--;

      if (p.life <= 0) {
        sim.particles.splice(pi, 1);
        continue;
      }

      var alpha = p.life / p.maxLife;
      var radius = 3 + (1 - alpha) * 4;
      ctx2d.globalAlpha = alpha * 0.6;
      ctx2d.fillStyle = 'rgba(147, 197, 253, 0.8)';
      ctx2d.beginPath();
      ctx2d.arc(p.x, p.y, radius, 0, Math.PI * 2);
      ctx2d.fill();
    }
    ctx2d.globalAlpha = 1;

    // Balloon
    var balloonR = sim.balloonRadius;
    if (balloonR > 0) {
      var bx = cx;
      var byBalloon = by - BOAT_HEIGHT / 2 - balloonR - 4;
      ctx2d.fillStyle = 'rgba(239, 68, 68, 0.7)';
      ctx2d.strokeStyle = 'rgba(239, 68, 68, 0.9)';
      ctx2d.lineWidth = 2;
      ctx2d.beginPath();
      ctx2d.arc(bx, byBalloon, balloonR, 0, Math.PI * 2);
      ctx2d.fill();
      ctx2d.stroke();

      // Balloon neck (small triangle connecting to boat)
      ctx2d.strokeStyle = 'rgba(239, 68, 68, 0.5)';
      ctx2d.lineWidth = 2;
      ctx2d.beginPath();
      ctx2d.moveTo(bx - 4, byBalloon + balloonR);
      ctx2d.lineTo(bx, by - BOAT_HEIGHT / 2);
      ctx2d.lineTo(bx + 4, byBalloon + balloonR);
      ctx2d.stroke();
    }

    // Boat body
    Deck.rr(ctx2d, cx - BOAT_WIDTH / 2, by - BOAT_HEIGHT / 2, BOAT_WIDTH, BOAT_HEIGHT, 6);
    ctx2d.fillStyle = '#475569';
    ctx2d.fill();
    ctx2d.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx2d.lineWidth = 1;
    ctx2d.stroke();

    // Boat deck highlight
    Deck.rr(ctx2d, cx - BOAT_WIDTH / 2 + 4, by - BOAT_HEIGHT / 2 + 3, BOAT_WIDTH - 8, 6, 3);
    ctx2d.fillStyle = 'rgba(255,255,255,0.08)';
    ctx2d.fill();

    // Exhaust nozzle (small rectangle at back of boat)
    var nozzleX = cx - BOAT_WIDTH / 2 - 8;
    ctx2d.fillStyle = '#334155';
    ctx2d.fillRect(nozzleX, by - 6, 8, 12);

    // Exhaust flame when firing
    if (sim.phase === 'firing' || sim.phase === 'settling') {
      var flameLen = 12 + Math.random() * 8;
      var grad = ctx2d.createLinearGradient(nozzleX, by, nozzleX - flameLen, by);
      grad.addColorStop(0, 'rgba(251, 191, 36, 0.8)');
      grad.addColorStop(0.5, 'rgba(251, 146, 60, 0.4)');
      grad.addColorStop(1, 'rgba(251, 146, 60, 0)');
      ctx2d.fillStyle = grad;
      ctx2d.beginPath();
      ctx2d.moveTo(nozzleX, by - 8);
      ctx2d.lineTo(nozzleX - flameLen, by);
      ctx2d.lineTo(nozzleX, by + 8);
      ctx2d.closePath();
      ctx2d.fill();
    }

    // Labels
    ctx2d.fillStyle = 'rgba(255,255,255,0.25)';
    ctx2d.font = '13px ' + getComputedStyle(document.body).fontFamily;
    ctx2d.textAlign = 'center';
    ctx2d.fillText('← 喷出气体', nozzleX - 30, by - 20);
    ctx2d.fillText('船体前进 →', cx + BOAT_WIDTH / 2 + 30, by - 20);
  }

  /* ---- 物理更新 ---- */
  function updatePhysics(dt) {
    if (dt > 0.05) dt = 0.05;

    switch (sim.phase) {
      case 'idle':
        // Boat decelerates via Matter.js frictionAir;
        // read position from body
        sim.boatX = boatBody.position.x;
        // When nearly stopped, zero out to prevent drift
        if (Math.abs(boatBody.velocity.x) < 0.5) {
          Body.setVelocity(boatBody, { x: 0, y: 0 });
        }
        // Fade momentum bars
        if (sim.gasMom !== 0 || sim.boatMom !== 0) {
          sim.gasMom *= 0.95;
          sim.boatMom *= 0.95;
          if (Math.abs(sim.gasMom) < 0.001) {
            sim.gasMom = 0;
            sim.boatMom = 0;
          }
          updateMomentumDisplay();
        }
        break;

      case 'inflating':
        sim.inflateTime += dt;
        if (sim.inflateTime > MAX_INFLATE) sim.inflateTime = MAX_INFLATE;
        sim.gasMass = GAS_RATE * sim.inflateTime;
        sim.balloonRadius = 6 + sim.inflateTime / MAX_INFLATE * 24;
        break;

      case 'firing':
        // Calculate momentum: p = m × v
        sim.gasMom = -(sim.gasMass * sim.exhaustSpeed);
        sim.boatMom = -sim.gasMom;

        // Apply impulse to boat body (rightward)
        // Scale: 1 m/s ≈ 300 px/s for visible motion
        var deltaV = (sim.boatMom / boatMass()) * 300;
        Body.setVelocity(boatBody, { x: deltaV, y: 0 });

        // Create gas particles (visual only)
        var cx = cv.width / 2 + boatBody.position.x;
        var numParticles = Math.min(Math.round(sim.gasMass * 800), 40);
        for (var i = 0; i < numParticles; i++) {
          sim.particles.push({
            x: cx - BOAT_WIDTH / 2 - 8,
            y: BOAT_Y + (Math.random() - 0.5) * 12,
            vx: -(sim.exhaustSpeed * 3 + Math.random() * 10),
            vy: (Math.random() - 0.5) * 4,
            life: 30 + Math.random() * 30,
            maxLife: 30 + Math.random() * 30
          });
        }

        updateMomentumDisplay();
        sim.phase = 'settling';
        sim.firingTimer = 0.5;
        break;

      case 'settling':
        sim.firingTimer -= dt;
        sim.boatX = boatBody.position.x;

        // Balloon deflates
        sim.balloonRadius *= 0.85;
        if (sim.balloonRadius < 1) sim.balloonRadius = 0;

        if (sim.firingTimer <= 0 && sim.particles.length === 0) {
          sim.phase = 'idle';
        }
        break;
    }

    lockBoat();
  }

  /* ---- 动量显示更新 ---- */
  function updateMomentumDisplay() {
    var gm = sim.gasMom;
    var bm = sim.boatMom;
    var absMax = Math.max(Math.abs(gm), 0.01);
    var maxDisplay = 0.2; // kg·m/s for full bar (calibration: 0.005kg * 20m/s = 0.1)
    var pct = Math.min(Math.abs(gm) / maxDisplay * 50, 50);

    // Update bars
    gasBar.style.width = pct + '%';
    boatBar.style.width = pct + '%';

    // Update number displays
    gasMomentumDisp.textContent = gm.toFixed(3) + ' kg·m/s';
    boatMomentumDisp.textContent = '+' + bm.toFixed(3) + ' kg·m/s';
    totalDisp.textContent = (gm + bm).toFixed(3);

    // Update comparison table
    gAfter.textContent = gm.toFixed(3);
    bAfter.textContent = '+' + bm.toFixed(3);
    tAfter.textContent = (gm + bm).toFixed(3);
  }

  function resetMomentumDisplay() {
    gasBar.style.width = '0%';
    boatBar.style.width = '0%';
    gasMomentumDisp.textContent = '0 kg·m/s';
    boatMomentumDisp.textContent = '0 kg·m/s';
    totalDisp.textContent = '0';
    gAfter.textContent = '—';
    bAfter.textContent = '—';
    tAfter.textContent = '0';
  }

  /* ---- 交互 ---- */
  var isKeyboardInflate = false;

  function startInflate() {
    if (sim.phase !== 'idle') return;
    sim.phase = 'inflating';
    sim.inflateTime = 0;
    sim.gasMass = 0;
    sim.balloonRadius = 6;
    inflateBtn.classList.add('active');
    inflateBtn.textContent = '充气中…';
    resetMomentumDisplay();
  }

  function releaseInflate() {
    if (sim.phase !== 'inflating') return;
    if (sim.inflateTime < 0.2) {
      // Too short, reset
      sim.phase = 'idle';
      sim.inflateTime = 0;
      sim.gasMass = 0;
      sim.balloonRadius = 0;
      inflateBtn.classList.remove('active');
      inflateBtn.textContent = '充气';
      return;
    }
    // Fire!
    sim.phase = 'firing';
    inflateBtn.classList.remove('active');
    inflateBtn.textContent = '充气';
    // Fire happens in the next physics update
  }

  // Mouse / touch
  inflateBtn.addEventListener('mousedown', function(e) {
    e.preventDefault();
    startInflate();
  });
  document.addEventListener('mouseup', function(e) {
    if (sim.phase === 'inflating') {
      releaseInflate();
    }
  });

  inflateBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    startInflate();
  }, { passive: false });
  document.addEventListener('touchend', function(e) {
    if (sim.phase === 'inflating') {
      releaseInflate();
    }
  });

  // Keyboard
  inflateBtn.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (sim.phase === 'idle') {
        startInflate();
        isKeyboardInflate = true;
      } else if (sim.phase === 'inflating' && isKeyboardInflate) {
        releaseInflate();
        isKeyboardInflate = false;
      }
    }
  });
  inflateBtn.addEventListener('keyup', function(e) {
    if (e.key === ' ' && sim.phase === 'inflating' && isKeyboardInflate) {
      e.preventDefault();
      releaseInflate();
      isKeyboardInflate = false;
    }
  });
  // Allow Enter to also release
  inflateBtn.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && sim.phase === 'inflating') {
      releaseInflate();
    }
  });

  // Speed slider
  speedSlider.addEventListener('input', function() {
    sim.exhaustSpeed = parseFloat(this.value);
    speedVal.textContent = this.value;
  });

  /* ---- 动画循环 ---- */
  var running = true;

  function step(time) {
    if (!running) return;

    var dt = 0;
    if (sim.lastTime) {
      dt = (time - sim.lastTime) / 1000;
    }
    sim.lastTime = time;
    if (dt > 0.05) dt = 0.05;

    // Physics update
    Engine.update(engine, dt * 1000);
    updatePhysics(dt);

    // Draw
    drawScene();
  }

  /* ---- 启动 ---- */
  function init() {
    resizeCanvas();
    Deck.loop(step, { still: 0 });
  }

  // Handle resize
  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      resizeCanvas();
    }, 200);
  });

  // Wait for DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
