<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== page-39 太空竞赛账本 ===== */
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
  --accent-ussr: #f59e0b;
  --accent-usa: #60a5fa;
  --row-dim: 0.15;
  --row-year-dim: 0.35;
}

#stage {
  background: var(--bg);
  color: var(--text);
}

/* 让 #main 适应 stage 的 padding 内边距 */
#main {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* ---- 主布局 ---- */
.p39-wrap {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  overflow: hidden;
}

/* ---- 账本区 ---- */
.ledger-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 0 56px 0 48px;
  overflow: hidden;
  user-select: none;
}

/* 年份读数 */
.year-display {
  font-size: var(--fs-h1);
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
  line-height: 1.1;
  margin-bottom: 12px;
  flex-shrink: 0;
}

/* 账本行容器 */
.ledger-list {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 5px;
  justify-content: center;
  padding-bottom: 40px;
}

/* 单行 */
.ledger-row {
  display: grid;
  grid-template-columns: 72px 56px 1fr 1.6fr;
  gap: 10px;
  align-items: center;
  padding: 6px 14px;
  border-radius: 6px;
  background: rgba(255,255,255,0.02);
  opacity: var(--row-dim);
  transition: background 0.5s ease;
  min-height: 40px;
}

.ledger-row.lit {
  opacity: 1;
  background: rgba(255,255,255,0.05);
}

.ledger-row.current {
  background: rgba(79,110,242,0.12);
  border-left: 3px solid var(--accent);
}

/* 年份列 */
.ledger-row .ly {
  font-size: var(--fs-sec);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  opacity: 1;
}

/* 阵营列 */
.ledger-row .lcamp {
  font-size: var(--fs-label);
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
  text-align: center;
  line-height: 1.3;
}
.ledger-row .lcamp.ussr {
  color: var(--accent-ussr);
  background: rgba(245,158,11,0.12);
}
.ledger-row .lcamp.usa {
  color: var(--accent-usa);
  background: rgba(96,165,250,0.12);
}

/* 事件列 */
.ledger-row .levent {
  font-size: var(--fs-body);
  font-weight: 600;
  line-height: 1.3;
}

/* 事实列 */
.ledger-row .lfact {
  font-size: var(--fs-sec);
  color: var(--muted);
  line-height: 1.3;
}

/* 同年分组指示器 */
.ledger-row.same-year {
  border-left: 2px solid rgba(255,255,255,0.08);
  border-radius: 0 6px 6px 0;
  margin-left: 0;
  padding-left: 11px;
}

/* ---- 收束句 ---- */
.conclusion-wrap {
  position: absolute;
  bottom: 8px;
  left: 48px;
  opacity: 0;
  transition: opacity 0.6s ease;
  pointer-events: none;
}
.conclusion-wrap.visible {
  opacity: 1;
}
.conclusion-text {
  font-size: var(--fs-lead);
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.02em;
}

/* ---- 右侧滑块 ---- */
.slider-area {
  width: 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  flex-shrink: 0;
  cursor: pointer;
}

.slider-inner {
  position: relative;
  width: 4px;
  height: 65%;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  cursor: pointer;
}

.slider-fill {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0%;
  background: var(--accent);
  border-radius: 2px;
  pointer-events: none;
}

.slider-thumb {
  position: absolute;
  left: 50%;
  width: 18px;
  height: 18px;
  background: var(--accent);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 10px rgba(79,110,242,0.5);
  pointer-events: none;
  z-index: 2;
}

/* 滑块上的年份标签 */
.slider-labels {
  position: absolute;
  right: 100%;
  top: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding-right: 6px;
  pointer-events: none;
  opacity: 0.35;
}
.slider-labels span {
  font-size: 10px;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

/* ---- 焦点指示 ---- */
.slider-area:focus-within .slider-thumb {
  box-shadow: 0 0 0 3px rgba(79,110,242,0.3), 0 0 10px rgba(79,110,242,0.5);
}
.slider-area:focus-visible {
  outline: none;
}
.slider-area:focus-visible .slider-thumb {
  box-shadow: 0 0 0 3px rgba(79,110,242,0.4), 0 0 12px rgba(79,110,242,0.6);
}

/* ---- 工具 ---- */
.fs-mono { font-variant-numeric: tabular-nums; }
</style>
</head>
<body data-page="39" data-total="50">
<div id="stage">
<main id="main">
<div class="p39-wrap">
  <!-- 账本区 -->
  <div class="ledger-area" id="ledgerArea">
    <div class="year-display" id="yearDisplay">1957</div>
    <div class="ledger-list" id="ledgerList">
      <!-- 1957 · 苏联 · 斯普特尼克 1 号 -->
      <div class="ledger-row" data-year="1957" data-camp="ussr" data-idx="0">
        <span class="ly">1957</span>
        <span class="lcamp ussr">苏联</span>
        <span class="levent">斯普特尼克 1 号</span>
        <span class="lfact">第一颗人造卫星进入轨道</span>
      </div>
      <!-- 1957 · 苏联 · 斯普特尼克 2 号 -->
      <div class="ledger-row same-year" data-year="1957" data-camp="ussr" data-idx="1">
        <span class="ly">1957</span>
        <span class="lcamp ussr">苏联</span>
        <span class="levent">斯普特尼克 2 号</span>
        <span class="lfact">小狗莱卡成为第一个轨道动物</span>
      </div>
      <!-- 1958 · 美国 · 探险者 1 号 -->
      <div class="ledger-row" data-year="1958" data-camp="usa" data-idx="2">
        <span class="ly">1958</span>
        <span class="lcamp usa">美国</span>
        <span class="levent">探险者 1 号</span>
        <span class="lfact">美国的第一颗卫星</span>
      </div>
      <!-- 1961 · 苏联 · 东方 1 号 -->
      <div class="ledger-row" data-year="1961" data-camp="ussr" data-idx="3">
        <span class="ly">1961</span>
        <span class="lcamp ussr">苏联</span>
        <span class="levent">东方 1 号</span>
        <span class="lfact">加加林，第一个人进入太空</span>
      </div>
      <!-- 1961 · 美国 · 自由 7 号 -->
      <div class="ledger-row same-year" data-year="1961" data-camp="usa" data-idx="4">
        <span class="ly">1961</span>
        <span class="lcamp usa">美国</span>
        <span class="levent">自由 7 号</span>
        <span class="lfact">谢泼德，第一个进入太空的美国人</span>
      </div>
      <!-- 1962 · 美国 · 水星 6 号 -->
      <div class="ledger-row" data-year="1962" data-camp="usa" data-idx="5">
        <span class="ly">1962</span>
        <span class="lcamp usa">美国</span>
        <span class="levent">水星 6 号</span>
        <span class="lfact">格伦，第一个绕地的美国人</span>
      </div>
      <!-- 1965 · 苏联 · 上升 2 号 -->
      <div class="ledger-row" data-year="1965" data-camp="ussr" data-idx="6">
        <span class="ly">1965</span>
        <span class="lcamp ussr">苏联</span>
        <span class="levent">上升 2 号</span>
        <span class="lfact">列昂诺夫，第一次太空行走</span>
      </div>
      <!-- 1968 · 美国 · 阿波罗 8 号 -->
      <div class="ledger-row" data-year="1968" data-camp="usa" data-idx="7">
        <span class="ly">1968</span>
        <span class="lcamp usa">美国</span>
        <span class="levent">阿波罗 8 号</span>
        <span class="lfact">人类第一次绕月飞行</span>
      </div>
      <!-- 1969 · 美国 · 阿波罗 11 号 -->
      <div class="ledger-row" data-year="1969" data-camp="usa" data-idx="8">
        <span class="ly">1969</span>
        <span class="lcamp usa">美国</span>
        <span class="levent">阿波罗 11 号</span>
        <span class="lfact">人类第一次登月——脚印留在月球</span>
      </div>
    </div>
    <!-- 收束句 -->
    <div class="conclusion-wrap" id="conclusion">
      <span class="conclusion-text">从斯普特尼克到月球，12 年</span>
    </div>
  </div>

  <!-- 滑块区 -->
  <div class="slider-area" id="sliderArea" tabindex="0" role="slider"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="太空竞赛时间轴">
    <div class="slider-inner" id="sliderInner">
      <div class="slider-fill" id="sliderFill"></div>
      <div class="slider-thumb" id="sliderThumb"></div>
    </div>
  </div>
</div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/lib/ScrollTrigger.min.js"></script>
<script>
(function () {
  'use strict';

  /* === 注册 GSAP 插件 === */
  gsap.registerPlugin(ScrollTrigger);

  /* === 常量 === */
  var SPACE_AGE_START = 1957;           // 全套口径：Lec.K.SPACE_AGE_START_YEAR
  var APOLLO_11_MOON_YEAR = 1969;       // 全套口径
  var SPAN = APOLLO_11_MOON_YEAR - SPACE_AGE_START; // 12

  /* === 事件数据 === */
  var EVENTS = [
    { year: 1957, camp: 'ussr', el: null },
    { year: 1957, camp: 'ussr', el: null },
    { year: 1958, camp: 'usa',  el: null },
    { year: 1961, camp: 'ussr', el: null },
    { year: 1961, camp: 'usa',  el: null },
    { year: 1962, camp: 'usa',  el: null },
    { year: 1965, camp: 'ussr', el: null },
    { year: 1968, camp: 'usa',  el: null },
    { year: 1969, camp: 'usa',  el: null }
  ];

  /* === DOM 引用 === */
  var rows = document.querySelectorAll('.ledger-row');
  var yearDisplay = document.getElementById('yearDisplay');
  var conclusion = document.getElementById('conclusion');
  var sliderArea = document.getElementById('sliderArea');
  var sliderInner = document.getElementById('sliderInner');
  var sliderThumb = document.getElementById('sliderThumb');
  var sliderFill = document.getElementById('sliderFill');
  var ledgerArea = document.getElementById('ledgerArea');

  /* 绑定事件行到 DOM */
  EVENTS.forEach(function (evt, i) {
    evt.el = rows[i];
  });

  /* === 工具函数 === */
  function clamp(v, min, max) {
    return Math.min(max, Math.max(min, v));
  }

  /* === 构建 GSAP Timeline === */
  // 初始化：所有行暗色
  EVENTS.forEach(function (evt) {
    gsap.set(evt.el, { opacity: 0.15 });
  });
  gsap.set(conclusion, { opacity: 0 });

  // 创建暂停的 timeline，行在对应年份位置亮起
  var tl = gsap.timeline({ paused: true });

  EVENTS.forEach(function (evt, i) {
    // 每行在 (year - 1957) / 12 的位置亮起，持续 0.001（接近瞬发）
    var pos = (evt.year - SPACE_AGE_START) / SPAN;
    tl.to(evt.el, {
      opacity: 1,
      duration: 0.001,
      ease: 'none',
      onStart: function () {
        evt.el.classList.add('lit');
        evt.el.classList.add('current');
      },
      onReverseComplete: function () {
        evt.el.classList.remove('lit', 'current');
      }
    }, pos);
    // 短暂高亮后移除 current 类（除非滑块仍在该年份附近）
    tl.call(function () {
      evt.el.classList.remove('current');
    }, [], pos + 0.02);
  });

  // 收束句在终点出现
  tl.to(conclusion, {
    opacity: 1,
    duration: 0.35,
    ease: 'power2.out'
  }, 0.99);

  // 反向时收束句消失
  tl.to(conclusion, {
    opacity: 0,
    duration: 0.2,
    ease: 'power2.out'
  }, 0);

  /* === 更新画面（由 slider 驱动） === */
  function updateDisplay(p) {
    p = clamp(p, 0, 1);
    tl.progress(p);

    // 年份读数
    var year = Math.round(SPACE_AGE_START + p * SPAN);
    yearDisplay.textContent = year;

    // 滑块位置
    var fillPct = p * 100;
    sliderFill.style.height = fillPct + '%';
    sliderThumb.style.top = (100 - fillPct) + '%';

    // 滑块 ARIA 同步
    sliderArea.setAttribute('aria-valuenow', Math.round(fillPct));

    // 收束句 class 同步（补充 GSAP 的 opacity 动画）
    if (p >= 0.99) {
      conclusion.classList.add('visible');
    } else {
      conclusion.classList.remove('visible');
    }

    // 检查当前行高亮：当滑块在该行触发位置附近时重新加亮
    EVENTS.forEach(function (evt, i) {
      var triggerPos = (evt.year - SPACE_AGE_START) / SPAN;
      if (p >= triggerPos && p < triggerPos + 0.06) {
        evt.el.classList.add('current');
      } else {
        evt.el.classList.remove('current');
      }
    });
  }

  /* === 滑块交互 === */

  // 从鼠标/触摸位置计算进度
  function calcProgress(clientY) {
    var rect = sliderInner.getBoundingClientRect();
    var relY = clientY - rect.top;
    var p = 1 - (relY / rect.height);
    return clamp(p, 0, 1);
  }

  var isDragging = false;

  // 鼠标拖拽
  function onPointerDown(e) {
    isDragging = true;
    sliderArea.focus();
    var p = calcProgress(e.clientY);
    updateDisplay(p);
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!isDragging) return;
    var p = calcProgress(e.clientY);
    updateDisplay(p);
    e.preventDefault();
  }

  function onPointerUp() {
    isDragging = false;
  }

  // 键盘
  function onKeyDown(e) {
    var step = 0.02;
    var p = tl.progress(); // 直接从 timeline 读当前进度
    switch (e.key) {
      case 'ArrowUp':
      case 'ArrowLeft':
        p = clamp(p + step, 0, 1);
        e.preventDefault();
        break;
      case 'ArrowDown':
      case 'ArrowRight':
        p = clamp(p - step, 0, 1);
        e.preventDefault();
        break;
      case 'Home':
        p = 0;
        e.preventDefault();
        break;
      case 'End':
        p = 1;
        e.preventDefault();
        break;
      default:
        return;
    }
    updateDisplay(p);
  }

  // 滚轮
  function onWheel(e) {
    var step = 0.015;
    var p = clamp(tl.progress() - Math.sign(e.deltaY) * step, 0, 1);
    updateDisplay(p);
    e.preventDefault();
  }

  /* === 绑定事件 === */

  // 滑块区：鼠标
  sliderInner.addEventListener('mousedown', onPointerDown);
  sliderArea.addEventListener('mousedown', function (e) {
    if (e.target === sliderArea || e.target === sliderInner || e.target === sliderFill) {
      onPointerDown(e);
    }
  });

  document.addEventListener('mousemove', onPointerMove);
  document.addEventListener('mouseup', onPointerUp);

  // 触摸
  sliderInner.addEventListener('touchstart', function (e) {
    isDragging = true;
    var p = calcProgress(e.touches[0].clientY);
    updateDisplay(p);
    e.preventDefault();
  });
  sliderArea.addEventListener('touchstart', function (e) {
    if (e.target === sliderArea || e.target === sliderInner || e.target === sliderFill) {
      isDragging = true;
      var p = calcProgress(e.touches[0].clientY);
      updateDisplay(p);
      e.preventDefault();
    }
  });

  document.addEventListener('touchmove', function (e) {
    if (!isDragging) return;
    var p = calcProgress(e.touches[0].clientY);
    updateDisplay(p);
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', function () {
    isDragging = false;
  });

  // 键盘
  sliderArea.addEventListener('keydown', onKeyDown);

  // 滚轮
  ledgerArea.addEventListener('wheel', onWheel, { passive: false });
  sliderArea.addEventListener('wheel', onWheel, { passive: false });

  /* === Lec.mount === */
  Lec.mount({
    index: 39,
    kicker: 'SPACE RACE',
    title: '从斯普特尼克到阿波罗',
    take: '从斯普特尼克到月球，12 年'
  });

  /* === 初始显示 === */
  updateDisplay(0);

})();
</script>
</body>
</html>
