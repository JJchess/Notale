<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ===== page-40 specific: 登月任务剖面 ===== */
  :root {
    --bg:        #0b0e14;
    --text:      #e6e6e6;
    --font-sans: "Noto Sans SC", system-ui, sans-serif;
  }

  #stage {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #main {
    max-width: 100%;
    max-height: 100%;
    overflow: hidden;
  }

  /* split-lr layout */
  .split-lr {
    display: flex;
    flex-direction: row;
    gap: var(--space-5);
    flex: 1;
    min-height: 0;
    align-items: stretch;
  }
  .split-lr .left {
    flex: 7;
    min-width: 0;
    position: relative;
  }
  .split-lr .right {
    flex: 5;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }

  /* === Trajectory SVG === */
  #trajectory-svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .orbit-path {
    fill: none;
    stroke: var(--muted);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.5;
  }
  .orbit-trail {
    fill: none;
    stroke: var(--accent);
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 8 4;
  }
  .maneuver-diamond {
    fill: var(--accent);
    stroke: var(--bg);
    stroke-width: 2;
    cursor: pointer;
    transition: opacity 0.3s;
  }
  .maneuver-diamond.active {
    fill: #f59e0b;
    stroke-width: 3;
  }
  .maneuver-diamond:hover {
    opacity: 0.8;
  }
  .spacecraft {
    fill: #f59e0b;
    stroke: #fff;
    stroke-width: 2;
    filter: drop-shadow(0 0 6px rgba(245,158,11,0.6));
    transition: none;
  }
  .spacecraft-glow {
    fill: none;
    stroke: #f59e0b;
    stroke-width: 6;
    opacity: 0.3;
  }
  .plume {
    fill: none;
    stroke: #f97316;
    stroke-width: 2;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .plume.visible {
    opacity: 0.8;
  }
  .celestial-body {
    stroke: var(--muted);
    stroke-width: 1.5;
  }
  .earth-fill { fill: #2563eb; fill-opacity: 0.3; }
  .moon-fill { fill: #9ca3af; fill-opacity: 0.2; }
  .earth-label, .moon-label {
    fill: var(--text);
    font-size: 14px;
    font-weight: 600;
    text-anchor: middle;
  }
  .node-label {
    fill: var(--muted);
    font-size: 12px;
    text-anchor: middle;
    font-weight: 500;
  }
  .node-label.active {
    fill: var(--accent);
    font-weight: 700;
  }
  .node-label.done {
    fill: var(--muted);
    opacity: 0.5;
  }
  .trajectory-title {
    fill: var(--muted);
    font-size: 12px;
    text-anchor: middle;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* === Phase Panel === */
  .phase-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: var(--space-4);
    box-shadow: 0 1px 2px rgba(16,24,40,0.06);
    overflow: hidden;
  }
  .phase-panel .section {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }
  .phase-panel .section + .section {
    border-top: 1px solid var(--border);
    padding-top: var(--space-3);
  }
  .phase-panel .section-label {
    font-size: var(--fs-label);
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .phase-panel .phase-name {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
  }
  .phase-panel .phase-name .phase-type {
    font-size: var(--fs-label);
    color: var(--muted);
    font-weight: 500;
    display: inline-block;
    margin-left: var(--space-2);
  }
  .phase-panel .phase-desc {
    font-size: var(--fs-sec);
    color: var(--text);
    line-height: 1.5;
  }
  .phase-panel .phase-detail {
    font-size: var(--fs-label);
    color: var(--muted);
    line-height: 1.4;
  }
  .phase-panel .next-maneuver {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }
  .phase-panel .next-maneuver .nm-name {
    font-size: var(--fs-sec);
    font-weight: 600;
    color: var(--accent);
  }
  .phase-panel .next-maneuver .nm-time {
    font-size: var(--fs-label);
    color: var(--muted);
  }
  .phase-panel .next-maneuver .nm-countdown {
    font-size: var(--fs-sec);
    font-weight: 700;
    color: #f59e0b;
    font-family: var(--font-mono);
  }

  /* === Insight box === */
  .insight-box {
    background: var(--accent-soft);
    border-left: 4px solid var(--accent);
    border-radius: 0 6px 6px 0;
    padding: var(--space-2) var(--space-3);
    font-size: var(--fs-label);
    line-height: 1.4;
    color: var(--text);
    flex-shrink: 0;
  }
  .insight-box strong {
    color: var(--accent);
  }

  /* === Bottom bar (slider + controls) === */
  .bottom-bar {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    padding: var(--space-2) 0 0;
    flex-shrink: 0;
  }
  .bottom-bar .slider-row {
    display: flex;
    align-items: center;
    gap: var(--space-3);
  }
  .bottom-bar .slider-row .play-btn {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .bottom-bar .slider-row .play-btn:hover {
    background: var(--accent-soft);
  }
  .bottom-bar .slider-row .play-btn.playing {
    border-color: #f59e0b;
    color: #f59e0b;
  }
  .bottom-bar .slider-row .time-slider {
    flex: 1;
    min-width: 0;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  .bottom-bar .slider-row .time-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    cursor: pointer;
    box-shadow: 0 0 4px rgba(0,0,0,0.3);
  }
  .bottom-bar .slider-row .time-slider::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    cursor: pointer;
  }
  .bottom-bar .slider-row .time-display {
    flex: 0 0 auto;
    font-size: var(--fs-label);
    font-family: var(--font-mono);
    color: var(--text);
    font-weight: 600;
    min-width: 90px;
    text-align: right;
  }
  .bottom-bar .tick-marks {
    display: flex;
    justify-content: space-between;
    padding: 0 0 0 52px;
    font-size: 12px;
    color: var(--muted);
    font-family: var(--font-mono);
  }
  .bottom-bar .tick-marks span {
    flex: 0 0 auto;
  }

  @media (prefers-reduced-motion: reduce) {
    .spacecraft { transition: none; }
  }
</style>
</head>
<body data-page="40" data-total="50">
<div id="stage">
<main id="main">
  <div class="split-lr" style="min-height:0">
    <!-- LEFT: Trajectory SVG -->
    <div class="left">
      <svg id="trajectory-svg" viewBox="0 0 800 380" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="earth-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
          </linearGradient>
          <linearGradient id="moon-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#d1d5db"/>
            <stop offset="100%" stop-color="#6b7280"/>
          </linearGradient>
        </defs>

        <!-- Subtle grid -->
        <line x1="0" y1="190" x2="800" y2="190" stroke="var(--border)" stroke-width="0.5" opacity="0.12"/>
        <line x1="400" y1="0" x2="400" y2="380" stroke="var(--border)" stroke-width="0.5" opacity="0.12"/>

        <!-- Trajectory path -->
        <path id="orbit-path-full" class="orbit-path"
              d="M 80,190
                 C 80,110 160,65 300,65
                 C 500,65 660,110 700,170
                 C 720,190 720,200 700,205
                 C 700,208 700,208 700,208
                 C 700,208 700,212 720,218
                 C 740,230 700,300 600,320
                 C 450,350 250,350 150,300
                 C 100,275 80,235 80,190 Z"/>

        <!-- Trail -->
        <path id="orbit-trail" class="orbit-trail" stroke-dasharray="800" stroke-dashoffset="800"
              d="M 80,190
                 C 80,110 160,65 300,65
                 C 500,65 660,110 700,170
                 C 720,190 720,200 700,205
                 C 700,208 700,208 700,208
                 C 700,208 700,212 720,218
                 C 740,230 700,300 600,320
                 C 450,350 250,350 150,300
                 C 100,275 80,235 80,190 Z"/>

        <!-- Earth -->
        <circle cx="80" cy="190" r="38" class="celestial-body earth-fill" fill="url(#earth-grad)" stroke="#3b82f6" stroke-width="2"/>
        <circle cx="80" cy="190" r="42" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.2"/>
        <text class="earth-label" x="80" y="190" dy="4">地球</text>

        <!-- Moon -->
        <circle cx="720" cy="190" r="28" class="celestial-body moon-fill" fill="url(#moon-grad)" stroke="#9ca3af" stroke-width="2"/>
        <text class="moon-label" x="720" y="190" dy="4">月球</text>

        <!-- Maneuver nodes -->
        <g id="maneuver-nodes"></g>
        <g id="node-labels"></g>

        <!-- Spacecraft -->
        <circle id="spacecraft-glow" class="spacecraft-glow" cx="80" cy="190" r="12"/>
        <circle id="spacecraft" class="spacecraft" cx="80" cy="190" r="6"/>

        <!-- Plume -->
        <g id="plume" class="plume">
          <line x1="0" y1="0" x2="0" y2="0" stroke="#f97316" stroke-width="2"/>
          <line x1="0" y1="0" x2="0" y2="0" stroke="#f59e0b" stroke-width="1.5"/>
        </g>

        <text class="trajectory-title" x="400" y="16">任务轨道剖面（俯视）</text>
      </svg>
    </div>

    <!-- RIGHT: Phase Info Panel -->
    <div class="right">
      <div class="phase-panel" id="phase-panel">
        <div class="section">
          <div class="section-label">当前阶段</div>
          <div class="phase-name" id="phase-name">
            发射与入轨
            <span class="phase-type" id="phase-type">🚀 点火</span>
          </div>
          <div class="phase-desc" id="phase-desc">
            土星五号三级火箭逐级点火，将阿波罗 11 号送入近地轨道。
          </div>
        </div>
        <div class="section">
          <div class="section-label">正在发生</div>
          <div class="phase-detail" id="phase-detail">
            第一级 168 秒 → 第二级 390 秒 → 第三级 165 秒
          </div>
        </div>
        <div class="section">
          <div class="section-label">下一机动</div>
          <div class="next-maneuver">
            <div class="nm-name" id="nm-name">地月转移注入 (TLI)</div>
            <div class="nm-time" id="nm-time">T+2.5 小时</div>
            <div class="nm-countdown" id="nm-countdown">—</div>
          </div>
        </div>
      </div>

      <div class="insight-box">
        <strong>每一个机动都只在一个窗口里有效：</strong>
        早一秒晚一秒，落点就不在月球，而在宇宙深处。
      </div>
    </div>
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <div class="slider-row">
      <button id="play-btn" class="play-btn" aria-label="播放任务时间线">▶</button>
      <input type="range" id="time-slider" class="time-slider" min="0" max="195" step="0.1" value="0" aria-label="任务时间进度">
      <span class="time-display" id="time-display">T+0.0 h</span>
    </div>
    <div class="tick-marks">
      <span>T+0</span>
      <span>发射</span>
      <span>T+2.5h TLI</span>
      <span>T+76h 入月</span>
      <span>T+102h 着陆</span>
      <span>T+124h 上升</span>
      <span>T+130h 返航</span>
      <span>T+195h</span>
    </div>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
(function() {
  'use strict';

  /* ======== p40 专用常量（阿波罗 11 号公开任务时间线） ======== */
  var MANEUVERS = [
    { id:'launch',    name:'发射与入轨',       t:0,    label:'发射' },
    { id:'tli',       name:'地月转移注入',     t:2.5,  label:'TLI' },
    { id:'loi',       name:'绕月制动',         t:76,   label:'入轨' },
    { id:'descent',   name:'下降着陆',         t:102,  label:'着陆' },
    { id:'ascent',    name:'上升与对接',       t:124,  label:'上升' },
    { id:'tei',       name:'返回注入',         t:130,  label:'返航' },
    { id:'reentry',   name:'再入溅落',         t:195,  label:'溅落' }
  ];

  var PHASES = [
    { id:'launch',    name:'发射与入轨',       start:0,   end:0.2,
      type:'🚀 点火',
      desc:'土星五号三级火箭逐级点火，将阿波罗 11 号送入近地轨道。',
      detail:'第一级 168 秒 → 第二级 390 秒 → 第三级 165 秒',
      nextIdx:1, isBurn:true },
    { id:'coast1',    name:'地球轨道滑行',     start:0.2, end:2.5,
      type:'⏳ 滑行',
      desc:'飞船在近地轨道上无动力滑行，等待精确的地月转移窗口。',
      detail:'速度约 7.9 km/s，轨道高度约 190 km',
      nextIdx:1, isBurn:false },
    { id:'tli',       name:'地月转移注入',     start:2.5, end:2.6,
      type:'🚀 点火',
      desc:'第三级发动机二次点火，速度从 7.9 km/s 提升到 10.8 km/s。',
      detail:'燃烧约 6 分钟，进入地月转移轨道',
      nextIdx:2, isBurn:true },
    { id:'transit',   name:'地月转移',         start:2.6, end:76,
      type:'⏳ 滑行',
      desc:'飞船沿转移轨道无动力飞向月球，全程约 3 天。',
      detail:'航程约 384,400 km，航速约 1 km/s（相对地球）',
      nextIdx:2, isBurn:false },
    { id:'loi',       name:'绕月制动',         start:76,  end:76.2,
      type:'🚀 点火',
      desc:'服务舱发动机反向点火减速，使飞船被月球引力捕获。',
      detail:'燃烧约 6 分钟，速度降低约 800 m/s',
      nextIdx:3, isBurn:true },
    { id:'orbit',     name:'月球轨道绕行',     start:76.2, end:102,
      type:'⏳ 滑行',
      desc:'飞船在月球轨道上绕行，等待下降窗口。',
      detail:'轨道高度约 110 km，周期约 2 小时',
      nextIdx:3, isBurn:false },
    { id:'landing',   name:'下降着陆',         start:102, end:102.2,
      type:'🚀 点火',
      desc:'登月舱下降发动机点火，从绕月轨道降到月面。',
      detail:'燃烧约 12 分钟，速度从 1.7 km/s 降到 0',
      nextIdx:4, isBurn:true },
    { id:'surface',   name:'月面停留',         start:102.2, end:124,
      type:'⏳ 停留',
      desc:'阿姆斯特朗与奥尔德林在月面停留约 21 小时，采集样本。',
      detail:'1969 年 7 月 20 日，人类首次踏上月球',
      nextIdx:4, isBurn:false },
    { id:'ascent',    name:'上升与对接',       start:124, end:128,
      type:'🚀 点火',
      desc:'登月舱上升段点火起飞，与指令舱在月球轨道对接。',
      detail:'燃烧约 7 分钟 → 轨道交会约 3.5 小时',
      nextIdx:5, isBurn:true },
    { id:'return',    name:'返回航程',         start:128, end:195,
      type:'⏳ 滑行',
      desc:'飞船沿返回轨道无动力滑行，飞向地球。',
      detail:'航程约 2.5 天，128 小时时服务舱点火转向',
      nextIdx:6, isBurn:false }
  ];

  /* ======== DOM refs ======== */
  var svg = document.getElementById('trajectory-svg');
  var pathEl = document.getElementById('orbit-path-full');
  var trailEl = document.getElementById('orbit-trail');
  var spacecraft = document.getElementById('spacecraft');
  var spacecraftGlow = document.getElementById('spacecraft-glow');
  var maneuverNodesG = document.getElementById('maneuver-nodes');
  var nodeLabelsG = document.getElementById('node-labels');
  var plume = document.getElementById('plume');
  var slider = document.getElementById('time-slider');
  var playBtn = document.getElementById('play-btn');
  var timeDisplay = document.getElementById('time-display');
  var phaseName = document.getElementById('phase-name');
  var phaseType = document.getElementById('phase-type');
  var phaseDesc = document.getElementById('phase-desc');
  var phaseDetail = document.getElementById('phase-detail');
  var nmName = document.getElementById('nm-name');
  var nmTime = document.getElementById('nm-time');
  var nmCountdown = document.getElementById('nm-countdown');

  var playing = false;
  var playTween = null;
  var totalLength = 0;
  var TOTAL_HOURS = 195;

  /* ======== Build maneuver nodes ======== */
  function buildNodes() {
    totalLength = pathEl.getTotalLength();
    var pathLen = totalLength;

    maneuverNodesG.innerHTML = '';
    nodeLabelsG.innerHTML = '';

    var nodeFracs = [
      0.00, 0.08, 0.38, 0.50, 0.58, 0.62, 0.97
    ];

    MANEUVERS.forEach(function(m, i) {
      var frac = nodeFracs[i];
      var pt = pathEl.getPointAtLength(frac * pathLen);

      // Diamond
      var diam = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      var s = 5;
      var pts = [
        (pt.x)+','+(pt.y-s),
        (pt.x+s)+','+(pt.y),
        (pt.x)+','+(pt.y+s),
        (pt.x-s)+','+(pt.y)
      ].join(' ');
      diam.setAttribute('points', pts);
      diam.setAttribute('class', 'maneuver-diamond');
      diam.setAttribute('data-idx', i);
      diam.setAttribute('data-time', m.t);
      maneuverNodesG.appendChild(diam);

      // Label
      var label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('class', 'node-label');
      label.setAttribute('x', pt.x);
      label.setAttribute('y', pt.y + 18);
      label.setAttribute('data-idx', i);
      label.textContent = m.label;
      nodeLabelsG.appendChild(label);
    });
  }

  /* ======== Phase at time t ======== */
  function getPhase(t) {
    for (var i = 0; i < PHASES.length; i++) {
      var p = PHASES[i];
      if (t >= p.start && t < p.end) return p;
    }
    return PHASES[PHASES.length - 1];
  }

  /* ======== Next maneuver index ======== */
  function getNextManeuverIdx(t) {
    for (var i = 0; i < MANEUVERS.length; i++) {
      if (MANEUVERS[i].t > t + 0.01) return i;
    }
    return MANEUVERS.length - 1;
  }

  /* ======== Update scene ======== */
  function updateScene(t) {
    t = Math.max(0, Math.min(TOTAL_HOURS, t));

    // 1. Move spacecraft along path
    var progress = t / TOTAL_HOURS;
    var pathLen = totalLength;
    var targetLen = progress * pathLen;
    var pt = pathEl.getPointAtLength(targetLen);

    spacecraft.setAttribute('cx', pt.x);
    spacecraft.setAttribute('cy', pt.y);
    spacecraftGlow.setAttribute('cx', pt.x);
    spacecraftGlow.setAttribute('cy', pt.y);

    // 2. Trail
    trailEl.setAttribute('stroke-dashoffset', pathLen - targetLen);

    // 3. Phase info
    var phase = getPhase(t);
    phaseName.textContent = phase.name;
    phaseType.textContent = phase.type;
    phaseDesc.textContent = phase.desc;
    phaseDetail.textContent = phase.detail;

    // 4. Next maneuver
    var nextIdx = getNextManeuverIdx(t);
    if (nextIdx < MANEUVERS.length) {
      var nm = MANEUVERS[nextIdx];
      nmName.textContent = nm.name + ' (' + nm.label + ')';
      var dt = nm.t - t;
      if (dt <= 0) {
        nmTime.textContent = '正在进行';
        nmCountdown.textContent = '—';
      } else {
        nmTime.textContent = 'T+' + nm.t.toFixed(1) + ' h';
        if (dt >= 1) {
          nmCountdown.textContent = '倒计时 ' + dt.toFixed(1) + ' 小时';
        } else {
          nmCountdown.textContent = '倒计时 ' + (dt * 60).toFixed(0) + ' 分钟';
        }
      }
    }

    // 5. Maneuver node highlighting
    var diamonds = maneuverNodesG.querySelectorAll('.maneuver-diamond');
    var labels = nodeLabelsG.querySelectorAll('.node-label');
    for (var i = 0; i < diamonds.length; i++) {
      diamonds[i].classList.remove('active', 'done');
      labels[i].classList.remove('active', 'done');
      if (t >= MANEUVERS[i].t) {
        diamonds[i].classList.add('done');
        labels[i].classList.add('done');
      }
    }

    // 6. Plume near maneuver
    var nearManeuver = false;
    for (var i = 0; i < MANEUVERS.length; i++) {
      var m = MANEUVERS[i];
      var dt = Math.abs(t - m.t);
      if (dt < 0.15 && (m.id === 'tli' || m.id === 'loi' || m.id === 'descent' || m.id === 'ascent' || m.id === 'tei')) {
        nearManeuver = true;
        var plumeLines = plume.querySelectorAll('line');
        plumeLines[0].setAttribute('x1', pt.x);
        plumeLines[0].setAttribute('y1', pt.y);
        plumeLines[1].setAttribute('x1', pt.x);
        plumeLines[1].setAttribute('y1', pt.y);

        var angle = Math.atan2(pt.y - 190, pt.x - 400);
        var len = 10 + 6 * (1 - dt/0.15);
        var dx = -Math.cos(angle) * len;
        var dy = -Math.sin(angle) * len;
        if (m.id === 'descent') { dx = 0; dy = len; }
        else if (m.id === 'ascent') { dx = 0; dy = -len; }

        plumeLines[0].setAttribute('x2', pt.x + dx);
        plumeLines[0].setAttribute('y2', pt.y + dy);
        plumeLines[1].setAttribute('x2', pt.x + dx * 0.6);
        plumeLines[1].setAttribute('y2', pt.y + dy * 0.6);
        break;
      }
    }
    plume.classList.toggle('visible', nearManeuver);

    slider.value = t;
    timeDisplay.textContent = 'T+' + t.toFixed(1) + ' h';
  }

  /* ======== Slider ======== */
  slider.addEventListener('input', function() {
    updateScene(parseFloat(this.value));
  });

  /* ======== Play/Pause with GSAP ======== */
  playBtn.addEventListener('click', function() {
    playing = !playing;
    if (playing) {
      playBtn.textContent = '⏸';
      playBtn.classList.add('playing');
      playBtn.setAttribute('aria-label', '暂停任务时间线');
      var t = parseFloat(slider.value);
      if (t >= TOTAL_HOURS) {
        slider.value = 0;
        updateScene(0);
        t = 0;
      }
      var proxy = { v: t };
      playTween = gsap.to(proxy, {
        v: TOTAL_HOURS,
        duration: (TOTAL_HOURS - t) * 0.17,
        ease: 'none',
        onUpdate: function() {
          slider.value = proxy.v;
          updateScene(proxy.v);
        },
        onComplete: function() {
          playing = false;
          playBtn.textContent = '▶';
          playBtn.classList.remove('playing');
          playBtn.setAttribute('aria-label', '播放任务时间线');
          playTween = null;
        }
      });
    } else {
      playBtn.textContent = '▶';
      playBtn.classList.remove('playing');
      playBtn.setAttribute('aria-label', '播放任务时间线');
      if (playTween) {
        playTween.kill();
        playTween = null;
      }
    }
  });

  /* ======== Keyboard ======== */
  playBtn.setAttribute('tabindex', '0');
  playBtn.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      this.click();
    }
  });

  slider.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
      e.preventDefault();
      var v = Math.min(TOTAL_HOURS, parseFloat(this.value) + 1);
      this.value = v;
      updateScene(v);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      e.preventDefault();
      var v = Math.max(0, parseFloat(this.value) - 1);
      this.value = v;
      updateScene(v);
    }
  });

  /* ======== Maneuver node click ======== */
  maneuverNodesG.addEventListener('click', function(e) {
    var diam = e.target.closest('.maneuver-diamond');
    if (diam) {
      var idx = parseInt(diam.getAttribute('data-idx'));
      var t = MANEUVERS[idx].t;
      slider.value = t;
      updateScene(t);
    }
  });

  /* ======== Init ======== */
  buildNodes();
  updateScene(0);

  /* ======== Lec.mount ======== */
  Lec.mount({
    index: 40,
    kicker: 'APOLLO 11 · 任务剖面',
    title: '一枚飞向月球的钟表',
    take: '从发射到着陆再到返回，每一步都在与轨道力学和燃烧时间赛跑'
  });

})();
</script>
</body>
</html>
