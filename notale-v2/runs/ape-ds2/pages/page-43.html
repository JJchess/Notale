<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/lib/three.min.js"></script>
<script src="assets/lib/globe.gl.min.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<style>
/* ---- page-43: 蓝色星球旋转台 ---- */
#main {
  position: relative;
  width: 100%;
  height: 100%;
  background: radial-gradient(ellipse at 50% 45%, #0b1120 0%, #04060e 80%, #010205 100%);
  overflow: hidden;
}

/* ---- stars background ---- */
#starfield {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ---- globe ---- */
#globe-wrap {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -54%);
  width: 380px;
  height: 380px;
  z-index: 2;
}
#globe-container {
  width: 100%;
  height: 100%;
}

/* ---- connecting lines (SVG) ---- */
#connectors {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
  overflow: visible;
}
#connectors line {
  stroke: var(--accent);
  stroke-width: 1;
  opacity: 0.55;
}
#connectors line.glow {
  stroke: var(--accent);
  stroke-width: 3;
  opacity: 0.12;
  filter: url(#glow-blur);
}

/* ---- support labels ---- */
.support {
  position: absolute;
  z-index: 4;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  pointer-events: none;
}
.s-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  margin-top: 5px;
  box-shadow: 0 0 10px var(--accent), 0 0 20px rgba(79, 110, 242, 0.3);
}
.s-body {
  max-width: 250px;
}
.s-head {
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.04em;
  line-height: 1.3;
}
.s-desc {
  font-size: var(--fs-sec);
  color: #c8d0e0;
  line-height: 1.4;
  margin-top: 3px;
}

/* positions */
.s1 { left: 50px; top: 35px; }
.s2 { left: 50px; bottom: 100px; }
.s3 { right: 50px; bottom: 100px; }

/* ---- claim text at bottom center ---- */
.claim-block {
  position: absolute;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  z-index: 4;
  text-align: center;
  pointer-events: none;
  max-width: 700px;
}
.claim-block .main {
  font-size: var(--fs-lead);
  font-weight: 700;
  color: #e8ecf4;
  line-height: 1.4;
  margin: 0;
}
.claim-block .sub {
  font-size: var(--fs-sec);
  color: #8892a8;
  line-height: 1.4;
  margin-top: 6px;
}

/* ---- attribution (secondary, tiny) ---- */
.attribution {
  position: absolute;
  right: 50px;
  bottom: 12px;
  font-size: 12px;
  color: rgba(255,255,255,0.15);
  z-index: 4;
  pointer-events: none;
  letter-spacing: 0.02em;
}
</style>
</head>
<body data-page="43" data-total="50">
<div id="stage">
<main id="main">

  <!-- starfield canvas -->
  <canvas id="starfield"></canvas>

  <!-- SVG connectors (with glow filter) -->
  <svg id="connectors" aria-hidden="true">
    <defs>
      <filter id="glow-blur" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
      </filter>
    </defs>
    <line class="s1-line" x1="0" y1="0" x2="0" y2="0"/>
    <line class="s1-line glow" x1="0" y1="0" x2="0" y2="0"/>
    <line class="s2-line" x1="0" y1="0" x2="0" y2="0"/>
    <line class="s2-line glow" x1="0" y1="0" x2="0" y2="0"/>
    <line class="s3-line" x1="0" y1="0" x2="0" y2="0"/>
    <line class="s3-line glow" x1="0" y1="0" x2="0" y2="0"/>
  </svg>

  <!-- globe container -->
  <div id="globe-wrap">
    <div id="globe-container"></div>
  </div>

  <!-- support 1: 物理连续性 -->
  <div class="support s1">
    <div class="s-dot"></div>
    <div class="s-body">
      <div class="s-head">物理连续性</div>
      <div class="s-desc">地球是一个完整的球体，表面没有人类画出的边界线</div>
    </div>
  </div>

  <!-- support 2: 边界的起源 -->
  <div class="support s2">
    <div class="s-dot"></div>
    <div class="s-body">
      <div class="s-head">边界的起源</div>
      <div class="s-desc">国界是地图上的政治约定，从太空中看它们不存在</div>
    </div>
  </div>

  <!-- support 3: 身份的参照系 -->
  <div class="support s3">
    <div class="s-dot"></div>
    <div class="s-body">
      <div class="s-head">身份的参照系</div>
      <div class="s-desc">从太空回望，所有人共享同一颗行星</div>
    </div>
  </div>

  <!-- claim block -->
  <div class="claim-block">
    <p class="main">从太空看，地球没有国界——国界只是人类画在地图上的线</p>
    <p class="sub">当身份从「某国的人」变成「地球上的人」，人类第一次成为自己的观者</p>
  </div>

  <!-- attribution -->
  <div class="attribution">NASA Blue Marble</div>

</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function () {
  'use strict';

  /* ---- mount header / footer ---- */
  Lec.mount({
    index: 43,
    kicker: 'SPACE AGE',
    title: '地球人',
    take: '从太空看，地球没有国界——太空人的视角把人类重新定义为地球人'
  });

  var W = Deck.W, H = Deck.H;

  /* ---- starfield background ---- */
  (function drawStars() {
    var cv = document.getElementById('starfield');
    if (!cv) return;
    cv.className = 'cv-fill';
    var ctx = Deck.fit(cv);
    var rng = new Math.seedrandom('page-43-stars');
    var stars = [];
    for (var i = 0; i < 300; i++) {
      stars.push({
        x: rng() * W,
        y: rng() * H,
        r: 0.3 + rng() * 1.2,
        a: 0.2 + rng() * 0.5
      });
    }
    ctx.clearRect(0, 0, W, H);
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(200, 210, 235, ' + st.a + ')';
      ctx.fill();
    }
  })();

  /* ---- globe ---- */
  var globeContainer = document.getElementById('globe-container');
  var globeWrap = document.getElementById('globe-wrap');

  var globe = new Globe(globeContainer)
    .globeImageUrl('assets/img/earth-blue-marble.jpg')
    .width(380)
    .height(380)
    .backgroundColor('rgba(0,0,0,0)')
    .showGlobe(true)
    .showAtmosphere(true)
    .atmosphereColor('#4f6ef2')
    .atmosphereAltitude(0.12);

  /* initial view */
  globe.pointOfView({ lat: 15, lng: 0, altitude: 2.2 });

  /* configure controls once the globe is initialized */
  function setupControls() {
    try {
      var ctrl = globe.controls();
      if (!ctrl) { setTimeout(setupControls, 100); return; }
      ctrl.enableZoom = false;
      ctrl.autoRotate = true;
      ctrl.autoRotateSpeed = 0.6;
      ctrl.enableDamping = true;
      ctrl.dampingFactor = 0.08;
      ctrl.minPolarAngle = Math.PI / 3;
      ctrl.maxPolarAngle = Math.PI * 2 / 3;

      if (Deck.reduced()) {
        ctrl.autoRotate = false;
      }
    } catch(e) {
      setTimeout(setupControls, 150);
    }
  }
  setTimeout(setupControls, 200);

  /* ---- connecting lines ---- */
  function updateLines() {
    var wrapRect = globeWrap.getBoundingClientRect();
    var stageRect = document.getElementById('stage').getBoundingClientRect();

    /* globe center in stage coordinates */
    var cx = wrapRect.left - stageRect.left + wrapRect.width / 2;
    var cy = wrapRect.top - stageRect.top + wrapRect.height / 2;

    /* scale from stage CSS to logical 1600×900 */
    var s = Deck.s || (W / 1600);

    /* anchor points of supports (in stage-relative px) */
    var s1Dot = document.querySelector('.support.s1 .s-dot');
    var s2Dot = document.querySelector('.support.s2 .s-dot');
    var s3Dot = document.querySelector('.support.s3 .s-dot');

    if (!s1Dot || !s2Dot || !s3Dot) return;

    function dotCenter(el) {
      var r = el.getBoundingClientRect();
      return {
        x: (r.left - stageRect.left + r.width / 2) / s,
        y: (r.top - stageRect.top + r.height / 2) / s
      };
    }

    var p1 = dotCenter(s1Dot);
    var p2 = dotCenter(s2Dot);
    var p3 = dotCenter(s3Dot);

    var gx = cx / s;
    var gy = cy / s;

    var svg = document.getElementById('connectors');
    if (!svg) return;

    var lines = svg.querySelectorAll('line');
    /* indices: 0=s1, 1=s1-glow, 2=s2, 3=s2-glow, 4=s3, 5=s3-glow */
    var pts = [p1, p2, p3];
    for (var i = 0; i < 3; i++) {
      var li = lines[i * 2];
      var lg = lines[i * 2 + 1];
      li.setAttribute('x1', pts[i].x);
      li.setAttribute('y1', pts[i].y);
      li.setAttribute('x2', gx);
      li.setAttribute('y2', gy);
      lg.setAttribute('x1', pts[i].x);
      lg.setAttribute('y1', pts[i].y);
      lg.setAttribute('x2', gx);
      lg.setAttribute('y2', gy);
    }
  }

  /* update lines after first render and on resize */
  requestAnimationFrame(function () {
    setTimeout(updateLines, 100);
  });

  Deck.onResize(function () {
    setTimeout(updateLines, 50);
  });

  })();
</script>
</body>
</html>
