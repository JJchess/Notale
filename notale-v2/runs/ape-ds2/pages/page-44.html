<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}

/* ===== split-lr layout ===== */
#main {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  gap: 0;
  width: 100%;
  height: 620px;
  overflow: hidden;
  box-sizing: border-box;
}

.left-col {
  flex: 0 0 310px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 0 12px 0 0;
  border-right: 1px solid rgba(208, 213, 221, 0.15);
  gap: 6px;
  box-sizing: border-box;
  overflow: hidden;
}

.right-col {
  flex: 1 1 auto;
  min-width: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-sizing: border-box;
}

/* ===== Throttle ===== */
.throttle-wrap {
  flex: 0 0 auto;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 6px;
  padding: 2px 0;
  height: 200px;
}

.throttle-track {
  position: relative;
  width: 36px;
  height: 180px;
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

input[type="range"].throttle {
  -webkit-appearance: none;
  appearance: none;
  width: 180px;
  height: 6px;
  background: linear-gradient(to right, rgba(79,110,242,0.3), rgba(79,110,242,0.8));
  border-radius: 3px;
  outline: none;
  cursor: pointer;
  transform: rotate(-90deg);
  transform-origin: center;
  margin: 0;
}

input[type="range"].throttle::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 34px;
  background: linear-gradient(180deg, #6b8aff, #4f6ef2);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 3px;
  cursor: grab;
  box-shadow: 0 2px 8px rgba(79,110,242,0.4);
  transition: box-shadow 0.15s;
}

input[type="range"].throttle::-webkit-slider-thumb:active {
  cursor: grabbing;
  box-shadow: 0 2px 14px rgba(79,110,242,0.7);
}

input[type="range"].throttle::-moz-range-thumb {
  width: 18px;
  height: 34px;
  background: linear-gradient(180deg, #6b8aff, #4f6ef2);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 3px;
  cursor: grab;
  box-shadow: 0 2px 8px rgba(79,110,242,0.4);
}

.throttle-labels {
  display: flex;
  flex-direction: column;
  height: 180px;
  justify-content: space-between;
  flex: 0 0 30px;
  font-size: 14px;
  color: rgba(255,255,255,0.35);
  text-align: right;
  padding: 2px 0;
}

/* ===== Time display ===== */
.time-display {
  text-align: center;
  padding: 2px 0;
}

.time-value {
  font-size: 34px;
  font-weight: 700;
  color: #4f6ef2;
  font-family: var(--font-mono);
  line-height: 1.1;
}

.time-unit {
  font-size: 16px;
  color: rgba(255,255,255,0.6);
  margin-left: 4px;
}

/* ===== Comparison ===== */
.comparison-box {
  background: rgba(79,110,242,0.08);
  border: 1px solid rgba(79,110,242,0.2);
  border-radius: 8px;
  padding: 8px 10px;
  text-align: center;
  flex: 0 0 auto;
}

.comparison-box .label {
  font-size: 14px;
  color: rgba(255,255,255,0.5);
  margin-bottom: 3px;
}

.comparison-box .ratio {
  font-size: 20px;
  font-weight: 700;
  color: #fbbf24;
  font-family: var(--font-mono);
}

/* ===== Progress axis (k-process) ===== */
.progress-axis {
  position: relative;
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0 4px;
  margin-top: 2px;
  flex: 0 0 auto;
}

.progress-axis::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 14px;
  right: 14px;
  height: 2px;
  background: rgba(255,255,255,0.15);
  transform: translateY(-50%);
  z-index: 0;
}

.progress-axis .step {
  position: relative;
  z-index: 1;
  flex: 1 1 0;
  min-width: 0;
  text-align: center;
  padding: 3px 2px;
}

.progress-axis .step .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  margin: 0 auto 2px;
  transition: all 0.3s;
}

.progress-axis .step.current .dot {
  background: #4f6ef2;
  box-shadow: 0 0 10px rgba(79,110,242,0.6);
}

.progress-axis .step.done .dot {
  background: rgba(79,110,242,0.5);
}

.progress-axis .step .lbl {
  font-size: 14px;
  color: rgba(255,255,255,0.3);
  transition: color 0.3s;
}

.progress-axis .step.current .lbl {
  color: rgba(255,255,255,0.8);
}

.progress-axis .step.done .lbl {
  color: rgba(255,255,255,0.5);
}

/* ===== Viewport ===== */
.viewport-header {
  text-align: right;
  padding: 2px 14px 0;
  font-size: 14px;
  color: rgba(255,255,255,0.25);
  flex: 0 0 auto;
}

.viewport-canvas-wrap {
  flex: 1 1 auto;
  min-height: 0;
  min-width: 0;
  position: relative;
  overflow: hidden;
}

.viewport-canvas-wrap canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* ===== Milestone overlay labels ===== */
.milestone-label {
  position: absolute;
  pointer-events: none;
  text-align: center;
  transform: translate(-50%, 0);
  white-space: nowrap;
  display: none;
}

.milestone-label.visible { display: block; }

.milestone-label .name {
  font-size: 14px;
  font-weight: 600;
  color: rgba(255,255,255,0.8);
}

.milestone-label .reading {
  font-size: 14px;
  color: #4f6ef2;
  font-family: var(--font-mono);
}

/* ===== Responsive adjustments ===== */
@media (max-width: 1366px) {
  .left-col {
    flex-basis: 270px;
    padding-right: 8px;
  }
  .throttle-wrap { height: 200px; }
  .throttle-track { height: 180px; }
  .throttle-labels { height: 180px; }
  input[type="range"].throttle { width: 180px; }
  .time-value { font-size: 28px; }
  .comparison-box .ratio { font-size: 18px; }
}
</style>
</head>
<body data-page="44" data-total="50">
<div id="stage">
  <main id="main">
    <div class="left-col">
      <!-- Throttle area -->
      <div class="throttle-wrap">
        <div class="throttle-labels">
          <span>年</span>
          <span>分</span>
          <span>秒</span>
        </div>
        <div class="throttle-track">
          <input type="range" class="throttle" id="throttle"
                 min="0" max="1000" value="0" step="1"
                 aria-label="光速巡航杆 · 拖动控制飞行时间">
        </div>
      </div>

      <!-- Time display -->
      <div class="time-display" id="timeDisplay">
        <span class="time-value" id="timeValue">0</span>
        <span class="time-unit" id="timeUnit">秒</span>
      </div>

      <!-- Comparison reading -->
      <div class="comparison-box">
        <div class="label">地球→月球 / 地球→比邻星</div>
        <div class="ratio" id="ratioDisplay">≈ — 倍</div>
      </div>

      <!-- Progress axis (k-process pattern) -->
      <div class="progress-axis" id="progressAxis">
        <div class="step" data-milestone="moon">
          <div class="dot"></div>
          <div class="lbl">月球</div>
        </div>
        <div class="step" data-milestone="sun">
          <div class="dot"></div>
          <div class="lbl">太阳</div>
        </div>
        <div class="step" data-milestone="proxima">
          <div class="dot"></div>
          <div class="lbl">比邻星</div>
        </div>
      </div>
    </div>

    <div class="right-col">
      <div class="viewport-header">光速巡航中 · 所有时间为光程时间</div>
      <div class="viewport-canvas-wrap">
        <canvas id="viewCanvas"></canvas>
        <div class="milestone-label" id="labelMoon">
          <div class="name">🌙 月球</div>
          <div class="reading" id="readMoon"></div>
        </div>
        <div class="milestone-label" id="labelSun">
          <div class="name">☀️ 太阳</div>
          <div class="reading" id="readSun"></div>
        </div>
        <div class="milestone-label" id="labelProxima">
          <div class="name">⭐ 比邻星</div>
          <div class="reading" id="readProxima"></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/lec.js"></script>
<script>
(function () {
  'use strict';

  // ===== Constants =====
  var C = {
    C_MPS: Lec.K.SPEED_OF_LIGHT_MPS,
    MOON_DIST_M: Lec.K.MOON_DISTANCE_METERS,
    AU_M: Lec.K.METERS_PER_AU,
    PROXIMA_LY: Lec.K.PROXIMA_CENTAURI_LY,
    SEC_PER_YEAR: Lec.K.SECONDS_PER_YEAR
  };

  // Light travel times in seconds
  var MOON_TIME = C.MOON_DIST_M / C.C_MPS;          // ~1.28 s
  var SUN_TIME = C.AU_M / C.C_MPS;                   // ~499 s
  var PROXIMA_TIME = C.PROXIMA_LY * C.SEC_PER_YEAR;  // ~134M s

  // ===== DOM refs =====
  var throttle = document.getElementById('throttle');
  var timeValue = document.getElementById('timeValue');
  var timeUnit = document.getElementById('timeUnit');
  var ratioDisplay = document.getElementById('ratioDisplay');
  var canvas = document.getElementById('viewCanvas');
  var wrap = canvas.parentNode;
  var ctx = null;
  var labelMoon = document.getElementById('labelMoon');
  var labelSun = document.getElementById('labelSun');
  var labelProxima = document.getElementById('labelProxima');
  var readMoon = document.getElementById('readMoon');
  var readSun = document.getElementById('readSun');
  var readProxima = document.getElementById('readProxima');

  var steps = document.querySelectorAll('#progressAxis .step');

  // ===== Star field =====
  var stars = [];
  var NUM_STARS = 300;
  var rng = new Math.seedrandom('page-44-stars');
  var STAR_FIELD_SIZE = 300000000; // light-seconds

  for (var i = 0; i < NUM_STARS; i++) {
    stars.push({
      x: (rng() - 0.5) * 2 * STAR_FIELD_SIZE,
      y: (rng() - 0.5) * 2 * (STAR_FIELD_SIZE * 0.3),
      size: 0.5 + rng() * 2.5,
      bright: 0.3 + rng() * 0.7,
      layer: Math.floor(rng() * 3)
    });
  }

  // ===== Slider → time mapping =====
  function sliderToTime(t) {
    t = Math.max(0, Math.min(1, t));
    if (t < 0.15) {
      return (t / 0.15) * 2;
    } else if (t < 0.40) {
      var seg = (t - 0.15) / 0.25;
      return 2 * Math.pow(500, seg);
    } else {
      var seg = (t - 0.40) / 0.60;
      return 1000 * Math.pow(PROXIMA_TIME / 1000, seg);
    }
  }

  // ===== Format time =====
  function formatTime(seconds) {
    if (seconds < 3) {
      return { val: seconds.toFixed(1), unit: '秒' };
    } else if (seconds < 120) {
      return { val: seconds.toFixed(0), unit: '秒' };
    } else if (seconds < 3600) {
      return { val: (seconds / 60).toFixed(1), unit: '分钟' };
    } else if (seconds < 86400) {
      return { val: (seconds / 60).toFixed(0), unit: '分钟' };
    } else if (seconds < 31557600) {
      var d = seconds / 86400;
      return { val: d.toFixed(1), unit: '天' };
    } else {
      var y = seconds / 31557600;
      return { val: y.toFixed(1), unit: '年' };
    }
  }

  function formatLightTime(seconds) {
    if (seconds < 60) {
      return { val: seconds.toFixed(1), unit: '光秒' };
    } else if (seconds < 3600) {
      return { val: (seconds / 60).toFixed(1), unit: '光分' };
    } else if (seconds < 86400) {
      return { val: (seconds / 3600).toFixed(1), unit: '光时' };
    } else if (seconds < 31557600) {
      return { val: (seconds / 86400).toFixed(1), unit: '光天' };
    } else {
      return { val: (seconds / 31557600).toFixed(1), unit: '光年' };
    }
  }

  // ===== Drawing =====
  function drawScene(timeSeconds) {
    if (!ctx) return;
    var W = canvas.width;
    var H = canvas.height;
    var cx = W / 2;
    var cy = H / 2;

    ctx.clearRect(0, 0, W, H);

    var currentDist = timeSeconds;
    var viewDist = Math.max(4, currentDist * 2.5 + 2);
    var pxPerLs = W / viewDist;

    // Draw stars
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var parallax = 1 / (1 + s.layer * 0.5);
      var sx = (s.x - currentDist * parallax) * pxPerLs + cx;
      var sy = s.y * pxPerLs * parallax + cy;

      if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;

      ctx.beginPath();
      ctx.arc(sx, sy, s.size * (0.5 + parallax * 0.5), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + (s.bright * (0.4 + 0.6 * parallax)) + ')';
      ctx.fill();
    }

    // Faint path line
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 6]);
    ctx.moveTo(-MOON_TIME * pxPerLs + cx, cy);
    ctx.lineTo(PROXIMA_TIME * pxPerLs + cx, cy);
    ctx.stroke();
    ctx.setLineDash([]);

    // Milestone markers
    var milestones = [
      { dist: MOON_TIME, color: '#94a3b8' },
      { dist: SUN_TIME, color: '#fbbf24' },
      { dist: PROXIMA_TIME, color: '#ef4444' }
    ];

    for (var m = 0; m < milestones.length; m++) {
      var ms = milestones[m];
      var mx = (ms.dist - currentDist) * pxPerLs + cx;

      if (mx < -50 || mx > W + 50) continue;

      var passed = currentDist >= ms.dist;

      // Vertical marker line
      ctx.beginPath();
      ctx.moveTo(mx, cy - 60);
      ctx.lineTo(mx, cy + 60);
      ctx.strokeStyle = passed ? ms.color : 'rgba(255,255,255,0.12)';
      ctx.lineWidth = passed ? 2 : 1;
      ctx.stroke();

      // Marker dot
      ctx.beginPath();
      ctx.arc(mx, cy, passed ? 4 : 2, 0, Math.PI * 2);
      ctx.fillStyle = passed ? ms.color : 'rgba(255,255,255,0.12)';
      ctx.fill();
    }

    // Light particle
    var pulse = 1 + 0.15 * Math.sin(Date.now() / 300);
    var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 10 * pulse);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.3, 'rgba(255,255,255,0.8)');
    grad.addColorStop(0.6, 'rgba(79,110,242,0.4)');
    grad.addColorStop(1, 'rgba(79,110,242,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, 10 * pulse, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Bright core
    ctx.beginPath();
    ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // Earth marker
    var earthX = (-currentDist) * pxPerLs + cx;
    if (earthX > -50 && earthX < W + 50) {
      ctx.beginPath();
      ctx.arc(earthX, cy, 3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(79,150,255,0.5)';
      ctx.fill();
      ctx.font = '14px sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.textAlign = 'center';
      ctx.fillText('地球', earthX, cy + 16);
    }
  }

  // ===== Update UI =====
  function updateUI(timeSeconds) {
    // Time display
    var fmt = formatTime(timeSeconds);
    timeValue.textContent = fmt.val;
    timeUnit.textContent = fmt.unit;

    // Milestone state
    var moonPassed = timeSeconds >= MOON_TIME;
    var sunPassed = timeSeconds >= SUN_TIME;
    var proximaPassed = timeSeconds >= PROXIMA_TIME;

    // Set readings
    readMoon.textContent = formatLightTime(MOON_TIME).val + ' ' + formatLightTime(MOON_TIME).unit;
    readSun.textContent = formatLightTime(SUN_TIME).val + ' ' + formatLightTime(SUN_TIME).unit;
    readProxima.textContent = formatLightTime(PROXIMA_TIME).val + ' ' + formatLightTime(PROXIMA_TIME).unit;

    labelMoon.classList.toggle('visible', moonPassed);
    labelSun.classList.toggle('visible', sunPassed);
    labelProxima.classList.toggle('visible', proximaPassed);

    // Position milestone labels
    updateLabelPositions(timeSeconds);

    // Progress axis
    steps.forEach(function (step) {
      var ms = step.getAttribute('data-milestone');
      step.classList.remove('current', 'done');
      if (ms === 'moon') {
        if (moonPassed) step.classList.add('done');
        else step.classList.add('current');
      } else if (ms === 'sun') {
        if (sunPassed) step.classList.add('done');
        else if (moonPassed) step.classList.add('current');
      } else if (ms === 'proxima') {
        if (proximaPassed) step.classList.add('done');
        else if (sunPassed) step.classList.add('current');
      }
    });

    // Comparison ratio
    var ratio = PROXIMA_TIME / MOON_TIME;
    var ratioVal = ratio / 1e8;
    ratioDisplay.textContent = '≈ ' + ratioVal.toFixed(1) + ' 亿倍';
  }

  function updateLabelPositions(timeSeconds) {
    if (!ctx) return;
    var W = canvas.width;
    var H = canvas.height;
    var cx = W / 2;

    var currentDist = timeSeconds;
    var viewDist = Math.max(4, currentDist * 2.5 + 2);
    var pxPerLs = W / viewDist;

    var labels = [
      { dist: MOON_TIME, el: labelMoon, passed: timeSeconds >= MOON_TIME },
      { dist: SUN_TIME, el: labelSun, passed: timeSeconds >= SUN_TIME },
      { dist: PROXIMA_TIME, el: labelProxima, passed: timeSeconds >= PROXIMA_TIME }
    ];

    // Compute positions only for visible (passed) labels
    var visiblePositions = [];
    for (var i = 0; i < labels.length; i++) {
      var l = labels[i];
      if (!l.passed) continue;
      var mx = (l.dist - currentDist) * pxPerLs + cx;
      mx = Math.max(50, Math.min(W - 50, mx));
      visiblePositions.push({ mx: mx, el: l.el });
    }

    // Spread overlapping visible labels
    if (visiblePositions.length >= 2) {
      for (var i = 0; i < visiblePositions.length; i++) {
        for (var j = i + 1; j < visiblePositions.length; j++) {
          if (Math.abs(visiblePositions[i].mx - visiblePositions[j].mx) < 120) {
            if (visiblePositions[i].mx < visiblePositions[j].mx) {
              visiblePositions[i].mx = Math.max(50, visiblePositions[i].mx - 60);
              visiblePositions[j].mx = Math.min(W - 50, visiblePositions[j].mx + 60);
            } else {
              visiblePositions[i].mx = Math.min(W - 50, visiblePositions[i].mx + 60);
              visiblePositions[j].mx = Math.max(50, visiblePositions[j].mx - 60);
            }
          }
        }
      }
    }

    for (var i = 0; i < visiblePositions.length; i++) {
      var p = visiblePositions[i];
      p.el.style.left = p.mx + 'px';
      p.el.style.top = Math.min(H - 40, 280) + 'px';
    }
  }

  // ===== Main update =====
  function update(t) {
    var timeSeconds = sliderToTime(t);
    drawScene(timeSeconds);
    updateUI(timeSeconds);
  }

  // ===== Canvas resize handling =====
  var resizeOff = null;
  function setupCanvas() {
    if (ctx) {
      // Already set up
      update(parseFloat(throttle.value) / 1000);
      return;
    }
    ctx = Deck.fit(canvas);
    update(0);
  }

  // ===== Init =====
  function init() {
    // Set up canvas
    ctx = Deck.fit(canvas);
    update(0);

    // Handle resize
    resizeOff = Deck.onResize(function () {
      ctx = Deck.fit(canvas);
      update(parseFloat(throttle.value) / 1000);
    });

    // Set milestone readings
    readMoon.textContent = formatLightTime(MOON_TIME).val + ' ' + formatLightTime(MOON_TIME).unit;
    readSun.textContent = formatLightTime(SUN_TIME).val + ' ' + formatLightTime(SUN_TIME).unit;
    readProxima.textContent = formatLightTime(PROXIMA_TIME).val + ' ' + formatLightTime(PROXIMA_TIME).unit;

    // Set initial progress axis
    document.querySelector('#progressAxis .step[data-milestone="moon"]').classList.add('current');

    // Set comparison
    var ratio = PROXIMA_TIME / MOON_TIME;
    ratioDisplay.textContent = '≈ ' + (ratio / 1e8).toFixed(1) + ' 亿倍';

    // Keyboard support
    throttle.addEventListener('keydown', function (e) {
      var val = parseFloat(this.value);
      var step = e.shiftKey ? 50 : 5;
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
        e.preventDefault();
        this.value = Math.min(1000, val + step);
        update(this.value / 1000);
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
        e.preventDefault();
        this.value = Math.max(0, val - step);
        update(this.value / 1000);
      }
    });

    // Slider input
    throttle.addEventListener('input', function () {
      var t = parseFloat(this.value) / 1000;
      update(t);
    });
  }

  // ===== Mount =====
  Lec.mount({
    title: '光速巡航：最近的恒星也要 4.2 年',
    sub: '即使以光速，到最近的恒星也要 4.2 年——离开太阳系比离开地球难亿倍'
  });

  // Start
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
