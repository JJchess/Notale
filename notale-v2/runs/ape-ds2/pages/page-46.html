<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== Page 46 – 身体里的考古 ===== */

:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}

/* Content area inside #stage is 1408×620 (after padding).
   #main is 100vw×100vh inside #stage's padded content area.
   We position all content absolutely within #main,
   fitting within the 1408×620 bounds. */

#main {
  position: relative;
  overflow: hidden;
  width: 1408px;
  height: 620px;
}

/* -- layout: left chamber + right panel -- */
.content-row {
  position: absolute;
  top: 0;
  left: 0;
  width: 1408px;
  height: 548px;
  display: flex;
  gap: 0;
}

/* -- scan chamber (left 46%) -- */
.scan-chamber {
  position: relative;
  flex: 0 0 46%;
  height: 100%;
  background: #0a0c12;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.06);
}

.scan-chamber .grid-bg {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
}

.scan-chamber .body-wrap {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 80%;
  height: 86%;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.scan-chamber .body-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0.55;
  filter: brightness(0.9) saturate(0.3);
  pointer-events: none;
  user-select: none;
}

/* -- scan line -- */
.scan-line {
  position: absolute;
  left: 0;
  right: 0;
  height: 2px;
  background: #4fc3f7;
  box-shadow: 0 0 8px rgba(79,195,247,0.5), 0 0 24px rgba(79,195,247,0.2);
  pointer-events: none;
  z-index: 5;
}

/* -- hotspots -- */
.hotspot {
  position: absolute;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: rgba(79,195,247,0.15);
  border: 1.5px solid rgba(79,195,247,0.3);
  transform: translate(-50%, -50%);
  z-index: 4;
  pointer-events: none;
  transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
}

.hotspot.active {
  background: rgba(79,195,247,0.35);
  border-color: #4fc3f7;
  box-shadow: 0 0 12px rgba(79,195,247,0.5), 0 0 32px rgba(79,195,247,0.2);
}

.hotspot .hs-dot {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #4fc3f7;
  transform: translate(-50%, -50%);
  transition: transform 0.3s;
}

.hotspot.active .hs-dot {
  transform: translate(-50%, -50%) scale(1.6);
}

/* -- connector line from hotspot to card -- */
.hotspot .connector {
  position: absolute;
  top: 50%;
  left: 100%;
  width: 0;
  height: 0;
  border-top: 1px dashed rgba(79,195,247,0.0);
  pointer-events: none;
  transition: width 0.5s, border-color 0.5s;
}

.hotspot.active .connector {
  width: 80px;
  border-color: rgba(79,195,247,0.3);
}

/* -- vertical slider -- */
.scan-slider-wrap {
  position: absolute;
  right: 10px;
  top: 20px;
  bottom: 20px;
  width: 24px;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
}

.scan-slider {
  -webkit-appearance: none;
  appearance: none;
  writing-mode: bt-lr;
  width: 24px;
  height: 100%;
  background: transparent;
  cursor: pointer;
  outline: none;
  margin: 0;
  padding: 0;
}

.scan-slider::-webkit-slider-runnable-track {
  width: 3px;
  height: 100%;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
}

.scan-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #4fc3f7;
  border: 2px solid rgba(255,255,255,0.3);
  box-shadow: 0 0 6px rgba(79,195,247,0.4);
  cursor: pointer;
  margin-left: -6px;
}

.scan-slider::-moz-range-track {
  width: 3px;
  height: 100%;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
}

.scan-slider::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #4fc3f7;
  border: 2px solid rgba(255,255,255,0.3);
  cursor: pointer;
}

/* -- pointer track area -- */
.scan-chamber .pointer-track {
  position: absolute;
  inset: 0;
  z-index: 6;
  cursor: pointer;
}

/* -- right info panel -- */
.info-panel {
  flex: 1 1 auto;
  min-width: 0;
  height: 100%;
  padding: 0 0 0 28px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.info-panel .guide-text {
  font-size: var(--fs-sec);
  color: rgba(255,255,255,0.4);
  line-height: 1.5;
  text-align: center;
  padding: 40px 20px;
  border: 1px dashed rgba(255,255,255,0.08);
  border-radius: 8px;
}

/* -- relic card -- */
.relic-card {
  display: none;
  flex-direction: column;
  gap: 12px;
  opacity: 0;
  transition: opacity 0.4s;
}

.relic-card.visible {
  display: flex;
  opacity: 1;
}

.relic-card .rc-header {
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.relic-card .rc-num {
  font-size: var(--fs-lead);
  font-weight: 700;
  color: #4fc3f7;
  letter-spacing: 0.04em;
}

.relic-card .rc-name {
  font-size: var(--fs-h2);
  font-weight: 700;
  color: var(--text);
}

.relic-card .rc-loc {
  font-size: var(--fs-label);
  color: rgba(255,255,255,0.4);
  margin-top: -4px;
}

.relic-card .rc-body {
  font-size: var(--fs-body);
  line-height: 1.5;
  color: rgba(255,255,255,0.8);
  max-width: 560px;
}

.relic-card .rc-tag {
  display: inline-block;
  font-size: var(--fs-label);
  color: #4fc3f7;
  background: rgba(79,195,247,0.08);
  padding: 2px 10px;
  border-radius: 4px;
  letter-spacing: 0.05em;
  margin-top: 4px;
}

/* -- evidence line -- */
.evidence-line {
  font-size: var(--fs-sec);
  color: rgba(255,255,255,0.5);
  line-height: 1.5;
  margin-top: 16px;
  padding: 12px 16px;
  border-left: 3px solid rgba(79,195,247,0.3);
  background: rgba(79,195,247,0.04);
  border-radius: 0 6px 6px 0;
}

/* -- bottom progress bar -- */
.progress-strip {
  position: absolute;
  top: 572px;
  left: 0;
  width: 1408px;
  height: 48px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 20px;
  border-top: 1px solid rgba(255,255,255,0.06);
  background: rgba(0,0,0,0.3);
  z-index: 2;
}

.progress-seg {
  flex: 1;
  height: 10px;
  border-radius: 5px;
  background: rgba(255,255,255,0.06);
  transition: background 0.5s, box-shadow 0.5s;
  position: relative;
}

.progress-seg.filled {
  background: #4fc3f7;
  box-shadow: 0 0 6px rgba(79,195,247,0.3);
}

.progress-seg .seg-label {
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: rgba(255,255,255,0.2);
  white-space: nowrap;
  transition: color 0.3s;
}

.progress-seg.filled .seg-label {
  color: rgba(255,255,255,0.6);
}

.progress-msg {
  position: absolute;
  top: 548px;
  left: 0;
  width: 1408px;
  height: 24px;
  font-size: var(--fs-sec);
  color: #4fc3f7;
  text-align: center;
  opacity: 0;
  transition: opacity 0.6s;
  line-height: 1.4;
}

.progress-msg.show {
  opacity: 1;
}

/* -- reduced motion -- */
@media (prefers-reduced-motion: reduce) {
  .scan-line,
  .hotspot,
  .hotspot .hs-dot,
  .relic-card,
  .progress-seg,
  .progress-msg {
    transition: none !important;
  }
}
</style>
</head>
<body data-page="46" data-total="50">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  'use strict';

  // ===== 挂载页眉页脚 =====
  Lec.mount({
    index: 46,
    kicker: 'REMNANTS · 遗迹',
    title: '身体里的考古',
    take: '身体从来不从头设计——它只在旧版本上增删修补，处处留着演化史的痕迹。'
  });

  var stage = document.getElementById('stage');

  // ===== 遗迹数据 =====
  var relics = [
    { id: 'r01', num: '01', name: '智齿', loc: '口腔后部', y: 0.10,
      body: '祖先咀嚼粗食时颌骨更大，食物变软后颌骨缩小，但长智齿的指令原样照发——演化没有先见之明，它只会给旧程序打补丁。',
      tag: '遗留指令' },
    { id: 'r02', num: '02', name: '对握拇指', loc: '手掌拇指侧', y: 0.35,
      body: '拇指对握在几千万年前已经成形——那是灵长类在树冠间抓握攀爬的遗产。它让手能握住石片、磨出矛尖、按下发射按钮。',
      tag: '古老遗产' },
    { id: 'r03', num: '03', name: '腰背痛', loc: '下背部', y: 0.50,
      body: '两足行走把脊柱从拱桥变成立柱，把磨损的压力集中到了腰。腰背痛不是故障，是重建姿势结构时欠下的债。',
      tag: '姿势代价' },
    { id: 'r04', num: '04', name: '尾骨', loc: '脊柱最下端', y: 0.70,
      body: '一段退化椎骨，属于一条比人科更古老的尾巴。树栖祖先靠它平衡，地面生活让它失去用场，身体只留下这个缩写。',
      tag: '退化遗迹' }
  ];

  // ===== HTML 结构 =====
  var html = '';

  // 主内容行
  html += '<div class="content-row">';

  // --- 左栏：扫描舱 ---
  html += '<div class="scan-chamber" id="scanChamber">';
  html += '  <div class="grid-bg"></div>';
  html += '  <div class="body-wrap" id="bodyWrap">';
  html += '    <img class="body-img" src="assets/img/p46-body.png" alt="人体轮廓示意插画" title="人体轮廓示意插画（生成）" id="bodyImg">';
  html += '  </div>';

  // 扫描线
  html += '  <div class="scan-line" id="scanLine"></div>';

  // 四个热点
  for (var i = 0; i < relics.length; i++) {
    var r = relics[i];
    var left = (r.id === 'r02') ? '22%' : '50%';
    html += '  <div class="hotspot" id="' + r.id + '" style="top:' + (r.y * 100) + '%;left:' + left + '">';
    html += '    <div class="hs-dot"></div>';
    html += '    <div class="connector"></div>';
    html += '  </div>';
  }

  // 指针跟踪层
  html += '  <div class="pointer-track" id="pointerTrack"></div>';

  // 垂直滑块
  html += '  <div class="scan-slider-wrap">';
  html += '    <input type="range" class="scan-slider" id="scanSlider" min="0" max="1000" value="0" step="1" orient="vertical" aria-label="扫描线位置">';
  html += '  </div>';

  html += '</div>'; // end scan-chamber

  // --- 右栏：信息面板 ---
  html += '<div class="info-panel" id="infoPanel">';

  // 引导语
  html += '  <div class="guide-text" id="guideText">移动扫描线，在身体上寻找演化的痕迹</div>';

  // 四张遗迹卡
  for (var i = 0; i < relics.length; i++) {
    var c = relics[i];
    html += '  <div class="relic-card" id="card' + c.num + '" data-idx="' + i + '">';
    html += '    <div class="rc-header">';
    html += '      <span class="rc-num">' + c.num + '</span>';
    html += '      <span class="rc-name">' + c.name + '</span>';
    html += '    </div>';
    html += '    <div class="rc-loc">' + c.loc + '</div>';
    html += '    <div class="rc-body">' + c.body + '</div>';
    html += '    <div class="rc-tag">' + c.tag + '</div>';
    html += '  </div>';
  }

  // 收束句
  html += '  <div class="evidence-line" id="evidenceLine">腰背痛、智齿、尾骨、对握拇指不是「缺陷」，是历史证据。我们带着满身痕迹离开地球，把它们一起装进了宇航服。</div>';

  html += '</div>'; // end info-panel

  html += '</div>'; // end content-row

  // --- 底部进度条 ---
  html += '<div class="progress-strip" id="progressStrip">';
  for (var i = 0; i < 4; i++) {
    html += '  <div class="progress-seg" id="seg' + (i+1) + '" data-idx="' + i + '">';
    html += '    <span class="seg-label">' + (i+1) + '</span>';
    html += '  </div>';
  }
  html += '</div>';
  html += '<div class="progress-msg" id="progressMsg">四枚遗迹，同一条演化路——你的身体里住着整部演化史。</div>';

  // 插入到 main
  var main = document.getElementById('main');
  main.innerHTML = html;

  // ===== DOM 引用 =====
  var chamber = document.getElementById('scanChamber');
  var bodyWrap = document.getElementById('bodyWrap');
  var scanLine = document.getElementById('scanLine');
  var slider = document.getElementById('scanSlider');
  var pointerTrack = document.getElementById('pointerTrack');
  var guideText = document.getElementById('guideText');
  var cards = [
    document.getElementById('card01'),
    document.getElementById('card02'),
    document.getElementById('card03'),
    document.getElementById('card04')
  ];
  var hotspots = [
    document.getElementById('r01'),
    document.getElementById('r02'),
    document.getElementById('r03'),
    document.getElementById('r04')
  ];
  var segs = [
    document.getElementById('seg1'),
    document.getElementById('seg2'),
    document.getElementById('seg3'),
    document.getElementById('seg4')
  ];
  var progressMsg = document.getElementById('progressMsg');

  // ===== 状态 =====
  var found = [false, false, false, false];
  var activeIdx = -1;
  var allFound = false;

  // Scan range: the Y range the scan line travels within the body image area
  var scanTop = 0;
  var scanBottom = 0;
  var scanRange = 0;

  function updateScanRange() {
    var ch = chamber.getBoundingClientRect();
    var wrapW = ch.width * 0.80;
    var wrapH = ch.height * 0.86;
    var wrapTop = (ch.height - wrapH) / 2;
    var wrapLeft = (ch.width - wrapW) / 2;

    // Image aspect ratio: 2048/1152 ≈ 1.78
    var imgAspect = 2048 / 1152;
    var imgW, imgH;
    if (wrapW / wrapH > imgAspect) {
      imgH = wrapH;
      imgW = imgH * imgAspect;
    } else {
      imgW = wrapW;
      imgH = imgW / imgAspect;
    }
    var imgTop = wrapTop + (wrapH - imgH) / 2;
    var imgBottom = imgTop + imgH;

    scanTop = imgTop / ch.height * 100;
    scanBottom = imgBottom / ch.height * 100;
    scanRange = scanBottom - scanTop;
  }

  function updateScan(t) {
    // t = 0..1, 0 = top of body, 1 = bottom of body
    var y = scanTop + t * scanRange;
    scanLine.style.top = y + '%';

    // Check each hotspot
    var activeHotspot = -1;
    for (var i = 0; i < hotspots.length; i++) {
      var dist = Math.abs(t - relics[i].y);
      var threshold = 0.045;
      var isActive = dist < threshold;

      if (isActive) {
        hotspots[i].classList.add('active');
        if (!found[i]) {
          found[i] = true;
          segs[i].classList.add('filled');
        }
        activeHotspot = i;
      } else {
        hotspots[i].classList.remove('active');
      }
    }

    // Show card for active hotspot, or most recently found
    var showIdx = activeHotspot >= 0 ? activeHotspot : -1;
    // If no active hotspot but some found, show the closest found
    if (showIdx < 0) {
      var closest = -1;
      var closestDist = Infinity;
      for (var i = 0; i < found.length; i++) {
        if (found[i]) {
          var d = Math.abs(t - relics[i].y);
          if (d < closestDist) {
            closestDist = d;
            closest = i;
          }
        }
      }
      showIdx = closest;
    }

    // Update card display
    if (showIdx >= 0 && showIdx !== activeIdx) {
      for (var i = 0; i < cards.length; i++) {
        cards[i].classList.remove('visible');
        cards[i].style.display = 'none';
      }
      cards[showIdx].style.display = 'flex';
      // Force reflow then add visible class for transition
      void cards[showIdx].offsetWidth;
      cards[showIdx].classList.add('visible');
      activeIdx = showIdx;
      guideText.style.display = 'none';
    } else if (showIdx < 0) {
      // No hotspot found, show guide
      for (var i = 0; i < cards.length; i++) {
        cards[i].classList.remove('visible');
        cards[i].style.display = 'none';
      }
      guideText.style.display = 'block';
      activeIdx = -1;
    }

    // Check all found
    var allFoundNow = found.every(function(f) { return f; });
    if (allFoundNow && !allFound) {
      allFound = true;
      progressMsg.classList.add('show');
    }
  }

  // ===== 滑块事件 =====
  slider.addEventListener('input', function() {
    var val = parseInt(this.value, 10);
    var t = val / 1000;
    updateScan(t);
  });

  // ===== 指针跟踪 =====
  function handlePointer(e) {
    var rect = chamber.getBoundingClientRect();
    var relY = (e.clientY - rect.top) / rect.height;
    var t = (relY - scanTop / 100) / (scanRange / 100);
    t = Math.max(0, Math.min(1, t));
    var val = Math.round(t * 1000);
    slider.value = val;
    updateScan(t);
  }

  pointerTrack.addEventListener('pointermove', handlePointer);
  pointerTrack.addEventListener('pointerdown', handlePointer);

  // ===== 键盘可达 =====
  slider.addEventListener('keydown', function(e) {
    var step = 20;
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
      e.preventDefault();
      this.value = Math.min(1000, parseInt(this.value, 10) + step);
      updateScan(parseInt(this.value, 10) / 1000);
    } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
      e.preventDefault();
      this.value = Math.max(0, parseInt(this.value, 10) - step);
      updateScan(parseInt(this.value, 10) / 1000);
    } else if (e.key === 'Home') {
      e.preventDefault();
      this.value = 0;
      updateScan(0);
    } else if (e.key === 'End') {
      e.preventDefault();
      this.value = 1000;
      updateScan(1);
    }
  });

  // ===== 初始化 =====
  function init() {
    updateScanRange();
    var initT = 0.02;
    slider.value = Math.round(initT * 1000);
    updateScan(initT);
  }

  setTimeout(init, 100);

  Deck.onResize(function() {
    updateScanRange();
    updateScan(parseInt(slider.value, 10) / 1000);
  });

})();
</script>
</body>
</html>
