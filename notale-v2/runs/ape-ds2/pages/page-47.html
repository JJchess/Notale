<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/lib/gsap.min.js"></script>
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
  --stage-w: 1600px;
  --stage-h: 900px;
}

/* ====== page-47 specific ====== */
#stage {
  --col-1: #7a8a9a;
  --col-2: #8a9aaa;
  --col-3: #9aaa8a;
  --dim-w: 100px;
}

/* comparison grid: dim label + 3 equal species cols */
.k-comparison {
  --k-comp-cols: 3;
  grid-template-columns: var(--dim-w) 1fr 1fr 1fr;
  column-gap: 10px;
  row-gap: 0;
  align-items: stretch;
  width: 100%;
}

.k-comparison .hdr {
  font-size: var(--fs-lead);
  font-weight: 700;
  text-align: center;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding: 6px 0 8px 0;
  color: var(--text);
}

.k-comparison .hdr:first-child {
  text-align: left;
  font-size: var(--fs-sec);
  color: var(--muted);
  font-weight: 400;
}

/* dimension label */
.k-comparison .dim {
  font-size: var(--fs-sec);
  font-weight: 600;
  color: var(--muted);
  text-align: right;
  padding-right: 8px;
  white-space: nowrap;
  cursor: pointer;
  transition: color 0.3s, opacity 0.4s;
  user-select: none;
}
.k-comparison .dim:hover { color: var(--text); }
.k-comparison .dim:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 2px;
  color: var(--text);
}

/* species cells */
.k-comparison .cell {
  padding: 6px 8px;
  text-align: center;
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-height: 72px;
  opacity: 0.12;
  background: transparent;
  transition: opacity 0.45s ease, background 0.45s ease;
}

.k-comparison .cell.revealed {
  opacity: 0.45;
  background: rgba(255,255,255,0.03);
}
.k-comparison .cell.current {
  opacity: 1;
  background: rgba(255,255,255,0.06);
}

/* row separator */
.k-comparison .rowline {
  border-top: 1px solid rgba(255,255,255,0.06);
}

/* cell text */
.k-comparison .cell .sub {
  font-size: var(--fs-sec);
  color: var(--muted);
  line-height: 1.35;
}

/* brain capacity circles */
.brn-circles {
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* silhouettes */
.silhouette-wrap {
  width: 100%;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.silhouette-wrap img {
  height: 60px;
  width: auto;
  filter: brightness(0.8) saturate(0.3);
  object-fit: contain;
}

/* home row icons */
.home-icon {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.home-icon svg {
  width: 40px;
  height: 40px;
  opacity: 0.7;
}

/* row 4 cells */
.row4-cell {
  transition: transform 0.6s ease, opacity 0.6s ease;
}

/* ====== controls ====== */
.ctl-row {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 8px;
  padding: 4px 0;
}

input[type="range"]#cursor-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  max-width: 600px;
  height: 4px;
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
  outline: none;
  margin: 0;
  cursor: pointer;
}
input[type="range"]#cursor-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid rgba(255,255,255,0.3);
  cursor: pointer;
  transition: box-shadow 0.2s;
}
input[type="range"]#cursor-slider::-webkit-slider-thumb:hover {
  box-shadow: 0 0 12px rgba(79,110,242,0.5);
}
input[type="range"]#cursor-slider::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid rgba(255,255,255,0.3);
  cursor: pointer;
}

/* ====== main statement ====== */
#main-statement {
  display: none;
  text-align: center;
  padding: 6px 0 0 0;
}
#main-statement.visible {
  display: block;
}
#main-statement .title {
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.05em;
}
#main-statement .sub {
  display: block;
  font-size: var(--fs-sec);
  font-weight: 400;
  color: var(--muted);
  margin-top: 4px;
  letter-spacing: 0.02em;
}

/* ====== layout ====== */
#main {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 0 40px;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
}

.comparison-wrap {
  width: 100%;
  max-width: 1300px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

</style>
</head>
<body data-page="47" data-total="50">
<div id="stage">
<main id="main">
  <div class="comparison-wrap">
    <div class="k-comparison" id="comp-table">

      <!-- header row -->

        </div>
      </div>

      <div class="rowline"></div>

      <div class="crow" data-row="2">
        <div class="dim" data-target="2" tabindex="0" role="button">家园</div>
        <div class="cell" data-species="chimp">
          <div class="home-icon">
            <svg viewBox="0 0 40 40" width="40" height="40">
              <path d="M20 3 L36 16 L36 37 L4 37 L4 16 Z" fill="rgba(122,138,154,0.2)" stroke="rgba(122,138,154,0.5)" stroke-width="1.5"/>

        </div>

            <svg viewBox="0 0 40 40" width="40" height="40">

              <line x1="6" y1="16" x2="20" y2="6" stroke="rgba(138,154,170,0.4)" stroke-width="1.5"/>
              <line x1="34" y1="16" x2="20" y2="6" stroke="rgba(138,154,170,0.4)" stroke-width="1.5"/>
              <path d="M12 26 Q20 24 28 26" fill="none" stroke="rgba(138,154,170,0.3)" stroke-width="1"/>
            </svg>
          </div>
          <div class="sub">欧亚草原与冰川边缘</div>
        </div>
        <div class="cell" data-species="sapien">
          <div class="home-icon">
            <svg viewBox="0 0 40 40" width="40" height="40">
              <circle cx="20" cy="20" r="16" fill="none" stroke="rgba(154,170,138,0.4)" stroke-width="1.5"/>
              <path d="M20 4 L20 36 M4 20 L36 20" stroke="rgba(154,170,138,0.25)" stroke-width="1.5"/>
              <path d="M10 22 Q20 16 30 22" fill="none" stroke="rgba(154,170,138,0.4)" stroke-width="1.5"/>

          <div class="home-icon">

              <line x1="34" y1="16" x2="20" y2="6" stroke="rgba(138,154,170,0.4)" stroke-width="1.5"/>

              <path d="M14 30 Q16 27 19 28 Q22 30 25 27" fill="none" stroke="rgba(200,200,150,0.6)" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M15 28 L16 27.5 L18 29 L20 27 L22 28.5 L24 27.5 L25 27" fill="none" stroke="rgba(200,200,150,0.5)" stroke-width="1"/>

    </div><!-- /k-comparison -->

    <!-- controls -->
    <div class="ctl-row">
      <input type="range" id="cursor-slider" min="0" max="3" value="0" step="1" aria-label="对照行选择">

    <!-- main statement -->
    <div id="main-statement">
      <span class="title">差之毫厘，路分三途</span>
      <span class="sub">黑猩猩留在了森林 · 尼安德特人消失 · 智人登上了月球</span>
    </div>
  </div><!-- /comparison-wrap -->

</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function () {
  'use strict';

  /* ====== constants ====== */
  var CHIMP_BRAIN_CC = 350;       // 全套口径
  var NEANDERTHAL_BRAIN_CC = 1500; // 全套口径
  var HOMO_SAPIENS_BRAIN_CC = 1400; // 对齐 p13
  var NEANDERTHAL_EXTINCT_YEARS_AGO = 40000; // 全套口径

  /* ====== mount ====== */
  Lec.mount({
    index: 47,
    kicker: 'THREE WAYS',
    title: '差之毫厘，路分三途',
    take: '智人、尼安德特人与黑猩猩三项对比——差之毫厘，却走出了不同的路'
  });

  /* ====== DOM refs ====== */
  var slider = document.getElementById('cursor-slider');
  var compTable = document.getElementById('comp-table');
  var dims = compTable.querySelectorAll('.dim');
  var rows = compTable.querySelectorAll('.crow');
  var mainStatement = document.getElementById('main-statement');
  var row4Cells = document.querySelectorAll('.row4-cell');

  /* ====== state ====== */
  var currentRow = 0;
  var maxRevealed = 0;
  var row4Triggered = false;

  /* ====== update display ====== */
  function updateRows(rowIndex) {
    if (rowIndex > maxRevealed) maxRevealed = rowIndex;
    currentRow = rowIndex;

    rows.forEach(function (crow, ri) {
      var rowCells = crow.querySelectorAll('.cell');
      var isRevealed = ri <= maxRevealed;
      var isCurrent = ri === currentRow;

      rowCells.forEach(function (cell) {
        cell.classList.remove('revealed', 'current');
        if (isCurrent) {
          cell.classList.add('current');
        } else if (isRevealed) {
          cell.classList.add('revealed');
        }
      });

      var dim = crow.querySelector('.dim');
      if (dim) {
        dim.style.opacity = isRevealed ? '1' : '0.3';
        dim.style.fontWeight = isCurrent ? '700' : '600';
      }
    });

    // row 4 special trigger
    if (currentRow === 3 && !row4Triggered) {
      triggerRow4();
    }
  }

  /* ====== row 4 reveal ====== */
  function triggerRow4() {
    if (row4Triggered) return;
    row4Triggered = true;

    var tl = gsap.timeline({ defaults: { ease: 'power2.out', duration: 0.6 } });

    // shift chimp left
    tl.to(row4Cells[0], { x: -8 }, 0);
    // shift neander down + fade
    tl.to(row4Cells[1], { y: 6, opacity: 0.5 }, 0);
    // shift sapien up
    tl.to(row4Cells[2], { y: -8 }, 0);

    // show main statement
    mainStatement.style.display = 'block';
    mainStatement.style.opacity = '0';
    tl.to(mainStatement, { opacity: 1, duration: 0.8 }, '+=0.1');
  }

  /* ====== set row ====== */
  function setRow(val) {
    var rowIndex = parseInt(val, 10);
    if (isNaN(rowIndex) || rowIndex < 0 || rowIndex > 3) return;
    slider.value = rowIndex;
    updateRows(rowIndex);
  }

  /* ====== slider input ====== */
  slider.addEventListener('input', function () {
    setRow(this.value);
  });

  /* ====== click on dim labels ====== */
  dims.forEach(function (dim) {
    dim.addEventListener('click', function () {
      var target = parseInt(this.getAttribute('data-target'), 10);
      if (!isNaN(target)) setRow(target);
    });
    dim.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        var target = parseInt(this.getAttribute('data-target'), 10);
        if (!isNaN(target)) setRow(target);
      }
    });
  });

  /* ====== keyboard ====== */
  slider.addEventListener('keydown', function (e) {
    var val = parseInt(this.value, 10);
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
      e.preventDefault();
      setRow(Math.min(val + 1, 3));
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      e.preventDefault();
      setRow(Math.max(val - 1, 0));
    }
  });

  /* ====== init ====== */
  setRow(0);

})();
</script>
</body>
</html>
