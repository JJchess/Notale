<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ========== page-48: split-lr layout ========== */
#main {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  gap: 0;
  height: 100%;
  width: 100%;
  box-sizing: border-box;
}

/* ---- left column ---- */
.col-left {
  flex: 0 0 340px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding-right: 16px;
  box-sizing: border-box;
  position: relative;
}

/* ---- time arrow line between columns ---- */
.time-arrow {
  flex: 0 0 2px;
  min-width: 0;
  align-self: stretch;
  position: relative;
  background: linear-gradient(to bottom, transparent 0%, var(--accent) 15%, var(--accent) 85%, transparent 100%);
  opacity: 0.5;
  margin: 0 2px 0 0;
}
.time-arrow::after {
  content: "→";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: var(--accent);
  font-size: 12px;
  line-height: 1;
  opacity: 0.8;
}

/* ---- right column: map area ---- */
.col-right {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  position: relative;
  padding-left: 4px;
}
.map-area {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  position: relative;
  overflow: hidden;
  border-radius: 4px;
  background: rgba(0,0,0,0.15);
}
.map-area svg {
  display: block;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}
.map-area canvas.pixi-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  display: block;
}

/* ---- status bar ---- */
.status-bar {
  flex: 0 0 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: var(--fs-label, 15px);
  color: var(--muted, #667085);
  border-top: 1px solid var(--border, #d0d5dd);
  padding: 0 8px;
  margin-top: 4px;
}
.status-bar .count {
  font-weight: 700;
  font-size: var(--fs-body, 18px);
  color: var(--accent, #4f6ef2);
  min-width: 1.2em;
  text-align: center;
}
.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  display: inline-block;
  margin: 0 1px;
  opacity: 0.2;
  transition: opacity 0.5s;
}
.status-dot.on { opacity: 1; }
.status-dot.d1 { background: #e8843d; }
.status-dot.d2 { background: #8fd8f0; }
.status-dot.d3 { background: #3dbfa8; }

/* ---- k-process vertical for left column ---- */
.k-process.is-vertical {
  flex: 1;
  gap: 0;
  min-height: 0;
}
.k-process.is-vertical .step {
  flex: 0 0 auto;
  cursor: pointer;
  text-align: left;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel-bg);
  transition: all 0.4s;
  user-select: none;
}
.k-process.is-vertical .step:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.k-process.is-vertical .step.active {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 1px var(--accent);
}
.k-process.is-vertical .step .layer-name {
  font-size: var(--fs-body, 18px);
  font-weight: 700;
  margin-bottom: 1px;
  display: flex;
  align-items: center;
  gap: 8px;
  line-height: 1.3;
}
.k-process.is-vertical .step .layer-name .swatch {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex: 0 0 auto;
  display: inline-block;
}
.k-process.is-vertical .step .layer-time {
  font-size: var(--fs-sec, 16px);
  color: var(--muted);
  line-height: 1.35;
  margin-bottom: 4px;
}
.k-process.is-vertical .step .layer-stats {
  font-size: var(--fs-sec, 16px);
  line-height: 1.4;
  color: var(--text);
}
.k-process.is-vertical .step .layer-stats .stat {
  display: flex;
  align-items: baseline;
  gap: 3px;
  flex-wrap: wrap;
}
.k-process.is-vertical .step .layer-stats .stat .num {
  font-weight: 600;
  white-space: nowrap;
}
.k-process.is-vertical .step .layer-stats .stat .desc {
  color: var(--muted);
  font-size: var(--fs-sec, 16px);
}
.k-process.is-vertical .arw {
  height: 20px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 12px;
  opacity: 0.4;
}
.k-process.is-vertical .arw::before {
  content: "↓";
}

/* ---- auto-play button ---- */
.play-row {
  flex: 0 0 auto;
  padding: 6px 0 0;
  display: flex;
  justify-content: center;
}
.btn-play {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 16px;
  font-size: var(--fs-label, 15px);
  border: 1px solid var(--accent);
  border-radius: 5px;
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  transition: all 0.3s;
  font-family: inherit;
}
.btn-play:hover {
  background: var(--accent-soft);
}
.btn-play:active {
  transform: scale(0.97);
}
.btn-play:disabled {
  opacity: 0.35;
  cursor: default;
}

/* ---- initial footprint glow ---- */
.init-footprint {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 1;
}
.init-footprint .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #e8843d;
  box-shadow: 0 0 18px 6px rgba(232, 132, 61, 0.4);
  animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.4); }
}

/* ---- labels for map ---- */
.map-label {
  position: absolute;
  font-size: 14px;
  color: var(--muted);
  opacity: 0.5;
  pointer-events: none;
  z-index: 1;
}
.map-label.laetoli {
  top: 54%;
  left: 50%;
  transform: translate(-50%, 14px);
  white-space: nowrap;
}
</style>
</head>
<body data-page="48" data-total="50">
<div id="stage">
<main id="main">
<!-- left column -->
<div class="col-left">

  <div class="k-process is-vertical">
    <!-- Step 1: Land -->
    <div class="step" data-layer="0" tabindex="0" role="button" aria-label="地表足迹层">
      <div class="layer-name">
        <span class="swatch" style="background:#e8843d;"></span>
        地表足迹
      </div>
      <div class="layer-time">约 1 万年前 · 农业与定居</div>
      <div class="layer-stats">
        <div class="stat"><span class="num" id="val-land-frac"></span><span class="desc">无冰陆地已改造</span></div>
        <div class="stat"><span class="num" id="val-land-mass"></span><span class="desc">人工质量 ≈ 全球干生物量</span></div>
      </div>
    </div>
    <div class="arw"></div>

    <!-- Step 2: Atmosphere -->
    <div class="step" data-layer="1" tabindex="0" role="button" aria-label="大气足迹层">
      <div class="layer-name">
        <span class="swatch" style="background:#8fd8f0;"></span>
        大气足迹
      </div>
      <div class="layer-time">18 世纪中叶 · 工业革命起</div>
      <div class="layer-stats">
        <div class="stat"><span class="num" id="val-co2"></span><span class="desc">CO₂ 浓度，较工业革命前高约 50%</span></div>
        <div class="stat"><span class="num" id="val-warming"></span><span class="desc">全球地表均温升高</span></div>
      </div>
    </div>
    <div class="arw"></div>

    <!-- Step 3: Ocean -->
    <div class="step" data-layer="2" tabindex="0" role="button" aria-label="海洋足迹层">
      <div class="layer-name">
        <span class="swatch" style="background:#3dbfa8;"></span>
        海洋足迹
      </div>
      <div class="layer-time">20 世纪中叶起</div>
      <div class="layer-stats">
        <div class="stat"><span class="num" id="val-ocean-plastic"></span><span class="desc">海洋塑料存量</span></div>
        <div class="stat"><span class="num" id="val-ocean-ph"></span><span class="desc">表层海水 pH 下降</span></div>
      </div>
    </div>
  </div>

  <div class="play-row">
    <button class="btn-play" id="btn-play">▶ 依次叠加</button>
  </div>
</div>

<!-- time arrow -->
<div class="time-arrow"></div>

<!-- right column -->
<div class="col-right">
  <div class="map-area" id="map-area">
    <div class="init-footprint" id="init-footprint">
      <div class="dot"></div>
    </div>
    <div class="map-label laetoli">Laetoli · 366 万年前</div>
  </div>
  <div class="status-bar">
    <span>已叠加</span>
    <span class="count" id="layer-count">0</span>
    <span>/ 3 层</span>
    <span style="margin-left:8px;display:flex;gap:3px;align-items:center;">
      <span class="status-dot d1" id="dot-0"></span>
      <span class="status-dot d2" id="dot-1"></span>
      <span class="status-dot d3" id="dot-2"></span>
    </span>
  </div>
</div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/pixi.min.js"></script>
<script>
/* ========== page-48 constants (全套口径) ========== */
var K48 = {
  MODIFIED_LAND_FRACTION: 0.5,
  ANTHROPOGENIC_MASS_TONNES: 1.1e12,
  GLOBAL_BIOMASS_TONNES: 1.0e12,
  CO2_PPM_PREINDUSTRIAL: 280,
  CO2_PPM_CURRENT: 420,
  GLOBAL_WARMING_DEGC: 1.2,
  OCEAN_PLASTIC_TONNES: 1.7e8,
  ANNUAL_PLASTIC_INPUT_TONNES: 1.1e7,
  OCEAN_PH_DROP: 0.1
};

/* ========== Mount ========== */
Lec.mount({
  index: 48,
  kicker: 'FOOTPRINT LAYERS',
  title: '脚印铺满地球',
  sub: 'FOOTPRINT LAYERS'
});

/* ========== Format helpers ========== */
function fmtPct(v) {
  return '约 ' + Math.round(v * 100) + '%';
}
function fmtMass(v) {
  if (v >= 1e12) return '约 ' + (v / 1e12).toFixed(1) + ' 太吨';
  if (v >= 1e8) return '约 ' + (v / 1e8).toFixed(1) + ' 亿吨';
  return '约 ' + v.toExponential(1) + ' t';
}
function fmtPpm(v) {
  return '约 ' + Math.round(v) + ' ppm';
}
function fmtTemp(v) {
  return '约 ' + v.toFixed(1) + ' °C';
}
function fmtPh(v) {
  return '约 ' + v.toFixed(1);
}

/* ========== Fill values ========== */
document.getElementById('val-land-frac').textContent = fmtPct(K48.MODIFIED_LAND_FRACTION);
document.getElementById('val-land-mass').textContent = fmtMass(K48.ANTHROPOGENIC_MASS_TONNES) + ' / ' + fmtMass(K48.GLOBAL_BIOMASS_TONNES);
document.getElementById('val-co2').textContent = fmtPpm(K48.CO2_PPM_CURRENT);
document.getElementById('val-warming').textContent = fmtTemp(K48.GLOBAL_WARMING_DEGC);
document.getElementById('val-ocean-plastic').textContent = fmtMass(K48.OCEAN_PLASTIC_TONNES);
document.getElementById('val-ocean-ph').textContent = 'pH ' + fmtPh(K48.OCEAN_PH_DROP);

/* ========== D3 World Map ========== */
var mapArea = document.getElementById('map-area');

/* Simplified world coastline GeoJSON (very coarse) */
var worldGeo = {
  type: "FeatureCollection",
  features: [
    {type:"Feature",properties:{name:"Africa"},geometry:{type:"Polygon",coordinates:[[[-17,14.7],[-17,35],[10,37],[30,32],[33,30],[43,12],[51,12],[40,-3],[35,-10],[30,-35],[18,-35],[12,-18],[9,-4],[-8,5],[-17,14.7]]]}},
    {type:"Feature",properties:{name:"Europe"},geometry:{type:"Polygon",coordinates:[[[-10,36],[-10,44],[-9,48],[-8,58],[-5,60],[5,58],[10,60],[20,58],[25,60],[30,70],[35,66],[40,60],[40,45],[30,42],[25,38],[20,36],[10,36],[-10,36]]]}},
    {type:"Feature",properties:{name:"Asia"},geometry:{type:"Polygon",coordinates:[[[30,30],[30,42],[40,45],[40,60],[50,55],[60,60],[70,55],[80,58],[90,55],[100,55],[110,50],[120,50],[130,45],[140,45],[145,40],[140,35],[130,30],[120,25],[110,20],[105,10],[100,0],[95,-5],[90,-8],[80,-5],[75,10],[70,15],[60,25],[50,25],[40,25],[30,30]]]}},
    {type:"Feature",properties:{name:"North America"},geometry:{type:"Polygon",coordinates:[[[-170,65],[-168,60],[-165,55],[-160,50],[-150,45],[-140,40],[-130,35],[-120,30],[-110,25],[-100,25],[-90,30],[-85,30],[-80,25],[-75,30],[-70,40],[-75,45],[-70,50],[-65,60],[-60,65],[-70,70],[-100,72],[-130,70],[-150,70],[-170,65]]]}},
    {type:"Feature",properties:{name:"South America"},geometry:{type:"Polygon",coordinates:[[[-80,10],[-75,10],[-60,10],[-50,5],[-35,-5],[-35,-10],[-40,-20],[-45,-25],[-50,-30],[-55,-35],[-60,-40],[-65,-45],[-70,-50],[-72,-55],[-75,-53],[-70,-45],[-70,-35],[-70,-25],[-75,-15],[-80,0],[-80,10]]]}},
    {type:"Feature",properties:{name:"Australia"},geometry:{type:"Polygon",coordinates:[[[115,-10],[120,-10],[130,-12],[140,-15],[145,-20],[150,-25],[153,-30],[150,-35],[145,-38],[140,-38],[135,-35],[130,-32],[125,-30],[120,-25],[115,-20],[115,-10]]]}},
    {type:"Feature",properties:{name:"Greenland"},geometry:{type:"Polygon",coordinates:[[[-55,60],[-45,60],[-30,65],[-20,70],[-20,80],[-30,82],[-45,82],[-55,80],[-55,75],[-55,60]]]}},
    {type:"Feature",properties:{name:"Antarctica"},geometry:{type:"Polygon",coordinates:[[[-180,-70],[-120,-70],[-60,-70],[0,-70],[60,-70],[120,-70],[180,-70],[180,-90],[-180,-90],[-180,-70]]]}}
  ]
};

var proj = null;

function drawMap() {
  var w = mapArea.clientWidth;
  var h = mapArea.clientHeight;
  if (w < 10 || h < 10) { w = 900; h = 460; }

  var svg = d3.select(mapArea).select('svg.map-svg');
  if (svg.empty()) {
    svg = d3.select(mapArea).append('svg')
      .attr('class', 'map-svg')
      .style('position', 'absolute')
      .style('top', '0')
      .style('left', '0')
      .style('width', '100%')
      .style('height', '100%');
  }

  proj = d3.geoEquirectangular().fitSize([w - 16, h - 16], worldGeo);

  // Graticule
  var graticule = d3.geoGraticule().step([30, 30]);
  svg.selectAll('.graticule').remove();
  svg.append('path')
    .datum(graticule)
    .attr('class', 'graticule')
    .attr('d', d3.geoPath(proj))
    .attr('fill', 'none')
    .attr('stroke', 'rgba(255,255,255,0.06)')
    .attr('stroke-width', 0.5);

  // Continents
  var path = d3.geoPath(proj);
  svg.selectAll('.continent').remove();
  svg.selectAll('.continent')
    .data(worldGeo.features)
    .enter().append('path')
    .attr('class', 'continent')
    .attr('d', path)
    .attr('fill', 'none')
    .attr('stroke', 'rgba(255,255,255,0.18)')
    .attr('stroke-width', 0.6);
}

drawMap();

/* ========== PixiJS Particles ========== */
var app = new PIXI.Application({
  transparent: true,
  antialias: true,
  resolution: 1
});
app.view.classList.add('pixi-canvas');
mapArea.appendChild(app.view);

function resizePixi() {
  var w = mapArea.clientWidth;
  var h = mapArea.clientHeight;
  if (w < 10 || h < 10) return;
  app.renderer.resize(w, h);
}
resizePixi();

/* Projection helper for lat/lng -> pixel */
function latLngToXY(lat, lng) {
  if (!proj) return null;
  var p = proj([lng, lat]);
  return p ? { x: p[0] + 8, y: p[1] + 8 } : null;
}

/* Seeded random */
var rng = new Math.seedrandom('page-48-particles');
function rand(min, max) { return min + rng() * (max - min); }

/* Layer particles config */
var layerConfigs = [
  {
    // Land: warm orange
    color: 0xe8843d,
    alpha: 0.65,
    count: 400,
    gen: function() {
      var regions = [
        {lat: [15,50], lng: [-10,40]},
        {lat: [10,55], lng: [70,135]},
        {lat: [20,55], lng: [-130,-75]},
        {lat: [-30,5], lng: [-75,-40]},
        {lat: [-35,-15], lng: [115,155]}
      ];
      var r = regions[Math.floor(rng() * regions.length)];
      return { lat: rand(r.lat[0], r.lat[1]), lng: rand(r.lng[0], r.lng[1]) };
    }
  },
  {
    // Atmosphere: cyan-white
    color: 0x8fd8f0,
    alpha: 0.45,
    count: 350,
    gen: function() {
      var regions = [
        {lat: [30,58], lng: [-10,50]},
        {lat: [20,48], lng: [110,135]},
        {lat: [25,52], lng: [-130,-65]},
        {lat: [10,35], lng: [70,105]},
        {lat: [-30,-5], lng: [-65,-45]}
      ];
      var r = regions[Math.floor(rng() * regions.length)];
      return { lat: rand(r.lat[0], r.lat[1]), lng: rand(r.lng[0], r.lng[1]) };
    }
  },
  {
    // Ocean: blue-green
    color: 0x3dbfa8,
    alpha: 0.55,
    count: 350,
    gen: function() {
      var regions = [
        {lat: [-10,25], lng: [-170,-110]},
        {lat: [-40,10], lng: [-90,-25]},
        {lat: [10,55], lng: [-80,-5]},
        {lat: [-40,15], lng: [30,105]},
        {lat: [10,45], lng: [130,175]}
      ];
      var r = regions[Math.floor(rng() * regions.length)];
      return { lat: rand(r.lat[0], r.lat[1]), lng: rand(r.lng[0], r.lng[1]) };
    }
  }
];

/* Create particle containers */
var layerContainers = [];
var allParticles = [];

for (var li = 0; li < 3; li++) {
  var cfg = layerConfigs[li];
  var container = new PIXI.Container();
  container.visible = false;
  app.stage.addChild(container);
  layerContainers.push(container);

  var particles = [];
  for (var pi = 0; pi < cfg.count; pi++) {
    var pos = cfg.gen();
    var xy = latLngToXY(pos.lat, pos.lng);
    if (!xy) continue;
    var size = rand(1.5, 4);
    var g = new PIXI.Graphics();
    g.beginFill(cfg.color, 0);
    g.drawCircle(0, 0, size);
    g.endFill();
    g.x = xy.x;
    g.y = xy.y;
    g.alpha = 0;
    g.targetAlpha = cfg.alpha;
    g.fadeDelay = rand(0, 0.8);
    container.addChild(g);
    particles.push(g);
  }
  allParticles.push(particles);
}

/* ========== Layer State ========== */
var activeLayers = [false, false, false];
var isPlaying = false;

function updateUI() {
  var count = activeLayers.filter(Boolean).length;
  document.getElementById('layer-count').textContent = count;
  for (var i = 0; i < 3; i++) {
    var dot = document.getElementById('dot-' + i);
    dot.className = 'status-dot d' + (i + 1) + (activeLayers[i] ? ' on' : '');
    var step = document.querySelector('.step[data-layer="' + i + '"]');
    if (step) {
      step.classList.toggle('active', activeLayers[i]);
    }
  }
  document.getElementById('init-footprint').style.display = count > 0 ? 'none' : '';
}

function activateLayer(idx, animate) {
  if (activeLayers[idx]) return;
  activeLayers[idx] = true;
  var container = layerContainers[idx];
  container.visible = true;
  var particles = allParticles[idx];

  if (animate) {
    particles.forEach(function(p) {
      p.alpha = 0;
      setTimeout(function() {
        p.alpha = p.targetAlpha;
      }, p.fadeDelay * 1000);
    });
  } else {
    particles.forEach(function(p) { p.alpha = p.targetAlpha; });
  }
  updateUI();
}

function deactivateLayer(idx) {
  if (!activeLayers[idx]) return;
  activeLayers[idx] = false;
  layerContainers[idx].visible = false;
  updateUI();
}

function toggleLayer(idx) {
  if (activeLayers[idx]) {
    deactivateLayer(idx);
  } else {
    activateLayer(idx, true);
  }
}

/* ========== Click handlers ========== */
var steps = document.querySelectorAll('.step[data-layer]');
steps.forEach(function(el) {
  el.addEventListener('click', function() {
    if (isPlaying) return;
    var idx = parseInt(el.getAttribute('data-layer'), 10);
    toggleLayer(idx);
  });
  el.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (isPlaying) return;
      var idx = parseInt(el.getAttribute('data-layer'), 10);
      toggleLayer(idx);
    }
  });
});

/* ========== Auto-play ========== */
var btnPlay = document.getElementById('btn-play');

btnPlay.addEventListener('click', function() {
  if (isPlaying) return;
  for (var i = 0; i < 3; i++) deactivateLayer(i);
  isPlaying = true;
  btnPlay.disabled = true;
  btnPlay.textContent = '播放中…';

  var seq = 0;
  function playNext() {
    if (seq >= 3) {
      isPlaying = false;
      btnPlay.disabled = false;
      btnPlay.textContent = '▶ 依次叠加';
      return;
    }
    activateLayer(seq, true);
    seq++;
    setTimeout(playNext, 1200);
  }
  setTimeout(playNext, 400);
});

/* ========== Resize ========== */
function onResize() {
  var w = mapArea.clientWidth;
  var h = mapArea.clientHeight;
  if (w < 10 || h < 10) return;
  resizePixi();
  drawMap();
  // Reposition particles
  for (var li = 0; li < 3; li++) {
    var cfg = layerConfigs[li];
    var particles = allParticles[li];
    var pi = 0;
    for (var ci = 0; ci < cfg.count && pi < particles.length; ci++) {
      var pos = cfg.gen();
      var xy = latLngToXY(pos.lat, pos.lng);
      if (xy) {
        particles[pi].x = xy.x;
        particles[pi].y = xy.y;
        pi++;
      }
    }
  }
}

var resizeTimer = null;
window.addEventListener('resize', function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(onResize, 100);
});
</script>
