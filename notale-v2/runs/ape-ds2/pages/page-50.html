<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ========== page-50: 下一枚脚印 ========== */

/* 约束 #main 不溢出 stage */
#main {
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  overflow: hidden;
}

/* --- 让 k-generalization 变横向, 垂直居中 --- */
.k-generalization.is-horizontal {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 0;
  position: relative;
}
/* 隐藏默认的纵向 trunk */
.k-generalization.is-horizontal::before,
.k-generalization.is-horizontal .trunk {
  display: none;
}

/* --- claim 区域：承载整条路径视觉 --- */
.k-generalization.is-horizontal .claim {
  position: relative;
  border: none;
  background: none;
  padding: 0;
  margin: 0;
  max-width: 100%;
  border-radius: 0;
  font-weight: 400;
  font-size: inherit;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* --- 路径行 --- */
.journey-row {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  width: 100%;
  max-width: 1000px;
  padding: 0 8px;
  min-width: 0;
}

/* 水平连接线：用伪元素画在 journey-row 背后 */
.journey-row::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 45px;
  right: 45px;
  height: 1px;
  background: var(--muted);
  transform: translateY(-50%);
  z-index: 0;
}

/* --- 两端脚印 --- */
.footprint-end {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  flex: 0 0 auto;
}

.footprint-end .footprint-svg {
  display: block;
  color: var(--text);
  opacity: 0.85;
}

.footprint-end .year-label {
  font-size: var(--fs-sec);
  color: var(--muted);
  white-space: nowrap;
  letter-spacing: 0.02em;
}

/* --- 路径上的节点 --- */
.milestone {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  flex: 1 1 0;
  min-width: 0;
}

.milestone .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  flex: 0 0 auto;
}

.milestone .node-label {
  font-size: var(--fs-label);
  color: var(--text);
  font-weight: 600;
  text-align: center;
  white-space: nowrap;
}

/* --- 虚线延伸尾 --- */
.tail-section {
  position: relative;
  z-index: 2;
  flex: 0 0 36px;
  min-width: 36px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
}

.tail-line {
  width: 100%;
  height: 1px;
  border: none;
  border-top: 1px dashed var(--muted);
  opacity: 0.3;
  -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
  mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
}

/* --- 下方收束语 --- */
.takeaway {
  margin-top: 28px;
  font-size: var(--fs-h2);
  font-weight: 700;
  color: var(--text);
  text-align: center;
  line-height: 1.4;
  letter-spacing: 0.02em;
  position: relative;
  z-index: 1;
}

/* 点缀：takeaway 上方一条细短线 */
.takeaway::before {
  content: "";
  display: block;
  width: 28px;
  height: 2px;
  background: var(--accent);
  margin: 0 auto 14px;
  border-radius: 1px;
}

@media (prefers-reduced-motion: reduce) {
  .journey-row::before,
  .tail-line {
    transition: none;
  }
}
</style>
</head>
<body data-page="50" data-total="50">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  'use strict';

  /* ---- 全套口径 ---- */
  var LAETOLI_FOOTPRINTS_YEARS_AGO = 3660000;  // 最早双足行走证据（Laetoli 脚印）
  var APOLLO_11_LANDING_YEAR = 1969;            // 阿波罗 11 号登月年份

  /* ---- 挂载页眉页脚 ---- */
  Lec.mount({
    index: 50,
    kicker: 'CODA',
    title: '下一枚脚印',
    take: '从 366 万年前的脚印到月球上的脚印，是一条连续的路；下一枚脚印踩在哪里，由我们决定'
  });

  var main = document.getElementById('main');
  if (!main) return;

  /* ---- 构建主内容 ---- */
  var gen = document.createElement('div');
  gen.className = 'k-generalization is-horizontal';

  /* claim: 路径视觉 */
  var claim = document.createElement('div');
  claim.className = 'claim';

  /* 路径行 */
  var row = document.createElement('div');
  row.className = 'journey-row';

  /* ---- 左端：Laetoli 脚印 ---- */
  var leftEnd = document.createElement('div');
  leftEnd.className = 'footprint-end';

  var leftSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  leftSvg.setAttribute('viewBox', '0 0 36 60');
  leftSvg.setAttribute('width', '28');
  leftSvg.setAttribute('height', '46');
  leftSvg.setAttribute('class', 'footprint-svg');
  leftSvg.setAttribute('fill', 'none');
  leftSvg.setAttribute('stroke', 'currentColor');
  leftSvg.setAttribute('stroke-width', '1.5');
  leftSvg.setAttribute('stroke-linecap', 'round');
  leftSvg.setAttribute('stroke-linejoin', 'round');
  /* 足印轮廓 */
  var leftPath1 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  leftPath1.setAttribute('d', 'M18 4 Q26 4 28 11 Q30 18 26 26 Q24 32 24 38 Q24 46 20 52 Q18 56 16 52 Q12 46 12 38 Q12 32 10 26 Q6 18 8 11 Q10 4 18 4Z');
  leftSvg.appendChild(leftPath1);
  /* 脚趾区 */
  var leftToes = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  leftToes.setAttribute('d', 'M12 15 Q12 10 15 8 Q18 7 21 8 Q24 10 24 15');
  leftSvg.appendChild(leftToes);
  leftEnd.appendChild(leftSvg);

  var leftLabel = document.createElement('span');
  leftLabel.className = 'year-label';
  leftLabel.textContent = '366 万年前';
  leftEnd.appendChild(leftLabel);

  row.appendChild(leftEnd);

  /* ---- 五个里程碑节点 ---- */
  var nodes = [
    { label: '身体', slug: 'body' },
    { label: '火',   slug: 'fire' },
    { label: '语言', slug: 'language' },
    { label: '文化', slug: 'culture' },
    { label: '太空', slug: 'space' }
  ];

  nodes.forEach(function(n) {
    var ms = document.createElement('div');
    ms.className = 'milestone';

    var dot = document.createElement('div');
    dot.className = 'dot';
    ms.appendChild(dot);

    var label = document.createElement('span');
    label.className = 'node-label';
    label.textContent = n.label;
    ms.appendChild(label);

    row.appendChild(ms);
  });

  /* ---- 右端：月球脚印 ---- */
  var rightEnd = document.createElement('div');
  rightEnd.className = 'footprint-end';

  var rightSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  rightSvg.setAttribute('viewBox', '0 0 42 54');
  rightSvg.setAttribute('width', '32');
  rightSvg.setAttribute('height', '42');
  rightSvg.setAttribute('class', 'footprint-svg');
  rightSvg.setAttribute('fill', 'none');
  rightSvg.setAttribute('stroke', 'currentColor');
  rightSvg.setAttribute('stroke-width', '1.5');
  rightSvg.setAttribute('stroke-linecap', 'round');
  rightSvg.setAttribute('stroke-linejoin', 'round');
  /* 靴印外框 */
  var rightRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rightRect.setAttribute('x', '2');
  rightRect.setAttribute('y', '2');
  rightRect.setAttribute('width', '38');
  rightRect.setAttribute('height', '50');
  rightRect.setAttribute('rx', '4');
  rightSvg.appendChild(rightRect);
  /* 防滑纹 */
  [13, 23, 33, 43].forEach(function(y) {
    var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', '2');
    line.setAttribute('y1', y);
    line.setAttribute('x2', '40');
    line.setAttribute('y2', y);
    rightSvg.appendChild(line);
  });
  rightEnd.appendChild(rightSvg);

  var rightLabel = document.createElement('span');
  rightLabel.className = 'year-label';
  rightLabel.textContent = '1969';
  rightEnd.appendChild(rightLabel);

  row.appendChild(rightEnd);

  /* ---- 虚线延伸尾 ---- */
  var tail = document.createElement('div');
  tail.className = 'tail-section';
  var tailLine = document.createElement('div');
  tailLine.className = 'tail-line';
  tail.appendChild(tailLine);
  row.appendChild(tail);

  claim.appendChild(row);
  gen.appendChild(claim);

  /* ---- 收束语 ---- */
  var takeaway = document.createElement('div');
  takeaway.className = 'takeaway';
  takeaway.textContent = '下一枚脚印踩在哪里，由我们决定';
  gen.appendChild(takeaway);

  main.appendChild(gen);
})();
</script>
</body>
</html>
