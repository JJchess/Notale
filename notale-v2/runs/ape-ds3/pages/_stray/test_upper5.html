<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#main { position: relative; display: flex; flex-direction: column; overflow: hidden; margin: 0; }
.upper-section { flex: 0 0 auto; height: 160px; position: relative; }
.upper-axis-row { position: absolute; left: 80px; right: 60px; top: 72px; height: 44px; }
.upper-axis-tick { position: absolute; top: 14px; width: 1px; height: 12px; background: var(--line); }
.upper-axis-tick.l { left: 0; }
.upper-axis-tick.r { right: 0; }
.upper-axis-label { position: absolute; top: 32px; font-size: 15px; color: var(--muted); }
.upper-axis-label.l { left: 0; }
.upper-axis-label.r { right: 0; }
.highlight-zone { position: absolute; top: 12px; height: 18px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 3px; opacity: 0.7; }
.highlight-zone .hl-label { position: absolute; top: -18px; left: 0; font-size: 15px; color: var(--accent); white-space: nowrap; }
.connector-wrap { position: relative; flex: 0 0 auto; height: 24px; }
.connector-line { position: absolute; left: 80px; top: 0; width: 2px; height: 24px; background: var(--accent); opacity: 0.4; }
.lower-section { flex: 1; position: relative; min-height: 0; }
.lower-axis-row { position: absolute; left: 80px; right: 60px; top: 0; height: 36px; }
.lower-axis-line { position: absolute; left: 0; right: 0; top: 16px; height: 3px; background: var(--line); }
.lower-axis-tick { position: absolute; top: 10px; width: 1px; height: 10px; background: var(--line); }
.lower-axis-tick.l { left: 0; }
.lower-axis-tick.r { right: 0; }
.lower-axis-label { position: absolute; top: 28px; font-size: 15px; color: var(--muted); }
.lower-axis-label.l { left: 0; }
.lower-axis-label.r { right: 0; }
.event-dot { position: absolute; top: 9px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2px solid var(--muted); background: var(--bg); }
.event-label { position: absolute; font-size: 15px; color: var(--muted); white-space: nowrap; text-align: center; transform: translateX(-50%); pointer-events: none; }
.event-label.row1 { top: 28px; }
.event-label.row2 { top: 44px; }
</style>
</head>
