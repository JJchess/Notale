<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* 全屏插画背景 */
  #stage {
    background: var(--bg) url("assets/img/p01-hero.png") center center / cover no-repeat;
  }
  /* 页眉透明，让背景透出 */
  .lec-header {
    background: transparent;
    border-bottom: none;
  }
  .lec-header-inner {
    padding-top: 0;
    align-items: flex-start;
  }
  .lec-kicker {
    color: var(--accent);
    text-shadow: 0 0 12px rgba(0,0,0,.6);
  }
  .lec-title {
    color: var(--text);
    text-shadow: 0 0 16px rgba(0,0,0,.7);
  }
  .lec-nav-prev, .lec-nav-next {
    background: rgba(0,0,0,.4);
    border-color: rgba(255,255,255,.15);
    color: rgba(255,255,255,.7);
  }
  .lec-nav-prev:hover, .lec-nav-next:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .lec-progress {
    background: rgba(255,255,255,.2);
  }
  .lec-foot {
    color: rgba(255,255,255,.5);
  }
  /* 取句 */
  .lec-take {
    font-size: var(--fs-lead);
    line-height: var(--lh-lead);
    color: var(--text);
    text-shadow: 0 0 20px rgba(0,0,0,.8);
    max-width: 600px;
    margin: 0;
  }
  /* 页脚透明 */
  .lec-footer {
    background: transparent;
    border-top: none;
  }
  /* #main 透明，让背景透出；k-generalization 标记结构 */
  #main.k-generalization {
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-end;
    padding: 0 var(--space-5) var(--space-5) var(--space-5);
    text-align: left;
  }
</style>
</head>
<body data-page="01" data-total="50">
<div id="stage">
<main id="main" class="k-generalization">
  <p class="lec-take">从树上到月面，是同一个物种的故事——而且只用了地球历史的一眨眼。</p>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 1,
  kicker: "OPENING · 开场",
  title: "从树上到月面",
  take: "从树上到月面，是同一个物种的故事——而且只用了地球历史的一眨眼。"
});
</script>
</body>
</html>
