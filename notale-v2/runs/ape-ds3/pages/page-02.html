<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* page-02：ledger — 五段路，一条线 */
.k-enumeration.ledger {
  display: flex;
  flex-direction: column;
  gap: 0;
  width: 520px;
  margin: 0 auto;
  position: relative;
  padding: 28px 0 28px 72px;
}

/* 纵向细线：连接五个编号，表示"依次走过" */
.k-enumeration.ledger::before {
  content: '';
  position: absolute;
  left: 28px;
  top: 28px;
  bottom: 28px;
  width: 2px;
  background: var(--accent);
  opacity: 0.35;
  border-radius: 1px;
}

/* 每一行 */
.k-enumeration.ledger > .row {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 18px 0;
  border-bottom: 1px solid var(--line);
  min-width: 0;
  min-height: 0;
}
.k-enumeration.ledger > .row:last-child {
  border-bottom: none;
}

/* 编号：放在竖线右侧 */
.k-enumeration.ledger > .row > .num {
  width: 60px;
  text-align: center;
  font-size: var(--fs-h2);
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.02em;
  position: relative;
  z-index: 1;
  flex-shrink: 0;
}

/* 章节名 */
.k-enumeration.ledger > .row > .name {
  font-size: var(--fs-h1);
  font-weight: 700;
  color: var(--text);
  padding-left: 28px;
  letter-spacing: 0.04em;
  line-height: 1.2;
}

/* 垂直居中 */
#main {
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>
<body data-page="02" data-total="50">
<div id="stage">
<main id="main">
  <div class="k-enumeration ledger">
    <div class="row min0">
      <span class="num">一</span>
      <span class="name">深时</span>
    </div>
    <div class="row min0">
      <span class="num">二</span>
      <span class="name">演化</span>
    </div>
    <div class="row min0">
      <span class="num">三</span>
      <span class="name">逃离</span>
    </div>
    <div class="row min0">
      <span class="num">四</span>
      <span class="name">光速</span>
    </div>
    <div class="row min0">
      <span class="num">五</span>
      <span class="name">回望</span>
    </div>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({ index: 2, kicker: "COURSE ROADMAP", title: "五段路，一条线", take: "五章一条路，从深时到回望" });
</script>
</body>
</html>
