<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg:        #0b0e14;
  --text:      #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}

/* 深色背景覆盖 theme.css 的浅色 surface */
#main {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── generalization 骨架：居中 ── */
#g03 {
  width: 100%;
  height: 100%;
  justify-content: center;
  gap: 0;
}

#g03 .claim {
  font-size: var(--fs-h2);
  line-height: var(--lh-h2);
  max-width: 75%;
  padding: var(--space-4) var(--space-5);
  border-left: 5px solid var(--accent);
  background: rgba(11, 122, 117, 0.08);
}

#g03 .trunk {
  height: var(--space-6);
  width: 2px;
  background: var(--accent);
  margin: var(--space-2) 0;
}

#g03 .supports {
  flex: 0 1 auto;
  padding: var(--space-6) 0 0;
}

/* ── 压缩场景：水平三块 ── */
.scene-compress {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px;
}

/* ── 左端：全部地球史（模糊大圆） ── */
.blob-earth {
  width: 300px;
  height: 300px;
  flex-shrink: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%,
    rgba(130, 148, 175, 0.18) 0%,
    rgba(100, 118, 145, 0.10) 30%,
    rgba(80, 98, 125, 0.05) 55%,
    transparent 72%);
  filter: blur(6px);
  transform: translateZ(0);
}

/* ── 中间：粗短箭头 ── */
.arrw-compress {
  flex-shrink: 0;
  width: 80px;
  height: 28px;
  position: relative;
}
.arrw-compress .arrw-bar {
  position: absolute;
  left: 0;
  top: 8px;
  width: 56px;
  height: 10px;
  background: var(--accent);
  border-radius: 5px;
}
.arrw-compress .arrw-head {
  position: absolute;
  right: 0;
  top: 0;
  width: 0;
  height: 0;
  border-left: 22px solid var(--accent);
  border-top: 14px solid transparent;
  border-bottom: 14px solid transparent;
}

/* ── 右端：年轮 ── */
.ring-wrap {
  position: relative;
  width: 200px;
  height: 200px;
  flex-shrink: 0;
}
.ring-svg {
  width: 100%;
  height: 100%;
  display: block;
}
.year-label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: var(--fs-h2);
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.12em;
  text-align: center;
  pointer-events: none;
}
</style>
</head>
<body data-page="03" data-total="50">
<div id="stage">
<main id="main">
<div class="k-generalization" id="g03">
  <div class="claim">把地球史压成一年——换一把熟悉的尺子，才量得出陌生的时间。</div>
  <div class="trunk"></div>
  <div class="supports">
    <div class="scene-compress">
      <div class="blob-earth" aria-hidden="true"></div>
      <div class="arrw-compress" aria-hidden="true">
        <div class="arrw-bar"></div>
        <div class="arrw-head"></div>
      </div>
      <div class="ring-wrap" aria-label="一年">
        <svg class="ring-svg" viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="100" cy="100" r="82" fill="none" stroke="var(--text)" stroke-width="1.5" opacity="0.35"/>
          <g transform="translate(100, 100)" stroke="var(--text)" stroke-width="1.2" opacity="0.25">
            <line x1="0" y1="-82" x2="0" y2="-72" transform="rotate(0)" />
            <line x1="0" y1="-82" x2="0" y2="-72" transform="rotate(30)" />
            <line x1="0" y1="-82" x2="0" y2="-72" transform="rotate(60)" />
            <line x1="0" y1="-82" x2="0" y2="-72" transform="rotate(90)" />
            <line x1="0" y1="-82" x2="0" y2="-72" transform="rotate(120)" />
            <line x1="0" y1="-82" x2="0" y2="-72" transform="rotate(150)" />
            <line x1="0" y1="-82" x2="0" y2="-72" transform="rotate(180)" />
            <line x1="0" y1="-82" x2="0" y2="-72" transform="rotate(210)" />
            <line x1="0" y1="-82" x2="0" y2="-72" transform="rotate(240)" />
            <line x1="0" y1="-82" x2="0" y2="-72" transform="rotate(270)" />
            <line x1="0" y1="-82" x2="0" y2="-72" transform="rotate(300)" />
            <line x1="0" y1="-82" x2="0" y2="-72" transform="rotate(330)" />
          </g>
        </svg>
        <span class="year-label">一年</span>
      </div>
    </div>
  </div>
</div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({ index: 3, kicker: "第一章 · 深时", title: "把地球史压进一年", take: "把地球史压成一年——换一把熟悉的尺子，才量得出陌生的时间。" });
</script>
</body>
</html>
