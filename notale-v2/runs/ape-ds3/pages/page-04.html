<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #f8f6f0;
  --text: #1a1a1a;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}

#main {
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
}

/* ── upper: ruler ── */
.upper {
  flex: 0 0 340px;
  width: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding-bottom: 8px;
  position: relative;
  overflow: hidden;
}

.ruler-zone {
  position: relative;
  width: 100%;
  height: 120px;
  margin: 0;
}

/* 12 equal month blocks */
.month-grid {
  position: absolute;
  left: 0;
  right: 0;
  top: 14px;
  height: 72px;
  display: flex;
}
.month-block {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--line);
  border-right: none;
  background: var(--surface);
  cursor: pointer;
  transition: background .2s;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  position: relative;
}
.month-block:last-child {
  border-right: 1px solid var(--line);
}
.month-block:hover {
  background: var(--accent-soft);
}
.month-block.active {
  background: #d4e6e5;
  border-color: var(--accent);
}

/* month labels below blocks */
.month-labels {
  position: absolute;
  left: 0;
  right: 0;
  top: 88px;
  height: 18px;
  display: flex;
}
.month-label {
  flex: 1;
  min-width: 0;
  text-align: center;
  font-size: var(--fs-tick);
  color: var(--muted);
  line-height: 1;
}

/* ruler endpoints */
.ruler-endpoints {
  position: absolute;
  left: 0;
  right: 0;
  top: 106px;
  height: 16px;
  display: flex;
  justify-content: space-between;
  font-size: var(--fs-label);
  color: var(--muted);
  line-height: 1;
}

/* 人 marker */
.human-marker {
  position: absolute;
  top: 0;
  z-index: 5;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 14px;
  margin-left: -7px;
}
.human-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--warning);
  flex: 0 0 auto;
}
.human-label {
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--warning);
  line-height: 1.2;
  white-space: nowrap;
}

/* observation window */
.obs-window {
  position: absolute;
  top: 14px;
  height: 72px;
  z-index: 10;
  cursor: grab;
  touch-action: none;
  user-select: none;
  pointer-events: none;
  width: 16px;
}
.obs-window:active { cursor: grabbing; }
.obs-bracket {
  position: absolute;
  top: 0;
  height: 100%;
  width: 2px;
  background: var(--accent);
}
.obs-bracket.left { left: 0; }
.obs-bracket.right { right: 0; }
.obs-fill {
  position: absolute;
  top: 0;
  left: 2px;
  right: 2px;
  height: 100%;
  background: rgba(11, 122, 117, 0.08);
  pointer-events: none;
}
.obs-handle {
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent);
  color: #fff;
  font-size: var(--fs-label);
  line-height: 1.2;
  padding: 1px 5px;
  border-radius: 2px;
  white-space: nowrap;
  pointer-events: none;
  font-weight: 700;
}
.obs-handle-bar {
  position: absolute;
  top: -2px;
  left: 50%;
  transform: translateX(-50%);
  width: 22px;
  height: 2px;
  background: var(--accent);
  pointer-events: none;
}

/* drag track (invisible overlay) */
.drag-track {
  position: absolute;
  left: 0;
  right: 0;
  top: 14px;
  height: 72px;
  z-index: 11;
  cursor: pointer;
  touch-action: none;
}

/* ── lower: readings ── */
.lower {
  flex: 0 0 280px;
  width: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding-top: 12px;
  position: relative;
}

.readings-row {
  display: flex;
  align-items: flex-start;
  gap: var(--space-5);
  width: 100%;
}

.readings-panel {
  flex: 0 0 520px;
  padding: var(--space-4) var(--space-5);
}
.reading-line {
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  margin-bottom: var(--space-3);
  color: var(--text);
}
.reading-line:last-child { margin-bottom: 0; }
.reading-line .num {
  font-weight: 700;
  color: var(--accent);
}
.reading-line .highlight {
  font-weight: 700;
  color: var(--warning);
}

/* scale legend */
.scale-legend {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: flex-start;
  padding-top: var(--space-3);
}
.scale-bar {
  width: 120px;
  height: 3px;
  background: var(--text);
  position: relative;
  margin-bottom: 4px;
}
.scale-bar::before,
.scale-bar::after {
  content: '';
  position: absolute;
  top: -4px;
  width: 2px;
  height: 11px;
  background: var(--text);
}
.scale-bar::before { left: 0; }
.scale-bar::after { right: 0; }
.scale-label {
  font-size: var(--fs-label);
  color: var(--muted);
  line-height: 1.3;
  text-align: right;
}

/* closing sentence */
.closing {
  position: absolute;
  bottom: 0;
  right: 0;
  text-align: right;
  font-size: var(--fs-sec);
  color: var(--muted);
  line-height: var(--lh-sec);
  max-width: 480px;
  padding: 0;
}
.closing strong {
  color: var(--text);
  font-weight: 700;
}
</style>
</head>
<body data-page="04" data-total="50">
<div id="stage">
<main id="main">

<!-- ── upper: ruler ── -->
<div class="upper">
  <div class="ruler-zone" id="rulerZone">
    <!-- month blocks -->
    <div class="month-grid" id="monthGrid"></div>

    <!-- 人 marker -->
    <div class="human-marker" id="humanMarker">
      <div class="human-dot"></div>
      <div class="human-label">人</div>
    </div>

    <!-- observation window -->
    <div class="obs-window" id="obsWindow">
      <div class="obs-bracket left"></div>
      <div class="obs-fill"></div>
      <div class="obs-bracket right"></div>
      <div class="obs-handle-bar"></div>
      <div class="obs-handle">1 mm</div>
    </div>

    <!-- drag track -->
    <div class="drag-track" id="dragTrack"></div>

    <!-- month labels -->
    <div class="month-labels" id="monthLabels"></div>

    <!-- ruler endpoints -->
    <div class="ruler-endpoints">
      <span>地球形成</span>
      <span>今天</span>
    </div>
  </div>
</div>

<!-- ── lower: readings ── -->
<div class="lower">
  <div class="readings-row">
    <div class="panel readings-panel" id="readingsPanel">
      <div class="reading-line" id="lineMonth">当前：<span id="monthDisplay">1月</span> · 约 <span class="num" id="yearsDisplay"></span> 年</div>
      <div class="reading-line">观察窗宽度：<span class="num">1 毫米</span> ≈ <span class="num" id="yearsPerMMDisplay"></span> 年</div>
      <div class="reading-line" id="lineHuman">这里没有人的刻度</div>
    </div>
    <div class="scale-legend">
      <div class="scale-bar"></div>
      <div class="scale-label">1 毫米（比例尺）</div>
    </div>
  </div>

  <div class="closing">
    深时不是「很久以前」——<br>
    而是人类所有刻度都挤在 <strong>最后一小段</strong>、<br>
    几乎看不见的位置。
  </div>
</div>

</main>
</div>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 4,
  kicker: "第一章 / 深时",
  title: "把地球史压进一年",
  take: "把 45.4 亿年压成一年，1 毫米仍然等于 1.4 万年。"
});

(function() {
  'use strict';

  var EARTH_AGE = Lec.K.EARTH_AGE_YEARS;
  var YEARS_PER_MM = 14000;
  var HOMO_SAPIENS = Lec.K.HOMO_SAPIENS_YEARS;
  var MONTH_COUNT = 12;
  var rulerWidth = 1408;
  var WINDOW_PX = 16;

  var monthGrid = document.getElementById('monthGrid');
  var monthLabels = document.getElementById('monthLabels');
  var humanMarker = document.getElementById('humanMarker');
  var obsWindow = document.getElementById('obsWindow');
  var dragTrack = document.getElementById('dragTrack');
  var monthDisplay = document.getElementById('monthDisplay');
  var yearsDisplay = document.getElementById('yearsDisplay');
  var yearsPerMMDisplay = document.getElementById('yearsPerMMDisplay');
  var lineHuman = document.getElementById('lineHuman');

  var yearsPerMonth = EARTH_AGE / MONTH_COUNT;
  var humanPct = Lec.P.earthTimelinePercent(HOMO_SAPIENS);
  var humanPosPx = (humanPct / 100) * rulerWidth;

  /* cap human marker position so it doesn't overflow the ruler */
  var halfMarker = 7;
  humanPosPx = Math.max(halfMarker, Math.min(rulerWidth - halfMarker, humanPosPx));

  for (var i = 0; i < MONTH_COUNT; i++) {
    var blk = document.createElement('div');
    blk.className = 'month-block';
    blk.dataset.index = i;
    blk.addEventListener('click', (function(idx) {
      return function() { setWindowPos(idx * (rulerWidth / MONTH_COUNT)); };
    })(i));
    monthGrid.appendChild(blk);
  }

  for (var i = 0; i < MONTH_COUNT; i++) {
    var lbl = document.createElement('div');
    lbl.className = 'month-label';
    lbl.textContent = (i + 1) + '月';
    monthLabels.appendChild(lbl);
  }

  humanMarker.style.left = humanPosPx + 'px';

  function fmtYears(val) {
    if (val >= 1e8) return (val / 1e8).toFixed(2) + ' 亿';
    if (val >= 1e4) return (val / 1e4).toFixed(1) + ' 万';
    return val.toFixed(0);
  }

  var windowPos = 0;

  function setWindowPos(x) {
    var maxX = rulerWidth - WINDOW_PX;
    x = Math.max(0, Math.min(maxX, x));
    windowPos = x;
    obsWindow.style.left = x + 'px';
    updateReadings();
    updateMonthHighlight();
  }

  function updateReadings() {
    var center = windowPos + WINDOW_PX / 2;
    var monthIdx = Math.floor(center / (rulerWidth / MONTH_COUNT));
    monthIdx = Math.max(0, Math.min(MONTH_COUNT - 1, monthIdx));
    var monthNum = monthIdx + 1;

    monthDisplay.textContent = monthNum + '月';
    yearsDisplay.textContent = fmtYears(yearsPerMonth);
    yearsPerMMDisplay.textContent = fmtYears(YEARS_PER_MM);

    var winStart = windowPos;
    var winEnd = windowPos + WINDOW_PX;
    var hasHuman = (humanPosPx >= winStart && humanPosPx <= winEnd);
    if (hasHuman) {
      lineHuman.innerHTML = '这里 <span class="highlight">有人</span>';
    } else {
      lineHuman.textContent = '这里没有人的刻度';
    }
  }

  function updateMonthHighlight() {
    var blocks = monthGrid.children;
    var center = windowPos + WINDOW_PX / 2;
    var monthIdx = Math.floor(center / (rulerWidth / MONTH_COUNT));
    monthIdx = Math.max(0, Math.min(MONTH_COUNT - 1, monthIdx));
    for (var i = 0; i < MONTH_COUNT; i++) {
      blocks[i].classList.toggle('active', i === monthIdx);
    }
  }

  var isDragging = false;
  var dragStartX = 0;
  var dragStartPos = 0;

  dragTrack.addEventListener('pointerdown', function(e) {
    isDragging = true;
    dragStartX = e.clientX;
    dragStartPos = windowPos;
    dragTrack.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  document.addEventListener('pointermove', function(e) {
    if (!isDragging) return;
    var dx = e.clientX - dragStartX;
    var s = Deck.s || 1;
    setWindowPos(dragStartPos + dx / s);
  });

  document.addEventListener('pointerup', function() {
    isDragging = false;
  });

  document.addEventListener('pointercancel', function() {
    isDragging = false;
  });

  dragTrack.addEventListener('click', function(e) {
    if (isDragging) return;
    var rect = dragTrack.getBoundingClientRect();
    var s = Deck.s || 1;
    setWindowPos((e.clientX - rect.left) / s - WINDOW_PX / 2);
  });

  setWindowPos(0);

})();
</script>
</body>
</html>
