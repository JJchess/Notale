<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== page-06 custom styles ===== */
/* All token values from theme.css; no magic px */

#main {
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
  position: relative;
}

/* ── reading text line ── */
.reading-line {
  flex: 0 0 auto;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 var(--space-5);
  font-size: var(--fs-lead);
  line-height: var(--lh-lead);
  font-weight: 700;
  text-align: center;
  color: var(--text);
  transition: color .2s ease;
}
.reading-line .highlight {
  color: var(--accent);
}
.reading-line .dino-highlight {
  color: #c97a3a;
}

/* ── three-column body ── */
.body-row {
  flex: 1;
  display: flex;
  flex-direction: row;
  min-height: 0;
  padding: var(--space-1) var(--space-4) 0 var(--space-4);
  gap: var(--space-4);
}

/* ── left column: silhouette ── */
.col-left {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 0;
}
.col-left .dino-img {
  width: 100%;
  max-width: 220px;
  height: auto;
  object-fit: contain;
  opacity: .85;
  display: block;
}
.col-left .dino-caption {
  margin-top: var(--space-3);
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
  color: var(--muted);
  text-align: center;
}

/* ── center column: comparison bar ── */
.col-center {
  flex: 2;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  min-height: 0;
  gap: var(--space-3);
}
.comparison-bar-wrap {
  display: flex;
  flex-direction: column;
  width: 100%;
  gap: 0;
}
.comparison-bar {
  position: relative;
  width: 100%;
  height: 48px;
  border-radius: var(--radius-sm);
  background: var(--line);
}
.comparison-bar .dino-seg {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  background: linear-gradient(135deg, #c97a3a, #d99b56);
  border-radius: var(--radius-sm) 0 0 var(--radius-sm);
  transition: width .4s ease;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: var(--space-3);
  min-width: 2px;
}
.comparison-bar .human-seg {
  position: absolute;
  right: 0;
  top: 0;
  height: 100%;
  width: 2px;
  background: var(--accent);
}
.comparison-bar .dino-seg .seg-label {
  font-size: var(--fs-label);
  font-weight: 700;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,.4);
  white-space: nowrap;
}
.comparison-bar .human-label {
  font-size: var(--fs-label);
  line-height: var(--lh-label);
  color: var(--accent);
  font-weight: 700;
  white-space: nowrap;
  text-align: right;
  margin-top: 2px;
}
.time-axis {
  position: relative;
  width: 100%;
  height: 24px;
  margin-top: 8px;
}
.time-axis .axis-line {
  position: absolute;
  left: 0;
  right: 0;
  top: 10px;
  height: 1px;
  background: var(--muted);
}
.time-axis .tick-old {
  position: absolute;
  left: 0;
  top: 0;
  font-size: var(--fs-tick);
  color: var(--muted);
}
.time-axis .tick-new {
  position: absolute;
  right: 0;
  top: 0;
  font-size: var(--fs-tick);
  color: var(--muted);
}

/* ── right column: period labels ── */
.col-right {
  flex: 1.2;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
.period-scroll {
  flex: 1;
  overflow: hidden;
}
.period-list {
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
  padding: var(--space-2) 3px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.period-list .period-item {
  display: flex;
  flex-direction: row;
  align-items: center;
  padding: var(--space-1) var(--space-1) var(--space-1) calc(var(--space-1) + var(--space-2));
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
  gap: var(--space-1);
  min-height: 28px;
  border-left: 3px solid transparent;
  overflow: hidden;
  width: 100%;
  box-sizing: border-box;
  }
.period-list .period-item:hover {
  background: color-mix(in srgb, var(--accent-soft) 50%, transparent);
}
.period-list .period-item.active {
  background: var(--accent-soft);
  border-left-color: var(--accent);
  box-shadow: var(--shadow-sm);
  transform: scale(1.02);
}
.period-list .period-item.dinosaur-active {
  background: #f5e6d0;
  border-left-color: #c97a3a;
  box-shadow: var(--shadow-sm);
  transform: scale(1.02);
}
.period-list .period-item .p-color-dot {
  flex: 0 0 8px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.period-list .period-item .p-name {
  flex: 0 1 auto;
  font-size: var(--fs-sec);
  font-weight: 600;
  line-height: 1.35;
  color: var(--text);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.period-list .period-item .p-time {
  flex: 0 0 auto;
  font-size: var(--fs-tick);
  line-height: 1.35;
  color: var(--muted);
  white-space: nowrap;
}
.period-list .period-item.dinosaur {
  border-left-color: #c97a3a;
}
.period-list .period-item.dinosaur .p-name {
  color: #c97a3a;
}

/* ── detail panel (shown when a period is clicked) ── */
.detail-panel {
  flex: 0 0 0;
  overflow: hidden;
  background: var(--surface);
  border-top: 1px solid var(--line);
  transition: flex .25s ease, padding .25s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-4);
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
  color: var(--text);
}
.detail-panel.open {
  flex: 0 0 40px;
  padding: 0 var(--space-4);
}
.detail-panel .dp-label {
  font-weight: 700;
  color: var(--accent);
}
</style>
</head>
<body data-page="06" data-total="50">
<div id="stage">
<main id="main">
  <!-- Reading text line -->
  <div class="reading-line" id="readingLine">
    <span id="readingText">恐龙统治地球约<span class="dino-highlight">1.6亿年</span>，是智人存在时间的约<span class="dino-highlight">500倍</span></span>
  </div>

  <!-- Three-column body -->
  <div class="body-row">
    <!-- Left column: dinosaur silhouette -->
    <div class="col-left">
      <img class="dino-img" src="assets/img/p06-dino-silhouette.png" alt="恐龙统治地球约1.6亿年" title="恐龙统治地球约1.6亿年，是智人存在时间的约500倍">
      <div class="dino-caption">恐龙统治约1.6亿年</div>
    </div>

    <!-- Center column: comparison bar -->
    <div class="col-center">
      <div class="comparison-bar-wrap">
        <div class="comparison-bar" id="comparisonBar">
          <div class="dino-seg" id="dinoSeg">
            <span class="seg-label">恐龙统治 1.6亿年</span>
          </div>
          <div class="human-seg" id="humanSeg"></div>
          <div class="human-label">智人 30万年</div>
        </div>
        <div class="time-axis">
          <div class="axis-line"></div>
          <span class="tick-old">541百万年前</span>
          <span class="tick-new">0</span>
        </div>
      </div>
    </div>

    <!-- Right column: period labels -->
    <div class="col-right">
      <div class="period-scroll" id="periodScroll">
        <div class="period-list" id="periodList"></div>
      </div>
    </div>
  </div>

  <!-- Detail panel (integrated in flex flow) -->
  <div class="detail-panel" id="detailPanel"></div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
/* ===== page-06 script ===== */
Lec.mount({
  index: 6,
  kicker: "第一章 深时",
  title: "纪的标签盘",
  take: "恐龙统治1.6亿年，是智人存在时间的约500倍"
});

(function() {
  'use strict';

  // ── data ──
  // Geological periods data (from PLAN.md p06, not available in Lec.K)
  // start/end in million years ago
  var PERIODS = [
    { name: '寒武纪', start: 541, end: 485, isDinosaur: false },
    { name: '奥陶纪', start: 485, end: 443, isDinosaur: false },
    { name: '志留纪', start: 443, end: 419, isDinosaur: false },
    { name: '泥盆纪', start: 419, end: 359, isDinosaur: false },
    { name: '石炭纪', start: 359, end: 299, isDinosaur: false },
    { name: '二叠纪', start: 299, end: 252, isDinosaur: false },
    { name: '三叠纪', start: 252, end: 201, isDinosaur: true },
    { name: '侏罗纪', start: 201, end: 145, isDinosaur: true },
    { name: '白垩纪', start: 145, end: 66, isDinosaur: true },
    { name: '古近纪', start: 66, end: 23, isDinosaur: false },
    { name: '新近纪', start: 23, end: 2.6, isDinosaur: false },
    { name: '第四纪', start: 2.6, end: 0, isDinosaur: false }
  ];

  // Key constants
  var PHANEROZOIC_MYR = 541;  // 541 million years
  var PHANEROZOIC_YEARS = 541e6;
  var DINO_RULE_YEARS = 160e6;  // 1.6亿年
  var HOMO_SAPIENS_YEARS = Lec.K.HOMO_SAPIENS_YEARS;  // 300,000 years
  var HOMO_SAPIENS_MYR = HOMO_SAPIENS_YEARS / 1e6;  // 0.3 million years

  // Compute ratio
  var dinoRatio = DINO_RULE_YEARS / PHANEROZOIC_YEARS;
  var humanRatio = HOMO_SAPIENS_YEARS / PHANEROZOIC_YEARS;
  var dinoToHumanRatio = DINO_RULE_YEARS / HOMO_SAPIENS_YEARS;
  var dinoToHumanRounded = Math.round(dinoToHumanRatio);

  // Dinosaur period indices (for highlighting)
  var DINO_NAMES = ['三叠纪', '侏罗纪', '白垩纪'];

  // ── DOM refs ──
  var readingText = document.getElementById('readingText');
  var periodList = document.getElementById('periodList');
  var detailPanel = document.getElementById('detailPanel');
  var dinoSeg = document.getElementById('dinoSeg');

  // ── build period list ──
  // Display order: newest first (top) to oldest (bottom)
  var reversed = PERIODS.slice().reverse();

  reversed.forEach(function(p, idx) {
    var el = document.createElement('div');
    el.className = 'period-item' + (p.isDinosaur ? ' dinosaur' : '');
    el.dataset.name = p.name;
    el.dataset.start = p.start;
    el.dataset.end = p.end;
    el.dataset.duration = (p.start - p.end).toFixed(1);
    el.dataset.isDinosaur = p.isDinosaur ? 'true' : 'false';
    el.dataset.index = idx;
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.setAttribute('aria-label', p.name + ' ' + p.start + '百万年前至' + p.end + '百万年前');

    var dot = document.createElement('span');
    dot.className = 'p-color-dot';
    dot.style.background = p.isDinosaur ? '#c97a3a' : 'var(--line)';
    el.appendChild(dot);

    var nameSpan = document.createElement('span');
    nameSpan.className = 'p-name';
    nameSpan.textContent = p.name;
    el.appendChild(nameSpan);

    var timeSpan = document.createElement('span');
    timeSpan.className = 'p-time';
    timeSpan.textContent = p.start + '–' + p.end + '百万年前';
    el.appendChild(timeSpan);

    // duration shown in detail panel on click, not in label

    // Click handler
    el.addEventListener('click', function() { onPeriodClick(p); });
    el.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        onPeriodClick(p);
      }
    });

    periodList.appendChild(el);
  });

  // ── set comparison bar widths ──
  function setBarWidths() {
    var bar = document.querySelector('.comparison-bar');
    if (!bar) return;
    var barW = bar.offsetWidth;
    if (barW === 0) {
      // retry on next frame
      requestAnimationFrame(setBarWidths);
      return;
    }
    var dinoW = Math.max(dinoRatio * 100, 25);  // at least 25%
    var humanW = Math.max(humanRatio * 100, 0.2);  // at least 0.2%
    dinoSeg.style.width = dinoW + '%';
  }
  // Initial set after layout
  setTimeout(setBarWidths, 50);

  // ── interaction: period click ──
  var currentPeriod = null;

  function onPeriodClick(p) {
    var isDino = p.isDinosaur;
    var items = periodList.querySelectorAll('.period-item');

    // Update active state
    items.forEach(function(item) {
      item.classList.remove('active', 'dinosaur-active');
      if (item.dataset.name === p.name) {
        if (isDino) {
          item.classList.add('dinosaur-active');
        } else {
          item.classList.add('active');
        }
      }
    });

    // Update reading text
    if (isDino) {
      // Show the fixed comparison text
      readingText.innerHTML = '恐龙统治地球约<span class="dino-highlight">1.6亿年</span>，是智人存在时间的约<span class="dino-highlight">' + dinoToHumanRounded + '倍</span>';
    } else {
      var dur = (p.start - p.end).toFixed(1);
      readingText.innerHTML = '<span class="highlight">' + p.name + '</span> 持续约 ' + dur + ' 百万年（' + p.start + '–' + p.end + '百万年前）';
    }

    // Show detail panel
    if (isDino) {
      detailPanel.innerHTML = '<span class="dp-label">恐龙统治</span> 约1.6亿年（三叠纪至白垩纪末）';
    } else {
      detailPanel.innerHTML = '<span class="dp-label">' + p.name + '</span> ' + p.start + '–' + p.end + '百万年前，持续约' + (p.start - p.end).toFixed(1) + '百万年';
    }
    detailPanel.classList.add('open');
  }

  // ── initial state: highlight dinosaur rule ──
  // Select the first dinosaur period (三叠纪)
  var firstDino = PERIODS[6];  // 三叠纪
  onPeriodClick(firstDino);

  // ── also handle resize ──
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(function() {
      setBarWidths();
    });
    ro.observe(document.querySelector('.comparison-bar'));
  }

})();
</script>
</body>
</html>
