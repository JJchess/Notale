<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#main {
  display: flex;
  flex-direction: column;
  padding: 0;
}
#scene-wrap {
  flex: 1;
  position: relative;
  min-height: 0;
  margin: 0;
}
#timeline-bar {
  flex: 0 0 28px;
  padding: 0 var(--space-5);
  margin: 0;
}
#track {
  position: relative;
  height: 6px;
  background: var(--line);
  border-radius: 3px;
  cursor: pointer;
  touch-action: none;
  min-height: 6px;
}
#track-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  width: 0%;
  pointer-events: none;
}
#track-thumb {
  position: absolute;
  top: 50%;
  width: 14px;
  height: 14px;
  margin-left: -7px;
  margin-top: -7px;
  background: var(--accent);
  border: 2px solid var(--surface);
  border-radius: 50%;
  pointer-events: none;
  left: 0%;
  box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
#bottom-area {
  flex: 0 0 130px;
  padding: 0 var(--space-4) var(--space-3) var(--space-4);
  align-items: stretch;
}
#storyboard {
  gap: 0;
  align-items: stretch;
}
#storyboard .step {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-2) var(--space-2);
  margin: var(--space-1) 0;
  cursor: pointer;
  font-size: var(--fs-label);
  line-height: 1.3;
  text-align: center;
  min-height: 60px;
  user-select: none;
}
#storyboard .step::before {
  content: attr(data-idx);
  counter-increment: none;
  font-size: var(--fs-tick);
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 2px;
}
#storyboard .step .name {
  font-size: var(--fs-label);
  color: var(--text);
}
#storyboard .step.passed {
  opacity: .45;
  filter: saturate(.5);
}
#storyboard .step.current {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: var(--shadow-md);
}
#storyboard .step.current .name {
  color: var(--accent);
  font-weight: 700;
}
#storyboard .step.current::before {
  color: var(--accent);
}
#storyboard .arw {
  flex: 0 0 32px;
  font-size: var(--fs-lead);
  color: var(--accent);
  opacity: .6;
}
#play-btn {
  margin-left: var(--space-2);
  padding: var(--space-2) var(--space-4);
  font-size: var(--fs-label);
  white-space: nowrap;
}
</style>
</head>
<body data-page="07" data-total="50">
<div id="stage">
<main id="main">

  <!-- Canvas scene area -->
  <div id="scene-wrap" class="min0">
    <canvas id="scene-cv" class="cv-fill no-pan"></canvas>
  </div>

  <!-- Timeline scrubber -->
  <div id="timeline-bar" class="row items-center">
    <div id="track" class="grow" role="slider" tabindex="0"
         aria-label="时间轴" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="track-fill"></div>
      <div id="track-thumb"></div>
    </div>
    <span id="time-label" class="text-muted" style="font-size:var(--fs-tick);width:44px;text-align:right;flex:none;margin-left:var(--space-2);">0s</span>
  </div>

  <!-- Storyboard cards + controls -->
  <div id="bottom-area" class="row items-end">
    <div class="k-process grow" id="storyboard">
      <div class="step" data-idx="1" aria-label="分镜1: 不速之客">
        <span class="name">不速之客</span>
      </div>
      <div class="arw"></div>
      <div class="step" data-idx="2" aria-label="分镜2: 撞击">
        <span class="name">撞击</span>
      </div>
      <div class="arw"></div>
      <div class="step" data-idx="3" aria-label="分镜3: 冲击圈">
        <span class="name">冲击圈</span>
      </div>
      <div class="arw"></div>
      <div class="step" data-idx="4" aria-label="分镜4: 长夜降临">
        <span class="name">长夜降临</span>
      </div>
      <div class="arw"></div>
      <div class="step" data-idx="5" aria-label="分镜5: 链条崩断">
        <span class="name">链条崩断</span>
      </div>
      <div class="arw"></div>
      <div class="step" data-idx="6" aria-label="分镜6: 舞台空出">
        <span class="name">舞台空出</span>
      </div>
    </div>
    <div class="ctl no-shrink" style="padding-left:var(--space-2);align-self:center;">
      <button id="play-btn" class="primary" aria-label="播放">▶ 播放</button>
    </div>
  </div>

</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
(function(){
  'use strict';

  /* ================================================================
     Mount
     ================================================================ */
  Lec.mount({ index: 7, kicker: '第一章 · 深时', title: '一次撞击，清空舞台', take: '' });

  /* ================================================================
     Canvas setup
     ================================================================ */
  var cv = document.getElementById('scene-cv');
  var ctx = Deck.fit(cv);
  var W = cv.width, H = cv.height;

  /* ================================================================
     Scene state & GSAP timeline
     ================================================================ */
  var S = { progress: 0 };

  // 6 scenes, 3s each, 0.5s overlap — total ~15s
  var SCENES = [
    { start: 0.0,  end: 3.0,  name: '不速之客' },
    { start: 2.5,  end: 5.5,  name: '撞击' },
    { start: 5.0,  end: 8.0,  name: '冲击圈' },
    { start: 7.5,  end: 10.5, name: '长夜降临' },
    { start: 10.0, end: 13.0, name: '链条崩断' },
    { start: 12.5, end: 15.0, name: '舞台空出' }
  ];
  var TOTAL = 15; // seconds

  var tl = gsap.timeline({ paused: true, onUpdate: onTimelineUpdate });
  tl.to(S, { progress: 1, duration: TOTAL, ease: 'none' });

  /* ================================================================
     Helpers
     ================================================================ */
  function lerp(a, b, t) { return a + (b - a) * t; }

  function sceneP(p, idx) {
    var s = SCENES[idx];
    var t = p * TOTAL;
    if (t <= s.start) return 0;
    if (t >= s.end) return 1;
    return (t - s.start) / (s.end - s.start);
  }

  /* ================================================================
     Drawing
     ================================================================ */
  function drawScene() {
    var p = S.progress;
    var w = W, h = H;
    ctx.clearRect(0, 0, w, h);

    var sp = [];
    for (var i = 0; i < 6; i++) sp.push(sceneP(p, i));

    // sky darkness from scene 4 onward
    var dark = 0;
    if (sp[3] > 0) dark = Math.min(1, sp[3] * 1.3);
    if (sp[4] > 0) dark = Math.min(1, lerp(dark, 1, sp[4]));

    drawSky(ctx, w, h, dark);
    drawGround(ctx, w, h, dark);

    if (sp[3] > 0)  drawDustCloud(ctx, w, h, sp[3]);
    if (sp[2] > 0)  drawFireSpots(ctx, w, h, sp[2]);
    if (sp[1] > 0)  drawShockwave(ctx, w, h, sp[1]);

    // dinosaurs fade in scenes 5 & 6
    var dA = 1;
    if (sp[4] > 0) dA = 1 - sp[4] * 0.3;
    if (sp[5] > 0) dA = Math.max(0, dA - sp[5] * 0.7);
    drawDinosaurs(ctx, w, h, dA);

    if (sp[0] > 0)  drawAsteroid(ctx, w, h, sp[0]);
    if (sp[1] > 0)  drawFlash(ctx, w, h, sp[1]);

    var ashI = 0;
    if (sp[2] > 0) ashI = sp[2] * 0.4;
    if (sp[3] > 0) ashI = lerp(ashI, 0.7, sp[3]);
    if (ashI > 0)  drawAsh(ctx, w, h, ashI, sp[3]);

    if (sp[4] > 0)  drawFoodChain(ctx, w, h, sp[4]);
    if (sp[5] > 0)  drawMammal(ctx, w, h, sp[5]);

    if (sp[5] > 0.5) {
      var ta = (sp[5] - 0.5) / 0.5;
      drawSubtitle(ctx, w, h, ta);
    }
  }

  /* ---- sky ---- */
  function drawSky(ctx, w, h, d) {
    var hy = h * 0.62;
    var g = ctx.createLinearGradient(0, 0, 0, hy);
    if (d < 0.3) {
      var t = d / 0.3;
      g.addColorStop(0, 'rgb(' + lerp(180,40,t) + ',' + lerp(200,50,t) + ',' + lerp(230,70,t) + ')');
      g.addColorStop(0.5,'rgb(' + lerp(230,100,t) + ',' + lerp(190,90,t) + ',' + lerp(150,80,t) + ')');
      g.addColorStop(1, 'rgb(' + lerp(250,140,t) + ',' + lerp(220,110,t) + ',' + lerp(180,90,t) + ')');
    } else {
      var t = (d - 0.3) / 0.7;
      g.addColorStop(0, 'rgb(' + lerp(40,10,t) + ',' + lerp(50,15,t) + ',' + lerp(70,25,t) + ')');
      g.addColorStop(0.5,'rgb(' + lerp(100,30,t) + ',' + lerp(90,30,t) + ',' + lerp(80,35,t) + ')');
      g.addColorStop(1, 'rgb(' + lerp(140,50,t) + ',' + lerp(110,40,t) + ',' + lerp(90,40,t) + ')');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, hy);

    // sun
    if (d < 0.6) {
      var sa = 1 - d / 0.6;
      var sx = w * 0.75, sy = hy * 0.35;
      var sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 60);
      sg.addColorStop(0, 'rgba(255,230,180,' + (sa * 0.8) + ')');
      sg.addColorStop(0.5,'rgba(255,200,140,' + (sa * 0.3) + ')');
      sg.addColorStop(1, 'rgba(255,200,140,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(sx - 60, sy - 60, 120, 120);
    }
  }

  /* ---- ground ---- */
  function drawGround(ctx, w, h, d) {
    var hy = h * 0.62;
    var gh = h - hy;
    var t = Math.min(1, d * 1.5);
    ctx.fillStyle = 'rgb(' + lerp(80,40,t) + ',' + lerp(60,35,t) + ',' + lerp(40,30,t) + ')';
    ctx.fillRect(0, hy, w, gh);

    if (!drawGround._tx) {
      drawGround._tx = [];
      for (var i = 0; i < 50; i++)
        drawGround._tx.push({ x: Math.random() * w, y: hy + Math.random() * gh, r: 2 + Math.random() * 5 });
    }
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    for (var i = 0; i < drawGround._tx.length; i++) {
      var p = drawGround._tx[i];
      ctx.beginPath();
      ctx.arc(p.x - d * 5, p.y, p.r * (1 - d * 0.4), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ---- asteroid ---- */
  function drawAsteroid(ctx, w, h, p) {
    var sx = w * 0.85, sy = h * 0.05;
    var ex = w * 0.5, ey = h * 0.55;
    var x = lerp(sx, ex, p), y = lerp(sy, ey, p);
    var ang = Math.atan2(ey - sy, ex - sx);
    var tl = 80 + p * 60;

    // trail
    ctx.strokeStyle = 'rgba(255,200,100,0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - Math.cos(ang) * tl, y - Math.sin(ang) * tl);
    ctx.stroke();

    // glow
    var gg = ctx.createRadialGradient(x - tl * 0.3, y - tl * 0.3, 0, x, y, tl * 0.5);
    gg.addColorStop(0, 'rgba(255,180,80,0.15)');
    gg.addColorStop(1, 'rgba(255,180,80,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(x - tl * 0.3, y - tl * 0.3, tl * 0.5, 0, Math.PI * 2);
    ctx.fill();

    // body
    var sz = 8 + p * 4;
    var bg = ctx.createRadialGradient(x - sz * 0.3, y - sz * 0.3, 0, x, y, sz);
    bg.addColorStop(0, '#fff8e0');
    bg.addColorStop(0.5, '#e8a040');
    bg.addColorStop(1, '#8a5020');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(x, y, sz, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ---- flash ---- */
  function drawFlash(ctx, w, h, p) {
    var r = w * 0.3 * p;
    var a = Math.sin(p * Math.PI) * 0.9;
    var g = ctx.createRadialGradient(w * 0.5, h * 0.55, 0, w * 0.5, h * 0.55, r);
    g.addColorStop(0, 'rgba(255,255,255,' + a + ')');
    g.addColorStop(0.3, 'rgba(255,220,150,' + (a * 0.6) + ')');
    g.addColorStop(0.7, 'rgba(255,180,80,' + (a * 0.3) + ')');
    g.addColorStop(1, 'rgba(255,180,80,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(w * 0.5, h * 0.55, r, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ---- shockwave ---- */
  function drawShockwave(ctx, w, h, p) {
    for (var i = 0; i < 3; i++) {
      var off = i * 0.15;
      var pp = Math.max(0, Math.min(1, (p - off) / (1 - off)));
      var r = 20 + pp * w * 0.45;
      var a = (1 - pp) * 0.5;
      ctx.strokeStyle = 'rgba(255,200,100,' + a + ')';
      ctx.lineWidth = 3 - pp * 2;
      ctx.beginPath();
      ctx.arc(w * 0.5, h * 0.55, r, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  /* ---- fire ---- */
  function drawFireSpots(ctx, w, h, p) {
    if (p < 0.1) return;
    if (!drawFireSpots._ps) {
      drawFireSpots._ps = [];
      for (var i = 0; i < 20; i++)
        drawFireSpots._ps.push({ x: w * 0.2 + Math.random() * w * 0.6, y: h * 0.55 + Math.random() * h * 0.15, r: 2 + Math.random() * 5, ph: Math.random() * Math.PI * 2 });
    }
    var inten = Math.min(1, (p - 0.1) / 0.3);
    for (var i = 0; i < drawFireSpots._ps.length; i++) {
      var f = drawFireSpots._ps[i];
      var fl = 0.7 + 0.3 * Math.sin(f.ph + p * 20);
      var a = inten * fl * 0.8;
      var r = f.r * inten;
      var g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r * 3);
      g.addColorStop(0, 'rgba(255,200,50,' + a + ')');
      g.addColorStop(0.5, 'rgba(255,100,20,' + (a * 0.5) + ')');
      g.addColorStop(1, 'rgba(200,50,10,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(f.x, f.y, r * 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ---- dust cloud ---- */
  function drawDustCloud(ctx, w, h, p) {
    var a = p * 0.5;
    var g = ctx.createRadialGradient(w * 0.5, h * 0.55, 0, w * 0.5, h * 0.55, w * 0.7);
    g.addColorStop(0, 'rgba(80,70,60,0)');
    g.addColorStop(0.5, 'rgba(80,70,60,' + (a * 0.3) + ')');
    g.addColorStop(1, 'rgba(60,55,50,' + (a * 0.6) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h * 0.62);
  }

  /* ---- ash particles ---- */
  function drawAsh(ctx, w, h, inten, dp) {
    if (!drawAsh._ps) {
      drawAsh._ps = [];
      for (var i = 0; i < 70; i++)
        drawAsh._ps.push({ x: w * 0.15 + Math.random() * w * 0.7, y: Math.random() * h * 0.5, r: 1 + Math.random() * 3, sp: 0.3 + Math.random() * 0.8, dr: (Math.random() - 0.5) * 0.3, ph: Math.random() * Math.PI * 2 });
    }
    var t = (dp || 0) * 5;
    for (var i = 0; i < drawAsh._ps.length; i++) {
      var a = drawAsh._ps[i];
      var y = (a.y + t * a.sp * 20) % (h * 0.6);
      var x = a.x + Math.sin(t * 0.5 + a.ph) * a.dr * 50;
      var al = inten * (0.3 + 0.7 * (1 - y / (h * 0.6)));
      ctx.fillStyle = 'rgba(60,55,50,' + al + ')';
      ctx.beginPath();
      ctx.arc(x, y, a.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ---- dinosaurs ---- */
  function drawDinosaurs(ctx, w, h, alpha) {
    if (alpha <= 0.01) return;
    if (!drawDinosaurs._sil) {
      drawDinosaurs._sil = [];
      var pos = [
        { x: w * 0.2,  y: h * 0.55, sc: 0.8 },
        { x: w * 0.35, y: h * 0.55, sc: 1.0 },
        { x: w * 0.65, y: h * 0.55, sc: 0.7 },
        { x: w * 0.8,  y: h * 0.55, sc: 0.9 }
      ];
      for (var i = 0; i < pos.length; i++) {
        var p = pos[i], s = p.sc * 30, by = p.y;
        var path = [];
        // body
        path.push({ x: p.x - s * 0.5, y: by - s * 0.3 });
        path.push({ x: p.x + s * 0.5, y: by - s * 0.3 });
        // neck up
        path.push({ x: p.x + s * 0.4, y: by - s * 0.8 });
        // head
        path.push({ x: p.x + s * 0.6, y: by - s * 0.9 });
        path.push({ x: p.x + s * 0.7, y: by - s * 0.85 });
        // neck down
        path.push({ x: p.x + s * 0.3, y: by - s * 0.5 });
        // tail
        path.push({ x: p.x - s * 0.8, y: by - s * 0.2 });
        path.push({ x: p.x - s * 0.6, y: by - s * 0.1 });
        // legs
        path.push({ x: p.x - s * 0.2, y: by });
        path.push({ x: p.x - s * 0.1, y: by });
        path.push({ x: p.x + s * 0.1, y: by });
        path.push({ x: p.x + s * 0.2, y: by });
        path.push({ x: p.x - s * 0.5, y: by - s * 0.3 });
        drawDinosaurs._sil.push(path);
      }
    }
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(20,18,15,0.9)';
    for (var i = 0; i < drawDinosaurs._sil.length; i++) {
      var path = drawDinosaurs._sil[i];
      ctx.beginPath();
      ctx.moveTo(path[0].x, path[0].y);
      for (var j = 1; j < path.length; j++) ctx.lineTo(path[j].x, path[j].y);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---- food chain ---- */
  function drawFoodChain(ctx, w, h, p) {
    var cx = w * 0.5, cy = h * 0.45;
    var gap = 55;
    var items = [
      { label: '植物', x: cx - gap, y: cy },
      { label: '植食恐龙', x: cx, y: cy },
      { label: '肉食恐龙', x: cx + gap, y: cy }
    ];
    for (var i = 0; i < items.length; i++) {
      var fs = i * 0.25, fe = fs + 0.3;
      var ia = 1;
      if (p > fs) ia = Math.max(0, 1 - (p - fs) / (fe - fs));
      var it = items[i];
      ctx.globalAlpha = ia;

      var r = 22;
      ctx.fillStyle = 'rgba(60,50,40,0.7)';
      ctx.beginPath();
      ctx.arc(it.x, it.y, r, 0, Math.PI * 2);
      ctx.fill();

      // icon
      if (i === 0) {
        ctx.fillStyle = 'rgba(100,160,80,0.9)';
        ctx.beginPath();
        ctx.ellipse(it.x, it.y - 4, 8, 14, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (i === 1) {
        ctx.fillStyle = 'rgba(200,180,150,0.9)';
        ctx.fillRect(it.x - 9, it.y - 7, 18, 10);
        ctx.beginPath();
        ctx.arc(it.x + 9, it.y - 2, 5, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(200,180,150,0.9)';
        ctx.beginPath();
        ctx.moveTo(it.x - 9, it.y + 4);
        ctx.lineTo(it.x + 9, it.y);
        ctx.lineTo(it.x - 9, it.y - 4);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = '13px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(it.label, it.x, it.y + r + 4);
      ctx.globalAlpha = 1;

      if (i < items.length - 1 && ia > 0.1) {
        ctx.strokeStyle = 'rgba(200,180,150,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        var ax1 = it.x + r + 4, ax2 = items[i + 1].x - r - 4;
        ctx.moveTo(ax1, it.y);
        ctx.lineTo(ax2, it.y);
        ctx.moveTo(ax2, it.y);
        ctx.lineTo(ax2 - 6, it.y - 4);
        ctx.moveTo(ax2, it.y);
        ctx.lineTo(ax2 - 6, it.y + 4);
        ctx.stroke();
      }
    }
  }

  /* ---- mammal ---- */
  function drawMammal(ctx, w, h, p) {
    var mx = w * 0.25, my = h * 0.56;
    var a = Math.min(1, p * 2);
    ctx.globalAlpha = a;

    ctx.fillStyle = 'rgba(30,25,20,0.9)';
    // body
    ctx.beginPath();
    ctx.ellipse(mx, my, 12, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    // head
    ctx.beginPath();
    ctx.arc(mx + 12, my - 2, 6, 0, Math.PI * 2);
    ctx.fill();
    // ears
    ctx.beginPath();
    ctx.arc(mx + 10, my - 8, 3, 0, Math.PI * 2);
    ctx.arc(mx + 14, my - 8, 3, 0, Math.PI * 2);
    ctx.fill();
    // tail
    ctx.beginPath();
    ctx.moveTo(mx - 12, my);
    ctx.quadraticCurveTo(mx - 20, my - 10, mx - 18, my - 5);
    ctx.strokeStyle = 'rgba(30,25,20,0.9)';
    ctx.lineWidth = 2;
    ctx.stroke();
    // eye
    ctx.fillStyle = 'rgba(200,180,150,0.9)';
    ctx.beginPath();
    ctx.arc(mx + 13, my - 3, 1.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;
  }

  /* ---- subtitle ---- */
  function drawSubtitle(ctx, w, h, a) {
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('哺乳动物的时代由此开始。', w * 0.5, h * 0.92);
    ctx.globalAlpha = 1;
  }

  /* ================================================================
     Timeline callback
     ================================================================ */
  function onTimelineUpdate() {
    drawScene();
    updateCards();
    updateTimelineUI();
    updateTimeLabel();
  }

  function updateCards() {
    var p = S.progress;
    var cards = document.querySelectorAll('#storyboard .step');
    for (var i = 0; i < cards.length; i++) {
      var sp = sceneP(p, i);
      cards[i].classList.remove('current', 'passed');
      if (sp >= 1) {
        cards[i].classList.add('passed');
      } else if (sp > 0) {
        cards[i].classList.add('current');
      }
    }
    if (p < 0.001) cards[0].classList.add('current');
  }

  function updateTimelineUI() {
    var pct = (S.progress * 100).toFixed(0);
    document.getElementById('track-fill').style.width = pct + '%';
    document.getElementById('track-thumb').style.left = pct + '%';
    document.getElementById('track').setAttribute('aria-valuenow', pct);
  }

  function updateTimeLabel() {
    var t = S.progress * TOTAL;
    document.getElementById('time-label').textContent = Math.round(t) + 's';
  }

  /* ================================================================
     Controls
     ================================================================ */
  var isPlaying = false;
  var playBtn = document.getElementById('play-btn');

  playBtn.addEventListener('click', function() {
    if (isPlaying) {
      tl.pause();
      isPlaying = false;
      playBtn.textContent = '▶ 播放';
      playBtn.setAttribute('aria-label', '播放');
    } else {
      if (S.progress >= 1) { tl.progress(0); onTimelineUpdate(); }
      tl.play();
      isPlaying = true;
      playBtn.textContent = '⏸ 暂停';
      playBtn.setAttribute('aria-label', '暂停');
    }
  });

  // Cards: click to jump
  var cards = document.querySelectorAll('#storyboard .step');
  for (var i = 0; i < cards.length; i++) {
    cards[i].addEventListener('click', function(e) {
      var idx = parseInt(this.getAttribute('data-idx')) - 1;
      jumpToScene(idx);
    });
  }

  function jumpToScene(idx) {
    if (idx < 0) return;
    var st = SCENES[idx] ? SCENES[idx].start : 0;
    var p = st / TOTAL;
    if (isPlaying) { tl.pause(); isPlaying = false; playBtn.textContent = '▶ 播放'; playBtn.setAttribute('aria-label', '播放'); }
    tl.progress(p);
    onTimelineUpdate();
  }

  // Timeline drag
  var track = document.getElementById('track');
  var isDragging = false;

  track.addEventListener('pointerdown', function(e) {
    isDragging = true;
    track.setPointerCapture(e.pointerId);
    if (isPlaying) { tl.pause(); isPlaying = false; playBtn.textContent = '▶ 播放'; playBtn.setAttribute('aria-label', '播放'); }
    updateFromPointer(e);
  });
  document.addEventListener('pointermove', function(e) {
    if (!isDragging) return;
    updateFromPointer(e);
  });
  document.addEventListener('pointerup', function() { isDragging = false; });

  function updateFromPointer(e) {
    var pt = Deck.pt(track, e);
    var x = pt.x / track.offsetWidth;
    x = Math.max(0, Math.min(1, x));
    tl.progress(x);
    onTimelineUpdate();
  }

  // Keyboard on track
  track.addEventListener('keydown', function(e) {
    var step = 0.02;
    var p = S.progress;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); p = Math.min(1, p + step); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); p = Math.max(0, p - step); }
    else if (e.key === 'Home') { e.preventDefault(); p = 0; }
    else if (e.key === 'End') { e.preventDefault(); p = 1; }
    else return;
    if (isPlaying) { tl.pause(); isPlaying = false; playBtn.textContent = '▶ 播放'; playBtn.setAttribute('aria-label', '播放'); }
    tl.progress(p);
    onTimelineUpdate();
  });

  tl.eventCallback('onComplete', function() {
    isPlaying = false;
    playBtn.textContent = '▶ 播放';
    playBtn.setAttribute('aria-label', '播放');
  });

  /* ================================================================
     Init
     ================================================================ */
  onTimelineUpdate();

  Deck.onResize(function() {
    ctx = Deck.fit(cv);
    W = cv.width;
    H = cv.height;
    drawFireSpots._ps = null;
    drawAsh._ps = null;
    drawDinosaurs._sil = null;
    drawGround._tx = null;
    onTimelineUpdate();
  });

})();
</script>
</body>
</html>
