<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ========== page-08: 末端细线 ========== */
/* knowledge structure: comparison — two time bands on the same axis */

#main {
  padding: var(--space-5) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

/* intro */
.intro-lead {
  flex: 0 0 auto;
  font-size: var(--fs-lead);
  line-height: var(--lh-lead);
  color: var(--text);
  max-width: 80%;
}

/* ===== band containers ===== */
.band {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.band-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.band-name {
  font-size: var(--fs-sec);
  font-weight: 700;
  color: var(--text);
}
.band-note {
  font-size: var(--fs-label);
  color: var(--muted);
}

/* track */
.band-track {
  position: relative;
  width: 100%;
  height: 40px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.06);
  overflow: hidden;
  isolation: isolate;
}
.band-fill {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.12);
}
.band-fill.accent {
  background: rgba(11,122,117,0.35);
}

/* Homo sapiens markers */
.homo-tick {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  background: var(--accent);
  min-width: 2px;
}
.homo-tick::after {
  content: "HS";
  position: absolute;
  right: 0;
  top: -20px;
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0;
  white-space: nowrap;
}
.homo-section {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  background: var(--accent);
  opacity: 0.8;
  transition: width 0.05s linear;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 6px;
  min-width: 2px;
}
.homo-section-label {
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--surface);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.2s;
}
.homo-section-label.visible {
  opacity: 1;
}

/* axis labels */
.band-axis {
  display: flex;
  justify-content: space-between;
  font-size: var(--fs-label);
  color: var(--muted);
}
.band-axis .end-label {
  text-align: right;
}

/* zoom connector visual */
.zoom-bracket {
  flex: 0 0 auto;
  display: flex;
  justify-content: flex-end;
  height: 12px;
  position: relative;
  margin: 0;
}
.zoom-bracket .bracket-arm {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 60px;
  height: 12px;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
  opacity: 0.5;
}

/* ===== k-comparison data table ===== */
.k-comparison {
  flex: 0 0 auto;
  --cmp-cols: 2;
  --dim-w: 140px;
  font-size: var(--fs-label);
}
.k-comparison .hdr {
  font-size: var(--fs-label);
}
.k-comparison .dim {
  font-size: var(--fs-label);
}
.k-comparison .val {
  padding: var(--space-2) var(--space-3);
}
.k-comparison .val.diff {
  background: var(--accent-soft);
  font-weight: 700;
  color: var(--text);
}

/* ===== controls ===== */
.ctl-row {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.ctl-row label {
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
}
.ctl-row input[type="range"] {
  flex: 1;
  accent-color: var(--accent);
  cursor: pointer;
}
.ctl-row .zoom-val {
  font-size: var(--fs-label);
  color: var(--accent);
  font-weight: 700;
  min-width: 52px;
  text-align: right;
  white-space: nowrap;
}

/* ===== readings panel ===== */
.readings-panel {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-around;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-4);
}
.readings-panel .reading-item {
  font-size: var(--fs-sec);
  color: var(--text);
}
.readings-panel .reading-item strong {
  color: var(--accent);
  font-weight: 700;
}

/* ===== spacer ===== */
.spacer {
  flex: 1 1 auto;
  min-height: 0;
}
</style>
</head>
<body data-page="08" data-total="50">
<div id="stage">
<main id="main">

  <!-- Intro sentence -->
  <div class="intro-lead">
    哺乳动物的时代有 6600 万年长，而智人的全部历史只占它最后不到 0.5%。
  </div>

  <!-- ===== Top band: Full Mammal Age ===== -->
  <div class="band" id="top-band">
    <div class="band-header">
      <span class="band-name">哺乳动物时代</span>
      <span class="band-note" id="top-span-label">6600 万年</span>
    </div>
    <div class="band-track">
      <div class="band-fill"></div>
      <div class="homo-tick" id="top-tick"></div>
    </div>
    <div class="band-axis">
      <span>恐龙灭绝（距今 6600 万年）</span>
      <span class="end-label">今天</span>
    </div>
  </div>

  <!-- Visual connector: bracket -->
  <div class="zoom-bracket">
    <div class="bracket-arm"></div>
  </div>

  <!-- ===== Bottom band: Zoom window ===== -->
  <div class="band" id="bottom-band">
    <div class="band-header">
      <span class="band-name">末端放大</span>
      <span class="band-note" id="window-span-label">窗口: 6600 万年</span>
    </div>
    <div class="band-track">
      <div class="band-fill accent" id="bottom-fill"></div>
      <div class="homo-section" id="homo-section">
        <span class="homo-section-label" id="homo-section-label">HS</span>
      </div>
    </div>
    <div class="band-axis">
      <span id="window-start-label">距今 6600 万年</span>
      <span class="end-label">今天</span>
    </div>
  </div>

  <!-- ===== k-comparison data table ===== -->
  <div class="k-comparison">
    <div class="hdr">维度</div>
    <div class="hdr">哺乳动物时代</div>
    <div class="hdr">智人史</div>
    <div class="dim">时间跨度</div>
    <div class="val" id="cmp-mammal-span">—</div>
    <div class="val diff" id="cmp-sapiens-span">—</div>
    <div class="dim">占哺乳时代比例</div>
    <div class="val">100%</div>
    <div class="val diff" id="cmp-sapiens-pct">—</div>
  </div>

  <!-- ===== Slider ===== -->
  <div class="ctl-row">
    <label for="zoom-slider">聚焦末端</label>
    <input type="range" id="zoom-slider" min="0" max="1" step="0.001" value="0">
    <span class="zoom-val" id="zoom-label">1×</span>
  </div>

  <!-- ===== Readings ===== -->
  <div class="readings-panel">
    <span class="reading-item">窗口跨度: <strong id="rd-window-span">6600 万年</strong></span>
    <span class="reading-item">智人史占哺乳动物时代: <strong id="rd-homo-pct">0.45%</strong></span>
  </div>

  <!-- spacer -->
  <div class="spacer"></div>

</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  'use strict';

  // ---- mount ----
  Lec.mount({
    index: 8,
    kicker: 'MAMMAL AGE · DEEP TIME',
    title: '6600 万年里，智人只占最后不到 0.5%',
    take: '智人史在 6600 万年的哺乳动物时代中仅占最后不到 0.5%，必须放大约 220 倍才看得见'
  });

  // ---- constants from Lec.K ----
  var DINO_YEARS = Lec.K.DINOSAUR_EXTINCTION_YEARS;   // 66,000,000
  var SAP_YEARS  = Lec.K.HOMO_SAPIENS_YEARS;           // 300,000
  var MAX_ZOOM   = DINO_YEARS / SAP_YEARS;              // ~220
  var HOMO_PCT   = (SAP_YEARS / DINO_YEARS) * 100;     // ~0.4545%

  // ---- helper: format years to 万年 ----
  function fmtWan(years) {
    var wan = years / 10000;
    if (wan >= 1000) {
      return Lec.P.round(wan / 1000, 1) + ' 亿年';
    }
    return Lec.P.round(wan, 0) + ' 万年';
  }

  function fmtWanPrecise(years) {
    var wan = years / 10000;
    if (wan >= 1000) {
      return Lec.P.round(wan / 1000, 1) + ' 亿年';
    }
    if (wan >= 100) {
      return Lec.P.round(wan, 0) + ' 万年';
    }
    return Lec.P.round(wan, 1) + ' 万年';
  }

  // ---- DOM refs ----
  var slider       = document.getElementById('zoom-slider');
  var zoomLabel    = document.getElementById('zoom-label');
  var topTick      = document.getElementById('top-tick');
  var homoSection  = document.getElementById('homo-section');
  var homoLabel    = document.getElementById('homo-section-label');
  var windowStart  = document.getElementById('window-start-label');
  var windowSpanL  = document.getElementById('window-span-label');
  var rdWindowSpan = document.getElementById('rd-window-span');
  var rdHomoPct    = document.getElementById('rd-homo-pct');
  var cmpMammal    = document.getElementById('cmp-mammal-span');
  var cmpSapiens   = document.getElementById('cmp-sapiens-span');
  var cmpSapiensPct= document.getElementById('cmp-sapiens-pct');

  // ---- set static comparison data ----
  cmpMammal.textContent  = fmtWan(DINO_YEARS);
  cmpSapiens.textContent = fmtWanPrecise(SAP_YEARS);
  cmpSapiensPct.textContent = Lec.P.round(HOMO_PCT, 1) + '%';

  // ---- set top tick (fixed, always at right end) ----
  var topPct = HOMO_PCT;
  topTick.style.width = Math.max(topPct, 0.15) + '%';

  // ---- update function ----
  function update(t) {
    // t in [0, 1]
    var zoom = 1 + t * (MAX_ZOOM - 1);
    var windowSpan = DINO_YEARS / zoom;
    var homoWidthPct = (SAP_YEARS / windowSpan) * 100;

    // zoom label
    zoomLabel.textContent = Lec.P.round(zoom, 0) + '×';

    // window span display
    var spanText = fmtWan(windowSpan);
    windowSpanL.textContent = '窗口: ' + spanText;
    rdWindowSpan.textContent = spanText;

    // homo pct (fixed, always the same)
    rdHomoPct.textContent = Lec.P.round(HOMO_PCT, 2) + '%';

    // window start label
    var startYears = DINO_YEARS - windowSpan;
    var startWan = startYears / 10000;
    var startText;
    if (startWan >= 1000) {
      startText = '距今 ' + Lec.P.round(startWan / 1000, 1) + ' 亿年';
    } else {
      startText = '距今 ' + Lec.P.round(startWan, 0) + ' 万年';
    }
    windowStart.textContent = startText;

    // homo section width in bottom band
    var clampedWidth = Math.min(Math.max(homoWidthPct, 0.15), 100);
    homoSection.style.width = clampedWidth + '%';

    // show HS label only when section is wide enough
    if (homoWidthPct > 8) {
      homoLabel.classList.add('visible');
    } else {
      homoLabel.classList.remove('visible');
    }

    // bottom fill width (covers everything except the homo section)
    // Actually, the fill covers the whole track, and homo section overlaps on the right
    // No need to adjust fill
  }

  // ---- initial state ----
  update(0);

  // ---- slider event ----
  slider.addEventListener('input', function() {
    update(parseFloat(this.value));
  });

  // ---- handle reduced motion ----
  if (Deck.reduced()) {
    // Just show the initial state, no animation
    slider.value = '0';
    update(0);
  }

})();
</script>
</body>
</html>
