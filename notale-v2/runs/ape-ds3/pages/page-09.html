<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== 页面专用样式 ===== */

#main {
  position: relative;
  padding: 0;
  overflow: hidden;
}

.lamp-grid {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  flex-direction: row;
  gap: var(--space-3);
  margin: 0;
  padding: 26px 0 36px 0;
  list-style: none;
  overflow: hidden;
  box-sizing: border-box;
}

.lamp-box {
  flex: 1;
  min-width: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-md);
  overflow: hidden;
  cursor: pointer;
  background: #0d0d0d;
  border: 1px solid #2a2a2a;
  transition: border-color 0.4s ease, box-shadow 0.4s ease;
  outline: none;
  min-height: 0;
}
.lamp-box:focus-visible {
  box-shadow: 0 0 0 3px var(--focus, #0b7a75);
}
.lamp-box:hover {
  border-color: #444;
}

/* 插画区 */
.lamp-img {
  position: relative;
  flex: 1;
  overflow: hidden;
  background: #080808;
  min-height: 0;
}
.lamp-img img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.06;
  transition: opacity 0.6s ease;
}

/* 暗色覆盖层 */
.lamp-img::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.85) 100%);
  pointer-events: none;
  transition: opacity 0.6s ease;
}

/* 灯箱底部信息区 */
.lamp-info {
  flex: 0 0 auto;
  padding: 6px var(--space-3);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  background: #0a0a0a;
  border-top: 1px solid #1a1a1a;
}
.lamp-name {
  font-size: var(--fs-label);
  font-weight: 700;
  color: #555;
  transition: color 0.4s ease;
  line-height: 1.35;
  white-space: nowrap;
}
.lamp-time {
  font-size: var(--fs-label);
  color: transparent;
  transition: color 0.4s ease;
  line-height: 1.35;
  white-space: nowrap;
}

/* ===== 点亮状态 ===== */
.lamp-box.active {
  border-color: var(--glow, #555);
  box-shadow: 0 0 16px color-mix(in srgb, var(--glow, #555) 25%, transparent), inset 0 0 24px color-mix(in srgb, var(--glow, #555) 8%, transparent);
}
.lamp-box.active .lamp-img img { opacity: 0.75; }
.lamp-box.active .lamp-img::after { opacity: 0; }
.lamp-box.active .lamp-name { color: var(--glow, #ccc); }
.lamp-box.active .lamp-time { color: var(--text); }

/* 各灯箱的发光色 */
.lamp-box[data-order="0"] { --glow: #D97706; }
.lamp-box[data-order="1"] { --glow: #A16207; }
.lamp-box[data-order="2"] { --glow: #7C3AED; }
.lamp-box[data-order="3"] { --glow: #0D9488; }
.lamp-box[data-order="4"] { --glow: #DC2626; }
.lamp-box[data-order="5"] { --glow: #65A30D; }

/* ===== 时间轴 ===== */
.timeline-wrap {
  flex: 0 0 auto;
  margin-top: var(--space-2);
  padding: 0 var(--space-3);
  width: 100%;
  box-sizing: border-box;
}
.timeline {
  position: relative;
  height: 28px;
}
.timeline-track {
  position: absolute;
  left: 0; right: 0;
  top: 50%;
  height: 2px;
  background: #2a2a2a;
  transform: translateY(-50%);
  border-radius: 1px;
}
.timeline-dot {
  position: absolute;
  top: 50%;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #2a2a2a;
  transform: translate(-50%, -50%);
  transition: background 0.4s ease, box-shadow 0.4s ease;
  z-index: 1;
}
.timeline-dot.active { box-shadow: 0 0 8px var(--glow, #ccc); }
.timeline-labels {
  position: absolute;
  left: 0; right: 0;
  top: 100%;
  display: flex;
  justify-content: space-between;
  font-size: var(--fs-tick);
  color: var(--muted);
  line-height: 1.35;
  margin-top: 0;
}

/* ===== 页面总体布局 ===== */
.intro {
  flex: 0 0 auto;
  margin: 0 0 var(--space-1) 0;
  font-size: var(--fs-sec);
  line-height: 1.35;
  color: #aaa;
}
.intro strong { color: var(--text); font-weight: 700; }
</style>
</head>
<body data-page="09" data-total="50">
<div id="stage">
<main id="main">
  <p class="intro">恐龙之后，哺乳动物不是一夜之间接管世界的——它们用千万年尺度，<strong>一格一格填满每一个生态位</strong>。</p>
  <div class="lamp-grid" role="group" aria-label="哺乳动物支系灯箱">
    <!-- 六个灯箱由 JS 生成 -->
  </div>
  <div class="timeline-wrap">
    <div class="timeline" role="presentation" aria-hidden="true">
      <div class="timeline-track"></div>
      <div class="timeline-labels">
        <span class="timeline-label-start">60 Ma</span>
        <span class="timeline-label-end">40 Ma</span>
      </div>
    </div>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({ index: 9, kicker: 'RADIATION', title: '辐射灯箱——百万年填满每个生态位', take: '' });

(function() {
  'use strict';
  var mammalData = [
    { order: '\u7075\u957F\u76EE',   latin: 'Primates', tAgoMa: 55, iconKey: 'primate',        color: '#D97706' },
    { order: '\u556E\u9F7F\u76EE',   latin: 'Rodentia', tAgoMa: 56, iconKey: 'rodent',         color: '#A16207' },
    { order: '\u7FFC\u624B\u76EE',  latin: 'Chiroptera', tAgoMa: 52, iconKey: 'chiroptera',     color: '#7C3AED' },
    { order: '\u9CB8\u5076\u8E44\u76EE', latin: 'Cetartiodactyla', tAgoMa: 50, iconKey: 'cetartiodactyla', color: '#0D9488' },
    { order: '\u98DF\u8089\u76EE',   latin: 'Carnivora', tAgoMa: 42, iconKey: 'carnivora',      color: '#DC2626' },
    { order: '\u5947\u8E44\u76EE', latin: 'Perissodactyla', tAgoMa: 56, iconKey: 'perissodactyla', color: '#65A30D' }
  ];
  var minMa = 38, maxMa = 60, range = maxMa - minMa;
  var usedPositions = {};
  function fmt(ma) { return '\u803D\u4ECA ' + ma + ' \u767E\u4E07\u5E74'; }
  var grid = document.querySelector('.lamp-grid');
  var tl = document.querySelector('.timeline');
  mammalData.forEach(function(d, i) {
    var box = document.createElement('div');
    box.className = 'lamp-box min0';
    box.setAttribute('data-order', i);
    box.setAttribute('tabindex', '0');
    box.setAttribute('role', 'button');
    box.setAttribute('aria-pressed', 'false');
    box.setAttribute('aria-label', d.order + '\u76EE ' + (d.latin||'') + '\uFF0C' + fmt(d.tAgoMa));
    var ia = document.createElement('div');
    ia.className = 'lamp-img min0';
    var im = document.createElement('img');
    im.src = 'assets/img/p09-' + d.iconKey + '.png';
    im.alt = d.order + ' \u526A\u5F71';
    im.loading = 'lazy';
    ia.appendChild(im);
    var info = document.createElement('div');
    info.className = 'lamp-info';
    var nm = document.createElement('div');
    nm.className = 'lamp-name';
    nm.textContent = d.order;
    info.appendChild(nm);
    var tm = document.createElement('div');
    tm.className = 'lamp-time';
    tm.textContent = fmt(d.tAgoMa);
    info.appendChild(tm);
    box.appendChild(ia);
    box.appendChild(info);
    grid.appendChild(box);
    var pct = (maxMa - d.tAgoMa) / range * 100;
    var key = Math.round(pct);
    if (usedPositions[key]) pct += (i % 2 === 0 ? 1.5 : -1.5);
    usedPositions[key] = true;
    var dot = document.createElement('div');
    dot.className = 'timeline-dot';
    dot.style.left = pct + '%';
    dot.style.setProperty('--glow', d.color);
    dot.setAttribute('data-order', i);
    tl.appendChild(dot);
    function toggle() {
      var a = box.classList.toggle('active');
      box.setAttribute('aria-pressed', a);
      dot.classList.toggle('active', a);
      dot.style.background = a ? d.color : '#2a2a2a';
    }
    box.addEventListener('click', toggle);
    box.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  });
})();
</script>
</body>
</html>
