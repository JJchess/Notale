<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/lib/katex.min.css">
<style>
/* Suppress step counter in legend - stages have their own names */
#stage-legend > .step::before { display:none; }
#stage-legend { counter-reset:none; }
</style>
</head>
<body data-page="10" data-total="50">
<div id="stage">
<main id="main" class="row">
  <!-- Left panel: 280px -->
  <div class="col" style="width:280px; flex:0 0 auto; padding:var(--space-5) 0 var(--space-5) var(--space-5);">
    <div class="lec-kicker">深时 · 冰期</div>
    <h1 class="lec-title" style="margin:var(--space-2) 0 0 0; font-size:var(--fs-h1); line-height:var(--lh-h1);">冷热之间，从未停摆</h1>

    <!-- Knob -->
    <div id="knob-wrap" style="width:160px; height:160px; margin:var(--space-5) auto; position:relative;">
      <canvas id="knob-cv" class="cv-fill" style="border-radius:50%; cursor:grab;"></canvas>
    </div>

    <!-- Readings panel -->
    <div class="panel" style="padding:var(--space-3) var(--space-4);">
      <div class="reading-row" style="display:flex; justify-content:space-between; align-items:baseline; font-size:var(--fs-sec); line-height:var(--lh-sec);">
        <span class="text-muted">距今</span>
        <span><span id="years-val" style="font-size:var(--fs-body); font-weight:700; color:var(--text);">—</span> 万年</span>
      </div>
      <div class="reading-row" style="display:flex; justify-content:space-between; align-items:baseline; font-size:var(--fs-sec); line-height:var(--lh-sec); margin-top:var(--space-2);">
        <span class="text-muted">温度距平</span>
        <span><span id="temp-val" style="font-size:var(--fs-body); font-weight:700; color:var(--text);">—</span> °C</span>
      </div>
      <div class="reading-row" style="display:flex; justify-content:space-between; align-items:baseline; font-size:var(--fs-sec); line-height:var(--lh-sec); margin-top:var(--space-2);">
        <span class="text-muted">阶段</span>
        <span id="stage-val" style="font-size:var(--fs-body); font-weight:700; color:var(--text);">—</span>
      </div>
    </div>

    <!-- Stage cycle legend -->
    <div class="k-process" id="stage-legend" style="margin-top:var(--space-4); flex:none; gap:0;">
      <div class="step current" data-stage="interglacial" style="flex:1; padding:var(--space-2) var(--space-2); margin:0; text-align:center; font-size:var(--fs-label); line-height:var(--lh-label);">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#d97706; margin-right:4px; vertical-align:middle;"></span>
        间冰期
      </div>
      <div class="arw" style="flex:0 0 28px; font-size:var(--fs-sec);"></div>
      <div class="step" data-stage="cooling" style="flex:1; padding:var(--space-2) var(--space-2); margin:0; text-align:center; font-size:var(--fs-label); line-height:var(--lh-label);">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#1d4ed8; margin-right:4px; vertical-align:middle;"></span>
        变冷期
      </div>
      <div class="arw" style="flex:0 0 28px; font-size:var(--fs-sec);"></div>
      <div class="step" data-stage="glacial" style="flex:1; padding:var(--space-2) var(--space-2); margin:0; text-align:center; font-size:var(--fs-label); line-height:var(--lh-label);">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#1e3a5f; margin-right:4px; vertical-align:middle;"></span>
        盛冰期
      </div>
      <div class="arw" style="flex:0 0 28px; font-size:var(--fs-sec);"></div>
      <div class="step" data-stage="warming" style="flex:1; padding:var(--space-2) var(--space-2); margin:0; text-align:center; font-size:var(--fs-label); line-height:var(--lh-label);">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#ea580c; margin-right:4px; vertical-align:middle;"></span>
        变暖期
      </div>
    </div>
  </div>

  <!-- Right panel: chart -->
  <div class="grow col" style="padding:var(--space-5) var(--space-5) var(--space-5) var(--space-4); min-width:0;">
    <div id="chart-container" style="width:100%; height:440px; flex:0 0 auto;"></div>
    <div class="note" style="margin-top:var(--space-3); font-size:var(--fs-sec); line-height:var(--lh-sec); border-top:1px solid var(--line); padding-top:var(--space-2);">
      所谓「冰期」和「间冰期」只是这个连续摆动中的两个片段，不是两个固定的世界。
    </div>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(function(){
  'use strict';

  // ---- Mount header/footer ----
  Lec.mount({
    index: 10,
    kicker: "深时 · 冰期",
    title: "冷热之间，从未停摆",
    take: "智人演化的整个时期，地球一直在冷热之间摆动。"
  });

  // ---- Constants ----
  var START_YA = Lec.K.HOMO_SAPIENS_YEARS; // 300,000 years ago
  var END_YA = 0; // present
  var RESOLUTION = 1000; // 1,000-year steps
  var MIN_ANGLE = -150 * Math.PI / 180;
  var MAX_ANGLE = 150 * Math.PI / 180;

  // ---- Generate temperature series ----
  function generateTemperatureSeries(startYearsAgo, endYearsAgo, resolution) {
    var data = [];
    for (var t = startYearsAgo; t >= endYearsAgo; t -= resolution) {
      // Realistic glacial-interglacial curve over 300,000 years
      // Main 100kyr cycles with sawtooth shape (slow cool, rapid warm)
      var phase = t / 100000;
      // Sawtooth: slow cooling (sin going down), rapid warming (sin going up fast)
      var base = Math.sin(phase * Math.PI * 2 + 0.7);
      var saw = base + 0.25 * Math.sin(phase * Math.PI * 4 + 1.2);
      
      // Amplitude modulation: stronger swings in later cycles
      var amp = 2.8 + 0.8 * Math.sin(phase * Math.PI + 0.3);
      
      // Higher-frequency components (precession ~23kyr, obliquity ~41kyr)
      var precess = 0.7 * Math.sin(t / 23000 * Math.PI * 2 + 0.5);
      var obliquity = 0.4 * Math.sin(t / 41000 * Math.PI * 2 + 1.1);
      
      // Millennial-scale variability
      var millennial = 0.3 * Math.sin(t / 6000 * Math.PI * 2 + 2.3);
      
      var temp = saw * amp + precess + obliquity + millennial;
      
      // Scale to realistic range: about -6 to +2 °C
      temp = temp * 1.0;
      
      data.push({
        yearsAgo: t,
        tempAnomalyC: temp
      });
    }
    // Ensure we have the endpoint
    data.push({
      yearsAgo: endYearsAgo,
      tempAnomalyC: data[data.length - 1].tempAnomalyC // approximate
    });
    return data;
  }

  var series = generateTemperatureSeries(START_YA, END_YA, RESOLUTION);

  // ---- Stage detection ----
  function getStageFor(currentPoint, series) {
    // Find index of current point in series
    var idx = 0;
    for (var i = 0; i < series.length; i++) {
      if (series[i].yearsAgo <= currentPoint.yearsAgo) {
        idx = i;
        break;
      }
    }
    
    // Look at trend: compare temperature over last ~10 points
    var lookback = Math.min(10, idx);
    var lookbackIdx = Math.min(idx + lookback, series.length - 1);
    var trend = 0;
    if (lookbackIdx > idx) {
      trend = series[lookbackIdx].tempAnomalyC - series[idx].tempAnomalyC;
    } else if (idx > 0) {
      trend = series[idx].tempAnomalyC - series[Math.max(0, idx - 1)].tempAnomalyC;
    }
    
    // Get temperature quantile relative to series range
    var temps = series.map(function(d) { return d.tempAnomalyC; });
    var minT = Math.min.apply(null, temps);
    var maxT = Math.max.apply(null, temps);
    var range = maxT - minT;
    var relPos = range > 0 ? (currentPoint.tempAnomalyC - minT) / range : 0.5;
    
    // Determine stage
    var stage;
    if (relPos > 0.7 && trend < 0.5) {
      stage = { id: 'interglacial', label: '间冰期' };
    } else if (trend < -0.1) {
      stage = { id: 'cooling', label: '变冷期' };
    } else if (relPos < 0.3 && trend > -0.5) {
      stage = { id: 'glacial', label: '盛冰期' };
    } else if (trend > 0.1) {
      stage = { id: 'warming', label: '变暖期' };
    } else if (relPos <= 0.5) {
      stage = { id: 'glacial', label: '盛冰期' };
    } else {
      stage = { id: 'interglacial', label: '间冰期' };
    }
    
    // Refine: if warming but still cold, it's warming
    // if cooling but still warm, it's cooling
    if (trend > 0.1 && relPos < 0.4) {
      stage = { id: 'warming', label: '变暖期' };
    }
    if (trend < -0.1 && relPos > 0.6) {
      stage = { id: 'cooling', label: '变冷期' };
    }
    
    return stage;
  }

  // ---- Formatting helpers ----
  function formatYearsAgo(ya) {
    if (ya === 0) return '0';
    var wan = ya / 10000;
    return wan.toFixed(1);
  }

  function formatTemp(t) {
    var sign = t >= 0 ? '+' : '−';
    return sign + Math.abs(t).toFixed(1);
  }

  // ---- Map angle to yearsAgo ----
  function angleToYearsAgo(angle) {
    var t = (angle - MIN_ANGLE) / (MAX_ANGLE - MIN_ANGLE);
    t = Math.max(0, Math.min(1, t));
    var ya = Math.round((1 - t) * START_YA);
    return ya;
  }

  function yearsAgoToAngle(ya) {
    var t = 1 - ya / START_YA;
    var angle = MIN_ANGLE + t * (MAX_ANGLE - MIN_ANGLE);
    return angle;
  }

  // ---- Find data point nearest to a given yearsAgo ----
  function findNearestPoint(ya) {
    var best = series[0];
    var bestDist = Math.abs(series[0].yearsAgo - ya);
    for (var i = 1; i < series.length; i++) {
      var d = Math.abs(series[i].yearsAgo - ya);
      if (d < bestDist) {
        bestDist = d;
        best = series[i];
      }
    }
    return best;
  }

  // ---- Knob ----
  var knobCv = document.getElementById('knob-cv');
  var knobWrap = document.getElementById('knob-wrap');
  var ctx = Deck.fit(knobCv);
  var dragging = false;
  var currentAngle = 0; // radians, -150° to +150°

  function drawKnob(angle) {
    var w = knobCv.width, h = knobCv.height;
    var cx = w / 2, cy = h / 2;
    var outerR = w / 2 - 4;
    var innerR = outerR * 0.7;
    var handleR = 12;

    ctx.clearRect(0, 0, w, h);

    // Outer ring track
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Active arc (from -150° to current angle)
    var startA = -150 * Math.PI / 180 + Math.PI/2;
    var endA = angle + Math.PI/2;
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, Math.min(startA, endA), Math.max(startA, endA));
    ctx.strokeStyle = '#0b7a75';
    ctx.lineWidth = 4;
    ctx.stroke();

    // Tick marks
    for (var deg = -150; deg <= 150; deg += 30) {
      var rad = deg * Math.PI / 180;
      var inner = deg === 0 ? innerR - 8 : innerR - 4;
      var x1 = cx + inner * Math.cos(rad + Math.PI/2);
      var y1 = cy + inner * Math.sin(rad + Math.PI/2);
      var x2 = cx + (innerR - 2) * Math.cos(rad + Math.PI/2);
      var y2 = cy + (innerR - 2) * Math.sin(rad + Math.PI/2);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = deg === 0 ? '#0b7a75' : 'rgba(255,255,255,0.3)';
      ctx.lineWidth = deg === 0 ? 2 : 1;
      ctx.stroke();
    }

    // Handle
    var hx = cx + innerR * Math.cos(angle + Math.PI/2);
    var hy = cy + innerR * Math.sin(angle + Math.PI/2);
    
    // Handle glow
    var grad = ctx.createRadialGradient(hx, hy, 0, hx, hy, handleR * 1.5);
    grad.addColorStop(0, 'rgba(11,122,117,0.4)');
    grad.addColorStop(1, 'rgba(11,122,117,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(hx, hy, handleR * 1.5, 0, Math.PI * 2);
    ctx.fill();
    
    // Handle circle
    ctx.beginPath();
    ctx.arc(hx, hy, handleR, 0, Math.PI * 2);
    ctx.fillStyle = '#0b7a75';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Center dot
    ctx.beginPath();
    ctx.arc(cx, cy, 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fill();
  }

  function updateKnobFromAngle(angle) {
    angle = Math.max(MIN_ANGLE, Math.min(MAX_ANGLE, angle));
    currentAngle = angle;
    drawKnob(angle);
    
    var ya = angleToYearsAgo(angle);
    var pt = findNearestPoint(ya);
    var stage = getStageFor(pt, series);
    
    updateDisplay(pt, stage);
    updateChartMarker(pt);
    updateStageLegend(stage);
  }

  function getKnobAngleFromPointer(e) {
    var rect = knobWrap.getBoundingClientRect();
    var cx = rect.width / 2;
    var cy = rect.height / 2;
    var pt = Deck.pt(knobCv, e);
    var dx = pt.x - cx;
    var dy = pt.y - cy;
    // Calculate angle: 0 = top (12 o'clock), positive = clockwise
    var angle = Math.atan2(dx, -dy);
    // Clamp to [-150°, +150°]
    angle = Math.max(MIN_ANGLE, Math.min(MAX_ANGLE, angle));
    return angle;
  }

  // ---- Pointer events for knob ----
  knobCv.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    dragging = true;
    knobCv.setPointerCapture(e.pointerId);
    knobCv.style.cursor = 'grabbing';
    var angle = getKnobAngleFromPointer(e);
    updateKnobFromAngle(angle);
  });

  knobCv.addEventListener('pointermove', function(e) {
    e.preventDefault();
    if (!dragging) return;
    var angle = getKnobAngleFromPointer(e);
    updateKnobFromAngle(angle);
  });

  knobCv.addEventListener('pointerup', function(e) {
    e.preventDefault();
    dragging = false;
    knobCv.style.cursor = 'grab';
  });

  knobCv.addEventListener('pointercancel', function(e) {
    dragging = false;
    knobCv.style.cursor = 'grab';
  });

  // Wheel on knob
  knobCv.addEventListener('wheel', function(e) {
    e.preventDefault();
    var delta = e.deltaY > 0 ? -0.05 : 0.05; // ~3 degrees per step
    updateKnobFromAngle(currentAngle + delta);
  }, { passive: false });

  // ---- Update display ----
  function updateDisplay(pt, stage) {
    document.getElementById('years-val').textContent = formatYearsAgo(pt.yearsAgo);
    document.getElementById('temp-val').textContent = formatTemp(pt.tempAnomalyC);
    document.getElementById('stage-val').textContent = stage.label;
  }

  // ---- Update chart marker ----
  var chartInstance = null;
  var currentMarkerYa = 0;

  function updateChartMarker(pt) {
    currentMarkerYa = pt.yearsAgo;
    if (!chartInstance) return;
    var markerX = START_YA - pt.yearsAgo;
    var opt = chartInstance.getOption();
    // Update markLine
    opt.series[0].markLine = {
      silent: true,
      symbol: 'none',
      lineStyle: { color: '#0b7a75', type: 'dashed', width: 1.5 },
      label: { show: false },
      data: [{ xAxis: markerX }]
    };
    // Update markPoint
    opt.series[0].markPoint = {
      silent: true,
      symbol: 'circle',
      symbolSize: 10,
      itemStyle: { color: '#0b7a75', borderColor: '#fff', borderWidth: 2 },
      label: { show: false },
      data: [{ xAxis: markerX, yAxis: pt.tempAnomalyC }]
    };
    chartInstance.setOption(opt, true);
  }

  // ---- Update stage legend ----
  function updateStageLegend(stage) {
    var steps = document.querySelectorAll('#stage-legend > .step');
    steps.forEach(function(s) {
      s.classList.remove('current');
    });
    var current = document.querySelector('#stage-legend > .step[data-stage="' + stage.id + '"]');
    if (current) current.classList.add('current');
  }

  // ---- ECharts ----
  var chartEl = document.getElementById('chart-container');
  chartInstance = echarts.init(chartEl, null, { renderer: 'svg' });

  // Prepare data for chart: x = offset from oldest (past on left, present on right)
  var chartData = series.slice().map(function(d) {
    return { x: START_YA - d.yearsAgo, tempAnomalyC: d.tempAnomalyC };
  }).reverse();

  var opt = {
    grid: {
      left: 60,
      right: 20,
      top: 20,
      bottom: 40
    },
    xAxis: {
      type: 'value',
      name: '距今（万年）',
      nameLocation: 'center',
      nameGap: 30,
      nameTextStyle: { fontSize: 14, color: '#5c5e5a' },
      min: 0,
      max: START_YA,
      axisLabel: {
        fontSize: 13,
        color: '#5c5e5a',
        formatter: function(v) { return ((START_YA - v) / 10000).toFixed(0); }
      },
      axisLine: { lineStyle: { color: '#5c5e5a' } },
      splitLine: { show: true, lineStyle: { color: 'rgba(255,255,255,0.06)', type: 'dashed' } }
    },
    yAxis: {
      type: 'value',
      name: '温度距平（°C）',
      nameTextStyle: { fontSize: 14, color: '#5c5e5a' },
      min: -7,
      max: 3,
      axisLabel: {
        fontSize: 13,
        color: '#5c5e5a',
        formatter: function(v) { return v.toFixed(0); }
      },
      axisLine: { lineStyle: { color: '#5c5e5a' } },
      splitLine: { show: true, lineStyle: { color: 'rgba(255,255,255,0.06)', type: 'dashed' } }
    },
    series: [
      {
        type: 'line',
        data: chartData.map(function(d) { return [d.x, d.tempAnomalyC]; }),
        smooth: true,
        showSymbol: false,
        lineStyle: { width: 2, color: '#0b7a75' },
        areaStyle: {
          // Custom gradient: warm above 0, cool below 0
          color: {
            type: 'linear',
            x: 0, y: 0, x2: 0, y2: 1,
            colorStops: [
              { offset: 0, color: 'rgba(217,119,6,0.25)' },   // warm
              { offset: 0.7, color: 'rgba(11,122,117,0.05)' },
              { offset: 1, color: 'rgba(30,58,95,0.35)' }      // cold
            ]
          }
        },
        // Mark line for 0°C reference
        markLine: {
          silent: true,
          symbol: 'none',
          lineStyle: { color: 'rgba(255,255,255,0.3)', type: 'dashed', width: 1 },
          label: {
            formatter: '0 °C（1950–2000 平均）',
            fontSize: 14,
            color: '#5c5e5a',
            position: 'end'
          },
          data: [{ yAxis: 0 }]
        },
        markPoint: {
          silent: true,
          symbol: 'circle',
          symbolSize: 10,
          itemStyle: { color: '#0b7a75', borderColor: '#fff', borderWidth: 2 },
          label: { show: false },
          data: [{ xAxis: chartData[0].x, yAxis: chartData[0].tempAnomalyC }]
        }
      }
    ],
    tooltip: {
      trigger: 'axis',
      formatter: function(params) {
        var p = params[0];
        var x = p.data[0];
        var ya = START_YA - x;
        var temp = p.data[1];
        return '距今 ' + (ya / 10000).toFixed(1) + ' 万年<br>温度距平 ' + (temp >= 0 ? '+' : '') + temp.toFixed(1) + ' °C';
      },
      textStyle: { fontSize: 14 }
    }
  };

  chartInstance.setOption(opt);

  // ---- Initialize at present ----
  var initPt = findNearestPoint(0);
  var initAngle = yearsAgoToAngle(0);
  var initStage = getStageFor(initPt, series);
  currentAngle = initAngle;
  drawKnob(initAngle);
  updateDisplay(initPt, initStage);
  updateChartMarker(initPt);
  updateStageLegend(initStage);

  // ---- Resize ----
  Deck.onResize(function() {
    chartInstance && chartInstance.resize();
  });

})();
</script>
</body>
</html>
