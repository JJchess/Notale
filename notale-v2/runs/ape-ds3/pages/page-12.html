<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}

/* ── background ── */
#bg-layer {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
#bg-layer img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.15;
  filter: brightness(0.35) contrast(1.15);
  user-select: none;
  pointer-events: none;
}

/* ── main ── */
#main {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  padding: var(--space-5) var(--space-7) var(--space-4);
}

/* ── clock ── */
#clock-area {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--space-1);
  margin-top: var(--space-2);
}
.clock-date {
  font-size: var(--fs-label);
  font-weight: 400;
  color: rgba(230, 230, 230, 0.5);
  letter-spacing: 0.06em;
}
.clock-time {
  font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "Consolas", monospace;
  font-size: 68px;
  font-weight: 300;
  line-height: 1;
  color: var(--text);
  letter-spacing: 0.04em;
  text-shadow: 0 0 50px rgba(230, 230, 230, 0.1);
}

/* ── controls ── */
#controls-area {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  margin: var(--space-4) auto var(--space-3);
  width: 76%;
  max-width: 960px;
}
#play-btn {
  flex: 0 0 auto;
  width: 42px;
  height: 42px;
  border: 1px solid rgba(230, 230, 230, 0.2);
  border-radius: 50%;
  background: rgba(230, 230, 230, 0.05);
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, border-color 0.2s;
  padding: 0;
  line-height: 1;
  font-family: inherit;
}
#play-btn:hover {
  background: rgba(230, 230, 230, 0.12);
  border-color: rgba(230, 230, 230, 0.4);
}
#play-btn.playing {
  background: rgba(11, 122, 117, 0.2);
  border-color: var(--accent);
}
#time-slider {
  flex: 1;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: rgba(230, 230, 230, 0.12);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
  min-width: 0;
}
#time-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--text);
  border: 2px solid var(--bg);
  cursor: pointer;
  box-shadow: 0 0 10px rgba(230, 230, 230, 0.15);
}
#time-slider::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--text);
  border: 2px solid var(--bg);
  cursor: pointer;
}
#time-slider-label {
  font-size: var(--fs-label);
  color: rgba(230, 230, 230, 0.4);
  font-family: "JetBrains Mono", "Fira Code", monospace;
  min-width: 3em;
  text-align: right;
}

/* ── info panel (shows active event details) ── */
#info-panel {
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-3);
  margin: 0 auto var(--space-1);
  opacity: 0;
  transition: opacity 0.35s ease;
}
#info-panel.show { opacity: 1; }
#info-panel .info-icon {
  width: 20px; height: 20px;
  fill: #f5c542; color: #f5c542;
  flex: 0 0 auto;
}
#info-panel .info-name {
  font-size: var(--fs-body);
  font-weight: 600;
  color: #f5c542;
}
#info-panel .info-desc {
  font-size: var(--fs-sec);
  color: rgba(230, 230, 230, 0.6);
}
#info-panel .info-divider {
  width: 1px; height: 18px;
  background: rgba(230, 230, 230, 0.15);
}

/* ── timeline ── */
#timeline-area {
  position: relative;
  width: 100%;
  height: 70px;
  flex: 0 0 auto;
  margin-top: auto;
}
.timeline-track {
  position: absolute;
  left: 60px; right: 60px;
  top: 50%;
  height: 2px;
  background: rgba(230, 230, 230, 0.12);
  border-radius: 1px;
  transform: translateY(-50%);
}
.timeline-fill {
  position: absolute;
  left: 60px;
  top: 50%;
  height: 2px;
  background: var(--accent);
  border-radius: 1px;
  transform: translateY(-50%);
  transition: width 0.05s linear;
}
.timeline-ends {
  position: absolute;
  left: 60px; right: 60px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  z-index: 1;
}
.timeline-ends span {
  font-size: var(--fs-tick);
  color: rgba(230, 230, 230, 0.3);
  font-family: "JetBrains Mono", "Fira Code", monospace;
}

/* ── position indicator ── */
#pos-bar {
  position: absolute;
  top: calc(50% - 14px);
  width: 2px;
  height: 28px;
  background: var(--text);
  transform: translateX(-50%);
  pointer-events: none;
  box-shadow: 0 0 8px rgba(230, 230, 230, 0.12);
  transition: left 0.05s linear;
  z-index: 5;
}

/* ── event markers (dots + icons only, no labels on axis) ── */
.event-marker {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  gap: 5px;
  opacity: 0.15;
  transition: opacity 0.4s ease;
  pointer-events: none;
  z-index: 2;
}
.event-marker.active { opacity: 1; }
.event-marker .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(230, 230, 230, 0.5);
  transition: background 0.3s, box-shadow 0.3s;
}
.event-marker.active .dot {
  background: #f5c542;
  box-shadow: 0 0 14px rgba(245, 197, 66, 0.4);
}
.event-marker .icon {
  width: 20px; height: 20px;
  fill: currentColor;
  color: rgba(230, 230, 230, 0.5);
  transition: color 0.4s;
  flex: 0 0 auto;
}
.event-marker.active .icon { color: #f5c542; }

/* ── legend ── */
#legend-area {
  display: flex;
  justify-content: center;
  gap: var(--space-5);
  padding: var(--space-3) 0 0;
  flex: 0 0 auto;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-label);
  color: rgba(230, 230, 230, 0.35);
  transition: color 0.4s;
}
.legend-item .li-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(230, 230, 230, 0.3);
  transition: background 0.3s;
}
.legend-item.active { color: var(--text); }
.legend-item.active .li-dot { background: #f5c542; }

#legend-note {
  font-size: var(--fs-tick);
  color: rgba(230, 230, 230, 0.2);
  text-align: center;
  padding: var(--space-1) 0 0;
  letter-spacing: 0.03em;
}
</style>
</head>
<body data-page="12" data-total="50">
<div id="stage">
<main id="main">
  <!-- background -->
  <div id="bg-layer">
    <img src="assets/img/night-earth.png" alt="深夜地球" title="深夜地球 · AI生成">
  </div>

  <!-- flash overlay -->
  <div id="flash-overlay" style="position:absolute;inset:0;z-index:100;background:#fff;opacity:0;pointer-events:none;transition:opacity 0.15s ease;"></div>

  <!-- clock -->
  <div id="clock-area">
    <span class="clock-date">12月31日</span>
    <span class="clock-time" id="clock-display">23:58:00</span>
  </div>

  <!-- controls -->
  <div id="controls-area">
    <button id="play-btn" aria-label="播放倒计时">&#9654;</button>
    <input type="range" id="time-slider" min="0" max="120" step="0.01" value="0" aria-label="时间进度">
    <span id="time-slider-label">+0.0s</span>
  </div>

  <!-- info panel -->
  <div id="info-panel"></div>

  <!-- timeline -->
  <div id="timeline-area">
    <div class="timeline-track"></div>
    <div class="timeline-fill" id="timeline-fill" style="width:0%"></div>
    <div class="timeline-ends">
      <span>23:58</span>
      <span>00:00</span>
    </div>
    <div id="pos-bar" style="left:60px"></div>
    <!-- event markers injected by JS -->
  </div>

  <!-- legend -->
  <div id="legend-area"></div>
  <div id="legend-note">&#8592; 364 天 23 小时 58 分钟里没有任何人类事件</div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  'use strict';

  var K = Lec.K;
  var P = Lec.P;

  Lec.mount({
    index: 12,
    kicker: '深时之末',
    title: '文明，全在午夜前',
    take: '农业、文字、工业、登月，全挤在一年里的最后几分钟。'
  });

  /* ── constants ── */
  var SECS_IN_YEAR = 365 * 86400;
  var AXIS_DURATION = 120;
  var EARTH_AGE = K.EARTH_AGE_YEARS;

  function secondsBeforeMidnight(yearsAgo) {
    return (yearsAgo / EARTH_AGE) * SECS_IN_YEAR;
  }

  /* ── event data ── */
  var writingYears = 5500;
  var spaceAgeYearsAgo = K.CURRENT_YEAR - K.SPACE_AGE_START_CE;

  var events = [
    { id: 'agriculture', name: '农业', yearsAgo: K.AGRICULTURE_START_YEARS, icon: 'wheat' },
    { id: 'writing',     name: '文字', yearsAgo: writingYears,              icon: 'tablet' },
    { id: 'industry',    name: '工业', yearsAgo: K.INDUSTRIAL_REVOLUTION_YEARS, icon: 'gear' },
    { id: 'space',       name: '登月', yearsAgo: spaceAgeYearsAgo,          icon: 'lander' }
  ];

  events.forEach(function(ev) {
    ev.secsBeforeMidnight = secondsBeforeMidnight(ev.yearsAgo);
    ev.axisPos = ((AXIS_DURATION - ev.secsBeforeMidnight) / AXIS_DURATION) * 100;
    ev.threshold = AXIS_DURATION - ev.secsBeforeMidnight;
    ev.desc = ev.yearsAgo.toLocaleString() + ' 年前';
  });

  /* ── SVG icons ── */
  var icons = {
    wheat: '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M11 20V8"/><path d="M11 8c-2.5-1.8-5-0.8-5-0.8s1.8-2.5 5-2.5 5 2.5 5 2.5-2.5-1-5 0.8z"/><path d="M11 12c-2-1.2-4-0.2-4-0.2s1.2-2 4-2 4 2 4 2-2-0.8-4 0.2z"/><path d="M11 15.5c-1.5-0.8-3 0-3 0s0.8-1.5 3-1.5 3 1.5 3 1.5-1.5-0.8-3 0z"/></svg>',
    tablet: '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="4" y="3" width="14" height="16" rx="1"/><path d="M7 7h8M7 10.5h5.5M7 14h3"/></svg>',
    gear: '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="4"/><path d="M11 1v2.5M11 18.5V21M1 11h2.5M18.5 11H21M4.4 4.4l1.77 1.77M15.83 15.83l1.77 1.77M4.4 17.6l1.77-1.77M15.83 6.17l1.77-1.77"/></svg>',
    lander: '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2v9"/><polygon points="6,11 16,11 14.5,17 7.5,17"/><line x1="7.5" y1="17" x2="6" y2="20"/><line x1="14.5" y1="17" x2="16" y2="20"/><line x1="11" y1="17" x2="11" y2="20"/></svg>'
  };

  /* ── build event markers on axis (dots + icons only) ── */
  var timelineArea = document.getElementById('timeline-area');
  events.forEach(function(ev) {
    var el = document.createElement('div');
    el.className = 'event-marker';
    el.id = 'ev-' + ev.id;
    el.style.left = ev.axisPos + '%';
    el.innerHTML =
      '<div class="icon">' + icons[ev.icon] + '</div>' +
      '<div class="dot"></div>';
    timelineArea.appendChild(el);
  });

  /* ── build legend ── */
  var legendArea = document.getElementById('legend-area');
  events.forEach(function(ev) {
    var el = document.createElement('span');
    el.className = 'legend-item';
    el.id = 'leg-' + ev.id;
    el.innerHTML =
      '<span class="li-dot"></span>' +
      '<span class="icon" style="width:16px;height:16px;display:inline-flex;vertical-align:middle">' + icons[ev.icon] + '</span>' +
      ev.name;
    legendArea.appendChild(el);
  });

  /* ── DOM refs ── */
  var clockDisplay = document.getElementById('clock-display');
  var slider = document.getElementById('time-slider');
  var playBtn = document.getElementById('play-btn');
  var sliderLabel = document.getElementById('time-slider-label');
  var posBar = document.getElementById('pos-bar');
  var timelineFill = document.getElementById('timeline-fill');
  var flashOverlay = document.getElementById('flash-overlay');
  var infoPanel = document.getElementById('info-panel');

  /* ── state ── */
  var playing = false;
  var animStop = null;
  var currentValue = 0;
  var hasFlashed = false;
  var lastActiveId = null;

  /* ── format time ── */
  function formatTime(seconds) {
    var total = 23 * 3600 + 58 * 60 + seconds;
    var h = Math.floor(total / 3600) % 24;
    var m = Math.floor((total % 3600) / 60);
    var s = Math.floor(total % 60);
    return String(h).padStart(2, '0') + ':' +
           String(m).padStart(2, '0') + ':' +
           String(s).padStart(2, '0');
  }

  /* ── update ── */
  function update(val) {
    currentValue = P.clamp(val, 0, AXIS_DURATION);
    slider.value = currentValue;

    // clock
    clockDisplay.textContent = formatTime(currentValue);

    // slider label
    sliderLabel.textContent = '+' + currentValue.toFixed(1) + 's';

    // position bar
    var pct = (currentValue / AXIS_DURATION) * 100;
    posBar.style.left = 'calc(60px + ' + pct + '% * (100% - 120px))';
    timelineFill.style.width = pct + '%';

    // events & legend
    var activeEvents = [];
    var lastActive = null;
    events.forEach(function(ev) {
      var el = document.getElementById('ev-' + ev.id);
      var leg = document.getElementById('leg-' + ev.id);
      var isActive = currentValue >= ev.threshold;
      el.classList.toggle('active', isActive);
      leg.classList.toggle('active', isActive);
      if (isActive) {
        activeEvents.push(ev);
        lastActive = ev;
      }
    });

    // info panel: show last activated event
    if (lastActive && lastActive.id !== lastActiveId) {
      lastActiveId = lastActive.id;
      infoPanel.innerHTML =
        '<span class="info-icon">' + icons[lastActive.icon] + '</span>' +
        '<span class="info-name">' + lastActive.name + '</span>' +
        '<span class="info-divider"></span>' +
        '<span class="info-desc">' + lastActive.desc + '</span>';
      infoPanel.classList.add('show');
    } else if (!lastActive && lastActiveId !== null) {
      lastActiveId = null;
      infoPanel.classList.remove('show');
    }

    // flash at midnight
    if (currentValue >= AXIS_DURATION - 0.01 && !hasFlashed) {
      hasFlashed = true;
      flashOverlay.style.opacity = '0.85';
      setTimeout(function() { flashOverlay.style.opacity = '0'; }, 400);
    }
    if (currentValue < AXIS_DURATION - 0.5) {
      hasFlashed = false;
    }
  }

  /* ── slider ── */
  slider.addEventListener('input', function() {
    if (playing) stop();
    update(parseFloat(this.value));
  });

  /* ── play/pause ── */
  function play() {
    if (playing) return;
    playing = true;
    playBtn.innerHTML = '&#9208;';
    playBtn.classList.add('playing');
    animStop = Deck.loop(function(t, dt) {
      var newVal = currentValue + dt * 12;
      if (newVal >= AXIS_DURATION) {
        update(AXIS_DURATION);
        stop();
        return;
      }
      update(newVal);
    });
  }

  function stop() {
    playing = false;
    playBtn.innerHTML = '&#9654;';
    playBtn.classList.remove('playing');
    if (animStop) { animStop(); animStop = null; }
  }

  playBtn.addEventListener('click', function() {
    if (playing) { stop(); return; }
    if (currentValue >= AXIS_DURATION - 0.01) update(0);
    play();
  });

  slider.addEventListener('keydown', function(e) {
    if (e.key === ' ') { e.preventDefault(); playBtn.click(); }
  });

  /* ── init ── */
  update(0);
})();
</script>
</body>
</html>
