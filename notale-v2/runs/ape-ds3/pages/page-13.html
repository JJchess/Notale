<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* === page-13: lineage map — enumeration === */
.p13 {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 0 var(--space-7);
}

/* Full-width horizontal lineage line */
.p13::before {
  content: '';
  position: absolute;
  left: var(--space-7);
  right: var(--space-7);
  top: 50%;
  height: 2px;
  background: var(--muted);
  opacity: 0.3;
  transform: translateY(-50%);
  pointer-events: none;
}

.p13-title {
  text-align: center;
  margin-bottom: var(--space-7);
}

.p13-kicker {
  font-size: var(--fs-label);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent);
  margin-bottom: var(--space-2);
  line-height: var(--lh-label);
}

.p13-heading {
  font-size: var(--fs-h1);
  font-weight: 700;
  color: var(--text);
  margin: 0;
  line-height: var(--lh-h1);
}

/* Override k-enumeration grid → flex row for lineage layout */
.k-enumeration.p13-lineage {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  gap: 0;
  padding: 0;
  position: relative;
  z-index: 1;
}

/* Override .it card styling → transparent node */
.k-enumeration.p13-lineage > .it {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
  padding: 0;
  margin: 0;
  background: none;
  border: none;
  box-shadow: none;
  border-radius: 0;
  min-width: 60px;
}

.p13-node-label {
  font-size: var(--fs-h1);
  font-weight: 700;
  color: var(--text);
  line-height: 1;
  letter-spacing: 0.02em;
}

.p13-node-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--accent);
  flex: 0 0 auto;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 15%, transparent);
}

.p13-node-note {
  font-size: var(--fs-sec);
  color: var(--muted);
  text-align: center;
  line-height: var(--lh-sec);
  white-space: nowrap;
}
</style>
</head>
<body data-page="13" data-total="50">
<div id="stage">
<main id="main">
  <div class="p13">
    <div class="p13-title">
      <div class="p13-kicker">演化章</div>
      <h1 class="p13-heading">沿一条谱系走：树、脚、脑、文化</h1>
    </div>
    <div class="k-enumeration p13-lineage">
      <div class="it p13-node">
        <span class="p13-node-label">树</span>
        <span class="p13-node-dot" role="presentation"></span>
        <span class="p13-node-note">从树上开始</span>
      </div>
      <div class="it p13-node">
        <span class="p13-node-label">脚</span>
        <span class="p13-node-dot" role="presentation"></span>
        <span class="p13-node-note">站起来，定了方向</span>
      </div>
      <div class="it p13-node">
        <span class="p13-node-label">脑</span>
        <span class="p13-node-dot" role="presentation"></span>
        <span class="p13-node-note">变大，重新接线</span>
      </div>
      <div class="it p13-node">
        <span class="p13-node-label">文化</span>
        <span class="p13-node-dot" role="presentation"></span>
        <span class="p13-node-note">超出基因的传递</span>
      </div>
    </div>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 13,
  kicker: "演化章",
  title: "沿一条谱系走：树、脚、脑、文化",
  take: "演化是一段谱系，不是四个独立题目"
});
</script>
</body>
</html>
