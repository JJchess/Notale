<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* page-14 specific: dark canvas with tree visualization */
[data-page="14"] #main {
  position: relative;
  overflow: hidden;
}

#tree-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* ── Tree node text ── */
.tree-label {
  fill: var(--text);
  font-family: var(--font-sans);
}
.tree-label.name {
  font-size: 18px;
  font-weight: 700;
}
.tree-label.sub {
  font-size: 15px;
  fill: var(--muted);
}

/* ── Links ── */
.tree-link {
  fill: none;
  stroke-width: 2.5;
  stroke-linecap: round;
}
.tree-link.extant {
  stroke: var(--success);
}
.tree-link.extinct {
  stroke: var(--muted);
  stroke-dasharray: 5 4;
  stroke-width: 2;
}
.tree-link.dim {
  opacity: 0.15;
}

/* ── Gray cluster branches ── */
.gray-branch {
  stroke: var(--muted);
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
}

/* ── Legend ── */
#legend {
  position: absolute;
  bottom: 14px;
  left: 24px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 15px;
  color: var(--text);
  pointer-events: none;
  z-index: 5;
}
#legend .row {
  display: flex;
  align-items: center;
  gap: 8px;
}
#legend .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
#legend .dot.green {
  background: var(--success);
  box-shadow: 0 0 6px var(--success);
}
#legend .dot.gray {
  background: var(--muted);
}
#legend .dash {
  width: 22px;
  height: 0;
  flex-shrink: 0;
  border-top: 2px dashed var(--muted);
}
#legend .lock {
  width: 14px;
  height: 14px;
  border: 2px dashed var(--muted);
  border-radius: 2px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: var(--muted);
  line-height: 1;
}

/* ── Counter ── */
#counter {
  position: absolute;
  bottom: 14px;
  right: 24px;
  text-align: right;
  pointer-events: none;
  z-index: 5;
}
#counter .big {
  font-size: 22px;
  font-weight: 700;
  color: var(--success);
  line-height: 1.3;
}
#counter .sub {
  font-size: 15px;
  color: var(--muted);
  line-height: 1.4;
}

/* ── Controls ── */
#tree-ctls {
  position: absolute;
  top: 10px;
  right: 24px;
  display: flex;
  gap: 8px;
  z-index: 10;
}
#tree-ctls button {
  font-family: var(--font-sans);
  font-size: 15px;
  padding: 5px 14px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.08);
  border-radius: 4px;
  cursor: pointer;
  color: var(--text);
  transition: background 0.2s, border-color 0.2s;
}
#tree-ctls button:hover {
  background: rgba(255,255,255,0.15);
  border-color: var(--accent);
  color: var(--accent);
}

/* ── Click hint ── */
#click-hint {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, 64px);
  font-size: 16px;
  color: var(--muted);
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.5s;
  z-index: 5;
}
#click-hint.show {
  opacity: 1;
}

/* ── Tooltip ── */
#gray-tip {
  position: absolute;
  padding: 6px 14px;
  background: rgba(0,0,0,0.85);
  border: 1px solid var(--line);
  border-radius: 4px;
  font-size: 15px;
  color: var(--text);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 20;
  white-space: nowrap;
}
#gray-tip.show {
  opacity: 1;
}
</style>
</head>
<body data-page="14" data-total="50">
<div id="stage">
<main id="main">
  <svg id="tree-svg"></svg>

  <div id="legend">
    <div class="row">
      <span class="dot green"></span>
      <span>现在还活着</span>
    </div>
    <div class="row">
      <span class="dash"></span>
      <span>已经灭绝</span>
    </div>
    <div class="row">
      <span class="lock">🔒</span>
      <span>后面的页面展开</span>
    </div>
  </div>

  <div id="counter">
    <div class="big" id="count-num">现存 0 属</div>
    <div class="sub">其余分支都已经走到尽头</div>
  </div>

  <div id="tree-ctls">
    <button id="btn-expand">全部展开</button>
    <button id="btn-collapse">收回主干</button>
  </div>

  <div id="click-hint">点击，让这棵树继续长</div>
  <div id="gray-tip"></div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function() {
  'use strict';

  // ── 1. Register tree data ──
  if (!Lec.K.HOMINIDAE_TREE) {
    Lec.K.HOMINIDAE_TREE = {
      name: '人科',
      subtitle: 'Hominidae · 人类家族',
      children: [
        {
          name: '猩猩亚科',
          subtitle: 'Ponginae · 猩猩这一支',
          children: [
            { name: '猩猩属', subtitle: 'Pongo · 红毛猩猩', status: 'extant' },
            { name: '已灭绝旁支', subtitle: '若干灭绝支 · 不展开', status: 'extinct', isGrayCluster: true }
          ]
        },
        {
          name: '人亚科',
          subtitle: 'Homininae · 人这一支',
          children: [
            { name: '大猩猩属', subtitle: 'Gorilla · 非洲', status: 'extant' },
            { name: '黑猩猩属', subtitle: 'Pan · 非洲', status: 'extant' },
            { name: '人属', subtitle: 'Homo · 唯一现存种是智人', status: 'extant' },
            { name: '化石近亲', subtitle: '若干化石近亲 · p15 展开', status: 'extinct', isGrayCluster: true }
          ]
        }
      ]
    };
  }

  // ── 2. Mount page ──
  Lec.mount({
    index: 14,
    kicker: '演化 · 谱系',
    title: '一棵几乎枯死的树',
    take: '人科不是阶梯，是一棵不断分叉、几乎全部枯死的树。'
  });

  // ── 3. SVG setup ──
  var W = 1408, H = 620;
  var svg = d3.select('#tree-svg')
    .attr('viewBox', '0 0 ' + W + ' ' + H)
    .attr('role', 'img')
    .attr('aria-label', '人科分类树状图：绿点表示现存物种，灰色断枝表示已灭绝分支');

  var MARGIN = { top: 44, right: 40, bottom: 48, left: 40 };
  var innerW = W - MARGIN.left - MARGIN.right;
  var innerH = H - MARGIN.top - MARGIN.bottom;

  var g = svg.append('g')
    .attr('transform', 'translate(' + MARGIN.left + ',' + MARGIN.top + ')');

  // ── 4. Tree data & layout ──
  var raw = Lec.K.HOMINIDAE_TREE;
  var root = d3.hierarchy(raw);

  // Horizontal tree: swap size so y is horizontal, x is vertical
  var layout = d3.tree()
    .size([innerH * 0.82, innerW * 0.78])
    .separation(function(a, b) {
      return (a.parent === b.parent) ? 1.6 : 2.8;
    });

  layout(root);

  // Offset so tree is centered
  root.each(function(d) {
    d.y = d.y + 120;
    d.x = d.x + 50;
  });

  // ── 5. State ──
  root.each(function(d) {
    d._visible = (d.depth === 0);
    d._expanded = false;
    d._sourcePos = { x: (d.parent ? d.parent.x : d.x), y: (d.parent ? d.parent.y : 120) };
  });
  root._sourcePos = { x: root.x, y: 120 };

  var highlightLeaf = null;

  // ── 6. Helpers ──

  function countExtant() {
    var n = 0;
    root.each(function(d) {
      if (d.depth === 2 && d.data.status === 'extant') n++;
    });
    return n;
  }

  function updateCounter() {
    d3.select('#count-num').text('现存 ' + countExtant() + ' 属');
  }

  function getVisible() {
    var nodes = [], links = [];
    root.each(function(d) {
      if (d._visible) nodes.push(d);
      if (d.parent && d._visible && d.parent._visible) {
        links.push({ source: d.parent, target: d });
      }
    });
    return { nodes: nodes, links: links };
  }

  function isOnPath(node, leaf) {
    if (!leaf || !node) return false;
    var d = leaf;
    while (d) {
      if (d === node) return true;
      d = d.parent;
    }
    return false;
  }

  function getOpacity(node) {
    if (!highlightLeaf) return 1;
    if (node === highlightLeaf) return 1;
    if (isOnPath(node, highlightLeaf)) return 1;
    // Check if node is an ancestor of the highlighted leaf
    var d = highlightLeaf;
    while (d) {
      if (d === node) return 1;
      d = d.parent;
    }
    return 0.15;
  }

  // ── 7. Render ──

  // Persistent groups
  var linkG = g.append('g').attr('class', 'link-group');
  var nodeG = g.append('g').attr('class', 'node-group');
  var clusterG = g.append('g').attr('class', 'cluster-group');

  function render() {
    var vis = getVisible();

    // ── Links ──
    var linkSel = linkG.selectAll('path.tree-link')
      .data(vis.links, function(d) { return d.target.data.name; });

    linkSel.exit()
      .transition().duration(200)
      .attrTween('d', function() {
        var d = this.__data__;
        return function(t) {
          var sx = d.source.y, sy = d.source.x;
          var ex = d3.interpolate(d.source.y, d.target._sourcePos.y)(t);
          var ey = d3.interpolate(d.source.x, d.target._sourcePos.x)(t);
          return 'M' + sx + ',' + sy + 'C' + ((sx+ex)/2) + ',' + sy + ' ' + ((sx+ex)/2) + ',' + ey + ' ' + ex + ',' + ey;
        };
      })
      .style('opacity', 0)
      .remove();

    var linkEnter = linkSel.enter().append('path')
      .attr('class', function(d) {
        var cls = 'tree-link';
        if (d.target.data.status === 'extinct' || d.target.data.isGrayCluster) {
          cls += ' extinct';
        } else {
          cls += ' extant';
        }
        return cls;
      })
      .attr('d', function(d) {
        var sx = d.source.y, sy = d.source.x;
        return 'M' + sx + ',' + sy + 'C' + ((sx+sx)/2) + ',' + sy + ' ' + ((sx+sx)/2) + ',' + sy + ' ' + sx + ',' + sy;
      })
      .style('opacity', 0);

    linkEnter.merge(linkSel)
      .transition().duration(350)
      .style('opacity', function(d) {
        return getOpacity(d.target);
      })
      .attrTween('d', function(d) {
        var sx = d.source.y, sy = d.source.x;
        var ex = d.target.y, ey = d.target.x;
        return function(t) {
          var cx = (sx+ex)/2, cy = (sy+ey)/2;
          var ex2 = d3.interpolate(sx, ex)(t);
          var ey2 = d3.interpolate(sy, ey)(t);
          return 'M' + sx + ',' + sy + 'C' + cx + ',' + d3.interpolate(sy, cy)(t) + ' ' + cx + ',' + d3.interpolate(cy, ey2)(t) + ' ' + ex2 + ',' + ey2;
        };
      });

    // ── Nodes ──
    var nodeSel = nodeG.selectAll('g.tree-node')
      .data(vis.nodes, function(d) { return d.data.name; });

    nodeSel.exit()
      .transition().duration(200)
      .style('opacity', 0)
      .remove();

    var nodeEnter = nodeSel.enter().append('g')
      .attr('class', 'tree-node')
      .attr('transform', function(d) { return 'translate(' + d._sourcePos.y + ',' + d._sourcePos.x + ')'; })
      .style('opacity', 0)
      .style('cursor', function(d) {
        if (d.data.isGrayCluster) return 'pointer';
        if (d.data.children) return 'pointer';
        return 'default';
      });

    // ── Root node (depth 0) ──
    nodeEnter.filter(function(d) { return d.depth === 0; })
      .each(function(d) {
        var el = d3.select(this);
        // Glow ring
        el.append('circle')
          .attr('r', 28)
          .attr('fill', 'none')
          .attr('stroke', 'var(--accent)')
          .attr('stroke-width', 2.5)
          .style('opacity', 0.5);
        // Solid ring
        el.append('circle')
          .attr('r', 22)
          .attr('fill', 'none')
          .attr('stroke', 'var(--accent)')
          .attr('stroke-width', 2);
        // Name
        el.append('text')
          .attr('class', 'tree-label name')
          .attr('text-anchor', 'middle')
          .attr('dy', '-0.25em')
          .attr('font-size', '18px')
          .text(d.data.name);
        // Subtitle
        el.append('text')
          .attr('class', 'tree-label sub')
          .attr('text-anchor', 'middle')
          .attr('dy', '1.15em')
          .attr('font-size', '15px')
          .text(d.data.subtitle);
      });

    // ── Internal nodes (depth 1) ──
    nodeEnter.filter(function(d) { return d.depth === 1; })
      .each(function(d) {
        var el = d3.select(this);
        // Invisible click target (≥32×32px)
        el.append('circle')
          .attr('r', 16)
          .attr('fill', 'transparent')
          .attr('stroke', 'none')
          .style('cursor', 'pointer')
          .style('pointer-events', 'all');
        // Dot
        el.append('circle')
          .attr('r', 9)
          .attr('fill', 'rgba(255,255,255,0.1)')
          .attr('stroke', 'var(--line)')
          .attr('stroke-width', 1.5)
          .style('pointer-events', 'none');
        // Name
        el.append('text')
          .attr('class', 'tree-label name')
          .attr('dx', 16)
          .attr('dy', '-0.25em')
          .attr('font-size', '18px')
          .style('pointer-events', 'none')
          .text(d.data.name);
        // Subtitle
        el.append('text')
          .attr('class', 'tree-label sub')
          .attr('dx', 16)
          .attr('dy', '1.15em')
          .attr('font-size', '15px')
          .style('pointer-events', 'none')
          .text(d.data.subtitle);
      });

    // ── Leaf nodes (depth 2, not gray cluster) ──
    nodeEnter.filter(function(d) { return d.depth === 2 && !d.data.isGrayCluster; })
      .each(function(d) {
        var el = d3.select(this);
        var isExtant = d.data.status === 'extant';
        // Status icon
        if (isExtant) {
          el.append('circle')
            .attr('r', 6)
            .attr('cx', -12)
            .attr('cy', 0)
            .style('fill', 'var(--success)')
            .style('filter', 'drop-shadow(0 0 4px var(--success))');
        } else {
          el.append('text')
            .attr('x', -12)
            .attr('y', 4)
            .attr('text-anchor', 'middle')
            .attr('font-size', '15px')
            .attr('fill', 'var(--muted)')
            .text('✕');
        }
        // Name
        el.append('text')
          .attr('class', 'tree-label name')
          .attr('dx', 4)
          .attr('dy', '-0.25em')
          .attr('font-size', '18px')
          .text(d.data.name);
        // Subtitle
        el.append('text')
          .attr('class', 'tree-label sub')
          .attr('dx', 4)
          .attr('dy', '1.15em')
          .attr('font-size', '15px')
          .text(d.data.subtitle);
      });

    // ── Gray cluster nodes ──
    nodeEnter.filter(function(d) { return d.data.isGrayCluster; })
      .each(function(d) {
        var el = d3.select(this);
        // Invisible click target (≥32×32px)
        el.append('circle')
          .attr('r', 16)
          .attr('fill', 'transparent')
          .attr('stroke', 'none')
          .style('cursor', 'pointer')
          .style('pointer-events', 'all');
        // Draw broken branch segments
        var nSegs = 5;
        for (var i = 0; i < nSegs; i++) {
          var angle = -0.55 + (i / (nSegs - 1)) * 1.1;
          var len = 16 + (i % 3) * 5;
          var ex = Math.cos(angle) * len;
          var ey = Math.sin(angle) * len - 3;
          var mx = ex * 0.55;
          var my = ey * 0.55;
          var bx = ex * 0.82 + (i % 2 === 0 ? 2 : -2);
          var by = ey * 0.82 + (i % 2 === 0 ? -2 : 2);
          el.append('path')
            .attr('class', 'gray-branch')
            .attr('d', 'M0,0L' + mx + ',' + my + 'L' + bx + ',' + by + 'L' + ex + ',' + ey)
            .style('pointer-events', 'none');
        }
        // Label
        el.append('text')
          .attr('class', 'tree-label name')
          .attr('dx', 22)
          .attr('dy', '-0.25em')
          .attr('font-size', '18px')
          .style('fill', 'var(--muted)')
          .style('pointer-events', 'none')
          .text(d.data.name);
        el.append('text')
          .attr('class', 'tree-label sub')
          .attr('dx', 22)
          .attr('dy', '1.15em')
          .attr('font-size', '15px')
          .style('fill', 'var(--muted)')
          .style('pointer-events', 'none')
          .text(d.data.subtitle);
      });

    // ── Enter transition ──
    nodeEnter.transition()
      .duration(350)
      .style('opacity', 1)
      .attr('transform', function(d) { return 'translate(' + d.y + ',' + d.x + ')'; });

    // ── Update existing nodes ──
    nodeSel.merge(nodeEnter)
      .transition().duration(350)
      .attr('transform', function(d) { return 'translate(' + d.y + ',' + d.x + ')'; })
      .style('opacity', function(d) { return getOpacity(d); });

    // ── Events on enter ──
    nodeEnter.on('click', function(event, d) {
      event.stopPropagation();
      if (d.data.isGrayCluster) {
        var tip = d3.select('#gray-tip');
        tip.text('化石近亲留到下一页展开');
        var rect = document.getElementById('main').getBoundingClientRect();
        tip.style('left', (event.clientX - rect.left + 14) + 'px')
          .style('top', (event.clientY - rect.top - 24) + 'px')
          .classed('show', true);
        setTimeout(function() { tip.classed('show', false); }, 2000);
        return;
      }
      if (d.data.children) {
        toggleNode(d);
      }
    });

    nodeEnter.on('mouseenter', function(event, d) {
      if (d.depth >= 2 && !d.data.isGrayCluster) {
        highlightLeaf = d;
        render();
      }
    });

    nodeEnter.on('mouseleave', function() {
      highlightLeaf = null;
      render();
    });

    // ── Update legend/counter ──
    updateCounter();
    var hint = d3.select('#click-hint');
    hint.classed('show', vis.nodes.length <= 1);
  }

  // ── 8. Toggle node ──
  function toggleNode(d) {
    if (d._expanded) {
      // Collapse: hide all descendants
      (function hide(n) {
        if (n.children) {
          n.children.forEach(function(c) {
            c._visible = false;
            hide(c);
          });
        }
      })(d);
      d._expanded = false;
    } else {
      // Expand: show children
      if (d.children) {
        d.children.forEach(function(c) {
          c._visible = true;
          c._sourcePos = { x: d.x, y: d.y };
        });
      }
      d._expanded = true;
    }
    render();
  }

  // ── 9. Buttons ──
  d3.select('#btn-expand').on('click', function() {
    (function expandAll(n) {
      if (n.data.children) {
        if (!n.children) {
          // Children haven't been expanded yet; they're in the data
          // The hierarchy already has them from d3.hierarchy()
          // They just need to be made visible
        }
        n.children.forEach(function(c) {
          c._visible = true;
          c._sourcePos = { x: n.x, y: n.y };
          expandAll(c);
        });
        n._expanded = true;
      }
    })(root);
    render();
  });

  d3.select('#btn-collapse').on('click', function() {
    (function collapseAll(n) {
      if (n.children) {
        n.children.forEach(function(c) {
          c._visible = false;
          collapseAll(c);
        });
      }
      n._expanded = false;
    })(root);
    root._visible = true;
    render();
  });

  // ── 10. Initial render ──
  // The hierarchy from d3.hierarchy() has `children` arrays populated from the data
  // So all nodes exist in the tree, just not visible
  root._visible = true;
  render();

})();
</script>
</body>
</html>
