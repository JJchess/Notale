<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ========== page-15 specific ========== */
#main {
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
}

/* split-tb: top 7 / bottom 3 */
.top-svg {
  flex: 7;
  min-height: 0;
  position: relative;
  overflow: hidden;
}
.top-svg svg {
  display: block;
  width: 100%;
  height: 100%;
}
.bot-ctl {
  flex: 3;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 var(--space-5);
  gap: var(--space-3);
  border-top: 1px solid rgba(255,255,255,0.08);
}

/* slider row */
.slider-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.slider-row .label {
  font-size: var(--fs-label);
  color: var(--muted);
  flex-shrink: 0;
  white-space: nowrap;
}
.slider-row input[type="range"] {
  flex: 1;
  accent-color: #d4a017;
  height: 4px;
  cursor: pointer;
}

/* status row */
.status-row {
  display: flex;
  align-items: flex-start;
  gap: var(--space-4);
  flex-wrap: wrap;
  min-height: 48px;
}
.time-display {
  font-size: var(--fs-lead);
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  flex-shrink: 0;
  min-width: 160px;
}
.chips-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  flex: 1;
  min-width: 0;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: var(--fs-label);
  line-height: 1.4;
  white-space: nowrap;
}
.chip.main {
  background: rgba(212,160,23,0.2);
  color: #d4a017;
  border: 1px solid rgba(212,160,23,0.4);
}
.chip.side {
  background: rgba(107,123,141,0.2);
  color: #9bb0c4;
  border: 1px solid rgba(107,123,141,0.3);
}
.counts {
  font-size: var(--fs-label);
  color: var(--muted);
  white-space: nowrap;
  flex-shrink: 0;
  display: flex;
  gap: var(--space-3);
}
.counts .num {
  font-weight: 700;
  color: var(--text);
}
.counts .alive-num { color: #d4a017; }
.counts .dead-num { color: var(--muted); }

/* special state: only main line alive */
.status-row.only-main .chips-wrap .chip.side { display: none; }
.status-row.only-main {
  border: 2px solid rgba(180,60,40,0.6);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  background: rgba(180,60,40,0.08);
}
.only-main-msg {
  display: none;
  font-size: var(--fs-sec);
  font-weight: 700;
  color: #c05040;
  white-space: nowrap;
}
.status-row.only-main .only-main-msg {
  display: inline;
}

/* key text */
.key-text {
  font-size: var(--fs-sec);
  color: var(--muted);
  line-height: var(--lh-sec);
  text-align: center;
  padding: 0;
  margin: 0;
}

/* SVG elements */
.ref-line {
  stroke: rgba(255,255,255,0.7);
  stroke-width: 1;
  pointer-events: none;
}
.ref-label {
  fill: #e6e6e6;
  font-size: 14px;
  font-family: var(--font-sans);
  text-anchor: middle;
  dominant-baseline: hanging;
}
.main-line {
  stroke: #d4a017;
  stroke-width: 4;
  fill: none;
  stroke-linecap: round;
}
.branch-line {
  stroke: #6b7b8d;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
}
.branch-line.alive {
  stroke: #9bb0c4;
  stroke-width: 2.5;
}
.branch-line.dead {
  stroke: #4a5560;
  stroke-width: 1.5;
  opacity: 0.5;
}
.branch-name {
  fill: #9bb0c4;
  font-size: 14px;
  font-family: var(--font-sans);
}
.branch-name.dead {
  fill: #5a6a78;
  opacity: 0.6;
}
.extinct-mark {
  fill: #8a9aa8;
  font-size: 16px;
  font-family: var(--font-sans);
  font-weight: 700;
}
.extinct-mark.dead {
  fill: #5a6a78;
  opacity: 0.5;
}
.sapiens-node {
  fill: #d4a017;
  stroke: none;
}
.sapiens-label {
  fill: #d4a017;
  font-size: 14px;
  font-family: var(--font-sans);
  font-weight: 700;
}
.tick-label {
  fill: #6b7b8d;
  font-size: 13px;
  font-family: var(--font-sans);
  text-anchor: middle;
}
.tick-mark {
  stroke: #3a4350;
  stroke-width: 1;
}
</style>
</head>
<body data-page="15" data-total="50">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  // ===== mount header/footer =====
  Lec.mount({
    index: 15,
    kicker: "BRANCH",
    title: "我们的家族树，几乎全是枯枝",
    take: ""
  });

  var main = document.getElementById('main');
  if (!main) return;

  // ===== data =====
  var DIV_MYA = Lec.P.yearsToMillionYears(Lec.K.HOMININ_DIVERGENCE_YEARS); // 7

  // NOTE: The following MYA constants are not yet defined in Lec.K.
  // They use well-established scientific consensus values and would
  // ideally be migrated to Lec.K for consistency.
  var branches = [
    { id: 'main',    label: '人亚科主线',              start: DIV_MYA, end: 0,     main: true },
    { id: 'ardi',    label: '地猿 Ardipithecus',        start: 5.8,     end: 4.4,  main: false },
    { id: 'afaren',  label: '阿法南方古猿 A. afarensis', start: 3.9,     end: 2.9,  main: false },
    { id: 'paranth', label: '傍人 Paranthropus',         start: 2.7,     end: 1.2,  main: false },
    { id: 'habilis', label: '能人 H. habilis',           start: 2.4,     end: 1.5,  main: false },
    { id: 'erectus', label: '直立人 H. erectus',         start: 2.0,     end: 0.1,  main: false },
    { id: 'neander', label: '尼安德特人 H. neanderthalensis', start: 0.4, end: 0.04, main: false },
    { id: 'denisov', label: '丹尼索瓦人 Denisovan',      start: 0.3,     end: 0.04, main: false },
    { id: 'flores',  label: '佛罗勒斯人 H. floresiensis', start: 0.1,    end: 0.05, main: false },
    { id: 'luzon',   label: '吕宋人 H. luzonensis',      start: 0.05,   end: 0.05, main: false }
  ];

  // sapiens node: from Lec.K
  var SAPIENS_MYA = Lec.P.yearsToMillionYears(Lec.K.HOMO_SAPIENS_YEARS); // 0.3

  // ===== SVG geometry =====
  var SVG_W = 1000, SVG_H = 400;
  var MARGIN_L = 50, MARGIN_R = 50;
  var PLOT_L = MARGIN_L, PLOT_R = SVG_W - MARGIN_R; // 50, 950
  var PLOT_W = PLOT_R - PLOT_L; // 900
  var MAIN_Y = 200;

  // y offsets for side branches (4 above, 5 below)
  var branchY = {
    'ardi':   150,
    'afaren': 120,
    'paranth': 90,
    'habilis': 60,
    'erectus': 250,
    'neander': 280,
    'denisov': 310,
    'flores':  340,
    'luzon':   370
  };

  function myaToX(mya) {
    // mya: 7 ... 0  →  x: 50 ... 950
    var t = 1 - mya / DIV_MYA;
    return PLOT_L + t * PLOT_W;
  }

  // ===== build SVG =====
  function buildSVG() {
    var svg = '<svg viewBox="0 0 ' + SVG_W + ' ' + SVG_H + '" xmlns="http://www.w3.org/2000/svg">';

    // background grid ticks
    var tickInterval = 1; // 1 MYA
    for (var mya = 0; mya <= DIV_MYA; mya += tickInterval) {
      var x = myaToX(mya);
      svg += '<line class="tick-mark" x1="' + x + '" y1="190" x2="' + x + '" y2="210"/>';
      var label = mya === 0 ? '0 (现在)' : mya + ' 百万年前';
      svg += '<text class="tick-label" x="' + x + '" y="225">' + label + '</text>';
    }

    // main line
    var mainX1 = myaToX(DIV_MYA);
    var mainX2 = myaToX(0);
    svg += '<line class="main-line" x1="' + mainX1 + '" y1="' + MAIN_Y + '" x2="' + mainX2 + '" y2="' + MAIN_Y + '"/>';

    // sapiens node
    var sapX = myaToX(SAPIENS_MYA);
    svg += '<circle class="sapiens-node" cx="' + sapX + '" cy="' + MAIN_Y + '" r="6"/>';
    svg += '<text class="sapiens-label" x="' + (sapX + 10) + '" y="' + (MAIN_Y - 10) + '">智人</text>';

    // side branches (lines and labels)
    for (var i = 0; i < branches.length; i++) {
      var b = branches[i];
      if (b.main) continue;
      var y = branchY[b.id];
      var xStart = myaToX(b.start);
      var xEnd = myaToX(b.end);
      var xMid = (xStart + xEnd) / 2;

      // branch line from main line
      svg += '<line class="branch-line" id="bl-' + b.id + '" x1="' + xStart + '" y1="' + MAIN_Y + '" x2="' + xEnd + '" y2="' + y + '"/>';

      // label: place at midpoint x, above (upper) or below (lower) line
      var labelY = y < MAIN_Y ? (y - 8) : (y + 16);
      svg += '<text class="branch-name" id="bn-' + b.id + '" x="' + xMid + '" y="' + labelY + '" text-anchor="middle">' + b.label + '</text>';

      // extinct mark × at end of line
      svg += '<text class="extinct-mark" id="ex-' + b.id + '" x="' + xEnd + '" y="' + (y + 5) + '" text-anchor="middle">×</text>';
    }

    // reference line (will be updated by JS)
    svg += '<line class="ref-line" id="ref-line" x1="' + mainX2 + '" y1="0" x2="' + mainX2 + '" y2="' + SVG_H + '"/>';
    svg += '<text class="ref-label" id="ref-label" x="' + mainX2 + '" y="12">现在</text>';

    svg += '</svg>';
    return svg;
  }

  // ===== build HTML =====
  main.innerHTML =
    '<div class="top-svg">' +
      buildSVG() +
    '</div>' +
    '<div class="bot-ctl">' +
      '<div class="slider-row">' +
        '<span class="label">' + Lec.P.round(DIV_MYA, 0) + ' 百万年前</span>' +
        '<input type="range" id="time-slider" min="0" max="' + DIV_MYA + '" step="0.01" value="' + DIV_MYA + '">' +
        '<span class="label">现在</span>' +
      '</div>' +
      '<div class="status-row" id="status-row">' +
        '<span class="time-display" id="time-display">距今 ' + Lec.P.round(DIV_MYA, 1) + ' 百万年前</span>' +
        '<span class="only-main-msg" id="only-main-msg">这一刻，只有我们。</span>' +
        '<div class="chips-wrap" id="chips-wrap"></div>' +
        '<div class="counts" id="counts">' +
          '<span>存活: <span class="num alive-num" id="alive-count">1</span></span>' +
          '<span>已灭绝: <span class="num dead-num" id="dead-count">0</span></span>' +
        '</div>' +
      '</div>' +
      '<p class="key-text">我们的祖先旁边，曾经长出过九条已知的旁枝。没有一条活到今天。</p>' +
      '<p class="key-text">「我们这边」不是赢家，是唯一没灭绝的。灭绝是常态，存在是意外。</p>' +
    '</div>';

  // ===== slider interaction =====
  var slider = document.getElementById('time-slider');
  var refLine = document.getElementById('ref-line');
  var refLabel = document.getElementById('ref-label');
  var timeDisplay = document.getElementById('time-display');
  var chipsWrap = document.getElementById('chips-wrap');
  var aliveCount = document.getElementById('alive-count');
  var deadCount = document.getElementById('dead-count');
  var statusRow = document.getElementById('status-row');
  var onlyMainMsg = document.getElementById('only-main-msg');

  function update(timeMYA) {
    // reference line position
    var x = myaToX(timeMYA);
    refLine.setAttribute('x1', x);
    refLine.setAttribute('x2', x);
    refLabel.setAttribute('x', x);
    if (timeMYA <= 0.01) {
      refLabel.textContent = '现在';
    } else {
      refLabel.textContent = '距今 ' + Lec.P.round(timeMYA, 1) + ' 百万年';
    }

    // time display
    if (timeMYA <= 0.01) {
      timeDisplay.textContent = '现在';
    } else {
      timeDisplay.textContent = '距今 ' + Lec.P.round(timeMYA, 1) + ' 百万年前';
    }

    // determine alive branches
    var alive = [];
    var dead = [];
    for (var i = 0; i < branches.length; i++) {
      var b = branches[i];
      var isAlive = (timeMYA >= b.end && timeMYA <= b.start);
      if (isAlive) {
        alive.push(b);
      } else {
        dead.push(b);
      }

      // update SVG visual state
      if (!b.main) {
        var bl = document.getElementById('bl-' + b.id);
        var bn = document.getElementById('bn-' + b.id);
        var ex = document.getElementById('ex-' + b.id);
        if (bl) {
          bl.setAttribute('class', 'branch-line' + (isAlive ? ' alive' : ' dead'));
        }
        if (bn) {
          bn.setAttribute('class', 'branch-name' + (isAlive ? '' : ' dead'));
        }
        if (ex) {
          ex.setAttribute('class', 'extinct-mark' + (isAlive ? '' : ' dead'));
        }
      }
    }

    // update chips
    chipsWrap.innerHTML = '';
    for (var j = 0; j < alive.length; j++) {
      var b = alive[j];
      var chip = document.createElement('span');
      chip.className = 'chip' + (b.main ? ' main' : ' side');
      chip.textContent = b.label;
      chipsWrap.appendChild(chip);
    }

    // counts
    aliveCount.textContent = alive.length;
    deadCount.textContent = dead.length;

    // special state: only main line alive
    if (alive.length === 1 && alive[0].main) {
      statusRow.classList.add('only-main');
    } else {
      statusRow.classList.remove('only-main');
    }
  }

  slider.addEventListener('input', function() {
    var val = parseFloat(this.value);
    // slider goes 0 (present) to 7 (ancient) in HTML
    // but we want: left=ancient, right=present
    // So: timeMYA = DIV_MYA - val
    var timeMYA = DIV_MYA - val;
    update(timeMYA);
  });

  // initial state
  update(DIV_MYA);
})();
</script>
</body>
</html>
