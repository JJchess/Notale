<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== page-16 local overrides ===== */
#main {
  display: flex;
  flex-direction: column;
  gap: 0;
  padding: 0;
}
#main > .content-row {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  gap: var(--space-4);
  flex: 1;
  min-height: 0;
  padding: 0 var(--space-4);
}
/* left column: Konva skeleton */
#main > .content-row > .left {
  flex: 0 0 460px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  min-width: 0;
}
#main > .content-row > .left #skeleton-stage {
  width: 100%;
  height: 460px;
  position: relative;
}
#main > .content-row > .left #skeleton-stage canvas {
  display: block;
}
/* right column: timeline + info */
#main > .content-row > .right {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding-bottom: 2px;
  position: relative;
  overflow: hidden;
}
#main > .content-row > .right .timeline-wrap {
  padding: 0 0 0 0;
}
/* explanation text */
.explain {
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  margin-bottom: var(--space-4);
  padding: var(--space-3) var(--space-4);
  background: var(--accent-soft);
  border-radius: var(--radius-md);
  border-left: 4px solid var(--accent);
  flex-shrink: 0;
}
.explain strong {
  color: var(--accent);
}
/* timeline */
.timeline-wrap {
  position: relative;
  height: 90px;
  width: 100%;
  flex-shrink: 0;
}
.timeline-wrap .timeline-inner {
  position: absolute;
  left: 40px;
  right: 40px;
  top: 0;
  bottom: 0;
}
.timeline-axis {
  position: absolute;
  left: 0;
  right: 0;
  top: 36px;
  height: 3px;
  background: var(--line);
  border-radius: 2px;
}
.timeline-axis .fill {
  position: absolute;
  left: 0;
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.05s linear;
}
.timeline-marker {
  position: absolute;
  top: 24px;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 2;
}
.timeline-marker .dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--surface);
  border: 3px solid var(--accent);
  z-index: 1;
  flex-shrink: 0;
}
.timeline-marker .dot.active {
  background: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.timeline-marker .label {
  margin-top: 6px;
  font-size: var(--fs-label);
  line-height: var(--lh-label);
  color: var(--text);
  text-align: center;
  white-space: nowrap;
}
.timeline-marker .label .year {
  font-size: var(--fs-tick);
  color: var(--muted);
  display: block;
  text-align: center;
}
/* gap annotation */
.gap-anno {
  position: absolute;
  top: 0;
  transform: translateX(-50%);
  z-index: 3;
  pointer-events: none;
  transition: left 0.05s linear;
}
.gap-anno .gap-label {
  font-size: var(--fs-sec);
  font-weight: 700;
  color: var(--accent);
  background: var(--surface);
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 2px 10px;
  white-space: nowrap;
  box-shadow: var(--shadow-sm);
}
/* slider row */
.slider-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-5);
  flex-shrink: 0;
  border-top: 1px solid var(--line);
}
.slider-row .sl-label {
  font-size: var(--fs-label);
  color: var(--muted);
  white-space: nowrap;
  flex-shrink: 0;
}
.slider-row .sl-label .yr {
  font-size: var(--fs-tick);
  display: block;
  text-align: center;
}
.slider-row input[type="range"] {
  flex: 1;
  accent-color: var(--accent);
  height: 6px;
  cursor: pointer;
  min-width: 0;
}
.slider-row .cur-label {
  font-size: var(--fs-label);
  color: var(--accent);
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
  min-width: 80px;
  text-align: center;
}
/* comparison mini-table */
.cmp-mini {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  margin-bottom: var(--space-3);
  padding: var(--space-2) var(--space-3);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
  flex-shrink: 0;
}
.cmp-mini .cmp-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.cmp-mini .cmp-row .dim-label {
  flex: 0 0 70px;
  font-size: var(--fs-label);
  color: var(--muted);
  text-align: right;
}
.cmp-mini .cmp-row .dim-val {
  flex: 1;
  color: var(--text);
}
.cmp-mini .cmp-row .dim-val strong {
  color: var(--accent);
}
.cmp-mini .cmp-row .dim-val .mut {
  color: var(--muted);
  font-size: var(--fs-tick);
}
</style>
</head>
<body data-page="16" data-total="50">
<div id="stage">
<main id="main">
  <div class="content-row">
    <!-- left: Konva skeleton -->
    <div class="left min0">
      <div id="skeleton-stage"></div>
    </div>
    <!-- right: timeline + info -->
    <div class="right min0">
      <!-- explanation -->
      <div class="explain">
        双足行走比大脑增大早<strong>几百万年</strong>——这个物种先定了方向，才谈得上后来的一切。
      </div>
      <!-- comparison mini-table -->
      <div class="cmp-mini">
        <div class="cmp-row">
          <span class="dim-label">先驱</span>
          <span class="dim-val"><strong>双足行走</strong><span class="mut"> 约600万年前</span></span>
        </div>
        <div class="cmp-row">
          <span class="dim-label">后来者</span>
          <span class="dim-val">脑容量增大<span class="mut"> 约250万年前</span></span>
        </div>
        <div class="cmp-row" style="border-top:1px solid var(--line);padding-top:var(--space-2);margin-top:var(--space-1)">
          <span class="dim-label">领先</span>
          <span class="dim-val"><strong style="font-size:var(--fs-lead);color:var(--accent)" id="gap-display">约350万年</strong></span>
        </div>
      </div>
      <!-- timeline -->
      <div class="timeline-wrap" id="timeline-wrap">
        <div class="timeline-inner">
          <div class="timeline-axis">
            <div class="fill" id="axis-fill" style="width:0%"></div>
          </div>
          <!-- marker 1: split -->
          <div class="timeline-marker" id="m-split" style="left:0%">
            <div class="dot" id="dot-split"></div>
            <div class="label">
              人亚科分岔
              <span class="year">700万年前</span>
            </div>
          </div>
          <!-- marker 2: bipedalism -->
          <div class="timeline-marker" id="m-biped" style="left:22.2%">
            <div class="dot active" id="dot-biped"></div>
            <div class="label">
              双足行走
              <span class="year">600万年前</span>
            </div>
          </div>
          <!-- marker 3: brain expansion -->
          <div class="timeline-marker" id="m-brain" style="left:100%">
            <div class="dot" id="dot-brain"></div>
            <div class="label">
              脑容量增大
              <span class="year">250万年前</span>
            </div>
          </div>
          <!-- gap annotation -->
          <div class="gap-anno" id="gap-anno" style="left:22.2%">
            <div class="gap-label">领先约<strong id="gap-num">350</strong>万年</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- slider row -->
  <div class="slider-row">
    <span class="sl-label">700万年前<span class="yr">分岔</span></span>
    <input type="range" id="pose-slider" min="0" max="1" step="0.001" value="0">
    <span class="cur-label" id="cur-label">700万年前</span>
    <span class="sl-label">250万年前<span class="yr">脑容量增大</span></span>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/konva.min.js"></script>
<script>
Lec.mount({ index: 16, kicker: '演化 · 双足先行', title: '先站起来，方向就定了', take: '双足行走比大脑增大早几百万年——这个物种先定了方向，才谈得上后来的一切。' });

// ====== Constants ======
var SPLIT_YEARS = Lec.K.HOMININ_DIVERGENCE_YEARS;  // 7,000,000
var BIPED_YEARS = 6e6;
var BRAIN_YEARS = 2.5e6;

var GAP_YEARS = BIPED_YEARS - BRAIN_YEARS;
var GAP_MILLION = (GAP_YEARS / 1e6).toFixed(1);

document.getElementById('gap-display').textContent = '约' + GAP_MILLION + '万年';
document.getElementById('gap-num').textContent = GAP_MILLION;

var TOTAL_RANGE = SPLIT_YEARS - BRAIN_YEARS;  // 4.5 million years
var BIPED_FRAC = (SPLIT_YEARS - BIPED_YEARS) / TOTAL_RANGE;  // ~0.222

// ====== Konva Skeleton ======
var container = document.getElementById('skeleton-stage');
var cw = container.offsetWidth || 460;
var ch = 460;

var stage = new Konva.Stage({
  container: 'skeleton-stage',
  width: cw,
  height: ch,
});

var layer = new Konva.Layer({ listening: false });
stage.add(layer);

// Two poses: quadrupedal (t=0) and upright (t=1)
// Joint positions relative to hip center
var quad = {
  head: { x: 30, y: -35 },
  neck: { x: 10, y: -15 },
  shoulder: { x: 40, y: -115 },
  rib: { x: 30, y: -70 },
  hip: { x: 240, y: 280 },
  pelvis: { x: -30, y: 15 },
  elbow: { x: 70, y: 80 },
  hand: { x: 100, y: 200 },
  knee: { x: 60, y: 90 },
  foot: { x: 80, y: 165 },
};

var upr = {
  head: { x: 0, y: -35 },
  neck: { x: 0, y: -15 },
  shoulder: { x: 0, y: -120 },
  rib: { x: 0, y: -70 },
  hip: { x: 240, y: 280 },
  pelvis: { x: -20, y: 10 },
  elbow: { x: 0, y: 75 },
  hand: { x: 0, y: 150 },
  knee: { x: 0, y: 95 },
  foot: { x: 0, y: 165 },
};

function lerpPose(t) {
  var p = {};
  for (var key in quad) {
    if (key === 'hip') {
      p[key] = { x: quad[key].x, y: quad[key].y };
    } else {
      p[key] = {
        x: quad[key].x + (upr[key].x - quad[key].x) * t,
        y: quad[key].y + (upr[key].y - quad[key].y) * t,
      };
    }
  }
  return p;
}

function drawSkeleton(t) {
  layer.destroyChildren();

  var p = lerpPose(t);
  var hx = p.hip.x, hy = p.hip.y;

  var shoulder = { x: hx + p.shoulder.x, y: hy + p.shoulder.y };
  var neck = { x: shoulder.x + p.neck.x, y: shoulder.y + p.neck.y };
  var head = { x: neck.x + p.head.x, y: neck.y + p.head.y };
  var rib = { x: hx + p.rib.x, y: hy + p.rib.y };
  var pelvis = { x: hx + p.pelvis.x, y: hy + p.pelvis.y };
  var elbow = { x: shoulder.x + p.elbow.x, y: shoulder.y + p.elbow.y };
  var hand = { x: shoulder.x + p.hand.x, y: shoulder.y + p.hand.y };
  var knee = { x: hx + p.knee.x, y: hy + p.knee.y };
  var foot = { x: hx + p.foot.x, y: hy + p.foot.y };

  var col = '#e6e6e6';
  var lineOpts = { stroke: col, strokeWidth: 4, lineCap: 'round', lineJoin: 'round' };
  var jointOpts = { fill: col, radius: 5 };
  var jointSm = { fill: col, radius: 3.5 };

  // Spine
  layer.add(new Konva.Line({
    points: [neck.x, neck.y, shoulder.x, shoulder.y, hx, hy],
    stroke: col, strokeWidth: 5, lineCap: 'round', lineJoin: 'round'
  }));

  // Ribcage
  layer.add(new Konva.Ellipse({
    x: rib.x, y: rib.y,
    radiusX: 28, radiusY: 38,
    stroke: col, strokeWidth: 2.5,
    fill: 'transparent',
  }));

  // Pelvis
  layer.add(new Konva.Line({
    points: [hx, hy, pelvis.x, pelvis.y],
    stroke: col, strokeWidth: 5, lineCap: 'round'
  }));

  // Arms
  layer.add(new Konva.Line({
    points: [shoulder.x, shoulder.y, elbow.x, elbow.y],
    ...lineOpts
  }));
  layer.add(new Konva.Line({
    points: [elbow.x, elbow.y, hand.x, hand.y],
    stroke: col, strokeWidth: 3.5, lineCap: 'round'
  }));

  // Legs
  layer.add(new Konva.Line({
    points: [hx, hy, knee.x, knee.y],
    stroke: col, strokeWidth: 5, lineCap: 'round'
  }));
  layer.add(new Konva.Line({
    points: [knee.x, knee.y, foot.x, foot.y],
    stroke: col, strokeWidth: 4, lineCap: 'round'
  }));

  // Head
  layer.add(new Konva.Ellipse({
    x: head.x, y: head.y,
    radiusX: 18, radiusY: 24,
    stroke: col, strokeWidth: 3,
    fill: 'transparent',
  }));

  // Joints
  layer.add(new Konva.Circle({ x: shoulder.x, y: shoulder.y, ...jointOpts }));
  layer.add(new Konva.Circle({ x: hx, y: hy, ...jointOpts }));
  layer.add(new Konva.Circle({ x: elbow.x, y: elbow.y, ...jointSm }));
  layer.add(new Konva.Circle({ x: knee.x, y: knee.y, ...jointSm }));
  layer.add(new Konva.Circle({ x: hand.x, y: hand.y, radius: 4, fill: col }));
  layer.add(new Konva.Circle({ x: foot.x, y: foot.y, radius: 4, fill: col }));

  layer.batchDraw();
}

// ====== Slider ======
var slider = document.getElementById('pose-slider');
var curLabel = document.getElementById('cur-label');
var axisFill = document.getElementById('axis-fill');
var gapAnno = document.getElementById('gap-anno');
var dotBiped = document.getElementById('dot-biped');

function updatePose(val) {
  var v = parseFloat(val);

  // Skeleton interpolation
  var skelT;
  if (v <= BIPED_FRAC) {
    skelT = BIPED_FRAC > 0 ? v / BIPED_FRAC : 0;
  } else {
    skelT = 1;
  }
  drawSkeleton(skelT);

  axisFill.style.width = (v * 100) + '%';

  // Gap annotation: stays at biped marker or follows slider if past it
  var gapLeft = Math.max(v * 100, BIPED_FRAC * 100);
  gapAnno.style.left = gapLeft + '%';

  if (v >= BIPED_FRAC) {
    dotBiped.classList.add('active');
  } else {
    dotBiped.classList.remove('active');
  }

  var curYears = SPLIT_YEARS - v * TOTAL_RANGE;
  var curMya = Math.round(curYears / 1e4) / 100;
  if (curMya >= 1) {
    curLabel.textContent = curMya.toFixed(0) + '万年前';
  } else {
    curLabel.textContent = Math.round(curYears / 1e3) + '千年前';
  }
}

updatePose(0);

slider.addEventListener('input', function() {
  updatePose(this.value);
});

// ====== Resize ======
Deck.onResize(function() {
  var cw2 = container.offsetWidth || 460;
  if (cw2 > 0) {
    stage.width(cw2);
    stage.batchDraw();
    updatePose(slider.value);
  }
});
</script>
</body>
</html>
