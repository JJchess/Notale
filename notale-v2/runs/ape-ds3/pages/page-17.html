<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ── page-17: 从 400 到 1400 毫升 ── */
:root {
  --brain-slider-h: 200px;
  --col-svg-h: 64px;
}

#main {
  display: flex;
  flex-direction: column;
  padding: var(--space-4) var(--space-5) var(--space-3);
  gap: var(--space-3);
}

/* ── intro ── */
.intro {
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--text);
  margin: 0;
  flex-shrink: 0;
}

/* ── brain reveal slider ── */
.brain-slider {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.brain-slider__labels {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--space-2);
}

.brain-slider__label {
  font-size: var(--fs-label);
  color: var(--muted);
  font-weight: 600;
  flex-shrink: 0;
}

.brain-slider__reading {
  font-size: var(--fs-h2);
  font-weight: 700;
  color: var(--accent);
  text-align: center;
  min-width: 100px;
}

.brain-slider__reveal {
  position: relative;
  width: 100%;
  height: var(--brain-slider-h);
  overflow: hidden;
  isolation: isolate;
  contain: paint;
  background: transparent;
  margin: 0;
  cursor: crosshair;
  border-radius: var(--radius-md);
  border: 1px solid var(--line);
  flex-shrink: 0;
}

.brain-slider__reveal svg {
  display: block;
  width: 100%;
  height: 100%;
}

.brain-slider__reveal .reveal-base {
  position: relative;
  z-index: 0;
}

.brain-slider__reveal .reveal-overlay {
  position: absolute;
  z-index: 1;
  inset: 0;
  pointer-events: none;
  -webkit-mask-image: linear-gradient(
    to right,
    transparent 0%,
    transparent calc(var(--reveal-x, 50%) - 1px),
    black calc(var(--reveal-x, 50%) + 1px),
    black 100%
  );
  mask-image: linear-gradient(
    to right,
    transparent 0%,
    transparent calc(var(--reveal-x, 50%) - 1px),
    black calc(var(--reveal-x, 50%) + 1px),
    black 100%
  );
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  will-change: -webkit-mask-image, mask-image;
}

/* reveal line */
.brain-slider__reveal .reveal-line {
  position: absolute;
  z-index: 2;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--accent);
  pointer-events: none;
  transform: translateX(calc(var(--reveal-x, 50%) - 1px));
  opacity: 0.85;
  transition: opacity 0.15s;
}

.brain-slider__reveal .reveal-line.is-hidden {
  opacity: 0;
}

/* ── divider + heading ── */
.divider-head {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-shrink: 0;
}

.divider-head__line {
  flex: 1;
  height: 1px;
  background: var(--line);
}

.divider-head__text {
  font-size: var(--fs-lead);
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
}

/* ── three columns (triptych) ── */
.k-enumeration.triptych {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-4);
  flex: 1;
  min-height: 0;
}

.k-enumeration.triptych > .it {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: var(--space-3) var(--space-3);
  gap: var(--space-2);
  overflow: hidden;
}

.k-enumeration.triptych .it__title {
  font-size: var(--fs-h2);
  font-weight: 700;
  color: var(--text);
  line-height: var(--lh-h2);
  margin: 0;
}

.k-enumeration.triptych .it__svg {
  flex-shrink: 0;
  width: 100%;
  max-width: 260px;
  height: var(--col-svg-h);
  display: flex;
  align-items: center;
  justify-content: center;
}

.k-enumeration.triptych .it__svg svg {
  width: 100%;
  height: 100%;
}

.k-enumeration.triptych .it__desc {
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
  color: var(--text);
  margin: 0;
  max-width: 260px;
}

/* brain SVG styling */
.brain-svg-wrap {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.conclusion-note {
  margin: 0;
  border: none;
  text-align: center;
  font-size: var(--fs-body);
  color: var(--text);
  flex-shrink: 0;
}
</style>
</head>
<body data-page="17" data-total="50">

    </li>

  <p class="conclusion-note">看脑容量，永远要同时问组织方式。</p>

</main>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  'use strict';

  /* ── constants (from p17.md spec, not in Lec.K) ── */
  var EARLY_HOMO_ML = 400;
  var SAPIENS_ML = 1400;
  var EXPANSION_YEARS = 2000000;

  /* ── mount page header ── */
  Lec.mount({
    index: 17,
    kicker: 'EVOLUTION · BRAIN',
    title: '从 400 到 1400 毫升',
    take: '脑容量增加不是孤立的"变大"——它伴随着折叠加深、额叶扩大、连接变密。'
  });

  /* ── reveal-hover effect for brain slider ── */
  var revealEl = document.getElementById('brain-reveal');
  var overlay = revealEl.querySelector('.reveal-overlay');
  var lineEl = document.getElementById('reveal-line');
  var readingEl = document.getElementById('volume-reading');
  var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  if (!overlay) return;

  var state = {
    x: 0.5,           // normalized position 0-1
    targetX: 0.5,
    radius: 0,
    targetRadius: 0,
    inside: false,
    clientX: 0,
    clientY: 0,
    frame: 0
  };

  var readingTimeout = null;

  function updateReading(t) {
    var vol = Lec.P.lerp(EARLY_HOMO_ML, SAPIENS_ML, t);
    var rounded = Math.round(vol);
    readingEl.textContent = rounded + ' ml';
  }

  function updatePosition(t) {
    var pct = t * 100;
    revealEl.style.setProperty('--reveal-x', pct + '%');
    lineEl.style.transform = 'translateX(calc(' + pct + '% - 1px))';
    updateReading(t);
  }

  /* Eased tracking */
  var schedule = function() {
    if (!state.frame) state.frame = requestAnimationFrame(tick);
  };

  var tick = function() {
    state.frame = 0;

    var ease = reduceMotion.matches ? 1 : 0.12;
    state.x += (state.targetX - state.x) * ease;

    var pct = state.x * 100;
    revealEl.style.setProperty('--reveal-x', pct + '%');
    lineEl.style.transform = 'translateX(calc(' + pct + '% - 1px))';

    /* debounce reading update */
    if (readingTimeout) clearTimeout(readingTimeout);
    readingTimeout = setTimeout(function() {
      updateReading(state.x);
    }, 16);

    var unsettled = Math.abs(state.targetX - state.x) > 0.001;
    if (unsettled) schedule();
  };

  var getPos = function(clientX) {
    var rect = revealEl.getBoundingClientRect();
    var t = (clientX - rect.left) / rect.width;
    return Lec.P.clamp(t, 0, 1);
  };

  var onEnter = function(e) {
    state.inside = true;
    state.clientX = e.clientX;
    state.targetX = getPos(e.clientX);
    if (state.radius < 0.5) state.x = state.targetX;
    state.targetRadius = 1;
    lineEl.classList.remove('is-hidden');
    schedule();
  };

  var onMove = function(e) {
    state.clientX = e.clientX;
    state.targetX = getPos(e.clientX);
    if (!state.inside) {
      state.inside = true;
      if (state.radius < 0.5) state.x = state.targetX;
      state.targetRadius = 1;
      lineEl.classList.remove('is-hidden');
    }
    schedule();
  };

  var onLeave = function() {
    state.inside = false;
    state.targetRadius = 0;
    lineEl.classList.add('is-hidden');
    schedule();
  };

  var onBlur = function() {
    if (!state.inside) return;
    onLeave();
  };

  /* Initialize position at center */
  updatePosition(0.5);

  /* Only attach on fine pointer devices */
  if (finePointer.matches) {
    revealEl.addEventListener('pointerenter', onEnter);
    revealEl.addEventListener('pointermove', onMove);
    revealEl.addEventListener('pointerleave', onLeave);
    revealEl.addEventListener('pointercancel', onLeave);
    window.addEventListener('blur', onBlur);
  } else {
    /* Touch devices: show overlay at 50% by default */
    updatePosition(0.5);
    lineEl.classList.remove('is-hidden');
  }

  /* Resize handler */
  var onResize = function() {
    if (!state.inside) return;
    if (state.clientX !== undefined) {
      state.targetX = getPos(state.clientX);
      schedule();
    }
  };
  window.addEventListener('scroll', onResize, { passive: true });
  var ro = new ResizeObserver(onResize);
  ro.observe(revealEl);

})();
</script>
</body>
</html>
