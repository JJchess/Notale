<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ── page-specific overrides ── */
#main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── specimens row ── */
.specimens-row {
  display: grid;
  grid-template-columns: 130px 1fr 1fr;
  gap: var(--space-1);
  flex: 0 0 auto;
  padding: 0;
  margin-bottom: var(--space-1);
}
.specimen-spacer {
  /* aligns with k-comparison dim column */
}
.specimen-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-1);
  padding: var(--space-1) var(--space-3);
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  cursor: pointer;
  color: var(--text);
  font-family: inherit;
  transition: border-color .25s, box-shadow .25s, background .25s;
  min-height: 80px;
  position: relative;
  width: 100%;
}
.specimen-btn:hover {
  border-color: var(--accent);
}
.specimen-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.specimen-btn.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), var(--shadow-md);
  background: var(--accent-soft);
}
.specimen-silhouette {
  width: 48px;
  height: 54px;
  flex: 0 0 auto;
}
.specimen-name {
  font-size: var(--fs-h2);
  font-weight: 700;
  line-height: 1.2;
}
.specimen-hint {
  font-size: var(--fs-label);
  color: var(--muted);
  line-height: 1.3;
}
.specimen-btn.active .specimen-hint {
  color: var(--accent);
}

/* ── comparison grid tweaks ── */
.k-comparison {
  flex: 1 1 auto;
  min-height: 0;
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
}
.k-comparison > .hdr {
  text-align: center;
  text-transform: none;
  letter-spacing: .02em;
  font-size: var(--fs-body);
  font-weight: 700;
}
.k-comparison > .hdr:first-child {
  text-align: center;
  background: var(--accent-soft);
  font-size: var(--fs-label);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.k-comparison > .dim {
  text-align: right;
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--text);
  padding-right: var(--space-4);
  white-space: nowrap;
}
/* reduce cell padding to fit */
.k-comparison > .dim,
.k-comparison > .cell {
  padding-top: var(--space-2);
  padding-bottom: var(--space-2);
}
/* allow the grid to expand fully */
.k-comparison {
  overflow: visible;
  border-radius: var(--radius-md);
  /* clip border-radius via a pseudo-element trick isn't needed here */
}
/* evidence cells */
.k-comparison > .cell {
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .35s ease, transform .35s ease;
  pointer-events: none;
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
  color: var(--text);
  background: var(--surface);
}
.k-comparison > .cell.active {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
/* stagger delays per row */
.k-comparison > .cell[data-dim="0"] { transition-delay: 0s; }
.k-comparison > .cell[data-dim="1"] { transition-delay: .12s; }
.k-comparison > .cell[data-dim="2"] { transition-delay: .24s; }
.k-comparison > .cell[data-dim="3"] { transition-delay: .36s; }

/* ── takeaway bar ── */
.takeaway-bar {
  flex: 0 0 auto;
  padding: var(--space-2) 0 0 0;
  text-align: center;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.takeaway-main {
  font-size: var(--fs-lead);
  font-weight: 700;
  line-height: var(--lh-lead);
  color: var(--text);
}
.takeaway-sub {
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
  color: var(--muted);
  opacity: 0;
  transition: opacity .6s ease;
}
.takeaway-sub.visible {
  opacity: 1;
}
</style>
</head>
<body data-page="20" data-total="50">
<div id="stage">
<main id="main">

  <!-- Specimens row -->
  <div class="specimens-row">
    <div class="specimen-spacer"></div>
    <button class="specimen-btn" data-side="sapiens"
            aria-label="点选查看智人的文化证据">
      <svg class="specimen-silhouette" viewBox="0 0 80 90" fill="none" aria-hidden="true">
        <path d="M28,10 C30,4 38,2 44,4 C50,6 56,10 58,16
                 C60,22 60,28 58,34 C56,40 52,44 50,48
                 C48,52 48,56 50,60 C52,64 54,68 52,72
                 C50,76 46,78 42,78 C38,78 34,76 32,72
                 C30,68 28,64 28,60 C26,56 24,52 22,48
                 C20,44 18,40 16,36 C14,30 14,22 20,16 Z"
              fill="currentColor" opacity=".85"/>
        <!-- eye -->
        <circle cx="38" cy="30" r="2" fill="var(--surface)"/>
        <!-- chin highlight -->
        <path d="M48,72 C50,74 50,78 46,80" stroke="currentColor" stroke-width=".5" opacity=".5" fill="none"/>
      </svg>
      <span class="specimen-name">智人</span>
      <span class="specimen-hint">点选查看</span>
    </button>
    <button class="specimen-btn" data-side="neanderthal"
            aria-label="点选查看尼安德特人的文化证据">
      <svg class="specimen-silhouette" viewBox="0 0 80 90" fill="none" aria-hidden="true">
        <path d="M20,8 C22,2 30,1 38,3 C46,5 54,8 56,14
                 C58,20 58,28 56,34 C54,40 50,44 48,48
                 C46,52 46,56 48,60 C50,64 54,68 52,74
                 C50,78 46,82 42,84 C38,86 32,84 30,80
                 C28,76 26,72 26,68 C24,64 22,60 20,56
                 C18,52 16,48 14,42 C12,36 12,28 16,20
                 C14,16 14,12 18,8 Z"
              fill="currentColor" opacity=".85"/>
        <!-- brow ridge -->
        <path d="M28,22 C32,20 38,20 42,22" stroke="currentColor" stroke-width="1.5" opacity=".6" fill="none"/>
        <!-- eye -->
        <circle cx="36" cy="28" r="2" fill="var(--surface)"/>
      </svg>
      <span class="specimen-name">尼安德特人</span>
      <span class="specimen-hint">点选查看</span>
    </button>
  </div>

  <!-- Comparison grid: 文化维度 × 两个人群 -->
  <div class="k-comparison" style="--cmp-cols:2; --dim-w:130px;">
    <div class="hdr">文化维度</div>
    <div class="hdr sapiens-hdr">智人</div>
    <div class="hdr neanderthal-hdr">尼安德特人</div>

    <div class="dim">葬仪</div>
    <div class="cell sapiens" data-dim="0">有意识摆放遗体并随葬物品，可见固定葬式</div>
    <div class="cell neanderthal" data-dim="0">同样存在有意埋葬的个体，有摆放姿势与随葬痕迹</div>

    <div class="dim">符号与装饰</div>
    <div class="cell sapiens" data-dim="1">有贝壳珠、骨珠、赭石颜料，指向身份与群体标记</div>
    <div class="cell neanderthal" data-dim="1">有打磨骨片、赭石残留和带刻痕的物品，指向符号行为</div>

    <div class="dim">照护病弱者</div>
    <div class="cell sapiens" data-dim="2">残缺或病弱个体仍活到年长，说明群体分担生计</div>
    <div class="cell neanderthal" data-dim="2">严重残疾者多年存活，依赖他人长期照料</div>

    <div class="dim">营地组织</div>
    <div class="cell sapiens" data-dim="3">有可识别的火塘、工作区与活动空间</div>
    <div class="cell neanderthal" data-dim="3">有规整的火塘分布和分区使用的居住面</div>
  </div>

  <!-- Takeaway -->
  <div class="takeaway-bar">
    <div class="takeaway-main">尼安德特人不是「低等替代品」，而是另一支有过自己文化的近亲。</div>
    <div class="takeaway-sub" id="takeaway-sub">
      在葬仪、符号、照护和营地组织上，他们并不比同时期的智人「少」什么。<br>
      把他们从「失败者」的位置上移走，是理解人类史的第一步。
    </div>
  </div>

</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 20,
  kicker: "演化",
  title: "尼安德特人，另一支有文化的近亲",
  take: "尼安德特人不是低等替代品，而是另一支有过自己文化的近亲。"
});

/* ── 双标本点选交互 ── */
(function() {
  var btns = document.querySelectorAll('.specimen-btn');
  var allCells = document.querySelectorAll('.k-comparison > .cell');
  var takeawaySub = document.getElementById('takeaway-sub');

  function getSideCells(side) {
    return Array.from(document.querySelectorAll('.k-comparison > .cell.' + side));
  }

  function updateTakeaway() {
    var anyActive = Array.from(btns).some(function(b) { return b.classList.contains('active'); });
    if (takeawaySub) {
      takeawaySub.classList.toggle('visible', anyActive);
    }
  }

  btns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var side = btn.getAttribute('data-side');
      var isActive = btn.classList.toggle('active');
      var cells = getSideCells(side);

      cells.forEach(function(c) {
        c.classList.toggle('active', isActive);
      });

      // update button hint text
      var hint = btn.querySelector('.specimen-hint');
      if (hint) {
        hint.textContent = isActive ? '收起' : '点选查看';
      }

      updateTakeaway();
    });
  });
})();
</script>
</body>
</html>
