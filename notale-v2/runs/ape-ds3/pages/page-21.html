<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
  --surface: rgba(255,255,255,0.06);
  --muted: rgba(255,255,255,0.5);
  --line: rgba(255,255,255,0.15);
  --accent: #56c4b0;
  --accent-soft: rgba(86,196,176,0.15);
  --warning: #f59e6b;
  --success: #6ccb8a;
}

#main {
  display: flex;
  flex-direction: column;
  padding: 0;
  gap: 0;
}

/* Process strip – compact override for dark theme */
.k-process {
  flex: 0 0 auto;
  padding: 0;
  gap: 0;
  border-bottom: 1px solid var(--line);
  margin: 0;
  background: rgba(255,255,255,0.02);
  height: 44px;
}
.k-process > .step {
  flex: 1;
  min-width: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  border: none;
  border-radius: 0;
  box-shadow: none;
  text-align: center;
  font-size: var(--fs-label);
  line-height: 44px;
  color: var(--muted);
  cursor: default;
  transition: color .35s ease;
}
.k-process > .step::before {
  display: none;
}
.k-process > .step.current {
  color: var(--accent);
  font-weight: 700;
  border: none;
  background: transparent;
  box-shadow: none;
}
.k-process > .step.passed {
  opacity: .4;
  filter: none;
}
.k-process > .arw {
  flex: 0 0 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 400;
  color: var(--muted);
  opacity: .35;
  line-height: 44px;
}
.k-process > .arw::before {
  content: "→";
}

/* Canvas area */
.canvas-wrap {
  flex: 1;
  min-height: 0;
  position: relative;
  overflow: hidden;
}
#chromosome-cv {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* Legend */
.legend {
  position: absolute;
  top: 10px;
  left: 14px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  z-index: 2;
  pointer-events: none;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: var(--fs-label);
  color: var(--text);
  line-height: 1;
}
.swatch {
  display: inline-block;
  width: 13px;
  height: 13px;
  border-radius: 3px;
  flex-shrink: 0;
}
.swatch.blue {
  background: #4488cc;
}
.swatch.red {
  background: #cc5544;
}

/* Controls */
.ctl {
  flex: 0 0 auto;
  padding: 8px 20px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  border-top: 1px solid var(--line);
  background: rgba(255,255,255,0.02);
}
.ctl-label {
  font-size: var(--fs-label);
  color: var(--muted);
  white-space: nowrap;
}
#gen-slider {
  width: 260px;
  accent-color: var(--accent);
  cursor: pointer;
}
.gen-label {
  font-size: var(--fs-label);
  color: var(--text);
  min-width: 56px;
  text-align: center;
  font-weight: 600;
}
.reading {
  font-size: var(--fs-body);
  color: var(--accent);
  font-weight: 700;
  padding: 3px 12px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  background: rgba(86,196,176,0.08);
  margin-left: 4px;
  white-space: nowrap;
}
</style>
</head>
<body data-page="21" data-total="50">
<div id="stage">
<main id="main">
  <div class="k-process" id="process-strip">
    <div class="step" data-idx="0">分离</div>
    <div class="arw"></div>
    <div class="step" data-idx="1">相遇</div>
    <div class="arw"></div>
    <div class="step" data-idx="2">回交</div>
    <div class="arw"></div>
    <div class="step" data-idx="3">重组</div>
    <div class="arw"></div>
    <div class="step" data-idx="4">现在</div>
  </div>
  <div class="canvas-wrap">
    <canvas id="chromosome-cv" class="no-pan"></canvas>
    <div class="legend" aria-hidden="true">
      <span class="legend-item"><span class="swatch blue"></span>智人</span>
      <span class="legend-item"><span class="swatch red"></span>尼安德特人</span>
    </div>
  </div>
  <div class="ctl">
    <span class="ctl-label">世代</span>
    <input type="range" id="gen-slider" min="0" max="4" step="1" value="4" aria-label="世代选择：从相遇后代到今天">
    <span class="gen-label" id="gen-label">今天</span>
    <span class="reading" id="reading">1–4%</span>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
(function() {
  'use strict';

  Lec.mount({
    index: 21,
    kicker: '演化 · 基因混合',
    title: '不是纯种故事',
    take: '现代欧亚人基因组里带着 1–4% 的尼安德特人 DNA——处处有、但很少'
  });

  // ── constants ──────────────────────────────────────────────────────
  var NUM_SEGMENTS = 200;
  var STEP_NAMES = ['相遇后代', '第 1 代', '第 2 代', '第 3 代', '今天'];

  // Process label index for each generation step (0–4 → which process label to highlight)
  var STEP_TO_PROCESS = [1, 2, 2, 3, 4];

  // Neanderthal admixture range
  var ADMIX_MIN = (Lec.K.NEANDERTHAL_ADMIXTURE_PERCENT_MIN !== undefined)
    ? Lec.K.NEANDERTHAL_ADMIXTURE_PERCENT_MIN : 1;
  var ADMIX_MAX = (Lec.K.NEANDERTHAL_ADMIXTURE_PERCENT_MAX !== undefined)
    ? Lec.K.NEANDERTHAL_ADMIXTURE_PERCENT_MAX : 4;

  // ── DOM refs ────────────────────────────────────────────────────────
  var cv = document.getElementById('chromosome-cv');
  var slider = document.getElementById('gen-slider');
  var genLabel = document.getElementById('gen-label');
  var reading = document.getElementById('reading');
  var processSteps = document.querySelectorAll('#process-strip .step');

  var currentStep = 4;
  var chromosomes = [];
  var autoPlayActive = false;

  // ── seedrandom ──────────────────────────────────────────────────────
  var rng = new Math.seedrandom('page-21');

  // ── generate all 5 chromosome states ────────────────────────────────
  function generateAllChromosomes() {
    var all = [];

    // Step 0 (F1): all red
    var f1 = new Array(NUM_SEGMENTS);
    for (var i = 0; i < NUM_SEGMENTS; i++) f1[i] = 1;
    all.push(f1);

    // Steps 1–4: crossover with pure blue, halving red proportion each time
    for (var step = 1; step <= 4; step++) {
      var prev = all[step - 1];
      var numCross = 1 + Math.floor(rng() * 3);
      var crossovers = [];
      for (var j = 0; j < numCross; j++) {
        crossovers.push(Math.floor(rng() * NUM_SEGMENTS));
      }
      crossovers.sort(function(a, b) { return a - b; });

      var result = new Array(NUM_SEGMENTS);
      for (var k = 0; k < NUM_SEGMENTS; k++) result[k] = 0;
      var fromChimeric = false;
      var ci = 0;

      for (var s = 0; s < NUM_SEGMENTS; s++) {
        if (ci < crossovers.length && s >= crossovers[ci]) {
          fromChimeric = !fromChimeric;
          ci++;
        }
        if (fromChimeric) {
          result[s] = prev[s];
        }
      }

      all.push(result);
    }

    return all;
  }

  // ── drawing ─────────────────────────────────────────────────────────
  var ctx = null;

  function drawChromosomes() {
    if (!ctx) return;

    var w = cv.width;
    var h = cv.height;

    // Clear
    ctx.clearRect(0, 0, w, h);

    if (w < 10 || h < 10) return;

    // Chromosome dimensions
    var barW = w * 0.72;
    var barH = 68;
    var gap = 22;
    var totalH = barH * 2 + gap;
    var startY = (h - totalH) / 2;
    var startX = (w - barW) / 2;

    var blue = [68, 136, 204];
    var red = [204, 85, 68];
    var segW = barW / NUM_SEGMENTS;

    var chimeric = chromosomes[currentStep];

    // Top bar: pure blue (Homo sapiens chromosome)
    var by0 = startY;
    ctx.fillStyle = 'rgb(' + blue[0] + ',' + blue[1] + ',' + blue[2] + ')';
    Deck.rr(ctx, startX, by0, barW, barH, 5);
    ctx.fill();

    // Subtle inner highlight
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    Deck.rr(ctx, startX, by0, barW, barH * 0.35, 5);
    ctx.fill();

    // Bottom bar: chimeric (mixed)
    var by1 = startY + barH + gap;
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    Deck.rr(ctx, startX, by1, barW, barH, 5);
    ctx.fill();

    // Draw segments
    for (var s = 0; s < NUM_SEGMENTS; s++) {
      var color = chimeric[s] === 1 ? red : blue;
      var sx = startX + s * segW;
      ctx.fillStyle = 'rgb(' + color[0] + ',' + color[1] + ',' + color[2] + ')';
      ctx.fillRect(sx, by1, segW + 0.5, barH);
    }

    // Border
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.strokeRect(startX, by1, barW, barH);

    // Subtle inner highlight on chimeric
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    Deck.rr(ctx, startX, by1, barW, barH * 0.3, 5);
    ctx.fill();

    // Step label centered below
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(STEP_NAMES[currentStep], startX + barW / 2, by1 + barH + 5);
  }

  // ── update UI ───────────────────────────────────────────────────────
  function updateUI() {
    genLabel.textContent = STEP_NAMES[currentStep];
    slider.value = currentStep;

    // Update process strip: highlight the correct process label
    var procIdx = STEP_TO_PROCESS[currentStep];
    for (var i = 0; i < processSteps.length; i++) {
      var el = processSteps[i];
      el.classList.remove('current', 'passed');
      var idx = parseInt(el.getAttribute('data-idx'), 10);
      if (idx < procIdx) {
        el.classList.add('passed');
      } else if (idx === procIdx) {
        el.classList.add('current');
      }
    }

    // Reading stays constant
    reading.textContent = ADMIX_MIN + '–' + ADMIX_MAX + '%';
  }

  // ── set step ────────────────────────────────────────────────────────
  function setStep(step) {
    step = Math.max(0, Math.min(4, Math.round(step)));
    if (step === currentStep) return;
    currentStep = step;
    drawChromosomes();
    updateUI();
  }

  // ── canvas setup ────────────────────────────────────────────────────
  function setupCanvas() {
    ctx = Deck.fit(cv);
    drawChromosomes();
  }

  // ── auto-play ───────────────────────────────────────────────────────
  function startAutoPlay() {
    if (Deck.reduced()) {
      currentStep = 4;
      drawChromosomes();
      updateUI();
      return;
    }

    autoPlayActive = true;
    currentStep = 0;
    drawChromosomes();
    updateUI();

    var stepDuration = 500;
    var startTime = null;
    var stopFn = null;

    stopFn = Deck.loop(function(t) {
      if (startTime === null) startTime = t;
      var elapsed = t - startTime;
      var step = Math.floor(elapsed / stepDuration);
      if (step >= 5) {
        currentStep = 4;
        drawChromosomes();
        updateUI();
        autoPlayActive = false;
        if (stopFn) stopFn();
        return;
      }
      if (step !== currentStep) {
        currentStep = step;
        drawChromosomes();
        updateUI();
      }
    });

    function stopAutoPlay() {
      if (autoPlayActive) {
        autoPlayActive = false;
        if (stopFn) stopFn();
      }
    }
    slider.addEventListener('input', stopAutoPlay, { once: true });
  }

  // ── slider events ───────────────────────────────────────────────────
  slider.addEventListener('input', function() {
    var val = parseFloat(this.value);
    setStep(Math.round(val));
  });

  slider.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      var dir = e.key === 'ArrowLeft' ? -1 : 1;
      var newVal = Lec.P.clamp(currentStep + dir, 0, 4);
      setStep(newVal);
    }
  });

  // ── resize ──────────────────────────────────────────────────────────
  Deck.onResize(function() {
    setupCanvas();
  });

  // ── init ────────────────────────────────────────────────────────────
  chromosomes = generateAllChromosomes();
  setupCanvas();
  updateUI();
  startAutoPlay();

  window.__page21 = {
    setStep: setStep,
    getStep: function() { return currentStep; }
  };

})();
</script>
</body>
</html>
