<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #0f1117;
  --text: #e2e4dc;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}

/* 比较矩阵 —— 在 k-comparison 语义下自制排版 */
.p22-cmp {
  display: flex;
  flex-direction: column;
  gap: 0;
  flex: 1;
  min-height: 0;
}
.p22-cmp-row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex: 0 0 auto;
  height: 36px;
}
.p22-cmp-row.hdr {
  height: 32px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 0;
}
.p22-cmp-row .dim {
  width: 80px;
  flex: 0 0 auto;
  font-size: var(--fs-label);
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
}
.p22-cmp-row .hdr-cell {
  font-size: var(--fs-label);
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
  text-align: center;
}
.p22-cmp-row .anchor-val {
  width: 56px;
  flex: 0 0 auto;
  text-align: center;
  font-size: var(--fs-label);
  font-weight: 700;
  white-space: nowrap;
}
.p22-cmp-row .anchor-val.fg {
  color: var(--accent);
}
.p22-cmp-row .anchor-val.fr {
  color: #d97706;
}
.p22-cmp-row .track-wrap {
  flex: 1;
  min-width: 0;
  height: 100%;
  display: flex;
  align-items: center;
  position: relative;
  padding: 0 var(--space-1);
}
.p22-cmp-row .track {
  position: relative;
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.12);
  border-radius: 3px;
  overflow: visible;
}
.p22-cmp-row .track .fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width .12s ease;
}
.p22-cmp-row .track .marker {
  position: absolute;
  top: 50%;
  width: 14px;
  height: 14px;
  background: var(--text);
  border: 2px solid var(--accent);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: left .12s ease;
  z-index: 2;
  pointer-events: none;
}
.p22-cmp-row .track .val-label {
  position: absolute;
  top: -18px;
  transform: translateX(-50%);
  font-size: var(--fs-tick);
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  transition: left .12s ease;
  pointer-events: none;
  z-index: 3;
}
.p22-cmp-row .unit {
  width: 60px;
  flex: 0 0 auto;
  font-size: var(--fs-tick);
  color: var(--muted);
  white-space: nowrap;
  text-align: left;
  padding-left: var(--space-1);
}

/* 滑块 */
.ctl-slider {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) 0 0 0;
  border-top: 1px solid var(--line);
  flex: 0 0 auto;
  height: 40px;
}
.ctl-slider label {
  font-size: var(--fs-label);
  font-weight: 600;
  white-space: nowrap;
  color: var(--text);
}
.ctl-slider .slider-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.ctl-slider input[type="range"] {
  flex: 1;
  height: 6px;
  -webkit-appearance: none;
  appearance: none;
  background: rgba(255,255,255,0.12);
  border-radius: 3px;
  outline: none;
  accent-color: var(--accent);
}
.ctl-slider input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  background: var(--text);
  border: 2px solid var(--accent);
  border-radius: 50%;
  cursor: pointer;
}
.ctl-slider input[type="range"]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  background: var(--text);
  border: 2px solid var(--accent);
  border-radius: 50%;
  cursor: pointer;
}
.ctl-slider .slider-label {
  font-size: var(--fs-label);
  color: var(--muted);
  white-space: nowrap;
}
.ctl-slider .slider-pct {
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--accent);
  min-width: 44px;
  text-align: center;
}

/* 右栏图 */
#chart-wrap {
  width: 380px;
  flex: 0 0 auto;
  height: 100%;
  position: relative;
}
#chart-wrap .chart-title {
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--muted);
  text-align: center;
  height: 28px;
  line-height: 28px;
}
#chart {
  width: 100%;
  height: calc(100% - 28px);
}

/* 顶注 */
.lead-note {
  font-size: var(--fs-sec);
  color: var(--muted);
  line-height: var(--lh-sec);
  flex: 0 0 auto;
  height: 24px;
}
</style>
</head>
<body data-page="22" data-total="50">
<div id="stage">
<main id="main">
  <div class="row" style="height:100%; gap:var(--space-5); align-items:stretch;">
    <!-- 左栏：比较矩阵 + 滑块 -->
    <div class="col grow" style="gap:0; min-width:0;">

      <p class="lead-note" id="lead-note"></p>

      <!-- 比较矩阵，用 k-comparison 语义 -->
      <div class="k-comparison p22-cmp" id="cmp-grid">
        <!-- 表头 -->
        <div class="p22-cmp-row hdr">
          <div class="dim">维度</div>
          <div class="anchor-val" style="color:var(--muted);">采集狩猎</div>
          <div class="track-wrap" style="justify-content:center;">
            <span class="hdr-cell">当前</span>
          </div>
          <div class="anchor-val" style="color:var(--muted);">农业</div>
          <div class="unit" style="color:var(--muted);">单位</div>
        </div>

        <!-- 行 0: 人口密度 -->
        <div class="p22-cmp-row" data-idx="0">
          <div class="dim">人口密度</div>
          <div class="anchor-val fg" id="fg-0">0.2</div>
          <div class="track-wrap">
            <div class="track">
              <div class="fill" id="fill-0" style="width:0%;"></div>
              <div class="marker" id="marker-0" style="left:0%;"></div>
              <div class="val-label" id="val-0" style="left:0%;">0.2</div>
            </div>
          </div>
          <div class="anchor-val fr" id="fr-0">20</div>
          <div class="unit">人/km²</div>
        </div>

        <!-- 行 1: 每日劳动 -->
        <div class="p22-cmp-row" data-idx="1">
          <div class="dim">每日劳动</div>
          <div class="anchor-val fg" id="fg-1">4.0</div>
          <div class="track-wrap">
            <div class="track">
              <div class="fill" id="fill-1" style="width:0%;"></div>
              <div class="marker" id="marker-1" style="left:0%;"></div>
              <div class="val-label" id="val-1" style="left:0%;">4.0</div>
            </div>
          </div>
          <div class="anchor-val fr" id="fr-1">9.0</div>
          <div class="unit">小时/天</div>
        </div>

        <!-- 行 2: 食物种类 -->
        <div class="p22-cmp-row" data-idx="2">
          <div class="dim">食物种类</div>
          <div class="anchor-val fg" id="fg-2">250</div>
          <div class="track-wrap">
            <div class="track">
              <div class="fill" id="fill-2" style="width:0%;"></div>
              <div class="marker" id="marker-2" style="left:0%;"></div>
              <div class="val-label" id="val-2" style="left:0%;">250</div>
            </div>
          </div>
          <div class="anchor-val fr" id="fr-2">20</div>
          <div class="unit">种</div>
        </div>

        <!-- 行 3: 平均身高 -->
        <div class="p22-cmp-row" data-idx="3">
          <div class="dim">平均身高</div>
          <div class="anchor-val fg" id="fg-3">170</div>
          <div class="track-wrap">
            <div class="track">
              <div class="fill" id="fill-3" style="width:0%;"></div>
              <div class="marker" id="marker-3" style="left:0%;"></div>
              <div class="val-label" id="val-3" style="left:0%;">170</div>
            </div>
          </div>
          <div class="anchor-val fr" id="fr-3">163</div>
          <div class="unit">cm</div>
        </div>

        <!-- 行 4: 传染病压力 -->
        <div class="p22-cmp-row" data-idx="4">
          <div class="dim">传染病压力</div>
          <div class="anchor-val fg" id="fg-4">1.0</div>
          <div class="track-wrap">
            <div class="track">
              <div class="fill" id="fill-4" style="width:0%;"></div>
              <div class="marker" id="marker-4" style="left:0%;"></div>
              <div class="val-label" id="val-4" style="left:0%;">1.0</div>
            </div>
          </div>
          <div class="anchor-val fr" id="fr-4">7.0</div>
          <div class="unit">指数</div>
        </div>

      </div>

      <!-- 滑块控件 -->
      <div class="ctl-slider" id="slider-area">
        <label>生计混合</label>
        <div class="slider-wrap">
          <span class="slider-label">采集狩猎</span>
          <input type="range" id="mix-slider" min="0" max="1" step="0.01" value="0" aria-label="生计混合滑块">
          <span class="slider-label">农业</span>
        </div>
        <span class="slider-pct" id="mix-pct">0%</span>
      </div>
    </div>

    <!-- 右栏：echarts -->
    <div id="chart-wrap">
      <div class="chart-title">当前状态</div>
      <div id="chart"></div>
    </div>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
Lec.mount({ index: 22, kicker: "生计对比", title: "农业的赌局", take: "农业让群体暴增，但个体未必更轻松" });

(function() {
  'use strict';

  /* ---- 锚点数据 ---- */
  var DIMS = [
    { key: 'pop',     label: '人口密度',  fg: 0.2,  fr: 20,   precision: 1, unit: '人/km²', exponential: true },
    { key: 'labor',   label: '每日劳动',  fg: 4,    fr: 9,    precision: 1, unit: '小时/天' },
    { key: 'diet',    label: '食物种类',  fg: 250,  fr: 20,   precision: 0, unit: '种' },
    { key: 'height',  label: '平均身高',  fg: 170,  fr: 163,  precision: 1, unit: 'cm' },
    { key: 'epidemic',label: '传染病压力',fg: 1,    fr: 7,    precision: 1, unit: '指数' }
  ];

  /* ---- 显示约 1.2 万年前 ---- */
  var agriYears = Lec.K.AGRICULTURE_START_YEARS;
  document.getElementById('lead-note').textContent = '约' + (agriYears / 10000).toFixed(1) + '万年前，一场赌局开始。';

  /* ---- 计算 ---- */
  function computeValue(idx, t) {
    var d = DIMS[idx];
    if (d.exponential) {
      return d.fg * Math.pow(d.fr / d.fg, t);
    }
    return d.fg + (d.fr - d.fg) * t;
  }

  function getPos(idx, t) {
    var d = DIMS[idx];
    if (d.exponential) {
      return t * 100;
    }
    var v = computeValue(idx, t);
    if (d.fr === d.fg) return 0;
    return ((v - d.fg) / (d.fr - d.fg)) * 100;
  }

  /* ---- DOM 更新 ---- */
  var fillEls = [], markerEls = [], valEls = [];
  for (var i = 0; i < 5; i++) {
    fillEls[i] = document.getElementById('fill-' + i);
    markerEls[i] = document.getElementById('marker-' + i);
    valEls[i] = document.getElementById('val-' + i);
  }

  function updateDOM(t) {
    for (var i = 0; i < 5; i++) {
      var d = DIMS[i];
      var v = computeValue(i, t);
      var pos = getPos(i, t);
      pos = Math.max(0, Math.min(100, pos));
      var displayVal = d.precision === 0 ? Math.round(v) : v.toFixed(d.precision);

      fillEls[i].style.width = pos + '%';
      markerEls[i].style.left = pos + '%';
      valEls[i].textContent = displayVal;
      valEls[i].style.left = pos + '%';
    }
    document.getElementById('mix-pct').textContent = Math.round(t * 100) + '%';
  }

  /* ---- ECharts ---- */
  var chartEl = document.getElementById('chart');
  var chart = echarts.init(chartEl, null, { renderer: 'svg' });

  function buildChartOption(t) {
    var results = [];
    for (var i = 0; i < 5; i++) {
      var d = DIMS[i];
      var v = computeValue(i, t);
      var maxA = Math.max(d.fg, d.fr);
      var pct = Math.min((v / maxA) * 100, 100);
      var displayVal = d.precision === 0 ? Math.round(v) : v.toFixed(d.precision);
      results.push({ label: d.label + '  ' + displayVal, pct: pct, dim: d });
    }

    var colors = ['#d97706', '#d97706', '#0b7a75', '#0b7a75', '#d97706'];

    return {
      tooltip: {
        trigger: 'item',
        formatter: function(params) {
          var idx = params.dataIndex;
          var d = DIMS[idx];
          var v = computeValue(idx, t);
          var dv = d.precision === 0 ? Math.round(v) : v.toFixed(d.precision);
          var fgv = d.precision === 0 ? Math.round(d.fg) : d.fg.toFixed(d.precision);
          var frv = d.precision === 0 ? Math.round(d.fr) : d.fr.toFixed(d.precision);
          return d.label + '<br/>当前: ' + dv + ' ' + d.unit +
            '<br/>采集狩猎: ' + fgv + ' | 农业: ' + frv;
        },
        textStyle: { fontSize: 16 }
      },
      grid: { left: 20, right: 20, top: 10, bottom: 10, containLabel: true },
      xAxis: {
        type: 'value',
        max: 100,
        axisLabel: { fontSize: 12, formatter: '{value}%' },
        splitLine: { lineStyle: { color: '#333', type: 'dashed' } }
      },
      yAxis: {
        type: 'category',
        data: results.map(function(r) { return r.label; }),
        axisLabel: { fontSize: 14, color: '#e2e4dc' },
        axisTick: { show: false },
        axisLine: { show: false }
      },
      series: [{
        type: 'bar',
        data: results.map(function(r, i) {
          return {
            value: r.pct,
            itemStyle: { color: colors[i], borderRadius: [0, 3, 3, 0] }
          };
        }),
        barWidth: 14,
        label: {
          show: true,
          position: 'right',
          formatter: function(p) { return p.value.toFixed(1) + '%'; },
          fontSize: 14,
          color: '#888'
        }
      }]
    };
  }

  chart.setOption(buildChartOption(0));

  /* ---- 滑块 ---- */
  var slider = document.getElementById('mix-slider');
  slider.addEventListener('input', function() {
    var t = parseFloat(this.value);
    updateDOM(t);
    chart.setOption(buildChartOption(t));
  });

  /* ---- 初始化 ---- */
  updateDOM(0);
  slider.value = '0';

  /* ---- resize ---- */
  if (window.ResizeObserver) {
    new ResizeObserver(function() { chart.resize(); })
      .observe(document.getElementById('chart-wrap'));
  }

})();
</script>
</body>
</html>
