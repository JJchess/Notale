<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* === page-23: 文明加速条 === */
#main {
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---- 上半轴 ---- */
.upper-section {
  flex: 0 0 auto;
  height: 160px;
  position: relative;
}

.upper-desc {
  position: absolute;
  top: 0;
  left: 80px;
  right: 60px;
  font-size: var(--fs-sec);
  color: var(--text);
  line-height: 1.45;
}
.upper-desc strong {
  color: var(--accent);
}

.upper-axis-row {
  position: absolute;
  left: 80px;
  right: 60px;
  top: 72px;
  height: 44px;
}

.upper-axis-line {
  position: absolute;
  left: 0;
  right: 0;
  top: 20px;
  height: 2px;
  background: var(--line);
  border-radius: 1px;
}

.upper-axis-tick {
  position: absolute;
  top: 14px;
  width: 1px;
  height: 12px;
  background: var(--line);
}
.upper-axis-tick.l { left: 0; }
.upper-axis-tick.r { right: 0; }

.upper-axis-label {
  position: absolute;
  top: 32px;
  font-size: var(--fs-label);
  color: var(--muted);
  line-height: 1.4;
}
.upper-axis-label.l { left: 0; }
.upper-axis-label.r { right: 0; }

/* 文明段高亮框 */
.highlight-zone {
  position: absolute;
  top: 12px;
  height: 18px;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-radius: 3px;
  opacity: 0.7;
  z-index: 2;
}
.highlight-zone .hl-label {
  position: absolute;
  top: -18px;
  left: 0;
  font-size: var(--fs-label);
  color: var(--accent);
  white-space: nowrap;
  line-height: 1.35;
}

/* 连接线 */
.connector-wrap {
  position: relative;
  flex: 0 0 auto;
  height: 24px;
}
.connector-line {
  position: absolute;
  left: 80px;
  top: 0;
  width: 2px;
  height: 24px;
  background: var(--accent);
  opacity: 0.4;
}

/* ---- 下半轴 ---- */
.lower-section {
  flex: 1;
  position: relative;
  min-height: 0;
}

.lower-axis-row {
  position: absolute;
  left: 80px;
  right: 60px;
  top: 0;
  height: 36px;
}

.lower-axis-line {
  position: absolute;
  left: 0;
  right: 0;
  top: 16px;
  height: 3px;
  background: var(--line);
  border-radius: 1.5px;
}

.lower-axis-tick {
  position: absolute;
  top: 10px;
  width: 1px;
  height: 10px;
  background: var(--line);
}
.lower-axis-tick.l { left: 0; }
.lower-axis-tick.r { right: 0; }

.lower-axis-label {
  position: absolute;
  top: 28px;
  font-size: var(--fs-label);
  color: var(--muted);
  line-height: 1.4;
}
.lower-axis-label.l { left: 0; }
.lower-axis-label.r { right: 0; }

/* 事件节点 */
.event-dot {
  position: absolute;
  top: 9px;
  width: 14px;
  height: 14px;
  margin-left: -7px;
  border-radius: 50%;
  border: 2px solid var(--muted);
  background: var(--bg);
  z-index: 3;
  transition: all 0.3s ease;
}
.event-dot.active {
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: 0 0 8px rgba(11, 122, 117, 0.4);
  transform: scale(1.25);
}
.event-dot.passed {
  border-color: var(--accent);
  background: var(--accent-soft);
}

/* 事件标签 */
.event-label {
  position: absolute;
  font-size: var(--fs-label);
  color: var(--muted);
  line-height: 1.35;
  white-space: nowrap;
  text-align: center;
  transform: translateX(-50%);
  transition: color 0.3s ease;
  pointer-events: none;
  z-index: 2;
}
.event-label.active {
  color: var(--accent);
  font-weight: 700;
}
.event-label.row1 { top: 28px; }
.event-label.row2 { top: 44px; }
.event-label.row3 { top: 60px; }

/* 游标 */
.cursor {
  position: absolute;
  top: -2px;
  width: 2px;
  height: 34px;
  background: var(--accent);
  z-index: 5;
  pointer-events: none;
}
.cursor::before {
  content: '';
  position: absolute;
  top: -6px;
  left: -5px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
.cursor-hit {
  position: absolute;
  top: -6px;
  left: 0;
  width: 100%;
  height: 44px;
  cursor: ew-resize;
  z-index: 6;
  touch-action: none;
}

/* 读数面板 */
.info-panel {
  position: absolute;
  top: 72px;
  left: 80px;
  right: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
}
.info-panel .event-name {
  font-size: var(--fs-lead);
  font-weight: 700;
  color: var(--accent);
  line-height: 1.5;
  min-width: 100px;
}
.info-panel .event-interval {
  font-size: var(--fs-sec);
  color: var(--text);
  line-height: 1.5;
}
.info-panel .event-interval .num {
  font-weight: 700;
  color: var(--warning);
  font-size: var(--fs-lead);
}

/* 控件行 */
.controls {
  position: absolute;
  bottom: 16px;
  left: 80px;
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.controls button {
  padding: var(--space-2) var(--space-4);
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: var(--fs-label);
  color: var(--text);
  font-family: inherit;
  transition: all 0.2s ease;
}
.controls button:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.controls button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.controls button.primary.playing {
  background: var(--warning);
  border-color: var(--warning);
}

/* 收束语 */
.closing-note {
  position: absolute;
  bottom: 16px;
  right: 60px;
  font-size: var(--fs-sec);
  color: var(--muted);
  line-height: 1.5;
  text-align: right;
}
</style>
</head>
<body data-page="23" data-total="50">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 23,
  kicker: '演化',
  title: '文明加速条',
  take: '文明事件不是均匀发生的——越靠近今天，事件越密、间隔越短。'
});

(function() {
  'use strict';

  var main = document.getElementById('main');
  if (!main) return;

  /* ======== 数据 ======== */
  var HOMO_SAPIENS = Lec.K.HOMO_SAPIENS_YEARS;
  var AGRICULTURE   = Lec.K.AGRICULTURE_START_YEARS;
  var INDUSTRIAL    = Lec.K.INDUSTRIAL_REVOLUTION_YEARS;
  var CURRENT_YEAR  = Lec.K.CURRENT_YEAR;
  var SPACE_AGE_CE  = Lec.K.SPACE_AGE_START_CE;

  var events = [
    { id: 'agriculture', label: '农业革命', years: AGRICULTURE },
    { id: 'writing',     label: '文字',     years: CURRENT_YEAR + 3500 },
    { id: 'printing',    label: '印刷术',   years: CURRENT_YEAR - 1450 },
    { id: 'industrial',  label: '工业革命', years: INDUSTRIAL },
    { id: 'space',       label: '太空时代', years: CURRENT_YEAR - SPACE_AGE_CE },
    { id: 'web',         label: '万维网',   years: CURRENT_YEAR - 1990 }
  ];
  events.sort(function(a, b) { return b.years - a.years; });

  for (var i = 0; i < events.length; i++) {
    events[i].gap = (i === 0) ? 0 : (events[i-1].years - events[i].years);
  }

  var ratio = AGRICULTURE / HOMO_SAPIENS;
  var ratioPct = Math.round(ratio * 100);

  /* ======== 布局参数 ======== */
  var AXIS_L = 80;
  var AXIS_R = 60;
  function getAxisW() {
    return main.clientWidth - AXIS_L - AXIS_R;
  }

  function eventX(ev) {
    var w = getAxisW();
    var t = 1 - ev.years / AGRICULTURE;
    return AXIS_L + t * w;
  }

  /* ======== 构建 DOM ======== */
  main.innerHTML = '';

  /* ---- 上半轴 ---- */
  var upper = document.createElement('div');
  upper.className = 'upper-section';
  main.appendChild(upper);

  // desc removed for debugging

  var uRow = document.createElement('div');
  uRow.className = 'upper-axis-row';
  upper.appendChild(uRow);

  var uLine = document.createElement('div');
  uLine.className = 'upper-axis-line';
  uRow.appendChild(uLine);

  var uTickL = document.createElement('div');
  uTickL.className = 'upper-axis-tick l';
  uRow.appendChild(uTickL);
  var uTickR = document.createElement('div');
  uTickR.className = 'upper-axis-tick r';
  uRow.appendChild(uTickR);

  var uLblL = document.createElement('div');
  uLblL.className = 'upper-axis-label l';
  uLblL.textContent = '30万年前';
  uRow.appendChild(uLblL);
  var uLblR = document.createElement('div');
  uLblR.className = 'upper-axis-label r';
  uLblR.textContent = '今天';
  uRow.appendChild(uLblR);

  var hl = document.createElement('div');
  hl.className = 'highlight-zone';
  hl.innerHTML = '<span class="hl-label">文明段</span>';
  uRow.appendChild(hl);

  /* ---- 连接线 ---- */
  var cw = document.createElement('div');
  cw.className = 'connector-wrap';
  main.appendChild(cw);

  var cl = document.createElement('div');
  cl.className = 'connector-line';
  cw.appendChild(cl);

  /* ---- 下半轴 ---- */
  var lower = document.createElement('div');
  lower.className = 'lower-section';
  main.appendChild(lower);

  var lRow = document.createElement('div');
  lRow.className = 'lower-axis-row';
  lower.appendChild(lRow);

  var lLine = document.createElement('div');
  lLine.className = 'lower-axis-line';
  lRow.appendChild(lLine);

  var lTickL = document.createElement('div');
  lTickL.className = 'lower-axis-tick l';
  lRow.appendChild(lTickL);
  var lTickR = document.createElement('div');
  lTickR.className = 'lower-axis-tick r';
  lRow.appendChild(lTickR);

  var lLblL = document.createElement('div');
  lLblL.className = 'lower-axis-label l';
  lLblL.textContent = '1.2万年前（农业革命）';
  lRow.appendChild(lLblL);
  var lLblR = document.createElement('div');
  lLblR.className = 'lower-axis-label r';
  lLblR.textContent = '今天';
  lRow.appendChild(lLblR);

  /* 事件节点 + 标签 */
  var dots = [];
  var labels = [];

  for (var i = 0; i < events.length; i++) {
    var dot = document.createElement('div');
    dot.className = 'event-dot';
    dot.dataset.idx = i;
    lRow.appendChild(dot);

    var lbl = document.createElement('div');
    lbl.className = 'event-label';
    lbl.textContent = events[i].label;
    // 默认 row1，之后在 layout() 中根据位置分配行
    lbl.classList.add('row1');
    lRow.appendChild(lbl);

    dots.push(dot);
    labels.push(lbl);
  }

  /* 游标 */
  var cursor = document.createElement('div');
  cursor.className = 'cursor';
  lRow.appendChild(cursor);

  var hitArea = document.createElement('div');
  hitArea.className = 'cursor-hit';
  lRow.appendChild(hitArea);

  /* 读数面板 */
  var info = document.createElement('div');
  info.className = 'info-panel';
  info.innerHTML = '<span class="event-name">—</span><span class="event-interval">距上一事件 <span class="num">—</span> 年</span>';
  lower.appendChild(info);

  /* 控件 */
  var ctrl = document.createElement('div');
  ctrl.className = 'controls';
  ctrl.innerHTML = '<button class="primary" id="playBtn">▶ 播放</button>';
  lower.appendChild(ctrl);

  var playBtn = document.getElementById('playBtn');

  /* 收束语 */
  var closeNote = document.createElement('div');
  closeNote.className = 'closing-note';
  closeNote.textContent = '带着这条加速的尾巴，下一章看这个物种怎样面对天空。';
  lower.appendChild(closeNote);

  /* ======== 定位与标签防重叠 ======== */
  var LABEL_W = 60; // 估计每个标签宽度约 60px（4 字×15px）

  function layout() {
    var w = getAxisW();
    if (w <= 0) return;

    var hlLeft = w * (1 - ratio);
    var hlWidth = w * ratio;
    hl.style.left = hlLeft + 'px';
    hl.style.width = Math.max(hlWidth, 30) + 'px';

    /* 计算每个事件的 x 坐标 */
    var xs = [];
    for (var i = 0; i < events.length; i++) {
      xs[i] = eventX(events[i]);
    }

    /* 贪心分配行号：从右到左，每个标签放在能放下它的最低行 */
    var rows = []; // 每行目前最右的标签右边界
    var labelRows = []; // 每个标签的行号

    for (var i = events.length - 1; i >= 0; i--) {
      var x = xs[i];
      var left = x - LABEL_W / 2;
      var right = x + LABEL_W / 2;
      var placed = false;
      for (var r = 0; r < 3; r++) {
        if (r >= rows.length || rows[r] <= left) {
          labelRows[i] = r;
          rows[r] = right;
          placed = true;
          break;
        }
      }
      if (!placed) {
        // 放不下就放最后一行
        labelRows[i] = 2;
        rows[2] = Math.max(rows[2] || 0, right);
      }
    }

    /* 应用位置 */
    for (var i = 0; i < events.length; i++) {
      dots[i].style.left = xs[i] + 'px';
      labels[i].style.left = xs[i] + 'px';
      labels[i].className = 'event-label row' + (labelRows[i] + 1);
    }
  }

  /* ======== 交互状态 ======== */
  var currentIdx = -1;
  var isDragging = false;
  var isPlaying = false;
  var playTween = null;

  function getYearFromPos(pos) {
    var w = getAxisW();
    if (w <= 0) return 0;
    var t = (pos - AXIS_L) / w;
    t = Math.max(0, Math.min(1, t));
    return AGRICULTURE * (1 - t);
  }

  function updateDisplay(pos) {
    var w = getAxisW();
    if (w <= 0) return;
    pos = Math.max(AXIS_L, Math.min(AXIS_L + w, pos));
    var year = getYearFromPos(pos);

    var idx = -1;
    for (var i = 0; i < events.length; i++) {
      if (events[i].years >= year) {
        idx = i;
      }
    }

    for (var i = 0; i < events.length; i++) {
      dots[i].classList.remove('active', 'passed');
      labels[i].classList.remove('active');
      if (i < idx) {
        dots[i].classList.add('passed');
      } else if (i === idx) {
        dots[i].classList.add('active');
        labels[i].classList.add('active');
      }
    }

    currentIdx = idx;
    var nameEl = info.querySelector('.event-name');
    var numEl = info.querySelector('.num');
    if (idx >= 0) {
      nameEl.textContent = events[idx].label;
      if (idx > 0) {
        numEl.textContent = Lec.P.round(events[idx].gap, 0);
      } else {
        numEl.textContent = '—';
      }
    } else {
      nameEl.textContent = '—';
      numEl.textContent = '—';
    }

    cursor.style.left = pos + 'px';
  }

  /* ======== 拖拽 ======== */

  hitArea.addEventListener('pointerdown', function(e) {
    if (isPlaying) stopPlay();
    isDragging = true;
    hitArea.setPointerCapture(e.pointerId);
    var pt = Deck.pt(hitArea, e);
    updateDisplay(pt.x);
  });

  document.addEventListener('pointermove', function(e) {
    if (!isDragging) return;
    var pt = Deck.pt(hitArea, e);
    updateDisplay(pt.x);
  });

  document.addEventListener('pointerup', function() {
    isDragging = false;
  });

  /* ======== 键盘支持 ======== */
  hitArea.setAttribute('tabindex', '0');
  hitArea.setAttribute('role', 'slider');
  hitArea.setAttribute('aria-label', '文明加速条游标');

  hitArea.addEventListener('keydown', function(e) {
    var step = 10;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (isPlaying) stopPlay();
      var pos = parseFloat(cursor.style.left) || AXIS_L;
      updateDisplay(pos + step);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      e.preventDefault();
      if (isPlaying) stopPlay();
      var pos = parseFloat(cursor.style.left) || AXIS_L;
      updateDisplay(pos - step);
    } else if (e.key === 'Home') {
      e.preventDefault();
      if (isPlaying) stopPlay();
      updateDisplay(AXIS_L);
    } else if (e.key === 'End') {
      e.preventDefault();
      if (isPlaying) stopPlay();
      updateDisplay(AXIS_L + getAxisW());
    }
  });

  /* ======== GSAP 播放 ======== */
  function stopPlay() {
    isPlaying = false;
    if (playTween) {
      playTween.kill();
      playTween = null;
    }
    playBtn.textContent = '▶ 播放';
    playBtn.classList.remove('playing');
  }

  function startPlay() {
    if (isPlaying) {
      stopPlay();
      return;
    }
    isPlaying = true;
    playBtn.textContent = '⏸ 暂停';
    playBtn.classList.add('playing');

    var startPos = parseFloat(cursor.style.left) || AXIS_L;
    var endPos = AXIS_L + getAxisW();

    playTween = gsap.to({}, {
      duration: 8,
      ease: 'power1.inOut',
      onUpdate: function() {
        var p = this.progress();
        var pos = startPos + (endPos - startPos) * p;
        updateDisplay(pos);
      },
      onComplete: function() {
        stopPlay();
        updateDisplay(endPos);
      }
    });
  }

  playBtn.addEventListener('click', startPlay);

  /* ======== 初始化 ======== */
  setTimeout(function() {
    layout();
    updateDisplay(AXIS_L);
  }, 50);

  Deck.onResize(function() {
    layout();
    var pos = parseFloat(cursor.style.left) || AXIS_L;
    updateDisplay(pos);
  });

})();
</script>
</body>
</html>
