<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* --- page-24: generalization — 对抗视觉 --- */
.p24-conf {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0;
}

/* override .claim for the visual instead of text block */
.p24-conf > .claim {
  max-width: 100%;
  border-left: none;
  background: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-weight: normal;
  font-size: var(--fs-body);
  line-height: var(--lh-body);
}

/* arrow pair */
.p24-arrows {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  height: 210px;
  justify-content: center;
}

.p24-arr {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* arrow shaft + tip via pseudo-elements */
.p24-arr .shaft {
  width: 30px;
  flex: 1;
  min-height: 60px;
  position: relative;
}

.p24-arr .tip {
  width: 0;
  height: 0;
}

/* downward arrow (gravity) */
.p24-arr.down .shaft {
  background: var(--warning);
}
.p24-arr.down .tip {
  border-left: 24px solid transparent;
  border-right: 24px solid transparent;
  border-top: 28px solid var(--warning);
}

/* upward arrow (leaving) */
.p24-arr.up .shaft {
  background: var(--accent);
}
.p24-arr.up .tip {
  border-left: 24px solid transparent;
  border-right: 24px solid transparent;
  border-bottom: 28px solid var(--accent);
}

/* labels */
.p24-alabel {
  position: absolute;
  right: -64px;
  font-size: var(--fs-label);
  font-weight: 700;
  white-space: nowrap;
  letter-spacing: 0.06em;
}
.p24-alabel.down {
  top: 50%;
  transform: translateY(-50%);
  color: var(--warning);
}
.p24-alabel.up {
  top: 50%;
  transform: translateY(-50%);
  color: var(--accent);
}

/* Earth horizon */
.p24-earth {
  position: relative;
  width: 300px;
  height: 44px;
  border-bottom: 3px solid var(--text);
  border-radius: 0 0 150px 150px;
  opacity: 0.3;
  margin-top: var(--space-3);
}
.p24-elabel {
  position: absolute;
  bottom: -28px;
  left: 50%;
  transform: translateX(-50%);
  font-size: var(--fs-label);
  color: var(--muted);
  letter-spacing: 0.2em;
  font-weight: 300;
}

/* trunk between visual and supports */
.p24-trunk {
  margin: var(--space-3) 0 var(--space-2);
}

/* support items: make the three statements clean */
.p24-sup {
  flex: 0 1 260px;
  border-left: 2px solid var(--accent-soft);
  padding-left: var(--space-3);
  text-align: left;
}
.p24-sup .sup-name {
  font-size: var(--fs-body);
  font-weight: 700;
  color: var(--text);
  line-height: var(--lh-body);
}
.p24-sup .sup-desc {
  margin-top: var(--space-1);
  font-size: var(--fs-sec);
  color: var(--muted);
  line-height: var(--lh-sec);
}
</style>
</head>
<body data-page="24" data-total="50">
<div id="stage">
<main id="main">
  <div class="k-generalization p24-conf">
    <div class="claim">
      <!-- central confrontation visual: upward arrow vs downward arrow over Earth horizon -->
      <div class="p24-arrows">
        <div class="p24-arr down">
          <div class="shaft" style="position:relative;">
            <span class="p24-alabel down">重力</span>
          </div>
          <div class="tip"></div>
        </div>
        <div class="p24-arr up">
          <div class="shaft" style="position:relative;">
            <span class="p24-alabel up">离开</span>
          </div>
          <div class="tip"></div>
        </div>
      </div>
      <div class="p24-earth">
        <span class="p24-elabel">地 平 线</span>
      </div>
    </div>

    <div class="trunk p24-trunk"></div>

    <div class="supports">
      <div class="support p24-sup">
        <div class="sup-name">跳高</div>
        <div class="sup-desc">总会落回地面</div>
      </div>
      <div class="support p24-sup">
        <div class="sup-name">掷石</div>
        <div class="sup-desc">弧线最终弯回地面</div>
      </div>
      <div class="support p24-sup">
        <div class="sup-name">火箭</div>
        <div class="sup-desc">必须压过这个向下拉的力</div>
      </div>
    </div>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 24,
  kicker: "ESCAPE · 第三章 逃离",
  title: "要离开地球，先要赢过重力",
  take: '重力，是这一章所有\u201C难\u201D的起点。'
});
</script>
</body>
</html>
