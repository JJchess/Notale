<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* 体重条容器 */
.weight-bars {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  flex: 1;
  justify-content: center;
}
.weight-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.weight-row .label {
  width: 60px;
  font-size: var(--fs-label);
  color: var(--muted);
  flex-shrink: 0;
  text-align: right;
}
.weight-row .track {
  flex: 1;
  height: 28px;
  background: color-mix(in srgb, var(--line) 40%, transparent);
  border-radius: 14px;
  overflow: hidden;
  position: relative;
}
.weight-row .fill {
  height: 100%;
  border-radius: 14px;
  transition: width .4s ease;
  min-width: 2px;
}
.weight-row .fill.earth-fill {
  background: var(--accent);
}
.weight-row .fill.target-fill {
  background: var(--warning);
}
.weight-row .value {
  width: 80px;
  font-size: var(--fs-body);
  font-weight: 700;
  flex-shrink: 0;
  text-align: left;
}
.ratio-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: var(--fs-label);
  font-weight: 700;
  background: var(--accent-soft);
  color: var(--accent);
  margin-left: var(--space-2);
}
.ctl button.selected {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
/* 对比表微调 */
.k-comparison {
  --dim-w: 80px;
}
.k-comparison > .hdr {
  letter-spacing: .06em;
}
</style>
</head>
<body data-page="26" data-total="50">
<div id="stage">
<main id="main" class="col" style="padding: var(--space-3) var(--space-5); gap: var(--space-3);">
  <!-- 导语 -->
  <p style="font-size: var(--fs-lead); line-height: var(--lh-lead); margin: 0; color: var(--text);">
    同一具身体（60 kg）在不同天体上，体重秤的读数完全不同。
  </p>

  <!-- 对比表 -->
  <div class="k-comparison" style="--cmp-cols:3;">
    <div class="hdr dim">天体</div>
    <div class="hdr">表面重力</div>
    <div class="hdr">等效体重</div>
    <div class="hdr">与地球倍数</div>

    <div class="dim">地球</div>
    <div class="" id="cell-gravity-earth">—</div>
    <div class="" id="cell-weight-earth">—</div>
    <div class="" id="cell-ratio-earth">—</div>

    <div class="dim">月球</div>
    <div class="" id="cell-gravity-moon">—</div>
    <div class="" id="cell-weight-moon">—</div>
    <div class="" id="cell-ratio-moon">—</div>

    <div class="dim">火星</div>
    <div class="" id="cell-gravity-mars">—</div>
    <div class="" id="cell-weight-mars">—</div>
    <div class="" id="cell-ratio-mars">—</div>

    <div class="dim">木星</div>
    <div class="" id="cell-gravity-jupiter">—</div>
    <div class="" id="cell-weight-jupiter">—</div>
    <div class="" id="cell-ratio-jupiter">—</div>
  </div>

  <!-- 体重条并排比较 -->
  <div class="weight-bars">
    <div class="weight-row">
      <span class="label">地球</span>
      <div class="track">
        <div class="fill earth-fill" id="earth-bar" style="width:30%;"></div>
      </div>
      <span class="value" id="earth-value">60 kg</span>
    </div>
    <div class="weight-row">
      <span class="label" id="target-label">木星</span>
      <div class="track">
        <div class="fill target-fill" id="target-bar" style="width:30%;"></div>
      </div>
      <span class="value" id="target-value">152 kg</span>
      <span class="ratio-badge" id="ratio-badge">≈ 2.5×</span>
    </div>
  </div>

  <!-- 控件行 -->
  <div class="ctl justify-center" style="gap: var(--space-3);">
    <button data-body="earth" class="selected">地球</button>
    <button data-body="moon">月球</button>
    <button data-body="mars">火星</button>
    <button data-body="jupiter">木星</button>
  </div>

  <!-- 收束句 -->
  <p class="note" style="margin:0; border:0; padding:0; font-size: var(--fs-sec); line-height: var(--lh-sec); color: var(--muted);">
    表面把身体往下拉的力气越大，站直、跳起、离开都越费劲——天体尺度的差异，用一台体重秤就能显示出来。
  </p>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 26,
  kicker: "SURFACE GRAVITY",
  title: "天体体重秤",
  take: "同一具身体的质量不变，但它在不同天体上的重量可以相差十几倍。"
});

(function() {
  var REFERENCE_MASS = 60;
  // 木星表面重力（1 bar 气压面）不在 Lec.K 中，按规划存疑节建议取值 24.79 m/s²
  var JUPITER_GRAVITY = 24.79;

  var bodies = [
    { id: 'earth',   name: '地球', gravity: Lec.K.EARTH_GRAVITY_MPS2 },
    { id: 'moon',    name: '月球', gravity: Lec.K.MOON_GRAVITY_MPS2 },
    { id: 'mars',    name: '火星', gravity: Lec.K.MARS_GRAVITY_MPS2 },
    { id: 'jupiter', name: '木星', gravity: JUPITER_GRAVITY }
  ];

  // 计算各天体数据
  bodies.forEach(function(b) {
    b.weight = Lec.P.weightOnBody(REFERENCE_MASS, b.gravity);
    b.ratio = Lec.P.gravityRatio(b.gravity);
    b.weightRounded = Lec.P.round(b.weight, 0);
    b.ratioRounded = Lec.P.round(b.ratio, 2);
  });

  // 填充表格
  bodies.forEach(function(b) {
    document.getElementById('cell-gravity-' + b.id).textContent = Lec.P.round(b.gravity, 2) + ' m/s²';
    document.getElementById('cell-weight-' + b.id).textContent = b.weightRounded + ' kg';
    document.getElementById('cell-ratio-' + b.id).textContent = b.ratioRounded.toFixed(2);
  });

  // DOM 引用
  var earthBar = document.getElementById('earth-bar');
  var earthValue = document.getElementById('earth-value');
  var targetBar = document.getElementById('target-bar');
  var targetValue = document.getElementById('target-value');
  var targetLabel = document.getElementById('target-label');
  var ratioBadge = document.getElementById('ratio-badge');
  var buttons = document.querySelectorAll('[data-body]');

  // 地球数据
  var earth = bodies[0];

  // 最大参考重量（用于计算 bar 宽度百分比，以 Jupiter 为上限）
  var MAX_WEIGHT = 200;

  function updateBars(targetId) {
    var target = bodies.find(function(b) { return b.id === targetId; });
    if (!target) return;

    // 地球条不变
    var earthPct = (earth.weight / MAX_WEIGHT) * 100;
    earthBar.style.width = earthPct + '%';
    earthValue.textContent = earth.weightRounded + ' kg';

    // 目标条
    var targetPct = (target.weight / MAX_WEIGHT) * 100;
    targetBar.style.width = targetPct + '%';
    targetValue.textContent = target.weightRounded + ' kg';
    targetLabel.textContent = target.name;

    // 比率徽章
    var ratio = target.ratio;
    var badgeText;
    if (target.id === 'moon') {
      badgeText = '≈ 1/6';
    } else if (target.id === 'mars') {
      badgeText = '≈ 0.38';
    } else if (target.id === 'earth') {
      badgeText = '1.00';
    } else {
      badgeText = '≈ ' + ratio.toFixed(1) + '×';
    }
    ratioBadge.textContent = badgeText;

    // 按钮状态
    buttons.forEach(function(btn) {
      btn.classList.toggle('selected', btn.getAttribute('data-body') === targetId);
    });
  }

  // 初始默认显示木星
  updateBars('jupiter');

  // 绑定点击
  buttons.forEach(function(btn) {
    btn.addEventListener('click', function() {
      updateBars(btn.getAttribute('data-body'));
    });
  });
})();
</script>
</body>
</html>
