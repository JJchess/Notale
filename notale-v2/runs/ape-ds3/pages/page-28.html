<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ---- Page-specific tokens ---- */
#main {
  --fuel-h: #b45309;
  --fuel-bg: rgba(180,83,9,.12);
  --dry-h: #4b5563;
  --dry-bg: rgba(75,85,99,.10);
  --payload-h: #0b7a75;
  --payload-bg: rgba(11,122,117,.14);
  --human-line: #dc2626;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  gap: var(--space-6);
  padding: var(--space-5) var(--space-7) var(--space-5) var(--space-7);
}

/* ===== Left: Stack bar ===== */
.stack-section {
  flex: 6;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 0;
  position: relative;
}

.stack-wrapper {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 360px;
}

.stack-axis {
  position: relative;
  width: 140px;
  height: 460px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: stretch;
  border-left: 2px solid var(--line);
  border-bottom: 2px solid var(--line);
}

.stack-bar {
  position: relative;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  transition: height .6s ease;
  overflow: visible;
}

.layer {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  cursor: pointer;
  transition: all .5s ease;
  position: relative;
  overflow: visible;
  min-height: 6px;
  border-top: 1px solid rgba(255,255,255,.15);
}

.layer:first-child {
  border-top: none;
}

.layer.fuel {
  background: var(--fuel-h);
  border-radius: 4px 4px 0 0;
}
.layer.dry {
  background: var(--dry-h);
}
.layer.payload {
  background: var(--payload-h);
  border-radius: 0 0 4px 4px;
}

.layer.peeled {
  opacity: 0;
  transform: translateX(-30px);
  pointer-events: none;
  min-height: 0 !important;
  height: 0 !important;
  flex: 0 0 0 !important;
  margin: 0;
  padding: 0;
  border: none;
}

/* Human reference on stack bar */
.human-ref {
  position: absolute;
  right: -8px;
  bottom: 32px;
  display: none;
  align-items: center;
  gap: var(--space-2);
  pointer-events: none;
  z-index: 5;
}
.human-ref.visible {
  display: flex;
}
.human-line {
  width: 24px;
  height: 1px;
  background: var(--human-line);
  flex-shrink: 0;
  margin-left: auto;
}
.human-label {
  font-size: var(--fs-label);
  color: var(--human-line);
  white-space: nowrap;
  font-weight: 600;
  letter-spacing: .02em;
}

/* Axis tick marks */
.tick-mark {
  position: absolute;
  right: 0;
  font-size: var(--fs-tick);
  color: var(--muted);
  white-space: nowrap;
  pointer-events: none;
  line-height: 1;
  transform: translateX(calc(100% + 8px));
}
.tick-3000 {
  top: -10px;
}
.tick-0 {
  bottom: -8px;
}

/* ===== Right: Info panel ===== */
.info-section {
  flex: 4;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: var(--space-4);
  min-width: 0;
}

.remaining-mass {
  font-size: 52px;
  font-weight: 800;
  line-height: 1.05;
  color: var(--text);
  transition: all .5s ease;
  letter-spacing: -.02em;
}
.remaining-mass .unit {
  font-size: var(--fs-h2);
  font-weight: 400;
  color: var(--muted);
  margin-left: var(--space-1);
}
.remaining-label {
  font-size: var(--fs-sec);
  color: var(--muted);
  line-height: var(--lh-sec);
  margin-top: calc(var(--space-1) * -1);
}

/* k-classification structure for layers */
.k-classification {
  margin-top: var(--space-2);
}
.k-classification .box {
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: transparent;
  overflow: hidden;
}
.k-classification .box .bt {
  padding: var(--space-1) var(--space-3);
  background: var(--accent-soft);
  border-bottom: 1px solid var(--line);
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--text);
  letter-spacing: .03em;
  cursor: pointer;
  transition: all .3s ease;
}
.k-classification .box .bt:focus-visible,
.layer:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.k-classification .box .bt.bt-fuel {
  background: var(--fuel-bg);
  border-left: 4px solid var(--fuel-h);
}
.k-classification .box .bt.bt-dry {
  background: var(--dry-bg);
  border-left: 4px solid var(--dry-h);
}
.k-classification .box .bt.bt-payload {
  background: var(--payload-bg);
  border-left: 4px solid var(--payload-h);
}
.k-classification .box .bt .pct {
  font-weight: 400;
  color: var(--muted);
  font-size: var(--fs-tick);
}
.k-classification .box .bt .mass-val {
  font-weight: 400;
  color: var(--muted);
}
.k-classification .box .bt.peeled {
  opacity: .35;
  text-decoration: line-through;
}
.k-classification .box .bt:hover {
  filter: brightness(1.08);
}
.k-classification .lv .lv {
  border-left: 1px solid var(--accent-soft);
  margin-left: var(--space-3);
  padding-left: var(--space-3);
  padding-top: var(--space-1);
  padding-bottom: var(--space-1);
  font-size: var(--fs-sec);
  color: var(--muted);
}

.annotation {
  font-size: var(--fs-sec);
  color: var(--muted);
  line-height: var(--lh-sec);
  border-left: 3px solid var(--accent-soft);
  padding-left: var(--space-3);
  min-height: 2.4em;
  transition: opacity .3s ease;
}

.reset-btn {
  padding: var(--space-1) var(--space-3);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: transparent;
  cursor: pointer;
  font-size: var(--fs-label);
  color: var(--muted);
  font-family: inherit;
  align-self: flex-start;
  transition: all .2s ease;
}
.reset-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.reset-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ===== State transitions ===== */
.stack-bar .layer {
  transition: opacity .5s ease, transform .5s ease, flex .6s ease, height .6s ease, min-height .6s ease;
}
</style>
</head>
<body data-page="28" data-total="50">
<div id="stage">
<main id="main">
  <!-- Left: Stack bar -->
  <div class="stack-section">
    <div class="stack-wrapper">
      <div class="stack-axis">
        <!-- Tick marks -->
        <span class="tick-mark tick-3000">3 000 t</span>
        <span class="tick-mark tick-0">0</span>

        <!-- The stack bar -->
        <div class="stack-bar" id="stack-bar">
          <div class="layer fuel" data-layer="fuel" id="layer-fuel" tabindex="0" role="button" aria-label="燃料层 2 700 t，占 90%" style="flex:2700 1 0;"></div>
          <div class="layer dry" data-layer="dry" id="layer-dry" tabindex="0" role="button" aria-label="干质量层 255 t，占 8.5%" style="flex:255 1 0;"></div>
          <div class="layer payload" data-layer="payload" id="layer-payload" tabindex="0" role="button" aria-label="载荷层 45 t，占 1.5%" style="flex:45 1 0;"></div>
        </div>

        <!-- Human reference red line -->
        <div class="human-ref" id="human-ref">
          <span class="human-line"></span>
          <span class="human-label">70 kg 人 · 不按比例</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Right: Info panel -->
  <div class="info-section">
    <div class="remaining-mass" id="remaining-mass">3 000 <span class="unit">t</span></div>
    <div class="remaining-label">出发质量</div>

    <div class="k-classification" id="class-tree">
      <div class="box">
        <div class="bt bt-fuel" data-layer="fuel" id="btn-fuel" tabindex="0" role="button">
          <span>燃料</span>
          <span class="mass-val">2 700 t</span>
          <span class="pct">90%</span>
        </div>
        <div class="bt bt-dry" data-layer="dry" id="btn-dry" tabindex="0" role="button">
          <span>干质量</span>
          <span class="mass-val">255 t</span>
          <span class="pct">8.5%</span>
        </div>
        <div class="bt bt-payload" data-layer="payload" id="btn-payload" tabindex="0" role="button">
          <span>载荷</span>
          <span class="mass-val">45 t</span>
          <span class="pct">1.5%</span>
        </div>
        <div class="lv">
          乘员 70 kg（约 0.07 t）
        </div>
      </div>
    </div>

    <div class="annotation" id="annotation">每一样要送上去的东西，都得先背着自己的燃料和铁壳，从引力井里硬爬出去。</div>

    <button class="reset-btn" id="reset-btn">← 重置</button>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 28,
  kicker: "逃离 · 重力账单",
  title: "3000 吨，换 1 个人",
  take: "土星五号 90% 是燃料——3000 吨出发质量，送 1 个人，最后只剩 70 公斤。"
});

/* ---- Saturn V mass constants (not yet in Lec.K) ---- */
var LAUNCH_MASS_T  = 3000;
var FUEL_MASS_T    = 2700;
var DRY_MASS_T     = 255;
var PAYLOAD_MASS_T = 45;
var HUMAN_MASS_KG  = 70;
var HUMAN_MASS_T   = HUMAN_MASS_KG / 1000;

/* State: which layers have been peeled off */
var peeled = { fuel: false, dry: false, payload: false };

/* DOM refs */
var stackBar   = document.getElementById('stack-bar');
var layerFuel  = document.getElementById('layer-fuel');
var layerDry   = document.getElementById('layer-dry');
var layerPay   = document.getElementById('layer-payload');
var remMass    = document.getElementById('remaining-mass');
var annot      = document.getElementById('annotation');
var humanRef   = document.getElementById('human-ref');
var btnFuel    = document.getElementById('btn-fuel');
var btnDry     = document.getElementById('btn-dry');
var btnPay     = document.getElementById('btn-payload');

/* ---- Update everything ---- */
function update() {
  var f = peeled.fuel, d = peeled.dry, p = peeled.payload;

  /* Toggle peeled class on layers */
  layerFuel.classList.toggle('peeled', f);
  layerDry.classList.toggle('peeled', d);
  layerPay.classList.toggle('peeled', p);

  /* Toggle peeled class on buttons */
  btnFuel.classList.toggle('peeled', f);
  btnDry.classList.toggle('peeled', d);
  btnPay.classList.toggle('peeled', p);

  /* Compute remaining mass */
  var rem = LAUNCH_MASS_T;
  if (f) rem -= FUEL_MASS_T;
  if (d) rem -= DRY_MASS_T;
  if (p) rem -= PAYLOAD_MASS_T;

  /* Update remaining mass display */
  var remText, unitText = '<span class="unit">t</span>';

  if (p) {
    /* All three peeled → show human reference */
    remText = '~0.07';
    remMass.innerHTML = remText + ' ' + unitText;
    annot.textContent = '出发时每 1 名乘员身上，压着约 40 000 倍于自身质量的燃料和结构。';
    humanRef.classList.add('visible');
  } else if (d && !p) {
    /* Fuel + dry peeled → only payload */
    remText = '45';
    remMass.innerHTML = remText + ' ' + unitText;
    annot.textContent = '去掉燃料和空壳，真正要送上去的只有飞船本身。';
    humanRef.classList.remove('visible');
  } else if (f && !d) {
    /* Only fuel peeled → dry + payload */
    remText = '300';
    remMass.innerHTML = remText + ' ' + unitText;
    annot.textContent = '烧掉燃料后，剩下的只是空壳和飞船。';
    humanRef.classList.remove('visible');
  } else {
    /* Nothing peeled */
    remText = '3 000';
    remMass.innerHTML = remText + ' ' + unitText;
    annot.textContent = '每一样要送上去的东西，都得先背着自己的燃料和铁壳，从引力井里硬爬出去。';
    humanRef.classList.remove('visible');
  }
}

/* ---- Peel a layer ---- */
function peelLayer(layer) {
  if (peeled[layer]) return;
  peeled[layer] = true;
  update();
}

/* ---- Click and keyboard handlers: on both layers and buttons ---- */
function attachClick(el) {
  el.addEventListener('click', function(e) {
    peelLayer(this.dataset.layer);
  });
  el.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      peelLayer(this.dataset.layer);
    }
  });
}
attachClick(layerFuel);
attachClick(layerDry);
attachClick(layerPay);
attachClick(btnFuel);
attachClick(btnDry);
attachClick(btnPay);

/* ---- Reset ---- */
document.getElementById('reset-btn').addEventListener('click', function() {
  peeled = { fuel: false, dry: false, payload: false };
  update();
});

/* ---- Initial render ---- */
update();
</script>
</body>
</html>
