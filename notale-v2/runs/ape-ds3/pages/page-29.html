<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ── page-29 specific layout ── */
#main {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  overflow: hidden;
}

/* left panel */
.left-panel {
  width: 300px;
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  padding: var(--space-5) var(--space-4);
  gap: var(--space-4);
  border-right: 1px solid var(--line);
  overflow-y: auto;
}

.left-panel .section-title {
  font-size: var(--fs-h2);
  font-weight: 700;
  line-height: var(--lh-h2);
  color: var(--text);
  margin: 0;
}

/* slider area */
.slider-area {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.slider-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.slider-header .label {
  font-size: var(--fs-label);
  color: var(--muted);
  font-weight: 600;
}

.slider-header .speed-readout {
  font-size: var(--fs-lead);
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.slider-header .speed-readout .unit {
  font-size: var(--fs-label);
  font-weight: 400;
  color: var(--muted);
}

/* custom slider track with markers */
.slider-track-wrap {
  position: relative;
  padding: var(--space-3) 0;
}

#speedSlider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  background: var(--line);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
  margin: 0;
}

#speedSlider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--surface);
  box-shadow: 0 0 0 1px var(--accent);
  cursor: pointer;
}

#speedSlider::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--surface);
  box-shadow: 0 0 0 1px var(--accent);
  cursor: pointer;
}

/* step markers on the slider track */
.step-markers {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
  pointer-events: none;
}

.step-marker {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--muted);
  border: 1px solid var(--surface);
  z-index: 1;
}

.step-marker.active {
  background: var(--accent);
  width: 8px;
  height: 8px;
}

.step-marker-label {
  position: absolute;
  top: calc(50% + 10px);
  transform: translateX(-50%);
  font-size: var(--fs-tick);
  color: var(--muted);
  white-space: nowrap;
  z-index: 1;
  font-family: var(--font-sans);
}

/* critical speed labels */
.critical-labels {
  display: flex;
  justify-content: space-between;
  font-size: var(--fs-label);
  color: var(--muted);
  padding: 0 var(--space-1);
}

.critical-labels .cr {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
}

.critical-labels .cr .val {
  font-size: var(--fs-tick);
  font-weight: 600;
  color: var(--text);
}

/* step description */
.step-desc {
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--text);
  padding: var(--space-3);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  min-height: 48px;
  display: flex;
  align-items: center;
}

.step-desc .step-num {
  display: inline-block;
  width: 24px;
  height: 24px;
  line-height: 24px;
  text-align: center;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: var(--fs-tick);
  font-weight: 700;
  margin-right: var(--space-2);
  flex-shrink: 0;
}

/* key insights */
.key-insights {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.key-insights .insight {
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
  color: var(--text);
  padding: var(--space-2) var(--space-3);
  border-left: 3px solid var(--accent);
  background: var(--accent-soft);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

/* canvas wrapper */
.canvas-wrap {
  flex: 1;
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

#orbitCanvas {
  display: block;
}

/* responsive adjustments */
@media (max-width: 1366px) {
  .left-panel {
    width: 280px;
    padding: var(--space-4) var(--space-3);
  }
}
</style>
</head>
<body data-page="29" data-total="50">
<div id="stage">
<main id="main">

  <!-- left panel -->
  <div class="left-panel">
    <div class="section-title">抛球速度</div>

    <div class="slider-area">
      <div class="slider-header">
        <span class="label">水平速度</span>
        <span class="speed-readout" id="speedReadout">0.0 <span class="unit">km/s</span></span>
      </div>

      <div class="slider-track-wrap">
        <input type="range" id="speedSlider" min="0" max="1" step="0.001" value="0.35">
        <div class="step-markers" id="stepMarkers"></div>
      </div>

      <div class="critical-labels" id="criticalLabels">
        <div class="cr">
          <span class="val" id="circularLabel">—</span>
          <span>轨道速度</span>
        </div>
        <div class="cr">
          <span class="val" id="escapeLabel">—</span>
          <span>逃逸速度</span>
        </div>
      </div>
    </div>

    <div class="step-desc" id="stepDesc">
      <span class="step-num" id="stepNum">1</span>
      <span id="stepText">慢速 · 短弧线坠落，撞地</span>
    </div>

    <div class="key-insights">
      <div class="insight">轨道不是「飞出去了」，而是「一直在掉，但永远够不着地面」。</div>
      <div class="insight">够不着不是因为掉得慢，是因为地球是圆的——地面在向前弯曲。</div>
    </div>
  </div>

  <!-- right canvas -->
  <div class="canvas-wrap">
    <canvas id="orbitCanvas" class="cv-fill"></canvas>
  </div>

</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function () {
  'use strict';

  Lec.mount({ index: 29, kicker: '第三章 逃离', title: '轨道不是飞出去', take: '轨道不是「飞出去了」，而是「一直在掉，但永远够不着地面」' });

  /* ── constants ── */
  var R = Lec.K.EARTH_RADIUS_KM;          // 6371 km
  var g = Lec.K.EARTH_GRAVITY_MPS2 / 1000; // 0.00980665 km/s²
  var vEsc = Lec.K.EARTH_ESCAPE_VELOCITY_KMPS; // ~11.186 km/s
  var vCirc = Math.sqrt(g * R);            // ≈7.905 km/s

  /* ── DOM refs ── */
  var cv = document.getElementById('orbitCanvas');
  var slider = document.getElementById('speedSlider');
  var speedReadout = document.getElementById('speedReadout');
  var stepDesc = document.getElementById('stepDesc');
  var stepNum = document.getElementById('stepNum');
  var stepText = document.getElementById('stepText');
  var stepMarkers = document.getElementById('stepMarkers');
  var circularLabel = document.getElementById('circularLabel');
  var escapeLabel = document.getElementById('escapeLabel');

  /* ── step definitions ── */
  var steps = [
    { id: 1, label: '慢速',  desc: '短弧线坠落，撞地' },
    { id: 2, label: '中速',  desc: '弧线变长，仍落回地面' },
    { id: 3, label: '临界',  desc: '绕到对面，不再撞地——近圆轨道' },
    { id: 4, label: '轨道',  desc: '椭圆轨道，持续绕行' },
    { id: 5, label: '高速',  desc: '椭圆拉长，接近逃逸' },
    { id: 6, label: '逃逸',  desc: '轨迹不再闭合，一去不返' }
  ];

  /* ── physics state ── */
  var mountainH = 0.03 * R;                // ~191 km, visible mountain
  var simDt = 0.5;                         // seconds per simulation step
  var maxSteps = 50000;
  var trajectory = [];                     // array of {x,y} in km
  var hitPoint = null;                     // {x,y} in km, or null
  var isEscape = false;
  var ballIdx = 0;
  var animSpeed = 20;                      // steps per frame

  /* ── canvas state ── */
  var ctx, W, H;
  var earthCx, earthCy, earthR;            // Earth center & radius in canvas pixels
  var scalePx;                             // pixels per km

  function initCanvas() {
    ctx = Deck.fit(cv);
    W = cv.width;
    H = cv.height;

    // Earth in lower-right portion
    earthR = Math.min(W * 0.30, H * 0.55);
    earthR = Math.min(earthR, 240);
    earthCx = W * 0.58;
    earthCy = H * 0.78;
    scalePx = earthR / R;

    // update critical labels
    circularLabel.textContent = vCirc.toFixed(1) + ' km/s';
    escapeLabel.textContent = vEsc.toFixed(1) + ' km/s';

    // build step markers on slider
    buildStepMarkers();

    // initial trajectory
    updateTrajectory();
  }

  /* ── step markers on the slider track ── */
  function buildStepMarkers() {
    stepMarkers.innerHTML = '';
    var stepSpeeds = [
      1.0,
      4.0,
      vCirc,
      9.0,
      10.5,
      vEsc
    ];
    var maxSpeed = vEsc * 1.1;

    steps.forEach(function (s, i) {
      var t = stepSpeeds[i] / maxSpeed;
      var pct = Math.min(Math.max(t * 100, 2), 98);

      var dot = document.createElement('div');
      dot.className = 'step-marker';
      dot.dataset.step = s.id;
      dot.style.left = pct + '%';
      stepMarkers.appendChild(dot);

      var lbl = document.createElement('div');
      lbl.className = 'step-marker-label';
      lbl.textContent = s.id;
      lbl.style.left = pct + '%';
      stepMarkers.appendChild(lbl);
    });
  }

  /* ── trajectory computation ── */
  function computeTrajectory(speed) {
    var pts = [];
    var px = 0, py = R + mountainH;
    var vx = speed, vy = 0;
    var hit = null;
    var escaped = false;
    var r2Threshold = (R * 50) * (R * 50);

    for (var i = 0; i < maxSteps; i++) {
      pts.push({ x: px, y: py });

      var r2 = px * px + py * py;
      var r = Math.sqrt(r2);

      // hit Earth
      if (r < R) {
        hit = { x: px, y: py };
        break;
      }

      // escaped far away
      if (r2 > r2Threshold) {
        // Add a few more points to show the direction
        for (var j = 0; j < 10; j++) {
          var a = g * (R / r) * (R / r);
          var ax = -a * px / r;
          var ay = -a * py / r;
          vx += ax * simDt;
          vy += ay * simDt;
          px += vx * simDt;
          py += vy * simDt;
          pts.push({ x: px, y: py });
          r = Math.sqrt(px * px + py * py);
          if (r < R) { hit = { x: px, y: py }; break; }
        }
        escaped = true;
        break;
      }

      // gravity
      var a = g * (R / r) * (R / r);
      var ax = -a * px / r;
      var ay = -a * py / r;
      vx += ax * simDt;
      vy += ay * simDt;
      px += vx * simDt;
      py += vy * simDt;
    }

    // If we ran out of steps without hitting or escaping, it's a bound orbit
    return { points: pts, hit: hit, escaped: escaped };
  }

  /* ── determine step from trajectory ── */
  function determineStep(speed, result) {
    if (result.escaped) return 6;
    if (result.hit) {
      // Find how far the ball went
      var maxDist = 0;
      for (var i = 0; i < result.points.length; i++) {
        var d = Math.sqrt(result.points[i].x * result.points[i].x + result.points[i].y * result.points[i].y);
        if (d > maxDist) maxDist = d;
      }
      // Short arc vs long arc threshold: if maxDist > 2*R, it went far
      if (maxDist > 2.5 * R) return 2;
      return 1;
    }
    // Bound orbit: check eccentricity
    // Find apogee and perigee
    var minR = Infinity, maxR = 0;
    for (var i = 0; i < result.points.length; i++) {
      var r = Math.sqrt(result.points[i].x * result.points[i].x + result.points[i].y * result.points[i].y);
      if (r < minR) minR = r;
      if (r > maxR) maxR = r;
    }
    // Check if near-circular
    var ecc = (maxR - minR) / (maxR + minR);
    if (ecc < 0.08) return 3;
    // Check if very elongated
    if (ecc > 0.6 || maxR > 5 * R) return 5;
    return 4;
  }

  /* ── update trajectory from slider ── */
  function updateTrajectory() {
    var t = parseFloat(slider.value);
    var maxSpeed = vEsc * 1.1;
    var speed = t * maxSpeed;

    // update readout
    speedReadout.innerHTML = speed.toFixed(1) + ' <span class="unit">km/s</span>';

    // compute trajectory
    var result = computeTrajectory(speed);
    trajectory = result.points;
    hitPoint = result.hit;
    isEscape = result.escaped;

    // determine step
    var stepIdx = determineStep(speed, result);
    var step = steps[stepIdx - 1];
    stepNum.textContent = step.id;
    stepText.textContent = step.label + ' · ' + step.desc;

    // update step marker highlights
    var markers = stepMarkers.querySelectorAll('.step-marker');
    markers.forEach(function (m) {
      var s = parseInt(m.dataset.step);
      m.classList.toggle('active', s === stepIdx);
    });

    // reset animation
    ballIdx = 0;
  }

  /* ── rendering ── */
  function drawScene() {
    ctx.clearRect(0, 0, W, H);

    // 1. Draw Earth
    drawEarth();

    // 2. Draw mountain
    drawMountain();

    // 3. Draw trajectory
    drawTrajectoryPath();

    // 4. Draw ball
    drawBall();

    // 5. Draw impact marker
    if (hitPoint && ballIdx >= trajectory.length - 1) {
      drawImpact();
    }

    // 6. Draw speed label on canvas
    drawSpeedLabel();
  }

  function drawEarth() {
    var cx = earthCx, cy = earthCy, r = earthR;

    // Atmosphere glow
    var grad = ctx.createRadialGradient(cx, cy, r * 0.85, cx, cy, r * 1.08);
    grad.addColorStop(0, 'rgba(20, 80, 120, 0)');
    grad.addColorStop(0.7, 'rgba(20, 80, 120, 0.08)');
    grad.addColorStop(1, 'rgba(20, 80, 120, 0.15)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 1.08, 0, Math.PI * 2);
    ctx.fill();

    // Earth body
    var earthGrad = ctx.createRadialGradient(
      cx - r * 0.3, cy - r * 0.3, r * 0.1,
      cx, cy, r
    );
    earthGrad.addColorStop(0, '#1a3a4a');
    earthGrad.addColorStop(0.4, '#0f2838');
    earthGrad.addColorStop(0.7, '#0a1e2a');
    earthGrad.addColorStop(1, '#060f18');
    ctx.fillStyle = earthGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    // Earth outline
    ctx.strokeStyle = 'rgba(100, 180, 220, 0.25)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();

    // Grid lines on Earth (latitude/longitude hints)
    ctx.strokeStyle = 'rgba(100, 180, 220, 0.08)';
    ctx.lineWidth = 1;
    // Equator
    ctx.beginPath();
    ctx.ellipse(cx, cy, r, r * 0.05, 0, 0, Math.PI * 2);
    ctx.stroke();
    // Prime meridian
    ctx.beginPath();
    ctx.ellipse(cx, cy, r * 0.05, r, 0, 0, Math.PI * 2);
    ctx.stroke();

    // "地球" label
    ctx.fillStyle = 'rgba(180, 210, 230, 0.5)';
    ctx.font = '14px ' + getComputedStyle(document.documentElement).getPropertyValue('--font-sans').trim();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('地球', cx, cy);
  }

  function drawMountain() {
    var cx = earthCx, cy = earthCy;
    var r = earthR;
    var mtnH = 12; // mountain height in pixels
    var mtnW = 8;

    // Launch point at the top of the Earth (consistent with ball start position)
    var angle = -Math.PI / 2;
    var mx = cx + (r - 2) * Math.cos(angle);
    var my = cy + (r - 2) * Math.sin(angle);

    // Mountain triangle
    ctx.fillStyle = 'rgba(80, 100, 110, 0.6)';
    ctx.beginPath();
    ctx.moveTo(mx - mtnW, my + 2);
    ctx.lineTo(mx, my - mtnH);
    ctx.lineTo(mx + mtnW, my + 2);
    ctx.closePath();
    ctx.fill();

    // Mountain outline
    ctx.strokeStyle = 'rgba(180, 200, 210, 0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Small platform at top
    ctx.fillStyle = 'rgba(180, 200, 210, 0.2)';
    ctx.fillRect(mx - 2, my - mtnH - 1, 4, 2);
  }

  function drawTrajectoryPath() {
    if (trajectory.length < 2) return;

    var cx = earthCx, cy = earthCy;

    // Draw full trajectory
    ctx.beginPath();
    var first = trajectory[0];
    ctx.moveTo(cx + first.x * scalePx, cy - first.y * scalePx);

    for (var i = 1; i < trajectory.length; i++) {
      var p = trajectory[i];
      ctx.lineTo(cx + p.x * scalePx, cy - p.y * scalePx);
    }

    // Style: bright accent color
    var isOrbit = !hitPoint && !isEscape;
    var isFast = isEscape;

    if (isFast) {
      ctx.strokeStyle = '#f59e0b'; // amber for escape
      ctx.lineWidth = 2.5;
    } else if (isOrbit) {
      ctx.strokeStyle = '#0ea5e9'; // sky blue for orbit
      ctx.lineWidth = 2.5;
    } else {
      ctx.strokeStyle = '#f87171'; // red for hitting
      ctx.lineWidth = 2;
    }

    ctx.stroke();

    // Glow effect
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = 6;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function drawBall() {
    if (trajectory.length === 0) return;

    var idx = Math.min(ballIdx, trajectory.length - 1);
    var p = trajectory[idx];
    var cx = earthCx + p.x * scalePx;
    var cy = earthCy - p.y * scalePx;

    // Glow
    var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 10);
    grad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
    grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.3)');
    grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, 10, 0, Math.PI * 2);
    ctx.fill();

    // Ball
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fill();

    // Bright center
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.beginPath();
    ctx.arc(cx - 1, cy - 1, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawImpact() {
    if (!hitPoint) return;
    var cx = earthCx + hitPoint.x * scalePx;
    var cy = earthCy - hitPoint.y * scalePx;

    // Check if within Earth boundary
    var dx = cx - earthCx, dy = cy - earthCy;
    if (dx * dx + dy * dy < earthR * earthR * 0.95) return;

    ctx.fillStyle = '#f87171';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✕', cx, cy);

    // Flash effect
    var t = Date.now() / 300;
    var alpha = 0.3 + 0.7 * Math.abs(Math.sin(t));
    ctx.fillStyle = 'rgba(248, 113, 113, ' + alpha + ')';
    ctx.beginPath();
    ctx.arc(cx, cy, 12, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSpeedLabel() {
    // Draw speed value on canvas
    var speed = parseFloat(slider.value) * vEsc * 1.1;
    var cx = earthCx, cy = earthCy;

    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.font = '14px ' + getComputedStyle(document.documentElement).getPropertyValue('--font-sans').trim();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('速度: ' + speed.toFixed(1) + ' km/s', 16, 16);

    // Draw reference lines
    var refY = 36;
    ctx.fillStyle = 'rgba(14, 165, 233, 0.6)';
    ctx.font = '14px ' + getComputedStyle(document.documentElement).getPropertyValue('--font-sans').trim();
    ctx.textAlign = 'left';
    ctx.fillText('轨道速度: ' + vCirc.toFixed(1) + ' km/s', 16, refY);

    ctx.fillStyle = 'rgba(245, 158, 11, 0.6)';
    ctx.fillText('逃逸速度: ' + vEsc.toFixed(1) + ' km/s', 16, refY + 18);
  }

  /* ── animation loop ── */
  function animate() {
    drawScene();

    // Advance ball
    if (trajectory.length > 0) {
      ballIdx += animSpeed;
      if (ballIdx >= trajectory.length) {
        // Restart if not hitting Earth (orbit or escape)
        if (!hitPoint) {
          ballIdx = 0;
        } else {
          // Stay at impact point
          ballIdx = trajectory.length - 1;
        }
      }
    }
  }

  /* ── init ── */
  function init() {
    initCanvas();
    Deck.loop(animate);

    // Slider input
    slider.addEventListener('input', function () {
      updateTrajectory();
    });

    // Resize
    Deck.onResize(function () {
      initCanvas();
    });

    // Keyboard support: left/right arrow on slider
    slider.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        // Let the browser handle it
        return;
      }
    });
  }

  document.addEventListener('DOMContentLoaded', init);
  // Also call init if already loaded
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    init();
  }
})();
</script>
</body>
</html>
