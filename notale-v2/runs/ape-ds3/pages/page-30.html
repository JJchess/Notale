<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== page-30: 举国之力，十二个人 ===== */
/* ledger-style comparison: 投入规模 vs 带回的东西 */

#main {
  display: flex;
  flex-direction: column;
  padding: 0 var(--space-5);
  overflow: hidden;
}

/* ---- top divider & column headers ---- */
.ledger-top {
  flex: 0 0 auto;
  border-top: 1px solid var(--line);
  padding-top: var(--space-3);
  margin-bottom: var(--space-2);
}
.ledger-hdrs {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 0;
}
.ledger-hdr {
  flex: 1;
  font-size: var(--fs-label);
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  padding-bottom: var(--space-1);
  border-bottom: 1px solid var(--line);
}
.ledger-hdr.left {
  text-align: left;
  padding-right: var(--space-4);
}
.ledger-hdr.right {
  text-align: left;
  padding-left: var(--space-4);
}

/* ---- photos row ---- */
.ledger-photos {
  flex: 0 0 auto;
  display: flex;
  flex-direction: row;
  gap: var(--space-5);
  margin-bottom: var(--space-2);
}
.ledger-photo {
  flex: 1;
  height: 96px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
}
.ledger-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* ---- rows container ---- */
.ledger-rows {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0;
  min-height: 0;
}

/* ---- single ledger row ---- */
.ledger-row {
  flex: 1;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  gap: 0;
  min-height: 0;
  border-bottom: 1px solid var(--line);
  position: relative;
  overflow: visible;
}
.ledger-row:last-child {
  border-bottom: none;
}

/* left cell – clickable input card */
.row-left {
  flex: 1;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: background 0.2s ease, border-color 0.2s ease;
  border: 1px solid transparent;
  position: relative;
  min-width: 0;
}
.row-left:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
}
.row-left:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.row-left .row-marker {
  flex: 0 0 auto;
  width: 4px;
  border-radius: 2px;
  background: var(--accent);
  align-self: stretch;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.row-left .row-marker.is-visited {
  opacity: 1;
}
.row-left .row-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.row-left .row-value {
  font-size: var(--fs-h2);
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
}
.row-left .row-sub {
  font-size: var(--fs-sec);
  color: var(--muted);
  line-height: 1.35;
}
.row-left .row-hint {
  font-size: var(--fs-label);
  color: var(--accent);
  opacity: 0.7;
  margin-top: 2px;
}

/* connector line – drawn between left and right cells */
.row-connector {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 64px;
  height: 1px;
  background: var(--accent);
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
  z-index: 1;
}
.row-connector.is-visible {
  opacity: 1;
}
.row-connector::after {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  transform: translate(50%, -50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}

/* right cell – initially dim, reveals on click */
.row-right {
  flex: 1;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  min-width: 0;
  opacity: 0.12;
  transition: opacity 0.5s ease, background 0.3s ease;
  background: transparent;
}
.row-right.is-revealed {
  opacity: 1;
  background: var(--accent-soft);
}
.row-right .row-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.row-right .row-value {
  font-size: var(--fs-h2);
  font-weight: 700;
  color: var(--accent);
  line-height: 1.2;
}
.row-right .row-sub {
  font-size: var(--fs-sec);
  color: var(--text);
  line-height: 1.35;
}
.row-right .row-quote {
  font-size: var(--fs-label);
  color: var(--muted);
  font-style: italic;
  line-height: 1.4;
  margin-top: 2px;
}

/* ---- summary row ---- */
.ledger-summary {
  flex: 0 0 auto;
  border-top: 2px solid var(--line);
  padding: var(--space-3) var(--space-3) 0 var(--space-3);
  margin-top: var(--space-2);
  opacity: 0;
  transition: opacity 0.6s ease;
  text-align: center;
}
.ledger-summary.is-visible {
  opacity: 1;
}
.ledger-summary .summary-text {
  font-size: var(--fs-lead);
  font-weight: 700;
  color: var(--accent);
  line-height: var(--lh-lead);
}
.ledger-summary .summary-sub {
  font-size: var(--fs-sec);
  color: var(--muted);
  margin-top: var(--space-1);
  line-height: 1.4;
}
</style>
</head>
<body data-page="30" data-total="50">
<div id="stage">
<main id="main">
  <!-- top divider + column headers -->
  <div class="ledger-top">
    <div class="ledger-hdrs">
      <div class="ledger-hdr left">投入规模</div>
      <div class="ledger-hdr right">带回的东西</div>
    </div>
  </div>

  <!-- photos row -->
  <div class="ledger-photos">
    <div class="ledger-photo">
      <img src="assets/img/02_nasa.jpg" alt="土星五号火箭在发射台" loading="lazy">
    </div>
    <div class="ledger-photo">
      <img src="assets/img/00_nasa.jpg" alt="阿波罗11号宇航员在月面" loading="lazy">
    </div>
  </div>

  <!-- three data rows -->
  <div class="ledger-rows">
    <!-- row 1: people -->
    <div class="ledger-row" data-pair="0">
      <div class="ledger-connector" style="position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;z-index:0;">
        <div class="row-connector"></div>
      </div>
      <div class="row-left" tabindex="0" role="button" aria-label="点击查看对应产出：40万人">
        <div class="row-marker"></div>
        <div class="row-body">
          <div class="row-value">40 万人</div>
          <div class="row-sub">直接与间接参与人员</div>
          <div class="row-hint">点击查看对应产出 →</div>
        </div>
      </div>
      <div class="row-right">
        <div class="row-body">
          <div class="row-value">12 人</div>
          <div class="row-sub">踏上月球表面的人类</div>
          <div class="row-quote">整个国家的重量，落在十二双靴子底下。</div>
        </div>
      </div>
    </div>

    <!-- row 2: cost -->
    <div class="ledger-row" data-pair="1">
      <div class="ledger-connector" style="position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;z-index:0;">
        <div class="row-connector"></div>
      </div>
      <div class="row-left" tabindex="0" role="button" aria-label="点击查看对应产出：约2,800亿美元">
        <div class="row-marker"></div>
        <div class="row-body">
          <div class="row-value">约 2,800 亿美元</div>
          <div class="row-sub">按今日币值折算的总成本</div>
          <div class="row-hint">点击查看对应产出 →</div>
        </div>
      </div>
      <div class="row-right">
        <div class="row-body">
          <div class="row-value">约 382 公斤</div>
          <div class="row-sub">六次登月带回的月岩与土壤</div>
          <div class="row-quote">按公斤算，这趟旅行比黄金还贵。</div>
        </div>
      </div>
    </div>

    <!-- row 3: rocket vs distance -->
    <div class="ledger-row" data-pair="2">
      <div class="ledger-connector" style="position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;z-index:0;">
        <div class="row-connector"></div>
      </div>
      <div class="row-left" tabindex="0" role="button" aria-label="点击查看对应产出：110.6米火箭">
        <div class="row-marker"></div>
        <div class="row-body">
          <div class="row-value">110.6 米</div>
          <div class="row-sub">土星五号火箭全长</div>
          <div class="row-hint">点击查看对应产出 →</div>
        </div>
      </div>
      <div class="row-right">
        <div class="row-body">
          <div class="row-value">38 万公里</div>
          <div class="row-sub">地球到月球的平均距离</div>
          <div class="row-quote">造出历史上最大的火箭，只为碰到最近的天体。</div>
        </div>
      </div>
    </div>
  </div>

  <!-- summary row -->
  <div class="ledger-summary">
    <div class="summary-text">总余额：12 个人，38 万公里外，约 382 公斤岩石。</div>
    <div class="summary-sub">其余全部是代价。这就是逃离地球的物理要价。</div>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  'use strict';

  // --- mount page header ---
  Lec.mount({
    index: 30,
    kicker: 'EFFORT / FOOTPRINT',
    title: '举国之力，十二个人',
    take: '登月是举国之力的工程，而它只把 12 个人送到 38 万公里外。'
  });

  var main = document.getElementById('main');
  var rows = main.querySelectorAll('.ledger-row');
  var leftCells = main.querySelectorAll('.row-left');
  var rightCells = main.querySelectorAll('.row-right');
  var connectors = main.querySelectorAll('.row-connector');
  var summary = main.querySelector('.ledger-summary');
  var visited = [false, false, false];

  function revealPair(index) {
    visited[index] = true;

    // Reveal right cell
    var right = rightCells[index];
    right.classList.add('is-revealed');

    // Show marker on left cell
    var marker = leftCells[index].querySelector('.row-marker');
    marker.classList.add('is-visited');

    // Show connector line
    connectors[index].classList.add('is-visible');

    // Hide hint text on left cell
    var hint = leftCells[index].querySelector('.row-hint');
    if (hint) hint.style.display = 'none';

    // Check if all three visited
    if (visited.every(Boolean)) {
      summary.classList.add('is-visible');
    }
  }

  function handleClick(index) {
    revealPair(index);
  }

  // Attach click/keyboard handlers
  leftCells.forEach(function(cell, i) {
    cell.addEventListener('click', function() { handleClick(i); });
    cell.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleClick(i);
      }
    });
  });

  // For selfcheck: pre-reveal all pairs
  window.__revealAll = function() {
    for (var i = 0; i < 3; i++) revealPair(i);
  };

})();
</script>
</body>
</html>
