<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* page-31 specific: dark theme override for generalization */
.k-generalization {
  width: 100%;
  height: 100%;
}
.k-generalization > .claim {
  max-width: 85%;
  margin: 0 auto;
  font-size: var(--fs-lead);
}
.k-generalization > .trunk {
  height: var(--space-3);
  margin: var(--space-2) 0;
}
.k-generalization > .supports {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: row;
  justify-content: center;
  align-items: stretch;
  gap: 0;
  width: 100%;
}

/* left column */
.left-col {
  flex: 0 0 320px;
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: 0 var(--space-4) 0 0;
  min-height: 0;
}

/* destination cards */
.dest-card {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: border-color .2s, background .2s, box-shadow .2s;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  font-size: var(--fs-body);
  text-align: left;
  width: 100%;
  min-height: 54px;
}
.dest-card:hover {
  border-color: var(--accent);
  background: rgba(11,122,117,0.08);
}
.dest-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.dest-card .card-indicator {
  flex: 0 0 4px;
  width: 4px;
  height: 28px;
  border-radius: 2px;
  background: transparent;
  transition: background .2s;
}
.dest-card.selected .card-indicator {
  background: var(--accent);
}
.dest-card.selected {
  border-color: var(--accent);
  background: rgba(11,122,117,0.15);
  box-shadow: 0 0 0 1px var(--accent);
}
.dest-card .card-name {
  font-size: var(--fs-body);
  font-weight: 600;
}
.dest-card .card-time {
  font-size: var(--fs-label);
  color: var(--muted);
  margin-left: auto;
}
.dest-card.selected .card-time {
  color: var(--accent);
  font-weight: 600;
}

/* reading panel */
.reading-panel {
  text-align: center;
  padding: var(--space-3) var(--space-4);
}
.reading-panel .reading-label {
  font-size: var(--fs-label);
  color: var(--muted);
  margin-bottom: var(--space-1);
}
.reading-panel .reading-dest {
  font-size: var(--fs-h2);
  font-weight: 700;
  margin-bottom: var(--space-1);
}
.reading-panel .reading-time {
  font-size: 28px;
  font-weight: 700;
  color: var(--accent);
}
.reading-panel .reading-ratio {
  font-size: var(--fs-sec);
  color: var(--warning);
  margin-top: var(--space-2);
  min-height: 1.4em;
}

/* right column */
.right-col {
  flex: 1;
  min-width: 0;
  min-height: 0;
  position: relative;
}
#chart {
  width: 100%;
  height: 100%;
}

/* echarts tooltip dark override */
</style>
</head>
<body data-page="31" data-total="50">
<div id="stage">
<main id="main">
<div class="k-generalization">
  <div class="claim">以今天的推进技术，太阳系内是月、年；星际是万年——问题首先是时间</div>
  <div class="trunk"></div>
  <div class="supports">
    <!-- Left column -->
    <div class="left-col">
      <!-- Reading panel -->
      <div class="panel reading-panel">
        <div class="reading-label">旅行时间</div>
        <div class="reading-dest" id="rd-dest">火星</div>
        <div class="reading-time" id="rd-time">约 7 个月</div>
        <div class="reading-ratio" id="rd-ratio"></div>
      </div>

      <!-- Destination cards -->
      <button class="dest-card" data-dest="moon">
        <span class="card-indicator"></span>
        <span class="card-name">月球</span>
        <span class="card-time">约 3 天</span>
      </button>
      <button class="dest-card selected" data-dest="mars">
        <span class="card-indicator"></span>
        <span class="card-name">火星</span>
        <span class="card-time">约 7 个月</span>
      </button>
      <button class="dest-card" data-dest="jupiter">
        <span class="card-indicator"></span>
        <span class="card-name">木星</span>
        <span class="card-time">约 6 年</span>
      </button>
      <button class="dest-card" data-dest="proxima">
        <span class="card-indicator"></span>
        <span class="card-name">比邻星</span>
        <span class="card-time">约 6 万年</span>
      </button>
    </div>

    <!-- Right column -->
    <div class="right-col">
      <div id="chart"></div>
    </div>
  </div>
</div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(function() {
  'use strict';

  Lec.mount({
    index: 31,
    kicker: '逃离/时间',
    title: '时间才是边界',
    take: '以今天的推进技术，太阳系内是月、年；星际是万年——问题首先是时间'
  });

  /* ---- constants ---- */
  var CURRENT_TECH_FRAC = 7.07e-5; // fraction of c for chemical rockets
  var DAYS_PER_YEAR = 365.25;
  function monthsToYears(m) { return m / 12; }

  /* ---- compute travel times via Lec ---- */
  var moonYears = 3 / DAYS_PER_YEAR; // 3 days
  var marsYears = monthsToYears(7); // 7 months
  var jupiterYears = 6; // 6 years

  var proximaDistKm = Lec.P.lyToKm(Lec.K.NEAREST_STAR_LY); // 4.24 ly
  var proximaSpeedKmps = Lec.P.speedFromFractionOfLight(CURRENT_TECH_FRAC);
  var proximaYears = Lec.P.travelTimeYears(proximaDistKm, proximaSpeedKmps);

  /* ---- destination data ---- */
  var dests = {
    moon: {
      name: '月球',
      timeYears: moonYears,
      timeLabel: '约 3 天',
      timeShort: '3 天'
    },
    mars: {
      name: '火星',
      timeYears: marsYears,
      timeLabel: '约 7 个月',
      timeShort: '7 个月'
    },
    jupiter: {
      name: '木星',
      timeYears: jupiterYears,
      timeLabel: '约 6 年',
      timeShort: '6 年'
    },
    proxima: {
      name: '比邻星',
      timeYears: proximaYears,
      timeLabel: '约 6 万年',
      timeShort: '6 万年'
    }
  };

  var destOrder = ['moon', 'mars', 'jupiter', 'proxima'];
  var selected = 'mars';

  /* ---- reading panel helpers ---- */
  var rdDest = document.getElementById('rd-dest');
  var rdTime = document.getElementById('rd-time');
  var rdRatio = document.getElementById('rd-ratio');

  function updateReadingPanel(destId) {
    var d = dests[destId];
    rdDest.textContent = d.name;
    rdTime.textContent = d.timeLabel;

    if (destId === 'proxima') {
      // compute ratio to Mars: proxima / mars
      var ratio = proximaYears / marsYears;
      var ratioDisplay;
      if (ratio > 10000) {
        ratioDisplay = Math.round(ratio / 10000) + ' 万';
      } else if (ratio > 1000) {
        ratioDisplay = Math.round(ratio / 1000) + ' 千';
      } else {
        ratioDisplay = Math.round(ratio);
      }
      rdRatio.textContent = '比邻星约是火星的 ' + ratioDisplay + ' 倍';
    } else {
      rdRatio.textContent = '';
    }
  }

  /* ---- echarts ---- */
  var chartDom = document.getElementById('chart');
  var myChart = echarts.init(chartDom, null, { renderer: 'svg' });

  function buildChartOption(highlightId) {
    var data = destOrder.map(function(id) {
      var d = dests[id];
      var isHighlight = (id === highlightId);
      return {
        value: d.timeYears,
        itemStyle: {
          color: isHighlight
            ? (id === 'proxima' ? '#c2410c' : '#0b7a75')
            : (id === 'proxima' ? 'rgba(194,65,12,0.3)' : 'rgba(11,122,117,0.25)'),
          borderRadius: [0, 3, 3, 0]
        },
        label: {
          show: true,
          position: 'right',
          formatter: d.timeShort,
          fontSize: 14,
          color: isHighlight ? '#e6e6e6' : '#5c5e5a',
          fontWeight: isHighlight ? 600 : 400
        }
      };
    });

    return {
      tooltip: {
        trigger: 'axis',
        axisPointer: { type: 'shadow' },
        formatter: function(params) {
          var p = params[0];
          var id = destOrder[p.dataIndex];
          var d = dests[id];
          return d.name + '<br/>旅行时间：' + d.timeShort;
        },
        textStyle: { fontSize: 16, color: '#e6e6e6' },
        backgroundColor: 'rgba(11,14,20,0.92)',
        borderColor: '#0b7a75',
        borderWidth: 1
      },
      grid: {
        left: 60,
        right: 100,
        top: 20,
        bottom: 30
      },
      xAxis: {
        type: 'log',
        min: 0.0008,
        max: 100000,
        axisLabel: {
          fontSize: 14,
          color: '#5c5e5a',
          formatter: function(val) {
            // Map echarts log ticks (at 10^n) to human-readable labels
            if (val < 0.003) return '1天';
            if (val < 0.02) return '4天';
            if (val < 0.5) return '1月';
            if (val < 3) return '1年';
            if (val < 30) return '10年';
            if (val < 300) return '100年';
            if (val < 3000) return '1千年';
            if (val < 30000) return '1万年';
            return '10万年';
          }
        },
        axisLine: { lineStyle: { color: '#3a3c38' } },
        splitLine: {
          lineStyle: { color: 'rgba(216,218,210,0.12)', type: 'dashed' }
        },
        axisTick: { lineStyle: { color: '#3a3c38' } }
      },
      yAxis: {
        type: 'category',
        data: destOrder.map(function(id) { return dests[id].name; }),
        axisLabel: {
          fontSize: 15,
          color: '#e6e6e6',
          fontWeight: 600
        },
        axisLine: { show: false },
        axisTick: { show: false },
        splitLine: { show: false }
      },
      series: [{
        type: 'bar',
        data: data,
        barWidth: 20,
        barMaxWidth: 24,
        animationDuration: 400,
        animationEasing: 'cubicOut'
      }]
    };
  }

  /* ---- render initial chart ---- */
  myChart.setOption(buildChartOption(selected));

  /* ---- card click handlers ---- */
  var cards = document.querySelectorAll('.dest-card');

  function selectDest(destId) {
    if (destId === selected) return;
    selected = destId;

    // update card visuals
    cards.forEach(function(c) {
      c.classList.toggle('selected', c.getAttribute('data-dest') === destId);
    });

    // update reading panel
    updateReadingPanel(destId);

    // update chart
    myChart.setOption(buildChartOption(destId), { notMerge: true });
  }

  cards.forEach(function(c) {
    c.addEventListener('click', function() {
      selectDest(this.getAttribute('data-dest'));
    });
  });

  /* ---- initial reading panel ---- */
  updateReadingPanel(selected);

  /* ---- handle resize ---- */
  Deck.onResize(function() {
    myChart.resize();
  });

})();
</script>
</body>
</html>
