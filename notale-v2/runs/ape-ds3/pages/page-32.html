<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ── page-32: focus page, process structure ── */

#main {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

/* hero claim */
.hero-claim {
  font-size: var(--fs-h1);
  font-weight: 700;
  line-height: 1.35;
  color: var(--text);
  margin-bottom: var(--space-3);
}

/* subtitle */
.hero-sub {
  font-size: var(--fs-lead);
  color: var(--muted);
  margin-bottom: var(--space-7);
  letter-spacing: 0.04em;
}

/* process strip wrapper: narrow enough to feel compact */
.k-process {
  width: 880px;
  margin-bottom: var(--space-6);
}

/* override step backgrounds for dark theme */
.k-process > .step {
  background: rgba(255,255,255,0.04);
  border-color: rgba(255,255,255,0.10);
  backdrop-filter: blur(2px);
  padding: var(--space-3) var(--space-4);
  margin: var(--space-3) 0;
}
.k-process > .step.passed {
  opacity: 0.45;
  filter: saturate(0.5);
}
.k-process > .step.current {
  border-color: var(--accent);
  background: rgba(11,122,117,0.12);
  box-shadow: 0 0 16px rgba(11,122,117,0.20);
}
.k-process > .step::before {
  font-size: var(--fs-tick);
  color: var(--muted);
  margin-bottom: var(--space-1);
}
.k-process > .step .step-label {
  font-size: var(--fs-body);
  font-weight: 600;
  line-height: 1.4;
}
.k-process > .step .step-desc {
  font-size: var(--fs-sec);
  color: var(--muted);
  line-height: 1.45;
  margin-top: var(--space-1);
}
.k-process > .step.current .step-label {
  color: var(--accent);
}
.k-process > .step.current .step-desc {
  color: var(--text);
}
.k-process > .arw {
  color: var(--accent);
  font-size: var(--fs-h2);
  flex: 0 0 36px;
}

/* closing line */
.closing-line {
  font-size: var(--fs-sec);
  color: var(--muted);
  line-height: 1.5;
}
</style>
</head>
<body data-page="32" data-total="50">
<div id="stage">
<main id="main">

  <!-- Hero claim -->
  <div class="hero-claim">宇宙的尺子不是公里，是光</div>

  <!-- Subtitle -->
  <div class="hero-sub">距离 = 光的旅程</div>

  <!-- Process: three steps showing the transition from old ruler to new ruler -->
  <div class="k-process">
    <div class="axis"></div>

    <div class="step passed">
      <div class="step-label">公里还是好用的尺</div>
      <div class="step-desc">在太阳系内，数字仍可读</div>
    </div>

    <div class="arw"></div>

    <div class="step passed">
      <div class="step-label">出了太阳系就失效</div>
      <div class="step-desc">数字大到失去直觉</div>
    </div>

    <div class="arw"></div>

    <div class="step current">
      <div class="step-label">改用光来衡量</div>
      <div class="step-desc">距离 = 光走了多久</div>
    </div>
  </div>

  <!-- Closing line -->
  <div class="closing-line">从这一页起，&ldquo;有多远&rdquo;会被改写成&ldquo;光走了多久&rdquo;</div>

</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 32,
  kicker: "LIGHT-SPEED",
  title: "宇宙的尺子不是公里，是光",
  take: "从这一页起，'有多远'会被改写成'光走了多久'"
});
</script>
</body>
</html>
