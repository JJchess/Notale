<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== page-34 专属样式 ===== */

#main {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  gap: var(--space-5);
  padding: 0;
}

/* ---- 左侧选择器 ---- */
.selector-panel {
  flex: 0 0 280px;
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}
.selector-panel .selector-label {
  font-size: var(--fs-label);
  color: var(--muted);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 0;
  margin: 0;
}

/* 选择器使用 k-enumeration 项模板 */
.selector-list {
  list-style: none;
  margin: 0;
  padding: 0;
  width: 100%;
}
.selector-list .it {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-1);
  padding: var(--space-4) var(--space-3);
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  font-family: inherit;
  color: var(--text);
  text-align: center;
  min-height: 90px;
}
.selector-list .it:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.selector-list .it.active {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: var(--shadow-md);
}
.selector-list .it .name {
  font-size: var(--fs-lead);
  font-weight: 700;
  line-height: 1.3;
}
.selector-list .it .sub {
  font-size: var(--fs-label);
  color: var(--muted);
  line-height: 1.3;
}
.selector-list .it .emoji {
  font-size: 28px;
  line-height: 1;
  margin-bottom: var(--space-1);
}

/* ---- 右侧详情卡 ---- */
.detail-card {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  gap: 0;
  padding: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.detail-card .img-area {
  flex: 0 0 420px;
  position: relative;
  overflow: hidden;
  background: #1a1a1a;
}
.detail-card .img-area img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.detail-card .info-area {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: var(--space-6) var(--space-5);
  gap: var(--space-4);
}
.detail-card .info-area .body-name {
  font-size: var(--fs-h2);
  font-weight: 700;
  line-height: var(--lh-h2);
  margin: 0;
  color: var(--text);
}
.detail-card .info-area .body-sub {
  font-size: var(--fs-sec);
  color: var(--muted);
  line-height: var(--lh-sec);
  margin: 0;
}
.data-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  margin-top: var(--space-2);
}
.data-row {
  display: flex;
  flex-direction: row;
  align-items: baseline;
  gap: var(--space-3);
}
.data-row .data-label {
  font-size: var(--fs-label);
  color: var(--muted);
  flex: 0 0 120px;
  text-align: right;
  line-height: var(--lh-label);
}
.data-row .data-value {
  font-size: var(--fs-lead);
  font-weight: 700;
  color: var(--accent);
  line-height: var(--lh-lead);
}
.data-row .data-value .unit {
  font-weight: 400;
  font-size: var(--fs-body);
  color: var(--text);
}
.data-row.apollo-row {
  padding-top: var(--space-2);
  border-top: 1px solid var(--line);
}
.data-row.apollo-row .data-value {
  color: var(--text);
}
.data-row.apollo-row .data-value .highlight {
  color: var(--accent);
  font-weight: 700;
}
.comparison-note {
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
  color: var(--muted);
  padding-top: var(--space-2);
  margin-top: 0;
  border-top: 1px solid var(--line);
}
.comparison-note strong {
  color: var(--accent);
  font-weight: 700;
}

/* ---- 引导文 ---- */
.guide-text {
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--text);
  max-width: 640px;
  margin: 0;
}
</style>
</head>
<body data-page="34" data-total="50">
<div id="stage">
<main id="main">
  <!-- 左侧选择器 -->
  <div class="selector-panel">
    <div class="selector-label">选择目的地</div>
    <div class="selector-list k-enumeration" role="tablist" aria-label="选择天体">
      <button class="it active" role="tab" aria-selected="true" data-target="moon" id="btn-moon">
        <span class="emoji">🌙</span>
        <span class="name">月球</span>
        <span class="sub">Moon</span>
      </button>
      <button class="it" role="tab" aria-selected="false" data-target="sun" id="btn-sun">
        <span class="emoji">☀️</span>
        <span class="name">太阳</span>
        <span class="sub">Sun</span>
      </button>
    </div>
    <div class="guide-text">
      点击切换，看看光需要多久到达不同天体。
    </div>
  </div>

  <!-- 右侧详情卡 -->
  <div class="detail-card" id="detailCard" role="tabpanel">
    <!-- 月球详情（默认显示） -->
    <div class="img-area" id="moon-img-area">
      <img src="assets/img/moon-eso.jpg"
           alt="月球正面真实照片"
           title="ESO/G. Hüdepohl (atacamaphoto.com) — CC BY 4.0">
    </div>
    <div class="img-area" id="sun-img-area" style="display:none;">
      <img src="assets/img/sun-sdo.jpg"
           alt="太阳表面真实照片（SDO 卫星）"
           title="NASA/SDO and the AIA, EVE, and HMI science teams — Public domain">
    </div>
    <div class="info-area">
      <div>
        <div class="body-name" id="detailName">月球</div>
        <div class="body-sub" id="detailSub">Moon</div>
      </div>
      <div class="data-group">
        <div class="data-row">
          <span class="data-label">与地球距离</span>
          <span class="data-value" id="detailDistance">—</span>
        </div>
        <div class="data-row">
          <span class="data-label">光行时</span>
          <span class="data-value" id="detailLtt">—</span>
        </div>
        <div class="data-row apollo-row" id="apolloRow">
          <span class="data-label">阿波罗飞船</span>
          <span class="data-value" id="detailApollo">—</span>
        </div>
        <div class="comparison-note" id="comparisonNote"></div>
      </div>
    </div>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  'use strict';

  // ---- mount ----
  Lec.mount({
    index: 34,
    kicker: "四 光速",
    title: "光行时选择器",
    take: "光到月球1.3秒，到太阳8.3分钟——宇宙的尺子以光为刻度",
    sub: "四 光速",
    foot: "光到月球1.3秒，到太阳8.3分钟——宇宙的尺子以光为刻度"
  });

  // ---- 补入 Apollo 常量 ----
  if (!Lec.K.APOLLO_TRANSIT_DAYS) {
    Lec.K.APOLLO_TRANSIT_DAYS = 3;
  }

  // ---- DOM 引用 ----
  var btns = {
    moon: document.getElementById('btn-moon'),
    sun:  document.getElementById('btn-sun')
  };
  var moonImgArea = document.getElementById('moon-img-area');
  var sunImgArea  = document.getElementById('sun-img-area');
  var detailName  = document.getElementById('detailName');
  var detailSub   = document.getElementById('detailSub');
  var detailDist  = document.getElementById('detailDistance');
  var detailLtt   = document.getElementById('detailLtt');
  var apolloRow   = document.getElementById('apolloRow');
  var detailApollo = document.getElementById('detailApollo');
  var compNote    = document.getElementById('comparisonNote');

  // ---- 格式化 ----
  function fmtKm(km) {
    if (km >= 1e6) return (km / 1e6).toFixed(1) + ' <span class="unit">百万公里</span>';
    if (km >= 1e4) return (km / 1e4).toFixed(0) + ' <span class="unit">万公里</span>';
    return Lec.P.round(km, 0) + ' <span class="unit">公里</span>';
  }

  // ---- 数据 ----
  var EARTH_MOON_KM = Lec.K.EARTH_MOON_KM;
  var EARTH_SUN_KM  = Lec.K.EARTH_SUN_KM;

  var moonLttSec  = Lec.P.lightTravelTimeSeconds(EARTH_MOON_KM);
  var sunLttMin   = Lec.P.lightTravelTimeMinutes(EARTH_SUN_KM);

  var apolloDays  = Lec.K.APOLLO_TRANSIT_DAYS;
  var apolloSec   = apolloDays * 86400;
  var moonLttSecVal = Lec.P.lightTravelTimeSeconds(EARTH_MOON_KM);
  var multiplier  = Math.round(apolloSec / moonLttSecVal);

  // ---- 更新详情 ----
  function showMoon() {
    // 切换选择状态
    btns.moon.classList.add('active');
    btns.moon.setAttribute('aria-selected', 'true');
    btns.sun.classList.remove('active');
    btns.sun.setAttribute('aria-selected', 'false');

    // 切换图片
    moonImgArea.style.display = 'block';
    sunImgArea.style.display  = 'none';

    // 更新名称
    detailName.textContent = '月球';
    detailSub.textContent  = 'Moon';

    // 更新距离
    detailDist.innerHTML = fmtKm(EARTH_MOON_KM);

    // 更新光行时
    var ltt = Lec.P.round(moonLttSec, 1);
    detailLtt.innerHTML = ltt + ' <span class="unit">秒</span>';

    // 阿波罗行
    apolloRow.style.display = 'flex';
    detailApollo.innerHTML = '约 ' + apolloDays + ' <span class="unit">天</span>';

    // 对比倍数
    compNote.innerHTML = '光比阿波罗飞船快约 <strong>' + multiplier + ' 万倍</strong>';
  }

  function showSun() {
    // 切换选择状态
    btns.sun.classList.add('active');
    btns.sun.setAttribute('aria-selected', 'true');
    btns.moon.classList.remove('active');
    btns.moon.setAttribute('aria-selected', 'false');

    // 切换图片
    moonImgArea.style.display = 'none';
    sunImgArea.style.display  = 'block';

    // 更新名称
    detailName.textContent = '太阳';
    detailSub.textContent  = 'Sun';

    // 更新距离
    detailDist.innerHTML = fmtKm(EARTH_SUN_KM);

    // 更新光行时
    var ltt = Lec.P.round(sunLttMin, 1);
    detailLtt.innerHTML = ltt + ' <span class="unit">分钟</span>';

    // 隐藏阿波罗行
    apolloRow.style.display = 'none';
    compNote.textContent = '';
  }

  // ---- 绑定事件 ----
  btns.moon.addEventListener('click', showMoon);
  btns.sun.addEventListener('click',  showSun);

  // 键盘可达
  btns.moon.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      showMoon();
    }
  });
  btns.sun.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      showSun();
    }
  });

  // ---- 初始显示月球 ----
  showMoon();

})();
</script>
</body>
</html>
