<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}

#main {
  position: relative;
  overflow: hidden;
  user-select: none;
}

#konva-container {
  position: absolute;
  inset: 0;
  z-index: 1;
}

/* Time display at top center */
#time-display {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  font-size: var(--fs-h2);
  font-weight: 700;
  color: var(--text);
  z-index: 10;
  text-align: center;
  pointer-events: none;
  text-shadow: 0 0 24px rgba(0,0,0,0.9);
  line-height: 1.3;
}

#time-display .sub {
  font-size: var(--fs-sec);
  font-weight: 400;
  color: var(--text);
  opacity: 0.55;
  display: block;
  margin-top: 2px;
}

/* Inner planet compact strip at top */
#inner-strip {
  position: absolute;
  top: 68px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 6;
  display: flex;
  gap: 12px;
  font-size: var(--fs-label);
  color: var(--text);
  opacity: 0.55;
  pointer-events: none;
  text-shadow: 0 0 10px rgba(0,0,0,0.95);
  white-space: nowrap;
}

#inner-strip .dot-label {
  display: flex;
  align-items: center;
  gap: 4px;
}

#inner-strip .dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

#inner-strip .inner-au {
  font-size: var(--fs-tick);
  color: var(--text);
  opacity: 0.5;
  margin-left: 1px;
}

#inner-strip .inner-active {
  color: var(--text);
  font-weight: 700;
  opacity: 1;
}

/* Outer planet labels below axis */
.planet-label {
  position: absolute;
  text-align: center;
  font-size: var(--fs-label);
  color: var(--text);
  opacity: 0.55;
  pointer-events: none;
  z-index: 5;
  transform: translateX(-50%);
  transition: color 0.3s, opacity 0.3s;
  text-shadow: 0 0 10px rgba(0,0,0,0.95);
  white-space: nowrap;
  line-height: 1.3;
}

.planet-label .au {
  font-size: var(--fs-tick);
  color: var(--text);
  opacity: 0.5;
  margin-left: 2px;
  font-weight: 300;
}

.planet-label .light-time {
  display: block;
  font-size: var(--fs-tick);
  color: var(--accent);
  margin-top: 1px;
  opacity: 0;
  transition: opacity 0.3s;
  white-space: nowrap;
}

.planet-label.active {
  opacity: 1;
  color: var(--text);
}

.planet-label.active .light-time {
  opacity: 1;
}

#sun-label {
  color: #FFD700;
  opacity: 1;
}
#sun-label .au {
  color: #aa8800;
  opacity: 1;
}

/* Info card: appears above planet when light reaches it */
.planet-info {
  position: absolute;
  text-align: center;
  color: var(--text);
  font-weight: 700;
  pointer-events: none;
  z-index: 8;
  transform: translateX(-50%);
  opacity: 0;
  transition: opacity 0.4s;
  text-shadow: 0 0 16px rgba(0,0,0,0.95);
  white-space: nowrap;
}

.planet-info.visible {
  opacity: 1;
}

.planet-info .time-val {
  font-size: var(--fs-h2);
  display: block;
  margin-bottom: 1px;
  letter-spacing: 0.02em;
}

.planet-info .time-unit {
  font-size: var(--fs-label);
  display: block;
  color: var(--text);
  opacity: 0.6;
  font-weight: 400;
}

/* Slider */
#slider-area {
  position: absolute;
  bottom: 26px;
  left: 60px;
  right: 60px;
  z-index: 10;
  height: 32px;
  display: flex;
  align-items: center;
}

#time-slider {
  width: 100%;
  height: 6px;
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  cursor: pointer;
  outline: none;
  position: relative;
  z-index: 2;
}

#time-slider::-webkit-slider-runnable-track {
  height: 3px;
  background: rgba(255,255,255,0.12);
  border-radius: 2px;
}

#time-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid #fff;
  box-shadow: 0 0 20px rgba(11,122,117,0.5);
  cursor: pointer;
  margin-top: -9px;
  transition: box-shadow 0.2s;
}

#time-slider::-webkit-slider-thumb:hover {
  box-shadow: 0 0 30px rgba(11,122,117,0.8);
}

#time-slider::-moz-range-track {
  height: 3px;
  background: rgba(255,255,255,0.12);
  border-radius: 2px;
  border: none;
}

#time-slider::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid #fff;
  cursor: pointer;
}

/* Backyard message */
#backyard-msg {
  position: absolute;
  bottom: 64px;
  left: 50%;
  transform: translateX(-50%);
  font-size: var(--fs-lead);
  color: var(--accent);
  font-weight: 700;
  z-index: 10;
  opacity: 0;
  transition: opacity 0.6s ease;
  pointer-events: none;
  text-align: center;
  text-shadow: 0 0 24px rgba(0,0,0,0.9);
  white-space: nowrap;
}

#backyard-msg.visible {
  opacity: 1;
}
</style>
</head>
<body data-page="35" data-total="50">
<div id="stage">
<main id="main">
  <div id="konva-container"></div>
  <div id="time-display">
    光已走 0 分
    <span class="sub">拖动滑块，看光逐颗到达行星</span>
  </div>
  <div id="inner-strip"></div>
  <div id="backyard-msg">全部探测器都还在这个后院</div>
  <div id="slider-area">
    <input type="range" id="time-slider" min="0" max="10000" value="0" step="1" aria-label="拖动光脉冲沿太阳系巡游">
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/konva.min.js"></script>
<script>
(function() {
  'use strict';

  Lec.mount({
    index: 35,
    kicker: '光速 · 太阳系尺度',
    title: '太阳系巡游',
    take: '太阳系大到光也要走 8 分钟到 4 小时'
  });

  var P = Lec.P;
  var K = Lec.K;

  /* ── Planet data ── */
  var planets = [
    { name: '太阳', au: 0,     color: '#FFD700', radius: 14 },
    { name: '水星', au: 0.387, color: '#B5B5B5', radius: 6 },
    { name: '金星', au: 0.723, color: '#E8CDA0', radius: 8 },
    { name: '地球', au: 1.0,   color: '#4B8BDE', radius: 8 },
    { name: '火星', au: 1.524, color: '#E07040', radius: 7 },
    { name: '木星', au: 5.203, color: '#D4A574', radius: 12 },
    { name: '土星', au: 9.537, color: '#E8D5A0', radius: 11 },
    { name: '天王星', au: 19.191, color: '#7EC8E3', radius: 9 },
    { name: '海王星', au: 30.07,  color: '#3B5EAB', radius: 9 }
  ];

  /* Compute light travel times */
  var totalMinutes = 0;
  planets.forEach(function(p) {
    if (p.au > 0) {
      var km = P.auToKm(p.au);
      p.lightMinutes = P.lightTravelTimeMinutes(km);
      p.lightHours = P.lightTravelTimeHours(km);
    } else {
      p.lightMinutes = 0;
      p.lightHours = 0;
    }
    if (p.lightMinutes > totalMinutes) totalMinutes = p.lightMinutes;
  });

  /* ── Layout constants ── */
  var W = 1408, H = 620;
  var axisY = 300;
  var axisStartX = 80;
  var axisEndX = 1330;
  var axisWidth = axisEndX - axisStartX;

  /* Use a log-like scale to spread planets: frac = (lightMin/total)^0.25 */
  var power = 0.25;
  planets.forEach(function(p) {
    if (p.lightMinutes > 0) {
      p.frac = Math.pow(p.lightMinutes / totalMinutes, power);
    } else {
      p.frac = 0;
    }
    p.x = axisStartX + p.frac * axisWidth;
  });

  /* ── Konva stage ── */
  var stage = new Konva.Stage({
    container: 'konva-container',
    width: W,
    height: H
  });

  var bgLayer = new Konva.Layer({ listening: false });
  stage.add(bgLayer);
  bgLayer.add(new Konva.Rect({
    x: 0, y: 0, width: W, height: H,
    fill: '#0b0e14'
  }));

  var mainLayer = new Konva.Layer({ listening: false });
  stage.add(mainLayer);

  /* Axis line */
  mainLayer.add(new Konva.Line({
    points: [axisStartX, axisY, axisEndX, axisY],
    stroke: 'rgba(255,255,255,0.15)',
    strokeWidth: 1.5,
    lineCap: 'round'
  }));

  /* Tick marks at each planet */
  planets.forEach(function(p) {
    if (p.frac === 0) return;
    mainLayer.add(new Konva.Line({
      points: [p.x, axisY - 5, p.x, axisY + 5],
      stroke: 'rgba(255,255,255,0.12)',
      strokeWidth: 1
    }));
  });

  /* Planet markers */
  var planetCircles = [];
  planets.forEach(function(p) {
    var circle = new Konva.Circle({
      x: p.x,
      y: axisY,
      radius: p.radius,
      fill: p.color,
      opacity: p.au === 0 ? 1 : 0.4,
      shadowColor: p.color,
      shadowBlur: p.au === 0 ? 30 : 0,
      shadowOpacity: 0.6
    });
    mainLayer.add(circle);
    planetCircles.push(circle);

    /* Glow ring for active planets */
    if (p.au > 0) {
      var glow = new Konva.Circle({
        x: p.x,
        y: axisY,
        radius: p.radius + 5,
        stroke: p.color,
        strokeWidth: 0,
        opacity: 0,
        listening: false
      });
      mainLayer.add(glow);
      circle._glow = glow;
    }
  });

  /* Light trail */
  var trailLine = new Konva.Line({
    points: [axisStartX, axisY, axisStartX, axisY],
    stroke: 'rgba(11,122,117,0.25)',
    strokeWidth: 3,
    lineCap: 'round'
  });
  mainLayer.add(trailLine);

  /* Light pulse */
  var pulseGlow = new Konva.Rect({
    x: axisStartX - 10,
    y: axisY - 60,
    width: 20,
    height: 120,
    fillLinearGradientStartPoint: { x: 0, y: 0 },
    fillLinearGradientEndPoint: { x: 0, y: 120 },
    fillLinearGradientColorStops: [
      0, 'rgba(11,122,117,0)',
      0.25, 'rgba(11,122,117,0.12)',
      0.5, 'rgba(11,122,117,0.25)',
      0.75, 'rgba(11,122,117,0.12)',
      1, 'rgba(11,122,117,0)'
    ],
    cornerRadius: 10,
    listening: false
  });
  mainLayer.add(pulseGlow);

  var pulseLine = new Konva.Line({
    points: [axisStartX, axisY - 40, axisStartX, axisY + 40],
    stroke: 'rgba(11,122,117,0.8)',
    strokeWidth: 2,
    lineCap: 'round',
    listening: false
  });
  mainLayer.add(pulseLine);

  var pulseCore = new Konva.Line({
    points: [axisStartX, axisY - 20, axisStartX, axisY + 20],
    stroke: '#7ff0e8',
    strokeWidth: 1.5,
    lineCap: 'round',
    listening: false
  });
  mainLayer.add(pulseCore);

  var pulseDot = new Konva.Circle({
    x: axisStartX,
    y: axisY,
    radius: 4,
    fill: '#7ff0e8',
    shadowColor: '#7ff0e8',
    shadowBlur: 16,
    shadowOpacity: 0.8,
    listening: false
  });
  mainLayer.add(pulseDot);

  function setPulsePosition(x) {
    x = Math.max(axisStartX, Math.min(axisEndX, x));
    pulseGlow.x(x - 10);
    pulseLine.points([x, axisY - 40, x, axisY + 40]);
    pulseCore.points([x, axisY - 20, x, axisY + 20]);
    pulseDot.x(x);
    trailLine.points([axisStartX, axisY, x, axisY]);
    mainLayer.batchDraw();
  }

  /* ── DOM: Inner planet compact strip ── */
  var innerStrip = document.getElementById('inner-strip');
  var innerPlanets = planets.slice(1, 5); /* Mercury, Venus, Earth, Mars */

  innerPlanets.forEach(function(p) {
    var dotLabel = document.createElement('span');
    dotLabel.className = 'dot-label';
    dotLabel.dataset.planetName = p.name;

    var dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = p.color;
    dotLabel.appendChild(dot);

    dotLabel.appendChild(document.createTextNode(p.name + ' '));

    var auSpan = document.createElement('span');
    auSpan.className = 'inner-au';
    auSpan.textContent = (p.au < 1 ? p.au.toFixed(3) : p.au.toFixed(1)) + ' AU';
    dotLabel.appendChild(auSpan);

    innerStrip.appendChild(dotLabel);
  });

  /* ── DOM: Outer planet labels below axis ── */
  var mainEl = document.getElementById('main');
  var labelEls = []; /* [label0, label1, ..., label8, info0, info1, ..., info8] */
  /* Only Sun and outer planets (Jupiter+) get visible labels */
  var labelIndices = [0, 5, 6, 7, 8]; /* Sun, Jupiter, Saturn, Uranus, Neptune */

  function fmtLightTime(minutes) {
    if (minutes < 1) return Math.round(minutes * 60) + '秒';
    if (minutes < 60) return Math.round(minutes) + '分钟';
    var h = Math.floor(minutes / 60);
    var m = Math.round(minutes % 60);
    if (m === 0) return h + '小时';
    return h + '小时' + m + '分';
  }

  function fmtAu(au) {
    if (au === 0) return '0';
    if (au < 1) return au.toFixed(3);
    if (au < 10) return au.toFixed(2);
    return au.toFixed(1);
  }

  planets.forEach(function(p, i) {
    var hasLabel = (labelIndices.indexOf(i) >= 0);
    var label = document.createElement('div');
    label.className = 'planet-label';
    if (p.name === '太阳') label.id = 'sun-label';
    if (hasLabel) {
      label.style.left = p.x + 'px';
      label.style.top = (axisY + 28) + 'px';
    } else {
      label.style.display = 'none';
    }

    label.textContent = p.name + ' ';
    var auSpan = document.createElement('span');
    auSpan.className = 'au';
    auSpan.textContent = fmtAu(p.au) + ' AU';
    label.appendChild(auSpan);

    var timeSpan = document.createElement('span');
    timeSpan.className = 'light-time';
    if (p.au > 0) {
      timeSpan.textContent = fmtLightTime(p.lightMinutes);
    }
    label.appendChild(timeSpan);

    mainEl.appendChild(label);
    labelEls.push(label);

    /* Info card - always visible when active */
    var info = document.createElement('div');
    info.className = 'planet-info';
    info.style.left = p.x + 'px';
    info.style.top = (axisY - 85) + 'px';

    var timeVal = document.createElement('span');
    timeVal.className = 'time-val';
    if (p.au === 0) {
      timeVal.textContent = '起点';
    } else {
      timeVal.textContent = fmtLightTime(p.lightMinutes);
    }
    info.appendChild(timeVal);

    var timeUnit = document.createElement('span');
    timeUnit.className = 'time-unit';
    if (p.au === 0) {
      timeUnit.textContent = '太阳';
    } else {
      timeUnit.textContent = '光到达' + p.name;
    }
    info.appendChild(timeUnit);

    mainEl.appendChild(info);
    labelEls.push(info);
  });

  /* ── Slider interaction ── */
  var slider = document.getElementById('time-slider');
  var timeDisplay = document.getElementById('time-display');
  var backyardMsg = document.getElementById('backyard-msg');
  var sliderMax = 10000;
  var stripDots = innerStrip.querySelectorAll('.dot-label');

  function updateScene(val) {
    var frac = val / sliderMax;
    var currentMinutes = frac * totalMinutes;

    /* Pulse position: use same power scale as planets */
    var pulseFrac = Math.pow(frac, power);
    var pulseX = axisStartX + pulseFrac * axisWidth;
    setPulsePosition(pulseX);

    /* Time display */
    var displayText = '';
    if (currentMinutes < 1) {
      displayText = '光已走 ' + Math.round(currentMinutes * 60) + ' 秒';
    } else if (currentMinutes < 60) {
      displayText = '光已走 ' + Math.round(currentMinutes) + ' 分';
    } else {
      var h = Math.floor(currentMinutes / 60);
      var m = Math.round(currentMinutes % 60);
      displayText = '光已走 ' + h + ' 小时 ' + m + ' 分';
    }
    timeDisplay.childNodes[0].textContent = displayText;

    /* Subtitle */
    var sub = timeDisplay.querySelector('.sub');
    if (frac >= 0.99) {
      sub.textContent = '光走完太阳系需要 4 个多小时';
    } else {
      sub.textContent = '拖动滑块，看光逐颗到达行星';
    }

    /* Update planet highlights */
    var reachedNeptune = false;
    planets.forEach(function(p, i) {
      var isActive = (p.au === 0) || (currentMinutes >= p.lightMinutes - 0.05);
      var label = labelEls[i];
      label.classList.toggle('active', isActive);

      /* Info card */
      var info = labelEls[i + planets.length];
      if (isActive && currentMinutes < p.lightMinutes + 1.5) {
        info.classList.add('visible');
      } else {
        info.classList.remove('visible');
      }

      /* Planet glow */
      if (i > 0) {
        var circle = planetCircles[i];
        if (isActive) {
          circle.opacity(1);
          circle.shadowBlur(20);
          circle.shadowOpacity(0.5);
        } else {
          circle.opacity(0.4);
          circle.shadowBlur(0);
          circle.shadowOpacity(0);
        }
      }

      if (p.name === '海王星' && isActive && currentMinutes >= p.lightMinutes) {
        reachedNeptune = true;
      }
    });

    /* Update inner strip highlights */
    innerPlanets.forEach(function(p, idx) {
      var isActive = currentMinutes >= p.lightMinutes - 0.05;
      stripDots[idx].classList.toggle('inner-active', isActive);
    });

    /* Backyard message */
    backyardMsg.classList.toggle('visible', reachedNeptune);
  }

  slider.addEventListener('input', function() {
    updateScene(parseFloat(this.value));
  });

  /* ── Initial state ── */
  updateScene(0);

  window.__page35 = {
    slider: slider,
    updateScene: updateScene,
    planets: planets,
    totalMinutes: totalMinutes
  };

})();
</script>
</body>
</html>
