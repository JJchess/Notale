<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== page-36: 4.24 光年 ===== */
#main {
  display: flex;
  flex-direction: row;
  gap: var(--space-5);
  padding: 6px var(--space-5);
  box-sizing: border-box;
  overflow: hidden;
}

/* left column — static explanation */
.left-col {
  flex: 0 0 380px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  justify-content: center;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
.left-col .big-number {
  font-size: 36px;
  font-weight: 800;
  line-height: 1.1;
  color: var(--accent);
}
.left-col .big-number .unit {
  font-size: var(--fs-h2);
  font-weight: 400;
  color: var(--muted);
  margin-left: 10px;
}
.left-col .sub-num {
  font-size: var(--fs-body);
  font-weight: 700;
  line-height: 1.4;
  color: var(--text);
}
.left-col .highlight-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px var(--space-4);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
}
.left-col .highlight-row .pair {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.left-col .highlight-row .pair .tag {
  font-size: var(--fs-label);
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.left-col .highlight-row .pair .val {
  font-size: var(--fs-body);
  font-weight: 700;
  color: var(--accent);
  text-align: right;
}
.left-col .desc {
  font-size: var(--fs-sec);
  line-height: 1.4;
  color: var(--text);
  margin: 0;
}

/* right column — slider comparison */
.right-col {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
  overflow: hidden;
}

/* slider area */
.slider-area {
  position: relative;
  width: 100%;
  padding: 24px 0 8px;
}

/* axis label */
.axis-label {
  text-align: center;
  font-size: 14px;
  color: var(--muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* reading rows */
.reading-row {
  display: flex;
  align-items: center;
  height: 32px;
  position: relative;
}
.reading-row .rd-label {
  flex: 0 0 65px;
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--text);
  text-align: right;
  padding-right: var(--space-2);
}
.reading-row .rd-value {
  position: absolute;
  font-size: var(--fs-body);
  font-weight: 700;
  line-height: 1.2;
  white-space: nowrap;
}
.reading-row.light-row .rd-value { color: var(--accent); }
.reading-row.voyager-row .rd-value { color: var(--warning); }

/* track */
.track-wrapper {
  position: relative;
  height: 24px;
  display: flex;
  align-items: center;
}
.track-wrapper input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  background: var(--line);
  border-radius: 2px;
  outline: none;
  margin: 0;
  cursor: pointer;
  position: relative;
  z-index: 2;
  min-width: 0;
}
.track-wrapper input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid #fff;
  box-shadow: 0 1px 6px rgba(0,0,0,.25);
  cursor: grab;
}
.track-wrapper input[type="range"]::-webkit-slider-thumb:hover {
  box-shadow: 0 2px 10px rgba(0,0,0,.35);
}
.track-wrapper input[type="range"]::-webkit-slider-thumb:active {
  cursor: grabbing;
}
.track-wrapper input[type="range"]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid #fff;
  box-shadow: 0 1px 6px rgba(0,0,0,.25);
  cursor: grab;
}
.track-wrapper input[type="range"]:focus-visible::-webkit-slider-thumb {
  outline: 2px solid var(--focus, #4a90d9);
  outline-offset: 2px;
}
.track-wrapper input[type="range"]:focus-visible::-moz-range-thumb {
  outline: 2px solid var(--focus, #4a90d9);
  outline-offset: 2px;
}

/* filled portion */
.track-fill {
  position: absolute;
  left: 0;
  top: 50%;
  height: 4px;
  background: var(--accent);
  border-radius: 2px;
  transform: translateY(-50%);
  pointer-events: none;
  z-index: 1;
}

/* anchors */
.anchors {
  position: relative;
  height: 24px;
  margin-top: 2px;
}
.anchors .anchor {
  position: absolute;
  top: 0;
  transform: translateX(-50%);
  font-size: 13px;
  color: var(--muted);
  text-align: center;
  line-height: 1.2;
}
.anchors .anchor .sublabel {
  display: block;
  font-size: 14px;
  color: var(--muted);
  opacity: 0.7;
}

/* comparison table */
.comparison-ref {
  margin-top: 4px;
  font-size: 14px;
}
.comparison-ref .k-comparison {
  --cmp-cols: 2;
  --dim-w: 90px;
  box-sizing: border-box;
}
.comparison-ref .k-comparison .hdr {
  padding: 4px 10px;
}
.comparison-ref .k-comparison .hdr:first-child {
  background: transparent;
}
.comparison-ref .k-comparison > * {
  padding: 4px 10px;
}
.comparison-ref .k-comparison .dim {
  color: var(--muted);
}
</style>
</head>
<body data-page="36" data-total="50">
<div id="stage">
<main id="main">
  <!-- Left column: static conclusion -->
  <div class="left-col">
    <div>
      <div class="big-number">4.24<span class="unit">光年</span></div>
      <div class="sub-num">离太阳最近的恒星</div>
    </div>

    <div class="highlight-row">
      <div class="pair">
        <span class="tag">光行时</span>
        <span class="val" id="static-light">4.24 年</span>
      </div>
      <div class="pair">
        <span class="tag">旅行者号</span>
        <span class="val" id="static-voyager">约 74,800 年</span>
      </div>
    </div>

    <p class="desc">
      同样的距离，用光来量是 4 年多，用人造飞行器来量是 7 万年。恒星际的距离用人造飞行器的速度来读，会得到一个超出个人一生尺度的数。
    </p>
  </div>

  <!-- Right column: interactive slider comparison -->
  <div class="right-col">
    <div class="axis-label">— 距离（光年）—</div>

    <div class="slider-area">
      <!-- Light reading -->
      <div class="reading-row light-row">
        <span class="rd-label">光</span>
        <span class="rd-value" id="light-value">4.24 年</span>
      </div>

      <!-- Track -->
      <div class="track-wrapper">
        <div class="track-fill" id="track-fill"></div>
        <input type="range" id="dist-slider" min="0" max="4.24" step="0.01" value="4.24" aria-label="拖动以改变距离">
      </div>

      <!-- Voyager reading -->
      <div class="reading-row voyager-row">
        <span class="rd-label">旅行者号</span>
        <span class="rd-value" id="voyager-value">约 7.5 万年</span>
      </div>

      <!-- Anchors -->
      <div class="anchors">
        <span class="anchor" style="left:8px; transform:translateX(0);">
          <span>0</span>
          <span class="sublabel">太阳</span>
        </span>
        <span class="anchor" style="left:23.58%;">
          <span>1 ly</span>
          <span class="sublabel">~1.76 万年</span>
        </span>
        <span class="anchor" style="left:auto; right:4px; transform:translateX(0);">
          <span>4.24 ly</span>
          <span class="sublabel">比邻星</span>
        </span>
      </div>
    </div>

    <!-- Static comparison table -->
    <div class="comparison-ref">
      <div class="k-comparison">
        <div class="hdr">距离</div>
        <div class="hdr">光行时</div>
        <div class="hdr">旅行者号需时</div>

        <div class="dim">1 光年</div>
        <div>1 年</div>
        <div class="diff" id="ref-1ly-voyager">约 17,635 年</div>

        <div class="dim">4.24 光年</div>
        <div>4.24 年</div>
        <div class="diff" id="ref-424-voyager">约 74,800 年</div>
      </div>
    </div>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  'use strict';

  Lec.mount({
    index: 36,
    kicker: '光速 · 恒星距离',
    title: '4.24 光年',
    take: '最近的恒星——以旅行者号的速度要 7 万年'
  });

  var NEAREST_STAR_LY = Lec.K.NEAREST_STAR_LY;
  var VOYAGER_SPEED_KMPS = 17;

  var slider = document.getElementById('dist-slider');
  var lightValue = document.getElementById('light-value');
  var voyagerValue = document.getElementById('voyager-value');
  var trackFill = document.getElementById('track-fill');
  var staticLight = document.getElementById('static-light');
  var staticVoyager = document.getElementById('static-voyager');
  var ref1lyVoyager = document.getElementById('ref-1ly-voyager');
  var ref424Voyager = document.getElementById('ref-424-voyager');

  function fmtNum(n) {
    return n.toLocaleString('en-US', { maximumFractionDigits: 0 });
  }

  function fmtLightTime(seconds) {
    var SECONDS_PER_MINUTE = 60;
    var SECONDS_PER_HOUR = 3600;
    var SECONDS_PER_DAY = 86400;
    var SECONDS_PER_YEAR = 31557600;

    if (seconds >= SECONDS_PER_YEAR) {
      var years = seconds / SECONDS_PER_YEAR;
      return years.toFixed(2) + ' 年';
    } else if (seconds >= SECONDS_PER_DAY) {
      var days = seconds / SECONDS_PER_DAY;
      return days.toFixed(1) + ' 天';
    } else if (seconds >= SECONDS_PER_HOUR) {
      var hours = seconds / SECONDS_PER_HOUR;
      return hours.toFixed(1) + ' 小时';
    } else if (seconds >= SECONDS_PER_MINUTE) {
      var minutes = seconds / SECONDS_PER_MINUTE;
      return minutes.toFixed(0) + ' 分钟';
    } else {
      return seconds.toFixed(0) + ' 秒';
    }
  }

  function fmtVoyagerShort(years) {
    if (years < 1) {
      return (years * 365.25).toFixed(0) + ' 天';
    } else if (years < 1000) {
      return years.toFixed(0) + ' 年';
    } else {
      return '约 ' + (years / 1000).toFixed(1) + ' 万年';
    }
  }

  function updateDisplay(ly) {
    var km = Lec.P.lyToKm(ly);
    var lightSeconds = Lec.P.lightTravelTimeSeconds(km);
    var voyagerYears = Lec.P.travelTimeYears(km, VOYAGER_SPEED_KMPS);

    lightValue.textContent = fmtLightTime(lightSeconds);
    voyagerValue.textContent = fmtVoyagerShort(voyagerYears);

    var pct = (ly / NEAREST_STAR_LY) * 100;
    trackFill.style.width = pct + '%';

    // Clamp reading position to stay within bounds (5%–95%)
    var clampedPct = Math.max(8, Math.min(92, pct));
    var thumbLeft = clampedPct + '%';
    lightValue.style.left = thumbLeft;
    lightValue.style.transform = 'translateX(-50%)';
    voyagerValue.style.left = thumbLeft;
    voyagerValue.style.transform = 'translateX(-50%)';
  }

  function computeStaticRefs() {
    var km1 = Lec.P.lyToKm(1);
    var voyager1 = Lec.P.travelTimeYears(km1, VOYAGER_SPEED_KMPS);
    ref1lyVoyager.textContent = '约 ' + fmtNum(Math.round(voyager1)) + ' 年';

    var km424 = Lec.P.lyToKm(NEAREST_STAR_LY);
    var voyager424 = Lec.P.travelTimeYears(km424, VOYAGER_SPEED_KMPS);
    var voyager424Str = '约 ' + fmtNum(Math.round(voyager424)) + ' 年';
    ref424Voyager.textContent = voyager424Str;
    staticVoyager.textContent = voyager424Str;
    staticLight.textContent = NEAREST_STAR_LY.toFixed(2) + ' 年';
  }

  computeStaticRefs();
  slider.value = NEAREST_STAR_LY;
  updateDisplay(NEAREST_STAR_LY);

  slider.addEventListener('input', function() {
    updateDisplay(parseFloat(slider.value));
  });
})();
</script>
</body>
</html>
