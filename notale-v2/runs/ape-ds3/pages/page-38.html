<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* 页面专有样式 —— 只用 token，不写魔法值 */
#main {
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* 上方画布区 */
.vis-area {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  flex-direction: column;
}

.vis-area canvas {
  flex: 1;
  min-height: 0;
}

/* 控件区 */
.ctl-wrap {
  flex-shrink: 0;
  padding: var(--space-1) var(--space-5) 0;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* 控件行 */
.ctl-row {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: 0;
  flex-shrink: 0;
  height: 40px;
}

.ctl-row input[type="range"] {
  flex: 1;
  min-width: 0;
  accent-color: var(--accent);
  height: 4px;
  margin: 0;
}

/* 滑块刻度标签行 */
.slider-labels {
  display: flex;
  justify-content: space-between;
  padding: 0;
  font-size: var(--fs-tick);
  line-height: var(--lh-tick);
  color: var(--muted);
  pointer-events: none;
  height: 16px;
  position: relative;
}

.ctl-row .count-label {
  font-size: var(--fs-label);
  line-height: var(--lh-label);
  color: var(--text);
  white-space: nowrap;
  min-width: 150px;
  text-align: right;
  flex-shrink: 0;
}

/* 下方维度表用 k-comparison 骨架 */
.k-comparison {
  --cmp-cols: 1;
  --dim-w: 240px;
  flex-shrink: 0;
  margin: 0;
  border-radius: 0;
  border-left: none;
  border-right: none;
  border-bottom: none;
}

.k-comparison > .dim {
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  padding: var(--space-2) var(--space-3);
}
.k-comparison > .val {
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  font-variant-numeric: tabular-nums;
  padding: var(--space-2) var(--space-3);
}
.k-comparison > .val .num {
  font-weight: 700;
  color: var(--accent);
}
.k-comparison > .diff .num {
  font-size: var(--fs-lead);
}
.k-comparison .dim-label {
  color: var(--muted);
  font-size: var(--fs-label);
}
</style>
</head>
<body data-page="38" data-total="50">
<div id="stage">
<main id="main">
  <!-- 上方画布区 -->
  <div class="vis-area">
    <canvas id="galaxy-canvas"></canvas>
    <div class="ctl-wrap">
      <div class="slider-labels">
        <span>0</span>
        <span>1</span>
        <span>10</span>
        <span>25</span>
      </div>
      <div class="ctl-row">
        <span style="font-size:var(--fs-label);color:var(--muted);flex-shrink:0;">同框</span>
        <input type="range" id="galaxy-slider" min="0" max="25" step="1" value="0"
               list="slider-datalist" aria-label="在两星系之间插入银河系">
        <datalist id="slider-datalist">
          <option value="1" label="1"></option>
          <option value="10" label="10"></option>
          <option value="25" label="25"></option>
        </datalist>
        <span style="font-size:var(--fs-label);color:var(--muted);flex-shrink:0;">25 个</span>
        <span class="count-label" id="count-display">已排入 0 个银河系</span>
      </div>
    </div>
  </div>

  <!-- 下方维度表 -->
  <div class="k-comparison">
    <div class="hdr">量</div>
    <div class="hdr">值</div>

    <div class="dim">银河系直径</div>
    <div class="val">
      <span class="num" id="diameter-val">100,000</span>
      <span class="dim-label">光年</span>
    </div>

    <div class="dim">到仙女座星系的距离</div>
    <div class="val">
      <span class="num" id="distance-val">2,500,000</span>
      <span class="dim-label">光年</span>
    </div>

    <div class="dim diff">距离 ÷ 直径</div>
    <div class="val diff">
      <span class="num" id="ratio-val">25</span>
      <span class="dim-label">倍</span>
    </div>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  'use strict';

  /* ANDROMEDA_DISTANCE_LY — 常量，Lec.K 中暂缺，本页局部定义 */
  var ANDROMEDA_DISTANCE_LY = 2.5e6;

  /* mount */
  Lec.mount({
    index: 38,
    kicker: 'SCALE OF NEIGHBORS',
    title: '25 个银河系的距离',
    take: '最近的巨大星系在 250 万光年外，中间能并排放下 25 个银河系。'
  });

  /* DOM refs */
  var canvas = document.getElementById('galaxy-canvas');
  var slider = document.getElementById('galaxy-slider');
  var countDisplay = document.getElementById('count-display');

  /* 绘制螺旋星系 */
  function drawGalaxySpiral(ctx, cx, cy, r, hue, brightness) {
    var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, 'rgba(' + hue.join(',') + ',' + brightness + ')');
    grad.addColorStop(0.4, 'rgba(' + hue.join(',') + ',' + (brightness * 0.6) + ')');
    grad.addColorStop(0.7, 'rgba(' + hue.join(',') + ',' + (brightness * 0.2) + ')');
    grad.addColorStop(1, 'rgba(' + hue.join(',') + ',0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(cx, cy, r, r * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();

    /* 核心 */
    var cr = r * 0.18;
    ctx.fillStyle = 'rgba(' + Math.min(255, hue[0] + 60) + ',' + Math.min(255, hue[1] + 60) + ',' + Math.min(255, hue[2] + 60) + ',0.95)';
    ctx.beginPath();
    ctx.ellipse(cx, cy, cr, cr * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();

    /* 旋臂 */
    ctx.strokeStyle = 'rgba(' + Math.min(255, hue[0] + 30) + ',' + Math.min(255, hue[1] + 30) + ',' + Math.min(255, hue[2] + 30) + ',0.35)';
    ctx.lineWidth = 1.5;
    for (var s = 0; s < 2; s++) {
      var off = s * Math.PI;
      ctx.beginPath();
      for (var t = 0; t < Math.PI * 2.5; t += 0.05) {
        var rr = cr + (r * 0.55) * (t / (Math.PI * 2.5));
        var xx = cx + rr * Math.cos(t + off);
        var yy = cy + rr * Math.sin(t + off) * 0.55;
        if (t === 0) ctx.moveTo(xx, yy);
        else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }
  }

  /* 绘制银河系单位圆盘 */
  function drawGalaxyDisk(ctx, cx, cy, r) {
    var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, 'rgba(160,180,200,0.7)');
    grad.addColorStop(0.5, 'rgba(120,140,160,0.4)');
    grad.addColorStop(1, 'rgba(100,120,140,0.1)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(160,180,200,0.25)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function draw() {
    var ctx = Deck.fit(canvas);
    var W = canvas.width / Deck.s;
    var H = canvas.height / Deck.s;

    ctx.clearRect(0, 0, W, H);

    var val = parseInt(slider.value, 10);

    /* 布局参数 */
    var margin = 110;
    var barY = H * 0.52;
    var barLeft = margin;
    var barRight = W - margin;
    var barLen = barRight - barLeft;

    /* 星系大小 */
    var galaxyR = Math.min(barLen * 0.035, 32);
    var diskR = Math.min(barLen / 25 * 0.38, 14);

    /* 连接虚线 */
    ctx.strokeStyle = Deck.rgba('--line', 0.2);
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(barLeft + galaxyR, barY);
    ctx.lineTo(barRight - galaxyR, barY);
    ctx.stroke();
    ctx.setLineDash([]);

    /* 银河系 (左) */
    drawGalaxySpiral(ctx, barLeft, barY, galaxyR, [80, 140, 220], 0.85);

    /* 仙女座星系 (右) */
    drawGalaxySpiral(ctx, barRight, barY, galaxyR, [200, 140, 80], 0.85);

    /* 中间圆盘: 从左侧依次排列 */
    for (var i = 0; i < val; i++) {
      var x = barLeft + (i + 1) * (barLen / 25);
      drawGalaxyDisk(ctx, x, barY, diskR);
    }

    /* 星系标签 */
    ctx.fillStyle = Deck.rgba('--text', 0.8);
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('银河系', barLeft, barY + galaxyR + 10);
    ctx.fillText('仙女座星系', barRight, barY + galaxyR + 10);

    /* 底部距离标注 */
    ctx.fillStyle = Deck.rgba('--muted', 0.7);
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('250 万光年', (barLeft + barRight) / 2, H - 6);

    /* 当前排入数标注 */
    if (val > 0) {
      ctx.fillStyle = Deck.rgba('--accent', 0.65);
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(val + ' 个银河系直径 →', (barLeft + barRight) / 2, barY - 10);
    }
  }

  /* 初始化画布 */
  Deck.autofit(canvas, draw);

  /* 滑块事件 */
  slider.addEventListener('input', function() {
    var val = parseInt(slider.value, 10);
    countDisplay.textContent = '已排入 ' + val + ' 个银河系';
    draw();
  });

  /* 更新维度表数字 */
  var diameter = Lec.K.MILKY_WAY_LY;
  var distance = ANDROMEDA_DISTANCE_LY;
  var ratio = Math.round(distance / diameter);

  document.getElementById('diameter-val').textContent = diameter.toLocaleString();
  document.getElementById('distance-val').textContent = distance.toLocaleString();
  document.getElementById('ratio-val').textContent = ratio;

})();
</script>
</body>
</html>
