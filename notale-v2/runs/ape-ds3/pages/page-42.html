<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== Page 42: 光行时相册 ===== */

/* --- split-lr layout --- */
#main {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  gap: var(--space-6);
  padding: var(--space-5) var(--space-5);
}
.left-col {
  flex: 1.3;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}
.right-col {
  flex: 0.7;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  padding-top: var(--space-1);
}

/* --- Process chain overrides --- */
.k-process {
  min-height: 230px;
}
.k-process > .step {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: var(--space-3) var(--space-2);
  margin: var(--space-2) 0;
  gap: var(--space-1);
}
.k-process > .step::before {
  margin-bottom: var(--space-1);
}
.step-title {
  font-size: var(--fs-body);
  font-weight: 700;
  line-height: var(--lh-body);
  color: var(--text);
}
.step-desc {
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
  color: var(--muted);
}
.step-desc.accent {
  color: var(--accent);
  font-weight: 600;
}
.step-result {
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--accent);
  font-weight: 700;
  padding: var(--space-1) var(--space-2);
  background: var(--accent-soft);
  border-radius: var(--radius-sm);
  margin-top: var(--space-1);
}
/* Highlight the travel step as current */
.k-process > .step#step-travel {
  border: 2px solid var(--accent);
  background: var(--accent-soft);
  box-shadow: var(--shadow-md);
}
/* Result step gets a subtle highlight */
.k-process > .step#step-result {
  border: 1px solid var(--accent);
  background: var(--accent-soft);
}
/* Emit and arrive are "passed" — dimmed */
.k-process > .step.passed {
  opacity: 0.6;
  filter: saturate(0.5);
}

/* --- Key insight block --- */
.key-insight {
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
  color: var(--text);
  padding: var(--space-3) var(--space-4);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
}
.key-insight p {
  margin-bottom: var(--space-2);
}
.key-insight p:last-child {
  margin-bottom: 0;
}
.key-insight .highlight {
  color: var(--accent);
  font-weight: 600;
}

/* --- Album entries --- */
.album-entry {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: border-color 0.2s, box-shadow 0.2s;
  font-family: inherit;
  font-size: inherit;
  text-align: left;
  width: 100%;
  color: var(--text);
}
.album-entry:hover {
  border-color: var(--accent);
  box-shadow: var(--shadow-sm);
}
.album-entry:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.album-entry.active {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: var(--shadow-md);
}

/* --- CSS icons --- */
.album-icon {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
}
.moon-icon {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--muted);
  position: relative;
  overflow: hidden;
}
.moon-icon::after {
  content: '';
  position: absolute;
  top: -4px;
  left: 10px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--bg);
}
.sun-icon {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, #fbbf24, #d97706);
  box-shadow: 0 0 16px 2px rgba(251, 191, 36, 0.35);
}
.star-icon {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 10px 4px rgba(255, 255, 255, 0.5);
}

/* --- Album info --- */
.album-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.album-name {
  font-size: var(--fs-body);
  font-weight: 700;
  line-height: var(--lh-body);
  color: var(--text);
}
.album-dist {
  font-size: var(--fs-label);
  line-height: var(--lh-label);
  color: var(--muted);
}
.album-time {
  font-size: var(--fs-label);
  line-height: var(--lh-label);
  color: var(--accent);
  font-weight: 600;
}
</style>
</head>
<body data-page="42" data-total="50">
<div id="stage">
<main id="main">
  <!-- Left: Process Chain -->
  <div class="left-col">
    <div class="k-process">
      <div class="axis"></div>
      <!-- Step 1: 发出 -->
      <div class="step passed" id="step-emit">
        <div class="step-title">发出</div>
        <div class="step-desc">天体在某时刻发出光</div>
      </div>
      <div class="arw"></div>
      <!-- Step 2: 飞行 (changes per selection) -->
      <div class="step" id="step-travel">
        <div class="step-title">飞行</div>
        <div class="step-desc" id="travel-desc">38 万 km</div>
        <div class="step-desc accent" id="travel-time">耗时 1.3 秒</div>
      </div>
      <div class="arw"></div>
      <!-- Step 3: 抵达 -->
      <div class="step passed" id="step-arrive">
        <div class="step-title">抵达</div>
        <div class="step-desc">光落入眼睛或望远镜</div>
      </div>
      <div class="arw"></div>
      <!-- Step 4: 成像 (result changes per selection) -->
      <div class="step" id="step-result">
        <div class="step-title">成像</div>
        <div class="step-result" id="result-text">你看到的月亮，<br>是 1.3 秒前的月亮</div>
      </div>
    </div>

    <!-- Key Insight -->
    <div class="key-insight">
      <p>你看到的每一个天体，都是光把它<span class="highlight">"当时"</span>的样子送到的。</p>
      <p>距离越远，那束光出发得越早，你就在看<span class="highlight">越早的过去</span>。</p>
      <p>望远镜不是看现在的工具，而是一台<span class="highlight">时间机器</span>。</p>
    </div>
  </div>

  <!-- Right: Album -->
  <div class="right-col">
    <button class="album-entry active" id="entry-moon" data-target="moon" aria-label="选择月球">
      <div class="album-icon"><div class="moon-icon"></div></div>
      <div class="album-info">
        <div class="album-name">月球</div>
        <div class="album-dist" id="dist-moon"></div>
        <div class="album-time" id="time-moon"></div>
      </div>
    </button>
    <button class="album-entry" id="entry-sun" data-target="sun" aria-label="选择太阳">
      <div class="album-icon"><div class="sun-icon"></div></div>
      <div class="album-info">
        <div class="album-name">太阳</div>
        <div class="album-dist" id="dist-sun"></div>
        <div class="album-time" id="time-sun"></div>
      </div>
    </button>
    <button class="album-entry" id="entry-proxima" data-target="proxima" aria-label="选择比邻星">
      <div class="album-icon"><div class="star-icon"></div></div>
      <div class="album-info">
        <div class="album-name">比邻星</div>
        <div class="album-dist" id="dist-proxima"></div>
        <div class="album-time" id="time-proxima"></div>
      </div>
    </button>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({ index: 42, kicker: "第四章 · 光速", title: "光行时相册", take: "看得越远，看得越早；望远镜是时间机器" });

(function() {
  'use strict';

  // ---- Data ----
  var K = Lec.K;
  var P = Lec.P;

  var moonDistKm = K.EARTH_MOON_KM;
  var moonTimeSec = P.lightTravelTimeSeconds(moonDistKm);
  var moonDistText = '约 ' + P.round(moonDistKm / 10000, 0) + ' 万 km';
  var moonTimeText = '光行时 ' + P.round(moonTimeSec, 1) + ' 秒';

  var sunDistKm = K.EARTH_SUN_KM;
  var sunTimeMin = P.lightTravelTimeMinutes(sunDistKm);
  var sunDistText = '约 ' + P.round(sunDistKm / 10000000, 1) + ' 亿 km';
  var sunTimeText = '光行时 ' + P.round(sunTimeMin, 1) + ' 分钟';

  var proximaLy = K.NEAREST_STAR_LY;
  var proximaDistText = P.round(proximaLy, 2) + ' 光年';
  var proximaTimeText = '光行时 ' + P.round(proximaLy, 2) + ' 年';

  var data = {
    moon: {
      dist: moonDistText,
      time: moonTimeText,
      travelDesc: moonDistText,
      travelTime: '耗时 ' + P.round(moonTimeSec, 1) + ' 秒',
      result: '你看到的月亮，<br>是 ' + P.round(moonTimeSec, 1) + ' 秒前的月亮'
    },
    sun: {
      dist: sunDistText,
      time: sunTimeText,
      travelDesc: sunDistText,
      travelTime: '耗时 ' + P.round(sunTimeMin, 1) + ' 分钟',
      result: '你看到的太阳，<br>是 ' + P.round(sunTimeMin, 1) + ' 分钟前的太阳'
    },
    proxima: {
      dist: proximaDistText,
      time: proximaTimeText,
      travelDesc: proximaDistText,
      travelTime: '耗时 ' + P.round(proximaLy, 2) + ' 年',
      result: '你看到的比邻星，<br>是 ' + P.round(proximaLy, 2) + ' 年前的比邻星'
    }
  };

  // ---- Fill album labels ----
  document.getElementById('dist-moon').textContent = moonDistText;
  document.getElementById('time-moon').textContent = moonTimeText;
  document.getElementById('dist-sun').textContent = sunDistText;
  document.getElementById('time-sun').textContent = sunTimeText;
  document.getElementById('dist-proxima').textContent = proximaDistText;
  document.getElementById('time-proxima').textContent = proximaTimeText;

  // ---- DOM refs ----
  var travelDesc = document.getElementById('travel-desc');
  var travelTime = document.getElementById('travel-time');
  var resultText = document.getElementById('result-text');
  var entries = document.querySelectorAll('.album-entry');

  // ---- Switch album ----
  function switchAlbum(target) {
    var d = data[target];
    if (!d) return;

    // Update process chain
    travelDesc.textContent = d.travelDesc;
    travelTime.textContent = d.travelTime;
    resultText.innerHTML = d.result;

    // Update active state
    entries.forEach(function(el) {
      el.classList.toggle('active', el.dataset.target === target);
    });
  }

  // ---- Bind click events ----
  entries.forEach(function(el) {
    el.addEventListener('click', function() {
      switchAlbum(el.dataset.target);
    });
  });

  // ---- Default: moon ----
  switchAlbum('moon');
})();
</script>
</body>
</html>
