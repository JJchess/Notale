<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== page-43 custom: 两尺相叠 ===== */

/* 十字容器 — 居中，占据主要视觉空间 */
.cross-wrap {
  position: relative;
  width: 380px;
  height: 380px;
  flex: 0 0 auto;
  margin: 0 auto;
}

/* 水平长条：深时 */
.bar-h {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 100%;
  height: 28px;
  background: linear-gradient(
    to right,
    transparent 0%,
    rgba(11, 122, 117, 0.15) 5%,
    rgba(11, 122, 117, 0.35) 15%,
    rgba(11, 122, 117, 0.35) 85%,
    rgba(11, 122, 117, 0.15) 95%,
    transparent 100%
  );
  box-shadow:
    0 0 10px rgba(11, 122, 117, 0.25),
    0 0 30px rgba(11, 122, 117, 0.08);
  border-radius: 2px;
  pointer-events: none;
}

/* 垂直长条：光速 */
.bar-v {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 28px;
  height: 100%;
  background: linear-gradient(
    to bottom,
    transparent 0%,
    rgba(11, 122, 117, 0.08) 5%,
    rgba(11, 122, 117, 0.35) 15%,
    rgba(11, 122, 117, 0.35) 85%,
    rgba(11, 122, 117, 0.15) 95%,
    transparent 100%
  );
  box-shadow:
    0 0 10px rgba(11, 122, 117, 0.25),
    0 0 30px rgba(11, 122, 117, 0.08);
  border-radius: 2px;
  pointer-events: none;
}

/* 交点亮点 */
.cross-dot {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow:
    0 0 12px rgba(11, 122, 117, 0.7),
    0 0 32px rgba(11, 122, 117, 0.3),
    0 0 64px rgba(11, 122, 117, 0.15);
  pointer-events: none;
  z-index: 2;
}

/* 标签 */
.cross-label {
  position: absolute;
  font-size: var(--fs-label);
  letter-spacing: 0.12em;
  color: var(--text);
  opacity: 0.8;
  pointer-events: none;
  z-index: 3;
}
.label-h {
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
}
.label-v {
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
}
.label-dot {
  left: calc(50% + 14px);
  top: calc(50% + 14px);
  font-size: var(--fs-body);
  font-weight: 700;
  color: var(--text);
  opacity: 1;
  letter-spacing: 0.06em;
  white-space: nowrap;
}

/* 此刻刻度 — 水平长条右端 */
.tick-now {
  position: absolute;
  right: 8%;
  top: 50%;
  transform: translateY(-50%);
  width: 2px;
  height: 22px;
  background: var(--text);
  opacity: 0.5;
  pointer-events: none;
  z-index: 1;
}
.tick-now::after {
  content: '此刻';
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-size: var(--fs-tick);
  color: var(--text);
  opacity: 0.5;
  letter-spacing: 0.04em;
  white-space: nowrap;
}

/* 淡刻度线 — 水平长条 */
.tick-marks-h {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}
.tick-marks-h .tm {
  position: absolute;
  top: 50%;
  width: 1px;
  height: 12px;
  background: var(--text);
  opacity: 0.12;
  transform: translateY(-50%);
}
.tick-marks-h .tm:nth-child(1) { left: 15%; }
.tick-marks-h .tm:nth-child(2) { left: 30%; }
.tick-marks-h .tm:nth-child(3) { left: 45%; }
.tick-marks-h .tm:nth-child(4) { left: 60%; }
.tick-marks-h .tm:nth-child(5) { left: 75%; }
.tick-marks-h .tm:nth-child(6) { left: 85%; }

/* 淡刻度线 — 垂直长条 */
.tick-marks-v {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}
.tick-marks-v .tm {
  position: absolute;
  left: 50%;
  width: 12px;
  height: 1px;
  background: var(--text);
  opacity: 0.12;
  transform: translateX(-50%);
}
.tick-marks-v .tm:nth-child(1) { top: 15%; }
.tick-marks-v .tm:nth-child(2) { top: 30%; }
.tick-marks-v .tm:nth-child(3) { top: 45%; }
.tick-marks-v .tm:nth-child(4) { top: 60%; }
.tick-marks-v .tm:nth-child(5) { top: 75%; }
.tick-marks-v .tm:nth-child(6) { top: 85%; }

/* 水平长条端部淡化 */
.bar-h-end {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 40px;
  height: 28px;
  background: linear-gradient(to right, transparent, var(--bg));
  pointer-events: none;
  z-index: 1;
}

/* 垂直长条远端模糊 */
.bar-v-fade {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 28px;
  height: 40px;
  background: linear-gradient(to bottom, var(--bg), transparent);
  pointer-events: none;
  z-index: 1;
}

/* 支撑文字区域 — 两列 */
.supports-area {
  width: 100%;
  max-width: 800px;
  display: flex;
  justify-content: space-between;
  gap: var(--space-5);
  flex: 0 0 auto;
}

/* 支撑项 */
.support-item {
  flex: 0 1 360px;
  text-align: left;
}
.support-item .sup-title {
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.06em;
  margin-bottom: var(--space-1);
}
.support-item .sup-body {
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
  color: var(--text);
  opacity: 0.75;
  margin: 0;
}

/* 主张 — 三句话 */
.claim-wrap {
  max-width: 900px;
  text-align: center;
  flex: 0 0 auto;
}
.claim-wrap .claim-line {
  font-size: var(--fs-lead);
  line-height: 1.5;
  color: var(--text);
  margin: 0;
}
.claim-wrap .claim-line:last-child {
  margin-top: var(--space-2);
  font-weight: 700;
  color: var(--accent);
}
.claim-wrap .claim-line:last-child br {
  display: none;
}

/* 调整 k-generalization 内边距与间距 */
.k-generalization {
  gap: 0;
  padding: 0;
  justify-content: center;
  height: 100%;
}
</style>
</head>
<body data-page="43" data-total="50">
<div id="stage">
<main id="main">
<div class="k-generalization">

  <!-- 主张：三句话 -->
  <div class="claim-wrap">
    <p class="claim-line">深时告诉你从哪来：万物都在你身后。</p>
    <p class="claim-line">光速告诉你往哪去：远方还都在你前方。</p>
    <p class="claim-line">两把尺子叠起来，才是这个物种真正的位置——深时的最后一秒，光速的起点。</p>
  </div>

  <!-- 十字视觉 -->
  <div class="cross-wrap">
    <!-- 水平长条：深时 -->
    <div class="bar-h">
      <span class="cross-label label-h">深　时</span>
      <span class="tick-now"></span>
    </div>
    <!-- 垂直长条：光速 -->
    <div class="bar-v">
      <span class="cross-label label-v">光　速</span>
    </div>
    <!-- 淡刻度线 -->
    <div class="tick-marks-h"><span class="tm"></span><span class="tm"></span><span class="tm"></span><span class="tm"></span><span class="tm"></span><span class="tm"></span></div>
    <div class="tick-marks-v"><span class="tm"></span><span class="tm"></span><span class="tm"></span><span class="tm"></span><span class="tm"></span><span class="tm"></span></div>
    <!-- 水平右端淡化 -->
    <div class="bar-h-end"></div>
    <!-- 垂直远端模糊 -->
    <div class="bar-v-fade"></div>
    <!-- 交点亮点 -->
    <div class="cross-dot"></div>
    <span class="cross-label label-dot">我们</span>
  </div>

  <!-- 两条支撑 -->
  <div class="supports-area">
    <div class="support-item">
      <div class="sup-title">支撑一 · 深时</div>
      <p class="sup-body">地球历史几乎长到无法丈量；人类从树上到月球的所有故事，只占末端一瞬。</p>
    </div>
    <div class="support-item">
      <div class="sup-title">支撑二 · 光速</div>
      <p class="sup-body">宇宙以光行进的距离来衡量；最近的星也在人类目前够不到的地方。</p>
    </div>
  </div>

</div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>

Lec.mount({

  kicker: "第五章 · 回望",

});
</script>
</body>
</html>
