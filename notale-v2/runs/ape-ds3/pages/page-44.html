<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}

#main {
  position: relative;
  overflow: hidden;
  background: #0b0e14;
}

/* Earthrise photo background layer */
#photo-layer {
  position: absolute;
  inset: 0;
  background: url(assets/img/earthrise.jpg) center center / cover no-repeat;
  opacity: 0;
  transition: opacity 0.1s ease;
  pointer-events: none;
  z-index: 1;
}

/* Canvas */
#scene {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

/* View name label — top-left */
#view-label {
  position: absolute;
  left: 24px;
  top: 20px;
  z-index: 5;
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--text);
  text-shadow: 0 1px 6px rgba(0,0,0,0.7);
  letter-spacing: 0.04em;
  opacity: 0.9;
  pointer-events: none;
}

/* Compression ratio — bottom-right */
#comp-ratio {
  position: absolute;
  right: 24px;
  bottom: 76px;
  z-index: 5;
  font-size: var(--fs-label);
  font-weight: 700;
  color: #aac;
  text-shadow: 0 1px 6px rgba(0,0,0,0.8);
  text-align: right;
  line-height: 1.4;
  pointer-events: none;
}

/* Data panel — bottom-left */
#data-panel {
  position: absolute;
  left: 24px;
  bottom: 72px;
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: var(--fs-label);
  color: #8899bb;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  pointer-events: none;
  line-height: 1.4;
}
#data-panel .row {
  display: flex;
  gap: 12px;
  align-items: baseline;
}
#data-panel .row .val {
  color: #c8d8ff;
  font-weight: 600;
  font-size: var(--fs-tick);
}

/* Slider bar — bottom */
#slider-bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 20px;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 24px;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  border-top: 1px solid rgba(255,255,255,0.08);
}
#slider-bar .label {
  font-size: var(--fs-label);
  color: #8899bb;
  white-space: nowrap;
  font-weight: 600;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}
#slider-bar .label.active {
  color: #fff;
}
#slider-bar input[type="range"] {
  flex: 1;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
#slider-bar input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #6a8cff;
  border: 2px solid #fff;
  cursor: pointer;
  box-shadow: 0 0 8px rgba(106,140,255,0.4);
}
#slider-bar input[type="range"]::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #6a8cff;
  border: 2px solid #fff;
  cursor: pointer;
}
</style>
</head>
<body data-page="44" data-total="50">
<div id="stage">
<main id="main">
  <div id="photo-layer"></div>
  <canvas id="scene" class="cv-fill"></canvas>
  <div id="view-label">地图视图</div>
  <div id="comp-ratio">同框压缩比<br><span id="comp-val">—</span></div>
  <div id="data-panel">
    <div class="row"><span>地球直径</span><span class="val" id="d-earth">—</span></div>
    <div class="row"><span>月球直径</span><span class="val" id="d-moon">—</span></div>
    <div class="row"><span>地月距离</span><span class="val" id="dist-em">—</span></div>
    <div class="row"><span>月球/地球 ≈</span><span class="val" id="ratio-md">—</span></div>
    <div class="row"><span>地月/地球 ≈</span><span class="val" id="ratio-ed">—</span></div>
  </div>
  <div id="slider-bar">
    <span class="label active" id="label-left">地图视图</span>
    <input type="range" id="zoom-slider" min="0" max="1000" value="0" step="1">
    <span class="label" id="label-right">太空视图</span>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({ index: 44, kicker: "回望", title: "蓝色悬浮点", take: "在地月同框的尺度上，地球是一颗没有国界线的蓝色球体" });

(function(){
  'use strict';

  var cv = document.getElementById('scene');
  var slider = document.getElementById('zoom-slider');
  var viewLabel = document.getElementById('view-label');
  var compVal = document.getElementById('comp-val');
  var photoLayer = document.getElementById('photo-layer');
  var labelLeft = document.getElementById('label-left');
  var labelRight = document.getElementById('label-right');

  // Data elements
  var dEarth = document.getElementById('d-earth');
  var dMoon = document.getElementById('d-moon');
  var distEM = document.getElementById('dist-em');
  var ratioMD = document.getElementById('ratio-md');
  var ratioED = document.getElementById('ratio-ed');

  // Constants from Lec
  var EARTH_R = Lec.K.EARTH_RADIUS_KM;
  var MOON_R = Lec.K.MOON_RADIUS_KM;
  var EM_DIST = Lec.K.EARTH_MOON_KM;
  var EARTH_D = 2 * EARTH_R;
  var MOON_D = 2 * MOON_R;

  // Fill data panel
  dEarth.textContent = Lec.P.round(EARTH_D, 0) + ' km';
  dMoon.textContent = Lec.P.round(MOON_D, 0) + ' km';
  distEM.textContent = Lec.P.round(EM_DIST, 0) + ' km';

  var ratioMtoE = MOON_D / EARTH_D;
  var ratioEtoEM = EM_DIST / EARTH_D;
  ratioMD.textContent = '1/' + Lec.P.round(1/ratioMtoE, 0);
  ratioED.textContent = Lec.P.round(ratioEtoEM, 0) + ':1';

  // Compression ratio
  var compressionRatio = 1 / ratioEtoEM; // ~1/30
  compVal.textContent = '≈ 1/' + Lec.P.round(1/compressionRatio, 0);

  // Stars (simple seeded pseudo-random)
  var stars = [];
  (function() {
    function mulberry32(a) {
      return function() {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    var rng = mulberry32(44);
    for (var i = 0; i < 200; i++) {
      stars.push({
        x: rng() * 1408,
        y: rng() * 620,
        r: 0.3 + rng() * 1.2,
        a: 0.2 + rng() * 0.6
      });
    }
  })();

  // Simplified continent shapes (normalized to unit circle, centered at 0,0)
  // Each continent is an array of [x,y] points
  var continents = [
    // Africa
    { color: '#3a7a3a', pts: [[-0.02,-0.35],[0.06,-0.30],[0.12,-0.20],[0.15,-0.05],[0.12,0.10],[0.08,0.25],[0.00,0.35],[-0.06,0.30],[-0.10,0.20],[-0.12,0.05],[-0.10,-0.10],[-0.08,-0.25]] },
    // Europe
    { color: '#4a8a4a', pts: [[-0.02,-0.38],[0.08,-0.38],[0.12,-0.42],[0.10,-0.48],[0.04,-0.50],[-0.02,-0.48],[-0.06,-0.44]] },
    // Asia
    { color: '#4a7a3a', pts: [[0.12,-0.35],[0.25,-0.30],[0.40,-0.25],[0.50,-0.15],[0.55,-0.05],[0.52,0.05],[0.45,0.12],[0.35,0.15],[0.25,0.10],[0.18,0.00],[0.15,-0.10],[0.12,-0.20]] },
    // North America
    { color: '#3a7a4a', pts: [[-0.10,-0.25],[-0.15,-0.30],[-0.25,-0.32],[-0.35,-0.28],[-0.40,-0.20],[-0.38,-0.12],[-0.32,-0.08],[-0.25,-0.10],[-0.18,-0.15]] },
    // South America
    { color: '#3a7a3a', pts: [[-0.20,0.05],[-0.22,0.00],[-0.28,0.05],[-0.30,0.15],[-0.28,0.25],[-0.22,0.32],[-0.16,0.28],[-0.14,0.20],[-0.16,0.10]] },
    // Australia
    { color: '#4a7a3a', pts: [[0.40,0.25],[0.45,0.22],[0.50,0.25],[0.52,0.32],[0.48,0.38],[0.42,0.36]] },
    // Greenland
    { color: '#5a8a5a', pts: [[-0.02,-0.50],[0.04,-0.52],[0.08,-0.55],[0.06,-0.58],[0.00,-0.58],[-0.04,-0.55]] }
  ];

  function drawScene(t) {
    var ctx = Deck.fit(cv);
    if (!ctx) return;
    var W = cv.width, H = cv.height;

    // Clear
    ctx.clearRect(0, 0, W, H);

    // Draw stars
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Earth position
    var earthX = 380;
    var earthY = 310;
    var earthR = Deck.lerp(180, 55, t);

    // Grid/continent fade
    var gridOpacity = Math.max(0, 1 - t * 2.5);
    var continentOpacity = Math.max(0, 1 - t * 2.2);

    // ---- Draw Earth ----
    // Atmosphere glow (behind Earth)
    var glowGrad = ctx.createRadialGradient(earthX, earthY, earthR * 0.8, earthX, earthY, earthR * 1.3);
    glowGrad.addColorStop(0, 'rgba(80, 160, 255, 0)');
    glowGrad.addColorStop(0.6, 'rgba(80, 160, 255, 0.08)');
    glowGrad.addColorStop(1, 'rgba(80, 160, 255, 0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(earthX, earthY, earthR * 1.3, 0, Math.PI * 2);
    ctx.fill();

    // Clip to Earth circle
    ctx.save();
    ctx.beginPath();
    ctx.arc(earthX, earthY, earthR, 0, Math.PI * 2);
    ctx.clip();

    // Ocean
    var oceanGrad = ctx.createRadialGradient(earthX - earthR*0.3, earthY - earthR*0.3, 0, earthX, earthY, earthR);
    oceanGrad.addColorStop(0, '#1e7a9a');
    oceanGrad.addColorStop(0.5, '#146a88');
    oceanGrad.addColorStop(1, '#0a3d5c');
    ctx.fillStyle = oceanGrad;
    ctx.fillRect(earthX - earthR, earthY - earthR, earthR * 2, earthR * 2);

    // Continents
    if (continentOpacity > 0.01) {
      ctx.globalAlpha = continentOpacity;
      for (var c = 0; c < continents.length; c++) {
        var cont = continents[c];
        ctx.fillStyle = cont.color;
        ctx.beginPath();
        var pts = cont.pts;
        ctx.moveTo(earthX + pts[0][0] * earthR, earthY + pts[0][1] * earthR);
        for (var p = 1; p < pts.length; p++) {
          ctx.lineTo(earthX + pts[p][0] * earthR, earthY + pts[p][1] * earthR);
        }
        ctx.closePath();
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // Grid lines
    if (gridOpacity > 0.01) {
      ctx.globalAlpha = gridOpacity * 0.4;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 0.8;

      // Latitude lines
      for (var lat = -60; lat <= 60; lat += 30) {
        var latR = Math.cos(lat * Math.PI / 180) * earthR;
        var latY = Math.sin(lat * Math.PI / 180) * earthR;
        if (latR > 2) {
          ctx.beginPath();
          ctx.ellipse(earthX, earthY + latY, latR, 2, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      // Longitude lines
      for (var lon = 0; lon < 360; lon += 30) {
        ctx.beginPath();
        ctx.ellipse(earthX, earthY, earthR, earthR, 0, lon * Math.PI / 180, (lon + 20) * Math.PI / 180);
        ctx.stroke();
      }

      ctx.globalAlpha = 1;
    }

    ctx.restore();

    // Earth bright edge highlight
    var hlGrad = ctx.createRadialGradient(earthX - earthR*0.25, earthY - earthR*0.3, earthR*0.1, earthX, earthY, earthR);
    hlGrad.addColorStop(0, 'rgba(255,255,255,0.15)');
    hlGrad.addColorStop(0.5, 'rgba(255,255,255,0.03)');
    hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hlGrad;
    ctx.beginPath();
    ctx.arc(earthX, earthY, earthR, 0, Math.PI * 2);
    ctx.fill();

    // Earth edge (thin border)
    ctx.strokeStyle = 'rgba(100,180,255,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(earthX, earthY, earthR, 0, Math.PI * 2);
    ctx.stroke();

    // ---- Draw Moon ----
    var moonShow = Math.max(0, (t - 0.25) / 0.6);
    if (moonShow > 0.01) {
      var moonR = earthR * ratioMtoE;
      // Moon position: slides in from right
      var moonTx = (t - 0.25) / 0.75;
      moonTx = Math.min(1, Math.max(0, moonTx));
      // Smoothstep
      moonTx = moonTx * moonTx * (3 - 2 * moonTx);
      var moonX = Deck.lerp(1500, earthX + earthR + moonR + earthR * 0.5, moonTx);
      var moonY = earthY + 20;

      ctx.globalAlpha = moonShow;

      // Moon shadow/texture
      var moonGrad = ctx.createRadialGradient(moonX - moonR*0.3, moonY - moonR*0.2, 0, moonX, moonY, moonR);
      moonGrad.addColorStop(0, '#c8c8c8');
      moonGrad.addColorStop(0.6, '#9a9a9a');
      moonGrad.addColorStop(1, '#6a6a6a');
      ctx.fillStyle = moonGrad;
      ctx.beginPath();
      ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
      ctx.fill();

      // Moon edge
      ctx.strokeStyle = 'rgba(200,200,200,0.2)';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
      ctx.stroke();

      ctx.globalAlpha = 1;

      // Distance line between Earth and Moon (subtle)
      if (moonShow > 0.3) {
        ctx.globalAlpha = moonShow * 0.15;
        ctx.setLineDash([3, 6]);
        ctx.strokeStyle = '#6a8cff';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(earthX + earthR * 0.7, earthY);
        ctx.lineTo(moonX - moonR * 0.7, moonY);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
      }
    }

    // Update photo layer
    var photoOpacity = Math.max(0, (t - 0.45) / 0.4);
    photoLayer.style.opacity = photoOpacity;

    // Update view label
    if (t < 0.5) {
      viewLabel.textContent = '地图视图';
    } else {
      viewLabel.textContent = '太空视图';
    }

    // Update slider labels
    var leftActive = t < 0.4;
    var rightActive = t > 0.6;
    labelLeft.classList.toggle('active', leftActive);
    labelRight.classList.toggle('active', rightActive);

    // Update compression ratio
    if (t > 0.3) {
      var compT = (t - 0.3) / 0.7;
      compT = Math.min(1, Math.max(0, compT));
      var displayRatio = 1 + (1/compressionRatio - 1) * compT;
      compVal.textContent = '≈ 1/' + Lec.P.round(displayRatio, 0);
    } else {
      compVal.textContent = '—';
    }
  }

  // Initial draw
  drawScene(0);

  // Slider handler
  slider.addEventListener('input', function() {
    var t = parseInt(slider.value) / 1000;
    drawScene(t);
  });

  // Mouse wheel support
  var main = document.getElementById('main');
  main.addEventListener('wheel', function(e) {
    e.preventDefault();
    var val = parseInt(slider.value);
    var delta = e.deltaY > 0 ? 20 : -20;
    val = Math.max(0, Math.min(1000, val + delta));
    slider.value = val;
    drawScene(val / 1000);
  }, { passive: false });

  // Window resize
  Deck.onResize(function() {
    var t = parseInt(slider.value) / 1000;
    drawScene(t);
  });
})();
</script>
</body>
</html>
