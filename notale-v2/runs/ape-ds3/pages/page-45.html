<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
  --focus: #0b7a75;
}
#main {
  position: relative;
  overflow: hidden;
  background: var(--bg);
}
/* ---- generalization skeleton ---- */
.k-generalization {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 0;
  position: relative;
}
.k-generalization > .claim {
  border-left: 5px solid var(--accent);
  background: var(--accent-soft);
  padding: var(--space-3) var(--space-5);
  font-size: var(--fs-lead);
  font-weight: 700;
  line-height: var(--lh-lead);
  max-width: 70%;
  transition: opacity 0.8s ease;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 30;
  pointer-events: none;
  color: #0b7a75;
}
/* ---- ruler section ---- */
.ruler-section {
  width: 100%;
  flex: 0 0 auto;
  padding: 0 var(--space-5);
  position: relative;
}
.ruler-label {
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.06em;
  text-align: left;
  margin-bottom: var(--space-1);
}
.ruler-track {
  position: relative;
  width: 100%;
  height: 64px;
  background: transparent;
}
.ruler-axis {
  position: absolute;
  top: 30px;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--muted);
  opacity: 0.4;
}
.ruler-end {
  position: absolute;
  top: 20px;
  font-size: var(--fs-label);
  color: var(--muted);
  white-space: nowrap;
  opacity: 0.7;
}
.ruler-end.left  { left: 0; transform: translateX(0); }
.ruler-end.right { right: 0; transform: translateX(0); }
/* fixed markers on ruler */
.ruler-marker {
  position: absolute;
  top: 0;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  pointer-events: none;
  z-index: 3;
}
.ruler-marker .marker-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg);
}
.ruler-marker .marker-label {
  font-size: var(--fs-label);
  color: var(--accent);
  white-space: nowrap;
  font-weight: 600;
}
.ruler-marker.fixed .marker-dot {
  width: 6px;
  height: 6px;
  background: var(--muted);
  border-color: var(--muted);
}
.ruler-marker.fixed .marker-label {
  color: var(--muted);
  font-weight: 400;
}
/* placed card on ruler */
.ruler-card {
  position: absolute;
  top: 0;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  z-index: 5;
  cursor: pointer;
  user-select: none;
  touch-action: none;
}
.ruler-card .card-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #e6e6e6;
  border: 2px solid var(--bg);
  box-shadow: 0 0 0 1px rgba(230,230,230,0.3);
}
.ruler-card .tick-mark {
  width: 1px;
  height: 6px;
  background: var(--accent);
}
.ruler-card .card-name {
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  background: rgba(11, 14, 20, 0.85);
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  line-height: 1.4;
}
.ruler-card .card-value {
  font-size: var(--fs-label);
  color: var(--accent);
  white-space: nowrap;
  background: rgba(11, 122, 117, 0.12);
  padding: 0 6px;
  border-radius: 2px;
  line-height: 1.4;
}
/* ---- event tray ---- */
.event-tray {
  width: 100%;
  flex: 0 0 auto;
  padding: 0 var(--space-5);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-2);
  z-index: 20;
}
.tray-title {
  font-size: var(--fs-sec);
  color: var(--muted);
  text-align: center;
  margin-bottom: 0;
}
.tray-row {
  display: flex;
  justify-content: center;
  gap: var(--space-6);
}
.tray-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-2);
}
.tray-group-label {
  font-size: var(--fs-label);
  font-weight: 700;
  letter-spacing: 0.04em;
}
.tray-group-label.deep {
  color: var(--accent);
}
.tray-group-label.light {
  color: #b85a1a;
}
.tray-cards {
  display: flex;
  justify-content: center;
  gap: var(--space-3);
}
/* ---- event card ---- */
.event-card {
  padding: var(--space-2) var(--space-4);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  font-size: var(--fs-body);
  font-weight: 600;
  color: var(--text);
  cursor: grab;
  user-select: none;
  touch-action: none;
  transition: box-shadow 0.15s, border-color 0.15s;
  white-space: nowrap;
  position: relative;
  z-index: 1;
}
.event-card:hover {
  box-shadow: 0 2px 12px rgba(11, 122, 117, 0.25);
}
.event-card.dragging {
  cursor: grabbing;
  z-index: 200;
  box-shadow: 0 8px 28px rgba(0,0,0,0.5);
  border-color: var(--accent);
  background: #1a3a38;
  color: #5cd6d0;
}
.event-card.placed {
  opacity: 0.3;
  pointer-events: none;
  border-color: #3a3a3a;
}
.event-card.zone-deep {
  border-left: 3px solid var(--accent);
}
.event-card.zone-light {
  border-left: 3px solid #b85a1a;
}

</style>
</head>
<body data-page="45" data-total="50">
<div id="stage">
<main id="main">
<div class="k-generalization">

  <!-- Deep time ruler -->
  <div class="ruler-section" style="padding-top:var(--space-2);">
    <div class="ruler-label">⟵ 深时尺 · 地球形成 → 今天</div>
    <div class="ruler-track" id="dt-track">
      <div class="ruler-axis"></div>
      <div class="ruler-end left">地球形成</div>
      <div class="ruler-end right">今天</div>
      <div class="ruler-marker fixed" style="left:0%">
        <div class="marker-dot"></div><div class="marker-label">0%</div>
      </div>
      <div class="ruler-marker fixed" style="left:100%">
        <div class="marker-dot"></div><div class="marker-label">100%</div>
      </div>
    </div>
  </div>

  <!-- Event tray -->
  <div class="event-tray" id="tray">
    <div class="tray-title">将事件卡拖到对应尺子上</div>
    <div class="tray-row">
      <div class="tray-group">
        <div class="tray-group-label deep">深时区</div>
        <div class="tray-cards" id="tray-deep">
          <div class="event-card zone-deep" data-event="earliest-life" data-ruler="deep-time">最早生命</div>
          <div class="event-card zone-deep" data-event="dino-extinction" data-ruler="deep-time">恐龙灭绝</div>
          <div class="event-card zone-deep" data-event="homo-sapiens" data-ruler="deep-time">智人出现</div>
        </div>
      </div>
      <div class="tray-group">
        <div class="tray-group-label light">光速区</div>
        <div class="tray-cards" id="tray-light">
          <div class="event-card zone-light" data-event="moon" data-ruler="light-speed">月球</div>
          <div class="event-card zone-light" data-event="sun" data-ruler="light-speed">太阳</div>
          <div class="event-card zone-light" data-event="proxima" data-ruler="light-speed">比邻星</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Light speed ruler -->
  <div class="ruler-section" style="padding-bottom:var(--space-2);">
    <div class="ruler-label">⟵ 光速尺 · 地球 → 最近的恒星 (4.24 光年)</div>
    <div class="ruler-track" id="ls-track">
      <div class="ruler-axis"></div>
      <div class="ruler-end left">地球</div>
      <div class="ruler-end right">最近的恒星</div>
      <div class="ruler-marker fixed" style="left:0%">
        <div class="marker-dot"></div><div class="marker-label">人类足迹</div>
      </div>
    </div>
  </div>

  <!-- Summary claim -->
  <div class="claim" id="summary-claim" style="opacity:0;">
    最后一秒 vs 第一寸
  </div>

</div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 45,
  kicker: "五 回望",
  title: "双尺定位",
  take: "人类在深时尺上是最后一秒，在光速尺上连第一寸都不到"
});

(function() {
  'use strict';

  var stage = document.getElementById('stage');
  var dtTrack = document.getElementById('dt-track');
  var lsTrack = document.getElementById('ls-track');
  var summaryClaim = document.getElementById('summary-claim');

  // ---- event data ----
  var events = {
    'earliest-life': {
      name: '最早生命', ruler: 'deep-time',
      getPct: function() { return Lec.P.earthTimelinePercent(Lec.K.EARLIEST_LIFE_YEARS) * 100; },
      getLabel: function() { return Lec.P.round(Lec.P.yearsToBillionYears(Lec.K.EARLIEST_LIFE_YEARS), 1) + '亿年前'; }
    },
    'dino-extinction': {
      name: '恐龙灭绝', ruler: 'deep-time',
      getPct: function() { return Lec.P.earthTimelinePercent(Lec.K.DINOSAUR_EXTINCTION_YEARS) * 100; },
      getLabel: function() { return Lec.P.round(Lec.P.yearsToMillionYears(Lec.K.DINOSAUR_EXTINCTION_YEARS), 0) + '万年前'; }
    },
    'homo-sapiens': {
      name: '智人出现', ruler: 'deep-time',
      getPct: function() { return Lec.P.earthTimelinePercent(Lec.K.HOMO_SAPIENS_YEARS) * 100; },
      getLabel: function() { return Lec.P.round(Lec.P.yearsToThousandYears(Lec.K.HOMO_SAPIENS_YEARS), 0) + '万年前'; }
    },
    'moon': {
      name: '月球', ruler: 'light-speed',
      getPct: function() { return (Lec.P.kmToLy(Lec.K.EARTH_MOON_KM) / Lec.K.NEAREST_STAR_LY) * 100; },
      getLabel: function() { return Lec.P.round(Lec.P.lightTravelTimeSeconds(Lec.K.EARTH_MOON_KM), 1) + '光秒'; }
    },
    'sun': {
      name: '太阳', ruler: 'light-speed',
      getPct: function() { return (Lec.P.kmToLy(Lec.K.EARTH_SUN_KM) / Lec.K.NEAREST_STAR_LY) * 100; },
      getLabel: function() { return Lec.P.round(Lec.P.lightTravelTimeMinutes(Lec.K.EARTH_SUN_KM), 1) + '光分'; }
    },
    'proxima': {
      name: '比邻星', ruler: 'light-speed',
      getPct: function() { return 100; },
      getLabel: function() { return Lec.P.round(Lec.K.NEAREST_STAR_LY, 2) + '光年'; }
    }
  };

  // ---- state ----
  var dragData = null;
  var placedCount = 0;
  var totalCards = 6;

  // ---- convert stage-client coords to stage-logical ----
  function stagePt(e) {
    return Deck.pt(stage, e);
  }

  // ---- get track rect in stage-logical coords ----
  function getTrackRect(trackEl) {
    var sr = stage.getBoundingClientRect();
    var tr = trackEl.getBoundingClientRect();
    return {
      left: (tr.left - sr.left) / Deck.s,
      top: (tr.top - sr.top) / Deck.s,
      width: tr.width / Deck.s,
      height: tr.height / Deck.s
    };
  }

  // ---- check if stage-logical point is over a ruler ----
  function getRulerAtPoint(sx, sy) {
    var dtr = getTrackRect(dtTrack);
    if (sx >= dtr.left && sx <= dtr.left + dtr.width &&
        sy >= dtr.top && sy <= dtr.top + dtr.height) return 'deep-time';
    var lsr = getTrackRect(lsTrack);
    if (sx >= lsr.left && sx <= lsr.left + lsr.width &&
        sy >= lsr.top && sy <= lsr.top + lsr.height) return 'light-speed';
    return null;
  }

  // ---- get the element's center in stage-logical coords ----
  function getElementStageCenter(el) {
    var sr = stage.getBoundingClientRect();
    var er = el.getBoundingClientRect();
    return {
      x: (er.left - sr.left) / Deck.s + (er.width / Deck.s) / 2,
      y: (er.top - sr.top) / Deck.s + (er.height / Deck.s) / 2
    };
  }

  // ---- create a ruler card element ----
  var CARD_TOP_DEFAULT = 19; // card top that centers the dot on the axis (30px)
  function createRulerCard(eventKey, pct, label, vOff) {
    vOff = vOff || 0;
    var ev = events[eventKey];
    var track = ev.ruler === 'deep-time' ? dtTrack : lsTrack;
    var el = document.createElement('div');
    el.className = 'ruler-card';
    el.dataset.event = eventKey;
    el.dataset.ruler = ev.ruler;
    el.style.left = pct + '%';
    el.style.top = (CARD_TOP_DEFAULT + vOff) + 'px';
    el.innerHTML =
      '<div class="tick-mark"></div>' +
      '<div class="card-dot"></div>' +
      '<div class="card-name">' + ev.name + '</div>' +
      '<div class="card-value">' + label + '</div>';
    el.addEventListener('pointerdown', onRulerCardDown);
    track.appendChild(el);
    return el;
  }

  // ---- vertical offset for moon/sun to avoid overlap ----
  function getVerticalOffset(eventKey, pct) {
    if (eventKey === 'moon' && pct < 0.1) return -12;
    if (eventKey === 'sun' && pct < 0.1) return 12;
    return 0;
  }

  // ---- animate tray card to ruler position, then create ruler card ----
  function animateToRuler(trayCard, eventKey, rulerType, pct, label) {
    var ev = events[eventKey];
    if (!ev) return;
    var track = rulerType === 'deep-time' ? dtTrack : lsTrack;
    var trackRect = getTrackRect(track);

    // Get target position in stage-logical coords
    var targetX = trackRect.left + (pct / 100) * trackRect.width;
    var targetY = trackRect.top + CARD_TOP_DEFAULT + 10; // center of dot area

    // Add vertical offset for overlapping cards
    var vOff = getVerticalOffset(eventKey, pct);
    targetY += vOff;

    // Get tray card center in stage-logical coords
    var center = getElementStageCenter(trayCard);

    // Set tray card to absolute within stage for animation
    trayCard.style.position = 'absolute';
    trayCard.style.left = center.x + 'px';
    trayCard.style.top = center.y + 'px';
    trayCard.style.transform = 'translate(-50%, -50%)';
    trayCard.style.zIndex = 50;
    trayCard.style.transition = 'none';
    trayCard.getBoundingClientRect(); // force layout

    // Animate to target
    trayCard.style.transition = 'left 0.3s ease, top 0.3s ease';
    trayCard.style.left = targetX + 'px';
    trayCard.style.top = targetY + 'px';

    // After animation, create ruler card and hide tray card
    var tid = setTimeout(function() {
      createRulerCard(eventKey, pct, label, vOff);
      trayCard.style.display = 'none';
      trayCard.style.position = '';
      trayCard.style.left = '';
      trayCard.style.top = '';
      trayCard.style.transform = '';
      trayCard.style.zIndex = '';
      trayCard.style.transition = '';

      placedCount++;
      checkAllPlaced();
    }, 350);
    trayCard._animTimeout = tid;
  }

  // ---- check all placed ----
  function checkAllPlaced() {
    if (placedCount >= totalCards) {
      summaryClaim.style.opacity = '1';
    }
  }

  // ---- pointer handlers for tray cards ----
  function onTrayCardDown(e) {
    var card = this;
    if (card.classList.contains('placed')) return;
    e.preventDefault();
    card.setPointerCapture(e.pointerId);

    var pt = stagePt(e);
    var center = getElementStageCenter(card);

    card.classList.add('dragging');
    card.style.position = 'absolute';
    card.style.left = center.x + 'px';
    card.style.top = center.y + 'px';
    card.style.transform = 'translate(-50%, -50%)';
    card.style.zIndex = 200;
    card.style.transition = 'none';
    // Force layout
    card.getBoundingClientRect();

    dragData = {
      card: card,
      eventKey: card.dataset.event,
      rulerType: card.dataset.ruler,
      offsetX: pt.x - center.x,
      offsetY: pt.y - center.y,
      pointerId: e.pointerId
    };
  }

  function onTrayCardMove(e) {
    if (!dragData || dragData.card !== this) return;
    if (e.pointerId !== dragData.pointerId) return;
    e.preventDefault();
    var pt = stagePt(e);
    this.style.left = (pt.x - dragData.offsetX) + 'px';
    this.style.top = (pt.y - dragData.offsetY) + 'px';
  }

  function onTrayCardUp(e) {
    if (!dragData || dragData.card !== this) return;
    if (e.pointerId !== dragData.pointerId) return;
    this.releasePointerCapture(e.pointerId);

    var pt = stagePt(e);
    var ruler = getRulerAtPoint(pt.x, pt.y);

    if (ruler && ruler === dragData.rulerType) {
      // Successfully placed - animate to position
      var ev = events[dragData.eventKey];
      var pct = Math.max(0, Math.min(100, ev.getPct()));
      var label = ev.getLabel();
      this.classList.add('placed');
      this.classList.remove('dragging');
      animateToRuler(this, dragData.eventKey, dragData.rulerType, pct, label);
    } else {
      // Return to tray
      this.classList.remove('dragging');
      this.style.position = '';
      this.style.left = '';
      this.style.top = '';
      this.style.transform = '';
      this.style.zIndex = '';
      this.style.transition = '';
    }
    dragData = null;
  }

  function onTrayCardCancel(e) {
    if (!dragData || dragData.card !== this) return;
    this.classList.remove('dragging');
    this.style.position = '';
    this.style.left = '';
    this.style.top = '';
    this.style.transform = '';
    this.style.zIndex = '';
    this.style.transition = '';
    dragData = null;
  }

  // ---- pointer handlers for ruler cards (re-drag: click to return to tray) ----
  function onRulerCardDown(e) {
    var rulerCard = this;
    e.preventDefault();
    var eventKey = rulerCard.dataset.event;
    var ev = events[eventKey];
    if (!ev) return;

    // Remove ruler card
    rulerCard.remove();

    // Find tray card
    var trayCard = document.querySelector('.event-card[data-event="' + eventKey + '"]');
    if (!trayCard) return;

    // Clear any pending animation timeout
    if (trayCard._animTimeout) {
      clearTimeout(trayCard._animTimeout);
      trayCard._animTimeout = null;
    }

    // Restore tray card
    trayCard.classList.remove('placed');
    trayCard.style.display = '';
    trayCard.style.position = '';
    trayCard.style.left = '';
    trayCard.style.top = '';
    trayCard.style.zIndex = '';
    trayCard.style.transform = '';
    trayCard.style.transition = '';

    placedCount = Math.max(0, placedCount - 1);
    summaryClaim.style.opacity = '0';
  }

  // ---- attach events to all tray cards ----
  var trayCards = document.querySelectorAll('.event-card');
  trayCards.forEach(function(card) {
    card.addEventListener('pointerdown', onTrayCardDown);
    card.addEventListener('pointermove', onTrayCardMove);
    card.addEventListener('pointerup', onTrayCardUp);
    card.addEventListener('pointercancel', onTrayCardCancel);
  });

})();
</script>
</body>
</html>
