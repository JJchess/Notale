<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #0b0e14;
  --text: #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}

#main {
  position: relative;
  overflow: hidden;
  background: var(--bg);
}

/* Background illustration */
#main .bg-ill {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.6;
  pointer-events: none;
}

/* Title overlay */
.title-overlay {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 10;
  padding: var(--space-5) var(--space-6);
  pointer-events: none;
}
.title-overlay .kicker {
  font-size: var(--fs-label);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: var(--space-2);
}
.title-overlay h1 {
  font-size: var(--fs-h1);
  font-weight: 700;
  margin: 0;
  color: var(--text);
  line-height: var(--lh-h1);
}

/* Message text */
.msg {
  position: absolute;
  bottom: var(--space-7);
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  text-align: center;
  pointer-events: none;
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--text);
  opacity: 0.9;
  max-width: 70%;
}
.msg p {
  margin: var(--space-2) 0;
}
.msg .highlight {
  color: var(--accent);
  font-weight: 700;
}

/* SVG overlay */
#journey-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 5;
  pointer-events: none;
}

/* Glow filter for path and light */
#journey-svg .glow-line {
  stroke: url(#pathGrad);
  stroke-width: 2.5;
  fill: none;
  stroke-linecap: round;
}
#journey-svg .glow-line-bg {
  stroke: rgba(11, 122, 117, 0.15);
  stroke-width: 12;
  fill: none;
  stroke-linecap: round;
  filter: url(#glow);
}
#journey-svg .glow-line-halo {
  stroke: rgba(11, 122, 117, 0.06);
  stroke-width: 24;
  fill: none;
  stroke-linecap: round;
  filter: url(#glow);
}

/* Node styling */
.node {
  cursor: pointer;
  transition: opacity 0.3s ease;
}
.node-circle {
  fill: rgba(30, 35, 45, 0.85);
  stroke: rgba(120, 130, 140, 0.4);
  stroke-width: 1.5;
  transition: fill 0.5s ease, stroke 0.5s ease, filter 0.5s ease;
}
.node-circle.lit {
  fill: rgba(11, 122, 117, 0.2);
  stroke: var(--accent);
  stroke-width: 2;
  filter: url(#glow);
}
.node-icon {
  fill: rgba(160, 170, 180, 0.5);
  transition: fill 0.5s ease;
}
.node-icon.lit {
  fill: #e6e6e6;
}
.node-label {
  font-size: var(--fs-label);
  fill: var(--text);
  text-anchor: middle;
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
}
.node-label.lit {
  opacity: 1;
}
.node-label-sub {
  font-size: 13px;
  fill: var(--accent);
  text-anchor: middle;
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
}
.node-label-sub.lit {
  opacity: 1;
}
.node-label-bg {
  fill: rgba(11, 14, 20, 0.7);
  rx: 4;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.node-label-bg.lit {
  opacity: 1;
}

/* Light point */
.light-core {
  fill: #fff;
  filter: url(#glow);
}
.light-halo {
  fill: rgba(11, 122, 117, 0.3);
  filter: url(#glow);
}
.light-outer {
  fill: rgba(11, 122, 117, 0.08);
  filter: url(#glow);
}

/* Slider control */
.slider-ctl {
  position: absolute;
  bottom: var(--space-5);
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  width: 50%;
  max-width: 640px;
  pointer-events: auto;
}
.slider-ctl input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: rgba(120, 130, 140, 0.3);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
  accent-color: var(--accent);
}
.slider-ctl input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid rgba(255,255,255,0.4);
  cursor: pointer;
  box-shadow: 0 0 12px rgba(11,122,117,0.5);
}
.slider-ctl input[type="range"]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid rgba(255,255,255,0.4);
  cursor: pointer;
}
.slider-ctl .slider-label {
  font-size: var(--fs-tick);
  color: var(--muted);
  white-space: nowrap;
  min-width: 3em;
  text-align: center;
}



/* Auto-play button */
.auto-btn {
  position: absolute;
  bottom: var(--space-5);
  right: var(--space-6);
  z-index: 20;
  pointer-events: auto;
}
.auto-btn button {
  background: rgba(11, 122, 117, 0.2);
  border: 1px solid var(--accent);
  color: var(--text);
  font-size: var(--fs-label);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.3s ease;
}
.auto-btn button:hover {
  background: rgba(11, 122, 117, 0.4);
}

/* Responsive adjustments */
@media (max-width: 1366px) {
  .title-overlay { padding: var(--space-4) var(--space-5); }
  .slider-ctl { width: 60%; }
}
</style>
</head>
<body data-page="46" data-total="50">
<div id="stage">
<main id="main">
  <!-- Background illustration -->
  <img class="bg-ill" src="assets/img/p46-bg.png" alt="" draggable="false">

  <!-- Title overlay -->
  <div class="title-overlay">
    <div class="kicker">五 回望</div>
    <h1>同一根线</h1>
  </div>

  <!-- SVG overlay -->
  <svg id="journey-svg" viewBox="0 0 1408 620" preserveAspectRatio="xMidYMid meet">
    <defs>
      <!-- Glow filter -->
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <!-- Path gradient -->
      <linearGradient id="pathGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="rgba(11,122,117,0.4)"/>
        <stop offset="50%" stop-color="rgba(11,122,117,0.9)"/>
        <stop offset="100%" stop-color="rgba(200,220,230,0.8)"/>
      </linearGradient>
      <!-- Node icon paths -->
      <!-- 1. Branch -->
      <g id="icon-branch">
        <path d="M-6,0 Q0,-8 6,0 M-4,-2 L-2,-6 M-2,-1 L2,-5 M0,0 L4,-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>
      <!-- 2. Footprint -->
      <g id="icon-footprint">
        <ellipse cx="0" cy="2" rx="4" ry="5" stroke="currentColor" stroke-width="1.2" fill="none"/>
        <path d="M-2,0 L2,0 M-2,-2 L2,-2 M-1,-4 L1,-4" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round"/>
      </g>
      <!-- 3. Brain -->
      <g id="icon-brain">
        <path d="M-4,-3 C-6,-7 0,-9 4,-5 C6,-3 5,0 3,2 C5,4 3,7 0,7 C-3,7 -5,4 -3,2 C-5,0 -7,-3 -4,-3Z" stroke="currentColor" stroke-width="1.2" fill="none"/>
        <path d="M-1,0 L1,0 M-1,-2 L1,-2 M-1,2 L1,2" stroke="currentColor" stroke-width="0.8" fill="none" stroke-linecap="round"/>
      </g>
      <!-- 4. Flame -->
      <g id="icon-flame">
        <path d="M0,-7 C2,-3 3,1 1,4 C-1,5 -2,3 -2,1 C-3,3 -5,1 -2,-3 C-1,-1 0,-3 0,-7Z" stroke="currentColor" stroke-width="1.2" fill="none"/>
      </g>
      <!-- 5. Walking figure -->
      <g id="icon-walk">
        <circle cx="0" cy="-6" r="2" stroke="currentColor" stroke-width="1.2" fill="none"/>
        <path d="M0,-4 L0,2 M-3,6 L0,2 L3,6 M-3,0 L0,-1 L3,0" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </g>
      <!-- 6. Wheat -->
      <g id="icon-wheat">
        <path d="M0,-7 L0,0" stroke="currentColor" stroke-width="1.2" fill="none"/>
        <path d="M-2,-5 L2,-3 M-2,-3 L2,-1 M-1,-1 L1,1" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round"/>
        <path d="M-2,0 L2,0" stroke="currentColor" stroke-width="0.8" fill="none"/>
      </g>
      <!-- 7. Gear -->
      <g id="icon-gear">
        <circle cx="0" cy="0" r="4" stroke="currentColor" stroke-width="1.2" fill="none"/>
        <path d="M0,-6 L0.5,-4 M0,6 L0.5,4 M-6,0 L-4,0.5 M6,0 L4,0.5 M-4.5,-4.5 L-3,-3 M4.5,4.5 L3,3 M-4.5,4.5 L-3,3 M4.5,-4.5 L3,-3" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </g>
      <!-- 8. Rocket -->
      <g id="icon-rocket">
        <path d="M0,-7 L4,3 L0,1 L-4,3 Z" stroke="currentColor" stroke-width="1.2" fill="none"/>
        <path d="M-2,4 L-2,7 M2,4 L2,7" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round"/>
      </g>
      <!-- 9. Moon -->
      <g id="icon-moon">
        <circle cx="0" cy="0" r="6" stroke="currentColor" stroke-width="1.2" fill="none"/>
        <circle cx="-2" cy="-2" r="1.5" stroke="currentColor" stroke-width="0.8" fill="none"/>
        <circle cx="2" cy="1" r="1" stroke="currentColor" stroke-width="0.8" fill="none"/>
        <path d="M0,4 L2,4" stroke="currentColor" stroke-width="0.8" fill="none" stroke-linecap="round"/>
      </g>
    </defs>

    <!-- Glow halos behind the path -->
    <path class="glow-line-halo" d="M 140,540 C 320,540 460,430 660,390 C 860,350 1060,220 1280,80"/>
    <path class="glow-line-bg" d="M 140,540 C 320,540 460,430 660,390 C 860,350 1060,220 1280,80"/>
    
    <!-- The visible glowing path -->
    <path class="glow-line" id="main-path" d="M 140,540 C 320,540 460,430 660,390 C 860,350 1060,220 1280,80"/>

    <!-- Nodes will be positioned by JS -->
    <g id="nodes-container"></g>

    <!-- Light point group -->
    <g id="light-point" style="display:none">
      <circle class="light-outer" cx="0" cy="0" r="28" fill="rgba(11,122,117,0.06)"/>
      <circle class="light-halo" cx="0" cy="0" r="14" fill="rgba(11,122,117,0.25)"/>
      <circle class="light-core" cx="0" cy="0" r="5" fill="#fff"/>
    </g>
  </svg>

  <!-- Message text -->
  <div class="msg">
    <p>从树枝到月面，是<span class="highlight">同一根线</span>的两端。</p>
    <p>中间没有断点，只有一段接一段的承接。</p>
  </div>

  <!-- Slider control -->
  <div class="slider-ctl">
    <span class="slider-label" id="slider-start">起点</span>
    <input type="range" id="scan-slider" min="0" max="1000" value="0" step="1" aria-label="沿长线扫描">
    <span class="slider-label" id="slider-end">终点</span>
  </div>

  <!-- Auto-play button -->
  <div class="auto-btn">
    <button id="auto-play-btn" title="自动播放全线路">▶ 巡览</button>
  </div>

</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
(function() {
  'use strict';

  // Mount page header/footer
  Lec.mount({
    index: 46,
    kicker: "五 回望",
    title: "同一根线",
    take: "从树枝到月面，是同一根线的两端"
  });

  // --- Node data ---
  var NODES = [
    { id: 0, name: '树上',     icon: 'icon-branch',    num: null },
    { id: 1, name: '双足行走', icon: 'icon-footprint', num: null },
    { id: 2, name: '脑容量',   icon: 'icon-brain',     num: null },
    { id: 3, name: '工具与火', icon: 'icon-flame',     num: null },
    { id: 4, name: '智人迁徙', icon: 'icon-walk',      num: null },
    { id: 5, name: '农业',     icon: 'icon-wheat',     num: null },
    { id: 6, name: '文明加速', icon: 'icon-gear',      num: null },
    { id: 7, name: '火箭与轨道',icon: 'icon-rocket',   num: null },
    { id: 8, name: '月面',     icon: 'icon-moon',      num: null }
  ];

  // --- Format numbers from Lec ---
  // Compute actual values: HOMO_SAPIENS_YEARS=30万年前, AGRICULTURE_START_YEARS=1.2万年前
  if (Lec.K && Lec.P) {
    var homoYears = Lec.K.HOMO_SAPIENS_YEARS;
    var agriYears = Lec.K.AGRICULTURE_START_YEARS;
    NODES[4].num = Lec.P.round(homoYears / 10000, 0) + '万年前';
    NODES[5].num = Lec.P.round(agriYears / 10000, 1) + '万年前';
  }

  // --- DOM refs ---
  var svg = document.getElementById('journey-svg');
  var path = document.getElementById('main-path');
  var nodesContainer = document.getElementById('nodes-container');
  var lightPoint = document.getElementById('light-point');
  var slider = document.getElementById('scan-slider');
  var autoBtn = document.getElementById('auto-play-btn');

  var pathLen = path.getTotalLength();
  var nodePositions = []; // will store { dist, point }

  // --- Create nodes ---
  function createNodes() {
    for (var i = 0; i < NODES.length; i++) {
      var t = i / (NODES.length - 1);
      var dist = t * pathLen;
      var pt = path.getPointAtLength(dist);
      nodePositions.push({ dist: dist, point: pt });

      var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'node');
      g.setAttribute('data-node-id', i);
      g.setAttribute('transform', 'translate(' + pt.x + ',' + pt.y + ')');

      // Circle
      var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('class', 'node-circle');
      circle.setAttribute('r', '18');
      g.appendChild(circle);

      // Icon
      var icon = document.createElementNS('http://www.w3.org/2000/svg', 'use');
      icon.setAttribute('href', '#' + NODES[i].icon);
      icon.setAttribute('class', 'node-icon');
      icon.setAttribute('width', '20');
      icon.setAttribute('height', '20');
      icon.setAttribute('x', '-10');
      icon.setAttribute('y', '-10');
      g.appendChild(icon);

      // Label background
      var labelBg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      var labelW = NODES[i].num ? 90 : 70;
      labelBg.setAttribute('class', 'node-label-bg');
      labelBg.setAttribute('x', -labelW/2);
      labelBg.setAttribute('y', -48);
      labelBg.setAttribute('width', labelW);
      labelBg.setAttribute('height', NODES[i].num ? 32 : 20);
      g.appendChild(labelBg);

      // Label
      var label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('class', 'node-label');
      label.setAttribute('y', NODES[i].num ? -34 : -34);
      label.textContent = NODES[i].name;
      g.appendChild(label);

      // Sub-label (number)
      if (NODES[i].num) {
        var sub = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        sub.setAttribute('class', 'node-label-sub');
        sub.setAttribute('y', -20);
        sub.textContent = NODES[i].num;
        g.appendChild(sub);
      }

      // Store refs
      g._circle = circle;
      g._icon = icon;
      g._label = label;
      g._labelBg = labelBg;
      g._sub = g.querySelector('.node-label-sub');

      nodesContainer.appendChild(g);
    }
  }

  createNodes();

  // --- Update light point and node states ---
  function updateScan(progress) {
    // progress: 0..1
    var dist = progress * pathLen;
    var pt = path.getPointAtLength(dist);

    // Position light point
    lightPoint.setAttribute('transform', 'translate(' + pt.x + ',' + pt.y + ')');
    lightPoint.style.display = 'block';

    // Update node states
    var allNodes = nodesContainer.querySelectorAll('.node');
    for (var i = 0; i < allNodes.length; i++) {
      var g = allNodes[i];
      var nodeDist = nodePositions[i].dist;
      var isLit = dist >= nodeDist - 2; // very small threshold

      g._circle.classList.toggle('lit', isLit);
      g._icon.classList.toggle('lit', isLit);
      g._label.classList.toggle('lit', isLit);
      if (g._labelBg) g._labelBg.classList.toggle('lit', isLit);
      if (g._sub) g._sub.classList.toggle('lit', isLit);
    }
  }

  // --- Slider event ---
  slider.addEventListener('input', function() {
    var val = parseFloat(this.value) / 1000;
    updateScan(val);
  });

  // --- Auto-play with gsap ---
  var autoPlaying = false;
  var autoTween = null;

  function startAutoPlay() {
    if (autoPlaying) return;
    autoPlaying = true;
    autoBtn.textContent = '⏹ 停止';

    // Kill any existing tween
    if (autoTween) autoTween.kill();

    // Animate slider value from current to max
    var startVal = parseFloat(slider.value);
    var target = 1000;
    autoTween = gsap.to(slider, {
      value: target,
      duration: 8,
      ease: 'power1.inOut',
      onUpdate: function() {
        var val = parseFloat(slider.value) / 1000;
        updateScan(val);
      },
      onComplete: function() {
        autoPlaying = false;
        autoBtn.textContent = '▶ 巡览';
        autoTween = null;
      }
    });
  }

  function stopAutoPlay() {
    if (!autoPlaying) return;
    autoPlaying = false;
    if (autoTween) {
      autoTween.kill();
      autoTween = null;
    }
    autoBtn.textContent = '▶ 巡览';
  }

  autoBtn.addEventListener('click', function() {
    if (autoPlaying) {
      stopAutoPlay();
    } else {
      startAutoPlay();
    }
  });

  // --- Keyboard support ---
  slider.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
      e.preventDefault();
      this.value = Math.min(1000, parseFloat(this.value) + 10);
      updateScan(parseFloat(this.value) / 1000);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      e.preventDefault();
      this.value = Math.max(0, parseFloat(this.value) - 10);
      updateScan(parseFloat(this.value) / 1000);
    }
  });

  // --- Initial state: show first node lit ---
  updateScan(0);

  // --- Reduced motion: instant full view ---
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    slider.value = 1000;
    updateScan(1);
    autoBtn.style.display = 'none';
  }

})();
</script>
</body>
</html>
