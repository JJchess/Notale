<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== Page 48: 择边投票 ===== */

#main {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 18px 0 0 0;
  box-sizing: border-box;
}

.p48-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 1000px;
  flex: 1;
}

/* ---- 情境卡 ---- */
.scenario-card {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  box-shadow: var(--shadow-sm);
}
.scenario-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}
.scenario-label {
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.scenario-dist {
  font-size: var(--fs-label);
  color: var(--muted);
}
.scenario-text {
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  margin: 0;
  color: var(--text);
}

/* ---- 导语 ---- */
.p48-lead {
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
  color: var(--muted);
  text-align: center;
  margin: 0;
}

/* ---- 比较矩阵 ---- */
.p48-cmp {
  width: 100%;
  --cmp-cols: 2;
  --dim-w: 110px;
}
.p48-cmp .reply-cell,
.p48-cmp .silence-cell {
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
  transition: opacity 0.5s ease, filter 0.5s ease, background 0.4s ease;
}
.p48-cmp .hdr {
  font-size: var(--fs-body);
  font-weight: 700;
  text-align: center;
  text-transform: none;
  letter-spacing: 0;
}
.p48-cmp .hdr:first-child {
  text-align: center;
  font-size: var(--fs-sec);
  font-weight: 600;
  color: var(--muted);
}
.p48-cmp .dim {
  font-size: var(--fs-label);
  font-weight: 600;
  color: var(--text);
  padding-top: 18px;
  vertical-align: top;
}
.p48-cmp .dimmed {
  opacity: 0.28;
  filter: saturate(0.1);
}
.p48-cmp .diff {
  background: var(--accent-soft);
  font-weight: 600;
}
.p48-cmp .col-highlight {
  background: var(--accent-soft);
}

/* ---- 投票按钮行 ---- */
.vote-row {
  display: flex;
  justify-content: center;
  gap: 60px;
  width: 100%;
  padding: 4px 0 0 0;
}
.vote-btn {
  width: 200px;
  padding: 10px 0;
  border: 2px solid var(--accent);
  background: transparent;
  border-radius: var(--radius-sm);
  color: var(--accent);
  font-size: var(--fs-body);
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
  font-family: inherit;
}
.vote-btn:hover {
  background: var(--accent);
  color: #fff;
}
.vote-btn:focus-visible {
  outline: 2px solid var(--focus, #5b9aff);
  outline-offset: 2px;
}
.vote-btn.voted {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  pointer-events: none;
}

/* ---- 反馈区 ---- */
.feedback-area {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  min-height: 36px;
  margin-top: 2px;
}
.feedback-text {
  font-size: var(--fs-body);
  color: var(--accent);
  font-weight: 600;
  margin: 0;
  text-align: center;
}
.reset-btn {
  font-size: var(--fs-label);
  color: var(--muted);
  background: none;
  border: none;
  border-bottom: 1px dashed var(--muted);
  cursor: pointer;
  padding: 2px 4px;
  font-family: inherit;
  transition: color 0.2s ease;
}
.reset-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
}
.reset-btn:focus-visible {
  outline: 2px solid var(--focus, #5b9aff);
  outline-offset: 2px;
}
</style>
</head>
<body data-page="48" data-total="50">
<div id="stage">
<main id="main">
  <div class="p48-wrap">

    <!-- 情境卡 -->
    <div class="scenario-card">
      <div class="scenario-header">
        <span class="scenario-label">情境</span>
        <span class="scenario-dist" id="distDisplay"></span>
      </div>
      <p class="scenario-text" id="scenarioText"></p>
    </div>

    <!-- 导语 -->
    <p class="p48-lead">「回复」和「不回复」都有站得住的理由。没有标准答案，但值得认真想。</p>

    <!-- 比较矩阵：k-comparison 骨架 -->
    <div class="k-comparison p48-cmp" id="cmpMatrix">
      <div class="hdr">权衡线</div>
      <div class="hdr" id="replyHdr">回复</div>
      <div class="hdr" id="silenceHdr">不回复</div>

      <div class="dim">科学收获</div>
      <div class="reply-cell">可能获得对方文明的知识与技术</div>
      <div class="silence-cell">对方的信号本身已经是信息，不必冒险加码</div>

      <div class="dim">暴露风险</div>
      <div class="reply-cell">回应会暴露我们的位置与存在</div>
      <div class="silence-cell">不暴露就没有新的风险</div>

      <div class="dim">沉默的意义</div>
      <div class="reply-cell">沉默会错过建立对话的机会</div>
      <div class="silence-cell">沉默本身也是一种回答——我们还没准备好</div>
    </div>

    <!-- 投票按钮 -->
    <div class="vote-row">
      <button class="vote-btn" id="voteReply" data-side="reply">回复</button>
      <button class="vote-btn" id="voteSilence" data-side="silence">不回复</button>
    </div>

    <!-- 反馈区 -->
    <div class="feedback-area" id="feedbackArea" style="display:none;">
      <p class="feedback-text" id="feedbackText"></p>
      <button class="reset-btn" id="resetBtn" aria-label="重新选择">重新选择</button>
    </div>

  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({ index: 48, kicker: "五 · 回望", title: "择边投票", take: "这不是一道技术题，而是一道文明题。" });

/* ===== 数字 ===== */
var dist = Lec.K.NEAREST_STAR_LY;          // 4.24 光年
var roundTrip = dist * 2;                  // 8.48 年

document.getElementById('distDisplay').textContent = '比邻星 · ' + dist.toFixed(2) + ' 光年';
document.getElementById('scenarioText').textContent =
  '如果有一天，我们收到来自比邻星的信号——它已经走了' + dist.toFixed(2) +
  '年。回复它，一次问答将花掉' + roundTrip.toFixed(2) + '年。要回吗？';

/* ===== 投票交互 ===== */
var cmpMatrix = document.getElementById('cmpMatrix');
var voteReply = document.getElementById('voteReply');
var voteSilence = document.getElementById('voteSilence');
var feedbackArea = document.getElementById('feedbackArea');
var feedbackText = document.getElementById('feedbackText');
var resetBtn = document.getElementById('resetBtn');
var replyHdr = document.getElementById('replyHdr');
var silenceHdr = document.getElementById('silenceHdr');

var activeVote = null;

function vote(side) {
  if (activeVote === side) return;
  activeVote = side;

  // 清除之前的状态
  cmpMatrix.classList.remove('voted-reply', 'voted-silence');
  document.querySelectorAll('.reply-cell, .silence-cell').forEach(function(el) {
    el.classList.remove('diff', 'dimmed');
  });
  replyHdr.classList.remove('col-highlight');
  silenceHdr.classList.remove('col-highlight');
  voteReply.classList.remove('voted');
  voteSilence.classList.remove('voted');

  // 强制 reflow 以便重启动画
  void cmpMatrix.offsetWidth;

  // 设置新状态
  cmpMatrix.classList.add('voted-' + side);

  var selectedCells = document.querySelectorAll('.' + side + '-cell');
  var otherSide = (side === 'reply' ? 'silence' : 'reply');
  var otherCells = document.querySelectorAll('.' + otherSide + '-cell');

  // 高亮选中栏的 header
  document.getElementById(side + 'Hdr').classList.add('col-highlight');

  // 选中按钮变为已投票状态
  document.getElementById('voteReply' + (side === 'reply' ? '' : 'Silence')).classList.add('voted');
  // 实际上更简单：
  if (side === 'reply') {
    voteReply.classList.add('voted');
  } else {
    voteSilence.classList.add('voted');
  }

  // 另一侧降饱和
  otherCells.forEach(function(el) {
    el.classList.add('dimmed');
  });

  // 选中侧逐行点亮（交错延迟）
  selectedCells.forEach(function(el, i) {
    setTimeout(function() {
      el.classList.add('diff');
    }, i * 220);
  });

  // 反馈文字
  var feedbacks = {
    reply: '你选择了对话。注意另一边的风险仍然存在。',
    silence: '你选择了沉默。注意另一边的机会仍然存在。'
  };
  feedbackText.textContent = feedbacks[side];
  feedbackArea.style.display = 'flex';
}

function resetVote() {
  activeVote = null;
  cmpMatrix.classList.remove('voted-reply', 'voted-silence');
  document.querySelectorAll('.reply-cell, .silence-cell').forEach(function(el) {
    el.classList.remove('diff', 'dimmed');
  });
  replyHdr.classList.remove('col-highlight');
  silenceHdr.classList.remove('col-highlight');
  voteReply.classList.remove('voted');
  voteSilence.classList.remove('voted');
  feedbackArea.style.display = 'none';
}

voteReply.addEventListener('click', function() { vote('reply'); });
voteSilence.addEventListener('click', function() { vote('silence'); });
resetBtn.addEventListener('click', resetVote);
</script>
</body>
</html>
