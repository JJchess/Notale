<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg:        #0b0e14;
  --text:      #e6e6e6;
  --font-sans: "Noto Sans SC", system-ui, sans-serif;
}

/* === Three flip cards ===
   override k-enumeration grid to flex so items stay fixed-size */
.k-enumeration.cards-3 {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 24px;
  height: 100%;
  padding: 0;
  margin: 0;
  list-style: none;
  position: relative;
}

.k-enumeration.cards-3 > .it {
  flex: 0 0 280px;
  height: 375px;
  padding: 0;
  margin: 0;
  border: none;
  background: transparent;
  box-shadow: none;
  cursor: pointer;
  perspective: 800px;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

.k-enumeration.cards-3 > .it:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
  border-radius: var(--radius-md);
}

/* Card container — single face with content swap */
.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
}

.card-face {
  position: absolute;
  inset: 0;
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  color: var(--text);
}

/* After flip */
.card-face.flipped {
  background: var(--accent);
  border: 2px solid var(--accent);
  color: #fff;
}

/* Front label: SHORT-CAPS style */
.card-label {
  font-size: var(--fs-h1);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

/* Back content: number + unit */
.back-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.card-number {
  font-size: 80px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.02em;
  color: #fff;
}

.card-unit {
  font-size: 24px;
  font-weight: 400;
  margin-top: 10px;
  opacity: 0.9;
  color: #fff;
}

/* Flip animation: shrink to line, expand back */
@keyframes cardFlip {
  0%   { transform: scaleX(1); }
  45%  { transform: scaleX(0.02); }
  55%  { transform: scaleX(0.02); }
  100% { transform: scaleX(1); }
}

.card-face.animating {
  animation: cardFlip 0.6s ease forwards;
}

/* Hover: unflipped cards get accent border */
.k-enumeration.cards-3 > .it:not(.flipped):hover .card-face {
  border-color: var(--accent);
  box-shadow: var(--shadow-md);
}

/* All-flipped: cards rise */
.k-enumeration.cards-3.all-flipped > .it {
  transform: translateY(-10px);
  transition: transform 0.5s ease 0.3s;
}

.k-enumeration.cards-3.all-flipped > .it .card-face.flipped {
  box-shadow: 0 0 24px rgba(11, 122, 117, 0.45);
}

/* Closing sentence: hidden until all flipped */
.closing {
  position: absolute;
  bottom: 30px;
  left: 0;
  right: 0;
  text-align: center;
  opacity: 0;
  transition: opacity 0.8s ease 0.5s;
  pointer-events: none;
}

.closing.visible {
  opacity: 1;
}

.closing-text {
  font-size: var(--fs-h2);
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.04em;
}
</style>
</head>
<body data-page="49" data-total="50">
<div id="stage">
<main id="main">
  <ul class="k-enumeration cards-3" id="card-deck">
    <li class="it" data-card="1" tabindex="0" role="button" aria-label="深时，点击翻转查看数字">
      <div class="card-inner">
        <div class="card-face">
          <span class="card-label">深时</span>
          <div class="back-content" style="display:none">
            <span class="card-number" id="num-1"></span>
            <span class="card-unit" id="unit-1"></span>
          </div>
        </div>
      </div>
    </li>
    <li class="it" data-card="2" tabindex="0" role="button" aria-label="演化，点击翻转查看数字">
      <div class="card-inner">
        <div class="card-face">
          <span class="card-label">演化</span>
          <div class="back-content" style="display:none">
            <span class="card-number" id="num-2"></span>
            <span class="card-unit" id="unit-2"></span>
          </div>
        </div>
      </div>
    </li>
    <li class="it" data-card="3" tabindex="0" role="button" aria-label="光速，点击翻转查看数字">
      <div class="card-inner">
        <div class="card-face">
          <span class="card-label">光速</span>
          <div class="back-content" style="display:none">
            <span class="card-number" id="num-3"></span>
            <span class="card-unit" id="unit-3"></span>
          </div>
        </div>
      </div>
    </li>
  </ul>
  <div class="closing" id="closing">
    <span class="closing-text" id="closing-text"></span>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 49,
  kicker: "CLOSING · THREE NUMBERS",
  title: "带走三个数",
  take: "带走三个数：45.4亿年、30万年、4.24光年。"
});

// All three numbers from Lec.K — never hardcoded
var n1 = Lec.P.round(Lec.K.EARTH_AGE_YEARS / 1e8, 1);   // 45.4
var n2 = Lec.K.HOMO_SAPIENS_YEARS / 10000;               // 30
var n3 = Lec.P.round(Lec.K.NEAREST_STAR_LY, 2);          // 4.24

document.getElementById('num-1').textContent = n1;
document.getElementById('unit-1').textContent = '亿年';
document.getElementById('num-2').textContent = n2;
document.getElementById('unit-2').textContent = '万年';
document.getElementById('num-3').textContent = n3;
document.getElementById('unit-3').textContent = '光年';

// Build closing sentence dynamically from computed numbers
document.getElementById('closing-text').textContent =
  '带走三个数：' + n1 + '亿年、' + n2 + '万年、' + n3 + '光年。';

// Flip state
var flipped = {};
var deck = document.getElementById('card-deck');
var closing = document.getElementById('closing');

[].forEach.call(document.querySelectorAll('.k-enumeration.cards-3 > .it'), function(el) {
  el.addEventListener('click', function() {
    var idx = this.dataset.card;
    if (flipped[idx]) return;

    var face = this.querySelector('.card-face');
    var label = face.querySelector('.card-label');
    var backContent = face.querySelector('.back-content');

    // Swap content immediately
    label.style.display = 'none';
    backContent.style.display = 'flex';

    // Apply flip styling and animation
    face.classList.add('flipped');
    // Trigger reflow then add animation class
    void face.offsetWidth;
    face.classList.add('animating');

    flipped[idx] = true;
    this.classList.add('flipped');

    // All three flipped → animate cards up + show closing sentence
    if (flipped['1'] && flipped['2'] && flipped['3']) {
      setTimeout(function() {
        deck.classList.add('all-flipped');
        closing.classList.add('visible');
      }, 400);
    }
  });

  el.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      this.click();
    }
  });
});
</script>
</body>
</html>
