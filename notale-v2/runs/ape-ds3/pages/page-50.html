<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ── page-50: 终章 · 双尺起点 ── */
/* Horizontal line visual: branch ── moon */
.k-generalization {
  height: 100%;
  justify-content: center;
  gap: 0;
}
.k-generalization .horizon {
  display: flex;
  align-items: center;
  width: 60%;
  margin: 0 auto;
}
.k-generalization .horizon .bar {
  flex: 1;
  height: 2px;
  background: var(--accent);
  margin: 0 var(--space-3);
  opacity: .55;
}
.k-generalization .horizon .moon {
  flex: 0 0 auto;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  opacity: .8;
}
.k-generalization .horizon-labels {
  display: flex;
  justify-content: space-between;
  width: 60%;
  margin: var(--space-2) auto 0;
  font-size: var(--fs-label);
  color: var(--muted);
  letter-spacing: .04em;
}
.k-generalization .claim {
  margin-top: var(--space-6);
}
.k-generalization .support strong {
  display: block;
  font-size: var(--fs-label);
  color: var(--accent);
  font-weight: 700;
  margin-bottom: var(--space-2);
}
.k-generalization .support p {
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
  margin: 0;
  color: var(--text);
}
</style>
</head>
<body data-page="50" data-total="50">
<div id="stage">
<main id="main">
<div class="k-generalization">

  <!-- Horizontal line: branch ── moon -->
  <div class="horizon">
    <svg viewBox="0 0 24 32" width="22" height="30" style="flex:0 0 auto;" aria-hidden="true">
      <path d="M4 28 L16 14" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M16 14 L12 8" stroke="var(--accent)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M16 14 L20 10" stroke="var(--accent)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="bar"></div>
    <div class="moon"></div>
  </div>

  <!-- Labels -->
  <div class="horizon-labels">
    <span>树上</span>
    <span>月面</span>
  </div>

  <!-- Claim -->
  <div class="claim">
    深时尺上，它只占了最后一瞬；<br>光速尺上，它才刚刚迈出第一步。
  </div>

  <!-- Trunk -->
  <div class="trunk"></div>

  <!-- Three supports -->
  <div class="supports">
    <div class="support">
      <strong>起点·树上</strong>
      <p>人科不是阶梯，是一棵几乎枯死的树</p>
    </div>
    <div class="support">
      <strong>路径·双尺</strong>
      <p>深时尺上在最后一秒，光速尺上够不到最近的星</p>
    </div>
    <div class="support">
      <strong>到达·月面</strong>
      <p>人类确实离开了地球，但也只是刚刚开始</p>
    </div>
  </div>

</div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({ index: 50, kicker: "回望 · 终章", title: "一个从树上走下来的物种，刚刚开始离开地球", take: "深时尺上，它只占了最后一瞬；光速尺上，它才刚刚迈出第一步。" });
</script>
</body>
</html>
