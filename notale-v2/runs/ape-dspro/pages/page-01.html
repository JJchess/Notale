<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* 让 main 填满页眉页脚之间的空间，内容垂直居中 */
  #main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: var(--header-h);
    padding-bottom: var(--footer-h);
    min-height: 100%;
    box-sizing: border-box;
  }

  /* 插图：约束尺寸，保持比例 */
  .p01-illustration {
    width: 100%;
    max-width: 1300px;
    max-height: 430px;
    object-fit: contain;
    display: block;
  }

  /* 时间轴行 */
  .p01-timeline {
    width: 100%;
    max-width: 720px;
  }

  .p01-timeline-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--color-dim);
    flex-shrink: 0;
  }

  .p01-timeline-line {
    flex: 1;
    height: 1px;
    background: var(--color-border);
    min-width: 0;
  }

  /* 主张文本：限制宽度，保证可读性 */
  .p01-claim {
    max-width: 900px;
  }
</style>
</head>
<body data-page="01" data-total="40">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  var take = '猿人握着石头，宇航员握着扶手，中间隔了 300 万年，但握的姿势是一样的。';

  // 页眉页脚
  Lec.mount({
    act: '第一章 · 拳头之外',
    title: '同一握法',
    sub: take
  });

  // 时间轴左端标签：从 Lec.K.SPAN 算出"X万年前"
  var span = Lec.K.SPAN || 3000000;
  var spanWan = Math.round(span / 10000);

  // 构建页面内容
  var main = document.getElementById('main');

  // 插图
  var img = document.createElement('img');
  img.src = 'assets/img/p01-grip.png';
  img.alt = '两只手的握持姿势并置对比：左侧猿人手握粗糙石块，右侧宇航员手套握金属扶手，握持角度与拇指卷曲方向几乎相同';
  img.className = 'p01-illustration';
  main.appendChild(img);

  // 时间轴容器
  var tl = document.createElement('div');
  tl.className = 'p01-timeline row items-center';
  tl.style.marginTop = 'var(--sp-lg)';
  tl.style.gap = 'var(--sp-sm)';

  var tlStart = document.createElement('span');
  tlStart.className = 'text-tick text-dim';
  tlStart.textContent = spanWan + '万年前';

  var dot1 = document.createElement('span');
  dot1.className = 'p01-timeline-dot';

  var line = document.createElement('div');
  line.className = 'p01-timeline-line';

  var dot2 = document.createElement('span');
  dot2.className = 'p01-timeline-dot';

  var tlEnd = document.createElement('span');
  tlEnd.className = 'text-tick text-dim';
  tlEnd.textContent = '现在';

  tl.appendChild(tlStart);
  tl.appendChild(dot1);
  tl.appendChild(line);
  tl.appendChild(dot2);
  tl.appendChild(tlEnd);
  main.appendChild(tl);

  // 主张文本 — 使用 k-generalization 骨架
  var gen = document.createElement('div');
  gen.className = 'k-generalization';
  gen.style.marginTop = 'var(--sp-lg)';

  var claim = document.createElement('div');
  claim.className = 'claim p01-claim';
  claim.textContent = take;

  gen.appendChild(claim);
  main.appendChild(gen);
})();
</script>
</body>
</html>
