<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* —— 页面整体两栏布局 —— */
  .p02-layout {
    display: flex;
    flex-direction: row;
    gap: var(--sp-2xl);
    width: 100%;
    height: 100%;
    padding: var(--header-h) var(--sp-xl) 0 var(--sp-xl);
    box-sizing: border-box;
  }
  .p02-left {
    flex: 1.2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }
  .p02-right {
    flex: 0.8;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }

  /* —— 导语段 —— */
  .p02-lead {
    font-size: var(--fs-lead);
    line-height: var(--lh-normal);
    color: var(--text);
    margin-bottom: var(--sp-xl);
  }

  /* —— 五层序列：基于 k-comparison 栅格 —— */
  .p02-table {
    display: grid;
    grid-template-columns: 88px 1fr 1fr;
    width: 100%;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    overflow: hidden;
  }
  .p02-table > .hdr {
    background: var(--color-surface);
    font-weight: 600;
    font-size: var(--fs-label);
    color: var(--color-dim);
    padding: var(--sp-sm) var(--sp-md);
    text-align: center;
    letter-spacing: 0.03em;
  }
  .p02-table > .dim {
    background: var(--bg);
    text-align: center;
    font-weight: 700;
    font-size: var(--fs-body);
    color: var(--color-accent);
    padding: 14px var(--sp-md);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .p02-table > .cell {
    background: var(--bg);
    padding: 14px var(--sp-md);
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .p02-table > .cell.abil {
    color: var(--color-dim);
  }
  .p02-table > .arow {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    padding: 6px 0;
    font-size: 20px;
    color: var(--color-accent);
    line-height: 1;
    user-select: none;
  }

  /* —— 右侧：章节目录 —— */
  .p02-sec-title {
    font-size: var(--fs-h2);
    font-weight: 600;
    color: var(--text);
    margin-bottom: var(--sp-lg);
    line-height: var(--lh-tight);
  }
  .p02-chapters {
    display: flex;
    flex-direction: column;
    gap: var(--sp-md);
  }
  .p02-ch {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    gap: var(--sp-sm);
    padding: var(--sp-md);
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
    background: var(--color-surface);
    border-radius: 6px;
    border-left: 3px solid;
  }
  .p02-ch.l1 { border-left-color: #d97845; }
  .p02-ch.l2 { border-left-color: #c9a23b; }
  .p02-ch.l3 { border-left-color: #5a9e6f; }
  .p02-ch.l4 { border-left-color: #4a80b4; }
  .p02-ch.l5 { border-left-color: #7b6ab0; }

  .p02-ch-num {
    font-weight: 700;
    color: var(--text);
    font-size: var(--fs-body);
    white-space: nowrap;
    min-width: 1.2em;
    text-align: center;
  }
  .p02-ch-title {
    color: var(--text);
    flex: 1;
    min-width: 0;
  }
  .p02-ch-pages {
    color: var(--color-dim);
    font-size: var(--fs-label);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body data-page="02" data-total="40">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 2,
  kicker: 'WHOLE-COURSE MAP',
  title: '五层外包：从身体到体外',
  take: '外包的序列是从外到内、从肢体到意识——先是肌肉，最后是存在本身。'
});

const main = document.getElementById('main');

main.innerHTML =
'<div class="p02-layout">'+
  '<div class="p02-left">'+
    '<p class="p02-lead">每一层外包都对应一个器官：手、声带、皮肤、大脑、全身。五层不是五个独立的故事，是同一根链条上的五个环节。</p>'+
    '<div class="p02-table">'+
      '<div class="hdr">器官</div>'+
      '<div class="hdr">外包形式</div>'+
      '<div class="hdr">获得的能力</div>'+
      '<div class="dim">手</div>'+

      '<div class="dim">声带</div>'+
      '<div class="cell">文字 → 印刷 → 电磁波</div>'+
      '<div class="cell abil">跨越时间与距离传递</div>'+
      '<div class="arow">↓</div>'+
      '<div class="dim">皮肤</div>'+
      '<div class="cell">衣服 → 房屋 → 极端环境服</div>'+
      '<div class="cell abil">进入原本不能生存的环境</div>'+
      '<div class="arow">↓</div>'+
      '<div class="dim">大脑</div>'+
      '<div class="cell">纸张 → 计算机 → 云端</div>'+
      '<div class="cell abil">记忆、计算、决策放大</div>'+
      '<div class="arow">↓</div>'+
      '<div class="dim">全身</div>'+
      '<div class="cell">空间站 → 舱外服 → 外骨骼</div>'+
      '<div class="cell abil">脱离重力，重新定义身体</div>'+
    '</div>'+
  '</div>'+
  '<div class="p02-right">'+
    '<div class="p02-sec-title">五章速览</div>'+
    '<div class="p02-chapters">'+
      '<div class="p02-ch l1"><span class="p02-ch-num">一</span><span class="p02-ch-title">拳头之外</span><span class="p02-ch-pages">p03–09</span></div>'+
      '<div class="p02-ch l2"><span class="p02-ch-num">二</span><span class="p02-ch-title">声音之外</span><span class="p02-ch-pages">p10–16</span></div>'+
      '<div class="p02-ch l3"><span class="p02-ch-num">三</span><span class="p02-ch-title">皮肤之外</span><span class="p02-ch-pages">p17–24</span></div>'+
      '<div class="p02-ch l4"><span class="p02-ch-num">四</span><span class="p02-ch-title">大脑之外</span><span class="p02-ch-pages">p25–33</span></div>'+
      '<div class="p02-ch l5"><span class="p02-ch-num">五</span><span class="p02-ch-title">重力之外</span><span class="p02-ch-pages">p34–40</span></div>'+
    '</div>'+
  '</div>'+
'</div>';
</script>
</body>
</html>
