<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== 本页布局 ===== */
#main {
  position: relative;
  height: 900px;
  padding-top: 96px;
  padding-bottom: 88px;
  display: flex;
  flex-direction: column;
  align-items: center;
  box-sizing: border-box;
  overflow: hidden;
}
.page-content {
  width: 1408px;
  height: 620px;
  display: flex;
  flex-direction: column;
  gap: var(--sp-md);
  flex-shrink: 0;
}

/* ===== 左右分栏对比区 ===== */
.split-lr {
  display: flex;
  flex-direction: row;
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
}
.split-pane {
  flex: 1 1 50%;
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: var(--sp-xs) var(--sp-md);
}
.split-pane svg {
  width: 100%;
  height: auto;
  max-height: 280px;
  min-height: 0;
}
.pane-label {
  font-size: var(--fs-label);
  color: var(--color-dim);
  margin-top: var(--sp-xs);
  text-align: center;
  letter-spacing: 0.02em;
}

/* ===== 中央分隔线 + 神经桥 ===== */
.split-divider {
  flex-shrink: 0;
  width: 2px;
  background: var(--color-border);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bridge {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  background: var(--color-accent);
  color: #fff;
  font-size: var(--fs-label);
  font-weight: 600;
  padding: 6px 16px;
  border-radius: 20px;
  white-space: nowrap;
  letter-spacing: 0.04em;
  box-shadow: 0 2px 12px rgba(37,99,235,0.3);
  z-index: 2;
  top: 44%;
}
.bridge::before,
.bridge::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 18px;
  height: 2px;
  background: var(--color-accent);
  opacity: 0.5;
}
.bridge::before {
  right: 100%;
  border-radius: 1px 0 0 1px;
}
.bridge::after {
  left: 100%;
  border-radius: 0 1px 1px 0;
}

/* ===== 控件行 ===== */
.ctl-row {
  display: flex;
  flex-direction: row;
  justify-content: center;
  gap: var(--sp-lg);
  flex-shrink: 0;
  padding: var(--sp-xs) 0;
}

/* ===== 拟物按钮 ===== */
.sk-btn {
  --sk-bg-top: #f7f4ef;
  --sk-bg-mid: #ede7dd;
  --sk-bg-bottom: #d9d0c2;
  --sk-edge-top: rgba(255,255,255,0.82);
  --sk-edge-bottom: rgba(100,78,50,0.3);
  --sk-shadow: rgba(80,55,35,0.14);
  --sk-highlight: rgba(255,255,255,0.7);

  position: relative;
  border: 1px solid transparent;
  border-radius: 14px;
  padding: 10px 28px;
  font-size: var(--fs-label);
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  background:
    linear-gradient(180deg, var(--sk-bg-top), var(--sk-bg-mid) 48%, var(--sk-bg-bottom)) padding-box,
    linear-gradient(180deg, var(--sk-edge-top), rgba(255,255,255,0.18) 45%, var(--sk-edge-bottom)) border-box;
  box-shadow:
    0 8px 18px var(--sk-shadow),
    0 2px 6px rgba(80,55,35,0.07),
    inset 0 1px 0 var(--sk-highlight);
  transition: all 180ms ease;
  color: var(--text);
  user-select: none;
  letter-spacing: 0.03em;
}
.sk-btn:hover {
  box-shadow:
    0 10px 22px var(--sk-shadow),
    0 3px 8px rgba(80,55,35,0.1),
    inset 0 1px 0 var(--sk-highlight);
  transform: translateY(-1px);
}
.sk-btn:active,
.sk-btn.is-pressed {
  transform: translateY(1px);
  background:
    linear-gradient(180deg, #d8d0c2, #e8e2d5 52%, #f7f4ef) padding-box,
    linear-gradient(180deg, rgba(100,78,50,0.35), rgba(255,255,255,0.55)) border-box;
  box-shadow:
    inset 0 4px 10px rgba(80,55,35,0.2),
    inset 0 -1px 0 rgba(255,255,255,0.65),
    0 2px 6px rgba(80,55,35,0.06);
}
.sk-btn:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}

/* ===== 比较表微调 ===== */
.k-comparison {
  flex-shrink: 0;
  max-width: 1100px;
  align-self: center;
}
.k-comparison .cell {
  font-size: var(--fs-sec);
  line-height: var(--lh-tight);
  padding: var(--sp-xs) var(--sp-md);
}
.k-comparison .hdr {
  font-size: var(--fs-label);
  padding: var(--sp-xs) var(--sp-md);
}
.k-comparison .dim {
  font-size: var(--fs-label);
  padding: var(--sp-xs) var(--sp-md);
}
.k-comparison .same {
  background-color: var(--color-accent-light);
  font-weight: 600;
  color: var(--color-accent);
}

/* ===== SVG 插图内样式 ===== */
.illust-skin {
  fill: none;
  stroke: var(--color-border);
  stroke-width: 1.5;
}
.illust-bone {
  fill: #f8f4ec;
  stroke: #d4cbbf;
  stroke-width: 1;
}
.illust-muscle {
  fill: #d4956a;
  opacity: 0.55;
}
.illust-muscle-superficial {
  fill: #c4805a;
  opacity: 0.45;
}
.illust-tendon {
  stroke: #e8d8c8;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
}
.illust-stone {
  fill: #6b6b6b;
  stroke: #4a4a4a;
  stroke-width: 1.5;
}
.illust-handle {
  fill: #8899aa;
  stroke: #5a6b7c;
  stroke-width: 1.5;
}
.illust-arrow {
  stroke: var(--color-accent);
  stroke-width: 2;
  fill: none;
  marker-end: url(#arrowhead);
}
.illust-force-label {
  font-size: 12px;
  fill: var(--color-accent);
  font-family: var(--font-sans);
}
.muscle-hl {
  opacity: 0;
  transition: opacity 300ms ease;
}
.muscle-hl.show {
  opacity: 0.42;
}
.nerve-signal {
  opacity: 0;
  transition: opacity 300ms ease;
}
.nerve-signal.show {
  opacity: 1;
}
.nerve-line {
  stroke: var(--color-accent);
  stroke-width: 2.5;
  stroke-dasharray: 8 5;
  fill: none;
}
.nerve-dot {
  fill: var(--color-accent);
}
</style>
</head>

<script>
(function() {
  'use strict';

  /* ===== 页眉页脚 ===== */
  Lec.mount({
    index: 3,
    kicker: '第一章 · 拳头之外',
    title: '拳头的解剖学',
    take: '握石头的力和握手柄的力，作用的位置不同，但肌肉收缩的指令是一样的。三百万年前，指深屈肌收缩；今天，同一块肌肉用同样的电信号收缩。工具变了，神经指令没变。区别不在手上，在手上裹的东西——一个是茧子，一个是 4.3 psi 的气压。'
  });

  /* ===== 插图标签 ===== */
  var firstTool = (Lec.K && Lec.K.FIRST_TOOL) ? Lec.K.FIRST_TOOL : 3300000;
  var ma = (firstTool / 1000000).toFixed(1);
  document.getElementById('label-left').textContent =
    'Lomekwi 3, ' + ma + ' Ma';
  document.getElementById('label-right').textContent =
    'ISS EMU Glove, ' + new Date().getFullYear();

  /* ===== 交互：肌肉高亮 ===== */
  var btnMuscle = document.getElementById('btn-muscle');
  var btnNerve = document.getElementById('btn-nerve');

  btnMuscle.addEventListener('click', function() {
    var pressed = this.getAttribute('aria-pressed') === 'true';
    this.setAttribute('aria-pressed', String(!pressed));
    if (!pressed) {
      this.classList.add('is-pressed');
    } else {
      this.classList.remove('is-pressed');
    }
    var allHL = document.querySelectorAll('.muscle-hl');
    for (var i = 0; i < allHL.length; i++) {
      if (!pressed) {
        allHL[i].classList.add('show');
      } else {
        allHL[i].classList.remove('show');
      }
    }
  });

  /* ===== 交互：神经指令 ===== */
  btnNerve.addEventListener('click', function() {
    var pressed = this.getAttribute('aria-pressed') === 'true';
    this.setAttribute('aria-pressed', String(!pressed));
    if (!pressed) {
      this.classList.add('is-pressed');
    } else {
      this.classList.remove('is-pressed');
    }
    var allNS = document.querySelectorAll('.nerve-signal');
    for (var i = 0; i < allNS.length; i++) {
      if (!pressed) {
        allNS[i].classList.add('show');
      } else {
        allNS[i].classList.remove('show');
      }
    }
  });

  /* ===== 键盘：Enter/Space 触发按钮 ===== */
  [btnMuscle, btnNerve].forEach(function(btn) {
    btn.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        this.click();
      }
    });
  });

})();
</script>
