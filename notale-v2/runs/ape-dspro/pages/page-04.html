<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* === Page 04: 石器演化时间轴 === */

  #main {
    display: flex;
    flex-direction: column;
    padding: 104px var(--sp-xl) 96px;
    height: 100%;
    gap: var(--sp-md);
  }

  /* --- take 区 --- */
  .take-section {
    flex-shrink: 0;
  }
  .take-section .lead {
    font-size: var(--fs-lead);
    line-height: var(--lh-normal);
    font-weight: 500;
    color: var(--text);
  }
  .take-section .sub {
    font-size: var(--fs-body);
    line-height: var(--lh-normal);
    color: var(--color-dim);
    margin-top: var(--sp-xs);
  }

  /* --- stage cards 区 --- */
  .stage-area {
    flex-shrink: 0;
    height: 430px;
    display: flex;
    align-items: stretch;
    position: relative;
    background: var(--color-surface);
    border-radius: 12px;
    border: 1px solid var(--color-border-light);
    padding: var(--sp-2xl) var(--sp-lg) var(--sp-xl);
  }

  /* 贯穿的轴线 */
  .stage-area::before {
    content: "";
    position: absolute;
    left: var(--sp-lg);
    right: var(--sp-lg);
    bottom: 80px;
    height: 2px;
    background: var(--color-border);
    z-index: 0;
  }

  .stage-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    width: 100%;
    height: 100%;
    gap: 0;
    position: relative;
    z-index: 1;
  }

  .stage-card {
    width: 180px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: var(--sp-xl) var(--sp-sm) var(--sp-xl);
    border: 2px solid var(--color-border);
    border-radius: 10px;
    background: var(--bg);
    cursor: pointer;
    position: relative;
    z-index: 1;
    transition: border-color 0.35s, background 0.35s, box-shadow 0.35s;
  }
  .stage-card:hover {
    border-color: var(--color-accent);
  }
  .stage-card.active {
    border-color: var(--color-accent);
    background: var(--color-accent-light);
    box-shadow: 0 0 24px rgba(37,99,235,0.22);
  }
  .stage-card.dimmed {
    opacity: 0.4;
    border-color: var(--color-border-light);
  }

  /* 卡片到轴线的连接线 */
  .stage-card::after {
    content: "";
    position: absolute;
    bottom: -42px;
    left: 50%;
    width: 1px;
    height: 42px;
    background: var(--color-border);
    transform: translateX(-50%);
  }
  .stage-card.active::after {
    background: var(--color-accent);
    width: 2px;
  }

  .stage-card .silhouette {
    width: 120px;
    height: 120px;
    margin-bottom: var(--sp-md);
    color: var(--color-dim);
    transition: color 0.35s, transform 0.35s;
  }
  .stage-card.active .silhouette {
    color: var(--color-accent);
    transform: scale(1.06);
  }
  .stage-card .silhouette svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .stage-card .silhouette svg path,
  .stage-card .silhouette svg polygon {
    fill: none;
    stroke: currentColor;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .stage-card .name {
    font-size: var(--fs-sec);
    font-weight: 600;
    color: var(--text);
    text-align: center;
    line-height: var(--lh-tight);
  }
  .stage-card .date {
    font-size: var(--fs-tick);
    color: var(--color-dim);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .stage-card .feature {
    font-size: var(--fs-label);
    color: var(--color-dim);
    margin-top: 8px;
    background: var(--color-surface);
    padding: 4px 12px;
    border-radius: 4px;
  }

  /* --- arrow gaps --- */
  .stage-gap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    flex-shrink: 0;
    min-width: 52px;
    padding-bottom: 80px;
    position: relative;
    z-index: 0;
  }
  .stage-gap .gap-line-wrap {
    width: 100%;
    height: 2px;
    background: var(--color-border);
    position: relative;
  }
  .stage-gap .gap-line-wrap::after {
    content: "→";
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--color-dim);
    font-size: 20px;
    line-height: 1;
  }

  /* --- timeline bar --- */
  .timeline-section {
    flex-shrink: 0;
    padding: var(--sp-md) 0 var(--sp-sm);
    position: relative;
  }

  .timeline-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: var(--sp-sm);
  }
  .timeline-header .tl-prompt {
    font-size: var(--fs-label);
    color: var(--color-dim);
  }
  .timeline-header .tl-stage-name {
    font-size: var(--fs-sec);
    font-weight: 600;
    color: var(--color-accent);
    text-align: right;
  }

  .timeline-track {
    position: relative;
    height: 8px;
    background: var(--color-border-light);
    border-radius: 4px;
    width: 100%;
    cursor: pointer;
    touch-action: none;
  }
  .timeline-track .track-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: var(--color-accent);
    border-radius: 4px;
    opacity: 0.22;
    pointer-events: none;
  }

  .timeline-cursor {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-bottom: 20px solid var(--color-accent);
    cursor: grab;
    z-index: 2;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
  }
  .timeline-cursor:active {
    cursor: grabbing;
  }
  .timeline-cursor.dragging {
    filter: drop-shadow(0 2px 12px rgba(37,99,235,0.55));
  }
  .timeline-cursor::after {
    content: "";
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 16px;
    background: var(--color-accent);
    border-radius: 0 0 1px 1px;
  }

  .timeline-ticks {
    display: flex;
    justify-content: space-between;
    margin-top: var(--sp-sm);
    padding: 0 84px;
  }
  .timeline-ticks .tick {
    font-size: var(--fs-tick);
    color: var(--color-dim);
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  /* --- data panel: 放在 stage 内部, 不浮出 --- */
  .data-panel {
    position: absolute;
    background: var(--bg);
    border: 1px solid var(--color-border);
    border-radius: 10px;
    padding: var(--sp-md) var(--sp-lg);
    box-shadow: 0 6px 28px rgba(0,0,0,0.13);
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: var(--sp-xs);
    min-width: 200px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s, transform 0.3s;
  }
  .data-panel.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .data-panel .dp-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: var(--sp-lg);
  }
  .data-panel .dp-label {
    font-size: var(--fs-label);
    color: var(--color-dim);
  }
  .data-panel .dp-value {
    font-size: var(--fs-sec);
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .data-panel .dp-burden {
    font-size: var(--fs-sec);
    font-weight: 500;
    color: var(--color-accent);
    margin-top: var(--sp-xs);
    padding-top: var(--sp-xs);
    border-top: 1px solid var(--color-border-light);
    text-align: center;
  }
  .data-panel .dp-title {
    font-size: var(--fs-sec);
    font-weight: 600;
    color: var(--text);
    text-align: center;
    margin-bottom: 2px;
  }
</style>
</head>
<body data-page="04" data-total="40">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/lec.js"></script>
<script>
(function () {
  var main = document.getElementById("main");

  /* ===== 1. Lec.mount ===== */
  Lec.mount({
    index: 4,
    kicker: "STONE LINEAGE",
    title: "从拳头到刀刃",
    take: "石器变薄、变轻、变锋利——每变一步,手需要出的力就少一点。"
  });

  var TAKE_LINES = [
    "石器变薄、变轻、变锋利——每变一步,手需要出的力就少一点。",
    "但不是越快越好:从砍砸器到细石叶花了 300 万年,每一步都是精度的门槛,不是速度的门槛。"
  ];

  /* ===== 2. 数据 ===== */
  var STAGE_NAMES = [
    "洛迈奎砍砸器", "奥杜威砍砸器", "阿舍利手斧",
    "莫斯特尖状器", "细石叶", "抛光石斧"
  ];
  var STAGE_FEATURES = [
    "击中即用", "单面剥片", "双面修整",
    "预制成型", "复合镶嵌", "通体磨光"
  ];
  var STAGE_BURDEN = [
    "需要全力握紧", "需要较大握力", "需要稳定握持",
    "需要精细控制", "只需指尖捏住", "需要双手配合"
  ];

  var STAGE_AGES = [330, 260, 176, 30, 4, 0.5];
  var STAGE_SIZES = [15, 12, 20, 8, 3, 10];
  var STAGE_THICK = [8, 5, 3.5, 1.5, 0.4, 2];

  var STAGE_SHARP = STAGE_THICK.map(function (t) {
    return Math.round(10 - t * 0.8);
  });

  var TOTAL_SPAN = STAGE_AGES[0] - STAGE_AGES[5];
  var STAGE_POS = STAGE_AGES.map(function (a) {
    return (STAGE_AGES[0] - a) / TOTAL_SPAN;
  });

  var STAGE_GAPS = [];
  for (var i = 0; i < STAGE_AGES.length - 1; i++) {
    STAGE_GAPS.push(STAGE_AGES[i] - STAGE_AGES[i + 1]);
  }

  /* ===== 3. SVG 轮廓 ===== */
  function silhouetteSVG(idx) {
    var paths = [
      '<path d="M24,54 Q18,34 32,22 Q48,16 58,30 Q66,44 56,56 Q48,68 34,66 Q24,62 24,54Z"/>',
      '<path d="M18,48 Q16,28 30,18 Q48,12 60,24 Q66,38 58,52 Q52,64 36,64 Q24,58 18,48Z"/>',
      '<path d="M40,6 Q24,8 16,28 Q10,50 20,64 Q28,76 40,76 Q52,76 60,64 Q70,50 64,28 Q56,8 40,6Z"/>',
      '<path d="M40,4 L12,50 Q16,68 34,70 Q46,70 40,58 L68,50 Z"/>',
      '<path d="M34,2 L26,74 L34,72 L38,2Z"/>',
      '<path d="M12,32 Q8,16 22,12 Q38,4 52,16 Q68,28 62,42 Q58,60 44,62 Q30,66 18,52Z"/>'
    ];
    return '<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">' + paths[idx] + '</svg>';
  }

  /* ===== 4. 构建 DOM ===== */
  var html = '<section class="take-section">';
  html += '<p class="lead">' + TAKE_LINES[0] + '</p>';
  if (TAKE_LINES[1]) html += '<p class="sub">' + TAKE_LINES[1] + '</p>';
  html += '</section>';

  html += '<section class="stage-area" id="stage-area"><div class="stage-row">';

  for (var i = 0; i < 6; i++) {
    html +=
      '<div class="stage-card" data-stage="' + i + '" tabindex="0" role="button" aria-label="' +
      STAGE_NAMES[i] + " " + STAGE_AGES[i] + "万年" + '">';
    html += '<div class="silhouette">' + silhouetteSVG(i) + '</div>';
    html += '<span class="name">' + STAGE_NAMES[i] + '</span>';
    html += '<span class="date">' + STAGE_AGES[i] + ' 万年</span>';
    html += '<span class="feature">' + STAGE_FEATURES[i] + '</span>';
    html += '</div>';

    if (i < 5) {
      html +=
        '<div class="stage-gap" style="flex-grow:' + STAGE_GAPS[i] + ';min-width:52px">' +
        '<div class="gap-line-wrap"></div>' +
        '</div>';
    }
  }

  html += '</div>';

  /* 数据面板放在 stage-area 内部 */
  html +=
    '<div class="data-panel" id="data-panel">' +
    '<span class="dp-title"></span>' +
    '<div class="dp-row"><span class="dp-label">最长尺寸</span><span class="dp-value" id="dp-size">—</span></div>' +
    '<div class="dp-row"><span class="dp-label">厚度</span><span class="dp-value" id="dp-thick">—</span></div>' +
    '<div class="dp-row"><span class="dp-label">锋利度</span><span class="dp-value" id="dp-sharp">—</span></div>' +
    '<span class="dp-burden" id="dp-burden"></span>' +
    '</div>';

  html += '</section>';

  html += '<section class="timeline-section">';
  html += '<div class="timeline-header">';
  html += '<span class="tl-prompt">拖拽游标，查看各阶段数据</span>';
  html += '<span class="tl-stage-name" id="tl-name">' + STAGE_NAMES[0] + '</span>';
  html += '</div>';
  html += '<div class="timeline-track no-pan" id="tl-track" tabindex="0" role="slider" aria-label="时间轴" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">';
  html += '<div class="track-fill" id="tl-fill"></div>';
  html += '<div class="timeline-cursor" id="tl-cursor" style="left:0%"></div>';
  html += '</div>';
  html += '<div class="timeline-ticks">';
  for (var j = 0; j < 6; j++) {
    html += '<span class="tick">' + STAGE_AGES[j] + '万</span>';
  }
  html += '</div>';
  html += '</section>';

  main.innerHTML = html;

  /* ===== 5. 元素引用 ===== */
  var stageArea = document.getElementById("stage-area");
  var cards = main.querySelectorAll(".stage-card");
  var cursor = document.getElementById("tl-cursor");
  var track = document.getElementById("tl-track");
  var fill = document.getElementById("tl-fill");
  var tlName = document.getElementById("tl-name");
  var panel = document.getElementById("data-panel");
  var dpTitle = panel.querySelector(".dp-title");
  var dpSize = document.getElementById("dp-size");
  var dpThick = document.getElementById("dp-thick");
  var dpSharp = document.getElementById("dp-sharp");
  var dpBurden = document.getElementById("dp-burden");

  var currentStage = 0;
  var isDragging = false;

  /* ===== 6. 辅助函数 ===== */
  function getTrackRect() {
    return track.getBoundingClientRect();
  }

  function clientToPercent(clientX) {
    var r = getTrackRect();
    return Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  }

  function pctToStage(pct) {
    var best = 0, bestDist = Infinity;
    for (var i = 0; i < 6; i++) {
      var d = Math.abs(pct - STAGE_POS[i]);
      if (d < bestDist) { bestDist = d; best = i; }
    }
    return best;
  }

  function setCursor(pct, animate) {
    if (animate) {
      gsap.to(cursor, { left: (pct * 100) + "%", duration: 0.25, ease: "power2.out" });
      gsap.to(fill, { width: (pct * 100) + "%", duration: 0.25, ease: "power2.out" });
    } else {
      cursor.style.left = (pct * 100) + "%";
      fill.style.width = (pct * 100) + "%";
    }
  }

  function positionPanel(idx) {
    var card = cards[idx];
    var cardRect = card.getBoundingClientRect();
    var areaRect = stageArea.getBoundingClientRect();
    var stageEl = document.getElementById("stage");
    var stageRect = stageEl.getBoundingClientRect();
    var s = parseFloat(getComputedStyle(stageEl).getPropertyValue("--s")) || 1;

    var panelW = 200, panelH = 150;
    /* 放在卡片上方，相对于 stage-area */
    var cx = (cardRect.left - areaRect.left) / s + cardRect.width / 2;
    var top = (cardRect.top - areaRect.top) / s - panelH - 12;

    /* 如果上方空间不够，放下方 */
    if (top < 0) {
      top = (cardRect.bottom - areaRect.top) / s + 12;
    }

    var left = cx - panelW / 2;
    if (left < 0) left = 4;
    var areaW = areaRect.width / s;
    if (left + panelW > areaW) left = areaW - panelW - 4;

    panel.style.left = left + "px";
    panel.style.top = top + "px";
  }

  function highlightStage(idx) {
    if (currentStage === idx && panel.classList.contains("visible")) return;
    currentStage = idx;

    cards.forEach(function (c, i) {
      if (i === idx) {
        c.classList.add("active");
        c.classList.remove("dimmed");
      } else {
        c.classList.remove("active");
        c.classList.add("dimmed");
      }
    });

    dpTitle.textContent = STAGE_NAMES[idx];
    dpSize.textContent = STAGE_SIZES[idx] + " cm";
    dpThick.textContent = STAGE_THICK[idx] + " cm";
    dpSharp.textContent = STAGE_SHARP[idx] + " / 10";
    dpBurden.textContent = STAGE_BURDEN[idx];
    tlName.textContent = STAGE_NAMES[idx];

    positionPanel(idx);
    panel.classList.add("visible");
    setCursor(STAGE_POS[idx], true);
    track.setAttribute("aria-valuenow", Math.round(STAGE_POS[idx] * 100));
  }

  /* ===== 7. 拖拽交互 ===== */
  function onPointerDown(e) {
    e.preventDefault();
    isDragging = true;
    cursor.classList.add("dragging");
    track.setPointerCapture(e.pointerId);
    var pct = clientToPercent(e.clientX);
    setCursor(pct, false);
    highlightStage(pctToStage(pct));
  }

  function onPointerMove(e) {
    if (!isDragging) return;
    var pct = clientToPercent(e.clientX);
    setCursor(pct, false);
    var stg = pctToStage(pct);
    if (stg !== currentStage) highlightStage(stg);
  }

  function onPointerUp(e) {
    if (!isDragging) return;
    isDragging = false;
    cursor.classList.remove("dragging");
    if (e.pointerId !== undefined) track.releasePointerCapture(e.pointerId);
    setCursor(STAGE_POS[currentStage], true);
  }

  track.addEventListener("pointerdown", onPointerDown);
  track.addEventListener("pointermove", onPointerMove);
  track.addEventListener("pointerup", onPointerUp);
  track.addEventListener("pointercancel", onPointerUp);

  track.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      e.preventDefault();
      var dir = e.key === "ArrowRight" ? 1 : -1;
      highlightStage(Math.max(0, Math.min(5, currentStage + dir)));
    }
  });

  cards.forEach(function (card, i) {
    card.addEventListener("click", function () { highlightStage(i); });
  });

  /* ===== 8. 初始动画 ===== */
  var mm = gsap.matchMedia();

  mm.add({
    reduceMotion: "(prefers-reduced-motion: reduce)"
  }, function (ctx) {
    var reduce = ctx.conditions.reduceMotion;

    if (reduce) {
      gsap.set(cards, { opacity: 1, y: 0 });
      var gaps = main.querySelectorAll(".stage-gap");
      gsap.set(gaps, { opacity: 1 });
      gsap.set(".timeline-section", { opacity: 1, y: 0 });
      highlightStage(0);
    } else {
      gsap.from(cards, {
        opacity: 0,
        y: 24,
        duration: 0.55,
        stagger: 0.08,
        ease: "power2.out"
      });

      var gaps = main.querySelectorAll(".stage-gap");
      gsap.from(gaps, {
        opacity: 0,
        duration: 0.4,
        stagger: 0.06,
        delay: 0.22,
        ease: "power2.out"
      });

      gsap.from(".timeline-section", {
        opacity: 0,
        y: 14,
        duration: 0.5,
        delay: 0.45,
        ease: "power2.out",
        onComplete: function () {
          highlightStage(0);
        }
      });
    }
  });

})();
</script>
</body>
</html>
