<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* Page-specific styles — all derive from theme tokens */
  #main {
    padding-top: var(--header-h);
    padding-bottom: var(--footer-h);
    height: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .p06-content {
    width: 1408px;
    height: 620px;
    display: flex;
    flex-direction: row;
    gap: 32px;
    align-items: stretch;
  }

  .p06-tree-panel {
    flex: 0 0 820px;
    display: flex;
    flex-direction: column;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    overflow: hidden;
  }

  .p06-tree-svg {
    flex: 1;
    width: 100%;
    cursor: pointer;
  }

  .p06-tree-legend {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: var(--sp-lg);
    padding: 8px 16px;
    border-top: 1px solid var(--color-border-light);
    font-size: var(--fs-label);
    color: var(--color-dim);
  }

  .p06-legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .p06-card-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: var(--sp-md);
  }

  .p06-detail-card {
    flex: 1;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: var(--sp-md);
    overflow-y: auto;
  }

  .p06-card-header {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .p06-card-name {
    font-size: var(--fs-h2);
    font-weight: 600;
    line-height: var(--lh-tight);
    color: var(--text);
  }

  .p06-card-sci {
    font-size: var(--fs-sec);
    color: var(--color-dim);
    font-style: italic;
  }

  .p06-card-status {
    font-size: var(--fs-label);
    padding: 3px 10px;
    border-radius: 4px;
    display: inline-block;
    width: fit-content;
    font-weight: 500;
  }

  .p06-status-true {
    background: #fef3c7;
    color: #92400e;
  }

  .p06-status-false {
    background: #f3f4f6;
    color: #6b7280;
  }

  .p06-behaviors {
    display: flex;
    flex-direction: column;
    gap: var(--sp-xs);
  }

  .p06-behaviors-title {
    font-size: var(--fs-label);
    color: var(--color-dim);
    font-weight: 500;
  }

  .p06-behavior-item {
    font-size: var(--fs-body);
    color: var(--text);
    line-height: var(--lh-normal);
    padding-left: 16px;
    position: relative;
  }

  .p06-behavior-item::before {
    content: '•';
    position: absolute;
    left: 0;
    color: var(--color-accent);
    font-weight: bold;
  }

  .p06-level-indicator {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .p06-level-title {
    font-size: var(--fs-label);
    color: var(--color-dim);
    font-weight: 500;
  }

  .p06-level-bars {
    display: flex;
    flex-direction: row;
    gap: 4px;
    align-items: center;
  }

  .p06-level-bar {
    width: 48px;
    height: 8px;
    border-radius: 2px;
    background: var(--color-border-light);
    transition: background 0.3s ease;
  }

  .p06-level-bar.filled {
    background: var(--color-warning);
  }

  .p06-level-bar.filled-system {
    background: var(--color-success);
  }

  .p06-level-labels {
    display: flex;
    flex-direction: row;
    gap: 4px;
    font-size: var(--fs-tick);
    color: var(--color-dim);
  }

  .p06-level-labels span {
    width: 48px;
    text-align: center;
  }

  .p06-level-labels span.active {
    color: var(--text);
    font-weight: 600;
  }

  .p06-divergence {
    font-size: var(--fs-sec);
    color: var(--color-dim);
    line-height: var(--lh-normal);
  }

  .p06-divergence strong {
    color: var(--color-accent);
    font-weight: 600;
  }

  .p06-human-note {
    font-size: var(--fs-sec);
    color: var(--color-success);
    line-height: var(--lh-normal);
    padding: 8px 12px;
    background: #f0fdf4;
    border-left: 3px solid var(--color-success);
    border-radius: 0 4px 4px 0;
  }

  .p06-card-prompt {
    font-size: var(--fs-sec);
    color: var(--color-dim);
    text-align: center;
    padding: 40px 20px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .p06-note {
    font-size: var(--fs-sec);
    color: var(--color-dim);
    line-height: var(--lh-normal);
    border-left: 2px solid var(--color-border-light);
    padding-left: var(--sp-sm);
  }

  /* Tree SVG styles */
  .p06-tree-svg .link {
    fill: none;
    stroke: #d1d5db;
    stroke-width: 1.5;
    stroke-linecap: round;
  }

  .p06-tree-svg .link.highlight {
    stroke: #f59e0b;
    stroke-width: 3;
    filter: drop-shadow(0 0 3px rgba(245, 158, 11, 0.4));
  }

  .p06-tree-svg .node-circle {
    stroke: #fff;
    stroke-width: 2;
    cursor: pointer;
    transition: r 0.2s ease;
  }

  .p06-tree-svg .node-circle:hover {
    stroke-width: 3;
  }

  .p06-tree-svg .node-circle.selected {
    stroke: #1e1e1e;
    stroke-width: 3;
  }

  .p06-tree-svg .node-label {
    font-size: var(--fs-tick);
    fill: var(--text);
    font-family: var(--font-sans);
    pointer-events: none;
    user-select: none;
  }

  .p06-tree-svg .node-label.human-label {
    font-weight: 700;
    fill: var(--color-accent);
    font-size: 14px;
  }

  .p06-tree-svg .divergence-label {
    font-size: 11px;
    fill: #f59e0b;
    font-family: var(--font-sans);
    font-weight: 600;
    pointer-events: none;
    user-select: none;
    opacity: 0;
  }

  .p06-tree-svg .internal-label {
    font-size: 11px;
    fill: var(--color-dim);
    font-family: var(--font-sans);
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body data-page="06" data-total="40">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/anime.min.js"></script>
<script>
(function() {
  /* ================================================================
     Page 06: 工具使用的谱系 — Phylogenetic tree of tool use
     Knowledge structure: enumeration (split-lr)
     ================================================================ */

  // --- 1. Mount page header ---
  Lec.mount({
    index: 6,
    kicker: '第一章',
    title: '工具使用的谱系',
    take: '用工具不是人类的专利，但把工具做成系统，只有人类。'
  });

  // --- 2. Build DOM structure ---
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="p06-content">
      <div class="p06-tree-panel">
        <svg class="p06-tree-svg" id="tree-svg"></svg>
        <div class="p06-tree-legend">
          <span class="p06-legend-dot" style="background:#2563eb;"></span><span>人类</span>
          <span class="p06-legend-dot" style="background:#d97706;"></span><span>使用工具</span>
          <span class="p06-legend-dot" style="background:#9ca3af;"></span><span>不使用工具</span>
        </div>
      </div>
      <div class="p06-card-panel" id="card-panel">
        <div class="p06-detail-card" id="detail-card">
          <div class="p06-card-prompt">点击左侧谱系树上的物种查看详情</div>
        </div>
        <div class="p06-note">树上每一个亮起来的点都在说同一件事：手能抓东西、脑子能算因果，工具就会冒出来。但「系统」——把工具做得只差一个工具就能做下一个工具——只出现了一次。</div>
      </div>
    </div>
  `;

  // --- 3. Get data ---
  const speciesData = Lec.P.getToolUseSpecies();
  const treeTopology = Lec.P.getTreeTopology();

  // Build species lookup by id
  const speciesMap = {};
  speciesData.forEach(function(s) { speciesMap[s.id] = s; });

  // Find human node id
  let humanId = null;
  speciesData.forEach(function(s) {
    if (s.isHuman) humanId = s.id;
  });

  // --- 4. Set up SVG ---
  const svgEl = document.getElementById('tree-svg');
  const svg = d3.select('#tree-svg');
  const svgRect = svgEl.getBoundingClientRect();
  const W = 820;
  const H = 540;
  svg.attr('viewBox', '0 0 ' + W + ' ' + H);

  const margin = { top: 30, right: 100, bottom: 30, left: 20 };
  const innerW = W - margin.left - margin.right;
  const innerH = H - margin.top - margin.bottom;

  const g = svg.append('g')
    .attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');

  // --- 5. Build D3 hierarchy and tree layout ---
  const root = d3.hierarchy(treeTopology);
  const treeLayout = d3.tree().size([innerH, innerW]);
  treeLayout(root);

  // --- 6. Helper functions ---
  function getSpeciesForNode(d) {
    return d.data.id ? speciesMap[d.data.id] : null;
  }

  function getNodeColor(d) {
    const sp = getSpeciesForNode(d);
    if (!sp) return '#9ca3af';
    if (sp.isHuman) return '#2563eb';
    if (sp.usesTools) return '#d97706';
    return '#9ca3af';
  }

  function getNodeRadius(d) {
    const sp = getSpeciesForNode(d);
    if (sp && sp.isHuman) return 8;
    if (sp && sp.usesTools) return 6;
    if (d.children && d.children.length > 0) return 4;
    return 5;
  }

  function linkPath(d) {
    var sx = d.source.y, sy = d.source.x;
    var tx = d.target.y, ty = d.target.x;
    var mx = (sx + tx) / 2;
    return 'M' + sx + ',' + sy + ' C' + mx + ',' + sy + ' ' + mx + ',' + ty + ' ' + tx + ',' + ty;
  }

  // --- 7. Draw links ---
  const linkGroup = g.append('g').attr('class', 'links');
  const links = linkGroup.selectAll('path')
    .data(root.links())
    .join('path')
    .attr('class', 'link')
    .attr('d', linkPath)
    .style('opacity', 0);

  // --- 8. Draw nodes ---
  const nodeGroup = g.append('g').attr('class', 'nodes');
  const nodes = nodeGroup.selectAll('g')
    .data(root.descendants())
    .join('g')
    .attr('class', 'node-group')
    .style('opacity', 0);

  nodes.append('circle')
    .attr('class', 'node-circle')
    .attr('cx', function(d) { return d.y; })
    .attr('cy', function(d) { return d.x; })
    .attr('r', function(d) { return getNodeRadius(d); })
    .attr('fill', function(d) { return getNodeColor(d); });

  nodes.append('text')
    .attr('class', function(d) {
      var sp = getSpeciesForNode(d);
      if (sp && sp.isHuman) return 'node-label human-label';
      if (sp) return 'node-label';
      return 'internal-label';
    })
    .attr('x', function(d) { return d.y + getNodeRadius(d) + 6; })
    .attr('y', function(d) { return d.x + 4; })
    .text(function(d) {
      var sp = getSpeciesForNode(d);
      if (sp) return sp.commonName;
      if (d.data.name) return d.data.name;
      return '';
    });

  // --- 9. Find nodes in the hierarchy ---
  function findNodeById(id) {
    var result = null;
    root.each(function(d) {
      if (d.data.id === id) result = d;
    });
    return result;
  }

  function findHumanNode() {
    return findNodeById(humanId);
  }

  const humanNode = findHumanNode();

  // --- 10. Path finding ---
  function getAncestorPath(node) {
    var path = [];
    var cur = node;
    while (cur) {
      path.push(cur);
      cur = cur.parent;
    }
    return path;
  }

  function findPathBetween(nodeA, nodeB) {
    var pathA = getAncestorPath(nodeA);
    var pathB = getAncestorPath(nodeB);
    var commonAncestor = null;
    for (var i = 0; i < pathA.length; i++) {
      for (var j = 0; j < pathB.length; j++) {
        if (pathA[i] === pathB[j]) {
          commonAncestor = pathA[i];
          break;
        }
      }
      if (commonAncestor) break;
    }
    if (!commonAncestor) return [];

    // Build full path: nodeA → commonAncestor → nodeB
    var fullPath = [];
    for (var k = 0; k < pathA.length; k++) {
      fullPath.push(pathA[k]);
      if (pathA[k] === commonAncestor) break;
    }
    var foundCA = false;
    for (var m = pathB.length - 1; m >= 0; m--) {
      if (pathB[m] === commonAncestor) { foundCA = true; continue; }
      if (foundCA) fullPath.push(pathB[m]);
    }
    return fullPath;
  }

  function getLinksOnPath(pathNodes) {
    var linkSet = [];
    for (var i = 0; i < pathNodes.length - 1; i++) {
      var a = pathNodes[i], b = pathNodes[i+1];
      root.links().forEach(function(l) {
        if ((l.source === a && l.target === b) || (l.source === b && l.target === a)) {
          linkSet.push(l);
        }
      });
    }
    return linkSet;
  }

  // --- 11. Highlight path ---
  var highlightedLinks = [];

  function clearHighlight() {
    highlightedLinks = [];
    linkGroup.selectAll('path')
      .classed('highlight', false)
      .attr('stroke', '#d1d5db')
      .attr('stroke-width', 1.5);
    g.selectAll('.divergence-label').style('opacity', 0);
    nodeGroup.selectAll('.node-circle').classed('selected', false);
  }

  function highlightPathBetween(nodeA, nodeB) {
    clearHighlight();
    var pathNodes = findPathBetween(nodeA, nodeB);
    highlightedLinks = getLinksOnPath(pathNodes);

    linkGroup.selectAll('path')
      .classed('highlight', function(d) {
        return highlightedLinks.indexOf(d) !== -1;
      })
      .transition().duration(500)
      .attr('stroke', function(d) {
        return highlightedLinks.indexOf(d) !== -1 ? '#f59e0b' : '#d1d5db';
      })
      .attr('stroke-width', function(d) {
        return highlightedLinks.indexOf(d) !== -1 ? 3 : 1.5;
      });

    // Mark selected node
    nodeGroup.selectAll('.node-circle')
      .classed('selected', function(d) { return d === nodeA; });

    // Show divergence time near human node
    if (humanNode && nodeA !== humanNode) {
      var time = Lec.P.getDivergenceTime(nodeA.data.id);
      g.selectAll('.divergence-label').remove();
      g.append('text')
        .attr('class', 'divergence-label')
        .attr('x', humanNode.y + 10)
        .attr('y', humanNode.x - 14)
        .text(time + ' 百万年前分岔')
        .style('opacity', 0)
        .transition().duration(400)
        .style('opacity', 1);
    }
  }

  // --- 12. Update detail card ---
  function updateCard(nodeData) {
    var sp = getSpeciesForNode(nodeData);
    var card = document.getElementById('detail-card');

    if (!sp) {
      card.innerHTML = '<div class="p06-card-prompt">点击左侧谱系树上的物种查看详情</div>';
      return;
    }

    var statusClass = sp.usesTools ? 'p06-status-true' : 'p06-status-false';
    var statusText = sp.usesTools ? '使用工具' : '不使用工具';

    var behaviorsHtml = '';
    if (sp.toolBehaviors && sp.toolBehaviors.length > 0) {
      behaviorsHtml = '<div class="p06-behaviors">' +
        '<div class="p06-behaviors-title">工具使用行为</div>' +
        sp.toolBehaviors.map(function(b) { return '<div class="p06-behavior-item">' + b + '</div>'; }).join('') +
        '</div>';
    }

    // Tool system level indicator
    var levels = ['无', '物件', '加工', '系统'];
    var levelIndex = 0;
    if (sp.toolSystemLevel === 'object') levelIndex = 1;
    else if (sp.toolSystemLevel === 'modified') levelIndex = 2;
    else if (sp.toolSystemLevel === 'system') levelIndex = 3;

    var levelBarsHtml = '';
    var levelLabelsHtml = '';
    for (var i = 0; i < 4; i++) {
      var barClass = '';
      if (i <= levelIndex) {
        barClass = (levelIndex === 3 && i === 3) ? 'p06-level-bar filled-system' : 'p06-level-bar filled';
      } else {
        barClass = 'p06-level-bar';
      }
      levelBarsHtml += '<div class="' + barClass + '"></div>';
      levelLabelsHtml += '<span' + (i === levelIndex ? ' class="active"' : '') + '>' + levels[i] + '</span>';
    }

    var levelHtml = '<div class="p06-level-indicator">' +
      '<div class="p06-level-title">工具系统层级</div>' +
      '<div class="p06-level-bars">' + levelBarsHtml + '</div>' +
      '<div class="p06-level-labels">' + levelLabelsHtml + '</div>' +
      '</div>';

    var humanNoteHtml = '';
    if (sp.isHuman) {
      humanNoteHtml = '<div class="p06-human-note">系统意味着：工具造工具，工具修工具，工具设计工具。</div>';
    }

    var divergenceHtml = '';
    if (!sp.isHuman) {
      var time = Lec.P.getDivergenceTime(sp.id);
      divergenceHtml = '<div class="p06-divergence">与人类分岔时间：<strong>' + time + ' 百万年前</strong></div>';
    }

    card.innerHTML =
      '<div class="p06-card-header">' +
        '<div class="p06-card-name">' + sp.commonName + '</div>' +
        '<div class="p06-card-sci">' + sp.scientificName + '</div>' +
      '</div>' +
      '<span class="p06-card-status ' + statusClass + '">' + statusText + '</span>' +
      behaviorsHtml +
      levelHtml +
      divergenceHtml +
      humanNoteHtml;
  }

  // --- 13. Click handler ---
  nodes.on('click', function(event, d) {
    var sp = getSpeciesForNode(d);
    if (!sp) return; // internal nodes — no card update

    updateCard(d);
    if (humanNode) {
      highlightPathBetween(d, humanNode);
    }
  });

  // Also make circles clickable
  nodeGroup.selectAll('.node-circle')
    .on('click', function(event, d) {
      var sp = getSpeciesForNode(d);
      if (!sp) return;
      updateCard(d);
      if (humanNode) {
        highlightPathBetween(d, humanNode);
      }
    });

  // --- 14. Entrance animation (anime.js) ---
  // Show links first, then nodes, staggered by depth
  var linkEls = linkGroup.selectAll('path').nodes();
  var nodeEls = nodeGroup.selectAll('g').nodes();

  // Build depth-to-delay map for links
  var linkData = linkGroup.selectAll('path').data();
  var nodeData = nodeGroup.selectAll('g').data();

  anime({
    targets: linkEls,
    opacity: [0, 1],
    delay: function(el, i) {
      var d = d3.select(el).datum();
      return (d.target.depth) * 180 + 100;
    },
    duration: 500,
    easing: 'easeInOutQuad',
    complete: function() {
      // After links, animate nodes
      anime({
        targets: nodeEls,
        opacity: [0, 1],
        scale: [0, 1],
        delay: function(el, i) {
          var d = d3.select(el).datum();
          return d.depth * 140;
        },
        duration: 450,
        easing: 'easeOutBack',
        complete: function() {
          // Default: select human node
          if (humanNode) {
            updateCard(humanNode);
            highlightPathBetween(humanNode, humanNode);
            nodeGroup.selectAll('.node-circle')
              .classed('selected', function(d) { return d === humanNode; });
          }
        }
      });
    }
  });

})();
</script>
</body>
</html>
