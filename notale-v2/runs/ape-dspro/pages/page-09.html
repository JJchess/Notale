<!doctype html>

<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* 整体容器：页眉 96px 绝对定位，内容必须从它下方开始 */
  .page-body {
    padding-top: 104px;
  }
  /* stage-cards: 把 generalization 的 supports 从纵列改成横排卡片 */
  .k-generalization .supports.stage-row {
    flex-direction: row;
    border-left: none;
    padding-left: 0;
    margin-left: 0;
    gap: 0;
    align-items: stretch;
    justify-content: center;
    background: var(--color-surface);
    border-radius: 12px;
    padding: var(--sp-2xl) var(--sp-lg);
  }
  .k-generalization .supports.stage-row > .support {
    flex: 0 0 430px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: var(--sp-2xl) var(--sp-xl);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    background: var(--bg);
    position: relative;
  }
  .k-generalization .supports.stage-row > .support::before {
    display: none;
  }
  .stage-arrow {
    flex: 0 0 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    color: var(--color-accent);
    user-select: none;
    line-height: 1;
  }
  .card-label {
    font-size: var(--fs-label);
    color: var(--color-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: var(--sp-md);
  }
  .card-illo {
    width: 250px;
    height: 160px;
    margin-bottom: var(--sp-lg);
    flex-shrink: 0;
  }
  .card-illo svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  .card-body {
    font-size: var(--fs-sec);
    line-height: var(--lh-normal);
    color: var(--text);
    max-width: 340px;
  }
  .transition-line {
    font-size: var(--fs-lead);
    line-height: var(--lh-normal);
    text-align: center;
    color: var(--color-dim);
    margin: var(--sp-lg) 0 var(--sp-xl) 0;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
  }
</style>
</head>
