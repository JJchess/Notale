<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lens {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 48px var(--sp-2xl);
      width: 560px;
      flex-shrink: 0;
    }
    .lens .ch-label {
      font-size: var(--fs-label);
      color: var(--color-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: var(--sp-md);
      text-align: center;
    }
    .lens .organ-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: var(--sp-lg);
      margin-bottom: var(--sp-md);
    }
    .lens .organ-row .org {
      font-size: var(--fs-h1);
      font-weight: 700;
      line-height: var(--lh-tight);
    }
    .lens .organ-row .arr {
      font-size: 28px;
      color: var(--color-dim);
      line-height: 1;
      font-weight: 300;
    }
    .lens .sentence {
      font-size: var(--fs-lead);
      line-height: var(--lh-normal);
      text-align: center;
    }
    .lens .sentence .v {
      font-weight: 600;
      color: var(--text);
    }
    .lens .sentence .f {
      color: var(--color-dim);
    }
    .bridge-arrow {
      font-size: 56px;
      color: var(--color-accent);
      margin: 0 var(--sp-xl);
      line-height: 1;
      font-weight: 200;
      user-select: none;
      flex-shrink: 0;
    }
    .bridge-zone {
      position: relative;
      margin: var(--sp-2xl) 0;
      padding: var(--sp-lg) 0;
    }
    .bridge-zone .bg-svg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
    .bridge-zone .fg {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body data-page="10" data-total="40">
  <div id="stage">
    <main id="main" class="col items-center justify-center" style="height: 100%;">
      <div class="k-generalization" style="max-width: 1350px; width: 100%;">

        <div class="claim">
          <p style="margin:0;">第一章我们看见了手的外包：石头是拳头的体外化。</p>
          <p style="margin:var(--sp-xs) 0 0 0;">第二章要讲的是：声音离开身体之后，会变成什么。</p>
        </div>

        <div class="bridge-zone">
          <svg class="bg-svg" width="960" height="440" viewBox="0 0 960 440" style="color:var(--color-border-light);">
            <ellipse cx="480" cy="220" rx="460" ry="200" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
            <ellipse cx="480" cy="220" rx="440" ry="185" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
          </svg>
          <div class="fg row items-center justify-center">

            <div class="lens col items-center">
              <div class="ch-label">第一章</div>
              <div class="organ-row">
                <span class="org">手</span>
                <span class="arr">→</span>
                <span class="org">石头</span>
              </div>
              <div class="sentence">
                <span class="v">石头</span><span class="f">是</span><span class="v">拳头</span><span class="f">的体外化</span>
              </div>
            </div>

            <div class="bridge-arrow">⟶</div>

            <div class="lens col items-center">
              <div class="ch-label">第二章</div>
              <div class="organ-row">
                <span class="org">声音</span>
                <span class="arr">→</span>
                <span class="org">文字</span>
              </div>
              <div class="sentence">
                <span class="v">文字</span><span class="f">是</span><span class="v">声音</span><span class="f">的体外化</span>
              </div>
            </div>

          </div>
        </div>

        <div class="supports">
          <div class="support">石头不会疼，不会累，可以传给别人——体外化的东西获得了身体没有的属性。</div>
          <div class="support">声音说完就消失。语言还困在身体里。</div>
          <div class="support">当语言离开身体，就不再受限于肺活量、距离和一次性的时间。</div>
        </div>

      </div>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 10,
      kicker: '第二章',
      title: '声音之外',
      take: '语言离开身体之后'
    });
  </script>
</body>
</html>
