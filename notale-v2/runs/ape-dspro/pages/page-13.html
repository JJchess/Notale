<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* —— 本页专用样式 —— */
  #konva-container {
    position: relative;
    width: 1408px;
    height: 620px;
    overflow: hidden;
  }

  /* 口语词含义标签 —— 叠在 Konva 画布上 */
  .wl-meaning {
    position: absolute;
    font-size: var(--fs-sec);
    color: var(--color-dim);
    line-height: var(--lh-tight);
    pointer-events: none;
    white-space: nowrap;
    z-index: 5;
  }

  /* 拖拽提示 */
  .drag-hint {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: var(--fs-label);
    color: var(--color-dim);
    pointer-events: none;
    transition: opacity 0.4s;
    white-space: nowrap;
    z-index: 5;
  }

  /* 完成态覆盖层 */
  #completion-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.92);
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease;
    z-index: 20;
  }
  #completion-overlay.show {
    opacity: 1;
  }
  #completion-overlay .inscription-tablet {
    background: #ede4d3;
    border: 3px solid #8b7355;
    border-radius: 12px;
    padding: 32px 48px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.12);
    max-width: 720px;
  }
  #completion-overlay .inscription-title {
    font-size: var(--fs-h2);
    font-weight: 700;
    color: #5d4037;
    text-align: center;
    margin-bottom: 20px;
    letter-spacing: 0.04em;
  }
  #completion-overlay .inscription-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 10px 0;
    border-bottom: 1px solid #c4b89a;
    font-size: var(--fs-body);
    line-height: var(--lh-normal);
  }
  #completion-overlay .inscription-row:last-child {
    border-bottom: none;
  }
  #completion-overlay .ins-word {
    font-weight: 600;
    color: #5d4037;
    min-width: 100px;
    text-align: right;
  }
  #completion-overlay .ins-arrow {
    color: #8b7355;
    font-size: var(--fs-sec);
  }
  #completion-overlay .ins-symbol {
    font-size: 32px;
    color: #3e2723;
    min-width: 60px;
    text-align: center;
  }
  #completion-overlay .ins-meaning {
    color: var(--color-dim);
    font-size: var(--fs-sec);
    min-width: 60px;
    text-align: left;
  }
  #completion-overlay .ins-note {
    margin-top: 20px;
    font-size: var(--fs-sec);
    color: #8b7355;
    text-align: center;
    font-style: italic;
    line-height: var(--lh-normal);
  }
</style>
</head>
<body data-page="13" data-total="40">
<div id="stage">
<main id="main">
  <div id="konva-container">
    <!-- 口语词含义标签（DOM 叠层） -->
    <span class="wl-meaning" id="wl-0" style="left:58px;top:56px;">石头</span>
    <span class="wl-meaning" id="wl-1" style="left:512px;top:56px;">水</span>
    <span class="wl-meaning" id="wl-2" style="left:966px;top:56px;">手</span>
    <span class="wl-meaning" id="wl-3" style="left:58px;top:194px;">太阳</span>
    <span class="wl-meaning" id="wl-4" style="left:512px;top:194px;">食物</span>
    <span class="wl-meaning" id="wl-5" style="left:966px;top:194px;">人</span>
    <!-- 拖拽提示 -->
    <span class="drag-hint" id="drag-hint">拖拽下方的符号到对应的口语词旁，建立一一对应</span>
    <!-- 完成态覆盖 -->
    <div id="completion-overlay">
      <div class="inscription-tablet">
        <div class="inscription-title">文字：声音的凝固</div>
        <div class="inscription-row"><span class="ins-word">ku-ri</span><span class="ins-arrow">→</span><span class="ins-symbol">‖⋮</span><span class="ins-meaning">石头</span></div>
        <div class="inscription-row"><span class="ins-word">ma-ra</span><span class="ins-arrow">→</span><span class="ins-symbol">≈</span><span class="ins-meaning">水</span></div>
        <div class="inscription-row"><span class="ins-word">ta-pa</span><span class="ins-arrow">→</span><span class="ins-symbol">✋</span><span class="ins-meaning">手</span></div>
        <div class="inscription-row"><span class="ins-word">si-lu</span><span class="ins-arrow">→</span><span class="ins-symbol">⊙</span><span class="ins-meaning">太阳</span></div>
        <div class="inscription-row"><span class="ins-word">bur-gu</span><span class="ins-arrow">→</span><span class="ins-symbol">⊕</span><span class="ins-meaning">食物</span></div>
        <div class="inscription-row"><span class="ins-word">en-zu</span><span class="ins-arrow">→</span><span class="ins-symbol">𐂂</span><span class="ins-meaning">人</span></div>
        <div class="ins-note">口语说完就消散在空气里，但刻痕留在泥板上，明天还能看。<br>一旦声音有了替身，你就不需要和说话的人同时在场——这是信息第一次脱离身体。</div>
      </div>
    </div>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lib/konva.min.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  // ==== 挂载页眉页脚 ====
  Lec.mount({
    act: '第二章 · 声音之外',
    title: '把会消失的振动变成不会消失的划痕',
    sub: '文字不是记录声音，而是给每个声音找一个能留在空间里的替身',
    foot: ''
  });

  // ==== 数据定义 ====
  var words = [
    { id: 'ku-ri', label: 'ku-ri', meaning: '石头', symbol: '‖⋮', wfType: 'short-burst', slotIdx: 0 },
    { id: 'ma-ra', label: 'ma-ra', meaning: '水',   symbol: '≈',  wfType: 'smooth',      slotIdx: 1 },
    { id: 'ta-pa', label: 'ta-pa', meaning: '手',   symbol: '✋',  wfType: 'spike',        slotIdx: 2 },
    { id: 'si-lu', label: 'si-lu', meaning: '太阳', symbol: '⊙',  wfType: 'high-cresc',   slotIdx: 3 },
    { id: 'bur-gu',label: 'bur-gu',meaning: '食物', symbol: '⊕',  wfType: 'low-muddy',    slotIdx: 4 },
    { id: 'en-zu', label: 'en-zu', meaning: '人',   symbol: '𐂂',  wfType: 'soft',         slotIdx: 5 }
  ];

  // 单词卡片网格参数
  var WC_W = 420, WC_H = 115;
  var WC_COLS = [40, 494, 948];
  var WC_ROWS = [14, 152];
  // 符号槽在卡片内的位置（左上角偏移）
  var SLOT_OX = 330, SLOT_OY = 15, SLOT_SZ = 80;

  // 预计算每个槽的舞台坐标中心
  var slotCenters = [];
  for (var r = 0; r < 2; r++) {
    for (var c = 0; c < 3; c++) {
      slotCenters.push({
        x: WC_COLS[c] + SLOT_OX + SLOT_SZ/2,
        y: WC_ROWS[r] + SLOT_OY + SLOT_SZ/2
      });
    }
  }

  // 符号卡片初始位置（底部一行，散落但等距，顺序打乱避免位置暗示）
  // 符号 0→‖⋮, 1→≈, 2→✋, 3→⊙, 4→⊕, 5→𐂂
  var symbolHomeX = [610, 130, 1090, 370, 1330, 850];
  var symbolHomeY = [475, 490, 465, 485, 470, 480];

  // ==== Konva 初始化 ====
  var container = document.getElementById('konva-container');
  var stage = new Konva.Stage({
    container: container,
    width: 1408,
    height: 620
  });
  var mainLayer = new Konva.Layer();
  stage.add(mainLayer);

  // ==== 埋一条贯穿中轴的参考线（process 骨架的视觉暗示） ====
  mainLayer.add(new Konva.Line({
    points: [704, 10, 704, 610],
    stroke: '#d1d5db',
    strokeWidth: 1,
    dash: [8, 12],
    listening: false
  }));

  // ==== 绘制单词卡片 ====
  var wordCardGroups = [];
  var waveformLines = [];
  var slotRects = [];

  words.forEach(function(w, idx) {
    var r = Math.floor(idx / 3);
    var c = idx % 3;
    var cx = WC_COLS[c];
    var cy = WC_ROWS[r];

    var grp = new Konva.Group({ x: cx, y: cy });

    // 卡片背景
    grp.add(new Konva.Rect({
      width: WC_W, height: WC_H,
      fill: '#faf8f3',
      stroke: '#c4b89a',
      strokeWidth: 1.5,
      cornerRadius: 6,
      shadowColor: 'rgba(0,0,0,0.06)',
      shadowBlur: 6,
      shadowOffsetY: 2
    }));

    // 单词标签（Konva.Text —— 与卡片绑定，需要变换时跟随）
    grp.add(new Konva.Text({
      x: 16, y: 14,
      text: w.label,
      fontSize: 18,
      fontFamily: 'Inter, sans-serif',
      fontStyle: '600',
      fill: '#3e2723',
      listening: false
    }));

    // 波形线（初始为空，动画中更新）
    var wfLine = new Konva.Line({
      x: 120, y: 20,
      points: [],
      stroke: '#2563eb',
      strokeWidth: 2,
      lineCap: 'round',
      lineJoin: 'round',
      tension: 0.3,
      listening: false
    });
    grp.add(wfLine);
    waveformLines.push(wfLine);

    // 符号槽（虚线框）
    var slotRect = new Konva.Rect({
      x: SLOT_OX, y: SLOT_OY,
      width: SLOT_SZ, height: SLOT_SZ,
      stroke: '#8b7355',
      strokeWidth: 2,
      dash: [6, 4],
      cornerRadius: 4,
      fill: 'rgba(139,115,85,0.04)',
      listening: false
    });
    grp.add(slotRect);
    slotRects.push(slotRect);

    wordCardGroups.push(grp);
    mainLayer.add(grp);
  });

  // ==== 绘制符号卡片 ====
  var symbolGroups = [];
  var symbolHomePositions = [];
  var matchedState = [false, false, false, false, false, false];

  function drawSymbol(group, symbolId, size) {
    var cx = size/2, cy = size/2;
    var s = symbolId;
    var dark = '#4e342e';

    if (s === '‖⋮') {
      // 两条竖线 + 三个点
      group.add(new Konva.Line({ points: [cx-16,cy-28, cx-16,cy+28], stroke: dark, strokeWidth: 3, lineCap: 'round' }));
      group.add(new Konva.Line({ points: [cx+16,cy-28, cx+16,cy+28], stroke: dark, strokeWidth: 3, lineCap: 'round' }));
      [-16, 0, 16].forEach(function(dy) {
        group.add(new Konva.Circle({ x: cx, y: cy+dy, radius: 3.5, fill: dark }));
      });
    } else if (s === '≈') {
      // 两条波浪线
      var pts1 = [], pts2 = [];
      for (var i = 0; i <= 40; i++) {
        var px = cx-30 + (i/40)*60;
        pts1.push(px, cy-10 + Math.sin(i/40*Math.PI*4)*8);
        pts2.push(px, cy+10 + Math.sin(i/40*Math.PI*4 + 0.5)*8);
      }
      group.add(new Konva.Line({ points: pts1, stroke: dark, strokeWidth: 2.5, tension: 0.4, lineCap: 'round' }));
      group.add(new Konva.Line({ points: pts2, stroke: dark, strokeWidth: 2.5, tension: 0.4, lineCap: 'round' }));
    } else if (s === '✋') {
      // 简化的手掌：掌心圆 + 五条放射线
      group.add(new Konva.Circle({ x: cx, y: cy+4, radius: 16, stroke: dark, strokeWidth: 2.5 }));
      var angles = [-60, -30, 0, 30, 60];
      angles.forEach(function(a) {
        var rad = a * Math.PI / 180;
        group.add(new Konva.Line({
          points: [cx, cy-12, cx + Math.sin(rad)*22, cy-12 - Math.cos(rad)*22],
          stroke: dark, strokeWidth: 2.5, lineCap: 'round'
        }));
      });
    } else if (s === '⊙') {
      group.add(new Konva.Circle({ x: cx, y: cy, radius: 24, stroke: dark, strokeWidth: 2.5 }));
      group.add(new Konva.Circle({ x: cx, y: cy, radius: 5, fill: dark }));
    } else if (s === '⊕') {
      group.add(new Konva.Circle({ x: cx, y: cy, radius: 24, stroke: dark, strokeWidth: 2.5 }));
      group.add(new Konva.Line({ points: [cx-16,cy, cx+16,cy], stroke: dark, strokeWidth: 2.5, lineCap: 'round' }));
      group.add(new Konva.Line({ points: [cx,cy-16, cx,cy+16], stroke: dark, strokeWidth: 2.5, lineCap: 'round' }));
    } else if (s === '𐂂') {
      // 简化人形：头圆 + 躯干 + 腿 + 臂
      group.add(new Konva.Circle({ x: cx, y: cy-22, radius: 8, stroke: dark, strokeWidth: 2.5 }));
      group.add(new Konva.Line({ points: [cx,cy-14, cx,cy+10], stroke: dark, strokeWidth: 2.5, lineCap: 'round' }));
      group.add(new Konva.Line({ points: [cx,cy+10, cx-12,cy+28], stroke: dark, strokeWidth: 2.5, lineCap: 'round' }));
      group.add(new Konva.Line({ points: [cx,cy+10, cx+12,cy+28], stroke: dark, strokeWidth: 2.5, lineCap: 'round' }));
      group.add(new Konva.Line({ points: [cx-14,cy-6, cx+14,cy-6], stroke: dark, strokeWidth: 2.5, lineCap: 'round' }));
    }
  }

  words.forEach(function(w, idx) {
    var hx = symbolHomeX[idx];
    var hy = symbolHomeY[idx];
    symbolHomePositions.push({ x: hx, y: hy });

    var grp = new Konva.Group({ x: hx, y: hy, draggable: true });

    // 泥板背景
    grp.add(new Konva.Rect({
      x: -55, y: -55,
      width: 110, height: 110,
      fill: '#ede4d3',
      stroke: '#8b7355',
      strokeWidth: 2.5,
      cornerRadius: 4,
      shadowColor: 'rgba(0,0,0,0.10)',
      shadowBlur: 8,
      shadowOffsetY: 3
    }));

    // 绘制符号
    drawSymbol(grp, w.symbol, 110);

    // 存储数据
    grp.setAttr('wordIdx', idx);
    grp.setAttr('symbolId', w.symbol);

    // 拖拽事件
    grp.on('dragstart', function() {
      this.moveToTop();
      this.setAttrs({
        scaleX: 1.08, scaleY: 1.08,
        shadowColor: 'rgba(0,0,0,0.18)',
        shadowBlur: 14
      });
      mainLayer.batchDraw();
    });

    grp.on('dragend', function() {
      this.setAttrs({
        scaleX: 1, scaleY: 1,
        shadowColor: 'rgba(0,0,0,0.10)',
        shadowBlur: 8
      });

      var gx = this.x();
      var gy = this.y();
      var widx = this.getAttr('wordIdx');
      var matched = false;

      // 检查是否放到正确槽位
      var target = slotCenters[widx];
      var dx = gx - target.x;
      var dy = gy - target.y;
      var dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < 55 && !matchedState[widx]) {
        // 正确匹配！
        matched = true;
        matchedState[widx] = true;
        this.draggable(false);
        // 吸附动画 —— 微微放大 → 缩回嵌入
        var tweenNode = this;
        new Konva.Tween({
          node: this,
          x: target.x, y: target.y,
          scaleX: 1.10, scaleY: 1.10,
          duration: 0.15,
          easing: Konva.Easings.EaseOut,
          onFinish: function() {
            new Konva.Tween({
              node: tweenNode,
              x: target.x, y: target.y,
              scaleX: 0.78, scaleY: 0.78,
              duration: 0.22,
              easing: Konva.Easings.EaseInOut,
              onFinish: function() {
                // 稳定在嵌入尺寸
                tweenNode.setAttrs({ scaleX: 0.75, scaleY: 0.75 });
                mainLayer.batchDraw();
              }
            }).play();
          }
        }).play();
        // 槽位边框变实
        slotRects[widx].dash([]);
        slotRects[widx].stroke('#5d4037');
        slotRects[widx].fill('rgba(139,115,85,0.12)');
        // 波形渐隐
        waveformLines[widx].opacity(0.3);
        // 检查是否全部完成
        checkAllMatched();
      } else if (!matchedState[widx]) {
        // 检查是否误放到其他槽
        var wrongSlot = -1;
        for (var si = 0; si < slotCenters.length; si++) {
          if (matchedState[si]) continue;
          var sdx = gx - slotCenters[si].x;
          var sdy = gy - slotCenters[si].y;
          if (Math.sqrt(sdx*sdx + sdy*sdy) < 55) {
            wrongSlot = si;
            break;
          }
        }
        if (wrongSlot >= 0) {
          // 错误槽位闪红
          flashSlot(wrongSlot);
        }
        // 弹回原位
        var home = symbolHomePositions[widx];
        new Konva.Tween({
          node: this,
          x: home.x, y: home.y,
          duration: 0.35,
          easing: Konva.Easings.EaseOut
        }).play();
      }

      mainLayer.batchDraw();
    });

    symbolGroups.push(grp);
    mainLayer.add(grp);
  });

  // 槽位闪红
  function flashSlot(si) {
    var origStroke = slotRects[si].stroke();
    var origFill = slotRects[si].fill();
    slotRects[si].stroke('#e53935');
    slotRects[si].fill('rgba(229,57,53,0.10)');
    mainLayer.batchDraw();
    setTimeout(function() {
      slotRects[si].stroke(origStroke);
      slotRects[si].fill(origFill);
      mainLayer.batchDraw();
    }, 400);
  }

  // ==== 波形动画 ====
  function getWavePoints(type, time, w, h) {
    var pts = [];
    var n = 80;
    var cy = h/2;
    for (var i = 0; i <= n; i++) {
      var x = (i/n) * w;
      var phi = (i/n) * Math.PI * 8 + time * 3.5;
      var amp;
      switch(type) {
        case 'short-burst':
          amp = (Math.sin(i/n*12) > 0.6 ? 1 : 0.15) * Math.sin(phi) * 0.85;
          break;
        case 'smooth':
          amp = Math.sin(phi) * 0.75;
          break;
        case 'spike':
          amp = Math.sin(phi) * (Math.abs(Math.cos(phi*1.7)) > 0.4 ? 1.6 : 0.2);
          break;
        case 'high-cresc':
          amp = Math.sin(phi * 1.4) * (0.4 + (i/n) * 0.9);
          break;
        case 'low-muddy':
          amp = Math.sin(phi * 0.55) * Math.sin(phi * 0.65) * 0.65;
          break;
        case 'soft':
          amp = Math.sin(phi) * 0.35;
          break;
        default:
          amp = Math.sin(phi) * 0.5;
      }
      pts.push(x, cy - amp * h * 0.38);
    }
    return pts;
  }

  var animTime = 0;
  var allMatched = false;
  var completionShown = false;

  function checkAllMatched() {
    if (matchedState.every(function(v) { return v; })) {
      allMatched = true;
      // 显示完成覆盖层
      setTimeout(function() {
        if (!completionShown) {
          completionShown = true;
          var overlay = document.getElementById('completion-overlay');
          overlay.classList.add('show');
          var hint = document.getElementById('drag-hint');
          if (hint) hint.style.opacity = '0';
        }
      }, 600);
    }
  }

  // 动画循环
  Deck.loop(function(dt) {
    animTime += dt;
    var allDone = allMatched;

    for (var i = 0; i < 6; i++) {
      if (allDone || matchedState[i]) {
        // 已匹配的波形持续淡出
        var op = waveformLines[i].opacity();
        if (op > 0) {
          waveformLines[i].opacity(Math.max(0, op - dt * 0.8));
        }
        if (allDone && op <= 0.01) {
          waveformLines[i].points([]);
        }
      } else {
        // 活跃波形
        var pts = getWavePoints(words[i].wfType, animTime, 200, 75);
        waveformLines[i].points(pts);
      }
    }
    mainLayer.batchDraw();
  }, { still: 0.35 });

  // ==== 初始绘制 ====
  // 画一帧静帧：在 reduced-motion 下这帧就是读者看到的全部
  for (var i = 0; i < 6; i++) {
    var pts = getWavePoints(words[i].wfType, 0.35, 200, 75);
    waveformLines[i].points(pts);
  }
  mainLayer.batchDraw();

  // ==== 页面销毁时清理 ====
  // （Konva 自动管理，但保留此注释以表明已知晓）

})();
</script>
</body>
</html>
