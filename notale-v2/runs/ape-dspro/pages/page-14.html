<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root {
    --p14-bg: #FBF7F0;
    --p14-text: #2C2416;
    --p14-dim: #8B7355;
    --p14-accent: #C41E3A;
    --p14-border: #D4C9B8;
  }

  #stage {
    background: var(--p14-bg);
  }

  #main {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 1408px;
    margin: 0 auto;
    padding-top: 96px;
    padding-bottom: 8px;
    gap: var(--sp-md);
    color: var(--p14-text);
  }

  /* ---- Photo Row ---- */
  .triptych-photos {
    display: flex;
    flex-direction: row;
    gap: var(--sp-lg);
    width: 100%;
    padding: 0 var(--sp-md);
  }

  .t-col {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .t-photo-frame {
    width: 100%;
    height: 160px;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--p14-border);
    background: var(--color-surface);
  }

  .t-photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .t-name {
    font-size: var(--fs-sec);
    font-weight: 600;
    color: var(--p14-text);
    text-align: center;
    line-height: var(--lh-tight);
  }

  .t-era {
    font-size: var(--fs-label);
    color: var(--p14-dim);
    text-align: center;
    line-height: var(--lh-tight);
    letter-spacing: 0.02em;
  }

  /* ---- SMS Mockup ---- */
  .sms-mockup {
    width: 100%;
    height: 160px;
    background: #1C1C1E;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 12px;
    border: 1px solid var(--p14-border);
    position: relative;
  }

  .sms-mockup::before {
    content: '';
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: #444;
  }

  .sms-bubble {
    max-width: 72%;
    padding: 6px 12px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.3;
    font-family: var(--font-sans);
  }

  .sms-bubble.green {
    align-self: flex-start;
    background: #34C759;
    color: #fff;
    border-bottom-left-radius: 3px;
    margin-left: 8px;
  }

  .sms-bubble.blue {
    align-self: flex-end;
    background: #007AFF;
    color: #fff;
    border-bottom-right-radius: 3px;
    margin-right: 8px;
  }

  /* ---- Comparison Table ---- */
  .k-compare-wrap {
    width: 100%;
    padding: 0 var(--sp-md);
  }

  .k-compare-wrap .k-comparison {
    border-radius: 6px;
    grid-template-columns: auto 1fr 1fr 1fr;
  }

  .k-compare-wrap .k-comparison > .hdr {
    font-size: var(--fs-sec);
    font-weight: 600;
    padding: 6px var(--sp-sm);
    background: var(--color-surface);
    text-align: center;
    color: var(--p14-text);
  }

  .k-compare-wrap .k-comparison > .dim {
    font-size: var(--fs-sec);
    padding: 6px var(--sp-sm);
    color: var(--p14-dim);
    background: var(--p14-bg);
    line-height: var(--lh-tight);
  }

  .k-compare-wrap .k-comparison > .cell {
    font-size: var(--fs-sec);
    padding: 6px var(--sp-sm);
    background: #fff;
    color: var(--p14-text);
    line-height: var(--lh-tight);
  }

  .k-compare-wrap .k-comparison > .cell.diff {
    background-color: var(--color-diff);
  }

  /* ---- Connecting Line ---- */
  .connect-area {
    width: 100%;
    padding: 0 var(--sp-md);
    display: flex;
    justify-content: center;
  }

  .connect-svg {
    width: 100%;
    height: 44px;
    overflow: visible;
  }

  .connect-svg line {
    stroke: var(--p14-accent);
    stroke-width: 1.5;
    opacity: 0.5;
  }

  .connect-svg circle {
    fill: var(--p14-accent);
    opacity: 0.65;
  }

  .connect-svg text {
    fill: var(--p14-accent);
    font-size: 14px;
    font-family: var(--font-sans);
    text-anchor: middle;
    opacity: 0.75;
  }

  /* ---- Key Sentences ---- */
  .key-sentences {
    width: 100%;
    padding: 0 var(--sp-md);
    display: flex;
    flex-direction: column;
    gap: var(--sp-sm);
    align-items: center;
  }

  .key-s {
    font-size: var(--fs-sec);
    line-height: var(--lh-normal);
    color: var(--p14-text);
    text-align: center;
    max-width: 960px;
  }

  .key-s.main {
    font-size: var(--fs-lead);
    font-weight: 600;
    color: var(--p14-text);
    border-left: 3px solid var(--p14-accent);
    padding: 4px var(--sp-md);
    text-align: left;
    background: rgba(196, 30, 58, 0.04);
    border-radius: 0 4px 4px 0;
    line-height: var(--lh-normal);
  }

  .key-s.quiet {
    color: var(--p14-dim);
    font-size: var(--fs-label);
    font-style: italic;
  }

  /* ---- Animation initial states ---- */
  [data-col="2"],
  [data-col="3"] {
    opacity: 0;
  }

  .connect-area {
    opacity: 0;
  }

  .key-sentences {
    opacity: 0;
  }
</style>
</head>
<body data-page="14" data-total="40">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {

  // Char weight constants (not in Lec, per spec)
  if (!Lec.P.CHAR_WEIGHT_CLAY) Lec.P.CHAR_WEIGHT_CLAY = 0.03;
  if (!Lec.P.CHAR_WEIGHT_BONE) Lec.P.CHAR_WEIGHT_BONE = 0.002;

  // Mount header/footer
  Lec.mount({
    act: '声音之外',
    title: '三种文字介质',
    sub: '',
    foot: ''
  });

  var main = document.getElementById('main');

  var clayW = Lec.P.CHAR_WEIGHT_CLAY.toFixed(3);
  var boneW = Lec.P.CHAR_WEIGHT_BONE.toFixed(3);

  main.innerHTML = [
    '<div class="triptych-photos">',
      '<div class="t-col" data-col="1">',
        '<div class="t-photo-frame">',
          '<img src="assets/img/05_wikimedia.jpg" alt="楔形文字泥板"',
          ' title="楔形文字泥板，约 3200 BCE，美索不达米亚。来源：Wikimedia Commons，CC0">',
        '</div>',
        '<div class="t-name">楔形文字泥板</div>',
        '<div class="t-era">约 3200 BCE</div>',
      '</div>',
      '<div class="t-col" data-col="2">',
        '<div class="t-photo-frame">',
          '<img src="assets/img/00_wikimedia.jpg" alt="甲骨文"',
          ' title="商代甲骨文，约 1200 BCE，殷墟。来源：Wikimedia Commons，Gary Todd，CC0">',
        '</div>',
        '<div class="t-name">甲骨文</div>',
        '<div class="t-era">约 1200 BCE</div>',
      '</div>',
      '<div class="t-col" data-col="3">',
        '<div class="sms-mockup">',
          '<div class="sms-bubble green">你在哪</div>',
          '<div class="sms-bubble blue">在路上了</div>',
        '</div>',
        '<div class="t-name">手机短信</div>',
        '<div class="t-era">约 2000 CE</div>',
      '</div>',
    '</div>',

    '<div class="k-compare-wrap">',
      '<div class="k-comparison">',
        '<div class="hdr"></div>',
        '<div class="hdr" data-col="1">楔形文字泥板</div>',
        '<div class="hdr" data-col="2">甲骨文</div>',
        '<div class="hdr" data-col="3">手机短信</div>',
        '<div class="dim">介质材料</div>',
        '<div class="cell" data-col="1">湿黏土</div>',
        '<div class="cell" data-col="2">牛肩胛骨 / 龟甲</div>',
        '<div class="cell" data-col="3">玻璃面板 + 液晶</div>',
        '<div class="dim">书写工具</div>',
        '<div class="cell" data-col="1">芦苇笔（斜切）</div>',
        '<div class="cell" data-col="2">青铜刻刀</div>',
        '<div class="cell" data-col="3">拇指</div>',
        '<div class="dim">书写动作</div>',
        '<div class="cell" data-col="1">压入</div>',
        '<div class="cell" data-col="2">刻划</div>',
        '<div class="cell" data-col="3">轻触</div>',
        '<div class="dim">成品形态</div>',
        '<div class="cell" data-col="1">晒干或烧制的硬泥板</div>',
        '<div class="cell" data-col="2">经火烤的卜骨</div>',
        '<div class="cell" data-col="3">像素阵列</div>',
        '<div class="dim">能否擦改</div>',
        '<div class="cell" data-col="1">未干时可抹平重写</div>',
        '<div class="cell" data-col="2">不可擦改</div>',
        '<div class="cell" data-col="3">可删改，但有记录</div>',
        '<div class="dim">每字符重量</div>',
        '<div class="cell" data-col="1">≈ ' + clayW + ' g</div>',
        '<div class="cell" data-col="2">≈ ' + boneW + ' g</div>',
        '<div class="cell" data-col="3">0 g（电子）</div>',
        '<div class="dim">从书写到送达</div>',
        '<div class="cell" data-col="1">日到月（信使徒步）</div>',
        '<div class="cell" data-col="2">即刻（卜骨当场读）</div>',
        '<div class="cell" data-col="3">秒级（无线电）</div>',
        '<div class="dim">寿命</div>',
        '<div class="cell" data-col="1">数千年（干燥环境）</div>',
        '<div class="cell" data-col="2">数千年（埋藏）</div>',
        '<div class="cell" data-col="3">数年（设备寿命）</div>',
      '</div>',
    '</div>',

    '<div class="connect-area">',
      '<svg class="connect-svg" viewBox="0 0 1408 44" preserveAspectRatio="xMidYMid meet">',
        '<line x1="120" y1="18" x2="1288" y2="18"/>',
        '<circle cx="314" cy="18" r="4.5"/>',
        '<circle cx="704" cy="18" r="4.5"/>',
        '<circle cx="1094" cy="18" r="4.5"/>',
        '<text x="314" y="40">书写者</text>',
        '<text x="704" y="40">介质</text>',
        '<text x="1094" y="40">阅读者</text>',
      '</svg>',
    '</div>',

    '<div class="key-sentences">',
      '<div class="key-s main">介质变了，但本质没变：一个人写下，另一个人读到，不需要同时在场。</div>',
      '<div class="key-s">泥板上的楔形文字、骨头上的甲骨文、屏幕上的气泡——它们都是同一种东西：凝固的声音，被搬到了身体外面。</div>',
      '<div class="key-s quiet">第二章收束：从声音到文字，信息不再需要身体来搬运。接下来，连信息的复制也不需要身体了。</div>',
    '</div>'
  ].join('\n');

  // Animation Timeline
  var tl = gsap.timeline({ defaults: { duration: 0.7, ease: 'power2.out' } });

  // Column 2 at 8s
  tl.to('[data-col="2"]', { opacity: 1, stagger: 0.04 }, 8);
  // Column 3 at 16s
  tl.to('[data-col="3"]', { opacity: 1, stagger: 0.04 }, 16);
  // Connecting line at 28s
  tl.to('.connect-area', { opacity: 1, duration: 1.2 }, 28);
  // Key sentences at 30s
  tl.to('.key-sentences', { opacity: 1, duration: 0.8 }, 30);

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    tl.progress(1);
  }

});
</script>
</body>
</html>
