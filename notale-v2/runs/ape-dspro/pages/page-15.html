<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ── page-15: 手抄本 vs 印刷本 ── */
  .p15-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: calc(var(--header-h) + var(--sp-xs)) var(--sp-xl) 0;
  }
  .p15-year {
    text-align: center;
    font-size: var(--fs-label);
    color: var(--color-dim);
    font-style: italic;
    margin-bottom: var(--sp-xs);
  }
  .p15-split {
    display: flex;
    flex: 1;
    min-height: 0;
    gap: 0;
  }
  .p15-side {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--color-surface);
    border-radius: 6px;
    padding: var(--sp-sm) var(--sp-md) var(--sp-md);
  }
  .p15-side-hd {
    text-align: center;
    font-size: var(--fs-h2);
    font-weight: 600;
    padding-bottom: var(--sp-xs);
    margin-bottom: var(--sp-xs);
    border-bottom: 2px solid;
  }
  .p15-left .p15-side-hd {
    color: #b45309;
    border-color: #b45309;
  }
  .p15-right .p15-side-hd {
    color: var(--color-accent);
    border-color: var(--color-accent);
  }
  .p15-counter {
    text-align: center;
    font-size: var(--fs-sec);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-bottom: var(--sp-sm);
  }
  .p15-left .p15-counter { color: #b45309; }
  .p15-right .p15-counter { color: var(--color-accent); }
  .p15-divider {
    width: 1px;
    background: var(--color-border);
    flex-shrink: 0;
    align-self: stretch;
  }
  .p15-steps {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .p15-step {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .p15-step-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: var(--sp-sm);
  }
  .p15-step-lbl {
    font-size: var(--fs-label);
    color: var(--text);
    font-weight: 500;
    white-space: nowrap;
    transition: color 0.2s;
  }
  .p15-step-lbl.cur {
    color: var(--color-accent);
    font-weight: 600;
  }
  .p15-left .p15-step-lbl.cur { color: #b45309; }
  .p15-step-desc {
    font-size: var(--fs-tick);
    color: var(--color-dim);
  }
  .p15-step-time {
    font-size: var(--fs-tick);
    color: var(--color-dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .p15-bar-track {
    height: 24px;
    background: #e5e7eb;
    border-radius: 3px;
    overflow: hidden;
  }
  .p15-bar-fill {
    height: 100%;
    border-radius: 3px;
    width: 0%;
  }
  .p15-left .p15-bar-fill {
    background: linear-gradient(90deg, #b45309, #d97706);
  }
  .p15-right .p15-bar-fill {
    background: linear-gradient(90deg, #2563eb, #3b82f6);
  }
  .p15-take {
    text-align: center;
    font-size: var(--fs-sec);
    color: var(--color-dim);
    padding: var(--sp-xs) var(--sp-xl) 0;
    line-height: var(--lh-normal);
    font-style: italic;
    border-top: 1px solid var(--color-border-light);
    margin-top: 4px;
  }
  .p15-ctls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: var(--sp-md);
    padding: var(--sp-xs) 0 var(--sp-sm);
  }
  .p15-qtys {
    display: flex;
    gap: var(--sp-xs);
  }
  .p15-qty {
    padding: 3px 14px;
    font-size: var(--fs-label);
    border: 1px solid var(--color-border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    font-variant-numeric: tabular-nums;
  }
  .p15-qty.sel {
    background: var(--color-accent);
    color: #fff;
    border-color: var(--color-accent);
  }
  .p15-qty:hover:not(.sel) {
    background: var(--color-surface);
  }
  .p15-go {
    padding: 5px 22px;
    font-size: var(--fs-label);
    font-weight: 600;
    border: none;
    border-radius: 4px;
    background: var(--color-accent);
    color: #fff;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .p15-go:hover { opacity: 0.9; }
  .p15-go:active { transform: scale(0.97); }
  .p15-go:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
</style>
</head>
<body data-page="15" data-total="40">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
(function() {
  /* ── 数据：全部从 Lec 取，带 fallback ── */
  var SCRIBE_SPEED = Lec.K.SCRIBE_SPEED ?? 3600;
  var TYPESET_TIME = Lec.K.TYPESET_TIME ?? 28800;
  var PRESS_SPEED  = Lec.K.PRESS_SPEED  ?? 15;
  var SCRIBE_PREP  = Lec.K.SCRIBE_PREP  ?? 600;
  var PRINTING     = Lec.K.PRINTING     ?? 1440;

  var STEPS = ['获取原稿','准备介质','复制第 1 份','复制第 10 份','复制第 100 份','复制第 1000 份'];
  var SCRIBE_HOW = ['已有底本','裁纸、调墨','逐字抄写','逐字抄写 ×10','逐字抄写 ×100','逐字抄写 ×1000'];
  var PRESS_HOW  = ['已有底本','铸字、排版、上墨','压印第一张','压印第十张','压印第一百张','压印第一千张'];

  var target = 1000;
  var tl = null;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── 工具 ── */
  function fmtTime(s) {
    if (s === 0) return '0 秒';
    if (s < 60) return s + ' 秒';
    if (s < 3600) return Math.round(s / 60) + ' 分';
    var h = s / 3600;
    return (h >= 10 ? Math.round(h) : h.toFixed(1)) + ' 小时';
  }

  function calcCumul(N) {
    var ms = [1, 10, 100, N];
    var scr = [0, SCRIBE_PREP];
    var prs = [0, TYPESET_TIME];
    for (var i = 0; i < 4; i++) {
      scr.push(SCRIBE_PREP + SCRIBE_SPEED * ms[i]);
      prs.push(TYPESET_TIME + PRESS_SPEED * ms[i]);
    }
    return { scr: scr, prs: prs };
  }

  function barW(t, maxT) {
    if (t <= 0 || maxT <= 0) return 0;
    return (Math.log10(t + 1) / Math.log10(maxT + 1)) * 100;
  }

  function $id(id) { return document.getElementById(id); }

  /* ── 构建 DOM ── */
  function sideEl(title, sideCls, prefix, hows) {
    var s = document.createElement('div');
    s.className = 'p15-side ' + sideCls;

    var hd = document.createElement('div');
    hd.className = 'p15-side-hd';
    hd.textContent = title;
    s.appendChild(hd);

    var cnt = document.createElement('div');
    cnt.className = 'p15-counter';
    cnt.id = prefix + '-counter';
    cnt.textContent = '已完成 0 份';
    s.appendChild(cnt);

    var steps = document.createElement('div');
    steps.className = 'p15-steps';
    for (var i = 0; i < 6; i++) {
      var step = document.createElement('div');
      step.className = 'p15-step';

      var top = document.createElement('div');
      top.className = 'p15-step-top';

      var lbl = document.createElement('span');
      lbl.className = 'p15-step-lbl';
      lbl.id = prefix + '-lbl-' + i;
      lbl.textContent = STEPS[i];
      top.appendChild(lbl);

      var time = document.createElement('span');
      time.className = 'p15-step-time';
      time.id = prefix + '-time-' + i;
      time.textContent = '0 秒';
      top.appendChild(time);

      step.appendChild(top);
      var desc = document.createElement('div');
      desc.className = 'p15-step-desc';
      desc.textContent = hows[i];
      step.appendChild(desc);

      var track = document.createElement('div');
      track.className = 'p15-bar-track';
      var fill = document.createElement('div');
      fill.className = 'p15-bar-fill';
      fill.id = prefix + '-bar-' + i;
      track.appendChild(fill);
      step.appendChild(track);

      steps.appendChild(step);
    }
    s.appendChild(steps);
    return s;
  }

  function build() {
    var m = document.getElementById('main');
    var wrap = document.createElement('div');
    wrap.className = 'p15-wrap';

    var year = document.createElement('div');
    year.className = 'p15-year';
    year.textContent = 'c. ' + PRINTING;
    wrap.appendChild(year);

    var split = document.createElement('div');
    split.className = 'p15-split';
    split.appendChild(sideEl('手抄本', 'p15-left', 'scribe', SCRIBE_HOW));
    var div = document.createElement('div');
    div.className = 'p15-divider';
    split.appendChild(div);
    split.appendChild(sideEl('印刷本', 'p15-right', 'press', PRESS_HOW));
    wrap.appendChild(split);

    var takeEl = document.createElement('div');
    takeEl.className = 'p15-take';
    takeEl.id = 'p15-take';
    wrap.appendChild(takeEl);

    var ctls = document.createElement('div');
    ctls.className = 'p15-ctls';
    var qtys = document.createElement('div');
    qtys.className = 'p15-qtys';
    [1, 10, 100, 1000].forEach(function(q) {
      var b = document.createElement('button');
      b.className = 'p15-qty' + (q === target ? ' sel' : '');
      b.textContent = q + ' 本';
      b.setAttribute('data-qty', q);
      b.addEventListener('click', function() { pickQty(q); });
      qtys.appendChild(b);
    });
    ctls.appendChild(qtys);
    var go = document.createElement('button');
    go.className = 'p15-go';
    go.id = 'go-btn';
    go.textContent = '开始复制';
    go.addEventListener('click', run);
    ctls.appendChild(go);
    wrap.appendChild(ctls);

    m.appendChild(wrap);
  }

  /* ── 数量选择 ── */
  function pickQty(q) {
    target = q;
    document.querySelectorAll('.p15-qty').forEach(function(b) {
      b.classList.toggle('sel', +b.getAttribute('data-qty') === q);
    });
    resetAll();
  }

  function resetAll() {
    if (tl) { tl.kill(); tl = null; }
    for (var i = 0; i < 6; i++) {
      var sb = $id('scribe-bar-' + i);
      var pb = $id('press-bar-' + i);
      if (sb) sb.style.width = '0%';
      if (pb) pb.style.width = '0%';
      var st = $id('scribe-time-' + i);
      var pt = $id('press-time-' + i);
      if (st) st.textContent = '0 秒';
      if (pt) pt.textContent = '0 秒';
      var sl = $id('scribe-lbl-' + i);
      var pl = $id('press-lbl-' + i);
      if (sl) sl.classList.remove('cur');
      if (pl) pl.classList.remove('cur');
    }
    var sc = $id('scribe-counter');
    var pc = $id('press-counter');
    if (sc) sc.textContent = '已完成 0 份';
    if (pc) pc.textContent = '已完成 0 份';
    var go = $id('go-btn');
    if (go) go.disabled = false;
  }

  /* ── 动画 ── */
  function run() {
    resetAll();
    var go = $id('go-btn');
    if (go) go.disabled = true;

    var cumul = calcCumul(target);
    var scr = cumul.scr;
    var prs = cumul.prs;
    var maxT = scr[5];
    var sW = scr.map(function(t) { return barW(t, maxT); });
    var pW = prs.map(function(t) { return barW(t, maxT); });

    var durMult = reduceMotion ? 0.01 : 1;

    tl = gsap.timeline({
      defaults: { ease: 'none' },
      onComplete: function() {
        if (go) go.disabled = false;
      }
    });

    /* step 1: instant */
    tl.set('#scribe-bar-0, #press-bar-0', { width: '0%' });
    tl.set('#scribe-time-0, #press-time-0', { textContent: '0 秒' });

    /* step 2: 关键一跳 —— 排版 vs 调墨 */
    var s2 = { p: 0 };
    tl.to(s2, {
      p: 1, duration: 1.8 * durMult, ease: reduceMotion ? 'none' : 'power2.out',
      onUpdate: function() {
        var p = s2.p;
        $id('scribe-bar-1').style.width = (sW[1] * p) + '%';
        $id('press-bar-1').style.width = (pW[1] * p) + '%';
        $id('scribe-time-1').textContent = fmtTime(Math.round(scr[1] * p));
        $id('press-time-1').textContent = fmtTime(Math.round(prs[1] * p));
      }
    }, 0);
    tl.call(function() {
      $id('scribe-lbl-1').classList.add('cur');
      $id('press-lbl-1').classList.add('cur');
    }, null, 0.05);

    /* steps 3-6: 手抄本持续增长，印刷本几乎不动 */
    for (var i = 2; i < 6; i++) {
      var dur = (1.0 + i * 0.25) * durMult;
      var so = { p: 0 };
      tl.to(so, {
        p: 1, duration: dur,
        onUpdate: function(idx, sW_i, scr_i) {
          return function() {
            var p = so.p;
            $id('scribe-bar-' + idx).style.width = (sW_i * p) + '%';
            $id('scribe-time-' + idx).textContent = fmtTime(Math.round(scr_i * p));
          };
        }(i, sW[i], scr[i])
      });
      tl.to('#press-bar-' + i, {
        width: pW[i] + '%', duration: 0.12 * durMult,
        onComplete: function(idx, prs_i) {
          return function() {
            $id('press-time-' + idx).textContent = fmtTime(prs_i);
          };
        }(i, prs[i])
      }, '<');
      tl.call(function(idx) {
        return function() {
          $id('scribe-lbl-' + idx).classList.add('cur');
          $id('press-lbl-' + idx).classList.add('cur');
        };
      }(i), null, '<0.12');
    }

    /* 印刷本计数器 —— 快速跳完 */
    var pcObj = { v: 0 };
    tl.to(pcObj, {
      v: target, duration: 0.4 * durMult, ease: reduceMotion ? 'none' : 'power2.in',
      onUpdate: function() {
        $id('press-counter').textContent = '已完成 ' + Math.round(pcObj.v) + ' 份';
      }
    }, 1.8 * durMult);

    /* 手抄本计数器 —— 缓慢爬行 */
    var scObj = { v: 0 };
    tl.to(scObj, {
      v: target, duration: 7.0 * durMult,
      onUpdate: function() {
        $id('scribe-counter').textContent = '已完成 ' + Math.round(scObj.v) + ' 份';
      }
    }, 1.8 * durMult);
  }

  /* ── 挂载 ── */
  Lec.mount({
    index: 15,
    kicker: 'COPY',
    title: '一次一个，还是一次一千个',
    take: '印刷术改写了文字传播的数学：手抄本的时间是线性的，每多一本就多一份等量的劳动；印刷本的时间是一次性的，排版之后，复制本身几乎不花时间。'
  });

  build();

  /* 把 take 填进页面 */
  var takeEl = $id('p15-take');
  if (takeEl) {
    takeEl.textContent = '印刷术改写了文字传播的数学：手抄本的时间是线性的，每多一本就多一份等量的劳动；印刷本的时间是一次性的，排版之后，复制本身几乎不花时间。';
  }
})();
</script>
</body>
</html>
