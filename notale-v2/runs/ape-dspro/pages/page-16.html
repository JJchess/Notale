<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* ===== 本章路径回顾条 ===== */
    .chapter-path {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: var(--sp-xs);
      padding: 0 0 var(--sp-sm) 0;
      margin-bottom: var(--sp-md);
    }
    .chapter-path .path-label {
      font-size: var(--fs-label);
      color: var(--color-dim);
      padding: 2px var(--sp-xs);
      border-radius: 3px;
      background: var(--color-surface);
      border: 1px solid var(--color-border-light);
      white-space: nowrap;
    }
    .chapter-path .path-arrow {
      font-size: var(--fs-label);
      color: var(--color-border);
      flex-shrink: 0;
    }

    /* ===== 账本容器 ===== */
    .ledger-wrap {
      border: 1px solid var(--color-border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg);
    }

    /* ===== 账本表头 ===== */
    .ledger-header {
      display: grid;
      grid-template-columns: 1fr 2fr 2fr 2fr;
      gap: var(--sp-md);
      padding: var(--sp-sm) var(--sp-md);
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--color-dim);
      letter-spacing: 0.03em;
      border-bottom: 2px solid var(--color-border);
      background: var(--color-surface);
    }

    /* ===== 账本行：覆盖 k-enumeration 的 .it 样式 ===== */
    .k-enumeration.ledger > .it.ledger-row {
      display: grid;
      grid-template-columns: 1fr 2fr 2fr 2fr;
      gap: var(--sp-md);
      padding: var(--sp-sm) var(--sp-md);
      border-bottom: 1px solid var(--color-border-light);
      font-size: var(--fs-sec);
      line-height: var(--lh-normal);
      align-items: baseline;
    }
    .k-enumeration.ledger > .it.ledger-row::before {
      content: none;
    }
    .k-enumeration.ledger > .it.ledger-row:last-of-type {
      border-bottom: none;
    }

    /* ===== 阶段名列 ===== */
    .ledger-stage {
      font-weight: 600;
      color: var(--color-accent);
    }

    /* ===== 回扣章题的反思句 ===== */
    .reflection {
      font-size: var(--fs-sec);
      line-height: var(--lh-normal);
      color: var(--text);
      padding: var(--sp-sm) var(--sp-md);
      margin-top: var(--sp-md);
      border-left: 3px solid var(--color-accent);
      background: var(--color-accent-light);
      border-radius: 0 4px 4px 0;
    }

    /* ===== 过渡提示 ===== */
    .transition-hint {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: var(--sp-sm);
      padding: var(--sp-md) 0 0 0;
      margin-top: var(--sp-md);
      font-size: var(--fs-sec);
      color: var(--text);
      border-top: 1px dashed var(--color-border-light);
    }
    .transition-hint .arrow {
      font-size: var(--fs-h2);
      color: var(--color-accent);
      flex-shrink: 0;
    }
    .transition-hint .ch3-label {
      font-weight: 600;
      color: var(--color-dim);
      white-space: nowrap;
    }
  </style>
</head>
<body data-page="16" data-total="40">
  <div id="stage">
    <main id="main"></main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 16,
      kicker: '第二章 · 收束',
      title: '信息离开身体之后',
      take: '从声音到文字到印刷到电报，信息越来越不需要身体来搬运——声音要肺和喉，文字要手和眼，印刷要手操作机器，电报只需要手指敲击。'
    });

    const main = document.getElementById('main');

    /* ---- 本章路径回顾 ---- */
    const path = document.createElement('div');
    path.className = 'chapter-path';
    const labels = ['声音之外', '声波局限', '声场衰减', '文字凝固', '三种介质', '印刷术'];
    labels.forEach((label, i) => {
      const span = document.createElement('span');
      span.className = 'path-label';
      span.textContent = label;
      path.appendChild(span);
      if (i < labels.length - 1) {
        const arrow = document.createElement('span');
        arrow.className = 'path-arrow';
        arrow.textContent = '→';
        path.appendChild(arrow);
      }
    });
    main.appendChild(path);

    /* ---- 账本（enumeration） ---- */
    const ledger = document.createElement('div');
    ledger.className = 'k-enumeration ledger';

    const wrap = document.createElement('div');
    wrap.className = 'ledger-wrap';

    /* 表头 */
    const header = document.createElement('div');
    header.className = 'ledger-header';
    ['阶段', '信息如何被搬运', '身体参与什么', '身体不再需要做什么'].forEach(h => {
      const d = document.createElement('div');
      d.textContent = h;
      header.appendChild(d);
    });
    wrap.appendChild(header);

    /* 四行数据 */
    const rows = [
      { stage: '声音', how: '声波在空气中传播', bodyDo: '肺、喉、舌、唇制造振动', bodyNot: '无——声音是身体直接制造的' },
      { stage: '文字', how: '刻痕留在介质上', bodyDo: '手刻写，眼阅读', bodyNot: '说话者不需要在场' },
      { stage: '印刷', how: '墨迹批量复制到纸上', bodyDo: '手操作印刷机（早期），眼阅读', bodyNot: '手不需要逐份抄写' },
      { stage: '电报', how: '电信号沿导线传输', bodyDo: '手指敲击电键，耳听或眼读译码', bodyNot: '身体不需要携带信息跨越距离' }
    ];

    rows.forEach(r => {
      const row = document.createElement('div');
      row.className = 'it ledger-row';

      const stage = document.createElement('div');
      stage.className = 'ledger-stage';
      stage.textContent = r.stage;

      const how = document.createElement('div');
      how.textContent = r.how;

      const bodyDo = document.createElement('div');
      bodyDo.textContent = r.bodyDo;

      const bodyNot = document.createElement('div');
      bodyNot.textContent = r.bodyNot;

      row.appendChild(stage);
      row.appendChild(how);
      row.appendChild(bodyDo);
      row.appendChild(bodyNot);
      wrap.appendChild(row);
    });

    ledger.appendChild(wrap);
    main.appendChild(ledger);

    /* ---- 回扣章题 ---- */
    const refl = document.createElement('div');
    refl.className = 'reflection';
    refl.textContent = '声音是身体能制造的最轻的工具，但它的替代品——文字、印刷、电报——让信息彻底离开了身体，跨越了时间和距离。';
    main.appendChild(refl);

    /* ---- 过渡到第三章 ---- */
    const trans = document.createElement('div');
    trans.className = 'transition-hint';

    const hintText = document.createElement('span');
    hintText.textContent = '当信息不再需要身体搬运，身体本身就成了下一个等待外包的东西——皮肤。';
    trans.appendChild(hintText);

    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    arrow.textContent = '→';
    trans.appendChild(arrow);

    const ch3 = document.createElement('span');
    ch3.className = 'ch3-label';
    ch3.textContent = '第三章：皮肤之外';
    trans.appendChild(ch3);

    main.appendChild(trans);
  </script>
</body>
</html>
