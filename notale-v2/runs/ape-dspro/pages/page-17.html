<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* === Page 17: 皮肤之外 —— 第三章开场 === */

    /* Dark space palette — override theme tokens for this page */
    body {
      --bg: #070b16;
      --text: #dde4f0;
      --color-dim: #7a8da8;
      --color-border: #1e2d42;
      --color-border-light: #152033;
      --color-accent: #5b9bd5;
      --color-accent-light: rgba(91, 155, 213, 0.10);
      --color-surface: rgba(255, 255, 255, 0.025);
      --color-diff: rgba(91, 155, 213, 0.06);
      background: radial-gradient(ellipse at 50% 38%, #0f1a2e 0%, #070b16 70%);
    }

    #main {
      position: absolute;
      top: 96px;
      bottom: 88px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      box-sizing: border-box;
    }

    .shells-container {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shells-svg {
      width: 480px;
      height: 480px;
      display: block;
    }

    /* Constrain generalization width for readability */
    .k-generalization {
      width: 100%;
      max-width: 760px;
    }

    /* Adapt claim for dark: translucent accent background */
    .k-generalization .claim {
      background: rgba(91, 155, 213, 0.08);
      border-left-color: var(--color-accent);
    }

    /* Make the support left-border visible on dark */
    .k-generalization .supports {
      border-left-color: rgba(91, 155, 213, 0.25);
    }

    /* Support text slightly dimmer than claim */
    .k-generalization .support {
      color: var(--color-dim);
    }

    /* Dot markers visible on dark */
    .k-generalization .support::before {
      background: rgba(91, 155, 213, 0.35);
    }

    .k-generalization .support strong {
      color: var(--text);
      font-weight: 600;
    }
  </style>
</head>
<body data-page="17" data-total="40">
<div id="stage">
<main id="main">

  <div class="shells-container">
    <svg class="shells-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="同心壳层示意：人体轮廓被衣物、建筑、极端环境服和空间站四层外壳包围">
      <defs>
        <radialGradient id="shell-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(91,155,213,0.10)"/>
          <stop offset="55%" stop-color="rgba(91,155,213,0.02)"/>
          <stop offset="100%" stop-color="transparent"/>
        </radialGradient>
      </defs>

      <rect width="500" height="500" fill="transparent"/>

      <!-- Ambient glow behind shells -->
      <circle cx="250" cy="250" r="225" fill="url(#shell-glow)"/>

      <!-- Layer 4: Space Station (outermost, fragmented ring) -->
      <g id="shell-station">
        <circle cx="250" cy="250" r="210" fill="none"
                stroke="rgba(112,155,200,0.35)" stroke-width="2.5"
                stroke-dasharray="14 10 4 10 18 10 6 10"/>
        <circle cx="250" cy="250" r="208" fill="none"
                stroke="rgba(112,155,200,0.12)" stroke-width="1"
                stroke-dasharray="2 6"/>
      </g>

      <!-- Layer 3: Extreme Environment Suit (hexagonal) -->
      <g id="shell-suit">
        <polygon points="250,48 425,115 425,385 250,452 75,385 75,115"
                 fill="none" stroke="rgba(155,175,210,0.4)" stroke-width="3"/>
      </g>

      <!-- Layer 2: Building (rounded rectangle) -->
      <g id="shell-building">
        <rect x="85" y="85" width="330" height="330" rx="26"
              fill="none" stroke="rgba(195,180,155,0.4)" stroke-width="3.5"/>
      </g>

      <!-- Layer 1: Clothing (dashed circle) -->
      <g id="shell-clothing">
        <circle cx="250" cy="250" r="118" fill="none"
                stroke="rgba(228,210,185,0.35)" stroke-width="2"
                stroke-dasharray="6 4"/>
      </g>

      <!-- Human silhouette (center) -->
      <g id="shell-human" transform="translate(250,250)" opacity="0.7">
        <circle cx="0" cy="-52" r="18" fill="none" stroke="rgba(240,215,185,0.7)" stroke-width="2.5"/>
        <line x1="0" y1="-34" x2="0" y2="22" stroke="rgba(240,215,185,0.7)" stroke-width="3" stroke-linecap="round"/>
        <line x1="0" y1="-20" x2="-32" y2="6" stroke="rgba(240,215,185,0.7)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="0" y1="-20" x2="32" y2="6" stroke="rgba(240,215,185,0.7)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="0" y1="22" x2="-20" y2="62" stroke="rgba(240,215,185,0.7)" stroke-width="3" stroke-linecap="round"/>
        <line x1="0" y1="22" x2="20" y2="62" stroke="rgba(240,215,185,0.7)" stroke-width="3" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <div class="k-generalization">
    <div class="claim">壳的进化，是把身体的功能一层层外包给环境。</div>
    <div class="supports">
      <div class="support"><strong>衣物</strong>：最早的外壳，替代皮肤保温，让人体离开恒定气候带。</div>
      <div class="support"><strong>建筑</strong>：把一小块可居住的空间从大环境中割出来，让定居不受天气支配。</div>
      <div class="support"><strong>极端环境服</strong>：潜水服、防化服、舱外服——壳完全隔绝外界，穿戴者通过壳来「触摸」世界。</div>
      <div class="support"><strong>空间站</strong>：壳的终极形态，一个完全人造、自持的「体外身体」，让人活在真空里。</div>
    </div>
  </div>

</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
  Lec.mount({
    index: 17,
    kicker: '第三章',
    title: '皮肤之外',
    take: '壳的进化——把身体的功能一层层外包给环境'
  });

  const mm = gsap.matchMedia();

  mm.add({
    reduceMotion: '(prefers-reduced-motion: reduce)'
  }, (ctx) => {
    const { reduceMotion } = ctx.conditions;

    if (reduceMotion) {
      gsap.set(['.lec-act', '.lec-title', '.lec-sub', '.shells-svg', '.claim', '.support'], {
        opacity: 1
      });
      return;
    }

    /* Entrance choreography: header → shells → claim → supports */
    const tl = gsap.timeline({ defaults: { ease: 'power2.out' } });

    tl.from('.lec-act',  { opacity: 0, y: -8, duration: 0.5 })
      .from('.lec-title', { opacity: 0, y: -8, duration: 0.5 }, '-=0.25')
      .from('.lec-sub',   { opacity: 0, duration: 0.5 }, '-=0.25')
      .from('.shells-svg', { opacity: 0, scale: 0.92, duration: 1.0, ease: 'power3.out' }, '-=0.15')
      .from('.claim',     { opacity: 0, y: 14, duration: 0.5 }, '-=0.3')
      .from('.support',   { opacity: 0, y: 10, duration: 0.4, stagger: 0.1 }, '-=0.2');

    /* Subtle ambient breathing on shells */
    gsap.to('.shells-svg', {
      scale: 1.025,
      duration: 6,
      repeat: -1,
      yoyo: true,
      ease: 'sine.inOut',
      delay: 2.5
    });
  });
</script>
</body>
</html>
