<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== 壳的进化 · 卡片轮播 ===== */

.shell-carousel {
  width: 1408px;
  margin: 0 auto;
  position: relative;
}

.carousel-viewport {
  width: 100%;
  height: 410px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.carousel-viewport::before,
.carousel-viewport::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  width: 36px;
  z-index: 3;
  pointer-events: none;
}
.carousel-viewport::before {
  left: 0;
  background: linear-gradient(to right, var(--bg) 0%, transparent 100%);
}
.carousel-viewport::after {
  right: 0;
  background: linear-gradient(to left, var(--bg) 0%, transparent 100%);
}

.card {
  width: 1140px;
  height: 390px;
  background: var(--bg);
  border: 1px solid var(--color-border);
  border-radius: 8px;
  padding: var(--sp-lg) var(--sp-xl);
  display: flex;
  flex-direction: column;
  gap: var(--sp-md);
  position: relative;
  z-index: 1;
}

.card-head {
  display: flex;
  flex-direction: row;
  align-items: baseline;
  justify-content: space-between;
}

.card-stage {
  font-size: var(--fs-h2);
  font-weight: 600;
  line-height: var(--lh-tight);
  color: var(--text);
}

.card-era {
  font-size: var(--fs-sec);
  color: var(--color-dim);
  line-height: var(--lh-tight);
}

.card-illustration {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
}

.card-illustration svg {
  width: 100%;
  height: 100%;
}

.card-foot {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--sp-lg);
}

.card-thickness {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--sp-sm);
  flex: 1;
}

.th-label {
  font-size: var(--fs-label);
  color: var(--color-dim);
  white-space: nowrap;
}

.th-bar-bg {
  flex: 1;
  height: 8px;
  background: var(--color-border-light);
  border-radius: 4px;
  overflow: hidden;
  min-width: 140px;
}

.th-bar-fill {
  height: 100%;
  background: var(--color-accent);
  border-radius: 4px;
}

.th-val {
  font-size: var(--fs-tick);
  color: var(--text);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  min-width: 52px;
  text-align: right;
}

.card-complexity {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--sp-xs);
}

.cx-label {
  font-size: var(--fs-label);
  color: var(--color-dim);
  white-space: nowrap;
}

.cx-star {
  font-size: 17px;
  line-height: 1;
}
.cx-star.filled { color: var(--color-warning); }
.cx-star.empty { color: var(--color-border-light); }

.nav-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--color-border);
  background: var(--bg);
  color: var(--text);
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 5;
  transition: background 0.15s ease, border-color 0.15s ease;
  user-select: none;
  line-height: 1;
}
.nav-arrow:hover { background: var(--color-surface); border-color: var(--color-accent); }
.nav-arrow:active { background: var(--color-border-light); }
.nav-arrow.prev { left: 104px; }
.nav-arrow.next { right: 104px; }

/* ===== 时间线条 ===== */
.timeline-strip {
  width: 1408px;
  margin: 0 auto;
  padding: 0 100px;
  height: 48px;
  display: flex;
  flex-direction: row;
  align-items: center;
  position: relative;
}

.timeline-strip .tl-line {
  position: absolute;
  left: 100px;
  right: 100px;
  top: 50%;
  height: 1px;
  background: var(--color-border);
  transform: translateY(-50%);
}

.timeline-strip .tl-dot {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  z-index: 1;
}

.timeline-strip .tl-circle {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--color-border-light);
  border: 1px solid var(--color-border);
  transition: all 0.35s ease;
}

.timeline-strip .tl-circle.current {
  background: var(--color-accent);
  border-color: var(--color-accent);
  width: 13px;
  height: 13px;
}

.timeline-strip .tl-label {
  font-size: var(--fs-tick);
  color: var(--color-dim);
  margin-top: 2px;
  white-space: nowrap;
  line-height: 1.2;
  transition: color 0.35s ease;
}

.timeline-strip .tl-label.current {
  color: var(--color-accent);
  font-weight: 600;
}

/* ===== 页面标语 ===== */
.page-tagline {
  width: 1408px;
  margin: 0 auto;
  text-align: center;
  padding: var(--sp-sm) 0 0;
}
.page-tagline p {
  font-size: var(--fs-sec);
  color: var(--color-dim);
  line-height: var(--lh-normal);
  margin: 0 0 4px;
}

/* ===== 底部指标 ===== */
.indicators-row {
  width: 1408px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--sp-xs);
}

.thickness-comparison {
  display: flex;
  flex-direction: row;
  align-items: flex-end;
  gap: var(--sp-sm);
  height: 52px;
  padding: 0 80px;
}
.thickness-comparison .bar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-xs);
  min-width: 0;
}
.thickness-comparison .bar {
  width: 100%;
  max-width: 100px;
  background: var(--color-border-light);
  border-radius: 3px 3px 0 0;
  transition: background 0.35s ease;
}
.thickness-comparison .bar.current { background: var(--color-accent); }
.thickness-comparison .bar-label {
  font-size: var(--fs-tick);
  color: var(--color-dim);
  white-space: nowrap;
  line-height: 1.2;
}

.complexity-comparison {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--sp-sm);
  padding: 0 80px;
}
.complexity-comparison .cx-col {
  flex: 1;
  display: flex;
  flex-direction: row;
  justify-content: center;
  gap: 3px;
}
.complexity-comparison .cx-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--color-border-light);
  transition: background 0.35s ease;
}
.complexity-comparison .cx-dot.current { background: var(--color-warning); }

.page-note {
  width: 1408px;
  margin: 0 auto;
  margin-top: var(--sp-xs);
}

.nav-arrow:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
</style>
</head>
<body data-page="19" data-total="40">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lib/anime.min.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  Lec.mount({
    act: '皮肤之外',
    title: '壳的进化',
    sub: '壳越来越厚，身体能去的地方却越来越多。',
    foot: '从兽皮到宇航服'
  });

  var main = document.getElementById('main');

  if (!Lec.P.shellSequence) {
    Lec.P.shellSequence = function() {
      var stages = [
        { stage: '兽皮披裹',   era: '距今约 17 万年' },
        { stage: '缝制衣物',   era: '距今约 3 万年' },
        { stage: '帐篷',       era: '距今约 1 万年' },
        { stage: '房屋',       era: '距今约 5000 年' },
        { stage: '潜水服',     era: '20 世纪初' },
        { stage: '防化服',     era: '20 世纪中' },
        { stage: '舱外服',     era: '20 世纪 60 年代' }
      ];
      return stages.map(function(s, i) {
        var t = 0.5 * Math.pow(10, i / 2);
        var mag = Math.pow(10, Math.floor(Math.log10(t)));
        return {
          stage: s.stage,
          era: s.era,
          thickness: Math.round(t / mag * 10) / 10 * mag,
          complexity: i + 1
        };
      });
    };
  }

  var sequence = Lec.P.shellSequence();

  function makeShellSVG(index, thickness) {
    var vw = [12, 30, 52, 74, 100, 130, 165][index];
    var lc = [1, 2, 1, 3, 2, 4, 6][index];
    var colors = [
      ['#c4956a'],
      ['#b8956e', '#d4c3a3'],
      ['#c4a87c'],
      ['#d4c5b2', '#b8956e', '#d4c5b2'],
      ['#3a3a4a', '#8ab4d8'],
      ['#4a5a3a', '#8ab4d8', '#d4c3a3', '#f5f0e8'],
      ['#d4956a', '#f5f0e8', '#8ab4d8', '#c4c4c4', '#3a3a4a', '#f5f0e8']
    ][index];

    var lh = 130 / lc;
    var W = 780, H = 190;
    var sx = 110, sy = (H - 130) / 2;

    var p = [];
    p.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '">');

    // 外部环境
    p.push('<rect x="' + (sx - 55) + '" y="' + sy + '" width="55" height="130" rx="8" fill="#dce8f5" opacity="0.5"/>');
    p.push('<text x="' + (sx - 27) + '" y="' + (sy + 70) + '" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#6b7280" font-family="Inter,sans-serif">外部</text>');
    p.push('<text x="' + (sx - 27) + '" y="' + (sy + 88) + '" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#6b7280" font-family="Inter,sans-serif">环境</text>');

    // 壳层
    for (var l = 0; l < lc; l++) {
      var ly = sy + l * lh;
      p.push('<rect x="' + sx + '" y="' + ly + '" width="' + vw + '" height="' + lh + '" fill="' + colors[l] + '" rx="1"/>');
      if (lc > 1 && l < lc - 1) {
        p.push('<line x1="' + sx + '" y1="' + (ly + lh) + '" x2="' + (sx + vw) + '" y2="' + (ly + lh) + '" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>');
      }
    }
    p.push('<rect x="' + sx + '" y="' + sy + '" width="' + vw + '" height="130" fill="none" stroke="#444" stroke-width="1.5" rx="2"/>');

    // 内部空间
    var ix = sx + vw + 8;
    var iw = W - ix - 10;
    p.push('<rect x="' + ix + '" y="' + sy + '" width="' + iw + '" height="130" rx="8" fill="#fef3c7" opacity="0.4"/>');
    p.push('<text x="' + (ix + iw / 2) + '" y="' + (sy + 70) + '" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#6b7280" font-family="Inter,sans-serif">身体</text>');

    // 厚度标注
    p.push('<line x1="' + sx + '" y1="' + (sy - 18) + '" x2="' + (sx + vw) + '" y2="' + (sy - 18) + '" stroke="#1e1e1e" stroke-width="1"/>');
    p.push('<line x1="' + sx + '" y1="' + (sy - 24) + '" x2="' + sx + '" y2="' + (sy - 12) + '" stroke="#1e1e1e" stroke-width="1"/>');
    p.push('<line x1="' + (sx + vw) + '" y1="' + (sy - 24) + '" x2="' + (sx + vw) + '" y2="' + (sy - 12) + '" stroke="#1e1e1e" stroke-width="1"/>');
    p.push('<text x="' + (sx + vw / 2) + '" y="' + (sy - 26) + '" text-anchor="middle" font-size="14" fill="#1e1e1e" font-weight="600" font-family="Inter,sans-serif">' + thickness + ' mm</text>');

    p.push('</svg>');
    return p.join('');
  }

  // ── 构建 DOM ──
  var wrap = document.createElement('div');
  wrap.style.cssText = 'width:1408px;margin:0 auto;padding:2px 0 0;height:620px;display:flex;flex-direction:column;';

  // 时间线条
  var timeline = document.createElement('div');
  timeline.className = 'timeline-strip';
  var tlLine = document.createElement('div');
  tlLine.className = 'tl-line';
  timeline.appendChild(tlLine);
  var tlDots = [];
  for (var t = 0; t < sequence.length; t++) {
    var dotWrap = document.createElement('div');
    dotWrap.className = 'tl-dot';
    var circle = document.createElement('div');
    circle.className = 'tl-circle';
    var label = document.createElement('span');
    label.className = 'tl-label';
    label.textContent = sequence[t].stage;
    dotWrap.appendChild(circle);
    dotWrap.appendChild(label);
    timeline.appendChild(dotWrap);
    tlDots.push({ circle: circle, label: label });
  }

  // 轮播
  var carousel = document.createElement('div');
  carousel.className = 'shell-carousel';

  var viewport = document.createElement('div');
  viewport.className = 'carousel-viewport';

  var card = document.createElement('div');
  card.className = 'card';

  var cardHead = document.createElement('div');
  cardHead.className = 'card-head';
  var cardStage = document.createElement('span');
  cardStage.className = 'card-stage';
  var cardEra = document.createElement('span');
  cardEra.className = 'card-era';
  cardHead.appendChild(cardStage);
  cardHead.appendChild(cardEra);

  var cardIll = document.createElement('div');
  cardIll.className = 'card-illustration';

  var cardFoot = document.createElement('div');
  cardFoot.className = 'card-foot';

  var thDiv = document.createElement('div');
  thDiv.className = 'card-thickness';
  var thLabel = document.createElement('span');
  thLabel.className = 'th-label';
  thLabel.textContent = '厚度';
  var thBg = document.createElement('span');
  thBg.className = 'th-bar-bg';
  var thFill = document.createElement('span');
  thFill.className = 'th-bar-fill';
  thBg.appendChild(thFill);
  var thVal = document.createElement('span');
  thVal.className = 'th-val';
  thDiv.appendChild(thLabel);
  thDiv.appendChild(thBg);
  thDiv.appendChild(thVal);

  var cxDiv = document.createElement('div');
  cxDiv.className = 'card-complexity';
  var cxLabel = document.createElement('span');
  cxLabel.className = 'cx-label';
  cxLabel.textContent = '复杂度';
  cxDiv.appendChild(cxLabel);
  for (var s = 0; s < 7; s++) {
    var star = document.createElement('span');
    star.className = 'cx-star';
    cxDiv.appendChild(star);
  }

  cardFoot.appendChild(thDiv);
  cardFoot.appendChild(cxDiv);
  card.appendChild(cardHead);
  card.appendChild(cardIll);
  card.appendChild(cardFoot);
  viewport.appendChild(card);

  var prevBtn = document.createElement('button');
  prevBtn.className = 'nav-arrow prev';
  prevBtn.setAttribute('aria-label', '上一张卡片');
  prevBtn.textContent = '←';

  var nextBtn = document.createElement('button');
  nextBtn.className = 'nav-arrow next';
  nextBtn.setAttribute('aria-label', '下一张卡片');
  nextBtn.textContent = '→';

  carousel.appendChild(viewport);
  carousel.appendChild(prevBtn);
  carousel.appendChild(nextBtn);

  var tagline = document.createElement('div');
  tagline.className = 'page-tagline';
  var tp1 = document.createElement('p');
  tp1.textContent = '从兽皮到宇航服，每一层壳都在把身体包裹得更彻底，也把它与外部环境隔得更远。';
  var tp2 = document.createElement('p');
  tp2.textContent = '壳的尽头，是把自己装进一个完全人造的世界里。';
  tagline.appendChild(tp1);
  tagline.appendChild(tp2);

  var indicators = document.createElement('div');
  indicators.className = 'indicators-row';

  var thComp = document.createElement('div');
  thComp.className = 'thickness-comparison';
  var maxT = 500;
  var thBars = [];
  for (var j = 0; j < sequence.length; j++) {
    var col = document.createElement('div');
    col.className = 'bar-col';
    var bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = Math.max(4, (sequence[j].thickness / maxT * 40)) + 'px';
    var bl = document.createElement('span');
    bl.className = 'bar-label';
    bl.textContent = sequence[j].stage;
    col.appendChild(bar);
    col.appendChild(bl);
    thComp.appendChild(col);
    thBars.push(bar);
  }

  var cxComp = document.createElement('div');
  cxComp.className = 'complexity-comparison';
  var cxCols = [];
  for (var k = 0; k < sequence.length; k++) {
    var cxCol = document.createElement('div');
    cxCol.className = 'cx-col';
    for (var d = 0; d < 7; d++) {
      var dot = document.createElement('span');
      dot.className = 'cx-dot';
      cxCol.appendChild(dot);
    }
    cxComp.appendChild(cxCol);
    cxCols.push(cxCol);
  }

  indicators.appendChild(thComp);
  indicators.appendChild(cxComp);

  var note = document.createElement('div');
  note.className = 'page-note note';
  note.textContent = '注：舱外服实际厚度约 200 mm，此处为保持递进数列采用 500 mm 展示。';

  wrap.appendChild(timeline);
  wrap.appendChild(carousel);
  wrap.appendChild(tagline);
  wrap.appendChild(indicators);
  wrap.appendChild(note);
  main.appendChild(wrap);

  // ── 交互 ──
  var currentIndex = 0;

  function renderCard(idx) {
    var item = sequence[idx];
    cardStage.textContent = item.stage;
    cardEra.textContent = item.era;
    cardIll.innerHTML = makeShellSVG(idx, item.thickness);
    thFill.style.width = (item.thickness / maxT * 100) + '%';
    thVal.textContent = item.thickness + ' mm';

    var stars = cxDiv.querySelectorAll('.cx-star');
    for (var s = 0; s < 7; s++) {
      stars[s].textContent = s < item.complexity ? '★' : '☆';
      stars[s].className = 'cx-star ' + (s < item.complexity ? 'filled' : 'empty');
    }
    for (var j = 0; j < thBars.length; j++) {
      thBars[j].classList.toggle('current', j === idx);
    }
    for (var k = 0; k < cxCols.length; k++) {
      var dots = cxCols[k].querySelectorAll('.cx-dot');
      for (var d = 0; d < dots.length; d++) {
        dots[d].classList.toggle('current', k === idx && d < sequence[k].complexity);
      }
    }
    // 更新时间线
    for (var t = 0; t < tlDots.length; t++) {
      tlDots[t].circle.classList.toggle('current', t === idx);
      tlDots[t].label.classList.toggle('current', t === idx);
    }
  }

  function goTo(idx) {
    if (idx < 0 || idx >= sequence.length || idx === currentIndex) return;
    currentIndex = idx;
    anime({
      targets: card,
      opacity: [1, 0],
      translateX: [0, -30],
      duration: 200,
      easing: 'easeInQuad',
      complete: function() {
        renderCard(idx);
        anime({
          targets: card,
          opacity: [0, 1],
          translateX: [30, 0],
          duration: 360,
          easing: 'easeOutCubic'
        });
      }
    });
  }

  renderCard(0);

  prevBtn.addEventListener('click', function() { goTo(currentIndex - 1); });
  nextBtn.addEventListener('click', function() { goTo(currentIndex + 1); });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(currentIndex - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); goTo(currentIndex + 1); }
  });

  var tsX = 0, tsY = 0;
  viewport.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) { tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; }
  }, { passive: true });
  viewport.addEventListener('touchend', function(e) {
    if (!e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - tsX;
    var dy = e.changedTouches[0].clientY - tsY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      goTo(dx < 0 ? currentIndex + 1 : currentIndex - 1);
    }
  });

})();
</script>
</body>
</html>
