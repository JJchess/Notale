<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #scene-container {
    width: 100%;
    height: 404px;
    position: relative;
    cursor: grab;
    border-radius: 8px;
    overflow: hidden;
    background: #16162a;
  }
  #scene-container:active {
    cursor: grabbing;
  }
  #scene-container canvas {
    display: block;
  }
  .data-row {
    display: flex;
    flex-direction: row;
    justify-content: center;
    gap: 48px;
    padding: 0 16px;
  }
  .data-group {
    display: flex;
    flex-direction: row;
    gap: 12px;
    align-items: center;
  }
  .data-group .sep {
    width: 1px;
    height: 32px;
    background: var(--color-border-light);
  }
</style>
</head>
<body data-page="20" data-total="40">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/lib/three.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  /* ===== Lec.mount ===== */
  Lec.mount({
    index: 20,
    kicker: '第三章 · 皮肤之外',
    title: '壳层结构',
    take: '房子是衣服的放大版——把一小块温暖的空间从大环境中隔出来。'
  });

  /* ===== DOM structure ===== */
  var main = document.getElementById('main');

  var sceneDiv = document.createElement('div');
  sceneDiv.id = 'scene-container';
  main.appendChild(sceneDiv);

  /* process strip */
  var proc = document.createElement('div');
  proc.className = 'k-process';
  proc.style.marginTop = '10px';
  proc.style.marginBottom = '0';
  proc.style.padding = '6px 0';

  var axis = document.createElement('div');
  axis.className = 'axis';
  proc.appendChild(axis);

  var names = ['帐篷 · 单层壳', '房屋 · 三层壳', '摩天大楼 · 四层壳'];
  for (var i = 0; i < names.length; i++) {
    var step = document.createElement('div');
    step.className = 'step';
    step.textContent = names[i];
    proc.appendChild(step);
    if (i < names.length - 1) {
      var arw = document.createElement('div');
      arw.className = 'arw';
      proc.appendChild(arw);
    }
  }
  main.appendChild(proc);

  /* data panels */
  var dataRow = document.createElement('div');
  dataRow.className = 'data-row';
  dataRow.style.marginTop = '6px';

  var tentThick = Lec.P.TENT_THICKNESS * 1000; /* mm */
  var houseThick = (Lec.P.BRICK_THICKNESS + Lec.P.AIR_GAP + Lec.P.PLASTER_THICKNESS) * 1000;
  var skyThick = (Lec.P.GLASS_THICKNESS + Lec.P.CURTAIN_AIR_GAP + Lec.P.INSULATION_THICKNESS + Lec.P.CONCRETE_THICKNESS) * 1000;

  var buildings = [
    { name: '帐篷', thick: Math.round(tentThick), vol: 15, unit: 'm³' },
    { name: '房屋', thick: Math.round(houseThick), vol: 30, unit: 'm³' },
    { name: '摩天大楼', thick: Math.round(skyThick), vol: 3000, unit: 'm³' }
  ];

  for (var b = 0; b < buildings.length; b++) {
    var dg = document.createElement('div');
    dg.className = 'data-group';

    var p1 = document.createElement('div');
    p1.className = 'panel';
    var v1 = document.createElement('span');
    v1.className = 'value';
    v1.textContent = buildings[b].thick + ' mm';
    var l1 = document.createElement('span');
    l1.className = 'label';
    l1.textContent = '总厚度';
    p1.appendChild(v1);
    p1.appendChild(l1);
    dg.appendChild(p1);

    var sep = document.createElement('div');
    sep.className = 'sep';
    dg.appendChild(sep);

    var p2 = document.createElement('div');
    p2.className = 'panel';
    var v2 = document.createElement('span');
    v2.className = 'value';
    v2.textContent = buildings[b].vol + ' ' + buildings[b].unit;
    var l2 = document.createElement('span');
    l2.className = 'label';
    l2.textContent = '内部空间';
    p2.appendChild(v2);
    p2.appendChild(l2);
    dg.appendChild(p2);

    dataRow.appendChild(dg);
  }
  main.appendChild(dataRow);

  /* note */
  var note = document.createElement('div');
  note.className = 'note';
  note.style.marginTop = '8px';
  note.textContent = '旋转视角观察壳的层状结构——正面看是完整外立面，转到侧面才看到剖面。';
  main.appendChild(note);

  /* ===== Three.js scene ===== */
  var container = sceneDiv;
  var W = 1408;
  var H = 404;

  /* scene */
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x16162a);
  scene.fog = new THREE.Fog(0x16162a, 10, 30);

  /* camera */
  var camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 50);
  camera.position.set(3.5, 3.2, 7.8);
  camera.lookAt(0, 0.4, 0);

  /* renderer */
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H, false);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  container.appendChild(renderer.domElement);

  /* lights */
  var ambient = new THREE.AmbientLight(0x303050, 1.8);
  scene.add(ambient);

  var hemi = new THREE.HemisphereLight(0xddeeff, 0x0f0e0d, 0.6);
  scene.add(hemi);

  var keyLight = new THREE.DirectionalLight(0xffffff, 4);
  keyLight.position.set(8, 10, 6);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.width = 1024;
  keyLight.shadow.mapSize.height = 1024;
  keyLight.shadow.camera.near = 0.5;
  keyLight.shadow.camera.far = 40;
  keyLight.shadow.camera.left = -10;
  keyLight.shadow.camera.right = 10;
  keyLight.shadow.camera.top = 6;
  keyLight.shadow.camera.bottom = -6;
  keyLight.shadow.radius = 2;
  scene.add(keyLight);

  var fillLight = new THREE.DirectionalLight(0x8899cc, 1.5);
  fillLight.position.set(-4, 2, -3);
  scene.add(fillLight);

  var rimLight = new THREE.DirectionalLight(0xffccaa, 1.8);
  rimLight.position.set(0, 1.5, -6);
  scene.add(rimLight);

  /* ground plane */
  var groundGeo = new THREE.PlaneGeometry(20, 20);
  var groundMat = new THREE.MeshStandardMaterial({
    color: 0x1a1a30,
    roughness: 0.95,
    metalness: 0.05
  });
  var ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -2.8;
  ground.receiveShadow = true;
  scene.add(ground);

  /* subtle grid lines on ground */
  var gridHelper = new THREE.PolarGridHelper(9, 32, 20, 64, 0x222244, 0x222244);
  gridHelper.position.y = -2.79;
  scene.add(gridHelper);

  /* ===== Building models ===== */
  function createSteppedWall(layers, wallW, wallH, stepSize) {
    var group = new THREE.Group();
    var zOff = 0;
    for (var i = 0; i < layers.length; i++) {
      var l = layers[i];
      var shrink = i * stepSize;
      var w = Math.max(0.1, wallW - shrink * 2);
      var h = Math.max(0.1, wallH - shrink * 2);
      var geo = new THREE.BoxGeometry(w, h, l.thickness, 1, 1, 1);
      var mat = new THREE.MeshStandardMaterial({
        color: l.color,
        roughness: l.roughness != null ? l.roughness : 0.5,
        metalness: l.metalness != null ? l.metalness : 0.05,
        transparent: l.opacity != null && l.opacity < 1,
        opacity: l.opacity != null ? l.opacity : 1,
        depthWrite: l.opacity == null || l.opacity > 0.9
      });
      var mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(-shrink, -shrink, zOff + l.thickness / 2);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      /* subtle edges */
      var edgeGeo = new THREE.EdgesGeometry(geo);
      var edgeMat = new THREE.LineBasicMaterial({
        color: 0x000000,
        transparent: true,
        opacity: 0.25,
        depthTest: true
      });
      var edgeLine = new THREE.LineSegments(edgeGeo, edgeMat);
      mesh.add(edgeLine);

      group.add(mesh);
      zOff += l.thickness;
    }
    return group;
  }

  /* --- Tent (single layer) --- */
  var tentGroup = new THREE.Group();
  tentGroup.position.set(-3.8, -0.2, 0);

  var tentLayers = [
    { thickness: 0.15, color: 0xd4c9a8, roughness: 0.75, opacity: 0.72 }
  ];
  var tentWall = createSteppedWall(tentLayers, 2.2, 1.6, 0.22);
  tentGroup.add(tentWall);

  /* interior volume indicator */
  var tentIntGeo = new THREE.BoxGeometry(1.2, 0.9, 0.8);
  var tentIntMat = new THREE.MeshStandardMaterial({
    color: 0x333344,
    roughness: 0.9,
    transparent: true,
    opacity: 0.35,
    depthWrite: false
  });
  var tentInt = new THREE.Mesh(tentIntGeo, tentIntMat);
  tentInt.position.set(-0.22, -0.22, 0.55);
  tentGroup.add(tentInt);

  /* roof peak indicator */
  var peakGeo = new THREE.ConeGeometry(0.12, 0.35, 4);
  var peakMat = new THREE.MeshStandardMaterial({ color: 0xc4b898, roughness: 0.7 });
  var peak = new THREE.Mesh(peakGeo, peakMat);
  peak.position.y = 0.95;
  peak.castShadow = true;
  tentGroup.add(peak);

  /* ridge line */
  var ridgeGeo = new THREE.CylinderGeometry(0.03, 0.03, 1.8, 4);
  var ridge = new THREE.Mesh(ridgeGeo, peakMat);
  ridge.rotation.z = Math.PI / 2;
  ridge.position.y = 0.78;
  ridge.castShadow = true;
  tentGroup.add(ridge);

  scene.add(tentGroup);

  /* --- House (3 layers: brick, air, plaster) --- */
  var houseGroup = new THREE.Group();
  houseGroup.position.set(0, -0.5, 0);

  var houseLayers = [
    { thickness: 0.85, color: 0xc1440e, roughness: 0.7 },
    { thickness: 0.35, color: 0x1a1a2e, roughness: 0.5, opacity: 0.45 },
    { thickness: 0.18, color: 0xf0ebe3, roughness: 0.55 }
  ];
  var houseWall = createSteppedWall(houseLayers, 2.4, 2.6, 0.22);
  houseGroup.add(houseWall);

  /* interior */
  var houseIntGeo = new THREE.BoxGeometry(1.3, 1.5, 0.9);
  var houseIntMat = new THREE.MeshStandardMaterial({
    color: 0x3a3a4a,
    roughness: 0.9,
    transparent: true,
    opacity: 0.3,
    depthWrite: false
  });
  var houseInt = new THREE.Mesh(houseIntGeo, houseIntMat);
  houseInt.position.set(-0.44, -0.44, 1.0);
  houseGroup.add(houseInt);

  /* roof */
  var roofGeo = new THREE.BoxGeometry(2.6, 0.15, 1.0);
  var roofMat = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.65 });
  var roof = new THREE.Mesh(roofGeo, roofMat);
  roof.position.set(0, 1.4, 0.3);
  roof.castShadow = true;
  roof.receiveShadow = true;
  houseGroup.add(roof);

  scene.add(houseGroup);

  /* --- Skyscraper (4 layers: glass, air, insulation, concrete) --- */
  var skyGroup = new THREE.Group();
  skyGroup.position.set(3.8, -1.2, 0);

  var skyLayers = [
    { thickness: 0.12, color: 0x88ccdd, roughness: 0.2, metalness: 0.3, opacity: 0.65 },
    { thickness: 1.1, color: 0x1a1a2e, roughness: 0.5, opacity: 0.35 },
    { thickness: 0.65, color: 0xe8b84b, roughness: 0.75 },
    { thickness: 0.85, color: 0x8a8a8a, roughness: 0.65 }
  ];
  var skyWall = createSteppedWall(skyLayers, 2.4, 4.2, 0.22);
  skyGroup.add(skyWall);

  /* interior */
  var skyIntGeo = new THREE.BoxGeometry(1.3, 3.0, 1.2);
  var skyIntMat = new THREE.MeshStandardMaterial({
    color: 0x3a3a4a,
    roughness: 0.9,
    transparent: true,
    opacity: 0.3,
    depthWrite: false
  });
  var skyInt = new THREE.Mesh(skyIntGeo, skyIntMat);
  skyInt.position.set(-0.66, -0.66, 1.8);
  skyGroup.add(skyInt);

  /* floor lines */
  for (var fl = 0; fl < 6; fl++) {
    var flGeo = new THREE.BoxGeometry(2.55, 0.02, 0.5);
    var flMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.4, metalness: 0.6 });
    var flMesh = new THREE.Mesh(flGeo, flMat);
    flMesh.position.set(0, -1.4 + fl * 0.7, 0.5);
    flMesh.castShadow = true;
    skyGroup.add(flMesh);
  }

  scene.add(skyGroup);

  /* ===== Arrows between buildings ===== */
  function createArrow3D(fromX, toX, y) {
    var group = new THREE.Group();
    var midX = (fromX + toX) / 2;
    var length = Math.abs(toX - fromX);

    /* shaft */
    var shaftGeo = new THREE.CylinderGeometry(0.06, 0.06, length - 0.35, 8);
    var shaftMat = new THREE.MeshStandardMaterial({
      color: 0x8899bb,
      roughness: 0.3,
      metalness: 0.4,
      emissive: 0x334466,
      emissiveIntensity: 0.4
    });
    var shaft = new THREE.Mesh(shaftGeo, shaftMat);
    shaft.rotation.z = Math.PI / 2;
    shaft.position.set(midX, y, 0);
    shaft.castShadow = true;
    group.add(shaft);

    /* head */
    var headGeo = new THREE.ConeGeometry(0.16, 0.35, 8);
    var head = new THREE.Mesh(headGeo, shaftMat);
    head.rotation.z = -Math.PI / 2;
    head.position.set(toX - 0.15, y, 0);
    head.castShadow = true;
    group.add(head);

    return group;
  }

  var arrow1 = createArrow3D(-3.8, 0, 0.6);
  scene.add(arrow1);

  var arrow2 = createArrow3D(0, 3.8, 0.8);
  scene.add(arrow2);

  /* ===== Orbit controls (manual) ===== */
  var canvas = renderer.domElement;
  var isDragging = false;
  var prevPt = { x: 0, y: 0 };
  var spherical = { theta: 0.42, phi: 0.92, radius: 8.8 };
  var autoRotate = true;
  var autoRotateSpeed = 0.18;
  var autoRotateTimer = null;

  function updateCamera() {
    var r = spherical.radius;
    var phi = spherical.phi;
    var theta = spherical.theta;
    var x = r * Math.sin(phi) * Math.cos(theta);
    var y = r * Math.cos(phi);
    var z = r * Math.sin(phi) * Math.sin(theta);
    camera.position.set(x, y, z);
    camera.lookAt(0, 0.3, 0);
  }

  function startAutoRotate() {
    if (autoRotateTimer) clearTimeout(autoRotateTimer);
    autoRotateTimer = setTimeout(function() {
      autoRotate = true;
    }, 1800);
  }

  canvas.addEventListener('pointerdown', function(e) {
    isDragging = true;
    autoRotate = false;
    if (autoRotateTimer) clearTimeout(autoRotateTimer);
    var pt = Deck.pt(canvas, e);
    prevPt.x = pt.x;
    prevPt.y = pt.y;
    canvas.setPointerCapture(e.pointerId);
  });

  window.addEventListener('pointermove', function(e) {
    if (!isDragging) return;
    var pt = Deck.pt(canvas, e);
    var dx = pt.x - prevPt.x;
    var dy = pt.y - prevPt.y;
    spherical.theta -= dx * 0.004;
    spherical.phi -= dy * 0.004;
    spherical.phi = Math.max(0.25, Math.min(Math.PI / 2 - 0.05, spherical.phi));
    prevPt.x = pt.x;
    prevPt.y = pt.y;
    updateCamera();
  });

  window.addEventListener('pointerup', function(e) {
    if (!isDragging) return;
    isDragging = false;
    startAutoRotate();
  });

  canvas.addEventListener('wheel', function(e) {
    e.preventDefault();
    spherical.radius += e.deltaY * 0.008;
    spherical.radius = Math.max(4.5, Math.min(16, spherical.radius));
    updateCamera();
  }, { passive: false });

  /* touch pinch zoom */
  var lastPinchDist = 0;
  canvas.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2) {
      lastPinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2) {
      e.preventDefault();
      var dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      var delta = lastPinchDist - dist;
      spherical.radius += delta * 0.02;
      spherical.radius = Math.max(4.5, Math.min(16, spherical.radius));
      lastPinchDist = dist;
      updateCamera();
    }
  }, { passive: false });

  /* ===== Render loop ===== */
  var clock = new THREE.Clock();

  Deck.loop(function() {
    var dt = Math.min(clock.getDelta(), 0.1);
    if (autoRotate && !isDragging) {
      spherical.theta += autoRotateSpeed * dt;
      updateCamera();
    }
    renderer.render(scene, camera);
  });
})();
</script>
</body>
</html>
