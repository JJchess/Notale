<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== Page 22 — 手套剥夺触觉 ===== */
#main {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.page-bg {
  width: 1560px;
  height: 850px;
  background: 
    radial-gradient(circle, rgba(37,99,235,0.06) 1px, transparent 1px),
    #dbeafe;
  background-size: 32px 32px;
  border-radius: 20px;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  overflow: hidden;
}

/* ---- 三栏 ---- */
.col-left, .col-right {
  width: 43%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-lg);
  padding: var(--sp-2xl) var(--sp-xl);
  background: #ffffff;
}

.col-left {
  border-right: 2px solid #bfdbfe;
}

.col-right {
  background: #fffbeb;
  border-left: 2px solid #fde68a;
}

.col-mid {
  width: 14%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #eff6ff;
  padding: 0 var(--sp-sm);
}

/* ---- 面板标题 ---- */
.sec-title {
  font-size: var(--fs-h2);
  font-weight: 600;
  color: var(--text);
  line-height: var(--lh-tight);
  text-align: center;
  flex-shrink: 0;
}

.sec-title .glove-name {
  display: block;
  font-size: var(--fs-sec);
  font-weight: 400;
  color: var(--color-dim);
  margin-top: 2px;
}

/* ---- 核心视觉区 ---- */
.visual-row {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--sp-2xl);
  flex: 1;
  min-height: 0;
}

/* ---- 力反馈柱状图 ---- */
.force-bar-wrap {
  position: relative;
  width: 300px;
  height: 550px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  flex-shrink: 0;
}

.force-bar-wrap canvas {
  display: block;
}

/* ---- 鸡蛋 + 指标 ---- */
.egg-metrics-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-xl);
  flex-shrink: 0;
}

.egg-container {
  position: relative;
  width: 155px;
  height: 195px;
}

.egg {
  width: 145px;
  height: 180px;
  border-radius: 50% / 55%;
  background: linear-gradient(135deg, #fefef9 0%, #f5f0e8 100%);
  border: 2px solid #d4cfc4;
  position: relative;
  margin: 7px auto;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  transition: background 0.4s ease, box-shadow 0.4s ease;
}

.egg::before {
  content: "";
  position: absolute;
  top: 12%; left: 22%;
  width: 28%; height: 36%;
  background: rgba(255,255,255,0.7);
  border-radius: 50%;
  transform: rotate(-15deg);
}

.egg .crack {
  position: absolute;
  background: #8b7355;
  transform-origin: center;
  opacity: 0;
  transition: opacity 0.4s ease;
  border-radius: 1px;
}

.egg .crack.c1 { top: 18%; left: 38%; width: 1.5px; height: 48%; transform: rotate(12deg); }
.egg .crack.c2 { top: 14%; left: 44%; width: 1.5px; height: 42%; transform: rotate(-18deg); }
.egg .crack.c3 { top: 22%; left: 32%; width: 1.5px; height: 35%; transform: rotate(28deg); }

.egg.danger { background: linear-gradient(135deg, #fef9e7 0%, #f5ead0 100%); }
.egg.cracked .crack.c1, .egg.cracked .crack.c3 { opacity: 0.7; }
.egg.broken .crack.c1, .egg.broken .crack.c2, .egg.broken .crack.c3 { opacity: 0.9; }
.egg.broken { background: linear-gradient(135deg, #fef5f0 0%, #f0e0d5 100%); box-shadow: 0 1px 4px rgba(0,0,0,0.04); }

/* ---- 指标 ---- */
.metrics {
  display: flex;
  flex-direction: column;
  gap: var(--sp-md);
  font-size: var(--fs-label);
  color: var(--text);
}

.metrics .metric {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.metrics .metric .val {
  font-size: var(--fs-h2);
  font-weight: 700;
  color: var(--color-accent);
  font-variant-numeric: tabular-nums;
}

.metrics .metric .lbl {
  font-size: var(--fs-tick);
  color: var(--color-dim);
}

/* ---- 描述 ---- */
.desc {
  font-size: var(--fs-sec);
  color: var(--color-dim);
  line-height: var(--lh-normal);
  text-align: center;
  max-width: 460px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.desc .warn {
  color: var(--color-warning);
  font-weight: 600;
}

/* ---- 手套选择器 ---- */
.glove-selector {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  padding: var(--sp-md) 0;
}

.glove-opt {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 165px;
  padding: 13px var(--sp-md);
  background: #ffffff;
  border: 2px solid #bfdbfe;
  border-radius: 8px;
  font-size: var(--fs-label);
  font-family: var(--font-sans);
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: center;
  line-height: var(--lh-tight);
}

.glove-opt:hover {
  border-color: var(--color-accent);
  background: #eff6ff;
}

.glove-opt:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.glove-opt.active {
  border-color: var(--color-accent);
  background: #dbeafe;
  font-weight: 600;
  color: var(--color-accent);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.18);
}

.glove-opt.done {
  opacity: 0.35;
  border-color: #e5e7eb;
  background: #f9fafb;
}

.arrow-down {
  width: 24px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #93c5fd;
  font-size: 14px;
  line-height: 1;
  user-select: none;
  flex-shrink: 0;
}

.baseline-badge {
  font-size: var(--fs-tick);
  color: var(--color-dim);
  background: #f0f9ff;
  border: 1px solid #bae6fd;
  border-radius: 4px;
  padding: 2px 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.hint {
  font-size: var(--fs-tick);
  color: var(--color-dim);
  text-align: center;
  margin-top: var(--sp-xs);
}
</style>
</head>
<body data-page="22" data-total="40">
<div id="stage">
<main id="main">

<div class="page-bg">

  <div class="col-left">
    <div class="sec-title">徒手参考</div>
    <div class="baseline-badge">基准线</div>
    <div class="visual-row">
      <div class="force-bar-wrap">
        <canvas id="force-left" width="300" height="550"></canvas>
      </div>
      <div class="egg-metrics-col">
        <div class="egg-container">
          <div class="egg" id="egg-left">
            <div class="crack c1"></div>
            <div class="crack c2"></div>
            <div class="crack c3"></div>
          </div>
        </div>
        <div class="metrics">
          <div class="metric"><span class="val">100%</span><span class="lbl">力反馈峰值</span></div>
          <div class="metric"><span class="val">0ms</span><span class="lbl">延迟</span></div>
          <div class="metric"><span class="val">0.01N</span><span class="lbl">最小感知力</span></div>
        </div>
      </div>
    </div>
    <div class="desc">能感觉到蛋壳的纹理、温度、微小的不平整</div>
  </div>

  <div class="col-mid">
    <div class="glove-selector" id="glove-selector" role="listbox" aria-label="选择手套类型">
      <button class="glove-opt active" data-step="0" role="option" aria-selected="true">徒手</button>
      <div class="arrow-down">↓</div>
      <button class="glove-opt" data-step="1" role="option" aria-selected="false">薄棉手套</button>
      <div class="arrow-down">↓</div>
      <button class="glove-opt" data-step="2" role="option" aria-selected="false">厚工作手套</button>
      <div class="arrow-down">↓</div>
      <button class="glove-opt" data-step="3" role="option" aria-selected="false">防寒手套</button>
      <div class="arrow-down">↓</div>
      <button class="glove-opt" data-step="4" role="option" aria-selected="false">舱外服内胆</button>
      <div class="arrow-down">↓</div>
      <button class="glove-opt" data-step="5" role="option" aria-selected="false">加压舱外服</button>
    </div>
    <div class="hint">点击选择手套类型</div>
  </div>

  <div class="col-right" id="right-panel">
    <div class="sec-title" id="right-title">戴<span class="glove-name" id="right-glove-name">薄棉手套</span></div>
    <div class="visual-row">
      <div class="force-bar-wrap">
        <canvas id="force-right" width="300" height="550"></canvas>
      </div>
      <div class="egg-metrics-col">
        <div class="egg-container">
          <div class="egg" id="egg-right">
            <div class="crack c1"></div>
            <div class="crack c2"></div>
            <div class="crack c3"></div>
          </div>
        </div>
        <div class="metrics" id="right-metrics">
          <div class="metric"><span class="val" id="val-peak">85%</span><span class="lbl">力反馈峰值</span></div>
          <div class="metric"><span class="val" id="val-delay">15ms</span><span class="lbl">延迟</span></div>
          <div class="metric"><span class="val" id="val-sens">0.05N</span><span class="lbl">最小感知力</span></div>
        </div>
      </div>
    </div>
    <div class="desc" id="right-desc">纹理消失，能感觉到整体形状和压力分布</div>
  </div>

</div>

</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/lec.js"></script>
<script>
var GLOVE_DATA = [
  { step: 0, name: '徒手', peak: 1.00, delay: 0,   sens: 0.01, jagged: 1.0, desc: '能感觉到蛋壳的纹理、温度、微小的不平整', egg: 'intact' },
  { step: 1, name: '薄棉手套', peak: 0.85, delay: 15,  sens: 0.05, jagged: 0.75, desc: '纹理消失，能感觉到整体形状和压力分布', egg: 'intact' },
  { step: 2, name: '厚工作手套', peak: 0.60, delay: 40,  sens: 0.2,  jagged: 0.45, desc: '只能感觉到大致轮廓和主要压力点', egg: 'intact' },
  { step: 3, name: '防寒手套', peak: 0.40, delay: 80,  sens: 0.5,  jagged: 0.25, desc: '压力变成模糊的"紧"或"松"', egg: 'danger' },
  { step: 4, name: '舱外服内胆', peak: 0.25, delay: 120, sens: 1.0,  jagged: 0.10, desc: '几乎感觉不到形状，只能通过视觉判断', egg: 'cracked' },
  { step: 5, name: '加压舱外服', peak: 0.20, delay: 150, sens: 2.0,  jagged: 0.03, desc: '完全依赖视觉和训练，手只是执行器', egg: 'broken' }
];

var currentStep = 0;
var rightState = { peak: 1.0, jagged: 1.0 };
var activeTween = null;

function drawForceBar(canvas, state) {
  var ctx = Deck.fit(canvas);
  var w = 300, h = 550;

  ctx.clearRect(0, 0, w, h);

  ctx.strokeStyle = 'rgba(0,0,0,0.05)';
  ctx.lineWidth = 1;
  for (var y = 48; y <= h - 58; y += 56) {
    ctx.beginPath();
    ctx.moveTo(48, y);
    ctx.lineTo(w - 48, y);
    ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(48, h - 58);
  ctx.lineTo(w - 48, h - 58);
  ctx.stroke();

  var barW = 104;
  var barX = (w - barW) / 2;
  var barBottom = h - 58;
  var barMaxH = barBottom - 46;
  var barH = barMaxH * state.peak;
  var barTop = barBottom - barH;

  ctx.fillStyle = 'rgba(0,0,0,0.04)';
  ctx.fillRect(barX + 4, barTop + 5, barW, barH);

  var grad = ctx.createLinearGradient(0, barTop, 0, barBottom);
  grad.addColorStop(0, '#2563eb');
  grad.addColorStop(0.5, '#3b82f6');
  grad.addColorStop(1, '#93c5fd');
  ctx.fillStyle = grad;

  ctx.beginPath();
  ctx.moveTo(barX, barBottom);
  ctx.lineTo(barX, barTop);

  var segments = 36;
  var segW = barW / segments;
  var amplitude = state.jagged * 13;
  for (var i = 0; i <= segments; i++) {
    var x = barX + i * segW;
    var jitter = amplitude * Math.sin(i * 3.7 + 0.3) * Math.sin(i * 7.1 + 2.1);
    ctx.lineTo(x, barTop + jitter);
  }
  ctx.lineTo(barX + barW, barBottom);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(barX, barTop);
  for (var i2 = 0; i2 <= segments; i2++) {
    var x2 = barX + i2 * segW;
    var j2 = amplitude * Math.sin(i2 * 3.7 + 0.3) * Math.sin(i2 * 7.1 + 2.1);
    ctx.lineTo(x2, barTop + j2);
  }
  ctx.stroke();

  if (state.peak > 0.03) {
    ctx.strokeStyle = 'rgba(0,0,0,0.22)';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.moveTo(20, barTop);
    ctx.lineTo(w - 20, barTop);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.fillStyle = '#1e1e1e';
  ctx.font = '600 14px Inter, "Helvetica Neue", "Segoe UI", Arial, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(Math.round(state.peak * 100) + '%', w - 22, barTop - 10);

  ctx.fillStyle = '#9ca3af';
  ctx.font = '12px Inter, "Helvetica Neue", "Segoe UI", Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('0%', 22, barBottom - 6);
}

function drawLeftBar() {
  drawForceBar(document.getElementById('force-left'), { peak: 1.0, jagged: 1.0 });
}

function updateRightPanel(data) {
  document.getElementById('right-glove-name').textContent = data.name;
  document.getElementById('val-peak').textContent = Math.round(data.peak * 100) + '%';
  document.getElementById('val-delay').textContent = data.delay + 'ms';
  document.getElementById('val-sens').textContent = data.sens + 'N';

  var descEl = document.getElementById('right-desc');
  if (data.step >= 5) {
    descEl.innerHTML = '<span class="warn">舱外服手套里的手不是"感觉"鸡蛋，而是"计算"鸡蛋——</span>通过训练和经验，不是通过触觉。';
  } else {
    descEl.textContent = data.desc;
  }

  var egg = document.getElementById('egg-right');
  egg.className = 'egg';
  if (data.egg === 'danger') egg.classList.add('danger');
  if (data.egg === 'cracked') { egg.classList.add('danger', 'cracked'); }
  if (data.egg === 'broken') { egg.classList.add('broken'); }
}

function selectGlove(step) {
  if (step === currentStep) return;
  currentStep = step;

  var data = GLOVE_DATA[step];

  var opts = document.querySelectorAll('.glove-opt');
  opts.forEach(function(opt, i) {
    opt.classList.remove('active', 'done');
    if (i === step) {
      opt.classList.add('active');
      opt.setAttribute('aria-selected', 'true');
    } else {
      opt.setAttribute('aria-selected', 'false');
      if (i < step) opt.classList.add('done');
    }
  });

  updateRightPanel(data);

  var canvas = document.getElementById('force-right');
  if (activeTween) activeTween.kill();

  var animDuration = 0.35 + (data.delay / 150) * 0.85;

  activeTween = gsap.to(rightState, {
    peak: data.peak,
    jagged: data.jagged,
    duration: animDuration,
    ease: 'power2.out',
    onUpdate: function() { drawForceBar(canvas, rightState); },
    onComplete: function() { activeTween = null; }
  });
}

function init() {
  Lec.mount({
    index: 22,
    kicker: '第三章：皮肤之外',
    title: '手套剥夺触觉',
    take: '壳越厚，触觉越差。手套保护了手，也剥夺了手。'
  });

  drawLeftBar();
  drawForceBar(document.getElementById('force-right'), { peak: 1.0, jagged: 1.0 });

  setTimeout(function() { selectGlove(1); }, 700);

  document.getElementById('glove-selector').addEventListener('click', function(e) {
    var btn = e.target.closest('.glove-opt');
    if (!btn) return;
    selectGlove(parseInt(btn.getAttribute('data-step'), 10));
  });

  document.getElementById('glove-selector').addEventListener('keydown', function(e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      var next = currentStep + (e.key === 'ArrowDown' ? 1 : -1);
      next = Math.max(0, Math.min(5, next));
      selectGlove(next);
      var opts = document.querySelectorAll('.glove-opt');
      if (opts[next]) opts[next].focus();
    }
  });

  window.addEventListener('resize', function() {
    drawLeftBar();
    drawForceBar(document.getElementById('force-right'), rightState);
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
