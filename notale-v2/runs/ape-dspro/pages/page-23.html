<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* 3D canvas container */
  #glove-wrap {
    width: 920px;
    height: 480px;
    margin: 0 auto;
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    outline: 1px solid var(--color-border);
    background: #1a1a28;
  }
  #glove-wrap canvas {
    display: block;
    width: 920px;
    height: 480px;
  }
  /* finger info popup */
  #finger-info {
    font-size: var(--fs-sec);
    color: var(--text);
    line-height: var(--lh-tight);
    min-height: 1.5em;
    text-align: center;
  }
  /* toggle button */
  #btn-toggle {
    font-size: var(--fs-label);
    padding: 6px 20px;
    border: 1px solid var(--color-accent);
    border-radius: 6px;
    background: var(--bg);
    color: var(--color-accent);
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
  }
  #btn-toggle:hover {
    background: var(--color-accent-light);
  }
  #btn-toggle.pressurized {
    background: var(--color-accent);
    color: #fff;
  }
</style>
</head>
<body data-page="23" data-total="40">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/three.min.js"></script>
<script>
/* ================================================================
   page-23 · 舱外服手套：加压后的拳头
   3D 场景：舱外服手套的关节活动范围演示
   ================================================================ */

(function() {
  /* ---- Lec.mount ---- */
  Lec.mount({
    index: 23,
    kicker: '第三章 · 皮肤之外',
    title: '舱外服手套：加压后的拳头',
    take: '舱外服手套内部加压后，每根手指要对抗 4 psi 的气压差。握拳就像捏一个网球。'
  });

  /* ---- DOM 结构 ---- */
  const main = document.getElementById('main');

  // k-process
  const processBar = document.createElement('div');
  processBar.className = 'row items-center gap-md justify-center';
  processBar.style.marginBottom = 'var(--sp-xs)';
  processBar.innerHTML = `
    <span class="text-sec" style="padding:6px 16px;border-radius:6px;background:var(--color-accent-light);border:2px solid var(--color-accent);font-weight:600;" id="step-0">不加压 · 手指自由弯曲</span>
    <span class="text-h2 text-dim">→</span>
    <span class="text-sec" style="padding:6px 16px;border-radius:6px;border:2px solid var(--color-border);" id="step-1">加压 4.3 psi · 活动范围骤降</span>
  `;
  main.appendChild(processBar);

  // 3D canvas wrapper
  const wrap = document.createElement('div');
  wrap.id = 'glove-wrap';
  const canvas = document.createElement('canvas');
  canvas.id = 'glove-canvas';
  wrap.appendChild(canvas);
  main.appendChild(wrap);

  // control row
  const ctrlRow = document.createElement('div');
  ctrlRow.className = 'row items-center gap-md justify-center';
  ctrlRow.style.marginTop = 'var(--sp-sm)';

  const btnToggle = document.createElement('button');
  btnToggle.id = 'btn-toggle';
  btnToggle.textContent = '切换加压';

  const panelP = document.createElement('div');
  panelP.className = 'panel';
  panelP.innerHTML = '<div class="value" id="val-pressure">0 psi</div><div class="label">当前压力</div>';

  const panelF = document.createElement('div');
  panelF.className = 'panel';
  panelF.innerHTML = '<div class="value" id="val-force">0 磅</div><div class="label">握拳对抗力</div>';

  ctrlRow.appendChild(btnToggle);
  ctrlRow.appendChild(panelP);
  ctrlRow.appendChild(panelF);
  main.appendChild(ctrlRow);

  // finger info
  const fingerInfo = document.createElement('div');
  fingerInfo.id = 'finger-info';
  fingerInfo.style.marginTop = 'var(--sp-xs)';
  main.appendChild(fingerInfo);

  // note
  const note = document.createElement('div');
  note.className = 'note';
  note.textContent = '握拳的力量相当于持续捏紧一个标准网球——而且你要捏六个小时。手套是壳的最后一层：它保护了手，也夺走了手本该有的灵巧。';
  main.appendChild(note);

  /* ---- 常量 ---- */
  const GLOVE_PSI = Lec.K.GLOVE_PSI; // 4.3
  const FINGER_AREA = 3.5; // 平方英寸
  const FORCE_PER_FINGER = GLOVE_PSI * FINGER_AREA; // ≈ 15 lbf
  const FORCE_TOTAL = FORCE_PER_FINGER * 5; // ≈ 75 lbf

  /* ---- Three.js 初始化 ---- */
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setSize(920, 480);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a28);
  scene.fog = new THREE.Fog(0x1a1a28, 8, 20);

  const camera = new THREE.PerspectiveCamera(45, 920 / 480, 0.5, 30);
  camera.position.set(0, 0.3, 5.5);
  camera.lookAt(0, 0.2, 0);

  /* ---- 光照 ---- */
  const ambient = new THREE.AmbientLight(0x445566, 0.8);
  scene.add(ambient);

  const keyLight = new THREE.DirectionalLight(0xffeedd, 2.5);
  keyLight.position.set(5, 8, 6);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.width = 1024;
  keyLight.shadow.mapSize.height = 1024;
  keyLight.shadow.camera.near = 0.5;
  keyLight.shadow.camera.far = 30;
  keyLight.shadow.camera.left = -6;
  keyLight.shadow.camera.right = 6;
  keyLight.shadow.camera.top = 6;
  keyLight.shadow.camera.bottom = -6;
  keyLight.shadow.radius = 3;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0x8899cc, 0.8);
  fillLight.position.set(-3, 2, -2);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
  rimLight.position.set(0, -1, -4);
  scene.add(rimLight);

  /* ---- 地面参考面 ---- */
  const floorGeom = new THREE.PlaneGeometry(12, 12);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.9, metalness: 0 });
  const floor = new THREE.Mesh(floorGeom, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -2.6;
  floor.receiveShadow = true;
  scene.add(floor);

  /* ---- 材质 ---- */
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf2f2f0, roughness: 0.35, metalness: 0.08 });
  const jointMat = new THREE.MeshStandardMaterial({ color: 0x5588bb, roughness: 0.25, metalness: 0.55 });
  const palmMat = new THREE.MeshStandardMaterial({ color: 0xe0e0da, roughness: 0.45, metalness: 0.05 });
  const ringMat = new THREE.MeshStandardMaterial({ color: 0x8899aa, roughness: 0.2, metalness: 0.7 });

  /* ---- 构建手套 ---- */
  const glove = new THREE.Group();
  const fingerRoots = {}; // 手指根组
  const fingerPivots = {}; // 每个手指的关节 pivot 数组
  const fingerMeshes = {}; // 每个手指的所有 mesh
  const fingerMaxAngles = {}; // 不加压时的最大角度
  const fingerCurrent = {}; // 当前实际角度
  const fingerTarget = {}; // 目标角度
  const fingerBendPhase = {}; // 'idle' | 'bending' | 'holding' | 'returning'
  const fingerBendTimer = {}; // 动画计时器

  // 创建手指
  function createFinger(name, segments, baseRadius, basePos, rootRot) {
    const root = new THREE.Group();
    root.position.copy(basePos);
    if (rootRot) {
      root.rotation.set(rootRot.x || 0, rootRot.y || 0, rootRot.z || 0);
    }
    const pivots = [];
    const meshes = [];
    const maxAngs = [];
    let parent = root;
    let yOff = 0;

    for (let i = 0; i < segments.length; i++) {
      const segLen = segments[i];
      const r = baseRadius * (1 - i * 0.07);
      const segGeom = new THREE.CylinderGeometry(r, r, segLen, 14);
      const segMesh = new THREE.Mesh(segGeom, bodyMat);
      segMesh.position.y = segLen / 2;
      segMesh.castShadow = true;
      segMesh.receiveShadow = true;
      segMesh.userData = { finger: name, segment: i };
      parent.add(segMesh);
      meshes.push(segMesh);

      yOff += segLen;

      if (i < segments.length - 1) {
        // 关节球
        const jointGeom = new THREE.SphereGeometry(r * 1.2, 14, 14);
        const jointMesh = new THREE.Mesh(jointGeom, jointMat);
        jointMesh.position.y = yOff;
        jointMesh.castShadow = true;
        jointMesh.userData = { finger: name, joint: i };
        parent.add(jointMesh);
        meshes.push(jointMesh);

        // pivot
        const pivot = new THREE.Group();
        pivot.position.y = yOff;
        parent.add(pivot);
        pivots.push({ group: pivot, axis: 'x' });
        maxAngs.push(Math.PI / 2 * (1 - i * 0.2));
        parent = pivot;
      }
    }

    // 指尖小球
    const tipGeom = new THREE.SphereGeometry(baseRadius * 0.6, 12, 12);
    const tipMesh = new THREE.Mesh(tipGeom, bodyMat);
    tipMesh.position.y = yOff;
    tipMesh.userData = { finger: name, tip: true };
    parent.add(tipMesh);
    meshes.push(tipMesh);

    glove.add(root);
    fingerRoots[name] = root;
    fingerPivots[name] = pivots;
    fingerMeshes[name] = meshes;
    fingerMaxAngles[name] = maxAngs;
    fingerCurrent[name] = maxAngs.map(() => 0);
    fingerTarget[name] = maxAngs.map(() => 0);
    fingerBendPhase[name] = 'idle';
    fingerBendTimer[name] = 0;
  }

  // 手掌
  const palmGeom = new THREE.BoxGeometry(1.3, 1.5, 0.5, 6, 6, 3);
  // 稍微圆润化手掌顶点
  const posAttr = palmGeom.getAttribute('position');
  for (let i = 0; i < posAttr.count; i++) {
    const x = posAttr.getX(i);
    const y = posAttr.getY(i);
    const z = posAttr.getZ(i);
    const fx = Math.abs(x / 0.65);
    const fy = Math.abs(y / 0.75);
    const fz = Math.abs(z / 0.25);
    const bulge = 1 + 0.06 * (1 - fx * fx) * (1 - fy * fy) * (1 - fz * fz);
    posAttr.setXYZ(i, x * bulge, y * bulge, z * bulge);
  }
  palmGeom.computeVertexNormals();
  const palm = new THREE.Mesh(palmGeom, palmMat);
  palm.position.y = -0.05;
  palm.castShadow = true;
  palm.receiveShadow = true;
  palm.userData = { finger: 'palm' };
  glove.add(palm);

  // 腕部环
  const wristRingGeom = new THREE.TorusGeometry(0.52, 0.06, 12, 28);
  const wristRing = new THREE.Mesh(wristRingGeom, ringMat);
  wristRing.position.y = -0.95;
  wristRing.rotation.x = Math.PI / 2;
  wristRing.castShadow = true;
  glove.add(wristRing);

  // 腕部圆柱
  const wristCylGeom = new THREE.CylinderGeometry(0.48, 0.48, 0.35, 24);
  const wristCyl = new THREE.Mesh(wristCylGeom, bodyMat);
  wristCyl.position.y = -1.15;
  wristCyl.castShadow = true;
  glove.add(wristCyl);

  // 腕部底环
  const wristBaseGeom = new THREE.TorusGeometry(0.48, 0.05, 10, 28);
  const wristBase = new THREE.Mesh(wristBaseGeom, ringMat);
  wristBase.position.y = -1.32;
  wristBase.rotation.x = Math.PI / 2;
  glove.add(wristBase);

  // 手指数据
  // name, segments, baseRadius, basePos, rootRot
  createFinger('index',  [0.48, 0.30, 0.20], 0.105, new THREE.Vector3(-0.35, 0.50, 0.12));
  createFinger('middle', [0.52, 0.33, 0.22], 0.108, new THREE.Vector3( 0.00, 0.55, 0.12));
  createFinger('ring',   [0.46, 0.30, 0.20], 0.102, new THREE.Vector3( 0.34, 0.50, 0.12));
  createFinger('pinky',  [0.34, 0.21, 0.16], 0.090, new THREE.Vector3( 0.60, 0.35, 0.12));
  createFinger('thumb',  [0.44, 0.30, 0.20], 0.125, new THREE.Vector3(-0.68, -0.15, 0.22),
    new THREE.Vector3(0.35, 0, -0.55));

  // 拇指根部球
  const thumbBallGeom = new THREE.SphereGeometry(0.18, 14, 14);
  const thumbBall = new THREE.Mesh(thumbBallGeom, bodyMat);
  thumbBall.position.set(-0.68, -0.15, 0.22);
  thumbBall.userData = { finger: 'thumb', ball: true };
  glove.add(thumbBall);

  // 设定手指最大角度
  // 食指: MCP 90°, PIP 100°, DIP 80°
  fingerMaxAngles['index'] = [Math.PI/2, 100 * Math.PI/180, 80 * Math.PI/180];
  fingerMaxAngles['middle']= [Math.PI/2, 100 * Math.PI/180, 80 * Math.PI/180];
  fingerMaxAngles['ring']  = [Math.PI/2, 100 * Math.PI/180, 80 * Math.PI/180];
  fingerMaxAngles['pinky'] = [Math.PI/2, 95 * Math.PI/180, 75 * Math.PI/180];
  fingerMaxAngles['thumb'] = [45 * Math.PI/180, 50 * Math.PI/180, 80 * Math.PI/180];

  // 初始化 current/target
  for (const name of Object.keys(fingerMaxAngles)) {
    fingerCurrent[name] = fingerMaxAngles[name].map(() => 0.15); // 轻微弯曲的初始姿态
    fingerTarget[name] = fingerMaxAngles[name].map(() => 0.15);
  }

  scene.add(glove);

  /* ---- 所有可射线检测的 mesh ---- */
  const allFingerMeshes = [];
  glove.traverse((child) => {
    if (child.isMesh && child.userData && child.userData.finger) {
      allFingerMeshes.push(child);
    }
  });

  /* ---- 手动 Orbit Controls ---- */
  let orbitTheta = 0.3;      // 水平角
  let orbitPhi = 0.5;        // 垂直角
  let orbitRadius = 5.5;
  const orbitCenter = new THREE.Vector3(0, 0.2, 0);
  let isDragging = false;
  let prevMouse = { x: 0, y: 0 };

  function updateCamera() {
    const sp = Math.sin(orbitPhi);
    const cp = Math.cos(orbitPhi);
    const st = Math.sin(orbitTheta);
    const ct = Math.cos(orbitTheta);
    camera.position.set(
      orbitCenter.x + orbitRadius * cp * st,
      orbitCenter.y + orbitRadius * sp,
      orbitCenter.z + orbitRadius * cp * ct
    );
    camera.lookAt(orbitCenter);
  }
  updateCamera();

  canvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button === 0) {
      // 先检查是否点击了手指
      const pt = Deck.pt(canvas, e);
      const mouse = new THREE.Vector2();
      mouse.x = (pt.x / 920) * 2 - 1;
      mouse.y = -(pt.y / 480) * 2 + 1;
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(allFingerMeshes, false);
      if (hits.length > 0) {
        const obj = hits[0].object;
        const fingerName = obj.userData.finger;
        if (fingerName && fingerName !== 'palm' && fingerBendPhase[fingerName] === 'idle') {
          triggerFingerBend(fingerName);
          return; // 不进入拖拽
        }
      }
      // 否则开始拖拽旋转
      isDragging = true;
      prevMouse.x = e.clientX;
      prevMouse.y = e.clientY;
      canvas.style.cursor = 'grabbing';
    }
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - prevMouse.x;
    const dy = e.clientY - prevMouse.y;
    orbitTheta -= dx * 0.005;
    orbitPhi += dy * 0.005;
    orbitPhi = Math.max(-1.2, Math.min(1.2, orbitPhi));
    prevMouse.x = e.clientX;
    prevMouse.y = e.clientY;
    updateCamera();
  });

  window.addEventListener('pointerup', () => {
    if (isDragging) {
      isDragging = false;
      canvas.style.cursor = '';
    }
  });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    orbitRadius += e.deltaY * 0.01;
    orbitRadius = Math.max(3, Math.min(10, orbitRadius));
    updateCamera();
  }, { passive: false });

  // hover 时手指变色
  canvas.addEventListener('pointermove', (e) => {
    if (isDragging) return;
    const pt = Deck.pt(canvas, e);
    const mouse = new THREE.Vector2();
    mouse.x = (pt.x / 920) * 2 - 1;
    mouse.y = -(pt.y / 480) * 2 + 1;
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(allFingerMeshes, false);
    // 重置所有手指材质
    for (const name of Object.keys(fingerMeshes)) {
      for (const m of fingerMeshes[name]) {
        if (m.material === bodyMat || m.material === jointMat) {
          m.material.emissive = new THREE.Color(0x000000);
        }
      }
    }
    if (hits.length > 0) {
      const obj = hits[0].object;
      const fn = obj.userData.finger;
      if (fn && fn !== 'palm' && fingerBendPhase[fn] === 'idle') {
        for (const m of fingerMeshes[fn]) {
          if (m.material === bodyMat || m.material === jointMat) {
            m.material.emissive = new THREE.Color(0x111122);
          }
        }
        canvas.style.cursor = 'pointer';
      } else {
        canvas.style.cursor = isDragging ? 'grabbing' : 'grab';
      }
    } else {
      canvas.style.cursor = isDragging ? 'grabbing' : 'grab';
    }
  });

  /* ---- 手指弯曲动画 ---- */
  function triggerFingerBend(name) {
    fingerBendPhase[name] = 'bending';
    fingerBendTimer[name] = 0;
    // 目标：加压时用 40%，不加压时用 100%
    const factor = isPressurized ? 0.40 : 1.0;
    fingerTarget[name] = fingerMaxAngles[name].map(a => a * factor);
    updateFingerInfo(name);
  }

  function updateFingerInfo(name) {
    const maxAngs = fingerMaxAngles[name];
    const curAngs = fingerCurrent[name];
    const names = {
      index: '食指', middle: '中指', ring: '无名指', pinky: '小指', thumb: '拇指'
    };
    const jointNames = name === 'thumb'
      ? ['CMC', 'MCP', 'IP']
      : ['MCP', 'PIP', 'DIP'];
    let txt = names[name] + '：';
    for (let i = 0; i < maxAngs.length; i++) {
      const deg = Math.round(curAngs[i] * 180 / Math.PI);
      txt += ' ' + jointNames[i] + ' ' + deg + '°';
      if (i < maxAngs.length - 1) txt += ' |';
    }
    fingerInfo.textContent = txt;
  }

  /* ---- 加压/泄压切换 ---- */
  let isPressurized = false;
  btnToggle.addEventListener('click', () => {
    isPressurized = !isPressurized;
    if (isPressurized) {
      btnToggle.textContent = '泄压';
      btnToggle.classList.add('pressurized');
      document.getElementById('val-pressure').textContent = GLOVE_PSI.toFixed(1) + ' psi';
      document.getElementById('val-force').textContent = Math.round(FORCE_TOTAL) + ' 磅';
      const s0 = document.getElementById('step-0');
      const s1 = document.getElementById('step-1');
      s0.style.background = 'var(--color-surface)';
      s0.style.borderColor = 'var(--color-border-light)';
      s0.style.fontWeight = '400';
      s0.style.opacity = '0.5';
      s1.style.background = 'var(--color-accent-light)';
      s1.style.borderColor = 'var(--color-accent)';
      s1.style.fontWeight = '600';
      s1.style.opacity = '1';
    } else {
      btnToggle.textContent = '切换加压';
      btnToggle.classList.remove('pressurized');
      document.getElementById('val-pressure').textContent = '0 psi';
      document.getElementById('val-force').textContent = '0 磅';
      const s0 = document.getElementById('step-0');
      const s1 = document.getElementById('step-1');
      s0.style.background = 'var(--color-accent-light)';
      s0.style.borderColor = 'var(--color-accent)';
      s0.style.fontWeight = '600';
      s0.style.opacity = '1';
      s1.style.background = 'transparent';
      s1.style.borderColor = 'var(--color-border)';
      s1.style.fontWeight = '400';
      s1.style.opacity = '1';
    }
    // 切换时所有手指回弹
    for (const name of Object.keys(fingerMaxAngles)) {
      if (fingerBendPhase[name] === 'idle') {
        fingerBendPhase[name] = 'bending';
        fingerBendTimer[name] = 0;
        const factor = isPressurized ? 0.40 : 1.0;
        fingerTarget[name] = fingerMaxAngles[name].map(a => a * factor * 0.85);
        // 短暂弯曲后回弹
        setTimeout(() => {
          if (fingerBendPhase[name] === 'bending' || fingerBendPhase[name] === 'holding') {
            fingerTarget[name] = fingerMaxAngles[name].map(() => 0.15);
          }
        }, 500);
      }
    }
    fingerInfo.textContent = '';
  });

  // 空格键切换
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      btnToggle.click();
    }
  });

  /* ---- 动画循环 ---- */
  const clock = new THREE.Clock();

  Deck.loop((dt) => {
    // 限制 dt 避免大跳帧
    const delta = Math.min(dt || clock.getDelta(), 0.1);

    // 更新手指弯曲动画
    for (const name of Object.keys(fingerMaxAngles)) {
      const phase = fingerBendPhase[name];
      if (phase === 'idle') continue;

      fingerBendTimer[name] += delta;

      if (phase === 'bending') {
        // 弯曲阶段：0.5s
        const t = Math.min(fingerBendTimer[name] / 0.5, 1);
        const ease = 1 - Math.pow(1 - t, 3); // ease-out
        for (let i = 0; i < fingerCurrent[name].length; i++) {
          const start = fingerCurrent[name][i];
          fingerCurrent[name][i] = start + (fingerTarget[name][i] - start) * ease;
        }
        if (t >= 1) {
          fingerBendPhase[name] = 'holding';
          fingerBendTimer[name] = 0;
        }
      } else if (phase === 'holding') {
        // 保持 0.4s
        if (fingerBendTimer[name] > 0.4) {
          fingerBendPhase[name] = 'returning';
          fingerBendTimer[name] = 0;
          fingerTarget[name] = fingerMaxAngles[name].map(() => 0.15);
        }
      } else if (phase === 'returning') {
        // 回弹 0.6s
        const t = Math.min(fingerBendTimer[name] / 0.6, 1);
        const ease = 1 - Math.pow(1 - t, 3);
        for (let i = 0; i < fingerCurrent[name].length; i++) {
          const start = fingerCurrent[name][i];
          fingerCurrent[name][i] = start + (fingerTarget[name][i] - start) * ease;
        }
        if (t >= 1) {
          fingerBendPhase[name] = 'idle';
          fingerBendTimer[name] = 0;
          fingerInfo.textContent = '';
        }
      }

      // 应用角度到 pivot
      const pivots = fingerPivots[name];
      const curAngs = fingerCurrent[name];
      for (let i = 0; i < pivots.length; i++) {
        pivots[i].group.rotation.x = curAngs[i];
      }
    }

    renderer.render(scene, camera);
  }, { still: 0 });

  // 初始显示
  document.getElementById('val-pressure').textContent = '0 psi';
  document.getElementById('val-force').textContent = '0 磅';

})();
</script>
</body>
</html>
