<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: var(--header-h);
    padding-bottom: var(--footer-h);
    height: 100%;
  }
  .wrap {
    width: 100%;
    padding: 0 var(--sp-2xl);
  }
  .k-generalization {
    padding: 0;
  }
  .k-generalization .claim {
    font-size: var(--fs-h1);
    font-weight: 700;
    padding: var(--sp-xl) var(--sp-xl) var(--sp-xl) 56px;
    margin-bottom: var(--sp-2xl);
    line-height: var(--lh-tight);
  }
  .k-generalization .supports {
    display: flex;
    flex-direction: row;
    gap: var(--sp-xl);
    margin-left: 0;
    border-left: none;
    padding-left: 0;
  }
  .k-generalization .support {
    flex: 1;
    padding: var(--sp-2xl);
    background: var(--color-surface);
    border: 1px solid var(--color-border-light);
    border-radius: 6px;
    position: static;
    text-align: center;
    font-size: var(--fs-body);
    line-height: var(--lh-normal);
  }
  .k-generalization .support::before {
    display: none;
  }
  .k-generalization .support strong {
    font-size: var(--fs-h2);
    font-weight: 700;
    display: block;
    margin-bottom: var(--sp-md);
    color: var(--text);
  }
  .closing {
    margin-top: var(--sp-2xl);
    font-size: var(--fs-h2);
    font-weight: 400;
    line-height: var(--lh-normal);
    color: var(--color-dim);
    text-align: center;
  }
</style>
</head>
<body data-page="25" data-total="40">
<div id="stage">
<main id="main">
  <div class="wrap">
    <div class="k-generalization">
      <div class="claim">
        前几章外包了手、声音、皮肤，这一章外包的是认知本身。
      </div>
      <div class="supports">
        <div class="support"><strong>记忆外包</strong> 大脑的存储容量有限，但体外存储——从石板到云端——没有上限。</div>
        <div class="support"><strong>计算外包</strong> 大脑算得慢且容易出错，体外计算从算盘到计算机，每一步都在提速。</div>
        <div class="support"><strong>决策外包</strong> 大脑的决策依赖经验和习惯，但算法和模型正在接管越来越多的选择。</div>
      </div>
    </div>
    <p class="closing">当记忆、计算、决策一样一样搬出去，留在颅骨里的还剩什么？</p>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 25,
  kicker: '第四章',
  title: '大脑之外——记忆、计算、决策的迁移',
  take: '大脑是最后一个被外包的器官'
});
</script>
</body>
</html>
