<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== 页面布局 ===== */
#main {
  /* let content flow naturally, .page-split handles its own positioning */
}

.page-split {
  margin: 96px 96px 0 96px;
  height: 616px;
  overflow: hidden;
  display: flex;
  flex-direction: row;
  gap: var(--sp-xl);
}

/* 左侧面板 */
.left-panel {
  flex: 1 1 0;
  min-width: 0;
  height: 616px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* 右侧面板 */
.right-panel {
  flex: 0 0 300px;
  height: 616px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ===== Tab 切换按钮 ===== */
.tab-bar {
  display: flex;
  flex-direction: row;
  gap: 0;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--color-border);
  align-self: flex-start;
  flex-shrink: 0;
}

.tab-btn {
  padding: 5px 18px;
  font-size: var(--fs-label);
  font-weight: 600;
  border: none;
  background: var(--bg);
  color: var(--color-dim);
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: var(--font-sans);
  white-space: nowrap;
}

.tab-btn:not(:last-child) {
  border-right: 1px solid var(--color-border);
}

.tab-btn.active {
  background: var(--color-accent);
  color: #fff;
}

.tab-btn:hover:not(.active) {
  background: var(--color-surface);
}

.tab-btn:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: -2px;
  z-index: 1;
  position: relative;
}

/* ===== 动画区域 ===== */
.anim-area {
  height: 330px;
  flex-shrink: 0;
  position: relative;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.anim-stage {
  display: none;
  width: 100%;
  height: 100%;
  align-items: center;
  justify-content: center;
}

.anim-stage.active {
  display: flex;
}

/* ===== 算盘 Canvas ===== */
#abacus-canvas {
  display: block;
}

/* ===== 笔算竖式 ===== */
.pen-calc {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1px;
  font-family: "Courier New", monospace;
  padding: var(--sp-md);
  position: relative;
}

.pen-row {
  display: flex;
  flex-direction: row;
  gap: 0;
  font-size: 24px;
  letter-spacing: 0.12em;
  line-height: 1.35;
}

.pen-row .digit {
  display: inline-block;
  width: 1.5em;
  text-align: center;
  opacity: 0;
}

.pen-row .digit.visible {
  opacity: 1;
}

.pen-row .digit.highlight {
  color: var(--color-accent);
  font-weight: 700;
}

.pen-line {
  border-top: 2px solid var(--text);
  width: 100%;
  margin: 2px 0;
}

.pen-row.result .digit {
  font-weight: 700;
}

.carry-marks {
  position: absolute;
  top: 2px;
  right: 0;
  display: flex;
  flex-direction: row;
  justify-content: flex-end;
  pointer-events: none;
}

.carry-mark {
  display: inline-block;
  width: 1.5em;
  text-align: center;
  font-size: 15px;
  color: var(--color-warning);
  font-weight: 700;
  opacity: 0;
  transition: opacity 0.3s;
  letter-spacing: 0.12em;
}

.carry-mark.visible {
  opacity: 1;
}

/* ===== 计算器 ===== */
.calc-device {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  background: #2d2d2d;
  border-radius: 12px;
  padding: var(--sp-md);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.calc-display {
  width: 100%;
  background: #1a3a1a;
  color: #4f4;
  font-family: "Courier New", monospace;
  font-size: 26px;
  text-align: right;
  padding: 4px 10px;
  border-radius: 4px;
  letter-spacing: 0.08em;
  min-height: 36px;
  line-height: 36px;
}

.calc-keypad {
  display: grid;
  grid-template-columns: repeat(4, 46px);
  grid-template-rows: repeat(4, 34px);
  gap: 4px;
}

.calc-key {
  font-size: var(--fs-body);
  font-weight: 600;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  background: #4a4a4a;
  color: #eee;
  font-family: var(--font-sans);
  display: flex;
  align-items: center;
  justify-content: center;
}

.calc-key.key-op {
  background: #e68a00;
  color: #fff;
}

.calc-key.key-eq {
  background: #2563eb;
  color: #fff;
}

.calc-key.highlight {
  transform: scale(0.9);
  filter: brightness(1.6);
  box-shadow: 0 0 10px rgba(255,255,255,0.4);
}

/* ===== 重播按钮 ===== */
.replay-row {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--sp-sm);
  flex-shrink: 0;
}

.replay-btn {
  padding: 3px 12px;
  font-size: var(--fs-label);
  border: 1px solid var(--color-border);
  border-radius: 4px;
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  font-family: var(--font-sans);
}

.replay-btn:hover {
  background: var(--color-surface);
  border-color: var(--color-accent);
}

.replay-btn:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

/* ===== 维度对比表 ===== */
.dim-table-wrap {
  flex-shrink: 0;
}

.dim-table-wrap .k-comparison .hdr,
.dim-table-wrap .k-comparison .dim,
.dim-table-wrap .k-comparison .cell {
  padding: 4px 10px;
  font-size: var(--fs-sec);
  line-height: var(--lh-tight);
}

.dim-table-wrap .k-comparison .dim {
  font-size: var(--fs-label);
  font-weight: 600;
}

.k-comparison .col-highlight {
  background: var(--color-accent-light);
  font-weight: 600;
}

/* ===== 大脑负担仪表 ===== */
.gauge-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-md);
  height: 100%;
}

.gauge-title {
  font-size: var(--fs-h2);
  font-weight: 600;
  color: var(--text);
  flex-shrink: 0;
}

.gauge-outer {
  position: relative;
  flex-shrink: 0;
  width: 84px;
  height: 260px;
}

.gauge-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 56px;
  height: 260px;
  border: 2px solid var(--color-border);
  border-radius: 8px;
  background: var(--color-surface);
  overflow: hidden;
}

.gauge-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  border-radius: 0 0 6px 6px;
  background: #ef4444;
}

.gauge-tick {
  position: absolute;
  left: 62px;
  font-size: var(--fs-tick);
  color: var(--color-dim);
  white-space: nowrap;
  transform: translateY(-50%);
  line-height: 1;
}

.gauge-tick-line {
  position: absolute;
  left: 0;
  width: 56px;
  height: 1px;
  background: var(--color-border-light);
  pointer-events: none;
}

.gauge-label {
  font-size: var(--fs-sec);
  color: var(--color-dim);
  text-align: center;
  line-height: var(--lh-normal);
  max-width: 260px;
  flex-shrink: 0;
}

/* ===== 步骤提示 ===== */
.step-hint {
  position: absolute;
  bottom: 6px;
  left: 10px;
  font-size: var(--fs-label);
  color: var(--color-dim);
  z-index: 2;
  background: rgba(255,255,255,0.85);
  padding: 2px 8px;
  border-radius: 4px;
}
</style>
</head>

<script>
(function() {
  // ===== 0. 挂载页眉页脚 =====
  Lec.mount({
    act: '第四章 · 大脑之外',
    title: '算盘·笔算·计算器',
    sub: '计算从手指到木珠到电路，每一步都是一次「不用脑子算」的升级。',
    foot: ''
  });

  var main = document.getElementById('main');

  // ===== 1. 构建 DOM =====
  main.innerHTML = ''
    + '<div class="page-split">'

      + '<div class="left-panel">'
        + '<div class="tab-bar" role="tablist" aria-label="选择计算剖面">'
          + '<button class="tab-btn active" role="tab" aria-selected="true" data-profile="abacus" tabindex="0">算盘</button>'
          + '<button class="tab-btn" role="tab" aria-selected="false" data-profile="pen" tabindex="-1">笔算</button>'
          + '<button class="tab-btn" role="tab" aria-selected="false" data-profile="calc" tabindex="-1">计算器</button>'
        + '</div>'

        + '<div class="anim-area">'
          + '<div class="anim-stage active" data-profile="abacus">'
            + '<canvas id="abacus-canvas"></canvas>'

          + '</div>'
          + '<div class="anim-stage" data-profile="pen">'
            + '<div class="pen-calc" id="pen-calc">'
              + '<div class="carry-marks" id="carry-marks"></div>'
              + '<div class="pen-row" id="pen-row1"><span class="digit">1</span><span class="digit">2</span><span class="digit">3</span></div>'
              + '<div class="pen-row" id="pen-row2"><span class="digit">4</span><span class="digit">5</span><span class="digit">6</span></div>'
              + '<div class="pen-row" id="pen-row3"><span class="digit">+</span><span class="digit">7</span><span class="digit">8</span><span class="digit">9</span></div>'
              + '<div class="pen-line"></div>'
              + '<div class="pen-row result" id="pen-result"><span class="digit">1</span><span class="digit">3</span><span class="digit">6</span><span class="digit">8</span></div>'
            + '</div>'
            + '<div class="step-hint" id="pen-hint"></div>'
          + '</div>'
          + '<div class="anim-stage" data-profile="calc">'
            + '<div class="calc-device">'
              + '<div class="calc-display" id="calc-display">0</div>'
              + '<div class="calc-keypad">'
                + '<button class="calc-key" data-key="1">1</button>'
                + '<button class="calc-key" data-key="2">2</button>'
                + '<button class="calc-key" data-key="3">3</button>'
                + '<button class="calc-key key-op" data-key="+">+</button>'
                + '<button class="calc-key" data-key="4">4</button>'
                + '<button class="calc-key" data-key="5">5</button>'
                + '<button class="calc-key" data-key="6">6</button>'
                + '<button class="calc-key key-op" data-key="+">+</button>'
                + '<button class="calc-key" data-key="7">7</button>'
                + '<button class="calc-key" data-key="8">8</button>'
                + '<button class="calc-key" data-key="9">9</button>'
                + '<button class="calc-key key-eq" data-key="=">=</button>'
              + '</div>'
            + '</div>'
            + '<div class="step-hint" id="calc-hint"></div>'
          + '</div>'
        + '</div>'

        + '<div class="replay-row">'
          + '<button class="replay-btn" id="replay-btn" aria-label="重播当前动画">↻ 重播</button>'
        + '</div>'

        + '<div class="dim-table-wrap">'
          + '<div class="k-comparison" id="dim-table">'
            + '<div class="hdr"></div>'
            + '<div class="hdr col-abacus">算盘</div>'
            + '<div class="hdr col-pen">笔算</div>'
            + '<div class="hdr col-calc">计算器</div>'

            + '<div class="dim">进位规则</div>'
            + '<div class="cell col-abacus">大脑执行</div>'
            + '<div class="cell col-pen">大脑执行，纸辅助记录</div>'
            + '<div class="cell col-calc">电路执行，不可见</div>'

            + '<div class="dim">中间状态存储</div>'
            + '<div class="cell col-abacus">珠位 + 手指</div>'
            + '<div class="cell col-pen">纸面</div>'
            + '<div class="cell col-calc">寄存器</div>'

            + '<div class="dim">工作记忆占用</div>'
            + '<div class="cell col-abacus">高（同时记多位）</div>'
            + '<div class="cell col-pen">中（只记当前位）</div>'
            + '<div class="cell col-calc">无</div>'

            + '<div class="dim">出错后可恢复性</div>'
            + '<div class="cell col-abacus">低（需从头拨）</div>'
            + '<div class="cell col-pen">中（可回溯竖式）</div>'
            + '<div class="cell col-calc">—（不会错，但错了也不知道）</div>'
          + '</div>'
        + '</div>'
      + '</div>'

      + '<div class="right-panel">'
        + '<div class="gauge-section">'
          + '<div class="gauge-title">大脑负担</div>'
          + '<div class="gauge-outer">'
            + '<div class="gauge-container" id="gauge-container">'
              + '<div class="gauge-bar" id="gauge-bar"></div>'
            + '</div>'
            + '<div class="gauge-tick" style="top:15%;">低</div>'
            + '<div class="gauge-tick-line" style="top:15%;"></div>'
            + '<div class="gauge-tick" style="top:50%;">中</div>'
            + '<div class="gauge-tick-line" style="top:50%;"></div>'
            + '<div class="gauge-tick" style="top:85%;">高</div>'
            + '<div class="gauge-tick-line" style="top:85%;"></div>'
          + '</div>'
          + '<div class="gauge-label" id="gauge-label">算盘：进位规则、中间状态、工作记忆全部由大脑承担。</div>'
        + '</div>'
      + '</div>'
    + '</div>';

  // ===== 2. DOM 引用 =====
  var tabBtns = main.querySelectorAll('.tab-btn');
  var animStages = main.querySelectorAll('.anim-stage');
  var abacusCanvas = document.getElementById('abacus-canvas');
  var abacusHint = document.getElementById('abacus-hint');
  var penHint = document.getElementById('pen-hint');
  var calcHint = document.getElementById('calc-hint');
  var gaugeBar = document.getElementById('gauge-bar');
  var gaugeLabel = document.getElementById('gauge-label');
  var replayBtn = document.getElementById('replay-btn');
  var dimTable = document.getElementById('dim-table');

  var currentProfile = 'abacus';
  var animPlaying = false;

  // ===== 3. 算盘 (Canvas) =====
  var abacusCtx = null;
  var abacusW = 0, abacusH = 0;

  var ABACUS = {
    cols: 4,
    colLabels: ['千', '百', '十', '个'],
    colX: [],
    state: [[0,0],[0,0],[0,0],[0,0]]
  };

  function abacusValueToBeads(v) {
    return [Math.floor(v / 5), v % 5];
  }

  function abacusSetup() {
    var rect = abacusCanvas.parentElement.getBoundingClientRect();
    abacusW = Math.min(rect.width - 20, 660);
    abacusH = Math.min(rect.height - 20, 260);
    abacusCanvas.width = abacusW;
    abacusCanvas.height = abacusH;
    abacusCanvas.style.width = abacusW + 'px';
    abacusCanvas.style.height = abacusH + 'px';
    abacusCtx = abacusCanvas.getContext('2d');

    var margin = 60;
    var spacing = (abacusW - margin * 2) / (ABACUS.cols - 1);
    ABACUS.colX = [];
    for (var i = 0; i < ABACUS.cols; i++) {
      ABACUS.colX.push(margin + i * spacing);
    }
  }

  function abacusDraw() {
    var ctx = abacusCtx;
    var w = abacusW, h = abacusH;
    ctx.clearRect(0, 0, w, h);

    var rodTop = 35, rodBot = h - 22, beamY = h * 0.57;

    // 外框
    ctx.strokeStyle = '#5c4033';
    ctx.lineWidth = 3;
    ctx.strokeRect(16, 18, w - 32, h - 38);

    // 横梁
    ctx.fillStyle = '#5c4033';
    ctx.fillRect(16, beamY - 3, w - 32, 6);

    // 竖杆
    for (var i = 0; i < ABACUS.cols; i++) {
      var cx = ABACUS.colX[i];
      ctx.strokeStyle = '#8b7355';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, rodTop);
      ctx.lineTo(cx, rodBot);
      ctx.stroke();
    }

    var beadW = 24, beadH = 14;

    for (var i = 0; i < ABACUS.cols; i++) {
      var cx = ABACUS.colX[i];
      var s = ABACUS.state[i];
      var upperActive = s[0];
      var lowerActive = s[1];

      // 上珠 (2颗)
      for (var j = 0; j < 2; j++) {
        var restY = rodTop + 14 + j * 22;
        var activeY = beamY - 12 - (1 - j) * 18;
        var y = (j < upperActive) ? activeY : restY;
        drawBead(ctx, cx, y, beadW, beadH, (j < upperActive));
      }

      // 下珠 (5颗)
      for (var j = 0; j < 5; j++) {
        var restY = rodBot - 12 - j * 20;
        var activeY = beamY + 12 + j * 16;
        var y = (j < lowerActive) ? activeY : restY;
        drawBead(ctx, cx, y, beadW, beadH, (j < lowerActive));
      }

      // 列标签
      ctx.fillStyle = '#5c4033';
      ctx.font = '12px ' + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = 'center';
      ctx.fillText(ABACUS.colLabels[i], cx, rodBot + 16);
    }
  }

  function drawBead(ctx, cx, cy, bw, bh, active) {
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy, bw/2, bh/2, 0, 0, Math.PI * 2);
    if (active) {
      var grad = ctx.createLinearGradient(cx - bw/2, cy - bh/2, cx + bw/2, cy + bh/2);
      grad.addColorStop(0, '#d4a574');
      grad.addColorStop(0.5, '#f0d5a8');
      grad.addColorStop(1, '#b8860b');
      ctx.fillStyle = grad;
    } else {
      var grad2 = ctx.createLinearGradient(cx - bw/2, cy - bh/2, cx + bw/2, cy + bh/2);
      grad2.addColorStop(0, '#8b7355');
      grad2.addColorStop(0.5, '#a0845c');
      grad2.addColorStop(1, '#6b5340');
      ctx.fillStyle = grad2;
    }
    ctx.fill();
    ctx.strokeStyle = '#5c4033';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(cx - 3, cy - 3, 4, 2.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fill();
    ctx.restore();
  }

  function abacusAnimateTo(targetValues, duration, callback) {
    var startState = ABACUS.state.map(function(s) { return [s[0], s[1]]; });
    var targetBeads = targetValues.map(function(v) { return abacusValueToBeads(v); });
    var startTime = performance.now();

    function step(now) {
      var elapsed = now - startTime;
      var t = Math.min(elapsed / duration, 1.0);
      t = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

      for (var i = 0; i < 4; i++) {
        ABACUS.state[i][0] = startState[i][0] + (targetBeads[i][0] - startState[i][0]) * t;
        ABACUS.state[i][1] = startState[i][1] + (targetBeads[i][1] - startState[i][1]) * t;
      }
      abacusDraw();

      if (t >= 1.0) {
        for (var j = 0; j < 4; j++) {
          ABACUS.state[j][0] = targetBeads[j][0];
          ABACUS.state[j][1] = targetBeads[j][1];
        }
        abacusDraw();
        if (callback) callback();
        return;
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function runAbacusAnimation(callback) {
    var steps = [
      { values: [0, 1, 2, 3], hint: '拨入 123：百位 1、十位 2、个位 3', dur: 1100 },
      { values: [0, 5, 7, 9], hint: '加 456 → 579：满五用上珠替代', dur: 1400 },
      { values: [1, 3, 6, 8], hint: '加 789 → 1368：满十进位，千位进 1', dur: 1800 },
    ];

    var i = 0;
    function next() {
      if (i >= steps.length) {
        abacusHint.textContent = '结果：1368。珠位承载全部中间状态，大脑执行每一次进位。';
        if (callback) callback();
        return;
      }
      abacusHint.textContent = steps[i].hint;
      abacusAnimateTo(steps[i].values, steps[i].dur, function() {
        i++;
        next();
      });
    }
    ABACUS.state = [[0,0],[0,0],[0,0],[0,0]];
    abacusDraw();
    abacusHint.textContent = '准备开始…';
    setTimeout(next, 350);
  }

  // ===== 4. 笔算竖式 =====
  function runPenAnimation(callback) {
    var allDigits = document.querySelectorAll('#pen-calc .digit');
    allDigits.forEach(function(d) { d.classList.remove('visible', 'highlight'); });
    document.getElementById('carry-marks').innerHTML = '';
    penHint.textContent = '准备开始…';

    var tl = anime.timeline({ easing: 'easeInOutQuad' });

    tl.add({
      targets: '#pen-row1 .digit',
      opacity: [0, 1],
      duration: 300,
      delay: anime.stagger(70),
      begin: function() { penHint.textContent = '写出竖式：123 + 456 + 789'; }
    });
    tl.add({
      targets: '#pen-row2 .digit',
      opacity: [0, 1],
      duration: 300,
      delay: anime.stagger(70),
    });
    tl.add({
      targets: '#pen-row3 .digit',
      opacity: [0, 1],
      duration: 300,
      delay: anime.stagger(70),
    });

    tl.add({
      duration: 200,
      begin: function() {
        penHint.textContent = '个位：3+6+9=18，写 8，进 1';
        highlightPenCol(2);
      }
    });
    tl.add({
      duration: 120,
      begin: function() { showCarry(1, '1'); }
    });
    tl.add({
      targets: '#pen-result .digit:nth-child(4)',
      opacity: [0, 1],
      duration: 200,
    });

    tl.add({
      duration: 200,
      begin: function() {
        penHint.textContent = '十位：2+5+8+1=16，写 6，进 1';
        highlightPenCol(1);
      }
    });
    tl.add({
      duration: 120,
      begin: function() { showCarry(0, '1'); }
    });
    tl.add({
      targets: '#pen-result .digit:nth-child(3)',
      opacity: [0, 1],
      duration: 200,
    });

    tl.add({
      duration: 200,
      begin: function() {
        penHint.textContent = '百位：1+4+7+1=13，写 3，进 1';
        highlightPenCol(0);
      }
    });
    tl.add({
      duration: 120,
      begin: function() { showCarry(-1, '1'); }
    });
    tl.add({
      targets: '#pen-result .digit:nth-child(2)',
      opacity: [0, 1],
      duration: 200,
    });

    tl.add({
      duration: 200,
      begin: function() {
        penHint.textContent = '千位：只有进位 1，结果 1368';
        highlightPenCol(-1);
      }
    });
    tl.add({
      targets: '#pen-result .digit:nth-child(1)',
      opacity: [0, 1],
      duration: 300,
      complete: function() {
        penHint.textContent = '结果：1368。纸承担了工作记忆，大脑只需处理当前位。';
        clearHighlights();
        if (callback) callback();
      }
    });
  }

  function highlightPenCol(colIdx) {
    clearHighlights();
    ['#pen-row1', '#pen-row2', '#pen-row3'].forEach(function(row) {
      var digits = document.querySelectorAll(row + ' .digit');
      var targetIdx = (row === '#pen-row3') ? colIdx + 1 : colIdx;
      if (targetIdx >= 0 && targetIdx < digits.length) {
        digits[targetIdx].classList.add('highlight');
      }
    });
    var resultDigits = document.querySelectorAll('#pen-result .digit');
    var resultIdx = colIdx < 0 ? 0 : colIdx + 1;
    if (resultIdx >= 0 && resultIdx < resultDigits.length) {
      resultDigits[resultIdx].classList.add('highlight');
    }
  }

  function clearHighlights() {
    document.querySelectorAll('#pen-calc .digit.highlight').forEach(function(d) {
      d.classList.remove('highlight');
    });
  }

  function showCarry(colIdx, text) {
    var marks = document.getElementById('carry-marks');
    var span = document.createElement('span');
    span.className = 'carry-mark';
    span.textContent = text;
    marks.appendChild(span);
    requestAnimationFrame(function() { span.classList.add('visible'); });
  }

  // ===== 5. 计算器 =====
  function runCalcAnimation(callback) {
    var display = document.getElementById('calc-display');
    document.querySelectorAll('.calc-key').forEach(function(k) { k.classList.remove('highlight'); });
    display.textContent = '0';
    calcHint.textContent = '准备开始…';

    var seq = ['1','2','3','+','4','5','6','+','7','8','9','='];
    var i = 0;
    var currentInput = '';
    var accumulator = 0;

    function nextKey() {
      if (i >= seq.length) {
        calcHint.textContent = '结果：1368。电路吞掉了全部计算过程，你只看到结果。';
        if (callback) callback();
        return;
      }
      var key = seq[i];
      var btn = document.querySelector('.calc-key[data-key="' + key + '"]');
      if (btn) {
        btn.classList.add('highlight');
        setTimeout(function() { btn.classList.remove('highlight'); }, 220);
      }
      if (key === '+') {
        if (currentInput !== '') accumulator += parseInt(currentInput, 10);
        currentInput = '';
        display.textContent = accumulator;
        calcHint.textContent = '按 +：累加 ' + accumulator;
      } else if (key === '=') {
        if (currentInput !== '') accumulator += parseInt(currentInput, 10);
        display.textContent = accumulator;
        calcHint.textContent = '按 =：显示最终结果 ' + accumulator;
      } else {
        currentInput += key;
        display.textContent = currentInput;
        calcHint.textContent = '按 ' + key + '：输入数字';
      }
      i++;
      setTimeout(nextKey, 440);
    }

    accumulator = 0;
    currentInput = '';
    display.textContent = '0';
    setTimeout(nextKey, 350);
  }

  // ===== 6. 仪表动画 =====
  var GAUGE_DATA = {
    abacus: { height: '85%', color: '#ef4444', label: '算盘：进位规则、中间状态、工作记忆全部由大脑承担。' },
    pen:    { height: '50%', color: '#f59e0b', label: '笔算：进位规则仍由大脑执行，但中间结果写在纸上，工作记忆负担减半。' },
    calc:   { height: '10%', color: '#3b82f6', label: '计算器：全由电路处理。进位、存储、结果——大脑什么都不用管。' }
  };

  function animateGauge(profile) {
    var d = GAUGE_DATA[profile];
    gsap.to(gaugeBar, {
      height: d.height,
      backgroundColor: d.color,
      duration: 0.7,
      ease: 'power2.out',
      overwrite: true
    });
    gaugeLabel.textContent = d.label;
  }

  function highlightDimCol(profile) {
    dimTable.querySelectorAll('.col-highlight').forEach(function(el) {
      el.classList.remove('col-highlight');
    });
    dimTable.querySelectorAll('.col-' + profile).forEach(function(el) {
      el.classList.add('col-highlight');
    });
  }

  // ===== 7. 切换剖面 =====
  function switchProfile(profile) {
    if (currentProfile === profile && animPlaying) return;
    currentProfile = profile;

    animPlaying = false;

    tabBtns.forEach(function(btn) {
      var isActive = btn.getAttribute('data-profile') === profile;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
      btn.setAttribute('tabindex', isActive ? '0' : '-1');
    });

    animStages.forEach(function(stage) {
      stage.classList.toggle('active', stage.getAttribute('data-profile') === profile);
    });

    animateGauge(profile);
    highlightDimCol(profile);

    if (profile === 'abacus') {
      abacusSetup();
      ABACUS.state = [[0,0],[0,0],[0,0],[0,0]];
      abacusDraw();
      abacusHint.textContent = '';
      animPlaying = true;
      runAbacusAnimation(function() { animPlaying = false; });
    } else if (profile === 'pen') {
      penHint.textContent = '';
      animPlaying = true;
      runPenAnimation(function() { animPlaying = false; });
    } else if (profile === 'calc') {
      calcHint.textContent = '';
      animPlaying = true;
      runCalcAnimation(function() { animPlaying = false; });
    }
  }

  // ===== 8. 事件绑定 =====
  tabBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      switchProfile(btn.getAttribute('data-profile'));
    });
    btn.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        var next = btn.nextElementSibling;
        if (next) { next.click(); next.focus(); }
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        var prev = btn.previousElementSibling;
        if (prev) { prev.click(); prev.focus(); }
      }
    });
  });

  replayBtn.addEventListener('click', function() {
    switchProfile(currentProfile);
  });

  // ===== 9. 初始化 =====
  abacusSetup();
  ABACUS.state = [[0,0],[0,0],[0,0],[0,0]];
  abacusDraw();
  animateGauge('abacus');
  highlightDimCol('abacus');
  animPlaying = true;
  runAbacusAnimation(function() { animPlaying = false; });

})();
</script>
</body>
</html>
