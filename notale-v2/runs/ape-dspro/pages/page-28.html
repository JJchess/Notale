<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== Page 28: Decision Tree ===== */

#main {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  padding: var(--sp-lg) var(--sp-xl) var(--sp-md);
  box-sizing: border-box;
  gap: var(--sp-md);
}

/* Top row: stats + tree */
.tree-row {
  display: flex;
  flex-direction: row;
  gap: var(--sp-lg);
  flex: 5 1 auto;
  min-height: 0;
}

.tree-spacer {
  flex: 1 1 auto;
  min-height: 0;
}

/* Statistics panel */
.stats-panel {
  flex-shrink: 0;
  width: 240px;
  display: flex;
  flex-direction: column;
  gap: var(--sp-sm);
  padding-top: var(--sp-xs);
}

.stat-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border-light);
  border-radius: 6px;
  padding: var(--sp-sm) var(--sp-md);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.stat-card.habit { border-left: 3px solid #7B8FA1; }
.stat-card.calc  { border-left: 3px solid #6B7280; }
.stat-card.pct   { border-left: 3px solid var(--color-accent); }

.stat-label {
  font-size: var(--fs-label);
  color: var(--color-dim);
  line-height: var(--lh-tight);
}

.stat-value {
  font-size: var(--fs-h2);
  font-weight: 700;
  line-height: var(--lh-tight);
  color: var(--text);
}

.stat-card.habit .stat-value { color: #5A6E80; }
.stat-card.calc .stat-value  { color: #4B5563; }
.stat-card.pct .stat-value   { color: var(--color-accent); }

.stat-note {
  font-size: var(--fs-tick);
  color: var(--color-dim);
  line-height: 1.3;
}

/* Tree container */
.tree-container {
  flex: 1 1 auto;
  min-width: 0;
  position: relative;
  background: var(--color-surface);
  border: 1px solid var(--color-border-light);
  border-radius: 8px;
}

.tree-stage-wrap {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
}

/* DOM node labels — positioned to the side of nodes */
.node-label {
  position: absolute;
  font-size: var(--fs-label);
  font-weight: 500;
  line-height: 1.2;
  pointer-events: none;
  text-align: center;
  white-space: nowrap;
  color: #1e1e1e;
  z-index: 10;
  text-shadow: 0 0 4px rgba(255,255,255,0.9);
}

.node-label.trigger  { color: #B86B1A; font-weight: 600; }
.node-label.habit    { color: #4A5E70; }
.node-label.calc     { color: #374151; }
.node-label.terminal { color: #2D6A4F; font-weight: 600; }

/* Edge labels — small, on the edge itself */
.edge-label {
  position: absolute;
  font-size: 12px;
  color: #6B7280;
  font-weight: 400;
  line-height: 1.2;
  pointer-events: none;
  text-align: center;
  white-space: nowrap;
  z-index: 9;
  text-shadow: 0 0 3px rgba(255,255,255,0.85);
}

/* Proximity arc label */
.arc-label {
  position: absolute;
  font-size: var(--fs-tick);
  color: var(--color-accent);
  font-weight: 500;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s;
  white-space: nowrap;
  text-align: center;
  z-index: 11;
  text-shadow: 0 0 4px rgba(255,255,255,0.9);
}

.arc-label.visible { opacity: 1; }

/* Bottom statements */
.statements-row {
  flex-shrink: 0;
  display: flex;
  flex-direction: row;
  gap: var(--sp-md);
  padding-top: var(--sp-xs);
  border-top: 1px solid var(--color-border-light);
}

.statement {
  flex: 1;
  font-size: var(--fs-sec);
  line-height: var(--lh-normal);
  color: var(--text);
  padding: var(--sp-sm) var(--sp-md) var(--sp-sm) var(--sp-lg);
  background: var(--color-surface);
  border-radius: 6px;
  border-left: 3px solid var(--color-border);
  position: relative;
}

.statement .stmt-num {
  position: absolute;
  top: -8px;
  left: -8px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--color-accent);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

/* Source footnote */
.source-note {
  flex-shrink: 0;
  font-size: 12px;
  color: var(--color-dim);
  opacity: 0.45;
  text-align: right;
  line-height: 1.2;
}
</style>
</head>
<body data-page="28" data-total="40">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lib/konva.min.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  'use strict';

  /* ===== Lec.mount ===== */
  Lec.mount({
    act: '第四章 · 大脑之外',
    title: '决策外包',
    sub: '日常决策中，大部分靠习惯，少部分靠计算。习惯是外包给身体的决策。',
    foot: 'Wood, Quinn & Kashy, 2002, JPSP'
  });

  /* ===== Data ===== */
  var nodes = [
    { id: 'n-hungry',       label: '饿了',         type: 'trigger',    x: 525, y: 40,  side: 'top' },
    { id: 'n-habit',        label: '习惯接管',     type: 'habit-gate', x: 180, y: 125, side: 'left' },
    { id: 'n-calc',         label: '想一想',       type: 'calc-gate',  x: 870, y: 125, side: 'right' },
    { id: 'n-habit-food',   label: '吃常吃的',     type: 'habit',      x: 180, y: 210, side: 'left' },
    { id: 'n-what-avail',   label: '有什么可吃',   type: 'calc',       x: 870, y: 210, side: 'right' },
    { id: 'n-filter-time',  label: '时间够吗',     type: 'calc',       x: 700, y: 295, side: 'left' },
    { id: 'n-filter-money', label: '预算够吗',     type: 'calc',       x: 870, y: 295, side: 'right' },
    { id: 'n-filter-health',label: '今天健康吗',   type: 'calc',       x: 1020, y: 295, side: 'right' },
    { id: 'n-compare',      label: '比一比',       type: 'calc',       x: 870, y: 368, side: 'right' },
    { id: 'n-decide',       label: '就这个',       type: 'calc',       x: 870, y: 425, side: 'right' },
    { id: 'n-eat',          label: '吃',           type: 'terminal',   x: 525, y: 438, side: 'bottom' }
  ];

  var edges = [
    { from: 'n-hungry', to: 'n-habit',       type: 'habit', label: '和上次一样就好' },
    { from: 'n-hungry', to: 'n-calc',        type: 'calc',  label: '这次不一样' },
    { from: 'n-habit',  to: 'n-habit-food',  type: 'habit', label: '' },
    { from: 'n-habit-food', to: 'n-eat',     type: 'habit', label: '' },
    { from: 'n-calc',   to: 'n-what-avail',  type: 'calc',  label: '列出选项' },
    { from: 'n-what-avail', to: 'n-filter-time',   type: 'calc', label: '筛时间' },
    { from: 'n-what-avail', to: 'n-filter-money',  type: 'calc', label: '筛预算' },
    { from: 'n-what-avail', to: 'n-filter-health', type: 'calc', label: '筛健康' },
    { from: 'n-filter-time',   to: 'n-compare', type: 'calc', label: '通过' },
    { from: 'n-filter-money',  to: 'n-compare', type: 'calc', label: '' },
    { from: 'n-filter-health', to: 'n-compare', type: 'calc', label: '' },
    { from: 'n-compare', to: 'n-decide',    type: 'calc',  label: '选出最优' },
    { from: 'n-decide', to: 'n-eat',        type: 'calc',  label: '' }
  ];

  var nodeMap = {};
  nodes.forEach(function(n) { nodeMap[n.id] = n; });

  /* ===== Build DOM ===== */
  var main = document.getElementById('main');

  var treeRow = document.createElement('div');
  treeRow.className = 'tree-row';

  // Stats panel
  var statsPanel = document.createElement('div');
  statsPanel.className = 'stats-panel';

  function makeStatCard(cls, label, value, note) {
    var card = document.createElement('div');
    card.className = 'stat-card ' + cls;
    var lbl = document.createElement('span');
    lbl.className = 'stat-label';
    lbl.textContent = label;
    var val = document.createElement('span');
    val.className = 'stat-value';
    val.textContent = value;
    card.appendChild(lbl);
    card.appendChild(val);
    if (note) {
      var n = document.createElement('span');
      n.className = 'stat-note';
      n.textContent = note;
      card.appendChild(n);
    }
    return card;
  }

  statsPanel.appendChild(makeStatCard('habit', '习惯路径', '3 步', '饿了 → 习惯接管 → 吃常吃的 → 吃'));
  statsPanel.appendChild(makeStatCard('calc', '计算路径', '7 步', '饿了 → 想一想 → 有什么可吃 → 三个筛选 → 比一比 → 就这个 → 吃'));
  statsPanel.appendChild(makeStatCard('pct', '日常习惯占比', '~95%', '仅约 5% 的决策经过完整计算'));

  treeRow.appendChild(statsPanel);

  // Tree container
  var treeContainer = document.createElement('div');
  treeContainer.className = 'tree-container';
  var treeStageWrap = document.createElement('div');
  treeStageWrap.className = 'tree-stage-wrap';
  treeStageWrap.id = 'tree-stage-wrap';
  treeContainer.appendChild(treeStageWrap);
  treeRow.appendChild(treeContainer);

  main.appendChild(treeRow);

  // Statements
  var statementsRow = document.createElement('div');
  statementsRow.className = 'statements-row';

  var stmts = [
    '你每天做的大部分决定，不是「想」出来的，是身体替你做的。',
    '习惯路径短、快、不费力气——代价是它不挑，上次吃的什么，这次还是什么。',
    '计算路径长、慢、消耗能量——但面对新情况时能选出更好的答案。习惯是重复把计算沉下去的产物。'
  ];

  stmts.forEach(function(txt, i) {
    var stmt = document.createElement('div');
    stmt.className = 'statement';
    var num = document.createElement('span');
    num.className = 'stmt-num';
    num.textContent = (i + 1);
    stmt.appendChild(num);
    stmt.appendChild(document.createTextNode(txt));
    statementsRow.appendChild(stmt);
  });

  main.appendChild(statementsRow);

  // Source
  var srcNote = document.createElement('div');
  srcNote.className = 'source-note';
  srcNote.textContent = '来源: Wood, Quinn & Kashy, 2002, Journal of Personality and Social Psychology';
  main.appendChild(srcNote);

  // Spacer to push content up and reduce density
  var spacer = document.createElement('div');
  spacer.className = 'tree-spacer';
  main.appendChild(spacer);

  /* ===== Konva Setup ===== */
  var stageWrap = document.getElementById('tree-stage-wrap');

  function getStageSize() {
    return { w: stageWrap.clientWidth, h: stageWrap.clientHeight };
  }

  var size = getStageSize();
  var stage = new Konva.Stage({
    container: 'tree-stage-wrap',
    width: size.w,
    height: size.h
  });

  var edgeLayer = new Konva.Layer();
  var nodeLayer = new Konva.Layer();
  var arcLayer = new Konva.Layer();
  stage.add(edgeLayer);
  stage.add(nodeLayer);
  stage.add(arcLayer);

  /* ===== Node helpers ===== */
  function nodeColor(type) {
    switch(type) {
      case 'trigger':    return '#E88D2A';
      case 'habit-gate':
      case 'habit':      return '#7B8FA1';
      case 'calc-gate':
      case 'calc':       return '#D1D5DB';
      case 'terminal':   return '#4A9E6B';
      default:           return '#9CA3AF';
    }
  }

  function nodeStroke(type) {
    switch(type) {
      case 'trigger':    return '#B86B1A';
      case 'habit-gate': return '#5A6E80';
      case 'habit':      return '#5A6E80';
      case 'calc-gate':  return '#6B7280';
      case 'calc':       return '#9CA3AF';
      case 'terminal':   return '#2D6A4F';
      default:           return '#6B7280';
    }
  }

  function nodeRadius(type) {
    switch(type) {
      case 'trigger':    return 28;
      case 'habit-gate':
      case 'calc-gate':  return 24;
      case 'terminal':   return 26;
      default:           return 22;
    }
  }

  function edgeColor(type) {
    return type === 'habit' ? '#7B8FA1' : '#9CA3AF';
  }

  /* ===== Get label position relative to node ===== */
  function labelPos(n) {
    var r = nodeRadius(n.type);
    var gap = 10;
    switch (n.side) {
      case 'top':    return { x: n.x, y: n.y - r - gap, tx: 'translate(-50%, -100%)' };
      case 'left':   return { x: n.x - r - gap, y: n.y, tx: 'translate(-100%, -50%)' };
      case 'right':  return { x: n.x + r + gap, y: n.y, tx: 'translate(0, -50%)' };
      case 'bottom': return { x: n.x, y: n.y + r + gap, tx: 'translate(-50%, 0)' };
      default:       return { x: n.x, y: n.y + r + gap, tx: 'translate(-50%, 0)' };
    }
  }

  /* ===== Draw edges ===== */
  edges.forEach(function(e) {
    var from = nodeMap[e.from];
    var to = nodeMap[e.to];

    var line = new Konva.Line({
      points: [from.x, from.y, to.x, to.y],
      stroke: edgeColor(e.type),
      strokeWidth: e.type === 'habit' ? 2.5 : 1.8,
      dash: e.type === 'calc' ? [8, 5] : [],
      lineCap: 'round',
      hitStrokeWidth: 10,
      listening: false
    });

    // Arrow head
    var arrowLen = 10;
    var dx = to.x - from.x;
    var dy = to.y - from.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 0.01) {
      var ux = dx / dist;
      var uy = dy / dist;
      var r = nodeRadius(to.type);
      var tipX = to.x - ux * r;
      var tipY = to.y - uy * r;
      var perpX = -uy;
      var perpY = ux;
      var arrow = new Konva.Line({
        points: [
          tipX, tipY,
          tipX - ux * arrowLen + perpX * 5, tipY - uy * arrowLen + perpY * 5,
          tipX - ux * arrowLen - perpX * 5, tipY - uy * arrowLen - perpY * 5
        ],
        closed: true,
        fill: edgeColor(e.type),
        stroke: edgeColor(e.type),
        strokeWidth: 1,
        listening: false
      });
      edgeLayer.add(arrow);
      e._arrow = arrow;
    }

    edgeLayer.add(line);
    e._line = line;

    // Edge label via DOM
    if (e.label) {
      var midX = (from.x + to.x) / 2;
      var midY = (from.y + to.y) / 2;
      var ndx = to.x - from.x;
      var ndy = to.y - from.y;
      var ndist = Math.sqrt(ndx * ndx + ndy * ndy);
      var offX = 0, offY = 0;
      if (ndist > 0.01) {
        offX = -(ndy / ndist) * 22;
        offY = (ndx / ndist) * 22;
      }
      var elbl = document.createElement('div');
      elbl.className = 'edge-label';
      elbl.textContent = e.label;
      elbl.style.left = (midX + offX) + 'px';
      elbl.style.top = (midY + offY) + 'px';
      elbl.style.transform = 'translate(-50%, -50%)';
      stageWrap.appendChild(elbl);
      e._domLabel = elbl;
    }
  });

  /* ===== Draw nodes ===== */
  var nodeCircles = {};
  var domLabels = {};

  nodes.forEach(function(n) {
    var r = nodeRadius(n.type);
    var lp = labelPos(n);

    var circle = new Konva.Circle({
      x: n.x,
      y: n.y,
      radius: r,
      fill: nodeColor(n.type),
      stroke: nodeStroke(n.type),
      strokeWidth: 2.5,
      shadowColor: 'rgba(0,0,0,0.12)',
      shadowBlur: 6,
      shadowOffsetY: 2,
      draggable: true
    });

    circle.on('dragmove', function() { onNodeDrag(n); });
    circle.on('dragend', function() { onNodeDragEnd(n); });

    nodeLayer.add(circle);
    nodeCircles[n.id] = circle;
    n._circle = circle;

    // DOM label
    var lbl = document.createElement('div');
    lbl.className = 'node-label ' +
      (n.type === 'trigger' ? 'trigger' :
       n.type === 'terminal' ? 'terminal' :
       n.type.indexOf('habit') === 0 ? 'habit' : 'calc');
    lbl.textContent = n.label;
    lbl.style.left = lp.x + 'px';
    lbl.style.top = lp.y + 'px';
    lbl.style.transform = lp.tx;
    stageWrap.appendChild(lbl);
    domLabels[n.id] = lbl;
    n._domLabel = lbl;
    n._labelPos = lp;
  });

  /* ===== Proximity arc ===== */
  var proximityArc = new Konva.Line({
    points: [0, 0, 0, 0],
    stroke: 'rgba(37, 99, 235, 0.35)',
    strokeWidth: 2,
    dash: [4, 4],
    tension: 0.4,
    listening: false,
    visible: false
  });
  arcLayer.add(proximityArc);

  var arcLabelDom = document.createElement('div');
  arcLabelDom.className = 'arc-label';
  arcLabelDom.textContent = '重复之后，计算沉成习惯';
  arcLabelDom.style.transform = 'translate(-50%, -100%)';
  stageWrap.appendChild(arcLabelDom);

  /* ===== Drag handlers ===== */
  function onNodeDrag(n) {
    var circle = n._circle;
    var r = nodeRadius(n.type);
    n.x = circle.x();
    n.y = circle.y();

    // Update connected edges
    edges.forEach(function(e) {
      var line = e._line;
      var arrow = e._arrow;
      var from = nodeMap[e.from];
      var to = nodeMap[e.to];
      var pts = [from.x, from.y, to.x, to.y];
      line.points(pts);

      if (arrow) {
        var dx = to.x - from.x;
        var dy = to.y - from.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 0.01) {
          var ux = dx / dist;
          var uy = dy / dist;
          var tr = nodeRadius(to.type);
          var tipX = to.x - ux * tr;
          var tipY = to.y - uy * tr;
          var arrowLen = 10;
          var perpX = -uy;
          var perpY = ux;
          arrow.points([
            tipX, tipY,
            tipX - ux * arrowLen + perpX * 5, tipY - uy * arrowLen + perpY * 5,
            tipX - ux * arrowLen - perpX * 5, tipY - uy * arrowLen - perpY * 5
          ]);
        }
      }

      // Update edge DOM label
      var elbl = e._domLabel;
      if (elbl) {
        var midX = (from.x + to.x) / 2;
        var midY = (from.y + to.y) / 2;
        var ndx = to.x - from.x;
        var ndy = to.y - from.y;
        var ndist = Math.sqrt(ndx * ndx + ndy * ndy);
        if (ndist > 0.01) {
          var offX = -(ndy / ndist) * 22;
          var offY = (ndx / ndist) * 22;
          elbl.style.left = (midX + offX) + 'px';
          elbl.style.top = (midY + offY) + 'px';
        }
      }
    });

    // Update own DOM label
    var domLbl = n._domLabel;
    if (domLbl) {
      var lp = labelPos(n);
      domLbl.style.left = lp.x + 'px';
      domLbl.style.top = lp.y + 'px';
      domLbl.style.transform = lp.tx;
    }

    checkProximity();
  }

  function onNodeDragEnd(n) {
    proximityArc.visible(false);
    arcLabelDom.classList.remove('visible');
    arcLayer.batchDraw();
  }

  function checkProximity() {
    var hf = nodeMap['n-habit-food'];
    var calc = nodeMap['n-calc'];
    var dx = hf.x - calc.x;
    var dy = hf.y - calc.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var threshold = 170;

    if (dist < threshold) {
      proximityArc.points([hf.x, hf.y, calc.x, calc.y]);
      proximityArc.visible(true);

      var midX = (hf.x + calc.x) / 2;
      var midY = (hf.y + calc.y) / 2;
      arcLabelDom.style.left = midX + 'px';
      arcLabelDom.style.top = (midY - 20) + 'px';
      arcLabelDom.classList.add('visible');
      arcLayer.batchDraw();
    } else {
      proximityArc.visible(false);
      arcLabelDom.classList.remove('visible');
      arcLayer.batchDraw();
    }
  }

  /* ===== Resize ===== */
  function resizeStage() {
    var sz = getStageSize();
    stage.width(sz.w);
    stage.height(sz.h);
  }

  Deck.onResize(function() { resizeStage(); });

  /* ===== Initial draw ===== */
  edgeLayer.draw();
  nodeLayer.draw();
  arcLayer.draw();
  resizeStage();

})();
</script>
</body>
</html>
