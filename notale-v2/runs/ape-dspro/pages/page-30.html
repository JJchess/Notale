<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== 本页布局 ===== */
#main {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100%;
}

.triptych-wrapper {
  width: 1408px;
  max-width: 100%;
}

/* --- 三栏头部 --- */
.triptych-headers {
  display: flex;
  gap: 24px;
  margin-bottom: var(--sp-sm);
}
.triptych-headers .dim-spacer {
  width: 140px;
  flex-shrink: 0;
}
.col-header {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-sm);
  cursor: pointer;
  padding: var(--sp-sm) var(--sp-xs);
  border-radius: 6px;
  transition: background 0.25s, opacity 0.35s;
  user-select: none;
  -webkit-user-select: none;
}
.col-header:hover {
  background: var(--color-surface);
}
.col-header:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
.col-header .col-illus {
  width: 100%;
  height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.col-header .col-illus img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  display: block;
}
.col-header .col-title {
  font-size: var(--fs-h2);
  font-weight: 600;
  color: var(--text);
  line-height: var(--lh-tight);
}

/* 高亮与降级 */
.col-header.active {
  background: var(--color-accent-light);
}
.col-header.dimmed,
.tcell.dimmed,
.hippo-cell.dimmed {
  opacity: 0.3;
  transition: opacity 0.35s;
}

/* --- 比较网格 --- */
.triptych-grid {
  display: grid;
  grid-template-columns: 140px 1fr 1fr 1fr;
  gap: 0 24px;
  width: 100%;
}
.triptych-grid .tdim {
  text-align: right;
  font-weight: 600;
  font-size: var(--fs-sec);
  padding: var(--sp-sm) var(--sp-md);
  color: var(--text);
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  border-bottom: 1px solid var(--color-border-light);
  min-height: 52px;
  box-sizing: border-box;
}
.triptych-grid .tcell {
  font-size: var(--fs-sec);
  padding: var(--sp-sm) var(--sp-md);
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--color-border-light);
  min-height: 52px;
  line-height: var(--lh-tight);
  box-sizing: border-box;
  transition: opacity 0.35s;
}

/* --- 海马体收束行 --- */
.hippo-row {
  display: flex;
  gap: 24px;
  padding: var(--sp-md) 0;
  border-top: 2px solid var(--color-border);
  margin-top: var(--sp-sm);
}
.hippo-row .hippo-label {
  width: 140px;
  flex-shrink: 0;
  font-size: var(--fs-sec);
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: var(--sp-md);
  line-height: var(--lh-tight);
}
.hippo-cell {
  flex: 1;
  font-size: var(--fs-body);
  font-weight: 600;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 64px;
  line-height: var(--lh-tight);
  transition: opacity 0.35s;
}

/* 海马体行内的高亮 */
.hippo-cell.high {
  color: var(--color-success);
}
.hippo-cell.mid {
  color: var(--color-warning);
}
.hippo-cell.low {
  color: var(--color-dim);
}
</style>
</head>
<body data-page="30" data-total="40">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
/* ===== 挂载页眉 ===== */
Lec.mount({
  index: 30,
  kicker: 'COGNITION',
  title: '跟着箭头走',
  take: '导航外包后，大脑里负责空间记忆的海马体活跃度下降——你不再需要知道你在哪，只需要跟着箭头走。'
});

/* ===== 构建页面内容 ===== */
(function() {
  var main = document.getElementById('main');

  /* —— 维度数据 —— */
  var dims = [
    { label: '信息储存位置', cells: [
      '海马体与顶叶皮层——在脑子里',
      '纸面——在体外，需眼睛和手配合',
      '服务器和手机缓存——你连翻都不用翻'
    ]},
    { label: '空间关系的建立方式', cells: [
      '脑中生成认知地图：地标、转向、距离三者整合',
      '俯瞰视角看到全局，自己把路线从图上读出来',
      '箭头告诉你下一步，不需知道全局'
    ]},
    { label: '大脑在做的事', cells: [
      '路径整合、地标编码、方位更新',
      '视觉搜索、图形旋转、路径规划',
      '刺激-反应：看到箭头→转向'
    ]},
    { label: '出错时的表现', cells: [
      '走错后能回溯，脑中有拓扑关系',
      '走错后重新定位，找到当前位置重规划',
      '走错后等待重算——你不知道自己在哪'
    ]},
    { label: '习得后能否迁移', cells: [
      '会认一个城市后，学另一个更快——能力在脑子里',
      '会用一种地图后，换一种也能读——技能在手上',
      '换 App 只需下载——能力在服务端'
    ]},
    { label: '身体参与', cells: [
      '全身：前庭感受转向，本体感觉感受距离，视觉确认地标',
      '眼睛和手：读图、跟线、抬头对照现实',
      '眼睛和一根手指：看屏幕，滑一下，点开始'
    ]}
  ];

  /* —— 构建 DOM —— */
  var wrapper = document.createElement('div');
  wrapper.className = 'triptych-wrapper';

  /* 三栏头部 */
  var headers = document.createElement('div');
  headers.className = 'triptych-headers';

  var spacer = document.createElement('div');
  spacer.className = 'dim-spacer';
  headers.appendChild(spacer);

  var colLabels = ['人记路线', '纸质地图', '手机导航'];
  var colImgs = [
    'assets/img/p30-brain.png',
    'assets/img/p30-map.png',
    'assets/img/p30-nav.png'
  ];
  var colHeaders = [];

  for (var c = 0; c < 3; c++) {
    var hdr = document.createElement('div');
    hdr.className = 'col-header';
    hdr.setAttribute('data-col', c);
    hdr.setAttribute('tabindex', '0');
    hdr.setAttribute('role', 'button');
    hdr.setAttribute('aria-pressed', c === 0 ? 'true' : 'false');

    var illus = document.createElement('div');
    illus.className = 'col-illus';
    var img = document.createElement('img');
    img.src = colImgs[c];
    img.alt = '';
    illus.appendChild(img);
    hdr.appendChild(illus);

    var title = document.createElement('div');
    title.className = 'col-title';
    title.textContent = colLabels[c];
    hdr.appendChild(title);

    headers.appendChild(hdr);
    colHeaders.push(hdr);
  }
  wrapper.appendChild(headers);

  /* 比较网格 */
  var grid = document.createElement('div');
  grid.className = 'triptych-grid';

  for (var r = 0; r < dims.length; r++) {
    var dim = document.createElement('div');
    dim.className = 'tdim';
    dim.textContent = dims[r].label;
    grid.appendChild(dim);

    for (var c = 0; c < 3; c++) {
      var cell = document.createElement('div');
      cell.className = 'tcell';
      cell.setAttribute('data-col', c);
      cell.textContent = dims[r].cells[c];
      grid.appendChild(cell);
    }
  }
  wrapper.appendChild(grid);

  /* 海马体收束行 */
  var hippo = document.createElement('div');
  hippo.className = 'hippo-row';
  hippo.id = 'hippo-row';

  var hlbl = document.createElement('div');
  hlbl.className = 'hippo-label';
  hlbl.textContent = '海马体活跃度（空间记忆任务中）';
  hippo.appendChild(hlbl);

  var hippoValues = ['高', '中', '低'];
  var hippoClasses = ['high', 'mid', 'low'];
  for (var c = 0; c < 3; c++) {
    var hc = document.createElement('div');
    hc.className = 'hippo-cell ' + hippoClasses[c];
    hc.setAttribute('data-col', c);
    hc.textContent = hippoValues[c];
    hippo.appendChild(hc);
  }
  wrapper.appendChild(hippo);

  main.appendChild(wrapper);

  /* ===== 交互: 点击栏头高亮 ===== */
  var activeCol = 0; // 初始高亮第一栏

  function setActive(colIdx) {
    activeCol = colIdx;

    // 栏头
    for (var c = 0; c < 3; c++) {
      colHeaders[c].classList.remove('active', 'dimmed');
      colHeaders[c].setAttribute('aria-pressed', 'false');
    }
    colHeaders[colIdx].classList.add('active');
    colHeaders[colIdx].setAttribute('aria-pressed', 'true');

    // 网格单元格
    var cells = grid.querySelectorAll('.tcell');
    for (var i = 0; i < cells.length; i++) {
      cells[i].classList.remove('dimmed');
    }
    var otherCells = grid.querySelectorAll('.tcell[data-col]:not([data-col="' + colIdx + '"])');
    for (var j = 0; j < otherCells.length; j++) {
      otherCells[j].classList.add('dimmed');
    }

    // 海马体行
    var hCells = hippo.querySelectorAll('.hippo-cell');
    for (var k = 0; k < hCells.length; k++) {
      hCells[k].classList.remove('dimmed');
    }
    var otherH = hippo.querySelectorAll('.hippo-cell:not([data-col="' + colIdx + '"])');
    for (var m = 0; m < otherH.length; m++) {
      otherH[m].classList.add('dimmed');
    }
  }

  function clearActive() {
    activeCol = -1;
    for (var c = 0; c < 3; c++) {
      colHeaders[c].classList.remove('active', 'dimmed');
      colHeaders[c].setAttribute('aria-pressed', 'false');
    }
    var allCells = grid.querySelectorAll('.tcell');
    for (var i = 0; i < allCells.length; i++) {
      allCells[i].classList.remove('dimmed');
    }
    var allH = hippo.querySelectorAll('.hippo-cell');
    for (var j = 0; j < allH.length; j++) {
      allH[j].classList.remove('dimmed');
    }
  }

  for (var c = 0; c < 3; c++) {
    (function(idx) {
      colHeaders[idx].addEventListener('click', function() {
        if (activeCol === idx) {
          clearActive();
        } else {
          setActive(idx);
        }
      });
      colHeaders[idx].addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          if (activeCol === idx) {
            clearActive();
          } else {
            setActive(idx);
          }
        }
      });
    })(c);
  }

  /* ===== GSAP 入场动画 ===== */
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reducedMotion) {
    // 即时显示所有内容
    gsap.set('.col-header', { opacity: 1, y: 0 });
    gsap.set('.tdim', { opacity: 1 });
    gsap.set('.tcell', { opacity: 1, y: 0 });
    gsap.set('#hippo-row', { opacity: 1, y: 0 });
    // 初始高亮
    setActive(0);
  } else {
    // 初始隐藏
    gsap.set('.col-header', { opacity: 0, y: 16 });
    gsap.set('.tdim', { opacity: 0 });
    gsap.set('.tcell', { opacity: 0, y: 16 });
    gsap.set('#hippo-row', { opacity: 0, y: 8 });

    var tl = gsap.timeline({
      defaults: { duration: 0.5, ease: 'power2.out' },
      onComplete: function() {
        setActive(0);
      }
    });

    // 维度标签先出现
    tl.to('.tdim', { opacity: 1, duration: 0.3 }, 0);

    // 三栏依次入场
    tl.to('[data-col="0"]', { opacity: 1, y: 0 }, 0);
    tl.to('[data-col="1"]', { opacity: 1, y: 0 }, 0.3);
    tl.to('[data-col="2"]', { opacity: 1, y: 0 }, 0.6);

    // 海马体行延迟 0.5s 后淡入
    tl.to('#hippo-row', { opacity: 1, y: 0, duration: 0.6 }, '+=0.5');
  }

})();
</script>
</body>
</html>
