<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== Page 31: 认知外包清单 ===== */

#main {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 1408px;
  max-width: 1408px;
  margin: 0 auto;
  height: 620px;
  justify-content: flex-start;
  padding: var(--sp-md) var(--sp-xl) 0;
  box-sizing: border-box;
}

/* Guide text */
.guide {
  font-size: var(--fs-lead);
  line-height: var(--lh-normal);
  color: var(--text);
  text-align: center;
  margin: 0 0 var(--sp-xs);
  max-width: 680px;
  flex-shrink: 0;
}

/* Reveal button */
.reveal-btn {
  font-size: var(--fs-label);
  padding: var(--sp-xs) var(--sp-lg);
  border: 1px solid var(--color-accent);
  border-radius: 6px;
  background: var(--bg);
  color: var(--color-accent);
  cursor: pointer;
  font-family: var(--font-sans);
  transition: background 0.2s, color 0.2s;
  margin-bottom: var(--sp-sm);
  flex-shrink: 0;
}
.reveal-btn:hover {
  background: var(--color-accent);
  color: #fff;
}
.reveal-btn:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
.reveal-btn.done {
  display: none;
}

/* Two-column container — always visible as skeleton */
.checklist-columns {
  display: flex;
  flex-direction: row;
  width: 100%;
  flex: 1;
  min-height: 0;
}

/* Left column: 已外包 */
.col-left {
  flex: 0 0 55%;
  display: flex;
  flex-direction: column;
  padding-right: var(--sp-lg);
  min-width: 0;
}

/* Right column: 尚未外包 */
.col-right {
  flex: 0 0 40%;
  display: flex;
  flex-direction: column;
  padding-left: var(--sp-lg);
  min-width: 0;
}

/* Divider */
.divider-col {
  flex: 0 0 5%;
  display: flex;
  justify-content: center;
  align-items: stretch;
}
.divider-line {
  width: 1px;
  background: linear-gradient(
    to bottom,
    var(--color-accent) 0%,
    var(--color-accent) 12%,
    var(--color-border) 45%,
    var(--color-border-light) 100%
  );
}

/* Column headers */
.col-header {
  font-size: var(--fs-h2);
  font-weight: 600;
  line-height: var(--lh-tight);
  margin-bottom: var(--sp-xs);
  padding-bottom: var(--sp-xs);
  border-bottom: 2px solid var(--color-border);
  flex-shrink: 0;
}
.col-left .col-header {
  color: var(--color-accent);
}
.col-right .col-header {
  color: var(--color-dim);
}

/* Items container */
.items {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

/* Individual item — ghost state initially */
.checklist-item {
  padding: 1px 0;
  opacity: 0.18;
  transition: opacity 0.4s ease;
  cursor: default;
  flex-shrink: 0;
}
.checklist-item.revealed {
  opacity: 1;
}

/* Separator between items */
.checklist-item + .checklist-item {
  border-top: 1px solid var(--color-border-light);
}

/* Left items are clickable */
.col-left .checklist-item {
  cursor: pointer;
  border-radius: 4px;
  padding: 1px var(--sp-sm);
  margin: 0 calc(-1 * var(--sp-sm));
  transition: opacity 0.4s ease, background 0.2s;
}
.col-left .checklist-item.revealed:hover {
  background: var(--color-accent-light);
}
.col-left .checklist-item.revealed:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: -2px;
}

/* Right items: more spacing to feel emptier */
.col-right .checklist-item {
  padding: 3px 0;
}

/* Function name */
.item-name {
  font-size: var(--fs-body);
  font-weight: 600;
  line-height: var(--lh-tight);
  color: var(--text);
}

/* Carrier / location line */
.item-carrier {
  font-size: var(--fs-sec);
  line-height: var(--lh-tight);
  color: var(--color-dim);
}

/* Cost hint line */
.item-cost {
  font-size: var(--fs-label);
  line-height: var(--lh-tight);
  color: var(--color-dim);
  font-style: italic;
  transition: color 0.3s ease, background 0.3s ease;
}

/* Cost hint highlight (left items only) */
.col-left .item-cost.highlight {
  color: var(--color-accent);
  font-style: normal;
  font-weight: 500;
  background: var(--color-accent-light);
  padding: 1px 4px;
  border-radius: 2px;
  margin-left: -4px;
  margin-right: -4px;
}

/* Right item flicker */
@keyframes flicker {
  0%, 100% { opacity: 1; }
  25% { opacity: 0.35; }
  50% { opacity: 1; }
  75% { opacity: 0.45; }
}
.checklist-item.flicker {
  animation: flicker 0.6s ease-in-out 3;
}

/* Closing sentences */
.closing {
  width: 100%;
  text-align: center;
  display: none;
  flex-shrink: 0;
  padding: var(--sp-md) 0 var(--sp-xs);
}
.closing.visible {
  display: block;
}
.closing-main {
  font-size: var(--fs-body);
  line-height: var(--lh-normal);
  color: var(--text);
  font-weight: 500;
  margin: 0;
}
.closing-sub {
  font-size: var(--fs-label);
  line-height: var(--lh-tight);
  color: var(--color-dim);
  margin: var(--sp-xs) 0 0;
  font-style: italic;
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  .checklist-item {
    transition: opacity 0.05s ease;
  }
  .checklist-item.flicker {
    animation: none;
  }
}
</style>
</head>
<body data-page="31" data-total="40">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  var main = document.getElementById('main');

  // Mount header/footer. Keys: act, title, sub, foot.
  Lec.mount({
    act: '第四章：大脑之外',
    title: '认知外包清单'
  });

  // Data
  var leftItems = [
    { name: '记忆', carrier: '笔记、硬盘、云端', cost: '你自己能记住几个电话号码？' },
    { name: '计算', carrier: '算盘、计算器、计算机', cost: '两位数乘两位数，你还会笔算吗？' },
    { name: '导航', carrier: '纸质地图、GPS、手机导航', cost: '海马体活跃度下降。你不认路了。' },
    { name: '决策', carrier: '推荐算法、评分系统', cost: '「猜你喜欢」替你做了选择。' },
    { name: '社交', carrier: '朋友圈、点赞、转发', cost: '面对面交谈时，你在看手机。' },
    { name: '写作', carrier: '文字处理器的拼写检查、语法纠错', cost: '手写一封信，你会写错几个字？' },
    { name: '时间感知', carrier: '钟表、日历提醒、倒计时', cost: '不看手机，你能准确估计过了几分钟吗？' }
  ];

  var rightItems = [
    { name: '意识', carrier: '全脑，无单一定位', cost: '我们还不知道意识是什么。' },
    { name: '创造力', carrier: '前额叶与默认模式网络的交互', cost: '把两个无关的东西连在一起——AI 做得来，但不知道为什么要连。' },
    { name: '情感理解', carrier: '边缘系统、岛叶', cost: '你哭的时候，手机不会递纸巾。' },
    { name: '直觉', carrier: '基底神经节、小脑', cost: '学了十年开车，刹车时你不需要想。' },
    { name: '身体感知', carrier: '本体感觉、前庭系统', cost: '闭上眼睛，你知道自己的手指在哪。' }
  ];

  // Related pairs: left index → right index
  var related = { 0: 0, 1: 3, 2: 4, 3: 1, 4: 2, 5: 1, 6: 3 };

  // Build DOM
  main.innerHTML = '';

  // Guide text
  var guide = document.createElement('p');
  guide.className = 'guide';
  guide.textContent = '下面这张清单，逐项盘点：哪些认知功能已经不在你脑子里了，哪些还在。';
  main.appendChild(guide);

  // Reveal button
  var btn = document.createElement('button');
  btn.className = 'reveal-btn';
  btn.textContent = '展开清单';
  btn.setAttribute('aria-label', '展开认知外包清单');
  main.appendChild(btn);

  // Columns container — always visible
  var cols = document.createElement('div');
  cols.className = 'checklist-columns';
  main.appendChild(cols);

  // ---- Left column ----
  var colLeft = document.createElement('div');
  colLeft.className = 'col-left';
  cols.appendChild(colLeft);

  var leftHeader = document.createElement('div');
  leftHeader.className = 'col-header';
  leftHeader.textContent = '已外包';
  colLeft.appendChild(leftHeader);

  var leftItemsContainer = document.createElement('div');
  leftItemsContainer.className = 'items';
  colLeft.appendChild(leftItemsContainer);

  var leftItemEls = [];
  leftItems.forEach(function(item) {
    var el = document.createElement('div');
    el.className = 'checklist-item';
    el.setAttribute('tabindex', '0');
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', item.name + '——' + item.carrier);

    var nameEl = document.createElement('div');
    nameEl.className = 'item-name';
    nameEl.textContent = item.name;
    el.appendChild(nameEl);

    var carrierEl = document.createElement('div');
    carrierEl.className = 'item-carrier';
    carrierEl.textContent = item.carrier;
    el.appendChild(carrierEl);

    var costEl = document.createElement('div');
    costEl.className = 'item-cost';
    costEl.textContent = item.cost;
    el.appendChild(costEl);

    leftItemsContainer.appendChild(el);
    leftItemEls.push({ el: el, nameEl: nameEl, carrierEl: carrierEl, costEl: costEl });
  });

  // ---- Divider ----
  var dividerCol = document.createElement('div');
  dividerCol.className = 'divider-col';
  cols.appendChild(dividerCol);

  var dividerLine = document.createElement('div');
  dividerLine.className = 'divider-line';
  dividerCol.appendChild(dividerLine);

  // ---- Right column ----
  var colRight = document.createElement('div');
  colRight.className = 'col-right';
  cols.appendChild(colRight);

  var rightHeader = document.createElement('div');
  rightHeader.className = 'col-header';
  rightHeader.textContent = '尚未外包';
  colRight.appendChild(rightHeader);

  var rightItemsContainer = document.createElement('div');
  rightItemsContainer.className = 'items';
  colRight.appendChild(rightItemsContainer);

  var rightItemEls = [];
  rightItems.forEach(function(item) {
    var el = document.createElement('div');
    el.className = 'checklist-item';
    el.setAttribute('aria-label', item.name + '——' + item.carrier);

    var nameEl = document.createElement('div');
    nameEl.className = 'item-name';
    nameEl.textContent = item.name;
    el.appendChild(nameEl);

    var carrierEl = document.createElement('div');
    carrierEl.className = 'item-carrier';
    carrierEl.textContent = item.carrier;
    el.appendChild(carrierEl);

    var costEl = document.createElement('div');
    costEl.className = 'item-cost';
    costEl.textContent = item.cost;
    el.appendChild(costEl);

    rightItemsContainer.appendChild(el);
    rightItemEls.push({ el: el, nameEl: nameEl, carrierEl: carrierEl, costEl: costEl });
  });

  // ---- Closing sentences ----
  var closing = document.createElement('div');
  closing.className = 'closing';
  main.appendChild(closing);

  var closingMain = document.createElement('p');
  closingMain.className = 'closing-main';
  closingMain.textContent = '外包不是坏事——每一项外包都让你能做更多的事。但清单右列是提醒：你还有一部分自己，留在身体里。';
  closing.appendChild(closingMain);

  var closingSub = document.createElement('p');
  closingSub.className = 'closing-sub';
  closingSub.textContent = '右列会一直这么短吗？那是下一章的事。';
  closing.appendChild(closingSub);

  // ---- Reveal logic ----
  var allLeft = leftItemEls;
  var allRight = rightItemEls;

  var STAGGER = 0.3;    // seconds between items
  var revealed = false;

  function revealItem(itemRefs, globalIndex) {
    var baseTime = globalIndex * STAGGER;
    setTimeout(function() {
      itemRefs.el.classList.add('revealed');
    }, baseTime * 1000);
  }

  function startReveal() {
    if (revealed) return;
    revealed = true;

    // Reveal left column items
    allLeft.forEach(function(refs, i) {
      revealItem(refs, i);
    });

    // Reveal right column items after left is done
    allRight.forEach(function(refs, i) {
      revealItem(refs, allLeft.length + i);
    });

    // Show closing after all items
    var totalItems = allLeft.length + allRight.length;
    var closingTime = totalItems * STAGGER + 0.6;
    setTimeout(function() {
      closing.classList.add('visible');
    }, closingTime * 1000);
  }

  btn.addEventListener('click', function() {
    btn.classList.add('done');
    startReveal();
  });

  // ---- Click interaction on left items ----
  allLeft.forEach(function(refs, i) {
    refs.el.addEventListener('click', function() {
      if (!revealed) return;
      // Highlight cost hint
      refs.costEl.classList.add('highlight');

      // Flicker related right item
      var ri = related[i];
      if (ri !== undefined && allRight[ri]) {
        allRight[ri].el.classList.add('flicker');
        setTimeout(function() {
          allRight[ri].el.classList.remove('flicker');
        }, 3000);
      }

      // Remove highlight after 3s
      setTimeout(function() {
        refs.costEl.classList.remove('highlight');
      }, 3000);
    });

    // Keyboard support
    refs.el.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        refs.el.click();
      }
    });
  });

})();
</script>
</body>
</html>
