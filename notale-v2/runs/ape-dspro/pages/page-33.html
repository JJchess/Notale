<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ── Page 33: 外包的尽头 ── */
  :root {
    --p33-dark: #0c1220;
    --p33-particle: #ffffff;
    --p33-ring: rgba(255,255,255,0.07);
    --p33-ring-active: rgba(255,255,255,0.14);
    --p33-accent: #c9a55c;
    --p33-ghost: rgba(126,184,218,0.25);
  }

  #main {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 620px;
  }

  /* ── Visual section ── */
  .p33-visual {
    position: relative;
    width: 100%;
    height: 460px;
    background: var(--p33-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }

  .p33-particles {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* ── Rings container ── */
  .p33-rings {
    position: relative;
    width: 440px;
    height: 440px;
    flex-shrink: 0;
  }

  .p33-ring {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px solid var(--p33-ring);
    pointer-events: none;
  }

  .p33-r1 { width: 120px; height: 120px; }
  .p33-r2 { width: 190px; height: 190px; }
  .p33-r3 { width: 260px; height: 260px; }
  .p33-r4 { width: 330px; height: 330px; }
  .p33-r5 {
    width: 400px; height: 400px;
    border-color: var(--p33-ghost);
    border-style: dashed;
    border-width: 1px;
  }

  /* ── Body silhouette ── */
  .p33-body {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: var(--p33-accent);
    opacity: 0.9;
    pointer-events: none;
  }

  .p33-body svg {
    display: block;
  }

  /* ── Icon groups ── */
  .p33-icon-group {
    position: absolute;
    left: 50%;
    top: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    pointer-events: none;
  }

  .p33-icon-svg {
    color: rgba(255,255,255,0.85);
    display: block;
  }

  .p33-icon-label {
    font-size: var(--fs-label);
    color: rgba(255,255,255,0.55);
    line-height: 1;
    white-space: nowrap;
    letter-spacing: 0.04em;
  }

  /* Icon positions on rings */
  .p33-ig-hand {
    transform: translate(-50%, calc(-50% - 60px));
  }
  .p33-ig-voice {
    transform: translate(calc(-50% + 95px), -50%);
  }
  .p33-ig-skin {
    transform: translate(-50%, calc(-50% + 130px));
  }
  .p33-ig-brain {
    transform: translate(calc(-50% - 165px), -50%);
  }
  .p33-ig-gravity {
    transform: translate(calc(-50% + 141px), calc(-50% - 141px));
  }

  /* Gravity group ghost */
  .p33-ig-gravity .p33-icon-svg {
    color: rgba(126,184,218,0.5);
  }
  .p33-ig-gravity .p33-icon-label {
    color: rgba(126,184,218,0.4);
  }

  /* ── Text section ── */
  .p33-text {
    width: 100%;
    max-width: 820px;
    padding: var(--sp-md) var(--sp-xl) var(--sp-md);
    flex-shrink: 0;
  }

  /* ── Reduced motion ── */
  @media (prefers-reduced-motion: reduce) {
    .p33-r5 {
      animation: none !important;
    }
  }
</style>
</head>
<body data-page="33" data-total="40">
<div id="stage">
<main id="main">

  <!-- Visual section -->
  <section class="p33-visual">
    <canvas class="p33-particles"></canvas>

    <div class="p33-rings">
      <!-- Rings -->
      <div class="p33-ring p33-r1"></div>
      <div class="p33-ring p33-r2"></div>
      <div class="p33-ring p33-r3"></div>
      <div class="p33-ring p33-r4"></div>
      <div class="p33-ring p33-r5"></div>

      <!-- Body silhouette -->
      <div class="p33-body">
        <svg viewBox="0 0 48 80" width="56" height="93" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="24" cy="10" r="8"/>
          <line x1="24" y1="18" x2="24" y2="44"/>
          <line x1="24" y1="24" x2="10" y2="36"/>
          <line x1="24" y1="24" x2="38" y2="36"/>
          <line x1="24" y1="44" x2="12" y2="72"/>
          <line x1="24" y1="44" x2="36" y2="72"/>
        </svg>
      </div>

      <!-- Hand icon (手) — ring 1, top -->
      <div class="p33-icon-group p33-ig-hand">
        <svg class="p33-icon-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 8V6a3 3 0 0 1 6 0v2"/>
          <path d="M13 8V5a3 3 0 0 1 6 0v9a8 8 0 0 1-8 8h-1a8 8 0 0 1-8-8V8a3 3 0 0 1 6 0v2"/>
          <line x1="7" y1="12" x2="7" y2="18"/>
          <line x1="10" y1="10" x2="10" y2="20"/>
          <line x1="13" y1="12" x2="13" y2="20"/>
        </svg>
        <span class="p33-icon-label">手</span>
      </div>

      <!-- Voice icon (声音) — ring 2, right -->
      <div class="p33-icon-group p33-ig-voice">
        <svg class="p33-icon-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 10v4h3l4 4V6L5 10H2z"/>
          <path d="M15 8a5 5 0 0 1 0 8"/>
          <path d="M18 5a9 9 0 0 1 0 14"/>
        </svg>
        <span class="p33-icon-label">声音</span>
      </div>

      <!-- Skin icon (皮肤) — ring 3, bottom -->
      <div class="p33-icon-group p33-ig-skin">
        <svg class="p33-icon-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        <span class="p33-icon-label">皮肤</span>
      </div>

      <!-- Brain icon (大脑) — ring 4, left -->
      <div class="p33-icon-group p33-ig-brain">
        <svg class="p33-icon-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
          <circle cx="8.5" cy="6.5" r="1" fill="currentColor"/>
          <circle cx="8.5" cy="17.5" r="1" fill="currentColor"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>
          <circle cx="17.5" cy="17.5" r="1" fill="currentColor"/>
        </svg>
        <span class="p33-icon-label">大脑</span>
      </div>

      <!-- Gravity icon (重力) — ring 5, top-right, ghost -->
      <div class="p33-icon-group p33-ig-gravity">
        <svg class="p33-icon-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <ellipse cx="12" cy="12" rx="5" ry="9"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <path d="M12 3a15 15 0 0 1 0 18"/>
        </svg>
        <span class="p33-icon-label">重力</span>
      </div>
    </div>
  </section>

  <!-- Text section -->
  <section class="p33-text">
    <div class="k-generalization">
      <div class="claim">手、声音、皮肤、大脑——四层外包完成之后，身体还是身体。它还需要重力，需要空气，需要一颗能踩的地面。</div>
      <div class="supports">
        <div class="support">外包的最后一层，是身体本身。那是第五章要讲的事。</div>
      </div>
    </div>
  </section>

</main>
</div>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
(function() {
  'use strict';

  // ── Lec.mount ──
  Lec.mount({
    index: 33,
    kicker: '第四章收束',
    title: '外包的尽头',
    take: '大脑之外——身体本身是最后一道边界'
  });

  // ── Particle system ──
  const canvas = document.querySelector('.p33-particles');
  if (canvas) {
    const ctx = Deck.fit(canvas);

    const rng = new Math.seedrandom('page-33');
    const W = 1600;
    const H = 460;
    const count = 36;

    const particles = [];
    for (let i = 0; i < count; i++) {
      particles.push({
        x: rng() * W,
        y: rng() * H,
        vx: (rng() - 0.5) * 0.35,
        vy: (rng() - 0.5) * 0.35 - 0.12,
        size: rng() * 2.2 + 0.8,
        alpha: rng() * 0.28 + 0.08
      });
    }

    Deck.loop(function(dt) {
      var clamped = Math.min(dt, 0.1);
      ctx.clearRect(0, 0, W, H);

      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += p.vx * clamped * 60;
        p.y += p.vy * clamped * 60;

        if (p.x < -20) p.x = W + 20;
        if (p.x > W + 20) p.x = -20;
        if (p.y < -20) p.y = H + 20;
        if (p.y > H + 20) p.y = -20;

        ctx.fillStyle = Deck.rgba('--p33-particle', p.alpha);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }

  // ── GSAP entrance animation ──
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (prefersReduced) {
    // Show everything immediately
    gsap.set([
      '.p33-body',
      '.p33-r1', '.p33-r2', '.p33-r3', '.p33-r4',
      '.p33-ig-hand', '.p33-ig-voice', '.p33-ig-skin', '.p33-ig-brain',
      '.p33-claim', '.p33-supports'
    ], { autoAlpha: 1 });
    gsap.set('.p33-r5', { autoAlpha: 0.6 });
    gsap.set('.p33-ig-gravity', { autoAlpha: 0.6 });
  } else {
    var tl = gsap.timeline({ defaults: { duration: 0.55, ease: 'power2.out' } });

    // 1. Body silhouette
    tl.fromTo('.p33-body',
      { autoAlpha: 0, scale: 0.75 },
      { autoAlpha: 1, scale: 1, duration: 0.8, ease: 'power3.out' }
    );

    // 2. Hand (ring 1 + icon)
    tl.fromTo('.p33-r1',
      { autoAlpha: 0 },
      { autoAlpha: 0.7, duration: 0.5 },
      '-=0.35'
    );
    tl.fromTo('.p33-ig-hand',
      { autoAlpha: 0, scale: 0.6 },
      { autoAlpha: 1, scale: 1, duration: 0.5 },
      '<'
    );

    // 3. Voice (ring 2 + icon)
    tl.fromTo('.p33-r2',
      { autoAlpha: 0 },
      { autoAlpha: 0.7, duration: 0.5 },
      '-=0.2'
    );
    tl.fromTo('.p33-ig-voice',
      { autoAlpha: 0, scale: 0.6 },
      { autoAlpha: 1, scale: 1, duration: 0.5 },
      '<'
    );

    // 4. Skin (ring 3 + icon)
    tl.fromTo('.p33-r3',
      { autoAlpha: 0 },
      { autoAlpha: 0.7, duration: 0.5 },
      '-=0.2'
    );
    tl.fromTo('.p33-ig-skin',
      { autoAlpha: 0, scale: 0.6 },
      { autoAlpha: 1, scale: 1, duration: 0.5 },
      '<'
    );

    // 5. Brain (ring 4 + icon)
    tl.fromTo('.p33-r4',
      { autoAlpha: 0 },
      { autoAlpha: 0.7, duration: 0.5 },
      '-=0.2'
    );
    tl.fromTo('.p33-ig-brain',
      { autoAlpha: 0, scale: 0.6 },
      { autoAlpha: 1, scale: 1, duration: 0.5 },
      '<'
    );

    // 6. Claim text
    tl.fromTo('.p33-text .claim',
      { autoAlpha: 0, y: 16 },
      { autoAlpha: 1, y: 0, duration: 0.6 },
      '-=0.1'
    );

    // 7. Support text
    tl.fromTo('.p33-text .supports',
      { autoAlpha: 0, y: 10 },
      { autoAlpha: 1, y: 0, duration: 0.5 },
      '-=0.25'
    );

    // 8. Gravity ring + icon — continuous breathing
    tl.fromTo('.p33-r5',
      { autoAlpha: 0, scale: 1.15 },
      { autoAlpha: 0.5, scale: 1, duration: 1.2, ease: 'power2.out' },
      '-=0.4'
    );
    tl.fromTo('.p33-ig-gravity',
      { autoAlpha: 0, scale: 0.5 },
      { autoAlpha: 0.7, scale: 1, duration: 1.2, ease: 'power2.out' },
      '<'
    );

    // Continuous breathing for gravity
    tl.to('.p33-r5', {
      scale: 0.88,
      autoAlpha: 0.3,
      duration: 3.5,
      repeat: -1,
      yoyo: true,
      ease: 'sine.inOut'
    }, '+=0.3');
    tl.to('.p33-ig-gravity', {
      scale: 0.92,
      autoAlpha: 0.45,
      duration: 3.5,
      repeat: -1,
      yoyo: true,
      ease: 'sine.inOut'
    }, '<');
  }
})();
</script>
</body>
</html>
