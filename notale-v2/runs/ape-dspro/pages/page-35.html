<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main {
      position: absolute;
      top: var(--header-h);
      bottom: var(--footer-h);
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      padding: 0 var(--sp-xl);
    }
    #three-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
    }
    #three-wrap canvas {
      display: block;
    }
    .float-panel {
      position: absolute;
      z-index: 5;
      pointer-events: none;
    }
    #bone-panel {
      top: var(--sp-md);
      right: var(--sp-md);
    }
    #muscle-panel {
      top: 100px;
      right: var(--sp-md);
    }
    #info-card {
      position: absolute;
      z-index: 10;
      display: none;
      max-width: 260px;
      pointer-events: auto;
    }
    #info-card .close-btn {
      position: absolute;
      top: 2px;
      right: 6px;
      cursor: pointer;
      background: none;
      border: none;
      font-size: var(--fs-label);
      color: var(--color-dim);
      line-height: 1;
      padding: 2px 4px;
    }
    #info-card .close-btn:hover {
      color: var(--text);
    }
    #info-card .info-body {
      padding-right: 18px;
    }
    /* 提示文字 */
    .hint-rotate {
      position: absolute;
      bottom: var(--sp-sm);
      left: 50%;
      transform: translateX(-50%);
      font-size: var(--fs-label);
      color: var(--color-dim);
      pointer-events: none;
      opacity: 0.8;
      z-index: 3;
    }
  </style>
</head>
<body data-page="35" data-total="40">
  <div id="stage">
    <main id="main">
      <div id="three-wrap">
        <div id="bone-panel" class="panel float-panel">
          <span class="label">骨密度下降</span>
          <span class="value" id="bone-value">0.0%</span>
        </div>
        <div id="muscle-panel" class="panel float-panel">
          <span class="label">肌肉体积减少</span>
          <span class="value text-sec" id="muscle-value">—</span>
        </div>
        <div id="info-card" class="panel">
          <button class="close-btn" aria-label="关闭">✕</button>
          <div class="info-body text-sec" id="info-text"></div>
        </div>
        <div class="hint-rotate" id="hint-rotate">拖拽旋转 · 滚轮缩放</div>
      </div>
      <div class="k-process" style="margin-top:var(--sp-sm);">
        <div class="axis"></div>
        <div class="step" data-from="0" data-to="3">体液重新分布<br><span class="text-tick text-dim">0–3 天</span></div>
        <div class="arw"></div>
        <div class="step" data-from="3" data-to="14">脊柱伸长<br><span class="text-tick text-dim">3–14 天</span></div>
        <div class="arw"></div>
        <div class="step" data-from="14" data-to="180">骨骼钙流失<br><span class="text-tick text-dim">14 天起</span></div>
        <div class="arw"></div>
        <div class="step" data-from="14" data-to="180">肌肉萎缩<br><span class="text-tick text-dim">14 天起</span></div>
      </div>
      <div class="ctl">
        <label for="day-slider">日数</label>
        <input type="range" id="day-slider" min="0" max="180" value="0" step="1">
        <span id="day-label" class="text-tick" style="min-width:5em;text-align:right;">0 天</span>
      </div>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/three.min.js"></script>
  <script src="assets/lib/gsap.min.js"></script>
  <script>
  (function() {
    /* ================================================================
       page-35 · 骨骼与肌肉在失重中
       知识结构: process — 4 个变化事件按时间轴串联
       表征: 全屏 3D 场景，可旋转的半透明人体模型
       ================================================================ */

    /* -- Lec.mount ------------------------------------------------- */
    Lec.mount({
      index: 35,
      kicker: '第五章 · 重力之外',
      title: '骨骼与肌肉在失重中',
      take: '身体是为 1g 重力设计的。失去重力后，体液涌向头部，骨骼每月流失 1.5% 的钙，肌肉因不再对抗重力而逐渐萎缩。'
    });

    /* -- DOM refs -------------------------------------------------- */
    const wrap = document.getElementById('three-wrap');
    const bonePanel = document.getElementById('bone-panel');
    const musclePanel = document.getElementById('muscle-panel');
    const boneValue = document.getElementById('bone-value');
    const muscleValue = document.getElementById('muscle-value');
    const infoCard = document.getElementById('info-card');
    const infoText = document.getElementById('info-text');
    const hintRotate = document.getElementById('hint-rotate');
    const daySlider = document.getElementById('day-slider');
    const dayLabel = document.getElementById('day-label');
    const steps = document.querySelectorAll('.k-process > .step');

    let currentDay = 0;

    /* -- Three.js setup -------------------------------------------- */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a14);
    scene.fog = new THREE.Fog(0x0a0a14, 6, 18);

    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 40);
    camera.position.set(0, 0.15, 4.5);
    camera.lookAt(0, 0.15, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    wrap.appendChild(renderer.domElement);

    const canvas = renderer.domElement;
    canvas.setAttribute('aria-label', '可旋转的 3D 人体模型，展示失重环境下骨骼与肌肉的变化。拖拽旋转视角，滚轮缩放。');
    canvas.style.display = 'block';

    function resizeRenderer() {
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      if (w <= 0 || h <= 0) return;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    resizeRenderer();

    /* -- Lighting -------------------------------------------------- */
    const ambient = new THREE.AmbientLight(0x334466, 1.2);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xffeedd, 5);
    keyLight.position.set(3, 4, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 1024;
    keyLight.shadow.mapSize.height = 1024;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 30;
    keyLight.shadow.camera.left = -5;
    keyLight.shadow.camera.right = 5;
    keyLight.shadow.camera.top = 5;
    keyLight.shadow.camera.bottom = -5;
    keyLight.shadow.bias = -0.0001;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x8899cc, 2);
    fillLight.position.set(-2, 1, -2);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xaaccff, 2.5);
    rimLight.position.set(0, 0.5, -4);
    scene.add(rimLight);

    /* -- Space station environment --------------------------------- */
    const envGroup = new THREE.Group();
    scene.add(envGroup);

    // Module interior: large cylinder segment
    const moduleGeom = new THREE.CylinderGeometry(2.6, 2.6, 4.5, 48, 1, true, 0, Math.PI * 1.6);
    const moduleMat = new THREE.MeshStandardMaterial({
      color: 0x2a2a38,
      roughness: 0.7,
      metalness: 0.4,
      side: THREE.DoubleSide
    });
    const moduleMesh = new THREE.Mesh(moduleGeom, moduleMat);
    moduleMesh.position.y = 0.15;
    moduleMesh.receiveShadow = true;
    envGroup.add(moduleMesh);

    // Panel lines on the module wall
    for (let i = 0; i < 5; i++) {
      const ringGeom = new THREE.TorusGeometry(2.58, 0.008, 8, 64, Math.PI * 1.6);
      const ringMat = new THREE.MeshStandardMaterial({ color: 0x444466, roughness: 0.5, metalness: 0.6 });
      const ring = new THREE.Mesh(ringGeom, ringMat);
      ring.position.y = -1.5 + i * 0.75;
      ring.rotation.y = Math.PI * 0.2;
      envGroup.add(ring);
    }

    // Equipment box hints
    function addPanelBox(x, y, z, w, h, d) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color: 0x3a3a4a, roughness: 0.6, metalness: 0.5 });
      const box = new THREE.Mesh(geo, mat);
      box.position.set(x, y, z);
      box.castShadow = true;
      box.receiveShadow = true;
      envGroup.add(box);
      return box;
    }
    addPanelBox(-2.2, 1.2, 0.8, 0.4, 0.3, 0.15);
    addPanelBox(-2.2, 0.4, 0.8, 0.4, 0.3, 0.15);
    addPanelBox(2.2, -0.3, 0.6, 0.5, 0.25, 0.12);

    /* -- Body model ------------------------------------------------ */
    const bodyRoot = new THREE.Group();
    scene.add(bodyRoot);

    // Materials
    const boneMat = new THREE.MeshStandardMaterial({
      color: 0xf5f0e0,
      roughness: 0.45,
      metalness: 0.05
    });
    const boneMatTransparent = new THREE.MeshStandardMaterial({
      color: 0xf5f0e0,
      roughness: 0.45,
      metalness: 0.05,
      transparent: true,
      opacity: 1.0
    });
    const jointMat = new THREE.MeshStandardMaterial({
      color: 0xf0ead5,
      roughness: 0.4,
      metalness: 0.05
    });
    const muscleMat = new THREE.MeshStandardMaterial({
      color: 0xc47a6a,
      roughness: 0.55,
      metalness: 0.02
    });
    const skinMat = new THREE.MeshPhysicalMaterial({
      color: 0xd4b896,
      roughness: 0.4,
      metalness: 0.02,
      transparent: true,
      opacity: 0.28,
      depthWrite: false,
      clearcoat: 0.1,
      clearcoatRoughness: 0.4
    });

    // All bone meshes (for opacity/color animation)
    const allBoneMeshes = [];
    // All muscle meshes
    const allMuscleMeshes = [];

    // Helper: create a bone (cylinder)
    function addBone(parent, y, height, radius, material) {
      const geo = new THREE.CylinderGeometry(radius, radius, height, 16);
      const mesh = new THREE.Mesh(geo, material || boneMat);
      mesh.position.y = y;
      mesh.castShadow = true;
      parent.add(mesh);
      if (material === boneMat || material === boneMatTransparent || material === jointMat) {
        allBoneMeshes.push(mesh);
      }
      return mesh;
    }

    // Helper: create a joint (sphere)
    function addJoint(parent, y, radius, material) {
      const geo = new THREE.SphereGeometry(radius, 16, 16);
      const mesh = new THREE.Mesh(geo, material || jointMat);
      mesh.position.y = y;
      mesh.castShadow = true;
      parent.add(mesh);
      allBoneMeshes.push(mesh);
      return mesh;
    }

    // Helper: create a muscle (cylinder around bone)
    function addMuscle(parent, y, height, radius, xOffset) {
      const geo = new THREE.CylinderGeometry(radius, radius, height, 16);
      const mesh = new THREE.Mesh(geo, muscleMat);
      mesh.position.set(xOffset || 0, y, 0);
      mesh.castShadow = true;
      parent.add(mesh);
      allMuscleMeshes.push(mesh);
      return mesh;
    }

    // Helper: add skin capsule
    function addSkinCapsule(parent, y, height, radius) {
      const group = new THREE.Group();
      // Cylinder body
      const cylGeo = new THREE.CylinderGeometry(radius, radius, height, 24);
      const cylMesh = new THREE.Mesh(cylGeo, skinMat);
      cylMesh.position.y = y;
      group.add(cylMesh);
      // Top sphere cap
      const topGeo = new THREE.SphereGeometry(radius, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2);
      const topMesh = new THREE.Mesh(topGeo, skinMat);
      topMesh.position.y = y + height / 2;
      group.add(topMesh);
      // Bottom sphere cap
      const botGeo = new THREE.SphereGeometry(radius, 24, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
      const botMesh = new THREE.Mesh(botGeo, skinMat);
      botMesh.position.y = y - height / 2;
      group.add(botMesh);
      parent.add(group);
      return group;
    }

    // -- Spine group (for elongation animation) --
    const spineGroup = new THREE.Group();
    bodyRoot.add(spineGroup);

    // -- Head group (for fluid redistribution) --
    const headGroup = new THREE.Group();
    headGroup.position.y = 0.74;
    spineGroup.add(headGroup);

    // Skull
    const skullGeo = new THREE.SphereGeometry(0.105, 24, 24);
    const skullMesh = new THREE.Mesh(skullGeo, boneMat);
    skullMesh.scale.set(1, 1.15, 0.95);
    skullMesh.castShadow = true;
    headGroup.add(skullMesh);
    allBoneMeshes.push(skullMesh);

    // Jaw
    const jawGeo = new THREE.BoxGeometry(0.14, 0.05, 0.12);
    const jawMesh = new THREE.Mesh(jawGeo, boneMat);
    jawMesh.position.y = -0.09;
    jawMesh.castShadow = true;
    headGroup.add(jawMesh);
    allBoneMeshes.push(jawMesh);

    // Head skin
    addSkinCapsule(headGroup, 0, 0.2, 0.12);

    // Neck bone
    addBone(spineGroup, 0.59, 0.07, 0.025, boneMat);

    // -- Spine --
    const spineSegments = 6;
    const spineStart = 0.52;
    const spineEnd = 0.18;
    const segHeight = (spineStart - spineEnd) / spineSegments;
    for (let i = 0; i < spineSegments; i++) {
      const y = spineStart - i * segHeight - segHeight / 2;
      addBone(spineGroup, y, segHeight * 0.85, 0.028, boneMat);
      addJoint(spineGroup, y + segHeight / 2, 0.03);
    }
    addJoint(spineGroup, spineEnd, 0.03);

    // Ribcage (simplified)
    for (let i = 0; i < 5; i++) {
      const y = 0.48 - i * 0.06;
      const ribGeo = new THREE.TorusGeometry(0.16, 0.015, 8, 16, Math.PI);
      const ribMesh = new THREE.Mesh(ribGeo, boneMat);
      ribMesh.position.y = y;
      ribMesh.rotation.z = Math.PI / 2;
      ribMesh.rotation.y = Math.PI / 2;
      ribMesh.castShadow = true;
      spineGroup.add(ribMesh);
      allBoneMeshes.push(ribMesh);
    }

    // Torso skin
    const torsoGroup = new THREE.Group();
    torsoGroup.position.y = 0.35;
    spineGroup.add(torsoGroup);
    addSkinCapsule(torsoGroup, 0, 0.55, 0.17);

    // -- Pelvis --
    const pelvisGeo = new THREE.BoxGeometry(0.22, 0.08, 0.14);
    const pelvisMesh = new THREE.Mesh(pelvisGeo, boneMat);
    pelvisMesh.position.y = 0.1;
    pelvisMesh.castShadow = true;
    spineGroup.add(pelvisMesh);
    allBoneMeshes.push(pelvisMesh);

    // -- Shoulders --
    addJoint(spineGroup, 0.54, 0.035);
    const shoulderLG = new THREE.Group();
    shoulderLG.position.set(-0.16, 0.54, 0);
    spineGroup.add(shoulderLG);
    addJoint(shoulderLG, 0, 0.03);

    const shoulderRG = new THREE.Group();
    shoulderRG.position.set(0.16, 0.54, 0);
    spineGroup.add(shoulderRG);
    addJoint(shoulderRG, 0, 0.03);

    // -- Arms --
    function buildArm(parent, side) {
      const xOff = side * 0.03;
      // Upper arm bone
      addBone(parent, -0.15, 0.28, 0.026, boneMat);
      addJoint(parent, -0.29, 0.024);
      // Forearm bone
      addBone(parent, -0.42, 0.24, 0.022, boneMat);
      // Hand
      const handGeo = new THREE.BoxGeometry(0.06, 0.05, 0.03);
      const handMesh = new THREE.Mesh(handGeo, boneMat);
      handMesh.position.set(xOff, -0.56, 0.02);
      handMesh.castShadow = true;
      parent.add(handMesh);
      allBoneMeshes.push(handMesh);
      // Biceps muscle
      addMuscle(parent, -0.15, 0.2, 0.04, xOff);
      // Arm skin
      addSkinCapsule(parent, -0.15, 0.28, 0.045);
      addSkinCapsule(parent, -0.42, 0.24, 0.038);
    }
    buildArm(shoulderLG, -1);
    buildArm(shoulderRG, 1);

    // -- Legs --
    function buildLeg(parent, side) {
      const xOff = side * 0.09;
      // Hip joint
      addJoint(parent, 0.08, 0.033);
      // Upper leg bone (femur)
      addBone(parent, -0.12, 0.34, 0.032, boneMat);
      addJoint(parent, -0.30, 0.028);
      // Lower leg bone (tibia)
      addBone(parent, -0.48, 0.32, 0.026, boneMat);
      // Foot
      const footGeo = new THREE.BoxGeometry(0.08, 0.05, 0.1);
      const footMesh = new THREE.Mesh(footGeo, boneMat);
      footMesh.position.set(xOff * 0.3, -0.67, 0.04);
      footMesh.castShadow = true;
      parent.add(footMesh);
      allBoneMeshes.push(footMesh);
      // Thigh muscle
      addMuscle(parent, -0.12, 0.28, 0.05, xOff * 0.4);
      // Calf muscle
      addMuscle(parent, -0.48, 0.24, 0.04, xOff * 0.3);
      // Spinal muscle (lower back)
      if (side === 0) {
        addMuscle(parent, 0.25, 0.3, 0.04, 0);
      }
      // Leg skin
      addSkinCapsule(parent, -0.12, 0.34, 0.06);
      addSkinCapsule(parent, -0.48, 0.32, 0.05);
    }

    const legLG = new THREE.Group();
    legLG.position.set(-0.09, 0, 0);
    spineGroup.add(legLG);
    buildLeg(legLG, -1);

    const legRG = new THREE.Group();
    legRG.position.set(0.09, 0, 0);
    spineGroup.add(legRG);
    buildLeg(legRG, 1);

    // Spinal muscles (along spine)
    for (let i = 0; i < 4; i++) {
      const y = 0.5 - i * 0.08;
      addMuscle(spineGroup, y, 0.06, 0.035, 0);
    }

    // -- Bone joint materials (for opacity animation) --
    // Replace joint materials with transparent versions
    allBoneMeshes.forEach(m => {
      if (m.material === boneMat) {
        m.material = boneMatTransparent;
      }
    });

    /* -- Clickable regions (raycaster targets) ---------------------- */
    const clickableObjects = [];
    // Add all bone meshes
    allBoneMeshes.forEach(m => clickableObjects.push(m));
    // Add all muscle meshes
    allMuscleMeshes.forEach(m => clickableObjects.push(m));

    const raycaster = new THREE.Raycaster();
    raycaster.params.Points.threshold = 0.05;
    raycaster.params.Line = { threshold: 0.05 };

    /* -- Orbit controls (manual) ----------------------------------- */
    let spherical = { theta: -0.35, phi: 1.25, radius: 4.5 };
    let isDragging = false;
    let prevPointer = { x: 0, y: 0 };
    let hasInteracted = false;

    function updateCamera() {
      camera.position.x = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
      camera.position.y = spherical.radius * Math.cos(spherical.phi) + 0.15;
      camera.position.z = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
      camera.lookAt(0, 0.15, 0);
    }
    updateCamera();

    canvas.addEventListener('pointerdown', function(e) {
      isDragging = true;
      prevPointer.x = e.clientX;
      prevPointer.y = e.clientY;
      canvas.setPointerCapture(e.pointerId);
      if (!hasInteracted) {
        hasInteracted = true;
        gsap.to(hintRotate, { opacity: 0, duration: 0.6, ease: 'power2.out' });
      }
    });

    canvas.addEventListener('pointermove', function(e) {
      if (!isDragging) return;
      const dx = e.clientX - prevPointer.x;
      const dy = e.clientY - prevPointer.y;
      spherical.theta -= dx * 0.005;
      spherical.phi -= dy * 0.005;
      spherical.phi = Math.max(0.15, Math.min(Math.PI - 0.15, spherical.phi));
      updateCamera();
      prevPointer.x = e.clientX;
      prevPointer.y = e.clientY;
    });

    canvas.addEventListener('pointerup', function(e) {
      isDragging = false;
    });

    canvas.addEventListener('wheel', function(e) {
      e.preventDefault();
      spherical.radius += e.deltaY * 0.008;
      spherical.radius = Math.max(1.8, Math.min(9, spherical.radius));
      updateCamera();
    }, { passive: false });

    // Click detection for info card
    canvas.addEventListener('click', function(e) {
      if (isDragging) return;
      const rect = canvas.getBoundingClientRect();
      const mx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      const my = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(new THREE.Vector2(mx, my), camera);
      const intersects = raycaster.intersectObjects(clickableObjects, false);
      if (intersects.length > 0) {
        const obj = intersects[0].object;
        const isBone = allBoneMeshes.includes(obj);
        const isMuscle = allMuscleMeshes.includes(obj);
        if (isBone) {
          const pct = currentDay >= 14 ? ((currentDay - 14) * Lec.K.BONE_LOSS / 30).toFixed(1) : '0.0';
          infoText.textContent = '此区域骨骼钙正在流失，每月约 ' + Lec.K.BONE_LOSS + '%。当前累计流失：' + pct + '%';
          showInfoCard(e);
        } else if (isMuscle) {
          const desc = currentDay >= 14 ? '肌肉体积已开始减少' : '肌肉尚未出现明显变化';
          infoText.textContent = desc + '。失去重力对抗后，肌肉不再需要维持原有体积，逐渐萎缩。';
          showInfoCard(e);
        }
      }
    });

    function showInfoCard(e) {
      const rect = wrap.getBoundingClientRect();
      let left = e.clientX - rect.left + 16;
      let top = e.clientY - rect.top - 16;
      if (left + 260 > rect.width) left = rect.width - 270;
      if (top + 100 > rect.height) top = rect.height - 110;
      if (left < 8) left = 8;
      if (top < 8) top = 8;
      infoCard.style.left = left + 'px';
      infoCard.style.top = top + 'px';
      infoCard.style.display = 'flex';
      gsap.fromTo(infoCard, { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.2, ease: 'power2.out' });
    }

    document.getElementById('info-card').querySelector('.close-btn').addEventListener('click', function(e) {
      e.stopPropagation();
      gsap.to(infoCard, { opacity: 0, scale: 0.95, duration: 0.15, ease: 'power2.in', onComplete: function() {
        infoCard.style.display = 'none';
      }});
    });

    /* -- Body update based on day ---------------------------------- */
    function updateBody(day) {
      currentDay = day;

      // 1. Fluid redistribution (day 0-3)
      const fluidT = Math.min(1, Math.max(0, day / 3));
      const headScale = 1 + fluidT * 0.04;
      headGroup.scale.setScalar(headScale);
      // Upper body color shift (slightly redder)
      const redness = fluidT * 0.25;
      skinMat.color.setRGB(0.83 + redness, 0.72 - redness * 0.3, 0.59 - redness * 0.4);

      // 2. Spine elongation (day 3-14)
      const spineT = Math.min(1, Math.max(0, (day - 3) / 11));
      const spineScale = 1 + spineT * 0.035;
      spineGroup.scale.y = spineScale;

      // 3. Bone calcium loss (day 14-180)
      const boneT = Math.min(1, Math.max(0, (day - 14) / 166));
      const boneOpacity = 1 - boneT * 0.55;
      const boneGray = boneT * 0.35;
      allBoneMeshes.forEach(m => {
        if (m.material.transparent !== undefined || m.material === boneMatTransparent) {
          m.material.opacity = boneOpacity;
        }
        m.material.color.setRGB(0.96 - boneGray, 0.94 - boneGray * 0.9, 0.88 - boneGray * 0.7);
      });
      // Update bone density label
      if (day >= 14) {
        const pct = ((day - 14) * Lec.K.BONE_LOSS / 30).toFixed(1);
        boneValue.textContent = pct + '%';
        bonePanel.style.opacity = '1';
      } else {
        boneValue.textContent = '0.0%';
        bonePanel.style.opacity = '0.6';
      }

      // 4. Muscle atrophy (day 14-180)
      const muscleT = Math.min(1, Math.max(0, (day - 14) / 166));
      const muscleScale = 1 - muscleT * 0.22;
      allMuscleMeshes.forEach(m => {
        m.scale.setScalar(muscleScale);
      });
      if (day >= 14) {
        muscleValue.textContent = '进行中';
        musclePanel.style.opacity = '1';
      } else {
        muscleValue.textContent = '—';
        musclePanel.style.opacity = '0.6';
      }

      // Update process steps
      steps.forEach(step => {
        const from = parseInt(step.dataset.from);
        const to = parseInt(step.dataset.to);
        step.classList.remove('active', 'done');
        if (day >= to) {
          step.classList.add('done');
        } else if (day >= from) {
          step.classList.add('active');
        }
      });

      // Update day label
      dayLabel.textContent = day + ' 天';
    }

    // Initialize
    updateBody(0);

    /* -- Slider events --------------------------------------------- */
    daySlider.addEventListener('input', function() {
      updateBody(parseInt(this.value));
    });

    // Keyboard: left/right arrows adjust slider
    daySlider.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight') { this.value = Math.min(180, parseInt(this.value) + 5); updateBody(parseInt(this.value)); e.preventDefault(); }
      if (e.key === 'ArrowLeft') { this.value = Math.max(0, parseInt(this.value) - 5); updateBody(parseInt(this.value)); e.preventDefault(); }
    });

    /* -- GSAP entrance animation ----------------------------------- */
    const entranceTl = gsap.timeline({ defaults: { ease: 'power2.out' } });
    entranceTl.fromTo(camera.position, { x: 0, y: 1.5, z: 8 }, { x: 0, y: 0.15, z: 4.5, duration: 1.6, onUpdate: function() { camera.lookAt(0, 0.15, 0); } }, 0);
    entranceTl.fromTo(bodyRoot.scale, { x: 0.7, y: 0.7, z: 0.7 }, { x: 1, y: 1, z: 1, duration: 1.2, ease: 'power2.out' }, 0.1);
    entranceTl.fromTo(bonePanel, { opacity: 0, y: -12 }, { opacity: 0.6, y: 0, duration: 0.6 }, 0.8);
    entranceTl.fromTo(musclePanel, { opacity: 0, y: -12 }, { opacity: 0.6, y: 0, duration: 0.6 }, 0.9);

    /* -- Render loop ----------------------------------------------- */
    Deck.loop(function() {
      renderer.render(scene, camera);
    });

    /* -- Resize handler -------------------------------------------- */
    window.addEventListener('resize', function() {
      resizeRenderer();
    });

    // Use ResizeObserver for more reliable resize detection
    if (window.ResizeObserver) {
      new ResizeObserver(function() {
        resizeRenderer();
      }).observe(wrap);
    }

  })();
  </script>
</body>
</html>
