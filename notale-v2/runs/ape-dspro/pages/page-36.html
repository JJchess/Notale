<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ---- page-36 custom ---- */
  #main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--sp-md);
    padding: var(--sp-md) var(--sp-xl) 0;
    width: 1408px;
    max-width: 1408px;
    box-sizing: border-box;
  }

  /* split-lr: two side-by-side panels */
  .split-lr {
    display: flex;
    flex-direction: row;
    width: 100%;
    gap: var(--sp-lg);
    flex: 1 1 auto;
  }

  .split-lr > .panel {
    flex: 1 1 50%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 1px solid var(--color-border);
    border-radius: 10px;
    background: var(--color-surface);
    overflow: hidden;
    position: relative;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-sm);
    width: 100%;
    padding: var(--sp-sm) var(--sp-md);
    font-size: var(--fs-h2);
    font-weight: 600;
    line-height: var(--lh-tight);
    border-bottom: 1px solid var(--color-border-light);
    background: var(--bg);
  }

  .panel-header .grav {
    font-size: var(--fs-label);
    color: var(--color-dim);
    font-weight: 400;
    font-variant-numeric: tabular-nums;
  }

  .scene {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: var(--sp-md);
    position: relative;
  }

  .scene svg {
    width: 100%;
    height: auto;
    max-height: 340px;
  }

  /* event-text area */
  .event-text {
    font-size: var(--fs-lead);
    line-height: var(--lh-normal);
    text-align: center;
    color: var(--text);
    min-height: 3em;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 var(--sp-xl);
    max-width: 1100px;
  }

  /* k-process override for this page */
  .k-process {
    width: 100%;
    padding: 0 var(--sp-md);
  }

  .k-process > .step {
    font-size: var(--fs-label);
    padding: var(--sp-xs) var(--sp-sm);
    border-radius: 6px;
  }

  /* button row */
  .btn-row {
    display: flex;
    align-items: center;
    gap: var(--sp-md);
    padding-bottom: var(--sp-sm);
  }

  .btn-advance {
    font-size: var(--fs-body);
    padding: var(--sp-sm) var(--sp-lg);
    border: 2px solid var(--color-accent);
    border-radius: 8px;
    background: var(--color-accent);
    color: #fff;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.15s, transform 0.1s;
  }
  .btn-advance:hover {
    background: #1d4ed8;
  }
  .btn-advance:active {
    transform: scale(0.97);
  }
  .btn-advance:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }

  .hint {
    font-size: var(--fs-label);
    color: var(--color-dim);
  }

  /* comparison table wrapper */
  .comparison-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    background: rgba(255,255,255,0.85);
  }
  .comparison-wrap .k-comparison {
    max-width: 700px;
  }

  /* closing text */
  .closing-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    z-index: 6;
    background: var(--bg);
    padding: var(--sp-2xl);
    text-align: center;
  }

  .closing-text .claim-line {
    font-size: var(--fs-lead);
    font-weight: 600;
    line-height: var(--lh-normal);
    color: var(--text);
    max-width: 800px;
  }

  .closing-text .sub-line {
    font-size: var(--fs-sec);
    color: var(--color-dim);
    line-height: var(--lh-normal);
    margin-top: var(--sp-md);
  }

  /* SVG styles */
  .muscle-highlight {
    transition: opacity 0.3s;
  }
  .body-outline {
    fill: none;
    stroke: var(--text);
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .body-fill {
    fill: var(--color-surface);
    stroke: var(--text);
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .muscle-abs {
    fill: var(--color-accent);
    opacity: 0.35;
  }
  .muscle-oblique {
    fill: var(--color-accent);
    opacity: 0.25;
  }
  .muscle-hip {
    fill: var(--color-warning);
    opacity: 0.45;
  }
  .muscle-arm {
    fill: #7c3aed;
    opacity: 0.4;
  }
  .muscle-back {
    fill: #059669;
    opacity: 0.4;
  }
  .arrow-line {
    stroke: var(--color-accent);
    stroke-width: 2;
    fill: none;
    marker-end: url(#arrowhead);
  }
  .arrow-line-arm {
    stroke: #7c3aed;
    stroke-width: 2;
    fill: none;
    marker-end: url(#arrowhead-arm);
  }

  /* scene relative wrapper for absolute overlays */
  .scene-rel {
    position: relative;
    width: 100%;
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body data-page="36" data-total="40">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(async function() {
  // Mount header/footer
  Lec.mount({
    index: 36,
    kicker: '第五章 · 重力之外',
    title: '动作重写',
    take: '推一下墙，不是站起来——身体的外包到了这个程度，连本能都要重写。'
  });

  const main = document.getElementById('main');

  // ---- Build DOM ----
  const gVal = Lec.K.g.toFixed(1);

  main.innerHTML = `
    <div class="split-area" style="position:relative;width:100%;flex:1 1 auto;display:flex;flex-direction:row;gap:var(--sp-lg);">
      <div class="split-lr" style="width:100%;">
        <!-- Earth panel -->
        <div class="panel" id="earth-panel">
          <div class="panel-header">
            地球 <span class="grav">· 1g</span>
            <span class="grav" style="margin-left:6px;font-size:var(--fs-tick)">${gVal} m/s²</span>
          </div>
          <div class="scene" id="earth-scene">
            ${earthSVG()}
          </div>
        </div>

        <!-- Space panel -->
        <div class="panel" id="space-panel">
          <div class="panel-header">
            空间站 <span class="grav">· ≈0g</span>
          </div>
          <div class="scene" id="space-scene">
            ${spaceSVG()}
          </div>
        </div>
      </div>

      <!-- Overlays at split area level -->
      <div class="comparison-wrap" id="comparison-table">
        <div class="k-comparison">
          <div class="hdr">动作目标</div>
          <div class="hdr">地球上的主要肌肉</div>
          <div class="hdr">空间站上的主要肌肉</div>
          <div class="dim">从躺到坐</div>
          <div class="cell diff">腹直肌、腹斜肌、髋屈肌</div>
          <div class="cell diff">肱三头肌、前臂屈肌、背阔肌</div>
        </div>
      </div>
      <div class="closing-text" id="closing-text">
        <div class="claim-line">本能不是刻在基因里的固定程序，而是身体在特定重力下长期训练出来的条件反射。换一个重力，本能就作废了。</div>
        <div class="sub-line">身体的外包到了这个程度，连本能都要重写。</div>
      </div>
    </div>

    <div class="event-text" id="event-text">点击下方按钮，观察同一个动作意图在两种重力下的不同结果。</div>

    <div class="k-process" id="progress-bar">
      <div class="step active">意图</div>
      <div class="arw"></div>
      <div class="step">地球响应</div>
      <div class="arw"></div>
      <div class="step">空间站响应</div>
      <div class="arw"></div>
      <div class="step">正确方法</div>
      <div class="arw"></div>
      <div class="step">肌肉对比</div>
      <div class="arw"></div>
      <div class="step">本能</div>
    </div>

    <div class="btn-row">
      <button class="btn-advance" id="btn-advance" autofocus>触发动作</button>
      <span class="hint">或按空格键</span>
    </div>
  `;

  // ---- Reference DOM elements ----
  const btn = document.getElementById('btn-advance');
  const eventText = document.getElementById('event-text');
  const progressSteps = document.querySelectorAll('#progress-bar .step');
  const earthPanel = document.getElementById('earth-panel');
  const spacePanel = document.getElementById('space-panel');
  const comparisonTable = document.getElementById('comparison-table');
  const closingText = document.getElementById('closing-text');

  // SVG muscle groups
  const earthMuscles = document.getElementById('earth-muscles');
  const earthArrows = document.getElementById('earth-arrows');
  const spaceCurl = document.getElementById('space-curl');
  const spacePush = document.getElementById('space-push');
  const spacePushArrows = document.getElementById('space-push-arrows');
  const spaceFloatBody = document.getElementById('space-float-body');
  const spaceWall = document.getElementById('space-wall');
  const spaceHandle = document.getElementById('space-handle');
  const spaceBodySeated = document.getElementById('space-body-seated');

  // ---- State ----
  let currentEvent = 0; // 0..5
  const totalEvents = 6;
  const btnLabels = ['触发动作', '下一步', '下一步', '下一步', '对比肌肉', '收束'];
  const eventTexts = [
    '同一个动作意图：「从躺着变成坐着」——在地球上和在空间站上，初始条件已经不同。',
    '腹肌收缩，对抗重力把上半身拉起来。髋屈肌固定下肢，防止腿被带起来。',
    '腹肌收缩，但没有重力对抗——上半身和下半身同时相互靠近。没有「坐起来」，只有「缩起来」。',
    '推一下墙，抓住扶手，把自己拉成坐姿。腹肌是旁观者，手臂才是主角。',
    '同一个目标，两套完全不同的肌肉程序。你在地球上练了一辈子的「坐起来」，到了空间站，每条指令都要重写。',
    '本能不是天生的，是身体在 1g 下练了上百万年的肌肉记忆。换掉重力，本能就作废。'
  ];

  // ---- GSAP helpers ----
  function setProgress(ev) {
    progressSteps.forEach((s, i) => {
      s.classList.remove('active', 'done');
      if (i < ev) s.classList.add('done');
      if (i === ev) s.classList.add('active');
    });
  }

  function advanceTo(ev) {
    if (ev === currentEvent) return;
    currentEvent = ev;
    setProgress(ev);
    btn.textContent = btnLabels[ev];

    switch (ev) {
      case 0:
        // Reset to initial
        animateToEvent0();
        break;
      case 1:
        animateToEvent1();
        break;
      case 2:
        animateToEvent2();
        break;
      case 3:
        animateToEvent3();
        break;
      case 4:
        animateToEvent4();
        break;
      case 5:
        animateToEvent5();
        break;
    }
    eventText.textContent = eventTexts[ev];
  }

  // ---- Animation functions for each event ----
  function animateToEvent0() {
    const tl = gsap.timeline();
    tl.to(earthMuscles, { opacity: 0, duration: 0.3 }, 0);
    tl.to(earthArrows, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spaceCurl, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spacePush, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spacePushArrows, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spaceWall, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spaceHandle, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spaceBodySeated, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spaceFloatBody, { opacity: 1, duration: 0.3 }, 0);
    tl.to(comparisonTable, { opacity: 0, duration: 0.3, pointerEvents: 'none' }, 0);
    tl.to(closingText, { opacity: 0, duration: 0.3, pointerEvents: 'none' }, 0);
    // Reset panel sizes
    tl.to(earthPanel, { scale: 1, duration: 0.3 }, 0);
    tl.to(spacePanel, { scale: 1, duration: 0.3 }, 0);
  }

  function animateToEvent1() {
    const tl = gsap.timeline();
    tl.to(earthMuscles, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0);
    tl.to(earthArrows, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.2);
    // Ensure space side stays in event 0 state
    tl.to(spaceCurl, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spacePush, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spacePushArrows, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spaceWall, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spaceHandle, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spaceBodySeated, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spaceFloatBody, { opacity: 1, duration: 0.3 }, 0);
  }

  function animateToEvent2() {
    const tl = gsap.timeline();
    // Show curling on space side
    tl.to(spaceFloatBody, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spaceCurl, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1);
    tl.to(spacePush, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spacePushArrows, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spaceWall, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spaceHandle, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spaceBodySeated, { opacity: 0, duration: 0.3 }, 0);
    // Earth stays
    tl.to(earthMuscles, { opacity: 1, duration: 0.3 }, 0);
    tl.to(earthArrows, { opacity: 1, duration: 0.3 }, 0);
  }

  function animateToEvent3() {
    const tl = gsap.timeline();
    // Hide curl, show push
    tl.to(spaceCurl, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spaceFloatBody, { opacity: 0, duration: 0.3 }, 0);
    tl.to(spaceWall, { opacity: 1, duration: 0.4, ease: 'power2.out' }, 0.1);
    tl.to(spaceHandle, { opacity: 1, duration: 0.4, ease: 'power2.out' }, 0.2);
    tl.to(spacePush, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.3);
    tl.to(spacePushArrows, { opacity: 1, duration: 0.4, ease: 'power2.out' }, 0.5);
    tl.to(spaceBodySeated, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.6);
    // Earth stays
    tl.to(earthMuscles, { opacity: 1, duration: 0.3 }, 0);
    tl.to(earthArrows, { opacity: 1, duration: 0.3 }, 0);
  }

  function animateToEvent4() {
    const tl = gsap.timeline();
    // Shrink panels, show comparison table
    tl.to(earthPanel, { scale: 0.78, duration: 0.5, ease: 'power2.inOut' }, 0);
    tl.to(spacePanel, { scale: 0.78, duration: 0.5, ease: 'power2.inOut' }, 0);
    tl.to(comparisonTable, { opacity: 1, duration: 0.5, ease: 'power2.out', pointerEvents: 'auto' }, 0.3);
    // Keep Earth muscles and Space push visible
    tl.to(earthMuscles, { opacity: 1, duration: 0.3 }, 0);
    tl.to(earthArrows, { opacity: 1, duration: 0.3 }, 0);
    tl.to(spacePush, { opacity: 1, duration: 0.3 }, 0);
    tl.to(spacePushArrows, { opacity: 1, duration: 0.3 }, 0);
    tl.to(spaceWall, { opacity: 1, duration: 0.3 }, 0);
    tl.to(spaceHandle, { opacity: 1, duration: 0.3 }, 0);
    tl.to(spaceBodySeated, { opacity: 1, duration: 0.3 }, 0);
  }

  function animateToEvent5() {
    const tl = gsap.timeline();
    // Fade everything, show closing text
    tl.to(earthPanel, { opacity: 0.3, duration: 0.6, ease: 'power2.inOut' }, 0);
    tl.to(spacePanel, { opacity: 0.3, duration: 0.6, ease: 'power2.inOut' }, 0);
    tl.to(comparisonTable, { opacity: 0, duration: 0.4, pointerEvents: 'none' }, 0);
    tl.to(closingText, { opacity: 1, duration: 0.7, ease: 'power2.out', pointerEvents: 'auto' }, 0.4);
    // Reset scale
    tl.to(earthPanel, { scale: 1, duration: 0.5, ease: 'power2.inOut' }, 0);
    tl.to(spacePanel, { scale: 1, duration: 0.5, ease: 'power2.inOut' }, 0);
    // Disable button
    btn.disabled = true;
    btn.style.opacity = '0.5';
    btn.style.cursor = 'default';
  }

  // ---- Button click ----
  btn.addEventListener('click', () => {
    if (currentEvent < totalEvents - 1) {
      advanceTo(currentEvent + 1);
    }
  });

  // ---- Keyboard ----
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && currentEvent < totalEvents - 1) {
      e.preventDefault();
      advanceTo(currentEvent + 1);
    }
  });

  // ---- Initialize ----
  setProgress(0);
  gsap.set(earthMuscles, { opacity: 0 });
  gsap.set(earthArrows, { opacity: 0 });
  gsap.set(spaceCurl, { opacity: 0 });
  gsap.set(spacePush, { opacity: 0 });
  gsap.set(spacePushArrows, { opacity: 0 });
  gsap.set(spaceWall, { opacity: 0 });
  gsap.set(spaceHandle, { opacity: 0 });
  gsap.set(spaceBodySeated, { opacity: 0 });
  gsap.set(spaceFloatBody, { opacity: 1 });
  gsap.set(comparisonTable, { opacity: 0, pointerEvents: 'none' });
  gsap.set(closingText, { opacity: 0, pointerEvents: 'none' });

  // ---- SVG generators ----
  function earthSVG() {
    return `
    <svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="var(--color-accent)" />
        </marker>
      </defs>

      <!-- Bed -->
      <rect x="5" y="222" width="310" height="18" rx="5" fill="none" stroke="var(--color-border)" stroke-width="2"/>
      <rect x="5" y="240" width="310" height="12" rx="3" fill="var(--color-surface)" stroke="var(--color-border-light)" stroke-width="1.5"/>
      <line x1="10" y1="237" x2="315" y2="237" stroke="var(--color-border-light)" stroke-width="1"/>

      <!-- Body: lying down, head left -->
      <!-- Head -->
      <ellipse cx="52" cy="175" rx="17" ry="19" fill="var(--color-surface)" stroke="var(--text)" stroke-width="2.5"/>
      <!-- Eye -->
      <circle cx="58" cy="170" r="2.5" fill="var(--text)"/>
      <!-- Neck -->
      <line x1="69" y1="175" x2="82" y2="175" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Torso -->
      <path d="M82,160 L180,160 Q190,160 190,192 L190,200 Q190,205 180,205 L82,205 Q75,205 75,200 L75,192 Q75,160 82,160 Z" fill="var(--color-surface)" stroke="var(--text)" stroke-width="2.5"/>
      <!-- Upper arm -->
      <line x1="90" y1="168" x2="128" y2="155" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Forearm -->
      <line x1="128" y1="155" x2="155" y2="168" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Hand -->
      <circle cx="158" cy="170" r="5" fill="var(--color-surface)" stroke="var(--text)" stroke-width="1.5"/>
      <!-- Thigh -->
      <line x1="95" y1="205" x2="140" y2="205" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/>
      <!-- Calf -->
      <line x1="140" y1="205" x2="180" y2="205" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Foot -->
      <ellipse cx="187" cy="205" rx="10" ry="5" fill="var(--color-surface)" stroke="var(--text)" stroke-width="1.5"/>

      <!-- Muscle highlights: abs + obliques + hip flexors -->
      <g id="earth-muscles">
        <!-- Abs -->
        <rect x="111" y="168" width="38" height="32" rx="5" fill="var(--color-accent)" opacity="0.4"/>
        <line x1="130" y1="170" x2="130" y2="197" stroke="var(--color-accent)" stroke-width="1" opacity="0.3"/>
        <line x1="115" y1="178" x2="145" y2="178" stroke="var(--color-accent)" stroke-width="1" opacity="0.3"/>
        <line x1="115" y1="188" x2="145" y2="188" stroke="var(--color-accent)" stroke-width="1" opacity="0.3"/>
        <!-- Obliques L -->
        <path d="M95,170 L111,170 L111,198 L95,202 Z" fill="var(--color-accent)" opacity="0.25"/>
        <!-- Obliques R -->
        <path d="M149,170 L165,170 L165,198 L149,202 Z" fill="var(--color-accent)" opacity="0.25"/>
        <!-- Hip flexors -->
        <ellipse cx="105" cy="205" rx="12" ry="7" fill="var(--color-warning)" opacity="0.45"/>
        <ellipse cx="150" cy="205" rx="12" ry="7" fill="var(--color-warning)" opacity="0.45"/>
      </g>

      <!-- Force arrows -->
      <g id="earth-arrows">
        <!-- Upward arrow from abs -->
        <line x1="130" y1="180" x2="130" y2="148" class="arrow-line"/>
        <!-- Label -->
        <text x="135" y="145" font-size="13" fill="var(--color-accent)" font-family="var(--font-sans)">收缩 ↑</text>
        <!-- Downward arrow from hip -->
        <line x1="105" y1="210" x2="105" y2="218" class="arrow-line" style="marker-end:none"/>
        <text x="78" y="228" font-size="13" fill="var(--color-dim)" font-family="var(--font-sans)">固定下肢</text>
      </g>
    </svg>`;
  }

  function spaceSVG() {
    return `
    <svg viewBox="0 0 320 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="var(--color-accent)" />
        </marker>
        <marker id="arrowhead-arm" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#7c3aed" />
        </marker>
