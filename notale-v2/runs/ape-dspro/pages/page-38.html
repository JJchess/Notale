<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main {
    width: 1408px;
    height: 620px;
    margin: 96px auto 0 auto;
    display: flex;
    flex-direction: row;
  }
  .scene-wrap {
    position: relative;
    width: 1068px;
    height: 620px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .scene-wrap canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #three-canvas {
    z-index: 1;
  }
  #konva-container {
    position: absolute;
    inset: 0;
    z-index: 2;
  }
  .info-panel {
    width: 340px;
    flex-shrink: 0;
    padding: var(--sp-lg) var(--sp-xl);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: var(--sp-lg);
    background: var(--bg);
  }
  .pct-display {
    font-size: var(--fs-h1);
    font-weight: 700;
    color: var(--color-accent);
    text-align: center;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .pct-label {
    font-size: var(--fs-label);
    color: var(--color-dim);
    text-align: center;
    margin-top: var(--sp-xs);
  }
  .key-sentence {
    font-size: var(--fs-body);
    line-height: var(--lh-normal);
    color: var(--text);
    border-left: 3px solid var(--color-accent);
    padding-left: var(--sp-md);
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: var(--sp-sm);
    font-size: var(--fs-label);
    color: var(--text);
  }
  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legend-dot.internal { background: #e85d5d; }
  .legend-dot.external { background: #4ecdc4; }
  .hint-text {
    font-size: var(--fs-label);
    color: var(--color-dim);
    text-align: center;
    font-style: italic;
  }
</style>
</head>
<body data-page="38" data-total="40">
<div id="stage">
<main id="main">
  <div class="scene-wrap">
    <canvas id="three-canvas"></canvas>
    <div id="konva-container"></div>
  </div>
  <div class="info-panel">
    <div>
      <div class="pct-display" id="pct-val">0%</div>
      <div class="pct-label">外骨骼承担</div>
    </div>
    <div class="key-sentence">
      外骨骼把力绕过你的身体，直接传到地面。你的肌肉是旁观者，不是参与者。
    </div>
    <div class="legend-row">
      <div class="legend-dot internal"></div>
      <span>体内路径（肌肉—关节）</span>
    </div>
    <div class="legend-row">
      <div class="legend-dot external"></div>
      <span>体外路径（外骨骼结构）</span>
    </div>
    <div class="key-sentence">
      负载越重，体内路径越暗——这不是辅助，这是替代。
    </div>
    <div class="hint-text">↓ 拖动重物改变负载</div>
  </div>
</main>
</div>
<script src="assets/lib/three.min.js"></script>
<script src="assets/lib/konva.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  /* ====== Mount header ====== */
  Lec.mount({
    index: 38,
    kicker: 'FORCE PATH',
    title: '你的肌肉是旁观者',
    take: '外骨骼把力绕过身体，直接传到地面'
  });

  /* ====== Dimensions ====== */
  var SW = 1068, SH = 620;

  /* ====== Three.js Scene ====== */
  var threeCanvas = document.getElementById('three-canvas');
  var renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, alpha: false });
  renderer.setSize(SW, SH);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x16162a);

  var scene = new THREE.Scene();
  var camera = new THREE.OrthographicCamera(0, SW, SH, 0, 0.1, 100);
  camera.position.z = 10;

  /* -- Lighting -- */
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  var keyLight = new THREE.DirectionalLight(0xffffff, 0.7);
  keyLight.position.set(0.3, 0.6, 1);
  scene.add(keyLight);
  var rimLight = new THREE.DirectionalLight(0x8899cc, 0.4);
  rimLight.position.set(-0.5, 0.2, 0.8);
  scene.add(rimLight);

  /* -- Ground -- */
  var groundGeo = new THREE.PlaneGeometry(SW, 4);
  var groundMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.9 });
  var ground = new THREE.Mesh(groundGeo, groundMat);
  ground.position.set(SW / 2, 558, 0.5);
  scene.add(ground);

  /* -- Human silhouette texture -- */
  var silW = 260, silH = 480;
  var silCanvas = document.createElement('canvas');
  silCanvas.width = silW;
  silCanvas.height = silH;
  var sctx = silCanvas.getContext('2d');

  function drawSilhouette(ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    var cx = w * 0.48;
    var skin = '#c49a6c';
    var outline = '#8b6d4b';

    function bodyShape() {
      ctx.beginPath();
      // Head
      ctx.arc(cx, 46, 28, 0, Math.PI * 2);
      // Neck
      ctx.moveTo(cx - 14, 72);
      ctx.lineTo(cx - 14, 88);
      ctx.lineTo(cx + 14, 88);
      ctx.lineTo(cx + 14, 72);
      // Torso
      ctx.moveTo(cx - 30, 88);
      ctx.lineTo(cx + 32, 88);
      ctx.lineTo(cx + 35, 220);
      ctx.lineTo(cx - 28, 220);
      ctx.closePath();
      // Upper leg
      ctx.moveTo(cx - 6, 220);
      ctx.lineTo(cx + 18, 220);
      ctx.lineTo(cx + 16, 320);
      ctx.lineTo(cx - 4, 320);
      ctx.closePath();
      // Lower leg
      ctx.moveTo(cx - 2, 320);
      ctx.lineTo(cx + 14, 320);
      ctx.lineTo(cx + 18, 410);
      ctx.lineTo(cx + 2, 410);
      ctx.closePath();
      // Foot
      ctx.moveTo(cx + 2, 408);
      ctx.lineTo(cx + 32, 408);
      ctx.lineTo(cx + 32, 420);
      ctx.lineTo(cx + 2, 420);
      ctx.closePath();
      // Upper arm
      ctx.moveTo(cx - 30, 100);
      ctx.lineTo(cx - 18, 100);
      ctx.lineTo(cx - 14, 180);
      ctx.lineTo(cx - 26, 180);
      ctx.closePath();
      // Forearm
      ctx.moveTo(cx - 24, 178);
      ctx.lineTo(cx - 14, 178);
      ctx.lineTo(cx - 10, 250);
      ctx.lineTo(cx - 20, 250);
      ctx.closePath();
    }

    bodyShape();
    ctx.fillStyle = skin;
    ctx.fill();
    ctx.strokeStyle = outline;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  drawSilhouette(sctx, silW, silH);

  var silTex = new THREE.CanvasTexture(silCanvas);
  silTex.minFilter = THREE.LinearFilter;
  silTex.magFilter = THREE.LinearFilter;
  var silMat = new THREE.MeshBasicMaterial({ map: silTex, transparent: true, side: THREE.DoubleSide, depthWrite: false });
  var silGeo = new THREE.PlaneGeometry(silW, silH);
  var silPlane = new THREE.Mesh(silGeo, silMat);
  silPlane.position.set(260, 290, 0);
  scene.add(silPlane);

  /* -- Exoskeleton rods -- */
  function makeRod(x, y, w, h, colorHex) {
    var geo = new THREE.BoxGeometry(w, h, 6);
    var mat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.75, roughness: 0.35 });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, 0.3);
    return mesh;
  }

  function makeJoint(x, y, r, colorHex) {
    var geo = new THREE.SphereGeometry(r, 16, 16);
    var mat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.7, roughness: 0.3 });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, 0.5);
    return mesh;
  }

  // Back frame
  scene.add(makeRod(420, 210, 7, 160, 0x7a7a8a));
  scene.add(makeJoint(420, 130, 8, 0x999aaa));
  // Hip hinge
  scene.add(makeJoint(420, 310, 10, 0xaaaabb));
  // Thigh bar
  scene.add(makeRod(420, 370, 6, 90, 0x7a7a8a));
  // Knee joint
  scene.add(makeJoint(420, 420, 7, 0x999aaa));
  // Calf bar
  scene.add(makeRod(420, 460, 6, 80, 0x7a7a8a));
  // Ankle joint
  scene.add(makeJoint(420, 500, 6, 0x999aaa));
  // Sole plate
  var soleGeo = new THREE.BoxGeometry(30, 4, 12);
  var soleMat = new THREE.MeshStandardMaterial({ color: 0x888899, metalness: 0.6, roughness: 0.4 });
  var sole = new THREE.Mesh(soleGeo, soleMat);
  sole.position.set(420, 520, 0.3);
  scene.add(sole);

  /* ====== Konva Overlay ====== */
  var konvaStage = new Konva.Stage({
    container: 'konva-container',
    width: SW,
    height: SH
  });
  var konvaLayer = new Konva.Layer();
  konvaStage.add(konvaLayer);

  /* -- Internal force path nodes (aligned with figure body parts) -- */
  var internalPositions = [
    { x: 228, y: 130, label: '肩关节' },
    { x: 238, y: 210, label: '脊柱' },
    { x: 242, y: 300, label: '髋关节' },
    { x: 248, y: 385, label: '膝关节' },
    { x: 252, y: 465, label: '踝关节' },
    { x: 260, y: 545, label: '地面' }
  ];

  var externalPositions = [
    { x: 420, y: 130, label: '背架' },
    { x: 420, y: 310, label: '髋部铰链' },
    { x: 420, y: 370, label: '大腿支杆' },
    { x: 420, y: 420, label: '膝关节铰链' },
    { x: 420, y: 500, label: '踝关节铰链' },
    { x: 420, y: 545, label: '地面' }
  ];

  var INT_COLOR = '#e85d5d';
  var EXT_COLOR = '#4ecdc4';

  /* -- Internal line -- */
  var internalLine = new Konva.Line({
    points: internalPositions.reduce(function(a, p) { return a.concat([p.x, p.y]); }, []),
    stroke: INT_COLOR,
    strokeWidth: 3,
    lineCap: 'round',
    lineJoin: 'round',
    opacity: 1,
    listening: false
  });
  konvaLayer.add(internalLine);

  /* -- Internal glow line -- */
  var internalGlow = new Konva.Line({
    points: internalPositions.reduce(function(a, p) { return a.concat([p.x, p.y]); }, []),
    stroke: INT_COLOR,
    strokeWidth: 10,
    lineCap: 'round',
    lineJoin: 'round',
    opacity: 0.25,
    listening: false
  });
  konvaLayer.add(internalGlow);

  /* -- External line -- */
  var externalLine = new Konva.Line({
    points: externalPositions.reduce(function(a, p) { return a.concat([p.x, p.y]); }, []),
    stroke: EXT_COLOR,
    strokeWidth: 3,
    lineCap: 'round',
    lineJoin: 'round',
    opacity: 0.1,
    listening: false
  });
  konvaLayer.add(externalLine);

  /* -- External glow line -- */
  var externalGlow = new Konva.Line({
    points: externalPositions.reduce(function(a, p) { return a.concat([p.x, p.y]); }, []),
    stroke: EXT_COLOR,
    strokeWidth: 10,
    lineCap: 'round',
    lineJoin: 'round',
    opacity: 0.025,
    listening: false
  });
  konvaLayer.add(externalGlow);

  /* -- Internal nodes -- */
  var internalNodeGroups = internalPositions.map(function(pos) {
    var g = new Konva.Group({ x: pos.x, y: pos.y, listening: false });
    var glow = new Konva.Circle({ radius: 8, fill: INT_COLOR, opacity: 0.35, listening: false });
    var core = new Konva.Circle({ radius: 4.5, fill: INT_COLOR, opacity: 1, listening: false });
    g.add(glow);
    g.add(core);
    konvaLayer.add(g);
    return { group: g, glow: glow, core: core };
  });

  /* -- External nodes -- */
  var externalNodeGroups = externalPositions.map(function(pos) {
    var g = new Konva.Group({ x: pos.x, y: pos.y, listening: false });
    var glow = new Konva.Circle({ radius: 8, fill: EXT_COLOR, opacity: 0.035, listening: false });
    var core = new Konva.Circle({ radius: 4.5, fill: EXT_COLOR, opacity: 0.1, listening: false });
    g.add(glow);
    g.add(core);
    konvaLayer.add(g);
    return { group: g, glow: glow, core: core };
  });

  /* -- Draggable weight -- */
  var weightGroup = new Konva.Group({
    x: 305,
    y: 22,
    draggable: true,
    dragBoundFunc: function(pos) {
      return { x: 305, y: Math.max(22, Math.min(492, pos.y)) };
    }
  });
  var weightBg = new Konva.Rect({
    width: 70, height: 44,
    fill: '#e8b830',
    stroke: '#b8941e',
    strokeWidth: 2,
    cornerRadius: 5,
    shadowColor: 'black',
    shadowBlur: 8,
    shadowOpacity: 0.35,
    shadowOffset: { x: 0, y: 2 }
  });
  var weightLabel = new Konva.Text({
    text: '重物',
    fontSize: 16,
    fontFamily: 'Inter, "Helvetica Neue", Arial, sans-serif',
    fontStyle: 'bold',
    fill: '#4a3808',
    align: 'center',
    width: 70,
    y: 12
  });
  var weightArrow = new Konva.Text({
    text: '↕',
    fontSize: 14,
    fontFamily: 'Inter, "Helvetica Neue", Arial, sans-serif',
    fill: '#4a3808',
    align: 'center',
    width: 70,
    y: -16
  });
  weightGroup.add(weightBg);
  weightGroup.add(weightLabel);
  weightGroup.add(weightArrow);
  konvaLayer.add(weightGroup);

  /* ====== Force update logic ====== */
  var maxLoad = Lec.K.EXO_MAX_LOAD;
  var G = Lec.P.G;
  var pctEl = document.getElementById('pct-val');

  function updateForce(weightY) {
    var ratio = (weightY - 22) / (492 - 22);
    ratio = Math.max(0, Math.min(1, ratio));

    /* Internal: 1.0 → 0.1 */
    var intOp = 1.0 - ratio * 0.9;
    internalLine.opacity(intOp);
    internalGlow.opacity(0.25 * intOp);
    internalNodeGroups.forEach(function(nd) {
      nd.glow.opacity(0.35 * intOp);
      nd.core.opacity(intOp);
    });

    /* External: 0.1 → 1.0 */
    var extOp = 0.1 + ratio * 0.9;
    externalLine.opacity(extOp);
    externalGlow.opacity(0.25 * extOp);
    externalNodeGroups.forEach(function(nd) {
      nd.glow.opacity(0.35 * extOp);
      nd.core.opacity(extOp);
    });

    /* Percentage */
    var pct = Math.round(ratio * 100);
    pctEl.textContent = pct + '%';

    /* Weight visual feedback */
    var loadRatio = ratio;
    weightBg.fill(
      'rgb(' +
      Math.round(232 - loadRatio * 40) + ',' +
      Math.round(184 - loadRatio * 60) + ',' +
      Math.round(48 - loadRatio * 20) + ')'
    );

    konvaLayer.batchDraw();
  }

  weightGroup.on('dragmove', function() {
    updateForce(weightGroup.y());
    var ratio = (weightGroup.y() - 22) / (492 - 22);
    konvaContainer.setAttribute('aria-valuenow', String(Math.round(ratio * 100)));
  });

  /* ====== Keyboard accessibility (arrow keys) ====== */
  var konvaContainer = document.getElementById('konva-container');
  konvaContainer.setAttribute('tabindex', '0');
  konvaContainer.setAttribute('role', 'slider');
  konvaContainer.setAttribute('aria-label', '拖动重物改变负载，上箭头减轻，下箭头加重');
  konvaContainer.setAttribute('aria-valuemin', '0');
  konvaContainer.setAttribute('aria-valuemax', '100');
  konvaContainer.setAttribute('aria-valuenow', '0');
  konvaContainer.style.outline = 'none';

  konvaContainer.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      var step = e.key === 'ArrowDown' ? 8 : -8;
      var newY = weightGroup.y() + step;
      newY = Math.max(22, Math.min(492, newY));
      weightGroup.y(newY);
      updateForce(newY);
      var ratio = (newY - 22) / (492 - 22);
      konvaContainer.setAttribute('aria-valuenow', String(Math.round(ratio * 100)));
    }
  });

  /* ====== Initial draw ====== */
  updateForce(22);
  konvaLayer.draw();

  /* ====== Three.js render loop ====== */
  Deck.loop(function() {
    renderer.render(scene, camera);
  });
})();
</script>
</body>
</html>
