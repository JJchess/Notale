<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ===== Dark theme overrides ===== */
  :root {
    --bg: #0b0b16;
    --text: #e0e0ec;
    --color-accent: #e8923a;
    --color-accent-light: rgba(232, 146, 58, 0.10);
    --color-dim: #8888a8;
    --color-border: #2a2a3e;
    --color-border-light: #1e1e30;
    --color-surface: #151525;
    --color-diff: rgba(232, 146, 58, 0.12);
    --color-space: #4da6ff;
    --color-space-light: rgba(77, 166, 255, 0.10);
  }

  /* ===== Page layout ===== */
  #main {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    height: 100%;
    padding: 96px 96px 88px;
    box-sizing: border-box;
  }

  /* ===== Generalization claim ===== */
  .k-generalization {
    width: 100%;
    max-width: 1100px;
    padding: 0;
    margin-bottom: 20px;
  }
  .k-generalization .claim {
    border-left: 4px solid var(--color-accent);
    padding: 12px 16px 12px 20px;
    font-size: var(--fs-lead);
    font-weight: 600;
    line-height: var(--lh-normal);
    color: var(--text);
    background: var(--color-accent-light);
    border-radius: 0 6px 6px 0;
    letter-spacing: 0.01em;
  }

  /* ===== Visual zone ===== */
  .visual-zone {
    position: relative;
    width: 900px;
    height: 290px;
    flex-shrink: 0;
    margin-bottom: 16px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--color-border);
  }
  .visual-zone canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Flash overlay for hard cut */
  .flash-overlay {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    transition: opacity 0.1s ease;
    pointer-events: none;
    z-index: 2;
  }
  .flash-overlay.on {
    opacity: 1;
  }

  /* State label */
  .state-label {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: var(--fs-label);
    color: var(--color-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    z-index: 1;
    transition: color 0.25s;
    pointer-events: none;
  }
  .state-label.apeman { color: var(--color-accent); }
  .state-label.astronaut { color: var(--color-space); }

  /* ===== Comparison grid ===== */
  .comparison-grid {
    width: 100%;
    max-width: 1100px;
    display: flex;
    flex-direction: column;
    gap: 0;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  .comp-header {
    display: flex;
    background: var(--color-surface);
    font-size: var(--fs-label);
    color: var(--color-dim);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--color-border);
  }
  .comp-header > span {
    padding: 8px 16px;
    text-align: center;
  }
  .comp-dim-hdr { width: 130px; flex-shrink: 0; text-align: left !important; }
  .comp-ape-hdr { flex: 1; }
  .comp-astro-hdr { flex: 1; }

  .comp-row {
    display: flex;
    border-bottom: 1px solid var(--color-border-light);
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
    transition: background 0.25s;
  }
  .comp-row:last-child { border-bottom: none; }
  .comp-dim {
    width: 130px;
    flex-shrink: 0;
    padding: 10px 16px;
    font-weight: 600;
    color: var(--text);
    background: var(--color-surface);
    display: flex;
    align-items: center;
    font-size: var(--fs-sec);
  }
  .comp-ape, .comp-astro {
    flex: 1;
    padding: 10px 16px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.25s, color 0.25s;
    color: var(--color-dim);
  }
  .comp-ape.active {
    background: var(--color-accent-light);
    color: var(--color-accent);
    font-weight: 600;
  }
  .comp-astro.active {
    background: var(--color-space-light);
    color: var(--color-space);
    font-weight: 600;
  }

  /* ===== Data strip ===== */
  .data-strip {
    display: flex;
    gap: 12px;
    flex-shrink: 0;
    margin-bottom: 10px;
  }
  .data-panel {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 6px;
    padding: 8px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 120px;
    transition: background 0.25s, border-color 0.25s;
  }
  .data-panel .dp-val {
    font-size: var(--fs-h2);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
    transition: color 0.25s;
  }
  .data-panel .dp-lbl {
    font-size: var(--fs-label);
    color: var(--color-dim);
    margin-top: 2px;
    line-height: var(--lh-tight);
  }
  .data-panel.apeman { border-color: rgba(232,146,58,0.3); }
  .data-panel.apeman .dp-val { color: var(--color-accent); }
  .data-panel.astronaut { border-color: rgba(77,166,255,0.3); }
  .data-panel.astronaut .dp-val { color: var(--color-space); }

  /* ===== Control hint ===== */
  .control-hint {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: var(--fs-label);
    color: var(--color-dim);
    flex-shrink: 0;
    margin-bottom: 8px;
  }
  .control-hint kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 36px;
    height: 24px;
    padding: 0 8px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 4px;
    font-family: inherit;
    font-size: var(--fs-tick);
    color: var(--color-dim);
    line-height: 1;
  }

  /* ===== Conclusion line ===== */
  .conclusion-line {
    font-size: var(--fs-sec);
    color: var(--color-dim);
    line-height: var(--lh-normal);
    text-align: center;
    max-width: 850px;
    flex-shrink: 0;
    font-style: italic;
  }

  /* ===== Canvas alpha mask on edges ===== */
  .visual-zone {
    mask-image: linear-gradient(to right, transparent, black 6%, black 94%, transparent);
    -webkit-mask-image: linear-gradient(to right, transparent, black 6%, black 94%, transparent);
  }
</style>
</head>
<body data-page="39" data-total="40">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  // ── State ──────────────────────────────────────────────
  let state = 'apeman';       // 'apeman' | 'astronaut'
  let canSwitch = true;
  let cooldownTimer = null;

  // ── Mount Lec ──────────────────────────────────────────
  Lec.mount({
    index: 39,
    kicker: '第五章 · 重力之外',
    title: '猿人与宇航员',
    take: '身体不够用，就加一层'
  });

  // ── Build DOM ──────────────────────────────────────────
  const main = document.getElementById('main');

  // Claim
  const genDiv = document.createElement('div');
  genDiv.className = 'k-generalization';
  const claim = document.createElement('div');
  claim.className = 'claim';
  claim.textContent = '猿人用石头应对草原，宇航员用舱外服应对真空——看起来差了三百万年，实际上做的是一模一样的事：身体不够用，就加一层。';
  genDiv.appendChild(claim);
  main.appendChild(genDiv);

  // Visual zone
  const visualZone = document.createElement('div');
  visualZone.className = 'visual-zone';

  const canvas = document.createElement('canvas');
  canvas.id = 'visual-canvas';
  visualZone.appendChild(canvas);

  const flash = document.createElement('div');
  flash.className = 'flash-overlay';
  flash.id = 'flash-overlay';
  visualZone.appendChild(flash);

  const stateLabel = document.createElement('div');
  stateLabel.className = 'state-label apeman';
  stateLabel.textContent = '猿人 · 草原';
  visualZone.appendChild(stateLabel);

  main.appendChild(visualZone);

  // Comparison grid
  const compGrid = document.createElement('div');
  compGrid.className = 'comparison-grid';

  const compData = [
    { dim: '环境威胁', ape: '草原温差与掠食者', astro: '真空辐射与缺氧' },
    { dim: '皮肤外包', ape: '兽皮', astro: '舱外服' },
    { dim: '手的外包', ape: '石器', astro: '机械臂' },
    { dim: '代谢外包', ape: '火（预消化）', astro: '生命维持系统' }
  ];

  // Header
  const header = document.createElement('div');
  header.className = 'comp-header';
  header.innerHTML = '<span class="comp-dim-hdr">维度</span><span class="comp-ape-hdr">猿人</span><span class="comp-astro-hdr">宇航员</span>';
  compGrid.appendChild(header);

  // Rows
  const rowEls = [];
  compData.forEach((row, i) => {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'comp-row';
    rowDiv.innerHTML =
      '<span class="comp-dim">' + row.dim + '</span>' +
      '<span class="comp-ape active" data-row="' + i + '">' + row.ape + '</span>' +
      '<span class="comp-astro" data-row="' + i + '">' + row.astro + '</span>';
    compGrid.appendChild(rowDiv);
    rowEls.push({
      ape: rowDiv.querySelector('.comp-ape'),
      astro: rowDiv.querySelector('.comp-astro')
    });
  });
  main.appendChild(compGrid);

  // Data strip
  const dataStrip = document.createElement('div');
  dataStrip.className = 'data-strip';

  const dataPanels = [];
  for (let i = 0; i < 3; i++) {
    const panel = document.createElement('div');
    panel.className = 'data-panel apeman';
    panel.innerHTML = '<span class="dp-val"></span><span class="dp-lbl"></span>';
    dataStrip.appendChild(panel);
    dataPanels.push({
      el: panel,
      val: panel.querySelector('.dp-val'),
      lbl: panel.querySelector('.dp-lbl')
    });
  }
  main.appendChild(dataStrip);

  // Populate data panels based on state
  function updateDataPanels() {
    const isApe = state === 'apeman';
    const cls = isApe ? 'apeman' : 'astronaut';

    if (isApe) {
      var ft = Lec.K.FIRST_TOOL;
      var span = Lec.K.SPAN;
      var ts = Lec.K.TOOL_SPECIES;
      dataPanels[0].val.textContent = (ft / 10000).toFixed(0) + ' 万年前';
      dataPanels[0].lbl.textContent = '最早石器';
      dataPanels[1].val.textContent = ts + ' 种';
      dataPanels[1].lbl.textContent = '工具使用物种';
      dataPanels[2].val.textContent = (span / 10000).toFixed(0) + ' 万年';
      dataPanels[2].lbl.textContent = '演化跨度';
    } else {
      var psi = Lec.K.GLOVE_PSI;
      var alt = Lec.K.ISS_ALT;
      var bl = Lec.K.BONE_LOSS;
      dataPanels[0].val.textContent = psi + ' psi';
      dataPanels[0].lbl.textContent = '舱外服气压';
      dataPanels[1].val.textContent = alt + ' km';
      dataPanels[1].lbl.textContent = '轨道高度';
      dataPanels[2].val.textContent = bl + ' %/月';
      dataPanels[2].lbl.textContent = '骨骼钙流失';
    }

    dataPanels.forEach(function(p) {
      p.el.className = 'data-panel ' + cls;
    });
  }
  updateDataPanels();

  // Control hint
  const ctrlHint = document.createElement('div');
  ctrlHint.className = 'control-hint';
  ctrlHint.innerHTML = '<kbd>空格</kbd><span>切换视角</span>';
  main.appendChild(ctrlHint);

  // Conclusion
  const conclusion = document.createElement('div');
  conclusion.className = 'conclusion-line';
  conclusion.textContent = '草原和真空，一个是太暴露，一个是太虚空。但身体的问题是一样的：它不能直接待在那里。';
  main.appendChild(conclusion);

  // ── Canvas setup ───────────────────────────────────────
  function draw(ctx, w, h) {
    const cx = w / 2;
    const cy = h / 2 + 5;
    const isApe = state === 'apeman';

    // Clear
    ctx.clearRect(0, 0, w, h);

    // ── Background ──
    if (isApe) {
      // Warm savanna gradient
      const bgGrad = ctx.createRadialGradient(cx, cy - 40, 20, cx, cy, w * 0.7);
      bgGrad.addColorStop(0, '#3d2a18');
      bgGrad.addColorStop(0.5, '#1e1810');
      bgGrad.addColorStop(1, '#0b0b16');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // Horizon line
      ctx.strokeStyle = 'rgba(180,130,80,0.25)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, cy + 70);
      ctx.lineTo(w, cy + 70);
      ctx.stroke();

      // Grass tufts
      ctx.strokeStyle = 'rgba(160,120,60,0.2)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 12; i++) {
        const gx = (i / 11) * w * 0.7 + w * 0.15;
        const gh = 8 + Math.random() * 20;
        ctx.beginPath();
        ctx.moveTo(gx, cy + 70);
        ctx.quadraticCurveTo(gx - 5, cy + 70 - gh, gx - 8, cy + 70 - gh - 4);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(gx, cy + 70);
        ctx.quadraticCurveTo(gx + 5, cy + 70 - gh * 0.7, gx + 8, cy + 70 - gh * 0.7 - 3);
        ctx.stroke();
      }

      // Sun
      const sunX = cx + 180;
      const sunY = cy - 90;
      const sunGrad = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 50);
      sunGrad.addColorStop(0, 'rgba(255,200,140,0.7)');
      sunGrad.addColorStop(0.4, 'rgba(232,146,58,0.3)');
      sunGrad.addColorStop(1, 'rgba(232,146,58,0)');
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(sunX, sunY, 50, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,220,170,0.9)';
      ctx.beginPath();
      ctx.arc(sunX, sunY, 16, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Space gradient
      const bgGrad = ctx.createRadialGradient(cx, cy - 30, 10, cx, cy + 30, w * 0.7);
      bgGrad.addColorStop(0, '#1a2540');
      bgGrad.addColorStop(0.5, '#0d1525');
      bgGrad.addColorStop(1, '#0b0b16');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // Stars
      const starSeed = 42;
      function seededRandom(s) { const x = Math.sin(s * 9301 + 49297) * 49297; return x - Math.floor(x); }
      for (let i = 0; i < 80; i++) {
        const sx = seededRandom(starSeed + i * 3) * w;
        const sy = seededRandom(starSeed + i * 5) * h * 0.7;
        const sr = seededRandom(starSeed + i * 7) * 1.8 + 0.3;
        const sa = seededRandom(starSeed + i * 11) * 0.6 + 0.2;
        ctx.fillStyle = 'rgba(200,220,255,' + sa.toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(sx, sy, sr, 0, Math.PI * 2);
        ctx.fill();
      }

      // Earth
      const earthX = cx + 180;
      const earthY = cy - 90;
      const earthGrad = ctx.createRadialGradient(earthX - 4, earthY - 4, 2, earthX, earthY, 22);
      earthGrad.addColorStop(0, '#6db3f2');
      earthGrad.addColorStop(0.5, '#2d6db5');
      earthGrad.addColorStop(1, '#0a2040');
      ctx.fillStyle = earthGrad;
      ctx.beginPath();
      ctx.arc(earthX, earthY, 22, 0, Math.PI * 2);
      ctx.fill();
      // Atmosphere glow
      const atmoGrad = ctx.createRadialGradient(earthX, earthY, 20, earthX, earthY, 36);
      atmoGrad.addColorStop(0, 'rgba(77,166,255,0.25)');
      atmoGrad.addColorStop(1, 'rgba(77,166,255,0)');
      ctx.fillStyle = atmoGrad;
      ctx.beginPath();
      ctx.arc(earthX, earthY, 36, 0, Math.PI * 2);
      ctx.fill();
    }

    // ── Body silhouette ──
    const bodyColor = isApe ? 'rgba(232,146,58,0.55)' : 'rgba(77,166,255,0.45)';
    const bodyGlow = isApe ? 'rgba(232,146,58,0.12)' : 'rgba(77,166,255,0.10)';

    // Body glow
    ctx.fillStyle = bodyGlow;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 48, 100, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = bodyColor;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Head
    ctx.beginPath();
    ctx.arc(cx, cy - 85, 15, 0, Math.PI * 2);
    ctx.stroke();

    // Neck
    ctx.beginPath();
    ctx.moveTo(cx - 5, cy - 70);
    ctx.lineTo(cx - 7, cy - 55);
    ctx.moveTo(cx + 5, cy - 70);
    ctx.lineTo(cx + 7, cy - 55);
    ctx.stroke();

    // Shoulders
    ctx.beginPath();
    ctx.moveTo(cx - 30, cy - 55);
    ctx.lineTo(cx + 30, cy - 55);
    ctx.stroke();

    // Torso
    ctx.beginPath();
    ctx.moveTo(cx - 30, cy - 55);
    ctx.quadraticCurveTo(cx - 26, cy - 10, cx - 20, cy + 25);
    ctx.lineTo(cx + 20, cy + 25);
    ctx.quadraticCurveTo(cx + 26, cy - 10, cx + 30, cy - 55);
    ctx.stroke();

    // Arms
    ctx.beginPath();
    ctx.moveTo(cx - 28, cy - 50);
    ctx.quadraticCurveTo(cx - 52, cy - 30, cx - 42, cy + 15);
    ctx.moveTo(cx + 28, cy - 50);
    ctx.quadraticCurveTo(cx + 52, cy - 30, cx + 42, cy + 15);
    ctx.stroke();

    // Legs
    ctx.beginPath();
    ctx.moveTo(cx - 14, cy + 25);
    ctx.lineTo(cx - 18, cy + 85);
    ctx.moveTo(cx + 14, cy + 25);
    ctx.lineTo(cx + 18, cy + 85);
    ctx.stroke();

    // ── Three concentric arcs ──
    const arcColor = isApe ? 'rgba(232,146,58,0.7)' : 'rgba(77,166,255,0.65)';
    const arcColorLight = isApe ? 'rgba(232,146,58,0.25)' : 'rgba(77,166,255,0.22)';

    const arcs = [
      { r: 145, a0: 0.2, a1: 0.8, label: isApe ? '草原 · 温差 · 掠食者' : '真空 · 辐射 · 缺氧' },
      { r: 115, a0: 0.22, a1: 0.78, label: isApe ? '皮肤保温不足 · 咬合力弱' : '皮肤不能承压 · 骨骼钙流失' },
      { r: 85,  a0: 0.24, a1: 0.76, label: isApe ? '石器 · 兽皮 · 火' : '舱外服 · 机械臂 · 生命维持' }
    ];

    arcs.forEach((arc, idx) => {
      const a0 = arc.a0 * Math.PI;  // start angle (from top)
      const a1 = arc.a1 * Math.PI;  // end angle
      const midAngle = (a0 + a1) / 2;

      // Arc
      ctx.strokeStyle = idx === 0 ? arcColor : arcColorLight;
      ctx.lineWidth = idx === 0 ? 2.5 : 1.8;
      ctx.beginPath();
      // Draw arc above the body (from left to right, sweeping top)
      const startX = cx + arc.r * Math.cos(a0);
      const startY = cy - arc.r * Math.sin(a0);
      ctx.arc(cx, cy, arc.r, -a1, -a0, false);
      ctx.stroke();

      // Label
      const labelX = cx + (arc.r + 8) * Math.cos(midAngle);
      const labelY = cy - (arc.r + 8) * Math.sin(midAngle);
      ctx.fillStyle = idx === 0 ? arcColor : arcColorLight;
      ctx.font = (idx === 0 ? '13px' : '11.5px') + ' "Inter","Helvetica Neue",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(arc.label, labelX, labelY);
    });

    // ── Outer ring labels ──
    ctx.fillStyle = isApe ? 'rgba(232,146,58,0.5)' : 'rgba(77,166,255,0.45)';
    ctx.font = '11px "Inter","Helvetica Neue",sans-serif';
    ctx.textAlign = 'center';

    // Left label
    const leftX = cx - 175;
    const leftY = cy - 8;
    ctx.fillText(isApe ? '环境' : '环境', leftX, leftY);

    // Right label
    const rightX = cx + 175;
    const rightY = cy - 8;
    ctx.fillText(isApe ? '外包层' : '外包层', rightX, rightY);

    // Top label
    const topX = cx;
    const topY = cy - 175;
    ctx.fillText(isApe ? '身体局限' : '身体局限', topX, topY);
  }

  // ── Deck.autofit ───────────────────────────────────────
  Deck.autofit(canvas, draw);

  // ── Space key handler ──────────────────────────────────
  function switchState() {
    if (!canSwitch) return;
    canSwitch = false;

    // Flash on
    flash.classList.add('on');

    // After 100ms, switch state
    setTimeout(() => {
      state = state === 'apeman' ? 'astronaut' : 'apeman';

      // Update state label
      stateLabel.textContent = state === 'apeman' ? '猿人 · 草原' : '宇航员 · 真空';
      stateLabel.className = 'state-label ' + state;

      // Update comparison grid highlights
      rowEls.forEach(row => {
        if (state === 'apeman') {
          row.ape.classList.add('active');
          row.astro.classList.remove('active');
        } else {
          row.ape.classList.remove('active');
          row.astro.classList.add('active');
        }
      });

      // Redraw canvas
      Deck.autofit(canvas, draw);

      // Update data panels
      updateDataPanels();

      // Flash off after another 100ms (total 200ms flash)
      setTimeout(() => {
        flash.classList.remove('on');

        // 2-second cooldown
        cooldownTimer = setTimeout(() => {
          canSwitch = true;
        }, 2000);
      }, 100);
    }, 100);
  }

  document.addEventListener('keydown', function(e) {
    if (e.code === 'Space') {
      e.preventDefault();
      switchState();
    }
  });

  // ── Click fallback ─────────────────────────────────────
  visualZone.addEventListener('click', function() {
    switchState();
  });
  visualZone.style.cursor = 'pointer';

})();
