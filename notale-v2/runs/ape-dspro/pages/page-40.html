<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* Page 40 — 全课收束：同一性 */
    .pg40 {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 18px 0 14px;
    }

    .pg40-images {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      justify-content: center;
      gap: 48px;
    }

    .pg40-img {
      width: 440px;
      height: 293px;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }

    .pg40-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .pg40-timeline {
      width: 928px;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pg40-tl-bar {
      display: flex;
      flex-direction: row;
      align-items: center;
      width: 100%;
    }

    .pg40-tl-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--color-accent);
      flex-shrink: 0;
    }

    .pg40-tl-line {
      flex: 1;
      height: 1.5px;
      background: var(--color-accent);
    }

    .pg40-tl-labels {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      width: 100%;
      margin-top: 4px;
      font-size: var(--fs-label);
      color: var(--color-dim);
    }

    .pg40-table {
      display: grid;
      grid-template-columns: 106px 1fr 1fr 1fr 1fr;
      width: 928px;
      margin-top: 18px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--color-border);
      gap: 1px;
    }

    .pg40-cell {
      background: var(--bg);
      padding: 9px 12px;
      font-size: var(--fs-sec);
      line-height: var(--lh-normal);
      display: flex;
      align-items: center;
    }

    .pg40-hdr {
      background: var(--color-surface);
      font-weight: 600;
      font-size: var(--fs-label);
      justify-content: center;
      text-align: center;
    }

    .pg40-dim {
      font-weight: 600;
      font-size: var(--fs-sec);
      justify-content: flex-end;
      padding-right: 14px;
      color: var(--text);
    }

    .pg40-same {
      background: var(--color-diff);
      font-weight: 600;
    }

    .pg40-closing {
      width: 928px;
      margin-top: 20px;
    }
  </style>
</head>
<body data-page="40" data-total="40">
  <div id="stage">
    <main id="main">
      <div class="pg40">

        <!-- 两幅并置图像 -->
        <div class="pg40-images">
          <div class="pg40-img">
            <img src="assets/img/page-40-hominin.jpg"
                 alt="Homo erectus 复原模型，伦敦自然历史博物馆"
                 title="照片：Homo erectus 复原模型，伦敦自然历史博物馆。摄影：Werner Ustorf。CC BY-SA 2.0。">
          </div>
          <div class="pg40-img">
            <img src="assets/img/page-40-astronaut.jpg"
                 alt="Bruce McCandless II 无系绳舱外活动，STS-41-B，1984"
                 title="照片：Bruce McCandless II during EVA, STS-41-B, 1984. NASA. 公有领域。">
          </div>
        </div>

        <!-- 时间轴：连接两个时刻 -->
        <div class="pg40-timeline">
          <div class="pg40-tl-bar">
            <div class="pg40-tl-dot"></div>
            <div class="pg40-tl-line"></div>
            <div class="pg40-tl-dot"></div>
          </div>
          <div class="pg40-tl-labels">
            <span>第一个石器</span>
            <span>现在</span>
          </div>
        </div>

        <!-- 同一性表：四列对齐，本能列完全相同 -->
        <div class="pg40-table">
          <div class="pg40-cell pg40-hdr">维度</div>
          <div class="pg40-cell pg40-hdr">面对的问题</div>
          <div class="pg40-cell pg40-hdr">身体不够用</div>
          <div class="pg40-cell pg40-hdr">本能</div>
          <div class="pg40-cell pg40-hdr">工具</div>

          <div class="pg40-cell pg40-dim">猿人</div>
          <div class="pg40-cell">草原上的捕食者、饥饿、寒冷</div>
          <div class="pg40-cell">没有利爪，没有厚毛，跑不过猎物</div>
          <div class="pg40-cell pg40-same">外包：把身体功能交给体外的东西</div>
          <div class="pg40-cell">石头（拳头之外）</div>

          <div class="pg40-cell pg40-dim">宇航员</div>
          <div class="pg40-cell">真空、辐射、失重</div>
          <div class="pg40-cell">没有真空耐受，没有辐射屏蔽，骨骼为 1g 设计</div>
          <div class="pg40-cell pg40-same">外包：把身体功能交给体外的东西</div>
          <div class="pg40-cell">舱外服（皮肤之外）、空间站（重力之外）</div>
        </div>

        <!-- 收束主张：k-generalization 结构 -->
        <div class="pg40-closing k-generalization">
          <div class="claim">猿人和宇航员不是两个物种，是同一个物种在 300 万年里的两个快照。</div>
          <div class="supports">
            <div class="support">从石头到空间站，我们一直在做同一件事：把身体的功能一件一件交出去。</div>
            <div class="support">外包不是人类的发明，外包就是人类。</div>
          </div>
        </div>

      </div>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 40,
      kicker: '全课收束',
      title: 'Apeman — Spaceman',
      take: '猿人和宇航员不是两个物种，是同一个物种在 300 万年里的两个快照。外包是我们的本能。'
    });
  </script>
</body>
</html>
