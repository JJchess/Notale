<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 01 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ---- 本页专属 ---- */

  /* 主容器：k-generalization 主张—支撑，但让插图撑满宽度 */
  #main {
    justify-content: center;
    gap: 0;
  }

  /* 插图场景：全宽，让主张的竖线穿过它 */
  .hero-scene {
    position: relative;
    width: calc(100% + var(--sp-8));
    margin-left: calc(-1 * var(--sp-8));
    height: 420px;
    overflow: hidden;
    border-radius: var(--r-md);
    flex-shrink: 0;
  }

  .hero-scene img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* 半透明遮罩让箭头和标签可读 */
  .hero-scene::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(11,17,25,0.35) 100%);
    pointer-events: none;
    z-index: 1;
  }

  /* ---- 箭头组 ---- */
  .hero-arrow {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
    z-index: 3;
  }

  .hero-arrow-body {
    display: flex;
    align-items: center;
  }

  .hero-arrow-shaft {
    width: 220px;
    height: 7px;
    background: var(--focus);
    border-radius: 4px;
    box-shadow: 0 0 16px rgba(96,165,250,0.5);
  }

  .hero-arrow-head {
    width: 0;
    height: 0;
    border-top: 13px solid transparent;
    border-bottom: 13px solid transparent;
    border-left: 22px solid var(--focus);
    filter: drop-shadow(0 0 6px rgba(96,165,250,0.5));
  }

  .hero-arrow-label {
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    text-shadow:
      0 0 16px rgba(0,0,0,0.9),
      0 0 4px rgba(0,0,0,0.8),
      0 2px 4px rgba(0,0,0,0.6);
    text-align: center;
    line-height: 1.3;
    letter-spacing: 0.06em;
  }

  .hero-arrow-sub {
    font-size: var(--fs-label);
    color: var(--text-dim);
    text-shadow:
      0 0 10px rgba(0,0,0,0.85),
      0 1px 3px rgba(0,0,0,0.6);
    text-align: center;
    letter-spacing: 0.04em;
  }

  /* ---- 两侧重力标签 ---- */
  .hero-tag {
    position: absolute;
    bottom: 18px;
    font-size: var(--fs-label);
    color: var(--text-dim);
    text-shadow: 0 0 8px rgba(0,0,0,0.8), 0 1px 2px rgba(0,0,0,0.5);
    font-weight: 500;
    letter-spacing: 0.03em;
    z-index: 3;
  }
  .hero-tag.left  { left:  28px; }
  .hero-tag.right { right: 28px; }

  /* ---- 主张与支撑间距 ---- */
  #main > .claim {
    margin-bottom: var(--sp-6);
  }

  #main > .supports {
    margin-top: var(--sp-6);
  }
</style>
</head>
<body data-page="01" data-total="60">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  Deck.init({ index: 1, total: 60 });

  /* ---- 页眉页脚 ---- */
  Lec.mount({
    kicker: '第一章 · 身体遗产',
    title:  '猿人—太空人',
    take:   '同一具身体，不同重力'
  });

  /* ---- 计算月球/地球重力比 ---- */
  var ratio = Lec.K.MOON_GRAVITY / Lec.K.EARTH_GRAVITY;  // ≈ 0.165

  var main = document.getElementById('main');
  main.className = 'k-generalization col';

  /* ===== 主张 ===== */
  var claim = document.createElement('div');
  claim.className = 'claim';
  claim.textContent = '猿人——太空人，同一具身体，不同重力。';
  main.appendChild(claim);

  /* ===== 插图场景 ===== */
  var scene = document.createElement('div');
  scene.className = 'hero-scene';

  var img = document.createElement('img');
  img.src = 'assets/img/page-01-hero.png';
  img.alt = '';
  scene.appendChild(img);

  /* 箭头 */
  var arrow = document.createElement('div');
  arrow.className = 'hero-arrow';

  var body = document.createElement('div');
  body.className = 'hero-arrow-body';
  var shaft = document.createElement('div');
  shaft.className = 'hero-arrow-shaft';
  var head = document.createElement('div');
  head.className = 'hero-arrow-head';
  body.appendChild(shaft);
  body.appendChild(head);
  arrow.appendChild(body);

  var label = document.createElement('div');
  label.className = 'hero-arrow-label';
  label.textContent = '同一具身体';
  arrow.appendChild(label);

  var sub = document.createElement('div');
  sub.className = 'hero-arrow-sub';
  sub.textContent = '不同重力';
  arrow.appendChild(sub);

  scene.appendChild(arrow);

  /* 左侧标签 */
  var tagL = document.createElement('div');
  tagL.className = 'hero-tag left';
  tagL.textContent = '1g · 地球';
  scene.appendChild(tagL);

  /* 右侧标签 */
  var tagR = document.createElement('div');
  tagR.className = 'hero-tag right';
  tagR.textContent = ratio.toFixed(2) + 'g · 月球';
  scene.appendChild(tagR);

  main.appendChild(scene);

  /* ===== 支撑 ===== */
  var supports = document.createElement('div');
  supports.className = 'supports';

  var support = document.createElement('div');
  support.className = 'support';
  support.textContent = '演化给了我们这具身体，工程让我们把它带到任何重力下。';
  supports.appendChild(support);

  main.appendChild(supports);
})();
</script>
</body>
</html>
