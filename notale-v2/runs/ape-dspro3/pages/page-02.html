<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第 02 页 · 互动讲义</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* ---- chapter enumeration: numbers replace bullets ---- */
    .k-enumeration.chapters {
      counter-reset: ch;
      gap: var(--sp-3);
    }

    .k-enumeration.chapters > .it {
      align-items: center;
      padding: var(--sp-3) var(--sp-5);
    }

    .k-enumeration.chapters > .it::before {
      content: counter(ch);
      counter-increment: ch;
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
      line-height: 1.2;
      min-width: 1.3em;
      text-align: center;
    }

    /* ---- chapter item internals ---- */
    .ch-title {
      font-size: var(--fs-body);
      font-weight: 600;
      color: var(--text);
      display: block;
      margin-bottom: 1px;
      line-height: 1.4;
    }

    .ch-claim {
      font-size: var(--fs-sec);
      color: var(--text-sec);
      line-height: 1.45;
    }

    /* ---- closing block ---- */
    .closing {
      margin-top: var(--sp-6);
      padding: var(--sp-5) var(--sp-6);
      border-left: 3px solid var(--accent);
      background: var(--surface);
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
    }

    .closing p {
      margin: 0;
      font-size: var(--fs-body);
      color: var(--text);
      line-height: 1.5;
    }

    .closing p + p {
      margin-top: var(--sp-2);
      color: var(--text-sec);
      font-size: var(--fs-sec);
    }
  </style>
</head>
<body data-page="02" data-total="60">
  <div id="stage">
    <main id="main">
      <div class="k-enumeration chapters">
        <div class="it">
          <div class="col grow">
            <strong class="ch-title">身体遗产</strong>
            <span class="ch-claim">南方古猿到智人的骨骼结构揭示了一套为直立行走和奔跑而优化的下肢</span>
          </div>
        </div>
        <div class="it">
          <div class="col grow">
            <strong class="ch-title">地球跳跃实验室</strong>
            <span class="ch-claim">跳跃高度取决于初速度和质量，人类在地球上的跳跃极限由骨骼肌肉决定</span>
          </div>
        </div>
        <div class="it">
          <div class="col grow">
            <strong class="ch-title">脱离地球</strong>
            <span class="ch-claim">微重力改变运动模式，宇航服增加质量，但低重力让跳跃比地球上更高</span>
          </div>
        </div>
        <div class="it">
          <div class="col grow">
            <strong class="ch-title">星际跳跃</strong>
            <span class="ch-claim">用同一套物理规律计算其他星球上的跳跃高度，比较不同行星的表面探索体验</span>
          </div>
        </div>
        <div class="it">
          <div class="col grow">
            <strong class="ch-title">演化与工程</strong>
            <span class="ch-claim">演化赋予身体，工程赋予环境；太空探索不是淘汰身体，而是重新定义身体能做什么</span>
          </div>
        </div>
      </div>

      <div class="closing">
        <p>从猿人到太空人，是同一具身体在不同重力下的新故事。</p>
        <p>五章推进：化石证据 → 地球跳跃 → 微重力适应 → 星际跳跃 → 演化与工程的对话。</p>
      </div>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Deck.init({ index: 2, total: 60 });
    Lec.mount({
      index: 2,
      kicker: '路线图',
      title: '从猿人到太空人',
      take: '同一具身体，不同重力下的新故事'
    });
  </script>
</body>
</html>
