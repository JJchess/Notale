<style>
  /* ---- 页面专属样式 ---- */
  #main {
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
    height: 100%;
  }

  .skel-wrap {
    position: relative;
    width: 100%;
    height: 240px;
    flex-shrink: 0;
  }

  #skel-cv {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* 阶段指示器 */
  .stage-bar {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: var(--sp-3);
    flex-shrink: 0;
    height: 28px;
  }

  .stage-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--border);
    transition: background 300ms var(--ease), box-shadow 300ms var(--ease);
    cursor: default;
  }
  .stage-dot.done {
    background: var(--ok);
    box-shadow: 0 0 6px rgba(52,211,153,0.4);
  }
  .stage-dot.active {
    background: var(--accent);
    box-shadow: 0 0 8px rgba(77,166,255,0.6);
  }

  .stage-label {
    font-size: var(--fs-label);
    color: var(--text-sec);
    margin: 0 var(--sp-2);
    white-space: nowrap;
  }

  /* 提示文字 */
  .hint-text {
    font-size: var(--fs-label);
    color: var(--accent-soft);
    text-align: center;
    flex-shrink: 0;
    min-height: 20px;
    transition: opacity 300ms var(--ease);
  }

  /* 对比照片区 */
  .photo-pair {
    display: none;
    flex-direction: row;
    gap: var(--sp-4);
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    height: 90px;
  }
  .photo-pair.show {
    display: flex;
  }

  .photo-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .photo-card img {
    height: 68px;
    width: auto;
    border-radius: var(--r-sm);
    border: 1px solid var(--border);
    object-fit: contain;
    background: #000;
  }
  .photo-card .pc-label {
    font-size: var(--fs-tick);
    color: var(--text-dim);
    text-align: center;
    max-width: 200px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 比较表 */
  .comp-table {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
  }

  /* 显式指定比较表为 4 列，避免 auto-fit 异常 */
  #comp-table-el {
    grid-template-columns: auto 1fr 1fr 1fr;
  }

  /* 完工总结 */
  .complete-summary {
    display: none;
    flex-direction: column;
    gap: var(--sp-2);
    padding: var(--sp-4) var(--sp-6);
    background: var(--surface);
    border: 1px solid var(--ok);
    border-radius: var(--r-md);
    font-size: var(--fs-sec);
    color: var(--text);
    line-height: 1.45;
    flex-shrink: 0;
  }
  .complete-summary.show {
    display: flex;
  }
  .complete-summary .cs-item {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: var(--sp-2);
  }
  .complete-summary .cs-num {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--ok);
    color: var(--bg);
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 3px;
  }
</style>

<script>
// ============================================================
// 第 04 页 · 站起来的证据：露西与我们
// ============================================================

(function() {
  'use strict';

  // ---- 初始化底盘 ----
  Deck.init({ index: 4, total: 60 });

  // ---- 挂载页眉 ----
  Lec.mount({
    index: 4,
    kicker: 'COMPARISON',
    title: '站起来的证据：露西与我们',
    take: '南方古猿骨盆和股骨与现代人相似，但更粗壮，适合直立行走'
  });

  // ---- 获取骨学数据 ----
  let afarensis, sapiens;
  try {
    afarensis = Lec.P.getHominidData('australopithecus_afarensis');
    sapiens   = Lec.P.getHominidData('homo_sapiens');
  } catch (e) {
    // 兜底数据
    afarensis = {
      pelvis: { iliac_width: 0.28, iliac_height: 0.18 },
      femur:  { neck_angle: 125, length: 0.32, shaft_diameter: 0.032 },
      knee:   { condyle_shape: 'elliptical' },
      tibia:  { length: 0.29 },
      foot:   { arch_height: 0.012, arch_type: 'longitudinal' },
      stature: 1.1
    };
    sapiens = {
      pelvis: { iliac_width: 0.26, iliac_height: 0.19 },
      femur:  { neck_angle: 130, length: 0.46, shaft_diameter: 0.026 },
      knee:   { condyle_shape: 'elliptical' },
      tibia:  { length: 0.39 },
      foot:   { arch_height: 0.018, arch_type: 'longitudinal_transverse' },
      stature: 1.7
    };
  }

  // ---- 比较维度数据 ----
  const DIMS = [
    {
      id: 'pelvis',
      label: '骨盆',
      afarensisVal: '髂骨短而宽，髂嵴前后延伸',
      sapiensVal:   '髂骨短而宽，髂嵴弯曲',
      common:       '短而宽的盆状结构，适合直立行走时承托内脏',
      annotation:   '骨盆短而宽——直立行走时承托内脏的盆状结构'
    },
    {
      id: 'femur',
      label: '股骨颈',
      afarensisVal: '外翻角约 ' + (afarensis.femur.neck_angle) + '°',
      sapiensVal:   '外翻角约 ' + (sapiens.femur.neck_angle) + '°',
      common:       '外翻角使膝关节靠近身体中线，步态稳定',
      annotation:   '外翻角让膝关节靠近身体中线——步态稳定的关键'
    },
    {
      id: 'knee',
      label: '膝关节',
      afarensisVal: '股骨髁椭圆，可完全伸直',
      sapiensVal:   '股骨髁椭圆，可完全伸直',
      common:       '膝关节锁定机制，站立时无需持续肌肉用力',
      annotation:   '可锁定的膝关节——站立时不需要持续肌肉用力'
    },
    {
      id: 'foot',
      label: '足弓',
      afarensisVal: '有纵弓，但较低（约 ' + (afarensis.foot.arch_height*1000).toFixed(0) + ' mm）',
      sapiensVal:   '有纵弓和横弓（约 ' + (sapiens.foot.arch_height*1000).toFixed(0) + ' mm）',
      common:       '足弓吸收冲击力，适应直立行走',
      annotation:   '足弓吸收冲击——直立行走的减震结构'
    },
    {
      id: 'proportion',
      label: '整体比例',
      afarensisVal: '下肢较短，骨骼粗壮（股骨约 ' + (afarensis.femur.length*100).toFixed(0) + ' cm）',
      sapiensVal:   '下肢较长，骨骼纤细（股骨约 ' + (sapiens.femur.length*100).toFixed(0) + ' cm）',
      common:       '下肢结构布局相同，比例差异反映体型和运动模式',
      annotation:   '结构布局相同，粗细不同——同一套力学方案，不同体型'
    }
  ];

  // ---- 构建比较表 ----
  (function buildTable() {
    const tbl = document.getElementById('comp-table-el');
    for (let i = 0; i < DIMS.length; i++) {
      const d = DIMS[i];
      const dimEl = document.createElement('div');
      dimEl.className = 'dim';
      dimEl.textContent = d.label;

      const afEl = document.createElement('div');
      afEl.textContent = d.afarensisVal;

      const saEl = document.createElement('div');
      saEl.textContent = d.sapiensVal;

      const cmEl = document.createElement('div');
      cmEl.textContent = d.common;

      tbl.appendChild(dimEl);
      tbl.appendChild(afEl);
      tbl.appendChild(saEl);
      tbl.appendChild(cmEl);
    }
  })();

  // ---- 画布 ----
  const cv = document.getElementById('skel-cv');
  const ctx = Deck.fit(cv);
  const W = cv.width;
  const H = cv.height;

  // 画布逻辑分区
  const CX = W * 0.5;       // 中线 x
  const L_REF_X = CX - 140; // 左侧 sapiens 参考位置 x
  const R_START_X = CX + 80; // 右侧 afarensis 起始 x（偏移量）
  const R_TARGET_X = CX + 20; // 右侧 afarensis 目标 x（对齐位置）
  const ALIGN_THRESHOLD = 22; // 对齐阈值（像素）

  // ---- 颜色 ----
  const COL_SAPIENS    = Deck.rgb('accent');       // 蓝色
  const COL_SAPIENS_DIM = Deck.rgba('accent', 0.35);
  const COL_AFARENSIS  = '#f59e0b';                // 琥珀/橙色
  const COL_AFARENSIS_DIM = 'rgba(245,158,11,0.3)';
  const COL_HIGHLIGHT  = Deck.rgb('ok');           // 绿色高亮
  const COL_TEXT_DIM    = Deck.rgba('text', 0.5);
  const COL_GRID        = Deck.rgba('border', 0.4);

  // ---- 骨骼绘制函数 ----
  function drawPelvis(ctx, x, y, scale, style) {
    const w = 60 * scale;
    const h = 40 * scale;
    ctx.save();
    ctx.strokeStyle = style.stroke;
    ctx.fillStyle = style.fill;
    ctx.lineWidth = style.lineWidth || 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 髂骨 - 蝴蝶形
    ctx.beginPath();
    // 左翼
    ctx.moveTo(x - 8, y - h*0.3);
    ctx.bezierCurveTo(x - w*0.6, y - h*0.7, x - w*0.5, y + h*0.5, x - 4, y + h*0.3);
    // 中心缺口
    ctx.lineTo(x - 2, y - h*0.15);
    ctx.lineTo(x + 2, y - h*0.15);
    ctx.lineTo(x + 4, y + h*0.3);
    // 右翼
    ctx.bezierCurveTo(x + w*0.5, y + h*0.5, x + w*0.6, y - h*0.7, x + 8, y - h*0.3);
    ctx.closePath();

    if (style.fill) ctx.fill();
    ctx.stroke();

    // 髂嵴标记线
    ctx.beginPath();
    ctx.strokeStyle = style.stroke;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.moveTo(x - w*0.45, y - h*0.5);
    ctx.lineTo(x + w*0.45, y - h*0.5);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.restore();
  }

  function drawFemurNeck(ctx, x, y, angleDeg, length, style) {
    ctx.save();
    ctx.strokeStyle = style.stroke;
    ctx.fillStyle = style.fill;
    ctx.lineWidth = style.lineWidth || 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const angleRad = (angleDeg - 90) * Math.PI / 180;
    const neckLen = length * 0.35;
    const shaftLen = length * 0.65;

    // 股骨头（球）
    const headX = x + Math.cos(angleRad - 0.5) * neckLen * 0.9;
    const headY = y + Math.sin(angleRad - 0.5) * neckLen * 0.9;
    ctx.beginPath();
    ctx.arc(headX, headY, 8, 0, Math.PI * 2);
    if (style.fill) ctx.fill();
    ctx.stroke();

    // 股骨颈
    const neckStartX = x;
    const neckStartY = y;
    const neckEndX = x + Math.cos(angleRad) * neckLen;
    const neckEndY = y + Math.sin(angleRad) * neckLen;
    ctx.beginPath();
    ctx.moveTo(x - 2, y);
    ctx.lineTo(neckEndX, neckEndY);
    ctx.lineWidth = 6;
    ctx.stroke();

    // 大转子
    ctx.beginPath();
    ctx.arc(x + 3, y - 3, 7, 0, Math.PI * 2);
    ctx.lineWidth = 2;
    if (style.fill) ctx.fill();
    ctx.stroke();

    // 股骨干
    ctx.beginPath();
    ctx.moveTo(neckEndX, neckEndY);
    ctx.lineTo(neckEndX, neckEndY + shaftLen);
    ctx.lineWidth = style.lineWidth || 2.5;
    ctx.stroke();

    // 角度标注弧
    ctx.beginPath();
    ctx.strokeStyle = style.stroke;
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.moveTo(neckEndX, neckEndY + 8);
    ctx.lineTo(neckEndX, neckEndY + shaftLen);
    ctx.stroke();
    ctx.setLineDash([]);

    // 角度文字
    ctx.fillStyle = style.stroke;
    ctx.font = '13px ' + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = 'left';
    ctx.fillText(angleDeg + '°', neckEndX + 8, neckEndY + shaftLen * 0.5);

    ctx.restore();
  }

  function drawKnee(ctx, x, y, style) {
    ctx.save();
    ctx.strokeStyle = style.stroke;
    ctx.fillStyle = style.fill;
    ctx.lineWidth = style.lineWidth || 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 股骨远端（干）
    ctx.beginPath();
    ctx.moveTo(x, y - 30);
    ctx.lineTo(x, y - 8);
    ctx.lineWidth = style.lineWidth || 2.5;
    ctx.stroke();

    // 内髁
    ctx.beginPath();
    ctx.ellipse(x - 9, y, 10, 7, 0, 0, Math.PI * 2);
    if (style.fill) ctx.fill();
    ctx.stroke();

    // 外髁
    ctx.beginPath();
    ctx.ellipse(x + 9, y, 10, 7, 0, 0, Math.PI * 2);
    if (style.fill) ctx.fill();
    ctx.stroke();

    // 髁间窝
    ctx.beginPath();
    ctx.moveTo(x - 3, y - 5);
    ctx.lineTo(x + 3, y - 5);
    ctx.lineWidth = 1;
    ctx.strokeStyle = style.stroke;
    ctx.stroke();

    // 胫骨上端
    ctx.beginPath();
    ctx.moveTo(x, y + 7);
    ctx.lineTo(x, y + 28);
    ctx.lineWidth = style.lineWidth || 2.5;
    ctx.stroke();

    ctx.restore();
  }

  function drawFootArch(ctx, x, y, archHeight, style) {
    ctx.save();
    ctx.strokeStyle = style.stroke;
    ctx.fillStyle = style.fill;
    ctx.lineWidth = style.lineWidth || 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const len = 70;
    const ah = archHeight * 800; // 缩放足弓高度到像素

    // 跟骨
    ctx.beginPath();
    ctx.arc(x - len*0.4, y + 4, 8, 0, Math.PI * 2);
    if (style.fill) ctx.fill();
    ctx.stroke();

    // 足弓曲线
    ctx.beginPath();
    ctx.moveTo(x - len*0.4, y + 4);
    ctx.quadraticCurveTo(x - len*0.05, y - ah, x + len*0.35, y + 2);
    ctx.stroke();

    // 跖骨头
    ctx.beginPath();
    ctx.arc(x + len*0.4, y + 2, 5, 0, Math.PI * 2);
    if (style.fill) ctx.fill();
    ctx.stroke();

    // 地面参考线
    ctx.beginPath();
    ctx.strokeStyle = COL_GRID;
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 5]);
    ctx.moveTo(x - len*0.5, y + 12);
    ctx.lineTo(x + len*0.5, y + 12);
    ctx.stroke();
    ctx.setLineDash([]);

    // 弓高标注
    if (ah > 4) {
      ctx.beginPath();
      ctx.strokeStyle = style.stroke;
      ctx.lineWidth = 0.8;
      ctx.setLineDash([2, 3]);
      const archX = x - len*0.05;
      ctx.moveTo(archX, y + 12);
      ctx.lineTo(archX, y - ah);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();
  }

  function drawProportion(ctx, x, y, femurLen, tibiaLen, style) {
    ctx.save();
    ctx.strokeStyle = style.stroke;
    ctx.fillStyle = style.fill;
    ctx.lineWidth = style.lineWidth || 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const totalLen = femurLen + tibiaLen;
    const scale = 110 / totalLen; // 缩放到约110px
    const fLen = femurLen * scale;
    const tLen = tibiaLen * scale;

    // 骨盆示意
    ctx.beginPath();
    ctx.moveTo(x - 15, y);
    ctx.lineTo(x + 15, y);
    ctx.lineWidth = 4;
    ctx.stroke();

    // 股骨
    ctx.beginPath();
    ctx.lineWidth = style.lineWidth || 2.5;
    ctx.moveTo(x, y);
    ctx.lineTo(x + 8, y + fLen * 0.6);
    ctx.lineTo(x + 4, y + fLen);
    ctx.stroke();

    // 膝关节
    ctx.beginPath();
    ctx.arc(x + 4, y + fLen, 5, 0, Math.PI * 2);
    if (style.fill) ctx.fill();
    ctx.stroke();

    // 胫骨
    ctx.beginPath();
    ctx.moveTo(x + 4, y + fLen);
    ctx.lineTo(x + 2, y + fLen + tLen);
    ctx.stroke();

    // 足
    ctx.beginPath();
    ctx.moveTo(x - 4, y + fLen + tLen);
    ctx.lineTo(x + 12, y + fLen + tLen + 2);
    ctx.lineWidth = 3;
    ctx.stroke();

    // 总长标注
    ctx.fillStyle = style.stroke;
    ctx.font = '13px ' + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = 'left';
    ctx.fillText((totalLen * 100).toFixed(0) + ' cm', x + 20, y + fLen + tLen * 0.5);

    ctx.restore();
  }

  // ---- 绘制函数索引 ----
  const DRAW_FNS = [drawPelvis, drawFemurNeck, drawKnee, drawFootArch, drawProportion];

  // ---- 每个阶段的骨骼绘制参数 ----
  function getDrawParams(stageIdx, isAfarensis) {
    const baseY = H * 0.5 + 10;
    const x = isAfarensis ? R_START_X : L_REF_X;
    const style = isAfarensis
      ? { stroke: COL_AFARENSIS, fill: COL_AFARENSIS_DIM, lineWidth: 2.5 }
      : { stroke: COL_SAPIENS, fill: COL_SAPIENS_DIM, lineWidth: 2.5 };

    switch (stageIdx) {
      case 0: // pelvis
        return { fn: 0, args: [x, baseY - 20, isAfarensis ? 1.15 : 1.0, style] };
      case 1: // femur
        return { fn: 1, args: [x, baseY - 50, isAfarensis ? afarensis.femur.neck_angle : sapiens.femur.neck_angle, isAfarensis ? 55 : 65, style] };
      case 2: // knee
        return { fn: 2, args: [x, baseY - 5, style] };
      case 3: // foot
        return { fn: 3, args: [x, baseY + 20, isAfarensis ? afarensis.foot.arch_height : sapiens.foot.arch_height, style] };
      case 4: // proportion
        return { fn: 4, args: [x, baseY - 50, isAfarensis ? afarensis.femur.length : sapiens.femur.length, isAfarensis ? afarensis.tibia.length : sapiens.tibia.length, style] };
      default:
        return { fn: 0, args: [x, baseY, 1.0, style] };
    }
  }

  // ---- Matter.js 物理引擎 ----
  const { Engine, World, Bodies, Body, Constraint, Composite, Events } = Matter;

  const engine = Engine.create({
    gravity: { x: 0, y: 0 }
  });

  // 为每个阶段创建一个可拖拽的 body
  const bodies = [];
  const anchors = []; // 原始位置的锚点（用于弹簧回弹）
  const BODY_W = 60;
  const BODY_H = 100;

  for (let i = 0; i < 5; i++) {
    const body = Bodies.rectangle(R_START_X, H * 0.5 + 10, BODY_W, BODY_H, {
      isStatic: false,
      frictionAir: 0.15,
      render: { visible: false }
    });
    const anchor = Bodies.circle(R_START_X, H * 0.5 + 10, 2, {
      isStatic: true,
      render: { visible: false }
    });
    bodies.push(body);
    anchors.push(anchor);
  }

  Composite.add(engine.world, [...bodies, ...anchors]);

  // 当前活动的弹簧约束
  let activeSpring = null;

  // ---- 交互状态 ----
  let currentStage = 0;
  let isDragging = false;
  let dragBody = null;
  let dragOffsetX = 0;
  let dragOffsetY = 0;
  let stagesLocked = [false, false, false, false, false];
  let allComplete = false;

  // ---- 阶段指示器更新 ----
  function updateStageUI() {
    const dots = document.querySelectorAll('#stage-bar .stage-dot');
    const label = document.getElementById('stage-label');
    dots.forEach((dot, i) => {
      dot.classList.remove('active', 'done');
      if (stagesLocked[i]) dot.classList.add('done');
      if (i === currentStage && !allComplete) dot.classList.add('active');
    });
    if (!allComplete) {
      label.textContent = DIMS[currentStage].label;
    } else {
      label.textContent = '全部对齐 ✓';
    }
  }

  // ---- 锁定当前阶段 ----
  function lockStage() {
    stagesLocked[currentStage] = true;

    const dim = DIMS[currentStage];
    const hint = document.getElementById('hint');
    hint.textContent = '✓ ' + dim.annotation;

    if (currentStage < 4) {
      currentStage++;
      // 重置下一个 body 到起始位置
      Body.setPosition(bodies[currentStage], { x: R_START_X, y: H * 0.5 + 10 });
      hint.textContent += '  → 继续拖拽：' + DIMS[currentStage].label;
    } else {
      // 全部完成
      allComplete = true;
      hint.textContent = '✓ 五个部位全部对齐！两具骨架的结构布局高度一致，粗细不同反映了力量和体重的差异。';
      document.getElementById('photo-pair').classList.add('show');
      document.getElementById('complete-summary').classList.add('show');
    }
    updateStageUI();
  }

  // ---- 对齐检查 ----
  function checkAlignment(bodyIndex) {
    const body = bodies[bodyIndex];
    const dx = Math.abs(body.position.x - R_TARGET_X);
    return dx < ALIGN_THRESHOLD;
  }

  // ---- 弹簧回弹 ----
  function springBack(bodyIndex) {
    const body = bodies[bodyIndex];
    const anchor = anchors[bodyIndex];

    // 移除已有弹簧
    if (activeSpring) {
      Composite.remove(engine.world, activeSpring);
    }

    activeSpring = Constraint.create({
      pointA: { x: anchor.position.x, y: anchor.position.y },
      bodyB: body,
      pointB: { x: 0, y: 0 },
      stiffness: 0.03,
      damping: 0.08,
      length: 0
    });
    Composite.add(engine.world, activeSpring);

    // 短暂振动后移除弹簧并复位
    setTimeout(() => {
      if (activeSpring) {
        Composite.remove(engine.world, activeSpring);
        activeSpring = null;
      }
      Body.setPosition(body, { x: R_START_X, y: H * 0.5 + 10 });
      Body.setVelocity(body, { x: 0, y: 0 });
    }, 600);
  }

  // ---- 指针事件 ----
  function getCanvasPos(e) {
    const pt = Deck.pt(cv, e);
    return { x: pt.x, y: pt.y };
  }

  function findBodyAt(pos) {
    if (allComplete) return -1;
    const body = bodies[currentStage];
    const bx = body.position.x;
    const by = body.position.y;
    if (Math.abs(pos.x - bx) < BODY_W && Math.abs(pos.y - by) < BODY_H) {
      return currentStage;
    }
    return -1;
  }

  cv.addEventListener('mousedown', function(e) {
    if (allComplete) return;
    const pos = getCanvasPos(e);
    const idx = findBodyAt(pos);
    if (idx >= 0) {
      isDragging = true;
      dragBody = bodies[idx];
      dragOffsetX = dragBody.position.x - pos.x;
      dragOffsetY = dragBody.position.y - pos.y;
      Body.setStatic(dragBody, true);
      // 移除弹簧
      if (activeSpring) {
        Composite.remove(engine.world, activeSpring);
        activeSpring = null;
      }
      cv.style.cursor = 'grabbing';
    }
  });

  cv.addEventListener('mousemove', function(e) {
    const pos = getCanvasPos(e);
    if (isDragging && dragBody) {
      Body.setPosition(dragBody, {
        x: pos.x + dragOffsetX,
        y: pos.y + dragOffsetY
      });
    } else if (!allComplete && !isDragging) {
      const idx = findBodyAt(pos);
      cv.style.cursor = idx >= 0 ? 'grab' : 'default';
    }
  });

  cv.addEventListener('mouseup', function(e) {
    if (!isDragging || !dragBody) return;
    isDragging = false;
    Body.setStatic(dragBody, false);
    cv.style.cursor = 'default';

    const idx = currentStage;
    if (checkAlignment(idx)) {
      // 对齐成功 → 吸附
      Body.setPosition(dragBody, { x: R_TARGET_X, y: dragBody.position.y });
      Body.setVelocity(dragBody, { x: 0, y: 0 });
      lockStage();
    } else {
      // 对齐失败 → 弹簧回弹
      springBack(idx);
      const hint = document.getElementById('hint');
      hint.textContent = '↺ 未对齐，请再试一次。拖拽到靠近左侧参考位置。';
    }
    dragBody = null;
  });

  cv.addEventListener('mouseleave', function(e) {
    if (isDragging && dragBody) {
      isDragging = false;
      Body.setStatic(dragBody, false);
      cv.style.cursor = 'default';
      const idx = currentStage;
      if (checkAlignment(idx)) {
        Body.setPosition(dragBody, { x: R_TARGET_X, y: dragBody.position.y });
        Body.setVelocity(dragBody, { x: 0, y: 0 });
        lockStage();
      } else {
        springBack(idx);
        const hint = document.getElementById('hint');
        hint.textContent = '↺ 未对齐，请再试一次。拖拽到靠近左侧参考位置。';
      }
      dragBody = null;
    }
  });

  // 触摸支持
  cv.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (allComplete) return;
    const pos = getCanvasPos(e.touches[0]);
    const idx = findBodyAt(pos);
    if (idx >= 0) {
      isDragging = true;
      dragBody = bodies[idx];
      dragOffsetX = dragBody.position.x - pos.x;
      dragOffsetY = dragBody.position.y - pos.y;
      Body.setStatic(dragBody, true);
      if (activeSpring) {
        Composite.remove(engine.world, activeSpring);
        activeSpring = null;
      }
    }
  }, { passive: false });

  cv.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (isDragging && dragBody) {
      const pos = getCanvasPos(e.touches[0]);
      Body.setPosition(dragBody, {
        x: pos.x + dragOffsetX,
        y: pos.y + dragOffsetY
      });
    }
  }, { passive: false });

  cv.addEventListener('touchend', function(e) {
    if (!isDragging || !dragBody) return;
    isDragging = false;
    Body.setStatic(dragBody, false);
    const idx = currentStage;
    if (checkAlignment(idx)) {
      Body.setPosition(dragBody, { x: R_TARGET_X, y: dragBody.position.y });
      Body.setVelocity(dragBody, { x: 0, y: 0 });
      lockStage();
    } else {
      springBack(idx);
      const hint = document.getElementById('hint');
      hint.textContent = '↺ 未对齐，请再试一次。拖拽到靠近左侧参考位置。';
    }
    dragBody = null;
  });

  // ---- 绘制循环 ----
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 背景网格
    ctx.strokeStyle = COL_GRID;
    ctx.lineWidth = 0.5;
    for (let gx = 40; gx < W; gx += 40) {
      ctx.beginPath();
      ctx.moveTo(gx, 0);
      ctx.lineTo(gx, H);
      ctx.stroke();
    }
    for (let gy = 40; gy < H; gy += 40) {
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.lineTo(W, gy);
      ctx.stroke();
    }

    // 中线
    ctx.strokeStyle = Deck.rgba('border-strong', 0.5);
    ctx.lineWidth = 1;
    ctx.setLineDash([8, 12]);
    ctx.beginPath();
    ctx.moveTo(CX, 20);
    ctx.lineTo(CX, H - 20);
    ctx.stroke();
    ctx.setLineDash([]);

    // 标签
    ctx.fillStyle = Deck.rgb('text-dim');
    ctx.font = '13px ' + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = 'center';
    ctx.fillText('Homo sapiens', L_REF_X, 28);
    ctx.fillText('Australopithecus afarensis', R_START_X, 28);
    ctx.fillText('(AL 288-1)', R_START_X, 44);

    // 绘制 sapiens 参考（所有阶段已锁定的 + 当前阶段）
    for (let i = 0; i < 5; i++) {
      if (i === currentStage || stagesLocked[i]) {
        const p = getDrawParams(i, false);
        DRAW_FNS[p.fn](ctx, ...p.args);
      }
    }

    // 绘制 afarensis（当前阶段跟随 body 位置，已锁定的在目标位置）
    for (let i = 0; i < 5; i++) {
      if (stagesLocked[i]) {
        // 已锁定：画在目标位置
        const p = getDrawParams(i, true);
        const adjArgs = [...p.args];
        adjArgs[0] = R_TARGET_X; // 覆盖 x 坐标
        // 高亮样式
        const hlStyle = { stroke: COL_HIGHLIGHT, fill: 'rgba(52,211,153,0.2)', lineWidth: 3 };
        adjArgs[adjArgs.length - 1] = hlStyle;
        DRAW_FNS[p.fn](ctx, ...adjArgs);
      } else if (i === currentStage && !allComplete) {
        // 当前阶段：跟随 body
        const p = getDrawParams(i, true);
        const body = bodies[i];
        const adjArgs = [...p.args];
        adjArgs[0] = body.position.x;
        DRAW_FNS[p.fn](ctx, ...adjArgs);
      }
    }

    // 对齐目标区域（当前阶段）
    if (!allComplete) {
      ctx.strokeStyle = Deck.rgba('accent', 0.3);
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 6]);
      const tx = R_TARGET_X;
      const ty = H * 0.5 + 10;
      ctx.beginPath();
      ctx.roundRect(tx - BODY_W/2 - 5, ty - BODY_H/2 - 5, BODY_W + 10, BODY_H + 10, 8);
      ctx.stroke();
      ctx.setLineDash([]);

      // 小箭头提示
      ctx.fillStyle = Deck.rgba('accent', 0.5);
      ctx.font = '16px ' + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = 'center';
      ctx.fillText('←  拖到此处对齐  ←', tx, ty - BODY_H/2 - 16);
    }

    // 完工叠加
    if (allComplete) {
      // 全部对齐提示
      ctx.fillStyle = Deck.rgba('ok', 0.12);
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = Deck.rgb('ok');
      ctx.font = 'bold 18px ' + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = 'center';
      ctx.fillText('结构相同，粗细不同', CX, H - 20);

      // 差异标注
      const afBody = bodies[4];
      ctx.fillStyle = COL_AFARENSIS;
      ctx.font = '13px ' + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = 'right';
      ctx.fillText('更粗壮', R_TARGET_X + BODY_W/2 + 10, H * 0.5 - 20);

      ctx.fillStyle = COL_SAPIENS;
      ctx.textAlign = 'left';
      ctx.fillText('更纤细', L_REF_X - BODY_W/2 - 10, H * 0.5 - 20);
    }
  }

  // ---- 动画循环 ----
  const reduced = Deck.reduced();

  Deck.loop(function() {
    if (!reduced) {
      Engine.update(engine, 1000 / 60);
    }
    draw();
  });

  // ---- 初始化 ----
  updateStageUI();

})();
</script>
</body>
</html>
