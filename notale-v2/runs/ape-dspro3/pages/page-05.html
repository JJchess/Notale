<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第 05 页 · 互动讲义</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* ============================================================
       Page 05 — 四种猿人下肢 · classification
       ============================================================ */

    /* 整体纵向布局 */
    #main {
      display: flex;
      flex-direction: column;
      gap: var(--sp-6);
      height: 100%;
    }

    /* 顶部导语 */
    .p05-intro {
      font-size: var(--fs-sec);
      color: var(--text-sec);
      line-height: 1.55;
      padding: 0 var(--sp-2);
      flex-shrink: 0;
      max-width: 100%;
    }

    /* 分类骨架内的四卡片行 */
    .p05-cards {
      display: flex;
      flex-direction: row;
      gap: var(--sp-4);
      flex: 1 1 0%;
      min-height: 0;
      align-items: flex-start;
    }

    /* 让 .k-classification 在 #main 的 flex 布局中撑满 */
    #main > .k-classification {
      flex: 1 1 0%;
      min-height: 0;
    }

    /* 单张卡片 —— 基于 .box,追加过渡 */
    .p05-card {
      flex: 1 1 0%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: flex 400ms var(--ease), opacity 300ms var(--ease);
      position: relative;
    }

    .p05-card:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    /* 选中态 */
    .p05-card.is-active {
      flex: 1.6 1 0%;
      cursor: default;
      border-color: var(--accent-soft);
      box-shadow: 0 0 0 1px var(--accent), var(--shadow-md);
    }

    .p05-card.is-dim {
      opacity: 0.55;
    }

    /* 插图区 */
    .p05-illust {
      width: 100%;
      aspect-ratio: 1 / 1;
      position: relative;
      background: #1a1e28;
      border-radius: var(--r-sm);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .p05-illust img {
      width: 85%;
      height: 85%;
      object-fit: contain;
      filter: invert(0.92) brightness(1.05);
      transition: transform 400ms var(--ease);
    }

    .p05-card.is-active .p05-illust img {
      transform: scale(1.08);
    }

    /* 股骨角标注 —— 叠在插图上 */
    .p05-angle-mark {
      position: absolute;
      top: 18%;
      right: 12%;
      width: 48px;
      height: 48px;
      opacity: 0;
      transition: opacity 300ms var(--ease);
      pointer-events: none;
    }

    .p05-card.is-active .p05-angle-mark {
      opacity: 0.9;
    }

    .p05-angle-mark svg {
      width: 100%;
      height: 100%;
    }

    /* 足弓标注 */
    .p05-arch-mark {
      position: absolute;
      bottom: 22%;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 24px;
      opacity: 0;
      transition: opacity 300ms var(--ease);
      pointer-events: none;
    }

    .p05-card.is-active .p05-arch-mark {
      opacity: 0.85;
    }

    .p05-arch-mark svg {
      width: 100%;
      height: 100%;
    }

    /* 物种名 */
    .p05-name {
      font-size: var(--fs-h2);
      font-weight: 600;
      color: var(--text);
      text-align: center;
      padding: var(--sp-3) 0 var(--sp-1);
      flex-shrink: 0;
      transition: color 300ms var(--ease);
    }

    .p05-card.is-active .p05-name {
      color: var(--accent);
    }

    .p05-latin {
      font-size: 14px;
      color: var(--text-dim);
      text-align: center;
      font-style: italic;
      flex-shrink: 0;
      margin-bottom: var(--sp-2);
    }

    /* 特征列表 —— 默认折叠，用 display:none 避免裁剪 */
    .p05-features {
      display: none;
      flex-direction: column;
      gap: var(--sp-3);
      width: 100%;
      padding: var(--sp-4) var(--sp-4);
      opacity: 0;
      transition: opacity 300ms var(--ease);
    }

    .p05-card.is-active .p05-features {
      display: flex;
      opacity: 1;
    }

    /* 单条特征 */
    .p05-feat {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: var(--sp-2);
      font-size: var(--fs-sec);
      line-height: 1.4;
    }

    .p05-feat-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin-top: 1px;
      color: var(--accent-soft);
    }

    .p05-feat-label {
      color: var(--text-dim);
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .p05-feat-val {
      color: var(--text);
      flex: 1 1 0%;
      min-width: 0;
    }

    .p05-feat-val em {
      font-style: normal;
      color: var(--accent);
      font-weight: 600;
    }

    /* 底部提示 */
    .p05-hint {
      font-size: var(--fs-label);
      color: var(--text-dim);
      text-align: center;
      flex-shrink: 0;
      letter-spacing: 0.03em;
    }

    /* reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .p05-card,
      .p05-card.is-active .p05-features,
      .p05-card.is-active .p05-illust img,
      .p05-card.is-active .p05-angle-mark,
      .p05-card.is-active .p05-arch-mark {
        transition: none;
      }
    }
  </style>
</head>
<body data-page="05" data-total="60">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  /* ==============================================================
     Page 05 — 四种猿人下肢骨骼特征
     Knowledge structure: classification
     四个并列的物种卡片，点选展开查看下肢特征细节
     ============================================================== */

  Deck.init({ index: 5, total: 60 });

  /* ---- 物种数据 ----
     数值来源：p05.md 规划规格。
     Lec.P.getHominidData 返回 height/mass/brainVolume，
     下肢特征（股骨角、足弓、胫骨）由本页按规划定义。
  */
  var SPECIES = [
    {
      key: 'homo_habilis',
      name: '能人',
      latin: 'Homo habilis',
      img: 'assets/img/p05-habilis.png',
      femoralAngle: '9–11°',
      femoralNote: '比南方古猿略大，仍小于现代人',
      footArch: '纵弓开始出现',
      footArchNote: '横弓不发达，脚印仍显扁平',
      tibia: '胫骨平台较小',
      tibiaNote: '膝关节稳定性有限'
    },
    {
      key: 'homo_erectus',
      name: '直立人',
      latin: 'Homo erectus',
      img: 'assets/img/p05-erectus.png',
      femoralAngle: '11–13°',
      femoralNote: '接近现代人，双脚更靠近中线',
      footArch: '纵弓与横弓完全发育',
      footArchNote: '足印与现代人几乎无异',
      tibia: '胫骨粗壮',
      tibiaNote: '适合长距离奔跑，保留原始特征'
    },
    {
      key: 'homo_neanderthalensis',
      name: '尼安德特人',
      latin: 'Homo neanderthalensis',
      img: 'assets/img/p05-neanderthal.png',
      femoralAngle: '12–14°',
      femoralNote: '股骨颈粗短，适应寒冷气候',
      footArch: '高而坚固的足弓',
      footArchNote: '承受较大体重和冲击，弹性不如智人',
      tibia: '胫骨短而粗',
      tibiaNote: '膝关节面大，稳定性高'
    },
    {
      key: 'homo_sapiens',
      name: '智人',
      latin: 'Homo sapiens',
      img: 'assets/img/p05-sapiens.png',
      femoralAngle: '12–15°',
      femoralNote: '现代人均值约13°，高效行走与奔跑',
      footArch: '弹性足弓',
      footArchNote: '纵弓与横弓协同，吸收冲击，提高效率',
      tibia: '胫骨细长',
      tibiaNote: '关节面优化，减少能量消耗'
    }
  ];

  /* ---- 尝试从 Lec 获取身高体重数据以丰富展示 ---- */
  var LEC_KEYS = {
    'homo_habilis': 'homo_habilis',
    'homo_erectus': 'homo_erectus',
    'homo_neanderthalensis': 'homo_neanderthalensis',
    'homo_sapiens': 'homo_sapiens_early'
  };

  SPECIES.forEach(function(sp) {
    try {
      var d = Lec.P.getHominidData(LEC_KEYS[sp.key]);
      sp.height = d.height;
      sp.mass = d.mass;
    } catch(e) {
      sp.height = null;
      sp.mass = null;
    }
  });

  /* ---- 构建 DOM ---- */
  var main = document.getElementById('main');

  /* 页头 */
  Lec.mount({
    index: 5,
    kicker: '第一章 · 身体遗产',
    title: '四种猿人的下肢',
    take: '股骨角与足弓，每种猿人都有独特的组合'
  });

  /* 顶部导语 —— 三句必须点出来的话 */
  var intro = document.createElement('div');
  intro.className = 'p05-intro';
  intro.innerHTML =
    '股骨角和足弓是区分猿人下肢运动方式的关键标尺，每种猿人都有独特的组合。' +
    '能人已开始出现足弓，但直立人才真正完善了现代人的行走结构；尼安德特人则走出了另一条粗壮路线。' +
    '智人的下肢是这些特征中最均衡的：既适合行走，也适合奔跑，弹性足弓让我们能跳得更高——但这一页我们不谈跳跃。';
  main.appendChild(intro);

  /* 卡片行 —— 放在 .k-classification 骨架内 */
  var classif = document.createElement('div');
  classif.className = 'k-classification';
  var cardsRow = document.createElement('div');
  cardsRow.className = 'p05-cards';
  classif.appendChild(cardsRow);
  main.appendChild(classif);

  /* 股骨角标注 SVG（复用于每张卡片）—— 无文字，纯图形 */
  function angleMarkSVG() {
    return '<svg viewBox="0 0 60 60">' +
      '<line x1="30" y1="4" x2="30" y2="56" stroke="#60a5fa" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.7"/>' +
      '<line x1="30" y1="56" x2="42" y2="8" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/>' +
      '<path d="M 30 38 A 14 14 0 0 0 35 25" fill="none" stroke="#60a5fa" stroke-width="1.5"/>' +
      '<circle cx="35" cy="25" r="2.5" fill="#60a5fa" opacity="0.8"/>' +
      '</svg>';
  }

  /* 足弓标注 SVG */
  function archMarkSVG() {
    return '<svg viewBox="0 0 100 30">' +
      '<path d="M 5 28 Q 25 8, 50 8 Q 75 8, 95 28" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.8"/>' +
      '<line x1="5" y1="28" x2="95" y2="28" stroke="#e6edf5" stroke-width="0.6" stroke-dasharray="4,4" opacity="0.5"/>' +
      '<circle cx="5" cy="28" r="2" fill="#60a5fa" opacity="0.7"/>' +
      '<circle cx="95" cy="28" r="2" fill="#60a5fa" opacity="0.7"/>' +
      '</svg>';
  }

  /* 特征图标 SVG */
  function iconAngle() {
    return '<svg viewBox="0 0 18 18" width="18" height="18"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.2"/><line x1="9" y1="9" x2="9" y2="3" stroke="currentColor" stroke-width="1.2"/><line x1="9" y1="9" x2="14" y2="6" stroke="currentColor" stroke-width="1.2"/><path d="M 9 10 A 5 5 0 0 0 12 7" fill="none" stroke="currentColor" stroke-width="0.8"/></svg>';
  }

  function iconFoot() {
    return '<svg viewBox="0 0 18 18" width="18" height="18"><path d="M 3 14 Q 7 6, 9 6 Q 11 6, 15 14" fill="none" stroke="currentColor" stroke-width="1.2"/><line x1="3" y1="14" x2="15" y2="14" stroke="currentColor" stroke-width="0.6" stroke-dasharray="2,2"/></svg>';
  }

  function iconBone() {
    return '<svg viewBox="0 0 18 18" width="18" height="18"><rect x="4" y="2" width="4" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="6" cy="3" r="2" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="6" cy="15" r="2" fill="none" stroke="currentColor" stroke-width="1"/></svg>';
  }

  /* 构建每张卡片 */
  var cardEls = [];
  var activeIdx = -1;

  SPECIES.forEach(function(sp, i) {
    var card = document.createElement('div');
    card.className = 'box p05-card';
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'button');
    card.setAttribute('aria-expanded', 'false');
    card.setAttribute('aria-label', sp.name + ' — 点击查看下肢特征');

    /* 插图区 */
    var illust = document.createElement('div');
    illust.className = 'p05-illust';
    var img = document.createElement('img');
    img.src = sp.img;
    img.alt = sp.name + ' 下肢骨骼线稿';
    img.loading = 'lazy';
    illust.appendChild(img);

    /* 股骨角标注 */
    var angleMark = document.createElement('div');
    angleMark.className = 'p05-angle-mark';
    angleMark.innerHTML = angleMarkSVG();
    illust.appendChild(angleMark);

    /* 足弓标注 */
    var archMark = document.createElement('div');
    archMark.className = 'p05-arch-mark';
    archMark.innerHTML = archMarkSVG();
    illust.appendChild(archMark);

    card.appendChild(illust);

    /* 物种名 */
    var nameEl = document.createElement('div');
    nameEl.className = 'p05-name';
    nameEl.textContent = sp.name;
    card.appendChild(nameEl);

    var latinEl = document.createElement('div');
    latinEl.className = 'p05-latin';
    latinEl.textContent = sp.latin;
    card.appendChild(latinEl);

    /* 特征列表 */
    var features = document.createElement('div');
    features.className = 'p05-features';

    /* 股骨角 */
    var f1 = document.createElement('div');
    f1.className = 'p05-feat';
    f1.innerHTML =
      '<span class="p05-feat-icon">' + iconAngle() + '</span>' +
      '<span class="p05-feat-label">股骨角</span>' +
      '<span class="p05-feat-val"><em>' + sp.femoralAngle + '</em> · ' + sp.femoralNote + '</span>';
    features.appendChild(f1);

    /* 足弓 */
    var f2 = document.createElement('div');
    f2.className = 'p05-feat';
    f2.innerHTML =
      '<span class="p05-feat-icon">' + iconFoot() + '</span>' +
      '<span class="p05-feat-label">足弓</span>' +
      '<span class="p05-feat-val"><em>' + sp.footArch + '</em> · ' + sp.footArchNote + '</span>';
    features.appendChild(f2);

    /* 胫骨 */
    var f3 = document.createElement('div');
    f3.className = 'p05-feat';
    f3.innerHTML =
      '<span class="p05-feat-icon">' + iconBone() + '</span>' +
      '<span class="p05-feat-label">胫骨</span>' +
      '<span class="p05-feat-val"><em>' + sp.tibia + '</em> · ' + sp.tibiaNote + '</span>';
    features.appendChild(f3);

    card.appendChild(features);

    /* 点击事件 */
    card.addEventListener('click', function() {
      if (activeIdx === i) {
        /* 再次点击已选中的卡片 → 收起 */
        setActive(-1);
      } else {
        setActive(i);
      }
    });

    card.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        card.click();
      }
    });

    cardsRow.appendChild(card);
    cardEls.push(card);
  });

  /* 底部操作提示 */
  var hint = document.createElement('div');
  hint.className = 'p05-hint';
  hint.textContent = '点击任意卡片，查看该物种的下肢特征细节';
  main.appendChild(hint);

  /* ---- 交互逻辑 ---- */
  function setActive(idx) {
    activeIdx = idx;
    cardEls.forEach(function(el, i) {
      if (i === idx) {
        el.classList.add('is-active');
        el.classList.remove('is-dim');
        el.setAttribute('aria-expanded', 'true');
      } else {
        el.classList.remove('is-active');
        if (idx >= 0) {
          el.classList.add('is-dim');
        } else {
          el.classList.remove('is-dim');
        }
        el.setAttribute('aria-expanded', 'false');
      }
    });
  }

  /* 默认展开第一个卡片，让读者看到交互效果 */
  setActive(0);

})();
</script>
</body>
</html>
