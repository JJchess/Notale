<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第 06 页 · 互动讲义</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* ============================================================
       Page 06 — 演化树时间线 · 专属样式
       ============================================================ */

    #main {
      position: relative;
      width: 1408px;
      height: 620px;
      overflow: hidden;
    }

    /* ---- 背景层 ---- */
    .bg-layer {
      position: absolute;
      inset: 0;
    }
    .bg-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .bg-layer .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(11,17,25,0.55) 0%,
        rgba(11,17,25,0.65) 40%,
        rgba(11,17,25,0.78) 100%
      );
    }

    /* ---- SVG 树层 ---- */
    .tree-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 1408px;
      height: 480px;
      display: block;
    }

    /* ---- 时间轴 + 环境事件在 SVG 内 ---- */

    /* ---- 底部控件区 ---- */
    .bottom-zone {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1408px;
      height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 8px;
      gap: 6px;
      box-sizing: border-box;
      pointer-events: none;
    }
    .bottom-zone > * {
      pointer-events: auto;
    }

    /* ---- 滑块 ---- */
    .time-slider-wrap {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: var(--sp-4);
    }
    .time-slider-wrap label {
      font-size: var(--fs-label);
      color: var(--text-sec);
      white-space: nowrap;
    }
    .time-slider-wrap input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 420px;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }
    .time-slider-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--text);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(77,166,255,0.4);
    }
    .time-slider-wrap input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--text);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(77,166,255,0.4);
    }
    .time-slider-wrap input[type="range"]:focus-visible {
      box-shadow: 0 0 0 2px rgba(96,165,250,0.25);
    }
    .time-slider-wrap .slider-val {
      font-size: var(--fs-label);
      color: var(--accent);
      font-weight: 600;
      min-width: 72px;
      text-align: center;
      white-space: nowrap;
    }

    /* ---- 操作提示 ---- */
    .hint {
      font-size: var(--fs-label);
      color: var(--text-dim);
      text-align: center;
      white-space: nowrap;
    }

    /* ---- 图注浮动句 ---- */
    .floating-note {
      position: absolute;
      font-size: var(--fs-sec);
      color: var(--text);
      background: rgba(17,26,38,0.92);
      border: 1px solid var(--border-strong);
      border-radius: var(--r-sm);
      padding: 8px 14px;
      line-height: 1.45;
      max-width: 340px;
      pointer-events: none;
      transition: opacity 500ms var(--ease);
      box-shadow: var(--shadow-md);
    }
    .floating-note .hl {
      color: var(--accent);
      font-weight: 600;
    }

    @media (prefers-reduced-motion: reduce) {
      .floating-note {
        transition: none;
      }
    }
  </style>
</head>
<body data-page="06" data-total="60">
<div id="stage">
<main id="main">

  <!-- 背景层 -->
  <div class="bg-layer">
    <img src="assets/img/p06-bg.png" alt="">
    <div class="overlay"></div>
  </div>

  <!-- 演化树 SVG 层 -->
  <svg class="tree-layer" id="tree-svg" aria-label="人类下肢演化树时间线，从 7 百万年前到现代"></svg>

  <!-- 浮动注释 -->
  <div class="floating-note" id="note-env" style="left:60px; top:60px; opacity:0;">
    开阔环境的<span class="hl">扩张</span>是推动直立行走和奔跑适应的关键力量，不是某个物种「决定」走向草原。
  </div>
  <div class="floating-note" id="note-sapiens" style="left:60px; top:280px; opacity:0;">
    我们（<span class="hl">智人</span>）是这棵树上唯一存活至今的支系，但我们的身体里保留着数百万年演化树的分支遗产。
  </div>

  <!-- 底部控件区 -->
  <div class="bottom-zone">
    <div class="time-slider-wrap">
      <label for="time-slider">7 Ma 前</label>
      <input type="range" id="time-slider" min="0" max="100" value="0" step="0.5" aria-label="演化时间线滑块">
      <span class="slider-val" id="slider-val">7.0 Ma</span>
      <label for="time-slider">现代</label>
    </div>
    <div class="hint">← 拖动滑块，看演化树如何逐段展开 →</div>
  </div>

</main>
</div>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function() {
  'use strict';

  /* ==============================================================
     Deck 初始化
     ============================================================== */
  Deck.init({ index: 6, total: 60 });

  /* ==============================================================
     Lec.mount — 页眉页脚
     ============================================================== */
  Lec.mount({
    index: 6,
    kicker: '第一章 · 身体遗产',
    title: '演化树时间线',
    take: '下肢演化不是一条「从猿到人」的直线，而是一棵多分支的树，多数分支已经灭绝。'
  });

  /* ==============================================================
     数据定义
     ============================================================== */

  // 演化树节点（扁平结构，parentId 建树）
  const rawNodes = [
    { id: 'root',    name: '人猿共同祖先',       time: 7.0, parentId: null,     extinct: false, extTime: null,  desc: '与黑猩猩支系分离，主干起点' },
    { id: 'ardi',    name: '地猿始祖种',         time: 4.4, parentId: 'root',   extinct: true,  extTime: 4.0,  desc: '盆骨显示仍能攀爬，但已能直立行走' },
    { id: 'austra',  name: '南方古猿属',         time: 4.0, parentId: 'root',   extinct: false, extTime: null,  desc: '多分支辐射：阿法种、非洲种、源泉种' },
    { id: 'lucy',    name: '露西 AL 288-1',      time: 3.2, parentId: 'austra', extinct: true,  extTime: 2.0,  desc: '骨盆和股骨已适应直立行走，仍保留长臂' },
    { id: 'paranth', name: '傍人属',             time: 2.0, parentId: 'austra', extinct: true,  extTime: 1.2,  desc: '粗壮型南方古猿分支，咀嚼适应，灭绝侧枝' },
    { id: 'homo',    name: '人属',               time: 2.8, parentId: 'austra', extinct: false, extTime: null,  desc: '从南方古猿支系中分出，脑容量开始增大' },
    { id: 'habilis', name: '能人',               time: 2.5, parentId: 'homo',   extinct: true,  extTime: 1.5,  desc: '脑容量更大，但下肢比例仍接近南方古猿' },
    { id: 'erectus', name: '直立人',             time: 1.8, parentId: 'homo',   extinct: true,  extTime: 0.1,  desc: '长腿、足弓完整、完全适应地面直立行走和奔跑' },
    { id: 'neander', name: '尼安德特人',         time: 1.0, parentId: 'erectus',extinct: true,  extTime: 0.04, desc: '适应寒冷气候，部分基因流入现代人' },
    { id: 'sapiens', name: '智人',               time: 0.3, parentId: 'erectus',extinct: false, extTime: null,  desc: '现代人骨骼比例，耐力奔跑优化' }
  ];

  // 环境事件
  const envEvents = [
    { time: 7.5, label: '东非大裂谷形成', detail: '森林栖息地破碎化', color: '#8b6914' },
    { time: 4.0, label: 'C4 草原扩张',     detail: '开阔环境选择压力增加', color: '#b8860b' },
    { time: 2.6, label: '北半球冰期开始',  detail: '气候波动，推动迁徙',   color: '#7b8fa1' },
    { time: 1.8, label: '草原进一步扩张',  detail: '直立人完全适应奔跑',   color: '#c4a43e' }
  ];

  /* ==============================================================
     构建树结构 & 计算 y 坐标
     ============================================================== */

  // 构建父子关系
  const nodeMap = new Map();
  rawNodes.forEach(n => {
    nodeMap.set(n.id, Object.assign({}, n, { children: [] }));
  });
  rawNodes.forEach(n => {
    if (n.parentId) {
      const parent = nodeMap.get(n.parentId);
      if (parent) parent.children.push(nodeMap.get(n.id));
    }
  });

  const root = nodeMap.get('root');

  // 叶子排序（自上而下）
  const leafOrder = ['ardi', 'lucy', 'paranth', 'habilis', 'neander', 'sapiens'];
  const leafYBase = 80;
  const leafYStep = 68;

  // 给叶子赋 y，内部节点取子节点 y 均值
  leafOrder.forEach((id, i) => {
    nodeMap.get(id).y = leafYBase + i * leafYStep;
  });

  function assignY(node) {
    if (node.y !== undefined) return node.y;
    if (node.children.length === 0) {
      // 未在叶子列表中的叶子（不应出现）
      node.y = leafYBase + leafOrder.length * leafYStep;
      return node.y;
    }
    const sum = node.children.reduce((s, c) => s + assignY(c), 0);
    node.y = sum / node.children.length;
    return node.y;
  }
  assignY(root);

  // 构建扁平节点数组（含 y）
  const nodes = Array.from(nodeMap.values());

  /* ==============================================================
     从 Lec 获取数据标注
     ============================================================== */
  let hominidData = {};
  try {
    hominidData.australopithecus = Lec.P.getHominidData('australopithecus');
    hominidData.erectus = Lec.P.getHominidData('erectus');
    hominidData.sapiens = Lec.P.getHominidData('sapiens');
  } catch(e) {
    // 数据不可用时静默降级
  }

  /* ==============================================================
     SVG 与尺度
     ============================================================== */
  const svgEl = document.getElementById('tree-svg');
  const svg = d3.select('#tree-svg');
  const W = 1408, H = 480;
  svg.attr('width', W).attr('height', H).attr('viewBox', `0 0 ${W} ${H}`);

  const margin = { top: 20, right: 50, bottom: 80, left: 50 };
  const treeW = W - margin.left - margin.right;
  const treeH = H - margin.top - margin.bottom;

  // 时间 → x：7 Ma 最左，0 Ma 最右
  const xScale = d3.scaleLinear()
    .domain([7, 0])
    .range([margin.left, W - margin.right]);

  // 主绘图组
  let treeG = svg.append('g').attr('class', 'tree-group');

  /* ==============================================================
     绘制函数
     ============================================================== */
  function draw(currentTime) {
    treeG.selectAll('*').remove();

    const g = treeG;

    // ---- 树枝 ----
    nodes.forEach(node => {
      if (node.id === 'root') return; // 根不画分支线
      if (currentTime < node.time) return; // 尚未出现

      const parent = nodeMap.get(node.parentId);
      if (!parent) return;

      const px = xScale(parent.time);
      const py = parent.y;
      const cx = xScale(node.time);
      const cy = node.y;

      const isExtinct = node.extinct && currentTime > node.extTime;
      const opacity = isExtinct ? 0.25 : 0.85;
      const strokeColor = isExtinct ? '#556677' :
        (node.id === 'sapiens' ? '#4da6ff' : '#c8d6e5');
      const strokeW = node.id === 'sapiens' ? 3 : (node.id === 'homo' || node.id === 'austra' ? 2.5 : 2);

      // L 形分支：水平线（子时间→父时间，在子 y）+ 竖线（子 y→父 y，在父时间）
      const pathD = `M${cx},${cy} L${px},${cy} L${px},${py}`;
      g.append('path')
        .attr('d', pathD)
        .attr('stroke', strokeColor)
        .attr('stroke-width', strokeW)
        .attr('fill', 'none')
        .attr('opacity', opacity)
        .attr('stroke-linecap', 'round')
        .attr('stroke-linejoin', 'round');

      // 灭绝支系：画终止标记
      if (isExtinct && node.extTime) {
        const ex = xScale(node.extTime);
        g.append('line')
          .attr('x1', ex - 4).attr('y1', cy - 4)
          .attr('x2', ex + 4).attr('y2', cy + 4)
          .attr('stroke', '#556677')
          .attr('stroke-width', 1.5)
          .attr('opacity', 0.5);
        g.append('line')
          .attr('x1', ex + 4).attr('y1', cy - 4)
          .attr('x2', ex - 4).attr('y2', cy + 4)
          .attr('stroke', '#556677')
          .attr('stroke-width', 1.5)
          .attr('opacity', 0.5);
      }
    });

    // ---- 主干横线（从根到第一个分支） ----
    const rootNode = nodeMap.get('root');
    if (currentTime >= rootNode.time) {
      const rx = xScale(rootNode.time);
      const ry = rootNode.y;
      // 主干从根时间延伸到最右
      const endX = xScale(0);
      g.append('line')
        .attr('x1', rx).attr('y1', ry)
        .attr('x2', endX).attr('y2', ry)
        .attr('stroke', '#8899aa')
        .attr('stroke-width', 2.5)
        .attr('opacity', 0.6)
        .attr('stroke-dasharray', '6,3');
    }

    // ---- 存活支系延伸线 ----
    nodes.forEach(node => {
      if (node.extinct) return;
      if (currentTime < node.time) return;
      const cx = xScale(node.time);
      const cy = node.y;
      const ex = xScale(0);
      const isSapiens = node.id === 'sapiens';
      g.append('line')
        .attr('x1', cx).attr('y1', cy)
        .attr('x2', ex).attr('y2', cy)
        .attr('stroke', isSapiens ? '#4da6ff' : '#8899aa')
        .attr('stroke-width', isSapiens ? 3 : 1.5)
        .attr('opacity', isSapiens ? 0.9 : 0.35)
        .attr('stroke-dasharray', isSapiens ? 'none' : '4,4');
    });

    // ---- 节点圆 ----
    nodes.forEach(node => {
      if (currentTime < node.time) return;
      const cx = xScale(node.time);
      const cy = node.y;
      const isExtinct = node.extinct && currentTime > node.extTime;
      const isSapiens = node.id === 'sapiens';
      const isMajor = ['root', 'austra', 'homo', 'erectus', 'sapiens'].includes(node.id);
      const r = isSapiens ? 6 : (isMajor ? 5 : 4);
      const fill = isExtinct ? '#445566' :
        (isSapiens ? '#4da6ff' : '#c8d6e5');
      const opacity = isExtinct ? 0.4 : 0.9;

      g.append('circle')
        .attr('cx', cx).attr('cy', cy)
        .attr('r', r)
        .attr('fill', fill)
        .attr('stroke', isSapiens ? '#ffffff' : 'none')
        .attr('stroke-width', isSapiens ? 1.5 : 0)
        .attr('opacity', opacity);
    });

    // ---- 标签 ----
    nodes.forEach(node => {
      if (currentTime < node.time) return;
      const cx = xScale(node.time);
      const cy = node.y;
      const isExtinct = node.extinct && currentTime > node.extTime;
      const isSapiens = node.id === 'sapiens';
      const isMajor = ['root', 'austra', 'homo', 'erectus', 'sapiens'].includes(node.id);

      const fillColor = isExtinct ? '#556677' :
        (isSapiens ? '#4da6ff' : (isMajor ? '#c8d6e5' : '#8899aa'));
      const fontSize = isMajor ? '15px' : '14px';
      const fontWeight = isMajor ? 600 : 400;

      // 标签偏移：避免与分支线重叠；智人标签放在节点左侧避免与时间轴"0 Ma"碰撞
      const isSapiensNode = node.id === 'sapiens';
      const labelX = isSapiensNode ? cx - 10 : cx + 10;
      const labelAnchor = isSapiensNode ? 'end' : 'start';
      const labelY = cy + (isSapiensNode ? -14 : (node.id === 'root' ? 18 : 4));

      g.append('text')
        .attr('x', labelX).attr('y', labelY)
        .attr('text-anchor', labelAnchor)
        .attr('fill', fillColor)
        .attr('font-size', fontSize)
        .attr('font-weight', fontWeight)
        .attr('font-family', 'var(--font-sans)')
        .attr('opacity', isExtinct ? 0.4 : 0.9)
        .text(node.name);
    });

    // ---- 时间轴 ----
    const axisY = H - 85;
    g.append('line')
      .attr('x1', margin.left).attr('y1', axisY)
      .attr('x2', W - margin.right).attr('y2', axisY)
      .attr('stroke', '#445566')
      .attr('stroke-width', 1.5);

    // 刻度
    for (let t = 7; t >= 0; t--) {
      const tx = xScale(t);
      g.append('line')
        .attr('x1', tx).attr('y1', axisY - 5)
        .attr('x2', tx).attr('y2', axisY + 5)
        .attr('stroke', '#667788')
        .attr('stroke-width', 1);
      g.append('text')
        .attr('x', tx).attr('y', axisY + 20)
        .attr('text-anchor', 'middle')
        .attr('fill', '#8899aa')
        .attr('font-size', '13px')
        .attr('font-family', 'var(--font-sans)')
        .text(t === 0 ? '0 Ma' : t + ' Ma');
      // "现代" 标注用 14px 字号
      if (t === 0) {
        g.append('text')
          .attr('x', tx).attr('y', axisY + 36)
          .attr('text-anchor', 'middle')
          .attr('fill', '#8899aa')
          .attr('font-size', '14px')
          .attr('font-family', 'var(--font-sans)')
          .text('现代');
      }
    }

    // ---- 环境事件色带 ----
    const envY = axisY + 46;
    const envH = 12;
    envEvents.forEach(ev => {
      if (currentTime < ev.time) return;
      const ex1 = Math.max(margin.left, xScale(Math.min(ev.time + 0.5, 7)));
      const ex2 = Math.min(W - margin.right, xScale(Math.max(ev.time - 0.5, 0)));
      const ew = Math.max(ex2 - ex1, 4);

      g.append('rect')
        .attr('x', ex1).attr('y', envY)
        .attr('width', ew).attr('height', envH)
        .attr('fill', ev.color)
        .attr('opacity', 0.6)
        .attr('rx', 2);

      // 标签
      g.append('text')
        .attr('x', ex1 + ew / 2).attr('y', envY + envH + 14)
        .attr('text-anchor', 'middle')
        .attr('fill', '#aabbcc')
        .attr('font-size', '14px')
        .attr('font-family', 'var(--font-sans)')
        .text(ev.label);
    });

    // ---- 当前时间指示线 ----
    const ctX = xScale(currentTime);
    g.append('line')
      .attr('x1', ctX).attr('y1', margin.top)
      .attr('x2', ctX).attr('y2', axisY)
      .attr('stroke', '#4da6ff')
      .attr('stroke-width', 1)
      .attr('opacity', 0.5)
      .attr('stroke-dasharray', '3,4');
  }

  /* ==============================================================
     Slider 交互
     ============================================================== */
  const slider = document.getElementById('time-slider');
  const sliderVal = document.getElementById('slider-val');
  const noteEnv = document.getElementById('note-env');
  const noteSapiens = document.getElementById('note-sapiens');

  function sliderToTime(val) {
    // val: 0→100, 映射到 7.0→0.0 Ma
    return 7.0 * (1 - val / 100);
  }

  function update(val) {
    const currentTime = sliderToTime(val);
    const displayTime = currentTime.toFixed(1);
    sliderVal.textContent = displayTime + ' Ma';

    draw(currentTime);

    // 浮动注释
    noteEnv.style.opacity = currentTime < 4.5 ? (currentTime >= 3.5 ? (currentTime - 3.5) / 1.0 : 0) : 1;
    noteSapiens.style.opacity = currentTime < 0.5 ? (currentTime >= 0.25 ? (currentTime - 0.25) / 0.25 : 0) : 1;
  }

  slider.addEventListener('input', function() {
    update(parseFloat(this.value));
  });

  // 键盘可达
  slider.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
      e.preventDefault();
      this.value = Math.min(100, parseFloat(this.value) + 2);
      update(parseFloat(this.value));
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      e.preventDefault();
      this.value = Math.max(0, parseFloat(this.value) - 2);
      update(parseFloat(this.value));
    }
  });

  /* ==============================================================
     初始绘制
     ============================================================== */
  update(0); // 从 7 Ma 开始

  /* ==============================================================
     Reduced motion 处理
     ============================================================== */
  if (Deck.reduced()) {
    // 静态展示：直接跳到中间进展
    slider.value = 65;
    update(65);
  }

})();
</script>
</body>
</html>
