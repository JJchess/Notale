<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第 08 页 · 互动讲义</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* ---- 页面专属 ---- */
    #main {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .p08-chart-wrap {
      position: relative;
      width: 100%;
    }
    .p08-chart-wrap.brain {
      height: 255px;
    }
    .p08-chart-wrap.body {
      height: 235px;
      display: flex;
      flex-direction: row;
      gap: var(--sp-4);
    }
    .p08-chart-inner {
      flex: 1 1 0%;
      min-width: 0;
      height: 100%;
    }

    /* ---- 媒体缩略图 ---- */
    .p08-media {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      width: 180px;
      padding-top: 4px;
    }
    .p08-media .thumb {
      width: 100%;
      height: 80px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      overflow: hidden;
      background: var(--surface);
      cursor: default;
      flex-shrink: 0;
    }
    .p08-media .thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .p08-media .thumb-label {
      font-size: var(--fs-tick);
      color: var(--text-dim);
      text-align: center;
      line-height: 1.3;
      padding: 2px 4px;
    }

    /* ---- 说明区域 ---- */
    .p08-insight {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: var(--sp-1) var(--sp-6);
      font-size: var(--fs-body);
      color: var(--text);
      line-height: 1.45;
      text-align: center;
      transition: color 300ms var(--ease);
    }
    .p08-insight em {
      font-style: normal;
      color: var(--accent);
      font-weight: 600;
    }

    /* ---- 底部总结 ---- */
    .p08-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-6);
      min-height: 44px;
      padding: var(--sp-2) var(--sp-6);
      font-size: var(--fs-sec);
      color: var(--text-dim);
      line-height: 1.45;
      text-align: center;
      border-top: 1px solid var(--border);
      margin: 0 var(--sp-6);
    }
    .p08-note span {
      color: var(--text-sec);
    }

    /* ---- 提示 ---- */
    .p08-hint {
      font-size: var(--fs-label);
      color: var(--text-dim);
      text-align: center;
      padding-bottom: var(--sp-2);
    }
  </style>
</head>
<body data-page="08" data-total="60">
<div id="stage">
<main id="main">
  <div class="p08-chart-wrap brain" id="chart-brain"></div>
  <div class="p08-insight" id="insight">脑容量在演化中明显跃进，但下肢比例在南方古猿之后变化很小</div>
  <div class="p08-chart-wrap body">
    <div class="p08-chart-inner" id="chart-body"></div>
    <div class="p08-media">
      <div class="thumb">
        <img src="assets/img/01_wikimedia.jpg" alt="颅骨演化对比" title="照片: Ryan Somma, CC BY-SA 2.0, Wikimedia Commons">
      </div>
      <div class="thumb-label">颅骨对比</div>
      <div class="thumb">
        <img src="assets/img/00_wikimedia.jpg" alt="骨骼对比" title="照片: Wellcome Collection, CC BY 4.0, Wikimedia Commons">
      </div>
      <div class="thumb-label">下肢骨骼对比</div>
    </div>
  </div>
  <div class="p08-note"><span>脑容量增大与下肢演化是两条独立路径</span>——它们发生在不同的时间，出于不同的演化压力</div>
</main>
</div>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(function() {
  'use strict';

  /* ================================================================
     Init
  ================================================================ */
  Deck.init({ index: 8, total: 60 });
  Lec.mount({
    index: 8,
    kicker: '第一章 · 身体遗产',
    title: '脑容量与下肢',
    take: '两条独立的演化路径'
  });

  /* ================================================================
     Data from Lec
  ================================================================ */
  const HOMINID_KEYS = [
    'australopithecus_afarensis',
    'homo_habilis',
    'homo_erectus',
    'homo_neanderthalensis',
    'homo_sapiens_early'
  ];
  const HOMINID_LABELS = ['南方古猿', '能人', '直立人', '尼安德特人', '早期智人'];

  const hominidData = HOMINID_KEYS.map(k => Lec.P.getHominidData(k));
  const brainVolumes = hominidData.map(d => d.brainVolume);
  const heights = hominidData.map(d => +(d.height * 100).toFixed(0)); // m → cm

  /* ================================================================
     Insight texts per stage
  ================================================================ */
  const insights = [
    '南方古猿：下肢直立行走的基础已建立，但脑容量仅 <em>420 cm³</em>',
    '能人：脑容量增至 <em>610 cm³</em>，下肢比例变化不大',
    '直立人：脑容量跃升至 <em>900 cm³</em>，下肢比例早已稳定',
    '尼安德特人：脑容量达 <em>1500 cm³</em> 峰值，下肢比例几乎不变',
    '早期智人：脑容量 <em>1350 cm³</em>，下肢比例与直立人差异极小'
  ];

  /* ================================================================
     Shared echarts palette
  ================================================================ */
  const C_BRAIN = '#4da6ff';
  const C_BRAIN_HL = '#80c4ff';
  const C_BODY = '#ffb832';
  const C_BODY_HL = '#ffcc66';
  const C_BG = '#0b1119';
  const C_TEXT = '#e6edf5';
  const C_TEXT_DIM = '#8899aa';
  const C_AXIS = '#334455';
  const C_GRID = '#1a2a3a';

  /* ================================================================
     Shared echarts base options
  ================================================================ */
  function makeBaseOption() {
    return {
      renderer: 'svg',
      backgroundColor: C_BG,
      textStyle: { fontSize: 16, color: C_TEXT, fontFamily: 'Inter, system-ui, sans-serif' },
      animation: true,
      animationDuration: 400,
      animationEasing: 'cubicOut',
      grid: { left: 72, right: 24, top: 32, bottom: 48 },
      xAxis: {
        type: 'category',
        data: HOMINID_LABELS,
        axisLine: { lineStyle: { color: C_AXIS } },
        axisTick: { show: false },
        axisLabel: { fontSize: 14, color: C_TEXT, fontWeight: 500 },
        triggerEvent: true
      },
      yAxis: {
        type: 'value',
        axisLine: { show: false },
        axisTick: { show: false },
        splitLine: { lineStyle: { color: C_GRID, type: 'dashed' } },
        axisLabel: { fontSize: 13, color: C_TEXT_DIM }
      },
      tooltip: { show: false }
    };
  }

  /* ================================================================
     Chart 1: Brain Volume
  ================================================================ */
  const chartBrainDom = document.getElementById('chart-brain');
  const chartBrain = echarts.init(chartBrainDom, null, { renderer: 'svg' });

  const brainOption = makeBaseOption();
  brainOption.yAxis.name = '脑容量 (cm³)';
  brainOption.yAxis.nameTextStyle = { fontSize: 14, color: C_TEXT_DIM };
  brainOption.series = [{
    type: 'bar',
    data: brainVolumes.map((v, i) => ({
      value: v,
      itemStyle: {
        color: C_BRAIN,
        borderRadius: [4, 4, 0, 0]
      }
    })),
    barWidth: '40%',
    emphasis: {
      itemStyle: { color: C_BRAIN_HL },
      scale: false
    },
    select: {
      itemStyle: { color: C_BRAIN_HL },
      scale: false
    },
    selectedMode: 'single'
  }];
  chartBrain.setOption(brainOption);

  /* ================================================================
     Chart 2: Body Height
  ================================================================ */
  const chartBodyDom = document.getElementById('chart-body');
  const chartBody = echarts.init(chartBodyDom, null, { renderer: 'svg' });

  const bodyOption = makeBaseOption();
  bodyOption.yAxis.name = '身高 (cm)';
  bodyOption.yAxis.nameTextStyle = { fontSize: 14, color: C_TEXT_DIM };
  bodyOption.series = [{
    type: 'bar',
    data: heights.map((v, i) => ({
      value: v,
      itemStyle: {
        color: C_BODY,
        borderRadius: [4, 4, 0, 0]
      }
    })),
    barWidth: '40%',
    emphasis: {
      itemStyle: { color: C_BODY_HL },
      scale: false
    },
    select: {
      itemStyle: { color: C_BODY_HL },
      scale: false
    },
    selectedMode: 'single'
  }];
  chartBody.setOption(bodyOption);

  /* ================================================================
     Interaction: click a bar → highlight in both charts
  ================================================================ */
  const insightEl = document.getElementById('insight');
  let activeIndex = -1;

  function selectStage(idx) {
    if (activeIndex === idx) return;
    activeIndex = idx;

    // Highlight in both charts
    chartBrain.dispatchAction({ type: 'select', seriesIndex: 0, dataIndex: idx });
    chartBody.dispatchAction({ type: 'select', seriesIndex: 0, dataIndex: idx });

    // Update insight text
    insightEl.innerHTML = insights[idx];
  }

  function deselectAll() {
    activeIndex = -1;
    chartBrain.dispatchAction({ type: 'unselect', seriesIndex: 0 });
    chartBody.dispatchAction({ type: 'unselect', seriesIndex: 0 });
    insightEl.innerHTML = '脑容量在演化中明显跃进，但下肢比例在南方古猿之后变化很小';
  }

  chartBrain.on('click', function(params) {
    if (params.componentType === 'series') {
      if (activeIndex === params.dataIndex) {
        deselectAll();
      } else {
        selectStage(params.dataIndex);
      }
    }
  });

  chartBody.on('click', function(params) {
    if (params.componentType === 'series') {
      if (activeIndex === params.dataIndex) {
        deselectAll();
      } else {
        selectStage(params.dataIndex);
      }
    }
  });

  /* ================================================================
     Resize handling
  ================================================================ */
  window.addEventListener('resize', function() {
    chartBrain.resize();
    chartBody.resize();
  });
})();
</script>
</body>
</html>
