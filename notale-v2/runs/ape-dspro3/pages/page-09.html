<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第 09 页 · 互动讲义</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* ===== 页面专属样式 ===== */
    .pg09-wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .pg09-formula {
      text-align: center;
      font-size: 20px;
      font-family: var(--font-mono);
      color: var(--text);
      padding: var(--sp-2) 0 var(--sp-1);
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }
    .pg09-formula sub {
      font-size: 0.7em;
      line-height: 1;
    }
    .pg09-formula .hl {
      color: var(--accent);
    }

    .pg09-row {
      display: flex;
      flex-direction: row;
      gap: var(--sp-6);
      flex: 1 1 0%;
      min-height: 0;
    }

    .pg09-sim {
      flex: 1 1 0%;
      min-width: 0;
      position: relative;
      border-radius: var(--r-md);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .pg09-sim canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .pg09-chart {
      flex: 1 1 0%;
      min-width: 0;
      min-height: 0;
      border-radius: var(--r-md);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .pg09-readout {
      display: flex;
      flex-direction: row;
      gap: var(--sp-10);
      justify-content: center;
      align-items: center;
      padding: var(--sp-3) var(--sp-6);
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      font-size: var(--fs-body);
      font-family: var(--font-mono);
      color: var(--text);
      flex-shrink: 0;
    }
    .pg09-readout .rv {
      color: var(--accent);
      font-weight: 700;
      font-size: var(--fs-lead);
      min-width: 4.5em;
      text-align: right;
      display: inline-block;
    }

    .pg09-axis-wrap {
      position: relative;
      width: 100%;
      flex-shrink: 0;
    }
    .pg09-axis-wrap input[type="range"] {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      transform: translateY(-50%);
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      height: 28px;
      margin: 0;
      cursor: pointer;
      z-index: 2;
    }
    .pg09-axis-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      box-shadow: 0 0 10px rgba(77,166,255,0.55);
      cursor: pointer;
    }
    .pg09-axis-wrap input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      box-shadow: 0 0 10px rgba(77,166,255,0.55);
      cursor: pointer;
    }
    .pg09-axis-wrap input[type="range"]::-webkit-slider-runnable-track {
      -webkit-appearance: none;
      height: 0;
      background: transparent;
    }
    .pg09-axis-wrap input[type="range"]::-moz-range-track {
      height: 0;
      background: transparent;
      border: none;
    }

    .pg09-axis-wrap input[type="range"]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 4px;
      border-radius: 2px;
    }

    .pg09-insight {
      font-size: var(--fs-body);
      color: var(--text-sec);
      text-align: center;
      padding: var(--sp-2) 0 0;
      flex-shrink: 0;
      line-height: 1.45;
    }
    .pg09-insight em {
      color: var(--accent);
      font-style: normal;
      font-weight: 600;
    }

    .k-process .step .pg09-spd {
      display: block;
      font-size: var(--fs-tick);
      color: var(--text-dim);
      font-family: var(--font-mono);
      margin-top: 2px;
    }
  </style>
</head>
<body data-page="09" data-total="60">
  <div id="stage">
    <main id="main">
      <div class="pg09-wrap">

        <!-- 公式 -->
        <div class="pg09-formula">
          h = v<sub>0</sub>² / (2g) &nbsp;—&nbsp; <span class="hl">m 不在公式里</span>
        </div>

        <!-- 左: 跳跃模拟  |  右: 曲线图 -->
        <div class="pg09-row">
          <div class="pg09-sim">
            <canvas id="jump-canvas"></canvas>
          </div>
          <div class="pg09-chart" id="chart-container"></div>
        </div>

        <!-- 读数 -->
        <div class="pg09-readout">
          <span>v<sub>0</sub> = <span class="rv" id="val-v0">2.50</span> m/s</span>
          <span>h = <span class="rv" id="val-h">0.32</span> m</span>
        </div>

        <!-- k-process: 轴 + 滑块 + 步骤 -->
        <div class="k-process" style="gap:var(--sp-2);flex-shrink:0;">
          <div class="axis pg09-axis-wrap">
            <input type="range" id="v0-slider" min="0.6" max="4.8" step="any" value="2.5" aria-label="拖拽选择初速度">
          </div>
          <div class="steps" style="flex-wrap:nowrap;">
            <div class="step current" data-v0="1.0">勉强离地<span class="pg09-spd">1.0 m/s</span></div>
            <div class="arw">→</div>
            <div class="step" data-v0="1.625">日常轻跳<span class="pg09-spd">1.6 m/s</span></div>
            <div class="arw">→</div>
            <div class="step" data-v0="2.5">典型值<span class="pg09-spd">2.5 m/s</span></div>
            <div class="arw">→</div>
            <div class="step" data-v0="3.25">运动员<span class="pg09-spd">3.3 m/s</span></div>
            <div class="arw">→</div>
            <div class="step" data-v0="4.0">精英<span class="pg09-spd">4.0 m/s</span></div>
            <div class="arw">→</div>
            <div class="step" data-v0="4.75">极限<span class="pg09-spd">4.8 m/s</span></div>
          </div>
        </div>

        <!-- 底部洞察 -->
        <div class="pg09-insight">
          同样的初速度，<em>轻的人和重的人跳得一样高</em>——公式里没有质量 <em>m</em>。
        </div>

      </div>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/matter.min.js"></script>
  <script src="assets/lib/anime.min.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script>
  (function() {
    /* ================================================================
       page-09 · 初速度决定跳跃高度
       知识结构: process (v₀ → h 因果链)
       交互: 拖拽滑块改变初速度，左侧 matter.js 跳跃模拟 + 右侧 echarts 曲线
       必用技法: matterjs, animejs
       ================================================================ */

    // ---- 底盘初始化 ----
    Deck.init({ index: 9, total: 60 });

    // ---- 页眉 ----
    Lec.mount({
      index: 9,
      kicker: 'PHYSICS-IN-MOTION',
      title: '初速度决定跳跃高度',
      take: '跳跃高度只取决于离地那一瞬间的速度，与体重无关。'
    });

    // ---- 常数 ----
    const G      = Lec.K.EARTH_GRAVITY;                // 9.8
    const V0_REF = Lec.K.HUMAN_JUMP_INITIAL_VELOCITY;  // 2.5
    const H_REF  = Lec.K.HUMAN_VERTICAL_JUMP_EARTH;    // 0.4

    const TICK_VALS = [
      V0_REF * 0.4,
      V0_REF * 0.65,
      V0_REF,
      V0_REF * 1.3,
      V0_REF * 1.6,
      V0_REF * 1.9,
    ];
    const SLIDER_MIN = 0.6;
    const SLIDER_MAX = 4.8;

    /* ================================================================
       MATTER.JS — 左侧跳跃模拟 (手动渲染, 不用 Matter.Render)
       ================================================================ */
    const cv = document.getElementById('jump-canvas');
    const fit = Deck.fit(cv);
    const W = fit.width;
    const H = fit.height;

    // 像素比例
    const PX_PER_M = (H * 0.78) / 1.2;
    const GND_TOP  = Math.round(H * 0.88);
    const GND_THICK = 10;

    const { Engine, Bodies, Body, Composite, Events } = Matter;

    const engine = Engine.create();
    engine.gravity.y = 1;
    engine.gravity.scale = (G * PX_PER_M) / 3600;

    // 地面
    const ground = Bodies.rectangle(W / 2, GND_TOP + GND_THICK / 2, W + 200, GND_THICK, {
      isStatic: true,
      friction: 0.6,
    });

    // 跳跃者: 躯干 (矩形) + 头 (圆形)
    const T_W = 20, T_H = 52;
    const H_R = 12;
    const restY = GND_TOP - T_H / 2;
    const restHeadY = restY - T_H / 2 - H_R + 3;

    const torso = Bodies.rectangle(W / 2, restY, T_W, T_H, {
      friction: 0.3,
      restitution: 0,
    });
    const head = Bodies.circle(W / 2, restHeadY, H_R, {
      friction: 0.3,
      restitution: 0,
    });
    const jumper = Body.create({
      parts: [torso, head],
      restitution: 0,
      friction: 0.3,
    });

    Composite.add(engine.world, [ground, jumper]);

    let landed = true;
    Events.on(engine, 'collisionStart', function(ev) {
      for (const pair of ev.pairs) {
        if (pair.bodyA.id === jumper.id || pair.bodyB.id === jumper.id) {
          landed = true;
        }
      }
    });

    function doJump(v0_mps) {
      Body.setPosition(jumper, { x: W / 2, y: restY });
      Body.setVelocity(jumper, { x: 0, y: 0 });
      Body.setAngularVelocity(jumper, 0);
      Body.setAngle(jumper, 0);
      Body.setPosition(head, { x: W / 2, y: restHeadY });
      const v_tick = (v0_mps * PX_PER_M) / 60;
      Body.setVelocity(jumper, { x: 0, y: -v_tick });
      landed = false;
    }

    doJump(V0_REF);

    // ---- 手动绘制 ----
    const ctx = cv.getContext('2d');

    function drawScene() {
      ctx.clearRect(0, 0, W, H);

      // 地面
      ctx.fillStyle = '#243040';
      ctx.fillRect(0, GND_TOP, W, GND_THICK + 4);

      // 地面高光线
      ctx.strokeStyle = '#334455';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, GND_TOP);
      ctx.lineTo(W, GND_TOP);
      ctx.stroke();

      // 跳跃者
      const pos = jumper.position;
      const ang = jumper.angle;

      // 躯干
      ctx.save();
      ctx.translate(pos.x, pos.y);
      ctx.rotate(ang);
      ctx.fillStyle = '#4da6ff';
      ctx.fillRect(-T_W / 2, -T_H / 2, T_W, T_H);
      ctx.restore();

      // 头
      const hPos = head.position;
      ctx.save();
      ctx.beginPath();
      ctx.arc(hPos.x, hPos.y, H_R, 0, Math.PI * 2);
      ctx.fillStyle = '#4da6ff';
      ctx.fill();
      ctx.restore();
    }

    let engineRunning = !Deck.reduced();
    Deck.loop(function() {
      if (engineRunning) {
        Engine.update(engine, 1000 / 60);
      }
      drawScene();
    });

    /* ================================================================
       ECHARTS — 右侧曲线图
       ================================================================ */
    const chartDom = document.getElementById('chart-container');
    const chart = echarts.init(chartDom, null, { renderer: 'svg' });

    const curveData = [];
    for (let v = 0.5; v <= 5.01; v += 0.05) {
      curveData.push([+v.toFixed(2), Lec.P.jumpHeightFromVelocity(v, G)]);
    }

    function buildChartOption(curV0, curH) {
      const domW = chartDom.clientWidth;
      const domH = chartDom.clientHeight;
      const gl = 52, gr = 28, gt = 32, gb = 40;
      const gw = domW - gl - gr;
      const gh = domH - gt - gb;

      return {
        textStyle: { fontSize: 16 },
        grid: { left: gl, right: gr, top: gt, bottom: gb },
        xAxis: {
          name: '初速度 v₀ (m/s)',
          nameLocation: 'center',
          nameGap: 28,
          nameTextStyle: { fontSize: 14, color: '#a0b0c0' },
          min: 0,
          max: 5,
          axisLabel: { fontSize: 14, color: '#8899aa' },
          axisLine: { lineStyle: { color: '#334455' } },
          splitLine: { lineStyle: { color: '#243040' } },
        },
        yAxis: {
          name: '高度 h (m)',
          nameLocation: 'center',
          nameGap: 38,
          nameTextStyle: { fontSize: 14, color: '#a0b0c0' },
          min: 0,
          max: 1.35,
          axisLabel: { fontSize: 14, color: '#8899aa' },
          axisLine: { lineStyle: { color: '#334455' } },
          splitLine: { lineStyle: { color: '#243040' } },
        },
        series: [
          {
            type: 'line',
            data: curveData,
            smooth: false,
            symbol: 'none',
            lineStyle: { color: '#4da6ff', width: 2.5 },
            silent: true,
          },
          {
            type: 'scatter',
            data: [[curV0, curH]],
            symbolSize: 14,
            itemStyle: { color: '#ffffff', borderColor: '#4da6ff', borderWidth: 3 },
            silent: true,
            z: 10,
          },
        ],
        graphic: [
          // 垂直参考虚线 (典型 v₀)
          {
            type: 'line',
            shape: { x1: 0, y1: 0, x2: 0, y2: 1 },
            left: gl + (V0_REF / 5) * gw,
            top: gt,
            style: { stroke: '#f59e0b', lineWidth: 1, lineDash: [5, 5] },
            z: 5,
          },
          // 水平参考虚线 (典型高度)
          {
            type: 'line',
            shape: { x1: 0, y1: 0, x2: 1, y2: 0 },
            left: gl,
            top: gt + (1 - H_REF / 1.35) * gh,
            style: { stroke: '#f59e0b', lineWidth: 1, lineDash: [5, 5] },
            z: 5,
          },
        ],
      };
    }

    let curV0 = V0_REF;
    let curH  = H_REF;
    chart.setOption(buildChartOption(curV0, curH));

    window.addEventListener('resize', function() {
      chart.resize();
      chart.setOption(buildChartOption(curV0, curH));
    });

    /* ================================================================
       滑块交互 + anime.js 平滑读数
       ================================================================ */
    const slider   = document.getElementById('v0-slider');
    const valV0El  = document.getElementById('val-v0');
    const valHEl   = document.getElementById('val-h');
    const steps    = document.querySelectorAll('.k-process .step');

    let animReadout = null;

    function updateAll(v0) {
      const h = Lec.P.jumpHeightFromVelocity(v0, G);
      curV0 = v0;
      curH  = h;

      // anime.js 平滑过渡读数
      if (animReadout) animReadout.pause();
      const obj = {
        v0: parseFloat(valV0El.textContent) || curV0,
        h:  parseFloat(valHEl.textContent)  || curH,
      };
      animReadout = anime({
        targets: obj,
        v0: curV0,
        h: curH,
        duration: 160,
        easing: 'easeOutQuad',
        update: function() {
          valV0El.textContent = obj.v0.toFixed(2);
          valHEl.textContent  = obj.h.toFixed(2);
        }
      });

      // 更新曲线高亮点
      chart.setOption({
        series: [{}, { data: [[curV0, curH]] }]
      });

      // 更新步骤高亮
      const frac = (v0 - SLIDER_MIN) / (SLIDER_MAX - SLIDER_MIN);
      const idx = Math.round(frac * (TICK_VALS.length - 1));
      steps.forEach(function(s, i) {
        s.classList.remove('current', 'done');
        if (i < idx) s.classList.add('done');
        else if (i === idx) s.classList.add('current');
      });

      // 触发跳跃
      doJump(v0);
    }

    slider.addEventListener('input', function() {
      updateAll(parseFloat(this.value));
    });
    slider.addEventListener('change', function() {
      updateAll(parseFloat(this.value));
    });

    updateAll(V0_REF);

    // ---- 动效偏好 ----
    if (Deck.reduced()) {
      engineRunning = false;
      const h_px = Lec.P.jumpHeightFromVelocity(V0_REF, G) * PX_PER_M;
      Body.setPosition(jumper, { x: W / 2, y: GND_TOP - h_px - T_H / 2 });
      Body.setPosition(head, { x: W / 2, y: GND_TOP - h_px - T_H - H_R + 3 });
      Body.setVelocity(jumper, { x: 0, y: 0 });
      Body.setAngularVelocity(jumper, 0);
      Body.setAngle(jumper, 0);
      drawScene();
    }

  })();
  </script>
</body>
</html>
