<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 10 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ---- 本页布局 ---- */
  #main {
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
  }

  .split-lr {
    display: flex;
    flex-direction: row;
    gap: var(--sp-8);
    flex: 1 1 0%;
    min-height: 0;
  }

  .col-l {
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
    flex: 1 1 0%;
    min-width: 0;
  }

  .col-r {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--sp-4);
    flex: 1 1 0%;
    min-width: 0;
  }

  /* ---- 照片 ---- */
  .moon-photo {
    width: 100%;
    height: 88px;
    object-fit: cover;
    border-radius: var(--r-sm);
    border: 1px solid var(--border);
    opacity: 0.85;
  }

  /* ---- echarts 容器 ---- */
  .chart-wrap {
    position: relative;
    flex: 1 1 0%;
    min-height: 0;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    overflow: hidden;
  }
  .chart-ylabel {
    writing-mode: vertical-lr;
    text-orientation: mixed;
    font-size: var(--fs-label);
    color: var(--text-sec);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 22px;
    letter-spacing: 0.04em;
  }
  .chart-xlabel {
    font-size: var(--fs-label);
    color: var(--text-sec);
    text-align: center;
    display: block;
    flex-shrink: 0;
    height: 20px;
    line-height: 20px;
  }
  .chart-inner {
    flex: 1 1 0%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  #chart {
    width: 100%;
    height: 230px;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }
  #chart svg {
    overflow: hidden;
  }

  /* ---- 快捷按钮行 ---- */
  .quick-btns {
    display: flex;
    flex-direction: row;
    gap: var(--sp-2);
    flex-wrap: wrap;
    align-items: center;
  }

  .quick-btns button {
    font-family: inherit;
    font-size: var(--fs-label);
    padding: 3px 10px;
    border-radius: var(--r-sm);
    border: 1px solid var(--border-strong);
    background: var(--surface-raised);
    color: var(--text-sec);
    cursor: pointer;
    transition: all var(--dur) var(--ease);
    white-space: nowrap;
  }

  .quick-btns button:hover {
    border-color: var(--accent-soft);
    color: var(--text);
  }

  .quick-btns button:focus-visible {
    border-color: var(--focus);
    box-shadow: 0 0 0 2px rgba(96,165,250,0.25);
  }

  .quick-btns button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 600;
  }

  /* ---- 滑块行 ---- */
  .slider-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: var(--sp-3);
  }

  .slider-row input[type="range"] {
    flex: 1 1 0%;
    min-width: 0;
    accent-color: var(--accent);
    height: 6px;
  }

  .slider-row .g-readout {
    font-size: var(--fs-label);
    color: var(--text);
    font-weight: 600;
    font-family: var(--font-mono);
    white-space: nowrap;
    min-width: 75px;
    text-align: right;
  }

  /* ---- 模拟器容器 ---- */
  #sim-container {
    width: 100%;
    flex: 1 1 0%;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  #sim-container canvas {
    border-radius: var(--r-sm);
    border: 1px solid var(--border);
  }

  /* ---- 高度读数面板 ---- */
  .height-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: var(--sp-3) var(--sp-6);
    display: flex;
    flex-direction: row;
    align-items: baseline;
    gap: var(--sp-3);
    flex-shrink: 0;
  }

  .height-panel .label {
    font-size: var(--fs-label);
    color: var(--text-dim);
  }

  .height-panel .value {
    font-size: var(--fs-h2);
    font-weight: 700;
    color: var(--accent);
    font-family: var(--font-mono);
  }

  .height-panel .unit {
    font-size: var(--fs-label);
    color: var(--text-sec);
  }

  /* ---- 三句注释 ---- */
  .insight-strip {
    display: flex;
    flex-direction: row;
    gap: var(--sp-4);
    flex-shrink: 0;
  }

  .insight-strip .note {
    flex: 1 1 0%;
    min-width: 0;
    font-style: normal;
    font-size: var(--fs-sec);
    color: var(--text-sec);
    line-height: 1.45;
    padding: var(--sp-2) var(--sp-4);
    border-left: 2px solid var(--border);
  }

  .insight-strip .note em {
    color: var(--accent);
    font-style: normal;
    font-weight: 600;
  }
</style>
</head>
<body data-page="10" data-total="60">
<div id="stage">
<main id="main">

  <!-- k-process: 因果链条 -->
  <div class="k-process">
    <div class="axis"></div>
    <div class="steps">
      <div class="step current">同一初速度 <span style="font-family:var(--font-mono);color:var(--accent);">v₀</span></div>
      <div class="arw">→</div>
      <div class="step current">不同重力加速度 <span style="font-family:var(--font-mono);color:var(--accent);">g</span></div>
      <div class="arw">→</div>
      <div class="step current">不同跳跃高度 <span style="font-family:var(--font-mono);color:var(--accent);">h</span></div>
    </div>
  </div>

  <!-- 分割：左图右模拟 -->
  <div class="split-lr">

    <!-- 左栏：照片 + 曲线 + 控件 -->
    <div class="col-l">
      <img class="moon-photo"
           src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/John_W._Young_on_the_Moon.jpg/960px-John_W._Young_on_the_Moon.jpg"
           alt="Apollo 16 宇航员 John Young 在月球表面跳跃"
           title="照片：NASA / Charlie Duke · Apollo 16 · 公有领域"
           loading="lazy">

      <div class="chart-wrap">
        <span class="chart-ylabel">跳跃高度 h (m)</span>
        <div class="chart-inner">
          <div id="chart"></div>
          <span class="chart-xlabel">重力加速度 g (m/s²)</span>
        </div>
      </div>

      <div class="quick-btns" id="quick-btns">
        <button data-g="earth">🌍 地球</button>
        <button data-g="moon">🌙 月球</button>
        <button data-g="mars">🔴 火星</button>
        <button data-g="ceres">🪨 谷神星</button>
        <button data-g="asteroid">☄️ 小行星</button>
        <button data-g="jupiter">🪐 木星</button>
        <button data-g="free">🎚️ 自由拖动</button>
      </div>

      <div class="slider-row">
        <span style="font-size:var(--fs-label);color:var(--text-dim);flex-shrink:0;">重力 g</span>
        <input type="range" id="g-slider" min="0.01" max="25" step="0.01" value="9.8">
        <span class="g-readout" id="g-readout">9.80 m/s²</span>
      </div>
    </div>

    <!-- 右栏：模拟器 + 读数 -->
    <div class="col-r">
      <div id="sim-container"></div>
      <div class="height-panel">
        <span class="label">跳跃高度</span>
        <span class="value" id="h-readout">0.50</span>
        <span class="unit">m</span>
      </div>
    </div>

  </div>

  <!-- 三句关键注释 -->
  <div class="insight-strip">
    <div class="note">① 同一初速度下，重力越小跳得越高，<em>h 与 g 成反比</em>。</div>
    <div class="note">② 月球重力是地球的 1/6，跳跃高度就是地球的 <em>6 倍</em>——比例关系，不是平方。</div>
    <div class="note">③ 重力趋近于零时，高度趋近于无穷大——这就是<em>微重力下身体失控</em>的物理根源。</div>
  </div>

</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script>
(function() {
  /* ================================================================
     初始化底盘 & 页眉
     ================================================================ */
  Deck.init({ index: 10, total: 60 });

  Lec.mount({
    index: 10,
    kicker: 'GRAVITY-TEST',
    title: '同一具身体，不同的重力，不同的高度',
    take: '同一初速度下，重力越小跳得越高'
  });

  /* ================================================================
     数据：从 Lec 取所有数字
     ================================================================ */
  var v0 = Lec.K.HUMAN_JUMP_INITIAL_VELOCITY;        // ~3.13 m/s
  var earthG  = Lec.K.EARTH_GRAVITY;                  // 9.8
  var moonG   = Lec.K.MOON_GRAVITY;                   // 1.62
  var marsG   = Lec.K.MARS_GRAVITY;                   // 3.71
  var jupiterG = Lec.K.JUPITER_GRAVITY;               // 24.79
  var ceresG  = Lec.K.CERES_GRAVITY  || 0.27;         // fallback
  var asteroidG = Lec.K.ASTEROID_GRAVITY || 0.001;    // fallback

  function calcH(g) {
    return Lec.P.jumpHeightFromVelocity(v0, g);
  }

  var presets = [
    { key: 'earth',    g: earthG,    label: '地球' },
    { key: 'moon',     g: moonG,     label: '月球' },
    { key: 'mars',     g: marsG,     label: '火星' },
    { key: 'ceres',    g: ceresG,    label: '谷神星' },
    { key: 'asteroid', g: asteroidG, label: '小行星' },
    { key: 'jupiter',  g: jupiterG,  label: '木星' }
  ];

  /* ================================================================
     echarts 曲线
     ================================================================ */
  var chartDom = document.getElementById('chart');
  var chartW = chartDom.clientWidth || 620;
  var chartH = 230;
  chartDom.style.width = chartW + 'px';
  chartDom.style.height = chartH + 'px';
  var chart = echarts.init(chartDom, null, {
    renderer: 'canvas',
    width: chartW,
    height: chartH
  });

  // 生成曲线数据点 (log 间隔)
  var curveData = [];
  var gMin = 0.01, gMax = 25;
  var nPts = 200;
  for (var i = 0; i <= nPts; i++) {
    var frac = i / nPts;
    var g = Math.pow(10, Math.log10(gMin) + frac * (Math.log10(gMax) - Math.log10(gMin)));
    curveData.push([g, calcH(g)]);
  }

  // 七个标记点 (不含自定义)
  var markData = presets.map(function(p) {
    return { name: p.label, coord: [p.g, calcH(p.g)], value: p.label };
  });

  // 当前高亮点的初始值
  var currentG = earthG;
  var currentH = calcH(currentG);

  var option = {
    textStyle: { fontSize: 16 },
    grid: { left: 56, right: 24, top: 20, bottom: 36 },
    xAxis: {
      type: 'log',
      min: gMin,
      max: gMax,
      axisLabel: { fontSize: 14, color: '#8899aa' },
      splitLine: { lineStyle: { color: '#243040' } },
      axisLine: { lineStyle: { color: '#334455' } }
    },
    yAxis: {
      type: 'value',
      min: 0,
      max: 20,
      axisLabel: { fontSize: 14, color: '#8899aa' },
      splitLine: { lineStyle: { color: '#243040' } },
      axisLine: { lineStyle: { color: '#334455' } }
    },
    series: [
      {
        type: 'line',
        data: curveData,
        showSymbol: false,
        lineStyle: { color: '#4da6ff', width: 2.5 },
        z: 1
      },
      {
        type: 'scatter',
        data: markData,
        symbolSize: 10,
        itemStyle: {
          color: '#ffb832',
          borderColor: '#0b1119',
          borderWidth: 2
        },
        label: {
          show: true,
          formatter: function(p) { return p.data.value; },
          position: 'top',
          fontSize: 14,
          color: '#ffb832',
          distance: 6
        },
        z: 2
      },
      {
        type: 'scatter',
        data: [{ name: '当前', coord: [currentG, currentH], value: [currentG, currentH] }],
        symbolSize: 16,
        itemStyle: {
          color: '#ffffff',
          borderColor: '#4da6ff',
          borderWidth: 3
        },
        label: {
          show: true,
          formatter: function(p) {
            return p.data.value[1].toFixed(2) + ' m';
          },
          position: 'right',
          fontSize: 15,
          color: '#ffffff',
          fontWeight: 600,
          distance: 8
        },
        z: 3
      }
    ]
  };

  chart.setOption(option);

  /* ================================================================
     Matter.js 模拟器
     ================================================================ */
  var simContainer = document.getElementById('sim-container');
  var simCanvas = document.createElement('canvas');
  simCanvas.width = 350;
  simCanvas.height = 400;
  simContainer.appendChild(simCanvas);

  var Engine = Matter.Engine,
      Render = Matter.Render,
      Bodies = Matter.Bodies,
      Body   = Matter.Body,
      Composite = Matter.Composite;

  var engine = Engine.create();
  engine.gravity.y = 0;  // 初始设为 0，后面动态设置

  var render = Render.create({
    canvas: simCanvas,
    engine: engine,
    options: {
      width: 350,
      height: 400,
      wireframes: false,
      background: '#0b1119',
      pixelRatio: 1
    }
  });

  // 地面
  var groundY = 370;
  var ground = Bodies.rectangle(175, groundY + 30, 350, 60, {
    isStatic: true,
    render: { fillStyle: '#243040' }
  });

  // 人体（一个圆）
  var bodyRadius = 14;
  var bodyStartY = groundY - bodyRadius;
  var body = Bodies.circle(175, bodyStartY, bodyRadius, {
    restitution: 0,
    frictionAir: 0,
    render: { fillStyle: '#4da6ff' }
  });

  Composite.add(engine.world, [ground, body]);

  Render.run(render);

  // 追踪最高点
  var jumpStartY = body.position.y;
  var maxHeightPx = 0;
  var hasJumped = false;
  var offScreenTimer = null;

  function resetAndJump(g) {
    // 清除之前的超时
    if (offScreenTimer) { clearTimeout(offScreenTimer); offScreenTimer = null; }

    // 更新重力
    // Matter.js: gravity.y * gravity.scale * 3600 = g * scale_px_per_m
    // scale: 120 px/m, 所以 gravity.y = g * 120 / 3.6
    var scale = 120; // px/m
    var gravityY = g * scale / 3.6;
    engine.gravity.y = gravityY;
    engine.gravity.scale = 0.001;

    // 重置身体位置
    Body.setPosition(body, { x: 175, y: bodyStartY });
    Body.setVelocity(body, { x: 0, y: 0 });
    Body.setAngularVelocity(body, 0);

    // 计算初速度 (px/frame)
    var v0_px_per_s = v0 * scale;          // px/s
    var v0_px_per_frame = v0_px_per_s / 60; // px/frame

    // 发射
    Body.setVelocity(body, { x: 0, y: -v0_px_per_frame });

    jumpStartY = bodyStartY;
    maxHeightPx = 0;
    hasJumped = true;
  }

  // 每帧更新高度读数
  var lastReadout = 0;
  function updateReadout() {
    if (!hasJumped) return;
    var dy = jumpStartY - body.position.y;
    if (dy > maxHeightPx) {
      maxHeightPx = dy;
    }
    // 换算成米
    var scale = 120; // px/m
    var hM = maxHeightPx / scale;
    // 舍入到 0.01
    hM = Math.round(hM * 100) / 100;
    if (hM !== lastReadout) {
      lastReadout = hM;
      document.getElementById('h-readout').textContent = hM.toFixed(2);
    }

    // 检查身体是否飞出画布 (> 400px 上方)，若是则 3 秒后重置
    if (body.position.y < -20) {
      if (!offScreenTimer) {
        offScreenTimer = setTimeout(function() {
          // 飞出去的时间足够长，显示理论值
          document.getElementById('h-readout').textContent = calcH(currentG).toFixed(2);
          hasJumped = false;
          offScreenTimer = null;
        }, 3000);
      }
    }
  }

  /* ================================================================
     交互：滑块 + 按钮
     ================================================================ */
  var slider = document.getElementById('g-slider');
  var gReadout = document.getElementById('g-readout');
  var hReadout = document.getElementById('h-readout');
  var quickBtns = document.getElementById('quick-btns');

  function updateAll(g) {
    currentG = g;
    currentH = calcH(g);

    // 更新滑块
    slider.value = g;
    gReadout.textContent = g.toFixed(2) + ' m/s²';

    // 更新 echarts 高亮点
    chart.setOption({
      series: [
        {},
        {},
        {
          data: [{ name: '当前', coord: [currentG, currentH], value: [currentG, currentH] }]
        }
      ]
    });

    // 更新模拟器
    resetAndJump(g);

    // 更新按钮状态
    var btns = quickBtns.querySelectorAll('button');
    var matched = false;
    btns.forEach(function(btn) {
      var dg = btn.getAttribute('data-g');
      if (dg === 'free') return;
      var preset = presets.find(function(p) { return p.key === dg; });
      if (preset && Math.abs(preset.g - g) < 0.005) {
        btn.classList.add('active');
        matched = true;
      } else {
        btn.classList.remove('active');
      }
    });
    // 自由拖动按钮
    var freeBtn = quickBtns.querySelector('[data-g="free"]');
    if (freeBtn) {
      if (matched) freeBtn.classList.remove('active');
      else freeBtn.classList.add('active');
    }
  }

  slider.addEventListener('input', function() {
    updateAll(parseFloat(this.value));
  });

  quickBtns.addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var key = btn.getAttribute('data-g');
    if (key === 'free') {
      // 不做预设，保持当前滑块值
      btn.classList.add('active');
      var others = quickBtns.querySelectorAll('button:not([data-g="free"])');
      others.forEach(function(b) { b.classList.remove('active'); });
      return;
    }
    var preset = presets.find(function(p) { return p.key === key; });
    if (preset) {
      updateAll(preset.g);
    }
  });

  /* ================================================================
     动画循环：更新模拟器高度读数
     ================================================================ */
  Deck.loop(function() {
    if (Deck.reduced()) return;
    Engine.update(engine, 1000 / 60);
    updateReadout();
  });

  /* ================================================================
     初始状态
     ================================================================ */
  updateAll(earthG);

})();
</script>
</body>
</html>
