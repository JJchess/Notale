<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第 13 页 · 互动讲义</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* ---- 枚举卡片：水平排列的三张物种卡片 ---- */
    .card-row {
      display: flex;
      flex-direction: row;
      gap: var(--sp-8);
      width: 100%;
    }
    .species-card {
      flex: 1 1 0%;
      min-width: 0;
      cursor: pointer;
      transition: border-color 300ms var(--ease), background 300ms var(--ease), box-shadow 300ms var(--ease);
      user-select: none;
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }
    .species-card:hover {
      border-color: var(--accent-soft);
      background: var(--surface-raised);
    }
    .species-card:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .species-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), var(--shadow-md);
    }
    .card-name {
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }
    .card-range {
      font-size: 30px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.15;
    }
    .card-median {
      font-size: var(--fs-label);
      color: var(--text-sec);
      line-height: 1.4;
    }
    .card-detail {
      font-size: var(--fs-sec);
      color: var(--text-dim);
      line-height: 1.45;
      max-height: 0;
      overflow: hidden;
      transition: max-height 400ms var(--ease), opacity 300ms var(--ease);
      opacity: 0;
    }
    .species-card.active .card-detail {
      max-height: 100px;
      opacity: 1;
    }
    @media (prefers-reduced-motion: reduce) {
      .card-detail {
        transition: none;
      }
      .species-card {
        transition: none;
      }
    }
    /* ---- 提示句 ---- */
    #key-note {
      font-size: var(--fs-sec);
      color: var(--text-dim);
      line-height: 1.45;
      text-align: center;
      min-height: 24px;
    }
    #key-note.has-content {
      color: var(--text-sec);
    }
    /* ---- 图表容器 ---- */
    #chart {
      width: 100%;
      height: 200px;
    }
  </style>
</head>
<body data-page="13" data-total="60">
<div id="stage">
<main id="main" class="col justify-center">

  <!-- 枚举骨架：三种猿人并列 -->
  <div class="k-enumeration">
    <div class="card-row">
      <!-- 南方古猿阿法种 -->
      <div class="panel species-card" data-species="australopithecus_afarensis" tabindex="0" role="button" aria-pressed="false">
        <div class="card-name">南方古猿阿法种</div>
        <div class="card-range" id="range-australopithecus_afarensis">--</div>
        <div class="card-median" id="median-australopithecus_afarensis">中位 -- km/h</div>
        <div class="card-detail" id="detail-australopithecus_afarensis"></div>
      </div>
      <!-- 直立人 -->
      <div class="panel species-card" data-species="homo_erectus" tabindex="0" role="button" aria-pressed="false">
        <div class="card-name">直立人</div>
        <div class="card-range" id="range-homo_erectus">--</div>
        <div class="card-median" id="median-homo_erectus">中位 -- km/h</div>
        <div class="card-detail" id="detail-homo_erectus"></div>
      </div>
      <!-- 智人（早期） -->
      <div class="panel species-card" data-species="homo_sapiens_early" tabindex="0" role="button" aria-pressed="false">
        <div class="card-name">智人（早期）</div>
        <div class="card-range" id="range-homo_sapiens_early">--</div>
        <div class="card-median" id="median-homo_sapiens_early">中位 -- km/h</div>
        <div class="card-detail" id="detail-homo_sapiens_early"></div>
      </div>
    </div>
  </div>

  <!-- 关键句区域 -->
  <div id="key-note" class="mt-6">点击卡片查看骨骼依据与速度对比</div>

  <!-- echarts 柱状图 -->
  <div id="chart" class="mt-4"></div>

</main>
</div>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(function() {
  /* ================================================================
     页眉页脚
  ================================================================ */
  Lec.mount({
    index: 13,
    kicker: '身体遗产',
    title: '猿人奔跑速度估算',
    take: '基于骨骼推算的奔跑速度：南方古猿慢，直立人快，智人耐力强'
  });

  Deck.init({ index: 13, total: 60 });

  /* ================================================================
     数据准备
     Lec.P.getHominidData 目前返回 { height, mass, brainVolume }。
     若 speedRange / speedMedian 字段尚不存在，使用与规划一致的 fallback。
  ================================================================ */
  var speciesKeys = ['australopithecus_afarensis', 'homo_erectus', 'homo_sapiens_early'];

  var speciesDisplay = {
    'australopithecus_afarensis': { name: '南方古猿阿法种', short: '南方古猿' },
    'homo_erectus':              { name: '直立人',         short: '直立人' },
    'homo_sapiens_early':        { name: '智人（早期）',   short: '智人' }
  };

  var boneDetails = {
    'australopithecus_afarensis': '骨骼依据：股骨短、骨盆宽、跟腱附着点低',
    'homo_erectus':              '骨骼依据：股骨延长、骨盆变窄、跟腱附着点上移',
    'homo_sapiens_early':        '骨骼依据：股骨最长、足弓完整、跟腱长、散热系统完善'
  };

  var keyNotes = {
    'australopithecus_afarensis': '南方古猿的奔跑速度不到现代人的一半，但已能短距离追逐。',
    'homo_erectus':              '',
    'homo_sapiens_early':        '智人的耐力优势来自散热系统，而非绝对速度——我们能跑得久，不是跑得快。'
  };

  /* 规划指定的速度数据 fallback —— 与「南方古猿慢，直立人快，智人耐力强」一致。
     若将来 Lec.P.getHominidData 返回 speedRange / speedMedian，则优先使用。 */
  var speedFallback = {
    'australopithecus_afarensis': { speedRange: '12–20 km/h', speedMedian: 16 },
    'homo_erectus':              { speedRange: '25–37 km/h', speedMedian: 31 },
    'homo_sapiens_early':        { speedRange: '20–35 km/h', speedMedian: 27 }
  };

  /* 填充卡片内容 */
  var dataMap = {};
  speciesKeys.forEach(function(key) {
    var d = Lec.P.getHominidData(key);
    var fb = speedFallback[key];
    var speedRange  = (d && d.speedRange)  ? d.speedRange  : fb.speedRange;
    var speedMedian = (d && d.speedMedian != null) ? d.speedMedian : fb.speedMedian;

    dataMap[key] = { speedRange: speedRange, speedMedian: speedMedian };

    var rangeEl  = document.getElementById('range-' + key);
    var medianEl = document.getElementById('median-' + key);
    var detailEl = document.getElementById('detail-' + key);

    if (rangeEl)  rangeEl.textContent = speedRange;
    if (medianEl) medianEl.textContent = '中位 ' + speedMedian + ' km/h';
    if (detailEl) detailEl.textContent = boneDetails[key] || '';
  });

  /* ================================================================
     echarts 柱状图
  ================================================================ */
  var chartDom = document.getElementById('chart');
  var cs = getComputedStyle(document.documentElement);
  var accentColor = cs.getPropertyValue('--accent').trim() || '#4da6ff';
  var dimColor    = cs.getPropertyValue('--text-dim').trim() || '#8899aa';
  var textColor   = cs.getPropertyValue('--text-sec').trim() || '#a0b0c0';
  var borderColor = cs.getPropertyValue('--border').trim() || '#243040';
  var reducedMotion = Deck.reduced();

  var chart = echarts.init(chartDom, null, { renderer: 'svg' });

  function getChartOption(highlightKey) {
    var medians = speciesKeys.map(function(k) { return dataMap[k].speedMedian; });
    var barColors = speciesKeys.map(function(k) {
      if (!highlightKey) return accentColor;
      return k === highlightKey ? accentColor : dimColor;
    });

    return {
      animation: !reducedMotion,
      textStyle: { fontSize: 16 },
      backgroundColor: 'transparent',
      grid: { left: 56, right: 24, top: 24, bottom: 40 },
      xAxis: {
        type: 'category',
        data: speciesKeys.map(function(k) { return speciesDisplay[k].short; }),
        axisLabel: { fontSize: 15, color: textColor },
        axisLine:  { lineStyle: { color: borderColor } },
        axisTick:  { show: false }
      },
      yAxis: {
        type: 'value',
        name: 'km/h',
        nameTextStyle: { fontSize: 14, color: textColor },
        axisLabel: { fontSize: 13, color: textColor },
        splitLine: { lineStyle: { color: borderColor } },
        min: 0
      },
      series: [{
        type: 'bar',
        data: medians.map(function(v, i) {
          return {
            value: v,
            itemStyle: {
              color: barColors[i],
              borderRadius: [4, 4, 0, 0]
            }
          };
        }),
        barWidth: '36%',
        label: {
          show: true,
          position: 'top',
          fontSize: 14,
          color: textColor,
          formatter: '{c}'
        },
        emphasis: {
          itemStyle: { color: accentColor }
        }
      }]
    };
  }

  chart.setOption(getChartOption(null));

  /* ================================================================
     卡片交互
  ================================================================ */
  var cards = document.querySelectorAll('.species-card');
  var keyNote = document.getElementById('key-note');
  var activeSpecies = null;

  function updateChart(speciesKey) {
    chart.setOption(getChartOption(speciesKey));
  }

  function updateNote(speciesKey) {
    var note = keyNotes[speciesKey] || '';
    if (note) {
      keyNote.textContent = note;
      keyNote.classList.add('has-content');
    } else {
      keyNote.textContent = '点击卡片查看骨骼依据与速度对比';
      keyNote.classList.remove('has-content');
    }
  }

  cards.forEach(function(card) {
    card.addEventListener('click', function() {
      var species = card.dataset.species;

      if (activeSpecies === species) {
        /* 取消选中 */
        cards.forEach(function(c) { c.classList.remove('active'); c.setAttribute('aria-pressed', 'false'); });
        activeSpecies = null;
        updateChart(null);
        keyNote.textContent = '点击卡片查看骨骼依据与速度对比';
        keyNote.classList.remove('has-content');
      } else {
        /* 选中新卡片 */
        cards.forEach(function(c) { c.classList.remove('active'); c.setAttribute('aria-pressed', 'false'); });
        card.classList.add('active');
        card.setAttribute('aria-pressed', 'true');
        activeSpecies = species;
        updateChart(species);
        updateNote(species);
      }
    });

    /* 键盘可达：Enter / Space */
    card.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        card.click();
      }
    });
  });

  /* 图表自适应 */
  Deck.onResize(function() {
    chart.resize();
  });

})();
</script>
</body>
</html>
