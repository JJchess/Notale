<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 15 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* Page 15: Chapter 1→2 transition — comparison of two perspectives on the same body */

  .p15-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Override .k-comparison grid to vertical for conceptual comparison */
  .p15-compare {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    width: 100%;
    max-width: 780px;
  }

  .p15-cut {
    width: 100%;
    padding: var(--sp-6) var(--sp-8);
    border-radius: var(--r-lg);
    text-align: center;
  }

  /* Evolution cut: warm amber, smaller */
  .p15-cut--evo {
    background: rgba(245, 158, 11, 0.07);
    border: 1px solid rgba(245, 158, 11, 0.18);
  }

  .p15-cut--evo .p15-tag {
    display: inline-block;
    font-size: var(--fs-label);
    font-weight: 600;
    color: var(--warn);
    letter-spacing: 0.05em;
    margin-bottom: var(--sp-3);
  }

  .p15-cut--evo .p15-body {
    font-size: var(--fs-sec);
    color: var(--text-sec);
    line-height: 1.5;
    max-width: 640px;
    margin: 0 auto;
  }

  /* Physics cut: cool blue, larger, bolder */
  .p15-cut--phys {
    background: rgba(77, 166, 255, 0.07);
    border: 1px solid rgba(77, 166, 255, 0.18);
  }

  .p15-cut--phys .p15-tag {
    display: inline-block;
    font-size: var(--fs-label);
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: var(--sp-3);
  }

  .p15-cut--phys .p15-body {
    font-size: var(--fs-lead);
    color: var(--text);
    font-weight: 500;
    line-height: 1.5;
    max-width: 640px;
    margin: 0 auto;
  }

  /* Vertical connector: line + arrow */
  .p15-joint {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: var(--sp-2) 0;
    user-select: none;
  }

  .p15-joint-line {
    width: 2px;
    height: 20px;
    background: var(--border-strong);
    border-radius: 1px;
  }

  .p15-joint-arrow {
    font-size: 18px;
    line-height: 1;
    color: var(--text-dim);
    margin-top: -1px;
  }

  /* Takeaway lines below panels */
  .p15-takeaway {
    font-size: var(--fs-sec);
    color: var(--text-dim);
    max-width: 640px;
    text-align: center;
    line-height: 1.5;
    margin-top: var(--sp-6);
  }

  .p15-sub {
    font-size: var(--fs-sec);
    color: var(--text-dim);
    max-width: 640px;
    text-align: center;
    line-height: 1.5;
    margin-top: var(--sp-2);
  }
</style>
</head>
<body data-page="15" data-total="60">
<div id="stage">
<main id="main">
  <div class="p15-wrap">
    <div class="k-comparison p15-compare">

      <!-- Evolution cut: Chapter 1 endpoint — warm, smaller -->
      <div class="p15-cut p15-cut--evo">
        <div class="p15-tag">演化切面</div>
        <p class="p15-body">南方古猿、能人、直立人、智人的下肢骨骼告诉我们，演化给了一副为直立行走和奔跑而优化的身体，跳跃能力是这套遗产的直接体现。</p>
      </div>

      <!-- Vertical connector: the handover -->
      <div class="p15-joint">
        <div class="p15-joint-line"></div>
        <div class="p15-joint-arrow">▼</div>
      </div>

      <!-- Physics cut: Chapter 2 starting point — cool, larger -->
      <div class="p15-cut p15-cut--phys">
        <div class="p15-tag">物理切面</div>
        <p class="p15-body">但在地球上，这副身体能跳多高？答案不在骨骼化石里，而在初速度、质量和重力加速度的关系里。</p>
      </div>

    </div>

    <p class="p15-takeaway">身体遗产是工具包，不是答案——它能支撑跳跃，但能跳多高是物理问题，不是化石问题。</p>
    <p class="p15-sub">从这一页开始，我们不再问「演化给了什么」，而是问「在这颗星球上，这副身体能做到什么」。</p>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  Deck.init({ index: 15, total: 60 });
  Lec.mount({
    index: 15,
    kicker: '第二章',
    title: '在地球上，我们能跳多高？',
    take: '从化石到公式'
  });
})();
</script>
</body>
</html>
