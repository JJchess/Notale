<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第 18 页 · 互动讲义</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <script src="assets/lib/echarts.min.js"></script>
  <style>
    /* ============================================================
       Page 18 — 运动员垂直跳对比 · ledger layout
       ============================================================ */

    #main {
      display: flex;
      flex-direction: row;
      gap: var(--sp-8);
      align-items: stretch;
    }

    .table-panel {
      flex: 1 1 58%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
    }

    .chart-panel {
      flex: 1 1 42%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }

    #chart {
      flex: 1 1 auto;
      min-height: 0;
    }

    /* ---- Key insight sentences ---- */
    .insight-block {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }

    .insight {
      font-size: var(--fs-sec);
      line-height: 1.45;
      color: var(--text-sec);
      padding: var(--sp-3) var(--sp-4);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      border-left: 3px solid var(--accent);
    }

    .insight strong {
      color: var(--text);
      font-weight: 600;
    }

    /* ---- Override k-comparison grid for 5-athlete columns ---- */
    .k-comparison.cols-5 {
      grid-template-columns: 120px repeat(5, 1fr);
    }

    .k-comparison.cols-5 .hdr {
      font-size: var(--fs-sec);
      padding: var(--sp-3) var(--sp-2);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .k-comparison.cols-5 .dim {
      font-size: var(--fs-sec);
      padding: var(--sp-3) var(--sp-4);
      font-weight: 500;
      white-space: nowrap;
    }

    .k-comparison.cols-5 > :not(.hdr):not(.dim):not(.diff):not(.rowline) {
      padding: var(--sp-3) var(--sp-2);
      font-size: var(--fs-body);
      text-align: center;
    }

    /* ---- Editable cell ---- */
    .cell-editable {
      cursor: pointer;
      border-radius: var(--r-sm);
      transition: background 150ms var(--ease);
      position: relative;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      font-family: var(--font-mono);
      font-size: var(--fs-body);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .cell-editable:hover {
      background: var(--surface-raised);
    }

    .cell-editable .edit-hint {
      font-size: var(--fs-tick);
      color: var(--text-dim);
      opacity: 0;
      transition: opacity 150ms var(--ease);
      flex-shrink: 0;
    }

    .cell-editable:hover .edit-hint {
      opacity: 0.5;
    }

    .cell-editable input {
      width: 100%;
      background: var(--surface-raised);
      border: 2px solid var(--accent);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: var(--fs-body);
      text-align: center;
      padding: 2px 4px;
      border-radius: var(--r-sm);
      outline: none;
      box-sizing: border-box;
    }

    .cell-editable input:focus-visible {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(96,165,250,0.2);
    }

    /* ---- Read-only velocity cell ---- */
    .cell-velocity {
      color: var(--text-sec);
      font-variant-numeric: tabular-nums;
      font-family: var(--font-mono);
      text-align: center;
    }

    /* ---- Ratio cell (diff highlight) ---- */
    .k-comparison .diff {
      font-variant-numeric: tabular-nums;
      font-family: var(--font-mono);
      font-size: var(--fs-body);
    }

    /* ---- Note cell ---- */
    .cell-note {
      color: var(--text-dim);
      font-size: var(--fs-sec);
      text-align: center;
    }

    /* ---- Chart panel label ---- */
    .chart-label {
      font-size: var(--fs-label);
      color: var(--text-dim);
      text-align: center;
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    /* ---- Velocity unit suffix ---- */
    .unit {
      font-size: var(--fs-tick);
      color: var(--text-dim);
      font-weight: 400;
    }
  </style>
</head>
<body data-page="18" data-total="60">
  <div id="stage">
    <main id="main">
      <!-- Left: table + insights -->
      <div class="table-panel">
        <div class="insight-block">
          <div class="insight">
            <strong>篮球运动员垂直跳约 0.8 m，普通人约 0.4 m，差距来自初速度</strong>——职业运动员起跳瞬间的初速度比普通人大约 40%。
          </div>
          <div class="insight">
            跳跃高度不直接告诉你谁跳得高——<strong>初速度才是那个可比的物理量</strong>，同一套公式下，高度只是结果。
          </div>
        </div>

        <div class="k-comparison cols-5" id="cmp-table">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Right: ECharts bar chart -->
      <div class="chart-panel">
        <div class="chart-label">初速度对比 (m/s)</div>
        <div id="chart"></div>
      </div>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    (function() {
      // ---- Bootstrap ----
      Deck.init({ index: 18, total: 60 });

      Lec.mount({
        index: 18,
        kicker: '第二章 · 地球跳跃实验室',
        title: '运动员垂直跳对比',
        take: '不同运动员的跳跃高度差异，本质上是初速度的差异'
      });

      // ---- Data store ----
      const athletes = [
        { id: 'student',  name: '普通大学生',       height: Lec.K.HUMAN_VERTICAL_JUMP_EARTH, note: '基准' },
        { id: 'amateur',  name: '业余篮球爱好者',   height: 0.6,  note: '—' },
        { id: 'college',  name: '大学篮球校队',     height: 0.7,  note: '—' },
        { id: 'pro',      name: '职业篮球运动员',   height: 0.8,  note: '—' },
        { id: 'elite',    name: '精英跳高运动员',   height: 0.95, note: '—' },
      ];

      const G = Lec.K.EARTH_GRAVITY;

      function getVelocity(h) {
        return Lec.P.initialVelocityForJumpHeight(h, G);
      }

      function getRatio(h) {
        return h / athletes[0].height;
      }

      function fmt1(v) { return v.toFixed(1); }
      function fmt2(v) { return v.toFixed(2); }

      // ---- Render table ----
      const tableEl = document.getElementById('cmp-table');

      function renderTable() {
        // Build header row
        let html = '<div class="hdr"></div>';
        for (const a of athletes) {
          html += `<div class="hdr">${a.name}</div>`;
        }

        // Height row (editable)
        html += '<div class="dim">垂直跳高度 (m)</div>';
        for (let i = 0; i < athletes.length; i++) {
          html += `<div class="cell-editable" data-idx="${i}" data-field="height" tabindex="0" role="button" aria-label="编辑${athletes[i].name}的垂直跳高度">${fmt2(athletes[i].height)}<span class="edit-hint">✎</span></div>`;
        }

        // Velocity row (read-only)
        html += '<div class="dim">初速度 (m/s)</div>';
        for (const a of athletes) {
          const v = getVelocity(a.height);
          html += `<div class="cell-velocity">${fmt1(v)}</div>`;
        }

        // Ratio row (diff highlight)
        html += '<div class="dim">与普通人比值</div>';
        for (const a of athletes) {
          const r = getRatio(a.height);
          const cls = (r === 1.0) ? '' : 'diff';
          html += `<div class="${cls}">${fmt2(r)}×</div>`;
        }

        // Notes row
        html += '<div class="dim">备注</div>';
        for (const a of athletes) {
          html += `<div class="cell-note">${a.note}</div>`;
        }

        tableEl.innerHTML = html;

        // Attach edit handlers
        const editables = tableEl.querySelectorAll('.cell-editable');
        for (const el of editables) {
          el.addEventListener('click', onEditClick);
          el.addEventListener('keydown', onEditKey);
        }
      }

      // ---- Edit interaction ----
      let editingCell = null;
      let editInput = null;

      function onEditClick(e) {
        if (editingCell) return; // Already editing
        const cell = e.currentTarget;
        startEdit(cell);
      }

      function onEditKey(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          if (!editingCell) {
            startEdit(e.currentTarget);
          }
        }
      }

      function startEdit(cell) {
        const idx = parseInt(cell.dataset.idx);
        const currentVal = athletes[idx].height;

        editingCell = cell;
        const input = document.createElement('input');
        input.type = 'number';
        input.min = '0.1';
        input.max = '1.5';
        input.step = '0.01';
        input.value = fmt2(currentVal);
        editInput = input;

        cell.textContent = '';
        cell.appendChild(input);

        input.focus();
        input.select();

        input.addEventListener('blur', commitEdit);
        input.addEventListener('keydown', function(ev) {
          if (ev.key === 'Enter') {
            ev.preventDefault();
            commitEdit();
          }
          if (ev.key === 'Escape') {
            ev.preventDefault();
            cancelEdit();
          }
        });
      }

      function commitEdit() {
        if (!editingCell || !editInput) return;

        const idx = parseInt(editingCell.dataset.idx);
        let raw = parseFloat(editInput.value);

        // Validate
        if (isNaN(raw)) raw = athletes[idx].height;
        raw = Math.max(0.1, Math.min(1.5, raw));
        raw = Math.round(raw * 100) / 100; // Round to 0.01

        athletes[idx].height = raw;

        cleanupEdit();
        refreshAll();
      }

      function cancelEdit() {
        cleanupEdit();
        renderTable();
        editingCell = null;
        editInput = null;
      }

      function cleanupEdit() {
        if (editInput) {
          editInput.removeEventListener('blur', commitEdit);
          editInput = null;
        }
        editingCell = null;
      }

      // ---- Refresh all: table + chart ----
      function refreshAll() {
        renderTable();
        updateChart();
      }

      // ---- ECharts chart ----
      let chart = null;

      function initChart() {
        const dom = document.getElementById('chart');
        if (!dom) return;

        chart = echarts.init(dom, null, {
          renderer: 'svg'
        });

        updateChart();
      }

      function updateChart() {
        if (!chart) return;

        const names = athletes.map(a => a.name);
        const velocities = athletes.map(a => getVelocity(a.height));
        const ratios = athletes.map(a => getRatio(a.height));
        const baseline = getVelocity(athletes[0].height);

        // Color: gradient from baseline-blue to accent based on ratio
        const maxRatio = Math.max(...ratios);
        const colors = ratios.map(r => {
          const t = maxRatio > 1 ? (r - 1) / (maxRatio - 1) : 0;
          // Interpolate from a muted blue to accent
          const r2 = Math.round(56 + t * 21);
          const g2 = Math.round(130 + t * 36);
          const b2 = Math.round(200 + t * 50);
          return `rgb(${r2},${g2},${b2})`;
        });

        const option = {
          textStyle: {
            fontSize: 16,
            fontFamily: 'Inter, Segoe UI, system-ui, -apple-system, sans-serif'
          },
          grid: {
            left: 8,
            right: 56,
            top: 8,
            bottom: 8,
            containLabel: true
          },
          tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'shadow' },
            textStyle: { fontSize: 14 },
            formatter: function(params) {
              const p = params[0];
              const idx = p.dataIndex;
              return `${p.name}<br/>初速度: <b>${fmt1(velocities[idx])} m/s</b><br/>比值: ${fmt2(ratios[idx])}×`;
            }
          },
          xAxis: {
            type: 'value',
            name: '初速度 (m/s)',
            nameTextStyle: { fontSize: 14, color: '#a0b0c0' },
            axisLabel: {
              fontSize: 14,
              color: '#8899aa',
              formatter: function(v) { return v.toFixed(1); }
            },
            axisLine: { lineStyle: { color: '#334455' } },
            axisTick: { lineStyle: { color: '#334455' } },
            splitLine: { lineStyle: { color: '#243040' } },
            min: 0,
            max: Math.ceil(Math.max(...velocities) * 1.15 * 10) / 10
          },
          yAxis: {
            type: 'category',
            data: names,
            axisLabel: {
              fontSize: 14,
              color: '#e6edf5'
            },
            axisLine: { lineStyle: { color: '#334455' } },
            axisTick: { show: false },
            inverse: true
          },
          series: [{
            type: 'bar',
            data: velocities.map((v, i) => ({
              value: v,
              itemStyle: {
                color: colors[i],
                borderRadius: [0, 4, 4, 0]
              }
            })),
            barWidth: '55%',
            label: {
              show: true,
              position: 'right',
              fontSize: 14,
              color: '#a0b0c0',
              formatter: function(p) {
                return fmt1(p.value) + ' m/s';
              }
            },
            markLine: {
              silent: true,
              symbol: 'none',
              lineStyle: {
                color: '#f59e0b',
                type: 'dashed',
                width: 1
              },
              label: {
                show: false
              },
              data: [{
                xAxis: baseline
              }]
            },
            animation: !Deck.reduced(),
            animationDuration: Deck.reduced() ? 0 : 300,
            animationEasing: 'cubicOut'
          }]
        };

        chart.setOption(option, true);
      }

      // ---- Handle resize ----
      function onResize() {
        if (chart) {
          chart.resize();
        }
      }
      window.addEventListener('resize', onResize);

      // ---- Handle document click to commit edit ----
      document.addEventListener('click', function(e) {
        if (editingCell && editInput) {
          if (!editingCell.contains(e.target)) {
            commitEdit();
          }
        }
      });

      // ---- Start ----
      renderTable();
      initChart();
    })();
  </script>
</body>
</html>
