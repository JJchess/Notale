<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 21 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ============================================================
     Page 21 – 动物跳跃对比 · classification
     Three-tier classification of mammalian jumping ability.
     ============================================================ */

  /* ---- intro / conclusion ---- */
  .p21-intro {
    font-size: var(--fs-body);
    color: var(--text-sec);
    line-height: 1.45;
    margin: 0 0 var(--sp-6) 0;
    max-width: 1100px;
  }
  .p21-conclusion {
    font-size: var(--fs-body);
    color: var(--text);
    font-weight: 500;
    line-height: 1.45;
    margin: var(--sp-6) 0 0 0;
    border-left: 3px solid var(--accent);
    padding-left: var(--sp-4);
  }

  /* ---- three-column row ---- */
  .p21-cols {
    display: flex;
    flex-direction: row;
    gap: var(--sp-4);
    align-items: stretch;
  }

  /* ---- each tier box ---- */
  .p21-tier {
    flex: 1 1 0%;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    background: var(--surface);
    padding: var(--sp-4);
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }
  .p21-tier--mid {
    border-color: var(--diff-fg);
    box-shadow: 0 0 12px rgba(255,184,50,0.15);
  }

  .p21-tier-hd {
    font-size: var(--fs-sec);
    font-weight: 600;
    color: var(--text);
    padding-bottom: var(--sp-2);
    border-bottom: 1px solid var(--border);
    margin: 0;
  }
  .p21-tier--mid .p21-tier-hd {
    color: var(--diff-fg);
    border-bottom-color: var(--diff-fg);
  }

  /* ---- animal card ---- */
  .p21-card {
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    background: var(--surface-raised);
    padding: var(--sp-3);
    cursor: pointer;
    transition: border-color 200ms var(--ease), box-shadow 200ms var(--ease);
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
    user-select: none;
  }
  .p21-card:hover {
    border-color: var(--border-strong);
  }
  .p21-card:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .p21-card.is-open {
    border-color: var(--accent-soft);
    box-shadow: 0 0 8px rgba(77,166,255,0.2);
  }

  /* human card highlight */
  .p21-card--human {
    border-color: var(--diff-fg);
    box-shadow: 0 0 10px rgba(255,184,50,0.2);
    background: rgba(255,184,50,0.06);
  }
  .p21-card--human:hover {
    border-color: var(--diff-fg);
  }

  /* ---- card top row: photo + text ---- */
  .p21-card-top {
    display: flex;
    flex-direction: row;
    gap: var(--sp-3);
    align-items: center;
  }
  .p21-card-img {
    width: 56px;
    height: 56px;
    border-radius: var(--r-sm);
    object-fit: cover;
    flex-shrink: 0;
    background: var(--border);
  }
  .p21-card-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .p21-card-name {
    font-size: var(--fs-label);
    font-weight: 600;
    color: var(--text);
    line-height: 1.35;
  }
  .p21-card-sci {
    font-size: var(--fs-tick);
    color: var(--text-dim);
    font-style: italic;
    line-height: 1.35;
  }
  .p21-card-stat {
    font-size: var(--fs-sec);
    color: var(--text-sec);
    line-height: 1.35;
  }
  .p21-card-stat b {
    color: var(--text);
    font-weight: 600;
  }

  /* ---- endurance bar area ---- */
  .p21-endurance {
    display: none;
    border-top: 1px dashed var(--border);
    padding-top: var(--sp-2);
    margin-top: 2px;
  }
  .p21-endurance.is-visible {
    display: block;
  }
  .p21-endurance .echart-ct {
    width: 100%;
    height: 52px;
  }
  .p21-endurance-label {
    font-size: var(--fs-label);
    color: var(--text-dim);
    margin-bottom: 2px;
    line-height: 1.4;
  }

  /* ---- echarts text override ---- */
  .p21-tier .echart-ct svg text {
    font-family: var(--font-sans) !important;
  }
</style>
</head>
<body data-page="21" data-total="60">
<div id="stage">
<main id="main"></main>
</div>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>

<script>
(function() {
  /* ==============================================================
     Data – all animal specs. Jump heights & endurance from p21.md.
     Initial velocities computed via Lec.P.
     ============================================================== */
  var g = Lec.K.EARTH_GRAVITY;

  var ANIMALS = [
    // Tier 1: jump higher than human (>0.6 m)
    { id:'kangaroo',   tier:1, name:'大袋鼠',     sci:'Macropus rufus',       jumpH:1.8,  endurance:2,  enduranceLabel:'高速跳跃约 2 km',
      thumb:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Red_Kangaroos_at_Sturt_National_Park_NSW.jpg/960px-Red_Kangaroos_at_Sturt_National_Park_NSW.jpg',
      author:'PotMart186', license:'CC BY-SA 4.0' },
    { id:'impala',     tier:1, name:'黑斑羚',      sci:'Aepyceros melampus',   jumpH:1.5,  endurance:5,  enduranceLabel:'高速奔跑约 5 km',
      thumb:'https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Impala_%28Aepyceros_melampus%29_female_with_red-billed_oxpecker_Kruger.jpg/960px-Impala_%28Aepyceros_melampus%29_female_with_red-billed_oxpecker_Kruger.jpg',
      author:'Charles J. Sharp', license:'CC BY-SA 4.0' },
    { id:'puma',       tier:1, name:'美洲狮',      sci:'Puma concolor',        jumpH:1.2,  endurance:8,  enduranceLabel:'持续奔跑约 8 km',
      thumb:'https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Puma_%28Puma_concolor%29_-_20191228.jpg/960px-Puma_%28Puma_concolor%29_-_20191228.jpg',
      author:'Shahzaib Damn Cruze', license:'CC BY-SA 4.0' },

    // Tier 2: similar to human (0.3–0.6 m)
    { id:'human',      tier:2, name:'智人',        sci:'Homo sapiens',         jumpH:Lec.K.HUMAN_VERTICAL_JUMP_EARTH, endurance:20, enduranceLabel:'中等速度可持续 20+ km',
      thumb:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Human_running_gait_-_terminal_swing_to_heel_strike_%28runner_with_Asics_Metaspeed_Edge_Paris_-_2024_Ljubljana_Marathon%29.jpg/960px-Human_running_gait_-_terminal_swing_to_heel_strike_%28runner_with_Asics_Metaspeed_Edge_Paris_-_2024_Ljubljana_Marathon%29.jpg',
      author:'Petar Milošević', license:'CC BY-SA 4.0' },
    { id:'hyena',      tier:2, name:'斑鬣狗',      sci:'Crocuta crocuta',      jumpH:0.5,  endurance:15, enduranceLabel:'持续奔跑约 15 km',
      thumb:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Crocuta_crocuta.jpg/960px-Crocuta_crocuta.jpg',
      author:'Ikiwaner', license:'CC BY-SA 3.0' },
    { id:'wolf',       tier:2, name:'灰狼',        sci:'Canis lupus',          jumpH:0.45, endurance:10, enduranceLabel:'持续奔跑约 10 km',
      thumb:'https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Canis_lupus_baileyi_running.jpg/960px-Canis_lupus_baileyi_running.jpg',
      author:'Jim Clark', license:'Public domain' },

    // Tier 3: jump lower than human (<0.3 m)
    { id:'elephant',   tier:3, name:'非洲象',      sci:'Loxodonta africana',   jumpH:0,    endurance:5,  enduranceLabel:'长距离行走约 5 km（无法跳跃）',
      thumb:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/African_bush_elephants_%28Loxodonta_africana%29_female_with_six-week-old_baby.jpg/960px-African_bush_elephants_%28Loxodonta_africana%29_female_with_six-week-old_baby.jpg',
      author:'Charles J. Sharp', license:'CC BY-SA 4.0' },
    { id:'hippo',      tier:3, name:'河马',        sci:'Hippopotamus amphibius', jumpH:0.1, endurance:1,  enduranceLabel:'短距离冲刺约 1 km',
      thumb:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/048_Hippopotamus_fight_in_the_Serengeti_National_Park_Photo_by_Giles_Laurent.jpg/960px-048_Hippopotamus_fight_in_the_Serengeti_National_Park_Photo_by_Giles_Laurent.jpg',
      author:'Giles Laurent', license:'CC BY-SA 4.0' }
  ];

  // Pre-compute initial velocities
  ANIMALS.forEach(function(a) {
    a.v0 = a.jumpH > 0.01 ? Lec.P.initialVelocityForJumpHeight(a.jumpH, g) : 0;
  });

  /* ==============================================================
     Build DOM
     ============================================================== */
  var main = document.getElementById('main');

  // Intro
  var intro = document.createElement('p');
  intro.className = 'p21-intro';
  intro.textContent = '人类垂直跳跃高度在哺乳动物中排在中游——跳不过袋鼠和黑斑羚，但比大象和河马强得多。点击卡片，看看耐力的故事。';
  main.appendChild(intro);

  // Three-column container
  var cols = document.createElement('div');
  cols.className = 'p21-cols';

  var tierLabels = ['跳得比人类高（> 0.6 m）', '与人类相近（0.3 – 0.6 m）', '跳得比人类低（< 0.3 m）'];
  var tierAnimals = [[], [], []];
  ANIMALS.forEach(function(a) { tierAnimals[a.tier - 1].push(a); });

  var allCardEls = [];       // flat list of card DOM elements
  var echartsInstances = {}; // id -> echarts instance
  var openCardId = 'human';  // track which non-human card is open

  for (var t = 0; t < 3; t++) {
    var tierDiv = document.createElement('div');
    tierDiv.className = 'p21-tier';
    if (t === 1) tierDiv.classList.add('p21-tier--mid');

    var hd = document.createElement('div');
    hd.className = 'p21-tier-hd';
    hd.textContent = tierLabels[t];
    tierDiv.appendChild(hd);

    var animals = tierAnimals[t];
    for (var i = 0; i < animals.length; i++) {
      var a = animals[i];
      var card = document.createElement('div');
      card.className = 'p21-card';
      card.setAttribute('tabindex', '0');
      card.setAttribute('role', 'button');
      card.setAttribute('aria-expanded', a.id === 'human' ? 'true' : 'false');
      card.dataset.animalId = a.id;
      if (a.id === 'human') card.classList.add('p21-card--human');

      // Top row: image + info
      var top = document.createElement('div');
      top.className = 'p21-card-top';

      var img = document.createElement('img');
      img.className = 'p21-card-img';
      img.src = a.thumb;
      img.alt = a.name;
      img.loading = 'lazy';
      img.title = '照片：' + a.author + ' / ' + a.license;
      top.appendChild(img);

      var info = document.createElement('div');
      info.className = 'p21-card-info';

      var nameEl = document.createElement('span');
      nameEl.className = 'p21-card-name';
      nameEl.textContent = a.name;
      info.appendChild(nameEl);

      var sciEl = document.createElement('span');
      sciEl.className = 'p21-card-sci';
      sciEl.textContent = a.sci;
      info.appendChild(sciEl);

      var statEl = document.createElement('span');
      statEl.className = 'p21-card-stat';
      statEl.innerHTML = '跳跃高度 <b>' + a.jumpH.toFixed(2) + ' m</b>';
      info.appendChild(statEl);

      top.appendChild(info);
      card.appendChild(top);

      // Endurance bar area
      var enduranceDiv = document.createElement('div');
      enduranceDiv.className = 'p21-endurance';
      if (a.id === 'human') enduranceDiv.classList.add('is-visible');

      var enduranceLabel = document.createElement('div');
      enduranceLabel.className = 'p21-endurance-label';
      enduranceLabel.textContent = a.enduranceLabel;
      enduranceDiv.appendChild(enduranceLabel);

      var chartCt = document.createElement('div');
      chartCt.className = 'echart-ct';
      chartCt.id = 'echart-' + a.id;
      enduranceDiv.appendChild(chartCt);

      card.appendChild(enduranceDiv);

      // Click handler
      card.addEventListener('click', function(animalId, cardEl, endDiv) {
        return function() {
          handleCardClick(animalId, cardEl, endDiv);
        };
      }(a.id, card, enduranceDiv));

      // Keyboard handler
      card.addEventListener('keydown', function(animalId, cardEl, endDiv) {
        return function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            handleCardClick(animalId, cardEl, endDiv);
          }
        };
      }(a.id, card, enduranceDiv));

      tierDiv.appendChild(card);
      allCardEls.push({ id: a.id, el: card, endDiv: enduranceDiv, chartCtId: 'echart-' + a.id, animal: a });
    }

    cols.appendChild(tierDiv);
  }

  main.appendChild(cols);

  // Conclusion
  var conclusion = document.createElement('p');
  conclusion.className = 'p21-conclusion';
  conclusion.textContent = '演化没有给我们最高的跳跃，但给了我们最持久的运动能力——散热系统是我们的秘密武器。';
  main.appendChild(conclusion);

  /* ==============================================================
     Interaction: click card → show endurance bar
     ============================================================== */
  function handleCardClick(animalId, cardEl, endDiv) {
    // Human card is always open – clicking it does nothing extra
    if (animalId === 'human') return;

    // Close previously open non-human card
    if (openCardId && openCardId !== 'human' && openCardId !== animalId) {
      var prev = findCardData(openCardId);
      if (prev) {
        prev.el.classList.remove('is-open');
        prev.el.setAttribute('aria-expanded', 'false');
        prev.endDiv.classList.remove('is-visible');
        if (echartsInstances[openCardId]) {
          echartsInstances[openCardId].dispose();
          delete echartsInstances[openCardId];
        }
      }
    }

    // Toggle current card
    var isOpen = cardEl.classList.contains('is-open');
    if (isOpen) {
      cardEl.classList.remove('is-open');
      cardEl.setAttribute('aria-expanded', 'false');
      endDiv.classList.remove('is-visible');
      if (echartsInstances[animalId]) {
        echartsInstances[animalId].dispose();
        delete echartsInstances[animalId];
      }
      openCardId = 'human';
    } else {
      cardEl.classList.add('is-open');
      cardEl.setAttribute('aria-expanded', 'true');
      endDiv.classList.add('is-visible');
      openCardId = animalId;
      // Create echarts if not already
      if (!echartsInstances[animalId]) {
        createEnduranceChart(animalId);
      }
    }
  }

  function findCardData(id) {
    for (var i = 0; i < allCardEls.length; i++) {
      if (allCardEls[i].id === id) return allCardEls[i];
    }
    return null;
  }

  /* ==============================================================
     ECharts – endurance horizontal bar chart
     ============================================================== */
  function createEnduranceChart(animalId) {
    var cd = findCardData(animalId);
    if (!cd) return;
    var a = cd.animal;
    var humanA = findCardData('human').animal;

    var dom = document.getElementById(cd.chartCtId);
    if (!dom) return;

    var chart = echarts.init(dom, null, { renderer: 'svg' });
    echartsInstances[animalId] = chart;

    var maxVal = Math.max(a.endurance, humanA.endurance) * 1.2;

    chart.setOption({
      textStyle: { fontSize: 13, fontFamily: 'Inter, system-ui, sans-serif' },
      grid: { left: 70, right: 20, top: 4, bottom: 4 },
      xAxis: {
        type: 'value',
        max: maxVal,
        axisLabel: { fontSize: 12, color: '#8899aa', formatter: '{value} km' },
        axisLine: { lineStyle: { color: '#243040' } },
        axisTick: { show: false },
        splitLine: { show: false }
      },
      yAxis: {
        type: 'category',
        data: [a.name, '人类'],
        axisLabel: { fontSize: 14, color: '#a0b0c0' },
        axisLine: { show: false },
        axisTick: { show: false }
      },
      series: [{
        type: 'bar',
        data: [
          { value: a.endurance, itemStyle: { color: '#4da6ff', borderRadius: [0, 3, 3, 0] } },
          { value: humanA.endurance, itemStyle: { color: '#ffb832', borderRadius: [0, 3, 3, 0] } }
        ],
        barWidth: 12,
        label: {
          show: true,
          position: 'right',
          fontSize: 13,
          color: '#a0b0c0',
          formatter: '{c} km'
        },
        emphasis: { itemStyle: { color: '#60a5fa' } }
      }]
    });
  }

  // Create human endurance chart immediately (always visible)
  function initHumanChart() {
    var cd = findCardData('human');
    if (!cd) return;
    var dom = document.getElementById(cd.chartCtId);
    if (!dom) return;
    var chart = echarts.init(dom, null, { renderer: 'svg' });
    echartsInstances['human'] = chart;

    chart.setOption({
      textStyle: { fontSize: 13, fontFamily: 'Inter, system-ui, sans-serif' },
      grid: { left: 70, right: 20, top: 4, bottom: 4 },
      xAxis: {
        type: 'value',
        max: 25,
        axisLabel: { fontSize: 12, color: '#8899aa', formatter: '{value} km' },
        axisLine: { lineStyle: { color: '#243040' } },
        axisTick: { show: false },
        splitLine: { show: false }
      },
      yAxis: {
        type: 'category',
        data: ['人类'],
        axisLabel: { fontSize: 14, color: '#ffb832', fontWeight: 'bold' },
        axisLine: { show: false },
        axisTick: { show: false }
      },
      series: [{
        type: 'bar',
        data: [{ value: 20, itemStyle: { color: '#ffb832', borderRadius: [0, 3, 3, 0] } }],
        barWidth: 12,
        label: { show: true, position: 'right', fontSize: 13, color: '#ffb832', formatter: '{c} km', fontWeight: 'bold' },
        emphasis: { itemStyle: { color: '#ffc850' } }
      }]
    });
  }

  /* ==============================================================
     Lec.mount – header & footer
     ============================================================== */
  Lec.mount({
    index: 21,
    kicker: '第2章 · 地球跳跃实验室',
    title: '动物跳跃对比',
    take: '跳跃高度只是故事的一半，人类真正的优势在耐力',
    foot: '照片来源：Wikimedia Commons（CC BY-SA / Public domain）。具体作者与许可见各图片 title 属性。'
  });

  /* ==============================================================
     Deck.init – keyboard nav
     ============================================================== */
  Deck.init({ index: 21, total: 60 });

  /* ==============================================================
     Init human endurance chart after DOM settles
     ============================================================== */
  // Small delay to ensure echarts DOM is ready
  setTimeout(initHumanChart, 100);

})();
</script>
</body>
</html>
