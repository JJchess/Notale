<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第 23 页 · 互动讲义</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* ===== Page 23: 赤道跳得更高（但真的只高一点点）===== */

    /* ---- enumeration items as clickable rows ---- */
    .k-enumeration > .it-row {
      cursor: pointer;
      transition: border-color 200ms var(--ease), background 200ms var(--ease), box-shadow 200ms var(--ease);
      user-select: none;
      align-items: center;
      padding: var(--sp-3) var(--sp-5);
    }
    .k-enumeration > .it-row:hover {
      border-color: var(--border-strong);
    }
    .k-enumeration > .it-row:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: -2px;
    }
    .k-enumeration > .it-row.it--active {
      border-color: var(--accent);
      background: var(--surface-raised);
      box-shadow: 0 0 18px rgba(77,166,255,0.14);
    }
    .k-enumeration > .it-row.it--active::before {
      color: var(--accent);
    }

    /* ---- three-column layout inside each .it ---- */
    .it-col {
      display: flex;
      flex-direction: row;
      align-items: center;
      width: 100%;
      gap: var(--sp-8);
    }
    .it-col .lat {
      font-size: var(--fs-body);
      color: var(--text);
      font-weight: 600;
      min-width: 130px;
    }
    .it-col .grav {
      font-size: var(--fs-sec);
      color: var(--text-sec);
      font-family: var(--font-mono);
      min-width: 150px;
    }
    .it-col .jump {
      font-size: var(--fs-body);
      color: var(--text);
      font-family: var(--font-mono);
      font-weight: 600;
      min-width: 140px;
    }

    /* ---- highlight display box ---- */
    .hl-box {
      background: var(--surface-raised);
      border: 1px solid var(--accent);
      border-radius: var(--r-md);
      padding: var(--sp-4) var(--sp-6);
      text-align: center;
      box-shadow: 0 0 20px rgba(77,166,255,0.10);
    }
    .hl-box .hl-label {
      font-size: var(--fs-label);
      color: var(--text-dim);
      margin-bottom: 2px;
    }
    .hl-box .hl-value {
      font-size: 30px;
      font-weight: 700;
      color: var(--accent);
      font-family: var(--font-mono);
      line-height: 1.2;
    }
    .hl-box .hl-note {
      font-size: var(--fs-sec);
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* ---- key sentences ---- */
    .key-s {
      font-size: var(--fs-body);
      color: var(--text);
      line-height: 1.45;
      max-width: 620px;
    }
    .key-s em {
      color: var(--accent);
      font-style: normal;
      font-weight: 600;
    }
  </style>
</head>
<body data-page="23" data-total="60">
  <div id="stage">
    <main id="main"></main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/echarts.min.js"></script>

  <script>
  (function() {
    Deck.init({ index: 23, total: 60 });

    /* ================================================================
       gravityAtLatitude – International Gravity Formula 1980
       Not in Lec.P; implemented here per the page plan.
       @param {number} lat – latitude in degrees
       @param {number} baseGravity – mean gravity (kept for API consistency)
       @returns {number} surface gravity at that latitude (m/s²)
    ================================================================ */
    function gravityAtLatitude(lat, baseGravity) {
      var phi = lat * Math.PI / 180;
      var sinPhi = Math.sin(phi);
      var sin2Phi = sinPhi * sinPhi;
      var sin2Phi2 = Math.sin(2 * phi); sin2Phi2 = sin2Phi2 * sin2Phi2;
      return 9.780327 * (1 + 0.0053024 * sin2Phi - 0.0000058 * sin2Phi2);
    }

    /* ---- mount header / footer ---- */
    Lec.mount({
      index: 23,
      kicker: '第 2 章 · 地球跳跃实验室',
      title: '赤道跳得更高（但真的只高一点点）',
      take: '地球重力加速度随纬度变化不到 1%，赤道跳得稍高但差异极小，完全可以忽略。'
    });

    var main = document.getElementById('main');
    main.className = 'col gap-6';
    main.style.height = '100%';

    /* ---- data ---- */
    var baseGravity = Lec.K.EARTH_GRAVITY;
    var v0 = Lec.K.HUMAN_JUMP_INITIAL_VELOCITY;

    var sites = [
      { name: '赤道 0°',    lat:  0 },
      { name: '北纬 30°',   lat: 30 },
      { name: '北纬 45°',   lat: 45 },
      { name: '北纬 60°',   lat: 60 },
      { name: '北极 90°',   lat: 90 },
      { name: '南纬 45°',   lat:-45 }
    ];

    var data = sites.map(function(s) {
      var g = gravityAtLatitude(s.lat, baseGravity);
      var h = Lec.P.jumpHeightFromVelocity(v0, g);
      return { name: s.name, lat: s.lat, gravity: g, height: h };
    });

    /* ---- two key sentences (numbers computed from data) ---- */
    var eqHeight = data[0].height;
    var poleHeight = data[4].height;
    var diffMM = ((eqHeight - poleHeight) * 1000).toFixed(1);
    var avgHeight = ((eqHeight + poleHeight) / 2).toFixed(1);

    var sRow = document.createElement('div');
    sRow.className = 'row gap-8 items-start';
    var s1 = document.createElement('p');
    s1.className = 'key-s';
    s1.innerHTML = '地球重力加速度随纬度变化，赤道最小，两极最大——但差异<em>不到 1%</em>。';
    var s2 = document.createElement('p');
    s2.className = 'key-s';
    s2.innerHTML = '你在赤道确实跳得稍高一点，但这点差异<em>完全可以忽略</em>：一个约 ' + avgHeight + ' m 的垂直跳，从北极搬到赤道只多出约 ' + diffMM + ' mm。';
    sRow.appendChild(s1);
    sRow.appendChild(s2);
    main.appendChild(sRow);

    /* ---- highlight display ---- */
    var hlBox = document.createElement('div');
    hlBox.className = 'hl-box';
    hlBox.innerHTML =
      '<div class="hl-label">点击列表中任意纬度站点</div>' +
      '<div class="hl-value">—</div>' +
      '<div class="hl-note">试试看，数字几乎不动</div>';
    main.appendChild(hlBox);

    /* ---- main content: list + chart ---- */
    var contentRow = document.createElement('div');
    contentRow.className = 'row gap-8 grow';

    /* -- left: enumeration list -- */
    var listWrap = document.createElement('div');
    listWrap.className = 'k-enumeration';
    listWrap.style.flex = '1 1 0%';
    listWrap.style.minWidth = '0';

    var itEls = [];

    data.forEach(function(d, i) {
      var it = document.createElement('div');
      it.className = 'it it-row';
      it.setAttribute('tabindex', '0');
      it.setAttribute('role', 'option');
      it.setAttribute('aria-selected', 'false');
      it.dataset.index = i;

      var inner = document.createElement('div');
      inner.className = 'it-col';
      inner.innerHTML =
        '<span class="lat">' + d.name + '</span>' +
        '<span class="grav">' + d.gravity.toFixed(3) + ' m/s²</span>' +
        '<span class="jump">' + d.height.toFixed(4) + ' m</span>';
      it.appendChild(inner);

      it.addEventListener('click', function() { selectSite(i); });
      it.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          selectSite(i);
        }
      });

      listWrap.appendChild(it);
      itEls.push(it);
    });

    contentRow.appendChild(listWrap);

    /* -- right: echarts bar chart -- */
    var chartDiv = document.createElement('div');
    chartDiv.id = 'chart';
    chartDiv.style.width = '460px';
    chartDiv.style.height = '100%';
    chartDiv.style.flexShrink = '0';
    contentRow.appendChild(chartDiv);

    main.appendChild(contentRow);

    /* ---- echarts ---- */
    var chart = echarts.init(chartDiv, null, { renderer: 'svg' });

    var barValues = data.map(function(d) { return d.height; });
    var catNames = data.map(function(d) { return d.name; });

    function buildChartOption(highlightIdx) {
      return {
        textStyle: { fontSize: 16, fontFamily: 'Inter, Segoe UI, system-ui, sans-serif' },
        grid: { left: 110, right: 90, top: 16, bottom: 28 },
        tooltip: {
          trigger: 'axis',
          axisPointer: { type: 'shadow' },
          textStyle: { fontSize: 16 },
          formatter: function(params) {
            var p = params[0];
            var d = data[p.dataIndex];
            return '<strong>' + d.name + '</strong><br/>' +
              '重力加速度: ' + d.gravity.toFixed(3) + ' m/s²<br/>' +
              '跳跃高度: ' + d.height.toFixed(4) + ' m';
          }
        },
        xAxis: {
          type: 'value',
          name: '跳跃高度 (m)',
          nameTextStyle: { fontSize: 14, color: '#a0b0c0' },
          axisLabel: { fontSize: 13, color: '#8899aa' },
          min: 0,
          max: 0.7,
          splitLine: { lineStyle: { color: '#243040' } }
        },
        yAxis: {
          type: 'category',
          data: catNames,
          axisLabel: { fontSize: 14, color: '#e6edf5' },
          axisLine: { lineStyle: { color: '#334455' } },
          axisTick: { show: false }
        },
        series: [{
          type: 'bar',
          data: barValues.map(function(v, j) {
            return {
              value: v,
              itemStyle: {
                color: j === highlightIdx ? '#60a5fa' : '#4da6ff',
                borderRadius: [0, 2, 2, 0],
                opacity: j === highlightIdx ? 1 : 0.55
              }
            };
          }),
          barWidth: '50%',
          label: {
            show: true,
            position: 'right',
            fontSize: 14,
            color: '#e6edf5',
            fontFamily: 'JetBrains Mono, Cascadia Code, SF Mono, Consolas, monospace',
            formatter: function(p) { return p.value.toFixed(4); }
          },
          emphasis: {
            itemStyle: { color: '#60a5fa', opacity: 1 }
          }
        }]
      };
    }

    chart.setOption(buildChartOption(-1));

    chart.on('click', function(params) {
      if (params.componentType === 'series') {
        selectSite(params.dataIndex);
      }
    });

    /* ---- selection logic ---- */
    var selectedIndex = -1;

    function selectSite(i) {
      if (selectedIndex === i) return;

      if (selectedIndex >= 0) {
        itEls[selectedIndex].classList.remove('it--active');
        itEls[selectedIndex].setAttribute('aria-selected', 'false');
      }

      selectedIndex = i;
      itEls[i].classList.add('it--active');
      itEls[i].setAttribute('aria-selected', 'true');

      var d = data[i];

      // Update highlight box
      hlBox.querySelector('.hl-label').textContent = '当前选中：' + d.name;
      hlBox.querySelector('.hl-value').textContent = d.height.toFixed(4) + ' m';

      // Compute the range to show how tiny the difference is
      var minH = data.reduce(function(a,b) { return Math.min(a, b.height); }, Infinity);
      var maxH = data.reduce(function(a,b) { return Math.max(a, b.height); }, -Infinity);
      var range = maxH - minH;
      hlBox.querySelector('.hl-note').textContent =
        '重力加速度 ' + d.gravity.toFixed(3) + ' m/s² —— ' +
        '六站跳跃高度差异仅 ' + (range * 1000).toFixed(1) + ' mm（约 ' + (range / maxH * 100).toFixed(1) + '%）';

      chart.setOption(buildChartOption(i));
    }

    // Auto-select first row
    selectSite(0);

  })();
  </script>
</body>
</html>
