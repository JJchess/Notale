<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第 25 页 · 互动讲义</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* ---- 页面专属样式 ---- */
    .slider-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .slider-wrap input[type="range"] {
      width: 88%;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .slider-wrap input[type="range"]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .slider-label {
      font-size: var(--fs-label);
      color: var(--text-dim);
    }
    .slider-val {
      font-size: var(--fs-body);
      font-weight: 600;
      color: var(--accent);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    .step-head {
      font-weight: 600;
      font-size: var(--fs-body);
      margin-bottom: var(--sp-3);
    }
    .kv-label {
      font-size: var(--fs-label);
      color: var(--text-dim);
    }
    .kv-value {
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    .kv-unit {
      font-size: var(--fs-label);
      color: var(--text-sec);
      font-weight: 400;
    }
    #matter-cv {
      border-radius: var(--r-sm);
      background: var(--surface);
      margin-top: var(--sp-2);
    }
    .insight {
      font-size: var(--fs-sec);
      color: var(--text-sec);
      line-height: 1.45;
      margin-top: var(--sp-3);
      padding: 0 var(--sp-2);
    }
    .insight strong {
      color: var(--accent);
    }
  </style>
</head>
<body data-page="25" data-total="60">
<div id="stage">
<main id="main">

  <div class="row gap-8" style="height:100%;">

    <!-- ====== 左栏：k-process 流程 + 滑块 + 读数 + 小球 ====== -->
    <div class="col grow" style="flex:0 0 56%;">

      <div class="k-process" style="flex:1;">

        <!-- 进度轴 -->
        <div class="axis"></div>

        <!-- 三步骤 -->
        <div class="steps" style="flex:1;">

          <!-- ① 输入 -->
          <div class="step current">
            <div class="step-head">① 输入</div>

            <div class="slider-wrap" style="margin-bottom:var(--sp-3);">
              <div class="slider-label">体重</div>
              <div class="slider-val" id="mass-val">70 kg</div>
              <input type="range" id="mass-slider" min="50" max="120" value="70" step="1"
                     aria-label="体重滑块，单位千克">
            </div>

            <div class="slider-wrap">
              <div class="slider-label">腿部最大推力</div>
              <div class="slider-val" id="force-val">700 N</div>
              <input type="range" id="force-slider" min="200" max="3000" value="700" step="10"
                     aria-label="腿部推力滑块，单位牛顿">
            </div>
          </div>

          <div class="arw">→</div>

          <!-- ② 处理 -->
          <div class="step current">
            <div class="step-head">② 处理</div>

            <div class="kv-label">力量/体重比</div>
            <div class="kv-value" id="ratio-val">10.0</div>
            <div class="kv-unit">N/kg</div>

            <div style="height:var(--sp-4);"></div>

            <div class="kv-label">离地初速度</div>
            <div class="kv-value" id="v0-val">0.00</div>
            <div class="kv-unit">m/s</div>
          </div>

          <div class="arw">→</div>

          <!-- ③ 输出 -->
          <div class="step current">
            <div class="step-head">③ 输出</div>

            <div class="kv-label">跳跃高度</div>
            <div class="kv-value" id="height-val">0.00</div>
            <div class="kv-unit">m</div>

            <canvas id="matter-cv" width="200" height="120"></canvas>
          </div>

        </div><!-- /steps -->
      </div><!-- /k-process -->

      <!-- 两句关键洞察 -->
      <div class="insight">
        跳跃高度不取决于体重，也不取决于绝对力量——它取决于<strong>力量/体重比</strong>。大象力量巨大，但体重更大，所以跳不起来。
      </div>
      <div class="insight" style="margin-top:2px;">
        大体型动物跳跃难：力量增长赶不上体重增长，比值下降，离地初速度就掉下来了。
      </div>

    </div><!-- /左栏 -->

    <!-- ====== 右栏：echarts 散点图 ====== -->
    <div class="col grow panel" style="flex:0 0 44%; padding:var(--sp-3);">
      <div id="chart" style="width:100%;height:100%;"></div>
    </div>

  </div>

</main>
</div>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script src="assets/lib/matter.min.js"></script>

<script>
/* ================================================================
   Page 25 — 力量/体重比 → 跳跃高度
   ================================================================ */

// --- 底盘初始化 ---
Deck.init({ index: 25, total: 60 });

// --- 页眉 ---
Lec.mount({
  index: 25,
  kicker: '力量/体重比',
  title: '跳跃高度取决于什么？',
  take: '力量除以体重——这个比值，才是跳跃高度的真正推手'
});

// --- 常量 ---
var G = Lec.K.EARTH_GRAVITY;
var ACCEL_DIST = 0.6; // 加速距离 (m)

// --- DOM 引用 ---
var massSlider = document.getElementById('mass-slider');
var forceSlider = document.getElementById('force-slider');
var massValEl = document.getElementById('mass-val');
var forceValEl = document.getElementById('force-val');
var ratioValEl = document.getElementById('ratio-val');
var v0ValEl = document.getElementById('v0-val');
var heightValEl = document.getElementById('height-val');
var matterCv = document.getElementById('matter-cv');

// --- 计算管线 ---
function compute(mass, force) {
  var ratio = force / mass;
  var a = ratio - G;
  var v0, height;
  if (a <= 0) {
    v0 = 0;
    height = 0;
  } else {
    v0 = Math.sqrt(2 * a * ACCEL_DIST);
    height = Lec.P.jumpHeightFromVelocity(v0, G);
  }
  return { ratio: ratio, v0: v0, height: height };
}

// --- 更新 DOM 读数 ---
function updateDisplay(mass, force, r) {
  massValEl.textContent = mass + ' kg';
  forceValEl.textContent = force + ' N';
  ratioValEl.textContent = r.ratio.toFixed(1);
  v0ValEl.textContent = r.v0.toFixed(2);
  heightValEl.textContent = r.height.toFixed(2);
}

// --- Matter.js 跳跃小球 ---
var MatterLib = Matter;
var MatterEngine = MatterLib.Engine;
var MatterRender = MatterLib.Render;
var MatterBodies = MatterLib.Bodies;
var MatterComposite = MatterLib.Composite;
var MatterBody = MatterLib.Body;

var SCALE = 200; // px/m

var matterEngine = MatterEngine.create();
matterEngine.gravity.y = G * SCALE;

var matterRender = MatterRender.create({
  canvas: matterCv,
  engine: matterEngine,
  options: {
    width: 200,
    height: 120,
    wireframes: false,
    background: 'transparent'
  }
});

var ground = MatterBodies.rectangle(100, 118, 220, 8, {
  isStatic: true,
  render: { fillStyle: '#243040' }
});

// 地面 top = 114 (118-4), 球半径 8, 球心 y = 106 时刚好触地
var ball = MatterBodies.circle(100, 106, 8, {
  restitution: 0.25,
  render: { fillStyle: '#4da6ff' }
});

MatterComposite.add(matterEngine.world, [ground, ball]);

function launchBall(v0) {
  MatterComposite.remove(matterEngine.world, ball);
  ball = MatterBodies.circle(100, 106, 8, {
    restitution: 0.25,
    render: { fillStyle: '#4da6ff' }
  });
  MatterBody.setVelocity(ball, { x: 0, y: -v0 * SCALE });
  MatterComposite.add(matterEngine.world, ball);
}

// --- Matter.js 动画循环 ---
var matterLast = 0;
var matterRunning = true;

function stopMatter() {
  matterRunning = false;
}

Deck.loop(function(timestamp) {
  if (!matterRunning) return;
  if (Deck.reduced()) {
    // 只画一帧，停在起跳位置
    if (matterLast === 0) {
      MatterRender.world(matterRender);
      matterLast = -1;
    }
    return;
  }
  if (matterLast === 0) { matterLast = timestamp; return; }
  var delta = Math.min(timestamp - matterLast, 33);
  matterLast = timestamp;
  MatterEngine.update(matterEngine, delta);
  MatterRender.world(matterRender);
});

// --- ECharts 散点图 ---
var chartDom = document.getElementById('chart');
var chart = echarts.init(chartDom, null, { renderer: 'svg' });

// 猿人参照数据（Lec.getHominidData 不返回 legForce，使用规划指定值）
var hominidRefs = [
  { name: '南方古猿', mass: 35, force: 500 },
  { name: '能人',     mass: 45, force: 600 },
  { name: '直立人',   mass: 55, force: 750 },
  { name: '智人',     mass: 70, force: 900 }
];

var baseOption = {
  textStyle: { fontSize: 16 },
  grid: { left: 52, right: 24, top: 42, bottom: 48 },
  xAxis: {
    name: '体重 (kg)',
    nameLocation: 'center',
    nameGap: 30,
    nameTextStyle: { fontSize: 16, color: '#e6edf5' },
    min: 25,
    max: 130,
    axisLabel: { fontSize: 14, color: '#8899aa' },
    axisLine: { lineStyle: { color: '#243040' } },
    splitLine: { lineStyle: { color: '#1a2a3a' } }
  },
  yAxis: {
    name: '腿部推力 (N)',
    nameLocation: 'center',
    nameGap: 40,
    nameTextStyle: { fontSize: 16, color: '#e6edf5' },
    min: 0,
    max: 3200,
    axisLabel: { fontSize: 14, color: '#8899aa' },
    axisLine: { lineStyle: { color: '#243040' } },
    splitLine: { lineStyle: { color: '#1a2a3a' } }
  },
  series: [
    {
      // 猿人参照点
      type: 'scatter',
      name: '猿人参照',
      data: hominidRefs.map(function(d) { return [d.mass, d.force]; }),
      symbolSize: 12,
      itemStyle: { color: '#8899aa', opacity: 0.7 },
      label: {
        show: true,
        position: 'top',
        fontSize: 14,
        color: '#8899aa',
        formatter: function(p) {
          return hominidRefs[p.dataIndex].name;
        }
      },
      emphasis: { scale: 1.3 }
    },
    {
      // 当前组合
      type: 'scatter',
      name: '当前组合',
      data: [[70, 700]],
      symbolSize: 18,
      itemStyle: { color: '#4da6ff' },
      label: {
        show: true,
        position: 'right',
        fontSize: 14,
        color: '#4da6ff',
        fontWeight: 'bold',
        formatter: '你'
      },
      emphasis: { scale: 1.5 }
    },
    {
      // 等比值线
      type: 'line',
      name: '等比值线',
      data: [[0, 0], [130, 130 * 10]],
      lineStyle: { color: '#4da6ff', type: 'dashed', width: 1, opacity: 0.35 },
      symbol: 'none',
      silent: true
    }
  ]
};

chart.setOption(baseOption);

// --- 初始状态 ---
var curMass = 70;
var curForce = 700;
var curResult = compute(curMass, curForce);
updateDisplay(curMass, curForce, curResult);
setTimeout(function() { launchBall(curResult.v0); }, 400);

// --- 滑块联动 ---
function onSliderChange() {
  var m = parseInt(massSlider.value, 10);
  var f = parseInt(forceSlider.value, 10);
  curMass = m;
  curForce = f;
  curResult = compute(m, f);

  updateDisplay(m, f, curResult);
  launchBall(curResult.v0);

  // 更新散点图
  chart.setOption({
    series: [
      {}, // 保持猿人参照不变
      { data: [[m, f]] },
      { data: [[0, 0], [130, 130 * (f / m)]] }
    ]
  });
}

massSlider.addEventListener('input', onSliderChange);
forceSlider.addEventListener('input', onSliderChange);

// 窗口大小变化时 echarts 自适应
window.addEventListener('resize', function() { chart.resize(); });
</script>

</body>
</html>
