<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 27 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* 章收束页：主张居中，支撑从属于主干 */
  #main {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .k-generalization {
    max-width: 820px;
    width: 100%;
  }

  /* 收束桥接句：在支撑之后，略轻于主张但仍是正文 */
  .bridge {
    font-size: var(--fs-body);
    color: var(--text);
    font-weight: 500;
    line-height: 1.45;
    padding-left: calc(var(--sp-8) + var(--sp-4));
    margin-top: var(--sp-2);
    position: relative;
  }

  .bridge::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0.7em;
    width: var(--sp-8);
    height: 1px;
    background: var(--border);
  }

  /* 章号水印：极淡，不抢注意力 */
  .chapter-mark {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    font-size: 160px;
    font-weight: 900;
    color: var(--surface-raised);
    line-height: 1;
    pointer-events: none;
    user-select: none;
    letter-spacing: -0.04em;
    opacity: 0.6;
  }
</style>
</head>
<body data-page="27" data-total="60">
<div id="stage">
<main id="main">
  <div class="k-generalization">
    <div class="claim">地球是基线，重力是常数。</div>
    <div class="trunk"></div>
    <div class="supports">
      <div class="support" id="sup1">
        地表重力差异仅约 0.5%，跳跃高度差不到 1 cm——对本章所有讨论，<span class="g-val"></span> 是有效常数。
      </div>
      <div class="support" id="sup2">
        跳跃高度公式中，质量不出现，重力是唯一的环境参数。任何星球上的跳跃高度都可表达为地球跳跃高度的函数。
      </div>
      <div class="support" id="sup3">
        演化塑造的骨骼肌肉与地球重力匹配，但同一套身体在更低重力下会跳得更高——重力是常数，但不是命运。
      </div>
    </div>
    <div class="bridge">
      理解地球上的跳跃，就拿到了理解任何星球上跳跃的钥匙。
    </div>
  </div>
  <div class="chapter-mark">02</div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  'use strict';

  Deck.init({ index: 27, total: 60 });

  Lec.mount({
    index: 27,
    kicker: '第二章 小结',
    title: '地球是基线，重力是常数',
    take: '理解地球跳跃，就拿到了星际跳跃的钥匙'
  });

  // 注入动态数值：地球重力加速度
  const gVal = Lec.K.EARTH_GRAVITY;
  document.querySelector('.g-val').textContent = 'g = ' + gVal + ' m/s²';
</script>
</body>
</html>
