<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第 28 页 · 互动讲义</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <script src="assets/lib/echarts.min.js"></script>
  <style>
    /* === 页面结构 === */
    #main {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: var(--sp-4);
    }

    .chart-row {
      display: flex;
      flex-direction: row;
      flex: 3 1 0%;
      min-height: 0;
      gap: var(--sp-5);
    }

    .chart-container {
      flex: 1 1 0%;
      min-width: 0;
      min-height: 0;
    }

    .photo-area {
      flex-shrink: 0;
      width: 248px;
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }

    .photo-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: var(--r-md);
      border: 1px solid var(--border);
    }

    .photo-area .photo-cap {
      font-size: var(--fs-tick);
      color: var(--text-dim);
      text-align: center;
      line-height: 1.3;
    }

    /* === 时间轴区域 === */
    .timeline-area {
      flex: 2 1 0%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: var(--sp-3);
      padding: 0 var(--sp-2);
    }

    .readout-row {
      display: flex;
      align-items: baseline;
      gap: var(--sp-8);
      padding: 0 var(--sp-2);
    }

    .readout-item {
      display: flex;
      align-items: baseline;
      gap: var(--sp-2);
    }

    .readout-item .rlbl {
      font-size: var(--fs-label);
      color: var(--text-dim);
      white-space: nowrap;
    }

    .readout-item .rval {
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    .readout-item .rdelta {
      font-size: var(--fs-label);
      font-weight: 600;
      white-space: nowrap;
    }

    .rdelta.flat {
      color: var(--text-dim);
    }

    .rdelta.shrink {
      color: var(--warn);
    }

    /* === 滑块 === */
    .slider-wrap {
      display: flex;
      flex-direction: column;
      gap: var(--sp-1);
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: var(--fs-label);
      color: var(--text-dim);
      padding: 0 var(--sp-1);
    }

    .slider-track {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    input[type="range"].timeline-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      margin: 0;
    }

    input[type="range"].timeline-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid var(--bg);
      box-shadow: 0 0 8px rgba(77,166,255,0.45);
      transition: box-shadow 200ms var(--ease);
    }

    input[type="range"].timeline-slider::-webkit-slider-thumb:hover {
      box-shadow: 0 0 14px rgba(77,166,255,0.7);
    }

    input[type="range"].timeline-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid var(--bg);
      box-shadow: 0 0 8px rgba(77,166,255,0.45);
    }

    input[type="range"].timeline-slider:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 4px;
      border-radius: 3px;
    }

    /* === 三句要点 === */
    .key-notes {
      display: flex;
      flex-direction: row;
      gap: var(--sp-4);
      padding: 0 var(--sp-2);
    }

    .key-notes .kn {
      flex: 1 1 0%;
      min-width: 0;
      font-size: var(--fs-sec);
      color: var(--text-sec);
      line-height: 1.45;
      padding: var(--sp-3) var(--sp-4);
      background: var(--surface);
      border-radius: var(--r-sm);
      border-left: 2px solid var(--border-strong);
    }

    .key-notes .kn em {
      font-style: normal;
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body data-page="28" data-total="60">
  <div id="stage">
    <main id="main">
      <div class="chart-row">
        <div class="chart-container" id="chart"></div>
        <div class="photo-area">
          <img
            id="photo"
            src=""
            alt="跳高运动员背越式过杆"
            title="照片：2007 Military World Games high jump – The U.S. Army, Public domain, via Wikimedia Commons"
          >
          <div class="photo-cap">背越式过杆 · 2.45 m 横杆高度</div>
        </div>
      </div>
      <div class="timeline-area">
        <div class="readout-row" id="readout">
          <div class="readout-item">
            <span class="rlbl">年份</span>
            <span class="rval" id="ro-year">1993</span>
          </div>
          <div class="readout-item">
            <span class="rlbl">纪录</span>
            <span class="rval" id="ro-height">2.45 m</span>
          </div>
          <div class="readout-item">
            <span class="rlbl">增量</span>
            <span class="rdelta flat" id="ro-delta">0</span>
          </div>
        </div>
        <div class="slider-wrap">
          <div class="slider-track">
            <input type="range" class="timeline-slider" id="slider" min="0" max="0" value="0" step="1" aria-label="拖拽选择年份，查看跳高纪录变化">
          </div>
          <div class="slider-labels">
            <span>1950</span>
            <span id="slider-end-label"></span>
          </div>
        </div>
        <div class="key-notes">
          <div class="kn">男子跳高世界纪录自 <em>1993 年定格在 2.45 m</em> 后，三十年来无人打破。</div>
          <div class="kn">增量越来越小——不是因为运动员不努力，而是<em>骨骼肌肉的生理极限</em>就在那里。</div>
          <div class="kn">演化给身体一道看不见的<em>天花板</em>：在地球重力下，大约 <em>2.5 m</em>。</div>
        </div>
      </div>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    (function() {
      // ── 底盘 ──
      Deck.init({ index: 28, total: 60 });

      // ── 页眉 ──
      Lec.mount({
        index: 28,
        kicker: '第二章 · 地球跳跃实验室',
        title: '跳跃纪录的极限',
        take: '从1950年至今，跳高纪录增长缓慢，接近生理极限'
      });

      // ── 数据获取 ──
      function getRecordData() {
        if (Lec.P && typeof Lec.P.getHighJumpRecordData === 'function') {
          return Lec.P.getHighJumpRecordData();
        }
        // 回退：使用规划中参考数据
        return [
          { year: 1950, height: 2.11 },
          { year: 1955, height: 2.15 },
          { year: 1960, height: 2.22 },
          { year: 1965, height: 2.26 },
          { year: 1970, height: 2.29 },
          { year: 1975, height: 2.30 },
          { year: 1980, height: 2.36 },
          { year: 1985, height: 2.41 },
          { year: 1990, height: 2.44 },
          { year: 1993, height: 2.45 },
          { year: 2000, height: 2.45 },
          { year: 2010, height: 2.45 },
          { year: 2020, height: 2.45 },
          { year: new Date().getFullYear(), height: 2.45 }
        ];
      }

      function getTrendFn(data) {
        if (Lec.P && typeof Lec.P.fitTrendline === 'function') {
          return Lec.P.fitTrendline(data, 'logarithmic');
        }
        // 回退：手动计算对数拟合 y = a + b * ln(x - 1949)
        // 只使用 1993 年以前的增长点
        var growth = data.filter(function(d) { return d.year <= 1993; });
        var n = growth.length;
        var sumLn = 0, sumH = 0, sumLn2 = 0, sumLnH = 0;
        for (var i = 0; i < n; i++) {
          var ln = Math.log(growth[i].year - 1949);
          var h = growth[i].height;
          sumLn += ln;
          sumH += h;
          sumLn2 += ln * ln;
          sumLnH += ln * h;
        }
        var b = (n * sumLnH - sumLn * sumH) / (n * sumLn2 - sumLn * sumLn);
        var a = (sumH - b * sumLn) / n;
        return function(year) {
          return a + b * Math.log(Math.max(year - 1949, 1));
        };
      }

      function getPhysiologicalLimit() {
        if (Lec.P && typeof Lec.P.estimatedPhysiologicalLimit === 'function') {
          return Lec.P.estimatedPhysiologicalLimit('highJump');
        }
        return 2.50;
      }

      // ── 颜色（从 CSS 变量读取） ──
      var style = getComputedStyle(document.documentElement);
      var C_TEXT    = style.getPropertyValue('--text').trim() || '#e6edf5';
      var C_DIM     = style.getPropertyValue('--text-dim').trim() || '#8899aa';
      var C_ACCENT  = style.getPropertyValue('--accent').trim() || '#4da6ff';
      var C_WARN    = style.getPropertyValue('--warn').trim() || '#f59e0b';
      var C_BORDER  = style.getPropertyValue('--border').trim() || '#243040';
      var C_SURFACE = style.getPropertyValue('--surface').trim() || '#111a26';

      // ── 数据 ──
      var recordData = getRecordData();
      var trendFn = getTrendFn(recordData);
      var physLimit = getPhysiologicalLimit();

      var currentYear = new Date().getFullYear();
      var minYear = recordData[0].year;
      var maxYear = Math.max(recordData[recordData.length - 1].year, currentYear);

      // 生成趋势线数据
      var trendData = [];
      for (var y = minYear; y <= maxYear + 5; y += 2) {
        trendData.push([y, trendFn(y)]);
      }

      // ── 找到每一年对应的数据点索引 ──
      function findDataIndex(year) {
        var idx = 0;
        for (var i = 0; i < recordData.length; i++) {
          if (recordData[i].year <= year) {
            idx = i;
          } else {
            break;
          }
        }
        return idx;
      }

      function getPrevHeight(idx) {
        if (idx <= 0) return null;
        return recordData[idx - 1].height;
      }

      // ── echarts 图表 ──
      var chartDom = document.getElementById('chart');
      var chart = echarts.init(chartDom, null, { renderer: 'svg' });

      var option = {
        textStyle: { fontSize: 16, fontFamily: style.getPropertyValue('--font-sans').trim() },
        grid: {
          left: 52,
          right: 24,
          top: 24,
          bottom: 36
        },
        xAxis: {
          type: 'value',
          name: '年份',
          nameLocation: 'center',
          nameGap: 26,
          nameTextStyle: { fontSize: 14, color: C_DIM },
          min: minYear - 1,
          max: maxYear + 2,
          axisLabel: { fontSize: 14, color: C_DIM },
          axisLine: { lineStyle: { color: C_BORDER } },
          axisTick: { lineStyle: { color: C_BORDER } },
          splitLine: { show: false }
        },
        yAxis: {
          type: 'value',
          name: '高度 (m)',
          nameTextStyle: { fontSize: 14, color: C_DIM },
          min: 2.08,
          max: 2.55,
          interval: 0.05,
          axisLabel: { fontSize: 14, color: C_DIM, formatter: '{value}' },
          axisLine: { lineStyle: { color: C_BORDER } },
          axisTick: { lineStyle: { color: C_BORDER } },
          splitLine: { lineStyle: { color: C_BORDER, type: 'dashed', opacity: 0.4 } }
        },
        series: [
          {
            type: 'line',
            name: '世界纪录',
            data: recordData.map(function(d) { return [d.year, d.height]; }),
            lineStyle: { color: C_ACCENT, width: 2.5 },
            itemStyle: { color: C_ACCENT, borderColor: C_ACCENT, borderWidth: 0 },
            symbol: 'circle',
            symbolSize: 7,
            z: 2,
            markLine: {
              silent: true,
              symbol: 'none',
              lineStyle: { color: C_WARN, type: 'dashed', width: 1.5 },
              label: {
                show: false
              },
              data: [{ yAxis: physLimit, name: '生理极限' }]
            }
          },
          {
            type: 'line',
            name: '对数趋势',
            data: trendData,
            lineStyle: { color: C_DIM, width: 1.5, type: 'dashed' },
            itemStyle: { color: 'transparent' },
            symbol: 'none',
            z: 1,
            silent: true
          },
          {
            type: 'scatter',
            name: '当前选择',
            data: [[recordData[recordData.length - 1].year, recordData[recordData.length - 1].height]],
            symbolSize: 16,
            itemStyle: {
              color: C_ACCENT,
              borderColor: '#fff',
              borderWidth: 2.5,
              shadowBlur: 12,
              shadowColor: C_ACCENT
            },
            z: 10,
            label: {
              show: true,
              position: 'right',
              fontSize: 16,
              color: C_TEXT,
              fontWeight: 600,
              formatter: function(p) {
                return p.value[1].toFixed(2) + ' m';
              },
              distance: 14
            }
          }
        ]
      };

      chart.setOption(option);

      // ── 滑块与交互 ──
      var slider = document.getElementById('slider');
      var sliderEndLabel = document.getElementById('slider-end-label');
      var roYear = document.getElementById('ro-year');
      var roHeight = document.getElementById('ro-height');
      var roDelta = document.getElementById('ro-delta');

      // 滑块范围
      slider.min = 0;
      slider.max = recordData.length - 1;
      slider.value = recordData.length - 1;
      sliderEndLabel.textContent = maxYear;

      function updateDisplay(idx) {
        var d = recordData[idx];
        var prevH = getPrevHeight(idx);
        var delta = (prevH !== null) ? (d.height - prevH) : null;

        roYear.textContent = d.year;
        roHeight.textContent = d.height.toFixed(2) + ' m';

        if (delta === null) {
          roDelta.textContent = '—';
          roDelta.className = 'rdelta flat';
        } else if (delta === 0) {
          roDelta.textContent = '0';
          roDelta.className = 'rdelta flat';
        } else {
          var sign = delta >= 0 ? '+' : '';
          roDelta.textContent = sign + (delta * 100).toFixed(0) + ' cm';
          roDelta.className = 'rdelta shrink';
        }

        sliderEndLabel.textContent = maxYear;

        // 更新图表高亮
        chart.setOption({
          series: [
            {},
            {},
            {
              data: [[d.year, d.height]],
              label: {
                formatter: d.height.toFixed(2) + ' m'
              }
            }
          ]
        });
      }

      slider.addEventListener('input', function() {
        var idx = parseInt(slider.value, 10);
        updateDisplay(idx);
      });

      // 键盘支持
      slider.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
          // 原生 range 已处理，但确保更新
          setTimeout(function() {
            updateDisplay(parseInt(slider.value, 10));
          }, 0);
        }
      });

      // ── 初始显示：最新纪录 ──
      updateDisplay(recordData.length - 1);

      // ── 响应式：窗口大小变化时重绘图表 ──
      var resizeTimer;
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
          chart.resize();
        }, 150);
      });

      // ── 设置照片 ──
      var photo = document.getElementById('photo');
      photo.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/93/2007_Military_World_Games_high_jump.jpg/960px-2007_Military_World_Games_high_jump.jpg';
      photo.onerror = function() {
        // 回退：使用更小的缩略图
        photo.src = 'https://upload.wikimedia.org/wikipedia/commons/9/93/2007_Military_World_Games_high_jump.jpg';
      };
    })();
  </script>
</body>
</html>
