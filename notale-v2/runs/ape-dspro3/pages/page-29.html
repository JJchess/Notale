<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 29 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ---- 页面专属样式 ---- */

  /* 主容器：flex 列，垂直居中 */
  .p29-layout {
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
    gap: var(--sp-3);
  }

  /* ---- 视觉卡片行 ---- */
  .p29-cards {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 0;
    position: relative;
    border-radius: var(--r-md);
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface);
  }

  /* 单个卡片 */
  .p29-card {
    flex: 1 1 0%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  /* 卡片图标行 */
  .p29-card-icon {
    font-size: 26px;
    line-height: 1;
    padding: var(--sp-2) 0 var(--sp-1) 0;
    z-index: 2;
  }

  /* 卡片标签 */
  .p29-card-label {
    font-size: var(--fs-label);
    font-weight: 600;
    color: var(--text-sec);
    letter-spacing: 0.04em;
    padding-bottom: var(--sp-2);
    z-index: 2;
  }

  /* 卡片图像区 */
  .p29-card-img {
    width: 100%;
    height: 200px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  .p29-card-img.earth {
    background-image: url('assets/img/p29-earth-surface.png');
  }

  .p29-card-img.iss {
    background-image: url('assets/img/p29-iss-float.jpg');
  }

  /* 垂直虚线分隔 */
  .p29-divider {
    flex-shrink: 0;
    width: 0;
    border-left: 2px dashed var(--border-strong);
    z-index: 2;
  }

  /* ---- k-comparison 微调 ---- */
  .p29-table {
    /* 覆盖 k-comparison 默认字体大小，用 --fs-sec 保证表格文字 ≥16px */
    font-size: var(--fs-sec);
  }

  .p29-table .hdr {
    font-size: var(--fs-body);
    padding: var(--sp-1) var(--sp-4);
  }

  .p29-table .dim {
    font-size: var(--fs-sec);
    padding: var(--sp-1) var(--sp-4);
  }

  /* 表格内容单元格 */
  .p29-table > :not(.hdr):not(.dim):not(.diff):not(.rowline) {
    font-size: var(--fs-sec);
    padding: var(--sp-1) var(--sp-4);
  }

  .p29-table .diff {
    font-size: var(--fs-sec);
    padding: var(--sp-1) var(--sp-4);
  }

  /* ---- 关键语句 ---- */
  .p29-claim {
    font-size: var(--fs-lead);
    font-weight: 500;
    color: var(--text);
    line-height: 1.45;
    text-align: center;
    padding: 0 var(--sp-8);
  }
</style>
</head>
<body data-page="29" data-total="60">
<div id="stage">
<main id="main">

<div class="p29-layout">

  <!-- ======== 视觉卡片行 ======== -->
  <div class="p29-cards">

    <!-- 左：地球表面 -->
    <div class="p29-card">
      <div class="p29-card-icon">🌍</div>
      <div class="p29-card-label">地球表面</div>
      <div class="p29-card-img earth" role="img" aria-label="地球表面：人站立在地面上，重力箭头向下" title="AI 生成示意图像"></div>
    </div>

    <!-- 垂直虚线分隔 -->
    <div class="p29-divider"></div>

    <!-- 右：轨道微重力 -->
    <div class="p29-card">
      <div class="p29-card-icon">🛰️</div>
      <div class="p29-card-label">轨道微重力</div>
      <div class="p29-card-img iss" role="img" aria-label="ISS舱内：宇航员漂浮，无地面参照" title="照片：NASA / Catherine Coleman, ISS Expedition 26，公有领域"></div>
    </div>

  </div>

  <!-- ======== 维度对比表：k-comparison ======== -->
  <div class="k-comparison p29-table">
    <div></div>
    <div class="hdr">🌍 地球表面</div>
    <div class="hdr">🛰️ 轨道微重力</div>
    <div class="dim">重力加速度</div>
    <div><span id="earth-g-val"></span> m/s²，方向向下</div>
    <div class="diff">≈ 0（自由落体环境）</div>
    <div class="dim">身体状态</div>
    <div>骨骼肌肉持续对抗重力，每次站立都在做功</div>
    <div class="diff">重力感消失，身体自然漂浮</div>
  </div>

  <!-- ======== 关键句 ======== -->
  <p class="p29-claim">
    离开地球引力场，身体的每一块骨骼、每一束肌肉都进入了一个它们从未演化过的环境——重力还在，但感受不到了。
  </p>

</div>

</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  // 初始化底盘
  Deck.init({ index: 29, total: 60 });

  // 页首挂载
  Lec.mount({
    index: 29,
    kicker: '第三章',
    title: '脱离地球',
    take: '离开地球引力场，身体会怎样？'
  });

  // 注入重力加速度数值
  (function() {
    const el = document.getElementById('earth-g-val');
    if (el) {
      el.textContent = Lec.K.EARTH_GRAVITY;
    }
  })();
</script>
</body>
</html>
