<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 31 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ============================================================
     page-31 专属样式
     ============================================================ */

  #main { display: flex; flex-direction: column; gap: var(--sp-3); }

  /* ---- split-lr 两栏 ---- */
  .p31-split {
    display: flex; flex-direction: row; flex: 1 1 0%; min-width: 0; min-height: 0;
    gap: var(--sp-6);
  }
  .p31-left {
    flex: 0 0 38%; display: flex; flex-direction: row; gap: var(--sp-4);
    min-width: 0; min-height: 0;
  }
  .p31-right {
    flex: 1 1 0%; display: flex; flex-direction: column; gap: var(--sp-3);
    min-width: 0; min-height: 0;
  }
  .p31-divider {
    width: 1px; background: var(--border); flex-shrink: 0;
  }

  /* ---- 垂直滑块 ---- */
  .p31-slider-wrap {
    display: flex; flex-direction: column; align-items: center; gap: var(--sp-2);
    flex-shrink: 0; width: 48px;
  }
  .p31-slider-track {
    position: relative; width: 12px; flex: 1 1 0%; min-height: 120px;
    background: var(--border); border-radius: 6px; cursor: pointer;
    margin: 4px 0;
  }
  .p31-slider-fill {
    position: absolute; bottom: 0; left: 0; width: 100%;
    background: var(--accent); border-radius: 6px;
  }
  .p31-slider-thumb {
    position: absolute; left: 50%; transform: translate(-50%, 50%);
    width: 26px; height: 26px; background: var(--accent);
    border: 2px solid var(--text); border-radius: 50%;
    cursor: grab; z-index: 2; box-shadow: var(--shadow-md);
  }
  .p31-slider-thumb:active { cursor: grabbing; }
  .p31-slider-thumb:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 3px;
  }
  .p31-tick-label {
    position: absolute; right: calc(100% + 8px);
    font-size: var(--fs-label); color: var(--text-dim);
    white-space: nowrap; transform: translateY(50%);
    pointer-events: none;
  }
  .p31-slider-end {
    font-size: var(--fs-label); color: var(--text-dim); white-space: nowrap;
  }

  /* ---- 柱状图面板 ---- */
  .p31-bar-panel {
    flex: 1 1 0%; display: flex; flex-direction: column; gap: var(--sp-3);
    min-width: 0; min-height: 0;
  }
  .p31-bar-title {
    font-size: var(--fs-label); color: var(--text-sec); font-weight: 600;
    flex-shrink: 0;
  }
  .p31-bar-cv-wrap {
    position: relative; flex: 1 1 0%; min-height: 0;
  }
  .p31-bar-cv-wrap canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
  }
  .p31-gravity-readout {
    font-size: var(--fs-body); color: var(--text); font-weight: 600;
    flex-shrink: 0; text-align: center;
  }

  /* ---- echarts 面板 ---- */
  .p31-chart-title {
    font-size: var(--fs-label); color: var(--text-sec); font-weight: 600;
    flex-shrink: 0;
  }
  .p31-chart-wrap {
    flex: 1 1 0%; min-height: 0;
  }
  .p31-arrow-note {
    display: flex; align-items: center; gap: var(--sp-2);
    font-size: var(--fs-label); color: var(--diff-fg);
    flex-shrink: 0; padding: var(--sp-2) 0;
  }
  .p31-arrow-note::before {
    content: '→'; font-size: 20px; font-weight: 700;
    color: var(--diff-fg);
  }

  /* ---- k-process 步骤内的小标签 ---- */
  .k-process .step .step-label {
    font-size: var(--fs-body); font-weight: 600; line-height: 1.3;
  }
  .k-process .step .step-sub {
    font-size: var(--fs-label); color: var(--text-dim); line-height: 1.3;
  }

  /* ---- 收束主张 ---- */
  .p31-conclusions {
    display: flex; flex-direction: row; gap: var(--sp-3);
    padding: var(--sp-3) var(--sp-4);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-sm); flex-shrink: 0;
  }
  .p31-conclusions .p31-conc {
    flex: 1 1 0%; font-size: var(--fs-sec); color: var(--text-sec);
    line-height: 1.45; text-align: center; padding: 0 var(--sp-2);
  }
  .p31-conclusions .p31-conc strong { color: var(--accent); font-weight: 600; }
</style>
</head>
<body data-page="31" data-total="60">
<div id="stage">
<main id="main">

  <!-- ========== k-process: 6 step 因果链 ========== -->
  <div class="k-process">
    <div class="axis"></div>
    <div class="steps" id="ksteps">
      <div class="step current" data-step="1">
        <span class="step-label">1g 正常负荷</span>
        <span class="step-sub">骨骼负荷 100%</span>
      </div>
      <div class="arw">→</div>
      <div class="step" data-step="2">
        <span class="step-label">0.5g 负荷减半</span>
        <span class="step-sub">负荷约 50%</span>
      </div>
      <div class="arw">→</div>
      <div class="step" data-step="3">
        <span class="step-label">月球 0.16g</span>
        <span class="step-sub">负荷约 16%</span>
      </div>
      <div class="arw">→</div>
      <div class="step" data-step="4">
        <span class="step-label">微重力 &lt;1%</span>
        <span class="step-sub">负荷减少 &gt;90%</span>
      </div>
      <div class="arw">→</div>
      <div class="step" data-step="5">
        <span class="step-label">重建信号减弱</span>
        <span class="step-sub">破骨 &gt; 成骨</span>
      </div>
      <div class="arw">→</div>
      <div class="step" data-step="6">
        <span class="step-label">骨密度流失</span>
        <span class="step-sub">每月 1–2%</span>
      </div>
    </div>
  </div>

  <!-- ========== split-lr 主交互区 ========== -->
  <div class="p31-split">

    <!-- 左栏：滑块 + 柱状图 -->
    <div class="p31-left">
      <!-- 垂直滑块 -->
      <div class="p31-slider-wrap">
        <span class="p31-slider-end">1g</span>
        <div class="p31-slider-track no-pan" id="sliderTrack">
          <div class="p31-slider-fill" id="sliderFill"></div>
          <div class="p31-slider-thumb" id="sliderThumb"
               tabindex="0" role="slider"
               aria-label="重力加速度"
               aria-valuemin="0" aria-valuemax="1" aria-valuenow="1"></div>
          <span class="p31-tick-label" style="bottom:0%;">1g</span>
          <span class="p31-tick-label" style="bottom:50%;">0.5g</span>
          <span class="p31-tick-label" style="bottom:38%;">0.38g 火星</span>
          <span class="p31-tick-label" style="bottom:16%;">0.16g 月球</span>
          <span class="p31-tick-label" style="bottom:100%;">0g</span>
        </div>
        <span class="p31-slider-end">0g</span>
      </div>

      <div class="p31-divider"></div>

      <!-- 柱状图 -->
      <div class="p31-bar-panel">
        <div class="p31-bar-title">骨骼轴向负荷</div>
        <div class="p31-bar-cv-wrap" id="barCvWrap"></div>
        <div class="p31-gravity-readout" id="gravityReadout">当前重力：1.00g（9.80 m/s²）</div>
      </div>
    </div>

    <div class="p31-divider"></div>

    <!-- 右栏：echarts 曲线 -->
    <div class="p31-right">
      <div class="p31-chart-title">骨密度随时间变化</div>
      <div class="p31-chart-wrap min0" id="chartWrap"></div>
      <div class="p31-arrow-note">负荷减少导致骨密度下降</div>
    </div>

  </div>

  <!-- ========== 收束主张 ========== -->
  <div class="p31-conclusions">
    <div class="p31-conc"><strong>①</strong> 微重力卸掉骨骼九成负荷，骨重建信号几乎关闭。</div>
    <div class="p31-conc"><strong>②</strong> 骨密度以每月 1–2% 流失——这是负荷撤除的直接后果。</div>
    <div class="p31-conc"><strong>③</strong> 骨骼不是惰性支架，它需要重力来维持自己。</div>
  </div>

</main>
</div>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
/* ============================================================
   page-31 · 骨骼负荷消减
   ============================================================ */

Deck.init({ index: 31, total: 60 });

/* ---- 颜色 ---- */
const cs = getComputedStyle(document.documentElement);
const clr = (name) => cs.getPropertyValue(name).trim();

/* ---- Lec.mount ---- */
Lec.mount({
  index: 31,
  kicker: '第3章 · 脱离地球',
  title: '骨骼负荷消减',
  take: '微重力卸掉骨骼九成负荷，骨重建信号几乎关闭。'
});

/* ---- 常量 ---- */
const EARTH_G = Lec.K.EARTH_GRAVITY;        // 9.8
const MOON_G  = Lec.K.MOON_GRAVITY;         // 1.62
const MARS_G  = Lec.K.MARS_GRAVITY;         // 3.7

/* ---- 状态 ---- */
let gravityFraction = 1;  // 0..1, 1 = Earth
let boneLoad = 1;          // 0..1, 1 = 100%

/* ---- DOM refs ---- */
const sliderTrack = document.getElementById('sliderTrack');
const sliderFill  = document.getElementById('sliderFill');
const sliderThumb = document.getElementById('sliderThumb');
const gravityReadout = document.getElementById('gravityReadout');
const barCvWrap = document.getElementById('barCvWrap');
const chartWrap  = document.getElementById('chartWrap');
const ksteps = document.getElementById('ksteps');

/* ============================================================
   Matter.js 柱状图
   ============================================================ */

const { Engine, Bodies, Body, Composite } = Matter;

const barCv = document.createElement('canvas');
barCv.width  = 440;
barCv.height = 400;
barCvWrap.appendChild(barCv);
const barCtx = Deck.fit(barCv);

const matterEngine = Engine.create({ gravity: { x: 0, y: 0.3 } });

const GROUND_Y = 370;
const BAR_MAX_H = 300;
const BAR_W = 100;
const BAR_GAP = 140;
const BAR_CX_FEMUR = 140;
const BAR_CX_VERT  = 300;

// 创建两个动态柱体 + 地面
const ground = Bodies.rectangle(220, GROUND_Y + 20, 500, 40, {
  isStatic: true,
  render: { fillStyle: clr('--border') }
});

const barFemur = Bodies.rectangle(BAR_CX_FEMUR, GROUND_Y - BAR_MAX_H / 2, BAR_W, BAR_MAX_H, {
  restitution: 0.15,
  friction: 0.8,
  render: { fillStyle: clr('--accent') }
});

const barVert = Bodies.rectangle(BAR_CX_VERT, GROUND_Y - BAR_MAX_H / 2, BAR_W, BAR_MAX_H, {
  restitution: 0.15,
  friction: 0.8,
  render: { fillStyle: clr('--accent-soft') }
});

Composite.add(matterEngine.world, [ground, barFemur, barVert]);

function setBarHeights(load) {
  const targetH = load * BAR_MAX_H;
  const targetY = GROUND_Y - targetH / 2;

  // 更新股骨柱
  const curH1 = barFemur.bounds.max.y - barFemur.bounds.min.y;
  if (curH1 > 2) {
    Body.scale(barFemur, 1, targetH / curH1);
  }
  Body.setPosition(barFemur, { x: BAR_CX_FEMUR, y: targetY });
  Body.setVelocity(barFemur, { x: 0, y: 0 });

  // 更新椎骨柱
  const curH2 = barVert.bounds.max.y - barVert.bounds.min.y;
  if (curH2 > 2) {
    Body.scale(barVert, 1, targetH / curH2);
  }
  Body.setPosition(barVert, { x: BAR_CX_VERT, y: targetY });
  Body.setVelocity(barVert, { x: 0, y: 0 });
}

/* ---- 绘制柱状图 ---- */
function drawBarChart() {
  const W = barCv.width;
  const H = barCv.height;

  barCtx.clearRect(0, 0, W, H);

  // 背景
  barCtx.fillStyle = clr('--bg');
  barCtx.fillRect(0, 0, W, H);

  // 地面线
  barCtx.strokeStyle = clr('--border');
  barCtx.lineWidth = 2;
  barCtx.beginPath();
  barCtx.moveTo(20, GROUND_Y);
  barCtx.lineTo(W - 20, GROUND_Y);
  barCtx.stroke();

  // 绘制股骨柱
  const fBounds = barFemur.bounds;
  const fX = fBounds.min.x;
  const fY = fBounds.min.y;
  const fW = fBounds.max.x - fBounds.min.x;
  const fH = fBounds.max.y - fBounds.min.y;
  barCtx.fillStyle = clr('--accent');
  barCtx.fillRect(fX, fY, fW, fH);
  barCtx.strokeStyle = clr('--accent');
  barCtx.lineWidth = 1;
  barCtx.strokeRect(fX, fY, fW, fH);

  // 绘制椎骨柱
  const vBounds = barVert.bounds;
  const vX = vBounds.min.x;
  const vY = vBounds.min.y;
  const vW = vBounds.max.x - vBounds.min.x;
  const vH = vBounds.max.y - vBounds.min.y;
  barCtx.fillStyle = clr('--accent-soft');
  barCtx.fillRect(vX, vY, vW, vH);
  barCtx.strokeStyle = clr('--accent-soft');
  barCtx.lineWidth = 1;
  barCtx.strokeRect(vX, vY, vW, vH);

  // 标签
  barCtx.fillStyle = clr('--text');
  barCtx.font = '600 14px ' + cs.getPropertyValue('--font-sans');
  barCtx.textAlign = 'center';
  barCtx.fillText('股骨', BAR_CX_FEMUR, GROUND_Y + 22);
  barCtx.fillText('椎骨', BAR_CX_VERT, GROUND_Y + 22);

  // 负荷百分比
  barCtx.fillStyle = clr('--text');
  barCtx.font = '600 14px ' + cs.getPropertyValue('--font-sans');
  const loadPct = Math.round(boneLoad * 100);
  barCtx.fillText(loadPct + '%', BAR_CX_FEMUR, fY - 8);
  barCtx.fillText(loadPct + '%', BAR_CX_VERT, vY - 8);
}

/* ============================================================
   ECharts 骨密度曲线
   ============================================================ */

const chartDom = document.createElement('div');
chartDom.style.width = '100%';
chartDom.style.height = '100%';
chartWrap.appendChild(chartDom);
const chart = echarts.init(chartDom, null, { renderer: 'svg' });

const accentColor = clr('--accent');
const textDimColor = clr('--text-dim');
const textColor = clr('--text');
const okColor = clr('--ok');

function makeChartOption(rate) {
  const data = [];
  for (let m = 0; m <= 6; m++) {
    data.push([m, +(100 - rate * m).toFixed(1)]);
  }
  return {
    textStyle: { fontSize: 16 },
    grid: { left: 52, right: 28, top: 28, bottom: 40 },
    xAxis: {
      type: 'value',
      name: '时间（月）',
      nameTextStyle: { fontSize: 16, color: textDimColor },
      nameLocation: 'middle',
      nameGap: 28,
      min: 0, max: 6, interval: 1,
      axisLabel: { fontSize: 14, color: textDimColor },
      axisLine: { lineStyle: { color: clr('--border') } },
      splitLine: { lineStyle: { color: clr('--border'), type: 'dashed' } }
    },
    yAxis: {
      type: 'value',
      name: '骨密度（%）',
      nameTextStyle: { fontSize: 16, color: textDimColor },
      nameLocation: 'middle',
      nameGap: 38,
      min: 84, max: 104, interval: 4,
      axisLabel: { fontSize: 14, color: textDimColor },
      axisLine: { lineStyle: { color: clr('--border') } },
      splitLine: { lineStyle: { color: clr('--border'), type: 'dashed' } }
    },
    series: [
      {
        type: 'line',
        data: data,
        smooth: false,
        lineStyle: { color: accentColor, width: 3 },
        itemStyle: { color: accentColor },
        symbol: 'circle',
        symbolSize: 6,
        z: 2,
        animation: !Deck.reduced(),
        animationDuration: 300
      },
      {
        type: 'line',
        data: [[0, 100], [6, 100]],
        lineStyle: { color: okColor, width: 1.5, type: 'dashed' },
        symbol: 'none',
        z: 1,
        animation: false
      }
    ]
  };
}

let currentRate = 0;
chart.setOption(makeChartOption(0));

function updateChart(rate) {
  if (Math.abs(rate - currentRate) < 0.005) return;
  currentRate = rate;
  chart.setOption(makeChartOption(rate));
}

/* ============================================================
   垂直滑块
   ============================================================ */

function updateSliderUI() {
  const pct = (1 - gravityFraction) * 100;
  sliderFill.style.height = pct + '%';
  sliderThumb.style.bottom = pct + '%';
  sliderThumb.setAttribute('aria-valuenow', gravityFraction.toFixed(2));
}

function setGravity(frac) {
  gravityFraction = Math.max(0, Math.min(1, frac));
  boneLoad = gravityFraction; // 线性关系
  updateSliderUI();
  updateReadout();
  updateKSteps();
  setBarHeights(boneLoad);

  // 获取骨密度流失速率
  const gVal = gravityFraction * EARTH_G;
  let rate;
  try {
    rate = Lec.P.getBoneDensityLossRate(gVal);
  } catch (e) {
    // 线性插值：微重力下 1.5%/月，1g 下 0%/月
    rate = (1 - gravityFraction) * 1.5;
  }
  updateChart(rate);
}

function updateReadout() {
  const gVal = gravityFraction * EARTH_G;
  gravityReadout.textContent =
    '当前重力：' + gravityFraction.toFixed(2) + 'g（' + gVal.toFixed(2) + ' m/s²）';
}

function updateKSteps() {
  const steps = ksteps.querySelectorAll('.step');
  steps.forEach(s => { s.classList.remove('current', 'done'); });

  if (gravityFraction > 0.7) {
    // Step 1 current
    steps[0].classList.add('current');
    steps[5].classList.add('done'); // step 6 always 'done' in the sense it's the outcome
  } else if (gravityFraction > 0.3) {
    steps[0].classList.add('done');
    steps[1].classList.add('current');
  } else if (gravityFraction > 0.05) {
    steps[0].classList.add('done');
    steps[1].classList.add('done');
    steps[2].classList.add('current');
    steps[4].classList.add('done');
    steps[5].classList.add('done');
  } else {
    steps[0].classList.add('done');
    steps[1].classList.add('done');
    steps[2].classList.add('done');
    steps[3].classList.add('current');
    steps[4].classList.add('done');
    steps[5].classList.add('done');
  }
}

/* ---- 指针事件：拖拽滑块 ---- */

let dragging = false;

function thumbFromEvent(e) {
  const rect = sliderTrack.getBoundingClientRect();
  const pt = Deck.pt(sliderTrack, e);
  const y = pt.y - rect.top;
  const frac = 1 - Math.max(0, Math.min(1, y / rect.height));
  return frac;
}

sliderThumb.addEventListener('pointerdown', function(e) {
  dragging = true;
  sliderThumb.setPointerCapture(e.pointerId);
  e.preventDefault();
});

sliderThumb.addEventListener('pointermove', function(e) {
  if (!dragging) return;
  const frac = thumbFromEvent(e);
  setGravity(frac);
});

sliderThumb.addEventListener('pointerup', function(e) {
  dragging = false;
  sliderThumb.releasePointerCapture(e.pointerId);
});

sliderThumb.addEventListener('pointercancel', function() {
  dragging = false;
});

// 点击轨道直接跳转
sliderTrack.addEventListener('pointerdown', function(e) {
  if (e.target === sliderThumb) return;
  const frac = thumbFromEvent(e);
  setGravity(frac);
  // 同时开始拖拽
  dragging = true;
  sliderThumb.setPointerCapture(e.pointerId);
  e.preventDefault();
});

// 键盘操作
sliderThumb.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
    setGravity(gravityFraction + 0.05);
    e.preventDefault();
  } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
    setGravity(gravityFraction - 0.05);
    e.preventDefault();
  } else if (e.key === 'Home') {
    setGravity(1);
    e.preventDefault();
  } else if (e.key === 'End') {
    setGravity(0);
    e.preventDefault();
  }
});

/* ============================================================
   动画循环
   ============================================================ */

Deck.loop(function() {
  Engine.update(matterEngine, 1000 / 60);
  drawBarChart();
});

/* ============================================================
   初始化
   ============================================================ */

setGravity(1);
updateSliderUI();

// 响应窗口大小变化
window.addEventListener('resize', function() {
  chart.resize();
});

/* ============================================================
   reduced-motion 处理
   ============================================================ */
if (Deck.reduced()) {
  matterEngine.gravity.y = 0; // 静止
}
</script>

</body>
</html>
