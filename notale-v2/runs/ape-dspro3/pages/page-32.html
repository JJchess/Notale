<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第 32 页 · 互动讲义</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* ---- 页面专属布局 ---- */
    #main {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 100%;
      gap: var(--sp-8);
      align-items: stretch;
    }

    .left-panel {
      flex: 0 0 60%;
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      min-width: 0;
    }

    .right-panel {
      flex: 1 1 0%;
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
      min-width: 0;
      position: relative;
    }

    /* echarts 容器 */
    #chart-container {
      flex: 1 1 0%;
      min-height: 280px;
      width: 100%;
    }

    /* 关键句 */
    .key-sentence {
      font-size: var(--fs-sec);
      color: var(--text-sec);
      line-height: 1.45;
      padding: var(--sp-3) var(--sp-4);
      background: var(--surface);
      border-left: 3px solid var(--accent-soft);
      border-radius: var(--r-sm);
      margin: 0;
    }

    .key-sentence strong {
      color: var(--text);
      font-weight: 600;
    }

    /* 控件行 */
    .ctl-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: var(--sp-4);
      flex-wrap: wrap;
    }

    .ctl-row label {
      font-size: var(--fs-label);
      color: var(--text-sec);
      white-space: nowrap;
    }

    .ctl-row input[type="range"] {
      flex: 1 1 0%;
      min-width: 120px;
      accent-color: var(--accent);
      height: 4px;
    }

    .btn-training {
      font-family: inherit;
      font-size: var(--fs-label);
      padding: 5px 16px;
      border-radius: var(--r-sm);
      border: 1px solid var(--accent-soft);
      background: var(--surface-raised);
      color: var(--accent);
      cursor: pointer;
      transition: all var(--dur) var(--ease);
      white-space: nowrap;
      outline: none;
    }

    .btn-training:hover {
      background: var(--accent-soft);
      color: #fff;
    }

    .btn-training:focus-visible {
      box-shadow: 0 0 0 2px rgba(96,165,250,0.25);
      border-color: var(--focus);
    }

    .btn-training.active {
      background: var(--ok);
      border-color: var(--ok);
      color: #000;
      font-weight: 600;
    }

    /* 右侧 matter.js 容器 */
    #muscle-stage {
      flex: 1 1 0%;
      min-height: 0;
      position: relative;
      border-radius: var(--r-md);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    #muscle-stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .muscle-bg {
      position: absolute;
      inset: 0;
      background-image: url('assets/img/p32-astronaut-exercise.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.12;
      pointer-events: none;
      border-radius: var(--r-md);
    }

    .muscle-label {
      position: absolute;
      bottom: var(--sp-2);
      right: var(--sp-3);
      font-size: var(--fs-tick);
      color: var(--text-dim);
      opacity: 0.6;
      pointer-events: none;
    }

    /* 肌肉量读数 */
    .muscle-readout {
      position: absolute;
      top: var(--sp-3);
      left: 50%;
      transform: translateX(-50%);
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
      pointer-events: none;
      background: rgba(11,17,25,0.7);
      padding: 2px 12px;
      border-radius: var(--r-sm);
      white-space: nowrap;
    }

    .muscle-readout span {
      font-size: var(--fs-label);
      font-weight: 400;
      color: var(--text-dim);
    }

    /* 右侧底部提示 */
    .right-note {
      font-size: var(--fs-label);
      color: var(--text-dim);
      text-align: center;
      font-style: italic;
      padding: 0 var(--sp-2);
    }
  </style>
</head>
<body data-page="32" data-total="60">
  <div id="stage">
    <main id="main">
      <!-- 左侧面板 -->
      <div class="left-panel">
        <!-- echarts 折线图 -->
        <div id="chart-container"></div>

        <!-- 关键句 -->
        <p class="key-sentence"><strong>不锻炼时，肌肉每周萎缩约 5%</strong>——在微重力下，骨骼肌流失速度远超地球卧床实验。</p>
        <p class="key-sentence"><strong>抗阻训练可以逆转这一过程</strong>——每周 3–4 次训练即可在 4 周内恢复基线肌肉量。</p>

        <!-- 控件行 -->
        <div class="ctl-row">
          <label for="week-slider">时间（周）</label>
          <input type="range" id="week-slider" min="0" max="12" value="0" step="0.5">
          <span id="week-val" style="font-size:var(--fs-label);color:var(--text);min-width:3em;text-align:center;">0</span>
          <button class="btn-training" id="btn-training" disabled>开始抗阻训练</button>
        </div>
      </div>

      <!-- 右侧面板 -->
      <div class="right-panel">
        <div id="muscle-stage">
          <div class="muscle-bg" title="NASA ISS RED resistance training — Public Domain"></div>
          <div class="muscle-readout" id="muscle-readout">100<span>% 肌肉量</span></div>
          <div class="muscle-label">参考: NASA ISS 抗阻训练</div>
        </div>
        <p class="right-note">拖拽左侧滑块，观察肌肉纤维截面的变化</p>
      </div>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/lib/matter.min.js"></script>
  <script>
  (function() {
    /* ================================================================
       Page 32 – 肌肉萎缩速度
       split-lr: 左侧 echarts + 时间线 + 控件, 右侧 matter.js 肌肉束
    ================================================================ */

    Deck.init({ index: 32, total: 60 });

    Lec.mount({
      index: 32,
      kicker: '第三章 · 脱离地球',
      title: '肌肉萎缩速度',
      take: '不锻炼，肌肉每周萎缩5%，但抗阻训练可逆转'
    });

    /* ---- 参数 ---- */
    var ATROPHY_RATE = 0.05;   // 每周萎缩 5%
    var RECOVERY_RATE = 0.04;  // 训练每周恢复 4%
    var MAX_WEEK = 12;
    var TRAINING_START_WEEK = 2;

    /* ---- 计算肌肉量 ---- */
    function muscleMassAtWeek(week, withTraining) {
      if (withTraining && week >= TRAINING_START_WEEK) {
        var base = Math.pow(1 - ATROPHY_RATE, TRAINING_START_WEEK);
        var recovered = base * Math.pow(1 + RECOVERY_RATE, week - TRAINING_START_WEEK);
        return Math.min(recovered, 1.0);
      }
      return Math.pow(1 - ATROPHY_RATE, week);
    }

    /* ---- 生成曲线数据 ---- */
    function generateAtrophyData() {
      var pts = [];
      for (var w = 0; w <= MAX_WEEK; w += 0.5) {
        pts.push([w, +(muscleMassAtWeek(w, false) * 100).toFixed(1)]);
      }
      return pts;
    }

    function generateTrainingData() {
      var pts = [];
      for (var w = 0; w <= MAX_WEEK; w += 0.5) {
        pts.push([w, +(muscleMassAtWeek(w, true) * 100).toFixed(1)]);
      }
      return pts;
    }

    /* ---- 状态 ---- */
    var currentWeek = 0;
    var trainingActive = false;

    /* ================================================================
       ECharts
    ================================================================ */
    var chartDom = document.getElementById('chart-container');
    var chart = echarts.init(chartDom, null, { renderer: 'svg' });

    var atrophyData = generateAtrophyData();
    var trainingData = generateTrainingData();

    var option = {
      textStyle: { fontSize: 16 },
      grid: { left: 52, right: 24, top: 16, bottom: 40 },
      tooltip: {
        trigger: 'axis',
        textStyle: { fontSize: 14 },
        formatter: function(params) {
          var s = '第 ' + params[0].axisValue + ' 周<br/>';
          params.forEach(function(p) {
            s += p.marker + ' ' + p.seriesName + ': ' + p.value[1] + '%<br/>';
          });
          return s;
        }
      },
      xAxis: {
        type: 'value',
        name: '时间（周）',
        nameTextStyle: { fontSize: 14, color: '#8899aa' },
        nameLocation: 'middle',
        nameGap: 28,
        min: 0,
        max: MAX_WEEK,
        interval: 2,
        axisLabel: { fontSize: 14, color: '#8899aa' },
        axisLine: { lineStyle: { color: '#334455' } },
        axisTick: { show: false },
        splitLine: { show: false }
      },
      yAxis: {
        type: 'value',
        name: '肌肉量（%）',
        nameTextStyle: { fontSize: 14, color: '#8899aa' },
        min: 40,
        max: 105,
        interval: 20,
        axisLabel: { fontSize: 14, color: '#8899aa' },
        axisLine: { show: false },
        axisTick: { show: false },
        splitLine: { lineStyle: { color: '#243040' } }
      },
      series: [
        {
          name: '不锻炼',
          type: 'line',
          data: atrophyData,
          smooth: true,
          symbol: 'none',
          lineStyle: { color: '#f87171', width: 2.5 },
          itemStyle: { color: '#f87171' },
          z: 2
        },
        {
          name: '抗阻训练',
          type: 'line',
          data: trainingData,
          smooth: true,
          symbol: 'none',
          lineStyle: { color: '#34d399', width: 2.5, type: 'dashed' },
          itemStyle: { color: '#34d399' },
          z: 2
        }
      ]
    };

    chart.setOption(option);

    /* ---- 更新 markLine ---- */
    function updateMarkLine() {
      var wk = currentWeek;
      var atrophyVal = +(muscleMassAtWeek(wk, false) * 100).toFixed(1);
      var trainingVal = trainingActive ? +(muscleMassAtWeek(wk, true) * 100).toFixed(1) : null;

      var markLine = {
        silent: true,
        symbol: 'none',
        lineStyle: { color: '#60a5fa', width: 1.5, type: 'dashed' },
        label: {
          show: true,
          position: 'start',
          fontSize: 13,
          color: '#60a5fa',
          formatter: wk + '周'
        },
        data: [{ xAxis: wk }]
      };

      var markPointAtrophy = {
        data: [{
          name: '不锻炼',
          coord: [wk, atrophyVal],
          value: atrophyVal + '%',
          symbol: 'circle',
          symbolSize: 10,
          itemStyle: { color: '#f87171', borderColor: '#0b1119', borderWidth: 2 },
          label: { show: true, fontSize: 13, color: '#f87171', position: 'top', distance: 6 }
        }],
        symbol: 'circle',
        symbolSize: 10
      };

      var markPointTraining = trainingActive ? {
        data: [{
          name: '抗阻训练',
          coord: [wk, trainingVal],
          value: trainingVal + '%',
          symbol: 'circle',
          symbolSize: 10,
          itemStyle: { color: '#34d399', borderColor: '#0b1119', borderWidth: 2 },
          label: { show: true, fontSize: 13, color: '#34d399', position: 'bottom', distance: 6 }
        }],
        symbol: 'circle',
        symbolSize: 10
      } : { data: [] };

      chart.setOption({
        series: [
          { markLine: markLine, markPoint: markPointAtrophy },
          { markPoint: markPointTraining }
        ]
      });
    }

    /* ================================================================
       Matter.js 肌肉束模拟
    ================================================================ */
    var muscleStage = document.getElementById('muscle-stage');
    var muscleCanvas = document.createElement('canvas');
    muscleStage.appendChild(muscleCanvas);

    var ctx = Deck.fit(muscleCanvas);

    var Engine = Matter.Engine,
        Render = Matter.Render,
        Runner = Matter.Runner,
        Bodies = Matter.Bodies,
        Composite = Matter.Composite,
        Constraint = Matter.Constraint,
        Body = Matter.Body,
        Events = Matter.Events;

    var engine = Engine.create({ gravity: { x: 0, y: 0 } });

    var render = Render.create({
      canvas: muscleCanvas,
      engine: engine,
      options: {
        width: ctx.canvas.width,
        height: ctx.canvas.height,
        wireframes: false,
        background: 'transparent',
        pixelRatio: 1
      }
    });

    var runner = Runner.create();
    Runner.run(runner, engine);
    Render.run(render);

    /* ---- 创建肌肉纤维 ---- */
    var FIBER_COUNT = 28;
    var fibers = [];
    var fiberBaseRadius = 0;
    var centerX = 0;
    var centerY = 0;
    var currentScale = 1.0;

    function createMuscleBundle() {
      var w = ctx.canvas.width;
      var h = ctx.canvas.height;
      centerX = w / 2;
      centerY = h / 2;
      var bundleRadius = Math.min(w, h) * 0.35;
      fiberBaseRadius = bundleRadius * 0.11;

      // 肌肉鞘边界（静态圆环）
      var sheathSegments = 32;
      var sheathThickness = 4;
      var sheathR = bundleRadius + fiberBaseRadius * 2.5;
      var sheaths = [];
      for (var i = 0; i < sheathSegments; i++) {
        var angle = (i / sheathSegments) * Math.PI * 2;
        var sx = centerX + sheathR * Math.cos(angle);
        var sy = centerY + sheathR * Math.sin(angle);
        var seg = Bodies.rectangle(sx, sy, sheathThickness, (2 * Math.PI * sheathR) / sheathSegments + 4, {
          isStatic: true,
          angle: angle + Math.PI / 2,
          render: { fillStyle: '#334455' }
        });
        sheaths.push(seg);
      }
      Composite.add(engine.world, sheaths);

      // 肌肉纤维
      fibers = [];
      for (var j = 0; j < FIBER_COUNT; j++) {
        var a = (j / FIBER_COUNT) * Math.PI * 2;
        var r = bundleRadius * (0.35 + 0.65 * Math.random());
        var fx = centerX + r * Math.cos(a);
        var fy = centerY + r * Math.sin(a);
        var fiber = Bodies.circle(fx, fy, fiberBaseRadius, {
          restitution: 0.3,
          friction: 0.5,
          frictionAir: 0.04,
          render: { fillStyle: '#d4726a' }
        });
        fibers.push(fiber);
      }
      Composite.add(engine.world, fibers);

      // 中心约束点
      var centerBody = Bodies.circle(centerX, centerY, 3, {
        isStatic: true,
        render: { visible: false }
      });
      Composite.add(engine.world, centerBody);

      // 纤维之间、纤维到中心的约束
      for (var k = 0; k < fibers.length; k++) {
        var c1 = Constraint.create({
          bodyA: fibers[k],
          bodyB: centerBody,
          stiffness: 0.005,
          damping: 0.1,
          render: { visible: false }
        });
        Composite.add(engine.world, c1);

        var next = (k + 1) % fibers.length;
        var c2 = Constraint.create({
          bodyA: fibers[k],
          bodyB: fibers[next],
          stiffness: 0.003,
          damping: 0.08,
          render: { visible: false }
        });
        Composite.add(engine.world, c2);
      }

      // 给纤维一点初始扰动
      fibers.forEach(function(f) {
        Body.setVelocity(f, {
          x: (Math.random() - 0.5) * 0.3,
          y: (Math.random() - 0.5) * 0.3
        });
      });
    }

    createMuscleBundle();

    /* ---- 缩放肌肉纤维 ---- */
    function scaleMuscleFibers(targetScale) {
      if (Math.abs(targetScale - currentScale) < 0.001) return;
      var ratio = targetScale / currentScale;
      fibers.forEach(function(f) {
        Body.scale(f, ratio, ratio);
      });
      currentScale = targetScale;
    }

    /* ---- 更新纤维颜色 ---- */
    function updateFiberColors(massPct) {
      // 肌肉量越低，颜色越淡/偏灰
      var t = Lec.P.clamp(massPct / 100, 0.4, 1.0);
      var r = Math.round(212 * t + 100 * (1 - t));
      var g = Math.round(114 * t + 120 * (1 - t));
      var b = Math.round(106 * t + 130 * (1 - t));
      var color = 'rgb(' + r + ',' + g + ',' + b + ')';
      fibers.forEach(function(f) {
        f.render.fillStyle = color;
      });
    }

    /* ================================================================
       交互处理
    ================================================================ */
    var weekSlider = document.getElementById('week-slider');
    var weekVal = document.getElementById('week-val');
    var btnTraining = document.getElementById('btn-training');
    var muscleReadout = document.getElementById('muscle-readout');

    function updateAll() {
      var wk = currentWeek;
      var massPct = +(muscleMassAtWeek(wk, trainingActive) * 100).toFixed(1);

      // Slider
      weekSlider.value = wk;
      weekVal.textContent = wk;

      // Chart
      updateMarkLine();

      // Timeline
      updateTimelineNodes();

      // Training button
      if (wk >= TRAINING_START_WEEK) {
        btnTraining.disabled = false;
        if (trainingActive) {
          btnTraining.classList.add('active');
          btnTraining.textContent = '抗阻训练中 ✓';
        } else {
          btnTraining.classList.remove('active');
          btnTraining.textContent = '开始抗阻训练';
        }
      } else {
        btnTraining.disabled = true;
        btnTraining.classList.remove('active');
        btnTraining.textContent = '开始抗阻训练';
      }

      // Matter.js
      var targetScale = Lec.P.clamp(massPct / 100, 0.4, 1.0);
      scaleMuscleFibers(targetScale);
      updateFiberColors(massPct);

      // Readout
      muscleReadout.innerHTML = massPct + '<span>% 肌肉量</span>';
    }

    weekSlider.addEventListener('input', function() {
      currentWeek = parseFloat(this.value);
      updateAll();
    });

    btnTraining.addEventListener('click', function() {
      if (currentWeek >= TRAINING_START_WEEK) {
        trainingActive = !trainingActive;
        updateAll();
      }
    });

    /* ---- 初始状态 ---- */
    updateAll();

    /* ---- 响应式处理 ---- */
    window.addEventListener('resize', function() {
      chart.resize();
    });

    /* ---- reduced-motion 处理 ---- */
    if (Deck.reduced()) {
      // 停止 matter.js 动画
      Runner.stop(runner);
      // 纤维停在当前位置
      fibers.forEach(function(f) {
        Body.setVelocity(f, { x: 0, y: 0 });
        Body.setAngularVelocity(f, 0);
      });
    }
  })();
  </script>
</body>
</html>
