<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第 33 页 · 互动讲义</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* ============================================================
       Page 33 — 宇航服质量分布 · classification
       Layout: split-tb (photo top 40%, interactive bottom 60%)
       ============================================================ */

    #main {
      display: flex;
      flex-direction: column;
      gap: var(--sp-6);
      height: 100%;
    }

    /* ---- Top section: photo ---- */
    .p33-top {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: var(--sp-8);
      flex-shrink: 0;
    }

    .p33-photo-wrap {
      flex-shrink: 0;
      position: relative;
      border-radius: var(--r-md);
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
      line-height: 0;
    }

    .p33-photo-wrap img {
      display: block;
      height: 190px;
      width: auto;
    }

    .p33-context {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
    }

    .p33-context .p33-tagline {
      font-size: var(--fs-lead);
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }

    .p33-context .p33-detail {
      font-size: var(--fs-body);
      color: var(--text-sec);
      line-height: 1.45;
    }

    /* ---- Bottom section: exploded view + ring chart ---- */
    .p33-bottom {
      display: flex;
      flex-direction: row;
      gap: var(--sp-8);
      flex: 1 1 auto;
      min-height: 0;
    }

    /* ---- Exploded view (left) ---- */
    .p33-exploded {
      flex: 1 1 55%;
      min-width: 0;
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .p33-exploded img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Hotspot overlay */
    .p33-hotspot {
      position: absolute;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: border-color 200ms var(--ease), background 200ms var(--ease);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .p33-hotspot:hover,
    .p33-hotspot:focus-visible {
      border-color: var(--accent);
      background: rgba(77,166,255,0.1);
      outline: none;
    }

    .p33-hotspot.active {
      border-color: var(--accent);
      background: rgba(77,166,255,0.15);
      box-shadow: 0 0 10px rgba(77,166,255,0.25);
    }

    .p33-hotspot-label {
      font-size: 14px;
      color: var(--text-dim);
      background: rgba(11,17,25,0.9);
      padding: 1px 6px;
      border-radius: 2px;
      pointer-events: none;
      white-space: nowrap;
      transition: color 200ms var(--ease);
    }

    .p33-hotspot.active .p33-hotspot-label {
      color: var(--accent);
    }

    /* ---- Right panel: ring chart + tree ---- */
    .p33-right {
      flex: 0 0 400px;
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      min-height: 0;
    }

    .p33-ring-wrap {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 170px;
    }

    .p33-ring-wrap svg {
      display: block;
    }

    /* Ring center text */
    .p33-ring-center {
      position: absolute;
      text-align: center;
      pointer-events: none;
    }

    .p33-ring-center .p33-ring-mass {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
    }

    .p33-ring-center .p33-ring-unit {
      font-size: var(--fs-label);
      color: var(--text-dim);
    }

    .p33-ring-center .p33-ring-name {
      font-size: var(--fs-label);
      color: var(--accent);
      margin-top: 1px;
    }

    /* Ring segment */
    .p33-segment {
      cursor: pointer;
      transition: opacity 200ms var(--ease);
    }

    .p33-segment:hover {
      opacity: 0.82;
    }

    .p33-segment.dimmed {
      opacity: 0.3;
    }

    /* ---- Classification tree ---- */
    .p33-tree {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
    }

    .p33-tree .k-classification {
      gap: var(--sp-1);
    }

    .p33-tree .k-classification .box {
      padding: var(--sp-2) var(--sp-3);
      cursor: pointer;
      transition: border-color 200ms var(--ease), background 200ms var(--ease);
      border-left: 3px solid var(--border);
      border-radius: var(--r-sm);
      border: 1px solid transparent;
      border-left: 3px solid var(--border);
    }

    .p33-tree .k-classification .box:hover {
      background: var(--surface-raised);
    }

    .p33-tree .k-classification .box.active {
      border-left-color: var(--accent);
      background: rgba(77,166,255,0.06);
    }

    .p33-tree .k-classification .bt {
      font-size: var(--fs-label);
      font-weight: 500;
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: baseline;
      gap: var(--sp-2);
      line-height: 1.35;
    }

    .p33-tree .k-classification .bt .mass {
      font-size: var(--fs-tick);
      color: var(--text-dim);
      font-weight: 400;
      white-space: nowrap;
    }

    .p33-tree .k-classification .box.active .bt .mass {
      color: var(--accent);
      font-weight: 600;
    }

    .p33-tree .k-classification .lv {
      padding-left: var(--sp-3);
      margin-left: var(--sp-1);
      gap: var(--sp-1);
    }

    .p33-tree .k-classification .lv .lv {
      padding-left: var(--sp-3);
      margin-left: var(--sp-1);
    }

    .p33-tree .k-classification .lv .box {
      padding: 2px var(--sp-2);
    }

    .p33-tree .k-classification .lv .bt {
      font-size: var(--fs-label);
      font-weight: 400;
    }

    /* ---- Insight bar ---- */
    .p33-insight {
      flex-shrink: 0;
      font-size: var(--fs-sec);
      color: var(--text-sec);
      line-height: 1.4;
      padding: var(--sp-2) var(--sp-3);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      border-left: 3px solid var(--accent);
      transition: color 300ms var(--ease);
    }

    .p33-insight strong {
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body data-page="33" data-total="60">
  <div id="stage">
    <main id="main"></main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
  (function () {
    'use strict';

    // ============================================================
    // 1. Mount header / footer
    // ============================================================
    Lec.mount({
      index: 33,
      kicker: '脱离地球',
      title: '宇航服质量分布',
      take: '现代宇航服总质量约 130 kg，相当于背着一个成年男性——但微重力下你感觉不到它的重量。',
      foot: '照片：NASA · 公有领域'
    });

    Deck.init({ index: 33, total: 60 });

    // ============================================================
    // 2. Data
    // ============================================================
    var TOTAL = Lec.K.EVA_SUIT_MASS; // 130

    var SUBS = [
      { key: 'plss',   name: '生命支持系统（PLSS）',   mass: 55, color: '#4da6ff',
        children: [
          { key: 'plss-o2',    name: '氧气瓶与调节器',       mass: 22 },
          { key: 'plss-co2',   name: '二氧化碳清除装置',      mass: 14 },
          { key: 'plss-water', name: '水循环与冷却泵',        mass: 10 },
          { key: 'plss-fan',   name: '风扇与管路',            mass:  6 },
          { key: 'plss-ctrl',  name: '控制器与传感器',        mass:  3 }
        ]},
      { key: 'shell',   name: '加压外壳（含头盔、手套）', mass: 30, color: '#34d399' },
      { key: 'thermal', name: '热控系统',                 mass: 20, color: '#f59e0b' },
      { key: 'comm',    name: '通讯与显示系统',           mass: 12, color: '#f87171' },
      { key: 'power',   name: '电源系统',                 mass: 13, color: '#a78bfa' }
    ];

    // ============================================================
    // 3. Build DOM
    // ============================================================
    var main = document.getElementById('main');

    // ---- Top: photo + context ----
    var top = document.createElement('div');
    top.className = 'p33-top';

    var photoWrap = document.createElement('div');
    photoWrap.className = 'p33-photo-wrap';
    var img = document.createElement('img');
    img.src = 'assets/img/emu-suit.jpg';
    img.alt = 'NASA EMU 舱外机动单元宇航服';
    photoWrap.appendChild(img);
    top.appendChild(photoWrap);

    var ctx = document.createElement('div');
    ctx.className = 'p33-context';
    var tagline = document.createElement('div');
    tagline.className = 'p33-tagline';
    tagline.textContent = '这件衣服重 130 kg。';
    ctx.appendChild(tagline);
    var detail = document.createElement('div');
    detail.className = 'p33-detail';
    detail.textContent = '在地球上穿上它寸步难行，但在轨道上几乎感觉不到重量。下面把它拆开，看看 130 kg 都花在了哪里。';
    ctx.appendChild(detail);
    top.appendChild(ctx);

    main.appendChild(top);

    // ---- Bottom: exploded view + ring chart + tree ----
    var bottom = document.createElement('div');
    bottom.className = 'p33-bottom';

    // Exploded view
    var exploded = document.createElement('div');
    exploded.className = 'p33-exploded';
    var expImg = document.createElement('img');
    expImg.src = 'assets/img/emu-exploded.png';
    expImg.alt = '宇航服爆炸拆分图';
    exploded.appendChild(expImg);
    bottom.appendChild(exploded);

    // Right panel
    var right = document.createElement('div');
    right.className = 'p33-right';

    // Ring chart
    var ringWrap = document.createElement('div');
    ringWrap.className = 'p33-ring-wrap';
    var svgNS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 170 170');
    svg.setAttribute('width', '170');
    svg.setAttribute('height', '170');
    ringWrap.appendChild(svg);

    var ringCenter = document.createElement('div');
    ringCenter.className = 'p33-ring-center';
    ringCenter.innerHTML = '<div class="p33-ring-mass">130</div><div class="p33-ring-unit">kg</div>';
    ringWrap.appendChild(ringCenter);
    right.appendChild(ringWrap);

    // Insight bar
    var insight = document.createElement('div');
    insight.className = 'p33-insight';
    insight.innerHTML = '质量仍然在那里：你的身体要推动它，<strong>初速度会降低</strong>，跳跃高度会受影响。';
    right.appendChild(insight);

    // Classification tree
    var tree = document.createElement('div');
    tree.className = 'p33-tree';
    right.appendChild(tree);

    bottom.appendChild(right);
    main.appendChild(bottom);

    // ============================================================
    // 4. Build donut chart
    // ============================================================
    var CX = 85, CY = 85, R_OUTER = 75, R_INNER = 46;

    function polar(cx, cy, r, angleDeg) {
      var rad = (angleDeg - 90) * Math.PI / 180;
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }

    function donutPath(cx, cy, outerR, innerR, startDeg, endDeg) {
      var sweep = endDeg - startDeg;
      var large = sweep > 180 ? 1 : 0;
      var o1 = polar(cx, cy, outerR, startDeg);
      var o2 = polar(cx, cy, outerR, endDeg);
      var i1 = polar(cx, cy, innerR, endDeg);
      var i2 = polar(cx, cy, innerR, startDeg);
      return [
        'M', o1.x, o1.y,
        'A', outerR, outerR, 0, large, 1, o2.x, o2.y,
        'L', i1.x, i1.y,
        'A', innerR, innerR, 0, large, 0, i2.x, i2.y,
        'Z'
      ].join(' ');
    }

    var cumDeg = 0;
    var segments = [];
    SUBS.forEach(function (sub) {
      var sweep = (sub.mass / TOTAL) * 360;
      var path = document.createElementNS(svgNS, 'path');
      path.setAttribute('d', donutPath(CX, CY, R_OUTER, R_INNER, cumDeg, cumDeg + sweep));
      path.setAttribute('fill', sub.color);
      path.setAttribute('stroke', '#0b1119');
      path.setAttribute('stroke-width', '1.5');
      path.classList.add('p33-segment');
      path.dataset.key = sub.key;
      svg.appendChild(path);
      segments.push({ el: path, key: sub.key, startDeg: cumDeg, sweep: sweep, sub: sub });
      cumDeg += sweep;
    });

    // ============================================================
    // 5. Build classification tree (PLSS children created dynamically)
    // ============================================================
    function buildTree() {
      tree.innerHTML = '';
      var root = document.createElement('div');
      root.className = 'k-classification';

      // Total
      var totalBox = document.createElement('div');
      totalBox.className = 'box';
      totalBox.dataset.key = 'total';
      totalBox.innerHTML = '<div class="bt">宇航服总质量<span class="mass">' + TOTAL + ' kg</span></div>';
      root.appendChild(totalBox);

      // Subsystems
      var lv1 = document.createElement('div');
      lv1.className = 'lv';
      SUBS.forEach(function (sub) {
        var box = document.createElement('div');
        box.className = 'box';
        box.dataset.key = sub.key;
        box.style.borderLeftColor = sub.color;
        box.innerHTML = '<div class="bt">' + sub.name + '<span class="mass">' + sub.mass + ' kg</span></div>';
        // Placeholder for children (empty initially)
        if (sub.children) {
          var lv2 = document.createElement('div');
          lv2.className = 'lv';
          lv2.dataset.parent = sub.key;
          lv2.style.display = 'none';
          box.appendChild(lv2);
        }
        lv1.appendChild(box);
      });
      totalBox.appendChild(lv1);
      root.appendChild(totalBox);
      tree.appendChild(root);
    }

    function expandPLSS() {
      var lv2 = tree.querySelector('.lv[data-parent="plss"]');
      if (!lv2 || lv2.children.length > 0) return; // Already populated
      var plss = SUBS[0];
      plss.children.forEach(function (ch) {
        var chBox = document.createElement('div');
        chBox.className = 'box';
        chBox.dataset.key = ch.key;
        chBox.style.borderLeftColor = plss.color;
        chBox.innerHTML = '<div class="bt">' + ch.name + '<span class="mass">' + ch.mass + ' kg</span></div>';
        lv2.appendChild(chBox);
      });
      lv2.style.display = '';
    }

    function collapsePLSS() {
      var lv2 = tree.querySelector('.lv[data-parent="plss"]');
      if (lv2) lv2.style.display = 'none';
    }

    buildTree();

    // ============================================================
    // 6. Build hotspots on exploded view
    // ============================================================
    // Non-overlapping regions for the 5 subsystems
    var hotspotDefs = [
      { key: 'plss',    left: '52%', top: '22%', width: '30%', height: '34%', label: 'PLSS 背包' },
      { key: 'shell',   left: '18%', top: '18%', width: '28%', height: '50%', label: '加压外壳' },
      { key: 'thermal', left: '3%',  top: '52%', width: '22%', height: '32%', label: '热控系统' },
      { key: 'comm',    left: '60%', top: '5%',  width: '20%', height: '16%', label: '通讯系统' },
      { key: 'power',   left: '58%', top: '60%', width: '24%', height: '28%', label: '电源系统' }
    ];

    var hotspots = [];
    hotspotDefs.forEach(function (def) {
      var hs = document.createElement('div');
      hs.className = 'p33-hotspot';
      hs.style.left = def.left;
      hs.style.top = def.top;
      hs.style.width = def.width;
      hs.style.height = def.height;
      hs.dataset.key = def.key;
      hs.tabIndex = 0;
      hs.setAttribute('role', 'button');
      hs.setAttribute('aria-label', def.label);
      var lbl = document.createElement('span');
      lbl.className = 'p33-hotspot-label';
      lbl.textContent = def.label;
      hs.appendChild(lbl);
      exploded.appendChild(hs);
      hotspots.push(hs);
    });

    // ============================================================
    // 7. Interaction
    // ============================================================
    var activeKey = null;

    function findSub(key) {
      for (var i = 0; i < SUBS.length; i++) {
        if (SUBS[i].key === key) return SUBS[i];
        if (SUBS[i].children) {
          for (var j = 0; j < SUBS[i].children.length; j++) {
            if (SUBS[i].children[j].key === key) return SUBS[i].children[j];
          }
        }
      }
      return null;
    }

    function findParentSub(key) {
      for (var i = 0; i < SUBS.length; i++) {
        if (SUBS[i].key === key) return SUBS[i];
        if (SUBS[i].children) {
          for (var j = 0; j < SUBS[i].children.length; j++) {
            if (SUBS[i].children[j].key === key) return SUBS[i];
          }
        }
      }
      return null;
    }

    function activate(key) {
      if (activeKey === key) {
        activeKey = null;
        updateUI(null);
        return;
      }
      activeKey = key;
      updateUI(key);
    }

    function updateUI(key) {
      var sub = key ? findParentSub(key) : null;
      var child = key ? findSub(key) : null;

      // Ring center
      if (key && child) {
        var pct = Math.round(child.mass / TOTAL * 100);
        ringCenter.innerHTML = '<div class="p33-ring-mass">' + child.mass + '</div><div class="p33-ring-unit">kg（' + pct + '%）</div><div class="p33-ring-name">' + child.name + '</div>';
      } else {
        ringCenter.innerHTML = '<div class="p33-ring-mass">' + TOTAL + '</div><div class="p33-ring-unit">kg</div>';
      }

      // Ring segments
      segments.forEach(function (seg) {
        if (!key) {
          seg.el.classList.remove('dimmed');
        } else if (sub && seg.key === sub.key) {
          seg.el.classList.remove('dimmed');
        } else {
          seg.el.classList.add('dimmed');
        }
      });

      // Hotspots
      hotspots.forEach(function (hs) {
        if (key && sub && hs.dataset.key === sub.key) {
          hs.classList.add('active');
        } else {
          hs.classList.remove('active');
        }
      });

      // Tree
      var allBoxes = tree.querySelectorAll('.box');
      allBoxes.forEach(function (b) { b.classList.remove('active'); });

      if (key) {
        var targetBox = tree.querySelector('.box[data-key="' + key + '"]');
        if (targetBox) targetBox.classList.add('active');
        if (sub && sub.key !== key) {
          var subBox = tree.querySelector('.box[data-key="' + sub.key + '"]');
          if (subBox) subBox.classList.add('active');
        }
      }

      // PLSS children
      if (key && sub && sub.key === 'plss') {
        expandPLSS();
        // Also activate the specific child
        if (child && child.key !== 'plss') {
          var childBox = tree.querySelector('.box[data-key="' + child.key + '"]');
          if (childBox) childBox.classList.add('active');
        }
      } else {
        collapsePLSS();
      }

      // Insight
      if (key && child) {
        var pct = Math.round(child.mass / TOTAL * 100);
        if (sub && child.key !== sub.key) {
          insight.innerHTML = '「' + child.name + '」占宇航服质量的 <strong>' + pct + '%</strong>——每多一公斤，在太空中就多一份需要推动的惯性。';
        } else {
          insight.innerHTML = '「' + sub.name + '」占宇航服质量的 <strong>' + pct + '%</strong>。重量感消失，惯性不消失——这是宇航服质量在微重力下的核心矛盾。';
        }
      } else {
        insight.innerHTML = '质量仍然在那里：你的身体要推动它，<strong>初速度会降低</strong>，跳跃高度会受影响。';
      }
    }

    // ============================================================
    // 8. Wire events
    // ============================================================
    segments.forEach(function (seg) {
      seg.el.addEventListener('click', function () { activate(seg.key); });
    });

    hotspots.forEach(function (hs) {
      hs.addEventListener('click', function () { activate(hs.dataset.key); });
      hs.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          activate(hs.dataset.key);
        }
      });
    });

    tree.addEventListener('click', function (e) {
      var box = e.target.closest('.box');
      if (!box) return;
      var key = box.dataset.key;
      if (key && key !== 'total') activate(key);
    });

  })();
  </script>
</body>
</html>
