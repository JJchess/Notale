<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 35 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main { display: flex; flex-direction: row; height: 100%; gap: var(--sp-8); }

  .left-col  { width: 440px; flex-shrink: 0; display: flex; flex-direction: column; gap: var(--sp-5); }
  .right-col { flex: 1 1 0%; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-3); }

  /* ---- scene buttons ---- */
  .scene-row { display: flex; flex-direction: row; gap: var(--sp-2); }
  .scene-btn {
    flex: 1 1 0%;
    font-family: var(--font-sans);
    font-size: var(--fs-label);
    padding: 8px 12px;
    border-radius: var(--r-sm);
    border: 1px solid var(--border-strong);
    background: var(--surface-raised);
    color: var(--text);
    cursor: pointer;
    transition: all var(--dur) var(--ease);
    outline: none;
    text-align: center;
  }
  .scene-btn:hover  { border-color: var(--accent-soft); }
  .scene-btn:focus-visible { border-color: var(--focus); box-shadow: 0 0 0 2px rgba(96,165,250,0.25); }
  .scene-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  /* ---- parameter panel ---- */
  .param-row { display: flex; justify-content: space-between; align-items: baseline; padding: 3px 0; }
  .param-lbl { font-size: var(--fs-label); color: var(--text-sec); }
  .param-val { font-size: var(--fs-body); color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .param-val.hl  { color: var(--accent); }

  /* ---- takeaways ---- */
  .takeaway {
    font-size: var(--fs-sec); color: var(--text-sec); line-height: 1.45;
    padding: var(--sp-3) var(--sp-4);
    border-left: 3px solid var(--accent-soft);
    background: var(--surface); border-radius: 0 var(--r-sm) var(--r-sm) 0;
  }

  /* ---- right column items ---- */
  #jump-cv    { width: 100%; height: 260px; display: block; background: var(--surface); border-radius: var(--r-md); border: 1px solid var(--border); }
  #chart      { width: 100%; height: 190px; }
  #moon-photo { width: 100%; height: 130px; object-fit: cover; border-radius: var(--r-md); border: 1px solid var(--border); }
  .photo-cap  { font-size: var(--fs-label); color: var(--text-dim); text-align: right; margin-top: 2px; }
</style>
</head>
<body data-page="35" data-total="60">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
Deck.init({ index: 35, total: 60 });

// ── DOM scaffold ──────────────────────────────────────────────
const main = document.getElementById('main');

const leftCol  = document.createElement('div'); leftCol.className  = 'left-col';
const rightCol = document.createElement('div'); rightCol.className = 'right-col';
main.appendChild(leftCol);
main.appendChild(rightCol);

// ── k-process ─────────────────────────────────────────────────
const kp = document.createElement('div'); kp.className = 'k-process';
kp.innerHTML = `
  <div class="axis"></div>
  <div class="steps">
    <div class="step current" data-step="0">选定重力</div>
    <div class="arw">→</div>
    <div class="step" data-step="1">合并质量调整初速度</div>
    <div class="arw">→</div>
    <div class="step" data-step="2">计算跳跃高度</div>
    <div class="arw">→</div>
    <div class="step" data-step="3">动画呈现</div>
  </div>`;
leftCol.appendChild(kp);

// ── scene selector ────────────────────────────────────────────
const sceneRow = document.createElement('div'); sceneRow.className = 'scene-row';

const SCENES = [
  { id: 'earth', label: '🌍 地球',   gKey: 'EARTH_GRAVITY', color: '#4da6ff' },
  { id: 'moon',  label: '🌙 月球',   gKey: 'MOON_GRAVITY',  color: '#c0c0c0' },
  { id: 'mars',  label: '🔴 火星',   gKey: 'MARS_GRAVITY',  color: '#e0774d' }
];

const btns = {};
SCENES.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'scene-btn';
  btn.textContent = s.label;
  btn.setAttribute('aria-pressed', 'false');
  if (i === 0) { btn.classList.add('active'); btn.setAttribute('aria-pressed', 'true'); }
  btn.addEventListener('click', () => selectScene(s.id));
  sceneRow.appendChild(btn);
  btns[s.id] = btn;
});
leftCol.appendChild(sceneRow);

// ── parameter panel ───────────────────────────────────────────
const paramPanel = document.createElement('div');
paramPanel.className = 'panel';
paramPanel.innerHTML = `
  <div class="param-row"><span class="param-lbl">重力加速度</span><span class="param-val" id="pv-g"></span></div>
  <div class="param-row"><span class="param-lbl">合并质量（宇航员＋宇航服）</span><span class="param-val" id="pv-m"></span></div>
  <div class="param-row"><span class="param-lbl">穿着宇航服初速度</span><span class="param-val" id="pv-v0"></span></div>
  <div class="param-row"><span class="param-lbl" style="color:var(--accent);">跳跃高度</span><span class="param-val hl" id="pv-h"></span></div>`;
leftCol.appendChild(paramPanel);

// ── takeaways ─────────────────────────────────────────────────
const tw1 = document.createElement('div'); tw1.className = 'takeaway';
tw1.textContent = '在月球上，即使穿着 130 kg 的宇航服，跳跃高度仍可达约 1.5 m——是地球上裸露跳跃的近四倍。';
leftCol.appendChild(tw1);

const tw2 = document.createElement('div'); tw2.className = 'takeaway';
tw2.textContent = '宇航服质量会压低初速度，但低重力的优势远大于质量带来的损失。';
leftCol.appendChild(tw2);

// ── right: canvas ─────────────────────────────────────────────
const cv = document.createElement('canvas'); cv.id = 'jump-cv';
rightCol.appendChild(cv);

// ── right: chart ──────────────────────────────────────────────
const chartDiv = document.createElement('div'); chartDiv.id = 'chart';
rightCol.appendChild(chartDiv);

// ── right: photo ──────────────────────────────────────────────
const photo = document.createElement('img');
photo.id = 'moon-photo';
photo.src = 'assets/img/p35-astronaut-jump.jpg';
photo.alt = '阿波罗17号宇航员 Eugene Cernan 在月球表面跳跃';
photo.title = '照片：NASA / Harrison H. Schmitt（Apollo 17, 1972）· Public Domain';
photo.loading = 'lazy';
rightCol.appendChild(photo);

const photoCap = document.createElement('div'); photoCap.className = 'photo-cap';
photoCap.textContent = 'Apollo 17 · 月球表面跳跃 · NASA';
rightCol.appendChild(photoCap);

// ── mount header/footer ───────────────────────────────────────
Lec.mount({
  index: 35,
  kicker: 'GRAVITY SWITCH',
  title: '穿上宇航服，在月球上能跳多高？',
  take: '切换重力场景，观察穿着宇航服时跳跃高度的变化'
});

// ── compute ───────────────────────────────────────────────────
function compute(gKey) {
  const g        = Lec.K[gKey];
  const mBody    = Lec.K.ASTRONAUT_MASS;
  const mTotal   = Lec.K.TOTAL_EVA_MASS;
  const v0Naked  = Lec.K.HUMAN_JUMP_INITIAL_VELOCITY;
  const v0Suited = v0Naked * Math.sqrt(mBody / mTotal);
  const h        = Lec.P.jumpHeightFromVelocity(v0Suited, g);
  return { g, mTotal, v0Suited, h };
}

// ── update DOM ────────────────────────────────────────────────
function updateReadings(d) {
  document.getElementById('pv-g').textContent  = d.g.toFixed(2) + ' m/s²';
  document.getElementById('pv-m').textContent  = d.mTotal.toFixed(0) + ' kg';
  document.getElementById('pv-v0').textContent = d.v0Suited.toFixed(2) + ' m/s';
  document.getElementById('pv-h').textContent  = d.h.toFixed(2) + ' m';
}

// ── button state ──────────────────────────────────────────────
function setActiveButton(id) {
  Object.values(btns).forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
  btns[id].classList.add('active');
  btns[id].setAttribute('aria-pressed', 'true');
}

// ── k-process step highlight ──────────────────────────────────
function highlightStep(idx) {
  const steps = kp.querySelectorAll('.step');
  steps.forEach((s, i) => {
    s.classList.remove('current', 'done');
    if (i < idx) s.classList.add('done');
    if (i === idx) s.classList.add('current');
  });
}

// ── Matter.js setup ───────────────────────────────────────────
const { Engine, Bodies, Composite, Body, Constraint } = Matter;

const engine = Engine.create();
engine.gravity.y = 0; // set on select

const worldW = 560, worldH = 260;
const SCALE = 200; // px per meter
const GROUND_TOP = worldH - 12; // y of ground surface

// ground: centered so its top is at GROUND_TOP
const groundH = 14;
const ground = Bodies.rectangle(worldW/2, GROUND_TOP + groundH/2, worldW, groundH, {
  isStatic: true, friction: 0.8
});
Composite.add(engine.world, ground);

// person composite: body + head
const bodyW = 22, bodyH = 38;
const headR = 9;
const personStartY = GROUND_TOP - bodyH/2; // feet on ground surface

const personBody = Bodies.rectangle(worldW/2, personStartY, bodyW, bodyH, {
  friction: 0.5, restitution: 0.05, density: 0.004
});
const personHead = Bodies.circle(worldW/2, personStartY - bodyH/2 - headR - 2, headR, {
  friction: 0.5, restitution: 0.05, density: 0.002
});
const neckConstr = Constraint.create({
  bodyA: personBody, bodyB: personHead,
  pointA: { x: 0, y: -bodyH/2 },
  pointB: { x: 0, y: headR },
  stiffness: 0.9, length: 2
});
Composite.add(engine.world, [personBody, personHead, neckConstr]);

// walls to prevent horizontal drift
const wallL = Bodies.rectangle(-6, worldH/2, 12, worldH, { isStatic: true });
const wallR = Bodies.rectangle(worldW + 6, worldH/2, 12, worldH, { isStatic: true });
Composite.add(engine.world, [wallL, wallR]);

// jump state machine
const STATE = { IDLE: 0, CROUCH: 1, LAUNCH: 2, AIR: 3, LAND: 4 };
let jumpState = STATE.IDLE;
let jumpTimer = 0;
let jumpV0 = 0;
let peakY = 0;
let initialY = 0;
let currentGKey = 'EARTH_GRAVITY';

// ── canvas drawing ────────────────────────────────────────────
const ctx = Deck.fit(cv);

function drawScene() {
  const w = worldW;
  ctx.clearRect(0, 0, w, worldH);

  // background gradient
  const grad = ctx.createLinearGradient(0, 0, 0, worldH);
  grad.addColorStop(0, '#111a26');
  grad.addColorStop(1, '#0d1520');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, worldH);

  // ground
  ctx.fillStyle = '#2a3a4a';
  ctx.fillRect(0, GROUND_TOP, w, worldH - GROUND_TOP);

  // surface texture line
  ctx.fillStyle = '#3a4a5a';
  ctx.fillRect(0, GROUND_TOP, w, 2);

  // draw person
  const bx = personBody.position.x;
  const by = personBody.position.y;
  const ba = personBody.angle;
  const hx = personHead.position.x;
  const hy = personHead.position.y;

  ctx.save();

  // body
  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(ba);
  ctx.fillStyle = '#4da6ff';
  ctx.fillRect(-bodyW/2, -bodyH/2, bodyW, bodyH);
  // suit lines
  ctx.strokeStyle = '#3388cc';
  ctx.lineWidth = 1;
  ctx.strokeRect(-bodyW/2 + 3, -bodyH/2 + 3, bodyW - 6, bodyH - 6);
  ctx.restore();

  // head
  ctx.beginPath();
  ctx.arc(hx, hy, headR, 0, Math.PI * 2);
  ctx.fillStyle = '#e8cda0';
  ctx.fill();
  // visor
  ctx.beginPath();
  ctx.arc(hx, hy, headR - 2, 0, Math.PI * 2);
  ctx.fillStyle = '#334455';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(hx, hy, headR - 4, 0, Math.PI * 2);
  ctx.fillStyle = '#445566';
  ctx.fill();

  // legs (simple lines connecting body bottom)
  ctx.strokeStyle = '#4da6ff';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  const footY = by + bodyH/2;
  // left leg
  ctx.beginPath();
  ctx.moveTo(bx - 6, footY);
  ctx.lineTo(bx - 8, footY + 6);
  ctx.stroke();
  // right leg
  ctx.beginPath();
  ctx.moveTo(bx + 6, footY);
  ctx.lineTo(bx + 8, footY + 6);
  ctx.stroke();

  ctx.restore();

  // height reference line
  if (jumpState === STATE.AIR || jumpState === STATE.LAND) {
    const peakLineY = peakY - bodyH/2 - headR*2 - 4;
    ctx.setLineDash([4, 6]);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(40, peakLineY);
    ctx.lineTo(w - 40, peakLineY);
    ctx.stroke();
    ctx.setLineDash([]);

    // height label
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '13px Inter,Segoe UI,system-ui,-apple-system,sans-serif';
    ctx.textAlign = 'right';
    const d = compute(currentGKey);
    ctx.fillText(d.h.toFixed(2) + ' m', w - 46, peakLineY - 4);
  }
}

// ── jump logic ────────────────────────────────────────────────
function triggerJump() {
  if (jumpState !== STATE.IDLE) return;
  jumpState = STATE.CROUCH;
  jumpTimer = 0;
  initialY = personBody.position.y;
  highlightStep(0);
}

function processJump(dt) {
  jumpTimer += dt;

  switch (jumpState) {
    case STATE.CROUCH: {
      const progress = Math.min(jumpTimer / 0.25, 1);
      const crouchOffset = 10 * Math.sin(progress * Math.PI / 2);
      Body.setPosition(personBody, { x: worldW/2, y: initialY + crouchOffset });
      Body.setPosition(personHead, { x: worldW/2, y: personHead.position.y });

      if (progress >= 1) {
        jumpState = STATE.LAUNCH;
        jumpTimer = 0;
        highlightStep(1);
        Body.setVelocity(personBody, { x: 0, y: -jumpV0 });
        Body.setVelocity(personHead, { x: 0, y: -jumpV0 });
      }
      break;
    }
    case STATE.LAUNCH: {
      // brief launch phase — let the body rise a bit before tracking peak
      if (jumpTimer > 0.12) {
        jumpState = STATE.AIR;
        jumpTimer = 0;
        peakY = personBody.position.y;
        highlightStep(2);
      }
      break;
    }
    case STATE.AIR: {
      if (personBody.position.y < peakY) peakY = personBody.position.y;
      // check landing: feet near ground surface and moving downward
      const footY = personBody.position.y + bodyH/2;
      if (footY >= GROUND_TOP - 2 && personBody.velocity.y > 0) {
        jumpState = STATE.LAND;
        jumpTimer = 0;
        highlightStep(3);
        Body.setPosition(personBody, { x: worldW/2, y: personStartY });
        Body.setVelocity(personBody, { x: 0, y: 0 });
        Body.setPosition(personHead, { x: worldW/2, y: personStartY - bodyH/2 - headR - 2 });
        Body.setVelocity(personHead, { x: 0, y: 0 });
      }
      break;
    }
    case STATE.LAND: {
      if (jumpTimer > 0.5) {
        jumpState = STATE.IDLE;
        jumpTimer = 0;
        highlightStep(0); // reset to first step
      }
      break;
    }
  }
}

// ── select scene ──────────────────────────────────────────────
let currentScene = 'earth';

function selectScene(id) {
  if (jumpState !== STATE.IDLE) return; // wait for animation to finish
  currentScene = id;
  currentGKey = SCENES.find(s => s.id === id).gKey;
  setActiveButton(id);

  const d = compute(currentGKey);
  updateReadings(d);

  // set engine gravity (scaled)
  engine.gravity.y = d.g * SCALE;

  // compute visual jump velocity
  // v0_suited in m/s → px/s
  jumpV0 = d.v0Suited * SCALE;

  // update chart highlight
  updateChart(id);

  triggerJump();
}

// ── ECharts ───────────────────────────────────────────────────
const chart = echarts.init(chartDiv, null, { renderer: 'svg' });

function buildChartOption(activeId) {
  const allData = SCENES.map(s => {
    const d = compute(s.gKey);
    return { name: s.label, value: parseFloat(d.h.toFixed(3)), gKey: s.gKey, id: s.id };
  });

  const colors = allData.map(d => d.id === activeId ? '#4da6ff' : '#334455');

  return {
    textStyle: { fontSize: 16, fontFamily: 'Inter,Segoe UI,system-ui,-apple-system,sans-serif', color: '#e6edf5' },
    grid: { left: 60, right: 20, top: 30, bottom: 36 },
    xAxis: {
      type: 'category',
      data: allData.map(d => d.name),
      axisLine: { lineStyle: { color: '#334455' } },
      axisTick: { show: false },
      axisLabel: { fontSize: 15, color: '#a0b0c0' }
    },
    yAxis: {
      type: 'value',
      name: '跳跃高度 (m)',
      nameTextStyle: { fontSize: 14, color: '#8899aa' },
      axisLabel: { fontSize: 13, color: '#8899aa' },
      splitLine: { lineStyle: { color: '#1a2a3a' } },
      min: 0
    },
    series: [{
      type: 'bar',
      data: allData.map((d, i) => ({
        value: d.value,
        itemStyle: {
          color: colors[i],
          borderRadius: [4, 4, 0, 0]
        }
      })),
      barWidth: '45%',
      label: {
        show: true,
        position: 'top',
        fontSize: 15,
        color: '#e6edf5',
        fontWeight: 600,
        formatter: function(p) { return p.value.toFixed(2) + ' m'; }
      },
      emphasis: {
        itemStyle: { color: '#60a5fa' }
      }
    }]
  };
}

function updateChart(activeId) {
  chart.setOption(buildChartOption(activeId));
}

// ── animation loop ────────────────────────────────────────────
const reduced = Deck.reduced();
let lastTime = performance.now();

Deck.loop(function() {
  const now = performance.now();
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1; // clamp

  if (!reduced) {
    Engine.update(engine, 1000 / 60);
    processJump(dt);
  }

  drawScene();
});

// ── init ───────────────────────────────────────────────────────
// initial computation and display
const initD = compute('EARTH_GRAVITY');
updateReadings(initD);
engine.gravity.y = initD.g * SCALE;
updateChart('earth');

// set initial person position
Body.setPosition(personBody, { x: worldW/2, y: personStartY });
Body.setPosition(personHead, { x: worldW/2, y: personStartY - bodyH/2 - headR - 2 });
Body.setVelocity(personBody, { x: 0, y: 0 });
Body.setVelocity(personHead, { x: 0, y: 0 });
</script>
</body>
</html>
