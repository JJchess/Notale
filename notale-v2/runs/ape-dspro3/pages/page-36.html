<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 36 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ============================================================
     Page 36 — 三地跳跃 · 三列并排比较
     ============================================================ */

  #main {
    display: flex;
    flex-direction: row;
    gap: var(--sp-6);
    height: 100%;
  }

  .scene-col {
    flex: 1 1 0%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    overflow: hidden;
    cursor: pointer;
    transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    outline: none;
  }

  .scene-col:hover {
    border-color: var(--accent-soft);
  }

  .scene-col:focus-visible {
    border-color: var(--focus);
    box-shadow: 0 0 0 2px rgba(96,165,250,0.25);
  }

  .scene-col.playing {
    border-color: var(--accent);
    box-shadow: 0 0 16px rgba(77,166,255,0.18);
  }

  /* ---- 列头 ---- */
  .scene-header {
    font-size: var(--fs-h2);
    font-weight: 600;
    color: var(--text);
    text-align: center;
    padding: var(--sp-3) var(--sp-3) 0;
    flex-shrink: 0;
    line-height: 1.3;
  }

  .scene-header .sub {
    display: block;
    font-size: var(--fs-label);
    font-weight: 400;
    color: var(--text-dim);
  }

  /* ---- 动画舞台 ---- */
  .scene-stage {
    flex: 1 1 0%;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scene-stage svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ISS 背景照片 */
  .iss-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.22;
    pointer-events: none;
  }

  /* 地面线 */
  .ground {
    stroke: var(--border-strong);
    stroke-width: 1.5;
    stroke-dasharray: 6 4;
  }

  /* 高度标尺虚线 */
  .height-ref {
    stroke: var(--border);
    stroke-width: 1;
    stroke-dasharray: 3 5;
    opacity: 0.4;
  }

  /* ---- 列底数据 ---- */
  .scene-data {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: var(--sp-2) var(--sp-3) var(--sp-3);
    gap: 0;
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--surface-raised);
  }

  .scene-data .row {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    gap: var(--sp-2);
    width: 100%;
    justify-content: center;
  }

  .scene-height {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.2;
  }

  .scene-height.dim {
    color: var(--text-dim);
  }

  .scene-label {
    font-size: var(--fs-label);
    color: var(--text-dim);
    line-height: 1.3;
  }

  .scene-time {
    font-size: var(--fs-label);
    color: var(--text-dim);
    line-height: 1.3;
  }

  .scene-hint {
    font-size: var(--fs-label);
    color: var(--text-dim);
    opacity: 0.55;
    margin-top: 2px;
  }

  /* reduced-motion */
  @media (prefers-reduced-motion: reduce) {
    .scene-col {
      cursor: default;
    }
  }
</style>
</head>
<body data-page="36" data-total="60">
<div id="stage">
<main id="main">

  <!-- 地面 · 地球 -->
  <div class="scene-col" tabindex="0" data-scene="earth" id="col-earth" role="button" aria-label="地面地球跳跃动画">
    <div class="scene-header">
      地面<span class="sub">地球 · 9.8 m/s²</span>
    </div>
    <div class="scene-stage">
      <svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid meet">
        <line class="ground" x1="30" y1="360" x2="270" y2="360"/>
        <line class="height-ref" x1="80" y1="360" x2="80" y2="310"/>
        <line class="height-ref" x1="220" y1="360" x2="220" y2="310"/>
        <g transform="translate(150, 340)">
          <g class="figure-inner" id="fig-earth">
            <circle cx="0" cy="-58" r="9" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="0" y1="-49" x2="4" y2="-22" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="0" y1="-44" x2="-12" y2="-35" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/>
            <line x1="0" y1="-44" x2="14" y2="-30" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/>
            <line x1="4" y1="-22" x2="14" y2="-2" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="14" y1="-2" x2="6" y2="20" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="6" y1="20" x2="18" y2="20" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
          </g>
        </g>
      </svg>
    </div>
    <div class="scene-data">
      <div class="row">
        <span class="scene-height" id="height-earth">--</span>
        <span class="scene-label">跳跃高度</span>
      </div>
      <span class="scene-time" id="time-earth">空中 -- 秒</span>
      <span class="scene-hint">点击播放</span>
    </div>
  </div>

  <!-- ISS · 微重力 -->
  <div class="scene-col" tabindex="0" data-scene="iss" id="col-iss" role="button" aria-label="ISS微重力漂移动画">
    <div class="scene-header">
      ISS<span class="sub">微重力 · ≈ 0 m/s²</span>
    </div>
    <div class="scene-stage">
      <img class="iss-bg"
           src="assets/img/p36-iss-float.jpg"
           alt=""
           title="照片：NASA JSC — Whitson 漂浮在 ISS 命运号实验舱内（STS-111），公有领域">
      <svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid meet">
        <g transform="translate(150, 230)">
          <g class="figure-inner" id="fig-iss">
            <circle cx="0" cy="-58" r="9" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="0" y1="-49" x2="4" y2="-22" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="0" y1="-44" x2="-12" y2="-35" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/>
            <line x1="0" y1="-44" x2="14" y2="-30" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/>
            <line x1="4" y1="-22" x2="14" y2="-2" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="14" y1="-2" x2="6" y2="20" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="6" y1="20" x2="18" y2="20" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
          </g>
        </g>
      </svg>
    </div>
    <div class="scene-data">
      <div class="row">
        <span class="scene-height dim">—</span>
        <span class="scene-label">无法跳跃</span>
      </div>
      <span class="scene-time">蹬腿 → 漂移，无法落地</span>
      <span class="scene-hint">点击播放</span>
    </div>
  </div>

  <!-- 月球 -->
  <div class="scene-col" tabindex="0" data-scene="moon" id="col-moon" role="button" aria-label="月球跳跃动画">
    <div class="scene-header">
      月球<span class="sub">月球 · 1.62 m/s²</span>
    </div>
    <div class="scene-stage">
      <svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid meet">
        <line class="ground" x1="30" y1="360" x2="270" y2="360"/>
        <line class="height-ref" x1="80" y1="360" x2="80" y2="40"/>
        <line class="height-ref" x1="220" y1="360" x2="220" y2="40"/>
        <g transform="translate(150, 340)">
          <g class="figure-inner" id="fig-moon">
            <circle cx="0" cy="-58" r="9" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="0" y1="-49" x2="4" y2="-22" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="0" y1="-44" x2="-12" y2="-35" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/>
            <line x1="0" y1="-44" x2="14" y2="-30" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/>
            <line x1="4" y1="-22" x2="14" y2="-2" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="14" y1="-2" x2="6" y2="20" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="6" y1="20" x2="18" y2="20" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
          </g>
        </g>
      </svg>
    </div>
    <div class="scene-data">
      <div class="row">
        <span class="scene-height" id="height-moon">--</span>
        <span class="scene-label">跳跃高度</span>
      </div>
      <span class="scene-time" id="time-moon">空中 -- 秒</span>
      <span class="scene-hint">点击播放</span>
    </div>
  </div>

</main>
</div>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/anime.min.js"></script>
<script>
/* ============================================================
   Page 36 — 三地跳跃 · 动画逻辑
   ============================================================ */

Deck.init({ index: 36, total: 60 });

/* ---- 从 Lec 取数据 ---- */
var gEarth  = Lec.K.EARTH_GRAVITY;
var gMoon   = Lec.K.MOON_GRAVITY;
var v0      = Lec.K.HUMAN_JUMP_INITIAL_VELOCITY;

var hEarth  = Lec.P.jumpHeightFromVelocity(v0, gEarth);
var hMoon   = Lec.P.jumpHeightFromVelocity(v0, gMoon);
var tEarth  = 2 * v0 / gEarth;
var tMoon   = 2 * v0 / gMoon;

/* ---- 填充数值 ---- */
function fmt(n, d) { return n.toFixed(d); }

document.getElementById('height-earth').textContent = fmt(hEarth, 2) + ' m';
document.getElementById('time-earth').textContent  = '空中 ' + fmt(tEarth, 2) + ' 秒';
document.getElementById('height-moon').textContent  = fmt(hMoon, 2) + ' m';
document.getElementById('time-moon').textContent   = '空中 ' + fmt(tMoon, 2) + ' 秒';

/* ---- 动画：跳跃高度 → 像素缩放 ---- */
var EARTH_PEAK = 55;   /* px, 对应 ~0.32 m */
var MOON_PEAK  = 300;  /* px, 对应 ~1.93 m */
var ISS_DRIFT  = 120;  /* px, ISS 漂移距离 */

/* ---- 构建动画 timeline ---- */
function buildEarthTimeline(figEl) {
  var state = { y: 0, sy: 1 };
  var tl = anime.timeline({ autoplay: false, easing: 'easeOutQuad' });

  function upd() {
    figEl.setAttribute('transform', 'translate(0,' + state.y + ') scale(1,' + state.sy + ')');
  }

  tl.add({ targets: state, sy: [1, 0.85], y: 3,  duration: 160, easing: 'easeInOutQuad', update: upd })
    .add({ targets: state, sy: [0.85, 1.08], y: -EARTH_PEAK, duration: 380, easing: 'easeOutQuad', update: upd })
    .add({ targets: state, sy: [1.08, 1], y: 0, duration: 380, easing: 'easeInQuad', update: upd })
    .add({ targets: state, sy: [1, 0.88], y: 3, duration: 90, easing: 'easeOutQuad', update: upd })
    .add({ targets: state, sy: [0.88, 1], y: 0, duration: 100, easing: 'easeOutQuad', update: upd });

  return tl;
}

function buildMoonTimeline(figEl) {
  var state = { y: 0, sy: 1 };
  var tl = anime.timeline({ autoplay: false, easing: 'easeOutQuad' });

  function upd() {
    figEl.setAttribute('transform', 'translate(0,' + state.y + ') scale(1,' + state.sy + ')');
  }

  tl.add({ targets: state, sy: [1, 0.85], y: 3,  duration: 240, easing: 'easeInOutQuad', update: upd })
    .add({ targets: state, sy: [0.85, 1.08], y: -MOON_PEAK, duration: 1500, easing: 'easeOutQuad', update: upd })
    .add({ targets: state, sy: [1.08, 1], y: 0, duration: 1500, easing: 'easeInQuad', update: upd })
    .add({ targets: state, sy: [1, 0.88], y: 3, duration: 160, easing: 'easeOutQuad', update: upd })
    .add({ targets: state, sy: [0.88, 1], y: 0, duration: 180, easing: 'easeOutQuad', update: upd });

  return tl;
}

function buildISSTimeline(figEl) {
  var state = { y: 0, sy: 1 };
  var tl = anime.timeline({ autoplay: false, easing: 'easeOutQuad' });

  function upd() {
    figEl.setAttribute('transform', 'translate(0,' + state.y + ') scale(1,' + state.sy + ')');
  }

  tl.add({ targets: state, sy: [1, 0.88], y: 3, duration: 220, easing: 'easeInOutQuad', update: upd })
    .add({ targets: state, sy: [0.88, 1.02], y: -ISS_DRIFT, duration: 2600, easing: 'linear', update: upd });

  return tl;
}

/* ---- 实例化 ---- */
var figEarth = document.getElementById('fig-earth');
var figMoon  = document.getElementById('fig-moon');
var figISS   = document.getElementById('fig-iss');

var tlEarth = buildEarthTimeline(figEarth);
var tlMoon  = buildMoonTimeline(figMoon);
var tlISS   = buildISSTimeline(figISS);

var animState = { earth: tlEarth, moon: tlMoon, iss: tlISS };
var playing = null;

/* ---- 交互 ---- */
var cols = document.querySelectorAll('.scene-col');

function resetAll() {
  cols.forEach(function(c) { c.classList.remove('playing'); });
  [tlEarth, tlMoon, tlISS].forEach(function(tl) {
    tl.pause();
    tl.seek(0);
  });
  figEarth.setAttribute('transform', 'translate(0,0) scale(1,1)');
  figMoon.setAttribute('transform', 'translate(0,0) scale(1,1)');
  figISS.setAttribute('transform', 'translate(0,0) scale(1,1)');
  playing = null;
}

function playScene(scene) {
  if (playing === scene) {
    resetAll();
    return;
  }

  resetAll();

  var col = document.getElementById('col-' + scene);
  col.classList.add('playing');
  playing = scene;

  var tl = animState[scene];

  if (Deck.reduced()) {
    if (scene === 'earth') {
      figEarth.setAttribute('transform', 'translate(0,' + (-EARTH_PEAK) + ') scale(1,1.08)');
    } else if (scene === 'moon') {
      figMoon.setAttribute('transform', 'translate(0,' + (-MOON_PEAK) + ') scale(1,1.08)');
    } else {
      figISS.setAttribute('transform', 'translate(0,' + (-ISS_DRIFT) + ') scale(1,1.02)');
    }
    return;
  }

  tl.restart();

  tl.finished.then(function() {
    col.classList.remove('playing');
    playing = null;
  });
}

cols.forEach(function(col) {
  col.addEventListener('click', function() {
    playScene(col.dataset.scene);
  });

  col.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      playScene(col.dataset.scene);
    }
  });
});

/* ---- Lec.mount ---- */
Lec.mount({
  index: 36,
  kicker: '脱离地球',
  title: '三地跳跃',
  take: '重力越小跳得越高，微重力让"跳"本身失效。'
});
</script>
</body>
</html>
