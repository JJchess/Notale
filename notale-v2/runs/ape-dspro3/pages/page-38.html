<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 38 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ============================================================
     page-38 · 星球跳跃高度对比表
     100 秒 · comparison · ledger
     ============================================================ */

  /* ---- 页面专属布局 ---- */
  .pg38-wrap {
    display: flex;
    flex-direction: column;
    gap: var(--sp-5);
    width: 100%;
    height: 100%;
  }

  .pg38-controls {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: var(--sp-8);
    padding: var(--sp-3) var(--sp-6);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    flex-shrink: 0;
  }

  .pg38-slider-group {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
  }

  .pg38-slider-group label {
    font-size: var(--fs-label);
    color: var(--text-sec);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .pg38-slider-group input[type="range"] {
    width: 200px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }

  .pg38-slider-val {
    font-size: var(--fs-label);
    color: var(--text);
    font-weight: 600;
    min-width: 52px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .pg38-check-group {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    flex-shrink: 0;
  }

  .pg38-check-group input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .pg38-check-group label {
    font-size: var(--fs-label);
    color: var(--text-sec);
    cursor: pointer;
    user-select: none;
  }

  .pg38-body {
    display: flex;
    flex-direction: row;
    gap: var(--sp-6);
    flex: 1 1 0%;
    min-height: 0;
  }

  /* ---- 表格区域 ---- */
  .pg38-table-wrap {
    flex: 1 1 0%;
    min-width: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* 覆盖 .k-comparison 的 grid 定义，使用显式列宽 */
  .pg38-table {
    display: grid;
    grid-template-columns: 100px 120px 130px 110px 120px;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    overflow: hidden;
    background: var(--surface);
    font-size: var(--fs-body);
    width: 100%;
  }

  .pg38-table .hdr {
    background: var(--surface-raised);
    font-weight: 600;
    padding: var(--sp-3) var(--sp-4);
    border-bottom: 2px solid var(--border-strong);
    color: var(--text);
    text-align: center;
    font-size: var(--fs-label);
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: background 150ms var(--ease);
    position: relative;
  }

  .pg38-table .hdr:hover {
    background: var(--border);
  }

  .pg38-table .hdr .sort-arrow {
    font-size: 12px;
    color: var(--text-dim);
    opacity: 0.5;
    line-height: 1;
  }

  .pg38-table .hdr.sorted .sort-arrow {
    opacity: 1;
    color: var(--accent);
  }

  .pg38-table .row-name {
    text-align: left;
    padding: var(--sp-3) var(--sp-5);
    color: var(--text);
    font-weight: 500;
    font-size: var(--fs-sec);
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
    white-space: nowrap;
  }

  .pg38-table .cell {
    padding: var(--sp-3) var(--sp-4);
    text-align: center;
    color: var(--text);
    font-size: var(--fs-sec);
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 300ms var(--ease);
  }

  .pg38-table .cell.heat {
    font-weight: 600;
    border-radius: 2px;
  }

  .pg38-table .rowline {
    grid-column: 1 / -1;
    height: 1px;
    background: var(--border);
  }

  .pg38-jupiter-note {
    font-size: var(--fs-tick);
    color: var(--text-dim);
    margin-left: 4px;
    font-weight: 400;
  }

  /* ---- 图表区域 ---- */
  .pg38-chart-wrap {
    width: 480px;
    flex-shrink: 0;
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    overflow: hidden;
    background: var(--surface);
  }

  .pg38-chart-wrap .chart-inner {
    width: 100%;
    height: 100%;
  }

  /* ---- 图注 ---- */
  .pg38-note-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: var(--sp-4);
    flex-shrink: 0;
  }

  .pg38-heat-legend {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    font-size: var(--fs-tick);
    color: var(--text-dim);
  }

  .pg38-heat-legend .swatch {
    width: 80px;
    height: 8px;
    border-radius: 4px;
    background: linear-gradient(to right, hsl(215, 10%, 28%), hsl(25, 85%, 55%));
  }
</style>
</head>
<body data-page="38" data-total="60">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(function() {
  /* ==============================================================
     page-38 · 星球跳跃高度对比表
     100 秒 · comparison · ledger
     ============================================================== */

  // -- 初始化底盘 --
  Deck.init({ index: 38, total: 60 });

  // -- 挂载页眉页脚 --
  Lec.mount({
    kicker: '第三章 · 脱离地球',
    title: '星球跳跃高度对比',
    take: '月球跳最高，木星跳不动，火星适中——重力决定了你能离开地面多远'
  });

  var main = document.getElementById('main');

  /* ==============================================================
     星球数据 —— 重力加速度全部来自 Lec.K，仅谷神星硬编码
     ============================================================== */
  var planetDefs = [
    { key: 'ceres',  name: '谷神星', gravity: 0.27 },            // 不在 Lec.K 中，按规划给定
    { key: 'pluto',  name: '冥王星', gravity: Lec.K.PLUTO_GRAVITY },
    { key: 'moon',   name: '月球',   gravity: Lec.K.MOON_GRAVITY },
    { key: 'mars',   name: '火星',   gravity: Lec.K.MARS_GRAVITY },
    { key: 'earth',  name: '地球',   gravity: Lec.K.EARTH_GRAVITY },
    { key: 'jupiter',name: '木星',   gravity: Lec.K.JUPITER_GRAVITY }
  ];

  /* ==============================================================
     DOM 构建
     ============================================================== */
  main.innerHTML = ''
    + '<div class="pg38-wrap">'
    +   '<!-- 控件行 -->'
    +   '<div class="pg38-controls">'
    +     '<div class="pg38-slider-group">'
    +       '<label for="v0-slider">初速度 v₀</label>'
    +       '<input type="range" id="v0-slider" min="0.5" max="4.0" step="0.1">'
    +       '<span class="pg38-slider-val" id="v0-val"></span>'
    +       '<span style="font-size:var(--fs-tick);color:var(--text-dim)">m/s</span>'
    +     '</div>'
    +     '<div class="pg38-check-group">'
    +       '<input type="checkbox" id="suit-check">'
    +       '<label for="suit-check">穿宇航服（200 kg）</label>'
    +     '</div>'
    +   '</div>'
    +   '<!-- 主体：表格 + 图表 -->'
    +   '<div class="pg38-body">'
    +     '<div class="pg38-table-wrap">'
    +       '<div class="pg38-table k-comparison" id="planet-table"></div>'
    +     '</div>'
    +     '<div class="pg38-chart-wrap">'
    +       '<div class="chart-inner" id="chart"></div>'
    +     '</div>'
    +   '</div>'
    +   '<!-- 图注行 -->'
    +   '<div class="pg38-note-row">'
    +     '<div class="pg38-heat-legend">'
    +       '<span>跳得矮</span>'
    +       '<span class="swatch"></span>'
    +       '<span>跳得高</span>'
    +     '</div>'
    +     '<span class="note">点击列头可排序 · 拖动滑块改变初速度</span>'
    +   '</div>'
    + '</div>';

  /* ==============================================================
     状态
     ============================================================== */
  var v0 = Lec.K.HUMAN_JUMP_INITIAL_VELOCITY;
  var suited = false;
  var sortCol = 0;   // 默认按重力排序（即按数组顺序，重力升序）
  var sortAsc = true;

  // DOM 引用
  var sliderEl = document.getElementById('v0-slider');
  var v0ValEl = document.getElementById('v0-val');
  var suitCheck = document.getElementById('suit-check');
  var tableEl = document.getElementById('planet-table');
  var chartEl = document.getElementById('chart');

  // 设置滑块初始值
  sliderEl.value = v0;

  /* ==============================================================
     计算行数据
     ============================================================== */
  function computeRow(pd) {
    var g = pd.gravity;
    var v = suited ? v0 * (Lec.K.ASTRONAUT_MASS / Lec.K.TOTAL_EVA_MASS) : v0;
    var h = Lec.P.jumpHeightFromVelocity(v, g);
    var flightTime = 2 * v / g;
    var vEarth = suited ? v0 * (Lec.K.ASTRONAUT_MASS / Lec.K.TOTAL_EVA_MASS) : v0;
    var hEarth = Lec.P.jumpHeightFromVelocity(vEarth, Lec.K.EARTH_GRAVITY);
    var ratio = h / hEarth;
    return {
      key: pd.key,
      name: pd.name,
      gravity: g,
      height: h,
      flightTime: flightTime,
      ratio: ratio,
      v: v
    };
  }

  function getAllRows() {
    return planetDefs.map(function(pd) { return computeRow(pd); });
  }

  /* ==============================================================
     热力图颜色
     ============================================================== */
  function heatColor(rows, h) {
    var heights = rows.map(function(r) { return r.height; });
    var minH = Math.min.apply(null, heights);
    var maxH = Math.max.apply(null, heights);
    if (maxH - minH < 0.001) maxH = minH + 0.001;
    var t = (h - minH) / (maxH - minH);
    // 冷灰 → 暖橙
    var hStart = 215, sStart = 10, lStart = 32;
    var hEnd = 25, sEnd = 85, lEnd = 50;
    var hue = hStart + (hEnd - hStart) * t;
    var sat = sStart + (sEnd - sStart) * t;
    var lit = lStart + (lEnd - lStart) * t;
    return 'hsl(' + Math.round(hue) + ',' + Math.round(sat) + '%,' + Math.round(lit) + '%)';
  }

  function heatTextColor(rows, h) {
    var heights = rows.map(function(r) { return r.height; });
    var maxH = Math.max.apply(null, heights);
    var t = h / (maxH || 1);
    // 高值用深色文字，低值保持浅色
    return t > 0.5 ? '#1a1a2e' : 'var(--text)';
  }

  /* ==============================================================
     排序
     ============================================================== */
  var colKeys = ['name', 'gravity', 'height', 'flightTime', 'ratio'];

  function sortRows(rows) {
    var key = colKeys[sortCol];
    return rows.slice().sort(function(a, b) {
      var va = a[key], vb = b[key];
      if (typeof va === 'string') {
        var cmp = va.localeCompare(vb, 'zh');
        return sortAsc ? cmp : -cmp;
      }
      return sortAsc ? va - vb : vb - va;
    });
  }

  /* ==============================================================
     渲染表格
     ============================================================== */
  var colHeaders = ['星球', '重力加速度', '跳跃高度', '飞行时间', '相对地球'];
  var colUnits = ['', 'm/s²', 'm', 's', ''];

  function renderTable() {
    var rows = getAllRows();
    var sorted = sortRows(rows);

    var html = '';
    // 表头
    for (var ci = 0; ci < colHeaders.length; ci++) {
      var sortedClass = (ci === sortCol) ? ' sorted' : '';
      var arrow = (ci === sortCol) ? (sortAsc ? ' ▲' : ' ▼') : '';
      html += '<div class="hdr' + sortedClass + '" data-col="' + ci + '">'
        + colHeaders[ci]
        + '<span class="sort-arrow">' + arrow + '</span>'
        + '</div>';
    }

    // 数据行
    for (var ri = 0; ri < sorted.length; ri++) {
      var r = sorted[ri];
      var hColor = heatColor(rows, r.height);
      var hTextColor = heatTextColor(rows, r.height);

      html += '<div class="row-name">' + r.name + '</div>';
      // 重力加速度
      html += '<div class="cell">' + r.gravity.toFixed(2) + '</div>';
      // 跳跃高度（热力图）
      var heightLabel = r.height < 0.1 ? r.height.toFixed(3) : r.height.toFixed(2);
      var jupiterNote = '';
      if (r.key === 'jupiter' && r.height < 0.2) {
        jupiterNote = '<span class="pg38-jupiter-note">跳不动</span>';
      }
      html += '<div class="cell heat" style="background:' + hColor + ';color:' + hTextColor + '">'
        + heightLabel + ' m' + jupiterNote + '</div>';
      // 飞行时间
      html += '<div class="cell">' + r.flightTime.toFixed(2) + '</div>';
      // 相对地球
      html += '<div class="cell">' + r.ratio.toFixed(1) + '×</div>';
    }

    tableEl.innerHTML = html;

    // 绑定表头点击
    var hdrs = tableEl.querySelectorAll('.hdr');
    for (var hi = 0; hi < hdrs.length; hi++) {
      hdrs[hi].addEventListener('click', (function(col) {
        return function() {
          if (sortCol === col) {
            sortAsc = !sortAsc;
          } else {
            sortCol = col;
            sortAsc = true;
          }
          renderTable();
          renderChart();
        };
      })(hi));
    }
  }

  /* ==============================================================
     echarts 柱状图
     ============================================================== */
  var chartInstance = null;

  function renderChart() {
    var rows = getAllRows();
    var sorted = sortRows(rows);

    var names = sorted.map(function(r) { return r.name; });
    var heights = sorted.map(function(r) { return r.height; });
    var allHeights = rows.map(function(r) { return r.height; });
    var minH = Math.min.apply(null, allHeights);
    var maxH = Math.max.apply(null, allHeights);

    var colors = sorted.map(function(r) {
      return heatColor(rows, r.height);
    });

    var option = {
      textStyle: { fontSize: 16, fontFamily: 'Inter, system-ui, sans-serif', color: '#e6edf5' },
      grid: { left: 72, right: 48, top: 20, bottom: 24 },
      xAxis: {
        type: 'value',
        name: '跳跃高度 (m)',
        nameLocation: 'middle',
        nameGap: 28,
        nameTextStyle: { fontSize: 14, color: '#a0b0c0' },
        axisLabel: { fontSize: 13, color: '#8899aa' },
        axisLine: { lineStyle: { color: '#334455' } },
        splitLine: { lineStyle: { color: '#243040' } },
        min: 0,
        max: Math.ceil(maxH + 0.5)
      },
      yAxis: {
        type: 'category',
        data: names,
        axisLabel: { fontSize: 14, color: '#e6edf5', fontWeight: 500 },
        axisLine: { lineStyle: { color: '#334455' } },
        axisTick: { show: false }
      },
      series: [{
        type: 'bar',
        data: heights.map(function(h, i) {
          return {
            value: h,
            itemStyle: {
              color: colors[i],
              borderRadius: [0, 3, 3, 0]
            }
          };
        }),
        barMaxWidth: 32,
        label: {
          show: true,
          position: 'right',
          fontSize: 13,
          color: '#e6edf5',
          formatter: function(p) {
            return p.value < 0.1 ? p.value.toFixed(3) + ' m' : p.value.toFixed(2) + ' m';
          }
        },
        emphasis: {
          itemStyle: { color: '#60a5fa' }
        }
      }]
    };

    if (!chartInstance) {
      chartInstance = echarts.init(chartEl, null, { renderer: 'svg' });
    }
    chartInstance.setOption(option, true);
  }

  /* ==============================================================
     更新
     ============================================================== */
  function updateAll() {
    v0ValEl.textContent = v0.toFixed(1);
    renderTable();
    renderChart();
  }

  /* ==============================================================
     事件绑定
     ============================================================== */
  sliderEl.addEventListener('input', function() {
    v0 = parseFloat(this.value);
    updateAll();
  });

  suitCheck.addEventListener('change', function() {
    suited = this.checked;
    updateAll();
  });

  /* ==============================================================
     窗口 resize 时重绘 echarts
     ============================================================== */
  window.addEventListener('resize', function() {
    if (chartInstance) chartInstance.resize();
  });

  /* ==============================================================
     初始渲染
     ============================================================== */
  updateAll();

})();
</script>
</body>
</html>
