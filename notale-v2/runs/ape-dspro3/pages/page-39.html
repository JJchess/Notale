<link rel="stylesheet" href="assets/base.css">

<style>
  /* ---- 页面专属样式 ---- */
  #main {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
  }

  /* 两句关键提示 */
  .key-notes {
    display: flex;
    flex-direction: row;
    gap: var(--sp-6);
    padding: 0 0 var(--sp-3) 0;
    flex-shrink: 0;
  }
  .key-notes p {
    flex: 1 1 0%;
    min-width: 0;
    font-size: var(--fs-sec);
    color: var(--text-sec);
    line-height: 1.45;
    margin: 0;
    padding: var(--sp-3) var(--sp-4);
    background: var(--surface);
    border-left: 3px solid var(--accent-soft);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
  }

  /* 3D 画布区 */
  .canvas-wrap {
    flex: 1 1 0%;
    min-height: 0;
    position: relative;
    background: #080d14;
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    overflow: hidden;
  }

    display: block;
    width: 100%;
    height: 100%;
  }

  /* 插画叠加 */
  .illus {
    position: absolute;
    right: var(--sp-4);
    bottom: var(--sp-4);
    width: 200px;
    height: 112px;
    object-fit: cover;
    border-radius: var(--r-sm);
    border: 1px solid rgba(255,255,255,0.15);
    opacity: 0.75;
    pointer-events: none;
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }

  /* 轴标签 —— DOM 叠在画布边 */
  .ax-label {
    position: absolute;
    font-size: var(--fs-label);
    color: var(--text-dim);
    pointer-events: none;
    font-weight: 500;
    letter-spacing: 0.03em;
  }
  .ax-label.x { bottom: 8px; left: 50%; transform: translateX(-50%); }
  .ax-label.y { left: 10px; top: 50%; transform: translateY(-50%) rotate(-90deg); }
  .ax-label.z { right: 10px; top: 50%; transform: translateY(-50%) rotate(-90deg); }

  /* 控件行 */
  .ctl-row {
    flex-shrink: 0;
    display: flex;
    flex-direction: row;
    align-items: flex-end;
    gap: var(--sp-6);
    padding: var(--sp-4) 0 0 0;
  }
  .slider-group {
    flex: 1 1 0%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--sp-1);
  }
  .slider-group .sg-label {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    justify-content: space-between;
    font-size: var(--fs-label);
    color: var(--text-sec);
  }
  .slider-group .sg-label .val {
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    font-family: var(--font-mono);
    font-size: var(--fs-label);
  }
  .slider-group .sg-src {
    font-size: 14px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .slider-group input[type="range"] {
    width: 100%;
    height: 6px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--border);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  .slider-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    cursor: pointer;
    box-shadow: 0 0 6px rgba(77,166,255,0.4);
  }
  .slider-group input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    cursor: pointer;
    box-shadow: 0 0 6px rgba(77,166,255,0.4);
  }
  .slider-group input[type="range"]:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .btn-reset {
    flex-shrink: 0;
    font-family: var(--font-sans);
    font-size: var(--fs-label);
    padding: 5px 16px;
    border-radius: var(--r-sm);
    border: 1px solid var(--border-strong);
    background: var(--surface-raised);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
    height: 32px;
  }
  .btn-reset:hover { border-color: var(--accent-soft); background: var(--surface); }
  .btn-reset:focus-visible {
    border-color: var(--focus);
    box-shadow: 0 0 0 2px rgba(96,165,250,0.25);
    outline: none;
  }
</style>
</head>
<body data-page="39" data-total="60">
<div id="stage">
<main id="main">

  <!-- 两句关键句 -->
  <div class="key-notes">
    <p>跳跃高度由初速度和重力共同决定，是一个曲面，不是单一数字——换一个星球、换一件宇航服，你就在这个曲面上的不同位置。</p>
    <p>宇航服质量会把整个曲面往下压，但压低幅度很小——在低重力星球上，质量增加带来的损失远小于重力降低带来的收益。</p>
  </div>

  <!-- 3D 画布 -->
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="surface3d"></canvas>
    <img class="illus" src="assets/img/p39-astronaut.png" alt="宇航员在低重力星球表面准备跳跃">
    <div class="ax-label x">初速度 v₀ (m/s) →</div>
    <div class="ax-label y">← 跳跃高度 h (m)</div>
    <div class="ax-label z">← 重力加速度 g (m/s²)</div>
  </div>

  <!-- 控件行 -->
  <div class="ctl-row">
    <div class="slider-group">
      <div class="sg-label"><span>初速度 v₀</span><span class="val" id="valV0">2.50 m/s</span></div>
      <input type="range" id="sliderV0" min="0.5" max="4.0" step="0.01" value="2.5">
      <div class="sg-src">Lec.K.HUMAN_JUMP_INITIAL_VELOCITY</div>
    </div>
    <div class="slider-group">
      <div class="sg-label"><span>宇航服质量 m_suit</span><span class="val" id="valMs">130 kg</span></div>
      <input type="range" id="sliderMs" min="0" max="130" step="1" value="130">
      <div class="sg-src">Lec.K.EVA_SUIT_MASS</div>
    </div>
    <div class="slider-group">
      <div class="sg-label"><span>重力加速度 g</span><span class="val" id="valG">9.80 m/s²</span></div>
      <input type="range" id="sliderG" min="0.5" max="10.0" step="0.01" value="9.8">
      <div class="sg-src">Lec.K.EARTH_GRAVITY</div>
    </div>
    <button class="btn-reset" id="btnReset">重置</button>
  </div>

</main>
</div>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/three.min.js"></script>
<script>
/* ============================================================
   page-39 · 三维跳跃空间
   120 秒 · process · canvas-full
   ============================================================ */

(function() {
  /* ---- 底盘初始化 ---- */
  Deck.init({ index: 39, total: 60 });

  /* ---- 页头 ---- */
  Lec.mount({
    index: 39,
    kicker: '第三章 · 脱离地球',
    title: '三维跳跃空间',
    take: '跳跃高度不是单一数字——换一个星球、换一件宇航服，你就在这个曲面上的不同位置'
  });

  /* ---- 常量 ---- */
  var V0_MIN  = 0.5;
  var V0_MAX  = 4.0;
  var G_MIN   = 0.5;
  var G_MAX   = 10.0;
  var MS_MIN  = 0;
  var MS_MAX  = Lec.K.EVA_SUIT_MASS;

  /* ---- 状态 ---- */
  var v0  = Lec.K.HUMAN_JUMP_INITIAL_VELOCITY;
  var g   = Lec.K.EARTH_GRAVITY;
  var ms  = Lec.K.EVA_SUIT_MASS;

  /* ---- DOM 引用 ---- */
  var wrap     = document.getElementById('canvasWrap');
  var cv       = document.getElementById('surface3d');
  var sliderV0 = document.getElementById('sliderV0');
  var sliderMs = document.getElementById('sliderMs');
  var sliderG  = document.getElementById('sliderG');
  var valV0    = document.getElementById('valV0');
  var valMs    = document.getElementById('valMs');
  var valG     = document.getElementById('valG');
  var btnReset = document.getElementById('btnReset');

  /* ---- Three.js 场景 ---- */
  var renderer, scene, camera;
  var surfaceMesh, markerSphere, trailLine;
  var axisGroup;
  var surfaceGeo;

  /* ---- 轨道控制 ---- */
  var theta   = -0.75;   /* 水平角 (rad) */
  var phi     = 0.55;    /* 仰角 (rad) */
  var radius  = 8.5;
  var target  = new THREE.Vector3(0, 1.0, 0);
  var isDragging = false;
  var lastMX = 0, lastMY = 0;

  /* ---- 网格分辨率 ---- */
  var GRID = 50;

  /* ============================================================
     计算函数
     ============================================================ */

  function computeHeight(v0Val, gVal, msVal) {
    var base = Lec.P.jumpHeightFromVelocity(v0Val, gVal);
    var offsetTerm = 0.01 * msVal / Lec.K.EVA_SUIT_MASS;
    var offset = (msVal / Lec.K.ASTRONAUT_MASS) * offsetTerm;
    return base - offset;
  }

  function computeOffset(msVal) {
    var offsetTerm = 0.01 * msVal / Lec.K.EVA_SUIT_MASS;
    return (msVal / Lec.K.ASTRONAUT_MASS) * offsetTerm;
  }

  /* ---- 坐标映射: 数据 → 场景 ---- */
  function v0ToX(v) { return (v - V0_MIN) / (V0_MAX - V0_MIN) * 5.0 - 2.5; }
  function gToZ(gVal) { return (gVal - G_MIN) / (G_MAX - G_MIN) * 5.0 - 2.5; }
  function hToY(hVal) { return hVal * 0.7; }

  /* ============================================================
     构建曲面
     ============================================================ */

  function buildSurfaceGeometry() {
    var geo = new THREE.BufferGeometry();
    var vertices = new Float32Array(GRID * GRID * 3);
    var colors   = new Float32Array(GRID * GRID * 3);
    var indices  = [];

    var offset = computeOffset(ms);

    for (var i = 0; i < GRID; i++) {
      var vVal = V0_MIN + (V0_MAX - V0_MIN) * i / (GRID - 1);
      var x = v0ToX(vVal);
      for (var j = 0; j < GRID; j++) {
        var gVal = G_MIN + (G_MAX - G_MIN) * j / (GRID - 1);
        var z = gToZ(gVal);
        var hVal = computeHeight(vVal, gVal, ms);
        var y = hToY(hVal);

        var idx = (i * GRID + j) * 3;
        vertices[idx]     = x;
        vertices[idx + 1] = y;
        vertices[idx + 2] = z;

        /* 颜色: m_suit 0→蓝, m_suit max→橙 */
        var t = ms / Lec.K.EVA_SUIT_MASS;
        var r = 0.2 + t * 0.8;
        var gCol = 0.4 + t * 0.2;
        var b = 0.8 - t * 0.6;
        colors[idx]     = r;
        colors[idx + 1] = gCol;
        colors[idx + 2] = b;
      }
    }

    /* 索引 */
    for (var i = 0; i < GRID - 1; i++) {
      for (var j = 0; j < GRID - 1; j++) {
        var a = i * GRID + j;
        var b = a + 1;
        var c = a + GRID;
        var d = c + 1;
        indices.push(a, b, d);
        indices.push(a, d, c);
      }
    }

    geo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  }

  function updateSurfaceColors() {
    var colors = surfaceGeo.attributes.color.array;
    var t = ms / Lec.K.EVA_SUIT_MASS;
    for (var i = 0; i < GRID; i++) {
      for (var j = 0; j < GRID; j++) {
        var idx = (i * GRID + j) * 3;
        colors[idx]     = 0.2 + t * 0.8;
        colors[idx + 1] = 0.4 + t * 0.2;
        colors[idx + 2] = 0.8 - t * 0.6;
      }
    }
    surfaceGeo.attributes.color.needsUpdate = true;
  }

  function updateSurfacePositions() {
    var pos = surfaceGeo.attributes.position.array;
    var offset = computeOffset(ms);
    for (var i = 0; i < GRID; i++) {
      var vVal = V0_MIN + (V0_MAX - V0_MIN) * i / (GRID - 1);
      for (var j = 0; j < GRID; j++) {
        var gVal = G_MIN + (G_MAX - G_MIN) * j / (GRID - 1);
        var hVal = computeHeight(vVal, gVal, ms);
        var idx = (i * GRID + j) * 3 + 1;
        pos[idx] = hToY(hVal);
      }
    }
    surfaceGeo.attributes.position.needsUpdate = true;
    surfaceGeo.computeVertexNormals();
  }

  /* ============================================================
     构建轴线
     ============================================================ */

  function makeAxisLine(from, to, colorHex) {
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
      from.x, from.y, from.z, to.x, to.y, to.z
    ]), 3));
    var mat = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 1, transparent: true, opacity: 0.7 });
    return new THREE.Line(geo, mat);
  }

  function makeTickMark(x, y, z, dx, dy, dz, colorHex) {
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
      x, y, z, x + dx, y + dy, z + dz
    ]), 3));
    var mat = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 1, transparent: true, opacity: 0.5 });
    return new THREE.Line(geo, mat);
  }

  function buildAxes() {
    var grp = new THREE.Group();
    var xLen = 2.8, zLen = 2.8, yLen = 3.0;
    var dim = 0x667788;

    /* 三根主轴 */
    grp.add(makeAxisLine(new THREE.Vector3(-xLen, 0, -zLen), new THREE.Vector3(xLen, 0, -zLen), dim));
    grp.add(makeAxisLine(new THREE.Vector3(-xLen, 0, -zLen), new THREE.Vector3(-xLen, yLen, -zLen), dim));
    grp.add(makeAxisLine(new THREE.Vector3(-xLen, 0, -zLen), new THREE.Vector3(-xLen, 0, zLen), dim));

    /* X 轴刻度 (v₀) */
    var tickLen = 0.12;
    for (var v = 0.5; v <= 4.05; v += 0.5) {
      var x = v0ToX(v);
      grp.add(makeTickMark(x, 0, -zLen, 0, -tickLen, 0, dim));
      grp.add(makeTickMark(x, 0, -zLen, 0, 0, tickLen * 0.6, dim));
    }

    /* Z 轴刻度 (g) */
    for (var gVal = 1; gVal <= 10.05; gVal += 1) {
      var z = gToZ(gVal);
      grp.add(makeTickMark(-xLen, 0, z, -tickLen, 0, 0, dim));
      grp.add(makeTickMark(-xLen, 0, z, tickLen * 0.6, 0, 0, dim));
    }

    /* Y 轴刻度 */
    for (var h = 0; h <= 5.05; h += 1) {
      var y = hToY(h);
      grp.add(makeTickMark(-xLen, y, -zLen, -tickLen, 0, 0, dim));
      grp.add(makeTickMark(-xLen, y, -zLen, 0, 0, tickLen * 0.6, dim));
    }

    return grp;
  }

  /* ============================================================
     构建标记球与轨迹线
     ============================================================ */

  function buildMarker() {
    var geo = new THREE.SphereGeometry(0.12, 32, 16);
    var mat = new THREE.MeshPhongMaterial({ color: 0xff3344, emissive: 0x661111, emissiveIntensity: 0.6 });
    var sphere = new THREE.Mesh(geo, mat);
    sphere.renderOrder = 1;
    sphere.material.depthTest = true;
    sphere.material.depthWrite = true;
    return sphere;
  }

  function updateMarker() {
    var hVal = computeHeight(v0, g, ms);
    markerSphere.position.set(v0ToX(v0), hToY(hVal), gToZ(g));
  }

  function buildTrailLine() {
    var geo = new THREE.BufferGeometry();
    var N = 200;
    var positions = new Float32Array(N * 3);
    for (var k = 0; k < N; k++) {
      positions[k * 3] = 0;
      positions[k * 3 + 1] = 0;
      positions[k * 3 + 2] = 0;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setDrawRange(0, 0);
    var mat = new THREE.LineBasicMaterial({ color: 0xffcc44, linewidth: 1.5, transparent: true, opacity: 0.85 });
    var line = new THREE.Line(geo, mat);
    line.renderOrder = 0;
    return line;
  }

  /* 更新 v₀ 方向的轨迹线: 固定 g 和 m_suit, 沿 v₀ 变化 */
  function updateTrailV0() {
    var N = 200;
    var pos = trailLine.geometry.attributes.position.array;
    for (var k = 0; k < N; k++) {
      var vVal = V0_MIN + (V0_MAX - V0_MIN) * k / (N - 1);
      var hVal = computeHeight(vVal, g, ms);
      pos[k * 3]     = v0ToX(vVal);
      pos[k * 3 + 1] = hToY(hVal);
      pos[k * 3 + 2] = gToZ(g);
    }
    trailLine.geometry.attributes.position.needsUpdate = true;
    trailLine.geometry.setDrawRange(0, N);
  }

  /* 更新 g 方向的轨迹线: 固定 v₀ 和 m_suit, 沿 g 变化 */
  function updateTrailG() {
    var N = 200;
    var pos = trailLine.geometry.attributes.position.array;
    for (var k = 0; k < N; k++) {
      var gVal = G_MIN + (G_MAX - G_MIN) * k / (N - 1);
      var hVal = computeHeight(v0, gVal, ms);
      pos[k * 3]     = v0ToX(v0);
      pos[k * 3 + 1] = hToY(hVal);
      pos[k * 3 + 2] = gToZ(gVal);
    }
    trailLine.geometry.attributes.position.needsUpdate = true;
    trailLine.geometry.setDrawRange(0, N);
  }

  /* ============================================================
     场景初始化
     ============================================================ */

  function initScene() {
    /* 渲染器 */
    renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = false;
    renderer.setClearColor(0x080d14);

    /* 场景 */
    scene = new THREE.Scene();

    /* 相机 */
    camera = new THREE.PerspectiveCamera(45, 1, 0.1, 50);

    /* 光照 */
    var amb = new THREE.AmbientLight(0x334466, 1.2);
    scene.add(amb);
    var dir = new THREE.DirectionalLight(0xffffff, 1.8);
    dir.position.set(3, 6, 4);
    scene.add(dir);
    var dir2 = new THREE.DirectionalLight(0x8899cc, 0.6);
    dir2.position.set(-2, 1, -3);
    scene.add(dir2);

    /* 曲面 */
    surfaceGeo = buildSurfaceGeometry();
    var surfaceMat = new THREE.MeshPhongMaterial({
      vertexColors: true,
      side: THREE.DoubleSide,
      shininess: 20,
      specular: 0x111111,
      transparent: true,
      opacity: 0.88
    });
    surfaceMesh = new THREE.Mesh(surfaceGeo, surfaceMat);
    scene.add(surfaceMesh);

    /* 轴线 */
    axisGroup = buildAxes();
    scene.add(axisGroup);

    /* 标记球 */
    markerSphere = buildMarker();
    scene.add(markerSphere);
    updateMarker();

    /* 轨迹线 */
    trailLine = buildTrailLine();
    scene.add(trailLine);
    updateTrailV0();

    /* 更新相机 */
    updateCamera();
    resize();
  }

  function updateCamera() {
    var sp = Math.sin(phi);
    var cp = Math.cos(phi);
    var st = Math.sin(theta);
    var ct = Math.cos(theta);
    camera.position.set(
      target.x + radius * cp * st,
      target.y + radius * sp,
      target.z + radius * cp * ct
    );
    camera.lookAt(target);
  }

  function resize() {
    var rect = wrap.getBoundingClientRect();
    var w = rect.width;
    var h = rect.height;
    if (w <= 0 || h <= 0) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(h, 1);
    camera.updateProjectionMatrix();
  }

  /* ============================================================
     轨道控制
     ============================================================ */

  cv.addEventListener('pointerdown', function(e) {
    if (e.button !== 0) return;
    isDragging = true;
    lastMX = e.clientX;
    lastMY = e.clientY;
    cv.setPointerCapture(e.pointerId);
  });

  window.addEventListener('pointermove', function(e) {
    if (!isDragging) return;
    var dx = e.clientX - lastMX;
    var dy = e.clientY - lastMY;
    lastMX = e.clientX;
    lastMY = e.clientY;

    theta += dx * 0.005;
    phi   -= dy * 0.005;
    phi    = Math.max(-1.4, Math.min(1.4, phi));

    updateCamera();
  });

  window.addEventListener('pointerup', function(e) {
    isDragging = false;
  });

  cv.addEventListener('wheel', function(e) {
    e.preventDefault();
    radius += e.deltaY * 0.01;
    radius = Math.max(3.5, Math.min(18, radius));
    updateCamera();
  }, { passive: false });

  /* 触摸双指缩放 */
  var lastPinchDist = 0;
  cv.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2) {
      lastPinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, { passive: true });
  cv.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2) {
      var d = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      if (lastPinchDist > 0) {
        radius -= (d - lastPinchDist) * 0.02;
        radius = Math.max(3.5, Math.min(18, radius));
        updateCamera();
      }
      lastPinchDist = d;
    }
  }, { passive: true });

  /* ============================================================
     滑块事件
     ============================================================ */

  var lastDragged = null; /* 'v0' | 'g' | 'ms' */

  function onV0Change() {
    v0 = parseFloat(sliderV0.value);
    valV0.textContent = v0.toFixed(2) + ' m/s';
    lastDragged = 'v0';
    updateSurfacePositions();
    updateMarker();
    updateTrailV0();
  }

  function onGChange() {
    g = parseFloat(sliderG.value);
    valG.textContent = g.toFixed(2) + ' m/s²';
    lastDragged = 'g';
    updateSurfacePositions();
    updateMarker();
    updateTrailG();
  }

  function onMsChange() {
    ms = parseInt(sliderMs.value, 10);
    valMs.textContent = ms + ' kg';
    lastDragged = 'ms';
    updateSurfacePositions();
    updateSurfaceColors();
    updateMarker();
    /* 轨迹线跟随 */
    if (lastDragged === 'v0' || lastDragged === null) updateTrailV0();
    else updateTrailG();
  }

  sliderV0.addEventListener('input', onV0Change);
  sliderG.addEventListener('input', onGChange);
  sliderMs.addEventListener('input', onMsChange);

  /* 键盘可达 */
  sliderV0.addEventListener('change', onV0Change);
  sliderG.addEventListener('change', onGChange);
  sliderMs.addEventListener('change', onMsChange);

  function resetAll() {
    v0 = Lec.K.HUMAN_JUMP_INITIAL_VELOCITY;
    g  = Lec.K.EARTH_GRAVITY;
    ms = Lec.K.EVA_SUIT_MASS;

    sliderV0.value = v0;
    sliderG.value  = g;
    sliderMs.value = ms;

    valV0.textContent = v0.toFixed(2) + ' m/s';
    valG.textContent  = g.toFixed(2) + ' m/s²';
    valMs.textContent = ms + ' kg';

    theta  = -0.75;
    phi    = 0.55;
    radius = 8.5;

    lastDragged = null;
    updateSurfacePositions();
    updateSurfaceColors();
    updateMarker();
    updateTrailV0();
    updateCamera();
  }

  btnReset.addEventListener('click', resetAll);

  /* ============================================================
     响应式 & 动画循环
     ============================================================ */

  window.addEventListener('resize', function() {
    resize();
  });

  /* 使用 Deck.loop 驱动渲染 */
  Deck.loop(function() {
    renderer.render(scene, camera);
  });

  /* 初始设置 */
  initScene();
  resize();

  /* 如果 reduced motion, 不做额外处理 —— 场景已是静态的, 只响应用户拖拽 */

})();
</script>
</body>
</html>
