<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第 40 页 · 互动讲义</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <script src="assets/lib/echarts.min.js"></script>
  <style>
    /* 页面专属样式 */
    #main {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: var(--sp-8);
      height: 100%;
    }

    .left-panel {
      width: 340px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
    }

    .right-panel {
      flex: 1 1 0%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
    }

    #chart-wrap {
      width: 100%;
      height: 470px;
      overflow: hidden;
      position: relative;
    }

    #chart-box {
      width: 100%;
      height: 100%;
    }

    .ref-card {
      background: var(--surface-raised);
      border: 1px solid var(--border-strong);
      border-radius: var(--r-md);
      padding: var(--sp-6);
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
    }

    .ref-card .ref-title {
      font-size: var(--fs-h2);
      font-weight: 600;
      color: var(--text);
    }

    .ref-card .ref-row {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: baseline;
      font-size: var(--fs-body);
      color: var(--text-sec);
    }

    .ref-card .ref-val {
      font-size: var(--fs-lead);
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .ref-card .ref-note {
      font-size: var(--fs-sec);
      color: var(--text-dim);
      line-height: 1.45;
      margin-top: var(--sp-2);
    }

    .insight-box {
      background: var(--surface);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
      padding: var(--sp-4) var(--sp-5);
      font-size: var(--fs-body);
      color: var(--text);
      line-height: 1.45;
      font-weight: 500;
    }

    .preset-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: var(--sp-2);
      flex-wrap: wrap;
    }

    .preset-btn {
      font-family: inherit;
      font-size: var(--fs-tick);
      color: var(--text-dim);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 3px 10px;
      cursor: pointer;
      transition: all 150ms var(--ease);
      white-space: nowrap;
      line-height: 1.3;
    }

    .preset-btn:hover {
      color: var(--text);
      border-color: var(--accent-soft);
      background: var(--surface-raised);
    }

    .preset-btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .preset-btn.active {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(77,166,255,0.12);
    }

    .slider-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: var(--sp-3);
    }

    .slider-row input[type="range"] {
      flex: 1 1 0%;
      min-width: 0;
      accent-color: var(--accent);
      height: 6px;
    }

    .slider-val {
      font-size: var(--fs-body);
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      min-width: 110px;
      text-align: right;
      white-space: nowrap;
    }

    .slider-label {
      font-size: var(--fs-label);
      color: var(--text-dim);
      white-space: nowrap;
      flex-shrink: 0;
    }
  </style>
</head>
<body data-page="40" data-total="60">
  <div id="stage">
    <main id="main"></main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    (function() {
      // ── 底盘初始化 ──
      Deck.init({ index: 40, total: 60 });

      // ── 页眉页脚 ──
      Lec.mount({
        index: 40,
        kicker: '脱离地球',
        title: '简化跳跃公式',
        sub: 'h₂ = (g₁ / g₂) · h₁',
        take: '重力减半，高度翻倍——同一具身体在新世界的直接翻译',
        foot: '假设身体质量不变，跳跃初速度不变。'
      });

      // ── 常量 ──
      var g1 = Lec.K.EARTH_GRAVITY;
      var h1 = Lec.K.HUMAN_VERTICAL_JUMP_EARTH;
      var CERES_GRAVITY = 0.27;

      // ── 预设星球 ──
      var presets = [
        { name: '谷神星', g: CERES_GRAVITY },
        { name: '月球',   g: Lec.K.MOON_GRAVITY },
        { name: '火星',   g: Lec.K.MARS_GRAVITY },
        { name: '地球',   g: Lec.K.EARTH_GRAVITY },
        { name: '木星',   g: Lec.K.JUPITER_GRAVITY }
      ];

      // ── 构建 DOM ──
      var main = document.getElementById('main');

      // 左侧面板
      var leftPanel = document.createElement('div');
      leftPanel.className = 'left-panel';

      var refCard = document.createElement('div');
      refCard.className = 'ref-card';

      var refTitle = document.createElement('div');
      refTitle.className = 'ref-title';
      refTitle.textContent = '地球参照点';
      refCard.appendChild(refTitle);

      var row1 = document.createElement('div');
      row1.className = 'ref-row';
      row1.innerHTML = '<span>重力加速度 g₁</span><span class="ref-val">' + Deck.fmt(g1, 1) + ' m/s²</span>';
      refCard.appendChild(row1);

      var row2 = document.createElement('div');
      row2.className = 'ref-row';
      row2.innerHTML = '<span>典型跳跃高度 h₁</span><span class="ref-val">' + Deck.fmt(h1, 2) + ' m</span>';
      refCard.appendChild(row2);

      var refNote = document.createElement('div');
      refNote.className = 'ref-note';
      refNote.textContent = '在地球上，一个典型成年人垂直跳跃约 ' + Deck.fmt(h1, 1) + ' 米。以此为基准，推算其他重力环境下的跳跃高度。';
      refCard.appendChild(refNote);

      leftPanel.appendChild(refCard);

      var insight = document.createElement('div');
      insight.className = 'insight-box';
      insight.textContent = '如果身体质量不变，跳跃高度与重力加速度成反比。';
      leftPanel.appendChild(insight);

      main.appendChild(leftPanel);

      // 右侧面板
      var rightPanel = document.createElement('div');
      rightPanel.className = 'right-panel';

      var chartWrap = document.createElement('div');
      chartWrap.id = 'chart-wrap';
      
      var chartBox = document.createElement('div');
      chartBox.id = 'chart-box';
      chartWrap.appendChild(chartBox);
      rightPanel.appendChild(chartWrap);

      // 预设按钮行
      var presetRow = document.createElement('div');
      presetRow.className = 'preset-row';
      presets.forEach(function(p) {
        var btn = document.createElement('button');
        btn.className = 'preset-btn';
        btn.textContent = p.name + ' ' + p.g;
        btn.setAttribute('data-g', p.g);
        btn.addEventListener('click', function() {
          setGravity(p.g);
        });
        presetRow.appendChild(btn);
      });
      rightPanel.appendChild(presetRow);

      // 滑块行
      var sliderRow = document.createElement('div');
      sliderRow.className = 'slider-row';

      var slLabel = document.createElement('span');
      slLabel.className = 'slider-label';
      slLabel.textContent = '目标重力 g₂';
      sliderRow.appendChild(slLabel);

      var slider = document.createElement('input');
      slider.type = 'range';
      slider.min = '0.05';
      slider.max = '25';
      slider.step = '0.01';
      slider.value = String(g1);
      slider.setAttribute('aria-label', '目标星球重力加速度');
      sliderRow.appendChild(slider);

      var slVal = document.createElement('span');
      slVal.className = 'slider-val';
      sliderRow.appendChild(slVal);

      rightPanel.appendChild(sliderRow);

      main.appendChild(rightPanel);

      // ── echarts ──
      var chartDom = document.getElementById('chart-box');
      var chart = echarts.init(chartDom, null, { renderer: 'canvas' });

      function curveData() {
        var pts = [];
        for (var g = 0.05; g <= 25; g += 0.05) {
          pts.push([+g.toFixed(2), Lec.P.transferJumpHeight(h1, g1, g)]);
        }
        return pts;
      }

      function presetMarkData() {
        return presets.map(function(p, i) {
          var h = Lec.P.transferJumpHeight(h1, g1, p.g);
          var pos = (i % 2 === 0) ? 'top' : 'bottom';
          return {
            value: [p.g, h],
            symbol: 'circle',
            symbolSize: p.name === '地球' ? 11 : 8,
            itemStyle: {
              color: p.name === '地球' ? '#ffffff' : '#ffb832',
              borderColor: '#0b1119',
              borderWidth: 1
            },
            label: {
              show: true,
              position: pos,
              distance: 8,
              fontSize: 14,
              color: p.name === '地球' ? '#ffffff' : '#a0b0c0',
              fontWeight: p.name === '地球' ? 600 : 400,
              formatter: p.name + '\n' + Deck.fmt(h, 2) + ' m'
            }
          };
        });
      }

      function buildOption(curG) {
        var curH = Lec.P.transferJumpHeight(h1, g1, curG);
        return {
          textStyle: {
            fontSize: 16,
            fontFamily: 'Inter, Segoe UI, system-ui, sans-serif'
          },
          grid: {
            left: 72,
            right: 32,
            top: 52,
            bottom: 48
          },
          xAxis: {
            name: '目标重力加速度 g₂  (m/s²)',
            nameTextStyle: { fontSize: 14, color: '#a0b0c0' },
            nameLocation: 'center',
            nameGap: 32,
            min: 0,
            max: 25,
            interval: 5,
            axisLine: { lineStyle: { color: '#334455' } },
            axisTick: { show: true, lineStyle: { color: '#334455' } },
            axisLabel: { fontSize: 13, color: '#8899aa' },
            splitLine: { show: false }
          },
          yAxis: {
            name: '跳跃高度 h₂  (m)',
            nameTextStyle: { fontSize: 14, color: '#a0b0c0' },
            nameLocation: 'center',
            nameGap: 48,
            min: 0,
            max: 40,
            axisLine: { lineStyle: { color: '#334455' } },
            axisTick: { show: true, lineStyle: { color: '#334455' } },
            axisLabel: { fontSize: 13, color: '#8899aa' },
            splitLine: { lineStyle: { color: '#1a2a3a', type: 'dashed' } }
          },
          series: [
            {
              type: 'line',
              data: curveData(),
              symbol: 'none',
              lineStyle: { color: '#4da6ff', width: 2.5 },
              z: 1
            },
            {
              type: 'scatter',
              data: [[curG, curH]],
              symbolSize: 14,
              itemStyle: { color: '#ffffff', borderColor: '#4da6ff', borderWidth: 3 },
              z: 10,
              label: {
                show: true,
                position: 'right',
                fontSize: 14,
                color: '#ffffff',
                fontWeight: 600,
                formatter: '当前 · ' + Deck.fmt(curH, 2) + ' m',
                distance: 10
              }
            },
            {
              type: 'scatter',
              data: presetMarkData(),
              symbolSize: 9,
              z: 5
            }
          ]
        };
      }

      // 初始渲染
      var currentG = g1;
      chart.setOption(buildOption(currentG));

      // 更新 slider 数值显示
      function updateSliderVal(g) {
        var h = Lec.P.transferJumpHeight(h1, g1, g);
        slVal.textContent = 'h₂ = ' + Deck.fmt(h, 2) + ' m';
        // 更新预设按钮高亮
        var btns = presetRow.querySelectorAll('.preset-btn');
        btns.forEach(function(b) {
          var bg = parseFloat(b.getAttribute('data-g'));
          if (Math.abs(bg - g) < 0.02) {
            b.classList.add('active');
          } else {
            b.classList.remove('active');
          }
        });
      }
      updateSliderVal(currentG);

      // 设置重力值
      function setGravity(g) {
        g = Math.max(0.05, Math.min(25, g));
        currentG = g;
        slider.value = String(Math.round(g * 100) / 100);
        updateSliderVal(g);
        chart.setOption(buildOption(g));
      }

      // 滑块事件
      slider.addEventListener('input', function() {
        var g = parseFloat(this.value);
        setGravity(g);
      });

      // 窗口 resize
      window.addEventListener('resize', function() {
        chart.resize();
      });

      // 动效偏好
      if (Deck.reduced && Deck.reduced()) {
        // 无动画，静态即可
      }

      // 暴露 resize 给底盘
      Deck.onResize = function() {
        chart.resize();
      };
    })();
  </script>
</body>
</html>
