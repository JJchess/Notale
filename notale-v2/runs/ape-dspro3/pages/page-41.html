<body data-page="41" data-total="60">
<div id="stage">
<main id="main">

  <div class="claims-wrap">
    <p class="claim-lead">离开地球后，跳跃能力不再只有一个答案——每一颗星球都是一个新的重力实验室。</p>
    <p class="claim-sec">我们已经有了计算工具：公式、初速度、重力加速度，现在只需要把星球一个个代进去。</p>
  </div>

  <div class="globe-stage">
    <canvas id="globe-cv"></canvas>
  </div>

  <div class="enum-wrap">
    <div class="k-enumeration">
      <div class="it"><span><strong>月球</strong> — 无大气，重力仅地球的六分之一，跳跃会是什么感觉？</span></div>
      <div class="it"><span><strong>火星</strong> — 重力约地球的三分之一，穿着宇航服能跳多高？</span></div>
      <div class="it"><span><strong>小行星</strong> — 质量极小，一跳会不会再也回不来？</span></div>
      <div class="it"><span><strong>木星</strong> — 气态巨行星，脚下没有固体表面，但我们仍可计算</span></div>
    </div>
  </div>

</main>
</div>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  'use strict';

  /* ---- 页眉 ---- */
  Lec.mount({
    index: 41,
    kicker: 'CHAPTER 4',
    title: '星际跳跃',
    take: '在其他星球上，我们能跳多高？'
  });

  /* ---- 线框星球画布 ---- */
  const cv = document.getElementById('globe-cv');
  const ctx = Deck.fit(cv);
  let angle = 0;

  /* 四颗星球在球面上的位置 (θ=经度, φ=纬度, 0=北极) */
  const DOTS = [
    { theta: 0.5,  phi: 0.75 },  /* 月球 – 右上方 */
    { theta: 2.0,  phi: 1.35 },  /* 火星 – 左中 */
    { theta: 3.7,  phi: 2.05 },  /* 小行星 – 左下 */
    { theta: 5.3,  phi: 1.05 },  /* 木星 – 右下 */
  ];

  function draw() {
    const w = cv.width;
    const h = cv.height;
    const cx = w / 2;
    const cy = h / 2;
    const R  = Math.min(w, h) * 0.42;

    ctx.clearRect(0, 0, w, h);

    /* 微弱的径向底色 */
    {
      const g = ctx.createRadialGradient(cx, cy, R * 0.25, cx, cy, R * 1.35);
      g.addColorStop(0, 'rgba(17,26,38,0.35)');
      g.addColorStop(1, 'rgba(11,17,25,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }

    /* 纬线 —— 横向椭圆 */
    const latAngles = [0.12, 0.30, 0.48, 0.66, 0.84, 1.02, 1.20, 1.38, 1.56, 1.74, 1.92, 2.10, 2.28, 2.46, 2.64, 2.82, 3.02];
    ctx.lineWidth = 0.5;
    for (const phi of latAngles) {
      const yOff = R * Math.cos(phi);
      const rx   = R * Math.sin(phi);
      if (rx < 1) continue;
      const ry   = rx * 0.28;
      ctx.beginPath();
      ctx.ellipse(cx, cy + yOff, rx, ry, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.07)';
      ctx.stroke();
    }

    /* 经线 —— 纵向弧 */
    const lonCount = 18;
    const steps    = 80;
    ctx.lineWidth = 0.5;
    for (let i = 0; i < lonCount; i++) {
      const theta = (i / lonCount) * Math.PI * 2 + angle;
      ctx.beginPath();
      for (let j = 0; j <= steps; j++) {
        const phi = (j / steps) * Math.PI;
        const x = cx + R * Math.sin(phi) * Math.cos(theta);
        const y = cy + R * Math.cos(phi);
        if (j === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.stroke();
    }

    /* 外轮廓圆 */
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();

    /* 四颗星球的光点 */
    for (const p of DOTS) {
      const t    = p.theta + angle;
      const cosT = Math.cos(t);
      const x    = cx + R * Math.sin(p.phi) * cosT;
      const y    = cy + R * Math.cos(p.phi);

      if (cosT > -0.12) {
        const alpha = Math.min(1, (cosT + 0.12) / 0.55);

        /* 光晕 */
        const glow = ctx.createRadialGradient(x, y, 0, x, y, 10);
        glow.addColorStop(0,    'rgba(77,166,255,' + (0.65 * alpha).toFixed(2) + ')');
        glow.addColorStop(0.35, 'rgba(77,166,255,' + (0.25 * alpha).toFixed(2) + ')');
        glow.addColorStop(1,    'rgba(77,166,255,0)');
        ctx.beginPath();
        ctx.arc(x, y, 10, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();

        /* 核心亮点 */
        ctx.beginPath();
        ctx.arc(x, y, 2.2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,' + (0.88 * alpha).toFixed(2) + ')';
        ctx.fill();
      }
    }
  }

  /* 首帧 */
  draw();

  /* 动画循环 —— 尊重 reduced-motion */
  Deck.loop(function() {
    if (!Deck.reduced()) {
      angle += 0.004;
    }
    draw();
  });

})();
</script>
</body>
</html>
