<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 42 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ---- 本页专属 ---- */
  #main {
    display: flex;
    flex-direction: row;
    gap: var(--sp-8);
    height: 100%;
  }

  .p42-left {
    flex: 0 0 42%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--sp-5);
    padding-top: var(--sp-2);
  }

  .p42-right {
    flex: 1 1 0%;
    min-width: 0;
    position: relative;
    border-radius: var(--r-md);
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  /* ---- 滑块叠在 k-process 轴线上 ---- */
  .p42-slider-zone {
    position: relative;
    height: 52px;
    flex-shrink: 0;
  }
  /* 滑块轨道: 叠在轴线位置 */
  .p42-track {
    position: absolute;
    top: 9px;
    left: 0;
    right: 0;
    height: 28px;
    cursor: pointer;
  }
  .p42-track-bar {
    position: absolute;
    top: 12px;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
  }
  .p42-track-fill {
    position: absolute;
    top: 12px;
    left: 0;
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
    pointer-events: none;
  }
  .p42-thumb {
    position: absolute;
    top: 4px;
    width: 20px;
    height: 20px;
    background: var(--accent);
    border: 2px solid #fff;
    border-radius: 50%;
    cursor: grab;
    transform: translateX(-50%);
    box-shadow: 0 0 10px rgba(77,166,255,0.5);
    z-index: 2;
    transition: box-shadow 200ms var(--ease);
  }
  .p42-thumb:active { cursor: grabbing; box-shadow: 0 0 18px rgba(77,166,255,0.9); }
  .p42-thumb:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }

  /* 预设站点标记点 */
  .p42-dot {
    position: absolute;
    top: 11px;
    width: 6px;
    height: 6px;
    background: var(--text-dim);
    border-radius: 50%;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 1;
  }
  .p42-dot.on { background: var(--accent); box-shadow: 0 0 5px rgba(77,166,255,0.5); }

  /* ---- 数据面板 ---- */
  .p42-data {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: var(--sp-3);
    flex-shrink: 0;
  }
  .p42-datum {
    flex: 1 1 0%;
    min-width: 90px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: var(--sp-3) var(--sp-4);
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .p42-datum .lbl {
    font-size: var(--fs-label);
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }
  .p42-datum .val {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .p42-datum .val small {
    font-size: var(--fs-label);
    font-weight: 400;
    color: var(--text-sec);
  }
  .p42-datum.hi {
    border-color: var(--accent-soft);
  }
  .p42-datum.hi .val { color: var(--accent); }

  /* ---- 关键句 ---- */
  .p42-key {
    font-size: var(--fs-sec);
    color: var(--text-sec);
    line-height: 1.5;
    padding: var(--sp-2) var(--sp-4);
    border-left: 3px solid var(--accent-soft);
    flex-shrink: 0;
  }

  /* ---- echarts 容器 ---- */
  .p42-chart {
    flex: 1 1 0%;
    min-height: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
  }

  /* ---- 右栏 ---- */
  .p42-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.16;
    transition: opacity 600ms var(--ease);
    pointer-events: none;
  }
  .p42-cv {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .p42-tag {
    position: absolute;
    top: var(--sp-4);
    right: var(--sp-5);
    font-size: var(--fs-h2);
    font-weight: 700;
    color: var(--text);
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    z-index: 3;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .p42-thumb { transition: none; }
  }
</style>
</head>
<body data-page="42" data-total="60">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script>
/* ================================================================
   page-42 · 星际跳跃选择器 · 130 秒
   拖拽星球选择器，看跳跃高度实时变化。
   ================================================================ */

Deck.init({ index: 42, total: 60 });

(function() {
  var K = Lec.K;
  var P = Lec.P;
  var v0 = K.HUMAN_JUMP_INITIAL_VELOCITY;

  /* Ceres 重力不在 Lec.K 中, 按规格: 0.27 m/s² */
  var CERES_G = 0.27;

  var PLANETS = [
    { id:'earth',   name:'地球',   g:K.EARTH_GRAVITY,   img:'https://images-assets.nasa.gov/image/GSFC_20171208_Archive_e001282/GSFC_20171208_Archive_e001282~small.jpg',  credit:'NASA GSFC' },
    { id:'moon',    name:'月球',   g:K.MOON_GRAVITY,    img:'https://images-assets.nasa.gov/image/as11-37-5545/as11-37-5545~medium.jpg',    credit:'NASA Apollo 11' },
    { id:'mars',    name:'火星',   g:K.MARS_GRAVITY,    img:'https://images-assets.nasa.gov/image/PIA14838/PIA14838~medium.jpg',            credit:'NASA/JPL' },
    { id:'ceres',   name:'谷神星', g:CERES_G,           img:'https://images-assets.nasa.gov/image/PIA21906/PIA21906~medium.jpg',            credit:'NASA Dawn' },
    { id:'jupiter', name:'木星',   g:K.JUPITER_GRAVITY, img:'https://images-assets.nasa.gov/image/PIA25016/PIA25016~medium.jpg',            credit:'NASA Juno' }
  ];

  /* 对数映射: 0.01 ~ 24.79 */
  var LOG_MIN = Math.log10(0.01);
  var LOG_MAX = Math.log10(K.JUPITER_GRAVITY);
  var LOG_SPAN = LOG_MAX - LOG_MIN;
  function g2f(g) { return (Math.log10(Math.max(0.01,g)) - LOG_MIN) / LOG_SPAN; }
  function f2g(f) { return Math.pow(10, LOG_MIN + f * LOG_SPAN); }

  var PRESETS = PLANETS.map(function(p) { return { name:p.name, id:p.id, g:p.g, frac:g2f(p.g) }; });

  /* ---- 构建 DOM ---- */
  var main = document.getElementById('main');

  /* == 左栏 == */
  var left = document.createElement('div'); left.className = 'p42-left';

  /* -- k-process 骨架 -- */
  var kproc = document.createElement('div'); kproc.className = 'k-process';

  /* 轴: 高度撑到 52px 容纳滑块,背景透明,2px 线由子元素绘制 */
  var axis = document.createElement('div'); axis.className = 'axis';
  axis.style.height = '52px';
  axis.style.background = 'transparent';
  axis.style.marginBottom = '0';
  axis.style.display = 'flex';
  axis.style.alignItems = 'center';

  /* 2px 参考线 */
  var refLine = document.createElement('div');
  refLine.style.cssText = 'position:absolute;left:0;right:0;top:25px;height:2px;background:var(--border);border-radius:1px;pointer-events:none;';
  axis.appendChild(refLine);

  /* 滑块叠层 */
  var zone = document.createElement('div'); zone.className = 'p42-slider-zone';
  zone.style.cssText = 'position:absolute;top:0;left:0;right:0;';

  var track = document.createElement('div'); track.className = 'p42-track';
  track.style.top = '12px';
  var trackBar = document.createElement('div'); trackBar.className = 'p42-track-bar';
  trackBar.style.top = '12px';
  track.appendChild(trackBar);

  var fill = document.createElement('div'); fill.className = 'p42-track-fill';
  fill.style.top = '12px';
  track.appendChild(fill);

  /* 预设点标记 */
  var dots = [];
  PRESETS.forEach(function(ps) {
    var d = document.createElement('div'); d.className = 'p42-dot';
    d.style.left = (ps.frac * 100) + '%';
    d.style.top = '11px';
    track.appendChild(d); dots.push(d);
  });

  var thumb = document.createElement('div'); thumb.className = 'p42-thumb';
  thumb.style.top = '4px';
  thumb.setAttribute('tabindex','0');
  thumb.setAttribute('role','slider');
  thumb.setAttribute('aria-label','星球重力选择器');
  track.appendChild(thumb);

  zone.appendChild(track);
  axis.appendChild(zone);
  kproc.appendChild(axis);

  /* 步骤条 */
  var stepsRow = document.createElement('div'); stepsRow.className = 'steps';
  var LABELS = ['地球','月球','火星','谷神星','木星','小行星'];
  var stepEls = [];
  LABELS.forEach(function(lbl, i) {
    if (i > 0) { var arw = document.createElement('div'); arw.className = 'arw'; arw.textContent = '→'; stepsRow.appendChild(arw); }
    var st = document.createElement('div'); st.className = 'step'; st.textContent = lbl;
    stepsRow.appendChild(st); stepEls.push(st);
  });
  kproc.appendChild(stepsRow);
  left.appendChild(kproc);

  /* -- 数据面板 -- */
  var dp = document.createElement('div'); dp.className = 'p42-data';
  function mkDatum(label, id, hi) {
    var d = document.createElement('div'); d.className = 'p42-datum' + (hi?' hi':'');
    var lb = document.createElement('div'); lb.className = 'lbl'; lb.textContent = label;
    var vl = document.createElement('div'); vl.className = 'val'; vl.id = id;
    d.appendChild(lb); d.appendChild(vl); return d;
  }
  dp.appendChild(mkDatum('重力加速度','p42-grav'));
  dp.appendChild(mkDatum('跳跃高度','p42-height', true));
  dp.appendChild(mkDatum('空中停留','p42-time'));
  left.appendChild(dp);

  /* -- 关键句 -- */
  var kn = document.createElement('div'); kn.className = 'p42-key';
  kn.textContent = '重力加速度每减小一半，同一初速度下的跳跃高度就翻倍——月球上跳得比地球上高六倍。';
  left.appendChild(kn);

  /* -- echarts 柱状图 -- */
  var chartDiv = document.createElement('div'); chartDiv.className = 'p42-chart'; chartDiv.id = 'p42-chart';
  left.appendChild(chartDiv);

  main.appendChild(left);

  /* == 右栏 == */
  var right = document.createElement('div'); right.className = 'p42-right';
  var bgImg = document.createElement('img'); bgImg.className = 'p42-bg'; bgImg.id = 'p42-bg'; bgImg.alt = '';
  right.appendChild(bgImg);
  var tag = document.createElement('div'); tag.className = 'p42-tag'; tag.id = 'p42-tag';
  right.appendChild(tag);
  var cv = document.createElement('canvas'); cv.className = 'p42-cv'; cv.id = 'p42-cv';
  right.appendChild(cv);
  main.appendChild(right);

  /* ---- Lec.mount ---- */
  Lec.mount({
    index: 42,
    kicker: '星际跳跃',
    title: '星际跳跃选择器',
    take: '在其他星球上，同一具身体能跳多高，只取决于你站在哪颗星球上。',
    foot: '照片来源: NASA (公有领域)'
  });

  /* ================================================================
     echarts 对比柱状图
     ================================================================ */
  var myChart = echarts.init(document.getElementById('p42-chart'), null, { renderer: 'svg' });

  function chartOption(activeIdx) {
    var names = PLANETS.map(function(p){return p.name;});
    var heights = PLANETS.map(function(p){return P.jumpHeightFromVelocity(v0, p.g);});
    var maxH = Math.max.apply(null, heights);
    return {
      textStyle: { fontSize: 14, fontFamily: 'Inter,sans-serif', color: '#a0b0c0' },
      grid: { left: 8, right: 18, top: 10, bottom: 6, containLabel: true },
      xAxis: {
        type: 'value', name: 'm',
        nameTextStyle: { fontSize: 14, color: '#8899aa' },
        axisLabel: { fontSize: 14, color: '#8899aa' },
        axisLine: { lineStyle: { color: '#243040' } },
        splitLine: { lineStyle: { color: '#243040' } },
        max: Math.ceil(maxH / 5) * 5 || 5
      },
      yAxis: {
        type: 'category', data: names,
        axisLabel: { fontSize: 14, color: '#a0b0c0' },
        axisLine: { lineStyle: { color: '#243040' } },
        axisTick: { show: false }
      },
      series: [{
        type: 'bar',
        data: heights.map(function(h,i){
          return {
            value: +h.toFixed(2),
            itemStyle: { color: i === activeIdx ? '#4da6ff' : '#243040', borderRadius: [0,3,3,0] }
          };
        }),
        barWidth: 16,
        label: {
          show: true, position: 'right', fontSize: 14, color: '#a0b0c0',
          formatter: function(p){ return p.value.toFixed(2) + ' m'; }
        },
        emphasis: { disabled: true }
      }]
    };
  }
  myChart.setOption(chartOption(0));

  /* ================================================================
     Matter.js 物理 + Canvas 渲染
     ================================================================ */
  var Engine = Matter.Engine, Bodies = Matter.Bodies, Body = Matter.Body, Composite = Matter.Composite;
  var engine = Engine.create();
  engine.gravity.y = K.EARTH_GRAVITY;

  /* 世界: 宽 840, 高 620。地面在 y=580, 跳跃者在 y=550 */
  var WORLD_W = 840, WORLD_H = 620;
  var GND_Y = 580;
  var ground = Bodies.rectangle(WORLD_W/2, GND_Y + 20, WORLD_W + 40, 40, { isStatic: true, friction: 0.8 });
  var jumper = Bodies.rectangle(WORLD_W/2, GND_Y - 25, 28, 48, { friction: 0.3, restitution: 0 });
  Composite.add(engine.world, [ground, jumper]);

  var ctx = Deck.fit(cv);
  var cw = cv.__w || 840;
  var ch = cv.__h || 620;

  var jumpState = 'ready'; /* ready | flying | landed */
  var lastVy = 0;
  var jumpTimer = null;

  function doJump() {
    engine.gravity.y = currentGravity;
    Body.setPosition(jumper, { x: WORLD_W/2, y: GND_Y - 24 });
    Body.setVelocity(jumper, { x: 0, y: -v0 });
    jumpState = 'flying';
    lastVy = -v0;
  }

  function drawStickFigure(cx, jy) {
    /* jy: Matter.js y 坐标, 0=top。映射到 canvas 逻辑坐标 */
    var sy = (jy / WORLD_H) * ch;
    var s = Math.min(1.15, Math.max(0.55, ch / 620));

    /* 头 */
    ctx.beginPath();
    ctx.arc(cx, sy - 28 * s, 8 * s, 0, Math.PI*2);
    ctx.fillStyle = '#e6edf5';
    ctx.fill();

    /* 身体 */
    ctx.beginPath();
    ctx.moveTo(cx, sy - 20 * s);
    ctx.lineTo(cx, sy + 10 * s);
    ctx.strokeStyle = '#e6edf5';
    ctx.lineWidth = 2.5 * s;
    ctx.lineCap = 'round';
    ctx.stroke();

    /* 手臂 */
    ctx.beginPath();
    ctx.moveTo(cx - 12 * s, sy - 13 * s);
    ctx.lineTo(cx, sy - 6 * s);
    ctx.lineTo(cx + 12 * s, sy - 13 * s);
    ctx.strokeStyle = '#e6edf5';
    ctx.lineWidth = 2 * s;
    ctx.lineCap = 'round';
    ctx.stroke();

    /* 腿 */
    ctx.beginPath();
    ctx.moveTo(cx, sy + 10 * s);
    ctx.lineTo(cx - 9 * s, sy + 30 * s);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, sy + 10 * s);
    ctx.lineTo(cx + 9 * s, sy + 30 * s);
    ctx.stroke();
  }

  function drawScene() {
    ctx.clearRect(0, 0, cw, ch);

    /* 地面 */
    var gy = (GND_Y / WORLD_H) * ch;
    ctx.beginPath();
    ctx.moveTo(0, gy);
    ctx.lineTo(cw, gy);
    ctx.strokeStyle = '#445566';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#111a26';
    ctx.fillRect(0, gy, cw, ch - gy);

    /* 人物 */
    var jy = jumper.position.y;
    drawStickFigure(cw / 2, jy);

    /* 高度指示线 */
    if (jumpState === 'flying') {
      var topY = (jy / WORLD_H) * ch;
      if (topY < gy - 8) {
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(cw / 2 + 50, gy);
        ctx.lineTo(cw / 2 + 50, topY);
        ctx.strokeStyle = 'rgba(77,166,255,0.45)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.setLineDash([]);

        var hM = P.jumpHeightFromVelocity(v0, currentGravity);
        ctx.fillStyle = 'rgba(77,166,255,0.8)';
        ctx.font = '14px Inter, sans-serif';
        ctx.fillText(hM.toFixed(2) + ' m', cw / 2 + 54, topY + (gy - topY) / 2 + 4);
      }
    }
  }

  function updateJump() {
    if (jumpState !== 'flying') return;
    var vy = jumper.velocity.y;

    /* 检测落地: 速度方向改变且接近地面 */
    if (vy > 0 && lastVy <= 0) {
      /* 刚过顶点, 继续下落 */
    }

    if (vy > 0 && jumper.position.y >= GND_Y - 24 && Math.abs(vy) < 2) {
      jumpState = 'landed';
      Body.setPosition(jumper, { x: WORLD_W/2, y: GND_Y - 24 });
      Body.setVelocity(jumper, { x: 0, y: 0 });

      if (jumpTimer) clearTimeout(jumpTimer);
      jumpTimer = setTimeout(function() {
        if (jumpState === 'landed') doJump();
      }, 500);
    }

    lastVy = vy;
  }

  /* 立即起跳,然后进入循环 */
  doJump();

  Deck.loop(function() {
    Engine.update(engine, 1000 / 60);
    updateJump();
    drawScene();
  }, { still: 0.4 }); /* reduced-motion 下停在跳跃中途 */

  /* ================================================================
     滑块交互
     ================================================================ */
  var currentGravity = K.EARTH_GRAVITY;
  var currentFrac = g2f(currentGravity);
  var dragging = false;

  function snapTo(frac) {
    var TH = 0.028;
    for (var i = 0; i < PRESETS.length; i++) {
      if (Math.abs(frac - PRESETS[i].frac) < TH) {
        return { frac: PRESETS[i].frac, pi: i, isPreset: true };
      }
    }
    return { frac: frac, pi: -1, isPreset: false };
  }

  function updateUI(frac) {
    thumb.style.left = (frac * 100) + '%';
    fill.style.width = (frac * 100) + '%';
    dots.forEach(function(d,i){ d.classList.toggle('on', Math.abs(frac - PRESETS[i].frac) < 0.02); });

    var snapped = snapTo(frac);
    stepEls.forEach(function(s){ s.classList.remove('current','done'); });
    if (snapped.isPreset) {
      for (var i = 0; i < snapped.pi; i++) stepEls[i].classList.add('done');
      stepEls[snapped.pi].classList.add('current');
    } else {
      for (var i = 0; i < 5; i++) stepEls[i].classList.add('done');
      stepEls[5].classList.add('current');
    }
    return snapped;
  }

  function applyPlanet(g, snapped) {
    currentGravity = g;
    currentFrac = g2f(g);

    var h = P.jumpHeightFromVelocity(v0, g);
    var tFlight = (2 * v0) / g;

    document.getElementById('p42-grav').innerHTML = g.toFixed(2) + ' <small>m/s²</small>';
    document.getElementById('p42-height').innerHTML = h.toFixed(2) + ' <small>m</small>';
    document.getElementById('p42-time').innerHTML = tFlight.toFixed(2) + ' <small>s</small>';

    var bg = document.getElementById('p42-bg');
    var tg = document.getElementById('p42-tag');
    if (snapped.isPreset && snapped.pi < PLANETS.length) {
      var p = PLANETS[snapped.pi];
      bg.src = p.img;
      bg.title = '照片: ' + p.credit + ' — 公有领域';
      tg.textContent = p.name;
    } else {
      bg.src = '';
      bg.removeAttribute('title');
      tg.textContent = '小行星  ' + g.toFixed(2) + ' m/s²';
    }

    myChart.setOption(chartOption(snapped.isPreset ? snapped.pi : -1));

    if (jumpTimer) clearTimeout(jumpTimer);
    doJump();

    thumb.setAttribute('aria-valuenow', g.toFixed(2));
  }

  function pointerMove(clientX) {
    var r = track.getBoundingClientRect();
    var frac = (clientX - r.left) / r.width;
    frac = Math.max(0, Math.min(1, frac));
    var snapped = updateUI(frac);
    applyPlanet(f2g(snapped.frac), snapped);
  }

  track.addEventListener('mousedown', function(e) {
    e.preventDefault();
    dragging = true;
    pointerMove(e.clientX);
  });
  thumb.addEventListener('mousedown', function(e) {
    e.preventDefault();
    dragging = true;
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    pointerMove(e.clientX);
  });
  document.addEventListener('mouseup', function() { dragging = false; });

  track.addEventListener('touchstart', function(e) {
    e.preventDefault();
    dragging = true;
    pointerMove(e.touches[0].clientX);
  });
  thumb.addEventListener('touchstart', function(e) { e.preventDefault(); dragging = true; });
  document.addEventListener('touchmove', function(e) {
    if (!dragging) return;
    pointerMove(e.touches[0].clientX);
  });
  document.addEventListener('touchend', function() { dragging = false; });

  thumb.addEventListener('keydown', function(e) {
    var step = 0;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') step = 0.025;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') step = -0.025;
    else return;
    e.preventDefault();
    var nf = Math.max(0, Math.min(1, currentFrac + step));
    var snapped = updateUI(nf);
    applyPlanet(f2g(snapped.frac), snapped);
  });

  /* 点击步骤标签快速跳转 */
  stepEls.forEach(function(el, i) {
    el.style.cursor = 'pointer';
    el.addEventListener('click', function() {
      if (i < 5) {
        var ps = PRESETS[i];
        updateUI(ps.frac);
        applyPlanet(ps.g, { pi: i, isPreset: true, frac: ps.frac });
      } else {
        var f6 = g2f(0.08);
        var s6 = snapTo(f6);
        updateUI(s6.frac);
        applyPlanet(f2g(s6.frac), s6);
      }
    });
  });

  /* ---- 初始化 ---- */
  updateUI(currentFrac);
  applyPlanet(K.EARTH_GRAVITY, { pi: 0, isPreset: true, frac: currentFrac });

  /* ---- resize ---- */
  window.addEventListener('resize', function() {
    ctx = Deck.fit(cv);
    if (ctx) { cw = cv.__w || 840; ch = cv.__h || 620; }
    myChart.resize();
  });

})();
</script>
</body>
</html>
