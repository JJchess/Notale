<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第 43 页 · 互动讲义</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* ledger 表格头 */
    .ledger-hdr {
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: var(--sp-3) var(--sp-5);
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--text-sec);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 2px solid var(--border-strong);
      margin-bottom: var(--sp-2);
    }
    .ledger-hdr > span { flex-shrink: 0; }
    .lh-name  { width: 130px; }
    .lh-grav  { width: 140px; text-align: right; }
    .lh-h     { width: 140px; text-align: right; }
    .lh-t     { width: 140px; text-align: right; }

    /* ledger 行 */
    .ledger-it {
      cursor: pointer;
      transition: background 200ms var(--ease), border-color 200ms var(--ease);
      user-select: none;
    }
    .ledger-it:hover {
      background: var(--surface-raised) !important;
      border-color: var(--border-strong) !important;
    }
    .ledger-it:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: -2px;
    }
    .ledger-it.sel {
      background: var(--surface-raised) !important;
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 1px var(--accent), 0 0 12px rgba(77,166,255,0.15);
    }

    /* 行内列 */
    .it-name { width: 130px; flex-shrink: 0; font-weight: 600; color: var(--text); }
    .it-grav { width: 140px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: var(--fs-sec); }
    .it-h    { width: 140px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: var(--fs-sec); }
    .it-t    { width: 140px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: var(--fs-sec); color: var(--accent); font-weight: 600; }
    .it-unit { font-size: var(--fs-label); color: var(--text-dim); font-weight: 400; margin-left: 2px; }

    /* 右侧面板 */
    .right-panel {
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
      flex: 0 0 380px;
      min-width: 0;
    }
    #parabola-chart {
      width: 100%;
      height: 300px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
    }
    .chart-stats {
      display: flex;
      flex-direction: row;
      gap: var(--sp-6);
      justify-content: center;
      padding: var(--sp-2) 0;
    }
    .chart-stat {
      text-align: center;
    }
    .chart-stat .cs-val {
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--accent);
      font-family: var(--font-mono);
      line-height: 1.2;
    }
    .chart-stat .cs-lbl {
      font-size: var(--fs-label);
      color: var(--text-dim);
      margin-top: 2px;
    }
    .photo-wrap {
      position: relative;
      width: 100%;
      height: 160px;
      border-radius: var(--r-md);
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-wrap .photo-cap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 6px 10px;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      font-size: var(--fs-label);
      color: var(--text-dim);
      line-height: 1.4;
    }

    /* ISS 提示 */
    .iss-note {
      font-size: var(--fs-label);
      color: var(--text-dim);
      font-style: italic;
      padding: var(--sp-2) var(--sp-5);
    }

    /* 隐藏默认的 k-enumeration 的 bullet */
    .k-enumeration.ledger > .it::before {
      content: none;
    }
    .k-enumeration.ledger > .it {
      padding: var(--sp-3) var(--sp-5);
    }
  </style>
</head>
<body data-page="43" data-total="60">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(function() {
  /* ================================================================
     Init
     ================================================================ */
  Deck.init({ index: 43, total: 60 });

  /* ---- planet definitions ---- */
  var planets = [
    { key: 'earth',  name: '🌍 地球',   g: Lec.K.EARTH_GRAVITY },
    { key: 'moon',   name: '🌙 月球',   g: Lec.K.MOON_GRAVITY },
    { key: 'mars',   name: '🔴 火星',   g: Lec.K.MARS_GRAVITY },
    { key: 'venus',  name: '🟠 金星',   g: Lec.K.VENUS_GRAVITY },
    { key: 'jupiter',name: '🟤 木星',   g: Lec.K.JUPITER_GRAVITY },
    { key: 'pluto',  name: '⭕ 冥王星', g: Lec.K.PLUTO_GRAVITY }
  ];

  /* ---- compute all data from Lec ---- */
  var fromHeight  = Lec.K.HUMAN_VERTICAL_JUMP_EARTH;
  var fromGravity = Lec.K.EARTH_GRAVITY;
  var v0 = Lec.P.initialVelocityForJumpHeight(fromHeight, fromGravity);

  planets.forEach(function(p) {
    p.height = Lec.P.transferJumpHeight(fromHeight, fromGravity, p.g);
    p.flightTime = 2 * v0 / p.g;
  });

  /* ---- compute moon flight time for the take ---- */
  var moonData = planets[1];
  var moonTime = moonData.flightTime;
  var earthTime = planets[0].flightTime;
  var ratio = (moonTime / earthTime).toFixed(1);

  /* ---- mount header ---- */
  Lec.mount({
    index: 43,
    kicker: 'STAR-HOPPING',
    title: '在低重力星球上，你可以在空中停留多久？',
    take: '在月球上，一次普通跳跃的飞行时间约 ' + moonTime.toFixed(1) + ' 秒，是地球的 ' + ratio + ' 倍。重力越小，你在空中的"决定时间"越多。'
  });

  /* ================================================================
     Build DOM
     ================================================================ */
  var main = document.getElementById('main');

  /* root row */
  var row = document.createElement('div');
  row.className = 'row gap-8 items-start';
  row.style.height = '100%';

  /* ---- left panel (table) ---- */
  var left = document.createElement('div');
  left.className = 'col grow';
  left.style.minWidth = '0';
  left.style.overflowY = 'auto';

  /* header row */
  var hdr = document.createElement('div');
  hdr.className = 'ledger-hdr';
  hdr.innerHTML = '<span class="lh-name">星球</span>' +
    '<span class="lh-grav">重力 (m/s²)</span>' +
    '<span class="lh-h">跳跃高度 (m)</span>' +
    '<span class="lh-t">飞行时间 (s)</span>';
  left.appendChild(hdr);

  /* enumeration list */
  var list = document.createElement('div');
  list.className = 'k-enumeration ledger';
  list.setAttribute('role', 'listbox');
  list.setAttribute('aria-label', '星球列表');

  planets.forEach(function(p, idx) {
    var it = document.createElement('div');
    it.className = 'it ledger-it';
    it.setAttribute('role', 'option');
    it.setAttribute('tabindex', '0');
    it.setAttribute('data-planet', p.key);
    it.setAttribute('aria-selected', 'false');

    it.innerHTML =
      '<span class="it-name">' + p.name + '</span>' +
      '<span class="it-grav">' + p.g.toFixed(2) + '<span class="it-unit"> m/s²</span></span>' +
      '<span class="it-h">'   + p.height.toFixed(2) + '<span class="it-unit"> m</span></span>' +
      '<span class="it-t">'   + p.flightTime.toFixed(2) + '<span class="it-unit"> s</span></span>';

    list.appendChild(it);
  });

  left.appendChild(list);

  /* ISS note */
  var issNote = document.createElement('div');
  issNote.className = 'iss-note';
  issNote.textContent = '※ ISS（微重力环境下）无法正常跳跃，不列入比较。';
  left.appendChild(issNote);

  row.appendChild(left);

  /* ---- right panel ---- */
  var right = document.createElement('div');
  right.className = 'right-panel';

  /* chart container */
  var chartDiv = document.createElement('div');
  chartDiv.id = 'parabola-chart';
  right.appendChild(chartDiv);

  /* chart stats (flight time + max height) */
  var statsDiv = document.createElement('div');
  statsDiv.className = 'chart-stats';
  statsDiv.innerHTML =
    '<div class="chart-stat"><div class="cs-val" id="stat-time">--</div><div class="cs-lbl">飞行时间</div></div>' +
    '<div class="chart-stat"><div class="cs-val" id="stat-height">--</div><div class="cs-lbl">跳跃高度</div></div>';
  right.appendChild(statsDiv);

  /* photo */
  var photoWrap = document.createElement('div');
  photoWrap.className = 'photo-wrap';
  var img = document.createElement('img');
  img.src = 'https://images-assets.nasa.gov/image/as16-113-18339/as16-113-18339~large.jpg';
  img.alt = 'Apollo 16 宇航员 John Young 在月球表面跳跃敬礼';
  img.title = 'Apollo 16 astronaut John Young leaps from lunar surface to salute flag, April 1972. Credit: NASA / Charles M. Duke Jr.';
  img.loading = 'lazy';

  var cap = document.createElement('div');
  cap.className = 'photo-cap';
  cap.textContent = 'Apollo 16 · John Young 月面跳跃敬礼';

  photoWrap.appendChild(img);
  photoWrap.appendChild(cap);
  right.appendChild(photoWrap);

  row.appendChild(right);
  main.appendChild(row);

  /* ================================================================
     ECharts
     ================================================================ */
  var chart = echarts.init(chartDiv, null, { renderer: 'svg' });

  function parabolaData(g) {
    var tFlight = 2 * v0 / g;
    var n = 60;
    var pts = [];
    for (var i = 0; i <= n; i++) {
      var t = (i / n) * tFlight;
      var h = v0 * t - 0.5 * g * t * t;
      if (h < 0) h = 0;
      pts.push([Number(t.toFixed(3)), Number(h.toFixed(3))]);
    }
    return { pts: pts, tFlight: tFlight, maxH: v0 * v0 / (2 * g) };
  }

  function updateChart(g) {
    var pd = parabolaData(g);

    var option = {
      textStyle: { fontSize: 16 },
      grid: { left: 56, right: 28, top: 24, bottom: 40 },
      xAxis: {
        type: 'value',
        name: '时间 (s)',
        nameLocation: 'middle',
        nameGap: 26,
        nameTextStyle: { fontSize: 16, color: '#a0b0c0' },
        axisLabel: { fontSize: 14, color: '#8899aa' },
        axisLine: { lineStyle: { color: '#334455' } },
        splitLine: { lineStyle: { color: '#243040' } },
        min: 0,
        max: Math.ceil(pd.tFlight * 1.08 * 10) / 10
      },
      yAxis: {
        type: 'value',
        name: '高度 (m)',
        nameTextStyle: { fontSize: 16, color: '#a0b0c0' },
        axisLabel: { fontSize: 14, color: '#8899aa' },
        axisLine: { lineStyle: { color: '#334455' } },
        splitLine: { lineStyle: { color: '#243040' } },
        min: 0,
        max: Math.ceil(pd.maxH * 1.12 * 10) / 10
      },
      series: [{
        type: 'line',
        data: pd.pts,
        smooth: true,
        showSymbol: false,
        lineStyle: { color: '#60a5fa', width: 2.5 },
        areaStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: 'rgba(96,165,250,0.25)' },
            { offset: 1, color: 'rgba(96,165,250,0.02)' }
          ])
        }
      }]
    };

    chart.setOption(option, true);

    /* update stats below chart */
    document.getElementById('stat-time').textContent = pd.tFlight.toFixed(2) + ' s';
    document.getElementById('stat-height').textContent = pd.maxH.toFixed(2) + ' m';
  }

  /* ================================================================
     Interaction
     ================================================================ */
  var items = list.querySelectorAll('.it');

  function selectPlanet(key) {
    var planet = planets.find(function(p) { return p.key === key; });
    if (!planet) return;

    items.forEach(function(it) {
      var pk = it.getAttribute('data-planet');
      if (pk === key) {
        it.classList.add('sel');
        it.setAttribute('aria-selected', 'true');
      } else {
        it.classList.remove('sel');
        it.setAttribute('aria-selected', 'false');
      }
    });

    updateChart(planet.g);
  }

  /* initial selection */
  selectPlanet('moon');

  list.addEventListener('click', function(e) {
    var it = e.target.closest('.ledger-it');
    if (!it) return;
    var key = it.getAttribute('data-planet');
    if (key) selectPlanet(key);
  });

  list.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      var it = e.target.closest('.ledger-it');
      if (!it) return;
      var key = it.getAttribute('data-planet');
      if (key) selectPlanet(key);
    }
  });

  /* ================================================================
     Resize
     ================================================================ */
  window.addEventListener('resize', function() {
    chart.resize();
  });

})();
</script>
</body>
</html>
