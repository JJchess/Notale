<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 44 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ---- page-specific layout ---- */
  #main {
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
    height: 100%;
  }

  .main-row {
    display: flex;
    flex-direction: row;
    gap: var(--sp-6);
    flex: 1 1 0%;
    min-height: 0;
  }

  .left-col {
    flex: 3 3 0%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }

  .right-col {
    flex: 2 2 0%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }

  /* ---- k-process step tweaks ---- */
  .k-process .step {
    position: relative;
  }
  .k-process .step.done {
    opacity: 0.45;
    color: var(--text-dim);
  }
  .k-process .step.warn {
    opacity: 1;
    color: var(--warn);
  }
  .k-process .step.warn::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    background: var(--warn);
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(245,158,11,0.5);
  }
  .k-process .step.esc {
    opacity: 1;
    color: var(--err);
  }
  .k-process .step.esc::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    background: var(--err);
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(248,113,113,0.5);
  }

  /* ---- slider ---- */
  .mass-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 10px;
    border-radius: 5px;
    background: linear-gradient(to right,
      #f87171 0%,
      #f87171 46.75%,
      #f59e0b 46.75%,
      #f59e0b 61.5%,
      #4da6ff 61.5%,
      #4da6ff 100%);
    outline: none;
    cursor: pointer;
  }
  .mass-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--text);
    border: 2px solid var(--accent);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
  }
  .mass-slider::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--text);
    border: 2px solid var(--accent);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
  }

  .slider-labels {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    font-size: var(--fs-label);
    color: var(--text-dim);
    margin-top: 2px;
  }
  .slider-labels span:nth-child(1) { color: var(--err); }
  .slider-labels span:nth-child(2) { color: var(--warn); }
  .slider-labels span:nth-child(3) { color: var(--accent); }

  /* ---- data grid ---- */
  .data-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--sp-3) var(--sp-6);
  }
  .data-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .data-item .data-label {
    font-size: var(--fs-label);
    color: var(--text-dim);
  }
  .data-item .data-val {
    font-size: var(--fs-h2);
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .data-val.blue  { color: var(--accent); }
  .data-val.yellow { color: var(--warn); }
  .data-val.red   { color: var(--err); }

  /* ---- echarts container ---- */
  #echarts-container {
    flex: 1 1 0%;
    min-height: 180px;
    min-width: 0;
  }

  /* ---- simulation ---- */
  .sim-panel {
    flex: 1 1 0%;
    min-height: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    overflow: hidden;
    position: relative;
  }
  .sim-panel canvas {
    display: block;
    width: 450px;
    height: 350px;
    max-width: 100%;
  }
  .sim-zone-badge {
    position: absolute;
    top: var(--sp-3);
    right: var(--sp-3);
    font-size: var(--fs-label);
    font-weight: 600;
    padding: 2px 10px;
    border-radius: var(--r-sm);
    pointer-events: none;
  }
  .sim-zone-badge.safe  { background: rgba(77,166,255,0.2); color: var(--accent); }
  .sim-zone-badge.crit  { background: rgba(245,158,11,0.2); color: var(--warn); }
  .sim-zone-badge.escape { background: rgba(248,113,113,0.2); color: var(--err); }

  /* ---- jump button ---- */
  .btn-jump {
    font-family: inherit;
    font-size: var(--fs-body);
    font-weight: 600;
    padding: var(--sp-2) var(--sp-8);
    border-radius: var(--r-sm);
    border: 2px solid var(--accent);
    background: var(--surface-raised);
    color: var(--accent);
    cursor: pointer;
    outline: none;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
    align-self: center;
  }
  .btn-jump:hover {
    background: var(--accent);
    color: var(--bg);
  }
  .btn-jump:focus-visible {
    box-shadow: 0 0 0 3px rgba(96,165,250,0.35);
  }
  .btn-jump:active {
    transform: scale(0.97);
  }
</style>
</head>
<body data-page="44" data-total="60">
<div id="stage">
<main id="main">

  <!-- ====== k-process: causal chain ====== -->
  <div class="k-process">
    <div class="axis"></div>
    <div class="steps" id="ksteps">
      <div class="step" data-step="0">天体质量小</div>
      <div class="arw">→</div>
      <div class="step" data-step="1">表面重力小</div>
      <div class="arw">→</div>
      <div class="step" data-step="2">逃逸速度低</div>
      <div class="arw">→</div>
      <div class="step" data-step="3">一跳逃逸</div>
    </div>
  </div>

  <!-- ====== main interaction row ====== -->
  <div class="row gap-6 grow">

    <!-- ====== left column: controls + data + chart ====== -->
    <div class="col gap-3 grow">

      <!-- slider -->
      <div class="ctl" style="flex-direction:column;align-items:stretch;">
        <div style="display:flex;flex-direction:row;justify-content:space-between;align-items:baseline;">
          <span style="font-weight:600;">小行星质量</span>
          <span id="mass-display" style="font-variant-numeric:tabular-nums;color:var(--text);"></span>
        </div>
        <input type="range" id="mass-slider" class="mass-slider" min="12" max="16" step="0.01" value="14.95">
        <div class="slider-labels">
          <span>逃逸区</span>
          <span>临界区</span>
          <span>安全区</span>
        </div>
      </div>

      <!-- data panel -->
      <div class="panel">
        <div class="data-grid">
          <div class="data-item">
            <span class="data-label">半径</span>
            <span class="data-val" id="val-radius">—</span>
          </div>
          <div class="data-item">
            <span class="data-label">表面重力</span>
            <span class="data-val" id="val-gravity">—</span>
          </div>
          <div class="data-item">
            <span class="data-label">逃逸速度</span>
            <span class="data-val" id="val-vesc">—</span>
          </div>
          <div class="data-item">
            <span class="data-label">人类跳跃初速度</span>
            <span class="data-val blue" id="val-vjump">—</span>
          </div>
        </div>
      </div>

      <!-- echarts vertical bar -->
      <div id="echarts-container"></div>

      <!-- note -->
      <div class="note">
        逃逸速度只取决于天体的质量和半径，与你跳得多高无关——只要你跳得够快。
      </div>
    </div>

    <!-- ====== right column: simulation ====== -->
    <div class="col gap-3 grow">

      <div class="sim-panel panel--raised" id="sim-panel">
        <canvas id="sim-canvas"></canvas>
        <div class="sim-zone-badge safe" id="zone-badge">安全区</div>
      </div>

      <button class="btn-jump" id="btn-jump">跳！</button>

      <div class="note" style="text-align:center;">
        <span id="zone-note">当前逃逸速度远高于跳跃初速度，跳起后正常落回。</span>
      </div>
    </div>

  </div>

</main>
</div>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script>
(function () {
  'use strict';

  // ============================================================
  // 0. Mount & Init
  // ============================================================
  Lec.mount({
    index: 44,
    kicker: '第 4 章 · 星际跳跃',
    title: '跳一跳就回不来了',
    take: '在小行星上，你跳一下就可能达到逃逸速度，再也回不来。',
    foot: '地球逃逸速度 11.2 km/s — 人类永远跳不出去；但半径不到 800 米的小行星，逃逸速度就可能低于你的跳跃初速度。'
  });
  Deck.init({ index: 44, total: 60 });

  // ============================================================
  // 1. Physical constants (from Lec.K where available)
  // ============================================================
  var G                = 6.67430e-11;          // gravitational constant m³/(kg·s²)
  var ASTEROID_DENSITY = 2000;                 // kg/m³ (typical rocky asteroid)
  var HUMAN_VJUMP      = Lec.K.HUMAN_JUMP_INITIAL_VELOCITY; // ~3.13 m/s

  // ---- Derived zone thresholds (relative to human jump velocity) ----
  var VESC_SAFE_THRESH    = HUMAN_VJUMP * 1.1;  // ~3.44 m/s
  var VESC_ESCAPE_THRESH  = HUMAN_VJUMP * 0.7;  // ~2.19 m/s

  // ============================================================
  // 2. Physics functions (not in Lec.P — implemented locally)
  // ============================================================
  function sphericalBodyRadiusFromMass(mass, density) {
    // r = (3M / (4πρ))^(1/3)
    return Math.pow((3 * mass) / (4 * Math.PI * density), 1 / 3);
  }

  function surfaceGravity(mass, radius) {
    // g = GM / r²
    return G * mass / (radius * radius);
  }

  function escapeVelocity(mass, radius) {
    // v_esc = √(2GM / r)
    return Math.sqrt(2 * G * mass / radius);
  }

  // ============================================================
  // 3. State
  // ============================================================
  var logMass = 14.95;  // log10(mass), default gives v_esc ≈ 5.0 m/s
  var mass, radius, surfGrav, vEsc;
  var zone = 'safe';    // 'safe' | 'critical' | 'escape'

  function recalc() {
    mass     = Math.pow(10, logMass);
    radius   = sphericalBodyRadiusFromMass(mass, ASTEROID_DENSITY);
    surfGrav = surfaceGravity(mass, radius);
    vEsc     = escapeVelocity(mass, radius);

    if (vEsc > VESC_SAFE_THRESH) {
      zone = 'safe';
    } else if (vEsc > VESC_ESCAPE_THRESH) {
      zone = 'critical';
    } else {
      zone = 'escape';
    }
  }
  recalc();

  // ============================================================
  // 4. DOM refs
  // ============================================================
  var slider     = document.getElementById('mass-slider');
  var massDisp   = document.getElementById('mass-display');
  var valRadius  = document.getElementById('val-radius');
  var valGravity = document.getElementById('val-gravity');
  var valVesc    = document.getElementById('val-vesc');
  var valVjump   = document.getElementById('val-vjump');
  var zoneBadge  = document.getElementById('zone-badge');
  var zoneNote   = document.getElementById('zone-note');
  var btnJump    = document.getElementById('btn-jump');
  var ksteps     = document.getElementById('ksteps');

  // ============================================================
  // 5. Format helpers
  // ============================================================
  function fmtSci(val, decimals) {
    if (val === 0) return '0';
    var exp = Math.floor(Math.log10(val));
    var mantissa = val / Math.pow(10, exp);
    return mantissa.toFixed(decimals) + ' × 10<sup>' + exp + '</sup>';
  }

  function fmtNum(val, decimals) {
    if (Math.abs(val) < 0.01 && val !== 0) return val.toExponential(decimals);
    return val.toFixed(decimals);
  }

  function fmtRadius(r) {
    if (r >= 1000) return (r / 1000).toFixed(2) + ' km';
    return r.toFixed(0) + ' m';
  }

  // ============================================================
  // 6. Update UI
  // ============================================================
  function updateUI() {
    // Mass display
    massDisp.innerHTML = fmtSci(mass, 2) + ' kg';

    // Data panel
    valRadius.innerHTML  = fmtRadius(radius);
    valGravity.innerHTML = fmtNum(surfGrav, 4) + ' m/s²';
    valVesc.innerHTML    = fmtNum(vEsc, 2) + ' m/s';
    valVjump.innerHTML   = fmtNum(HUMAN_VJUMP, 2) + ' m/s';

    // Color v_esc based on zone
    valVesc.className = 'data-val';
    if (zone === 'safe')      valVesc.classList.add('blue');
    else if (zone === 'critical') valVesc.classList.add('yellow');
    else                      valVesc.classList.add('red');

    // Zone badge
    zoneBadge.className = 'sim-zone-badge';
    if (zone === 'safe') {
      zoneBadge.classList.add('safe');
      zoneBadge.textContent = '安全区';
    } else if (zone === 'critical') {
      zoneBadge.classList.add('crit');
      zoneBadge.textContent = '临界区';
    } else {
      zoneBadge.classList.add('escape');
      zoneBadge.textContent = '逃逸区';
    }

    // Zone note
    if (zone === 'safe') {
      zoneNote.textContent = '当前逃逸速度远高于跳跃初速度，跳起后正常落回。';
    } else if (zone === 'critical') {
      zoneNote.textContent = '逃逸速度接近跳跃初速度，跳起后升得极高、缓慢落回。';
    } else {
      zoneNote.textContent = '逃逸速度低于跳跃初速度！跳起后不再落回，将永远飘走。';
    }

    // k-process steps
    var steps = ksteps.querySelectorAll('.step');
    steps.forEach(function (s) { s.className = 'step'; });
    if (zone === 'safe') {
      // All steps "done" — the chain exists but escape isn't happening
      steps[0].classList.add('done');
      steps[1].classList.add('done');
      steps[2].classList.add('done');
      steps[3].classList.add('done');
    } else if (zone === 'critical') {
      steps[0].classList.add('done');
      steps[1].classList.add('done');
      steps[2].classList.add('done');
      steps[3].classList.add('warn');
    } else {
      steps[0].classList.add('done');
      steps[1].classList.add('done');
      steps[2].classList.add('done');
      steps[3].classList.add('esc');
    }

    // Update echarts
    updateChart();

    // Update matterjs gravity
    updateSimGravity();
  }

  // ============================================================
  // 7. Echarts
  // ============================================================
  var echartsDom = document.getElementById('echarts-container');
  var chart;

  function getZoneColor() {
    if (zone === 'safe')      return '#4da6ff';
    if (zone === 'critical')  return '#f59e0b';
    return '#f87171';
  }

  function initChart() {
    chart = echarts.init(echartsDom, null, { renderer: 'svg' });

    var option = {
      textStyle: { fontSize: 16 },
      grid: { left: 70, right: 50, top: 20, bottom: 40 },
      xAxis: {
        type: 'category',
        data: ['逃逸速度'],
        axisLabel: { fontSize: 15, color: '#a0b0c0' },
        axisLine: { lineStyle: { color: '#334455' } }
      },
      yAxis: {
        type: 'value',
        min: 0,
        max: 12,
        name: 'm/s',
        nameTextStyle: { fontSize: 15, color: '#8899aa' },
        axisLabel: { fontSize: 15, color: '#8899aa' },
        splitLine: { lineStyle: { color: '#243040' } }
      },
      series: [{
        type: 'bar',
        barWidth: 80,
        data: [{
          value: vEsc,
          itemStyle: {
            color: getZoneColor(),
            borderRadius: [4, 4, 0, 0]
          }
        }],
        label: {
          show: true,
          position: 'top',
          fontSize: 16,
          fontWeight: 600,
          color: getZoneColor(),
          formatter: function (p) { return p.value.toFixed(2) + ' m/s'; }
        },
        markLine: {
          silent: true,
          symbol: 'none',
          lineStyle: { type: 'dashed', color: '#f59e0b', width: 2 },
          label: {
            fontSize: 15,
            color: '#f59e0b',
            formatter: '人类跳跃\n' + HUMAN_VJUMP.toFixed(1) + ' m/s'
          },
          data: [{ yAxis: HUMAN_VJUMP }]
        }
      }]
    };

    chart.setOption(option);
  }

  function updateChart() {
    if (!chart) return;
    chart.setOption({
      series: [{
        data: [{
          value: vEsc,
          itemStyle: {
            color: getZoneColor(),
            borderRadius: [4, 4, 0, 0]
          }
        }],
        label: {
          color: getZoneColor(),
          formatter: function (p) { return p.value.toFixed(2) + ' m/s'; }
        }
      }]
    });
  }

  // ============================================================
  // 8. Matter.js simulation
  // ============================================================
  var simPanel  = document.getElementById('sim-panel');
  var simCanvas = document.getElementById('sim-canvas');

  var Engine   = Matter.Engine;
  var Render   = Matter.Render;
  var Runner   = Matter.Runner;
  var Bodies   = Matter.Bodies;
  var Body     = Matter.Body;
  var Composite = Matter.Composite;
  var Events   = Matter.Events;

  var engine, render, runner;
  var groundBody, personBody;
  var personStartY;
  var simLogicalW, simLogicalH;  // set after Deck.fit

  // Scale factor: surface gravity (m/s²) → matterjs gravity.y
  // Calibrated so default safe zone (g≈0.0026) → jump height ≈80px
  var GRAV_SCALE = 60;

  function initSim() {
    // Use Deck.fit for proper DPI scaling
    Deck.fit(simCanvas);

    // Use the explicit CSS dimensions (450×350) as logical size
    simLogicalW = 450;
    simLogicalH = 350;

    engine = Engine.create();
    engine.gravity.y = 0;

    render = Render.create({
      canvas: simCanvas,
      engine: engine,
      options: {
        width: simLogicalW,
        height: simLogicalH,
        wireframes: false,
        background: 'transparent'
      }
    });

    // Ground — at bottom of logical canvas
    groundBody = Bodies.rectangle(simLogicalW / 2, simLogicalH - 10, simLogicalW, 20, {
      isStatic: true,
      render: { fillStyle: '#334455' }
    });

    // Person
    var personW = 16;
    var personH = 32;
    personStartY = simLogicalH - 10 - personH / 2;
    personBody = Bodies.rectangle(simLogicalW / 2, personStartY, personW, personH, {
      render: { fillStyle: '#e6edf5' },
      friction: 0.5,
      restitution: 0.1
    });

    Composite.add(engine.world, [groundBody, personBody]);

    runner = Runner.create();
    Runner.run(runner, engine);
    Render.run(render);

    updateSimGravity();
    registerSimEvents();
  }

  function updateSimGravity() {
    if (!engine) return;
    engine.gravity.y = surfGrav * GRAV_SCALE;
  }

  var simState = 'idle'; // 'idle' | 'jumping' | 'escaped'

  function triggerJump() {
    if (!personBody) return;

    // Reset person position
    Body.setPosition(personBody, { x: simLogicalW / 2, y: personStartY });
    Body.setVelocity(personBody, { x: 0, y: 0 });
    personBody.gravityScale = 1;
    simState = 'idle';

    // Apply jump velocity (upward = negative y in matterjs)
    var v0 = -5; // px/step, calibrated to look right
    Body.setVelocity(personBody, { x: 0, y: v0 });

    if (zone === 'escape') {
      // In escape zone: set gravityScale to 0 so person floats away
      personBody.gravityScale = 0;
      simState = 'escaped';
    } else {
      simState = 'jumping';
    }
  }

  function resetPerson() {
    if (!personBody) return;
    Body.setPosition(personBody, { x: simLogicalW / 2, y: personStartY });
    Body.setVelocity(personBody, { x: 0, y: 0 });
    personBody.gravityScale = 1;
    simState = 'idle';
  }

  // Check if person landed — registered inside initSim after engine exists
  var simEventsRegistered = false;
  function registerSimEvents() {
    if (simEventsRegistered || !engine) return;
    simEventsRegistered = true;
    Events.on(engine, 'afterUpdate', function () {
      if (!personBody || simState !== 'jumping') return;
      var vy = personBody.velocity.y;
      var py = personBody.position.y;
      // Landed: near ground level and velocity near zero or downward
      if (py >= personStartY - 2 && vy >= -0.1 && vy < 0.5) {
        Body.setPosition(personBody, { x: simLogicalW / 2, y: personStartY });
        Body.setVelocity(personBody, { x: 0, y: 0 });
        simState = 'idle';
      }
      // Check if person went off screen
      if (py < -60) {
        simState = 'escaped';
      }
    });
  }

  // ============================================================
  // 9. Event handlers
  // ============================================================
  slider.addEventListener('input', function () {
    logMass = parseFloat(slider.value);
    recalc();
    updateUI();
    resetPerson();
  });

  btnJump.addEventListener('click', function () {
    triggerJump();
  });

  // Also allow clicking the simulation canvas to jump
  simCanvas.addEventListener('click', function () {
    triggerJump();
  });

  // Keyboard: Space to jump
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && document.activeElement !== slider) {
      e.preventDefault();
      triggerJump();
    }
  });

  // ============================================================
  // 10. Handle resize for echarts
  // ============================================================
  window.addEventListener('resize', function () {
    if (chart) chart.resize();
  });

  // ============================================================
  // 11. Init
  // ============================================================
  initChart();
  initSim();
  updateUI();

  // Show initial jump velocity
  valVjump.innerHTML = fmtNum(HUMAN_VJUMP, 2) + ' m/s';

})();
</script>
</body>
</html>
