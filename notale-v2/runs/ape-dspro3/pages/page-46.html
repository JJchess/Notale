<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第 46 页 · 互动讲义</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* ---- 页面专属布局 ---- */
    #main {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* ---- 压缩 k-process 垂直空间 ---- */
    .pg-process {
      flex-shrink: 0;
    }
    .pg-process.k-process {
      gap: var(--sp-3);
    }
    .pg-process .step {
      font-size: var(--fs-label);
      padding: var(--sp-2) var(--sp-2);
      gap: var(--sp-2);
      line-height: 1.3;
    }
    .pg-process .arw {
      font-size: var(--fs-body);
      padding-top: var(--sp-2);
    }
    .pg-process .step.current::after {
      bottom: -4px;
      width: 7px;
      height: 7px;
    }

    /* ---- 下半区：左右分栏 ---- */
    .pg-body {
      flex: 1 1 0%;
      display: flex;
      flex-direction: row;
      gap: var(--sp-6);
      min-height: 0;
    }

    /* ---- 左侧面板 ---- */
    .pg-left {
      width: 40%;
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
      min-width: 0;
    }

    /* ---- 右侧面板 ---- */
    .pg-right {
      flex: 1 1 0%;
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      min-width: 0;
    }

    /* ---- 小行星照片 ---- */
    .pg-asteroid {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ---- 图表容器 ---- */
    .pg-chart {
      flex: 1 1 0%;
      min-height: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
    }

    /* ---- 滑块行 ---- */
    .pg-slider-row {
      display: flex;
      flex-direction: column;
      gap: var(--sp-1);
    }
    .pg-slider-label {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: baseline;
      font-size: var(--fs-label);
      color: var(--text-sec);
    }
    .pg-slider-val {
      font-size: var(--fs-label);
      color: var(--text);
      font-weight: 600;
      font-family: var(--font-mono);
    }
    .pg-slider-row input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--border);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    .pg-slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      cursor: pointer;
      box-shadow: 0 0 6px rgba(77,166,255,0.4);
    }
    .pg-slider-row input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      cursor: pointer;
      box-shadow: 0 0 6px rgba(77,166,255,0.4);
    }
    .pg-slider-row input[type="range"]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    /* ---- 读数面板 ---- */
    .pg-readout {
      flex: 1 1 0%;
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      min-height: 0;
    }

    .pg-readout .panel {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      padding: var(--sp-4) var(--sp-5);
      font-size: var(--fs-body);
    }

    .pg-ro-row {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: baseline;
      padding: var(--sp-1) 0;
      border-bottom: 1px solid var(--border);
    }
    .pg-ro-row:last-child {
      border-bottom: none;
    }
    .pg-ro-label {
      font-size: var(--fs-label);
      color: var(--text-dim);
    }
    .pg-ro-val {
      font-size: var(--fs-body);
      color: var(--text);
      font-weight: 600;
      font-family: var(--font-mono);
    }
    .pg-ro-val.escape-yes {
      color: var(--err);
    }
    .pg-ro-val.escape-no {
      color: var(--ok);
    }

    /* ---- 底部注释 ---- */
    .pg-note-row {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      flex-shrink: 0;
    }
    .pg-note-row .note {
      font-size: var(--fs-sec);
      line-height: 1.4;
      font-style: normal;
      color: var(--text-dim);
    }
  </style>
</head>
<body data-page="46" data-total="60">
  <div id="stage">
    <main id="main"></main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script>
  (function() {
    /* ============================================================
       初始化底盘
       ============================================================ */
    Deck.init({ index: 46, total: 60 });

    /* ============================================================
       常量（来自 Lec，物理学常数在 Lec 未覆盖时局部定义）
       ============================================================ */
    var G = 6.67430e-11;          // 万有引力常数 m³/(kg·s²)
    var vHuman = Lec.K.HUMAN_JUMP_INITIAL_VELOCITY;  // ≈ 3.13 m/s

    /* ============================================================
       状态
       ============================================================ */
    var massExp = 12;             // 质量指数，mass = 10^massExp
    var radius = 800;             // 半径 (m)

    /* ============================================================
       辅助函数
       ============================================================ */
    function massFromExp(e) {
      return Math.pow(10, e);
    }

    function escapeVelocity(M, R) {
      return Math.sqrt(2 * G * M / R);
    }

    function criticalRadius(M, v) {
      return 2 * G * M / (v * v);
    }

    function fmtSci(x) {
      if (x === 0) return '0';
      var exp = Math.floor(Math.log10(x));
      var mant = x / Math.pow(10, exp);
      return mant.toFixed(2) + ' × 10' + superscript(exp) + ' kg';
    }

    function superscript(n) {
      var sup = { '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻' };
      return String(n).split('').map(function(c) { return sup[c] || c; }).join('');
    }

    /* ============================================================
       构建 DOM
       ============================================================ */
    var main = document.getElementById('main');

    // ---- Process 骨架 ----
    var processDiv = document.createElement('div');
    processDiv.className = 'k-process pg-process';
    processDiv.innerHTML =
      '<div class="axis"></div>' +
      '<div class="steps">' +
        '<div class="step current">选择质量</div><div class="arw">→</div>' +
        '<div class="step current">调整半径</div><div class="arw">→</div>' +
        '<div class="step current">计算逃逸速度</div><div class="arw">→</div>' +
        '<div class="step current">对比初速度</div><div class="arw">→</div>' +
        '<div class="step current">判断逃逸</div><div class="arw">→</div>' +
        '<div class="step current">定位临界半径</div>' +
      '</div>';
    main.appendChild(processDiv);

    // ---- 下半区 ----
    var bodyDiv = document.createElement('div');
    bodyDiv.className = 'pg-body';

    // 左侧
    var leftDiv = document.createElement('div');
    leftDiv.className = 'pg-left';

    // 质量滑块
    var massRow = document.createElement('div');
    massRow.className = 'pg-slider-row';
    massRow.innerHTML =
      '<div class="pg-slider-label"><span>天体质量</span><span class="pg-slider-val" id="mass-val"></span></div>' +
      '<input type="range" id="mass-slider" min="0" max="100" value="33" step="1">';
    leftDiv.appendChild(massRow);

    // 半径滑块
    var radRow = document.createElement('div');
    radRow.className = 'pg-slider-row';
    radRow.innerHTML =
      '<div class="pg-slider-label"><span>天体半径</span><span class="pg-slider-val" id="rad-val"></span></div>' +
      '<input type="range" id="rad-slider" min="50" max="5000" value="800" step="10">';
    leftDiv.appendChild(radRow);

    // 读数面板
    var roDiv = document.createElement('div');
    roDiv.className = 'pg-readout';
    roDiv.innerHTML =
      '<div class="panel panel--raised">' +
        '<div class="pg-ro-row"><span class="pg-ro-label">逃逸速度</span><span class="pg-ro-val" id="ro-vesc">—</span></div>' +
        '<div class="pg-ro-row"><span class="pg-ro-label">临界半径</span><span class="pg-ro-val" id="ro-rcrit">—</span></div>' +
        '<div class="pg-ro-row"><span class="pg-ro-label">人体初速度</span><span class="pg-ro-val">' + vHuman.toFixed(1) + ' m/s</span></div>' +
        '<div class="pg-ro-row"><span class="pg-ro-label">状态</span><span class="pg-ro-val" id="ro-status">—</span></div>' +
      '</div>';
    leftDiv.appendChild(roDiv);

    // 底部注释
    var noteDiv = document.createElement('div');
    noteDiv.className = 'pg-note-row';
    noteDiv.innerHTML =
      '<p class="note">这不是科幻——太阳系里有数以万计的小天体，</p>' +
      '<p class="note">表面探索必须考虑跳跃逃逸的风险。</p>';
    leftDiv.appendChild(noteDiv);

    bodyDiv.appendChild(leftDiv);

    // 右侧
    var rightDiv = document.createElement('div');
    rightDiv.className = 'pg-right';

    // 小行星照片
    var img = document.createElement('img');
    img.className = 'pg-asteroid';
    img.src = 'assets/img/bennu-surface.jpg';
    img.alt = '小行星贝努表面，布满碎石';
    img.title = '小行星贝努（101955 Bennu）表面。照片：NASA / Goddard / University of Arizona，公有领域';
    rightDiv.appendChild(img);

    // 图表容器
    var chartDiv = document.createElement('div');
    chartDiv.className = 'pg-chart';
    chartDiv.id = 'chart';
    rightDiv.appendChild(chartDiv);

    bodyDiv.appendChild(rightDiv);
    main.appendChild(bodyDiv);

    /* ============================================================
       挂载页眉页脚
       ============================================================ */
    Lec.mount({
      kicker: '临界半径',
      title: '小行星，跳一跳，回不来',
      take: '逃逸速度取决于天体质量与半径之比——半径足够小时，人类一跳就能把自己发射进太空'
    });

    /* ============================================================
       ECharts 图表
       ============================================================ */
    var chart = echarts.init(chartDiv, null, { renderer: 'svg' });

    function buildChartOption(M, R, vH) {
      var vEsc = escapeVelocity(M, R);
      var rCrit = criticalRadius(M, vH);

      // 采样曲线：200 个点
      var curveData = [];
      var nPts = 200;
      for (var i = 0; i <= nPts; i++) {
        var r = 50 + (5000 - 50) * i / nPts;
        var v = escapeVelocity(M, r);
        curveData.push([r, Math.min(v, 10)]);
      }

      // 临界半径标记点
      var critPoint = [];
      var critLabelShow = false;
      var critLabelText = '';
      if (rCrit >= 50 && rCrit <= 5000) {
        critPoint = [[rCrit, vH]];
        critLabelShow = true;
        critLabelText = '临界半径\n' + Math.round(rCrit) + ' m';
      } else if (rCrit > 5000) {
        critPoint = [[5000, escapeVelocity(M, 5000)]];
        critLabelShow = true;
        critLabelText = '临界半径\n' + Math.round(rCrit) + ' m\n(超出图表范围)';
      }

      // 当前点
      var curPoint = [[R, Math.min(vEsc, 10)]];

      // 是否可逃逸
      var canEscape = vEsc < vH;

      return {
        renderer: 'svg',
        animation: false,
        textStyle: { fontSize: 16 },
        grid: {
          left: 68,
          right: 36,
          top: 24,
          bottom: 48
        },
        xAxis: {
          type: 'value',
          name: '天体半径 (m)',
          nameLocation: 'center',
          nameGap: 32,
          min: 50,
          max: 5000,
          nameTextStyle: { fontSize: 15, color: '#a0b0c0' },
          axisLabel: { fontSize: 13, color: '#8899aa' },
          axisLine: { lineStyle: { color: '#334455' } },
          splitLine: { lineStyle: { color: '#243040' } },
          axisTick: { show: false }
        },
        yAxis: {
          type: 'value',
          name: '逃逸速度 (m/s)',
          nameLocation: 'center',
          nameGap: 48,
          min: 0,
          max: 10,
          nameTextStyle: { fontSize: 15, color: '#a0b0c0' },
          axisLabel: { fontSize: 13, color: '#8899aa' },
          axisLine: { lineStyle: { color: '#334455' } },
          splitLine: { lineStyle: { color: '#243040' } },
          axisTick: { show: false }
        },
        series: [
          {
            // 逃逸速度曲线
            type: 'line',
            data: curveData,
            showSymbol: false,
            lineStyle: { color: '#4da6ff', width: 2.5 },
            z: 1,
            markLine: {
              silent: true,
              symbol: 'none',
              lineStyle: { color: '#f87171', width: 2, type: 'dashed' },
              label: {
                show: true,
                position: 'end',
                fontSize: 14,
                color: '#f87171',
                formatter: '人体初速度 ' + vH.toFixed(1) + ' m/s'
              },
              data: [{ yAxis: vH, name: '人体跳跃初速度' }]
            }
          },
          {
            // 当前半径位置
            type: 'scatter',
            data: curPoint,
            symbolSize: 14,
            symbol: 'circle',
            itemStyle: {
              color: canEscape ? '#f87171' : '#34d399',
              borderColor: '#fff',
              borderWidth: 2
            },
            label: {
              show: true,
              position: 'right',
              fontSize: 14,
              color: canEscape ? '#f87171' : '#34d399',
              formatter: '当前\nR=' + R + ' m'
            },
            z: 10
          },
          {
            // 临界半径交点
            type: 'scatter',
            data: critPoint,
            symbolSize: 16,
            symbol: 'diamond',
            itemStyle: {
              color: '#f87171',
              borderColor: '#fff',
              borderWidth: 2
            },
            label: {
              show: critLabelShow,
              position: 'top',
              fontSize: 14,
              color: '#f87171',
              formatter: critLabelText
            },
            z: 10
          }
        ]
      };
    }

    /* ============================================================
       更新 UI
       ============================================================ */
    function update() {
      var M = massFromExp(massExp);
      var vEsc = escapeVelocity(M, radius);
      var rCrit = criticalRadius(M, vHuman);
      var canEscape = vEsc < vHuman;

      // 滑块显示值
      document.getElementById('mass-val').textContent = fmtSci(M);
      document.getElementById('rad-val').textContent = radius + ' m';

      // 读数面板
      document.getElementById('ro-vesc').textContent = vEsc.toFixed(2) + ' m/s';
      document.getElementById('ro-rcrit').textContent = Math.round(rCrit) + ' m';

      var statusEl = document.getElementById('ro-status');
      statusEl.textContent = canEscape ? '⚠ 可逃逸！' : '✓ 安全';
      statusEl.className = 'pg-ro-val ' + (canEscape ? 'escape-yes' : 'escape-no');

      // 图表
      var opt = buildChartOption(M, radius, vHuman);
      chart.setOption(opt, { notMerge: false });

      // 更新过程步骤高亮：根据当前状态
      updateProcessSteps(canEscape);
    }

    function updateProcessSteps(canEscape) {
      var steps = document.querySelectorAll('.pg-process .step');
      // 全部分配状态：前 4 步 done，第 5 步 current（判断中），第 6 步根据结果
      for (var i = 0; i < steps.length; i++) {
        steps[i].classList.remove('done', 'current');
      }
      for (var i = 0; i < 4; i++) steps[i].classList.add('done');
      steps[4].classList.add('current'); // 判断逃逸
      if (canEscape) {
        steps[5].classList.add('current'); // 定位临界半径（可逃逸场景）
      } else {
        steps[5].classList.add('done');    // 临界半径无关（不可逃逸）
      }
    }

    /* ============================================================
       事件绑定
       ============================================================ */
    var massSlider = document.getElementById('mass-slider');
    var radSlider = document.getElementById('rad-slider');

    massSlider.addEventListener('input', function() {
      // 滑块值 0-100 映射到指数 10-16
      massExp = 10 + (parseInt(this.value) / 100) * 6;
      update();
    });

    radSlider.addEventListener('input', function() {
      radius = parseInt(this.value);
      update();
    });

    /* ============================================================
       初始渲染
       ============================================================ */
    update();

    /* ============================================================
       窗口大小变化时重绘图表
       ============================================================ */
    window.addEventListener('resize', function() {
      chart.resize();
    });
  })();
  </script>
</body>
</html>
