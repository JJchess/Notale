<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 47 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ---- page layout ---- */
  #main {
    display: flex;
    flex-direction: row;
    gap: var(--sp-8);
    align-items: flex-start;
  }

  .col-left {
    flex: 1 1 0%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
  }

  .col-right {
    flex: 0 0 520px;
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
  }

  /* ---- intro ---- */
  .intro-line {
    font-size: var(--fs-sec);
    color: var(--text-sec);
    line-height: 1.5;
  }
  .intro-line em {
    color: var(--text);
    font-style: normal;
    font-weight: 600;
  }

  /* ---- asteroid danger styling ---- */
  .danger-cell {
    background: rgba(248,113,113,0.12) !important;
    color: var(--err) !important;
    font-weight: 600;
  }

  /* ---- row highlight on click ---- */
  .k-comparison .row-active {
    background: rgba(96,165,250,0.10) !important;
  }

  /* ---- detail panel ---- */
  .detail-panel {
    display: none;
    font-size: var(--fs-sec);
    color: var(--text-sec);
    line-height: 1.5;
    padding: var(--sp-3) var(--sp-5);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
  }
  .detail-panel.show {
    display: block;
  }
  .detail-panel .dl {
    color: var(--text-dim);
  }
  .detail-panel .dv {
    color: var(--text);
    font-weight: 500;
  }
  .detail-panel .dv.warn {
    color: var(--err);
    font-weight: 700;
  }

  /* ---- chart wrap ---- */
  .chart-wrap {
    width: 100%;
    height: 200px;
  }

  .chart-note {
    font-size: var(--fs-label);
    color: var(--err);
    font-weight: 600;
    text-align: center;
    margin-top: -4px;
  }

  /* ---- illustration ---- */
  .illus-wrap {
    position: relative;
  }
  .illus-wrap img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: var(--r-md);
    border: 1px solid var(--border);
  }
  .illus-cap {
    font-size: var(--fs-label);
    color: var(--text-dim);
    text-align: center;
    margin-top: var(--sp-1);
  }

  /* ---- hover tooltip ---- */
  .tooltip-ast {
    display: none;
    position: absolute;
    bottom: 108%;
    left: 0;
    right: 0;
    background: var(--surface-raised);
    border: 1px solid var(--err);
    border-radius: var(--r-md);
    padding: var(--sp-3) var(--sp-4);
    font-size: var(--fs-sec);
    color: var(--text);
    line-height: 1.45;
    box-shadow: var(--shadow-md);
    z-index: 20;
    pointer-events: none;
  }
  .tooltip-ast.show {
    display: block;
  }
</style>
</head>
<body data-page="47" data-total="60">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(function() {
  Deck.init({ index: 47, total: 60 });
  var main = Lec.mount({
    index: 47,
    kicker: '星际跳跃',
    title: '跳跃风险对比',
    take: '只有在小行星上，跳跃本身有危险'
  });

  /* ================================================================
     Data
  ================================================================ */
  var v0 = Lec.K.HUMAN_JUMP_INITIAL_VELOCITY;

  // Compute asteroid values
  var G = 6.67430e-11;
  var ASTEROID_DENSITY = 2000;
  var ASTEROID_RADIUS = 800;
  var asteroidMass = (4/3) * Math.PI * Math.pow(ASTEROID_RADIUS, 3) * ASTEROID_DENSITY;
  var asteroidGravity = G * asteroidMass / (ASTEROID_RADIUS * ASTEROID_RADIUS);
  var asteroidEscapeVelocity = Math.sqrt(2 * G * asteroidMass / ASTEROID_RADIUS);

  var bodies = [
    { id:'earth',   name:'地球',   icon:'🌍', g:Lec.K.EARTH_GRAVITY, what:'落回地面，完全没有危险', risk:'安全', danger:false },
    { id:'moon',    name:'月球',   icon:'🌙', g:Lec.K.MOON_GRAVITY,  what:'落回月面，跳得很高但没有危险', risk:'安全', danger:false },
    { id:'mars',    name:'火星',   icon:'🔴', g:Lec.K.MARS_GRAVITY,  what:'落回火星表面，没有危险', risk:'安全', danger:false },
    { id:'asteroid',name:'小行星', icon:'☄️', g:asteroidGravity,      what:'可能永远飘离，有去无回', risk:'⚠ 危险', danger:true }
  ];

  bodies.forEach(function(b) {
    b.h = Lec.P.jumpHeightFromVelocity(v0, b.g);
    b.t = 2 * v0 / b.g;
  });

  /* ================================================================
     Build DOM
  ================================================================ */

  // --- Left column ---
  var colLeft = document.createElement('div');
  colLeft.className = 'col-left';

  // Intro
  var intro = document.createElement('p');
  intro.className = 'intro-line';
  intro.innerHTML =
    '在地球、月球、火星上，跳起来<em>一定会落回去</em>——重力会把你拉回来。' +
    '只有在小行星上，<em>跳跃本身有危险</em>：初速度可能超过逃逸速度，跳起来就再也回不来了。';
  colLeft.appendChild(intro);

  // Comparison grid — explicit 4-column grid
  var grid = document.createElement('div');
  grid.className = 'k-comparison';
  grid.id = 'comparison-grid';
  grid.style.gridTemplateColumns = 'auto repeat(3, 1fr)';

  // Headers
  ['', '跳起后会发生什么', '空中停留时间', '风险等级'].forEach(function(h) {
    var hdr = document.createElement('div');
    hdr.className = 'hdr';
    hdr.textContent = h;
    grid.appendChild(hdr);
  });

  // Data rows
  bodies.forEach(function(b) {
    var dim = document.createElement('div');
    dim.className = 'dim';
    dim.textContent = b.icon + ' ' + b.name;
    dim.setAttribute('data-body-id', b.id);
    dim.style.cursor = 'pointer';
    grid.appendChild(dim);

    var what = document.createElement('div');
    what.textContent = b.what;
    if (b.danger) what.classList.add('danger-cell');
    grid.appendChild(what);

    var ft = document.createElement('div');
    ft.textContent = b.danger ? '∞' : b.t.toFixed(2) + ' 秒';
    if (b.danger) ft.classList.add('danger-cell');
    grid.appendChild(ft);

    var risk = document.createElement('div');
    risk.textContent = b.risk;
    if (b.danger) {
      risk.classList.add('danger-cell');
    } else {
      risk.style.color = 'var(--ok)';
      risk.style.fontWeight = '600';
    }
    grid.appendChild(risk);
  });

  colLeft.appendChild(grid);

  // Detail panel (hidden)
  var detail = document.createElement('div');
  detail.className = 'detail-panel';
  detail.id = 'detail-panel';
  colLeft.appendChild(detail);

  main.appendChild(colLeft);

  // --- Right column ---
  var colRight = document.createElement('div');
  colRight.className = 'col-right';

  // ECharts
  var chartWrap = document.createElement('div');
  chartWrap.className = 'chart-wrap';
  chartWrap.id = 'chart-flight-time';
  colRight.appendChild(chartWrap);

  // Asteroid note below chart
  var chartNote = document.createElement('div');
  chartNote.className = 'chart-note';
  chartNote.textContent = '小行星：∞（跳起后不再返回）';
  colRight.appendChild(chartNote);

  // Illustration
  var illusWrap = document.createElement('div');
  illusWrap.className = 'illus-wrap';
  illusWrap.id = 'illus-wrap';

  var tooltip = document.createElement('div');
  tooltip.className = 'tooltip-ast';
  tooltip.id = 'tooltip-ast';
  tooltip.textContent =
    '你的跳跃初速度（≈' + v0.toFixed(1) + ' m/s）远超这颗小行星的逃逸速度（≈' +
    asteroidEscapeVelocity.toFixed(2) + ' m/s），一旦跳起，你将永远飘离这颗小行星。';
  illusWrap.appendChild(tooltip);

  var img = document.createElement('img');
  img.src = 'assets/img/p47-asteroid-escape.png';
  img.alt = '宇航员从小行星表面跳起，正在远离';
  illusWrap.appendChild(img);

  var cap = document.createElement('div');
  cap.className = 'illus-cap';
  cap.textContent = '▲ 小行星上跳起后可能永远飘离';
  illusWrap.appendChild(cap);

  colRight.appendChild(illusWrap);
  main.appendChild(colRight);

  /* ================================================================
     ECharts — flight time bar chart
  ================================================================ */
  var chart = echarts.init(document.getElementById('chart-flight-time'), null, { renderer: 'svg' });

  chart.setOption({
    textStyle: { fontSize: 16, fontFamily: 'Inter, system-ui, sans-serif' },
    grid: { left: 72, right: 80, top: 16, bottom: 50 },
    xAxis: {
      type: 'value',
      name: '空中停留（秒）',
      nameLocation: 'middle',
      nameGap: 26,
      nameTextStyle: { fontSize: 14, color: '#8899aa' },
      axisLabel: { fontSize: 13, color: '#8899aa' },
      axisLine: { lineStyle: { color: '#334455' } },
      splitLine: { lineStyle: { color: '#243040' } },
      max: function(v) { return Math.ceil(v.max * 1.2); }
    },
    yAxis: {
      type: 'category',
      data: ['地球', '月球', '火星'],
      axisLabel: { fontSize: 16, color: '#e6edf5' },
      axisLine: { lineStyle: { color: '#334455' } },
      axisTick: { show: false }
    },
    series: [{
      type: 'bar',
      data: [
        { value: bodies[0].t, itemStyle: { color: '#4da6ff' } },
        { value: bodies[1].t, itemStyle: { color: '#4da6ff' } },
        { value: bodies[2].t, itemStyle: { color: '#4da6ff' } }
      ],
      barWidth: 26,
      label: {
        show: true,
        position: 'right',
        fontSize: 14,
        color: '#e6edf5',
        formatter: function(p) { return p.value.toFixed(2) + ' 秒'; }
      }
    }],
    // Asteroid note: moved to DOM below chart to avoid SVG text overlap
  });

  /* ================================================================
     Interaction
  ================================================================ */

  var dimCells = grid.querySelectorAll('.dim');
  var activeRowCells = null;

  dimCells.forEach(function(dimCell) {
    dimCell.addEventListener('click', function() {
      var bodyId = dimCell.getAttribute('data-body-id');
      var body = bodies.find(function(b) { return b.id === bodyId; });
      if (!body) return;

      // Clear previous highlight
      if (activeRowCells) {
        activeRowCells.forEach(function(c) { c.classList.remove('row-active'); });
      }

      // Highlight this row (dim + 3 data cells)
      var rowCells = [];
      var cur = dimCell;
      for (var i = 0; i < 4; i++) {
        if (cur) {
          cur.classList.add('row-active');
          rowCells.push(cur);
          cur = cur.nextElementSibling;
        }
      }
      activeRowCells = rowCells;

      // Fill detail panel
      var parts = [];
      parts.push('<span class="dl">' + body.icon + ' ' + body.name + '</span>：');

      if (body.danger) {
        parts.push('表面重力 <span class="dv">' + (body.g * 1000).toFixed(2) + ' mm/s²</span>，');
        parts.push('跳跃初速度 <span class="dv">' + v0.toFixed(2) + ' m/s</span>，');
        parts.push('逃逸速度 <span class="dv warn">' + asteroidEscapeVelocity.toFixed(2) + ' m/s</span>。');
        parts.push('<span class="dv warn">⚠ 初速度远超逃逸速度，跳起后无法返回。</span>');
      } else {
        parts.push('跳跃高度 <span class="dv">' + body.h.toFixed(2) + ' m</span>，');
        parts.push('空中停留 <span class="dv">' + body.t.toFixed(2) + ' 秒</span>，');
        parts.push('逃逸速度远大于跳跃初速度（' + v0.toFixed(1) + ' m/s）。');
        parts.push('<span class="dv">✓ 安全，跳完一定会落回来。</span>');
      }

      detail.innerHTML = parts.join('');
      detail.classList.add('show');
    });
  });

  // Hover on illustration → tooltip
  var illusEl = document.getElementById('illus-wrap');
  var tooltipEl = document.getElementById('tooltip-ast');

  illusEl.addEventListener('mouseenter', function() { tooltipEl.classList.add('show'); });
  illusEl.addEventListener('mouseleave', function() { tooltipEl.classList.remove('show'); });

  // Also hover on asteroid row dim
  var asteroidDim = grid.querySelector('.dim[data-body-id="asteroid"]');
  if (asteroidDim) {
    asteroidDim.addEventListener('mouseenter', function() { tooltipEl.classList.add('show'); });
    asteroidDim.addEventListener('mouseleave', function() { tooltipEl.classList.remove('show'); });
  }

  window.addEventListener('resize', function() { chart.resize(); });
})();
</script>
</body>
</html>
