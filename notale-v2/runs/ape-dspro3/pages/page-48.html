<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 48 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ---- page-48: 低重力跳跃慢放 ---- */
  #main {
    display: flex;
    flex-direction: row;
    gap: var(--sp-6);
    height: 100%;
    overflow: hidden;
  }

  /* ---- 左侧: 动画区域 ---- */
  .left-col {
    flex: 55 1 0%;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
    overflow: hidden;
  }

  /* NASA 照片参考 */
  .apollo-ref {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: var(--sp-2);
    padding: var(--sp-1) var(--sp-2);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    flex-shrink: 0;
  }
  .apollo-ref img {
    width: 56px;
    height: 56px;
    object-fit: cover;
    border-radius: var(--r-sm);
    flex-shrink: 0;
  }
  .apollo-ref .ref-text {
    font-size: var(--fs-label);
    color: var(--text-dim);
    line-height: 1.35;
  }
  .apollo-ref .ref-text strong {
    color: var(--text-sec);
  }

  /* 三列动画 */
  .anim-row {
    flex: 1 1 0%;
    min-height: 0;
    display: flex;
    flex-direction: row;
    gap: var(--sp-3);
  }

  .planet-col {
    flex: 1 1 0%;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--sp-2);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: var(--sp-3) var(--sp-2);
    position: relative;
    overflow: hidden;
  }

  .planet-label {
    font-size: var(--fs-h2);
    font-weight: 700;
    text-align: center;
    flex-shrink: 0;
  }
  .planet-label.moon  { color: #c8ccd4; }
  .planet-label.mars  { color: #e08860; }
  .planet-label.earth { color: #60a0e0; }

  .planet-gravity {
    font-size: var(--fs-tick);
    color: var(--text-dim);
    flex-shrink: 0;
  }

  .planet-canvas-wrap {
    flex: 1 1 0%;
    min-height: 0;
    width: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .planet-canvas-wrap canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---- 右侧: 控制与数据 ---- */
  .right-col {
    flex: 45 1 0%;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
    overflow: hidden;
  }

  /* 时间轴区域 */
  .timeline-section {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: var(--sp-1);
  }

  .timeline-header {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-3);
  }
  .timeline-header .tl-label {
    font-size: var(--fs-label);
    color: var(--text-sec);
    font-weight: 600;
  }
  .timeline-header .tl-pct {
    font-size: var(--fs-h2);
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    font-family: var(--font-mono);
    min-width: 56px;
    text-align: right;
  }

  /* 滑块 */
  .tl-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }
  .tl-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    box-shadow: 0 0 8px rgba(77,166,255,0.5);
    cursor: pointer;
  }
  .tl-slider::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    box-shadow: 0 0 8px rgba(77,166,255,0.5);
    cursor: pointer;
  }
  .tl-slider:focus-visible {
    box-shadow: 0 0 0 2px rgba(96,165,250,0.25);
  }

  /* 关键帧标记行 */
  .kf-markers {
    position: relative;
    height: 32px;
    margin: 0 11px;
    overflow: hidden;
  }
  .kf-marker {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    cursor: pointer;
  }
  .kf-marker .kf-tick {
    width: 2px;
    height: 10px;
    background: var(--border-strong);
    border-radius: 1px;
    transition: background 200ms var(--ease);
  }
  .kf-marker.active .kf-tick {
    background: var(--accent);
    box-shadow: 0 0 4px rgba(77,166,255,0.6);
  }
  .kf-marker .kf-num {
    font-size: var(--fs-tick);
    color: var(--text-dim);
    font-family: var(--font-mono);
    transition: color 200ms var(--ease);
  }
  .kf-marker.active .kf-num {
    color: var(--accent);
    font-weight: 600;
  }

  /* 数据面板 */
  .data-panel {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: var(--sp-2) var(--sp-3);
    overflow: hidden;
  }
  .data-panel .dp-title {
    font-size: var(--fs-label);
    color: var(--text-sec);
    font-weight: 600;
    margin-bottom: 2px;
  }

  /* 数据表: 使用 k-comparison 骨架 */
  .data-panel .k-comparison {
    font-size: var(--fs-sec);
    border: none;
    border-radius: 0;
    background: transparent;
  }
  .data-panel .k-comparison .hdr {
    font-size: var(--fs-label);
    padding: 2px var(--sp-2);
    background: transparent;
    border-bottom: 1px solid var(--border);
  }
  .data-panel .k-comparison .dim {
    font-size: var(--fs-label);
    padding: 2px var(--sp-2);
  }
  .data-panel .k-comparison > :not(.hdr):not(.dim):not(.diff) {
    font-size: var(--fs-sec);
    padding: 2px var(--sp-2);
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  .data-panel .k-comparison .diff {
    font-size: var(--fs-sec);
    font-family: var(--font-mono);
    padding: 2px var(--sp-2);
  }

  /* 关键帧描述 */
  .kf-desc {
    flex-shrink: 0;
    font-size: var(--fs-sec);
    color: var(--text);
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: var(--sp-2) var(--sp-3);
    line-height: 1.35;
    min-height: 36px;
    transition: border-color 200ms var(--ease);
  }

  .kf-desc.highlight {
    border-color: var(--accent);
  }

  /* 底部插画 */
  .illustration-wrap {
    flex-shrink: 0;
    border-radius: var(--r-sm);
    overflow: hidden;
    border: 1px solid var(--border);
    max-height: 68px;
  }
  .illustration-wrap img {
    display: block;
    width: 100%;
    height: 66px;
    object-fit: cover;
    object-position: center 30%;
  }
</style>
</head>
<body data-page="48" data-total="60">
<div id="stage">
<main id="main">

  <!-- ===== 左侧: 动画区域 ===== -->
  <div class="left-col">
    <!-- NASA 照片参考 -->
    <div class="apollo-ref">
      <img src="assets/img/p48-apollo.jpg" alt="阿波罗16号，约翰·杨在月球表面" title="照片：NASA / Charlie Duke · 阿波罗 16 号任务，约翰·杨在月球表面">

      <div class="planet-col" id="col-mars">

        <div class="planet-gravity">g = 3.7 m/s²</div>
      </div>
      <!-- 地球 -->
      <div class="planet-col" id="col-earth">
        <div class="planet-label earth">地球</div>
        <div class="planet-canvas-wrap"><canvas id="cv-earth"></canvas></div>
        <div class="planet-gravity">g = 9.8 m/s²</div>
      </div>
    </div>
  </div>

  <!-- ===== 右侧: 控制与数据 ===== -->
  <div class="right-col">
    <!-- 时间轴 -->
    <div class="timeline-section">
      <div class="timeline-header">
        <span class="tl-label">⏱ 时间轴（拖拽观察慢放）</span>
        <span class="tl-pct" id="tl-pct">0%</span>
      </div>
      <input type="range" class="tl-slider" id="tl-slider" min="0" max="120" value="0" step="0.1"
             aria-label="拖拽时间轴观察不同星球跳跃动作慢放">
      <div class="kf-markers" id="kf-markers">
        <!-- JS 动态生成 6 个关键帧标记 -->
      </div>

    <!-- 数据面板 -->
    <div class="data-panel">
      <div class="dp-title">当前帧数据</div>
      <div class="k-comparison" id="data-table">
        <div class="hdr"></div>
        <div class="hdr" style="color:#c8ccd4;">月球</div>
        <div class="hdr" style="color:#e08860;">火星</div>
        <div class="hdr" style="color:#60a0e0;">地球</div>

        <div class="dim">速度</div>
        <div id="dt-moon-v">0.00 m/s</div>
        <div id="dt-mars-v">0.00 m/s</div>
        <div id="dt-earth-v">0.00 m/s</div>
      </div>
    </div>

    <!-- 关键帧描述 -->
    <div class="kf-desc" id="kf-desc">起跳：双脚离地，膝关节完全伸展。三个星球上同时起跳，初速度相同。</div>

    <!-- 插画示意 -->
    <div class="illustration-wrap">

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script src="assets/lib/anime.min.js"></script>
<script>
(async function() {
  // ---- 底盘初始化 ----
  Deck.init({ index: 48, total: 60 });

  // ---- 页眉 ----
  Lec.mount({
    index: 48,
    kicker: '星际跳跃',
    title: '低重力跳跃慢放',
    take: '低重力下动作变慢，但肌肉力量不变，可能翻跟头'
  });

  // ---- 常量 ----
  const v0 = Lec.K.HUMAN_JUMP_INITIAL_VELOCITY; // ≈ 2.5 m/s
  const gravities = {
    moon:  Lec.K.MOON_GRAVITY,   // 1.62
    mars:  Lec.K.MARS_GRAVITY,   // 3.7
    earth: Lec.K.EARTH_GRAVITY   // 9.8
  };
  const planetNames = ['moon', 'mars', 'earth'];
  const planetLabels = { moon: '月球', mars: '火星', earth: '地球' };
  const planetColors = {
    moon:  { fill: '#c8ccd4', stroke: '#9a9ea6', glow: 'rgba(200,204,212,0.3)' },
    mars:  { fill: '#e08860', stroke: '#b06040', glow: 'rgba(224,136,96,0.3)' },
    earth: { fill: '#60a0e0', stroke: '#4078b0', glow: 'rgba(96,160,224,0.3)' }
  };

  // 关键帧定义
  const keyframes = [
    { id: 0, pct: 0,    label: '起跳',   desc: '起跳：双脚离地，膝关节完全伸展。三个星球上同时起跳，初速度相同。' },
    { id: 1, pct: 25,   label: '上升',   desc: '上升：身体上升中。月球上才刚刚开始加速，地球上已经快到顶点了。' },
    { id: 2, pct: 50,   label: '顶点',   desc: '顶点：速度为零。地球上的跳跃者早已落地，而月球上的跳跃者才到最高点。' },
    { id: 3, pct: 75,   label: '下降',   desc: '下降：开始加速下落。地球上的跳跃者早已完成整个动作，月球上还在慢悠悠下落。' },
    { id: 4, pct: 100,  label: '着地',   desc: '着地：双脚触地，膝关节缓冲。月球上着地速度更大，但因为重力小，冲击力反而更小。' },
    { id: 5, pct: 120,  label: '恢复',   desc: '恢复：身体稳定。月球上空中停留了 2 秒多，任何微小的旋转都会被放大——翻跟头不是选择，是物理。' }
  ];

  // ---- 计算飞行时间 ----
  function flightTime(g) { return 2 * v0 / g; }
  function heightAtTime(t, g) {
    const tHalf = v0 / g;
    if (t <= 0) return 0;
    if (t <= tHalf) return v0 * t - 0.5 * g * t * t;
    const tDesc = t - tHalf;
    const hMax = v0 * v0 / (2 * g);
    return Math.max(0, hMax - 0.5 * g * tDesc * tDesc);
  }
  function velocityAtTime(t, g) {
    const tHalf = v0 / g;
    if (t <= tHalf) return v0 - g * t;
    return -g * (t - tHalf);
  }

  const tFlights = {};
  planetNames.forEach(p => { tFlights[p] = flightTime(gravities[p]); });

  // ---- Matter.js 预录制 ----
  const { Engine, Bodies, Composite } = Matter;

  // 缩放: 1m = 75px, 使月球跳跃 (≈3.6m) 在 400px 画布上占约 270px
  const SCALE = 75;
  // 画布逻辑尺寸
  const CV_W = 220, CV_H = 400;
  const GROUND_Y = 355; // 地面在画布上的 y 坐标

  // 为每个星球创建引擎并录制
  const recordings = {};

  planetNames.forEach(p => {
    const g = gravities[p];
    const engine = Engine.create();
    engine.gravity.y = g * SCALE;
    engine.gravity.scale = 1;

    // 人物身体: 一个矩形, 代表质心
    const bodyW = 24, bodyH = 60;
    const body = Bodies.rectangle(CV_W / 2, GROUND_Y - bodyH / 2, bodyW, bodyH, {
      restitution: 0.1,
      friction: 0.5,
      density: 0.001
    });
    // 给身体初始向上速度
    Matter.Body.setVelocity(body, { x: 0, y: -v0 * SCALE });

    // 地面
    const ground = Bodies.rectangle(CV_W / 2, GROUND_Y + 25, CV_W + 100, 50, { isStatic: true });

    Composite.add(engine.world, [body, ground]);

    // 录制: 以 120fps 录制, 时长覆盖月球最长时间 (约 3.1s * 1.2 = 3.7s)
    const maxTime = (2 * v0 / gravities.moon) * 1.3; // 月球飞行时间 * 1.3
    const dt = 1000 / 120;
    const positions = [];
    const startY = body.position.y;

    for (let t = 0; t <= maxTime * 1000; t += dt) {
      Engine.update(engine, dt);
      positions.push({
        t: t / 1000,
        y: body.position.y
      });
    }

    recordings[p] = {
      positions,
      startY,
      engine,
      body,
      ground
    };
  });

  // ---- Canvas 渲染 ----
  const canvases = {};
  const ctxs = {};
  planetNames.forEach(p => {
    canvases[p] = document.getElementById('cv-' + p);
    ctxs[p] = Deck.fit(canvases[p]);
  });

  function drawFigure(ctx, p, x, y, phase) {
    const c = planetColors[p];
    const w = ctx.canvas.width;
    const h = ctx.canvas.height;

    // 身体中心
    const cx = w / 2;
    const cy = y;

    // 根据 phase 调整姿态
    // phase: 0=起跳, 1=上升, 2=顶点, 3=下降, 4=着地, 5=恢复
    let legAngle = 0, armAngle = 0;
    if (phase <= 0.5) {
      // 起跳/上升: 腿伸直, 手臂上摆
      legAngle = 0.1;
      armAngle = -0.6;
    } else if (phase <= 1.5) {
      // 顶点附近: 腿收拢, 手臂高举
      legAngle = 0.3;
      armAngle = -1.2;
    } else if (phase <= 3) {
      // 下降: 腿微张, 手臂调整
      legAngle = 0.2;
      armAngle = -0.4;
    } else {
      // 着地/恢复: 腿弯曲缓冲
      legAngle = 0.5;
      armAngle = 0.3;
    }

    ctx.save();
    ctx.translate(cx, cy);

    // 光晕
    const grd = ctx.createRadialGradient(0, 0, 10, 0, 0, 50);
    grd.addColorStop(0, c.glow);
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(0, 0, 50, 0, Math.PI * 2);
    ctx.fill();

    // 头部
    ctx.fillStyle = c.fill;
    ctx.strokeStyle = c.stroke;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -38, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 躯干
    ctx.beginPath();
    ctx.moveTo(0, -28);
    ctx.lineTo(0, 16);
    ctx.stroke();

    // 左臂
    ctx.beginPath();
    ctx.moveTo(0, -22);
    ctx.lineTo(-14, -22 + Math.sin(armAngle) * 16);
    ctx.lineTo(-18, -22 + Math.sin(armAngle) * 16 + 16);
    ctx.stroke();

    // 右臂
    ctx.beginPath();
    ctx.moveTo(0, -22);
    ctx.lineTo(14, -22 + Math.sin(armAngle) * 16);
    ctx.lineTo(18, -22 + Math.sin(armAngle) * 16 + 16);
    ctx.stroke();

    // 左腿
    ctx.beginPath();
    ctx.moveTo(0, 16);
    ctx.lineTo(-8 * Math.sin(legAngle), 16 + 24);
    ctx.lineTo(-8 * Math.sin(legAngle) + 4, 16 + 24 + 22);
    ctx.stroke();

    // 右腿
    ctx.beginPath();
    ctx.moveTo(0, 16);
    ctx.lineTo(8 * Math.sin(legAngle), 16 + 24);
    ctx.lineTo(8 * Math.sin(legAngle) + 4, 16 + 24 + 22);
    ctx.stroke();

    ctx.restore();
  }

  function drawGround(ctx, p) {
    const c = planetColors[p];
    const w = ctx.canvas.width;
    ctx.strokeStyle = c.stroke;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.moveTo(10, GROUND_Y);
    ctx.lineTo(w - 10, GROUND_Y);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawHeightMarker(ctx, p, y, label) {
    const c = planetColors[p];
    ctx.strokeStyle = c.stroke;
    ctx.globalAlpha = 0.25;
    ctx.lineWidth = 0.5;
    ctx.setLineDash([3, 6]);
    ctx.beginPath();
    ctx.moveTo(30, y);
    ctx.lineTo(ctx.canvas.width - 30, y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  function renderPlanet(p, sliderPct) {
    const ctx = ctxs[p];
    const w = ctx.canvas.width;
    const h = ctx.canvas.height;
    ctx.clearRect(0, 0, w, h);

    // 背景
    ctx.fillStyle = '#0b1119';
    ctx.fillRect(0, 0, w, h);

    // 高度标线
    const hMax = Lec.P.jumpHeightFromVelocity(v0, gravities[p]);
    if (hMax > 0.3) {
      drawHeightMarker(ctx, p, GROUND_Y - hMax * SCALE, '');
    }

    // 地面
    drawGround(ctx, p);

    // 计算当前时间
    const tFlight = tFlights[p];
    const t = (sliderPct / 100) * tFlight;

    // 查找录制位置
    const rec = recordings[p];
    const positions = rec.positions;
    const idx = Math.min(Math.floor(t / (positions[1].t - positions[0].t)), positions.length - 2);
    const idx2 = Math.min(idx + 1, positions.length - 1);
    const frac = (t - positions[idx].t) / Math.max(positions[idx2].t - positions[idx].t, 0.001);
    const y = positions[idx].y + (positions[idx2].y - positions[idx].y) * Math.max(0, Math.min(1, frac));

    // 计算 phase
    const tHalf = v0 / gravities[p];
    let phase;
    if (t <= 0) phase = 0;
    else if (t < tHalf * 0.3) phase = 0.5;
    else if (t < tHalf) phase = 1;
    else if (t < tHalf * 1.1) phase = 1.5;
    else if (t < tFlight * 0.9) phase = 2;
    else if (t < tFlight) phase = 3;
    else if (t < tFlight * 1.1) phase = 4;
    else phase = 5;

    // 绘制人物
    drawFigure(ctx, p, w / 2, y, phase);

    // 星球名水印
    ctx.fillStyle = planetColors[p].stroke;
    ctx.globalAlpha = 0.12;
    ctx.font = 'bold 28px ' + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = 'center';
    ctx.fillText(planetLabels[p], w / 2, h - 16);
    ctx.globalAlpha = 1;
  }

  function renderAll(sliderPct) {
    planetNames.forEach(p => renderPlanet(p, sliderPct));
  }

  // ---- 数据面板更新 ----
  function updateDataPanel(sliderPct) {
    planetNames.forEach(p => {
      const tFlight = tFlights[p];
      const t = (sliderPct / 100) * tFlight;
      const h = heightAtTime(t, gravities[p]);
      const v = velocityAtTime(t, gravities[p]);

      document.getElementById('dt-' + p + '-time').textContent = t.toFixed(2) + ' s';
      document.getElementById('dt-' + p + '-h').textContent = h.toFixed(2) + ' m';
      document.getElementById('dt-' + p + '-v').textContent = v.toFixed(2) + ' m/s';
    });

    document.getElementById('tl-pct').textContent = Math.round(sliderPct) + '%';
  }

  // ---- 关键帧描述更新 ----
  function updateKeyframeDesc(sliderPct) {
    let activeKf = null;
    for (const kf of keyframes) {
      if (sliderPct >= kf.pct - 3 && sliderPct <= kf.pct + 3) {
        activeKf = kf;
        break;
      }
    }

    const descEl = document.getElementById('kf-desc');
    if (activeKf) {
      descEl.textContent = activeKf.desc;
      descEl.classList.add('highlight');
    } else {
      descEl.classList.remove('highlight');
      // 生成通用描述
      const tMoon = (sliderPct / 100) * tFlights.moon;
      const tEarth = (sliderPct / 100) * tFlights.earth;
      if (tMoon < tFlights.moon && tEarth > tFlights.earth) {
        descEl.textContent = '地球上已经完成跳跃，月球上还在空中——同样的动作，完全不同的时间尺度。';
      } else if (sliderPct > 100) {
        descEl.textContent = '恢复阶段。月球上从起跳到恢复超过 2.6 秒，是地球的 5 倍多。';
      } else {
        descEl.textContent = '拖拽时间轴，观察同一动作在三个星球上的不同节奏。';
      }
    }

    // 更新关键帧标记高亮
    document.querySelectorAll('.kf-marker').forEach((el, i) => {
      const kf = keyframes[i];
      if (activeKf && activeKf.id === kf.id) {
        el.classList.add('active');
      } else {
        el.classList.remove('active');
      }
    });
  }

  // ---- 构建关键帧标记 ----
  function buildKeyframeMarkers() {
    const container = document.getElementById('kf-markers');
    container.innerHTML = '';
    keyframes.forEach(kf => {
      const el = document.createElement('div');
      el.className = 'kf-marker';
      // 位置: kf.pct 映射到 0-120 范围, 容器宽度为 100% - 22px(thumb)
      let pos = (kf.pct / 120) * 100;
      // 最后一个标记(120%)稍微内收避免溢出
      if (kf.pct >= 120) pos = 99.5;
      el.style.left = pos + '%';
      el.innerHTML = '<div class="kf-tick"></div><div class="kf-num">' + kf.pct + '%</div>';
      el.title = kf.label + ' — ' + kf.desc;
      el.addEventListener('click', () => {
        slider.value = kf.pct;
        handleSliderChange();
      });
      container.appendChild(el);
    });
  }

  // ---- 滑块交互 ----
  const slider = document.getElementById('tl-slider');
  let currentPct = 0;
  let animObj = null;

  function handleSliderChange() {
    const targetPct = parseFloat(slider.value);
    if (animObj) animObj.pause();

    animObj = anime({
      targets: { pct: currentPct },
      pct: targetPct,
      duration: 80,
      easing: 'easeOutQuad',
      update: function(anim) {
        const p = anim.animations[0].currentValue;
        renderAll(p);
        updateDataPanel(p);
        updateKeyframeDesc(p);
      },
      complete: function() {
        currentPct = targetPct;
      }
    });
  }

  slider.addEventListener('input', handleSliderChange);

  // ---- 键盘可达 ----
  slider.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
      e.preventDefault();
      slider.value = Math.min(120, parseFloat(slider.value) + 5);
      handleSliderChange();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      e.preventDefault();
      slider.value = Math.max(0, parseFloat(slider.value) - 5);
      handleSliderChange();
    }
  });

  // ---- 初始渲染 ----
  buildKeyframeMarkers();
  renderAll(0);
  updateDataPanel(0);
  updateKeyframeDesc(0);

  // ---- 入场动画 ----
  if (!Deck.reduced()) {
    anime({
      targets: slider,
      value: [0, 50],
      duration: 1800,
      easing: 'easeInOutQuad',
      round: 1,
      update: function(anim) {
        const p = parseFloat(slider.value);
        renderAll(p);
        updateDataPanel(p);
        updateKeyframeDesc(p);
      },
      complete: function() {
        currentPct = 50;
        slider.value = 0;
        anime({
          targets: slider,
          value: [0, 0],
          duration: 600,
          easing: 'easeOutQuad',
          round: 1,
          update: function(anim) {
            const p = parseFloat(slider.value);
            renderAll(p);
            updateDataPanel(p);
            updateKeyframeDesc(p);
          },
          complete: function() {
            currentPct = 0;
          }
        });
      }
    });
  }

  // ---- Deck.loop 持续渲染 ----
  Deck.loop(function() {
    // 保持画布在 HiDPI 下清晰
    planetNames.forEach(p => {
      const cv = canvases[p];
      if (cv.width !== cv.clientWidth * (window.devicePixelRatio || 1)) {
        ctxs[p] = Deck.fit(cv);
        renderAll(currentPct);
      }
    });
  });

})();
</script>
</body>
</html>
