<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 50 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ── 卡片版 enumeration：横向三卡片 ── */
  .enum-cards {
    display: flex;
    flex-direction: row;
    gap: var(--sp-4);
    width: 100%;
    flex: 1 1 0%;
    min-height: 0;
  }

  .enum-cards .card {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    overflow: hidden;
    cursor: pointer;
    flex: 1 1 0%;
    min-width: 0;
    transition: flex 420ms var(--ease), border-color 300ms var(--ease), box-shadow 300ms var(--ease);
    user-select: none;
  }

  .enum-cards .card:hover {
    border-color: var(--border-strong);
  }

  .enum-cards .card.selected {
    flex: 2.2 1 0%;
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(77,166,255,0.18);
  }

  .enum-cards .card:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  /* ── 图片区 60% ── */
  .card .card-img {
    flex: 0 0 58%;
    overflow: hidden;
    position: relative;
    background: #0d1520;
  }

  .card .card-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* 图片底部渐变过渡 */
  .card .card-img::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 32px;
    background: linear-gradient(to bottom, transparent, var(--surface));
    pointer-events: none;
  }

  /* ── 文字区 40% ── */
  .card .card-text {
    flex: 0 0 42%;
    padding: var(--sp-4) var(--sp-5);
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
    line-height: 1.45;
  }

  .card .planet-name {
    font-size: var(--fs-h2);
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
  }

  .card .method-tag {
    font-size: var(--fs-body);
    color: var(--accent);
    font-weight: 600;
    line-height: 1.35;
  }

  /* ── 详情区：收缩时隐藏，展开时显示 ── */
  .card .detail {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: var(--sp-2);
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 420ms var(--ease), opacity 350ms var(--ease), margin 350ms var(--ease);
  }

  .card.selected .detail {
    max-height: 160px;
    opacity: 1;
    margin-top: var(--sp-3);
  }

  .card .detail .d-row {
    display: flex;
    gap: var(--sp-2);
    align-items: baseline;
    font-size: var(--fs-sec);
    line-height: 1.45;
  }

  .card .detail .d-label {
    color: var(--text-dim);
    flex-shrink: 0;
    font-size: var(--fs-sec);
  }

  .card .detail .d-value {
    color: var(--text);
    font-size: var(--fs-sec);
  }

  /* ── 底部洞察句 ── */
  .insight-line {
    margin-top: var(--sp-4);
    font-size: var(--fs-sec);
    color: var(--text-dim);
    font-style: italic;
    text-align: center;
    line-height: 1.45;
    flex-shrink: 0;
  }
</style>
</head>
<body data-page="50" data-total="60">
<div id="stage">
<main id="main" class="col" style="height:100%;">

  <!-- 三卡片 enumeration -->
  <div class="k-enumeration enum-cards" role="radiogroup" aria-label="选择星球查看移动方式">

    <!-- 月球 -->
    <div class="card card-moon selected" role="radio" aria-checked="true" tabindex="0"
         data-planet="moon" onclick="selectCard('moon')"
         onkeydown="if(event.key==='Enter'||event.key===' ') { event.preventDefault(); selectCard('moon'); }">
      <div class="card-img">
        <img src="assets/img/p50-moon-jump.jpg" alt="阿波罗宇航员在月球表面跳跃">
      </div>
      <div class="card-text">
        <div class="planet-name">月球</div>
        <div class="method-tag">跳跃前进</div>
        <div class="detail" id="detail-moon"></div>
      </div>
    </div>

    <!-- 火星 -->
    <div class="card card-mars" role="radio" aria-checked="false" tabindex="0"
         data-planet="mars" onclick="selectCard('mars')"
         onkeydown="if(event.key==='Enter'||event.key===' ') { event.preventDefault(); selectCard('mars'); }">
      <div class="card-img">
        <img src="assets/img/p50-mars-jog.png" alt="宇航员在火星表面慢跑（AI生成）">
      </div>
      <div class="card-text">
        <div class="planet-name">火星</div>
        <div class="method-tag">慢跑</div>
        <div class="detail" id="detail-mars"></div>
      </div>
    </div>

    <!-- 谷神星 -->
    <div class="card card-ceres" role="radio" aria-checked="false" tabindex="0"
         data-planet="ceres" onclick="selectCard('ceres')"
         onkeydown="if(event.key==='Enter'||event.key===' ') { event.preventDefault(); selectCard('ceres'); }">
      <div class="card-img">
        <img src="assets/img/p50-ceres-crawl.png" alt="宇航员在谷神星表面爬行（AI生成）">
      </div>
      <div class="card-text">
        <div class="planet-name">谷神星</div>
        <div class="method-tag">爬行</div>
        <div class="detail" id="detail-ceres"></div>
      </div>
    </div>

  </div>

  <div class="insight-line">
    演化没有给人类预设"在其他星球上怎么移动"的答案，但我们的身体可以适应——只要选择与重力匹配的策略。
  </div>

</main>
</div>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  /* ── 底盘初始化 ── */
  Deck.init({ index: 50, total: 60 });

  /* ── 页眉 ── */
  Lec.mount({
    index: 50,
    kicker: '星际跳跃',
    title: '星际移动方式',
    take: '在不同重力的星球上，最佳的移动方式不同：月球跳跃、火星慢跑、谷神星爬行。'
  });

  /* ── 从 Lec 取数值 ── */
  const moonG  = Lec.K.MOON_GRAVITY;          // 1.62
  const marsG  = Lec.K.MARS_GRAVITY;          // 3.7
  const ceresG = moonG * 0.17;                // ≈ 0.2754
  const suitMass = Lec.K.TOTAL_EVA_MASS;      // 200
  const v0    = Lec.K.HUMAN_JUMP_INITIAL_VELOCITY; // 2.5
  const earthG = Lec.K.EARTH_GRAVITY;

  /* 计算跳跃高度 */
  const moonJumpH = Lec.P.jumpHeightFromVelocity(v0, moonG);
  const marsJumpH = Lec.P.jumpHeightFromVelocity(v0, marsG);

  /* 月球穿宇航服跳跃高度估算（考虑质量增加导致初速度降低） */
  const astronautMass = Lec.K.ASTRONAUT_MASS; // 70
  const v0MoonSuited = v0 * (astronautMass / suitMass);
  const moonJumpSuited = Lec.P.jumpHeightFromVelocity(v0MoonSuited, moonG);

  /* 火星穿宇航服跳跃高度 */
  const v0MarsSuited = v0 * (astronautMass / suitMass);
  const marsJumpSuited = Lec.P.jumpHeightFromVelocity(v0MarsSuited, marsG);

  /* 空中停留时间：t = 2*v0/g */
  const moonAirTime = (2 * v0) / moonG;

  /* ── 填充详情 ── */
  function fmt(n) { return n.toFixed(2); }
  function fmt1(n) { return n.toFixed(1); }

  document.getElementById('detail-moon').innerHTML =
    '<div class="d-row"><span class="d-label">移动方式</span><span class="d-value">跳跃前进 — 双脚并拢跳跃，利用低重力长距离平移</span></div>' +
    '<div class="d-row"><span class="d-label">重力加速度</span><span class="d-value">' + fmt(moonG) + ' m/s²（约为地球的 1/6）</span></div>' +
    '<div class="d-row"><span class="d-label">跳跃特征</span><span class="d-value">穿宇航服（' + suitMass + ' kg）时，跳跃高度仍可达约 ' + fmt1(moonJumpSuited) + ' m；空中停留约 ' + fmt1(moonAirTime) + ' 秒</span></div>' +
    '<div class="d-row"><span class="d-label">移动建议</span><span class="d-value">跳跃比行走更高效：低重力下离地时间长，步行摩擦力与稳定性反而不如跳跃</span></div>';

  document.getElementById('detail-mars').innerHTML =
    '<div class="d-row"><span class="d-label">移动方式</span><span class="d-value">慢跑 — 介于步行和跑步之间，步幅比地球大，步频比地球低</span></div>' +
    '<div class="d-row"><span class="d-label">重力加速度</span><span class="d-value">' + fmt1(marsG) + ' m/s²（约为地球的 38%）</span></div>' +
    '<div class="d-row"><span class="d-label">跳跃特征</span><span class="d-value">无宇航服时跳跃高度约 ' + fmt1(marsJumpH) + ' m（地球的 ' + fmt1(marsJumpH / Lec.P.jumpHeightFromVelocity(v0, earthG)) + ' 倍）；穿宇航服时约 ' + fmt1(marsJumpSuited) + ' m</span></div>' +
    '<div class="d-row"><span class="d-label">移动建议</span><span class="d-value">慢跑比跳跃更安全：重力仍足以让身体承受落地冲击，跳跃可能导致着陆不稳</span></div>';

  document.getElementById('detail-ceres').innerHTML =
    '<div class="d-row"><span class="d-label">移动方式</span><span class="d-value">爬行 — 用手抓住表面，身体贴近地面，避免弹离</span></div>' +
    '<div class="d-row"><span class="d-label">重力加速度</span><span class="d-value">' + fmt(ceresG) + ' m/s²（约为地球的 2.8%）</span></div>' +
    '<div class="d-row"><span class="d-label">跳跃特征</span><span class="d-value">跳跃初速度 ' + fmt1(v0) + ' m/s 可能已接近或超过逃逸速度，跳跃意味着可能永远离开表面</span></div>' +
    '<div class="d-row"><span class="d-label">移动建议</span><span class="d-value">任何跳跃都极度危险；爬行是最安全的方式，通过手部抓握维持与表面的接触</span></div>';

  /* ── 卡片选择交互 ── */
  let current = document.querySelector('.card.selected');

  function selectCard(planet) {
    if (current) {
      current.classList.remove('selected');
      current.setAttribute('aria-checked', 'false');
    }
    const card = document.querySelector('.card-' + planet);
    card.classList.add('selected');
    card.setAttribute('aria-checked', 'true');
    current = card;
  }
</script>
</body>
</html>
