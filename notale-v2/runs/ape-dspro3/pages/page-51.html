<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 51 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/lib/echarts.min.js"></script>
<style>
  /* ---- 页面专属布局 ---- */
  #main {
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }

  /* 上半区: 柱状图 + 照片 */
  .top-row {
    display: flex;
    flex-direction: row;
    gap: var(--sp-5);
    height: 280px;
    flex-shrink: 0;
  }

  .chart-wrap {
    flex: 1 1 0%;
    min-width: 0;
    position: relative;
  }
  .chart-wrap > div {
    width: 100%;
    height: 100%;
  }

  .photo-col {
    flex-shrink: 0;
    width: 290px;
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
  }

  .photo-card {
    flex: 1 1 0%;
    min-height: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    overflow: hidden;
    position: relative;
  }
  .photo-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-card .photo-cap {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(11,17,25,0.88));
    padding: var(--sp-2) var(--sp-3);
    font-size: var(--fs-label);
    color: var(--text-dim);
    line-height: 1.3;
    pointer-events: none;
  }

  /* ---- 下半区: ledger ---- */
  .ledger-wrap {
    flex: 1 1 0%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* k-comparison 定制列宽 */
  .cmp-ledger {
    grid-template-columns: 200px 1fr 1fr !important;
    flex: 1 1 auto;
  }

  .cmp-ledger .hdr {
    font-size: var(--fs-body);
    padding: var(--sp-2) var(--sp-4);
  }

  .cmp-ledger .dim {
    font-size: var(--fs-sec);
    padding: var(--sp-2) var(--sp-4);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 1px;
  }

  .dim .dim-sub {
    font-size: var(--fs-label);
    color: var(--text-dim);
    font-weight: 400;
  }

  /* 单元格 */
  .cmp-ledger .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    padding: var(--sp-2) var(--sp-4);
    cursor: pointer;
    transition: background 200ms var(--ease);
    user-select: none;
  }
  .cmp-ledger .cell:hover {
    background: rgba(96,165,250,0.08);
  }

  .cell .val {
    font-size: var(--fs-lead);
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
  }
  .cell .val-unit {
    font-size: var(--fs-sec);
    font-weight: 400;
    color: var(--text-sec);
  }
  .cell .sub {
    font-size: var(--fs-label);
    color: var(--text-dim);
    line-height: 1.3;
  }

  /* 高亮态 */
  .cmp-ledger .cell.hl {
    background: rgba(77,166,255,0.14);
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    border-radius: 2px;
    z-index: 1;
  }
  .cmp-ledger .dim.hl {
    color: var(--accent);
    font-weight: 600;
  }

  /* 月球列月球底色 */
  .cmp-ledger .moon-cell {
    background: rgba(255,184,50,0.06);
  }

  /* 箭头: 演化/工程叠加 */
  .dim .arrow-hint {
    font-size: var(--fs-label);
    color: var(--text-dim);
    font-weight: 400;
    margin-top: 1px;
    letter-spacing: 0.05em;
  }

  /* 两句话标注 */
  .callouts {
    display: flex;
    flex-direction: row;
    gap: var(--sp-6);
    flex-shrink: 0;
  }
  .callout {
    flex: 1 1 0%;
    min-width: 0;
    font-size: var(--fs-label);
    color: var(--text-sec);
    line-height: 1.35;
    padding: var(--sp-1) var(--sp-3);
    border-left: 3px solid var(--accent-soft);
    background: rgba(51,136,221,0.06);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
  }
  .callout strong {
    color: var(--accent);
    font-weight: 600;
  }
</style>
</head>
<body data-page="51" data-total="60">
<div id="stage">
<main id="main">

  <!-- 上半区 -->
  <div class="top-row">
    <!-- 柱状图 -->
    <div class="chart-wrap">
      <div id="bar-chart"></div>
    </div>
    <!-- 照片列 -->
    <div class="photo-col">
      <div class="photo-card">
        <img src="assets/img/p51/apollo-jump.jpg"
             alt="阿波罗16号约翰·杨在月球表面跳跃"
             title="照片: NASA / Charlie Duke · Apollo 16 · 公有领域">
        <div class="photo-cap">阿波罗16号 · 月球跳跃</div>
      </div>
      <div class="photo-card">
        <img src="assets/img/p51/lucy-skeleton.jpg"
             alt="南方古猿阿法种露西骨架"
             title="照片: Lamminiaz · CC BY-SA 4.0 · Wikimedia Commons">
        <div class="photo-cap">南方古猿 · 露西 (AL 288-1)</div>
      </div>
    </div>
  </div>

  <!-- 标注句 -->
  <div class="callouts">
    <div class="callout"><strong>猿人祖先提供了基础</strong> — 南方古猿的下肢结构已为直立行走优化，这是宇航员能在月球上跳跃的生物学前提。</div>
    <div class="callout"><strong>宇航员在月球上跳得比任何地球人都高</strong> — 低重力放大了跳跃能力，即使穿着130kg宇航服，月球跳跃高度仍是地球上的约25倍。</div>
  </div>

  <!-- 下半区: ledger -->
  <div class="ledger-wrap">
    <div class="k-comparison cmp-ledger" id="ledger">
      <!-- 列头 -->
      <div class="hdr"></div>
      <div class="hdr">地球重力<br><span style="font-weight:400;font-size:var(--fs-label);color:var(--text-dim);">9.8 m/s²</span></div>
      <div class="hdr">月球重力<br><span style="font-weight:400;font-size:var(--fs-label);color:var(--text-dim);">1.62 m/s²</span></div>

      <!-- 南方古猿 -->
      <div class="dim" data-subject="aust"><span>南方古猿阿法种</span><span class="dim-sub">露西 · <span class="mass-aust">—</span> kg</span><span class="arrow-hint">演化 ▾</span></div>
      <div class="cell" data-subject="aust" data-env="earth"><span class="val"><span class="h-aust-earth">—</span> <span class="val-unit">m</span></span><span class="sub">v₀ <span class="v0-aust-earth">—</span> m/s</span></div>
      <div class="cell moon-cell" data-subject="aust" data-env="moon"><span class="val"><span class="h-aust-moon">—</span> <span class="val-unit">m</span></span><span class="sub">v₀ <span class="v0-aust-moon">—</span> m/s</span></div>

      <!-- 现代智人 -->
      <div class="dim" data-subject="human"><span>现代智人</span><span class="dim-sub"><span class="mass-human">—</span> kg</span><span class="arrow-hint">工程 ▾</span></div>
      <div class="cell" data-subject="human" data-env="earth"><span class="val"><span class="h-human-earth">—</span> <span class="val-unit">m</span></span><span class="sub">v₀ <span class="v0-human-earth">—</span> m/s</span></div>
      <div class="cell moon-cell" data-subject="human" data-env="moon"><span class="val"><span class="h-human-moon">—</span> <span class="val-unit">m</span></span><span class="sub">v₀ <span class="v0-human-moon">—</span> m/s</span></div>

      <!-- 宇航员 -->
      <div class="dim" data-subject="astro"><span>宇航员 (EVA)</span><span class="dim-sub"><span class="mass-astro">—</span> kg</span></div>
      <div class="cell diff" data-subject="astro" data-env="earth"><span class="val"><span class="h-astro-earth">—</span> <span class="val-unit">m</span></span><span class="sub">v₀ <span class="v0-astro-earth">—</span> m/s</span></div>
      <div class="cell diff moon-cell" data-subject="astro" data-env="moon"><span class="val"><span class="h-astro-moon">—</span> <span class="val-unit">m</span></span><span class="sub">v₀ <span class="v0-astro-moon">—</span> m/s</span></div>
    </div>
  </div>

</main>
</div>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
/* ================================================================
   page-51 · 猿人·现代人·宇航员跳跃能力并排比较
   ================================================================ */

Deck.init({ index: 51, total: 60 });

Lec.mount({
  kicker: 'COMPARISON',
  title: '谁跳得最高？三个身体，三种重力',
  take: '同一具身体，不同重力，跳跃高度的天壤之别。'
});

(function() {
  /* ---- 从 Lec 取全部数据 ---- */
  var EG  = Lec.K.EARTH_GRAVITY;          // 9.8
  var MG  = Lec.K.MOON_GRAVITY;           // 1.62
  var hE  = Lec.K.HUMAN_VERTICAL_JUMP_EARTH; // 0.5
  var v0E = Lec.K.HUMAN_JUMP_INITIAL_VELOCITY; // sqrt(2*9.8*0.5) ≈ 3.13
  var mH  = Lec.K.ASTRONAUT_MASS;         // 70
  var mS  = Lec.K.EVA_SUIT_MASS;          // 130
  var mT  = Lec.K.TOTAL_EVA_MASS;         // 200

  var aust = Lec.P.getHominidData('australopithecus_afarensis');
  var mA   = aust.mass;                   // 30

  /* ---- 计算各主体各环境数据 ---- */
  // 南方古猿：地球跳跃高度取人类基线 0.5m（页表第11页口径）
  var hAe = hE;  // 0.5 m
  var vAe = Lec.P.initialVelocityForJumpHeight(hAe, EG);
  var hAm = Lec.P.transferJumpHeight(hAe, EG, MG);
  var vAm = vAe; // 质量不变，初速度相同

  // 现代智人
  var hHe = hE;  // 0.5 m
  var vHe = v0E;
  var hHm = Lec.P.transferJumpHeight(hHe, EG, MG);
  var vHm = vHe;

  // 宇航员：初速度因宇航服质量降低
  var vFactor = mH / mT;  // 70/200 = 0.35
  var vSe = v0E * vFactor;
  var hSe = Lec.P.jumpHeightFromVelocity(vSe, EG);

  // 宇航员月球：按页表第35页口径约 1.5 m
  var hSm = 1.5;
  var vSm = Lec.P.initialVelocityForJumpHeight(hSm, MG);

  /* ---- 填充 ledger 表格数值 ---- */
  function $(sel) { return document.querySelector(sel); }
  function fmt(n, d) { return n.toFixed(d); }

  // 南方古猿
  $('.h-aust-earth').textContent = fmt(hAe, 1);
  $('.v0-aust-earth').textContent = fmt(vAe, 1);
  $('.h-aust-moon').textContent = fmt(hAm, 1);
  $('.v0-aust-moon').textContent = fmt(vAm, 1);
  $('.mass-aust').textContent = mA;

  // 现代智人
  $('.h-human-earth').textContent = fmt(hHe, 1);
  $('.v0-human-earth').textContent = fmt(vHe, 1);
  $('.h-human-moon').textContent = fmt(hHm, 1);
  $('.v0-human-moon').textContent = fmt(vHm, 1);
  $('.mass-human').textContent = mH;

  // 宇航员
  $('.h-astro-earth').textContent = fmt(hSe, 2);
  $('.v0-astro-earth').textContent = fmt(vSe, 1);
  $('.h-astro-moon').textContent = fmt(hSm, 1);
  $('.v0-astro-moon').textContent = fmt(vSm, 1);
  $('.mass-astro').textContent = mT;

  /* ---- echarts 柱状图 ---- */
  var chartDom = document.getElementById('bar-chart');
  var chart = echarts.init(chartDom, null, { renderer: 'svg' });

  var barData = [
    { value: hAe, subject: 'aust', env: 'earth', label: '南方古猿\n地球' },
    { value: hHe, subject: 'human', env: 'earth', label: '现代人\n地球' },
    { value: hSe, subject: 'astro', env: 'earth', label: '宇航员\n地球' },
    { value: hSm, subject: 'astro', env: 'moon',  label: '宇航员\n月球' }
  ];

  var colors = {
    aust:  '#c4956a',
    human: '#60a5fa',
    astro: '#8899aa'
  };

  var option = {
    textStyle: { fontSize: 16, fontFamily: 'Inter, system-ui, sans-serif' },
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'shadow' },
      textStyle: { fontSize: 15 },
      formatter: function(params) {
        var p = params[0];
        var d = barData[p.dataIndex];
        var subjectNames = { aust: '南方古猿', human: '现代人', astro: '宇航员' };
        var envNames = { earth: '地球 9.8 m/s²', moon: '月球 1.62 m/s²' };
        return subjectNames[d.subject] + ' · ' + envNames[d.env] +
               '<br/><b>' + fmt(d.value, d.value < 0.1 ? 2 : 1) + ' m</b>';
      }
    },
    grid: { left: 60, right: 30, top: 28, bottom: 48 },
    xAxis: {
      type: 'category',
      data: barData.map(function(d) { return d.label; }),
      axisLabel: { fontSize: 14, color: '#a0b0c0', interval: 0 },
      axisLine: { lineStyle: { color: '#334455' } },
      axisTick: { show: false }
    },
    yAxis: {
      type: 'value',
      name: '跳跃高度 (m)',
      nameTextStyle: { fontSize: 14, color: '#8899aa' },
      axisLabel: { fontSize: 13, color: '#8899aa' },
      splitLine: { lineStyle: { color: '#243040' } },
      min: 0,
      max: function(value) { return Math.ceil((value.max + 0.3) * 2) / 2; }
    },
    series: [{
      type: 'bar',
      data: barData.map(function(d, i) {
        var isMoon = d.env === 'moon';
        var c = colors[d.subject];
        return {
          value: d.value,
          itemStyle: {
            color: isMoon ? 'transparent' : c,
            borderColor: c,
            borderWidth: isMoon ? 2.5 : 0,
            borderType: isMoon ? 'dashed' : 'solid',
            borderRadius: isMoon ? [4,4,0,0] : [4,4,0,0],
            opacity: isMoon ? 0.7 : 1
          },
          emphasis: {
            itemStyle: {
              borderWidth: isMoon ? 3.5 : 0,
              borderColor: '#ffb832',
              shadowBlur: 12,
              shadowColor: 'rgba(255,184,50,0.35)'
            }
          }
        };
      }),
      barWidth: '40%',
      label: {
        show: true,
        position: 'top',
        fontSize: 14,
        color: '#a0b0c0',
        formatter: function(p) {
          return fmt(p.value, p.value < 0.1 ? 2 : 1) + ' m';
        }
      }
    }]
  };

  chart.setOption(option);

  /* ---- 交互: 点击柱体 → 高亮对应行 ---- */
  var currentSubject = null;

  function clearHighlight() {
    var cells = document.querySelectorAll('.cmp-ledger .cell.hl, .cmp-ledger .dim.hl');
    cells.forEach(function(el) { el.classList.remove('hl'); });
    chart.dispatchAction({ type: 'downplay', seriesIndex: 0 });
    currentSubject = null;
  }

  function highlightSubject(subj) {
    clearHighlight();
    currentSubject = subj;
    // 高亮表格行
    var cells = document.querySelectorAll('.cmp-ledger [data-subject="' + subj + '"]');
    cells.forEach(function(el) { el.classList.add('hl'); });
    // 高亮对应柱体
    barData.forEach(function(d, i) {
      if (d.subject === subj) {
        chart.dispatchAction({ type: 'highlight', seriesIndex: 0, dataIndex: i });
      }
    });
  }

  chart.on('click', function(params) {
    if (params.componentType === 'series') {
      var d = barData[params.dataIndex];
      highlightSubject(d.subject);
    }
  });

  // 点击表格单元格
  document.getElementById('ledger').addEventListener('click', function(e) {
    var cell = e.target.closest('.cell');
    if (!cell) return;
    var subj = cell.getAttribute('data-subject');
    if (subj) {
      if (subj === currentSubject) {
        clearHighlight();
      } else {
        highlightSubject(subj);
      }
    }
  });

  // 点击空白取消高亮
  chart.on('click', function(params) {
    if (params.componentType !== 'series') {
      clearHighlight();
    }
  });

  /* ---- 响应式: reduced-motion ---- */
  if (Deck.reduced && Deck.reduced()) {
    // 静态即可，无持续动画
  }

  /* ---- resize ---- */
  window.addEventListener('resize', function() {
    chart.resize();
  });

})();
</script>
</body>
</html>
