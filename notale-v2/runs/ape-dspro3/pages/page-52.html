<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第 52 页 · 互动讲义</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* === Page 52: 演化时间线 · 跳跃能力与重力 === */

    #main {
      display: flex;
      flex-direction: row;
      gap: var(--sp-8);
      height: 100%;
    }

    .tz {
      flex: 7;
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      min-width: 0;
    }

    .tz-svg-wrap {
      flex: 1;
      min-height: 0;
    }

    #timeline-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .gstrip {
      height: 46px;
      flex-shrink: 0;
      background: rgba(77,166,255,0.07);
      border: 1px solid rgba(77,166,255,0.18);
      border-radius: var(--r-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-3);
    }

    .gstrip .gl { font-size: var(--fs-label); color: var(--accent); font-weight: 600; }
    .gstrip .gv { font-size: 20px; font-weight: 700; color: var(--text); font-family: var(--font-mono); }
    .gstrip .gn { font-size: var(--fs-label); color: var(--text-dim); }

    @keyframes gflash {
      0%, 100% { background: rgba(77,166,255,0.07); }
      50%      { background: rgba(77,166,255,0.25); }
    }

    .gstrip.flash { animation: gflash 0.5s ease-in-out 2; }

    .ks {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: var(--sp-1);
    }

    .ks p {
      font-size: var(--fs-sec);
      color: var(--text-sec);
      line-height: 1.5;
      margin: 0;
    }

    .ks p .em { color: var(--accent); font-weight: 600; }

    .cp {
      flex: 3;
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
      min-width: 0;
    }

    .cp .cpt {
      font-size: var(--fs-h2);
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    .cp .cpi {
      font-size: var(--fs-sec);
      color: var(--text-sec);
      line-height: 1.45;
      min-height: 3em;
    }

    .cp .cpi .nm { color: var(--text); font-weight: 600; }

    #compare-svg {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: block;
    }

    @media (prefers-reduced-motion: reduce) {
      .gstrip.flash { animation: none; }
    }
  </style>
</head>
<body data-page="52" data-total="60">
  <div id="stage">
    <main id="main">

      <div class="tz">
        <div class="tz-svg-wrap">
          <svg id="timeline-svg"></svg>
        </div>

        <div class="gstrip" id="gstrip">
          <span class="gl">地球重力加速度</span>
          <span class="gv" id="gv"></span>
          <span class="gn">— 贯穿整个演化史，从未改变</span>
        </div>

        <div class="ks">
          <p>演化用数百万年打磨出一套在地球重力下跳 <span class="em">0.4–0.6 m</span> 的骨骼肌肉系统，它从未"练习"过低重力，但当人类站上月球，这套系统意外地跳出了 <span class="em">3.6 m</span> —— 不是演化有远见，而是物理规律对所有人都一样。</p>
          <p>从南方古猿到宇航员，跳跃能力的提升来自骨骼结构的逐步优化，而非重力环境的改变；低重力环境是工程送给演化遗产的一份礼物。</p>
        </div>
      </div>

      <div class="cp panel panel--raised">
        <div class="cpt">若在低重力星球上…</div>
        <div class="cpi" id="cpi"></div>
        <svg id="compare-svg"></svg>
      </div>

    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
  (function() {
    Deck.init({ index: 52, total: 60 });

    Lec.mount({
      index: 52,
      kicker: '星际跳跃',
      title: '演化时间线：跳跃能力与重力',
      take: '演化从未"预见"低重力，但身体意外胜任'
    });

    var G  = Lec.K.EARTH_GRAVITY;
    var GM = Lec.K.MOON_GRAVITY;
    var GX = Lec.K.MARS_GRAVITY;
    var V0_HUMAN = Lec.K.HUMAN_JUMP_INITIAL_VELOCITY;
    var H_EARTH  = Lec.K.HUMAN_VERTICAL_JUMP_EARTH;
    var M_ASTRO  = Lec.K.ASTRONAUT_MASS;
    var M_TOTAL  = Lec.K.TOTAL_EVA_MASS;

    var modernData = Lec.P.getHominidData('homo_sapiens_modern');
    var MODERN_HEIGHT = modernData.height;

    var STAGE_DEFS = [
      { hkey: 'australopithecus_afarensis', name: '南方古猿\n阿法种',   yearsAgo: 3.2 },
      { hkey: 'homo_habilis',               name: '能人',               yearsAgo: 2.0 },
      { hkey: 'homo_erectus',               name: '直立人',             yearsAgo: 1.5 },
      { hkey: 'homo_sapiens_early',         name: '智人\n（早期）',     yearsAgo: 0.3 },
      { hkey: null,                         name: '现代人\n（未训练）', yearsAgo: 0.15 },
      { hkey: null,                         name: '宇航员\n（穿宇航服）', yearsAgo: 0.04 }
    ];

    function buildStageData() {
      return STAGE_DEFS.map(function(def, i) {
        var jumpHeight, v0, rawName;

        if (def.hkey) {
          var hd = Lec.P.getHominidData(def.hkey);
          rawName = def.name.replace(/\n/g, '');
          var ratio = hd.height / MODERN_HEIGHT;
          jumpHeight = ratio * H_EARTH;
          v0 = Lec.P.initialVelocityForJumpHeight(jumpHeight, G);
        } else if (i === 4) {
          jumpHeight = H_EARTH;
          v0 = V0_HUMAN;
          rawName = '现代人（未训练）';
        } else {
          jumpHeight = H_EARTH;
          v0 = V0_HUMAN;
          var massRatio = M_ASTRO / M_TOTAL;
          v0 = v0 * massRatio;
          jumpHeight = Lec.P.jumpHeightFromVelocity(v0, G);
          rawName = '宇航员（穿宇航服）';
        }

        var moonH = Lec.P.transferJumpHeight(jumpHeight, G, GM);
        var marsH = Lec.P.transferJumpHeight(jumpHeight, G, GX);

        return {
          name: def.name,
          rawName: rawName,
          yearsAgo: def.yearsAgo,
          jumpHeight: jumpHeight,
          v0: v0,
          moonH: moonH,
          marsH: marsH
        };
      });
    }

    var stageData = buildStageData();
    var selectedIdx = 0;

    var timelineSvgEl = document.getElementById('timeline-svg');
    var compareSvgEl  = document.getElementById('compare-svg');
    var cpiEl         = document.getElementById('cpi');
    var gstripEl      = document.getElementById('gstrip');
    var gvEl          = document.getElementById('gv');

    gvEl.textContent = G.toFixed(1) + ' m/s\u00B2';

    // ---- drawTimeline ----
    function drawTimeline() {
      var svg = d3.select(timelineSvgEl);
      svg.selectAll('*').remove();

      var rect = timelineSvgEl.getBoundingClientRect();
      var W = rect.width;
      var H = rect.height;
      if (W <= 0 || H <= 0) return;

      var margin = { top: 58, right: 40, bottom: 64, left: 40 };
      var iW = W - margin.left - margin.right;
      var iH = H - margin.top - margin.bottom;
      var axisY = iH * 0.45;

      var g = svg.append('g')
        .attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');

      var xScale = d3.scaleSqrt().domain([4, 0]).range([0, iW]);

      // axis
      g.append('line')
        .attr('x1', 0).attr('x2', iW)
        .attr('y1', axisY).attr('y2', axisY)
        .attr('stroke', 'var(--border-strong)')
        .attr('stroke-width', 2)
        .attr('stroke-linecap', 'round');

      g.append('circle').attr('cx', 0).attr('cy', axisY).attr('r', 3)
        .attr('fill', 'var(--border-strong)');
      g.append('circle').attr('cx', iW).attr('cy', axisY).attr('r', 3)
        .attr('fill', 'var(--border-strong)');

      // ticks
      var tickValues = [4, 3, 2, 1, 0];
      tickValues.forEach(function(t) {
        var x = xScale(t);
        g.append('line')
          .attr('x1', x).attr('x2', x)
          .attr('y1', axisY - 5).attr('y2', axisY + 5)
          .attr('stroke', 'var(--border)')
          .attr('stroke-width', 1);

        var label = t === 0 ? '现在' : (t + ' 百万年前');
        g.append('text')
          .attr('x', x).attr('y', axisY + 20)
          .attr('text-anchor', 'middle')
          .attr('fill', 'var(--text-dim)')
          .style('font-size', 'var(--fs-tick)')
          .style('font-family', 'var(--font-sans)')
          .text(label);
      });

      // segment arrows
      for (var i = 0; i < stageData.length - 1; i++) {
        var x1 = xScale(stageData[i].yearsAgo);
        var x2 = xScale(stageData[i + 1].yearsAgo);
        var done = i < selectedIdx;

        g.append('line')
          .attr('x1', x1 + 15).attr('x2', x2 - 15)
          .attr('y1', axisY).attr('y2', axisY)
          .attr('stroke', done ? 'var(--accent-soft)' : 'var(--border)')
          .attr('stroke-width', done ? 2.5 : 1.5)
          .attr('stroke-dasharray', done ? 'none' : '5,4')
          .attr('opacity', done ? 0.8 : 0.45);

        var ax = x2 - 17;
        g.append('polygon')
          .attr('points', ax + ',' + (axisY - 5) + ' ' + (ax + 8) + ',' + axisY + ' ' + ax + ',' + (axisY + 5))
          .attr('fill', done ? 'var(--accent-soft)' : 'var(--border)')
          .attr('opacity', done ? 0.8 : 0.45);
      }

      // nodes
      stageData.forEach(function(d, i) {
        var cx = xScale(d.yearsAgo);
        var cy = axisY;
        var isSel = i === selectedIdx;
        var r = isSel ? 13 : 8;
        var nameAbove = !(i === 5);

        if (isSel) {
          g.append('circle')
            .attr('cx', cx).attr('cy', cy)
            .attr('r', 20)
            .attr('fill', 'none')
            .attr('stroke', 'var(--accent)')
            .attr('stroke-width', 2)
            .attr('stroke-dasharray', '5,3')
            .attr('opacity', 0.55);
        }

        g.append('circle')
          .attr('cx', cx).attr('cy', cy)
          .attr('r', r)
          .attr('fill', isSel ? 'var(--accent)' : 'var(--surface-raised)')
          .attr('stroke', isSel ? 'var(--accent)' : 'var(--border-strong)')
          .attr('stroke-width', isSel ? 3 : 1.5)
          .attr('cursor', 'pointer')
          .on('click', function() { selectNode(i); });

        var nameLines = d.name.split('\n');
        var nameYBase = nameAbove ? (cy - 18 - (nameLines.length - 1) * 17) : (cy + 20);
        nameLines.forEach(function(line, li) {
          var yOff = nameAbove ? (- (nameLines.length - 1 - li) * 17) : (li * 17);
          g.append('text')
            .attr('x', cx)
            .attr('y', nameYBase + yOff)
            .attr('text-anchor', 'middle')
            .attr('fill', isSel ? 'var(--text)' : 'var(--text-sec)')
            .style('font-size', isSel ? 'var(--fs-sec)' : 'var(--fs-label)')
            .style('font-weight', isSel ? 600 : 400)
            .style('font-family', 'var(--font-sans)')
            .text(line);
        });

        var yrLabel = d.yearsAgo >= 1
          ? d.yearsAgo.toFixed(1) + ' Mya'
          : (d.yearsAgo >= 0.001
            ? (d.yearsAgo * 1000).toFixed(0) + ' kya'
            : '约 60 年前');
        var yrY = nameAbove ? (cy + (isSel ? 26 : 20)) : (cy - (isSel ? 26 : 20));
        g.append('text')
          .attr('x', cx)
          .attr('y', yrY)
          .attr('text-anchor', 'middle')
          .attr('fill', 'var(--text-dim)')
          .style('font-size', 'var(--fs-tick)')
          .style('font-family', 'var(--font-sans)')
          .text(yrLabel);
      });

      // indicator
      var sel = stageData[selectedIdx];
      var indicatorX = xScale(sel.yearsAgo);

      var indicator = g.append('g')
        .attr('transform', 'translate(' + indicatorX + ',0)');

      indicator.append('line')
        .attr('x1', 0).attr('x2', 0)
        .attr('y1', 6).attr('y2', iH - 6)
        .attr('stroke', 'var(--accent)')
        .attr('stroke-width', 2)
        .attr('stroke-dasharray', '6,4')
        .attr('opacity', 0.7);

      var handle = indicator.append('rect')
        .attr('x', -10).attr('y', axisY - 14)
        .attr('width', 20).attr('height', 28)
        .attr('rx', 4)
        .attr('fill', 'var(--accent)')
        .attr('opacity', 0.85)
        .attr('cursor', 'grab');

      indicator.append('polygon')
        .attr('points', '-6,' + (axisY + 14) + ' 6,' + (axisY + 14) + ' 0,' + (axisY + 20))
        .attr('fill', 'var(--accent)')
        .attr('opacity', 0.85);

      var drag = d3.drag()
        .on('start', function() {
          handle.attr('cursor', 'grabbing').attr('opacity', 1);
        })
        .on('drag', function(event) {
          var nx = Math.max(0, Math.min(iW, event.x));
          indicator.attr('transform', 'translate(' + nx + ',0)');
        })
        .on('end', function(event) {
          handle.attr('cursor', 'grab').attr('opacity', 0.85);
          var nx = Math.max(0, Math.min(iW, event.x));
          var bestI = 0;
          var bestDist = Infinity;
          stageData.forEach(function(d, i) {
            var dist = Math.abs(xScale(d.yearsAgo) - nx);
            if (dist < bestDist) { bestDist = dist; bestI = i; }
          });
          selectNode(bestI);
        });

      handle.call(drag);

      svg.property('_indicator', indicator);
      svg.property('_xScale', xScale);
      svg.property('_iW', iW);
      svg.property('_iH', iH);
    }

    // ---- drawComparison ----
    function drawComparison() {
      var svg = d3.select(compareSvgEl);
      svg.selectAll('*').remove();

      var rect = compareSvgEl.getBoundingClientRect();
      var W = rect.width;
      var H = rect.height;
      if (W <= 0 || H <= 0) return;

      var margin = { top: 16, right: 24, bottom: 46, left: 62 };
      var iW = W - margin.left - margin.right;
      var iH = H - margin.top - margin.bottom;

      var g = svg.append('g')
        .attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');

      var sel = stageData[selectedIdx];

      var bodies = [
        { label: '月球', grav: GM, height: sel.moonH, color: 'var(--accent)' },
        { label: '火星', grav: GX, height: sel.marsH, color: 'var(--warn)' }
      ];

      var maxH = Math.max(sel.moonH, sel.marsH, 0.5) * 1.2;
      var barW = Math.min(72, iW / 3.5);

      var yScale = d3.scaleLinear().domain([0, maxH]).range([iH, 0]);

      g.append('g')
        .call(d3.axisLeft(yScale).ticks(4))
        .style('font-size', 'var(--fs-tick)')
        .style('font-family', 'var(--font-sans)')
        .style('color', 'var(--text-dim)');

      g.append('text')
        .attr('x', -8).attr('y', -6)
        .attr('text-anchor', 'end')
        .attr('fill', 'var(--text-dim)')
        .style('font-size', 'var(--fs-label)')
        .style('font-family', 'var(--font-sans)')
        .text('跳跃高度 (m)');

      var groupSpacing = iW / 2;
      bodies.forEach(function(b, bi) {
        var cx = groupSpacing * (bi + 0.5);
        var barH = iH - yScale(b.height);

        g.append('rect')
          .attr('x', cx - barW / 2)
          .attr('y', yScale(b.height))
          .attr('width', barW)
          .attr('height', Math.max(0, barH))
          .attr('fill', b.color)
          .attr('rx', 4)
          .attr('opacity', 0.85);

        g.append('text')
          .attr('x', cx)
          .attr('y', yScale(b.height) - 8)
          .attr('text-anchor', 'middle')
          .attr('fill', 'var(--text)')
          .style('font-size', 'var(--fs-sec)')
          .style('font-weight', 700)
          .style('font-family', 'var(--font-mono)')
          .text(b.height.toFixed(2) + ' m');

        g.append('text')
          .attr('x', cx).attr('y', iH + 18)
          .attr('text-anchor', 'middle')
          .attr('fill', 'var(--text)')
          .style('font-size', 'var(--fs-sec)')
          .style('font-weight', 600)
          .style('font-family', 'var(--font-sans)')
          .text(b.label);

        g.append('text')
          .attr('x', cx).attr('y', iH + 34)
          .attr('text-anchor', 'middle')
          .attr('fill', 'var(--text-dim)')
          .style('font-size', 'var(--fs-label)')
          .style('font-family', 'var(--font-sans)')
          .text(b.grav.toFixed(2) + ' m/s\u00B2');
      });

      var earthY = yScale(sel.jumpHeight);
      if (earthY > 0 && earthY < iH) {
        g.append('line')
          .attr('x1', 0).attr('x2', iW)
          .attr('y1', earthY).attr('y2', earthY)
          .attr('stroke', 'var(--text-dim)')
          .attr('stroke-width', 1)
          .attr('stroke-dasharray', '5,4')
          .attr('opacity', 0.45);

        g.append('text')
          .attr('x', iW - 4).attr('y', earthY - 5)
          .attr('text-anchor', 'end')
          .attr('fill', 'var(--text-dim)')
          .style('font-size', 'var(--fs-tick)')
          .style('font-family', 'var(--font-sans)')
          .text('地球 ' + sel.jumpHeight.toFixed(2) + ' m');
      }
    }

    // ---- updateStageInfo ----
    function updateStageInfo() {
      var sel = stageData[selectedIdx];
      var yrStr = sel.yearsAgo >= 1
        ? sel.yearsAgo.toFixed(1) + ' 百万年'
        : (sel.yearsAgo >= 0.001
          ? (sel.yearsAgo * 1000).toFixed(0) + ' 千年'
          : '约 60 年');
      cpiEl.innerHTML =
        '<span class="nm">' + sel.rawName + '</span>'
        + ' · 距今 ' + yrStr + '<br>'
        + '地球跳跃高度：<b>' + sel.jumpHeight.toFixed(2) + ' m</b>  '
        + '初速度：<b>' + sel.v0.toFixed(2) + ' m/s</b>';
    }

    // ---- selectNode ----
    function selectNode(idx) {
      if (idx === selectedIdx) return;
      selectedIdx = idx;
      drawTimeline();
      drawComparison();
      updateStageInfo();

      if (!Deck.reduced()) {
        gstripEl.classList.remove('flash');
        void gstripEl.offsetWidth;
        gstripEl.classList.add('flash');
      }
    }

    // ---- init ----
    drawTimeline();
    drawComparison();
    updateStageInfo();

    var resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        drawTimeline();
        drawComparison();
      }, 200);
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight' && selectedIdx < stageData.length - 1) {
        e.preventDefault();
        selectNode(selectedIdx + 1);
      } else if (e.key === 'ArrowLeft' && selectedIdx > 0) {
        e.preventDefault();
        selectNode(selectedIdx - 1);
      }
    });

  })();
  </script>
</body>
</html>
