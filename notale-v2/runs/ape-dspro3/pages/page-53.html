<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第 53 页 · 互动讲义</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* ── Arrow Diagram ── */
    .ad-outer {
      width: 100%;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .ad-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-8);
    }

    .ad-box {
      width: 130px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--fs-lead);
      font-weight: 600;
      color: var(--text);
      border-radius: var(--r-md);
    }

    .ad-dst-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .ad-dst-box {
      width: 170px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--fs-lead);
      font-weight: 700;
      color: var(--accent);
      text-align: center;
      line-height: 1.35;
      border-radius: var(--r-lg);
    }

    .ad-arrows {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-8);
      margin: 0 var(--sp-2);
      color: var(--border-strong);
      flex-shrink: 0;
    }

    .ad-arrows svg {
      display: block;
    }

    .ad-converge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 var(--sp-2);
      color: var(--border-strong);
      flex-shrink: 0;
    }

    .ad-converge svg {
      display: block;
    }

    /* ── Gentle fade for the diagram ── */
    .ad-outer .panel {
      transition: none;
    }
  </style>
</head>
<body data-page="53" data-total="60">
  <div id="stage">
    <main id="main">
      <div class="k-generalization" style="height:100%; justify-content:center; gap: var(--sp-6);">

        <!-- ═══ Arrow Diagram ═══ -->
        <div class="ad-outer">

          <!-- Left: sources -->
          <div class="ad-col">
            <div class="panel ad-box">演化</div>
            <div class="panel ad-box">工程</div>
          </div>

          <!-- Horizontal arrows -->
          <div class="ad-arrows">
            <svg width="64" height="48" viewBox="0 0 64 48" aria-hidden="true">
              <line x1="0" y1="24" x2="46" y2="24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
              <polygon points="42,18 64,24 42,30" fill="#4da6ff"/>
            </svg>
            <svg width="64" height="48" viewBox="0 0 64 48" aria-hidden="true">
              <line x1="0" y1="24" x2="46" y2="24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
              <polygon points="42,18 64,24 42,30" fill="#4da6ff"/>
            </svg>
          </div>

          <!-- Middle: intermediates -->
          <div class="ad-col">
            <div class="panel ad-box">身体</div>
            <div class="panel ad-box">环境</div>
          </div>

          <!-- Converging arrows -->
          <div class="ad-converge">
            <svg width="80" height="128" viewBox="0 0 80 128" aria-hidden="true">
              <line x1="0" y1="24" x2="58" y2="64" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
              <line x1="0" y1="104" x2="58" y2="64" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
              <polygon points="54,58 80,64 54,70" fill="#4da6ff"/>
            </svg>
          </div>

          <!-- Right: destination -->
          <div class="ad-dst-wrap">
            <div class="panel panel--raised ad-dst-box">太空中的<br>新能力</div>
          </div>

        </div>

        <!-- ═══ Supports ═══ -->
        <div class="supports">
          <div class="support">
            演化赋予身体一套工具包：下肢骨骼为直立行走与跳跃而优化——不是为太空设计的，但提供了肌肉力量与神经控制的基础。
          </div>
          <div class="support">
            工程重写环境的规则：宇航服与加压舱改变了重力场与气压——从 <span data-lec="EARTH_GRAVITY"></span> 到 <span data-lec="MOON_GRAVITY"></span>&thinsp;m/s²，让身体在不可能的环境里活动。
          </div>
          <div class="support">
            对话的结果是新能力：同一具身体，在月球上跳 <span data-lec="moonJump"></span>&thinsp;m，在火星上跳约 1.6&thinsp;m——演化没有预见，但身体意外胜任。
          </div>
        </div>

        <!-- ═══ Claim ═══ -->
        <div class="claim">
          演化没有"准备"太空，但也没有"反对"太空。身体是工程的基础，不是工程的敌人。这一章要讲的是两者如何对话，而不是谁赢了。
        </div>

      </div>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    (function() {
      Deck.init({ index: 53, total: 60 });

      Lec.mount({
        index: 53,
        kicker: '第五章',
        title: '演化与工程',
        take: '演化赋予身体，工程赋予环境，对话重新定义能力'
      });

      /* Populate Lec values into support texts */
      var eg = Lec.K.EARTH_GRAVITY;
      var mg = Lec.K.MOON_GRAVITY;
      var mj = Lec.P.transferJumpHeight(0.4, eg, mg);

      var el = document.querySelector('[data-lec="EARTH_GRAVITY"]');
      if (el) el.textContent = eg;

      var ml = document.querySelector('[data-lec="MOON_GRAVITY"]');
      if (ml) ml.textContent = mg;

      var jl = document.querySelector('[data-lec="moonJump"]');
      if (jl) jl.textContent = mj.toFixed(1);
    })();
  </script>
</body>
</html>
