<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 54 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ============================================================
   page-54 — 太空服技术演进 · classification · triptych
   ============================================================ */

#main {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 0;
  padding: 0;
}

/* 分类骨架 box */
.k-classification .box {
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: var(--sp-4) var(--sp-5);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.k-classification .bt {
  font-size: var(--fs-h2);
  font-weight: 600;
  color: var(--text);
  margin-bottom: 0;
  padding-bottom: var(--sp-2);
  border-bottom: 1px solid var(--border);
}

/* 三卡片行 */
.cards-row {
  display: flex;
  flex-direction: row;
  gap: var(--sp-4);
  flex-shrink: 0;
}

/* 单张卡片 */
.suit-card {
  flex: 1 1 0%;
  min-width: 0;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
  cursor: pointer;
  transition: border-color 200ms var(--ease), box-shadow 200ms var(--ease);
}

.suit-card:hover { border-color: var(--accent-soft); }

.suit-card:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.suit-card.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 2px 12px rgba(77,166,255,0.12);
}

/* 卡片照片 */
.suit-card .card-photo {
  width: 100%;
  height: 130px;
  object-fit: cover;
  display: block;
  background: var(--bg);
}

/* 卡片信息 */
.suit-card .card-body {
  padding: var(--sp-2) var(--sp-3);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.suit-card .card-name {
  font-size: var(--fs-body);
  font-weight: 600;
  line-height: 1.35;
}

.suit-card .card-era {
  font-size: var(--fs-label);
  color: var(--text-dim);
  line-height: 1.35;
}

/* 迷你指标条 */
.suit-card .mini-bars {
  display: flex;
  flex-direction: row;
  gap: var(--sp-2);
  padding-top: 2px;
}

.mini-bar {
  flex: 1 1 0%;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.mini-bar .bar-label {
  font-size: var(--fs-label);
  color: var(--text-dim);
  line-height: 1.35;
}

.mini-bar .bar-track {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.mini-bar .bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 300ms var(--ease);
}

.bar-fill.mass-fill  { background: var(--warn); }
.bar-fill.flex-fill  { background: var(--ok); }
.bar-fill.press-fill { background: var(--accent); }

/* 展开面板 — 在正常流中，位于卡片行下方 */
.expand-panel {
  display: none;
  flex-direction: column;
  gap: var(--sp-3);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-md);
  padding: var(--sp-4);
  box-shadow: var(--shadow-md);
  flex-shrink: 0;
}

.expand-panel.show { display: flex; }

.expand-panel .panel-header {
  display: flex;
  flex-direction: row;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-3);
}

.expand-panel .panel-suit-name {
  font-size: var(--fs-h2);
  font-weight: 700;
  color: var(--accent);
  line-height: 1.3;
}

.expand-panel .panel-era {
  font-size: var(--fs-label);
  color: var(--text-dim);
}

/* 规格 + 对比并排 */
.expand-panel .detail-row {
  display: flex;
  flex-direction: row;
  gap: var(--sp-4);
  align-items: flex-start;
}

/* 规格网格 — 3列 */
.expand-panel .spec-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: var(--sp-2);
  flex: 1.6 1 0%;
  min-width: 0;
}

.expand-panel .spec-item {
  display: flex;
  flex-direction: row;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-1);
  padding: 2px var(--sp-2);
  background: var(--surface-raised);
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
}

.expand-panel .spec-label {
  font-size: var(--fs-label);
  color: var(--text-dim);
  line-height: 1.35;
  white-space: nowrap;
}

.expand-panel .spec-value {
  font-size: var(--fs-sec);
  font-weight: 600;
  color: var(--text);
  line-height: 1.35;
  text-align: right;
  white-space: nowrap;
}

/* 三列对比条 */
.expand-panel .compare-col {
  flex: 1 1 0%;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.expand-panel .compare-label {
  font-size: var(--fs-label);
  font-weight: 600;
  color: var(--text);
  text-align: center;
  line-height: 1.35;
}

.expand-panel .compare-bars {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.expand-panel .cbar {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--sp-1);
}

.expand-panel .cbar-name {
  font-size: var(--fs-label);
  color: var(--text-dim);
  width: 28px;
  text-align: right;
  flex-shrink: 0;
  line-height: 1.35;
}

.expand-panel .cbar-track {
  flex: 1 1 0%;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  min-width: 0;
}

.expand-panel .cbar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 300ms var(--ease);
}

.expand-panel .cbar-val {
  font-size: var(--fs-tick);
  color: var(--text-sec);
  width: 36px;
  text-align: left;
  flex-shrink: 0;
  line-height: 1.3;
}

/* 设计哲学 */
.expand-panel .philosophy {
  font-size: var(--fs-sec);
  color: var(--text-sec);
  line-height: 1.45;
  padding: var(--sp-2) var(--sp-3);
  background: var(--surface-raised);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
}

/* 插图条 */
.illustration-strip {
  border-radius: var(--r-sm);
  overflow: hidden;
  border: 1px solid var(--border);
  height: 64px;
  flex-shrink: 0;
}

.illustration-strip img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 30%;
  display: block;
}

/* 颜色主题 */
.suit-card[data-suit="apollo_a7l"] .card-name { color: var(--warn); }
.suit-card[data-suit="shuttle_emu"] .card-name { color: var(--accent); }
.suit-card[data-suit="spacex_eva"] .card-name { color: var(--ok); }

@media (prefers-reduced-motion: reduce) {
  .suit-card, .bar-fill, .cbar-fill { transition: none !important; }
}
</style>
</head>
<body data-page="54" data-total="60">
<div id="stage">
<main id="main" class="k-classification">

  <div class="box">
    <div class="bt">太空服技术代际比较</div>

    <div class="cards-row" id="cards-row">

      <!-- 阿波罗 A7L -->
      <div class="suit-card active" data-suit="apollo_a7l" tabindex="0" role="button" aria-label="阿波罗 A7L 宇航服，点击查看详情">
        <img class="card-photo" src="assets/img/p54-apollo-a7l.jpg" alt="阿波罗 A7L 宇航服" loading="lazy">
        <div class="card-body">

      <div class="suit-card" data-suit="shuttle_emu" tabindex="0" role="button" aria-label="航天飞机 EMU 宇航服，点击查看详情">
        <img class="card-photo" src="assets/img/p54-shuttle-emu.jpg" alt="航天飞机 EMU 宇航服" loading="lazy">

      <!-- SpaceX EVA -->
      <div class="suit-card" data-suit="spacex_eva" tabindex="0" role="button" aria-label="SpaceX EVA 套装，点击查看详情">
        <img class="card-photo" src="assets/img/p54-spacex-eva.jpg" alt="SpaceX EVA 套装" loading="lazy">
        <div class="card-body">
          <div class="card-name">SpaceX EVA</div>

          <div class="mini-bars">
            <div class="mini-bar"><span class="bar-label">质量</span><div class="bar-track"><div class="bar-fill mass-fill"></div></div></div>
            <div class="mini-bar"><span class="bar-label">灵活</span><div class="bar-track"><div class="bar-fill flex-fill"></div></div></div>

    <!-- 展开面板 — 正常流，位于卡片行下方 -->

        <div class="spec-grid" id="spec-grid"></div>

    <!-- 插图条 — 关节结构对比 -->
    <div class="illustration-strip">

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function() {
  'use strict';

  Deck.init({ index: 54, total: 60 });

  // ============================================================
  // 太空服数据
  // ============================================================
  Lec.P.getSuitData = function(generation) {
    var suits = {
      apollo_a7l: {
        name: '阿波罗 A7L',
        era: '1969–1972 · 月球',
        mass: 91,
        pressure: 25.5,
        flexibility: { hip_flexion: 45, shoulder_abduction: 90, glove_dexterity: 30 },
        joint_type: '恒容波纹管关节',
        visor_fov: 120,
        donning_time: 30,
        design_philosophy: '安全第一，灵活性妥协',
        key_limitation: '质量大、关节僵硬，月球上弯腰捡石头需要工具辅助'
      },
      shuttle_emu: {
        name: '航天飞机 EMU',
        era: '1981–至今 · ISS',
        mass: 130,
        pressure: 29.6,
        flexibility: { hip_flexion: 60, shoulder_abduction: 120, glove_dexterity: 55 },
        joint_type: '硬上躯干（HUT）+ 旋转轴承',
        visor_fov: 140,
        donning_time: 45,
        design_philosophy: '模块化、可维修、长期重复使用',
        key_limitation: '质量反而增加（增强防护），但微重力下操作不感知质量，感知的是惯性'
      },
      spacex_eva: {
        name: 'SpaceX EVA',
        era: '2024– · 近地轨道',
        mass: 50,
        pressure: 34.5,
        flexibility: { hip_flexion: 90, shoulder_abduction: 150, glove_dexterity: 85 },
        joint_type: '软壳主导，弹性织物关节',
        visor_fov: 160,
        donning_time: 10,
        design_philosophy: '轻量化、灵活优先、快速穿脱',
        key_limitation: '防护能力较EMU降低（设计用于近地轨道，非深空）'
      }
    };
    var data = suits[generation];
    if (!data) throw new Error('Unknown suit generation: ' + generation);
    return data;
  };

  var ALL_SUITS = ['apollo_a7l', 'shuttle_emu', 'spacex_eva'];

  function flexComposite(f) {
    return Math.round((f.hip_flexion + f.shoulder_abduction + f.glove_dexterity) / 3);
  }

  function getRange(key) {
    var vals = ALL_SUITS.map(function(k) {
      var d = Lec.P.getSuitData(k);
      if (key === 'flexibility') return flexComposite(d.flexibility);
      return d[key];
    });
    return { min: Math.min.apply(null, vals), max: Math.max.apply(null, vals) };
  }

  function normalizePct(val, min, max) {
    if (max === min) return 50;
    return Math.round(((val - min) / (max - min)) * 100);
  }

  // ============================================================
  // DOM
  // ============================================================
  var expandPanel = document.getElementById('expand-panel');
  var panelSuitName = document.getElementById('panel-suit-name');
  var panelEra = document.getElementById('panel-era');
  var specGrid = document.getElementById('spec-grid');
  var compareCol = document.getElementById('compare-col');
  var philosophyEl = document.getElementById('philosophy');
  var cards = document.querySelectorAll('.suit-card');
  var currentSuit = 'apollo_a7l';

  // ============================================================
  // 渲染展开面板
  // ============================================================
  function renderExpandPanel(suitKey) {
    var d = Lec.P.getSuitData(suitKey);
    var fc = flexComposite(d.flexibility);

    panelSuitName.textContent = d.name;
    panelEra.textContent = d.era;

    // 规格网格
    specGrid.innerHTML = '';
    var specs = [
      ['总质量', d.mass + ' kg'],
      ['关节类型', d.joint_type],
      ['工作压力', d.pressure + ' kPa'],
      ['髋屈曲', d.flexibility.hip_flexion + '°'],
      ['肩外展', d.flexibility.shoulder_abduction + '°'],
      ['手套灵活', d.flexibility.glove_dexterity + '/100'],
      ['面窗视野', d.visor_fov + '°'],
      ['穿脱时间', d.donning_time + ' min'],
      ['灵活综合', fc + '/100']
    ];
    specs.forEach(function(s) {
      var item = document.createElement('div');
      item.className = 'spec-item';
      var lbl = document.createElement('span');
      lbl.className = 'spec-label';
      lbl.textContent = s[0];
      var val = document.createElement('span');
      val.className = 'spec-value';
      val.textContent = s[1];
      item.appendChild(lbl);
      item.appendChild(val);
      specGrid.appendChild(item);
    });

    // 三列对比条
    var massRange = getRange('mass');
    var flexRange = getRange('flexibility');
    var pressRange = getRange('pressure');

    var metrics = [
      { key: 'mass', name: '质量', unit: 'kg', range: massRange, color: 'var(--warn)' },
      { key: 'flexibility', name: '灵活度', unit: '', range: flexRange, color: 'var(--ok)', composite: true },
      { key: 'pressure', name: '压力', unit: 'kPa', range: pressRange, color: 'var(--accent)' }
    ];

    compareCol.innerHTML = '';
    metrics.forEach(function(m) {
      var label = document.createElement('div');
      label.className = 'compare-label';
      label.textContent = m.name;
      compareCol.appendChild(label);

      var bars = document.createElement('div');
      bars.className = 'compare-bars';

      ALL_SUITS.forEach(function(sk) {
        var sd = Lec.P.getSuitData(sk);
        var val = m.composite ? flexComposite(sd.flexibility) : sd[m.key];
        var pct = normalizePct(val, m.range.min, m.range.max);

        var cbar = document.createElement('div');
        cbar.className = 'cbar';

        var nm = document.createElement('span');
        nm.className = 'cbar-name';
        // 短名用于对比条
        var shortNames = { apollo_a7l: 'A7L', shuttle_emu: 'EMU', spacex_eva: 'SX' };
        nm.textContent = shortNames[sk];

        var track = document.createElement('div');
        track.className = 'cbar-track';
        var fill = document.createElement('div');
        fill.className = 'cbar-fill';
        fill.style.width = pct + '%';
        fill.style.backgroundColor = m.color;
        track.appendChild(fill);

        var v = document.createElement('span');
        v.className = 'cbar-val';
        v.textContent = val + m.unit;

        cbar.appendChild(nm);
        cbar.appendChild(track);
        cbar.appendChild(v);
        bars.appendChild(cbar);
      });

      compareCol.appendChild(bars);
    });

    philosophyEl.textContent = d.design_philosophy + '。' + d.key_limitation + '。';
  }

  function selectCard(suitKey) {
    currentSuit = suitKey;
    cards.forEach(function(c) {
      c.classList.toggle('active', c.getAttribute('data-suit') === suitKey);
    });
    renderExpandPanel(suitKey);
    expandPanel.classList.add('show');
  }

  cards.forEach(function(card) {
    card.addEventListener('click', function() {
      selectCard(card.getAttribute('data-suit'));
    });
    card.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        selectCard(card.getAttribute('data-suit'));
      }
    });
  });

  // ============================================================
  // 挂载页眉
  // ============================================================
  Lec.mount({
    index: 54,
    kicker: '演化与工程',
    title: '太空服技术演进',
    take: '从硬壳到第二层皮肤：质量在减轻，灵活性在增加，工程正在为身体解放被重力束缚的能力。'
  });

  // ============================================================
  // 初始渲染
  // ============================================================
  var massRange = getRange('mass');
  var flexRange = getRange('flexibility');
  var pressRange = getRange('pressure');

  cards.forEach(function(card) {
    var sk = card.getAttribute('data-suit');
    var d = Lec.P.getSuitData(sk);
    var fc = flexComposite(d.flexibility);
    var bars = card.querySelectorAll('.bar-fill');
    if (bars.length >= 3) {
      bars[0].style.width = normalizePct(d.mass, massRange.min, massRange.max) + '%';
      bars[1].style.width = normalizePct(fc, flexRange.min, flexRange.max) + '%';
      bars[2].style.width = normalizePct(d.pressure, pressRange.min, pressRange.max) + '%';
    }
  });

  renderExpandPanel('apollo_a7l');

})();
</script>
</body>
</html>
