<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第 55 页 · 互动讲义</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/lib/matter.min.js"></script>
  <style>
    #main {
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
    }

    /* ---- 页面级 k-process 微调 ---- */
    .p55-process {
      flex-shrink: 0;
    }
    .p55-process .step {
      font-size: var(--fs-sec);
      padding: var(--sp-2) var(--sp-1);
      gap: var(--sp-1);
    }
    .p55-process .arw {
      font-size: var(--fs-body);
      width: 24px;
      padding-top: var(--sp-2);
    }
    .p55-process .step .tag {
      font-size: var(--fs-label);
      color: var(--text-dim);
      font-weight: 400;
      line-height: 1.35;
    }
    .p55-process .step.current .tag {
      color: var(--accent);
    }

    /* ---- split-lr ---- */
    .p55-split {
      display: flex;
      flex-direction: row;
      gap: var(--sp-8);
      flex: 1 1 0%;
      min-height: 0;
    }

    /* ---- 左面板 ---- */
    .p55-left {
      flex: 0 0 440px;
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
      min-height: 0;
    }

    .p55-sliders {
      display: flex;
      flex-direction: column;
      gap: var(--sp-5);
      flex-shrink: 0;
    }

    .p55-slider-block {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }

    .p55-slider-head {
      display: flex;
      flex-direction: row;
      align-items: baseline;
      justify-content: space-between;
    }

    .p55-slider-label {
      font-size: var(--fs-label);
      color: var(--text-sec);
      font-weight: 500;
    }

    .p55-slider-val {
      font-size: var(--fs-body);
      color: var(--accent);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .p55-slider-track {
      position: relative;
      height: 32px;
      display: flex;
      align-items: center;
    }

    .p55-slider-track input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--border);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      position: relative;
      z-index: 1;
    }

    .p55-slider-track input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(77,166,255,0.4);
      transition: box-shadow 150ms var(--ease);
    }

    .p55-slider-track input[type="range"]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      border-radius: 3px;
    }

    .p55-slider-track input[type="range"]::-webkit-slider-thumb:hover {
      box-shadow: 0 0 14px rgba(77,166,255,0.6);
    }

    .p55-slider-track input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(77,166,255,0.4);
    }

    /* 状态标记点 */
    .p55-marks {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 0;
    }

    .p55-mark {
      position: absolute;
      top: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      transform: translate(-50%, -50%);
      transition: background 200ms var(--ease), box-shadow 200ms var(--ease);
    }

    .p55-mark.active {
      background: var(--accent);
      box-shadow: 0 0 6px rgba(77,166,255,0.5);
    }

    /* ---- 效率面板 ---- */
    .p55-stats {
      display: flex;
      flex-direction: row;
      gap: var(--sp-4);
      flex-shrink: 0;
    }

    .p55-stat {
      flex: 1 1 0%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: var(--sp-4);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .p55-stat-val {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .p55-stat-unit {
      font-size: var(--fs-label);
      color: var(--text-dim);
      font-weight: 400;
    }

    .p55-stat-label {
      font-size: var(--fs-label);
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* ---- 洞察句 ---- */
    .p55-insight {
      font-size: var(--fs-sec);
      color: var(--text-sec);
      line-height: 1.45;
      padding: var(--sp-3) var(--sp-4);
      border-left: 3px solid var(--accent-soft);
      flex-shrink: 0;
    }

    /* ---- 右面板 ---- */
    .p55-right {
      flex: 1 1 0%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      min-height: 0;
    }

    .p55-illustration {
      flex: 0 0 140px;
      position: relative;
      border-radius: var(--r-md);
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .p55-illustration img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .p55-chart {
      flex: 1 1 0%;
      min-height: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
    }

    .p55-sim {
      flex: 0 0 140px;
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      overflow: hidden;
    }

    .p55-sim canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .p55-sim-label {
      position: absolute;
      bottom: 6px;
      left: 10px;
      font-size: var(--fs-label);
      color: var(--text-dim);
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body data-page="55" data-total="60">
  <div id="stage">
    <main id="main">

      <!-- k-process: 6 状态 -->
      <div class="k-process p55-process">
        <div class="axis"></div>
        <div class="steps">
          <div class="step current" data-step="0">
            <span>当前 EVA</span>
            <span class="tag">130kg · 0.30</span>
          </div>
          <div class="arw">→</div>
          <div class="step" data-step="1">
            <span>减轻质量</span>
            <span class="tag">100kg · 0.30</span>
          </div>
          <div class="arw">→</div>
          <div class="step" data-step="2">
            <span>继续减轻</span>
            <span class="tag">70kg · 0.30</span>
          </div>
          <div class="arw">→</div>
          <div class="step" data-step="3">
            <span>降低阻力</span>
            <span class="tag">70kg · 0.15</span>
          </div>
          <div class="arw">→</div>
          <div class="step" data-step="4">
            <span>外骨骼</span>
            <span class="tag">70kg · 0.05</span>
          </div>
          <div class="arw">→</div>
          <div class="step" data-step="5">
            <span>未来目标</span>
            <span class="tag">50kg · 0.02</span>
          </div>
        </div>
      </div>

      <!-- split-lr -->
      <div class="p55-split">

        <!-- 左面板: 控件 -->
        <div class="p55-left">
          <div class="p55-sliders">
            <!-- 宇航服质量滑块 -->
            <div class="p55-slider-block">
              <div class="p55-slider-head">
                <span class="p55-slider-label">宇航服质量</span>
                <span class="p55-slider-val" id="mass-val">130 kg</span>
              </div>
              <div class="p55-slider-track">
                <input type="range" id="mass-slider" min="50" max="150" value="130" step="1"
                  aria-label="宇航服质量，范围 50 到 150 公斤">
                <div class="p55-marks" id="mass-marks"></div>
              </div>
            </div>

            <!-- 关节阻力滑块 -->
            <div class="p55-slider-block">
              <div class="p55-slider-head">
                <span class="p55-slider-label">关节阻力系数</span>
                <span class="p55-slider-val" id="res-val">0.30</span>
              </div>
              <div class="p55-slider-track">
                <input type="range" id="res-slider" min="0.02" max="0.40" value="0.30" step="0.01"
                  aria-label="关节阻力系数，范围 0.02 到 0.40">
                <div class="p55-marks" id="res-marks"></div>
              </div>
            </div>
          </div>

          <!-- 效率读数 -->
          <div class="p55-stats">
            <div class="p55-stat">
              <span class="p55-stat-val" id="eff-val">--</span>
              <span class="p55-stat-unit">跳跃效率</span>
              <span class="p55-stat-label">穿宇航服 / 裸露身体</span>
            </div>
            <div class="p55-stat">
              <span class="p55-stat-val" id="height-val">--</span>
              <span class="p55-stat-unit">m</span>
              <span class="p55-stat-label">月球跳跃高度</span>
            </div>
            <div class="p55-stat">
              <span class="p55-stat-val" id="veff-val">--</span>
              <span class="p55-stat-unit">m/s</span>
              <span class="p55-stat-label">有效初速度</span>
            </div>
          </div>

          <!-- 洞察句 -->
          <div class="p55-insight" id="insight"></div>
        </div>

        <!-- 右面板: 可视化 -->
        <div class="p55-right">
          <!-- 未来宇航服概念图 -->
          <div class="p55-illustration">
            <img src="assets/img/p55-future-spacesuit.png"
              alt="未来轻量化宇航服概念图"
              title="来源：基于 NASA xEMU / SpaceX EVA 公开概念生成的插画（AI 生成）">
          </div>

          <!-- echarts 柱状图 -->
          <div class="p55-chart" id="chart"></div>

          <!-- matterjs 跳跃模拟 -->
          <div class="p55-sim" id="sim">
            <canvas id="sim-canvas"></canvas>
            <span class="p55-sim-label" id="sim-label">月球表面 · 跳跃高度 -- m</span>
          </div>
        </div>

      </div>

    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
  (function() {
    // ============================================================
    // 0. 初始化
    // ============================================================
    Deck.init({ index: 55, total: 60 });
    Lec.mount({
      index: 55,
      kicker: '演化与工程',
      title: '未来宇航服的跳跃效率',
      take: '未来宇航服可能让跳跃更接近裸露身体'
    });

    // ============================================================
    // 1. 常量与引用
    // ============================================================
    const K = Lec.K;
    const P = Lec.P;
    const MOON_G = K.MOON_GRAVITY;
    const V0 = K.HUMAN_JUMP_INITIAL_VELOCITY;
    const M_ASTRO = K.ASTRONAUT_MASS;

    // 基线：裸露身体在月球上的跳跃高度
    const H_BASELINE = P.jumpHeightFromVelocity(V0, MOON_G);

    // 六个参考状态
    const STATES = [
      { suit: 130, res: 0.30, label: '当前EVA' },
      { suit: 100, res: 0.30, label: '减轻质量' },
      { suit:  70, res: 0.30, label: '继续减轻' },
      { suit:  70, res: 0.15, label: '降低阻力' },
      { suit:  70, res: 0.05, label: '外骨骼' },
      { suit:  50, res: 0.02, label: '未来目标' }
    ];

    // 三句洞察
    const INSIGHTS = [
      '宇航服质量不是唯一障碍——关节阻力消耗的能量，有时比质量增加更影响跳跃效率。',
      '未来宇航服如果同时减轻质量并降低关节阻力，月球跳跃高度可以从约 0.7 m 提升到约 2.0 m 以上。',
      '让宇航服跳跃接近裸露身体，关键不在单一指标，而在质量与阻力的协同优化——这是工程，不是幻想。'
    ];

    // ============================================================
    // 2. 计算函数
    // ============================================================
    function calcEffectiveVelocity(suitMass, resistance) {
      const totalMass = M_ASTRO + suitMass;
      const massFactor = Math.sqrt(M_ASTRO / totalMass);
      const resFactor = Math.sqrt(1 - resistance);
      return V0 * resFactor * massFactor;
    }

    function calcJumpHeight(suitMass, resistance) {
      const vEff = calcEffectiveVelocity(suitMass, resistance);
      return P.jumpHeightFromVelocity(vEff, MOON_G);
    }

    function calcEfficiency(suitMass, resistance) {
      return calcJumpHeight(suitMass, resistance) / H_BASELINE;
    }

    // 找最近的参考状态
    function closestState(suitMass, resistance) {
      let best = 0;
      let bestDist = Infinity;
      for (let i = 0; i < STATES.length; i++) {
        const ds = (suitMass - STATES[i].suit) / 100;
        const dr = (resistance - STATES[i].res) / 0.38;
        const dist = Math.sqrt(ds * ds + dr * dr);
        if (dist < bestDist) { bestDist = dist; best = i; }
      }
      return best;
    }

    // ============================================================
    // 3. DOM 引用
    // ============================================================
    const massSlider = document.getElementById('mass-slider');
    const resSlider  = document.getElementById('res-slider');
    const massVal    = document.getElementById('mass-val');
    const resVal     = document.getElementById('res-val');
    const effVal     = document.getElementById('eff-val');
    const heightVal  = document.getElementById('height-val');
    const veffVal    = document.getElementById('veff-val');
    const insightEl  = document.getElementById('insight');
    const simLabel   = document.getElementById('sim-label');
    const massMarks  = document.getElementById('mass-marks');
    const resMarks   = document.getElementById('res-marks');

    // ============================================================
    // 4. 状态标记点
    // ============================================================
    function buildMarks(container, sliderMin, sliderMax, values) {
      container.innerHTML = '';
      const range = sliderMax - sliderMin;
      values.forEach((v, i) => {
        const pct = ((v - sliderMin) / range) * 100;
        const dot = document.createElement('div');
        dot.className = 'p55-mark';
        dot.style.left = pct + '%';
        dot.dataset.index = i;
        container.appendChild(dot);
      });
    }

    // 质量标记: 状态 0→130, 1→100, 2→70, 3→70, 4→70, 5→50
    const massMarkerValues = [130, 100, 70, 70, 70, 50];
    // 阻力标记: 状态 0→0.30, 1→0.30, 2→0.30, 3→0.15, 4→0.05, 5→0.02
    const resMarkerValues  = [0.30, 0.30, 0.30, 0.15, 0.05, 0.02];

    buildMarks(massMarks, 50, 150, massMarkerValues);
    buildMarks(resMarks, 0.02, 0.40, resMarkerValues);

    function updateMarks(activeIdx) {
      const allMarks = document.querySelectorAll('.p55-mark');
      allMarks.forEach(m => m.classList.remove('active'));
      // 高亮 activeIdx 对应的标记（两个 track 上各一个）
      const massMarksAll = massMarks.querySelectorAll('.p55-mark');
      const resMarksAll  = resMarks.querySelectorAll('.p55-mark');
      if (massMarksAll[activeIdx]) massMarksAll[activeIdx].classList.add('active');
      if (resMarksAll[activeIdx])  resMarksAll[activeIdx].classList.add('active');
    }

    // ============================================================
    // 5. k-process 步骤高亮
    // ============================================================
    const processSteps = document.querySelectorAll('.k-process .step');

    function updateProcessHighlight(activeIdx) {
      processSteps.forEach((el, i) => {
        el.classList.remove('current', 'done');
        if (i < activeIdx) el.classList.add('done');
        if (i === activeIdx) el.classList.add('current');
      });
    }

    // ============================================================
    // 6. echarts 柱状图
    // ============================================================
    const chartDom = document.getElementById('chart');
    const chart = echarts.init(chartDom, null, {
      renderer: 'svg'
    });

    function updateChart(suitMass, resistance) {
      const hSuit = calcJumpHeight(suitMass, resistance);
      // 未来目标：50kg, 0.02
      const hFuture = calcJumpHeight(50, 0.02);

      const option = {
        textStyle: { fontSize: 16 },
        grid: { top: 30, right: 30, bottom: 40, left: 55 },
        xAxis: {
          type: 'category',
          data: ['裸露身体', '当前宇航服', '未来目标'],
          axisLabel: { fontSize: 14, color: '#a0b0c0' },
          axisLine: { lineStyle: { color: '#334455' } },
          axisTick: { show: false }
        },
        yAxis: {
          type: 'value',
          name: 'm（月球）',
          nameTextStyle: { fontSize: 14, color: '#8899aa' },
          axisLabel: { fontSize: 13, color: '#8899aa' },
          splitLine: { lineStyle: { color: '#243040' } },
          min: 0,
          max: Math.ceil(Math.max(H_BASELINE, hSuit, hFuture) * 1.15 * 10) / 10
        },
        series: [{
          type: 'bar',
          data: [
            { value: H_BASELINE, itemStyle: { color: '#8899aa' } },
            { value: hSuit,     itemStyle: { color: '#4da6ff' } },
            { value: hFuture,   itemStyle: { color: '#34d399' } }
          ],
          barWidth: '40%',
          label: {
            show: true,
            position: 'top',
            fontSize: 14,
            color: '#e6edf5',
            formatter: function(p) { return p.value.toFixed(2) + ' m'; }
          },
          animationDuration: 300,
          animationEasing: 'cubicOut'
        }]
      };
      chart.setOption(option, true);
    }

    // ============================================================
    // 7. matterjs 跳跃模拟
    // ============================================================
    const simCanvas = document.getElementById('sim-canvas');
    const simContainer = document.getElementById('sim');

    const { Engine, Bodies, Body, Composite } = Matter;

    const engine = Engine.create();
    engine.gravity.y = 0.5;

    let simW, simH;
    let groundBody, ballBody;
    let targetLaunchV = 0;
    let pendingLaunch = false;
    let lastLaunchV = 0;

    function initSimWorld() {
      // 使用 Deck.fit 设置的画布尺寸（物理像素）
      // 清除旧 bodies
      Composite.clear(engine.world, false);

      // 地面
      groundBody = Bodies.rectangle(simW / 2, simH - 10, simW + 20, 20, {
        isStatic: true,
        render: { fillStyle: '#334455' }
      });

      // 球（宇航员）
      ballBody = Bodies.circle(simW / 2, simH - 50, 14, {
        restitution: 0.3,
        render: { fillStyle: '#4da6ff' }
      });

      Composite.add(engine.world, [groundBody, ballBody]);
    }

    function launchBall(vEff) {
      // vEff 单位 m/s；映射到 matterjs 像素
      // 最大高度对应像素: 约 simH - 60
      const maxPx = simH - 60;
      const scale = maxPx / H_BASELINE; // px per meter
      // matterjs: h = v² / (2*g) → v = sqrt(2*g*h)
      const hPx = calcJumpHeight(
        parseFloat(massSlider.value),
        parseFloat(resSlider.value)
      ) * scale;
      const g = engine.gravity.y;
      const vPx = Math.sqrt(2 * g * Math.max(hPx, 8));
      // 重置球位置
      Body.setPosition(ballBody, { x: simW / 2, y: simH - 50 });
      Body.setVelocity(ballBody, { x: 0, y: -vPx });
      lastLaunchV = vPx;
    }

    function drawSim(ctx) {
      ctx.clearRect(0, 0, simW, simH);

      // 星空背景
      const grad = ctx.createLinearGradient(0, 0, 0, simH);
      grad.addColorStop(0, '#0b1119');
      grad.addColorStop(0.7, '#111a26');
      grad.addColorStop(1, '#1a2530');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, simW, simH);

      // 月面
      ctx.fillStyle = '#2a3538';
      ctx.beginPath();
      ctx.moveTo(0, simH);
      for (let x = 0; x <= simW; x += 4) {
        ctx.lineTo(x, simH - 12 - Math.sin(x * 0.02) * 4 - Math.sin(x * 0.07) * 2);
      }
      ctx.lineTo(simW, simH);
      ctx.closePath();
      ctx.fill();

      // 地面线
      ctx.strokeStyle = '#445566';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, simH - 12);
      ctx.lineTo(simW, simH - 12);
      ctx.stroke();

      // 球
      const bx = ballBody.position.x;
      const by = ballBody.position.y;
      const r = ballBody.circleRadius;

      ctx.fillStyle = '#4da6ff';
      ctx.beginPath();
      ctx.arc(bx, by, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#88ccff';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // 高度指示线
      const groundY = simH - 50;
      if (by < groundY - 2) {
        ctx.setLineDash([3, 4]);
        ctx.strokeStyle = 'rgba(77,166,255,0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(bx, by - r);
        ctx.lineTo(bx, groundY);
        ctx.stroke();
        ctx.setLineDash([]);

        // 高度标注
        const hMeters = ((groundY - by + r) / ((simH - 60) / H_BASELINE));
        ctx.fillStyle = 'rgba(77,166,255,0.7)';
        ctx.font = '13px ' + getComputedStyle(document.body).fontFamily;
        ctx.fillText(hMeters.toFixed(1) + ' m', bx + 18, by - r + 4);
      }
    }

    // 初始化模拟世界 —— Deck.fit 先设置画布尺寸
    const simCtx = Deck.fit(simCanvas);
    simW = simCanvas.width;
    simH = simCanvas.height;
    initSimWorld();

    // ============================================================
    // 8. 动画循环
    // ============================================================
    Deck.loop(function() {
      Engine.update(engine, 1000 / 60);
      drawSim(simCtx);
    });

    // ============================================================
    // 9. 更新 UI
    // ============================================================
    function update() {
      const suitMass = parseFloat(massSlider.value);
      const resistance = parseFloat(resSlider.value);

      const vEff = calcEffectiveVelocity(suitMass, resistance);
      const hJump = calcJumpHeight(suitMass, resistance);
      const eff = calcEfficiency(suitMass, resistance);

      // 更新读数
      massVal.textContent = suitMass + ' kg';
      resVal.textContent = resistance.toFixed(2);
      effVal.textContent = (eff * 100).toFixed(0) + '%';
      heightVal.textContent = hJump.toFixed(2);
      veffVal.textContent = vEff.toFixed(2);

      // 更新模拟标签
      simLabel.textContent = '月球表面 · 跳跃高度 ' + hJump.toFixed(2) + ' m';

      // 最近状态
      const activeIdx = closestState(suitMass, resistance);
      updateMarks(activeIdx);
      updateProcessHighlight(activeIdx);

      // 洞察句
      insightEl.textContent = INSIGHTS[Math.min(activeIdx, INSIGHTS.length - 1)];

      // 图表
      updateChart(suitMass, resistance);

      // 触发跳跃
      launchBall(vEff);
    }

    // ============================================================
    // 10. 事件绑定
    // ============================================================
    massSlider.addEventListener('input', update);
    resSlider.addEventListener('input', update);

    // 窗口大小变化时重建模拟
    let resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        Deck.fit(simCanvas);
        simW = simCanvas.width;
        simH = simCanvas.height;
        initSimWorld();
        update();
      }, 200);
    });

    // ============================================================
    // 11. 初始渲染
    // ============================================================
    update();

    // ============================================================
    // 12. 响应 reduced-motion
    // ============================================================
    if (Deck.reduced()) {
      // 停止动画循环，显示静态帧
      // 球停在初始位置
      Body.setPosition(ballBody, { x: simW / 2, y: simH - 50 });
      Body.setVelocity(ballBody, { x: 0, y: 0 });
      drawSim(simCtx);
    }
  })();
  </script>
</body>
</html>
