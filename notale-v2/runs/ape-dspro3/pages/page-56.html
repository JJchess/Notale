<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 56 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ---- 页面专属微调 ---- */
  #main {
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }

  /* 双 process 行 */
  .dual-process {
    display: flex;
    flex-direction: row;
    gap: var(--sp-8);
    flex-shrink: 0;
  }
  .dual-process .k-process {
    flex: 1 1 0%;
    min-width: 0;
    gap: 2px;
  }
  .dual-process .k-process .axis {
    height: 1px;
  }
  .dual-process .k-process .step {
    font-size: var(--fs-label);
    padding: var(--sp-1) var(--sp-2);
    gap: 0;
  }
  .dual-process .k-process .arw {
    font-size: var(--fs-sec);
    width: 24px;
    padding-top: var(--sp-1);
  }

  /* split 区 */
  .split-area {
    display: flex;
    flex-direction: row;
    gap: var(--sp-6);
    flex: 1 1 0%;
    min-height: 0;
  }
  .split-area .sim-panel {
    flex: 0 0 580px;
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    overflow: hidden;
  }
  .split-area .sim-panel canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .split-area .chart-panel {
    flex: 1 1 0%;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    overflow: hidden;
  }
  .split-area .chart-panel > div {
    width: 100%;
    height: 100%;
  }

  /* 底部控件 + 读数 */
  .bottom-zone {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
  }
  .readouts {
    display: flex;
    flex-direction: row;
    gap: var(--sp-6);
    font-size: var(--fs-label);
    color: var(--text-sec);
  }
  .readouts strong {
    color: var(--text);
    font-weight: 600;
  }
  .readouts .val-accent {
    color: var(--accent);
  }

  /* 自定义 range */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    cursor: pointer;
    box-shadow: 0 0 6px rgba(77,166,255,0.4);
  }
  input[type="range"]:focus-visible {
    box-shadow: 0 0 0 2px rgba(96,165,250,0.25);
  }

  .three-notes {
    font-size: var(--fs-sec);
    color: var(--text-dim);
    line-height: 1.45;
    display: flex;
    flex-direction: row;
    gap: var(--sp-6);
    flex-shrink: 0;
  }
  .three-notes span {
    flex: 1 1 0%;
    min-width: 0;
  }
  .three-notes span::before {
    content: '●';
    color: var(--accent-soft);
    margin-right: 4px;
    font-size: 10px;
    vertical-align: middle;
  }
</style>
</head>
<body data-page="56" data-total="60">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
/* ================================================================
   page-56 · 外骨骼助力
   知识结构: process — 两条竞争因果链，在同一个滑块上同时生效
   ================================================================ */

// ---- 页首 ----
Lec.mount({
  index: 56,
  kicker: '第五章 · 演化与工程',
  title: '外骨骼助力',
  take: '外骨骼可增加有效初速度，但增加质量，需要权衡'
});
Deck.init({ index: 56, total: 60 });

// ---- 从 Lec 取所有常量 ----
const ASTRONAUT_MASS = Lec.K.ASTRONAUT_MASS;           // 70 kg
const BASE_VELOCITY  = Lec.K.HUMAN_JUMP_INITIAL_VELOCITY; // ≈2.5 m/s
const EARTH_GRAVITY  = Lec.K.EARTH_GRAVITY;            // 9.8 m/s²

// ---- 构建 DOM ----
const main = document.getElementById('main');

// 双 process 行
const dualProcess = document.createElement('div');
dualProcess.className = 'dual-process';

// 助力路径
const chain1 = document.createElement('div');
chain1.className = 'k-process';
chain1.innerHTML = `
  <div class="axis"></div>
  <div class="steps">
    <div class="step current">外骨骼助力</div>
    <div class="arw">→</div>
    <div class="step">初速度 +Δv</div>
    <div class="arw">→</div>
    <div class="step">跳跃高度 ↑</div>
  </div>`;

// 制约路径
const chain2 = document.createElement('div');
chain2.className = 'k-process';
chain2.innerHTML = `
  <div class="axis"></div>
  <div class="steps">
    <div class="step">外骨骼质量</div>
    <div class="arw">→</div>
    <div class="step">总质量 +Δm</div>
    <div class="arw">→</div>
    <div class="step">初速度折扣</div>
    <div class="arw">→</div>
    <div class="step">跳跃高度 ↓</div>
  </div>`;

dualProcess.appendChild(chain1);
dualProcess.appendChild(chain2);
main.appendChild(dualProcess);

// split 区
const splitArea = document.createElement('div');
splitArea.className = 'split-area';

const simPanel = document.createElement('div');
simPanel.className = 'sim-panel';
simPanel.innerHTML = '<canvas id="sim-canvas"></canvas>';
splitArea.appendChild(simPanel);

const chartPanel = document.createElement('div');
chartPanel.className = 'chart-panel';
chartPanel.innerHTML = '<div id="chart-div"></div>';
splitArea.appendChild(chartPanel);

main.appendChild(splitArea);

// 底部控件 + 读数 + 三句
const bottomZone = document.createElement('div');
bottomZone.className = 'bottom-zone';

const readouts = document.createElement('div');
readouts.className = 'readouts';
readouts.innerHTML = `
  <span>助力等级 <strong id="ro-grade" class="val-accent">0.50</strong></span>
  <span>外骨骼质量 <strong id="ro-mass">+10 kg</strong></span>
  <span>净跳跃高度 <strong id="ro-height" class="val-accent">0.40 m</strong></span>`;
bottomZone.appendChild(readouts);

const ctl = document.createElement('div');
ctl.className = 'ctl';
ctl.innerHTML = `
  <span>外骨骼助力等级</span>
  <span style="font-size:var(--fs-tick)">0</span>
  <input type="range" id="grade-slider" min="0" max="1" step="0.05" value="0.5" style="flex:1 1 0%;min-width:0;">
  <span style="font-size:var(--fs-tick)">1</span>
  <span id="grade-val" style="font-weight:600;color:var(--accent);min-width:36px;text-align:right;">0.50</span>`;
bottomZone.appendChild(ctl);

const threeNotes = document.createElement('div');
threeNotes.className = 'three-notes';
threeNotes.innerHTML = `
  <span>外骨骼增加初速度，但自身质量也会抵消部分收益——存在最优助力点</span>
  <span>地球 1g 下质量惩罚显著；低重力环境中惩罚减弱，收益更突出</span>
  <span>演化、训练、装备三者结合，才是跳跃能力的完整图景</span>`;
bottomZone.appendChild(threeNotes);

main.appendChild(bottomZone);

// ---- 预计算全部 21 档数据 ----
const GRADES = [];
const NET_HEIGHTS = [];
const IDEAL_HEIGHTS = [];
const MASS_ONLY_HEIGHTS = [];
const ACTUAL_VELS = [];

for (let g = 0; g <= 1.0001; g += 0.05) {
  const grade = Math.round(g * 100) / 100;
  const massInc = grade * 20;
  const velInc = grade * 1.2;
  const totalMass = ASTRONAUT_MASS + massInc;
  const actualVel = BASE_VELOCITY * (ASTRONAUT_MASS / totalMass) + velInc;
  const effectiveVel = BASE_VELOCITY + velInc;
  const massOnlyVel = BASE_VELOCITY * (ASTRONAUT_MASS / totalMass);

  GRADES.push(grade);
  ACTUAL_VELS.push(actualVel);
  NET_HEIGHTS.push(Lec.P.jumpHeightFromVelocity(actualVel, EARTH_GRAVITY));
  IDEAL_HEIGHTS.push(Lec.P.jumpHeightFromVelocity(effectiveVel, EARTH_GRAVITY));
  MASS_ONLY_HEIGHTS.push(Lec.P.jumpHeightFromVelocity(massOnlyVel, EARTH_GRAVITY));
}

// ---- Matter.js 模拟 ----
const { Engine, Bodies, Composite, Body } = Matter;

const engine = Engine.create();
engine.gravity.y = 1;
engine.gravity.scale = 50;  // 有效重力 ≈ 50 px/s²，使跳跃视觉节奏合理

const canvas = document.getElementById('sim-canvas');
const ctx = Deck.fit(canvas);
let cssW, cssH;

function updateCanvasDims() {
  cssW = canvas.clientWidth;
  cssH = canvas.clientHeight;
}
updateCanvasDims();

const GROUND_Y_RATIO = 0.88; // 地面在 canvas 88% 高度处
let GROUND_Y, GROUND_H, HUMAN_W, HUMAN_H, HEAD_R;

function updateLayout() {
  updateCanvasDims();
  GROUND_Y = Math.round(cssH * GROUND_Y_RATIO);
  GROUND_H = 16;
  HUMAN_W = 22;
  HUMAN_H = 50;
  HEAD_R = 10;
}
updateLayout();

const ground = Bodies.rectangle(cssW / 2, GROUND_Y + GROUND_H / 2 + 10, cssW + 40, GROUND_H + 20, {
  isStatic: true,
  friction: 1
});
let human = Bodies.rectangle(cssW / 2, GROUND_Y - HUMAN_H / 2, HUMAN_W, HUMAN_H, {
  restitution: 0,
  friction: 0.5,
  frictionAir: 0.01
});
Composite.add(engine.world, [ground, human]);

// ---- 跳跃状态 ----
let currentGrade = 0.5;
let isJumping = false;
let jumpStartY;       // 起跳时 human 中心的 Y
let apexY;            // 最高点 human 中心的 Y
let jumpSettled = true;

function triggerJump(actualVel) {
  updateLayout();
  if (cssW <= 0 || cssH <= 0) return;

  const jumpHeightM = Lec.P.jumpHeightFromVelocity(actualVel, EARTH_GRAVITY);
  const jumpHeightPx = jumpHeightM * 100; // 1m = 100px
  const effectiveG = engine.gravity.y * engine.gravity.scale; // 50 px/s²
  const vy = -Math.sqrt(2 * effectiveG * jumpHeightPx);

  Body.setPosition(human, { x: cssW / 2, y: GROUND_Y - HUMAN_H / 2 });
  Body.setVelocity(human, { x: 0, y: vy });
  Body.setAngularVelocity(human, 0);

  isJumping = true;
  jumpSettled = false;
  jumpStartY = GROUND_Y - HUMAN_H / 2;
  apexY = jumpStartY;
}

// ---- ECharts ----
const chartDom = document.getElementById('chart-div');
const chart = echarts.init(chartDom, null, { renderer: 'svg' });

function buildChartOption(grade) {
  const idx = Math.round(grade / 0.05);
  const netH = NET_HEIGHTS[idx];
  const idealH = IDEAL_HEIGHTS[idx];
  const massOnlyH = MASS_ONLY_HEIGHTS[idx];

  const netSeries = GRADES.map((g, i) => [g, NET_HEIGHTS[i]]);
  const idealSeries = GRADES.map((g, i) => [g, IDEAL_HEIGHTS[i]]);
  const massOnlySeries = GRADES.map((g, i) => [g, MASS_ONLY_HEIGHTS[i]]);

  return {
    textStyle: { fontSize: 16 },
    tooltip: { trigger: 'axis', textStyle: { fontSize: 14 } },
    legend: {
      data: [
        `净跳跃高度: ${netH.toFixed(2)} m`,
        `仅初速度增益: ${idealH.toFixed(2)} m`,
        `仅质量惩罚: ${massOnlyH.toFixed(2)} m`
      ],
      textStyle: { fontSize: 14, color: '#a0b0c0' },
      top: 6,
      itemWidth: 18,
      itemHeight: 10
    },
    grid: { left: 52, right: 28, top: 50, bottom: 42 },
    xAxis: {
      type: 'value',
      min: 0,
      max: 1,
      name: '外骨骼助力等级',
      nameTextStyle: { fontSize: 14, color: '#a0b0c0' },
      axisLabel: { fontSize: 13, color: '#8899aa' },
      splitLine: { lineStyle: { color: '#243040' } },
      interval: 0.2
    },
    yAxis: {
      type: 'value',
      name: '跳跃高度 (m)',
      nameTextStyle: { fontSize: 14, color: '#a0b0c0' },
      axisLabel: { fontSize: 13, color: '#8899aa' },
      min: 0.12,
      max: 0.78,
      splitLine: { lineStyle: { color: '#243040' } }
    },
    series: [
      {
        name: `净跳跃高度: ${netH.toFixed(2)} m`,
        type: 'line',
        data: netSeries,
        lineStyle: { color: '#4da6ff', width: 2.5 },
        itemStyle: { color: '#4da6ff' },
        symbol: 'none',
        markLine: {
          silent: true,
          symbol: 'none',
          data: [{ xAxis: grade }],
          lineStyle: { color: 'rgba(255,255,255,0.45)', width: 1, type: 'dashed' },
          label: { show: false }
        }
      },
      {
        name: `仅初速度增益: ${idealH.toFixed(2)} m`,
        type: 'line',
        data: idealSeries,
        lineStyle: { color: '#f87171', width: 2, type: 'dashed' },
        itemStyle: { color: '#f87171' },
        symbol: 'none'
      },
      {
        name: `仅质量惩罚: ${massOnlyH.toFixed(2)} m`,
        type: 'line',
        data: massOnlySeries,
        lineStyle: { color: '#8899aa', width: 2, type: 'dashed' },
        itemStyle: { color: '#8899aa' },
        symbol: 'none'
      }
    ]
  };
}

chart.setOption(buildChartOption(currentGrade));

// ---- 滑块与读数 ----
const slider = document.getElementById('grade-slider');
const gradeVal = document.getElementById('grade-val');
const roGrade = document.getElementById('ro-grade');
const roMass = document.getElementById('ro-mass');
const roHeight = document.getElementById('ro-height');

function updateFromGrade(grade) {
  currentGrade = grade;
  const idx = Math.round(grade / 0.05);
  const massInc = grade * 20;
  const actualVel = ACTUAL_VELS[idx];
  const netHeight = NET_HEIGHTS[idx];

  gradeVal.textContent = grade.toFixed(2);
  roGrade.textContent = grade.toFixed(2);
  roMass.textContent = '+' + massInc.toFixed(0) + ' kg';
  roHeight.textContent = netHeight.toFixed(2) + ' m';

  chart.setOption(buildChartOption(grade));
  triggerJump(actualVel);
}

slider.addEventListener('input', function () {
  updateFromGrade(parseFloat(slider.value));
});

// ---- 绘制函数 ----
function drawSim() {
  const dpr = window.devicePixelRatio || 1;
  const cw = canvas.clientWidth || (canvas.width / dpr);
  const ch = canvas.clientHeight || (canvas.height / dpr);
  if (cw <= 0 || ch <= 0) return;

  ctx.clearRect(0, 0, cw, ch);

  const style = getComputedStyle(document.documentElement);
  const bgCol     = style.getPropertyValue('--surface').trim();
  const accentCol = style.getPropertyValue('--accent').trim();
  const textCol   = style.getPropertyValue('--text').trim();
  const dimCol    = style.getPropertyValue('--text-dim').trim();
  const borderCol = style.getPropertyValue('--border').trim();
  const warnCol   = style.getPropertyValue('--warn').trim();
  const fontFam   = style.getPropertyValue('--font-sans').trim();

  // 背景
  ctx.fillStyle = bgCol;
  ctx.fillRect(0, 0, cw, ch);

  // 地面
  ctx.fillStyle = borderCol;
  ctx.fillRect(0, GROUND_Y, cw, GROUND_H);

  const hx = human.position.x;
  const hy = human.position.y;

  // 外骨骼轮廓（半透明，厚度随质量增量变化）
  const massInc = currentGrade * 20;
  const outlineW = massInc * 0.35; // 0 ~ 7px
  if (outlineW > 0.3) {
    ctx.save();
    ctx.strokeStyle = accentCol;
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = outlineW;
    ctx.strokeRect(hx - HUMAN_W / 2 - 4, hy - HUMAN_H / 2 - 4, HUMAN_W + 8, HUMAN_H + 8);
    ctx.restore();
  }

  // 人体躯干
  ctx.fillStyle = accentCol;
  ctx.fillRect(hx - HUMAN_W / 2, hy - HUMAN_H / 2, HUMAN_W, HUMAN_H);

  // 头部
  ctx.fillStyle = textCol;
  ctx.beginPath();
  ctx.arc(hx, hy - HUMAN_H / 2 - HEAD_R - 2, HEAD_R, 0, Math.PI * 2);
  ctx.fill();

  // 起跳线（虚线）
  ctx.strokeStyle = dimCol;
  ctx.setLineDash([4, 5]);
  ctx.lineWidth = 1;
  ctx.beginPath();
  const startLineY = jumpStartY - HUMAN_H / 2;
  ctx.moveTo(20, startLineY);
  ctx.lineTo(cw - 20, startLineY);
  ctx.stroke();
  ctx.setLineDash([]);

  // 起跳标注
  ctx.fillStyle = dimCol;
  ctx.font = `${style.getPropertyValue('--fs-tick').trim()} ${fontFam}`;
  ctx.fillText('起跳点', cw - 70, startLineY - 6);

  // 最高点线（虚线）
  if (!jumpSettled) {
    const apexLineY = apexY - HUMAN_H / 2;
    if (apexLineY < startLineY - 2) {
      ctx.strokeStyle = warnCol;
      ctx.setLineDash([4, 5]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(20, apexLineY);
      ctx.lineTo(cw - 20, apexLineY);
      ctx.stroke();
      ctx.setLineDash([]);

      // 最高点数值
      const apexM = ((startLineY - apexLineY) / 100);
      ctx.fillStyle = warnCol;
      ctx.fillText('最高点 ' + apexM.toFixed(2) + ' m', 20, apexLineY - 6);
    }
  }
}

// ---- 动画循环 ----
Deck.loop(function () {
  if (isJumping && !Deck.reduced()) {
    Engine.update(engine, 1000 / 60);

    // 追踪最高点
    if (human.position.y < apexY) {
      apexY = human.position.y;
    }

    // 检测落地：速度向下且位置接近地面
    if (human.velocity.y > 0 && human.position.y >= jumpStartY - 1) {
      isJumping = false;
      jumpSettled = true;
      Body.setPosition(human, { x: human.position.x, y: jumpStartY });
      Body.setVelocity(human, { x: 0, y: 0 });
    }
  }

  // reduced-motion: 直接跳到最高点
  if (isJumping && Deck.reduced()) {
    const jumpHeightM = Lec.P.jumpHeightFromVelocity(ACTUAL_VELS[Math.round(currentGrade / 0.05)], EARTH_GRAVITY);
    const jumpHeightPx = jumpHeightM * 100;
    Body.setPosition(human, { x: cssW / 2, y: jumpStartY - jumpHeightPx });
    apexY = jumpStartY - jumpHeightPx;
    isJumping = false;
    jumpSettled = true;
  }

  drawSim();
});

// ---- 初始触发（延迟到首帧，确保 canvas 已布局） ----
requestAnimationFrame(function () {
  updateCanvasDims();
  updateLayout();
  updateFromGrade(currentGrade);
});

// ---- 窗口大小变化时更新布局 ----
window.addEventListener('resize', function () {
  Deck.fit(canvas);
  updateLayout();
  chart.resize();
});
</script>
</body>
</html>
