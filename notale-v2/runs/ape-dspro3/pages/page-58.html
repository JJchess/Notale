<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第 58 页 · 互动讲义</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <script src="assets/lib/echarts.min.js"></script>
  <style>
    /* ===== 本页专属样式 ===== */
    #main {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .top-section {
      flex: 0 0 60%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      overflow: hidden;
    }

    .illustration-strip {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 76px;
      opacity: 0.16;
      object-fit: cover;
      object-position: 50% 30%;
      pointer-events: none;
    }

    .chart-wrap {
      position: relative;
      width: 300px;
      height: 300px;
      margin-top: 10px;
      flex-shrink: 0;
    }

    .slider-group {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: var(--sp-8);
      margin-top: var(--sp-2);
      flex-shrink: 0;
    }

    .slider-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-1);
    }

    .slider-item label {
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }

    .slider-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot-genetic  { background: #b8845c; }
    .dot-training { background: #5a9e6f; }
    .dot-equip    { background: #8a9aaa; }

    .slider-item input[type="range"] {
      width: 160px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .slider-value {
      font-size: var(--fs-body);
      font-weight: 600;
      color: var(--text);
      min-width: 3em;
      text-align: center;
    }

    .bottom-section {
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: var(--sp-12);
      padding: 0 var(--sp-4);
      min-height: 0;
    }

    .prediction-panel {
      flex: 0 0 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: var(--sp-6) var(--sp-8);
      gap: var(--sp-2);
    }

    .prediction-label {
      font-size: var(--fs-label);
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .prediction-value {
      font-size: 56px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .prediction-unit {
      font-size: var(--fs-h2);
      color: var(--text-sec);
      font-weight: 400;
    }

    .claims-block {
      flex: 1;
      min-width: 0;
    }

    /* 微调 generalization 骨架在这页的间距 */
    .claims-block.k-generalization {
      gap: var(--sp-4);
      padding-left: var(--sp-6);
    }

    .claims-block .claim {
      font-size: var(--fs-lead);
      margin-bottom: 0;
    }

    .claims-block .support {
      font-size: var(--fs-sec);
      line-height: 1.5;
      max-width: 52ch;
    }
  </style>
</head>
<body data-page="58" data-total="60">
  <div id="stage">
    <main id="main">
      <!-- ===== 上半部分：插画背景 + 饼图 + 滑块 ===== -->
      <div class="top-section">
        <img class="illustration-strip" src="assets/img/p58-three-factors.png" alt=""
             aria-hidden="true">
        <div class="chart-wrap" id="pie-chart"></div>
        <div class="slider-group">
          <div class="slider-item">
            <label>
              <span class="slider-dot dot-genetic"></span>基因
            </label>
            <input type="range" id="slider-genetic" min="10" max="80" value="40" step="1">
            <span class="slider-value" id="val-genetic">40%</span>
          </div>
          <div class="slider-item">
            <label>
              <span class="slider-dot dot-training"></span>训练
            </label>
            <input type="range" id="slider-training" min="5" max="70" value="30" step="1">
            <span class="slider-value" id="val-training">30%</span>
          </div>
          <div class="slider-item">
            <label>
              <span class="slider-dot dot-equip"></span>装备
            </label>
            <input type="range" id="slider-equip" min="5" max="70" value="30" step="1">
            <span class="slider-value" id="val-equip">30%</span>
          </div>
        </div>
      </div>

      <!-- ===== 下半部分：预测高度 + 收束主张 ===== -->
      <div class="bottom-section">
        <div class="prediction-panel">
          <span class="prediction-label">预测跳跃高度</span>
          <span class="prediction-value" id="pred-height">0.52</span>
          <span class="prediction-unit">米</span>
        </div>

        <div class="claims-block k-generalization">
          <div class="claim">三要素互补，此消彼长——总和始终为 100%</div>
          <div class="supports">
            <div class="support">
              跳跃能力不是单一因素决定的——基因、训练、装备各占一块，但比例可以因人而异。
            </div>
            <div class="support">
              演化给了我们基础，但训练和工程能把上限推得更高。
            </div>
            <div class="support">
              这套比例不是精确的物理公式，而是一种概念性的拆解，帮我们理解身体与环境的对话。
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
  (function() {
    Deck.init({ index: 58, total: 60 });

    /* ===== 从 Lec 获取默认值 ===== */
    let defaults;
    if (typeof Lec.P !== 'undefined' && typeof Lec.P.getJumpContribution === 'function') {
      defaults = Lec.P.getJumpContribution();
    } else {
      defaults = {
        genetic:   (typeof Lec.K !== 'undefined' && Lec.K.GENETIC_CONTRIBUTION  != null) ? Lec.K.GENETIC_CONTRIBUTION  : 0.4,
        training:  (typeof Lec.K !== 'undefined' && Lec.K.TRAINING_CONTRIBUTION != null) ? Lec.K.TRAINING_CONTRIBUTION : 0.3,
        equipment: (typeof Lec.K !== 'undefined' && Lec.K.EQUIPMENT_CONTRIBUTION!= null) ? Lec.K.EQUIPMENT_CONTRIBUTION : 0.3
      };
    }

    const pct = {
      genetic:   Math.round(defaults.genetic   * 100),
      training:  Math.round(defaults.training  * 100),
      equipment: Math.round(defaults.equipment * 100)
    };
    /* 确保总和为 100 */
    const pctSum = pct.genetic + pct.training + pct.equipment;
    if (pctSum !== 100) {
      pct.genetic += (100 - pctSum);
    }

    /* ===== 预测跳跃高度 ===== */
    function predictHeight(g, t, e) {
      const gf = g / 100;
      const tf = t / 100;
      const ef = e / 100;
      if (typeof Lec.P !== 'undefined' && typeof Lec.P.predictJumpHeight === 'function') {
        return Lec.P.predictJumpHeight(gf, tf, ef);
      }
      const base = (typeof Lec.K !== 'undefined' && Lec.K.HUMAN_VERTICAL_JUMP_EARTH != null)
        ? Lec.K.HUMAN_VERTICAL_JUMP_EARTH : 0.4;
      const trainEff = (typeof Lec.K !== 'undefined' && Lec.K.TRAINING_EFFICIENCY != null)
        ? Lec.K.TRAINING_EFFICIENCY : 0.5;
      const equipEff = (typeof Lec.K !== 'undefined' && Lec.K.EQUIPMENT_EFFICIENCY != null)
        ? Lec.K.EQUIPMENT_EFFICIENCY : 0.3;
      return base * (1 + tf * trainEff + ef * equipEff);
    }

    /* ===== DOM 引用 ===== */
    const slGenetic   = document.getElementById('slider-genetic');
    const slTraining  = document.getElementById('slider-training');
    const slEquipment = document.getElementById('slider-equip');
    const valGenetic  = document.getElementById('val-genetic');
    const valTraining = document.getElementById('val-training');
    const valEquip    = document.getElementById('val-equip');
    const predHeight  = document.getElementById('pred-height');

    const sliders = [slGenetic, slTraining, slEquipment];
    const valEls  = [valGenetic, valTraining, valEquip];

    /* ===== echarts 饼图 ===== */
    const chartDom = document.getElementById('pie-chart');
    const chart = echarts.init(chartDom, null, { renderer: 'svg' });

    const colors = {
      genetic:  '#b8845c',
      training: '#5a9e6f',
      equip:    '#8a9aaa'
    };

    function buildOption(g, t, e) {
      return {
        textStyle: { fontSize: 16 },
        series: [{
          type: 'pie',
          radius: ['45%', '72%'],
          center: ['50%', '50%'],
          avoidLabelOverlap: false,
          itemStyle: {
            borderColor: 'var(--bg)',
            borderWidth: 3,
            borderRadius: 4
          },
          label: {
            show: true,
            position: 'outside',
            formatter: '{b}\n{d}%',
            fontSize: 16,
            fontWeight: 600,
            color: 'var(--text)',
            lineHeight: 22
          },
          labelLine: {
            length: 28,
            length2: 32,
            lineStyle: { color: 'var(--text-dim)' }
          },
          emphasis: {
            label: { fontSize: 20, fontWeight: 'bold' },
            scaleSize: 8
          },
          data: [
            { value: g, name: '基因',   itemStyle: { color: colors.genetic  } },
            { value: t, name: '训练',   itemStyle: { color: colors.training } },
            { value: e, name: '装备',   itemStyle: { color: colors.equip    } }
          ],
          animation: !Deck.reduced()
        }]
      };
    }

    chart.setOption(buildOption(pct.genetic, pct.training, pct.equipment));

    /* ===== 滑块联动逻辑 ===== */
    function syncSliders(changedIndex) {
      const raw = [
        parseInt(slGenetic.value, 10),
        parseInt(slTraining.value, 10),
        parseInt(slEquipment.value, 10)
      ];

      const total = raw[0] + raw[1] + raw[2];
      if (total === 100) {
        pct.genetic = raw[0];
        pct.training = raw[1];
        pct.equipment = raw[2];
        updateDisplay();
        return;
      }

      /* 从另外两块中等比例扣除或补足 */
      const others = [0, 1, 2].filter(i => i !== changedIndex);
      const otherSum = raw[others[0]] + raw[others[1]];
      const remaining = 100 - raw[changedIndex];

      if (otherSum === 0) {
        raw[others[0]] = Math.floor(remaining / 2);
        raw[others[1]] = remaining - raw[others[0]];
      } else {
        const ratio0 = raw[others[0]] / otherSum;
        const ratio1 = raw[others[1]] / otherSum;
        raw[others[0]] = Math.round(remaining * ratio0);
        raw[others[1]] = Math.round(remaining * ratio1);
        /* 修正舍入误差 */
        const diff = 100 - raw[0] - raw[1] - raw[2];
        raw[others[0]] += diff;
      }

      /* 钳制 */
      raw[0] = Math.max(5, Math.min(85, raw[0]));
      raw[1] = Math.max(5, Math.min(85, raw[1]));
      raw[2] = Math.max(5, Math.min(85, raw[2]));

      /* 最终修正 */
      const finalDiff = 100 - raw[0] - raw[1] - raw[2];
      if (finalDiff !== 0) {
        raw[others[0]] += finalDiff;
      }

      pct.genetic   = raw[0];
      pct.training  = raw[1];
      pct.equipment = raw[2];

      /* 更新 DOM（不触发新一轮 input） */
      slGenetic.value   = pct.genetic;
      slTraining.value  = pct.training;
      slEquipment.value = pct.equipment;

      updateDisplay();
    }

    function updateDisplay() {
      valGenetic.textContent  = pct.genetic   + '%';
      valTraining.textContent = pct.training  + '%';
      valEquip.textContent    = pct.equipment + '%';

      const h = predictHeight(pct.genetic, pct.training, pct.equipment);
      predHeight.textContent = h.toFixed(2);

      chart.setOption(buildOption(pct.genetic, pct.training, pct.equipment));
    }

    let changing = -1;
    slGenetic.addEventListener('input',   function() { changing = 0; syncSliders(0); });
    slTraining.addEventListener('input',  function() { changing = 1; syncSliders(1); });
    slEquipment.addEventListener('input', function() { changing = 2; syncSliders(2); });

    /* 初始显示 */
    slGenetic.value   = pct.genetic;
    slTraining.value  = pct.training;
    slEquipment.value = pct.equipment;
    updateDisplay();

    /* ===== 响应窗口大小变化 ===== */
    window.addEventListener('resize', function() {
      chart.resize();
    });

    /* ===== Lec.mount 页眉页脚 ===== */
    Lec.mount({
      index: 58,
      kicker: 'DECOMPOSITION',
      title: '是什么决定了你能跳多高？',
      take: '基因40%，训练30%，装备30% 决定跳跃能力'
    });
  })();
  </script>
</body>
</html>
