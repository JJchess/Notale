<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 59 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* 页面居中包装 */
  .p59-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .p59-core {
    max-width: 1060px;
    width: 100%;
  }

  /* 两列并行支撑 */
  .p59-row {
    display: flex;
    flex-direction: row;
    gap: var(--sp-12);
    width: 100%;
  }

  .p59-branch {
    flex: 1 1 0%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
    padding: 0 0 0 var(--sp-6);
    border-left: 2px solid var(--border);
  }

  .p59-branch-hd {
    font-size: var(--fs-h2);
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }

  .p59-branch-it {
    font-size: var(--fs-body);
    color: var(--text-sec);
    line-height: 1.5;
    position: relative;
    padding-left: var(--sp-4);
  }

  .p59-branch-it::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0.65em;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--border-strong);
  }

  /* 收束主张 */
  .p59-close {
    font-size: var(--fs-lead);
    font-weight: 600;
    color: var(--text);
    border-left: 4px solid var(--ok);
    padding-left: var(--sp-5);
    line-height: 1.5;
    width: 100%;
    box-sizing: border-box;
    margin-top: var(--sp-4);
  }

  /* 动态数字 */
  .p59-num {
    font-family: var(--font-mono);
    color: var(--accent);
    font-weight: 500;
  }
</style>
</head>
<body data-page="59" data-total="60">
<div id="stage">
<main id="main">

  <div class="p59-wrap">
    <div class="k-generalization p59-core">

      <!-- 主张 -->
      <div class="claim">身体是产品，也是平台</div>

      <!-- 两条并行支撑 -->
      <div class="p59-row">
        <div class="p59-branch">
          <div class="p59-branch-hd">身体是产品</div>
          <div class="p59-branch-it">南方古猿到智人，下肢骨骼、足弓、股骨角——整套为直立行走优化的构造，是数百万年演化的产物。</div>
          <div class="p59-branch-it">跳跃能力、耐力奔跑——这些不是"设计"，是自然选择在 <span class="p59-num" id="g-earth"></span> 重力下留下的遗产。</div>
        </div>

        <div class="p59-branch">
          <div class="p59-branch-hd">身体是平台</div>
          <div class="p59-branch-it">同一具身体进入微重力后，骨骼流失、肌肉萎缩，但宇航服（<span class="p59-num" id="m-suit"></span>）和外骨骼重新定义了能力边界。</div>
          <div class="p59-branch-it">在月球上（<span class="p59-num" id="g-moon"></span>），同一具身体跳得比任何地球人都高；在小行星上，甚至可能跳入逃逸轨道。</div>
        </div>
      </div>

      <!-- 收束 -->
      <div class="p59-close">演化赋予我们身体，工程赋予我们环境。身体既是演化的产品，也是工程的平台——从猿人到太空人，同一具身体，在不同重力下不断被重新定义。</div>

    </div>
  </div>

</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Deck.init({ index: 59, total: 60 });

Lec.mount({
  index: 59,
  kicker: '第五章 · 演化与工程',
  title: '身体是产品，也是平台',
  take: '从猿人到太空人，同一具身体，不同重力'
});

document.getElementById('g-earth').textContent = Lec.K.EARTH_GRAVITY.toFixed(1) + ' m/s²';
document.getElementById('m-suit').textContent = '约 ' + Lec.K.EVA_SUIT_MASS + ' kg';
document.getElementById('g-moon').textContent = Lec.K.MOON_GRAVITY.toFixed(2) + ' m/s²';
</script>
</body>
</html>
