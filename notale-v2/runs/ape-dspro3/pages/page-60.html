<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 60 页 · 互动讲义</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* 结语页：居中、大字、留白。
     generalization 骨架：主张比支撑重一档，去掉所有骨架线，
     只用字号和字重来显式化 claim > support 的关系。 */
  .k-generalization.epilogue {
    align-items: center;
    justify-content: center;
    padding-left: 0;
    height: 100%;
    gap: var(--sp-12);
  }
  .k-generalization.epilogue .trunk {
    display: none;
  }
  .k-generalization.epilogue .claim {
    border-left: none;
    padding-left: 0;
    text-align: center;
    font-size: 48px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--text);
    letter-spacing: 0.02em;
  }
  .k-generalization.epilogue .supports {
    padding-left: 0;
    align-items: center;
  }
  .k-generalization.epilogue .support {
    padding-left: 0;
    text-align: center;
    font-size: var(--fs-h2);
    font-weight: 400;
    color: var(--text-dim);
    line-height: 1.4;
  }
  .k-generalization.epilogue .support::before {
    display: none;
  }
</style>
</head>
<body data-page="60" data-total="60">
<div id="stage">
<main id="main">
  <div class="k-generalization epilogue">
    <div class="claim">猿人—太空人，同一具身体，无尽的故事。</div>
    <div class="supports">
      <div class="support">下一章，由你来写。</div>
    </div>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Deck.init({ index: 60, total: 60 });
  Lec.mount({
    index: 60,
    kicker: '结语',
    title: '猿人—太空人',
    take: '同一具身体，无尽的故事'
  });
</script>
</body>
</html>
