<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
.hero-generalization{position:relative;width:100%;height:100%;display:block;overflow:hidden;border-radius:var(--radius-lg);background:var(--surface-deep);box-shadow:var(--shadow)}
.hero-generalization .supports{position:absolute;inset:0;display:flex;padding:0;gap:0}
.hero-generalization .support{position:relative;flex:1 1 0;min-width:0;height:100%;margin:0;padding:0;border:0;border-radius:0;overflow:hidden;background:var(--surface-deep)}
.hero-generalization .support::before{display:none}
.hero-generalization .support img{width:100%;height:100%;object-fit:cover;filter:saturate(.7) contrast(1.08) brightness(.72)}
.hero-generalization .ancient img{object-position:45% center}
.hero-generalization .lunar{margin-left:-110px;clip-path:polygon(15% 0,100% 0,100% 100%,0 100%,11% 72%,4% 47%)}
.hero-generalization .lunar img{object-position:center 48%}
.hero-generalization::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(7,16,25,.7),transparent 35%,transparent 67%,rgba(7,16,25,.24)),linear-gradient(0deg,rgba(7,16,25,.76),transparent 48%)}
.hero-generalization .trunk{position:absolute;z-index:4;inset:0;width:auto;height:auto;background:none}
.path-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.path-base{fill:none;stroke:rgba(7,16,25,.65);stroke-width:10}
.path-live{fill:none;stroke:var(--primary);stroke-width:3;stroke-linecap:round;stroke-dasharray:8 12;filter:drop-shadow(0 0 7px rgba(66,199,194,.72));stroke-dashoffset:0}
.path-dot{fill:var(--accent);filter:drop-shadow(0 0 9px rgba(255,181,71,.85))}
.scene-label{position:absolute;z-index:6;display:flex;flex-direction:column;gap:4px;color:var(--text);text-shadow:0 2px 8px #000}
.scene-label strong{font-size:var(--fs-h2);line-height:1.3}
.scene-label span{font-size:var(--fs-sec);line-height:var(--lh-sec);color:#C6D6DA}
.ancient .scene-label{left:28px;bottom:26px}
.lunar .scene-label{right:28px;top:28px;text-align:right}
.hero-generalization .claim{position:absolute;z-index:8;left:50%;bottom:30px;width:650px;transform:translateX(-50%);padding:18px 24px;text-align:center;background:rgba(23,41,54,.94);border-left:8px solid var(--primary);border-radius:0 var(--radius-md) var(--radius-md) 0;box-shadow:var(--shadow);font-size:var(--fs-lead);font-weight:750;line-height:var(--lh-copy)}
.question{position:absolute;z-index:7;left:50%;top:42%;transform:translate(-50%,-50%);font-size:30px;font-weight:800;line-height:1.2;text-shadow:0 3px 16px #000}
.question b{color:var(--accent);font-size:42px}
.enter-left{animation:reveal-left 1.25s ease-out both}
.enter-path .path-live{stroke-dasharray:1500;stroke-dashoffset:1500;animation:trace 1.45s .18s ease-out forwards}
.enter-right{animation:reveal-right .7s 1.08s ease-out both}
@keyframes reveal-left{from{opacity:0}to{opacity:1}}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes reveal-right{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.enter-left,.enter-right,.enter-path .path-live{animation:none!important;stroke-dashoffset:0}}
</style>
</head>
