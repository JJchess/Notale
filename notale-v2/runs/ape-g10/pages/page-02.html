<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
.route-plate{position:relative;width:100%;height:100%;padding:28px 46px 22px;overflow:hidden;background:linear-gradient(90deg,rgba(66,199,194,.025) 1px,transparent 1px),linear-gradient(rgba(66,199,194,.025) 1px,transparent 1px);background-size:44px 44px}
.route-plate::before,.route-plate::after{content:"";position:absolute;width:18px;height:18px;border-color:var(--primary-line);pointer-events:none}.route-plate::before{left:18px;top:16px;border-left:1px solid;border-top:1px solid}.route-plate::after{right:18px;bottom:16px;border-right:1px solid;border-bottom:1px solid}
.route-head{position:relative;z-index:3;display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.route-head .lead{max-width:850px;color:#dcebed}.route-code{color:var(--muted);font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.08em}
.route-field{position:relative;height:432px}
.route-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orbit-path{fill:none;stroke:var(--primary);stroke-width:2;stroke-linecap:round;stroke-dasharray:1300;stroke-dashoffset:1300;opacity:.58;animation:draw 700ms ease-out forwards}
.orbit-ghost{fill:none;stroke:var(--primary);stroke-width:1;stroke-dasharray:5 10;opacity:.18}
.earth-ring{fill:rgba(66,199,194,.035);stroke:var(--primary-line);stroke-width:1.5}.earth-line{fill:none;stroke:var(--primary-line);stroke-width:1}
.route-list{--enum-cols:1;position:absolute;inset:0 168px 0 0;display:flex;flex-direction:column;gap:10px;justify-content:center}
.route-list .it{position:relative;display:grid;grid-template-columns:92px 175px 220px minmax(0,1fr);align-items:center;height:88px;padding:0 22px;background:linear-gradient(90deg,rgba(16,29,40,.96),rgba(16,29,40,.72));border:1px solid var(--line);border-left:4px solid var(--primary);border-top-width:1px;border-radius:var(--radius-sm);opacity:0;transform:translateX(-12px);animation:arrive 350ms ease-out forwards}
.route-list .it:nth-child(1){border-left-color:var(--accent);animation-delay:.72s}.route-list .it:nth-child(2){animation-delay:.84s}.route-list .it:nth-child(3){animation-delay:.96s}.route-list .it:nth-child(4){animation-delay:1.08s}
.route-list .it::after{content:"";position:absolute;right:-38px;top:50%;width:38px;height:1px;background:var(--primary-line)}
.seq{font:700 var(--fs-h2)/1 var(--font-mono);color:var(--primary)}.it:first-child .seq{color:var(--accent)}
.layer{color:var(--muted);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em}.main-word{font-size:var(--fs-h2);font-weight:750}.question{font-size:var(--fs-body);line-height:var(--lh-copy);color:#d4e3e6}
.node{position:absolute;right:-47px;top:50%;width:18px;height:18px;margin-top:-9px;background:var(--bg);border:3px solid var(--primary);border-radius:50%;box-shadow:0 0 16px rgba(66,199,194,.55)}.it:first-child .node{border-color:var(--accent);box-shadow:0 0 0 5px rgba(255,181,71,.12),0 0 16px rgba(255,181,71,.45)}
.destination{position:absolute;right:18px;top:22px;width:132px;height:132px}.dest-label{position:absolute;right:11px;top:160px;color:var(--muted);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.08em}.dest-label strong{display:block;color:var(--primary);font-size:var(--fs-sec)}
.route-bottom{position:absolute;right:10px;bottom:4px;display:flex;gap:12px;align-items:center;color:var(--muted);font-size:var(--fs-sec)}.route-bottom b{color:var(--primary);font-family:var(--font-mono);letter-spacing:.06em}.route-bottom .rule{width:82px;height:1px;background:var(--primary-line)}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes arrive{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.orbit-path{animation:none;stroke-dashoffset:0}.route-list .it{animation:none;opacity:1;transform:none}}
</style>
</head>
<body data-page="02" data-total="48">

</section>
</main>
</div>

</body>
</html>
