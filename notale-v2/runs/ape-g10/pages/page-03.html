<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .footprint-page{width:var(--content-w);height:var(--content-h);justify-self:center;align-self:center;display:flex;flex-direction:column;gap:12px;padding-top:8px;box-sizing:border-box}
  .evidence-window{height:268px;flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;position:relative;overflow:hidden;border:1px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface-deep)}
  .scene{position:relative;min-width:0;overflow:hidden;background:var(--surface-deep)}
  .scene:first-child{border-right:1px solid var(--primary-line)}
  .scene img{width:100%;height:100%;display:block;object-fit:cover;filter:saturate(.78) contrast(1.1) brightness(1.3)}
  .scene.laetoli img{object-position:center 48%}
  .scene.moon img{object-position:center 48%}
  .scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,16,25,.05) 35%,rgba(7,16,25,.9));pointer-events:none}
  .scene-tag{position:absolute;z-index:3;left:18px;top:14px;padding:6px 10px;background:rgba(7,16,25,.82);border-left:3px solid var(--primary);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.04em}
  .scene-date{position:absolute;z-index:3;left:18px;bottom:15px;color:var(--text);font:700 var(--fs-h2)/1.2 var(--font-mono)}
  .scene-date small{display:block;margin-top:3px;color:var(--muted);font:400 var(--fs-label)/1.4 var(--font-sans)}
  .photo-observations{position:absolute;z-index:3;top:62px;display:flex;flex-direction:column;gap:9px;width:78%}
  .laetoli .photo-observations{left:18px}.moon .photo-observations{right:18px}
  .photo-observations span{padding:7px 11px;background:rgba(7,16,25,.82);border:1px solid var(--primary-line);border-radius:var(--radius-sm);font-size:var(--fs-label);line-height:1.4}
  .photo-observations b{color:var(--primary);font-weight:700;margin-right:7px}
  .align-overlay{position:absolute;z-index:4;inset:0;pointer-events:none}
  .guide{position:absolute;top:20%;bottom:22%;width:2px;background:var(--primary-line);transition:left .12s ease,background .12s ease,box-shadow .12s ease}
  .guide::before,.guide::after{content:"";position:absolute;left:-7px;width:16px;height:16px;border:2px solid var(--primary);border-radius:50%;background:var(--bg)}
  .guide::before{top:0}.guide::after{bottom:0}
  .guide.g1{left:34%}.guide.g2{left:50%}.guide.g3{left:66%}
  .guide.done{background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .guide.done::before,.guide.done::after{border-color:var(--accent);background:var(--accent)}
  .handle-wrap{position:absolute;z-index:6;left:50%;top:0;bottom:0;width:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .handle{width:44px;height:68px;border:2px solid var(--accent);border-radius:22px;background:var(--surface-high);box-shadow:0 0 0 5px rgba(255,181,71,.12),0 8px 24px rgba(0,0,0,.5);display:grid;place-items:center;color:var(--accent);font:700 22px/1 var(--font-mono);transition:transform .18s ease}
  .handle.bump{transform:translateX(-12px)}
  .control-strip{position:absolute;z-index:8;left:14%;right:14%;bottom:8px;height:40px;display:flex;align-items:center;pointer-events:auto}
  .control-strip input{width:100%;height:28px;cursor:ew-resize}
  .evidence-claim{min-height:42px;display:flex;align-items:center;padding:7px 18px;box-sizing:border-box;border-left:5px solid var(--primary);background:var(--surface-high);font-size:var(--fs-sec);line-height:1.45;color:var(--text)}
  .evidence-claim strong{color:var(--accent);margin-right:8px}
  .compare-wrap{height:196px;flex-shrink:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;min-height:0}
  .k-comparison{--compare-cols:142px repeat(2,minmax(0,1fr));grid-template-rows:40px 38px 1px 38px 1px 38px 1px 38px;flex:1}
  .k-comparison>*{padding:8px 14px}
  .k-comparison .hdr{font-size:18px}
  .k-comparison .cell{font-size:16px;line-height:1.4;background:rgba(23,41,54,.78);box-shadow:inset 3px 0 0 var(--primary-line)}
  .k-comparison .cell:nth-of-type(6n+2),.k-comparison .cell:nth-of-type(6n+3){background:var(--primary-soft)}
  .k-comparison .dim{font-size:15px;display:flex;align-items:center;justify-content:flex-end;background:rgba(11,23,33,.92)}
  .status-panel{padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between}
  .status-title{font-size:var(--fs-label);color:var(--muted);font-weight:700}
  .status-count{font:750 25px/1.2 var(--font-mono);color:var(--accent)}
  .nodes{display:flex;gap:12px}.node{width:34px;height:8px;border-radius:6px;background:var(--line-strong)}.node.on{background:var(--accent);box-shadow:0 0 9px rgba(255,181,71,.5)}
  .feedback{font-size:var(--fs-sec);line-height:1.4;color:var(--muted);min-height:45px}
  .status-panel button{align-self:flex-start}
  .time-ruler{height:82px;position:relative;padding:11px 20px 8px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);box-sizing:border-box}
  .time-line{position:relative;height:25px;margin:0 10px;border-bottom:2px solid var(--primary-line)}
  .time-line::before,.time-line::after{content:"";position:absolute;bottom:-6px;width:10px;height:10px;border-radius:50%;background:var(--primary)}
  .time-line::before{left:-3px}.time-line::after{right:-3px}
  .focus-dot{position:absolute;bottom:-8px;left:50%;width:14px;height:14px;border:3px solid var(--accent);border-radius:50%;background:var(--bg);transform:translateX(-50%);transition:left .12s ease}
  .ruler-labels{display:flex;justify-content:space-between;align-items:flex-start;margin-top:6px;font-size:var(--fs-label);line-height:1.35}
  .ruler-center{position:absolute;left:50%;top:11px;transform:translateX(-50%);padding:3px 10px;background:var(--surface);color:var(--primary);font:700 var(--fs-label)/1.35 var(--font-mono);white-space:nowrap}
  .ruler-center.complete{color:var(--accent)}
  @keyframes shake{0%,100%{transform:translateX(0)}35%{transform:translateX(-8px)}70%{transform:translateX(6px)}}
  .wrong .guide:not(.done){animation:shake .22s linear}
  @media(prefers-reduced-motion:reduce){.guide,.focus-dot,.handle{transition:none}.wrong .guide:not(.done){animation:none}}
</style>
</head>
<body data-page="03" data-total="48">
<div id="stage">
<main id="main">
  <section class="footprint-page" aria-label="Laetoli 足迹与月面鞋印对照">
    <div class="evidence-window no-pan" id="evidenceWindow">
      <figure class="scene laetoli min0">
        <img src="assets/img/p03-laetoli/00_wikimedia.jpg" alt="博物馆展出的 Laetoli 足迹步列复制品俯视图" title="Laetoli footprint trackway, Wrexham Museum；Rept0n1x；CC BY-SA 3.0">
        <figcaption class="scene-tag">LAETOLI G · 火山灰</figcaption>
        <div class="photo-observations"><span><b>步列</b>左右脚连续交替</span><span><b>接触</b>脚掌压入沉积层</span><span><b>介质</b>火山灰留下凹痕</span></div>
        <div class="scene-date"><span id="oldDate"></span><small>连续步列，左右脚交替</small></div>
      </figure>
      <figure class="scene moon min0">
        <img src="assets/img/p03-apollo/00_wikimedia.jpg" alt="阿波罗十一号宇航员在月面表土留下的鞋印近景" title="Apollo 11 image AS11-40-5877；Buzz Aldrin / NASA；Public domain">
        <figcaption class="scene-tag">月面鞋印 · 月壤</figcaption>
        <div class="photo-observations"><span><b>步列</b>单个与成组印迹</span><span><b>接触</b>靴底纹路压入表土</span><span><b>介质</b>月壤保存清晰纹路</span></div>
        <div class="scene-date"><span id="moonDate"></span><small>鞋底纹路清晰的单个印迹</small></div>
      </figure>
      <div class="align-overlay" aria-hidden="true"><i class="guide g1"></i><i class="guide g2"></i><i class="guide g3"></i></div>
      <div class="handle-wrap" aria-hidden="true"><div class="handle" id="handle">↔</div></div>
      <label class="control-strip"><input id="alignRange" type="range" min="0" max="1" value="0.5" step="0.01" aria-label="拖动脚印对齐手柄" aria-describedby="feedback"></label>
    </div>

    <p class="evidence-claim"><strong>证据边界</strong>脚印不是一条直达月球的进步路线；它只让我们比较同一种双足身体在不同技术条件下留下的痕迹。</p>

    <div class="compare-wrap min0">
      <div class="k-comparison min0" aria-label="四个观察维度的对照表">
        <div class="dim hdr">观察维度</div><div class="hdr">Laetoli G 足迹</div><div class="hdr">月面鞋印</div>
        <div class="dim">时间</div><div class="cell diff" id="tableOld"></div><div class="cell diff" id="tableMoon"></div><div class="rowline"></div>
        <div class="dim">痕迹介质</div><div class="cell">火山灰沉积层</div><div class="cell">月面表土</div><div class="rowline"></div>
        <div class="dim">可直接观察</div><div class="cell">连续步列、左右脚交替</div><div class="cell">鞋底纹路清晰，印迹成组</div><div class="rowline"></div>
        <div class="dim">身体线索</div><div class="cell">双足个体曾直立通过</div><div class="cell">双足人体穿靴活动</div>
      </div>
      <aside class="panel status-panel min0" aria-live="polite">
        <div><div class="status-title">脚跟 · 前掌 · 脚尖方向</div><div class="status-count" id="count">已对齐 0/3</div></div>
        <div class="nodes" aria-hidden="true"><i class="node"></i><i class="node"></i><i class="node"></i></div>
        <p class="feedback" id="feedback">向右拖动，先对齐脚尖方向。</p>
        <button type="button" id="reset">重新对齐</button>
      </aside>
    </div>

    <div class="time-ruler" aria-label="两类脚印的时间跨度">
      <div class="ruler-center" id="gapReadout"></div>
      <div class="time-line"><i class="focus-dot" id="focusDot"></i></div>
      <div class="ruler-labels"><span id="leftEnd"></span><span id="rightEnd"></span></div>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:3, kicker:"EVIDENCE · FOOTPRINTS", title:"两种脚印，一副身体", take:"约 366 万年前的直立脚印与 1969 年的月面鞋印之间，隔着巨大的文化与技术断裂，也保留着双足身体的连续性。"});
(function(){
  var ancientYears=3660000, moonYear=1969;
  var ancientLabel='约 '+Lec.P.formatNumber(ancientYears/10000,0)+' 万年前';
  var moonLabel=Lec.P.formatNumber(moonYear,0)+' 年';
  var gap=Lec.P.elapsedYears(-ancientYears,moonYear);
  var gapLabel='相隔约 '+Lec.P.formatNumber(gap/10000,0)+' 万年';
  ['oldDate','tableOld','leftEnd'].forEach(function(id){document.getElementById(id).textContent=ancientLabel});
  ['moonDate','tableMoon','rightEnd'].forEach(function(id){document.getElementById(id).textContent=moonLabel});
  document.getElementById('gapReadout').textContent=gapLabel;

  var range=document.getElementById('alignRange'), win=document.getElementById('evidenceWindow');
  var guides=[].slice.call(document.querySelectorAll('.guide'));
  var nodes=[].slice.call(document.querySelectorAll('.node'));
  var count=document.getElementById('count'), feedback=document.getElementById('feedback');
  var dot=document.getElementById('focusDot'), readout=document.getElementById('gapReadout');
  var handle=document.getElementById('handle'), last=0.5, timer=0;
  function render(){
    var v=Number(range.value), n=v>=.86?3:v>=.72?2:v>=.58?1:0;
    guides.forEach(function(x,i){x.classList.toggle('done',i<n)});
    nodes.forEach(function(x,i){x.classList.toggle('on',i<n)});
    count.textContent='已对齐 '+n+'/3';
    dot.style.left=(v*100)+'%';
    if(n===3){
      feedback.textContent='身体连续性 / 历史断裂：尺度可比，时间极不对称。';
      readout.textContent='身体连续性 / 历史断裂 · '+gapLabel;
      readout.classList.add('complete');
    }else{
      feedback.textContent=n===2?'最后比较脚跟位置。':n===1?'脚尖方向已对齐；继续比较前掌。':'先对齐脚尖方向，再比较脚跟与前掌位置。';
      readout.textContent=gapLabel;readout.classList.remove('complete');
    }
    if(v<last-.035 && n<3){
      win.classList.remove('wrong');void win.offsetWidth;win.classList.add('wrong');
      handle.classList.add('bump');clearTimeout(timer);timer=setTimeout(function(){handle.classList.remove('bump');win.classList.remove('wrong')},240);
    }
    last=v;
  }
  range.addEventListener('input',render);
  document.getElementById('reset').addEventListener('click',function(){range.value=.5;last=.5;render();range.focus()});
  render();
})();
</script>
</body>
</html>
