<style>
  #main{display:flex;flex-direction:column;gap:12px;padding-top:8px}#main>*{flex-shrink:0}

<div class="bottomline"><p id="feedback" class="feedback">比较名称与生存区间，再选择对应头骨。横向重叠代表生活时间重叠。</p><p class="note">区间均为约数；重叠不表示彼此是直接祖先。</p><small class="source" title="照片来源：Wikimedia Commons；具体作者与许可见各图 title">图像许可见标本悬停信息</small></div>
</main></div><script src="assets/base.js"></script><script src="assets/lec.js"></script><script src="assets/lib/d3.min.js"></script><script>
Lec.mount({index:7,kicker:"HUMAN FAMILY",title:"曾经并不孤单",take:"人族历史曾同时存在多个分支；今天只剩现代人，并不代表过去只有一条通向我们的路线。"});
const data=[{id:'sapiens',name:'智人',start:300000,end:0,clue:'哪一支延续到了今天？'},{id:'neander',name:'尼安德特人',start:350000,end:40000,clue:'哪一支大约在4万年前止步？'},{id:'flores',name:'弗洛勒斯人',start:100000,end:60000,clue:'哪一支生活在亚洲岛屿？'}];
const fmt=n=>n===0?'今天':Lec.P.formatNumber(n/10000,{maximumFractionDigits:0})+'万年前';
data.forEach(d=>document.querySelector('[data-range="'+d.id+'"]').textContent='约'+fmt(d.start)+'—'+fmt(d.end));
const svg=d3.select('#lineage-map').append('svg').attr('viewBox','0 0 1200 430').attr('role','img').attr('aria-label','三个人族分支在时间上的重叠');
const x=d3.scaleLinear().domain([350000,0]).range([70,1130]);
svg.append('rect').attr('class','overlap').attr('x',x(100000)).attr('y',30).attr('width',x(60000)-x(100000)).attr('height',330);
svg.append('text').attr('class','overlap-label').attr('x',(x(100000)+x(60000))/2).attr('y',58).attr('text-anchor','middle').text('曾经不止我们');
const axis=d3.axisBottom(x).tickValues([350000,300000,200000,100000,0]).tickFormat(d=>fmt(d));
svg.append('g').attr('class','axis').attr('transform','translate(0,380)').call(axis);
svg.append('text').attr('x',70).attr('y',414).attr('fill','var(--muted)').attr('font-size',15).text('距今年代（从过去走向今天）');
const rows=[120,220,320];
svg.selectAll('.lane').data(data).join('rect').attr('class','lane').attr('x',55).attr('y',(d,i)=>rows[i]-36).attr('width',1090).attr('height',72).attr('rx',10).attr('fill','var(--surface-high)').attr('stroke','var(--line)');
const g=svg.selectAll('.branch-g').data(data).join('g').attr('class','branch-g');
g.append('line').attr('class',d=>'branch b-'+d.id).attr('x1',d=>x(d.start)).attr('x2',d=>x(d.end)).attr('y1',(d,i)=>rows[i]).attr('y2',(d,i)=>rows[i]);
g.append('circle').attr('class',d=>'node n-'+d.id).attr('cx',d=>x(d.start)).attr('cy',(d,i)=>rows[i]).attr('r',8);
g.append('text').attr('class','branch-label').attr('x',d=>x(d.start)+12).attr('y',(d,i)=>rows[i]-16).text(d=>d.name+' · '+fmt(d.start)+'—'+fmt(d.end));
let step=0;const clue=document.querySelector('#clue'),feedback=document.querySelector('#feedback'),count=document.querySelector('#count'),reset=document.querySelector('#reset');
function render(){clue.textContent=step<data.length?data[step].clue:'三条时间枝同时可见：它们不是接力队列。';count.textContent='已点亮 '+step+' / 3';document.querySelectorAll('.progress-dots i').forEach((e,i)=>e.classList.toggle('on',i<step));reset.classList.toggle('show',step===3);if(step===3){svg.selectAll('.overlap,.overlap-label').classed('show',true);feedback.innerHTML='<strong>时间重叠已确认：</strong>过去约10万年前，至少这三支人族同时存在。';}}
function choose(id){if(step===3)return;const el=document.querySelector('[data-id="'+id+'"]');if(id!==data[step].id){el.classList.remove('wrong');void el.offsetWidth;el.classList.add('wrong');feedback.textContent='这条线索指向另一分支，请比较名称与生存区间。';return;}el.classList.add('lit');el.setAttribute('aria-pressed','true');svg.select('.b-'+id).classed('lit',true);svg.select('.n-'+id).classed('lit',true);feedback.innerHTML='<strong>时间重叠已确认：</strong>'+data[step].name+'的照片与独立时间枝已经对应。';step++;render();}
document.querySelectorAll('.specimen').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.id)));
reset.addEventListener('click',()=>{step=0;document.querySelectorAll('.specimen').forEach(e=>{e.classList.remove('lit','wrong');e.setAttribute('aria-pressed','false')});svg.selectAll('.branch,.node,.overlap,.overlap-label').classed('lit',false).classed('show',false);feedback.textContent='比较名称与生存区间，再选择对应头骨。横向重叠代表生活时间重叠。';render();});
render();
