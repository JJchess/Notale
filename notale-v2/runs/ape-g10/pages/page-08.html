<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .timeline-page{height:100%;display:flex;flex-direction:column;gap:12px}
  .intro{display:flex;align-items:center;justify-content:space-between;min-height:48px}
  .intro p{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
  .status{display:flex;align-items:center;gap:16px}
  .counter{font-family:var(--font-mono);font-size:var(--fs-body);color:var(--primary);font-weight:700}
  .board{position:relative;flex:1;min-height:0;overflow:visible;padding:0;background:linear-gradient(180deg,rgba(66,199,194,.035),transparent 55%),var(--surface-deep);border:1px solid var(--line);border-radius:var(--radius-md)}
  #timeline{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px)}
  .tick-text{font-family:var(--font-mono);font-size:13px;fill:var(--muted)}
  .end-text{font-size:15px;fill:var(--text);font-weight:700}
  .zone-label{font-size:15px;fill:var(--muted)}
  .event-card{position:absolute;width:250px;min-height:76px;padding:10px 14px;z-index:4;background:var(--surface-high);border:1px solid var(--line-strong);border-radius:var(--radius-sm);box-shadow:0 10px 24px rgba(0,0,0,.3);cursor:grab;touch-action:none;user-select:none;transition:border-color .18s,box-shadow .18s,transform .18s}
  .event-card:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .event-card.dragging{cursor:grabbing;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),0 14px 30px rgba(0,0,0,.38);transition:none}
  .event-card.placed{border-color:var(--accent);box-shadow:0 0 0 1px rgba(255,181,71,.3);cursor:default}
  .event-card strong{display:block;font-size:var(--fs-sec);line-height:1.35;color:var(--text)}
  .event-card span{display:block;margin-top:3px;font-size:var(--fs-label);line-height:1.35;color:var(--muted)}
  .event-card.placed span{color:var(--accent)}
  .tray-title{position:absolute;left:34px;bottom:112px;color:var(--muted);font-size:var(--fs-label);font-weight:700;letter-spacing:.05em}
  .feedback{position:absolute;left:34px;right:34px;bottom:14px;min-height:28px;text-align:center;font-size:var(--fs-sec);line-height:1.45;color:var(--muted)}
  .feedback.good{color:var(--accent);font-size:var(--fs-lead);font-weight:750}
  .actions{display:flex;align-items:center;justify-content:space-between}
  .instruction{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
  .mini-process{--process-cols:4;gap:26px;width:760px}
  .mini-process .axis{top:16px}
  .mini-process .step{min-height:38px;padding:30px 8px 5px;background:transparent;border:0;text-align:center;font-size:15px;line-height:1.35;color:var(--faint)}
  .mini-process .step::before{top:9px;left:calc(50% - 7px);width:10px;height:10px;border-width:2px}
  .mini-process .arw{top:4px;right:-28px;width:25px;font-size:18px}
  .mini-process .step.is-done{filter:none;opacity:1;color:var(--text)}
  .mini-process .step.is-done::before{background:var(--accent);border-color:var(--accent)}
  @keyframes shake{0%,100%{margin-left:0}25%{margin-left:-10px}75%{margin-left:10px}}
  .shake{animation:shake .22s linear 2}
  @media (prefers-reduced-motion:reduce){.event-card{transition:none}.shake{animation:none}}
</style>
</head>
<body data-page="08" data-total="48">
<div id="stage"><main id="main">
  <section class="timeline-page" aria-label="人的特征出现时间线">
    <div class="intro">
      <p>把事件拖到百万年时间轴。命中的是年代区间，不是某个精确瞬间。</p>
      <div class="status"><span class="counter" id="counter">已定位 0 / 4</span><button id="reset" type="button">一键重置</button></div>
    </div>
    <div class="board no-pan min0" id="board">
      <svg id="timeline" role="img" aria-label="从约七百万年前到现在的比例时间轴"></svg>
      <div class="tray-title">待定位事件 · 拖动，或用左右方向键调整后按 Enter</div>
      <div id="feedback" class="feedback" aria-live="polite">先比较事件与双足行走的先后，再观察真实时间间隔。</div>
    </div>
    <div class="actions">
      <div class="k-process mini-process" aria-label="事件先后序列">
        <div class="axis"></div>
        <div class="step" data-key="biped">双足行走<span class="arw"></span></div>
        <div class="step" data-key="homo">Homo 属<span class="arw"></span></div>
        <div class="step" data-key="brain">脑扩张<span class="arw"></span></div>
        <div class="step" data-key="sapiens">现代人</div>
      </div>
      <p class="instruction">时间距离按比例呈现；靠近现在的事件会集中在右端。</p>
    </div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
Lec.mount({index:8,kicker:"FEATURE TIMELINE",title:"人的特征，并非同时到货",take:"直立行走早于显著脑扩张；演化不是整套特征一次装配完成。"});

const data=[
 {key:'biped',title:'双足行走证据',copy:'已明确出现，可能更早',lo:4000000,hi:7000000,target:4400000,row:0},
 {key:'homo',title:'Homo 属出现',copy:'新的谱系标签出现',lo:2550000,hi:3050000,target:2800000,row:1},
 {key:'brain',title:'显著脑容量扩张',copy:'约 200 万年前以后逐步加速',lo:350000,hi:2100000,target:1550000,row:2},
 {key:'sapiens',title:'Homo sapiens 出现',copy:'现代人所属物种出现',lo:180000,hi:420000,target:300000,row:3}
];
const board=document.getElementById('board'), feedback=document.getElementById('feedback');
const W=1406,H=486, left=64,right=1318, axisY=252;
const x=d3.scaleLinear().domain([7000000,0]).range([left,right]);
let placed=new Set();
const initialXs=[70,346,622,898];

const svg=d3.select('#timeline').attr('viewBox',`0 0 ${W} ${H}`);
svg.append('defs').append('marker').attr('id','arrow').attr('viewBox','0 0 10 10').attr('refX',9).attr('refY',5).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto-start-reverse').append('path').attr('d','M 0 0 L 10 5 L 0 10 z').attr('fill','var(--primary)');
svg.append('line').attr('x1',left).attr('x2',right).attr('y1',axisY).attr('y2',axisY).attr('stroke','var(--primary)').attr('stroke-width',3).attr('marker-end','url(#arrow)');
const ticks=d3.range(7000000,-1,-1000000);
svg.selectAll('.tickline').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',axisY-8).attr('y2',axisY+10).attr('stroke','var(--primary-line)');
svg.selectAll('.tick-text').data(ticks.slice(0,-1)).join('text').attr('class','tick-text').attr('x',d=>x(d)).attr('y',axisY+31).attr('text-anchor','middle').text(d=>Lec.P.formatNumber(d/10000)+' 万年前');
svg.append('text').attr('class','end-text').attr('x',left).attr('y',axisY-18).text('约 700 万年前');
svg.append('text').attr('class','end-text').attr('x',right).attr('y',axisY-18).attr('text-anchor','end').text('现在');
svg.selectAll('.zone').data(data).join('rect').attr('x',d=>x(d.hi)).attr('y',d=>58+d.row*40).attr('width',d=>Math.max(8,x(d.lo)-x(d.hi))).attr('height',20).attr('rx',10).attr('fill','var(--primary-soft)').attr('stroke','var(--primary-line)').attr('stroke-dasharray',d=>d.key==='biped'||d.key==='brain'?'6 5':null);
svg.selectAll('.leader').data(data).join('line').attr('x1',d=>x(d.target)).attr('x2',d=>x(d.target)).attr('y1',d=>78+d.row*40).attr('y2',axisY).attr('stroke','var(--primary-line)').attr('stroke-dasharray','3 5');

const cards=d3.select(board).selectAll('.event-card').data(data).join('div').attr('class','event-card').attr('tabindex',0).attr('role','button').attr('aria-label',d=>d.title+'，用左右方向键调整年代，按 Enter 定位').html(d=>`<strong>${d.title}</strong><span>${d.copy}</span>`);

function setPos(el,xp,yp){el.dataset.x=xp;el.dataset.y=yp;el.style.left=xp+'px';el.style.top=yp+'px';}
function reset(){placed.clear();cards.each(function(d,i){this.className='event-card';this.removeAttribute('aria-disabled');d.candidate=3500000;setPos(this,initialXs[i],350)});feedback.className='feedback';feedback.textContent='先比较事件与双足行走的先后，再观察真实时间间隔。';update();}
function update(){document.getElementById('counter').textContent=`已定位 ${Lec.P.formatNumber(placed.size)} / ${Lec.P.formatNumber(data.length)}`;document.querySelectorAll('.mini-process .step').forEach(el=>el.classList.toggle('is-done',placed.has(el.dataset.key)));}
function check(el,d,year){if(year>=d.lo&&year<=d.hi){placed.add(d.key);el.classList.add('placed');el.setAttribute('aria-disabled','true');setPos(el,Math.max(14,Math.min(W-264,x(d.target)-125)),24+d.row*50);feedback.className='feedback';feedback.textContent=`${d.title} 已进入合适区间。继续比较其余事件。`;update();if(placed.size===data.length){feedback.className='feedback good';feedback.textContent='不是同时到货：直立行走早于显著脑扩张，人的特征在不同时段逐步出现。';}}else{const tooEarly=year>d.hi;feedback.className='feedback';feedback.textContent=`这个位置${tooEarly?'过早':'过晚'}。请先比较它与双足行走的先后。`;if(!Deck.reduced()){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}const i=data.indexOf(d);setPos(el,initialXs[i],350);}}
function dragCard(event,d){if(placed.has(d.key))return;const el=this;el.classList.add('dragging');const nx=Math.max(0,Math.min(W-250,(+el.dataset.x||0)+event.dx));const ny=Math.max(8,Math.min(358,(+el.dataset.y||0)+event.dy));setPos(el,nx,ny);d.candidate=x.invert(nx+125);}
function checkPlacement(event,d){this.classList.remove('dragging');if(!placed.has(d.key))check(this,d,d.candidate==null?3500000:d.candidate);}
const drag=d3.drag().on('drag',dragCard).on('end',checkPlacement);cards.call(drag).on('keydown',function(event,d){if(placed.has(d.key))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();const delta=event.key==='ArrowLeft'?250000:-250000;d.candidate=Lec.P.clamp((d.candidate??3500000)+delta,0,7000000);setPos(this,x(d.candidate)-125,300);}else if(event.key==='Enter'||event.key===' '){event.preventDefault();check(this,d,d.candidate??3500000);}});
document.getElementById('reset').addEventListener('click',reset);
reset();
</script>
</body>
</html>
