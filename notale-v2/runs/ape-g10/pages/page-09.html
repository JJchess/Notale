<style>
.page09{height:100%;display:flex;flex-direction:column;gap:16px}.intro{display:flex;align-items:center;justify-content:space-between;gap:24px}.intro p{max-width:930px}.status{font-size:var(--fs-sec);color:var(--muted);white-space:nowrap}.status strong{color:var(--accent)}
.workspace{display:grid;grid-template-columns:minmax(0,1.52fr) minmax(390px,.82fr);gap:16px;min-height:0;flex:1}.workspace>*{min-width:0;min-height:0}.visual{position:relative;overflow:hidden;padding:0;background:var(--surface-deep)}.field-outline{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.scene{position:relative;height:370px;overflow:hidden;touch-action:none;outline:none}.scene svg{position:absolute;inset:0;width:100%;height:100%}.tree-layer{clip-path:inset(0 0 0 var(--cut));transition:clip-path .08s linear}.side-label{position:absolute;top:12px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:rgba(7,16,25,.82);font-size:var(--fs-label);font-weight:700}.side-label.bad{left:14px;color:var(--muted)}.side-label.good{right:14px;color:var(--primary)}
.divider{position:absolute;top:0;bottom:0;left:var(--cut);width:3px;transform:translateX(-1px);background:var(--accent);box-shadow:0 0 14px rgba(255,181,71,.65);pointer-events:none}.divider:before{content:"↔";position:absolute;top:10px;left:-18px;width:38px;height:34px;display:grid;place-items:center;color:#071019;background:var(--accent);border-radius:18px;font-size:20px;font-weight:800}.reveal-range{position:absolute;left:12px;right:12px;bottom:8px;width:calc(100% - 24px);height:30px;opacity:.01;cursor:ew-resize}.hotspot{position:absolute;z-index:4;min-height:38px;padding:6px 11px;border-radius:18px;background:#0b1721;border:1px dashed var(--primary);font-size:var(--fs-label)}.hotspot[data-key="branch"]{left:49%;top:44%}.hotspot[data-key="coexist"]{left:68%;top:23%}.hotspot[data-key="extinct"]{left:75%;top:66%}.zone{position:absolute;z-index:1;top:55px;bottom:70px;width:14%;border:1px solid var(--line);border-radius:var(--radius-sm);pointer-events:none}.z1{left:6%}.z2{left:24%}.z3{left:42%}.z4{left:60%}.z5{left:78%}.scene-note{position:absolute;z-index:3;padding:6px 9px;color:var(--muted);background:rgba(7,16,25,.78);border-left:3px solid var(--primary);font-size:var(--fs-label);line-height:1.4;pointer-events:none}.n1{left:7%;top:23%}.n2{left:26%;top:53%}.n3{left:43%;top:72%}.n4{left:58%;top:28%}.n5{left:64%;top:54%}.n6{left:81%;top:76%}.hotspot.done{color:#071019;background:var(--accent);border-style:solid;border-color:var(--accent);box-shadow:0 0 18px rgba(255,181,71,.5)}.hotspot.wrong{animation:shake .3s}.feedback{height:48px;padding:10px 16px;border-top:1px solid var(--line);font-size:var(--fs-sec);line-height:1.45;color:var(--muted)}.feedback.ok{color:var(--accent)}
.side{display:flex;flex-direction:column;gap:12px}.k-comparison{--compare-cols:94px repeat(2,minmax(0,1fr));flex:1;position:relative}.k-comparison>*{padding:8px 10px;position:relative;z-index:1}.k-comparison .matrix-lines{position:absolute;inset:0;width:100%;height:100%;padding:0;z-index:0;pointer-events:none}.k-comparison .hdr{font-size:var(--fs-sec)}.k-comparison .dim{font-size:var(--fs-label)}.k-comparison .cell{font-size:var(--fs-sec)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px}.legend{font-size:var(--fs-label);color:var(--muted)}
.branchline{fill:none;stroke:var(--primary);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.ghost{stroke:rgba(156,176,185,.36)}.trunk-glow{filter:drop-shadow(0 0 7px rgba(66,199,194,.65))}.active-path{stroke:var(--accent)!important;filter:drop-shadow(0 0 7px rgba(255,181,71,.8))}.sil{fill:#8fa4ac;stroke:#c9d7da;stroke-width:1.2}.tree-sil{fill:#63c8c3}.foot{fill:rgba(66,199,194,.22)}.endx{stroke:var(--primary);stroke-width:4}.active-mark{stroke:var(--accent)}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}@media(prefers-reduced-motion:reduce){.tree-layer{transition:none}.hotspot.wrong{animation:none}}
</style>
</head>
<body data-page="09" data-total="48">
<div id="stage">
<main id="main">
<section class="page09">
  <div class="intro">
    <p class="lead">“猿—猿人—人”的整齐队列不是演化过程的缩影，而是一种会误导因果与时间关系的排版。</p>
    <div class="status" aria-live="polite">已找出 <strong id="count">0/3</strong>：<span id="found">尚未辨认</span></div>
  </div>
  <div class="workspace">
    <section class="visual panel min0" aria-labelledby="compareTitle">
      <svg class="field-outline" viewBox="0 0 900 418" preserveAspectRatio="none" aria-hidden="true"><path d="M1 1H899V417H1Z" fill="none" stroke="rgba(66,199,194,.18)"/><path d="M0 370H900" stroke="rgba(190,222,226,.16)"/></svg>
      <div class="scene no-pan" id="scene" style="--cut:50%" tabindex="0" aria-label="拖动或按左右方向键移动揭示线；点击分叉、共存、灭绝区域">
        <svg viewBox="0 0 900 370" role="img" aria-label="同一组五个轮廓在单线队列中依次排列">
          <defs><g id="person"><circle cx="0" cy="-34" r="13"/><path d="M-10-19 Q-18 15-13 45 L-24 82 L-9 82 L2 48 L15 82 L30 82 L14 37 L16-10 Q8-23-10-19Z"/></g></defs>
          <g fill="rgba(23,41,54,.72)" stroke="rgba(190,222,226,.16)"><rect x="55" y="55" width="130" height="245" rx="10"/><rect x="220" y="55" width="130" height="245" rx="10"/><rect x="385" y="55" width="130" height="245" rx="10"/><rect x="550" y="55" width="130" height="245" rx="10"/><rect x="715" y="55" width="130" height="245" rx="10"/></g>
          <path d="M80 275 H825" class="branchline ghost"/><path d="M790 264 l35 11-35 11" class="branchline ghost"/>
          <g class="sil"><use href="#person" transform="translate(120 230) rotate(-24) scale(.78)"/><use href="#person" transform="translate(285 225) rotate(-15) scale(.85)"/><use href="#person" transform="translate(450 220) rotate(-8) scale(.91)"/><use href="#person" transform="translate(615 216) rotate(-3) scale(.96)"/><use href="#person" transform="translate(780 212)"/></g>
          <g class="foot"><ellipse cx="115" cy="325" rx="17" ry="7"/><ellipse cx="280" cy="325" rx="17" ry="7"/><ellipse cx="445" cy="325" rx="17" ry="7"/><ellipse cx="610" cy="325" rx="17" ry="7"/><ellipse cx="775" cy="325" rx="17" ry="7"/></g>
        </svg>
        <svg class="tree-layer" viewBox="0 0 900 370" aria-hidden="true">
          <rect width="900" height="370" fill="#0b1721"/>
          <g fill="rgba(66,199,194,.055)"><rect x="55" y="80" width="795" height="68"/><rect x="55" y="152" width="795" height="66"/><rect x="55" y="222" width="795" height="66"/><rect x="55" y="292" width="795" height="45"/></g>
          <g stroke="rgba(190,222,226,.16)" stroke-width="1"><path d="M55 80H850"/><path d="M55 150H850"/><path d="M55 220H850"/><path d="M55 290H850"/></g>
          <path d="M450 335V280 M450 280L210 210V115 M450 280L450 205V92 M450 205L650 150V76 M650 150L780 215V250" class="branchline trunk-glow" id="branchPath"/>
          <path d="M130 150H760" class="branchline ghost" stroke-dasharray="8 10" id="coexistPath"/>
          <path d="M780 215V250" class="branchline" id="extinctPath"/><path d="M766 250h28M773 239l14 22M787 239l-14 22" class="endx" id="endMark"/>
          <g class="tree-sil"><use href="#person" transform="translate(210 105) rotate(-24) scale(.78)"/><use href="#person" transform="translate(450 82) rotate(-15) scale(.85)"/><use href="#person" transform="translate(650 68) rotate(-8) scale(.91)"/><use href="#person" transform="translate(780 205) rotate(-3) scale(.96)"/><use href="#person" transform="translate(450 195)"/></g>
          <g class="foot"><ellipse cx="450" cy="344" rx="17" ry="7"/><ellipse cx="450" cy="305" rx="17" ry="7"/></g>
        </svg>
        <i class="zone z1" aria-hidden="true"></i><i class="zone z2" aria-hidden="true"></i><i class="zone z3" aria-hidden="true"></i><i class="zone z4" aria-hidden="true"></i><i class="zone z5" aria-hidden="true"></i>
        <span class="side-label bad">错误隐喻 · 单线升级</span><span class="side-label good">谱系关系 · 分叉共存</span>
        <div class="divider" aria-hidden="true"></div>
        <input class="reveal-range" id="reveal" type="range" min="0" max="100" step="5" value="50" aria-label="树形解释揭示比例">
        <button class="hotspot" data-key="branch" aria-pressed="false">分叉</button>
        <button class="hotspot" data-key="coexist" aria-pressed="false">共存</button>
        <button class="hotspot" data-key="extinct" aria-pressed="false">灭绝</button>
      </div>
      <div class="feedback" id="feedback" aria-live="polite">拖动揭示线，再点出树中被队列抹掉的三种关系。</div>
    </section>
    <aside class="side min0">
      <div class="k-comparison" aria-label="梯子队列与分叉树的四个同维度比较">
        <svg class="matrix-lines" viewBox="0 0 400 460" preserveAspectRatio="none" aria-hidden="true"><path d="M94 0V460M247 0V460" stroke="rgba(190,222,226,.16)"/><path d="M0 92H400M0 184H400M0 276H400M0 368H400" stroke="rgba(190,222,226,.16)"/></svg>
        <div class="hdr dim">比较维度</div><div class="hdr">梯子队列</div><div class="hdr">分叉树</div>
        <div class="dim">路径</div><div class="cell">一条线，依次替换</div><div class="cell diff">多条枝，从共同节点分开</div><div class="rowline"></div>
        <div class="dim">同时存在</div><div class="cell">看起来只有一个阶段</div><div class="cell diff">多个分支占据同一时间带</div><div class="rowline"></div>
        <div class="dim">灭绝</div><div class="cell">消失者被队列省略</div><div class="cell diff">截断枝明确保留</div><div class="rowline"></div>
        <div class="dim">方向</div><div class="cell">越靠右越像“更高级”</div><div class="cell diff">只有变化，没有预设终点</div>
      </div>
      <div class="actions"><span class="legend">同一轮廓 · 不同连接 · 不同历史</span><button id="reset" type="button">重看梯子陷阱</button></div>
    </aside>
  </div>
</section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index: 9, kicker: "LADDER TRAP", title: "队列不是演化史", take: "“猿—猿人—人”的经典队列会把分叉、共存和灭绝全部抹平。"});
const scene=document.getElementById('scene'), reveal=document.getElementById('reveal');
const feedback=document.getElementById('feedback'), count=document.getElementById('count'), found=document.getElementById('found');
const done=new Set(), names={branch:'分叉',coexist:'共存',extinct:'灭绝'};
function setCut(v){const n=Deck.clamp(Number(v),0,100);reveal.value=n;scene.style.setProperty('--cut',n+'%');}
reveal.addEventListener('input',e=>setCut(e.target.value));
scene.addEventListener('pointermove',e=>{if(e.pointerType==='mouse' && e.buttons===0){const p=Deck.pt(scene,e);setCut(p.x/scene.offsetWidth*100);}});
scene.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setCut(Number(reveal.value)+(e.key==='ArrowRight'?5:-5));}});
document.querySelectorAll('.hotspot').forEach(btn=>btn.addEventListener('click',()=>{
 const k=btn.dataset.key;if(Number(reveal.value)<45){btn.classList.remove('wrong');void btn.offsetWidth;btn.classList.add('wrong');feedback.className='feedback';feedback.textContent='队列能显示外形次序，却不能显示这里的谱系关系。';return;}
 done.add(k);btn.classList.add('done');btn.setAttribute('aria-pressed','true');document.getElementById(k==='branch'?'branchPath':k==='coexist'?'coexistPath':'extinctPath').classList.add('active-path');if(k==='extinct')document.getElementById('endMark').classList.add('active-mark');
 count.textContent=done.size+'/3';found.textContent=[...done].map(x=>names[x]).join('／');feedback.className='feedback ok';feedback.textContent='已找出“'+names[k]+'”：连接方式改变，历史含义也改变。';
 if(done.size===3){setCut(100);feedback.textContent='队列省略了三件事：分叉、共存与灭绝。';}
}));
document.getElementById('reset').addEventListener('click',()=>{done.clear();setCut(50);count.textContent='0/3';found.textContent='尚未辨认';feedback.className='feedback';feedback.textContent='拖动揭示线，再点出树中被队列抹掉的三种关系。';document.querySelectorAll('.hotspot').forEach(b=>{b.classList.remove('done','wrong');b.setAttribute('aria-pressed','false')});document.querySelectorAll('.active-path,.active-mark').forEach(x=>x.classList.remove('active-path','active-mark'));scene.focus();});
</script>
</body>
