<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lesson{width:var(--content-w);height:var(--content-h);display:flex;flex-direction:column;gap:14px;padding-top:10px}
  .class-col>.lv{height:100%;margin-left:0;padding-left:18px}
  .progress-row{height:32px;display:flex;align-items:center;justify-content:space-between}
  .progress-copy{font-family:var(--font-mono);font-size:var(--fs-sec);color:var(--muted)}
  .progress-copy strong{color:var(--accent);font-size:var(--fs-lead)}
  .boundary{display:flex;gap:10px;min-height:58px}
  .boundary span{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:var(--fs-sec);line-height:1.45;background:var(--primary-soft);border:1px solid var(--primary-line);border-radius:var(--radius-sm)}
  .boundary b{color:var(--primary);margin-right:8px}
  .nodes{display:flex;align-items:center;gap:9px}
  .node{width:64px;height:28px;display:grid;place-items:center;color:var(--muted);font-family:var(--font-mono);font-size:var(--fs-tick);border:1px solid var(--primary-line);border-radius:4px;background:var(--surface);transition:.25s ease}
  .node.done{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px rgba(255,181,71,.35)}
  .class-stage{position:relative;display:flex;gap:18px;flex:1;min-height:0}
  .class-stage::before{content:"";position:absolute;z-index:-1;left:50%;bottom:-8px;width:2px;height:110px;background:linear-gradient(transparent,var(--primary));transform:translateX(-50%)}
  .class-stage::after{content:"";position:absolute;z-index:-1;left:25%;right:25%;bottom:42px;height:68px;border:2px solid var(--primary-line);border-bottom:0;border-radius:70px 70px 0 0;clip-path:polygon(0 45%,49.7% 45%,49.7% 0,50.3% 0,50.3% 45%,100% 45%,100% 49%,50.3% 49%,50.3% 100%,49.7% 100%,49.7% 49%,0 49%)}
  .class-col{flex:1;min-width:0;height:100%}
  .k-classification.class-col{gap:0}
  .class-col .box{height:100%;padding:14px;display:flex;flex-direction:column;background:var(--surface-high)}
  .class-col .box>.bt{margin:-14px -14px 10px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
  .class-col.good .box{border-color:var(--primary-line)}
  .class-col.trap .box{border-color:rgba(255,181,71,.28)}
  .kind{font-size:var(--fs-h2)}
  .kind-mark{font-family:var(--font-mono);font-size:var(--fs-label);color:var(--primary)}
  .trap .kind-mark{color:var(--accent)}
  .basis{min-height:46px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .basis b{display:inline-flex;align-items:center;min-height:34px;padding:4px 9px;color:var(--text);font-weight:650;background:var(--primary-soft);border:1px solid var(--primary-line);border-radius:var(--radius-sm)}
  .trap .basis b{background:var(--accent-soft);border-color:rgba(255,181,71,.36)}
  .ledger{display:flex;flex-direction:column;gap:3px;min-height:0;overflow:hidden}
  .entry,.slot{min-height:120px;padding:8px 11px;background:var(--primary-soft);border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:var(--radius-sm)}
  .entry{animation:land .28s ease both}
  .slot{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;color:var(--muted);font-size:var(--fs-label);border-style:dashed;border-left-style:solid}
  .slot strong{color:var(--text);font-size:var(--fs-sec);line-height:1.4}
  .slot small{display:block;margin-top:5px;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
  .trap .entry{border-left-color:var(--accent)}
  .entry .statement{font-size:var(--fs-sec);line-height:1.4;color:var(--text)}
  .entry .why{margin-top:3px;font-size:var(--fs-label);line-height:1.4;color:var(--muted)}
  .decision{width:520px;flex:0 0 520px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:16px 20px;background:var(--surface-high);border:1px solid var(--line-strong);border-radius:var(--radius-md);box-shadow:var(--shadow)}
  .prompt{font-family:var(--font-mono);font-size:var(--fs-label);color:var(--primary);letter-spacing:.08em}
  .current{min-height:92px;display:flex;align-items:center;font-size:var(--fs-lead);line-height:1.5;font-weight:650}
  .inspect{display:flex;gap:7px}
  .inspect span{flex:1;min-height:84px;display:flex;align-items:center;justify-content:center;padding:5px;color:var(--muted);font-size:var(--fs-label);line-height:1.4;text-align:center;background:var(--primary-soft);border:1px solid var(--primary-line);border-radius:var(--radius-sm)}
  .inspect b{color:var(--primary);margin-right:5px}
  .actions{display:flex;gap:10px}
  .actions button{flex:1;min-height:48px;font-size:var(--fs-sec)}
  .actions .choose-good{border-color:var(--primary-line)}
  .actions .choose-trap{border-color:rgba(255,181,71,.45)}
  .feedback{min-height:70px;padding:10px 12px;font-size:var(--fs-sec);line-height:1.45;color:var(--muted);background:var(--surface-deep);border-left:3px solid var(--primary);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
  .feedback.wrong{color:var(--text);border-left-color:var(--accent);background:var(--accent-soft)}
  .feedback strong{color:var(--accent)}
  .reset{align-self:center;display:none}
  .reset.show{display:block}
  .final{display:none;text-align:center;color:var(--text);font-size:var(--fs-h2);font-weight:750}
  .final.show{display:block}
  .shake{animation:shake .28s linear}
  .lec-take.complete{color:var(--accent);text-shadow:0 0 18px rgba(255,181,71,.18)}
  @keyframes shake{25%{transform:translateX(-9px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
  @keyframes land{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.node,.entry,.shake{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="10" data-total="48">
<div id="stage">
<main id="main">
  <section class="lesson" aria-label="演化说法分类练习">
    <div class="progress-row">
      <p class="progress-copy">已判断 <strong id="doneCount">0</strong> / <span id="totalCount">6</span></p>
      <div class="nodes" id="nodes" aria-label="判断进度"></div>
    </div>
    <div class="class-stage">
      <section class="k-classification class-col good min0" aria-labelledby="goodTitle">
        <div class="lv min0" style="--level:0">
          <div class="box">
            <div class="bt"><span class="kind" id="goodTitle">符合定义</span><span class="kind-mark">CHANGE</span></div>
            <p class="basis"><b>群体差异</b><b>可遗传</b><b>跨世代改变</b></p>
            <div class="ledger" id="goodLedger" aria-live="polite"><div class="slot">群体中的差异比例改变？</div><div class="slot">差异可以传给后代？</div><div class="slot">变化跨越多个世代？</div></div>
          </div>
        </div>
      </section>

      <section class="decision min0" aria-label="当前陈述">
        <p class="prompt" id="prompt">判断第 1 条</p>
        <p class="current" id="current"></p>
        <div class="inspect" aria-label="判断问题"><span><b>对象</b>群体？</span><span><b>时间</b>跨世代？</span><span><b>含义</b>只是改变？</span></div>
        <div class="inspect" aria-label="排除的目的论词语"><span>不问“谁更高级”</span><span>不问“为了什么”</span><span>不预设必然终点</span></div>
        <div class="inspect" aria-label="定义中的三个尺度"><span><b>单位</b>群体差异</span><span><b>尺度</b>多个世代</span><span><b>结果</b>比例改变</span></div>
        <div class="inspect" aria-label="环境条件会改变"><span>环境会改变</span><span>优势可能变负担</span><span>适合并非永久进步</span></div>
        <div class="actions" id="actions">
          <button class="choose-good" type="button" data-choice="good">符合定义</button>
          <button class="choose-trap" type="button" data-choice="trap">偷加进步／目的</button>
        </div>
        <p class="feedback" id="feedback" aria-live="assertive">选择分类依据，而不是判断这句话听起来是否积极。</p>
        <p class="final" id="final">改变 ≠ 进步；过程 ≠ 目的</p>
        <button class="reset" id="reset" type="button">重新判断</button>
      </section>

      <section class="k-classification class-col trap min0" aria-labelledby="trapTitle">
        <div class="lv min0" style="--level:0">
          <div class="box">
            <div class="bt"><span class="kind" id="trapTitle">偷加进步／目的</span><span class="kind-mark">DESTINATION</span></div>
            <p class="basis"><b>更高级</b><b>为了</b><b>必然</b><b>需要</b></p>
            <div class="ledger" id="trapLedger" aria-live="polite"><div class="slot">声称生物越来越高级？</div><div class="slot">出现“为了”或“需要”？</div><div class="slot">预设人类或复杂性为终点？</div></div>
          </div>
        </div>
      </section>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index: 10, kicker: "DEFINE EVOLUTION", title: "演化没有终点", take: "演化只描述群体中可遗传差异随世代改变，不承诺进步或目的。"});

const items = [
  {text:"一个群体中某些可遗传差异，经过多代后变得更常见。", kind:"good", why:"描述了群体中可遗传差异随世代改变。"},
  {text:"个体为了适应环境，在一生中进化出需要的特征。", kind:"trap", why:"个体一生中的改变不等于群体跨世代演化，“为了需要”还预设了目的。"},
  {text:"演化可能使某特征更适合当时环境，也可能在环境改变后成为负担。", kind:"good", why:"适合度取决于具体环境，不等于永久进步。"},
  {text:"演化最终会把生物变得越来越复杂、越来越高级。", kind:"trap", why:"演化没有预设的复杂化方向或等级终点。"},
  {text:"若群体中可遗传差异的比例跨世代改变，就发生了演化。", kind:"good", why:"这是本页采用的操作性表述。"},
  {text:"人类出现是演化早已设定好的目标。", kind:"trap", why:"演化过程不预先指向人类或任何终点。"}
];
const current = document.getElementById('current');
const prompt = document.getElementById('prompt');
const feedback = document.getElementById('feedback');
const actions = document.getElementById('actions');
const reset = document.getElementById('reset');
const final = document.getElementById('final');
const doneCount = document.getElementById('doneCount');
const totalCount = document.getElementById('totalCount');
const nodes = document.getElementById('nodes');
let index = 0;

function num(value){ return Lec.P.formatNumber(value); }
function buildNodes(){
  nodes.replaceChildren();
  items.forEach((_, i) => {
    const n = document.createElement('span');
    n.className = 'node' + (i < index ? ' done' : '');
    n.textContent = num(i + 1);
    n.setAttribute('aria-label', `第${num(i + 1)}条${i < index ? '已完成' : '未完成'}`);
    nodes.appendChild(n);
  });
}
function render(){
  doneCount.textContent = num(index);
  totalCount.textContent = num(items.length);
  buildNodes();
  feedback.className = 'feedback';
  if(index < items.length){
    prompt.textContent = `判断第 ${num(index + 1)} 条`;
    current.textContent = items[index].text;
    actions.style.display = 'flex';
    feedback.textContent = '选择分类依据，而不是判断这句话听起来是否积极。';
    final.classList.remove('show');
    reset.classList.remove('show');
  } else {
    prompt.textContent = '定义边界已完成';
    current.textContent = '演化描述的是群体跨世代变化，不是个体“努力改变”。';
    actions.style.display = 'none';
    feedback.textContent = '“更适合某个环境”不等于“更高级”，演化也没有预定目标。';
    final.classList.add('show');
    reset.classList.add('show');
    document.querySelector('.lec-take').classList.add('complete');
    reset.focus();
  }
}
function choose(choice){
  const item = items[index];
  if(!item) return;
  if(choice !== item.kind){
    feedback.className = 'feedback wrong';
    feedback.innerHTML = `<strong>请换一类。</strong>${item.why}`;
    current.classList.remove('shake');
    void current.offsetWidth;
    current.classList.add('shake');
    return;
  }
  const entry = document.createElement('article');
  entry.className = 'entry';
  const s = document.createElement('p');
  s.className = 'statement';
  s.textContent = item.text;
  const w = document.createElement('p');
  w.className = 'why';
  w.textContent = item.why;
  entry.append(s,w);
  const ledger = document.getElementById(choice === 'good' ? 'goodLedger' : 'trapLedger');
  const slot = ledger.querySelector('.slot');
  if(slot) slot.replaceWith(entry);
  index += 1;
  render();
}
document.querySelectorAll('[data-choice]').forEach(btn => btn.addEventListener('click', () => choose(btn.dataset.choice)));
reset.addEventListener('click', () => {
  index = 0;
  ['goodLedger','trapLedger'].forEach(id => {
    const ledger = document.getElementById(id);
    ledger.replaceChildren();
    for(let i=0;i<3;i++){
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.textContent = '等待归入此类';
      ledger.appendChild(slot);
    }
  });
  document.querySelector('.lec-take').classList.remove('complete');
  render();
  document.querySelector('[data-choice="good"]').focus();
});
render();
</script>
</body>
</html>
