<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .position-scene{height:100%;display:flex;flex-direction:column;gap:12px;padding:8px 0;box-sizing:border-box;background:linear-gradient(90deg,rgba(66,199,194,.025),transparent 35%,rgba(66,199,194,.025));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .before-line{display:flex;align-items:center;gap:16px;min-height:42px;padding:10px 18px;background:var(--surface-deep);border:1px solid var(--line);border-radius:var(--radius-sm)}
    .before-line .tag{flex:0 0 auto;color:var(--muted);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;letter-spacing:.08em}
    .before-text{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,181,71,.65)}
    .workbench{display:flex;gap:22px;min-height:0;flex:1}
    .answer-zone{flex:0 0 48%;display:flex;flex-direction:column;gap:10px;padding:16px 20px;background:linear-gradient(145deg,rgba(66,199,194,.12),transparent 48%),var(--surface-high);border:1px solid var(--primary-line);border-radius:var(--radius-md);box-shadow:var(--shadow)}
    .answer-zone h2{font-size:var(--fs-h2)}
    .prompt{color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    #rewrite{width:100%;height:86px;resize:none;box-sizing:border-box;font-size:var(--fs-body);line-height:1.5;border-width:2px}
    #rewrite.shake{animation:shake .28s ease}
    @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
    .constraint-row{display:flex;align-items:center;gap:10px;min-height:28px}
    .counter{margin-right:auto;color:var(--text);font-family:var(--font-mono);font-size:var(--fs-sec);font-weight:700}
    .constraint{padding:3px 9px;color:var(--muted);border:1px solid var(--line);border-radius:999px;font-size:var(--fs-sec);line-height:1.4}
    .constraint.hit{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    .actions button{font-size:var(--fs-sec)}
    .actions .primary-action{background:var(--primary-soft);border-color:var(--primary)}
    #feedback{min-height:48px;padding:10px 12px;color:var(--muted);background:var(--surface-deep);border-left:4px solid var(--line-strong);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    #feedback.success{color:var(--text);border-color:var(--accent);background:var(--accent-soft)}
    .tree-zone{position:relative;flex:1;min-width:0;overflow:hidden;background:radial-gradient(circle at 48% 62%,rgba(66,199,194,.18),transparent 52%),var(--surface);border:1px solid var(--line);border-radius:var(--radius-md)}
    .tree-zone svg{position:absolute;inset:0;width:100%;height:100%}
    .tree-line{fill:none;stroke:var(--primary-line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .tree-line.active{stroke:var(--accent);filter:drop-shadow(0 0 5px rgba(255,181,71,.55))}
    .tip{position:absolute;top:42px;transform:translateX(-50%);text-align:center;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
    .tip::before{content:"";display:block;width:13px;height:13px;margin:0 auto 6px;background:var(--surface-deep);border:3px solid var(--primary);border-radius:50%}
    .tip.human{left:80%;color:var(--text);font-weight:700}.tip.a{left:18%}.tip.b{left:39%}.tip.c{left:59%}
    .tip.human::before{border-color:var(--accent)}
    .tree-zone.completed .tip.human::before{background:var(--accent);box-shadow:0 0 18px rgba(255,181,71,.85)}
    .same-level{position:absolute;top:18px;left:10%;right:8%;border-top:1px dashed var(--line-strong);text-align:right;color:var(--faint);font-size:var(--fs-label)}
    .footprints{position:absolute;left:22px;bottom:22px;display:flex;gap:13px;transform:rotate(-12deg)}
    .foot{width:12px;height:25px;background:var(--primary-soft);border:1px solid var(--primary-line);border-radius:55% 45% 48% 52%;transform:rotate(20deg)}
    .tree-note{position:absolute;left:22px;right:22px;bottom:18px;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec);text-align:right}
    .generalization-band{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:48px;min-height:142px}
    .generalization-band .claim{align-self:stretch;display:flex;flex-direction:column;justify-content:center}
    .claim small{display:block;margin-bottom:5px;color:var(--primary);font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.06em}
    .support strong{display:block;margin-bottom:2px;color:var(--text);font-size:var(--fs-sec)}
    .support{transition:border-color .2s,background .2s}
    .support.active{border-color:var(--accent);background:var(--accent-soft)}
    @media (prefers-reduced-motion:reduce){#rewrite.shake{animation:none}.support{transition:none}}
  </style>
</head>
<body data-page="11" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="position-scene" aria-label="改写人类在自然中的位置">
        <div class="before-line"><span class="tag">待改写</span><span class="before-text" id="original">人类高于自然，因为人类是演化的最高阶段。</span></div>
        <div class="workbench">
          <section class="answer-zone min0" aria-labelledby="rewrite-title">
            <h2 id="rewrite-title">把等级判断改成位置描述</h2>
            <p class="prompt">写出人类与自然的归属，并去掉“最高阶段”的含义。</p>
            <textarea id="rewrite" aria-label="改写句子" placeholder="人类________自然，因为________。">人类高于自然，因为人类是演化的最高阶段。</textarea>
            <div class="constraint-row" aria-live="polite">
              <span class="counter" id="counter">关键约束 0/2</span>
              <span class="constraint" id="belongMark">属于自然</span>
              <span class="constraint" id="rankMark">不是等级</span>
            </div>
            <div class="actions">
              <button class="primary-action" id="check" type="button">查看证据反馈</button>
              <button id="another" type="button">换一种写法</button>
              <button id="reset" type="button">恢复原句</button>
            </div>
            <p id="feedback" aria-live="polite">证据不要求唯一答案，只检查两类关键约束。</p>
          </section>
          <figure class="tree-zone min0" aria-label="各现生分支处于同一高度，人类是其中一个末端">
            <div class="same-level">现生末端 · 同一高度</div>
            <svg viewBox="0 0 650 360" role="img" aria-label="一条主干分叉为四个同高末端">
              <path class="tree-line" d="M35 315 C125 290 145 248 205 226 C275 200 305 183 325 145"/>
              <path class="tree-line evidence-line" data-line="class" d="M325 145 C265 130 170 112 117 70"/>
              <path class="tree-line evidence-line" data-line="branch" d="M325 145 C310 117 275 95 254 70"/>
              <path class="tree-line evidence-line" data-line="purpose" d="M325 145 C380 118 468 105 520 70"/>
              <path class="tree-line" d="M325 145 C353 115 373 92 383 70"/>
            </svg>
            <span class="tip a">分支甲</span><span class="tip b">分支乙</span><span class="tip c">分支丙</span><span class="tip human">人类</span>
            <div class="footprints" aria-hidden="true"><i class="foot"></i><i class="foot"></i><i class="foot"></i><i class="foot"></i></div>
            <figcaption class="tree-note">定位一个末端，不把它抬到其他分支之上。</figcaption>
          </figure>
        </div>
        <section class="k-generalization generalization-band" aria-label="主张与三条支撑">
          <div class="claim"><small>归纳后的主张</small><span id="claimText">人类可以是一条特殊分支，但“特殊”不等于“高于”。</span></div>
          <div class="supports">
            <div class="trunk" aria-hidden="true"></div>
            <div class="support" id="supportClass"><strong>分类位置</strong>人类属于自然界，也是现存大型类人猿的一支。</div>
            <div class="support" id="supportBranch"><strong>分叉关系</strong>演化产生并存分支，不产生从低到高的队列。</div>
            <div class="support" id="supportPurpose"><strong>特殊但非更高</strong>独特组合不等于演化终点或最高级。</div>
          </div>
        </section>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index: 11, kicker: "POSITION, NOT RANK", title: "把人放回演化树上", take: "把“人类高于自然”改写为“人类位于自然的一条特殊分支”更符合证据。"});
    const input=document.getElementById('rewrite');
    const original='人类高于自然，因为人类是演化的最高阶段。';
    const belongTerms=['属于自然','自然的一部分','猿类的一支'];
    const branchTerms=['分支','分叉','谱系','并存'];
    const nonRankTerms=['特殊','独特','不是最高','没有高低','不是终点'];
    const rankBad=['最高阶段','高于自然','最高级','演化终点','更先进'];
    function state(){
      const text=input.value.trim();
      const belong=belongTerms.some(x=>text.includes(x));
      const branch=branchTerms.some(x=>text.includes(x));
      const special=nonRankTerms.some(x=>text.includes(x));
      const nonRank=special&&!rankBad.some(x=>text.includes(x));
      return {text,belong,branch,special,nonRank,ok:belong&&nonRank};
    }
    function paint(s,submitted){
      document.getElementById('belongMark').classList.toggle('hit',s.belong);
      document.getElementById('rankMark').classList.toggle('hit',s.nonRank);
      const count=Number(s.belong)+Number(s.nonRank);
      document.getElementById('counter').textContent='关键约束 '+count+'/2';
      document.getElementById('supportClass').classList.toggle('active',s.belong);
      document.getElementById('supportBranch').classList.toggle('active',s.branch||s.ok);
      document.getElementById('supportPurpose').classList.toggle('active',s.nonRank);
      document.querySelector('[data-line="class"]').classList.toggle('active',s.belong);
      document.querySelector('[data-line="branch"]').classList.toggle('active',s.branch||s.ok);
      document.querySelector('[data-line="purpose"]').classList.toggle('active',s.nonRank);
      document.querySelector('.tree-zone').classList.toggle('completed',s.ok);
      if(!submitted)return;
      const feedback=document.getElementById('feedback');
      feedback.classList.toggle('success',s.ok);
      if(s.ok){feedback.textContent='成立：你把等级判断改成了谱系位置。';document.getElementById('claimText').textContent=s.text;document.getElementById('original').style.opacity='.35';}
      else if(!s.belong){feedback.textContent='还需说明：人类仍位于自然之中。';}
      else{feedback.textContent='还需去掉：最高、终点或高于其他分支的含义。';}
      if(!s.ok&&!Deck.reduced()){input.classList.remove('shake');void input.offsetWidth;input.classList.add('shake');}
    }
    input.addEventListener('input',()=>paint(state(),false));
    document.getElementById('check').addEventListener('click',()=>paint(state(),true));
    document.getElementById('another').addEventListener('click',()=>{input.value='';resetView();input.focus();});
    document.getElementById('reset').addEventListener('click',()=>{input.value=original;resetView();input.focus();});
    function resetView(){document.getElementById('feedback').textContent='证据不要求唯一答案，只检查两类关键约束。';document.getElementById('feedback').classList.remove('success');document.getElementById('claimText').textContent='人类可以是一条特殊分支，但“特殊”不等于“高于”。';document.getElementById('original').style.opacity='1';paint(state(),false);}
    paint(state(),false);
  </script>
</body>
</html>
