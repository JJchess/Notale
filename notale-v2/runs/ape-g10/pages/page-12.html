<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .system-plate{position:relative;width:var(--content-w);height:var(--content-h);overflow:hidden;background:linear-gradient(90deg,rgba(66,199,194,.025) 1px,transparent 1px),linear-gradient(rgba(66,199,194,.025) 1px,transparent 1px);background-size:44px 44px;border:1px solid var(--line);border-radius:var(--radius-md);}
  .system-plate::before,.system-plate::after{content:"";position:absolute;width:22px;height:22px;border-color:var(--primary);opacity:.65;}
  .system-plate::before{left:14px;top:14px;border-left:1px solid;border-top:1px solid;}
  .system-plate::after{right:14px;bottom:14px;border-right:1px solid;border-bottom:1px solid;}
  .plate-id{position:absolute;left:24px;top:18px;color:var(--muted);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.08em;}
  .diagram{position:absolute;inset:0;width:100%;height:100%;}
  .body-line,.part-line,.trace,.connector{fill:none;stroke:var(--primary);vector-effect:non-scaling-stroke;}
  .body-line{stroke-width:2;opacity:.78;stroke-dasharray:930;stroke-dashoffset:930;animation:draw .72s ease-out forwards;}
  .part-line{stroke-width:1.5;opacity:.9;}
  .trace{stroke-width:1;opacity:.28;stroke-dasharray:5 8;}
  .connector{stroke-width:1;opacity:.55;stroke-dasharray:4 5;}
  .node{fill:var(--bg);stroke:var(--primary);stroke-width:2;}
  .k-enumeration{position:absolute;inset:0;display:block;pointer-events:none;}
  .k-enumeration .it{position:absolute;width:286px;min-height:104px;padding:14px 16px 14px 18px;background:rgba(11,23,33,.94);border:1px solid var(--line-strong);border-left:4px solid var(--primary);border-top:1px solid var(--line-strong);border-radius:var(--radius-sm);box-shadow:none;opacity:0;transform:translate(var(--dx),var(--dy));animation:deploy .42s ease-out forwards;animation-delay:var(--delay);}
  .item-foot{left:34px;top:102px;--dx:38px;--dy:22px;--delay:.78s;}
  .item-brain{right:32px;top:52px;--dx:-38px;--dy:25px;--delay:.9s;}
  .item-hand{left:24px;top:310px;--dx:45px;--dy:0px;--delay:1.02s;}
  .item-food{right:24px;top:286px;--dx:-45px;--dy:0px;--delay:1.14s;}
  .item-group{right:92px;bottom:34px;--dx:-32px;--dy:-24px;--delay:1.26s;}
  .tag{display:block;margin-bottom:4px;color:var(--primary);font:700 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.08em;}
  .it h2{font-size:var(--fs-h2);line-height:1.25;}
  .it p{margin-top:5px;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec);}
  .thesis{position:absolute;left:50%;bottom:24px;width:410px;padding:14px 18px;transform:translateX(-50%);text-align:center;background:rgba(23,41,54,.96);border:1px solid var(--accent);border-radius:var(--radius-sm);opacity:0;animation:appear .35s ease-out 1.47s forwards;}
  .thesis .tag{color:var(--accent);}
  .thesis strong{display:block;font-size:var(--fs-lead);line-height:var(--lh-copy);}
  .system-note{position:absolute;left:50%;top:18px;transform:translateX(-50%);color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec);opacity:0;animation:appear .35s ease-out 1.47s forwards;}
  @keyframes draw{to{stroke-dashoffset:0;}}
  @keyframes deploy{to{opacity:1;transform:translate(0,0);}}
  @keyframes appear{to{opacity:1;}}
  @media (prefers-reduced-motion:reduce){.body-line,.k-enumeration .it,.thesis,.system-note{animation:none;opacity:1;transform:none}.thesis,.system-note{transform:translateX(-50%)}}
</style>
</head>
<body data-page="12" data-total="48">

    <div class="k-enumeration" aria-label="身体系统的五个同级部分">
      <article class="it item-foot"><span class="tag">01 / FOOT</span><h2>足｜支撑与移动</h2><p>改变姿态，也带来代价</p></article>
      <article class="it item-brain"><span class="tag">02 / BRAIN</span><h2>脑｜高成本控制</h2><p>能力增加，能量需求也增加</p></article>

      <article class="it item-group"><span class="tag">05 / GROUP</span><h2>群体｜分享与协作</h2><p>提高韧性，也产生冲突</p></article>

    <div class="thesis"><span class="tag">SYSTEM / 汇合</span><strong>没有唯一开关：不是五个答案，而是一套关系</strong></div>
  </section>
</main>
</div>
