.p13{height:100%;display:flex;flex-direction:column;gap:12px}.obs{height:338px;display:grid;grid-template-columns:1fr 250px 1fr;gap:14px}.spec{position:relative;overflow:hidden;margin:0;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-deep)}.spec img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.08) brightness(.68);}.chimp img{object-position:28% 48%}.human img{object-position:73% 48%}.spec:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,16,25,.08),rgba(7,16,25,.38)),repeating-linear-gradient(0deg,transparent 0 53px,rgba(66,199,194,.08) 54px 55px);pointer-events:none}.species{position:absolute;z-index:6;top:12px;left:14px;padding:5px 10px;background:rgba(7,16,25,.9);border-left:4px solid var(--primary);font-size:var(--fs-sec);font-weight:700}.guide{position:absolute;z-index:4;top:44px;bottom:32px;width:3px;background:var(--primary);box-shadow:0 0 13px rgba(66,199,194,.7)}.chimp .guide{left:60%;transform:rotate(-8deg)}.human .guide{left:50%}.support{position:absolute;z-index:4;bottom:28px;height:9px;border:2px solid var(--primary);background:var(--primary-soft)}.chimp .support{left:28%;width:54%}.human .support{left:37%;width:28%}.projection{position:absolute;z-index:5;bottom:25px;width:13px;height:13px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}.chimp .projection{left:58%}.human .projection{left:49%}.mark{position:absolute;z-index:6;padding:4px 7px;background:rgba(7,16,25,.92);border:1px solid var(--primary-line);font-size:var(--fs-label);color:var(--primary);opacity:.25;transition:opacity .25s}.pelvis{top:45%;left:8%}.femur{top:65%;right:7%}.active-chimpanzee .chimp .mark,.active-human .human .mark{opacity:1;color:var(--accent);border-color:var(--accent)}.control{display:flex;flex-direction:column;justify-content:center;gap:12px;padding:17px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);text-align:center}.control h2{font-size:var(--fs-h2)}.pose{min-height:50px;color:var(--accent);font-size:var(--fs-lead);font-weight:750;line-height:1.4}.control input{width:100%;height:28px}.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:var(--fs-label)}.status{font-size:var(--fs-sec)}.dots{display:flex;justify-content:center;gap:10px}.dot{width:22px;height:15px;border:2px solid var(--primary);border-radius:50%;opacity:.25}.dot.on{opacity:1;background:var(--accent-soft);border-color:var(--accent)}.trade{display:none;padding:7px;border:1px solid var(--accent);color:var(--accent);font-size:var(--fs-sec)}.trade.show{display:block}.reset{align-self:center}.compare{--compare-cols:150px repeat(2,minmax(0,1fr));flex:1}.compare>*{padding:7px 13px}.compare .hdr{font-size:var(--fs-body);padding-block:8px}.compare .cell{font-size:var(--fs-sec);line-height:1.38}.compare .dim{font-size:var(--fs-label)}.claim{padding:8px 14px;border-left:5px solid var(--accent);background:var(--surface-high);font-size:var(--fs-sec);line-height:1.4;font-weight:700}@media(prefers-reduced-motion:reduce){.mark{transition:none}}</style></head>

<div class="k-comparison compare"><div class="hdr">比较维度</div><div class="hdr">黑猩猩</div><div class="hdr">人类</div><div class="dim">脊柱与躯干</div><div class="cell">躯干较前倾；承重线较难持续落在双足之间</div><div class="cell">脊柱曲线使躯干较易维持在骨盆上方</div><div class="rowline"></div><div class="dim">骨盆形态</div><div class="cell">较长、较窄，适合攀爬与四足活动中的肌肉牵拉</div><div class="cell diff">较短、较宽，重组臀肌作用以稳定单足支撑</div><div class="rowline"></div><div class="dim">股骨与膝</div><div class="cell">股骨较直向下，双足站立时支撑点较分散</div><div class="cell diff">股骨向内倾，使膝与足更接近身体重心线</div><div class="rowline"></div><div class="dim">权衡</div><div class="cell">不以持续双足步行为主要支撑方式</div><div class="cell diff">直立支撑更稳定；产道同时受骨盆结构与大头婴儿分娩需求制约</div></div><p class="claim">双足行走不是“更高级”的姿态，而是一套有收益也有代价的骨骼重组。</p></section></main></div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script><script>Lec.mount({index:13,kicker:"BODY TRADE-OFFS",title:"直立不是免费升级",take:"双足行走改变了身体的支撑方式：它带来直立时的稳定，也使骨盆同时面对行走与分娩的不同要求。"});const poses={chimpanzee:"黑猩猩式支撑",human:"人类双足支撑"};const initialPose="chimpanzee";const lesson=document.getElementById('lesson'),input=document.getElementById('pose'),poseName=document.getElementById('poseName'),status=document.getElementById('status'),trade=document.getElementById('trade'),dots=[...document.querySelectorAll('.dot')];let seen=new Set([initialPose]);function render(){const p=input.value==='1'?'human':'chimpanzee';lesson.classList.toggle('active-human',p==='human');lesson.classList.toggle('active-chimpanzee',p==='chimpanzee');poseName.textContent=poses[p];seen.add(p);status.textContent='已观察 '+seen.size+'/2 种姿态';dots[0].classList.toggle('on',seen.has('chimpanzee'));dots[1].classList.toggle('on',seen.has('human'));trade.classList.toggle('show',seen.size===2)}input.addEventListener('input',render);document.getElementById('reset').addEventListener('click',()=>{seen=new Set([initialPose]);input.value='0';render();input.focus()});render();</script></body></html>
