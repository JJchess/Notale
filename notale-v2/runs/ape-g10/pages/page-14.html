<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .walk-page{height:100%;display:flex;flex-direction:column;gap:14px;padding-top:2px}
  .walk-lead{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:48px}
  .walk-lead p{max-width:1010px;font-size:var(--fs-lead);line-height:var(--lh-copy)}
  .counter{flex:0 0 auto;color:var(--accent);font:700 var(--fs-body)/1.3 var(--font-mono)}
  .lab{position:relative;flex:1 1 0;min-height:0;overflow:hidden;background:linear-gradient(180deg,rgba(23,41,54,.78),rgba(8,22,31,.96));border:1px solid var(--line-strong);border-radius:var(--radius-md);box-shadow:var(--shadow)}
  .lab:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(66,199,194,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(66,199,194,.045) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
  #walker{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  .hud{position:absolute;top:18px;left:20px;width:300px;padding:16px 18px;background:rgba(7,16,25,.9);border-left:3px solid var(--primary);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
  .hud h2{font-size:var(--fs-h2);line-height:1.3;margin:0 0 5px}.hud p{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
  .diagnostic{position:absolute;top:126px;left:20px;display:flex;flex-direction:column;gap:7px;width:260px}.diag{padding:7px 10px;color:var(--muted);background:rgba(7,16,25,.82);border-left:2px solid var(--primary-line);font-size:var(--fs-sec);line-height:1.4}.diag b{color:var(--primary);font-family:var(--font-mono);margin-right:8px}.diag:last-child{border-left-color:var(--accent)}
  .legend{position:absolute;top:18px;right:20px;display:flex;gap:18px;padding:9px 12px;background:rgba(7,16,25,.85);border:1px solid var(--line);border-radius:var(--radius-sm);font-size:var(--fs-label)}
  .key{display:inline-block;width:18px;height:4px;margin-right:7px;vertical-align:middle;background:var(--primary)}.key.ac{background:var(--accent)}.key.dash{height:0;border-top:2px dashed var(--muted);background:none}
  .contact-callout{position:absolute;left:640px;top:260px;width:260px;padding:9px 12px;color:var(--muted);background:rgba(7,16,25,.86);border-top:2px solid var(--primary);font-size:var(--fs-sec);line-height:var(--lh-sec)}.contact-callout b{display:block;color:var(--text);font-size:var(--fs-sec)}
  .joint-label{position:absolute;pointer-events:none;padding:3px 7px;color:var(--text);background:rgba(7,16,25,.85);border:1px solid var(--primary-line);border-radius:5px;font-size:var(--fs-label);line-height:1.4;transform:translate(14px,-28px)}
  .feedback{position:absolute;right:20px;bottom:20px;width:370px;min-height:70px;padding:13px 16px;background:rgba(7,16,25,.92);border:1px solid var(--line-strong);border-radius:var(--radius-sm)}
  .feedback strong{display:block;font-size:var(--fs-body);line-height:1.35}.feedback span{display:block;margin-top:4px;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .feedback.good{border-color:var(--accent);box-shadow:0 0 22px rgba(255,181,71,.14)}
  .reset{position:absolute;right:20px;bottom:105px;display:none;font-size:var(--fs-sec)}
  .reset.show{display:block}
  .model-note{position:absolute;left:20px;bottom:18px;max-width:680px;padding:8px 11px;color:var(--muted);background:rgba(7,16,25,.84);border:1px solid var(--line);border-radius:var(--radius-sm);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .process-wrap{height:132px;flex:0 0 auto}
  .k-process{height:100%;--process-cols:4;gap:42px}
  .k-process .axis{top:22px}.k-process .step{padding:43px 13px 10px}.k-process .step::before{top:14px}.k-process .arw{top:6px}
  .step b{display:block;font-size:var(--fs-sec);line-height:1.35}.step small{display:block;margin-top:3px;color:var(--muted);font-size:var(--fs-label);line-height:1.35}
  .step.is-current small{color:var(--accent)}
  svg text{font-family:var(--font-sans)}
  .joint{cursor:grab;outline:none}.joint:focus{stroke:var(--focus);stroke-width:6}.joint:active{cursor:grabbing}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.pulse{animation:none!important}}
</style>
</head>
<body data-page="14" data-total="48">
<div id="stage"><main id="main">
  <section class="walk-page">
    <div class="walk-lead">
      <p>走路不是把竖直身体向前搬运：每一步都让重心接近失稳，再用落脚与肌肉控制重新接住它。</p>
      <div class="counter" id="counter">第 1 / 4 步</div>
    </div>
    <div class="lab no-pan" id="lab">
      <svg id="walker" viewBox="0 0 1408 420" role="img" aria-label="可调整髋、膝、踝的侧视步态模型">
        <defs><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        <path d="M0 350 H1408" stroke="rgba(190,222,226,.28)" stroke-width="2"/>
        <path d="M70 374 H1328" stroke="rgba(66,199,194,.28)" stroke-width="3" marker-end="url(#none)"/>
        <path d="M1170 374 l26 0 -10 -7 m10 7 -10 7" fill="none" stroke="#42C7C2" stroke-width="3"/>
        <text x="70" y="402" fill="#9CB0B9" font-size="15">前进方向：关节调整 → 重心受控 → 下一步成立</text>
        <g id="ghost" opacity=".28" stroke="#9CB0B9" stroke-width="4" stroke-dasharray="8 7" fill="none"></g>
        <rect id="support" x="500" y="342" width="180" height="12" rx="6" fill="rgba(66,199,194,.42)"/>
        <line id="comLine" x1="660" y1="125" x2="660" y2="350" stroke="#42C7C2" stroke-width="2" stroke-dasharray="7 6"/>
        <circle id="com" cx="660" cy="125" r="9" fill="#FFB547" filter="url(#glow)"/>
        <text id="comText" x="676" y="130" fill="#FFB547" font-size="15">重心投影</text>
        <g id="bones" stroke="#D7E6E9" stroke-width="11" stroke-linecap="round" fill="none">
          <line id="torso"/><line id="thigh"/><line id="shin"/><line id="foot"/>
          <line id="backThigh" opacity=".5"/><line id="backShin" opacity=".5"/><line id="backFoot" opacity=".5"/>
        </g>
        <path id="bodyFill" fill="rgba(66,199,194,.12)" stroke="rgba(66,199,194,.35)" stroke-width="2"/>
        <g fill="#071019" stroke="#42C7C2" stroke-width="4">
          <circle class="joint" id="hip" data-joint="hip" tabindex="0" role="slider" aria-label="髋关节，方向键微调" r="13"/>
          <circle class="joint" id="knee" data-joint="knee" tabindex="0" role="slider" aria-label="膝关节，方向键微调" r="13"/>
          <circle class="joint" id="ankle" data-joint="ankle" tabindex="0" role="slider" aria-label="踝关节，方向键微调" r="13"/>
        </g>
      </svg>
      <div class="hud"><h2 id="stepTitle">1 · 落脚</h2><p id="goal">拖动关节，让重心投影进入双脚之间。</p></div>
      <div class="diagnostic" aria-label="控制链"><div class="diag"><b>01</b>关节调整</div><div class="diag"><b>02</b>重心受控</div><div class="diag"><b>03</b>下一步成立</div></div>
      <div class="legend"><span><i class="key ac"></i>重心</span><span><i class="key"></i>支撑面</span><span><i class="key dash"></i>目标姿态</span></div>
      <div class="joint-label" id="lh">髋</div><div class="joint-label" id="lk">膝</div><div class="joint-label" id="la">踝</div>
      <button class="reset" id="reset">再走一步</button>
      <div class="feedback" id="feedback" aria-live="polite"><strong>先接住向前移动的身体</strong><span>拖动任一发光关节；方向键也可微调。</span></div>
      <p class="model-note">判据：重心投影落入发光支撑面，身体才被接住。教学模型不模拟真实肌肉力量或临床步态。</p>
    </div>
    <div class="process-wrap">
      <div class="k-process" id="process"><div class="axis"></div>
        <div class="step is-current"><b>1 落脚</b><small>足跟触地，双脚之间接住重心</small><i class="arw"></i></div>
        <div class="step"><b>2 承重</b><small>前膝微屈，重心留在单脚足底</small><i class="arw"></i></div>
        <div class="step"><b>3 推进</b><small>支撑腿伸展，重心越过前脚掌</small><i class="arw"></i></div>
        <div class="step"><b>4 换脚</b><small>摆动脚不绊地，并送到身体前方</small></div>
      </div>
    </div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script>
Lec.mount({index: 14, kicker: "BODY IN MOTION", title: "走路，不只是站起来", take: "步态是重心、支撑面和肌肉控制的连续协调，不只是“站起来”。"});
(function(){
  var E=Matter.Engine, R=Matter.Runner, B=Matter.Bodies, C=Matter.Constraint, W=Matter.Composite;
  var engine=E.create({gravity:{x:0,y:1,scale:0.00035},positionIterations:8,velocityIterations:6});
  var runner=R.create(); R.run(runner,engine);
  var ground=B.rectangle(704,365,1500,30,{isStatic:true,label:'ground'});
  var upper=B.rectangle(0,0,12,110,{friction:.8,label:'thigh'}), lower=B.rectangle(0,0,12,105,{friction:.8,label:'shin'}), sole=B.rectangle(0,0,95,12,{friction:1,label:'sole'});
  var hipH=C.create({bodyA:upper,pointA:{x:0,y:-55},pointB:{x:0,y:0},stiffness:.9}), kneeH=C.create({bodyA:upper,pointA:{x:0,y:55},bodyB:lower,pointB:{x:0,y:-52},stiffness:.9}), ankleH=C.create({bodyA:lower,pointA:{x:0,y:52},bodyB:sole,pointB:{x:-34,y:0},stiffness:.9});
  W.add(engine.world,[ground,upper,lower,sole,hipH,kneeH,ankleH]);

  var svg=document.getElementById('walker'), lab=document.getElementById('lab');
  var joints={hip:document.getElementById('hip'),knee:document.getElementById('knee'),ankle:document.getElementById('ankle')};
  var labels={hip:document.getElementById('lh'),knee:document.getElementById('lk'),ankle:document.getElementById('la')};
  var steps=[
    {title:'1 · 落脚',goal:'拖动关节，让重心投影进入双脚之间。',target:{hip:[660,190],knee:[704,266],ankle:[746,344]},support:[520,790],hint:'重心落在支撑面外'},
    {title:'2 · 承重',goal:'前膝微屈，使重心留在单脚足底。',target:{hip:[700,190],knee:[718,270],ankle:[700,344]},support:[660,758],hint:'重心落在支撑面外'},
    {title:'3 · 推进',goal:'髋、膝、踝共同调整，让重心越过脚掌。',target:{hip:[760,185],knee:[730,265],ankle:[700,344]},support:[690,770],hint:'关节尚未共同伸展'},
    {title:'4 · 换脚',goal:'抬高摆动脚，并把下一只脚送到前方。',target:{hip:[790,188],knee:[850,260],ankle:[900,332]},support:[735,825],hint:'摆动脚被地面挡住'}
  ];
  var state={step:0,pts:null,moved:{hip:false,knee:false,ankle:false},drag:null,done:false};
  function fresh(i){var t=steps[i].target;return {hip:[t.hip[0]-54,t.hip[1]+12],knee:[t.knee[0]-42,t.knee[1]+24],ankle:[t.ankle[0]-46,t.ankle[1]+((i===3)?28:5)]};}
  function setLine(id,a,b){var e=document.getElementById(id);e.setAttribute('x1',a[0]);e.setAttribute('y1',a[1]);e.setAttribute('x2',b[0]);e.setAttribute('y2',b[1]);}
  function draw(){
    var p=state.pts,t=steps[state.step], shoulder=[p.hip[0]-8,p.hip[1]-112], footEnd=[p.ankle[0]+82,p.ankle[1]+2];
    setLine('torso',shoulder,p.hip);setLine('thigh',p.hip,p.knee);setLine('shin',p.knee,p.ankle);setLine('foot',p.ankle,footEnd);
    setLine('backThigh',p.hip,[p.hip[0]-68,278]);setLine('backShin',[p.hip[0]-68,278],[p.hip[0]-96,344]);setLine('backFoot',[p.hip[0]-96,344],[p.hip[0]-166,346]);
    document.getElementById('bodyFill').setAttribute('d','M '+(shoulder[0]-35)+' '+(shoulder[1]-16)+' L '+(shoulder[0]+36)+' '+(shoulder[1]-8)+' L '+(p.hip[0]+30)+' '+(p.hip[1]+10)+' L '+(p.hip[0]-30)+' '+(p.hip[1]+10)+' Z');
    Object.keys(joints).forEach(function(k){joints[k].setAttribute('cx',p[k][0]);joints[k].setAttribute('cy',p[k][1]);joints[k].setAttribute('aria-valuetext',Math.round(p[k][0])+','+Math.round(p[k][1]));labels[k].style.left=(p[k][0])+'px';labels[k].style.top=(p[k][1])+'px';});
    var comX=(shoulder[0]*2+p.hip[0]*3+p.knee[0]+p.ankle[0]) / 7, comY=(shoulder[1]+p.hip[1]*2+p.knee[1])/4;
    var cl=document.getElementById('comLine');cl.setAttribute('x1',comX);cl.setAttribute('x2',comX);cl.setAttribute('y1',comY);document.getElementById('com').setAttribute('cx',comX);document.getElementById('com').setAttribute('cy',comY);document.getElementById('comText').setAttribute('x',comX+16);document.getElementById('comText').setAttribute('y',comY+5);
    var s=document.getElementById('support');s.setAttribute('x',t.support[0]);s.setAttribute('width',t.support[1]-t.support[0]);
    var g=document.getElementById('ghost'), q=t.target;g.innerHTML='<path d="M '+(q.hip[0]-8)+' '+(q.hip[1]-112)+' L '+q.hip.join(' ')+' L '+q.knee.join(' ')+' L '+q.ankle.join(' ')+' L '+(q.ankle[0]+82)+' '+(q.ankle[1]+2)+'"/>';
    Matter.Body.setPosition(upper,{x:(p.hip[0]+p.knee[0])/2,y:(p.hip[1]+p.knee[1])/2});Matter.Body.setAngle(upper,Math.atan2(p.knee[1]-p.hip[1],p.knee[0]-p.hip[0])-Math.PI/2);
    Matter.Body.setPosition(lower,{x:(p.knee[0]+p.ankle[0])/2,y:(p.knee[1]+p.ankle[1])/2});Matter.Body.setAngle(lower,Math.atan2(p.ankle[1]-p.knee[1],p.ankle[0]-p.knee[0])-Math.PI/2);Matter.Body.setPosition(sole,{x:p.ankle[0]+40,y:p.ankle[1]+3});
    return {comX:comX};
  }
  function check(){if(state.done)return;var m=draw(),t=steps[state.step],err=0;Object.keys(t.target).forEach(function(k){err+=Math.hypot(state.pts[k][0]-t.target[k][0],state.pts[k][1]-t.target[k][1]);});var all=state.moved.hip&&state.moved.knee&&state.moved.ankle,stable=m.comX>=t.support[0]&&m.comX<=t.support[1],clear=state.step!==3||state.pts.ankle[1]<340;
    var fb=document.getElementById('feedback');if(all&&err<82&&stable&&clear){fb.classList.add('good');fb.innerHTML='<strong>支撑成立：重心被重新接住</strong><span>关节调整改变了重心与支撑面的关系。</span>';document.querySelectorAll('.step')[state.step].classList.remove('is-current');document.querySelectorAll('.step')[state.step].classList.add('is-done');setTimeout(next,Deck.reduced()?0:520);}else{fb.classList.remove('good');var msg=!stable?'重心落在支撑面外':(!clear?'摆动脚被地面挡住':t.hint);fb.innerHTML='<strong>'+msg+'</strong><span>继续拖动三个关节，靠近虚线目标姿态。</span>';}
  }
  function next(){if(state.step===3){state.done=true;document.getElementById('feedback').innerHTML='<strong>完整一步已经成立</strong><span>失稳、接住、推进与换脚连续构成步态。</span>';document.getElementById('reset').classList.add('show');document.getElementById('counter').textContent='完成 4 / 4';return;}state.step++;state.pts=fresh(state.step);state.moved={hip:false,knee:false,ankle:false};sync();}
  function sync(){var t=steps[state.step];document.getElementById('stepTitle').textContent=t.title;document.getElementById('goal').textContent=t.goal;document.getElementById('counter').textContent='第 '+(state.step+1)+' / 4 步';document.querySelectorAll('.step').forEach(function(e,i){e.classList.toggle('is-current',i===state.step);});draw();}
  Object.keys(joints).forEach(function(k){var el=joints[k];el.addEventListener('pointerdown',function(e){state.drag=k;el.setPointerCapture(e.pointerId);});el.addEventListener('pointermove',function(e){if(state.drag!==k)return;var pt=Deck.pt(svg,e);state.pts[k]=[Deck.clamp(pt.x,400,1040),Deck.clamp(pt.y,70,344)];state.moved[k]=true;check();});el.addEventListener('pointerup',function(){state.drag=null;check();});el.addEventListener('keydown',function(e){var dx=0,dy=0;if(e.key==='ArrowLeft')dx=-6;if(e.key==='ArrowRight')dx=6;if(e.key==='ArrowUp')dy=-6;if(e.key==='ArrowDown')dy=6;if(dx||dy){e.preventDefault();state.pts[k][0]+=dx;state.pts[k][1]+=dy;state.moved[k]=true;check();}});});
  document.getElementById('reset').addEventListener('click',function(){state.step=0;state.done=false;state.pts=fresh(0);state.moved={hip:false,knee:false,ankle:false};document.getElementById('reset').classList.remove('show');document.querySelectorAll('.step').forEach(function(e){e.classList.remove('is-done','is-current')});sync();});
  state.pts=fresh(0);sync();
})();
</script>
</body>
</html>
