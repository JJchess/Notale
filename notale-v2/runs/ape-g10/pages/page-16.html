<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .energy-page{height:100%;box-sizing:border-box;padding:8px 0;display:flex;gap:24px;align-items:stretch}
  .body-map{width:690px;flex:0 0 690px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);margin:0;box-sizing:border-box;background:var(--surface-deep);border:1px solid var(--line);border-radius:var(--radius-md)}
  .body-map svg{width:570px;height:550px;overflow:visible}
  .body-map .body-shape{fill:var(--primary-soft);stroke:var(--primary-line);stroke-width:2}
  .body-map .brain{fill:var(--primary);filter:drop-shadow(0 0 9px rgba(66,199,194,.65))}
  .body-map::after{content:"";position:absolute;top:178px;right:-28px;width:82px;height:1px;background:var(--primary);box-shadow:0 0 8px rgba(66,199,194,.45)}
  .body-caption{position:absolute;top:56px;left:28px;font-size:var(--fs-label);font-family:var(--font-mono);letter-spacing:.08em;color:var(--primary)}
  .body-tag{position:absolute;padding:8px 12px;background:var(--surface-high);border:1px solid var(--primary-line);border-radius:var(--radius-sm);font-size:var(--fs-sec);line-height:var(--lh-sec);color:#D7E6E9}
  .tag-brain{top:86px;right:34px}.tag-body{bottom:104px;left:30px}.tag-mass{top:210px;left:24px}.tag-energy{top:280px;right:24px}.tag-unit{top:370px;right:34px}
  .body-heading{position:absolute;top:20px;left:28px;font-size:var(--fs-lead);line-height:var(--lh-copy);font-weight:700;color:var(--text)}
  .body-equation{position:absolute;right:24px;bottom:22px;left:24px;padding:10px;text-align:center;border-top:1px solid var(--primary-line);font:700 var(--fs-lead)/1.5 var(--font-mono);color:var(--primary)}
  .ledger{flex:1;min-width:0;padding:22px 26px;display:flex;flex-direction:column;gap:16px}
  .ledger-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
  .ledger-head p{max-width:690px;font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
  .sum-badge{flex:0 0 auto;padding:8px 12px;border:1px solid var(--primary-line);border-radius:var(--radius-sm);font:700 var(--fs-label)/1.4 var(--font-mono);color:var(--primary)}
  .k-enumeration.budgets{--enum-cols:2;gap:18px;flex:1;min-height:0}
  .budgets .it{padding:18px 20px;display:flex;flex-direction:column;gap:12px;border-top-width:4px}
  .budgets .it.energy{border-top-color:var(--accent)}
  .account-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .account-title h2{font-size:var(--fs-h2)}
  .account-title span{font-size:var(--fs-label);color:var(--muted)}
  .allocation{display:grid;grid-template-columns:90px 1fr 86px;gap:10px;align-items:center;min-height:52px;padding:8px 10px;font-size:var(--fs-sec);background:var(--surface-high);border:1px solid var(--line);border-radius:var(--radius-sm)}
  .allocation strong{font-family:var(--font-mono);text-align:right;color:var(--text)}
  .allocation.brain strong{color:var(--primary)}
  .energy .allocation.brain strong{color:var(--accent)}
  .budgetbar{height:82px;position:relative;display:flex;border:1px solid var(--line-strong);border-radius:var(--radius-sm);overflow:hidden;background-color:var(--surface-deep)}
  .ten{flex:1;position:relative;z-index:2;display:grid;place-items:end center;border-right:1px solid rgba(190,222,226,.28);background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),rgba(190,222,226,.18) calc(10% - 1px),rgba(190,222,226,.18) 10%);font:var(--fs-tick)/1.35 var(--font-mono);color:var(--muted);padding-bottom:6px}
  .ten:last-child{border-right:0}
  .fill{position:absolute;z-index:1;inset:0 auto 0 0;width:var(--fill);background:var(--primary);opacity:.8;transition:width .18s ease,background .18s ease}
  .energy .fill{background:var(--accent);opacity:.82}
  .typical{position:absolute;z-index:3;top:0;bottom:0;left:20%;width:2px;background:var(--text);opacity:.65}
  .typical::after{content:"成人典型值";position:absolute;top:5px;left:7px;white-space:nowrap;color:var(--text);font-size:var(--fs-label);line-height:1.4}
  .mass .typical{display:none}
  .scale{display:flex;justify-content:space-between;color:var(--faint);font-size:var(--fs-tick);font-family:var(--font-mono)}
  .control-stack{display:flex;flex-direction:column;gap:8px;margin-top:auto}
  .control-stack input{width:100%;min-height:34px}
  .prompt{font-size:var(--fs-sec);line-height:var(--lh-sec);color:#C6D6DA}
  .actions{display:flex;align-items:center;gap:10px}
  .actions button{font-size:var(--fs-sec)}
  .actions .submit{background:var(--accent);border-color:var(--accent);color:var(--bg)}
  .feedback{flex:1;min-height:46px;padding:9px 12px;border-left:3px solid var(--primary);background:var(--primary-soft);font-size:var(--fs-sec);line-height:var(--lh-sec);color:#D7E6E9}
  .feedback.bad{border-left-color:var(--accent);background:var(--accent-soft)}
  .final-row{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:44px}
  .conclusion{font-size:var(--fs-lead);line-height:var(--lh-copy);font-weight:700;color:var(--text);opacity:0;transition:opacity .25s ease}
  .conclusion.show{opacity:1}
  .note{max-width:520px;text-align:right}
  .pulse .fill{animation:pulse .48s ease-out}
  .shake{animation:shake .3s ease-in-out}
  @keyframes pulse{50%{filter:brightness(1.45);box-shadow:0 0 22px var(--accent)}}
  @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  @media (prefers-reduced-motion:reduce){.fill,.conclusion{transition:none}.pulse .fill,.shake{animation:none}}
</style>
</head>
<body data-page="16" data-total="48">
<div id="stage">
<main id="main">
  <section class="energy-page" aria-label="成人身体质量与静息能量双预算账本">
    <figure class="body-map" aria-label="人体轮廓，脑部节点连接两笔身体账">
      <svg viewBox="0 0 160 440" role="img" aria-label="人体轮廓与发光脑部">
        <circle class="body-shape" cx="80" cy="47" r="35"/>
        <path class="body-shape" d="M51 86 Q80 72 109 86 L126 220 109 238 101 418 78 418 72 260 64 418 41 418 50 238 34 220Z"/>
        <path class="brain" d="M60 40c0-14 10-24 22-24 13 0 23 10 23 24 0 13-8 22-23 24-14-2-22-11-22-24Z"/>
        <circle class="network-node" cx="104" cy="42" r="6"/>
      </svg>
      <p class="body-heading">同一大脑 · 两种分母</p>
      <span class="body-tag tag-brain">脑部：两笔账的同一项</span>
      <span class="body-tag tag-mass">质量口径</span>
      <span class="body-tag tag-energy">静息能量口径</span>
      <span class="body-tag tag-body">身体其余组织合计</span>
      <span class="body-tag tag-unit">每条账合计 100 单位</span>
      <p class="body-equation"><span id="bodyMassPct"></span> 质量 ≠ <span id="bodyEnergyPct"></span> 静息能量</p>
      <figcaption class="body-caption">ONE BODY / TWO ACCOUNTS</figcaption>
    </figure>

    <section class="ledger panel high" aria-label="身体能源总账">
      <header class="ledger-head">
        <div>
          <h2 class="panel-title">同一具身体，两种分配口径</h2>
          <p>比较“大脑”与“身体其余部分”：每条预算都合计为 100 个单位。</p>
        </div>
        <div class="sum-badge">TOTAL = 100</div>
      </header>

      <div class="k-enumeration budgets">
        <article class="it mass min0">
          <div class="account-title"><h2>质量账</h2><span>约占成人体重</span></div>
          <div class="allocation brain"><span>大脑</span><span>少量质量</span><strong id="massBrain"></strong></div>
          <div class="allocation"><span>其余部分</span><span>其余组织合计</span><strong id="massRest"></strong></div>
          <div class="budgetbar" style="--fill:2%" aria-label="质量预算：大脑 2 个单位，其余部分 98 个单位">
            <div class="fill"></div><i class="ten">10</i><i class="ten">10</i><i class="ten">10</i><i class="ten">10</i><i class="ten">10</i><i class="ten">10</i><i class="ten">10</i><i class="ten">10</i><i class="ten">10</i><i class="ten">10</i>
          </div>
          <div class="scale"><span>0</span><span>50</span><span>100</span></div>
          <p class="prompt">固定参照：大脑质量仅占很小一段。</p>
        </article>

        <article class="it energy min0" id="energyAccount">
          <div class="account-title"><h2>静息能量账</h2><span>由你分配 100 单位</span></div>
          <div class="allocation brain"><span>大脑</span><span id="brainUnits">10 / 100</span><strong id="energyBrain"></strong></div>
          <div class="allocation"><span>其余部分</span><span id="restUnits">90 / 100</span><strong id="energyRest"></strong></div>
          <div class="budgetbar no-pan" id="energyBar" style="--fill:10%">
            <div class="fill"></div><i class="ten">10</i><i class="ten">10</i><i class="ten">10</i><i class="ten">10</i><i class="ten">10</i><i class="ten">10</i><i class="ten">10</i><i class="ten">10</i><i class="ten">10</i><i class="ten">10</i><div class="typical" aria-hidden="true"></div>
          </div>
          <div class="scale"><span>0</span><span>50</span><span>100</span></div>
          <div class="control-stack">
            <label class="prompt" for="energyRange">拖动分界柄：大脑应分到多少静息能量？</label>
            <input id="energyRange" type="range" min="0" max="100" step="1" value="10" aria-label="分配给大脑的静息能量单位">
            <div class="actions">
              <button class="submit" id="submitBtn" type="button">提交分配</button>
              <button id="resetBtn" type="button">重新分配</button>
              <div class="feedback" id="feedback" role="status">总量守恒：移动分界只改变两部分的占比。</div>
            </div>
          </div>
        </article>
      </div>

      <div class="final-row">
        <p class="conclusion" id="conclusion">约 10 倍占比差异：质量小，静息能耗高。</p>
        <p class="note">近似值；成人典型静息状态。活动时各组织的能量分配会改变。</p>
      </div>
    </section>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:16, kicker:"BODY ENERGY", title:"大脑的能量账单", take:"大脑昂贵：成人大脑约占体重的 2%，静息时却消耗约 20% 的能量。"});

const massBrain = 2, massRest = 98, typicalBrain = 20;
const range = document.getElementById('energyRange');
const account = document.getElementById('energyAccount');
const bar = document.getElementById('energyBar');
const feedback = document.getElementById('feedback');
const conclusion = document.getElementById('conclusion');
function pct(part){ return Lec.P.percent(part, 100); }
document.getElementById('massBrain').textContent = pct(massBrain);
document.getElementById('massRest').textContent = pct(massRest);
document.getElementById('bodyMassPct').textContent = pct(massBrain);
document.getElementById('bodyEnergyPct').textContent = pct(typicalBrain);
function render(){
  const brain = Number(range.value), rest = 100 - brain;
  bar.style.setProperty('--fill', brain + '%');
  bar.setAttribute('aria-label', '静息能量预算：大脑 ' + brain + ' 个单位，其余部分 ' + rest + ' 个单位');
  document.getElementById('brainUnits').textContent = brain + ' / 100';
  document.getElementById('restUnits').textContent = rest + ' / 100';
  document.getElementById('energyBrain').textContent = pct(brain);
  document.getElementById('energyRest').textContent = pct(rest);
}
range.addEventListener('input', () => {
  account.classList.remove('pulse');
  conclusion.classList.remove('show');
  feedback.className = 'feedback';
  feedback.textContent = '总量守恒：大脑与其余部分合计仍为 100。';
  render();
});
document.getElementById('submitBtn').addEventListener('click', () => {
  const value = Number(range.value);
  if(value >= 18 && value <= 22){
    range.value = typicalBrain;
    render();
    account.classList.remove('pulse'); void account.offsetWidth; account.classList.add('pulse');
    feedback.className = 'feedback';
    feedback.textContent = '约 20%：大脑质量小，静息能耗却高。';
    conclusion.classList.add('show');
  } else {
    account.classList.remove('shake'); void account.offsetWidth; account.classList.add('shake');
    feedback.className = 'feedback bad';
    feedback.textContent = '这里分的是静息能量，不是体重；再比较左侧仅 2 格的质量条。';
    conclusion.classList.remove('show');
  }
});
document.getElementById('resetBtn').addEventListener('click', () => {
  range.value = 10;
  account.classList.remove('pulse','shake');
  conclusion.classList.remove('show');
  feedback.className = 'feedback';
  feedback.textContent = '总量守恒：移动分界只改变两部分的占比。';
  render(); range.focus();
});
render();
</script>
</body>
</html>
