<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
.grip-page{height:100%;display:flex;flex-direction:column;gap:12px}
.gamebar{height:52px;display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md)}
.gamebar strong{font-size:var(--fs-lead)}
.progress-slots{display:flex;gap:10px;align-items:center}
.progress-slots span{width:88px;height:10px;border:2px solid var(--primary);border-radius:8px;background:transparent}
.progress-slots span.done{background:var(--primary);box-shadow:0 0 12px rgba(66,199,194,.45)}
.gamebar .hint{font-size:var(--fs-sec);color:var(--muted);flex:1}
.workrow{display:flex;gap:20px;min-height:0;flex:1}
.workbench{position:relative;width:960px;height:500px;flex:0 0 960px;overflow:hidden;background:linear-gradient(145deg,rgba(66,199,194,.05),transparent 44%),var(--surface-deep);border:0;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--line-strong),var(--shadow)}
#grip-stage{position:absolute;inset:0;width:960px;height:500px}
.scene-label{position:absolute;pointer-events:none;font-size:var(--fs-label);line-height:1.4;color:var(--muted);padding:3px 7px;background:rgba(7,16,25,.82);border-radius:5px}
.zone-label{color:var(--primary);border:1px solid var(--primary-line)}
#label-pinch{left:354px;top:82px}#label-power{left:468px;top:268px}#label-precision{left:620px;top:128px}
.tool-label{top:453px;color:var(--text)}#lab-stone{left:105px}#lab-handle{left:363px}#lab-knot{left:690px}
.keyboard-help{position:absolute;left:18px;top:16px;max-width:285px;font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
.loop-panel{width:428px;flex:0 0 428px;padding:16px 18px;position:relative;overflow:hidden}
.loop-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}.loop-head h2{font-size:var(--fs-h2)}
.loop-head .task-id{color:var(--accent);font-size:var(--fs-label)}
.loop-panel .k-process{--process-cols:1;display:flex;flex-direction:column;gap:7px;padding:3px 0 3px 0}
.loop-panel .k-process .axis{top:22px;bottom:22px;left:22px;right:auto;width:2px;height:auto;background:linear-gradient(var(--primary),rgba(66,199,194,.25))}
.loop-panel .k-process .step{min-height:57px;padding:8px 10px 8px 54px;border-radius:var(--radius-sm)}
.loop-panel .k-process .step::before{top:17px;left:14px;width:14px;height:14px}
.loop-panel .k-process .step h3{margin:0;font-size:var(--fs-sec);line-height:1.35}.loop-panel .k-process .step p{font-size:var(--fs-label);line-height:1.4;color:var(--muted)}
.loop-panel .k-process .arw{top:auto;right:auto;bottom:-10px;left:14px;font-size:18px}.loop-panel .k-process .arw::before{content:"↓"}
.loop-panel .k-process .step.is-done{opacity:1;filter:none;background:var(--primary-soft)}
.loop-panel .k-process .step.is-current p{color:var(--text)}
.loopback{position:absolute;right:9px;top:92px;bottom:25px;width:18px;border:2px solid var(--primary-line);border-left:0;border-radius:0 12px 12px 0}
.loopback::after{content:"↺";position:absolute;right:-2px;bottom:-3px;color:var(--primary);font:700 22px/1 var(--font-mono);background:var(--surface);padding:2px}
#feedback{position:absolute;left:18px;right:18px;bottom:12px;min-height:48px;padding:10px 12px;font-size:var(--fs-sec);line-height:1.4;background:#09151e;border:1px solid var(--primary-line);border-radius:var(--radius-sm)}
#feedback.bad{border-color:var(--accent);color:var(--accent)}#feedback.good{color:var(--primary)}
.complete-note{font-weight:750;color:var(--text)}
button{font-size:var(--fs-sec)}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body data-page="17" data-total="48">
<div id="stage">
<main id="main">
  <section class="grip-page" aria-label="抓握反馈任务">
    <div class="gamebar">
      <strong id="task-count">抓握任务 1/3</strong>
      <div class="progress-slots" aria-label="任务进度"><span></span><span></span><span></span></div>
      <p class="hint" id="goal">目标：用石片切割。拖到合适接触区，松手检验。</p>
      <button id="reset" type="button">一键重置</button>
    </div>
    <div class="workrow">
      <div class="workbench no-pan min0" id="workbench" tabindex="0" role="application" aria-label="抓握操作台。方向键移动当前工具，回车检验位置">
        <div id="grip-stage"></div>
        <p class="keyboard-help">拖动当前工具；也可聚焦操作台，用方向键移动，按回车检验。</p>
        <span class="scene-label zone-label" id="label-pinch">钝背捏持区</span>
        <span class="scene-label zone-label" id="label-power">掌面包围区</span>
        <span class="scene-label zone-label" id="label-precision">指间控制区</span>
        <span class="scene-label tool-label" id="lab-stone">石片 · 指尖捏持</span>
        <span class="scene-label tool-label" id="lab-handle">木柄 · 整手握持</span>
        <span class="scene-label tool-label" id="lab-knot">绳结 · 指间控制</span>
      </div>
      <aside class="panel loop-panel min0" aria-label="抓握反馈回路">
        <div class="loop-head"><h2>操作—感觉—修正</h2><span class="task-id" id="tool-name">石片</span></div>
        <div class="k-process" id="loop">
          <div class="axis"></div>
          <div class="step is-current"><h3>看见目标</h3><p id="s1">切割</p><span class="arw"></span></div>
          <div class="step"><h3>选择抓握</h3><p id="s2">指尖捏持</p><span class="arw"></span></div>
          <div class="step"><h3>接触工具</h3><p>手指与掌面形成支撑</p><span class="arw"></span></div>
          <div class="step"><h3>感觉反馈</h3><p>辨认滑动、偏转或压力</p><span class="arw"></span></div>
          <div class="step"><h3>调整动作</h3><p>改变接触点、角度或握力</p><span class="arw"></span></div>
          <div class="step"><h3>产生效果</h3><p id="s6">等待稳定切口</p></div>
        </div>
        <div class="loopback" aria-hidden="true"></div>
        <div id="feedback" aria-live="polite">抓握不是选中一个部件，而是让感觉不断修正动作。</div>
      </aside>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/konva.min.js"></script>
<script>
Lec.mount({index:17, kicker:'BODY · HAND · FEEDBACK', title:'手的本领，不只是一根拇指', take:'抓握让工具稳定，感觉引导修正，练习又让下一次动作更准确。'});
const stage = new Konva.Stage({container:'grip-stage', width:960, height:500});
const layer = new Konva.Layer(); stage.add(layer);
const starts=[{x:150,y:410},{x:425,y:410},{x:750,y:410}];
const tasks=[
 {name:'石片',goal:'切割',grip:'指尖捏持',effect:'切口稳定',zone:{x:430,y:130},msg:'石片刃口朝向手掌，请换到钝背捏持'},
 {name:'木柄',goal:'敲击',grip:'整手握持',effect:'木柄可控',zone:{x:520,y:320},msg:'木柄需要掌面与多指共同包围'},
 {name:'绳结',goal:'拉紧',grip:'指间控制',effect:'绳结收紧',zone:{x:700,y:175},msg:'绳结需要指间控制，不是整掌压住'}
];
let state;
function fresh(){return {current:0,complete:false,positions:starts.map(p=>({...p})),trace:[]};}
const bg=new Konva.Rect({x:16,y:55,width:928,height:372,cornerRadius:14,fill:'rgba(16,29,40,.7)',stroke:'rgba(190,222,226,.16)'});layer.add(bg);
const palm=new Konva.Path({x:385,y:95,data:'M113 245 C82 226 55 191 51 154 C48 129 60 114 74 120 C87 126 91 159 98 171 L91 73 C89 48 105 39 118 51 L130 145 L136 42 C138 18 158 18 165 40 L166 143 L181 57 C185 35 204 39 208 59 L197 151 L220 91 C228 72 245 79 246 98 C247 121 232 157 226 181 C219 210 203 246 176 263 C153 278 134 267 113 245 Z',fill:'rgba(66,199,194,.12)',stroke:'#42C7C2',strokeWidth:3,shadowColor:'#42C7C2',shadowBlur:12,shadowOpacity:.25});layer.add(palm);
const zoneShapes=tasks.map((t,i)=>{const c=new Konva.Circle({x:t.zone.x,y:t.zone.y,radius:28,stroke:'#42C7C2',strokeWidth:2,dash:[7,6],opacity:.65});layer.add(c);return c;});
function makeTool(i){let node;if(i===0){node=new Konva.Line({points:[-38,18,0,-25,42,15,5,25],closed:true,fill:'#718791',stroke:'#e8f2f4',strokeWidth:2});}else if(i===1){node=new Konva.Group();node.add(new Konva.Rect({x:-10,y:-52,width:20,height:104,cornerRadius:9,fill:'#9b7654',stroke:'#e8f2f4',strokeWidth:2}));node.add(new Konva.Rect({x:-42,y:-55,width:84,height:19,cornerRadius:5,fill:'#718791',stroke:'#e8f2f4',strokeWidth:2}));}else{node=new Konva.Group();node.add(new Konva.Circle({radius:22,fill:'rgba(255,181,71,.25)',stroke:'#ffb547',strokeWidth:5}));node.add(new Konva.Line({points:[-55,0,-20,0,20,0,55,-18],stroke:'#ffb547',strokeWidth:7,lineCap:'round'}));}
 const g=new Konva.Group({x:starts[i].x,y:starts[i].y,draggable:i===0,name:'tool'+i});g.add(node);g.dragBoundFunc(pos=>({x:Math.max(48,Math.min(912,pos.x)),y:Math.max(82,Math.min(420,pos.y))}));
 g.on('dragstart',()=>setLoop(2));g.on('dragmove',()=>{state.positions[i]={x:g.x(),y:g.y()};setLoop(3);});g.on('dragend',()=>judge(i,g));layer.add(g);return g;}
const tools=tasks.map((_,i)=>makeTool(i));
function setLoop(n){document.querySelectorAll('#loop .step').forEach((el,i)=>{el.classList.toggle('is-done',i<n);el.classList.toggle('is-current',i===n);});}
function pulse(zone){
 zone.stroke('#FFB547');zone.opacity(1);
 zone.to({scaleX:1.35,scaleY:1.35,duration:Deck.reduced()?0:.14,onFinish:function(){
   zone.to({scaleX:1,scaleY:1,duration:Deck.reduced()?0:.16});
 }});
}
function judge(i,g){if(i!==state.current)return;const t=tasks[i],d=Math.hypot(g.x()-t.zone.x,g.y()-t.zone.y);if(d<=28){g.position(t.zone);g.draggable(false);pulse(zoneShapes[i]);state.trace.push({tool:t.name,result:'stable'});state.current++;document.querySelectorAll('.progress-slots span')[i].classList.add('done');setLoop(5);document.getElementById('feedback').className='good';document.getElementById('feedback').textContent=t.effect+'：接触位置稳定，工具效果会进入下一次尝试。';setTimeout(()=>advance(),Deck.reduced()?0:450);}else{state.trace.push({tool:t.name,result:'adjust'});setLoop(3);document.getElementById('feedback').className='bad';document.getElementById('feedback').textContent=t.msg;const sx=starts[i].x,sy=starts[i].y;if(Deck.reduced()){g.position({x:sx,y:sy});layer.draw();}else{g.to({x:g.x()+12,duration:.06,yoyo:true,onFinish(){g.to({x:g.x()-24,duration:.06,yoyo:true,onFinish(){g.to({x:sx,y:sy,duration:.18});}});}});}}}
function advance(){if(state.current>=tasks.length){state.complete=true;setLoop(6);document.getElementById('task-count').textContent='抓握任务 3/3 · 完成';document.getElementById('goal').textContent='三条操作轨迹汇成同一反馈回路。';document.getElementById('tool-name').textContent='闭环形成';document.getElementById('feedback').className='good complete-note';document.getElementById('feedback').textContent='不是一个部件，而是一套会修正的系统。';return;}const t=tasks[state.current];tools[state.current].draggable(true);document.getElementById('task-count').textContent='抓握任务 '+(state.current+1)+'/3';document.getElementById('goal').textContent='目标：用'+t.name+t.goal+'。拖到合适接触区，松手检验。';document.getElementById('tool-name').textContent=t.name;document.getElementById('s1').textContent=t.goal;document.getElementById('s2').textContent=t.grip;document.getElementById('s6').textContent='等待'+t.effect;document.getElementById('feedback').className='';document.getElementById('feedback').textContent='新的目标需要不同接触方式；先选择抓握，再用感觉修正。';setLoop(0);}
function reset(){state=fresh();tools.forEach((g,i)=>{g.position(starts[i]);g.draggable(i===0);});zoneShapes.forEach(z=>{z.stroke('#42C7C2');z.opacity(.65);});document.querySelectorAll('.progress-slots span').forEach(s=>s.classList.remove('done'));advance();layer.draw();document.getElementById('workbench').focus();}
document.getElementById('reset').addEventListener('click',reset);
document.getElementById('workbench').addEventListener('keydown',e=>{if(state.complete)return;const g=tools[state.current],step=e.shiftKey?10:4;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')g.x(Math.max(48,g.x()-step));if(e.key==='ArrowRight')g.x(Math.min(912,g.x()+step));if(e.key==='ArrowUp')g.y(Math.max(82,g.y()-step));if(e.key==='ArrowDown')g.y(Math.min(420,g.y()+step));if(e.key==='Enter'||e.key===' ')judge(state.current,g);state.positions[state.current]={x:g.x(),y:g.y()};layer.batchDraw();});
reset();
</script>
</body>
</html>
