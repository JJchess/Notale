<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page{width:var(--content-w);height:612px;display:flex;flex-direction:column;gap:12px}
  .topline{height:78px;flex:none;--process-cols:5;gap:24px}
  .topline .axis{top:19px}.topline .step{padding:35px 9px 7px;text-align:center;font-size:15px;line-height:1.35;background:rgba(16,29,40,.8)}
  .topline .step::before{top:12px;left:calc(50% - 8px);width:12px;height:12px}.topline .arw{right:-22px;top:7px;width:18px}
  .field{position:relative;flex:1;min-height:0;overflow:visible;border:1px solid var(--line);border-radius:var(--radius-lg);background:radial-gradient(circle at 50% 56%,rgba(255,181,71,.13),transparent 16%),radial-gradient(circle at 50% 45%,rgba(66,199,194,.11),transparent 48%),#0b1721}
  .field::before{content:"";position:absolute;inset:0;opacity:.62;background:linear-gradient(30deg,transparent 44%,rgba(66,199,194,.16) 45% 51%,transparent 52%),linear-gradient(150deg,transparent 44%,rgba(66,199,194,.12) 45% 51%,transparent 52%);background-size:48px 48px}
  .round-head{position:absolute;left:18px;top:14px;z-index:2;display:flex;align-items:center;gap:16px}.round{padding:6px 10px;background:var(--surface-high);font:700 20px var(--font-mono);color:var(--primary)}
  .weather{padding:6px 12px;background:var(--surface-high);font-size:16px;color:var(--muted)}
  .roles{position:absolute;left:18px;right:18px;top:58px;display:flex;gap:14px;z-index:2}
  .role{flex:1;min-width:0;min-height:105px;padding:11px;border:1px dashed var(--primary-line);border-radius:14px;background:repeating-linear-gradient(135deg,var(--surface-high) 0 14px,#1b3140 14px 15px)}
  .role.over{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent-soft)}
  .role-name{padding:5px 8px;background:#0b1721;font-size:16px;font-weight:700;color:var(--primary)}.role-rule{padding:5px 8px;background:#0b1721;font-size:14px;color:var(--muted);line-height:1.4}
  .members{display:flex;gap:8px;margin-top:8px;min-height:47px}
  .person{flex:1;min-width:0;min-height:50px;padding:7px 9px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface-high);font-size:16px;line-height:1.25;text-align:left;cursor:grab}
  .person strong{display:block;color:var(--text)}.person small{display:block;color:var(--muted);font-size:14px}.person.sharing{border-color:var(--accent);background:var(--accent-soft)}.person.out{opacity:.38;text-decoration:line-through}.person.shake{animation:shake .25s linear 2}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .routes{position:absolute;left:18px;right:18px;top:180px;height:175px;display:flex;gap:8px;z-index:1}.route{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;background:repeating-linear-gradient(90deg,var(--surface-high) 0 22px,#214052 22px 24px);font-size:14px;color:var(--muted)}.route::after{content:"↓";position:absolute;right:8px;bottom:4px;font-size:20px;line-height:1;color:var(--primary);text-shadow:0 0 12px rgba(66,199,194,.65)}.route b{display:block;width:96%;padding:5px 8px;background:var(--surface);font-size:16px;color:var(--text);margin-bottom:3px;text-align:center}.route span{width:96%;padding:5px 8px;margin:1px 0;background:#0b1721;border-left:3px solid var(--primary-line);text-align:center}
  .camp{position:absolute;left:18px;right:18px;bottom:14px;height:143px;z-index:2;display:flex;gap:14px;align-items:stretch}
  .team{flex:1;display:flex;gap:8px}.status{flex:1;min-width:0;padding:10px;background:var(--surface-high);border:1px solid var(--line);border-radius:12px}
  .status-name{padding:5px 4px;background:var(--surface);font-size:16px;font-weight:700}.stats{margin-top:2px;padding:4px 4px;background:#0b1721;font:14px/1.45 var(--font-mono);color:var(--muted)}.weak{color:var(--accent)}
  .commons{width:190px;padding:12px;text-align:center;border:1px solid var(--primary-line);border-radius:50%;background:radial-gradient(circle,var(--accent-soft),var(--surface-deep) 70%)}
  .pile{font:700 27px/1.25 var(--font-mono);color:var(--accent)}.commons .label{color:var(--muted)}
  .actions{width:250px;display:flex;flex-direction:column;gap:8px;padding:8px;background:var(--surface-high);border:1px solid var(--line);border-radius:12px}.actions button{font-size:16px}.feedback{padding:5px 7px;background:var(--surface);font-size:16px;line-height:1.4;color:var(--text);min-height:46px}.hint{padding:4px 7px;background:var(--surface);color:var(--muted);font-size:14px;line-height:1.4}
  .result{position:absolute;inset:48px 180px 48px;z-index:5;display:none;place-items:center;text-align:center;padding:28px;background:rgba(11,23,33,.97);border:2px solid var(--primary);border-radius:20px}.result.show{display:grid}.result h2{font-size:28px}.result p{font-size:18px;line-height:1.5}.ledger{font:16px/1.6 var(--font-mono);color:var(--muted)}
  @media(prefers-reduced-motion:reduce){.person.shake{animation:none}}
</style>
</head>
<body data-page="20" data-total="48">
<div id="stage"><main id="main"><div class="page min0">
  <section class="k-process topline" aria-label="每轮流程">
    <div class="axis"></div>
    <div class="step is-current" data-step="0">分工<span class="arw"></span></div>
    <div class="step" data-step="1">搜寻<span class="arw"></span></div>
    <div class="step" data-step="2">汇合<span class="arw"></span></div>
    <div class="step" data-step="3">分享<span class="arw"></span></div>
    <div class="step" data-step="4">下一轮存活</div>
  </section>
  <section class="field no-pan" aria-label="合作觅食场景">
    <div class="round-head"><span class="round" id="round"></span><span class="weather" id="weather">先完成分工</span></div>
    <div class="roles">
      <div class="role" data-role="far"><div class="role-name">远行采集</div><div class="role-rule">高波动 · 高收益</div><div class="members"></div></div>
      <div class="role" data-role="near"><div class="role-name">近地采集</div><div class="role-rule">低波动 · 低收益</div><div class="members"></div></div>
      <div class="role" data-role="care"><div class="role-name">照料</div><div class="role-rule">本轮不采食 · 保护虚弱者</div><div class="members"></div></div>
    </div>
    <div class="routes" id="routes" aria-label="个人资源流向公共堆"></div>
    <div class="camp">
      <div class="team" id="team"></div>
      <div class="commons"><div class="label">中央公共堆</div><div class="pile" id="pile">—</div><div class="label" id="flow">资源在此汇合</div></div>
      <div class="actions"><button id="advance">开始搜寻</button><button id="reset">同种子重置</button><div class="feedback" id="feedback" aria-live="polite">拖动成员到岗位；键盘可聚焦成员后按方向键换岗。</div><div class="hint">分享阶段：点采集者切换“投入 / 保留”。</div></div>
    </div>
    <div class="result" id="result"><div><h2 id="resultTitle"></h2><p id="resultText"></p><div class="ledger" id="ledger"></div></div></div>
  </section>
</div></main></div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
Lec.mount({index:20, kicker:"COOPERATIVE FORAGING", title:"一起找到，未必一起活过", take:"分享、照料与分工能提高群体韧性，但也产生搭便车问题。"});
(function(){
  const defs=[{id:'lan',name:'阿岚',skill:'远行 +1',role:'far'},{id:'shi',name:'石',skill:'近地最低 +1',role:'near'},{id:'he',name:'禾',skill:'照料保护 2 人',role:'care'},{id:'chuan',name:'川',skill:'无能力加成',role:'near'}];
  const roleOrder=['far','near','care']; let rng,state;
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  function fresh(){rng=new Math.seedrandom('apeman-p20');return{round:1,phase:'assign',pile:0,members:defs.map(d=>({...d,food:0,weak:0,out:false,share:true,contrib:0,taken:0})),trace:[]}}
  function fmt(n){return Lec.P.formatNumber(n,{maximumFractionDigits:0})}
  function setStep(n){$$('.step').forEach((e,i)=>{e.classList.toggle('is-current',i===n);e.classList.toggle('is-done',i<n)})}
  function render(){
    $('#round').textContent='第 '+fmt(state.round)+' / '+fmt(3)+' 轮'; $('#pile').textContent=fmt(state.pile)+' 份';
    $$('.members').forEach(e=>e.innerHTML='');
    state.members.forEach(m=>{if(m.out)return;let b=document.createElement('button');b.className='person'+(m.share?' sharing':'');b.draggable=state.phase==='assign';b.dataset.id=m.id;b.innerHTML='<strong>'+m.name+'</strong><small>'+m.skill+'</small>';b.setAttribute('aria-label',m.name+'，'+m.skill+'，当前岗位'+roleName(m.role));b.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',m.id));b.addEventListener('keydown',e=>{if(state.phase!=='assign')return;let i=roleOrder.indexOf(m.role);if(e.key==='ArrowRight'||e.key==='ArrowDown'){m.role=roleOrder[(i+1)%3];render()}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){m.role=roleOrder[(i+2)%3];render()}});b.addEventListener('click',()=>{if(state.phase==='share'&&m.role!=='care'){m.share=!m.share;render();$('#feedback').textContent=m.name+(m.share?'将投入公共堆。':'选择个人保留。')}});$('.role[data-role="'+m.role+'"] .members').appendChild(b)});
    $('#routes').innerHTML=state.members.map(m=>'<div class="route"><b>'+m.name+'的背包</b><span>岗位：'+roleName(m.role)+'</span><span>本轮所得：'+fmt(m.food)+' 份</span><span>去向：'+(m.role==='care'?'照料中':m.share?'投入公共堆':'个人保留')+'</span><span>状态：'+(m.out?'离队':'在队')+'</span></div>').join('');
    $('#team').innerHTML=state.members.map(m=>'<div class="status"><div class="status-name">'+m.name+(m.out?' · 已离队':'')+'</div><div class="stats">背包 '+fmt(m.food)+' 份</div><div class="stats">虚弱 <span class="weak">'+('■'.repeat(m.weak)||'无')+'</span></div><div class="stats">贡献 '+fmt(m.contrib)+' / 取用 '+fmt(m.taken)+'</div></div>').join('');
    $('#advance').textContent=state.phase==='share'?'完成分享与消耗':'开始搜寻'; $('#advance').disabled=state.phase==='done';
  }
  function roleName(r){return r==='far'?'远行采集':r==='near'?'近地采集':'照料'}
  $$('.role').forEach(z=>{z.addEventListener('dragover',e=>{if(state.phase==='assign'){e.preventDefault();z.classList.add('over')}});z.addEventListener('dragleave',()=>z.classList.remove('over'));z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');let m=state.members.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(m&&!m.out){m.role=z.dataset.role;render();$('#feedback').textContent=m.name+'已分配到'+roleName(m.role)+'。'}})});
  function search(){let active=state.members.filter(m=>!m.out), collectors=active.filter(m=>m.role!=='care');if(!collectors.length){$('#feedback').textContent='至少安排 1 名采集者，否则本轮没有食物来源。';$$('.role')[0].classList.add('over');setTimeout(()=>$$('.role')[0].classList.remove('over'),400);return}
    let weathers=['常态','旱热','兽群经过'],wi=Math.floor(rng()*3),weather=weathers[wi];$('#weather').textContent='天气：'+weather+'（教学情景）';setStep(1);
    collectors.forEach(m=>{let gain=m.role==='far'?Math.floor(rng()*6):1+Math.floor(rng()*3);if(weather==='旱热')gain=Math.max(0,gain-1);if(weather==='兽群经过'&&m.role==='far')gain+=2;if(m.id==='lan'&&m.role==='far')gain++;if(m.id==='shi'&&m.role==='near')gain=Math.max(2,gain+1);m.food=gain});
    setStep(2);state.phase='share';$('#feedback').textContent='成员已汇合。点采集者决定投入公共堆或个人保留。';render();setStep(3)
  }
  function consume(){let active=state.members.filter(m=>!m.out);state.pile=0;active.filter(m=>m.role!=='care'&&m.share).forEach(m=>{state.pile+=m.food;m.contrib+=m.food;m.food=0});
    let carers=active.filter(m=>m.role==='care'),protectedN=carers.some(m=>m.id==='he')?2:carers.length;let needy=active.slice().sort((a,b)=>b.weak-a.weak);
    needy.forEach(m=>{let need=Math.max(0,2-m.food),give=Math.min(need,state.pile);m.food+=give;state.pile-=give;m.taken+=give});
    active.forEach(m=>{if(m.food>=2){m.food-=2;m.weak=Math.max(0,m.weak-1)}else{let protectedCare=carers.length&&protectedN>0;if(protectedCare){protectedN--;m.food=0}else{m.food=0;m.weak++;if(m.weak>=2)m.out=true}}});
    state.trace.push(active.map(m=>({id:m.id,contrib:m.contrib,taken:m.taken,weak:m.weak,out:m.out})));setStep(4);
    if(state.round>=3){finish();return}state.round++;state.phase='assign';state.members.forEach(m=>m.share=true);$('#weather').textContent='上一轮消耗完成';$('#feedback').textContent='一次失手未必拖垮全队；重新分工，准备下一轮。';render();setStep(0)
  }
  function finish(){state.phase='done';let alive=state.members.filter(m=>!m.out).length,all=alive===4;$('#result').classList.add('show');$('#resultTitle').textContent=all?'全队存活':'有成员离队';$('#resultText').textContent='分享与分工能吸收个体失手；持续少贡献、多取用，会把风险转给其他成员。';$('#ledger').innerHTML=state.members.map(m=>m.name+'：贡献 '+fmt(m.contrib)+' · 取用 '+fmt(m.taken)).join('<br>');render()}
  $('#advance').addEventListener('click',()=>state.phase==='assign'?search():state.phase==='share'&&consume());
  $('#reset').addEventListener('click',()=>{state=fresh();$('#result').classList.remove('show');$('#weather').textContent='先完成分工';$('#feedback').textContent='拖动成员到岗位；键盘可聚焦成员后按方向键换岗。';setStep(0);render()});
  state=fresh();render();
})();
</script>
</body>
</html>
