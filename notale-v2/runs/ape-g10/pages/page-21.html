<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .body-system{height:100%;padding:18px 0;box-sizing:border-box;grid-template-columns:280px minmax(0,1fr);gap:28px}
  .body-system .claim{padding:24px 22px;display:flex;flex-direction:column;gap:20px;justify-content:center}
  .claim strong{font-size:var(--fs-h2);line-height:1.3;color:var(--primary)}
  .claim p{font-size:var(--fs-body);line-height:var(--lh-copy);font-weight:500}
  .body-system .supports{padding-left:22px;min-height:0;display:block}
  .body-system .trunk{left:0;top:24px;bottom:24px}
  .network-shell{height:100%;position:relative;overflow:hidden;background:var(--surface-deep);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
  .network-shell::before{content:"";position:absolute;inset:45px 190px 118px;border:1px solid rgba(66,199,194,.08);border-radius:48% 52% 46% 54%;box-shadow:inset 0 0 70px rgba(66,199,194,.035)}
  .status{position:absolute;z-index:5;top:15px;right:18px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .status-dots{display:flex;gap:6px}.status-dots i{width:9px;height:9px;border:1px solid var(--primary-line);border-radius:50%}.status-dots i.on{background:var(--primary);box-shadow:0 0 9px rgba(66,199,194,.7)}
  #network{position:absolute;inset:0;width:100%;height:100%}
  .edge{fill:none;stroke:rgba(156,176,185,.38);stroke-width:2;stroke-dasharray:7 7}.edge.done{stroke:var(--primary);stroke-width:3;stroke-dasharray:none}
  .edge-hit{fill:none;stroke:transparent;stroke-width:34}
  .node circle{fill:var(--surface-high);stroke:var(--primary);stroke-width:2}.node .halo{fill:var(--primary-soft);stroke:none}
  .node-title{fill:var(--text);font-family:var(--font-sans);font-size:22px;font-weight:750;text-anchor:middle}
  .node-note{fill:var(--muted);font-family:var(--font-sans);font-size:15px;text-anchor:middle}
  .edge-label{fill:var(--surface-high);stroke:var(--primary-line);stroke-width:1}.edge-text{fill:var(--text);font-family:var(--font-sans);font-size:14px;text-anchor:middle}
  .center-message{position:absolute;z-index:4;left:50%;top:43%;width:250px;transform:translate(-50%,-50%) scale(.98);opacity:0;text-align:center;color:var(--text);font-size:var(--fs-lead);font-weight:750;line-height:var(--lh-copy);pointer-events:none}.center-message.show{opacity:1;transform:translate(-50%,-50%) scale(1);transition:opacity 260ms ease-out,transform 260ms ease-out}
  .tray{position:absolute;z-index:6;left:16px;right:16px;bottom:14px;min-height:96px;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 14px;background:rgba(16,29,40,.94);border:1px solid var(--line);border-radius:48px}
  .chip{position:relative;max-width:174px;min-height:54px;padding:7px 11px;font-size:var(--fs-label);line-height:1.35;touch-action:none;cursor:grab;transition:transform 180ms ease-out,border-color 180ms ease-out,opacity 180ms ease-out}.chip:active{cursor:grabbing}.chip.placed{opacity:.32;pointer-events:none}.chip.wrong{animation:shake 180ms ease-out}.chip .key-hint{display:block;color:var(--faint);font-size:14px;font-weight:500}
  .feedback{position:absolute;z-index:8;left:24px;top:18px;max-width:475px;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .feedback.bad{color:var(--accent)}
  #reset{position:absolute;z-index:9;right:24px;bottom:118px;display:none;font-size:var(--fs-sec)}
  #reset.show{display:block}
  .pulse{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-dasharray:18 800;filter:drop-shadow(0 0 5px rgba(255,181,71,.9));pointer-events:none}
  @keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-7px)}70%{transform:translateX(7px)}}
  @media (prefers-reduced-motion:reduce){.chip{transition:none}.chip.wrong{animation:none}.center-message.show{transition:none}.pulse{display:none}}
</style>
</head>
<body data-page="21" data-total="48">
<div id="stage">
<main id="main">
  <section class="k-generalization body-system full" aria-labelledby="system-claim">
    <div class="claim min0" id="system-claim">
      <strong>系统主张</strong>
      <p>没有一个器官单独把猿“变成人”。</p>
      <p>“人成形”更像多条关系互相加强、也互相施加代价的反馈系统。</p>
      <span class="note">把标签拖到对应箭头；也可聚焦标签后用方向键选箭头，按 Enter 放置。</span>
    </div>
    <div class="supports min0"><span class="trunk" aria-hidden="true"></span>
      <div class="support network-shell no-pan">
        <p class="feedback" id="feedback" aria-live="polite">连接五条有方向的关系。箭头表示“谁改变了谁的条件”。</p>
        <div class="status"><span id="count">身体回路 0 / 5 已连接</span><span class="status-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></div>
        <svg id="network" role="img" aria-label="足、食物、脑、手与群体构成的待连接反馈网络"></svg>
        <div class="center-message" id="centerMessage">不是唯一开关，<br>而是反馈系统</div>
        <button id="reset" type="button">重新连接</button>
        <div class="tray" id="tray" aria-label="待放置的箭头标签"></div>
      </div>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
Lec.mount({index:21, kicker:"BODY FEEDBACK", title:"身体不是零件清单", take:"所谓“人成形”是足、手、脑、食物与群体关系共同构成的反馈系统。"});

const nodes=[
 {id:'足',note:'支撑与移动',x:205,y:336},{id:'食物',note:'获取与加工',x:310,y:125},
 {id:'脑',note:'高耗能控制',x:570,y:92},{id:'手',note:'抓握与反馈',x:790,y:240},
 {id:'群体',note:'分享、照料、分工',x:612,y:405}
];
const links=[
 {source:'足',target:'食物',label:'移动方式改变可到达的食物'},
 {source:'食物',target:'脑',label:'可获得能量支持昂贵组织'},
 {source:'脑',target:'手',label:'感觉、计划与动作协同'},
 {source:'手',target:'群体',label:'工具与操作可被共同完成'},
 {source:'群体',target:'足',label:'分享与照料改变移动风险'}
];
const width=1000,height=500;
const simulation=d3.forceSimulation(nodes).force("link",d3.forceLink(links).id(d=>d.id).distance(118).strength(0.45)).force("charge",d3.forceManyBody().strength(-360)).force("center",d3.forceCenter(width/2,height/2)).stop();
nodes.forEach(n=>{n.fx=n.x;n.fy=n.y}); simulation.tick(1);
const svg=d3.select('#network').attr('viewBox',`0 0 ${width} ${height}`);
const defs=svg.append('defs');
defs.append('marker').attr('id','arrow-muted').attr('viewBox','0 -5 10 10').attr('refX',9).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto').append('path').attr('d','M0,-5L10,0L0,5').attr('fill','rgba(156,176,185,.65)');
defs.append('marker').attr('id','arrow-live').attr('viewBox','0 -5 10 10').attr('refX',9).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto').append('path').attr('d','M0,-5L10,0L0,5').attr('fill','var(--accent)');
const nodeById=new Map(nodes.map(n=>[n.id,n]));
function pathFor(d){const s=nodeById.get(typeof d.source==='object'?d.source.id:d.source),t=nodeById.get(typeof d.target==='object'?d.target.id:d.target);const dx=t.x-s.x,dy=t.y-s.y,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;return `M${s.x+ux*53},${s.y+uy*53} L${t.x-ux*57},${t.y-uy*57}`}
const edgeG=svg.append('g');
const edges=edgeG.selectAll('path.edge').data(links).join('path').attr('class','edge').attr('d',pathFor).attr('marker-end','url(#arrow-muted)');
edgeG.selectAll('path.edge-hit').data(links).join('path').attr('class','edge-hit').attr('d',pathFor);
const labels=edgeG.selectAll('g.edge-tag').data(links).join('g').attr('class','edge-tag').attr('opacity',0).attr('transform',d=>{const s=nodeById.get(d.source.id||d.source),t=nodeById.get(d.target.id||d.target);return `translate(${(s.x+t.x)/2},${(s.y+t.y)/2})`});
labels.append('rect').attr('class','edge-label').attr('x',-103).attr('y',-17).attr('width',206).attr('height',34).attr('rx',8);
labels.append('text').attr('class','edge-text').attr('dy','0.35em').text(d=>d.label);
const ng=svg.append('g').selectAll('g.node').data(nodes).join('g').attr('class','node').attr('transform',d=>`translate(${d.x},${d.y})`);
ng.append('circle').attr('class','halo').attr('r',48);ng.append('circle').attr('r',38);
ng.append('text').attr('class','node-title').attr('y',-1).text(d=>d.id);
ng.append('text').attr('class','node-note').attr('y',23).text(d=>d.note);
const tray=d3.select('#tray');
const chips=tray.selectAll('button').data(links).join('button').attr('type','button').attr('class','chip').attr('aria-label',d=>`${d.label}；用左右方向键选择箭头，按 Enter 放置`).html(d=>`${d.label}<span class="key-hint">方向键选择 · Enter 放置</span>`);
let done=new Set(), keyboardTarget=0;
const feedback=document.getElementById('feedback'),count=document.getElementById('count');
function update(){count.textContent=`身体回路 ${done.size} / 5 已连接`;document.querySelectorAll('.status-dots i').forEach((el,i)=>el.classList.toggle('on',i<done.size));}
function attempt(d,targetIndex,button){const right=links.indexOf(d)===targetIndex;if(!right){feedback.textContent='方向不对：想想谁改变了谁的条件。';feedback.className='feedback bad';button.classList.remove('wrong');void button.offsetWidth;button.classList.add('wrong');return} if(done.has(d.label))return;done.add(d.label);feedback.textContent=`已接通：${d.source.id||d.source} → ${d.target.id||d.target}。`;feedback.className='feedback';d3.select(edges.nodes()[targetIndex]).classed('done',true).attr('marker-end','url(#arrow-live)');d3.select(labels.nodes()[targetIndex]).attr('opacity',1);button.classList.add('placed');update();pulse(targetIndex);if(done.size===5)finish();}
function pulse(i){if(Deck.reduced())return;const p=edgeG.append('path').attr('class','pulse').attr('d',pathFor(links[i]));p.transition().duration(620).ease(d3.easeCubicOut).attr('stroke-dashoffset',-300).on('end',()=>p.remove())}
chips.on('keydown',function(event,d){if(event.key==='ArrowRight'||event.key==='ArrowDown'){event.preventDefault();keyboardTarget=(keyboardTarget+1)%5;feedback.textContent=`当前目标：${links[keyboardTarget].source.id||links[keyboardTarget].source} → ${links[keyboardTarget].target.id||links[keyboardTarget].target}`;feedback.className='feedback'}else if(event.key==='ArrowLeft'||event.key==='ArrowUp'){event.preventDefault();keyboardTarget=(keyboardTarget+4)%5;feedback.textContent=`当前目标：${links[keyboardTarget].source.id||links[keyboardTarget].source} → ${links[keyboardTarget].target.id||links[keyboardTarget].target}`;feedback.className='feedback'}else if(event.key==='Enter'||event.key===' '){event.preventDefault();attempt(d,keyboardTarget,this)}});
chips.call(d3.drag().on('start',function(){d3.select(this).style('z-index',20)}).on('drag',function(event){d3.select(this).style('transform',`translate(${event.x-this.offsetLeft-this.offsetWidth/2}px,${event.y-this.offsetTop-this.offsetHeight/2}px)`)}).on('end',function(event,d){const shell=document.querySelector('.network-shell'),r=shell.getBoundingClientRect(),sx=width/r.width,sy=height/r.height,px=(event.sourceEvent.clientX-r.left)*sx,py=(event.sourceEvent.clientY-r.top)*sy;let best=0,dist=Infinity;links.forEach((l,i)=>{const s=nodeById.get(l.source.id||l.source),t=nodeById.get(l.target.id||l.target),dd=Math.hypot(px-(s.x+t.x)/2,py-(s.y+t.y)/2);if(dd<dist){dist=dd;best=i}});d3.select(this).style('transform',null).style('z-index',null);attempt(d,best,this)}));
function finish(){feedback.textContent='五条关系形成可循环追踪的反馈网。';document.getElementById('centerMessage').classList.add('show');document.getElementById('reset').classList.add('show');if(!Deck.reduced())links.forEach((_,i)=>setTimeout(()=>pulse(i),i*180));}
document.getElementById('reset').addEventListener('click',()=>{done.clear();keyboardTarget=0;edges.classed('done',false).attr('marker-end','url(#arrow-muted)');labels.attr('opacity',0);chips.classed('placed',false).style('transform',null);feedback.textContent='连接五条有方向的关系。箭头表示“谁改变了谁的条件”。';feedback.className='feedback';document.getElementById('centerMessage').classList.remove('show');document.getElementById('reset').classList.remove('show');update();});
</script>
</body>
</html>
