<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .turn-page{position:relative;height:100%;display:flex;
    }
    .overview-field{position:absolute;inset:0 -12%;width:124%;height:100%;opacity:.08;pointer-events:none}
    .turn-page{flex-direction:column;gap:var(--sp-3);padding-top:var(--sp-3)}
    .shared-read{height:36px;display:flex;align-items:center;padding:0 76px 0 250px;color:var(--muted);font-size:var(--fs-label);font-family:var(--font-mono)}
    .read-line{flex:1;height:1px;margin:0 var(--sp-4);background:linear-gradient(90deg,var(--line-strong),var(--primary-line));position:relative}
    .read-line::after{content:"";position:absolute;right:-1px;top:-5px;border-left:9px solid var(--primary);border-top:5px solid transparent;border-bottom:5px solid transparent}
    .tracks{--enum-cols:1;flex:1;gap:var(--sp-3)}
    .tracks .it{padding:0;border-top-width:1px;display:flex;min-height:0;overflow:hidden;position:relative;background:linear-gradient(90deg,var(--surface),var(--surface-deep))}
    .track-back{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.12}
    .track-label{position:relative;z-index:1;width:230px;padding:var(--sp-5);display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line);flex:none}
    .track-label h2{font-size:var(--fs-h2);line-height:1.3;margin:0 0 var(--sp-2)}
    .track-label p{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
    .track-field{position:relative;flex:1;min-width:0;margin:18px 76px 18px 20px;background:linear-gradient(90deg,rgba(66,199,194,.30),rgba(66,199,194,.12));border:1px solid var(--line);border-radius:var(--radius-sm)}
    .culture .track-field{background:linear-gradient(90deg,rgba(255,181,71,.08) 0 40%,rgba(255,181,71,.20) 70%,rgba(255,181,71,.38) 100%)}
    .phase{position:absolute;bottom:12px;color:var(--text);font-size:var(--fs-sec);line-height:1.4;white-space:nowrap}
    .track-wash{position:absolute;inset:0;width:100%;height:100%;opacity:.72}
    .zone{position:absolute;top:0;bottom:0;border-right:1px solid var(--line);background:rgba(66,199,194,.08)}
    .culture .zone{background:rgba(255,181,71,.07)}
    .rail{position:absolute;left:0;right:0;top:50%;height:3px;transform:translateY(-50%) scaleX(0);transform-origin:left;background:var(--primary);box-shadow:0 0 14px rgba(66,199,194,.32)}
    .culture .rail{background:var(--accent);box-shadow:0 0 16px rgba(255,181,71,.34)}
    .mark{position:absolute;top:50%;opacity:0;transform:translate(-50%,-50%) scale(.6)}
    .foot{width:17px;height:30px;border:2px solid var(--primary);border-radius:55% 45% 58% 42%;background:var(--surface-deep);box-shadow:0 0 12px rgba(66,199,194,.28)}
    .foot:nth-of-type(even){transform:translate(-50%,-50%) rotate(180deg) scale(.6)}
    .node{width:13px;height:13px;border-radius:50%;background:var(--accent);border:2px solid #FFE0A6;box-shadow:0 0 14px rgba(255,181,71,.78)}
    .end-line{position:absolute;right:42px;top:18px;bottom:18px;width:2px;background:var(--accent);box-shadow:0 0 16px rgba(255,181,71,.45)}
    .end-line span{position:absolute;right:12px;white-space:nowrap;font-size:var(--fs-label);font-family:var(--font-mono)}
    .end-line .now{top:-3px;color:var(--text)}
    .end-line .state{bottom:-3px;color:var(--accent)}
    .pivot{height:42px;display:flex;align-items:center;justify-content:center;gap:var(--sp-4);color:var(--accent);font-size:var(--fs-lead);font-weight:750;opacity:0;transform:translateY(8px)}
    .pivot::before,.pivot::after{content:"";width:150px;height:1px;background:linear-gradient(90deg,transparent,var(--accent))}
    .pivot::after{transform:scaleX(-1)}
    .closing{height:48px;display:flex;justify-content:center;align-items:center;color:#D7E6E9;font-size:var(--fs-sec);line-height:var(--lh-sec)}
    @media (prefers-reduced-motion:reduce){.rail{transform:translateY(-50%) scaleX(1)}.mark,.pivot{opacity:1}.mark{transform:translate(-50%,-50%) scale(1)}.foot:nth-of-type(even){transform:translate(-50%,-50%) rotate(180deg) scale(1)}.pivot{transform:none}}
  </style>
</head>
<body data-page="22" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="turn-page" aria-label="身体内与身体外的两类变化">
        <svg class="overview-field" viewBox="0 0 1408 620" preserveAspectRatio="none" aria-hidden="true"><path d="M0 190 H1408 M0 430 H1408" stroke="#42C7C2" stroke-width="120"/><path d="M700 430 H1408" stroke="#FFB547" stroke-width="120"/></svg>
        <div class="shared-read"><span>许多代</span><span class="read-line"></span><span>共同读向</span><span class="read-line"></span><span>此刻</span></div>
        <div class="k-enumeration tracks">
          <article class="it genetic">
            <svg class="track-back" viewBox="0 0 1408 211" preserveAspectRatio="none" aria-hidden="true"><rect width="1408" height="211" fill="#42C7C2"/></svg>
            <div class="track-label"><h2 class="primary">身体内</h2><p>遗传变化</p></div>
            <div class="track-field" aria-label="稀疏刻度贯穿许多世代">
              <svg class="track-wash" viewBox="0 0 900 170" preserveAspectRatio="none" aria-hidden="true"><rect width="900" height="170" fill="#12343d"/><path d="M0 85 C180 55 320 115 470 85 S720 55 900 85 L900 125 C710 100 600 135 440 112 S170 135 0 110 Z" fill="rgba(66,199,194,.16)"/><path d="M0 30 L900 30 M0 140 L900 140" stroke="rgba(66,199,194,.22)"/></svg>
              <i class="zone" style="left:0;width:33%"></i><i class="zone" style="left:33%;width:33%"></i><i class="zone" style="left:66%;width:34%"></i>
              <div class="rail"></div>
              <span class="phase" style="left:4%">差异出现 · 身体内</span><span class="phase" style="left:38%;top:12px;bottom:auto">跨代累积 · 稀疏连续</span><span class="phase" style="left:70%">延伸至今 · 未停止</span>
              <i class="mark foot" style="left:7%"></i><i class="mark foot" style="left:25%"></i><i class="mark foot" style="left:43%"></i><i class="mark foot" style="left:61%"></i><i class="mark foot" style="left:79%"></i><i class="mark foot" style="left:96%"></i>
            </div>
            <div class="end-line"><span class="now">此刻的人类</span><span class="state">仍在继续</span></div>
          </article>
          <div class="pivot">接下来：身体之外</div>
          <article class="it culture">
            <svg class="track-back" viewBox="0 0 1408 211" preserveAspectRatio="none" aria-hidden="true"><rect width="1408" height="211" fill="#FFB547"/></svg>
            <div class="track-label"><h2 class="accent">身体外</h2><p>文化变化</p></div>
            <div class="track-field" aria-label="接近此刻时刻度快速变密">
              <svg class="track-wash" viewBox="0 0 900 170" preserveAspectRatio="none" aria-hidden="true"><rect width="900" height="170" fill="#3a3021"/><path d="M0 110 C400 108 560 104 680 86 S815 42 900 25 L900 145 C820 132 760 120 680 112 S380 118 0 120 Z" fill="rgba(255,181,71,.18)"/><path d="M0 30 L900 30 M0 140 L900 140" stroke="rgba(255,181,71,.22)"/></svg>
              <i class="zone" style="left:0;width:45%"></i><i class="zone" style="left:45%;width:30%"></i><i class="zone" style="left:75%;width:25%"></i>
              <div class="rail"></div>
              <span class="phase" style="left:4%">身体之外 · 新轨道</span><span class="phase" style="left:38%;top:12px;bottom:auto">靠近此刻 · 节点聚集</span><span class="phase" style="left:67%">骤然变密 · 速度跃迁</span>
              <i class="mark node" style="left:54%"></i><i class="mark node" style="left:68%"></i><i class="mark node" style="left:78%"></i><i class="mark node" style="left:85%"></i><i class="mark node" style="left:90%"></i><i class="mark node" style="left:94%"></i><i class="mark node" style="left:97%"></i><i class="mark node" style="left:99%"></i>
            </div>
            <div class="end-line"><span class="now">此刻的人类</span><span class="state">速度跃迁</span></div>
          </article>
        </div>
        <p class="closing">身体演化没有停止。身体没有消失，变化新增了一条轨道。</p>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index: 22, kicker: 'CHAPTER III · CULTURE', title: '变化，开始跑到身体之外', take: '身体演化仍在继续，但接下来的速度跃迁主要发生在身体之外。'});
    const motion={duration:900,easing:'cubic-bezier(.22,.61,.36,1)',fill:'both'};
    if(!Deck.reduced()){
      const title=document.querySelector('.lec-title');
      title.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],motion);
      const rails=document.querySelectorAll('.rail');
      rails.forEach((el,i)=>el.animate([{transform:'translateY(-50%) scaleX(0)'},{transform:'translateY(-50%) scaleX(1)'}],{...motion,delay:[180,620][i]}));
      document.querySelectorAll('.genetic .mark').forEach((el,i)=>el.animate([{opacity:0,transform:`translate(-50%,-50%) scale(.6)`},{opacity:1,transform:`translate(-50%,-50%) scale(1)`}],{...motion,duration:420,delay:540+i*110}));
      document.querySelectorAll('.culture .mark').forEach((el,i)=>el.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.6)'},{opacity:1,transform:'translate(-50%,-50%) scale(1)'}],{...motion,duration:380,delay:960+i*110}));
      document.querySelector('.pivot').animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}],{...motion,duration:500,delay:2050});
    }
  </script>
</body>
</html>
