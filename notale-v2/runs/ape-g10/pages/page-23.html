<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .clock-page{height:100%;display:flex;flex-direction:column;gap:12px;padding:8px 0;box-sizing:border-box}
  .clock-tools{height:48px;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .prompt{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
  .progress-read{font-size:var(--fs-sec);color:var(--text);white-space:nowrap}
  .gen-buttons{display:flex;align-items:center;gap:8px}
  .gen-buttons button{min-width:48px;padding:6px 10px}
  .clock-field{position:relative;height:330px;overflow:hidden;background:linear-gradient(180deg,rgba(66,199,194,.06),transparent 46%),var(--surface-deep);border:1px solid var(--line);border-radius:var(--radius-lg)}
  #timeline{display:block;width:100%;height:100%}
  #timeline text{font-family:var(--font-sans);fill:var(--text)}
  #timeline .svg-label{font-size:16px;font-weight:700}
  #timeline .svg-tick{font:13px var(--font-mono);fill:var(--muted)}
  #timeline .svg-read{font:700 22px var(--font-mono);fill:var(--accent)}
  .gate-wrap{position:absolute;left:190px;right:52px;bottom:24px;height:56px;display:flex;align-items:center}
  .gate-wrap input{width:100%;height:32px;cursor:ew-resize}
  .gate-caption{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:var(--fs-label);color:var(--muted);pointer-events:none}
  .scale-dots{position:absolute;left:190px;right:52px;top:16px;display:flex;justify-content:space-between;pointer-events:none}
  .scale-dot{width:14px;height:14px;border:2px solid var(--primary);border-radius:50%;background:var(--surface-deep);box-sizing:border-box}
  .scale-dot.seen{background:var(--primary)}
  .scale-dot.current{border-color:var(--accent);background:var(--accent);box-shadow:0 0 14px rgba(255,181,71,.7)}
  .comparison-wrap{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:12px;height:210px}
  .scale-table{--compare-cols:130px repeat(2,minmax(0,1fr));height:100%}
  .scale-table>*{padding:7px 12px}
  .scale-table .hdr{font-size:var(--fs-sec)}
  .scale-table .dim{font-size:var(--fs-label);text-align:left}
  .scale-table .cell{font-size:var(--fs-sec);line-height:1.35}
  .scale-table .inactive{opacity:.42}
  .insight{height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:18px 22px;border-left:6px solid var(--accent)}
  .insight strong{font-size:var(--fs-lead);line-height:1.45}
  .completion{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--primary);min-height:24px}
  .reset{align-self:flex-start}
  .shake{animation:shake .28s ease-in-out}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body data-page="23" data-total="48">
<div id="stage">
<main id="main">
  <section class="clock-page" aria-label="生物演化与文化变化的双时间轴">
    <div class="clock-tools">
      <p id="prompt" class="prompt">拖动中央压缩柄，比较同一时间窗口。</p>
      <div class="ctl gen-buttons" aria-label="人类一代年数">
        <span class="ctl-label">人类一代默认 25 年</span>
        <button type="button" data-years="20">20</button><button type="button" data-years="25" aria-pressed="true">25</button><button type="button" data-years="30">30</button>
      </div>
      <div class="progress-read">四个尺度已比较 <strong id="seenCount" class="accent">1 / 4</strong></div>
    </div>

    <div class="clock-field no-pan" id="clockField">
      <div class="scale-dots" aria-hidden="true"><i class="scale-dot current seen"></i><i class="scale-dot"></i><i class="scale-dot"></i><i class="scale-dot"></i></div>
      <svg id="timeline" viewBox="0 0 1408 330" role="img" aria-label="共享同一观察窗口的生物世代轨与文化传播轨"></svg>
      <div class="gate-wrap">
        <input id="compress" type="range" min="0" max="3" step="1" value="0" aria-label="压缩观察时间窗口，从四百万年到一年">
      </div>
      <div class="gate-caption">压缩柄：方向键也可逐级比较</div>
    </div>

    <div class="comparison-wrap min0">
      <div id="compare" class="k-comparison scale-table min0" aria-label="四个时间尺度的逐行比较"></div>
      <aside class="panel insight min0">
        <strong>文化变化不必等待遗传差异跨世代积累。</strong>
        <p class="sec">一种做法可能在一次学习中改变，并在一代人内扩散。</p>
        <p id="completion" class="completion">遗传：等待世代｜文化：可在学习中传播</p>
        <button id="reset" class="reset" type="button">重置双轴</button>
      </aside>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/lib/ScrollTrigger.min.js"></script>
<script>
Lec.mount({index:23, kicker:"TWO CLOCKS", title:"文化可以跑得比基因快", take:"生物演化按世代积累；文化变化可能在一次学习或一代人内扩散。"});

gsap.registerPlugin(ScrollTrigger);
const generationYearsDefault=25;
let generationYears=generationYearsDefault;
const windows=[4000000,300,25,1];
const windowLabels=["约 400 万年","300 年","25 年","1 年"];
const culture=["技巧可经历大量传播与改造","多代人可继承并修改做法","一代人内可多次学习、传播","一次学习即可改变个人做法"];
const visited=new Set([0]);
let active=0;
const slider=document.getElementById('compress');
const scaleLength=1160;
const scale=d3.scaleLog().domain([1,4000000]).range([0,scaleLength]).clamp(true);
const svg=d3.select('#timeline');

function biologicalText(years){
  const n=Lec.P.generations(years,generationYears);
  if(n<1) return "不足 1 个生物世代";
  return Lec.P.formatNumber(n,{maximumFractionDigits:n<20?1:0})+" 个生物世代";
}
function buildTable(){
  const parts=['<div class="hdr">观察窗口</div><div class="hdr">生物轨：遗传变化</div><div class="hdr">文化轨：学习与扩散</div>'];
  windows.forEach((w,i)=>{
    const c=i===active?' diff':' inactive';
    parts.push(`<div class="dim${c}">${windowLabels[i]}</div><div class="cell${c}">${biologicalText(w)}</div><div class="cell${c}">${culture[i]}</div>`);
    if(i<3) parts.push('<div class="rowline"></div>');
  });
  document.getElementById('compare').innerHTML=parts.join('');
}
function draw(){
  svg.selectAll('*').remove();
  const x0=190,x1=1356, current=windows[active];
  const compressed=Lec.P.compressTimeline(current,windows[0],scaleLength);
  const pos=Math.max(0,Math.min(scaleLength,Number(compressed)||scale(current)));
  const tracks=[{y:118,name:'生物轨',sub:'遗传差异按世代累积'},{y:220,name:'文化轨',sub:'学习与传播不设固定速率'}];
  tracks.forEach((t,ti)=>{
    svg.append('text').attr('x',28).attr('y',t.y-10).attr('class','svg-label').text(t.name);
    svg.append('text').attr('x',28).attr('y',t.y+16).attr('class','svg-tick').text(t.sub);
    svg.append('line').attr('x1',x0).attr('x2',x1).attr('y1',t.y).attr('y2',t.y).attr('stroke','rgba(66,199,194,.55)').attr('stroke-width',3);
    const count=ti===0?16:42;
    d3.range(count).forEach(i=>{
      const x=x0+(i/(count-1))*(x1-x0);
      svg.append(ti===0?'ellipse':'circle').attr('cx',x).attr('cy',t.y).attr(ti===0?'rx':'r',ti===0?5:3).attr(ti===0?'ry':null,ti===0?9:null).attr('fill',ti===0?'rgba(66,199,194,.46)':'rgba(255,181,71,.55)');
    });
  });
  const gx=x0+(active/3)*(x1-x0);
  svg.append('line').attr('x1',gx).attr('x2',gx).attr('y1',70).attr('y2',264).attr('stroke','#FFB547').attr('stroke-width',5);
  svg.append('path').attr('d',`M${gx-12},72 L${gx+12},72 L${gx},88 Z`).attr('fill','#FFB547');
  svg.append('text').attr('x',x1).attr('y',56).attr('text-anchor','end').attr('class','svg-read').text(windowLabels[active]);
  svg.append('text').attr('x',x1).attr('y',94).attr('text-anchor','end').attr('class','svg-tick').text('共享观察窗口');
  svg.append('path').attr('d',`M${gx-18},142 Q${gx-44},169 ${gx-18},196 M${gx+18},142 Q${gx+44},169 ${gx+18},196`).attr('fill','none').attr('stroke','rgba(255,181,71,.8)').attr('stroke-width',2);
}
function renderCompression(progress){
  const next=Math.max(0,Math.min(3,Math.round(progress*3)));
  if(Number(slider.value)!==next) slider.value=next;
  active=next; visited.add(active);
  document.querySelectorAll('.scale-dot').forEach((d,i)=>{d.classList.toggle('current',i===active);d.classList.toggle('seen',visited.has(i));});
  document.getElementById('seenCount').textContent=visited.size+' / 4';
  document.getElementById('completion').style.visibility=visited.size===4?'visible':'hidden';
  buildTable(); draw();
}
slider.addEventListener('input',()=>{
  const progress=Number(slider.value)/3;
  renderCompression(progress);
  gsap.fromTo('.scale-dot.current',{scale:1.35},{scale:1,duration:Deck.reduced()?0:.22,ease:'power2.out'});
});
document.querySelectorAll('[data-years]').forEach(btn=>btn.addEventListener('click',()=>{
  generationYears=Number(btn.dataset.years);
  document.querySelectorAll('[data-years]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));
  buildTable();
}));
document.getElementById('reset').addEventListener('click',()=>{
  visited.clear();visited.add(0);slider.value=0;generationYears=generationYearsDefault;
  document.querySelectorAll('[data-years]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.years==='25')));
  renderCompression(0);slider.focus();
});
document.getElementById('clockField').addEventListener('wheel',e=>{
  e.preventDefault(); const gate=document.querySelector('.gate-wrap'); gate.classList.remove('shake'); void gate.offsetWidth; gate.classList.add('shake');
  document.getElementById('prompt').textContent='拖动中央压缩柄，比较同一时间窗口。';
},{passive:false});

if(!Deck.reduced()){
  gsap.from('#timeline line',{scaleX:0,transformOrigin:'left center',duration:.8,ease:'power2.out'});
  gsap.from('.gate-wrap',{y:-18,opacity:0,duration:.45,delay:.7,ease:'power2.out'});
  ScrollTrigger.create({trigger:'#main',start:'top top',end:'+=1200',scrub:true,pin:false,onUpdate:self=>{ if(self.isActive) renderCompression(self.progress); }});
}
renderCompression(0);
</script>
</body>
</html>
