<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .workbench{height:100%;display:flex;flex-direction:column;gap:16px;padding-top:4px;position:relative}.workbench>*:not(.bench-visual){position:relative;z-index:1}.bench-visual{position:absolute;inset:0;z-index:0;width:100%;height:100%;opacity:.38;pointer-events:none}
  .roundline{--process-cols:4;height:186px}
  .roundline .step{padding:48px 14px 12px}
  .roundline .step::after{content:"";position:absolute;inset:42px 10px 8px;border:1px dashed rgba(66,199,194,.18);border-radius:10px;pointer-events:none}
  .round-head{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-label);font-weight:700}
  .mini-flake{height:54px;margin:8px 0 4px;display:flex;align-items:center;justify-content:center}
  .flake{width:82px;height:48px;background:var(--surface-high);border:2px solid var(--primary);clip-path:polygon(8% 50%,20% 10%,47% 2%,79% 15%,96% 47%,79% 90%,48% 98%,18% 87%);position:relative}
  .flake i{position:absolute;width:14px;height:14px;background:var(--bg);transform:rotate(45deg);border:1px solid var(--accent)}
  .flake i:nth-child(1){left:8px;top:-6px}.flake i:nth-child(2){right:8px;top:1px}.flake i:nth-child(3){right:2px;bottom:2px}.flake i:nth-child(4){left:12px;bottom:-5px}
  .round-score{font-family:var(--font-mono);font-size:var(--fs-sec);color:var(--muted)}
  .game-area{display:flex;gap:18px;min-height:0;flex:1}
  .instruction{width:310px;padding:18px;display:flex;flex-direction:column;gap:12px}
  .step-list{display:flex;flex-direction:column;gap:8px;font-size:var(--fs-sec)}
  .step-list b{display:inline-grid;place-items:center;width:25px;height:25px;margin-right:8px;border:1px solid var(--primary-line);border-radius:50%;color:var(--primary);font-family:var(--font-mono)}
  .play{flex:1;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
  .play-top{display:flex;align-items:center;justify-content:space-between;gap:18px}
  .mode-select{min-width:190px}
  .actions{display:flex;gap:12px;min-height:102px}
  .action-card{flex:1;min-width:0;padding:12px;background:var(--surface-high);border:1px solid var(--line-strong);border-radius:var(--radius-sm);cursor:grab;transition:transform 180ms ease-out,border-color 180ms ease-out}
  .action-card:focus{border-color:var(--accent)}
  .action-card strong{display:block;font-size:var(--fs-sec);margin-bottom:5px}.action-card span{display:block;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
  .action-card.dragging{opacity:.55;transform:translateY(-5px)}
  .action-card.wrong{animation:shake .24s ease-out;border-color:var(--accent)}
  .feedback{min-height:54px;padding:10px 14px;border-left:4px solid var(--primary);background:var(--surface-deep);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .controls{display:flex;align-items:center;justify-content:space-between;gap:18px}.controls .note{max-width:720px}
  @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  @media(prefers-reduced-motion:reduce){.action-card{transition:none}.action-card.wrong{animation:none}}
</style>
</head>
<body data-page="24" data-total="48">
<div id="stage"><main id="main"></main></div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
Lec.mount({index:24,kicker:"CULTURAL FIDELITY",title:"技巧怎样不走样",take:"只靠观察的技能会逐轮失真；示范、纠错和教学能提高传递保真度。"});
const main=document.querySelector('#main');
main.innerHTML=`<section class="workbench" aria-label="石器技巧传播模拟">
  <svg class="bench-visual" viewBox="0 0 1408 620" aria-hidden="true"><g fill="none" stroke="rgba(66,199,194,.24)" stroke-width="2"><path d="M32 520 C130 430 205 455 292 526 S478 578 570 496 S750 410 844 496 S1038 584 1130 498 S1300 430 1376 505"/><path d="M55 550 C151 472 225 492 310 553 M1095 548 C1190 468 1291 471 1360 535"/><path d="M338 330 C370 252 424 235 478 260 C522 280 526 337 492 359 C451 385 384 373 338 330Z"/><path d="M955 326 C982 251 1041 231 1095 260 C1145 287 1139 343 1098 366 C1050 390 989 370 955 326Z"/></g><g fill="rgba(255,181,71,.08)" stroke="rgba(255,181,71,.32)" stroke-width="2"><polygon points="330,330 356,270 416,246 476,265 507,320 480,365 410,380 350,360"/><polygon points="946,330 974,268 1035,244 1097,267 1126,324 1096,367 1028,381 968,360"/></g></svg>
  <div class="k-process roundline" id="roundline"><div class="axis"></div></div>
  <div class="game-area">
    <aside class="panel instruction min0">
      <h2>一轮怎样传下去</h2>
      <div class="step-list"><div><b>1</b>查看上一人的成品</div><div><b>2</b>选择传递方式</div><div><b>3</b>排列四张动作卡</div><div><b>4</b>敲制并比对</div><div><b>5</b>交给下一人</div></div>
      <p class="sec muted">上一轮结果会成为下一轮范本，不会重新对照原作。</p>
    </aside>
    <section class="panel high play min0">
      <div class="play-top"><div><span class="label primary" id="roundLabel">传播轮次</span><h2 id="taskTitle">重建本轮动作顺序</h2></div>
        <label class="ctl"><span class="ctl-label">传递方式</span><select id="mode" class="mode-select" aria-label="选择传递方式"><option value="observe">观察｜只看成品</option><option value="demo">示范｜看动作先后</option><option value="correct">纠错｜指出首个错误</option><option value="teach">教学｜说明顺序与目的</option></select></label></div>
      <div class="actions no-pan" id="actions" aria-label="动作卡，可拖动；聚焦后用左右方向键排序"></div>
      <div class="feedback" id="feedback" aria-live="polite">拖动动作卡；也可聚焦卡片后按左右方向键。</div>
      <div class="controls"><p class="note" id="clue">观察只提供成品轮廓，不直接给出动作意图。</p><button id="advance">敲制并传给下一人</button></div>
    </section>
  </div>
</section>`;
const target=["选平台","定角度","控制力度","沿边敲击"];
const purpose={"选平台":"找到稳定受力点","定角度":"决定剥片方向","控制力度":"避免破裂过深","沿边敲击":"形成连续刃缘"};
let rng,state;
function fresh(){rng=new Math.seedrandom("apeman-p24");return {round:1,mode:"observe",target:target.slice(),current:shuffle(target.slice()),fidelity:[],history:[target.slice()],done:false};}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function score(a){return a.reduce((n,x,i)=>n+(x===target[i]),0)}
function renderRounds(){const box=document.querySelector('#roundline');box.innerHTML='<div class="axis"></div>'+[1,2,3,4].map((n,i)=>{const seq=state.history[i]||state.history[state.history.length-1],s=state.fidelity[i];return `<div class="step ${n===state.round&&!state.done?'is-current':''} ${n<state.round||state.done?'is-done':''}"><div class="round-head"><span>传播轮次 ${n}</span><span>${n<state.round||state.done?'已传递':'等待'}</span></div><div class="mini-flake"><div class="flake" style="transform:rotate(${(score(seq)-4)*3}deg)"><i></i><i></i><i></i><i></i></div></div><div class="round-score">匹配 ${s==null?'—':s} / 4</div>${n<4?'<span class="arw"></span>':''}</div>`}).join('')}
function renderCards(){const mode=document.querySelector('#mode').value;document.querySelector('#actions').innerHTML=state.current.map((x,i)=>`<div class="action-card" draggable="true" tabindex="0" data-i="${i}"><strong>${i+1}. ${x}</strong><span>${mode==='teach'?purpose[x]:'拖动调整先后'}</span></div>`).join('');bindCards()}
function move(from,to){if(to<0||to>3||from===to)return;const [v]=state.current.splice(from,1);state.current.splice(to,0,v);renderCards();document.querySelectorAll('.action-card')[to].focus();}
function bindCards(){let from=null;document.querySelectorAll('.action-card').forEach(c=>{c.addEventListener('dragstart',()=>{from=+c.dataset.i;c.classList.add('dragging')});c.addEventListener('dragend',()=>c.classList.remove('dragging'));c.addEventListener('dragover',e=>e.preventDefault());c.addEventListener('drop',e=>{e.preventDefault();move(from,+c.dataset.i)});c.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();move(+c.dataset.i,+c.dataset.i+(e.key==='ArrowLeft'?-1:1))}})})}
function modeCopy(seq,mode){let out=seq.slice(),p={observe:0,demo:.35,correct:.65,teach:.9}[mode];for(let i=0;i<4;i++)if(out[i]!==target[i]&&rng()<p){let j=out.indexOf(target[i]);[out[i],out[j]]=[out[j],out[i]];if(mode==='correct')break}return out}
function updateClue(){const m=document.querySelector('#mode').value;state.mode=m;document.querySelector('#clue').textContent={observe:'观察只提供成品轮廓，不直接给出动作意图。',demo:'示范会短暂强化正确动作的先后线索。',correct:'纠错会指出首个错位，并解释误差来源。',teach:'教学同时保留动作名称、顺序和操作目的。'}[m];renderCards()}
function submit(){if(state.done){state=fresh();document.querySelector('#mode').value='observe';document.querySelector('#advance').textContent='敲制并传给下一人';document.querySelector('#feedback').textContent='已用同一种子重置。拖动动作卡开始第一轮。';render();return}
 const before=state.current.slice(),result=modeCopy(before,state.mode),s=score(result);state.fidelity.push(s);state.history.push(result.slice());const first=before.findIndex((x,i)=>x!==target[i]);
 document.querySelector('#feedback').textContent=s===4?'四步吻合；这一轮保住了原技巧。':`${s} 格吻合。错位会被下一人当作新范本，误差继续传递。`+(state.mode==='correct'&&first>=0?` 首个错位：第 ${first+1} 步。`:'');
 if(first>=0)document.querySelectorAll('.action-card')[first]?.classList.add('wrong');
 if(state.round===4){state.done=true;document.querySelector('#advance').textContent='用同一种子重置';}else{state.round++;state.current=shuffle(result.slice())}renderRounds();document.querySelector('#roundLabel').textContent=state.done?'四轮完成':`传播轮次 ${state.round} / 4`;if(!state.done)renderCards();}
function render(){renderRounds();renderCards();document.querySelector('#roundLabel').textContent=`传播轮次 ${state.round} / 4`;updateClue()}
document.querySelector('#mode').addEventListener('change',updateClue);document.querySelector('#advance').addEventListener('click',submit);state=fresh();render();
</script>
</body></html>
