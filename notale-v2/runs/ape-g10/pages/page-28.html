<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main{display:flex;flex-direction:column;gap:12px}
  .gamebar{height:54px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 16px;background:var(--surface-deep);border:1px solid var(--line);border-radius:var(--radius-md)}
  .predict{display:flex;align-items:center;gap:10px;min-width:0}.predict strong{font-size:var(--fs-sec)}
  .choice{min-height:38px;padding:6px 12px;font-size:var(--fs-sec)}
  .choice[aria-pressed="true"]{color:#071019;background:var(--accent);border-color:var(--accent)}
  .round-status{font-family:var(--font-mono);font-size:var(--fs-body);color:var(--primary);font-weight:700;white-space:nowrap}
  .actions{display:flex;gap:8px}.actions button{font-size:var(--fs-sec)}
  .k-comparison{--compare-cols:112px repeat(3,minmax(0,1fr));flex:1;grid-template-rows:48px 1fr 44px 44px 44px;min-height:0}
  .k-comparison>*{padding:8px 12px}.k-comparison .hdr{font-size:var(--fs-lead);display:flex;align-items:center;justify-content:space-between}
  .corner-count{font-family:var(--font-mono);font-size:var(--fs-label);color:var(--muted)}
  .network-cell{position:relative;min-height:0;padding:6px!important;background:linear-gradient(180deg,rgba(66,199,194,.025),transparent)}
  .network-cell svg{display:block;width:100%;height:100%;overflow:visible}
  .network-cell.selected{box-shadow:inset 0 0 0 2px var(--accent)}
  .network-cell.winner{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
  .network-cell.shake{animation:shake .28s ease-out}
  .dim{display:flex;align-items:center;justify-content:flex-end}.cell{display:flex;align-items:center}.cell.diff{color:var(--accent);font-weight:700}
  .skill-read{font-family:var(--font-mono);font-size:var(--fs-body);font-weight:700;color:var(--primary)}
  .track{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface-deep);border:1px solid var(--line);border-radius:var(--radius-md)}
  .track-label{font-size:var(--fs-label);color:var(--muted);font-weight:700}.steps{display:flex;gap:8px;flex:0 0 430px}.step-dot{height:10px;flex:1;background:var(--surface-high);border:1px solid var(--line-strong);border-radius:99px}.step-dot.done{background:var(--accent);border-color:var(--accent)}
  #claim{flex:1;font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}#claim.final{color:var(--text)}
  .model-note{font-size:var(--fs-sec);color:var(--muted);white-space:nowrap}
  .link{stroke:var(--primary);stroke-opacity:.42;stroke-width:1.5}.link.bridge{stroke:var(--accent);stroke-width:2.8;stroke-dasharray:5 3}.link.hot{stroke:var(--accent);stroke-width:3.4;stroke-opacity:1}
  .node-core{fill:var(--primary);stroke:#B7F3F0;stroke-width:1.5}.skill-arc{fill:none;stroke-width:2.2}
  @keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
  @media(prefers-reduced-motion:reduce){.network-cell.shake{animation:none}}
</style>
</head>
<body data-page="28" data-total="48">
<div id="stage"><main id="main">
  <section class="gamebar" aria-label="预测与运行控制">
    <div class="predict"><strong>先预测：谁会保存最多技能？</strong>
      <button class="choice" data-pick="tight" aria-pressed="false">小型紧连</button>
      <button class="choice" data-pick="fragment" aria-pressed="false">大型碎片</button>
      <button class="choice" data-pick="bridge" aria-pressed="false">大型有桥</button>
    </div>
    <div class="round-status" id="roundStatus" aria-live="polite"></div>
    <div class="actions"><button id="runBtn" disabled></button><button id="resetBtn">用同一种子重置</button></div>
  </section>

  <section class="k-comparison min0" aria-label="三种群体网络同步比较">
    <div class="hdr"></div><div class="hdr">小型紧连 <span class="corner-count" data-count="12"></span></div><div class="hdr">大型碎片 <span class="corner-count" data-count="24"></span></div><div class="hdr">大型有桥 <span class="corner-count" data-count="24"></span></div>
    <div class="dim">传播路径</div><div class="network-cell min0" data-net="tight"><svg role="img" aria-label="十二人紧密相连的网络"></svg></div><div class="network-cell min0" data-net="fragment"><svg role="img" aria-label="二十四人分成四个孤立群组的网络"></svg></div><div class="network-cell min0" data-net="bridge"><svg role="img" aria-label="二十四人四个群组由三条桥连接的网络"></svg></div>
    <div class="dim">成员数</div><div class="cell member"></div><div class="cell member"></div><div class="cell member"></div>
    <div class="dim">拓扑</div><div class="cell">一个高聚集群</div><div class="cell diff">四个孤岛群</div><div class="cell diff">三条跨群桥</div>
    <div class="dim">技能保留</div><div class="cell skill-read" data-read="tight"></div><div class="cell skill-read" data-read="fragment"></div><div class="cell skill-read" data-read="bridge"></div>
  </section>

  <section class="track" aria-label="同步传播轮次">
    <span class="track-label">同步轮次</span><div class="steps" id="steps"></div>
    <p id="claim">人数增加了潜在学习者；若技能到不了其他子群，规模优势仍会被截断。</p>
    <span class="model-note" title="三种网络采用相同传播、遗失与创新概率。">连接结构教学模型</span>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
Lec.mount({index:28, kicker:"CULTURE NETWORKS", title:"连接比人头更重要", take:"更大的互联群体通常能保存更多技能，但连接质量比人数本身更关键。"});
const simulation={rounds:8,initialSkills:6,transmitProbability:0.62,innovateProbability:0.025,lossProbability:0.08};
const kinds=[
 {id:'tight',n:12,groups:1,bridges:[]},
 {id:'fragment',n:24,groups:4,bridges:[]},
 {id:'bridge',n:24,groups:4,bridges:[[2,6],[8,12],[14,18]]}
];
const fmt=n=>Lec.P.formatNumber(n,{maximumFractionDigits:0});
let state, timers=[];
function makeLinks(k){const links=[];const size=k.n/k.groups;for(let g=0;g<k.groups;g++){const start=g*size;for(let i=0;i<size;i++){links.push({source:start+i,target:start+(i+1)%size});links.push({source:start+i,target:start+(i+2)%size});}}k.bridges.forEach(p=>links.push({source:p[0],target:p[1],bridge:true}));return links;}
function fresh(){timers.forEach(clearTimeout);timers=[];const rng=new Math.seedrandom('apeman-p28');const nets={};kinds.forEach(k=>{const nodes=d3.range(k.n).map(i=>({id:i,skills:new Set(),x:36+(i%6)*48,y:35+Math.floor(i/6)*48}));for(let s=0;s<simulation.initialSkills;s++)nodes[(s*5+1)%k.n].skills.add(s);nets[k.id]={kind:k,nodes,links:makeLinks(k),rng};});return {round:0,pick:null,running:false,nets};}
function retained(net){return d3.range(simulation.initialSkills).filter(s=>net.nodes.some(n=>n.skills.has(s))).length;}
function drawNetwork(net){const box=document.querySelector(`[data-net="${net.kind.id}"]`),svg=d3.select(box).select('svg'),w=410,h=250;svg.attr('viewBox',`0 0 ${w} ${h}`);svg.selectAll('*').remove();const nodes=net.nodes, links=net.links.map(l=>({...l}));const sim=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(d=>d.id).distance(34)).force('charge',d3.forceManyBody().strength(-55)).force('center',d3.forceCenter(w/2,h/2)).force('collide',d3.forceCollide(12)).stop();for(let i=0;i<180;i++)sim.tick();nodes.forEach(n=>{n.x=Math.max(14,Math.min(w-14,n.x));n.y=Math.max(14,Math.min(h-14,n.y));});svg.append('g').selectAll('line').data(links).join('line').attr('class',d=>`link${d.bridge?' bridge':''}`).attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);const groups=svg.append('g').selectAll('g').data(nodes).join('g').attr('transform',d=>`translate(${d.x},${d.y})`);groups.append('circle').attr('class','node-core').attr('r',5);const arc=d3.arc().innerRadius(7).outerRadius(9);groups.each(function(d){d3.select(this).selectAll('path').data([...d.skills]).join('path').attr('class','skill-arc').attr('stroke',s=>d3.schemeTableau10[s]).attr('d',s=>arc({startAngle:s*Math.PI/3,endAngle:(s+1)*Math.PI/3-.12}));});}
function render(){document.querySelectorAll('.corner-count').forEach(el=>el.textContent=`${fmt(+el.dataset.count)} 人`);document.querySelectorAll('.member').forEach((el,i)=>el.textContent=`${fmt(kinds[i].n)} 人`);kinds.forEach(k=>{drawNetwork(state.nets[k.id]);document.querySelector(`[data-read="${k.id}"]`).textContent=`${fmt(retained(state.nets[k.id]))} / ${fmt(simulation.initialSkills)} 种`;const box=document.querySelector(`[data-net="${k.id}"]`);box.classList.toggle('selected',state.pick===k.id);});document.getElementById('roundStatus').textContent=`传播轮次 ${fmt(state.round)} / ${fmt(simulation.rounds)}`;document.querySelectorAll('.step-dot').forEach((x,i)=>x.classList.toggle('done',i<state.round));}
function advance(net){const additions=[];net.links.forEach(l=>{const a=net.nodes[typeof l.source==='object'?l.source.id:l.source],b=net.nodes[typeof l.target==='object'?l.target.id:l.target];a.skills.forEach(s=>{if(!b.skills.has(s)&&net.rng()<simulation.transmitProbability)additions.push([b,s,l]);});b.skills.forEach(s=>{if(!a.skills.has(s)&&net.rng()<simulation.transmitProbability)additions.push([a,s,l]);});});additions.forEach(([n,s])=>n.skills.add(s));net.nodes.forEach(n=>[...n.skills].forEach(s=>{if(net.rng()<simulation.lossProbability)n.skills.delete(s);}));if(net.rng()<simulation.innovateProbability){const n=net.nodes[Math.floor(net.rng()*net.nodes.length)],s=Math.floor(net.rng()*simulation.initialSkills);n.skills.add(s);}}
function finish(){state.running=false;const scores=kinds.map(k=>({id:k.id,v:retained(state.nets[k.id])}));const max=d3.max(scores,d=>d.v);let champs=scores.filter(d=>d.v===max).map(d=>d.id);if(champs.length>1&&champs.includes('bridge'))champs=['bridge'];const hit=champs.includes(state.pick);const picked=document.querySelector(`[data-net="${state.pick}"]`);if(hit){document.getElementById('claim').textContent='预测命中：桥让技能跨群传播、由多人保存，并能在遗失后重新接续。';}else{picked.classList.add('shake');document.getElementById('claim').textContent='人数不是唯一变量：检查技能是否能跨越群组边界。';}document.getElementById('claim').classList.add('final');champs.forEach(id=>document.querySelector(`[data-net="${id}"]`).classList.add('winner'));document.getElementById('runBtn').disabled=true;}
function run(){if(state.running)return;state.running=true;document.getElementById('runBtn').disabled=true;for(let r=1;r<=simulation.rounds;r++){timers.push(setTimeout(()=>{kinds.forEach(k=>advance(state.nets[k.id]));state.round=r;render();if(r===simulation.rounds)finish();},Deck.reduced()?0:r*260));}}
function reset(){state=fresh();document.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-pressed','false'));document.querySelectorAll('.network-cell').forEach(x=>x.classList.remove('selected','winner','shake'));document.getElementById('claim').className='';document.getElementById('claim').textContent='人数增加了潜在学习者；若技能到不了其他子群，规模优势仍会被截断。';document.getElementById('runBtn').disabled=true;render();}
document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(state.running||state.round)return;state.pick=b.dataset.pick;document.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('runBtn').disabled=false;render();}));
document.getElementById('runBtn').addEventListener('click',run);document.getElementById('resetBtn').addEventListener('click',reset);document.getElementById('runBtn').textContent=`运行 ${fmt(simulation.rounds)} 轮`;const stepHost=document.getElementById('steps');for(let i=0;i<simulation.rounds;i++){const d=document.createElement('span');d.className='step-dot';stepHost.appendChild(d);}reset();
</script>
</body>
</html>
