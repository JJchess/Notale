<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .institution-page{height:100%;display:flex;flex-direction:column;gap:12px;padding:8px 0}
  .statusbar{height:38px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:var(--fs-sec)}
  .progress-read{color:var(--primary);font-family:var(--font-mono);font-weight:700}
  .ledger{position:relative;flex:1;min-height:0;padding:14px 18px;background:linear-gradient(90deg,var(--surface) 0 49.7%,#0b1822 49.7% 50.3%,var(--surface) 50.3%);border:1px solid var(--line-strong);border-radius:var(--radius-md);box-shadow:var(--shadow)}
  .ledger::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--primary-line)}
  .ledger-head{display:grid;grid-template-columns:minmax(0,1.3fr) 28px minmax(0,1fr);align-items:center;margin-bottom:8px;color:var(--muted);font-size:var(--fs-label);font-weight:700;letter-spacing:.06em}
  .ledger-head span:last-child{padding-left:16px}
  .ledger-lines{gap:7px}
  .case{display:grid;grid-template-columns:minmax(0,1.3fr) 28px minmax(0,1fr);align-items:stretch;min-height:96px;background:var(--surface-high);border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px}
  .problem{display:flex;align-items:center;padding:10px 14px;background:var(--surface-high);border:1px solid var(--line);border-left:4px solid var(--primary-line);border-radius:var(--radius-sm);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .link{position:relative;display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:20px}
  .link::before{content:"";width:100%;height:1px;background:var(--primary-line)}
  .link::after{content:"›";position:absolute;right:0;line-height:1}
  .case.connected .link::before{background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .case.connected .link{color:var(--accent)}
  .slot{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--surface-high);border:1px dashed var(--primary-line);border-radius:var(--radius-sm);transition:border-color .15s,background .15s}
  .slot.dragover{border-color:var(--accent);background:var(--accent-soft)}
  .slot-name{flex:0 0 52px;color:var(--accent);font-size:var(--fs-lead);font-weight:750}
  .mechanism{color:#d3e2e5;font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .placeholder{color:var(--faint);font-size:var(--fs-label)}
  .case.connected .slot{border-style:solid;border-color:var(--accent)}
  .case.wrong .slot{border-color:#b86f66}
  .tray{height:116px;display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--surface-deep);border:1px solid var(--line);border-radius:var(--radius-md)}
  .tray-label{width:116px;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
  .components{display:flex;gap:12px;flex:1}
  .component{min-width:120px;min-height:54px;color:var(--text);background:var(--surface-high);border:1px solid var(--primary-line);font-size:var(--fs-lead);cursor:grab}
  .component[disabled]{opacity:.22;cursor:default}
  .component.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .reset{font-size:var(--fs-sec)}
  .feedback{width:250px;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .feedback.success{color:var(--accent);font-weight:700}
  .network{display:flex;align-items:center;gap:8px}
  .network .network-node{opacity:.25}.network.complete .network-node{opacity:1;background:var(--accent);border-color:#ffe2ad}
  .shake{animation:shake .28s ease}
  @keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  @media (prefers-reduced-motion:reduce){.shake{animation:none}.slot{transition:none}}
</style>
</head>
<body data-page="29" data-total="48">
<div id="stage">
<main id="main">
  <section class="institution-page" aria-label="制度组件配对题">
    <div class="statusbar">
      <span>拖动组件到难题旁；键盘可用方向键选行，按 Enter 配对。</span>
      <div class="network" id="network"><span class="network-node"></span><span class="network-node"></span><span class="network-node"></span><span class="network-node"></span><span class="progress-read" id="progress">已匹配 0 / 4</span></div>
    </div>
    <div class="ledger k-classification" aria-label="协作难题账本">
      <div class="ledger-head"><span>协作难题｜上位类别</span><span></span><span>制度回应｜下位项</span></div>
      <div class="ledger-lines col" id="cases">
        <div class="case lv" style="--level:0" data-answer="标准">不同参与者各用一套尺寸与格式，成果无法拼合<div class="link"></div><div class="slot">放入合适的制度组件</div></div>
        <div class="case lv" style="--level:0" data-answer="角色">项目持续多年，人员更替后责任无人承接<div class="link"></div><div class="slot">放入合适的制度组件</div></div>
        <div class="case lv" style="--level:0" data-answer="规则">面对相同情形，各人临时决定，结果不可预期<div class="link"></div><div class="slot">放入合适的制度组件</div></div>
        <div class="case lv" style="--level:0" data-answer="审查">错误可能长期潜伏，参与者也可能偏袒自己的成果<div class="link"></div><div class="slot">放入合适的制度组件</div></div>
      </div>
    </div>
    <div class="tray no-pan">
      待分类组件｜每项只有一个最佳匹配
      <div class="components" id="components">
        <button class="component" draggable="true" data-name="审查" aria-label="审查：拖动，或用方向键选行后按回车">审查</button>
        <button class="component" draggable="true" data-name="规则" aria-label="规则：拖动，或用方向键选行后按回车">规则</button>
        <button class="component" draggable="true" data-name="标准" aria-label="标准：拖动，或用方向键选行后按回车">标准</button>
        <button class="component" draggable="true" data-name="角色" aria-label="角色：拖动，或用方向键选行后按回车">角色</button>
      </div>
      <div class="feedback" id="feedback" aria-live="polite">不同协作故障，需要不同制度回应。</div>
      <button class="reset" id="reset">重新匹配</button>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:29, kicker:"CULTURAL SYSTEMS · 制度", title:"把难题交给合适的制度组件", take:"规则、标准、角色和审查，让陌生人能在同一长期项目中协作。"});
const mechanisms={
  标准:'规定共同接口、单位与格式，使分散成果可以兼容',
  角色:'明确职责、权限与交接，使任务不依赖某个熟人',
  规则:'预先约定可重复的行动边界与程序',
  审查:'由他人复核过程与产出，暴露错误并要求修正'
};
const wrong={标准:'这里缺的是共同接口，不是监督',角色:'这里缺的是责任承接',规则:'这里缺的是一致程序',审查:'这里缺的是独立复核'};
const cases=[...document.querySelectorAll('.case')], cards=[...document.querySelectorAll('.component')];
let active=null, row=0, count=0;
function choose(card){cards.forEach(c=>c.classList.remove('selected')); active=card; card.classList.add('selected');}
function place(card, target){
  if(!card || card.disabled || target.classList.contains('connected')) return;
  const answer=target.dataset.answer;
  if(card.dataset.name!==answer){target.classList.remove('wrong'); void target.offsetWidth; target.classList.add('wrong'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); document.querySelector('#feedback').textContent=wrong[answer]; return;}
  target.classList.remove('wrong'); target.classList.add('connected');
  target.querySelector('.slot').innerHTML='<span class="slot-name">'+answer+'</span><span class="mechanism">'+mechanisms[answer]+'</span>';
  card.disabled=true; card.classList.remove('selected'); active=null; count++;
  document.querySelector('#progress').textContent='已匹配 '+count+' / 4';
  document.querySelectorAll('.network-node')[count-1].style.opacity='1';
  const fb=document.querySelector('#feedback');
  if(count===4){document.querySelector('#network').classList.add('complete');fb.className='feedback success';fb.textContent='制度组件形成协作基础设施。';}
  else {fb.className='feedback';fb.textContent='已接通：'+answer+'回应了这类协作故障。';}
}
cards.forEach(card=>{
  card.addEventListener('dragstart',e=>{choose(card);e.dataTransfer.setData('text/plain',card.dataset.name);});
  card.addEventListener('click',()=>choose(card));
  card.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();row=(row+3)%4;choose(card);cases[row].querySelector('.slot').classList.add('dragover');cases.forEach((c,i)=>{if(i!==row)c.querySelector('.slot').classList.remove('dragover')});} if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();row=(row+1)%4;choose(card);cases[row].querySelector('.slot').classList.add('dragover');cases.forEach((c,i)=>{if(i!==row)c.querySelector('.slot').classList.remove('dragover')});} if(e.key==='Enter'||e.key===' '){e.preventDefault();place(card,cases[row]);}});
});
cases.forEach((c,i)=>{const slot=c.querySelector('.slot');slot.addEventListener('dragover',e=>{e.preventDefault();slot.classList.add('dragover');});slot.addEventListener('dragleave',()=>slot.classList.remove('dragover'));slot.addEventListener('drop',e=>{e.preventDefault();slot.classList.remove('dragover');const card=cards.find(x=>x.dataset.name===e.dataTransfer.getData('text/plain'));place(card,c);});});
document.querySelector('#reset').addEventListener('click',()=>{count=0;active=null;row=0;cards.forEach(c=>{c.disabled=false;c.classList.remove('selected','shake')});cases.forEach(c=>{c.classList.remove('connected','wrong');c.querySelector('.slot').classList.remove('dragover');c.querySelector('.slot').innerHTML='放入合适的制度组件';});document.querySelectorAll('.network-node').forEach(n=>n.style.opacity='');document.querySelector('#network').classList.remove('complete');document.querySelector('#progress').textContent='已匹配 0 / 4';const fb=document.querySelector('#feedback');fb.className='feedback';fb.textContent='不同协作故障，需要不同制度回应。';});
</script>
</body>
</html>
