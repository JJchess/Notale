<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .supply-game{height:100%;display:flex;flex-direction:column;gap:16px;padding-top:8px}
    .game-head{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:62px}
    .brief{max-width:790px;font-size:var(--fs-lead);line-height:var(--lh-copy)}
    .progress-box{display:flex;align-items:center;gap:18px;padding:12px 16px;background:var(--surface-deep);border:1px solid var(--primary-line);border-radius:var(--radius-sm)}
    .progress-box strong{font-family:var(--font-mono);font-size:var(--fs-h2);color:var(--primary)}
    .game-board{position:relative;flex:1;min-height:0;padding:18px;background:linear-gradient(135deg,rgba(66,199,194,.05),transparent 42%),var(--surface-deep);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
    .network{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
    .flow-line{fill:none;stroke:var(--primary-line);stroke-width:3;stroke-dasharray:8 8;marker-end:url(#arrow)}
    .flow-line.live{stroke:var(--accent);stroke-dasharray:none;filter:drop-shadow(0 0 5px rgba(255,181,71,.65))}
    .flow-pulse{fill:var(--accent);opacity:0}
    .k-process{height:100%;--process-cols:4;position:relative;z-index:1;gap:42px;align-items:center}
    .k-process .axis{top:50%;opacity:.4}
    .k-process .step{height:292px;padding:48px 16px 14px;display:flex;flex-direction:column;gap:9px;background:rgba(16,29,40,.94);transition:border-color 220ms ease,transform 220ms ease}
    .k-process .step::before{top:17px}
    .k-process .arw{top:132px}
    .step h2{font-size:var(--fs-h2)}
    .role{color:var(--primary);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700}
    .state{display:inline-flex;align-self:flex-start;padding:3px 9px;border:1px solid var(--line-strong);border-radius:99px;color:var(--muted);font-size:var(--fs-label);font-weight:700}
    .inputs{display:flex;flex-wrap:wrap;gap:6px;min-height:56px;align-content:flex-start}
    .chip{padding:4px 8px;background:var(--primary-soft);border:1px solid var(--primary-line);border-radius:6px;font-size:var(--fs-label);line-height:1.35}
    .step p{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
    .step button{margin-top:auto;width:100%;font-size:var(--fs-sec)}
    .step button:disabled{opacity:.42;cursor:not-allowed}
    .step.is-current{transform:translateY(-5px)}
    .step.is-done{opacity:1;filter:none;border-color:var(--accent)}
    .step.is-done .state{color:var(--accent);border-color:var(--accent)}
    .tool-silhouette{position:absolute;left:50%;bottom:20px;z-index:2;transform:translateX(-50%);display:flex;align-items:center;gap:10px;color:var(--faint);font-family:var(--font-mono);font-size:var(--fs-label);pointer-events:none}
    .lamp{width:46px;height:28px;border:3px solid currentColor;border-radius:50% 12px 12px 50%;box-shadow:none;transition:all 260ms ease}
    .lamp.on{color:var(--accent);background:rgba(255,181,71,.24);box-shadow:0 0 26px rgba(255,181,71,.75)}
    .feedback{min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 4px}
    #message{font-size:var(--fs-sec);line-height:var(--lh-sec);color:#D7E6E9}
    .claim{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
    .shake{animation:shake .28s ease}
    @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}.step.is-current{transform:none}}
  </style>
</head>
<body data-page="30" data-total="48">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
    Lec.mount({index:30, kicker:"CULTURE · SUPPLY CHAIN", title:"没人独自造出一枚工具", take:"复杂物品是材料、知识、标准和供应链共同作用的网络产物。"});

    const main=document.getElementById('main');
    main.innerHTML=`<section class="supply-game" aria-label="手摇照明器供应链游戏">
      <div class="game-head">
        <p class="brief">目标：交付一枚合格的手摇照明器。沿依赖箭头协作；每轮由当前角色完成一次操作。</p>
        <div class="progress-box"><span class="label">供应链进度</span><strong id="progress"></strong><button id="reset" type="button">一键重置</button></div>
      </div>
      <div class="game-board no-pan">
        <svg class="network" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#42C7C2"></path></marker></defs><g id="links"></g></svg>
        <div class="k-process" id="process"><div class="axis"></div>
          <article class="step min0" data-step="0"><span class="role">STEP 1 · 材料员</span><h2>原料</h2><span class="state">可操作</span><div class="inputs"><span class="chip">铜线</span><span class="chip">磁体</span><span class="chip">木柄</span></div><p>选齐三类材料，送往加工站。</p><button type="button">选齐并送检</button><span class="arw"></span></article>
          <article class="step min0" data-step="1"><span class="role">STEP 2 · 加工员</span><h2>合格零件</h2><span class="state">待输入</span><div class="inputs"><span class="chip">送检材料</span><span class="chip">绕线知识卡</span></div><p>知识使材料成为可用线圈与转轴。</p><button type="button" disabled>制作线圈与转轴</button><span class="arw"></span></article>
          <article class="step min0" data-step="2"><span class="role">STEP 3 · 标准员</span><h2>兼容接口</h2><span class="state">待输入</span><div class="inputs"><span class="chip">线圈</span><span class="chip">转轴</span><span class="chip">接口标准卡</span></div><p>检查尺寸与接点，确认两处兼容。</p><button type="button" disabled>检查两个接口</button><span class="arw"></span></article>
          <article class="step min0" data-step="3"><span class="role">STEP 4 · 装配员</span><h2>成品交付</h2><span class="state">待输入</span><div class="inputs"><span class="chip">合格线圈</span><span class="chip">转轴</span><span class="chip">木柄</span></div><p>按依赖顺序装配，手摇测试。</p><button type="button" disabled>装配并测试</button></article>
        </div>
        <div class="tool-silhouette"><span class="lamp" id="lamp"></span><span id="toolLabel">未完成照明器</span></div>
      </div>
      <div class="feedback"><div><p id="message" aria-live="polite">材料员先选齐铜线、磁体和木柄。</p><p class="claim">复杂工具不是零件堆积，而是让材料、知识与标准接得上的流程。</p></div></div>
    </section>`;

    const fmt=n=>Lec.P.formatNumber(n);
    const steps=[...document.querySelectorAll('.step')];
    const messages=[
      '材料齐全并送检。加工员现在可以读取绕线知识卡。',
      '线圈方向正确，转轴可转。标准员现在检查接口。',
      '尺寸与接点均兼容。装配员现在可以确认连接。',
      '交付成功：4 个角色、6 项输入。最后装配者并非独自制造成品。'
    ];
    let state;
    function fresh(){return {connected:0,round:1,complete:false,trace:[]}}
    function render(){
      document.getElementById('progress').textContent=`${fmt(state.connected)} / ${fmt(4)} 已接通`;
      steps.forEach((el,i)=>{
        const done=i<state.connected,current=i===state.connected&&!state.complete;
        el.classList.toggle('is-done',done);el.classList.toggle('is-current',current);
        el.querySelector('.state').textContent=done?'已交付':current?'可操作':state.complete?'已交付':'待输入';
        el.querySelector('button').disabled=!current;
      });
      document.getElementById('lamp').classList.toggle('on',state.complete);
      document.getElementById('toolLabel').textContent=state.complete?'手摇照明器持续亮起':'未完成照明器';
      drawLinks();
    }
    function drawLinks(){
      const svg=d3.select('.network'), board=document.querySelector('.game-board').getBoundingClientRect();
      const data=steps.slice(0,3).map((el,i)=>{const a=el.getBoundingClientRect(),b=steps[i+1].getBoundingClientRect();return {i,x1:a.right-board.left-12,y1:a.top-board.top+a.height/2,x2:b.left-board.left+12,y2:b.top-board.top+b.height/2}});
      const g=d3.select('#links');g.selectAll('*').remove();
      g.selectAll('path').data(data).join('path').attr('class',d=>`flow-line ${d.i<state.connected?'live':''}`).attr('d',d=>`M${d.x1},${d.y1} C${d.x1+30},${d.y1} ${d.x2-30},${d.y2} ${d.x2},${d.y2}`);
    }
    function act(i){
      if(i!==state.connected){const el=steps[i];el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');document.getElementById('message').textContent=i>state.connected?'上一步尚未交付，当前节点缺少必要输入。':'这一环节已经交付，请沿箭头继续。';return}
      state.trace.push(i);state.connected++;state.round=state.connected+1;state.complete=state.connected===4;
      document.getElementById('message').textContent=messages[i];render();
      if(!Deck.reduced()&&i<3){d3.selectAll('.flow-line').filter((d,j)=>j===i).attr('stroke-width',7).transition().duration(420).attr('stroke-width',3)}
    }
    steps.forEach((el,i)=>el.querySelector('button').addEventListener('click',()=>act(i)));
    document.getElementById('reset').addEventListener('click',()=>{state=fresh();document.getElementById('message').textContent='材料员先选齐铜线、磁体和木柄。';render()});
    state=fresh();render();Deck.onResize(drawLinks);
  </script>
</body>
</html>
