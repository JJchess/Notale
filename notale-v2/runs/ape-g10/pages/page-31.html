<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:16px;padding:16px 0;box-sizing:border-box}
    .intro{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:38px}
    .intro p{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
    .status{flex:none;color:var(--primary);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700}
    .culture-map.k-generalization{flex:1;grid-template-columns:minmax(0,1.65fr) minmax(0,.82fr);gap:48px;min-height:0}
    .culture-map .supports{gap:10px;padding:24px 80px 24px 24px;counter-reset:rank;background:linear-gradient(135deg,rgba(66,199,194,.06),transparent 55%),var(--surface-deep);border:1px solid var(--line);border-radius:var(--radius-md)}
    .culture-map .trunk{left:auto;right:15px;top:24px;bottom:24px;width:4px;background:linear-gradient(0deg,rgba(66,199,194,.28),var(--primary));box-shadow:0 0 14px rgba(66,199,194,.3)}
    .culture-map .support{counter-increment:rank;display:flex;align-items:center;gap:16px;min-height:68px;padding:11px 16px;cursor:grab;user-select:none;font-size:var(--fs-body);font-weight:700;transition:transform .18s,border-color .18s,box-shadow .18s}
    .culture-map .support::before{right:auto;left:100%;width:56px;background:var(--primary-line)}
    .culture-map .support::after{content:"";position:absolute;left:calc(100% + 51px);top:calc(50% - 5px);width:10px;height:10px;border-radius:50%;background:var(--primary);box-shadow:0 0 12px rgba(66,199,194,.7)}
    .support.dragging,.support:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);outline:none}
    .rank{flex:0 0 30px;color:var(--accent);font:700 var(--fs-h2)/1 var(--font-mono)}
    .rank::before{content:counter(rank)}
    .support-copy{flex:1;min-width:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}.support-label{flex:0 0 118px;font-size:var(--fs-body);font-weight:700;line-height:1.35}
    .effect{flex:0 0 140px;color:var(--primary);font-size:var(--fs-label);font-weight:700;text-align:right}
    .claim-zone{position:relative;display:flex;flex-direction:column;justify-content:center;gap:16px;min-width:0;padding:24px;background:linear-gradient(180deg,rgba(66,199,194,.055),rgba(16,29,40,.82));border:1px solid var(--line);border-radius:var(--radius-md)}
    .claim-zone::before{content:"";position:absolute;left:-33px;top:50%;width:34px;height:3px;background:var(--primary)}
    .claim-zone .claim{align-self:stretch;text-align:center;border-left:0;border-top:6px solid var(--primary);border-radius:var(--radius-md);padding:20px}
    .helmet{width:70px;height:58px;margin:0 auto 10px;border:3px solid var(--primary);border-radius:34px 34px 18px 18px;position:relative;opacity:.38;transition:opacity .2s,box-shadow .2s}
    .helmet::after{content:"";position:absolute;left:12px;right:12px;top:15px;height:21px;border:2px solid var(--primary-line);border-radius:12px;background:var(--surface-deep)}
    .complete .helmet{opacity:1;box-shadow:0 0 24px rgba(255,181,71,.28);border-color:var(--accent)}
    .reason-box{padding:16px;background:var(--surface-deep);border:1px solid var(--line);border-radius:var(--radius-md)}
    .reason-box label{display:block;margin-bottom:8px;font-size:var(--fs-sec);font-weight:700}
    .reason-row{display:flex;gap:8px;align-items:center}.reason-row span{white-space:nowrap;font-size:var(--fs-sec)}
    #reason{flex:1;min-width:0;font-size:var(--fs-sec)}
    .feedback{min-height:46px;margin-top:8px;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
    .feedback.good{color:var(--accent)}
    .shake{animation:shake .25s linear 2}
    .closing{display:none;padding:12px 14px;border-left:4px solid var(--accent);background:var(--accent-soft);font-size:var(--fs-sec);line-height:1.4}
    .complete .closing{display:block}
    #reset{align-self:flex-start;font-size:var(--fs-sec)}
    @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    @media (prefers-reduced-motion:reduce){.culture-map .support,.helmet{transition:none}.shake{animation:none}}
  </style>
</head>
<body data-page="31" data-total="48">
  <div id="stage">
    <main id="main">
      <div class="intro">
        拖动卡片排序；也可聚焦卡片后用 ↑ ↓ 调整。名次表达你的判断，不是标准答案。
        <div class="status" id="status" aria-live="polite">已排序 4/4 · 理由尚未接通</div>
      </div>
      <section class="culture-map k-generalization min0" id="map" aria-label="文化加速器排序与汇流图">
        <div class="supports min0" id="supports">
          <div class="trunk" aria-hidden="true"></div>
        </div>
        <div class="claim-zone min0">
          四种机制共同让成果得以保存、复制、协调并继续改进。
          <div class="claim">
            <div class="helmet" aria-hidden="true"></div>
            末端结果：太空人
            <p class="sec muted">个人能力在这里发挥作用，但起点不是零。</p>
          </div>
          <div class="reason-box" id="reasonBox">
            为首位选择补全理由
            <div class="reason-row"><span>我把它放第一，因为它能</span><input id="reason" type="text" aria-label="首位选择的理由" placeholder="说明知识怎样继续累积" aria-describedby="feedback"></div>
            <p class="feedback" id="feedback" aria-live="polite">写出它怎样让知识跨人或跨代延续。</p>
          </div>
          <div class="closing" id="closing">太空人并非从零开始的孤立天才，而是接过许多代人保存、纠错和扩展的成果。</div>
          <button id="reset" type="button">重新排序</button>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:31, kicker:"CULTURAL ACCELERATORS", title:"太空人背后，站着一条文化接力链", take:"太空人首先是累积文化的产物，其次才是某个个人的壮举。"});
    const accelerators=[{id:"teaching",label:"教学与纠错",desc:"技能不只被模仿，还能被指出偏差",effect:"提高保真度"},{id:"symbols",label:"共享符号",desc:"计划、规则与不在眼前的对象可以交流",effect:"扩大可传内容"},{id:"memory",label:"外部记忆",desc:"知识离开单个大脑，进入可复制媒介",effect:"跨代保存"},{id:"institutions",label:"制度与标准",desc:"陌生人可按共同规则长期协作",effect:"扩大协作规模"}];
    const initialOrder=["teaching","symbols","memory","institutions"];
    let order=[...initialOrder], dragged=null;
    const supports=document.getElementById('supports'), map=document.getElementById('map'), reason=document.getElementById('reason'), feedback=document.getElementById('feedback'), status=document.getElementById('status'), reasonBox=document.getElementById('reasonBox');
    function render(){
      supports.querySelectorAll('.support').forEach(n=>n.remove());
      order.forEach(id=>{const a=accelerators.find(x=>x.id===id),el=document.createElement('div');el.className='support';el.draggable=true;el.tabIndex=0;el.dataset.id=id;el.setAttribute('role','button');el.setAttribute('aria-label',a.label+'，用上下方向键调整名次');el.innerHTML='<span class="rank" aria-hidden="true"></span>'+a.label+'<span class="support-copy">'+a.desc+'</span><span class="effect">'+a.effect+'</span>';
        el.addEventListener('dragstart',()=>{dragged=id;el.classList.add('dragging')});el.addEventListener('dragend',()=>{dragged=null;el.classList.remove('dragging')});el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',e=>{e.preventDefault();move(dragged,id)});el.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();const i=order.indexOf(id),j=i+(e.key==='ArrowUp'?-1:1);if(j>=0&&j<order.length){[order[i],order[j]]=[order[j],order[i]];render();supports.querySelector('[data-id="'+id+'"]').focus()}}});supports.appendChild(el)});
    }
    function move(from,to){if(!from||from===to)return;const fromI=order.indexOf(from),toI=order.indexOf(to);order.splice(fromI,1);order.splice(toI,0,from);render()}
    function validate(showError=false){const ok=/(保存|纠错|传递|协作|标准|跨代)/.test(reason.value.trim());map.classList.toggle('complete',ok);status.textContent='已排序 4/4 · 理由'+(ok?'已接通':'尚未接通');feedback.classList.toggle('good',ok);feedback.textContent=ok?'四条支撑已汇入同一主干：排序不同，共同累积不变。':'写出它怎样让知识跨人或跨代延续。';if(showError&&!ok){feedback.textContent='请说明它怎样让知识跨人或跨代累积，而不只是说它很重要。';reasonBox.classList.remove('shake');void reasonBox.offsetWidth;reasonBox.classList.add('shake')}}
    reason.addEventListener('input',()=>validate(false));reason.addEventListener('keydown',e=>{if(e.key==='Enter')validate(true)});reason.addEventListener('blur',()=>{if(reason.value.trim())validate(true)});
    document.getElementById('reset').addEventListener('click',()=>{order=[...initialOrder];reason.value='';validate(false);render();supports.querySelector('.support').focus()});
    render();validate(false);
  </script>
</body>
</html>
