<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
.orbit-page{height:100%;display:flex;flex-direction:column;gap:12px}.process-line{--process-cols:5;height:108px;flex:none}.process-line .step{padding:43px 10px 9px;background:rgba(16,29,40,.86);font-size:var(--fs-sec);line-height:1.38}.process-line .step::before{top:14px}.process-line .axis{top:22px}.process-line .arw{top:5px}.process-line .step b{display:block;color:var(--primary);font-size:var(--fs-label)}.sim{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(circle at 34% 68%,rgba(66,199,194,.09),transparent 32%),var(--surface-deep);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow)}#space{position:absolute;inset:0;display:block;width:100%;height:100%}.hud{position:absolute;right:16px;top:16px;width:280px;padding:14px;background:rgba(9,21,30,.9);border:1px solid var(--primary-line);border-radius:var(--radius-sm)}.hud-title{font-size:var(--fs-label);color:var(--muted)}.hud-row{display:flex;justify-content:space-between;gap:12px;font-size:var(--fs-sec);line-height:1.55}.hud-row output{font-family:var(--font-mono);color:var(--primary)}.criterion{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:var(--fs-body);font-weight:700}.legend{position:absolute;left:16px;top:16px;display:flex;gap:18px;padding:8px 12px;background:rgba(9,21,30,.8);border-radius:var(--radius-sm);font-size:var(--fs-label)}.key{display:inline-flex;align-items:center;gap:6px}.sw{width:24px;height:3px;background:var(--primary)}.sw.gravity{background:var(--accent)}.feedback{position:absolute;left:16px;bottom:82px;max-width:540px;padding:10px 14px;background:rgba(9,21,30,.92);border-left:4px solid var(--primary);font-size:var(--fs-sec);line-height:var(--lh-sec)}.feedback.fail{border-color:var(--accent)}.feedback.success{font-size:var(--fs-body);font-weight:700}.console{position:absolute;left:16px;right:16px;bottom:14px;display:flex;align-items:center;gap:16px;min-height:56px;padding:8px 12px;background:rgba(9,21,30,.94);border:1px solid var(--line-strong);border-radius:var(--radius-sm)}.console label{font-size:var(--fs-label);font-weight:700}.console input{flex:1;min-width:220px}.speed{width:104px;color:var(--accent);font-family:var(--font-mono);font-size:var(--fs-sec)}.console button{font-size:var(--fs-sec)}.conditions{position:absolute;right:16px;bottom:82px;color:var(--muted);font-size:var(--fs-label)}.pulse{position:absolute;width:20px;height:20px;border:3px solid var(--accent);border-radius:50%;opacity:0;pointer-events:none}.pulse.go{animation:ripple .65s ease-out}@keyframes ripple{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(3)}}@media(prefers-reduced-motion:reduce){.pulse.go{animation:none}}
</style>
</head>
<body data-page="33" data-total="48">
<div id="stage"><main id="main">
<section class="orbit-page">
  <div class="k-process process-line" aria-label="进入轨道的因果过程">
    <div class="axis"></div>
    <div class="step is-current" data-step="1"><b>1 横向投出</b><span id="altStep"></span> 高度出发<span class="arw"></span></div>
    <div class="step" data-step="2"><b>2 引力下落</b>始终指向地心<span class="arw"></span></div>
    <div class="step" data-step="3"><b>3 地表弯曲</b>低速时仍会相交<span class="arw"></span></div>
    <div class="step" data-step="4"><b>4 不断错过</b>下落与弯曲匹配<span class="arw"></span></div>
    <div class="step" data-step="5"><b>5 形成环绕</b>持续下落一整周</div>
  </div>
  <div class="sim min0" id="sim">
    <canvas id="space" aria-label="地球与实时积分轨道的三维模拟"></canvas>
    <div class="legend"><span class="key"><i class="sw"></i>速度切线</span><span class="key"><i class="sw gravity"></i>引力方向</span></div>
    <div class="hud" aria-live="polite">
      <div class="hud-title">实时仪表</div>
      <div class="hud-row"><span>切向速度</span><output id="speedOut"></output></div>
      <div class="hud-row"><span>当地重力</span><output id="gravityOut"></output></div>
      <div class="hud-row"><span>飞行时间</span><output id="timeOut"></output></div>
      <div class="criterion">轨道判据 <output id="criterionOut">0/3</output></div>
    </div>
    <div class="feedback" id="feedback" role="status">调节初速度再投掷。观察速度切线与指向地心的引力。</div>
    <div class="conditions">球对称地球；忽略大气阻力、地球自转及其他天体摄动</div>
    <div class="pulse" id="pulse"></div>
    <div class="console ctl">
      <label for="speed">初始切向速度</label>
      <input id="speed" type="range" min="0" max="8500" step="50" aria-label="初始切向速度">
      <output class="speed" id="sliderOut"></output>
      <button id="throwBtn">投掷</button><button id="resetBtn">重置投掷</button>
    </div>
  </div>
</section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/three.min.js"></script>
<script>
Lec.mount({index:33, kicker:"ORBIT / 持续下落", title:"一直落下，始终错过地面", take:"轨道不是没有重力，而是持续下落却不断错过地面。"});
const sceneConfig={launchAltitude:Lec.P.kmToM(400),initialSpeed:Lec.P.circularOrbitVelocity(Lec.K.earthMass,Lec.K.earthMeanRadius+Lec.P.kmToM(400)),speedRange:[0,8500],fixedStep:1,timeScale:180,maxTrailPoints:2400};
const R=Lec.K.earthMeanRadius, M=Lec.K.earthMass, scale=R, reduced=Deck.reduced();
const sim=document.getElementById('sim'), canvas=document.getElementById('space');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:"high-performance"});renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(38,1,.1,30);camera.position.set(0,5.7,8.6);camera.lookAt(-.35,0,0);
scene.add(new THREE.HemisphereLight(0x8edbd7,0x071019,1.5));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(4,6,7);scene.add(sun);
const earth=new THREE.Mesh(new THREE.SphereGeometry(1,64,40),new THREE.MeshStandardMaterial({color:0x174b62,roughness:.82,metalness:.06,emissive:0x071923,emissiveIntensity:.5}));earth.scale.set(1,1,.82);scene.add(earth);
const wire=new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.SphereGeometry(1.006,24,16)),new THREE.LineBasicMaterial({color:0x42c7c2,transparent:true,opacity:.16}));wire.scale.copy(earth.scale);scene.add(wire);
const craft=new THREE.Mesh(new THREE.SphereGeometry(.055,20,14),new THREE.MeshBasicMaterial({color:0xffb547}));scene.add(craft);
const trailMat=new THREE.LineBasicMaterial({color:0x42c7c2,transparent:true,opacity:.95});let trailGeom=new THREE.BufferGeometry(),trail=new THREE.Line(trailGeom,trailMat);scene.add(trail);
function arrow(color){const a=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(),.45,color,.11,.07);scene.add(a);return a}const velocityArrow=arrow(0x42c7c2),gravityArrow=arrow(0xffb547);
const state={running:false,done:false,crashed:false,t:0,angle:0,prevAngle:0,pos:{x:R+sceneConfig.launchAltitude,y:0},vel:{x:0,y:sceneConfig.initialSpeed},points:[]};
const speed=document.getElementById('speed'),sliderOut=document.getElementById('sliderOut'),speedOut=document.getElementById('speedOut'),gravityOut=document.getElementById('gravityOut'),timeOut=document.getElementById('timeOut'),criterionOut=document.getElementById('criterionOut'),feedback=document.getElementById('feedback');speed.value=sceneConfig.initialSpeed;
function kmps(v){return Lec.P.formatNumber(v/1000,{maximumFractionDigits:2})+' km/s'}function resize(){const w=sim.clientWidth,h=sim.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.render(scene,camera)}Deck.onResize(resize);
function setSteps(n){document.querySelectorAll('.process-line .step').forEach((el,i)=>{el.classList.toggle('is-current',i===n-1);el.classList.toggle('is-done',i<n-1)})}
function reset(useDefault=true){state.running=false;state.done=false;state.crashed=false;state.t=0;state.angle=0;state.prevAngle=0;if(useDefault)speed.value=sceneConfig.initialSpeed;state.pos={x:R+sceneConfig.launchAltitude,y:0};state.vel={x:0,y:Number(speed.value)};state.points=[];trailGeom.setFromPoints([]);trailMat.color.setHex(0x42c7c2);earth.material.emissiveIntensity=.5;feedback.className='feedback';feedback.textContent='调节初速度再投掷。观察速度切线与指向地心的引力。';setSteps(1);update()}
function update(){const r=Math.hypot(state.pos.x,state.pos.y),a=Lec.P.gravitationalAcceleration(M,r),p=new THREE.Vector3(state.pos.x/scale,state.pos.y/scale,0);craft.position.copy(p);velocityArrow.position.copy(p);velocityArrow.setDirection(new THREE.Vector3(state.vel.x,state.vel.y,0).normalize());velocityArrow.setLength(.42,.1,.065);gravityArrow.position.copy(p);gravityArrow.setDirection(p.clone().multiplyScalar(-1).normalize());gravityArrow.setLength(.34,.1,.065);const crit=state.done?3:(Math.abs(state.angle)>=Math.PI?2:(state.running&&!state.crashed?1:0));criterionOut.textContent=crit+'/3';speedOut.textContent=kmps(Math.hypot(state.vel.x,state.vel.y));gravityOut.textContent=Lec.P.formatNumber(a,{maximumFractionDigits:2})+' m/s²';timeOut.textContent=Lec.P.formatDuration(state.t);sliderOut.textContent=kmps(Number(speed.value));renderer.render(scene,camera)}
function step(dt){const r=Math.hypot(state.pos.x,state.pos.y),fac=-Lec.K.gravitationalConstant*M/(r*r*r);state.vel.x+=fac*state.pos.x*dt;state.vel.y+=fac*state.pos.y*dt;state.pos.x+=state.vel.x*dt;state.pos.y+=state.vel.y*dt;state.t+=dt;let ang=Math.atan2(state.pos.y,state.pos.x),d=ang-state.prevAngle;if(d<-Math.PI)d+=Math.PI*2;if(d>Math.PI)d-=Math.PI*2;state.angle+=d;state.prevAngle=ang;if(state.points.length<sceneConfig.maxTrailPoints)state.points.push(new THREE.Vector3(state.pos.x/scale,state.pos.y/scale,0));trailGeom.setFromPoints(state.points);const rn=Math.hypot(state.pos.x,state.pos.y);if(rn<=R){state.running=false;state.crashed=true;feedback.className='feedback fail';feedback.textContent='仍被地面截住：提高横向初速度，使它下落时错过地面。';setSteps(3);const v=craft.position.clone().project(camera),rect=sim.getBoundingClientRect(),pulse=document.getElementById('pulse');pulse.style.left=((v.x+1)/2*sim.clientWidth-10)+'px';pulse.style.top=((-v.y+1)/2*sim.clientHeight-10)+'px';pulse.classList.remove('go');void pulse.offsetWidth;pulse.classList.add('go')}else if(Math.abs(state.angle)>=Math.PI*2){state.running=false;state.done=true;trailMat.color.setHex(0x42c7c2);earth.material.emissiveIntensity=1.1;craft.material.color.setHex(0xffb547);feedback.className='feedback success';feedback.textContent='重力没有消失：持续下落，已绕行 1 周。';setSteps(5)}}
speed.addEventListener('input',()=>{if(!state.running){reset(false)}});document.getElementById('throwBtn').addEventListener('click',()=>{reset(false);state.running=true;feedback.textContent='引力持续改变速度方向，轨迹开始向地球弯曲。';setSteps(2);if(reduced){let guard=0;while(state.running&&guard++<12000)step(sceneConfig.fixedStep);update()}});document.getElementById('resetBtn').addEventListener('click',()=>reset(true));
let acc=0;Deck.loop((t,dt)=>{if(state.running&&!reduced){acc+=dt*sceneConfig.timeScale;let guard=0;while(acc>=sceneConfig.fixedStep&&guard++<500){step(sceneConfig.fixedStep);acc-=sceneConfig.fixedStep;if(!state.running)break}}update()},{still:1});
document.getElementById('altStep').textContent=Lec.P.formatNumber(sceneConfig.launchAltitude/1000,{maximumFractionDigits:0})+' km';resize();reset(true);
</script>
</body></html>
