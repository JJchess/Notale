<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main{display:flex;flex-direction:column;gap:12px}
  .intro{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:42px}
  .intro .lead{max-width:920px}
  .progress-box{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:var(--fs-sec)}
  .nodes{display:flex;gap:7px}.node{width:11px;height:11px;border:2px solid var(--primary);border-radius:50%;background:var(--bg)}
  .node.done{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px rgba(255,181,71,.7)}
  .compare{--compare-cols:128px repeat(3,minmax(0,1fr));flex:1;grid-template-rows:48px 270px 60px 45px 45px}
  .compare>*{padding:8px 14px}.corner{background:var(--surface-high);border-bottom:1px solid var(--line-strong)}
  .hdr{display:flex;align-items:center;justify-content:space-between}.badge{font-size:var(--fs-label);color:var(--accent);opacity:0;transition:opacity .2s}.badge.on{opacity:1}
  .scene-cell{position:relative;padding:8px!important;border-right:1px solid var(--line);background:var(--surface-deep)}
  .scene-cell:last-of-type{border-right:0}.viewport{position:relative;width:100%;height:100%;overflow:hidden;border-radius:var(--radius-sm);background:radial-gradient(circle at 50% 25%,rgba(66,199,194,.08),transparent 55%),#071019}
  .viewport canvas{display:block;width:100%;height:100%}.scale-note{position:absolute;top:8px;right:9px;color:var(--muted);font-size:var(--fs-label);pointer-events:none}
  .launch-label{position:absolute;left:10px;bottom:8px;color:var(--primary);font-size:var(--fs-label);pointer-events:none}
  .dim{display:flex;align-items:center;justify-content:flex-end}.cell{display:flex;align-items:center;border-right:1px solid var(--line)}.cell:last-child{border-right:0}
  .speed-cell{flex-direction:column;align-items:stretch;justify-content:center;gap:3px}.speed-cell label{display:flex;justify-content:space-between;font-size:var(--fs-label);color:var(--muted)}
  input[type=range]{width:100%;height:22px}.result{font-weight:700;color:var(--primary)}.result.complete{color:var(--accent)}
  .bottom{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:46px}.instruction{font-size:var(--fs-sec);color:var(--muted)}
  .feedback{flex:1;text-align:center;font-size:var(--fs-sec);color:var(--text)}.feedback strong{color:var(--accent)}
  .finish{position:absolute;inset:0;display:none;place-items:center;background:rgba(7,16,25,.82);font-size:30px;font-weight:800;color:var(--accent);pointer-events:none}.finish.show{display:grid}
  @media(prefers-reduced-motion:reduce){*{transition-duration:0s!important}}
</style>
</head>
<body data-page="34" data-total="48">
<div id="stage"><main id="main">
  <div class="intro">
    <p class="lead">三次飞行共享同一起点、发射方向与地球引力。只改变<strong class="accent">初速度</strong>，比较轨迹如何收场。</p>
    <div class="progress-box"><span id="count">已比较 0/3</span><span class="nodes" aria-hidden="true"><i class="node"></i><i class="node"></i><i class="node"></i></span></div>
  </div>
  <section class="k-comparison compare min0" aria-label="跳跃、亚轨道与轨道飞行比较">
    <div class="corner"></div>
    <div class="hdr">跳跃 <span class="badge">已形成</span></div>
    <div class="hdr">亚轨道 <span class="badge">已形成</span></div>
    <div class="hdr">轨道 <span class="badge">已形成</span></div>

    <div class="dim">实时轨迹</div>
    <div class="scene-cell min0"><div class="viewport" id="view0"><span class="scale-note">局部放大</span><span class="launch-label">● 同一起点</span></div></div>
    <div class="scene-cell min0"><div class="viewport" id="view1"><span class="scale-note">地球曲率可见</span><span class="launch-label">● 同一起点</span></div></div>
    <div class="scene-cell min0"><div class="viewport" id="view2"><span class="scale-note">完整地球</span><span class="launch-label">● 同一起点</span></div><div class="finish" id="finish">高度不是分界线</div></div>

    <div class="dim">初速度</div>
    <div class="cell speed-cell diff"><label for="s0"><span>低</span><span>调节</span></label><input id="s0" type="range" min="6" max="28" value="10" step="1" aria-label="调节跳跃初速度"></div>
    <div class="cell speed-cell diff"><label for="s1"><span>较高</span><span>调节</span></label><input id="s1" type="range" min="28" max="86" value="38" step="1" aria-label="调节亚轨道初速度"></div>
    <div class="cell speed-cell diff"><label for="s2"><span>形成闭合轨迹</span><span>调节</span></label><input id="s2" type="range" min="86" max="110" value="90" step="1" aria-label="调节轨道初速度"></div>

    <div class="dim">轨迹</div><div class="cell">短弧，与地面相交</div><div class="cell">长弧，升高后相交</div><div class="cell">连续弯曲并闭合</div>
    <div class="dim">结果</div><div class="cell result">回到附近地面</div><div class="cell result">回到远处地面</div><div class="cell result">持续绕地球下落</div>
  </section>
  <div class="bottom">
    <p class="instruction">拖动三只速度手柄，使三条轨迹分别符合列标题。</p>
    <p class="feedback" id="feedback" aria-live="polite">看轨迹：它撞回地面，还是持续闭合？</p>
    <button id="reset" type="button">重置三次飞行</button>
  </div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/three.min.js"></script>
<script>
Lec.mount({index:34,kicker:"ORBITAL FLIGHT",title:"高度不是分界线",take:"跳跃、亚轨道和轨道飞行的区别在速度与轨迹，不在“飞得足够高”。"});
(function(){
  const R=Lec.K.earth.meanRadius, M=Lec.K.earth.mass, height=400000;
  const orbital=Lec.P.circularOrbitVelocity(M,R+height);
  const configs=[
    {el:'view0',cam:1.18,target:[15,22],start:10,scale:.055},
    {el:'view1',cam:2.7,target:[57,69],start:38,scale:.055},
    {el:'view2',cam:3.8,target:[98,102],start:90,scale:orbital/100}
  ];
  const states=[]; const complete=[false,false,false];
  const primary=new THREE.Color(0x42c7c2), accent=new THREE.Color(0xffb547);
  function make(c,i){
    const host=document.getElementById(c.el), scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(38,1,.01,20); camera.position.set(0,0,c.cam); camera.lookAt(0,0,0);
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.outputColorSpace=THREE.SRGBColorSpace; host.prepend(renderer.domElement);
    scene.add(new THREE.AmbientLight(0x91d9e0,1.5)); const light=new THREE.DirectionalLight(0xffffff,2.2);light.position.set(-2,3,4);scene.add(light);
    const earth=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),new THREE.MeshStandardMaterial({color:0x123849,roughness:.82,metalness:.08,emissive:0x06141d})); scene.add(earth);
    const ringMat=new THREE.LineDashedMaterial({color:0x42c7c2,transparent:true,opacity:.22,dashSize:.05,gapSize:.035});
    const predPts=[]; for(let a=0;a<=Math.PI*2;a+=.04)predPts.push(new THREE.Vector3(Math.cos(a)*1.064,Math.sin(a)*1.064,0));
    const pred=new THREE.Line(new THREE.BufferGeometry().setFromPoints(predPts),ringMat);pred.computeLineDistances();scene.add(pred);
    const craft=new THREE.Mesh(new THREE.ConeGeometry(.035,.11,10),new THREE.MeshStandardMaterial({color:0xffb547,emissive:0x6b3a05}));scene.add(craft);
    const pathMat=new THREE.LineBasicMaterial({color:primary}); const path=new THREE.Line(new THREE.BufferGeometry(),pathMat);scene.add(path);
    function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
    resize(); Deck.onResize(resize);
    const st={renderer,scene,camera,craft,path,pathMat,cfg:c,t:0,points:[],pulse:0}; states.push(st); resetState(i);
    return st;
  }
  function simulate(i,value){
    const st=states[i], speed=(i===2?orbital*(value/100):orbital*(value*st.cfg.scale));
    let x=R+Math.max(2,height*(i===2?1:.02)),y=0,vx=0,vy=speed; const pts=[]; let closed=false,hit=false;
    const dt=1/120, timeScale=i===0?18:i===1?100:260;
    for(let n=0;n<1800;n++){
      const r=Math.hypot(x,y), g=Lec.P.gravitationalAcceleration(M,r), h=dt*timeScale;
      vx+=(-g*x/r)*h; vy+=(-g*y/r)*h; x+=vx*h; y+=vy*h;
      pts.push(new THREE.Vector3(x/R,y/R,0));
      if(r<=R && n>4){hit=true;break} if(n>60&&Math.hypot(x-(R+height),y)<height*.12){closed=true;break}
    }
    st.points=pts; st.path.geometry.dispose();st.path.geometry=new THREE.BufferGeometry().setFromPoints(pts);
    st.hit=hit;st.closed=closed;st.t=0;st.craft.position.copy(pts[0]||new THREE.Vector3(1,0,0));
  }
  function resetState(i){if(!states[i])return;simulate(i,document.getElementById('s'+i).value)}
  configs.forEach(make);
  function update(i){
    const input=document.getElementById('s'+i),v=+input.value,c=configs[i],ok=v>=c.target[0]&&v<=c.target[1]; simulate(i,v);
    if(ok&&!complete[i]){complete[i]=true;input.value=(c.target[0]+c.target[1])/2;simulate(i,+input.value);states[i].pathMat.color.copy(accent);document.querySelectorAll('.badge')[i].classList.add('on');document.querySelectorAll('.result')[i].classList.add('complete');document.querySelectorAll('.node')[i].classList.add('done');}
    else if(!ok&&!complete[i]){input.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:220});document.getElementById('feedback').textContent='看轨迹：它是否撞回地面，还是持续闭合？'}
    const n=complete.filter(Boolean).length;document.getElementById('count').textContent='已比较 '+n+'/3';
    if(ok)document.getElementById('feedback').innerHTML='<strong>'+['短弧落回附近','长弧落回远处','横向速度使轨迹闭合'][i]+'</strong>：这一列已形成。';
    if(n===3){document.getElementById('feedback').textContent='飞得很高仍可能落地；轨道的关键是横向速度。';document.getElementById('finish').classList.add('show');setTimeout(()=>document.getElementById('finish').classList.remove('show'),1100)}
  }
  document.querySelectorAll('input[type=range]').forEach((el,i)=>el.addEventListener('input',()=>update(i)));
  document.getElementById('reset').addEventListener('click',()=>{complete.fill(false);configs.forEach((c,i)=>{const el=document.getElementById('s'+i);el.value=c.start;states[i].pathMat.color.copy(primary);document.querySelectorAll('.badge')[i].classList.remove('on');document.querySelectorAll('.result')[i].classList.remove('complete');document.querySelectorAll('.node')[i].classList.remove('done');simulate(i,c.start)});document.getElementById('count').textContent='已比较 0/3';document.getElementById('feedback').textContent='看轨迹：它撞回地面，还是持续闭合？'});
  let last=0,acc=0;function tick(ms){const dt=Math.min(.05,(ms-last)/1000||0);last=ms;acc+=dt;states.forEach(st=>{if(!Deck.reduced()&&st.points.length){st.t=(st.t+dt*.18)%1;const p=st.points[Math.min(st.points.length-1,Math.floor(st.t*st.points.length))];st.craft.position.copy(p);st.craft.rotation.z=Math.atan2(p.y,p.x)-Math.PI/2}st.renderer.render(st.scene,st.camera)})}
  states.forEach(st=>st.renderer.setAnimationLoop(tick));
})();
</script>
</body></html>
