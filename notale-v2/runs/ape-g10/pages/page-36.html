<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main{display:flex;flex-direction:column;gap:16px}
  .challenge-head{height:38px;display:flex;align-items:center;justify-content:space-between}
  .rounds{display:flex;gap:10px;align-items:center;font:700 var(--fs-label)/1.4 var(--font-mono)}
  .gate-dot{padding:5px 12px;border:1px solid var(--line-strong);border-radius:999px;color:var(--muted)}
  .gate-dot.active{color:var(--accent);border-color:var(--accent)} .gate-dot.done{color:var(--primary);border-color:var(--primary)}
  .k-process{--process-cols:5;height:128px;gap:24px}
  .k-process .step{padding:43px 11px 10px}.k-process .axis{top:21px}.k-process .step::before{top:13px;left:14px;width:13px;height:13px}
  .k-process .arw{right:-26px;width:24px}.step-name{font-size:var(--fs-label);color:var(--muted);line-height:1.35}.step-val{margin-top:4px;font:700 var(--fs-sec)/1.35 var(--font-mono);color:var(--text)}
  .game{height:422px;display:flex;gap:18px;min-height:0}
  .launch-well{position:relative;flex:0 0 970px;width:970px;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-md);background:radial-gradient(ellipse at 82% 20%,rgba(66,199,194,.12),transparent 37%),linear-gradient(145deg,var(--surface-deep),var(--surface))}
  .well-schema{position:absolute;left:18px;top:14px;width:930px;height:390px;pointer-events:none}.well-schema path,.well-schema line{fill:none;stroke:var(--primary-line);stroke-width:2}.well-schema .flow{stroke:var(--accent);stroke-dasharray:10 8}.well-schema text{fill:var(--muted);font:15px var(--font-sans)}
  .orbit-arc{position:absolute;width:350px;height:260px;border:2px solid var(--primary-line);border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;right:55px;top:18px;transform:rotate(-8deg)}
  .gates{position:absolute;right:28px;top:28px;width:250px;height:210px;background:rgba(66,199,194,.035);border:1px solid var(--line);border-radius:50% 50% 20px 20px}.speed-gate{position:absolute;right:0;box-sizing:border-box;width:150px;height:70px;border:3px solid var(--line-strong);border-left:0;border-radius:0 80px 80px 0;color:var(--muted);font:700 var(--fs-label)/1.3 var(--font-mono);padding:22px 18px;text-align:right}
  .speed-gate:nth-child(1){top:116px;right:86px}.speed-gate:nth-child(2){top:58px;right:38px}.speed-gate:nth-child(3){top:0}.speed-gate.active{border-color:var(--accent);color:var(--accent)}.speed-gate.done{border-color:var(--primary);color:var(--primary)}
  .rocket-zone{position:absolute;left:24px;right:295px;top:18px;bottom:16px;display:flex;align-items:flex-end;gap:22px;padding:14px;background:linear-gradient(90deg,rgba(23,41,54,.72),rgba(16,29,40,.28));border:1px solid var(--line);border-radius:var(--radius-md)}
  .rocket-wrap{width:160px;height:310px;display:flex;align-items:flex-end;justify-content:center;transition:transform 500ms cubic-bezier(.2,.8,.2,1)}
  .rocket{position:relative;width:92px;height:270px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.4))}.nose{height:55px;background:var(--surface-high);clip-path:polygon(50% 0,100% 100%,0 100%);border-bottom:2px solid var(--primary)}
  .payload,.structure,.fuel{display:grid;place-items:center;width:92px;border:1px solid var(--line-strong);font-size:var(--fs-label);font-weight:700}.payload{height:58px;background:var(--surface-high)}.structure{height:52px;background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 8px,var(--surface-high) 8px,var(--surface-high) 10px)}.fuel{height:105px;background:linear-gradient(0deg,var(--accent-soft),rgba(255,181,71,.05));color:var(--accent);transition:height 180ms ease-out}.nozzle{margin:auto;width:55px;height:24px;background:var(--muted);clip-path:polygon(16% 0,84% 0,100% 100%,0 100%)}
  .mass-column{width:82px;height:305px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.bar-shell{height:240px;width:54px;border:1px solid var(--line-strong);display:flex;align-items:flex-end}.bar-fill{width:100%;height:10%;background:linear-gradient(var(--accent),var(--primary));transition:height 180ms ease-out}.mass-label{text-align:center;font:700 var(--fs-tick)/1.35 var(--font-mono)}
  .history{display:flex;align-items:flex-end;gap:14px;height:305px}.history-item{width:72px;text-align:center}.mini-bar{width:38px;margin:auto;background:var(--primary);min-height:15px}.history-item.pending .mini-bar{height:150px!important;background:repeating-linear-gradient(0deg,transparent,transparent 8px,var(--line-strong) 8px,var(--line-strong) 10px);border:1px dashed var(--line-strong)}.history-item.pending .mini-rocket{border-color:var(--faint)}.mini-rocket{margin:6px auto;width:18px;height:46px;border:1px solid var(--primary);border-radius:50% 50% 4px 4px}.history-item .tick{color:var(--muted)}
  .controls{box-sizing:border-box;width:420px;flex:0 0 420px;display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md)}.controls .panel{padding:16px}.ctl-stack{display:flex;flex-direction:column;gap:8px}.ctl-stack label{font-size:var(--fs-sec);font-weight:700}.ctl-stack input{width:100%}.range-ends{display:flex;justify-content:space-between;color:var(--muted);font:var(--fs-tick)/1.35 var(--font-mono)}
  .metrics{display:flex;gap:8px}.metric{flex:1;padding:10px;background:var(--surface-deep);border:1px solid var(--line);border-radius:var(--radius-sm)}.metric .label{color:var(--muted)}.metric strong{display:block;margin-top:3px;font:700 var(--fs-sec)/1.35 var(--font-mono);color:var(--primary)}
  .actions{display:flex;gap:10px}.actions button{flex:1;font-size:var(--fs-sec)}#ignite{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .feedback{min-height:72px;padding:12px 14px;border-left:4px solid var(--accent);background:var(--accent-soft);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .principle{font-size:var(--fs-sec);line-height:var(--lh-sec);color:#D7E6E9}.model-note{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
  .success .rocket-wrap{transform:translate(210px,-105px) rotate(10deg)}.fail .rocket-wrap{animation:shake .42s ease-out}.over .rocket-wrap{animation:nudge .4s ease-out}
  @keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}@keyframes nudge{50%{transform:translateY(-18px)}}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body data-page="36" data-total="48">
<div id="stage"><main id="main">
  <div class="challenge-head">
    <p class="lead">同一副发动机，要为越来越高的 Δv 门槛装多少推进剂？</p>
    <div class="rounds" aria-label="挑战进度"><span id="roundText">质量比挑战 1 / 3</span><span class="gate-dot active">3 km/s</span><span class="gate-dot">6 km/s</span><span class="gate-dot">9 km/s</span></div>
  </div>
  <section class="k-process" aria-label="火箭质量比计算过程">
    <div class="axis"></div>
    <div class="step is-current"><div class="step-name">任务要求 Δv</div><div class="step-val" id="targetOut"></div><span class="arw"></span></div>
    <div class="step"><div class="step-name">排气速度</div><div class="step-val" id="exhaustOut"></div><span class="arw"></span></div>
    <div class="step"><div class="step-name">所需质量比</div><div class="step-val" id="ratioOut"></div><span class="arw"></span></div>
    <div class="step"><div class="step-name">推进剂装载</div><div class="step-val" id="propOut"></div><span class="arw"></span></div>
    <div class="step"><div class="step-name">达到速度门</div><div class="step-val" id="dvOut"></div></div>
  </section>
  <section class="game">
    <div class="launch-well min0" aria-label="火箭、速度门与质量柱">
      <svg class="well-schema" viewBox="0 0 900 380" aria-hidden="true"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" style="fill:var(--accent);stroke:none"/></marker></defs><path d="M42 332 C170 280 240 230 320 138"/><path d="M320 138 C465 20 670 22 854 96"/><line class="flow" x1="122" y1="304" x2="312" y2="150" marker-end="url(#ah)"/><line x1="358" y1="346" x2="358" y2="48"/><line x1="350" y1="346" x2="366" y2="346"/><line x1="350" y1="246" x2="366" y2="246"/><line x1="350" y1="146" x2="366" y2="146"/><text x="44" y="358">推进剂仓 → 喷口 → Δv</text><text x="374" y="64">初始总质量尺度</text></svg>
      <div class="orbit-arc"></div>
      <div class="gates"><div class="speed-gate active">3 km/s 门</div><div class="speed-gate">6 km/s 门</div><div class="speed-gate">9 km/s 门</div></div>
      <div class="rocket-zone">
        <div class="rocket-wrap"><div class="rocket"><div class="nose"></div><div class="payload">载荷</div><div class="structure">空结构</div><div class="fuel" id="fuelTank">推进剂</div><div class="nozzle"></div></div></div>
        <div class="mass-column"><div class="bar-shell"><div class="bar-fill" id="massBar"></div></div><div class="mass-label" id="massLabel"></div><div class="label muted">初始总质量</div></div>
        <div class="history" id="history" aria-label="已完成轮次的质量对比"></div>
      </div>
    </div>
    <aside class="controls min0">
      <div class="panel ctl-stack">
        <label for="fuel">装入推进剂</label>
        <input id="fuel" type="range" min="0" max="19000" step="10" value="1000" aria-label="推进剂质量，千克">
        <div class="range-ends"><span>0 kg</span><span>19,000 kg</span></div>
      </div>
      <div class="metrics">
        <div class="metric"><span class="label">燃尽后质量</span><strong id="dryOut"></strong></div>
        <div class="metric"><span class="label">推进剂比例</span><strong id="fractionOut"></strong></div>
      </div>
      <div class="actions"><button id="ignite" type="button">点火验证</button><button id="reset" type="button">重新挑战</button></div>
      <div id="feedback" class="feedback" role="status" aria-live="polite">拖动装载杆，让可实现 Δv 接近本轮门槛，再点火。</div>
      <p class="principle">火箭起飞时，不只要推载荷，也要推尚未烧掉的推进剂。目标 Δv 每增加同样一段，所需初始总质量会越来越快地膨胀。</p>
      <p class="model-note">理想火箭模型：忽略大气阻力、重力损失与发动机变化。</p>
    </aside>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:36,kicker:"ORBITAL ENGINEERING",title:"燃料也要被燃料推动",take:"火箭必须同时加速载荷和尚未烧掉的燃料，因此质量代价呈指数增长。"});
const targets=[3000,6000,9000], payload=1000, structure=500, finalMass=payload+structure, isp=350;
const ve=Lec.P.exhaustVelocityFromSpecificImpulse(isp);
const state={round:0,locked:[],complete:false};
const $=s=>document.querySelector(s), fuel=$('#fuel'), well=$('.launch-well');
function num(v){return Lec.P.formatNumber(v,{maximumFractionDigits:0});}
function snapshot(){const prop=Number(fuel.value), initial=finalMass+prop, dv=Lec.P.rocketDeltaV(ve,initial,finalMass);return{prop,initial,dv,frac:Lec.P.propellantFraction(initial,finalMass),need:Lec.P.rocketMassRatio(targets[state.round],ve)};}
function render(){const s=snapshot(), target=targets[state.round];$('#targetOut').textContent=(target/1000).toFixed(1)+' km/s';$('#exhaustOut').textContent=(ve/1000).toFixed(2)+' km/s';$('#ratioOut').textContent=s.need.toFixed(2)+' : 1';$('#propOut').textContent=num(s.prop)+' kg';$('#dvOut').textContent=(s.dv/1000).toFixed(2)+' km/s';$('#dryOut').textContent=num(finalMass)+' kg';$('#fractionOut').textContent=(s.frac*100).toFixed(1)+'%';$('#massLabel').textContent=num(s.initial)+' kg';$('#massBar').style.height=Math.min(100,8+s.initial/210)+'%';$('#fuelTank').style.height=(48+Math.min(92,s.prop/210))+'px';}
function setRound(){document.querySelectorAll('.gate-dot,.speed-gate').forEach((el,i)=>{el.classList.toggle('done',i<state.round);el.classList.toggle('active',i===state.round&&!state.complete)});$('#roundText').textContent=state.complete?'挑战完成 · 3 / 3':'质量比挑战 '+(state.round+1)+' / 3';document.querySelectorAll('.k-process .step').forEach(x=>x.classList.toggle('is-current',!state.complete));render();}
function history(){const max=Math.max(...state.locked.map(x=>x.initial),1);$('#history').innerHTML=targets.map((t,i)=>{const x=state.locked[i];return x?'<div class="history-item"><div class="mini-bar" style="height:'+(40+x.initial/max*150)+'px"></div><div class="mini-rocket"></div><div class="tick">'+(t/1000)+' km/s</div><div class="tick">'+num(x.initial)+' kg</div></div>':'<div class="history-item pending"><div class="mini-bar"></div><div class="mini-rocket"></div><div class="tick">'+(t/1000)+' km/s</div><div class="tick">待锁定</div></div>'}).join('');}
fuel.addEventListener('input',()=>{well.className='launch-well min0';render();});
$('#ignite').addEventListener('click',()=>{if(state.complete)return;const s=snapshot(), target=targets[state.round], over=(s.dv-target)/target;well.className='launch-well min0';void well.offsetWidth;if(s.dv<target){well.classList.add('fail');$('#feedback').textContent='还差 '+num(target-s.dv)+' m/s：这部分推进剂也必须被一起加速。';}else if(over>.05){well.classList.add('over');$('#feedback').textContent='已达标，但装载超过所需质量 5%，请减少推进剂。';}else{well.classList.add('success');state.locked.push(s);history();$('#feedback').textContent='穿过速度门：本轮初始总质量已锁入对比区。';setTimeout(()=>{well.className='launch-well min0';state.round++;if(state.round===targets.length){state.complete=true;$('#feedback').textContent='一样的 Δv 增量，更大的质量增量。三轮质量柱显示指数代价。';fuel.disabled=true;$('#ignite').disabled=true;}else{fuel.value=Math.round(finalMass*(Lec.P.rocketMassRatio(targets[state.round],ve)-1)*.86/10)*10;}setRound();},Deck.reduced()?0:650);}});
$('#reset').addEventListener('click',()=>{state.round=0;state.locked=[];state.complete=false;fuel.disabled=false;$('#ignite').disabled=false;fuel.value=1000;well.className='launch-well min0';$('#history').innerHTML='';$('#feedback').textContent='拖动装载杆，让可实现 Δv 接近本轮门槛，再点火。';setRound();fuel.focus();});
history();setRound();
</script>
</body></html>
