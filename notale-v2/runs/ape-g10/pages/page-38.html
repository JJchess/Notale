<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .mission-page{position:relative;width:100%;height:100%;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface-deep)}
  .mission-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.18;filter:grayscale(.45) contrast(1.2)}
  .mission-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,16,25,.9),rgba(7,16,25,.52) 48%,rgba(7,16,25,.88)),linear-gradient(0deg,rgba(7,16,25,.9),transparent 42%)}
  .topbar{position:absolute;z-index:4;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  .prompt{max-width:650px;padding:12px 16px;background:rgba(11,23,33,.88);border-left:4px solid var(--accent);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .progressbox{padding:10px 14px;background:rgba(11,23,33,.9);border:1px solid var(--primary-line);border-radius:var(--radius-sm);font:700 var(--fs-sec)/1.4 var(--font-mono)}
  .network{position:absolute;inset:0;z-index:2;width:100%;height:100%}
  .orbit-path{fill:none;stroke:var(--primary-line);stroke-width:1.5;stroke-dasharray:9 12}
  .link{stroke:rgba(156,176,185,.28);stroke-width:1.5}
  .link.active{stroke:var(--primary);stroke-width:3;filter:drop-shadow(0 0 5px rgba(66,199,194,.8))}
  .node{cursor:pointer;outline:none}
  .node circle{fill:var(--surface-high);stroke:var(--primary);stroke-width:2}
  .node text{fill:var(--text);font:700 16px var(--font-sans);text-anchor:middle;pointer-events:none}
  .node .sub{fill:var(--muted);font:14px var(--font-sans)}
  .node.current circle{stroke:var(--accent);stroke-width:4;filter:drop-shadow(0 0 8px rgba(255,181,71,.75))}
  .node.done circle{stroke:var(--primary);stroke-width:4;filter:drop-shadow(0 0 8px rgba(66,199,194,.7))}
  .node:focus-visible circle{stroke:var(--focus);stroke-width:5}
  .core circle{fill:#09151e;stroke:var(--accent);stroke-width:3}
  .core text{font-size:19px}
  .detail{position:absolute;z-index:5;right:22px;bottom:22px;width:370px;min-height:190px;padding:18px 20px;background:rgba(16,29,40,.96);border:1px solid var(--primary-line);border-radius:var(--radius-md);box-shadow:var(--shadow)}
  .detail h2{color:var(--accent);margin:0 0 8px;font-size:var(--fs-h2)}
  .detail dl{margin:0;display:grid;grid-template-columns:76px 1fr;gap:7px 10px;font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .detail dt{color:var(--muted);font-weight:700}.detail dd{margin:0}
  .detail[hidden]{display:none}
  .legend{position:absolute;z-index:4;left:22px;bottom:112px;display:flex;gap:18px;color:var(--muted);font-size:var(--fs-label)}
  .legend span::before{content:"";display:inline-block;width:16px;height:2px;margin-right:7px;vertical-align:.3em;background:var(--primary)}
  .legend span:first-child::before{width:10px;height:10px;border:2px solid var(--primary);border-radius:50%;background:transparent;vertical-align:-1px}
  .bottomline{position:absolute;z-index:4;left:22px;bottom:22px;width:660px;padding:14px 18px;background:rgba(11,23,33,.9);border-top:2px solid var(--primary);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .bottomline strong{color:var(--text)}
  .reset{position:absolute;z-index:6;right:22px;top:72px;font-size:var(--fs-sec)}
  .status-done{color:var(--accent);font-weight:750}
  @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .node.wrong{animation:shake 160ms linear}
  @media (prefers-reduced-motion:reduce){.node.wrong{animation:none}.link{transition:none}}
</style>
</head>

  var step=0, done=new Set(), prompt=document.getElementById('prompt'), progress=document.getElementById('progress'), detail=document.getElementById('detail'), reset=document.getElementById('reset');
  function updateCurrent(){node.classed('current',function(d){return d.id===domains[step]?.id}).classed('done',function(d){return done.has(d.id)});if(step<domains.length)prompt.textContent='先找出负责“'+domains[step].output+'”的团队。'}
  function activate(d,el){if(d.kind!=='primary')return;if(d.id!==domains[step].id){el.classList.remove('wrong');void el.getBoundingClientRect();el.classList.add('wrong');prompt.textContent='先找出负责“'+domains[step].output+'”的团队；注意它交出的结果。';return}done.add(d.id);document.getElementById('detailTitle').textContent=d.name+'｜专业接口';document.getElementById('detailOutput').textContent=d.output;document.getElementById('detailRole').textContent=d.role;document.getElementById('detailDeps').textContent=d.deps.join('、');detail.hidden=false;link.classed('active',function(l){return l.source.id===d.id||l.target.id===d.id});step++;progress.textContent='协作网已展开 '+step+' / 6';if(step===domains.length){prompt.innerHTML='<span class="status-done">任务可执行：6 个专业域已接通</span>';reset.hidden=false;simulation.alpha(.25).restart();setTimeout(function(){simulation.stop()},Deck.reduced()?0:500)}updateCurrent()}
  node.on('click',function(e,d){activate(d,this)}).on('keydown',function(e,d){if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(d,this)}});
  reset.addEventListener('click',function(){step=0;done.clear();detail.hidden=true;reset.hidden=true;progress.textContent='协作网已展开 0 / 6';link.classed('active',false);updateCurrent();node.filter(function(d){return d.kind==='primary'}).node().focus()});
  updateCurrent();
})();
</script>
</body>
</html>
