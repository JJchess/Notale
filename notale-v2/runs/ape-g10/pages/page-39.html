<script src="assets/base.js"></script><script src="assets/lec.js"></script><script src="assets/lib/gsap.min.js"></script>
<script>
Lec.mount({index:39,kicker:"MISSION CHAIN",title:"登月不是一步，而是七步相扣",take:"登月是一连串必须按顺序成功的发射、转移、着陆、起飞和返回事件。"});
const events=[
 {id:1,title:'发射：把飞船送入地球轨道',date:'1969-07-16'},
 {id:2,title:'地月转移：点火驶向月球',date:'1969-07-16'},
 {id:3,title:'进入月球轨道',date:'1969-07-19'},
 {id:4,title:'分离并着陆',date:'1969-07-20'},
 {id:5,title:'月面起飞并会合',date:'1969-07-21'},
 {id:6,title:'地球转移：离开月球',date:'1969-07-21'},
 {id:7,title:'再入并溅落',date:'1969-07-24'}
];
const order=[4,1,6,3,7,2,5], tray=document.getElementById('tray'), select=document.getElementById('card-select');let completed=0;
const reduced=Deck.reduced();
const missionTL=gsap.timeline({paused:true,defaults:{duration:reduced?0.01:0.45,ease:'power2.out'}});
events.forEach((e,i)=>{missionTL.addLabel('step-'+(i+1));missionTL.to('[data-step="'+(i+1)+'"]',{boxShadow:'0 0 22px rgba(255,181,71,.28)'},'step-'+(i+1));});
function renderTray(){tray.innerHTML='';select.innerHTML='';order.forEach(id=>{const e=events[id-1],d=document.createElement('div');d.className='event-card'+(id<=completed?' used':'');d.textContent=e.title;d.draggable=id>completed;d.dataset.id=id;d.addEventListener('dragstart',x=>x.dataTransfer.setData('text/plain',id));tray.appendChild(d);if(id>completed){const o=document.createElement('option');o.value=id;o.textContent=e.title;select.appendChild(o);}});}
function updatePhoto(){let key=completed<3?'launch':completed<6?'moon':'splash';document.querySelectorAll('.mission-photo img').forEach(x=>x.classList.toggle('show',x.id==='photo-'+key));const labels=key==='launch'?['地球出发','1969-07-16']:key==='moon'?['月球阶段','1969-07-20—21']:['返回地球','1969-07-24'];document.getElementById('photo-phase').textContent=labels[0];document.getElementById('photo-date').textContent='UTC '+labels[1];}
function attempt(id,source){const need=completed+1;if(Number(id)!==need){const card=tray.querySelector('[data-id="'+id+'"]');if(card){card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake','bad');setTimeout(()=>card.classList.remove('bad'),500);}document.getElementById('status').textContent='这一步还缺少前置条件：先完成「'+events[need-1].title+'」。';return;}completed++;const step=document.querySelector('[data-step="'+completed+'"]');step.classList.remove('is-current');step.classList.add('is-done');step.querySelector('.slot-title').textContent=events[completed-1].title;step.querySelector('.date').textContent=events[completed-1].date;if(completed<7)document.querySelector('[data-step="'+(completed+1)+'"]').classList.add('is-current');document.getElementById('counter').textContent=completed===7?'链条完整：7 / 7':'任务链 '+completed+' / 7';document.getElementById('status').innerHTML=completed===7?'<strong>整条链由飞船系统、地面团队与操作人员共同维持。</strong>':'已接通；下一事件必须以前一步的输出为条件。';missionTL.tweenTo('step-'+completed);updatePhoto();renderTray();}
document.querySelectorAll('.step').forEach(s=>{s.addEventListener('dragover',e=>e.preventDefault());s.addEventListener('drop',e=>{e.preventDefault();attempt(e.dataTransfer.getData('text/plain'),'drag');});});
document.getElementById('place').addEventListener('click',()=>attempt(select.value,'keyboard'));
document.getElementById('reset').addEventListener('click',()=>{completed=0;missionTL.pause(0);document.querySelectorAll('.step').forEach((s,i)=>{s.classList.remove('is-done','is-current');if(!i)s.classList.add('is-current');s.querySelector('.slot-title').textContent=i?'等待前置条件':'等待事件';s.querySelector('.date').textContent='';s.style.boxShadow='';});document.getElementById('counter').textContent='任务链 0 / 7';document.getElementById('status').textContent='任何一环失败，后续步骤都无法按原计划发生。';updatePhoto();renderTray();});
renderTray();
if(!reduced)gsap.from('.mission-photo',{opacity:0,duration:.5});
</script></body></html>
