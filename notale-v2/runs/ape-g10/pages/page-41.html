<style>
  .earth-scene{position:relative;width:100%;height:100%;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface-deep);box-shadow:var(--shadow)}
  .scene-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 48%;opacity:.72;filter:saturate(.82) contrast(1.08)}
  .scene-wash{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,16,25,.9) 0%,rgba(7,16,25,.18) 29%,rgba(7,16,25,.08) 70%,rgba(7,16,25,.9) 100%),linear-gradient(180deg,rgba(7,16,25,.35),transparent 40%,rgba(7,16,25,.2));pointer-events:none}
  .scene-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .tether{fill:none;stroke:var(--primary);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:7 8;filter:drop-shadow(0 0 6px rgba(66,199,194,.8));animation:connect 1.2s ease-out both}
  .tether:nth-of-type(2){animation-delay:.18s}.tether:nth-of-type(3){animation-delay:.36s}.tether:nth-of-type(4){animation-delay:.54s}
  .node{fill:var(--accent);stroke:#fff1cf;stroke-width:2;filter:drop-shadow(0 0 8px rgba(255,181,71,.9))}
  @keyframes connect{from{stroke-dashoffset:160;opacity:0}to{stroke-dashoffset:0;opacity:1}}
  .opening{position:absolute;top:22px;left:32px;width:370px;padding-left:18px;border-left:4px solid var(--primary);z-index:3}
  .opening .lead{font-weight:720;color:var(--text)}
  .opening .sec{margin-top:8px;color:var(--muted)}
  .earth-tag{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;padding:7px 14px;color:#d9fffc;background:rgba(7,16,25,.82);border:1px solid var(--primary-line);border-radius:999px;font-size:var(--fs-label);font-weight:700;letter-spacing:.04em}
  .body-tag{position:absolute;left:50%;top:28px;transform:translateX(-50%);z-index:3;color:var(--muted);font-size:var(--fs-label);font-family:var(--font-mono);letter-spacing:.08em}
  .dependencies{--enum-cols:1;position:absolute;inset:0;display:block;z-index:4}
  .dependencies .it{position:absolute;width:322px;padding:14px 16px;background:rgba(11,23,33,.92);backdrop-filter:blur(6px);border-top-width:3px;opacity:0;animation:labelIn .45s ease-out forwards}
  .dependencies .it h2{font-size:var(--fs-h2);color:var(--accent);margin:0 0 4px}
  .dependencies .it p{font-size:var(--fs-sec);line-height:var(--lh-sec);color:#d7e6e9}
  .connects{display:block;margin-top:5px;color:var(--primary);font-size:var(--fs-label);line-height:1.4;font-family:var(--font-mono)}
  .enum-label{position:absolute;top:20px;right:32px;z-index:5;color:var(--primary);font-size:var(--fs-label);font-family:var(--font-mono);letter-spacing:.08em}
  .origin-note{position:absolute;left:50%;bottom:45px;transform:translateX(-50%);z-index:4;color:var(--muted);font-size:var(--fs-label)}
  .dep-pressure{left:30px;top:196px;animation-delay:.55s!important}.dep-gas{right:30px;top:108px;animation-delay:.73s!important}.dep-temp{right:30px;top:286px;animation-delay:.91s!important}.dep-food{left:30px;top:408px;animation-delay:1.09s!important}
  .tagline{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);z-index:4;width:530px;text-align:center;padding:11px 18px;background:rgba(7,16,25,.88);border:1px solid var(--line-strong);border-radius:var(--radius-sm);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  @keyframes labelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.tether,.dependencies .it{animation:none;opacity:1}}
</style>
