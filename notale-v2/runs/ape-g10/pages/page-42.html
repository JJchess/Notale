<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main{display:flex;flex-direction:column;gap:12px}
  .brief{height:54px;display:flex;align-items:center;justify-content:space-between;gap:24px}
  .brief p{font-size:var(--fs-body);line-height:var(--lh-copy);max-width:920px}
  .legend{font-size:var(--fs-label);color:var(--muted);white-space:nowrap}
  .legend b{color:var(--primary);font-weight:700}
  .life-table{--compare-cols:170px 540px minmax(0,1fr);height:472px;grid-template-rows:52px repeat(4,104px);overflow:visible}
  .life-table>*{padding:10px 16px}
  .life-table .dim{background:linear-gradient(90deg,var(--surface-high),var(--surface))}
  .life-table .hdr{display:flex;align-items:center;font-size:var(--fs-h2)}
  .life-table .dim{display:flex;flex-direction:column;justify-content:center;text-align:left;gap:3px;border-right:1px solid var(--line)}
  .dim strong{font-size:var(--fs-body);color:var(--text)}
  .dim span{font-size:var(--fs-label);color:var(--muted);font-weight:500}
  .actuator{position:relative;display:grid;grid-template-columns:118px 1fr 72px;align-items:center;gap:14px;border-right:1px solid var(--line);background:linear-gradient(180deg,#1A3040,#10212D 52%,#0A151E);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -3px 0 rgba(0,0,0,.28)}
  .actuator label{font-size:var(--fs-sec);font-weight:700;color:#D4E2E5}
  .actuator input{width:100%;height:44px;padding:0 4px;background:linear-gradient(180deg,#1A2A35,#071019);border:1px solid var(--line-strong);border-radius:22px;box-shadow:inset 0 4px 9px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.08)}
  .lever-value{font-family:var(--font-mono);font-size:var(--fs-sec);text-align:right;color:var(--accent)}
  .pipe{position:absolute;right:-18px;top:50%;width:36px;height:4px;z-index:3;background:var(--primary-line);box-shadow:0 0 8px rgba(66,199,194,.22)}
  .pipe::after{content:"→";position:absolute;right:-3px;top:-13px;color:var(--primary);font-size:18px}
  .actuator.bad .pipe{background:var(--accent);animation:pulse .65s ease-in-out infinite alternate}
  .instrument{position:relative;display:grid;grid-template-columns:92px 150px 1fr;align-items:center;gap:16px;background:linear-gradient(180deg,#172936,#0C1A24);box-shadow:inset 0 2px 8px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.09);border-left:3px solid var(--primary)}
  .instrument.bad{border-left-color:var(--accent);background:linear-gradient(90deg,var(--accent-soft),#09151E);animation:shake .24s linear 1}
  .instrument.good{border-left-color:var(--primary)}
  .instrument>.scope{font-size:var(--fs-label);font-weight:700;color:var(--muted);letter-spacing:.06em}
  .reading strong{display:block;font-family:var(--font-mono);font-size:var(--fs-h2);line-height:1.2;color:var(--text)}
  .reading span{font-size:var(--fs-label);color:var(--muted)}
  .gauge{display:flex;flex-direction:column;gap:7px;min-width:0}
  .track{position:relative;height:42px;border-radius:9px;background:repeating-linear-gradient(90deg,transparent 0,transparent 9%,rgba(190,222,226,.12) 9%,rgba(190,222,226,.12) 10%),#050B10;border:1px solid var(--line-strong);box-shadow:inset 0 4px 10px rgba(0,0,0,.75)}
  .band{position:absolute;top:4px;bottom:4px;border-radius:6px;background:var(--primary-soft);border:1px solid var(--primary-line)}
  .needle{position:absolute;top:-3px;width:5px;height:48px;margin-left:-2px;background:var(--accent);box-shadow:0 0 9px rgba(255,181,71,.7);transition:left 180ms ease-out}
  .feedback{font-size:var(--fs-sec);line-height:1.4;color:#C8D7DB;white-space:normal}
  .feedback.ok{color:var(--primary)}
  .mission{height:70px;display:flex;align-items:center;gap:18px;padding:0 16px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-deep)}
  .mission .count{font-size:var(--fs-body);font-weight:750;min-width:150px}
  .timer{font-family:var(--font-mono);font-size:var(--fs-h2);color:var(--accent);min-width:188px}
  .status{flex:1;font-size:var(--fs-sec);line-height:1.4;color:var(--muted)}
  .status.complete{color:var(--primary);font-weight:700}
  #reset{font-size:var(--fs-sec);min-width:110px;background:linear-gradient(180deg,#213746,#10212D);box-shadow:0 5px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.13),inset 0 -2px 0 rgba(0,0,0,.35)}
  #reset:active{transform:translateY(1px);box-shadow:inset 0 4px 8px rgba(0,0,0,.45)}
  @keyframes pulse{to{transform:scaleX(.72);filter:brightness(1.5)}}
  @keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  @media(prefers-reduced-motion:reduce){.pipe,.instrument{animation:none!important}.needle{transition:none}}
</style>
</head>
<body data-page="42" data-total="48">
<div id="stage">
<main id="main">
  <section class="brief" aria-label="任务说明">
    <p>舱内环境不是空白背景，而是机器持续重建的一小块地球条件。调节四个控制杆，让四项同时保持在教学窗口内。</p>
    <div class="legend"><b>青色</b>＝窗口内　<span class="accent">橙色</span>＝需调节</div>
  </section>

  <section class="k-comparison life-table" aria-label="生命保障闭环控制比较">
    <div class="hdr">条件</div><div class="hdr">闭环控制中</div><div class="hdr">控制偏离后</div>

    <div class="dim"><strong>总压力</strong><span>70–105 kPa</span></div>
    <div class="actuator" data-key="pressure">补压阀<input id="pressure" type="range" min="0" max="100" value="30" aria-label="补压控制杆"><output class="lever-value">30%</output><i class="pipe"></i></div>
    <div class="instrument" data-key="pressure">独立仪表<div class="reading"><strong id="pressure-read">—</strong><span>kPa　<span id="pressure-dir">—</span></span></div><div class="gauge"><div class="track"><i class="band"></i><i class="needle"></i></div><div class="feedback" aria-live="polite">正在读取</div></div></div>

    <div class="dim"><strong>氧气分压</strong><span>18–23 kPa</span></div>
    <div class="actuator" data-key="oxygen">供氧阀<input id="oxygen" type="range" min="0" max="100" value="25" aria-label="供氧控制杆"><output class="lever-value">25%</output><i class="pipe"></i></div>
    <div class="instrument" data-key="oxygen">独立仪表<div class="reading"><strong id="oxygen-read">—</strong><span>kPa（分压）　<span id="oxygen-dir">—</span></span></div><div class="gauge"><div class="track"><i class="band"></i><i class="needle"></i></div><div class="feedback" aria-live="polite">正在读取</div></div></div>

    <div class="dim"><strong>温度</strong><span>18–27 °C</span></div>
    <div class="actuator" data-key="temperature">冷热交换<input id="temperature" type="range" min="0" max="100" value="85" aria-label="冷热交换控制杆"><output class="lever-value">85%</output><i class="pipe"></i></div>
    <div class="instrument" data-key="temperature">独立仪表<div class="reading"><strong id="temperature-read">—</strong><span>°C　<span id="temperature-dir">—</span></span></div><div class="gauge"><div class="track"><i class="band"></i><i class="needle"></i></div><div class="feedback" aria-live="polite">正在读取</div></div></div>

    <div class="dim"><strong>二氧化碳</strong><span>≤0.5%</span></div>
    <div class="actuator" data-key="carbonDioxide">CO₂ 吸收<input id="carbonDioxide" type="range" min="0" max="100" value="20" aria-label="二氧化碳吸收控制杆"><output class="lever-value">20%</output><i class="pipe"></i></div>
    <div class="instrument" data-key="carbonDioxide">独立仪表<div class="reading"><strong id="carbonDioxide-read">—</strong><span>%　<span id="carbonDioxide-dir">—</span></span></div><div class="gauge"><div class="track"><i class="band"></i><i class="needle"></i></div><div class="feedback" aria-live="polite">正在读取</div></div></div>
  </section>

  <section class="mission" aria-label="任务进度">
    <div class="count" id="count">四项达标 0/4</div>
    <div class="timer" id="timer">稳定计时 0/20 秒</div>
    <div class="status" id="status">目标带是本页教学窗口，不是所有任务的统一标准。</div>
    <button id="reset" type="button">一键重置</button>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:42,kicker:"EARTH, REBUILT",title:"把地球装进舱内",take:"宇航员依赖压力、氧气、温度与二氧化碳控制；任何一项都不是背景条件。"});
const TARGETS={pressure:{min:70,max:105,unit:"kPa"},oxygen:{min:18,max:23,unit:"kPa（分压）"},temperature:{min:18,max:27,unit:"°C"},carbonDioxide:{min:0,max:0.5,unit:"%"}};
const WIN={stableSeconds:20};
const ranges={pressure:[55,115],oxygen:[14,27],temperature:[14,32],carbonDioxide:[0,1.2]};
const labels={
 pressure:{low:"总压力过低：提高补压",high:"总压力过高：停止继续增压",ok:"压力在窗口内"},
 oxygen:{low:"氧气分压过低：提高供氧",high:"氧气分压过高：富氧与火灾风险上升",ok:"氧气分压在窗口内"},
 temperature:{low:"温度过低：增加加热",high:"温度过高：加强排热",ok:"温度在窗口内"},
 carbonDioxide:{low:"二氧化碳在窗口内",high:"CO₂ 正在累积：增强吸收",ok:"二氧化碳在窗口内"}
};
const initial=()=>({values:{pressure:66,oxygen:16.8,temperature:29.2,carbonDioxide:.82},controls:{pressure:30,oxygen:25,temperature:85,carbonDioxide:20},stable:0,complete:false,last:performance.now()});
let state=initial();
const keys=Object.keys(TARGETS);
function clamp(v,a,b){return Lec.P.clamp(v,a,b)}
function targetFor(k,c){return {pressure:60+c*.5,oxygen:15+c*.12,temperature:15+c*.18,carbonDioxide:1.1-c*.012}[k]}
function good(k,v){return v>=TARGETS[k].min&&v<=TARGETS[k].max}
function fmt(k,v){return Lec.P.formatNumber(v,{maximumFractionDigits:k==='pressure'?1:2,minimumFractionDigits:k==='carbonDioxide'?2:1})}
function render(){
 let ok=0;
 keys.forEach(k=>{
  const v=state.values[k], t=TARGETS[k], isGood=good(k,v), el=document.querySelector('.instrument[data-key="'+k+'"]'), act=document.querySelector('.actuator[data-key="'+k+'"]');
  if(isGood) ok++;
  el.classList.toggle('good',isGood);el.classList.toggle('bad',!isGood);act.classList.toggle('bad',!isGood);
  document.getElementById(k+'-read').textContent=fmt(k,v);
  const desired=targetFor(k,state.controls[k]);
  document.getElementById(k+'-dir').textContent=Math.abs(desired-v)<.03?'→':desired>v?'↑':'↓';
  const [lo,hi]=ranges[k], needle=el.querySelector('.needle'), band=el.querySelector('.band');
  needle.style.left=(clamp((v-lo)/(hi-lo),0,1)*100)+'%';
  band.style.left=(clamp((t.min-lo)/(hi-lo),0,1)*100)+'%';band.style.width=(clamp((t.max-t.min)/(hi-lo),0,1)*100)+'%';
  const fb=el.querySelector('.feedback');fb.textContent=isGood?labels[k].ok:(v<t.min?labels[k].low:labels[k].high);fb.classList.toggle('ok',isGood);
  const input=document.getElementById(k);input.value=state.controls[k];input.nextElementSibling.textContent=state.controls[k]+'%';
 });
 document.getElementById('count').textContent='四项达标 '+ok+'/4';
 document.getElementById('timer').textContent='稳定计时 '+Math.floor(state.stable)+'/'+WIN.stableSeconds+' 秒';
 const status=document.getElementById('status');
 status.textContent=state.complete?'这段可居住环境由持续控制维持。':ok===4?'四项同时达标；继续维持闭环控制。':'压力合适，不代表另外三项也合适；请逐项调节。';
 status.classList.toggle('complete',state.complete);
}
keys.forEach(k=>document.getElementById(k).addEventListener('input',e=>{state.controls[k]=Number(e.target.value);render()}));
document.getElementById('reset').addEventListener('click',()=>{state=initial();render()});
Deck.loop((now,dt)=>{
 if(!dt){render();return}
 const sec=Math.min(dt/1000,.05);
 keys.forEach(k=>{const desired=targetFor(k,state.controls[k]);state.values[k]=clamp(state.values[k]+(desired-state.values[k])*sec*.42,ranges[k][0],ranges[k][1])});
 const all=keys.every(k=>good(k,state.values[k]));
 if(all&&!state.complete){state.stable=Math.min(WIN.stableSeconds,state.stable+sec);if(state.stable>=WIN.stableSeconds)state.complete=true}
 render();
},{still:1});
render();
</script>
</body>
</html>
