<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main{--plot-w:760px;--plot-h:286px}
  .micro-page{height:100%;display:flex;flex-direction:column;gap:12px}
  .process-strip{--process-cols:5;height:76px;flex:0 0 76px}
  .process-strip .step{padding:38px 10px 8px;text-align:center;font-size:var(--fs-label);line-height:1.25;background:rgba(16,29,40,.82)}
  .process-strip .axis{top:20px}.process-strip .step::before{top:12px;width:12px;height:12px}.process-strip .arw{top:5px}
  .scene{display:flex;gap:16px;flex:1;min-height:0}
  .body-zone{position:relative;flex:0 0 420px;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-deep)}
  .body-zone img{width:100%;height:100%;object-fit:cover;opacity:.54;filter:saturate(.72) contrast(1.08)}
  .body-zone::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,16,25,.04),rgba(7,16,25,.72)),linear-gradient(0deg,rgba(7,16,25,.62),transparent 45%);pointer-events:none}
  .orbit{position:absolute;width:330px;height:250px;left:38px;top:18px;transform:rotate(-12deg);z-index:2}
  .body-title{position:absolute;z-index:4;left:18px;top:14px;font-size:var(--fs-sec);line-height:1.45;max-width:340px}
  .marker{position:absolute;z-index:4;left:var(--mx);top:var(--my);display:flex;align-items:center;gap:8px;color:var(--primary);font-size:var(--fs-label);font-family:var(--font-mono)}
  .marker::before{content:"";width:12px;height:12px;border:2px solid currentColor;border-radius:50%;box-shadow:0 0 12px currentColor}
  .marker::after{content:"";width:54px;height:1px;background:currentColor}
  .marker.hot{color:var(--accent)}
  .photo-credit{position:absolute;z-index:4;left:16px;bottom:10px;color:var(--muted);font-size:var(--fs-label)}
  .chart-zone{flex:1;min-width:0;display:flex;flex-direction:column;padding:14px 16px 10px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
  .chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex:0 0 48px}
  .chart-head h2{font-size:var(--fs-h2)}
  .status{font-size:var(--fs-label);line-height:1.4;text-align:right;color:var(--muted)}
  .status strong{color:var(--accent);font-size:var(--fs-body)}
  #chart{width:100%;height:288px;display:block;overflow:visible}
  .axis text,.chart-label{fill:var(--muted);font-size:13px;font-family:var(--font-mono)}
  .axis path,.axis line{stroke:var(--line-strong)}
  .grid line{stroke:var(--line);stroke-dasharray:3 5}.grid path{display:none}
  .legend{display:flex;gap:18px;align-items:center;font-size:var(--fs-label);color:var(--muted);height:28px}
  .key{display:inline-block;width:28px;border-top:3px solid var(--primary);margin-right:7px;vertical-align:middle}.key.dash{border-top-style:dashed;opacity:.62}.key.now{border-color:var(--accent)}
  .console{flex:0 0 150px;display:flex;gap:16px;padding:14px 18px;background:linear-gradient(180deg,var(--surface-high),var(--surface));border:1px solid var(--line-strong);border-radius:var(--radius-md)}
  .days{flex:0 0 300px}.training{flex:1;min-width:0}.console-title{font-size:var(--fs-label);font-weight:700;color:var(--text);margin-bottom:6px}
  .ctl{min-height:34px}.ctl input[type=range]{flex:1;min-width:100px}.val{width:48px;text-align:right;color:var(--accent);font-size:var(--fs-sec)}
  .budget{display:flex;justify-content:space-between;font-size:var(--fs-label);color:var(--muted)}
  .feedback{flex:0 0 270px;display:flex;flex-direction:column;justify-content:center;gap:8px;border-left:1px solid var(--line);padding-left:16px}
  .feedback p{font-size:var(--fs-sec);line-height:1.45}.feedback button{align-self:flex-start}
  .shake{animation:shake .26s ease-out}.glow{filter:drop-shadow(0 0 5px rgba(255,181,71,.7))}
  .enter{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes shake{0%,100%{transform:none}30%{transform:translateX(-8px)}65%{transform:translateX(6px)}}
  @media(prefers-reduced-motion:reduce){.enter,.shake{animation:none!important}*{transition:none!important}}
</style>
</head>

g.append('g').attr('class','grid').call(d3.axisLeft(y).tickValues([60,80,100]).tickSize(-plotW).tickFormat(''));
g.append('g').attr('class','axis').attr('transform',`translate(0,${plotH})`).call(d3.axisBottom(x).tickValues([0,30,60,90,120,150,180]).tickFormat(d=>d));
g.append('text').attr('class','chart-label').attr('x',plotW/2).attr('y',plotH+34).attr('text-anchor','middle').text('任务日数');
g.append('g').attr('class','axis').call(d3.axisLeft(y).tickValues([60,80,100]));
g.append('line').attr('x1',0).attr('x2',plotW).attr('y1',y(100)).attr('y2',y(100)).attr('stroke','var(--primary)').attr('opacity',.4);
const plot=g.append('g'); const cursor=g.append('line').attr('y1',0).attr('y2',plotH).attr('stroke','var(--accent)').attr('stroke-width',2);
const line=d3.line().x(d=>x(d.day)).y(d=>y(d.value)).curve(d3.curveMonotoneX);
function trainedValue(s,d,alloc){const raw=s.base(d), dose=s.weights[0]*alloc[0]+s.weights[1]*alloc[1]+s.weights[2]*alloc[2];const relief=(100-raw)*(.70*(1-Math.exp(-dose/48)));return Math.min(99.2,raw+relief)}
function render(message){
 const days=Lec.P.clamp(+els.days.value,0,180),alloc=[+els.resist.value,+els.aerobic.value,+els.balance.value];
 document.querySelector('#daysVal').textContent=Lec.P.formatNumber(days)+' 日';document.querySelector('#dayRead').textContent='第 '+Lec.P.formatNumber(days)+' / '+Lec.P.formatNumber(180)+' 日';
 ['resist','aerobic','balance'].forEach(k=>document.querySelector('#'+k+'Val').textContent=Lec.P.formatNumber(+els[k].value));
 document.querySelector('#budgetRead').textContent='已分配 '+Lec.P.formatNumber(d3.sum(alloc))+' / '+Lec.P.formatNumber(100);
 const all=systems.map(s=>({s,raw:d3.range(0,days+1,3).concat(days).map(day=>({day,value:s.base(day)})),now:d3.range(0,days+1,3).concat(days).map(day=>({day,value:trainedValue(s,day,alloc)})),value:trainedValue(s,days,alloc)}));
 const groups=plot.selectAll('.series').data(all,d=>d.s.id).join(enter=>{const z=enter.append('g').attr('class','series');z.append('path').attr('class','raw');z.append('path').attr('class','now');z.append('text').attr('class','chart-label end');return z});
 groups.select('.raw').attr('d',d=>line(d.raw)).attr('fill','none').attr('stroke','var(--primary)').attr('stroke-width',2).attr('stroke-dasharray','6 6').attr('opacity',.35);
 groups.select('.now').attr('d',d=>line(d.now)).attr('fill','none').attr('stroke','var(--accent)').attr('stroke-width',3);
 groups.select('.end').attr('x',x(days)+8).attr('y',d=>y(d.value)+4+(d.s.id==='bone'?-10:d.s.id==='balance'?10:0)).attr('fill','var(--text)').text(d=>d.s.name+' '+Lec.P.formatNumber(d.value,{maximumFractionDigits:1}));
 cursor.attr('x1',x(days)).attr('x2',x(days));
 const counts=[0,0,0];all.forEach(d=>{if(d.value>=92)counts[0]++;else if(d.value>=82)counts[1]++;else counts[2]++});
 document.querySelector('#bands').textContent='稳定 '+counts[0]+' · 注意 '+counts[1]+' · 明显变化 '+counts[2];
 const weakest=d3.least(all,d=>d.value);document.querySelectorAll('.marker').forEach(n=>n.classList.toggle('hot',n.dataset.sys===weakest.s.id));
 document.querySelector('#feedback').textContent=message||(days===180?'4 个系统均有变化；训练已减缓部分变化，但没有让影响消失。':'当前变化最明显：'+weakest.s.name+'。把训练投向对应系统，曲线会向基线缓和。');
}
function allocate(changed){let total=+els.resist.value + +els.aerobic.value + +els.balance.value;if(total>100){els[changed].value=+els[changed].value-(total-100);const c=document.querySelector('#console');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');render('每日训练预算只有 100 点；增加一项必须减少另一项。');}else render('已减缓，不等于消失。训练收益会递减。')}
els.days.addEventListener('input',()=>render());['resist','aerobic','balance'].forEach(k=>els[k].addEventListener('input',()=>allocate(k)));
document.querySelector('#reset').addEventListener('click',()=>{Object.keys(initial).forEach(k=>els[k].value=initial[k]);render('已恢复同一任务与初始训练分配。')});
render();
</script>
</body>
</html>
