<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .radiation-page{height:100%;display:flex;flex-direction:column;gap:12px;position:relative}
  .mag-arc{position:absolute;inset:8px 110px 80px;border:1px solid rgba(66,199,194,.16);border-radius:50%;pointer-events:none;z-index:-1;clip-path:inset(0 0 48% 0)}
  .chart-shell{height:292px;position:relative;padding:10px 16px 4px;background:linear-gradient(180deg,rgba(16,29,40,.92),rgba(11,23,33,.86));border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden}
  .chart-top{position:absolute;left:20px;top:12px;z-index:2;display:flex;align-items:center;gap:22px;font-size:var(--fs-label);color:var(--muted)}
  .legend-line{display:inline-block;width:26px;height:3px;margin-right:7px;vertical-align:middle;background:var(--primary)}
  .legend-line.b{height:4px;background:var(--accent)}
  #radiation-chart{width:100%;height:100%}
  .lower{display:flex;gap:12px;height:316px}
  .compare-wrap{flex:1 1 auto;min-width:0}
  .k-comparison{height:100%;--compare-cols:156px repeat(2,minmax(0,1fr))}
  .k-comparison>*{padding:8px 14px}
  .k-comparison .hdr{font-size:19px}
  .k-comparison .dim{display:flex;align-items:center;justify-content:flex-end}
  .k-comparison .cell{display:flex;align-items:center;gap:10px;font-size:16px}
  .a-cell{color:#c6e8e6}.b-cell{color:#ffe0ae}
  .control{width:100%;display:flex;align-items:center;gap:10px}
  .control select{width:100%;min-height:38px;font-size:16px}
  .control input[type=range]{flex:1;min-width:110px}
  .v{min-width:76px;text-align:right;font-family:var(--font-mono);font-size:16px;font-variant-numeric:tabular-nums}
  .outputs{display:flex;gap:18px;flex-wrap:wrap}
  .outputs strong{font-family:var(--font-mono);font-size:18px}
  .mission{width:370px;flex:0 0 370px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .mission h2{font-size:20px}
  .target{padding:9px 11px;background:var(--surface-deep);border:1px solid var(--line);border-radius:var(--radius-sm)}
  .target-head{display:flex;justify-content:space-between;font-size:16px;line-height:1.35}
  .meter{height:7px;margin-top:7px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden}
  .meter>i{display:block;height:100%;width:0;background:var(--accent);transition:width 220ms ease-out,background 220ms ease-out}
  .target.ok{border-color:var(--primary)}.target.ok .state{color:var(--primary)}.target.ok .meter>i{background:var(--primary)}
  .feedback{min-height:48px;padding:9px 11px;color:#ffd89e;background:var(--accent-soft);border-left:3px solid var(--accent);font-size:16px;line-height:1.4}
  .feedback.ok{color:#bff4f1;background:var(--primary-soft);border-color:var(--primary)}
  .mission .note{font-size:16px;line-height:1.4}
  .actions{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .status-count{font-family:var(--font-mono);font-size:15px;color:var(--muted)}
  .pulse{animation:pulse 650ms ease-out}.shake{animation:shake 280ms ease-out}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(66,199,194,.12)}}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="44" data-total="48">
<div id="stage">
<main id="main">
  <section class="radiation-page" aria-label="航天辐射防护比较模型">
    <div class="mag-arc" aria-hidden="true"></div>
    <div class="chart-shell min0">
      <div class="chart-top"><span><i class="legend-line"></i>基线 A</span><span><i class="legend-line b"></i>方案 B</span><span>阴影表示教学估计的不确定范围</span></div>
      <div id="radiation-chart" role="img" aria-label="基线与方案的累计有效剂量估计曲线"></div>
    </div>
    <div class="lower">
      <div class="compare-wrap min0">
        <div class="k-comparison">
          <div class="hdr dim">比较维度</div><div class="hdr">基线 A · 未优化</div><div class="hdr diff">方案 B · 可调整</div>
          <div class="dim">位置情景</div><div class="cell a-cell"><span id="a-scene"></span></div><div class="cell b-cell diff"><div class="control"><select id="scene" aria-label="选择位置情景"><option value="leo">低地球轨道</option><option value="beyond" selected>磁层之外</option><option value="spe">太阳粒子事件</option></select></div></div>
          <div class="rowline"></div>
          <div class="dim">任务时长</div><div class="cell a-cell"><span id="a-days"></span></div><div class="cell b-cell diff"><div class="control"><input id="days" type="range" min="30" max="900" step="10" value="180" aria-label="方案任务时长"><span class="v" id="days-v"></span></div></div>
          <div class="rowline"></div>
          <div class="dim">防护材料</div><div class="cell a-cell">铝</div><div class="cell b-cell diff"><div class="control"><select id="material" aria-label="选择防护材料"><option value="al" selected>铝</option><option value="pe">聚乙烯</option><option value="water">水</option></select></div></div>
          <div class="rowline"></div>
          <div class="dim">面密度</div><div class="cell a-cell"><span id="a-density"></span></div><div class="cell b-cell diff"><div class="control"><input id="density" type="range" min="0" max="40" step="1" value="10" aria-label="方案防护面密度"><span class="v" id="density-v"></span></div></div>
          <div class="rowline"></div>
          <div class="dim">输出</div><div class="cell a-cell outputs"><span>剂量 <strong id="a-dose"></strong></span><span>质量 <strong id="a-mass"></strong></span></div><div class="cell b-cell diff outputs"><span>剂量 <strong id="b-dose"></strong></span><span>质量 <strong id="b-mass"></strong></span><span id="delta"></span></div>
        </div>
      </div>
      <aside class="panel mission min0" aria-label="工程任务进度">
        <h2>工程任务</h2>
        <p class="sec">让剂量减量至少 35%，新增屏蔽质量不超过 12,000 kg。</p>
        <div class="target" id="dose-target"><div class="target-head"><span>减量目标</span><b class="state" id="dose-state">0 / 1</b></div><div class="meter"><i id="dose-meter"></i></div></div>
        <div class="target" id="mass-target"><div class="target-head"><span>质量目标</span><b class="state" id="mass-state">1 / 1</b></div><div class="meter"><i id="mass-meter"></i></div></div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
        <p class="note">有效剂量仅作教学估计，不等同于个人患病概率。高能粒子下，屏蔽收益会递减。</p>
        <div class="actions"><span class="status-count" id="count"></span><button id="reset" type="button">重置方案</button></div>
      </aside>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
Lec.mount({index:44,kicker:"EARTH LIFE / RADIATION",title:"磁场之外，防护不是一堵越厚越好的墙",take:"离开地球磁场后，距离、任务时长与屏蔽材料共同改变辐射风险。"});
const P=Lec.P;
const scenarios={
  leo:{name:"低地球轨道",rate:0.42,uncertainty:0.18},
  beyond:{name:"磁层之外",rate:1.65,uncertainty:0.24},
  spe:{name:"太阳粒子事件",rate:4.8,uncertainty:0.38}
};
const materials={al:{name:"铝",max:0.42,half:18},pe:{name:"聚乙烯",max:0.61,half:13},water:{name:"水",max:0.56,half:11}};
const protectedArea=20, baseDays=180, baseDensity=10, massLimit=12000, reductionGoal=0.35;
const el=id=>document.getElementById(id);
const chart=echarts.init(document.querySelector("#radiation-chart"),null,{renderer:"svg"});
function atten(mat,density){const m=materials[mat];return 1-m.max*density/(density+m.half);}
function dose(scene,days,mat,density){return scenarios[scene].rate*days*atten(mat,density);}
function fmt(n,d=0){return P.formatNumber(n,{maximumFractionDigits:d,minimumFractionDigits:d});}
function series(scene,days,mat,density){const pts=[];const steps=45;for(let i=0;i<=steps;i++){const day=days*i/steps;pts.push([day,dose(scene,day,mat,density)]);}return pts;}
function update(){
  const scene=el('scene').value;
  const days=P.clamp(Number(el('days').value),30,900);
  const density=P.clamp(Number(el('density').value),0,40);
  const s=scenarios[scene];
  const aDose=dose(scene,baseDays,'al',baseDensity), bDose=dose(scene,days,el('material').value,density);
  const aMass=protectedArea*baseDensity, bMass=protectedArea*density, added=(bMass-aMass)*1;
  const reduction=(aDose-bDose)/aDose;
  const doseOK=reduction>=reductionGoal, massOK=added<=massLimit;
  el('a-scene').textContent=s.name; el('a-days').textContent=fmt(baseDays)+' 天'; el('a-density').textContent=fmt(baseDensity)+' kg/m²';
  el('days-v').textContent=fmt(days)+' 天';el('density-v').textContent=fmt(density)+' kg/m²';
  el('a-dose').textContent=fmt(aDose,1)+' mSv';el('b-dose').textContent=fmt(bDose,1)+' mSv';
  el('a-mass').textContent=fmt(aMass)+' kg';el('b-mass').textContent=fmt(bMass)+' kg';
  el('delta').textContent='相对 A：'+P.percent(reduction)+'；质量 '+(added>=0?'+':'')+fmt(added)+' kg';
  el('dose-state').textContent=doseOK?'1 / 1':'0 / 1';el('mass-state').textContent=massOK?'1 / 1':'0 / 1';el('count').textContent='减量目标 '+(doseOK?'1':'0')+'/1 · 质量目标 '+(massOK?'1':'0')+'/1';
  el('dose-target').classList.toggle('ok',doseOK);el('mass-target').classList.toggle('ok',massOK);
  el('dose-meter').style.width=Math.min(100,Math.max(0,reduction/reductionGoal*100))+'%';
  el('mass-meter').style.width=Math.min(100,Math.max(0,(massLimit-Math.max(0,added))/massLimit*100))+'%';
  const fb=el('feedback');fb.classList.toggle('ok',doseOK&&massOK);
  if(doseOK&&massOK) fb.textContent='方案成立：减量与质量约束同时满足。';
  else if(!doseOK) fb.textContent='剂量减量不足：延长任务会累积更多暴露。';
  else fb.textContent='质量超限：更厚不等于可承担。';
  const maxDay=Math.max(baseDays,days), a=series(scene,baseDays,'al',baseDensity), b=series(scene,days,el('material').value,density);
  chart.setOption({animationDuration:Deck.reduced()?0:500,textStyle:{fontSize:16,color:'#DCEAF0'},grid:{left:82,right:32,top:45,bottom:50},tooltip:{trigger:'axis',textStyle:{fontSize:16}},xAxis:{type:'value',min:0,max:maxDay,name:'任务时长 / 天',nameTextStyle:{fontSize:14,color:'#9CB0B9'},axisLabel:{fontSize:14,color:'#9CB0B9'},splitLine:{lineStyle:{color:'rgba(190,222,226,.09)'}}},yAxis:{type:'value',name:'累计有效剂量估计 / mSv',nameTextStyle:{fontSize:14,color:'#9CB0B9'},axisLabel:{fontSize:14,color:'#9CB0B9'},splitLine:{lineStyle:{color:'rgba(190,222,226,.09)'}}},series:[{name:'基线 A',type:'line',showSymbol:false,data:a,lineStyle:{width:3,color:'#42C7C2'}},{name:'方案 B',type:'line',showSymbol:false,data:b,lineStyle:{width:4,color:'#FFB547'},areaStyle:{opacity:.08,color:'#FFB547'},markPoint:{symbolSize:15,label:{show:false},itemStyle:{color:'#FFB547',borderColor:doseOK&&massOK?'#B7F3F0':'#fff',borderWidth:3},data:[{coord:b[b.length-1]}]}}]});
}
['scene','days','material','density'].forEach(id=>el(id).addEventListener('input',update));
el('reset').addEventListener('click',()=>{el('scene').value='beyond';el('days').value=180;el('material').value='al';el('density').value=10;update();});
update();
Deck.onResize(()=>chart.resize());
</script>
</body>
</html>
