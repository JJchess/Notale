<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#main.chain-page{position:relative;display:block;padding:0;overflow:hidden}
.chain-page>svg{position:absolute;left:8px;top:8px;width:calc(100% - 16px);height:calc(100% - 16px);z-index:0}
.chain-page .claim{position:absolute;z-index:3;left:32px;top:22px;width:520px;padding:16px 20px;border-left:8px solid var(--primary);background:rgba(23,41,54,.94);border-radius:0 var(--radius-md) var(--radius-md) 0;font-size:var(--fs-lead);font-weight:750;line-height:var(--lh-copy)}
.chain-page .claim small{display:block;margin-top:4px;color:var(--muted);font-size:var(--fs-sec);font-weight:500;line-height:var(--lh-sec)}
.chain-page .supports{position:absolute;z-index:3;inset:0;padding:0;display:block}
.chain-page .trunk{position:absolute;left:105px;right:114px;top:338px;height:4px;background:linear-gradient(90deg,var(--primary),var(--primary),rgba(66,199,194,.42));box-shadow:0 0 18px rgba(66,199,194,.45);transform-origin:left center}
.chain-page .support{position:absolute;width:292px;min-height:166px;padding:18px 20px;background:var(--surface-high);border:2px solid var(--primary-line);border-radius:var(--radius-sm);font-size:var(--fs-sec);line-height:var(--lh-sec);box-shadow:var(--shadow)}
.chain-page .support::before{content:"";position:absolute;left:50%;width:1px;height:35px;background:var(--primary-line)}
.chain-page .support:nth-of-type(1){left:38px;top:148px}.chain-page .support:nth-of-type(2){left:384px;top:358px}
.chain-page .support:nth-of-type(3){left:730px;top:148px}.chain-page .support:nth-of-type(4){left:1076px;top:358px}
.chain-page .support:nth-of-type(1)::before,.chain-page .support:nth-of-type(3)::before{top:100%}
.chain-page .support:nth-of-type(2)::before,.chain-page .support:nth-of-type(4)::before{bottom:100%}
.layer-head{display:flex;align-items:center;gap:10px;margin-bottom:5px;color:var(--text);font-size:var(--fs-h2);font-weight:750;line-height:1.3}
.layer-dot{width:14px;height:14px;flex:0 0 auto;border:3px solid var(--accent);border-radius:50%;background:var(--bg);box-shadow:0 0 14px rgba(255,181,71,.42)}
.evidence-line{display:flex;flex-wrap:wrap;gap:7px;color:var(--muted)}
.evidence-line span{display:inline-block;padding:5px 9px;background:var(--primary-soft);border:1px solid var(--primary-line);border-radius:var(--radius-sm);font-size:var(--fs-label);line-height:1.4}
.relation{display:block;margin-top:5px;color:var(--primary);font-weight:650}
.chain-end{position:absolute;z-index:4;right:34px;top:22px;width:470px;padding:14px 18px;color:var(--text);background:rgba(16,29,40,.95);border:1px solid var(--primary-line);border-radius:var(--radius-md);font-size:var(--fs-body);font-weight:700;line-height:var(--lh-copy)}
.chain-end .eyebrow{display:block;color:var(--accent);font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.08em}
.bottom-note{position:absolute;z-index:4;left:74px;right:74px;bottom:18px;display:flex;gap:28px;align-items:center;padding-top:12px;border-top:1px solid var(--line)}
.bottom-note p{flex:1;color:#d4e4e7;font-size:var(--fs-sec);line-height:var(--lh-sec)}
.scene-label{fill:var(--muted);font-family:var(--font-mono);font-size:15px;letter-spacing:.08em}
.window{fill:#101D28;stroke:rgba(190,222,226,.28);stroke-width:2}
.main-link{fill:none;stroke:var(--primary);stroke-width:4;filter:url(#glow)}
.branch{fill:none;stroke:var(--primary-line);stroke-width:1.5}
.motif{fill:none;stroke:var(--primary-line);stroke-width:2}
.node-ring{fill:var(--bg);stroke:var(--accent);stroke-width:4}
@media (prefers-reduced-motion:reduce){.chain-page *{transition:none!important;animation:none!important}}
</style>
</head>
<body data-page="47" data-total="48">
<div id="stage">
<main id="main" class="chain-page k-generalization">
  <div class="claim">太空能力来自四层依赖的叠加。<small>任何一层都不能单独把地球生命送离地面。</small></div>
  <div class="supports" aria-label="四层支撑关系">
    <div class="trunk" aria-hidden="true"></div>
    <section class="support"><div class="layer-head"><span class="layer-dot"></span><span>地球生命的身体</span></div><div class="evidence-line"><span>双足</span><span>手</span><span>脑</span><span>食物</span><span>群体依赖</span></div><span class="relation">提供能学习、操作且必须维持的身体</span></section>
    <section class="support"><div class="layer-head"><span class="layer-dot"></span><span>跨代保存的能力</span></div><div class="evidence-line"><span>教学</span><span>符号</span><span>外部记忆</span><span>制度</span><span>协作</span></div><span class="relation">让知识和项目超出单个人</span></section>
    <section class="support"><div class="layer-head"><span class="layer-dot"></span><span>在限制中造窗口</span></div><div class="evidence-line"><span>引力</span><span>速度</span><span>质量</span><span>能量</span><span>生命保障</span></div><span class="relation">把集体知识转成有限的离地能力</span></section>
    <section class="support"><div class="layer-head"><span class="layer-dot"></span><span>决定方向与代价</span></div><div class="evidence-line"><span>目标</span><span>预算</span><span>风险</span><span>治理</span><span>退出</span></div><span class="relation">决定是否行动及如何分担后果</span></section>
  </div>
  <div class="chain-end"><span class="eyebrow">链尾 · 短暂离开地球</span>某种地球猿类，依靠彼此，短暂进入轨道之外的环境</div>
  <div class="bottom-note"><p>太空能力不是身体、文化、机器或意志中任何一项单独造成的。</p><p>链条越向太空延伸，对地球生命条件和共同体决定的依赖并没有消失。</p></div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
Lec.mount({index:47, kicker:"CHAIN OF ARRIVAL", title:"从脚印到轨道，不是一次跳跃", take:"完整链条由猿类身体、累积文化、物理约束与公共选择层层叠加。"});

const svg=d3.select("#main").append("svg").attr("viewBox","0 0 1200 620").attr("role","img").attr("aria-label","从猿类身体到公共选择的四层证据链总图");
const defs=svg.append("defs");
const glow=defs.append("filter").attr("id","glow").attr("x","-30%").attr("y","-30%").attr("width","160%").attr("height","160%");
glow.append("feGaussianBlur").attr("stdDeviation",4).attr("result","blur");
const merge=glow.append("feMerge");merge.append("feMergeNode").attr("in","blur");merge.append("feMergeNode").attr("in","SourceGraphic");
const scenes=[{x:18,w:360,label:"生命基础"},{x:382,w:430,label:"集体能力"},{x:816,w:366,label:"受约束的行动"}];
svg.selectAll("rect.window").data(scenes).join("rect").attr("class","window").attr("x",d=>d.x).attr("y",130).attr("width",d=>d.w).attr("height",400).attr("rx",18);
svg.selectAll("text.scene-label").data(scenes).join("text").attr("class","scene-label").attr("x",d=>d.x+18).attr("y",158).text(d=>d.label);
// 脚印、协作网络与留有缺口的轨道弧，只作为已学证据的视觉索引。
const prints=[[72,322,-18],[104,286,14],[139,321,-12]];
svg.selectAll("ellipse.print").data(prints).join("ellipse").attr("class","motif print").attr("cx",d=>d[0]).attr("cy",d=>d[1]).attr("rx",10).attr("ry",20).attr("transform",d=>`rotate(${d[2]} ${d[0]} ${d[1]})`);
const netNodes=[[470,264],[520,220],[560,288],[610,238],[662,280]];
const ng=svg.append("g");ng.selectAll("line").data([[0,1],[0,2],[1,3],[2,3],[2,4],[3,4]]).join("line").attr("class","branch").attr("x1",d=>netNodes[d[0]][0]).attr("y1",d=>netNodes[d[0]][1]).attr("x2",d=>netNodes[d[1]][0]).attr("y2",d=>netNodes[d[1]][1]);
ng.selectAll("circle").data(netNodes).join("circle").attr("cx",d=>d[0]).attr("cy",d=>d[1]).attr("r",6).attr("fill","var(--primary)");
svg.append("path").attr("class","motif").attr("d","M 930 300 A 112 88 0 1 1 1085 362").attr("stroke-dasharray","330 36");
svg.append("circle").attr("cx",1005).attr("cy",334).attr("r",22).attr("fill","rgba(66,199,194,.12)").attr("stroke","var(--primary-line)");
const nodes=[{x:132,y:340},{x:402,y:340},{x:672,y:340},{x:942,y:340},{x:1110,y:340}];
const link=d3.linkHorizontal().x(d=>d.x).y(d=>d.y);
const links=d3.pairs(nodes).map(([source,target])=>({source,target}));
const paths=svg.append("g").selectAll("path").data(links).join("path").attr("class","main-link").attr("d",link);
svg.append("g").selectAll("circle").data(nodes).join("circle").attr("class","node-ring").attr("cx",d=>d.x).attr("cy",d=>d.y).attr("r",9);
if(!Deck.reduced()){
  svg.selectAll(".print").attr("opacity",0).transition().delay((d,i)=>i*120).duration(280).attr("opacity",1);
  paths.each(function(){const p=d3.select(this),len=this.getTotalLength();p.attr("stroke-dasharray",len).attr("stroke-dashoffset",len).transition().delay(360).duration(1050).ease(d3.easeCubicOut).attr("stroke-dashoffset",0);});
  svg.selectAll(".node-ring").attr("opacity",0).attr("r",4).transition().delay((d,i)=>540+i*180).duration(300).attr("opacity",1).attr("r",9);
}
</script>
</body>
</html>
