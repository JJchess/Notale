  .k-generalization.hero-model{position:relative;z-index:2;height:100%;gap:0;}

  .hero-model>.supports{position:absolute;inset:0;display:block;padding:0;}

  .support.endpoint{position:absolute;padding:0;border:0;border-radius:0;background:transparent;font-size:var(--fs-sec);line-height:1.45;color:var(--muted);}
  .support.endpoint::before{display:none;}
  .ancient-label{left:64px;bottom:24px;}

  .kicker{position:absolute;left:260px;top:174px;color:var(--primary-bright);font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;}

  .sole{position:absolute;left:35px;top:68px;width:89px;height:194px;border:3px solid rgba(53,194,178,.58);border-radius:48% 43% 52% 46%;background:radial-gradient(ellipse at 50% 30%,rgba(53,194,178,.18),rgba(53,194,178,.03) 68%);box-shadow:inset 0 0 24px rgba(53,194,178,.16);}
  .toe{position:absolute;border:3px solid rgba(53,194,178,.55);border-radius:50%;background:rgba(53,194,178,.08);}
  .toe:nth-child(2){width:31px;height:38px;left:45px;top:18px}.toe:nth-child(3){width:26px;height:33px;left:78px;top:21px}.toe:nth-child(4){width:22px;height:28px;left:105px;top:34px}.toe:nth-child(5){width:19px;height:24px;left:124px;top:53px}.toe:nth-child(6){width:18px;height:22px;left:135px;top:76px}
  .boot-print{position:absolute;right:84px;top:72px;width:250px;height:390px;transform:rotate(18deg);filter:drop-shadow(0 0 20px rgba(255,181,71,.18));}
  .boot-sole{position:absolute;inset:12px 35px 16px;border:3px solid rgba(255,181,71,.7);border-radius:42% 42% 35% 35%;background:linear-gradient(90deg,rgba(232,241,247,.08),rgba(232,241,247,.18),rgba(232,241,247,.04));box-shadow:inset 0 0 0 10px rgba(232,241,247,.025),0 0 20px rgba(255,181,71,.12);}
  .boot-sole::before{content:"";position:absolute;inset:34px 20px;background:repeating-linear-gradient(0deg,rgba(232,241,247,.38) 0 8px,transparent 8px 24px);border-radius:36%;opacity:.65;}
  .boot-sole::after{content:"";position:absolute;left:28px;right:28px;top:46%;height:20px;border-top:3px solid rgba(232,241,247,.35);border-bottom:3px solid rgba(232,241,247,.35);}
  .path{position:absolute;left:185px;bottom:255px;width:1040px;height:430px;transform:rotate(-2deg);}
  .mark{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--primary);box-shadow:0 0 16px rgba(53,194,178,.65);opacity:.78;animation:ignite .7s ease-out both;}
  .mark:nth-child(1){left:3%;top:78%;animation-delay:.18s}.mark:nth-child(2){left:12%;top:69%;animation-delay:.25s}.mark:nth-child(3){left:22%;top:60%;animation-delay:.32s}.mark:nth-child(4){left:33%;top:50%;animation-delay:.39s}.mark:nth-child(5){left:45%;top:40%;animation-delay:.46s}.mark:nth-child(6){left:57%;top:31%;animation-delay:.53s}.mark:nth-child(7){left:68%;top:23%;animation-delay:.60s}.mark:nth-child(8){left:78%;top:16%;animation-delay:.67s}.mark:nth-child(9){left:87%;top:11%;animation-delay:.74s}
  .bare-print{animation:appear .3s ease-out both}.boot-print{animation:appear .35s .78s ease-out both}.claim,.kicker,.take,.endpoint{animation:rise .35s 1.05s ease-out both}
  .accent{color:var(--accent);}
  @keyframes ignite{from{opacity:0;transform:scale(.2)}to{opacity:.78;transform:scale(1)}}
  @keyframes appear{from{opacity:0;transform:translateY(16px) rotate(var(--rot,0deg))}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.bare-print,.boot-print,.claim,.kicker,.take,.endpoint,.mark{animation:none!important}}
</style>
</head>
