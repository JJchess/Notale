<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:44px 64px 38px;position:relative;isolation:isolate}
  .route-head{height:148px;display:flex;align-items:flex-start;justify-content:space-between;gap:52px;z-index:2}
  .route-kicker{width:760px;font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.18em;color:var(--accent);margin-bottom:10px}
  .route-head h1{width:760px;font-size:clamp(30px,4vw,58px);line-height:1.12}
  .route-question{width:650px;margin:16px 0 0;padding-left:20px;border-left:2px solid var(--accent);font-size:var(--fs-lead);line-height:var(--lh-text);color:var(--text)}
  .route-field{flex:1;min-height:0;position:relative;margin:0 22px;overflow:visible;border:2px solid var(--line-soft);border-radius:var(--r-lg);background:var(--panel-deep);box-shadow:inset 0 0 70px rgba(53,194,178,.035)}
  .blueprint{position:absolute;inset:0;opacity:.22;pointer-events:none;background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
  .ghost-rings{position:absolute;inset:36px 280px 40px;border:1px solid var(--line-soft);border-radius:50%;opacity:.45}
  .route-line{position:absolute;left:50%;top:18px;bottom:18px;width:180px;transform:translateX(-50%);overflow:visible}
  .route-line path{fill:none;stroke:var(--primary);stroke-width:2;vector-effect:non-scaling-stroke;stroke-dasharray:720;stroke-dashoffset:720;animation:draw .62s cubic-bezier(.22,.8,.35,1) forwards}
  .orbit{fill:none;stroke:var(--primary);stroke-width:2;stroke-dasharray:7 8;opacity:.68}
  .earth-arc{position:absolute;right:0;bottom:0;width:390px;height:96px;border-top:3px solid var(--primary);border-radius:50% 50% 0 0;background:rgba(53,194,178,.035)}
  .footprint{position:absolute;left:calc(50% - 65px);bottom:8px;width:38px;height:64px;border:2px solid var(--accent);border-radius:52% 48% 42% 58%;transform:rotate(-18deg);background:var(--accent-soft);box-shadow:0 0 24px rgba(255,181,71,.45);animation:foot .34s ease-out both}
  .footprint:before{content:"";position:absolute;left:4px;top:-17px;width:8px;height:10px;border:2px solid var(--accent);border-radius:50%;box-shadow:10px -3px 0 -1px var(--bg),10px -3px 0 1px var(--accent),20px 1px 0 -1px var(--bg),20px 1px 0 1px var(--accent)}
  .route-list.k-enumeration{--enum-cols:1;position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:0}
  .route-list.k-enumeration>.it{position:relative;width:1360px;min-height:116px;box-sizing:border-box;padding:14px 28px;display:grid;grid-template-columns:70px 150px 390px 1fr 150px;align-items:center;gap:20px;border-color:var(--line);background:var(--panel);box-shadow:0 12px 30px rgba(0,0,0,.18);opacity:0;transform:translateY(14px);animation:arrive .38s ease-out forwards}
  .route-list .it:nth-child(odd){align-self:flex-start;margin-left:12px}
  .route-list .it:nth-child(even){align-self:flex-end;margin-right:12px}
  .route-list .it:after{content:"";position:absolute;top:50%;left:calc(50% - 34px);width:68px;height:2px;background:var(--primary);opacity:.75}
  .route-list .it:nth-child(1){animation-delay:.12s}
  .route-list .it:nth-child(2){animation-delay:.24s}
  .route-list .it:nth-child(3){animation-delay:.36s}
  .route-list .it:nth-child(4){animation-delay:.48s}
  .route-list .it:nth-child(5){animation-delay:.60s}
  .node{position:absolute;top:50%;width:18px;height:18px;border:3px solid var(--primary);border-radius:50%;background:var(--bg);transform:translateY(-50%);box-shadow:0 0 18px rgba(53,194,178,.34)}
  .route-list .it:nth-child(odd) .node{left:calc(50% - 10px)}
  .route-list .it:nth-child(even) .node{right:calc(50% - 10px)}
  .route-list .it:first-child .node{border-color:var(--accent);background:var(--accent);box-shadow:0 0 22px rgba(255,181,71,.55)}
  .route-list .it>span:not(.node),.route-list .it>h2{align-self:stretch;display:flex;align-items:center}
  .seq{font:700 18px/1 var(--font-mono);letter-spacing:.08em;color:var(--muted)}
  .route-list .it:first-child .seq{color:var(--accent)}
  .route-list .it>.it-title{margin:0;font-size:20px;line-height:1.2;color:var(--primary-bright)}
  .probe{font-size:var(--fs-sec);line-height:1.45;color:var(--text)}
  .phase{justify-self:stretch;font:650 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.06em;color:var(--faint)}
  .route-list .it:nth-child(odd) .probe{grid-column:3 / 5}
  .route-list .it:nth-child(even){grid-template-columns:150px 1fr 70px 150px 390px}
  .route-list .it:nth-child(even) .phase{grid-column:1 / 3;grid-row:1;justify-self:stretch}
  .route-list .it:nth-child(even) .seq{grid-column:3}
  .route-list .it:nth-child(even) .it-title{grid-column:4}
  .route-list .it:nth-child(even) .probe{grid-column:5}
  .route-foot{height:76px;display:flex;align-items:flex-end;justify-content:space-between;z-index:2}
  .route-note{align-self:stretch;display:flex;align-items:center;width:1040px;margin:0;padding-left:18px;border-left:2px solid var(--primary);font-size:var(--fs-sec);line-height:1.45;color:var(--muted)}
  .ledger-mark{font:600 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em;color:var(--faint)}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes arrive{to{opacity:1;transform:translateY(0)}}
  @keyframes foot{from{opacity:0;transform:rotate(-18deg) scale(.7)}to{opacity:1;transform:rotate(-18deg) scale(1)}}
  @media (prefers-reduced-motion:reduce){.route-line path,.footprint,.route-list.k-enumeration>.it{animation:none;opacity:1;transform:none}.footprint{transform:rotate(-18deg)}.route-line path{stroke-dashoffset:0}}
</style>
</head>
<body data-page="02" data-total="48">
<div id="stage">
  <header class="route-head" style="height:148px">
    <div>
      <div class="route-kicker">ROUTE MAP · 全课路线</div>
      <h1>人如何走到太空？</h1>
    </div>
    <p class="route-question">全课沿身体、文化、知识、火箭、选择五层追问：人如何走到太空？</p>
  </header>

  <main class="route-field min0" style="flex:1" aria-label="五层课程路线图">
    <div class="blueprint" aria-hidden="true"></div>
    <div class="ghost-rings" aria-hidden="true"></div>
    <svg class="route-line" viewBox="0 0 180 620" preserveAspectRatio="none" aria-hidden="true">
      <path d="M72 596 C35 520,142 485,92 410 C45 340,142 292,90 220 C42 154,128 92,100 24"/>
      <ellipse class="orbit" cx="103" cy="28" rx="66" ry="18"/>
    </svg>
    <div class="footprint" aria-hidden="true"></div>
    <div class="earth-arc" aria-hidden="true"></div>

    <section class="route-list k-enumeration" aria-label="五组同级问题">
      <article class="it">
        <span class="node" aria-hidden="true"></span><span class="seq">01</span><h2 class="it-title">身体</h2><span class="probe">我们的身体如何成为今天这样？</span><span class="phase">第一幕 · 03—11</span>
      </article>
      <article class="it">
        <span class="node" aria-hidden="true"></span><span class="seq">02</span><h2 class="it-title">文化</h2><span class="probe">技能怎样越过一个人的一生？</span><span class="phase">第二幕 · 12—21</span>
      </article>
      <article class="it">
        <span class="node" aria-hidden="true"></span><span class="seq">03</span><h2 class="it-title">知识</h2><span class="probe">感官、记忆与纠错怎样移到身体外？</span><span class="phase">第三幕 · 22—31</span>
      </article>
      <article class="it">
        <span class="node" aria-hidden="true"></span><span class="seq">04</span><h2 class="it-title">火箭</h2><span class="probe">离开地球受哪些工程边界约束？</span><span class="phase">第四幕 · 32—40</span>
      </article>
      <article class="it">
        <span class="node" aria-hidden="true"></span><span class="seq">05</span><h2 class="it-title">选择</h2><span class="probe">谁承担风险，又由谁决定方向？</span><span class="phase">第五幕 · 41—48</span>
      </article>
    </section>
  </main>

  <footer class="route-foot" style="height:76px">
    <p class="route-note">这不是五级“升级阶梯”，而是接下来要依次打开的五组问题。</p>
    <span class="ledger-mark">FIVE QUESTIONS / ONE JOURNEY</span>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:2,total:48});</script>
</body>
</html>
