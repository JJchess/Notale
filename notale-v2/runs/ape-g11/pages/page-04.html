<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:28px 34px 26px;gap:16px}
  .eyebrow{color:var(--primary-bright);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em}
  .tree-shell{position:relative;overflow:hidden;border:2px solid var(--line);border-radius:var(--r-lg);background:linear-gradient(180deg,rgba(53,194,178,.035),transparent 35%),var(--panel-deep);box-shadow:var(--shadow)}
  #hominin-tree{position:absolute;inset:0;touch-action:none;cursor:grab}
  #hominin-tree:active{cursor:grabbing}
  #hominin-tree:focus-visible{outline:3px solid var(--focus);outline-offset:-5px}
  #hominin-tree svg{display:block;width:100%;height:100%}
  .hud{position:absolute;z-index:4;top:16px;right:16px;width:300px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:rgba(9,24,39,.92)}
  .progress-dot{width:12px;height:12px;border:2px solid var(--accent);border-radius:50%}.progress-dot.done{background:var(--accent);box-shadow:0 0 14px rgba(255,181,71,.5)}
  .zoom-tools{position:absolute;z-index:4;right:16px;bottom:16px;display:flex;gap:8px}.zoom-tools button{min-width:48px;padding:0 12px}
  .feedback{position:absolute;z-index:4;left:116px;bottom:18px;max-width:650px;padding:10px 16px;border-left:3px solid var(--accent);border-radius:0 var(--r-sm) var(--r-sm) 0;background:rgba(9,24,39,.94);font-size:var(--fs-sec);line-height:var(--lh-text);visibility:hidden;opacity:0;transform:translateY(8px);transition:opacity 220ms ease-out,transform 220ms ease-out}.feedback.show{visibility:visible;opacity:1;transform:none}
  .tree-label{font:650 16px/1 var(--font-sans);fill:var(--text);paint-order:stroke;stroke:var(--panel-deep);stroke-width:5px}.range-label{font:14px/1 var(--font-mono);fill:var(--muted);paint-order:stroke;stroke:var(--panel-deep);stroke-width:4px}.axis-label{font:14px/1 var(--font-mono);fill:var(--muted)}
  .branch{fill:none;stroke:var(--text);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.branch.survivor{stroke:var(--primary)}.branch.uncertain{stroke-dasharray:5 6}.branch.active{stroke:var(--accent);stroke-width:7;filter:drop-shadow(0 0 7px rgba(255,181,71,.75))}
  .window{fill:rgba(255,181,71,.07);stroke:var(--accent);stroke-width:2;stroke-dasharray:7 6;opacity:.32}.window.found{opacity:1;fill:rgba(255,181,71,.14)}
  .endpoint{fill:var(--panel-deep);stroke:var(--text);stroke-width:3}.endpoint.live{fill:var(--primary);stroke:var(--primary-bright)}
  .overview-note{position:absolute;z-index:3;left:116px;top:18px;color:var(--muted);font-size:var(--fs-label)}
  .k-process.compact{height:66px;align-items:center}.k-process.compact>.step{padding:9px 14px;text-align:center;font-size:var(--fs-sec);line-height:1.35}.k-process.compact>.arw{flex-basis:28px}
  @media (prefers-reduced-motion:reduce){.feedback{transition:none}}
</style>
</head>
<body data-page="04" data-total="48">
<div id="stage">
  <header class="row between items-end" style="height:74px">
    <div><div class="eyebrow">BRANCHING LIVES · 04</div><h1>人族历史不是接力赛</h1></div>
    <p class="fs-lead muted" style="margin:0;max-width:630px">沿共同时间轴看分叉、重叠与终止：多种人族曾同时生活在地球上。</p>
  </header>

  <main class="tree-shell science-grid min0" style="flex:1">
    <div id="hominin-tree" class="no-pan" tabindex="0" role="application" aria-label="可缩放的人族分叉时间树。滚轮缩放，拖动平移；键盘加减号缩放，方向键平移。"></div>
    <div class="overview-note">距今年代 ↑　放大并移动，让橙色窗口进入画面中央</div>
    <section class="hud" aria-live="polite">
      <div class="row between items-center"><strong>三个共存窗口</strong><span id="count" class="mono accent">已找到 0/3</span></div>
      <div class="row gap-3 items-center" style="margin-top:10px"><span class="progress-dot"></span><span class="progress-dot"></span><span class="progress-dot"></span><span class="fs-label muted">中心对准后自动识别</span></div>
    </section>
    <div id="feedback" class="feedback">继续放大并沿时间轴移动，寻找两条同时延续的枝。</div>
    <div class="zoom-tools" aria-label="时间树缩放控件"><button id="zin" aria-label="放大时间树">＋</button><button id="zout" aria-label="缩小时间树">－</button><button id="reset">重看灌木</button></div>
  </main>

  <section class="k-process compact" style="height:66px" aria-label="时间灌木的阅读过程">
    <div class="axis"></div><div class="step">共同时间轴</div><div class="arw"></div><div class="step">支系分叉并延续</div><div class="arw"></div><div class="step is-current">同一高度并排＝共存</div><div class="arw"></div><div class="step">枝端灭绝／智人延续至今</div>
  </section>
  <footer class="row between items-center" style="height:54px">
    <div class="legend"><span><i class="legend-key"></i>仍存活的智人枝</span><span><i class="legend-key" style="background:var(--text)"></i>灭绝端点</span><span><i class="legend-key is-current"></i>共存窗口</span><span>虚线：连接关系仍有争议</span></div>
    <strong class="fs-body">今天只剩智人，不等于智人一直位于演化灌木的顶端。</strong>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  Deck.init({index:4,total:48});
  var T=Lec.K.timeline, P=Lec.P, min=T.agricultureBeginsYearsAgo, max=T.australopithecusAppearsYearsAgo;
  function y(age){return 64+P.logTimelineFraction(age,min,max)*632;}
  function ageLabel(age){return age>=1000000?(age/1000000).toFixed(age%1000000?1:0)+' Ma':Math.round(age/1000)+' ka';}
  var species=[
    {id:'afar',name:'南方古猿阿法种',start:T.australopithecusAppearsYearsAgo,end:T.homoGenusAppearsYearsAgo,x:335,root:520},
    {id:'habilis',name:'能人',start:T.homoGenusAppearsYearsAgo,end:T.homoErectusAppearsYearsAgo,x:560,root:520,uncertain:true},
    {id:'erectus',name:'直立人',start:T.homoErectusAppearsYearsAgo,end:T.majorOutOfAfricaYearsAgo,x:770,root:650},
    {id:'neander',name:'尼安德特人',start:T.homoSapiensAppearsYearsAgo,end:T.majorOutOfAfricaYearsAgo,x:965,root:770,uncertain:true},
    {id:'flores',name:'弗洛勒斯人',start:T.homoSapiensAppearsYearsAgo,end:T.agricultureBeginsYearsAgo,x:1160,root:770,uncertain:true},
    {id:'sapiens',name:'智人',start:T.homoSapiensAppearsYearsAgo,end:min,x:1340,root:770,live:true}
  ];
  var windows=[{ids:['habilis','erectus'],age:T.homoErectusAppearsYearsAgo,x:665},{ids:['erectus','sapiens'],age:T.majorOutOfAfricaYearsAgo,x:1055},{ids:['flores','sapiens'],age:T.agricultureBeginsYearsAgo,x:1250}];
  var svg=d3.select('#hominin-tree').append('svg').attr('viewBox','0 0 1440 760').attr('role','img').attr('aria-label','纵向距今年代的人族分叉时间树');
  var defs=svg.append('defs'); defs.append('clipPath').attr('id','treeclip').append('rect').attr('width',1440).attr('height',760);
  var g=svg.append('g').attr('clip-path','url(#treeclip)');
  g.append('path').attr('d','M120,706 L120,58').attr('stroke','var(--primary)').attr('stroke-width',3).attr('fill','none');
  var ticks=[T.australopithecusAppearsYearsAgo,T.homoGenusAppearsYearsAgo,T.homoErectusAppearsYearsAgo,T.homoSapiensAppearsYearsAgo,T.majorOutOfAfricaYearsAgo,T.agricultureBeginsYearsAgo];
  ticks.forEach(function(a){g.append('line').attr('x1',108).attr('x2',1400).attr('y1',y(a)).attr('y2',y(a)).attr('stroke','var(--line-soft)').attr('stroke-width',1);g.append('text').attr('class','axis-label').attr('x',22).attr('y',y(a)+5).text(ageLabel(a));});
  g.append('text').attr('class','tree-label').attr('x',1260).attr('y',45).attr('fill','var(--primary-bright)').text('现在');
  g.append('path').attr('class','branch uncertain').attr('d','M120,696 C230,680 250,650 335,'+y(T.australopithecusAppearsYearsAgo));
  species.forEach(function(d){var ys=y(d.start),ye=d.live?48:y(d.end);var path='M'+d.root+','+ys+' C'+((d.root+d.x)/2)+','+ys+' '+d.x+','+(ys-18)+' '+d.x+','+(ys-34)+' L'+d.x+','+ye;g.append('path').datum(d).attr('class','branch '+(d.live?'survivor ':'')+(d.uncertain?'uncertain':'')).attr('d',path);g.append('circle').attr('class','endpoint '+(d.live?'live':'')).attr('cx',d.x).attr('cy',ye).attr('r',7);g.append('text').attr('class','tree-label detail').attr('x',d.x+12).attr('y',Math.max(68,ye+5)).text(d.name);g.append('text').attr('class','range-label detail').attr('x',d.x+12).attr('y',Math.max(88,ye+25)).text(ageLabel(d.start)+' → '+(d.live?'现在':ageLabel(d.end)));});
  windows.forEach(function(w,i){g.append('rect').datum(w).attr('class','window').attr('x',w.x-92).attr('y',y(w.age)-40).attr('width',184).attr('height',80).attr('rx',18);g.append('text').attr('class','tree-label detail').attr('x',w.x).attr('y',y(w.age)+5).attr('text-anchor','middle').attr('fill','var(--accent)').text('共存窗口 '+(i+1));});
  var zoom=d3.zoom().scaleExtent([1,8]).translateExtent([[0,0],[1440,760]]).extent([[0,0],[1440,760]]).on('zoom',function(ev){g.attr('transform',ev.transform);g.selectAll('.detail').style('display',ev.transform.k<1.55?'none':null);detect(ev.transform);});
  svg.call(zoom).on('dblclick.zoom',null); g.selectAll('.detail').style('display','none');
  var found=[false,false,false], lastMessage=0, feedback=document.getElementById('feedback');
  function detect(tr){if(tr.k<1.8){hint('这里还看不出两条同时存在的枝，请继续放大。');return}var cx=(720-tr.x)/tr.k,cy=(380-tr.y)/tr.k,hit=-1,best=Infinity;windows.forEach(function(w,i){var dist=Math.hypot((cx-w.x)*.7,cy-y(w.age));if(dist<best){best=dist;hit=i}});if(best<135&&!found[hit]){found[hit]=true;reveal(hit);}}
  function hint(msg){var now=Date.now();if(now-lastMessage<1800)return;lastMessage=now;feedback.textContent=msg;feedback.classList.add('show');setTimeout(function(){feedback.classList.remove('show')},1500)}
  function reveal(i){windows.forEach(function(w,j){if(j===i){g.selectAll('.window').filter(function(d){return d===w}).classed('found',true);g.selectAll('.branch').filter(function(d){return d&&w.ids.indexOf(d.id)>=0}).classed('active',true).transition().duration(900).on('end',function(){d3.select(this).classed('active',false)})}});document.querySelectorAll('.progress-dot')[i].classList.add('done');var n=found.filter(Boolean).length;document.getElementById('count').textContent='已找到 '+n+'/3';feedback.textContent='它们在时间上重叠，并非前后接班。';feedback.classList.add('show');if(n===3)setTimeout(finish,1100);}
  function finish(){feedback.textContent='三处重叠同时存在：这是一株灌木，不是一条接力线。';svg.transition().duration(Deck.reduced()?0:900).call(zoom.transform,d3.zoomIdentity).on('end',function(){g.selectAll('.window.found').classed('active',true);});}
  function scaleBy(k){svg.transition().duration(Deck.reduced()?0:260).call(zoom.scaleBy,k)}
  document.getElementById('zin').onclick=function(){scaleBy(1.5)};document.getElementById('zout').onclick=function(){scaleBy(1/1.5)};
  document.getElementById('reset').onclick=function(){found=[false,false,false];document.querySelectorAll('.progress-dot').forEach(function(d){d.classList.remove('done')});document.getElementById('count').textContent='已找到 0/3';g.selectAll('.window').classed('found',false);svg.call(zoom.transform,d3.zoomIdentity);feedback.classList.remove('show')};
  document.getElementById('hominin-tree').addEventListener('keydown',function(e){var t=d3.zoomTransform(svg.node());if(e.key==='+'||e.key==='='){scaleBy(1.4);e.preventDefault()}else if(e.key==='-'){scaleBy(1/1.4);e.preventDefault()}else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(e.key)>=0){var dx=e.key==='ArrowLeft'?70:e.key==='ArrowRight'?-70:0,dy=e.key==='ArrowUp'?70:e.key==='ArrowDown'?-70:0;svg.call(zoom.transform,t.translate(dx/t.k,dy/t.k));e.preventDefault()}});
  if(!Deck.reduced()){g.selectAll('.branch').attr('stroke-dasharray',function(){var n=this.getTotalLength();return n+' '+n}).attr('stroke-dashoffset',function(){return this.getTotalLength()}).transition().delay(function(d,i){return i*70}).duration(850).ease(d3.easeCubicOut).attr('stroke-dashoffset',0).on('end',function(d){if(d&&d.uncertain)d3.select(this).attr('stroke-dasharray','5 6');else d3.select(this).attr('stroke-dasharray',null)});}
})();
</script>
</body>
</html>
