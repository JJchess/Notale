<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:30px 48px 28px}
  .eyebrow{color:var(--primary-bright);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.16em}
  .headtake{margin:7px 0 0;color:var(--muted);font-size:var(--fs-lead);line-height:var(--lh-text)}
  .status{min-width:190px;text-align:right}
  .dots{display:flex;justify-content:flex-end;gap:9px;margin-top:8px}
  .dots i{width:11px;height:11px;border:2px solid var(--line);border-radius:50%;background:var(--bg)}
  .dots i.on{border-color:var(--primary);background:var(--primary);box-shadow:0 0 14px rgba(53,194,178,.7)}
  .timeline-shell{position:relative;overflow:hidden;border:2px solid var(--line);border-radius:var(--r-lg);background:linear-gradient(180deg,rgba(53,194,178,.045),transparent 55%),var(--panel-deep);box-shadow:var(--shadow)}
  #chart{display:block;width:100%;height:100%}.axis text{fill:var(--muted);font:14px var(--font-mono)}.axis path,.axis line{stroke:var(--line)}
  .row-label{fill:var(--text);font:650 15px var(--font-sans)}.window-label{fill:var(--primary-bright);font:15px var(--font-sans)}
  .marker{cursor:grab;outline:none}.marker:focus .marker-ring{stroke:var(--focus);stroke-width:4}.marker.locked{cursor:default}
  .marker-ring{fill:var(--panel);stroke:var(--accent);stroke-width:3}.marker-icon{fill:var(--accent);font:700 19px var(--font-sans);pointer-events:none}
  .timeline-shell.complete .non-key{opacity:.22}.timeline-shell.complete .key-row{opacity:1}
  .feedback{min-height:27px;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-text)}
  .feedback.error{color:var(--danger)}.feedback.success{color:var(--primary-bright)}
  .process-mini{height:72px;align-items:center}.process-mini>.step{padding:12px 16px;text-align:center;font-size:var(--fs-sec)}
  .conclusion{display:none;align-items:center;gap:20px;padding:14px 20px;border-left:6px solid var(--accent);background:var(--accent-soft);font-size:var(--fs-lead);line-height:1.45}.conclusion.show{display:flex}
  .reset{display:none}.reset.show{display:inline-flex}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="07" data-total="48">
<div id="stage">
  <header class="row between items-start" style="height:104px">
    <div>
      <div class="eyebrow">MOSAIC EVOLUTION · 07</div>
      <h1>身体没有同时升级</h1>
      <p class="headtake">把四项特征放回证据时间窗，比较它们出现的先后。</p>
    </div>
    <div class="status" aria-live="polite">
      <div class="fs-label muted">定位进度</div>
      <div id="count" class="fs-h2 mono primary">已定位 0/4</div>
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </div>
  </header>

  <main class="col min0 gap-3" style="flex:1">
    <section class="timeline-shell min0 no-pan" style="flex:1" aria-label="四项身体特征的共享年代轴">
      <svg id="chart" role="img" aria-labelledby="chart-title chart-desc">
        <title id="chart-title">特征时间错位尺</title>
        <desc id="chart-desc">四行使用同一条对数年代轴。拖动每行橙色标记进入青绿色证据时间窗；聚焦标记后可用左右方向键移动，按回车确认。</desc>
      </svg>
    </section>

    <section class="panel-flat row items-center between gap-4 px-4" style="height:82px">
      <div>
        <div class="fs-label primary">操作台</div>
        <div id="feedback" class="feedback">拖动橙色标记；键盘可用 ← → 移动，Enter 确认。</div>
      </div>
      <div class="legend" aria-label="图例"><span><i class="legend-key"></i>证据时间窗</span><span><i class="legend-key is-current"></i>待定位特征</span><span>时间窗表示范围，不是精确“生日”</span></div>
      <button id="reset" class="reset" type="button">一键重置</button>
    </section>

    <section class="k-process process-mini" style="height:72px" aria-label="从较早出现到较晚显著变化的过程">
      <div class="axis"></div>
      <div class="step is-past">较早：步态证据</div><div class="arw" aria-hidden="true"></div>
      <div class="step">结构逐项错开</div><div class="arw" aria-hidden="true"></div>
      <div class="step is-current">较晚：大脑快速增大</div>
    </section>

    <section id="conclusion" class="conclusion" style="height:76px" aria-live="polite">
      <strong class="accent">明显早于</strong>
      <span>两足行走明显早于大脑快速增大。所谓“成为人”不是一组特征同时开启，而是不同时期、不同支系上的拼接。</span>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  Deck.init({index:7,total:48});
  var T=Lec.K.timeline, M=Lec.K.math;
  var min=T.homoSapiensAppearsYearsAgo, max=T.humanChimpLastCommonAncestorYearsAgo;
  var data=[
    {id:'walk',label:'两足行走的早期证据',icon:'足',a:T.australopithecusAppearsYearsAgo,b:T.humanChimpLastCommonAncestorYearsAgo,result:'很早已出现',key:true},
    {id:'teeth',label:'犬齿与咀嚼结构变化',icon:'齿',a:T.homoGenusAppearsYearsAgo,b:T.australopithecusAppearsYearsAgo,result:'与步态不完全同步'},
    {id:'hand',label:'手部精细操作能力',icon:'手',a:T.homoErectusAppearsYearsAgo,b:T.homoGenusAppearsYearsAgo,result:'逐步形成、非单点完成'},
    {id:'brain',label:'大脑快速增大',icon:'脑',a:T.homoSapiensAppearsYearsAgo,b:T.homoErectusAppearsYearsAgo,result:'明显晚于早期两足行走',key:true}
  ];
  var svg=d3.select('#chart'), done=new Set(), current={};
  var W,H,margin={top:24,right:36,bottom:38,left:132}, innerW, x, rows;
  function frac(y){return Lec.P.logTimelineFraction(y,min,max)}
  function pos(y){return innerW*frac(y)}
  function fmt(y){var million=Lec.K.math.million;return '约 '+Lec.P.formatFixed(y/million, y>=million?1:2)+' 百万年前'}
  function render(){
    var box=document.querySelector('.timeline-shell'); W=box.clientWidth; H=box.clientHeight;
    svg.attr('viewBox','0 0 '+W+' '+H); svg.selectAll('*:not(title):not(desc)').remove();
    innerW=W-margin.left-margin.right; x=function(y){return margin.left+pos(y)};
    var g=svg.append('g');
    g.append('text').attr('x',margin.left).attr('y',18).attr('fill','var(--muted)').attr('font-size',14).text('更久以前  →  接近现在');
    var ticks=[max,T.australopithecusAppearsYearsAgo,T.homoGenusAppearsYearsAgo,T.homoErectusAppearsYearsAgo,min];
    g.append('g').attr('class','axis').attr('transform','translate(0,'+(H-margin.bottom)+')')
      .call(d3.axisBottom(d3.scaleLinear().domain([0,innerW]).range([margin.left,W-margin.right])).tickValues(ticks.map(pos)).tickFormat(function(p){var y=ticks.reduce(function(best,v){return Math.abs(pos(v)-p)<Math.abs(pos(best)-p)?v:best},ticks[0]);return Lec.P.formatFixed(y/Lec.K.math.million,y>=Lec.K.math.million?1:2)+' Ma'}));
    var top=52, gap=(H-margin.bottom-top)/data.length;
    rows=g.selectAll('.feature-row').data(data).join('g').attr('class',function(d){return 'feature-row '+(d.key?'key-row':'non-key')}).attr('transform',function(d,i){return 'translate(0,'+(top+i*gap+gap/2)+')'});
    rows.append('text').attr('class','row-label').attr('x',margin.left-16).attr('text-anchor','end').attr('dy',5).text(function(d){return d.label});
    rows.append('line').attr('x1',margin.left).attr('x2',W-margin.right).attr('stroke','var(--line-soft)').attr('stroke-width',2);
    rows.append('rect').attr('x',function(d){return Math.min(x(d.a),x(d.b))}).attr('y',-12).attr('width',function(d){return Math.abs(x(d.a)-x(d.b))}).attr('height',24).attr('rx',12).attr('fill','rgba(53,194,178,.14)').attr('stroke','var(--primary)').attr('stroke-width',2);
    rows.append('text').attr('class','window-label').attr('x',function(d){return (x(d.a)+x(d.b))/2}).attr('y',-18).attr('text-anchor','middle').style('opacity',function(d){return done.has(d.id)?1:0}).text(function(d){return fmt((d.a+d.b)/2)+' · '+d.result});
    rows.each(function(d,i){if(current[d.id]==null)current[d.id]=innerW*.82; makeMarker(d3.select(this),d,i)});
    if(done.size===data.length) drawBracket(g,top,gap);
  }
  function makeMarker(row,d,i){
    var p=done.has(d.id)?(pos(d.a)+pos(d.b))/2:current[d.id]; current[d.id]=p;
    var m=row.append('g').datum(d).attr('class','marker'+(done.has(d.id)?' locked':''))
      .attr('transform','translate('+(margin.left+p)+',0)').attr('tabindex',done.has(d.id)?-1:0).attr('role','button')
      .attr('aria-label',d.label+'，用左右方向键移动，回车确认');
    m.append('circle').attr('class','marker-ring').attr('r',17); m.append('text').attr('class','marker-icon').attr('text-anchor','middle').attr('dy',7).text(d.icon);
    if(!done.has(d.id)) m.call(d3.drag().on('drag',function(ev){current[d.id]=Deck.clamp(ev.x-margin.left,0,innerW);m.attr('transform','translate('+(margin.left+current[d.id])+',0)')}).on('end',function(){check(d,m)}));
    m.on('keydown',function(ev){if(done.has(d.id))return;var step=innerW/40;if(ev.key==='ArrowLeft'||ev.key==='ArrowRight'){ev.preventDefault();current[d.id]=Deck.clamp(current[d.id]+(ev.key==='ArrowRight'?step:-step),0,innerW);m.attr('transform','translate('+(margin.left+current[d.id])+',0)')}else if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();check(d,m)}});
  }
  function check(d,m){var lo=Math.min(pos(d.a),pos(d.b)),hi=Math.max(pos(d.a),pos(d.b));if(current[d.id]>=lo&&current[d.id]<=hi){done.add(d.id);current[d.id]=(lo+hi)/2;feedback('已定位：'+d.label+'。'+d.result+'。','success');render();update()}else{feedback('这个特征的证据不在这一时段，再比较左右的早晚关系。','error');var target=margin.left+current[d.id];if(!Deck.reduced())m.transition().duration(70).attr('transform','translate('+(target-10)+',0)').transition().duration(70).attr('transform','translate('+(target+10)+',0)').transition().duration(70).attr('transform','translate('+target+',0)')}}
  function drawBracket(g,top,gap){var a=top+gap/2,b=top+gap*3+gap/2,xx=(x(T.australopithecusAppearsYearsAgo)+x(T.homoErectusAppearsYearsAgo))/2;g.append('path').attr('d','M'+(xx+14)+','+a+'H'+xx+'V'+b+'H'+(xx+14)).attr('fill','none').attr('stroke','var(--accent)').attr('stroke-width',4);g.append('text').attr('x',xx+22).attr('y',(a+b)/2+5).attr('fill','var(--accent)').attr('font-size',16).attr('font-weight',700).text('明显早于')}
  function feedback(t,c){var el=document.getElementById('feedback');el.textContent=t;el.className='feedback '+c}
  function update(){document.getElementById('count').textContent='已定位 '+done.size+'/'+data.length;document.querySelectorAll('.dots i').forEach(function(n,i){n.classList.toggle('on',i<done.size)});var complete=done.size===data.length;document.querySelector('.timeline-shell').classList.toggle('complete',complete);document.getElementById('conclusion').classList.toggle('show',complete);document.getElementById('reset').classList.toggle('show',complete);if(complete)feedback('四项证据窗彼此错开：身体特征不是同步开启。','success')}
  document.getElementById('reset').addEventListener('click',function(){done.clear();current={};document.getElementById('conclusion').classList.remove('show');feedback('拖动橙色标记；键盘可用 ← → 移动，Enter 确认。','');render();update()});
  Deck.onResize(render); render(); update();
})();
</script>
</body>
</html>
