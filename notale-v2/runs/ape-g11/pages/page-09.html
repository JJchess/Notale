<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:28px 42px 26px;gap:16px}
  .kicker{color:var(--accent);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em}
  .head{height:82px;align-items:flex-end}
  .take{max-width:760px;text-align:right;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-text)}
  .env-track{height:78px;position:relative;display:flex;align-items:center;gap:14px;padding:0 24px}
  .env-track::before{content:"";position:absolute;left:46px;right:46px;top:38px;height:2px;background:linear-gradient(90deg,var(--primary),var(--line),transparent)}
  .env-node{position:relative;z-index:1;flex:1;display:flex;align-items:center;gap:12px;color:var(--faint);font-size:var(--fs-label);font-weight:700}
  .env-node .dot{width:18px;height:18px;flex:none;border:3px solid var(--line);border-radius:50%;background:var(--bg)}
  .env-node.current{color:var(--accent)} .env-node.current .dot{border-color:var(--accent);background:var(--accent);box-shadow:0 0 20px rgba(255,181,71,.55)}
  .env-node.done{color:var(--primary-bright)} .env-node.done .dot{border-color:var(--primary);background:var(--primary)}
  .env-node.locked span:last-child{filter:blur(4px);opacity:.35}
  .game-shell{position:relative;display:flex;gap:18px;min-height:0}
  .world{flex:1;min-width:0;position:relative;padding:18px 20px;overflow:hidden}
  .world::before{content:"";position:absolute;left:5%;right:5%;bottom:30px;height:2px;background:linear-gradient(90deg,transparent,var(--primary),transparent);opacity:.38}
  .world-top{height:48px}
  .environment{font-size:var(--fs-h2);font-weight:760;color:var(--accent)}
  .criterion{color:var(--muted);font-size:var(--fs-sec)}
  .population{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;min-height:0;margin-top:10px;outline:none}
  .organism{position:relative;min-height:190px;padding:28px 10px 18px;border:2px solid var(--line);border-radius:var(--r-md);background:var(--panel-deep);color:var(--text);cursor:pointer;transition:transform 220ms ease-out,border-color 220ms ease-out,background 220ms ease-out}
  .organism::before{content:"";display:block;width:58px;height:58px;margin:0 auto 18px;border:3px solid var(--primary);border-radius:48% 52% 44% 56%;background:radial-gradient(circle at 35% 35%,var(--primary-bright) 0 3px,transparent 4px),var(--primary-soft)}
  .organism .id{text-align:center;color:var(--faint);font:700 var(--fs-label)/1.3 var(--font-mono)}
  .traits{display:flex;justify-content:center;gap:5px;margin-top:7px;flex-wrap:wrap}
  .trait{padding:2px 6px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:var(--fs-label);line-height:1.35}
  .organism.active{outline:3px solid var(--focus);outline-offset:2px}
  .organism.selected{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-5px)}
  .organism.selected::after{content:"繁殖";position:absolute;top:7px;right:7px;color:var(--primary-bright);font-size:var(--fs-label);font-weight:700}
  .organism.shake{animation:shake 260ms ease-in-out}
  @keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
  .side{width:360px;min-width:0;display:flex;flex-direction:column;gap:14px}
  .breeder{flex:1;min-height:0}
  .slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .slot{height:112px;display:flex;align-items:center;justify-content:center;border:2px dashed var(--line);border-radius:var(--r-sm);color:var(--faint);font-size:var(--fs-label)}
  .slot.filled{border-style:solid;border-color:var(--primary);color:var(--primary-bright);background:var(--primary-soft)}
  .feedback{min-height:50px;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-text)}
  .feedback.bad{color:var(--danger)} .feedback.good{color:var(--success)}
  .controls{display:flex;gap:10px}.controls button{flex:1;font-size:var(--fs-label)}
  .result{display:none;height:100%}.result.show{display:flex}
  .thumbs{display:flex;gap:12px}.thumb{flex:1;padding:12px;border:2px solid var(--line);border-radius:var(--r-sm);background:var(--panel-deep)}
  .mini-pop{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.mini-pop i{width:11px;height:11px;border-radius:50%;background:var(--primary)}
  .result-claim{font-size:27px;font-weight:780;color:var(--accent)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="09" data-total="48">
<div id="stage">
  <header class="head row between min0" style="height:82px">
    <div><div class="kicker">SELECTION ≠ DESTINY</div><h1>环境没有终点线</h1></div>
    <div class="take">自然选择筛选已有差异，并不会预先知道“太空人”这一目标。</div>
  </header>
  <div id="envTrack" class="env-track panel-flat" style="height:78px" aria-label="环境轮次"></div>
  <main class="game-shell min0" style="flex:1">
    <section class="world panel science-grid min0">
      <svg aria-hidden="true" viewBox="0 0 1100 600" style="position:absolute;inset:72px 28px 18px;width:calc(100% - 56px);height:calc(100% - 90px);opacity:.34;pointer-events:none">
        <g fill="none" stroke="#35C2B2" stroke-width="3"><path d="M550 570V490M550 490L175 390M550 490L925 390M175 390L90 255M175 390L260 255M925 390L840 255M925 390L1010 255"/><path d="M90 255L55 120M90 255L125 120M260 255L225 120M260 255L295 120M840 255L805 120M840 255L875 120M1010 255L975 120M1010 255L1045 120"/></g>
        <g fill="#07111F" stroke="#FFB547" stroke-width="4"><circle cx="550" cy="490" r="10"/><circle cx="175" cy="390" r="8"/><circle cx="925" cy="390" r="8"/></g>
      </svg>
      <div id="playView" style="position:relative;z-index:1">
        <div class="world-top row between items-center min0">
          <div><div id="envName" class="environment"></div><div id="criterion" class="criterion"></div></div>
          <span id="roundReadout" class="chip is-current"></span>
        </div>
        <div class="k-classification">
          <div class="lv">
            <div class="box is-current">
              <div class="bt">同一种群中的已有差异</div>
              <div id="population" class="population no-pan" role="listbox" aria-label="候选个体。方向键移动，空格选择" tabindex="0"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="result" class="result col center gap-4" aria-live="polite">
        <div class="result-claim">没有永远最佳，只有当下筛选</div>
        <div id="thumbs" class="thumbs w-full"></div>
        <div class="note">自然选择只改变已有差异留下后代的机会；它没有未来蓝图，也不知道“太空人”这个目标。</div>
      </div>
    </section>
    <aside class="side min0">
      <div class="k-classification breeder">
        <div class="lv h-full"><div class="box h-full"><div class="bt">本轮繁殖者</div><div id="slots" class="slots"></div></div></div>
      </div>
      <div class="panel pad-3">
        <div id="selectedReadout" class="chip"></div>
        <div id="feedback" class="feedback" aria-live="polite">只依据当前环境和可见特征判断。</div>
        <div class="controls">
          <button id="confirm" class="is-target" type="button">确认繁殖者</button>
          <button id="next" type="button" hidden>下一轮</button>
          <button id="reset" type="button" hidden>用同一种群重来</button>
        </div>
      </div>
    </aside>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
(function(){
  Deck.init({index:9,total:48});
  var labels=['第 1 轮：寒冷','第 2 轮：干旱','第 3 轮：洪水'];
  var traits=[['厚毛','薄毛'],['节水','高耗水'],['善游','不善游']];
  var wanted=['厚毛','节水','善游'];
  var criteria=['厚毛个体在寒冷中更可能繁殖','节水个体在干旱中更可能繁殖','善游个体在洪水中更可能繁殖'];
  var state, histories, active=0, initial;
  var pop=document.getElementById('population'), feedback=document.getElementById('feedback');
  function shuffle(a,rng){for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function makeInitial(){var rng=new Math.seedrandom('apeman-spaceman-p09'),a=[];for(var i=0;i<12;i++)a.push({id:i+1,t:[traits[0][i%2],traits[1][Math.floor(i/2)%2],traits[2][Math.floor(i/4)%2]]});return shuffle(a,rng)}
  function init(){initial=makeInitial();state={round:0,pop:JSON.parse(JSON.stringify(initial)),selected:[],confirmed:false,done:false};histories=[];active=0;render();}
  function render(){
    document.getElementById('envTrack').innerHTML=labels.map(function(x,i){var c=i<state.round?'done':i===state.round?'current':'locked';return '<div class="env-node '+c+'"><i class="dot"></i><span>'+(i>state.round?'未来环境':x)+'</span></div>'}).join('');
    document.getElementById('envName').textContent=labels[state.round]||''; document.getElementById('criterion').textContent=criteria[state.round]||'';
    document.getElementById('roundReadout').textContent='第 '+(state.round+1)+' / 3 轮';
    pop.innerHTML=state.pop.map(function(o,i){return '<div id="org-'+i+'" class="organism '+(state.selected.indexOf(i)>-1?'selected ':'')+(i===active?'active':'')+'" role="option" aria-selected="'+(state.selected.indexOf(i)>-1)+'" data-i="'+i+'"><div class="id">个体 '+String(o.id).padStart(2,'0')+'</div><div class="traits">'+o.t.map(function(t){return '<span class="trait">'+t+'</span>'}).join('')+'</div></div>'}).join('');
    document.getElementById('slots').innerHTML=[0,1,2,3].map(function(_,i){return '<div class="slot '+(state.selected[i]!==undefined?'filled':'')+'">'+(state.selected[i]!==undefined?'个体 '+String(state.pop[state.selected[i]].id).padStart(2,'0'):'空位')+'</div>'}).join('');
    document.getElementById('selectedReadout').textContent='已选 '+state.selected.length+' / 4';
    document.getElementById('confirm').hidden=state.confirmed||state.done;document.getElementById('next').hidden=!state.confirmed||state.done;document.getElementById('reset').hidden=!state.done;
  }
  function choose(i){if(state.confirmed||state.done)return;active=i;var at=state.selected.indexOf(i);if(at>-1){state.selected.splice(at,1);feedback.textContent='已移回种群带。';feedback.className='feedback';render();return}
    if(state.pop[i].t[state.round]!==wanted[state.round]){render();var el=document.getElementById('org-'+i);el.classList.add('shake');feedback.textContent='这个特征不符合当前环境条件；请只依据本轮环境判断。';feedback.className='feedback bad';return}
    if(state.selected.length>=4){feedback.textContent='本轮繁殖槽已经选满。';feedback.className='feedback bad';return}
    state.selected.push(i);feedback.textContent='符合当前条件，已进入繁殖槽。';feedback.className='feedback good';render();
  }
  pop.addEventListener('click',function(e){var el=e.target.closest('.organism');if(el)choose(+el.dataset.i)});
  pop.addEventListener('keydown',function(e){if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp',' ','Enter'].indexOf(e.key)<0)return;e.preventDefault();if(e.key==='ArrowRight'||e.key==='ArrowDown')active=(active+1)%state.pop.length;else if(e.key==='ArrowLeft'||e.key==='ArrowUp')active=(active+state.pop.length-1)%state.pop.length;else return choose(active);render()});
  document.getElementById('confirm').onclick=function(){if(state.selected.length!==4){feedback.textContent='请选满 4 个符合当前环境的繁殖者。';feedback.className='feedback bad';return}state.confirmed=true;histories.push({label:labels[state.round],wanted:wanted[state.round],pop:JSON.parse(JSON.stringify(state.pop))});feedback.textContent='当前适配被保留；下一轮环境尚未揭示。';feedback.className='feedback good';render()};
  document.getElementById('next').onclick=function(){var old=state.pop,rng=new Math.seedrandom('apeman-spaceman-p09-next-'+state.round),next=[];for(var i=0;i<12;i++){var parent=old[state.selected[i%4]],tt=parent.t.slice();for(var k=state.round+1;k<3;k++)tt[k]=traits[k][Math.floor(rng()*2)];next.push({id:i+1,t:tt})}state.round++;state.pop=shuffle(next,rng);state.selected=[];state.confirmed=false;active=0;if(state.round>=3){state.done=true;showResult()}render()};
  function showResult(){document.getElementById('playView').hidden=true;document.getElementById('result').classList.add('show');document.getElementById('thumbs').innerHTML=histories.map(function(h){return '<div class="thumb"><strong>'+h.label+'</strong><div class="fs-label muted">优势：'+h.wanted+'</div><div class="mini-pop">'+h.pop.map(function(){return '<i></i>'}).join('')+'</div></div>'}).join('');feedback.textContent='环境改变，优势随之重排。';feedback.className='feedback good'}
  document.getElementById('reset').onclick=function(){document.getElementById('playView').hidden=false;document.getElementById('result').classList.remove('show');init()};
  init();
})();
</script>
</body>
</html>
