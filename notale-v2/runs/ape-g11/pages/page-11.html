<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .act-kicker{color:var(--primary-bright);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.16em}
  .title-wrap{max-width:16ch}
  .lineage-field{position:relative;min-height:0;overflow:hidden}
  .lineage-field svg{position:absolute;inset:0;width:100%;height:100%}
  .branch{fill:none;stroke:var(--primary);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 7px rgba(53,194,178,.22));stroke-dasharray:1;stroke-dashoffset:1;animation:grow 1.4s ease-out forwards}
  .branch.stop{opacity:.42}
  .branch.b1{animation-delay:.12s}.branch.b2{animation-delay:.24s}.branch.b3{animation-delay:.36s}.branch.b4{animation-delay:.48s}.branch.b5{animation-delay:.6s}.branch.b6{animation-delay:.72s}
  .branch.live{stroke:var(--primary);animation-delay:.84s}
  .ember-line{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:grow .55s 1.05s ease-out forwards;filter:drop-shadow(0 0 9px rgba(255,181,71,.55))}
  .end-dot{fill:var(--accent);opacity:0;animation:ignite .35s 1.38s ease-out forwards;filter:drop-shadow(0 0 18px rgba(255,181,71,.8))}
  .branch-label{position:absolute;padding:10px 14px;border-left:2px solid var(--primary);background:rgba(7,17,31,.88);font-size:var(--fs-sec);line-height:var(--lh-text);color:var(--muted)}
  .branch-label strong{display:block;color:var(--text);font-size:var(--fs-body)}
  .branch-label.current{border-color:var(--accent)}
  .branch-label.current strong{color:var(--accent)}
  .tiny-key{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:var(--fs-label)}
  .tiny-key i{display:block;width:34px;height:4px;border-radius:9px;background:var(--primary)}
  .tiny-key.dim i{opacity:.4}.tiny-key.now i{background:var(--accent)}
  .closing{border-top:1px solid var(--line-soft)}
  @keyframes grow{to{stroke-dashoffset:0}}
  @keyframes ignite{to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.branch,.ember-line{animation:none;stroke-dashoffset:0}.end-dot{animation:none;opacity:1}}
</style>
</head>
<body data-page="11" data-total="48">
<div id="stage">
  <header class="row between items-start pad-6" style="height:150px;padding-bottom:0">
    <div class="col gap-2 min0">
      <div class="act-kicker">END OF ACT I</div>
      <h1 class="title-wrap">我们站在一根仍存活的枝条上</h1>
    </div>
    <div class="legend" aria-label="图例" style="padding-top:20px">
      <span class="tiny-key"><i></i><span>亲缘分支</span></span>
      <span class="tiny-key dim"><i></i><span>终止的枝条</span></span>
      <span class="tiny-key now"><i></i><span>仍在延续</span></span>
    </div>
  </header>

  <main class="lineage-field min0" style="flex:1;margin:0 52px" aria-label="一株横向谱系灌木：共同根部多次分叉，多根枝条终止，仅一根延续到右侧。">
    <svg viewBox="0 0 1496 550" preserveAspectRatio="none" role="img" aria-labelledby="tree-title tree-desc">
      <title id="tree-title">横向展开的演化灌木</title>
      <desc id="tree-desc">所有分支等粗。截断枝表示灭绝，延续枝只表示尚存，不代表更高级。</desc>
      <path class="branch" pathLength="1" d="M35 390 C150 390 184 346 286 346 C380 346 420 302 514 302 C618 302 670 344 760 344"/>
      <path class="branch stop b1" pathLength="1" d="M174 374 C206 324 238 240 326 188 C372 161 420 160 468 160"/>
      <path class="branch stop b2" pathLength="1" d="M286 346 C335 390 367 438 454 462 C502 475 548 474 590 474"/>
      <path class="branch stop b3" pathLength="1" d="M410 318 C456 270 490 224 570 214 C624 207 668 222 710 242"/>
      <path class="branch stop b4" pathLength="1" d="M514 302 C570 350 600 410 684 426 C750 439 799 421 846 388"/>
      <path class="branch stop b5" pathLength="1" d="M622 320 C668 280 704 178 792 142 C856 116 916 128 968 166"/>
      <path class="branch stop b6" pathLength="1" d="M760 344 C804 296 850 260 928 264 C982 266 1026 288 1065 316"/>
      <path class="branch live" pathLength="1" d="M760 344 C850 366 912 350 994 350 C1084 350 1140 374 1218 374"/>
      <path class="ember-line" pathLength="1" d="M1218 374 C1280 374 1328 356 1382 356"/>
      <circle class="end-dot" cx="1392" cy="356" r="9"/>
      <circle class="end-dot" cx="1410" cy="344" r="4" style="animation-delay:1.48s"/>
      <circle class="end-dot" cx="1424" cy="362" r="3" style="animation-delay:1.56s"/>
    </svg>
    <div class="branch-label" style="left:5%;bottom:9%"><strong>共同根部</strong><span>共同祖先</span><span>，不是现代猿</span><div class="fs-sec">根线连接共同来源，不是一条升级起跑线。</div></div>
    <div class="branch-label" style="left:39%;top:8%"><strong>多次分叉</strong><span>多支共存</span><span>，也有灭绝</span><div class="fs-sec">分叉表示亲缘关系，截断表示这一支已灭绝。</div></div>
    <div class="branch-label current" style="right:5%;bottom:12%"><strong>现代人</strong><span>仍存活的一支</span><span>，不是顶端</span><div class="fs-sec">延续只表示尚存，不表示更高级或更接近目标。</div></div>
  </main>

  <section class="k-generalization closing" style="height:188px;margin:0 52px;padding:24px 0 30px">
    <div class="claim is-current row items-center gap-4" style="height:100%">
      <span class="act-kicker nowrap">第一幕结论</span>
      <span class="fs-lead">我们不是从灌木底端爬到顶端。</span>
      <span class="fs-lead accent">我们只是站在一根仍存活、仍向未知延伸的枝条上。</span>
    </div>
  </section>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:11,total:48});</script>
</body>
</html>
