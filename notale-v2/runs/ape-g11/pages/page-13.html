<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .eyebrow{color:var(--primary-bright);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em}
  .titlebar{box-sizing:border-box;padding:20px 42px 12px}
  .subtitle{margin:5px 0 0;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-text)}
  .feature-band{box-sizing:border-box;padding:8px 42px 12px}
  .feature-list{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
  .feature-list span{padding:8px 10px;border:1px solid var(--line-soft);border-radius:var(--r-sm);background:var(--panel-deep);color:var(--muted);font-size:var(--fs-label);line-height:1.4;text-align:center}
  .feature-list span::before{display:inline-block;width:13px;height:6px;margin-right:7px;border-radius:9px;background:var(--primary);content:"";vertical-align:middle}
  .work{padding:0 42px 20px}
  .compare{--compare-cols:150px minmax(610px,1.35fr) minmax(510px,1fr);height:100%;grid-template-rows:54px repeat(3,minmax(0,1fr));align-content:stretch}
  .compare .hdr{display:flex;align-items:center;justify-content:center}
  .compare .dim{display:flex;flex-direction:column;justify-content:center;text-align:left;padding:16px 18px}
  .mode-name{font-size:var(--fs-h2);line-height:var(--lh-title);color:var(--text)}
  .mode-tag{margin-top:4px;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
  .chain-cell{position:relative;display:flex;align-items:center;padding:14px 18px!important;overflow:hidden}
  .chain{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:11px;width:100%;align-items:center}
  .chain::before{position:absolute;left:5%;right:5%;top:50%;height:2px;background:var(--line);content:""}
  .node{position:relative;z-index:1;min-width:0;height:164px;padding:8px 7px;border:2px solid var(--line);border-radius:var(--r-sm);background:var(--panel-deep);transition:transform 260ms ease-out,border-color 220ms ease-out,box-shadow 220ms ease-out}
  .node.current{border-color:var(--accent);box-shadow:0 0 18px rgba(255,181,71,.24)}
  .node.new{animation:arrive 360ms cubic-bezier(.2,.8,.2,1)}
  .gen{display:block;text-align:center;color:var(--muted);font:var(--fs-tick)/1.35 var(--font-mono)}
  .pattern{display:block;width:100%;height:116px;margin-top:4px;overflow:visible}
  .feat{fill:var(--primary)}
  .feat.bad{fill:var(--faint);transform:rotate(-8deg);transform-origin:center}
  .feat.fixed{animation:correct 420ms ease-out}
  .future{opacity:.28}
  .chart-cell{grid-column:3;grid-row:2 / 5;padding:8px 12px 8px 4px!important;border-left:1px solid var(--line-soft)}
  #chart{width:100%;height:100%;min-height:0}
  .toolbar{padding:14px 42px 24px}
  .progress{min-width:138px;color:var(--accent);font:700 var(--fs-lead)/1.3 var(--font-mono)}
  .prompt{color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-text)}
  .conclusion{flex:1;padding:11px 18px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:var(--r-sm);font-size:var(--fs-lead);font-weight:700;line-height:var(--lh-text)}
  .shake{animation:shake 360ms ease-in-out}
  @keyframes arrive{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
  @keyframes correct{0%{background:var(--accent);transform:translateX(8px)}65%{background:var(--accent);transform:translateX(0)}100%{background:var(--primary)}}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  @media(prefers-reduced-motion:reduce){.node,.feat{transition:none!important;animation:none!important}.shake{animation:none!important}}
</style>
</head>
<body data-page="13" data-total="48">
<div id="stage">
  <header class="titlebar row between items-end" style="height:108px">
    <div>
      <div class="eyebrow">CULTURAL FIDELITY · 传递实验</div>
      <h1>模仿会漏掉什么？</h1>
      <p class="subtitle">同一件八特征图样、同样六代、同一随机序列；只改变下一代获得的信息。</p>
    </div>
    <div class="hand-scale">一掌大小的抽象结绳范本</div>
  </header>
  <div class="feature-band" style="height:54px">
    <div class="feature-list" aria-label="范本的八项特征"><span>结位</span><span>环向</span><span>长短</span><span>交叉</span><span>单双</span><span>间距</span><span>朝向</span><span>末端</span></div>
  </div>

  <main class="work min0" style="flex:1">
    <section class="k-comparison compare min0" aria-label="三种文化传递方式对照">
      <div class="hdr">传递条件</div><div class="hdr">同一范本 → 六代传递链</div><div class="hdr">逐代保真度</div>
      <div class="crow">
        <div class="dim"><span class="mode-name">只观察</span><span class="mode-tag">看结果 · 出错率较高</span></div>
        <div class="cell chain-cell"><div class="chain" id="chain-observe"></div></div>
        <div class="cell chart-cell"><div id="chart" role="img" aria-label="三种传递方式逐代保真度折线图"></div></div>
      </div>
      <div class="crow">
        <div class="dim"><span class="mode-name primary">有示范</span><span class="mode-tag">看过程 · 减少猜测</span></div>
        <div class="cell chain-cell"><div class="chain" id="chain-demo"></div></div>
      </div>
      <div class="crow">
        <div class="dim"><span class="mode-name accent">有纠错</span><span class="mode-tag">看过程＋指出偏差</span></div>
        <div class="cell chain-cell"><div class="chain" id="chain-correct"></div></div>
      </div>
    </section>
  </main>

  <footer class="toolbar row items-center gap-3" style="height:94px">
    <div class="progress" id="progress">第 0 / 6 代</div>
    <button class="is-target" id="next">传到下一代</button>
    <button id="compare">比较结论</button>
    <button id="reset">用同一种子重播</button>
    <div class="prompt" id="prompt" aria-live="polite">每次推进，三条链同步复制。</div>
    <div class="conclusion" id="conclusion" hidden>只看成品时，小误差会被下一代当成范本；示范减少猜测，纠错进一步阻止误差累积。</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:13,total:48});
  var names=['observe','demo','correct'];
  var labels=['只观察','有示范','有纠错'];
  var rates=[0.22,0.11,0.04];
  var colors=['#74879A','#35C2B2','#FFB547'];
  var generation=0, rng, states, histories, fixedNow;
  var chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
  function fidelity(bits){return Lec.P.ratio(bits.filter(Boolean).length,8);}
  function pct(v){return Lec.P.formatPercent(v);}
  function resetState(){
    rng=new Math.seedrandom('apeman-spaceman-p13');
    generation=0;
    states=names.map(function(){return Array(8).fill(true);});
    histories=names.map(function(){return [1];});
    fixedNow=names.map(function(){return Array(8).fill(false);});
    render(false);
  }
  function advance(){
    if(generation>=6)return;
    var draws=Array.from({length:8},function(){return rng();});
    var repair=Array.from({length:8},function(){return rng();});
    fixedNow=names.map(function(){return Array(8).fill(false);});
    states=states.map(function(prev,m){
      return prev.map(function(ok,i){
        if(!ok)return false;
        var failed=draws[i]<rates[m];
        if(m===2 && failed && repair[i]<0.75){fixedNow[m][i]=true;return true;}
        return !failed;
      });
    });
    generation++;
    states.forEach(function(s,m){histories[m].push(fidelity(s));});
    render(true);
    if(generation===6)finish();
  }
  function makeNode(bits,g,current,isNew,fixed){
    var n=document.createElement('div');
    n.className='node'+(current?' current':'')+(isNew?' new':'')+(g>generation?' future':'');
    var gt=document.createElement('span');gt.className='gen';gt.textContent='G'+g;n.appendChild(gt);
    var p=document.createElementNS('http://www.w3.org/2000/svg','svg');p.setAttribute('class','pattern');p.setAttribute('viewBox','0 0 100 68');p.setAttribute('aria-hidden','true');
    bits.forEach(function(ok,i){var f=document.createElementNS('http://www.w3.org/2000/svg','rect');f.setAttribute('x',String(3+(i%4)*25));f.setAttribute('y',String(8+Math.floor(i/4)*30));f.setAttribute('width',String(i%3===0?20:16));f.setAttribute('height',String(i%2===0?9:13));f.setAttribute('rx','5');f.setAttribute('class','feat'+(ok?'':' bad')+(fixed&&fixed[i]?' fixed':''));p.appendChild(f);});
    n.appendChild(p);return n;
  }
  function render(animate){
    names.forEach(function(name,m){
      var chain=document.getElementById('chain-'+name);chain.innerHTML='';
      for(var g=0;g<=6;g++){
        var bits=g<histories[m].length?(g===generation?states[m]:null):null;
        if(!bits){bits=Array(8).fill(true);if(g<=generation){var count=Math.round(histories[m][g]*8);bits=bits.map(function(_,i){return i<count;});}}
        chain.appendChild(makeNode(bits,g,g===generation,animate&&g===generation,g===generation?fixedNow[m]:null));
      }
    });
    document.getElementById('progress').textContent='第 '+generation+' / 6 代';
    document.getElementById('next').disabled=generation>=6;
    document.getElementById('prompt').textContent=generation?labels.map(function(x,i){return x+' '+pct(histories[i][generation]);}).join('　'):'每次推进，三条链同步复制。';
    chart.setOption({
      animationDuration:Deck.reduced()?0:300,
      backgroundColor:'transparent',textStyle:{color:'#E8F1F7',fontSize:16},
      grid:{left:48,right:18,top:24,bottom:38},
      tooltip:{trigger:'axis',textStyle:{fontSize:16},formatter:function(ps){return '第 '+ps[0].axisValue+' 代<br>'+ps.map(function(p){return p.marker+p.seriesName+'：'+pct(p.value/100);}).join('<br>');}},
      xAxis:{type:'value',name:'世代',min:0,max:6,interval:1,nameTextStyle:{fontSize:14,color:'#A9C0CF'},axisLabel:{fontSize:14,color:'#A9C0CF'},axisLine:{lineStyle:{color:'#285068'}},splitLine:{show:false}},
      yAxis:{type:'value',name:'保真度',min:0,max:100,nameTextStyle:{fontSize:14,color:'#A9C0CF'},axisLabel:{fontSize:14,color:'#A9C0CF',formatter:'{value}%'},axisLine:{show:true,lineStyle:{color:'#285068'}},splitLine:{lineStyle:{color:'rgba(53,194,178,.12)'}}},
      series:names.map(function(_,i){return {name:labels[i],type:'line',data:histories[i].map(function(v,g){return [g,v*100];}),lineStyle:{width:3,color:colors[i]},itemStyle:{color:colors[i]},symbolSize:generation===6?9:7,showSymbol:true};})
    },true);
  }
  function finish(){
    document.getElementById('conclusion').hidden=false;
    document.getElementById('prompt').hidden=true;
    document.getElementById('compare').classList.add('is-target');
  }
  document.getElementById('next').addEventListener('click',advance);
  document.getElementById('compare').addEventListener('click',function(){
    if(generation<6){var b=this;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');document.getElementById('prompt').textContent='先传满 6 代，才能比较误差怎样累积。';}
    else finish();
  });
  document.getElementById('reset').addEventListener('click',function(){document.getElementById('conclusion').hidden=true;document.getElementById('prompt').hidden=false;document.getElementById('compare').classList.remove('is-target');resetState();});
  window.addEventListener('resize',function(){chart.resize();});
  resetState();
})();
</script>
</body>
</html>
