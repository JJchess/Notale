<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page-head{padding:30px 44px 14px;flex:0 0 112px;box-sizing:border-box}
  .kicker{color:var(--primary-bright);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.14em}
  .take{margin:6px 0 0;color:var(--muted);font-size:var(--fs-lead);line-height:var(--lh-text)}
  .board-shell{margin:0 44px 22px;padding:16px 24px 18px;overflow:hidden}
  .board-shell>.bt{justify-content:space-between}
  .board-wrap{position:relative;flex:1;min-height:0}
  #fire-board{display:block;width:100%;height:100%;min-height:600px}
  .status-strip{position:absolute;left:28px;right:28px;bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:18px;pointer-events:none}
  #message{max-width:730px;padding:10px 16px;border-left:3px solid var(--primary);background:rgba(7,17,31,.88);font-size:var(--fs-sec);line-height:var(--lh-text)}
  #reset{pointer-events:auto;flex:0 0 auto}
  .branch-control{cursor:grab;outline:none}
  .branch-control:focus-visible .handle-ring{stroke:var(--focus);stroke-width:5px}
  .branch-control:active{cursor:grabbing}
  .svg-label{font:600 18px var(--font-sans);fill:var(--text)}
  .svg-sub{font:400 16px var(--font-sans);fill:var(--muted)}
  .svg-value{font:700 18px var(--font-mono);fill:var(--primary-bright)}
  .svg-center{font:700 18px var(--font-sans);fill:var(--text)}
  .svg-small{font:600 14px var(--font-sans);fill:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body data-page="14" data-total="48">
<div id="stage">
  <header class="page-head" style="height:112px">
    <div class="kicker">CULTURAL ENERGY · 火的作用</div>
    <h1>一堆火，四类收益</h1>
    <p class="take">把有限燃料在四类用途之间重新分配，比较同一技术怎样支持不同活动。</p>
  </header>

  <main class="k-classification panel board-shell min0" style="flex:1">
    <div class="bt"><span>上位类：火的作用</span><span class="fs-label muted">拖动四条径向把手 · 方向键每次调整一格</span></div>
    <div class="lv min0" style="flex:1">
      <div class="box board-wrap min0 no-pan">
        <svg id="fire-board" viewBox="0 0 960 620" role="img" aria-labelledby="svg-title svg-desc">
          <title id="svg-title">火的四类收益径向分配盘</title>
          <desc id="svg-desc">四条并列分支从中央火堆通往食物、安全、社交时间与环境利用。拖动各分支把手可重新分配总计一百单位燃料。</desc>
        </svg>
        <div class="status-strip">
          <div id="message" aria-live="polite">火不是单一用途的“烹饪工具”，而是同时支持食物、安全、社交时间与环境利用。</div>
          <button id="reset" type="button">重新分配</button>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  Deck.init({index:14,total:48});
  const TOTAL=100, STEP=5, MAX=70;
  const data=[
    {key:'food',name:'食物',label:'加热与处理',benefit:'食物更易咀嚼，部分食材更可食用',high:'更多食物得到稳定加热',angle:-90,value:25,icon:'锅石'},
    {key:'safe',name:'安全',label:'照明与威慑',benefit:'夜间可见度提高，部分动物更难接近',high:'营地边缘保持明亮',angle:0,value:25,icon:'警戒眼'},
    {key:'social',name:'社交时间',label:'延长共处',benefit:'天黑后仍可交谈、示范与照料',high:'共同活动延续到夜晚',angle:90,value:25,icon:'围坐手势'},
    {key:'env',name:'环境利用',label:'温暖与营地',benefit:'寒冷时保温，并支持进入更多环境',high:'低温环境中的停留能力提高',angle:180,value:25,icon:'寒冷地平线'}
  ];
  const svg=d3.select('#fire-board'), cx=480, cy=282, inner=92, outer=226;
  const primary='#35C2B2', accent='#FFB547', low='#60758A', panel='#0E2033';
  const radial=d=>{const a=d.angle*Math.PI/180;return [cx+Math.cos(a)*outer,cy+Math.sin(a)*outer]};
  const point=(d,r)=>{const a=d.angle*Math.PI/180;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
  const percent=v=>Lec.P.formatPercent(v/TOTAL,0);

  const defs=svg.append('defs');
  const glow=defs.append('filter').attr('id','glow').attr('x','-80%').attr('y','-80%').attr('width','260%').attr('height','260%');
  glow.append('feGaussianBlur').attr('stdDeviation',8).attr('result','b');
  const merge=glow.append('feMerge'); merge.append('feMergeNode').attr('in','b'); merge.append('feMergeNode').attr('in','SourceGraphic');

  const root=svg.append('g');
  root.append('circle').attr('cx',cx).attr('cy',cy).attr('r',inner+28).attr('fill','none').attr('stroke','#285068').attr('stroke-dasharray','3 10');
  const branch=root.selectAll('.branch').data(data).join('g').attr('class','branch');
  branch.append('line').attr('class','track').attr('x1',d=>point(d,inner+18)[0]).attr('y1',d=>point(d,inner+18)[1]).attr('x2',d=>radial(d)[0]).attr('y2',d=>radial(d)[1]).attr('stroke',primary).attr('stroke-width',8).attr('stroke-linecap','round').attr('opacity',.22);
  branch.append('line').attr('class','fill').attr('x1',d=>point(d,inner+18)[0]).attr('y1',d=>point(d,inner+18)[1]).attr('stroke',primary).attr('stroke-width',8).attr('stroke-linecap','round');
  branch.append('circle').attr('class','end-node').attr('cx',d=>radial(d)[0]).attr('cy',d=>radial(d)[1]).attr('r',9).attr('fill',panel).attr('stroke',primary).attr('stroke-width',3);

  const control=branch.append('g').attr('class','branch-control').attr('tabindex',0).attr('role','slider').attr('aria-valuemin',0).attr('aria-valuemax',MAX)
    .attr('aria-label',d=>d.name+'燃料分配')
    .on('keydown',function(e,d){if(['ArrowUp','ArrowRight'].includes(e.key)){e.preventDefault();setValue(d,d.value+STEP,this)}if(['ArrowDown','ArrowLeft'].includes(e.key)){e.preventDefault();setValue(d,d.value-STEP,this)}});
  control.append('circle').attr('class','handle-ring').attr('r',17).attr('fill','#091827').attr('stroke',primary).attr('stroke-width',3);
  control.append('circle').attr('r',6).attr('fill',accent);

  control.call(d3.drag().on('drag',function(e,d){
    const a=d.angle*Math.PI/180, projection=(e.x-cx)*Math.cos(a)+(e.y-cy)*Math.sin(a);
    const raw=(projection-(inner+18))/(outer-(inner+18))*MAX;
    setValue(d,Math.round(raw/STEP)*STEP,this);
  }));

  const label=branch.append('g').attr('class','branch-label').attr('transform',d=>{
    const radius=d.angle===-90?172:(d.angle===90?238:280);
    const p=point(d,radius); return `translate(${p[0]},${p[1]})`;
  });
  label.append('rect').attr('x',d=>d.angle===180?-225:d.angle===0?0:-120).attr('y',d=>d.angle===-90?-88:d.angle===90?0:-42).attr('width',240).attr('height',88).attr('rx',12).attr('fill','#091827').attr('stroke','#285068').attr('stroke-width',2);
  label.append('text').attr('class','svg-label').attr('text-anchor',d=>d.angle===180?'end':d.angle===0?'start':'middle').attr('x',d=>d.angle===180?-14:d.angle===0?14:0).attr('y',d=>d.angle===-90?-60:d.angle===90?27:-17).text(d=>d.name+' · '+d.label);
  label.append('text').attr('class','svg-sub').attr('text-anchor',d=>d.angle===180?'end':d.angle===0?'start':'middle').attr('x',d=>d.angle===180?-14:d.angle===0?14:0).attr('y',d=>d.angle===-90?-34:d.angle===90?53:9).text(d=>d.benefit);
  label.append('text').attr('class','svg-value').attr('text-anchor',d=>d.angle===180?'end':d.angle===0?'start':'middle').attr('x',d=>d.angle===180?-14:d.angle===0?14:0).attr('y',d=>d.angle===-90?-10:d.angle===90?78:35);

  const fire=root.append('g').attr('transform',`translate(${cx},${cy})`);
  fire.append('circle').attr('r',inner).attr('fill','#132B40').attr('stroke',accent).attr('stroke-width',3).attr('filter','url(#glow)');
  fire.append('path').attr('d','M0,-62 C36,-30 39,0 18,34 C8,52 -20,50 -34,27 C-52,-2 -20,-25 0,-62Z').attr('fill',accent).attr('opacity',.9);
  fire.append('path').attr('d','M2,-29 C19,-9 18,9 7,25 C-5,35 -20,18 -15,3 C-10,-10 -2,-15 2,-29Z').attr('fill','#E8F1F7').attr('opacity',.78);
  fire.append('text').attr('class','svg-center').attr('text-anchor','middle').attr('y',58).text('已分配');
  const totalText=fire.append('text').attr('class','svg-value').attr('text-anchor','middle').attr('y',81);
  const ticks=fire.selectAll('.category-tick').data(data).join('circle').attr('class','category-tick').attr('r',6).attr('cx',d=>Math.cos(d.angle*Math.PI/180)*108).attr('cy',d=>Math.sin(d.angle*Math.PI/180)*108);

  function allocated(){return d3.sum(data,d=>d.value)}
  function setValue(d,next,node){
    next=Math.max(0,Math.min(MAX,next));
    const proposed=allocated()-d.value+next;
    if(proposed>TOTAL){
      d3.select(node).interrupt().attr('transform',d3.select(node).attr('transform')).transition().duration(80).attr('transform',d3.select(node).attr('transform')+' translate(-7,0)').transition().duration(80).attr('transform',d3.select(node).attr('transform'));
      document.getElementById('message').textContent='燃料有限：先从另一类收回一些。'; return;
    }
    d.value=next; update(true,d);
  }
  function update(animate,changed){
    const duration=animate&&!Deck.reduced()?240:0;
    branch.select('.fill').transition().duration(duration).attr('x2',d=>point(d,inner+18+(outer-inner-18)*(d.value/MAX))[0]).attr('y2',d=>point(d,inner+18+(outer-inner-18)*(d.value/MAX))[1]).attr('stroke',d=>d.value<STEP?low:primary);
    control.transition().duration(duration).attr('transform',d=>{const p=point(d,inner+18+(outer-inner-18)*(d.value/MAX));return `translate(${p[0]},${p[1]})`}).attr('aria-valuenow',d=>d.value).attr('aria-valuetext',d=>percent(d.value));
    label.select('.svg-value').text(d=>percent(d.value)+' 燃料');
    ticks.attr('fill',d=>d.value>0?primary:low).attr('opacity',d=>d.value>0?1:.45);
    totalText.text(allocated()+' / '+TOTAL);
    if(changed){
      const msg=changed.value>=50?changed.high:changed.benefit;
      document.getElementById('message').textContent=changed.name+'：'+msg+'。其他分支保留多少，取决于剩余燃料。';
      d3.select(control.nodes()[data.indexOf(changed)]).select('.handle-ring').attr('stroke',accent).transition().duration(duration).attr('stroke',primary);
    }
    if(allocated()===TOTAL&&data.every(d=>d.value>0)) document.getElementById('message').textContent='四条分支同时接通：火形成多收益组合，而非单一路径。';
  }
  document.getElementById('reset').addEventListener('click',()=>{data.forEach(d=>d.value=25);update(true);document.getElementById('message').textContent='已恢复等量分配。拖动任一把手，观察收益组合怎样改变。'});

  if(!Deck.reduced()){
    branch.attr('opacity',0); fire.attr('opacity',0).transition().duration(500).attr('opacity',1);
    branch.transition().delay((d,i)=>320+i*90).duration(480).attr('opacity',1);
  }
  update(false);
})();
</script>
</body>
</html>
