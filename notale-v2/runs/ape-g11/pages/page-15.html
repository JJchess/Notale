<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:24px 32px 22px;gap:16px}
  .topline{height:74px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
  .kicker{color:var(--primary-bright);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em}
  .take{max-width:780px;color:var(--muted);font-size:var(--fs-lead);line-height:var(--lh-text);text-align:right}
  .flow{height:92px}
  .flow .step{padding:10px 8px;text-align:center;font-size:var(--fs-label);font-weight:700;transition:border-color .22s ease,background .22s ease}
  .flow .step small{display:block;color:var(--muted);font-size:var(--fs-label);font-weight:500}
  .main{display:flex;gap:16px;flex:1;min-height:0}
  .arena-wrap{position:relative;flex:1;min-width:0;overflow:hidden;border:2px solid var(--line);border-radius:var(--r-lg);background:var(--panel-deep)}
  #arena{position:absolute;inset:0}
  #arena canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;left:18px;top:16px;display:flex;gap:10px;pointer-events:none}
  .hud .chip{background:rgba(9,24,39,.88)}
  .arena-message{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);min-width:520px;max-width:78%;padding:10px 18px;border:1px solid var(--line);border-radius:var(--r-sm);background:rgba(9,24,39,.92);font-size:var(--fs-sec);line-height:var(--lh-text);text-align:center}
  .control{width:330px;display:flex;flex-direction:column;gap:12px;padding:18px;overflow:hidden}
  .control h2{color:var(--primary-bright)}
  .control .ctl{justify-content:space-between}
  .control select{width:156px}
  .role-dot{display:inline-block;width:12px;height:12px;margin-right:8px;border-radius:50%}
  .buttons{display:flex;gap:10px;margin-top:auto}
  .buttons button{flex:1}
  .feedback{min-height:94px;padding:12px;border-left:4px solid var(--primary);background:var(--panel-deep);font-size:var(--fs-sec);line-height:var(--lh-text)}
  .feedback.bad{border-color:var(--danger)} .feedback.good{border-color:var(--accent);color:var(--text)}
  .foot{height:58px;display:flex;align-items:center;justify-content:space-between;gap:28px}
  .claim{font-size:var(--fs-lead);font-weight:720;color:var(--text)}
  .caveat{max-width:670px;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-text);text-align:right}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-page="15" data-total="48">
<div id="stage">
  <header class="topline" style="height:74px">
    <div><div class="kicker">COLLECTIVE ACTION · 15</div><h1>围堵不是单人追逐</h1></div>
    <div class="take">依次给三名角色分工，再约定共同启动时机。目标会朝包围缺口实时转向。</div>
  </header>

  <section class="k-process flow min0" aria-label="合作围堵的六步闭环" style="height:92px">
    <div class="axis"></div>
    <div class="step is-current" data-step="0">观察<small>目标方向</small></div><div class="arw"></div>
    <div class="step" data-step="1">分工<small>追、封、等</small></div><div class="arw"></div>
    <div class="step" data-step="2">沟通<small>约定时机</small></div><div class="arw"></div>
    <div class="step" data-step="3">同步<small>同时行动</small></div><div class="arw"></div>
    <div class="step" data-step="4">预测<small>队友落点</small></div><div class="arw"></div>
    <div class="step" data-step="5">合围<small>封住出口</small></div>
  </section>

  <main class="main min0" style="flex:1">
    <section class="arena-wrap no-pan min0 science-grid" aria-label="三角色合作围堵模拟场">
      <div id="arena"></div>
      <div class="hud"><span class="chip" id="roundRead">第 1/3 轮</span><span class="chip" id="exitRead">已封出口 0/3</span><span class="chip mono" id="timeRead">准备</span></div>
      <div class="arena-message" id="arenaMessage" aria-live="polite">先观察橙色目标的尾迹，再为三名角色选择互补分工。</div>
    </section>

    <aside class="panel control min0" aria-label="角色指令盘">
      <h2>角色指令盘</h2>
      <div class="fs-sec muted">每个角色只接收一个短指令；重复分工会留下缺口。</div>
      <div class="ctl"><label for="roleA"><span class="role-dot" style="background:#67E1D2"></span>角色 A</label><select id="roleA"><option value="drive">驱赶</option><option value="close">封口</option><option value="wait">策应</option></select></div>
      <div class="ctl"><label for="roleB"><span class="role-dot" style="background:#65D49A"></span>角色 B</label><select id="roleB"><option value="drive">驱赶</option><option value="close" selected>封口</option><option value="wait">策应</option></select></div>
      <div class="ctl"><label for="roleC"><span class="role-dot" style="background:#A9C0CF"></span>角色 C</label><select id="roleC"><option value="drive">驱赶</option><option value="close">封口</option><option value="wait" selected>策应</option></select></div>
      <div class="ctl"><label for="timing">共同启动</label><select id="timing"><option value="0">现在</option><option value="1">延迟 1 拍</option><option value="2">延迟 2 拍</option></select></div>
      <div class="feedback" id="feedback">预定落点会显示为虚线轮廓。比较三条路线是否互补。</div>
      <div class="buttons"><button id="run" class="is-target">发出信号</button><button id="reset">一键重置</button></div>
    </aside>
  </main>

  <footer class="foot" style="height:58px">
    <div class="claim">共享目标需要分工、沟通、信任，以及对他人下一步行动的预测。</div>
    <div class="caveat">围堵只是同步合作的模型；采集、育儿、防卫与资源分享同样需要协作。</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/pixi.min.js"></script>
<script>
(function(){
  Deck.init({index:15,total:48});
  const arena=document.getElementById('arena');
  const app=new PIXI.Application({resizeTo:arena,backgroundAlpha:0,antialias:true,autoDensity:true,resolution:Math.min(devicePixelRatio,2)});
  arena.appendChild(app.view);
  const C={primary:0x35c2b2,bright:0x67e1d2,accent:0xffb547,danger:0xff786f,muted:0xa9c0cf,deep:0x091827,success:0x65d49a};
  const layer=new PIXI.Graphics(); app.stage.addChild(layer);
  const state={round:1,phase:0,running:false,elapsed:0,roles:['drive','close','wait'],timing:0,success:false,trace:[]};
  const starts=[[.13,.72],[.5,.12],[.87,.72]], agents=starts.map((p,i)=>({x:p[0],y:p[1],sx:p[0],sy:p[1],color:[C.bright,C.success,C.muted][i]}));
  const target={x:.52,y:.52,vx:.0017,vy:-.0006,trail:[]};
  const destinations={drive:[.42,.56],close:[.68,.42],wait:[.55,.73]};
  const stepEls=[...document.querySelectorAll('.flow .step')];
  const feedback=document.getElementById('feedback'), msg=document.getElementById('arenaMessage');
  const roundRead=document.getElementById('roundRead'),exitRead=document.getElementById('exitRead'),timeRead=document.getElementById('timeRead');
  const selects=['roleA','roleB','roleC'].map(id=>document.getElementById(id));
  const timing=document.getElementById('timing'), run=document.getElementById('run');
  const ROUND_SECONDS=35;
  function emit(name,detail){window.dispatchEvent(new CustomEvent(name,{detail}));}
  function setPhase(n){state.phase=n;stepEls.forEach((el,i)=>{el.classList.toggle('is-current',i===n);el.classList.toggle('is-past',i<n);});}
  function roleValues(){return selects.map(s=>s.value)}
  function updatePlan(){state.roles=roleValues();state.timing=+timing.value;setPhase(state.timing===0?2:1);draw();}
  selects.forEach(s=>s.addEventListener('change',updatePlan)); timing.addEventListener('change',updatePlan);
  function resetPositions(){agents.forEach((a,i)=>{a.x=starts[i][0];a.y=starts[i][1];});target.x=.52;target.y=.52;target.vx=.0017;target.vy=-.0006;target.trail=[];}
  function reset(all=true){state.running=false;state.elapsed=0;state.success=false;if(all){state.round=1;state.trace=[];selects[0].value='drive';selects[1].value='close';selects[2].value='wait';timing.value='0';}resetPositions();setPhase(0);feedback.className='feedback';feedback.textContent='预定落点会显示为虚线轮廓。比较三条路线是否互补。';msg.textContent='先观察橙色目标的尾迹，再为三名角色选择互补分工。';run.disabled=false;run.textContent='发出信号';updateHUD(0);draw();emit('game-reset',{state:{...state}});}
  document.getElementById('reset').addEventListener('click',()=>reset(true));
  run.addEventListener('click',start);
  function start(){if(state.running)return;state.roles=roleValues();state.timing=+timing.value;state.running=true;state.elapsed=0;state.success=false;run.disabled=true;setPhase(3);feedback.className='feedback';feedback.textContent='三人同时执行。目标正在寻找尚未封住的方向。';msg.textContent='观察目标如何因最近威胁改变方向。';emit('game-start',{state:{...state}});}
  function updateHUD(sealed){roundRead.textContent='第 '+state.round+'/3 轮';exitRead.textContent='已封出口 '+sealed+'/3';timeRead.textContent=state.running?Math.max(0,ROUND_SECONDS-Math.floor(state.elapsed))+' s':'准备';}
  function finish(ok,reason){state.running=false;state.success=ok;state.trace.push({round:state.round,roles:[...state.roles],timing:state.timing,success:ok});run.disabled=false;
    if(ok){setPhase(5);feedback.className='feedback good';feedback.textContent='三道控制区同时闭合。不是谁跑得最快，而是谁能配合他人。';msg.textContent='合围完成：互补角色在同一时机到位。';run.textContent='同局重放';emit('game-complete',{score:state.round,metrics:{sealed:3},trace:state.trace});}
    else{setPhase(4);feedback.className='feedback bad';feedback.textContent=reason;msg.textContent='流程回到预测与调整：修改一次指令，再发出信号。';state.round=Math.min(3,state.round+1);run.textContent='调整后再行动';emit('game-progress',{state:{...state},action:'adjust',metrics:{sealed:reason.includes('时机')?2:1}});}
  }
  function tick(delta){if(!state.running){draw();return;} const dt=Math.min(delta/60,.05);state.elapsed+=dt;
    const unique=new Set(state.roles).size===3, delay=state.timing*.42, moveT=Math.max(0,state.elapsed-delay), prog=Math.min(1,moveT/3.8);
    agents.forEach((a,i)=>{const d=destinations[state.roles[i]];a.x=a.sx+(d[0]-a.sx)*prog;a.y=a.sy+(d[1]-a.sy)*prog;});
    let nearest=agents[0],nd=99;agents.forEach(a=>{const d=(a.x-target.x)**2+(a.y-target.y)**2;if(d<nd){nd=d;nearest=a;}});
    const escapeX=target.x-nearest.x,escapeY=target.y-nearest.y,len=Math.hypot(escapeX,escapeY)||1;target.vx=target.vx*.88+(escapeX/len)*.0018*.12;target.vy=target.vy*.88+(escapeY/len)*.0018*.12;target.x+=target.vx*delta;target.y+=target.vy*delta;target.trail.push([target.x,target.y]);if(target.trail.length>28)target.trail.shift();
    const sealed=Math.min(3,Math.floor(prog*3));updateHUD(sealed);if(prog>.62)setPhase(4);
    if(prog>=1){if(unique&&state.timing===0)finish(true,'');else if(!unique)finish(false,'这里有两人追同一方向，另一侧出口无人封堵。');else finish(false,'启动时机不同，目标从时间差中穿过。');} draw();
  }
  function draw(){const w=app.renderer.width/app.renderer.resolution,h=app.renderer.height/app.renderer.resolution;layer.clear();
    layer.lineStyle(2,C.primary,.35);layer.drawRoundedRect(38,34,w-76,h-68,80);
    const cx=w*.52,cy=h*.52;layer.lineStyle(1,C.primary,.18);[90,150].forEach(r=>layer.drawCircle(cx,cy,r));
    target.trail.forEach((p,i)=>{layer.beginFill(C.accent,(i+1)/target.trail.length*.36);layer.drawEllipse(p[0]*w,p[1]*h,3,6);layer.endFill();});
    agents.forEach((a,i)=>{const d=destinations[state.roles[i]];layer.lineStyle(2,a.color,.52);for(let q=0;q<10;q+=2){const t1=q/10,t2=(q+1)/10;layer.moveTo((a.sx+(d[0]-a.sx)*t1)*w,(a.sy+(d[1]-a.sy)*t1)*h);layer.lineTo((a.sx+(d[0]-a.sx)*t2)*w,(a.sy+(d[1]-a.sy)*t2)*h);}layer.lineStyle(2,a.color,.55);layer.drawCircle(d[0]*w,d[1]*h,24);layer.beginFill(a.color);layer.drawCircle(a.x*w,a.y*h,13);layer.endFill();layer.lineStyle(3,C.deep,1);layer.drawCircle(a.x*w,a.y*h,6);});
    layer.beginFill(C.accent);layer.drawPolygon([target.x*w,target.y*h-15,target.x*w+12,target.y*h+10,target.x*w-12,target.y*h+10]);layer.endFill();
    if(state.success){layer.lineStyle(6,C.accent,.9);layer.drawCircle(cx,cy,118);}
  }
  app.ticker.add(tick);
  Deck.onResize(()=>setTimeout(draw,0));
  if(Deck.reduced()){app.ticker.stop();app.renderer.render(app.stage);}
  reset(true);
  window.coopGame={start,reset,getState:()=>JSON.parse(JSON.stringify(state))};
})();
</script>
</body>
</html>
