<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page-head{padding:24px 34px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
  .kicker{color:var(--primary-bright);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.14em}
  .take{max-width:720px;margin:4px 0 0;color:var(--muted);font-size:var(--fs-lead);line-height:var(--lh-text)}
  .main-field{margin:0 34px;display:flex;gap:18px;min-height:0}
  .network-wrap{position:relative;flex:1;min-width:0;overflow:hidden;border:2px solid var(--line);border-radius:var(--r-lg);background:radial-gradient(circle at 52% 46%,rgba(53,194,178,.09),transparent 42%),var(--panel-deep)}
  #network{display:block;width:100%;height:100%}
  .camp-label{position:absolute;color:var(--faint);font-size:var(--fs-label);pointer-events:none}
  .camp-a{left:7%;top:8%}.camp-b{left:46%;top:8%}.camp-c{right:7%;top:8%}
  .select-hint{position:absolute;left:18px;bottom:16px;padding:8px 12px;border-radius:var(--r-sm);background:rgba(7,17,31,.88);color:var(--muted);font-size:var(--fs-label)}
  .side{width:300px;min-width:0;display:flex;flex-direction:column;gap:12px}
  .side .panel{padding:16px}
  .metric-row{display:flex;gap:10px}.metric-row .readout{min-width:0;flex:1;padding:10px 12px}
  .status{min-height:76px;color:var(--text);font-size:var(--fs-sec);line-height:var(--lh-text)}
  .controls{display:flex;gap:10px;flex-wrap:wrap}.controls button{flex:1;white-space:nowrap}
  .process-band{height:132px;margin:14px 34px 0;align-items:stretch}
  .process-band>.step{padding:10px 12px;text-align:center}
  .step-no{display:block;color:var(--primary-bright);font:700 var(--fs-label)/1.2 var(--font-mono)}
  .step-txt{display:block;margin-top:4px;font-size:var(--fs-label);line-height:1.35}
  .process-band>.arw{flex-basis:18px}
  .foot{height:58px;padding:8px 34px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
  .foot .note{max-width:610px}.claim{max-width:810px;color:var(--text);font-size:var(--fs-lead);font-weight:720;line-height:var(--lh-text);text-align:right}
  .link{stroke:#416078;stroke-width:2}.link.active{stroke:var(--accent);stroke-width:4}.link.bridge{stroke-dasharray:7 6}
  .node{fill:#10283b;stroke:#7692a4;stroke-width:3;cursor:pointer;outline:none}.node.mastered{fill:var(--primary);stroke:var(--primary-bright)}.node.inventor{fill:var(--accent);stroke:#ffe0a3}.node.selected{stroke:var(--accent);stroke-width:6}.node:focus{stroke:#fff;stroke-width:5}
  .pulse{fill:var(--accent);pointer-events:none}.trace{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;pointer-events:none}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.node,.link{transition:none!important}}
</style>
</head>
<body data-page="18" data-total="48">
<div id="stage">
  <header class="page-head" style="height:92px">
    <div><div class="kicker">CULTURAL NETWORKS</div><h1>让创新活过发明者</h1></div>
    <p class="take">创新要沿真实连接被再次学会；每一代都必须重新完成传递。</p>
  </header>

  <main class="main-field min0" style="flex:1">
    <section class="network-wrap min0 no-pan" aria-label="三个人群之间的技能传播网络">
      <svg id="network" viewBox="0 0 1200 680" role="img" aria-labelledby="net-title net-desc">
        <title id="net-title">创新传播网络</title>
        <desc id="net-desc">选择两个节点可增添或移除连接，再运行多代传播。</desc>
      </svg>
      <span class="camp-label camp-a">群体 A</span><span class="camp-label camp-b">群体 B</span><span class="camp-label camp-c">群体 C</span>
      <div class="select-hint" id="hint">依次选择两人，改变他们之间的学习路径</div>
    </section>

    <aside class="side min0" aria-live="polite">
      <div class="panel evidence">
        <div class="fs-label muted">传播进度</div>
        <div class="readout" style="margin-top:8px"><span class="value" id="genValue">—</span><span class="readout-label">当前代</span></div>
      </div>
      <div class="metric-row">
        <div class="readout"><span class="value" id="holdersValue">—</span><span class="readout-label">掌握人数</span></div>
        <div class="readout"><span class="value" id="rateValue">—</span><span class="readout-label">百次保存率</span></div>
      </div>
      <div class="panel status" id="status">橙色节点产生新做法。连接决定谁有机会接触它。</div>
      <div class="legend"><span><i class="legend-key is-current"></i>传播路径</span><span><i class="legend-key"></i>已掌握</span><span>虚线：跨群连接</span></div>
      <div class="controls">
        <button id="run" class="is-target">运行</button>
        <button id="reset">重置为稀疏网络</button>
      </div>
    </aside>
  </main>

  <section class="k-process process-band" aria-label="创新保存过程">
    <div class="axis"></div>
    <div class="step is-current"><span class="step-no">01</span><span class="step-txt">一人产生新做法</span></div><div class="arw"></div>
    <div class="step"><span class="step-no">02</span><span class="step-txt">有连接才可能接触</span></div><div class="arw"></div>
    <div class="step"><span class="step-no">03</span><span class="step-txt">接触不等于学会</span></div><div class="arw"></div>
    <div class="step"><span class="step-no">04</span><span class="step-txt">重复接触提高机会</span></div><div class="arw"></div>
    <div class="step"><span class="step-no">05</span><span class="step-txt">跨群连接带走技能</span></div><div class="arw"></div>
    <div class="step"><span class="step-no">06</span><span class="step-txt">末代仍有人会</span></div>
  </section>

  <footer class="foot">
    <div class="note">这是用于比较网络结构的简化模型，不是特定史前群体的复原。</div>
    <div class="claim">创新能否存活取决于群体连接、迁徙与重复学习，而不只取决于发明者有多聪明。</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
(function(){
  Deck.init({index:18,total:48});
  var CFG={people:24,groups:3,generations:8,runs:100,learn:.38};
  var seed='apeman-spaceman-p18';
  var nodes=d3.range(CFG.people).map(function(i){return {id:i,group:Math.floor(i/(CFG.people/CFG.groups))};});
  var baseEdges=[];
  for(var g=0;g<CFG.groups;g++) for(var j=0;j<CFG.people/CFG.groups;j++){
    var a=g*(CFG.people/CFG.groups)+j, b=g*(CFG.people/CFG.groups)+((j+1)%(CFG.people/CFG.groups));
    baseEdges.push({source:a,target:b}); if(j%2===0) baseEdges.push({source:a,target:g*(CFG.people/CFG.groups)+((j+2)%(CFG.people/CFG.groups))});
  }
  baseEdges.push({source:6,target:8});
  var edges=baseEdges.map(function(d){return {source:d.source,target:d.target};}), selected=null, running=false;
  var svg=d3.select('#network'), linkLayer=svg.append('g'), traceLayer=svg.append('g'), nodeLayer=svg.append('g');
  var sim=d3.forceSimulation(nodes).randomSource(new Math.seedrandom(seed)).force('link',d3.forceLink(edges).id(function(d){return d.id;}).distance(72).strength(.45)).force('charge',d3.forceManyBody().strength(-150)).force('center',d3.forceCenter(600,330)).force('collide',d3.forceCollide(18));
  nodes.forEach(function(n){n.fx=210+n.group*390+(n.id%8%4)*28;n.fy=210+Math.floor((n.id%8)/4)*220+(n.id%4)*22;});
  var linkSel,nodeSel;
  function key(d){var a=typeof d.source==='object'?d.source.id:d.source,b=typeof d.target==='object'?d.target.id:d.target;return Math.min(a,b)+'-'+Math.max(a,b);}
  function render(){
    linkSel=linkLayer.selectAll('line').data(edges,key).join('line').attr('class',function(d){return 'link '+((d.source.group!==d.target.group)?'bridge':'');});
    nodeSel=nodeLayer.selectAll('circle').data(nodes,function(d){return d.id;}).join('circle').attr('class','node').attr('r',function(d){return d.id===0?14:10;}).attr('tabindex',0).attr('role','button').attr('aria-label',function(d){return '群体 '+String.fromCharCode(65+d.group)+' 的成员';}).on('click',function(e,d){choose(d);}).on('keydown',function(e,d){if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(d);}});
    sim.nodes(nodes).force('link').links(edges); sim.alpha(.35).restart(); updatePositions();
  }
  function updatePositions(){linkSel.attr('x1',function(d){return d.source.x;}).attr('y1',function(d){return d.source.y;}).attr('x2',function(d){return d.target.x;}).attr('y2',function(d){return d.target.y;});nodeSel.attr('cx',function(d){return d.x;}).attr('cy',function(d){return d.y;});}
  sim.on('tick',updatePositions);
  function choose(d){
    if(running)return;
    if(selected===null){selected=d.id;nodeSel.classed('selected',function(n){return n.id===selected;});document.getElementById('hint').textContent='再选一人，连接或断开路径';return;}
    if(selected===d.id){selected=null;nodeSel.classed('selected',false);return;}
    var a=Math.min(selected,d.id),b=Math.max(selected,d.id),idx=edges.findIndex(function(e){return key(e)===a+'-'+b;});
    var cross=nodes[a].group!==nodes[b].group;
    if(idx>=0){edges.splice(idx,1);document.getElementById('status').textContent=cross?'这条桥断开后，技能可能无法进入另一群体。':'学习路径已移除；可替代的接触机会减少。';}
    else{edges.push({source:nodes[a],target:nodes[b]});document.getElementById('status').textContent='新增一条学习路径。运行后观察它是否被传播使用。';}
    selected=null;render();nodeSel.classed('selected',false);calculateRate();
  }
  function adjacency(){var m=nodes.map(function(){return[];});edges.forEach(function(e){var a=typeof e.source==='object'?e.source.id:e.source,b=typeof e.target==='object'?e.target.id:e.target;m[a].push(b);m[b].push(a);});return m;}
  function oneRun(rng,record){var adj=adjacency(),holders=new Set([0]),history=[];for(var gen=1;gen<=CFG.generations;gen++){var next=new Set(),used=[];holders.forEach(function(h){adj[h].forEach(function(t){if(rng()<CFG.learn){next.add(t);used.push([h,t]);}});});holders=next;if(record)history.push({holders:new Set(holders),used:used});if(!holders.size){while(history.length<CFG.generations)history.push({holders:new Set(),used:[]});break;}}return {saved:holders.size>0,history:history,holders:holders};}
  function calculateRate(){var saved=0;for(var i=0;i<CFG.runs;i++)if(oneRun(new Math.seedrandom(seed+'-rate-'+i),false).saved)saved++;document.getElementById('rateValue').textContent=Lec.P.formatPercent(saved/CFG.runs,0);return saved;}
  function setStep(gen){document.querySelectorAll('.process-band .step').forEach(function(el,i){el.classList.toggle('is-current',i===Math.min(5,Math.ceil(gen*6/CFG.generations)-1));el.classList.toggle('is-past',i<Math.min(5,Math.ceil(gen*6/CFG.generations)-1));});}
  function showState(item,gen){
    nodeSel.classed('mastered',function(d){return item.holders.has(d.id);}).classed('inventor',function(d){return gen===0&&d.id===0;});
    linkSel.classed('active',function(d){var a=d.source.id,b=d.target.id;return item.used.some(function(p){return (p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a);});});
    document.getElementById('genValue').textContent=Lec.P.formatFixed(gen,0)+' / '+Lec.P.formatFixed(CFG.generations,0);
    document.getElementById('holdersValue').textContent=Lec.P.formatFixed(item.holders.size,0)+' / '+Lec.P.formatFixed(CFG.people,0);setStep(gen);
  }
  function run(){if(running)return;running=true;document.getElementById('run').disabled=true;var result=oneRun(new Math.seedrandom(seed+'-visible-'+edges.map(key).sort().join('|')),true),i=0;
    function next(){if(i>=result.history.length){running=false;document.getElementById('run').disabled=false;document.getElementById('status').textContent=result.saved?'本次结果：技能被保存。桥接与重复通路降低了偶然失传。':'本次结果：技能在传递中失传。改变连接后可用同一种子比较。';return;}showState(result.history[i],i+1);i++;if(Deck.reduced())next();else setTimeout(next,520);}
    next();
  }
  function reset(){if(running)return;edges=baseEdges.map(function(d){return {source:nodes[d.source],target:nodes[d.target]};});selected=null;render();var init={holders:new Set([0]),used:[]};showState(init,0);document.getElementById('status').textContent='橙色节点产生新做法。连接决定谁有机会接触它。';calculateRate();}
  document.getElementById('run').textContent='运行 '+Lec.P.formatFixed(CFG.generations,0)+' 代';
  document.getElementById('run').addEventListener('click',run);document.getElementById('reset').addEventListener('click',reset);
  render();reset();
})();
</script>
</body>
</html>
