<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:28px 42px 24px;gap:16px}
  .kicker{color:var(--primary-bright);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em}
  .deckhead{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-5)}
  .take{max-width:600px;margin:0;color:var(--muted);font-size:var(--fs-lead);line-height:var(--lh-text);text-align:right}
  .sim-shell{position:relative;overflow:hidden;border:var(--stroke) solid var(--line);border-radius:var(--r-lg);background:linear-gradient(180deg,rgba(53,194,178,.04),transparent 48%),var(--panel-deep)}
  .sim-shell svg{display:block;width:100%;height:100%}
  .sim-shell text{font-family:var(--font-sans);fill:var(--text)}
  .tower-title{font-size:22px;font-weight:750}
  .status-label{font-size:14px;fill:var(--muted)!important}
  .module-label{font-size:16px}
  .generation-mark{font:13px var(--font-mono)!important;fill:var(--faint)!important}
  .tower-frame{fill:rgba(14,32,51,.45);stroke:var(--line);stroke-width:2}
  .module-box{fill:var(--panel-soft);stroke:var(--primary);stroke-width:2}
  .module-box.pending{fill:var(--panel-deep);stroke:var(--line);stroke-dasharray:5 5}
  .module-box.new{stroke:var(--accent);fill:var(--accent-soft)}
  .dependency{stroke:var(--primary);stroke-width:2;fill:none}
  .dependency.pending{stroke:var(--line);stroke-dasharray:5 5}
  .limit-line{stroke:var(--accent);stroke-width:2;stroke-dasharray:8 6}
  .controlbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
  .feedback{margin:0;flex:1;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-text)}
  .feedback.bad{color:var(--danger)}
  .feedback.done{color:var(--accent)}
  .compact-compare{--compare-cols:150px repeat(3,minmax(0,1fr))}
  .compact-compare .hdr,.compact-compare .dim,.compact-compare .cell{padding:8px 14px}
  @keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-7px)}70%{transform:translateX(7px)}}
  .shake{animation:shake 260ms ease-out}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="20" data-total="48">
<div id="stage">
  <header class="deckhead" style="height:86px">
    <div><div class="kicker">CULTURAL ACCUMULATION</div><h1>没有一个人独自造出太空技术</h1></div>
    <p class="take">技术上限取决于社会能否把前人的模块留给后来者。</p>
  </header>

  <main class="sim-shell science-grid min0" style="flex:1" aria-label="三种传承条件下的技术模块叠层比较">
    <svg id="towerViz" viewBox="0 0 1200 650" role="img" aria-labelledby="vizTitle vizDesc">
      <title id="vizTitle">孤立者、小群体与累积社会的技术塔</title>
      <desc id="vizDesc">推进世代后，三列同步尝试保留并组合八层相互依赖的技术模块。</desc>
    </svg>
  </main>

  <section class="k-comparison compact-compare" style="height:122px" aria-label="三种社会的同维度比较">
    <div class="crow"><div class="hdr"></div><div class="hdr">孤立者</div><div class="hdr">小群体</div><div class="hdr diff">累积社会</div></div>
    <div class="crow"><div class="dim">学习来源</div><div class="cell">仅自己试错</div><div class="cell">同代模仿</div><div class="cell diff">前代成果＋同代教学</div></div><div class="rowline"></div>
    <div class="crow"><div class="dim">模块保留</div><div class="cell">个体离场即清空</div><div class="cell">可能保留或失传</div><div class="cell diff">稳定模块跨代保留</div></div>
  </section>

  <footer class="controlbar" style="height:62px">
    <div class="ctl"><button id="advance" class="is-target" type="button">推进一代</button><button id="replay" type="button" hidden>按同一种子重演</button></div>
    <p id="feedback" class="feedback" aria-live="polite">三列将同步经历同一代。比较谁能保住依赖，并继续组合。</p>
    <span class="chip">八层是能力依赖模型，不是固定历史顺序</span>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
(function(){
  Deck.init({index:20,total:48});
  const fmt=n=>Lec.P.formatFixed(n,0);
  const total=8;
  const modules=[
    {name:'控火与材料加工',deps:[]},{name:'精密工具',deps:[1]},
    {name:'测量与标准',deps:[2]},{name:'数学模型',deps:[3]},
    {name:'动力与控制',deps:[2,4]},{name:'传感与通信',deps:[3,4]},
    {name:'系统测试',deps:[5,6]},{name:'离开地球',deps:[7]}
  ];
  const societies=[
    {key:'solo',name:'孤立者',cap:2},{key:'group',name:'小群体',cap:4},{key:'cumulative',name:'累积社会',cap:8}
  ];
  function makePlan(){
    const rng=new Math.seedrandom('apeman-spaceman-p20');
    return Array.from({length:total},(_,i)=>({
      soloTarget:rng()<.42?2:1,
      groupLoss:rng()<.34,
      groupLearn:rng()<.78,
      wobble:rng()
    }));
  }
  const plan=makePlan();
  let state;
  const initial=()=>({generation:0,heights:{solo:0,group:0,cumulative:0},event:null,done:false});
  const svg=d3.select('#towerViz');
  const W=320,gap=48,x0=56,baseY=566,step=46,boxW=56,boxH=34;
  const xs=societies.map((d,i)=>x0+i*(W+gap));

  function transition(){
    if(state.done)return;
    const p=plan[state.generation], before={...state.heights}, failures=[];
    state.generation++;
    state.heights.solo=p.soloTarget===1?1:0;
    if(p.soloTarget===2) failures.push('solo');
    let gh=state.heights.group;
    if(p.groupLoss&&gh>0) gh=Math.max(0,gh-1);
    const target=gh+1;
    if(p.groupLearn&&target<=4) gh=target; else if(target<=4) failures.push('group');
    state.heights.group=gh;
    state.heights.cumulative=Math.min(8,state.heights.cumulative+1);
    state.event={before,failures};
    state.done=state.generation===total;
    render(true);
  }

  function render(animate){
    svg.selectAll('*:not(title):not(desc)').remove();
    const reduce=Deck.reduced();
    const duration=animate&&!reduce?420:0;
    for(let i=0;i<=total;i++){
      const y=baseY-i*step;
      svg.append('line').attr('x1',28).attr('x2',1172).attr('y1',y).attr('y2',y).attr('stroke','rgba(53,194,178,.10)').attr('stroke-width',1);
      if(i>0)svg.append('text').attr('class','generation-mark').attr('x',18).attr('y',y+5).text(fmt(i));
    }
    svg.append('line').attr('x1',35).attr('x2',1165).attr('y1',baseY).attr('y2',baseY).attr('stroke','var(--primary)').attr('stroke-width',2);
    societies.forEach((soc,si)=>{
      const x=xs[si],h=state.heights[soc.key];
      svg.append('rect').attr('class','tower-frame').attr('x',x).attr('y',152).attr('width',W).attr('height',414).attr('rx',14);
      svg.append('text').attr('class','tower-title').attr('x',x+W/2).attr('y',52).attr('text-anchor','middle').text(soc.name);
      svg.append('text').attr('class','status-label').attr('x',x+W/2).attr('y',82).attr('text-anchor','middle').text(`已保留模块 ${fmt(h)} / ${fmt(total)}`);
      svg.append('text').attr('class','status-label').attr('x',x+W/2).attr('y',106).attr('text-anchor','middle').text(h?`当前最高层 ${fmt(h)}`:'当前最高层 —');
      for(let layer=1;layer<=total;layer++){
        const y=baseY-layer*step+6,active=layer<=h,isNew=state.event&&layer>state.event.before[soc.key]&&active;
        if(layer>1){
          svg.append('path').attr('class','dependency '+(active?'':'pending')).attr('d',`M${x+48},${y+boxH}V${y+step}`).attr('opacity',active?1:.5);
        }
        const g=svg.append('g').attr('class',state.event&&state.event.failures.includes(soc.key)&&layer===Math.min(h+1,soc.cap)?'shake':null);
        const rect=g.append('rect').attr('class','module-box '+(active?(isNew?'new':''):'pending')).attr('x',x+20).attr('width',boxW).attr('height',boxH).attr('rx',6);
        rect.attr('y',duration&&isNew?baseY+12:y).attr('opacity',active?1:.32);
        if(duration&&isNew)rect.transition().duration(duration).ease(d3.easeCubicOut).attr('y',y);
        g.append('text').attr('class','module-label').attr('x',x+90).attr('y',y+23).attr('opacity',active?1:.38).text(modules[layer-1].name);
      }
      svg.append('text').attr('class','status-label').attr('x',x+W/2).attr('y',620).attr('text-anchor','middle')
        .text(soc.key==='solo'?'最多连接 2 层':soc.key==='group'?'最多连接 4 层':'可连接全部 8 层');
    });
    svg.append('text').attr('class','tower-title').attr('x',600).attr('y',132).attr('text-anchor','middle').attr('fill','var(--accent)').text(`第 ${fmt(state.generation)} / ${fmt(total)} 代`);
    if(state.done){
      societies.forEach((soc,si)=>{
        const y=baseY-state.heights[soc.key]*step+2;
        svg.append('line').attr('class','limit-line').attr('x1',xs[si]+5).attr('x2',xs[si]+W-5).attr('y1',y).attr('y2',y);
      });
    }
    updateUI();
  }

  function updateUI(){
    const fb=document.getElementById('feedback'),advance=document.getElementById('advance'),replay=document.getElementById('replay');
    fb.className='feedback';
    if(state.done){
      fb.textContent='相同代数，不同累积上限。个人可以推进一层；保留、校正并继续组合，才抬高技术上限。';fb.classList.add('done');advance.disabled=true;replay.hidden=false;
    }else if(state.event&&state.event.failures.length){
      fb.textContent='缺少下层模块：先保住依赖，不能直接跳到这一层。';fb.classList.add('bad');
    }else if(state.generation){
      fb.textContent='满足依赖的新模块已接入；观察哪些旧层在下一代仍然存在。';
    }
  }
  function reset(){state=initial();document.getElementById('advance').disabled=false;document.getElementById('replay').hidden=true;document.getElementById('feedback').textContent='三列将同步经历同一代。比较谁能保住依赖，并继续组合。';render(false)}
  document.getElementById('advance').addEventListener('click',transition);
  document.getElementById('replay').addEventListener('click',reset);
  reset();
})();
</script>
</body>
</html>
