<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .memory-page{padding:28px 38px 30px;gap:16px}.topline{letter-spacing:.13em;color:var(--primary-bright);font:650 var(--fs-label)/1.4 var(--font-mono)}
    .timer{height:8px;border-radius:999px;background:var(--panel-deep);overflow:hidden;border:1px solid var(--line)}.timer>i{display:block;width:0;height:100%;background:var(--accent);transition:width .2s linear}
    .round-dots{display:flex;gap:8px}.round-dots i{width:42px;height:5px;border-radius:9px;background:var(--line)}.round-dots i.on{background:var(--accent)}.round-dots i.done{background:var(--primary)}
    .lab{position:relative;overflow:hidden}.lab:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(transparent,var(--primary),transparent);opacity:.55;pointer-events:none}
    .chain{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;gap:5px;color:var(--muted);font-size:var(--fs-label)}.chain span{text-align:center;padding:6px 4px;border-bottom:2px solid var(--line)}.chain b{color:var(--primary-bright);text-align:center}.chain .extra{color:var(--accent);border-color:var(--accent)}
    .material{min-height:92px;display:flex;align-items:center;justify-content:center;padding:16px 24px;border:2px solid var(--line);border-radius:var(--r-md);background:var(--panel-deep);font-size:var(--fs-lead);line-height:1.5;text-align:center}.material.hidden{color:transparent;text-shadow:0 0 14px var(--muted)}
    .answer{width:100%;box-sizing:border-box;min-height:54px!important;font-family:var(--font-mono);font-size:var(--fs-body)!important}.answer:disabled{opacity:.55}.status{min-height:48px;padding:8px 12px;border-left:3px solid var(--line);color:var(--muted);font-size:var(--fs-sec);line-height:1.45}.status.good{border-color:var(--accent);color:var(--accent)}.status.bad{border-color:var(--danger);color:var(--danger)}
    .scorecell{min-height:44px;display:flex;align-items:center;justify-content:center}.pulse{animation:pulse .18s ease-out}.shake{animation:shake .18s ease-in-out 2}@keyframes pulse{50%{transform:scale(1.025);box-shadow:0 0 24px var(--accent)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body data-page="22" data-total="48">
  <div id="stage" class="memory-page">
    <header style="height:70px" class="row between items-end min0">
      <div><div class="topline">MEMORY OUTSIDE THE BODY · 第三幕</div><h1>记得大意，还是记准细节</h1></div>
      <div class="col items-end gap-1"><div id="roundLabel" class="chip is-current">准备实验</div><div class="round-dots" aria-hidden="true"><i></i><i></i><i></i></div></div>
    </header>
    <section style="height:40px" class="row gap-3 items-center min0">
      <div id="phase" class="fs-label muted" style="width:160px">同材料，同规则</div><div class="timer grow" aria-label="阶段计时"><i id="timerFill"></i></div><div id="clock" class="mono fs-label" style="width:72px;text-align:right">—</div>
    </section>
    <main style="flex:1" class="panel lab col pad-2 gap-3 min0">
      <div class="k-comparison min0" style="--compare-cols:150px repeat(2,minmax(0,1fr));flex:1">
        <div class="crow"><div class="hdr">同一维度</div><div class="hdr">口头记忆</div><div class="hdr">外部记录</div></div>
        <div class="crow"><div class="dim">信息链</div><div class="cell"><div class="chain"><span>接收</span><b>→</b><span>延迟</span><b>→</b><span>重建</span></div></div><div class="cell diff"><div class="chain"><span>接收</span><b>→</b><span class="extra">记录</span><b>→</b><span>重建</span></div></div></div><div class="rowline"></div>
        <div class="crow"><div class="dim">本轮材料</div><div class="cell"><div id="leftMaterial" class="material">按“开始实验”查看材料</div></div><div class="cell"><div id="rightMaterial" class="material">右侧允许在呈现时留下记录</div></div></div><div class="rowline"></div>
        <div class="crow"><div class="dim">重建</div><div class="cell"><label class="fs-label muted" for="leftAnswer">只凭记忆作答</label><input id="leftAnswer" class="answer" type="text" disabled autocomplete="off"></div><div class="cell diff"><label class="fs-label muted" for="rightAnswer">呈现时即可记录，作答时可回看</label><input id="rightAnswer" class="answer" type="text" disabled autocomplete="off"></div></div><div class="rowline"></div>
        <div class="crow"><div class="dim">即时反馈</div><div id="leftStatus" class="cell status">尚未完成</div><div id="rightStatus" class="cell status">尚未完成</div></div>
      </div>
    </main>
    <section style="height:190px" class="k-comparison min0" aria-label="逐轮准确率对照">
      <div class="crow"><div class="hdr">结果指标</div><div class="hdr">口头记忆</div><div class="hdr">外部记录</div></div>
      <div class="crow"><div class="dim">故事大意</div><div id="s00" class="cell scorecell muted">待完成</div><div id="s01" class="cell scorecell muted">待完成</div></div><div class="rowline"></div>
      <div class="crow"><div class="dim">精确字符</div><div id="s10" class="cell scorecell muted">待完成</div><div id="s11" class="cell scorecell muted">待完成</div></div><div class="rowline"></div>
      <div class="crow"><div class="dim">步骤位置</div><div id="s20" class="cell scorecell muted">待完成</div><div id="s21" class="cell scorecell muted">待完成</div></div>
    </section>
    <footer style="height:62px" class="row between items-center gap-3 min0">
      <div id="take" class="note fs-sec">口头记忆能抓住意义和故事骨架；长数字、精确顺序或逐项核对时，外部记录让信息更稳定、可回看。</div>
      <div class="row gap-2 no-shrink"><button id="startBtn" class="is-target">开始实验</button><button id="confirmBtn" disabled>确认答案</button><button id="nextBtn" disabled>下一轮</button><button id="resetBtn">重置实验</button></div>
    </footer>
    <div id="live" class="sr-only" aria-live="polite"></div>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
  (()=>{
    Deck.init({index:22,total:48});
    const rounds=[
      {material:'雨后，林带旁的三人把两篮果实带回营地。',placeholder:'写出最接近的大意',metric:'大意保留',check:v=>['雨','三人','两篮','果实','营地'].filter(k=>v.includes(k)).length},
      {material:'58310472',placeholder:'输入 8 位数字',metric:'精确字符',check:v=>{const a='58310472';return [...a].filter((c,i)=>v[i]===c).length}},
      {material:'蓝阀左转 → 等两拍 → 黄杆下压 → 再开蓝阀',placeholder:'按顺序写下 4 步',metric:'步骤位置',check:v=>{const keys=['蓝阀左转','等两拍','黄杆下压','再开蓝阀'];return keys.filter((k,i)=>v.split(/[→,，;；]/).map(x=>x.trim())[i]===k).length}}
    ];
    const $=id=>document.getElementById(id), dots=[...document.querySelectorAll('.round-dots i')];
    let state={round:0,phase:'idle',scores:[[null,null],[null,null],[null,null]],timer:null};
    const durations={show:8,distract:4,answer:18};
    function announce(t){$('live').textContent=t}
    function setMaterials(text,hidden=false){for(const id of ['leftMaterial','rightMaterial']){$(id).textContent=text;$(id).classList.toggle('hidden',hidden)}}
    function updateHead(){ $('roundLabel').textContent=state.phase==='idle'?'准备实验':`第 ${state.round+1} / 3 轮`;dots.forEach((d,i)=>d.className=i<state.round?'done':i===state.round&&state.phase!=='idle'?'on':'') }
    function runPhase(name,seconds,next){state.phase=name;let left=seconds;$('phase').textContent=name==='show'?'呈现 · 右侧可记录':name==='distract'?'干扰 · 暂停回想':'作答 · 重建信息';$('clock').textContent=left+' s';$('timerFill').style.width='100%';clearInterval(state.timer);const tick=()=>{$('clock').textContent=left+' s';$('timerFill').style.width=(left/seconds*100)+'%';if(left--<=0){clearInterval(state.timer);next()}};tick();state.timer=setInterval(tick,1000)}
    function startRound(){const r=rounds[state.round];updateHead();$('leftAnswer').value='';$('rightAnswer').value='';$('leftAnswer').placeholder=r.placeholder;$('rightAnswer').placeholder='在呈现时记录，稍后直接提交';$('leftStatus').textContent=$('rightStatus').textContent='尚未完成';$('leftStatus').className=$('rightStatus').className='cell status';setMaterials(r.material);$('startBtn').disabled=true;$('confirmBtn').disabled=true;$('nextBtn').disabled=true;$('leftAnswer').disabled=true;$('rightAnswer').disabled=false;announce(`第${state.round+1}轮开始，材料呈现`);runPhase('show',durations.show,()=>{setMaterials('材料已收起',true);$('rightAnswer').disabled=true;runPhase('distract',durations.distract,()=>{$('leftAnswer').disabled=false;$('rightAnswer').disabled=false;$('confirmBtn').disabled=false;$('leftAnswer').focus();runPhase('answer',durations.answer,()=>{if(state.phase==='answer') confirm()})})})}
    function feedback(side,score,max){const el=$(side+'Status'),good=score===max;el.textContent=good?'细节一致':state.round===1?`有 ${max-score} 位不一致`:state.round===2?'这一步的位置不一致':'大意中的关键要素有遗漏';el.className='cell status '+(good?'good pulse':'bad shake');announce(el.textContent)}
    function confirm(){if(state.phase!=='answer')return;clearInterval(state.timer);state.phase='scored';const r=rounds[state.round],vals=[$('leftAnswer').value.trim(),$('rightAnswer').value.trim()],max=state.round===0?5:state.round===1?8:4;vals.forEach((v,j)=>{const n=r.check(v);state.scores[state.round][j]=n;feedback(j?'right':'left',n,max);const cell=$(`s${state.round}${j}`);cell.textContent=`${n} / ${max}`;cell.className='cell scorecell '+(n===max?'accent':'primary');cell.classList.add('pulse')});$('leftAnswer').disabled=$('rightAnswer').disabled=true;$('confirmBtn').disabled=true;$('nextBtn').disabled=false;$('nextBtn').textContent=state.round===2?'查看结论':'下一轮';$('phase').textContent='本轮完成';$('clock').textContent='完成'}
    function next(){if(state.round<2){state.round++;startRound()}else{$('nextBtn').disabled=true;$('startBtn').textContent='再做一次';$('startBtn').disabled=false;$('roundLabel').textContent='6 格结果已完成';$('take').classList.add('evidence');announce('实验完成。故事大意差距通常较小，数字与步骤借助记录更易核对。')}}
    function reset(){clearInterval(state.timer);state={round:0,phase:'idle',scores:[[null,null],[null,null],[null,null]],timer:null};setMaterials('按“开始实验”查看材料');$('rightMaterial').textContent='右侧允许在呈现时留下记录';for(let i=0;i<3;i++)for(let j=0;j<2;j++){$(`s${i}${j}`).textContent='待完成';$(`s${i}${j}`).className='cell scorecell muted'};['leftAnswer','rightAnswer'].forEach(id=>{$(id).value='';$(id).disabled=true});$('startBtn').textContent='开始实验';$('startBtn').disabled=false;$('confirmBtn').disabled=$('nextBtn').disabled=true;$('nextBtn').textContent='下一轮';$('phase').textContent='同材料，同规则';$('clock').textContent='—';$('timerFill').style.width='0';$('take').classList.remove('evidence');updateHead();announce('实验已重置')}
    $('startBtn').onclick=()=>state.phase==='idle'?startRound():reset();$('confirmBtn').onclick=confirm;$('nextBtn').onclick=next;$('resetBtn').onclick=reset;updateHead();
    window.__p22={startRound,confirm,next,reset,getState:()=>JSON.parse(JSON.stringify({...state,timer:null}))};
  })();
  </script>
</body>
</html>
