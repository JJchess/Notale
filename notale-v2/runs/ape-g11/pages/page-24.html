<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page24{padding:24px 34px 28px;gap:8px}.kicker{color:var(--primary-bright);font:650 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.14em}.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}.title-row p{margin:0;max-width:600px;color:var(--muted)}
  .k-generalization{gap:8px}.k-generalization>.trunk{height:12px;margin:-8px auto}.k-generalization>.supports{padding-top:12px}.k-generalization>.supports::before{right:16.67%;left:16.67%}.k-generalization .support::before{height:12px}.press-claim{display:flex!important;align-items:center;justify-content:space-between;gap:24px;padding:12px 20px!important}.source-sheet{display:flex;align-items:center;gap:12px;white-space:nowrap}.sheet-icon{width:44px;height:54px;border:2px solid var(--primary);border-radius:var(--r-sm);background:linear-gradient(135deg,var(--primary-soft),transparent);box-shadow:0 0 22px rgba(53,194,178,.18);position:relative}.sheet-icon:after{content:"";position:absolute;left:9px;right:9px;top:15px;height:2px;background:var(--primary);box-shadow:0 9px 0 var(--primary),0 18px 0 var(--primary)}
  .support{transition:border-color 220ms ease,box-shadow 220ms ease,transform 420ms cubic-bezier(.2,.8,.2,1)}.support.is-good{border-color:var(--primary)!important;box-shadow:inset 0 3px 0 var(--primary)}.support h2{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.support p{margin:0 0 6px;color:var(--muted)}.support output{color:var(--accent);font:720 var(--fs-h2)/1 var(--font-mono)}.support input{width:100%;height:28px}.scale{display:flex;justify-content:space-between;color:var(--faint);font-size:var(--fs-tick);font-family:var(--font-mono)}
  .workbench{display:flex;gap:16px;min-height:0}.chart-shell{flex:1.7;min-width:0;display:flex;flex-direction:column;padding:14px 16px}.tree-shell{flex:1;min-width:0;display:flex;flex-direction:column;padding:14px 16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.section-head h2{font-size:var(--fs-h2)}#chart{flex:1;min-height:0}.tree-wrap{position:relative;flex:1;min-height:0;margin-top:8px;border-radius:var(--r-sm);background:radial-gradient(circle at 50% 0,rgba(53,194,178,.12),transparent 60%),var(--panel-deep);overflow:hidden}.tree-wrap svg{width:100%;height:100%;display:block}.tree-ticks,.tree-tags{position:absolute;inset:0;pointer-events:none}.tree-ticks span{position:absolute;left:6px;padding:1px 5px;border-radius:var(--r-sm);background:rgba(7,17,31,.78);color:var(--muted);font-size:14px;line-height:1.35}.tree-tags span{position:absolute;padding:3px 7px;border:1px solid var(--line);border-radius:var(--r-sm);background:rgba(9,24,39,.9);color:var(--text);font-size:14px;line-height:1.35}.tree-tags span:nth-child(1){left:42%;top:5%}.tree-tags span:nth-child(2){right:8%;top:22%}.tree-tags span:nth-child(3){right:5%;top:43%}.tree-tags span:nth-child(4){left:27%;top:61%}.tree-tags span:nth-child(5){right:9%;bottom:8%;color:var(--primary-bright)}.tree-tags span:nth-child(6){left:9%;bottom:8%;color:var(--accent)}.tree-node{fill:var(--primary);transition:opacity 220ms ease}.tree-node.bad{fill:var(--accent)}.tree-node.goal{filter:drop-shadow(0 0 6px var(--accent))}.tree-link{stroke:rgba(53,194,178,.38);stroke-width:1.5}.error-pulse{animation:pulse 380ms ease}.goal-glow .tree-link{stroke:var(--primary-bright)}
  .status-line{display:flex;align-items:stretch;gap:12px}.metric{flex:1;min-width:0;padding:10px 14px}.metric-head{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:var(--fs-label)}.metric strong{color:var(--text);font-family:var(--font-mono)}.bar{height:8px;margin-top:7px;border-radius:999px;background:var(--panel-deep);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--primary);transition:width 260ms ease}.bar.error i{background:var(--accent)}.feedback{flex:1.55;display:flex;align-items:center;padding:10px 16px;border-left:4px solid var(--accent);font-size:var(--fs-sec);line-height:var(--lh-text)}
  .enter{opacity:0;transform:translateY(14px)}.ready .enter{opacity:1;transform:none;transition:opacity 520ms ease,transform 520ms cubic-bezier(.2,.8,.2,1)}.ready .enter:nth-child(2){transition-delay:80ms}.ready .enter:nth-child(3){transition-delay:150ms}
  @keyframes pulse{0%,100%{transform:translateX(0)}30%{transform:translateX(5px)}60%{transform:translateX(-4px)}}
  @media(prefers-reduced-motion:reduce){.enter,.ready .enter,.support,.tree-node,.bar i{transition:none!important;animation:none!important;opacity:1;transform:none}}
</style>
</head>
<body data-page="24" data-total="48">
<div id="stage" class="page24">
  <header style="height:64px" class="title-row enter">
    <div><div class="kicker">EXTERNAL MEMORY · 复制误差印刷台</div><h1>复制得越快，错误也跑得越快</h1></div>
    <p class="fs-sec">拖动三座印台，比较传播规模与准确性。错误版本也可能继续成为母本。</p>
  </header>

  <main class="k-generalization min0 enter" style="flex:1">
    <div id="claim" class="claim press-claim">
      <div class="source-sheet"><span class="sheet-icon" aria-hidden="true"></span><span>原稿进入标准复制链</span></div>
      <span id="claimText" class="fs-lead">标准复制扩大可达规模，但规模不会自动保证准确。</span>
    </div>
    <div class="trunk" aria-hidden="true"></div>
    <div class="supports min0" style="height:158px">
      <section class="support" id="speedCard"><h2><span>复制速度</span><output id="speedOut"></output></h2><p class="fs-sec">每轮印制份数：调高后，副本总量上升更快。</p><input id="speed" type="range" aria-label="复制速度，每轮印制份数"><div class="scale"><span id="speedMin"></span><span id="speedMax"></span></div></section>
      <section class="support" id="proofCard"><h2><span>校对率</span><output id="proofOut"></output></h2><p class="fs-sec">发现新错误的概率：调高后，新错误更少留存。</p><input id="proof" type="range" aria-label="校对率，新错误被发现的概率"><div class="scale"><span id="proofMin"></span><span id="proofMax"></span></div></section>
      <section class="support" id="reachCard"><h2><span>传播范围</span><output id="reachOut"></output></h2><p class="fs-sec">每份可到达的节点数：调高后，传播树更宽。</p><input id="reach" type="range" aria-label="传播范围，每份可到达的节点数"><div class="scale"><span id="reachMin"></span><span id="reachMax"></span></div></section>
    </div>

    <div class="workbench min0" style="flex:1">
      <section class="panel chart-shell science-grid min0">
        <div class="section-head"><h2>规模与准确性是两条轴</h2><div class="legend"><span><i class="legend-key"></i>累计副本</span><span><i class="legend-key is-current"></i>含错副本占比</span></div></div>
        <div id="chart" role="img" aria-label="八轮传播中累计副本与含错副本占比折线图"></div>
      </section>
      <section class="panel tree-shell science-grid min0">
        <div class="section-head"><h2>第 <span id="roundNow"></span>/<span id="roundTotal"></span> 轮传播树</h2><span class="chip">橙色缺口＝含错副本</span></div>
        <div id="treeWrap" class="tree-wrap"><svg id="tree" viewBox="0 0 480 240" aria-hidden="true"></svg><div id="treeTicks" class="tree-ticks" aria-hidden="true"></div><div class="tree-tags" aria-hidden="true"><span>原稿</span><span>批量分支</span><span>校对筛错</span><span>母本复用</span><span>正确副本</span><span>含错副本</span></div></div>
      </section>
    </div>
  </main>

  <footer class="status-line enter" style="height:60px">
    <div class="panel-flat metric"><div class="metric-head"><span>副本目标</span><strong id="copyProgress"></strong></div><div class="bar"><i id="copyBar"></i></div></div>
    <div class="panel-flat metric"><div class="metric-head"><span>错误上限</span><strong id="errorProgress"></strong></div><div class="bar error"><i id="errorBar"></i></div></div>
    <div id="feedback" class="panel-flat feedback" aria-live="polite"></div>
    <button id="reset" type="button">重置参数</button>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(function(){
  Deck.init({index:24,total:48});
  var P=Lec.P;
  var C={
    speedMin:P.clamp(1,1,12), speedMax:P.clamp(12,1,12), speedStep:P.clamp(1,1,12), speedDefault:P.clamp(4,1,12),
    proofMin:P.clamp(0,0,1), proofMax:P.clamp(1,0,1), proofStep:P.clamp(.05,0,1), proofDefault:P.clamp(.5,0,1),
    reachMin:P.clamp(1,1,8), reachMax:P.clamp(8,1,8), reachStep:P.clamp(1,1,8), reachDefault:P.clamp(3,1,8),
    rounds:P.clamp(8,1,8), bits:P.clamp(20,1,20), baseError:P.clamp(.015,0,1), target:P.clamp(800,1,800), errorLimit:P.clamp(.1,0,1)
  };
  var $=function(id){return document.getElementById(id)}, speed=$('speed'),proof=$('proof'),reach=$('reach');
  function setup(el,min,max,step,val){el.min=min;el.max=max;el.step=step;el.value=val}
  setup(speed,C.speedMin,C.speedMax,C.speedStep,C.speedDefault); setup(proof,C.proofMin,C.proofMax,C.proofStep,C.proofDefault); setup(reach,C.reachMin,C.reachMax,C.reachStep,C.reachDefault);
  $('speedMin').textContent=C.speedMin;$('speedMax').textContent=C.speedMax;
  $('proofMin').textContent=P.formatPercent(C.proofMin,1);$('proofMax').textContent=P.formatPercent(C.proofMax,1);
  $('reachMin').textContent=C.reachMin;$('reachMax').textContent=C.reachMax;$('roundNow').textContent=C.rounds;$('roundTotal').textContent=C.rounds;
  for(var ti=1;ti<=C.rounds;ti++){var tick=document.createElement('span');tick.textContent='第 '+ti+' 轮';tick.style.top=(5+ti*88/C.rounds)+'%';$('treeTicks').appendChild(tick)}
  var chart=echarts.init($('chart'),null,{renderer:'svg'}), lastBad=false;
  function simulate(){
    var s=+speed.value,q=+proof.value,r=+reach.value,rng=new Math.seedrandom('apeman-spaceman-p24');
    var pool=[{bits:new Uint8Array(C.bits),bad:false}], totals=[],rates=[],snap=[];
    for(var round=1;round<=C.rounds;round++){
      var make=s*r*round;
      for(var j=0;j<make;j++){
        var parent=pool[Math.floor(rng()*pool.length)], bits=new Uint8Array(parent.bits),bad=false;
        for(var b=0;b<C.bits;b++){
          if(rng()<C.baseError && rng()>q) bits[b]=bits[b]?0:1;
          if(bits[b]) bad=true;
        }
        pool.push({bits:bits,bad:bad,round:round});
      }
      var badCount=0;for(var k=1;k<pool.length;k++)if(pool[k].bad)badCount++;
      totals.push(pool.length-1);rates.push((pool.length>1)?badCount/(pool.length-1):0);
    }
    snap=pool.slice(Math.max(1,pool.length-300));
    return {s:s,q:q,r:r,totals:totals,rates:rates,total:totals[C.rounds-1],rate:rates[C.rounds-1],snap:snap};
  }
  function drawTree(d,good){
    var svg=$('tree'),w=480,h=240,cols=C.rounds+1, nodes=[{x:w/2,y:18,bad:false}], lines=[];
    for(var i=0;i<d.snap.length;i++){
      var item=d.snap[i],row=item.round||1,y=18+row*(h-38)/C.rounds;
      var same=d.snap.filter(function(x){return (x.round||1)===row}),idx=same.indexOf(item),span=Math.min(w-30,50+d.r*42),x=w/2-span/2+(idx+1)*span/(same.length+1);
      var parent=nodes[Math.max(0,Math.floor((nodes.length-1)*.55))]||nodes[0];lines.push([parent.x,parent.y,x,y]);nodes.push({x:x,y:y,bad:item.bad,end:row===C.rounds});
    }
    svg.innerHTML=lines.map(function(l){return '<line class="tree-link" x1="'+l[0]+'" y1="'+l[1]+'" x2="'+l[2]+'" y2="'+l[3]+'"/>'}).join('')+nodes.map(function(n,i){return '<circle class="tree-node '+(n.bad?'bad ':'')+(good&&n.end?'goal':'')+'" cx="'+n.x+'" cy="'+n.y+'" r="'+(i?4:7)+'"/>'}).join('');
    $('treeWrap').classList.toggle('goal-glow',good);
  }
  function update(){
    var d=simulate(),good=d.total>=C.target&&d.rate<=C.errorLimit,tooWrong=d.total>=C.target&&d.rate>C.errorLimit;
    $('speedOut').textContent=d.s;$('proofOut').textContent=P.formatPercent(d.q,1);$('reachOut').textContent=d.r;
    chart.setOption({animationDuration:Deck.reduced()?0:450,textStyle:{fontSize:16,color:'#E8F1F7'},grid:{left:58,right:62,top:38,bottom:42},tooltip:{trigger:'axis',textStyle:{fontSize:16}},xAxis:{type:'category',name:'传播轮次',nameTextStyle:{fontSize:14,color:'#A9C0CF'},data:d.totals.map(function(_,i){return i+1}),axisLabel:{fontSize:14,color:'#A9C0CF'}},yAxis:[{type:'value',name:'累计副本',nameTextStyle:{fontSize:14,color:'#A9C0CF'},axisLabel:{fontSize:14,color:'#A9C0CF'}},{type:'value',name:'含错占比',max:1,nameTextStyle:{fontSize:14,color:'#A9C0CF'},axisLabel:{fontSize:14,color:'#A9C0CF',formatter:function(v){return P.formatPercent(v,0)}}}],series:[{name:'累计副本',type:'line',symbolSize:7,smooth:true,data:d.totals,lineStyle:{color:'#35C2B2',width:3},areaStyle:{color:'rgba(53,194,178,.28)'},itemStyle:{color:'#67E1D2'}},{name:'含错副本占比',type:'line',yAxisIndex:1,symbolSize:7,smooth:true,data:d.rates,lineStyle:{color:'#FFB547',width:3},areaStyle:{color:'rgba(255,181,71,.22)'},itemStyle:{color:'#FFB547'}}]});
    drawTree(d,good);
    $('copyProgress').textContent=d.total+' / '+C.target;$('errorProgress').textContent=P.formatPercent(d.rate,1)+' / '+P.formatPercent(C.errorLimit,1);
    $('copyBar').style.width=Math.min(100,d.total/C.target*100)+'%';$('errorBar').style.width=Math.min(100,d.rate/C.errorLimit*100)+'%';
    ['speedCard','proofCard','reachCard'].forEach(function(id){$(id).classList.toggle('is-good',good)});
    $('claim').classList.toggle('is-current',good);
    if(good){$('feedback').textContent='传播规模扩大，错误仍受控。复制得一样多，不等于复制得都正确。'}
    else if(tooWrong){$('feedback').textContent='传播很快，但含错副本已超过 '+P.formatPercent(C.errorLimit,1)+'；提高校对率再看。'}
    else{$('feedback').textContent='准确度尚可，但传播规模未达到 '+C.target+' 份。提高复制速度或传播范围。'}
    if(tooWrong&&!lastBad&&!Deck.reduced()){chart.getDom().classList.remove('error-pulse');void chart.getDom().offsetWidth;chart.getDom().classList.add('error-pulse')}
    lastBad=tooWrong;
  }
  [speed,proof,reach].forEach(function(el){el.addEventListener('input',update)});
  $('reset').addEventListener('click',function(){speed.value=C.speedDefault;proof.value=C.proofDefault;reach.value=C.reachDefault;update();speed.focus()});
  update(); Deck.onResize(function(){chart.resize()});
  if(Deck.reduced()) document.body.classList.add('ready'); else setTimeout(function(){document.body.classList.add('ready')},30);
})();
</script>
</body>
</html>
