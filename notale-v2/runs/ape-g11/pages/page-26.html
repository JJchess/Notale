<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .obs-head{height:112px;padding:28px 40px 14px;box-sizing:border-box}
  .kicker{color:var(--primary-bright);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em}
  .workspace{padding:0 40px 16px;box-sizing:border-box}
  .viewer{position:relative;height:424px;border:2px solid var(--line);border-radius:var(--r-lg);background:var(--panel-deep);box-shadow:var(--shadow);isolation:isolate}
  .moon-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 48%;user-select:none;pointer-events:none}
  .moon-base{filter:blur(10px) brightness(.62) contrast(.72) saturate(.35)}
  .clear-layer{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}
  .view-label{position:absolute;top:16px;z-index:7;padding:7px 13px;border-radius:999px;background:rgba(7,17,31,.82);border:1px solid var(--line);font-size:var(--fs-label);font-weight:700}
  .view-label.left{left:18px}.view-label.right{right:18px}
  .counter{position:absolute;z-index:7;right:18px;bottom:16px;background:rgba(7,17,31,.88);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;font-size:var(--fs-label)}
  .progress-dot{display:inline-block;width:20px;height:4px;margin-left:6px;border-radius:9px;background:var(--line)}
  .progress-dot.on{background:var(--primary-bright)}
  .divider{position:absolute;z-index:8;top:0;bottom:0;left:50%;width:4px;background:var(--accent);transform:translateX(-2px);cursor:ew-resize;touch-action:none;outline:none}
  .divider::after{content:"↔";position:absolute;top:50%;left:50%;display:grid;place-items:center;width:50px;height:50px;border:3px solid var(--accent);border-radius:50%;background:var(--panel-deep);color:var(--accent);font-size:24px;transform:translate(-50%,-50%);box-shadow:0 0 24px rgba(255,181,71,.42)}
  .divider:focus-visible::after{outline:4px solid var(--text);outline-offset:4px}
  .hotspot{position:absolute;z-index:6;width:48px;height:48px;padding:0;border-radius:50%;border-color:var(--primary);background:rgba(7,17,31,.58);color:var(--text);font-size:22px}
  .hotspot::after{content:attr(data-label);position:absolute;left:54px;top:7px;width:max-content;max-width:170px;padding:3px 8px;border-radius:5px;background:rgba(7,17,31,.88);color:var(--text);font-size:var(--fs-label);font-weight:650;opacity:0;transform:translateX(-5px);transition:.16s}
  .hotspot:hover::after,.hotspot:focus-visible::after,.hotspot.done::after{opacity:1;transform:none}
  .hotspot:nth-of-type(3)::after,.hotspot:nth-of-type(4)::after{left:auto;right:54px}
  .hotspot.done{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);animation:pulse .45s ease-out}
  .hotspot.wrong{animation:shake .18s linear 2;border-color:var(--danger)}
  @keyframes pulse{50%{box-shadow:0 0 0 14px rgba(255,181,71,0)}}
  @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .feedback{height:30px;margin-top:8px;color:var(--muted);font-size:var(--fs-sec);line-height:30px}
  .feedback.bad{color:var(--danger)}
  .compare-wrap{height:234px;padding:0 40px 24px;box-sizing:border-box;gap:18px}
  .k-comparison{flex:1;--compare-cols:minmax(180px,.6fr) repeat(2,minmax(0,1fr))}
  .k-comparison .cell{transition:.25s}
  .k-comparison .cell.revealed{color:var(--primary-bright);background:var(--primary-soft)}
  .side-claim{width:425px;padding:18px 20px;box-sizing:border-box;justify-content:center}
  .claim-text{font-size:var(--fs-lead);line-height:var(--lh-text);font-weight:720;opacity:.45;transition:.3s}
  .claim-text.ready{opacity:1;color:var(--text)}
  .reset{margin-top:12px;align-self:flex-start}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="26" data-total="48">
<div id="stage">
  <header class="obs-head col gap-1">
    <div class="row between items-center"><span class="kicker">SEEING / COMPARING</span><span class="chip">证据随镜而变</span></div>
    <div class="row between items-end"><h1>换一双眼睛，证据也变了</h1><span class="fs-sec muted">拖动镜片，再标出望远镜才分得开的结构</span></div>
  </header>
  <main class="workspace col min0" style="flex:1">
    <section class="viewer no-pan min0" id="viewer" aria-label="同一月面目标的裸眼等效视图与望远镜视图">
      <img class="moon-img moon-base" id="baseImg" alt="模糊的月面整体与亮暗轮廓">
      <div class="clear-layer" id="clearLayer"><img class="moon-img" id="clearImg" alt="" aria-hidden="true"></div>
      <span class="view-label left">望远镜视图</span><span class="view-label right">裸眼等效视图</span>
      <div class="divider" id="divider" role="slider" tabindex="0" aria-label="望远镜视图揭示比例" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></div>
      <button class="hotspot" style="left:24%;top:31%" data-index="0" data-label="环形山边缘" aria-label="标记环形山边缘">＋</button>
      <button class="hotspot" style="left:49%;top:57%" data-index="1" data-label="阴影边界" aria-label="标记阴影边界">＋</button>
      <button class="hotspot" style="left:69%;top:23%" data-index="2" data-label="细小明暗纹理" aria-label="标记细小明暗纹理">＋</button>
      <button class="hotspot decoy" style="left:84%;top:69%" data-label="月亮整体" aria-label="尝试标记月亮整体">＋</button>
      <div class="counter">已标记 <strong id="count">0/3</strong><span class="progress-dot"></span><span class="progress-dot"></span><span class="progress-dot"></span></div>
    </section>
    <div class="feedback" id="feedback" aria-live="polite">先左右拖动橙色镜片，比较同一位置。</div>
  </main>
  <section class="compare-wrap row min0">
    <div class="k-comparison min0">
      <div class="crow"><div class="hdr">比较维度</div><div class="hdr">裸眼</div><div class="hdr">望远镜</div></div>
      <div class="crow"><div class="dim">能否分开</div><div class="cell">月亮整体、亮暗轮廓</div><div class="cell" data-cell="0">环形山、阴影边界、明暗纹理</div></div><div class="rowline"></div>
      <div class="crow"><div class="dim">能否稳定记录</div><div class="cell">“我看见一个亮圆面”的描述</div><div class="cell" data-cell="1">可指认位置、轮廓与相对大小的影像</div></div><div class="rowline"></div>
      <div class="crow"><div class="dim">能否跨时刻比较</div><div class="cell">今夜与记忆中的月亮</div><div class="cell" data-cell="2">同一位置跨观察者、跨时刻对照</div></div>
    </div>
    <aside class="panel evidence side-claim col min0">
      <div class="fs-label accent">可比较证据</div>
      <div class="claim-text" id="claim">仪器不是简单让同一幅景象更清楚；它让原本不可区分的对象变得可指认、可记录、可比较。</div>
      <button class="reset" id="reset">重置比较</button>
    </aside>
  </section>
</div>

Deck.init({index:26,total:48});
const state={reveal:50,marked:new Set()};
const viewer=document.getElementById('viewer'), divider=document.getElementById('divider'), clearLayer=document.getElementById('clearLayer');
function setReveal(v){state.reveal=Math.max(0,Math.min(100,v));clearLayer.style.clipPath='inset(0 '+(100-state.reveal)+'% 0 0)';divider.style.left=state.reveal+'%';divider.setAttribute('aria-valuenow',String(Math.round(state.reveal)))}
function fromPointer(e){const p=Deck.pt(viewer,e);setReveal(p.x/viewer.offsetWidth*100)}
let dragging=false;
divider.addEventListener('pointerdown',e=>{dragging=true;divider.setPointerCapture(e.pointerId);fromPointer(e)});
divider.addEventListener('pointermove',e=>{if(dragging)fromPointer(e)});
divider.addEventListener('pointerup',()=>dragging=false);divider.addEventListener('pointercancel',()=>dragging=false);
divider.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setReveal(state.reveal+(e.key==='ArrowRight'?5:-5))}if(e.key==='Home')setReveal(0);if(e.key==='End')setReveal(100)});
const feedback=document.getElementById('feedback');
function update(){document.getElementById('count').textContent=state.marked.size+'/3';document.querySelectorAll('.progress-dot').forEach((d,i)=>d.classList.toggle('on',i<state.marked.size));state.marked.forEach(i=>document.querySelector('[data-cell="'+i+'"]').classList.add('revealed'));if(state.marked.size===3){document.getElementById('claim').classList.add('ready');feedback.className='feedback primary';feedback.textContent='三处结构都能被定位，并与记录中的同一位置对照。'}}
document.querySelectorAll('.hotspot[data-index]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.index);state.marked.add(i);b.classList.add('done');b.textContent='✓';feedback.className='feedback';feedback.textContent='已确认：'+b.dataset.label+'。';update()}));
document.querySelector('.decoy').addEventListener('click',e=>{const b=e.currentTarget;b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');feedback.className='feedback bad';feedback.textContent='这里两种视野都能看见；请找望远镜才分得开的结构。'});
document.getElementById('reset').addEventListener('click',()=>{state.marked.clear();setReveal(50);document.querySelectorAll('.hotspot[data-index]').forEach(b=>{b.classList.remove('done');b.textContent='＋'});document.querySelectorAll('[data-cell]').forEach(c=>c.classList.remove('revealed'));document.getElementById('claim').classList.remove('ready');feedback.className='feedback';feedback.textContent='先左右拖动橙色镜片，比较同一位置。';update()});
