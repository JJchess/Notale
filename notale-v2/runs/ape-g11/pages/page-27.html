<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .plate{position:relative;border:2px solid var(--line);border-radius:var(--r-md);background:linear-gradient(135deg,rgba(53,194,178,.04),transparent 45%),var(--panel-deep);box-shadow:var(--shadow);overflow:hidden}
  .plate:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(53,194,178,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(53,194,178,.045) 1px,transparent 1px);background-size:32px 32px}
  .diag{font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.08em;color:var(--primary-bright)}
  .meter{width:286px;padding:12px 16px;border:2px solid var(--line);border-radius:var(--r-sm);background:var(--panel)}
  .lamps{display:flex;gap:10px}.lamp{width:15px;height:15px;border:2px solid var(--line);border-radius:50%;background:var(--bg)}.lamp.on{border-color:var(--primary);background:var(--primary);box-shadow:0 0 14px rgba(53,194,178,.7)}
  #experiment-stage{position:absolute;left:50%;top:52px;width:960px;height:500px;transform:translateX(-50%);outline:none}
  #experiment-stage:focus-visible{box-shadow:0 0 0 4px var(--focus);border-radius:var(--r-sm)}
  .node-label{position:absolute;width:126px;text-align:center;pointer-events:none;line-height:1.25}
  .node-label b{display:block;font-size:var(--fs-sec);color:var(--text)}.node-label span{display:block;margin-top:31px;font-size:var(--fs-label);color:var(--muted);line-height:1.3}
  .node-label.bad span{color:var(--accent)}.node-label.fixed span{color:var(--primary-bright)}
  .repeat-label{position:absolute;font-size:var(--fs-label);color:var(--muted);pointer-events:none}.repeat-label.ready{color:var(--primary-bright)}
  .callout{position:absolute;padding:6px 10px;border-left:2px solid var(--primary);background:rgba(7,17,31,.88);font-size:var(--fs-label);color:var(--muted);pointer-events:none}
  .feedback{min-height:58px;padding:13px 18px;border-left:4px solid var(--accent);background:var(--panel-deep);font-size:var(--fs-sec);line-height:var(--lh-text)}
  .claim{display:none;padding:12px 18px;border:2px solid var(--primary);border-radius:var(--r-sm);background:var(--primary-soft);font-size:var(--fs-sec);font-weight:700;line-height:var(--lh-text)}.claim.show{display:block}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="27" data-total="48">
<div id="stage">
  <header class="row between items-start" style="height:116px;padding:30px 48px 12px">
    <div class="col gap-1"><div class="diag">KNOWLEDGE / REPEAT · 27</div><h1>可靠，不等于从不犯错</h1><div class="fs-lead muted">检查六步实验记录：哪些“复现接口”会让另一组人停下来？</div></div>
    <div class="meter row between items-center" aria-live="polite"><div><div class="fs-label muted">复现缺口</div><div id="count" class="fs-h2 mono accent">0 / 3</div></div><div class="lamps" aria-hidden="true"><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i></div></div>
  </header>

  <main class="min0" style="flex:1;padding:0 48px 12px">
    <section class="plate full min0" aria-label="可重复实验流水线">
      <div class="row between" style="position:absolute;left:24px;right:24px;top:16px"><span class="diag">A / 原实验链</span><span class="legend"><span><i class="legend-key is-current"></i>待检查接口</span><span><i class="legend-key"></i>已接通</span></span></div>
      <div id="experiment-stage" class="no-pan" tabindex="0" role="application" aria-label="实验流水线。左右方向键选择环节，回车检查；也可直接点击接口。"></div>
      <div id="labels" aria-hidden="true"></div>
      <div class="callout" style="left:34px;top:178px">公开操作细节</div>
      <div class="callout" style="right:34px;top:178px">公开原始记录</div>
      <div class="repeat-label" style="left:250px;bottom:24px">B / 独立重复链：等待可执行接口</div>
      <div class="repeat-label" style="right:238px;bottom:24px">批评返回方法与结论</div>
      <div class="panel-flat col gap-2" style="position:absolute;right:28px;top:256px;width:176px;padding:14px">
        <span class="fs-label muted">可复现接口至少说明</span>
        <span class="chip">操作量</span><span class="chip">指标与单位</span><span class="chip">方法版本</span>
      </div>
    </section>
  </main>

  <footer class="row gap-3 items-center" style="height:142px;padding:8px 48px 24px">
    <div class="feedback grow min0" id="feedback" aria-live="polite">选择一项接口检查。缺少操作细节、测量标准或公开版本，另一组人就无法独立重复。</div>
    <div class="claim grow min0" id="claim">科学家会犯错；可靠性来自公开方法、测量与结果，让别人能够重复、批评并修正。</div>
    <button id="reset" type="button">重置实验记录</button>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/konva.min.js"></script>
<script>
(function(){
  Deck.init({index:27,total:48});
  var W=960,H=500, nodeW=126,nodeH=72, gap=27, start=17, y=66, interfaceY=158;
  var steps=[
    {title:'提出问题',text:'比较哪两种条件？',bad:false},
    {title:'公开方法',text:'“加入一些盐”',fix:'加入记录表指定质量的盐',bad:true},
    {title:'记录测量',text:'“变化很明显”',fix:'记录温度计读数及单位',bad:true},
    {title:'报告结果',text:'原始记录与汇总表均公开',bad:false},
    {title:'独立重复',text:'“照旧实验”',fix:'引用公开方法版本并逐步执行',bad:true},
    {title:'接受批评并修正',text:'标出分歧，更新方法或结论',bad:false}
  ];
  var fixed=[false,false,false,false,false,false], selected=0, solved=0;
  var stage=new Konva.Stage({container:'experiment-stage',width:W,height:H});
  var layer=new Konva.Layer(); stage.add(layer);
  var primary='#35C2B2', accent='#FFB547', line='#285068', panel='#0E2033', muted='#7692A4';
  var groups=[],repeatLines=[],feedbackLine;
  function x(i){return start+i*(nodeW+gap)}
  for(var i=0;i<6;i++){
    if(i<5) layer.add(new Konva.Arrow({points:[x(i)+nodeW,y+36,x(i+1)-7,y+36],stroke:primary,fill:primary,strokeWidth:2,pointerLength:7,pointerWidth:7,listening:false}));
    var g=new Konva.Group({x:x(i),y:y});
    var rect=new Konva.Rect({width:nodeW,height:nodeH,cornerRadius:4,stroke:line,strokeWidth:2,fill:panel});
    var port=new Konva.Rect({x:0,y:92,width:nodeW,height:54,cornerRadius:4,stroke:steps[i].bad?accent:line,strokeWidth:2,fill:'#091827'});
    g.add(rect,port); layer.add(g); groups.push({g:g,rect:rect,port:port});
    (function(idx){g.on('click tap',function(){check(idx)});})(i);
    if(i<5){var rl=new Konva.Line({points:[x(i)+nodeW/2,334,x(i+1)+nodeW/2,334],stroke:muted,strokeWidth:2,dash:[7,7],opacity:.35,listening:false});layer.add(rl);repeatLines.push(rl)}
    layer.add(new Konva.Circle({x:x(i)+nodeW/2,y:334,radius:7,stroke:muted,strokeWidth:2,fill:'#07111F',opacity:.55,listening:false}));
  }
  feedbackLine=new Konva.Arrow({points:[x(5)+nodeW/2,354,x(5)+nodeW/2,416,x(1)+nodeW/2,416,x(1)+nodeW/2,230],stroke:primary,fill:primary,strokeWidth:2,pointerLength:7,pointerWidth:7,dash:[8,6],opacity:0,listening:false});layer.add(feedbackLine);
  var resultArrow=new Konva.Arrow({points:[x(5)+nodeW/2,400,x(3)+nodeW/2,400,x(3)+nodeW/2,230],stroke:primary,fill:primary,strokeWidth:2,pointerLength:7,pointerWidth:7,dash:[8,6],opacity:0,listening:false});layer.add(resultArrow);
  layer.draw();
  function renderLabels(){
    var host=document.getElementById('labels');host.innerHTML='';
    steps.forEach(function(s,i){var d=document.createElement('div');d.className='node-label '+(s.bad&&!fixed[i]?'bad':fixed[i]?'fixed':'');d.style.left='calc(50% - 480px + '+x(i)+'px)';d.style.top='118px';d.innerHTML='<b>'+(i+1)+' · '+s.title+'</b><span>'+(fixed[i]?s.fix:s.text)+'</span>';host.appendChild(d)});
  }
  function select(i){selected=(i+6)%6;groups.forEach(function(o,j){o.rect.stroke(j===selected?accent:line);o.rect.shadowColor(j===selected?accent:'transparent');o.rect.shadowBlur(j===selected?10:0)});layer.batchDraw()}
  function check(i){select(i);var s=steps[i];
    if(s.bad&&!fixed[i]){fixed[i]=true;solved++;groups[i].port.stroke(primary);groups[i].port.fill('rgba(53,194,178,.14)');
      for(var k=0;k<Math.min(solved,repeatLines.length);k++){repeatLines[k].stroke(primary);repeatLines[k].opacity(.9)}
      document.getElementById('feedback').textContent='已修复：“'+s.fix+'”。第二组现在能继续执行并比较这一环节。';
      if(!Deck.reduced()){groups[i].g.to({x:x(i)+4,duration:.08,onFinish:function(){groups[i].g.to({x:x(i),duration:.14})}})}
      if(solved===3){repeatLines.forEach(function(l){l.stroke(primary);l.opacity(1)});feedbackLine.opacity(1);resultArrow.opacity(1);document.getElementById('claim').classList.add('show');document.getElementById('feedback').textContent='两条链已接通。重复与批评会返回方法和结论，推动下一轮修正；一次一致并不是绝对证明。';}
    }else if(s.bad){document.getElementById('feedback').textContent='这一缺口已经修复。继续检查仍含模糊说法的接口。';
    }else{document.getElementById('feedback').textContent='这一环节已给出可检查的信息；再找别人无法照做或无法比较的地方。';if(!Deck.reduced()){groups[i].g.to({x:x(i)-5,duration:.06,onFinish:function(){groups[i].g.to({x:x(i)+5,duration:.06,onFinish:function(){groups[i].g.to({x:x(i),duration:.08})}})}})}}
    document.getElementById('count').textContent=solved+' / 3';document.querySelectorAll('.lamp').forEach(function(l,j){l.classList.toggle('on',j<solved)});renderLabels();layer.batchDraw();
  }
  stage.container().addEventListener('keydown',function(e){if(e.key==='ArrowRight'){e.preventDefault();select(selected+1)}else if(e.key==='ArrowLeft'){e.preventDefault();select(selected-1)}else if(e.key==='Enter'||e.key===' '){e.preventDefault();check(selected)}});
  document.getElementById('reset').addEventListener('click',function(){fixed=[false,false,false,false,false,false];solved=0;groups.forEach(function(o,i){o.port.stroke(steps[i].bad?accent:line);o.port.fill('#091827')});repeatLines.forEach(function(l){l.stroke(muted);l.opacity(.35)});feedbackLine.opacity(0);resultArrow.opacity(0);document.getElementById('claim').classList.remove('show');document.getElementById('count').textContent='0 / 3';document.querySelectorAll('.lamp').forEach(function(l){l.classList.remove('on')});document.getElementById('feedback').textContent='选择一项接口检查。缺少操作细节、测量标准或公开版本，另一组人就无法独立重复。';renderLabels();select(0)});
  renderLabels();select(0);
})();
</script>
</body>
</html>
