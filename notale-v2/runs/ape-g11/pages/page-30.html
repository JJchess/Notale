<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .hero{box-sizing:border-box;flex-shrink:0;padding:14px 42px 10px;align-items:flex-end}
  .kicker{color:var(--primary-bright);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.13em}
  .hero p{margin:7px 0 0;color:var(--muted);font-size:var(--fs-lead);line-height:var(--lh-text)}
  .workspace{margin:0 42px 26px;border:2px solid var(--line);border-radius:var(--r-lg);background:var(--panel-deep);box-shadow:var(--shadow);overflow:hidden}
  .board{position:relative;flex:1;min-width:0;min-height:0;background-image:linear-gradient(rgba(53,194,178,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(53,194,178,.055) 1px,transparent 1px);background-size:32px 32px}
  #network{width:100%;height:100%;display:block;touch-action:none}
  .side{width:330px;padding:22px;border-left:2px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel-deep));box-sizing:border-box}
  .side h2{margin-bottom:12px}.side p{margin:0}.instruction{color:var(--text);font-size:var(--fs-body);line-height:var(--lh-text)}
  .statusbox{padding:14px;border:1px solid var(--line);border-radius:var(--r-sm);background:#081725}
  .progress-value{font:720 24px/1.2 var(--font-mono);color:var(--primary-bright)}
  .feedback{min-height:68px;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-text)}
  .feedback.bad{color:var(--danger)}.conclusion{display:none;padding:14px;border-left:4px solid var(--accent);background:var(--accent-soft);font-size:var(--fs-sec);line-height:var(--lh-text)}
  .conclusion.show{display:block}.controls{margin-top:auto}.controls button{width:100%}
  .node-shell{fill:var(--panel);stroke:var(--line);stroke-width:3}.node-shell.on{stroke:var(--primary);filter:drop-shadow(0 0 10px rgba(53,194,178,.45))}
  .node-title{fill:var(--text);font:700 23px var(--font-sans);text-anchor:middle}.node-sub{fill:var(--muted);font:16px var(--font-sans);text-anchor:middle}.node-detail{fill:var(--muted);font:16px var(--font-sans);text-anchor:middle}
  .port{fill:var(--panel-deep);stroke:var(--accent);stroke-width:4;cursor:crosshair}.port:focus{outline:none;stroke:var(--text);stroke-width:6}.port.in{stroke:var(--primary)}
  .edge{fill:none;stroke:var(--primary);stroke-width:3}.draft{fill:none;stroke:var(--accent);stroke-width:4;stroke-dasharray:10 8}.bad-edge{stroke:var(--danger)}
  .edge-label{fill:var(--muted);font:15px var(--font-sans);text-anchor:middle;paint-order:stroke;stroke:var(--panel-deep);stroke-width:7px;stroke-linejoin:round}
  .head{fill:rgba(7,17,31,.78);stroke:rgba(53,194,178,.18);stroke-width:3}.center-state{fill:var(--muted);font:700 20px var(--font-sans);text-anchor:middle}.center-state.live{fill:var(--accent)}
  .flowdot{fill:var(--accent);filter:drop-shadow(0 0 8px var(--accent))}.shake{animation:shake .24s ease-in-out 2}
  @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  @media(prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body data-page="30" data-total="48">
<div id="stage">
  <header class="hero row between" style="height:122px">
    <div><div class="kicker">COGNITIVE INFRASTRUCTURE</div><h1>把知识系统接通</h1><p>让知识在机构之间经过记录、检验、统一、处理，再回到教学。</p></div>
    <span class="chip">III · 外置知识</span>
  </header>
  <main class="workspace row min0 no-pan" style="flex:1">
    <section class="board min0" aria-label="知识机构连接画布">
      <svg id="network" viewBox="0 0 1100 680" role="img" aria-labelledby="net-title net-desc">
        <title id="net-title">知识基础设施有向网络</title>
        <desc id="net-desc">从输出端口拖到下一机构的输入端口，接通知识循环。端口也可用回车或空格选择。</desc>
      </svg>
    </section>
    <aside class="side col gap-3 min0">
      <div><span class="chip accent-chip">连接任务</span><h2>把产出交给下一站</h2><p class="instruction">从橙色输出端口拖向合适的青绿输入端口。也可用 Tab 选择端口，再按 Enter 连接。</p></div>
      <div class="statusbox"><div class="fs-label muted">运行进度</div><div id="progress" class="progress-value" aria-live="polite">知识链 0 / 6</div><div id="state" class="fs-sec muted">系统未闭合</div></div>
      <div id="feedback" class="feedback" aria-live="polite">先从“学校”出发：它提出可调查的问题。</div>
      <div id="conclusion" class="conclusion">没有任何一个机构单独等于“人类知识”。知识能跨越个人寿命，是因为记录、检验、标准化、计算与教学彼此接通。</div>
      <div class="controls col gap-2"><button id="check" class="is-target">检查系统</button><button id="reset">重置连接</button></div>
    </aside>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
Deck.init({index:30,total:48});
(function(){
  const svg=d3.select('#network'), W=1100,H=680,R=72;
  const nodes=[
    {id:'school',name:'学校',sub:'教学',detail:'提出问题 · 教授方法',x:550,y:105},
    {id:'library',name:'图书馆',sub:'存档',detail:'调取已有记录',x:860,y:270},
    {id:'lab',name:'实验室',sub:'检验',detail:'测量 · 检验 · 修正',x:760,y:555},
    {id:'standard',name:'标准',sub:'互通',detail:'统一单位 · 格式 · 步骤',x:340,y:555},
    {id:'computer',name:'计算机',sub:'处理',detail:'计算 · 复制 · 检索',x:240,y:270}
  ];
  const valid=[
    {s:'school',t:'library',label:'可调查的问题'},
    {s:'library',t:'lab',label:'前人证据与空白'},
    {s:'lab',t:'standard',label:'可复查的结果'},
    {s:'standard',t:'computer',label:'可比较的数据'},
    {s:'computer',t:'school',label:'可重用的记录'}
  ];
  const completed=[]; let draft=null, keyboardSource=null;
  const defs=svg.append('defs');
  defs.append('marker').attr('id','arrow').attr('viewBox','0 -5 10 10').attr('refX',8).attr('refY',0).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto').append('path').attr('d','M0,-5L10,0L0,5').attr('fill','var(--primary)');
  const edgeLayer=svg.append('g'), dotLayer=svg.append('g'), nodeLayer=svg.append('g');
  svg.append('path').attr('class','head').attr('d','M550 250 C475 250 435 315 452 384 C464 432 500 444 500 492 L600 492 C600 451 640 432 650 382 C666 313 624 250 550 250Z');
  svg.append('text').attr('id','centerState').attr('class','center-state').attr('x',550).attr('y',365).text('系统未闭合');
  svg.append('text').attr('class','node-sub').attr('x',550).attr('y',395).text('个人头脑之外的认知外骨骼');

  const simulation=d3.forceSimulation(nodes)
    .force('link',d3.forceLink([]).id(d=>d.id).distance(190).strength(.8))
    .force('charge',d3.forceManyBody().strength(-520))
    .force('center',d3.forceCenter(550,340)).alphaDecay(.08);
  nodes.forEach(n=>{n.fx=n.x;n.fy=n.y});

  const ng=nodeLayer.selectAll('g').data(nodes).join('g').attr('class','node').attr('transform',d=>`translate(${d.x},${d.y})`);
  ng.append('circle').attr('class','node-shell').attr('r',R);
  ng.append('text').attr('class','node-title').attr('y',-17).text(d=>d.name);
  ng.append('text').attr('class','node-sub').attr('y',9).text(d=>d.sub);
  ng.append('text').attr('class','node-detail').attr('y',36).text(d=>d.detail);
  ng.append('circle').attr('class','port in').attr('r',7).attr('cx',-R).attr('tabindex',0).attr('role','button').attr('aria-label',d=>d.name+'输入端口').attr('data-kind','in');
  ng.append('circle').attr('class','port out').attr('r',7).attr('cx',R).attr('tabindex',0).attr('role','button').attr('aria-label',d=>d.name+'输出端口').attr('data-kind','out');

  function point(n,kind){return {x:n.x+(kind==='out'?R:-R),y:n.y};}
  function linePath(a,b){const mx=(a.x+b.x)/2;return `M${a.x},${a.y} Q${mx},${(a.y+b.y)/2-28} ${b.x},${b.y}`;}
  function render(){
    const lines=edgeLayer.selectAll('path.edge').data(completed,d=>d.s+'-'+d.t).join('path').attr('class','edge').attr('marker-end','url(#arrow)').attr('d',d=>linePath(point(nodes.find(n=>n.id===d.s),'out'),point(nodes.find(n=>n.id===d.t),'in')));
    edgeLayer.selectAll('text.edge-label').data(completed,d=>d.s+'-'+d.t).join('text').attr('class','edge-label').attr('x',d=>(nodes.find(n=>n.id===d.s).x+nodes.find(n=>n.id===d.t).x)/2).attr('y',d=>(nodes.find(n=>n.id===d.s).y+nodes.find(n=>n.id===d.t).y)/2-22).text(d=>d.label);
    ng.select('.node-shell').classed('on',d=>d.id==='school'||completed.some(e=>e.t===d.id));
    const done=completed.length===valid.length, amount=done?6:completed.length;
    d3.select('#progress').text(`知识链 ${amount} / 6`);d3.select('#state').text(done?'知识系统已运行':'系统未闭合');
    d3.select('#centerState').text(done?'知识系统已运行':'系统未闭合').classed('live',done);
    d3.select('#conclusion').classed('show',done);
    if(done){d3.select('#feedback').classed('bad',false).text('修正后的知识回到学校，并产生下一轮新问题。');runFullLoop();}
  }
  function attempt(source,target){
    const expected=valid[completed.length];
    if(expected&&source.id===expected.s&&target.id===expected.t){completed.push(expected);render();pulse(expected);}
    else{const f=d3.select('#feedback').classed('bad',true).text('这次交接缺少合适的输入：想想上一站产出的是什么。');f.classed('shake',false);void f.node().offsetWidth;f.classed('shake',!Deck.reduced());}
  }
  function pulse(e){if(Deck.reduced())return;const a=point(nodes.find(n=>n.id===e.s),'out'),b=point(nodes.find(n=>n.id===e.t),'in');const p=dotLayer.append('circle').attr('class','flowdot').attr('r',7);p.transition().duration(600).ease(d3.easeCubicOut).attrTween('transform',()=>{const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',linePath(a,b));const len=path.getTotalLength();return t=>{const q=path.getPointAtLength(t*len);return `translate(${q.x},${q.y})`;};}).remove();}
  function runFullLoop(){if(Deck.reduced())return;const seq=completed.map(e=>[point(nodes.find(n=>n.id===e.s),'out'),point(nodes.find(n=>n.id===e.t),'in')]);const p=dotLayer.append('circle').attr('class','flowdot').attr('r',8);let i=0;function next(){if(i>=seq.length){p.remove();return}const [a,b]=seq[i++],path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',linePath(a,b));const len=path.getTotalLength();p.transition().duration(360).ease(d3.easeLinear).attrTween('transform',()=>t=>{const q=path.getPointAtLength(t*len);return `translate(${q.x},${q.y})`;}).on('end',next)}next();}

  ng.selectAll('.port').on('pointerdown',function(event,d){event.stopPropagation();if(this.dataset.kind!=='out')return;draft={source:d};const a=point(d,'out');draft.path=edgeLayer.append('path').attr('class','draft').attr('d',linePath(a,a));this.setPointerCapture(event.pointerId);})
  .on('pointermove',function(event,d){if(!draft)return;const p=d3.pointer(event,svg.node()),a=point(draft.source,'out');draft.path.attr('d',linePath(a,{x:p[0],y:p[1]}));})
  .on('pointerup',function(event){if(!draft)return;const p=d3.pointer(event,svg.node());let target=nodes.find(n=>Math.hypot(point(n,'in').x-p[0],point(n,'in').y-p[1])<34);draft.path.remove();if(target)attempt(draft.source,target);else d3.select('#feedback').classed('bad',true).text('请把线拖到下一机构的青绿输入端口。');draft=null;})
  .on('keydown',function(event,d){if(event.key!=='Enter'&&event.key!==' ')return;event.preventDefault();if(this.dataset.kind==='out'){keyboardSource=d;d3.select('#feedback').classed('bad',false).text('已选择“'+d.name+'”输出，请选择下一机构的输入端口。');}else if(keyboardSource){attempt(keyboardSource,d);keyboardSource=null;}});

  ng.call(d3.drag().filter(event=>!event.target.classList.contains('port')).on('start',(event,d)=>{d.fx=d.x;d.fy=d.y}).on('drag',(event,d)=>{d.fx=Math.max(R+15,Math.min(W-R-15,event.x));d.fy=Math.max(R+15,Math.min(H-R-15,event.y));d.x=d.fx;d.y=d.fy;ng.attr('transform',n=>`translate(${n.x},${n.y})`);render();}).on('end',(event,d)=>{d.fx=d.x;d.fy=d.y;}));
  d3.select('#check').on('click',()=>{const done=completed.length===valid.length;d3.select('#feedback').classed('bad',!done).text(done?'闭环完整：知识能被下一代继续检验。':'系统未闭合：沿着已点亮的节点继续交接。');});
  d3.select('#reset').on('click',()=>{completed.splice(0);edgeLayer.selectAll('*').remove();dotLayer.selectAll('*').remove();keyboardSource=null;d3.select('#feedback').classed('bad',false).text('连接已清空。节点位置保留，请从“学校”重新出发。');render();});
  render();
  if(!Deck.reduced()){ng.attr('opacity',0).attr('transform','translate(550,340)').transition().delay((d,i)=>180+i*80).duration(520).ease(d3.easeCubicOut).attr('opacity',1).attr('transform',d=>`translate(${d.x},${d.y})`);}
})();
</script>
</body>
</html>
