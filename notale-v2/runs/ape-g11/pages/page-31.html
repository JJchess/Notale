<style>
  :root{--bg:#07111F;--text:#E8F1F7;--font-sans:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  .page-head{padding:34px 64px 12px;position:relative;z-index:3}

  .scene{position:relative;margin:0 52px 34px;isolation:isolate}
  .scene::before{position:absolute;inset:4% 8%;background:radial-gradient(ellipse at 48% 48%,rgba(53,194,178,.12),transparent 55%);content:"";z-index:-1}
  .system-art{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .shell{fill:rgba(53,194,178,.025);stroke:var(--primary);stroke-width:2;stroke-opacity:.38;transform-origin:610px 350px;animation:open .72s cubic-bezier(.2,.8,.2,1) both}
  .s2{animation-delay:.12s}.s3{animation-delay:.24s}.s4{animation-delay:.36s}
  .human{fill:rgba(53,194,178,.16);stroke:var(--primary-bright);stroke-width:3;animation:appear .5s ease-out both}
  .system-line{fill:none;stroke:var(--primary);stroke-width:2;stroke-opacity:.55}
  .node{fill:var(--accent);filter:drop-shadow(0 0 8px rgba(255,181,71,.8))}
  .icon{fill:none;stroke:var(--primary-bright);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .k-generalization{position:absolute;inset:0;display:block}
  .k-generalization>.claim{position:absolute;left:30px;bottom:24px;width:445px;padding:20px 24px;border-left-color:var(--accent);background:rgba(14,32,51,.92);font-size:20px;box-shadow:var(--shadow);animation:labels .45s .72s ease-out both}
  .k-generalization>.trunk{position:absolute;left:475px;bottom:80px;width:90px;height:2px;margin:0;background:linear-gradient(90deg,var(--accent),var(--primary))}
  .k-generalization>.supports{position:absolute;inset:0;display:block;padding:0}
  .k-generalization>.supports::before{display:none}
  .k-generalization .support{position:absolute;width:286px;padding:13px 18px 14px;border-color:var(--line-soft);background:rgba(9,24,39,.91);box-shadow:none;animation:labels .45s .72s ease-out both}
  .k-generalization .support::before{display:none}
  .support strong{display:block;color:var(--primary-bright);font-size:16px;line-height:1.3}
  .support span{display:block;margin-top:4px;color:var(--text);font-size:16px;line-height:1.4}
  .support em{display:inline-block;margin-top:5px;color:var(--muted);font-size:14px;font-style:normal;letter-spacing:.04em}
  .paper{right:42px;top:40px}.instrument{right:12px;top:178px}.standard{right:28px;top:316px}.people{right:76px;top:454px}
  .center-tag{position:absolute;left:526px;top:318px;width:168px;text-align:center;color:var(--text);font-size:18px;font-weight:720;line-height:1.35}
  .center-tag small{display:block;margin-top:3px;color:var(--muted);font-size:16px;font-weight:500}
  .whole-tag{position:absolute;left:885px;bottom:36px;color:var(--accent);font-size:16px;font-weight:720;letter-spacing:.05em}
  .hand-scale{position:absolute;left:532px;top:532px}
  .footer-thought{position:absolute;left:525px;bottom:21px;max-width:740px;color:var(--muted);font-size:16px;line-height:1.45}
  @keyframes open{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
  @keyframes appear{from{opacity:0}to{opacity:1}}
  @keyframes labels{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.shell,.human,.k-generalization>.claim,.k-generalization .support{animation:none}}
</style>
