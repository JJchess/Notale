<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:28px 34px 26px;gap:18px}
  .scene{position:relative;overflow:hidden;border:2px solid var(--line);border-radius:var(--r-lg);background:radial-gradient(circle at 42% 58%,rgba(53,194,178,.11),transparent 38%),var(--panel-deep);box-shadow:var(--shadow)}
  #space{position:absolute;inset:0;width:100%;height:100%;display:block}
  .scene-tag{position:absolute;left:22px;top:18px;display:flex;gap:18px;align-items:center}
  .key{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:var(--fs-label)}
  .sw{width:24px;height:3px;border-radius:4px;background:var(--accent)}
  .sw.g{background:var(--primary)}
  .process-wrap{position:absolute;right:20px;top:18px;width:300px;padding:16px;background:rgba(9,24,39,.92);border:2px solid var(--line);border-radius:var(--r-md)}
  .k-process.is-vertical{gap:4px}
  .k-process.is-vertical>.step{padding:8px 12px;font-size:var(--fs-sec);line-height:1.35;background:rgba(14,32,51,.94)}
  .k-process.is-vertical>.arw{flex-basis:13px;font-size:16px}
  .k-process.is-vertical>.axis{left:19px}
  .step b{display:inline-block;width:22px;color:var(--primary-bright);font-family:var(--font-mono)}
  .controls{position:absolute;left:22px;bottom:20px;width:440px;padding:16px 18px;background:rgba(9,24,39,.94)}
  input[type=range]{width:100%;height:28px}
  .progress{position:absolute;right:342px;bottom:20px;display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(9,24,39,.9);border:2px solid var(--line);border-radius:var(--r-md)}
  .ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--p,0deg),var(--line) 0);position:relative}
  .ring:after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--panel-deep)}
  .ring span{z-index:1;font:700 var(--fs-tick)/1 var(--font-mono)}
  #feedback{min-width:240px;font-size:var(--fs-sec);line-height:1.4;color:var(--muted)}
  .claim{height:76px;display:flex;align-items:center;justify-content:center;padding:0 26px;border-left:7px solid var(--accent);background:linear-gradient(90deg,var(--accent-soft),transparent 70%),var(--panel);border-radius:var(--r-md);font-size:var(--fs-lead);font-weight:720;text-align:center}
  .cannon-kick{animation:kick 120ms ease-out}
  @keyframes kick{50%{transform:translateX(-6px)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="33" data-total="48">
<div id="stage">
  <header class="row between items-end" style="height:66px">
    <div><div class="chip accent-chip">ORBIT AS FALL · 牛顿炮台</div><h1>不断下落，为什么不会落地？</h1></div>
    <div class="fs-sec muted">只改变水平初速度，再比较轨迹与弯曲地面</div>
  </header>

  <main class="scene min0" style="flex:1" aria-label="交互式地球轨道模拟">
    <canvas id="space" aria-label="固定侧视地球：橙色弹丸沿切线前进，青绿色重力箭头始终指向地心，实时轨迹逐渐弯曲"></canvas>
    <div class="scene-tag">
      <span class="key"><i class="sw"></i>水平速度与实时轨迹</span>
      <span class="key"><i class="sw g"></i>重力方向</span>
      <span class="chip" id="stateChip">等待发射</span>
    </div>

    <aside class="process-wrap" aria-label="持续下落的循环因果链">
      <h2 style="margin-bottom:10px">一次下落循环</h2>
      <div class="k-process is-vertical" id="steps">
        <div class="axis"></div>
        <div class="step is-current"><b>1</b>设定水平初速度</div><div class="arw"></div>
        <div class="step"><b>2</b>炮弹向前移动</div><div class="arw"></div>
        <div class="step"><b>3</b>重力持续拉向地心</div><div class="arw"></div>
        <div class="step"><b>4</b>轨迹向地球弯曲</div><div class="arw"></div>
        <div class="step"><b>5</b>地面也在弯离</div>
      </div>
    </aside>

    <section class="controls panel" aria-label="发射控制">
      <div class="row between items-center"><label for="speed" class="ctl-label">水平初速度</label><strong class="mono accent" id="speedRead">—</strong></div>
      <input id="speed" type="range" min="35" max="100" value="72" step="1" aria-describedby="speedHint">
      <div id="speedHint" class="fs-sec muted">拖动时，炮口切向箭头同步改变长度。</div>
      <div class="row gap-2" style="margin-top:10px"><button id="launch" class="is-target">发射</button><button id="reset">重置炮台</button></div>
    </section>

    <section class="progress" aria-label="绕行进度">
      <div class="ring" id="ring"><span id="angle">—</span></div>
      <div><div class="fs-label muted">已绕过地球弧度</div><div id="feedback">调整速度后发射，观察落点如何沿弧面推远。</div></div>
    </section>
  </main>

  <div class="claim" style="height:76px">轨道不是停止下落，而是横向速度足够大，使飞行物持续下落却不断错过弯曲的地面。</div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/three.min.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:33,total:48});
  var K=Lec.K, P=Lec.P, earthMass=K.astronomy.earthMass, earthRadius=K.astronomy.earthMeanRadius;
  var altitude=K.physics.lowEarthOrbitTypicalAltitude;
  var circular=P.circularOrbitVelocityAtAltitude(earthMass,earthRadius,altitude);
  var canvas=document.getElementById('space'), host=canvas.parentElement;
  var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.outputColorSpace=THREE.SRGBColorSpace;
  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(38,1,.01,100); camera.position.set(0,0,3.2);
  var earth=new THREE.Mesh(new THREE.SphereGeometry(1,64,64),new THREE.MeshStandardMaterial({color:0x123b52,roughness:.78,metalness:.08,emissive:0x061927}));
  earth.position.y=-.16; scene.add(earth);
  scene.add(new THREE.HemisphereLight(0x8ee9dc,0x06111d,2.2));
  var light=new THREE.DirectionalLight(0xffffff,2.7);light.position.set(-2,3,4);scene.add(light);
  var atmosphere=new THREE.Mesh(new THREE.SphereGeometry(1.025,64,64),new THREE.MeshBasicMaterial({color:0x35c2b2,transparent:true,opacity:.16,side:THREE.BackSide})); atmosphere.position.copy(earth.position);scene.add(atmosphere);
  var cannon=new THREE.Group();
  var base=new THREE.Mesh(new THREE.BoxGeometry(.13,.07,.12),new THREE.MeshStandardMaterial({color:0xa9c0cf,metalness:.7,roughness:.3}));
  var barrel=new THREE.Mesh(new THREE.CylinderGeometry(.025,.034,.22,16),new THREE.MeshStandardMaterial({color:0xffb547,emissive:0x5a3100}));barrel.rotation.z=-Math.PI/2;barrel.position.x=.11;cannon.add(base,barrel);cannon.position.set(0,0.875,0);scene.add(cannon);
  var ball=new THREE.Mesh(new THREE.SphereGeometry(.032,20,20),new THREE.MeshBasicMaterial({color:0xffb547}));scene.add(ball);
  var velArrow=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(0,.875,0),.48,0xffb547,.08,.05);scene.add(velArrow);
  var gravArrow=new THREE.ArrowHelper(new THREE.Vector3(0,-1,0),new THREE.Vector3(0,.875,0),.26,0x35c2b2,.07,.045);scene.add(gravArrow);
  var lineGeom=new THREE.BufferGeometry(), lineMat=new THREE.LineBasicMaterial({color:0xffb547,transparent:true,opacity:.88});
  var trail=new THREE.Line(lineGeom,lineMat);scene.add(trail);
  var speed=document.getElementById('speed'),speedRead=document.getElementById('speedRead'),launch=document.getElementById('launch'),reset=document.getElementById('reset');
  var feedback=document.getElementById('feedback'),angleEl=document.getElementById('angle'),ring=document.getElementById('ring'),chip=document.getElementById('stateChip'),steps=[].slice.call(document.querySelectorAll('#steps .step'));
  var running=false,done=false,pos={x:0,y:earthRadius+altitude},vel={x:0,y:0},points=[],travelAngle=0,lastAngle=Math.PI/2,accum=0;
  function pct(){return Number(speed.value)/K.math.hundred}
  function fmtSpeed(v){return P.formatFixed(v/K.units.metrePerKilometre,2)+' km/s'}
  function updateControl(){var v=circular*pct();speedRead.textContent=fmtSpeed(v);velArrow.setLength(.2+.45*pct(),.08,.05);if(!running){steps.forEach(function(s,i){s.classList.toggle('is-current',i===0);s.classList.remove('is-past')})}}
  function setBall(){var scale=1/earthRadius;ball.position.set(pos.x*scale,pos.y*scale-.16,0);var r=Math.sqrt(pos.x*pos.x+pos.y*pos.y);var gx=-pos.x/r,gy=-pos.y/r;gravArrow.position.copy(ball.position);gravArrow.setDirection(new THREE.Vector3(gx,gy,0));velArrow.position.copy(ball.position);var vm=Math.sqrt(vel.x*vel.x+vel.y*vel.y)||1;velArrow.setDirection(new THREE.Vector3(vel.x/vm,vel.y/vm,0));}
  function redrawTrail(){var scale=1/earthRadius;lineGeom.setFromPoints(points.map(function(p){return new THREE.Vector3(p.x*scale,p.y*scale-.16,0)}))}
  function resetSim(){running=false;done=false;pos={x:0,y:earthRadius+altitude};vel={x:circular*pct(),y:0};points=[{x:pos.x,y:pos.y}];travelAngle=0;lastAngle=Math.PI/2;accum=0;lineMat.opacity=.88;chip.textContent='等待发射';feedback.textContent='调整速度后发射，观察落点如何沿弧面推远。';ring.style.setProperty('--p','0deg');angleEl.textContent=P.formatFixed(0,0)+'°';setBall();redrawTrail();updateControl()}
  function start(){resetSim();running=true;chip.textContent='实时计算中';feedback.textContent='重力始终存在，速度方向正连续向地心弯折。';canvas.classList.remove('cannon-kick');void canvas.offsetWidth;canvas.classList.add('cannon-kick')}
  function finish(hit){running=false;done=true;chip.textContent=hit?'与地表相交':'完成一圈';feedback.textContent=hit?'水平速度还不够：轨迹先与地表相交。':'仍在下落，也仍在错过地面。';lineMat.opacity=1;steps.forEach(function(s){s.classList.add('is-past');s.classList.remove('is-current')});steps[4].classList.add('is-current')}
  function physicsStep(dt){var r=Math.sqrt(pos.x*pos.x+pos.y*pos.y),g=P.gravityAtDistance(earthMass,r);vel.x+=(-pos.x/r)*g*dt;vel.y+=(-pos.y/r)*g*dt;pos.x+=vel.x*dt;pos.y+=vel.y*dt;var a=Math.atan2(pos.y,pos.x),d=lastAngle-a;if(d<0)d+=K.math.tau;travelAngle+=d;lastAngle=a;points.push({x:pos.x,y:pos.y});if(points.length>900)points.shift();var deg=Math.min(K.math.hundred*3.6,travelAngle*K.units.degreePerRadian);ring.style.setProperty('--p',deg+'deg');angleEl.textContent=P.formatFixed(deg,0)+'°';var rr=Math.sqrt(pos.x*pos.x+pos.y*pos.y);if(rr<=earthRadius){finish(true)}else if(travelAngle>=K.math.tau){finish(false)}setBall();redrawTrail()}
  speed.addEventListener('input',function(){if(!running){resetSim()}else{updateControl()}});launch.addEventListener('click',start);reset.addEventListener('click',resetSim);
  function resize(){var w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
  Deck.onResize(resize);resize();resetSim();
  var fixed=1/120, physicalScale=900;
  Deck.loop(function(t,dt){if(running&&!Deck.reduced()){accum+=Math.min(dt,.04);while(accum>=fixed&&running){physicsStep(fixed*physicalScale);accum-=fixed}}renderer.render(scene,camera)},{still:1});
})();
</script>
</body>
</html>
