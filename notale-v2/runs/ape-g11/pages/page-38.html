<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .plate{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(53,194,178,.035),transparent 48%),var(--panel-deep)}
  .plate:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(53,194,178,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(53,194,178,.045) 1px,transparent 1px);background-size:28px 28px}
  .stage-btn{flex:1;position:relative;min-width:0;padding:0 8px;font-size:var(--fs-label)}
  .stage-btn.seen:after{content:"";position:absolute;right:9px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--primary)}
  .stage-btn.shake{animation:shake .24s ease-out}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  #riskSvg{position:absolute;inset:0;width:100%;height:100%}
  .detail-title{font-size:var(--fs-h2);font-weight:760;color:var(--accent)}
  .detail-mode{font-family:var(--font-mono);font-size:var(--fs-lead);color:var(--primary-bright)}
  .wire-photo{height:154px;background:radial-gradient(circle at 58% 35%,rgba(232,241,247,.18),transparent 18%),linear-gradient(145deg,#152b3b,#07111f);position:relative}
  .wire-photo svg{width:100%;height:100%;display:block}
  .tiny-source{font-size:14px;color:var(--faint)}
  .done{border-color:var(--accent);background:linear-gradient(90deg,var(--accent-soft),transparent),var(--panel)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="38" data-total="48">
<div id="stage">
  <header class="row between items-end gap-4" style="height:112px;padding:28px 42px 14px">
    <div class="min0"><div class="fs-label primary mono">BODY UNDER CONSTRAINT · E4</div><h1>人体风险的五只时钟</h1></div>
    <div class="fs-lead muted ta-right" style="max-width:670px">“太空环境危险”不是一种单一风险：有些按月累积，有些在几分钟内达到峰值。</div>
  </header>

  <main class="k-classification min0" style="flex:1;padding:0 42px 22px">
    <section class="lv min0" style="flex:1;margin-left:0;padding-left:18px">
      <div class="box min0 col" style="flex:1;padding:14px">
        <div class="bt between" style="margin:-14px -14px 12px;padding:8px 14px">
          <span>按起效时间 × 累积方式分类</span>
          <span id="progress" class="fs-label mono">已查看 1 / 5 阶段</span>
        </div>
        <div class="row gap-3 min0" style="height:56px">
          <div class="fs-label muted center row" style="width:178px">选择任务阶段</div>
          <div id="stageButtons" class="row gap-2 grow min0"></div>
        </div>
        <div class="row gap-3 min0" style="flex:1">
          <div id="viz" class="plate panel-flat min0" style="flex:1">
            <svg id="riskSvg" viewBox="0 0 1120 560" role="img" aria-label="五类人体风险在五个任务阶段中的起效与累积轨道">
              <title>人体风险阶段分类图</title><desc>每行是一类风险，每列是一个任务阶段。扫描线随所选阶段移动。</desc>
            </svg>
          </div>
          <aside class="col gap-3 min0" style="width:344px">
            <div id="detail" class="panel evidence pad-3 col gap-2" style="flex:1" aria-live="polite"></div>
            <div class="photo wire-photo" title="长期任务中，航天员会使用阻力训练设备维护肌肉与骨骼；真实在轨训练是日常任务的一部分。">
              <svg viewBox="0 0 320 154" aria-hidden="true"><g fill="none" stroke="#67E1D2" stroke-width="2"><path d="M58 127V33h41v94M61 51h35M79 51v31l-21 31M79 82l35 30M99 40h89v88M130 40v89M160 40v89"/><circle cx="212" cy="45" r="14"/><path d="M212 59v40m0-24-31 20m31-20 34 15m-34 9-22 34m22-34 29 31" stroke="#E8F1F7"/><path d="M245 90h35m-99 5h-24" stroke-dasharray="5 5"/></g><text x="16" y="22" fill="#A9C0CF" font-size="15">在轨阻力训练 · 工程线稿</text></svg>
            </div>
            <div class="tiny-source">情境依据：NASA 国际空间站阻力训练记录</div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <footer class="row between items-center gap-4" style="height:84px;padding:10px 42px 24px">
    <div id="conclusion" class="note fs-sec" style="max-width:1040px">任务越长，并非所有风险都等比例增加；防护必须按不同时间尺度设计。</div>
    <button id="reset" type="button" aria-label="重新扫描全部任务阶段">重新扫描</button>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  Deck.init({index:38,total:48});
  var phases=['发射','最初数日','长期驻留','返程','再入'];
  var risks=[
    {name:'辐射',scale:'全程 · 随任务延长',kind:'持续累积',values:[1,2,3,3,2],shape:'radiation'},
    {name:'骨量流失',scale:'数周至数月',kind:'缓慢累积',values:[0,0,3,2,1],shape:'bone'},
    {name:'肌肉衰减',scale:'数日至数月',kind:'开始较早',values:[0,1,3,2,1],shape:'muscle'},
    {name:'隔离与心理压力',scale:'数日至数月',kind:'波动累积',values:[1,1,3,3,1],shape:'mind'},
    {name:'再入过载',scale:'秒至分钟',kind:'短时峰值',values:[0,0,0,0,3],shape:'reentry'}
  ];
  var details=[
    {risk:'隔离与心理压力',mode:'任务刚开始',text:'封闭与任务压力已经出现，但长期累积尚未展开。'},
    {risk:'辐射',mode:'持续累积',text:'离开地面防护后，暴露随在轨时间延长；肌肉变化也开始出现。'},
    {risk:'骨量流失',mode:'持续累积',text:'数周至数月的停留，使骨量、肌肉与心理风险同时成为重点。'},
    {risk:'隔离与心理压力',mode:'持续累积',text:'返程仍在封闭环境中；已经形成的身体变化不会立刻归零。'},
    {risk:'再入过载',mode:'短时峰值',text:'峰值只持续秒至分钟，不按驻留月数累积，却集中在再入阶段。'}
  ];
  var current=0, seen=new Set([0]), completed=false;
  var buttons=d3.select('#stageButtons').selectAll('button').data(phases).join('button').attr('type','button').attr('class','stage-btn').attr('aria-pressed',function(d,i){return i===0?'true':'false'}).text(function(d){return d}).on('click',function(e,d){selectPhase(phases.indexOf(d),this)});
  var svg=d3.select('#riskSvg'), W=1120,H=560, left=205,right=25,top=72,bottom=25;
  var x=d3.scaleBand().domain(phases).range([left,W-right]).padding(0.12);
  var y=d3.scaleBand().domain(risks.map(function(d){return d.name})).range([top,H-bottom]).padding(0.2);
  svg.append('g').selectAll('text').data(phases).join('text').attr('x',function(d){return x(d)+x.bandwidth()/2}).attr('y',38).attr('text-anchor','middle').attr('fill','#A9C0CF').attr('font-size',15).text(function(d){return d});
  svg.append('g').selectAll('line').data(phases).join('line').attr('x1',function(d){return x(d)}).attr('x2',function(d){return x(d)}).attr('y1',52).attr('y2',H-bottom).attr('stroke','#285068').attr('stroke-dasharray','4 7');
  var rows=svg.append('g').selectAll('g.risk').data(risks).join('g').attr('class','risk');
  rows.append('rect').attr('x',8).attr('y',function(d){return y(d.name)}).attr('width',W-16).attr('height',y.bandwidth()).attr('rx',8).attr('fill','#0E2033').attr('stroke','#285068');
  rows.append('text').attr('x',22).attr('y',function(d){return y(d.name)+y.bandwidth()/2-5}).attr('fill','#E8F1F7').attr('font-size',18).attr('font-weight',700).text(function(d){return d.name});
  rows.append('text').attr('x',22).attr('y',function(d){return y(d.name)+y.bandwidth()/2+19}).attr('fill','#A9C0CF').attr('font-size',15).text(function(d){return d.scale});
  var cells=rows.selectAll('rect.cell').data(function(r){return phases.map(function(p,i){return {risk:r,phase:p,i:i,value:r.values[i]}})}).join('rect').attr('class','cell').attr('x',function(d){return x(d.phase)}).attr('y',function(d){return y(d.risk.name)+12}).attr('width',x.bandwidth()).attr('height',y.bandwidth()-24).attr('rx',function(d){return d.risk.shape==='reentry'?3:10});
  var scan=svg.append('line').attr('y1',48).attr('y2',H-bottom).attr('stroke','#FFB547').attr('stroke-width',3);
  var scanTag=svg.append('text').attr('y',64).attr('text-anchor','middle').attr('fill','#FFB547').attr('font-size',15).attr('font-weight',700).text('当前扫描');
  function color(v){return ['#183047','#25685F','#35C2B2','#FFB547'][v]}
  function selectPhase(i,node){
    if(i===current && seen.size>1){node.classList.remove('shake');void node.offsetWidth;node.classList.add('shake');document.getElementById('detail').setAttribute('aria-label','请选择另一阶段，比较风险如何改变');return}
    current=i;seen.add(i);if(seen.size===phases.length)completed=true;render();
  }
  function render(){
    buttons.classed('is-target',function(d,i){return i===current}).classed('seen',function(d,i){return seen.has(i)}).attr('aria-pressed',function(d,i){return i===current?'true':'false'});
    var cx=x(phases[current])+x.bandwidth()/2;
    var t=Deck.reduced()?svg:svg.transition().duration(240).ease(d3.easeCubicOut);
    t.select(function(){return scan.node()}).attr('x1',cx).attr('x2',cx);t.select(function(){return scanTag.node()}).attr('x',cx);
    cells.transition().duration(Deck.reduced()?0:240).attr('fill',function(d){return color(d.i<=current?d.value:0)}).attr('opacity',function(d){return d.i<=current?1:.34}).attr('stroke',function(d){return d.i===current&&d.value>0?'#FFB547':'none'}).attr('stroke-width',2);
    rows.attr('opacity',function(d){return d.values[current]>0?1:.55});
    var q=details[current];document.getElementById('detail').innerHTML='<div class="fs-label muted mono">'+phases[current]+' · 当前重点</div><div class="detail-title">'+q.risk+'</div><div class="detail-mode">'+q.mode+'</div><div class="fs-sec">'+q.text+'</div><div class="legend"><span><i class="legend-key"></i>累积／持续</span><span><i class="legend-key is-current"></i>峰值／当前</span></div>';
    document.getElementById('progress').textContent='已查看 '+seen.size+' / '+phases.length+' 阶段';
    var c=document.getElementById('conclusion');c.classList.toggle('done',completed);c.textContent=completed?'不是一只风险表，而是五只时钟：起效、累积与峰值各有节奏。':'任务越长，并非所有风险都等比例增加；防护必须按不同时间尺度设计。';
  }
  document.getElementById('reset').addEventListener('click',function(){current=0;seen=new Set([0]);completed=false;render();buttons.nodes()[0].focus()});
  render();
})();
</script>
</body>
</html>
