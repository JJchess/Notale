<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .mission-head{box-sizing:border-box;flex:0 0 auto;position:relative;overflow:hidden;border-bottom:1px solid var(--line-soft);background:linear-gradient(90deg,var(--panel-deep),transparent)}
  .process-band{box-sizing:border-box;flex:0 0 auto;background:var(--panel-deep);border-bottom:1px solid var(--line-soft)}
  .process-band .step{padding:10px 12px;text-align:center;font-size:var(--fs-label);font-weight:680}.process-band .arw{flex-basis:24px}
  .kicker{color:var(--primary-bright);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.16em}
  .orbital{position:absolute;right:48px;top:16px;width:310px;height:92px;border-top:2px dashed var(--accent);border-radius:50%;opacity:.55}
  .world{position:absolute;border:2px solid var(--primary);border-radius:50%;background:var(--panel-soft)}
  .earth{right:330px;top:52px;width:52px;height:52px}.moon{right:46px;top:27px;width:24px;height:24px}.orbit-label{position:absolute;padding:5px 9px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-deep);color:var(--muted);font-size:var(--fs-label)}
  .progress-lamps{display:flex;gap:8px}.lamp{width:34px;height:8px;border-radius:99px;background:var(--line)}.lamp.on{background:var(--success);box-shadow:0 0 12px rgba(101,212,154,.45)}
  .controls{width:430px}.controls .ctl{box-sizing:border-box;justify-content:space-between;margin-top:8px;padding:6px 10px;border:1px solid var(--line-soft);border-radius:var(--r-sm);background:var(--panel-deep)}
  .ctl input[type=range]{width:170px}.ctl select{width:170px}
  .control-value{width:74px;text-align:right;color:var(--accent);font:700 var(--fs-label)/1.4 var(--font-mono)}
  .ledger{position:relative;overflow:hidden}.ledger-head,.ledger-row{display:grid;grid-template-columns:1.25fr 1fr 1fr .8fr;align-items:center;gap:12px}
  .ledger-head{height:42px;padding:0 18px;border-bottom:2px solid var(--primary);color:var(--muted);font-size:var(--fs-label);font-weight:700}
  .ledger-row{min-height:76px;padding:8px 18px;border-bottom:1px solid var(--line-soft);transition:border-color 220ms ease,background 220ms ease,transform 180ms ease}
  .ledger-row.pass{background:linear-gradient(90deg,var(--primary-soft),transparent);border-left:4px solid var(--success)}
  .ledger-row.fail{border-left:4px solid var(--accent)}
  .ledger-row.shake{animation:shake .22s ease-out}.ledger-name{font-size:var(--fs-body);font-weight:720}.ledger-sub{color:var(--muted);font-size:var(--fs-label)}
  .metric{box-sizing:border-box;min-height:46px;padding:10px 12px;border:1px solid var(--line-soft);border-radius:var(--r-sm);background:var(--panel-deep);font:700 var(--fs-sec)/1.4 var(--font-mono)}.status{box-sizing:border-box;min-height:38px;padding:8px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:var(--fs-label);font-weight:750;text-align:center}.pass .status{color:var(--success)}.fail .status{color:var(--accent)}
  .feedback{min-height:58px;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-text)}
  .flowback{position:absolute;right:8px;top:42px;bottom:8px;width:12px;border-right:2px dashed var(--line);border-top:2px dashed var(--line);border-bottom:2px dashed var(--line);pointer-events:none}
  .approval{min-width:210px;padding:14px 24px;border:3px double var(--line);color:var(--faint);font:800 var(--fs-h2)/1.2 var(--font-mono);text-align:center;transform:rotate(-2deg);transition:all .3s ease}
  .approval.ready{border-color:var(--accent);color:var(--accent);box-shadow:0 0 24px rgba(255,181,71,.24);animation:stamp .7s cubic-bezier(.2,.8,.2,1)}
  .enter{animation:rise .55s both}.ledger-row:nth-child(3){animation-delay:70ms}.ledger-row:nth-child(4){animation-delay:140ms}.ledger-row:nth-child(5){animation-delay:210ms}.ledger-row:nth-child(6){animation-delay:280ms}.ledger-row:nth-child(7){animation-delay:350ms}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes shake{25%{transform:translateX(7px)}60%{transform:translateX(-5px)}}@keyframes stamp{0%{opacity:.2;transform:translateY(-18px) rotate(-2deg) scale(1.08)}100%{opacity:1;transform:rotate(-2deg)}}
  @media(prefers-reduced-motion:reduce){.enter,.ledger-row.shake,.approval.ready{animation:none!important}.ledger-row,.approval{transition:none}}
</style>
</head>
<body data-page="39" data-total="48">
<div id="stage">
  <header class="mission-head row between items-center pad-4" style="height:150px">
    <div class="col gap-1">
      <div class="kicker">MISSION LEDGER · 39</div>
      <h1>五本账，必须同时闭合</h1>
      <div class="fs-sec muted">月球任务不是把某一项调到最大，而是让五项约束同时成立。</div>
    </div>
    <div class="col items-end gap-2" style="margin-right:390px">
      <div id="progressText" class="fs-lead mono" aria-live="polite"></div>
      <div id="lamps" class="progress-lamps" aria-hidden="true"></div>
    </div>
    <div class="orbital" id="orbit"></div><div class="world earth"></div><div class="world moon"></div>
    <span class="orbit-label" style="right:292px;top:108px">地球 · 出发</span><span class="orbit-label" style="right:26px;top:64px">月球 · 目标</span>
    <span id="signalOne" class="orbit-label mono" style="right:178px;top:26px"></span><span id="signalRound" class="orbit-label mono" style="right:128px;top:104px"></span>
  </header>
  <section class="process-band px-4 py-2" style="height:92px" aria-label="任务预算回算流程">
    <div class="k-process h-full">
      <div class="axis"></div><div class="step">选择方案</div><div class="arw"></div><div class="step">分配质量</div><div class="arw"></div><div class="step">校验速度增量</div><div class="arw"></div><div class="step">校验时间与保障</div><div class="arw"></div><div class="step">接受通信约束</div><div class="arw"></div><div class="step is-current">五账同时通过<br><span class="fs-label primary">变更后回流重算 ↺</span></div>
    </div>
  </section>

  <main class="row gap-4 pad-4 min0" style="flex:1">
    <section class="panel-flat controls col min0 pad-3" aria-labelledby="configTitle">
      <h2 id="configTitle">任务配置</h2>
      <div class="fs-sec muted">调整一处，沿回算线查看哪些账目被牵动。</div>
      <div class="ctl"><label for="payload">有效载荷</label><input id="payload" type="range"><output id="payloadV" class="control-value"></output></div>
      <div class="ctl"><label for="crew">乘员</label><input id="crew" type="range"><output id="crewV" class="control-value"></output></div>
      <div class="ctl"><label for="duration">任务时长</label><select id="duration" aria-label="任务时长"></select></div>
      <div class="ctl"><label for="propellant">推进剂</label><input id="propellant" type="range"><output id="propellantV" class="control-value"></output></div>
      <div class="ctl"><label for="autonomy">通信自主度</label><select id="autonomy" aria-label="通信自主度"></select></div>
      <div class="note" style="margin-top:16px">增加载荷、乘员或停留时间，会把压力传到不止一本账上。</div>
      <div class="row between items-center" style="margin-top:auto">
        <span class="hand-scale">航天手套尺度</span><button id="reset" type="button">一键重置</button>
      </div>
    </section>

    <section class="panel ledger min0 grow" aria-labelledby="ledgerTitle">
      <div class="row between items-center px-3" style="height:54px"><h2 id="ledgerTitle">工程总账</h2><span class="chip">需求 / 可用 / 状态</span></div>
      <div class="ledger-head"><span>账目与影响</span><span>需求</span><span>可用</span><span>检查</span></div>
      <div id="rows"></div><div class="flowback" aria-hidden="true"></div>
    </section>
  </main>

  <footer class="panel-flat row between items-center gap-4 px-4" style="height:112px;flex:0 0 auto;margin:0 24px 16px">
    <div class="col grow gap-2 min0">
      <div class="row gap-2" aria-label="配置联动关系"><span class="chip">载荷 → 质量 / 速度</span><span class="chip">乘员 → 质量 / 保障</span><span class="chip">时长 → 保障</span><span class="chip">推进剂 → 速度 / 质量</span><span class="chip">自主度 → 通信</span></div>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </div>
    <div id="approval" class="approval" role="status">等待五账闭合</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  'use strict';
  Deck.init({index:39,total:48});
  const K=Lec.K, P=Lec.P, M=K.math, profile=K.missions.apollo11, rocket=K.rocket;
  const checks=['deltaV','mass','time','communication','lifeSupport'];
  const labels={deltaV:['速度增量','推进剂、载荷'],mass:['质量','载荷、乘员与保障'],time:['时间','全部任务阶段'],communication:['通信','关键操作响应'],lifeSupport:['生命保障','乘员日与冗余']};
  const tips={deltaV:'速度增量不足：增加推进剂也会推高总质量。',mass:'质量超限：减少载荷；增加推进剂会继续挤压质量。',time:'时间未闭合：计划时长没有覆盖全部任务阶段。',communication:'通信未闭合：月球往返延迟不允许实时遥控关键操作。',lifeSupport:'生命保障不足：储备须覆盖任务并留出冗余。'};
  const els=Object.fromEntries(['payload','crew','duration','propellant','autonomy','payloadV','crewV','propellantV','rows','progressText','lamps','feedback','approval','orbit','reset','signalOne','signalRound'].map(id=>[id,document.getElementById(id)]));
  const day=K.units.secondPerMinute*K.units.minutePerHour*K.units.hourPerDay;
  const baseDays=profile.missionDurationSeconds/day;
  const massLimit=M.hundred;
  const dryBase=M.ten*M.two;
  const crewMass=M.five;
  const supportPerCrewDay=M.half;
  const dvNeed=rocket.representativeMoonSurfaceEscapeDeltaV;
  function option(select,value,text){const o=document.createElement('option');o.value=value;o.textContent=text;select.append(o)}
  function setup(){
    Object.assign(els.payload,{min:M.ten,max:M.five*M.six,step:M.five});
    Object.assign(els.crew,{min:M.one,max:profile.crew,step:M.one});
    Object.assign(els.propellant,{min:M.ten*M.two,max:M.ten*M.six,step:M.five});
    option(els.duration,'short','短');option(els.duration,'standard','标准');option(els.duration,'extended','延长');
    option(els.autonomy,'low','低');option(els.autonomy,'medium','中');option(els.autonomy,'high','高');
    els.lamps.innerHTML=checks.map(()=>'<i class="lamp"></i>').join('');
  }
  function initial(){return {payload:M.five*M.five,crew:profile.crew,duration:'extended',propellant:M.ten*M.three,autonomy:'low'}}
  let state=initial(), previous={};
  function syncControls(){for(const k of ['payload','crew','duration','propellant','autonomy'])els[k].value=state[k]}
  function calculate(){
    const durationFactor=state.duration==='short'?M.half:state.duration==='standard'?M.one:M.one+M.half;
    const planned=profile.missionDurationSeconds*durationFactor;
    const required=profile.missionDurationSeconds;
    const lifeNeed=state.crew*(planned/day+M.one);
    const lifeHave=state.crew*(baseDays+M.two);
    const finalMass=dryBase+state.payload+state.crew*crewMass+lifeHave*supportPerCrewDay;
    const total=finalMass+state.propellant;
    const availableDv=P.rocketDeltaV(rocket.representativeChemicalExhaustVelocity,total,finalMass);
    const signal=P.moonSignalDelay(), round=P.moonRoundTripSignalDelay();
    const result={
      deltaV:{used:dvNeed,limit:availableDv,need:(dvNeed/M.thousand).toFixed(M.one)+' km/s',have:(availableDv/M.thousand).toFixed(M.one)+' km/s'},
      mass:{used:total,limit:massLimit,need:total.toFixed(M.one)+' 相对单位',have:massLimit+' 上限'},
      time:{used:required,limit:planned,need:P.formatDuration(required),have:P.formatDuration(planned)},
      communication:{used:state.autonomy==='high'?M.zero:state.autonomy==='medium'?signal:round,limit:signal,need:'往返 '+round.toFixed(M.one)+' s',have:state.autonomy==='high'?'自主执行':state.autonomy==='medium'?'单程容忍':'依赖实时'},
      lifeSupport:{used:lifeNeed,limit:lifeHave,need:lifeNeed.toFixed(M.one)+' 乘员日',have:lifeHave.toFixed(M.one)+' 乘员日'}
    };
    return result;
  }
  function render(action){
    const r=calculate();const passed=checks.filter(k=>r[k].used<=r[k].limit);const pass=checks.every(k=>r[k].used<=r[k].limit);
    els.payloadV.textContent=state.payload+' 单位';els.crewV.textContent=state.crew+' 人';els.propellantV.textContent=state.propellant+' 单位';
    els.rows.innerHTML=checks.map(k=>{const ok=r[k].used<=r[k].limit;const changed=action&&previous[k]!==ok&&!ok;return `<div class="ledger-row enter ${ok?'pass':'fail'} ${changed?'shake':''}"><div><div class="ledger-name">${labels[k][0]}</div><div class="ledger-sub">${labels[k][1]}</div></div><div class="metric">${r[k].need}</div><div class="metric">${r[k].have}</div><div class="status">${ok?'已闭合':'未闭合'}</div></div>`}).join('');
    els.progressText.textContent='预算闭合 '+passed.length+' / '+checks.length+' · '+P.progressPercent(passed.length,checks.length).toFixed(M.zero)+'%';
    [...els.lamps.children].forEach((x,i)=>x.classList.toggle('on',i<passed.length));
    els.feedback.textContent=pass?'五项工程约束同时成立。任务方案可以批准。':tips[checks.find(k=>r[k].used>r[k].limit)];
    els.approval.textContent=pass?'任务批准':'等待五账闭合';els.approval.classList.toggle('ready',pass);els.orbit.style.opacity=pass?'1':'.35';
    previous=Object.fromEntries(checks.map(k=>[k,r[k].used<=r[k].limit]));
  }
  setup();els.signalOne.textContent='单程 '+P.moonSignalDelay().toFixed(M.one)+' s';els.signalRound.textContent='往返 '+P.moonRoundTripSignalDelay().toFixed(M.one)+' s';syncControls();render();
  ['payload','crew','duration','propellant','autonomy'].forEach(k=>els[k].addEventListener('input',()=>{state[k]=els[k].type==='range'?Number(els[k].value):els[k].value;render(k)}));
  els.reset.addEventListener('click',()=>{state=initial();previous={};syncControls();render('reset')});
})();
</script>
</body>
</html>
