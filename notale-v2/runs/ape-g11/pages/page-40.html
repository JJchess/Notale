<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:46px 64px 38px;background:#07111F;}
  .eyebrow{color:var(--primary-bright);font:650 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.16em;}
  .hero-title{max-width:1040px;font-size:52px;line-height:1.18;letter-spacing:-.025em;}
  .plate{position:relative;isolation:isolate;overflow:hidden;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);}
  .plate svg{position:absolute;inset:0;width:100%;height:100%;}
  .plate>.supports{position:absolute!important;inset:0;width:100%;height:100%;display:block!important;padding:0!important;box-sizing:border-box;}
  .plate>.supports::before{display:none;}
  .grid-line{fill:none;stroke:rgba(232,241,247,.14);stroke-width:1;}
  .constraint{fill:none;stroke:var(--primary);stroke-width:2;vector-effect:non-scaling-stroke;}
  .constraint.soft{stroke:rgba(53,194,178,.42);stroke-width:1;stroke-dasharray:7 9;}
  .route{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(255,181,71,.62));}
  .route-core{fill:none;stroke:#fff3d9;stroke-width:2;stroke-linecap:round;}
  .horizon-line{fill:rgba(53,194,178,.035);stroke:var(--primary);stroke-width:2;}
  .node{fill:var(--accent);filter:drop-shadow(0 0 7px rgba(255,181,71,.85));}
  .tag{position:absolute;width:270px;padding:12px 14px;border:1px solid var(--line);background:rgba(9,24,39,.92);box-shadow:none;}
  .tag::before{content:"";position:absolute;top:21px;width:40px;height:0;border-top:1px solid var(--primary);background:none;transform:none;}
  .k-generalization .tag::before{transform:none;}
  .tag.left::before{left:100%;}.tag.right::before{right:100%;left:auto;}
  .tag b{display:block;color:var(--primary-bright);font-size:var(--fs-label);letter-spacing:.08em;}
  .tag strong{display:block;margin-top:2px;color:var(--text);font-size:var(--fs-body);line-height:1.35;}
  .tag span{display:block;margin-top:2px;color:var(--muted);font-size:var(--fs-sec);line-height:1.4;}
  .t1{left:22px;top:40px}.t2{right:18px;top:50px}.t3{left:74px;bottom:48px}.t4{right:100px;bottom:42px;width:250px}.t4::before{display:none}
  .channel-label{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);padding:8px 18px;border:1px solid var(--accent);background:rgba(7,17,31,.9);color:var(--accent);font:750 var(--fs-h2)/1.25 var(--font-sans);letter-spacing:.08em;box-shadow:0 0 28px rgba(255,181,71,.18);}
  .channel-sub{position:absolute;left:50%;top:53%;transform:translateX(-50%);color:var(--muted);font-size:var(--fs-label);letter-spacing:.08em;}
  .plate-mark{position:absolute;color:var(--faint);font:var(--fs-label)/1.4 var(--font-mono);letter-spacing:.1em;}
  .claim{max-width:1180px!important;margin:0 auto;border-left-color:var(--accent)!important;background:linear-gradient(90deg,var(--accent-soft),transparent 64%),var(--panel-deep)!important;font-size:20px!important;line-height:1.5!important;text-align:center;}
  .claim strong{color:var(--accent);}
  .grid-group,.constraint-group,.route-group{transform-origin:center;}
  @keyframes gridIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes squeezeIn{from{opacity:0;transform:scaleY(1.28)}to{opacity:1;transform:scaleY(1)}}
  @keyframes drawRoute{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
  @keyframes tagIn{from{opacity:0}to{opacity:1}}
  .grid-group{animation:gridIn 420ms ease-out both}.constraint-group{animation:squeezeIn 430ms 330ms ease-out both}
  .route,.route-core{stroke-dasharray:1400;animation:drawRoute 440ms 760ms ease-out both}
  .tag,.channel-label,.channel-sub{animation:tagIn 260ms 900ms ease-out both}
  @media (prefers-reduced-motion:reduce){.grid-group,.constraint-group,.route,.route-core,.tag,.channel-label,.channel-sub{animation:none!important}.route,.route-core{stroke-dasharray:none}}
</style>
</head>
<body data-page="40" data-total="48">
<div id="stage">
  <header class="col gap-2" style="height:126px">
    <div class="eyebrow">ENGINEERING ENVELOPE · 第四幕结论</div>
    <h1 class="hero-title">火箭只在定律允许的通道中飞行</h1>
  </header>

  <main class="plate min0 k-generalization" style="flex:1" aria-label="四类约束共同收束出可行飞行通道">
    <div class="plate-mark" style="left:0;top:8px">约束边界 / INWARD</div>
    <div class="plate-mark" style="right:0;bottom:8px">共同可行域 / OPEN</div>
    <svg viewBox="0 0 1472 570" role="img" aria-label="轨道、推进、结构、人体与任务四类约束，从上下两侧共同压出中央狭窄的橙色可行通道">
      <g class="grid-group">
        <path class="grid-line" d="M736 72L52 530M736 72L220 530M736 72L390 530M736 72L560 530M736 72L736 530M736 72L912 530M736 72L1082 530M736 72L1252 530M736 72L1420 530"/>
        <path class="grid-line" d="M652 128H820M555 193H917M444 267H1028M318 351H1154M174 447H1298M28 530H1444"/>
      </g>
      <g class="constraint-group">
        <path class="constraint soft" d="M0 60 Q420 168 735 245 T1472 300"/>
        <path class="constraint" d="M0 98 Q420 194 735 258 T1472 316"/>
        <path class="constraint soft" d="M0 494 Q420 390 735 326 T1472 264"/>
        <path class="constraint" d="M0 464 Q420 372 735 313 T1472 250"/>
        <path class="constraint soft" d="M0 172 Q420 228 735 269 T1472 327"/>
        <path class="constraint" d="M0 205 Q420 244 735 278 T1472 336"/>
        <path class="constraint soft" d="M0 402 Q420 354 735 303 T1472 238"/>
        <path class="constraint" d="M0 373 Q420 338 735 294 T1472 226"/>
      </g>
      <g class="route-group">
        <path class="route" d="M30 390 C350 346 532 327 735 286 C965 241 1190 233 1440 151"/>
        <path class="route-core" d="M30 390 C350 346 532 327 735 286 C965 241 1190 233 1440 151"/>
        <circle class="node" cx="95" cy="380" r="5"/><circle class="node" cx="305" cy="352" r="5"/><circle class="node" cx="530" cy="327" r="5"/><circle class="node" cx="760" cy="281" r="5"/><circle class="node" cx="1000" cy="247" r="5"/><circle class="node" cx="1230" cy="222" r="5"/><circle class="node" cx="1420" cy="158" r="5"/>
      </g>
      <path class="horizon-line" d="M-60 590 Q736 390 1532 590 L1532 650 L-60 650Z"/>
    </svg>

    <div class="supports" style="--support-cols:4;display:contents">
      <div class="support tag left t1"><b>轨道约束</b><strong>足够的横向速度</strong><span>高度不等于入轨</span></div>
      <div class="support tag right t2"><b>推进约束</b><strong>速度增量受质量比约束</strong><span>推进剂也必须被加速</span></div>
      <div class="support tag left t3"><b>结构约束</b><strong>分级抛弃无用质量</strong><span>每一千克都占预算</span></div>
      <div class="support tag right t4" style="left:1080px;right:auto;width:270px"><b>人体与任务</b><strong>风险与生命保障必须闭合</strong><span>能飞不等于能完成任务</span></div>
    </div>
    <div class="channel-label">可行飞行</div>
    <div class="channel-sub">四类条件共同留下的窄通道</div>
  </main>

  <footer class="k-generalization center" style="height:150px">
    <div class="claim is-current"><strong>火箭没有战胜重力、惯性或质量惩罚。</strong><br>它只是把轨道、推进、结构与人体条件同时压进一个很窄的可行区间。</div>
  </footer>
</div>
<script src="assets/base.js"></script>

</body>
</html>
