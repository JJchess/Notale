<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page-head{padding:28px 42px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:36px}
  .kicker{color:var(--primary-bright);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em;margin-bottom:6px}
  .take{margin-top:8px;color:var(--muted);font-size:var(--fs-lead);line-height:var(--lh-text)}
  .progress{min-width:250px;text-align:right;padding-top:8px;color:var(--muted);font-size:var(--fs-label)}
  .progress strong{display:block;color:var(--primary-bright);font:720 var(--fs-h2)/1.25 var(--font-mono)}
  .main{padding:0 42px 28px;gap:18px}
  .network-shell{position:relative;flex:1;min-width:0;min-height:0;border:2px solid var(--line);border-radius:var(--r-lg);background:linear-gradient(135deg,rgba(53,194,178,.05),transparent 45%),var(--panel-deep);overflow:hidden}
  #net{display:block;width:100%;height:100%}
  .side{width:354px;flex:0 0 354px;gap:14px}
  .class-key{padding:14px 16px!important}
  .class-key .bt{font-size:var(--fs-sec)!important;min-height:28px!important;margin:-14px -16px 10px!important;padding:6px 14px!important}
  .role-list{display:flex;flex-wrap:wrap;gap:6px}
  .role-list span{font-size:var(--fs-label);color:var(--muted);padding:3px 8px;border:1px solid var(--line-soft);border-radius:999px}
  .detail{padding:18px;min-height:176px}
  .detail h2{color:var(--accent);margin-bottom:8px}
  .detail p{margin:5px 0;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-text)}
  .detail b{color:var(--text)}
  .actions{display:flex;gap:10px}
  .actions button{flex:1}
  .hint{height:28px;color:var(--muted);font-size:var(--fs-sec);line-height:28px}
  .hint.shake{animation:shake .24s ease-out}
  .legend{padding:0 4px}
  .legend-key.danger{background:var(--danger)}
  svg text{font-family:var(--font-sans);pointer-events:none}
  .group-box{fill:rgba(53,194,178,.035);stroke:rgba(53,194,178,.28);stroke-width:2}
  .group-title{fill:var(--primary-bright);font-size:16px;font-weight:700}
  .link{stroke:var(--primary);stroke-width:2;fill:none;opacity:.58;transition:opacity .2s,stroke .2s}
  .link.dim,.node.dim{opacity:.18}
  .link.related{opacity:1;stroke:var(--accent)}
  .link.failed{opacity:1;stroke:var(--danger);stroke-dasharray:8 7}
  .node{cursor:pointer;transition:opacity .2s}
  .node circle.core{fill:var(--panel);stroke:var(--primary);stroke-width:3}
  .node circle.seen{fill:none;stroke:var(--primary-bright);stroke-width:2;stroke-dasharray:4 4}
  .node text{fill:var(--text);font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:central}
  .node.selected circle.core{stroke:var(--accent);fill:var(--accent-soft)}
  .node.failed circle.core{stroke:var(--danger);fill:rgba(255,120,111,.15)}
  .node:focus{outline:none}.node:focus circle.core{stroke:var(--focus);stroke-width:5}
  .pulse{animation:pulse .42s ease-out}
  @keyframes pulse{50%{transform:scale(1.13)}}
  @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  @media(prefers-reduced-motion:reduce){.pulse,.hint.shake{animation:none}.link,.node{transition:none}}
</style>
</head>
<body data-page="41" data-total="48">
<div id="stage">
  <header class="page-head" style="height:112px">
    <div>
      <div class="kicker">SYSTEMS / 社会技术系统</div>
      <h1>一个航天员背后，有多少人？</h1>
      <div class="take">航天能力属于相互依赖的社会技术系统。</div>
    </div>
    <div class="progress" aria-live="polite">探索进度<strong id="progress">已查看 0 / 7 类系统角色</strong></div>
  </header>
  <main class="main row min0" style="flex:1">
    <section class="network-shell science-grid min0 no-pan" aria-label="航天系统角色依赖网络">
      <svg id="net" role="group" aria-label="箭头由支持者指向被支持者。选择角色可查看依赖路径。"></svg>
      <div id="hint" class="hint absolute" style="left:18px;bottom:12px">选择一个角色节点，查看它托住了谁。</div>
    </section>
    <aside class="side col min0">
      <div class="k-classification" aria-label="角色分类">
        <div class="lv"><div class="box class-key"><div class="bt">直接保障任务</div><div class="role-list"><span>制造</span><span>软件</span><span>医学</span></div></div></div>
        <div class="lv"><div class="box class-key"><div class="bt">提供环境与连接</div><div class="role-list"><span>气象</span><span>通信</span></div></div></div>
        <div class="lv"><div class="box class-key"><div class="bt">设定边界与授权</div><div class="role-list"><span>政策</span><span>公众</span></div></div></div>
      </div>
      <section class="panel detail" aria-live="polite">
        <h2 id="detailTitle">选择一个角色</h2>
        <p id="supportText">点选网络中的节点，查看它依赖哪些角色，又会影响谁。</p>
        <p id="effectText">箭头指向被支持者；分类表示职责范围，不表示彼此独立。</p>
      </section>
      <div class="actions"><button id="fail" disabled>模拟失效</button><button id="reset">重置网络</button></div>
      <div class="legend"><span><i class="legend-key"></i>正常依赖</span><span><i class="legend-key is-current"></i>当前路径</span><span><i class="legend-key danger"></i>失效传播</span></div>
      <p class="note" style="margin:0">一名航天员不是孤立英雄，而是大型社会技术系统的可见端点。一个环节失效，影响可能沿连接传播。</p>
    </aside>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
Deck.init({index:41,total:48});
const nodes=[
 {id:'astronaut',name:'航天员',cat:'core',support:'执行任务、报告状态',effect:'任务操作与现场判断'},
 {id:'manufacture',name:'制造',cat:'direct',support:'提供飞船与部件',effect:'硬件可靠性'},
 {id:'software',name:'软件',cat:'direct',support:'提供控制、导航与监测',effect:'指令与状态判断'},
 {id:'medicine',name:'医学',cat:'direct',support:'提供健康评估与处置',effect:'人员安全决策'},
 {id:'weather',name:'气象',cat:'connect',support:'判断发射与着陆环境',effect:'窗口是否可用'},
 {id:'communication',name:'通信',cat:'connect',support:'维持飞船与地面信息链',effect:'指令与遥测'},
 {id:'policy',name:'政策',cat:'boundary',support:'提供规则、授权与协调',effect:'任务能否按规则推进'},
 {id:'public',name:'公众',cat:'boundary',support:'提供合法性、监督与持续支持',effect:'系统的社会基础'}
];
const links=[
 {source:'manufacture',target:'astronaut'},{source:'software',target:'astronaut'},{source:'medicine',target:'astronaut'},
 {source:'weather',target:'astronaut'},{source:'communication',target:'astronaut'},{source:'software',target:'communication'},
 {source:'manufacture',target:'software'},{source:'policy',target:'manufacture'},{source:'policy',target:'software'},
 {source:'policy',target:'medicine'},{source:'policy',target:'weather'},{source:'policy',target:'communication'},
 {source:'public',target:'policy'}
];
const svg=d3.select('#net'), W=1120,H=690;
svg.attr('viewBox',`0 0 ${W} ${H}`);
const defs=svg.append('defs');
defs.append('marker').attr('id','arrow').attr('viewBox','0 -5 10 10').attr('refX',9).attr('refY',0).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto').append('path').attr('d','M0,-5L10,0L0,5').attr('fill','var(--primary)');
defs.append('marker').attr('id','arrow-hot').attr('viewBox','0 -5 10 10').attr('refX',9).attr('refY',0).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto').append('path').attr('d','M0,-5L10,0L0,5').attr('fill','var(--accent)');
defs.append('marker').attr('id','arrow-bad').attr('viewBox','0 -5 10 10').attr('refX',9).attr('refY',0).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto').append('path').attr('d','M0,-5L10,0L0,5').attr('fill','var(--danger)');
const bands=[{cat:'boundary',label:'设定边界与授权',x:22,w:260},{cat:'connect',label:'提供环境与连接',x:300,w:300},{cat:'direct',label:'直接保障任务',x:618,w:310}];
const bg=svg.append('g');
bg.selectAll('rect').data(bands).join('rect').attr('class','group-box').attr('x',d=>d.x).attr('y',62).attr('width',d=>d.w).attr('height',570).attr('rx',18);
bg.selectAll('text').data(bands).join('text').attr('class','group-title').attr('x',d=>d.x+18).attr('y',92).text(d=>d.label);
bg.append('circle').attr('cx',1040).attr('cy',345).attr('r',66).attr('fill','rgba(255,181,71,.035)').attr('stroke','rgba(255,181,71,.3)').attr('stroke-width',2);
bg.append('text').attr('class','group-title').attr('x',1000).attr('y',257).text('任务核心');
const linkG=svg.append('g');
const link=linkG.selectAll('line').data(links).join('line').attr('class','link').attr('marker-end','url(#arrow)');
const node=svg.append('g').selectAll('g').data(nodes).join('g').attr('class','node').attr('tabindex',0).attr('role','button').attr('aria-label',d=>`${d.name}：${d.support}`).on('click',(e,d)=>{e.stopPropagation();selectNode(d);}).on('keydown',(e,d)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectNode(d);}});
node.append('circle').attr('class','seen').attr('r',d=>d.id==='astronaut'?49:37).style('opacity',0);
node.append('circle').attr('class','core').attr('r',d=>d.id==='astronaut'?42:30);
node.append('text').text(d=>d.name);
const xTarget={boundary:150,connect:450,direct:770,core:1040};
const simulation=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(d=>d.id).distance(108).strength(0.7)).force('charge',d3.forceManyBody().strength(-420)).force('center',d3.forceCenter(W/2,H/2)).force('collide',d3.forceCollide(42)).force('x',d3.forceX(d=>xTarget[d.cat]).strength(.85)).force('y',d3.forceY(H/2).strength(.08));
simulation.on('tick',()=>{
 nodes.forEach(d=>{const r=d.id==='astronaut'?48:36; const band=d.cat==='core'?{x:970,w:138}:bands.find(b=>b.cat===d.cat);d.x=Math.max(band.x+r,Math.min(band.x+band.w-r,d.x));d.y=Math.max(125,Math.min(590,d.y));});
 link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
 node.attr('transform',d=>`translate(${d.x},${d.y})`);
});
const seen=new Set();let selected=null;let failing=false;
const incoming=id=>links.filter(l=>(l.target.id||l.target)===id).map(l=>l.source.id||l.source);
const outgoing=id=>links.filter(l=>(l.source.id||l.source)===id).map(l=>l.target.id||l.target);
function closure(start,dir){const got=new Set([start]),q=[start];while(q.length){(dir==='up'?incoming(q.shift()):outgoing(q.shift())).forEach(id=>{if(!got.has(id)){got.add(id);q.push(id);}});}return got;}
function selectNode(d){failing=false;selected=d; if(d.id!=='astronaut')seen.add(d.id);const related=new Set([...closure(d.id,'up'),...closure(d.id,'down')]);
 node.classed('dim',n=>!related.has(n.id)).classed('selected',n=>n.id===d.id).classed('failed',false);node.filter(n=>n.id===d.id).classed('pulse',false);requestAnimationFrame(()=>node.filter(n=>n.id===d.id).classed('pulse',!Deck.reduced()));
 node.select('.seen').style('opacity',n=>seen.has(n.id)?1:0);
 link.classed('dim',l=>!related.has(l.source.id)||!related.has(l.target.id)).classed('related',l=>related.has(l.source.id)&&related.has(l.target.id)).classed('failed',false).attr('marker-end',l=>related.has(l.source.id)&&related.has(l.target.id)?'url(#arrow-hot)':'url(#arrow)');
 document.querySelector('#detailTitle').textContent=d.name;document.querySelector('#supportText').innerHTML=`<b>直接支持：</b>${d.support}`;document.querySelector('#effectText').innerHTML=`<b>若失效，首先影响：</b>${d.effect}`;document.querySelector('#fail').disabled=false;updateProgress();
}
function updateProgress(){document.querySelector('#progress').textContent=`已查看 ${seen.size} / ${nodes.length-1} 类系统角色`;if(seen.size===nodes.length-1){document.querySelector('#hint').textContent='没有单一节点能独自完成任务。';node.classed('dim',false);link.classed('dim',false);}}
function failSelected(){if(!selected)return;failing=true;const affected=closure(selected.id,'down');const levels=new Map([[selected.id,0]]),q=[selected.id];while(q.length){const id=q.shift(),lv=levels.get(id);outgoing(id).forEach(n=>{if(!levels.has(n)){levels.set(n,lv+1);q.push(n);}});}node.classed('dim',n=>!affected.has(n.id)).classed('selected',false);link.classed('related',false).classed('dim',l=>!affected.has(l.source.id)||!affected.has(l.target.id));levels.forEach((lv,id)=>setTimeout(()=>{if(!failing)return;node.filter(n=>n.id===id).classed('failed',true);link.filter(l=>l.source.id===id&&affected.has(l.target.id)).classed('failed',true).attr('marker-end','url(#arrow-bad)');},Deck.reduced()?0:lv*180));document.querySelector('#effectText').innerHTML=`<b>传播结果：</b>${selected.name}首先影响“${selected.effect}”，并可能继续传到它所支持的环节。`}
function reset(){failing=false;selected=null;seen.clear();node.classed('dim selected failed pulse',false).select('.seen').style('opacity',0);link.classed('dim related failed',false).attr('marker-end','url(#arrow)');document.querySelector('#detailTitle').textContent='选择一个角色';document.querySelector('#supportText').textContent='点选网络中的节点，查看它依赖哪些角色，又会影响谁。';document.querySelector('#effectText').textContent='箭头指向被支持者；分类表示职责范围，不表示彼此独立。';document.querySelector('#fail').disabled=true;document.querySelector('#hint').textContent='选择一个角色节点，查看它托住了谁。';updateProgress();}
document.querySelector('#fail').addEventListener('click',failSelected);document.querySelector('#reset').addEventListener('click',reset);svg.on('click',()=>{const h=document.querySelector('#hint');h.textContent='请选择一个角色节点，查看它托住了谁。';h.classList.remove('shake');requestAnimationFrame(()=>h.classList.add('shake'));});
if(Deck.reduced()){simulation.stop();for(let i=0;i<300;i++)simulation.tick();simulation.on('tick')();}
</script>
</body>
</html>
