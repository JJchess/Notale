<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:20px 42px 14px;gap:10px}
  .eyebrow{color:var(--primary-bright);font:650 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em}
  .take{margin:4px 0 0;color:var(--muted);font-size:var(--fs-lead);line-height:var(--lh-text)}
  .board{position:relative;width:1000px;height:622px;overflow:hidden;border:2px solid var(--line);border-radius:var(--r-lg);background:radial-gradient(circle at 50% 47%,rgba(53,194,178,.11),transparent 31%),var(--panel-deep);box-shadow:var(--shadow)}
  #konva{position:absolute;left:20px;top:10px;width:960px;height:600px}
  .earth-arc{position:absolute;left:60px;right:60px;bottom:0;height:148px;border:3px solid var(--primary);border-bottom:0;border-radius:50% 50% 0 0;background:linear-gradient(180deg,rgba(53,194,178,.08),rgba(53,194,178,.015));pointer-events:none}
  .goal-label{position:absolute;width:138px;height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translate(-50%,-50%);pointer-events:none;text-align:center;font-size:var(--fs-label);font-weight:760;line-height:1.25;color:var(--text)}
  .goal-label small{display:block;color:var(--muted);font-size:14px;font-weight:520;white-space:nowrap}
  .slot-label{position:absolute;transform:translate(-50%,-50%);pointer-events:none;color:var(--faint);font:700 var(--fs-tick)/1 var(--font-mono)}
  .center-copy{position:absolute;left:500px;top:325px;width:230px;transform:translate(-50%,-50%);pointer-events:none;text-align:center}
  .center-copy strong{display:block;font-size:var(--fs-h2);line-height:1.25}
  .center-copy span{display:block;margin-top:8px;color:var(--primary-bright);font-size:var(--fs-label)}
  .side{width:448px;height:622px;box-shadow:none}
  .selected-q{min-height:102px;padding:18px;border-left:5px solid var(--accent);background:var(--panel-soft)}
  .selected-q b{display:block;margin-bottom:6px;color:var(--accent);font-size:var(--fs-h2)}
  .selected-q p{margin:0;font-size:var(--fs-body);line-height:var(--lh-text)}
  .conflicts{min-height:184px}
  .conflict{padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:var(--fs-sec);line-height:var(--lh-text)}
  .conflict b{color:var(--accent)}
  .status{min-height:46px;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-text)}
  .comparison-strip{--compare-cols:170px repeat(6,minmax(0,1fr));box-shadow:none}
  .comparison-strip .hdr,.comparison-strip .dim,.comparison-strip .cell{padding:8px 10px}
  .comparison-strip .cell{text-align:center}
  .comparison-strip .diff{font-weight:700}
  button:focus-visible,#konva:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
  .board.intro{animation:rise .65s cubic-bezier(.2,.75,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.board.intro{animation:none}*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body data-page="42" data-total="48">
<div id="stage">
  <header class="row between items-end" style="height:82px">
    <div>
      <div class="eyebrow">WHOSE SPACE · GOALS</div>
      <h1>六种目的，六把尺</h1>
    </div>
    <p class="take">先给出你的优先序，再看目标之间会出现哪些价值张力。</p>
  </header>

  <main class="row gap-4 min0" style="flex:1">
    <section class="board intro no-pan min0" aria-label="航天目标径向排序盘">
      <div id="konva" tabindex="0" role="application" aria-label="目标排序盘。左右方向键选择目标，数字一到六把目标放入对应排序位。"></div>
      <div class="earth-arc"></div>
      <div id="labels"></div>
      <div class="center-copy"><strong>航天为了什么？</strong><span id="progress">已排 0 / 6</span></div>
    </section>

    <aside class="panel side col gap-3 pad-3 min0">
      <div>
        <div class="eyebrow">当前这把尺</div>
        <div class="selected-q" id="question" aria-live="polite"><b>探索</b><p>新奇与突破有多重要？</p></div>
      </div>
      <div class="conflicts">
        <h2>价值张力</h2>
        <div id="conflictList" class="status">六项目标就位后，可查看相邻高优先目标与首尾目标之间的张力。</div>
      </div>
      <div class="status" id="status" aria-live="polite">拖动目标牌到外圈排序槽。每个位置只能放一个目标。</div>
      <div class="row gap-2" style="margin-top:auto">
        <button id="reveal" class="is-target grow" disabled>查看冲突</button>
        <button id="reset" class="grow">重置排序</button>
      </div>
      <div class="note">这些目标都可能合理，但它们回答的是不同问题。不存在脱离价值选择的唯一总分。</div>
    </aside>
  </main>

  <section class="k-comparison comparison-strip" style="height:82px" aria-label="六种目标使用的不同判断尺度">
    <div class="crow"><div class="hdr">比较维度</div><div class="hdr">探索</div><div class="hdr">科学</div><div class="hdr">国家竞争</div><div class="hdr">商业</div><div class="hdr">地球服务</div><div class="hdr">生存备份</div></div>
    <div class="crow"><div class="dim">优先追问</div><div class="cell">新奇突破</div><div class="cell">可检验知识</div><div class="cell">领先影响</div><div class="cell">投资获利</div><div class="cell">地面作用</div><div class="cell diff">独立备份</div></div>
  </section>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/konva.min.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:42,total:48});
  var goals=[
    {name:'探索',short:'去尚未抵达之处',q:'新奇与突破有多重要？',t:'近期可验证收益'},
    {name:'科学',short:'获得可检验知识',q:'能回答什么问题？',t:'国家声望'},
    {name:'国家竞争',short:'展示能力与影响力',q:'谁取得领先？',t:'开放共享'},
    {name:'商业',short:'创造产品与市场',q:'谁投资、谁获利？',t:'公共可及性'},
    {name:'地球服务',short:'改善地面生活',q:'对通信、导航与观测有何作用？',t:'深空探索'},
    {name:'生存备份',short:'降低文明单点风险',q:'能否形成真正独立的备份？',t:'当代迫切需求'}
  ];
  var W=960,H=600,cx=480,cy=315,sourceR=205,slotR=272;
  var stage=new Konva.Stage({container:'konva',width:W,height:H});
  var base=new Konva.Layer(), links=new Konva.Layer(), cards=new Konva.Layer();
  stage.add(base);stage.add(links);stage.add(cards);
  var labels=document.getElementById('labels'),positions=[],slotOwners=[null,null,null,null,null,null],nodes=[],selected=0,revealed=false;
  function polar(r,i){var a=(-Math.PI/2)+(Math.PI*2*i/goals.length);return{x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r};}
  function labelPos(el,p){el.style.left=(p.x+20)+'px';el.style.top=(p.y+10)+'px';}
  goals.forEach(function(g,i){
    var s=polar(slotR,i),p=polar(sourceR,i);positions.push(s);
    base.add(new Konva.Line({points:[cx,cy,p.x,p.y],stroke:Deck.rgba('--primary',.42),strokeWidth:2,dash:[7,8]}));
    base.add(new Konva.Rect({x:s.x-74,y:s.y-38,width:148,height:76,cornerRadius:8,stroke:Deck.rgba('--primary',.48),strokeWidth:2,dash:[8,6]}));
    var sl=document.createElement('div');sl.className='slot-label';sl.textContent=String(i+1);var sp=polar(slotR+24,i);sp.y=Math.max(14,Math.min(586,sp.y));labelPos(sl,sp);labels.appendChild(sl);
    var group=new Konva.Group({x:p.x,y:p.y,draggable:true});
    var rect=new Konva.Rect({x:-69,y:-34,width:138,height:68,cornerRadius:8,fill:Deck.rgba('--panel-soft',.98),stroke:Deck.token('--primary'),strokeWidth:2,shadowColor:'#000',shadowBlur:12,shadowOpacity:.32});
    group.add(rect);cards.add(group);
    var lab=document.createElement('div');lab.className='goal-label';lab.innerHTML='<span>'+g.name+'</span><small>'+g.short+'</small>';labelPos(lab,p);labels.appendChild(lab);
    group.on('dragstart',function(){selected=i;rect.stroke(Deck.token('--accent'));showQuestion();links.destroyChildren();revealed=false;document.getElementById('conflictList').textContent='排序改变后，请重新查看价值张力。';});
    group.on('dragmove',function(){labelPos(lab,{x:group.x(),y:group.y()});});
    group.on('dragend',function(){placeDragged(i,group,rect,lab);});
    group.on('click tap',function(){selected=i;showQuestion();});
    nodes.push({group:group,rect:rect,label:lab,slot:null,home:p});
  });
  base.add(new Konva.Circle({x:cx,y:cy,radius:105,fill:Deck.rgba('--panel',.96),stroke:Deck.token('--primary'),strokeWidth:3}));
  base.draw();cards.draw();
  function showQuestion(){var g=goals[selected],q=document.getElementById('question');q.innerHTML='<b>'+g.name+'</b><p>'+g.q+'</p>';nodes.forEach(function(n,i){n.rect.stroke(Deck.token(i===selected?'--accent':'--primary'));});cards.draw();}
  function nearestSlot(x,y){var best=-1,dist=Infinity;positions.forEach(function(p,i){var d=Math.hypot(x-p.x,y-p.y);if(d<dist){dist=d;best=i;}});return dist<82?best:-1;}
  function snap(n,p){n.group.to({x:p.x,y:p.y,duration:Deck.reduced()?0:.18,easing:Konva.Easings.EaseOut,onUpdate:function(){labelPos(n.label,{x:n.group.x(),y:n.group.y()});},onFinish:function(){labelPos(n.label,p);}});}
  function placeDragged(i,group,rect,lab){var slot=nearestSlot(group.x(),group.y()),n=nodes[i];
    if(slot<0||slotOwners[slot]!==null&&slotOwners[slot]!==i){
      var back=n.slot===null?n.home:positions[n.slot];snap(n,back);document.getElementById('status').textContent='每个目标只能占一个位置，请把六项目标全部排入。';
      if(!Deck.reduced()){group.to({x:back.x+10,duration:.07,yoyo:true,repeat:3,onUpdate:function(){labelPos(lab,{x:group.x(),y:group.y()});},onFinish:function(){snap(n,back);}});} return;
    }
    if(n.slot!==null)slotOwners[n.slot]=null;n.slot=slot;slotOwners[slot]=i;snap(n,positions[slot]);rect.stroke(Deck.token('--accent'));updateProgress();
  }
  function updateProgress(){var count=slotOwners.filter(function(v){return v!==null;}).length;document.getElementById('progress').textContent='已排 '+count+' / '+goals.length;var done=count===goals.length;document.getElementById('reveal').disabled=!done;document.getElementById('status').textContent=done?'排序已完成。现在比较高优先目标之间的张力。':'已放入 '+count+' 项，还需放入 '+(goals.length-count)+' 项。';}
  function reveal(){if(slotOwners.some(function(v){return v===null;}))return;links.destroyChildren();var pairs=[[0,1],[1,2],[0,5]];var list=document.getElementById('conflictList');list.innerHTML='';pairs.forEach(function(pair,k){var a=slotOwners[pair[0]],b=slotOwners[pair[1]],pa=positions[pair[0]],pb=positions[pair[1]];var line=new Konva.Line({points:[pa.x,pa.y,pb.x,pb.y],stroke:Deck.token('--accent'),strokeWidth:4,opacity:Deck.reduced()?1:0});links.add(line);if(!Deck.reduced())line.to({opacity:1,duration:.24,delay:k*.12});var d=document.createElement('div');d.className='conflict';d.innerHTML='<b>'+goals[a].name+' ↔ '+goals[b].name+'</b>：'+goals[a].t+' 与 '+goals[b].t+' 的取舍';list.appendChild(d);});links.draw();document.getElementById('progress').textContent='这是一种价值排序，不是标准答案';document.getElementById('status').textContent='先说清用哪把尺，才谈得上“哪项任务更值得”。';revealed=true;}
  function reset(){links.destroyChildren();slotOwners=[null,null,null,null,null,null];nodes.forEach(function(n,i){n.slot=null;n.group.position(n.home);labelPos(n.label,n.home);});selected=0;revealed=false;cards.draw();showQuestion();document.getElementById('conflictList').textContent='六项目标就位后，可查看相邻高优先目标与首尾目标之间的张力。';updateProgress();}
  document.getElementById('reveal').addEventListener('click',reveal);document.getElementById('reset').addEventListener('click',reset);
  document.getElementById('konva').addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();selected=(selected+(e.key==='ArrowRight'?1:goals.length-1))%goals.length;showQuestion();}var slot=parseInt(e.key,10)-1;if(slot>=0&&slot<goals.length){e.preventDefault();if(slotOwners[slot]!==null&&slotOwners[slot]!==selected){document.getElementById('status').textContent='该位置已有目标，请选择另一个排序位。';return;}var n=nodes[selected];if(n.slot!==null)slotOwners[n.slot]=null;n.slot=slot;slotOwners[slot]=selected;snap(n,positions[slot]);updateProgress();}});
  updateProgress();showQuestion();
})();
</script>
</body>
</html>
