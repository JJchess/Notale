<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{position:relative;background:#07111F;isolation:isolate}
  .sky{position:absolute;inset:18px;overflow:hidden;z-index:0;border:1px solid rgba(53,194,178,.08);background:radial-gradient(circle at 78% 16%,rgba(53,194,178,.10),transparent 27%),linear-gradient(180deg,#07111F 0%,#081522 100%)}
  .sky svg{width:100%;height:100%;display:block}
  .earth{opacity:0;animation:earth-in 1800ms ease-out forwards}
  .trail{stroke-dasharray:980;stroke-dashoffset:980;animation:trail-in 1800ms ease-out forwards}
  .print{opacity:0;transform-box:fill-box;transform-origin:center;animation:print-in 1800ms ease-out forwards}
  .p2{animation-delay:120ms}.p3{animation-delay:240ms}.p4{animation-delay:360ms}.p5{animation-delay:500ms}.p6{animation-delay:640ms}.p7{animation-delay:780ms}
  .orbital{opacity:0;animation:print-in 1800ms 900ms ease-out forwards}
  .final-node{opacity:0;animation:node-in 1800ms 1050ms ease-out forwards}
  .content{position:relative;z-index:2;box-sizing:border-box;height:100%;padding:54px 68px 42px;pointer-events:none}
  .kicker{display:flex;gap:10px;color:var(--primary-bright);font-family:var(--font-mono);font-size:16px;line-height:1.35;letter-spacing:.15em;font-weight:700}
  .title{margin-top:12px;font-size:clamp(34px,5.2vw,72px);line-height:1.08;max-width:18ch;letter-spacing:-.04em}
  .general{position:absolute;inset:0;display:block}
  .general>.trunk{position:absolute;left:600px;top:240px;width:510px;height:3px;margin:0;background:linear-gradient(90deg,var(--primary),rgba(53,194,178,.12));transform:rotate(-19deg);transform-origin:left center;opacity:.72}
  .general>.supports{display:block;padding:0}
  .general>.supports::before{display:none}
  .support{position:absolute;width:285px;padding:14px 18px!important;border-left:3px solid var(--primary)!important;background:rgba(7,17,31,.86)!important;box-shadow:0 12px 34px rgba(0,0,0,.22);font-size:18px!important;line-height:1.55!important}
  .support::before{bottom:auto!important;left:-42px!important;top:50%!important;width:40px!important;height:2px!important;transform:none!important}
  .support>span{display:block}.support .tag{display:block;margin-bottom:3px;color:var(--primary-bright);font-size:15px;line-height:1.4;font-family:var(--font-mono);letter-spacing:.08em}
  .s1{left:112px;top:502px}.s2{left:554px;top:408px}.s3{left:1200px;top:218px;border-color:var(--accent)!important}
  .s3::before{background:var(--accent)!important}
  .general>.claim{position:absolute;left:68px;top:250px;width:700px;box-sizing:border-box;padding:18px 24px;border:0;border-left:8px solid var(--accent);border-radius:0;background:linear-gradient(90deg,rgba(255,181,71,.14),rgba(7,17,31,.72) 74%,transparent);font-size:28px;line-height:1.42;opacity:0;animation:claim-in 1800ms 1050ms ease-out forwards}
  .claim strong{color:var(--text);font-weight:790}.claim .accent{color:var(--accent)}
  .question{position:absolute;left:68px;bottom:39px;display:flex;align-items:center;gap:12px;font-size:22px;line-height:1.4;font-weight:720;color:var(--text)}
  .question::before{content:"";width:36px;height:3px;background:var(--accent)}
  @keyframes earth-in{from{opacity:0}to{opacity:1}}
  @keyframes trail-in{to{stroke-dashoffset:0}}
  @keyframes print-in{0%,20%{opacity:0}55%,100%{opacity:1}}
  @keyframes node-in{0%,20%{opacity:0}55%,100%{opacity:1}}
  @keyframes claim-in{0%,18%{opacity:0;transform:translateY(12px)}55%,100%{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.earth,.trail,.print,.orbital,.final-node,.general>.claim{animation:none;opacity:1;transform:none}.trail{stroke-dashoffset:0}}
</style>
</head>
<body data-page="48" data-total="48">
<div id="stage">
  <div class="sky" aria-hidden="true">
    <svg viewBox="0 0 1600 900" role="img" aria-label="脚印汇成共同路径，越过地球弧面后向多个开放方向延伸">
      <defs>

        <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

      <g opacity=".55" fill="#A9C0CF"><circle cx="1270" cy="86" r="2"/><circle cx="1430" cy="178" r="1.7"/><circle cx="1050" cy="116" r="1.3"/><circle cx="1512" cy="318" r="1.3"/><circle cx="890" cy="68" r="1.2"/></g>

      <g fill="#35C2B2" opacity=".82">
        <g class="print p1" transform="translate(180 750) rotate(-24)"><ellipse cx="0" cy="0" rx="20" ry="34"/><circle cx="-17" cy="-34" r="6"/><circle cx="-7" cy="-42" r="7"/><circle cx="5" cy="-44" r="7"/><circle cx="17" cy="-39" r="6"/></g>
        <g class="print p2" transform="translate(345 650) rotate(-17)"><ellipse cx="0" cy="0" rx="15" ry="26"/><circle cx="-11" cy="-27" r="5"/><circle cx="0" cy="-33" r="5"/><circle cx="11" cy="-29" r="5"/></g>
        <g class="print p3" transform="translate(480 600) rotate(-35)"><ellipse cx="0" cy="0" rx="14" ry="24"/><circle cx="-10" cy="-25" r="4"/><circle cx="0" cy="-30" r="5"/><circle cx="10" cy="-26" r="4"/></g>
        <g class="print p4" transform="translate(555 535) rotate(-16)"><ellipse cx="0" cy="0" rx="13" ry="22"/><circle cx="-9" cy="-23" r="4"/><circle cx="0" cy="-27" r="4"/><circle cx="9" cy="-24" r="4"/></g>
        <g class="print p5" transform="translate(660 520) rotate(-31)"><ellipse cx="0" cy="0" rx="12" ry="20"/><circle cx="-8" cy="-21" r="3.5"/><circle cx="0" cy="-25" r="4"/><circle cx="8" cy="-22" r="3.5"/></g>
        <g class="print p6" transform="translate(750 468) rotate(-18)"><ellipse cx="0" cy="0" rx="10" ry="17"/><circle cx="-7" cy="-18" r="3"/><circle cx="0" cy="-21" r="3.5"/><circle cx="7" cy="-19" r="3"/></g>
        <g class="print p7" transform="translate(840 453) rotate(-33)"><ellipse cx="0" cy="0" rx="9" ry="15"/><circle cx="-6" cy="-16" r="3"/><circle cx="1" cy="-18" r="3"/><circle cx="7" cy="-16" r="2.5"/></g>

      <g class="orbital" fill="none" stroke="#35C2B2" stroke-width="2" opacity=".75"><path d="M915 433 C1050 384 1104 335 1170 300"/><path d="M1170 300 C1265 246 1350 214 1484 192"/><path d="M1170 300 C1300 305 1400 340 1515 397"/><path d="M1170 300 C1242 200 1318 135 1424 88"/></g>
      <g class="orbital" fill="#67E1D2"><circle cx="936" cy="425" r="5"/><circle cx="1000" cy="398" r="4"/><circle cx="1058" cy="368" r="4"/><circle cx="1114" cy="334" r="3.5"/><circle cx="1285" cy="239" r="3"/><circle cx="1380" cy="211" r="2.5"/><circle cx="1320" cy="318" r="3"/><circle cx="1430" cy="360" r="2.5"/><circle cx="1270" cy="185" r="3"/><circle cx="1350" cy="125" r="2.5"/></g>
      <circle class="final-node" cx="1170" cy="300" r="10" fill="#FFB547" filter="url(#glow)"/>
    </svg>
  </div>

  <main class="content min0" style="flex:1">
    <div class="kicker"><span>THE</span><span>DIRECTION</span><span>IS</span><span>OURS</span></div>
    <h1 class="title"><span>方向仍由</span><span>我们决定</span></h1>
    <section class="k-generalization general" aria-label="从三条判断汇入最终主张">
      <div class="trunk"></div>
      <div class="supports">
        <article class="support s1"><span class="tag">路径起点</span><span>不是预定好的</span><span>终点</span></article>
        <article class="support s2"><span class="tag">共同叠加</span><span>能力由许多人、</span><span>许多世代共同叠加</span></article>
        <article class="support s3"><span class="tag">弧面之外</span><span>下一段方向</span><span>仍要共同选择</span></article>
      </div>
      <div class="claim is-current"><strong><span>从 Apeman 到 Spaceman</span></strong><br><span>不是命运的阶梯，</span><span>而是一项</span><br><span class="accent">仍由我们共同决定方向的</span><span class="accent">集体工程。</span></div>
    </section>
    <div class="question"><span>我们想把共同能力</span><span>带向哪里？</span></div>
  </main>
</div>
