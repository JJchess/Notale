<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .hero-head{position:relative;z-index:4;padding:50px 74px 16px;background:linear-gradient(180deg,rgba(17,16,14,.98),rgba(17,16,14,.76) 72%,transparent)}
  .kicker{display:flex;gap:8px;margin-bottom:10px;color:var(--ochre-pale);font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em}
  .hero-head h1{font-size:var(--fs-h1)}
  .hero-head h1 span:last-child{color:var(--text-muted);font-weight:520}
  .hero-claim{width:650px;margin-top:18px;padding:14px 22px!important;border-left-width:6px!important;background:linear-gradient(90deg,rgba(58,41,28,.92),rgba(27,25,22,.66),transparent)!important}
  .scene{position:relative;isolation:isolate;margin-top:-42px;background:var(--panel-deep)}
  .scene>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
  .scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,16,14,.72),transparent 26%,transparent 74%,rgba(17,16,14,.9)),linear-gradient(90deg,rgba(17,16,14,.2),transparent 58%);pointer-events:none}
  .scene-svg{position:absolute;z-index:2;inset:0;width:100%;height:100%;overflow:visible}
  .route{fill:none;stroke:var(--ochre-pale);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:.78;animation:draw 2.1s .8s ease-out forwards}
  .orbit{fill:none;stroke:var(--cyan);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 7px rgba(85,221,224,.55));animation:draw 1.1s 2.45s ease-out forwards}
  .end-dot{fill:var(--cyan);opacity:0;filter:drop-shadow(0 0 9px var(--cyan));animation:appear .35s 3.35s ease-out forwards}
  .supports{position:absolute!important;z-index:3;inset:0;padding:0!important;display:block!important}
  .supports::before,.supports>.trunk{display:none}
  .support{position:absolute!important;padding:0!important;border:0!important;background:transparent!important}
  .support::before{display:none!important}
  .support .tag{box-shadow:0 8px 28px rgba(0,0,0,.38)}
  .support small{display:block;margin-top:8px;color:var(--text-strong);font-size:var(--fs-sec);line-height:1.4;text-shadow:0 2px 8px #000}
  .s-foot{left:170px;bottom:108px}.s-route{left:685px;top:53%}.s-orbit{right:190px;top:105px;text-align:right}
  .closing{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:20px 74px 26px;background:linear-gradient(180deg,rgba(17,16,14,.7),var(--bg) 35%)}
  .closing .lead{max-width:720px}.handoff{color:var(--text-muted);font-size:var(--fs-sec);line-height:1.45;text-align:right}
  .hero-head>*{opacity:0;animation:appear .55s ease-out forwards}.hero-head h1{animation-delay:.12s}.hero-claim{animation-delay:.28s}
  @keyframes appear{to{opacity:1}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @media(prefers-reduced-motion:reduce){.hero-head>*,.route,.orbit,.end-dot{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
</head>
<body data-page="01" data-total="48">
<div id="stage">
  <header class="hero-head" style="height:190px">
    <div class="kicker"><span>ACT</span><span>I</span><span>·</span><span>HOW WE MOVE</span></div>
    <h1><span>从脚印</span><span>到轨道</span></h1>
    <div class="k-generalization">
      <div class="claim hero-claim"><span>改变目的地之前，</span><span>先改变移动方式。</span></div>
    </div>
  </header>

  <main class="scene k-generalization min0" style="flex:1" aria-label="脚印、远行路线与地球轨道汇成同一条连续路径">
    <img src="assets/img/p01-footprint-orbit.png" alt="赭色土层上的脚印延伸为地平线上的路线，最后抬升为绕向地球的轨道">
    <svg class="scene-svg" viewBox="0 0 1600 600" preserveAspectRatio="none" aria-hidden="true">
      <path class="route" pathLength="1" d="M230 500 C390 455 520 390 670 360 C830 330 965 350 1100 306"/>
      <path class="orbit" pathLength="1" d="M1100 306 C1240 245 1310 136 1452 88"/>
      <circle class="end-dot" cx="1452" cy="88" r="7"/>
    </svg>
    <div class="supports" style="--support-cols:3">
      <div class="trunk" aria-hidden="true"></div>
      <div class="support s-foot"><span class="tag material">脚印</span><small><span>身体</span><span>迈步</span></small></div>
      <div class="support s-route"><span class="tag context">路线</span><small><span>行程</span><span>延伸</span></small></div>
      <div class="support s-orbit"><span class="tag context">轨道</span><small><span>路径</span><span>绕向地球</span></small></div>
    </div>
  </main>

  <footer class="closing" style="height:110px">
    <p class="lead"><span>从脚印到轨道，</span><span>人类一直在改变“怎样移动”。</span></p>
    <p class="handoff"><span>不是注定向上的进步阶梯。</span><br><span>接下来：要追问哪五件事？</span></p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:1,total:48});</script>
</body>
</html>
