<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#11100E;--text:#F1ECE4;--font-sans:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
#stage{padding:34px 46px 30px;gap:18px}
.kicker{color:var(--ochre-pale);font:700 15px/1 var(--font-mono);letter-spacing:.14em}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:28px}
.head .lead{max-width:720px;color:var(--text-muted)}
.main{display:flex;gap:20px;min-height:0}
.timeline-side{flex:2.15;display:flex;flex-direction:column;gap:14px;min-width:0}
.detail-side{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.chart{flex:1;min-height:0;cursor:grab;touch-action:none}
.chart:active{cursor:grabbing}.chart:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.chart svg{width:100%;height:100%}.axis text{fill:var(--text-muted);font:14px var(--font-mono)}.axis path,.axis line{stroke:var(--line)}
.anchor .stem{stroke:var(--ochre);stroke-width:2}.anchor .dot{fill:var(--panel-deep);stroke:var(--ochre);stroke-width:4}.anchor .halo{fill:none;stroke:var(--cyan);stroke-width:2;opacity:0}.anchor.checked{opacity:.58}.anchor.current{opacity:1}.anchor.current .dot{stroke:var(--cyan);fill:var(--cyan-soft)}.anchor.current .halo{opacity:1}.anchor text{fill:var(--text-strong);font:650 16px var(--font-sans)}.anchor .date{fill:var(--ochre-pale);font:700 15px var(--font-mono)}
.scan{stroke:var(--cyan);stroke-width:2;stroke-dasharray:7 7}.scan-label{fill:var(--cyan-pale);font:700 15px var(--font-sans)}
.horizon{stroke:var(--ochre);stroke-width:3}.bracket{stroke:var(--line);stroke-width:2;fill:none}.bracket.on{stroke:var(--cyan)}.bracket-label{fill:var(--text-muted);font:650 15px var(--font-sans)}.bracket-label.on{fill:var(--cyan-pale)}
.ctl{padding:10px 16px;border:1px solid var(--line-soft);border-radius:var(--radius-md);background:var(--panel)}
.detail-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.progress{color:var(--cyan-pale);font:700 16px var(--font-mono)}
.skull{height:210px;display:grid;place-items:center;border-bottom:1px solid var(--line-soft)}
.skull svg{width:190px;height:180px;overflow:visible}.skull path{fill:var(--ochre-soft);stroke:var(--ochre-pale);stroke-width:4;transition:d .35s ease,transform .35s ease}.skull .orbit{fill:var(--panel-deep);stroke:var(--ochre);stroke-width:3}
.detail-copy{display:flex;flex-direction:column;gap:10px}.detail-copy h2{font-size:26px}.reading{min-height:78px;color:var(--text);font-size:18px;line-height:1.5}.empty{color:var(--text-muted)}
.k-enumeration{display:flex;gap:8px}.k-enumeration>.it{flex:1;padding:10px 12px;border-top-width:3px}.k-enumeration>.it>:first-child{font-size:16px}.k-enumeration>.it span{display:block;color:var(--text-muted);font-size:14px}.k-enumeration>.it.done{filter:saturate(.35);opacity:.68}.k-enumeration>.it.current{border-color:var(--cyan);background:var(--cyan-soft)}
.feedback{min-height:48px;color:var(--text-muted);font-size:16px;line-height:1.45}.finish{height:74px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 22px;border:1px solid var(--line);border-left:6px solid var(--ochre);border-radius:var(--radius-md);background:linear-gradient(90deg,var(--ochre-soft),var(--panel));opacity:.48;transition:opacity .3s ease,border-color .3s ease}.finish.complete{opacity:1;border-left-color:var(--cyan)}.finish p{font-size:19px;font-weight:650}.btn{font-size:16px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.anchor .halo{display:none}}
</style>
</head>
<body data-page="07" data-total="48">
<div id="stage">
  <header style="height:72px;display:flex;flex-direction:column;justify-content:space-between">
    <div class="kicker">BODY BEFORE BRAIN</div>
    <div class="head"><h1>先站起来，后长大脑</h1><p class="lead">可靠的两足证据早得多；把时间间隔拖到扫描线前看清。</p></div>
  </header>
  <main class="main min0" style="flex:1">
    <section class="timeline-side min0">
      <div id="chart" class="cvbox chart no-pan" tabindex="0" role="slider" aria-label="距今年代尺；左右方向键移动" aria-valuemin="0" aria-valuemax="366" aria-valuenow="200">
        <svg id="timeline" role="img" aria-label="四个证据锚点位于同一条距今年代轴上"></svg>
      </div>
      <div class="ctl"><label for="zoom">年代跨度</label><input id="zoom" type="range" min="1" max="3" step="1" value="1"><output id="zoomOut"><span class="num"></span><span class="unit">万年</span></output></div>
      <div class="hint">拖动年代尺；让锚点靠近固定扫描线后松手。方向键也可移动。</div>
      <div id="items" class="k-enumeration" style="--enum-cols:4" aria-label="四个同级证据锚点"></div>
    </section>
    <aside class="panel detail-side min0">
      <div class="detail-top"><span class="tag action">扫描线读数</span><span id="progress" class="progress">已检查 0/4</span></div>
      <div class="skull" aria-hidden="true"><svg viewBox="0 0 220 190"><path id="skullPath" d="M53 135C29 112 30 66 55 39C79 12 137 12 165 39C189 62 192 105 170 128L151 141L145 169L96 169L89 145Z"/><ellipse class="orbit" cx="145" cy="87" rx="18" ry="14"/></svg></div>
      <div class="detail-copy"><h2 id="detailTitle">等待证据锚点</h2><div id="detailReading" class="reading empty">四项共享一条时间轴；右栏只放大扫描线当前读到的一项。</div></div>
      <div id="feedback" class="feedback" aria-live="polite">先寻找最早的两足证据。</div>
    </aside>
  </main>
  <footer id="finish" class="finish" style="height:74px">
    <p id="conclusion">直立行走出现后约两百万年，脑容量才进入明显增长阶段。</p>
    <div class="btns"><button id="reset" class="btn" type="button">重看时间尺</button></div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  Deck.init({index:7,total:48});
  var K=Lec.K.evolution;
  var growth=Math.round(K.homoErectusYearsAgo/1000000)*1000000;
  var gap=K.laetoliFootprintsYearsAgo-growth;
  var events=[
    {id:'feet',year:K.laetoliFootprintsYearsAgo,label:'稳定两足证据',short:'Laetoli 足迹',read:'已能稳定两足行走',kind:'足迹',lane:0,shape:.78},
    {id:'austral',year:K.laetoliFootprintsYearsAgo,label:'同期脑量参照',short:'南方古猿阿法种',read:'脑容量约四百至五百五十立方厘米',kind:'轮廓',lane:1,shape:.82},
    {id:'growth',year:growth,label:'增长阶段',short:'早期人属',read:'脑容量增长开始变得突出；不设单一分界年',kind:'轮廓',lane:0,shape:.94},
    {id:'modern',year:K.homoSapiensYearsAgo,label:'现代参照',short:'现代人',read:'平均脑容量约一千三百立方厘米，个体差异显著',kind:'轮廓',lane:1,shape:1.08}
  ];
  var fmt=function(y){return y>=1000000?'约 '+Deck.fmt(y/10000,0)+' 万年前':Deck.fmt(y/10000,0)+' 万年前'};
  d3.select('#items').selectAll('.it').data(events).join('div').attr('class','it').attr('data-id',d=>d.id).html(d=>'<strong>'+d.label+'</strong><span>'+fmt(d.year)+'</span>');
  var svg=d3.select('#timeline'), W=1000,H=485, center=W*.52, offset=0,zoomLevel=1,checked=new Set(),current=null;
  svg.attr('viewBox','0 0 '+W+' '+H);
  var root=svg.append('g'), axisG=root.append('g').attr('class','axis'), marks=root.append('g'), bracketG=root.append('g');
  root.append('line').attr('class','scan').attr('x1',center).attr('x2',center).attr('y1',34).attr('y2',448);
  root.append('text').attr('class','scan-label').attr('x',center+10).attr('y',28).text('固定扫描线');
  var scale=d3.scaleLinear();
  function domainSpan(){return 4000000/zoomLevel}
  function x(y){return center+offset+(growth-y)*(760/domainSpan())}
  function render(){
    scale.domain([growth-domainSpan()/2,growth+domainSpan()/2]).range([center+380+offset,center-380+offset]);
    axisG.attr('transform','translate(0,254)').call(d3.axisBottom(scale).ticks(6).tickFormat(d=>Deck.fmt(d/10000,0)+' 万'));
    axisG.selectAll('text').attr('font-size',14);
    marks.selectAll('g.anchor').data(events,d=>d.id).join(function(enter){var g=enter.append('g').attr('class','anchor');g.append('line').attr('class','stem');g.append('circle').attr('class','halo').attr('r',18);g.append('circle').attr('class','dot').attr('r',9);g.append('text').attr('class','date');g.append('text').attr('class','name');return g;})
      .attr('class',d=>'anchor '+(checked.has(d.id)?'checked ':'')+(current===d.id?'current':''))
      .each(function(d){var px=x(d.year),py=d.lane?336:172,g=d3.select(this);g.select('.stem').attr('x1',px).attr('x2',px).attr('y1',py).attr('y2',254);g.selectAll('circle').attr('cx',px).attr('cy',py);g.select('.date').attr('x',px+16).attr('y',py-5).text(fmt(d.year));g.select('.name').attr('x',px+16).attr('y',py+20).text(d.short)});
    var x1=x(K.laetoliFootprintsYearsAgo),x2=x(growth),by=416;
    bracketG.selectAll('*').remove();bracketG.append('path').attr('class','bracket '+(checked.size===4?'on':'')).attr('d','M'+x1+','+(by-12)+'V'+by+'H'+x2+'V'+(by-12));bracketG.append('text').attr('class','bracket-label '+(checked.size===4?'on':'')).attr('x',(x1+x2)/2).attr('y',by+25).attr('text-anchor','middle').text('约 '+Deck.fmt(gap/10000,0)+' 万年，数量级约两百万年');
    document.querySelector('#chart').setAttribute('aria-valuenow',Math.round((growth-offset/(760/domainSpan()))/10000));
  }
  function nearest(){return events.reduce((a,b)=>Math.abs(x(a.year)-center)<Math.abs(x(b.year)-center)?a:b)}
  function inspect(){var d=nearest(),dist=Math.abs(x(d.year)-center);if(dist<62){offset+=center-x(d.year);current=d.id;checked.add(d.id);document.querySelector('#detailTitle').textContent=d.label;var rd=document.querySelector('#detailReading');rd.textContent=d.read;rd.classList.remove('empty');document.querySelector('#feedback').textContent=d.id==='feet'?'两足证据已经出现；继续寻找脑量参照。':'时间位置已锁定，继续比较其余锚点。';document.querySelector('#skullPath').style.transform='scale('+d.shape+')';document.querySelector('#skullPath').style.transformOrigin='110px 100px';}else{current=null;offset*=.94;document.querySelector('#feedback').textContent='这里没有证据锚点；继续拖动，比较 366 万年与约 200 万年的位置。';}update();}
  function update(){render();document.querySelector('#progress').textContent='已检查 '+checked.size+'/4';d3.selectAll('#items .it').attr('class',d=>'it '+(checked.has(d.id)?'done ':'')+(current===d.id?'current':''));document.querySelector('#finish').classList.toggle('complete',checked.size===4);}
  var drag=d3.drag().on('drag',function(e){offset+=e.dx;render()}).on('end',inspect);svg.call(drag);
  document.querySelector('#chart').addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();offset+=(e.key==='ArrowLeft'?-1:1)*28;render()}if(e.key==='Enter'||e.key===' '){e.preventDefault();inspect()}});
  document.querySelector('#zoom').addEventListener('input',function(){zoomLevel=+this.value;document.querySelector('#zoomOut .num').textContent=Deck.fmt(domainSpan()/10000,0);render()});
  document.querySelector('#reset').addEventListener('click',function(){offset=0;zoomLevel=1;checked.clear();current=null;document.querySelector('#zoom').value=1;document.querySelector('#detailTitle').textContent='等待证据锚点';document.querySelector('#detailReading').textContent='四项共享一条时间轴；右栏只放大扫描线当前读到的一项。';document.querySelector('#detailReading').classList.add('empty');document.querySelector('#feedback').textContent='先寻找最早的两足证据。';document.querySelector('#skullPath').style.transform='';document.querySelector('#zoomOut .num').textContent=Deck.fmt(domainSpan()/10000,0);update()});
  document.querySelector('#zoomOut .num').textContent=Deck.fmt(domainSpan()/10000,0);update();
  if(!Deck.reduced()){axisG.style('opacity',0).transition().duration(650).style('opacity',1);marks.selectAll('.anchor').style('opacity',0).transition().delay((d,i)=>180+i*90).duration(420).style('opacity',1)}
})();
</script>
</body>
</html>
