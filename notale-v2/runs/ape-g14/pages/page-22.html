<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:30px 42px 24px;gap:18px}
  .kicker{color:var(--ochre-pale);font:700 15px/1.2 var(--font-mono);letter-spacing:.14em}
  .main{display:flex;gap:20px;min-height:0}
  .left{display:flex;flex-direction:column;gap:14px;flex:0 0 54%}
  .right{display:flex;flex-direction:column;gap:12px;flex:1}
  .k-comparison>.hdr,.k-comparison>.dim,.k-comparison>.cell{padding:9px 12px}
  .k-comparison>.hdr{font-size:18px}
  .k-comparison>.dim{font-size:15px}
  .k-comparison>.cell{font:650 15px/1.4 var(--font-mono)}
  .trial-a{color:#bda28c}.trial-b{color:var(--ochre-pale)}.trial-c{color:var(--cyan-pale)}
  .controls{padding:16px 20px;display:flex;flex-direction:column;gap:10px}
  .controls .ctl{grid-template-columns:140px 1fr 112px}
  .readouts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .readout{padding:10px 12px;border-left:2px solid var(--line);min-width:0}
  .readout strong{display:block;color:var(--text-strong);font:700 21px/1.25 var(--font-mono);white-space:nowrap}
  .readout span{display:block;color:var(--text-muted);font-size:14px;line-height:1.35}
  .scene{flex:1}
  .scene canvas{touch-action:none}
  .scene-label{position:absolute;z-index:2;padding:6px 10px;border-radius:6px;background:rgba(13,12,11,.82);color:var(--text-muted);font-size:14px;line-height:1.35;pointer-events:none}
  .model-note{left:14px;top:14px}.goal-note{right:14px;top:14px;color:var(--cyan-pale)}
  .legend{padding:0 4px}
  .feedback{min-height:50px;padding:12px 16px;border-left:3px solid var(--cyan);background:var(--panel);color:var(--text);font-size:16px;line-height:1.45}
  .bottom{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:14px 20px;border-top:1px solid var(--line)}
  .bottom .lead{max-width:1040px}.next{color:var(--text-muted);font-size:16px;line-height:1.4;text-align:right}
  .btn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body data-page="22" data-total="48">
<div id="stage">
  <header style="height:58px">
    <div class="kicker">ACT III · ORBIT</div>
    <h1>牛顿炮：怎样一直落下去</h1>
  </header>

  <main class="main min0" style="flex:1">
    <section class="left min0" aria-label="一秒内下落与地面弯离的比较">
      <div class="k-comparison" style="--compare-cols:3">
        <div class="hdr">同一秒内</div><div class="hdr trial-a">慢速试射</div><div class="hdr trial-b">快速试射</div><div class="hdr trial-c" id="orbitHeader">贴合曲率</div>
        <div class="dim">横向初速度</div><div class="cell" id="vSlow"></div><div class="cell" id="vFast"></div><div class="cell diff" id="vOrbit"></div>
        <div class="dim">横向距离</div><div class="cell" id="dSlow"></div><div class="cell" id="dFast"></div><div class="cell diff" id="dOrbit"></div>
        <div class="dim">炮弹约下落</div><div class="cell" id="fallSlow"></div><div class="cell" id="fallFast"></div><div class="cell diff" id="fallOrbit"></div>
        <div class="dim">地面弯离切线</div><div class="cell" id="curveSlow"></div><div class="cell" id="curveFast"></div><div class="cell diff" id="curveOrbit"></div>
        <div class="dim">结果</div><div class="cell">很快撞地</div><div class="cell">落点更远</div><div class="cell diff">持续错过地面</div>
      </div>

      <div class="panel controls">
        <div class="ctl">
          <label for="speed">横向初速度</label>
          <input id="speed" type="range" min="2000" max="8200" step="10" value="6000" aria-describedby="speedHint">
          <output id="speedOut" class="num">6.00 km/s</output>
        </div>
        <div class="btns">
          <button class="btn lg" id="launch" type="button">发射</button>
          <button class="btn" id="reset" type="button">重置试验</button>
          <div class="hint" id="speedHint">调速度再发射；目标是连续绕行一周。</div>
        </div>
        <div class="readouts" aria-live="polite">
          <div class="readout"><span>当前速度</span><strong id="nowSpeed">6.00 km/s</strong></div>
          <div class="readout"><span>已绕过角度</span><strong id="angle">0°</strong></div>
          <div class="readout"><span>状态</span><strong id="status">待发射</strong></div>
          <div class="readout"><span>试射次数</span><strong id="tries">0</strong></div>
        </div>
      </div>
      <p class="feedback" id="feedback">横向速度不会消除重力，而会把落点不断推远。</p>
    </section>

    <section class="right min0" aria-label="理想地球弹道模拟">
      <div class="cvbox scene no-pan">
        <canvas id="sim" class="cv-fill" aria-label="炮弹受指向地心的反平方引力运动，赭色圆为地球截面"></canvas>
        <div class="scene-label model-note">理想球形地球 · 无空气阻力</div>
        <div class="scene-label goal-note">目标：绕行 360°</div>
      </div>
      <ul class="legend">
        <li class="li"><span class="sw line" style="background:#bda28c"></span>慢速参考</li>
        <li class="li"><span class="sw line" style="background:var(--ochre-pale)"></span>快速参考</li>
        <li class="li"><span class="sw line" style="background:var(--cyan)"></span>本次轨迹</li>
        <li class="li"><span class="sw line" style="background:rgba(85,221,224,.3)"></span>最佳轨迹</li>
      </ul>
    </section>
  </main>

  <footer class="bottom" style="height:82px">
    <p class="lead">横向速度足够大时，炮弹仍在下落，只是地面以同样快的速度弯离它。</p>
    <p class="next">下一问：这个速度到了不同高度会怎样变化？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:22,total:48});
  const K=Lec.K, P=Lec.P, R=K.earth.meanRadiusMetres, MU=K.earth.gravitationalParameterM3ps2;
  const orbit=P.circularOrbitSpeed(MU,R,0);
  const slow=P.kilometresToMetres(2), fast=P.kilometresToMetres(6);
  const surfaceG=MU/(R*R), oneSecondFall=surfaceG/2;
  const samples=[['Slow',slow],['Fast',fast],['Orbit',orbit]];
  samples.forEach(function(item){
    const key=item[0],v=item[1];
    document.getElementById('v'+key).textContent=(v/K.units.metresPerKilometre).toFixed(2)+' km/s';
    document.getElementById('d'+key).textContent=(P.speed(v,1)/K.units.metresPerKilometre).toFixed(2)+' km';
    document.getElementById('fall'+key).textContent=oneSecondFall.toFixed(2)+' m';
    document.getElementById('curve'+key).textContent=(v*v/(2*R)).toFixed(2)+' m';
  });
  const cv=document.getElementById('sim'), speed=document.getElementById('speed');
  const out=document.getElementById('speedOut'), now=document.getElementById('nowSpeed'), angleEl=document.getElementById('angle');
  const statusEl=document.getElementById('status'), triesEl=document.getElementById('tries'), fb=document.getElementById('feedback');
  const launch=document.getElementById('launch'), reset=document.getElementById('reset'), header=document.getElementById('orbitHeader');
  const engine=Matter.Engine.create({gravity:{x:0,y:0,scale:0}}); engine.gravity.scale=0;
  let body=null, running=false, tries=0, angle=0, lastAngle=0, accumulated=0, trail=[], best=[], impact=null, success=false;
  let geom={w:0,h:0,cx:0,cy:0,r:0,scale:1};
  const fmt=v=>(v/K.units.metresPerKilometre).toFixed(2)+' km/s';

  function setGeom(){
    geom.w=cv.clientWidth; geom.h=cv.clientHeight; geom.r=Math.min(geom.w*.39,geom.h*.39); geom.cx=geom.w/2; geom.cy=geom.h/2+18; geom.scale=R/geom.r;
  }
  function addGravity(){
    if(!body||!running)return;
    const dx=geom.cx-body.position.x,dy=geom.cy-body.position.y, rp=Math.hypot(dx,dy), rm=rp*geom.scale;
    const a=MU/(rm*rm)/geom.scale/1000000;
    Matter.Body.applyForce(body,body.position,{x:body.mass*a*dx/rp,y:body.mass*a*dy/rp});
  }
  Matter.Events.on(engine,'beforeUpdate',addGravity);

  function begin(){
    if(running)return;
    if(body){Matter.Composite.remove(engine.world,body);body=null;}
    tries++; triesEl.textContent=tries; success=false; impact=null; accumulated=0; angle=0; lastAngle=-Math.PI/2; trail=[];
    const startR=geom.r+0.7;
    body=Matter.Bodies.circle(geom.cx,geom.cy-startR,4,{frictionAir:0,inertia:Infinity,restitution:0});
    Matter.Composite.add(engine.world,body);
    const v=Number(speed.value)/geom.scale/1000;
    Matter.Body.setVelocity(body,{x:v,y:0});
    running=true; statusEl.textContent='飞行中'; fb.textContent='重力始终指向地心；观察轨迹是否比地表弯得更快。'; launch.disabled=true;
    cv.dispatchEvent(new CustomEvent('game-start',{bubbles:true}));
  }
  function finish(ok){
    running=false; launch.disabled=false;
    if(trail.length>best.length)best=trail.slice();
    if(ok){
      success=true; statusEl.textContent='完成一周'; angleEl.textContent='360°'; header.style.boxShadow='inset 3px 0 0 var(--cyan),0 0 24px rgba(85,221,224,.25)';
      fb.textContent='你没有关掉重力；你让炮弹一直错过地面。';
      cv.dispatchEvent(new CustomEvent('game-complete',{bubbles:true,detail:{score:360,metrics:{tries:tries},trace:trail.slice()}}));
    }else{
      statusEl.textContent='撞地'; fb.textContent='炮弹向地面弯得比地面自身更快——提高横向速度。';
      impact=trail[trail.length-1]; cv.dispatchEvent(new CustomEvent('game-progress',{bubbles:true,detail:{state:'impact',action:'launch',metrics:{angle:angle}}}));
    }
  }
  function resetAll(){
    if(body){Matter.Composite.remove(engine.world,body);body=null;} running=false;tries=0;angle=0;trail=[];best=[];impact=null;success=false;
    speed.value=6000; out.textContent=fmt(Number(speed.value)); now.textContent=out.textContent; angleEl.textContent='0°';statusEl.textContent='待发射';triesEl.textContent='0';launch.disabled=false;header.style.boxShadow='';
    fb.textContent='横向速度不会消除重力，而会把落点不断推远。'; cv.dispatchEvent(new CustomEvent('game-reset',{bubbles:true})); draw();
  }
  function update(){
    if(!running)return;
    Matter.Engine.update(engine,16.6667);
    const dx=body.position.x-geom.cx,dy=body.position.y-geom.cy,rp=Math.hypot(dx,dy), a=Math.atan2(dy,dx);
    let da=a-lastAngle;if(da>Math.PI)da-=Math.PI*2;if(da<-Math.PI)da+=Math.PI*2; accumulated+=Math.abs(da);lastAngle=a;angle=Math.min(360,accumulated*180/Math.PI);
    trail.push({x:body.position.x,y:body.position.y}); if(trail.length>900)trail.shift();
    const physicalSpeed=Math.hypot(body.velocity.x,body.velocity.y)*geom.scale*1000;
    now.textContent=fmt(physicalSpeed);angleEl.textContent=Math.round(angle)+'°';
    if(accumulated>=Math.PI*2){finish(true);return;}
    if(trail.length>3&&rp<=geom.r){finish(false);return;}
    if(rp>geom.r*2.1){finish(false);statusEl.textContent='飞离画面';fb.textContent='速度过大，轨迹不再贴合地表；把速度调回贴合曲率附近。';}
  }
  function path(ctx,pts,color,width){if(pts.length<2)return;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();}
  function draw(){
    const ctx=Deck.fit(cv);setGeom();ctx.clearRect(0,0,geom.w,geom.h);
    const ochre=Deck.token('--ochre'),cyan=Deck.token('--cyan');
    ctx.strokeStyle=Deck.rgba('--ochre',.28);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(24,geom.cy-geom.r);ctx.lineTo(geom.w-24,geom.cy-geom.r);ctx.stroke();
    ctx.fillStyle=Deck.rgba('--ochre',.12);ctx.strokeStyle=ochre;ctx.lineWidth=3;ctx.beginPath();ctx.arc(geom.cx,geom.cy,geom.r,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle=ochre;ctx.beginPath();ctx.fillRect(geom.cx-12,geom.cy-geom.r-5,24,8);
    path(ctx,best,Deck.rgba('--cyan',.22),2);path(ctx,trail,cyan,3);
    if(body){ctx.fillStyle=cyan;ctx.shadowColor=cyan;ctx.shadowBlur=success?18:9;ctx.beginPath();ctx.arc(body.position.x,body.position.y,6,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
    if(impact){ctx.strokeStyle=ochre;ctx.lineWidth=3;ctx.beginPath();ctx.arc(impact.x,impact.y,14,0,Math.PI*2);ctx.stroke();}
    ctx.strokeStyle=cyan;ctx.lineWidth=2;Deck.arrow(ctx,geom.cx,geom.cy-geom.r-18,geom.cx+76,geom.cy-geom.r-18,9);ctx.stroke();
  }
  speed.addEventListener('input',()=>{out.textContent=fmt(Number(speed.value));if(!running)now.textContent=out.textContent;});
  launch.addEventListener('click',begin);reset.addEventListener('click',resetAll);
  Deck.onResize(()=>{setGeom();draw();});
  Deck.loop(()=>{update();draw();},{still:1});
  setGeom();resetAll();
  window.page22={launch:begin,reset:resetAll,setSpeed:function(v){speed.value=v;speed.dispatchEvent(new Event('input'));},orbit:orbit};
})();
</script>
</body>
</html>
