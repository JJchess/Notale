<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .opening-head{display:flex;flex-direction:column;justify-content:flex-end}
  .kicker{margin:0 0 10px;color:var(--muted);font-size:var(--fs-label);font-weight:680;line-height:1.35;letter-spacing:.2em}
  .opening-head h1{margin:0;max-width:760px}
  .hero{position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
  .horizon{position:absolute;left:0;right:0;top:56%;height:1px;background:var(--line-strong);transform-origin:left center;animation:horizon-in 1.1s .25s both}
  .horizon::after{content:"";position:absolute;left:0;right:38%;top:0;border-top:3px solid var(--trace);opacity:.7}
  .orbit{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .orbit path{fill:none;stroke:var(--active);stroke-width:3;stroke-linecap:round;stroke-dasharray:1300;stroke-dashoffset:1300;opacity:.82;animation:orbit-in 1.25s 1s ease-out forwards}
  .tracks{position:absolute;left:3%;top:53%;display:flex;align-items:center;gap:62px;transform:rotate(-2deg)}
  .print{width:22px;height:43px;border:2px solid var(--trace);border-radius:55% 48% 62% 42%;opacity:.74;transform:rotate(20deg)}
  .print:nth-child(even){transform:translateY(17px) rotate(-18deg)}
  .figure{position:absolute;left:18%;top:39%;width:12px;height:76px;border-radius:50% 50% 20% 20%;background:var(--trace);opacity:.46}
  .figure::before{content:"";position:absolute;left:-4px;top:-14px;width:20px;height:20px;border-radius:50%;background:var(--trace)}
  .general{width:820px;transform:translateY(-14px);animation:rise-in .75s 1.8s both}
  .general>.claim{font-size:30px;text-align:center;text-shadow:0 2px 12px var(--bg)}
  .general .support{text-align:center;color:var(--text);text-shadow:0 2px 10px var(--bg)}
  .general .support:first-child{border-bottom:2px solid var(--trace)}
  .general .support:last-child{border-bottom:2px solid var(--active)}
  .support-label{display:block;margin-bottom:5px;color:var(--muted);font-size:var(--fs-label);font-weight:650;letter-spacing:.08em}
  .support-main{display:block;font-size:var(--fs-body);font-weight:650;line-height:1.5}
  .support-detail{display:block;color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
  .closing{display:flex;align-items:flex-end;justify-content:space-between;gap:48px;border-top:1px solid var(--line);padding-top:18px}
  .closing .lead{max-width:980px;margin:0;font-weight:650}
  .handoff{max-width:420px;margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.45;text-align:right}
  .backdrop{animation:scene-in 1.2s both}
  .backdrop-note{bottom:146px}
  @keyframes scene-in{from{opacity:0}to{opacity:.19}}
  @keyframes horizon-in{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes orbit-in{to{stroke-dashoffset:0}}
  @keyframes rise-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(-14px)}}
  @media (prefers-reduced-motion:reduce){.backdrop,.horizon,.orbit path,.general{animation:none}.orbit path{stroke-dashoffset:0}.general{transform:translateY(-14px)}}
</style>
</head>
<body data-page="01" data-total="50">
<div id="stage">
  <img class="backdrop" src="assets/img/illus-savanna-horizon.png" alt="" title="（已存在）">
  <header class="opening-head" style="height:126px">
    <p class="kicker"><span>APEMAN</span> <span>—</span> <span>SPACEMAN</span></p>
    <h1><span>从直立行走</span><span>到离开地球</span></h1>
  </header>

  <main class="hero min0" style="flex:1" aria-label="脚印、地平线与轨道弧共同构成的开场图">
    <div class="horizon" aria-hidden="true"></div>
    <svg class="orbit" viewBox="0 0 1488 590" preserveAspectRatio="none" aria-hidden="true">
      <path d="M 875 470 C 1045 330, 1195 205, 1488 132"/>
    </svg>
    <div class="tracks" aria-hidden="true">
      <span class="print"></span><span class="print"></span><span class="print"></span><span class="print"></span><span class="print"></span>
    </div>
    <div class="figure" aria-hidden="true"></div>

    <section class="k-generalization general" aria-label="本课核心主张">
      <div class="claim"><span>不是</span> <span>升级阶梯</span></div>
      <div class="trunk" aria-hidden="true"></div>
      <div class="supports">
        <div class="support">
          <span class="support-label">约束改变</span>
          <span class="support-main">身体与环境的约束不断重配</span>
          <span class="support-detail">站立仍在环境之中</span>
        </div>
        <div class="support">
          <span class="support-label">集体能力重组</span>
          <span class="support-main">能力被组织成跨个体的集体系统</span>
          <span class="support-detail">离地仍沿允许的路径</span>
        </div>
      </div>
    </section>
  </main>

  <footer class="closing" style="height:116px">
    <p class="lead"><span>从脚印到轨道，</span><span>不是一条升级阶梯，</span><span>而是约束与集体能力的连续重组。</span></p>
    <p class="handoff"><span>如果不是升级阶梯：</span><br><span>直立、脑增大、石器和火箭，</span><span>你原本以为谁先出现？</span></p>
  </footer>
  <div class="backdrop-note">AI生成</div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
