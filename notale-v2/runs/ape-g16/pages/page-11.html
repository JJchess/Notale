<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .act-kicker{color:var(--trace);font:700 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.16em;margin:0 0 5px}
  .process-field{position:relative;display:flex;flex-direction:column;min-height:0}
  .process-field::before{content:"";position:absolute;inset:8% 0 12%;background:linear-gradient(90deg,transparent,rgba(196,122,68,.05),rgba(98,230,209,.06),transparent);border-top:1px solid var(--line);border-bottom:1px solid var(--line);pointer-events:none}
  .visual-chain{position:absolute;inset:0 0 74px;width:100%;height:calc(100% - 74px);overflow:visible}
  .trace-line{fill:none;stroke:var(--trace);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .fine-line{fill:none;stroke:var(--line-strong);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .active-line{fill:none;stroke:var(--active);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .tool{fill:var(--trace);stroke:var(--text);stroke-width:2}
  .glow{fill:var(--active)}
  .k-process{margin-top:auto;height:104px;align-items:flex-end;padding-bottom:14px}
  .k-process>.step{height:82px;padding:0 14px;display:flex;flex-direction:column;justify-content:flex-end}
  .step-no{color:var(--muted);font:650 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.08em}
  .step strong{font-size:var(--fs-lead);line-height:1.35;font-weight:700}
  .step em{color:var(--muted);font-size:var(--fs-label);line-height:1.35;font-style:normal}
  .teaching-line{display:flex;align-items:center;gap:18px;border-top:1px solid var(--line);padding-top:14px}
  .teaching-line .mark{flex:0 0 34px;color:var(--active);font:700 var(--fs-h2)/1 var(--font-mono)}
  .teaching-line p{margin:0;font-size:var(--fs-body);line-height:1.45}
  .teaching-line p+p{padding-left:18px;border-left:1px solid var(--line-strong)}
  .handoff{display:flex;align-items:center;justify-content:space-between;gap:28px}
  .handoff .lead{margin:0;font-weight:700}
  .handoff .question{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.45;text-align:right;max-width:630px}
  @media (prefers-reduced-motion:reduce){.visual-chain *{transition:none!important}}
</style>
</head>
<body data-page="11" data-total="50">
<div id="stage">
  <img class="backdrop" src="assets/img/illus-savanna-horizon.png" alt="" title="（已存在）">
  <div class="backdrop-note">AI生成</div>

  <header style="height:102px">
    <p class="act-kicker">ACT II · ACCUMULATION</p>
    <h1>身体之外，本事开始累积</h1>
  </header>

  <main class="process-field min0" style="flex:1" aria-label="从身体可能到跨世代累积的连续过程">
    <svg class="visual-chain" viewBox="0 0 1488 490" role="img" aria-label="脚印弧线变成手掌，工具从一只手传向下一只手">
      <path class="fine-line draw-path" d="M38 383 C104 292 156 278 225 306 C293 334 334 287 372 219 C420 132 491 103 562 155 C624 200 665 235 728 231 C811 226 874 184 950 192 C1050 203 1101 265 1191 244 C1283 222 1350 177 1450 204"/>
      <g class="footprints">
        <g class="foot" transform="translate(96 309) rotate(-18)"><ellipse class="tool" cx="0" cy="24" rx="25" ry="45"/><circle class="tool" cx="-19" cy="-23" r="8"/><circle class="tool" cx="-6" cy="-31" r="9"/><circle class="tool" cx="9" cy="-33" r="8"/><circle class="tool" cx="22" cy="-26" r="7"/></g>
        <g class="foot" transform="translate(220 276) rotate(15)"><ellipse class="tool" cx="0" cy="24" rx="25" ry="45"/><circle class="tool" cx="-19" cy="-23" r="8"/><circle class="tool" cx="-6" cy="-31" r="9"/><circle class="tool" cx="9" cy="-33" r="8"/><circle class="tool" cx="22" cy="-26" r="7"/></g>
      </g>
      <path class="trace-line palm draw-path" d="M355 259 C355 218 354 165 371 164 C388 163 388 215 389 224 C390 174 393 122 411 123 C429 124 422 195 425 217 C428 159 434 103 451 107 C470 112 457 190 460 220 C467 170 475 131 491 137 C509 145 489 215 493 239 C517 213 541 203 552 218 C565 238 523 274 507 301 C491 328 457 347 421 337 C383 326 356 297 355 259 Z"/>
      <path class="fine-line draw-path" d="M518 270 C585 247 625 241 683 237"/>
      <g class="hand hand-a" transform="translate(704 229) scale(.62)"><path class="trace-line" d="M-76 38 C-67 4 -60 -44 -43 -43 C-27 -42 -33 8 -31 17 C-25 -36 -14 -71 2 -65 C17 -59 4 -8 8 14 C18 -29 31 -52 44 -42 C57 -31 34 11 35 27 C55 3 72 -4 82 9 C94 27 57 51 45 70 C26 99 -25 101 -55 77 Z"/></g>
      <g class="hand hand-b" transform="translate(986 215) scale(.67)"><path class="trace-line" d="M-76 38 C-67 4 -60 -44 -43 -43 C-27 -42 -33 8 -31 17 C-25 -36 -14 -71 2 -65 C17 -59 4 -8 8 14 C18 -29 31 -52 44 -42 C57 -31 34 11 35 27 C55 3 72 -4 82 9 C94 27 57 51 45 70 C26 99 -25 101 -55 77 Z"/></g>
      <g class="hand hand-c" transform="translate(1282 210) scale(.72)"><path class="active-line" d="M-76 38 C-67 4 -60 -44 -43 -43 C-27 -42 -33 8 -31 17 C-25 -36 -14 -71 2 -65 C17 -59 4 -8 8 14 C18 -29 31 -52 44 -42 C57 -31 34 11 35 27 C55 3 72 -4 82 9 C94 27 57 51 45 70 C26 99 -25 101 -55 77 Z"/></g>
      <path class="active-line transfer draw-path" d="M733 222 C810 181 870 179 949 210 C1032 242 1118 251 1248 213"/>
      <g class="tool-token" transform="translate(714 216)"><path class="tool" d="M-25 7 L-7 -13 L22 -10 L30 4 L9 18 L-17 16 Z"/></g>
      <circle class="glow pulse" cx="1250" cy="213" r="10"/>
    </svg>

    <div class="k-process" aria-label="四阶段过程">
      <div class="axis"></div>
      <section class="step" data-state="past"><span class="step-no">01 · 可能</span><strong>身体打开可能</strong><em>可做之事改变</em></section>
      <div class="arw" aria-hidden="true"></div>
      <section class="step" data-state="past"><span class="step-no">02 · 动作</span><strong>手把动作做出来</strong><em>能力仍在个人身上</em></section>
      <div class="arw" aria-hidden="true"></div>
      <section class="step" data-state="past"><span class="step-no">03 · 传递</span><strong>他人能够接手</strong><em>同一做法被再现</em></section>
      <div class="arw" aria-hidden="true"></div>
      <section class="step" data-state="current"><span class="step-no">04 · 累积</span><strong>本事越过一生</strong><em>连接继续向后延伸</em></section>
    </div>
  </main>

  <section class="teaching-line" style="height:72px" aria-label="关键转折">
    <span class="mark">↳</span>
    <p>直立行走没有自动产生文明，它只是改变了可做之事。</p>
    <p>真正的换挡，是本事被别人接手，并在个人死亡之后继续存在。</p>
  </section>

  <footer class="handoff" style="height:92px">
    <p class="lead conclusion">身体给出新的可能，但跨世代累积才让可能变成文明。</p>
    <p class="question">下一问：直立行走和大脑明显扩张，究竟谁先出现？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
(function(){
  Deck.init({index:11,total:50});
  var paths=document.querySelectorAll('.draw-path');
  paths.forEach(function(p){var n=p.getTotalLength();p.style.strokeDasharray=n;p.style.strokeDashoffset=n;});
  if(Deck.reduced()){
    gsap.set(paths,{strokeDashoffset:0});
    gsap.set(['.foot','.palm','.hand','.tool-token','.pulse','.conclusion'],{opacity:1});
    return;
  }
  var tl=gsap.timeline({defaults:{ease:'power2.out'}});
  tl.addLabel('footprints',0)
    .fromTo('.foot',{opacity:0,scale:.8,transformOrigin:'center'},{opacity:1,scale:1,duration:.48,stagger:.28},'footprints')
    .to('.visual-chain .fine-line:first-child',{strokeDashoffset:0,duration:1.15},'footprints+=.15')
    .addLabel('palm','-=.15')
    .to('.palm',{strokeDashoffset:0,duration:1.05},'palm')
    .fromTo('.hand-a',{opacity:0},{opacity:1,duration:.35},'palm+=.55')
    .addLabel('passing')
    .to('.transfer',{strokeDashoffset:0,duration:1.7},'passing')
    .to('.tool-token',{x:536,duration:1.7,ease:'power1.inOut'},'passing')
    .fromTo('.hand-b',{opacity:0},{opacity:1,duration:.35},'passing+=.55')
    .fromTo('.hand-c',{opacity:0},{opacity:1,duration:.35},'passing+=1.15')
    .fromTo('.pulse',{opacity:0,scale:.3,transformOrigin:'center'},{opacity:1,scale:1,duration:.35},'passing+=1.5')
    .fromTo('.conclusion',{opacity:0,y:10},{opacity:1,y:0,duration:.6},'>-.05');
}());
</script>
</body>
</html>
