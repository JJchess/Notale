<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage::after{
      content:"";
      position:absolute;
      z-index:0;
      inset:0;
      background:linear-gradient(90deg,rgba(8,16,25,.88) 0%,rgba(8,16,25,.67) 48%,rgba(8,16,25,.18) 100%);
      pointer-events:none;
    }
    .kicker{
      color:var(--trace);
      font-size:var(--fs-label);
      font-weight:700;
      letter-spacing:.14em;
      line-height:1.35;
    }
    .comparison-wrap{
      display:flex;
      align-items:center;
      min-width:0;
      min-height:0;
    }
    .k-comparison{
      width:1100px;
      margin-left:220px;
      --compare-cols:2;
      background:rgba(8,16,25,.24);
    }
    .k-comparison > *{padding-top:15px;padding-bottom:15px}
    .k-comparison .hdr{font-size:var(--fs-body)}
    .k-comparison .hdr.trace-head{color:var(--trace)}
    .k-comparison .hdr.active-head{color:var(--active)}
    .k-comparison .cell{font-size:var(--fs-sec);line-height:1.5}
    .geometry{
      position:absolute;
      z-index:1;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
    }
    .base-line{
      stroke:var(--trace);
      stroke-width:2;
      fill:none;
      stroke-dasharray:640;
      stroke-dashoffset:640;
      animation:draw-line 1.25s .55s ease-out forwards;
    }
    .orbit-hint{
      stroke:var(--active);
      stroke-width:2;
      fill:none;
      stroke-dasharray:900;
      stroke-dashoffset:900;
      animation:draw-line 1.45s 1.35s ease-out forwards;
    }
    .arrival{opacity:0;transform:translateY(8px);animation:arrive .55s ease-out forwards}
    .arrival:nth-child(n){animation-delay:1.85s}
    .closing{
      max-width:950px;
      margin:0;
      color:var(--text);
      font-size:var(--fs-lead);
      line-height:1.5;
    }
    .handoff{
      margin:8px 0 0;
      color:var(--muted);
      font-size:var(--fs-sec);
      line-height:1.45;
    }
    @keyframes draw-line{to{stroke-dashoffset:0}}
    @keyframes arrive{to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){
      .base-line,.orbit-hint{animation:none;stroke-dashoffset:0}
      .arrival{animation:none;opacity:1;transform:none}
    }
  </style>
</head>
<body data-page="24" data-total="50">
  <div id="stage">
    <img class="backdrop" src="assets/img/earthrise-apollo8.jpg" alt="从月球附近回望悬在黑色太空中的地球" title="rocket propulsion, engine, usa, nasa, apollo program, rocket, space travel, technology, space · jensjunge · Pixabay (free)" style="opacity:.18;object-position:center 46%">

    <svg class="geometry" viewBox="0 0 1600 900" aria-hidden="true">
      <path class="base-line" d="M 60 684 L 650 684 Q 770 684 842 624"/>
      <path class="orbit-hint" d="M 842 624 Q 1080 424 1452 492"/>
    </svg>

    <header style="height:118px">
      <div class="kicker">III · 引力井</div>
      <h1 style="margin-top:8px">地球不是地板</h1>
    </header>

    <main class="comparison-wrap min0" style="flex:1">
      <section class="k-comparison arrival min0" aria-label="同一颗地球的两种空间模型">
        <div class="hdr" aria-hidden="true"><span style="display:block">同一对象</span><span style="display:block;color:var(--muted)">两种空间模型</span></div>
        <div class="hdr trace-head"><span style="display:block">站在地表</span><span style="display:block">局部经验</span></div>
        <div class="hdr active-head"><span style="display:block">从月球回望</span><span style="display:block">整体模型</span></div>

        <div class="rowline" aria-hidden="true"></div>
        <div class="dim">眼前形状</div>
        <div class="cell">地面像向四周延伸的平面</div>
        <div class="cell diff">地球是悬在黑空中的球体</div>

        <div class="rowline" aria-hidden="true"></div>
        <div class="dim">“向下”</div>
        <div class="cell">像一个固定方向</div>
        <div class="cell diff">各处都指向地球中心</div>

        <div class="rowline" aria-hidden="true"></div>
        <div class="dim">离地之后</div>
        <div class="cell">容易只问“飞多高”</div>
        <div class="cell diff">必须追问“怎样不落回表面”</div>
      </section>
    </main>

    <footer style="height:146px;display:flex;flex-direction:column;justify-content:flex-end">
      <p class="closing">从月球回望，地球不再像地板，而像一个必须持续绕行的球形引力井。</p>
      <p class="handoff" style="margin-bottom:0">地板是局部经验，球体才是航天必须采用的整体模型。</p>
      <p class="handoff">下一问：到了空间站高度，重力究竟还剩多少？</p>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>Deck.init({index:24,total:50});</script>
</body>
</html>
