<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .kicker{color:var(--trace);font:700 var(--fs-label)/1.3 var(--font-mono);letter-spacing:.12em}
    .step{padding:8px 16px 18px;text-align:center}
    .step b{display:block;font-size:var(--fs-body);line-height:1.35}
    .step span{display:block;margin-top:4px;color:var(--muted);font-size:var(--fs-sec);line-height:1.35}
    .work{display:flex;gap:24px;min-height:0}
    .sim{border:1px solid var(--line);border-radius:12px}
    .sim-label{position:absolute;z-index:2;font:650 var(--fs-sec)/1.35 var(--font-sans);pointer-events:none}
    .jet-label{left:11%;top:31%;color:var(--active)}
    .rocket-label{right:12%;top:31%;color:var(--active)}
    .vacuum{left:18px;top:16px;color:var(--muted)}
    .controls{display:flex;flex:0 0 410px;flex-direction:column;gap:14px;min-height:0}
    .controls .ctl{grid-template-columns:110px 1fr 92px;gap:12px}
    .readout{display:flex;align-items:baseline;gap:6px}
    .equation{padding-top:12px;border-top:1px solid var(--line);font-size:var(--fs-body);line-height:1.45}
    .momentum{color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
    .bottom{display:flex;align-items:center;justify-content:space-between;gap:28px;border-top:1px solid var(--line)}
    .bottom p{margin:0}
    .question{max-width:540px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body data-page="38" data-total="50">
  <div id="stage">
    <header style="height:76px">
      <div class="kicker">IV · MOMENTUM</div>
      <h1 style="margin:2px 0 0">向后抛，向前走</h1>
    </header>

    <section class="k-process" style="height:92px" aria-label="火箭反冲的三个步骤">
      <div class="step"><b>1　携带推进剂</b><span>质量流率 <span class="num" id="flowStep">50</span> kg/s</span></div>
      <div class="arw" aria-hidden="true"></div>
      <div class="step"><b>2　向后高速喷出</b><span>有效喷气速度 <span class="num" id="speedStep">3.00</span> km/s</span></div>
      <div class="arw" aria-hidden="true"></div>
      <div class="step" data-state="current"><b>3　获得向前推力</b><span><span class="num" id="thrustStep">150</span> kN</span></div>
      <div class="axis" aria-hidden="true"></div>
    </section>

    <main class="work min0" style="flex:1;padding:14px 0 16px">
      <figure class="cvbox sim min0 no-pan" style="flex:1;margin:0" aria-label="推进剂向左喷出，火箭向右反冲；两根等长箭头表示大小相等、方向相反的动量变化">
        <canvas id="sim" class="cv-fill" aria-hidden="true"></canvas>
        <div class="sim-label vacuum">真空反冲台 · 水平刻度轴</div>
        <div class="sim-label jet-label">喷流 ←</div>
        <div class="sim-label rocket-label">火箭 →</div>
      </figure>

      <aside class="panel controls min0" aria-label="反冲参数控制">
        <div>
          <div class="small">实时推力</div>
          <div class="readout" aria-live="polite"><span class="big" id="thrust">150</span><span class="unit">kN</span></div>
        </div>
        <label class="ctl">
          <span>质量流率</span>
          <input id="flow" type="range" min="10" max="100" step="1" value="50" aria-label="质量流率，千克每秒">
          <span><span class="num" id="flowOut">50</span> kg/s</span>
        </label>
        <label class="ctl">
          <span>喷气速度</span>
          <input id="speed" type="range" min="1" max="4.5" step="0.05" value="3" aria-label="有效喷气速度，千米每秒">
          <span><span class="num" id="speedOut">3.00</span> km/s</span>
        </label>
        <div class="equation"><b>推力 = 质量流率 × 喷气速度</b></div>
        <div class="momentum">每秒向后动量：<span class="num" id="momentum">150,000</span> kg·m/s<br>箭体获得等量、反向的动量。</div>
        <div class="legend" aria-label="方向图例">
          <span class="li"><i class="sw line" style="color:var(--active)"></i>两箭头同步伸缩</span>
          <span class="li"><i class="sw" style="color:var(--trace)"></i>箭体内推进剂</span>
        </div>
        <div class="hint">分别拖动两个滑块，比较“多抛”与“抛得更快”。</div>
        <div class="btns"><button class="btn" id="reset" type="button">复位并清空轨迹</button></div>
      </aside>
    </main>

    <footer class="bottom" style="height:100px">
      <p class="lead" style="max-width:860px">火箭能在真空中工作：它与自己喷出的推进剂互相施力，不需要尾焰推空气。</p>
      <p class="question">下一问：有了向前推力，怎样判断它是否足以让整枚火箭离开发射台？</p>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/matter.min.js"></script>
  <script>
  (()=>{
    Deck.init({index:38,total:50});
    const {Engine,Bodies,Body,Composite}=Matter;
    const engine=Engine.create({gravity:{x:0,y:0}});
    const cv=document.getElementById('sim');
    const flow=document.getElementById('flow'), speed=document.getElementById('speed');
    const els={thrust:document.getElementById('thrust'),flowOut:document.getElementById('flowOut'),speedOut:document.getElementById('speedOut'),momentum:document.getElementById('momentum'),flowStep:document.getElementById('flowStep'),speedStep:document.getElementById('speedStep'),thrustStep:document.getElementById('thrustStep')};
    let rocket, particles=[], trail=[], emitBank=0, elapsed=0, ctx;
    const state={flow:50,speed:3,thrust:150000,rocketX:0};

    function dimensions(){return {w:cv.clientWidth||1000,h:cv.clientHeight||500};}
    function build(){
      Composite.clear(engine.world,false); particles=[]; trail=[]; emitBank=0; elapsed=0;
      const d=dimensions(); state.rocketX=d.w*.64;
      rocket=Bodies.rectangle(state.rocketX,d.h*.56,210,74,{frictionAir:.035,inertia:Infinity,collisionFilter:{mask:0}});
      Composite.add(engine.world,rocket);
    }
    function calculate(){
      state.flow=Number(flow.value); state.speed=Number(speed.value);
      state.thrust=Lec.P.thrust(state.flow,state.speed*1000);
      const kn=state.thrust/1000;
      els.thrust.textContent=kn.toFixed(kn%1?1:0);
      els.flowOut.textContent=state.flow.toFixed(0); els.speedOut.textContent=state.speed.toFixed(2);
      els.momentum.textContent=Math.round(state.thrust).toLocaleString('en-US');
      els.flowStep.textContent=state.flow.toFixed(0); els.speedStep.textContent=state.speed.toFixed(2); els.thrustStep.textContent=kn.toFixed(kn%1?1:0);
      draw();
    }
    function emit(dt){
      const d=dimensions(), rate=state.flow*.22;
      emitBank+=rate*dt/1000;
      while(emitBank>=1 && particles.length<85){
        emitBank--;
        const i=particles.length;
        const p=Bodies.circle(rocket.position.x-116,rocket.position.y+((i%7)-3)*6,3+(i%3),{frictionAir:0,collisionFilter:{mask:0}});
        Body.setVelocity(p,{x:-(2.4+state.speed*1.25),y:((i%5)-2)*.08});
        Composite.add(engine.world,p); particles.push(p);
      }
      particles=particles.filter(p=>{if(p.position.x<-20){Composite.remove(engine.world,p);return false}return true});
    }
    function draw(){
      if(!ctx) ctx=Deck.fit(cv); else ctx=Deck.fit(cv);
      const d=dimensions(), w=d.w,h=d.h, active=Deck.token('--active'), trace=Deck.token('--trace'), text=Deck.token('--text');
      ctx.clearRect(0,0,w,h);
      const y=h*.76;
      ctx.strokeStyle=Deck.rgba('--text',.22);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(24,y);ctx.lineTo(w-24,y);ctx.stroke();
      for(let x=30;x<w-20;x+=36){ctx.beginPath();ctx.moveTo(x,y-5);ctx.lineTo(x,y+5);ctx.stroke()}
      ctx.strokeStyle=Deck.rgba('--trace',.28);ctx.lineWidth=2;ctx.beginPath();trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
      particles.forEach((p,i)=>{ctx.fillStyle=i%3?Deck.rgba('--active',.72):Deck.rgba('--trace',.78);ctx.beginPath();ctx.arc(p.position.x,p.position.y,p.circleRadius,0,Math.PI*2);ctx.fill()});
      const x=rocket.position.x, ry=rocket.position.y;
      ctx.save();ctx.translate(x,ry);
      ctx.fillStyle=Deck.rgba('--text',.12);ctx.strokeStyle=Deck.rgba('--text',.7);ctx.lineWidth=2;Deck.rr(ctx,-105,-37,190,74,14);ctx.fill();ctx.stroke();
      ctx.fillStyle=trace;Deck.rr(ctx,-72,-25,105,50,8);ctx.fill();
      ctx.beginPath();ctx.moveTo(85,-37);ctx.lineTo(122,0);ctx.lineTo(85,37);ctx.closePath();ctx.fillStyle=Deck.rgba('--text',.2);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(-105,-20);ctx.lineTo(-128,-34);ctx.lineTo(-121,0);ctx.lineTo(-128,34);ctx.lineTo(-105,20);ctx.closePath();ctx.fillStyle=Deck.rgba('--text',.16);ctx.fill();ctx.stroke();ctx.restore();
      const len=70+170*(state.thrust-10000)/440000;
      ctx.strokeStyle=active;ctx.fillStyle=active;ctx.lineWidth=5;
      Deck.arrow(ctx,x-135,ry-88,x-135-len,ry-88,13);ctx.stroke();ctx.fill();
      Deck.arrow(ctx,x+130,ry-88,x+130+len,ry-88,13);ctx.stroke();ctx.fill();
      ctx.strokeStyle=Deck.rgba('--active',.18);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x-135-len,ry-101);ctx.lineTo(x+130+len,ry-101);ctx.stroke();
    }
    function reset(){flow.value='50';speed.value='3';build();calculate()}
    flow.addEventListener('input',calculate);speed.addEventListener('input',calculate);document.getElementById('reset').addEventListener('click',reset);
    build();calculate();
    Deck.onResize(()=>{build();draw()});
    Deck.loop((t,dt)=>{
      if(dt){elapsed+=dt;emit(dt);Body.setVelocity(rocket,{x:.18+state.thrust/900000,y:0});Engine.update(engine,Math.min(dt,32));const d=dimensions();if(rocket.position.x>d.w*.84) Body.setPosition(rocket,{x:d.w*.64,y:d.h*.56});if(elapsed%90<dt)trail.push({x:rocket.position.x,y:rocket.position.y+d.h*.2});if(trail.length>45)trail.shift()}
      draw();
    },{still:1000});
  })();
  </script>
</body>
</html>
