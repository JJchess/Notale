<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .mass-svg{width:100%;height:100%}.mass-svg text{font-family:var(--font-mono);fill:var(--muted);font-size:13px}.mass-svg .axis line{stroke:var(--line)}
    .ledger-cell{min-height:158px;font-size:var(--fs-sec);line-height:1.45;display:flex;align-items:center;gap:12px}.dim .btn{margin-left:auto;flex:0 0 auto}.k-comparison:has(.ledger-details.open) .ledger-cell{min-height:92px}.ledger-name{font-weight:680}.ledger-details{grid-column:1/-1;padding:0!important;overflow:hidden;max-height:0;border-bottom:0!important;transition:max-height 320ms ease-out,opacity 220ms ease-out;opacity:0}.ledger-details.open{max-height:230px;opacity:1;border-bottom:1px solid var(--line-strong)!important}.refline{display:grid;grid-template-columns:1.2fr .7fr 2fr;gap:16px;padding:8px 18px;border-top:1px solid var(--line);font-size:16px;line-height:1.4}.refline:first-child{border-top:0}.refline [data-mass]{font-family:var(--font-mono)}
    .kicker{color:var(--trace);font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.16em}.footer-q{color:var(--muted);font-size:var(--fs-sec)}
    @media (prefers-reduced-motion:reduce){.ledger-details{transition:none!important}}
  </style>
</head>
<body data-page="42" data-total="50">
  <div id="stage">
    <img class="backdrop" src="assets/img/saturn-v-launch.jpg" alt="" title="Saturn V launch photograph · archival image">
    <header style="height:88px;display:flex;align-items:flex-start;justify-content:space-between">
      <div><div class="kicker">MASS LEDGER</div><h1 style="margin-top:5px">审核土星五号账本</h1></div>
      <div class="btns" style="padding-top:12px"><button class="btn" id="collapse" disabled>收起全部</button></div>
    </header>

    <main class="min0" style="flex:1;display:flex;gap:28px">
      <section class="min0" style="flex:0 0 520px;display:flex;flex-direction:column;gap:14px">
        <div class="cvbox" style="height:320px;border:1px solid var(--line-strong)">
          <img src="assets/img/saturn-v-launch.jpg" alt="土星五号发射" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28">
          <svg id="massChart" class="mass-svg" style="position:relative" role="img" aria-label="同一尺度的土星五号起飞质量、非奔月载荷质量与奔月载荷质量条"></svg>
        </div>
        <div class="panel q" style="flex:1;display:flex;flex-direction:column;justify-content:center">
          <div class="small">起飞质量中的奔月载荷</div>
          <div><span class="big sm" id="payloadPct"></span><span class="unit">%</span></div>
          <div class="legend" style="margin-top:18px">
            <span class="li" style="color:var(--trace)"><i class="sw"></i>推进剂、级段与结构等</span>
            <span class="li" style="color:var(--active)"><i class="sw"></i>奔月注入载荷</span>
          </div>
          <p class="hint" style="margin:18px 0 0">展开任一账目，在同一把质量尺上核对去向。</p>
        </div>
      </section>

      <section class="min0" style="flex:1;display:flex;flex-direction:column">
        <div class="k-comparison min0" style="--compare-cols:3;grid-template-columns:250px 140px 145px minmax(0,1fr)">
          <div class="hdr">账目</div><div class="hdr">质量</div><div class="hdr">占起飞质量</div><div class="hdr">去向</div>

          <div class="dim ledger-cell ledger-name">起飞总质量 <button class="btn toggle" data-key="total" aria-expanded="false">展开</button></div>
          <div class="ledger-cell"><span class="num" id="totalMass"></span><span class="unit">t</span></div>
          <div class="ledger-cell"><span class="num" id="totalPct"></span><span class="unit">%</span></div>
          <div class="ledger-cell">离开发射台</div>
          <div class="ledger-details" data-detail="total"></div>
          <div class="rowline"></div>

          <div class="dim ledger-cell ledger-name diff">奔月注入载荷 <button class="btn toggle" data-key="payload" aria-expanded="false">展开</button></div>
          <div class="ledger-cell diff"><span class="num" id="payloadMass"></span><span class="unit">t</span></div>
          <div class="ledger-cell diff"><span class="num" id="payloadPctCell"></span><span class="unit">%</span></div>
          <div class="ledger-cell diff">进入奔月轨道</div>
          <div class="ledger-details" data-detail="payload"></div>
          <div class="rowline"></div>

          <div class="dim ledger-cell ledger-name">未成为奔月载荷 <button class="btn toggle" data-key="other" aria-expanded="false">展开</button></div>
          <div class="ledger-cell"><span class="num" id="otherMass"></span><span class="unit">t</span></div>
          <div class="ledger-cell"><span class="num" id="otherPct"></span><span class="unit">%</span></div>
          <div class="ledger-cell">推进剂消耗；级段与结构被抛弃或留在此前轨迹</div>
          <div class="ledger-details" data-detail="other"></div>
        </div>
        <p class="note" style="margin:14px 0 0">级段数为约数；任务构型与统计边界不同，不能把它当作理想火箭方程的逐项实测验证。</p>
      </section>
    </main>

    <footer style="height:86px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line-strong);margin-top:14px">
      <p class="lead" style="margin:0;max-width:1060px">约 <span class="num" id="sumTotal"></span> 吨起飞质量，换来约 <span class="num" id="sumPayload"></span> 吨奔月载荷：每 100 kg 中只有约 <span class="num" id="perHundred"></span> kg 进入奔月轨道。</p>
      <div class="footer-q">下一页：一次性容器 → 长期居所</div>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
  (function(){
    Deck.init({index:42,total:50});
    var total=Lec.P.kilogramsFromTonnes(2970)/Lec.K.units.KILOGRAMS_PER_TONNE;
    var payload=Lec.P.kilogramsFromTonnes(48.6)/Lec.K.units.KILOGRAMS_PER_TONNE;
    var stages=[
      {name:'S-IC 一级',mass:Lec.P.kilogramsFromTonnes(2280)/Lec.K.units.KILOGRAMS_PER_TONNE,role:'穿过稠密大气并建立初始速度'},
      {name:'S-II 二级',mass:Lec.P.kilogramsFromTonnes(481)/Lec.K.units.KILOGRAMS_PER_TONNE,role:'继续加速并抬高轨迹'},
      {name:'S-IVB 三级',mass:Lec.P.kilogramsFromTonnes(119)/Lec.K.units.KILOGRAMS_PER_TONNE,role:'完成入轨与奔月注入'},
      {name:'仪器、接口、航天器及口径差',mass:Lec.P.kilogramsFromTonnes(90)/Lec.K.units.KILOGRAMS_PER_TONNE,role:'导航、连接、乘员与任务载荷'}
    ];
    var pct=Lec.P.percent(payload,total), other=total-payload, otherPct=Lec.P.percent(other,total);
    function put(id,v){document.getElementById(id).textContent=v}
    put('totalMass',total.toLocaleString('zh-CN')); put('totalPct',Lec.K.units.PERCENT_PER_WHOLE.toFixed(0));
    put('payloadMass',payload.toFixed(1)); put('payloadPct',pct.toFixed(2)); put('payloadPctCell',pct.toFixed(2));
    put('otherMass',other.toLocaleString('zh-CN',{minimumFractionDigits:1})); put('otherPct',otherPct.toFixed(2));
    put('sumTotal',total.toLocaleString('zh-CN'));put('sumPayload',payload.toFixed(1));put('perHundred',pct.toFixed(2));

    var detailHtml=stages.map(function(s){return '<div class="refline"><strong>'+s.name+'</strong><span data-mass>约 '+s.mass.toLocaleString('zh-CN')+' t</span><span>'+s.role+'</span></div>'}).join('');

    var svg=d3.select('#massChart'), W=420,H=248, x=d3.scaleLinear().domain([0,total]).range([24,396]);
    svg.attr('viewBox','0 0 '+W+' '+H);
    var axis=svg.append('g').attr('class','axis').attr('transform','translate(0,210)').call(d3.axisBottom(x).ticks(5).tickFormat(function(d){return d.toLocaleString('zh-CN')}));
    axis.select('.domain').attr('stroke','var(--line-strong)');
    var rows=[{key:'total',v:total,y:34},{key:'other',v:other,y:96},{key:'payload',v:payload,y:158}];
    svg.selectAll('.mbar').data(rows).join('rect').attr('class',function(d){return 'mbar bar-'+d.key}).attr('x',24).attr('y',function(d){return d.y}).attr('height',24).attr('rx',4).attr('width',Deck.reduced()?function(d){return x(d.v)-24}:0).attr('fill',function(d){return d.key==='payload'?'var(--active)':'var(--trace)'}).attr('opacity',function(d){return d.key==='other'?.72:.95});
    svg.selectAll('.mlabel').data(rows).join('text').attr('class','mlabel').attr('x',24).attr('y',function(d){return d.y-8}).text(function(d){return d.key==='total'?'起飞总质量':d.key==='other'?'未成为奔月载荷':'奔月注入载荷'});
    if(!Deck.reduced()) svg.selectAll('.mbar').transition().delay(function(d,i){return 180+i*110}).duration(780).ease(d3.easeCubicOut).attr('width',function(d){return x(d.v)-24});

    function setHighlight(key){
      svg.selectAll('.mbar').interrupt().transition().duration(180).attr('opacity',function(d){return d.key===key||key==='total'?.98:.25});
      var target=svg.select('.bar-'+key); if(!target.empty()&&!Deck.reduced()) target.transition().duration(170).attr('transform','translate(0,-3)').transition().duration(240).attr('transform','translate(0,0)');
    }
    var collapse=document.getElementById('collapse');
    document.querySelectorAll('.toggle').forEach(function(btn){btn.addEventListener('click',function(){
      var key=btn.dataset.key, detail=document.querySelector('[data-detail="'+key+'"]'), opening=!detail.classList.contains('open');
      document.querySelectorAll('.ledger-details').forEach(function(x){x.classList.remove('open')});
      document.querySelectorAll('.toggle').forEach(function(x){x.setAttribute('aria-expanded','false');x.textContent='展开'});
      document.querySelectorAll('.ledger-details').forEach(function(x){x.innerHTML=''});
      if(opening){detail.innerHTML=detailHtml;detail.classList.add('open');btn.setAttribute('aria-expanded','true');btn.textContent='收起';setHighlight(key)}else setHighlight('total');
      collapse.disabled=!document.querySelector('.ledger-details.open');
    })});
    collapse.addEventListener('click',function(){document.querySelectorAll('.ledger-details').forEach(function(x){x.classList.remove('open')});document.querySelectorAll('.toggle').forEach(function(x){x.setAttribute('aria-expanded','false');x.textContent='展开'});collapse.disabled=true;setHighlight('total')});
  })();
  </script>
</body>
</html>
