<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .kicker{color:var(--trace);font:700 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.16em}
    .plate{display:flex;gap:24px;min-height:0}
    .tree-side{flex:1.7;display:flex;flex-direction:column;min-width:0}
    .control-side{flex:.82;display:flex;flex-direction:column;gap:14px;min-width:0}
    #tree{width:100%;height:100%}
    #tree text{font-family:var(--font-sans);fill:var(--text)}
    #tree .sub{fill:var(--muted);font-size:16px}
    #tree .name{font-size:18px;font-weight:680}
    #tree .route{fill:none;stroke:var(--trace);stroke-width:3;transition:stroke 220ms ease,stroke-width 220ms ease}
    #tree .route.blocked{stroke:var(--active);stroke-width:4}
    #tree .nodebox{fill:var(--bg);stroke:var(--line-strong);stroke-width:1.5}
    #tree .stop{fill:var(--active);font-size:22px;font-weight:800;opacity:0;transition:opacity 180ms ease}
    #tree .stop.on{opacity:1}
    .choices{display:flex;flex-direction:column;gap:10px}
    .choices label{color:var(--muted);font-size:var(--fs-label)}
    .choices select{width:100%;min-height:54px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:9px;color:var(--text);background:var(--bg);font:500 var(--fs-sec)/1.4 var(--font-sans)}
    .selected-list{display:flex;flex-direction:column;gap:7px;margin-top:2px}
    .selected-list .it{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--text);font-size:var(--fs-sec);line-height:1.35}
    .selected-list button{border:0;color:var(--muted);background:transparent;font:600 var(--fs-sec)/1 var(--font-sans);cursor:pointer}
    .selected-list button:hover{color:var(--active)}
    .shell{position:absolute;inset:18px;border:1px solid var(--line);border-radius:18px;pointer-events:none}
    .shell::before,.shell::after{content:"";position:absolute;border:1px solid var(--line);border-radius:14px;inset:14px}
    .shell::after{inset:28px}
    .pulse{animation:pulse 420ms ease-out}
    .shake{animation:shake 260ms ease-out}
    @keyframes pulse{0%{filter:drop-shadow(0 0 0 var(--active))}45%{filter:drop-shadow(0 0 8px var(--active))}100%{filter:none}}
    @keyframes shake{25%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body data-page="44" data-total="50">
  <div id="stage">
    <header style="height:92px">
      <div class="kicker">FAULT TOLERANCE</div>
      <h1 style="margin:4px 0 0">可靠性不是复制粘贴</h1>
    </header>

    <main class="plate min0" style="flex:1">
      <section class="tree-side min0 k-classification" aria-labelledby="tree-title">
        <div class="box" style="height:100%;display:flex;flex-direction:column;padding:14px 16px">
          <div class="bt" id="tree-title" style="display:flex;justify-content:space-between;align-items:center;margin:0 0 6px">
            <span>顶层危险：异常未被安全处置</span>
            <span class="tag trace" id="topStatus">路径仍暴露</span>
          </div>
          <div class="lv min0" style="flex:1;padding-top:4px;padding-bottom:0">
            <div class="cvbox" style="height:100%">
              <div class="shell" aria-hidden="true"></div>
              <svg id="tree" role="img" aria-label="顶层危险向感知、判断、执行、条件四类失效路径分支；选择防线后线路显示为已阻断"></svg>
            </div>
          </div>
        </div>
      </section>

      <aside class="control-side min0">
        <section class="panel" style="height:112px;display:flex;align-items:center;justify-content:space-between">
          <div><div class="small">配置槽位</div><div class="hint">每项防线占一个槽位</div></div>
          <div class="big sm"><span id="used">0</span><span class="unit">/ <span id="capacity"></span></span></div>
        </section>

        <section class="box quiz min0" style="flex:1;padding:16px 18px">
          <div class="bt">候选防线</div>
          <div class="choices">
            <label for="candidate">选择一项加入；已加入的选项将被撤回</label>
            <select id="candidate" class="opt" aria-label="候选防线"></select>
          </div>
          <div class="selected-list lv" id="selected" aria-live="polite" style="margin-top:12px"></div>
          <div class="fb" id="feedback" aria-live="polite" style="margin-top:12px">四类失效路径尚未获得独立保护。</div>
        </section>

        <div class="btns" style="height:46px;justify-content:space-between">
          <div class="legend">
            <span class="li" style="color:var(--trace)"><i class="sw line"></i>暴露</span>
            <span class="li" style="color:var(--active)"><i class="sw line"></i>阻断</span>
          </div>
          <button class="btn" id="reset" type="button">复位配置</button>
        </div>
      </aside>
    </main>

    <footer style="height:96px;display:flex;align-items:center;justify-content:space-between;gap:36px">
      <p class="lead" style="margin:0;max-width:950px">航天可靠性来自独立、异构且分层的防线，而不是把同一种部件多装一份。</p>
      <p class="note" style="margin:0;max-width:470px">飞船到了地球另一侧，谁继续看见它、听见它并接手判断？</p>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
  (function(){
    Deck.init({index:44,total:50});
    const paths=[
      {id:'sense',name:'感知失效',fault:'单个读数错误或失联'},
      {id:'judge',name:'判断失效',fault:'单一判断链给出错误结论'},
      {id:'act',name:'执行失效',fault:'主飞行器无法继续安全飞行'},
      {id:'condition',name:'条件失效',fault:'不安全条件仍允许发射'}
    ];
    const defenses=[
      {id:'vote',label:'三传感器，多数表决',path:'sense'},
      {id:'computer',label:'独立飞行计算机',path:'judge'},
      {id:'ground',label:'地面独立复核',path:'judge'},
      {id:'escape',label:'独立逃逸系统',path:'act'},
      {id:'interlock',label:'程序化发射禁限与联锁',path:'condition'},
      {id:'powercopy',label:'同一电源上的第二传感器',pseudo:'共享电源，共因失效时会同时失效'},
      {id:'screencopy',label:'同一软件的第二块显示屏',pseudo:'共享软件，只会复制同一错误'}
    ];
    const capacity=paths.length+1;
    const selected=new Set();
    const sel=document.getElementById('candidate');
    sel.innerHTML='<option value="">— 选择候选防线 —</option>'+defenses.map(d=>`<option class="opt" value="${d.id}">${d.label}</option>`).join('');
    document.getElementById('capacity').textContent=capacity;

    const svg=d3.select('#tree').attr('viewBox','0 0 920 500').attr('preserveAspectRatio','xMidYMid meet');
    const root={x:460,y:54};
    const xs=[120,350,580,810];
    const routeG=svg.append('g');
    paths.forEach((p,i)=>{
      routeG.append('path').attr('class','route').attr('id','route-'+p.id)
        .attr('d',`M${root.x},102 V145 H${xs[i]} V214`);
      const g=svg.append('g').attr('transform',`translate(${xs[i]-96},214)`);
      g.append('rect').attr('class','nodebox').attr('width',192).attr('height',138).attr('rx',9);
      g.append('text').attr('class','name').attr('x',16).attr('y',34).text(p.name);
      const words=p.fault.length>13?[p.fault.slice(0,13),p.fault.slice(13)]:[p.fault];
      words.forEach((t,j)=>g.append('text').attr('class','sub').attr('x',16).attr('y',68+j*25).text(t));
      g.append('text').attr('class','stop').attr('id','stop-'+p.id).attr('x',160).attr('y',122).text('⊣');
    });
    const rg=svg.append('g').attr('transform','translate(292,28)');
    rg.append('rect').attr('class','nodebox').attr('width',336).attr('height',74).attr('rx',10);
    rg.append('text').attr('class','name').attr('x',168).attr('y',31).attr('text-anchor','middle').text('异常未被安全处置');
    rg.append('text').attr('class','sub').attr('x',168).attr('y',56).attr('text-anchor','middle').text('四类路径全部阻断，才完成配置');

    function coverage(id){return defenses.some(d=>d.path===id&&selected.has(d.id));}
    function update(last){
      const used=selected.size;
      document.getElementById('used').textContent=used;
      paths.forEach(p=>{
        const on=coverage(p.id);
        d3.select('#route-'+p.id).classed('blocked',on);
        d3.select('#stop-'+p.id).classed('on',on);
      });
      const missing=paths.filter(p=>!coverage(p.id));
      const status=document.getElementById('topStatus');
      status.textContent=missing.length?'路径仍暴露':'最小配置完成';
      status.className='tag '+(missing.length?'trace':'active');
      const list=document.getElementById('selected');
      list.innerHTML=selected.size?[...selected].map(id=>{const d=defenses.find(x=>x.id===id);return `<div class="it"><span>${d.label}</span><button type="button" data-remove="${id}" aria-label="撤回${d.label}">×</button></div>`}).join(''):'<div class="small">尚未布置防线</div>';
      list.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected.delete(b.dataset.remove);update();});
      const pseudo=last&&last.pseudo;
      document.getElementById('feedback').textContent=pseudo?last.pseudo:(missing.length?'仍暴露：'+missing.map(p=>p.name).join('、'):'四类路径均被阻断；判断路径由机上与地面两条独立来源保护。');
      [...sel.options].forEach(o=>{if(!o.value)return;o.disabled=used>=capacity&&!selected.has(o.value)});
      if(last){const target=document.querySelector('.control-side');target.classList.remove('pulse','shake');void target.offsetWidth;target.classList.add(last.pseudo?'shake':'pulse');}
    }
    sel.addEventListener('change',()=>{
      if(!sel.value)return;
      const d=defenses.find(x=>x.id===sel.value);
      if(selected.has(d.id))selected.delete(d.id); else if(selected.size<capacity)selected.add(d.id);
      update(d);sel.value='';
    });
    document.getElementById('reset').onclick=()=>{selected.clear();sel.value='';update();};
    update();

    if(!Deck.reduced()){
      svg.selectAll('.route').attr('stroke-dasharray',function(){return this.getTotalLength()}).attr('stroke-dashoffset',function(){return this.getTotalLength()})
        .transition().delay((d,i)=>180+i*110).duration(520).ease(d3.easeCubicOut).attr('stroke-dashoffset',0);
      svg.selectAll('.nodebox,.name,.sub').style('opacity',0).transition().delay((d,i)=>120+Math.min(i,12)*35).duration(400).style('opacity',1);
    }
  })();
  </script>
</body>
</html>
