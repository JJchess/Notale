<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .kicker{height:22px;color:var(--trace);font-size:var(--fs-label);font-weight:700;letter-spacing:.14em;line-height:1.35}
    .head{height:82px;display:flex;align-items:flex-start;justify-content:space-between}
    .head h1{margin:0}
    .head .lead{width:650px;margin:2px 0 0;padding-left:18px;border-left:2px solid var(--trace)}
    .bodybox{height:100%;display:flex;flex-direction:column;padding:14px 16px!important}
    .bodybox>.bt{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px!important}
    .classification-body{display:flex;flex:1;gap:22px;min-height:0}
    .human-zone{position:relative;flex:0 0 58%;min-height:0}
    .photo{position:absolute;inset:0 190px 0 150px;border:1px solid var(--line)}
    .photo img{width:100%;height:100%;object-fit:cover;filter:saturate(.72) contrast(1.04)}
    .photo:after{content:"共同环境：身体与飞船持续自由落体";position:absolute;left:14px;right:14px;bottom:12px;padding:8px 10px;background:var(--panel-fill);font-size:var(--fs-sec);line-height:1.4}
    .systems{position:absolute;inset:0;pointer-events:none}
    .systems .lv{position:absolute;width:145px;margin:0;padding:8px 0 8px 14px;pointer-events:auto;transition:border-color 180ms ease,opacity 180ms ease}
    .systems .lv:nth-child(1){left:0;top:7%}.systems .lv:nth-child(2){left:0;top:38%}.systems .lv:nth-child(3){right:0;top:15%}.systems .lv:nth-child(4){right:0;top:48%}.systems .lv:nth-child(5){right:0;top:77%}
    .systems .lv.on{border-left-color:var(--active)}
    .systems .btn{width:100%;padding:8px 12px;text-align:left}
    .wire{position:absolute;height:2px;background:var(--line-strong);transform-origin:0 50%;pointer-events:none;transition:background 180ms ease,opacity 180ms ease}
    .wire.on{background:var(--active);box-shadow:0 0 10px var(--active)}
    .diagnostic{flex:1;display:flex;flex-direction:column;min-width:0;padding-top:4px;border-top:1px solid var(--line)}
    .diag-top{height:88px;display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
    .diag-top h2{margin:0 0 6px}.diag-top p{margin:0}
    .chartwrap{position:relative;flex:1;min-height:0;border-left:2px solid var(--line-strong);padding-left:14px}
    #trend{width:100%;height:100%;overflow:visible}
    .diag-note{height:78px;margin:8px 0 0;padding:10px 0 0 14px;border-top:1px solid var(--line);font-size:var(--fs-sec);line-height:1.45}
    .footer{height:88px;display:flex;align-items:center;gap:28px;border-top:1px solid var(--line-strong)}
    .footer .lead{flex:1;margin:0}.next{width:460px;margin:0;padding-left:16px;border-left:2px solid var(--trace);color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
    .reset{font-size:var(--fs-sec)}
    .btn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body data-page="48" data-total="50">
  <div id="stage">
    <div class="kicker">EARTH, STILL INSIDE</div>
    <header class="head">
      <h1>诊断微重力身体</h1>
      <p class="lead">同一个环境不会让全身同步变化：先比较响应的快慢、方向与确定性。</p>
    </header>
    <main class="k-classification min0" style="flex:1">
      <section class="box bodybox min0">
        <div class="bt"><span>上位环境｜微重力身体</span><span class="tag trace">持续自由落体</span></div>
        <div class="classification-body min0">
          <div class="human-zone min0" id="humanZone">
            <figure class="cvbox photo" title="Iss073e0025371 (5-7-2025) --- NASA astronaut Nichole Ayers prepares to swap sample cassettes inside the Advanced Space Experiment Processor-4 (ADSEP-4).jpg · NASA Johnson Space Center · Public domain">
              <img src="assets/img/astronaut-microgravity.jpg" alt="国际空间站内漂浮工作的宇航员">
            </figure>
            <div class="systems btns" aria-label="身体系统">
              <div class="lv"><button class="btn" data-key="fluid" aria-pressed="true">体液</button></div>
              <div class="lv"><button class="btn" data-key="balance" aria-pressed="false">平衡</button></div>
              <div class="lv"><button class="btn" data-key="muscle" aria-pressed="false">肌肉</button></div>
              <div class="lv"><button class="btn" data-key="bone" aria-pressed="false">骨</button></div>
              <div class="lv"><button class="btn" data-key="vision" aria-pressed="false">视力</button></div>
            </div>
          </div>
          <section class="diagnostic min0" aria-live="polite">
            <div class="diag-top">
              <div><h2 id="diagTitle">体液｜头向转移</h2><p class="small" id="scaleText">首次明显：数小时—数天</p></div>
              <span class="tag active" id="stateTag">快速改变后趋稳</span>
            </div>
            <div class="chartwrap min0">
              <svg id="trend" role="img" aria-label="所选身体系统随时间变化的定性趋势"></svg>
            </div>
            <p class="diag-note" id="diagNote">失去日常上下方向的静水压力差，体液更多移向头部，可能出现面部浮肿感。</p>
          </section>
        </div>
        <div class="hint" style="height:34px">选择一个下位系统，沿共享时间轴比较变化；曲线表示趋势，不是统一剂量。</div>
      </section>
    </main>
    <footer class="footer">
      <p class="lead">漂浮是持续自由落体；骨、肌肉、体液、平衡与视力会以不同时间尺度适应或受损。</p>
      <p class="next">接下来：当空气、水、备件与地面即时帮助都受限时，乘员怎样维持整个系统？</p>
      <button class="btn reset" id="reset">复位</button>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
  (function(){
    Deck.init({index:48,total:50});
    var pct=Lec.K.units.PERCENT_PER_WHOLE, one=pct/pct, boneHigh=one+one/2;
    var data={
      fluid:{name:'体液｜头向转移',scale:'数小时—数天',tag:'快速改变后趋稳',note:'失去日常上下方向的静水压力差，体液更多移向头部，可能出现面部浮肿感。',pts:[[0,0],[1,72],[2,91],[3,87],[4,84]]},
      balance:{name:'平衡｜前庭线索冲突',scale:'数小时—数天',tag:'初期波动，数天适应',note:'内耳与视觉提供的方向线索一度冲突；大脑会重新加权线索，但返回重力环境还要再次适应。',pts:[[0,18],[1,88],[2,46],[3,60],[4,55]]},
      muscle:{name:'肌肉｜抗重力使用减少',scale:'数天—数周',tag:'随时间下降',note:'维持站立的抗重力肌不再持续工作。训练能部分补偿，但不会把环境负荷原样带回。',pts:[[0,86],[1,84],[2,69],[3,51],[4,34]]},
      bone:{name:'骨｜承重刺激减少',scale:'数周—数月',tag:'逐月累积',note:'未充分对抗训练时，承重骨骨密度约每月下降 '+one.toFixed(0)+'%–'+boneHigh.toFixed(1)+'%；骨位、任务与个体差异显著。',pts:[[0,88],[1,87],[2,81],[3,66],[4,48]]},
      vision:{name:'视力｜眼部改变',scale:'数周—数月',tag:'个体差异大',note:'部分乘员出现视觉与眼部改变；机制与程度并不一致，因此不画固定百分比。',pts:[[0,82],[1,82],[2,78],[3,68],[4,61]]}
    };
    var active='fluid', reduced=Deck.reduced();
    function wires(){
      var zone=document.getElementById('humanZone'); zone.querySelectorAll('.wire').forEach(function(n){n.remove()});
      var zr=zone.getBoundingClientRect(), pr=zone.querySelector('.photo').getBoundingClientRect();
      zone.querySelectorAll('.lv').forEach(function(lv){var r=lv.getBoundingClientRect(), left=r.left<pr.left, x=(left?r.right:r.left)-zr.left, y=r.top+r.height/2-zr.top, tx=(left?pr.left:pr.right)-zr.left, ty=pr.top+pr.height*.48-zr.top, dx=tx-x,dy=ty-y,w=document.createElement('span');w.className='wire'+(lv.classList.contains('on')?' on':'');w.style.left=x+'px';w.style.top=y+'px';w.style.width=Math.hypot(dx,dy)+'px';w.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';zone.appendChild(w)});
    }
    function draw(key,initial){
      active=key;var d=data[key];
      document.getElementById('diagTitle').textContent=d.name;document.getElementById('scaleText').textContent='首次明显：'+d.scale;document.getElementById('stateTag').textContent=d.tag;document.getElementById('diagNote').textContent=d.note;
      document.querySelectorAll('[data-key]').forEach(function(b){var on=b.dataset.key===key;b.setAttribute('aria-pressed',on);b.parentElement.classList.toggle('on',on)});wires();
      var svg=d3.select('#trend'),node=svg.node(),w=node.clientWidth||500,h=node.clientHeight||280,margin={top:18,right:18,bottom:48,left:48};svg.selectAll('*').remove();svg.attr('viewBox','0 0 '+w+' '+h);
      var x=d3.scalePoint().domain([0,1,2,3,4]).range([margin.left,w-margin.right]),y=d3.scaleLinear().domain([0,100]).range([h-margin.bottom,margin.top]);
      var labels=['起点','数小时','数天','数周','数月'];
      svg.append('line').attr('x1',margin.left).attr('x2',w-margin.right).attr('y1',h-margin.bottom).attr('y2',h-margin.bottom).attr('stroke','var(--line-strong)');
      svg.selectAll('.tickline').data(labels).join('g').attr('transform',function(_,i){return 'translate('+x(i)+','+(h-margin.bottom)+')'}).call(function(g){g.append('line').attr('y2',7).attr('stroke','var(--line-strong)');g.append('text').attr('y',29).attr('text-anchor','middle').attr('fill','var(--muted)').style('font-size','14px').text(function(v){return v})});
      svg.append('text').attr('x',margin.left).attr('y',14).attr('fill','var(--muted)').style('font-size','14px').text('相对变化（定性）');
      var line=d3.line().x(function(p,i){return x(i)}).y(function(p){return y(p[1])}).curve(d3.curveMonotoneX),path=svg.append('path').datum(d.pts).attr('d',line).attr('fill','none').attr('stroke','var(--active)').attr('stroke-width',4).attr('stroke-linecap','round');
      svg.selectAll('.dot').data(d.pts).join('circle').attr('cx',function(p,i){return x(i)}).attr('cy',function(p){return y(p[1])}).attr('r',5).attr('fill','var(--bg)').attr('stroke','var(--active)').attr('stroke-width',3);
      if(!reduced&&!initial){var len=path.node().getTotalLength();path.attr('stroke-dasharray',len+' '+len).attr('stroke-dashoffset',len).transition().duration(520).ease(d3.easeCubicOut).attr('stroke-dashoffset',0)}
    }
    document.querySelectorAll('[data-key]').forEach(function(b){b.addEventListener('click',function(){draw(b.dataset.key,false)})});
    document.getElementById('reset').addEventListener('click',function(){draw('fluid',false)});
    window.addEventListener('resize',function(){draw(active,true)});
    draw('fluid',true);
    if(!reduced){document.querySelector('.photo').animate([{opacity:0},{opacity:1}],{duration:500,easing:'ease-out'});document.querySelectorAll('.lv').forEach(function(n,i){n.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],{duration:360,delay:160+i*70,fill:'backwards',easing:'ease-out'})})}
  }());
  </script>
</body>
</html>
