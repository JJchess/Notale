<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .opening-kicker{margin:0 0 8px;color:var(--ochre);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:650;letter-spacing:.16em;line-height:1.35}
  .opening-title{margin:0;text-shadow:0 2px 14px var(--bg)}
  .opening-map{flex:none;width:min(1120px,82%);height:500px;margin:auto;align-self:center}
  .opening-map .claim{font-size:30px;text-align:center;text-shadow:0 2px 14px var(--bg);background:rgba(11,15,18,.54)}
  .opening-map .support{color:var(--text);font-size:20px;font-weight:650;text-align:center;text-shadow:0 2px 10px var(--bg)}
  .opening-close{align-self:center;width:min(1180px,86%);margin:0;padding:18px 0 6px;border-top:1px solid var(--line-strong);font-size:var(--fs-lead);line-height:1.5;text-align:center;text-shadow:0 2px 12px var(--bg)}
  #stage > .motif{position:absolute;z-index:0;top:150px;left:56px;width:1488px;height:600px;pointer-events:none;opacity:.35}
  .motif .earth{fill:none;stroke:var(--ochre);stroke-width:7;stroke-linecap:round;stroke-dasharray:2 32}
  .motif .orbit{fill:none;stroke:var(--cyan);stroke-width:2;stroke-linecap:round}
  @keyframes reveal-bg{from{opacity:.08}to{opacity:.18}}
  @keyframes reveal-claim{from{opacity:.45;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes grow-trunk{from{transform:scaleY(.08)}to{transform:scaleY(1)}}
  @keyframes spread-supports{from{clip-path:inset(0 46% 0 46%);opacity:.45}to{clip-path:inset(0);opacity:1}}
  @keyframes rise-close{from{opacity:.45;transform:translateY(12px)}to{opacity:1;transform:none}}
  .backdrop{opacity:0;animation:reveal-bg 1.5s ease-out forwards}
  .opening-map .claim{animation:reveal-claim .7s 1s ease-out both}
  .opening-map .trunk{transform-origin:top;animation:grow-trunk .65s 1.55s ease-out both}
  .opening-map .supports{animation:spread-supports .9s 2s ease-out both}
  .opening-close{animation:rise-close .7s 2.65s ease-out both}
  @media (prefers-reduced-motion:reduce){.backdrop,.opening-map .claim,.opening-map .trunk,.opening-map .supports,.opening-close{animation:none;opacity:1;transform:none;clip-path:none}.backdrop{opacity:.18}}
</style>
</head>
<body data-page="01" data-total="50">
<div id="stage">
  <img class="backdrop" src="assets/img/illus-savanna-threshold.png" alt="" title="生成插画（非真实照片）" style="opacity:.18;object-position:center">
  <svg class="motif" viewBox="0 0 1600 900" aria-hidden="true" style="position:absolute">
    <path class="earth" d="M95 774 C330 720 530 742 724 650"/>
    <path class="orbit" d="M724 650 C980 520 1175 280 1518 174"/>
    <path class="orbit" d="M1378 219 l46 -2 l-30 34"/>
  </svg>
  <header style="height:108px">
    <p class="opening-kicker"><span>FROM</span> <span>FOREST</span> <span>TO</span> <span>ORBIT</span></p>
    <h1 class="opening-title"><span>跨过身体</span><span>的边界</span></h1>
  </header>
  <main class="min0" style="display:flex;align-items:stretch">
    <section class="k-generalization opening-map min0" style="--support-n:3" aria-label="主张与三条支撑">
      <div class="claim"><span>人类的迁移史，</span><span>也是不断</span><span>跨越身体边界</span><span>的历史</span></div>
      <div class="trunk" aria-hidden="true"></div>
      <div class="supports min0">
        <div class="support min0"><span>身体</span><span>有承受范围</span></div>
        <div class="support min0"><span>环境</span><span>设下生存门槛</span></div>
        <div class="support min0"><span>适应可以</span><span>延伸到身体之外</span></div>
      </div>
    </section>
  </main>
  <footer style="height:92px;display:flex;align-items:flex-end">
    <p class="opening-close"><span>从脚印到轨道，</span><span>人类一直在</span><span>跨越身体原本</span><span>无法承受的</span><span>环境边界。</span></p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){Deck.init({index:1,total:50});});
</script>
</body>
</html>
