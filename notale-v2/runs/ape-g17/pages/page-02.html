<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="02" data-total="50">
<div id="stage">
  <style>
    .opening-kicker{color:var(--ochre);font-family:var(--font-mono);font-size:15px;line-height:1.35;font-weight:700;letter-spacing:.16em}
    .compare-wrap{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .k-comparison{grid-template-rows:auto repeat(5,1fr)}
    .k-comparison>.hdr,.k-comparison>.dim,.k-comparison>.cell{display:flex;align-items:center}
    .k-comparison>.hdr{position:relative;flex-direction:column;align-items:flex-start;justify-content:center;overflow:visible}
    .k-comparison>.hdr.bio-head{border-color:var(--ochre);box-shadow:inset 3px 0 0 rgba(197,106,50,.7)}
    .k-comparison>.cell.bio-cell{border-color:rgba(197,106,50,.55)}
    .park{position:absolute;right:10px;top:8px;max-width:190px;padding:3px 8px;border:1px solid currentColor;border-radius:999px;font-size:15px;line-height:1.35;font-weight:650;opacity:0;transform:translateY(-10px)}
    .park.on{opacity:1;transform:translateY(0);transition:opacity 240ms ease-out,transform 240ms ease-out}
    .compare-wrap.enter .hdr{animation:spread 620ms cubic-bezier(.2,.75,.25,1) both}
    .compare-wrap.enter .hdr:nth-of-type(3){animation-delay:70ms}.compare-wrap.enter .hdr:nth-of-type(4){animation-delay:140ms}
    .compare-wrap.enter .dim,.compare-wrap.enter .cell{animation:reveal 430ms ease-out both}
    .compare-wrap.enter .dim:nth-child(n+9),.compare-wrap.enter .cell:nth-child(n+9){animation-delay:100ms}
    .compare-wrap.enter .dim:nth-child(n+17),.compare-wrap.enter .cell:nth-child(n+17){animation-delay:180ms}
    .compare-wrap.enter .dim:nth-child(n+25),.compare-wrap.enter .cell:nth-child(n+25){animation-delay:260ms}
    @keyframes spread{from{opacity:0;transform:scaleX(.65)}to{opacity:1;transform:scaleX(1)}}
    @keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){.compare-wrap.enter *,.park.on{animation:none!important;transition:none!important}}
  </style>
  <header style="height:92px">
    <div class="opening-kicker">OPENING BET</div>
    <h1 style="margin-top:5px">生存能力，押在身体内还是身体外？</h1>
  </header>

  <main class="min0" style="display:flex;flex-direction:column;gap:14px">
    <section class="compare-wrap min0" style="flex:1;display:flex" aria-label="三种生存方案比较矩阵">
      <div class="k-comparison min0" style="--compare-n:3;width:100%">
        <div class="hdr dim" aria-hidden="true">共同维度</div>
        <div class="hdr bio-head" id="head-body"><span class="tag bio">身体内</span><strong>身体变化</strong><span class="park" id="park-body"></span></div>
        <div class="hdr" id="head-tool"><span class="tag neutral">身体外</span><strong>工具</strong><span class="park" id="park-tool"></span></div>
        <div class="hdr diff" id="head-system"><span class="tag active">闭合边界</span><strong>环境系统</strong><span class="park" id="park-system"></span></div>

        <div class="dim">改变什么</div><div class="cell bio-cell">遗传与生理结构</div><div class="cell">动作能力的外接部件</div><div class="cell diff">身体周围的空气、温度与压力</div>
        <div class="dim">多久起效</div><div class="cell bio-cell">多代筛选</div><div class="cell">制成并学会后</div><div class="cell diff">启动后立即维持</div>
        <div class="dim">保存在哪里</div><div class="cell bio-cell">种群中的身体</div><div class="cell">物件与使用知识</div><div class="cell diff">相互连接的设备与流程</div>
        <div class="dim">主要代价</div><div class="cell bio-cell">慢，且受既有身体限制</div><div class="cell">会损坏、遗失或用错</div><div class="cell diff">持续耗能，依赖维护</div>
        <div class="dim">典型押注</div><div class="cell bio-cell">寒冷中多代形成的体型与代谢差异</div><div class="cell">短时高原访问携带氧气</div><div class="cell diff">以压力壳隔绝真空</div>
      </div>
    </section>

    <survival-bet class="min0" style="height:178px;display:block"></survival-bet>
  </main>

  <footer style="height:60px;display:flex;align-items:center;justify-content:space-between;gap:28px">
    <p class="lead" style="margin:0">面对寒冷、缺氧与真空，身体变化、工具和环境系统是三种不同押注。</p>
    <p class="small" style="margin:0;text-align:right">同一种压力可以有多种解法；时间尺度决定谁先承担主要作用。</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
  class SurvivalBet extends HTMLElement{
    constructor(){
      super();
      this.attachShadow({mode:'open'});
      this.cards=[
        {name:'寒冷',condition:'稳定寒冷 · 几千代',target:'body',scale:'多代筛选',cost:'慢，且受既有身体限制'},
        {name:'缺氧',condition:'短时进入高原 · 数小时',target:'tool',scale:'制成并学会后',cost:'会损坏、遗失或用错'},
        {name:'真空',condition:'进入轨道舱外 · 数分钟',target:'system',scale:'启动后立即维持',cost:'持续耗能，依赖维护'}
      ];
      this.initial=()=>({index:0,selected:false,complete:false,trace:[]});
      this.state=this.initial();
    }
    connectedCallback(){this.render();this.start()}
    start(){this.dispatchEvent(new CustomEvent('game-start',{bubbles:true,composed:true,detail:{state:this.getState()}}))}
    reset(){this.state=this.initial();['body','tool','system'].forEach(k=>{const p=document.getElementById('park-'+k);p.textContent='';p.classList.remove('on');document.getElementById('head-'+k).classList.remove('chosen')});this.render();this.dispatchEvent(new CustomEvent('game-reset',{bubbles:true,composed:true}))}
    getState(){return JSON.parse(JSON.stringify(this.state))}
    chooseCard(){if(this.state.complete)return;this.state.selected=true;this.render()}
    bet(target){
      if(!this.state.selected||this.state.complete)return;
      const card=this.cards[this.state.index];
      if(target!==card.target){this.feedback='再看题干中的时间尺度。';this.shake=true;this.render();return}
      this.state.trace.push({card:card.name,target:target});
      const park=document.getElementById('park-'+target);park.textContent=card.name;park.classList.add('on');
      document.getElementById('head-'+target).classList.add('chosen');
      this.state.index++;this.state.selected=false;this.state.complete=this.state.index===this.cards.length;
      this.feedback=this.state.complete?'三种押注已归位：身体改变生命，工具扩展动作，系统维持可居住世界。':'押对了：'+card.scale+'；代价是'+card.cost+'。';
      this.shake=false;this.render();
      const detail={state:this.getState(),action:'bet',metrics:{placed:this.state.index,total:this.cards.length}};
      this.dispatchEvent(new CustomEvent(this.state.complete?'game-complete':'game-progress',{bubbles:true,composed:true,detail:this.state.complete?{score:this.state.index,metrics:detail.metrics,trace:this.state.trace}:detail}));
    }
    render(){
      const c=this.cards[Math.min(this.state.index,this.cards.length-1)];
      this.shadowRoot.innerHTML=`<style>
        :host{font-family:var(--font-sans);color:var(--text)}*{box-sizing:border-box}.panel{height:100%;padding:14px 18px;border:1px solid var(--line-strong);border-radius:12px;background:var(--panel);display:grid;grid-template-columns:360px 1fr 225px;gap:18px;align-items:center}.min0{min-width:0;min-height:0}.hint{color:var(--muted);font-size:15px;line-height:1.45}.hint:before{content:'›';color:var(--cyan);margin-right:.55em}.card{width:100%;min-height:68px;padding:9px 14px;border:1px solid var(--line-strong);border-radius:8px;background:transparent;color:var(--text);font:650 18px/1.35 var(--font-sans);text-align:left;cursor:pointer}.card[aria-pressed=true]{border-color:var(--cyan);box-shadow:inset 4px 0 0 var(--cyan);color:var(--cyan)}.card.shake{animation:shake 220ms ease-out}.condition{display:block;color:var(--muted);font-size:16px;font-weight:500}.btns{display:flex;gap:10px}.btn{min-height:48px;min-width:126px;padding:9px 14px;border:1px solid var(--line-strong);border-radius:8px;background:transparent;color:var(--text);font:650 16px/1.35 var(--font-sans);cursor:pointer}.btn:hover,.btn:focus-visible{border-color:var(--cyan);color:var(--cyan)}button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.bio{border-color:var(--ochre)}.active{border-color:var(--cyan)}.status{font-size:16px;line-height:1.45;color:var(--muted);min-height:48px}.count{font:650 40px/1.08 var(--font-mono);color:var(--text);white-space:nowrap}.reset{margin-top:5px}.done{color:var(--cyan)}@keyframes shake{25%{transform:translateX(-8px)}70%{transform:translateX(6px)}100%{transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style>
        <section class="panel" aria-label="生存方案下注游戏">
          <div class="min0"><div class="hint">点击极境卡，再选择主要承担者</div><button class="card ${this.shake?'shake':''}" ${this.state.complete?'disabled':''} aria-pressed="${this.state.selected}">${this.state.complete?'全部归位':c.name}<span class="condition">${this.state.complete?'可以重新下注':c.condition}</span></button></div>
          <div class="min0"><div class="btns" aria-label="选择主要承担者"><button class="btn bio" data-target="body">身体变化</button><button class="btn" data-target="tool">工具</button><button class="btn active" data-target="system">环境系统</button></div><div class="status ${this.state.complete?'done':''}" aria-live="polite">${this.feedback||'先从题干找时间尺度，再下注。'}</div></div>
          <div class="min0"><div class="count">已判断 ${this.state.index}/${this.cards.length}</div><button class="btn reset">重新下注</button></div>
        </section>`;
      this.shadowRoot.querySelector('.card').onclick=()=>this.chooseCard();
      this.shadowRoot.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>this.bet(b.dataset.target));
      this.shadowRoot.querySelector('.reset').onclick=()=>this.reset();
    }
  }
  customElements.define('survival-bet',SurvivalBet);
  requestAnimationFrame(()=>document.querySelector('.compare-wrap').classList.add('enter'));
});
</script>
</body>
</html>
