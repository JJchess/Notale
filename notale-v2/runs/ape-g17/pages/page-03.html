<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="03" data-total="50">
<div id="stage">
  <style>
    .route-head{display:flex;flex-direction:column;justify-content:center}
    .route-kicker{margin:0 0 8px;color:var(--ochre);font-family:var(--font-mono);font-size:var(--fs-label);line-height:1.35;letter-spacing:.12em}
    .route-head h1{margin:0}
    .route-main{display:flex;flex-direction:column;justify-content:center}
    .route-flow{position:relative;flex:0 0 410px;align-items:center;padding-top:44px}
    .route-flow>.axis{top:55%;height:4px;opacity:.72;background:linear-gradient(90deg,var(--ochre) 0%,var(--ochre) 39%,var(--cyan) 73%,var(--cyan) 100%);transform:scaleX(0);transform-origin:left center;animation:draw-axis 1.4s ease-out forwards}
    .route-flow>.step{display:flex;flex-direction:column;justify-content:flex-start;align-self:stretch;padding:72px 10px 18px;border-top:0;text-align:center;opacity:0;animation:arrive .45s ease-out forwards}
    .route-flow>.step.done{opacity:0;filter:saturate(.45);animation:arrive-done .45s ease-out .25s forwards}
    .route-flow>.step:nth-of-type(3){animation-delay:.52s}
    .route-flow>.step:nth-of-type(5){animation-delay:.79s}
    .route-flow>.step:nth-of-type(7){animation-delay:1.06s}
    .route-flow>.step:nth-of-type(9){animation-delay:1.33s}
    .route-flow>.step[aria-current="step"]{border-top:0;box-shadow:none}
    .route-flow>.arw{position:relative;z-index:2;align-self:center;margin-top:28px;opacity:0;animation:arrive .35s ease-out forwards}
    .route-flow>.arw:nth-of-type(4){animation-delay:.43s}.route-flow>.arw:nth-of-type(6){animation-delay:.70s}.route-flow>.arw:nth-of-type(8){animation-delay:.97s}.route-flow>.arw:nth-of-type(10){animation-delay:1.24s}
    .route-flow>.arw span{position:absolute;top:34px;width:96px;color:var(--muted);font-size:var(--fs-label);line-height:1.35;text-align:center}
    .route-node{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 20px;border:2px solid var(--line-strong);border-radius:50%;background:var(--bg);color:var(--muted);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700}
    .done .route-node{border-color:var(--ochre);color:var(--ochre)}
    [aria-current="step"] .route-node{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 7px rgba(69,214,232,.11)}
    .route-name{margin:0 0 9px;font-size:var(--fs-h2);line-height:1.35}
    .route-agent{min-height:52px;margin:0;color:var(--text);font-size:var(--fs-sec);line-height:1.45}
    .route-gate{margin:11px 0 0;color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
    .route-ground{position:absolute;right:0;bottom:0;left:0;height:142px;border-top:1px solid var(--line);opacity:.55;background:repeating-linear-gradient(0deg,transparent 0 15px,rgba(197,106,50,.18) 16px 18px)}
    .footprints{position:absolute;z-index:0;top:53%;left:1%;width:42%;height:18px;background:repeating-linear-gradient(90deg,var(--ochre) 0 16px,transparent 16px 34px);opacity:.9;transform:translateY(-50%)}
    .orbit{position:absolute;z-index:0;top:31%;right:0;width:42%;height:176px;border-top:3px solid var(--cyan);border-radius:50%;opacity:.62}
    .window{position:absolute;z-index:-1;top:-10px;right:0;width:1450px;height:430px;border:2px solid var(--cyan);border-radius:50% 0 0 50%;opacity:0;animation:photo-in .7s ease-out 1.5s forwards}
    .window::after{position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,rgba(11,15,18,.82) 34%,rgba(11,15,18,.18) 100%);content:""}
    .window img{width:100%;height:100%;object-fit:cover;object-position:center}
    .loop-ring{position:absolute;right:18px;bottom:40px;width:88px;height:88px;border:3px solid var(--cyan);border-left-color:transparent;border-radius:50%;opacity:0;animation:ring-in .65s ease-out 1.7s forwards}
    .loop-ring::after{position:absolute;right:-3px;bottom:7px;color:var(--cyan);content:"↻";font-size:var(--fs-h2)}
    .route-close{display:flex;align-items:flex-start;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px}
    .route-close p{margin:0}
    .route-summary{max-width:880px;font-size:var(--fs-lead);line-height:1.5;font-weight:650}
    .route-next{max-width:500px;padding-left:18px;border-left:2px solid var(--cyan);color:var(--muted);font-size:var(--fs-sec);line-height:1.5}
    @keyframes draw-axis{to{transform:scaleX(1)}}
    @keyframes arrive{to{opacity:1;transform:translateY(0)}}
    @keyframes arrive-done{to{opacity:.62;transform:translateY(0)}}
    @keyframes photo-in{to{opacity:.82}}
    @keyframes ring-in{to{opacity:.78;transform:rotate(1turn)}}
    @media (prefers-reduced-motion:reduce){.route-flow>.axis{animation:none;transform:scaleX(1)}.route-flow>.step,.route-flow>.step.done,.route-flow>.arw,.window,.loop-ring{animation:none;opacity:1}.route-flow>.step.done{opacity:.62}}
  </style>

  <header class="route-head" style="height:118px">
    <p class="route-kicker">ROUTE / 生命边界</p>
    <h1>这堂课将怎样从森林走到星空？</h1>
  </header>

  <main class="route-main min0">
    <div class="k-process route-flow min0" aria-label="生存能力从身体向技术系统扩展的五站路线">
      <div class="axis" aria-hidden="true"></div>
      <div class="footprints" aria-hidden="true"></div>
      <div class="orbit" aria-hidden="true"></div>
      <div class="route-ground" aria-hidden="true"></div>

      <section class="step done min0">
        <div class="route-node">BODY</div>
        <h2 class="route-name">身体</h2>
        <p class="route-agent">骨骼、步态、散热</p>
        <p class="route-gate">走出变化中的林地</p>
      </section>
      <div class="arw" aria-hidden="true"><span>身体内</span></div>

      <section class="step min0" aria-current="step">
        <div class="route-node">TOOL</div>
        <h2 class="route-name">石器</h2>
        <p class="route-agent">体外的刃与力量</p>
        <p class="route-gate">扩展取食能力</p>
      </section>
      <div class="arw" aria-hidden="true"><span>身体外</span></div>

      <section class="step min0">
        <div class="route-node">SHARE</div>
        <h2 class="route-name">文化</h2>
        <p class="route-agent">火、协作、教学</p>
        <p class="route-gate">保存群体经验</p>
      </section>
      <div class="arw" aria-hidden="true"><span>群体间</span></div>

      <section class="step min0">
        <div class="route-node">SUIT</div>
        <h2 class="route-name">宇航服</h2>
        <p class="route-agent">随身压力边界</p>
        <p class="route-gate">让身体进入真空</p>
      </section>
      <div class="arw" aria-hidden="true"><span>身体周围</span></div>

      <section class="step min0">
        <figure class="cvbox window" title="ISS-68 NASA astronaut Frank Rubio peers through a window in the cupola.jpg · NASA/Nicole Mann · Public domain">
          <img src="assets/img/iss-cupola.jpg" alt="宇航员从国际空间站穹顶舱望向窗外">
        </figure>
        <div class="route-node">LOOP</div>
        <h2 class="route-name">生命保障环</h2>
        <p class="route-agent">氧、水、热、废物系统</p>
        <p class="route-gate">维持一小块地球</p>
        <span class="loop-ring" aria-hidden="true"></span>
        <p class="small" style="margin:12px 0 0;color:var(--cyan)">系统循环</p>
      </section>
    </div>
  </main>

  <footer class="route-close" style="height:132px">
    <div>
      <p class="route-summary">路线依次穿过身体、石器、文化、宇航服与生命保障环。</p>
      <p class="small" style="margin-top:8px">这不是“越来越先进”的阶梯，而是生存能力不断外移、扩展并系统化。</p>
    </div>
    <p class="route-next">接下来先判断：真空、寒冷和食物短缺，能否归入几类共同压力？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){ Deck.init({index:3,total:50}); });
</script>
</body>
</html>
