<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="04" data-total="50">
<div id="stage">
  <style>
    .kicker{margin:0 0 3px;color:var(--cyan);font-family:var(--font-mono);font-size:15px;line-height:1.35;letter-spacing:.12em}
    .game-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
    .game-head h1{margin:0}
    pressure-sort-game{display:block;height:100%;min-height:0}
    .sort-layout{display:flex;height:100%;min-height:0;flex-direction:column;gap:14px}
    .waiting{display:flex;min-height:0;flex-direction:column;padding:14px 18px!important}
    .waiting-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:10px}
    .waiting-head .hint{margin:0;font-size:16px}
    .tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px 12px;min-height:0}
    .pressure-card{display:flex;align-items:center;justify-content:center;min-width:0;min-height:45px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);box-shadow:none;color:var(--text);font:650 16px/1.35 var(--font-sans);text-align:center;cursor:grab;touch-action:none;transition:transform 220ms ease-out,border-color 180ms ease-out,opacity 180ms ease-out}
    .pressure-card:hover,.pressure-card:focus-visible{border-color:var(--cyan)}
    .pressure-card.active{z-index:5;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(69,214,232,.16);cursor:grabbing}
    .pressure-card.returning{animation:return-shake 260ms ease-out}
    .need{color:var(--ochre)}
    .bins{display:flex;flex:1;min-height:0;gap:16px}
    .bin{display:flex;flex:1;min-width:0;flex-direction:column;transition:border-color 180ms ease-out,box-shadow 180ms ease-out,transform 500ms ease-out,opacity 500ms ease-out}
    .bin.panel{background:var(--panel);box-shadow:none}
    .bin.contact,.bin.pulse{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(69,214,232,.25),inset 0 0 28px rgba(69,214,232,.06)}
    .bin .tag{align-self:flex-start;margin-bottom:2px}
    .probe{margin:0 0 5px;padding:7px 9px;border-left:2px solid var(--line-strong);color:var(--text);font-size:16px;line-height:1.4}
    .bin .lv{display:flex;flex:1;min-height:128px;flex-direction:column;gap:7px;margin-top:5px!important;padding-top:7px!important}
    .bin .lv.panel{background:var(--panel);box-shadow:none}
    .bin .lv .pressure-card{min-height:40px;cursor:default}
    .slot{display:flex;align-items:center;justify-content:center;min-height:40px;border:1px dashed var(--line);border-radius:8px;background:color-mix(in srgb,var(--line-strong) 28%,transparent);color:var(--muted);font-size:15px;line-height:1.35}
    .criterion{min-height:50px;margin:8px 0 0;color:var(--muted);font-size:16px;line-height:1.4}
    .criterion.flash{color:var(--cyan)}
    .teaching-note{display:flex;align-items:center;justify-content:space-between;gap:28px}
    .teaching-note p{margin:0;font-size:16px;line-height:1.45}
    .result{color:var(--muted);font-size:16px;white-space:nowrap}
    .result strong{color:var(--cyan)}
    .closing{margin:0;padding:10px 16px;border-left:4px solid var(--line-strong);font-size:19px;line-height:1.45;transition:border-color 260ms ease-out,color 260ms ease-out}
    .closing.won{border-color:var(--cyan);color:var(--text);box-shadow:inset 16px 0 24px rgba(69,214,232,.05)}
    @keyframes return-shake{0%,100%{transform:translateX(0)}35%{transform:translateX(-9px)}70%{transform:translateX(6px)}}
    @media(prefers-reduced-motion:reduce){.pressure-card,.bin,.closing{transition:none!important}.pressure-card.returning{animation:none!important}}
  </style>
  <header class="game-head" style="height:74px">
    <div>
      <p class="kicker">EXTREME-PRESSURE MAP</p>
      <h1>先认出压力，再谈适应</h1>
    </div>
    <button class="btn" id="resetBtn" type="button">重新归仓</button>
  </header>

  <main class="min0" style="padding-top:12px">
    <pressure-sort-game id="game">
      <div class="sort-layout k-classification min0">
        <section class="panel q waiting" aria-label="待分情境" style="height:202px">
          <div class="waiting-head">
            <p class="hint">拖入归仓框；键盘可按 1、2、3 归入对应类别</p>
            <span class="tag neutral" id="progress">待归仓</span>
          </div>
          <div class="tray min0" id="tray"></div>
        </section>

        <section class="bins min0" aria-label="三类环境压力">
          <article class="box bin panel min0" data-bin="resource" tabindex="-1">
            <span class="tag neutral">类别 1</span><span class="bt">资源不足</span>
            <p class="probe">先问：生命所需还能持续得到吗？</p>
            <div class="lv panel" aria-label="已归入资源不足的情境"></div>
            <p class="criterion">生命必需物质或能量无法持续获得</p>
          </article>
          <article class="box bin panel min0" data-bin="physical" tabindex="-1">
            <span class="tag neutral">类别 2</span><span class="bt">物理伤害</span>
            <p class="probe">先问：外界正直接损伤组织吗？</p>
            <div class="lv panel" aria-label="已归入物理伤害的情境"></div>
            <p class="criterion">外界能量或物体直接损伤组织</p>
          </article>
          <article class="box bin panel min0" data-bin="imbalance" tabindex="-1">
            <span class="tag neutral">类别 3</span><span class="bt">生理失衡</span>
            <p class="probe">先问：环境与体内调节失配了吗？</p>
            <div class="lv panel" aria-label="已归入生理失衡的情境"></div>
            <p class="criterion">外界条件改变，使体内调节与负荷关系失配</p>
          </article>
        </section>

        <div class="teaching-note" style="height:50px">
          <p>同一环境可能引发多种后果，这里按最先出现的主导压力归仓。“缺氧”若来自<span class="need">氧气不可获得</span>，先归资源不足；昏迷是后果。</p>
          <span class="result" id="live" aria-live="polite">选择一张情境卡开始</span>
        </div>
      </div>
    </pressure-sort-game>
  </main>

  <footer style="height:72px;padding-top:12px">
    <p class="closing" id="closing">极端环境首先可分为资源不足、物理伤害与生理失衡三类压力。</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
class PressureSortGame extends HTMLElement{
  constructor(){
    super(); this.attachShadow({mode:'open'}).innerHTML='<slot></slot>';
    this.initialOrder=['radiation','water','gravity','debris','oxygen','rhythm','food','pressure','thermal'];
    this.items={
      water:{html:'可饮<span class="need">水</span>断供',label:'可饮水断供',bin:'resource'},
      food:{html:'可食<span class="need">能量</span>稀少',label:'可食能量稀少',bin:'resource'},
      oxygen:{html:'可呼吸<span class="need">氧</span>不足',label:'可呼吸氧不足',bin:'resource'},
      radiation:{html:'强辐射穿透',label:'强辐射穿透',bin:'physical'},
      thermal:{html:'极端热流或冷表面',label:'极端热流或冷表面',bin:'physical'},
      debris:{html:'尖石或高速碎屑撞击',label:'尖石或高速碎屑撞击',bin:'physical'},
      pressure:{html:'环境压力骤降',label:'环境压力骤降',bin:'imbalance'},
      gravity:{html:'长期微重力',label:'长期微重力',bin:'imbalance'},
      rhythm:{html:'昼夜节律被打乱',label:'昼夜节律被打乱',bin:'imbalance'}
    };
    this.state=this.fresh(); this.drag=null;
  }
  fresh(){return {placed:{},attempts:0,complete:false,trace:[]}}
  connectedCallback(){
    this.tray=this.querySelector('#tray'); this.live=this.querySelector('#live');
    this.progress=this.querySelector('#progress'); this.closing=document.querySelector('#closing');
    this.querySelectorAll('.bin').forEach((b,i)=>{b.style.opacity='0';b.style.transform='translateY(18px)';setTimeout(()=>{b.style.opacity='1';b.style.transform='none'},Deck.reduced()?0:i*80)});
    this.render(); this.start();
    this.onPointerMove=e=>this.move(e); this.onPointerUp=e=>this.drop(e);
    addEventListener('pointermove',this.onPointerMove); addEventListener('pointerup',this.onPointerUp);
  }
  disconnectedCallback(){removeEventListener('pointermove',this.onPointerMove);removeEventListener('pointerup',this.onPointerUp)}
  start(){this.dispatchEvent(new CustomEvent('game-start',{bubbles:true,composed:true,detail:{state:this.getState()}}))}
  reset(){this.state=this.fresh();this.render();this.dispatchEvent(new CustomEvent('game-reset',{bubbles:true,composed:true}))}
  getState(){return JSON.parse(JSON.stringify(this.state))}
  render(){
    this.querySelectorAll('.lv').forEach(x=>x.replaceChildren()); this.tray.replaceChildren();
    for(const id of this.initialOrder){
      const card=document.createElement('button'); card.type='button'; card.className='pressure-card panel'; card.dataset.id=id;
      card.innerHTML=this.items[id].html; card.setAttribute('aria-label',this.items[id].label+'，按数字键选择类别');
      card.addEventListener('pointerdown',e=>this.begin(e,card));
      card.addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key)){e.preventDefault();this.tryPlace(id,['resource','physical','imbalance'][+e.key-1],card)}});
      if(this.state.placed[id]){card.disabled=true;card.removeAttribute('aria-label');this.querySelector('[data-bin="'+this.state.placed[id]+'"] .lv').append(card)}else this.tray.append(card);
    }
    this.querySelectorAll('.bin').forEach(bin=>{const lv=bin.querySelector('.lv');for(let i=lv.children.length;i<3;i++){const slot=document.createElement('span');slot.className='slot panel';slot.textContent='按直接来源判断后拖入';slot.setAttribute('aria-hidden','true');lv.append(slot)}});
    const n=Object.keys(this.state.placed).length,total=this.initialOrder.length;
    this.progress.textContent=n===total?'全部归仓':'已归仓 '+n+' / '+total;
    this.progress.className='tag '+(n===total?'active':'neutral'); this.closing.classList.toggle('won',n===total);
  }
  begin(e,card){if(card.disabled)return;this.drag={card,id:card.dataset.id,x:e.clientX,y:e.clientY};card.classList.add('active');card.setPointerCapture?.(e.pointerId)}
  move(e){if(!this.drag)return;const dx=(e.clientX-this.drag.x)/Deck.s,dy=(e.clientY-this.drag.y)/Deck.s;this.drag.card.style.transform=`translate(${dx}px,${dy}px)`;this.querySelectorAll('.bin').forEach(b=>b.classList.toggle('contact',this.inside(e,b)))}
  inside(e,el){const r=el.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom}
  drop(e){if(!this.drag)return;const d=this.drag;const bin=[...this.querySelectorAll('.bin')].find(b=>this.inside(e,b));this.querySelectorAll('.bin').forEach(b=>b.classList.remove('contact'));d.card.style.transform='';d.card.classList.remove('active');this.drag=null;if(bin)this.tryPlace(d.id,bin.dataset.bin,d.card)}
  tryPlace(id,bin,card){
    this.state.attempts++; const correct=this.items[id].bin===bin; this.state.trace.push({id,bin,correct});
    if(correct){this.state.placed[id]=bin;const target=this.querySelector('[data-bin="'+bin+'"]');target.classList.add('pulse');setTimeout(()=>target.classList.remove('pulse'),Deck.reduced()?0:420);this.live.innerHTML='<strong>归仓正确</strong> · '+this.items[id].label;}
    else{const target=this.querySelector('[data-bin="'+bin+'"]');const c=target.querySelector('.criterion');c.classList.add('flash');card.classList.add('returning');setTimeout(()=>{c.classList.remove('flash');card.classList.remove('returning')},Deck.reduced()?0:700);this.live.textContent='再看判据：'+c.textContent;}
    const total=this.initialOrder.length;this.state.complete=Object.keys(this.state.placed).length===total;if(correct)this.render();
    this.dispatchEvent(new CustomEvent(this.state.complete?'game-complete':'game-progress',{bubbles:true,composed:true,detail:this.state.complete?{score:total,metrics:{attempts:this.state.attempts},trace:this.state.trace}:{state:this.getState(),action:{id,bin},metrics:{correct}}}));
    if(this.state.complete)this.live.innerHTML='<strong>归仓完成</strong> · 分类看压力来源，不看最终症状';
  }
}
customElements.define('pressure-sort-game',PressureSortGame);
document.addEventListener('DOMContentLoaded',()=>{Deck.init({index:4,total:50});document.querySelector('#resetBtn').addEventListener('click',()=>document.querySelector('#game').reset())});
</script>
</body>
</html>
