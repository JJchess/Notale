<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage>.scene-wash{position:absolute!important;inset:0;z-index:0;background:linear-gradient(180deg,rgba(11,15,18,.22) 0%,rgba(11,15,18,.46) 48%,rgba(11,15,18,.88) 100%);pointer-events:none}
  .kicker{margin:0 0 6px;color:var(--ochre);font-family:var(--font-mono);font-size:var(--fs-label);line-height:1.35;font-weight:700;letter-spacing:.12em}
  .scene-title{margin:0;text-shadow:0 2px 16px var(--bg)}
  #stage>.land-boundary{position:absolute!important;z-index:0;inset:125px 0 92px;width:100%;height:calc(100% - 217px);pointer-events:none;opacity:.55}
  .k-generalization>.claim{background:rgba(11,15,18,.62);text-shadow:0 1px 8px var(--bg)}
  .support{background:linear-gradient(180deg,rgba(11,15,18,.48),rgba(11,15,18,.72))}
  .support+.support{border-left:1px solid rgba(53,67,74,.7)}
  .support-label{display:block;margin-bottom:8px;color:var(--ochre);font-size:var(--fs-sec);line-height:1.35;font-weight:720;letter-spacing:.06em}
  .support strong{display:block;margin-bottom:7px;font-size:var(--fs-h2);line-height:1.35}
  .support p{margin:0;color:var(--text);font-size:var(--fs-body);line-height:1.5}
  .stratum{display:flex;gap:6px;height:7px;margin:18px 0 0}
  .stratum span{display:block;flex:1;border-radius:4px;background:var(--ochre);opacity:.48}
  .stratum span:nth-child(2){opacity:.72}.stratum span:nth-child(3){opacity:.3}
  .micro-row{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:var(--fs-label);line-height:1.35}
  .closing{margin:0;color:var(--text);font-size:var(--fs-lead);line-height:1.45;font-weight:680;text-shadow:0 2px 12px var(--bg)}
  .handoff{margin:5px 0 0;color:var(--muted);font-size:var(--fs-sec);line-height:1.45;text-shadow:0 2px 10px var(--bg)}
  @keyframes reveal-bg{from{opacity:0}to{opacity:.18}}
  @keyframes claim-in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  @keyframes trunk-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes branch-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .backdrop{opacity:.18;animation:reveal-bg .42s ease-out both}
  .claim{animation:claim-in .28s .36s ease-out both}
  .trunk{transform-origin:top;animation:trunk-grow .22s .58s ease-out both}
  .support{animation:branch-in .28s ease-out both}
  .support:nth-child(1){animation-delay:.76s}.support:nth-child(2){animation-delay:.9s}.support:nth-child(3){animation-delay:1.04s}
  @media(prefers-reduced-motion:reduce){.backdrop,.claim,.trunk,.support{animation:none!important}}
</style>
</head>
<body data-page="06" data-total="50">
<div id="stage">
  <img class="backdrop" src="assets/img/illus-savanna-threshold.png" alt="" title="生成插画（非真实照片）" style="opacity:.18">
  <div class="scene-wash" aria-hidden="true"></div>
  <svg class="land-boundary" viewBox="0 0 1600 600" preserveAspectRatio="none" aria-hidden="true">
    <path d="M35 410 C155 335 208 392 320 300 C430 210 532 330 638 252 C746 172 812 286 925 240 C1050 188 1135 252 1242 222 C1364 188 1450 214 1570 168 L1570 515 C1380 488 1250 520 1080 485 C900 448 770 512 590 466 C400 420 235 505 35 470 Z" fill="none" stroke="var(--cyan)" stroke-width="3"/>
  </svg>

  <header style="height:105px">
    <p class="kicker">II · BODY LEAVES THE FOREST</p>
    <h1 class="scene-title">第一站：变化的林地—草地镶嵌</h1>
  </header>

  <main class="k-generalization min0" style="--support-n:3">
    <div class="claim">不要把“走出森林”想成森林消失后，人类一次性踏入草原。更准确的起点，是不断伸缩的镶嵌环境。</div>
    <div class="trunk" aria-hidden="true"></div>
    <div class="supports min0">
      <section class="support min0">
        <span class="support-label">空间并置</span>
        <strong>多种斑块同场</strong>
        <p>林木、灌丛与开阔地同时存在。</p>
        <div class="stratum" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="micro-row"><span>林木</span><span>灌丛</span><span>开阔地</span></div>
      </section>
      <section class="support min0">
        <span class="support-label">边界交错</span>
        <strong>生存条件并不均匀</strong>
        <p>食物、水源、遮蔽与风险分布不均。</p>
        <div class="stratum" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="micro-row"><span>食物</span><span>水源</span><span>遮蔽</span></div>
      </section>
      <section class="support min0">
        <span class="support-label">时间变化</span>
        <strong>斑块会反复伸缩</strong>
        <p>湿润与干旱反复改变斑块范围。</p>
        <div class="stratum" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="micro-row"><span>湿润</span><span>过渡</span><span>干旱</span></div>
      </section>
    </div>
  </main>

  <footer style="height:110px;padding-top:16px">
    <p class="closing">第一站不是开阔草原神话，而是不断变化的林地—草地镶嵌环境。</p>
    <p class="handoff">我们凭什么知道数百万年前的环境曾这样变化？下一页去看留下来的证据。</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){Deck.init({index:6,total:50});});
</script>
</body>
</html>
