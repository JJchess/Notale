<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="07" data-total="50">
<div id="stage">
  <style>
    .kicker{height:24px;color:var(--ochre);font-size:var(--fs-label);line-height:1.35;font-weight:700;letter-spacing:.12em}
    .site-photo{width:100%;height:100%;object-fit:cover;object-position:center}
    .photo-shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(11,15,18,.92) 100%);pointer-events:none}
    .photo-label{position:absolute;left:24px;right:24px;bottom:22px;font-size:var(--fs-sec);line-height:1.5;color:var(--text)}
    .evidence-root{position:relative;height:100%}
    .branch-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
    .evidence-list{position:relative;z-index:1}
    .evidence-item{display:flex;align-items:center;justify-content:space-between;min-height:54px;transition:border-color 220ms ease-out,color 220ms ease-out,transform 220ms ease-out}
    .evidence-item.active{border-left-color:var(--cyan);color:var(--cyan);transform:translateX(4px)}
    .evidence-item .tag{margin-left:12px}
    .panel-line{display:flex;align-items:flex-start;gap:14px;margin:0 0 10px;font-size:var(--fs-sec);line-height:1.5}
    .panel-line:last-child{margin-bottom:0}
    .panel-key{flex:0 0 86px;color:var(--muted);font-weight:650}
    .panel-value{flex:1;min-width:0}
    .panel-swap{animation:swapIn 240ms ease-out}
    @keyframes swapIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .enter{opacity:0;transform:translateY(14px);animation:enter 520ms ease-out forwards}
    @keyframes enter{to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.enter{opacity:1;transform:none;animation:none}.evidence-item,.panel-swap{transition:none;animation:none}}
  </style>
  <div class="kicker">ACT II · READING THE GROUND</div>
  <header style="height:72px;display:flex;align-items:flex-start;justify-content:space-between;gap:28px">
    <h1 style="margin:0">遗址如何留下环境证据？</h1>
    <p class="lead" style="width:610px;margin:2px 0 0">环境本身通常没有被完整保存，研究者读取的是不同的代理证据。</p>
  </header>

  <main style="display:flex;gap:34px;padding:8px 0 12px">
    <section class="min0 enter" style="flex:0 0 42%;animation-delay:80ms" aria-label="奥杜威峡谷遗址照片">
      <figure class="cvbox" style="height:100%;margin:0;border:1px solid var(--line)" title="Olduvai-Schlucht Mike Krüger 110126 1.jpg · Mike Krüger · CC BY-SA 4.0">
        <img class="site-photo" src="assets/img/olduvai-gorge.jpg" alt="奥杜威峡谷裸露的沉积地层">
        <div class="photo-shade"></div>
        <figcaption class="photo-label"><span class="tag bio">具体遗址</span><br><strong style="font-size:var(--fs-h2)">奥杜威峡谷</strong><br><span style="color:var(--muted)">裸露地层是局部记录，不是整个非洲的缩影。</span></figcaption>
      </figure>
    </section>

    <section class="min0 k-classification enter" style="flex:1;animation-delay:170ms" aria-label="环境证据分类">
      <div class="box evidence-root min0">
        <span class="bt">环境变化证据 <span class="tag neutral">上位项</span></span>
        <p class="small" style="margin:0 0 4px">遗址中保存的多种代理记录，只给出过去环境的局部线索。</p>
        <svg id="branches" class="branch-svg" aria-hidden="true"></svg>
        <div class="lv evidence-list" id="evidenceList">
          <div class="lv evidence-item active" data-key="strata"><strong>地层</strong><span class="tag active">沉积次序</span></div>
          <div class="lv evidence-item" data-key="fauna"><strong>动物群</strong><span class="tag neutral">化石组合</span></div>
          <div class="lv evidence-item" data-key="pollen"><strong>花粉</strong><span class="tag neutral">植物微粒</span></div>
          <div class="lv evidence-item" data-key="isotope"><strong>稳定同位素</strong><span class="tag neutral">化学比例</span></div>
        </div>
        <div class="btns" style="gap:10px;margin:10px 0 8px" aria-label="切换证据类别">
          <button class="btn" data-key="strata" aria-pressed="true">地层</button>
          <button class="btn" data-key="fauna" aria-pressed="false">动物群</button>
          <button class="btn" data-key="pollen" aria-pressed="false">花粉</button>
          <button class="btn" data-key="isotope" aria-pressed="false">稳定同位素</button>
          <button class="btn" id="reset" type="button">复位</button>
        </div>
        <p class="hint" style="margin:0 0 8px">点选一类，比较它看见什么、能推断什么，以及证据边界。</p>
        <div class="panel" id="detail" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer style="height:74px;display:flex;align-items:center;justify-content:space-between;gap:32px;border-top:1px solid var(--line)">
    <p class="lead" style="margin:0">地层、动物群、花粉与同位素分别提供环境变化的不同证据。</p>
    <p class="small" style="width:520px;margin:0">四类各有保存、搬运和解释限制；可信判断来自交叉印证。沿时间排开后，会是稳定背景，还是反复波动？</p>
  </footer>
  <script src="assets/lib/d3.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function(){
    Deck.init({index:7,total:50});
    const data={
      strata:{seen:'沉积层次、颗粒与火山灰层',infer:'先后关系、沉积环境与年代框架',limit:'不能独自还原当时全部植被和动物'},
      fauna:{seen:'不同层位的动物化石组合',infer:'栖息地、水源与群落更替',limit:'不能假定每种动物都生活在发现原地'},
      pollen:{seen:'沉积物中保存的植物花粉',infer:'周边植被与湿润程度',limit:'不能定位一株植物的精确生长位置'},
      isotope:{seen:'土壤碳酸盐或牙釉质中的同位素比例',infer:'植被类型、食物来源或水分条件',limit:'不是脱离模型就能直读的气候数值'}
    };
    let current='strata';
    const root=document.querySelector('.evidence-root');
    const items=[...document.querySelectorAll('.evidence-item')];
    const detail=document.getElementById('detail');
    function drawBranches(){
      const rr=root.getBoundingClientRect();
      const w=root.clientWidth,h=root.clientHeight;
      const svg=d3.select('#branches').attr('viewBox',`0 0 ${w} ${h}`);
      const points=items.map(el=>{const r=el.getBoundingClientRect();return {key:el.dataset.key,y:(r.top-rr.top+r.height/2)*(h/rr.height)}});
      const x0=18,x1=42, y0=76;
      const paths=svg.selectAll('path').data(points,d=>d.key).join('path')
        .attr('fill','none').attr('stroke-width',d=>d.key===current?3:1.5)
        .attr('stroke',d=>d.key===current?'var(--cyan)':'var(--ochre)')
        .attr('opacity',d=>d.key===current?1:.42)
        .attr('d',d=>`M${x0},${y0} V${d.y} H${x1}`);
      if(!Deck.reduced()) paths.filter(d=>d.key===current).attr('stroke-dasharray','80').attr('stroke-dashoffset','80').transition().duration(260).ease(d3.easeCubicOut).attr('stroke-dashoffset','0');
    }
    function select(key){
      current=key;
      items.forEach(el=>{const on=el.dataset.key===key;el.classList.toggle('active',on);const tag=el.querySelector('.tag');tag.className='tag '+(on?'active':'neutral');});
      document.querySelectorAll('.btn[data-key]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.key===key)));
      const d=data[key];
      detail.innerHTML=`<div class="panel-swap"><p class="panel-line"><span class="panel-key">看见什么</span><span class="panel-value">${d.seen}</span></p><p class="panel-line"><span class="panel-key">能推断</span><span class="panel-value">${d.infer}</span></p><p class="panel-line"><span class="panel-key">证据边界</span><span class="panel-value">${d.limit}</span></p></div>`;
      drawBranches();
    }
    document.querySelectorAll('.btn[data-key]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.key)));
    document.getElementById('reset').addEventListener('click',()=>select('strata'));
    const off=Deck.onResize(drawBranches);
    window.addEventListener('pagehide',off,{once:true});
    select('strata');
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
