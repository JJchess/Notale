<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="14" data-total="50">
  <div id="stage">
    <style>
      .strata{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.18;background:repeating-linear-gradient(0deg,transparent 0,transparent 88px,var(--line) 89px,transparent 90px)}
      .evidence-row{display:flex;gap:18px;min-height:0;flex:1}
      .evidence{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;border-color:var(--ochre)!important}
      .evidence .bt{color:var(--ochre)!important}
      .signal{font-size:var(--fs-sec);line-height:1.45;color:var(--text)}
      .label{display:block;margin-bottom:4px;color:var(--muted);font-size:var(--fs-label);line-height:1.35}
      .slot{position:relative;min-height:58px;margin-top:auto;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:8px;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
      .slot.hot{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(69,214,232,.16)}
      .slot.bad{border-color:var(--cyan);animation:nudge .24s ease 2}
      .slot .placed{color:var(--cyan);font-weight:650}
      .timescale{display:none;margin-top:7px;color:var(--muted);font-size:var(--fs-label);line-height:1.35}
      .slot.filled .timescale{display:block}
      #links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
      .menu{display:flex;flex-direction:row!important;gap:10px;align-items:stretch;min-height:0}
      .menu .opt{flex:1;min-width:0;cursor:grab;touch-action:none;text-align:center!important;padding:9px 10px!important}
      .menu .opt.dragging{position:relative;z-index:4;color:var(--cyan);border-color:var(--cyan);cursor:grabbing}
      .menu .opt.used{visibility:hidden}
      .status{min-width:240px;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
      @keyframes nudge{50%{transform:translateX(6px)}}
      @media(prefers-reduced-motion:reduce){.slot.bad{animation:none}.evidence,.menu{transition:none!important}}
    </style>
    <div class="strata" aria-hidden="true"></div>
    <header style="height:88px">
      <div class="tag bio" style="margin-bottom:6px">DIET EVIDENCE</div>
      <h1>牙齿不能直接告诉我们吃了什么</h1>
    </header>
    <main class="k-classification min0" style="gap:12px">
      <section class="box min0" style="display:flex;flex:1;flex-direction:column;padding:14px 16px">
        <span class="bt" style="margin-bottom:8px">饮食证据</span>
        <div id="evidenceRow" class="lv evidence-row min0" style="margin-top:0">
          <article class="box evidence min0" data-kind="shape">
            <span class="bt">牙齿形态</span>
            <div class="lv signal"><span class="label">观察信号</span>低而宽的臼齿、较厚牙釉质</div>
            <div class="lv" style="display:flex;flex:1;flex-direction:column"><span class="label">最多能说</span><div class="slot" data-kind="shape" tabindex="0" role="button" aria-label="牙齿形态归仓槽"><span class="empty">拖到这里</span><div class="timescale">能力边界：能处理，不等于经常吃。</div></div></div>
          </article>
          <article class="box evidence min0" data-kind="wear">
            <span class="bt">牙齿磨耗</span>
            <div class="lv signal"><span class="label">观察信号</span>细划痕较多、凹坑较少</div>
            <div class="lv" style="display:flex;flex:1;flex-direction:column"><span class="label">最多能说</span><div class="slot" data-kind="wear" tabindex="0" role="button" aria-label="牙齿磨耗归仓槽"><span class="empty">拖到这里</span><div class="timescale">时间窗口：记录较短时期的处理方式。</div></div></div>
          </article>
          <article class="box evidence min0" data-kind="iso">
            <span class="bt">稳定同位素</span>
            <div class="lv signal"><span class="label">观察信号</span>牙釉质碳同位素显示 C3 来源占主导</div>
            <div class="lv" style="display:flex;flex:1;flex-direction:column"><span class="label">最多能说</span><div class="slot" data-kind="iso" tabindex="0" role="button" aria-label="稳定同位素归仓槽"><span class="empty">拖到这里</span><div class="timescale">时间窗口：牙齿形成期；只到资源类别。</div></div></div>
          </article>
          <svg id="links" aria-hidden="true"></svg>
        </div>
      </section>
      <div style="height:120px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:18px">
          <div class="hint">拖动菜单卡；键盘可先选卡，再在证据槽按 Enter。</div>
          <div class="status" id="status" aria-live="polite">已归仓 0 / 3</div>
          <button class="btn" id="reset">重新配菜单</button>
        </div>
        <div class="quiz menu min0" id="menu">
          <button class="opt" draggable="true" data-kind="shape">能处理硬脆食物</button>
          <button class="opt" draggable="true" data-kind="wear">近期常处理韧性食物</button>
          <button class="opt" draggable="true" data-kind="iso">长期以 C3 来源为主</button>
          <button class="opt" draggable="true" data-kind="wrong">经常吃坚果</button>
          <button class="opt" draggable="true" data-kind="wrong">一生只吃叶片</button>
          <button class="opt" draggable="true" data-kind="wrong">吃的是无花果</button>
        </div>
        <div class="fb" id="feedback">牙齿形态是能力边界，不是菜单记录。</div>
      </div>
    </main>
    <footer class="lead" style="height:62px;display:flex;align-items:flex-end;border-top:1px solid var(--line);padding-top:10px">牙形提示“能处理什么”，磨耗提示“近期怎样处理”，同位素提示“长期来自哪类资源”；三者都不能指定一道食物。</footer>
    <script src="assets/lib/d3.min.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded',function(){
      Deck.init({index:14,total:50});
      const cards=[...document.querySelectorAll('.menu .opt')], slots=[...document.querySelectorAll('.slot')];
      const status=document.getElementById('status'), feedback=document.getElementById('feedback');
      let selected=null, placed=new Map(), drag=null;
      function snapshot(){return {placed:[...placed.keys()],complete:placed.size===3};}
      function report(action){window.dispatchEvent(new CustomEvent(placed.size===3?'game-complete':'game-progress',{bubbles:true,detail:{state:snapshot(),action:action,metrics:{placed:placed.size}}}));}
      function draw(){
        const host=document.getElementById('evidenceRow'), r=host.getBoundingClientRect(), svg=d3.select('#links');
        svg.attr('viewBox',`0 0 ${r.width} ${r.height}`).selectAll('*').remove();
        const data=slots.filter(s=>s.classList.contains('filled')).map(s=>{const q=s.getBoundingClientRect();return{x1:q.left-r.left+q.width/2,y1:q.top-r.top-8,x2:q.left-r.left+q.width/2,y2:q.top-r.top+5};});
        svg.selectAll('path').data(data).join('path').attr('d',d=>`M${d.x1},${d.y1}V${d.y2}`).attr('stroke','var(--cyan)').attr('stroke-width',3).attr('fill','none');
      }
      function attempt(card,slot){
        if(!card||card.classList.contains('used'))return;
        if(card.dataset.kind===slot.dataset.kind&&!placed.has(slot.dataset.kind)){
          placed.set(slot.dataset.kind,card.textContent); slot.classList.add('filled');
          slot.querySelector('.empty').innerHTML='<span class="placed">'+card.textContent+'</span>'; card.classList.add('used'); card.setAttribute('aria-pressed','false'); selected=null;
          feedback.textContent=placed.size===3?'归仓完成：支持食物性质或来源，不等于认出具体食物。':'这项推断没有超过证据的分辨能力。';
          status.textContent='已归仓 '+placed.size+' / 3'; draw(); report('place');
        }else{
          slot.classList.remove('bad'); void slot.offsetWidth; slot.classList.add('bad');
          feedback.textContent='证据粒度不够：不能据此指定这道食物。'; report('reject');
        }
      }
      cards.forEach(card=>{
        card.addEventListener('click',()=>{cards.forEach(c=>c.setAttribute('aria-pressed','false'));selected=card;card.setAttribute('aria-pressed','true');feedback.textContent='已选择“'+card.textContent+'”，请选择一个证据槽。';});
        card.addEventListener('dragstart',e=>{drag=card;e.dataTransfer.setData('text/plain',card.textContent);card.classList.add('dragging');});
        card.addEventListener('dragend',()=>{card.classList.remove('dragging');drag=null;slots.forEach(s=>s.classList.remove('hot'));});
      });
      slots.forEach(slot=>{
        slot.addEventListener('dragover',e=>{e.preventDefault();slot.classList.add('hot');});
        slot.addEventListener('dragleave',()=>slot.classList.remove('hot'));
        slot.addEventListener('drop',e=>{e.preventDefault();slot.classList.remove('hot');attempt(drag,slot);});
        slot.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&selected){e.preventDefault();attempt(selected,slot);}});
      });
      document.getElementById('reset').addEventListener('click',()=>{placed.clear();selected=null;cards.forEach(c=>{c.classList.remove('used','dragging');c.setAttribute('aria-pressed','false')});slots.forEach(s=>{s.classList.remove('filled','bad','hot');s.querySelector('.empty').textContent='拖到这里'});status.textContent='已归仓 0 / 3';feedback.textContent='牙齿形态是能力边界，不是菜单记录。';draw();window.dispatchEvent(new CustomEvent('game-reset',{bubbles:true}));});
      window.addEventListener('resize',draw); window.dispatchEvent(new CustomEvent('game-start',{bubbles:true,detail:{state:snapshot()}}));
    });
    </script>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
</body>
</html>
