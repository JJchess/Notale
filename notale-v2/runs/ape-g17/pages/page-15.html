<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#0B0F12;--text:#E8EEF0;--font-sans:Inter,"Noto Sans SC","Source Han Sans SC","Microsoft YaHei",Arial,sans-serif}
.kicker{color:var(--ochre);font-size:15px;line-height:1.35;font-weight:700;letter-spacing:.14em}
#viewer{border:1px solid var(--line);cursor:grab;touch-action:none;background:radial-gradient(circle at 52% 42%,rgba(197,106,50,.13),transparent 48%)}
#viewer:active{cursor:grabbing}
#viewer:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.callout{position:absolute;width:220px;padding:9px 12px;border-left:3px solid var(--ochre);color:var(--muted);font-size:16px;line-height:1.4;background:rgba(11,15,18,.82);transition:border-color .18s,color .18s,transform .18s}
.callout strong{display:block;color:inherit;font-size:18px}.callout.active{border-color:var(--cyan);color:var(--text);transform:translateX(5px)}
.callout.seen:not(.active){border-color:var(--line-strong);color:var(--muted)}
.photo-ref{width:178px;height:178px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:rgba(20,29,34,.58)}
.process-num{color:var(--ochre);font:650 16px/1.35 var(--font-mono)}
.k-process .step strong{display:block;margin-top:5px;font-size:18px;line-height:1.35}.k-process .step span:last-child{display:block;margin-top:4px;color:var(--muted);font-size:16px;line-height:1.4}
@media (prefers-reduced-motion:reduce){.callout{transition:none}}
</style>
</head>
<body data-page="15" data-total="50">
<div id="stage">
  <header style="height:92px">
    <div class="kicker">READ THE EDGE</div>
    <h1>别问石头“像什么”，先找它怎样工作</h1>
  </header>

  <section class="k-process" aria-label="一次敲击留下的结构因果链" style="height:132px;flex:none">
    <div class="axis" aria-hidden="true"></div>
    <div class="step" data-step="0"><span class="process-num">01</span><strong>受击台面</strong><span>较平整处承受敲击</span></div><div class="arw" aria-hidden="true"></div>
    <div class="step" data-step="1"><span class="process-num">02</span><strong>石片脱落</strong><span>侧面留下剥片疤痕</span></div><div class="arw" aria-hidden="true"></div>
    <div class="step" data-step="2"><span class="process-num">03</span><strong>刃缘形成</strong><span>两个表面相交成锐边</span></div><div class="arw" aria-hidden="true"></div>
    <div class="step" data-step="3"><span class="process-num">04</span><strong>握持避让</strong><span>厚钝区留给手掌</span></div>
  </section>

  <main class="min0" style="display:flex;gap:22px;padding-top:14px">
    <figure class="min0" style="width:190px;margin:0;display:flex;flex-direction:column;justify-content:center;gap:10px">
      <img class="photo-ref" src="assets/img/oldowan-chopper.png" alt="博物馆收藏的奥杜威式砍砸器实物" title="Galet MHNT PRE.2009.0.200.1.jpg · Didier Descouens · CC BY-SA 4.0">
      <figcaption class="small">实物参照：轮廓只是起点，表面痕迹才说明敲击。</figcaption>
    </figure>

    <div id="viewer" class="cvbox min0 no-pan" style="flex:1" tabindex="0" role="application" aria-label="可旋转的石器结构模型。水平拖动旋转，垂直拖动俯仰；方向键也可操作。">
      <canvas id="stone" class="cv-fill" aria-hidden="true"></canvas>
      <svg id="overlay" aria-hidden="true"></svg>
      <div class="callout" data-callout="0" style="left:22px;top:22px"><strong>受击台面</strong><span>平面上的敲击点</span></div>
      <div class="callout" data-callout="1" style="right:22px;top:22px"><strong>剥片疤痕</strong><span>石片离开后的凹面</span></div>
      <div class="callout" data-callout="2" style="right:22px;bottom:22px"><strong>连续刃缘</strong><span>疤面与外皮的交界</span></div>
      <div class="callout" data-callout="3" style="left:22px;bottom:22px"><strong>厚钝握持区</strong><span>手掌避开锐边</span></div>
    </div>

    <aside class="panel q min0" style="width:270px;display:flex;flex-direction:column;justify-content:center;gap:16px">
      <h2>沿表面读结构</h2>
      <p class="hint">在石器上拖动，比较四个部位如何连接；也可使用方向键。</p>
      <p class="small">青色引线表示当前最清楚的部位；离开后保留观察痕迹。</p>
      <div class="btns"><button class="btn" id="reset" type="button">复位视角</button></div>
    </aside>
  </main>

  <footer style="height:102px;display:flex;align-items:center;gap:28px;border-top:1px solid var(--line)">
    <p class="lead" style="flex:1;margin:0">石器的功能要从敲击留下的表面关系判断，不能只凭整体轮廓命名。</p>
    <p class="small" style="width:460px;margin:0">接下来：怎样的角度、力度与原料，才能把刃缘真正敲出来？</p>
  </footer>

  <script src="assets/lib/three.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded',function(){
    Deck.init({index:15,total:50});
    var host=document.getElementById('viewer'),canvas=document.getElementById('stone'),svg=document.getElementById('overlay');
    var scene=new THREE.Scene();
    var camera=new THREE.PerspectiveCamera(38,1,.1,100); camera.position.set(0,.2,7.2);
    var renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true});
    renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    var group=new THREE.Group(); scene.add(group);
    var verts=[-1.8,-1.0,.55, 1.45,-.95,.7, 1.65,.35,.42, .85,1.35,.25, -.7,1.48,.18, -1.7,.55,.5,
      -1.35,-.8,-.72, 1.18,-.72,-.78, 1.25,.25,-.7, .62,1.05,-.58, -.62,1.18,-.52, -1.45,.38,-.62];
    var idx=[0,1,2,0,2,5,5,2,3,5,3,4,6,8,7,6,11,8,11,10,8,10,9,8,0,6,7,0,7,1,1,7,8,1,8,2,2,8,9,2,9,3,3,9,10,3,10,4,4,10,11,4,11,5,5,11,6,5,6,0];
    var geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3)); geo.setIndex(idx); geo.computeVertexNormals();
    var stone=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x9a5734,roughness:.93,metalness:0,flatShading:true})); stone.castShadow=true; group.add(stone);
    var scar=new THREE.Mesh(new THREE.CircleGeometry(.73,7),new THREE.MeshStandardMaterial({color:0xc98250,roughness:1,side:THREE.DoubleSide})); scar.position.set(.55,.18,.55); scar.rotation.set(-.15,.12,0); group.add(scar);
    var edgePts=[new THREE.Vector3(-1.65,.55,.54),new THREE.Vector3(-.7,1.48,.22),new THREE.Vector3(.85,1.35,.29),new THREE.Vector3(1.62,.35,.47)];
    var edge=new THREE.Line(new THREE.BufferGeometry().setFromPoints(edgePts),new THREE.LineBasicMaterial({color:0x45d6e8})); group.add(edge);
    var grip=new THREE.Mesh(new THREE.SphereGeometry(.69,18,12),new THREE.MeshStandardMaterial({color:0xc56a32,transparent:true,opacity:.24,roughness:1})); grip.scale.set(1.15,1.35,.48); grip.position.set(-1.05,-.25,-.34); group.add(grip);
    scene.add(new THREE.HemisphereLight(0xddeeff,0x24150d,1.8)); var key=new THREE.DirectionalLight(0xffffff,3.1);key.position.set(4,6,7);scene.add(key); var rim=new THREE.DirectionalLight(0x45d6e8,2);rim.position.set(-4,2,-4);scene.add(rim);
    var yaw=-.42,pitch=.12,drag=false,lastX=0,lastY=0,seen=[false,false,false,false],active=-1;
    var local=[new THREE.Vector3(-.15,1.33,.22),new THREE.Vector3(.55,.18,.72),new THREE.Vector3(.85,1.15,.32),new THREE.Vector3(-1.2,-.25,-.5)];
    function resize(){var w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();draw()}
    function visibility(i){var p=local[i].clone().applyEuler(group.rotation);return p.z}
    function draw(){group.rotation.set(pitch,yaw,0);renderer.render(scene,camera);var w=host.clientWidth,h=host.clientHeight;svg.setAttribute('viewBox','0 0 '+w+' '+h);while(svg.firstChild)svg.removeChild(svg.firstChild);
      var best=0,bv=-99;for(var i=0;i<4;i++){var v=visibility(i);if(v>bv){bv=v;best=i}}
      if(drag||seen.some(Boolean)){active=best;seen[best]=true}else active=-1;
      document.querySelectorAll('.step').forEach(function(el,i){el.classList.toggle('done',seen[i]&&i!==active);if(i===active)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current')});
      document.querySelectorAll('.callout').forEach(function(el,i){el.classList.toggle('active',i===active);el.classList.toggle('seen',seen[i]);var p=local[i].clone();group.localToWorld(p);p.project(camera);var x=(p.x+1)*w/2,y=(-p.y+1)*h/2;var box=el.getBoundingClientRect(),hb=host.getBoundingClientRect();var tx=(box.left-hb.left)/Deck.s+(box.width/Deck.s)/2,ty=(box.top-hb.top)/Deck.s+(box.height/Deck.s)/2;var line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',x);line.setAttribute('y1',y);line.setAttribute('x2',tx);line.setAttribute('y2',ty);line.setAttribute('stroke',i===active?'var(--cyan)':'var(--ochre)');line.setAttribute('stroke-width',i===active?'2.5':'1.2');line.setAttribute('opacity',i===active?'1':'.42');svg.appendChild(line);var dot=document.createElementNS('http://www.w3.org/2000/svg','circle');dot.setAttribute('cx',x);dot.setAttribute('cy',y);dot.setAttribute('r',i===active?'6':'4');dot.setAttribute('fill',i===active?'var(--cyan)':'var(--ochre)');svg.appendChild(dot)});
      if(active>=0)host.setAttribute('aria-label','当前清楚部位：'+document.querySelector('[data-callout="'+active+'"]').textContent+'。水平拖动旋转，方向键也可操作。');
    }
    function move(dx,dy){yaw+=dx*.008;pitch=Deck.clamp(pitch+dy*.006,-35*Math.PI/180,35*Math.PI/180);draw()}
    host.addEventListener('pointerdown',function(e){drag=true;lastX=e.clientX;lastY=e.clientY;host.setPointerCapture(e.pointerId)});
    host.addEventListener('pointermove',function(e){if(!drag)return;move(e.clientX-lastX,e.clientY-lastY);lastX=e.clientX;lastY=e.clientY});
    host.addEventListener('pointerup',function(){drag=false;draw()}); host.addEventListener('pointercancel',function(){drag=false;draw()});
    host.addEventListener('keydown',function(e){var dx=0,dy=0;if(e.key==='ArrowLeft')dx=-12;if(e.key==='ArrowRight')dx=12;if(e.key==='ArrowUp')dy=-12;if(e.key==='ArrowDown')dy=12;if(dx||dy){e.preventDefault();drag=true;move(dx,dy);drag=false}});
    document.getElementById('reset').addEventListener('click',function(){yaw=-.42;pitch=.12;seen=[false,false,false,false];active=-1;host.setAttribute('aria-label','可旋转的石器结构模型。水平拖动旋转，垂直拖动俯仰；方向键也可操作。');draw();host.focus()});
    var stop=Deck.loop(function(t,dt){if(!drag&&!Deck.reduced()&&!seen.some(Boolean)){yaw+=dt*.00008;draw()}},{still:1});
    var off=Deck.onResize(resize);resize();window.addEventListener('pagehide',function(){stop();off();geo.dispose();stone.material.dispose();scar.geometry.dispose();scar.material.dispose();edge.geometry.dispose();edge.material.dispose();grip.geometry.dispose();grip.material.dispose();renderer.dispose()},{once:true});
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
