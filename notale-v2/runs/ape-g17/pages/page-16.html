<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="16" data-total="50">
<div id="stage">
  <style>
    .kicker{height:24px;color:var(--ochre);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.12em}
    .titlebar{height:60px;display:flex;align-items:flex-start;justify-content:space-between}.titlebar h1{margin:0}.titlebar .tag{margin-top:5px}
    .work{display:flex;gap:22px;min-height:0}.controls{flex:0 0 380px;display:flex;flex-direction:column;gap:12px}.controls .ctl{grid-template-columns:78px 1fr 64px;gap:10px}.controls .big.sm{font-size:28px}.materials{display:flex;gap:8px}.materials .btn{flex:1;min-width:0;padding-inline:7px}
    .scene{flex:1;display:flex;flex-direction:column;min-height:0}.scene .cvbox{flex:1;border:1px solid var(--line);background:linear-gradient(180deg,rgba(53,67,74,.18),transparent)}
    .scene canvas{touch-action:none}.overlay{position:absolute;inset:0;pointer-events:none}.scene-label{position:absolute;font-size:var(--fs-label);color:var(--muted)}
    .status{height:54px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);font-size:var(--fs-body)}
    .attempts{display:flex;gap:12px}.mark{width:25px;height:25px;border:1px solid var(--line-strong);border-radius:50%;display:grid;place-items:center;font:600 var(--fs-label)/1 var(--font-mono)}.mark.used{border-color:var(--cyan);color:var(--cyan)}
    .matrix{height:300px;display:grid;grid-template-rows:58px repeat(4,1fr);--compare-n:3}.matrix .hdr,.matrix .dim,.matrix .cell{padding-top:8px;padding-bottom:8px;transition:border-color .2s,color .2s,box-shadow .2s}.matrix .cell{font-size:var(--fs-sec)}
    .foot{height:72px;display:flex;align-items:center;justify-content:space-between;gap:28px;border-top:1px solid var(--line)}.foot .lead{margin:0;max-width:1000px}.next{max-width:390px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45;text-align:right}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
  <div class="kicker">BODY → TOOL</div>
  <header class="titlebar"><h1>敲出可用石片</h1><span class="tag neutral">最多 3 次</span></header>
  <main style="display:flex;flex-direction:column;gap:14px">
    <section class="work min0" style="flex:1.15">
      <div class="panel q controls min0">
        <div class="hint">选原料，调角度与力度，再敲击</div>
        <div class="materials btns" role="group" aria-label="选择原料">
          <button class="btn mat" data-mat="0" aria-pressed="true">细粒硅质岩</button>
          <button class="btn mat" data-mat="1" aria-pressed="false">石英岩</button>
          <button class="btn mat" data-mat="2" aria-pressed="false">裂隙风化石</button>
        </div>
        <div class="ctl"><label for="angle">撞击角度</label><input id="angle" type="range" min="30" max="80" value="65"><output class="big sm" id="angleOut">65°</output></div>
        <div class="ctl"><label for="force">后拉力度</label><input id="force" type="range" min="1" max="10" value="8"><output class="big sm" id="forceOut">8/10</output></div>
        <div class="btns" style="gap:10px;margin-top:auto"><button id="strike" class="btn lg" style="flex:1">敲击</button><button id="reset" class="btn">重新开始</button></div>
        <div class="small">角度与力度为课堂示意参数，不是考古测量值。</div>
      </div>
      <div class="scene min0">
        <div class="cvbox no-pan" id="sceneBox">
          <canvas id="scene" class="cv-fill" aria-label="锤石撞击石核的侧视模拟"></canvas>
          <div class="overlay"><span class="scene-label" style="left:9%;top:18%">锤石 · 手部施力</span><span class="scene-label" style="right:13%;bottom:18%">石核</span></div>
        </div>
        <div class="status"><strong id="feedback" aria-live="polite">准备：当前参数偏离有效窗口</strong><div class="attempts" aria-label="尝试次数"><span class="mark">1</span><span class="mark">2</span><span class="mark">3</span></div></div>
      </div>
    </section>
    <section class="k-comparison matrix min0" style="--compare-n:3" aria-label="三种原料的同维度比较">
      <div class="hdr dim">同一敲击维度</div><button class="hdr mat btn" data-mat="0" aria-pressed="true">细粒硅质岩</button><button class="hdr mat btn" data-mat="1" aria-pressed="false">石英岩</button><button class="hdr mat btn" data-mat="2" aria-pressed="false">裂隙风化石</button>
      <div class="dim">有效敲击角</div><div class="cell c0">45°–60°</div><div class="cell c1">50°–65°</div><div class="cell c2">35°–50°</div>
      <div class="dim">有效力度</div><div class="cell c0">4–7 / 10</div><div class="cell c1">6–9 / 10</div><div class="cell c2">2–4 / 10</div>
      <div class="dim">窗口内结果</div><div class="cell c0">薄、锐利</div><div class="cell c1">较厚、耐用</div><div class="cell c2">偶发锐利但不稳定</div>
      <div class="dim">窗口外常见失败</div><div class="cell c0">擦过或压碎刃口</div><div class="cell c1">力度不足，难以剥落</div><div class="cell c2">沿旧裂隙碎裂</div>
    </section>
  </main>
  <footer class="foot"><p class="lead">敲击角度、力度与原料共同决定石片是否锋利；蛮力不等于有效制造。</p><div class="next">下一问：石片能被制造出来，是否意味着演化沿着更先进的单一路线前进？</div></footer>
  <script src="assets/lib/matter.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded',function(){
    Deck.init({index:16,total:50});
    const P=(Lec.K && Lec.K.P16)||{angleMin:30,angleMax:80,angleDefault:65,forceMin:1,forceMax:10,forceDefault:8,materials:[{a:[45,60],f:[4,7]},{a:[50,65],f:[6,9]},{a:[35,50],f:[2,4]}]};
    const initial=()=>({material:0,angle:P.angleDefault,force:P.forceDefault,tries:0,done:false,trace:[]}); let state=initial();
    const cv=document.getElementById('scene'),box=document.getElementById('sceneBox'),ctx=Deck.fit(cv); let stop=null,hammer=null,core=null,flake=null,impact=0;
    const engine=Matter.Engine.create({gravity:{x:0,y:0}}); engine.gravity.scale=0;
    function size(){return {w:box.clientWidth,h:box.clientHeight}}
    function rebuild(){Matter.Composite.clear(engine.world,false);const s=size();core=Matter.Bodies.polygon(s.w*.73,s.h*.62,7,72,{isStatic:true});hammer=Matter.Bodies.circle(s.w*.18,s.h*.34,34,{restitution:.28});Matter.Body.setStatic(hammer,true);Matter.Composite.add(engine.world,[core,hammer]);flake=null;draw()}
    function colors(){return {bg:Deck.rgb('--bg'),o:Deck.rgb('--ochre'),c:Deck.rgb('--cyan'),m:Deck.rgb('--muted'),l:Deck.rgb('--line')}}
    function draw(){const s=size(),C=colors();ctx.clearRect(0,0,s.w,s.h);ctx.strokeStyle=`rgb(${C.l})`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,s.h*.82);ctx.lineTo(s.w,s.h*.82);ctx.stroke();
      const a=state.angle*Math.PI/180,tx=s.w*.67,ty=s.h*.53,len=150;ctx.strokeStyle=`rgb(${C.c})`;ctx.lineWidth=3;Deck.arrow(ctx,tx-Math.cos(a)*len,ty-Math.sin(a)*len,tx,ty,12);
      ctx.fillStyle=`rgb(${C.o})`;ctx.beginPath();ctx.arc(hammer.position.x,hammer.position.y,34,0,Math.PI*2);ctx.fill();
      ctx.save();ctx.translate(core.position.x,core.position.y);ctx.rotate(core.angle);ctx.fillStyle=Deck.rgba('--ochre',.62);ctx.strokeStyle=`rgb(${C.o})`;ctx.lineWidth=3;ctx.beginPath();core.vertices.forEach((v,i)=>{const x=v.x-core.position.x,y=v.y-core.position.y;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
      if(flake){ctx.fillStyle=flake.ok?`rgb(${C.c})`:Deck.rgba('--muted',.7);ctx.beginPath();ctx.moveTo(flake.x,flake.y);ctx.lineTo(flake.x+55,flake.y+14);ctx.lineTo(flake.x+10,flake.y+30);ctx.closePath();ctx.fill();}
      state.trace.forEach((t,i)=>{ctx.strokeStyle=Deck.rgba('--cyan',.55);ctx.beginPath();ctx.arc(s.w*.65+i*18,s.h*.48,5,0,Math.PI*2);ctx.stroke()});
    }
    function updateUI(){document.getElementById('angle').value=state.angle;document.getElementById('force').value=state.force;document.getElementById('angleOut').textContent=state.angle+'°';document.getElementById('forceOut').textContent=state.force+'/10';document.querySelectorAll('.mat').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.mat===state.material)));document.querySelectorAll('.cell,.matrix .hdr').forEach(x=>x.classList.remove('diff'));document.querySelectorAll('.c'+state.material).forEach(x=>x.classList.add('diff'));document.querySelectorAll('.matrix .hdr.mat')[state.material].classList.add('diff');document.querySelectorAll('.mark').forEach((m,i)=>m.classList.toggle('used',i<state.tries));document.getElementById('strike').disabled=state.done||state.tries>=3;draw()}
    function verdict(){const m=P.materials[state.material],a=state.angle,f=state.force;if(a<m.a[0])return '角度过浅';if(a>m.a[1])return '角度过陡';if(f<m.f[0])return '力度不足';if(f>m.f[1])return '力度过大：刃缘被压碎';return '可用石片：刃缘锋利';}
    function strike(){
      if(state.done||state.tries>=3)return;
      state.tries++;
      const text=verdict(),ok=text.startsWith('可用');
      state.trace.push({material:state.material,angle:state.angle,force:state.force,result:text});
      Matter.Body.setStatic(hammer,false);
      const s=size(),a=state.angle*Math.PI/180;
      Matter.Body.setPosition(hammer,{x:s.w*.22,y:s.h*.36});
      Matter.Body.setVelocity(hammer,{x:Math.cos(a)*state.force*2.1,y:Math.sin(a)*state.force*1.15});
      impact=0; document.getElementById('feedback').textContent='撞击中…';
      if(stop)stop();
      stop=Deck.loop((t,dt)=>{
        Matter.Engine.update(engine,Math.min(dt||16,24));
        const dx=hammer.position.x-core.position.x,dy=hammer.position.y-core.position.y;
        if(!impact&&(dx*dx+dy*dy)<115*115){
          impact=t||1; flake={x:core.position.x-16,y:core.position.y-42,ok}; state.done=ok;
          document.getElementById('feedback').textContent=ok?'可用石片｜目标完成':text+(state.tries>=3?'｜三次已用完':'｜调整后再试');
          updateUI();
          if(ok) window.dispatchEvent(new CustomEvent('game-complete',{detail:{score:4-state.tries,metrics:{tries:state.tries},trace:state.trace}}));
          else window.dispatchEvent(new CustomEvent('game-progress',{detail:{state:JSON.parse(JSON.stringify(state)),action:'strike',metrics:{tries:state.tries}}}));
        }
        draw();
        if(impact&&t-impact>650){stop();stop=null;Matter.Body.setStatic(hammer,true)}
      },{still:700});
    }
    document.querySelectorAll('.mat').forEach(b=>b.addEventListener('click',()=>{state.material=+b.dataset.mat;updateUI()}));
    ['angle','force'].forEach(id=>document.getElementById(id).addEventListener('input',e=>{state[id]=+e.target.value;updateUI()}));document.getElementById('strike').addEventListener('click',strike);document.getElementById('reset').addEventListener('click',()=>{if(stop)stop();stop=null;state=initial();rebuild();updateUI();document.getElementById('feedback').textContent='准备：当前参数偏离有效窗口';window.dispatchEvent(new CustomEvent('game-reset'))});
    Deck.onResize(rebuild);rebuild();updateUI();
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
