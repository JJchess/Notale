<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .kicker{height:22px;color:var(--ochre);font-size:var(--fs-label);font-weight:700;letter-spacing:.14em}
  h1{height:48px;margin:0}
  .claim strong{color:var(--ochre)}
  .support b{display:block;margin-bottom:4px;color:var(--text);font-size:var(--fs-body)}
  .support span{color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
  #chart svg{display:block;width:100%;height:100%}
  #chart .axis text{fill:var(--muted);font-family:var(--font-mono);font-size:13px}
  #chart .axis path,#chart .axis line{stroke:var(--line-strong)}
  #chart .name{fill:var(--text);font-size:16px;font-family:var(--font-serif);font-style:italic}
  #chart .range{fill:var(--ochre);opacity:.82}
  #chart .link{fill:none;stroke:var(--cyan);stroke-width:2;stroke-dasharray:7 6;opacity:.72}
  #chart .handle{fill:var(--cyan);stroke:var(--bg);stroke-width:3;cursor:ew-resize}
  #chart .handle:focus{outline:none;stroke:var(--text);stroke-width:5}
  #chart .era{fill:var(--ochre);opacity:.07}
  #chart .now{fill:var(--muted);font-size:14px}
  .branch-controls{position:absolute;right:18px;bottom:12px;width:360px;padding:12px 16px}
  .branch-controls .ctl{grid-template-columns:100px 1fr 52px;gap:8px;margin:2px 0}
  .branch-controls output{color:var(--cyan);font-size:var(--fs-label);font-family:var(--font-mono);text-align:right}
  .chart-note{position:absolute;left:74px;bottom:16px;color:var(--muted);font-size:var(--fs-label)}
  .skull{position:absolute;right:398px;top:30px;width:96px;height:96px;object-fit:contain;border:1px solid var(--line);border-radius:10px;opacity:.88}
  .footer-line{display:flex;align-items:center;justify-content:space-between;height:58px;gap:24px}
  .footer-line p{margin:0;font-size:var(--fs-lead);line-height:1.4}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-page="17" data-total="50">
<div id="stage">
  <div class="kicker">EVOLUTION IS BRANCHING</div>
  <h1>化石不是一架通往现代人的阶梯</h1>
  <section class="k-generalization" style="height:210px;grid-template-rows:auto 28px 1fr;--support-n:3">
    <div class="claim"><strong>主张：</strong>演化史更像灌木——多个身体组合会分叉、重叠与共存。</div>
    <div class="trunk"></div>
    <div class="supports">
      <div class="support"><b>年代重叠</b><span><i>H. habilis</i> 与 <i>H. erectus</i> 曾同时存在，并非整齐交班。</span></div>
      <div class="support"><b>旁支共存</b><span><i>P. boisei</i> 与早期人属同期；旁支不接向现代人。</span></div>
      <div class="support"><b>特征不同步</b><span>双足行走、脑量与咀嚼结构没有沿同一刻度升级。</span></div>
    </div>
  </section>
  <main class="cvbox min0 no-pan" id="chart" aria-label="可改写的人族年代分支图">
    <img class="skull" src="assets/img/afarensis-skull.jpg" alt="南方古猿阿法种头骨证据" title="Australopithecus afarensis-MGL 95215-P5030041-black.jpg · Rama · CC BY-SA 3.0 fr">
    <div class="chart-note">虚线：关系示意；部分谱系仍有争议</div>
    <div class="panel branch-controls">
      <div class="hint">横向拉开分支；纵向年代不会改变</div>
      <div class="ctl"><label for="homo">人属分支</label><input id="homo" type="range" min="0" max="280" value="0"><output>0 px</output></div>
      <div class="ctl"><label for="para">旁支</label><input id="para" type="range" min="0" max="280" value="0"><output>0 px</output></div>
      <div class="ctl"><label for="austral">南方古猿</label><input id="austral" type="range" min="0" max="280" value="0"><output>0 px</output></div>
      <button class="btn" id="reset" type="button">复位为阶梯</button>
    </div>
  </main>
  <div class="footer-line">
    <p>化石特征组成分叉、共存且不完全同步的灌木，而不是从猿到人的单行阶梯。</p>
    <span class="tag neutral">下一站：体外器官</span>
  </div>
  <script src="assets/lib/d3.min.js"></script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
  Deck.init({index:17,total:50});
  const K=Lec.K.evolution;
  const species=[
    {id:'afar',name:'Australopithecus afarensis',start:3.9,end:2.9,branch:'austral',side:-1},
    {id:'afric',name:'Australopithecus africanus',start:3.3,end:2.1,branch:'austral',side:-1},
    {id:'habilis',name:'Homo habilis',start:2.4,end:1.4,branch:'homo',side:1},
    {id:'boisei',name:'Paranthropus boisei',start:2.3,end:1.2,branch:'para',side:-1},
    {id:'erectus',name:'Homo erectus',start:K.homoErectusYearsAgo/1000000,end:.1,branch:'homo',side:1},
    {id:'sapiens',name:'Homo sapiens',start:K.homoSapiensYearsAgo/1000000,end:0,branch:'homo',side:1}
  ];
  const el=document.getElementById('chart'), svg=d3.select(el).append('svg').attr('role','img').attr('aria-label','距今四百万年至今的人族分支与共存年代');
  svg.append('title').text('人族演化灌木');
  const state={homo:0,para:0,austral:0};
  function draw(){
    const w=el.clientWidth,h=el.clientHeight, m={top:18,right:510,bottom:24,left:76};
    svg.attr('viewBox',`0 0 ${w} ${h}`); svg.selectAll('g.plot').remove();
    const g=svg.append('g').attr('class','plot'), innerH=h-m.top-m.bottom, center=m.left+(w-m.left-m.right)/2;
    const y=d3.scaleLinear().domain([4,0]).range([m.top,m.top+innerH]);
    g.selectAll('rect.era').data(d3.range(4)).join('rect').attr('class','era').attr('x',m.left).attr('width',w-m.left-m.right).attr('y',d=>y(d+1)).attr('height',d=>y(d)-y(d+1));
    g.append('g').attr('class','axis').attr('transform',`translate(${m.left},0)`).call(d3.axisLeft(y).ticks(4).tickFormat(d=>d===0?'现在':`${d} Ma`));
    const xFor=d=>center+d.side*state[d.branch];
    g.selectAll('path.link').data(species).join('path').attr('class','link').attr('d',d=>`M${center},${y(d.start)}H${xFor(d)}V${y(d.end)}`);
    g.selectAll('rect.range').data(species).join('rect').attr('class','range').attr('x',d=>xFor(d)-5).attr('width',10).attr('y',d=>y(d.start)).attr('height',d=>Math.max(5,y(d.end)-y(d.start))).attr('rx',5);
    g.selectAll('text.name').data(species).join('text').attr('class','name').attr('x',d=>xFor(d)+(d.side>0?14:-14)).attr('y',d=>y((d.start+d.end)/2)+5).attr('text-anchor',d=>d.side>0?'start':'end').text(d=>d.name);
    const handles=[{key:'homo',age:1.65,side:1},{key:'para',age:1.75,side:-1},{key:'austral',age:2.65,side:-1}];
    g.selectAll('circle.handle').data(handles).join('circle').attr('class','handle').attr('tabindex',0).attr('role','slider').attr('aria-label',d=>d.key+'分支把手').attr('aria-valuemin',0).attr('aria-valuemax',280).attr('aria-valuenow',d=>state[d.key]).attr('cx',d=>center+d.side*state[d.key]).attr('cy',d=>y(d.age)).attr('r',11)
      .call(d3.drag().on('drag',(ev,d)=>{state[d.key]=Math.max(0,Math.min(280,d.side*(ev.x-center)));sync(d.key);draw();}))
      .on('keydown',(ev,d)=>{if(ev.key==='ArrowLeft'||ev.key==='ArrowRight'){ev.preventDefault();const delta=(ev.key==='ArrowRight'?10:-10)*d.side;state[d.key]=Math.max(0,Math.min(280,state[d.key]+delta));sync(d.key);draw();}});
  }
  function sync(key){const input=document.getElementById(key);input.value=state[key];input.nextElementSibling.value=Math.round(state[key])+' px';}
  ['homo','para','austral'].forEach(key=>document.getElementById(key).addEventListener('input',e=>{state[key]=+e.target.value;sync(key);draw();}));
  document.getElementById('reset').addEventListener('click',()=>{Object.keys(state).forEach(k=>{state[k]=0;sync(k)});draw();});
  const ro=new ResizeObserver(draw);ro.observe(el);draw();
  window.addEventListener('pagehide',()=>ro.disconnect(),{once:true});
});
</script>
</body>
</html>
