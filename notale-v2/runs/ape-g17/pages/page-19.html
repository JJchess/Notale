<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="19" data-total="50">
<div id="stage">
  <style>
    .p19-head{height:92px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line)}
    .p19-kicker{margin:0 0 3px;color:var(--ochre);font-size:var(--fs-label);font-weight:700;letter-spacing:.15em}
    .p19-head h1{margin:0 0 13px}
    grip-game{display:flex;width:100%;height:100%;min-height:0;flex-direction:column}
    .p19-root{height:72px;position:relative;display:flex;align-items:flex-start;justify-content:center;padding-top:4px;color:var(--text);font-size:var(--fs-h2);font-weight:680}
    .p19-root small{position:absolute;top:34px;color:var(--muted);font-size:var(--fs-label);font-weight:500}
    .p19-root::before{position:absolute;top:57px;left:12.5%;right:12.5%;height:2px;background:var(--cyan);opacity:.62;content:""}
    .p19-root::after{position:absolute;top:49px;left:50%;width:2px;height:10px;background:var(--cyan);content:""}
    .p19-branch{position:absolute;top:57px;left:0;width:100%;display:flex;justify-content:space-around}
    .p19-branch i{display:block;width:2px;height:17px;background:var(--cyan);opacity:.62}
    .p19-board{display:flex;flex:1;min-height:0;gap:16px;padding-top:6px}
    .p19-task{display:flex;flex:1;min-width:0;min-height:0;flex-direction:column;transition:border-color 180ms ease-out,transform 180ms ease-out}
    .p19-task.active{border-color:var(--cyan)}
    .p19-task.slip{animation:p19-slip 240ms ease-out}
    .p19-demand{min-height:48px;margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
    .p19-needs{display:flex;gap:6px;margin:2px 0 5px;padding-top:9px;border-top:1px solid var(--line)}
    .p19-need{flex:1;padding:5px 3px;border:1px solid var(--line);border-radius:4px;color:var(--muted);font-size:var(--fs-label);line-height:1.35;text-align:center}
    .p19-need.on{border-color:var(--ochre);color:var(--ochre)}
    .p19-diagram{height:146px;margin:4px 0 0}
    .p19-diagram svg{width:100%;height:100%;overflow:visible}
    .p19-map{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:var(--muted);font-size:var(--fs-label);line-height:1.35}
    .p19-map b{color:var(--ochre);font-weight:650}.p19-map i{color:var(--cyan);font-style:normal}.p19-map span:last-child{color:var(--line-strong)}
    .p19-hand{fill:none;stroke:var(--ochre);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .p19-tool{fill:none;stroke:var(--line-strong);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;transition:stroke 180ms ease-out,transform 180ms ease-out}
    .p19-task.active .p19-tool,.p19-task.solved .p19-tool{stroke:var(--cyan)}
    .p19-contact{fill:var(--cyan);opacity:0;transform-box:fill-box;transform-origin:center}
    .p19-task.solved .p19-contact{animation:p19-contact 420ms ease-out forwards}
    .p19-task.solved .p19-contact:nth-of-type(2){animation-delay:70ms}
    .p19-task.solved .p19-contact:nth-of-type(3){animation-delay:140ms}
    .p19-slot{display:flex;flex:1;min-height:82px;flex-direction:column;justify-content:center}
    .p19-slot-label{color:var(--muted);font-size:var(--fs-label);line-height:1.4}
    .p19-effect{min-height:26px;margin-top:7px;color:var(--cyan);font-size:var(--fs-sec);line-height:1.4}
    .p19-rack{height:104px;display:flex;align-items:center;gap:14px}
    .p19-rack .hint{flex:0 0 245px;margin:0}
    .p19-cards{display:flex;flex:1;align-items:center;justify-content:center;gap:14px;min-width:0}
    .p19-card{touch-action:none;user-select:none;cursor:grab;transition:transform 220ms ease-out,border-color 180ms ease-out,color 180ms ease-out,opacity 180ms ease-out}
    .p19-card:active{cursor:grabbing}
    .p19-card.active{z-index:5;border-color:var(--cyan);color:var(--cyan)}
    .p19-card.placed{cursor:grab}
    .p19-card svg{width:42px;height:28px;margin-right:8px;vertical-align:middle}
    .p19-actions{display:flex;flex:0 0 180px;justify-content:flex-end}
    .p19-feedback{height:64px;display:flex;align-items:center;justify-content:space-between;margin-top:4px;padding-top:8px;padding-bottom:8px}
    .p19-feedback p{margin:0;font-size:var(--fs-sec);line-height:1.45}
    .p19-close{height:66px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line)}
    .p19-close .lead{margin:0;font-weight:650}
    .p19-next{max-width:520px;margin:0;text-align:right}
    @keyframes p19-slip{0%,100%{transform:translateX(0)}45%{transform:translateX(9px)}}
    @keyframes p19-contact{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:scale(1)}}
    @keyframes p19-enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    .p19-task{animation:p19-enter 520ms ease-out both}.p19-task:nth-child(2){animation-delay:70ms}.p19-task:nth-child(3){animation-delay:140ms}.p19-task:nth-child(4){animation-delay:210ms}
    .p19-card{animation:p19-enter 480ms ease-out both;animation-delay:260ms}
    @media(prefers-reduced-motion:reduce){.p19-task,.p19-card,.p19-task.solved .p19-contact{animation:none}.p19-task.solved .p19-contact{opacity:1}.p19-task,.p19-tool,.p19-card{transition:none}}
  </style>
  <header class="p19-head">
    <div><p class="p19-kicker">BODY × TASK</p><h1>同一只手，怎样握才有效？</h1></div>
    <p class="small" style="margin-bottom:15px">能握住，只是开始；任务决定有效接触。</p>
  </header>
  <main class="min0" style="display:flex"><grip-game></grip-game></main>
  <footer class="p19-close">
    <p class="lead">手的结构提供多种握持可能，具体工具任务才把可能性变成有效动作。</p>
    <p class="small p19-next">下一步：握法把力量送到工具上以后，怎样把多个动作排成一次完整的切割任务？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
window.addEventListener('DOMContentLoaded',()=>{
  const tasks=[
    {id:'strike',title:'重击',need:'握住圆石，敲击石核',grip:'power',effect:'掌面包裹 · 稳定传力',lack:'传力',dims:['传力','稳定']},
    {id:'edge',title:'精细取刃',need:'捏住小石片，调整刃缘',grip:'precision',effect:'指腹相对 · 控制方向',lack:'方向',dims:['稳定','定向']},
    {id:'support',title:'稳定托持',need:'托住石核，观察敲击面',grip:'support',effect:'掌指承托 · 防止滚落',lack:'承托',dims:['承托','稳定']},
    {id:'scrape',title:'定向刮削',need:'握住石片，沿材料拉动',grip:'lateral',effect:'拇指侧压 · 固定朝向',lack:'方向',dims:['传力','定向']}
  ];
  const grips=[['lateral','侧捏握'],['support','托握'],['power','强力握'],['precision','精密捏握']];
  const diagram=(id)=>`<svg viewBox="0 0 280 150" role="img" aria-label="手与工具的接触示意"><path class="p19-hand" d="M28 105 C42 70 61 44 82 38 C98 34 110 49 104 62 C96 75 81 82 72 102 M72 102 C91 91 111 86 130 91 C145 96 146 114 132 121 C103 135 64 132 28 105Z"/><path class="p19-tool" d="${id==='strike'?'M176 44 C211 26 248 47 250 80 C252 112 215 130 182 112 C156 98 153 60 176 44Z':id==='support'?'M165 48 L246 61 L235 113 L171 126 L148 88 Z':id==='edge'?'M160 93 L236 51 L252 105 L172 119 Z':'M158 77 L249 49 L232 111 L164 117 Z'}"/><path class="p19-tool" d="M132 101 L165 91"/><circle class="p19-contact" cx="132" cy="101" r="7"/><circle class="p19-contact" cx="151" cy="95" r="6"/><circle class="p19-contact" cx="169" cy="90" r="5"/></svg>`;
  const handIcon=`<svg viewBox="0 0 48 30" aria-hidden="true"><path d="M5 23 C10 9 14 4 19 6 L19 15 C24 7 29 8 29 14 C36 10 41 15 38 21 C32 28 16 29 5 23Z" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>`;
  class GripGame extends HTMLElement{
    constructor(){super();this.drag=null;this.state=this.fresh();}
    fresh(){return {placed:{},complete:false,trace:[]};}
    connectedCallback(){this.render();this.bind();this.dispatchEvent(new CustomEvent('game-start',{bubbles:true,composed:true}));}
    render(){this.innerHTML=`<section class="k-classification min0" aria-label="任务与握法分类游戏"><div class="p19-root">工具任务需求<small>先辨认任务，再选择接触方式</small><div class="p19-branch" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div><div class="p19-board min0">${tasks.map(t=>`<article class="box p19-task min0" data-task="${t.id}"><strong class="bt">${t.title}</strong><p class="p19-demand">${t.need}</p><div class="p19-needs" aria-label="任务要求">${['传力','承托','稳定','定向'].map(d=>`<span class="p19-need ${t.dims.includes(d)?'on':''}">${d}</span>`).join('')}</div><div class="p19-diagram">${diagram(t.id)}</div><div class="p19-map" aria-label="动作关系"><b>手的接触</b><i>→ 控制 →</i><span>工具受力</span></div><div class="lv p19-slot" data-slot="${t.id}"><span class="p19-slot-label">匹配握法放在这里</span><span class="p19-effect"></span></div></article>`).join('')}</div><div class="p19-rack"><p class="hint">拖动握法到任务框；键盘用方向键选框，按 Enter 放入。</p><div class="p19-cards min0">${grips.map(([id,n])=>`<button class="btn tag bio p19-card no-pan" data-grip="${id}" type="button">${handIcon}${n}</button>`).join('')}</div><div class="p19-actions"><button class="btn" type="button" data-reset>复位</button></div></div><div class="panel q p19-feedback"><p data-feedback aria-live="polite">观察每项任务需要的是传力、承托，还是方向控制。</p><span class="tag neutral" data-progress>等待匹配</span></div></section>`;}
    bind(){
      this.querySelector('[data-reset]').addEventListener('click',()=>this.reset());
      this.querySelectorAll('.p19-card').forEach(card=>{
        card.addEventListener('pointerdown',e=>this.down(e,card));
        card.addEventListener('keydown',e=>this.key(e,card));
      });
    }
    down(e,card){e.preventDefault();card.setPointerCapture(e.pointerId);const p=Deck.pt(card,e);this.drag={card,pid:e.pointerId,start:p,taskIndex:0};card.classList.add('active');this.highlight(0);const move=ev=>{if(!this.drag)return;const q=Deck.pt(card,ev);card.style.transform=`translate(${q.x-this.drag.start.x}px,${q.y-this.drag.start.y}px)`;const hit=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.p19-task');this.highlight(hit?tasks.findIndex(t=>t.id===hit.dataset.task):-1);};const up=ev=>{card.removeEventListener('pointermove',move);card.removeEventListener('pointerup',up);const hit=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.p19-task');this.finish(card,hit?.dataset.task);};card.addEventListener('pointermove',move);card.addEventListener('pointerup',up);}
    key(e,card){let i=Number(card.dataset.target||0);if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();i=(i+1)%tasks.length;card.dataset.target=i;this.highlight(i);}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();i=(i+tasks.length-1)%tasks.length;card.dataset.target=i;this.highlight(i);}else if(e.key==='Enter'||e.key===' '){e.preventDefault();this.finish(card,tasks[i].id);}}
    highlight(i){this.querySelectorAll('.p19-task').forEach((el,j)=>el.classList.toggle('active',i===j));}
    finish(card,taskId){card.style.transform='';card.classList.remove('active');this.highlight(-1);if(!taskId)return;const task=tasks.find(t=>t.id===taskId);if(task.grip!==card.dataset.grip){const box=this.querySelector(`[data-task="${taskId}"]`);box.classList.remove('slip');void box.offsetWidth;box.classList.add('slip');this.feedback(`这次接触缺少${task.lack}控制；换一种握法。`);this.emit('game-progress',{grip:card.dataset.grip,task:taskId,matched:false});return;}
      this.state.placed[taskId]=card.dataset.grip;this.state.trace.push({grip:card.dataset.grip,task:taskId});const slot=this.querySelector(`[data-slot="${taskId}"]`);slot.querySelector('.p19-slot-label').textContent=grips.find(g=>g[0]===card.dataset.grip)[1];slot.querySelector('.p19-effect').textContent=task.effect;this.querySelector(`[data-task="${taskId}"]`).classList.add('solved');card.classList.add('placed');card.disabled=true;this.feedback(`${task.title}：${task.effect}`);const count=Object.keys(this.state.placed).length;this.querySelector('[data-progress]').textContent=`已匹配 ${count} / ${tasks.length}`;this.emit('game-progress',{grip:card.dataset.grip,task:taskId,matched:true});if(count===tasks.length){this.state.complete=true;this.feedback(`${tasks.length} 种任务，${tasks.length} 种有效动作`);this.querySelector('[data-progress]').textContent='分类完成';this.emit('game-complete',{score:tasks.length,metrics:{matched:count},trace:this.state.trace.slice()});}}
    feedback(s){this.querySelector('[data-feedback]').textContent=s;}
    emit(name,detail){this.dispatchEvent(new CustomEvent(name,{detail:{state:this.getState(),action:detail,metrics:{matched:Object.keys(this.state.placed).length}},bubbles:true,composed:true}));}
    start(){this.reset();this.dispatchEvent(new CustomEvent('game-start',{bubbles:true,composed:true}));}
    reset(){this.state=this.fresh();this.querySelectorAll('.p19-task').forEach(x=>x.classList.remove('solved','active','slip'));this.querySelectorAll('.p19-slot-label').forEach(x=>x.textContent='匹配握法放在这里');this.querySelectorAll('.p19-effect').forEach(x=>x.textContent='');this.querySelectorAll('.p19-card').forEach(x=>{x.disabled=false;x.classList.remove('placed','active');x.style.transform='';x.dataset.target=0;});this.feedback('观察每项任务需要的是传力、承托，还是方向控制。');this.querySelector('[data-progress]').textContent='等待匹配';this.dispatchEvent(new CustomEvent('game-reset',{bubbles:true,composed:true}));}
    getState(){return JSON.parse(JSON.stringify(this.state));}
  }
  customElements.define('grip-game',GripGame);
  Deck.init({index:19,total:50});
});
</script>
</body>
</html>
