<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .kicker{height:24px;color:var(--ochre);font-size:var(--fs-label);font-weight:700;letter-spacing:.16em}
  .task-shell{display:flex;gap:24px;height:100%;min-height:0}
  .flow-side{flex:1.65;display:flex;flex-direction:column;min-width:0;min-height:0}
  .control-side{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
  .task-axis{flex:1;align-items:stretch;border-bottom:10px solid rgba(197,106,50,.28);padding-bottom:10px;background:linear-gradient(to bottom,transparent 10%,rgba(197,106,50,.12) 10%,rgba(197,106,50,.12) 90%,transparent 90%)}
  .task-axis>.step{display:flex;flex-direction:column;justify-content:center;gap:9px;border-top-width:3px}
  .slot{height:360px;width:100%;border:1px dashed var(--line-strong);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
  .slot.filled{border-style:solid;color:var(--text)}
  .slot img{width:150px;height:112px;object-fit:contain;display:block;margin:0 auto 10px}
  .placeholder{height:78%;display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:20px 8px}
  .step-no{color:var(--muted);font-family:var(--font-mono);font-size:var(--fs-label)}
  .step-name{font-size:var(--fs-body);font-weight:700;line-height:1.35}
  .step-meta{font-size:var(--fs-sec);color:var(--muted);line-height:1.4}
  .action-tray{display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start}
  .action{flex:1 1 46%;min-height:58px;padding:8px 11px;border:1px solid var(--line-strong);border-radius:8px;background:transparent;color:var(--text);font:inherit;font-size:var(--fs-sec);line-height:1.35;text-align:left;cursor:grab}
  .action:hover,.action:focus-visible{border-color:var(--cyan);color:var(--cyan)}
  .action[aria-pressed="true"]{border-color:var(--ochre);box-shadow:inset 4px 0 0 var(--ochre)}
  .edge-track{height:14px;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden}
  .edge-fill{height:100%;width:0;background:var(--cyan);transition:width .25s ease}
  .feedback{min-height:52px;padding-left:14px;border-left:2px solid var(--cyan);font-size:var(--fs-sec);line-height:1.45;color:var(--muted)}
  .pulse{animation:pulse .45s ease 2}
  .broken{animation:kick .22s ease 2;border-color:var(--ochre)!important}
  @keyframes pulse{50%{color:var(--cyan);transform:scale(1.04)}}
  @keyframes kick{50%{transform:translateX(8px)}}
  @media(prefers-reduced-motion:reduce){.edge-fill{transition:none}.pulse,.broken{animation:none}}
</style>
</head>
<body data-page="20" data-total="50">
<div id="stage">
  <header style="height:88px">
    <div class="kicker">TASK CHAIN</div>
    <h1>一块石头怎样接管切割任务？</h1>
  </header>
  <main style="flex:1">
    <div class="task-shell">
      <section class="flow-side min0" aria-label="任务流程轴">
        <div style="position:relative;flex:1;min-height:0">
          <img src="assets/img/oldowan-chopper.png" alt="" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.08;pointer-events:none">
          <div class="k-process task-axis" id="flow" style="height:100%">
            <div class="axis"></div>
          </div>
        </div>
        <p class="small" style="height:28px;margin:8px 0 0">1 格为课堂模型单位，不是考古实测分钟。</p>
      </section>
      <aside class="panel control-side min0" aria-label="任务排程控制区">
        <div style="height:66px;display:flex;justify-content:space-between;align-items:center">
          <div><div class="small">任务时钟</div><span class="big sm num" id="clock">0</span><span class="unit">格</span></div>
          <div style="text-align:right"><div class="small">目标</div><span class="tag active">≤ <span id="target">—</span> 格</span></div>
        </div>
        <div style="height:64px">
          <div style="display:flex;justify-content:space-between;margin-bottom:7px"><span class="tag bio">刃缘</span><span class="tag active" id="edgeLabel">尚未取刃</span></div>
          <div class="edge-track" aria-hidden="true"><div class="edge-fill" id="edgeFill"></div></div>
        </div>
        <div class="hint" style="height:44px">按执行顺序点选动作，或拖到流程槽；换片可以留在外面。</div>
        <div class="action-tray min0" id="tray" style="flex:1"></div>
        <div class="feedback" id="feedback" aria-live="polite">先排出一条可执行的处理链。</div>
        <div class="btns" style="height:56px;gap:10px"><button class="btn lg" id="run">运行排程</button><span class="small">每一步的产出，都是下一步的条件。</span></div>
      </aside>
    </div>
  </main>
  <footer style="height:90px;display:flex;align-items:center;justify-content:space-between;gap:28px;border-top:1px solid var(--line)">
    <p class="lead" style="margin:0;max-width:980px">奥杜威工具把敲击、切割、刮削串成任务链，成为可更换的体外刃齿。</p>
    <p class="small" style="margin:0;max-width:420px">下一步：制造序列继续变长，工具会变成什么样？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
  Deck.init({index:20,total:50});
  const U=Lec.K.units, ONE=U.metresPerKilometre/U.joulesPerKilojoule;
  const TWO=ONE+ONE, THREE=TWO+ONE, FIVE=THREE+TWO, ELEVEN=FIVE+FIVE+ONE;
  const actions=[
    {id:'strike',name:'敲击取刃',time:THREE,need:[],edge:'获得两枚锋利石片',img:true},
    {id:'skin',name:'切开表皮',time:THREE,need:['strike'],edge:'磨损 2/3'},
    {id:'meat',name:'分割肉块',time:TWO,need:['skin'],edge:'钝化 3/3'},
    {id:'swap',name:'换上备用石片',time:ONE,need:['strike'],edge:'恢复锋利 0/3'},
    {id:'scrape',name:'刮除附着组织',time:TWO,need:['meat'],edge:'完成处理'}
  ];
  const initial=['meat','strike','scrape','swap','skin'];
  let state;
  const flow=document.getElementById('flow'),tray=document.getElementById('tray'),run=document.getElementById('run');
  function fresh(){return {order:[],remaining:initial.slice(),running:false,complete:false,time:0,edge:0,trace:[]};}
  function item(id){return actions.find(a=>a.id===id);}
  function snapshot(){return JSON.parse(JSON.stringify(state));}
  function render(){
    flow.innerHTML='<div class="axis"></div>';
    for(let i=0;i<actions.length;i++){
      const id=state.order[i], a=id&&item(id), step=document.createElement('div'); step.className='step'; step.dataset.index=i;
      if(state.trace.includes(id))step.classList.add('done');
      if(state.running&&state.current===id)step.setAttribute('aria-current','step');
      const slot=document.createElement('div');slot.className='slot'+(a?' filled':'');slot.dataset.index=i;
      slot.innerHTML=a?'<div>'+(a.img?'<img src="assets/img/oldowan-chopper.png" alt="奥杜威砍砸器" title="Galet MHNT PRE.2009.0.200.1.jpg · Didier Descouens · CC BY-SA 4.0">':'')+'<div class="step-no">'+String(i+ONE).padStart(2,'0')+'</div><div class="step-name">'+a.name+'</div><div class="step-meta">'+a.time+' 格 · '+a.edge+'</div></div>':'<div class="placeholder">'+(i===0?'<img src="assets/img/oldowan-chopper.png" alt="奥杜威砍砸器" title="Galet MHNT PRE.2009.0.200.1.jpg · Didier Descouens · CC BY-SA 4.0">':'<span class="tag neutral">等待前一步</span>')+'<div class="step-no">STEP '+String(i+ONE).padStart(2,'0')+'</div><div class="step-name">前一步产出</div><div class="step-meta">成为下一动作的条件</div></div>';
      slot.addEventListener('dragover',e=>e.preventDefault());slot.addEventListener('drop',drop);
      step.appendChild(slot);flow.appendChild(step);if(i<actions.length-ONE){let ar=document.createElement('div');ar.className='arw';flow.appendChild(ar);}
    }
    tray.innerHTML='';state.remaining.forEach(id=>{const a=item(id),b=document.createElement('button');b.className='action';b.draggable=true;b.dataset.id=id;b.innerHTML='<strong>'+a.name+'</strong><br><span class="small">'+a.time+' 格</span>';b.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',id));b.addEventListener('click',()=>place(id));tray.appendChild(b);});
    document.getElementById('clock').textContent=state.time;document.getElementById('target').textContent=ELEVEN;
    document.getElementById('edgeFill').style.width=(state.edge/THREE*100)+'%';
  }
  function place(id,index){if(state.running)return;const old=state.order.indexOf(id);if(old>=0)state.order.splice(old,ONE);state.remaining=state.remaining.filter(x=>x!==id);if(index==null)state.order.push(id);else state.order.splice(index,0,id);render();emit('game-progress',{action:'place'});}
  function drop(e){e.preventDefault();place(e.dataTransfer.getData('text/plain'),Number(e.currentTarget.dataset.index));}
  function emit(name,detail){document.dispatchEvent(new CustomEvent(name,{bubbles:true,detail:Object.assign({state:snapshot()},detail||{})}));}
  function reset(){state=fresh();run.textContent='运行排程';document.getElementById('feedback').textContent='先排出一条可执行的处理链。';document.getElementById('edgeLabel').textContent='尚未取刃';render();emit('game-reset');}
  async function execute(){
    if(state.order.length<actions.length-ONE){document.getElementById('feedback').textContent='还需排入四个必需动作；只有“换片”可以省略。';return;}
    state.running=true;run.disabled=true;state.time=0;state.edge=0;state.trace=[];emit('game-start');
    const completed=[];
    for(const id of state.order){const a=item(id);state.current=id;render();
      if(!a.need.every(n=>completed.includes(n))){document.getElementById('feedback').textContent='流程断在“'+a.name+'”：前一步还没有提供条件。';const cur=flow.querySelector('[aria-current="step"]');if(cur)cur.classList.add('broken');state.running=false;run.disabled=false;emit('game-progress',{action:'blocked'});return;}
      let cost=a.time;if(id==='scrape'&&!completed.includes('swap'))cost=FIVE;
      state.time+=cost;completed.push(id);state.trace.push(id);
      if(id==='strike'||id==='swap')state.edge=0;if(id==='skin')state.edge=TWO;if(id==='meat')state.edge=THREE;
      document.getElementById('edgeLabel').textContent=a.edge;render();
      if(!Deck.reduced())await new Promise(r=>setTimeout(r,420));
    }
    state.running=false;state.complete=completed.includes('scrape');run.disabled=false;run.textContent='重置排程';
    const win=state.complete&&state.time<=ELEVEN;document.getElementById('feedback').textContent=win?'达成任务：换片多一步，却让整条链更短。':'任务完成，但钝刃让最后刮削耗时增加。';
    if(win)document.getElementById('clock').classList.add('pulse');emit('game-complete',{score:state.time,metrics:{withinTarget:win},trace:state.trace.slice()});render();
  }
  run.addEventListener('click',()=>state.complete?reset():execute());
  state=fresh();render();
  window.taskChainGame={start:execute,reset:reset,getState:snapshot};
});
</script>
</body>
</html>
