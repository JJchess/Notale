<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .kicker{color:var(--ochre);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.14em;margin-bottom:3px}
  .compare{grid-template-rows:260px repeat(4,1fr) 1.15fr}
  .compare>.hdr{align-self:stretch}
  .artifact-head{padding:8px 12px!important}
  .object-title{display:flex;align-items:center;justify-content:space-between;gap:12px;height:30px}
  .sequence{height:190px;display:flex;align-items:center;justify-content:center;gap:18px;color:var(--ochre)}
  .strike{width:54px;height:54px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;font:650 var(--fs-h2)/1 var(--font-mono);animation:hit 1.8s both}
  .strike:nth-child(2){animation-delay:.18s}.strike:nth-child(3){animation-delay:.36s}
  .trace{width:52px;height:2px;background:var(--ochre);position:relative}.trace:after{content:"›";position:absolute;right:-3px;top:-15px;font-size:22px}
  .reveal{--reveal-x:50%;--reveal-y:50%;--reveal-radius:0px;position:relative;height:214px;overflow:hidden;isolation:isolate;margin:0;border-radius:10px;background:transparent;touch-action:none}
  .axe-img{position:absolute;inset:4px 0 4px 0;width:100%;height:calc(100% - 8px);object-fit:contain;object-position:center;filter:sepia(.35) saturate(.85)}
  .mirror-layer{position:absolute;z-index:1;inset:4px 0;width:100%;height:calc(100% - 8px);opacity:.7;filter:sepia(0) saturate(1.5) hue-rotate(135deg) brightness(1.25);clip-path:polygon(50% 0,100% 0,100% 100%,50% 100%);-webkit-mask-image:radial-gradient(circle var(--reveal-radius) at var(--reveal-x) var(--reveal-y),#000 0%,#000 40%,rgb(0 0 0/.75) 60%,rgb(0 0 0/.4) 75%,rgb(0 0 0/.12) 88%,transparent 100%);mask-image:radial-gradient(circle var(--reveal-radius) at var(--reveal-x) var(--reveal-y),#000 0%,#000 40%,rgb(0 0 0/.75) 60%,rgb(0 0 0/.4) 75%,rgb(0 0 0/.12) 88%,transparent 100%);will-change:mask-image}
  .axis-svg{position:absolute;z-index:3;inset:0;width:100%;height:100%;overflow:hidden}
  .axis-line{stroke:var(--cyan);stroke-width:3}.axis-handle{fill:var(--bg);stroke:var(--cyan);stroke-width:4;cursor:ew-resize}
  .axis-handle:focus{outline:none;stroke:var(--text);stroke-width:6}
  .readout{position:absolute;z-index:4;right:10px;bottom:8px;padding:5px 9px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);font-size:var(--fs-sec)}
  .toolbar{position:absolute;z-index:5;left:8px;right:82px;bottom:6px;display:flex;align-items:center;gap:8px}.toolbar .hint{min-width:0;white-space:nowrap}
  .toolbar .btn{min-height:36px;min-width:92px;padding:5px 10px;font-size:var(--fs-label)}
  .cell strong{color:var(--text)}
  .handoff{color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
  @keyframes hit{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.strike{animation:none}.mirror{transition:none}}
</style>
</head>
<body data-page="21" data-total="50">
<div id="stage">
  <header style="height:76px">
    <div class="kicker">TOOL SEQUENCE</div>
    <h1>对称，是结果，不是答案</h1>
  </header>
  <main class="min0" style="display:flex">
    <section class="k-comparison compare min0" style="--compare-n:2" aria-label="简单石片与典型阿舍利手斧比较">
      <div class="dim" style="padding-top:18px">比较对象</div>
      <div class="hdr artifact-head min0">
        <div class="object-title"><span>简单石片</span><span class="tag bio">短序列</span></div>
        <div class="sequence" aria-label="少数关键击打形成锋刃">
          <span class="strike">落点</span><span class="trace"></span><span class="strike">剥片</span><span class="trace"></span><span class="strike">锋刃</span>
        </div>
      </div>
      <div class="hdr artifact-head diff min0">
        <div class="object-title"><span>典型阿舍利手斧</span><span class="tag active">持续校正</span></div>
        <figure class="cvbox reveal no-pan" id="reveal" data-reveal-hover data-reveal-radius="150" title="Lower Palaeolithic Handaxe (FindID 187972).jpg · Winchester Museum Service, Robert Webley, 2007-07-27 17:22:29 · CC BY-SA 2.0">
          <img class="axe-img" src="assets/img/acheulean-handaxe.png" alt="一件轮廓近似双侧对称、局部仍不规则的阿舍利手斧">
          <svg class="mirror-layer" viewBox="0 0 600 206" aria-hidden="true"><image id="mirror" href="assets/img/acheulean-handaxe.png" width="600" height="206" preserveAspectRatio="xMidYMid meet"/></svg>
          <svg class="axis-svg" id="axis" viewBox="0 0 600 214" aria-label="可调整的手斧对称轴">
            <line id="axisLine" class="axis-line" x1="353" y1="18" x2="247" y2="196"/>
            <circle id="topHandle" class="axis-handle" role="slider" tabindex="0" aria-label="对称轴上端点" aria-valuemin="-15" aria-valuemax="15" aria-valuenow="10" cx="353" cy="18" r="11"/>
            <circle id="bottomHandle" class="axis-handle" role="slider" tabindex="0" aria-label="对称轴下端点" aria-valuemin="-15" aria-valuemax="15" aria-valuenow="10" cx="247" cy="196" r="11"/>
          </svg>
          <div class="toolbar"><button class="btn" id="reset" type="button">复位轴线</button><span class="hint">拖端点；移动指针看反射差异</span></div>
          <div class="readout" aria-live="polite"><span class="num" id="angle">+10</span><span class="unit">°</span></div>
        </figure>
      </div>

      <div class="rowline"></div><div class="dim">首要目标</div><div class="cell">获得可用锋刃</div><div class="cell diff">持续控制整体形状与刃缘</div>
      <div class="rowline"></div><div class="dim">制造过程</div><div class="cell">少数关键击打即可使用</div><div class="cell diff">多轮翻面、修整与校正</div>
      <div class="rowline"></div><div class="dim">对称要求</div><div class="cell">不必围绕统一轴组织</div><div class="cell diff">常见近似双侧对称，<strong>并非件件规整</strong></div>
      <div class="rowline"></div><div class="dim">可以推断</div><div class="cell">能选择落点与刃缘</div><div class="cell diff">需要更长行动序列；持续比较两侧</div>
      <div class="rowline"></div><div class="dim">不能单独推断</div><div class="cell">—</div><div class="cell diff"><strong>已有现代语言、审美或艺术观念</strong></div>
    </section>
  </main>
  <footer style="height:92px;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:36px">
    <p class="lead" style="max-width:900px;margin:0">阿舍利手斧需要更长的制造序列；对称却不能单独证明现代语言或艺术。</p>
    <p class="handoff" style="max-width:470px;margin:0">下一步：真正改写食物能量账的火，证据能追到多早？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  Deck.init({index:21,total:50});
  var box=document.getElementById('reveal'), svg=document.getElementById('axis');
  var line=document.getElementById('axisLine'), topH=document.getElementById('topHandle'), bottomH=document.getElementById('bottomHandle');
  var mirror=document.getElementById('mirror'), output=document.getElementById('angle');
  var MIN=-(Lec.K.units.minutesPerHour/4), MAX=Lec.K.units.minutesPerHour/4;
  var INITIAL=Lec.K.units.metresPerKilometre*Lec.K.units.metresPerCentimetre;
  var angle=INITIAL, active=null, frame=0, inside=false, radius=0, targetRadius=0, px=300, py=107, tx=300, ty=107;
  function render(){
    var rad=angle*Math.PI/180, dy=178, dx=Math.tan(rad)*dy;
    var x1=300+dx/2, x2=300-dx/2;
    line.setAttribute('x1',x1); line.setAttribute('x2',x2);
    topH.setAttribute('cx',x1); bottomH.setAttribute('cx',x2);
    topH.setAttribute('aria-valuenow',angle.toFixed(0)); bottomH.setAttribute('aria-valuenow',angle.toFixed(0));
    output.textContent=(angle>=0?'+':'')+angle.toFixed(0);
    mirror.setAttribute('transform','rotate('+angle+' 300 103) translate(600 0) scale(-1 1) rotate('+(-angle)+' 300 103)');
  }
  function setAngle(v){angle=Deck.clamp(v,MIN,MAX);render()}
  function pointerAngle(e,which){var p=Deck.pt(svg,e), other=which==='top'?Number(bottomH.getAttribute('cx')):Number(topH.getAttribute('cx'));var raw=Math.atan(((which==='top'?p.x-other:other-p.x))/178)*180/Math.PI;setAngle(raw)}
  [topH,bottomH].forEach(function(h){
    h.addEventListener('pointerdown',function(e){active=h===topH?'top':'bottom';h.setPointerCapture(e.pointerId);pointerAngle(e,active)});
    h.addEventListener('pointermove',function(e){if(active)pointerAngle(e,active)});
    h.addEventListener('pointerup',function(){active=null;mirror.style.opacity='.95';setTimeout(function(){mirror.style.opacity='.7'},220)});
    h.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();setAngle(angle-1)}if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();setAngle(angle+1)}if(e.key==='Home'){e.preventDefault();setAngle(MIN)}if(e.key==='End'){e.preventDefault();setAngle(MAX)}});
  });
  document.getElementById('reset').addEventListener('click',function(){setAngle(INITIAL)});
  function schedule(){if(!frame)frame=requestAnimationFrame(tick)}
  function tick(){frame=0;var direct=Deck.reduced();var pe=direct?1:.1,re=direct?1:.14;px+=(tx-px)*pe;py+=(ty-py)*pe;radius+=(targetRadius-radius)*re;box.style.setProperty('--reveal-x',px.toFixed(2)+'px');box.style.setProperty('--reveal-y',py.toFixed(2)+'px');box.style.setProperty('--reveal-radius',radius.toFixed(2)+'px');if(Math.abs(tx-px)>.1||Math.abs(ty-py)>.1||Math.abs(targetRadius-radius)>.1)schedule()}
  function point(e){var p=Deck.pt(box,e);tx=p.x;ty=p.y;if(!inside){inside=true;px=tx;py=ty;targetRadius=150}schedule()}
  box.addEventListener('pointerenter',point);box.addEventListener('pointermove',point);box.addEventListener('pointerleave',function(){inside=false;targetRadius=0;schedule()});box.addEventListener('pointercancel',function(){inside=false;targetRadius=0;schedule()});
  render();
});
</script>
</body>
</html>
