<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="23" data-total="50">
<div id="stage">
  <style>
    .kicker{height:24px;color:var(--ochre);font:700 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.14em}
    .titlebar{height:66px;display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
    .titlebar h1{margin:0}.pool-read{display:flex;align-items:baseline;gap:10px;color:var(--muted);font-size:var(--fs-sec)}
    .pool-read strong{color:var(--cyan);font:650 32px/1 var(--font-mono)}
    risk-sharing-game{display:block;height:100%;min-height:0}
    .boundary{position:relative;height:100%;border:2px solid var(--cyan);border-radius:18px;padding:16px 20px;box-shadow:inset 0 0 34px rgba(69,214,232,.06)}
    .class-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.28}.class-lines path{fill:none;stroke:var(--cyan);stroke-width:2}.boundary>*:not(.class-lines){position:relative;z-index:1}
    .pool-head{display:flex;align-items:center;justify-content:space-between;gap:20px;height:54px}
    .pool-head .bt{font-size:var(--fs-h2);font-weight:680}.pool-head .hint{margin:0}
    .allocator{position:relative;height:72px;padding:8px 0 18px}
    .track{position:relative;display:flex;height:34px;border:1px solid var(--line-strong);border-radius:8px;overflow:visible;background:var(--panel)}
    .seg{min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;transition:flex-basis 220ms ease-out}
    .seg+ .seg{border-left:1px solid var(--bg)}
    .chip{width:18px;height:18px;border:2px solid var(--ochre);border-radius:50%;background:rgba(197,106,50,.38);animation:chipIn 440ms ease-out both}
    .handle{position:absolute;z-index:3;top:-7px;width:18px;height:48px;border:2px solid var(--bg);border-radius:8px;background:var(--cyan);transform:translateX(-50%);cursor:ew-resize;touch-action:none}
    .handle:focus-visible{outline:3px solid var(--text);outline-offset:3px}
    .categories{display:flex;gap:16px;height:292px}
    .category{flex:1;display:flex;flex-direction:column;min-width:0;transition:transform 220ms ease-out,border-color 220ms ease-out}
    .category .bt{display:flex!important;justify-content:space-between;gap:12px}.category .lv{flex:1;margin-left:0}
    .facts{display:flex;gap:18px;margin:0 0 10px;color:var(--muted);font-size:var(--fs-sec)}
    .allocation{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:var(--fs-body)}
    .allocation strong{color:var(--ochre);font:650 28px/1 var(--font-mono)}
    .identity{min-height:49px;margin:8px 0 0;color:var(--cyan);font-size:var(--fs-sec);line-height:1.45}
    .category.unmet{transform:translateY(8px);border-color:var(--ochre)}
    .category.freerider{border-style:dashed}.category.freerider .identity{color:var(--ochre)}
    .controlbar{height:92px;display:flex;align-items:center;gap:24px;margin-top:12px}
    .controlbar .btns{gap:10px}.result{flex:1;display:flex;gap:28px;align-items:center;min-width:0}
    .metric{font-size:var(--fs-sec);color:var(--muted)}.metric b{margin-left:8px;color:var(--text);font:650 26px/1 var(--font-mono)}
    .feedback{flex:1;margin:0;font-size:var(--fs-sec);line-height:1.45;color:var(--muted)}
    .footer{height:86px;display:flex;align-items:center;justify-content:space-between;gap:36px;border-top:1px solid var(--line)}
    .footer .lead{margin:0;max-width:880px}.next{margin:0;max-width:510px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
    @keyframes chipIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
    @keyframes tighten{50%{transform:scale(.985)}100%{transform:none}}
    .boundary.checking .category{animation:tighten 260ms ease-out}
    @media(prefers-reduced-motion:reduce){.chip{animation:none}.seg,.category{transition:none}.boundary.checking .category{animation:none}}
  </style>
  <div class="kicker">RISK SHARING</div>
  <header class="titlebar">
    <h1>一份猎物该分给谁？</h1>
    <div class="pool-read">共同食物池剩余 <strong id="remainingTop">0</strong><span>份</span></div>
  </header>
  <main class="min0">
    <risk-sharing-game></risk-sharing-game>
  </main>
  <footer class="footer">
    <p class="lead">分享把饥饿风险转移给群体，也把“谁应得到”变成群体必须处理的问题。</p>
    <p class="next">下一步：一套做法怎样被下一代学会，而不是每次重新发明？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded',()=>{
  Deck.init({index:23,total:50});
  const K=Lec.K;
  const HALF=K.human.typicalWaterNeedLitresPerDay*2;
  const TOTAL=HALF*3;
  const MIN_COMMON=K.units.hoursPerDay/6;
  const MIN_NEED=HALF;
  const MAX=K.human.typicalWaterNeedLitresPerDay*4;
  const GUARD=K.units.hoursPerDay/8;
  const ZERO=K.units.percentAsFraction-K.units.percentAsFraction;

  class RiskSharingGame extends HTMLElement{
    constructor(){super();this.rng=new Math.seedrandom('risk-sharing-23');this.trace=[];this.state=this.fresh();}
    fresh(){return {alloc:[HALF,HALF,HALF],revealed:false,identity:null,complete:false};}
    connectedCallback(){this.render();this.bind();this.start();}
    start(){this.dispatchEvent(new CustomEvent('game-start',{bubbles:true,composed:true,detail:{state:this.getState()}}));}
    reset(){this.state=this.fresh();this.trace=[];this.render();this.bind();this.dispatchEvent(new CustomEvent('game-reset',{bubbles:true,composed:true}));}
    getState(){return JSON.parse(JSON.stringify(this.state));}
    render(){
      const names=['追踪与猎取者','守夜与驱赶者','今日未出工者'];
      const contributions=[HALF,GUARD,ZERO], needs=[MIN_COMMON,MIN_COMMON,MIN_NEED];
      const token=(n)=>Array.from({length:n},(_,i)=>`<i class="chip" style="animation-delay:${i*35}ms"></i>`).join('');
      this.innerHTML=`<section class="k-classification boundary ${this.state.complete?'checking':''}" aria-label="共同猎物的领取资格">
        <svg class="class-lines" viewBox="0 0 1400 600" preserveAspectRatio="none" aria-hidden="true"><path d="M700 30 V118 M700 118 H240 V170 M700 118 V170 M700 118 H1160 V170"/></svg>
        <div class="pool-head"><span class="bt">共同猎物：<span class="num">${TOTAL}</span> 份</span><p class="hint">拖动两条青色分界线；方向键可微调</p></div>
        <div class="allocator no-pan" aria-label="食物分配条"><div class="track">${this.state.alloc.map((v,i)=>`<div class="seg" style="flex-basis:${v/TOTAL*100}%" aria-hidden="true">${token(v)}</div>`).join('')}<div class="handle" data-h="0" role="slider" tabindex="0" aria-label="第一条分界线" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${this.state.alloc[0]}"></div><div class="handle" data-h="1" role="slider" tabindex="0" aria-label="第二条分界线" aria-valuemin="5" aria-valuemax="15" aria-valuenow="${this.state.alloc[0]+this.state.alloc[1]}"></div></div></div>
        <div class="lv min0"><div class="categories">
        ${names.map((n,i)=>`<section class="box category ${this.state.complete&&this.state.alloc[i]<needs[i]?'unmet':''} ${this.state.identity==='搭便车'&&i===2?'freerider':''}"><span class="bt"><span>${n}</span><span class="tag ${i<2?'bio':'neutral'}">领取资格</span></span><div class="lv panel"><p class="facts"><span>今日贡献 <b class="num">${contributions[i]}</b> 点</span><span>今夜最低需要 <b class="num">${needs[i]}</b> 份</span></p><p class="small">${i===0?'直接取得食物':i===1?'守护营地，避免猎物损失':'贡献暂时不可见，原因尚未揭示'}</p><p class="identity">${i===2&&this.state.revealed?'未出工原因：'+this.state.identity:'身份将在“过夜”后揭示'}</p><div class="allocation">获得 <strong>${this.state.alloc[i]}</strong> 份</div></div></section>`).join('')}
        </div></div>
        <div class="panel controlbar"><div class="btns"><button class="btn lg" id="submit">过夜</button><button class="btn" id="reset">重新分配</button></div><div class="result" aria-live="polite"><span class="metric">需求覆盖人数 <b>${this.metrics().covered}/${names.length}</b></span><span class="metric">合作意愿 <b>${this.metrics().will}</b></span><p class="feedback">${this.feedback()}</p></div></div>
      </section>`;
      document.getElementById('remainingTop').textContent=TOTAL-this.state.alloc.reduce((a,b)=>a+b,ZERO);
      this.positionHandles();
    }
    metrics(){const needs=[MIN_COMMON,MIN_COMMON,MIN_NEED];const covered=this.state.alloc.filter((v,i)=>v>=needs[i]).length;let will='待观察';if(this.state.complete) will=(this.state.identity==='搭便车'&&this.state.alloc[2]>=MIN_NEED)||(this.state.alloc[0]<MIN_COMMON||this.state.alloc[1]<MIN_COMMON)?'下降':'维持';return {covered,will};}
    feedback(){if(!this.state.complete)return '目标：不让真正需要者挨饿，同时维持下一轮合作。';if(this.state.identity==='搭便车'&&this.state.alloc[2]>=MIN_NEED)return '需求看似覆盖，但未承担成本者获得较多，贡献者的合作意愿下降。';if(this.metrics().covered<3&&this.state.identity!=='搭便车')return '有真正需要者未达到今夜门槛。';if(this.state.alloc[0]<MIN_COMMON||this.state.alloc[1]<MIN_COMMON)return '贡献者未达到最低需要，下一轮合作难以维持。';return '真正需要者得到照顾，贡献者也保有继续合作的条件。';}
    positionHandles(){const hs=this.querySelectorAll('.handle');hs[0].style.left=(this.state.alloc[0]/TOTAL*100)+'%';hs[1].style.left=((this.state.alloc[0]+this.state.alloc[1])/TOTAL*100)+'%';}
    setBoundary(which,value){let a=this.state.alloc.slice();if(which===0){const end=a[0]+a[1];a[0]=Math.max(ZERO,Math.min(MAX,value));a[1]=end-a[0];}else{const end=Math.max(HALF,Math.min(TOTAL,value));a[1]=end-a[0];a[2]=TOTAL-end;}if(a.every(v=>v>=ZERO&&v<=MAX)){this.state.alloc=a;this.state.complete=false;this.state.revealed=false;this.state.identity=null;this.trace.push(a.slice());this.render();this.bind();this.dispatchEvent(new CustomEvent('game-progress',{bubbles:true,composed:true,detail:{state:this.getState(),action:'allocate',metrics:this.metrics()}}));}}
    bind(){const track=this.querySelector('.track');this.querySelectorAll('.handle').forEach(h=>{const which=+h.dataset.h;h.addEventListener('pointerdown',e=>{h.setPointerCapture(e.pointerId)});h.addEventListener('pointermove',e=>{if(!h.hasPointerCapture(e.pointerId))return;const p=Deck.pt(track,e);this.setBoundary(which,Math.round(p.x/track.offsetWidth*TOTAL));});h.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const cur=which===0?this.state.alloc[0]:this.state.alloc[0]+this.state.alloc[1];this.setBoundary(which,cur+(e.key==='ArrowRight'?1:-1));}});});this.querySelector('#submit').onclick=()=>{const ids=['照料幼儿','受伤','搭便车'];this.state.identity=ids[Math.floor(this.rng()*ids.length)];this.state.revealed=true;this.state.complete=true;this.render();this.bind();this.dispatchEvent(new CustomEvent('game-complete',{bubbles:true,composed:true,detail:{score:this.metrics().covered,metrics:this.metrics(),trace:this.trace.slice()}}));};this.querySelector('#reset').onclick=()=>this.reset();}
  }
  customElements.define('risk-sharing-game',RiskSharingGame);
});
</script>
</body>
</html>
