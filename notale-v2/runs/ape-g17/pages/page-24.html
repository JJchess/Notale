<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="24" data-total="50">
<div id="stage">
  <style>
    .kicker{height:22px;color:var(--ochre);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.12em}
    .chain{border-bottom:1px solid var(--line);background:linear-gradient(to bottom,rgba(197,106,50,.13) 0 31%,transparent 31% 35%,rgba(53,67,74,.22) 35% 66%,transparent 66% 70%,rgba(69,214,232,.09) 70% 100%)}
    .chain .step{display:flex;flex-direction:column;gap:11px;transition:opacity 240ms ease-out,transform 240ms ease-out,border-color 240ms ease-out}
    .chain h3{margin:0;font-size:var(--fs-sec)}
    .words{display:flex;flex-direction:column;flex-wrap:nowrap;gap:7px;align-content:flex-start}
    .step .words{flex:1;justify-content:space-evenly}
    .step .word{display:block;width:100%;text-align:center}
    .slot{display:block;width:100%;height:29px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:var(--fs-label);line-height:27px;text-align:center}
    .word{padding:5px 7px;border:1px solid var(--ochre);border-radius:6px;color:var(--ochre);font-size:var(--fs-label);line-height:1.35;white-space:nowrap}
    .word.err{border-color:var(--line-strong);color:var(--muted);transform:translateY(3px)}
    .word.fix{border-color:var(--cyan);color:var(--cyan)}
    .empty{color:var(--muted);font-size:var(--fs-sec);line-height:1.5}
    .review{min-height:24px;color:var(--cyan);font-size:var(--fs-label);line-height:1.4}
    .choice{display:flex;align-items:center;gap:14px;padding:10px 14px;min-height:60px}
    .choice .words{flex:1;flex-direction:row;flex-wrap:wrap}
    .choice .word{padding:3px 6px}
    .choice-kind{flex:0 0 92px;color:var(--muted);font-size:var(--fs-label)}
    .choice[aria-pressed="true"]{border-color:var(--cyan);box-shadow:inset 4px 0 0 var(--cyan)}
    .reading{display:flex;align-items:center;gap:12px}
    .reading .big.sm{font-size:30px}
    .flow-in{animation:flowIn 430ms ease-out both}
    .corrected::after{content:"↶";position:absolute;top:-30px;right:18px;color:var(--cyan);font:700 30px/1 var(--font-mono)}
    @keyframes flowIn{from{opacity:.25;transform:translateX(-18px)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){.chain .step,.choice{transition:none}.flow-in{animation:none}.word.err{transform:none}}
  </style>
  <header style="height:84px">
    <div class="kicker">CULTURAL TRANSMISSION</div>
    <h1>传一遍石器口诀</h1>
  </header>

  <main class="min0" style="display:flex;flex-direction:column;gap:14px">
    <section id="chain" class="k-process chain min0" style="height:220px;flex:none" aria-label="原口诀经过五次转述的传递链">
      <div class="axis" aria-hidden="true"></div>
    </section>

    <section class="min0" style="display:flex;flex:1;gap:18px">
      <div class="panel min0" style="display:flex;flex:1.3;flex-direction:column;padding:14px 18px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:18px;height:34px">
          <strong id="turnLabel" style="font-size:var(--fs-body)">学徒一听到后，哪种转述更值得传下去？</strong>
          <span class="tag active" id="errorTag">选择一项</span>
        </div>
        <div id="choices" class="btns min0" style="display:flex;flex:1;flex-direction:column;align-items:stretch;justify-content:center;gap:8px" aria-label="三种候选口诀"></div>
        <div class="btns" style="gap:10px;height:50px">
          <button class="btn lg" id="passBtn" disabled>传给下一人</button>
          <button class="btn" id="resetBtn">重新传递</button>
          <span class="hint" id="hint">先比较词块，再选择一项。</span>
        </div>
      </div>

      <aside class="panel min0" style="display:flex;flex:1.2;flex-direction:column;justify-content:space-between;padding:16px 20px">
        <div style="display:flex;gap:24px">
          <div class="reading"><span class="tag neutral">当前代</span><span class="big sm" id="generation">0/5</span></div>
          <div class="reading"><span class="tag bio">保真</span><span class="big sm" id="fidelity">5/5</span></div>
        </div>
        <div class="reading"><span class="tag neutral">累计误差</span><span class="big sm" id="errors">0</span></div>
        <p id="feedback" class="lead" aria-live="polite" style="margin:0">逐位对照原口诀再选择。<br>漏掉，会让一步消失。<br>替换，会改变动作含义。<br>换序，会打乱先后关系。<br>每次传递都会保留一个版本。<br>下一人只依据这个新版本。<br>教学最多纠正一处已出现的误差。<br>修正不能找回所有变化。<br>被保留的也可能包括误差。<br>最终按原位置与含义核对保真。</p>
      </aside>
    </section>
  </main>

  <footer style="height:86px;display:flex;align-items:center;justify-content:space-between;gap:28px;border-top:1px solid var(--line)">
    <p class="lead" style="max-width:940px;margin:0">技能经模仿和教学传递时会出现误差、修正与保留，文化不是无损复制。</p>
    <p class="small" style="max-width:580px;margin:0">一次口诀会走样；传播扩大到整个人群，文化会比身体变化快多少？</p>
  </footer>
  <script src="assets/lib/seedrandom.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded',function(){
    Deck.init({index:24,total:50});
    const original=['选核','定台','斜击','取片','验刃'];
    const titles=['原口诀','学徒一','学徒二','学徒三','教学复核','学徒五'];
    const replacements=['猛砸','磨平','丢核'];
    let state;
    const chain=document.getElementById('chain'),choices=document.getElementById('choices');
    const passBtn=document.getElementById('passBtn'),resetBtn=document.getElementById('resetBtn');
    const clone=a=>a.map(x=>x);
    function fresh(){return{generation:0,versions:[clone(original)],selected:null,candidates:[],errors:0,corrected:false,rng:new Math.seedrandom('culture-chain-24'),complete:false};}
    function fidelity(words){return original.reduce((n,w,i)=>n+(words[i]===w?1:0),0);}
    function makeCandidate(type){
      const a=clone(state.versions[state.generation]);
      if(type==='漏掉'){const live=a.map((x,i)=>x!==null?i:null).filter(x=>x!==null);a[live[Math.floor(state.rng()*live.length)]]=null;}
      if(type==='替换'){const i=Math.floor(state.rng()*a.length);a[i]=replacements[Math.floor(state.rng()*replacements.length)];}
      if(type==='换序'){const i=Math.floor(state.rng()*(a.length-1));[a[i],a[i+1]]=[a[i+1],a[i]];}
      return{kind:type,words:a};
    }
    function prepare(){state.candidates=['漏掉','替换','换序'].map(makeCandidate);state.selected=null;}
    function wordHTML(words,fixedIndex){return words.map((w,i)=>`<span class="word ${w!==original[i]?'err':''} ${i===fixedIndex?'fix':''}">${w===null?'（漏）':w}</span>`).join('');}
    function renderChain(fixedIndex){
      chain.innerHTML='<div class="axis" aria-hidden="true"></div>';
      titles.forEach((title,i)=>{
        const s=document.createElement('article');s.className='step'+(i<state.generation?' done':'')+(i===state.generation?' flow-in':'')+(i===4&&state.corrected?' corrected':'');
        if(i===state.generation&&!state.complete)s.setAttribute('aria-current','step');
        const v=state.versions[i];
        s.innerHTML=`<h3>${title}</h3><div class="words">${v?wordHTML(v,i===4?fixedIndex:-1):'<span class="slot">词块待传</span><span class="slot">词块待传</span><span class="slot">词块待传</span><span class="slot">词块待传</span><span class="slot">词块待传</span>'}</div><div class="review">${i===4&&state.corrected?'教师示范：修正最早错误':''}</div>`;
        chain.appendChild(s);if(i<titles.length-1){const a=document.createElement('div');a.className='arw';a.setAttribute('aria-hidden','true');chain.appendChild(a);}
      });
    }
    function render(fixedIndex=-1){
      renderChain(fixedIndex);
      document.getElementById('generation').textContent=state.generation+'/'+(titles.length-1);
      document.getElementById('fidelity').textContent=fidelity(state.versions[state.generation])+'/'+original.length;
      document.getElementById('errors').textContent=state.errors;
      const label=document.getElementById('turnLabel'),tag=document.getElementById('errorTag');
      choices.innerHTML='';
      if(state.complete){
        label.textContent='传递结束';tag.textContent=fidelity(state.versions[state.generation])>=original.length-1?'完成':'需要重试';
        passBtn.disabled=true;document.getElementById('hint').textContent='重新传递会恢复同一组候选顺序。';
        document.getElementById('feedback').textContent=fidelity(state.versions[state.generation])>=original.length-1?'保留了大部分步骤：教学修正了一处，但传递仍留下变化。':'误差已累积，试着更谨慎地传。';return;
      }
      label.textContent=titles[state.generation+1]+'听到后，哪种转述更值得传下去？';tag.textContent='选择一项';
      state.candidates.forEach((c,i)=>{const b=document.createElement('button');b.className='choice btn';b.setAttribute('aria-pressed',state.selected===i);b.innerHTML=`<span class="choice-kind">${c.kind}</span><span class="words">${wordHTML(c.words,-1)}</span>`;b.onclick=()=>{state.selected=i;passBtn.disabled=false;tag.textContent=c.kind;render();};choices.appendChild(b);});
      passBtn.disabled=state.selected===null;document.getElementById('hint').textContent='先比较词块，再选择一项。';
    }
    function pass(){if(state.selected===null||state.complete)return;let next=clone(state.candidates[state.selected].words);state.errors++;
      state.generation++;let fixed=-1;
      if(state.generation===4){fixed=next.findIndex((w,i)=>w!==original[i]);if(fixed>=0){next[fixed]=original[fixed];state.corrected=true;}}
      state.versions.push(next);state.complete=state.generation===titles.length-1;if(!state.complete)prepare();render(fixed);
    }
    function reset(){state=fresh();prepare();render();}
    passBtn.addEventListener('click',pass);resetBtn.addEventListener('click',reset);reset();
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
