<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="26" data-total="50">
<div id="stage">
  <style>
    .kicker{color:var(--ochre);font:700 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.16em;margin:0 0 4px}
    .globe-node{min-width:42px;min-height:42px;padding:0 11px;border:2px solid var(--ochre);border-radius:999px;background:var(--bg);color:var(--text);font:700 var(--fs-sec)/1 var(--font-sans);cursor:pointer;box-shadow:0 0 0 5px rgba(197,106,50,.16)}
    .globe-node.current{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 7px rgba(69,214,232,.18),0 0 22px rgba(69,214,232,.45)}
    .globe-node.done{border-color:var(--cyan);background:var(--cyan);color:var(--bg)}
    .globe-node:disabled{cursor:not-allowed;opacity:.42}
    .globe-node:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
    #globe canvas{outline:none}
    .site-photo{position:absolute;left:18px;bottom:18px;width:238px;height:132px;border:1px solid var(--ochre);border-radius:10px;object-fit:cover;box-shadow:0 12px 30px rgba(0,0,0,.4)}
    .route-note{position:absolute;right:16px;top:14px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:rgba(11,15,18,.78);color:var(--muted);font-size:var(--fs-label);line-height:1.4}
    .detail{position:absolute;right:22px;bottom:18px;width:430px;padding:16px 18px;border-left:3px solid var(--cyan);background:rgba(11,15,18,.84)}
    .detail h2{margin-bottom:5px}.detail p{margin:0;font-size:var(--fs-sec);line-height:1.5}
    .relay-tags{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
    .k-process>.step{padding:10px 12px}.k-process>.step h3{font-size:var(--fs-sec);margin:0 0 3px}.k-process>.step p{font-size:var(--fs-label);line-height:1.4;margin:0;color:var(--muted)}
    .k-process>.step.pending{opacity:.48}.k-process>.arw{flex-basis:34px;width:34px}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  </style>
  <header style="height:92px">
    <p class="kicker">MIGRATION RELAY</p>
    <h1>迁徙不是一次英雄远征</h1>
  </header>
  <main class="min0" style="display:flex;flex-direction:column;gap:12px">
    <section class="cvbox min0 no-pan" style="flex:1;border:1px solid var(--line)" aria-label="可旋转的迁徙接力地球">
      <div id="globe" class="cv-fill"></div>
      <img class="site-photo" src="assets/img/olduvai-gorge.jpg" alt="东非奥杜威峡谷的真实地貌" title="Olduvai-Schlucht Mike Krüger 110126 1.jpg · Mike Krüger · CC BY-SA 4.0">
      <div class="route-note">示意接力，不代表单一群体的一次路线</div>
      <div class="detail" aria-live="polite">
        <h2 id="detailTitle">东非裂谷</h2>
        <p id="detailText">资源随季节与地形分散。身体耐受与移动能力成为第一棒。</p>
        <div class="relay-tags" id="relayTags"><span class="tag bio">身体</span></div>
      </div>
    </section>
    <section class="k-process" style="height:118px" aria-label="迁徙接力的四步过程">
      <article class="step" data-step="0" aria-current="step"><h3>1 遭遇门槛</h3><p>东非裂谷：分散资源</p></article><div class="arw" aria-hidden="true"></div>
      <article class="step pending" data-step="1"><h3>2 调用能力</h3><p>东北非：身体＋石器</p></article><div class="arw" aria-hidden="true"></div>
      <article class="step pending" data-step="2"><h3>3 传递经验</h3><p>西亚：共享路线知识</p></article><div class="arw" aria-hidden="true"></div>
      <article class="step pending" data-step="3"><h3>4 进入新环境</h3><p>欧亚：三者共同交接</p></article>
    </section>
  </main>
  <footer style="height:94px;display:flex;align-items:center;justify-content:space-between;gap:24px">
    <div class="min0"><p class="lead" style="margin:0 0 3px">新环境中的生存，靠身体、工具与知识在一站站之间不断交接。</p><p class="hint" style="margin:0">旋转地球，寻找发光的下一站并点击。</p></div>
    <button id="reset" class="btn" type="button">重新接力</button>
  </footer>
  <script src="assets/lib/three.min.js"></script>
  <script src="assets/lib/globe.gl.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded',function(){
    Deck.init({index:26,total:50});
    var K=Lec.K, current=0, globeEl=document.getElementById('globe');
    var sites=[
      {name:'东非裂谷',lat:-2.9,lng:35.3,gate:'资源随季节与地形分散。',relay:'身体耐受与移动能力成为第一棒。'},
      {name:'东北非走廊',lat:13.5,lng:39.5,gate:'水源间距增大。',relay:'继承身体能力，并携带石器。'},
      {name:'西亚交界',lat:31.8,lng:36.2,gate:'陌生食物、路线与气候。',relay:'工具之外，还要共享水源与食物知识。'},
      {name:'欧亚新生态区',lat:46.2,lng:42.2,gate:'环境更冷，也更季节化。',relay:'身体、工具与沿途知识共同交接。'}
    ];
    var ochre=Deck.token('--ochre'), cyan=Deck.token('--cyan'), bg=Deck.token('--bg'), line=Deck.token('--line');
    var globe=Globe()(globeEl).backgroundColor(bg).showAtmosphere(true).atmosphereColor(cyan).atmosphereAltitude(.12)
      .htmlElementsData(sites).htmlLat('lat').htmlLng('lng').htmlAltitude(.03)
      .htmlElement(function(d){var i=sites.indexOf(d),b=document.createElement('button');b.type='button';b.className='globe-node';b.textContent=String(i+1);b.title=d.name;b.setAttribute('aria-label','第'+(i+1)+'站：'+d.name);b.addEventListener('click',function(){if(i===current+1)advance(i)});return b;})
      .arcsData([]).arcStartLat('slat').arcStartLng('slng').arcEndLat('elat').arcEndLng('elng').arcColor(function(d){return d.on?cyan:line}).arcStroke(function(d){return d.on?1.1:.35}).arcAltitude(.13).arcDashLength(function(d){return d.on?1:.12}).arcDashGap(.08).arcDashAnimateTime(Deck.reduced()?0:1800);
    globe.globeMaterial().color.set('#202b2f'); globe.globeMaterial().roughness=.82;
    function arcs(){return sites.slice(1).map(function(s,i){return{slat:sites[i].lat,slng:sites[i].lng,elat:s.lat,elng:s.lng,on:i<current}})}
    function tags(){var a=['身体'];if(current>=1)a.push('石器');if(current>=2)a.push('沿途知识');return a.map(function(x,i){return '<span class="tag '+(i===0?'bio':i===1?'neutral':'active')+'">'+x+'</span>'}).join('')}
    function render(){
      globe.arcsData(arcs()); var buttons=globeEl.querySelectorAll('.globe-node');
      buttons.forEach(function(b,i){b.disabled=i>current+1;b.className='globe-node '+(i<current?'done':i===current?'current':'')});
      document.querySelectorAll('.k-process>.step').forEach(function(s,i){s.classList.toggle('done',i<current);s.classList.toggle('pending',i>current);if(i===current)s.setAttribute('aria-current','step');else s.removeAttribute('aria-current')});
      document.getElementById('detailTitle').textContent=sites[current].name+(current===0?' · 早期 Homo 约 '+Math.round(K.homoErectusYearsAgo/10000)+' 万年前':'');
      document.getElementById('detailText').textContent=sites[current].gate+sites[current].relay;
      document.getElementById('relayTags').innerHTML=tags(); globe.arcsData(arcs());
    }
    function advance(i){current=i;render();globe.pointOfView({lat:sites[i].lat,lng:sites[i].lng,altitude:1.75},Deck.reduced()?0:700)}
    function resize(){globe.width(globeEl.clientWidth).height(globeEl.clientHeight)}
    var off=Deck.onResize(resize);resize();globe.pointOfView({lat:sites[0].lat,lng:sites[0].lng,altitude:1.85},Deck.reduced()?0:1100);render();
    document.getElementById('reset').addEventListener('click',function(){current=0;render();globe.pointOfView({lat:sites[0].lat,lng:sites[0].lng,altitude:1.85},Deck.reduced()?0:700)});
    window.addEventListener('beforeunload',function(){off();if(globe._destructor)globe._destructor()},{once:true});
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
