<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="29" data-total="50">
<div id="stage">
  <style>
    .kicker{height:24px;color:var(--cyan);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.12em}
    .hero{height:66px;display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
    .hero h1{margin:0}.hero .tag{margin-top:5px}
    .scene{display:flex;flex-direction:column;gap:12px;height:100%}
    .visual{position:relative;flex:1;min-height:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .visual>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 44%;opacity:.47;filter:saturate(.78) contrast(1.08)}
    .visual svg{position:absolute;inset:0;width:100%;height:100%}
    .readout{position:absolute;top:20px;left:22px;display:flex;align-items:flex-end;gap:36px;padding:14px 18px}
    .reading-label{color:var(--muted);font-size:var(--fs-label);line-height:1.35}.reading-label .big{display:block;margin-top:2px}
    .status{position:absolute;top:22px;right:22px;width:390px;padding:15px 18px}
    .status strong{display:block;color:var(--cyan);font-size:var(--fs-body);line-height:1.4}.status p{margin:5px 0 0;font-size:var(--fs-sec);line-height:1.45;color:var(--muted)}
    .control{position:absolute;right:22px;bottom:20px;left:22px;padding:14px 18px}.control .ctl{gap:18px}.control .hint{margin:5px 0 0}
    .processbar{height:150px;flex:none}.processbar .step{padding:12px 10px}.processbar .step strong{display:block;font-size:var(--fs-sec);line-height:1.4}.processbar .step span{display:block;margin-top:5px;color:var(--muted);font-size:var(--fs-label);line-height:1.4}.processbar .arw{flex-basis:30px;width:30px}
    .bottom{height:70px;display:flex;align-items:center;justify-content:space-between;gap:28px}.bottom p{margin:0}.bottom .lead{max-width:1000px}.next{max-width:430px;color:var(--muted);font-size:var(--fs-sec);line-height:1.4;text-align:right}
    #boundary{fill:none;stroke:var(--cyan);stroke-width:5;filter:drop-shadow(0 0 8px rgba(69,214,232,.7));transition:stroke-dasharray 220ms ease-out}
    #flow line{stroke:var(--cyan);stroke-width:4;opacity:0;transition:opacity 180ms ease-out}
    #flow polygon{fill:var(--cyan);opacity:0;transition:opacity 180ms ease-out}
    .danger #boundary{stroke:var(--ochre)}
    .flash{animation:flash 420ms ease-out 1}@keyframes flash{50%{box-shadow:inset 0 0 0 3px var(--ochre),0 0 30px rgba(197,106,50,.45)}}
    .enter{animation:rise 560ms ease-out both}.processbar>*{animation:rise 430ms ease-out both}.processbar>*:nth-child(2){animation-delay:70ms}.processbar>*:nth-child(3){animation-delay:140ms}.processbar>*:nth-child(4){animation-delay:210ms}.processbar>*:nth-child(5){animation-delay:280ms}.processbar>*:nth-child(6){animation-delay:350ms}.processbar>*:nth-child(7){animation-delay:420ms}.processbar>*:nth-child(8){animation-delay:490ms}.processbar>*:nth-child(9){animation-delay:560ms}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
  <div class="kicker">VACUUM / LIFE BOUNDARY</div>
  <header class="hero">
    <h1>打开阀门之后，身体先失去什么？</h1>
    <span class="tag neutral">课堂示意舱模型</span>
  </header>
  <main class="min0">
    <div class="scene min0">
      <div class="cvbox visual min0 enter" id="visual">
        <img src="assets/img/illus-vacuum-boundary.png" alt="真空中人体与压力边界的生成示意插画" title="生成插画（非真实照片）">
        <svg viewBox="0 0 1488 500" role="img" aria-label="人体外的闭合压力边界随阀门开启出现缺口，气体向右逸出">
          <path id="boundary" pathLength="100" d="M495 430 C420 370 421 150 535 80 C650 10 862 28 958 112 C1038 182 1032 350 949 420 C850 494 600 492 495 430 Z"/>
          <g id="flow">
            <line x1="1000" y1="208" x2="1120" y2="208"/><polygon points="1120,208 1098,196 1098,220"/>
            <line x1="1014" y1="250" x2="1170" y2="250"/><polygon points="1170,250 1148,238 1148,262"/>
            <line x1="1000" y1="292" x2="1120" y2="292"/><polygon points="1120,292 1098,280 1098,304"/>
          </g>
        </svg>
        <div class="panel readout" aria-live="polite">
          <div class="reading-label">舱内总压 <span class="big sm" id="pressure">—</span><span class="unit">kPa</span></div>
          <div class="reading-label">氧分压 <span class="big sm" id="oxygen">—</span><span class="unit">kPa</span></div>
          <div class="reading-label">边界维持 <span class="big sm" id="seconds">—</span><span class="unit">s</span></div>
        </div>
        <div class="panel status" id="statusBox">
          <strong id="statusTitle">压力边界完整</strong>
          <p id="statusText">阀门关闭，氧分压足以支持正常意识与行动。</p>
        </div>
        <div class="panel control">
          <div class="ctl">
            <label for="valve">真空阀</label>
            <input class="no-pan" id="valve" type="range" aria-describedby="operationHint">
            <output class="num" id="valveOut" for="valve">—</output>
            <button class="btn" id="reset" type="button">重新密封</button>
          </div>
          <p class="hint" id="operationHint">拖开阀门，再在危急段前拉回关闭。</p>
        </div>
      </div>
      <div class="k-process processbar" id="process" aria-label="失压生理事件顺序">
        <div class="axis"></div>
        <div class="step" data-step="0"><strong>阀门关闭</strong><span>压力边界完整</span></div><div class="arw"></div>
        <div class="step" data-step="1"><strong>气体逸出</strong><span>总压持续下降</span></div><div class="arw"></div>
        <div class="step" data-step="2"><strong>氧分压下降</strong><span>意识与行动先受威胁</span></div><div class="arw"></div>
        <div class="step" data-step="3"><strong>接近低压极限</strong><span id="armstrongLabel">暴露液体有沸腾风险</span></div><div class="arw"></div>
        <div class="step" data-step="4"><strong>生命危急</strong><span>损伤叠加，不是爆炸</span></div>
      </div>
    </div>
  </main>
  <footer class="bottom">
    <p class="lead">真空不会让人体立刻爆炸，却会使缺氧、失压与低压沸腾迅速成为致命问题。</p>
    <p class="next">下一问：人体需要足够的氧分压，为什么只看“氧气百分比”还不够？</p>
  </footer>
  <script>
  document.addEventListener('DOMContentLoaded', function(){
    Deck.init({index:29,total:50});
    var K=Lec.K, P=Lec.P;
    var sea=K.earth.seaLevelPressurePascals, frac=K.earth.atmosphericOxygenFraction;
    var limit=K.human.armstrongLimitPressurePascals, perKpa=K.units.pascalsPerKilopascal;
    var maxPct=1/K.units.percentAsFraction;
    var valve=document.getElementById('valve'), out=document.getElementById('valveOut');
    var pressureEl=document.getElementById('pressure'), oxygenEl=document.getElementById('oxygen'), secondsEl=document.getElementById('seconds');
    var title=document.getElementById('statusTitle'), text=document.getElementById('statusText'), visual=document.getElementById('visual');
    var boundary=document.getElementById('boundary'), flow=document.getElementById('flow');
    var steps=Array.prototype.slice.call(document.querySelectorAll('[data-step]'));
    var state={pressure:sea, elapsed:0, frozen:false, valve:0, last:0};
    valve.min=0; valve.max=maxPct; valve.step=1; valve.value=0;
    document.getElementById('armstrongLabel').textContent=(limit/perKpa).toFixed(1)+' kPa：暴露液体有沸腾风险';
    function stage(){
      if(state.frozen) return 4;
      if(state.valve===0 && state.pressure>sea*.98) return 0;
      if(state.pressure>sea*.62) return 1;
      if(state.pressure>limit*2.2) return 2;
      if(state.pressure>limit) return 3;
      return 4;
    }
    function render(){
      var s=stage(), open=state.valve/maxPct, pK=state.pressure/perKpa;
      pressureEl.textContent=pK.toFixed(1); oxygenEl.textContent=(P.oxygenPartialPressure(state.pressure,frac)/perKpa).toFixed(1);
      secondsEl.textContent=state.elapsed.toFixed(1); out.textContent=Math.round(state.valve)+'% 开启';
      var gap=Math.round(open*30); boundary.style.strokeDasharray=(100-gap)+' '+gap;
      flow.querySelectorAll('line,polygon').forEach(function(el){el.style.opacity=open?String(.25+.75*open):'0'});
      steps.forEach(function(el,i){el.classList.toggle('done',i<s); if(i===s)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current')});
      visual.classList.toggle('danger',s>=3);
      if(s===0){title.textContent='压力边界完整';text.textContent='阀门关闭，氧分压足以支持正常意识与行动。'}
      else if(s===1){title.textContent='气体正在逸出';text.textContent='开度越大，示意舱总压下降越快。'}
      else if(s===2){title.textContent='氧分压同步下降';text.textContent='缺氧先削弱意识与行动能力。'}
      else if(s===3){title.textContent='低压沸腾风险上升';text.textContent='这不是人体整体“煮沸”，也不是必然死亡线。'}
      else{title.textContent='首先跨过：低压风险节点';text.textContent='氧分压下降与低压生理损伤正在叠加。'}
    }
    valve.addEventListener('input',function(){if(state.frozen)return;state.valve=Number(valve.value);render()});
    document.getElementById('reset').addEventListener('click',function(){state={pressure:sea,elapsed:0,frozen:false,valve:0,last:0};valve.disabled=false;valve.value=0;visual.classList.remove('flash');render()});
    Deck.loop(function(t,dt){
      if(!state.last)state.last=t;
      if(!state.frozen && state.valve>0 && dt>0){
        var openness=state.valve/maxPct;
        state.elapsed+=dt/1000;
        state.pressure=Math.max(0,state.pressure*Math.exp(-openness*dt/2600));
        if(state.pressure<=limit){state.pressure=limit;state.frozen=true;valve.disabled=true;visual.classList.add('flash')}
        render();
      }
    },{still:1});
    render();
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
