<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .kicker{color:var(--cyan);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.12em}
  .chart-frame{border:1px solid var(--line);border-radius:12px;background:linear-gradient(135deg,rgba(69,214,232,.035),transparent 46%);overflow:hidden}
  #chart{width:100%;height:100%;display:block}
  #chart text{font-family:var(--font-sans);fill:var(--muted);font-size:14px}
  #chart .tick text{font-family:var(--font-mono);font-size:13px}
  #chart .domain,#chart .tick line{stroke:var(--line-strong)}
  .risk-band{transition:background-color 220ms ease-out}
  .read{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text);font-weight:650;white-space:nowrap}
  .read.hot{color:var(--cyan)}
  .trade{font-size:var(--fs-sec);line-height:1.45}
  .pulse{animation:pulseLine 420ms ease-out}
  @keyframes pulseLine{50%{filter:drop-shadow(0 0 8px var(--cyan));stroke-width:5}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="30" data-total="50">
<div id="stage">
  <header style="height:82px">
    <div class="kicker">PRESSURE × MIX</div>
    <h1 style="margin:5px 0 0">氧气有多少，要把比例乘上总压</h1>
  </header>

  <main style="display:flex;gap:26px" class="min0">
    <section style="flex:1.08;display:flex;flex-direction:column;gap:12px" class="min0" aria-labelledby="plot-title">
      <div style="height:42px;display:flex;align-items:center;justify-content:space-between;gap:18px">
        <h2 id="plot-title" style="margin:0">同样的氧分压，可以来自不同组合</h2>
        <div class="legend" style="gap:18px">
          <span class="li"><i class="sw line" style="color:var(--ochre)"></i>海平面氧分压</span>
          <span class="li"><i class="sw" style="color:var(--cyan);border-radius:50%"></i>当前组合</span>
        </div>
      </div>
      <div class="cvbox chart-frame min0" style="flex:1">
        <svg id="chart" role="img" aria-label="总压与氧气比例共同决定氧分压的坐标图"></svg>
      </div>
      <div class="panel" style="height:144px;display:flex;flex-direction:column;justify-content:center;gap:13px">
        <div class="ctl" style="gap:14px">
          <label for="pressure">总压</label>
          <input id="pressure" type="range" aria-label="总压，单位千帕">
          <output id="pressureOut" class="num" for="pressure"></output>
        </div>
        <div class="ctl" style="gap:14px">
          <label for="oxygen">氧气比例</label>
          <input id="oxygen" type="range" aria-label="氧气比例，单位百分比">
          <output id="oxygenOut" class="num" for="oxygen"></output>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
          <span class="hint">拖动任一滑块，寻找相同氧分压的不同组合</span>
          <button id="reset" class="btn" type="button">复位</button>
        </div>
      </div>
    </section>

    <section style="flex:.92;display:flex;flex-direction:column;gap:12px" class="min0" aria-labelledby="compare-title">
      <div style="height:42px;display:flex;align-items:center;justify-content:space-between">
        <h2 id="compare-title" style="margin:0">两种压力环境</h2>
        <span class="tag bio">身体需求不随滑块改变</span>
      </div>
      <div class="k-comparison min0" style="--compare-n:2;flex:1;grid-template-rows:auto auto 1px auto 1px auto 1px minmax(116px,1fr)">
        <div class="hdr"></div><div class="hdr">地球海平面</div><div class="hdr diff">可调压力环境</div>
        <div class="dim">总压</div><div class="cell"><span id="earthPressure" class="read"></span></div><div class="cell diff"><span id="currentPressure" class="read hot"></span></div>
        <div class="rowline"></div>
        <div class="dim">氧气比例</div><div class="cell"><span id="earthFraction" class="read"></span></div><div class="cell diff risk-band" id="riskFraction"><span id="currentFraction" class="read hot"></span></div>
        <div class="rowline"></div>
        <div class="dim">氧分压</div><div class="cell"><span id="earthPartial" class="read"></span></div><div class="cell diff"><div><span id="partial" class="big sm" aria-live="polite"></span><span class="unit">kPa</span></div><div id="relative" class="small" style="margin-top:6px"></div></div>
        <div class="rowline"></div>
        <div class="dim">权衡</div><div class="cell trade">熟悉的呼吸与燃烧环境</div><div class="cell diff trade risk-band" id="riskTrade">降低总压可减轻压力结构负担；提高氧比例会增强富氧火灾风险，并需考虑减压病。</div>
      </div>
      <p class="note" style="height:48px;margin:0">相同的氧气百分比，在不同总压下并不提供相同的可呼吸氧。</p>
    </section>
  </main>

  <footer style="height:66px;display:flex;align-items:flex-end;justify-content:space-between;gap:28px;border-top:1px solid var(--line);padding-top:12px">
    <p class="lead" style="margin:0;max-width:1060px">身体感受到的是氧分压，而非只看氧气百分比；降低总压必须同时权衡氧比例与火灾风险。</p>
    <p class="small" style="margin:0;text-align:right">下一步：没有空气对流，热量怎样送出去？</p>
  </footer>
  <script src="assets/lib/d3.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function(){
    Deck.init({index:30,total:50});
    var K=Lec.K, P=Lec.P, unit=K.units.pascalsPerKilopascal;
    var seaP=K.earth.seaLevelPressurePascals;
    var seaF=K.earth.atmosphericOxygenFraction;
    var seaO=P.oxygenPartialPressure(seaP,seaF);
    var defaults={p:29600,f:1};
    var limits={p0:20000,p1:seaP,f0:.1,f1:1};
    var pressure=document.getElementById('pressure'), oxygen=document.getElementById('oxygen');
    pressure.min=(limits.p0/unit).toFixed(1); pressure.max=(limits.p1/unit).toFixed(1); pressure.step='0.1';
    oxygen.min=(limits.f0/K.units.percentAsFraction).toFixed(1); oxygen.max=(limits.f1/K.units.percentAsFraction).toFixed(1); oxygen.step='0.1';
    function reset(){ pressure.value=(defaults.p/unit).toFixed(1); oxygen.value=(defaults.f/K.units.percentAsFraction).toFixed(1); update(false); }
    function fmtP(v){return (v/unit).toFixed(1)+' kPa'}
    document.getElementById('earthPressure').textContent=fmtP(seaP);
    document.getElementById('earthFraction').textContent=(seaF/K.units.percentAsFraction).toFixed(1)+'%';
    document.getElementById('earthPartial').textContent=fmtP(seaO);
    var svg=d3.select('#chart'), lastSide=null, first=true;
    function draw(p,f,animate){
      var node=document.getElementById('chart'), w=node.clientWidth||700,h=node.clientHeight||470;
      svg.attr('viewBox','0 0 '+w+' '+h).selectAll('*').remove();
      var m={top:30,right:26,bottom:58,left:72}, iw=w-m.left-m.right, ih=h-m.top-m.bottom;
      var x=d3.scaleLinear().domain([limits.p0/unit,limits.p1/unit]).range([0,iw]);
      var y=d3.scaleLinear().domain([limits.f0/K.units.percentAsFraction,limits.f1/K.units.percentAsFraction]).range([ih,0]);
      var g=svg.append('g').attr('transform','translate('+m.left+','+m.top+')');
      var risk=g.append('defs').append('linearGradient').attr('id','risk').attr('x1','0').attr('y1','1').attr('x2','0').attr('y2','0');
      risk.append('stop').attr('offset','0%').attr('stop-color','var(--cyan)').attr('stop-opacity',.01);
      risk.append('stop').attr('offset','100%').attr('stop-color','var(--ochre)').attr('stop-opacity',.22);
      g.append('rect').attr('width',iw).attr('height',ih).attr('fill','url(#risk)');
      g.append('g').attr('transform','translate(0,'+ih+')').call(d3.axisBottom(x).ticks(5).tickFormat(function(d){return d.toFixed(0)}));
      g.append('g').call(d3.axisLeft(y).ticks(5).tickFormat(function(d){return d.toFixed(0)+'%'}));
      g.append('text').attr('x',iw/2).attr('y',ih+48).attr('text-anchor','middle').text('总压（kPa）');
      g.append('text').attr('transform','rotate(-90)').attr('x',-ih/2).attr('y',-52).attr('text-anchor','middle').text('氧气比例');
      var lineData=d3.range(limits.p0/unit,limits.p1/unit+.5,.5).map(function(pk){return [pk,(seaO/(pk*unit))/K.units.percentAsFraction]}).filter(function(d){return d[1]>=10&&d[1]<=100});
      var ref=g.append('path').datum(lineData).attr('id','refLine').attr('fill','none').attr('stroke','var(--ochre)').attr('stroke-width',3).attr('d',d3.line().x(function(d){return x(d[0])}).y(function(d){return y(d[1])}));
      var len=ref.node().getTotalLength();
      if(first&&!Deck.reduced()){ref.attr('stroke-dasharray',len+' '+len).attr('stroke-dashoffset',len).transition().duration(720).ease(d3.easeCubicOut).attr('stroke-dashoffset',0)}
      g.append('text').attr('x',12).attr('y',18).attr('fill','var(--ochre)').text('海平面氧分压 '+(seaO/unit).toFixed(1)+' kPa');
      var exampleF=seaO/defaults.p;
      g.append('circle').attr('cx',x(defaults.p/unit)).attr('cy',y(exampleF/K.units.percentAsFraction)).attr('r',5).attr('fill','var(--ochre)');
      g.append('text').attr('x',x(defaults.p/unit)+12).attr('y',y(exampleF/K.units.percentAsFraction)-10).text((defaults.p/unit).toFixed(1)+' kPa × '+(exampleF/K.units.percentAsFraction).toFixed(1)+'% ≈ '+(seaO/unit).toFixed(1)+' kPa');
      var dot=g.append('g').attr('transform','translate('+x(p/unit)+','+y(f/K.units.percentAsFraction)+')');
      dot.append('circle').attr('r',animate&&!Deck.reduced()?3:10).attr('fill','var(--cyan)').attr('stroke','var(--bg)').attr('stroke-width',3)
        .transition().duration(animate?220:0).attr('r',10);
      dot.append('line').attr('x1',0).attr('x2',0).attr('y1',0).attr('y2',ih-y(f/K.units.percentAsFraction)).attr('stroke','var(--cyan)').attr('stroke-dasharray','4 5').attr('opacity',.45);
      dot.append('line').attr('x1',0).attr('x2',-x(p/unit)).attr('y1',0).attr('y2',0).attr('stroke','var(--cyan)').attr('stroke-dasharray','4 5').attr('opacity',.45);
      first=false;
    }
    function update(animate){
      var p=parseFloat(pressure.value)*unit, f=parseFloat(oxygen.value)*K.units.percentAsFraction;
      var pp=P.oxygenPartialPressure(p,f), rel=pp/seaO*K.units.pascalsPerKilopascal/K.units.pascalsPerKilopascal;
      document.getElementById('pressureOut').textContent=fmtP(p);
      document.getElementById('oxygenOut').textContent=(f/K.units.percentAsFraction).toFixed(1)+'%';
      document.getElementById('currentPressure').textContent=fmtP(p);
      document.getElementById('currentFraction').textContent=(f/K.units.percentAsFraction).toFixed(1)+'%';
      document.getElementById('partial').textContent=(pp/unit).toFixed(1);
      document.getElementById('relative').textContent='相当于海平面的 '+(rel/K.units.percentAsFraction).toFixed(0)+'%';
      var alpha=.03+.18*((f-limits.f0)/(limits.f1-limits.f0));
      document.querySelectorAll('.risk-band').forEach(function(el){el.style.backgroundColor='rgba(197,106,50,'+alpha.toFixed(3)+')'});
      var side=pp>=seaO;
      if(lastSide!==null&&side!==lastSide){var l=document.getElementById('refLine');if(l){l.classList.remove('pulse');void l.getBBox();l.classList.add('pulse')}}
      lastSide=side; draw(p,f,animate);
    }
    pressure.addEventListener('input',function(){update(true)}); oxygen.addEventListener('input',function(){update(true)});
    document.getElementById('reset').addEventListener('click',reset);
    var off=Deck.onResize(function(){update(false)});
    window.addEventListener('pagehide',off,{once:true});
    reset();
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
