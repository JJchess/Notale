<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="34" data-total="50">
<div id="stage">
  <style>
    .kicker{height:24px;color:var(--cyan);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.14em}
    .chart-svg{display:block;width:100%;height:100%}.chart-svg text{font-family:var(--font-sans)}
    .return-figure{position:relative;height:166px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .return-figure img{width:100%;height:100%;object-fit:cover;object-position:center 38%;opacity:.52}
    .return-figure::after{position:absolute;inset:0;background:linear-gradient(90deg,var(--bg),transparent 54%);content:""}
    .gravity-mark{position:absolute;z-index:2;left:18px;top:18px;color:var(--cyan);font:700 30px/1 var(--font-mono);transition:transform 180ms ease-out,text-shadow 180ms ease-out}
    .gravity-mark.pulse{transform:scale(1.08);text-shadow:0 0 18px var(--cyan)}
    .return-list{display:flex;flex-direction:column;gap:9px;margin-top:12px}
    .return-list .it{padding:8px 0 0 12px;border-left:3px solid var(--ochre);border-top:0;font-size:var(--fs-sec);line-height:1.4}
    .bottomline{display:flex;align-items:center;border-top:1px solid var(--line)}
    @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
  <header style="height:92px">
    <div class="kicker">MICROGRAVITY · MONTHS</div>
    <h1>回到地球，重力成了负荷</h1>
  </header>

  <main class="k-process min0" style="gap:0">
    <div class="axis" aria-hidden="true"></div>
    <section class="step min0" aria-current="step" style="flex:2.12;display:flex;flex-direction:column;gap:12px">
      <div style="height:34px;display:flex;align-items:center;justify-content:space-between">
        <h2 style="margin:0">在轨：承重刺激持续减少</h2>
        <span class="tag active">共同自由落体</span>
      </div>
      <div class="panel" style="height:82px;padding:12px 16px">
        <div class="ctl" style="gap:18px">
          <label for="months">在轨月份</label>
          <input id="months" class="no-pan" type="range" aria-describedby="dragHint">
          <output id="monthRead" class="big sm" for="months" aria-live="polite"><span class="num"></span><span class="unit">个月</span></output>
        </div>
        <div id="dragHint" class="hint">拖动月份，观察变化如何累积；没有“正确”停留时间。</div>
      </div>
      <div class="cvbox min0" style="flex:1;border:1px solid var(--line)">
        <svg id="chart" class="chart-svg" role="img" aria-labelledby="chartTitle chartDesc"></svg>
      </div>
      <div class="legend" style="height:28px;gap:24px">
        <span class="li" style="color:var(--ochre)"><i class="sw"></i>承重骨：定量范围</span>
        <span class="li" style="color:var(--muted)"><i class="sw line"></i>肌力、心血管：方向示意</span>
        <span class="li" style="color:var(--cyan)"><i class="sw line"></i>当前月份</span>
      </div>
    </section>

    <div class="arw" aria-label="随后返回地球"></div>

    <section class="step min0" style="flex:1;display:flex;flex-direction:column;gap:12px">
      <div style="height:34px;display:flex;align-items:center;justify-content:space-between">
        <h2 style="margin:0">返回：身体重新承重</h2>
        <span class="tag active">环境约 1g</span>
      </div>
      <div class="return-figure" title="Astronauts Frank Rubio of NASA and Sultan Alneyadi of UAE (iss069e011049).jpg · NASA Johnson Space Center · Public domain">
        <img src="assets/img/iss-treadmill.jpg" alt="国际空间站内宇航员使用跑步机的纪实照片">
        <div id="gravityMark" class="gravity-mark">↓ 1g</div>
      </div>
      <div class="panel" style="height:108px;padding:13px 17px">
        <div class="small">当前承重骨剩余范围</div>
        <div id="boneRead" class="big sm" aria-live="polite"><span class="num"></span><span class="unit">%</span></div>
        <div class="small">部位与个体差异显著</div>
      </div>
      <div class="return-list" style="flex:1">
        <div class="it"><strong>承重骨</strong>｜原有骨量面对地面负荷</div>
        <div class="it"><strong>肌力</strong>｜站立、行走、抬举重新对抗重力</div>
        <div class="it"><strong>心血管</strong>｜体液向下分布，直立耐受受挑战</div>
      </div>
      <button id="reset" class="btn" type="button">复位到初始月份</button>
    </section>
  </main>

  <section class="bottomline" style="height:94px;gap:28px">
    <p class="lead" style="flex:1;margin:0">在轨越久，承重系统越少被调用；返回时，未改变的 1g 会作用在已经改变的身体上。</p>
    <p class="note" style="width:440px;margin:0">变化发生在身体，返回时改变的是身体与环境之间的匹配。</p>
  </section>
  <script src="assets/lib/d3.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded',function(){
    Deck.init({index:34,total:50});
    var pct=Lec.K.units.percentAsFraction;
    var initial=1/pct, lowRate=pct, highRate=pct+pct/2;
    var start=Math.round(initial/initial), end=start+start+start+start+start+start;
    var input=document.getElementById('months'), monthRead=document.querySelector('#monthRead .num');
    var boneRead=document.querySelector('#boneRead .num'), gravity=document.getElementById('gravityMark');
    input.min=0; input.max=end; input.step=start; input.value=start;
    var svg=d3.select('#chart'), reduced=Deck.reduced(), pulseTimer;
    function remaining(rate,m){return Lec.P.remainingAfterFractionalLoss(initial,rate,m)}
    function draw(animate){
      var m=+input.value, node=document.getElementById('chart');
      var w=node.clientWidth||900,h=node.clientHeight||390;
      svg.attr('viewBox','0 0 '+w+' '+h).selectAll('*').remove();
      svg.append('title').attr('id','chartTitle').text('在轨月份与三类身体变化');
      svg.append('desc').attr('id','chartDesc').text('骨量显示定量范围；肌力和心血管调节仅显示变化方向。');
      var margin={top:34,right:28,bottom:42,left:145}, iw=w-margin.left-margin.right, ih=h-margin.top-margin.bottom;
      var g=svg.append('g').attr('transform','translate('+margin.left+','+margin.top+')');
      var x=d3.scaleLinear().domain([0,end]).range([0,iw]);
      var rows=[ih*.18,ih*.52,ih*.82];
      g.selectAll('.vgrid').data(d3.range(0,end+start,start)).join('line').attr('x1',x).attr('x2',x).attr('y1',0).attr('y2',ih).attr('stroke','var(--line)').attr('stroke-width',1);
      var axis=d3.axisBottom(x).ticks(end).tickFormat(function(d){return d});
      var ax=g.append('g').attr('transform','translate(0,'+ih+')').call(axis);
      ax.selectAll('text').style('fill','var(--muted)').style('font-size','13px'); ax.selectAll('line,path').attr('stroke','var(--line-strong)');
      g.append('text').attr('x',iw).attr('y',ih+36).attr('text-anchor','end').attr('fill','var(--muted)').style('font-size','15px').text('在轨月份');
      ['承重骨','抗重力肌','心血管调节'].forEach(function(t,i){g.append('text').attr('x',-16).attr('y',rows[i]+5).attr('text-anchor','end').attr('fill',i===0?'var(--ochre)':'var(--text)').style('font-size','16px').style('font-weight',650).text(t)});
      var data=d3.range(0,end+start,start).map(function(n){return {m:n,upper:remaining(lowRate,n),lower:remaining(highRate,n)}});
      var yBone=d3.scaleLinear().domain([remaining(highRate,end)-start,initial]).range([rows[0]+30,rows[0]-30]);
      var area=d3.area().x(function(d){return x(d.m)}).y0(function(d){return yBone(d.lower)}).y1(function(d){return yBone(d.upper)}).curve(d3.curveMonotoneX);
      var clipped=data.filter(function(d){return d.m<=m});
      g.append('path').datum(clipped).attr('d',area).attr('fill','var(--ochre)').attr('opacity',.52);
      var dirLine=d3.line().x(function(d){return x(d.m)}).y(function(d){return d.y}).curve(d3.curveMonotoneX);
      [1,2].forEach(function(i){var pts=d3.range(0,m+start,start).map(function(n){return {m:n,y:rows[i]+(n/end)*34}});g.append('path').datum(pts).attr('d',dirLine).attr('fill','none').attr('stroke','var(--muted)').attr('stroke-width',3).attr('stroke-dasharray',i===2?'7 6':null)});
      g.append('text').attr('x',x(Math.min(m+start/4,end))).attr('y',rows[1]-13).attr('fill','var(--muted)').style('font-size','14px').text('使用减少 → 肌力下降（方向示意）');
      g.append('text').attr('x',x(Math.min(m+start/4,end))).attr('y',rows[2]-13).attr('fill','var(--muted)').style('font-size','14px').text('直立需求减少 → 去适应（方向示意）');
      var cursor=g.append('line').attr('x1',x(m)).attr('x2',x(m)).attr('y1',0).attr('y2',ih).attr('stroke','var(--cyan)').attr('stroke-width',3);
      g.append('circle').attr('cx',x(m)).attr('cy',yBone(remaining(lowRate,m))).attr('r',6).attr('fill','var(--cyan)');
      if(animate&&!reduced){cursor.attr('opacity',.35).transition().duration(220).attr('opacity',1)}
      monthRead.textContent=m.toFixed(0);
      boneRead.textContent=remaining(highRate,m).toFixed(1)+'–'+remaining(lowRate,m).toFixed(1);
      if(animate&&!reduced){gravity.classList.add('pulse');clearTimeout(pulseTimer);pulseTimer=setTimeout(function(){gravity.classList.remove('pulse')},180)}
    }
    input.addEventListener('input',function(){draw(true)});
    document.getElementById('reset').addEventListener('click',function(){input.value=start;draw(true);input.focus()});
    var ro=new ResizeObserver(function(){draw(false)});ro.observe(document.getElementById('chart'));
    draw(false);
    window.addEventListener('pagehide',function(){ro.disconnect();clearTimeout(pulseTimer)},{once:true});
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
