<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .kicker{color:var(--muted);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.14em;margin-bottom:4px}
  .budget-boundary{height:100%;background:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,var(--line) 44px),var(--panel);transition:border-color 240ms ease-out,box-shadow 240ms ease-out}
  .budget-boundary.closed{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan),0 0 24px rgba(69,214,232,.16)}
  .supply{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:76px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:transparent;color:var(--text);font:inherit;font-size:var(--fs-sec);text-align:left;cursor:grab;transition:transform 160ms ease-out,border-color 160ms ease-out}
  .supply:hover,.supply:focus-visible{border-color:var(--cyan);transform:translateY(-2px)}
  .supply strong{display:block;font-size:var(--fs-body);color:var(--cyan)}
  .account{display:grid;grid-template-columns:minmax(190px,1.2fr) minmax(210px,1.25fr) minmax(220px,1.4fr);align-items:center;gap:16px;min-height:88px;padding:8px 12px;border-top:1px solid var(--line);transition:opacity 220ms ease-out,transform 220ms ease-out;background:var(--panel);border-radius:8px;margin-top:4px}
  .account>div{min-height:64px;padding:8px 0}.account:first-child{border-top:0}.account.missing{animation:pulse 700ms ease-out 1}
  .account.dragover{box-shadow:inset 4px 0 0 var(--cyan)}
  .account-name{font-size:var(--fs-sec);line-height:1.4}.account-name strong{display:block;font-size:var(--fs-body)}
  .loaded{font-size:var(--fs-sec);line-height:1.35}.loaded button{margin-left:8px;padding:3px 8px;border:1px solid var(--line-strong);border-radius:5px;background:transparent;color:var(--muted);font:inherit;font-size:var(--fs-label);cursor:pointer}
  .meter{height:10px;margin-top:7px;border:1px solid var(--line-strong);border-radius:99px;overflow:hidden}.meter span{display:block;height:100%;width:0;background:var(--cyan);transition:width 240ms ease-out}.deficit .meter span{background:var(--ochre)}
  .delta{color:var(--cyan)}.deficit .delta{color:var(--ochre)}
  .statusline{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .enter{animation:enter 560ms ease-out both}.enter:nth-child(2){animation-delay:70ms}.enter:nth-child(3){animation-delay:140ms}
  @keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes pulse{50%{box-shadow:inset 5px 0 0 var(--ochre)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.enter{opacity:1;transform:none}}
</style>
</head>
<body data-page="41" data-total="50">
<div id="stage">
  <header style="height:82px">
    <div class="kicker">LIFE-SUPPORT LEDGER</div>
    <h1>七天补给：五本账必须同时为正</h1>
  </header>
  <main style="display:flex;gap:22px" class="min0">
    <aside class="panel min0" style="flex:0 0 330px;display:flex;flex-direction:column;gap:12px">
      <h2 style="margin-bottom:0">标准补给箱</h2>
      <div class="hint">拖入对应账户；也可点击装载</div>
      <div id="supplies" style="display:flex;flex-direction:column;gap:9px"></div>
      <div class="ctl" style="grid-template-columns:72px 1fr 68px;margin-top:auto">
        <label for="crew">人数</label><input id="crew" type="range" min="1" max="6" value="4"><output id="crewOut" class="num">4 人</output>
      </div>
      <div class="btns" style="justify-content:space-between;gap:10px"><span class="small">任务固定 <span class="num">7</span> 天</span><button id="reset" class="btn" type="button">重新装载</button></div>
    </aside>

    <section class="k-classification min0" style="flex:1">
      <div id="boundary" class="box panel budget-boundary enter" aria-label="总生存预算">
        <div class="bt statusline"><span><span id="crewTitle" class="num">4</span> 人 × <span class="num">7</span> 天</span><span id="statusTag" class="tag neutral" aria-live="polite">边界未闭合</span></div>
        <div class="lv enter" style="height:294px;padding-top:6px;padding-bottom:6px">
          <div style="display:flex;align-items:center;gap:10px"><strong>生命入口</strong><span class="tag bio">人体消耗</span></div>
          <div id="lifeAccounts" style="margin-top:4px"></div>
        </div>
        <div class="lv enter" style="height:205px;padding-top:6px;padding-bottom:6px">
          <div style="display:flex;align-items:center;gap:10px"><strong>系统额度</strong><span class="tag neutral">课堂情境值</span></div>
          <div id="systemAccounts" style="margin-top:4px"></div>
        </div>
      </div>
    </section>
  </main>
  <footer style="height:94px;padding-top:12px">
    <p class="lead" style="margin-bottom:5px">水、食物、氧气、电力和废物容量必须按人数与时间共同预算；漏掉任何一项，都不是生存方案。</p>
    <p class="small" style="margin-bottom:0">账本为正只说明出发时带够了。下一步：二氧化碳去除能力下降时，余量会怎样变成倒计时？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
  Deck.init({index:41,total:50});
  const DAYS=7, DEFAULT_CREW=4;
  const rates={
    water:Lec.K.human.typicalWaterNeedLitresPerDay*1.5,
    food:Lec.K.human.typicalFoodEnergyKilocaloriesPerDay,
    oxygen:0.84,
    power:3,
    waste:1
  };
  const defs=[
    {id:'water',group:'life',name:'饮用及食物用水',unit:'L',box:15},
    {id:'food',group:'life',name:'食物',unit:'kcal',box:10000},
    {id:'oxygen',group:'life',name:'氧气',unit:'kg',box:4},
    {id:'power',group:'system',name:'电力',unit:'kWh',box:12,note:'本页课堂情境值'},
    {id:'waste',group:'system',name:'废物容量',unit:'kg',box:5,note:'本页课堂情境值'}
  ];
  const fresh=()=>({crew:DEFAULT_CREW,boxes:Object.fromEntries(defs.map(d=>[d.id,0])),complete:false});
  let state=fresh(),trace=[];
  const supplies=document.getElementById('supplies'), life=document.getElementById('lifeAccounts'), system=document.getElementById('systemAccounts');
  function fmt(v,id){return id==='food'?Math.round(v).toLocaleString('zh-CN'):(Math.round(v*100)/100).toLocaleString('zh-CN',{maximumFractionDigits:2});}
  function need(d){return rates[d.id]*state.crew*DAYS}
  function duration(d){return Lec.P.resourceDurationDays(state.boxes[d.id]*d.box,rates[d.id],state.crew)}
  function action(id,delta){state.boxes[id]=Math.max(0,state.boxes[id]+delta);trace.push({id,delta});render();document.dispatchEvent(new CustomEvent('game-progress',{detail:{state:getState(),action:{id,delta},metrics:metrics()}}));}
  function metrics(){return {covered:defs.filter(d=>state.boxes[d.id]*d.box>=need(d)).length,total:defs.length}}
  function getState(){return JSON.parse(JSON.stringify(state))}
  defs.forEach(d=>{
    const b=document.createElement('button');b.type='button';b.className='supply';b.draggable=true;b.dataset.id=d.id;b.textContent=`${d.name}　每箱 ${fmt(d.box,d.id)} ${d.unit}　＋`;
    b.addEventListener('click',()=>action(d.id,1));b.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',d.id));supplies.appendChild(b);
    const row=document.createElement('div');row.className='account';row.dataset.id=d.id;row.innerHTML=`<div class="account-name">${d.name}<br>${d.note||'每人每日需求'} · 需 <span class="need num"></span> ${d.unit}</div><div class="loaded">已装 <span class="amount num"></span> ${d.unit}<button type="button" aria-label="移除一箱${d.name}">移除一箱</button></div><div><span class="delta num"></span> ${d.unit} · 支持 <span class="days num"></span> 天<div class="meter" aria-hidden="true"><span></span></div></div>`;
    row.querySelector('button').addEventListener('click',()=>action(d.id,-1));row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('dragover')});row.addEventListener('dragleave',()=>row.classList.remove('dragover'));row.addEventListener('drop',e=>{e.preventDefault();row.classList.remove('dragover');if(e.dataTransfer.getData('text/plain')===d.id)action(d.id,1)});
    (d.group==='life'?life:system).appendChild(row);
  });
  function render(){
    document.getElementById('crewOut').textContent=state.crew+' 人';document.getElementById('crewTitle').textContent=state.crew;
    let all=true;
    defs.forEach(d=>{const row=document.querySelector(`.account[data-id="${d.id}"]`),n=need(d),a=state.boxes[d.id]*d.box,delta=a-n,ok=delta>=0;all=all&&ok;row.classList.toggle('deficit',!ok);row.querySelector('.need').textContent=fmt(n,d.id);row.querySelector('.amount').textContent=fmt(a,d.id);row.querySelector('.delta').textContent=(delta>=0?'+':'−')+fmt(Math.abs(delta),d.id);row.querySelector('.days').textContent=duration(d).toFixed(1);row.querySelector('.meter span').style.width=Math.min(100,a/n*100)+'%';row.querySelector('button').disabled=state.boxes[d.id]===0;if(!ok&&state.boxes[d.id]>0){row.classList.remove('missing');void row.offsetWidth;row.classList.add('missing')}});
    const boundary=document.getElementById('boundary'),tag=document.getElementById('statusTag');boundary.classList.toggle('closed',all);tag.className='tag '+(all?'active':'neutral');tag.textContent=all?'七天方案成立':'边界未闭合';
    if(all&&!state.complete){state.complete=true;document.dispatchEvent(new CustomEvent('game-complete',{detail:{score:defs.reduce((s,d)=>s+state.boxes[d.id],0),metrics:metrics(),trace:trace.slice()}}))}if(!all)state.complete=false;
  }
  document.getElementById('crew').addEventListener('input',e=>{state.crew=Number(e.target.value);render()});
  document.getElementById('reset').addEventListener('click',()=>{state=fresh();trace=[];document.getElementById('crew').value=DEFAULT_CREW;render();document.dispatchEvent(new CustomEvent('game-reset'))});
  window.page41Game={start(){document.dispatchEvent(new CustomEvent('game-start'));},reset(){document.getElementById('reset').click()},getState};
  render();
});
</script>
</body>
</html>
