<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="43" data-total="50">
<div id="stage">
  <style>
    .kicker{color:var(--cyan);font-size:var(--fs-label);line-height:1.35;font-weight:700;letter-spacing:.14em;margin-bottom:4px}
    .condition{transition:border-color 220ms ease-out,opacity 220ms ease-out}
    .condition.ok{border-left-color:var(--cyan)}
    .condition .why{color:var(--muted);font-size:var(--fs-sec);line-height:1.4;margin-top:3px}
    .condition .tag{float:right}
    #system-svg{display:block;width:100%;height:100%}
    #system-svg text{font-family:var(--font-sans);font-size:16px;fill:var(--text)}
    #system-svg .sub{font-size:15px;fill:var(--muted)}
    #system-svg .pipe{fill:none;stroke:var(--line-strong);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;transition:stroke 240ms ease-out,opacity 240ms ease-out}
    #system-svg .pipe.main{stroke:var(--ochre)}
    #system-svg .pipe.live{stroke:var(--cyan);filter:drop-shadow(0 0 5px rgba(69,214,232,.45));stroke-dasharray:12 10;animation:flow 900ms linear infinite}
    #system-svg .pipe.dead{stroke:var(--line);opacity:.35}
    #system-svg .node{fill:var(--bg);stroke:var(--line-strong);stroke-width:3}
    #system-svg .node.on{stroke:var(--cyan)}
    #system-svg .fault{stroke:var(--ochre);stroke-width:5;opacity:0}
    #system-svg .fault.show{opacity:1}
    .shake{animation:shake 260ms ease-out}
    .enter{animation:rise 560ms ease-out both}
    @keyframes flow{to{stroke-dashoffset:-22}}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes shake{0%,100%{transform:none}30%{transform:translateX(-5px)}65%{transform:translateX(5px)}}
    @media(prefers-reduced-motion:reduce){.enter,#system-svg .pipe.live,.shake{animation:none!important}.condition,#system-svg .pipe{transition:none}}
  </style>

  <header style="height:92px">
    <div class="kicker">FAULT TOLERANCE</div>
    <h1 style="margin:0">备用不等于冗余</h1>
  </header>

  <main style="display:flex;gap:28px" class="min0">
    <section class="k-classification min0" style="flex:0 0 535px" aria-labelledby="class-title">
      <div class="box" style="height:100%;display:flex;flex-direction:column">
        <span class="bt" id="class-title">备用支路 <span id="class-result" class="tag neutral" style="float:right">尚未验证</span></span>
        <div class="lv condition enter" id="cond-isolate" style="animation-delay:80ms">
          <span class="tag neutral">待验证</span><strong>隔离共同故障</strong>
          <div class="why">独立电源与管路，两路不被同一点切断</div>
        </div>
        <div class="lv condition enter" id="cond-detect" style="animation-delay:150ms">
          <span class="tag neutral">待验证</span><strong>可检测</strong>
          <div class="why">传感器能指出主路失效</div>
        </div>
        <div class="lv condition enter" id="cond-switch" style="animation-delay:220ms">
          <span class="tag neutral">待验证</span><strong>可切换</strong>
          <div class="why">阀门能把流量导向备用路</div>
        </div>
        <div class="lv" style="margin-top:12px;padding-top:10px">
          <strong>三项均满足</strong> <span id="effective" class="tag neutral" style="float:right">只是多一套设备</span>
        </div>
        <figure class="cvbox" style="height:142px;margin:14px 0 0">
          <img src="assets/img/iss-life-support.jpg" alt="航天员维护国际空间站生命保障设备" title="NASA astronaut Nichole Ayers cleans and services life support components (iss073e0118757).jpg · NASA Johnson Space Center · Public domain" style="width:100%;height:100%;object-fit:cover;object-position:center 38%;opacity:.68">
        </figure>
      </div>
    </section>

    <section class="panel min0" style="flex:1;display:flex;flex-direction:column" aria-labelledby="sys-title">
      <div style="height:46px;display:flex;align-items:start;justify-content:space-between">
        <div><h2 id="sys-title" style="margin:0">同一条生命保障支路</h2><div class="small" id="sensor-read">传感器：正常，主路运行</div></div>
        <div style="text-align:right"><span class="small">末端供给</span> <span id="supply" class="big sm" aria-live="polite"></span></div>
      </div>
      <div class="cvbox min0" style="flex:1;margin:8px 0 12px">
        <svg id="system-svg" role="img" aria-label="主支路、备用支路、共享电源、传感器与切换阀组成的系统图"></svg>
      </div>
      <div class="hint" style="height:24px">依次制造故障，再判断备用支路能否真正接管。</div>
      <div class="btns" style="height:52px;gap:10px" aria-label="故障与切换控制">
        <button class="btn" id="main-fault">主路故障</button>
        <button class="btn" id="common-fault">共同电源故障</button>
        <button class="btn" id="sensor-fault">传感器失效</button>
        <button class="btn" id="switch">切到备用路</button>
        <button class="btn" id="reset">复位</button>
      </div>
    </section>
  </main>

  <footer style="height:96px;display:flex;align-items:center;justify-content:space-between;gap:30px;border-top:1px solid var(--line);margin-top:14px">
    <p class="lead" style="margin:0;max-width:970px">备用系统只有隔离共同故障、可检测且可切换时，才是真正的冗余。</p>
    <p class="note" style="margin:0;max-width:455px">冗余增加生存把握，但多出的设备、水和屏蔽要付出什么代价？</p>
  </footer>

  <script src="assets/lib/d3.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function(){
    Deck.init({index:43,total:50});
    const full = 1 / Lec.K.units.percentAsFraction;
    const empty = full - full;
    const state = {mode:'normal', switched:false};
    const svg=d3.select('#system-svg').attr('viewBox','0 0 820 410').attr('preserveAspectRatio','xMidYMid meet');
    svg.append('title').text('可切换的双支路生命保障系统');
    svg.append('desc').text('入口经主路或备用路抵达供给端；共同电源、传感器和切换阀决定备用是否有效。');
    const paths=[
      {id:'in',d:'M70,205 H180'}, {id:'main',d:'M180,205 C250,205 250,105 335,105 H590 C650,105 650,205 720,205'},
      {id:'backup',d:'M180,205 C250,205 250,305 335,305 H590 C650,305 650,205 720,205'}
    ];
    svg.selectAll('path.pipe').data(paths).join('path').attr('class',d=>'pipe '+(d.id==='main'?'main':'' )).attr('id',d=>'path-'+d.id).attr('d',d=>d.d);
    const nodes=[{id:'source',x:70,y:205,r:24},{id:'valve',x:180,y:205,r:20},{id:'sensor',x:450,y:55,r:18},{id:'power',x:450,y:205,r:22},{id:'out',x:720,y:205,r:25}];
    svg.selectAll('circle.node').data(nodes).join('circle').attr('class','node').attr('id',d=>'node-'+d.id).attr('cx',d=>d.x).attr('cy',d=>d.y).attr('r',d=>d.r);
    const labels=[['入口',70,250,'middle'],['切换阀',180,250,'middle'],['主路',390,92,'middle'],['备用路',390,335,'middle'],['传感器',450,26,'middle'],['共享电源',450,247,'middle'],['生命供给',720,250,'middle']];
    svg.selectAll('text.lab').data(labels).join('text').attr('class','lab').attr('x',d=>d[1]).attr('y',d=>d[2]).attr('text-anchor',d=>d[3]).text(d=>d[0]);
    svg.append('line').attr('class','fault').attr('id','fault-main-a').attr('x1',490).attr('y1',88).attr('x2',520).attr('y2',122);
    svg.append('line').attr('class','fault').attr('id','fault-main-b').attr('x1',520).attr('y1',88).attr('x2',490).attr('y2',122);
    svg.append('line').attr('class','fault').attr('id','fault-power-a').attr('x1',430).attr('y1',185).attr('x2',470).attr('y2',225);
    svg.append('line').attr('class','fault').attr('id','fault-power-b').attr('x1',470).attr('y1',185).attr('x2',430).attr('y2',225);

    function setCondition(id,ok,yes,no){
      const el=document.getElementById(id), tag=el.querySelector('.tag');
      el.classList.toggle('ok',ok); tag.className='tag '+(ok?'active':'neutral'); tag.textContent=ok?yes:no;
    }
    function render(){
      const common=state.mode==='common', sensorBad=state.mode==='sensor', mainBad=state.mode==='main';
      const isolate=!common, detect=!sensorBad, canSwitch=state.switched && !sensorBad;
      const backupLive=!common && state.switched;
      const mainLive=!common && !mainBad && !state.switched;
      const supplied=mainLive || backupLive;
      setCondition('cond-isolate',isolate,'已隔离','共同点失效');
      setCondition('cond-detect',detect,'可定位','位置未知');
      setCondition('cond-switch',canSwitch,'已接管','尚未接入');
      const effective=isolate&&detect&&canSwitch;
      const ef=document.getElementById('effective'); ef.className='tag '+(effective?'active':'neutral'); ef.textContent=effective?'有效冗余':'只是多一套设备';
      const cr=document.getElementById('class-result'); cr.className='tag '+(effective?'active':'neutral'); cr.textContent=effective?'归入：真冗余':'尚未满足';
      document.getElementById('supply').textContent='供给 '+(supplied?full:empty).toFixed(0)+'%';
      document.getElementById('sensor-read').textContent=sensorBad?'传感器：失效，故障位置未知':(mainBad?'传感器：已定位主路故障':(common?'两条支路：同时失电':'传感器：正常，主路运行'));
      d3.select('#path-in').attr('class','pipe '+(supplied?'live':'dead'));
      d3.select('#path-main').attr('class','pipe main '+(mainLive?'live':(mainBad||common?'dead':'')));
      d3.select('#path-backup').attr('class','pipe '+(backupLive?'live':(common?'dead':'')));
      d3.selectAll('.node').classed('on',supplied);
      d3.selectAll('#fault-main-a,#fault-main-b').classed('show',mainBad);
      d3.selectAll('#fault-power-a,#fault-power-b').classed('show',common);
      document.getElementById('switch').disabled=sensorBad||common;
      document.getElementById('switch').setAttribute('aria-pressed',String(state.switched));
      ['main','common','sensor'].forEach(m=>document.getElementById(m+'-fault').setAttribute('aria-pressed',String(state.mode===m)));
      if(common){ const s=document.getElementById('supply');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake'); }
    }
    function choose(mode){state.mode=mode;state.switched=false;render()}
    document.getElementById('main-fault').onclick=()=>choose('main');
    document.getElementById('common-fault').onclick=()=>choose('common');
    document.getElementById('sensor-fault').onclick=()=>choose('sensor');
    document.getElementById('switch').onclick=()=>{state.switched=true;render()};
    document.getElementById('reset').onclick=()=>{state.mode='normal';state.switched=false;render()};
    render();
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
