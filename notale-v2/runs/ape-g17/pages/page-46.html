<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="46" data-total="50">
<div id="stage">
  <img class="backdrop" src="assets/img/mars-surface.jpg" alt="" title="NASA’s Curiosity Discovers a Field of Martian Polygons (PIA26729).png · NASA/JPL-Caltech/MSSS · Public domain" style="opacity:.18">
  <header style="height:92px;display:flex;align-items:flex-start;justify-content:space-between;gap:24px">
    <div>
      <div style="font-size:var(--fs-label);color:var(--cyan);letter-spacing:.16em;font-weight:700">MISSION TRADE-OFF</div>
      <h1 style="margin:2px 0 0">配置火星生存舱</h1>
    </div>
    <div class="tag neutral" style="margin-top:10px">4 人 · 180 天巡航 · 可分配质量上限 20 t</div>
  </header>

  <main style="display:flex;gap:24px" class="min0">
    <section class="min0" style="flex:1.72;display:flex;flex-direction:column">
      <div class="hint" style="height:34px">逐行选择一项，让配置进入生存包线；可行方案不止一个。</div>
      <div id="matrix" class="k-comparison min0" style="--compare-n:3;grid-template-rows:54px repeat(4,1fr);column-gap:12px">
        <div class="hdr dim" style="text-align:right">子系统</div>
        <div class="hdr">轻量</div><div class="hdr diff">基准</div><div class="hdr">强化</div>

        <div class="dim">水储备<br><span class="tag bio" style="margin-top:8px">生理需求</span></div>
        <button class="btn choice" data-row="water" data-opt="0"><strong>1.8 t</strong><span>120 天</span></button>
        <button class="btn choice" data-row="water" data-opt="1" aria-pressed="true"><strong>2.7 t</strong><span>180 天</span></button>
        <button class="btn choice" data-row="water" data-opt="2"><strong>4.0 t</strong><span>267 天</span></button>

        <div class="dim">辐射屏蔽<br><span class="small">课堂示意模型</span></div>
        <button class="btn choice" data-row="shield" data-opt="0"><strong>2 t</strong><span>324 mSv</span></button>
        <button class="btn choice" data-row="shield" data-opt="1" aria-pressed="true"><strong>6 t</strong><span>243 mSv</span></button>
        <button class="btn choice" data-row="shield" data-opt="2"><strong>10 t</strong><span>194 mSv</span></button>

        <div class="dim">备用件<br><span class="small">课堂示意模型</span></div>
        <button class="btn choice" data-row="spares" data-opt="0"><strong>1 t</strong><span>低容错</span></button>
        <button class="btn choice" data-row="spares" data-opt="1" aria-pressed="true"><strong>3 t</strong><span>可替换关键件</span></button>
        <button class="btn choice" data-row="spares" data-opt="2"><strong>5 t</strong><span>隔离两类故障</span></button>

        <div class="dim">人工重力<br><span class="small">结构质量示意</span></div>
        <button class="btn choice" data-row="gravity" data-opt="0"><strong>0 t</strong><span>无</span></button>
        <button class="btn choice" data-row="gravity" data-opt="1" aria-pressed="true"><strong>4 t</strong><span>间歇 0.38g</span></button>
        <button class="btn choice" data-row="gravity" data-opt="2"><strong>8 t</strong><span>持续 0.38g</span></button>
      </div>
    </section>

    <aside class="panel min0" style="flex:.78;display:flex;flex-direction:column;gap:10px" aria-label="任务配置汇总">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <h2 style="margin:0">共同质量预算</h2><span id="statusTag" class="tag active">生存包线内</span>
      </div>
      <div id="massWrap" style="padding-bottom:10px;border-bottom:1px solid var(--line)">
        <span id="mass" class="big">15.7</span><span class="unit">/ 20 t</span>
        <div style="height:8px;border:1px solid var(--line-strong);border-radius:999px;margin-top:10px;overflow:hidden"><div id="massBar" style="height:100%;width:78.5%;background:var(--cyan);transition:transform 240ms ease-out;transform-origin:left"></div></div>
      </div>
      <div class="it" style="display:flex;justify-content:space-between;align-items:end"><span>水余量</span><span><b id="water" class="big sm">0</b><span class="unit">天</span></span></div>
      <div class="it" style="display:flex;justify-content:space-between;align-items:end"><span>巡航剂量</span><span><b id="dose" class="big sm">243</b><span class="unit">mSv</span></span></div>
      <div class="it" style="display:flex;justify-content:space-between;align-items:center"><span>故障容忍</span><span id="fault" class="tag active">关键件可替换</span></div>
      <div class="it" style="display:flex;justify-content:space-between;align-items:center"><span>失能对抗</span><span id="gravity" class="tag active">间歇 0.38g</span></div>
      <div id="feedback" class="note" aria-live="polite">任何增强方案都在争夺同一份质量预算。</div>
      <button id="reset" class="btn" style="margin-top:auto;align-self:flex-start">恢复基准配置</button>
    </aside>
  </main>

  <footer style="height:104px;display:flex;align-items:center;gap:28px;border-top:1px solid var(--line);margin-top:16px">
    <p class="lead" style="flex:1;margin:0">火星任务必须在水、屏蔽、备用件、人工重力和质量之间做无法全部满足的取舍。</p>
    <p class="small" style="width:440px;margin:0">可行配置不等于唯一最优：优先级取决于任务愿意承担什么风险。</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  Deck.init({index:46,total:50});
  const crew = 4, missionDays = 180, massLimit = 20;
  const baseDose = Lec.P.radiationDoseMillisieverts(Lec.K.spaceflight.deepSpaceRadiationMillisievertsPerDay, missionDays);
  const waterUse = 3.75;
  const model = {
    water: [{m:1.8,kg:1800},{m:2.7,kg:2700},{m:4,kg:4000}],
    shield: [{m:2,f:1},{m:6,f:.75},{m:10,f:.6}],
    spares: [{m:1,label:'低容错'},{m:3,label:'关键件可替换'},{m:5,label:'可隔离两类故障'}],
    gravity: [{m:0,label:'无'},{m:4,label:'间歇 0.38g'},{m:8,label:'持续 0.38g'}]
  };
  let state = {water:1,shield:1,spares:1,gravity:1};
  const $ = id => document.getElementById(id);
  const buttons = [...document.querySelectorAll('.choice')];
  function metrics(){
    const mass = Object.keys(state).reduce((s,k)=>s+model[k][state[k]].m,0);
    const days = Lec.P.resourceDurationDays(model.water[state.water].kg, waterUse, crew);
    const dose = baseDose * model.shield[state.shield].f;
    const viable = mass <= massLimit && days >= missionDays && dose <= 250 && state.spares >= 1 && state.gravity >= 1;
    return {mass,days,dose,viable};
  }
  function pulse(el){
    if(Deck.reduced()) return;
    el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
  }
  function render(action){
    const m=metrics();
    buttons.forEach(b=>b.setAttribute('aria-pressed', String(state[b.dataset.row]===Number(b.dataset.opt))));
    $('mass').textContent=m.mass.toFixed(1);
    $('water').textContent=Math.round(m.days-missionDays);
    $('dose').textContent=Math.round(m.dose);
    $('fault').textContent=model.spares[state.spares].label;
    $('gravity').textContent=model.gravity[state.gravity].label;
    $('massBar').style.transform='scaleX('+Math.min(m.mass/massLimit,1)+')';
    const failures=[];
    if(m.mass>massLimit) failures.push('质量超出 '+(m.mass-massLimit).toFixed(1)+' t');
    if(m.days<missionDays) failures.push('水少 '+Math.ceil(missionDays-m.days)+' 天');
    if(m.dose>250) failures.push('剂量高于阈值 '+Math.round(m.dose-250)+' mSv');
    if(state.spares<1) failures.push('关键件无替换能力');
    if(state.gravity<1) failures.push('没有间歇人工重力');
    $('statusTag').textContent=m.viable?'生存包线内':'尚未进入包线';
    $('statusTag').className='tag '+(m.viable?'active':'neutral');
    $('feedback').textContent=m.viable?'配置可行；继续替换，比较其他风险优先级。':failures.join('；')+'。';
    if(m.mass>massLimit) pulse($('massWrap'));
    if(m.days<missionDays) pulse($('water'));
    if(m.dose>250) pulse($('dose'));
    window.dispatchEvent(new CustomEvent(m.viable?'game-complete':'game-progress',{detail:{state:{...state},action,metrics:m}}));
  }
  buttons.forEach(b=>b.addEventListener('click',()=>{ state[b.dataset.row]=Number(b.dataset.opt); render({type:'select',row:b.dataset.row,option:Number(b.dataset.opt)}); }));
  $('reset').addEventListener('click',()=>{state={water:1,shield:1,spares:1,gravity:1};render({type:'reset'});window.dispatchEvent(new CustomEvent('game-reset'));});
  render({type:'start'});
});
</script>
<style>
.choice{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:3px;width:100%;height:100%;min-width:0;text-align:left;border-radius:8px;font-size:var(--fs-sec)}
.choice strong{font-family:var(--font-mono);font-size:20px}.choice span{color:var(--muted);font-size:var(--fs-label)}
.choice[aria-pressed="true"] span{color:var(--cyan)}
#matrix>*{animation:enter 520ms ease-out both}#matrix>*:nth-child(n+5):nth-child(-n+8){animation-delay:70ms}#matrix>*:nth-child(n+9):nth-child(-n+12){animation-delay:140ms}#matrix>*:nth-child(n+13):nth-child(-n+16){animation-delay:210ms}#matrix>*:nth-child(n+17){animation-delay:280ms}
.panel{animation:enter 520ms 380ms ease-out both}
.pulse{animation:pulse 360ms ease-out}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{color:var(--cyan);transform:scale(1.015)}}
@media (prefers-reduced-motion:reduce){#matrix>*,.panel,.pulse{animation:none!important}.choice,#massBar{transition:none!important}}
</style>
</body>
</html>
