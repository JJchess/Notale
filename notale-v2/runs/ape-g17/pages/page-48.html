<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page-head { display:flex; align-items:flex-start; justify-content:space-between; }
  .kicker { margin:0 0 4px; color:var(--cyan); font-size:var(--fs-label); line-height:1.35; font-weight:700; letter-spacing:.14em; }
  .page-head h1 { margin:0; }
  .thesis { max-width:700px; margin:10px 0 0; color:var(--muted); font-size:var(--fs-sec); line-height:1.5; }
  .map { position:relative; }
  .map .claim { background:rgba(11,15,18,.66); }
  .claim strong { color:var(--cyan); }
  .supports { position:relative; }
  .support { background:rgba(11,15,18,.55); }
  .support + .support { border-left:1px solid var(--line); }
  .support h2 { display:flex; align-items:center; gap:10px; margin:0 0 12px; }
  .support p { margin:0; font-size:var(--fs-body); line-height:1.5; }
  .support .chain { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .chain .arrow { color:var(--cyan); font-family:var(--font-mono); }
  .support.bio-channel h2 { color:var(--ochre); }
  .support.culture-channel h2 { color:var(--text); }
  .support.engineering-channel h2 { color:var(--cyan); }
  .feedback { grid-column:1 / -1; position:relative; margin:18px 70px 0; padding:19px 92px 17px; border-top:2px solid var(--cyan); border-bottom:1px solid var(--line-strong); background:rgba(11,15,18,.72); text-align:center; }
  .feedback::before,.feedback::after { position:absolute; top:-10px; width:2px; height:10px; background:var(--cyan); content:""; }
  .feedback::before { left:16.66%; } .feedback::after { right:16.66%; }
  .feedback h2 { margin:0 0 5px; color:var(--cyan); }
  .feedback p { margin:0; font-size:var(--fs-body); line-height:1.5; }
  .return-arc { position:absolute; z-index:-1; inset:-66px -18px 4px; width:calc(100% + 36px); height:calc(100% + 70px); overflow:visible; pointer-events:none; }
  .return-path { fill:none; stroke:var(--cyan); stroke-width:2.5; stroke-dasharray:1100; stroke-dashoffset:1100; opacity:.72; animation:draw-return 900ms cubic-bezier(.22,.8,.3,1) 2.25s forwards; }
  .return-tip { fill:var(--cyan); opacity:0; animation:fade-in 220ms ease-out 3.05s forwards; }
  .footer-line { display:flex; align-items:center; justify-content:space-between; gap:34px; border-top:1px solid var(--line); }
  .closing { max-width:930px; margin:0; font-size:var(--fs-lead); line-height:1.45; font-weight:650; text-shadow:0 2px 8px var(--bg); }
  .next { max-width:470px; margin:0; color:var(--muted); font-size:var(--fs-sec); line-height:1.5; }
  .next b { color:var(--cyan); }
  .reveal { opacity:0; transform:translateY(16px); animation:rise-in 560ms cubic-bezier(.22,.8,.3,1) forwards; }
  .claim.reveal { animation-delay:180ms; }
  .trunk { transform:scaleY(0); transform-origin:top; animation:grow-down 520ms cubic-bezier(.22,.8,.3,1) 700ms forwards; }
  .support.reveal:nth-child(1) { animation-delay:1120ms; }
  .support.reveal:nth-child(2) { animation-delay:1230ms; }
  .support.reveal:nth-child(3) { animation-delay:1340ms; }
  .feedback.reveal { animation-delay:1740ms; }
  @keyframes rise-in { to { opacity:1; transform:translateY(0); } }
  @keyframes grow-down { to { transform:scaleY(1); } }
  @keyframes draw-return { to { stroke-dashoffset:0; } }
  @keyframes fade-in { to { opacity:.72; } }
  @media (prefers-reduced-motion:reduce) {
    .reveal,.trunk,.return-path,.return-tip { animation:none !important; opacity:1; transform:none; stroke-dashoffset:0; }
  }
</style>
</head>
<body data-page="48" data-total="50">
<div id="stage">
  <img class="backdrop" src="assets/img/iss-earth.jpg" alt="" style="opacity:.18" title="A multi-hued orbital sunset revealing the tops of clouds fades above Earth's horizon (iss074e0556637).jpg · NASA Johnson Space Center · Public domain">

  <header class="page-head" style="height:102px">
    <div>
      <p class="kicker">SYNTHESIS · E5</p>
      <h1>适应不是终点，而是反馈</h1>
    </div>
    <p class="thesis">生物进化改变身体，文化保存办法，工程系统把可居住环境包在身体周围。</p>
  </header>

  <main class="k-generalization map min0" style="--support-n:3">
    <div class="claim reveal">环境压力不会只留下一个答案；人类把它转译到<strong>身体、文化与工程系统</strong>之中。</div>
    <div class="trunk" aria-hidden="true"></div>
    <div class="supports min0">
      <section class="support bio-channel reveal min0">
        <h2><span class="tag bio">身体</span><span>跨世代改变</span></h2>
        <p class="chain"><span>环境差异</span><span class="arrow">→</span><span>存活与繁殖差异</span><span class="arrow">→</span><span>身体特征改变</span></p>
      </section>
      <section class="support culture-channel reveal min0">
        <h2><span class="tag neutral">文化</span><span>跨代保存</span></h2>
        <p class="chain"><span>个体尝试</span><span class="arrow">→</span><span>模仿与教学</span><span class="arrow">→</span><span>工具和行为保留</span></p>
      </section>
      <section class="support engineering-channel reveal min0">
        <h2><span class="tag active">工程</span><span>局部重建环境</span></h2>
        <p class="chain"><span>压力边界与生命保障</span><span class="arrow">→</span><span>暂时替身体承担适应</span></p>
      </section>
      <section class="support feedback reveal">
        <h2>共同反馈</h2>
        <p>技术改变暴露、资源与风险，也就改写下一轮选择压力。</p>
      </section>
    </div>
    <svg class="return-arc" viewBox="0 0 1488 620" preserveAspectRatio="none" aria-hidden="true">
      <path class="return-path" d="M 1250 525 C 1500 440, 1480 95, 1045 48"/>
      <path class="return-tip" d="M1045 48 l23 -5 l-10 22 z"/>
    </svg>
  </main>

  <footer class="footer-line" style="height:112px">
    <p class="closing">从石片到宇航服，人类反复把环境选择压力转译为身体、文化和工程系统之间的反馈。</p>
    <p class="next"><b>下一步</b>　面对陌生环境，怎样先列生命门槛，再决定由谁承担？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    Deck.init({ index: 48, total: 50 });
  });
</script>
</body>
</html>
