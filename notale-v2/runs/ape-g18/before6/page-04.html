<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="04" data-total="50">
<div id="stage">
  <style>
    .kicker{color:var(--ochre);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.12em;margin-bottom:5px}
    .headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}.headrow h1{margin:0}.headrow .hint{margin:0 0 4px}
    pressure-sorter{display:block;height:100%;min-height:0}
    .rootbox{height:100%;display:flex;flex-direction:column;padding:12px 16px!important}
    .root-title{display:flex;align-items:center;justify-content:space-between;gap:20px}.root-title .bt{margin:0!important}.status{color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
    .source{display:flex;align-items:stretch;gap:14px;min-height:328px;margin-top:8px;padding:12px;border:1px dashed var(--line-strong);border-radius:10px}.source-label{display:flex;flex:0 0 112px;align-items:center;color:var(--muted);font-size:var(--fs-label);line-height:1.4}.cards{display:flex;flex:1;flex-wrap:wrap;align-content:stretch;gap:8px;min-width:0}.source .s-card{flex:1 1 30%;justify-content:center;min-height:62px}
    .s-card{display:flex;align-items:center;min-height:43px;padding:7px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--text);font:650 var(--fs-sec)/1.35 var(--font-sans);cursor:grab;user-select:none;touch-action:none}.s-card:hover,.s-card:focus-visible,.s-card[aria-grabbed="true"]{border-color:var(--cyan);color:var(--cyan);outline:none;box-shadow:0 0 0 3px rgba(69,214,232,.16)}.s-card.dragging{opacity:.48}.s-card.placed{cursor:default;border-color:var(--line)}
    .bins{display:flex;flex:1;gap:14px;min-height:0;margin:8px 0 0!important;padding-top:10px!important}.bin{display:flex;flex:1;flex-direction:column;min-width:0;padding:12px 14px!important;transition:border-color .14s}.bin .bt{margin-bottom:4px!important}.question{min-height:45px;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}.dropzone{display:flex;flex:1;flex-direction:column;justify-content:center;gap:6px;min-height:0;margin-top:5px;padding:7px 0 0 10px!important}.empty-prompt{color:var(--line-strong);font-size:var(--fs-sec);line-height:1.4;text-align:center}.slot{display:block;height:34px;border:1px dashed var(--line);border-radius:8px;color:var(--line-strong);font:400 var(--fs-label)/32px var(--font-sans);text-align:center}.dropzone:has(.s-card){justify-content:flex-start}.dropzone:has(.s-card) .empty-prompt,.dropzone:has(.s-card) .slot{display:none}.dropzone .s-card{min-height:38px;padding:5px 9px}.mechanism{margin-left:auto;color:var(--cyan);font-size:var(--fs-label);font-weight:500}.bin.target{border-color:var(--cyan)}.bin.wrong{animation:shake .18s linear 2;border-color:var(--ochre)}
    .finish{display:none;align-items:center;justify-content:center;gap:18px;height:52px;margin-top:8px;border-top:2px solid var(--cyan);font-size:var(--fs-lead);font-weight:700}.finish.show{display:flex}.finish::before,.finish::after{content:"↘";color:var(--cyan);font-family:var(--font-mono)}.finish::after{content:"↙"}
    .bottom{display:flex;align-items:center;justify-content:space-between;gap:24px}.next{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.45}.btn{font-size:var(--fs-sec)}
    @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
    @media(prefers-reduced-motion:reduce){.bin{transition:none}.bin.wrong{animation:none}}
  </style>
  <header style="height:76px">
    <div class="kicker">ACT I · PRESSURE MAP</div>
    <div class="headrow"><h1>极端，不止一种</h1><p class="hint">把情境拖入首先破坏生命的压力仓；也可聚焦卡片后按方向键选仓，按 Enter 确认。</p></div>
  </header>
  <main class="min0" style="display:flex;flex-direction:column">
    <pressure-sorter></pressure-sorter>
  </main>
  <footer class="bottom" style="height:66px">
    <p class="next">同样要跨过生存门槛，身体来得及改变吗——下一页把百万年与几分钟压到同一把尺上。</p>
    <button class="btn" id="resetGame" type="button">重新归仓</button>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
class PressureSorter extends HTMLElement{
  constructor(){super();this.initial=['heat','rock','water','fluid','food','cut','lowp','oxygen','particle'];this.data={water:['可饮用水断供','resource','缺少生命输入'],food:['可食用能量不足','resource','缺少生命输入'],oxygen:['可呼吸氧不足','resource','缺少生命输入'],rock:['落石撞击','physical','物体直接撞击'],cut:['锋利岩面割伤','physical','物体直接切割'],particle:['高能粒子穿透组织','physical','能量穿透组织'],heat:['酷热令核心体温上升','balance','体温平衡偏离'],fluid:['微重力使体液向头部转移','balance','体液分布偏离'],lowp:['低压使体液出现沸腾风险','balance','压力平衡偏离']};this.state={placed:{},selected:null,choice:0,attempts:0,complete:false};this.trace=[]}
  connectedCallback(){this.render();this.bind();this.start()}
  render(){this.innerHTML=`<section class="k-classification rootbox box" aria-label="极端环境压力分类游戏"><div class="root-title"><strong class="bt">极端环境压力</strong><span class="status" aria-live="polite">请选择一张情境卡</span></div><div class="source panel no-pan"><div class="source-label">待归类情境<br>按首要机制判断</div><div class="cards" aria-label="待归类卡片"></div></div><div class="lv bins">${this.bin('resource','资源不足','缺的是要消耗的东西吗？','生命所需输入不够')}${this.bin('physical','物理伤害','有什么正在撞击、切割或穿透？','外界能量或物体直接损伤组织')}${this.bin('balance','生理失衡','体内分布、温度或压力平衡被打乱了吗？','外界条件使体内稳态偏离')}</div><div class="finish" aria-live="polite"><span>生存门槛</span><span class="small">极端环境首先可分为资源不足、物理伤害与生理失衡三类压力。</span></div></section>`;this.source=this.querySelector('.cards');this.status=this.querySelector('.status');this.initial.forEach(k=>this.source.append(this.card(k)))}
  bin(id,title,q,def){return `<section class="box bin" data-bin="${id}" tabindex="-1"><strong class="bt">${title}</strong><div class="question">${def}<br><b>${q}</b></div><div style="display:flex;gap:8px"><span class="tag neutral">判断焦点</span><span class="tag">${id==='resource'?'库存与供给':id==='physical'?'接触与穿透':'体内状态'}</span></div><div class="lv dropzone" data-zone="${id}" aria-label="${title}已归入情境"><span class="empty-prompt">把符合上方诊断问题的情境放在这里</span><i class="slot" aria-hidden="true">等待归类</i><i class="slot" aria-hidden="true">等待归类</i><i class="slot" aria-hidden="true">等待归类</i></div></section>`}
  card(k){let el=document.createElement('div');el.className='s-card';el.dataset.key=k;el.draggable=false;el.tabIndex=0;el.setAttribute('role','option');el.setAttribute('aria-grabbed','false');el.textContent=this.data[k][0];return el}
  bind(){this.addEventListener('pointerdown',e=>{let c=e.target.closest('.s-card:not(.placed)');if(!c)return;this.pick(c);c.setPointerCapture(e.pointerId);c.classList.add('dragging')});this.addEventListener('pointermove',e=>{let c=e.target.closest('.s-card');if(!c||!c.hasPointerCapture(e.pointerId))return;document.querySelectorAll('.bin').forEach(b=>b.classList.remove('target'));let hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('.bin');if(hit)hit.classList.add('target')});this.addEventListener('pointerup',e=>{let c=e.target.closest('.s-card');if(!c)return;c.classList.remove('dragging');let hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('.bin');document.querySelectorAll('.bin').forEach(b=>b.classList.remove('target'));if(hit)this.tryPlace(c,hit.dataset.bin)});this.addEventListener('keydown',e=>{let c=e.target.closest('.s-card:not(.placed)');if(!c)return;if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();this.pick(c);this.state.choice=(this.state.choice+1)%3;this.preview()}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();this.pick(c);this.state.choice=(this.state.choice+2)%3;this.preview()}else if(e.key==='Enter'||e.key===' '){e.preventDefault();this.pick(c);this.tryPlace(c,['resource','physical','balance'][this.state.choice])}})}
  pick(c){this.state.selected=c.dataset.key;c.setAttribute('aria-grabbed','true');this.querySelectorAll('.s-card').forEach(x=>{if(x!==c)x.setAttribute('aria-grabbed','false')});this.status.textContent=`已选：${this.data[c.dataset.key][0]}；用方向键选择压力仓`}
  preview(){let bins=[...this.querySelectorAll('.bin')];bins.forEach((b,i)=>b.classList.toggle('target',i===this.state.choice));this.status.textContent=`准备放入：${bins[this.state.choice].querySelector('.bt').textContent}；按 Enter 确认`}
  tryPlace(c,bin){this.state.attempts++;let key=c.dataset.key,correct=this.data[key][1],target=this.querySelector(`[data-bin="${bin}"]`);if(bin!==correct){target.classList.add('wrong');this.status.textContent=`再看一次：${target.querySelector('.question b').textContent}`;setTimeout(()=>target.classList.remove('wrong'),420);this.progress('reject');return}c.classList.add('placed');c.removeAttribute('tabindex');c.setAttribute('aria-grabbed','false');let mech=document.createElement('span');mech.className='mechanism';mech.textContent=this.data[key][2];c.append(mech);this.querySelector(`[data-zone="${bin}"]`).append(c);this.state.placed[key]=bin;this.status.textContent=`归类正确：${this.data[key][2]}`;this.trace.push({key,bin});if(Object.keys(this.state.placed).length===this.initial.length){this.state.complete=true;this.querySelector('.finish').classList.add('show');this.status.textContent='全部归仓：三类压力共同构成生存门槛';this.dispatchEvent(new CustomEvent('game-complete',{bubbles:true,composed:true,detail:{score:this.initial.length,metrics:{attempts:this.state.attempts},trace:this.trace.slice()}}))}else this.progress('place')}
  progress(action){this.dispatchEvent(new CustomEvent('game-progress',{bubbles:true,composed:true,detail:{state:this.getState(),action,metrics:{placed:Object.keys(this.state.placed).length}}}))}
  start(){this.dispatchEvent(new CustomEvent('game-start',{bubbles:true,composed:true,detail:{state:this.getState()}}))}
  reset(){this.state={placed:{},selected:null,choice:0,attempts:0,complete:false};this.trace=[];this.render();this.bind();this.dispatchEvent(new CustomEvent('game-reset',{bubbles:true,composed:true,detail:{state:this.getState()}}));this.start()}
  getState(){return JSON.parse(JSON.stringify(this.state))}
}
customElements.define('pressure-sorter',PressureSorter);
document.addEventListener('DOMContentLoaded',()=>{Deck.init({index:4,total:50});document.getElementById('resetGame').addEventListener('click',()=>document.querySelector('pressure-sorter').reset())});
</script>
</body>
</html>
