<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="04" data-total="50">
  <div id="stage">
    <style>
      #stage{overflow:hidden}
      .pagehead{height:82px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid currentColor;padding-bottom:14px}
      .kicker{font-size:var(--fs-label);letter-spacing:.14em;opacity:.72}
      h1{font-size:var(--fs-h1);line-height:1.1;margin:5px 0 0}
      .counter{font-size:var(--fs-sec);font-variant-numeric:tabular-nums;opacity:.78}
      pressure-sorter{display:flex;flex:1;min-height:0;flex-direction:column;padding-top:16px}
      .game{display:flex;flex:1;min-height:0;flex-direction:column;gap:10px}
      .root-class{height:48px;display:flex;align-items:center;justify-content:center;gap:18px;border-bottom:1px solid currentColor;font-size:var(--fs-h2);font-weight:700}
      .root-class span{font-size:var(--fs-sec);font-weight:400;opacity:.78}
      .pool{height:244px;border:1px dashed currentColor;border-radius:var(--radius);padding:12px 16px;position:relative}
      .pooltop{height:34px;display:flex;justify-content:space-between;align-items:flex-start}
      .pool-title{font-size:var(--fs-h2);font-weight:700}
      .hint{font-size:var(--fs-label)}
      .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px}
      .s-card{min-height:54px;display:flex;flex-direction:column;justify-content:center;border:1px solid currentColor;border-radius:var(--radius);padding:9px 12px;font-size:var(--fs-sec);line-height:1.35;background:var(--bg);cursor:grab;touch-action:none;user-select:none;position:relative}
      .s-card[aria-grabbed="true"]{outline:3px solid var(--focus);cursor:grabbing;z-index:8}
      .bins{height:340px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
      .bin.box{display:flex;flex-direction:column;min-width:0;padding:14px 16px;transition:outline-color .15s}
      .bin.flash{outline:4px solid currentColor}
      .bin .bt{display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-h2);font-weight:700}
      .diag{font-size:var(--fs-sec);line-height:1.35;min-height:44px;margin:8px 0 10px;opacity:.82}
      .dropzone{flex:1;min-height:0;border:1px dashed currentColor;padding:8px;display:flex;flex-direction:column;gap:6px}
      .empty-guide{flex:1;display:flex;align-items:center;justify-content:center;font-size:var(--fs-sec);opacity:.7;text-align:center}
      .dropzone .s-card{min-height:0;padding:6px 9px;cursor:default}
      .mechanism{display:block;font-size:var(--fs-label);opacity:.74;margin-top:3px}
      .definition{font-size:var(--fs-sec);line-height:1.35;margin:7px 0 0}
      .foot{height:82px;display:flex;align-items:center;gap:20px;border-top:1px solid currentColor}
      .status{flex:1;font-size:var(--fs-body);line-height:1.4}
      .conclusion{font-weight:700}
      .next{font-size:var(--fs-sec);opacity:.76;margin-top:4px}
      .selected-bin{outline:3px solid var(--focus)}
      @media (prefers-reduced-motion:reduce){.bin{transition:none!important}}
    </style>
    <header class="pagehead">
      <div><div class="kicker">ACT I · PRESSURE MAP</div><h1>极端，不止一种</h1></div>
      <div class="counter" aria-label="归仓进度">已归仓 <span id="doneCount">零</span> / 全部</div>
    </header>
    <pressure-sorter class="k-classification min0" aria-label="极端环境压力分类游戏"></pressure-sorter>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded',()=>{
    const DATA=[
      ['可饮用水断供','resource','生命所需的水输入中断'],['可食用能量不足','resource','可供代谢的能量输入不足'],['可呼吸氧不足','resource','呼吸所需的氧输入不足'],
      ['落石撞击','physical','物体撞击直接损伤组织'],['锋利岩面割伤','physical','锐利表面切割组织'],['高能粒子穿透组织','physical','外来能量穿透并损伤组织'],
      ['酷热令核心体温上升','balance','体温稳态向危险方向偏离'],['微重力使体液向头部转移','balance','体液分布的平衡被打乱'],['低压使体液出现沸腾风险','balance','外压过低破坏体液稳定']
    ];
    const ORDER=[7,1,4,8,2,5,0,6,3];
    class PressureSorter extends HTMLElement{
      connectedCallback(){
        this.innerHTML=`<section class="game" tabindex="0" aria-label="卡片分拣区。方向键移动选择，回车确认。">
          <div class="root-class">极端环境压力 <span>判断依据：首先破坏生命的机制</span></div>
          <div class="pool"><div class="pooltop"><div class="pool-title">暂存区 · 先找首要机制</div><div class="hint">拖入仓位；键盘用方向键选择，回车确认</div></div><div class="cards" id="pool"></div></div>
          <div class="bins">
            <section class="bin box lv" data-bin="resource"><div class="bt"><span>资源不足</span><span class="tag neutral">输入</span></div><p class="definition">生命所需输入不够。</p><p class="diag">缺的是要消耗的东西吗？</p><div class="dropzone" aria-label="资源不足仓"></div></section>
            <section class="bin box lv" data-bin="physical"><div class="bt"><span>物理伤害</span><span class="tag neutral">直接损伤</span></div><p class="definition">外界能量或物体直接损伤组织。</p><p class="diag">有什么正在撞击、切割或穿透？</p><div class="dropzone" aria-label="物理伤害仓"></div></section>
            <section class="bin box lv" data-bin="balance"><div class="bt"><span>生理失衡</span><span class="tag neutral">稳态偏离</span></div><p class="definition">外界条件使体内稳态偏离。</p><p class="diag">体内分布、温度或压力平衡被打乱了吗？</p><div class="dropzone" aria-label="生理失衡仓"></div></section>
          </div>
          <footer class="foot"><div class="status" aria-live="polite"></div><button class="btn" type="button">重新归仓</button></footer>
        </section>`;
        this.pool=this.querySelector('#pool');this.status=this.querySelector('.status');this.board=this.querySelector('.game');
        this.querySelector('.btn').addEventListener('click',()=>this.reset());
        this.board.addEventListener('keydown',e=>this.key(e));
        this.reset();
      }
      fresh(){return {placed:{},card:0,bin:0,phase:'card',complete:false,trace:[]}}
      start(){this.dispatchEvent(new CustomEvent('game-start',{bubbles:true,composed:true}));}
      reset(){this.state=this.fresh();this.pool.innerHTML='';this.querySelectorAll('.dropzone').forEach(z=>z.innerHTML='<div class="empty-guide">拖到这里，用诊断问题核对</div>');ORDER.forEach(i=>this.pool.append(this.card(i)));this.paint();this.status.textContent='目标：按首先破坏生命的机制，把每种情境归入一个仓。';this.dispatchEvent(new CustomEvent('game-reset',{bubbles:true,composed:true}));}
      getState(){return JSON.parse(JSON.stringify(this.state))}
      card(i){const d=document.createElement('div');d.className='s-card';d.dataset.i=i;d.draggable=false;d.setAttribute('aria-grabbed','false');d.textContent=DATA[i][0];d.addEventListener('pointerdown',e=>this.dragStart(e,d));return d}
      dragStart(e,d){if(d.parentElement!==this.pool)return;this.start();this.drag={d,p:Deck.pt(this.board,e)};d.setPointerCapture(e.pointerId);d.setAttribute('aria-grabbed','true');d.onpointermove=x=>{const p=Deck.pt(this.board,x);d.style.transform=`translate(${p.x-this.drag.p.x}px,${p.y-this.drag.p.y}px)`};d.onpointerup=x=>{d.releasePointerCapture(x.pointerId);const bin=document.elementsFromPoint(x.clientX,x.clientY).find(n=>n.classList&&n.classList.contains('bin'));d.style.transform='';d.setAttribute('aria-grabbed','false');d.onpointermove=d.onpointerup=null;if(bin)this.place(+d.dataset.i,bin.dataset.bin);};}
      place(i,bin){const correct=DATA[i][1]===bin;if(!correct){const b=this.querySelector(`[data-bin="${bin}"]`);b.classList.add('flash');this.status.textContent=b.querySelector('.diag').textContent+' 再比较一次首要机制。';setTimeout(()=>b.classList.remove('flash'),220);return}
        const d=this.querySelector(`[data-i="${i}"]`);d.onpointerdown=null;const zone=this.querySelector(`[data-bin="${bin}"] .dropzone`);const guide=zone.querySelector('.empty-guide');if(guide)guide.remove();d.innerHTML=`${DATA[i][0]}<span class="mechanism">${DATA[i][2]}</span>`;this.querySelector(`[data-bin="${bin}"] .dropzone`).append(d);this.state.placed[i]=bin;this.state.trace.push({card:i,bin});
        const n=Object.keys(this.state.placed).length;document.querySelector('#doneCount').textContent=['零','一','二','三','四','五','六','七','八','九'][n];
        if(n===DATA.length){this.state.complete=true;this.status.innerHTML='<div class="conclusion">三类压力共同汇入生存门槛：资源不足、物理伤害与生理失衡。</div><div class="next">同样要跨过生存门槛，身体来得及改变吗——下一页把百万年与几分钟压到同一把尺上。</div>';this.dispatchEvent(new CustomEvent('game-complete',{bubbles:true,composed:true,detail:{score:n,metrics:{placed:n},trace:this.state.trace}}));}
        else {this.status.textContent='判断成立：机制提示已展开。继续寻找下一张卡的首要机制。';this.dispatchEvent(new CustomEvent('game-progress',{bubbles:true,composed:true,detail:{state:this.getState(),action:'place',metrics:{placed:n}}}));}
        this.paint();
      }
      key(e){const cards=[...this.pool.children];if(!cards.length)return;const bins=['resource','physical','balance'];if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter',' '].includes(e.key))e.preventDefault();if(this.state.phase==='card'){if(e.key==='ArrowRight'||e.key==='ArrowDown')this.state.card=(this.state.card+1)%cards.length;if(e.key==='ArrowLeft'||e.key==='ArrowUp')this.state.card=(this.state.card-1+cards.length)%cards.length;if(e.key==='Enter'||e.key===' '){this.state.phase='bin';this.state.bin=0;this.status.textContent='已选中“'+cards[this.state.card].textContent+'”。选择仓位，再按回车确认。';}}else{if(e.key==='ArrowRight'||e.key==='ArrowDown')this.state.bin=(this.state.bin+1)%bins.length;if(e.key==='ArrowLeft'||e.key==='ArrowUp')this.state.bin=(this.state.bin-1+bins.length)%bins.length;if(e.key==='Enter'||e.key===' '){const i=+cards[this.state.card].dataset.i;this.place(i,bins[this.state.bin]);this.state.phase='card';this.state.card=0;}}this.paint();}
      paint(){this.querySelectorAll('.s-card').forEach(x=>x.style.outline='');this.querySelectorAll('.bin').forEach(x=>x.classList.remove('selected-bin'));const cards=[...this.pool.children];if(this.state.phase==='card'&&cards[this.state.card])cards[this.state.card].style.outline='3px solid var(--focus)';if(this.state.phase==='bin')this.querySelectorAll('.bin')[this.state.bin].classList.add('selected-bin');}
    }
    customElements.define('pressure-sorter',PressureSorter);Deck.init({index:4,total:50});
  });
  </script>
</body>
</html>
