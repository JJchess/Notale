<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="46" data-total="50">
  <div id="stage">
    <img class="backdrop" src="assets/img/mars-surface.jpg" alt="" title="火星地表">
    <style>
      #stage{--bg:#10100e;--text:#f2eee6;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#7ee7ed;position:relative}
      .backdrop{opacity:.18}
      .pagehead{height:112px;position:relative;z-index:1}
      .kicker{font-size:var(--fs-label);letter-spacing:.18em;font-weight:700;margin:0 0 8px}
      h1{font-size:var(--fs-h1);line-height:1.18;margin:0;max-width:1100px}
      main{position:relative;z-index:1;display:flex;gap:28px;flex:1;min-height:0}
      mars-tradeoff-game{display:flex;gap:28px;flex:1;min-width:0;min-height:0}
      .config{flex:1.75;display:flex;flex-direction:column;min-width:0}
      .baseline{font-size:var(--fs-sec);margin:0 0 12px;opacity:.85}
      .k-comparison{display:grid;grid-template-columns:146px repeat(3,minmax(0,1fr));grid-template-rows:44px repeat(5,1fr);flex:1;min-height:0;align-items:stretch}
      .k-comparison>.hdr,.k-comparison>.dim,.choice{display:flex;align-items:center}
      .k-comparison>.hdr{font-size:var(--fs-label);font-weight:700;justify-content:center;border-bottom:1px solid currentColor}
      .k-comparison>.dim{font-size:var(--fs-sec);font-weight:700;justify-content:flex-end;padding-right:18px;border-top:1px solid color-mix(in srgb,currentColor 22%,transparent)}
      .choice{font:inherit;color:inherit;background:transparent;border:0;border-top:1px solid color-mix(in srgb,currentColor 22%,transparent);padding:7px 12px;flex-direction:column;justify-content:center;line-height:1.3;cursor:pointer;min-width:0}
      .choice strong{font-size:var(--fs-body);font-weight:700}
      .choice span{font-size:var(--fs-label);opacity:.82;margin-top:2px}
      .choice.diff{border-left:3px solid var(--focus);color:var(--focus);background:color-mix(in srgb,var(--focus) 8%,transparent)}
      .choice[disabled]{cursor:default;opacity:.72}
      .readout{flex:1;min-width:350px;display:flex;flex-direction:column;gap:14px;padding:22px}
      .readout h2{font-size:var(--fs-h2);margin:0}
      .massline{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid currentColor;padding-bottom:12px}
      .massline .big{font-size:var(--fs-read-sm)}
      .metrics{display:grid;grid-template-columns:1fr 1fr;gap:14px}
      .metric{min-width:0}
      .metric .lab{font-size:var(--fs-label);display:flex;justify-content:space-between;gap:8px}
      .metric .val{font-size:var(--fs-lead);font-weight:700;margin:5px 0 7px}
      .track{height:9px;border:1px solid currentColor;border-radius:99px;overflow:hidden;opacity:.9}
      .fill{height:100%;background:currentColor;width:0;transition:width .2s ease}
      .goal{font-size:var(--fs-sec);line-height:1.45;margin:0;border-top:1px solid currentColor;padding-top:12px}
      .feedback{font-size:var(--fs-body);line-height:1.4;min-height:52px;margin:0}
      .btns{margin-top:auto}
      .next{height:74px;position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
      .next p{margin:0;line-height:1.4}.next .lead{max-width:760px}.next .note{max-width:590px;text-align:right}
      @media (prefers-reduced-motion:reduce){.fill{transition:none}}
    </style>
    <header class="pagehead">
      <p class="kicker">MISSION TRADE-OFF</p>
      <h1>火星生存舱：你不能把所有安全都带上</h1>
    </header>
    <main>
      <mars-tradeoff-game>
        <section class="config min0" aria-label="任务配置台">
          <p class="baseline">火星巡航基线：<span id="baseDose">—</span> mSv/天　·　质量上限：<span id="massCap">—</span> t</p>
          <div class="k-comparison" id="matrix" style="--compare-n:3"></div>
        </section>
        <aside class="panel readout min0" aria-label="实时任务读数">
          <h2>任务读数</h2>
          <div class="massline"><span class="lead">总质量</span><span><b class="big sm" id="mass">—</b> <span class="unit">t</span></span></div>
          <div class="metrics">
            <div class="metric"><div class="lab"><span>水余量</span><span>≥ 0 L</span></div><div class="val" id="water">—</div><div class="track"><div class="fill" id="waterBar"></div></div></div>
            <div class="metric"><div class="lab"><span>180 天剂量</span><span>≤ 250 mSv</span></div><div class="val" id="dose">—</div><div class="track"><div class="fill" id="doseBar"></div></div></div>
            <div class="metric"><div class="lab"><span>关键替换</span><span>≥ 1 个</span></div><div class="val" id="spares">—</div><div class="track"><div class="fill" id="sparesBar"></div></div></div>
            <div class="metric"><div class="lab"><span>人工重力</span><span>越高越稳</span></div><div class="val" id="gravity">—</div><div class="track"><div class="fill" id="gravityBar"></div></div></div>
          </div>
          <p class="goal">目标：在质量上限内，同时守住水、剂量和关键替换三道门槛。</p>
          <p class="feedback" id="feedback" aria-live="polite">逐行选择配置，再提交方案。</p>
          <div class="btns"><button class="btn lg" id="submit">提交方案</button><button class="btn" id="reset">复位</button></div>
        </aside>
      </mars-tradeoff-game>
    </main>
    <footer class="next">
      <p class="lead">火星任务必须在水、屏蔽、备用件、人工重力和质量之间做无法全部满足的取舍。</p>
      <p class="note">当身体、工具与系统都在承担生存功能时——猿人与太空人究竟差在哪里？</p>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded',()=>{
    const game=document.querySelector('mars-tradeoff-game');
    const levels=['轻量','折中','强化'];
    const rows=[
      {name:'水',mass:[1.2,1.8,2.4],detail:['缺 600 L','刚好 1800 L','余 600 L']},
      {name:'屏蔽',mass:[1,3,6],detail:['324 mSv','230 mSv','160 mSv']},
      {name:'备用件',mass:[.8,1.8,3],detail:['0 个关键替换','1 个关键替换','2 个关键替换']},
      {name:'人工重力',mass:[0,2.5,6],detail:['无','间歇 0.38g','约 1g']},
      {name:'固定舱体',mass:[13,13,13],detail:['基础舱体','基础舱体','基础舱体'],fixed:true}
    ];
    const initial=()=>({pick:[1,1,1,1,1],submitted:false,trace:[]});let state=initial();
    const matrix=document.querySelector('#matrix');
    matrix.innerHTML='<div class="hdr">配置维度</div>'+levels.map(x=>`<div class="hdr">${x}</div>`).join('')+rows.map((r,ri)=>`<div class="dim">${r.name}</div>${levels.map((l,li)=>`<button class="choice" data-row="${ri}" data-level="${li}" ${r.fixed?'disabled':''}><strong>${r.mass[li].toFixed(1)} t</strong><span>${r.detail[li]}</span></button>`).join('')}`).join('');
    const waterNeed=Lec.P.crewWaterNeedLitres(4,180),base=Lec.P.radiationDoseMillisieverts(1.8,180),cap=25;
    document.querySelector('#baseDose').textContent=(base/180).toFixed(1);document.querySelector('#massCap').textContent=cap.toFixed(0);
    function metrics(){const p=state.pick;return{mass:rows.reduce((s,r,i)=>s+r.mass[p[i]],0),water:rows[0].mass[p[0]]*1000-waterNeed,dose:[base,230,160][p[1]],spares:p[2],gravity:p[3]}}
    function render(){const m=metrics();matrix.querySelectorAll('.choice').forEach(b=>{const on=+b.dataset.level===state.pick[+b.dataset.row];b.classList.toggle('diff',on);b.setAttribute('aria-pressed',String(on))});
      mass.textContent=m.mass.toFixed(1);water.textContent=(m.water>=0?'+':'')+m.water.toFixed(0)+' L';dose.textContent=m.dose.toFixed(0)+' mSv';spares.textContent=m.spares.toFixed(0)+' 个';gravity.textContent=rows[3].detail[m.gravity];
      const risk={water:Math.min(100,Math.max(0,50-m.water/12)),dose:Math.min(100,m.dose/3.24),spares:[100,50,18][m.spares],gravity:[100,58,18][m.gravity]};Object.entries(risk).forEach(([k,v])=>document.querySelector('#'+k+'Bar').style.width=v+'%');
      if(!state.submitted)feedback.textContent='逐行选择配置，再提交方案。';
    }
    function submitPlan(){state.submitted=true;const m=metrics(),fails=[];if(m.mass>cap)fails.push('质量超限');if(m.water<0)fails.push('水不足');if(m.dose>250)fails.push('剂量过高');if(m.spares<1)fails.push('没有关键替换件');const risks=[['水',Math.max(0,-m.water)],['辐射',m.dose/2.5],['故障',m.spares?50/m.spares:100],['失重',[100,58,18][m.gravity]]];risks.sort((a,b)=>b[1]-a[1]);feedback.textContent=fails.length?'尚不可执行：首先越过的门槛是'+fails[0]+'。':'可执行，但最大短板是'+risks[0][0]+'。';render();game.dispatchEvent(new CustomEvent('game-complete',{bubbles:true,composed:true,detail:{score:fails.length?0:1,metrics:m,trace:state.trace.slice()}}))}
    function reset(){state=initial();render();game.dispatchEvent(new CustomEvent('game-reset',{bubbles:true,composed:true}))}
    matrix.addEventListener('click',e=>{const b=e.target.closest('.choice');if(!b||b.disabled)return;state.pick[+b.dataset.row]=+b.dataset.level;state.submitted=false;state.trace.push({row:+b.dataset.row,level:+b.dataset.level});render();game.dispatchEvent(new CustomEvent('game-progress',{bubbles:true,composed:true,detail:{state:structuredClone(state),action:'select',metrics:metrics()}}))});
    document.querySelector('#submit').addEventListener('click',submitPlan);document.querySelector('#reset').addEventListener('click',reset);
    game.start=()=>game.dispatchEvent(new CustomEvent('game-start',{bubbles:true,composed:true}));game.reset=reset;game.getState=()=>structuredClone(state);render();game.start();Deck.init({index:46,total:50});
  });
  </script>
</body>
</html>
