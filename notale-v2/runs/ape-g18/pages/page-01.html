<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="01" data-total="50">
<div id="stage">
  <img class="backdrop" src="assets/img/illus-savanna-threshold.png" alt="" title="非洲林地与草原交界处的早期人族剪影插画">
  <div aria-hidden="true" style="position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,var(--bg) 0%,rgba(11,15,18,.92) 31%,rgba(11,15,18,.46) 64%,rgba(11,15,18,.2) 100%);"></div>

  <header style="height:178px;display:flex;flex-direction:column;justify-content:flex-end;">
    <div style="color:var(--ochre);font-family:var(--font-mono);font-size:var(--fs-sec);font-weight:700;letter-spacing:.18em;margin-bottom:12px;">APE-MEN → SPACEMEN</div>
    <h1 style="font-size:68px;line-height:1.08;margin:0;letter-spacing:-.035em;">从脚印到轨道</h1>
  </header>

  <main class="k-generalization min0" style="grid-template-rows:auto 112px minmax(0,1fr);padding-top:30px;">
    <div class="claim" style="position:relative;z-index:2;justify-self:start;width:900px;padding:18px 24px;font-size:28px;border-left-color:var(--ochre);">
      人类一直在跨越身体原本无法承受的环境边界。
    </div>

    <div class="trunk" style="position:relative;width:4px;background:linear-gradient(var(--ochre),var(--cyan));">
      <span style="position:absolute;left:18px;top:40px;width:180px;color:var(--muted);font-size:var(--fs-label);white-space:nowrap;">同一条生存路径</span>
      <span aria-hidden="true" style="position:absolute;left:50%;top:18px;width:20px;height:34px;border:3px solid var(--ochre);border-radius:55% 45% 52% 48%;transform:translateX(-170%) rotate(-22deg);"></span>
      <span aria-hidden="true" style="position:absolute;left:50%;top:55px;width:18px;height:30px;border:3px solid var(--ochre);border-radius:50%;transform:translateX(55%) rotate(24deg);"></span>
    </div>

    <div class="supports min0" style="--support-n:3;position:relative;align-items:start;border-top-color:var(--cyan);">
      <img src="assets/img/illus-savanna-threshold.png" alt="林地与草原交界处，迁移路径从地面延伸向远方" style="position:absolute;z-index:0;left:0;right:0;top:-100px;width:100%;height:440px;object-fit:cover;object-position:center 62%;opacity:.62;filter:saturate(.72) contrast(1.12);">
      <div role="img" aria-label="由赭色脚印过渡为电青轨道弧的连续生存路径" style="position:absolute;z-index:0;left:3%;right:3%;top:0;height:330px;background:linear-gradient(100deg,rgba(197,106,50,.78),rgba(53,67,74,.72) 48%,rgba(69,214,232,.68));clip-path:polygon(0 30%,18% 8%,46% 18%,72% 0,100% 18%,100% 88%,73% 68%,46% 96%,18% 78%,0 100%);"></div>
      <div aria-hidden="true" style="position:absolute;right:4%;top:-62px;width:240px;height:96px;border-top:4px solid var(--cyan);border-radius:50% 50% 0 0;transform:rotate(-8deg);opacity:.9;"></div>

      <section class="support min0" style="position:relative;z-index:1;min-height:330px;padding:34px 28px 18px;text-align:left;border-right:1px solid var(--line);border-bottom:1px solid var(--line);">
        <span class="tag bio">身体</span>
        <h2 style="margin-top:18px;margin-bottom:8px;color:var(--text);">生命的起点</h2>
        <p style="font-size:var(--fs-lead);margin:0;">让生命先跨过门槛</p>
        <span style="display:block;color:var(--ochre);font-size:var(--fs-sec);margin-top:14px;">身体以内</span>
      </section>

      <section class="support min0" style="position:relative;z-index:1;min-height:330px;padding:34px 28px 18px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);">
        <span class="tag neutral">工具与文化</span>
        <h2 style="margin-top:18px;margin-bottom:8px;color:var(--text);">能力的外延</h2>
        <p style="font-size:var(--fs-lead);margin:0;">把能力移到身体之外</p>
        <span style="display:block;color:var(--muted);font-size:var(--fs-sec);margin-top:14px;">身体与世界之间</span>
      </section>

      <section class="support min0" style="position:relative;z-index:1;min-height:330px;padding:34px 28px 18px;text-align:right;border-bottom:1px solid var(--line);">
        <span class="tag active">环境系统</span>
        <h2 style="margin-top:18px;margin-bottom:8px;color:var(--text);">条件的随行</h2>
        <p style="font-size:var(--fs-lead);margin:0;">把可居住条件带在身边</p>
        <span style="display:block;color:var(--cyan);font-size:var(--fs-sec);margin-top:14px;">身体周围</span>
      </section>
    </div>
  </main>

  <footer style="height:104px;display:flex;align-items:flex-end;border-top:1px solid var(--line);padding-bottom:4px;">
    <p style="max-width:1120px;margin:0;color:var(--text);font-size:var(--fs-lead);line-height:1.5;">
      <span style="color:var(--cyan);margin-right:10px;">下一问</span>
      <span>当环境超过身体极限，</span>
      <span>我们该把生存押在身体、工具，</span>
      <span>还是一整套环境系统上？</span>
    </p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
