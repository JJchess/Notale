<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
.route-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line)}
.route-kicker{margin:0;color:var(--ochre);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;letter-spacing:.12em}
.route-question{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.5}
.route-question strong{color:var(--text);font-size:var(--fs-lead)}
.route-wrap{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.route-photo{position:absolute;z-index:0;top:0;right:0;width:54%;height:100%;overflow:hidden;border-radius:12px}
.route-photo img{width:100%;height:100%;object-fit:cover;object-position:center;opacity:.48}
.route-photo::after{position:absolute;inset:0;background:linear-gradient(90deg,var(--bg),rgba(11,15,18,.52) 34%,rgba(11,15,18,.36));content:""}
.route{z-index:1}
.route .step{display:flex;flex-direction:column;justify-content:center}
.route .step h2{margin:8px 0 18px;font-size:30px}
.route .step p{margin:0;font-size:var(--fs-body);line-height:1.5}
.route .role{margin-top:auto;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:var(--fs-sec);line-height:1.5}
.route .step:nth-of-type(-n+5) h2{color:var(--ochre)}
.route .step:nth-last-of-type(-n+3) h2{color:var(--cyan)}
.route-end{display:flex;align-items:center;justify-content:space-between}
.route-end p{margin:0}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body data-page="03" data-total="50">
<div id="stage">
  <header class="route-head" style="height:128px;padding-bottom:18px">
    <div class="min0">
      <p class="route-kicker">ROUTE / 生存路线</p>
      <h1 style="margin:10px 0 0">生存能力，如何一步步移到身体之外</h1>
    </div>
    <p class="route-question" style="text-align:right">贯穿五站的同一个问题<br><strong>由什么维持生存条件？</strong></p>
  </header>

  <main class="route-wrap" style="flex:1;padding-top:34px;padding-bottom:24px">
    <figure class="route-photo" style="margin:34px 0 24px" title="国际空间站穹顶舱真实照片">
      <img src="assets/img/iss-cupola.jpg" alt="宇航员在国际空间站穹顶舱内俯瞰地球">
    </figure>
    <section class="k-process route" aria-label="生存能力从身体转移到体外系统的五站路线">
      <div class="axis" aria-hidden="true"></div>
      <article class="step">
        <span class="tag bio">身体内</span>
        <h2>身体</h2>
        <p>让生命直接承受环境</p>
        <p class="role">骨骼、肌肉与生理</p>
      </article>
      <div class="arw" aria-hidden="true"></div>
      <article class="step">
        <span class="tag bio">身体外</span>
        <h2>石器</h2>
        <p>把切割与加工移出身体</p>
        <p class="role">可替换的体外刃齿</p>
      </article>
      <div class="arw" aria-hidden="true"></div>
      <article class="step">
        <span class="tag neutral">群体间</span>
        <h2>文化</h2>
        <p>让经验跨过个体生命</p>
        <p class="role">协作、教学与群体记忆</p>
      </article>
      <div class="arw" aria-hidden="true"></div>
      <article class="step">
        <span class="tag active">贴身边界</span>
        <h2>宇航服</h2>
        <p>把可呼吸微环境包住身体</p>
        <p class="role">贴身压力边界</p>
      </article>
      <div class="arw" aria-hidden="true"></div>
      <article class="step" aria-current="step">
        <span class="tag active">舱内系统</span>
        <h2>生命保障环</h2>
        <p>持续补给并回收生命条件</p>
        <p class="role">舱内循环系统</p>
      </article>
    </section>
  </main>

  <footer class="panel q route-end" style="height:112px">
    <p class="lead"><strong>生存条件，现在由谁维持？</strong><br>路线依次穿过身体、石器、文化、宇航服与生命保障环。</p>
    <p class="note" style="max-width:520px">每一站究竟在抵挡什么——先把环境压力分进三个仓。</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){ Deck.init({index:3,total:50}); });
</script>
</body>
</html>
