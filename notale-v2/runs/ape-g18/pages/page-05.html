<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="05" data-total="50">
<div id="stage">
  <header style="height:106px">
    <div style="color:var(--ochre);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.16em">TWO CLOCKS</div>
    <h1 style="margin-top:8px">生物进化与工程故障，不按同一只钟走</h1>
  </header>

  <main class="min0" style="display:flex;flex-direction:column;gap:14px">
    <section class="panel" style="height:112px;display:flex;align-items:center;gap:28px">
      <div class="ctl min0" style="flex:1;gap:18px">
        <label for="compression">时间压缩</label>
        <input id="compression" class="no-pan" type="range" min="0" max="100" value="0" step="1" aria-describedby="dragHint">
        <output id="compressionValue" class="num" for="compression" aria-live="polite">0%</output>
      </div>
      <div style="width:310px;border-left:1px solid var(--line);padding-left:26px">
        <div class="small">当前可见跨度</div>
        <div id="spanRead" style="font-size:var(--fs-h2);font-weight:680;color:var(--cyan)"></div>
      </div>
      <button id="reset" class="btn" type="button">复位</button>
    </section>

    <p id="dragHint" class="hint" style="height:28px;margin:0">向右拖动，让挤在起点的分钟与小时逐渐分开。</p>

    <section class="k-comparison min0" style="--compare-n:1;flex:1;grid-template-rows:50px 1fr 1fr;column-gap:20px" aria-label="工程系统与生物世代共享时间尺度比较">
      <div class="hdr" style="grid-column:1">持续时间</div>
      <div class="hdr" style="grid-column:2">从事件开始，到结果出现</div>
      <div class="dim" style="grid-column:1;grid-row:2;display:flex;align-items:center;justify-content:flex-end"><span class="tag active">工程系统</span></div>
      <div class="dim" style="grid-column:1;grid-row:3;display:flex;align-items:center;justify-content:flex-end"><span class="tag bio">生物世代</span></div>
      <div class="cell cvbox min0" style="grid-column:2;grid-row:2 / 4;padding:0;border-right:0">
        <svg id="timeline" width="100%" height="100%" role="img" aria-labelledby="chartTitle chartDesc"></svg>
      </div>
    </section>
  </main>

  <footer style="height:112px;display:flex;align-items:flex-end;justify-content:space-between;gap:34px;padding-top:14px;border-top:1px solid var(--line)">
    <div style="max-width:930px">
      <div class="lead" style="margin-bottom:5px">生物变化常以千代计，装备故障却可能在几分钟内夺走生存条件。</div>
      <div class="small">慢变化发生在怎样的环境里——先去看不断变化的林地与草地。</div>
    </div>
    <div class="small" style="text-align:right" title="时间换算使用每年 365.25 天">NASA EVA records；世代长度按 <span id="sourceGeneration"></span> 年换算</div>
  </footer>
  <script src="assets/lib/d3.min.js"></script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  Deck.init({index:5,total:50});
  const K=Lec.K, P=Lec.P;
  const minute=K.units.secondsPerMinute;
  const hour=minute*K.units.minutesPerHour;
  const year=P.yearsToSeconds(1);
  const generation=K.human.typicalGenerationYears;
  const maxYears=generation*10000;
  const maxSeconds=P.yearsToSeconds(maxYears);
  const evaHours=6.5;
  const events=[
    {lane:0,label:'紧急处置窗口',detail:'情境示意',seconds:minute,color:'cyan'},
    {lane:0,label:'故障扩大窗口',detail:'情境示意',seconds:minute*10,color:'cyan'},
    {lane:0,label:'一次典型舱外作业',detail:'约 '+evaHours+' 小时',seconds:hour*evaHours,color:'cyan'},
    {lane:1,label:'1 代',detail:generation+' 年',seconds:P.yearsToSeconds(generation),color:'ochre'},
    {lane:1,label:'1,000 代',detail:(generation*1000).toLocaleString('zh-CN')+' 年',seconds:P.yearsToSeconds(generation*1000),color:'ochre'},
    {lane:1,label:'10,000 代',detail:(generation*10000).toLocaleString('zh-CN')+' 年',seconds:maxSeconds,color:'ochre'}
  ];
  const ticks=[
    {v:minute,l:'1 分钟'},{v:hour,l:'1 小时'},{v:hour*K.units.hoursPerDay,l:'1 天'},
    {v:year,l:'1 年'},{v:P.yearsToSeconds(1000),l:'1 千年'},{v:P.yearsToSeconds(100000),l:'10 万年'}
  ];
  document.getElementById('sourceGeneration').textContent=generation;
  const slider=document.getElementById('compression');
  const out=document.getElementById('compressionValue');
  const span=document.getElementById('spanRead');
  const svg=d3.select('#timeline');
  let width=0,height=0;
  function draw(){
    const node=svg.node(), box=node.getBoundingClientRect();
    width=node.clientWidth || box.width/Deck.s; height=node.clientHeight || box.height/Deck.s;
    if(!width||!height) return;
    svg.attr('viewBox',`0 0 ${width} ${height}`).selectAll('*').remove();
    svg.append('title').attr('id','chartTitle').text('两只时钟：工程故障与生物世代的持续时间');
    svg.append('desc').attr('id','chartDesc').text('两条泳道共用一条持续时间轴。拖动时间压缩滑块，在均匀日历尺度与对数尺度间切换。');
    const left=34,right=42,axisY=height-54, laneY=[height*.27,height*.68];
    const linear=d3.scaleLinear().domain([0,maxSeconds]).range([left,width-right]);
    const log=d3.scaleLog().domain([minute,maxSeconds]).range([left,width-right]);
    const t=Number(slider.value)/100;
    const x=v=>d3.interpolateNumber(linear(v),log(v))(t);
    const styles=getComputedStyle(document.documentElement);
    const cyan=styles.getPropertyValue('--cyan').trim(), ochre=styles.getPropertyValue('--ochre').trim();
    const line=styles.getPropertyValue('--line').trim(), muted=styles.getPropertyValue('--muted').trim(), text=styles.getPropertyValue('--text').trim();
    laneY.forEach((y,i)=>svg.append('line').attr('x1',left).attr('x2',width-right).attr('y1',y).attr('y2',y).attr('stroke',i?ochre:cyan).attr('stroke-opacity',.34).attr('stroke-width',2));
    svg.append('line').attr('x1',left).attr('x2',width-right).attr('y1',axisY).attr('y2',axisY).attr('stroke',line).attr('stroke-width',2);
    ticks.forEach((d,i)=>{
      const tx=x(d.v), spread=left+(i/(ticks.length-1))*(width-left-right);
      const lx=d3.interpolateNumber(spread,tx)(t);
      svg.append('line').attr('x1',tx).attr('x2',lx).attr('y1',axisY).attr('y2',axisY+11).attr('stroke',muted).attr('stroke-opacity',.7);
      svg.append('text').attr('x',lx).attr('y',axisY+32).attr('text-anchor',i===0?'start':i===ticks.length-1?'end':'middle').attr('fill',muted).attr('font-size',14).text(d.l);
    });
    const groups=svg.selectAll('g.event').data(events).join('g').attr('class','event');
    groups.each(function(d,i){
      const g=d3.select(this), inLane=i%3, px=x(d.seconds);
      const spread=left+85+inLane*(width-left-right-170)/2;
      const lx=d3.interpolateNumber(spread,px)(t);
      const y=laneY[d.lane], anchor=inLane===2?'end':'start', labelX=lx+(anchor==='end'?-10:10);
      g.append('line').attr('x1',px).attr('x2',lx).attr('y1',y).attr('y2',y-20).attr('stroke',d.color==='cyan'?cyan:ochre).attr('stroke-opacity',.65);
      g.append('circle').attr('cx',px).attr('cy',y).attr('r',7).attr('fill',d.color==='cyan'?cyan:ochre).attr('stroke',styles.getPropertyValue('--bg').trim()).attr('stroke-width',3);
      g.append('text').attr('x',labelX).attr('y',y-24).attr('text-anchor',anchor).attr('fill',text).attr('font-size',16).attr('font-weight',650).text(d.label);
      g.append('text').attr('x',labelX).attr('y',y+3).attr('text-anchor',anchor).attr('fill',d.detail==='情境示意'?muted:(d.color==='cyan'?cyan:ochre)).attr('font-size',14).text(d.detail);
    });
    out.value=Math.round(t*100)+'%'; out.textContent=out.value;
    const orders=Math.log10(maxSeconds/minute);
    span.textContent='分钟 → '+(maxYears/10000)+' 万年 · 约 '+Math.round(orders)+' 个数量级';
  }
  slider.addEventListener('input',draw);
  document.getElementById('reset').addEventListener('click',()=>{slider.value=0;draw();slider.focus();});
  const off=Deck.onResize(draw);
  window.addEventListener('pagehide',off,{once:true});
  draw();
});
</script>
</body>
</html>
