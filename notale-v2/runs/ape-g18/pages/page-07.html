<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .eyebrow{color:var(--ochre);font-size:var(--fs-label);font-weight:700;letter-spacing:.16em;margin:0 0 4px}
  .photo-scene{position:relative;height:100%;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
  .photo-scene img{width:100%;height:100%;object-fit:cover;display:block;opacity:.72}
  .photo-scene::after{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,15,18,.08),rgba(11,15,18,.38));content:"";pointer-events:none}
  #evidence-layer{position:absolute;z-index:2;inset:0;width:100%;height:100%}
  .marker{cursor:pointer;outline:none}
  .marker line{stroke:var(--text);stroke-width:2;opacity:.58}
  .marker rect{fill:rgba(11,15,18,.88);stroke:var(--line-strong);stroke-width:2}
  .marker text{fill:var(--text);font:650 16px var(--font-sans)}
  .marker circle{fill:var(--ochre);stroke:var(--bg);stroke-width:3}
  .marker:not(.active){opacity:.68}
  .marker.active{opacity:1}
  .marker.active rect,.marker:focus-visible rect{stroke:var(--cyan);stroke-width:3}
  .marker.active text{fill:var(--cyan)}
  .marker.active circle{fill:var(--cyan)}
  .branch{width:100%;padding:10px 12px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text);font:650 var(--fs-body)/1.35 var(--font-sans);text-align:left;cursor:pointer}
  .branch:hover,.branch:focus-visible{border-color:var(--cyan)}
  .branch[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);box-shadow:inset 4px 0 0 var(--cyan)}
  .branch[aria-pressed="false"]{opacity:.58}
  .field{margin:0;padding:0 0 0 15px;border-left:2px solid var(--line)}
  .field dt{color:var(--cyan);font-size:var(--fs-label);font-weight:700;margin-bottom:3px}
  .field dd{margin:0;color:var(--text);font-size:var(--fs-sec);line-height:1.45}
  .source{color:var(--muted);font-size:var(--fs-label);line-height:1.35}
</style>
</head>
<body data-page="07" data-total="50">
<div id="stage">
  <header style="height:104px">
    <p class="eyebrow">READING THE ENVIRONMENT</p>
    <h1>环境变化，怎样被写进证据里？</h1>
  </header>

  <main style="display:flex;gap:26px" class="min0">
    <section style="flex:0 0 43%;display:flex;flex-direction:column;gap:10px" class="min0" aria-labelledby="site-title">
      <div style="height:38px;display:flex;align-items:center;justify-content:space-between">
        <h2 id="site-title" style="margin:0">具体场所：奥杜威峡谷</h2>
        <span class="tag neutral">局地剖面示意</span>
      </div>
      <div class="photo-scene min0" style="flex:1">
        <img src="assets/img/olduvai-gorge.jpg" alt="奥杜威峡谷裸露地层的遗址景观" title="Olduvai Gorge 遗址景观">
        <svg id="evidence-layer" viewBox="0 0 620 570" role="group" aria-label="照片上的四类可选环境证据标记"></svg>
      </div>
      <p class="source" style="height:22px;margin:0">东非古环境重建常用证据类型；示意分类。照片仅指向遗址场所。</p>
    </section>

    <section class="k-classification min0" style="flex:1" aria-labelledby="class-title">
      <div class="box" style="height:100%;display:flex;flex-direction:column">
        <span class="bt" id="class-title">上位目标：重建古环境</span>
        <p class="hint" style="margin:0 0 6px">点选照片标记或证据分支，比较它能看到什么、能推到哪里。</p>
        <div class="lv min0" style="display:flex;flex-direction:column;gap:5px">
          <div id="branches" style="display:flex;gap:6px"></div>
        </div>
        <div class="panel min0" style="flex:1;margin-top:10px;display:flex;flex-direction:column;justify-content:center" aria-live="polite">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <h2 id="detail-title" style="margin:0"></h2>
            <button id="reset" class="btn" type="button">查看全部</button>
          </div>
          <div id="fields" style="display:flex;flex-direction:column;gap:13px"></div>
        </div>
      </div>
    </section>
  </main>

  <footer style="height:92px;display:flex;align-items:center;gap:28px;border-top:1px solid var(--line);margin-top:14px">
    <p class="lead" style="flex:1;margin:0">地层、动物群、花粉与同位素观察不同对象；古环境重建来自多类证据互相校验。</p>
    <p class="note" style="width:470px;margin:0">下一问：当证据跨越许多地层反复变化，选择压力会是什么形状？</p>
  </footer>
  <script src="assets/lib/d3.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    Deck.init({index:7,total:50});
    const data = [
      {id:'strata', name:'地层', y:112, seen:'火山灰、沉积物粒度、湖相或河流层序', infer:'沉积环境、事件先后与局地湿干变化', limit:'整个非洲同时发生同一种变化'},
      {id:'fauna', name:'动物群', y:224, seen:'不同动物的牙齿、骨骼与群落比例', infer:'周围植被、开阔度及水源条件', limit:'某一种动物就等于某一种固定气候'},
      {id:'pollen', name:'花粉与植硅体', y:350, seen:'植物留下的微体化石及其组合', infer:'木本、草本等植被组成的变化', limit:'原地完整植被；样本可能搬运或保存不均'},
      {id:'isotope', name:'稳定同位素', y:470, seen:'土壤碳酸盐、牙釉质中的碳、氧同位素', infer:'不同植被比例、水分与蒸发条件的线索', limit:'单凭一个比值还原完整景观'}
    ];
    let selected = data[0].id;
    const svg = d3.select('#evidence-layer');
    const marks = svg.selectAll('g.marker').data(data, d => d.id).join('g')
      .attr('class','marker').attr('role','button').attr('tabindex',0)
      .attr('aria-label',d => '查看'+d.name+'证据')
      .attr('transform',d => `translate(0,${d.y})`)
      .on('click',(event,d)=>update(d.id))
      .on('keydown',(event,d)=>{ if(event.key==='Enter'||event.key===' '){event.preventDefault();update(d.id);} });
    marks.append('line').attr('x1',92).attr('x2',252).attr('y1',0).attr('y2',0);
    marks.append('circle').attr('cx',92).attr('cy',0).attr('r',9);
    marks.append('rect').attr('x',252).attr('y',-24).attr('width',d=>d.name.length>4?154:112).attr('height',48).attr('rx',8);
    marks.append('text').attr('x',268).attr('y',6).text(d=>d.name);

    const branches = d3.select('#branches').selectAll('button').data(data,d=>d.id).join('button')
      .attr('type','button').attr('class','branch').text(d=>d.name)
      .on('click',(event,d)=>update(d.id));

    function update(id){
      selected=id;
      const d=data.find(x=>x.id===id);
      marks.classed('active',x=>x.id===id).attr('aria-pressed',x=>String(x.id===id));
      branches.attr('aria-pressed',x=>String(x.id===id));
      d3.select('#detail-title').text(d.name+'：证据边界');
      const fields=[{k:'观察到什么',v:d.seen},{k:'可以推断什么',v:d.infer},{k:'不能单独证明什么',v:d.limit}];
      const dl=d3.select('#fields').selectAll('dl.field').data(fields,x=>x.k).join('dl').attr('class','field');
      dl.selectAll('dt').data(x=>[x]).join('dt').text(x=>x.k);
      dl.selectAll('dd').data(x=>[x]).join('dd').text(x=>x.v);
    }
    d3.select('#reset').on('click',()=>update(data[0].id));
    update(selected);
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
