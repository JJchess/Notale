<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="11" data-total="50">
<div id="stage">
  <style>
    .kicker{color:var(--ochre);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.14em}
    .body-frame{position:relative;height:100%;overflow:hidden}
    .regions{position:absolute;left:250px;right:250px;top:54px;height:322px;display:flex;gap:18px}
    .region{position:relative;flex:1;padding:14px 16px!important}
    .region.active{border-color:var(--cyan);box-shadow:inset 0 3px 0 rgba(69,214,232,.45)}
    .slots{display:flex;flex-direction:column;gap:10px;margin-top:9px}
    .slot{min-height:92px;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:8px;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
    .slot.filled{border-style:solid;color:var(--text)}
    .slot strong{display:block;font-size:var(--fs-sec);line-height:1.4}
    .slot .small{margin-top:3px}
    .cards{position:absolute;left:30px;right:30px;bottom:18px;height:168px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:12px 14px}
    .feature{position:relative;z-index:4;width:204px;min-height:64px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);color:var(--text);font-size:var(--fs-sec);line-height:1.4;cursor:grab;touch-action:none;user-select:none}
    .feature:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    .feature.placed{visibility:hidden;pointer-events:none}
    .body-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    .skull{position:absolute;left:24px;top:62px;width:190px;height:190px;object-fit:contain;border-radius:10px;border:1px solid var(--line)}
    .brain-note{position:absolute;left:24px;top:264px;width:190px}
    .status{position:absolute;right:22px;top:60px;width:202px}
    .complete{color:var(--cyan);font-weight:720}
    @media (prefers-reduced-motion:reduce){.feature{transition:none!important}}
  </style>
  <header style="height:92px;display:flex;justify-content:space-between;align-items:flex-start">
    <div><div class="kicker">BODY MOSAIC</div><h1>一副身体，两套信号</h1></div>
    <div class="hint" style="margin-top:24px">拖动特征牌；键盘用方向键选择区域，回车放置</div>
  </header>
  <main class="k-classification min0">
    <section class="box body-frame min0" aria-label="同一早期人族身体的特征分类">
      <span class="bt">同一早期人族身体</span>
      <img class="skull" src="assets/img/afarensis-skull.jpg" alt="南方古猿阿法种颅骨标本" title="Australopithecus afarensis 颅骨标本">
      <div class="brain-note note"><strong>脑容量约 400–500 cm³</strong><br>脑容量较小不否定双足特征，也不能据此排列进化等级。<br><span class="small">Smithsonian Human Origins</span></div>
      <div class="status panel q" aria-live="polite"><strong id="progress">已归位 0 / 6</strong><div id="message" class="small" style="margin-top:8px">先判断特征长在身体哪里。</div><div class="legend" style="gap:12px;margin-top:12px"><span class="li"><i class="sw" style="color:var(--ochre)"></i>攀爬信号</span><span class="li"><i class="sw" style="color:var(--cyan)"></i>地面双足信号</span></div><button id="reset" class="btn" style="margin-top:14px">重新拼装</button></div>
      <svg id="bodySvg" class="body-svg" viewBox="0 0 1450 620" role="img" aria-label="同一身体轮廓连接上肢、骨盆与膝、足部三个区域"></svg>
      <div class="lv regions min0">
        <section class="box region" data-region="arm"><span class="bt">上肢</span><div class="slots"></div></section>
        <section class="box region" data-region="pelvis"><span class="bt">骨盆与膝</span><div class="slots"></div></section>
        <section class="box region" data-region="foot"><span class="bt">足部</span><div class="slots"></div></section>
      </div>
      <div id="cards" class="cards no-pan" role="application" tabindex="0" aria-label="六张身体特征牌；上下键换牌，左右键选区域，回车放置"></div>
    </section>
  </main>
  <footer style="height:76px;display:flex;align-items:center;justify-content:space-between;gap:28px">
    <p class="lead" style="margin:0">早期人族同时保留攀爬特征与地面双足特征；演化不是整套零件同步升级。</p>
    <p class="small" style="margin:0;max-width:520px">这样的拼接身体走得更省力吗——还要把一天的能量收支算进去。</p>
  </footer>
  <script src="assets/lib/d3.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded',function(){
    Deck.init({index:11,total:50});
    const data=[
      {id:'arms',name:'相对较长的手臂',region:'arm',kind:'攀爬信号',desc:'有利于抓握、悬垂与树上移动'},
      {id:'fingers',name:'弯曲的指骨',region:'arm',kind:'攀爬信号',desc:'经常承受抓握负荷的形态线索'},
      {id:'pelvis',name:'短而宽的骨盆',region:'pelvis',kind:'地面双足信号',desc:'支持直立时躯干与髋部稳定'},
      {id:'knee',name:'股骨向膝部内收',region:'pelvis',kind:'地面双足信号',desc:'让支撑脚更接近身体重心下方'},
      {id:'toe',name:'大脚趾与其余脚趾同向',region:'foot',kind:'地面双足信号',desc:'更适合蹬地，而非像手一样对握'},
      {id:'toecurve',name:'趾骨仍有一定弯曲',region:'foot',kind:'攀爬信号',desc:'足部并非现代人结构的完整复制'}
    ];
    let placed=new Set(), cardIndex=0, regionIndex=0;
    const regions=['arm','pelvis','foot'];
    const cards=d3.select('#cards').selectAll('.feature').data(data).join('div').attr('class','feature').attr('data-id',d=>d.id).attr('tabindex','-1').text(d=>d.name);
    const svg=d3.select('#bodySvg');
    const centers={arm:[520,210],pelvis:[725,270],foot:[930,335]};
    svg.append('path').attr('d','M725 80 C680 110 675 165 700 195 L670 275 L695 365 L660 470 M725 195 L780 275 L755 365 L790 470 M700 155 L590 245 M750 155 L860 245').attr('fill','none').attr('stroke','var(--ochre)').attr('stroke-width',10).attr('stroke-linecap','round').attr('opacity','.62');
    svg.append('circle').attr('cx',725).attr('cy',72).attr('r',38).attr('fill','none').attr('stroke','var(--ochre)').attr('stroke-width',8).attr('opacity','.62');
    const links=svg.append('g');
    function render(){
      document.querySelectorAll('.region').forEach((el,i)=>el.classList.toggle('active',i===regionIndex));
      regions.forEach(r=>{
        const host=d3.select(`.region[data-region="${r}"] .slots`);
        host.selectAll('.slot').data(data.filter(d=>d.region===r && placed.has(d.id)),d=>d.id).join('div').attr('class','slot filled').html(d=>`<strong>${d.name}</strong><span class="tag ${d.kind==='攀爬信号'?'bio':'active'}">${d.kind}</span><div class="small">${d.desc}</div>`);
      });
      cards.classed('placed',d=>placed.has(d.id));
      links.selectAll('path').data(data.filter(d=>placed.has(d.id)),d=>d.id).join('path').attr('d',d=>{const c=centers[d.region];return `M725,300 Q${c[0]},${c[1]} ${c[0]},${c[1]}`}).attr('fill','none').attr('stroke',d=>d.kind==='攀爬信号'?'var(--ochre)':'var(--cyan)').attr('stroke-width',3).attr('opacity','.72');
      document.getElementById('progress').textContent=`已归位 ${placed.size} / ${data.length}`;
      if(placed.size===data.length){document.getElementById('message').innerHTML='<span class="complete">镶嵌，而非整套升级</span><br>两类信号共存于同一身体。'}
    }
    function place(d,r){
      if(d.region!==r){document.getElementById('message').textContent='先判断它长在身体哪里。';return false}
      placed.add(d.id);document.getElementById('message').textContent=`${d.name}：${d.kind}`;render();return true;
    }
    cards.call(d3.drag().on('start',function(){d3.select(this).raise()}).on('drag',function(event){d3.select(this).style('transform',`translate(${event.x-this.offsetLeft-this.offsetWidth/2}px,${event.y-this.offsetTop-this.offsetHeight/2}px)`)}).on('end',function(event,d){
      const p=document.elementFromPoint(event.sourceEvent.clientX,event.sourceEvent.clientY);const region=p&&p.closest('.region');place(d,region?region.dataset.region:'');d3.select(this).style('transform',null);
    }));
    document.getElementById('cards').addEventListener('keydown',e=>{
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){cardIndex=(cardIndex+(e.key==='ArrowDown'?1:-1)+data.length)%data.length;e.preventDefault()}
      if(e.key==='ArrowRight'||e.key==='ArrowLeft'){regionIndex=(regionIndex+(e.key==='ArrowRight'?1:-1)+regions.length)%regions.length;e.preventDefault()}
      if(e.key==='Enter'||e.key===' '){place(data[cardIndex],regions[regionIndex]);e.preventDefault()}
      render();document.getElementById('message').textContent=`当前：${data[cardIndex].name} → ${document.querySelector(`[data-region="${regions[regionIndex]}"] .bt`).textContent}`;
    });
    document.getElementById('reset').addEventListener('click',()=>{placed.clear();cardIndex=0;regionIndex=0;document.getElementById('message').textContent='先判断特征长在身体哪里。';render()});
    render();
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
