<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="15" data-total="50">
<div id="stage">
  <style>
    .eyebrow{color:var(--ochre);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.14em}
    .viewer{border:1px solid var(--line);background:radial-gradient(circle at 50% 42%,rgba(197,106,50,.13),transparent 58%)}
    .hot{position:absolute;z-index:4;min-width:88px;min-height:38px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:999px;background:var(--bg);color:var(--muted);font:650 var(--fs-label)/1.35 var(--font-sans);cursor:pointer;transform:translate(-50%,-50%)}
    .hot[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 2px rgba(69,214,232,.18)}
    .hot:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    .real-object{width:100%;height:130px;object-fit:contain;filter:saturate(.76) contrast(1.08)}
    .readline{min-height:58px;margin:0;color:var(--text);font-size:var(--fs-sec);line-height:1.5}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
  <header style="height:104px;display:flex;align-items:flex-start;justify-content:space-between;gap:28px">
    <div><div class="eyebrow">OBJECT / EDGE</div><h1>别猜它像什么，转动它看刃缘</h1></div>
    <div class="small" style="text-align:right;padding-top:8px"><span id="age"></span><br><span title="Semaw et al., 1997">Semaw 等，1997</span></div>
  </header>

  <section class="k-process" id="process" style="height:126px;flex:none" aria-label="观察顺序">
    <div class="axis" aria-hidden="true"></div>
    <div class="step" aria-current="step"><h2>1 看整体</h2><div class="small">先转一圈，不按“像斧头／像石块”命名</div></div>
    <div class="arw" aria-hidden="true"></div>
    <div class="step"><h2>2 找结构</h2><div class="small">找到连续锐薄的刃缘与相邻敲击台面</div></div>
    <div class="arw" aria-hidden="true"></div>
    <div class="step"><h2>3 验关系</h2><div class="small">换角度，看刃缘是否避开掌心、厚部是否可握</div></div>
  </section>

  <main style="display:flex;gap:26px;padding-top:18px" class="min0">
    <section class="cvbox viewer no-pan min0" id="viewer" style="flex:1.85" aria-label="可旋转的奥杜威砍砸器结构示意">
      <canvas id="three" class="cv-fill" tabindex="0" aria-label="拖动旋转石器；方向键也可转动"></canvas>
      <button class="hot" data-part="edge" aria-pressed="false">刃缘</button>
      <button class="hot" data-part="platform" aria-pressed="false">敲击台面</button>
      <button class="hot" data-part="grip" aria-pressed="false">握持区</button>
      <div class="tag neutral" style="position:absolute;left:14px;top:14px">结构示意，不用于测量</div>
      <div class="hint" style="position:absolute;left:18px;bottom:14px">拖动物体环绕；点击三个结构标签</div>
    </section>
    <aside class="min0" style="flex:.72;display:flex;flex-direction:column;gap:14px">
      <figure class="box" style="margin:0;height:192px">
        <img class="real-object" src="assets/img/oldowan-chopper.png" alt="真实奥杜威砍砸器照片" title="奥杜威砍砸器实物">
        <figcaption class="small" style="text-align:center">真实物件对照</figcaption>
      </figure>
      <section class="panel" style="flex:1" aria-live="polite">
        <div class="eyebrow" id="part-title">先看整体</div>
        <p class="readline" id="reading">外形不能单独证明用途。转动同一件石器，再寻找结构。</p>
        <div class="it" id="relation" style="font-size:var(--fs-sec);line-height:1.5;color:var(--muted)">三处都看过后，空间关系会连起来。</div>
      </section>
      <button class="btn" id="reset" type="button">复位观察</button>
    </aside>
  </main>
  <footer style="height:104px;display:flex;align-items:center;justify-content:space-between;gap:36px">
    <p class="lead" style="margin:0;max-width:1040px">一块奥杜威砍砸器的关键不是外形像不像工具，而是敲击产生的刃、台面与可握持区域如何配合。</p>
    <p class="small" style="margin:0;text-align:right">关系看清了；下一页再试这些刃缘怎样被敲出来。</p>
  </footer>
  <script src="assets/lib/three.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded',function(){
    Deck.init({index:15,total:50});
    document.getElementById('age').textContent='传统奥杜威工业：约 '+((Lec.K.evolution.earliestHomoYearsAgo*13/14)/10000).toFixed(0)+' 万年前起';
    var box=document.getElementById('viewer'),canvas=document.getElementById('three');
    var scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,1,.1,100);
    camera.position.set(0,1.1,6.2);
    var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
    renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    var group=new THREE.Group();scene.add(group);
    var verts=[],rings=9,sides=12;
    for(var r=0;r<rings;r++){
      var y=-1.65+r*(3.3/(rings-1)), t=r/(rings-1), width=.72+Math.sin(t*Math.PI)*.72;
      for(var s=0;s<sides;s++){var a=s/sides*Math.PI*2;var x=Math.cos(a)*width*(.9+.12*Math.sin(r*2+s));var z=Math.sin(a)*(.48+.3*Math.sin(t*Math.PI))*(.92+.1*Math.cos(s*3));if(s===0||s===11)x*=.46;verts.push(x,y,z);}
    }
    var idx=[];for(var r=0;r<rings-1;r++)for(var s=0;s<sides;s++){var n=(s+1)%sides,a=r*sides+s,b=r*sides+n,c=(r+1)*sides+s,d=(r+1)*sides+n;idx.push(a,c,b,b,c,d);}
    var geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(idx);geo.computeVertexNormals();
    var stone=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x8d603f,roughness:.93,metalness:0,flatShading:true}));stone.castShadow=true;group.add(stone);
    var floor=new THREE.Mesh(new THREE.CircleGeometry(2.4,48),new THREE.ShadowMaterial({color:0x000000,opacity:.35}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.72;floor.receiveShadow=true;scene.add(floor);
    scene.add(new THREE.HemisphereLight(0xdce9eb,0x2a160d,1.5));var key=new THREE.DirectionalLight(0xffd8b5,3.2);key.position.set(3,5,4);key.castShadow=true;scene.add(key);var rim=new THREE.DirectionalLight(0x45d6e8,2);rim.position.set(-4,1,-3);scene.add(rim);
    var cyan=new THREE.MeshBasicMaterial({color:0x45d6e8,transparent:true,opacity:.12});
    var points={edge:new THREE.Vector3(.7,.15,.58),platform:new THREE.Vector3(-.15,1.27,.46),grip:new THREE.Vector3(-.55,-.72,.32)};
    var hitMeshes=[];Object.keys(points).forEach(function(k){var m=new THREE.Mesh(new THREE.SphereGeometry(.25,18,12),cyan.clone());m.position.copy(points[k]);m.userData.part=k;group.add(m);hitMeshes.push(m);});
    var yaw=-.48,pitch=.12,drag=false,last={x:0,y:0},seen=new Set(),ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
    var labels={edge:['刃缘','刃缘负责接触材料。'],platform:['敲击台面','台面保留受击关系。'],grip:['握持区','厚部提供可握持区域，并让锐薄刃缘避开掌心。']};
    function size(){var w=box.clientWidth,h=box.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();render();}
    function render(){group.rotation.y=yaw;group.rotation.x=pitch;renderer.render(scene,camera);Object.keys(points).forEach(function(k){var p=points[k].clone();group.localToWorld(p);p.project(camera);var b=document.querySelector('[data-part="'+k+'"]');b.style.left=((p.x+1)*50)+'%';b.style.top=((-p.y+1)*50)+'%';});}
    function update(part){seen.add(part);hitMeshes.forEach(function(m){var on=m.userData.part===part;m.material.opacity=on ? .72 : .12;m.scale.setScalar(on?1.25:1);});document.querySelectorAll('.hot').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.part===part?'true':'false');});document.getElementById('part-title').textContent=labels[part][0];document.getElementById('reading').textContent=labels[part][1];var step=seen.size===3?2:1;document.querySelectorAll('#process .step').forEach(function(el,i){el.removeAttribute('aria-current');el.classList.toggle('done',i<step);if(i===step)el.setAttribute('aria-current','step');});if(seen.size===3)document.getElementById('relation').textContent='刃缘接触材料，台面记录受击，厚部留给手掌：功能来自三者的空间配合。';render();}
    function pick(e){var p=Deck.pt(canvas,e);mouse.set(p.x/canvas.offsetWidth*2-1,-p.y/canvas.offsetHeight*2+1);ray.setFromCamera(mouse,camera);var h=ray.intersectObjects(hitMeshes)[0];if(h)update(h.object.userData.part);}
    canvas.addEventListener('pointerdown',function(e){drag=true;last=Deck.pt(canvas,e);canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',function(e){if(!drag)return;var p=Deck.pt(canvas,e);yaw+=(p.x-last.x)*.008;pitch=Deck.clamp(pitch+(p.y-last.y)*.005,-.38,.38);last=p;render();});canvas.addEventListener('pointerup',function(e){drag=false;pick(e);});
    canvas.addEventListener('keydown',function(e){if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(e.key)<0)return;e.preventDefault();if(e.key==='ArrowLeft')yaw-=.12;if(e.key==='ArrowRight')yaw+=.12;if(e.key==='ArrowUp')pitch=Deck.clamp(pitch-.08,-.38,.38);if(e.key==='ArrowDown')pitch=Deck.clamp(pitch+.08,-.38,.38);render();});
    document.querySelectorAll('.hot').forEach(function(b){b.addEventListener('click',function(){update(b.dataset.part);});});
    document.getElementById('reset').addEventListener('click',function(){yaw=-.48;pitch=.12;seen.clear();hitMeshes.forEach(function(m){m.material.opacity=.12;m.scale.setScalar(1);});document.querySelectorAll('.hot').forEach(function(b){b.setAttribute('aria-pressed','false');});document.querySelectorAll('#process .step').forEach(function(el,i){el.classList.remove('done');el.removeAttribute('aria-current');if(i===0)el.setAttribute('aria-current','step');});document.getElementById('part-title').textContent='先看整体';document.getElementById('reading').textContent='外形不能单独证明用途。转动同一件石器，再寻找结构。';document.getElementById('relation').textContent='三处都看过后，空间关系会连起来。';render();});
    var off=Deck.onResize(size);size();window.addEventListener('pagehide',function(){off();geo.dispose();stone.material.dispose();hitMeshes.forEach(function(m){m.geometry.dispose();m.material.dispose();});renderer.dispose();},{once:true});
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
