<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#compare > .hdr{padding:7px 10px 8px}
#compare > .dim,#compare > .cell{padding-top:7px;padding-bottom:7px}
</style>
</head>
<body data-page="16" data-total="50">
<div id="stage">
  <header style="height:92px;display:flex;align-items:flex-start;justify-content:space-between;gap:28px">
    <div class="min0">
      <div class="tag bio" style="margin-bottom:8px">STONE / STRIKE</div>
      <h1>敲得更重，不一定敲得更好</h1>
    </div>
    <p class="hint" style="margin-top:18px">调好参数，再敲击石核；在五次内取得三枚可用石片。</p>
  </header>

  <main style="display:flex;flex-direction:column;gap:16px">
    <section style="height:340px;display:flex;gap:20px" aria-label="敲击实验">
      <div class="cvbox min0" style="flex:1;border:1px solid var(--line-strong)">
        <canvas id="world" class="cv-fill" aria-label="锤石撞击固定石核的侧视动画"></canvas>
        <div style="position:absolute;left:20px;top:16px;display:flex;gap:10px">
          <span class="tag neutral">锤石</span><span class="tag bio">石核</span><span id="flakeTag" class="tag active" hidden>石片</span>
        </div>
        <div id="sceneStatus" class="note" aria-live="polite" style="position:absolute;left:20px;bottom:16px;max-width:560px;margin:0">选择原料、角度与力度，然后敲击。</div>
      </div>

      <aside class="panel min0" style="width:470px;display:flex;flex-direction:column;gap:14px" aria-label="当前敲击参数">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
          <h2 style="margin:0">当前参数</h2>
          <div><span class="small">剩余敲击</span> <span id="tries" class="big sm">5</span></div>
        </div>
        <label for="material" style="font-size:var(--fs-label);font-weight:650">原料</label>
        <select id="material" style="min-height:44px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;padding:6px 10px">
          <option value="fine">燧石质细粒石料</option>
          <option value="quartzite">石英岩</option>
          <option value="basalt">玄武岩</option>
        </select>
        <div class="ctl" style="gap:12px">
          <label for="angle">敲击角度</label><input id="angle" type="range"><output id="angleOut" class="num">60°</output>
        </div>
        <div class="ctl" style="gap:12px">
          <label for="force">力度</label><input id="force" type="range"><output id="forceOut" class="num">6</output>
        </div>
        <div class="small">力度为教学刻度；角度决定锤石入射方向。</div>
        <div class="btns" style="gap:10px;margin-top:auto">
          <button id="strike" class="btn lg" type="button">敲击</button>
          <button id="reset" class="btn" type="button">重新开始</button>
        </div>
      </aside>
    </section>

    <section class="min0" style="flex:1;display:flex;flex-direction:column">
      <div style="display:flex;align-items:end;justify-content:space-between;gap:20px;height:42px">
        <h2 style="margin:0">最近三次：同一维度对照</h2>
        <span class="small">简化模型，不是真实断裂预测</span>
      </div>
      <div id="compare" class="k-comparison" style="--compare-n:3" aria-label="最近三次敲击对照"></div>
    </section>
  </main>

  <footer style="height:72px;display:flex;align-items:center;justify-content:space-between;gap:32px;border-top:1px solid var(--line)">
    <p class="lead" style="margin:0">敲击角度、力度与原料必须匹配；可用刃缘来自控制，而非单纯蛮力。</p>
    <p class="small" style="margin:0;text-align:right;max-width:570px">石器会变化，制造者却不是排队升级——下一页把“进化阶梯”改成灌木。</p>
  </footer>
  <script src="assets/lib/matter.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    Deck.init({index:16,total:50});
    var U=Lec.K.units, M=Matter;
    var N={minAngle:U.secondsPerMinute/2,maxAngle:U.secondsPerMinute+U.hoursPerDay+1,angle:U.secondsPerMinute,
      minForce:U.metresPerCentimetre*200,maxForce:U.metresPerCentimetre*1000,force:U.metresPerCentimetre*600,
      attempts:U.metresPerCentimetre*500,goal:U.metresPerCentimetre*300};
    var materials={
      fine:{name:'燧石质细粒石料',a:U.secondsPerMinute-10,tol:U.metresPerCentimetre*1000,f0:U.metresPerCentimetre*400,f1:U.metresPerCentimetre*600},
      quartzite:{name:'石英岩',a:U.secondsPerMinute,tol:U.metresPerCentimetre*1000,f0:U.metresPerCentimetre*600,f1:U.metresPerCentimetre*800},
      basalt:{name:'玄武岩',a:U.secondsPerMinute-5,tol:U.metresPerCentimetre*1000,f0:U.metresPerCentimetre*700,f1:U.metresPerCentimetre*900}
    };
    var state, engine, hammer, core, flake=null, running=false, collisionHandler, stopLoop, ctx;
    var cv=document.getElementById('world'), angle=document.getElementById('angle'), force=document.getElementById('force');
    angle.min=N.minAngle; angle.max=N.maxAngle; angle.value=N.angle;
    force.min=N.minForce; force.max=N.maxForce; force.value=N.force;
    function fresh(){return {tries:N.attempts,good:0,history:[],ended:false};}
    function evaluate(key,a,f){
      var m=materials[key], angleOK=Math.abs(a-m.a)<=m.tol, forceOK=f>=m.f0&&f<=m.f1;
      if(angleOK&&forceOK){var sharp=Math.round(60+40*(1-Math.min(1,Math.abs(a-m.a)/m.tol)*.45-Math.abs(f-(m.f0+m.f1)/2)/((m.f1-m.f0)/2)*.35));return {result:'可用石片',sharp:sharp,kind:'good'};}
      if(f<m.f0||a<m.a-m.tol)return {result:'未起片',sharp:null,kind:'weak'};
      return {result:'过厚或碎裂',sharp:null,kind:'heavy'};
    }
    function setupBodies(){
      if(engine) M.Engine.clear(engine);
      engine=M.Engine.create({gravity:{x:0,y:0}});
      core=M.Bodies.polygon(690,205,7,86,{isStatic:true,label:'core'});
      M.Composite.add(engine.world,core);
      collisionHandler=function(e){e.pairs.forEach(function(p){if(running&&((p.bodyA===hammer&&p.bodyB===core)||(p.bodyB===hammer&&p.bodyA===core))) finishStrike();});};
      M.Events.on(engine,'collisionStart',collisionHandler);
    }
    function launch(){
      if(running||state.ended)return;
      running=true; document.getElementById('strike').disabled=true; document.getElementById('flakeTag').hidden=true;
      if(hammer) M.Composite.remove(engine.world,hammer); if(flake) M.Composite.remove(engine.world,flake); flake=null;
      var a=Number(angle.value), f=Number(force.value), rad=a*Math.PI/180;
      hammer=M.Bodies.circle(120,330,38,{label:'hammer',restitution:.15});
      M.Composite.add(engine.world,hammer);
      M.Body.setVelocity(hammer,{x:(5+f*.55)*Math.cos(rad-Math.PI/3.2),y:-(2+f*.18)*Math.sin(rad)});
      document.getElementById('sceneStatus').textContent='锤石正在接近石核……';
    }
    function finishStrike(){
      if(!running)return; running=false;
      var key=document.getElementById('material').value,a=Number(angle.value),f=Number(force.value),r=evaluate(key,a,f);
      state.tries--; if(r.kind==='good')state.good++;
      state.history.push({material:materials[key].name,angle:a,force:f,result:r.result,sharp:r.sharp});
      if(state.history.length>3)state.history.shift();
      if(r.kind!=='weak'){
        flake=M.Bodies.polygon(745,195,r.kind==='good'?3:5,r.kind==='good'?34:45,{label:'flake'});
        M.Composite.add(engine.world,flake); M.Body.setVelocity(flake,{x:r.kind==='good'?5:2,y:r.kind==='good'?-2.5:-1});
        document.getElementById('flakeTag').hidden=false;
      }
      state.ended=state.good>=N.goal||state.tries<=0;
      var msg=r.result+(r.sharp!==null?'，估算锐利度 '+r.sharp:'')+'。';
      if(state.ended)msg+=(state.good>=N.goal?'目标达成：参数匹配得到三枚可用石片。':'机会用完：重来并比较哪一项需要调整。');
      document.getElementById('sceneStatus').textContent=msg; update();
    }
    function update(){
      document.getElementById('tries').textContent=state.tries;
      document.getElementById('angleOut').textContent=angle.value+'°'; document.getElementById('forceOut').textContent=force.value;
      document.getElementById('strike').disabled=running||state.ended;
      var rows=[['敲击角度',function(x){return x.angle+'°';}],['力度',function(x){return x.force+'（教学刻度）';}],['原料',function(x){return x.material;}],['结果',function(x){return x.result;}],['刃缘读数',function(x){return x.sharp===null?'—':x.sharp;}]];
      var slots=[null,null,null], start=3-state.history.length; state.history.forEach(function(x,i){slots[start+i]=x;});
      var html='<div class="hdr dim">维度</div>'+slots.map(function(x,i){return '<div class="hdr '+(x&&i===2?'diff':'')+'">'+(x?'尝试 '+(state.history.length-(2-i)):'等待敲击')+'</div>';}).join('');
      rows.forEach(function(row){html+='<div class="rowline"></div><div class="dim">'+row[0]+'</div>'+slots.map(function(x,i){return '<div class="cell '+(x&&i===2?'diff':'')+'">'+(x?row[1](x):'—')+'</div>';}).join('');});
      document.getElementById('compare').innerHTML=html;
    }
    function draw(){
      ctx=Deck.fit(cv); var w=cv.offsetWidth,h=cv.offsetHeight;
      ctx.clearRect(0,0,w,h); ctx.strokeStyle=Deck.rgba('--line-strong',.7);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,h-46);ctx.lineTo(w,h-46);ctx.stroke();
      function body(b,fill,stroke){var v=b.vertices;ctx.beginPath();ctx.moveTo(v[0].x,v[0].y);for(var i=1;i<v.length;i++)ctx.lineTo(v[i].x,v[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke();}
      body(core,Deck.rgba('--ochre',.35),Deck.rgba('--ochre',1));
      if(hammer)body(hammer,Deck.rgba('--muted',.38),Deck.rgba('--text',.85));
      if(flake)body(flake,Deck.rgba('--cyan',.25),Deck.rgba('--cyan',1));
      var a=Number(angle.value)*Math.PI/180; Deck.arrow(ctx,125,285,125+100*Math.cos(-a),285+100*Math.sin(-a),10);
    }
    function reset(){state=fresh();running=false;angle.value=N.angle;force.value=N.force;document.getElementById('material').value='fine';document.getElementById('sceneStatus').textContent='选择原料、角度与力度，然后敲击。';document.getElementById('flakeTag').hidden=true;setupBodies();hammer=null;flake=null;update();draw();}
    angle.addEventListener('input',function(){update();draw();}); force.addEventListener('input',function(){update();draw();});
    document.getElementById('strike').addEventListener('click',launch);document.getElementById('reset').addEventListener('click',reset);
    reset(); Deck.autofit(cv,draw);
    stopLoop=Deck.loop(function(t,dt){if(engine){M.Engine.update(engine,Math.min(dt||16.67,33));if(hammer&&hammer.position.x>cv.offsetWidth+80){running=false;document.getElementById('strike').disabled=false;}draw();}},{still:1});
    window.addEventListener('pagehide',function(){if(stopLoop)stopLoop();if(engine){M.Events.off(engine,'collisionStart',collisionHandler);M.Engine.clear(engine);}});
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
