<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="18" data-total="50">
<div id="stage">
  <style>
    .plate-head{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line)}
    .plate-kicker{color:var(--ochre);font-size:var(--fs-sec);font-weight:700;letter-spacing:.12em}
    .plate-head h1{margin:8px 0 0}
    .plate-code{color:var(--muted);font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.08em}
    .wire-step{display:flex;flex-direction:column;gap:8px;padding:10px 10px!important}
    .wire-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .wire-title strong{font-size:var(--fs-h2);line-height:1.35}
    .wire-view{position:relative;display:flex;flex-direction:column;flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;background-image:linear-gradient(var(--line-strong) 1px,transparent 1px),linear-gradient(90deg,var(--line-strong) 1px,transparent 1px);background-size:32px 32px}
    .wire-view svg{width:100%;height:auto;display:block;flex:1;min-height:0;overflow:visible}
    .wire{fill:none;stroke:var(--line-strong);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
    .wire.bio-line{stroke:var(--ochre)}
    .wire.active-line{stroke:var(--cyan)}
    .route{fill:none;stroke:var(--line-strong);stroke-width:1.4;stroke-dasharray:5 5;vector-effect:non-scaling-stroke}
    .dot{fill:var(--bg);stroke:var(--cyan);stroke-width:2;vector-effect:non-scaling-stroke}
    .callout{display:flex;flex-direction:column;flex:0 0 90px;padding:10px 12px;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
    .callout b{padding-bottom:7px;color:var(--text);font-weight:650}
    .callout span{flex:1;padding:5px 8px;border-top:1px solid var(--line)}
    .arw.flow{position:relative;flex-basis:44px;width:44px;padding:0 6px;text-align:center}
    .arw.flow span{position:absolute;top:calc(50% + 28px);left:50%;width:122px;color:var(--muted);font-size:var(--fs-label);line-height:1.35;transform:translateX(-50%)}
    .arw.flow::before{font-size:30px}
    .plate-foot{display:flex;align-items:center;justify-content:space-between;gap:40px;border-top:1px solid var(--line)}
    .plate-foot .lead{margin:0;max-width:930px}
    .next{max-width:470px;margin:0;padding-left:18px;border-left:2px solid var(--cyan);color:var(--text);font-size:var(--fs-sec);line-height:1.5}
  </style>

  <header class="plate-head" style="height:112px;padding-top:4px">
    <div>
      <div class="plate-kicker">III · 体外适应</div>
      <h1>身体之后，谁来承担生存？</h1>
    </div>
    <div class="plate-code" style="padding-top:12px">功能转移 / 并存叠加</div>
  </header>

  <main class="min0" style="display:flex;padding:28px 0 24px">
    <section class="k-process min0" aria-label="适应功能从身体内逐步转向身体外的过程">
      <div class="axis" aria-hidden="true"></div>

      <article class="step wire-step min0">
        <div class="wire-title"><strong>身体</strong><span class="tag bio">身体内</span></div>
        <div class="wire-view min0">
          <svg viewBox="0 0 260 360" role="img" aria-label="人体轮廓线稿">
            <circle class="wire bio-line" cx="130" cy="55" r="28"/>
            <path class="wire bio-line" d="M104 94 Q130 78 156 94 L166 182 149 255 158 330 M111 330 120 254 94 182Z"/>
            <path class="wire bio-line" d="M101 112 57 195 M159 112 204 195"/>
            <path class="route" d="M92 146H34V112H8"/><circle class="dot" cx="92" cy="146" r="4"/>
          </svg>
          <div class="callout" style="left:0;top:18px"><b>自身承担</b><span>移动</span><span>取食</span><span>散热</span></div>
        </div>
      </article>

      <div class="arw flow" aria-label="能力开始外移"><span>能力开始外移</span></div>

      <article class="step wire-step min0">
        <div class="wire-title"><strong>石头</strong><span class="tag neutral">体外承担</span></div>
        <div class="wire-view min0">
          <svg viewBox="0 0 260 360" role="img" aria-label="石头与刃缘线稿">
            <path class="wire" d="M54 247 82 104 174 57 218 137 191 286 96 310Z"/>
            <path class="wire active-line" d="M54 247 96 310 191 286"/>
            <path class="wire" d="M82 104 137 143 174 57 M137 143 218 137 M137 143 96 310 M137 143 191 286"/>
            <path class="route" d="M173 286H224V320H252"/><circle class="dot" cx="173" cy="286" r="4"/>
          </svg>
          <div class="callout" style="right:0;bottom:8px;text-align:right"><b>刃缘与重量</b><span>切</span><span>砸</span><span>刮</span></div>
        </div>
      </article>

      <div class="arw flow" aria-label="把牙齿与指甲延长"><span>把牙齿与指甲延长</span></div>

      <article class="step wire-step min0">
        <div class="wire-title"><strong>火</strong><span class="tag neutral">体外承担</span></div>
        <div class="wire-view min0">
          <svg viewBox="0 0 260 360" role="img" aria-label="火焰与热区线稿">
            <path class="wire" d="M130 310C61 300 48 235 83 187c19-27 33-49 32-91 41 27 69 66 55 111 20-13 29-32 29-52 39 54 25 139-69 155Z"/>
            <path class="wire active-line" d="M130 283c-30-3-44-31-28-57 11-18 23-31 25-56 26 22 44 51 29 79 14-5 22-15 26-29 9 31-8 60-52 63Z"/>
            <path class="route" d="M175 111H220V76H252"/><circle class="dot" cx="175" cy="111" r="4"/>
          </svg>
          <div class="callout" style="right:0;top:4px;text-align:right"><b>可控热区</b><span>加热</span><span>照明</span><span>防护</span></div>
        </div>
      </article>

      <div class="arw flow" aria-label="把能量控制移出身体"><span>把能量控制移出身体</span></div>

      <article class="step wire-step min0" aria-current="step">
        <div class="wire-title"><strong>同伴</strong><span class="tag neutral">体外承担</span></div>
        <div class="wire-view min0">
          <svg viewBox="0 0 260 360" role="img" aria-label="三人协作轮廓线稿">
            <circle class="wire" cx="130" cy="80" r="24"/><circle class="wire" cx="62" cy="126" r="21"/><circle class="wire" cx="198" cy="126" r="21"/>
            <path class="wire" d="M106 127Q130 108 154 127L164 229 145 307H115L96 229Z"/>
            <path class="wire" d="M42 166Q62 151 82 166L91 243 78 307H48L34 243Z M178 166Q198 151 218 166L226 243 212 307H182L169 243Z"/>
            <path class="wire active-line" d="M81 185 111 164 M179 185 149 164 M91 222 130 244 169 222"/>
            <path class="route" d="M130 244V326H238"/><circle class="dot" cx="130" cy="244" r="4"/>
          </svg>
          <div class="callout" style="right:0;bottom:4px;text-align:right"><b>群体分担</b><span>分享</span><span>守护</span><span>传递</span></div>
        </div>
      </article>
    </section>
  </main>

  <footer class="plate-foot" style="height:98px">
    <p class="lead">身体跨过第一道门槛后，石头、火与同伴开始承担越来越多适应功能。</p>
    <p class="next">但工具不会自己工作——先看手如何把“能握住”变成“有效动作”。</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
