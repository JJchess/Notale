<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="25" data-total="50">
<div id="stage">
  <style>
    .race-chart{width:100%;height:100%;min-height:0}
    .race-read{display:flex;align-items:baseline;justify-content:flex-end;gap:28px}
    .race-read span{font-size:var(--fs-sec);color:var(--muted)}
    .race-read strong{font-family:var(--font-mono);font-size:28px;color:var(--text);font-variant-numeric:tabular-nums}
    .k-comparison.compact>.dim,.k-comparison.compact>.cell{padding-top:8px;padding-bottom:8px}
    .k-comparison.chart-compare{grid-template-rows:auto minmax(0,1fr)}
    .chart-span{grid-column:2 / -1;min-height:0;border-left:3px solid var(--cyan)}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
  <header style="height:84px;display:flex;align-items:flex-start;justify-content:space-between;gap:24px">
    <div><div class="tag neutral">GENES × CULTURE</div><h1 style="margin-top:8px">同样 100 代，谁传播得更快？</h1></div>
    <div class="race-read" aria-live="polite" style="padding-top:22px">
      <span>第 <strong id="genRead">0</strong> 代</span>
      <span style="color:var(--ochre)">基因 <strong id="geneRead">5.0%</strong></span>
      <span style="color:var(--cyan)">文化 <strong id="cultureRead">5.0%</strong></span>
    </div>
  </header>

  <main style="display:flex;flex-direction:column;gap:12px">
    <section class="k-comparison chart-compare min0" style="height:408px;--compare-n:2" aria-label="基因与文化传播竞跑图">
      <div class="hdr dim">共享尺度</div>
      <div class="hdr"><span class="tag bio">基因频率</span></div>
      <div class="hdr diff"><span class="tag active">文化持有率</span></div>
      <div class="dim">0–100 代<br>0–100%<br>同为 5% 起点</div>
      <div class="chart-span cvbox min0"><div id="chart" class="race-chart" role="img" aria-label="基因频率与文化持有率共用坐标轴的折线图"></div></div>
    </section>

    <section class="panel" style="height:82px;display:flex;align-items:center;gap:28px">
      <div class="ctl min0" style="flex:1;gap:16px">
        <label for="contacts">横向接触</label>
        <input id="contacts" type="range" min="0" max="2" step="1" value="1">
        <output id="contactRead" class="num">1 人／持有者／代</output>
      </div>
      <div class="btns" style="gap:10px">
        <button id="start" class="btn lg" type="button">开始竞跑</button>
        <button id="reset" class="btn" type="button">复位</button>
      </div>
      <div class="hint">调节接触人数，再让两条线同步推进。</div>
    </section>

    <section class="k-comparison compact min0" style="height:164px;--compare-n:2" aria-label="两种传播方式逐项比较">
      <div class="hdr dim">共同维度</div><div class="hdr">基因特征</div><div class="hdr diff">文化特征</div>
      <div class="dim">传播方向</div><div class="cell">仅进入下一代</div><div class="cell diff">亲子保留＋同代横向接触</div>
      <div class="rowline"></div>
      <div class="dim">增量来源</div><div class="cell"><span class="num">s = 0.02</span> 的选择</div><div class="cell diff">保留率 98%；传递率 8%</div>
      <div class="rowline"></div>
      <div class="dim">第 100 代</div><div class="cell num" id="geneFinal">—</div><div class="cell diff num" id="cultureFinal">—</div>
    </section>
  </main>

  <footer style="height:94px;display:flex;align-items:center;justify-content:space-between;gap:30px;border-top:1px solid var(--line)">
    <div style="max-width:920px"><p class="lead" style="margin:0">文化特征不只沿亲子方向传递；横向传播能让它在同样代数内更快覆盖群体。</p><p class="small" style="margin:3px 0 0">参数均为课堂示意模型，不是史前人群测量值。</p></div>
    <p class="note" style="margin:0;max-width:430px">下一问：快速积累的知识，怎样随人群接力进入新环境？</p>
  </footer>
  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/lib/seedrandom.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded',function(){
    Deck.init({index:25,total:50});
    var chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
    var contacts=document.getElementById('contacts'), start=document.getElementById('start');
    var stopLoop=null, current=0, gene=[], culture=[];
    function simulate(n){
      var rng=new Math.seedrandom('gene-culture-25'), held=new Array(200).fill(false), i,g;
      for(i=0;i<10;i++) held[i]=true;
      var out=[5];
      for(g=1;g<=100;g++){
        var old=held.slice(), next=old.map(function(v){return v&&rng()<0.98;});
        for(i=0;i<200;i++) if(old[i]) for(var j=0;j<n;j++){
          var target=Math.floor(rng()*200);
          if(!old[target]&&rng()<0.08) next[target]=true;
        }
        held=next; out.push(held.filter(Boolean).length/2);
      }
      return out;
    }
    function build(){
      var n=Number(contacts.value); culture=simulate(n); gene=[];
      for(var g=0;g<=100;g++) gene.push(Lec.P.selectedAlleleFrequency(0.05,0.02,g)*100);
      document.getElementById('contactRead').textContent=n+' 人／持有者／代';
      document.getElementById('geneFinal').textContent=gene[100].toFixed(1)+'%';
      document.getElementById('cultureFinal').textContent=culture[100].toFixed(1)+'%';
      render(current);
    }
    function render(to){
      current=Math.max(0,Math.min(100,to));
      chart.setOption({
        animation:false,textStyle:{fontSize:16,color:'#E8EEF0'},
        grid:{left:68,right:30,top:18,bottom:48},
        tooltip:{trigger:'axis',textStyle:{fontSize:16}},
        legend:{top:0,right:28,textStyle:{fontSize:14,color:'#E8EEF0'},data:['基因频率','文化持有率']},
        xAxis:{type:'value',min:0,max:100,interval:20,name:'代',nameTextStyle:{fontSize:14,color:'#9CAAAF'},axisLabel:{fontSize:13,color:'#9CAAAF'},axisLine:{lineStyle:{color:'#62747B'}},splitLine:{lineStyle:{color:'#35434A'}}},
        yAxis:{type:'value',min:0,max:100,interval:20,name:'持有比例（%）',nameTextStyle:{fontSize:14,color:'#9CAAAF'},axisLabel:{fontSize:13,color:'#9CAAAF'},axisLine:{lineStyle:{color:'#62747B'}},splitLine:{lineStyle:{color:'#35434A'}}},
        series:[
          {name:'基因频率',type:'line',showSymbol:false,data:gene.slice(0,current+1).map(function(v,i){return [i,v]}),lineStyle:{width:4,color:'#C56A32'},itemStyle:{color:'#C56A32'}},
          {name:'文化持有率',type:'line',showSymbol:false,data:culture.slice(0,current+1).map(function(v,i){return [i,v]}),lineStyle:{width:4,color:'#45D6E8'},itemStyle:{color:'#45D6E8'}}
        ]
      },true);
      document.getElementById('genRead').textContent=current;
      document.getElementById('geneRead').textContent=gene[current].toFixed(1)+'%';
      document.getElementById('cultureRead').textContent=culture[current].toFixed(1)+'%';
    }
    function halt(){if(stopLoop){stopLoop();stopLoop=null} start.disabled=false;contacts.disabled=false}
    contacts.addEventListener('input',function(){halt();current=0;build()});
    start.addEventListener('click',function(){
      halt(); current=0; build(); start.disabled=true;contacts.disabled=true;
      if(Deck.reduced()){render(100);halt();return}
      var acc=0; stopLoop=Deck.loop(function(t,dt){acc+=dt;if(acc>=24){var step=Math.floor(acc/24);acc%=24;render(Math.min(100,current+step));if(current>=100)halt()}},{still:100});
    });
    document.getElementById('reset').addEventListener('click',function(){halt();contacts.value='1';current=0;build()});
    Deck.onResize(function(){chart.resize()});
    window.addEventListener('pagehide',function(){halt();chart.dispose()},{once:true});
    build();
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
