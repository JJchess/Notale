<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .kicker{color:var(--ochre);font:700 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.16em}
  #globe{position:absolute;inset:0}
  #globe canvas{cursor:grab}
  #globe canvas:active{cursor:grabbing}
  .map-note{position:absolute;left:18px;bottom:16px;z-index:2;max-width:390px;padding:8px 11px;border-left:2px solid var(--line-strong);background:rgba(11,15,18,.78);color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
  .origin-photo{position:absolute;right:18px;top:18px;z-index:2;width:230px;height:128px;border:1px solid var(--ochre);border-radius:10px;object-fit:cover}
  .status{position:absolute;left:18px;top:18px;z-index:2;padding:9px 12px;border:1px solid var(--line-strong);border-radius:8px;background:rgba(11,15,18,.82);font-size:var(--fs-sec);line-height:1.4}
  .k-process>.step{padding:12px 12px 10px;cursor:pointer;color:var(--text);font:inherit;text-align:left;border-right:0;border-bottom:0;border-left:0}
  .k-process>.step:disabled{cursor:default;color:var(--muted)}
  .k-process>.step:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .step strong{display:block;margin-bottom:4px;font-size:var(--fs-sec);line-height:1.35}
  .step span{display:block;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
  .step[aria-current="step"] span{color:var(--cyan)}
  .ending{min-height:29px;color:var(--cyan);font-size:var(--fs-lead);line-height:1.45}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-page="26" data-total="50">
<div id="stage">
  <header style="height:94px;display:flex;align-items:flex-start;justify-content:space-between;gap:24px">
    <div><div class="kicker">CULTURAL RELAY</div><h1>生存不是英雄远征，而是一场迁徙接力</h1></div>
    <div class="btns" style="padding-top:10px"><button id="reset" class="btn" type="button">重新接力</button></div>
  </header>
  <main style="display:flex;flex-direction:column;gap:14px">
    <section class="cvbox no-pan min0" style="flex:1;border:1px solid var(--line)" aria-label="课堂假想迁徙接力地球">
      <div id="globe"></div>
      <div id="status" class="status" aria-live="polite">起点已就绪：点击图尔卡纳湖区</div>
      <img class="origin-photo" src="assets/img/olduvai-gorge.jpg" alt="奥杜威峡谷地貌照片" title="奥杜威峡谷真实照片">
      <div class="map-note">拖动地球观察位置；依次点击下一节点。<br>示意情境，不代表单次真实路线或年代。</div>
    </section>
    <section style="height:190px;display:flex;flex-direction:column;gap:8px">
      <div class="k-process" id="relay" aria-label="五步迁徙接力过程">
        <button class="step" type="button" data-i="0" disabled><strong>奥杜威峡谷</strong><span>从熟悉环境出发</span><span>身体：行走与耐热</span></button><i class="arw" aria-hidden="true"></i>
        <button class="step" type="button" data-i="1"><strong>图尔卡纳湖区</strong><span>水源与食物波动</span><span>工具：切割、加工、携带</span></button><i class="arw" aria-hidden="true"></i>
        <button class="step" type="button" data-i="2"><strong>埃塞俄比亚高地</strong><span>寒夜与陌生地形</span><span>知识：营地、路线、季节线索</span></button><i class="arw" aria-hidden="true"></i>
        <button class="step" type="button" data-i="3"><strong>红海南口</strong><span>新资源与补给间隔</span><span>协作：分享、守护、照料</span></button><i class="arw" aria-hidden="true"></i>
        <button class="step" type="button" data-i="4"><strong>下一群体</strong><span>个体经验会消失</span><span>教学：把组合继续传下去</span></button>
      </div>
      <div id="ending" class="ending" aria-live="polite"></div>
    </section>
  </main>
  <footer style="height:48px;display:flex;align-items:flex-end;justify-content:space-between;gap:28px">
    <div class="small">下一问：接力为何能越走越远——把石器、火、协作与教学连成一条体外进化链。</div>
  </footer>
  <script src="assets/lib/three.min.js"></script>
  <script src="assets/lib/globe.gl.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded',function(){
    Deck.init({index:26,total:50});
    var places=[
      {name:'奥杜威峡谷',lat:-2.99,lng:35.35,gate:'从熟悉环境出发'},
      {name:'图尔卡纳湖区',lat:3.50,lng:36.00,gate:'水源与食物波动'},
      {name:'埃塞俄比亚高地',lat:9.00,lng:39.00,gate:'寒夜与陌生地形'},
      {name:'红海南口',lat:12.60,lng:43.30,gate:'新资源与补给间隔'},
      {name:'下一群体',lat:14.50,lng:45.50,gate:'个体经验会消失'}
    ];
    var current=0, host=document.getElementById('globe'), status=document.getElementById('status');
    var cyan=Deck.token('--cyan'), ochre=Deck.token('--ochre'), muted=Deck.token('--muted'), bg=Deck.token('--bg');
    var globe=Globe()(host).backgroundColor(bg).showAtmosphere(true).atmosphereColor(cyan).atmosphereAltitude(0.12)
      .pointsData(places).pointLat('lat').pointLng('lng').pointAltitude(0.025).pointRadius(0.34)
      .pointColor(function(d){return places.indexOf(d)<=current?cyan:ochre})
      .labelsData(places).labelLat('lat').labelLng('lng').labelText('name').labelSize(1.05).labelDotRadius(0.24)
      .labelColor(function(d){return places.indexOf(d)<=current?cyan:muted}).labelResolution(3)
      .arcsData([]).arcStartLat('sLat').arcStartLng('sLng').arcEndLat('eLat').arcEndLng('eLng')
      .arcColor(function(){return cyan}).arcStroke(0.35).arcAltitude(0.08).arcDashLength(1).arcDashGap(0)
      .onPointClick(function(d){advance(places.indexOf(d))});
    globe.globeMaterial().color.set(Deck.token('--line'));
    globe.controls().autoRotate=false; globe.controls().enablePan=false; globe.controls().minDistance=180; globe.controls().maxDistance=260;
    function size(){globe.width(host.clientWidth).height(host.clientHeight)}
    var off=Deck.onResize(size); size();
    function arcs(){return places.slice(1,current+1).map(function(p,i){var s=places[i];return{sLat:s.lat,sLng:s.lng,eLat:p.lat,eLng:p.lng}})}
    function render(){
      globe.pointsData(places).pointColor(globe.pointColor());
      globe.labelsData(places).labelColor(globe.labelColor());
      globe.arcsData(arcs());
      document.querySelectorAll('#relay .step').forEach(function(el,i){
        el.classList.toggle('done',i<current); el.disabled=i!==current+1;
        if(i===current)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');
      });
      if(current===places.length-1){
        status.textContent='五站已经连续交接';
        document.getElementById('ending').textContent='新环境中的生存依赖身体耐受、已有工具和沿途知识的接力，而非一次英雄远征。';
      }else{
        status.textContent=places[current].name+'已接续 · 下一门槛：'+places[current+1].gate;
        document.getElementById('ending').textContent='';
      }
    }
    function advance(i){
      if(i===current+1){current=i;render()}
      else if(i>current+1){status.textContent='先把能力交到'+places[current+1].name}
    }
    document.querySelectorAll('#relay .step').forEach(function(el){el.addEventListener('click',function(){advance(Number(el.dataset.i))})});
    document.getElementById('reset').addEventListener('click',function(){current=0;globe.pointOfView({lat:7,lng:39,altitude:1.65},Deck.reduced()?0:700);render()});
    globe.pointOfView({lat:7,lng:39,altitude:1.65},0); render();
    window.addEventListener('pagehide',function(){off();globe._destructor&&globe._destructor()},{once:true});
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
