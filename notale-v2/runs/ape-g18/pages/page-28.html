<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="28" data-total="50">
<div id="stage">
  <img class="backdrop" src="assets/img/iss-earth.jpg" alt="" title="从国际空间站穹顶舱拍摄的巴塔哥尼亚冰川与地球弧面" style="object-position:72% center;opacity:.20">
  <div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,var(--bg) 26%,transparent 82%);z-index:0"></div>

  <header style="height:132px;display:flex;flex-direction:column;justify-content:flex-end">
    <div style="color:var(--cyan);font-size:var(--fs-sec);font-weight:680;letter-spacing:.08em;margin-bottom:8px">IV · 随身携带地球</div>
    <h1 style="margin-bottom:0;font-size:46px">把可居住环境包在身体周围</h1>
  </header>

  <main class="min0" style="display:flex;padding:28px 0 22px">
    <section class="k-comparison min0" aria-label="猿人与太空人生存方案比较" style="--compare-n:2;grid-template-rows:76px minmax(0,1fr) 1px minmax(0,1fr) 1px minmax(0,1fr);width:100%;align-self:stretch">
      <div class="hdr min0" aria-hidden="true"></div>
      <div class="hdr min0" style="color:var(--ochre)">猿人：利用环境</div>
      <div class="hdr diff min0">太空人：携带环境</div>

      <div class="dim min0">生存策略</div>
      <div class="cell min0" style="display:flex;align-items:center;font-size:var(--fs-lead);font-weight:650">寻找并利用环境中可居住的小块</div>
      <div class="cell diff min0" style="display:flex;align-items:center;font-size:var(--fs-lead);font-weight:650">制造并携带一小块可居住环境</div>
      <div class="rowline" aria-hidden="true"></div>

      <div class="dim min0">主要动作</div>
      <div class="cell min0" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="tag bio">移动</span><span class="tag bio">取食</span><span class="tag bio">用火</span><span class="tag bio">协作</span>
      </div>
      <div class="cell diff min0" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="tag active">密封</span><span class="tag active">供气</span><span class="tag active">供水</span><span class="tag active">控温</span>
      </div>
      <div class="rowline" aria-hidden="true"></div>

      <div class="dim min0">环境边界</div>
      <div class="cell min0" style="display:flex;align-items:center">身体仍直接面对外界条件</div>
      <div class="cell diff min0" style="display:flex;align-items:center">舱壁与宇航服先替身体面对外界</div>
    </section>
  </main>

  <footer style="height:128px;display:flex;align-items:center;justify-content:space-between;gap:56px;border-top:1px solid var(--line)">
    <p class="lead" style="margin:0;max-width:980px"><span style="color:var(--ochre)">猿人改变行为以利用环境</span>；<span style="color:var(--cyan)">太空人首先必须把一小块地球环境带走</span>。</p>
    <p style="margin:0;padding-left:18px;border-left:3px solid var(--cyan);font-size:var(--fs-body);font-weight:650;white-space:nowrap">这层边界一旦打开，人体会先遇到什么？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  Deck.init({ index: 28, total: 50 });
});
</script>
</body>
</html>
