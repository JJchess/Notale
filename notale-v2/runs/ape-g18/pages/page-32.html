<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="32" data-total="50">
<div id="stage">
  <header style="height:92px;display:flex;align-items:flex-start;justify-content:space-between">
    <div><div class="tag active">ORBIT / FREE FALL</div><h1 style="margin-top:8px">一直落下，却不落地</h1></div>
    <p class="small" style="width:460px;margin-top:9px">调节横向初速度，再发射。目标：让炮弹贴近发射高度绕行一圈。</p>
  </header>
  <main class="min0" style="display:flex;flex-direction:column;gap:12px">
    <section class="k-generalization min0" style="flex:1;grid-template-rows:auto 20px minmax(0,1fr)">
      <div class="claim">轨道失重不是没有重力，而是人与航天器在重力作用下一起持续自由落体。</div>
      <div class="trunk"></div>
      <div class="supports min0" style="--support-n:3;position:relative">
        <div class="support"><strong>重力没有消失</strong><br><span id="gravText" class="small"></span></div>
        <div class="support"><strong>横向速度让下落错过地面</strong><br><span id="speedFact" class="small"></span></div>
        <div class="support"><strong>人与航天器共同下落</strong><br><span id="periodText" class="small"></span></div>
        <orbit-freefall-game style="position:absolute;inset:84px 0 0;display:block"></orbit-freefall-game>
      </div>
    </section>
  </main>
  <footer style="height:48px;display:flex;align-items:flex-end">
    <p class="note" style="margin:0">如果重力仍在，身体为什么会改变——下一页看体液与承重方式发生了什么。</p>
  </footer>
  <script src="assets/lib/three.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    Deck.init({index:32,total:50});
    const MASS=5.9722e24, RADIUS=6371008.8, HEIGHT=408000;
    const orbitR=RADIUS+HEIGHT;
    const gravity=Lec.P.surfaceGravity(MASS,orbitR);
    const period=Lec.P.orbitalPeriodSeconds(MASS,RADIUS,HEIGHT);
    const circular=2*Math.PI*orbitR/period;
    const surface=Lec.P.surfaceGravity(MASS,RADIUS);
    document.getElementById('gravText').textContent='高度约 '+Math.round(HEIGHT/1000)+' km；当地重力 '+gravity.toFixed(1)+' m/s²，仍约为地表的 '+Math.round(gravity/surface*100)+'%';
    document.getElementById('speedFact').textContent='近圆轨道速度约 '+(circular/1000).toFixed(2)+' km/s';
    document.getElementById('periodText').textContent='一圈约 '+(period/60).toFixed(1)+' 分钟；舱内没有持续支撑力';

    class OrbitFreefallGame extends HTMLElement {
      constructor(){ super(); this.stopLoop=null; this.trace=[]; }
      connectedCallback(){
        this.innerHTML=`<style>
          orbit-freefall-game{min-width:0;min-height:0;color:var(--text);font-family:var(--font-sans)}
          .wrap{height:100%;display:flex;gap:14px;min-height:0}.scene{position:relative;flex:1;min-width:0;min-height:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
          canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.overlay{position:absolute;left:18px;top:16px;display:flex;gap:10px;align-items:center;pointer-events:none}
          .status{padding:5px 10px;border:1px solid var(--cyan);border-radius:999px;color:var(--cyan);font-size:16px;line-height:1.35;background:var(--panel)}
          .live{font:650 22px/1.35 var(--font-mono);color:var(--text);text-shadow:0 2px 5px var(--bg)}
          .key{position:absolute;left:18px;bottom:14px;display:flex;gap:20px;color:var(--muted);font-size:14px}.mark{color:var(--cyan);font-weight:700}
          .panel{flex:0 0 390px;min-width:0;padding:18px 20px;border:1px solid var(--line-strong);border-radius:12px;background:var(--panel);box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:14px}
          label,.hint{font-size:16px;line-height:1.45}.reading{font:650 40px/1.08 var(--font-mono)}.unit{font-size:16px;color:var(--muted)}
          input{width:100%;height:32px;accent-color:var(--cyan)}input:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
          .ends{display:flex;justify-content:space-between;color:var(--muted);font:14px/1.35 var(--font-mono)}.buttons{display:flex;gap:10px}
          button{min-height:48px;padding:9px 18px;border:1px solid var(--line-strong);border-radius:8px;background:transparent;color:var(--text);font:650 16px/1.35 var(--font-sans);cursor:pointer}button:hover{border-color:var(--cyan);color:var(--cyan)}
        </style><div class="wrap"><div class="scene"><canvas aria-label="地球曲率、切线发射轨迹与指向地心的重力箭头三维场景"></canvas><div class="overlay"><span class="status" aria-live="polite">等待发射</span><span class="live">5.00 km/s</span></div><div class="key"><span><b class="mark">—</b> 炮弹轨迹</span><span><b class="mark">↓</b> 重力始终指向地心</span></div></div><div class="panel"><label for="velocity">横向初速度</label><div><span class="reading">5.00</span><span class="unit">km/s</span></div><input id="velocity" type="range" min="0" max="11" step="0.01" value="5" aria-label="横向初速度，千米每秒"><div class="ends"><span>0 km/s</span><span>11 km/s</span></div><div class="buttons"><button class="launch">发射</button><button class="reset">复位</button></div><div class="hint">轨迹每一刻都向地球弯曲；改变的是它能否错过地面。</div></div></div>`;
        this.cv=this.querySelector('canvas'); this.slider=this.querySelector('input'); this.statusEl=this.querySelector('.status'); this.live=this.querySelector('.live'); this.reading=this.querySelector('.reading');
        this.initThree(); this.reset();
        this.slider.addEventListener('input',()=>{this.reading.textContent=(+this.slider.value).toFixed(2);if(!this.running){this.state.v=+this.slider.value*1000;this.updateArrow();this.render();}});
        this.querySelector('.launch').addEventListener('click',()=>this.start());
        this.querySelector('.reset').addEventListener('click',()=>this.reset());
        this.ro=new ResizeObserver(()=>this.resize()); this.ro.observe(this.querySelector('.scene'));
      }
      initThree(){
        const T=THREE, cyan=new T.Color(Deck.token('--cyan')), ochre=new T.Color(Deck.token('--ochre'));
        this.scene=new T.Scene(); this.camera=new T.PerspectiveCamera(38,1,.1,20); this.camera.position.set(0,1.2,3.15); this.camera.lookAt(0,0,0);
        this.renderer=new T.WebGLRenderer({canvas:this.cv,antialias:true,alpha:true}); this.renderer.setPixelRatio(Math.min(devicePixelRatio,2)); this.renderer.outputColorSpace=T.SRGBColorSpace;
        this.earth=new T.Mesh(new T.SphereGeometry(1,64,40),new T.MeshStandardMaterial({color:ochre,roughness:.82,metalness:.05})); this.scene.add(this.earth);
        const wire=new T.LineSegments(new T.EdgesGeometry(new T.SphereGeometry(1.006,24,12)),new T.LineBasicMaterial({color:0x35434a,transparent:true,opacity:.32}));this.scene.add(wire);
        this.ball=new T.Mesh(new T.SphereGeometry(.035,20,12),new T.MeshStandardMaterial({color:cyan,emissive:cyan,emissiveIntensity:.7}));this.scene.add(this.ball);
        this.lineGeom=new T.BufferGeometry();this.path=new T.Line(this.lineGeom,new T.LineBasicMaterial({color:cyan}));this.scene.add(this.path);
        this.velArrow=new T.ArrowHelper(new T.Vector3(1,0,0),new T.Vector3(),.35,cyan,.08,.05);this.scene.add(this.velArrow);
        this.gravArrow=new T.ArrowHelper(new T.Vector3(0,-1,0),new T.Vector3(),.32,ochre,.08,.05);this.scene.add(this.gravArrow);
        this.scene.add(new T.HemisphereLight(0xe8eef0,0x0b0f12,1.7));const light=new T.DirectionalLight(0xffffff,2.2);light.position.set(3,4,4);this.scene.add(light);
      }
      fresh(){return {x:0,y:orbitR,vx:5000,vy:0,t:0,angle:0,lastAngle:Math.PI/2,status:'等待发射'};}
      reset(){if(this.stopLoop){this.stopLoop();this.stopLoop=null;}this.running=false;this.slider.disabled=false;this.slider.value='5';this.reading.textContent='5.00';this.state=this.fresh();this.trace=[];this.statusEl.textContent='等待发射';this.updateObjects();this.dispatchEvent(new CustomEvent('game-reset',{bubbles:true,composed:true}));}
      start(){if(this.stopLoop){this.stopLoop();this.stopLoop=null;}this.state=this.fresh();this.state.vx=+this.slider.value*1000;this.running=true;this.slider.disabled=true;this.trace=[];this.statusEl.textContent='绕行中';this.dispatchEvent(new CustomEvent('game-start',{bubbles:true,composed:true}));if(Deck.reduced()){for(let i=0;i<16000&&this.running;i++)this.step(2);this.updateObjects();return;}let acc=0;this.stopLoop=Deck.loop((t,dt)=>{acc+=Math.min(dt,40)*2;while(acc>=2&&this.running){this.step(2);acc-=2;}this.updateObjects();},{still:1});}
      step(dt){
        const s=this.state,r=Math.hypot(s.x,s.y),mu=gravity*orbitR*orbitR,a=-mu/(r*r*r);s.vx+=a*s.x*dt;s.vy+=a*s.y*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.t+=dt;
        let ang=Math.atan2(s.y,s.x),d=ang-s.lastAngle;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;s.angle+=Math.abs(d);s.lastAngle=ang;if(this.trace.length<1600&&Math.floor(s.t)%12<2)this.trace.push(new THREE.Vector3(s.x/orbitR,s.y/orbitR,0));
        if(r<=RADIUS){this.finish('撞地',false);}else if(s.angle>=Math.PI*2){this.finish('完成一圈',true);}else if(r>orbitR*2.5){this.finish('仍在远去',false);}else{s.status='绕行中';}
      }
      finish(label,won){this.running=false;this.slider.disabled=false;this.statusEl.textContent=label;if(this.stopLoop){this.stopLoop();this.stopLoop=null;}const detail={score:won?1:0,metrics:{status:label,time:this.state.t},trace:this.trace.map(p=>[p.x,p.y,p.z])};this.dispatchEvent(new CustomEvent(won?'game-complete':'game-progress',{detail,bubbles:true,composed:true}));}
      updateArrow(){this.state.vx=this.state.v||5000;}
      updateObjects(){const s=this.state,scale=1/orbitR,pos=new THREE.Vector3(s.x*scale,s.y*scale,0);this.ball.position.copy(pos);this.velArrow.position.copy(pos);this.velArrow.setDirection(new THREE.Vector3(s.vx,s.vy,0).normalize());this.velArrow.setLength(.18+Math.hypot(s.vx,s.vy)/11000*.28,.08,.05);this.gravArrow.position.copy(pos);this.gravArrow.setDirection(pos.clone().multiplyScalar(-1).normalize());this.gravArrow.setLength(.30,.08,.05);this.lineGeom.setFromPoints(this.trace.length?this.trace:[pos]);this.live.textContent=(Math.hypot(s.vx,s.vy)/1000).toFixed(2)+' km/s';this.statusEl.textContent=s.status;this.render();}
      render(){this.renderer.render(this.scene,this.camera);}
      resize(){const r=this.cv.parentElement.getBoundingClientRect();if(!r.width||!r.height)return;this.renderer.setSize(r.width/Deck.s,r.height/Deck.s,false);this.camera.aspect=(r.width/r.height);this.camera.updateProjectionMatrix();this.render();}
      getState(){return JSON.parse(JSON.stringify(this.state));}
      disconnectedCallback(){if(this.stopLoop)this.stopLoop();if(this.ro)this.ro.disconnect();this.renderer.dispose();this.lineGeom.dispose();}
    }
    customElements.define('orbit-freefall-game',OrbitFreefallGame);
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
