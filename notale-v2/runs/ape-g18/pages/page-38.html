<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .kicker{height:24px;color:var(--cyan);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.14em}
  .flow-wrap{position:relative;height:100%;min-height:0}
  #flow{position:absolute;inset:0}
  .class-bands{position:absolute;inset:30px 16px 18px 16px;pointer-events:none;display:flex;flex-direction:column;gap:8px}
  .class-band{flex:1;border:1px solid var(--line);border-radius:10px;position:relative}
  .class-band span{position:absolute;left:10px;top:7px;color:var(--muted);font-size:var(--fs-label);line-height:1.35;font-weight:650}
  .evidence{position:relative;overflow:hidden;border-radius:10px;border:1px solid var(--line)}
  .evidence img{width:100%;height:100%;object-fit:cover;opacity:.55}
  .evidence span{position:absolute;left:14px;bottom:10px;color:var(--text);font-size:var(--fs-sec);line-height:1.35;text-shadow:0 2px 5px var(--bg)}
  .status{min-height:48px;margin:0;color:var(--text);font-size:var(--fs-sec);line-height:1.45}
  .status strong{color:var(--cyan)}
  .port-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
  .port-controls label{display:flex;min-width:0;flex-direction:column;gap:5px;color:var(--muted);font-size:var(--fs-label);line-height:1.35}
  .port-controls .btn{grid-column:1 / -1}
  select{width:100%;min-width:0;height:44px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:var(--fs-sec);padding:0 10px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="38" data-total="50">
<div id="stage">
  <header style="height:104px">
    <div class="kicker">LIFE SUPPORT LOOP</div>
    <h1>废物，可能是下一环的资源</h1>
  </header>
  <main class="min0" style="display:flex;gap:18px">
    <section class="k-classification min0" style="flex:1.62" aria-label="生命保障系统分类">
      <div class="box min0" style="display:flex;flex-direction:column;height:100%;padding:12px 14px">
        <span class="bt" style="margin-bottom:2px">生命保障系统</span>
        <div class="lv min0" style="flex:1;display:flex;flex-direction:column;margin-top:0;padding-top:0">
          <div class="flow-wrap min0">
            <div class="class-bands" aria-hidden="true">
              <div class="class-band"><span>气体管理</span></div>
              <div class="class-band"><span>水与湿度管理</span></div>
              <div class="class-band"><span>热管理</span></div>
            </div>
            <div id="flow" role="img" aria-label="共享乘员中心的气体、水、湿度与热量定向流图"></div>
          </div>
        </div>
      </div>
    </section>
    <aside class="min0" style="flex:.58;display:flex;flex-direction:column;gap:12px">
      <div class="panel" style="height:318px;padding:14px 16px">
        <p class="hint" style="margin-bottom:8px">先选废物流，再选它的处理或去向。</p>
        <p id="status" class="status" aria-live="polite">已接通 <strong>0 / 5</strong> 条。寻找能接住这些废物的设备。</p>
        <div class="port-controls" aria-label="键盘连接端口">
          <label>废物流<select id="from"></select></label>
          <label>处理／去向<select id="to"></select></label>
          <button class="btn" id="connect">接通</button>
        </div>
        <button class="btn" id="reset" style="margin-top:10px">重新断开</button>
      </div>
      <figure class="evidence" style="height:202px;margin:0" title="国际空间站生命保障设备">
        <img src="assets/img/iss-life-support.jpg" alt="国际空间站舱内生命保障设备机柜">
        <span>设备证据：国际空间站生命保障机柜</span>
      </figure>
      <div class="box" style="flex:1;padding:12px 14px">
        <p class="lead" style="margin-bottom:7px">舱内生存不是储备几罐氧气，而是持续回收水、调节空气并把热量排出压力边界。</p>
        <p class="small" style="margin-bottom:5px">环路维持了舱内环境，身体仍会失用——下一页看每天约两小时运动能补回多少。</p>
        <p class="small" style="margin:0" title="NASA Environmental Control and Life Support System；NASA Baseline Values and Assumptions Document">NASA ECLSS；NASA BVAD</p>
      </div>
    </aside>
  </main>
</div>
<script src="assets/lib/echarts.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
  Deck.init({index:38,total:50});
  const el=document.getElementById('flow');
  const chart=echarts.init(el,null,{renderer:'svg'});
  const css=getComputedStyle(document.documentElement);
  const C={text:css.getPropertyValue('--text').trim(),cyan:css.getPropertyValue('--cyan').trim(),ochre:css.getPropertyValue('--ochre').trim(),muted:css.getPropertyValue('--muted').trim(),line:css.getPropertyValue('--line-strong').trim(),bg:css.getPropertyValue('--bg').trim()};
  const sources=[
    {id:'o2use',name:'消耗氧气',y:95,target:'electro',result:'水电解补氧：氧气回到舱内。约 0.84 kg O₂／人／天。'},
    {id:'co2',name:'呼出 CO₂',y:174,target:'scrub',result:'CO₂ 被去除，部分参与水回收；不能宣称全部变回氧气。约 1.0 kg／人／天。'},
    {id:'urine',name:'尿液、呼气与汗液',y:282,target:'purify',result:'净化后清洁水返回使用。约 90% 回收：10 L 流经后约 9 L 返回。'},
    {id:'vapor',name:'舱内水蒸气',y:360,target:'condense',result:'冷凝除湿后进入水处理——湿气也是水源。'},
    {id:'heat',name:'人体与设备废热',y:464,target:'radiator',result:'换热器和冷却回路把热送向散热器；热不是回收物，必须排出。'}
  ];
  const targets=[
    {id:'electro',name:'水电解 → 氧气回舱',y:95},{id:'scrub',name:'CO₂ 去除 → 部分水回收',y:174},
    {id:'purify',name:'净化回收 → 清洁水',y:282},{id:'condense',name:'冷凝除湿 → 水处理',y:360},
    {id:'radiator',name:'冷却回路 → 太空',y:464}
  ];
  const nodes=[{id:'crew',name:'乘员／舱内\n微环境',x:500,y:270,symbolSize:96,category:1}]
    .concat(sources.map(d=>({id:d.id,name:d.name,x:205,y:d.y,symbolSize:[154,46],category:0})))
    .concat(targets.map(d=>({id:d.id,name:d.name,x:865,y:d.y,symbolSize:[190,46],category:2})));
  let done=new Set(), selected=null;
  const fixed=[
    {source:'crew',target:'o2use'},{source:'crew',target:'co2'},{source:'crew',target:'urine'},
    {source:'crew',target:'vapor'},{source:'crew',target:'heat'}
  ];
  function option(){
    const active=sources.filter(d=>done.has(d.id)).map(d=>({source:d.id,target:d.target,lineStyle:{color:C.cyan,width:4,opacity:1,type:'solid',curveness:.08}}));
    return {animationDuration:Deck.reduced()?0:280,textStyle:{fontSize:16,fontFamily:css.getPropertyValue('--font-sans')},tooltip:{show:false,textStyle:{fontSize:16}},series:[{type:'graph',layout:'none',roam:false,left:112,right:24,top:34,bottom:20,symbol:'roundRect',edgeSymbol:['none','arrow'],edgeSymbolSize:10,label:{show:true,color:C.text,fontSize:16,lineHeight:21},itemStyle:{color:C.bg,borderColor:C.line,borderWidth:2},emphasis:{disabled:true},data:nodes.map(n=>Object.assign({},n,{itemStyle:{color:C.bg,borderColor:(selected===n.id?C.cyan:(done.has(n.id)?C.cyan:C.line)),borderWidth:selected===n.id?4:2}})),links:fixed.map(d=>Object.assign({},d,{lineStyle:{color:C.line,width:1,opacity:.45,type:'dashed',curveness:.05}})).concat(active),lineStyle:{color:C.line,width:2,opacity:.7,curveness:.05}}]};
  }
  function render(){chart.setOption(option(),true)}
  const from=document.getElementById('from'),to=document.getElementById('to'),status=document.getElementById('status');
  sources.forEach(d=>from.add(new Option(d.name,d.id))); targets.forEach(d=>to.add(new Option(d.name,d.id)));
  function shake(){el.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:220});status.textContent='它接下来能被哪类设备处理？';}
  function connect(a,b){const s=sources.find(d=>d.id===a);if(!s||s.target!==b){shake();return}done.add(a);selected=null;render();status.innerHTML=done.size===5?'<strong>5 / 5 条已接通。</strong> 高回收不等于封闭：仍有 10% 水损失，热量必须排向太空。':'<strong>'+done.size+' / 5</strong> 条已接通。'+s.result;}
  chart.on('click',p=>{if(!p.data||!p.data.id||p.data.id==='crew')return;const id=p.data.id;if(sources.some(d=>d.id===id)){selected=id;from.value=id;status.textContent='已选择“'+p.data.name+'”，再选处理或去向。';render();}else if(selected){to.value=id;connect(selected,id);}});
  document.getElementById('connect').addEventListener('click',()=>connect(from.value,to.value));
  document.getElementById('reset').addEventListener('click',()=>{done.clear();selected=null;status.innerHTML='已接通 <strong>0 / 5</strong> 条。寻找能接住这些废物的设备。';render()});
  render();
  const off=Deck.onResize(()=>chart.resize());
  window.addEventListener('pagehide',()=>{off();chart.dispose()},{once:true});
});
</script>
</body>
</html>
