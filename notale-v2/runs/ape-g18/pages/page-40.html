<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage::after{
    position:absolute;
    z-index:0;
    inset:0;
    background:linear-gradient(90deg,rgba(11,15,18,.96) 0%,rgba(11,15,18,.78) 54%,rgba(11,15,18,.34) 100%);
    content:"";
    pointer-events:none;
  }
  .chapter-kicker{
    margin:0 0 8px;
    color:var(--ochre);
    font-family:var(--font-mono);
    font-size:var(--fs-label);
    line-height:1.35;
    font-weight:650;
    letter-spacing:.12em;
  }
  .support h2{margin-bottom:10px;color:var(--text)}
  .support p{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.5}
  .next-question{
    margin:0;
    padding:18px 22px;
    border-left:3px solid var(--cyan);
    color:var(--text);
    font-size:var(--fs-lead);
    line-height:1.5;
  }
</style>
</head>
<body data-page="40" data-total="50">
<div id="stage">
  <img class="backdrop" src="assets/img/iss-earth.jpg" alt="从国际空间站附近望向地球弧线" title="（已存在）" style="opacity:.18;object-fit:cover;inset:54px 44px 48px;width:1512px;height:798px">

  <header style="height:112px">
    <p class="chapter-kicker"><span>CHAPTER V</span><span> · </span><span>TWO PATHS</span></p>
    <h1><span>抵达，</span><span>不等于留下</span></h1>
  </header>

  <main class="k-generalization min0" style="--support-n:4">
    <div class="claim">
      <span>能活着进入太空</span><span>与</span><span>能长期留在太空</span><span>之间，</span><span>隔着一整套可维护的系统工程。</span>
    </div>
    <div class="trunk" aria-hidden="true"></div>
    <div class="supports min0">
      <section class="support min0">
        <h2><span>资源</span><span>算得清</span></h2>
        <p><span>人数 × 时间</span><span>决定补给下限</span></p>
      </section>
      <section class="support min0">
        <h2><span>循环</span><span>接得上</span></h2>
        <p><span>水、氧、热与废物</span><span>不能各自为政</span></p>
      </section>
      <section class="support min0">
        <h2><span>故障</span><span>扛得住</span></h2>
        <p><span>系统必须能检测、隔离</span><span>并切换</span></p>
      </section>
      <section class="support min0">
        <h2><span>维护</span><span>做得到</span></h2>
        <p><span>备件、工具、乘员时间</span><span>同样是资源</span></p>
      </section>
    </div>
  </main>

  <footer style="height:104px;display:flex;align-items:flex-end">
    <p class="next-question"><span>一套系统要维持七天，</span><span>第一步不是加设备——</span><span>先算清每个人每天会消耗什么。</span></p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
