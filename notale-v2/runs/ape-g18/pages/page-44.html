<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .kicker{color:var(--cyan);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.14em;margin-bottom:7px}
  .shell-ledger{display:flex;flex-direction:column;gap:14px;height:100%}
  .ledger-row{display:flex;flex-direction:column;justify-content:center;gap:6px;height:112px}
  .ledger-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .ledger-title{font-size:var(--fs-body);font-weight:680}
  .ledger-role{color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
  .ledger-value{font:650 var(--fs-body)/1.35 var(--font-mono);color:var(--cyan);white-space:nowrap}
  .ledger-row input{width:100%;height:30px;margin:0;accent-color:var(--cyan)}
  .basis{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .total-pair{display:flex;align-items:center;justify-content:space-between;gap:24px}
  .total-arrow{color:var(--cyan);font-size:var(--fs-h1)}
  .total-label{color:var(--muted);font-size:var(--fs-sec)}
  #chart{width:100%;height:100%;min-height:0}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body data-page="44" data-total="50">
<div id="stage">
  <header style="height:108px">
    <div class="kicker">SYSTEM TRADE-OFF</div>
    <h1>生存壳每加 1 kg，火箭要多背多少？</h1>
  </header>

  <div class="basis" style="height:52px">
    <span class="tag neutral">共同任务基准</span>
    <span class="tag">Δv <b id="dv-label" class="num"></b></span>
    <span class="tag">有效排气速度 <b id="ve-label" class="num"></b></span>
    <span class="tag active">理想质量比约 <b id="ratio-label" class="num"></b>∶1</span>
    <span class="small">理想火箭方程示意；忽略分级与结构细节</span>
  </div>

  <main class="min0" style="display:flex;gap:24px;padding-top:14px;padding-bottom:14px">
    <section class="panel min0" style="flex:0 0 432px;display:flex;flex-direction:column" aria-label="生存壳质量账本">
      <div style="height:54px">
        <h2 style="margin-bottom:2px">在轨新增质量</h2>
        <div class="hint">拖动三项，比较安全余量的发射端代价</div>
      </div>
      <div class="shell-ledger" style="flex:1">
        <div class="ledger-row it">
          <div class="ledger-head"><span class="ledger-title">水储备</span><output id="out-water" class="ledger-value" for="water"></output></div>
          <div class="ledger-role">延长补给中断容忍时间</div>
          <input id="water" aria-label="水储备在轨新增质量" type="range" min="0" max="1000" step="10" value="100">
        </div>
        <div class="ledger-row it">
          <div class="ledger-head"><span class="ledger-title">关键备件</span><output id="out-parts" class="ledger-value" for="parts"></output></div>
          <div class="ledger-role">恢复故障设备</div>
          <input id="parts" aria-label="关键备件在轨新增质量" type="range" min="0" max="1000" step="10" value="250">
        </div>
        <div class="ledger-row it">
          <div class="ledger-head"><span class="ledger-title">屏蔽材料</span><output id="out-shield" class="ledger-value" for="shield"></output></div>
          <div class="ledger-role">降低部分辐射暴露</div>
          <input id="shield" aria-label="屏蔽材料在轨新增质量" type="range" min="0" max="1000" step="10" value="500">
        </div>
      </div>
      <button id="reset" class="btn" type="button" style="align-self:flex-start">复位默认方案</button>
    </section>

    <section class="k-comparison min0" style="--compare-n:2;flex:1;grid-template-rows:58px minmax(0,1fr)" aria-label="在轨质量与理想起飞质量比较">
      <div class="hdr dim">同一质量轴</div>
      <div class="hdr">送入轨道的新增质量</div>
      <div class="hdr diff">理想模型对应的起飞质量</div>
      <div class="dim" style="padding-top:22px">水储备<br><br><br>关键备件<br><br><br>屏蔽材料<br><br><br>三项合计</div>
      <div class="cell min0" style="grid-column:2 / 4;padding:0;border-right:0"><div id="chart" role="img" aria-label="三类生存物资及合计的在轨新增质量和理想起飞质量共轴条形图"></div></div>
    </section>
  </main>

  <footer style="height:126px;display:flex;gap:24px;align-items:stretch">
    <div class="panel total-pair" style="flex:1" aria-live="polite">
      <div><div class="total-label">在轨新增合计</div><span id="total-orbit" class="big sm"></span></div>
      <span class="total-arrow">→</span>
      <div class="diff" style="border-left:3px solid var(--cyan);padding-left:24px"><div class="total-label">理想起飞质量</div><span id="total-launch" class="big sm"></span></div>
    </div>
    <div style="flex:1.35;display:flex;flex-direction:column;justify-content:center">
      <p class="lead" style="margin-bottom:5px">每增加一层水、备件或屏蔽都会增加发射质量；安全与可达性必须共同优化。</p>
      <p class="small" style="margin:0">下一问：如果不能无限加厚生存壳，还能怎样替身体制造重力？</p>
    </div>
  </footer>
  <script src="assets/lib/d3.min.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function(){
    Deck.init({index:44,total:50});
    var dv = Lec.P.kilometresToMetres(9.4);
    var ve = Lec.P.kilometresToMetres(4.4);
    var ratio = Lec.P.rocketMassRatio(dv, ve);
    var defaults = {water:100, parts:250, shield:500};
    var items = [
      {id:'water', name:'水储备'},
      {id:'parts', name:'关键备件'},
      {id:'shield', name:'屏蔽材料'}
    ];
    document.getElementById('dv-label').textContent = (dv / Lec.K.units.metresPerKilometre).toFixed(1) + ' km/s';
    document.getElementById('ve-label').textContent = (ve / Lec.K.units.metresPerKilometre).toFixed(1) + ' km/s';
    document.getElementById('ratio-label').textContent = ratio.toFixed(1);
    var chart = echarts.init(document.getElementById('chart'), null, {renderer:'svg'});
    function massText(v){ return v >= 1000 ? (v/1000).toFixed(2)+' t' : Math.round(v)+' kg'; }
    function update(){
      var rows = items.map(function(d){return {name:d.name, orbit:Number(document.getElementById(d.id).value)};});
      rows.forEach(function(d,i){
        d.launch = d.orbit * ratio;
        document.getElementById('out-'+items[i].id).textContent = d.orbit.toFixed(0)+' kg → '+massText(d.launch);
      });
      var totalOrbit = d3.sum(rows, function(d){return d.orbit;});
      var totalLaunch = totalOrbit * ratio;
      document.getElementById('total-orbit').textContent = totalOrbit.toFixed(0)+' kg';
      document.getElementById('total-launch').textContent = '约 '+massText(totalLaunch);
      var all = rows.concat([{name:'三项合计',orbit:totalOrbit,launch:totalLaunch}]);
      chart.setOption({
        animation: !Deck.reduced(),
        textStyle:{fontFamily:getComputedStyle(document.documentElement).getPropertyValue('--font-sans'),fontSize:16,color:'#E8EEF0'},
        grid:{left:18,right:90,top:22,bottom:48,containLabel:true},
        tooltip:{trigger:'axis',axisPointer:{type:'shadow'},textStyle:{fontSize:16},formatter:function(ps){return ps[0].axisValue+'<br>'+ps.map(function(p){return p.marker+p.seriesName+'：'+massText(p.value);}).join('<br>');}},
        legend:{bottom:0,textStyle:{fontSize:14,color:'#9CAAAF'},data:['在轨新增质量','理想起飞质量']},
        xAxis:{type:'value',min:0,max:Math.max(9000,Math.ceil(totalLaunch/1000)*1000),axisLabel:{fontSize:12,color:'#9CAAAF',formatter:function(v){return v>=1000?(v/1000)+'t':v;}},splitLine:{lineStyle:{color:'#35434A'}},axisLine:{lineStyle:{color:'#62747B'}}},
        yAxis:{type:'category',inverse:true,data:all.map(function(d){return d.name;}),axisLabel:{fontSize:14,color:'#E8EEF0'},axisTick:{show:false},axisLine:{show:false}},
        series:[
          {name:'在轨新增质量',type:'bar',barWidth:13,data:all.map(function(d){return d.orbit;}),itemStyle:{color:'#C56A32',borderRadius:[0,3,3,0]}},
          {name:'理想起飞质量',type:'bar',barWidth:13,data:all.map(function(d){return d.launch;}),itemStyle:{color:'#45D6E8',borderRadius:[0,3,3,0]},label:{show:true,position:'right',fontSize:14,color:'#45D6E8',formatter:function(p){return massText(p.value);}}}
        ]
      }, true);
    }
    items.forEach(function(d){document.getElementById(d.id).addEventListener('input',update);});
    document.getElementById('reset').addEventListener('click',function(){items.forEach(function(d){document.getElementById(d.id).value=defaults[d.id];});update();});
    update();
    Deck.onResize(function(){chart.resize();});
    window.addEventListener('pagehide',function(){chart.dispose();},{once:true});
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
