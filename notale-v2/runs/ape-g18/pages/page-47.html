<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .kicker{color:var(--cyan);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.14em}
  .function-pool{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .function-card{min-width:126px;min-height:46px;padding:8px 13px;border:1px solid var(--line-strong);border-radius:8px;background:transparent;color:var(--text);font:650 var(--fs-sec)/1.35 var(--font-sans);cursor:pointer}
  .function-card[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);box-shadow:inset 0 -3px 0 var(--cyan)}
  .function-card.placed{border-style:dashed;color:var(--muted)}
  .function-card:focus-visible,.bucket:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .bucket{display:flex;flex-direction:column;min-width:0;min-height:0;border-width:3px;cursor:pointer}
  .bucket .lv{border-left-width:4px}
  .bucket.panel{background:var(--panel)}
  .bucket.active{border-color:var(--cyan);box-shadow:inset 0 3px 0 rgba(69,214,232,.65)}
  .bucket .lv{position:relative;display:flex;flex-direction:column;justify-content:space-around;flex:1;overflow:hidden}
  .bucket .lv > *:not(.identity-back){position:relative;z-index:1}
  .identity-back{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.38;filter:saturate(.65);pointer-events:none}
  .row-label{display:flex;align-items:center;gap:9px;margin-bottom:7px;color:var(--muted);font-size:var(--fs-label);font-weight:680}
  .anchor{width:44px;height:32px;border-radius:5px;object-fit:cover;border:1px solid var(--line-strong)}
  .entry{flex:1;min-height:44px;padding:4px 3px;border-top:1px solid var(--line);font-size:var(--fs-sec);line-height:1.4}
  .entry strong{display:block;color:var(--text);font-size:var(--fs-sec)}
  .entry span{color:var(--muted);font-size:var(--fs-label)}
  .empty{color:var(--muted);font-size:var(--fs-label);line-height:1.4}
  #feedback{min-height:52px;margin:0;padding:8px 12px;border-left:3px solid var(--cyan);font-size:var(--fs-sec);line-height:1.45}
  #chart{width:100%;height:118px}
  .conclusion{opacity:.32;transition:opacity .2s,border-color .2s}
  .conclusion.on{opacity:1;border-color:var(--cyan);color:var(--cyan)}
  @media (prefers-reduced-motion:reduce){.conclusion{transition:none}}
</style>
</head>
<body data-page="47" data-total="50">
<div id="stage">
  <header style="height:90px;display:flex;align-items:flex-start;justify-content:space-between;gap:32px">
    <div><div class="kicker">TWO PATHS · ONE LIFE</div><h1 style="margin-top:5px">谁在承担适应？</h1></div>
    <div style="width:760px;margin:5px 0 0"><p class="lead" style="margin:0 0 4px">猿人与太空人的差别不在“是否依赖技术”，而在体外适应的规模、速度与闭环程度。</p><p class="small" style="margin:0">身体、工具与系统会彼此反馈——下一页把两条进化通道重新接成一条链。</p></div>
  </header>

  <section class="panel" style="height:78px;display:flex;align-items:center;gap:18px;padding:14px 18px" aria-label="待归仓功能">
    <div style="width:128px"><strong style="font-size:var(--fs-sec)">生存功能</strong><div class="hint">选卡，再选归仓</div></div>
    <div id="pool" class="function-pool min0" style="flex:1"></div>
    <div id="progress" class="tag neutral" aria-live="polite">尚未归仓</div>
  </section>

  <section style="height:42px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)"><span class="small">同一功能沿两行对齐，比较承担者怎样外移</span><span class="tag active">先看功能，再看载体</span><span class="small">主要承担者不等于唯一承担者：功能可以跨栏协同</span></section>

  <main style="display:flex;gap:18px;padding-top:10px">
    <section class="k-classification min0" style="flex:1.95" aria-label="身体、工具与文化、环境系统分类矩阵">
      <div id="buckets" style="display:flex;gap:14px;flex:1;min-height:0"></div>
      <div id="feedback" style="height:58px;margin-top:10px">先选择一项生存功能，再判断它在两类人群中主要由谁承担。选后仍可改。</div>
      <div class="legend" style="height:38px;justify-content:space-between;border-top:1px solid var(--line)"><span class="li"><span class="sw line"></span>规模看跨越距离</span><span class="li"><span class="sw line"></span>速度看响应时限</span><span class="li"><span class="sw line"></span>闭环看资源回收</span></div>
    </section>

    <aside class="panel min0" style="flex:.72;display:flex;flex-direction:column;padding:15px 17px">
      <h2 style="margin-bottom:2px">体外适应：定性汇总</h2>
      <div class="small">概念归纳，不是测量评分</div>
      <img src="assets/img/iss-cupola.jpg" title="国际空间站穹顶舱" alt="太空人从国际空间站穹顶舱观察地球" style="width:100%;height:180px;object-fit:cover;border-radius:8px;margin:8px 0;border:1px solid var(--line-strong)">
      <div id="chart" role="img" aria-label="猿人与太空人在规模、响应速度、闭环程度上的定性比较"></div>
      <div style="display:flex;gap:8px;flex-direction:column;margin-top:auto">
        <div class="tag neutral conclusion">规模更大</div>
        <div class="tag neutral conclusion">响应更快</div>
        <div class="tag neutral conclusion">闭环更强</div>
      </div>
    </aside>
  </main>

  <script src="assets/lib/d3.min.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  Deck.init({index:47,total:50});
  var categories=['身体','工具与文化','环境系统'];
  var items=[
    {name:'移动',ape:0,space:1,a:'双足步态',s:'航天器',note:'规模：地表距离 → 行星际距离'},
    {name:'获取能量',ape:1,space:2,a:'石器、火、协作',s:'供电、食物与补给链',note:'闭环：低 → 部分回收'},
    {name:'维持呼吸',ape:0,space:2,a:'肺与环境空气',s:'压力壳、供氧、CO₂去除',note:'速度：代际 → 分钟级控制'},
    {name:'控制体温',ape:0,space:2,a:'出汗与行为',s:'隔热与主动热控',note:'边界：开放环境 → 封闭微环境'},
    {name:'应对损伤',ape:1,space:1,a:'照料、知识',s:'规程、维修、冗余',note:'依赖：群体知识均不可少'},
    {name:'保存适应',ape:1,space:1,a:'模仿、教学',s:'工程文档、训练',note:'累积：跨代 → 跨任务'}
  ];
  var state=items.map(function(){return null}), selected=null;
  var pool=d3.select('#pool');
  var buttons=pool.selectAll('button').data(items).join('button')
    .attr('class','function-card').attr('type','button').attr('aria-pressed','false')
    .text(function(d){return d.name}).on('click',function(e,d){
      var i=items.indexOf(d);
      if(state.every(function(x){return x!==null})) { reset(); return; }
      selected=i; render();
    });
  var bucket=d3.select('#buckets').selectAll('div.bucket').data(categories).join('div')
    .attr('class','box bucket panel').attr('role','button').attr('tabindex','0')
    .attr('aria-label',function(d){return '归入'+d})
    .on('click',function(e,d){assign(categories.indexOf(d))})
    .on('keydown',function(e,d){if(e.key==='Enter'||e.key===' '){e.preventDefault();assign(categories.indexOf(d));}});
  bucket.append('span').attr('class','bt').text(function(d){return d});
  bucket.append('div').attr('class','small').style('min-height','38px').text(function(d,i){return ['由身体结构与生理调节直接完成','可携带、可教学的外部能力','一组设备维持局部可居住条件'][i]});
  bucket.append('div').attr('class','lv ape-row');
  bucket.append('div').attr('class','lv space-row');

  var chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
  function chartOption(done){
    var t=done/items.length;
    return {animationDuration:Deck.reduced()?0:260,textStyle:{fontSize:16,fontFamily:getComputedStyle(document.documentElement).getPropertyValue('--font-sans')},
      tooltip:{show:false,textStyle:{fontSize:16}},legend:{top:0,textStyle:{fontSize:14,color:'#E8EEF0'},data:['猿人','太空人']},
      radar:{center:['50%','59%'],radius:'59%',indicator:[{name:'规模',max:1},{name:'速度',max:1},{name:'闭环',max:1}],axisName:{fontSize:14,color:'#9CAAAF'},splitNumber:1,splitLine:{lineStyle:{color:'#35434A'}},splitArea:{show:false},axisLine:{lineStyle:{color:'#35434A'}}},
      series:[{type:'radar',symbolSize:5,data:[{name:'猿人',value:[.28*t,.24*t,.18*t],lineStyle:{color:'#C56A32'},itemStyle:{color:'#C56A32'},areaStyle:{color:'rgba(197,106,50,.12)'}},{name:'太空人',value:[.92*t,.9*t,.82*t],lineStyle:{color:'#45D6E8'},itemStyle:{color:'#45D6E8'},areaStyle:{color:'rgba(69,214,232,.14)'}}]}]};
  }
  function assign(cat){
    if(selected===null){document.getElementById('feedback').textContent='请先选择一项生存功能。';return;}
    state[selected]=cat;
    var d=items[selected], major=(d.ape===cat||d.space===cat);
    document.getElementById('feedback').textContent=(major?'这类确实承担主要作用。':'这不是两行中的主要承担者，但功能可以跨栏。')+' '+d.note+'。';
    selected=null; render();
  }
  function reset(){state=items.map(function(){return null});selected=null;document.getElementById('feedback').textContent='先选择一项生存功能，再判断它在两类人群中主要由谁承担。选后仍可改。';render();}
  function rowHTML(cat,who){
    var html='<img class="identity-back" src="'+(who==='space'?'assets/img/iss-cupola.jpg':'assets/img/afarensis-skull.jpg')+'" title="'+(who==='space'?'国际空间站穹顶舱':'南方古猿头骨')+'" alt=""><div class="row-label">'+(who==='ape'?'<span class="tag bio">猿人</span>':'<span class="tag active">太空人</span>')+'</div>';
    var found=items.filter(function(d){return d[who]===cat});
    if(!found.length) return html+'<div class="empty">这一行很少由此类主要承担</div>';
    return html+found.map(function(d){var placed=state[items.indexOf(d)]===cat;return '<div class="entry" style="opacity:'+(placed?'1':'.82')+'"><strong>'+d[who==='ape'?'a':'s']+'</strong><span>'+(placed?d.name:'等待功能匹配')+(placed?'<br>'+d.note:'')+'</span></div>';}).join('');
  }
  function render(){
    buttons.attr('aria-pressed',function(d,i){return selected===i?'true':'false'}).classed('placed',function(d,i){return state[i]!==null}).text(function(d,i){return state.every(function(x){return x!==null})&&i===0?'重新填写':d.name});
    bucket.classed('active',selected!==null);
    bucket.select('.ape-row').html(function(d,i){return rowHTML(i,'ape')});
    bucket.select('.space-row').html(function(d,i){return rowHTML(i,'space')});
    var done=state.filter(function(x){return x!==null}).length;
    document.getElementById('progress').textContent=done===items.length?'已完成 · 点“重新填写”重置':done+' / '+items.length+' 已归仓';
    chart.setOption(chartOption(done),true);
    d3.selectAll('.conclusion').classed('on',done===items.length);
  }
  render();
  var off=Deck.onResize(function(){chart.resize()});
  window.addEventListener('pagehide',function(){off();chart.dispose();},{once:true});
});
</script>
</body>
</html>
