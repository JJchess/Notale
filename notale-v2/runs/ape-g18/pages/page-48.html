<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .eyebrow{color:var(--cyan);font-size:var(--fs-label);line-height:1.35;font-weight:700;letter-spacing:.14em}
  .diagram{position:relative;height:100%}
  .diagram .k-generalization{position:relative;z-index:2;height:100%;grid-template-rows:auto 72px minmax(0,1fr)}
  .diagram .claim{background:rgba(11,15,18,.78);box-shadow:0 10px 30px rgba(0,0,0,.22)}
  .claim-label{display:block;margin-bottom:5px;color:var(--muted);font-size:var(--fs-label);line-height:1.35;font-weight:650}
  .supports{padding-bottom:112px}
  .support{display:flex;flex-direction:column;align-items:center;text-align:center}
  .support + .support{border-left:1px solid var(--line)}
  .support h2{margin-bottom:12px}
  .support p{max-width:340px;margin-bottom:10px}
  .support .return{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:var(--fs-sec);line-height:1.5}
  .bio-copy h2{color:var(--ochre)}
  .culture-copy h2{color:var(--text)}
  .system-copy h2{color:var(--cyan)}
  .feedback-lines{position:absolute;z-index:1;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .merge-label{position:absolute;z-index:3;right:50%;bottom:54px;transform:translateX(50%);padding:7px 18px;background:rgba(11,15,18,.92);border:1px solid var(--line-strong);border-radius:999px;color:var(--text);font-size:var(--fs-sec);line-height:1.4;font-weight:680;white-space:nowrap}
  .loop-label{position:absolute;z-index:3;left:12px;top:47%;padding:5px 9px;background:rgba(11,15,18,.9);color:var(--muted);font-size:var(--fs-label);line-height:1.35;writing-mode:vertical-rl}
  .next-question{display:flex;align-items:center;justify-content:center;border-top:1px solid var(--line);font-size:var(--fs-lead);line-height:1.45;font-weight:650;text-align:center}
</style>
</head>
<body data-page="48" data-total="50">
<div id="stage">
  <img class="backdrop" src="assets/img/iss-earth.jpg" alt="" title="国际空间站视角下的地球弧线" style="opacity:.18">

  <header style="height:104px">
    <div class="eyebrow">SYNTHESIS · E5</div>
    <h1 style="margin-top:8px">从石片到宇航服：适应进入反馈回路</h1>
  </header>

  <main class="min0" style="flex:1">
    <section class="diagram min0" aria-labelledby="feedback-claim">
      <svg class="feedback-lines" viewBox="0 0 1488 646" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="returnMix" x1="0" x2="1">
            <stop offset="0" stop-color="var(--ochre)"/>
            <stop offset=".48" stop-color="var(--line-strong)"/>
            <stop offset="1" stop-color="var(--cyan)"/>
          </linearGradient>
          <marker id="arrowMix" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ochre)"/>
          </marker>
        </defs>
        <path d="M248 465 V548 H744" fill="none" stroke="var(--ochre)" stroke-width="3"/>
        <path d="M744 465 V548" fill="none" stroke="var(--line-strong)" stroke-width="3"/>
        <path d="M1240 465 V548 H744" fill="none" stroke="var(--cyan)" stroke-width="3"/>
        <path d="M744 548 H72 V92 H250" fill="none" stroke="url(#returnMix)" stroke-width="4" marker-end="url(#arrowMix)"/>
      </svg>

      <div class="k-generalization" style="--support-n:3">
        <div class="claim" id="feedback-claim">
          <span class="claim-label">共同起点 · 环境压力</span>
          人类反复把环境选择压力转译为身体、文化和工程系统之间的反馈。
        </div>
        <div class="trunk" aria-hidden="true"></div>
        <div class="supports">
          <article class="support bio-copy min0">
            <span class="tag bio">慢通道</span>
            <h2 style="margin-top:10px">身体</h2>
            <p>多代遗传变化改变耐受、移动与取食能力。</p>
            <p class="return">返回影响：哪些个体更可能生存与繁殖</p>
          </article>
          <article class="support culture-copy min0">
            <span class="tag neutral">累积通道</span>
            <h2 style="margin-top:10px">文化</h2>
            <p>模仿、教学与协作保存可累积的行为方案。</p>
            <p class="return">返回影响：群体面对压力时可调用的经验</p>
          </article>
          <article class="support system-copy min0">
            <span class="tag active">外置通道</span>
            <h2 style="margin-top:10px">工程系统</h2>
            <p>工具与生命保障在身体外维持所需条件。</p>
            <p class="return">返回影响：人实际暴露的环境与风险</p>
          </article>
        </div>
      </div>
      <div class="merge-label">彼此约束 · 共同塑造下一轮选择压力</div>
      <div class="loop-label">反馈回到环境压力</div>
    </section>
  </main>

  <footer class="next-question" style="height:88px">
    <span style="color:var(--cyan);margin-right:12px">下一问</span>
    <span>如果抵达一个新环境，第一步该改变身体、行为、工具，还是周围的系统？</span>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
