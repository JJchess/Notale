<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="50" data-total="50">
<div id="stage">
  <img class="backdrop" src="assets/img/mars-surface.jpg" alt="" title="火星地表全景" style="opacity:.18;object-fit:cover;object-position:center">

  <header style="height:126px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center">
    <div style="color:var(--ochre);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:650;letter-spacing:.14em">V · CO-EVOLUTION</div>
    <h1 style="margin:8px 0 0"><span>我们开始</span><span>设计选择压力</span></h1>
  </header>

  <main class="k-generalization min0" style="--support-n:3">
    <div class="claim" style="width:min(1120px,86%);padding:20px 26px;font-size:var(--fs-h1);text-align:center;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)">
      <p style="margin:0;font:inherit;line-height:1.45">迈向星空不是摆脱进化，</p>
      <p style="margin:0;font:inherit;line-height:1.45">而是开始主动设计自己将承受的环境与选择压力。</p>
    </div>
    <div class="trunk" aria-hidden="true"></div>
    <div class="supports min0">
      <section class="support min0" style="padding-right:42px;padding-left:42px;display:flex;flex-direction:column;justify-content:space-evenly;text-align:center">
        <h2 style="color:var(--ochre)"><span>环境门槛</span><span>仍在</span></h2>
        <p style="margin:0">真空、辐射与低重力</p>
        <p style="margin:0">不会因技术进步而消失。</p>
      </section>
      <section class="support min0" style="padding-right:42px;padding-left:42px;display:flex;flex-direction:column;justify-content:space-evenly;text-align:center">
        <h2 style="color:var(--ochre)"><span>承担者</span><span>可以改变</span></h2>
        <p style="margin:0">生存功能可由身体、行为、文化</p>
        <p style="margin:0">或工程系统共同承担。</p>
      </section>
      <section class="support min0" style="padding-right:42px;padding-left:42px;display:flex;flex-direction:column;justify-content:space-evenly;text-align:center">
        <h2 style="color:var(--ochre)"><span>选择压力</span><span>随之改变</span></h2>
        <p style="margin:0">我们设计的栖居条件，</p>
        <p style="margin:0">也会反过来塑造未来的身体与社会。</p>
      </section>
    </div>
  </main>

  <footer style="height:142px;display:flex;flex-direction:column;justify-content:center;align-items:center;border-top:1px solid var(--line);text-align:center">
    <div style="margin-bottom:8px;color:var(--cyan);font-size:var(--fs-label);font-weight:650;letter-spacing:.1em">下一问</div>
    <p class="lead" style="margin:0;font-size:var(--fs-h2);font-weight:680"><span>当栖居环境也由我们设计，</span><span>未来的人类会被什么筛选？</span></p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
