<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root{--bg:#0b0e14;--text:#e6e6e6;--font-sans:"Noto Sans SC",system-ui,sans-serif}
    #stage{gap:18px}
    .head{display:flex;align-items:flex-end;justify-content:space-between;height:92px;border-bottom:1px solid color-mix(in srgb,var(--text) 24%,transparent);padding-bottom:16px}
    .kicker{font-size:var(--fs-label);letter-spacing:.16em;opacity:.68;margin-bottom:7px}
    h1{font-size:var(--fs-h1);line-height:1.15;margin:0}
    .premise{font-size:var(--fs-lead);line-height:1.4;max-width:650px;margin:0;text-align:right}
    main{display:flex;flex-direction:column;gap:16px;min-height:0}
    .game-board{display:flex;flex:1;min-height:0;gap:24px}
    .pool{width:294px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 20px}
    .pool-title{font-size:var(--fs-h2);font-weight:700}
    .pool-sub{font-size:var(--fs-sec);opacity:.72;text-align:center;line-height:1.4}
    .meats{display:grid;grid-template-columns:repeat(2,86px);gap:15px;min-height:330px;align-content:center;justify-content:center}
    .meat{width:86px;height:54px;border:2px solid currentColor;border-radius:48% 42% 45% 35%;background:color-mix(in srgb,var(--text) 42%,transparent);cursor:grab;display:grid;place-items:center;font-size:var(--fs-label);font-weight:700;touch-action:none;user-select:none;transition:transform .14s ease,opacity .14s ease}
    .meat:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.meat.selected{transform:translateY(-7px);outline:3px solid currentColor}.meat.dragging{opacity:.55;cursor:grabbing}
    .classes{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;position:relative}
    .classes.complete:before{content:"";position:absolute;left:8%;right:8%;top:50%;height:3px;background:currentColor;opacity:.38;z-index:0}
    .k-classification .box{position:relative;z-index:1;display:flex;flex-direction:column;min-width:0;padding:22px 18px;border-style:dashed;transition:border-style .15s ease}
    .k-classification .box.met{border-style:solid}.k-classification .box.alert{border-width:3px}
    .bt{font-size:var(--fs-h2);font-weight:750;margin-bottom:10px}.members{display:flex;flex-wrap:wrap;gap:8px;min-height:58px}.role{font-size:var(--fs-label);line-height:1.4;opacity:.82;padding:7px 10px;border-left:2px solid currentColor;background:color-mix(in srgb,var(--text) 6%,transparent)}.purpose{font-size:var(--fs-sec);line-height:1.45;min-height:52px;margin-top:12px}
    .count{font-family:ui-monospace,monospace;font-size:var(--fs-read-sm);font-weight:800;margin:14px 0 4px}.count small{font:inherit;font-size:22px;opacity:.65}
    .dropzone{flex:1;min-height:210px;border-top:1px solid color-mix(in srgb,var(--text) 25%,transparent);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--text) 18%,transparent) 0 16px,transparent 16px 34px);margin-top:12px;padding-top:18px;display:flex;align-content:flex-start;flex-wrap:wrap;gap:10px}
    .slot{width:calc(50% - 5px);height:52px;display:grid;place-items:center;border:1px dashed currentColor;font-size:var(--fs-label);opacity:.55}.dropzone .meat{width:66px;height:43px;font-size:var(--fs-tick);position:relative;z-index:1}
    .choose{font-size:var(--fs-sec);line-height:1.4;opacity:.68;margin-top:auto}.box button{font-size:var(--fs-sec);margin-top:14px;width:100%}
    .foot{height:116px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;border-top:1px solid color-mix(in srgb,var(--text) 24%,transparent);padding-top:15px}
    .feedback{font-size:var(--fs-body);line-height:1.45;font-weight:650}.feedback span{display:block;font-size:var(--fs-sec);font-weight:400;opacity:.75;margin-top:4px}.actions{display:flex;align-items:center;gap:20px}.next{font-size:var(--fs-sec);line-height:1.4;max-width:410px;text-align:right;opacity:.72}
    @media (prefers-reduced-motion:reduce){.meat{transition:none}}
  </style>
</head>
<body data-page="23" data-total="50">
  <div id="stage">
    <header class="head">
      <div><div class="kicker">RISK POOL</div><h1>谁能分到这份猎物？</h1></div>
      <p class="premise">分享不是额外的善意装饰，而是一种群体保险。</p>
    </header>
    <main>
      <risk-pool-game class="game-board" aria-label="十块肉的群体风险分配游戏">
        <section class="pool panel" aria-label="待分配区">
          <div class="pool-title">共同猎物</div>
          <div class="pool-sub">拖动肉块，或用 Enter 选中后选择承担方式</div>
          <div class="meats" data-pool></div>
          <button class="btn" data-reset type="button">重新分配</button>
        </section>
        <section class="classes k-classification min0" data-classes></section>
      </risk-pool-game>
      <footer class="foot">
        <div class="feedback" aria-live="polite" data-feedback>先分配共同猎物，覆盖群体的两项生存功能。<span>示意局：公平不是人人相同，而是群体功能被覆盖、利用压力仍可控。</span></div>
        <div class="actions"><div class="next">分配规则如何越过个人记忆——下一页看它怎样被传下去。</div></div>
      </footer>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
  (()=>{
    const cfg={total:10,need:[4,4,2]};
    class RiskPoolGame extends HTMLElement{
      constructor(){super();this.state=this.fresh();this.trace=[];this.drag=null}
      fresh(){return {places:Array(cfg.total).fill(-1),selected:-1,complete:false}}
      connectedCallback(){
        this.pool=this.querySelector('[data-pool]');this.classes=this.querySelector('[data-classes]');this.feedback=document.querySelector('[data-feedback]');
        this.renderShell();this.querySelector('[data-reset]').addEventListener('click',()=>this.reset());
        this.addEventListener('pointerdown',e=>this.pointerDown(e));
        this.addEventListener('pointermove',e=>this.pointerMove(e));
        this.addEventListener('pointerup',e=>this.pointerUp(e));
        this.addEventListener('keydown',e=>this.key(e));this.start();
      }
      start(){this.dispatchEvent(new CustomEvent('game-start',{bubbles:true,composed:true,detail:{state:this.getState()}}));this.render()}
      reset(){this.state=this.fresh();this.trace=[];this.render();this.dispatchEvent(new CustomEvent('game-reset',{bubbles:true,composed:true}))}
      getState(){return JSON.parse(JSON.stringify(this.state))}
      renderShell(){
        const groups=[['获取与守护',['追猎者','守夜者'],'让下一次获取仍能发生'],['照料与保障',['照料者','受伤者','幼者'],'让暂时不能获取者仍能存活'],['贡献未核实',['未参与任务的申领者'],'分享可能被利用']];
        this.classes.innerHTML=groups.map((g,i)=>`<article class="box panel" data-box="${i}"><div class="bt">${g[0]}</div><div class="members">${g[1].map(r=>`<span class="role lv">${r}</span>`).join('')}</div><div class="purpose">${g[2]}</div><div class="count" data-count><b>0</b><small> / ${cfg.need[i]}</small></div><div class="dropzone panel" data-zone="${i}"></div><div class="choose">${i<2?'至少覆盖 '+cfg.need[i]+' 块':'利用压力不超过 '+cfg.need[i]+' 块'}</div><button class="btn" data-send="${i}" type="button">把选中肉块分到这里</button></article>`).join('');
        this.querySelectorAll('[data-send]').forEach(b=>b.addEventListener('click',()=>this.send(+b.dataset.send)));
      }
      meat(i){const el=document.createElement('div');el.className='meat';el.tabIndex=0;el.dataset.meat=i;el.setAttribute('role','button');el.setAttribute('aria-label',`肉块 ${i+1}`);el.textContent=`肉 ${i+1}`;return el}
      render(){
        this.pool.innerHTML='';this.querySelectorAll('[data-zone]').forEach(z=>{z.innerHTML='';for(let n=0;n<cfg.need[+z.dataset.zone];n++){const s=document.createElement('span');s.className='slot panel';s.textContent=`功能份额 ${n+1}`;z.appendChild(s)}});
        this.state.places.forEach((p,i)=>{const el=this.meat(i);if(this.state.selected===i)el.classList.add('selected');(p<0?this.pool:this.querySelector(`[data-zone="${p}"]`)).appendChild(el)});
        const counts=[0,1,2].map(i=>this.state.places.filter(x=>x===i).length);
        this.querySelectorAll('[data-box]').forEach((b,i)=>{b.querySelector('b').textContent=counts[i];b.classList.toggle('met',i<2?counts[i]>=cfg.need[i]:counts[i]<=cfg.need[i]);b.classList.toggle('alert',i===2&&counts[i]>cfg.need[i])});
        const all=this.state.places.every(x=>x>=0), complete=all&&counts[0]>=cfg.need[0]&&counts[1]>=cfg.need[1]&&counts[2]<=cfg.need[2];this.state.complete=complete;this.classes.classList.toggle('complete',complete);
        let msg='继续分配：共同猎物还没有全部进入风险池。';
        if(all&&!complete){const miss=[];if(counts[0]<cfg.need[0])miss.push('获取与守护尚未覆盖');if(counts[1]<cfg.need[1])miss.push('照料与保障尚未覆盖');if(counts[2]>cfg.need[2])miss.push('未核实申领过多，利用压力上升');msg=miss.join('；')+'。'}
        if(complete)msg='本局完成：群体功能得到覆盖，利用压力仍可控。';
        this.feedback.firstChild.textContent=msg;
      }
      move(i,to){if(i<0)return;this.state.places[i]=to;this.state.selected=-1;this.trace.push({meat:i,to});this.render();const counts=[0,1,2].map(n=>this.state.places.filter(x=>x===n).length);this.dispatchEvent(new CustomEvent(this.state.complete?'game-complete':'game-progress',{bubbles:true,composed:true,detail:this.state.complete?{score:null,metrics:{counts},trace:[...this.trace]}:{state:this.getState(),action:{meat:i,to},metrics:{counts}}}))}
      send(to){if(this.state.selected>=0)this.move(this.state.selected,to);else{const i=this.state.places.findIndex(x=>x<0);if(i>=0)this.move(i,to)}}
      key(e){const m=e.target.closest('[data-meat]');if(!m)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();this.state.selected=+m.dataset.meat;this.render();this.querySelector(`[data-meat="${this.state.selected}"]`)?.focus()}}
      pointerDown(e){const m=e.target.closest('[data-meat]');if(!m)return;this.drag={i:+m.dataset.meat,el:m,x:e.clientX,y:e.clientY};m.setPointerCapture(e.pointerId);m.classList.add('dragging')}
      pointerMove(e){if(!this.drag)return;const dx=(e.clientX-this.drag.x)/(Deck.s||1),dy=(e.clientY-this.drag.y)/(Deck.s||1);this.drag.el.style.transform=`translate(${dx}px,${dy}px)`}
      pointerUp(e){if(!this.drag)return;const el=this.drag.el;el.releasePointerCapture(e.pointerId);el.style.transform='';el.classList.remove('dragging');const p=Deck.pt(this,e),boxes=[...this.querySelectorAll('[data-box]')];let to=-1;boxes.forEach((b,i)=>{const r=b.getBoundingClientRect(),s=Deck.s||1,x=(r.left-this.getBoundingClientRect().left)/s,y=(r.top-this.getBoundingClientRect().top)/s;if(p.x>=x&&p.x<=x+b.offsetWidth&&p.y>=y&&p.y<=y+b.offsetHeight)to=i});if(to>=0)this.move(this.drag.i,to);this.drag=null}
    }
    customElements.define('risk-pool-game',RiskPoolGame);Deck.init({index:23,total:50});
  })();
  </script>
</body>
</html>
