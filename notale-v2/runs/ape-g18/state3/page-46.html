<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root{--bg:#11100e;--text:#f1eee8;--font-sans:"Noto Sans SC",system-ui,sans-serif}
    #stage{position:relative;isolation:isolate}
    .backdrop{background:url('assets/img/mars-surface.jpg') center/cover no-repeat;opacity:.18}
    header{height:112px;display:flex;justify-content:space-between;align-items:flex-start;gap:40px}
    .kicker{font-size:var(--fs-label);letter-spacing:.16em;color:var(--accent);font-weight:700;margin-bottom:7px}
    h1{font-size:var(--fs-h1);line-height:1.15;margin:0;max-width:950px}
    .baseline{font-size:var(--fs-sec);line-height:1.4;text-align:right;max-width:410px;padding-top:25px;color:var(--muted)}
    main{display:flex;gap:28px;min-height:0}
    .config{flex:1.7;display:flex;flex-direction:column;min-width:0}
    .k-comparison{display:grid;grid-template-columns:130px repeat(3,minmax(0,1fr));grid-template-rows:44px repeat(5,1fr);--compare-n:3;align-content:stretch;flex:1;min-height:0}
    .k-comparison .hdr{font-size:var(--fs-label);font-weight:700;padding:10px 12px;text-align:center;border-bottom:1px solid var(--line)}
    .k-comparison .dim{font-size:var(--fs-body);font-weight:700;text-align:right;padding:15px 18px 15px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end}
    .choice,.fixed{min-width:0;border:0;border-bottom:1px solid var(--line);border-left:1px solid transparent;background:color-mix(in srgb,var(--text) 5%,transparent);color:var(--text);padding:10px 12px;font:inherit;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:3px;cursor:pointer}
    .choice strong,.fixed strong{font-size:var(--fs-body);font-variant-numeric:tabular-nums}
    .choice span,.fixed span{font-size:var(--fs-label);color:var(--muted);line-height:1.3}
    .choice.diff{border-left:3px solid var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
    .choice.diff span{color:var(--text)}
    .choice:focus-visible{outline:3px solid var(--focus);outline-offset:-4px}
    aside{flex:0 0 390px;display:flex;flex-direction:column;gap:14px;min-width:0}
    aside>.panel{padding:20px 22px;flex:1}
    .panel h2{font-size:var(--fs-h2);margin:0 0 14px}
    .massline{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:10px}
    .massline .big{font-size:var(--fs-read-sm)}
    .metric{display:grid;grid-template-columns:105px 1fr auto;align-items:center;gap:9px;margin-top:12px}
    .metric>span{font-size:var(--fs-label)}
    .metric output{font-size:var(--fs-sec);font-variant-numeric:tabular-nums}
    .track{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
    .fill{height:100%;background:var(--accent);width:50%;transition:width .2s ease}
    .result{min-height:72px;font-size:var(--fs-sec);line-height:1.45;margin:14px 0 0;padding-top:13px;border-top:1px solid var(--line)}
    .actions{display:flex;gap:10px;margin-top:auto}
    .actions .btn:first-child{flex:1}
    footer{height:94px;display:flex;align-items:flex-end;justify-content:space-between;gap:35px;border-top:1px solid var(--line);padding-top:15px;margin-top:18px}
    .takeaway{font-size:var(--fs-lead);line-height:1.35;max-width:780px;font-weight:650}
    .next{font-size:var(--fs-sec);line-height:1.4;max-width:590px;text-align:right;color:var(--muted)}
    @media(prefers-reduced-motion:reduce){.fill{transition:none}}
  </style>
</head>
<body data-page="46" data-total="50">
  <div id="stage">
    <div class="backdrop" role="img" aria-label="火星地表" title="火星地表"></div>
    <header>
      <div><div class="kicker">MISSION TRADE-OFF</div><h1>火星生存舱：你不能把所有安全都带上</h1></div>
      <div class="baseline">火星巡航基线：1.8 mSv/天<br>质量上限：25 t · 课堂任务模型</div>
    </header>
    <main>
      <section class="config min0" aria-label="生存舱配置比较">
        <div class="k-comparison" id="matrix">
          <div class="hdr">配置维度</div><div class="hdr">轻量</div><div class="hdr">折中</div><div class="hdr">强化</div>
        </div>
      </section>
      <aside class="min0">
        <div class="panel" aria-live="polite">
          <h2>任务读数</h2>
          <div class="massline"><output class="big sm" id="mass">22.1</output><span class="unit">t / 25 t</span></div>
          <div class="metric"><span>水余量</span><div class="track"><div class="fill" id="waterBar"></div></div><output id="waterOut">0 L</output></div>
          <div class="metric"><span>180 天剂量</span><div class="track"><div class="fill" id="doseBar"></div></div><output id="doseOut">230 mSv</output></div>
          <div class="metric"><span>故障替换</span><div class="track"><div class="fill" id="spareBar"></div></div><output id="spareOut">1 个</output></div>
          <div class="metric"><span>人工重力</span><div class="track"><div class="fill" id="gravityBar"></div></div><output id="gravityOut">间歇 0.38g</output></div>
          <p class="result" id="result">选择各行方案，再提交检查门槛与最大短板。</p>
        </div>
        <div class="actions"><button class="btn lg" id="submit">提交方案</button><button class="btn" id="reset">复位</button></div>
      </aside>
    </main>
    <footer>
      <div class="takeaway">火星任务必须在水、屏蔽、备用件、人工重力和质量之间做无法全部满足的取舍。</div>
      <div class="next">当身体、工具与系统都在承担生存功能时——猿人与太空人究竟差在哪里？</div>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
  (()=>{
    Deck.init({index:46,total:50});
    const waterNeed=Lec.P.crewWaterNeedLitres(4,180);
    const baseDose=Lec.P.radiationDoseMillisieverts(1.8,180);
    const rows=[
      {key:'water',name:'水',opts:[{m:1.2,sub:'缺 600 L',v:waterNeed-600},{m:1.8,sub:'刚好 1800 L',v:waterNeed},{m:2.4,sub:'余 600 L',v:waterNeed+600}]},
      {key:'shield',name:'屏蔽',opts:[{m:1,sub:'324 mSv',v:baseDose},{m:3,sub:'230 mSv',v:230},{m:6,sub:'160 mSv',v:160}]},
      {key:'spare',name:'备用件',opts:[{m:.8,sub:'0 个关键替换',v:0},{m:1.8,sub:'1 个',v:1},{m:3,sub:'2 个',v:2}]},
      {key:'gravity',name:'人工重力',opts:[{m:0,sub:'无',v:0},{m:2.5,sub:'间歇 0.38g',v:.38},{m:6,sub:'约 1g',v:1}]}
    ];
    let state={selected:[1,1,1,1],submitted:false};
    const matrix=document.querySelector('#matrix');
    rows.forEach((row,ri)=>{
      const d=document.createElement('div');d.className='dim';d.textContent=row.name;matrix.append(d);
      row.opts.forEach((o,oi)=>{
        const b=document.createElement('button');b.className='choice';b.dataset.row=ri;b.dataset.opt=oi;
        b.setAttribute('aria-label',`${row.name}：${['轻量','折中','强化'][oi]}，${o.m} 吨，${o.sub}`);
        b.innerHTML=`<strong>${o.m.toFixed(1)} t</strong><span>${o.sub}</span>`;
        b.onclick=()=>transition({type:'select',row:ri,opt:oi});matrix.append(b);
      });
    });
    const fd=document.createElement('div');fd.className='dim';fd.textContent='固定舱体';matrix.append(fd);
    ['轻量','折中','强化'].forEach(()=>{const x=document.createElement('div');x.className='fixed';x.innerHTML='<strong>13.0 t</strong><span>不可调整</span>';matrix.append(x)});
    function metrics(){
      const pick=rows.map((r,i)=>r.opts[state.selected[i]]);
      return {pick,mass:13+pick.reduce((s,x)=>s+x.m,0),water:pick[0].v-waterNeed,dose:pick[1].v,spare:pick[2].v,gravity:pick[3].v};
    }
    function transition(a){
      if(a.type==='select'){state.selected[a.row]=a.opt;state.submitted=false}
      if(a.type==='reset')state={selected:[1,1,1,1],submitted:false};
      if(a.type==='submit')state.submitted=true;
      render();
    }
    function render(){
      const m=metrics();
      document.querySelectorAll('.choice').forEach(b=>{const on=state.selected[+b.dataset.row]===+b.dataset.opt;b.classList.toggle('diff',on);b.setAttribute('aria-pressed',on)});
      mass.textContent=m.mass.toFixed(1);waterOut.textContent=`${m.water>0?'+':''}${m.water.toFixed(0)} L`;doseOut.textContent=`${m.dose.toFixed(0)} mSv`;spareOut.textContent=`${m.spare} 个`;gravityOut.textContent=m.gravity===0?'无':m.gravity<1?'间歇 0.38g':'约 1g';
      const risks={water:Math.max(0,Math.min(100,50-m.water/12)),dose:Math.max(0,Math.min(100,m.dose/3.24)),spare:m.spare?50/m.spare:100,gravity:m.gravity===0?100:m.gravity<1?65:20};
      waterBar.style.width=risks.water+'%';doseBar.style.width=risks.dose+'%';spareBar.style.width=risks.spare+'%';gravityBar.style.width=risks.gravity+'%';
      if(!state.submitted){result.textContent='选择各行方案，再提交检查门槛与最大短板。';return}
      const fails=[];if(m.mass>25)fails.push(`质量超出 ${(m.mass-25).toFixed(1)} t`);if(m.water<0)fails.push('水余量为负');if(m.dose>250)fails.push('剂量超过 250 mSv');if(m.spare<1)fails.push('没有关键替换件');
      if(fails.length)result.textContent=`尚不可执行：首先越过的门槛是${fails[0]}。`;
      else{const names={water:'水',dose:'辐射',spare:'故障替换',gravity:'人工重力'};const worst=Object.entries(risks).sort((a,b)=>b[1]-a[1])[0][0];result.textContent=`可执行，但最大短板是${names[worst]}。没有唯一配置，仍可继续调整。`}
    }
    submit.onclick=()=>transition({type:'submit'});reset.onclick=()=>transition({type:'reset'});render();
  })();
  </script>
</body>
</html>
