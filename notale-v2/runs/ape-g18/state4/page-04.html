<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root{--bg:#0B0F12;--text:#eef2f3;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#45D6E8}
    #stage{gap:14px}
    header{height:72px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}
    .kicker{font:var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--cyan)}
    h1{font-size:var(--fs-h1);line-height:1.1;margin:8px 0 0}
    .progress{font-size:var(--fs-label);color:var(--muted);font-family:var(--font-mono)}
    main{flex:1;display:flex;flex-direction:column;gap:12px}
    .gamebar{height:48px;display:flex;align-items:center;gap:18px}
    .goal{font-size:var(--fs-lead);font-weight:700}
    .status{font-size:var(--fs-sec);color:var(--muted);flex:1}
    .source{height:290px;border:1px dashed var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:11px}
    .source-head{display:flex;align-items:center;justify-content:space-between}
    .source-title{font-size:var(--fs-h2);font-weight:700}
    .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;min-height:236px}
    .case{font-size:var(--fs-sec);line-height:1.35;text-align:left;color:var(--text);background:transparent;border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:10px 13px;cursor:grab;min-height:54px;transition:border-color .15s,transform .15s,background .15s}
    .case:hover,.case[aria-grabbed="true"]{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 8%,transparent)}
    .case.dragging{opacity:.72;z-index:20;cursor:grabbing}
    .case .why{display:block;color:var(--cyan);font-size:var(--fs-label);margin-top:5px}
    .k-classification{flex:1;display:flex;flex-direction:column;min-height:0}
    .root-label{height:34px;align-self:center;padding:4px 20px;border-bottom:2px solid var(--cyan);font-size:var(--fs-sec);font-weight:700}
    .branches{position:relative;flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-top:18px}
    .branches:before{content:"";position:absolute;left:16.5%;right:16.5%;top:0;border-top:1px solid var(--cyan)}
    .bin{position:relative;border:1px solid var(--line-strong);border-radius:var(--radius);padding:13px;display:flex;flex-direction:column;gap:7px;min-width:0;background:transparent}
    .bin:before{content:"";position:absolute;left:50%;top:-19px;height:18px;border-left:1px solid var(--cyan)}
    .bin.flash{animation:flash .32s 2}
    @keyframes flash{50%{border-color:var(--cyan);box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan) 25%,transparent)}}
    .bt{font-size:var(--fs-h2);font-weight:750}
    .definition{font-size:var(--fs-sec);line-height:1.35;color:var(--text)}
    .question{font-size:var(--fs-label);line-height:1.35;color:var(--muted);min-height:40px}
    .lv{border-left:2px solid var(--line-strong);padding-left:9px;display:flex;flex-direction:column;gap:6px;flex:1}
    .lv .case{min-height:0;padding:7px 9px;cursor:default}.slot{flex:1;min-height:0;padding:4px;display:flex;align-items:center;justify-content:center;border-bottom:1px dashed var(--line);font-size:var(--fs-label);color:var(--muted)}
    .complete-line{height:38px;display:none;align-items:center;justify-content:center;gap:12px;color:var(--cyan);font-size:var(--fs-lead);font-weight:700}
    .complete .complete-line{display:flex}
    footer{height:60px;border-top:1px solid var(--line);padding-top:11px;display:flex;gap:24px;align-items:flex-start}
    .takeaway{font-size:var(--fs-sec);font-weight:700;flex:1}
    .next{font-size:var(--fs-sec);line-height:1.35;color:var(--muted);max-width:700px}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body data-page="04" data-total="50">
<div id="stage">
  <header>
    <div><div class="kicker">ACT I · PRESSURE MAP</div><h1>极端，不止一种</h1></div>
    <div class="progress">04 / 50</div>
  </header>
  <main class="min0">
    <div class="gamebar"><div class="goal">把 9 种情境按“首先破坏生命的机制”归仓</div><div id="status" class="status" aria-live="polite">已归仓 0 / 9</div><button class="btn" id="reset" type="button">重新归仓</button></div>
    <section class="source panel" aria-label="待归类情境">
      <div class="source-head"><div class="source-title">暂存区</div><div class="hint">拖动卡片进仓；也可选中卡片，再选择仓位</div></div>
      <div class="cards" id="cards"></div>
    </section>
    <section class="k-classification min0" id="game" aria-label="极端环境压力分类">
      <div class="root-label">极端环境压力</div>
      <div class="branches">
        <section class="box bin panel" data-bin="resource" tabindex="0" role="button" aria-label="资源不足仓"><div class="bt">资源不足</div><div class="definition">生命所需输入不够</div><div class="question panel">缺的是要消耗的东西吗？</div><div class="lv" aria-label="已归入资源不足的情境"></div></section>
        <section class="box bin panel" data-bin="damage" tabindex="0" role="button" aria-label="物理伤害仓"><div class="bt">物理伤害</div><div class="definition">外界能量或物体直接损伤组织</div><div class="question panel">有什么正在撞击、切割或穿透？</div><div class="lv" aria-label="已归入物理伤害的情境"></div></section>
        <section class="box bin panel" data-bin="imbalance" tabindex="0" role="button" aria-label="生理失衡仓"><div class="bt">生理失衡</div><div class="definition">外界条件使体内稳态偏离</div><div class="question panel">体内分布、温度或压力平衡被打乱了吗？</div><div class="lv" aria-label="已归入生理失衡的情境"></div></section>
      </div>
      <div class="complete-line" id="complete">三类压力共同汇入 → 生存门槛</div>
    </section>
  </main>
  <footer><div class="takeaway">极端环境首先可分为资源不足、物理伤害与生理失衡三类压力。</div><div class="next">同样要跨过生存门槛，身体来得及改变吗——下一页把百万年与几分钟压到同一把尺上。</div></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  const DATA=[
    ['可饮用水断供','resource','缺少生命持续消耗的水'],['可食用能量不足','resource','缺少生命持续消耗的能量'],['可呼吸氧不足','resource','缺少呼吸所需的氧'],
    ['落石撞击','damage','物体直接撞击组织'],['锋利岩面割伤','damage','物体直接切割组织'],['高能粒子穿透组织','damage','外界能量直接穿透组织'],
    ['酷热令核心体温上升','imbalance','体温稳态偏离'],['微重力使体液向头部转移','imbalance','体液分布稳态偏离'],['低压使体液出现沸腾风险','imbalance','压力平衡被打乱']
  ];
  const cards=document.querySelector('#cards'), bins=[...document.querySelectorAll('.bin')], status=document.querySelector('#status'), game=document.querySelector('#game');
  let state, selected=null, drag=null;
  function fresh(){return {placed:{},trace:[]}}
  function render(){
    status.textContent=`已归仓 ${Object.keys(state.placed).length} / ${DATA.length}`;
    game.classList.toggle('complete',Object.keys(state.placed).length===DATA.length);
  }
  function makeCard(item,i){const b=document.createElement('button');b.type='button';b.className='case panel';b.dataset.id=i;b.dataset.answer=item[1];b.setAttribute('aria-grabbed','false');b.textContent=item[0];b.addEventListener('click',()=>select(b));b.addEventListener('pointerdown',startDrag);return b}
  function reset(){state=fresh();selected=null;cards.replaceChildren(...DATA.map(makeCard));bins.forEach(b=>{const lv=b.querySelector('.lv');lv.replaceChildren();const s=document.createElement('div');s.className='slot panel';s.textContent='3 个位置等待归类判断';lv.append(s)});render();}
  function select(card){if(state.placed[card.dataset.id])return;document.querySelectorAll('.case').forEach(c=>c.setAttribute('aria-grabbed','false'));selected=card;card.setAttribute('aria-grabbed','true');status.textContent=`已选“${card.firstChild.textContent}”，请选择一个仓位`}
  function attempt(card,bin){if(!card)return;if(card.dataset.answer===bin.dataset.bin){state.placed[card.dataset.id]=bin.dataset.bin;state.trace.push([card.dataset.id,bin.dataset.bin]);card.setAttribute('aria-grabbed','false');card.onpointerdown=null;const why=document.createElement('span');why.className='why';why.textContent='→ '+DATA[+card.dataset.id][2];card.append(why);const lv=bin.querySelector('.lv');lv.querySelector('.slot')?.remove();lv.append(card);selected=null;render();if(Object.keys(state.placed).length===DATA.length)status.textContent='归仓完成：三类压力都可能构成生存门槛';}else{bin.classList.remove('flash');void bin.offsetWidth;bin.classList.add('flash');status.textContent=`再判断：${bin.querySelector('.question').textContent}`}}
  bins.forEach(bin=>{bin.addEventListener('click',()=>attempt(selected,bin));bin.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();attempt(selected,bin)}})});
  function startDrag(e){const card=e.currentTarget;if(state.placed[card.dataset.id])return;select(card);drag={card,x:e.clientX,y:e.clientY};card.setPointerCapture(e.pointerId);card.classList.add('dragging');card.addEventListener('pointermove',move);card.addEventListener('pointerup',end,{once:true});}
  function move(e){if(!drag)return;drag.card.style.transform=`translate(${(e.clientX-drag.x)/Deck.s}px,${(e.clientY-drag.y)/Deck.s}px)`}
  function end(e){const card=drag.card;card.classList.remove('dragging');card.style.transform='';card.removeEventListener('pointermove',move);drag=null;const bin=document.elementFromPoint(e.clientX,e.clientY)?.closest('.bin');if(bin)attempt(card,bin)}
  document.querySelector('#reset').addEventListener('click',reset);
  reset();Deck.init({index:4,total:50});
})();
</script>
</body>
</html>
