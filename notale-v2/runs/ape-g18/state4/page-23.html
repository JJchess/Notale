<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root{--bg:#0B0F12;--text:#e6e6e6;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:var(--cyan)}
    #stage{gap:14px}
    header{height:98px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}
    h1{font-size:var(--fs-h1);line-height:1.15;margin:5px 0 0}
    .kicker{font:var(--fs-label)/1 var(--font-mono);letter-spacing:.18em;color:var(--cyan)}
    .premise{max-width:710px;margin:0;text-align:right;font-size:var(--fs-sec);line-height:1.5;color:var(--muted)}
    main{flex:1;display:flex;flex-direction:column;gap:14px}
    risk-game{display:block;flex:1;min-height:0}
    footer{height:66px;display:flex;align-items:center;justify-content:space-between;gap:36px;border-top:1px solid var(--line)}
    .takeaway{font-size:var(--fs-sec);line-height:1.45;max-width:970px}
    .next{font-size:var(--fs-label);line-height:1.4;color:var(--muted);text-align:right;max-width:410px}
  </style>
</head>
<body data-page="23" data-total="50">
<div id="stage">
  <header>
    <div><div class="kicker">RISK POOL</div><h1>谁能分到这份猎物？</h1></div>
    <p class="premise">分享不是额外的善意装饰，而是一种群体保险。保险覆盖受伤与照料成本，也会带来谁承担、谁领取的持续张力。目标：分完 10 块，同时覆盖两项功能，并控制未核实申领。</p>
  </header>
  <main class="min0">
    <risk-allocation-game></risk-allocation-game>
  </main>
  <footer>
    <div class="takeaway">分享把饥饿、受伤和照料风险从个人转给群体；群体也因此必须处理只领取、不承担的问题。</div>
    <div class="next">分配规则如何越过个人记忆——下一页看它怎样被传下去。</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
class RiskAllocationGame extends HTMLElement{
  constructor(){super();this._bound=false}
  connectedCallback(){if(this._bound)return;this._bound=true;this.rules=this.readRules();this.render();this.reset(false);this.dispatchEvent(new CustomEvent('game-start',{bubbles:true,composed:true}))}
  readRules(){
    const root=(window.Lec&&Lec.K)||{};
    const page=root.p23||root.page23||root.riskPool||root.sharing||{};
    const projected=(window.Lec&&Lec.P&&(Lec.P.p23||Lec.P.page23||Lec.P.riskPool));
    const raw={total:Number(page.total||page.meat||page.blocks||10),guard:Number(page.guard||page.acquire||page.thresholdA||4),care:Number(page.care||page.thresholdB||4),claim:Number(page.claim||page.unverified||page.maxClaim||2)};
    return typeof projected==='function'?projected(raw):raw;
  }
  fresh(){return{places:Array(this.rules.total).fill('pool'),selected:null,complete:false,trace:[]}}
  start(){this.reset()}
  reset(emit=true){this.state=this.fresh();this.update();if(emit)this.dispatchEvent(new CustomEvent('game-reset',{bubbles:true,composed:true}))}
  getState(){return JSON.parse(JSON.stringify(this.state))}
  transition(i,to){if(i==null||i<0||i>=this.state.places.length)return;const from=this.state.places[i];if(from===to)return;this.state.places[i]=to;this.state.selected=null;this.state.trace.push({piece:i+1,from,to});this.update();const metrics=this.metrics();this.dispatchEvent(new CustomEvent(metrics.complete?'game-complete':'game-progress',{bubbles:true,composed:true,detail:metrics.complete?{score:1,metrics,trace:[...this.state.trace]}:{state:this.getState(),action:{piece:i+1,from,to},metrics}}))}
  metrics(){const count=k=>this.state.places.filter(x=>x===k).length;const guard=count('guard'),care=count('care'),claim=count('claim'),pool=count('pool');return{guard,care,claim,pool,complete:pool===0&&guard>=this.rules.guard&&care>=this.rules.care&&claim<=this.rules.claim}}
  feedback(m){if(m.complete)return'本局完成：三种承担方式连成共享风险环。';if(m.pool>0)return`还剩 ${m.pool} 块待分配。先覆盖两项群体功能。`;if(m.guard<this.rules.guard)return'获取与守护尚未覆盖：下一次获取可能中断。';if(m.care<this.rules.care)return'照料与保障尚未覆盖：暂时不能获取者面临风险。';return'未核实申领超过本局上限：利用压力上升。'}
  render(){this.innerHTML=`<style>
    :host{display:flex;height:100%;font-family:var(--font-sans);color:var(--text)}
    *{box-sizing:border-box} button{font:inherit;color:inherit}
    .game{display:flex;flex:1;min-height:0;flex-direction:column;gap:12px}
    .top{height:178px;display:flex;align-items:stretch;gap:18px}
    .pool{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;display:flex;flex-direction:column;gap:12px;background:var(--panel)}
    .poolhead,.statusline{display:flex;align-items:center;justify-content:space-between;gap:20px}
    h2{font-size:var(--fs-h2);margin:0}.small{font-size:var(--fs-label);color:var(--muted);line-height:1.4}
    .pieces{display:flex;flex-wrap:wrap;gap:10px;align-content:center;flex:1}
    .meat{width:104px;height:58px;border:2px solid var(--ochre);border-radius:42% 58% 48% 52%;background:color-mix(in srgb,var(--ochre) 25%,transparent);cursor:grab;font:var(--fs-label)/1 var(--font-mono)}
    .meat[aria-pressed=true]{outline:3px solid var(--cyan);outline-offset:3px}.meat:focus-visible,.move:focus-visible,.reset:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    .side{width:390px;border-left:3px solid var(--cyan);padding:12px 0 10px 20px;display:flex;flex-direction:column;justify-content:center;gap:10px}
    .feedback{font-size:var(--fs-body);line-height:1.4;min-height:50px}.hint{font-size:var(--fs-label);color:var(--muted);line-height:1.4}.hint:before{content:'› ';color:var(--cyan)}
    .reset{align-self:flex-start;border:1px solid var(--line);border-radius:var(--radius);background:transparent;padding:9px 16px;cursor:pointer;font-size:var(--fs-label)}
    .classes{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-top:16px}
    .box{position:relative;border:1px solid var(--line);border-top:4px solid var(--muted);border-radius:var(--radius);padding:18px;display:flex;min-width:0;flex-direction:column;gap:10px;transition:border-color .18s}
    .box.good{border-top-color:var(--cyan)}.box.warn{border-top-color:var(--ochre)}
    .classes.complete:before{content:'';position:absolute;left:9%;right:9%;top:6px;height:3px;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}
    .bt{font-size:var(--fs-h2);font-weight:700}.roles{font-size:var(--fs-label);color:var(--muted);line-height:1.4}.rolelist{display:flex;gap:7px;flex-wrap:wrap;min-height:42px}.role{border-left:2px solid var(--ochre);padding:7px 10px;font-size:var(--fs-sec)}.stakes{display:flex;flex-direction:column;gap:5px;border-left:2px solid var(--cyan);padding-left:10px}.stake{font-size:var(--fs-label);line-height:1.35;color:var(--muted)}
    .read{font:var(--fs-read-sm)/1 var(--font-mono);margin-top:2px}.function{font-size:var(--fs-sec);line-height:1.4;min-height:44px}
    .quota{border-top:1px solid var(--line);padding-top:10px}.stakes.panel,.function.panel{padding:4px 8px}.quota-label{font-size:var(--fs-label);color:var(--muted);margin-bottom:8px}.slots{display:flex;gap:7px;flex-wrap:wrap}.slot{width:58px;height:38px;border:1px dashed var(--muted);border-radius:var(--radius);display:grid;place-items:center;font:var(--fs-tick)/1 var(--font-mono);color:var(--muted)}
    .drop{flex:1;min-height:72px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px}
    .drop:empty:after{content:'把肉块放在这里';font-size:var(--fs-label);color:var(--muted);align-self:center;margin:auto}.drop .meat{width:58px;height:38px;font-size:var(--fs-tick)}
    .moves{display:flex;gap:7px;flex-wrap:wrap}.move{border:1px solid var(--line);border-radius:var(--radius);background:transparent;padding:7px 10px;cursor:pointer;font-size:var(--fs-label)}
    .move:disabled{opacity:.4;cursor:not-allowed}.note{font-size:var(--fs-label);line-height:1.4;color:var(--muted)}
    @media(prefers-reduced-motion:reduce){.box{transition:none}}
  </style>
  <div class="game">
    <div class="top">
      <section class="pool" data-drop="pool" aria-label="中央待分配区"><div class="poolhead"><h2>共同猎物 · <span id="poolCount"></span></h2><span class="small">共用一份总量</span></div><div class="pieces" id="pool"></div><div class="statusline"><div class="moves" aria-label="键盘分配"></div><div class="small">选中肉块后，可用按钮移动</div></div></section>
      <aside class="side"><div class="feedback" id="feedback" aria-live="polite"></div><div class="hint">拖动肉块，或先选中肉块再选择分类</div><div class="small">示意局：公平不是人人相同，而是群体功能被覆盖、利用压力仍可控。门槛不是史前实测比例。</div><button class="reset" type="button">重新分配</button></aside>
    </div>
    <div class="classes k-classification" id="classes"></div>
  </div>`;
  this.querySelector('.reset').onclick=()=>this.reset();
  this.addEventListener('dragover',e=>{if(e.target.closest('[data-drop]'))e.preventDefault()});
  this.addEventListener('drop',e=>{const z=e.target.closest('[data-drop]');if(!z)return;e.preventDefault();this.transition(Number(e.dataTransfer.getData('text/plain')),z.dataset.drop)});
  }
  piece(i){const b=document.createElement('button');b.className='meat';b.type='button';b.draggable=true;b.textContent=`#${i+1}`;b.setAttribute('aria-label',`肉块 ${i+1}`);b.setAttribute('aria-pressed',this.state.selected===i);b.onclick=()=>{this.state.selected=this.state.selected===i?null:i;this.update()};b.ondragstart=e=>e.dataTransfer.setData('text/plain',String(i));return b}
  update(){const m=this.metrics(),r=this.rules;this.state.complete=m.complete;const pool=this.querySelector('#pool');pool.replaceChildren(...this.state.places.map((p,i)=>p==='pool'?this.piece(i):null).filter(Boolean));this.querySelector('#poolCount').textContent=`${m.pool}/${r.total} 块`;
    const defs=[['guard','获取与守护',['追猎者','守夜者'],'让下一次获取仍能发生',r.guard,'至少',['追猎失败 → 今日无收获','守夜中断 → 营地风险','份额到位 → 再次获取']],['care','照料与保障',['照料者','受伤者','幼者'],'让暂时不能获取者仍能存活',r.care,'至少',['受伤 → 暂停获取','幼者 → 尚不能获取','照料 → 保留群体成员']],['claim','贡献未核实',['未参与任务的申领者'],'分享可能被利用',r.claim,'不超过',['参与情况 → 尚未核实','领取增加 → 利用压力上升','上限约束 → 压力可控']]];
    const classes=this.querySelector('#classes');classes.classList.toggle('complete',m.complete);classes.replaceChildren(...defs.map(d=>{const [key,title,roles,fn,limit,qual,stakes]=d;const n=m[key],ok=key==='claim'?n<=limit:n>=limit;const box=document.createElement('section');box.className=`box ${ok?'good':'warn'}`;box.dataset.drop=key;box.innerHTML=`<div class="bt">${title}</div><div class="roles">下位角色</div><div class="rolelist">${roles.map(x=>`<span class="role">${x}</span>`).join('')}</div><div class="read">${n}/${limit}</div><div class="function panel">${fn}<br><span class="small">${qual} ${limit} 块</span></div><div class="stakes panel"><div class="stake">风险转移<br>${stakes.join('<br>')}</div></div><div class="quota"><div class="quota-label">本局功能门槛</div><div class="slots">${Array.from({length:limit},(_,i)=>`<span class="slot">${i+1}</span>`).join('')}</div></div><div class="drop" data-drop="${key}"></div>`;box.querySelector('.drop').replaceChildren(...this.state.places.map((p,i)=>p===key?this.piece(i):null).filter(Boolean));return box}));
    const moves=this.querySelector('.moves');moves.replaceChildren(...defs.map(d=>{const b=document.createElement('button');b.type='button';b.className='move';b.textContent=`移到${d[1]}`;b.disabled=this.state.selected==null;b.onclick=()=>this.transition(this.state.selected,d[0]);return b}),(()=>{const b=document.createElement('button');b.type='button';b.className='move';b.textContent='放回中央';b.disabled=this.state.selected==null;b.onclick=()=>this.transition(this.state.selected,'pool');return b})());
    this.querySelector('#feedback').textContent=this.feedback(m);
  }
}
customElements.define('risk-allocation-game',RiskAllocationGame);
Deck.init({index:23,total:50});
</script>
</body>
</html>
