<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root{--bg:#0B0F12;--text:#e8eef0;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#45D6E8}
    #stage{overflow:hidden}
    .head{height:108px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid color-mix(in srgb,var(--text) 18%,transparent);padding-bottom:18px}
    .kicker{font:700 var(--fs-label)/1 var(--font-sans);letter-spacing:.18em;color:#45D6E8;margin-bottom:10px}
    h1{font:700 var(--fs-h1)/1.1 var(--font-sans);margin:0}
    .thesis{max-width:690px;font:400 var(--fs-sec)/1.45 var(--font-sans);color:color-mix(in srgb,var(--text) 78%,transparent);margin:0;text-align:right}
    main{flex:1;display:flex;flex-direction:column;min-height:0;padding-top:18px}
    .game-top{height:226px;display:flex;gap:26px;align-items:stretch}
    .pool{flex:1.1;display:flex;flex-direction:column;justify-content:center;align-items:center;border:1px dashed color-mix(in srgb,#45D6E8 55%,transparent);border-radius:var(--radius,16px);position:relative}
    .pool-title{font:600 var(--fs-h2)/1.2 var(--font-sans);margin:0 0 8px}
    .meats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:570px;min-height:104px;align-content:center}
    .meat{width:66px;height:44px;border:1px solid #C56A32;border-radius:50% 40% 48% 38%;background:color-mix(in srgb,#C56A32 24%,var(--bg));color:var(--text);font:700 var(--fs-label)/1 var(--font-sans);cursor:grab;transform:rotate(var(--r));touch-action:none}
    .meat[aria-pressed="true"]{outline:3px solid #45D6E8;outline-offset:2px}
    .instructions{flex:.75;display:flex;flex-direction:column;justify-content:center}
    .instructions p{font:400 var(--fs-body)/1.45 var(--font-sans);margin:0 0 12px}
    .hint{margin:0}
    .board{flex:1;display:flex;flex-direction:column;min-height:0;margin-top:18px;position:relative}
    .risk-svg{position:absolute;inset:2px 0 64px;width:100%;height:calc(100% - 66px);z-index:0;pointer-events:none}.risk-svg path{fill:none;stroke:color-mix(in srgb,var(--text) 22%,transparent);stroke-width:3;stroke-dasharray:12 10}.board.complete .risk-svg path{stroke:#45D6E8;stroke-dasharray:none}.riskline{position:absolute;left:8%;right:8%;top:30px;height:2px;border-top:2px dashed color-mix(in srgb,var(--text) 28%,transparent);z-index:0}
    .board.complete .riskline{border-top-style:solid;border-color:#45D6E8;box-shadow:0 0 12px color-mix(in srgb,#45D6E8 55%,transparent)}
    .k-classification{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;min-height:0;position:relative;z-index:1}
    .box{display:flex;flex-direction:column;min-width:0;padding:18px 20px;border-color:color-mix(in srgb,var(--text) 28%,transparent);background:var(--bg)}
    .box.good{border-color:#45D6E8}.box.warn{border-color:#C56A32}
    .bt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:700 var(--fs-h2)/1.25 var(--font-sans)}
    .read{font:700 var(--fs-read-sm)/1 var(--font-sans);color:#45D6E8;white-space:nowrap}
    .roles{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px}.role{border-bottom:2px solid #C56A32;padding:4px 8px;font:600 var(--fs-sec)/1.3 var(--font-sans);color:color-mix(in srgb,var(--text) 82%,transparent)}.function{font:400 var(--fs-body)/1.4 var(--font-sans);margin:0}
    .dropzone{flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(48px,1fr);align-content:center;gap:9px;min-height:112px;margin:10px 0;border-top:1px solid color-mix(in srgb,var(--text) 16%,transparent);padding-top:10px}.slot{display:flex;align-items:center;justify-content:center;border:1px dashed color-mix(in srgb,var(--text) 26%,transparent);border-radius:var(--radius,16px);font:500 var(--fs-label)/1.25 var(--font-sans);color:color-mix(in srgb,var(--text) 58%,transparent)}.dropzone .meat{width:100%;height:100%;min-height:48px}
    .assign{align-self:stretch}
    .status{height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    #feedback{font:600 var(--fs-body)/1.35 var(--font-sans);margin:0;color:#45D6E8}
    .note{font:400 var(--fs-sec)/1.4 var(--font-sans);margin:0;color:color-mix(in srgb,var(--text) 68%,transparent)}
    .foot{height:78px;border-top:1px solid color-mix(in srgb,var(--text) 18%,transparent);display:flex;align-items:center;justify-content:space-between;gap:30px}
    .takeaway{font:600 var(--fs-sec)/1.4 var(--font-sans);margin:0;max-width:930px}
    .next{font:400 var(--fs-sec)/1.4 var(--font-sans);margin:0;text-align:right;color:color-mix(in srgb,var(--text) 72%,transparent)}
  </style>
</head>
<body data-page="23" data-total="50">
  <div id="stage">
    <header class="head">
      <div><div class="kicker">RISK POOL</div><h1>谁能分到这份猎物？</h1></div>
      <p class="thesis">分享不是额外的善意装饰，而是一种群体保险。保险覆盖受伤与照料成本，也带来谁承担、谁领取的持续张力。</p>
    </header>
    <main>
      <section class="game-top">
        <div class="pool panel" aria-label="待分配区">
          <h2 class="pool-title">共同猎物 · <span id="remain">10</span> 块待分</h2>
          <div class="meats" id="pool"></div>
        </div>
        <div class="instructions panel">
          <p>把同一份猎物分给三种<strong>群体功能</strong>。目标不是人人相同，而是覆盖关键功能，并控制利用压力。</p>
          <p class="hint">拖动肉块到分类框；也可先选肉块，再按框内的“分到这里”。</p>
          <button class="btn" id="reset" type="button">重新分配</button>
        </div>
      </section>
      <section class="board panel" id="board">
        <svg class="risk-svg" viewBox="0 0 1488 430" preserveAspectRatio="none" aria-hidden="true"><path d="M40 215 C40 55 150 24 330 24 H1158 C1338 24 1448 55 1448 215 S1338 406 1158 406 H330 C150 406 40 375 40 215 Z"/></svg>
        <div class="riskline" aria-hidden="true"></div>
        <div class="k-classification" id="classes"></div>
        <div class="status">
          <p id="feedback" aria-live="polite">先覆盖“获取与守护”和“照料与保障”。</p>
          <p class="note">示意局：门槛不是史前人群的实测比例。</p>
        </div>
      </section>
    </main>
    <footer class="foot">
      <p class="takeaway">分享把饥饿、受伤和照料风险从个人转给群体；群体也因此必须处理只领取、不承担的问题。</p>
      <p class="next">分配规则如何越过个人记忆——下一页看它怎样被传下去。</p>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    (()=>{
      const rule=(Lec.P.p23 ||= {total:10,categories:[
        {id:'guard',name:'获取与守护',roles:'追猎者、守夜者',meaning:'让下一次获取仍能发生',min:4},
        {id:'care',name:'照料与保障',roles:'照料者、受伤者、幼者',meaning:'让暂时不能获取者仍能存活',min:4},
        {id:'claim',name:'贡献未核实',roles:'未参与任务的申领者',meaning:'分享可能被利用',max:2}
      ]});
      const fresh=()=>({places:Array(rule.total).fill('pool'),selected:null,trace:[],complete:false});
      let state=fresh();
      const pool=document.getElementById('pool'), classes=document.getElementById('classes');
      function counts(){return Object.fromEntries(rule.categories.map(c=>[c.id,state.places.filter(x=>x===c.id).length]));}
      function meat(i){const b=document.createElement('button');b.type='button';b.className='meat';b.textContent='肉';b.dataset.i=i;b.style.setProperty('--r',`${(i%5-2)*3}deg`);b.setAttribute('aria-label',`第 ${i+1} 块肉`);b.setAttribute('aria-pressed',state.selected===i);if(i===0)b.id='go';b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);select(i)});b.addEventListener('click',()=>select(i));b.addEventListener('pointerup',e=>{const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop]');if(el)move(i,el.dataset.drop)});return b}
      function select(i){state.selected=state.selected===i?null:i;render()}
      function move(i,to){if(i==null)return;state.places[i]=to;state.trace.push({piece:i,to});state.selected=null;render();}
      function verdict(c){const n=c[categoriesId('guard')],m=c[categoriesId('care')],u=c[categoriesId('claim')],left=c.pool;state.complete=left===0&&n>=4&&m>=4&&u<=2;if(state.complete)return '风险池成立：关键功能已覆盖，利用压力仍可控。';if(u>2)return '贡献未核实的申领超过 2 块：搭便车压力上升。';if(n<4)return '“获取与守护”尚未覆盖：下一次获取面临风险。';if(m<4)return '“照料与保障”尚未覆盖：受伤与照料成本无人承接。';return left?`还剩 ${left} 块；当前关键功能已覆盖。`:'还需调整分配。'}
      const categoriesId=x=>x;
      function render(){
        pool.innerHTML='';state.places.forEach((p,i)=>{if(p==='pool')pool.appendChild(meat(i))});
        const c=counts();c.pool=state.places.filter(x=>x==='pool').length;document.getElementById('remain').textContent=c.pool;
        classes.innerHTML='';rule.categories.forEach(cat=>{const ok=cat.min?c[cat.id]>=cat.min:c[cat.id]<=cat.max;const box=document.createElement('div');box.className=`box ${state.places.every(x=>x!=='pool')?(ok?'good':'warn'):''}`;box.dataset.drop=cat.id;box.innerHTML=`<div class="bt"><span>${cat.name}</span><span class="read">${c[cat.id]}/${cat.min||cat.max}</span></div><div class="roles">${cat.roles.split('、').map(x=>`<span class="role">${x}</span>`).join('')}</div><p class="function">${cat.meaning}</p><div class="dropzone"></div><button class="btn assign" type="button">分到这里</button>`;const zone=box.querySelector('.dropzone');state.places.forEach((p,i)=>{if(p===cat.id)zone.appendChild(meat(i))});const cap=cat.min||cat.max;for(let j=c[cat.id];j<cap;j++){const s=document.createElement('span');s.className='slot';s.textContent=cat.min?`功能门槛 ${j+1}`:`压力余量 ${j+1}`;zone.appendChild(s)};box.querySelector('.assign').addEventListener('click',()=>move(state.selected,cat.id));classes.appendChild(box)});
        const msg=verdict(c);document.getElementById('feedback').textContent=msg;document.getElementById('board').classList.toggle('complete',state.complete);
      }
      document.getElementById('reset').addEventListener('click',()=>{state=fresh();render()});
      render();Deck.init({index:23,total:50});
    })();
  </script>
</body>
</html>
