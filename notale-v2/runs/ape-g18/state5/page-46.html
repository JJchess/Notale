<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root{--bg:#0B0F12;--text:#eef3f4;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#45D6E8;--cyan:#45D6E8;--ochre:#C56A32;--muted:#9ba8ab;--line:rgba(238,243,244,.18);--panel:rgba(11,15,18,.78)}
    #stage{position:relative;isolation:isolate;overflow:hidden}
    .backdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.18;z-index:-2}
    #stage:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,15,18,.92),rgba(11,15,18,.7) 64%,rgba(11,15,18,.88));z-index:-1;pointer-events:none}
    header{height:102px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}
    .kicker{font-size:var(--fs-label);letter-spacing:.16em;color:var(--cyan);font-weight:700;margin-bottom:5px}
    h1{font-size:var(--fs-h1);line-height:1.15;margin:0}
    .baseline{font-size:var(--fs-label);color:var(--muted);padding-bottom:5px}
    main{flex:1;display:flex;gap:26px;padding:22px 0 18px}
    .config{flex:3.25;display:flex;flex-direction:column}
    .k-comparison{display:grid;grid-template-columns:134px repeat(3,minmax(0,1fr));grid-template-rows:46px repeat(5,1fr);height:100%;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .hdr,.dim,.pick{min-width:0;display:flex;align-items:center}
    .hdr{justify-content:center;font-size:var(--fs-label);color:var(--muted);font-weight:700;letter-spacing:.08em}
    .dim{justify-content:flex-end;padding-right:20px;border-top:1px solid var(--line);font-size:var(--fs-body);font-weight:700;color:var(--text)}
    .pick{width:100%;border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:transparent;color:var(--text);padding:8px 14px;justify-content:center;text-align:left;cursor:pointer;font:inherit;line-height:1.35;position:relative}
    .pick:hover{background:rgba(69,214,232,.06)}
    .pick.diff{color:var(--cyan);box-shadow:inset 0 -3px 0 var(--cyan);background:rgba(69,214,232,.09)}
    .pick strong{font-size:var(--fs-body);font-weight:700;display:block}
    .pick small{font-size:var(--fs-label);color:var(--muted);display:block;margin-top:2px}
    .pick.diff small{color:var(--text)}
    aside.panel{flex:1.42;display:flex;flex-direction:column;padding:22px 24px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
    aside h2{font-size:var(--fs-h2);margin:0 0 12px}
    .mass{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:13px;border-bottom:1px solid var(--line)}
    .mass .big{font-size:var(--fs-read-sm);color:var(--cyan);font-weight:800}
    .cap{font-size:var(--fs-label);color:var(--muted)}
    .metrics{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin:17px 0}
    .metric span{font-size:var(--fs-label);color:var(--muted);display:block}
    .metric strong{font-size:var(--fs-lead);font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums}
    .risks{display:flex;flex-direction:column;gap:10px;margin-top:2px}
    .riskhead{display:flex;justify-content:space-between;font-size:var(--fs-label);color:var(--muted);margin-bottom:4px}
    .track{height:9px;background:rgba(238,243,244,.1);border-radius:99px;overflow:hidden}
    .fill{height:100%;width:50%;background:var(--ochre);border-radius:inherit;transition:width .2s ease,background .2s ease}
    .actions{display:flex;gap:10px;margin-top:auto}
    .btn{flex:1}
    .result{min-height:52px;margin-top:13px;border-top:1px solid var(--line);padding-top:11px;font-size:var(--fs-sec);line-height:1.4;color:var(--text)}
    .result b{color:var(--cyan)}
    footer{height:82px;display:flex;align-items:flex-start;justify-content:space-between;gap:34px;border-top:1px solid var(--line);padding-top:15px}
    .takeaway{font-size:var(--fs-body);line-height:1.4;max-width:820px}
    .next{font-size:var(--fs-sec);line-height:1.4;color:var(--muted);max-width:560px;text-align:right}
    button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
  </style>
</head>
<body data-page="46" data-total="50">
  <div id="stage">
    <img class="backdrop" src="assets/img/mars-surface.jpg" alt="火星岩石地表" title="（已存在）">
    <header>
      <div><div class="kicker">MISSION TRADE-OFF</div><h1>火星生存舱：你不能把所有安全都带上</h1></div>
      <div class="baseline">火星巡航基线：1.8 mSv/天　·　质量上限：25 t</div>
    </header>
    <main class="min0">
      <section class="config min0" aria-label="火星舱配置比较">
        <div class="k-comparison" id="board" style="--compare-n:3">
          <div class="hdr">配置维度</div><div class="hdr">轻量</div><div class="hdr">折中</div><div class="hdr">强化</div>
        </div>
      </section>
      <aside class="panel min0" aria-label="实时任务读数">
        <h2>任务读数</h2>
        <div class="mass"><span class="cap">总质量 / 25 t</span><span class="big"><span id="mass">22.1</span><span class="unit"> t</span></span></div>
        <div class="metrics">
          <div class="metric"><span>水余量</span><strong id="water">0 L</strong></div>
          <div class="metric"><span>180 天剂量</span><strong id="dose">230 mSv</strong></div>
          <div class="metric"><span>关键替换</span><strong id="spares">1 个</strong></div>
          <div class="metric"><span>人工重力</span><strong id="gravity">0.38g</strong></div>
        </div>
        <div class="risks" id="risks" aria-label="短板风险条"></div>
        <p class="hint">逐行选择方案，再提交；没有唯一配置。</p>
        <div class="actions"><button class="btn" id="reset" type="button">复位</button><button class="btn" id="go" type="button">提交方案</button></div>
        <div class="result" id="result" aria-live="polite">当前折中配置满足三道生存门槛，并保留 2.9 t 质量余量。</div>
      </aside>
    </main>
    <footer>
      <div class="takeaway">火星任务必须在水、屏蔽、备用件、人工重力和质量之间做无法全部满足的取舍。</div>
      <div class="next">当身体、工具与系统都在承担生存功能时——猿人与太空人究竟差在哪里？</div>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Deck.init({index:46,total:50});
    const waterNeed = Lec.P.crewWaterNeedLitres(4,180);
    const rawDose = Lec.P.radiationDoseMillisieverts(1.8,180);
    const rows = [
      {key:'water',label:'水',opts:[{m:1.2,main:'1.2 t',sub:'缺 600 L',value:waterNeed-600},{m:1.8,main:'1.8 t',sub:'刚好 1800 L',value:waterNeed},{m:2.4,main:'2.4 t',sub:'余 600 L',value:waterNeed+600}]},
      {key:'shield',label:'屏蔽',opts:[{m:1,main:'1.0 t',sub:Math.round(rawDose)+' mSv',value:rawDose},{m:3,main:'3.0 t',sub:'230 mSv',value:230},{m:6,main:'6.0 t',sub:'160 mSv',value:160}]},
      {key:'spares',label:'备用件',opts:[{m:.8,main:'0.8 t',sub:'0 个关键替换',value:0},{m:1.8,main:'1.8 t',sub:'1 个',value:1},{m:3,main:'3.0 t',sub:'2 个',value:2}]},
      {key:'gravity',label:'人工重力',opts:[{m:0,main:'0 t',sub:'无',value:0},{m:2.5,main:'2.5 t',sub:'间歇 0.38g',value:.38},{m:6,main:'6.0 t',sub:'约 1g',value:1}]},
      {key:'hull',label:'固定舱体',opts:[{m:13,main:'13.0 t',sub:'基础结构',value:13},{m:13,main:'13.0 t',sub:'基础结构',value:13},{m:13,main:'13.0 t',sub:'基础结构',value:13}]}
    ];
    let state={selected:[1,1,1,1,1],submitted:false};
    const board=document.getElementById('board');
    rows.forEach((row,ri)=>{
      const dim=document.createElement('div'); dim.className='dim'; dim.textContent=row.label; board.appendChild(dim);
      row.opts.forEach((o,oi)=>{const b=document.createElement('button');b.type='button';b.className='pick'+(oi===1?' diff':'');b.dataset.row=ri;b.dataset.opt=oi;b.setAttribute('aria-pressed',oi===1?'true':'false');b.innerHTML='<span><strong>'+o.main+'</strong><small>'+o.sub+'</small></span>';b.addEventListener('click',()=>select(ri,oi));board.appendChild(b)});
    });
    const riskDefs=[['质量','mass'],['水','water'],['辐射','dose'],['系统／重力','system']];
    const risks=document.getElementById('risks');
    riskDefs.forEach(([n,k])=>{risks.insertAdjacentHTML('beforeend','<div><div class="riskhead"><span>'+n+'</span><span id="r-'+k+'-v"></span></div><div class="track"><div class="fill" id="r-'+k+'"></div></div></div>')});
    function metrics(){
      const o=rows.map((r,i)=>r.opts[state.selected[i]]), mass=o.reduce((s,x)=>s+x.m,0);
      return {mass,water:o[0].value-waterNeed,dose:o[1].value,spares:o[2].value,gravity:o[3].value};
    }
    function select(ri,oi){state.selected[ri]=oi;state.submitted=false;render();document.dispatchEvent(new CustomEvent('game-progress',{detail:{state:JSON.parse(JSON.stringify(state)),action:{row:ri,option:oi},metrics:metrics()}}))}
    function setRisk(k,val,label){const el=document.getElementById('r-'+k);el.style.width=Math.max(4,Math.min(100,val))+'%';el.style.background=val<=45?'var(--cyan)':'var(--ochre)';document.getElementById('r-'+k+'-v').textContent=label}
    function render(){
      document.querySelectorAll('.pick').forEach(b=>{const on=state.selected[+b.dataset.row]===+b.dataset.opt;b.classList.toggle('diff',on);b.setAttribute('aria-pressed',on)});
      const m=metrics(); mass.textContent=m.mass.toFixed(1);water.textContent=(m.water>0?'+':'')+m.water.toFixed(0)+' L';dose.textContent=m.dose.toFixed(0)+' mSv';spares.textContent=m.spares+' 个';gravity.textContent=m.gravity?((m.gravity===1?'约 ':'')+m.gravity.toFixed(2).replace(/0$/,'')+'g'):'无';
      setRisk('mass',Math.max(0,(m.mass-20)/5*100),m.mass<=25?'余 '+(25-m.mass).toFixed(1)+' t':'超 '+(m.mass-25).toFixed(1)+' t');
      setRisk('water',m.water<0?100:m.water===0?42:16,m.water<0?'不足':m.water===0?'临界':'有余量');
      setRisk('dose',m.dose<=160?18:m.dose<=250?44:100,m.dose<=250?'过线':'超线');
      setRisk('system',m.spares===0?100:Math.max(15,72-m.spares*22+(1-m.gravity)*25),m.spares===0?'无替换':m.gravity<1?'仍有短板':'较稳健');
      if(!state.submitted) result.textContent='配置已更新。提交后检查三道生存门槛与最大短板。';
    }
    function submit(){state.submitted=true;const m=metrics(),fails=[];if(m.mass>25)fails.push('质量超限');if(m.water<0)fails.push('水不足');if(m.dose>250)fails.push('辐射剂量超线');if(m.spares<1)fails.push('没有关键替换');let msg;if(fails.length)msg='首先越过的门槛是：'+fails[0]+'。';else{const risks=[['人工重力',1-m.gravity],['辐射余量',m.dose/250],['备用件',1/(m.spares+1)],['质量余量',m.mass/25]].sort((a,b)=>b[1]-a[1]);msg='可执行，但最大短板是'+risks[0][0]+'。';}result.innerHTML='<b>'+msg+'</b> 这是一种权衡，不是标准答案。';document.dispatchEvent(new CustomEvent('game-complete',{detail:{score:fails.length?0:1,metrics:m,trace:state.selected.slice()}}))}
    document.getElementById('go').addEventListener('click',submit);
    document.getElementById('reset').addEventListener('click',()=>{state={selected:[1,1,1,1,1],submitted:false};render();result.textContent='当前折中配置满足三道生存门槛，并保留 2.9 t 质量余量。';document.dispatchEvent(new CustomEvent('game-reset'))});
    render();
  </script>
</body>
</html>
