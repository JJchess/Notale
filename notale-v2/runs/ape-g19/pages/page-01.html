<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{position:relative;isolation:isolate;overflow:hidden;padding:0;background:var(--bg)}
  .hero{position:absolute;left:0;top:0;width:1600px;height:900px;overflow:hidden}
  #bg.backdrop{position:absolute;z-index:0;inset:0;display:block;width:100%;height:100%;max-width:none;object-fit:cover;object-position:center 55%;opacity:.42;filter:grayscale(.3) contrast(.82);transform:none;margin:0}
  .wash{position:absolute;z-index:1;inset:0;background:linear-gradient(180deg,rgba(244,240,230,.76) 0%,rgba(244,240,230,.9) 38%,rgba(244,240,230,.58) 63%,rgba(244,240,230,.84) 100%)}
  .envelope-region{position:absolute;z-index:1;left:0;bottom:0;width:1600px;height:430px;background:rgba(36,91,99,.08);clip-path:polygon(0 20%,63% 20%,76% 10%,86% 0,100% 0,100% 100%,0 100%)}
  #opening.focus.k-generalization{position:absolute;z-index:2;left:0;top:0;right:auto;bottom:auto;width:1600px;height:900px;max-width:none;margin:0;transform:none;opacity:1;visibility:visible;display:block;text-align:center}
  #opening .claim{position:absolute;z-index:3;left:336px;top:240px;width:928px;max-width:none;margin:0;padding:0;border:0;background:transparent;transform:none}
  .kicker{margin:0 0 24px;font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;letter-spacing:.22em;color:var(--focus)}
  h1{margin:0;font-family:var(--font-sans);font-size:52px;line-height:1.27;font-weight:700;letter-spacing:-.035em;color:var(--text)}
  #opening .trunk{position:absolute;z-index:2;inset:0;width:auto;height:auto;margin:0;transform:none;pointer-events:none}
  #opening .trunk svg{position:absolute;inset:0;display:block;width:100%;height:100%;max-width:none;margin:0;transform:none}
  .envelope-field{fill:var(--life);opacity:.11}
  .life-loop{fill:none;stroke:var(--life);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .horizon-shadow{fill:none;stroke:rgba(244,240,230,.8);stroke-width:15;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .focus-dot{fill:var(--focus)}
  .closing{position:absolute;z-index:3;top:610px;left:50%;transform:translateX(-50%);width:850px;margin:0;text-align:center;font-size:var(--fs-lead);line-height:1.45;font-weight:600;color:var(--text)}
  #opening .question{position:absolute;z-index:3;right:70px;bottom:54px;width:390px;padding-top:16px;border-top:2px solid var(--text);text-align:right}
  .next-label{display:block;margin-bottom:7px;font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.12em;color:var(--muted)}
  .question strong{font-size:var(--fs-h2);line-height:1.4;font-weight:700;color:var(--text)}
  .edge-label{position:absolute;z-index:3;left:66px;top:531px;font-family:var(--font-serif);font-size:var(--fs-label);letter-spacing:.08em;color:var(--muted)}
</style>
</head>
<body data-page="01" data-total="45">
<div id="stage">
  <main class="hero" aria-labelledby="hero-title">
    <img id="bg" class="backdrop" src="assets/img/illus-savanna-horizon.png" title="（已存在）" alt="林地与草原交界的远景地平线">
    <div class="wash" aria-hidden="true"></div>
    <div class="envelope-region" aria-hidden="true"></div>
    <section id="opening" class="focus k-generalization">
      <div class="claim">
        <p class="kicker">FOREST → SPACE</p>
        <h1 id="hero-title">从走出森林到迈向星空，<br>人类一直在扩展同一个生存包络。</h1>
      </div>
      <div class="trunk" aria-hidden="true">
        <svg viewBox="0 0 1600 900" preserveAspectRatio="none">
          <path class="envelope-field" d="M 0 558 C 190 552,345 557,520 556 C 700 555,865 557,1010 556 C 1140 555,1210 548,1270 520 C 1350 482,1397 421,1441 343 C 1472 288,1509 247,1568 215 L 1600 900 L 0 900 Z"/>
          <path class="horizon-shadow" d="M 0 558 C 190 552, 345 557, 520 556 C 700 555, 865 557, 1010 556 C 1140 555, 1210 548, 1270 520 C 1350 482, 1397 421, 1441 343 C 1472 288, 1509 247, 1568 215"/>
          <path class="life-loop" d="M 0 558 C 190 552, 345 557, 520 556 C 700 555, 865 557, 1010 556 C 1140 555, 1210 548, 1270 520 C 1350 482, 1397 421, 1441 343 C 1472 288, 1509 247, 1568 215"/>
          <circle class="focus-dot" cx="1568" cy="215" r="7"/>
        </svg>
      </div>
      <span class="edge-label">同一条可生存边界</span>
      <p class="closing">两段相隔百万年的历史，将用同一把尺来读。</p>
      <aside class="question" aria-label="下一问">
        <span class="next-label">NEXT QUESTION</span>
        <strong>这把尺要记下哪四本账？</strong>
      </aside>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
