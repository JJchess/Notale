<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="03" data-total="45">
<div id="stage">
<style>
  .p03-head{height:112px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding-bottom:18px;gap:28px}
  .p03-kicker{font:600 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.13em;color:var(--focus);margin-bottom:9px}
  .p03-head h1{font:700 var(--fs-h1)/1.15 var(--font-sans);margin:0;color:var(--text)}
  .p03-count{font:600 var(--fs-label)/1.2 var(--font-mono);color:var(--life);border:1px solid var(--life);padding:10px 14px;border-radius:4px;white-space:nowrap}
  .p03-count b{font-size:22px}
  .p03-main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;padding-top:18px;gap:14px}
  .p03-board{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:13px;border:2px solid var(--line-soft);border-radius:4px;transition:border-color .2s}
  .p03-board.is-complete{border:3px solid var(--life);padding:12px}
  .p03-col{min-width:0;border:1px solid var(--line-soft);background:var(--surface);padding:7px 9px 9px;display:flex;flex-direction:column;gap:7px}
  .p03-col:first-child{border-left:1px solid var(--line-soft)}
  .p03-col h2{margin:0;text-align:center;font:700 var(--fs-h2)/1.25 var(--font-sans);padding:3px 0 7px;border-bottom:2px solid var(--text)}
  .p03-def{text-align:center;color:var(--muted);font:500 var(--fs-label)/1.25 var(--font-sans);min-height:20px;display:flex;align-items:center;justify-content:center}.p03-col.is-wrong{outline:3px solid var(--focus);outline-offset:2px}
  .p03-slot{height:82px;border:1px dashed var(--line);border-radius:4px;padding:7px;display:flex;flex-direction:column;gap:5px;background:var(--surface)}
  .p03-slot.is-correct{border:1px solid var(--life);background:color-mix(in srgb,var(--life) 7%,var(--surface))}.p03-slot.is-correct .await{display:none}.await{margin:auto;color:var(--line);font:500 var(--fs-label)/1.2 var(--font-sans)}
  .slot-label{font:700 var(--fs-label)/1.1 var(--font-sans);color:var(--muted);display:flex;justify-content:space-between}
  .slot-label .ok{color:var(--life);font-weight:600}
  .p03-slot .p03-card{flex:1;padding:0;border:0;background:transparent;cursor:default}
  .p03-trayline{display:flex;align-items:center;justify-content:space-between;gap:20px}
  .p03-trayline h2{margin:0;font:700 var(--fs-h2)/1.2 var(--font-sans)}
  .p03-feedback{font:600 var(--fs-label)/1.3 var(--font-sans);color:var(--muted)}
  .p03-feedback.alert{color:var(--focus)}
  .p03-tray{padding:10px;border:1px solid var(--line-soft);background:var(--surface);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:58px;gap:7px 12px;min-height:257px}
  .p03-card{position:relative;min-width:0;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--text);padding:8px 11px 8px 40px;font:600 var(--fs-sec)/1.3 var(--font-sans);text-align:left;display:flex;align-items:center;cursor:grab;user-select:none;touch-action:none}
  .p03-card:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .p03-card[data-env="vacuum"]{border:3px double var(--line);padding-left:38px}
  .p03-card::before{content:attr(data-mark);position:absolute;left:8px;top:8px;bottom:8px;width:22px;border-right:2px solid var(--text);font:700 13px/1 var(--font-sans);writing-mode:vertical-rl;text-align:center;padding-right:4px;letter-spacing:.12em}
  .p03-card[data-env="vacuum"]::before{border-right:4px double var(--text)}
  .p03-card.dragging{z-index:20;position:relative;box-shadow:0 3px 0 rgba(32,37,34,.25);cursor:grabbing;pointer-events:none}
  .p03-actions{display:flex;align-items:center;gap:13px}
  .p03-reset{display:none}.p03-board.is-complete~.p03-trayline .p03-reset{display:inline-flex}
  .p03-foot{height:82px;border-top:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:42px}
  .p03-take{font:700 var(--fs-lead)/1.35 var(--font-sans);color:var(--life);max-width:820px}
  .p03-next{font:600 var(--fs-sec)/1.35 var(--font-sans);max-width:500px;text-align:right}
</style>
<header class="p03-head">
  <div><div class="p03-kicker">ACT I · CONSTRAINTS</div><h1>草原与真空，共用五类生存约束</h1></div>
  <div class="p03-count" aria-live="polite"><b id="count">0/5</b> 类约束已对齐</div>
</header>
<main class="p03-main min0">
  <section class="p03-board life-loop" id="board" aria-label="五类生存约束归仓板"></section>
  <div class="p03-trayline">
    <h2>条件卡</h2>
    <div class="p03-actions"><span class="p03-feedback" id="feedback">拖入对应列；键盘：方向键选列，Enter 放置。</span><button class="btn p03-reset" id="reset" type="button">重新归仓</button></div>
  </div>
  <section class="p03-tray" id="tray" aria-label="待归仓条件卡"></section>
</main>
<footer class="p03-foot">
  <div class="p03-take">环境看似天差地别，都可拆成供氧、温度、负荷、资源与风险。</div>
  <div class="p03-next">下一问：环境越界时，身体与工具能把哪些条件拉回来？</div>
</footer>
<script>
window.addEventListener('load',function(){
  const cats=['供氧','温度','负荷','资源','风险'];
  const defs=['呼吸介质是否可用','体温能否维持','身体承受的作用力','维持生命的供给','生存被中断的可能'];
  const cards=[
    {id:'s-risk',env:'savanna',cat:4,text:'受伤、捕食与竞争会中断生存'},
    {id:'v-oxygen',env:'vacuum',cat:0,text:'没有可呼吸空气'},
    {id:'s-load',env:'savanna',cat:2,text:'步行、攀爬与搬运持续施加载荷'},
    {id:'v-resource',env:'vacuum',cat:3,text:'氧、水与电力必须随身供给'},
    {id:'s-temp',env:'savanna',cat:1,text:'曝晒与寒夜可能越出耐受范围'},
    {id:'v-risk',env:'vacuum',cat:4,text:'辐射、碎片或系统故障可能致命'},
    {id:'s-oxygen',env:'savanna',cat:0,text:'空气可呼吸；活动仍需持续供氧'},
    {id:'v-load',env:'vacuum',cat:2,text:'日常承重刺激不足'},
    {id:'s-resource',env:'savanna',cat:3,text:'水、食物与庇护分散且有限'},
    {id:'v-temp',env:'vacuum',cat:1,text:'日照与阴影下都可能越出耐受范围'}
  ];
  const board=document.getElementById('board'),tray=document.getElementById('tray'),fb=document.getElementById('feedback'),count=document.getElementById('count');
  let placed=new Set(), target=0, drag=null;
  cats.forEach((name,i)=>{board.insertAdjacentHTML('beforeend',`<div class="p03-col k-comparison" data-col="${i}"><h2>${name}</h2><div class="p03-def">${defs[i]}</div><div class="p03-slot" data-col="${i}" data-env="savanna"><div class="slot-label"><span>草原</span><span class="ok"></span></div><span class="await">等待草原条件卡</span></div><div class="p03-slot" data-col="${i}" data-env="vacuum"><div class="slot-label"><span>真空</span><span class="ok"></span></div><span class="await">等待真空条件卡</span></div></div>`)});
  function make(c){const b=document.createElement('button');b.type='button';b.className='p03-card';b.id=c.id;b.dataset.env=c.env;b.dataset.cat=c.cat;b.dataset.mark=c.env==='savanna'?'草原':'真空';b.textContent=c.text;b.setAttribute('aria-label',`${b.dataset.mark}条件：${c.text}`);b.addEventListener('keydown',key);b.addEventListener('pointerdown',down);return b}
  function reset(){placed.clear();target=0;document.querySelectorAll('.p03-slot .p03-card').forEach(el=>el.remove());tray.replaceChildren(...cards.map(make));document.querySelectorAll('.p03-slot').forEach(s=>{s.classList.remove('is-correct');s.querySelector('.ok').textContent=''});board.classList.remove('is-complete');count.textContent='0/5';fb.textContent='拖入对应列；键盘：方向键选列，Enter 放置。';fb.classList.remove('alert')}
  function key(e){if(placed.has(e.currentTarget.id))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();target=(target+(e.key==='ArrowRight'?1:4))%5;fb.textContent=`已选择「${cats[target]}」列，按 Enter 放置。`}else if(e.key==='Enter'){e.preventDefault();place(e.currentTarget,target)}}
  function down(e){if(e.button!==0||placed.has(e.currentTarget.id))return;drag={el:e.currentTarget,id:e.pointerId,x:e.clientX,y:e.clientY};drag.el.setPointerCapture(e.pointerId);drag.el.classList.add('dragging');drag.el.addEventListener('pointermove',move);drag.el.addEventListener('pointerup',up);drag.el.addEventListener('pointercancel',up)}
  function move(e){if(!drag)return;drag.el.style.transform=`translate(${(e.clientX-drag.x)/Deck.s}px,${(e.clientY-drag.y)/Deck.s}px)`}
  function up(e){if(!drag)return;const el=drag.el;el.releasePointerCapture?.(drag.id);el.classList.remove('dragging');el.style.transform='';el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('.p03-col');drag=null;if(hit)place(el,+hit.dataset.col)}
  function place(el,col){const c=cards.find(x=>x.id===el.id);if(c.cat!==col){const box=document.querySelector(`.p03-col[data-col="${col}"]`);box.classList.add('is-wrong');setTimeout(()=>box.classList.remove('is-wrong'),500);fb.textContent='再看它限制的是哪一项。卡片已返回托盘。';fb.classList.add('alert');el.focus();return}const slot=document.querySelector(`.p03-slot[data-col="${col}"][data-env="${c.env}"]`);slot.appendChild(el);slot.classList.add('is-correct');slot.querySelector('.ok').textContent='已归仓';el.setAttribute('aria-disabled','true');el.tabIndex=-1;placed.add(c.id);fb.classList.remove('alert');fb.textContent=`「${cats[col]}」归仓正确。继续完成其余条件。`;const done=cats.filter((_,i)=>cards.filter(c=>c.cat===i).every(c=>placed.has(c.id))).length;count.textContent=`${done}/5`;if(placed.size===10){board.classList.add('is-complete');fb.textContent='五类约束已全部对齐：它们共同构成生存包络。'}}
  document.getElementById('reset').addEventListener('click',reset);reset();Deck.init({index:3,total:45,keys:false});
});
</script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
