<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{position:relative;isolation:isolate;overflow:hidden;}
  .backdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 58%;z-index:-3;filter:saturate(.55) contrast(.78);}
  .wash{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(244,240,230,.91) 0%,rgba(244,240,230,.84) 55%,rgba(244,240,230,.91) 100%);}
  .chapter-label{margin:0 0 10px;letter-spacing:.14em;color:var(--muted);font-size:var(--fs-label);}
  h1{margin:0;max-width:1320px;font-size:var(--fs-h1);line-height:1.22;font-weight:700;color:var(--text);}
  .rule{width:100%;height:1px;background:var(--line-soft);margin-top:18px;}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding-top:12px;}
  .k-generalization{position:relative;width:1300px;height:548px;display:flex;flex-direction:column;align-items:center;}
  .claim{width:1120px;min-height:174px;box-sizing:border-box;padding:20px 40px;background:var(--surface);border:2px solid var(--text);border-radius:4px;text-align:center;display:flex;align-items:center;justify-content:center;gap:38px;}
  .claim .tagline{font-size:var(--fs-label);letter-spacing:.12em;color:var(--focus);font-weight:700;margin-bottom:10px;display:block;}
  .claim strong{font-size:30px;line-height:1.3;font-weight:700;display:block;}
  .claim-copy{min-width:300px;}
  .concept-pair{display:flex;align-items:center;gap:18px;}
  .concept{width:230px;height:102px;box-sizing:border-box;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
  .concept b{font-size:var(--fs-body);}
  .concept span{font-size:var(--fs-label);color:var(--muted);}
  .concept.no{background:rgba(185,188,184,.18);}
  .concept.no b{text-decoration:line-through 2px var(--line);}
  .branchmark{width:74px;height:36px;}
  .pair-not{font-size:28px;font-weight:700;color:var(--focus);}
  .trunk{width:2px;height:64px;background:var(--text);position:relative;flex:0 0 auto;}
  .junction{position:absolute;top:238px;left:100px;width:1100px;height:75px;overflow:visible;pointer-events:none;}
  .supports{width:100%;display:flex;gap:92px;align-items:stretch;justify-content:center;}
  .support{width:604px;min-height:214px;box-sizing:border-box;padding:25px 32px 24px;background:var(--surface);border:1.5px solid var(--line);border-radius:4px;}
  .support h2{font-size:var(--fs-h2);line-height:1.3;margin:0 0 14px;font-weight:700;display:flex;align-items:center;gap:12px;}
  .support h2::before{content:"";display:block;width:24px;height:2px;background:var(--text);}
  .support p{font-size:var(--fs-body);line-height:1.55;margin:0;color:var(--text);}
  .facets{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line-soft);}
  .facet{font-size:var(--fs-label);line-height:1.35;padding:7px 10px;border:1px solid var(--line-soft);background:rgba(244,240,230,.62);}
  .reading{display:grid;grid-template-columns:122px 1fr;gap:12px;align-items:start;margin-top:15px;}
  .reading + .reading{padding-top:13px;border-top:1px solid var(--line-soft);}
  .reading b{font-size:var(--fs-label);line-height:1.4;font-weight:700;}
  .reading span{font-size:var(--fs-sec);line-height:1.4;}
  .misread{ text-decoration-line:line-through;text-decoration-color:var(--line);text-decoration-thickness:2px; }
  .reminder{width:100%;box-sizing:border-box;font-size:var(--fs-lead);line-height:1.4;margin:20px 0 0;padding:14px 22px;border-left:3px solid var(--text);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:22px;}
  .reminder b{font-size:var(--fs-label);letter-spacing:.08em;white-space:nowrap;}
  .reminder span{font-size:var(--fs-lead);}
  footer{height:88px;flex:0 0 88px;border-top:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:48px;}
  .takeaway{font-size:var(--fs-body);line-height:1.45;font-weight:650;max-width:900px;margin:0;}
  .next{font-size:var(--fs-sec);line-height:1.45;color:var(--muted);max-width:500px;margin:0;text-align:right;}
  .next b{color:var(--text);font-weight:700;}
</style>
</head>
<body data-page="05" data-total="45">
<div id="stage">
  <img class="backdrop" src="assets/img/illus-savanna-horizon.png" alt="稀树草原地平线上分散站立的远景个体" title="（已存在）">
  <div class="wash" aria-hidden="true"></div>
  <header>
    <p class="chapter-label">CHAPTER II · TERMS</p>
    <h1>“猿人”是通俗统称，不是通往现代人的一级台阶</h1>
    <div class="rule" aria-hidden="true"></div>
  </header>

  <main class="focus min0">
    <section class="k-generalization" aria-label="关于“猿人”一词的主张与两条支撑">
      <div class="claim">
        <div class="claim-copy"><span class="tagline">中央判断</span><strong>分支，而非阶梯</strong></div>
        <div class="concept-pair" aria-label="阶梯叙事与分支模型的区别">
          <div class="concept no"><b>一级级台阶</b><span>单线、预设终点</span></div>
          <span class="pair-not">≠</span>
          <div class="concept"><svg class="branchmark" viewBox="0 0 74 36" aria-hidden="true"><path d="M37 34V20M37 20L10 3M37 20L64 3M37 20L37 3" fill="none" stroke="#202522" stroke-width="2.5"/></svg><b>分叉的灌木</b><span>并存、分化、消失</span></div>
        </div>
      </div>
      <div class="trunk" aria-hidden="true"></div>
      <svg class="junction" viewBox="0 0 1000 75" aria-hidden="true">
        <path d="M500 0 V28 H277 V75 M500 28 H723 V75" fill="none" stroke="#202522" stroke-width="2" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="supports">
        <article class="support">
          <h2>本课用法</h2>
          <p>“猿人”＝对早期人族的通俗统称；它方便叙述，但不是严格的单一分类名称。</p>
          <div class="facets" aria-label="这个名称的三个性质">
            <span class="facet">通俗统称</span>
            <span class="facet">叙述工具</span>
            <span class="facet">非单一分类</span>
          </div>
        </article>
        <article class="support">
          <h2>排除误读</h2>
          <div class="reading">
            <b>不是逐级变化</b>
            <span class="misread">“现代猿逐级变成人”</span>
          </div>
          <div class="reading">
            <b>不是单一直系</b>
            <span>不能把所有早期人族都放进现代人的直系祖先链。</span>
          </div>
        </article>
      </div>
      <p class="reminder"><b>判断顺序</b><span>名称帮助我们开始比较</span><span aria-hidden="true">→</span><span>证据才决定具体关系</span></p>
    </section>
  </main>

  <footer>
    <p class="takeaway">早期人族的历史更像分叉的灌木：多个支系并存、分化与消失，而非排队升级。</p>
    <p class="next"><b>下一问</b>　如果不是一条直线，约 700 万年的证据应怎样放进同一幅图？</p>
  </footer>
</div>

</body>
</html>
