<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F4F0E6;--text:#202522;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#D85B35}
#stage{gap:12px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:36px;flex:0 0 auto}
.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.16em;color:var(--focus);margin-bottom:9px}
h1{font:700 var(--fs-h1)/1.2 var(--font-sans);margin:0;max-width:1120px}
.takeaway{max-width:320px;margin:0 0 3px;padding-left:18px;border-left:4px solid var(--life);font:600 var(--fs-sec)/1.45 var(--font-sans)}
.split-tb{display:flex;flex:1;min-height:0;flex-direction:column;gap:10px}
.overview{position:relative;flex:1;min-height:0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
#chart{position:absolute;inset:0}
.chart-note{position:absolute;left:214px;bottom:5px;font:var(--fs-label)/1.35 var(--font-sans);color:var(--muted);pointer-events:none}
.detail{flex:0 0 218px;display:flex;gap:18px;align-items:stretch}
.photo{width:245px;margin:0;display:flex;flex-direction:column;gap:5px}
.photo img{width:100%;height:172px;object-fit:contain;border:1px solid var(--line);background:var(--surface)}
figcaption{font:var(--fs-label)/1.35 var(--font-sans);color:var(--muted)}
.readout{flex:1;min-width:0;border-left:5px solid var(--life);background:var(--surface);padding:16px 20px;display:flex;flex-direction:column;justify-content:center}
.readout-top{display:flex;align-items:center;justify-content:space-between;gap:20px}
.count{font:700 var(--fs-h2)/1.2 var(--font-sans)}
.count strong{font:700 32px/1 var(--font-mono);color:var(--life)}
#detailTitle{font:700 var(--fs-lead)/1.3 var(--font-sans);margin:10px 0 5px}
#detailText{font:var(--fs-body)/1.45 var(--font-sans);margin:0;color:var(--muted)}
.controls{width:390px;padding:14px 18px;border:1px solid var(--line-soft);display:flex;flex-direction:column;justify-content:center;gap:8px;background:var(--surface)}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;font:600 var(--fs-label)/1.3 var(--font-sans)}
#yearOut{font:700 var(--fs-lead)/1 var(--font-mono);color:var(--focus)}
input[type=range]{width:100%;margin:7px 0 0}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px}.hint{margin:0}
footer{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding-top:2px;font:600 var(--fs-sec)/1.35 var(--font-sans)}
footer span{color:var(--focus);font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.1em}
</style>
</head>
<body data-page="06" data-total="45">
<div id="stage">
<header><div><div class="kicker">BRANCHING HOMININS</div><h1>约 700 万年的人族史，不是一架通往现代人的梯子</h1></div><p class="takeaway">多个人族支系曾在同一时期并存；现代人只是延续至今的一支。</p></header>
<main class="split-tb min0">
<section class="overview k-process min0" aria-label="代表性人族支系共享时间轴"><div id="chart"></div><p class="chart-note">区间为教学尺度的约数；本图仅列代表性支系，不是完整谱系。虚线连接表示简化假说。</p></section>
<section class="detail">
<figure class="photo"><img src="assets/img/lucy-skeleton.jpg" alt="Lucy 骨架复原陈列" title="（已存在）"><figcaption>Lucy 骨架复原陈列；个体年代约 318 万年前。</figcaption></figure>
<div class="readout"><div class="readout-top"><div class="count">此时本图中并存：<strong id="count">1</strong> 条</div><span class="tag" id="lockTag">游标跟随</span></div><div id="detailTitle">阿法南方古猿</div><p id="detailText">Lucy｜A.L. 288-1｜约 318 万年前｜属于阿法南方古猿</p></div>
<div class="controls"><div class="ctl"><label for="year"><span>拖动年代游标</span><output id="yearOut">318 万年前</output></label><input id="year" type="range" min="0" max="7" step="0.01" value="3.18"></div><div class="actions"><p class="hint">点支系锁定详情；点图表空白处解除。</p><button class="btn" id="reset" type="button">回到 Lucy</button></div></div>
</section>
</main>
<footer><span>NEXT QUESTION</span>当栖息地反复变化，什么样的生存策略更不容易被一次变化淘汰？</footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
Deck.init({index:6,total:45});
const branches=[
 {n:'人族与黑猩猩谱系分离',s:7,e:6,sub:'分离并非一个可精确定位的瞬间'},
 {n:'萨赫勒人',s:7,e:6,sub:'早期候选人族'},
 {n:'地猿类',s:5.8,e:4.4,sub:'合并标签；分类仍有讨论'},
 {n:'阿法南方古猿',s:3.9,e:2.9,sub:'Lucy 所属物种'},
 {n:'傍人类',s:2.7,e:1.2,sub:'与早期人属存在时间重叠'},
 {n:'能人',s:2.4,e:1.4,sub:'早期人属代表'},
 {n:'直立人',s:1.89,e:.11,sub:'长时间延续的支系'},
 {n:'尼安德特人',s:.4,e:.04,sub:'与智人时间重叠'},
 {n:'智人',s:.3,e:0,sub:'唯一延续至今的本图支系'}
];
let year=3.18, locked=3;
const chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
function alive(b,t){return t<=b.s&&t>=b.e}
function formatYear(t){return t===0?'现在':(t>=1?Math.round(t*100):Math.round(t*100))+' 万年前'}
function renderItem(params,api){const i=api.value(2),b=branches[i],a=api.coord([b.s,i]),z=api.coord([b.e,i]),on=alive(b,year),sel=i===locked;return {type:'group',children:[{type:'line',shape:{x1:a[0],y1:a[1],x2:z[0],y2:z[1]},style:{stroke:on?'#245B63':'#8B908D',lineWidth:sel?13:(on?9:6),lineCap:'round',opacity:on?1:.58},transition:['style']},{type:'circle',shape:{cx:a[0],cy:a[1],r:sel?7:4},style:{fill:sel?'#D85B35':(on?'#245B63':'#8B908D')}}]}}
const links=[[6,1,5.8,2],[4.4,2,3.9,3],[2.9,3,2.7,4],[2.9,3,2.4,5],[1.4,5,1.89,6],[.11,6,.4,7],[.11,6,.3,8]];
function renderLink(params,api){const a=api.coord([api.value(0),api.value(1)]),b=api.coord([api.value(2),api.value(3)]);return {type:'line',shape:{x1:a[0],y1:a[1],x2:b[0],y2:b[1]},style:{stroke:'#777C79',lineWidth:1.5,lineDash:[5,5],opacity:.65}}}
function option(){return {animationDurationUpdate:180,textStyle:{fontSize:16,fontFamily:'Noto Sans SC,system-ui,sans-serif',color:'#202522'},grid:{left:214,right:34,top:16,bottom:58},tooltip:{trigger:'item',textStyle:{fontSize:16},formatter:p=>branches[p.value[2]].n+'<br>'+formatYear(branches[p.value[2]].s)+'—'+formatYear(branches[p.value[2]].e)},xAxis:{type:'value',min:0,max:7,inverse:true,interval:1,axisLine:{lineStyle:{color:'#777C79',width:2}},axisTick:{lineStyle:{color:'#777C79'}},splitLine:{show:true,lineStyle:{color:'#D7D5CE'}},axisLabel:{fontSize:14,color:'#626764',formatter:v=>v===0?'现在':v*100+'万'}},yAxis:{type:'category',inverse:true,data:branches.map(b=>b.n),axisLine:{show:false},axisTick:{show:false},axisLabel:{fontSize:15,color:'#202522',margin:16,width:190,overflow:'truncate'}},series:[{type:'custom',name:'简化亲缘假说',renderItem:renderLink,data:links,silent:true,z:1},{type:'custom',name:'生存区间',renderItem,data:branches.map((b,i)=>[b.s,b.e,i]),encode:{x:[0,1],y:2},silent:false,z:3},{type:'line',data:branches.map(()=>year),symbol:'none',lineStyle:{color:'#D85B35',width:3},silent:true,z:5}]}}
function update(fade=true){chart.setOption(option(),true);const active=branches.filter(b=>alive(b,year));document.getElementById('count').textContent=active.length;document.getElementById('yearOut').textContent=formatYear(year);const idx=locked===null?(active.length?branches.indexOf(active[0]):-1):locked;const box=document.querySelector('.readout');if(fade){box.style.opacity='.35';setTimeout(()=>box.style.opacity='1',120)}
 if(idx>=0){document.getElementById('detailTitle').textContent=branches[idx].n;document.getElementById('detailText').textContent=idx===3?'Lucy｜A.L. 288-1｜约 318 万年前｜属于阿法南方古猿':formatYear(branches[idx].s)+'—'+formatYear(branches[idx].e)+'｜'+branches[idx].sub+'｜短来源：Smithsonian HOP'}else{document.getElementById('detailTitle').textContent='此刻无代表支系';document.getElementById('detailText').textContent='本图只列少量代表性支系，不等于完整谱系。'}document.getElementById('lockTag').textContent=locked===null?'游标跟随':'已锁定详情'}
document.getElementById('year').addEventListener('input',e=>{year=+e.target.value;update(false)});
document.getElementById('reset').addEventListener('click',()=>{year=3.18;locked=3;document.getElementById('year').value=year;update()});
chart.on('click',p=>{if(p.seriesType==='custom'){locked=p.value[2];update()}});
chart.getZr().on('click',e=>{if(!e.target){locked=null;update()}});
window.addEventListener('resize',()=>chart.resize());update(false);
</script>
</body>
</html>
