<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding-bottom:12px}
.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.14em;color:var(--focus);margin-bottom:9px}
h1{font:700 var(--fs-h1)/1.2 var(--font-sans);margin:0}.model{font:var(--fs-sec)/1.4 var(--font-sans);color:var(--muted);max-width:470px;text-align:right}
.controls{display:flex;align-items:center;gap:22px;min-height:62px}.ctl{display:flex;align-items:center;gap:14px}.ctl label{font-weight:650}.ctl output{font:700 20px/1 var(--font-mono);min-width:74px;color:var(--focus)}input[type=range]{width:300px}.hint{margin-left:auto}
.sim{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.env{position:relative;border-top:2px solid var(--text);border-bottom:1px solid var(--line-soft);padding:10px 14px 8px;background:var(--surface)}
.env-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.env-title{font:700 var(--fs-body)/1.2 var(--font-sans)}.env-key{display:flex;gap:24px;font:var(--fs-label)/1.2 var(--font-sans);color:var(--muted)}
#envSvg{display:block;width:100%;height:126px;overflow:visible}.gridline{stroke:var(--line-soft);stroke-width:1}.envline{fill:none;stroke:var(--life);stroke-width:4}.fillForest{fill:rgba(36,91,99,.13)}.threshold{stroke:var(--focus);stroke-width:1;stroke-dasharray:5 5}.ticktext{font:13px var(--font-mono);fill:var(--muted)}.roundtext{font:13px var(--font-mono);fill:var(--text)}.cursor{stroke:var(--focus);stroke-width:3}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;flex:1;min-height:0}.strategy{border:1px solid var(--line);border-top:4px solid var(--text);padding:14px 16px 12px;display:flex;flex-direction:column;background:var(--surface);transition:border-color .18s}.strategy.is-current{border-top-color:var(--focus)}.strategy.is-failed{outline:3px solid var(--focus)}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.cardhead h2{font:700 var(--fs-h2)/1.2 var(--font-sans);margin:0}.desc{font:var(--fs-sec)/1.35 var(--font-sans);color:var(--muted);margin-top:4px}.score{text-align:right;white-space:nowrap}.score b{font:700 30px/1 var(--font-mono);color:var(--life)}.score span{font:var(--fs-label)/1 var(--font-sans);color:var(--muted)}
.spark{width:100%;height:210px;display:block;margin:10px 0}.spark .axis{stroke:var(--line-soft)}.spark .limit{stroke:var(--focus);stroke-dasharray:5 5}.spark .trace{fill:none;stroke:var(--life);stroke-width:3}.spark .pt{fill:var(--surface);stroke:var(--life);stroke-width:2}.spark .pt.bad{stroke:var(--focus);fill:var(--focus)}
.stats{margin-top:auto;border-top:1px solid var(--line-soft);padding-top:10px;display:grid;grid-template-columns:1.2fr 1fr 1.25fr;gap:8px}.stat span{display:block;font:var(--fs-label)/1.2 var(--font-sans);color:var(--muted)}.stat b{font:700 var(--fs-body)/1.4 var(--font-mono)}
footer{display:flex;align-items:center;gap:28px;border-top:1px solid var(--line-soft);padding-top:12px}.take{font:650 var(--fs-lead)/1.35 var(--font-sans);color:var(--life);flex:1}.next{font:var(--fs-sec)/1.35 var(--font-sans);max-width:520px}.next b{color:var(--focus)}
</style>
</head>
<body data-page="07" data-total="45">
<div id="stage">
<header><div><div class="kicker">HABITAT TEST</div><h1>环境反复摆动时，专精未必比切换更稳</h1></div><div class="model">教学模型：比较策略稳健性，不是历史栖息地重建。</div></header>
<div class="controls"><div class="ctl"><label for="amp">波动幅度</label><input id="amp" type="range" min="0" max="50" step="5" value="35"><output id="ampOut">35 个百分点</output></div><div class="btns"><button class="btn" id="run">运行 12 回合</button><button class="btn" id="reset">复位</button></div><div class="hint">拖动幅度观察环境带；运行后比较共同尺度上的最低表现。</div></div>
<main class="sim min0 k-comparison">
<section class="env env-boundary"><div class="env-head"><div class="env-title">同一条栖息地序列 · 森林比例 F</div><div class="env-key"><span>森林 F</span><span>开阔地 100−F</span><span>当前回合 <b id="round">未运行</b></span></div></div><svg id="envSvg" viewBox="0 0 1400 126" aria-label="十二回合森林比例序列"></svg></section>
<section class="cards stage-cards" id="cards"></section>
</main>
<footer><div class="take">森林与开阔地比例反复变化，使能切换食物和移动方式的策略更稳健。</div><div class="next"><b>下一问</b>　直立身体能否在开阔地的日照与散热压力下带来一点收益？</div></footer>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script>
<script>
Deck.init({index:7,total:45});
const D=[-.8,-.2,.5,.9,.3,-.6,-1,-.4,.4,.8,.1,0], threshold=25;
const defs=[['森林专精','固定食物与林内移动'],['开阔地专精','固定食物与地面移动'],['可切换','选择当回合较多的栖息地']];
const amp=document.getElementById('amp'), cards=document.getElementById('cards'), envSvg=document.getElementById('envSvg');let timer=null,current=-1;
defs.forEach((d,i)=>cards.insertAdjacentHTML('beforeend',`<article class="strategy" data-i="${i}"><div class="cardhead"><div><h2>${d[0]}</h2><div class="desc">${d[1]}</div></div><div class="score"><b>—</b><br><span>当回合 / 100</span></div></div><svg class="spark" viewBox="0 0 420 210" aria-label="${d[0]}十二回合得分"></svg><div class="stats"><div class="stat"><span>累计</span><b class="sum">—</b></div><div class="stat"><span>最低</span><b class="min">—</b></div><div class="stat"><span>脆弱回合 &lt;25</span><b class="fail">—</b></div></div></article>`));
function calc(){let A=+amp.value,F=D.map(d=>50+A*d),prev=null;let S=[[],[],[]];F.forEach(f=>{S[0].push(.9*f);S[1].push(.9*(100-f));let side=f>=50;S[2].push(.72*Math.max(f,100-f)-(prev!==null&&side!==prev?8:0));prev=side});return {F,S}}
function path(vals,w,h,pad){return vals.map((v,i)=>`${i?'L':'M'} ${pad+i*(w-2*pad)/11} ${h-pad-v*(h-2*pad)/100}`).join(' ')}
function draw(){const {F,S}=calc(),W=1400,H=126,p=18;document.getElementById('ampOut').textContent=amp.value+' 个百分点';let x=i=>p+i*(W-2*p)/11,y=v=>H-p-v*(H-2*p)/100;envSvg.innerHTML=`<path class="fillForest" d="${path(F,W,H,p)} L ${x(11)} ${y(0)} L ${x(0)} ${y(0)} Z"/><line class="gridline" x1="${p}" y1="${y(50)}" x2="${W-p}" y2="${y(50)}"/><path class="envline" d="${path(F,W,H,p)}"/>${F.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="var(--life)"/>${(i%2===0||i===11)?`<text class="roundtext" x="${x(i)}" y="121" text-anchor="middle">${i+1}</text>`:''}<text class="ticktext" x="${x(i)}" y="${Math.max(13,y(v)-9)}" text-anchor="middle">${v.toFixed(v%1?1:0)}%</text>`).join('')}${current>=0?`<line class="cursor" x1="${x(current)}" y1="3" x2="${x(current)}" y2="111"/>`:''}`;
 document.querySelectorAll('.strategy').forEach((c,i)=>{let svg=c.querySelector('.spark'),v=S[i],sx=j=>16+j*388/11,sy=n=>192-n*1.7;svg.innerHTML=`<line class="axis" x1="16" y1="192" x2="404" y2="192"/><line class="limit" x1="16" y1="${sy(25)}" x2="404" y2="${sy(25)}"/><text class="ticktext" x="18" y="${sy(25)-5}">脆弱阈值 25</text><path class="trace" d="${v.map((n,j)=>`${j?'L':'M'} ${sx(j)} ${sy(n)}`).join(' ')}"/>${v.map((n,j)=>`<circle class="pt ${n<threshold?'bad':''}" cx="${sx(j)}" cy="${sy(n)}" r="${j===current?7:4}"/>`).join('')}`;c.classList.toggle('is-current',current>=0);c.querySelector('.score b').textContent=current<0?'—':v[current].toFixed(1);c.querySelector('.sum').textContent=current<0?'—':v.slice(0,current+1).reduce((a,b)=>a+b,0).toFixed(1);c.querySelector('.min').textContent=current<0?'—':Math.min(...v.slice(0,current+1)).toFixed(1);c.querySelector('.fail').textContent=current<0?'—':v.slice(0,current+1).filter(n=>n<threshold).length+' / '+(current+1)});}
function stop(){if(timer){clearInterval(timer);timer=null}}
amp.addEventListener('input',()=>{stop();current=-1;document.getElementById('round').textContent='未运行';draw()});
document.getElementById('run').addEventListener('click',()=>{stop();current=0;step();timer=setInterval(()=>{current++;if(current>=12){current=11;stop()}step()},400)});
function step(){document.getElementById('round').textContent=(current+1)+' / 12';draw();document.querySelectorAll('.strategy').forEach((c,i)=>{let n=calc().S[i][current];if(n<threshold){c.classList.add('is-failed');setTimeout(()=>c.classList.remove('is-failed'),180)}})}
document.getElementById('reset').addEventListener('click',()=>{stop();amp.value=35;current=-1;document.getElementById('round').textContent='未运行';draw()});draw();
</script>
</body></html>
