<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:14px}.head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding-bottom:12px}.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.15em;color:var(--focus);margin-bottom:8px}.head h1{font-size:var(--fs-h1);line-height:1.18;margin:0;max-width:1120px}.progress-note{font-size:var(--fs-label);color:var(--muted);padding-bottom:4px}.main{flex:1;display:grid;grid-template-columns:520px 1fr;gap:32px;min-height:0}.evidence{display:flex;flex-direction:column;gap:10px;min-height:0}.photo{height:460px;border:1px solid var(--line);background:#e8e1d3;display:flex;align-items:center;justify-content:center;position:relative}.photo img{width:100%;height:100%;object-fit:contain}.photo-tag{font-size:var(--fs-label);font-family:var(--font-mono);border-left:4px solid var(--life);padding:9px 12px;background:var(--surface)}.cite{font-size:var(--fs-label);color:var(--muted)}.workspace{display:flex;flex-direction:column;gap:10px;min-height:0}.diagram{flex:1;min-height:0;border:1px solid var(--line-soft);background:var(--surface);position:relative;overflow:hidden}.diagram svg{width:100%;height:100%;display:block}.target{position:absolute;width:190px;min-height:48px;border:2px solid var(--line);background:var(--surface);font-size:var(--fs-label);font-weight:700;padding:8px 10px;text-align:left;cursor:pointer}.target:hover,.target:focus{border-color:var(--focus)}.target.active{border-color:var(--focus);box-shadow:inset 4px 0 var(--focus)}.target.done{border-color:var(--life);color:var(--life);cursor:pointer}.target small{display:block;font-size:var(--fs-tick);font-weight:500;color:var(--muted);margin-top:3px}.t-shoulder{left:24px;top:42px}.t-hand{left:24px;top:148px}.t-pelvis{right:24px;top:268px}.t-knee{right:24px;top:382px}.classify{position:absolute;right:22px;top:28px;width:205px;border-left:1px solid var(--line-soft);padding-left:16px}.classify strong{font-size:var(--fs-label)}.classify .btns{margin-top:8px;display:flex;flex-direction:column}.tray{border-top:1px solid var(--line-soft);padding-top:10px;display:flex;align-items:center;gap:10px;min-height:65px}.tray-label{font-size:var(--fs-label);color:var(--muted);margin-right:4px}.chip{font-size:var(--fs-label);font-weight:700;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:4px;cursor:pointer}.chip[aria-pressed=true]{border-color:var(--focus);background:#fff3ea;color:var(--focus)}.chip:disabled{opacity:.35;cursor:default}.feedback{min-height:31px;font-size:var(--fs-sec);color:var(--muted);display:flex;align-items:center}.feedback.good{color:var(--life);font-weight:700}.reset{margin-left:auto}.foot{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;border-top:1px solid var(--line-soft);padding-top:10px}.takeaway{font-size:var(--fs-lead);line-height:1.4;font-weight:700}.next{font-size:var(--fs-sec);line-height:1.45;color:var(--muted);border-left:3px solid var(--focus);padding-left:14px}
</style>
</head>
<body data-page="11" data-total="45">
<div id="stage">
  <header class="head">
    <div><div class="kicker">MOSAIC EVOLUTION</div><h1>同一副骨骼里，攀爬与双足行走的线索同时存在</h1></div>
    <div class="progress-note">4 个定位点 · 两类线索</div>
  </header>
  <main class="main min0">
    <section class="evidence min0" aria-label="标本证据">
      <div class="photo"><img src="assets/img/lucy-skeleton.jpg" alt="Lucy 骨骼标本陈列照片" title="（已存在）"></div>
      <div class="photo-tag">Lucy｜A.L. 288-1｜约 318 万年前｜阿法南方古猿</div>
      <div class="cite">证据短标：CMNH；Smithsonian　·　照片不代表精确身高复原</div>
    </section>
    <section class="workspace min0" aria-label="解剖定位与分类">
      <div class="diagram k-comparison" id="diagram">
        <svg viewBox="0 0 900 520" aria-label="中性人体轮廓及肩、手、骨盆、膝定位连线" role="img">
          <g fill="none" stroke="#777C79" stroke-width="4" class="body-outline">
            <circle cx="450" cy="70" r="34"/><path d="M450 104 L450 235 M390 135 L510 135 M390 135 L330 245 M510 135 L570 245 M415 230 Q450 260 485 230 M420 250 L390 395 L385 480 M480 250 L510 395 L515 480"/>
          </g>
          <g fill="none" stroke="#B9BCB8" stroke-width="2"><path d="M214 74 L390 135"/><path d="M214 180 L330 245"/><path d="M676 302 L470 238"/><path d="M676 416 L510 395"/></g>
          <g fill="#F4F0E6" stroke="#777C79" stroke-width="3"><circle cx="390" cy="135" r="9"/><circle cx="330" cy="245" r="9"/><circle cx="470" cy="238" r="9"/><circle cx="510" cy="395" r="9"/></g>
          <text x="450" y="505" text-anchor="middle" font-size="15" fill="#626764">同一轮廓 · 肩—手—骨盆—膝</text>
        </svg>
        <button class="target t-shoulder" data-target="shoulder">肩 <small>等待定位</small></button>
        <button class="target t-hand" data-target="hand">手 <small>等待定位</small></button>
        <button class="target t-pelvis" data-target="pelvis">骨盆 <small>等待定位</small></button>
        <button class="target t-knee" data-target="knee">股骨—膝 <small>等待定位</small></button>
        <div class="classify"><strong>② 再选证据类别</strong><div class="btns"><button class="btn" data-cat="climb">攀爬相关</button><button class="btn" data-cat="walk">双足相关</button></div></div>
      </div>
      <div class="tray" aria-label="标签托盘"><span class="tray-label">① 选择标签，再点身体位置</span>
        <button class="chip" data-id="shoulder" aria-pressed="false">肩</button><button class="chip" data-id="hand" aria-pressed="false">手</button><button class="chip" data-id="pelvis" aria-pressed="false">骨盆</button><button class="chip" data-id="knee" aria-pressed="false">股骨—膝</button>
        <button class="btn reset" id="reset">重新定位</button>
      </div>
      <div class="feedback" id="feedback" aria-live="polite">选择一个标签，定位后再判断它属于哪类线索。</div>
    </section>
  </main>
  <footer class="foot"><div class="takeaway">身体演化不是旧结构整套消失、新结构整套换上，而是不同部位以不同速度形成镶嵌。</div><div class="next">下一问｜骨骼只能提示“可能怎样动”；有没有证据直接记录一次行走？</div></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Deck.init({index:11,total:45});
const info={shoulder:{cat:'climb',text:'肩关节朝向利于举臂',limit:'支持保留上举与攀援能力；不给出攀爬频率'},hand:{cat:'climb',text:'弯曲指骨利于抓握',limit:'来自多件标本；不能单独复原具体动作'},pelvis:{cat:'walk',text:'短而宽的骨盆承接直立负荷',limit:'Lucy 保存的关键区域之一'},knee:{cat:'walk',text:'股骨向膝内收，使脚落在身体下方',limit:'支持经常性双足负重；不等于现代式步态'}};
let selected=null,placed=null,done=new Set();const fb=document.getElementById('feedback');
function say(t,good=false){fb.textContent=t;fb.className='feedback'+(good?' good':'')}
function select(id){if(done.has(id))return;selected=id;placed=null;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.id===id));document.querySelectorAll('.target').forEach(x=>x.classList.remove('active'));say('现在点选它连接的身体位置。')}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>select(b.dataset.id));
document.querySelectorAll('.target').forEach(b=>b.onclick=()=>{const id=b.dataset.target;if(done.has(id)){done.delete(id);document.querySelector('.chip[data-id="'+id+'"]').disabled=false;b.className='target t-'+(id==='knee'?'knee':id);b.innerHTML=(id==='knee'?'股骨—膝':id==='shoulder'?'肩':id==='hand'?'手':'骨盆')+' <small>等待定位</small>';select(id);say('已撤回。重新定位，再选择类别。');return}if(!selected){say('先从底部托盘选择一个标签。');return}if(selected!==id){selected=null;placed=null;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));say('先看它连接身体的哪一部分');return}placed=id;b.classList.add('active');say('位置对应。请选择“攀爬相关”或“双足相关”。')});
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{if(!placed){say('先选择标签，并点到对应的身体位置。');return}if(info[placed].cat!==b.dataset.cat){const t=document.querySelector('.target[data-target="'+placed+'"]');t.classList.remove('active');placed=null;selected=null;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));say('先看它连接身体的哪一部分');return}const id=placed,d=info[id],t=document.querySelector('.target[data-target="'+id+'"]');done.add(id);t.classList.remove('active');t.classList.add('done');t.innerHTML=d.text+'<small>'+(d.cat==='climb'?'攀爬相关':'双足相关')+'｜'+d.limit+'</small>';document.querySelector('.chip[data-id="'+id+'"]').disabled=true;selected=placed=null;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));if(done.size===4)say('不是二选一：这是一组并存的镶嵌特征。',true);else say('归位正确：'+d.limit,true)});
document.getElementById('reset').onclick=()=>location.reload();
</script>
</body>
</html>
