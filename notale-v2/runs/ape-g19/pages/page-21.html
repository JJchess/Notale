<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:12px}
header{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding-bottom:12px}
.kicker{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.16em;color:var(--muted);margin-bottom:9px}
h1{font-size:var(--fs-h1);line-height:1.15;margin:0;font-weight:700}
.readout{display:flex;align-items:baseline;gap:9px;color:var(--life);white-space:nowrap}.readout .big{font-size:52px;line-height:1;font-weight:700}.readout .unit{font-size:var(--fs-body)}
.controls{display:flex;align-items:center;gap:25px;padding:10px 14px;background:var(--surface);border:1px solid var(--line-soft);border-radius:4px}
.ctl{display:grid;grid-template-columns:auto 170px 46px;align-items:center;gap:10px;flex:1}.ctl label{font-size:var(--fs-label);font-weight:650}.ctl output{font:600 var(--fs-label)/1 var(--font-mono);text-align:right}.btns{white-space:nowrap}.btn{font-size:var(--fs-label)}
.main{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line-soft);border-radius:4px;background:var(--surface);overflow:hidden}
.meta{height:45px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line-soft)}
.legend{display:flex;gap:20px;align-items:center;font-size:var(--fs-label)}.li{display:flex;gap:7px;align-items:center}.dot{width:16px;height:16px;border:2px solid var(--line);border-radius:50%;display:inline-block}.dot.on{background:var(--life);border-color:var(--life)}.dot.new{background:var(--focus);border-color:var(--focus)}.dash{width:24px;border-top:2px dashed var(--line)}
.hint{font-size:var(--fs-label);color:var(--muted)}
#viz{width:100%;height:100%;display:block;min-height:0}.axis text,.chart-label{font-family:var(--font-sans);font-size:14px;fill:var(--muted)}.axis path,.axis line{stroke:var(--line-soft)}
.footer{display:grid;grid-template-columns:1fr 420px;gap:28px;align-items:center}.claim{font-size:var(--fs-lead);line-height:1.4;border-left:5px solid var(--life);padding-left:16px}.next{font-size:var(--fs-sec);line-height:1.4;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:9px}.note{font-size:var(--fs-label);color:var(--muted)}
</style>
</head>
<body data-page="21" data-total="45">
<div id="stage">
<header><div><div class="kicker">CULTURAL TRANSMISSION</div><h1>一项技能不必等身体改变，就能在人群中扩散</h1></div><div class="readout" aria-live="polite"><span>已掌握</span><span class="big" id="total">2</span><span class="unit">/ 48 人</span></div></header>
<section class="controls" aria-label="传播模型参数">
 <div class="ctl"><label for="starters">初始示范者</label><input id="starters" type="range" min="1" max="4" value="2"><output id="startersO">2 人</output></div>
 <div class="ctl"><label for="prob">模仿成功率</label><input id="prob" type="range" min="0" max="100" step="10" value="60"><output id="probO">60%</output></div>
 <div class="ctl"><label for="teachers">代际教师</label><input id="teachers" type="range" min="1" max="6" value="3"><output id="teachersO">3 人</output></div>
 <div class="btns"><button class="btn" id="step">推进一轮</button><button class="btn" id="auto">自动播放</button><button class="btn" id="reset">复位同一种子</button></div>
</section>
<section class="main canvas-full k-process min0">
 <div class="meta"><div class="legend"><span class="li"><i class="dot on"></i>已掌握技能</span><span class="li"><i class="dot"></i>尚未掌握</span><span class="li"><i class="dot new"></i>本轮新学会</span><span class="li"><i class="dash"></i>尝试未成功</span></div><div class="hint" id="status">第 0 轮 · 点击“推进一轮”观察同代模仿</div></div>
 <svg id="viz" role="img" aria-label="两代各24人的技能传播点阵、教学连接与累计曲线"></svg>
</section>
<div class="footer"><div class="claim">模仿让技能在同代横向扩散，教学又把它带给下一代；改变的是群体会做什么，而不是个体的遗传构成。</div><div><div class="note">教学模型：用于观察传播机制，不是史前人口估计</div><div class="next">下一问：身体调节、学习与遗传变化，各自使用什么样的时间单位？</div></div></div>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script><script src="assets/lib/d3.min.js"></script>
<script>
Deck.init({index:21,total:45});
const N=24, SEED=21021, phases=13;
let state, timer=null;
const svg=d3.select('#viz'), W=1486,H=500, x=d3.scaleLinear().domain([0,13]).range([185,1430]), yCount=d3.scaleLinear().domain([0,24]).range([465,330]);
svg.attr('viewBox',`0 0 ${W} ${H}`);
function rng(seed){let s=seed>>>0;return()=>((s=Math.imul(1664525,s)+1013904223>>>0)/4294967296)}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function reset(){stop();const n=+starters.value;state={phase:0,g1:Array.from({length:N},(_,i)=>i<n),g2:Array(N).fill(false),new1:[],new2:[],links:[],hist:[{p:0,a:n,b:0}],r:rng(SEED)};render(false)}
function pairs(group,eligible,target,kind){const masters=shuffle(group.map((v,i)=>v&&eligible(i)?i:null).filter(v=>v!==null),state.r), learners=shuffle(group.map((v,i)=>!v?i:null).filter(v=>v!==null),state.r);const k=Math.min(masters.length,learners.length);let fresh=[];for(let i=0;i<k;i++){const ok=state.r()<+prob.value/100;state.links.push({kind,from:masters[i],to:learners[i],ok});if(ok){target[learners[i]]=true;fresh.push(learners[i])}}return fresh}
function advance(){if(state.phase>=phases){stop();return}state.phase++;state.links=[];state.new1=[];state.new2=[];
 if(state.phase<=6){state.new1=pairs(state.g1,()=>true,state.g1,'g1')}
 else if(state.phase===7){const ms=state.g1.map((v,i)=>v?i:null).filter(v=>v!==null).slice(0,+teachers.value), ls=Array.from({length:Math.min(ms.length,N)},(_,i)=>i);ms.forEach((m,i)=>{const ok=state.r()<+prob.value/100;state.links.push({kind:'bridge',from:m,to:ls[i],ok});if(ok){state.g2[ls[i]]=true;state.new2.push(ls[i])}})}
 else {state.new2=pairs(state.g2,()=>true,state.g2,'g2')}
 state.hist.push({p:state.phase,a:state.g1.filter(Boolean).length,b:state.g2.filter(Boolean).length});render(true)}
function pos(i,row){return{x:205+(i%12)*94,y:(row===1?82:202)+Math.floor(i/12)*45}}
function render(anim){const life=getComputedStyle(document.documentElement).getPropertyValue('--life').trim(),focus=getComputedStyle(document.documentElement).getPropertyValue('--focus').trim(),line=getComputedStyle(document.documentElement).getPropertyValue('--line').trim(),soft=getComputedStyle(document.documentElement).getPropertyValue('--line-soft').trim();svg.selectAll('*').remove();
 svg.append('defs').append('marker').attr('id','arrow').attr('viewBox','0 -5 10 10').attr('refX',8).attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto').append('path').attr('d','M0,-5L10,0L0,5').attr('fill',line);
 svg.append('text').attr('class','chart-label').attr('x',22).attr('y',91).style('font-weight',700).text('第一代 · 24 人');svg.append('text').attr('class','chart-label').attr('x',22).attr('y',211).style('font-weight',700).text('第二代 · 24 人');
 const links=svg.append('g').selectAll('line').data(state.links).join('line').attr('x1',d=>pos(d.from,d.kind==='g2'?2:1).x).attr('y1',d=>pos(d.from,d.kind==='g2'?2:1).y+10).attr('x2',d=>pos(d.to,d.kind==='g1'?1:2).x).attr('y2',d=>pos(d.to,d.kind==='g1'?1:2).y-10).attr('stroke',d=>d.ok?life:line).attr('stroke-width',2).attr('stroke-dasharray',d=>d.ok?null:'7 5').attr('marker-end','url(#arrow)').attr('opacity',anim?0:0.7);if(anim)links.transition().duration(350).attr('opacity',.7);
 [1,2].forEach(row=>{const group=row===1?state.g1:state.g2,fresh=row===1?state.new1:state.new2;svg.append('g').selectAll('circle').data(group.map((on,i)=>({on,i,fresh:fresh.includes(i)}))).join('circle').attr('cx',d=>pos(d.i,row).x).attr('cy',d=>pos(d.i,row).y).attr('r',10).attr('stroke',d=>d.on?(d.fresh?focus:life):line).attr('stroke-width',2).attr('fill',d=>d.on?(d.fresh?focus:life):'none').each(function(d){if(anim&&d.fresh)d3.select(this).transition().delay(470).duration(450).attr('fill',life).attr('stroke',life)})});
 const gx=svg.append('g').attr('class','axis').attr('transform','translate(0,470)').call(d3.axisBottom(x).tickValues(d3.range(14)).tickFormat(d=>d===0?'开始':d===7?'代际教学':d<7?`第${d}轮`:`第${d-7}轮`));gx.selectAll('text').attr('font-size',14);svg.append('g').attr('class','axis').attr('transform','translate(170,0)').call(d3.axisLeft(yCount).tickValues([0,6,12,18,24]));
 [ ['a','第一代',life],['b','第二代',line] ].forEach(([key,label,color],j)=>{const ln=d3.line().x(d=>x(d.p)).y(d=>yCount(d[key]));svg.append('path').datum(state.hist).attr('d',ln).attr('fill','none').attr('stroke',color).attr('stroke-width',3);svg.append('text').attr('class','chart-label').attr('x',22).attr('y',350+j*25).attr('fill',color).text(label+'累计')});
 total.textContent=state.g1.filter(Boolean).length+state.g2.filter(Boolean).length;status.textContent=state.phase===0?'第 0 轮 · 点击“推进一轮”观察同代模仿':state.phase<7?`第一代 · 第 ${state.phase}/6 轮接触`:state.phase===7?'代际教学桥 · 每名教师尝试一次':state.phase<13?`第二代 · 第 ${state.phase-7}/6 轮接触`:'模拟结束 · 可调参数后重试';}
function stop(){if(timer){clearTimeout(timer);timer=null}auto.textContent='自动播放'}function play(){if(timer){stop();return}auto.textContent='暂停';const go=()=>{if(state.phase>=phases){stop();return}advance();timer=setTimeout(go,state.phase===7?1600:900)};go()}
[starters,prob,teachers].forEach(el=>el.addEventListener('input',()=>{startersO.textContent=starters.value+' 人';probO.textContent=prob.value+'%';teachersO.textContent=teachers.value+' 人';reset()}));step.onclick=()=>{stop();advance()};auto.onclick=play;reset.onclick=reset;reset();
</script>
</body></html>
