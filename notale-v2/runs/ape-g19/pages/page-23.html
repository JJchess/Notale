  <style>
    .p23-kicker{font-family:var(--font-serif);font-size:var(--fs-label);letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
    .p23-title{font-size:var(--fs-h1);line-height:1.18;margin:0;font-weight:700;letter-spacing:.01em}
    .p23-head{height:84px;flex:none;border-bottom:1px solid var(--line-soft)}
    .p23-main{flex:1;display:flex;flex-direction:column;min-height:0;padding-top:22px}

    .p23-figure svg{display:block;width:100%;height:100%;overflow:visible}
    .p23-label{font-family:var(--font-sans);font-size:16px;fill:var(--text)}
    .p23-label-strong{font-family:var(--font-sans);font-size:18px;font-weight:700;fill:var(--text)}

    .p23-link{fill:none;stroke:var(--text);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .p23-body{fill:var(--surface);stroke:var(--text);stroke-width:3;stroke-linejoin:round}
    .p23-loop{fill:rgba(36,91,99,.055);stroke:var(--life);stroke-width:7}
    .p23-foot{height:126px;flex:none;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:48px}
    .p23-take{font-size:var(--fs-lead);line-height:1.45;font-weight:650;flex:1;position:relative;padding-left:22px}
    .p23-take:before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:5px;background:var(--focus)}
    .p23-next{width:520px;font-size:var(--fs-sec);line-height:1.45;color:var(--muted);padding-left:28px;border-left:1px solid var(--line-soft)}
    .p23-next b{display:block;font-size:var(--fs-label);letter-spacing:.08em;color:var(--text);margin-bottom:5px}

          <path d="M39 111 Q68 92 97 111 L112 237 L91 237 L88 337 L50 337 L47 237 L24 237 Z" class="p23-body"/>
          <path d="M42 126 L3 229 M94 126 L133 229" class="p23-link" stroke-width="9"/>
