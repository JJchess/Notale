<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{position:relative;isolation:isolate;overflow:hidden;background:#172124;color:var(--text)}
#stage::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(12,20,24,.64) 0%,rgba(18,28,30,.36) 54%,rgba(244,240,230,.12) 100%)}
#stage>.orbit-photo{position:absolute!important;z-index:-2;inset:20px;width:calc(100% - 40px);height:calc(100% - 40px);object-fit:cover;object-position:center 66%;filter:saturate(.68) contrast(.86) brightness(.78)}
.side{display:block;margin-bottom:7px;font:500 var(--fs-label)/1 var(--font-sans);letter-spacing:.08em;color:rgba(244,240,230,.58);text-decoration:none}
.topline{display:flex;align-items:center;gap:18px;flex:0 0 auto;color:#f4f0e6}
.kicker{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.18em;border-left:4px solid var(--focus);padding-left:12px}
.hairline{height:1px;flex:1;background:rgba(244,240,230,.38)}
.focus.k-generalization{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;flex:1;min-height:0;color:#f4f0e6;padding-top:52px}
.claim{text-align:center;max-width:1160px;opacity:0;transform:translateY(-8px);transition:opacity .28s ease .66s,transform .28s ease .66s}
.claim h1{margin:0;font:600 var(--fs-h1)/1.25 var(--font-sans);letter-spacing:.02em;text-wrap:balance;text-shadow:0 2px 16px rgba(0,0,0,.42)}
.claim p{margin:18px auto 0;max-width:1040px;font:400 var(--fs-lead)/1.5 var(--font-sans);color:rgba(244,240,230,.88)}
.diagram{position:absolute;left:40px;right:40px;bottom:92px;height:390px}
.habitable-field{position:absolute;left:1%;right:1%;bottom:-146px;height:390px;border-radius:50% 50% 0 0/42% 42% 0 0;background:rgba(36,91,99,.72);border-top:1px solid rgba(244,240,230,.28)}
.field-note{position:absolute;left:50%;top:250px;transform:translateX(-50%);font:500 var(--fs-sec)/1.4 var(--font-sans);letter-spacing:.04em;color:rgba(244,240,230,.9);white-space:nowrap}
.trunk{position:absolute;left:1%;right:1%;bottom:0;height:230px;border-top:4px solid var(--life);border-radius:50% 50% 0 0/62% 62% 0 0;transform:scaleX(0);transform-origin:left center;transition:transform .5s ease}
.trunk::before{content:"地球环境默认提供";position:absolute;left:50%;top:39px;transform:translateX(-50%);font:600 var(--fs-label)/1 var(--font-sans);letter-spacing:.08em;color:#f4f0e6;background:rgba(20,36,38,.72);border:1px solid rgba(244,240,230,.35);padding:9px 14px;border-radius:4px;white-space:nowrap}
.supports{position:absolute;left:4%;right:4%;top:42px;display:grid;grid-template-columns:repeat(4,1fr);gap:42px}
.support{position:relative;text-align:center;opacity:1;transform:translateY(0);transition:transform .35s ease,opacity .35s ease;color:#f4f0e6}
.support:nth-child(1){transition-delay:.18s}.support:nth-child(2){transition-delay:.25s}.support:nth-child(3){transition-delay:.32s}.support:nth-child(4){transition-delay:.39s}
.support::after{content:"↗";display:block;margin-top:14px;font:400 28px/1 var(--font-sans);color:rgba(244,240,230,.55);text-decoration:none}
.default{display:block;font:600 var(--fs-h2)/1.25 var(--font-sans);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--focus)}
.exit{display:block;margin-top:10px;font:400 var(--fs-sec)/1.4 var(--font-sans);color:rgba(244,240,230,.78)}
.is-ready .trunk{transform:scaleX(1)}
.is-ready .support{transform:translateY(-12px);opacity:.68}
.is-ready .claim{opacity:1;transform:translateY(0)}
.footer{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:40px;flex:0 0 auto;color:#f4f0e6}
.next{max-width:920px;border-left:3px solid var(--focus);padding-left:16px;font:500 var(--fs-body)/1.45 var(--font-sans)}
.source{font:400 var(--fs-label)/1.35 var(--font-sans);color:rgba(244,240,230,.72);text-align:right}
@media (prefers-reduced-motion:reduce){.claim,.trunk,.support{transition:none!important}}
</style>
</head>
<body data-page="28" data-total="45">
<div id="stage">
  <img class="orbit-photo" src="assets/img/iss-earth-limb.jpg" alt="从轨道望向地球弧面与深空" title="（已存在）">
  <header class="topline"><span class="kicker">EARTH / ORBIT</span><span class="hairline"></span></header>
  <main class="focus k-generalization min0" aria-labelledby="title">
    <section class="claim">
      <h1 id="title">跨过地球弧面，人体的默认环境不再存在</h1>
      <p>空气、外界压力、对流散热与正常重力负荷不再由环境自动提供。</p>
    </section>
    <section class="diagram" aria-label="四个地球默认条件作为一组同时退出">
      <div class="habitable-field"><span class="field-note">这些不是附加功能，而是身体一直借用的地球条件</span></div>
      <div class="trunk"></div>
      <div class="supports">
        <div class="support"><span class="side">地球默认</span><span class="default">可呼吸空气</span><span class="side">轨道环境</span><span class="exit">不再可直接取得</span></div>
        <div class="support"><span class="side">地球默认</span><span class="default">持续外界压力</span><span class="side">轨道环境</span><span class="exit">不再由环境维持</span></div>
        <div class="support"><span class="side">地球默认</span><span class="default">空气对流散热</span><span class="side">轨道环境</span><span class="exit">这条散热路径消失</span></div>
        <div class="support"><span class="side">地球默认</span><span class="default">正常重力负荷</span><span class="side">轨道环境</span><span class="exit">不再持续作用于身体</span></div>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="next">当第一道边界是“没有可呼吸的大气”，压力究竟如何随高度退场？</div>
    <div class="source">轨道视角 · 地球弧面</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Deck.init({index:28,total:45});
requestAnimationFrame(function(){document.getElementById('stage').classList.add('is-ready')});
</script>
</body>
</html>
