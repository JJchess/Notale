<!doctype html>

<body data-page="31" data-total="45">
<div id="stage">
<style>
  #stage{position:relative;overflow:hidden;background:var(--bg);color:var(--text)}
  .head{height:104px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding-bottom:18px}
  .kicker{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.16em;color:var(--focus);margin-bottom:10px}
  h1{font:600 var(--fs-h1)/1.15 var(--font-sans);margin:0}
  .head-note{max-width:430px;font:var(--fs-sec)/1.45 var(--font-sans);color:var(--muted);text-align:right}
  .plate{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:18px}
  .timeline{position:relative;flex:1;min-height:0;border:1px solid var(--line-soft);background:rgba(251,249,243,.58);border-radius:4px}
  svg{display:block;width:100%;height:100%}
  .wire{fill:none;stroke:var(--line);stroke-width:1.5;vector-effect:non-scaling-stroke}
  .soft{stroke:var(--line-soft)} .dash{stroke-dasharray:7 7}
  .life{stroke:var(--life)} .focusline{stroke:var(--focus)}
  .svg-label{font:22px var(--font-sans);fill:var(--muted)}
  .svg-body{font:27px var(--font-sans);fill:var(--text)}
  .svg-small{font:20px var(--font-mono);fill:var(--muted)}
  .svg-strong{font:600 27px var(--font-sans);fill:var(--text)}
  .range{fill:rgba(36,91,99,.12);stroke:var(--life);stroke-width:1}
  .risk{fill:rgba(216,91,53,.10);stroke:var(--focus);stroke-width:1}
  #cursor{stroke:var(--focus);stroke-width:2}
  #cursorDot{fill:var(--focus)}
  #bodyShape{transform-box:fill-box;transform-origin:center;transition:transform .12s linear}
  #lungs{fill:none;stroke:var(--life);stroke-width:2;transition:stroke .12s}
  #lungs.hold{stroke:var(--focus);stroke-width:4}
  #env{transition:opacity .35s,transform .35s;transform-box:fill-box;transform-origin:center}
  .controls{height:96px;display:grid;grid-template-columns:190px 1fr 360px;gap:22px;align-items:center;border-bottom:1px solid var(--line-soft)}
  .readout{display:flex;align-items:baseline;gap:8px}.readout .num{font-size:34px;color:var(--focus)}
  .ctl label{font:var(--fs-label)/1.2 var(--font-sans)}
  .actions{display:flex;gap:10px;justify-content:flex-end}.btn{min-width:104px}
  #holdBtn[aria-pressed="true"]{border-color:var(--focus);color:var(--focus);background:rgba(216,91,53,.08)}
  .footer{height:102px;display:grid;grid-template-columns:1fr 410px;gap:42px;align-items:center}
  .takeaway{font:600 var(--fs-lead)/1.42 var(--font-sans);padding-left:17px;border-left:4px solid var(--life)}
  .next{font:var(--fs-sec)/1.45 var(--font-sans);color:var(--muted)}
  .source{margin-top:10px;text-align:right;font:13px/1.2 var(--font-mono);color:var(--muted)}
</style>
<header class="head">
  <div><div class="kicker">RAPID DEPRESSURIZATION</div><h1>失压后，先夺走行动能力的是缺氧</h1></div>
  <div class="head-note">同一秒轴锁定环境、意识与身体反应。范围带表示个体差异，而非精确倒计时。</div>
</header>
<main class="plate min0 k-process">
  <section class="timeline min0" aria-label="快速失压后零至三十秒的医学时间线">
  <svg viewBox="0 0 1486 520" role="img" aria-labelledby="tlTitle tlDesc">
   <title id="tlTitle">真空暴露后的三十秒</title><desc id="tlDesc">环境压力在零秒骤降，肺内气体膨胀，有效意识通常在十至十五秒内丧失，随后严重损伤风险上升。</desc>
   <g id="env"><rect x="584" y="70" width="318" height="255" rx="145" class="wire life env-boundary"/><text x="743" y="55" text-anchor="middle" class="svg-label">环境压力边界</text></g>
   <g id="bodyShape" class="body-outline">
    <circle cx="743" cy="116" r="30" class="wire"/><path d="M710 151 Q743 136 776 151 L790 247 Q771 268 763 315 L723 315 Q715 268 696 247Z" class="wire"/>
    <path d="M703 168 L653 248 M783 168 L833 248 M728 314 L704 382 M758 314 L782 382" class="wire"/>
    <path id="lungs" d="M739 174 C716 158 706 184 711 221 C716 244 735 228 739 212 M747 174 C770 158 780 184 775 221 C770 244 751 228 747 212"/>
    <g id="arrows" opacity="0"><path d="M709 196 H676 l9 -8 M676 196 l9 8 M777 196 H810 l-9 -8 M810 196 l-9 8" class="wire focusline"/></g>
   </g>
   <path d="M584 100 H465 V71 H260" class="wire soft"/><text x="74" y="65" class="svg-strong">0 s · 环境压力骤降</text><text x="74" y="88" class="svg-label">外部压力边界迅速退去，计时开始</text>
   <path d="M704 198 H510 V254 H260" class="wire soft"/><text x="74" y="247" class="svg-strong">0–5 s · 肺内气体膨胀</text><text x="74" y="272" class="svg-label">保持气道开放并呼气</text><text x="74" y="296" class="svg-label" fill="#D85B35">不要屏气</text>
   <path d="M790 248 H972 V180 H1190" class="wire soft"/><text x="1202" y="174" class="svg-strong">数秒内 · 软组织可能膨胀</text><text x="1202" y="199" class="svg-label">暴露液体可能发生低压沸腾</text><text x="1202" y="223" class="svg-label">不会瞬间爆炸</text>
   <line x1="74" y1="430" x2="1412" y2="430" class="wire axis"/>
   <rect x="520" y="397" width="223" height="20" class="range"/><text x="631" y="388" text-anchor="middle" class="svg-label">有效意识通常丧失 · 约 10–15 s</text>
   <rect x="743" y="445" width="669" height="22" class="risk"/><text x="1077" y="492" text-anchor="middle" class="svg-label">15–30 s · 缺氧继续加深，严重损伤风险迅速上升（不标确定死亡时刻）</text>
   <g id="ticks"></g>
   <line id="cursor" x1="74" y1="375" x2="74" y2="470"/><circle id="cursorDot" cx="74" cy="430" r="6"/>
   <text id="cursorText" x="74" y="358" text-anchor="middle" class="svg-small">0.0 s</text>
   <path d="M520 407 H430 V350 H260" class="wire soft dash"/><text x="74" y="344" class="svg-label">有效意识＝还能理解并完成自救动作</text>
  </svg>
  </section>
  <section class="controls">
   <div class="readout"><span class="num" id="readout">0.0</span><span class="unit">s</span></div>
   <div class="ctl"><label for="time">真空暴露时间</label><input id="time" type="range" min="0" max="30" step="0.1" value="0" aria-valuetext="0.0 秒"><div class="hint">拖动游标，比较同一时刻的环境、意识与身体反应。</div></div>
   <div class="actions"><button class="btn" id="play">播放</button><button class="btn" id="reset">重新开始</button><button class="btn" id="holdBtn" aria-pressed="false">按住：屏气</button></div>
  </section>
</main>
<footer class="footer"><div class="takeaway">人体不会在真空中瞬间爆炸；有效意识通常只剩约 10–15 秒，屏气反而增加肺损伤风险。</div><div class="next">下一问：没有空气带走热量后，真空究竟让人变冷还是变热？<div class="source">NASA SP-3006；NASA HIDH · 10–15 s 为典型量级，受初始肺气量、供氧状态与个体差异影响</div></div></footer>
<script>
window.addEventListener('DOMContentLoaded',()=>{
 const slider=document.getElementById('time'), read=document.getElementById('readout'), cur=document.getElementById('cursor'), dot=document.getElementById('cursorDot'), ctext=document.getElementById('cursorText');
 const env=document.getElementById('env'), arrows=document.getElementById('arrows'), body=document.getElementById('bodyShape'), lungs=document.getElementById('lungs'), play=document.getElementById('play'), reset=document.getElementById('reset'), hold=document.getElementById('holdBtn');
 const x=t=>74+(1412-74)*t/30;
 const ticks=document.getElementById('ticks');
 [0,5,10,15,20,30].forEach(t=>{const X=x(t);ticks.insertAdjacentHTML('beforeend',`<line x1="${X}" y1="424" x2="${X}" y2="438" class="wire"/><text x="${X}" y="458" text-anchor="middle" class="svg-small">${t}</text>`)});
 function render(){const t=+slider.value,X=x(t), scale=1+Math.min(t/30*.03,.03);read.textContent=t.toFixed(1);slider.setAttribute('aria-valuetext',t.toFixed(1)+' 秒');cur.setAttribute('x1',X);cur.setAttribute('x2',X);dot.setAttribute('cx',X);ctext.setAttribute('x',X);ctext.textContent=t.toFixed(1)+' s';env.style.opacity=t===0?'1':'0.18';env.style.transform=t===0?'scale(1)':'scale(1.12)';arrows.setAttribute('opacity',t>=.1?'1':'0');body.style.transform=`scale(${scale})`;}
 slider.addEventListener('input',()=>{stop();render()});
 let raf=0,last=0;function frame(ts){if(!last)last=ts;let t=+slider.value+(ts-last)/1000;last=ts;if(t>=30){t=30;stop()}slider.value=t;render();if(t<30)raf=requestAnimationFrame(frame)}
 function stop(){if(raf)cancelAnimationFrame(raf);raf=0;last=0;play.textContent='播放'}
 play.addEventListener('click',()=>{if(raf){stop();return}if(+slider.value>=30)slider.value=0;play.textContent='暂停';raf=requestAnimationFrame(frame)});
 reset.addEventListener('click',()=>{stop();slider.value=0;render()});
 function setHold(on){hold.setAttribute('aria-pressed',String(on));lungs.classList.toggle('hold',on);hold.textContent=on?'肺损伤风险增加':'按住：屏气'}
 ['pointerdown','keydown'].forEach(ev=>hold.addEventListener(ev,e=>{if(ev==='keydown'&&![' ','Enter'].includes(e.key))return;e.preventDefault();setHold(true)}));
 ['pointerup','pointercancel','pointerleave','keyup','blur'].forEach(ev=>hold.addEventListener(ev,()=>setHold(false)));
 render(); Deck.init({index:31,total:45});
});
</script>
