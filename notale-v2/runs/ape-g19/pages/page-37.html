<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding-bottom:14px}
.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.13em;color:var(--focus)}
h1{font:700 var(--fs-h1)/1.2 var(--font-sans);margin:8px 0 0;max-width:1050px}
.source{font:var(--fs-label)/1.3 var(--font-mono);color:var(--muted)}
main{flex:1;display:grid;grid-template-columns:510px 1fr;gap:32px;min-height:0}
.evidence{display:flex;flex-direction:column;gap:10px;min-height:0}
.photo{position:relative;flex:1;min-height:0;background:#d7d5d0;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:contain;display:block}
.photo .call{position:absolute;left:20px;top:22px;width:210px;padding:10px 12px;background:rgba(251,249,243,.94);border-left:4px solid var(--focus);font:var(--fs-label)/1.4 var(--font-sans)}
.joint{position:absolute;border:3px solid var(--text);border-radius:50%;width:58px;height:38px;transition:.15s;transform:rotate(-18deg)}
.joint.elbow{left:57%;top:37%}.joint.knee{left:44%;top:64%;transform:rotate(12deg);opacity:.7}
.photo.high .joint{border-width:7px;border-radius:42%;transform:rotate(-5deg)}
.photo.high .joint.knee{transform:rotate(4deg)}
.boundary{position:absolute;inset:16px;border:2px solid var(--line);pointer-events:none}
.evcap{display:flex;justify-content:space-between;gap:15px;font:var(--fs-label)/1.35 var(--font-sans);color:var(--muted)}
.instrument{display:flex;flex-direction:column;min-height:0;gap:12px}
.readbar{display:flex;align-items:center;justify-content:space-between;padding:13px 17px;border:1px solid var(--line);background:var(--surface);border-radius:4px}
.readbar label{font:700 var(--fs-body)/1.3 var(--font-sans)}
.readout{font:700 30px/1 var(--font-mono);color:var(--focus);cursor:pointer}.readout small{font-size:var(--fs-label);color:var(--text)}
#chart{width:100%;flex:1;min-height:360px;border:1px solid var(--line-soft);background:var(--surface);border-radius:4px}
.chart-title{font:700 18px var(--font-sans);fill:var(--text)}.chart-note{font:15px var(--font-sans);fill:var(--muted)}.axistext{font:14px var(--font-mono);fill:var(--muted)}
.curve{fill:none;stroke:var(--life);stroke-width:5}.guide{stroke:var(--line-soft);stroke-width:1}.cursor{stroke:var(--focus);stroke-width:3}.dot{fill:var(--focus);stroke:var(--surface);stroke-width:4}.ref{stroke:var(--text);stroke-width:2;stroke-dasharray:5 5}
.control{padding:12px 16px 14px;border:1px solid var(--line);border-radius:4px}.ctlrow{display:flex;align-items:center;gap:16px}.ctlrow input{flex:1}.btn{white-space:nowrap}.status{display:flex;justify-content:space-between;margin-top:8px;font:var(--fs-label)/1.35 var(--font-sans)}.status strong{color:var(--focus)}
.mechanism{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:11px 16px;border-left:5px solid var(--focus);background:var(--surface);font:var(--fs-sec)/1.4 var(--font-sans)}
.mechanism .qual{color:var(--muted);max-width:370px;text-align:right}
footer{display:grid;grid-template-columns:1.35fr 1fr;gap:32px;border-top:1px solid var(--line-soft);padding-top:12px;font:var(--fs-sec)/1.4 var(--font-sans)}
.takeaway{font-weight:700}.next{color:var(--muted)}
</style>
</head>
<body data-page="37" data-total="45">
<div id="stage">
<header><div><div class="kicker">EVA · TRADE-OFF</div><h1>压力更高，身体更有保障；航天服却更难弯曲</h1></div><div class="source">NASA EMU</div></header>
<main class="split-lr">
<section class="evidence min0" aria-label="EMU 航天服证据">
<div class="photo cvbox" id="photo"><img src="assets/img/emu-spacesuit.jpg" alt="完整的 EMU 航天服与生命支持背包" title="（已存在）"><div class="boundary env-boundary"></div><div class="joint elbow body-outline"></div><div class="joint knee body-outline"></div><div class="call">压差使软结构趋向鼓起<br><strong>肘、膝关节必须逆着结构阻力弯曲</strong></div></div>
<div class="evcap"><span>关节轮廓：肘 / 膝</span><span>照片保留整套航天服与背包</span></div>
</section>
<section class="instrument k-comparison min0" aria-label="共轴压力权衡图">
<div class="readbar"><label for="pressure">航天服内部工作压力</label><div class="readout" id="readout" title="双击恢复参考值">29.6 <small>kPa</small></div></div>
<svg id="chart" viewBox="0 0 900 420" role="img" aria-label="生理支持随压力上升，关节易弯曲性随压力下降，共用压力轴">
<line class="guide" x1="105" y1="62" x2="105" y2="354"/><line class="guide" x1="105" y1="354" x2="850" y2="354"/><line class="guide" x1="105" y1="205" x2="850" y2="205"/>
<text class="chart-title" x="24" y="45">生理支持</text><text class="chart-note" x="24" y="69">较高</text><text class="chart-note" x="24" y="180">较低</text>
<text class="chart-title" x="24" y="233">关节易弯曲</text><text class="chart-note" x="24" y="260">较高</text><text class="chart-note" x="24" y="344">较低</text>
<path class="curve" d="M105 177 C315 161 590 95 850 62"/><path class="curve" d="M105 250 C325 268 590 325 850 343"/>
<line class="ref" x1="391.1" y1="50" x2="391.1" y2="354"/><text class="chart-note" x="402" y="76">EMU 工作压力参考值</text>
<line class="cursor" id="cursor" x1="391.1" y1="48" x2="391.1" y2="354"/><circle class="dot" id="dot1" r="9"/><circle class="dot" id="dot2" r="9"/>
<text class="axistext" x="96" y="384">20</text><text class="axistext" x="378" y="384">29.6</text><text class="axistext" x="835" y="384">45 kPa</text><text class="chart-note" x="105" y="410">同一压力变量，同时驱动两项相反结果</text>
</svg>
<div class="control"><div class="ctlrow"><span class="hint">拖动服内压力</span><input id="pressure" type="range" min="20" max="45" step="0.1" value="29.6" aria-label="服内压力，千帕"><button class="btn" id="reset" type="button">回到 EMU 参考</button></div><div class="status"><span>20.0 kPa</span><strong id="state">参考附近：生理支持与活动能力折中</strong><span>45.0 kPa</span></div></div>
<div class="mechanism"><span><strong>更大压差</strong> → 服装结构更趋向撑直 → 弯曲需克服更大阻力</span><span class="qual">关系示意；不是航天服认证曲线，也不存在本页唯一正确压力</span></div>
</section>
</main>
<footer><div class="takeaway">航天服不是把压力调到最高，而是在生理支持与活动能力之间寻找任务可接受的折中。</div><div class="next">下一问｜能弯得动还不够：一次出舱最先耗尽的资源会是什么？</div></footer>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script>
<script>
Deck.init({index:37,total:45});
const slider=document.getElementById('pressure'), readout=document.getElementById('readout'), cursor=document.getElementById('cursor'), d1=document.getElementById('dot1'), d2=document.getElementById('dot2'), state=document.getElementById('state'), photo=document.getElementById('photo');
function update(){const v=Number(slider.value),t=(v-20)/25,x=105+745*t,y1=177-115*Math.pow(t,.78),y2=250+93*Math.pow(t,.82);readout.innerHTML=v.toFixed(1)+' <small>kPa</small>';cursor.setAttribute('x1',x);cursor.setAttribute('x2',x);d1.setAttribute('cx',x);d1.setAttribute('cy',y1);d2.setAttribute('cx',x);d2.setAttribute('cy',y2);photo.classList.toggle('high',v>29.6);state.textContent=v>30?'生理余量增加 / 弯曲阻力增加':v<29.2?'生理余量减少 / 较易活动':'参考附近：生理支持与活动能力折中'}
slider.addEventListener('input',update);function reset(){slider.value='29.6';update()}document.getElementById('reset').addEventListener('click',reset);readout.addEventListener('dblclick',reset);update();
</script>
</body></html>
