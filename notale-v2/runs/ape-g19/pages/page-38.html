<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="38" data-total="45">
<div id="stage">
<style>
#stage{gap:16px}
.p38-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding-bottom:14px}
.p38-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.14em;color:var(--focus);margin-bottom:9px}
.p38-head h1{font-size:var(--fs-h1);line-height:1.18;margin:0;font-weight:720}
.p38-head .lead{max-width:610px;margin:0 0 2px 30px}
.p38-main{flex:1;display:grid;grid-template-columns:3fr 9fr;gap:22px;min-height:0}
.p38-control{display:flex;flex-direction:column;gap:16px;padding:20px;background:#dedbd2}
.p38-control h2,.p38-ledger h2{font-size:var(--fs-h2);margin:0}
.p38-control .ctl{gap:10px}
.p38-load{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.p38-load .btn[aria-pressed=true]{background:var(--text);color:#fff;border-color:var(--text)}
.p38-duration{display:flex;align-items:baseline;justify-content:space-between}
.p38-duration output{font:700 34px/1 var(--font-mono);color:var(--focus)}
.p38-duration output small{font-size:var(--fs-label);color:var(--muted);font-weight:500}
.p38-control input{width:100%}
.p38-budget{margin-top:auto;border-top:1px solid var(--line-soft);padding-top:15px}
.p38-budget .cap{font-size:var(--fs-label);color:var(--muted)}
.p38-budget .limit{font:700 24px/1.35 var(--font-mono);margin-top:5px;color:var(--life)}
.p38-budget .who{font-size:var(--fs-body);margin-top:5px}
.p38-ledger{display:flex;flex-direction:column;gap:10px;min-height:0}
.p38-ledger-top{display:flex;align-items:end;justify-content:space-between}
.p38-note{font-size:var(--fs-label);color:var(--muted)}
.p38-scale{display:grid;grid-template-columns:150px 160px 180px 1fr 140px;gap:12px;align-items:end;padding:0 14px}
.p38-scale .ticks{display:flex;justify-content:space-between;font:var(--fs-tick)/1 var(--font-mono);color:var(--muted)}
.p38-rows{display:flex;flex-direction:column;gap:9px;min-height:0;flex:1;position:relative}
.shared-grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.resource{position:relative;z-index:1}
.resource{display:grid;grid-template-columns:150px 160px 180px 1fr 140px;gap:12px;align-items:center;padding:13px 14px;border:1px solid var(--line-soft);border-radius:4px;background:#d8d6cf;flex:1;min-height:0}
.resource.is-limiting{border:2px solid var(--focus);padding:12px 13px}
.res-name{display:flex;flex-direction:column;gap:5px;font-size:var(--fs-body);font-weight:700}
.res-name .tag{align-self:flex-start;font-weight:500}
.metric{font-size:var(--fs-label);color:var(--muted)}
.metric strong{display:block;font:700 var(--fs-body)/1.35 var(--font-mono);color:var(--text);margin-top:2px}
.barbox{position:relative;height:76px;border:1px solid var(--line);background:linear-gradient(to right,transparent 24.8%,var(--line-soft) 25%,transparent 25.2%,transparent 49.8%,var(--line-soft) 50%,transparent 50.2%,transparent 74.8%,var(--line-soft) 75%,transparent 75.2%)}
.remain{height:100%;background:var(--life);min-width:0}
.over{position:absolute;left:100%;top:-1px;height:76px;background:var(--focus);max-width:42px}
.short{position:absolute;right:6px;top:27px;font:700 var(--fs-label)/1.2 var(--font-mono);color:var(--focus);white-space:nowrap;background:var(--surface);padding-left:4px}
.resource.is-depleted .barbox{margin-right:45px}
.support{text-align:right}
.basis{grid-column:1/-1;border-top:1px solid var(--line-soft);padding-top:8px;font-size:var(--fs-sec);line-height:1.35;color:var(--muted);display:flex;justify-content:space-between}
.basis strong{font-family:var(--font-mono);color:var(--text)}
.p38-foot{display:grid;grid-template-columns:1fr 1fr;gap:22px;border-top:1px solid var(--line-soft);padding-top:12px}
.p38-take{font-size:var(--fs-body);line-height:1.45;font-weight:650}
.p38-next{font-size:var(--fs-sec);line-height:1.45;color:var(--muted)}
.p38-next b{color:var(--text)}
</style>
<header class="p38-head">
  <div><div class="p38-kicker">EVA / CONSUMABLES</div><h1>舱外时限由最先见底的资源决定</h1></div>
  <p class="lead">把四项资源放上同一条时间基线：任务预算不是“总量相加”，而是寻找最短的那一项。</p>
</header>
<main class="p38-main ledger">
  <aside class="panel p38-control min0" aria-label="任务控制">
    <h2>舱外任务预算</h2>
    <div class="ctl"><label>任务负荷</label><div class="p38-load" role="group" aria-label="任务负荷">
      <button class="btn" data-load="light" aria-pressed="false">轻</button><button class="btn" data-load="medium" aria-pressed="true">中</button><button class="btn" data-load="heavy" aria-pressed="false">重</button>
    </div></div>
    <div class="ctl"><div class="p38-duration"><label for="hours">计划时长</label><output id="hoursOut">6.0 <small>h</small></output></div><input id="hours" type="range" min="1" max="8" step="0.5" value="6"></div>
    <p class="hint">切换负荷或拖动时长，比较哪项最先越过零余量。</p>
    <button id="reset" class="btn">复位：中负荷 / 6 h</button>
    <div class="p38-budget">
      <div class="cap">四项时限共同嵌套于任务预算</div>
      <div class="limit" id="limitTime">任务上限 06 h 40 min</div>
      <div class="who">限制项：<strong id="limiter">冷却水</strong></div>
    </div>
  </aside>
  <section class="p38-ledger min0 k-classification" aria-label="四项消耗品共享尺度账册">
    <div class="p38-ledger-top"><h2>供给资源 / 废物容量</h2><span class="p38-note">教学任务包：用于比较瓶颈，不代表某一型号航天服的任务设计值。</span></div>
    <div class="p38-scale" aria-hidden="true"><span>账目</span><span>容量</span><span>消耗率</span><div class="ticks"><span>剩余 0%</span><span>50%</span><span>100%</span></div><span style="text-align:right">可支持</span></div>
    <div id="rows" class="p38-rows"><svg class="shared-grid" viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true"><path d="M0 1H1000 M0 125H1000 M0 250H1000 M0 375H1000 M0 499H1000 M150 0V500 M310 0V500 M490 0V500 M705 0V500 M860 0V500" fill="none" stroke="#777C79" stroke-width="1"/></svg></div>
  </section>
</main>
<footer class="p38-foot"><div class="p38-take">氧气、电力、冷却水和二氧化碳容量必须同行；任何一项先耗尽，任务就必须结束。</div><div class="p38-next"><b>下一问</b>　氧气尚有剩余时，呼出的二氧化碳为什么仍会迫使人撤回？</div></footer>
<script>
window.addEventListener('load',function(){
  const items=[
    {type:'供给',name:'氧气',cap:.80,unit:'kg',rates:{light:.06,medium:.10,heavy:.16}},
    {type:'供给',name:'电力',cap:1.20,unit:'kWh',rates:{light:.16,medium:.15,heavy:.20}},
    {type:'供给',name:'冷却水',cap:4.00,unit:'kg',rates:{light:.30,medium:.60,heavy:.85}},
    {type:'废物容量',name:'可容纳二氧化碳',cap:.90,unit:'kg',rates:{light:.06,medium:.10,heavy:.20}}
  ];
  let load='medium'; const range=document.getElementById('hours'), rows=document.getElementById('rows');
  function clock(h){const mins=Math.round(h*60), hh=Math.floor(mins/60), mm=mins%60;return String(hh).padStart(2,'0')+' h '+String(mm).padStart(2,'0')+' min'}
  function draw(){
    const planned=Number(range.value), times=items.map(x=>x.cap/x.rates[load]), min=Math.min(...times), li=times.indexOf(min);
    document.getElementById('hoursOut').innerHTML=planned.toFixed(1)+' <small>h</small>';
    document.getElementById('limitTime').textContent='任务上限 '+clock(min);
    document.getElementById('limiter').textContent=items[li].name;
    rows.innerHTML='<svg class="shared-grid" viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true"><path d="M0 1H1000 M0 125H1000 M0 250H1000 M0 375H1000 M0 499H1000 M150 0V500 M310 0V500 M490 0V500 M705 0V500 M860 0V500" fill="none" stroke="#777C79" stroke-width="1"/></svg>'+items.map((x,i)=>{const rate=x.rates[load], rem=(x.cap-rate*planned)/x.cap, depleted=rem<0, shortage=Math.max(0,(planned-times[i])*60);return `<div class="resource tech-module ${i===li?'is-limiting':''} ${depleted?'is-depleted':''}">
      <div class="res-name"><span>${x.name}</span><span class="tag">${x.type}</span></div>
      <div class="metric">容量<strong>${x.cap.toFixed(2)} ${x.unit}</strong></div>
      <div class="metric">消耗率<strong>${rate.toFixed(2)} ${x.unit}/h</strong></div>
      <div class="barbox"><div class="remain life-loop" style="width:${Math.max(0,Math.min(1,rem))*100}%"></div>${depleted?`<div class="over" style="width:${Math.min(42,Math.abs(rem)*42)}px"></div><span class="short">不足 ${Math.round(shortage)} min</span>`:''}</div>
      <div class="metric support">可支持<strong>${times[i].toFixed(2)} h</strong></div>
      <div class="basis">按计划使用 ${(rate*planned).toFixed(2)} ${x.unit}　｜　期末剩余 ${(rem*100).toFixed(0)}%　｜　${i===li?'这项决定总任务上限':'不能补偿其他项目的缺口'}</div></div>`}).join('');
  }
  document.querySelectorAll('[data-load]').forEach(b=>b.addEventListener('click',()=>{load=b.dataset.load;document.querySelectorAll('[data-load]').forEach(q=>q.setAttribute('aria-pressed',q===b));draw()}));
  range.addEventListener('input',draw);document.getElementById('reset').addEventListener('click',()=>{load='medium';range.value=6;document.querySelectorAll('[data-load]').forEach(q=>q.setAttribute('aria-pressed',q.dataset.load==='medium'));draw()});
  draw(); Deck.init({index:38,total:45});
});
</script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
