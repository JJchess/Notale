<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:12px;overflow:hidden}
.head{display:flex;align-items:flex-end;justify-content:space-between;height:76px;border-bottom:1px solid var(--line-soft);padding-bottom:12px}
.kicker{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.16em;color:var(--life);margin-bottom:8px}
h1{font:700 var(--fs-h1)/1.15 var(--font-sans);margin:0;max-width:1050px}
.head-note{font:var(--fs-label)/1.4 var(--font-sans);color:var(--muted);text-align:right;width:285px}
.toolbar{height:42px;display:flex;align-items:center;gap:10px}.toolbar .hint{margin-left:auto}
.btn[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}
.diagram{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:4px;background:rgba(251,249,243,.76);overflow:hidden}
.diagram:before{content:"SYSTEM FLOW / 共用设备拓扑";position:absolute;left:18px;top:14px;font:var(--fs-label)/1 var(--font-mono);color:var(--muted);z-index:2}
#flow{width:100%;height:100%;display:block}.flow{fill:none;stroke:var(--line);stroke-width:2;opacity:.42;transition:opacity .25s}.flow.active{stroke:var(--focus);stroke-width:3;opacity:1}.flow.loop.active{stroke:var(--life)}
.module rect{fill:var(--surface);stroke:var(--text);stroke-width:1.5}.module text{font:600 16px var(--font-sans);fill:var(--text)}.module .sub{font:15px var(--font-sans);fill:var(--muted)}
.module{cursor:pointer;outline:none}.module.dim{opacity:.34}.module.hot rect{stroke:var(--focus);stroke-width:3}.module.hot.loopmod rect{stroke:var(--life)}
.human path,.human circle{fill:none;stroke:var(--text);stroke-width:3}.human text{font:700 18px var(--font-sans);fill:var(--text)}
.sensor rect{fill:var(--bg);stroke:var(--line);stroke-width:1}.sensor text{font:600 15px var(--font-mono);fill:var(--text)}.sensor .watch{fill:var(--focus)}.sensor.dim{opacity:.3}
.outlabel{font:15px var(--font-sans);fill:var(--muted)}
.note-strip{position:absolute;right:16px;top:13px;padding:7px 10px;border-left:3px solid var(--life);background:var(--surface);font:var(--fs-label)/1.35 var(--font-sans);z-index:2}
.bottom{height:145px;display:grid;grid-template-columns:270px 1fr 270px;gap:18px;align-items:stretch}
.evidence{position:relative;margin:0;border:1px solid var(--line);overflow:hidden;border-radius:4px;background:var(--surface)}.evidence img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(30%);opacity:.86}.evidence figcaption{position:absolute;left:0;right:0;bottom:0;padding:7px 10px;background:rgba(244,240,230,.93);font:var(--fs-label)/1.3 var(--font-sans)}
.takeaway{display:flex;flex-direction:column;justify-content:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 22px}.takeaway strong{font:700 var(--fs-lead)/1.4 var(--font-sans);color:var(--life)}.next{font:var(--fs-sec)/1.4 var(--font-sans);margin-top:8px;color:var(--muted)}
</style>
</head>
<body data-page="41" data-total="45">
<div id="stage">
  <header class="head">
    <div><div class="kicker">LIFE SUPPORT LOOP</div><h1>活下去，靠的是相连并受监测的生命支持回路</h1></div>
    <div class="head-note">工程展板 · 追踪一条流，或点击设备查看它同时承接哪些流</div>
  </header>
  <nav class="toolbar" aria-label="追踪生命支持流">
    <button class="btn" data-mode="all" aria-pressed="true">全部</button><button class="btn" data-mode="oxygen" aria-pressed="false">氧气</button><button class="btn" data-mode="water" aria-pressed="false">水</button><button class="btn" data-mode="co2" aria-pressed="false">CO₂</button><button class="btn" data-mode="heat" aria-pressed="false">热量</button>
    <span class="hint">选择流线，或点击任一设备</span>
  </nav>
  <main class="diagram min0 k-process" aria-label="生命支持系统流程图">
    <div class="note-strip">“闭环”不等于零补给：物质只能部分回收，废热必须离开舱体。</div>
    <svg id="flow" viewBox="0 0 1486 490" role="img" aria-label="人体与氧气、水、二氧化碳、热量处理设备相连的有向流程图"></svg>
  </main>
  <section class="bottom">
    <figure class="evidence"><img src="assets/img/iss-interior.jpg" title="国际空间站舱内密集管线与设备环境" alt="国际空间站舱内密集管线与设备"><figcaption>实物证据窗｜舱内管线把分散设备连成系统</figcaption></figure>
    <div class="takeaway"><strong>氧、水、二氧化碳与热量彼此耦合；改变一条流，也会改变其他设备的负荷。</strong><div class="next">下一问｜当维持生命依赖同一组传感器、能源与管路，新的脆弱点会出现在哪里？</div></div>
    <figure class="evidence"><img src="assets/img/iss-life-support-rack.jpg" title="国际空间站生命支持设备机架正面" alt="国际空间站生命支持设备机架"><figcaption>真实设备常藏在机架中，功能由管路与控制连接</figcaption></figure>
  </section>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
Deck.init({index:41,total:45});
const svg=d3.select('#flow');
const defs=svg.append('defs');
defs.append('marker').attr('id','arrow').attr('viewBox','0 -5 10 10').attr('refX',9).attr('refY',0).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto').append('path').attr('d','M0,-5L10,0L0,5').attr('fill','context-stroke');
const nodes=[
{id:'oxygen',x:80,y:92,w:220,h:68,label:'氧气生成 / 储存',sub:'补给 · 电解制氧',flows:['oxygen','water']},
{id:'air',x:415,y:92,w:220,h:68,label:'舱内空气管理',sub:'混合 · 循环 · 调压',flows:['oxygen','co2','water']},
{id:'co2',x:80,y:310,w:220,h:68,label:'CO₂ 去除装置',sub:'储存 · 处理或排出',flows:['co2']},
{id:'water',x:1000,y:310,w:220,h:68,label:'水回收与处理',sub:'饮用 · 卫生 · 部分制氧',flows:['water','oxygen']},
{id:'cool',x:1000,y:92,w:220,h:68,label:'舱内冷却回路',sub:'收集人体与设备热量',flows:['heat']},
{id:'radiator',x:1270,y:202,w:175,h:68,label:'舱外散热器',sub:'辐射排向太空',flows:['heat']}
];
const paths=[
{id:'o1',flow:'oxygen',loop:true,d:'M300 126H415'}, {id:'o2',flow:'oxygen',loop:true,d:'M635 126H690V218H725'},
{id:'c1',flow:'co2',d:'M725 270H650V344H300'}, {id:'c2',flow:'co2',d:'M300 344H80'},
{id:'w1',flow:'water',loop:true,d:'M760 270V344H1000'}, {id:'w2',flow:'water',loop:true,d:'M1110 310V250H875V218H795'}, {id:'w3',flow:'water',loop:true,d:'M1110 310V185H190V160'},
{id:'h1',flow:'heat',d:'M795 235H900V126H1000'}, {id:'h2',flow:'heat',d:'M1220 126H1300V202'}, {id:'h3',flow:'heat',d:'M1445 236H1478'}
];
svg.append('g').selectAll('path').data(paths).join('path').attr('class',d=>'flow '+(d.loop?'loop':'')).attr('data-flow',d=>d.flow).attr('d',d=>d.d).attr('marker-end','url(#arrow)');
const human=svg.append('g').attr('class','human').attr('transform','translate(760,240)');human.append('circle').attr('cy',-45).attr('r',18);human.append('path').attr('d','M0,-27V30M-38,-5H38M0,30L-30,76M0,30L30,76');human.append('text').attr('text-anchor','middle').attr('y',104).text('人体 / 乘员');
const ng=svg.append('g').selectAll('g').data(nodes).join('g').attr('class',d=>'module '+(d.flows.some(f=>['oxygen','water'].includes(f))?'loopmod':'')).attr('data-id',d=>d.id).attr('tabindex',0).attr('role','button').attr('aria-label',d=>d.label+'，点击查看经过此设备的流').attr('transform',d=>`translate(${d.x},${d.y})`);
ng.append('rect').attr('width',d=>d.w).attr('height',d=>d.h).attr('rx',3);ng.append('text').attr('x',14).attr('y',27).text(d=>d.label);ng.append('text').attr('class','sub').attr('x',14).attr('y',51).text(d=>d.sub);
const sensors=[{x:345,y:108,t:'O₂ · 舱压',f:'oxygen'},{x:525,y:315,t:'CO₂',f:'co2'},{x:865,y:327,t:'湿度 · 水质',f:'water'},{x:900,y:108,t:'温度 · 冷却液流量',f:'heat'}];
const sg=svg.append('g').selectAll('g').data(sensors).join('g').attr('class','sensor').attr('data-flow',d=>d.f).attr('transform',d=>`translate(${d.x},${d.y})`);sg.append('rect').attr('width',d=>d.t.length*15+25).attr('height',30).attr('rx',3);sg.append('text').attr('x',9).attr('y',20).text(d=>d.t);sg.append('text').attr('class','watch').attr('x',0).attr('y',48).text('监测').style('opacity',0);
svg.append('text').attr('class','outlabel').attr('x',1325).attr('y',300).text('废热离开舱体 → 太空');
function activate(flows,source){
 const all=flows.includes('all');
 d3.selectAll('.btn').attr('aria-pressed',function(){return this.dataset.mode===source?'true':'false'});
 svg.selectAll('.flow').interrupt().classed('active',d=>all||flows.includes(d.flow)).each(function(d){if(all)return;const L=this.getTotalLength();d3.select(this).attr('stroke-dasharray',L+' '+L).attr('stroke-dashoffset',L).transition().duration(700).ease(d3.easeLinear).attr('stroke-dashoffset',0).on('end',function(){d3.select(this).attr('stroke-dasharray',null)});});
 svg.selectAll('.module').classed('dim',d=>!all&&!d.flows.some(f=>flows.includes(f))).classed('hot',d=>!all&&d.flows.some(f=>flows.includes(f)));
 svg.selectAll('.sensor').classed('dim',d=>!all&&!flows.includes(d.f)).select('.watch').style('opacity',d=>!all&&flows.includes(d.f)?1:0);
}
d3.selectAll('.btn').on('click',function(){activate([this.dataset.mode],this.dataset.mode)});
ng.on('click keydown',function(e,d){if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ')return;e.preventDefault();activate(d.flows,'');});
activate(['all'],'all');
</script>
</body>
</html>
