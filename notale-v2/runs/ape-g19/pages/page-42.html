<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:0;position:relative}
.head{height:92px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding-bottom:14px}
.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.15em;color:var(--focus);margin:3px 0 10px}
h1{font:700 var(--fs-h1)/1.18 var(--font-sans);margin:0;max-width:1040px}
.context{font:var(--fs-sec)/1.35 var(--font-sans);color:var(--muted);max-width:330px;margin:19px 0 0;text-align:right}
.main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;padding-top:14px}
.rootrow{height:130px;display:grid;grid-template-columns:1fr 270px;gap:24px;position:relative;z-index:2}
.root{border:2px solid var(--text);background:var(--surface);padding:17px 22px;display:flex;flex-direction:column;justify-content:center;position:relative;border-radius:4px}
.root .eyebrow{font:700 var(--fs-label)/1 var(--font-mono);color:var(--muted);margin-bottom:9px}
.root strong{font:700 var(--fs-h2)/1.3 var(--font-sans)}
.final-order{font:700 var(--fs-body)/1.35 var(--font-sans);color:var(--life);margin-top:9px;display:none}
.final-order.show{display:block}
.evidence{margin:0;border:1px solid var(--line);overflow:hidden;position:relative;border-radius:4px;background:var(--surface)}
.evidence img{width:100%;height:100%;object-fit:cover;object-position:center 44%;display:block;filter:saturate(.78)}
.evidence figcaption{position:absolute;left:7px;bottom:6px;background:rgba(244,240,230,.9);padding:3px 7px;font:var(--fs-label)/1.2 var(--font-sans)}
.treezone{height:400px;position:relative;margin-top:8px}
.routes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.route{fill:none;stroke:var(--line);stroke-width:2;vector-effect:non-scaling-stroke}
.route.active{stroke:var(--life);stroke-width:5;stroke-dasharray:700;animation:trace .26s ease-out both}
@keyframes trace{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
.record{position:relative;z-index:2;width:810px;margin:0 auto 14px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--focus);padding:12px 18px;border-radius:4px;animation:arrive .18s ease-out}
@keyframes arrive{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.recordtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.round{font:700 var(--fs-label)/1 var(--font-mono);color:var(--focus);letter-spacing:.08em}
.disclaimer{font:var(--fs-label)/1 var(--font-sans);color:var(--muted)}
.logs{display:flex;gap:10px;flex-wrap:wrap}
.log{font:var(--fs-sec)/1.35 var(--font-sans);padding-right:12px;border-right:1px solid var(--line-soft)}
.log:last-child{border:0}
.stage-cards{position:relative;z-index:2;display:flex;gap:22px;margin-top:42px}
.fault{flex:1;min-width:0;padding:0;text-align:left;color:var(--text);background:var(--surface);border:2px solid var(--line);border-radius:4px;cursor:pointer;font-family:var(--font-sans);transition:border-color .12s,background .12s}
.fault:hover{border-color:var(--text)}.fault:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.fault.is-active,.fault.is-correct{border-color:var(--life);background:rgba(36,91,99,.055)}
.fault.is-wrong{border-color:var(--focus);animation:flash .32s ease-out 1}
@keyframes flash{50%{box-shadow:0 0 0 3px rgba(216,91,53,.2)}}
.fault h2{margin:0;padding:12px 16px;border-bottom:1px solid var(--line-soft);font:700 var(--fs-h2)/1.2 var(--font-sans)}
.lv{padding:9px 16px 10px;position:relative;min-height:57px}
.lv+.lv{border-top:1px solid var(--line-soft)}
.bt{font:700 var(--fs-label)/1.2 var(--font-mono);color:var(--muted);display:block;margin-bottom:4px}
.lv span:last-child{font:var(--fs-sec)/1.35 var(--font-sans)}
.feedbackbar{height:72px;display:flex;align-items:center;gap:18px;border-top:1px solid var(--line-soft);position:relative;z-index:3}
.feedback{flex:1;font:700 var(--fs-body)/1.35 var(--font-sans);color:var(--text)}
.feedback.good{color:var(--life)}.feedback.bad{color:var(--focus)}
.btn{min-width:116px}.btn[hidden]{display:none}
.foot{height:76px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 470px;gap:36px;align-items:center}
.takeaway{font:700 var(--fs-body)/1.38 var(--font-sans)}
.next{font:var(--fs-sec)/1.4 var(--font-sans);color:var(--muted);text-align:right}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body data-page="42" data-total="45">
<div id="stage">
  <header class="head">
    <div><div class="kicker">FAULT TREE</div><h1>技术救你，也把新的脆弱点接入生命线</h1></div>
    <p class="context">同样是“多个模块异常”，原因可能位于信息、供能，或冗余共同依赖的基础。</p>
  </header>
  <main class="main min0 k-classification">
    <section class="rootrow">
      <div class="root"><span class="eyebrow">根节点 · 总异常</span><strong>生命支持异常：先判断“读错、断能，还是一起失效？”</strong><div id="order" class="final-order">诊断顺序：核验信息 → 追查共同供能 → 检查冗余是否真正独立</div></div>
      <figure class="evidence"><img src="assets/img/iss-life-support-rack.jpg" title="国际空间站生命支持系统机架" alt="机架、线缆与控制面板组成的生命支持设备"><figcaption>设备证据 · 机架与控制面板</figcaption></figure>
    </section>
    <section class="treezone">
      <svg class="routes" viewBox="0 0 1488 400" aria-hidden="true" preserveAspectRatio="none">
        <path id="line0" class="route" d="M609 0 V198 H238 V228"/><path id="line1" class="route" d="M609 0 V198 H744 V228"/><path id="line2" class="route" d="M609 0 V198 H1250 V228"/>
      </svg>
      <div id="record" class="record" aria-live="polite"></div>
      <div class="stage-cards">
        <button class="fault" data-kind="0"><h2>传感器误报</h2><div class="lv"><span class="bt">线索</span><span>单一读数越界；同类读数与实际回路不支持</span></div><div class="lv"><span class="bt">故障层</span><span>信息</span></div><div class="lv"><span class="bt">影响范围</span><span>报警与控制判断可能错误；物理回路未必失效</span></div></button>
        <button class="fault" data-kind="1"><h2>能源中断</h2><div class="lv"><span class="bt">线索</span><span>依赖同一电源的多个功能同时停止</span></div><div class="lv"><span class="bt">故障层</span><span>供能</span></div><div class="lv"><span class="bt">影响范围</span><span>跨越空气、水与热量支路</span></div></button>
        <button class="fault" data-kind="2"><h2>共因失效</h2><div class="lv"><span class="bt">线索</span><span>主、备支路同时异常，并共享条件</span></div><div class="lv"><span class="bt">故障层</span><span>冗余基础</span></div><div class="lv"><span class="bt">影响范围</span><span>冗余被同一个原因穿透</span></div></button>
      </div>
    </section>
    <div class="feedbackbar"><div id="feedback" class="feedback">先读监测记录，再选择最能解释全部线索的故障层。</div><button id="next" class="btn" hidden>下一轮</button><button id="reset" class="btn" hidden>重新诊断</button></div>
  </main>
  <footer class="foot"><div class="takeaway">冗余只能抵抗独立故障；错误信息、能源中断与共因失效必须分开诊断。</div><div class="next">下一问｜如果故障无法完全避免，能否用旋转环境减轻人体长期负担？</div></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Deck.init({index:42,total:45});
const rounds=[
 {logs:['压力传感器 A：超限','压力传感器 B：正常','阀位与舱内状态稳定'],answer:0,fb:'先交叉核验；不要让单一坏读数直接接管控制。'},
 {logs:['氧循环、水循环、热控泵在同一时刻停止','主电源母线掉电'],answer:1,fb:'多个支路同时沉默，应向上追查共同供能节点。'},
 {logs:['主、备二氧化碳处理支路同时失效','两者位于同一受损舱段'],answer:2,fb:'有备份不等于独立；共享条件会一次击穿两条支路。'}
];
let round=0,locked=false;
const cards=[...document.querySelectorAll('.fault')],record=document.getElementById('record'),feedback=document.getElementById('feedback'),next=document.getElementById('next'),reset=document.getElementById('reset'),order=document.getElementById('order');
function render(){locked=false;cards.forEach(c=>c.classList.remove('is-active','is-correct','is-wrong'));document.querySelectorAll('.route').forEach(x=>x.classList.remove('active'));const r=rounds[round];record.innerHTML=`<div class="recordtop"><span class="round">监测记录 ${round+1} / 3</span><span class="disclaimer">教学情境，并非真实事故复盘</span></div><div class="logs">${r.logs.map(x=>`<span class="log">${x}</span>`).join('')}</div>`;feedback.className='feedback';feedback.textContent='先读监测记录，再选择最能解释全部线索的故障层。';next.hidden=true;reset.hidden=true;}
cards.forEach(c=>c.addEventListener('click',()=>{if(locked)return;cards.forEach(x=>x.classList.remove('is-wrong'));const pick=+c.dataset.kind,r=rounds[round];if(pick===r.answer){locked=true;c.classList.add('is-active','is-correct');document.getElementById('line'+pick).classList.add('active');feedback.className='feedback good';feedback.textContent=r.fb;if(round<2)next.hidden=false;else{reset.hidden=false;order.classList.add('show');}}else{c.classList.add('is-wrong');feedback.className='feedback bad';feedback.textContent='这条解释不了全部线索：检查独立读数、共同能源或共享条件。';}}));
next.addEventListener('click',()=>{round++;render()});reset.addEventListener('click',()=>{round=0;order.classList.remove('show');render()});render();
</script>
</body>
</html>
