<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F4F0E6;--text:#202522;--focus:#D85B35;--life:#245B63;--muted:#626764;--line:#777C79;--line-soft:#B9BCB8;--surface:#FBF9F3;--font-sans:"Noto Sans SC",system-ui,sans-serif}
#stage{gap:14px}.top{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding-bottom:13px}.kicker{font:600 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.16em;color:var(--focus);margin-bottom:8px}h1{font-size:var(--fs-h1);line-height:1.16;margin:0;font-weight:700}.formula{text-align:right;font:600 26px/1.2 var(--font-mono);color:var(--life)}.formula small{display:block;font:400 var(--fs-label)/1.4 var(--font-sans);color:var(--muted);margin-top:6px}.targetbar{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border:1px solid var(--line);background:var(--surface);border-radius:4px}.targetbar strong{font-size:var(--fs-body)}.targetbar .hint{margin:0}.seg{display:flex;gap:5px}.seg button{min-width:120px}.seg button[aria-pressed=true]{background:var(--life);color:var(--surface);border-color:var(--life)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:30px;position:relative;flex:1}.compare:after{content:"目标重力基线";position:absolute;left:0;right:0;top:321px;border-top:2px dashed var(--life);color:var(--life);font-size:var(--fs-label);text-align:center;padding-top:4px;pointer-events:none}.bay{display:grid;grid-template-columns:310px 1fr;gap:18px;border-top:3px solid var(--text);padding-top:10px;min-height:0}.visual{display:flex;flex-direction:column;min-width:0}.hdr{font-size:var(--fs-h2);font-weight:700;display:flex;justify-content:space-between;align-items:center}.hdr span{font-size:var(--fs-label);font-weight:500;color:var(--muted)}svg{width:310px;height:310px;display:block;overflow:visible}.scale{font-size:13px;fill:var(--muted);font-family:var(--font-mono)}.ring{fill:none;stroke:var(--life);stroke-width:5}.radius{stroke:var(--line);stroke-width:2}.person{fill:var(--focus)}.arrow{fill:none;stroke:var(--text);stroke-width:2}.metrics{display:flex;flex-direction:column;min-width:0}.rowline{display:grid;grid-template-columns:112px 1fr;align-items:baseline;border-bottom:1px solid var(--line-soft);padding:8px 0;min-height:49px}.dim{font-size:var(--fs-sec);color:var(--muted)}.val{font:600 21px/1.2 var(--font-mono);text-align:right}.diff{color:var(--focus)}.risk{font-size:var(--fs-sec);line-height:1.4;padding:10px 0}.controls{margin-top:auto;display:grid;gap:8px}.ctl{display:grid;grid-template-columns:76px 1fr 76px;gap:8px;align-items:center}.ctl label{font-size:var(--fs-label)}.ctl output{font:600 var(--fs-label)/1 var(--font-mono);text-align:right}.actions{display:flex;gap:8px;margin-top:3px}.actions .btn{flex:1}.foot{display:grid;grid-template-columns:1fr 1.15fr;gap:28px;align-items:center;border-top:1px solid var(--line);padding-top:12px}.take{font-size:var(--fs-lead);line-height:1.4;font-weight:600}.next{font-size:var(--fs-sec);line-height:1.4;border-left:4px solid var(--focus);padding-left:16px}.next b{color:var(--focus)}
</style>
</head>
<body data-page="43" data-total="45">
<div id="stage">
  <header class="top"><div><div class="kicker">ARTIFICIAL GRAVITY</div><h1>同样造出 1g，小旋转舱必须转得更快</h1></div><div class="formula">a = ω²R<small>向心加速度由半径与转速共同决定</small></div></header>
  <section class="targetbar" aria-label="共享目标重力"><strong>共享目标：<span id="targetRead">1g = 9.81 m/s²</span></strong><div class="seg"><button class="btn" id="mars" aria-pressed="false">火星 0.38g</button><button class="btn" id="earth" aria-pressed="true">地球 1g</button></div><p class="hint">调半径或转速；再用“匹配目标”比较所需转速。</p></section>
  <main class="compare min0" id="compare">
    <section class="bay min0" data-side="left"><div class="visual"><div class="hdr">大半径方案 <span>共享尺度 0–100 m</span></div><svg viewBox="0 0 310 310" role="img" aria-label="大半径旋转舱剖面"><line x1="20" y1="290" x2="290" y2="290" stroke="var(--line)"/><text x="20" y="307" class="scale">0</text><text x="258" y="307" class="scale">100 m</text><circle class="ring" cx="155" cy="150" r="125"/><line class="radius" x1="155" y1="150" x2="280" y2="150"/><path class="arrow" d="M115 38 A120 120 0 0 1 194 38 l-9 -7 m9 7 l-6 10"/><circle class="person" cx="280" cy="150" r="8"/></svg></div><div class="metrics"></div></section>
    <section class="bay min0" data-side="right"><div class="visual"><div class="hdr">小半径方案 <span>同一半径比例尺</span></div><svg viewBox="0 0 310 310" role="img" aria-label="小半径旋转舱剖面"><line x1="20" y1="290" x2="290" y2="290" stroke="var(--line)"/><text x="20" y="307" class="scale">0</text><text x="258" y="307" class="scale">100 m</text><circle class="ring" cx="155" cy="150" r="13"/><line class="radius" x1="155" y1="150" x2="168" y2="150"/><path class="arrow" d="M115 38 A120 120 0 0 1 194 38 l-9 -7 m9 7 l-6 10"/><circle class="person" cx="168" cy="150" r="8"/></svg></div><div class="metrics"></div></section>
  </main>
  <footer class="foot"><div class="take">半径 100 m 时约需 3.0 rpm；缩到 10 m 时约需 9.5 rpm，较高转速会加重眩晕与定向障碍风险。</div><div class="next"><b>下一问</b>　当压力、热量、辐射、质量和故障风险同时加入，单项可行的方案还能成立吗？</div></footer>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script>
<script>
Deck.init({index:43,total:45});
const G=9.80665; let targetG=1;
const state={left:{r:100,n:3},right:{r:10,n:9.5}};
function acceleration(r,n){const o=Lec.P.artificialGravity(r,n);if(typeof o==='number')return o;for(const k of ['accelerationMPerS2','acceleration','centripetalAccelerationMPerS2','artificialGravityMPerS2'])if(Number.isFinite(o[k]))return o[k];const vals=Object.values(o).filter(Number.isFinite);return vals.find(v=>Math.abs(v-(n*2*Math.PI/60)**2*r)<.02) ?? vals[0];}
function markup(side){return `<div class="rowline"><span class="dim">半径 R</span><span class="val rv"></span></div><div class="rowline"><span class="dim">转速 n</span><span class="val nv"></span></div><div class="rowline"><span class="dim">实际重力</span><span class="val gv"></span></div><div class="rowline"><span class="dim">与目标差值</span><span class="val dv"></span></div><div class="rowline"><span class="dim">旋转一周</span><span class="val pv"></span></div><div class="risk"></div><div class="controls"><div class="ctl"><label>半径</label><input class="rctl" type="range" min="10" max="100" step="1"><output class="ro"></output></div><div class="ctl"><label>转速</label><input class="nctl" type="range" min="0" max="12" step="0.1"><output class="no"></output></div><div class="actions"><button class="btn match">匹配目标</button><button class="btn preset">对照预设</button></div></div>`}
document.querySelectorAll('.bay').forEach(b=>{b.querySelector('.metrics').innerHTML=markup(b.dataset.side);const s=b.dataset.side;b.querySelector('.rctl').addEventListener('input',e=>{state[s].r=+e.target.value;render()});b.querySelector('.nctl').addEventListener('input',e=>{state[s].n=+e.target.value;render()});b.querySelector('.match').onclick=()=>{let lo=0,hi=20;for(let i=0;i<45;i++){const m=(lo+hi)/2;acceleration(state[s].r,m)<targetG*G?lo=m:hi=m}state[s].n=Math.min(12,(lo+hi)/2);render()};b.querySelector('.preset').onclick=()=>{state.left={r:100,n:3};state.right={r:10,n:9.5};render()}});
function render(){document.querySelectorAll('.bay').forEach(b=>{const s=state[b.dataset.side],a=acceleration(s.r,s.n),g=a/G,d=g-targetG,rad=13+112*(s.r-10)/90; b.querySelector('.rv').textContent=s.r.toFixed(0)+' m';b.querySelector('.nv').textContent=s.n.toFixed(1)+' rpm';b.querySelector('.gv').textContent=a.toFixed(2)+' m/s²  ·  '+g.toFixed(2)+'g';const dv=b.querySelector('.dv');dv.textContent=(d>=0?'+':'')+d.toFixed(2)+'g';dv.classList.toggle('diff',Math.abs(d)>.03);b.querySelector('.pv').textContent=s.n? (60/s.n).toFixed(1)+' s':'—';b.querySelector('.risk').textContent=s.n>=6?'较高转速：眩晕与定向障碍风险增加':'较低转速';b.querySelector('.rctl').value=s.r;b.querySelector('.nctl').value=s.n;b.querySelector('.ro').textContent=s.r.toFixed(0)+' m';b.querySelector('.no').textContent=s.n.toFixed(1)+' rpm';b.querySelector('.ring').setAttribute('r',rad);b.querySelector('.radius').setAttribute('x2',155+rad);b.querySelector('.person').setAttribute('cx',155+rad);b.querySelector('.person').style.setProperty('--rpm',s.n)});document.getElementById('targetRead').textContent=targetG===1?'1g = 9.81 m/s²':'0.38g = 3.73 m/s²'}
function setTarget(v){targetG=v;earth.setAttribute('aria-pressed',v===1);mars.setAttribute('aria-pressed',v!==1);render()} earth.onclick=()=>setTarget(1);mars.onclick=()=>setTarget(.38);render();
if(!Deck.reduced()){let last=performance.now();function spin(t){document.querySelectorAll('.bay').forEach(b=>{const s=state[b.dataset.side],svg=b.querySelector('svg'),p=b.querySelector('.person'),r=+b.querySelector('.ring').getAttribute('r'),ang=(t/1000)*s.n*6*Math.PI/180;p.setAttribute('cx',155+Math.cos(ang)*r);p.setAttribute('cy',150+Math.sin(ang)*r)});requestAnimationFrame(spin)}requestAnimationFrame(spin)}
</script>
</body></html>
