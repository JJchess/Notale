<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:14px} header{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding-bottom:12px}.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.14em;color:var(--focus)}h1{font:700 var(--fs-h1)/1.2 var(--font-sans);margin:7px 0 0}.meta{font:var(--fs-label)/1.4 var(--font-sans);color:var(--muted);text-align:right}.work{flex:1;display:grid;grid-template-columns:400px 1fr 430px;gap:18px}.tray,.readout{border:1px solid var(--line-soft);background:var(--surface);border-radius:4px;padding:16px}.tray h2,.readout h2{font:700 var(--fs-h2)/1.2 var(--font-sans);margin:0 0 10px}.group{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line-soft)}.gname{font:700 var(--fs-sec)/1.2 var(--font-sans)}.choices{display:flex;gap:6px}.module{flex:1;min-width:0;padding:8px 3px;border:1px solid var(--line);border-radius:3px;background:transparent;font:var(--fs-label)/1.15 var(--font-mono);color:var(--text);cursor:grab}.module small{display:block;font:var(--fs-tick)/1.2 var(--font-sans);color:var(--muted)}.module.sel{border:2px solid var(--focus);color:var(--focus);transform:translateX(20px)}.hint{margin:10px 0 0}.reset{margin-top:10px}.assembly{position:relative;border:1px solid var(--line-soft);border-radius:4px;overflow:hidden;background:rgba(251,249,243,.55)}svg{width:100%;height:100%;display:block}.trunk{stroke:var(--line);stroke-width:2}.feed{stroke:var(--line);stroke-width:2}.feed.missing{stroke-dasharray:8 8}.human{fill:none;stroke:var(--text);stroke-width:4}.env{fill:rgba(36,91,99,.06);stroke:var(--line);stroke-width:6;stroke-dasharray:14 10}.assembly.complete .env{stroke:var(--life);stroke-dasharray:0;fill:rgba(36,91,99,.12)}.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:250px;text-align:center}.state{font:700 var(--fs-h2)/1.25 var(--font-sans)}.state.fail{color:var(--focus)}.substate{font:var(--fs-sec)/1.4 var(--font-sans);margin-top:8px}.slotlabels{position:absolute;inset:0;pointer-events:none}.slot{position:absolute;width:118px;padding:7px;border:1px solid var(--line);background:var(--surface);font:var(--fs-label)/1.25 var(--font-sans);text-align:center}.s0{left:22px;top:55px}.s1{right:22px;top:55px}.s2{left:22px;top:265px}.s3{right:22px;top:265px}.s4{left:50%;bottom:38px;transform:translateX(-50%)}.rows{display:flex;flex-direction:column}.row{padding:10px 0;border-top:1px solid var(--line-soft)}.rhead{display:flex;justify-content:space-between;align-items:baseline}.rname{font:700 var(--fs-sec)/1.2 var(--font-sans)}.val{font:700 var(--fs-body)/1 var(--font-mono)}.row.bad .val,.row.bad .gap{color:var(--focus)}.bar{height:5px;background:var(--line-soft);margin:8px 0 5px;position:relative}.bar i{display:block;height:100%;background:var(--life);transition:width 220ms}.row.bad .bar i{background:var(--focus)}.limit,.gap{font:var(--fs-label)/1.25 var(--font-sans);color:var(--muted)}.mass{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:2px solid var(--text);font:700 var(--fs-body)/1.2 var(--font-sans)}footer{display:flex;align-items:center;justify-content:space-between;gap:22px}.take{font:700 var(--fs-lead)/1.35 var(--font-sans);max-width:1100px}.next{font:var(--fs-sec)/1.35 var(--font-sans);color:var(--muted);text-align:right;max-width:340px}
</style>
</head>
<body data-page="44" data-total="45">
<div id="stage">
<header><div><div class="kicker">SYSTEM ASSEMBLY</div><h1>单项最优，可能拼不出一个能活的系统</h1></div><div class="meta">180 天巡航 · 10 m² 等效屏蔽面积<br>本页课堂验收线，非任务设计值</div></header>
<main class="work min0">
<section class="tray min0"><h2>可替换技术模块</h2><div id="groups"></div><p class="hint">拖动或点选每组一个方案；点已选模块可拆下。</p><button class="btn reset" id="reset">全部复位</button></section>
<section class="assembly min0 k-generalization" id="assembly"><svg viewBox="0 0 600 650" aria-label="五组技术模块汇入中央人体生存包络"><line class="trunk" x1="300" y1="60" x2="300" y2="590"/><path class="feed" d="M80 105H300 M520 105H300 M80 315H300 M520 315H300 M300 555V420"/><ellipse class="env" cx="300" cy="315" rx="142" ry="210"/><path class="human" d="M300 190a35 35 0 1 0 0 70a35 35 0 1 0 0-70M300 260v150M300 300l-78 70M300 300l78 70M300 410l-55 110M300 410l55 110"/></svg><div class="slotlabels" id="slots"></div><div class="core"><div class="state" id="state">系统尚未装配</div><div class="substate" id="substate">还缺 5 个系统</div></div></section>
<section class="readout min0"><h2>同一验收基线</h2><div class="rows" id="rows"></div><div class="mass"><span>计入总质量</span><span id="mass">0 kg / 400 kg</span></div><p class="note">辐射短标：Zeitlin 等，2013；屏蔽为教学近似。</p></section>
</main>
<footer><div class="take">可行方案必须同时守住压力、氧气、热量、辐射、质量与故障冗余；任何一项越界，生存包络就没有闭合。</div><div class="next">下一问：从脚底、石片到航天服，人类真正改变的是什么？</div></footer>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script>
<script>
Deck.init({index:44,total:45});
const defs=[
 {n:'压力舱',u:'kPa',v:[50,70,101.3],m:[55,85,125]},
 {n:'氧气系统',u:'%',v:[21,30,40],m:[20,30,42]},
 {n:'散热系统',u:'W',v:[220,320,450],m:[25,45,70]},
 {n:'辐射屏蔽',u:'kg/m²',v:[0,10,20],m:[0,100,200]},
 {n:'故障冗余',u:'条',v:[0,1,2],m:[0,35,70]}
];
let pick=[-1,-1,-1,-1,-1], drag=null;
const groups=document.querySelector('#groups'), slots=document.querySelector('#slots');
defs.forEach((d,i)=>{const g=document.createElement('div');g.className='group';g.innerHTML='<div class="gname">'+d.n+'</div><div class="choices">'+d.v.map((v,j)=>'<button draggable="true" class="module" data-i="'+i+'" data-j="'+j+'">'+v+' '+d.u+'<small>'+d.m[j]+' kg</small></button>').join('')+'</div>';groups.append(g); const s=document.createElement('div');s.className='slot s'+i;s.textContent=d.n+'：未装';slots.append(s)});
function select(i,j){pick[i]=pick[i]===j?-1:j;draw()}
groups.addEventListener('click',e=>{const b=e.target.closest('.module');if(b)select(+b.dataset.i,+b.dataset.j)});groups.addEventListener('dragstart',e=>{const b=e.target.closest('.module');if(b)drag=[+b.dataset.i,+b.dataset.j]});document.querySelector('#assembly').addEventListener('dragover',e=>e.preventDefault());document.querySelector('#assembly').addEventListener('drop',e=>{e.preventDefault();if(drag)select(...drag)});document.querySelector('#reset').onclick=()=>{pick.fill(-1);draw()};
function draw(){document.querySelectorAll('.module').forEach(b=>b.classList.toggle('sel',pick[+b.dataset.i]===+b.dataset.j));let miss=pick.filter(x=>x<0).length;defs.forEach((d,i)=>{document.querySelector('.s'+i).textContent=d.n+'：'+(pick[i]<0?'未装':d.v[pick[i]]+' '+d.u)});let p=pick[0]<0?0:defs[0].v[pick[0]], ox=pick[1]<0?0:defs[1].v[pick[1]], heat=pick[2]<0?0:defs[2].v[pick[2]], sh=pick[3]<0?0:defs[3].v[pick[3]], red=pick[4]<0?0:defs[4].v[pick[4]];let alve=0;if(p&&ox){const o=Lec.P.oxygenPressures(p*1000,ox/100,6266,5333,.8);alve=o.alveolarOxygenPressurePa/1000}let dose=0;if(!miss){const rad=Lec.P.shieldedRadiationDose(0.00184,180*24,sh,20);dose=rad.unshieldedDoseSv*rad.transmissionFraction*1000;}let mass=defs.reduce((s,d,i)=>s+(pick[i]<0?0:d.m[pick[i]]),0);let rs=[['舱压',p,'kPa',50,'≥ 50 kPa',p>=50,'低 '+Math.max(0,50-p).toFixed(0)+' kPa'],['肺泡氧分压',alve,'kPa',10,'≥ 10 kPa',alve>=10,'低 '+Math.max(0,10-alve).toFixed(2)+' kPa'],['排热能力',heat,'W',300,'≥ 300 W',heat>=300,'少 '+Math.max(0,300-heat).toFixed(0)+' W'],['累计辐射剂量',dose,'mSv',250,'≤ 250 mSv',dose<=250&&pick[3]>=0,'超 '+Math.max(0,dose-250).toFixed(0)+' mSv'],['有备份关键支路',red,'条',2,'≥ 2 条',red>=2,'少 '+Math.max(0,2-red)+' 条']];let massok=mass<=400;document.querySelector('#rows').innerHTML=rs.map(r=>'<div class="row '+(miss?'':r[5]?'':'bad')+'"><div class="rhead"><span class="rname">'+r[0]+'</span><span class="val">'+(r[1]?r[1].toFixed(r[0].includes('氧')?2:0):'—')+' '+r[2]+'</span></div><div class="bar"><i style="width:'+Math.min(100,r[0].includes('辐射')?(r[1]?250/r[1]*100:0):r[1]/r[3]*100)+'%"></i></div><div class="limit">验收线 '+r[4]+'</div>'+(!miss&&!r[5]?'<div class="gap">'+r[6]+'</div>':'')+'</div>').join('');document.querySelector('#mass').textContent=mass+' kg / 400 kg';document.querySelector('#mass').style.color=massok?'':'var(--focus)';let all=!miss&&rs.every(r=>r[5])&&massok;let st=document.querySelector('#state'),sub=document.querySelector('#substate'),a=document.querySelector('#assembly');a.classList.toggle('complete',all);st.className='state '+(!miss&&!all?'fail':'');st.textContent=all?'生存包络成立':miss?'系统尚未装满':'生存包络未闭合';sub.textContent=miss?'还缺 '+miss+' 个系统':all?'六项约束同时通过':(!massok?'总质量超限 '+(mass-400)+' kg':'有验收项越界')}
draw();
</script>
</body></html>
