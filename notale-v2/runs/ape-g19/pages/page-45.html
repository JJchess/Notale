<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="45" data-total="45">
<div id="stage">
  <style>
    #stage{gap:0}
    .p45{height:100%;display:flex;flex-direction:column;min-height:0}
    .p45-head{flex:0 0 auto;padding-top:2px}
    .p45-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.18em;color:var(--focus);margin-bottom:14px}
    .p45 h1{margin:0;max-width:1320px;font:700 var(--fs-h1)/1.28 var(--font-sans);color:var(--text)}
    .p45 .k-generalization{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:20px}
    .p45 .claim{align-self:center;width:1180px;text-align:center;font:600 var(--fs-lead)/1.45 var(--font-sans);padding:14px 34px 15px;border-top:2px solid var(--text);border-bottom:1px solid var(--line-soft);background:var(--surface)}
    .p45 .trunk{width:2px;height:28px;background:var(--text);align-self:center;flex:0 0 auto}
    .interface-board{position:relative;flex:1;min-height:360px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
    .interface-board svg{position:absolute;inset:0;width:100%;height:100%}
    .supports{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:52px;padding:0 62px}
    .baseline-label{position:absolute;left:0;top:50%;transform:translateY(-31px);padding:2px 8px 2px 0;background:var(--bg);font:600 var(--fs-label)/1.2 var(--font-sans);color:var(--muted)}
    .support{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:244px;text-align:center;min-width:0}
    .support h2{margin:0 0 9px;font:700 var(--fs-h2)/1.2 var(--font-sans)}
    .short{display:inline-block;margin-bottom:10px;padding:4px 11px;border:1px solid var(--life);color:var(--life);font:700 var(--fs-label)/1.2 var(--font-sans);border-radius:2px;background:var(--surface)}
    .support p{margin:2px 0;font:400 var(--fs-sec)/1.4 var(--font-sans);color:var(--text)}
    .support .cost{color:var(--muted)}
    .shared-note{text-align:center;margin:12px 0 0;font:400 var(--fs-sec)/1.4 var(--font-sans);color:var(--muted)}
    .p45-foot{flex:0 0 auto;display:grid;grid-template-columns:1.55fr 1fr;gap:52px;align-items:start;margin-top:15px}
    .takeaway{margin:0;padding-left:17px;border-left:4px solid var(--life);font:600 var(--fs-lead)/1.45 var(--font-sans)}
    .next{margin:0;padding-top:3px;font:600 var(--fs-body)/1.45 var(--font-sans);color:var(--focus)}
    .next span{display:block;margin-bottom:4px;font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--muted)}
  </style>
  <main class="p45">
    <header class="p45-head">
      <div class="p45-kicker">INTERFACE</div>
      <h1>我们没有摆脱环境，只是在改变身体与环境相接的界面</h1>
    </header>

    <section class="k-generalization min0" aria-label="身体与环境界面的三种可行方案">
      <div class="claim">生存边界的扩展，不是离开环境，而是重做相接之处</div>
      <div class="trunk" aria-hidden="true"></div>
      <div class="interface-board min0">
        <svg viewBox="0 0 1488 430" role="img" aria-label="同一基线上，脚底直接接触地面，石片伸出手外，航天服包围人体；深青轮廓由贴身逐步外移。" preserveAspectRatio="none">
          <!-- shared environmental baseline -->
          <path d="M54 224 H1434" fill="none" stroke="var(--line)" stroke-width="3"/>
          <path d="M54 230 H1434" fill="none" stroke="var(--line-soft)" stroke-width="1"/>
          <!-- continuous life-envelope: near body, extending through tool, enclosing body -->
          <path class="life-loop" d="M105 210 C180 205 260 205 365 210 C420 211 456 191 505 178 C584 155 671 151 756 171 C828 188 869 204 920 210 C958 214 990 201 1015 171 C1050 125 1096 89 1172 82 C1282 72 1367 130 1380 210" fill="none" stroke="var(--life)" stroke-width="6" stroke-linecap="round"/>
          <!-- foot/body boundary -->
          <path class="body-outline" d="M205 85 C187 117 180 158 184 193 L169 215 L318 215 C311 197 289 190 263 188 L257 119 C255 92 227 73 205 85 Z" fill="var(--surface)" stroke="var(--text)" stroke-width="4"/>
          <path d="M171 215 H320" stroke="var(--focus)" stroke-width="7" stroke-linecap="round"/>
          <circle cx="245" cy="48" r="5" fill="var(--text)"/><path d="M245 53 V76" stroke="var(--text)" stroke-width="2"/>
          <!-- neutral hand and detachable stone module -->
          <path class="body-outline" d="M602 118 C622 105 647 111 657 132 L679 178 L645 198 L610 160 C593 141 588 127 602 118 Z" fill="var(--surface)" stroke="var(--text)" stroke-width="4"/>
          <path class="tech-module" d="M674 176 L782 122 L754 202 L687 211 Z" fill="var(--surface)" stroke="var(--text)" stroke-width="4"/>
          <path d="M688 183 L773 135" stroke="var(--focus)" stroke-width="5"/>
          <path d="M620 87 V106" stroke="var(--text)" stroke-width="2"/><circle cx="620" cy="81" r="5" fill="var(--text)"/>
          <!-- suited human: body outline inside detachable enclosing interface -->
          <circle cx="1202" cy="109" r="29" fill="var(--surface)" stroke="var(--text)" stroke-width="4"/>
          <path class="body-outline" d="M1191 139 L1168 185 L1173 216 M1213 139 L1236 185 L1231 216 M1181 151 L1150 180 M1223 151 L1254 180" fill="none" stroke="var(--text)" stroke-width="5" stroke-linecap="round"/>
          <path class="tech-module" d="M1164 83 Q1202 61 1240 83 L1250 142 L1268 181 L1242 213 H1162 L1136 181 L1154 142 Z" fill="none" stroke="var(--text)" stroke-width="4"/>
          <rect class="tech-module" x="1247" y="112" width="30" height="57" fill="var(--surface)" stroke="var(--text)" stroke-width="4"/>
          <path d="M1174 105 Q1202 87 1230 105" fill="none" stroke="var(--focus)" stroke-width="5"/>
          <!-- equal-status anchors to the one claim -->
          <path d="M248 27 V48 M744 27 V109 M1202 27 V76" fill="none" stroke="var(--line)" stroke-width="2"/>
          <circle cx="248" cy="27" r="5" fill="var(--text)"/><circle cx="744" cy="27" r="5" fill="var(--text)"/><circle cx="1202" cy="27" r="5" fill="var(--text)"/>
        </svg>
        <div class="baseline-label">同一环境基线</div>
        <div class="supports">
          <article class="support">
            <h2>脚底</h2><div class="short">身体直接接触</div>
            <p>身体承受地面、温度与负荷</p>
            <p class="cost">代价：适应缓慢，受身体结构限制</p>
          </article>
          <article class="support">
            <h2>石片</h2><div class="short">功能伸出身体</div>
            <p>工具把切割能力移到手外</p>
            <p class="cost">代价：需要制作、携带与学习</p>
          </article>
          <article class="support">
            <h2>航天服</h2><div class="short">环境包到身体外</div>
            <p>工程界面维持人体所需条件</p>
            <p class="cost">代价：依赖能源、维护与可靠性</p>
          </article>
        </div>
      </div>
      <p class="shared-note">这不是预定路线，而是不同环境约束下留下的可行方案。</p>
    </section>

    <footer class="p45-foot">
      <p class="takeaway">脚底承受地面，石片延伸手，航天服包裹全身；每次扩展生存边界，也都会带来新的代价与脆弱点。</p>
      <p class="next"><span>下一问</span>面对下一种极端环境，我们该改变身体、行为，还是界面？</p>
    </footer>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
