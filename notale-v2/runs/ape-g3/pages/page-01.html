<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>我们没有摆脱限制，只是学会把能力延伸得更远</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    html.lec-root {
      position: static;
      display: block;
      width: auto;
      height: auto;
      overflow: visible;
    }
    body.lec-page {
      width: auto;
      height: auto;
      overflow: hidden;
    }
    .lec-header__identity {
      display: none;
    }
    .opening {
      position: relative;
      height: 100%;
      box-sizing: border-box;
      padding: var(--sp-5) 0;
    }
    .opening.k-generalization {
      grid-template-columns: minmax(0, 1fr) 380px minmax(0, 1fr);
      gap: var(--sp-9);
    }
    .opening.k-generalization::before,
    .opening.k-generalization::after {
      width: calc(50% - 190px);
      border-top-color: var(--line-strong);
    }
    .branch-block {
      position: relative;
      min-height: 210px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: var(--sp-4);
    }
    .branch-block::after {
      content: "";
      position: absolute;
      top: calc(50% - 8px);
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
    }
    [data-branch="left"] .branch-block {
      border-left: 6px solid var(--warning);
    }
    [data-branch="left"] .branch-block::after {
      right: -53px;
      border-left: 13px solid var(--line-strong);
    }
    [data-branch="right"] .branch-block {
      border-right: 6px solid var(--accent);
    }
    [data-branch="right"] .branch-block::after {
      left: -53px;
      border-right: 13px solid var(--line-strong);
    }
    .branch-kicker {
      margin: 0;
      color: var(--muted);
      font-size: var(--fs-label);
      line-height: var(--lh-label);
      font-weight: 750;
      letter-spacing: .08em;
    }
    .branch-copy {
      margin: 0;
      color: var(--text);
    }
    .opening.k-generalization > [data-claim] {
      height: 500px;
      padding: var(--sp-5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-4);
      border-color: var(--accent);
      background: linear-gradient(90deg, var(--warning-soft) 0 49.5%, var(--accent-soft) 50.5% 100%);
    }
    .human-mark {
      width: 218px;
      height: 330px;
      display: block;
    }
    .claim-line {
      margin: 0;
      max-width: 310px;
      font-size: var(--fs-h2);
      font-weight: 760;
      line-height: var(--lh-h2);
      color: var(--text);
    }
    .claim-sub {
      margin: 0;
      color: var(--muted);
    }
  </style>
</head>
<body data-page="01" data-total="48">
  <div id="stage">
    <main class="opening k-generalization" aria-label="限制与延伸共同塑造太空人">
      <section data-branch="left" class="min0" aria-labelledby="limit-title">
        <div class="branch-block">
          <p class="branch-kicker">有限的身体</p>
          <h2 id="limit-title">限制仍在</h2>
          <p class="branch-copy fs-body">人仍然需要空气、食物、休息与适宜环境。</p>
        </div>
      </section>

      <section data-claim aria-labelledby="claim-title">
        <svg class="human-mark" viewBox="0 0 218 330" role="img" aria-label="身体轮廓向外延伸为协作节点、工具与航天服线条">
          <defs>
            <linearGradient id="bodyFlow" x1="0" x2="1">
              <stop offset="0" stop-color="#a45c00"/>
              <stop offset="0.49" stop-color="#fff0d5"/>
              <stop offset="0.51" stop-color="#dcecff"/>
              <stop offset="1" stop-color="#0b73e0"/>
            </linearGradient>
          </defs>
          <circle cx="109" cy="48" r="31" fill="url(#bodyFlow)" stroke="#899bb0" stroke-width="3"/>
          <path d="M76 91 Q109 72 142 91 L155 190 L139 300 L112 300 L109 202 L106 300 L79 300 L63 190 Z" fill="url(#bodyFlow)" stroke="#899bb0" stroke-width="3" stroke-linejoin="round"/>
          <path d="M70 112 L25 185 M148 112 L193 185" fill="none" stroke="#899bb0" stroke-width="18" stroke-linecap="round"/>
          <g fill="none" stroke="#0b73e0" stroke-width="3">
            <path d="M147 102 C181 90 190 68 204 48"/>
            <path d="M151 154 C184 146 192 128 207 119"/>
            <path d="M151 214 C181 220 191 244 207 259"/>
            <circle cx="204" cy="48" r="7" fill="#dcecff"/>
            <circle cx="207" cy="119" r="7" fill="#dcecff"/>
            <circle cx="207" cy="259" r="7" fill="#dcecff"/>
          </g>
          <g fill="none" stroke="#a45c00" stroke-width="3" opacity=".85">
            <path d="M70 102 C41 91 31 72 15 60"/>
            <path d="M67 218 C39 226 30 248 14 263"/>
          </g>
        </svg>
        <h2 id="claim-title" class="claim-line">限制与延伸，共同塑造“人”</h2>
        <p class="claim-sub fs-sec">两者始终同时存在</p>
      </section>

      <section data-branch="right" class="min0" aria-labelledby="extend-title">
        <div class="branch-block">
          <p class="branch-kicker">接力的延伸</p>
          <h2 id="extend-title">能力向外延伸</h2>
          <p class="branch-copy fs-body">个体做不到的事，可以由合作、知识与机器接力完成。</p>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 1,
      kicker: 'APEMAN — SPACEMAN',
      title: '我们没有摆脱限制，只是学会把能力延伸得更远',
      take: '从猿到太空人的故事，是限制与延伸共同塑造人的故事。'
    });
    Deck.init({ index: 1, total: 48 });
  </script>
</body>
</html>
