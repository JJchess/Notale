<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>换了环境，没有换掉基本身体</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{margin-top:-96px}
    .lec-header{transform:translateY(-92px)}
    .lec-footer{transform:translateY(-96px)}
    .page02{position:absolute;left:96px;top:144px;width:var(--content-w);height:var(--content-h);display:flex;flex-direction:column;gap:12px;min-height:0}
    .prompt{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .compare{--comparison-cols:3;flex:1;grid-template-columns:180px repeat(3,minmax(0,1fr));grid-template-rows:44px 266px repeat(4,42px);box-shadow:var(--shadow-panel)}
    .compare>*{padding:8px 14px}
    .compare [data-heading]{justify-content:center;font-size:var(--fs-body);line-height:var(--lh-body)}
    .compare .corner{background:var(--surface-soft)}
    .axis{display:flex;align-items:center;color:var(--muted);font-size:var(--fs-label);line-height:var(--lh-label);transition:background-color var(--transition-fast),color var(--transition-fast),box-shadow var(--transition-fast)}
    .axis.active{background:var(--warning-soft);color:var(--text);box-shadow:inset 5px 0 0 var(--warning)}
    .person-cell{position:relative;padding:0!important;background:linear-gradient(180deg,var(--surface) 0%,var(--surface-soft) 100%);overflow:hidden}
    .person-cell svg{display:block;width:100%;height:100%}
    .baseline{position:absolute;left:0;right:0;bottom:18px;border-top:2px solid var(--line-strong)}
    .descriptor{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--text);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .layer{transition:opacity var(--transition-fast)}
    .body-fill{fill:#d9b49a;stroke:#7d695e;stroke-width:2}
    .suit-warm{fill:#786957;stroke:#51473d;stroke-width:3}
    .suit-city{fill:#62758c;stroke:#405064;stroke-width:3}
    .suit-space{fill:#dce5ed;stroke:#526b84;stroke-width:4}
    .bone{fill:none;stroke:#fffaf0;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .bone-thin{fill:none;stroke:#fffaf0;stroke-width:3;stroke-linecap:round}
    .need-dot{fill:var(--warning-soft);stroke:var(--warning);stroke-width:2}
    .need-mark{fill:none;stroke:var(--warning);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .ctl-wrap{display:grid;grid-template-columns:180px minmax(0,1fr);align-items:center;gap:16px;min-height:58px}
    .ctl-title{font-size:var(--fs-label);font-weight:700;line-height:var(--lh-label)}
    .slider-box{position:relative;padding-top:18px}
    .slider-box input{width:100%;margin:0;accent-color:var(--warning)}
    .stops{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;color:var(--muted);font-size:var(--fs-label);line-height:var(--lh-label);pointer-events:none}
    .stops .active{color:var(--warning);font-weight:750}
    @media (prefers-reduced-motion:reduce){.layer,.axis{transition:none}}
  </style>
</head>
<body data-page="02" data-total="48">
  <div id="stage">
    <main class="page02">
      <p class="prompt">拖动，剥开三种外观。</p>
      <section class="k-comparison compare" aria-label="古人类、现代城市人与航天员的身体连续性比较">
        <div class="corner" data-axis></div>
        <div data-heading>古人类</div>
        <div data-heading>现代城市人</div>
        <div data-heading>航天员</div>

        <div class="axis active" data-axis data-row="equipment">对齐的人物与脚底基线</div>
        <figure class="person-cell" aria-label="概括性古人类：外层是天然材料与携带物，内层仍是共同身体和生存需求" title="概括性复原，不代表确定物种、肤色或生活方式">
          <div class="baseline"></div>
          <svg viewBox="0 0 300 266" role="img" aria-hidden="true">
            <g class="layer body"><circle class="body-fill" cx="150" cy="48" r="27"/><path class="body-fill" d="M125 78 Q150 66 175 78 L185 155 Q150 172 115 155Z"/><path class="body-fill" d="M124 88L89 153 105 160 137 108M176 88l35 65-16 7-32-52M130 154l-11 88h18l15-75M170 154l11 88h-18l-15-75"/></g>
            <g class="layer skeleton"><circle class="bone" cx="150" cy="48" r="20"/><path class="bone" d="M150 70v86M126 91h48M125 91q25 28 50 0M131 148q19 16 38 0M150 156l-22 86M150 156l22 86M126 92l-30 66M174 92l30 66"/><path class="bone-thin" d="M132 108q18 14 36 0M128 119q22 15 44 0M126 131q24 15 48 0"/></g>
            <g class="layer needs"><circle class="need-dot" cx="68" cy="65" r="18"/><path class="need-mark" d="M57 65h22M68 54v22"/><circle class="need-dot" cx="232" cy="65" r="18"/><path class="need-mark" d="M232 53q-10 13 0 24 10-11 0-24"/><circle class="need-dot" cx="65" cy="190" r="18"/><path class="need-mark" d="M55 194q10-21 20 0M61 184h8"/><circle class="need-dot" cx="235" cy="190" r="18"/><path class="need-mark" d="M226 199l18-18M225 181l19 18"/></g>
            <g class="layer equipment"><path class="suit-warm" d="M117 79q33-20 66 0l7 77q-40 25-80 0z"/><path class="suit-warm" d="M113 91L86 153l17 8 31-56M187 91l27 62-17 8-31-56"/><path fill="#9d7651" stroke="#51473d" stroke-width="3" d="M205 116h35v49h-35z"/></g>
          </svg>
        </figure>
        <figure class="person-cell" aria-label="现代城市人：外层是日常衣物和工具，内层仍是共同身体和生存需求">
          <div class="baseline"></div>
          <svg viewBox="0 0 300 266" role="img" aria-hidden="true">
            <g class="layer body"><circle class="body-fill" cx="150" cy="48" r="27"/><path class="body-fill" d="M125 78 Q150 66 175 78 L185 155 Q150 172 115 155Z"/><path class="body-fill" d="M124 88L89 153 105 160 137 108M176 88l35 65-16 7-32-52M130 154l-11 88h18l15-75M170 154l11 88h-18l-15-75"/></g>
            <g class="layer skeleton"><circle class="bone" cx="150" cy="48" r="20"/><path class="bone" d="M150 70v86M126 91h48M125 91q25 28 50 0M131 148q19 16 38 0M150 156l-22 86M150 156l22 86M126 92l-30 66M174 92l30 66"/><path class="bone-thin" d="M132 108q18 14 36 0M128 119q22 15 44 0M126 131q24 15 48 0"/></g>
            <g class="layer needs"><circle class="need-dot" cx="68" cy="65" r="18"/><path class="need-mark" d="M57 65h22M68 54v22"/><circle class="need-dot" cx="232" cy="65" r="18"/><path class="need-mark" d="M232 53q-10 13 0 24 10-11 0-24"/><circle class="need-dot" cx="65" cy="190" r="18"/><path class="need-mark" d="M55 194q10-21 20 0M61 184h8"/><circle class="need-dot" cx="235" cy="190" r="18"/><path class="need-mark" d="M226 199l18-18M225 181l19 18"/></g>
            <g class="layer equipment"><path class="suit-city" d="M117 79q33-20 66 0l7 77q-40 25-80 0zM129 154h23l-15 89h-23zM171 154h-23l15 89h23z"/><path class="suit-city" d="M113 91L86 153l17 8 31-56M187 91l27 62-17 8-31-56"/><rect x="198" y="129" width="24" height="39" rx="4" fill="#172033"/></g>
          </svg>
        </figure>
        <figure class="person-cell" aria-label="航天员：外层是航天服与生命支持设备，里面仍是共同身体和生存需求">
          <div class="baseline"></div>
          <svg viewBox="0 0 300 266" role="img" aria-hidden="true">
            <g class="layer body"><circle class="body-fill" cx="150" cy="48" r="27"/><path class="body-fill" d="M125 78 Q150 66 175 78 L185 155 Q150 172 115 155Z"/><path class="body-fill" d="M124 88L89 153 105 160 137 108M176 88l35 65-16 7-32-52M130 154l-11 88h18l15-75M170 154l11 88h-18l-15-75"/></g>
            <g class="layer skeleton"><circle class="bone" cx="150" cy="48" r="20"/><path class="bone" d="M150 70v86M126 91h48M125 91q25 28 50 0M131 148q19 16 38 0M150 156l-22 86M150 156l22 86M126 92l-30 66M174 92l30 66"/><path class="bone-thin" d="M132 108q18 14 36 0M128 119q22 15 44 0M126 131q24 15 48 0"/></g>
            <g class="layer needs"><circle class="need-dot" cx="68" cy="65" r="18"/><path class="need-mark" d="M57 65h22M68 54v22"/><circle class="need-dot" cx="232" cy="65" r="18"/><path class="need-mark" d="M232 53q-10 13 0 24 10-11 0-24"/><circle class="need-dot" cx="65" cy="190" r="18"/><path class="need-mark" d="M55 194q10-21 20 0M61 184h8"/><circle class="need-dot" cx="235" cy="190" r="18"/><path class="need-mark" d="M226 199l18-18M225 181l19 18"/></g>
            <g class="layer equipment"><circle class="suit-space" cx="150" cy="50" r="38"/><path fill="#6d879f" d="M125 39q25-18 50 0v25h-50z"/><path class="suit-space" d="M112 84q38-21 76 0l10 78q-48 24-96 0zM115 153h39l-13 91h-31zM185 153h-39l13 91h31zM110 91l-34 66 24 11 38-64M190 91l34 66-24 11-38-64"/><rect x="188" y="87" width="31" height="72" rx="6" fill="#7892aa" stroke="#526b84" stroke-width="3"/></g>
          </svg>
        </figure>

        <div class="axis" data-axis data-row="skeleton">骨性主架</div><div class="descriptor">头骨、脊柱、胸廓、骨盆、四肢</div><div class="descriptor">同一组主要部位</div><div class="descriptor">装备内仍是同一组主要部位</div>
        <div class="axis" data-axis data-row="senses">感知与操作</div><div class="descriptor">眼观察，手抓握，足移动</div><div class="descriptor">眼、手、足借助城市工具</div><div class="descriptor">眼、手、足借助仪器与固定装置</div>
        <div class="axis" data-axis data-row="needs">共同需求</div><div class="descriptor">空气、水、食物、温度、休息、排出</div><div class="descriptor">同样的需求，部分由城市设施满足</div><div class="descriptor">同样的需求，由支持系统主动维持</div>
        <div class="axis" data-axis data-row="equipment">环境装备</div><div class="descriptor">天然材料、简单容器与携带物</div><div class="descriptor">日常衣物、鞋与工具</div><div class="descriptor">航天服、头盔、供气与温控连接</div>
      </section>
      <div class="ctl-wrap">
        <div class="ctl-title">图层检视器</div>
        <div class="slider-box ctl">
          <div class="stops" aria-hidden="true"><span data-stop="0">环境装备</span><span data-stop="50">共同需求</span><span data-stop="100">身体主架</span></div>
          <input id="layerRange" aria-label="在环境装备、共同需求和身体主架之间切换" type="range" min="0" max="100" step="1" value="0" list="layerStops" aria-valuetext="环境装备">
          <datalist id="layerStops"><option value="0"></option><option value="50"></option><option value="100"></option></datalist>
        </div>
      </div>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 2,
      kicker: 'BODY CONTINUITY',
      title: '换了环境，没有换掉基本身体',
      take: '古人类、现代城市人和航天员共享同一副基本身体；真正显著改变的是环境，以及身体外面接上的工具和支持系统。'
    });
    Deck.init({ index: 2, total: 48 });

    const range = document.getElementById('layerRange');
    const equipment = document.querySelectorAll('.equipment');
    const needs = document.querySelectorAll('.needs');
    const skeleton = document.querySelectorAll('.skeleton');
    const body = document.querySelectorAll('.body');
    const rows = document.querySelectorAll('[data-row]');
    const stops = document.querySelectorAll('[data-stop]');
    function update(){
      const v = Number(range.value);
      const equipOpacity = Math.max(0, 1 - v / 50);
      const needOpacity = Math.max(0, 1 - Math.abs(v - 50) / 50);
      const skeletonOpacity = Math.max(0, (v - 50) / 50);
      equipment.forEach(el => el.style.opacity = equipOpacity);
      needs.forEach(el => el.style.opacity = needOpacity);
      skeleton.forEach(el => el.style.opacity = skeletonOpacity);
      body.forEach(el => el.style.opacity = 0.34 + skeletonOpacity * 0.28);
      const state = v < 25 ? 'equipment' : v < 75 ? 'needs' : 'skeleton';
      const label = state === 'equipment' ? '环境装备' : state === 'needs' ? '共同需求' : '身体主架';
      range.setAttribute('aria-valuetext', label);
      rows.forEach(el => el.classList.toggle('active', el.dataset.row === state));
      stops.forEach(el => el.classList.toggle('active', el.dataset.stop === String(state === 'equipment' ? 0 : state === 'needs' ? 50 : 100)));
    }
    range.addEventListener('input', update);
    update();
  </script>
</body>
</html>
