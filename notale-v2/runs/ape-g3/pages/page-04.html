<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>人类演化不是一列依次升级的队伍</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{height:calc(900px - var(--header-h) - 96px)!important;min-height:0!important;box-sizing:border-box}
    .lec-footer{top:calc(900px - var(--header-h) - var(--footer-h));bottom:auto}
    .p04-layout{position:absolute;left:96px;top:0;width:var(--content-w);height:var(--content-h);box-sizing:border-box;display:grid;grid-template-columns:minmax(0,3fr) minmax(320px,1fr);gap:var(--sp-5)}
    .p04-tree{position:relative;overflow:hidden;padding:var(--sp-4);background:rgb(255 255 255 / 72%)}
    .p04-tree svg{display:block;width:100%;height:100%}
    .p04-guide{position:absolute;left:var(--sp-5);right:var(--sp-5);top:var(--sp-3);display:flex;justify-content:space-between;color:var(--muted);font-size:var(--fs-label);line-height:var(--lh-label);pointer-events:none}
    .p04-card{height:100%;padding:var(--sp-5);gap:var(--sp-4);overflow:hidden}
    .p04-badge{display:inline-flex;align-self:flex-start;padding:var(--sp-2) var(--sp-3);border-radius:var(--radius-sm);background:var(--accent-soft);color:var(--accent-strong);font-size:var(--fs-label);font-weight:800;line-height:var(--lh-label)}
    .p04-meta{display:flex;flex-direction:column;gap:var(--sp-3)}
    .p04-meta div{padding:var(--sp-3);border-left:5px solid var(--secondary);background:var(--secondary-soft)}
    .p04-meta strong{display:block;margin-bottom:var(--sp-1);font-size:var(--fs-label);line-height:var(--lh-label);color:var(--muted)}
    .p04-summary{margin-top:auto;padding-top:var(--sp-4);border-top:1px solid var(--line);color:var(--text)}
    .p04-link{fill:none;stroke:var(--line-strong);stroke-width:2.5;opacity:.42}
    .p04-link.is-path{stroke:var(--accent);stroke-width:5;opacity:1;stroke-dasharray:800;animation:p04draw 420ms ease-out both}
    .p04-link.is-peer{stroke:var(--secondary);stroke-width:4;opacity:.9}
    .p04-node{cursor:pointer;outline:none}
    .p04-node .hit{fill:transparent}
    .p04-node .dot{fill:var(--surface);stroke:var(--line-strong);stroke-width:3;transition:140ms ease}
    .p04-node.is-extinct .dot{fill:var(--warning-soft);stroke:var(--warning)}
    .p04-node.is-living .dot{fill:var(--accent-soft);stroke:var(--accent)}
    .p04-node.is-uncertain .dot{stroke-dasharray:5 4}
    .p04-node.is-muted{opacity:.48}
    .p04-node.is-active,.p04-node.is-related{opacity:1}
    .p04-node.is-active .dot{stroke:var(--accent-strong);stroke-width:6}
    .p04-node:focus .focus-ring{stroke:var(--focus);stroke-width:3;fill:none}
    .p04-node text{fill:var(--text);font-size:15px;font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
    .p04-node .status{font-size:14px;font-weight:600;fill:var(--muted)}
    @keyframes p04draw{from{stroke-dashoffset:800}to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.p04-link.is-path{animation:none}}
  </style>
</head>
<body data-page="04" data-total="48">
  <div id="stage">
    <main class="p04-layout k-classification" aria-label="简化人类分枝谱系">
      <section class="p04-tree class-group min0" aria-label="从共同祖先向右展开的分枝树">
        <div class="p04-guide"><span>较早</span><span>距今时间方向</span><span>现在</span></div>
        <svg id="phylogeny" viewBox="0 0 1000 540" role="tree" aria-label="可点选的简化谱系。横向表示大致时间，纵向只用于展开分枝，不表示能力高低。"></svg>
      </section>
      <aside class="p04-card class-group col min0" aria-live="polite" aria-atomic="true">
        <span id="rel" class="p04-badge">共同祖先</span>
        <h2 id="name">人族与黑猩猩支系的共同祖先</h2>
        <p id="desc" class="fs-body">这是推定的共同祖先位置，不是现生黑猩猩变成人的起点。</p>
        <div class="p04-meta fs-sec">
          <div><strong>所属层级</strong><span id="level">共同祖先节点</span></div>
          <div><strong>延续状态</strong><span id="status">多个后续支系由此分开</span></div>
          <div id="age-row"><strong>年代</strong><span id="age"></span></div>
        </div>
        <p class="p04-summary fs-sec">沿树回溯关系：智人只是延续至今的一条叶端，不是谱系预设的终点。</p>
      </aside>
    </main>
  </div>
  <script src="assets/lib/d3.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 4,
      kicker: 'BRANCHING HOMININS',
      title: '人类演化不是一列依次升级的队伍',
      take: '人类演化像分枝灌木，不是猿依次升级成人的梯子'
    });
    Deck.init({ index: 4, total: 48 });

    const raw = Lec.K.page04Phylogeny?.nodes ?? [
      {id:'shared',parentId:null,name:'人族与黑猩猩支系的共同祖先',uncertain:true},
      {id:'chimp',parentId:'shared',name:'现生黑猩猩支系',status:'延续至今'},
      {id:'early',parentId:'shared',name:'早期人族',uncertain:true},
      {id:'austral',parentId:'early',name:'南方古猿类',uncertain:true},
      {id:'afarensis',parentId:'austral',name:'阿法南方古猿',status:'已灭绝',uncertain:true},
      {id:'paranthropus',parentId:'austral',name:'傍人类',status:'已灭绝'},
      {id:'homo',parentId:'early',name:'人属',uncertain:true},
      {id:'extinct-homo',parentId:'homo',name:'其他灭绝人属代表',status:'已灭绝',uncertain:true},
      {id:'sapiens',parentId:'homo',name:'智人',status:'延续至今'}
    ];
    const nodes = raw.map((d,i) => ({
      ...d,
      id: String(d.id ?? d.key ?? i),
      parentId: d.parentId == null ? (d.parent == null ? null : String(d.parent)) : String(d.parentId),
      name: d.name ?? d.label ?? d.title,
      status: d.status ?? d.state ?? '',
      start: d.startYearsAgo ?? d.range?.[0] ?? d.start,
      end: d.endYearsAgo ?? d.range?.[1] ?? d.end,
      uncertain: Boolean(d.uncertain ?? d.simplified)
    }));
    const root = d3.stratify().id(d=>d.id).parentId(d=>d.parentId)(nodes);
    d3.tree().size([470,860])(root);
    const oldest = Lec.K.homininChimpSplitMaxYearsAgo;
    const presentX = 920;
    root.each(d => {
      const datum = d.data;
      let years = Number.isFinite(datum.end) ? datum.end : Number.isFinite(datum.start) ? datum.start : null;
      if (/共同祖先/.test(datum.name)) years = oldest;
      if (/阿法南方古猿/.test(datum.name)) { datum.start=Lec.K.afarensisStartYearsAgo; datum.end=Lec.K.afarensisEndYearsAgo; years=datum.end; }
      if (/智人/.test(datum.name)) { datum.start=Lec.K.homoSapiensAgeYears; datum.end=0; years=0; }
      const computed = years == null || !Number.isFinite(oldest) ? NaN : Lec.P.timelineFraction(years, oldest);
      const f = Number.isFinite(computed) ? computed : d.depth / Math.max(1,root.height);
      d.py = 45 + d.x;
      d.px = 58 + Math.max(0,Math.min(1,f)) * (presentX-58);
    });
    const svg=d3.select('#phylogeny');
    const links=svg.append('g').selectAll('path').data(root.links()).join('path')
      .attr('class','p04-link').attr('d',d=>`M${d.source.px},${d.source.py} C${(d.source.px+d.target.px)/2},${d.source.py} ${(d.source.px+d.target.px)/2},${d.target.py} ${d.target.px},${d.target.py}`);
    const groups=svg.append('g').selectAll('g').data(root.descendants()).join('g')
      .attr('class',d=>`p04-node ${/灭绝/.test(d.data.status)?'is-extinct ':''}${/至今|现生/.test(d.data.status)||/智人$/.test(d.data.name)?'is-living ':''}${d.data.uncertain?'is-uncertain ':''}`)
      .attr('transform',d=>`translate(${d.px},${d.py})`).attr('role','treeitem').attr('tabindex',0)
      .attr('aria-label',d=>`${d.data.name}，${d.data.status||'谱系节点'}`)
      .on('click',(e,d)=>select(d)).on('keydown',(e,d)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(d)}});
    groups.append('circle').attr('class','hit').attr('r',24);
    groups.append('circle').attr('class','focus-ring').attr('r',19);
    groups.append('circle').attr('class','dot').attr('r',10);
    groups.append('text').attr('x',14).attr('y',-7).text(d=>d.data.name);
    groups.filter(d=>d.children==null).append('text').attr('class','status').attr('x',14).attr('y',13).text(d=>/至今|现生/.test(d.data.status)||/智人$/.test(d.data.name)?'延续至今':'已灭绝');

    function ancestors(d){return new Set(d.ancestors())}
    function lca(a,b){const aa=ancestors(a);return b.ancestors().find(x=>aa.has(x))}
    function overlap(a,b){if(!Number.isFinite(a.start)||!Number.isFinite(a.end)||!Number.isFinite(b.start)||!Number.isFinite(b.end))return false;return Lec.P.rangesOverlap([a.start,a.end],[b.start,b.end])}
    function pathSet(a,ancestor){const s=new Set();let n=a;while(n&&n!==ancestor){s.add(n);n=n.parent}if(ancestor)s.add(ancestor);return s}
    const sapiens=root.descendants().find(d=>/智人$/.test(d.data.name));
    function select(d){
      const common=lca(d,sapiens), path=new Set([...pathSet(d,common),...pathSet(sapiens,common)]);
      const peers=new Set(root.descendants().filter(n=>n!==d&&overlap(d.data,n.data)));
      groups.classed('is-muted',true).classed('is-active',n=>n===d).classed('is-related',n=>path.has(n)||peers.has(n));
      links.classed('is-path',l=>path.has(l.source)&&path.has(l.target)).classed('is-peer',l=>peers.has(l.target));
      const isRoot=d===root, living=/至今|现生/.test(d.data.status)||/智人$/.test(d.data.name), side=!pathSet(sapiens,root).has(d);
      const rel=isRoot?'共同祖先':living?'延续叶节点':peers.size?'并存支系':side?'旁支':'旁支';
      const desc=isRoot?'这是推定的共同祖先位置，不是现生黑猩猩变成人的起点。':
        /早期人族/.test(d.data.name)?'化石证据呈碎片状。这个节点是教学简化，不代表完整名单。':
        /阿法南方古猿/.test(d.data.name)?'它是南方古猿类代表，不是所有后续人类的确定直系祖先。':
        living?'仍存在不等于演化程度更高；它只是整棵树的一条叶端。':
        '这条近缘支系在叶端终止；灭绝不表示低级或失败。';
      document.querySelector('#rel').textContent=rel;document.querySelector('#name').textContent=d.data.name;
      document.querySelector('#desc').textContent=desc;document.querySelector('#level').textContent=d.parent?`${d.depth===1?'人族分枝层':'代表支系节点'}`:'共同祖先节点';
      document.querySelector('#status').textContent=living?'延续至今':(d.children?'后续支系由此分开':'已灭绝');
      let age='';
      if(isRoot && Number.isFinite(Lec.K.homininChimpSplitMaxYearsAgo)) age=`约 ${Lec.P.formatNumber(Lec.K.homininChimpSplitMaxYearsAgo/10000)} 万年前—${Lec.P.formatNumber(Lec.K.homininChimpSplitMinYearsAgo/10000)} 万年前`;
      else if(/阿法南方古猿/.test(d.data.name) && Number.isFinite(Lec.K.afarensisStartYearsAgo)) age=`约 ${Lec.P.formatNumber(Lec.K.afarensisStartYearsAgo/10000)} 万年前—${Lec.P.formatNumber(Lec.K.afarensisEndYearsAgo/10000)} 万年前`;
      else if(living && /智人$/.test(d.data.name) && Number.isFinite(Lec.K.homoSapiensAgeYears)) age=`当前证据支持约 ${Lec.P.formatNumber(Lec.K.homoSapiensAgeYears/10000)} 万年前出现`;
      else if(Number.isFinite(d.data.start)&&Number.isFinite(d.data.end)) age=`约 ${Lec.P.formatNumber(d.data.start/10000)} 万年前—${Lec.P.formatNumber(d.data.end/10000)} 万年前`;
      document.querySelector('#age').textContent=age;document.querySelector('#age-row').hidden=!age;
    }
    select(root);
  </script>
</body>
</html>
