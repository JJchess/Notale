<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>第一站：一副受重力支配的猿类身体</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{margin-top:-96px}
    .lec-header h1{font-size:28px;white-space:nowrap}
    .body-opening{
      position:relative;
      width:100%;
      height:100%;
      box-sizing:border-box;
      padding:28px 54px 24px;
      overflow:hidden;
      border-radius:var(--radius-lg);
      background:var(--text);
      color:var(--surface);
    }
    .body-opening::after{
      content:"";
      position:absolute;
      right:0;
      bottom:0;
      width:38%;
      border-bottom:3px solid var(--accent);
    }
    .opening-lead{
      position:absolute;
      top:28px;
      left:54px;
      width:365px;
      margin:0;
      color:var(--surface-muted);
    }
    .gravity-mark{
      position:absolute;
      z-index:3;
      top:26px;
      left:50%;
      width:156px;
      height:112px;
      transform:translateX(-50%);
      color:var(--warning);
      text-align:center;
    }
    .gravity-mark strong{
      display:block;
      font-size:var(--fs-h2);
      line-height:var(--lh-h2);
      letter-spacing:.12em;
    }
    .gravity-mark svg{display:block;width:44px;height:78px;margin:0 auto;color:var(--warning)}
    .body-map.k-generalization{
      position:absolute;
      inset:118px 76px 88px;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      grid-template-rows:238px 104px;
      grid-template-areas:"claim claim claim" "support support support";
      gap:16px 44px;
      align-items:stretch;
    }
    .body-map.k-generalization::before{
      top:238px;
      left:16.66%;
      width:66.68%;
      height:34px;
      border:0;
      border-top:2px solid var(--line-strong);
      border-left:2px solid var(--line-strong);
      border-right:2px solid var(--line-strong);
    }
    .body-map.k-generalization::after{display:none}
    .body-map.k-generalization > [data-claim]{
      grid-area:claim;
      align-self:stretch;
      justify-self:center;
      width:330px;
      padding:0;
      border:0;
      border-radius:0;
      background:transparent;
      box-shadow:none;
    }
    .figure{
      position:relative;
      width:100%;
      height:100%;
      display:flex;
      align-items:flex-end;
      justify-content:center;
    }
    .figure svg{width:170px;height:232px;color:var(--surface)}
    .ground{
      position:absolute;
      bottom:0;
      left:50%;
      width:250px;
      border-top:3px solid var(--warning);
      transform:translateX(-50%);
    }
    .body-map.k-generalization > [data-branch]{
      z-index:2;
      grid-area:auto;
      display:block;
      min-width:0;
    }
    .body-map.k-generalization > [data-branch] > *{
      height:100%;
      box-sizing:border-box;
      padding:16px 20px;
      border:1px solid var(--line-strong);
      border-radius:var(--radius-sm);
      background:var(--text);
      color:var(--surface);
      box-shadow:none;
      text-align:center;
    }
    .body-map h2{margin-bottom:5px;color:var(--surface);font-size:var(--fs-h2)}
    .body-map p{margin:0;color:var(--surface-muted);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .closing-claim{
      position:absolute;
      z-index:4;
      left:50%;
      bottom:20px;
      margin:0;
      padding:8px 26px;
      border-left:3px solid var(--warning);
      background:var(--text);
      color:var(--surface);
      font-size:var(--fs-lead);
      font-weight:720;
      line-height:var(--lh-lead);
      transform:translateX(-50%);
      white-space:nowrap;
    }
  </style>
</head>
<body data-page="07" data-total="48">
  <div id="stage">
    <main class="body-opening" aria-labelledby="body-map-title">
      <p class="opening-lead fs-lead" id="body-map-title">重力持续向下作用。身体必须支撑、平衡，并移动自身。</p>

      <div class="gravity-mark" aria-hidden="true">
        <strong>重力</strong>
        <svg viewBox="0 0 44 78" fill="none">
          <path d="M22 2V66M8 52l14 14 14-14" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <section class="body-map k-generalization" aria-label="重力中的身体：主张与三条支撑">
        <div data-claim>
          <div class="figure">
            <svg viewBox="0 0 170 232" role="img" aria-label="一个普通现代人中性直立轮廓">
              <circle cx="85" cy="27" r="22" fill="currentColor"/>
              <path d="M63 56c7-7 37-7 44 0l9 68-17 3-4-47-2 54 17 91H90l-5-69-5 69H60l17-91-2-54-4 47-17-3 9-68Z" fill="currentColor"/>
            </svg>
            <span class="ground" aria-hidden="true"></span>
          </div>
        </div>
        <div data-branch="left">
          <div>
            <h2>支撑自身</h2>
            <p>站立需要身体持续承受向下的重力。</p>
          </div>
        </div>
        <div data-branch="left">
          <div>
            <h2>保持平衡</h2>
            <p>直立时，身体要不断维持可控状态。</p>
          </div>
        </div>
        <div data-branch="right">
          <div>
            <h2>移动身体</h2>
            <p>每一步都要重新安排支撑与重心。</p>
          </div>
        </div>
      </section>

      <p class="closing-claim">有限的猿类身体，是全部延伸的起点。</p>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 7,
      kicker: 'BODY / LIMITS',
      title: '第一站：一副受重力支配的猿类身体',
      take: '第一站不是火箭，而是仍受重力支配的猿类身体。'
    });
    document.querySelector('.lec-page').appendChild(document.querySelector('.body-opening'));
    document.querySelector('#stage').prepend(document.querySelector('.lec-header'));
    document.querySelector('#stage').appendChild(document.querySelector('.lec-footer'));
    Deck.init({ index: 7, total: 48 });
  </script>
</body>
</html>
