<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>直立不是把背挺直</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{top:calc(50% - 96px)}
    .lec-footer{bottom:96px}
    .p08-layout{width:var(--content-w);height:var(--content-h);margin:0 auto;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(430px,.85fr);gap:var(--sp-5)}
    .p08-view{position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-lg);background:radial-gradient(circle at 48% 42%,#fffaf2 0,#edf2f7 66%,#dfe8f2 100%);box-shadow:var(--shadow-panel)}
    .p08-view canvas{cursor:grab;outline:none}.p08-view canvas:active{cursor:grabbing}.p08-view canvas:focus-visible{outline:3px solid var(--focus);outline-offset:-4px}
    .p08-topline{position:absolute;z-index:2;top:var(--sp-4);left:var(--sp-4);right:var(--sp-4);display:flex;align-items:center;justify-content:space-between;pointer-events:none}
    .p08-viewname{padding:var(--sp-2) var(--sp-3);border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:rgb(255 255 255 / 88%);color:var(--text);font-size:var(--fs-label);font-weight:750;line-height:var(--lh-label)}
    .p08-hint{color:var(--muted);font-size:var(--fs-label);line-height:var(--lh-label);background:rgb(255 255 255 / 80%);padding:var(--sp-2) var(--sp-3);border-radius:var(--radius-sm)}
    .p08-reset{position:absolute;z-index:3;right:var(--sp-4);bottom:var(--sp-4)}
    .p08-side{min-width:0;min-height:0;display:flex;flex-direction:column;gap:var(--sp-3)}
    .p08-intro{margin:0;color:var(--text);font-size:var(--fs-body);line-height:var(--lh-body)}
    .p08-chain.k-process{flex:1;display:flex;flex-direction:column;gap:var(--sp-2);min-height:0;counter-reset:none}
    .p08-chain.k-process>section{flex:1;min-height:0;padding:var(--sp-3) var(--sp-4) var(--sp-3) 58px;border-radius:var(--radius-sm);box-shadow:none;transition:background-color var(--transition-fast),border-color var(--transition-fast)}
    .p08-chain.k-process>section::before{content:attr(data-letter);position:absolute;left:var(--sp-3);top:50%;transform:translateY(-50%);margin:0;width:30px;height:30px;background:var(--surface-muted)}
    .p08-chain.k-process>section:not(:last-child)::after{content:"↓";z-index:2;top:auto;left:20px;bottom:-14px;width:24px;transform:none;color:var(--warning);font-size:var(--fs-h2);line-height:1}
    .p08-chain h2{font-size:var(--fs-body);line-height:1.35;margin:0 0 2px}
    .p08-chain p{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .p08-chain>section[data-state="current"]{border:2px solid var(--warning);background:var(--warning-soft)}
    .p08-chain>section[data-state="current"]::before{background:var(--warning);color:#fff}
    .p08-conclusion{margin:0;padding:var(--sp-3) var(--sp-4);border-left:5px solid var(--warning);background:var(--warning-soft);font-size:var(--fs-sec);line-height:var(--lh-sec);font-weight:650}
  </style>
</head>
<body data-page="08" data-total="48">
  <div id="stage">
    <main class="p08-layout">
      <section class="p08-view min0" aria-label="可旋转的单脚支撑骨架示意">
        <div class="p08-topline"><span id="viewName" class="p08-viewname">正面：下肢对齐</span><span class="p08-hint">拖动旋转 · ← → 键微调</span></div>
        <canvas id="skeleton" class="cv-fill no-pan" tabindex="0" role="img" aria-label="单脚支撑时，负荷从足底经过膝、股骨、骨盆和脊柱传到头部的三维骨架示意"></canvas>
        <button id="reset" class="p08-reset" type="button">恢复初始视角</button>
      </section>
      <aside class="p08-side min0">
        <p class="p08-intro">沿氧化橙主干向上看：每一环都把地面的支撑交给下一环。</p>
        <div class="k-process p08-chain" aria-label="从足底到头部的协同链">
          <section data-letter="A"><h2>足底建立支撑</h2><p>接触面若不稳，上方不能只靠挺直保持平衡。</p></section>
          <section data-letter="B"><h2>膝部承接负荷</h2><p>膝在承重时保持可控，而不是完全锁死。</p></section>
          <section data-letter="C" data-state="current"><h2>股骨导向骨盆</h2><p>股骨连接较宽的髋与靠近中线的膝。</p></section>
          <section data-letter="D"><h2>骨盆稳定躯干</h2><p>单脚支撑时，骨盆是受控制的连接枢纽。</p></section>
          <section data-letter="E"><h2>脊柱与头部平衡</h2><p>重心留在可恢复的支撑范围内，而非每块骨都竖直。</p></section>
        </div>
        <p class="p08-conclusion">结构只有在同一次承重中彼此配合才有意义；没有哪一项能单独完成直立行走。</p>
      </aside>
    </main>
  </div>
  <script src="assets/lib/three.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({ index: 8, kicker: 'BODY AS A SYSTEM', title: '直立不是把背挺直', take: '直立行走需要全身结构协同，不只是把背挺直' });
    Deck.init({ index: 8, total: 48 });

    const cv=document.getElementById('skeleton'), box=cv.parentElement, reset=document.getElementById('reset');
    const scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(34,1,.1,100); camera.position.set(0,2.8,10.8); camera.lookAt(0,2.8,0);
    const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true}); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    scene.add(new THREE.HemisphereLight(0xfff8e8,0x667487,2.2)); const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(4,8,7);scene.add(key);
    const body=new THREE.Group(); scene.add(body);
    const bone=new THREE.MeshStandardMaterial({color:0xe8dfcf,roughness:.72,metalness:.02});
    const dim=new THREE.MeshStandardMaterial({color:0x77818a,roughness:.85});
    const load=new THREE.MeshStandardMaterial({color:0xc46a16,roughness:.62,emissive:0x5a2100,emissiveIntensity:.18});
    const jointGeo=new THREE.SphereGeometry(.16,18,12);
    function joint(x,y,z,r=.16,mat=bone){const m=new THREE.Mesh(jointGeo,mat);m.position.set(x,y,z);m.scale.setScalar(r/.16);body.add(m);return m}
    function rod(a,b,r=.09,mat=bone){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A);const g=new THREE.CylinderGeometry(r,r,d.length(),12);const m=new THREE.Mesh(g,mat);m.position.copy(A).add(B).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());body.add(m);return m}
    function line(a,b,r=.055,mat=load){return rod(a,b,r,mat)}
    // support leg, slightly bent
    const foot=[-.28,.18,.28], ankle=[-.28,.43,.08], knee=[-.14,1.62,.02], hip=[-.52,2.75,0];
    rod([-.78,.15,.45],[.12,.15,.2],.13,load); joint(...foot,.18,load);rod(ankle,knee,.11,load);joint(...knee,.18,load);rod(knee,hip,.13,load);joint(...hip,.2,load);
    // lifted leg
    const hip2=[.52,2.75,0],knee2=[.72,1.68,-.35],ankle2=[1.05,.72,-.62];rod(hip2,knee2,.12,dim);joint(...knee2,.17,dim);rod(knee2,ankle2,.1,dim);rod([.88,.67,-.62],[1.42,.59,-.72],.11,dim);
    // pelvis
    rod([-.62,2.8,0],[.62,2.8,0],.2,bone);rod([-.55,2.8,0],[-.35,3.18,.08],.16,bone);rod([.55,2.8,0],[.35,3.18,.08],.16,bone);rod([-.35,3.18,.08],[.35,3.18,.08],.15,bone);
    // spine and rib cage
    const spine=[[0,3.0,.05],[-.05,3.45,-.08],[.05,3.95,.02],[0,4.5,-.05],[0,5.0,0]];for(let i=0;i<spine.length-1;i++)rod(spine[i],spine[i+1],.105,i<3?load:bone);spine.forEach((p,i)=>joint(...p,.13,i<4?load:bone));
    [[4.05,.62],[4.32,.72],[4.58,.66],[4.82,.52]].forEach(([y,w])=>{rod([-w,y,0],[w,y,0],.075,bone);rod([-w,y,0],[0,y-.18,.34],.055,bone);rod([w,y,0],[0,y-.18,.34],.055,bone)});
    // shoulders and arms
    rod([-.72,4.78,0],[.72,4.78,0],.11,bone);rod([-.7,4.76,0],[-.92,3.72,.12],.1,bone);rod([.7,4.76,0],[.9,3.72,-.08],.1,bone);rod([-.92,3.72,.12],[-.75,2.92,.28],.075,bone);rod([.9,3.72,-.08],[.72,2.94,-.2],.075,bone);
    // neck and skull
    rod([0,5,0],[0,5.32,0],.11,load);const skull=new THREE.Mesh(new THREE.SphereGeometry(.42,24,18),bone);skull.position.set(0,5.63,0);skull.scale.set(.82,1.08,.9);body.add(skull);
    // load arrow from ground
    line([-.28,-.02,.28],[-.28,.42,.08],.065);const cone=new THREE.Mesh(new THREE.ConeGeometry(.14,.3,16),load);cone.position.set(-.28,.5,.07);body.add(cone);
    const ground=new THREE.Mesh(new THREE.CircleGeometry(2.5,48),new THREE.MeshStandardMaterial({color:0xd7dee5,roughness:1,transparent:true,opacity:.8}));ground.rotation.x=-Math.PI/2;ground.position.y=0;scene.add(ground);
    const ring=new THREE.Mesh(new THREE.RingGeometry(.45,.52,40),new THREE.MeshBasicMaterial({color:0xc46a16,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.set(-.28,.012,.28);scene.add(ring);
    body.position.y=-.05;
    let yaw=0,drag=false,lastX=0;
    const items=[...document.querySelectorAll('.p08-chain>section')], viewName=document.getElementById('viewName');
    function classify(){const a=((yaw%(Math.PI*2))+Math.PI*2)%(Math.PI*2);let active=2,label='正面：下肢对齐';if(a>.65&&a<2.48){active=a<1.55?4:3;label=a<1.55?'侧面：支撑与脊柱曲线':'背面：骨盆两侧关系'}else if(a>=2.48&&a<3.8){active=3;label='背面：骨盆两侧关系'}else if(a>=3.8&&a<5.63){active=a<4.72?3:4;label=a<4.72?'背面：骨盆两侧关系':'侧面：支撑与脊柱曲线'}items.forEach((el,i)=>el.dataset.state=i===active?'current':'');viewName.textContent=label}
    function size(){const w=box.clientWidth,h=box.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();render()}
    function render(){body.rotation.y=yaw;renderer.render(scene,camera);classify()}
    cv.addEventListener('pointerdown',e=>{drag=true;lastX=Deck.pt(cv,e).x;cv.setPointerCapture(e.pointerId)});
    cv.addEventListener('pointermove',e=>{if(!drag)return;const x=Deck.pt(cv,e).x;yaw+= (x-lastX)*.012;lastX=x;render()});
    cv.addEventListener('pointerup',()=>drag=false);cv.addEventListener('pointercancel',()=>drag=false);
    cv.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();yaw+=(e.key==='ArrowLeft'?-1:1)*(e.shiftKey?.28:.1);render()}});
    reset.addEventListener('click',()=>{yaw=0;render();cv.focus()});
    Deck.onResize(size);size();
  </script>
</body>
</html>
