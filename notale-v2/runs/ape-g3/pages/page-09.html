<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>两条腿并非处处占优</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{top:calc(50% - var(--header-h))}
    .lec-header{transform:translateY(-92px)}
    .lec-footer{transform:translateY(calc(-1 * var(--header-h)))}
    .lab{height:604px;margin-top:var(--header-h);display:grid;grid-template-columns:minmax(0,42fr) minmax(0,58fr);gap:24px;padding:8px 0;box-sizing:border-box}
    .motion-side,.data-side{min-width:0;min-height:0}
    .motion-side{display:flex;flex-direction:column;gap:12px}
    .motion-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
    .motion-head p{margin:0;color:var(--muted)}
    .tracks{position:relative;flex:1;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-panel);overflow:hidden}
    .track{position:relative;height:50%;box-sizing:border-box;padding:14px 18px;border-bottom:1px solid var(--line);transition:background-color 200ms ease,opacity 200ms ease}
    .track:last-child{border-bottom:0}.track.is-active{background:var(--accent-soft)}
    .track:not(.is-active){opacity:.72}
    .track-title{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center}
    .track-title button{min-height:36px;padding:4px 12px;background:var(--surface);font-size:var(--fs-label)}
    .track-title span{color:var(--muted);font-size:var(--fs-label)}
    .road{position:absolute;left:18px;right:18px;bottom:25px;height:4px;background:var(--line-strong)}
    .road:before{content:"";position:absolute;inset:-10px 0 auto;height:7px;background:repeating-linear-gradient(90deg,var(--line-strong) 0 2px,transparent 2px 48px)}
    .walker{position:absolute;left:48%;bottom:29px;width:92px;height:120px;transform:translateX(-50%);color:var(--accent-strong)}
    .walker svg{width:100%;height:100%;overflow:visible}.walker line,.walker circle,.walker path{stroke:currentColor;stroke-width:8;stroke-linecap:round;fill:none;transform-origin:center}
    .walker .head{fill:var(--surface);stroke-width:7}.quad{height:94px;width:132px;color:var(--secondary)}
    .quad svg{transform:rotate(6deg)}
    .terrain{position:absolute;left:18px;right:18px;bottom:8px;height:12px;border-radius:50%;background:var(--surface-muted);transition:clip-path 220ms ease}
    .scale{display:flex;justify-content:space-between;color:var(--muted);font-size:var(--fs-tick);font-variant-numeric:tabular-nums}
    .data-side{display:flex;flex-direction:column;gap:10px}
    .controls{display:grid;grid-template-columns:1fr 1fr 1.02fr auto;gap:10px;align-items:end}
    .control{min-width:0}.control label{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;font-size:var(--fs-label);font-weight:700}.control output{min-width:0;padding:0;border:0;background:transparent;color:var(--accent-strong);font-size:var(--fs-label);line-height:1.4}.control input{width:100%;accent-color:var(--accent)}
    .control select{width:100%;height:42px;padding:4px 8px}.reset{height:42px;white-space:nowrap}
    .matrix{--comparison-cols:2;flex:1;grid-template-columns:minmax(132px,.72fr) repeat(2,minmax(0,1fr));grid-template-rows:48px repeat(4,minmax(0,1fr))}
    .matrix>*{padding:8px 12px}.matrix [data-heading]{font-size:var(--fs-body);justify-content:space-between;cursor:pointer}.matrix [data-heading].selected{box-shadow:inset 0 0 0 2px var(--accent)}
    .axis{display:flex;align-items:center;font-size:var(--fs-sec);line-height:1.35}.cell{position:relative;display:flex;flex-direction:column;justify-content:center;gap:5px;font-size:var(--fs-label);line-height:1.35;transition:background-color 180ms ease,box-shadow 180ms ease}.cell.better{box-shadow:inset 0 0 0 2px var(--warning);background:var(--warning-soft)}
    .value{display:flex;align-items:baseline;justify-content:space-between;gap:6px;font-weight:750}.value strong{font-size:var(--fs-body);font-variant-numeric:tabular-nums}.tag{color:var(--muted);font-size:var(--fs-label)}
    .bar{height:7px;border-radius:8px;background:var(--surface-muted);overflow:hidden}.bar i{display:block;height:100%;width:50%;border-radius:inherit;background:var(--accent);transition:width 220ms ease}.quad-cell .bar i{background:var(--secondary)}
    .footline{display:flex;align-items:center;justify-content:space-between;gap:18px}.boundary{margin:0;max-width:570px}.trip{color:var(--muted);font-size:var(--fs-label);white-space:nowrap}
    @media (prefers-reduced-motion:reduce){*{transition-duration:0ms!important}.limb{animation:none!important}}
  </style>
</head>
<body data-page="09" data-total="48">
  <div id="stage">
    <main class="lab" aria-label="双足与四足运动模式参数比较台">
      <section class="motion-side min0" aria-labelledby="motion-title">
        <div class="motion-head"><div><h2 id="motion-title">同路程、同速度</h2><p class="fs-sec">动作只表示姿态与支撑点，不表示精确解剖。</p></div><span class="fs-label">同步侧视</span></div>
        <div class="tracks">
          <div class="track is-active" id="bipedTrack">
            <div class="track-title"><button type="button" data-mode="biped" aria-pressed="true">双足步行</button><span>双点交替支撑</span></div>
            <div class="walker" aria-hidden="true"><svg viewBox="0 0 90 130"><circle class="head" cx="46" cy="15" r="11"/><line x1="45" y1="28" x2="45" y2="72"/><line class="arm limb a1" x1="43" y1="42" x2="20" y2="67"/><line class="arm limb a2" x1="45" y1="42" x2="69" y2="65"/><line class="leg limb l1" x1="44" y1="71" x2="25" y2="111"/><line class="leg limb l2" x1="45" y1="71" x2="68" y2="109"/></svg></div>
            <div class="terrain"></div><div class="road"></div>
          </div>
          <div class="track" id="quadTrack">
            <div class="track-title"><button type="button" data-mode="quad" aria-pressed="false">类人猿式四足</button><span>手足共同支撑</span></div>
            <div class="walker quad" aria-hidden="true"><svg viewBox="0 0 140 100"><circle class="head" cx="112" cy="25" r="10"/><path d="M31 41 Q66 18 102 38"/><line class="limb a1" x1="95" y1="39" x2="116" y2="80"/><line class="limb a2" x1="80" y1="38" x2="91" y2="82"/><line class="limb l1" x1="38" y1="39" x2="18" y2="82"/><line class="limb l2" x1="50" y1="37" x2="57" y2="82"/></svg></div>
            <div class="terrain"></div><div class="road"></div>
          </div>
        </div>
        <div class="scale"><span>起点</span><span id="distanceScale">终点</span></div>
      </section>

      <section class="data-side min0" aria-label="参数与四维比较">
        <div class="controls">
          <div class="control"><label for="speed">速度 <output id="speedOut"></output></label><input id="speed" type="range"></div>
          <div class="control"><label for="distance">距离 <output id="distanceOut"></output></label><input id="distance" type="range"></div>
          <div class="control"><label for="terrain">地面复杂度</label><select id="terrain"></select></div>
          <button class="reset" id="reset" type="button">对比默认条件</button>
        </div>
        <div class="k-comparison matrix" role="table" aria-label="双足与四足的四项对齐比较">
          <div data-axis></div><button type="button" data-heading data-mode="biped" class="selected" aria-pressed="true">双足步行</button><button type="button" data-heading data-mode="quad" aria-pressed="false">四足行走</button>
          <div data-axis class="axis">单位距离能耗</div><div class="cell" id="bUnit"></div><div class="cell quad-cell" id="qUnit"></div>
          <div data-axis class="axis">全程总能耗</div><div class="cell" id="bTrip"></div><div class="cell quad-cell" id="qTrip"></div>
          <div data-axis class="axis">稳定余量</div><div class="cell" id="bStable"></div><div class="cell quad-cell" id="qStable"></div>
          <div data-axis class="axis">手部占用</div><div class="cell" id="bHands"><div class="value"><strong>可用于携带或操作</strong></div><span class="tag">不参与行走支撑</span></div><div class="cell quad-cell" id="qHands"><div class="value"><strong>参与支撑</strong></div><span class="tag">手足共同承重</span></div>
        </div>
        <div class="footline"><p class="note boundary">归一化教学模型用于比较条件变化，不是对特定物种或个体的医学测量。稳定余量也不是跌倒概率。</p><span class="trip" id="tripTime" aria-live="polite"></span></div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({ index: 9, kicker: 'LOCOMOTION TRADE-OFFS', title: '两条腿并非处处占优', take: '双足行走在某些速度、距离和地面条件下可以更省能，但它不是所有场景中的万能最优解。' });
    Deck.init({ index: 9, total: 48 });

    const K=Lec.K, P=Lec.P;
    const model={
      speedMin:K.locomotionDemoSpeedMin ?? 0.4, speedMax:K.locomotionDemoSpeedMax ?? 2, speedDefault:K.locomotionDemoSpeedDefault ?? 1.2, speedStep:K.locomotionDemoSpeedStep ?? 0.1,
      distanceMin:K.locomotionDemoDistanceMin ?? 10, distanceMax:K.locomotionDemoDistanceMax ?? 2000, distanceDefault:K.locomotionDemoDistanceDefault ?? 1000, distanceStep:K.locomotionDemoDistanceStep ?? 10,
      terrains:K.locomotionTerrainScenarios ?? [{label:'平整',value:0},{label:'起伏',value:.5},{label:'障碍较多',value:1}],
      bCurve:K.bipedWalkingCostCurve ?? [[.4,1.34],[.8,.88],[1.2,.68],[1.6,.82],[2,1.18]], qCurve:K.quadrupedalWalkingCostCurve ?? [[.4,1.08],[.8,.96],[1.2,.94],[1.6,1.02],[2,1.16]],
      bStart:K.bipedWalkingStartCost ?? 18,qStart:K.quadrupedalWalkingStartCost ?? 9,tol:K.locomotionComparisonTolerance ?? .06
    };
    const $=id=>document.getElementById(id), speed=$('speed'), distance=$('distance'), terrain=$('terrain');
    function terrainItems(){return Array.isArray(model.terrains)?model.terrains:Object.entries(model.terrains).map(([label,value])=>({label,value}));}
    const terrains=terrainItems().map((d,i)=>({label:d.label||d.name||['平整','起伏','障碍较多'][i],value:Number(d.value??d.coefficient??d.complexity??i/2)}));
    terrains.forEach((d,i)=>terrain.add(new Option(d.label,String(i))));
    Object.assign(speed,{min:model.speedMin,max:model.speedMax,step:model.speedStep,value:model.speedDefault}); Object.assign(distance,{min:model.distanceMin,max:model.distanceMax,step:model.distanceStep,value:model.distanceDefault});
    function interpolate(curve,x){if(P.interpolateCurve)return P.interpolateCurve(curve,x); const pts=curve.map(d=>Array.isArray(d)?d:[d.x,d.y]); if(x<=pts[0][0])return pts[0][1]; for(let i=1;i<pts.length;i++)if(x<=pts[i][0]){const t=(x-pts[i-1][0])/(pts[i][0]-pts[i-1][0]);return P.lerp(pts[i-1][1],pts[i][1],t)} return pts.at(-1)[1]}
    function terrainMult(kind,c){if(P.locomotionTerrainMultiplier)return P.locomotionTerrainMultiplier(kind,c); return kind==='biped'?1+.42*c:1+.18*c}
    function trip(unit,d,start){return P.locomotionTripCost?P.locomotionTripCost(unit,d,start):start+unit*d}
    function stable(kind,c){if(P.locomotionStabilityMargin)return P.locomotionStabilityMargin(kind==='biped'?K.bipedStabilityModel:K.quadrupedalStabilityModel,c);return Math.max(0,(kind==='biped'?.72:.9)-(kind==='biped'?.48:.22)*c)}
    function close(a,b){return (P.relativeDifference?P.relativeDifference(a,b):Math.abs(a-b)/Math.max(Math.abs(a),Math.abs(b)))<=model.tol}
    function fmt(n,d=2){return P.formatNumber(n,{maximumFractionDigits:d})}
    function cell(el,value,max,label,lower=true){el.innerHTML='<div class="value"><strong>'+fmt(value)+'</strong><span class="tag">'+label+'</span></div><div class="bar"><i style="width:'+Math.max(4,value/max*100)+'%"></i></div>'}
    function mark(a,b,lower=true){a.classList.remove('better');b.classList.remove('better'); if(close(Number(a.dataset.v),Number(b.dataset.v)))return ['接近','接近']; const av=Number(a.dataset.v),bv=Number(b.dataset.v),awin=lower?av<bv:av>bv;(awin?a:b).classList.add('better');return awin?['较优','较弱']:['较弱','较优']}
    function update(){const v=+speed.value,d=+distance.value,c=terrains[+terrain.value].value; const bu=interpolate(model.bCurve,v)*terrainMult('biped',c),qu=interpolate(model.qCurve,v)*terrainMult('quad',c),bt=trip(bu,d,model.bStart),qt=trip(qu,d,model.qStart),bs=stable('biped',c),qs=stable('quad',c);
      $('speedOut').textContent=fmt(v,1)+' m/s';$('distanceOut').textContent=P.formatDistance(d);$('distanceScale').textContent=P.formatDistance(d);$('tripTime').textContent='行程时间 '+P.formatDuration(d/v);
      const pairs=[[ $('bUnit'),$('qUnit'),bu,qu,true],[ $('bTrip'),$('qTrip'),bt,qt,true],[ $('bStable'),$('qStable'),bs,qs,false]];
      pairs.forEach(([a,b,av,bv,low])=>{a.dataset.v=av;b.dataset.v=bv;const tags=mark(a,b,low),mx=Math.max(av,bv)*1.08;cell(a,av,mx,tags[0]);cell(b,bv,mx,tags[1])});
      document.querySelectorAll('.terrain').forEach(el=>el.style.clipPath=c>.75?'polygon(0 45%,10% 0,20% 55%,31% 10%,43% 65%,56% 4%,69% 60%,82% 5%,100% 48%,100% 100%,0 100%)':c>.2?'polygon(0 45%,18% 15%,35% 55%,55% 20%,75% 58%,100% 25%,100% 100%,0 100%)':'none');
      document.documentElement.style.setProperty('--pace',String(Math.max(.45,1.8-v*.55))+'s');
    }
    function selectMode(mode){document.querySelectorAll('[data-mode]').forEach(x=>{const on=x.dataset.mode===mode;x.classList.toggle('selected',on);x.setAttribute('aria-pressed',String(on))});$('bipedTrack').classList.toggle('is-active',mode==='biped');$('quadTrack').classList.toggle('is-active',mode==='quad')}
    document.querySelectorAll('[data-mode]').forEach(x=>x.addEventListener('click',()=>selectMode(x.dataset.mode)));[speed,distance,terrain].forEach(x=>x.addEventListener('input',update));$('reset').addEventListener('click',()=>{speed.value=model.speedDefault;distance.value=model.distanceDefault;terrain.value='0';selectMode('biped');update();speed.focus()});
    if(!Deck.reduced()){document.querySelectorAll('.limb').forEach((el,i)=>{el.animate([{transform:'rotate('+(i%2?-14:14)+'deg)'},{transform:'rotate('+(i%2?14:-14)+'deg)'}],{duration:900,iterations:Infinity,direction:'alternate',easing:'ease-in-out',delay:i%2?0:-450})})}
    update();
  </script>
</body>
</html>
