<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>直立的骨盆，也必须让新生儿通过</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    html{transform:translateY(calc(-1 * var(--header-h)))}
    .lec-header__inner{transform:translateY(4px)}
    #stage{top:50% !important}
    .birth-page{position:absolute;left:96px;top:140px;width:1408px;height:620px;display:grid;grid-template-rows:416px 188px;gap:16px;min-width:0;min-height:0}
    .birth-stage{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-lg);background:linear-gradient(120deg,var(--surface),var(--surface-soft));box-shadow:var(--shadow-panel)}
    #pelvis-canvas{position:absolute;inset:0}
    .stage-hint{position:absolute;z-index:2;top:16px;left:20px;max-width:380px;margin:0;color:var(--muted);font-size:var(--fs-label);line-height:var(--lh-label);pointer-events:none}
    .stage-status{position:absolute;z-index:2;top:16px;right:20px;width:300px;box-sizing:border-box;padding:12px 16px;border-left:4px solid var(--accent);background:rgb(255 255 255 / 88%);font-size:var(--fs-sec);line-height:var(--lh-sec);pointer-events:none}
    .stage-status strong{display:block;margin-bottom:2px;font-size:var(--fs-body);color:var(--text)}
    .reset{position:absolute;z-index:3;right:20px;bottom:16px}
    .mechanics{position:absolute;z-index:2;inset:0;pointer-events:none;opacity:0;transition:opacity 220ms ease-out}
    .mechanics.shown{opacity:1}
    .mech{position:absolute;padding:7px 12px;border:1px solid var(--warning);border-radius:var(--radius-sm);background:var(--warning-soft);color:var(--text);font-size:var(--fs-label);font-weight:700;line-height:var(--lh-label)}
    .mech.load{top:82px;left:635px}.mech.walk{top:205px;left:245px}.mech.channel{top:314px;left:790px}
    .stage-focus:focus-visible{outline:4px solid var(--focus);outline-offset:-5px}
    .steps.k-process{gap:26px;height:188px}
    .steps.k-process>article{padding:12px 12px 10px;transition:background-color 180ms ease-out,border-color 180ms ease-out,opacity 180ms ease-out}
    .steps.k-process>article::before{width:26px;height:26px;margin-bottom:7px}
    .steps.k-process>:not(:last-child)::after{left:calc(100% + 1px);width:24px}
    .steps h2{font-size:var(--fs-body);line-height:var(--lh-body);margin:0 0 3px}
    .steps p{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .steps [data-state="future"]{opacity:.55}
    @media (prefers-reduced-motion:reduce){.mechanics,.steps.k-process>article{transition:none}}
  </style>
</head>
<body data-page="10" data-total="48">
  <div id="stage">
    <main class="birth-page" aria-label="穿越骨盆通道互动示意">
      <section class="birth-stage stage-focus no-pan min0" id="interaction" tabindex="0" role="application" aria-describedby="keys status-text">
        <p class="stage-hint" id="keys">拖动胎头；拖动圆形手柄旋转。键盘：方向键移动，［与］旋转，空格确认。</p>
        <div class="stage-status" aria-live="polite"><strong id="status-title">入口对齐</strong><span id="status-text">先观察入口方向，再调整胎头。</span></div>
        <div id="pelvis-canvas" aria-hidden="true"></div>
        <div class="mechanics" id="mechanics">
          <span class="mech load">↓ 承接躯干负荷</span><span class="mech walk">稳定直立与行走 ↔</span><span class="mech channel">保留分娩通道 ↘</span>
        </div>
        <button class="reset" id="reset" type="button">重新穿越</button>
      </section>
      <section class="steps k-process" id="steps" aria-label="六步穿越过程">
        <article data-state="current"><h2>入口对齐</h2><p>观察入口与胎头长轴。</p></article>
        <article data-state="future"><h2>进入入口</h2><p>方向匹配，不只是头够小。</p></article>
        <article data-state="future"><h2>沿通道下降</h2><p>中心线开始弯曲。</p></article>
        <article data-state="future"><h2>在中段旋转</h2><p>只向下会在受限处停止。</p></article>
        <article data-state="future"><h2>通过出口</h2><p>长轴重新匹配出口方向。</p></article>
        <article data-state="future"><h2>完全娩出</h2><p>同一结构承担多项任务。</p></article>
      </section>
    </main>
  </div>
  <script src="assets/lib/konva.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 10,
      kicker: 'BODY TRADE-OFFS',
      title: '直立的骨盆，也必须让新生儿通过',
      take: '直立所需的骨盆与分娩所需的通道形成真实权衡。'
    });
    Deck.init({ index: 10, total: 48 });

    const W=1406,H=414;
    const nodes=[
      {x:670,y:82,r:-18},{x:675,y:132,r:-8},{x:690,y:190,r:8},
      {x:735,y:247,r:35},{x:815,y:300,r:62},{x:925,y:340,r:72}
    ];
    const copy=[
      ['入口对齐','先观察入口方向，再调整胎头。'],
      ['进入入口','方向匹配后，胎头才能进入。'],
      ['沿通道下降','通道中心线由竖直转为弯曲。'],
      ['在中段旋转','通道方向变了。试着改变方向。'],
      ['通过出口','让胎头长轴与出口方向对齐。'],
      ['完全娩出','分娩通道与直立负荷由同一骨盆承担。']
    ];
    const stage=new Konva.Stage({container:'pelvis-canvas',width:W,height:H});
    const layer=new Konva.Layer(); stage.add(layer);
    const soft=Deck.token('--surface-muted'), line=Deck.token('--line-strong');
    const orange=Deck.token('--warning'), orangeSoft=Deck.token('--warning-soft');
    const blue=Deck.token('--accent'), muted=Deck.token('--muted');

    const pelvis=new Konva.Path({data:'M 445 72 C 500 42 585 48 646 83 C 687 107 717 148 724 193 C 731 238 775 274 852 306 L 958 346 M 963 387 C 839 374 739 337 675 280 C 625 235 612 180 588 151 C 552 108 500 111 448 127 Z',fill:soft,stroke:line,strokeWidth:4,closed:true});
    layer.add(pelvis);
    layer.add(new Konva.Path({data:'M 670 82 C 665 148 680 207 735 247 C 790 287 843 323 925 340',stroke:blue,strokeWidth:5,dash:[12,10],opacity:.5,lineCap:'round'}));
    layer.add(new Konva.Ellipse({x:670,y:92,radiusX:92,radiusY:37,rotation:-18,stroke:line,strokeWidth:3,dash:[9,7],opacity:.55}));
    layer.add(new Konva.Ellipse({x:885,y:326,radiusX:92,radiusY:37,rotation:62,stroke:line,strokeWidth:3,dash:[9,7],opacity:.55}));
    const trail=new Konva.Line({points:[],stroke:blue,strokeWidth:8,opacity:.28,lineCap:'round',lineJoin:'round'}); layer.add(trail);
    nodes.forEach((n,i)=>layer.add(new Konva.Circle({x:n.x,y:n.y,radius:7,fill:i?line:blue,opacity:i?0.42:0.9}))); 
    const head=new Konva.Group({x:nodes[0].x,y:nodes[0].y,rotation:0,draggable:true});
    const oval=new Konva.Ellipse({radiusX:48,radiusY:34,fill:orangeSoft,stroke:orange,strokeWidth:4,shadowColor:muted,shadowBlur:8,shadowOpacity:.22});
    const axis=new Konva.Line({points:[-30,0,30,0],stroke:orange,strokeWidth:3});
    const handle=new Konva.Circle({x:0,y:-58,radius:11,fill:orange,stroke:'white',strokeWidth:3,draggable:true});
    head.add(oval,axis,new Konva.Line({points:[0,-33,0,-48],stroke:orange,strokeWidth:2}),handle);layer.add(head);layer.draw();

    let current=0,blocked=false;
    const cards=[...document.querySelectorAll('#steps article')], title=document.querySelector('#status-title'), text=document.querySelector('#status-text');
    function angleDiff(a,b){return Math.abs((((a-b)+180)%360+360)%360-180)}
    function updateUI(message){cards.forEach((c,i)=>c.dataset.state=i<current?'done':i===current?'current':'future');title.textContent=copy[current][0];text.textContent=message||copy[current][1];document.querySelector('#mechanics').classList.toggle('shown',current===5)}
    function snap(i){const n=nodes[i];head.position({x:n.x,y:n.y});head.rotation(n.r);handle.position({x:0,y:-58});trail.points(nodes.slice(0,i+1).flatMap(p=>[p.x,p.y]));layer.draw()}
    function testAdvance(){if(current>=5)return;const n=nodes[current+1],dx=head.x()-n.x,dy=head.y()-n.y,near=Math.hypot(dx,dy)<78,aligned=angleDiff(head.rotation(),n.r)<24;if(near&&aligned){current++;snap(current);updateUI();return true}if(near&&!aligned){blocked=true;oval.stroke(orange);oval.dash([7,5]);updateUI('位置接近，但方向不合适。试着改变方向。');layer.draw()}return false}
    head.on('dragmove',()=>{const next=nodes[Math.min(current+1,5)];if(head.y()>next.y+45){head.y(next.y+45);updateUI('通道方向变了。试着改变方向。')}testAdvance()});
    head.on('dragend',()=>{if(!testAdvance()){oval.dash([]);snap(current)}});
    handle.on('dragmove',e=>{e.cancelBubble=true;const a=Math.atan2(handle.y(),handle.x())*180/Math.PI+90;head.rotation(head.rotation()+a);handle.position({x:0,y:-58});layer.batchDraw()});
    handle.on('dragend',e=>{e.cancelBubble=true;testAdvance()});
    document.querySelector('#interaction').addEventListener('keydown',e=>{let acted=true,step=e.shiftKey?12:6;if(e.key==='ArrowLeft')head.x(head.x()-step);else if(e.key==='ArrowRight')head.x(head.x()+step);else if(e.key==='ArrowUp')head.y(head.y()-step);else if(e.key==='ArrowDown')head.y(head.y()+step);else if(e.key==='[')head.rotation(head.rotation()-6);else if(e.key===']')head.rotation(head.rotation()+6);else if(e.key===' '){testAdvance()}else acted=false;if(acted){e.preventDefault();layer.draw()}});
    document.querySelector('#reset').addEventListener('click',()=>{current=0;blocked=false;oval.dash([]);snap(0);head.rotation(0);updateUI()});
    updateUI();
  </script>
</body>
</html>
