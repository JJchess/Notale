<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>脑只占身体一小部分，却持续领取一大笔能量</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    body{position:relative;top:-96px}
    .p11{width:var(--content-w);height:var(--content-h);display:grid;grid-template-rows:52px 1fr 78px;gap:12px}
    .p11-intro{display:flex;align-items:center;justify-content:space-between;gap:24px}
    .p11-intro p{margin:0;color:var(--muted)}
    .p11-tags{display:flex;align-items:center;gap:10px}
    .p11-tags button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px rgb(11 115 224 / 16%)}
    .p11-tags button[disabled]{opacity:.45;cursor:default}
    .p11-board{--comparison-cols:3;grid-template-columns:174px repeat(3,minmax(0,1fr));grid-template-rows:54px 1fr}
    .p11-axis{display:flex;flex-direction:column;justify-content:center;gap:5px}
    .p11-axis strong{font-size:var(--fs-body)}
    .p11-axis span{color:var(--muted);font-size:var(--fs-label)}
    .p11-cell{position:relative;display:grid;grid-template-rows:1fr auto;gap:6px;min-height:0}
    .p11-chart{min-height:0;width:100%}
    .p11-status{min-height:44px;margin:0;display:flex;align-items:center;color:var(--muted)}
    .p11-result{border-left:4px solid var(--accent)}
    .p11-result[hidden]{display:none}
    .p11-bottom{display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px}
    .p11-bottom p{margin:0}
    .p11-take{font-weight:720;color:var(--text)}
    .p11-note{color:var(--muted)}
    .p11-reset{white-space:nowrap}
  </style>
</head>
<body data-page="11" data-total="48">
  <div id="stage">
    <main class="p11" aria-label="脑与身体的质量和静息能耗比较">
      <div class="p11-intro">
        <p class="fs-body">把两个对象配到静息能耗条，再比较它们的质量份额。</p>
        <div class="p11-tags ctl" aria-label="待配对对象">
          <button id="tagBrain" draggable="true" aria-pressed="false" data-object="brain">脑</button>
          <button id="tagRest" draggable="true" aria-pressed="false" data-object="rest">其余身体</button>
          <span id="targetHint" class="fs-label" aria-live="polite">选择标签，再点能耗区段</span>
        </div>
      </div>

      <section class="k-comparison p11-board" aria-label="三联对照表">
        <div data-axis class="p11-axis"><strong>同一参考成人</strong><span>三种共同尺度</span></div>
        <div data-heading>质量账本</div>
        <div data-heading data-diff>静息能耗账本</div>
        <div data-heading>配对后的强度</div>

        <div data-axis class="p11-axis"><strong>质量 / 能耗 / 强度</strong><span>每列对象保持一致</span></div>
        <div class="p11-cell min0">
          <div id="massChart" class="p11-chart" role="img" aria-label="参考成人中，脑与其余身体的质量份额堆叠条"></div>
          <p id="massText" class="fs-sec p11-status"></p>
        </div>
        <div class="p11-cell min0" data-diff>
          <div id="energyChart" class="p11-chart no-pan" role="button" tabindex="0" aria-label="静息能耗的两个未命名区段。选择标签后，方向键切换区段，按回车放置。"></div>
          <p id="feedback" class="fs-sec p11-status" aria-live="polite">两个区段合计为全身静息能耗。</p>
        </div>
        <div class="p11-cell min0">
          <div id="intensityChart" class="p11-chart" role="img" aria-label="完成配对后显示脑、其余身体与全身平均的单位质量能耗强度"></div>
          <p id="result" class="fs-sec p11-status p11-result" hidden aria-live="polite"></p>
        </div>
      </section>

      <div class="p11-bottom">
        <div>
          <p class="fs-body p11-take">更大的脑不是免费升级：安静休息时，它仍需要持续的能量供应。</p>
          <p class="fs-sec p11-note">这里比较的是组织的能量预算，不是智力排名。参考值用于比较数量级；年龄、体型、生理状态与测量方法都会改变实际结果。</p>
        </div>
        <button id="reset" class="p11-reset">重置配对</button>
      </div>
    </main>
  </div>

  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 11,
      kicker: 'BODY BUDGET',
      title: '脑只占身体一小部分，却持续领取一大笔能量',
      take: '更大的脑不是免费升级，它需要持续而昂贵的能量供应'
    });
    Deck.init({ index: 11, total: 48 });

    const K=Lec.K, P=Lec.P;
    K.p11ReferenceBodyMass ??= 70;
    K.p11ReferenceBrainMass ??= 1.4;
    K.p11ReferenceRestingPower ??= 100;
    K.p11ReferenceBrainRestingPower ??= 20;
    K.p11WholeBodyIntensityBaseline ??= 1;
    P.powerPerMass ||= (power,mass)=>power/mass;
    P.kilogramsToGrams ||= kg=>kg*1000;
    P.percentageTicks ||= ()=>[0,20,40,60,80,100];
    P.chartDomain ||= values=>Math.ceil(Math.max(...values));
    P.numericTicks ||= (min,max)=>{const step=Math.max(1,Math.ceil((max-min)/5));const out=[];for(let v=min;v<=max;v+=step)out.push(v);return out};
    const body=K.p11ReferenceBodyMass, brain=K.p11ReferenceBrainMass, rest=body-brain;
    const wholeW=K.p11ReferenceRestingPower, brainW=K.p11ReferenceBrainRestingPower, restW=wholeW-brainW;
    const brainMassPct=P.percent(brain,body), restMassPct=P.percent(rest,body);
    const brainEnergyPct=P.percent(brainW,wholeW), restEnergyPct=P.percent(restW,wholeW);
    const avgDensity=P.powerPerMass(wholeW,body), brainDensity=P.powerPerMass(brainW,brain), restDensity=P.powerPerMass(restW,rest);
    const brainIntensity=brainDensity/avgDensity, restIntensity=restDensity/avgDensity, baseline=K.p11WholeBodyIntensityBaseline;
    const pctTicks=P.percentageTicks();
    const intensityMax=P.chartDomain([brainIntensity,restIntensity,baseline]);
    const intensityTicks=P.numericTicks(0,intensityMax);
    const fmt=n=>P.formatNumber(n);
    const colors={brain:Deck.token('--accent'),rest:Deck.token('--secondary'),muted:Deck.token('--surface-muted'),line:Deck.token('--line-strong'),text:Deck.token('--text'),sub:Deck.token('--muted')};
    const charts=[];
    function chart(el){const c=echarts.init(el,null,{renderer:'svg'});charts.push(c);return c}
    const massChart=chart(document.getElementById('massChart'));
    const energyChart=chart(document.getElementById('energyChart'));
    const intensityChart=chart(document.getElementById('intensityChart'));
    const commonGrid={left:18,right:18,top:58,bottom:38};
    const xPct={type:'value',min:0,max:100,interval:pctTicks.length>1?pctTicks[1]-pctTicks[0]:20,axisLabel:{fontSize:12,formatter:'{value}%'},axisLine:{lineStyle:{color:colors.line}},splitLine:{lineStyle:{color:Deck.rgba('--line-strong',.18)}}};
    massChart.setOption({animation:false,grid:commonGrid,xAxis:xPct,yAxis:{type:'category',data:['质量'],axisLabel:{fontSize:16,color:colors.text},axisTick:{show:false}},series:[
      {name:'脑',type:'bar',stack:'total',data:[brainMassPct],itemStyle:{color:colors.brain},label:{show:false,formatter:''}},
      {name:'其余身体',type:'bar',stack:'total',data:[restMassPct],itemStyle:{color:colors.rest},label:{show:true,position:'inside',fontSize:16,color:'#fff',formatter:()=>`其余身体\n${fmt(rest)} kg · ${fmt(restMassPct)}%`}}
    ]});
    document.getElementById('massText').textContent=`脑 ${fmt(P.kilogramsToGrams(brain))} g · ${fmt(brainMassPct)}%；全身 ${fmt(body)} kg · ${fmt(P.percent(body,body))}%`;

    let selected=null,target=0,placed={brain:false,rest:false};
    function energyOption(){
      const names=[placed.brain?'脑':'区段 A',placed.rest?'其余身体':'区段 B'];
      return {animation:false,grid:commonGrid,xAxis:xPct,yAxis:{type:'category',data:['静息能耗'],axisLabel:{fontSize:16,color:colors.text},axisTick:{show:false}},series:[
        {name:names[0],type:'bar',stack:'total',data:[brainEnergyPct],itemStyle:{color:placed.brain?colors.brain:colors.muted,borderColor:selected&&target===0?colors.text:'transparent',borderWidth:3},label:{show:true,position:'inside',fontSize:16,color:colors.text,formatter:()=>placed.brain?`脑\n${fmt(brainW)} W · ${fmt(brainEnergyPct)}%`:'区段 A'}},
        {name:names[1],type:'bar',stack:'total',data:[restEnergyPct],itemStyle:{color:placed.rest?colors.rest:colors.muted,borderColor:selected&&target===1?colors.text:'transparent',borderWidth:3},label:{show:true,position:'inside',fontSize:16,color:colors.text,formatter:()=>placed.rest?`其余身体\n${fmt(restW)} W · ${fmt(restEnergyPct)}%`:'区段 B'}}
      ]};
    }
    function drawEnergy(){energyChart.setOption(energyOption(),true)}
    drawEnergy();
    intensityChart.setOption({animation:false,grid:{left:82,right:22,top:28,bottom:38},xAxis:{type:'value',min:0,max:intensityMax,interval:intensityTicks.length>1?intensityTicks[1]-intensityTicks[0]:1,axisLabel:{fontSize:12,formatter:'{value}×'},axisLine:{lineStyle:{color:colors.line}},splitLine:{lineStyle:{color:Deck.rgba('--line-strong',.18)}}},yAxis:{type:'category',data:['全身平均','其余身体','脑'],axisLabel:{fontSize:14,color:colors.text}},series:[{type:'bar',data:[0,0,0],itemStyle:{color:colors.muted},label:{show:true,position:'right',fontSize:14,formatter:''}}]});

    const buttons=[document.getElementById('tagBrain'),document.getElementById('tagRest')];
    function select(obj){if(placed[obj])return;selected=obj;buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.object===obj)));document.getElementById('targetHint').textContent=`已选${obj==='brain'?'脑':'其余身体'}；目标：区段 ${target?'B':'A'}`;drawEnergy()}
    buttons.forEach(b=>{b.addEventListener('click',()=>select(b.dataset.object));b.addEventListener('dragstart',e=>{select(b.dataset.object);e.dataTransfer.setData('text/plain',b.dataset.object)})});
    function place(seg){if(!selected)return;const correct=(selected==='brain'&&seg===0)||(selected==='rest'&&seg===1);const feedback=document.getElementById('feedback');if(!correct){feedback.textContent='再比较质量份额与能耗份额。';return}placed[selected]=true;buttons.find(b=>b.dataset.object===selected).disabled=true;feedback.textContent=`${selected==='brain'?'脑':'其余身体'}已配对。`;selected=null;buttons.forEach(b=>b.setAttribute('aria-pressed','false'));drawEnergy();if(placed.brain&&placed.rest)complete()}
    energyChart.on('click',p=>place(p.seriesIndex));
    const energyEl=document.getElementById('energyChart');
    energyEl.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();target=e.key==='ArrowRight'?1:0;document.getElementById('targetHint').textContent=`目标：区段 ${target?'B':'A'}；按回车放置`;drawEnergy()}else if(e.key==='Enter'){e.preventDefault();place(target)}});
    energyEl.addEventListener('dragover',e=>e.preventDefault());
    energyEl.addEventListener('drop',e=>{e.preventDefault();selected=e.dataTransfer.getData('text/plain');const p=Deck.pt(energyEl,e);place(p.x<energyEl.offsetWidth*brainEnergyPct/100?0:1)});
    function complete(){
      intensityChart.setOption({series:[{data:[{value:baseline,itemStyle:{color:colors.line}},{value:restIntensity,itemStyle:{color:colors.rest}},{value:brainIntensity,itemStyle:{color:colors.brain}}],label:{show:true,position:'right',fontSize:14,color:colors.text,formatter:p=>`${fmt(p.value)}×`}}]});
      const r=document.getElementById('result');r.hidden=false;r.textContent=`脑：质量 ${fmt(brainMassPct)}% → 静息能耗 ${fmt(brainEnergyPct)}%；单位质量强度 ${fmt(brainIntensity)}×。`;
      document.getElementById('feedback').textContent=`全身基准：${fmt(wholeW)} W · ${fmt(P.percent(wholeW,wholeW))}%`;
    }
    document.getElementById('reset').addEventListener('click',()=>{selected=null;target=0;placed={brain:false,rest:false};buttons.forEach(b=>{b.disabled=false;b.setAttribute('aria-pressed','false')});document.getElementById('feedback').textContent='两个区段合计为全身静息能耗。';document.getElementById('targetHint').textContent='选择标签，再点能耗区段';document.getElementById('result').hidden=true;drawEnergy();intensityChart.setOption({series:[{data:[0,0,0],label:{formatter:''}}]})});
    Deck.onResize(()=>charts.forEach(c=>c.resize()));
  </script>
</body>
</html>
