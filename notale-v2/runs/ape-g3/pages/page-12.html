<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>谁是“大脑冠军”？先问你量的是什么</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{translate:0 -96px}
    .lec-footer{translate:0 -96px}
    .p12{height:100%;display:flex;flex-direction:column;gap:12px;min-height:0}
    .p12-top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:48px}
    .metric-tabs{display:flex;gap:8px;align-items:center}
    .metric-tabs button{min-height:40px;padding:7px 15px;background:var(--surface);white-space:nowrap}
    .metric-tabs button[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
    .filter{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:var(--fs-label);line-height:var(--lh-label)}
    .filter select{min-width:180px;min-height:40px}
    .ledger{display:grid;grid-template-columns:minmax(0,2fr) minmax(340px,.82fr);gap:16px;flex:1;min-height:0}
    .ledger-main{min-width:0;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow-panel)}
    .ledger-main table{height:100%;table-layout:fixed}
    .ledger-main th,.ledger-main td{padding:8px 11px}
    .ledger-main th:first-child,.ledger-main td:first-child{width:22%}
    .ledger-main th:nth-child(2),.ledger-main td:nth-child(2){width:18%}
    .ledger-main th[tabindex]{cursor:pointer;outline-offset:-3px}
    .ledger-main th.sorting{box-shadow:inset 0 0 0 2px var(--warning);background:var(--warning-soft)}
    .species{font-weight:740}
    .value{font-variant-numeric:tabular-nums;font-weight:700}
    .missing{color:var(--muted)}
    tbody tr{transition:background-color var(--transition-fast)}
    tbody tr:hover{background:var(--surface-soft)}
    .explain{min-width:0;min-height:0;padding:16px!important;gap:10px!important;border-width:3px!important}
    .explain-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .branch-tag{font-size:var(--fs-label);line-height:var(--lh-label);font-weight:800;color:var(--accent-strong)}
    .explain .class-group{padding:12px!important;margin:0!important}
    .explain h2{font-size:19px}
    .explain p{margin:5px 0 0;font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .boundary{border-left-color:var(--warning)!important;background:var(--warning-soft)!important}
    .status{margin:0;padding:8px 12px;border-radius:var(--radius-sm);background:var(--surface-soft);color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    @media (prefers-reduced-motion:reduce){tbody tr{transition:none}}
  </style>
</head>
<body data-page="12" data-total="48">
  <div id="stage">
    <main class="p12" aria-label="大脑测量指标分类与物种数据表">
      <div class="p12-top">
        <div class="metric-tabs" role="tablist" aria-label="选择测量问题">
          <button type="button" role="tab" aria-selected="true" data-metric="mass">脑容量／脑质量</button>
          <button type="button" role="tab" aria-selected="false" data-metric="ratio">脑身比／相对脑量</button>
          <button type="button" role="tab" aria-selected="false" data-metric="neurons">神经组织方式</button>
        </div>
        <label class="filter">筛选记录
          <select id="filter">
            <option value="all">全部类群</option>
            <option value="comparable">仅看可比数据</option>
            <option value="primate">只看灵长类</option>
            <option value="mammal">只看其他哺乳动物</option>
          </select>
        </label>
      </div>

      <section class="ledger">
        <div class="ledger-main min0">
          <table aria-describedby="rank-status">
            <thead><tr><th>物种</th><th>类群</th><th id="value-head" class="sorting" tabindex="0" role="button" aria-label="按成年脑质量排序">成年脑质量 ↓</th><th id="detail-head">测量说明</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>

        <aside class="k-classification explain min0" aria-live="polite">
          <div class="explain-head"><span class="branch-tag" id="branch-tag">分类 1 / 3</span><strong id="metric-name">脑容量／脑质量</strong></div>
          <div class="class-group" data-class><h2>测量什么</h2><p id="measure">整个脑的体积或质量。</p></div>
          <div class="class-group" data-class><h2>适合回答什么</h2><p id="answers">哪些动物拥有更大的整体神经组织规模。</p></div>
          <div class="class-group boundary" data-class><h2>不能推出什么</h2><p id="limits">不能单独推出一般智力高低，也不能忽略身体大小。</p></div>
          <p class="status" id="rank-status">同一批物种，换一种指标，排序可能改变。</p>
        </aside>
      </section>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 12,
      kicker: 'MEASURE BEFORE RANKING',
      title: '谁是“大脑冠军”？先问你量的是什么',
      take: '脑容量、脑身比和神经组织方式回答的是不同问题'
    });
    Deck.init({ index: 12, total: 48 });

    const records = (Lec.K.page12BrainComparisonRecords || []).filter(r => r.sourceLabel && r.comparability != null);
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const rows = document.getElementById('rows');
    const filter = document.getElementById('filter');
    const head = document.getElementById('value-head');
    const detailHead = document.getElementById('detail-head');
    const seen = new Set(['mass']);
    let metric = 'mass', descending = true;

    const specs = {
      mass:{name:'脑容量／脑质量', measure:'整个脑的体积或质量。', answers:'哪些动物拥有更大的整体神经组织规模。', limits:'不能单独推出一般智力高低，也不能忽略身体大小。', head:'成年脑质量', detail:'测量类型', value:r=>r.brainMassKg, display:r=>r.brainMassKg!=null?Lec.P.formatMass(r.brainMassKg):(r.brainVolumeM3!=null?Lec.P.formatVolume(r.brainVolumeM3):null), extra:r=>r.brainMassKg!=null?'质量记录':(r.brainVolumeM3!=null?'容量记录':'—')},
      ratio:{name:'脑身比／相对脑量', measure:'脑尺度相对于身体尺度的关系。', answers:'脑占身体多大比例，或相对同类尺度偏大多少。', limits:'直接脑身比不等于“多出来的智力”；结果依赖参照模型。', head:'脑身质量比', detail:'相对脑量', value:r=>r.brainMassKg!=null&&r.bodyMassKg!=null?Lec.P.percent(r.brainMassKg,r.bodyMassKg):null, display:r=>r.brainMassKg!=null&&r.bodyMassKg!=null?Lec.P.formatNumber(Lec.P.percent(r.brainMassKg,r.bodyMassKg))+'%':null, extra:r=>r.brainMassKg!=null&&r.bodyMassKg!=null?Lec.P.formatNumber(Lec.P.relativeBrainSize(r.brainMassKg,r.bodyMassKg,Lec.K.page12BrainScalingModel)):'—'},
      neurons:{name:'神经组织方式', measure:'神经元数量、密度及其在脑区中的分布。', answers:'相似脑量是否由相似数量、密度和分布的神经元构成。', limits:'神经元数量不能概括连接、发育、学习与行为环境。', head:'全脑神经元', detail:'覆盖脑区', value:r=>r.comparability&&r.totalNeuronCount!=null?r.totalNeuronCount:null, display:r=>r.totalNeuronCount!=null?Lec.P.formatScientific(r.totalNeuronCount):null, extra:r=>r.regionDefinition||'暂无可比数据'}
    };
    const missing = '<span class="missing">暂无可比数据</span>';
    function isPrimate(r){return /灵长|primate|homin/i.test(String(r.taxon));}
    function comparable(r){return r.comparability===true || /可比|comparable/i.test(String(r.comparability));}
    function render(){
      const s=specs[metric], mode=filter.value;
      let data=records.filter(r=>mode==='all'||(mode==='comparable'&&comparable(r))||(mode==='primate'&&isPrimate(r))||(mode==='mammal'&&!isPrimate(r)));
      data.sort((a,b)=>{const av=s.value(a),bv=s.value(b);if(av==null)return 1;if(bv==null)return -1;return descending?bv-av:av-bv;});
      rows.innerHTML=data.map(r=>`<tr><td class="species">${r.commonName}</td><td>${r.taxon||'—'}</td><td class="value">${s.display(r)||missing}</td><td>${s.extra(r)||missing}</td></tr>`).join('');
      head.textContent=s.head+' '+(descending?'↓':'↑'); head.setAttribute('aria-label','按'+s.head+'排序'); detailHead.textContent=s.detail;
      document.getElementById('metric-name').textContent=s.name; document.getElementById('measure').textContent=s.measure; document.getElementById('answers').textContent=s.answers; document.getElementById('limits').textContent=s.limits;
      document.getElementById('branch-tag').textContent='分类 '+(tabs.findIndex(t=>t.dataset.metric===metric)+1)+' / 3';
      document.getElementById('rank-status').textContent=seen.size===3?'排名变了，因为问题变了。任何一列都不是智力排行榜。':'同一批物种，换一种指标，排序可能改变。';
    }
    tabs.forEach(tab=>tab.addEventListener('click',()=>{metric=tab.dataset.metric;descending=true;seen.add(metric);tabs.forEach(t=>t.setAttribute('aria-selected',String(t===tab)));render();}));
    filter.addEventListener('change',render);
    function sort(){descending=!descending;render();}
    head.addEventListener('click',sort); head.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();sort();}});
    render();
  </script>
</body>
</html>
