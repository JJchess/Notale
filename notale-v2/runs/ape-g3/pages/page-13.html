<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>夹住一颗小珠，需要整只手与眼睛合作</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    body{position:relative;top:-96px}
    .p13{width:1408px;height:620px;display:grid;grid-template-rows:112px 414px 62px;gap:16px}
    .p13 .k-process{gap:30px}
    .p13 .k-process>section{padding:12px 14px;display:flex;flex-direction:column;justify-content:center;transition:transform 220ms ease,background-color 220ms ease}
    .p13 .k-process>section::before{width:24px;height:24px;margin-bottom:6px;font-size:14px}
    .p13 .k-process>:not(:last-child)::after{left:calc(100% + 2px);width:26px}
    .step-name{font-size:16px;line-height:1.35;font-weight:720}
    .step-cue{font-size:14px;line-height:1.4;color:var(--muted);margin-top:3px}
    .workbench{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:16px;min-height:0}
    .scene{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:var(--radius-lg);background:linear-gradient(135deg,#eef4fa,#fff 62%);box-shadow:var(--shadow-panel);overflow:hidden}
    #konva{position:absolute;inset:0;outline:none}
    #konva:focus-visible{outline:3px solid var(--focus);outline-offset:-5px;border-radius:var(--radius-lg)}
    .scene-status{position:absolute;z-index:2;top:16px;left:18px;display:flex;align-items:center;gap:10px;pointer-events:none}
    .state-word{padding:7px 13px;border-radius:999px;background:#101a2c;color:#fff;font-size:16px;line-height:1.35;font-weight:760}
    .rounds{display:flex;gap:7px}.rounds i{width:10px;height:10px;border-radius:50%;background:var(--line)}.rounds i.on{background:var(--accent)}.rounds i.done{background:var(--success)}
    .side{display:flex;flex-direction:column;gap:12px;min-width:0}
    .side .panel{padding:18px}
    .instruction{font-size:18px;line-height:1.5;margin:0;color:var(--text)}
    .result-title{font-size:15px;line-height:1.4;color:var(--muted);font-weight:700;margin-bottom:8px}
    .metric{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:15px;line-height:1.4}
    .metric b{font-size:16px;color:var(--text)}
    .ctl{margin-top:auto;justify-content:space-between}
    .keyboard{font-size:14px;line-height:1.4;color:var(--muted)}
    .takeaway{display:flex;align-items:center;justify-content:center;padding:0 24px;border-left:5px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius-sm);font-size:18px;line-height:1.5;font-weight:680}
    @media (prefers-reduced-motion:reduce){.p13 .k-process>section{transition:none}}
  </style>
</head>
<body data-page="13" data-total="48">
  <div id="stage">
    <main class="p13">
      <div class="k-process" aria-label="精细夹取的五个连续步骤">
        <section data-step="0" data-state="current"><span class="step-name">看见目标</span><span class="step-cue">定位小珠与目标槽</span></section>
        <section data-step="1"><span class="step-name">调整腕部</span><span class="step-cue">让夹取轴对准</span></section>
        <section data-step="2"><span class="step-name">张开手指</span><span class="step-cue">保留进入空间</span></section>
        <section data-step="3"><span class="step-name">双指合拢</span><span class="step-cue">两侧同时接触</span></section>
        <section data-step="4"><span class="step-name">移动并释放</span><span class="step-cue">保持稳定再放好</span></section>
      </div>

      <div class="workbench">
        <section class="scene min0 no-pan" aria-label="夹取挑战操作区">
          <div class="scene-status"><span class="state-word" id="stateWord" aria-live="polite">对准</span><span class="rounds" id="rounds" aria-label="轮次进度"></span></div>
          <div id="konva" tabindex="0" role="application" aria-label="移动指针控制手的位置；按住或按空格夹取小珠，送到右侧目标槽后松开"></div>
        </section>

        <aside class="side min0">
          <div class="panel" data-tone="accent">
            <div class="result-title">当前动作</div>
            <p class="instruction" id="instruction">移动手部，让两指中点接近小珠。</p>
          </div>
          <div class="panel">
            <div class="result-title">轨迹比较</div>
            <div class="metric"><span>首次尝试</span><span>最近一次</span><b id="firstMetric">—</b><b id="lastMetric">尚未完成</b></div>
          </div>
          <div class="ctl"><span class="keyboard">方向键移动 · 空格夹取</span><button id="reset" type="button">重新开始</button></div>
        </aside>
      </div>

      <div class="takeaway">精细抓握来自手指、腕部、视觉和练习的共同作用；拇指很重要，但不能单独完成夹取。</div>
    </main>
  </div>

  <script src="assets/lib/konva.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 13,
      kicker: 'BODY RELAY 06',
      title: '夹住一颗小珠，需要整只手与眼睛合作',
      take: '精细抓握来自手指、腕部、视觉和练习的共同作用'
    });
    Deck.init({ index: 13, total: 48 });

    const cfg = Lec.K.page13GripChallenge || {
      roundCount: 3,
      initialSceneIndex: 0,
      dropThreshold: 0.45,
      scenes: [
        {objectRadiusRatio:0.038,startXRatio:0.28,startYRatio:0.56,slotXRatio:0.80,slotYRatio:0.50},
        {objectRadiusRatio:0.032,startXRatio:0.34,startYRatio:0.42,slotXRatio:0.77,slotYRatio:0.64},
        {objectRadiusRatio:0.026,startXRatio:0.25,startYRatio:0.66,slotXRatio:0.82,slotYRatio:0.36}
      ]
    };
    const host = document.getElementById('konva');
    const steps = [...document.querySelectorAll('[data-step]')];
    const word = document.getElementById('stateWord');
    const instruction = document.getElementById('instruction');
    const live = { set textContent(value){ word.setAttribute('aria-label', value); } };
    const firstMetric = document.getElementById('firstMetric');
    const lastMetric = document.getElementById('lastMetric');
    const roundsEl = document.getElementById('rounds');
    let stage, layer, traceLayer, hand, thumb, finger, bead, slot, guide, gapLine, ring;
    let sceneIndex, round, held, gripping, state, handPos, samples, firstResult, previousTrace;

    function sceneData(){ return cfg.scenes[sceneIndex]; }
    function dims(){ return {w:host.clientWidth,h:host.clientHeight}; }
    function sceneValues(){
      const {w,h}=dims(), s=sceneData();
      const radius=(s.objectRadiusRatio || s.objectSizeRatio || .035)*Math.min(w,h);
      const sx=(s.startXRatio || .28)*w, sy=(s.startYRatio || .56)*h;
      const tx=(s.slotXRatio || .79)*w, ty=(s.slotYRatio || .5)*h;
      return {w,h,radius,sx,sy,tx,ty};
    }
    function makeRounds(){
      roundsEl.innerHTML='';
      for(let i=0;i<cfg.roundCount;i++){const d=document.createElement('i');d.className=i<round?'done':i===round?'on':'';roundsEl.appendChild(d)}
    }
    function setStep(n, status, text){
      steps.forEach((el,i)=>{el.dataset.state=i<n?'done':i===n?'current':''});
      state=n; word.textContent=status; instruction.textContent=text; live.textContent=status+'。'+text;
    }
    function build(){
      if(stage) stage.destroy();
      const d=sceneValues(); stage=new Konva.Stage({container:'konva',width:d.w,height:d.h});
      traceLayer=new Konva.Layer(); layer=new Konva.Layer(); stage.add(traceLayer);stage.add(layer);
      slot=new Konva.Rect({x:d.tx-42,y:d.ty-48,width:84,height:96,cornerRadius:18,fill:Deck.rgba('--accent',.08),stroke:Deck.token('--accent'),strokeWidth:3,dash:[8,7]});
      guide=new Konva.Line({points:[d.sx,d.sy,d.tx,d.ty],stroke:Deck.rgba('--accent',.28),strokeWidth:2,dash:[7,9]});
      bead=new Konva.Circle({x:d.sx,y:d.sy,radius:d.radius,fill:Deck.token('--warning'),stroke:'#7a4300',strokeWidth:2,shadowColor:Deck.rgba('--warning',.35),shadowBlur:12});
      ring=new Konva.Circle({x:d.sx,y:d.sy,radius:d.radius*1.7,stroke:Deck.token('--warning'),strokeWidth:3,opacity:.65});
      hand=new Konva.Group({x:d.sx-150,y:d.sy});
      hand.add(new Konva.Ellipse({x:-60,y:0,radiusX:78,radiusY:56,fill:'#d8a37d',stroke:'#925f42',strokeWidth:3}));
      finger=new Konva.Line({points:[-25,-18,36,-34,92,-28],stroke:'#d8a37d',strokeWidth:28,lineCap:'round',lineJoin:'round'});
      thumb=new Konva.Line({points:[-22,24,36,34,92,28],stroke:'#d8a37d',strokeWidth:28,lineCap:'round',lineJoin:'round'});
      gapLine=new Konva.Line({points:[92,-28,92,28],stroke:Deck.token('--accent'),strokeWidth:3,dash:[4,4]});
      hand.add(finger,thumb,gapLine);layer.add(guide,slot,ring,bead,hand);
      drawTrace(); layer.draw();
    }
    function drawTrace(){
      traceLayer.destroyChildren(); if(previousTrace && previousTrace.length>1){traceLayer.add(new Konva.Line({points:previousTrace.flatMap(p=>[p.x,p.y]),stroke:Deck.rgba('--line-strong',.42),strokeWidth:3,dash:[5,7],lineCap:'round'}));traceLayer.draw()}
    }
    function resetRound(failed){
      const d=sceneValues(); held=false;gripping=false;handPos={x:d.sx-150,y:d.sy};samples=[];
      if(failed) setStep(1,'脱落','重新对准；接近小珠后再合拢。'); else setStep(0,'对准','移动手部，让两指中点接近小珠。');
      build(); makeRounds();
    }
    function updateHand(x,y,closing){
      const d=sceneValues(); handPos.x=Deck.clamp(x,-40,d.w-120);handPos.y=Deck.clamp(y,85,d.h-70); samples.push({x:handPos.x+150,y:handPos.y});
      hand.position(handPos); const gap=closing?d.radius*.72:30;
      finger.points([-25,-18,36,-34,92,-gap]);thumb.points([-22,24,36,34,92,gap]);gapLine.points([92,-gap,92,gap]);
      const pinch={x:handPos.x+92,y:handPos.y}; const dist=Math.hypot(pinch.x-bead.x(),pinch.y-bead.y());
      if(!closing){
        if(gripping && Math.hypot(bead.x()-d.tx,bead.y()-d.ty)<52){ completeRound();return }
        gripping=false; setStep(dist<d.radius*4?2:1,'对准',dist<d.radius*4?'位置合适，按住并合拢双指。':'调整腕部，让夹取轴穿过小珠。');
      } else if(!gripping){
        if(dist<d.radius*1.45){
          const stability=Lec.P.page13GripStability(dist/(d.radius*1.45),0,0);
          if(stability>=cfg.dropThreshold){gripping=true;setStep(3,'夹稳','保持夹取，把小珠平稳送入目标槽。');ring.stroke(Deck.token('--accent'));}
          else {setStep(3,'脱落','接触偏离中心，小珠滑开了。'); bead.x(bead.x()+d.radius*1.4);}
        } else setStep(2,'对准','双指没有同时接触；先对准小珠。');
      } else {
        bead.position(pinch);ring.position(pinch);setStep(4,'夹稳','移动到目标槽内，再松开夹取。');
      }
      layer.batchDraw();
    }
    function completeRound(){
      const smooth=Lec.P.page13PathSmoothness(samples); const shown=Lec.P.percent(smooth);
      previousTrace=samples.slice(); if(firstResult==null){firstResult=shown;firstMetric.textContent=shown} lastMetric.textContent=shown;
      word.textContent='放好'; live.textContent='放好。完成这一轮。'; round++;
      if(round>=cfg.roundCount){round=0;sceneIndex=cfg.initialSceneIndex;setStep(4,'放好','挑战完成。轨迹叠影显示练习后的路径修正。');makeRounds();drawTrace();return}
      sceneIndex=(sceneIndex+1)%cfg.scenes.length; resetRound(false);
    }
    function pointer(e){const p=stage.getPointerPosition();if(!p)return;updateHand(p.x-92,p.y,held)}
    host.addEventListener('pointermove',e=>{pointer(e)});
    host.addEventListener('pointerdown',e=>{held=true;host.setPointerCapture(e.pointerId);pointer(e)});
    host.addEventListener('pointerup',e=>{held=false;pointer(e)});
    host.addEventListener('keydown',e=>{
      const big=e.shiftKey?18:7;
      if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
      if(e.key==='ArrowLeft')updateHand(handPos.x-big,handPos.y,held);
      if(e.key==='ArrowRight')updateHand(handPos.x+big,handPos.y,held);
      if(e.key==='ArrowUp')updateHand(handPos.x,handPos.y-big,held);
      if(e.key==='ArrowDown')updateHand(handPos.x,handPos.y+big,held);
      if(e.key===' '){held=!held;updateHand(handPos.x,handPos.y,held)}
    });
    document.getElementById('reset').addEventListener('click',()=>{sceneIndex=cfg.initialSceneIndex;round=0;firstResult=null;previousTrace=null;firstMetric.textContent='—';lastMetric.textContent='尚未完成';resetRound(false)});
    sceneIndex=cfg.initialSceneIndex;round=0;firstResult=null;previousTrace=null;resetRound(false);
    Deck.onResize(()=>resetRound(false));
  </script>
</body>
</html>
