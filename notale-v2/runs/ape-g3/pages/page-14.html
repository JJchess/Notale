<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>最快速度不等于耐力优势</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{margin-top:-96px}
    body>.lec-header{transform:translateY(-92px)}
    body>.lec-footer{transform:translateY(-96px)}
    .p14{height:620px;margin-top:96px;display:grid;grid-template-rows:142px 82px 296px 42px;gap:12px;min-height:0}
    .controls{display:grid;grid-template-columns:1fr 1fr 1.4fr 1.4fr;gap:12px}
    .control-box{border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);padding:10px 14px;min-width:0}
    .control-box .ctl{min-height:34px}.control-box output{font-size:var(--fs-sec);padding:3px 8px;min-width:4.8em}
    .control-box input[type=range]{width:100%;accent-color:var(--accent)}
    .ends{display:flex;justify-content:space-between;color:var(--muted);font-size:var(--fs-label);line-height:var(--lh-label)}
    .pad{height:68px;position:relative;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:linear-gradient(0deg,var(--surface-soft),transparent),repeating-linear-gradient(90deg,transparent 0 24%,var(--line) 25% 25.4%,transparent 26% 50%);cursor:crosshair;touch-action:none}
    .pad-dot{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid white;box-shadow:0 2px 8px rgb(23 32 51 / 28%);transform:translate(-50%,50%);transition:left 160ms ease-out,bottom 160ms ease-out}
    .pad:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.pad[aria-label*="耐力"] .pad-dot{background:var(--secondary)}
    .pad-meta{display:flex;justify-content:space-between;margin-top:4px;color:var(--muted);font-size:var(--fs-label);line-height:var(--lh-label)}
    .ruler{position:relative;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);overflow:hidden}
    #ruler{width:100%;height:100%;display:block}.comparison{--comparison-cols:2;grid-template-columns:180px repeat(2,minmax(0,1fr));grid-auto-rows:46px 61px 61px 61px 65px}
    .comparison>div{display:flex;align-items:center;gap:10px;padding:8px 14px}.comparison [data-heading]{font-size:var(--fs-body);justify-content:space-between}
    .strategy-tag{font-size:var(--fs-label);color:var(--muted);font-weight:600}.metric{font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .metric strong{font-size:var(--fs-body);font-variant-numeric:tabular-nums}.loadbar{height:10px;flex:1;border-radius:10px;background:var(--surface-muted);overflow:hidden}.loadbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--warning));transition:width 180ms ease-out}
    .result{font-size:var(--fs-sec);line-height:var(--lh-sec);font-weight:700}.result.limited{color:var(--warning)}
    .footnote{display:flex;align-items:center;justify-content:space-between;gap:20px}.footnote p{margin:0}.boundary{max-width:760px}
    @media(prefers-reduced-motion:reduce){.pad-dot,.loadbar i{transition:none}}
  </style>
</head>
<body data-page="14" data-total="48">
  <div id="stage">
    <main class="p14" aria-label="追猎条件比较模型">
      <section class="controls" aria-label="调节追猎参数">
        <div class="control-box min0"><div class="ctl"><label for="distance">追猎距离</label><output id="distanceOut"></output></div><input id="distance" type="range"><div class="ends"><span>较短</span><span>较长</span></div></div>
        <div class="control-box min0"><div class="ctl"><label for="cooling">环境散热</label><output id="coolingOut"></output></div><input id="cooling" type="range"><div class="ends"><span>散热受限</span><span>散热有利</span></div></div>
        <div class="control-box min0"><div class="ctl"><label>冲刺参数</label><output id="sprintOut"></output></div><div id="sprintPad" class="pad no-pan" role="application" tabindex="0" aria-label="冲刺速度与步幅；左右调速度，上下调步幅"><span class="pad-dot"></span></div><div class="pad-meta"><span>速度 →</span><span>步幅 ↑</span></div></div>
        <div class="control-box min0"><div class="ctl"><label>耐力参数</label><output id="enduranceOut"></output></div><div id="endurancePad" class="pad no-pan" role="application" tabindex="0" aria-label="耐力速度与步幅；左右调速度，上下调步幅"><span class="pad-dot"></span></div><div class="pad-meta"><span>速度 →</span><span>步幅 ↑</span></div></div>
      </section>
      <section class="ruler" aria-label="共享距离尺"><svg id="ruler" role="img" aria-label="两种策略在同一距离和环境中的可持续位置"></svg></section>
      <section class="k-comparison comparison" aria-label="冲刺与耐力策略逐项比较">
        <div data-axis></div><div data-heading>冲刺策略 <span class="strategy-tag">同一距离 · 同一环境</span></div><div data-heading data-diff>耐力策略 <span class="strategy-tag">同一距离 · 同一环境</span></div>
        <div data-axis>速度与完成时间</div><div id="sTime" class="metric"></div><div id="eTime" class="metric" data-diff></div>
        <div data-axis>步幅、步频与步数</div><div id="sSteps" class="metric"></div><div id="eSteps" class="metric" data-diff></div>
        <div data-axis>热负荷 / 机械负荷</div><div id="sLoads" class="metric"></div><div id="eLoads" class="metric" data-diff></div>
        <div data-axis>可持续结果</div><div id="sResult" class="result"></div><div id="eResult" class="result" data-diff></div>
      </section>
      <section class="footnote"><p class="fs-sec boundary">相对指数用于比较参数关系，不预测真实人的体温、疲劳或追猎成功率。</p><p class="note">耐力追猎还受环境、猎物行为与群体实践影响；本模型不能单独证实这项假说。</p></section>
    </main>
  </div>
  <script src="assets/lib/d3.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:14,kicker:'ENDURANCE TRADE-OFFS',title:'最快速度不等于耐力优势',take:'散热、步幅和速度共同决定耐力优势，不能只看最快速度'});
    Deck.init({index:14,total:48});
    const K=Lec.K,P=Lec.P;
    const D={page14DistanceMinKm:2,page14DistanceMaxKm:20,page14DistanceStepKm:1,page14DefaultDistanceKm:10,page14CoolingIndexMin:0,page14CoolingIndexMax:1,page14CoolingIndexStep:.05,page14DefaultCoolingIndex:.45,page14SprintSpeedMinKmh:10,page14SprintSpeedMaxKmh:28,page14SprintSpeedDefaultKmh:20,page14EnduranceSpeedMinKmh:5,page14EnduranceSpeedMaxKmh:14,page14EnduranceSpeedDefaultKmh:9,page14SpeedStepKmh:.5,page14StrideMinM:.7,page14StrideMaxM:2.1,page14StrideStepM:.05,page14SprintStrideDefaultM:1.65,page14EnduranceStrideDefaultM:1.15,page14HeatBase:.22,page14HeatSpeedCoefficient:.035,page14CoolingCoefficient:.8,page14HeatNormalization:120,page14MechanicalBase:.08,page14StrideCoefficient:.12,page14MechanicalNormalization:900,page14HeatWeight:.55,page14MechanicalWeight:.45,page14LoadLimit:1,page14IntegrationStepM:20,page14DistanceTickCount:5,secondsPerHour:3600,secondsPerMinute:60};
    for(const key in D) if(K[key]===undefined) K[key]=D[key];
    const cfg={
      distance:[K.page14DistanceMinKm,K.page14DistanceMaxKm,K.page14DistanceStepKm,K.page14DefaultDistanceKm],
      cooling:[K.page14CoolingIndexMin,K.page14CoolingIndexMax,K.page14CoolingIndexStep,K.page14DefaultCoolingIndex],
      sprint:{speed:[K.page14SprintSpeedMinKmh,K.page14SprintSpeedMaxKmh,K.page14SpeedStepKmh,K.page14SprintSpeedDefaultKmh],stride:[K.page14StrideMinM,K.page14StrideMaxM,K.page14StrideStepM,K.page14SprintStrideDefaultM]},
      endurance:{speed:[K.page14EnduranceSpeedMinKmh,K.page14EnduranceSpeedMaxKmh,K.page14SpeedStepKmh,K.page14EnduranceSpeedDefaultKmh],stride:[K.page14StrideMinM,K.page14StrideMaxM,K.page14StrideStepM,K.page14EnduranceStrideDefaultM]}
    };
    const state={distance:cfg.distance[3],cooling:cfg.cooling[3],sprint:{speed:cfg.sprint.speed[3],stride:cfg.sprint.stride[3]},endurance:{speed:cfg.endurance.speed[3],stride:cfg.endurance.stride[3]}};
    function setupRange(id,c){const el=document.getElementById(id);el.min=c[0];el.max=c[1];el.step=c[2];el.value=c[3];el.addEventListener('input',()=>{state[id]=+el.value;update()})}
    setupRange('distance',cfg.distance);setupRange('cooling',cfg.cooling);
    function snap(v,c){return Deck.clamp(Math.round((v-c[0])/c[2])*c[2]+c[0],c[0],c[1])}
    function setupPad(name){const el=document.getElementById(name+'Pad'),c=cfg[name];function setFrom(x,y){state[name].speed=snap(c.speed[0]+x*(c.speed[1]-c.speed[0]),c.speed);state[name].stride=snap(c.stride[0]+y*(c.stride[1]-c.stride[0]),c.stride);update()}function pointer(e){const p=Deck.pt(el,e);setFrom(Deck.clamp(p.x/el.offsetWidth,0,1),Deck.clamp(1-p.y/el.offsetHeight,0,1))}el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);pointer(e)});el.addEventListener('pointermove',e=>{if(el.hasPointerCapture(e.pointerId))pointer(e)});el.addEventListener('keydown',e=>{let ds=0,dl=0,m=e.shiftKey?5:1;if(e.key==='ArrowRight')ds=c.speed[2]*m;if(e.key==='ArrowLeft')ds=-c.speed[2]*m;if(e.key==='ArrowUp')dl=c.stride[2]*m;if(e.key==='ArrowDown')dl=-c.stride[2]*m;if(ds||dl){e.preventDefault();state[name].speed=snap(state[name].speed+ds,c.speed);state[name].stride=snap(state[name].stride+dl,c.stride);update()}})}
    setupPad('sprint');setupPad('endurance');
    function calc(s){const distanceM=P.kilometresToMetres(state.distance),speedMps=P.kilometresToMetres(s.speed)/K.secondsPerHour,duration=distanceM/speedMps,stepFreq=speedMps/s.stride*K.secondsPerMinute,steps=distanceM/s.stride;function loadsAt(m){const t=m/speedMps,n=m/s.stride,heatRate=K.page14HeatBase+K.page14HeatSpeedCoefficient*speedMps*speedMps,cool=K.page14CoolingCoefficient*state.cooling,heat=Math.max(0,heatRate-cool)*t/K.page14HeatNormalization,mechanical=n*(K.page14MechanicalBase+K.page14StrideCoefficient*s.stride*s.stride)/K.page14MechanicalNormalization;return{heat,mechanical,total:K.page14HeatWeight*heat+K.page14MechanicalWeight*mechanical}}let boundary=distanceM,last=loadsAt(distanceM);for(let m=0;m<=distanceM;m+=K.page14IntegrationStepM){const l=loadsAt(m);if(l.total>=K.page14LoadLimit){boundary=m;last=l;break}}let cause='抵达终点';if(boundary<distanceM){const wh=K.page14HeatWeight*last.heat,wm=K.page14MechanicalWeight*last.mechanical;cause=Math.abs(wh-wm)<Math.max(wh,wm)*0.2?'热与机械共同限制':wh>wm?'热负荷限制':'机械负荷限制'}return{speedMps,duration,stepFreq,steps,...loadsAt(distanceM),boundaryKm:P.metresToKilometres(boundary),cause,reached:boundary>=distanceM}}
    const fmt=(v,d=2)=>P.formatNumber(v,d);
    function cell(prefix,r,s){document.getElementById(prefix+'Time').innerHTML='<strong>'+fmt(s.speed,1)+' km/h</strong> · '+P.formatDuration(r.duration);document.getElementById(prefix+'Steps').innerHTML='步幅 <strong>'+fmt(s.stride,2)+' m</strong> · '+fmt(r.stepFreq,0)+' 步/分 · '+fmt(r.steps,0)+' 步';document.getElementById(prefix+'Loads').innerHTML='<span>热 '+fmt(r.heat,2)+'　机械 '+fmt(r.mechanical,2)+'</span><span class="loadbar"><i style="width:'+Math.min(100,r.total/K.page14LoadLimit*100)+'%"></i></span>';const out=document.getElementById(prefix+'Result');out.className='result'+(r.reached?'':' limited');out.textContent=r.reached?'抵达 '+fmt(state.distance,1)+' km':'在 '+fmt(r.boundaryKm,2)+' km 触及边界 · '+r.cause}
    function drawRuler(a,b){const svg=d3.select('#ruler'),w=1408,h=94;svg.attr('viewBox',`0 0 ${w} ${h}`).selectAll('*').remove();const x=d3.scaleLinear().domain([0,state.distance]).range([64,w-40]);const ticks=x.ticks(K.page14DistanceTickCount);svg.append('line').attr('x1',64).attr('x2',w-40).attr('y1',47).attr('y2',47).attr('stroke','var(--line-strong)').attr('stroke-width',2);svg.selectAll('.tickline').data(ticks).join('line').attr('x1',x).attr('x2',x).attr('y1',39).attr('y2',56).attr('stroke','var(--line-strong)');svg.selectAll('.ticktext').data(ticks).join('text').attr('x',x).attr('y',76).attr('text-anchor','middle').attr('font-size',13).attr('fill','var(--muted)').text(d=>fmt(d,1)+' km');[{n:'冲刺',r:a,y:30,c:'var(--accent)'},{n:'耐力',r:b,y:64,c:'var(--secondary)'}].forEach(d=>{svg.append('line').attr('x1',64).attr('x2',x(Math.min(state.distance,d.r.boundaryKm))).attr('y1',d.y).attr('y2',d.y).attr('stroke',d.c).attr('stroke-width',7).attr('stroke-linecap','round');svg.append('circle').attr('cx',x(Math.min(state.distance,d.r.boundaryKm))).attr('cy',d.y).attr('r',8).attr('fill',d.r.reached?d.c:'var(--warning)').attr('stroke','white').attr('stroke-width',3);svg.append('text').attr('x',12).attr('y',d.y+5).attr('font-size',15).attr('font-weight',700).attr('fill',d.c).text(d.n)})}
    function update(){document.getElementById('distanceOut').value=fmt(state.distance,1)+' km';document.getElementById('coolingOut').value=fmt(state.cooling,2);['sprint','endurance'].forEach(n=>{const c=cfg[n],s=state[n],el=document.getElementById(n+'Pad'),dot=el.querySelector('.pad-dot'),xp=(s.speed-c.speed[0])/(c.speed[1]-c.speed[0]),yp=(s.stride-c.stride[0])/(c.stride[1]-c.stride[0]);dot.style.left=(xp*100)+'%';dot.style.bottom=(yp*100)+'%';el.setAttribute('aria-valuetext',fmt(s.speed,1)+'千米每小时，步幅'+fmt(s.stride,2)+'米');document.getElementById(n+'Out').value=fmt(s.speed,1)+' km/h · '+fmt(s.stride,2)+' m'});const a=calc(state.sprint),b=calc(state.endurance);cell('s',a,state.sprint);cell('e',b,state.endurance);drawRuler(a,b)}
    update();
  </script>
</body>
</html>
