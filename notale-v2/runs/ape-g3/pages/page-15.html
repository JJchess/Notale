<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>人类身体不是预制的太空机器</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    html.lec-root{position:absolute;inset:0;width:1600px;height:900px;display:grid;place-items:center;overflow:hidden}
    .lec-header__inner{width:100%;display:grid;grid-template-columns:190px 190px 1fr 80px;align-items:center;gap:24px}.lec-header__identity,.lec-header__kicker,.lec-header__title,.lec-header__page{margin:0}.lec-header__page{text-align:right}
    .assembly{height:100%;position:relative}
    .k-generalization.tradeoff{height:540px;display:block;position:relative}
    .tradeoff::before,.tradeoff::after{display:none}
    .wheel{position:absolute;left:384px;top:8px;width:640px;height:520px;transition:transform 220ms ease;transform:rotate(var(--tilt,0deg))}
    .wheel::before{content:"";position:absolute;inset:52px 112px;border:2px solid var(--line-strong);border-radius:50%;background:radial-gradient(circle,var(--surface) 0 30%,var(--surface-soft) 31% 68%,var(--surface-muted) 69%);box-shadow:var(--shadow-raised),inset 0 2px 0 #fff,inset 0 -3px 7px rgb(36 56 82 / 16%)}
    .hub{position:absolute;z-index:5;left:230px;top:170px;width:180px;height:180px;box-sizing:border-box;border:3px solid var(--line-strong);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(180deg,var(--surface),var(--surface-muted));box-shadow:0 8px 18px rgb(36 56 82 / 18%),inset 0 2px 0 #fff;color:var(--muted);transition:all 240ms ease}
    .hub strong{font-size:var(--fs-h2);line-height:var(--lh-h2)}
    .hub span{font-size:var(--fs-sec);line-height:var(--lh-sec);max-width:145px;margin-top:6px}
    .hub.complete{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
    .sector{position:absolute;z-index:3;width:224px;min-height:122px;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow-panel);transition:transform 180ms ease,border-color 180ms ease}
    .sector h2{font-size:18px;text-align:center;margin-bottom:7px}
    .sector[data-sector="upright"]{left:208px;top:0}.sector[data-sector="brain"]{right:0;top:196px}.sector[data-sector="hand"]{left:208px;bottom:0}.sector[data-sector="endurance"]{left:0;top:196px}
    .sector.paired{border-color:var(--success);transform:translateY(2px)}
    .slots{display:grid;grid-template-columns:1fr 1fr;gap:7px}.slot{min-height:66px;padding:5px;border:2px dashed var(--line-strong);border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:14px;line-height:1.4}.slot.over{border-color:var(--accent);background:var(--accent-soft)}.slot.filled{border-style:solid;border-color:var(--success);background:var(--success-soft);color:var(--text)}
    .support{position:absolute;z-index:2;background:var(--line-strong);opacity:.25;transition:opacity 180ms,background 180ms}.support.on{background:var(--success);opacity:1}.s-u{left:318px;top:120px;width:3px;height:56px}.s-b{left:428px;top:258px;width:46px;height:3px}.s-h{left:318px;top:345px;width:3px;height:55px}.s-e{left:166px;top:258px;width:48px;height:3px}
    .tray{position:absolute;top:16px;width:342px;display:flex;flex-direction:column;gap:10px}.tray.left{left:0}.tray.right{right:0}.weight{position:relative;z-index:10;width:100%;min-height:49px;box-sizing:border-box;padding:7px 11px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:linear-gradient(180deg,#fff,var(--surface-muted));box-shadow:0 5px 10px rgb(36 56 82 / 16%),inset 0 1px 0 #fff,inset 0 -2px 3px rgb(36 56 82 / 10%);font-size:15px;line-height:1.4;font-weight:700;cursor:grab;touch-action:none;user-select:none;transition:opacity 160ms,border-color 160ms}.weight:focus{outline:3px solid var(--focus);outline-offset:2px}.weight.dragging{cursor:grabbing;box-shadow:var(--shadow-raised)}.weight.placed{visibility:hidden}.weight small{display:block;color:var(--muted);font-size:14px;line-height:1.4;font-weight:500}
    .explain{position:absolute;left:365px;bottom:0;width:678px;text-align:center;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec);min-height:26px}
    .controls{height:64px;display:flex;align-items:center;justify-content:space-between}.hint{font-size:15px}.status{font-size:16px;line-height:1.5;color:var(--text)}
    @media (prefers-reduced-motion:reduce){.wheel,.sector,.hub,.weight{transition:none!important}}
  </style>
</head>
<body data-page="15" data-total="48">
  <div id="stage">
    <main class="assembly">
      <section class="k-generalization tradeoff" aria-label="身体权衡的四条支撑">
        <div class="tray left" id="trayLeft"></div>
        <div class="wheel" id="wheel">
          <div class="support s-u" data-line="upright"></div><div class="support s-b" data-line="brain"></div><div class="support s-h" data-line="hand"></div><div class="support s-e" data-line="endurance"></div>
          <div class="hub" data-claim id="hub"><strong>折中方案</strong><span id="claim">能力不能脱离条件单独成立</span></div>
          <article class="sector" data-sector="upright"><h2>直立与双足</h2><div class="slots"><div class="slot" data-kind="gain">获得</div><div class="slot" data-kind="limit">约束</div></div></article>
          <article class="sector" data-sector="brain"><h2>脑</h2><div class="slots"><div class="slot" data-kind="gain">获得</div><div class="slot" data-kind="limit">约束</div></div></article>
          <article class="sector" data-sector="hand"><h2>手</h2><div class="slots"><div class="slot" data-kind="gain">获得</div><div class="slot" data-kind="limit">约束</div></div></article>
          <article class="sector" data-sector="endurance"><h2>耐力</h2><div class="slots"><div class="slot" data-kind="gain">获得</div><div class="slot" data-kind="limit">约束</div></div></article>
        </div>
        <div class="tray right" id="trayRight"></div>
        <p class="explain fs-sec" id="explain">把每块能力与它的条件或代价配成一对。</p>
      </section>
      <div class="controls"><span class="hint">拖入对应槽位；键盘用方向键选槽位，按 Enter 放置。</span><span class="status" id="status" aria-live="polite">尚未组装</span><button id="reset">重新组装</button></div>
    </main>
  </div>
  <script src="assets/lib/matter.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:15,kicker:'BODY TRADE-OFFS',title:'人类身体不是预制的太空机器',take:'人类身体是一组折中方案，不是一台为太空预先设计的机器。'});
    Deck.init({index:15,total:48});
    const items=[
      ['释放双手；特定条件下省能','直立与双足 · 获得','upright','gain'],['全身结构协同；骨盆功能权衡','直立与双足 · 约束','upright','limit'],
      ['信息处理能力','脑 · 获得','brain','gain'],['持续能量需求；指标不能混用','脑 · 约束','brain','limit'],
      ['精细夹取；腕指协同','手 · 获得','hand','gain'],['视觉反馈；练习','手 · 约束','hand','limit'],
      ['持续散热；步幅与节奏','耐力 · 获得','endurance','gain'],['长距离条件；不是最快速度','耐力 · 约束','endurance','limit']
    ];
    const explanations={upright:'直立是一组彼此牵连的结构调整。',brain:'脑需要持续供能，单一尺寸不能概括能力。',hand:'灵巧来自身体协同，也来自视觉与练习。',endurance:'耐力优势取决于速度、距离和散热条件。'};
    const slotList=[...document.querySelectorAll('.slot')];let placed=0,drag=null;
    const engine=Matter.Engine.create({gravity:{x:0,y:0}});const bodies=[];
    items.forEach((d,i)=>{const el=document.createElement('div');el.className='weight';el.tabIndex=0;el.dataset.sector=d[2];el.dataset.kind=d[3];el.innerHTML=d[0]+'<small>'+d[1]+'</small>';el.setAttribute('role','button');el.setAttribute('aria-label',d[0]+'，'+d[1]);(i%2?trayRight:trayLeft).appendChild(el);const b=Matter.Bodies.rectangle(0,0,10,10,{frictionAir:.18});b.home={x:0,y:0};b.el=el;bodies.push(b);Matter.Composite.add(engine.world,b);
      el.addEventListener('pointerdown',e=>{drag={el,b,dx:e.clientX-el.getBoundingClientRect().left,dy:e.clientY-el.getBoundingClientRect().top};el.setPointerCapture(e.pointerId);el.classList.add('dragging');});
      el.addEventListener('pointermove',e=>{if(!drag||drag.el!==el)return;const p=Deck.pt(document.querySelector('.lec-page'),e);el.style.position='fixed';el.style.left=(p.x-drag.dx)+'px';el.style.top=(p.y-drag.dy)+'px';hit(el);});
      el.addEventListener('pointerup',e=>{if(!drag)return;const target=hit(el);target&&target.dataset.kind===el.dataset.kind&&target.closest('.sector').dataset.sector===el.dataset.sector?place(el,target):bounce(el);drag=null;});
      el.addEventListener('keydown',e=>{let n=Number(el.dataset.choice||0);if(['ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();n=(n+1)%8}if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();n=(n+7)%8}el.dataset.choice=n;slotList.forEach((s,j)=>s.classList.toggle('over',j===n));if(e.key==='Enter'){e.preventDefault();const s=slotList[n];s.dataset.kind===el.dataset.kind&&s.closest('.sector').dataset.sector===el.dataset.sector?place(el,s):bounce(el)}if(e.key==='Escape'){slotList.forEach(s=>s.classList.remove('over'))}});
    });
    function hit(el){let found=null;slotList.forEach(s=>{const r=s.getBoundingClientRect(),a=el.getBoundingClientRect();const yes=a.left<r.right&&a.right>r.left&&a.top<r.bottom&&a.bottom>r.top;s.classList.toggle('over',yes);if(yes)found=s});return found}
    function bounce(el){slotList.forEach(s=>s.classList.remove('over'));el.classList.remove('dragging');el.style.position='';el.style.left='';el.style.top='';status.textContent='这块需要与另一种能力或条件对应';Matter.Body.setVelocity(bodies.find(x=>x.el===el),{x:0,y:5})}
    function place(el,slot){if(slot.classList.contains('filled'))return bounce(el);slot.classList.remove('over');slot.classList.add('filled');slot.textContent=el.firstChild.textContent;el.classList.add('placed');el.classList.remove('dragging');placed++;const sec=slot.closest('.sector'),paired=[...sec.querySelectorAll('.slot')].every(s=>s.classList.contains('filled'));if(paired){sec.classList.add('paired');document.querySelector('[data-line="'+sec.dataset.sector+'"]').classList.add('on');explain.textContent=explanations[sec.dataset.sector]}update()}
    function update(){const paired=document.querySelectorAll('.sector.paired').length;wheel.style.setProperty('--tilt',paired===4?'0deg':((placed%3)-1)*.7+'deg');status.textContent='已配成 '+paired+' 组，共 4 组';if(paired===4){hub.classList.add('complete');claim.textContent='没有单一特征独自造成人类';explain.textContent='每种能力都与结构、能量、环境或学习条件相连。身体的可用性来自折中。'}}
    reset.addEventListener('click',()=>{placed=0;document.querySelectorAll('.weight').forEach(e=>{e.classList.remove('placed','dragging');e.style.position=e.style.left=e.style.top='';delete e.dataset.choice});slotList.forEach(s=>{s.className='slot';s.textContent=s.dataset.kind==='gain'?'获得':'约束'});document.querySelectorAll('.sector').forEach(s=>s.classList.remove('paired'));document.querySelectorAll('.support').forEach(s=>s.classList.remove('on'));hub.classList.remove('complete');claim.textContent='能力不能脱离条件单独成立';explain.textContent='把每块能力与它的条件或代价配成一对。';status.textContent='尚未组装';wheel.style.setProperty('--tilt','0deg')});
    Deck.loop((t,dt)=>{Matter.Engine.update(engine,Math.min(32,dt||16));bodies.forEach(b=>Matter.Body.applyForce(b,b.position,{x:0,y:-b.position.y*.0008}))},{still:1});
  </script>
</body>
</html>
