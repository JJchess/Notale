<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>一个人到不了的地方，群体可以接着走</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    html{top:0!important;right:0!important;bottom:auto!important;left:0!important;}
    #stage{position:static;width:100%;height:100%;transform:none!important;}
    .lec-header__inner{width:100%;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:24px;}
    .lec-header__identity,.lec-header__kicker,.lec-header__title,.lec-header__page{margin:0;white-space:nowrap;}
    .lec-header__title{font-size:var(--fs-h1);overflow:hidden;text-overflow:ellipsis;}
    .transition-plate{
      height:100%; box-sizing:border-box; padding:32px 0 20px;
      display:flex; flex-direction:column; gap:24px;
    }
    .process-plate{height:420px; gap:42px;}
    .process-plate>section{
      padding:20px 18px 18px; border-radius:var(--radius-sm); box-shadow:none;
      background:rgb(255 255 255 / 76%); overflow:visible;
    }
    .process-plate>section::before{margin-bottom:8px;}
    .step-title{font-size:var(--fs-h2); line-height:var(--lh-h2); font-weight:720;}
    .diagram{position:relative; height:190px; margin:12px -2px 8px;}
    .diagram svg{display:block; width:100%; height:100%; overflow:visible;}
    .diagram line,.diagram path,.diagram polyline,.diagram circle,.diagram rect{
      vector-effect:non-scaling-stroke;
    }
    .step-copy{margin:0; font-size:var(--fs-sec); line-height:var(--lh-sec); color:var(--muted);}
    .limit-step{border-color:var(--warning)!important; background:var(--warning-soft)!important;}
    .limit-step::before{background:var(--warning)!important;color:#fff!important;}
    .collective-step{border:2px solid var(--accent)!important;background:var(--accent-soft)!important;box-shadow:var(--shadow-raised)!important;}
    .collective-step::before{background:var(--accent)!important;color:#fff!important;}
    .limits{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-top:6px;color:var(--warning);font-size:var(--fs-label);line-height:var(--lh-label);font-weight:700;}
    .limit-note{margin:7px 0 0;font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--text);}
    .takeaway{
      display:flex; align-items:center; gap:24px; padding:0 12px;
      font-size:var(--fs-lead); line-height:var(--lh-lead); color:var(--text);
    }
    .takeaway::before{content:"";width:8px;height:56px;flex:0 0 auto;background:var(--accent);border-radius:4px;}
    .takeaway strong{color:var(--accent-strong);}
    .exit-tag{
      position:absolute;right:0;bottom:104px;z-index:3;padding:10px 18px;
      border-left:3px solid var(--accent);background:var(--surface);color:var(--accent-strong);
      font-size:var(--fs-label);line-height:var(--lh-label);font-weight:720;
    }
    .exit-tag::after{content:"  →";}
  </style>
</head>
<body data-page="16" data-total="48">
  <div id="stage">
    <main class="transition-plate" aria-label="个体能力如何通过群体接续而被放大">
      <div class="k-process process-plate">
        <section class="min0" data-state="done">
          <div class="step-title">个体尝试</div>
          <div class="diagram" aria-hidden="true">
            <svg viewBox="0 0 270 190">
              <defs><marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#899bb0"/></marker></defs>
              <rect x="4" y="76" width="58" height="38" rx="5" fill="none" stroke="#899bb0"/>
              <path d="M62 95H100" fill="none" stroke="#899bb0" stroke-width="2" marker-end="url(#a1)"/>
              <circle cx="132" cy="61" r="15" fill="none" stroke="#58697d" stroke-width="2"/>
              <path d="M132 76V125M106 94H158M132 125L112 158M132 125L153 158" fill="none" stroke="#58697d" stroke-width="2"/>
              <path d="M161 95H251" fill="none" stroke="#899bb0" stroke-width="3" marker-end="url(#a1)"/>
              <text x="33" y="100" text-anchor="middle" fill="#58697d" font-size="15">任务</text>
            </svg>
          </div>
          <p class="step-copy">一个人能观察、记住并行动。</p>
        </section>

        <section class="min0 limit-step">
          <div class="step-title">遇到上限</div>
          <div class="diagram" aria-hidden="true">
            <svg viewBox="0 0 270 190">
              <defs><marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a45c00"/></marker></defs>
              <path d="M8 95H126" fill="none" stroke="#a45c00" stroke-width="3" marker-end="url(#a2)"/>
              <path d="M145 24V168" stroke="#a45c00" stroke-width="5" stroke-dasharray="11 7"/>
              <path d="M160 52H254M160 78H239M160 104H224M160 130H207" stroke="#c7d3e0" stroke-width="8"/>
              <text x="145" y="17" text-anchor="middle" fill="#a45c00" font-size="16" font-weight="700">个体上限</text>
            </svg>
          </div>
          <div class="limits"><span>体力有限</span><span>注意有限</span><span>记忆有限</span><span>时间有限</span></div>
          <p class="limit-note">更努力，仍不等于无限延长。</p>
        </section>

        <section class="min0">
          <div class="step-title">能力相接</div>
          <div class="diagram" aria-hidden="true">
            <svg viewBox="0 0 270 190">
              <path d="M8 98H260" fill="none" stroke="#899bb0" stroke-width="2" stroke-dasharray="6 6"/>
              <g fill="#fff" stroke="#0b73e0" stroke-width="2">
                <circle cx="48" cy="65" r="11"/><circle cx="112" cy="126" r="11"/><circle cx="176" cy="65" r="11"/><circle cx="238" cy="126" r="11"/>
              </g>
              <g stroke="#0b73e0" stroke-width="2" fill="none">
                <path d="M48 76V101M34 86H62"/><path d="M112 115V90M98 105H126"/><path d="M176 76V101M162 86H190"/><path d="M238 115V90M224 105H252"/>
                <path d="M16 98H78M82 98H142M146 98H206M210 98H262" stroke-width="4"/>
              </g>
            </svg>
          </div>
          <p class="step-copy">不同人的局部能力可以前后衔接。</p>
        </section>

        <section class="min0 collective-step" data-state="current">
          <div class="step-title">群体继续推进</div>
          <div class="diagram" aria-hidden="true">
            <svg viewBox="0 0 270 190">
              <defs><marker id="a4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0b73e0"/></marker></defs>
              <path d="M18 45L106 94M18 94H106M18 143L106 94" fill="none" stroke="#7357c8" stroke-width="2"/>
              <circle cx="18" cy="45" r="7" fill="#eee9ff" stroke="#7357c8"/><circle cx="18" cy="94" r="7" fill="#eee9ff" stroke="#7357c8"/><circle cx="18" cy="143" r="7" fill="#eee9ff" stroke="#7357c8"/>
              <path d="M106 94H264" fill="none" stroke="#0b73e0" stroke-width="7" marker-end="url(#a4)"/>
              <path d="M72 25V165" stroke="#a45c00" stroke-width="2" stroke-dasharray="7 6" opacity=".8"/>
              <text x="151" y="70" text-anchor="middle" fill="#0757aa" font-size="16" font-weight="700">群体放大器</text>
              <text x="72" y="181" text-anchor="middle" fill="#a45c00" font-size="14">越过个体上限</text>
            </svg>
          </div>
          <p class="step-copy">有限的人彼此接续，把任务推进得更远。</p>
        </section>
      </div>
      <div class="takeaway"><span>当个体能力触顶，<strong>群体开始成为真正的“放大器”</strong>；放大不是无限，而是接续。</span></div>
    </main>
    <div class="exit-tag">下一步：经验怎样留下并被改进？</div>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 16,
      kicker: 'CHAPTER 03 · COLLECTIVE AMPLIFIER',
      title: '一个人到不了的地方，群体可以接着走',
      take: '当个体能力触顶，群体开始成为真正的“放大器”。'
    });
    Deck.init({ index: 16, total: 48 });
  </script>
</body>
</html>
