<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>一件工具，怎样越过一代人的生命？</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    html.lec-root{top:0}.lec-header__inner{width:100%;display:grid;grid-template-columns:220px 210px minmax(0,1fr) 90px;align-items:center;gap:24px}.lec-header__inner>*{margin:0}.lec-header__title{font-size:var(--fs-h2)}.lesson{height:100%;display:grid;grid-template-rows:76px 1fr;gap:16px}.intro{display:flex;align-items:center;justify-content:space-between;gap:24px}.intro p{margin:0;max-width:820px}.metrics{display:flex;gap:10px}.metric{min-width:118px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);font-size:var(--fs-label);line-height:var(--lh-label);color:var(--muted)}.metric strong{display:block;color:var(--text);font-size:var(--fs-body)}
    culture-chain-game{display:block;min-height:0}.game{height:528px;display:grid;grid-template-rows:54px 1fr 68px;gap:12px}.steps{height:54px}.steps>div{padding:9px 10px!important;display:flex;align-items:center;justify-content:center;text-align:center;font-size:var(--fs-label);font-weight:700}.steps>div::before{width:24px!important;height:24px!important;margin:0 7px 0 0!important;flex:0 0 auto}.steps>div::after{left:calc(100% + 7px)!important;width:22px!important}.work{display:grid;grid-template-columns:240px 1fr 240px;gap:42px;min-height:0}.version{position:relative;min-width:0;padding:18px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow-panel)}.version:not(:last-child)::after{content:'→';position:absolute;left:calc(100% + 8px);top:46%;width:26px;text-align:center;color:var(--line-strong);font-size:var(--fs-h2);font-weight:800}.version.current{border:2px solid var(--accent);background:var(--accent-soft)}.version.next{border-style:dashed;background:transparent}.version h2{font-size:18px}.stone{height:112px;margin:12px 0;display:grid;place-items:center}.stone svg{width:100%;height:100%;overflow:visible}.stone-path{fill:#9aa6b4;stroke:#46576a;stroke-width:3}.edge{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round}.grip{fill:none;stroke:var(--secondary);stroke-width:12;stroke-dasharray:5 5}.crack{fill:none;stroke:var(--danger);stroke-width:3}.changed .edge,.changed .grip,.changed .crack{stroke:var(--warning)}.features{display:grid;gap:6px;font-size:var(--fs-label);line-height:var(--lh-label)}.features span{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:4px}.features b{color:var(--text)}.current-body{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:100%}.choice,.feedback{min-width:0;padding:14px;border-radius:var(--radius-sm);background:rgb(255 255 255 / 72%)}.choice label{display:block;margin:0 0 5px;font-size:var(--fs-label);font-weight:700}.choice select{width:100%;margin-bottom:10px}.feedback h2{margin-bottom:8px}.tests{display:grid;gap:7px}.test{padding:7px 9px;border-radius:var(--radius-sm);background:var(--surface-soft);font-size:var(--fs-label);line-height:var(--lh-label)}.test.pass{background:var(--success-soft);color:var(--success)}.test.fail{background:var(--danger-soft);color:var(--danger)}.status{margin:10px 0 0}.controls{display:flex;align-items:center;gap:12px;padding:10px 16px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}.controls .message{flex:1;margin:0}.controls button:disabled{opacity:.45;cursor:not-allowed}.empty{height:112px;margin:12px 0;display:grid;place-items:center;border:1px dashed var(--line-strong);border-radius:var(--radius-sm);color:var(--muted);font-size:var(--fs-label)}
    @media (prefers-reduced-motion:no-preference){.version.current{transition:border-color 220ms ease-out,background-color 220ms ease-out}.changed{animation:mark 600ms ease-out}@keyframes mark{from{opacity:.45;transform:translateX(-10px)}to{opacity:1;transform:none}}}
  </style>
</head>
<body data-page="17" data-total="48">
  <div id="stage">
    <section class="lesson">
      <div class="intro">
        <p class="fs-lead">关键不只是想出新办法，而是改进能被保存、复用，再成为下一次改进的起点。</p>
        <div class="metrics" aria-label="版本链读数">
          <div class="metric">当前版本<strong id="mVersion">V0</strong></div>
          <div class="metric">累积链长度<strong id="mChain">0</strong></div>
          <div class="metric">测试完成度<strong id="mPercent">0%</strong></div>
        </div>
      </div>
      <culture-chain-game></culture-chain-game>
    </section>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    class CultureChainGame extends HTMLElement{
      constructor(){super();this.attachShadow({mode:'open'});this.shadowRoot.innerHTML='<slot></slot>';this.reset(false)}
      initial(){return {edge:0,grip:0,strength:0}}
      reset(emit=true){this.savedVersions=[this.initial()];this.pending=null;this.tested=false;this.complete=false;if(this.isConnected)this.render();if(emit)this.dispatchEvent(new CustomEvent('game-reset',{bubbles:true,composed:true}))}
      connectedCallback(){this.render();this.dispatchEvent(new CustomEvent('game-start',{bubbles:true,composed:true}))}
      getState(){return JSON.parse(JSON.stringify({savedVersions:this.savedVersions,pending:this.pending,tested:this.tested,complete:this.complete}))}
      tests(v){return [
        {name:'切割测试',ok:v.edge===1,note:v.edge===2?'刃缘过薄，切割顺畅但易崩':'刃缘仍不连续'},
        {name:'握持测试',ok:v.grip===1,note:v.grip===2?'握区过深，稳定却限制换手':'握持仍不稳定'},
        {name:'耐用测试',ok:v.strength===1 && v.edge!==2,note:v.strength===2?'加固过重，受力稳定但操作变慢':'受力处仍易损'}
      ]}
      options(problem){return {
        edge:[['1','连续刃缘'],['2','极薄刃缘（易崩）']],
        grip:[['1','浅纹握区'],['2','深槽握区（限制换手）']],
        strength:[['1','局部加固'],['2','全面加厚（操作变慢）']]
      }[problem]}
      labels(v){const a=['不连续','连续','极薄'],b=['不稳定','浅纹稳定','深槽固定'],c=['易损','局部加固','全面加厚'];return {edge:a[v.edge],grip:b[v.grip],strength:c[v.strength]}}
      stone(v,changed=''){const crack=v.strength===0?'<path class="crack" d="M112 40l-12 18 13 12-15 20"/>':'';return `<div class="stone ${changed?'changed':''}" aria-label="抽象石器侧视轮廓"><svg viewBox="0 0 220 120" role="img" aria-hidden="true"><path class="stone-path" d="M24 72 Q45 22 104 18 Q170 20 201 55 Q174 93 105 106 Q51 102 24 72Z"/><path class="edge" d="M27 72 Q78 109 177 82" style="opacity:${v.edge?1:.25}"/><path class="grip" d="M70 38 Q55 65 72 91" style="opacity:${v.grip?1:.2}"/>${crack}</svg></div>`}
      featureRows(v){const l=this.labels(v);return `<div class="features"><span>刃缘 <b>${l.edge}</b></span><span>握持区 <b>${l.grip}</b></span><span>稳固度 <b>${l.strength}</b></span></div>`}
      render(){const current=this.savedVersions.at(-1), results=this.tests(this.pending||current), passed=results.filter(x=>x.ok).length, total=results.length, phase=this.complete?5:this.pending?(this.tested?4:3):1;const problemDefault=current.edge!==1?'edge':current.grip!==1?'grip':'strength';
        this.innerHTML=`<div class="game"><div class="k-process steps" aria-label="累积文化过程">${['接收旧方案','选择问题','局部改造','同一测试','保存新版','传给下一代'].map((x,i)=>`<div data-state="${i<phase?'done':i===phase?'current':''}">${x}</div>`).join('')}</div><div class="work"><section class="version"><h2>继承版本 V${this.savedVersions.length-1}</h2>${this.stone(current)}${this.featureRows(current)}</section><section class="version current"><div class="current-body"><div class="choice"><label for="problem">本代只处理一个问题</label><select id="problem" ${this.pending?'disabled':''}><option value="edge" ${problemDefault==='edge'?'selected':''}>刃缘不连续</option><option value="grip" ${problemDefault==='grip'?'selected':''}>握持不稳定</option><option value="strength" ${problemDefault==='strength'?'selected':''}>受力处易损</option></select><label for="change">选择局部改造</label><select id="change" ${this.pending?'disabled':''}></select><p class="note">其余特征从上一版直接继承。</p></div><div class="feedback"><h2>${this.tested?'固定测试结果':'待测试方案'}</h2>${this.pending?this.stone(this.pending,'yes'):this.stone(current)}<div class="tests">${results.map(r=>`<div class="test ${this.tested?(r.ok?'pass':'fail'):''}">${this.tested?(r.ok?'通过：':'未通过：'):''}${r.name}${this.tested&&!r.ok?' · '+r.note:''}</div>`).join('')}</div></div></div></section><section class="version next"><h2>下一代起点</h2>${this.savedVersions.length>1?this.stone(current):'<div class="empty">保存后复制到这里</div>'}<div class="features"><span>继承项 <b>${this.pending?Object.keys(current).filter(k=>this.pending[k]===current[k]).length:3}</b></span><span>本代改动 <b>${this.pending?Object.keys(current).filter(k=>this.pending[k]!==current[k]).length:0}</b></span><span>通过测试 <b>${passed}/${total}</b></span></div></section></div><div class="controls"><p class="message fs-sec" aria-live="polite">${this.complete?'全部固定测试通过。这个版本可继续被复用与改进。':this.tested?'测试揭示改善、未变项与代价；保存后才能传递。':'选择一个局部改造，再执行同一组测试。'}</p><button id="test" data-primary ${this.pending||this.complete?'disabled':''}>测试</button><button id="save" ${!this.tested||this.complete?'disabled':''}>保存并传递</button><button id="reset">重置</button></div></div>`;
        const problem=this.querySelector('#problem'), change=this.querySelector('#change');const fill=()=>{change.innerHTML=this.options(problem.value).map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')};fill();problem.onchange=fill;
        this.querySelector('#test').onclick=()=>{const next={...current};next[problem.value]=Number(change.value);this.pending=next;this.tested=true;this.render();this.progress('test')};
        this.querySelector('#save').onclick=()=>{this.savedVersions.push({...this.pending});this.pending=null;this.tested=false;this.complete=this.tests(this.savedVersions.at(-1)).every(x=>x.ok);this.render();this.progress('save');if(this.complete)this.dispatchEvent(new CustomEvent('game-complete',{detail:{score:this.savedVersions.length-1,metrics:this.metrics(),trace:this.savedVersions},bubbles:true,composed:true}))};this.querySelector('#reset').onclick=()=>this.reset();this.updateMetrics(passed,total)}
      metrics(){const v=this.savedVersions.at(-1),p=this.tests(v).filter(x=>x.ok).length;return {versions:this.savedVersions.length-1,passed:p,total:this.tests(v).length}}
      updateMetrics(p,t){document.querySelector('#mVersion').textContent='V'+(this.savedVersions.length-1);document.querySelector('#mChain').textContent=String(this.savedVersions.length-1);document.querySelector('#mPercent').textContent=Lec.P.percent(p/t)}
      progress(action){this.dispatchEvent(new CustomEvent('game-progress',{detail:{state:this.getState(),action,metrics:this.metrics()},bubbles:true,composed:true}))}
      start(){this.reset(false);this.dispatchEvent(new CustomEvent('game-start',{bubbles:true,composed:true}))}
    }
    customElements.define('culture-chain-game',CultureChainGame);
    Lec.mount({index:17,kicker:'CULTURE · CUMULATES',title:'一件工具，怎样越过一代人的生命？',take:'可保留并改进前人方案，才产生累积文化。'});
    Deck.init({index:17,total:48});
  </script>
</body>
</html>
