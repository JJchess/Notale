<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>火改变的不只是食物</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{transform:translate(-50%,-50%) scale(var(--s)) translateY(-96px)!important}.lec-footer{transform:translateY(-96px)}.p18{height:620px;display:grid;grid-template-rows:58px 1fr 54px;gap:12px}.heat-chain{display:grid;grid-template-columns:1fr 34px 1fr 34px 1fr;align-items:center;border-bottom:2px solid var(--line-strong);padding:0 12px;background:var(--surface)}.heat-chain b{font-size:16px;text-align:center}.heat-chain i{font-style:normal;color:var(--warning);font-size:22px;text-align:center}.heat-chain output{justify-self:center;min-width:122px;padding:4px 8px;font-size:16px}.main{display:grid;grid-template-columns:600px 1fr;gap:20px;min-height:0}.scene{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-md);background:linear-gradient(#eaf1f8 0 68%,#ced8e2 68%);box-shadow:var(--shadow-panel)}.scene canvas{z-index:1}.scene-top{position:absolute;z-index:3;inset:12px 12px auto;display:flex;justify-content:space-between;align-items:center;gap:8px}.scene-top .hint{max-width:280px}.controls{position:absolute;z-index:3;left:12px;right:12px;bottom:10px;display:flex;gap:8px;align-items:center}.controls button{background:var(--surface)}.controls button:last-child{margin-left:auto}.status{position:absolute;z-index:3;left:16px;top:62px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.9);font-size:16px;font-weight:750}.compare{--comparison-cols:2;grid-template-columns:138px repeat(2,minmax(0,1fr));grid-template-rows:46px repeat(4,1fr);height:100%}.compare>*{padding:8px 10px;font-size:16px;line-height:1.38}.compare [data-heading]{font-size:17px}.metric{display:flex;flex-direction:column;justify-content:center;gap:4px}.metric strong{font-size:16px}.bar{height:8px;border-radius:8px;background:var(--surface-muted);overflow:hidden}.bar>i{display:block;height:100%;width:var(--v);background:var(--warning);transition:width .2s}.timebar{display:flex;height:10px;border-radius:8px;overflow:hidden;background:var(--surface-muted)}.timebar i:nth-child(1){background:var(--warning)}.timebar i:nth-child(2){background:var(--danger)}.timebar i:nth-child(3){background:var(--accent)}.people{letter-spacing:5px;color:var(--warning);font-size:20px}.bottom{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}.bottom p{margin:0;font-size:16px;line-height:1.4}.bottom .note{text-align:right;font-size:16px}.overheat [data-diff]{background:var(--danger-soft)}
  </style>
</head>
<body data-page="18" data-total="48">
  <div id="stage">
    <section class="p18">
      <div class="heat-chain" aria-label="热量变化因果链">
        <b>燃料投入 <output id="power">—</output></b><i>→</i><b>传入热量 <output id="heat">—</output></b><i>→</i><b>食物状态 <output id="index">—</output></b>
      </div>
      <div class="main">
        <div class="scene no-pan" id="scene">
          <canvas id="world" class="cv-fill" aria-hidden="true"></canvas>
          <div class="scene-top"><span></span><output id="elapsed" title="加热时间">—</output></div>
          <div class="status" id="foodState" aria-live="polite">未充分变化</div>
          <div class="controls ctl" aria-label="键盘操作">
            <button id="lessFuel" aria-label="减少燃料">− 燃料</button><button id="moreFuel" aria-label="增加燃料">＋ 燃料</button><button id="raise">升高容器</button><button id="lower">降低容器</button><button id="reset">恢复初始火候</button>
          </div>
        </div>
        <div class="k-comparison compare" id="compare">
          <div data-axis></div><div data-heading>未经受控加热</div><div data-heading data-diff>当前火候</div>
          <div data-axis>食物状态</div><div class="metric">结构较硬；需更多咀嚼与处理</div><div class="metric" data-diff><strong id="stateText">未充分变化</strong><div class="bar"><i id="stateBar"></i></div></div>
          <div data-axis>可用能量</div><div class="metric"><strong id="rawEnergy">—</strong><span>基线可用份额</span></div><div class="metric" data-diff><strong id="usable">—</strong><div class="bar"><i id="energyBar"></i></div></div>
          <div data-axis>主动处理时间</div><div class="metric"><strong id="rawTime">—</strong><span>咀嚼、切碎或等待软化</span></div><div class="metric" data-diff><strong id="activeTime">—</strong><div class="timebar" title="准备／看护／无需手操作的等待"><i id="prepSeg"></i><i id="tendSeg"></i><i id="waitSeg"></i></div><span id="waitText">—</span></div>
          <div data-axis>社交空间</div><div class="metric">处理围绕单个食物发生</div><div class="metric" data-diff><span class="people" id="people" aria-label="共享热源周围的停留位置"></span><span>共同停留、轮换看护与分享的条件</span></div>
        </div>
      </div>
      <div class="bottom"><p><b>火没有凭空制造能量。</b>它改变某些食物的结构，也重新分配处理、看护与等待的时间。</p><p class="note">这是比较方向的课堂模型；实际效果随食物、处理方法、火候与个体消化状况而异。</p></div>
    </section>
  </div>
  <script src="assets/lib/matter.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:18,kicker:'COLLECTIVE ENERGY',title:'火改变的不只是食物',take:'火改变的不只是食物，也改变了可用能量、时间和社交空间'});
    Deck.init({index:18,total:48});
    const {Engine,Bodies,Body,Composite,Constraint,Query}=Matter, P=Lec.P;
    const modelDefaults={page18HeatSourceMinPower:400,page18HeatSourceMaxPower:1600,page18InitialHeatingSeconds:30,page18MinHeatCoupling:.08,page18MaxHeatCoupling:.65,page18ContainerEfficiency:.72,page18TargetTransferredEnergy:180000,page18RawUsableEnergyIndex:68,page18UsefulHeatingStart:.35,page18UsefulHeatingEnd:.82,page18CookedUsableEnergyIndex:88,page18OverheatLossRate:24,page18RawActiveProcessingSeconds:900,page18PrepSeconds:120,page18TendingFraction:.28,page18CookedChewingSeconds:300,page18SharedHearthFigureCount:5};
    const K=new Proxy(Lec.K,{get:(o,k)=>o[k]??modelDefaults[k]});
    const cv=document.getElementById('world'), scene=document.getElementById('scene'), engine=Engine.create({gravity:{x:0,y:1}});
    const W=600,H=408, ground=Bodies.rectangle(300,350,620,30,{isStatic:true}), hearth=Bodies.rectangle(300,326,125,20,{isStatic:true,label:'hearth'});
    const pot=Bodies.rectangle(300,185,150,54,{label:'pot',frictionAir:.08}), rope=Constraint.create({pointA:{x:300,y:70},bodyB:pot,pointB:{x:0,y:-28},length:112,stiffness:.18,damping:.12});
    let fuels=[], heating=K.page18InitialHeatingSeconds, transferred=0, released=0, fuelCount=2, lastSpeak=0, drag=null;
    Composite.add(engine.world,[ground,hearth,pot,rope]);
    function addFuel(){if(fuels.length>=6)return;const x=185+fuels.length*26,b=Bodies.rectangle(x,90,38,20,{label:'fuel',chamfer:{radius:4},friction:.8,restitution:.05});fuels.push(b);Composite.add(engine.world,b);fuelCount=fuels.length}
    function removeFuel(){const b=fuels.pop();if(b){Composite.remove(engine.world,b);fuelCount=fuels.length}}
    addFuel();addFuel();
    const $=id=>document.getElementById(id), els={power:$('power'),heat:$('heat'),index:$('index'),elapsed:$('elapsed'),foodState:$('foodState'),stateText:$('stateText'),stateBar:$('stateBar'),rawEnergy:$('rawEnergy'),usable:$('usable'),energyBar:$('energyBar'),rawTime:$('rawTime'),activeTime:$('activeTime'),waitText:$('waitText'),people:$('people')};
    els.people.textContent='●'.repeat(K.page18SharedHearthFigureCount);
    function model(dt){const ratio=fuelCount/6,power=K.page18HeatSourceMinPower+(K.page18HeatSourceMaxPower-K.page18HeatSourceMinPower)*ratio;const d=Math.max(35,Math.abs(pot.position.y-hearth.position.y)),near=Deck.clamp(1-(d-55)/210,0,1),coupling=K.page18MinHeatCoupling+(K.page18MaxHeatCoupling-K.page18MinHeatCoupling)*near;heating+=dt;const e=P.energyFromPower(power,dt);released+=e;transferred+=e*coupling*K.page18ContainerEfficiency;const progress=transferred/K.page18TargetTransferredEnergy, pct=Deck.clamp(progress*100,0,100);let usable,state;if(progress<K.page18UsefulHeatingStart){usable=K.page18RawUsableEnergyIndex+(K.page18CookedUsableEnergyIndex-K.page18RawUsableEnergyIndex)*(progress/K.page18UsefulHeatingStart)*.45;state='未充分变化'}else if(progress<=K.page18UsefulHeatingEnd){usable=K.page18RawUsableEnergyIndex+(K.page18CookedUsableEnergyIndex-K.page18RawUsableEnergyIndex)*((progress-K.page18UsefulHeatingStart)/(K.page18UsefulHeatingEnd-K.page18UsefulHeatingStart)*.55+.45);state='结构软化'}else{usable=Math.max(0,K.page18CookedUsableEnergyIndex-(progress-K.page18UsefulHeatingEnd)*K.page18OverheatLossRate);state='焦损'}const active=K.page18PrepSeconds+K.page18TendingFraction*heating+K.page18CookedChewingSeconds,wait=heating*(1-K.page18TendingFraction);update({power,pct,usable,state,active,wait,heating,progress});}
    function update(m){els.power.textContent=P.formatNumber(m.power)+' W';els.heat.textContent=P.formatNumber(transferred/1000)+' kJ';els.index.textContent=P.formatNumber(m.pct)+'%';els.elapsed.textContent=P.formatDuration(m.heating);els.foodState.textContent=els.stateText.textContent=m.state;els.stateBar.style.setProperty('--v',m.pct+'%');els.rawEnergy.textContent=P.formatNumber(K.page18RawUsableEnergyIndex)+'% 基线';els.usable.textContent=P.formatNumber(m.usable)+'% of baseline';els.energyBar.style.setProperty('--v',Deck.clamp(m.usable,0,100)+'%');els.rawTime.textContent=P.formatDuration(K.page18RawActiveProcessingSeconds);els.activeTime.textContent='主动 '+P.formatDuration(m.active);els.waitText.textContent='无需手操作 '+P.formatDuration(m.wait);const total=m.active+m.wait;$('prepSeg').style.width=(K.page18PrepSeconds/total*100)+'%';$('tendSeg').style.width=(K.page18TendingFraction*m.heating/total*100)+'%';$('waitSeg').style.width=(m.wait/total*100)+'%';$('compare').classList.toggle('overheat',m.state==='焦损');if(heating-lastSpeak>8){els.foodState.setAttribute('aria-label',`${m.state}，相对可用能量 ${P.formatNumber(m.usable)}%，等待时间 ${P.formatDuration(m.wait)}`);lastSpeak=heating}}
    function draw(){const c=Deck.fit(cv), colors={text:Deck.token('--text'),warn:Deck.token('--warning'),danger:Deck.token('--danger'),surface:Deck.token('--surface'),line:Deck.token('--line-strong')};c.clearRect(0,0,cv.width,cv.height);c.save();c.fillStyle=colors.line;c.fillRect(0,335,600,30);c.fillStyle='#70452e';fuels.forEach(b=>{c.save();c.translate(b.position.x,b.position.y);c.rotate(b.angle);c.fillRect(-19,-10,38,20);c.restore()});const flame=18+fuelCount*5;c.fillStyle=colors.warn;c.beginPath();c.moveTo(270,326);c.quadraticCurveTo(300,326-flame*2,330,326);c.quadraticCurveTo(300,315,270,326);c.fill();c.strokeStyle=colors.line;c.lineWidth=3;c.beginPath();c.moveTo(300,70);c.lineTo(pot.position.x,pot.position.y-28);c.stroke();c.save();c.translate(pot.position.x,pot.position.y);c.rotate(pot.angle);c.fillStyle=colors.text;c.fillRect(-75,-27,150,54);c.fillStyle=els.stateText.textContent==='焦损'?colors.danger:'#d99a45';c.fillRect(-58,-10,116,22);c.restore();c.restore()}
    function reset(){fuels.forEach(b=>Composite.remove(engine.world,b));fuels=[];fuelCount=0;addFuel();addFuel();Body.setPosition(pot,{x:300,y:185});Body.setVelocity(pot,{x:0,y:0});Body.setAngle(pot,0);heating=K.page18InitialHeatingSeconds;transferred=0;released=0;lastSpeak=0;model(0);draw()}
    $('moreFuel').onclick=addFuel;$('lessFuel').onclick=removeFuel;$('raise').onclick=()=>Body.setPosition(pot,{x:pot.position.x,y:Math.max(115,pot.position.y-20)});$('lower').onclick=()=>Body.setPosition(pot,{x:pot.position.x,y:Math.min(270,pot.position.y+20)});$('reset').onclick=reset;
    scene.addEventListener('pointerdown',e=>{const p=Deck.pt(scene,e),hits=Query.point([pot,...fuels],p);if(hits.length){drag=hits[0];scene.setPointerCapture(e.pointerId)}});scene.addEventListener('pointermove',e=>{if(!drag)return;const p=Deck.pt(scene,e);Body.setPosition(drag,{x:Deck.clamp(p.x,30,570),y:Deck.clamp(p.y,80,315)});Body.setVelocity(drag,{x:0,y:0})});scene.addEventListener('pointerup',()=>drag=null);
    Deck.loop((t,dt)=>{const s=Math.min(dt,40)/1000;Engine.update(engine,Math.min(dt,40));if(s)model(s);draw()},{still:1000});reset();
  </script>
</body>
</html>
