<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>一个孩子，需要怎样的育儿网络？</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    html{top:0!important;right:auto!important;bottom:auto!important;left:0!important;width:1600px!important;height:900px!important}
    body{width:1600px!important;height:900px!important}
    .lec-header__inner{position:relative;top:4px}
    .page19{position:absolute;left:96px;top:96px;width:1408px;height:620px;display:grid;grid-template-rows:84px 1fr;gap:14px;min-width:0;min-height:0;box-sizing:border-box}
    .intro{display:flex;align-items:end;justify-content:space-between;gap:32px;min-width:0}
    .intro p{margin:0;max-width:650px;color:var(--muted)}
    .network-shell{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;min-width:0;min-height:0;padding:12px;border-width:2px}
    .network{position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-md);background:linear-gradient(135deg,var(--surface),var(--surface-soft))}
    #care-svg{display:block;width:100%;height:100%}
    .zone{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:5 7}
    .zone-label{font-size:14px;fill:var(--muted);font-weight:650}
    .link{fill:none;stroke-width:4}
    .node circle{stroke:var(--surface);stroke-width:3;filter:drop-shadow(0 4px 6px rgb(36 56 82 / 18%))}
    .node text{font-size:15px;font-weight:720;fill:var(--text);text-anchor:middle;pointer-events:none}
    .node[data-active="false"] circle{fill:var(--surface-muted);stroke:var(--line-strong);stroke-width:2;stroke-dasharray:4 3}
    .node[data-selected="true"] circle{stroke:var(--accent-strong);stroke-width:5}
    .child-label{font-size:16px!important;fill:#fff!important}
    .need-bg{fill:none;stroke:var(--line);stroke-width:11}
    .need-arc{fill:none;stroke-width:11;stroke-linecap:round}
    .sidebar{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0;padding:14px!important}
    .sidebar h2{font-size:20px}
    .legend-list{display:flex;flex-direction:column;gap:7px}
    .legend-row{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;font-size:15px;line-height:1.4}
    .mark{width:22px;border-top:4px solid currentColor}
    .mark.dash{border-top-style:dashed}.mark.dot{border-top-style:dotted}.mark.double{border-top:7px double currentColor}
    .status{font-size:14px;color:var(--muted)}
    .controls{display:flex;flex-direction:column;gap:8px;margin-top:auto}
    .controls select,.controls button{width:100%}
    .instruction{margin:0;color:var(--muted)}
    .summary{margin:0;padding-top:10px;border-top:1px solid var(--line);color:var(--text)}
    .selected-name{color:var(--accent-strong);font-weight:750}
  </style>
</head>
<body data-page="19" data-total="48">
  <div id="stage">
    <main class="page19">
      <section class="intro">
        <div><h1>一个孩子，需要怎样的育儿网络？</h1></div>
        <p class="fs-sec">长童年把养育从单一关系扩展为多人合作系统。关键是不同照料任务能否由多条关系共同承接。</p>
      </section>
      <section class="network-shell k-classification" aria-label="儿童持续照料的参与者与贡献分类">
        <div class="network min0 no-pan">
          <svg id="care-svg" viewBox="0 0 1080 490" role="img" aria-labelledby="net-title net-desc">
            <title id="net-title">合作育儿关系网络</title>
            <desc id="net-desc">中央是成长中的儿童。画布边缘的候选参与者可加入网络，并按贡献类型连接到儿童。</desc>
          </svg>
        </div>
        <aside class="sidebar class-group min0" aria-label="贡献类别与网络状态">
          <h2>做了什么？</h2>
          <div id="legend" class="legend-list"></div>
          <p class="instruction fs-sec">拖动边缘节点进入网络；或聚焦节点后按 Enter。选中已加入的节点，再添加一种贡献。</p>
          <div class="controls">
            <div class="fs-label">当前节点：<span id="selected-name" class="selected-name">主要照料者</span></div>
            <select id="type-select" aria-label="选择贡献类型"></select>
            <button id="connect-btn" data-primary>添加这项贡献</button>
            <button id="remove-btn">移除当前参与者</button>
          </div>
          <p id="summary" class="summary fs-sec" aria-live="polite"></p>
        </aside>
      </section>
    </main>
  </div>

  <script src="assets/lib/d3.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 19,
      kicker: 'COOPERATIVE CARE',
      title: '一个孩子，需要怎样的育儿网络？',
      take: '长童年把养育从母子关系扩展为多人合作系统'
    });
    Deck.init({ index: 19, total: 48 });

    const careContributionTypes = [
      {id:'direct', label:'直接照料', color:'#0b73e0', dash:null, icon:'●'},
      {id:'material', label:'物质供给', color:'#a45c00', dash:'10 5', icon:'◆'},
      {id:'safety', label:'安全保护', color:'#207a5a', dash:'3 5', icon:'▲'},
      {id:'social', label:'经验与社会支持', color:'#7357c8', dash:'14 4 3 4', icon:'✦'}
    ];
    const careNetworkScenario = {participants:[
      {id:'primary', label:'主要照料者', group:'主要照料者', active:true, x:455, y:245},
      {id:'relative1', label:'另一位亲属', group:'其他亲属', x:120, y:100},
      {id:'relative2', label:'成年亲属', group:'其他亲属', x:120, y:390},
      {id:'older', label:'年长儿童', group:'同辈或年长儿童', x:930, y:105},
      {id:'peer', label:'同辈儿童', group:'同辈或年长儿童', x:930, y:385},
      {id:'member', label:'非亲属成员', group:'非亲属成员', x:540, y:52}
    ]};
    const nodes = careNetworkScenario.participants.map(d=>({...d}));
    const child = {id:'child',label:'成长中的儿童',active:true,fx:540,fy:245,x:540,y:245};
    nodes.push(child);
    let activeLinks = [{source:'primary',target:'child',type:'direct'}];
    const activeParticipants = new Set(['primary']);
    let selectedId = 'primary';

    const svg=d3.select('#care-svg'), g=svg.append('g');
    const zones=[['其他亲属',18,22,205,446],['同辈或年长儿童',855,22,205,446],['主要照料者',250,385,220,80],['非亲属成员',425,15,230,74]];
    g.selectAll('.zone').data(zones).join('rect').attr('class','zone').attr('x',d=>d[1]).attr('y',d=>d[2]).attr('width',d=>d[3]).attr('height',d=>d[4]).attr('rx',16);
    g.selectAll('.zone-label').data(zones).join('text').attr('class','zone-label').attr('x',d=>d[1]+12).attr('y',d=>d[2]+22).text(d=>d[0]);
    const ringG=g.append('g').attr('transform','translate(540,245)');
    ringG.selectAll('.need-bg').data(careContributionTypes).join('path').attr('class','need-bg').attr('d',(d,i)=>d3.arc()({innerRadius:73,outerRadius:73,startAngle:i*Math.PI/2+.08,endAngle:(i+1)*Math.PI/2-.08}));
    const arcSel=ringG.selectAll('.need-arc').data(careContributionTypes).join('path').attr('class','need-arc');
    const linkG=g.append('g'), nodeG=g.append('g');
    const simulation=d3.forceSimulation(nodes).force('link',d3.forceLink().id(d=>d.id).distance(170).strength(.55)).force('charge',d3.forceManyBody().strength(-280)).force('collide',d3.forceCollide().radius(d=>d.id==='child'?92:58)).force('x',d3.forceX(d=>d.id==='child'?540:d.x).strength(d=>d.active?.08:.35)).force('y',d3.forceY(d=>d.id==='child'?245:d.y).strength(d=>d.active?.08:.35)).alphaDecay(.08);

    function activate(d){if(d.id==='child')return; d.active=true; activeParticipants.add(d.id); selectedId=d.id; render(); simulation.alpha(.7).restart();}
    function render(){
      const counts=new Map(careContributionTypes.map(t=>[t.id,activeLinks.filter(l=>(typeof l.source==='object'?l.source.id:l.source) && l.type===t.id).length]));
      arcSel.attr('d',(d,i)=>d3.arc()({innerRadius:73,outerRadius:73,startAngle:i*Math.PI/2+.08,endAngle:(i+1)*Math.PI/2-.08})).attr('stroke',d=>counts.get(d.id)?d.color:'transparent').attr('stroke-width',d=>counts.get(d.id)>1?17:11);
      const links=linkG.selectAll('.link').data(activeLinks,d=>(typeof d.source==='object'?d.source.id:d.source)+'-'+d.type).join('path').attr('class','link').attr('stroke',d=>careContributionTypes.find(t=>t.id===d.type).color).attr('stroke-dasharray',d=>careContributionTypes.find(t=>t.id===d.type).dash||null);
      const ns=nodeG.selectAll('.node').data(nodes,d=>d.id).join(enter=>{const n=enter.append('g').attr('class','node').attr('tabindex',d=>d.id==='child'?-1:0).attr('role','button');n.append('circle').attr('r',d=>d.id==='child'?56:43);n.append('text').attr('dy','.35em').attr('class',d=>d.id==='child'?'child-label':null).text(d=>d.label);return n;})
        .attr('data-active',d=>d.active?'true':'false').attr('data-selected',d=>d.id===selectedId?'true':'false').attr('aria-label',d=>d.id==='child'?d.label:`${d.group}，${d.label}，${d.active?'已加入，按回车选中':'候选，按回车加入'}`)
        .on('click',(e,d)=>{if(!d.active)activate(d);else if(d.id!=='child'){selectedId=d.id;render();}})
        .on('keydown',(e,d)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!d.active)activate(d);else if(d.id!=='child'){selectedId=d.id;render();}}})
        .call(d3.drag().on('start',(e,d)=>{if(d.id==='child')return;if(!e.active)simulation.alphaTarget(.25).restart();d.fx=d.x;d.fy=d.y;}).on('drag',(e,d)=>{if(d.id==='child')return;d.fx=e.x;d.fy=e.y;}).on('end',(e,d)=>{if(d.id==='child')return;simulation.alphaTarget(0);if(Math.hypot(d.x-540,d.y-245)<330)activate(d);d.fx=null;d.fy=null;}));
      simulation.force('link').links(activeLinks);
      simulation.on('tick',()=>{nodes.forEach(d=>{d.x=Math.max(58,Math.min(1022,d.x));d.y=Math.max(48,Math.min(442,d.y));});links.attr('d',d=>`M${d.source.x},${d.source.y} L${d.target.x},${d.target.y}`);ns.attr('transform',d=>`translate(${d.x},${d.y})`);});
      const selected=nodes.find(n=>n.id===selectedId);document.getElementById('selected-name').textContent=selected?selected.label:'未选择';
      document.getElementById('remove-btn').disabled=!selected||selected.id==='primary';
      const covered=[...counts.values()].filter(v=>v>0).length, shared=[...counts.values()].filter(v=>v>1).length;
      document.getElementById('summary').textContent=`已加入 ${activeParticipants.size} 位参与者；${covered} 类需求已有人承接${shared?`，其中 ${shared} 类由多人共同承接`:''}。`;
      d3.select('#legend').selectAll('.legend-row').data(careContributionTypes).join('div').attr('class','legend-row').html(d=>`<span class="mark ${d.id==='material'?'dash':d.id==='safety'?'dot':d.id==='social'?'double':''}" style="color:${d.color}"></span><span>${d.icon} ${d.label}</span><span class="status">${counts.get(d.id)===0?'尚未有人承接':counts.get(d.id)===1?'已有人承接':'多人共同承接'}</span>`);
    }
    d3.select('#type-select').selectAll('option').data(careContributionTypes).join('option').attr('value',d=>d.id).text(d=>d.label);
    document.getElementById('connect-btn').addEventListener('click',()=>{const n=nodes.find(d=>d.id===selectedId);if(!n||!n.active)return;const type=document.getElementById('type-select').value;if(!activeLinks.some(l=>(typeof l.source==='object'?l.source.id:l.source)===selectedId&&l.type===type))activeLinks.push({source:selectedId,target:'child',type});render();simulation.alpha(.5).restart();});
    document.getElementById('remove-btn').addEventListener('click',()=>{if(selectedId==='primary')return;const n=nodes.find(d=>d.id===selectedId);n.active=false;activeParticipants.delete(selectedId);activeLinks=activeLinks.filter(l=>(typeof l.source==='object'?l.source.id:l.source)!==selectedId);selectedId='primary';n.x=n.x<540?120:930;n.y=n.y<245?105:385;render();simulation.alpha(.6).restart();});
    render();simulation.alpha(1).restart();
  </script>
</body>
</html>
