<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>不在眼前，也能传过去</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    html.lec-root{top:0}
    .lec-header__inner{transform:translateY(var(--sp-1))}
    .p20{width:var(--content-w);height:var(--content-h);margin:var(--header-h) auto 0;display:grid;grid-template-rows:92px 1fr 58px;gap:var(--sp-4)}
    .p20 .k-process{gap:30px}
    .p20 .k-process>section{padding:var(--sp-2) var(--sp-3);display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-label);line-height:var(--lh-label)}
    .p20 .k-process>section::before{width:26px;height:26px;margin:0;flex:0 0 auto}
    .p20 .k-process>section:not(:last-child)::after{left:calc(100% + 2px);width:26px}
    .triptych{display:grid;grid-template-columns:1fr 0.72fr 1fr;gap:var(--sp-5);min-height:0}
    .station{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-panel);padding:var(--sp-4);display:grid;grid-template-rows:auto 1fr auto;gap:var(--sp-3)}
    .station:not(:last-child)::after{content:'→';position:absolute;z-index:3;right:-25px;top:48%;width:24px;text-align:center;color:var(--accent);font-size:var(--fs-h2);font-weight:800}
    .station h2{display:flex;justify-content:space-between;align-items:baseline}
    .role{color:var(--muted);font-size:var(--fs-label);font-weight:600}
    .board{position:relative;min-height:0;border:1px dashed var(--line-strong);border-radius:var(--radius-md);background:var(--surface-soft);overflow:hidden}
    .board svg{width:100%;height:100%;display:block;touch-action:none}
    .cover{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#172033,#2b3d57);color:#fff;font-size:var(--fs-body);line-height:var(--lh-body);text-align:center;padding:var(--sp-5)}
    .chips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
    .chips button{flex:1 1 30%;padding-inline:var(--sp-2)}
    .chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
    .channel{display:grid;place-items:center;text-align:center;background:linear-gradient(180deg,var(--surface),var(--accent-soft));}
    .wave{display:flex;align-items:center;justify-content:center;gap:7px;height:84px}
    .wave i{display:block;width:6px;height:20px;border-radius:5px;background:var(--accent);opacity:.24}
    .wave.live i{animation:pulse .7s ease-in-out infinite alternate;opacity:1}.wave i:nth-child(2n){animation-delay:.12s}.wave i:nth-child(3n){animation-delay:.24s}
    @keyframes pulse{to{height:64px}}
    .caption{min-height:58px;font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--text);padding:0 var(--sp-3)}
    .receiver-help{font-size:var(--fs-label);line-height:var(--lh-label);color:var(--muted)}
    .actionrow{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);min-height:44px}
    .status{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
    .feedback{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-left:5px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius-sm);font-size:var(--fs-body);line-height:var(--lh-body)}
    .feedback strong{white-space:nowrap}.feedback[data-tone="success"]{border-color:var(--success);background:var(--success-soft)}.feedback[data-tone="warning"]{border-color:var(--warning);background:var(--warning-soft)}
    .piece{cursor:grab}.piece:focus{outline:4px solid var(--focus);outline-offset:3px}.piece:active{cursor:grabbing}
    .overlay-target{opacity:.36;pointer-events:none}.hidden{display:none!important}
    @media (prefers-reduced-motion:reduce){.wave.live i{animation:none;height:42px}}
  </style>
</head>
<body data-page="20" data-total="48">
  <div id="stage">
    <main class="p20" aria-label="未知图形通信游戏">
      <div class="k-process" aria-label="语言传递过程">
        <section data-state="current">发送者看见</section><section>选择特征</section><section>组织步骤</section><section>语言越过遮挡</section><section>接收者执行</section><section>对照并纠错</section>
      </div>
      <div class="triptych">
        <section class="station min0" aria-labelledby="sender-title">
          <h2 id="sender-title">发送者 <span class="role">目标只在这里可见</span></h2>
          <div class="board">
            <svg viewBox="0 0 360 270" role="img" aria-label="陌生组合图形：方框内有圆点，上方有朝上的三角形，并由短线连接">
              <rect x="92" y="105" width="176" height="124" rx="8" fill="#fff" stroke="#7357c8" stroke-width="8"/>
              <circle cx="180" cy="167" r="25" fill="#0b73e0"/>
              <line x1="180" y1="105" x2="180" y2="78" stroke="#172033" stroke-width="8"/>
              <path d="M180 28 L218 78 L142 78 Z" fill="#f29b38" stroke="#a45c00" stroke-width="5"/>
            </svg>
            <div id="cover" class="cover hidden">目标已离开视野<br>现在只能依靠刚才听到的话</div>
          </div>
          <div id="sendControls" class="chips" aria-label="按先后选择口头指令">
            <button type="button" data-msg="先放一个方框，作为共同参照。">先定参照</button>
            <button type="button" data-msg="把圆点放在方框中央里面。">再说包含</button>
            <button type="button" data-msg="把朝上的三角形放在方框正上方，并用短线相连。">最后说方向与连接</button>
            <button type="button" id="transmit" data-primary disabled>传递一次</button>
          </div>
        </section>
        <section class="station min0" aria-labelledby="channel-title">
          <h2 id="channel-title">传递中 <span class="role">不留下记录</span></h2>
          <div class="board channel">
            <div>
              <div id="wave" class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
              <div id="caption" class="caption" aria-live="polite">依次点选三段信息，再传递。</div>
            </div>
          </div>
          <div class="status">参照 → 部件 → 方向与连接</div>
        </section>
        <section class="station min0" aria-labelledby="receiver-title">
          <h2 id="receiver-title">接收者 <span class="role">看不到目标</span></h2>
          <div class="board no-pan">
            <svg id="work" viewBox="0 0 360 270" role="img" aria-label="重建区。拖动圆和三角形；聚焦后用方向键移动，按 R 旋转三角形。">
              <rect x="92" y="105" width="176" height="124" rx="8" fill="#fff" stroke="#7357c8" stroke-width="8"/>
              <line id="link" x1="70" y1="105" x2="70" y2="78" stroke="#172033" stroke-width="8"/>
              <circle id="circle" class="piece" tabindex="0" cx="55" cy="205" r="25" fill="#0b73e0" aria-label="圆点"/>
              <path id="triangle" class="piece" tabindex="0" d="M0 -30 L38 20 L-38 20 Z" transform="translate(70 58) rotate(180)" fill="#f29b38" stroke="#a45c00" stroke-width="5" aria-label="三角形"/>
              <g id="targetOverlay" class="overlay-target hidden"><circle cx="180" cy="167" r="25" fill="none" stroke="#207a5a" stroke-width="5"/><path d="M180 28 L218 78 L142 78 Z" fill="none" stroke="#207a5a" stroke-width="5"/></g>
            </svg>
          </div>
          <div class="actionrow"><span class="receiver-help">拖动部件；聚焦后可用方向键，R 旋转</span><button id="submit" type="button" data-primary disabled>提交重建</button><button id="reset" type="button" class="hidden">换一个情景</button></div>
        </section>
      </div>
      <div id="feedback" class="feedback" aria-live="polite"><strong>离场信息</strong><span>语言能把不在眼前的对象和操作步骤传给他人。</span></div>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:20,kicker:'ABSENT OBJECTS',title:'不在眼前，也能传过去',take:'语言能把不在眼前的对象和步骤传给他人'});
    Deck.init({index:20,total:48});
    const state={phase:'send',chosen:[],circle:{x:55,y:205},tri:{x:70,y:58,r:180},attempt:0};
    const steps=[...document.querySelectorAll('.k-process>section')], chips=[...document.querySelectorAll('.chips button[data-msg]')];
    const transmit=document.querySelector('#transmit'), submit=document.querySelector('#submit'), reset=document.querySelector('#reset'), cover=document.querySelector('#cover'), caption=document.querySelector('#caption'), wave=document.querySelector('#wave'), feedback=document.querySelector('#feedback'), circle=document.querySelector('#circle'), triangle=document.querySelector('#triangle'), link=document.querySelector('#link'), overlay=document.querySelector('#targetOverlay'), work=document.querySelector('#work');
    function setStep(n){steps.forEach((s,i)=>s.dataset.state=i<n?'done':i===n?'current':'');}
    chips.forEach((b,i)=>b.addEventListener('click',()=>{if(state.phase!=='send'||state.chosen.includes(i))return;state.chosen.push(i);b.setAttribute('aria-pressed','true');setStep(Math.min(2,state.chosen.length));transmit.disabled=state.chosen.length<3;}));
    transmit.addEventListener('click',()=>{state.phase='transmit';cover.classList.remove('hidden');document.querySelector('#sendControls').classList.add('hidden');setStep(3);wave.classList.add('live');let i=0;const ordered=state.chosen.map(n=>chips[n].dataset.msg);function next(){if(i<ordered.length){caption.textContent=ordered[i++];setTimeout(next,1100)}else{caption.textContent='声音消退了。请按记忆重建。';wave.classList.remove('live');state.phase='build';submit.disabled=false;setStep(4)}}next();});
    function render(){circle.setAttribute('cx',state.circle.x);circle.setAttribute('cy',state.circle.y);triangle.setAttribute('transform',`translate(${state.tri.x} ${state.tri.y}) rotate(${state.tri.r})`);link.setAttribute('x1',state.tri.x);link.setAttribute('x2',state.tri.x);link.setAttribute('y1',105);link.setAttribute('y2',Math.min(98,state.tri.y+20));}
    function move(kind,x,y){if(state.phase!=='build')return;const p=state[kind];p.x=Deck.clamp(x,35,325);p.y=Deck.clamp(y,35,235);render();}
    function drag(el,kind){el.addEventListener('pointerdown',e=>{if(state.phase!=='build')return;el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!el.hasPointerCapture(e.pointerId))return;const p=Deck.pt(work,e);move(kind,p.x,p.y)});el.addEventListener('keydown',e=>{if(state.phase!=='build')return;let d=e.shiftKey?12:5;if(e.key==='ArrowLeft')move(kind,state[kind].x-d,state[kind].y);else if(e.key==='ArrowRight')move(kind,state[kind].x+d,state[kind].y);else if(e.key==='ArrowUp')move(kind,state[kind].x,state[kind].y-d);else if(e.key==='ArrowDown')move(kind,state[kind].x,state[kind].y+d);else if(kind==='tri'&&e.key.toLowerCase()==='r'){state.tri.r=(state.tri.r+90)%360;render()}else return;e.preventDefault()})}
    drag(circle,'circle');drag(triangle,'tri');triangle.addEventListener('dblclick',()=>{if(state.phase==='build'){state.tri.r=(state.tri.r+90)%360;render()}});
    submit.addEventListener('click',()=>{state.attempt++;setStep(5);overlay.classList.remove('hidden');const contained=state.circle.x>117&&state.circle.x<243&&state.circle.y>130&&state.circle.y<204;const above=Math.abs(state.tri.x-180)<32&&state.tri.y<82;const upright=state.tri.r%360===0;const ok=contained&&above&&upright;if(ok){finish(true,'吻合：部件、包含、位置、朝向和连接都一致。')}else if(state.attempt===1){feedback.dataset.tone='warning';feedback.innerHTML='<strong>关系需要澄清</strong><span>三角形在方框正上方，尖端朝上；圆点在框内中央。请修改后再次提交。</span>';caption.textContent='补充一次：三角形正上方、尖端朝上；圆点在框内中央。';submit.textContent='再次提交';overlay.classList.add('hidden')}else finish(false,'仍有关系冲突：表达顺序和共同参照会改变重建结果。')});
    function finish(ok,text){state.phase='done';submit.classList.add('hidden');reset.classList.remove('hidden');feedback.dataset.tone=ok?'success':'warning';feedback.innerHTML=`<strong>${ok?'传递成功':'本轮结束'}</strong><span>${text}</span>`;caption.textContent='对照结束。语言传递可以通过澄清和修正提高准确性。'}
    reset.addEventListener('click',()=>location.reload());
    render();
  </script>
</body>
</html>
