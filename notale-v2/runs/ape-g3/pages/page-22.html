<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>把记忆放到脑外，才能交给未曾谋面的人</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    html.lec-root{position:static;display:block;overflow:visible}
    .lec-header__inner{width:100%;height:96px;display:flex;align-items:center;gap:24px;min-width:0}
    .lec-header__identity,.lec-header__kicker,.lec-header__page{flex:0 0 auto;white-space:nowrap}
    .lec-header__title{flex:1 1 auto;min-width:0;white-space:nowrap}
    .memory-page{height:620px;display:grid;grid-template-rows:430px 174px;gap:16px;min-width:0;min-height:0}
    .flow-wrap{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:var(--radius-lg);background:rgb(255 255 255 / 82%);overflow:hidden;box-shadow:var(--shadow-panel)}
    .generation-label{position:absolute;z-index:4;top:14px;color:var(--muted);font-size:var(--fs-label);font-weight:700;line-height:var(--lh-label);letter-spacing:.05em}
    .generation-label.before{left:24px}.generation-label.after{right:24px}
    .fault{position:absolute;z-index:1;top:0;bottom:0;left:62.5%;width:2px;background:repeating-linear-gradient(to bottom,var(--warning) 0 8px,transparent 8px 16px)}
    .fault span{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:112px;padding:4px 8px;background:var(--warning-soft);color:var(--warning);font-size:var(--fs-label);font-weight:750;line-height:var(--lh-label);text-align:center}
    .k-process.memory-process{position:absolute;z-index:2;inset:52px 18px 18px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:28px;counter-reset:none}
    .k-process.memory-process>section{padding:18px 14px 14px;display:flex;flex-direction:column;justify-content:flex-start;border-radius:var(--radius-md)}
    .k-process.memory-process>section::before,.k-process.memory-process>section::after{display:none}
    .step-name{font-size:var(--fs-sec);line-height:var(--lh-sec);font-weight:780;color:var(--text);text-align:center;min-height:48px;display:flex;align-items:center;justify-content:center}
    .step-note{margin:8px 0 0;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec);text-align:center}
    .step-icon{height:72px;display:grid;place-items:center;color:var(--accent);font-size:36px;font-weight:800}
    .step-icon svg{width:66px;height:58px;overflow:visible}
    #links{position:absolute;z-index:3;inset:0;width:100%;height:100%;pointer-events:none}
    .encode{border-color:var(--warning)!important;background:var(--warning-soft)!important}
    .result{border-width:2px!important}.result[data-state="ready"]{border-color:var(--success);background:var(--success-soft)}
    .result[data-state="guess"]{border-color:var(--warning);background:var(--warning-soft)}
    .lower{display:grid;grid-template-columns:840px minmax(0,1fr);gap:16px;min-width:0;min-height:0}
    .tray,.feedback{min-width:0;min-height:0;box-sizing:border-box;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);padding:14px 16px}
    .tray-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .tray-head strong,.feedback strong{font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .record-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .record{height:92px;padding:8px 12px;display:grid;grid-template-columns:54px 1fr;align-items:center;text-align:left;background:var(--surface-soft)}
    .record[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
    .record b{display:block;font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .record small{display:block;color:var(--muted);font-size:var(--fs-label);line-height:var(--lh-label);font-weight:550}
    .record-mark{width:42px;height:42px;box-sizing:border-box;border:2px solid currentColor;color:var(--accent);display:grid;place-items:center;font-size:var(--fs-label);font-weight:800}
    .record[data-kind="image"] .record-mark{border-radius:4px}.record[data-kind="text"] .record-mark{border-radius:2px;background:repeating-linear-gradient(to bottom,transparent 0 7px,currentColor 7px 8px)}
    .record[data-kind="number"] .record-mark{background:linear-gradient(90deg,transparent 48%,currentColor 49% 51%,transparent 52%),linear-gradient(transparent 48%,currentColor 49% 51%,transparent 52%)}
    .feedback{display:grid;grid-template-rows:auto 1fr auto;gap:6px}
    #status{margin:0;font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--text)}
    #reset{justify-self:end;min-height:38px}
    body.dragging .encode{box-shadow:0 0 0 4px var(--warning-soft)}
  </style>
</head>
<body data-page="22" data-total="48">
  <div id="stage">
    <div class="lec-root"><div class="lec-page">
    <main class="memory-page">
      <section class="flow-wrap no-pan" aria-label="跨代外部记忆流程">
        <span class="generation-label before">记录者在场</span><span class="generation-label after">后来者读取</span>
        <div class="fault"><span>原作者不在场</span></div>
        <svg id="links" aria-hidden="true"></svg>
        <div class="k-process memory-process">
          <section data-id="event"><div class="step-icon">◉</div><div class="step-name">亲历事件</div><p class="step-note">水源、容器与可用水量只在亲历者记忆中。</p></section>
          <section data-id="select"><div class="step-icon">⌁</div><div class="step-name">选择信息</div><p class="step-note">留下地点外观、操作顺序与可比较的量。</p></section>
          <section class="encode" data-id="encode"><div class="step-icon">＋</div><div class="step-name">编码成记录</div><p class="step-note" id="encoded">三处信息缺口等待修补。</p></section>
          <section data-id="carry"><div class="step-icon">⇥</div><div class="step-name">记录跨越世代</div><p class="step-note">载体可保存、复制，也可能损坏或遗漏。</p></section>
          <section data-id="read"><div class="step-icon">?</div><div class="step-name">后人解读</div><p class="step-note">后来者必须把留下的线索重新组合。</p></section>
          <section class="result" data-id="revise" data-state="guess"><div class="step-icon" id="resultIcon">≈</div><div class="step-name" id="resultName">含混的猜测</div><p class="step-note">记录不足，任务无法核对。</p></section>
        </div>
      </section>
      <section class="lower">
        <div class="tray">
          <div class="tray-head"><strong>把记录拖入“编码成记录”；点击或按 Enter 也可放入、取回</strong></div>
          <div class="record-row">
            <button class="record" data-kind="image" aria-pressed="false"><span class="record-mark">▣</span><span><b>图像记录</b><small>形状、位置与可见特征</small></span></button>
            <button class="record" data-kind="text" aria-pressed="false"><span class="record-mark">≡</span><span><b>文字记录</b><small>名称、顺序、条件与警告</small></span></button>
            <button class="record" data-kind="number" aria-pressed="false"><span class="record-mark">表</span><span><b>数字记录</b><small>测量值＋单位＋对象</small></span></button>
          </div>
        </div>
        <aside class="feedback" aria-live="polite"><strong>重建状态</strong><p id="status">三类线索都缺失：后来者只能猜测对象、步骤和可比较的量。</p><button id="reset">重置流程</button></aside>
      </section>
    </main>
    </div></div>
  </div>
  <script src="assets/lib/d3.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:22,kicker:'EXTERNAL MEMORY',title:'把记忆放到脑外，才能交给未曾谋面的人',take:'图像、文字和数字让知识不再依赖单个人脑'});
    Deck.init({index:22,total:48});

    const state={image:false,text:false,number:false};
    const cards=[...document.querySelectorAll('.record')];
    const encode=document.querySelector('.encode');
    const status=document.querySelector('#status');
    const result=document.querySelector('.result');
    function summary(){
      const on=Object.keys(state).filter(k=>state[k]);
      if(on.length===0)return '三类线索都缺失：后来者只能猜测对象、步骤和可比较的量。';
      if(on.length===3)return '三类记录互相对应：后来者可重建任务、核对缺口，并继续修订。';
      const parts=[];
      if(state.image)parts.push('外观与空间关系已恢复'); else parts.push('对象外观仍含混');
      if(state.text)parts.push('步骤与条件已恢复'); else parts.push('步骤与条件仍缺失');
      if(state.number)parts.push((state.image||state.text)?'比较依据已恢复':'数值缺少对象或条件，仍无法解释'); else parts.push('可比较的量仍缺失');
      return parts.join('；')+'。';
    }
    function render(){
      const count=Object.values(state).filter(Boolean).length;
      cards.forEach(b=>b.setAttribute('aria-pressed',String(state[b.dataset.kind])));
      document.querySelector('#encoded').textContent=count?`已补入${['', '一种', '两种', '三种'][count]}记录。`:'三处信息缺口等待修补。';
      status.textContent=summary();
      const complete=count===3;
      result.dataset.state=complete?'ready':'guess';
      document.querySelector('#resultName').textContent=complete?'可检验的重建':'含混的猜测';
      document.querySelector('#resultIcon').textContent=complete?'✓':'≈';
      drawLinks();
    }
    function toggle(kind,value=!state[kind]){state[kind]=value;render()}
    cards.forEach(card=>{
      card.addEventListener('click',()=>toggle(card.dataset.kind));
      d3.select(card).call(d3.drag().on('start',()=>document.body.classList.add('dragging')).on('end',(event)=>{
        document.body.classList.remove('dragging');
        const p=Deck.pt(encode,event.sourceEvent);
        if(p.x>=0&&p.y>=0&&p.x<=encode.offsetWidth&&p.y<=encode.offsetHeight)toggle(card.dataset.kind,true);
      }));
    });
    document.querySelector('#reset').addEventListener('click',()=>{Object.keys(state).forEach(k=>state[k]=false);render()});
    function drawLinks(){
      const wrap=document.querySelector('.flow-wrap');
      const wr=wrap.getBoundingClientRect();
      const nodes=[...document.querySelectorAll('.memory-process>section')];
      const svg=d3.select('#links').attr('viewBox',`0 0 ${wrap.clientWidth} ${wrap.clientHeight}`);
      svg.selectAll('*').remove();
      const defs=svg.append('defs');
      defs.append('marker').attr('id','arrow22').attr('viewBox','0 -5 10 10').attr('refX',9).attr('refY',0).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto').append('path').attr('d','M0,-5L10,0L0,5').attr('fill','var(--accent)');
      const points=nodes.map(n=>{const r=n.getBoundingClientRect();return{x1:(r.left-wr.left)/Deck.s,y:(r.top-wr.top+r.height/2)/Deck.s,x2:(r.right-wr.left)/Deck.s}});
      const count=Object.values(state).filter(Boolean).length;
      const links=d3.range(5).map(i=>({i,a:points[i],b:points[i+1],active:i<2||count>0,complete:count===3}));
      svg.append('g').selectAll('path').data(links).join('path').attr('d',d=>`M${d.a.x2+4},${d.a.y} C${d.a.x2+15},${d.a.y} ${d.b.x1-15},${d.b.y} ${d.b.x1-4},${d.b.y}`).attr('fill','none').attr('stroke',d=>(d.i>=2&&!d.complete)?'var(--warning)':'var(--accent)').attr('stroke-width',3).attr('stroke-dasharray',d=>(d.i>=2&&!d.complete)?'7 7':null).attr('marker-end','url(#arrow22)');
    }
    window.addEventListener('resize',drawLinks);render();
  </script>
</body>
</html>
