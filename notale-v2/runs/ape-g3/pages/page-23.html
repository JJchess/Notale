<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>一项航天结论，需要哪些人共同托住？</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-header__inner{width:100%;display:grid;grid-template-columns:190px 190px minmax(0,1fr) 72px;align-items:center;gap:16px}
    .lec-header__identity,.lec-header__kicker,.lec-header__title,.lec-header__page{margin:0;min-width:0}
    .lec-header__identity,.lec-header__kicker,.lec-header__page{font-size:var(--fs-label);line-height:var(--lh-label)}
    .lec-header__kicker{color:var(--accent-strong);font-weight:800}.lec-header__page{text-align:right}
    .lec-header__title{font-size:var(--fs-h1);line-height:var(--lh-h1);white-space:nowrap}
    .lec-footer__inner{width:100%;display:flex;align-items:center;gap:16px}.lec-footer__take-label{font-weight:800}.lec-footer__take-text{margin:0}
    .community{height:100%;display:grid;grid-template-rows:64px 452px 80px;gap:12px}
    .claim{display:flex;align-items:center;gap:16px;padding:10px 18px;border:1px solid var(--line-strong);border-left:7px solid var(--warning);border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow-panel)}
    .claim[data-complete="true"]{border-left-color:var(--success);background:var(--success-soft)}
    .state{flex:0 0 auto;padding:5px 10px;border-radius:999px;background:var(--warning-soft);color:var(--warning);font-size:var(--fs-label);font-weight:800;line-height:var(--lh-label)}
    .claim[data-complete="true"] .state{background:var(--success);color:#fff}
    .workspace{display:grid;grid-template-columns:minmax(0,1fr) 274px;gap:16px;min-height:0}
    .ledger{display:grid;grid-template-rows:34px minmax(0,1fr);min-height:0}
    .ledger-head{display:grid;grid-template-columns:112px 190px 1.1fr 1fr;align-items:center;padding:0 14px;background:var(--surface-muted);border:1px solid var(--line);border-radius:var(--radius-sm) var(--radius-sm) 0 0;color:var(--muted);font-size:var(--fs-label);font-weight:750}
    .rows.k-enumeration{--enumeration-cols:1;gap:6px}
    .rows.k-enumeration>button{display:grid;grid-template-columns:98px 190px 1.1fr 1fr;align-items:center;width:100%;padding:8px 14px;text-align:left;border-top:1px solid var(--line);border-left:5px solid var(--warning);border-radius:var(--radius-sm);box-shadow:none;background:var(--surface);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .rows.k-enumeration>button:hover,.rows.k-enumeration>button:focus-visible{background:var(--accent-soft);border-color:var(--accent)}
    .rows.k-enumeration>button.filled{border-left-color:var(--accent);background:linear-gradient(90deg,var(--accent-soft),var(--surface) 32%)}
    .work{font-size:var(--fs-h2);font-weight:780;color:var(--text)}
    .slot{color:var(--warning);font-weight:700}.filled .slot{color:var(--accent-strong)}
    .evidence{color:var(--muted)}.filled .evidence{color:var(--text)}
    .absence{color:var(--muted)}
    .pool{padding:14px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow-panel);min-height:0}
    .pool h2{font-size:var(--fs-h2);margin-bottom:4px}.pool .hint{display:block;margin-bottom:10px}
    .roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .role{min-height:52px;padding:6px 8px;background:var(--surface-soft);font-size:var(--fs-label);line-height:var(--lh-label);cursor:grab}
    .role[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
    .role.assigned{background:var(--success-soft);border-color:var(--success);color:var(--success)}
    .feedback{margin-top:10px;min-height:48px;padding:9px 10px;border-left:4px solid var(--line-strong);background:var(--surface-soft);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .conclusion{display:grid;grid-template-columns:170px 1fr auto;align-items:center;gap:18px;padding:10px 18px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
    .progress{font-size:var(--fs-h2);font-weight:800;color:var(--accent-strong)}
    .conclusion-text{font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .reset{font-size:var(--fs-label)}
  </style>
</head>
<body data-page="23" data-total="48">
  <div id="stage">
    <main class="community" aria-label="科研共同体角色分配台账">
      <section class="claim" id="claim" data-complete="false">
        <span class="state" id="claimState">待检验主张</span>
        <strong class="fs-lead">这组观测支持目标区域存在水冰。</strong>
      </section>

      <div class="workspace">
        <section class="ledger min0" aria-label="四项并列工作">
          <div class="ledger-head"><span>工作项</span><span>负责角色</span><span>留下的证据</span><span>缺席后果</span></div>
          <div class="rows k-enumeration" id="rows">
            <button type="button" class="ledger-row" data-function="measure"><span class="work">测量</span><span class="slot">待分配</span><span class="evidence">原始读数、校准记录、异常标记</span><span class="absence">无法区分目标、环境与仪器信号</span></button>
            <button type="button" class="ledger-row" data-function="question"><span class="work">质疑</span><span class="slot">待分配</span><span class="evidence">替代解释、误差检查、模型假设</span><span class="absence">符合预期的信号可能过早成为事实</span></button>
            <button type="button" class="ledger-row" data-function="replicate"><span class="work">复现</span><span class="slot">待分配</span><span class="evidence">重复观测、独立分析、复现条件</span><span class="absence">偶然误差或特定处理可能被放大</span></button>
            <button type="button" class="ledger-row" data-function="coordinate"><span class="work">分工</span><span class="slot">待分配</span><span class="evidence">责任边界、接口约定、版本记录</span><span class="absence">单位、版本或接口不一致，结果难合并</span></button>
          </div>
        </section>

        <aside class="pool min0" aria-label="可分配角色">
          <h2>角色卡池</h2>
          <span class="hint">拖入台账，或先选角色再选一行</span>
          <div class="roles" id="roles">
            <button class="role" type="button" draggable="true" data-role="仪器工程师" data-fit="measure">⌁ 仪器工程师</button>
            <button class="role" type="button" draggable="true" data-role="观测操作员" data-fit="measure">◎ 观测操作员</button>
            <button class="role" type="button" draggable="true" data-role="数据分析员" data-fit="question">≋ 数据分析员</button>
            <button class="role" type="button" draggable="true" data-role="反方审查员" data-fit="question">◇ 反方审查员</button>
            <button class="role" type="button" draggable="true" data-role="独立任务团队" data-fit="replicate">↻ 独立任务团队</button>
            <button class="role" type="button" draggable="true" data-role="复核分析员" data-fit="replicate">✓ 复核分析员</button>
            <button class="role" type="button" draggable="true" data-role="系统工程师" data-fit="coordinate">⌘ 系统工程师</button>
            <button class="role" type="button" draggable="true" data-role="科研协调员" data-fit="coordinate">⇄ 科研协调员</button>
          </div>
          <div class="feedback" id="feedback" role="status" aria-live="polite">选择一个角色，补上它能承担的责任。</div>
        </aside>
      </div>

      <section class="conclusion" aria-label="共同体结论">
        <div class="progress" id="progress">已补齐 0 / 4 项</div>
        <div class="conclusion-text" id="conclusion">可靠不等于某位专家说了算，而是证据、推理和交接过程能被检查并继续使用。</div>
        <button type="button" class="reset" id="reset">重置台账</button>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 23,
      kicker: 'COLLECTIVE KNOWLEDGE',
      title: '一项航天结论，需要哪些人共同托住？',
      take: '现代航天知识由测量、质疑、复现和分工共同生产'
    });
    const stage = document.getElementById('stage');
    const community = stage.querySelector('.community');
    const header = document.querySelector('.lec-header');
    const footer = document.querySelector('.lec-footer');
    document.documentElement.classList.remove('lec-root');
    document.body.classList.remove('lec-page');
    const root = document.createElement('div');
    root.className = 'lec-root';
    const page = document.createElement('div');
    page.className = 'lec-page';
    page.appendChild(community);
    root.appendChild(page);
    stage.append(header, root, footer);
    Deck.init({ index: 23, total: 48 });

    const communityFunctions = ['measure','question','replicate','coordinate'];
    const feedbackByFunction = {
      measure:'先留下别人能够检查的记录。',
      question:'质疑针对证据和推理，不针对个人。',
      replicate:'复现要重新取得并检查证据，不是照抄结论。',
      coordinate:'分工放大能力，也要求清楚记录交接关系。'
    };
    const misplaced = {
      measure:'这个职责不能替代仪器记录与校准。',
      question:'这个职责不能替代对解释和假设的挑战。',
      replicate:'任务协调可以组织复核，但不能替代独立取得证据。',
      coordinate:'局部证据不能替代跨团队的接口与版本交接。'
    };
    const assigned = new Map();
    let selected = null;
    let dragged = null;
    const roleButtons = [...document.querySelectorAll('.role')];
    const rows = [...document.querySelectorAll('.ledger-row')];
    const feedback = document.getElementById('feedback');

    function selectRole(btn){
      selected = btn;
      roleButtons.forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      feedback.textContent = '已选择“' + btn.dataset.role + '”。现在选择它承担的工作项。';
    }
    function update(){
      rows.forEach(row => {
        const role = assigned.get(row.dataset.function);
        row.classList.toggle('filled', Boolean(role));
        row.querySelector('.slot').textContent = role || '待分配';
      });
      roleButtons.forEach(btn => btn.classList.toggle('assigned', [...assigned.values()].includes(btn.dataset.role)));
      const count = assigned.size;
      document.getElementById('progress').textContent = '已补齐 ' + count + ' / ' + communityFunctions.length + ' 项';
      const complete = count === communityFunctions.length;
      document.getElementById('claim').dataset.complete = String(complete);
      document.getElementById('claimState').textContent = complete ? '获得共同体支持' : '待检验主张';
      document.getElementById('conclusion').textContent = complete
        ? '生产机制已补齐：有来源、有检查、有独立支持，也能被团队接续；这不代表主张绝对正确。'
        : '可靠不等于某位专家说了算，而是证据、推理和交接过程能被检查并继续使用。';
    }
    function place(btn,row){
      if(!btn) { feedback.textContent='先从右侧选择一个角色。'; return; }
      const fn = row.dataset.function;
      if(btn.dataset.fit !== fn){
        feedback.textContent = misplaced[fn];
        return;
      }
      for(const [key,value] of assigned){ if(value === btn.dataset.role) assigned.delete(key); }
      assigned.set(fn, btn.dataset.role);
      feedback.textContent = feedbackByFunction[fn];
      selected = null;
      roleButtons.forEach(b => b.setAttribute('aria-pressed','false'));
      update();
    }
    roleButtons.forEach(btn => {
      btn.setAttribute('aria-pressed','false');
      btn.addEventListener('click',()=>selectRole(btn));
      btn.addEventListener('dragstart',e=>{ dragged=btn; e.dataTransfer.setData('text/plain',btn.dataset.role); });
      btn.addEventListener('dragend',()=>{dragged=null;});
    });
    rows.forEach(row => {
      row.addEventListener('click',()=>place(selected,row));
      row.addEventListener('dragover',e=>e.preventDefault());
      row.addEventListener('drop',e=>{e.preventDefault();place(dragged,row);dragged=null;});
    });
    document.getElementById('reset').addEventListener('click',()=>{
      assigned.clear(); selected=null; roleButtons.forEach(b=>b.setAttribute('aria-pressed','false'));
      feedback.textContent='选择一个角色，补上它能承担的责任。'; update();
    });
    update();
  </script>
</body>
</html>
