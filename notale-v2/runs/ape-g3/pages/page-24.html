<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>最强的适应，是让能力继续累积</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    html.lec-root { top:4px; bottom:auto; height:896px; }
    #stage { position:relative; inset:auto; width:100%; height:100%; transform:none; }
    .p24 { height:100%; display:flex; flex-direction:column; gap:16px; }
    .p24-intro { text-align:center; color:var(--muted); margin:0; }
    .p24-map { flex:1; gap:32px; grid-template-columns:minmax(0,1fr) 520px minmax(0,1fr); }
    .p24-map::before,.p24-map::after { width:calc(50% - 260px); border-color:var(--accent); }
    .p24-map > [data-branch] { gap:18px; }
    .support { padding:16px 18px !important; border-left:5px solid var(--accent) !important; transition:border-color 220ms ease,background 220ms ease,opacity 220ms ease; }
    .support.low { border-left-color:var(--danger) !important; background:var(--danger-soft) !important; }
    .support.high { border-left-color:var(--success) !important; background:var(--success-soft) !important; }
    .support-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:8px; }
    .support h2 { font-size:20px; }
    .state { color:var(--accent-strong); font-weight:750; white-space:nowrap; }
    .support.low .state { color:var(--danger); }
    .support.high .state { color:var(--success); }
    .ctl { min-height:40px; }
    .ctl input[type="range"] { min-width:0; width:100%; }
    .scale { display:flex; justify-content:space-between; color:var(--muted); }
    .amplifier { position:relative; padding:22px !important; border-color:var(--line-strong) !important; background:linear-gradient(180deg,#fff,var(--surface-soft) 58%,var(--surface-muted)) !important; box-shadow:0 16px 28px rgb(36 56 82 / 18%),inset 0 1px 0 #fff,inset 0 -2px 0 rgb(88 105 125 / 22%) !important; }
    .amp-title { margin-bottom:12px; font-size:22px; font-weight:800; }
    .trunk { display:grid; grid-template-columns:92px 1fr 104px; align-items:center; gap:10px; }
    .terminal { padding:12px 8px; border:1px solid var(--line-strong); border-radius:12px; background:var(--surface); font-weight:750; line-height:1.35; }
    .terminal.out { color:var(--accent-strong); }
    .channel { display:flex; align-items:center; gap:5px; min-width:0; }
    .pulse { flex:1; height:12px; border-radius:8px; background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); transform-origin:left; transition:transform 240ms ease,background 240ms ease,opacity 240ms ease; }
    .arrow { color:var(--accent-strong); font-size:25px; font-weight:900; }
    .layers { margin-top:18px; display:grid; gap:8px; text-align:left; }
    .layer { display:grid; grid-template-columns:62px 1fr; align-items:center; gap:10px; font-size:15px; font-weight:700; }
    .rail { height:10px; overflow:hidden; border-radius:8px; background:var(--line); box-shadow:inset 0 2px 4px rgb(23 32 51 / 20%); }
    .fill { height:100%; width:66%; border-radius:inherit; background:linear-gradient(90deg,var(--accent-strong),var(--accent)); transition:width 240ms ease,background 240ms ease; }
    .result { margin-top:18px; padding:12px 14px; border-radius:12px; background:var(--accent-soft); }
    .result strong { display:block; color:var(--accent-strong); font-size:22px; }
    .feedback { margin:0; color:var(--text); min-height:48px; }
    .closing { margin:0; text-align:center; color:var(--success); font-weight:750; min-height:27px; }
    @media (prefers-reduced-motion:reduce){ .support,.pulse,.fill{transition:none} }
  </style>
</head>
<body data-page="24" data-total="48">
  <div id="stage">
    <main class="p24">
      <p class="p24-intro fs-lead">一个人的有限经验，怎样变成后来者可以继续改进的共同起点？</p>
      <section class="k-generalization p24-map" aria-label="集体能力累积的四项支撑">
        <div data-branch="left">
          <section class="support" data-key="retain">
            <div class="support-head"><h2>保留</h2><span class="state fs-label"></span></div>
            <div class="ctl"><input aria-label="调节保留程度" id="retain" type="range" min="0" max="2" step="1" value="1"></div>
            <div class="scale fs-label"><span>易消失</span><span>结果与步骤</span></div>
          </section>
          <section class="support" data-key="correct">
            <div class="support-head"><h2>纠错</h2><span class="state fs-label"></span></div>
            <div class="ctl"><input aria-label="调节纠错程度" id="correct" type="range" min="0" max="2" step="1" value="1"></div>
            <div class="scale fs-label"><span>照样复制</span><span>复查修正</span></div>
          </section>
        </div>
        <div data-claim class="amplifier">
          <div class="amp-title">集体放大器</div>
          <div class="trunk">
            <div class="terminal fs-sec">个人的<br>有限经验</div>
            <div class="channel" aria-hidden="true"><span class="pulse"></span><span class="arrow">→</span></div>
            <div class="terminal out fs-sec">共同起点</div>
          </div>
          <div class="layers" aria-hidden="true">
            <div class="layer"><span>保留</span><div class="rail"><div class="fill" data-fill="retain"></div></div></div>
            <div class="layer"><span>传递</span><div class="rail"><div class="fill" data-fill="transfer"></div></div></div>
            <div class="layer"><span>纠错</span><div class="rail"><div class="fill" data-fill="correct"></div></div></div>
            <div class="layer"><span>协作</span><div class="rail"><div class="fill" data-fill="collab"></div></div></div>
          </div>
          <div class="result"><span class="fs-label">累积状态</span><strong id="result">能够延续</strong></div>
        </div>
        <div data-branch="right">
          <section class="support" data-key="transfer">
            <div class="support-head"><h2>传递</h2><span class="state fs-label"></span></div>
            <div class="ctl"><input aria-label="调节传递程度" id="transfer" type="range" min="0" max="2" step="1" value="1"></div>
            <div class="scale fs-label"><span>只看结果</span><span>解释条件</span></div>
          </section>
          <section class="support" data-key="collab">
            <div class="support-head"><h2>协作</h2><span class="state fs-label"></span></div>
            <div class="ctl"><input aria-label="调节协作程度" id="collab" type="range" min="0" max="2" step="1" value="1"></div>
            <div class="scale fs-label"><span>各自为战</span><span>分工接力</span></div>
          </section>
        </div>
      </section>
      <p id="feedback" class="feedback fs-body text-center" aria-live="polite"></p>
      <p id="closing" class="closing fs-body"></p>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({ index:24, kicker:'COLLECTIVE AMPLIFIER', title:'最强的适应，是让能力继续累积', take:'人类最强的适应不是某件器官，而是让群体能力持续累积。' });
    Deck.init({ index:24, total:48 });
    const keys=['retain','transfer','correct','collab'];
    const labels={retain:['成果易消失','留下结果','留下结果与步骤'],transfer:['只能看结果','能传步骤','能解释条件'],correct:['错误照样复制','能发现偏差','能复查并修正'],collab:['各自为战','交换成果','分工并接力']};
    const weak={retain:'经验没有留下，后来者接近从头开始。',transfer:'成果留下了，但关键步骤没有传到下一位学习者。',correct:'经验能够传递，但失败方案也会照样延续。',collab:'每个人都有局部成果，却没有汇入共同主干。'};
    function update(){
      const vals=keys.map(k=>+document.getElementById(k).value), min=Math.min(...vals), sum=vals.reduce((a,b)=>a+b,0);
      keys.forEach((k,i)=>{ const box=document.querySelector('[data-key="'+k+'"]'); box.querySelector('.state').textContent=labels[k][vals[i]]; box.classList.toggle('low',vals[i]===0); box.classList.toggle('high',vals[i]===2); const fill=document.querySelector('[data-fill="'+k+'"]'); fill.style.width=[18,62,100][vals[i]]+'%'; fill.style.background=vals[i]===0?'var(--danger)':vals[i]===2?'var(--success)':'var(--accent)'; });
      const result=min===0?'难以累积':(sum===8?'持续改进':'能够延续');
      document.getElementById('result').textContent=result;
      const weakest=keys[vals.indexOf(min)];
      document.getElementById('feedback').textContent=min<2?weak[weakest]:'结果、步骤与纠错依据进入共同起点，由不同的人继续接力。';
      document.getElementById('closing').textContent=sum===8?'后来者不必每次从头开始。':'';
      const pulse=document.querySelector('.pulse'); pulse.style.transform='scaleX('+(.22+.78*(min/2))+')'; pulse.style.background=min===0?'var(--danger)':sum===8?'var(--success)':'var(--accent)';
    }
    keys.forEach(k=>document.getElementById(k).addEventListener('input',update)); update();
  </script>
</body>
</html>
