<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>从“跳多高”到“横向跑多快”</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    body > header > div{transform:translateY(4px)}
    .p25-focus{
      width:100%; height:100%; box-sizing:border-box;
      display:grid; grid-template-rows:340px 256px; gap:var(--sp-5);
    }
    .p25-visual{
      position:relative; min-width:0; overflow:hidden;
      border:1px solid var(--line); border-radius:var(--radius-lg);
      background:linear-gradient(180deg,var(--surface) 0%,var(--surface-soft) 100%);
      box-shadow:var(--shadow-panel);
    }
    .p25-visual svg{display:block;width:100%;height:100%}
    .p25-earth{fill:none;stroke:var(--line-strong);stroke-width:4}
    .p25-ground{fill:var(--surface-muted)}
    .p25-warm{stroke:var(--warning);fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    .p25-cool{stroke:var(--accent);fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    .p25-body{stroke:var(--text);fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
    .p25-craft{fill:var(--accent);stroke:var(--accent-strong);stroke-width:3}
    .p25-svg-title{font-size:22px;font-weight:760;fill:var(--text)}
    .p25-svg-label{font-size:16px;font-weight:700;fill:var(--muted)}
    .p25-shift{
      position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
      display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) var(--sp-4);
      border:2px solid var(--accent); border-radius:999px; background:var(--surface);
      color:var(--accent-strong); font-size:var(--fs-body); line-height:var(--lh-body);
      font-weight:800; box-shadow:var(--shadow-raised); white-space:nowrap;
    }
    .p25-shift::after{content:"→";font-size:28px;line-height:1}
    .p25-table{--comparison-cols:2;height:256px;box-sizing:border-box;grid-auto-rows:63.5px}
    .p25-table > *{display:flex;align-items:center;font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .p25-table > [data-heading]{font-size:var(--fs-h2)}
    .p25-table > :nth-child(3n){border-right:0}
    .p25-table > :nth-last-child(-n+3){border-bottom:0}
    .p25-axis-head{color:var(--muted)}
  </style>
</head>
<body data-page="25" data-total="48">
  <div id="stage">
    <main class="p25-focus" aria-label="跳跃问题与太空问题的比较">
      <section class="p25-visual" aria-label="同一地表基线上，竖直跳跃与横向飞行的方向对比">
        <svg viewBox="0 0 1408 340" role="img" aria-labelledby="p25-v-title p25-v-desc">
          <title id="p25-v-title">方向从竖直向上转为沿地表横向</title>
          <desc id="p25-v-desc">左侧人物向上跳，橙色箭头竖直向上；右侧飞行器沿弯曲地表运动，蓝色箭头水平向右。</desc>
          <defs>
            <marker id="warmArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--warning)"/></marker>
            <marker id="coolArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--accent)"/></marker>
          </defs>
          <path class="p25-ground" d="M0 286 Q704 240 1408 286 L1408 340 L0 340Z"/>
          <path class="p25-earth" d="M0 286 Q704 240 1408 286"/>

          <text x="250" y="45" text-anchor="middle" class="p25-svg-title">跳跃问题</text>
          <text x="250" y="72" text-anchor="middle" class="p25-svg-label">方向：竖直向上</text>
          <circle cx="250" cy="198" r="15" class="p25-body"/>
          <path d="M250 216 L250 258 M250 230 L220 246 M250 230 L281 242 M250 258 L226 282 M250 258 L278 279" class="p25-body"/>
          <path d="M250 174 L250 91" class="p25-warm" marker-end="url(#warmArrow)"/>

          <text x="1110" y="45" text-anchor="middle" class="p25-svg-title">太空问题</text>
          <text x="1110" y="72" text-anchor="middle" class="p25-svg-label">方向：沿地表切向</text>
          <path d="M982 210 L1057 192 L1115 213 L1057 229 Z" class="p25-craft"/>
          <path d="M1031 199 L1060 169 L1079 198Z" class="p25-craft"/>
          <path d="M1117 212 L1274 212" class="p25-cool" marker-end="url(#coolArrow)"/>
        </svg>
        <div class="p25-shift">问题变了</div>
      </section>

      <section class="k-comparison p25-table" aria-label="三项维度对齐比较">
        <div data-axis class="p25-axis-head">比较维度</div>
        <div data-heading>跳跃问题</div>
        <div data-heading data-diff>太空问题</div>

        <div data-axis>首先关注什么</div>
        <div>离地能有多高</div>
        <div data-diff>横向速度能有多大</div>

        <div data-axis>速度主要指向</div>
        <div>竖直向上</div>
        <div data-diff>沿地表切向</div>

        <div data-axis>接下来要追问</div>
        <div>身体还能把自己抬高多少</div>
        <div data-diff>机器怎样获得并保持所需速度</div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 25,
      kicker: 'MACHINE EXTENDS BODY',
      title: '从“跳多高”到“横向跑多快”',
      take: '从地面到太空，问题从“跳多高”变成“横向跑多快”。'
    });
    const content = document.querySelector('.p25-focus');
    document.documentElement.classList.remove('lec-root');
    document.body.classList.remove('lec-page');
    const root = document.createElement('div');
    const page = document.createElement('div');
    root.className = 'lec-root';
    page.className = 'lec-page';
    page.append(content);
    root.append(page);
    document.querySelector('#stage').append(root);
    Deck.init({ index: 25, total: 48 });
  </script>
</body>
</html>
