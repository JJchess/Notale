<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>跳得更高，为什么仍不等于进入轨道？</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    html.lec-root,body.lec-page{position:relative;inset:auto;width:1600px;height:900px;display:block;overflow:hidden}
    #stage{position:absolute;inset:0;width:1600px;height:900px;transform:none}
    .lec-header__inner{position:relative;top:4px}
    .p27{position:absolute;left:96px;top:96px;width:1408px;height:620px;display:grid;grid-template-rows:168px 348px 80px;gap:12px}
    .motion-pair{display:grid;grid-template-columns:1fr 72px 1fr;gap:18px;min-height:0}
    .scene{position:relative;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
    .scene svg{display:block;width:100%;height:100%}
    .scene-label{position:absolute;left:18px;top:14px;font-size:var(--fs-h2);font-weight:720;line-height:var(--lh-h2)}
    .scene-label small{display:block;margin-top:2px;color:var(--muted);font-size:var(--fs-label);font-weight:650;line-height:var(--lh-label)}
    .warm{border-top:5px solid var(--warning)} .cool{border-top:5px solid var(--accent)}
    .versus{display:grid;place-items:center;color:var(--muted);font-size:var(--fs-label);font-weight:800;letter-spacing:.12em}
    .compare-wrap{position:relative;min-height:0}
    .compare{height:100%;--comparison-cols:2;grid-template-columns:190px repeat(2,minmax(0,1fr));grid-template-rows:52px repeat(4,73.5px)}
    .compare>div{display:flex;align-items:center;font-size:var(--fs-sec);line-height:var(--lh-sec);transition:opacity 180ms ease,background-color 180ms ease}
    .compare [data-heading]{font-size:var(--fs-h2)}
    .compare .warm-head{color:var(--warning)} .compare .cool-head{color:var(--accent-strong)}
    .compare [data-row].dim{opacity:.38}.compare [data-row].active{background:var(--accent-soft);opacity:1}
    .compare [data-axis].active{background:var(--surface-muted);box-shadow:inset 5px 0 0 var(--accent)}
    .ruler{position:absolute;left:155px;top:56px;width:34px;height:290px;z-index:4;display:flex;justify-content:center}
    .ruler input{width:280px;height:34px;margin:0;writing-mode:vertical-lr;direction:rtl;accent-color:var(--accent);cursor:ns-resize}
    .connector{position:absolute;z-index:5;left:10px;width:142px;top:8px;height:36px;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .connector span{color:var(--muted);font-size:var(--fs-label);font-weight:700;line-height:var(--lh-label);text-align:center}
    .bottom{display:grid;grid-template-columns:1fr 1.35fr;gap:18px;align-items:stretch}
    .take{display:flex;align-items:center;padding:12px 18px;border-left:5px solid var(--warning);border-radius:var(--radius-sm);background:var(--warning-soft);font-size:var(--fs-lead);font-weight:750;line-height:var(--lh-lead)}
    .model{display:flex;align-items:center;margin:0;padding:10px 16px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .orbit-readouts{opacity:0;transition:opacity 220ms ease}.orbit-readouts.show{opacity:1}
    .orbit-readouts text{font-size:15px;font-weight:700;fill:var(--accent-strong)}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.compare>div,.orbit-readouts{transition:none}}
  </style>
</head>
<body data-page="27" data-total="48">
  <div id="stage">
    <main class="p27" aria-label="跳跃与入轨的四维度对照">
      <section class="motion-pair" aria-label="运动方向示意">
        <div class="scene warm min0">
          <div class="scene-label">竖直跳跃<small>竖直速度购买离地高度</small></div>
          <svg viewBox="0 0 620 164" role="img" aria-label="人物向上跳起，在最高点竖直速度变为零，随后落回附近地面">
            <path d="M0 137 H620" stroke="#899bb0" stroke-width="3"/>
            <path d="M405 136 Q455 34 505 136" fill="none" stroke="#a45c00" stroke-width="4" stroke-dasharray="8 7"/>
            <path d="M452 119 V53" stroke="#a45c00" stroke-width="6"/><path d="M452 43 l-9 17 h18z" fill="#a45c00"/>
            <g id="jumper" transform="translate(405 112)"><circle cx="0" cy="0" r="10" fill="#172033"/><path d="M0 10v24m0-15l-14 11m14-11l14 11m-14 4l-12 17m12-17l12 17" stroke="#172033" stroke-width="6" stroke-linecap="round"/></g>
            <text x="466" y="49" font-size="15" fill="#58697d">最高点：竖直速度为零</text>
          </svg>
        </div>
        <div class="versus" aria-hidden="true">对 照</div>
        <div class="scene cool min0">
          <div class="scene-label">理想圆轨道<small id="altLabel">默认高度</small></div>
          <svg viewBox="0 0 620 164" role="img" aria-label="航天器沿地球曲面的切线方向运动，同时持续向地球下落并错过地面">
            <circle cx="470" cy="246" r="184" fill="#dcecff" stroke="#0b73e0" stroke-width="3"/>
            <path d="M260 88 A224 224 0 0 1 560 35" fill="none" stroke="#0b73e0" stroke-width="3" stroke-dasharray="7 7"/>
            <path d="M328 64 L420 35" stroke="#0b73e0" stroke-width="6"/><path d="M432 31 l-18-5 7 18z" fill="#0b73e0"/>
            <g id="craft" transform="translate(328 64)"><rect x="-13" y="-7" width="26" height="14" rx="3" fill="#172033"/><path d="M-27 0h14m26 0h14" stroke="#172033" stroke-width="6"/></g>
            <g class="orbit-readouts" id="orbitReadouts"><text id="speedText" x="22" y="105"></text><text id="periodText" x="22" y="128"></text><text id="lapsText" x="22" y="151"></text></g>
          </svg>
        </div>
      </section>

      <section class="compare-wrap" aria-label="四项对齐比较">
        <div class="k-comparison compare">
          <div data-heading data-axis aria-label="比较维度"></div><div data-heading class="warm-head">跳跃</div><div data-heading data-diff class="cool-head">入轨</div>
          <div data-axis data-row="0">初始速度方向</div><div data-row="0">速度主要向上；上升增加离地高度。</div><div data-row="0" data-diff>速度主要沿地表切向；关键预算是横向速度。</div>
          <div data-axis data-row="1">怎样继续下落</div><div data-row="1">竖直速度减到零后，落回附近地面。</div><div data-row="1" data-diff>持续下落，但地球曲面同时向下弯离。</div>
          <div data-axis data-row="2">高度的作用</div><div data-row="2">更大的竖直初速度带来更高的最高点。</div><div data-row="2" data-diff>高度确定轨道半径，却不提供横向速度。</div>
          <div data-axis data-row="3">所缺的预算</div><div data-row="3">仅增加高度，路径仍会与地面相交。</div><div data-row="3" data-diff>保持圆轨道，需要对应的切向速度。</div>
        </div>
        <div class="ruler ctl"><input id="ruler" aria-label="比较标尺" type="range" min="0" max="3" step="1" value="0" aria-describedby="compareSentence"></div>
        <div class="connector"><span id="compareSentence" aria-live="polite">先比较：速度指向哪里</span></div>
      </section>

      <section class="bottom">
        <div class="take">高度与横向速度是两笔不同的预算。</div>
        <p class="model">跳跃模型忽略空气阻力并把近地重力视为恒定；轨道模型采用理想圆轨道，不计大气阻力、地球自转与实际发射过程。</p>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:27,kicker:'TWO BUDGETS',title:'跳得更高，为什么仍不等于进入轨道？',take:'高度与横向速度是不同预算，跳得高不等于能入轨'});
    Deck.init({index:27,total:48});

    const altitudeKm=Lec.P.metresToKilometres(Lec.K.defaultLeoAltitude);
    const altitudeM=Lec.P.kilometresToMetres(altitudeKm);
    const radius=Lec.P.orbitalRadius(Lec.K.earthRadius,altitudeM);
    const speed=Lec.P.circularOrbitVelocity(Lec.K.earthMass,radius);
    const period=Lec.P.orbitalPeriod(Lec.K.earthMass,radius);
    const laps=Lec.P.orbitsPerDay(period);
    document.getElementById('altLabel').textContent='高度 '+Lec.P.formatNumber(altitudeKm,0)+' km';
    document.getElementById('speedText').textContent='切向速度 '+Lec.P.formatNumber(speed/1000,2)+' km/s';
    document.getElementById('periodText').textContent='周期 '+Lec.P.formatDuration(period);
    document.getElementById('lapsText').textContent='每日 '+Lec.P.formatNumber(laps,1)+' 圈';

    const lines=['速度方向不同，购买的能力也不同','都受重力作用，但路径是否碰地不同','高度只是一项条件，不会自动带来横向速度','跳高仍缺横向速度；圆轨道必须有切向速度'];
    const ruler=document.getElementById('ruler'), jumper=document.getElementById('jumper'), craft=document.getElementById('craft');
    function play(el,frames){if(Deck.reduced())return;el.getAnimations().forEach(a=>a.cancel());el.animate(frames,{duration:1100,easing:'ease-in-out'});}
    function update(){const n=Number(ruler.value);document.querySelectorAll('[data-row]').forEach(el=>{const on=Number(el.dataset.row)===n;el.classList.toggle('active',on);el.classList.toggle('dim',!on)});document.getElementById('compareSentence').textContent=lines[n];document.getElementById('orbitReadouts').classList.toggle('show',n===3);play(jumper,[{transform:'translate(405px,112px)'},{transform:'translate(455px,38px)',offset:.5},{transform:'translate(505px,112px)'}]);play(craft,[{transform:'translate(328px,64px) rotate(-18deg)'},{transform:'translate(430px,26px) rotate(-3deg)'}]);}
    ruler.addEventListener('input',update);update();
  </script>
</body>
</html>
