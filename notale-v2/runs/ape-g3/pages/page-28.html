<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>同在地球附近，走的是三类不同路径</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    html.lec-root{top:0;right:auto;bottom:auto;left:0;display:block;width:1600px;height:900px}
    body.lec-page{width:1600px;height:900px;overflow:hidden}
    .lec-header__inner{width:100%;display:grid;grid-template-columns:190px 150px 1fr 80px;align-items:center;gap:18px}.lec-header__inner>*{margin:0}.lec-header__identity,.lec-header__kicker,.lec-header__page{font-size:15px;line-height:1.4}.lec-header__kicker{color:var(--accent);font-weight:750}.lec-header__title{font-size:30px;white-space:nowrap}.lec-header__page{text-align:right;color:var(--muted)}
    .orbit-page{position:absolute;left:96px;top:140px;width:1408px;height:620px;display:grid;grid-template-rows:34px 1fr 116px;gap:10px}
    .intro{display:flex;align-items:center;justify-content:space-between;gap:20px}.intro p{margin:0;font-size:16px;line-height:1.5}.intro .note{white-space:nowrap}
    .families{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:10px;border-width:3px}
    .family{display:grid;grid-template-rows:30px 142px 1fr;gap:6px;padding:10px!important;overflow:hidden;transition:border-color 180ms ease,background 180ms ease}
    .family h2{font-size:20px;display:flex;justify-content:space-between;align-items:center}.badge{font-size:14px;color:var(--muted);font-weight:650}
    .scene{position:relative;overflow:hidden;border-radius:10px;background:#101a2c;cursor:grab}.scene canvas{display:block;width:100%;height:100%}.scene .scale-note{position:absolute;left:8px;bottom:5px;color:#dcecff;font-size:14px;line-height:1.4;pointer-events:none}
    .facts{display:grid;grid-template-columns:54px 1fr;align-content:start;font-size:14px;line-height:1.4}.facts>*{padding:3px 6px;border-bottom:1px solid var(--line)}.facts dt{margin:0;color:var(--muted);font-weight:700}.facts dd{margin:0;min-width:0}.facts .locked{color:var(--muted)}
    .pool{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;align-content:start}.pool-head{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;height:24px}.pool-head p{margin:0;font-size:15px;line-height:1.4;color:var(--muted)}
    .chip{min-height:35px;padding:5px 9px;font-size:14px;line-height:1.35;background:var(--surface);cursor:grab}.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}.chip.done{visibility:hidden}
    .pause{min-height:30px;padding:3px 12px;font-size:14px}.flash{border-color:var(--accent)!important;background:var(--accent-soft)!important}.wrong{border-color:var(--warning)!important;background:var(--warning-soft)!important}
    @media (prefers-reduced-motion:reduce){.family{transition:none}}
  </style>
</head>
<body data-page="28" data-total="48">
  <div id="stage">
    <main class="orbit-page">
      <div class="intro"><p>先看路径闭合与否，再看周期关系；不要只按离地高度分类。</p><span class="note">三栏半径经过压缩，数值按模型计算</span></div>
      <section class="k-classification families" aria-label="绕地飞行的三个轨道家族">
        <article class="class-group family min0" data-family="leo"><h2>低地球轨道 <span class="badge">闭合</span></h2><div class="scene no-pan" aria-label="低地球轨道三维示意，可在完成配对后拖动观察"><span class="scale-note">贴近地球的闭合圆</span></div><dl class="facts"></dl></article>
        <article class="class-group family min0" data-family="geo"><h2>地球同步轨道 <span class="badge">闭合</span></h2><div class="scene no-pan" aria-label="赤道圆形地球同步轨道三维示意，可在完成配对后拖动观察"><span class="scale-note">赤道圆形同步示例</span></div><dl class="facts"></dl></article>
        <article class="class-group family min0" data-family="escape"><h2>逃逸轨迹 <span class="badge">开放</span></h2><div class="scene no-pan" aria-label="逃逸开放轨迹三维示意，可在完成配对后拖动观察"><span class="scale-note">开放曲线，不循环返回</span></div><dl class="facts"></dl></article>
      </section>
      <section class="pool" aria-label="待配对属性卡"><div class="pool-head"><p id="guide">选中卡片后，用 ← → 选择栏，按 Enter 放置；也可拖入场景。</p><button class="pause" id="pause" type="button">暂停动画</button></div></section>
    </main>
  </div>
  <script src="assets/lib/three.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:28,kicker:'ORBIT FAMILIES',title:'同在地球附近，走的是三类不同路径',take:'低轨、地球同步轨道和逃逸轨迹具有不同速度、周期与用途'});
    Deck.init({index:28,total:48});

    const P=Lec.P,K=Lec.K, order=['leo','geo','escape'];
    const leoAltSI=K.defaultLeoAltitude>100000?K.defaultLeoAltitude:P.kilometresToMetres(K.defaultLeoAltitude);
    const leo=P.earthLowOrbit(leoAltSI), leoR=P.orbitalRadius(K.earthRadius,leoAltSI);
    let lo=K.earthRadius,hi=lo*2; while(P.orbitalPeriod(K.earthMass,hi)<K.earthSiderealDay) hi*=2;
    for(let i=0;i<70;i++){const m=(lo+hi)/2;if(P.orbitalPeriod(K.earthMass,m)<K.earthSiderealDay)lo=m;else hi=m}
    const geoR=(lo+hi)/2, geoV=P.circularOrbitVelocity(K.earthMass,geoR), escV=P.escapeVelocity(K.earthMass,leoR);
    const n=v=>P.formatNumber(v,{significantDigits:3});
    const facts={
      leo:[['路径','闭合；贴近地球的圆轨道'],['速度',n(leo.speed/1000)+' km/s'],['周期',P.formatDuration(leo.period)+' · '+n(P.orbitsPerDay(leo.period))+' 圈/日'],['用途','载人空间站、近地观测']],
      geo:[['路径','闭合；周期等于地球自转'],['速度',n(geoV/1000)+' km/s'],['周期',P.formatDuration(K.earthSiderealDay)+' · '+n(P.orbitsPerDay(K.earthSiderealDay))+' 圈/日'],['用途','通信、持续气象观测']],
      escape:[['路径','开放；不再重复绕地'],['速度',n(escV/1000)+' km/s（低轨半径处阈值）'],['周期','无闭合周期'],['用途','前往月球之外或行星际空间']]
    };
    document.querySelectorAll('.family').forEach(el=>{el.querySelector('.facts').innerHTML=facts[el.dataset.family].map(([a,b])=>`<dt>${a}</dt><dd class="locked">完成本类配对后显示</dd>`).join('')});

    const cardData=[['周期等于地球自转周期','geo'],['路径开放，不再重复绕地','escape'],['贴近地球，快速重复绕行','leo'],['通信／持续气象观测','geo'],['没有闭合周期','escape'],['周期短，一日多圈','leo'],['闭合，但轨道半径更大','geo'],['离开地球，进入更远空间','escape'],['载人空间站／近地观测','leo']];
    const pool=document.querySelector('.pool'), guide=document.querySelector('#guide'); let selected=null,target=0; const counts={leo:0,geo:0,escape:0};
    cardData.forEach(([text,fam],i)=>{const b=document.createElement('button');b.className='chip';b.type='button';b.draggable=true;b.textContent=text;b.dataset.family=fam;b.dataset.i=i;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>select(b));b.addEventListener('dragstart',e=>{select(b);e.dataTransfer.setData('text/plain',String(i))});b.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();target=Deck.clamp(target+(e.key==='ArrowRight'?1:-1),0,2);guide.textContent='目标：'+document.querySelector(`[data-family="${order[target]}"] h2`).firstChild.textContent.trim() } if(e.key==='Enter'&&selected){e.preventDefault();place(order[target])}});pool.appendChild(b)});
    function select(b){document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));selected=b;b.setAttribute('aria-pressed','true');guide.textContent='用 ← → 选择目标栏，按 Enter 放置。'}
    document.querySelectorAll('.family').forEach((el,i)=>{el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',e=>{e.preventDefault();target=i;place(el.dataset.family)})});
    function place(fam){if(!selected)return;const box=document.querySelector(`[data-family="${fam}"]`);if(selected.dataset.family!==fam){box.classList.add('wrong');guide.textContent=fam==='escape'?'先判断路径是否闭合。':'闭合后，再比较周期是否等于地球自转。';setTimeout(()=>box.classList.remove('wrong'),500);return}selected.classList.add('done');selected.setAttribute('aria-pressed','false');counts[fam]++;selected=null;box.classList.add('flash');setTimeout(()=>box.classList.remove('flash'),450);if(counts[fam]===3)unlock(fam);guide.textContent='配对正确。继续判断下一张卡。'}
    function unlock(fam){const box=document.querySelector(`[data-family="${fam}"]`),dds=box.querySelectorAll('dd');facts[fam].forEach((x,i)=>{dds[i].textContent=x[1];dds[i].classList.remove('locked')});box.dataset.done='1';scenes[fam].burst=1}

    const scenes={}; let paused=Deck.reduced();
    function makeScene(box,fam){const host=box.querySelector('.scene'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(34,host.clientWidth/host.clientHeight,.1,100);camera.position.set(0,3.4,6.8);camera.lookAt(0,0,0);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(host.clientWidth,host.clientHeight,false);renderer.outputColorSpace=THREE.SRGBColorSpace;host.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdcecff,0x172033,2.4));const earth=new THREE.Mesh(new THREE.SphereGeometry(1,32,20),new THREE.MeshStandardMaterial({color:0x2468a8,roughness:.72,metalness:.05}));scene.add(earth);const r=fam==='leo'?1.38:fam==='geo'?2.18:1.42,pts=[];if(fam==='escape'){for(let i=0;i<80;i++){const t=i/79*2.8;pts.push(new THREE.Vector3(-1.2+t*.9,0,Math.sinh(t-1)*.85))}}else{for(let i=0;i<96;i++){const a=i/96*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r))}}const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x55b6ff}));scene.add(line);const craft=new THREE.Mesh(new THREE.ConeGeometry(.10,.28,8),new THREE.MeshStandardMaterial({color:0xffb14a,emissive:0x4a2100}));craft.rotation.z=-Math.PI/2;scene.add(craft);let drag=false,last=0,rot=0;host.addEventListener('pointerdown',e=>{if(box.dataset.done){drag=true;last=e.clientX;host.setPointerCapture(e.pointerId)}});host.addEventListener('pointermove',e=>{if(drag){rot+=(e.clientX-last)*.01;last=e.clientX}});host.addEventListener('pointerup',()=>drag=false);scenes[fam]={scene,camera,renderer,earth,craft,pts,rot,burst:0,host};}
    document.querySelectorAll('.family').forEach(el=>makeScene(el,el.dataset.family));
    document.querySelector('#pause').addEventListener('click',e=>{paused=!paused;e.currentTarget.textContent=paused?'继续动画':'暂停动画'});
    Deck.loop((t,dt)=>{Object.entries(scenes).forEach(([fam,s])=>{if(!paused){s.earth.rotation.y+=dt*.18;if(document.querySelector(`[data-family="${fam}"]`).dataset.done){s.rot+=dt*(fam==='leo'?1.45:fam==='geo'?.24:.34)}}const q=fam==='escape'?Deck.clamp((s.rot%(3.2))/3.2,0,1):(s.rot%(Math.PI*2)+Math.PI*2)%(Math.PI*2)/(Math.PI*2);const idx=Math.min(s.pts.length-1,Math.floor(q*(s.pts.length-1)));s.craft.position.copy(s.pts[idx]);s.scene.rotation.y=fam==='escape'?-.45:.1;s.renderer.render(s.scene,s.camera)})},{still:2.2});
  </script>
</body>
</html>
