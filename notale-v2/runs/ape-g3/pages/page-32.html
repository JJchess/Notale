<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>别追目标，去追它将要到达的位置</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{position:absolute!important;left:50%!important;top:calc(50% - 96px)!important}
    .lec-footer{top:716px!important;bottom:auto!important}
    .rendezvous{position:absolute;left:96px;top:144px;display:grid;grid-template-columns:minmax(0,2fr) minmax(390px,1fr);gap:24px;width:1408px;height:620px}
    .orbit-field{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:var(--radius-lg);background:linear-gradient(145deg,#0c1729,#152b49);box-shadow:var(--shadow-raised);overflow:hidden}
    .orbit-field canvas{z-index:1}.orbit-head{position:absolute;z-index:2;top:40px;left:24px;color:#f5f9ff}.orbit-head h2{color:#f5f9ff}.orbit-head p{margin:4px 0 0;color:#bed4ec}
    .mission-bar{position:absolute;z-index:3;left:24px;right:24px;bottom:20px;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid rgb(199 211 224 / 35%);border-radius:var(--radius-md);background:rgb(12 23 41 / 88%);color:#f5f9ff}
    .mission-bar button{min-width:132px}.mission-status{font-size:var(--fs-sec);line-height:var(--lh-sec);color:#d8e8f8}.mission-status strong{color:#fff}
    .side{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
    .flow.k-process{display:flex;flex-direction:column;gap:6px;min-height:0}
    .flow.k-process>div{min-height:46px;padding:7px 10px 7px 52px;border-radius:var(--radius-sm);box-shadow:none}
    .flow.k-process>div::before{position:absolute;left:10px;top:8px;width:28px;height:28px;margin:0}
    .flow.k-process>div:not(:last-child)::after{content:"↓";z-index:2;top:calc(100% - 5px);left:22px;width:18px;font-size:18px;transform:none}
    .step-title{display:block;font-size:var(--fs-sec);font-weight:750;line-height:1.4}.step-task{display:block;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
    .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}.metric{min-width:0}.metric span{display:block;color:var(--muted);font-size:var(--fs-label);line-height:1.4}.metric output{display:flex;justify-content:flex-start;min-width:0;padding:4px 8px;font-size:var(--fs-sec)}
    .model-note{margin:0;font-size:var(--fs-sec);line-height:var(--lh-sec)}
    #reset{display:none}.ended #fire{display:none}.ended #reset{display:inline-flex}
  </style>
</head>
<body data-page="32" data-total="48">
  <div id="stage">
    <main class="rendezvous">
      <section class="orbit-field min0" aria-label="轨道会合俯视模拟">
        <div class="orbit-head"><h2>同一时钟下的两条轨道</h2><p class="fs-label">蓝色目标在高轨；橙色追踪者从低轨出发</p></div>
        <canvas id="orbit" class="cv-fill" role="img" aria-label="地球居中；目标沿外圈运行，追踪飞行器等待点火后沿半椭圆前往目标未来的位置。"></canvas>
        <div class="mission-bar" id="bar">
          <button id="fire" data-primary type="button">点火</button><button id="reset" data-primary type="button">重新挑战</button>
          <div class="mission-status" aria-live="polite"><strong id="statusTitle">等待点火窗口</strong><br><span id="statusText">相位误差接近零时，按下点火。</span></div>
        </div>
      </section>
      <aside class="side min0">
        <div class="flow k-process" aria-label="轨道会合六步流程">
          <div data-state="done"><span class="step-title">辨认谁在前面</span><span class="step-task">区分现在位置与交会位置</span></div>
          <div data-state="current"><span class="step-title">等待正确相位</span><span class="step-task">低轨追踪者逐渐改变夹角</span></div>
          <div><span class="step-title">第一次点火</span><span class="step-task">在窗口离开低轨</span></div>
          <div><span class="step-title">转移滑行</span><span class="step-task">两船继续按同一时钟运动</span></div>
          <div><span class="step-title">第二次点火</span><span class="step-task">在交会点匹配速度</span></div>
          <div><span class="step-title">判定会合</span><span class="step-task">位置与相对速度都要达标</span></div>
        </div>
        <div class="panel metrics" id="metrics">
          <div class="metric"><span>相位误差</span><output id="phase">—</output></div>
          <div class="metric"><span>任务时间</span><output id="clock">—</output></div>
          <div class="metric"><span>理想转移时间</span><output id="transfer">—</output></div>
          <div class="metric"><span>两次速度增量</span><output id="dv">—</output></div>
        </div>
        <p class="model-note note">太空飞行依赖提前量和轨道时机。到达同一位置后，还要匹配速度方向和大小。</p>
        <p class="model-note note">理想共面圆轨道入门模型；忽略大气阻力、推力持续时间、轨道摄动与导航误差。</p>
      </aside>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:32,kicker:'ORBITAL TIMING',title:'别追目标，去追它将要到达的位置',take:'太空飞行依赖提前量和轨道时机，而不是朝目标直线追赶'});
    Deck.init({index:32,total:48});
    const P=Lec.P,K=Lec.K,TAU=Math.PI*2;
    const earthMass=K.earthMass, earthRadius=K.earthRadius;
    const rawAlt=K.defaultLeoAltitude, targetAlt=rawAlt<1e5?P.kilometresToMetres(rawAlt):rawAlt;
    const chaseAlt=targetAlt*0.55, r1=P.orbitalRadius(earthRadius,chaseAlt),r2=P.orbitalRadius(earthRadius,targetAlt);
    const t1=P.orbitalPeriod(earthMass,r1),t2=P.orbitalPeriod(earthMass,r2),w1=TAU/t1,w2=TAU/t2;
    const tx=P.hohmannTransferTime(earthMass,r1,r2),dvs=P.hohmannDeltaV(earthMass,r1,r2);
    const ideal=norm(Math.PI-w2*tx), speedup=150, initialOffset=0.42;
    const els={cv:document.querySelector('#orbit'),fire:document.querySelector('#fire'),reset:document.querySelector('#reset'),bar:document.querySelector('#bar'),phase:document.querySelector('#phase'),clock:document.querySelector('#clock'),transfer:document.querySelector('#transfer'),dv:document.querySelector('#dv'),title:document.querySelector('#statusTitle'),text:document.querySelector('#statusText'),steps:[...document.querySelectorAll('.flow>div')]};
    let state;
    function norm(a){return Math.atan2(Math.sin(a),Math.cos(a))}
    function fresh(){return {mode:'wait',time:0,targetA:ideal+initialOffset,chaseA:0,departA:0,departTarget:0,elapsed:0,phaseErr:initialOffset,minDist:Infinity,arrivalErr:0}}
    function setStep(n){els.steps.forEach((e,i)=>e.dataset.state=i<n?'done':i===n?'current':'')}
    function reset(){state=fresh();els.bar.classList.remove('ended');els.title.textContent='等待点火窗口';els.text.textContent='相位误差接近零时，按下点火。';setStep(1);update();draw()}
    function fire(){
      if(state.mode==='wait'){state.mode='transfer';state.departA=state.chaseA;state.departTarget=state.targetA;state.elapsed=0;state.arrivalErr=state.phaseErr;els.title.textContent='正在转移滑行';els.text.textContent='接近交会点时，再按一次点火匹配速度。';setStep(3)}
      else if(state.mode==='transfer'){finish(state.elapsed<tx*.82?'第二次点火过早':'',state.elapsed)}
    }
    function finish(reason,at){
      const progress=Math.min(1,at/tx),endA=state.departA+Math.PI,targetA=state.departTarget+w2*at;
      const dist=2*r2*Math.abs(Math.sin(norm(targetA-endA)/2));
      const timeMiss=Math.abs(at-tx),relV=dvs.arrival+P.circularOrbitVelocity(earthMass,r2)*Math.min(1,timeMiss/tx);
      const ok=!reason&&dist<r2*.025&&timeMiss<tx*.035;
      state.mode='ended';state.result={dist,relV,ok};els.bar.classList.add('ended');setStep(5);
      els.title.textContent=ok?'会合成功':'错过目标';
      els.text.textContent=ok?`最近距离 ${P.formatDistance(dist)}；相对速度已进入容差。`:(reason||Math.abs(state.arrivalErr)>.035?'第一次点火相位不对。':'第二次点火时机不对。');
    }
    function update(){
      els.phase.textContent=P.formatNumber(state.phaseErr*180/Math.PI,{maximumFractionDigits:1})+'°';
      els.clock.textContent=P.formatDuration(state.time);
      els.transfer.textContent=P.formatDuration(tx);
      els.dv.textContent=P.formatNumber(dvs.departure,{maximumFractionDigits:0})+' + '+P.formatNumber(dvs.arrival,{maximumFractionDigits:0})+' m/s';
    }
    function draw(){
      const ctx=Deck.fit(els.cv),w=els.cv.offsetWidth,h=els.cv.offsetHeight,cx=w*.48,cy=h*.48,R2=Math.min(w,h)*.33,R1=R2*(r1/r2);
      ctx.clearRect(0,0,w,h);ctx.lineWidth=2;ctx.strokeStyle='rgba(190,212,236,.35)';
      [R1,R2].forEach(r=>{ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.stroke()});
      if(state.mode!=='wait'){ctx.strokeStyle='rgba(232,135,46,.9)';ctx.setLineDash([8,7]);ctx.beginPath();ctx.ellipse(cx+(R2-R1)/2*Math.cos(state.departA),cy+(R2-R1)/2*Math.sin(state.departA),(R1+R2)/2,R2-R1, state.departA,0,TAU);ctx.stroke();ctx.setLineDash([])}
      ctx.fillStyle='#2d72b8';ctx.beginPath();ctx.arc(cx,cy,42,0,TAU);ctx.fill();ctx.strokeStyle='rgba(220,236,255,.8)';ctx.stroke();
      let ca=state.chaseA,cr=R1;if(state.mode!=='wait'){let q=Math.min(1,state.elapsed/tx);ca=state.departA+Math.PI*q;cr=R1+(R2-R1)*(1-Math.cos(Math.PI*q))/2}
      craft(ctx,cx+R2*Math.cos(state.targetA),cy+R2*Math.sin(state.targetA),'#39a0ff',state.targetA);
      craft(ctx,cx+cr*Math.cos(ca),cy+cr*Math.sin(ca),'#e8872e',ca);
      const meet=state.mode==='wait'?state.chaseA+Math.PI:state.departA+Math.PI;ctx.strokeStyle='rgba(57,160,255,.55)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx+R2*Math.cos(meet),cy+R2*Math.sin(meet),13,0,TAU);ctx.stroke();
    }
    function craft(ctx,x,y,color,a){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,8,0,TAU);ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=2;Deck.arrow(ctx,x,y,x-24*Math.sin(a),y+24*Math.cos(a),6);ctx.stroke()}
    els.fire.addEventListener('click',fire);els.reset.addEventListener('click',reset);
    reset();Deck.autofit(els.cv,draw);
    Deck.loop((t,dt)=>{if(state.mode==='ended'||!dt)return;const ds=dt/1000*speedup;state.time+=ds;state.targetA=norm(state.targetA+w2*ds);if(state.mode==='wait'){state.chaseA=norm(state.chaseA+w1*ds);state.phaseErr=norm(state.targetA-state.chaseA-ideal);if(state.time>=t2)finish('第一次点火相位不对。',0)}else{state.elapsed+=ds;if(state.elapsed>tx*1.12)finish('第二次点火时机不对。',state.elapsed)}update();draw()},{still:1});
  </script>
</body>
</html>
