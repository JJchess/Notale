<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>每增加一项能力，都要从别处付账</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    body{width:1600px!important;height:892px!important;position:fixed!important;inset:4px 0 auto!important;margin:0!important;transform:none!important}
    #stage{position:absolute;inset:96px;width:1408px;height:620px;transform:none}
    .mission-ledger{height:620px;display:grid;grid-template-columns:minmax(0,1fr) 392px;grid-template-rows:46px minmax(0,1fr) 82px;gap:14px 20px;position:relative}
    .mission-ledger::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 0 72%,rgb(11 115 224 / 3%) 72% 100%)}
    .ledger-intro{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:relative;z-index:1}
    .ledger-intro p{margin:0;color:var(--muted)}
    .key{display:flex;gap:16px;font-size:var(--fs-label);color:var(--muted)}
    .key i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:50%}.key .gain{background:var(--accent)}.key .press{background:var(--warning)}
    .ledger{min-width:0;display:grid;grid-template-rows:40px minmax(0,1fr);border:1px solid var(--line-strong);border-radius:var(--radius-md);overflow:hidden;background:var(--surface);box-shadow:var(--shadow-panel)}
    .ledger-head,.budget-row{display:grid;grid-template-columns:116px 210px minmax(0,1fr) 204px;align-items:center;column-gap:14px;padding:0 16px}
    .ledger-head{background:#172033;color:#fff;font-size:var(--fs-label);font-weight:700;letter-spacing:.04em}
    .budget-list.k-enumeration{--enumeration-cols:1;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(5,minmax(0,1fr));gap:0}
    .budget-list.k-enumeration>.budget-row{padding:8px 16px;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;transition:background-color var(--transition-fast)}
    .budget-name{font-size:var(--fs-h2);font-weight:760}.track{height:10px;border-radius:8px;background:var(--surface-muted);overflow:hidden}.track-fill{height:100%;width:38%;background:var(--success);transition:width var(--transition-fast),background-color var(--transition-fast)}
    .status{display:block;margin-top:5px;font-size:var(--fs-label);font-weight:750}.impact{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}.effect{font-size:var(--fs-sec);line-height:var(--lh-sec);font-weight:680}
    .budget-row[data-level="1"]{background:var(--warning-soft)}.budget-row[data-level="1"] .track-fill{width:70%;background:var(--warning)}.budget-row[data-level="2"]{background:var(--danger-soft)}.budget-row[data-level="2"] .track-fill{width:100%;background:var(--danger)}
    .budget-row.flash-gain{outline:3px solid var(--accent);outline-offset:-3px}.budget-row.flash-press{outline:3px solid var(--warning);outline-offset:-3px}
    .tray{min-width:0;border:1px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface);overflow:hidden;box-shadow:var(--shadow-panel);position:relative;z-index:1}
    .tray-title{height:40px;box-sizing:border-box;padding:9px 14px;background:var(--surface-muted);font-size:var(--fs-label);font-weight:760;letter-spacing:.04em}
    .choice-groups{height:calc(100% - 40px);display:grid;grid-template-rows:repeat(5,minmax(0,1fr))}
    .choice-group{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid var(--line)}
    .group-label{font-size:var(--fs-label);font-weight:720;color:var(--muted)}.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .design-card{min-height:46px;display:flex;align-items:center;justify-content:center;padding:5px 7px;box-sizing:border-box;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-soft);font-size:var(--fs-label);font-weight:700;line-height:1.35;text-align:center;cursor:grab;user-select:none}.design-card[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-strong)}.design-card:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
    .settlement{grid-column:1/3;display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px;padding:14px 20px;border:2px solid var(--danger);border-radius:var(--radius-md);background:var(--danger-soft);position:relative;z-index:1}.settlement[data-ok="true"]{border-color:var(--success);background:var(--success-soft)}
    .verdict{font-size:var(--fs-h2);font-weight:780}.verdict-note{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}.instruction{max-width:445px;text-align:right;font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
  </style>
</head>
<body data-page="33" data-total="48">
  <div id="stage">
    <main class="mission-ledger" aria-label="交互式任务总账">
      <div class="ledger-intro">
        <p class="fs-lead">每次只替换同组的一张设计卡，五本账会一起结算。</p>
        <div class="key" aria-label="影响标记"><span><i class="gain"></i>改善</span><span><i class="press"></i>施压</span></div>
      </div>

      <section class="ledger min0" aria-label="五项任务预算">
        <div class="ledger-head"><span>预算项</span><span>当前状态</span><span>受当前选择影响</span><span>越界后果</span></div>
        <div class="budget-list k-enumeration" id="budgetList"></div>
      </section>

      <aside class="tray min0" aria-label="任务设计卡托盘">
        <div class="tray-title">DESIGN TRAY · 当前任务</div>
        <div class="choice-groups" id="choices"></div>
      </aside>

      <div class="settlement" id="settlement" data-ok="false">
        <div><div class="verdict" id="verdict" aria-live="polite">任务尚不可执行</div><div class="verdict-note">载荷、推进剂、时间、安全和成本必须在同一任务中交换。</div></div>
        <div class="instruction">拖拽卡片到同组卡片上完成替换。键盘可用左右键选卡，按 Enter 启用或撤销。</div>
      </div>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 33,
      kicker: 'MISSION LEDGER',
      title: '每增加一项能力，都要从别处付账',
      take: '载荷、推进剂、时间、安全和成本必须在同一任务中交换。'
    });
    Deck.init({ index: 33, total: 48 });

    const rows = [
      {id:'payload',name:'载荷',states:['宽裕','紧张','超出运载能力'],meaning:'任务人员、仪器、补给与设备',fail:'方案不能执行'},
      {id:'fuel',name:'推进剂',states:['有余量','余量很小','不足'],meaning:'机动、修正与必要余量',fail:'无法完成机动'},
      {id:'time',name:'时间',states:['从容','受窗口约束','不可接受'],meaning:'等待、途中与任务持续时间',fail:'持续时间不可接受'},
      {id:'safety',name:'安全',states:['有冗余','单点脆弱','不可放行'],meaning:'备份、修正与中止余地',fail:'没有足够故障余量'},
      {id:'cost',name:'成本',states:['有余量','接近上限','超出上限'],meaning:'制造、测试、发射与运行资源',fail:'超出工程资源上限'}
    ];
    const groups = [
      {label:'任务目标',options:[{name:'多带科学设备',e:{payload:1,fuel:1,time:0,safety:-1,cost:1}},{name:'精简任务目标',e:{payload:-1,fuel:-1,time:0,safety:1,cost:-1}}]},
      {label:'推进安排',options:[{name:'增加推进余量',e:{payload:1,fuel:-1,time:0,safety:-1,cost:1}},{name:'保留更多载荷',e:{payload:-1,fuel:1,time:0,safety:1,cost:-1}}]},
      {label:'转移策略',options:[{name:'较快转移',e:{payload:0,fuel:1,time:-1,safety:-1,cost:1}},{name:'较慢转移',e:{payload:0,fuel:-1,time:1,safety:1,cost:-1}}]},
      {label:'故障余量',options:[{name:'增加备份系统',e:{payload:1,fuel:1,time:0,safety:-1,cost:1}},{name:'接受单点故障',e:{payload:-1,fuel:-1,time:0,safety:2,cost:-1}}]},
      {label:'工程投入',options:[{name:'扩大工程投入',e:{payload:-1,fuel:-1,time:-1,safety:-1,cost:1}},{name:'维持成本上限',e:{payload:1,fuel:1,time:1,safety:1,cost:-1}}]}
    ];
    const selected = [0,1,0,1,1];
    const budgetList=document.getElementById('budgetList'), choices=document.getElementById('choices');
    rows.forEach(r=>{const el=document.createElement('div');el.className='budget-row';el.id='row-'+r.id;el.innerHTML=`<div class="budget-name">${r.name}</div><div><div class="track"><div class="track-fill"></div></div><span class="status"></span></div><div class="impact">${r.meaning}</div><div class="effect"></div>`;budgetList.appendChild(el)});
    groups.forEach((g,gi)=>{const wrap=document.createElement('div');wrap.className='choice-group';wrap.innerHTML=`<div class="group-label">${g.label}</div><div class="cards"></div>`;g.options.forEach((o,oi)=>{const card=document.createElement('div');card.className='design-card';card.textContent=o.name;card.tabIndex=0;card.draggable=true;card.setAttribute('role','button');card.dataset.group=gi;card.dataset.option=oi;card.addEventListener('click',()=>choose(gi,oi));card.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',gi+':'+oi));card.addEventListener('dragover',e=>e.preventDefault());card.addEventListener('drop',e=>{e.preventDefault();const [sg,so]=e.dataTransfer.getData('text/plain').split(':').map(Number);choose(gi,sg===gi?so:oi)});card.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const ni=oi?0:1;wrap.querySelectorAll('.design-card')[ni].focus()}if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(gi,oi)}});wrap.querySelector('.cards').appendChild(card)});choices.appendChild(wrap)});
    let timer;
    function choose(gi,oi){selected[gi]=selected[gi]===oi?1-oi:oi;render(gi)}
    function render(changed=-1){
      const scores={payload:0,fuel:0,time:0,safety:0,cost:0};
      groups.forEach((g,gi)=>Object.entries(g.options[selected[gi]].e).forEach(([k,v])=>scores[k]+=v));
      choices.querySelectorAll('.design-card').forEach(c=>c.setAttribute('aria-pressed',selected[+c.dataset.group]===+c.dataset.option?'true':'false'));
      let ok=true; rows.forEach(r=>{const level=scores[r.id]>=2?2:scores[r.id]>=1?1:0;ok=ok&&level<2;const el=document.getElementById('row-'+r.id);el.dataset.level=level;el.querySelector('.status').textContent=r.states[level];el.querySelector('.effect').textContent=level===2?r.fail:(scores[r.id]>0?'当前选择正在施压':scores[r.id]<0?'当前选择提供余量':'改善与压力相抵');if(changed>=0){const delta=groups[changed].options[selected[changed]].e[r.id];el.classList.toggle('flash-gain',delta<0);el.classList.toggle('flash-press',delta>0)}});
      const box=document.getElementById('settlement');box.dataset.ok=ok?'true':'false';document.getElementById('verdict').textContent=ok?'任务可执行，但仍有取舍':'任务尚不可执行';clearTimeout(timer);timer=setTimeout(()=>document.querySelectorAll('.budget-row').forEach(e=>e.classList.remove('flash-gain','flash-press')),500)
    }
    render();
  </script>
</body>
</html>
