<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>月球、火星与轨道，不是同一种“低重力”</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{top:calc(50% - 96px)}
    .lec-footer{bottom:96px}
    .p35{height:620px;display:grid;grid-template-rows:48px 226px 280px 42px;gap:8px;min-width:0;min-height:0}
    .world-tabs{display:grid;grid-template-columns:180px repeat(3,minmax(0,1fr));gap:0;align-items:stretch}
    .world-tabs .prompt{display:flex;align-items:center;color:var(--muted);font-size:var(--fs-label);font-weight:700}
    .world-tab{position:relative;border-radius:0;border-color:var(--line);background:var(--surface);font-size:var(--fs-body)}
    .world-tab:first-of-type{border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
    .world-tab:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0}
    .world-tab[aria-selected="true"]{z-index:1;border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
    .world-tab[data-visited="true"]::after{content:"✓";margin-left:8px;color:var(--success);font-size:var(--fs-label)}
    .scene-strip{display:grid;grid-template-columns:180px repeat(3,minmax(0,1fr));min-width:0;min-height:0}
    .scene-key{display:flex;flex-direction:column;justify-content:center;padding-right:20px}
    .scene-key strong{font-size:var(--fs-lead);line-height:var(--lh-lead)}
    .scene-key span{margin-top:8px;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .viewport{position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid var(--line);background:var(--surface-soft);transition:opacity 220ms ease,border-color 220ms ease,box-shadow 220ms ease}
    .viewport:nth-child(2){border-radius:var(--radius-md) 0 0 var(--radius-md)}
    .viewport:last-child{border-radius:0 var(--radius-md) var(--radius-md) 0}
    .viewport:not(.active){opacity:.58}
    .viewport.active{z-index:1;border:2px solid var(--accent);box-shadow:var(--shadow-raised);opacity:1}
    .viewport canvas{display:block;width:100%;height:100%}
    .scene-readout{position:absolute;left:12px;top:10px;padding:5px 9px;border-radius:var(--radius-sm);background:rgb(255 255 255 / 88%);color:var(--text);font-size:var(--fs-label);font-weight:750;line-height:var(--lh-label)}
    .comparison-wrap{min-width:0;min-height:0}
    .p35 .k-comparison{--comparison-cols:3;height:100%;grid-template-columns:180px repeat(3,minmax(0,1fr));grid-template-rows:46px repeat(4,58px);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .p35 .k-comparison>*{display:flex;align-items:center;padding:8px 14px}
    .p35 .k-comparison>[data-heading]{font-size:var(--fs-body);line-height:var(--lh-body)}
    .p35 .k-comparison>.active-cell{background:var(--accent-soft)}
    .challenge{display:grid;grid-template-columns:180px 1fr;align-items:center;border-top:1px solid var(--line)}
    .challenge strong{font-size:var(--fs-label);color:var(--accent-strong)}
    .challenge span{font-size:var(--fs-sec);line-height:var(--lh-sec)}
    @media (prefers-reduced-motion:reduce){.viewport{transition:none}}
  </style>
</head>
<body data-page="35" data-total="48">
  <div id="stage">
    <main class="p35" aria-label="月球、火星与近地轨道的重力环境比较">
      <div class="world-tabs" role="tablist" aria-label="切换重力环境">
        <div class="prompt">选择环境，逐列比较</div>
        <button class="world-tab" id="tab-moon" role="tab" aria-selected="true" aria-controls="view-moon" tabindex="0" data-world="moon">月球表面</button>
        <button class="world-tab" id="tab-mars" role="tab" aria-selected="false" aria-controls="view-mars" tabindex="-1" data-world="mars">火星表面</button>
        <button class="world-tab" id="tab-orbit" role="tab" aria-selected="false" aria-controls="view-orbit" tabindex="-1" data-world="orbit">近地轨道</button>
      </div>

      <section class="scene-strip" aria-label="同一抽象人体在三种环境中的状态">
        <div class="scene-key"><strong>同一个人</strong><span>同一质量、姿势与相机尺度；环境条件不同。</span></div>
        <div class="viewport active" id="view-moon" role="tabpanel" aria-labelledby="tab-moon"><canvas aria-hidden="true"></canvas><span class="scene-readout" id="read-moon"></span></div>
        <div class="viewport" id="view-mars" role="tabpanel" aria-labelledby="tab-mars"><canvas aria-hidden="true"></canvas><span class="scene-readout" id="read-mars"></span></div>
        <div class="viewport" id="view-orbit" role="tabpanel" aria-labelledby="tab-orbit"><canvas aria-hidden="true"></canvas><span class="scene-readout" id="read-orbit"></span></div>
      </section>

      <section class="comparison-wrap">
        <div class="k-comparison" aria-label="四个维度的对齐比较">
          <div data-axis data-heading>比较维度</div><div data-heading data-col="moon">月球表面</div><div data-heading data-col="mars">火星表面</div><div data-heading data-col="orbit">近地轨道</div>
          <div data-axis>所处情境</div><div data-col="moon">双脚接触固体表面</div><div data-col="mars">双脚接触固体表面</div><div data-col="orbit">人与飞行器共同绕地球运动</div>
          <div data-axis>引力如何作用</div><div data-col="moon">月球引力较弱</div><div data-col="mars">火星引力较弱</div><div data-col="orbit">地球引力仍然存在</div>
          <div data-axis>持续支持力</div><div data-col="moon">地面对脚提供支持</div><div data-col="mars">地面对脚提供支持</div><div data-col="orbit" data-diff>舱内通常不持续托住身体</div>
          <div data-axis>直接身体任务</div><div data-col="moon">控制较慢的起落与落地</div><div data-col="mars">适应较低承重下的移动</div><div data-col="orbit" data-diff>固定身体，并重新建立方向感</div>
        </div>
      </section>

      <div class="challenge" aria-live="polite"><strong>眼前的挑战</strong><span id="challenge">动作不能照搬地球经验：较慢的起落仍需要控制落地。</span></div>
    </main>
  </div>

  <script src="assets/lib/three.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 35,
      kicker: 'GRAVITY IS NOT ONE CONDITION',
      title: '月球、火星与轨道，不是同一种“低重力”',
      take: '月球、火星和轨道环境对身体施加的是三种不同挑战。'
    });
    Deck.init({ index: 35, total: 48 });

    const worlds = ['moon','mars','orbit'];
    const g = {moon:Lec.K.moonGravity, mars:Lec.K.marsGravity};
    const pct = key => Lec.P.percent(g[key] / Lec.K.earthGravity);
    const leoRaw = Lec.K.defaultLeoAltitude;
    const leoKm = leoRaw > 10000 ? Lec.P.metresToKilometres(leoRaw) : leoRaw;
    document.querySelector('#read-moon').textContent = Lec.P.formatNumber(g.moon) + ' m/s² · 地球的 ' + pct('moon');
    document.querySelector('#read-mars').textContent = Lec.P.formatNumber(g.mars) + ' m/s² · 地球的 ' + pct('mars');
    document.querySelector('#read-orbit').textContent = '约 ' + Lec.P.formatNumber(leoKm) + ' km · 引力仍在';

    const challenges = {
      moon:'动作不能照搬地球经验：较慢的起落仍需要控制落地。',
      mars:'脚下仍有支持，但行走、转身和搬物时的承重与地球不同。',
      orbit:'漂浮来自共同自由下落；要固定身体并控制动作的反作用。'
    };
    let active = 'moon';
    const visited = new Set(['moon']);

    function selectWorld(key, focus){
      active = key; visited.add(key);
      document.querySelectorAll('.world-tab').forEach(btn => {
        const on = btn.dataset.world === key;
        btn.setAttribute('aria-selected', String(on));
        btn.tabIndex = on ? 0 : -1;
        btn.dataset.visited = visited.has(btn.dataset.world);
        if(on && focus) btn.focus();
      });
      worlds.forEach(w => document.querySelector('#view-'+w).classList.toggle('active',w===key));
      document.querySelectorAll('[data-col]').forEach(el => el.classList.toggle('active-cell',el.dataset.col===key));
      document.querySelector('#challenge').textContent = challenges[key];
    }
    document.querySelectorAll('.world-tab').forEach(btn => {
      btn.addEventListener('click',()=>selectWorld(btn.dataset.world,false));
      btn.addEventListener('keydown',e=>{
        if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
        e.preventDefault();
        const i=worlds.indexOf(btn.dataset.world);
        selectWorld(worlds[(i+(e.key==='ArrowRight'?1:2))%3],true);
      });
    });

    const scenes = {};
    function makeHuman(color){
      const group=new THREE.Group(), mat=new THREE.MeshStandardMaterial({color,roughness:.65});
      const add=(geo,y)=>{const m=new THREE.Mesh(geo,mat);m.position.y=y;group.add(m);return m};
      add(new THREE.SphereGeometry(.23,20,14),2.25);
      add(new THREE.CapsuleGeometry(.28,.75,6,12),1.42);
      [-.16,.16].forEach(x=>{const leg=add(new THREE.CapsuleGeometry(.09,.72,4,10),.62);leg.position.x=x});
      [-.42,.42].forEach(x=>{const arm=add(new THREE.CapsuleGeometry(.07,.62,4,10),1.48);arm.position.x=x;arm.rotation.z=x>0?-.18:.18});
      return group;
    }
    function build(key){
      const host=document.querySelector('#view-'+key), canvas=host.querySelector('canvas');
      const scene=new THREE.Scene();scene.background=new THREE.Color(key==='orbit'?0x101a2c:key==='mars'?0xf1dfd1:0xe7edf4);
      const camera=new THREE.PerspectiveCamera(38,1,.1,30);camera.position.set(0,1.35,6);camera.lookAt(0,1.15,0);
      const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setPixelRatio(Math.min(devicePixelRatio,2));
      scene.add(new THREE.HemisphereLight(0xffffff,0x899bb0,2.3));const light=new THREE.DirectionalLight(0xffffff,2.2);light.position.set(3,5,4);scene.add(light);
      const human=makeHuman(key==='mars'?0xa45c00:key==='orbit'?0x0b73e0:0x58697d);scene.add(human);
      const ball=new THREE.Mesh(new THREE.SphereGeometry(.13,18,12),new THREE.MeshStandardMaterial({color:0xb83a45,roughness:.4}));ball.position.set(.95,2.35,0);scene.add(ball);
      if(key!=='orbit'){
        const ground=new THREE.Mesh(new THREE.CylinderGeometry(3.8,3.8,.22,48),new THREE.MeshStandardMaterial({color:key==='mars'?0xb97853:0x899bb0,roughness:1}));ground.position.y=.04;scene.add(ground);
      }else{
        const cabin=new THREE.Mesh(new THREE.CylinderGeometry(2.7,2.7,1.7,32,1,true),new THREE.MeshStandardMaterial({color:0x899bb0,wireframe:true,transparent:true,opacity:.35}));cabin.rotation.z=Math.PI/2;cabin.position.y=1.25;scene.add(cabin);human.rotation.z=-.18;
      }
      function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
      resize(); scenes[key]={scene,camera,renderer,human,ball,resize};
    }
    worlds.forEach(build); Deck.onResize(()=>worlds.forEach(w=>scenes[w].resize()));
    Deck.loop((t)=>{
      worlds.forEach(key=>{
        const s=scenes[key];
        if(key==='orbit'){
          s.human.position.y=.18*Math.sin(t*.0011);s.ball.position.y=2.15+.22*Math.sin(t*.0011+.8);s.ball.position.x=.9+.12*Math.cos(t*.0008);
        }else{
          const period=key==='moon'?3.2:2.25, phase=(t/1000)%period, u=phase/period;
          s.ball.position.y=.18+2.17*4*u*(1-u);
        }
        s.renderer.render(s.scene,s.camera);
      });
    },{still:1600});
    selectWorld('moon',false);
  </script>
</body>
</html>
