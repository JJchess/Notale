<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>骨与肌肉会按日常负荷重新分配自己</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-header__inner,.lec-footer__inner{width:100%;display:flex;align-items:center;gap:24px}.lec-header__identity{font-weight:800;white-space:nowrap}.lec-header__kicker{margin:0;color:var(--accent);font-weight:750;white-space:nowrap}.lec-header__title{font-size:22px}.lec-header__page{margin-left:auto}.lec-footer__take-label{font-weight:800;color:var(--accent);white-space:nowrap}.lec-footer__take-text{margin:0}.p36{position:absolute;left:96px;top:140px;width:1408px;height:620px;display:grid;grid-template-rows:284px 320px;gap:16px}.load-lab{display:grid;grid-template-columns:420px minmax(0,1fr);gap:24px}.body-map,.controls{position:relative;overflow:hidden}.body-map{display:grid;grid-template-columns:190px 1fr;align-items:center;padding:16px 22px}.figure{position:relative;width:150px;height:240px;margin:auto}.head{position:absolute;left:55px;top:0;width:40px;height:40px;border-radius:50%;background:var(--surface-muted);border:2px solid var(--line-strong)}.torso{position:absolute;left:38px;top:44px;width:74px;height:84px;border-radius:28px 28px 18px 18px;background:var(--surface-muted);border:2px solid var(--line-strong)}.limb{position:absolute;background:var(--surface-muted);border:2px solid var(--line-strong);border-radius:18px}.arm-l{left:18px;top:52px;width:22px;height:98px;transform:rotate(8deg)}.arm-r{right:18px;top:52px;width:22px;height:98px;transform:rotate(-8deg)}.leg-l{left:42px;top:122px;width:28px;height:105px}.leg-r{right:42px;top:122px;width:28px;height:105px}.band{position:absolute;left:50%;transform:translateX(-50%);height:13px;border-radius:8px;background:var(--warning);box-shadow:0 0 0 5px rgb(164 92 0 / 12%);transition:width 220ms ease-out,opacity 220ms ease-out}.band.torso-band{top:84px}.band.hip-band{top:132px}.band.foot-band{top:222px}.map-copy h2{margin-bottom:8px}.map-copy p{margin:0;color:var(--muted)}.controls{padding:16px 20px}.controls h2{margin-bottom:8px}.ctl{min-height:45px}.ctl label{width:72px}.ctl output{min-width:76px;padding:4px 8px}.time-row{margin-top:4px;padding-top:4px;border-top:1px solid var(--line)}.time-state{min-width:112px;text-align:center}.process-wrap{position:relative;padding:14px 16px 12px}.process-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.process-head p{margin:0}.k-process{gap:26px;height:112px}.k-process>article{padding:10px 10px 8px;border-radius:8px;transition:background 220ms ease-out,border-color 220ms ease-out,opacity 220ms ease-out}.k-process>article::before{width:24px;height:24px;margin-bottom:5px}.k-process>article:not(:last-child)::after{left:calc(100% + 1px);width:24px}.step-title{font-size:15px;line-height:1.4;font-weight:750}.tracks{margin-top:12px;display:grid;grid-template-columns:76px 1fr;grid-template-rows:42px 42px;gap:8px 12px;align-items:center}.track-label{font-size:15px;font-weight:750}.track{position:relative;height:34px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(90deg,var(--surface-soft),var(--surface));overflow:hidden}.range{position:absolute;left:0;top:5px;height:22px;border-radius:0 7px 7px 0;transition:width 240ms ease-out,opacity 240ms ease-out}.bone-range{background:linear-gradient(90deg,#d8dee7,var(--warning));opacity:.75}.muscle-range{background:linear-gradient(90deg,#e6b786,#a45c00);opacity:.68}.cursor{position:absolute;top:0;bottom:0;width:3px;background:var(--accent);transition:left 240ms ease-out}.track-copy{position:absolute;inset:0 10px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;color:var(--text)}.note-line{position:absolute;right:16px;bottom:8px}.panel{box-shadow:none}@media(prefers-reduced-motion:reduce){.band,.k-process>article,.range,.cursor{transition:none}}
  </style>
</head>
<body data-page="36" data-total="48">
  <div id="stage">
    <main class="p36" aria-label="承重减少后骨与肌肉变化的参数模拟">
      <section class="load-lab">
        <div class="body-map panel min0">
          <div class="figure" aria-hidden="true">
            <div class="head"></div><div class="torso"></div><div class="limb arm-l"></div><div class="limb arm-r"></div><div class="limb leg-l"></div><div class="limb leg-r"></div>
            <div class="band torso-band" id="band-trunk"></div><div class="band hip-band" id="band-hip"></div><div class="band foot-band" id="band-foot"></div>
          </div>
          <div class="map-copy min0"><h2>机械负荷落在哪里？</h2><p class="fs-sec">压力带越宽，表示该区域获得的日常机械刺激越多。活动负荷不会变成零。</p></div>
        </div>
        <div class="controls panel min0">
          <h2>重排有限的日常负荷</h2>
          <div class="ctl"><label for="trunk">躯干</label><input id="trunk" type="range" min="8" max="72" step="1" value="30"><output id="out-trunk">—</output></div>
          <div class="ctl"><label for="hip">髋腿</label><input id="hip" type="range" min="8" max="72" step="1" value="45"><output id="out-hip">—</output></div>
          <div class="ctl"><label for="foot">足部</label><input id="foot" type="range" min="8" max="72" step="1" value="25"><output id="out-foot">—</output></div>
          <div class="ctl time-row"><label for="time">过程</label><input id="time" type="range" min="0" max="100" step="1" value="62"><output id="time-state" class="time-state">持续暴露</output></div>
        </div>
      </section>
      <section class="process-wrap panel min0">
        <div class="process-head"><h2>同一变化沿时间累积</h2><p class="fs-sec">看方向与范围，不把一条线当成所有人的结果。</p></div>
        <div class="k-process" id="steps">
          <article><div class="step-title">日常承重减少</div></article>
          <article><div class="step-title">机械刺激下降</div></article>
          <article><div class="step-title">维持需求改变</div></article>
          <article><div class="step-title">重建不再平衡</div></article>
          <article><div class="step-title">变化随时间累积</div></article>
          <article><div class="step-title">重新承重后再训练</div></article>
        </div>
        <div class="tracks" aria-live="polite">
          <div class="track-label">骨轨</div><div class="track"><div class="range bone-range" id="bone-range"></div><div class="cursor" id="cursor-bone"></div><div class="track-copy"><span>机械刺激</span><span id="bone-copy">重建趋于偏移</span><span>骨量变化范围</span></div></div>
          <div class="track-label">肌肉轨</div><div class="track"><div class="range muscle-range" id="muscle-range"></div><div class="cursor" id="cursor-muscle"></div><div class="track-copy"><span>用力需求</span><span id="muscle-copy">维持需求改变</span><span>能力变化范围</span></div></div>
        </div>
        <p class="note note-line" title="输出仅表达方向、累积和个体差异范围">教学示意，不是个体医学预测</p>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:36,kicker:'BODY UNDER LOAD',title:'骨与肌肉会按日常负荷重新分配自己',take:'缺少日常承重会推动骨与肌肉发生可测量的变化'});
    document.documentElement.classList.remove('lec-root');
    document.body.classList.remove('lec-page');
    Deck.init({index:36,total:48});
    (function(){
      var ids=['trunk','hip','foot'], base=[.30,.45,.25];
      var sliders=ids.map(function(id){return document.getElementById(id)});
      var time=document.getElementById('time');
      var rawBone=Lec.K.microgravityBoneLossRange;
      var rawMuscle=Lec.K.microgravityMuscleLossRange;
      function pct(v){return Lec.P.formatNumber(Lec.P.percent(v,1),{maximumFractionDigits:0})+'%'}
      function normalize(changed){
        var vals=sliders.map(function(s){return Number(s.value)/100});
        var fixed=vals[changed], rest=1-fixed, otherSum=vals.reduce(function(a,v,i){return i===changed?a:a+v},0);
        vals=vals.map(function(v,i){return i===changed?fixed:v/otherSum*rest});
        sliders.forEach(function(s,i){s.value=Math.round(vals[i]*100)});
        var sum=sliders.reduce(function(a,s){return a+Number(s.value)},0); sliders[2].value=Number(sliders[2].value)+(100-sum);
        update();
      }
      function update(){
        var vals=sliders.map(function(s){return Number(s.value)/100}), t=Number(time.value)/100;
        vals.forEach(function(v,i){document.getElementById('out-'+ids[i]).value=pct(v);document.getElementById('band-'+ids[i]).style.width=(30+v*125)+'px';document.getElementById('band-'+ids[i]).style.opacity=.35+v*.8});
        var deficit=vals.reduce(function(a,v,i){return a+Math.max(0,1-v/base[i])*base[i]},0);
        var progress=Deck.clamp(t*deficit,0,1), phase=Math.min(5,Math.floor(t*6));
        document.querySelectorAll('#steps article').forEach(function(el,i){el.dataset.state=i<phase?'done':(i===phase?'current':'')});
        var width=8+progress*78; document.getElementById('bone-range').style.width=width+'%';document.getElementById('muscle-range').style.width=(8+progress*86)+'%';
        document.getElementById('cursor-bone').style.left=(t*99)+'%';document.getElementById('cursor-muscle').style.left=(t*99)+'%';
        document.getElementById('time-state').value=t<.2?'开始':(t<.82?'持续暴露':'重新承重');
        document.getElementById('bone-copy').textContent=progress<.12?'形成与吸收接近平衡':'形成—吸收平衡偏移';
        document.getElementById('muscle-copy').textContent=progress<.12?'使用与维持接近平衡':'使用—维持需求偏移';
        document.querySelector('.process-wrap').dataset.constants=(rawBone!==undefined&&rawMuscle!==undefined)?'shared-ranges':'normalized-range';
      }
      sliders.forEach(function(s,i){s.addEventListener('input',function(){normalize(i)})});time.addEventListener('input',update);update();
    }());
  </script>
</body>
</html>
