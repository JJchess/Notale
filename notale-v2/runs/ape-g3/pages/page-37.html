<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>同样是失重，不是同一套身体反应</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    html,body{height:900px!important;overflow:hidden}
    #stage{position:fixed;top:0!important;left:0!important;transform:scale(var(--s))!important;transform-origin:top left}
    .lec-footer{bottom:96px}
    .diagnostic{height:620px;display:grid;grid-template-rows:128px 1fr 92px;gap:16px;box-sizing:border-box}
    .casebar{display:grid;grid-template-columns:180px 1fr 170px;gap:16px;align-items:stretch}
    .case-meta{display:flex;flex-direction:column;justify-content:center;color:var(--muted)}
    .case-meta strong{color:var(--text);font-size:var(--fs-h2);line-height:var(--lh-h2)}
    .symptom{display:flex;align-items:center;gap:18px;padding:16px 22px;border:2px solid var(--accent);border-radius:var(--radius-md);background:var(--accent-soft);box-shadow:var(--shadow-panel);cursor:grab}
    .symptom:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
    .symptom-icon{font-size:36px;line-height:1}
    .symptom strong{display:block;font-size:var(--fs-h2);line-height:var(--lh-h2)}
    .symptom span:last-child{display:block;margin-top:4px;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .statebox{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
    .statebox strong{font-size:var(--fs-body)}
    .statebox span{color:var(--muted);font-size:var(--fs-label)}
    .systems.k-classification{padding:14px;gap:12px}
    .systems-head{display:flex;align-items:center;justify-content:space-between}
    .systems-head strong{font-size:var(--fs-body)}
    .systems-head span{color:var(--muted);font-size:var(--fs-label)}
    .branches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;min-height:0}
    .branch{display:flex;flex-direction:column;gap:8px;padding:13px!important;cursor:pointer;transition:background var(--transition-fast),border-color var(--transition-fast)}
    .branch:hover,.branch.dragover{border-color:var(--accent)!important;background:var(--accent-soft)!important}
    .branch:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
    .branch-title{display:flex;align-items:center;gap:9px;font-size:var(--fs-body);font-weight:760}
    .branch-title b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--surface-muted);font-size:18px}
    .mechanism{color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .locked{margin-top:auto;padding:8px 10px;border-left:5px solid var(--success);border-radius:var(--radius-sm);background:var(--success-soft);font-size:var(--fs-label);line-height:var(--lh-label)}
    .branch[data-empty="true"] .locked{color:var(--muted);border-left-color:var(--line);background:var(--surface-soft)}
    .feedback{display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center;padding:14px 18px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
    .feedback-mark{font-size:30px;text-align:center}
    .feedback strong{display:block;font-size:var(--fs-body)}
    .feedback p{margin:2px 0 0;font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
    #reset{display:none}
    .complete #reset{display:inline-flex}
    .complete .symptom{border-color:var(--success);background:var(--success-soft);cursor:default}
  </style>
</head>
<body data-page="37" data-total="48">
  <div id="stage">
    <main class="diagnostic" aria-label="失重表现分类诊断台">
      <section class="casebar" aria-label="待判断表现">
        <div class="case-meta"><span class="fs-label">待判断表现</span><strong id="progress">开始分类</strong><span class="fs-label">拖动卡片，或选择系统</span></div>
        <div id="card" class="symptom no-pan" tabindex="0" role="button" draggable="true" aria-describedby="cardHint">
          <span class="symptom-icon" aria-hidden="true">◉</span><span><strong id="cardTitle"></strong><span id="cardHint"></span></span>
        </div>
        <div class="statebox" aria-live="polite"><strong id="stateLabel">待判断</strong><span>按 Enter 依次选择</span></div>
      </section>

      <section class="systems k-classification" aria-label="微重力下的四类系统响应">
        <div class="systems-head"><strong>同一环境输入：轨道微重力</strong><span>按最直接相关的主要系统归类</span></div>
        <div class="branches">
          <button class="branch class-group" data-system="fluid" data-empty="true"><span class="branch-title"><b>↟</b>体液分布</span><span class="mechanism">体液位置改变</span><span class="locked">尚未归入表现</span></button>
          <button class="branch class-group" data-system="balance" data-empty="true"><span class="branch-title"><b>⌁</b>前庭与平衡</span><span class="mechanism">方向信息冲突</span><span class="locked">尚未归入表现</span></button>
          <button class="branch class-group" data-system="muscle" data-empty="true"><span class="branch-title"><b>⌁</b>肌肉</span><span class="mechanism">使用负荷减少</span><span class="locked">尚未归入表现</span></button>
          <button class="branch class-group" data-system="bone" data-empty="true"><span class="branch-title"><b>◇</b>骨骼</span><span class="mechanism">骨重建改变</span><span class="locked">尚未归入表现</span></button>
        </div>
      </section>

      <section class="feedback" aria-live="polite">
        <span class="feedback-mark" id="feedbackMark" aria-hidden="true">?</span>
        <div><strong id="feedbackTitle">先问：哪个系统的正常输入或负荷改变了？</strong><p id="feedbackText">分类指向主要系统；身体各系统仍会彼此影响。</p></div>
        <button id="reset" type="button">重新诊断</button>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:37,kicker:'MICROGRAVITY · SYSTEM MATCH',title:'同样是失重，不是同一套身体反应',take:'体液、平衡、肌肉和骨骼的变化来自不同生理系统'});
    Deck.init({index:37,total:48});

    const cases=[
      {t:'头面部胀满感',h:'脸部显得浮肿，头部有发胀感。',s:'fluid',why:'体液更多移向头胸部，首先指向体液重新分布。'},
      {t:'鼻塞样不适',h:'没有普通感冒线索，却有鼻腔充血般的感觉。',s:'fluid',why:'头部附近的体液分布改变可引起这种感觉。'},
      {t:'转头时眩晕',h:'视觉与内耳提供的方向信息暂时不一致。',s:'balance',why:'方向线索冲突，主要属于平衡与空间定向的重新校准。'},
      {t:'恶心与空间运动不适',h:'刚进入微重力环境时更明显。',s:'balance',why:'主要关联感觉线索冲突与前庭适应，也可能受多重因素影响。'},
      {t:'重新承重时腿部乏力',h:'回到有重力环境后，站立和行走要重新适应。',s:'muscle',why:'承重需求减少后，肌肉力量与控制能力发生变化。'},
      {t:'维持姿势更易疲劳',h:'尤其涉及躯干和下肢抗重力肌群。',s:'muscle',why:'抗重力肌使用刺激减少，主要属于肌肉去适应。'},
      {t:'骨矿物质减少',h:'通常依靠测量发现，不一定立即产生不适。',s:'bone',why:'承重刺激减少会改变骨重建平衡，这是骨组织的可测表现。'},
      {t:'骨代谢相关的尿钙增加',h:'这是检测指标，不是凭感觉报告的症状。',s:'bone',why:'它与骨组织释放矿物质有关，主要归入骨骼系统。'}
    ];
    const names={fluid:'体液分布',balance:'前庭与平衡',muscle:'肌肉',bone:'骨骼'};
    let state;
    const $=id=>document.getElementById(id), branches=[...document.querySelectorAll('.branch')];
    function fresh(){return {i:0,wrong:0,placed:{fluid:[],balance:[],muscle:[],bone:[]}}}
    function render(){
      const done=state.i===cases.length, c=cases[Math.min(state.i,cases.length-1)];
      document.querySelector('.diagnostic').classList.toggle('complete',done);
      $('cardTitle').textContent=done?'分类完成':c.t;
      $('cardHint').textContent=done?'同一微重力环境，会引发多套系统响应。':c.h;
      $('progress').textContent=done?'多系统响应':(state.i?'继续判断':'开始分类');
      $('stateLabel').textContent=done?'分类完成':'待判断';
      $('card').draggable=!done; $('card').setAttribute('aria-disabled',done);
      branches.forEach(b=>{const a=state.placed[b.dataset.system];b.dataset.empty=!a.length;b.querySelector('.locked').textContent=a.length?a.join('、'):'尚未归入表现'});
    }
    function choose(system){
      if(state.i>=cases.length)return; const c=cases[state.i];
      if(system===c.s){state.placed[system].push(c.t);state.i++;state.wrong=0;$('feedbackMark').textContent='✓';$('feedbackTitle').textContent=c.t+' → '+names[system];$('feedbackText').textContent=c.why;if(state.i===cases.length){$('feedbackTitle').textContent='同一微重力环境 → 多系统响应';$('feedbackText').textContent='这些变化不能用一个笼统的“失重症状”解释。分类表示主要归属，不表示系统彼此隔绝。'}}
      else{state.wrong++;$('feedbackMark').textContent='↺';$('feedbackTitle').textContent='需要复核';$('feedbackText').textContent=state.wrong>1?'比较两类候选：'+names[c.s]+'的机制，或'+names[system]+'的机制。再根据卡面线索选择。':'比较四类机制：体液位置、方向信息、使用负荷、骨重建。'}
      render();
    }
    branches.forEach(b=>{b.addEventListener('click',()=>choose(b.dataset.system));b.addEventListener('dragover',e=>{e.preventDefault();b.classList.add('dragover')});b.addEventListener('dragleave',()=>b.classList.remove('dragover'));b.addEventListener('drop',e=>{e.preventDefault();b.classList.remove('dragover');choose(b.dataset.system)})});
    $('card').addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain','symptom'));
    $('card').addEventListener('keydown',e=>{if(e.key==='Enter'&&state.i<cases.length){branches[0].focus()}});
    $('reset').addEventListener('click',()=>{state=fresh();$('feedbackMark').textContent='?';$('feedbackTitle').textContent='先问：哪个系统的正常输入或负荷改变了？';$('feedbackText').textContent='分类指向主要系统；身体各系统仍会彼此影响。';render()});
    state=fresh();render();
  </script>
</body>
</html>
