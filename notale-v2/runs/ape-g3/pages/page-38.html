<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>半径与转速，怎样共同制造人工重力？</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-header__inner{width:100%;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px}.lec-header__identity{display:none}.lec-header__kicker,.lec-header__title,.lec-header__page{margin:0}.lec-footer__inner{width:100%;display:flex;align-items:center;gap:16px}.lec-footer__take-text{margin:0}
    .ag-page{height:620px;display:grid;grid-template-rows:76px 1fr 68px;gap:14px;min-height:0}
    .ag-process{gap:28px;height:76px}
    .ag-process>div{padding:10px 9px 8px;text-align:center;font-size:15px;line-height:1.4;font-weight:700;border-radius:10px}
    .ag-process>div::before{width:22px;height:22px;margin:0 auto 5px;font-size:14px}
    .ag-process>:not(:last-child)::after{left:calc(100% + 2px);width:24px;font-size:18px}
    .ag-main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;min-height:0}
    .ag-main>*{min-width:0;min-height:0}
    .ag-scene{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-lg);background:linear-gradient(145deg,#091425,#142a46);box-shadow:var(--shadow-raised)}
    .ag-scene canvas{display:block;width:100%;height:100%}
    .scene-label{position:absolute;padding:5px 9px;border:1px solid rgb(255 255 255 / 25%);border-radius:7px;background:rgb(9 20 37 / 78%);color:#f5f9ff;font-size:14px;line-height:1.4;pointer-events:none}
    .lab-radius{left:18px;bottom:18px}.lab-tangent{right:20px;top:20px}.lab-center{left:20px;top:20px}.lab-effective{right:20px;bottom:18px;color:#b9dcff}
    .drag-hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);color:#dbeaff;font-size:14px;white-space:nowrap}
    .ag-side{display:flex;flex-direction:column;gap:12px}
    .ag-readouts{padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
    .ag-readouts span{font-size:15px;line-height:1.4;color:var(--muted)}
    .ag-readouts output{min-width:138px;padding:4px 8px;font-size:16px}
    .ag-controls{padding:14px 18px;display:flex;flex-direction:column;gap:7px}
    .ag-controls .ctl{min-height:40px}.ag-controls output{min-width:78px;padding:3px 7px;font-size:15px}
    .target-row{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center;font-size:15px;font-weight:650}
    .target-row select{width:100%;padding:5px 8px}
    .ghost{padding:9px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent-strong);font-size:16px;line-height:1.4}
    .match{font-weight:750;color:var(--success)}
    .ag-bottom{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:center}
    .ag-bottom p{margin:0;font-size:16px;line-height:1.45}
    .formula{padding:9px 16px;border-left:4px solid var(--accent);background:var(--surface);font-size:18px;font-weight:750}
    .accent{color:var(--accent-strong)}
  </style>
</head>
<body data-page="38" data-total="48">
  <div id="stage">
    <main class="ag-page">
      <section class="k-process ag-process" aria-label="人工重力的因果过程">
        <div data-state="done">设定半径</div><div data-state="done">舱壁旋转</div><div data-state="current">获得切向速度</div><div>需要向心加速度</div><div>地板持续推脚</div><div>形成有效重力</div>
      </section>
      <section class="ag-main">
        <div class="ag-scene no-pan" id="scene" aria-label="旋转人工重力舱三维剖面。拖动外圈改变半径，拖动中心旋钮改变转速。">
          <div class="scene-label lab-center">中心轴</div><div class="scene-label lab-tangent">切向速度 v</div>
          <div class="scene-label lab-radius">半径 r：中心 → 地板</div><div class="scene-label lab-effective">有效重力提示：朝外圈</div>
          <div class="drag-hint">拖外圈调半径 · 拖中心旋钮调转速</div>
        </div>
        <aside class="ag-side">
          <div class="panel ag-readouts" aria-live="polite">
            <span>半径 r</span><output id="rOut"></output><span>转速</span><output id="rpmOut"></output>
            <span>线速度 v</span><output id="vOut"></output><span>向心加速度 a</span><output id="aOut"></output>
            <span>相对地球重力</span><output id="gOut"></output><span>当前判断</span><strong id="match">连续设计空间</strong>
          </div>
          <div class="panel ag-controls">
            <div class="ctl"><label for="radius">半径</label><input id="radius" type="range"><output id="rMini"></output></div>
            <div class="ctl"><label for="rpm">转速</label><input id="rpm" type="range"><output id="rpmMini"></output></div>
            <div class="target-row"><label for="target">目标刻度</label><select id="target"><option value="earth">地球</option><option value="mars">火星</option><option value="moon">月球</option></select></div>
            <div class="ghost" id="ghost"></div>
          </div>
        </aside>
      </section>
      <section class="ag-bottom">
        <p>旋转没有产生新的真实重力场。<span class="accent">舱壁持续让身体转弯</span>，脚下才出现向外的有效重力感受。</p>
        <div class="formula">a = v²/r = ω²r　同一目标：半径越大，所需转速越低</div>
      </section>
    </main>
  </div>
  <script src="assets/lib/three.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:38,kicker:'ROTATION → EFFECTIVE GRAVITY',title:'半径与转速，怎样共同制造人工重力？',take:'旋转可制造向外的有效重力，但半径与转速会带来新权衡'});
    document.documentElement.classList.remove('lec-root');
    document.body.classList.remove('lec-page');
    Deck.init({index:38,total:48});

    const K=Lec.K,P=Lec.P;
    const radius=document.querySelector('#radius'),rpm=document.querySelector('#rpm'),target=document.querySelector('#target');
    const ag={rMin:K.artificialGravityRadiusMin??5,rMax:K.artificialGravityRadiusMax??50,rDefault:K.artificialGravityDefaultRadius??20,rpmMin:K.artificialGravityRpmMin??0,rpmMax:K.artificialGravityRpmMax??8,rpmDefault:K.artificialGravityDefaultRpm??4,tolerance:K.artificialGravityTargetTolerance??0.08};
    radius.min=ag.rMin; radius.max=ag.rMax; radius.step=(radius.max-radius.min)/100; radius.value=ag.rDefault;
    rpm.min=ag.rpmMin; rpm.max=ag.rpmMax; rpm.step=(rpm.max-rpm.min)/100; rpm.value=ag.rpmDefault;
    const sceneEl=document.querySelector('#scene');
    const scene=new THREE.Scene(); scene.background=new THREE.Color(0x091425);
    const camera=new THREE.PerspectiveCamera(38,1,.1,100); camera.position.set(0,-8,13); camera.lookAt(0,0,0);
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false}); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.setPixelRatio(Math.min(devicePixelRatio,2)); sceneEl.prepend(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xcfe5ff,0x152033,2.3)); const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(5,-4,8);scene.add(key);
    const rig=new THREE.Group(); rig.rotation.x=.28; scene.add(rig);
    const metal=new THREE.MeshStandardMaterial({color:0x86a3bd,metalness:.7,roughness:.28});
    const blue=new THREE.MeshStandardMaterial({color:0x208cff,emissive:0x06294e,metalness:.25,roughness:.35});
    const orange=new THREE.MeshStandardMaterial({color:0xe28535,emissive:0x3d1705,roughness:.42});
    const ring=new THREE.Mesh(new THREE.TorusGeometry(4,.34,20,96),metal);rig.add(ring);
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,1.4,32),blue);hub.rotation.x=Math.PI/2;rig.add(hub);
    const spokes=new THREE.Group();rig.add(spokes);for(let i=0;i<6;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(.1,4,.1),metal);s.position.y=2;s.rotation.z=i*Math.PI/3;spokes.add(s)}
    const person=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.18,.75,5,10),orange);body.position.y=3.35;person.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.25,18,12),orange);head.position.y=2.65;person.add(head);rig.add(person);
    const radial=new THREE.ArrowHelper(new THREE.Vector3(0,-1,0),new THREE.Vector3(0,3.1,0),2.1,0x42a5ff,.28,.15);rig.add(radial);
    const tangent=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(0,4.25,0),1.7,0xf29a49,.28,.15);rig.add(tangent);
    const outward=new THREE.ArrowHelper(new THREE.Vector3(0,1,0),new THREE.Vector3(0,3.75,0),.85,0xb9dcff,.22,.12);rig.add(outward);
    const radiusLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,.12),new THREE.Vector3(0,4,.12)]),new THREE.LineBasicMaterial({color:0xffffff}));rig.add(radiusLine);
    const targets={earth:K.earth.surfaceGravity,mars:K.mars.surfaceGravity,moon:K.moon.surfaceGravity};
    function fmt(n,d=2){return P.formatNumber(n,{maximumFractionDigits:d})}
    function update(){
      const r=+radius.value, rp=+rpm.value, w=rp*2*Math.PI/60;
      const v=P.rotationLinearVelocity?P.rotationLinearVelocity(r,w):w*r;
      const a=P.centripetalAcceleration(v,r), scale=2.7+2.3*(r-radius.min)/(radius.max-radius.min);
      ring.scale.setScalar(scale/4); spokes.scale.setScalar(scale/4); person.position.y=scale-4; person.scale.setScalar(.9);
      radial.position.y=scale-.9; radial.setLength(Math.min(2.4,.6+a*.12),.28,.15); tangent.position.y=scale+.25;tangent.setLength(Math.min(2.4,.55+v*.06),.28,.15);outward.position.y=scale-.3;outward.setLength(Math.min(1.25,.25+a*.06),.22,.12);outward.visible=a>.02;
      radiusLine.geometry.setFromPoints([new THREE.Vector3(0,0,.12),new THREE.Vector3(0,scale,.12)]);
      rOut.textContent=P.formatDistance(r);rpmOut.textContent=fmt(rp)+' rpm';vOut.textContent=fmt(v)+' m/s';aOut.textContent=fmt(a)+' m/s²';gOut.textContent=fmt(a/K.earth.surfaceGravity)+' g';rMini.textContent=P.formatDistance(r);rpmMini.textContent=fmt(rp)+' rpm';
      const names={earth:'地球',mars:'火星',moon:'月球'}, t=targets[target.value], need=Math.sqrt(t/r)*60/(2*Math.PI);
      ghost.textContent='维持'+names[target.value]+'重力：需 '+fmt(need)+' rpm';
      let near='连续设计空间'; for(const k of Object.keys(targets)){if(Math.abs(a-targets[k])/targets[k]<=ag.tolerance)near='接近'+names[k]+'表面重力'} match.textContent=near;match.className=near==='连续设计空间'?'':'match';
      renderer.render(scene,camera);
    }
    function resize(){const w=sceneEl.clientWidth,h=sceneEl.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();update()} Deck.onResize(resize);resize();
    [radius,rpm,target].forEach(el=>el.addEventListener('input',update));
    let drag=null,last={x:0,y:0};sceneEl.addEventListener('pointerdown',e=>{const p=Deck.pt(sceneEl,e);last=p;drag=Math.hypot(p.x-sceneEl.offsetWidth/2,p.y-sceneEl.offsetHeight/2)<90?'rpm':'radius';sceneEl.setPointerCapture(e.pointerId)});
    sceneEl.addEventListener('pointermove',e=>{if(!drag)return;const p=Deck.pt(sceneEl,e),el=drag==='rpm'?rpm:radius,delta=drag==='rpm'?(last.y-p.y):(p.x-last.x);el.value=Deck.clamp(+el.value+delta*(el.max-el.min)/420,+el.min,+el.max);last=p;update()});
    sceneEl.addEventListener('pointerup',()=>drag=null);sceneEl.addEventListener('pointercancel',()=>drag=null);
    Deck.loop((t,dt)=>{if(!Deck.reduced())rig.rotation.z-=dt*(+rpm.value)*.035;renderer.render(scene,camera)},{still:1});
  </script>
</body>
</html>
