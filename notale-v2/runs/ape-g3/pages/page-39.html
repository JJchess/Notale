<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>消息以光速前进，决定却不能总等回地球</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-page>#stage{transform:translate(-50%,calc(-50% - 96px)) scale(var(--s))!important}
    .lec-footer{transform:translateY(-96px)}
    .signal-page{width:var(--content-w);height:var(--content-h);position:absolute;z-index:2;top:var(--header-h);left:96px;display:grid;grid-template-rows:58px 1fr 56px;gap:12px;min-width:0;min-height:0;box-sizing:border-box}
    .console{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:8px 18px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow-panel)}
    .console-title{display:flex;align-items:center;gap:12px;font-weight:760}.earth-dot{width:28px;height:28px;border-radius:50%;background:var(--accent);box-shadow:inset -7px -4px 0 rgb(7 87 170 / 55%)}
    .controls{display:flex;align-items:center;gap:14px}.controls .ctl{min-height:40px}.controls select{padding-inline:10px}.controls button{min-width:154px}
    .compare{--comparison-cols:2;grid-template-columns:154px repeat(2,minmax(0,1fr));grid-template-rows:46px 156px 58px 58px 92px;height:100%}
    .compare>div{display:flex;align-items:center}.compare [data-axis]{font-size:var(--fs-label)}
    .head{justify-content:space-between;gap:12px}.head small{font-size:var(--fs-label);color:var(--muted);font-weight:600}
    .timeline-cell{display:block!important;padding:14px 18px!important;position:relative}.track{position:relative;height:76px;margin-top:6px}.rail{position:absolute;left:34px;right:34px;top:35px;height:3px;background:var(--line-strong)}
    .rail:after{content:"//";position:absolute;left:50%;top:-17px;padding:0 5px;background:var(--surface);color:var(--muted);font-weight:800;transform:translateX(-50%) rotate(-12deg)}
    [data-diff] .rail:after{background:var(--accent-soft)}.node{position:absolute;top:17px;width:38px;height:38px;border:2px solid var(--line-strong);border-radius:50%;display:grid;place-items:center;background:var(--surface);font-size:20px}.node.start{left:14px}.node.end{right:14px}
    .pulse{position:absolute;z-index:2;left:52px;top:27px;width:18px;height:18px;border-radius:50%;opacity:0;background:var(--warning);box-shadow:0 0 0 7px rgb(164 92 0 / 15%)}.pulse.return{background:var(--accent);box-shadow:0 0 0 7px rgb(11 115 224 / 15%)}
    .steps{display:flex;justify-content:space-between;color:var(--muted);font-size:var(--fs-label);line-height:var(--lh-label)}.steps span.active{color:var(--text);font-weight:760}
    .metric{justify-content:space-between;gap:14px}.metric output{min-width:148px}.distance-note{display:block;font-size:var(--fs-label);color:var(--muted);line-height:var(--lh-label)}
    .outcome{font-size:var(--fs-sec);line-height:var(--lh-sec);align-items:flex-start!important}.mars-ctl{padding:6px 0 0}.mars-ctl .ctl{min-height:34px}.mars-ctl input{width:180px}.status{font-weight:720;color:var(--muted)}.status.live{color:var(--warning)}.status.done{color:var(--success)}
    .bottom{display:flex;align-items:center;justify-content:space-between;gap:24px}.take{font-size:var(--fs-body);line-height:var(--lh-body);font-weight:720}.note{white-space:nowrap}
  </style>
</head>
<body data-page="39" data-total="48">
  <div id="stage">
    <main class="signal-page">
      <section class="console" aria-label="地球控制台">
        <div class="console-title"><span class="earth-dot" aria-hidden="true"></span><span>地球控制台</span><span class="status" id="status" aria-live="polite">等待发送</span></div>
        <div class="controls">
          <div class="ctl"><label for="target">目的地</label><select id="target"><option value="moon">月球</option><option value="mars">火星</option></select></div>
          <div class="ctl"><label for="speed">压缩播放</label><select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></div>
          <button id="send" data-primary>发送：前进并回报</button>
        </div>
      </section>

      <section class="k-comparison compare" aria-label="地月与地火通信延迟比较">
        <div data-axis></div><div data-heading class="head">地球 ↔ 月球 <small id="moonState">尚未发送</small></div><div data-heading data-diff class="head">地球 ↔ 火星 <small id="marsState">尚未发送</small></div>
        <div data-axis>同一事件顺序</div>
        <div class="timeline-cell" id="moonTimeline"><div class="steps"><span>发出指令</span><span>信号抵达</span><span>当地执行</span><span>回报抵达</span></div><div class="track"><div class="rail"></div><div class="node start" aria-hidden="true">地</div><div class="node end" aria-hidden="true">月</div><div class="pulse go"></div><div class="pulse return"></div></div></div>
        <div class="timeline-cell" data-diff id="marsTimeline"><div class="steps"><span>发出指令</span><span>信号抵达</span><span>当地执行</span><span>回报抵达</span></div><div class="track"><div class="rail"></div><div class="node start" aria-hidden="true">地</div><div class="node end" aria-hidden="true">火</div><div class="pulse go"></div><div class="pulse return"></div></div></div>
        <div data-axis>距离</div><div class="metric"><span><strong id="moonDistance"></strong><small class="distance-note">平均距离，真实距离会变化</small></span></div><div data-diff class="metric"><span><strong id="marsDistance"></strong><small class="distance-note">平均圆轨道尺度示意</small></span><div class="mars-ctl ctl"><label for="angle">轨道位置</label><input id="angle" type="range" aria-label="地球与火星轨道夹角"></div></div>
        <div data-axis>单程等待</div><div class="metric"><span>指令抵达</span><output id="moonOne"></output></div><div data-diff class="metric"><span>指令抵达</span><output id="marsOne"></output></div>
        <div data-axis>一次问答</div><div class="metric"><span>去程＋回程</span><output id="moonRound"></output></div><div data-diff class="metric"><span>去程＋回程</span><output id="marsRound"></output></div>
        <div data-axis>操作后果</div><div class="outcome">可逐步“前进—观察—修正”，但每一步仍要等待。</div><div data-diff class="outcome">逐动作遥控会被漫长反馈打断；现场要按预先规则判断下一步。</div>
      </section>

      <div class="bottom"><div class="take">光速很快，却不是无限快；距离一大，等待就会进入任务本身。</div><div class="note" title="真空光速由讲义统一常量计算">未计入设备处理、排队与人为反应时间</div></div>
    </main>
  </div>
  <script src="assets/lib/gsap.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({ index: 39, kicker: 'SIGNAL DELAY', title: '消息以光速前进，决定却不能总等回地球', take: '光速延迟使远程控制逐渐让位于本地判断' });
    Deck.init({ index: 39, total: 48 });

    const $ = id => document.getElementById(id);
    const moonSignal = Lec.P.earthMoonSignal();
    const angle = $('angle');
    angle.min = Lec.K.earthMarsSignalAngleMin;
    angle.max = Lec.K.earthMarsSignalAngleMax;
    angle.value = Lec.K.earthMarsSignalAngleDefault;
    angle.step = (Number(angle.max) - Number(angle.min)) / 100;
    let marsDistance = 0, activeTimeline = null;

    function earthMarsDistance(theta){
      if (Lec.P.earthMarsDistanceAtAngle) return Lec.P.earthMarsDistanceAtAngle(theta);
      const a=Lec.K.astronomicalUnit, b=Lec.K.marsMeanOrbitalRadius, r=theta*Math.PI/180;
      return Math.sqrt(a*a+b*b-2*a*b*Math.cos(r));
    }
    function update(){
      marsDistance = earthMarsDistance(Number(angle.value));
      $('moonDistance').textContent = Lec.P.formatDistance(Lec.K.earthMoonMeanDistance);
      $('moonOne').textContent = Lec.P.formatDuration(moonSignal.oneWaySeconds);
      $('moonRound').textContent = Lec.P.formatDuration(moonSignal.roundTripSeconds);
      $('marsDistance').textContent = Lec.P.formatDistance(marsDistance);
      $('marsOne').textContent = Lec.P.formatDuration(Lec.P.lightTravelTime(marsDistance));
      $('marsRound').textContent = Lec.P.formatDuration(Lec.P.roundTripSignalDelay(marsDistance));
    }
    angle.addEventListener('input', update); update();

    function send(){
      if(activeTimeline) return;
      const key=$('target').value, root=$(key+'Timeline'), state=$(key+'State');
      const one=key==='moon'?moonSignal.oneWaySeconds:Lec.P.lightTravelTime(marsDistance);
      const total=key==='moon'?moonSignal.roundTripSeconds:Lec.P.roundTripSignalDelay(marsDistance);
      const factor=Number($('speed').value), duration=4/factor;
      const go=root.querySelector('.go'), back=root.querySelector('.return'), labels=root.querySelectorAll('.steps span');
      $('send').disabled=true; angle.disabled=true; $('target').disabled=true;
      $('status').className='status live'; $('status').textContent='真实模拟时间：'+Lec.P.formatDuration(0);
      state.textContent='传播中';
      gsap.set([go,back],{xPercent:0,opacity:0}); labels.forEach(x=>x.classList.remove('active'));
      const reduced=Deck.reduced();
      activeTimeline=gsap.timeline({defaults:{ease:'power2.inOut'},onUpdate(){
        const elapsed=total*this.progress(); $('status').textContent='真实模拟时间：'+Lec.P.formatDuration(elapsed);
      },onComplete(){
        labels.forEach(x=>x.classList.add('active')); state.textContent='问答完成'; $('status').className='status done'; $('status').textContent='回报已抵达：'+Lec.P.formatDuration(total);
        $('send').disabled=false; angle.disabled=false; $('target').disabled=false; activeTimeline=null;
      }});
      activeTimeline.addLabel('out',0).set(go,{opacity:1}).to(go,{x:root.clientWidth-122,duration:reduced?0:duration/2},'out').addLabel('execute').set(labels[1],{className:'+=active'}).set(labels[2],{className:'+=active'}).set(go,{opacity:0}).set(back,{opacity:1,x:root.clientWidth-122}).to(back,{x:0,duration:reduced?0:duration/2}).set(back,{opacity:0});
    }
    $('send').addEventListener('click',send);
  </script>
</body>
</html>
