<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>守住比抵达更难</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    body.lec-page{position:fixed;inset:0;width:1600px;height:900px}
    #stage{position:fixed}
    .lec-header>div{display:flex;width:100%;align-items:center;gap:24px}.lec-header>div>p{margin:0}.lec-header>div>div:last-child{margin-left:auto}
    .page42{height:620px;display:grid;grid-template-rows:138px 466px;gap:16px}
    .principles{height:138px}
    .principles.k-generalization{grid-template-columns:minmax(0,1fr) 280px minmax(0,1fr);gap:32px}
    .principles.k-generalization::before,.principles.k-generalization::after{width:calc(50% - 140px);border-top-color:var(--accent)}
    .principles.k-generalization>[data-claim]{padding:16px;border-radius:0;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
    .principles.k-generalization>[data-branch]{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .principles.k-generalization>[data-branch]>*{padding:12px 14px;border-radius:0;font-size:16px;line-height:1.35;font-weight:720;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);transition:background .22s ease,border-color .22s ease,transform .22s ease}
    .principles [data-key].active{background:var(--success-soft);border-color:var(--success);transform:translateY(-2px)}
    .claim-title{font-size:22px;font-weight:800;line-height:1.28}.claim-sub{font-size:16px;line-height:1.5;color:var(--muted);margin-top:4px}
    .game{display:grid;grid-template-columns:430px 530px 416px;gap:16px;min-height:0}
    .game>*{min-width:0;min-height:0}
    .cut{border-radius:0;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
    .event,.network,.record{box-sizing:border-box;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-panel);padding:18px}
    .eyebrow{font-size:15px;line-height:1.4;color:var(--accent-strong);font-weight:800;letter-spacing:.08em}
    .event h2{margin:5px 0 4px}.symptom{font-size:16px;line-height:1.5;color:var(--muted);min-height:48px;margin:0 0 10px}
    .choices{display:grid;gap:8px}.choice{position:relative;display:block}.choice input{position:absolute;opacity:0}.choice span{display:flex;align-items:center;min-height:54px;box-sizing:border-box;padding:8px 12px;border:1px solid var(--line-strong);background:var(--surface-soft);font-size:15px;line-height:1.4;font-weight:650;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
    .choice input:checked+span{border:2px solid var(--accent);background:var(--accent-soft)}.choice input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
    .confirm{width:100%;margin-top:10px;border-radius:0;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
    .feedback{min-height:48px;margin-top:8px;font-size:16px;line-height:1.5;color:var(--muted)}
    .network{position:relative}.network-head{display:flex;justify-content:space-between;align-items:center}.network-head h2{font-size:22px}.event-count{font-size:15px;color:var(--muted)}
    .net{position:relative;height:350px;margin-top:10px;background:radial-gradient(circle at center,var(--accent-soft),transparent 58%)}
    .net svg{position:absolute;inset:0;width:100%;height:100%}.net line{stroke:var(--line-strong);stroke-width:3;transition:stroke .22s ease,stroke-width .22s ease}.net line.hot{stroke:var(--danger);stroke-width:6}
    .node{position:absolute;width:92px;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--line-strong);background:var(--surface);font-size:16px;font-weight:800;line-height:1.25;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:background .22s ease,border-color .22s ease,transform .22s ease}.node small{font-size:14px;line-height:1.35;font-weight:650}.node[data-s="稳定"]{border-color:var(--success);background:var(--success-soft)}.node[data-s="吃紧"]{border-color:var(--warning);background:var(--warning-soft)}.node[data-s="危险"],.node[data-s="中断"]{border-color:var(--danger);background:var(--danger-soft)}.node.hot{transform:scale(1.06)}
    #air{left:201px;top:6px}#water{left:30px;top:116px}#food{right:30px;top:116px}#waste{left:98px;bottom:16px}#energy{right:98px;bottom:16px}
    .bottomline{display:flex;justify-content:center;gap:20px;font-size:15px;color:var(--muted)}.bottomline strong{color:var(--text)}
    .record h2{margin-bottom:10px}.log{display:grid;gap:8px}.log-row{padding:9px 10px;border-left:4px solid var(--line);background:var(--surface-soft);font-size:15px;line-height:1.4}.log-row b{display:block;color:var(--accent-strong)}
    .reserve{margin-top:12px;padding:12px;border:1px solid var(--line);font-size:16px;line-height:1.5}.reserve strong{display:block}.result{margin-top:12px;padding:12px;background:var(--accent-soft);font-size:16px;line-height:1.5;font-weight:700}
    @media (prefers-reduced-motion:reduce){.principles [data-key],.net line,.node{transition:none!important}}
  </style>
</head>
<body data-page="42" data-total="48">
  <div id="stage">
    <main class="page42">
      <section class="k-generalization principles" aria-label="栖息地稳定的四条支撑">
        <div data-branch="left"><div data-key="couple">看见耦合</div><div data-key="baseline">先保底线</div></div>
        <div data-claim><div class="claim-title">栖息地稳定</div><div class="claim-sub">持续诊断、取舍与修复</div></div>
        <div data-branch="right"><div data-key="isolate">隔离故障</div><div data-key="reserve">恢复余量</div></div>
      </section>
      <section class="game" aria-label="火星栖息地故障管理游戏">
        <form class="event cut" id="eventForm">
          <div class="eyebrow" id="eventTag">事件 1 / 4</div><h2 id="eventTitle">供电支路过载</h2>
          <p class="symptom" id="symptom">能量警报同时牵动空气循环与水处理。</p>
          <div class="choices" id="choices"></div>
          <button class="confirm" id="confirm" type="submit" data-primary>确认处置</button>
          <div class="feedback" id="feedback" aria-live="polite">每轮只能执行一项处置。先判断故障会沿哪些依赖传播。</div>
        </form>
        <section class="network cut">
          <div class="network-head"><h2>生命支持环</h2><span class="event-count" id="phase">等待处置</span></div>
          <div class="net" aria-label="空气、水、食物、废物与能量的耦合网络">
            <svg viewBox="0 0 494 350" aria-hidden="true"><line data-edge="energy-air" x1="345" y1="300" x2="247" y2="39"/><line data-edge="energy-water" x1="345" y1="300" x2="76" y2="149"/><line data-edge="energy-food" x1="345" y1="300" x2="418" y2="149"/><line data-edge="water-waste" x1="76" y1="149" x2="144" y2="301"/><line data-edge="waste-water" x1="144" y1="301" x2="76" y2="149"/><line data-edge="water-food" x1="76" y1="149" x2="418" y2="149"/></svg>
            <div class="node" id="air"><span>空气</span><small>稳定</small></div><div class="node" id="water"><span>水</span><small>稳定</small></div><div class="node" id="food"><span>食物</span><small>稳定</small></div><div class="node" id="waste"><span>废物</span><small>稳定</small></div><div class="node" id="energy"><span>能量</span><small>稳定</small></div>
          </div>
          <div class="bottomline"><span>运行底线：<strong id="airLine">空气稳定</strong></span><span><strong id="energyLine">能量稳定</strong></span></div>
        </section>
        <aside class="record cut"><h2>维护记录</h2><div class="log" id="log"><div class="log-row">尚未确认处置。</div></div><div class="reserve"><strong>备用路径</strong><span id="reserveText">可用，尚未消耗</span></div><div class="result" id="result">目标：守住空气与能量，并在结局恢复至少一处余量。</div></aside>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:42,kicker:'SYSTEMS UNDER STRESS',title:'守住比抵达更难',take:'太空定居首先是维持脆弱系统，而不是插旗和扩张地图。'});
    Deck.init({index:42,total:48});
    const events=[
      {title:'供电支路过载',symptom:'能量警报同时牵动空气循环与水处理。',choices:['暂停非关键负载，再隔离过载支路','继续全负载运行，等待警报消失','只关闭最响的空气警报'],correct:0,principles:['couple','baseline','isolate'],states:{energy:'吃紧',water:'吃紧'},edges:['energy-air','energy-water'],ok:'保住空气循环，并阻止过载继续扩散。'},
      {title:'水处理回路污染',symptom:'污染可能经回路扩散，废物开始积压。',choices:['隔离污染支路，启用备用储水','让污染水继续循环以维持流量','关闭空气循环，把能量全给水处理'],correct:0,principles:['couple','isolate'],states:{water:'吃紧',waste:'吃紧'},edges:['water-waste','waste-water'],ok:'局部降级换来隔离，污染没有进入其他支路。'},
      {title:'废物处理堵塞',symptom:'不显眼的积压正在增加水回收负担。',choices:['降低非关键用水，疏通并检查水回收','暂时忽略废物节点','把全部能量转给堵塞支路'],correct:0,principles:['couple','baseline'],states:{waste:'吃紧',water:'吃紧'},edges:['waste-water'],ok:'处理积压，同时没有夺走空气循环所需能量。'},
      {title:'温室与空气争用能量',symptom:'温室照明满载时，空气循环的供能余量不足。',choices:['先维持空气，让温室降级并安排恢复','保持温室满负载','永久关闭温室，宣告问题解决'],correct:0,principles:['baseline','reserve'],states:{food:'吃紧',energy:'吃紧'},edges:['energy-air','energy-food'],ok:'紧急时先守空气，随后恢复温室与备用余量。'}
    ];
    const initial=()=>({index:0,status:{air:'稳定',water:'稳定',food:'稳定',waste:'稳定',energy:'稳定'},reserve:true,trace:[],ended:false});
    let state=initial();
    const ids=['air','water','food','waste','energy'];
    const form=document.querySelector('#eventForm'), choices=document.querySelector('#choices'), feedback=document.querySelector('#feedback');
    function render(){
      const ev=events[state.index]||events[events.length-1];
      document.querySelector('#eventTag').textContent=state.ended?'本轮结束':`事件 ${state.index+1} / 4`;
      document.querySelector('#eventTitle').textContent=state.ended?(state.trace.every(x=>x.correct)?'栖息地保持运行':'级联失效'):ev.title;
      document.querySelector('#symptom').textContent=state.ended?'事件结束后，关键功能与系统余量共同决定结果。':ev.symptom;
      choices.innerHTML=state.ended?'':ev.choices.map((x,i)=>`<label class="choice"><input type="radio" name="action" value="${i}" ${i===0?'checked':''}><span>${x}</span></label>`).join('');
      const btn=document.querySelector('#confirm');btn.textContent=state.ended?'整轮重置':'确认处置';
      ids.forEach(id=>{const el=document.querySelector('#'+id),s=state.status[id];el.dataset.s=s;el.querySelector('small').textContent=s;});
      document.querySelector('#airLine').textContent='空气'+state.status.air;document.querySelector('#energyLine').textContent='能量'+state.status.energy;
      document.querySelector('#reserveText').textContent=state.reserve?'可用，能够应对下一次故障':'已耗尽，系统没有恢复余量';
      document.querySelector('#phase').textContent=state.ended?'结局判定':'等待处置';
      document.querySelectorAll('[data-key]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('line').forEach(x=>x.classList.remove('hot'));document.querySelectorAll('.node').forEach(x=>x.classList.remove('hot'));
      document.querySelector('#log').innerHTML=state.trace.length?state.trace.map((x,i)=>`<div class="log-row"><b>事件 ${i+1} · ${x.correct?'已控制':'失守'}</b>${x.note}</div>`).join(''):'<div class="log-row">尚未确认处置。</div>';
    }
    function finish(win,note){state.ended=true;feedback.textContent=note;document.querySelector('#result').textContent=win?'成功：底线未中断，且备用路径已恢复。':'失败：最早忽略的依赖已经触发级联。可重置后比较另一种处置。';render();feedback.textContent=note;}
    form.addEventListener('submit',e=>{e.preventDefault();if(state.ended){state=initial();feedback.textContent='系统已回到第一张故障卡。';document.querySelector('#result').textContent='目标：守住空气与能量，并在结局恢复至少一处余量。';render();return;}
      const ev=events[state.index],pick=Number(new FormData(form).get('action')),correct=pick===ev.correct;
      ev.principles.forEach(k=>document.querySelector(`[data-key="${k}"]`).classList.add('active'));ev.edges.forEach(k=>document.querySelector(`[data-edge="${k}"]`).classList.add('hot'));
      if(correct){Object.assign(state.status,ev.states);state.trace.push({correct:true,note:ev.ok});feedback.textContent=ev.ok;Object.keys(ev.states).forEach(k=>document.querySelector('#'+k).classList.add('hot'));if(state.index===3){state.status={air:'稳定',water:'稳定',food:'吃紧',waste:'稳定',energy:'稳定'};state.reserve=true;setTimeout(()=>finish(true,'四次处置都守住底线，并恢复了一条备用路径。'),Deck.reduced()?0:360);return;}state.index++;setTimeout(render,Deck.reduced()?0:520);
      }else{state.trace.push({correct:false,note:state.index===0?'供能异常继续牵连空气与水。':state.index===1?'污染未被隔离，沿回路继续传播。':state.index===2?'积压返回水回收，并挤占关键供能。':'空气供能底线被次要负载挤占。'});state.status.air=state.index===0||state.index===3?'中断':'危险';state.status.energy=state.index===2?'中断':'危险';state.reserve=false;setTimeout(()=>finish(false,state.trace.at(-1).note),Deck.reduced()?0:360);}
    });
    render();
  </script>
</body>
</html>
