<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>能做到，然后呢？</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{position:fixed;inset:0;transform:none!important}
    .lec-header{transform:translateY(-92px)}
    .lec-footer{transform:translateY(-96px)}
    .decision-bridge{
      position:relative;
      width:100%;
      height:100%;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding:var(--sp-6) 0 var(--sp-5);
    }
    .bridge-lead{
      width:920px;
      margin:0 auto var(--sp-7);
      color:var(--text);
      font-size:var(--fs-lead);
      line-height:var(--lh-lead);
      text-align:center;
    }
    .bridge-lead strong{color:var(--accent-strong);font-weight:800}
    .flow-wrap{position:relative}
    .decision-flow.k-process{
      position:relative;
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:86px;
      align-items:center;
      min-height:268px;
      padding:0 10px;
    }
    .decision-flow.k-process::before{
      content:"";
      position:absolute;
      z-index:0;
      top:134px;
      left:62px;
      right:62px;
      height:4px;
      background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 47%,transparent 47%,transparent 53%,var(--warning) 53%,var(--warning) 100%);
    }
    .decision-flow.k-process > .step{
      position:relative;
      z-index:1;
      min-width:0;
      height:202px;
      box-sizing:border-box;
      padding:var(--sp-5) var(--sp-4);
      border:1px solid var(--line);
      border-radius:var(--radius-md);
      background:var(--surface);
      box-shadow:var(--shadow-panel);
      text-align:center;
    }
    .decision-flow.k-process > .step::before{
      margin:0 auto var(--sp-3);
      background:var(--accent);
      color:#fff;
    }
    .decision-flow.k-process > .step:nth-child(n+3){border-color:rgb(164 92 0 / 42%)}
    .decision-flow.k-process > .step:nth-child(n+3)::before{background:var(--warning)}
    .decision-flow.k-process > .step::after{
      content:attr(data-link);
      position:absolute;
      top:82px;
      left:calc(100% + 7px);
      width:72px;
      color:var(--muted);
      font-size:var(--fs-label);
      font-weight:700;
      line-height:var(--lh-label);
      text-align:center;
    }
    .decision-flow.k-process > .step:last-child::after{display:none}
    .step h2{margin-bottom:var(--sp-3)}
    .step p{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .threshold{
      position:absolute;
      z-index:4;
      top:49px;
      left:50%;
      width:170px;
      transform:translateX(-50%);
      color:var(--warning);
      text-align:center;
      pointer-events:none;
    }
    .threshold span{
      display:inline-block;
      padding:var(--sp-1) var(--sp-3);
      background:var(--bg);
      font-size:var(--fs-label);
      font-weight:800;
      line-height:var(--lh-label);
    }
    .threshold b{
      display:block;
      margin-top:51px;
      color:var(--warning);
      font-size:34px;
      line-height:1;
      font-weight:800;
    }
    .bridge-close{
      width:1060px;
      margin:var(--sp-7) auto 0;
      color:var(--text);
      font-size:var(--fs-body);
      line-height:var(--lh-body);
      text-align:center;
    }
  </style>
</head>
<body data-page="43" data-total="48">
  <div id="stage">
    <main class="decision-bridge" aria-label="从技术可行到公共选择的四步过程">
      <p class="bridge-lead">最后一段距离，不是从地球到火星，而是从<strong>“能做”</strong>到<strong>“该怎么做”</strong>。</p>

      <div class="flow-wrap">
      <section class="decision-flow k-process" aria-label="决策门槛流程">
        <article class="step" data-link="所以具备能力">
          <h2>证明可行</h2>
          <p>能发射、能抵达、能维持系统吗？</p>
        </article>
        <article class="step" data-link="但不等于应该">
          <h2>看见后果</h2>
          <p>需要哪些资源？风险落在谁身上？</p>
        </article>
        <article class="step" data-link="经过审议才选择">
          <h2>提出公共问题</h2>
          <p>谁受益？谁出资？谁代表？什么目标优先？</p>
        </article>
        <article class="step">
          <h2>作出有理由的选择</h2>
          <p>说明依据、程序与责任。</p>
        </article>
      </section>
      <div class="threshold" aria-label="事实判断不能自动推出价值结论">
        <span>不能自动推出</span>
        <b aria-hidden="true">?</b>
      </div>
      </div>

      <p class="bridge-close">技术可以说明哪些方案可行，却不能替我们决定谁受益、谁承担风险，以及什么目标值得优先。</p>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 43,
      kicker: 'DECISION THRESHOLD',
      title: '能做到，然后呢？',
      take: '最后一段距离不是从地球到火星，而是从“能做”到“该怎么做”'
    });
    document.querySelector('.lec-page').appendChild(document.querySelector('.decision-bridge'));
    Deck.init({ index: 43, total: 48 });
  </script>
</body>
</html>
