<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>航天的价值落在谁身上？</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    html.lec-root{position:static;width:100%;height:100%;overflow:hidden}
    body.lec-page{position:relative;width:1600px;height:900px;overflow:hidden}
    .lec-header__inner{transform:translateY(4px)}
    .p44{position:absolute;left:96px;top:144px;width:1408px;height:620px;display:grid;grid-template-rows:58px minmax(0,1fr) 54px;gap:12px}
    .scene{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 4px}
    .scene p{margin:0;max-width:930px}.scenario{font-weight:750;color:var(--accent-strong)}
    .ledger{position:relative;display:grid;grid-template-columns:210px minmax(0,1fr) 236px;gap:12px;padding:12px;border-width:2px}
    .ledger>[data-class]{position:relative;z-index:2;padding:12px;overflow:hidden}
    .bank h2,.check h2{font-size:18px}.bank-list{display:flex;flex-direction:column;gap:5px;margin-top:8px}
    .stake{min-height:27px;box-sizing:border-box;padding:3px 8px;border:1px solid var(--line-strong);border-left:5px solid var(--accent);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:14px;font-weight:680;line-height:1.4;cursor:grab;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .stake:active{cursor:grabbing}.stake[data-role="copy"]{width:100%}.stake.same{background:var(--accent-soft)}
    .matrix{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;min-width:0}
    .bucket{display:flex;flex-direction:column;min-width:0;padding:9px!important;border-width:1px!important;border-top:5px solid var(--accent)!important;background:rgb(255 255 255 / 92%)!important}
    .bucket:nth-child(2){border-top-color:var(--secondary)!important}.bucket:nth-child(3){border-top-color:var(--success)!important}.bucket:nth-child(4){border-top-color:var(--danger)!important}
    .bucket h2{font-size:18px}.def{min-height:43px;margin:3px 0 7px;color:var(--muted);font-size:14px;line-height:1.4}
    .drop{flex:1;min-height:245px;display:flex;flex-direction:column;gap:5px;padding:5px;border:1px dashed var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-soft)}
    .drop.over{outline:3px solid var(--focus);outline-offset:-2px}.empty{margin:auto;text-align:center;color:var(--muted);font-size:14px;line-height:1.4}
    #links{position:absolute;z-index:1;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.link{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-opacity:.28}
    .check{display:flex;flex-direction:column}.status{margin:8px 0 10px;padding:9px;border-left:4px solid var(--warning);background:var(--warning-soft);font-size:16px;line-height:1.45}.status.good{border-color:var(--success);background:var(--success-soft)}
    .metrics{color:var(--muted);font-size:15px;line-height:1.5}.actions{display:flex;gap:8px;margin-top:auto}.actions button{flex:1;padding-inline:8px}
    .refs{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);color:var(--text);font-size:14px;line-height:1.45}.refs[hidden]{display:none}
    .relations{display:flex;align-items:center;justify-content:center;gap:42px;border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);background:rgb(255 255 255 / 72%);font-size:18px;font-weight:780}.relations span+span{position:relative}.relations span+span:before{content:"";position:absolute;left:-22px;top:50%;width:2px;height:24px;background:var(--line);transform:translateY(-50%)}
    button:focus-visible,.stake:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  </style>
</head>
<body data-page="44" data-total="48">
  <div id="stage">
    <main class="p44">
      <section class="scene fs-body" aria-label="任务情景">
        <p><span class="scenario">共同情景：</span>公共资金与商业资本共同支持一项卫星任务，任务向社会提供地球观测数据。</p>
        <p class="hint">拖入各列；列内拖动可重排。键盘：聚焦卡片后按 1—4。</p>
      </section>

      <section class="k-classification ledger" aria-label="航天利益相关者分类矩阵">
        <svg id="links" aria-hidden="true"></svg>
        <section class="bank" data-class>
          <h2>利益相关者</h2>
          <div class="bank-list" id="bank"></div>
        </section>

        <section class="matrix" aria-label="四类关系">
          <section class="bucket" data-class data-cat="user"><h2>直接使用者</h2><p class="def">操作系统，或直接读取、处理任务产出。</p><div class="drop" data-cat="user"></div></section>
          <section class="bucket" data-class data-cat="funder"><h2>出资者</h2><p class="def">通过预算、投资、采购或订阅承担成本。</p><div class="drop" data-cat="funder"></div></section>
          <section class="bucket" data-class data-cat="benefit"><h2>受益者</h2><p class="def">未必操作或付款，也可能获得服务、知识或收入。</p><div class="drop" data-cat="benefit"></div></section>
          <section class="bucket" data-class data-cat="risk"><h2>承担风险者</h2><p class="def">承受人身、财务、环境或系统失效后果。</p><div class="drop" data-cat="risk"></div></section>
        </section>

        <aside class="check" data-class aria-live="polite">
          <h2>分布检查</h2>
          <div id="status" class="status">先把不同群体放进关系类别。</div>
          <div id="metrics" class="metrics"></div>
          <div id="refs" class="refs" hidden>参考关系不是标准答案：企业客户可同时使用、出资并受益；普通居民可能间接受益；周边社区和供应链劳动者也可能受益并承担风险。</div>
          <div class="actions"><button id="reference" type="button">完成并讨论</button><button id="reset" type="button">重置</button></div>
        </aside>
      </section>

      <div class="relations" aria-label="三条关系提示"><span>使用 ≠ 出资</span><span>出资 ≠ 受益</span><span>受益 ≠ 不承担风险</span></div>
    </main>
  </div>
  <script src="assets/lib/d3.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({ index: 44, kicker: 'PUBLIC CHOICE', title: '航天的价值落在谁身上？', take: '判断航天价值，必须区分直接使用者、出资者、受益者与承担风险者。' });
    Deck.init({ index: 44, total: 48 });

    const people = ['卫星任务团队','科研团队','气象与应急机构','企业客户','纳税人与公共预算','政府航天或科研机构','商业投资者','普通居民','农业与航运从业者','供应链劳动者','发射场周边社区'];
    const cats = ['user','funder','benefit','risk'];
    const state = { user:['卫星任务团队'], funder:[], benefit:[], risk:['卫星任务团队'] };
    let dragging = null;

    function makeStake(name, role='source'){
      const el=document.createElement('div');
      el.className='stake'; el.textContent=name; el.draggable=true; el.tabIndex=0;
      el.dataset.name=name; el.dataset.role=role;
      el.setAttribute('role','button');
      el.setAttribute('aria-label', name + (role==='source'?'，按数字 1 到 4 加入对应类别':'，可拖动重排；按 Delete 移除'));
      el.addEventListener('dragstart',e=>{ dragging={name,from:el.closest('.drop')?.dataset.cat||null}; e.dataTransfer.setData('text/plain',name); });
      el.addEventListener('keydown',e=>{
        if(/^[1-4]$/.test(e.key)){ e.preventDefault(); add(name,cats[Number(e.key)-1]); }
        if(role==='copy' && (e.key==='Delete'||e.key==='Backspace')){ e.preventDefault(); remove(name,el.closest('.drop').dataset.cat); }
        if(role==='copy' && (e.key==='ArrowUp'||e.key==='ArrowDown')){ e.preventDefault(); move(name,el.closest('.drop').dataset.cat,e.key==='ArrowUp'?-1:1); }
      });
      return el;
    }
    function initBank(){ const b=document.getElementById('bank'); people.forEach(p=>b.appendChild(makeStake(p))); }
    function add(name,cat,index){
      if(!state[cat].includes(name)) state[cat].splice(index==null?state[cat].length:index,0,name);
      render();
    }
    function remove(name,cat){ state[cat]=state[cat].filter(d=>d!==name); render(); }
    function move(name,cat,delta){ const a=state[cat],i=a.indexOf(name),j=Deck.clamp(i+delta,0,a.length-1); a.splice(i,1);a.splice(j,0,name);render(); }
    function render(){
      document.querySelectorAll('.drop').forEach(drop=>{
        const cat=drop.dataset.cat; drop.innerHTML='';
        if(!state[cat].length){ const e=document.createElement('div');e.className='empty';e.textContent='拖到这里';drop.appendChild(e); }
        state[cat].forEach(n=>drop.appendChild(makeStake(n,'copy')));
      });
      updateCheck(); requestAnimationFrame(drawLinks);
    }
    function updateCheck(){
      const placed=new Set(cats.flatMap(c=>state[c])); const total=cats.reduce((s,c)=>s+state[c].length,0);
      const multi=people.filter(p=>cats.filter(c=>state[c].includes(p)).length>1).length;
      const onlyInsiders=[...placed].every(p=>['卫星任务团队','科研团队','气象与应急机构','企业客户','政府航天或科研机构','商业投资者'].includes(p));
      let msg='继续加入群体，比较利益、成本和风险落在哪里。',good=false;
      if(!state.funder.length||!state.risk.length) msg='重新检查：谁承担任务成本或失败后果？';
      else if(total===placed.size) msg='这些是关系类别，不是互斥身份。';
      else if(onlyInsiders) msg='矩阵中是否还有不直接操作航天系统的人？';
      else {msg='已有多重身份。不同排列仍可讨论。';good=true;}
      const s=document.getElementById('status');s.textContent=msg;s.classList.toggle('good',good);
      document.getElementById('metrics').textContent=`已涉及 ${placed.size} 类群体；${multi} 类群体横跨多列。`;
    }
    function drawLinks(){
      const ledger=document.querySelector('.ledger'), lr=ledger.getBoundingClientRect();
      const groups=d3.group([...document.querySelectorAll('.stake[data-role="copy"]')],d=>d.dataset.name);
      const paths=[];
      groups.forEach(nodes=>{ if(nodes.length<2)return; const pts=nodes.map(n=>{const r=n.getBoundingClientRect();return{x:(r.left+r.width/2-lr.left)/Deck.s,y:(r.top+r.height/2-lr.top)/Deck.s};}).sort((a,b)=>a.x-b.x); for(let i=0;i<pts.length-1;i++)paths.push([pts[i],pts[i+1]]); });
      d3.select('#links').attr('viewBox',`0 0 ${ledger.offsetWidth} ${ledger.offsetHeight}`).selectAll('path').data(paths).join('path').attr('class','link').attr('d',d=>`M${d[0].x},${d[0].y} C${(d[0].x+d[1].x)/2},${d[0].y} ${(d[0].x+d[1].x)/2},${d[1].y} ${d[1].x},${d[1].y}`);
    }
    document.querySelectorAll('.drop').forEach(drop=>{
      drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
      drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
      drop.addEventListener('drop',e=>{
        e.preventDefault();drop.classList.remove('over'); const name=e.dataTransfer.getData('text/plain'),cat=drop.dataset.cat;
        if(dragging?.from===cat){ const items=[...drop.querySelectorAll('.stake')], y=Deck.pt(drop,e).y; let idx=items.findIndex(el=>y<el.offsetTop+el.offsetHeight/2); if(idx<0)idx=items.length; remove(name,cat);add(name,cat,idx); }
        else add(name,cat); dragging=null;
      });
    });
    document.getElementById('reference').addEventListener('click',()=>{document.getElementById('refs').hidden=false;updateCheck();});
    document.getElementById('reset').addEventListener('click',()=>{cats.forEach(c=>state[c]=[]);state.user=['卫星任务团队'];state.risk=['卫星任务团队'];document.getElementById('refs').hidden=true;render();});
    Deck.onResize(drawLinks); initBank(); render();
  </script>
</body>
</html>
