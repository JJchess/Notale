<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>改写标准，也在改写“谁能代表人类”</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    html.lec-root{position:static;display:block;overflow:hidden}
    body.lec-page{width:1600px;height:900px;overflow:hidden}
    .lec-header__inner{width:100%;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:24px}
    .lec-header__identity,.lec-header__kicker,.lec-header__title,.lec-header__page{margin:0;white-space:nowrap}
    .recruit-page{height:100%;display:grid;grid-template-rows:62px 330px 166px 38px;gap:8px;min-height:0}
    .metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
    .metric{min-width:0;border-bottom:3px solid var(--line-strong);padding:5px 10px;background:var(--surface)}
    .metric.hot{border-color:var(--accent);background:var(--accent-soft)}
    .metric span{display:block;color:var(--muted);font-size:var(--fs-label);line-height:var(--lh-label)}
    .metric output{min-width:0;padding:0;border:0;background:transparent;color:var(--text);font-size:var(--fs-h2);line-height:1.15;justify-content:flex-start}
    .compare{--comparison-cols:2;grid-template-columns:180px minmax(0,1fr) minmax(0,1.08fr);grid-auto-rows:54px repeat(4,69px)}
    .compare>div{display:flex;align-items:center;gap:10px}
    .compare .axis{font-size:var(--fs-label);line-height:var(--lh-label)}
    .compare .copy{font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .compare .right-rule{padding:7px 10px;background:var(--accent-soft)}
    .rewrite{width:100%;min-height:50px;padding:6px 10px;text-align:left;justify-content:flex-start;font-size:var(--fs-label);line-height:var(--lh-label)}
    .rewrite.done{border-color:var(--success);background:var(--success-soft);color:var(--success)}
    .linkmark{flex:0 0 26px;height:2px;background:var(--line-strong);position:relative}
    .right-rule[data-active="true"] .linkmark{height:4px;background:var(--accent)}
    .pool{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;min-height:0}
    .candidate{min-width:0;border:1px solid var(--line);border-top:5px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);padding:10px;box-sizing:border-box}
    .candidate[data-state="ready"]{border-top-color:var(--success);background:var(--success-soft)}
    .candidate[data-state="verify"]{border-top-color:var(--warning);background:var(--warning-soft)}
    .candidate[data-state="excluded"]{border-top-color:var(--danger);background:var(--danger-soft)}
    .candidate strong{display:block;font-size:var(--fs-sec);line-height:var(--lh-sec);margin-bottom:3px}
    .candidate p{margin:0;color:var(--muted);font-size:var(--fs-label);line-height:var(--lh-label)}
    .state{display:inline-block;margin-top:5px;font-size:var(--fs-label);font-weight:750;line-height:var(--lh-label)}
    .closing{display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .closing strong{color:var(--accent-strong)}
    .legendline{white-space:nowrap;color:var(--muted);font-size:var(--fs-label)}
  </style>
</head>
<body data-page="45" data-total="48">
  <div id="stage">
    <main class="recruit-page" aria-label="航天员招募标准筛选模拟">
      <section class="metrics" aria-label="筛选结果">
        <div class="metric hot"><span>可进入考核</span><output id="entry">—</output></div>
        <div class="metric"><span>满足全部任务证据</span><output id="ready">—</output></div>
        <div class="metric hot"><span>被标准提前排除</span><output id="excluded">—</output></div>
        <div class="metric"><span>任务覆盖</span><output id="coverage">—</output></div>
        <div class="metric"><span>无任务依据门槛</span><output id="unsupported">—</output></div>
      </section>

      <section class="k-comparison compare" aria-label="门槛式标准与任务式标准逐行比较">
        <div data-axis data-heading>比较维度</div><div data-heading>门槛式标准</div><div data-heading data-diff>任务式标准 · 点击改写</div>
        <div data-axis class="axis">标准表述</div><div class="copy">限定传统航天职业头衔</div><div class="right-rule" data-row="0"><span class="linkmark"></span><button class="rewrite" type="button">改为：按程序操作复杂系统</button></div>
        <div data-axis class="axis">任务联系</div><div class="copy">要求“优秀机构背景”，理由不明</div><div class="right-rule" data-row="1"><span class="linkmark"></span><button class="rewrite" type="button">连接：识别异常并处置故障</button></div>
        <div data-axis class="axis">证明方式</div><div class="copy">只接受单一路径与履历标签</div><div class="right-rule" data-row="2"><span class="linkmark"></span><button class="rewrite" type="button">允许：样本、演练或核验经历</button></div>
        <div data-axis class="axis">准入后果</div><div class="copy">观察实际能力前，先缩小来源</div><div class="right-rule" data-row="3"><span class="linkmark"></span><button class="rewrite" type="button">保留：协作与任务沟通测试</button></div>
      </section>

      <section class="pool" id="pool" aria-label="虚构候选人的筛选状态"></section>

      <section class="closing">
        <div><strong>扩大证明路径，不等于降低任务要求。</strong> 四项能力仍须逐项验证。</div>
        <div class="legendline">绿色 可进入且证据齐全　橙色 仍需补证　红色 门槛提前排除</div>
      </section>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 45,
      kicker: 'ACCESS BY DESIGN',
      title: '改写标准，也在改写“谁能代表人类”',
      take: '招募标准既反映任务需求，也会决定谁有机会代表人类'
    });
    Deck.init({ index: 45, total: 48 });

    const capabilities = ['systems','fault','team','report'];
    const rules = [
      { capabilityId:'systems', gate:'aerospace' },
      { capabilityId:'fault', gate:'elite' },
      { capabilityId:'report', gate:'singlePath' },
      { capabilityId:'team', gate:'title' }
    ];
    const candidates = [
      {name:'候选 A', path:'高风险设备运行', gates:['aerospace','elite','singlePath','title'], evidence:['systems','fault','team','report']},
      {name:'候选 B', path:'现场维修与应急演练', gates:['elite','singlePath'], evidence:['systems','fault','team']},
      {name:'候选 C', path:'科研外业与数据记录', gates:['singlePath'], evidence:['systems','team','report']},
      {name:'候选 D', path:'复杂项目协调', gates:['elite','title'], evidence:['fault','team','report']},
      {name:'候选 E', path:'模拟任务工作样本', gates:[], evidence:['systems','fault','team','report']},
      {name:'候选 F', path:'传统航天相关履历', gates:['aerospace','elite','singlePath','title'], evidence:['systems','team','report']}
    ];
    const rewritten = rules.map(() => false);
    const pool = document.querySelector('#pool');
    const buttons = [...document.querySelectorAll('.rewrite')];
    const fmt = n => Lec.P.formatNumber(n);

    function passesEntryRules(candidate){
      return rules.every((rule, i) => rewritten[i] || candidate.gates.includes(rule.gate));
    }
    function hasEvidence(candidate, capability){ return candidate.evidence.includes(capability); }
    function render(){
      const eligibleCandidates = candidates.filter(passesEntryRules);
      const activeRules = rules.filter((rule, i) => rewritten[i]).map(rule => ({capabilityId:rule.capabilityId}));
      const ready = eligibleCandidates.filter(candidate => capabilities.every(capability => hasEvidence(candidate, capability))).length;
      document.querySelector('#entry').value = fmt(eligibleCandidates.length);
      document.querySelector('#ready').value = fmt(ready);
      document.querySelector('#excluded').value = fmt(candidates.length - eligibleCandidates.length);
      document.querySelector('#coverage').value = fmt(new Set(activeRules.map(rule => rule.capabilityId)).size) + ' / ' + fmt(capabilities.length);
      document.querySelector('#unsupported').value = fmt(rules.filter((rule, i) => !rewritten[i]).length);
      pool.innerHTML = candidates.map(candidate => {
        const entered = passesEntryRules(candidate);
        const complete = capabilities.every(capability => hasEvidence(candidate, capability));
        const state = !entered ? 'excluded' : complete ? 'ready' : 'verify';
        const label = !entered ? '门槛提前排除' : complete ? '证据齐全' : '仍需补充证据';
        return `<article class="candidate" data-state="${state}"><strong>${candidate.name}</strong><p>${candidate.path}</p><span class="state">${label}</span></article>`;
      }).join('');
      buttons.forEach((button, i) => {
        button.classList.toggle('done', rewritten[i]);
        button.setAttribute('aria-pressed', String(rewritten[i]));
        button.closest('.right-rule').dataset.active = String(rewritten[i]);
        button.textContent = rewritten[i] ? ['已改写：操作复杂系统','已连接：故障处置','已开放：多种证据路径','已保留：协作与沟通测试'][i] : ['改为：按程序操作复杂系统','连接：识别异常并处置故障','允许：样本、演练或核验经历','保留：协作与任务沟通测试'][i];
      });
    }
    buttons.forEach((button, i) => button.addEventListener('click', () => { rewritten[i] = !rewritten[i]; render(); }));
    render();
  </script>
</body>
</html>
