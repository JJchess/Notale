<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>当救一个人会增加所有人的风险</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    body{position:relative;top:-96px}
    #stage{height:900px;min-height:900px;max-height:900px}
    .ethics-page{position:absolute;left:96px;top:144px;width:1408px;height:620px;display:grid;grid-template-rows:82px 1fr;gap:16px}
    .k-process.ethics-rail{height:82px;gap:24px}
    .k-process.ethics-rail>*{padding:12px 10px 10px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;line-height:1.4;box-shadow:none}
    .k-process.ethics-rail>*::before{width:26px;height:26px;min-width:26px;margin:0}
    .k-process.ethics-rail>*:not(:last-child)::after{left:calc(100% + 1px);width:22px;font-size:18px}
    .scene{display:grid;grid-template-columns:230px minmax(0,1fr) 230px;gap:20px;min-height:0}
    .record,.preview,.event{min-width:0;min-height:0;box-sizing:border-box;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
    .record,.preview{padding:18px}.event{padding:24px 28px;box-shadow:var(--shadow-raised);border-top:6px solid var(--accent)}
    .side-title{font-size:15px;line-height:1.4;color:var(--muted);font-weight:750;margin-bottom:14px;letter-spacing:.04em}
    .log{font-size:16px;line-height:1.5;color:var(--muted);margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
    .event-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.event h2{font-size:22px}
    .step-tag{font-size:15px;line-height:1.4;color:var(--accent-strong);font-weight:800}
    .event p{margin:0 0 12px;font-size:18px;line-height:1.5}.event .compact{font-size:16px;line-height:1.5}
    .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}.fact{padding:12px;border-left:4px solid var(--secondary);background:var(--surface-soft);font-size:16px;line-height:1.45}
    .quote{padding:14px 18px;margin:12px 0;border-left:5px solid var(--accent);background:var(--accent-soft);font-size:18px;line-height:1.5;font-weight:650}
    .decision{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin:14px 0}.ctl{align-items:flex-start;flex-direction:column;gap:5px}.ctl select{width:100%;font-size:15px}
    .actions{display:flex;justify-content:flex-end;gap:12px;margin-top:14px}.actions button{font-size:15px}
    .pathline{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.path{padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px;line-height:1.4;color:var(--muted)}.path.chosen{border:2px solid var(--accent);background:var(--accent-soft);color:var(--text);font-weight:700}
    .values{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.value{padding:8px;text-align:center;border-radius:8px;background:var(--surface-soft);font-size:15px;font-weight:700}.value:nth-child(2){background:var(--danger-soft)}.value:nth-child(3){background:var(--success-soft)}.value:nth-child(4){background:var(--warning-soft)}
    .summary{padding:14px 16px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;font-size:18px;line-height:1.5}
    .locked{opacity:.5}.next-name{font-size:16px;line-height:1.5;color:var(--muted)}
    @media (prefers-reduced-motion:no-preference){.event{animation:arrive .28s ease-out}@keyframes arrive{from{opacity:.45;transform:translateY(10px)}to{opacity:1;transform:none}}}
  </style>
</head>
<body data-page="46" data-total="48">
  <div id="stage">
    <main class="ethics-page" aria-label="火星救援审议流程">
      <nav class="k-process ethics-rail" id="rail" aria-label="六步审议流程"></nav>
      <section class="scene">
        <aside class="record" aria-label="任务记录"><div class="side-title">任务记录</div><div id="history"></div></aside>
        <article class="event" id="event" aria-live="polite"></article>
        <aside class="preview" aria-label="下一阶段"><div class="side-title">下一阶段</div><div id="preview" class="next-name"></div></aside>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:46,kicker:'MISSION ETHICS',title:'当救一个人会增加所有人的风险',take:'自主、风险、公平和公共成本会在真实任务中发生冲突'});
    Deck.init({index:46,total:48});
    const names=['任务简报','当事人请求','初次决定','后果展开','新信息进入','重新审议'];
    const actions=['立即派出救援队','先远程稳定，等待较安全条件','不派人员，保全返航能力'];
    const reasons=['自主','风险','公平','公共成本'];
    let step=0, firstAction='', firstReason='', finalAction='', finalReason='';
    const rail=document.querySelector('#rail'), eventEl=document.querySelector('#event'), history=document.querySelector('#history'), preview=document.querySelector('#preview');
    function opts(list,chosen=''){return '<option value="">请选择</option>'+list.map(x=>`<option ${x===chosen?'selected':''}>${x}</option>`).join('')}
    function nextButton(label='继续'){return `<div class="actions"><button data-primary id="next">${label}</button></div>`}
    function renderRail(){rail.innerHTML=names.map((n,i)=>`<div data-state="${i<step?'done':i===step?'current':''}">${n}</div>`).join('')}
    function renderSides(){let logs=[];if(step>0)logs.push('队员被困，生命支持恶化');if(step>1)logs.push('当事人请求优先保证全队返航');if(step>2)logs.push(`初选：${firstAction}<br>理由：${firstReason}`);if(step>3)logs.push('已查看所选路径的代价分布');if(step>4)logs.push('救援车降低风险，但挤占返航与科学资源');history.innerHTML=logs.length?logs.map(x=>`<p class="log">${x}</p>`).join(''):'<p class="next-name">决定会保留在这里，形成可回看的轨迹。</p>';preview.innerHTML=step<5?`<strong>${names[step+1]}</strong><p class="compact locked">完成当前阶段后解锁</p>`:'<strong>形成决策摘要</strong>'}
    function pathStrip(chosen){return `<div class="pathline">${actions.map(a=>`<div class="path ${a===chosen?'chosen':''}">${a===chosen?'已选 · ':''}${a}</div>`).join('')}</div>`}
    function render(){renderRail();renderSides();let html=`<div class="event-head"><h2>${names[step]}</h2><span class="step-tag">步骤 ${step+1} / 6</span></div>`;
      if(step===0) html+=`<p>一名队员被困在受损的远端作业舱，目前清醒，生命支持正在恶化。</p><div class="facts"><div class="fact">两名队员承担新增外出风险</div><div class="fact">救援会消耗全队返航备用资源</div><div class="fact">后续公共任务资源也会受影响</div></div><p class="compact">规则只写着“应尽力救援”，没有规定必须承担到什么程度。</p>${nextButton()}`;
      if(step===1) html+=`<p>被困队员发来明确请求：</p><div class="quote">“不要让其他队员为我进入高风险区域；优先保证全队返航。”</div><div class="facts" style="grid-template-columns:1fr 1fr"><div class="fact">尊重请求：当事人有权表达愿意承担什么后果。</div><div class="fact">请求不自动结案：队友、机构与公众也会承受后果。</div></div>${nextButton()}`;
      if(step===2) html+=`<p>先选行动，再选此刻最主要的理由。理由不会用于人格分类。</p><div class="decision"><div class="ctl"><label for="act">行动</label><select id="act">${opts(actions,firstAction)}</select></div><div class="ctl"><label for="why">首要理由</label><select id="why">${opts(reasons,firstReason)}</select></div></div>${pathStrip(firstAction)}${nextButton('展开后果')}`;
      const consequences={ [actions[0]]:'被困队员获得直接救援机会；救援队承担新增暴露；全队备用资源下降；部分公共项目需追加或取消。',[actions[1]]:'救援队暂不暴露，团队保留更多资源；被困队员承担等待风险；任务控制还要决定等待多久。',[actions[2]]:'返航保障得到保留；被困队员承担几乎全部直接后果；机构必须公开说明为何保护多数人足以覆盖救助责任。'};
      if(step===3) html+=pathStrip(firstAction)+`<div class="summary">${consequences[firstAction]}</div><div class="values"><span class="value">自主</span><span class="value">风险</span><span class="value">公平</span><span class="value">公共成本</span></div><p class="compact">这里显示的是代价由谁承担，不是对错评价。</p>${nextButton('接收任务更新')}`;
      if(step===4) html+=`<p>备用救援车能降低外出风险，但会取消一项已承诺的科学任务，并压缩全队返航余量。当事人再次确认原请求。</p><div class="decision"><div class="ctl"><label for="act">最终行动（可维持或修改）</label><select id="act">${opts(actions,finalAction||firstAction)}</select></div><div class="ctl"><label for="why">最终首要理由</label><select id="why">${opts(reasons,finalReason||firstReason)}</select></div></div><p class="compact">改变决定不是失败；新事实改变了风险与资源的分布。</p>${nextButton('重新审议')}`;
      if(step===5) html+=`<p>选择两项价值，完成对代价分布的说明。</p><div class="decision"><div class="ctl"><label for="protect">优先保护</label><select id="protect">${opts(reasons)}</select></div><div class="ctl"><label for="cost">承担更大代价</label><select id="cost"><option value="">请选择</option><option>被困队员</option><option>救援队员</option><option>全体队员</option><option>后续任务与公众</option></select></div></div><div id="result" class="summary">我最终选择 ${finalAction}；它需要同时说明自主、风险、公平与公共成本如何分配。</div>${nextButton('生成决策摘要')}`;
      eventEl.innerHTML=html; bind();
    }
    function bind(){const btn=document.querySelector('#next');if(step===2){document.querySelector('#act').onchange=e=>{firstAction=e.target.value;render()};document.querySelector('#why').onchange=e=>firstReason=e.target.value}if(step===4){document.querySelector('#act').onchange=e=>finalAction=e.target.value;document.querySelector('#why').onchange=e=>finalReason=e.target.value}btn.onclick=()=>{if(step===2){firstAction=document.querySelector('#act').value;firstReason=document.querySelector('#why').value;if(!firstAction||!firstReason)return}if(step===4){finalAction=document.querySelector('#act').value;finalReason=document.querySelector('#why').value;if(!finalAction||!finalReason)return}if(step===5){const p=document.querySelector('#protect').value,c=document.querySelector('#cost').value;if(!p||!c)return;document.querySelector('#result').textContent=`我最终选择 ${finalAction}；它优先保护${p}，同时让${c}承担了更大的代价。这个决定仍需公开说明留下的损失。`;return}step++;render()}}
    render();
  </script>
</body>
</html>
