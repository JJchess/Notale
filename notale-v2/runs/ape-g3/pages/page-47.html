<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>走向太空，究竟优先为了什么？</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{position:fixed;inset:0;transform:none}
    .lec-header{transform:translateY(-92px)}
    .lec-footer{transform:translateY(-96px)}
    .vote-page{position:absolute;top:var(--header-h);left:96px;width:var(--content-w);height:var(--content-h);display:grid;grid-template-rows:1fr 66px;gap:16px;min-height:0}
    .triptych{display:grid;grid-template-columns:minmax(0,1fr) 304px minmax(0,1fr);gap:16px;min-height:0}
    .column{min-width:0;min-height:0;display:grid;grid-template-rows:38px 1fr;border:1px solid var(--line);border-radius:var(--radius-lg);background:rgb(255 255 255 / 78%);overflow:hidden}
    .column>h2{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface-soft);font-size:var(--fs-sec);letter-spacing:.06em;text-transform:uppercase}
    .goal-list,.result-list{--enumeration-cols:1;gap:8px;padding:10px;box-shadow:none}
    .goal-list>*,.result-list>*{padding:10px 12px;border-top-width:4px;border-radius:var(--radius-sm);box-shadow:none}
    .goal-item{display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:start;cursor:pointer}
    .goal-item .mark{width:8px;height:100%;min-height:62px;border-radius:6px;background:var(--goal)}
    .goal-copy{min-width:0}
    .goal-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:2px}
    .goal-name{font-weight:780;font-size:var(--fs-body);line-height:1.35}
    .goal-task{color:var(--muted);font-size:var(--fs-label);line-height:1.4;white-space:nowrap}
    .goal-question,.goal-boundary{margin:0;font-size:var(--fs-sec);line-height:1.42}
    .goal-boundary{color:var(--muted)}
    .goal-item.is-picked{border-color:var(--warning);background:var(--warning-soft)}
    .ballot{padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0;background:linear-gradient(180deg,var(--surface),var(--surface-soft))}
    .ballot-label{margin:0;font-size:var(--fs-sec);line-height:1.5;color:var(--muted)}
    .ballot .ctl{display:block}
    .ballot select{width:100%;margin-top:6px}
    .ballot-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .ballot-actions button{padding-inline:8px}
    #cast{grid-column:1/-1;border-color:var(--warning);background:var(--warning);color:white}
    .ticket-status{padding:12px;border-left:5px solid var(--warning);background:var(--warning-soft);border-radius:var(--radius-sm);font-size:var(--fs-sec);line-height:1.45}
    .selected-detail{margin-top:auto;padding-top:12px;border-top:1px dashed var(--line-strong);font-size:var(--fs-sec);line-height:1.48}
    .selected-detail strong{color:var(--warning)}
    .result-item{display:grid;grid-template-rows:auto 13px auto;gap:6px;cursor:pointer}
    .result-head,.result-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .result-name{font-size:var(--fs-body);font-weight:760;line-height:1.35}
    .result-count{font-size:var(--fs-label);font-variant-numeric:tabular-nums}
    .track{height:13px;border-radius:8px;background:var(--surface-muted);overflow:hidden}
    .bar{height:100%;border-radius:8px;background:var(--accent);min-width:0}
    .result-foot{color:var(--muted);font-size:var(--fs-label);line-height:1.35}
    .waiting{grid-column:1/-1;align-self:center;text-align:center;color:var(--muted);font-size:var(--fs-sec);line-height:1.5}
    .synthesis{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:24px;padding:10px 18px;border-left:6px solid var(--accent);border-radius:var(--radius-md);background:var(--accent-soft)}
    .synthesis p{margin:0;font-size:var(--fs-sec);line-height:1.45}
    button:disabled{cursor:not-allowed;opacity:.48}
  </style>
</head>
<body data-page="47" data-total="48">
  <div id="stage">
    <main class="vote-page" aria-label="未来太空任务目标课堂投票">
      <section class="triptych" aria-label="目标说明、任务票与课堂结果">
        <section class="column min0">
          <h2>目标是什么</h2>
          <div id="goalList" class="goal-list k-enumeration min0"></div>
        </section>
        <section class="column min0">
          <h2>你的任务票</h2>
          <div class="ballot">
            <p class="ballot-label">选择此刻最应优先投入的一项目标。</p>
            <div class="ctl"><label for="goalSelect">优先目标</label><select id="goalSelect" aria-describedby="ticketStatus"></select></div>
            <div class="ballot-actions">
              <button id="cast" type="button">投出任务票</button>
              <button id="next" type="button" disabled>开启下一轮</button>
              <button id="clear" type="button">清空计数</button>
            </div>
            <div id="ticketStatus" class="ticket-status" role="status" aria-live="polite">本轮尚未投票；提交前可以改选。</div>
            <div id="selectedDetail" class="selected-detail"></div>
          </div>
        </section>
        <section class="column min0">
          <h2>本班怎么选</h2>
          <div id="resultList" class="result-list k-enumeration min0" aria-live="polite"></div>
        </section>
      </section>
      <section class="synthesis" aria-label="结论">
        <p><strong>四种目标追求不同结果，不能压缩成一个共同总分。</strong></p>
        <p>这张票只显示本班此刻的优先级，不代表社会共识，也不预测未来。</p>
      </section>
    </main>
  </div>

  <script src="assets/lib/d3.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 47,
      kicker: 'FUTURE PRIORITIES',
      title: '走向太空，究竟优先为了什么？',
      take: '科学、商业、国家竞争和长期生存是不同目标，不能用一个指标合并'
    });
    Deck.init({ index: 47, total: 48 });

    const goals = [
      {id:'science', name:'科学探索', question:'能否产生关于宇宙、地球或生命的新知识？', task:'观测 · 探测 · 样本', boundary:'新知识不等于短期回报，也不保证平均受益。', pursuit:'获得可检验的新知识', cannot:'短期经济回报与公平分配', color:'var(--accent)'},
      {id:'business', name:'商业发展', question:'能否形成可持续的产品、服务或市场？', task:'通信 · 遥感 · 制造', boundary:'收入不能替代科学意义、公共利益或风险判断。', pursuit:'形成可持续的产品与服务', cannot:'科学意义、公共利益与风险判断', color:'var(--secondary)'},
      {id:'state', name:'国家竞争', question:'能否提升国家能力、战略位置或国际影响？', task:'发射 · 基建 · 载人', boundary:'竞争会加快投入，也可能带来重复、保密与风险。', pursuit:'提升能力、战略位置与影响', cannot:'合作价值与风险控制', color:'var(--success)'},
      {id:'survival', name:'长期生存', question:'能否降低文明面对单一行星风险的脆弱性？', task:'防御 · 栖居 · 生命支持', boundary:'面向不确定未来，不等于已有可靠时间表。', pursuit:'降低文明的长期脆弱性', cannot:'当下需求与可靠时间表', color:'var(--warning)'}
    ];
    const votesByGoal = Object.fromEntries(goals.map(g => [g.id, []]));
    let selectedId = goals[0].id;
    let locked = false;
    let ballotSerial = 0;

    const select = d3.select('#goalSelect');
    select.selectAll('option').data(goals).join('option').attr('value',d=>d.id).text(d=>d.name);
    select.on('change', function(){ selectedId=this.value; render(); });

    function totalVotes(){ return d3.sum(goals, g => votesByGoal[g.id].length); }
    function render(){
      d3.select('#goalList').selectAll('article').data(goals,d=>d.id).join('article')
        .attr('class',d=>'goal-item '+(d.id===selectedId?'is-picked':''))
        .attr('style',d=>`--goal:${d.color}`).attr('tabindex',0).attr('role','button')
        .attr('aria-label',d=>`查看${d.name}`)
        .on('click',(_,d)=>choose(d.id)).on('keydown',(e,d)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(d.id);}})
        .html(d=>`<span class="mark" aria-hidden="true"></span><div class="goal-copy"><div class="goal-head"><span class="goal-name">${d.name}</span><span class="goal-task">${d.task}</span></div><p class="goal-question">${d.question}</p><p class="goal-boundary">边界：${d.boundary}</p></div>`);
      const chosen=goals.find(g=>g.id===selectedId);
      select.property('value',selectedId).property('disabled',locked);
      d3.select('#selectedDetail').html(`<strong>${chosen.name}</strong><br>追求：${chosen.pursuit}<br>不能替代：${chosen.cannot}`);
      d3.select('#cast').property('disabled',locked);
      d3.select('#next').property('disabled',!locked);
      const total=totalVotes();
      if(!total){
        d3.select('#resultList').html('<p class="waiting">等待本班选择。投票后才显示分布。</p>');
      }else{
        const maxVotes=d3.max(goals,g=>votesByGoal[g.id].length)||1;
        const rows=d3.select('#resultList').selectAll('article').data(goals,d=>d.id).join('article')
          .attr('class',d=>'result-item '+(d.id===selectedId?'is-active':''))
          .attr('tabindex',0).attr('role','button').attr('aria-label',d=>`查看${d.name}结果`)
          .on('click',(_,d)=>choose(d.id)).on('keydown',(e,d)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(d.id);}});
        rows.html(d=>{const n=votesByGoal[d.id].length;const pct=Lec.P.percent(n,total);return `<div class="result-head"><span class="result-name">${d.name}</span><span class="result-count">${n} 票</span></div><div class="track"><div class="bar" style="width:${(n/maxVotes)*100}%"></div></div><div class="result-foot"><span>${pct}</span><span>相对本班最高票</span></div>`;});
      }
    }
    function choose(id){ selectedId=id; if(!locked) select.property('value',id); render(); }
    d3.select('#cast').on('click',()=>{ if(locked)return; votesByGoal[selectedId].push({ballot:++ballotSerial}); locked=true; d3.select('#ticketStatus').text(`本轮已投给“${goals.find(g=>g.id===selectedId).name}”；本设备已锁定。`); render(); });
    d3.select('#next').on('click',()=>{ locked=false; d3.select('#ticketStatus').text('新一轮已开启；提交前可以改选。'); render(); });
    d3.select('#clear').on('click',()=>{ goals.forEach(g=>votesByGoal[g.id].length=0); locked=false; ballotSerial=0; d3.select('#ticketStatus').text('本次课堂计数已清空。'); render(); });
    render();
  </script>
</body>
</html>
