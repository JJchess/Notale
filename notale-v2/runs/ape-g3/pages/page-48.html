<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>太空人不是猿人的终点</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    html{
      inset:4px 0 0 !important;
    }
    #stage{
      top:calc(50% - 4px);
    }
    footer{
      bottom:4px !important;
    }
    .closing-page{
      position:absolute;
      top:var(--header-h);
      left:96px;
      width:var(--content-w);
      height:var(--content-h);
      display:flex;
      flex-direction:column;
      justify-content:center;
      box-sizing:border-box;
    }
    .closing-page::before{
      content:"";
      position:absolute;
      inset:48px 0 38px;
      z-index:0;
      background:linear-gradient(90deg, rgb(164 92 0 / 8%), transparent 38%, rgb(11 115 224 / 8%));
      mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
      pointer-events:none;
    }
    .closing-map{
      z-index:1;
      height:410px;
      grid-template-columns:minmax(0, 1.35fr) minmax(300px, .82fr) minmax(0, 1fr);
      gap:var(--sp-8);
    }
    .closing-map::before{
      border-top-color:var(--warning);
      border-top-width:4px;
    }
    .closing-map::after{
      border-top-color:var(--accent);
      border-top-width:4px;
    }
    .closing-map > [data-branch="left"]{
      gap:var(--sp-2);
    }
    .closing-map > [data-branch="left"] > *{
      position:relative;
      display:grid;
      grid-template-columns:116px minmax(0,1fr);
      align-items:center;
      min-height:65px;
      padding:var(--sp-2) var(--sp-5);
      border:0;
      border-left:4px solid var(--warning);
      border-radius:var(--radius-sm);
      background:rgb(255 255 255 / 82%);
      box-shadow:none;
    }
    .closing-map > [data-branch="left"] > *::after{
      content:"";
      position:absolute;
      top:50%;
      left:100%;
      width:var(--sp-8);
      border-top:1px solid var(--line-strong);
    }
    .support-key{
      color:var(--warning);
      font-size:var(--fs-h2);
      font-weight:760;
      line-height:var(--lh-h2);
    }
    .support-copy{
      color:var(--text);
      font-size:var(--fs-sec);
      line-height:var(--lh-sec);
    }
    .closing-map > [data-claim]{
      padding:var(--sp-7) var(--sp-5);
      border-color:var(--secondary);
      background:linear-gradient(135deg, var(--secondary-soft), var(--accent-soft));
    }
    .claim-small{
      margin:0 0 var(--sp-3);
      color:var(--muted);
      font-size:var(--fs-sec);
      line-height:var(--lh-sec);
    }
    .claim-main{
      margin:0;
      font-size:28px;
      font-weight:800;
      line-height:1.35;
      letter-spacing:-.02em;
    }
    .closing-map > [data-branch="right"] > *{
      padding:var(--sp-6);
      border:2px solid var(--accent);
      background:var(--surface);
      box-shadow:var(--shadow-raised);
    }
    .end-label{
      margin:0 0 var(--sp-3);
      color:var(--accent);
      font-size:var(--fs-label);
      font-weight:750;
      line-height:var(--lh-label);
      letter-spacing:.08em;
    }
    .end-claim{
      margin:0;
      font-size:25px;
      font-weight:800;
      line-height:1.4;
      letter-spacing:-.02em;
    }
    .closing-question{
      z-index:1;
      align-self:center;
      max-width:980px;
      margin:var(--sp-7) 0 0;
      color:var(--muted);
      font-size:var(--fs-lead);
      line-height:var(--lh-lead);
      text-align:center;
    }
    .closing-question strong{color:var(--text);font-weight:760;}
  </style>
</head>
<body data-page="48" data-total="48">
  <div id="stage">
    <main class="closing-page" aria-label="全课总结：五条支撑共同汇入一种选择">
      <section class="k-generalization closing-map" aria-label="身体、群体、知识、机器与责任共同支撑总主张">
        <div data-branch="left">
          <div><span class="support-key">身体</span><span class="support-copy">限制没有消失：仍需要重力、能量、空气、水与照护。</span></div>
          <div><span class="support-key">群体</span><span class="support-copy">分工、教学与共同维护，把个体能力放大。</span></div>
          <div><span class="support-key">知识</span><span class="support-copy">记录、检验与传承，让经验跨人、跨代累积。</span></div>
          <div><span class="support-key">机器</span><span class="support-copy">能力被延伸，而非替换；新的工程约束随之出现。</span></div>
          <div><span class="support-key">责任</span><span class="support-copy">风险、机会与资源投向，仍需共同选择。</span></div>
        </div>
        <div data-claim>
          <p class="claim-small">我们没有摆脱限制</p>
          <p class="claim-main">而是在<br>重新安排限制</p>
        </div>
        <div data-branch="right">
          <div>
            <p class="end-label">收束主张</p>
            <p class="end-claim">成为太空人<br>是一种选择</p>
          </div>
        </div>
      </section>
      <p class="closing-question">真正开放的问题不是“人类必然会去哪里”，而是<strong>“我们愿意以什么方式一起前往”</strong>。</p>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 48,
      kicker: 'LIMITS · COOPERATION · RESPONSIBILITY',
      title: '太空人不是猿人的终点',
      take: '太空人不是猿人的终点，而是人类重新安排限制、合作与责任的一种选择'
    });

    Deck.init({ index: 48, total: 48 });
  </script>
</body>
</html>
