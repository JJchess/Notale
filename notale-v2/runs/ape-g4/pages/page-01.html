<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage .opening{
      position: relative;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }
    #stage .opening::before{
      content: "";
      position: absolute;
      inset: var(--sp-8) var(--sp-9);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      pointer-events: none;
    }
    #stage .opening-model{
      position: relative;
      z-index: 2;
      height: 100%;
      grid-template-columns: minmax(0, 1.15fr) 42px minmax(0, 1fr);
    }
    #stage .opening-model > .claim{
      position: relative;
      align-self: stretch;
      display: flex;
      align-items: center;
      min-height: 360px;
      padding-right: var(--sp-9);
      overflow: hidden;
    }
    #stage .claim-copy{
      position: relative;
      z-index: 3;
      max-width: 330px;
    }
    #stage .claim-copy strong{
      display: block;
      margin-bottom: var(--sp-3);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      color: var(--accent-strong);
    }
    #stage .claim-copy span{
      display: block;
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      font-weight: 650;
    }
    #stage .figure{
      position: absolute;
      z-index: 1;
      top: var(--sp-4);
      right: var(--sp-2);
      width: 300px;
      height: 520px;
      color: var(--accent);
    }
    #stage .figure svg{
      display: block;
      width: 100%;
      height: 100%;
    }
    #stage .ground-body{
      fill: var(--surface-strong);
      stroke: var(--line-strong);
      stroke-width: 4;
    }
    #stage .suit-shell{
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 5;
    }
    #stage .suit-detail{
      fill: none;
      stroke: var(--cyan);
      stroke-width: 5;
      stroke-linecap: round;
    }
    #stage .body-seam{
      fill: none;
      stroke: var(--accent-strong);
      stroke-width: 4;
      stroke-dasharray: 8 8;
    }
    #stage .opening-model > .supports{
      gap: var(--sp-5);
    }
    #stage .opening-model .support{
      padding: var(--sp-5);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      font-size: var(--fs-body);
      color: var(--text);
    }
    #stage .support strong{
      display: block;
      margin-bottom: var(--sp-2);
      font-size: var(--fs-h2);
      line-height: 1.3;
      color: var(--accent-strong);
    }
    #stage .support span{
      display: block;
      line-height: var(--lh-copy);
      color: var(--muted);
    }
  </style>
</head>
<body data-page="01" data-total="50">
  <div id="stage">
    <main id="main"></main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 1,
      kicker: "OPENING PREMISE",
      title: "从猿人到太空人，变得最快的未必是身体。",
      take: "同一副演化留下的身体，不断进入由文化与工程打开的新世界。"
    });

    Deck.init({ index: 1, total: 50 });

    var stage = document.getElementById("stage");
    var main = document.getElementById("main");
    main.innerHTML = '\
      <section class="opening" aria-label="旧身体与新世界的总关系">\
        <div class="k-generalization opening-model">\
          <div class="claim min0">\
            <div class="claim-copy">\
              <strong>旧身体</strong>\
              <span>带着身体条件，进入工程打开的新世界</span>\
            </div>\
            <div class="figure" aria-hidden="true">\
              <svg viewBox="0 0 300 520" role="img">\
                <path class="ground-body" d="M150 34c-35 0-62 27-62 63 0 22 11 42 28 53l-16 72-44 88 30 17 37-63 4 79-20 141h35l8-116 8 116h35l-20-141 4-79 37 63 30-17-44-88-16-72c17-11 28-31 28-53 0-36-27-63-62-63z"/>\
                <path class="suit-shell" d="M150 20c-48 0-82 33-82 78 0 17 5 34 15 47l-13 96 46 21 11-68h46l11 68 46-21-13-96c10-13 15-30 15-47 0-45-34-78-82-78z"/>\
                <path class="body-seam" d="M76 161h148"/>\
                <path class="suit-detail" d="M95 96c16-31 94-31 110 0M102 117h96M215 137c28 5 35 24 32 57s13 45 30 52"/>\
                <circle cx="150" cy="82" r="42" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="4"/>\
              </svg>\
            </div>\
          </div>\
          <div class="trunk" aria-hidden="true"></div>\
          <div class="supports min0">\
            <div class="support"><strong>身体提供起点</strong><span>直立、双手、感官与代谢构成行动条件。</span></div>\
            <div class="support"><strong>工具扩展能力</strong><span>衣物、火、语言、航天器把部分适应移到身体之外。</span></div>\
            <div class="support"><strong>环境重新设题</strong><span>地面与太空对空气、压力、重力和协作提出不同约束。</span></div>\
          </div>\
        </div>\
      </section>';
  </script>
</body>
</html>
