<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .route-page{
      width:100%;
      height:100%;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      gap:var(--sp-4);
    }
    .route-intro{
      flex:0 0 auto;
      color:var(--muted);
    }
    .route-ledger{
      position:relative;
      flex:1 1 auto;
      min-height:0;
      display:grid;
      grid-template-columns:1fr;
      grid-template-rows:repeat(5,minmax(0,1fr));
      gap:var(--sp-2);
      padding-left:var(--sp-9);
    }
    .route-ledger::before{
      content:"";
      position:absolute;
      left:var(--sp-5);
      top:var(--sp-5);
      bottom:var(--sp-5);
      width:3px;
      border-radius:999px;
      background:var(--line-strong);
    }
    .route-ledger > .it{
      position:relative;
      display:grid;
      grid-template-columns:180px minmax(0,1fr);
      align-items:center;
      min-width:0;
      padding:var(--sp-3) var(--sp-5);
      border-top-width:1px;
      box-shadow:none;
    }
    .route-ledger > .it::before{
      content:"";
      position:absolute;
      left:calc(-1 * var(--sp-7) - 2px);
      top:50%;
      width:13px;
      height:13px;
      border:3px solid var(--surface);
      border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 0 2px var(--line-strong);
      transform:translate(-50%,-50%);
    }
    .route-ledger > .it:not(:last-child)::after{
      content:"";
      position:absolute;
      left:calc(-1 * var(--sp-7) - 8px);
      bottom:calc(-1 * var(--sp-3));
      width:0;
      height:0;
      border-left:6px solid transparent;
      border-right:6px solid transparent;
      border-top:8px solid var(--line-strong);
    }
    .route-ledger > .it > .it-title{
      margin:0;
      padding-right:var(--sp-5);
      color:var(--accent-strong);
    }
    .route-ledger > .it > .it-body{
      min-width:0;
      padding-left:var(--sp-5);
      border-left:1px solid var(--line);
    }
  </style>
</head>
<body data-page="02" data-total="50">
  <div id="stage">
    <main id="main"></main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 2,
      kicker: "COURSE ROUTE",
      title: "从时间出发，走向未来",
      take: "沿同一条主线，依次追问身体、文化与环境如何共同变化。"
    });

    Deck.init({ index: 2, total: 50 });

    var stage = document.getElementById("stage");
    var main = document.getElementById("main");
    main.innerHTML = [
      '<section class="route-page" aria-labelledby="route-heading">',
        '<h2 id="route-heading" class="route-intro lead">先建立尺度，再观察身体与文化如何共同扩展人类能够生存的环境。</h2>',
        '<div class="k-enumeration route-ledger" aria-label="全课五个站点，按从上到下的顺序推进">',
          '<article class="it min0"><h3 class="it-title">时间</h3><p class="it-body">生物演化、人类历史与航天史分别发生在怎样的时间尺度上？</p></article>',
          '<article class="it min0"><h3 class="it-title">身体</h3><p class="it-body">直立、手、脑、饮食、成长与合作如何彼此牵制？</p></article>',
          '<article class="it min0"><h3 class="it-title">文化</h3><p class="it-body">人类怎样把一部分适应移到工具、知识与制度中？</p></article>',
          '<article class="it min0"><h3 class="it-title">太空</h3><p class="it-body">离开地面后，这副身体首先失去哪些生存条件？</p></article>',
          '<article class="it min0"><h3 class="it-title">未来</h3><p class="it-body">短期调节、技术改造与跨世代演化应当怎样区分？</p></article>',
        '</div>',
      '</section>'
    ].join('');
  </script>
</body>
</html>
