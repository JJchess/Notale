<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:var(--sp-3)}
    .taskbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);min-height:48px}
    .taskbar p{font-size:var(--fs-lead);line-height:var(--lh-copy)}
    .work{position:relative;flex:1 1 auto;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);overflow:hidden}
    #konvaHost,#summary{position:absolute;inset:0}
    #summary{display:none;padding:var(--sp-4);box-sizing:border-box}
    #summary svg{width:100%;height:100%;display:block}
    .card-key{position:absolute;width:30%;height:22%;opacity:0;background:transparent;border:0;padding:0;min-height:0}
    .card-key:focus-visible{opacity:1;background:transparent;outline:4px solid var(--focus);outline-offset:-5px}
    .feedback{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);min-height:54px;padding:var(--sp-2) var(--sp-4);box-sizing:border-box;background:var(--surface-soft);border-left:4px solid var(--accent);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
    #status{font-size:var(--fs-sec);line-height:var(--lh-copy)}
    #progress{font-size:var(--fs-label);font-weight:700;color:var(--muted);white-space:nowrap}
    .summary-label{font-family:var(--font-sans);font-size:16px;fill:var(--text)}
    .summary-small{font-family:var(--font-sans);font-size:14px;fill:var(--muted)}
    .summary-head{font-family:var(--font-sans);font-size:18px;font-weight:740;fill:var(--accent-strong)}
  </style>
</head>
<body data-page="05" data-total="50">
  <div id="stage"><main id="main">
    <div class="taskbar min0">
      <p>把六个名称按“它在命名什么”归位。键盘：方向键选类别，Enter 投放。</p>
      <button id="reset" type="button">重置</button>
    </div>
    <section class="work no-pan min0" aria-label="名称分拣台">
      <div id="konvaHost" aria-hidden="true"></div>
      <div id="keys"></div>
      <div id="summary" class="k-classification" aria-label="完成后的名称层级摘要"></div>
    </section>
    <div class="feedback min0"><p id="status" aria-live="polite">先选一张卡，再判断它是合称、属、物种，还是具体标本。</p><span id="progress">已归位 0 / 6</span></div>
  </main></div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/konva.min.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
    Lec.mount({index:5,kicker:"NAME / RANK / SPECIMEN",title:"谁都能叫“猿人”吗？",take:"“猿人”不是一个严格物种名，而是多个时代与谱系的通俗合称。"});
    Deck.init({index:5,total:50});

    var categories=["通俗合称","属名","物种名","标本昵称"];
    var homininYears=Lec.K.homininEarliestYearsAgo||Lec.K.evolution.homininSplitYearsAgo;
    var lucyYears=Lec.K.australopithecusLucyYearsAgo||Lec.K.evolution.australopithecusYearsAgo;
    var homoYears=Lec.K.genusHomoEarliestYearsAgo||Lec.K.evolution.homoOriginYearsAgo;
    var sapiensYears=Lec.K.homoSapiensEarliestYearsAgo||Lec.K.evolution.homoSapiensYearsAgo;
    function safeAge(v){if(!Lec.P.finite(v))v=0;return Lec.P.formatNumber(Lec.P.clamp(v,0,homininYears));}
    var lucyAge=safeAge(lucyYears);
    var cards=[
      {id:"lucy",name:"露西",sub:"约 "+lucyAge+" 年前",cat:3,explain:"露西是一件具体化石标本的昵称，通常归入南方古猿阿法种。"},
      {id:"homo",name:"人属 Homo",sub:"记录约始于 "+safeAge(homoYears)+" 年前",cat:1,explain:"人属是属名；一个属可以包含多个物种。"},
      {id:"ape",name:"“猿人”",sub:"范围随语境变化",cat:0,explain:"“猿人”是通俗合称，不对应唯一学名、时代或谱系。"},
      {id:"sapiens",name:"智人 Homo sapiens",sub:"最早记录量级约 "+safeAge(sapiensYears)+" 年前",cat:2,explain:"智人是正式物种名，不是整个人属。"},
      {id:"early",name:"“早期人类”",sub:"须结合作者范围",cat:0,explain:"“早期人类”是宽泛表达，不能单凭这个词判断属、种或祖先关系。"},
      {id:"afar",name:"南方古猿阿法种",sub:"Australopithecus afarensis",cat:2,explain:"南方古猿阿法种是正式物种名；这里不要求记忆拼写。"}
    ];
    var state={placed:{},selected:{}};
    var host=document.getElementById("konvaHost"), keyHost=document.getElementById("keys");
    var W=1406,H=438,cardW=390,cardH=82,startX=85,startY=24,gapX=425,gapY=98,zoneY=252,zoneW=322,zoneH=150;
    var stageK=new Konva.Stage({container:"konvaHost",width:W,height:H});
    var layer=new Konva.Layer(); stageK.add(layer);
    function css(name){return Deck.token(name).trim();}
    function cardPos(i){return {x:startX+(i%3)*gapX,y:startY+Math.floor(i/3)*gapY};}
    function zoneX(i){return 25+i*345;}
    function draw(){
      layer.destroyChildren();
      categories.forEach(function(c,i){
        var active=Object.keys(state.selected).some(function(k){return state.selected[k]===i;});
        layer.add(new Konva.Rect({x:zoneX(i),y:zoneY,width:zoneW,height:zoneH,cornerRadius:14,fill:active?css("--accent-soft"):css("--surface-soft"),stroke:active?css("--accent"):css("--line-strong"),strokeWidth:active?3:2,dash:i===0?[8,6]:[]}));
        layer.add(new Konva.Text({x:zoneX(i)+14,y:zoneY+12,width:zoneW-28,text:c,fontFamily:css("--font-sans"),fontSize:20,fontStyle:"bold",fill:css("--text"),align:"center"}));
        layer.add(new Konva.Text({x:zoneX(i)+14,y:zoneY+45,width:zoneW-28,text:["语境边界","包含多个物种","正式双名","具体发现"][i],fontFamily:css("--font-sans"),fontSize:15,fill:css("--muted"),align:"center"}));
      });
      cards.forEach(function(d,i){
        var p=cardPos(i), placed=state.placed[d.id];
        if(placed!==undefined){var peers=cards.filter(function(x){return state.placed[x.id]===placed;});var n=peers.indexOf(d);p={x:zoneX(placed)+18+(n%2)*148,y:zoneY+75+Math.floor(n/2)*48};}
        var g=new Konva.Group({x:p.x,y:p.y,draggable:true,id:d.id});
        var rw=placed===undefined?cardW:138,rh=placed===undefined?cardH:40;
        g.add(new Konva.Rect({width:rw,height:rh,cornerRadius:10,fill:css("--surface"),stroke:css("--accent-strong"),strokeWidth:d.cat===2?4:2,dash:d.cat===0?[8,5]:[],shadowColor:css("--line-strong"),shadowBlur:8,shadowOpacity:.22}));
        g.add(new Konva.Text({x:12,y:placed===undefined?12:9,width:rw-24,text:d.name,fontFamily:css("--font-sans"),fontSize:placed===undefined?18:15,fontStyle:"bold",fill:css("--text"),ellipsis:true}));
        if(placed===undefined)g.add(new Konva.Text({x:12,y:48,width:rw-24,text:d.sub,fontFamily:css("--font-sans"),fontSize:14,fill:css("--muted"),ellipsis:true}));
        if(d.cat===3)g.add(new Konva.Label({x:rw-52,y:-8,children:[new Konva.Tag({fill:css("--warning-soft"),stroke:css("--warning"),cornerRadius:5}),new Konva.Text({text:"标本",padding:5,fontSize:14,fill:css("--warning")})]}));
        g.on("dragmove",function(){var cx=g.x()+rw/2;state.selected[d.id]=Math.max(0,Math.min(3,Math.floor(cx/345)));});
        g.on("dragend",function(){var z=state.selected[d.id];delete state.selected[d.id];attempt(d,z);});
        layer.add(g);
      });
      layer.draw(); positionKeys();
    }
    function drawZonesOnly(){draw();}
    function attempt(d,z){
      if(z===d.cat){state.placed[d.id]=z;document.getElementById("status").textContent=d.explain;}
      else document.getElementById("status").textContent=d.cat===3?"这是具体标本，还是一整类生物？":"再问一次：这个名称指合称、属、物种，还是一件标本？";
      update();
    }
    function positionKeys(){
      keyHost.innerHTML="";
      cards.forEach(function(d,i){if(state.placed[d.id]!==undefined)return;var p=cardPos(i),b=document.createElement("button");b.type="button";b.className="card-key";b.style.left=(p.x/W*100)+"%";b.style.top=(p.y/H*100)+"%";b.style.width=(cardW/W*100)+"%";b.style.height=(cardH/H*100)+"%";b.setAttribute("aria-label",d.name+"，当前选择类别 "+categories[state.selected[d.id]||0]);b.addEventListener("keydown",function(e){var z=state.selected[d.id]||0;if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();state.selected[d.id]=Math.min(3,z+1);draw();b.focus();}if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();state.selected[d.id]=Math.max(0,z-1);draw();b.focus();}if(e.key==="Enter"||e.key===" "){e.preventDefault();attempt(d,state.selected[d.id]||0);}});keyHost.appendChild(b);});
    }
    function update(){var n=Object.keys(state.placed).length;document.getElementById("progress").textContent="已归位 "+n+" / 6";if(n===6)showSummary();else draw();}
    function showSummary(){host.style.display="none";keyHost.style.display="none";var el=document.getElementById("summary");el.style.display="block";document.getElementById("progress").textContent="全部归位";document.getElementById("status").textContent="属、物种和标本处在不同层级；合称位于正式分类框之外。";renderSummary(el);}
    function renderSummary(el){
      var ev=Lec.K.evidenceLabels||[], disputed=Array.isArray(ev)?(ev[1]||""):((ev.disputed||ev.contested)||"");
      var svg=d3.select(el).html("").append("svg").attr("viewBox","0 0 1370 400").attr("role","img").attr("aria-label","合称位于正式分类之外；人属包含物种示例；露西通常归入南方古猿阿法种");
      svg.append("rect").attr("x",18).attr("y",20).attr("width",300).attr("height",285).attr("rx",14).attr("fill",css("--surface-soft")).attr("stroke",css("--line-strong")).attr("stroke-width",2).attr("stroke-dasharray","9 6");
      svg.append("text").attr("x",38).attr("y",54).attr("class","summary-head").text("正式分类层级之外 · 通俗合称");
      ["“猿人”","“早期人类”"].forEach(function(t,i){svg.append("rect").attr("x",42).attr("y",82+i*82).attr("width",250).attr("height",56).attr("rx",9).attr("fill",css("--surface")).attr("stroke",css("--accent")).attr("stroke-dasharray","8 5");svg.append("text").attr("x",60).attr("y",116+i*82).attr("class","summary-label").text(t);});
      var data={name:"正式分类",children:[{name:"人属 Homo（属）",children:[{name:"智人 Homo sapiens（物种）"}]},{name:"南方古猿属",children:[{name:"南方古猿阿法种（物种）",children:[{name:"露西（标本）"}]}]}]};
      var root=d3.hierarchy(data);d3.tree().size([300,700])(root);
      var g=svg.append("g").attr("transform","translate(405,34)");
      g.selectAll("path").data(root.links()).join("path").attr("d",d3.linkHorizontal().x(function(d){return d.y;}).y(function(d){return d.x;})).attr("fill","none").attr("stroke",css("--line-strong")).attr("stroke-width",2);
      var node=g.selectAll("g").data(root.descendants()).join("g").attr("transform",function(d){return "translate("+d.y+","+d.x+")";});
      node.append("rect").attr("x",-8).attr("y",-22).attr("width",function(d){return d.depth===0?150:245;}).attr("height",44).attr("rx",9).attr("fill",css("--surface")).attr("stroke",function(d){return d.depth===2?css("--accent"):css("--line-strong");}).attr("stroke-width",function(d){return d.depth===2?4:2;});
      node.append("text").attr("x",8).attr("y",6).attr("class","summary-label").text(function(d){return d.data.name;});
      svg.append("text").attr("x",405).attr("y",380).attr("class","summary-small").text("背景范围：目前常用的人族早期时间量级约 "+safeAge(homininYears)+" 年前 · "+disputed+"；年代不决定祖先关系。");
    }
    document.getElementById("reset").addEventListener("click",function(){state={placed:{},selected:{}};host.style.display="block";keyHost.style.display="block";document.getElementById("summary").style.display="none";document.getElementById("status").textContent="先选一张卡，再判断它是合称、属、物种，还是具体标本。";update();});
    draw();
  </script>
</body>
</html>
