<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .p09-wrap{height:100%;display:flex;flex-direction:column;gap:var(--sp-3)}
    .p09-lead{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-5)}
    .p09-lead p{max-width:930px}
    .p09-nav{display:flex;gap:var(--sp-2);flex:0 0 auto}
    .p09-nav button{min-width:44px;padding:var(--sp-2) var(--sp-3)}
    .p09-main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--sp-4);min-height:0;flex:1}
    .p09-main>*{min-width:0;min-height:0}
    .p09-matrix{--cmp-cols:170px repeat(3,minmax(0,1fr));display:grid;grid-template-rows:66px minmax(0,1fr)}
    .p09-matrix>.hdr,.p09-matrix>.dim{padding:var(--sp-2) var(--sp-3)}
    .p09-matrix>.dim{justify-content:center;text-align:center}
    .timeband{width:100%;display:flex;flex-direction:column;align-items:center;gap:var(--sp-1)}
    .timebar{height:6px;border-radius:var(--radius-sm);background:var(--accent)}
    .timebar.fast{width:28%}.timebar.life{width:60%}.timebar.generations{width:94%}
    .timeband small{font-size:var(--fs-label);line-height:1.4;color:var(--muted);font-weight:650}
    #matrixChart{grid-column:1/-1;width:100%;height:100%;border-top:1px solid var(--line)}
    .p09-detail{display:flex;flex-direction:column;gap:var(--sp-3);padding:var(--sp-4)}
    .p09-detail h2{color:var(--accent-strong)}
    .detail-sentence{font-size:var(--fs-body);line-height:var(--lh-copy);font-weight:680}
    .examples{display:flex;flex-direction:column;gap:var(--sp-2);margin-top:auto}
    .example{padding:var(--sp-3);border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-soft);font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--muted)}
    .example.on{color:var(--text);background:var(--accent-soft);border-color:var(--accent)}
    .example strong{color:var(--accent-strong)}
    .p09-rule{padding:var(--sp-3) var(--sp-4);border-left:5px solid var(--line-strong);background:var(--surface-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:var(--fs-body);line-height:var(--lh-copy);font-weight:720;color:var(--muted);transition:background .2s,color .2s,border-color .2s}
    .p09-rule.done{color:var(--accent-strong);background:var(--accent-soft);border-color:var(--accent)}
  </style>
</head>
<body data-page="09" data-total="50">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script>
    Lec.mount({
      index: 9,
      kicker: "THREE MEANINGS OF ADAPTATION",
      title: "同一个“适应”，可能发生在身体、经验或群体中",
      take: "生理调节、学习适应与跨世代演化是三种不同变化。"
    });
    Deck.init({ index: 9, total: 50 });

    var stage=document.getElementById("stage");
    var main=document.getElementById("main");
    main.innerHTML='<div class="p09-wrap">'+
      '<div class="p09-lead"><p class="lead">沿同一行横看三列：先问变化在哪里，再看触发、时间与遗传。</p><div class="p09-nav ctl" aria-label="切换判断维度"><button type="button" id="prev" aria-label="上一个判断维度">←</button><span class="label" id="progress">发生在哪里</span><button type="button" id="next" aria-label="下一个判断维度">→</button></div></div>'+
      '<div class="p09-main"><section class="k-comparison p09-matrix min0" aria-label="三种适应的五维对照矩阵"><div class="dim">判断维度</div><div class="hdr"><div class="timeband">生理调节<div class="timebar fast"></div><small>个体内较快</small></div></div><div class="hdr"><div class="timeband">学习适应<div class="timebar life"></div><small>个体一生中</small></div></div><div class="hdr"><div class="timeband">跨世代演化<div class="timebar generations"></div><small>许多代</small></div></div><div id="matrixChart" role="img" aria-label="当前高亮一项判断维度，横向比较三种适应"></div></section>'+
      '<aside class="panel p09-detail min0" aria-live="polite"><h2 id="detailTitle">发生在哪里</h2><p class="detail-sentence" id="detailText"></p><div class="examples"><div class="label muted">同一低氧环境中的三种变化</div><div class="example" id="ex0"></div><div class="example" id="ex1"></div><div class="example" id="ex2"></div></div></aside></div>'+
      '<div class="p09-rule" id="rule">同一个体在环境中改变，不等于群体已经演化。</div></div>';

    var rows=[
      {dim:"发生在哪里",short:["个体的身体状态","个体的行为、技能或策略","群体中可遗传性状的比例"],detail:"生理调节和学习都发生在同一个体内；演化描述群体中的比例变化。",keys:["同一个体","个体","群体"]},
      {dim:"由什么触发",short:["环境变化后的生理调节","练习、反馈、模仿或教学","可遗传差异造成繁殖差异"],detail:"前两者由环境或经验触发；演化还要求可遗传差异持续影响繁殖。",keys:["环境","反馈","可遗传差异"]},
      {dim:"需要多久",short:["生命期内，常较快","生命期内逐步形成","必须跨越许多代"],detail:"生理与学习可在一生中发生；演化必须跨越许多代。",keys:["调节","学会","多代"]},
      {dim:"能否传给后代",short:["发生过不等于被遗传","可由教学传播，并非直接遗传","相关差异必须可遗传"],detail:"身体调节和学到的内容不会因发生过就被遗传；演化要求相关差异可遗传。",keys:["同一个体","反馈","可遗传差异"]},
      {dim:"判断时看什么",short:["同一个体前后状态","经验前后表现","多代后的群体性状比例"],detail:"判断前两类要比较个体前后；判断演化要比较多代后的群体比例。",keys:["状态","表现","群体比例"]}
    ];
    var examples=["进入低氧环境后，同一个体的呼吸等生理状态发生调节。","个体通过反馈学会调整活动节奏与行动策略。","若群体存在可遗传差异，且长期影响繁殖，多代后性状比例可能改变。"];
    var chart=echarts.init(document.getElementById("matrixChart"),null,{renderer:"svg"});
    var current=0, visited={0:true};
    function renderItem(params,api){
      var r=api.value(0),c=api.value(1),active=r===current;
      var x0=api.coord([c,r])[0],y0=api.coord([c,r])[1],size=api.size([1,1]);
      var rect=echarts.graphic.clipRectByRect({x:x0-size[0]/2,y:y0-size[1]/2,width:size[0],height:size[1]},{x:params.coordSys.x,y:params.coordSys.y,width:params.coordSys.width,height:params.coordSys.height});
      var label=c===0?rows[r].dim:rows[r].short[c-1];
      return {type:"group",children:[{type:"rect",shape:rect,style:{fill:active?Deck.token("--accent-soft"):(c===0?Deck.token("--surface-soft"):Deck.token("--surface")),stroke:Deck.token("--line"),lineWidth:1}},{type:"text",style:{x:rect.x+(c===0?rect.width-12:12),y:rect.y+rect.height/2,text:label,textAlign:c===0?"right":"left",textVerticalAlign:"middle",font:(c===0?"700 ":"600 ")+"16px "+Deck.token("--font-sans"),fill:active?Deck.token("--accent-strong"):(c===0?Deck.token("--muted"):Deck.token("--text")),width:rect.width-24,overflow:"break",lineHeight:21}}]};
    }
    var data=[];rows.forEach(function(r,ri){for(var c=0;c<4;c++)data.push([ri,c]);});
    function update(){
      chart.setOption({animationDuration:Deck.reduced()?0:180,textStyle:{fontSize:16,fontFamily:Deck.token("--font-sans")},grid:{left:0,right:0,top:0,bottom:0},xAxis:{type:"category",data:[0,1,2,3],show:false,boundaryGap:true},yAxis:{type:"category",data:[0,1,2,3,4],show:false,inverse:true,boundaryGap:true},series:[{type:"custom",coordinateSystem:"cartesian2d",renderItem:renderItem,data:data,silent:false}]},true);
      document.getElementById("progress").textContent=rows[current].dim;
      document.getElementById("detailTitle").textContent=rows[current].dim;
      document.getElementById("detailText").textContent=rows[current].detail;
      examples.forEach(function(t,i){var el=document.getElementById("ex"+i),key=rows[current].keys[i];el.innerHTML=t.replace(key,"<strong>"+key+"</strong>");el.classList.add("on");});
      document.getElementById("rule").classList.toggle("done",Object.keys(visited).length===rows.length);
    }
    function move(delta){current=(current+delta+rows.length)%rows.length;visited[current]=true;update();}
    document.getElementById("prev").addEventListener("click",function(){move(-1)});
    document.getElementById("next").addEventListener("click",function(){move(1)});
    document.querySelector(".p09-wrap").addEventListener("keydown",function(e){if(e.key==="ArrowLeft"){e.preventDefault();move(-1)}if(e.key==="ArrowRight"){e.preventDefault();move(1)}});
    chart.on("click",function(p){if(p.value){current=p.value[0];visited[current]=true;update();}});
    Deck.onResize(function(){chart.resize()});
    examples.forEach(function(t,i){document.getElementById("ex"+i).textContent=t});
    update();
  </script>
</body>
</html>
