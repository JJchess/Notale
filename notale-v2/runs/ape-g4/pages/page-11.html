<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .p11{height:100%;display:flex;flex-direction:column;gap:var(--sp-3)}
    .p11.k-generalization{grid-template-columns:none;display:flex}
    .p11.k-generalization>.claim{align-self:stretch;padding:var(--sp-3) var(--sp-5);display:flex;align-items:center;justify-content:space-between;gap:var(--sp-5)}
    .claim strong{font-size:var(--fs-h2)}
    .claim .secondary{font-weight:500}
    .p11.k-generalization>.trunk{min-height:20px;height:20px}
    .p11.k-generalization>.trunk::before{top:0;bottom:0}
    .p11.k-generalization>.trunk::after{content:"↓";width:28px;height:28px;font-size:var(--fs-sec)}
    .p11.k-generalization>.supports{flex:1;justify-content:flex-start;gap:var(--sp-3)}
    .p11.k-generalization .support{padding:var(--sp-3) var(--sp-4);color:var(--text);background:var(--surface)}
    .p11.k-generalization .support::before{display:none}
    .taskline{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4)}
    .bank{display:flex;gap:var(--sp-2);min-width:0;flex-wrap:wrap}
    .tile{touch-action:none;cursor:grab;padding:var(--sp-2) var(--sp-3);border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-soft);font-size:var(--fs-label);line-height:1.4;font-weight:700;user-select:none}
    .tile[data-wrong="true"]{color:var(--danger);background:var(--danger-soft);border-style:dashed}
    .tile.placed{opacity:.34;pointer-events:none}
    .tile.dragging{position:relative;z-index:10;box-shadow:var(--shadow);cursor:grabbing}
    .chain-wrap{position:relative;height:178px;min-height:178px}
    #links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
    .slots{position:relative;z-index:2;display:flex;align-items:stretch;gap:var(--sp-7);height:100%}
    .slot{flex:1 1 0;min-width:0;padding:var(--sp-3);border:2px dashed var(--line-strong);border-radius:var(--radius-md);background:var(--surface);display:flex;flex-direction:column;justify-content:center;gap:var(--sp-2)}
    .slot.hot{border-color:var(--accent);background:var(--accent-soft)}
    .slot.filled{border-style:solid;border-color:var(--accent)}
    .slot.break{border-color:var(--warning);background:var(--warning-soft)}
    .slot-title{font-size:var(--fs-h2);line-height:1.3;font-weight:740}
    .slot-copy{font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--muted)}
    .feedback{min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4)}
    .feedback .body-copy{font-weight:680}
    .after{display:none;align-items:center;justify-content:center;gap:var(--sp-4);font-size:var(--fs-lead);font-weight:720;color:var(--accent-strong)}
    .after.show{display:flex}
    .route{display:none;border:2px dashed var(--danger);background:var(--danger-soft);color:var(--danger);font-size:var(--fs-sec);line-height:var(--lh-copy)}
    .route.show{display:block}
    #reset{display:none}
    #reset.show{display:inline-flex}
    .link{fill:none;stroke:var(--line-strong);stroke-width:4;stroke-dasharray:7 7}
    .link.on{stroke:var(--accent);stroke-dasharray:none}
    .link.bad{stroke:var(--warning)}
  </style>
</head>
<body data-page="11" data-total="50">
  <div id="stage"><main id="main"></main></div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
    Lec.mount({
      index: 11,
      kicker: "SELECTION, NOT INSTRUCTION",
      title: "环境不命令身体改变",
      take: "环境不直接命令身体改变，而是筛选既有差异。"
    });
    Deck.init({ index: 11, total: 50 });

    var stage = document.getElementById("main");
    stage.innerHTML = '<section class="p11 k-generalization" aria-label="组装自然选择因果链">'+
      '<div class="claim"><strong>环境是筛选条件，不是身体的发令员</strong><span class="secondary">把节点拖进四个空槽；键盘可用方向键选槽，按 Enter 放入。</span></div>'+
      '<div class="trunk" aria-hidden="true"></div>'+
      '<div class="supports">'+
        '<div class="support taskline"><div class="bank" id="bank"></div><span class="label muted">组装因果主干</span></div>'+
        '<div class="chain-wrap no-pan"><svg id="links" aria-hidden="true"></svg><div class="slots" id="slots"></div></div>'+
        '<div class="support route" id="route">因果跳步：这里把筛选写成了命令。缺少：既有差异 → 繁殖结果不同</div>'+
        '<div class="after" id="after"><span>起初：差异已经存在</span><span aria-hidden="true">→</span><span>多代后：某些差异所占比例改变</span></div>'+
        '<div class="support feedback" aria-live="polite"><span class="body-copy" id="feedback">先判断：变化的材料在筛选前是否已经存在？</span><button type="button" id="reset">重新组装</button></div>'+
      '</div></section>';

    var items = [
      {id:"env", title:"环境条件", copy:"资源、温度、捕食或疾病等条件，使不同性状面对的结果不同。"},
      {id:"variation", title:"既有可遗传差异", copy:"群体成员原本就不同，其中部分差异能够传给后代。"},
      {id:"repro", title:"繁殖结果不同", copy:"在当时条件下，某些差异与留下更多后代相关。"},
      {id:"group", title:"多代后群体比例改变", copy:"经过许多代，相关性状在群体中的比例可能改变。"},
      {id:"wrong", title:"环境让个体长出所需性状", wrong:true}
    ];
    var order = ["env","variation","repro","group"], state = [null,null,null,null], keyTarget = 0;
    var bank = d3.select("#bank");
    bank.selectAll("div").data(items).join("div")
      .attr("class","tile").attr("data-id",d=>d.id).attr("data-wrong",d=>d.wrong?"true":"false")
      .attr("tabindex",0).attr("role","button").attr("aria-label",d=>"拖动节点："+d.title)
      .text(d=>d.title);
    d3.select("#slots").selectAll("div").data(d3.range(4)).join("div")
      .attr("class","slot").attr("data-index",d=>d).attr("aria-label",d=>"因果链第"+(d+1)+"个槽位")
      .html(d=>'<span class="label muted">第'+(d+1)+'步</span>');

    function nearest(x,y){
      var best=-1, dist=Infinity;
      document.querySelectorAll('.slot').forEach(function(el,i){var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dd=Math.hypot(x-cx,y-cy);if(dd<dist){dist=dd;best=i;}});
      return best;
    }
    function place(d,i){
      if(d.wrong){
        d3.select('#route').classed('show',true); d3.select('#feedback').text('把结果误写成命令：环境不会按需要改造个体。');
        setTimeout(function(){d3.select('#route').classed('show',false);},1800); return;
      }
      var old=state.indexOf(d.id); if(old>=0) state[old]=null;
      state[i]=d.id; render();
    }
    var drag = d3.drag().on("start",function(){d3.select(this).classed("dragging",true);})
      .on("drag",function(event){d3.select(this).style("transform","translate("+event.x+"px,"+event.y+"px)"); var i=nearest(event.sourceEvent.clientX,event.sourceEvent.clientY);d3.selectAll('.slot').classed('hot',(d,j)=>j===i);})
      .on("end",function(event,d){var i=nearest(event.sourceEvent.clientX,event.sourceEvent.clientY);d3.select(this).classed("dragging",false).style("transform",null);d3.selectAll('.slot').classed('hot',false);if(i>=0)place(d,i);});
    bank.selectAll('.tile').call(drag).on('keydown',function(event,d){
      if(event.key==='ArrowRight'||event.key==='ArrowDown'){keyTarget=Math.min(3,keyTarget+1);event.preventDefault();}
      if(event.key==='ArrowLeft'||event.key==='ArrowUp'){keyTarget=Math.max(0,keyTarget-1);event.preventDefault();}
      if(event.key==='Enter'||event.key===' '){place(d,keyTarget);event.preventDefault();}
      d3.selectAll('.slot').classed('hot',(x,i)=>i===keyTarget);
    });
    function drawLinks(bad){
      var wrap=document.querySelector('.chain-wrap').getBoundingClientRect();
      var boxes=Array.from(document.querySelectorAll('.slot')).map(function(el){var r=el.getBoundingClientRect();return{x:r.left-wrap.left,y:r.top-wrap.top,w:r.width,h:r.height};});
      var svg=d3.select('#links').attr('viewBox','0 0 '+wrap.width+' '+wrap.height);svg.selectAll('*').remove();
      svg.append('defs').append('marker').attr('id','arrow11').attr('viewBox','0 0 10 10').attr('refX',8).attr('refY',5).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto-start-reverse').append('path').attr('d','M 0 0 L 10 5 L 0 10 z').attr('fill','context-stroke');
      svg.selectAll('path.link').data(d3.range(3)).join('path').attr('class',function(i){return 'link '+(state[i]&&state[i+1]&&state[i]===order[i]&&state[i+1]===order[i+1]?'on':(i===bad?'bad':''));}).attr('marker-end','url(#arrow11)').attr('d',function(i){var a=boxes[i],b=boxes[i+1];return 'M'+(a.x+a.w)+' '+(a.y+a.h/2)+' L'+(b.x-8)+' '+(b.y+b.h/2);});
    }
    function render(){
      var firstBad=-1; for(var i=0;i<4;i++){if(state[i]&&state[i]!==order[i]){firstBad=i;break;}}
      d3.selectAll('.slot').each(function(i){var id=state[i], item=items.find(x=>x.id===id), s=d3.select(this);s.classed('filled',!!id).classed('break',i===firstBad).html(item?'<span class="slot-title">'+item.title+'</span><span class="slot-copy">'+item.copy+'</span>':'<span class="label muted">第'+(i+1)+'步</span>');});
      d3.selectAll('.tile').classed('placed',d=>state.indexOf(d.id)>=0);
      var done=state.every((x,i)=>x===order[i]);
      var prompts=['筛选的材料从哪里来？','差异怎样影响下一代？','改变发生在个体还是群体？'];
      d3.select('#feedback').text(done?'发生改变的是多代后的群体比例，不是个体按需升级。':firstBad>=0?prompts[Math.min(firstBad,2)]:'继续连接：每一步都不能跳过。');
      d3.select('#after').classed('show',done);d3.select('#reset').classed('show',done);drawLinks(firstBad);
    }
    document.getElementById('reset').addEventListener('click',function(){state=[null,null,null,null];keyTarget=0;d3.select('#after').classed('show',false);d3.select('#reset').classed('show',false);render();});
    Deck.onResize(function(){drawLinks(-1);});
    render();
  </script>
</body>
</html>
