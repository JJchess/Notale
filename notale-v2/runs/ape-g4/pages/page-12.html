<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .body-ledger{display:flex;width:100%;height:100%;gap:var(--sp-7);min-width:0;min-height:0}
    .intro{flex:0 0 280px;box-sizing:border-box;padding:var(--sp-5) var(--sp-5) var(--sp-5) 0;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:var(--sp-5);min-width:0}
    .intro-mark{width:var(--sp-8);height:4px;background:var(--accent)}
    .intro .lead{color:var(--text)}
    .intro .secondary{padding-top:var(--sp-4);border-top:1px solid var(--line)}
    .system-board{position:relative;flex:1 1 auto;min-width:0;height:100%;overflow:hidden;background:var(--surface-soft);border:1px solid var(--line);border-radius:var(--radius-lg)}
    .system-board::before{content:"";position:absolute;inset:var(--sp-4);border:1px dashed var(--line);border-radius:var(--radius-md);pointer-events:none}
    .plate-label{position:absolute;left:50%;top:50%;z-index:4;transform:translate(-50%,-50%);padding:var(--sp-2) var(--sp-3);color:var(--accent-strong);background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius-sm);font-size:var(--fs-label);line-height:1.4;font-weight:700;white-space:nowrap}
    .wire{position:absolute;inset:0;width:100%;height:100%;color:var(--line-strong);pointer-events:none}
    .wire .bodyline{fill:none;stroke:var(--line-strong);stroke-width:2}
    .wire .guide{fill:none;stroke:var(--line-strong);stroke-width:1.5;stroke-dasharray:6 6}
    .wire .relation{fill:none;stroke:var(--accent);stroke-width:1.5}
    .wire .joint{fill:var(--surface);stroke:var(--accent);stroke-width:2}
    .k-enumeration.obs{position:absolute;z-index:3;inset:var(--sp-5);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:var(--sp-8) var(--sp-5);align-items:stretch}
    .k-enumeration.obs>.it{position:relative;padding:var(--sp-3) var(--sp-4);border-top-width:3px;border-radius:var(--radius-sm);box-shadow:none;display:flex;flex-direction:column;justify-content:center;min-height:0}
    .k-enumeration.obs>.it:nth-child(2),.k-enumeration.obs>.it:nth-child(5){margin-left:var(--sp-5);margin-right:var(--sp-5)}
    .k-enumeration.obs>.it>.it-title{margin-bottom:var(--sp-2);font-size:var(--fs-body);line-height:var(--lh-tight)}
    .k-enumeration.obs>.it>.it-body{font-size:var(--fs-label);line-height:1.4;color:var(--muted);white-space:nowrap}
  </style>
</head>
<body data-page="12" data-total="50">
  <div id="stage">
  <main id="main">
    <div class="body-ledger" aria-label="六个彼此牵制的身体观察面">
      <div class="intro min0">
        <div class="intro-mark" aria-hidden="true"></div>
        <p class="lead">接下来不找哪个特征单独创造了人类，而看行走、运动、脑、手、饮食、成长与合作如何彼此牵制。</p>
        <p class="secondary">人的身体不是完美零件的集合，而是一组共同工作的折中。</p>
      </div>

      <div class="system-board min0">
        <svg class="wire" viewBox="0 0 1080 620" aria-hidden="true">
          <path class="bodyline" d="M540 210c-27 0-48-21-48-48s21-48 48-48 48 21 48 48-21 48-48 48zm-22 8c-22 38-30 85-22 130l-28 84m94-214c22 38 30 85 22 130l28 84m-116-84 44 42 44-42m-44 42v92m-44-146-60 72m168-72 60 72m-104 74-42 90m42-90 42 90"/>
          <path class="guide" d="M478 318H326V150H270M602 318h152V150h56M468 408H334v86H270M612 408h134v86h64M520 162H430V96H270M560 162h90V96h160"/>
          <path class="relation" d="M120 286V334M540 286V334M960 286V334"/>
          <path class="relation" d="M114 314l6 8 6-8m-12-8 6-8 6 8M534 314l6 8 6-8m-12-8 6-8 6 8M954 314l6 8 6-8m-12-8 6-8 6 8"/>
          <circle class="joint" cx="478" cy="318" r="5"/><circle class="joint" cx="602" cy="318" r="5"/><circle class="joint" cx="468" cy="408" r="5"/><circle class="joint" cx="612" cy="408" r="5"/><circle class="joint" cx="520" cy="162" r="5"/><circle class="joint" cx="560" cy="162" r="5"/>
        </svg>
        <div class="k-enumeration obs">
          <article class="it min0"><h2 class="it-title">行走结构</h2><p class="it-body">支撑 / 平衡 / 受力</p></article>
          <article class="it min0"><h2 class="it-title">脑与能量</h2><p class="it-body">连接 / 能量 / 成本</p></article>
          <article class="it min0"><h2 class="it-title">手与抓握</h2><p class="it-body">力量握 / 精细握 / 反馈</p></article>
          <article class="it min0"><h2 class="it-title">运动方式</h2><p class="it-body">重心 / 步态 / 耐力</p></article>
          <article class="it min0"><h2 class="it-title">饮食与成长</h2><p class="it-body">食物线索 / 发育 / 照料</p></article>
          <article class="it min0"><h2 class="it-title">合作网络</h2><p class="it-body">共享注意 / 分工 / 网络</p></article>
        </div>
        <div class="plate-label">约束 ↔ 机会</div>
      </div>
    </div>
  </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 12,
      kicker: "BODY AS A SYSTEM",
      title: "不是一个“第一特征”",
      take: "接下来不找“人类第一特征”，而看一组彼此牵制的身体变化。"
    });
    Deck.init({ index: 12, total: 50 });
    var stage = document.getElementById("stage");
  </script>
</body>
</html>
