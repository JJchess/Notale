<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .p13{height:100%;display:flex;flex-direction:column;gap:var(--sp-3)}
    .viewer{position:relative;flex:1 1 0;min-height:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft)}
    .viewer canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
    .viewer canvas:active{cursor:grabbing}.viewer canvas:focus-visible{box-shadow:inset 0 0 0 4px var(--focus)}
    .model-heads{position:absolute;inset:var(--sp-3) var(--sp-5) auto;display:grid;grid-template-columns:1fr 1fr;pointer-events:none}
    .model-heads span{text-align:center;font-size:var(--fs-h2);font-weight:720;line-height:1.3}.model-heads .sub{display:block;margin-top:var(--sp-1);font-size:var(--fs-sec);font-weight:400;color:var(--muted)}
    .midline{position:absolute;top:var(--sp-5);bottom:var(--sp-5);left:50%;width:1px;background:var(--line);pointer-events:none}
    .view-note{position:absolute;right:var(--sp-4);bottom:var(--sp-3);display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);font-size:var(--fs-label);line-height:1.4;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm)}
    .reset{min-height:40px;padding:var(--sp-2) var(--sp-4)}
    .compare-wrap{flex:0 0 202px;min-height:0}.k-comparison{height:100%;--cmp-cols:minmax(150px,.55fr) repeat(2,minmax(0,1fr));font-size:var(--fs-sec);line-height:var(--lh-copy)}
    .k-comparison>*{padding:var(--sp-2) var(--sp-4)}.k-comparison>.hdr{min-height:34px;font-size:var(--fs-body)}
    .k-comparison>.dim{justify-content:flex-start;text-align:left}.k-comparison>.cell{transition:background .15s ease}
    .k-comparison>.cell.active{background:var(--accent-soft)}
    .k-comparison>.rowline{height:1px;padding:0}
  </style>
</head>
<body data-page="13" data-total="50">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/three.min.js"></script>
  <script>
    Lec.mount({index:13,kicker:"LOAD PATHS",title:"两足站立，改写了力穿过身体的路线",take:"两足行走改变了骨盆、脊柱与下肢的受力关系。"});
    Deck.init({index:13,total:50});
    var stage=document.getElementById("main");
    stage.innerHTML='<div class="p13"><section class="viewer no-pan" aria-label="同步旋转的两具简化骨架"><canvas tabindex="0" role="application" aria-label="同步旋转的两具简化骨架。箭头从躯干经骨盆、髋、膝、踝指向地面，只表示路径。拖动或按方向键旋转"></canvas><div class="model-heads"><span>人类两足体</span><span>非人猿类概括性对照体<small class="sub">教学概括；不是人类祖先，也不代表所有猿类</small></span></div><div class="midline"></div><div class="view-note"><span id="viewText" aria-live="polite">前外侧：看骨盆与股骨排列</span><button class="reset" type="button">回到前外侧</button></div></section><section class="compare-wrap"><div class="k-comparison"><div class="dim">比较维度</div><div class="hdr">人类两足体</div><div class="hdr">概括性对照体</div><div class="rowline"></div><div class="dim">骨盆</div><div class="cell active" data-view="front">短而宽；重量由骶骨分向两侧髋部</div><div class="cell active" data-view="front">相对长而窄；适配不同的攀爬与移动方式</div><div class="rowline"></div><div class="dim">脊柱</div><div class="cell" data-view="side">腰椎曲线让重量接近双足支撑区</div><div class="cell" data-view="side">曲线与躯干姿态不同，不按持续直立组织</div><div class="rowline"></div><div class="dim">股骨—膝</div><div class="cell active" data-view="front">股骨向内收，膝与足更靠近中线</div><div class="cell active" data-view="front">不呈现同程度的人类式内收排列</div><div class="rowline"></div><div class="dim">足部—受力路径</div><div class="cell" data-view="side">躯干—骨盆—髋—膝—踝—地面连续传力</div><div class="cell" data-view="side">抓握、攀爬与地面支撑功能组合不同</div></div></section></div>';

    var canvas=stage.querySelector("canvas"), viewer=stage.querySelector(".viewer");
    var scene=new THREE.Scene();
    scene.background=new THREE.Color(Deck.token("surface"));
    var camera=new THREE.PerspectiveCamera(30,1,.1,100);camera.position.set(0,3.7,14);camera.lookAt(0,3.25,0);
    var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:false});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    scene.add(new THREE.HemisphereLight(Deck.token("surface"),Deck.token("surface-strong"),2.1));
    var light=new THREE.DirectionalLight(Deck.token("surface"),3.2);light.position.set(-4,8,6);light.castShadow=true;scene.add(light);
    var bone=new THREE.MeshStandardMaterial({color:new THREE.Color(Deck.token("line-strong")),roughness:.7,metalness:.05});
    var joint=new THREE.MeshStandardMaterial({color:new THREE.Color(Deck.token("muted")),roughness:.62});
    var accent=new THREE.MeshStandardMaterial({color:new THREE.Color(Deck.token("accent")),roughness:.45,transparent:true,opacity:.82});
    var groundMat=new THREE.MeshStandardMaterial({color:new THREE.Color(Deck.token("surface-soft")),roughness:1});
    function mesh(g,m,p,parent){var o=new THREE.Mesh(g,m);o.position.set(p[0],p[1],p[2]);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
    function boneBetween(a,b,r,mat,parent){var av=new THREE.Vector3(a[0],a[1],a[2]),bv=new THREE.Vector3(b[0],b[1],b[2]),d=av.distanceTo(bv);var o=mesh(new THREE.CylinderGeometry(r,r,d,12),mat||bone,[0,0,0],parent);o.position.copy(av).add(bv).multiplyScalar(.5);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),bv.clone().sub(av).normalize());return o}
    function arrow(a,b,parent){boneBetween(a,b,.045,accent,parent);var bv=new THREE.Vector3(b[0],b[1],b[2]);var av=new THREE.Vector3(a[0],a[1],a[2]);var c=mesh(new THREE.ConeGeometry(.13,.32,12),accent,b,parent);c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),bv.clone().sub(av).normalize());}
    function skeleton(x,human){var g=new THREE.Group();g.position.x=x;scene.add(g);var pelvisY=3.2, hip=human?.72:.48, knee=human?.34:.55, foot=human?.40:.58;
      mesh(new THREE.BoxGeometry(human?1.55:1.05,human?.55:.88,.62),bone,[0,pelvisY,0],g).rotation.z=human?0:.08;
      mesh(new THREE.SphereGeometry(.17,14,10),joint,[-hip,pelvisY-.18,0],g);mesh(new THREE.SphereGeometry(.17,14,10),joint,[hip,pelvisY-.18,0],g);
      var spinePts=human?[[0,3.45,0],[.10,3.9,-.08],[-.05,4.38,.05],[0,4.85,0]]:[[0,3.58,0],[0,4.05,.14],[0,4.52,.30],[0,4.9,.42]];
      for(var i=0;i<spinePts.length-1;i++)boneBetween(spinePts[i],spinePts[i+1],.14,bone,g);
      [[-hip,-knee],[hip,knee]].forEach(function(v){var hx=v[0],kx=v[1];boneBetween([hx,3.02,0],[kx,1.68,0],.13,bone,g);mesh(new THREE.SphereGeometry(.15,14,10),joint,[kx,1.64,0],g);boneBetween([kx,1.53,0],[human?kx:kx*1.08,.36,0],.11,bone,g);mesh(new THREE.BoxGeometry(.38,.16,.82),bone,[human?kx:kx*1.08,.18,.24],g)});
      arrow([0,4.72,.3],[0,3.48,.2],g);arrow([0,3.42,.2],[-hip,2.88,.12],g);arrow([0,3.42,.2],[hip,2.88,.12],g);arrow([-hip,2.82,.12],[-knee,.42,.12],g);arrow([hip,2.82,.12],[knee,.42,.12],g);
      return g}
    var left=skeleton(-2.25,true),right=skeleton(2.25,false);var groups=[left,right];
    var floor=mesh(new THREE.PlaneGeometry(9,2.7),groundMat,[0,.04,.15],scene);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;
    var yaw=-.42,pitch=.08,down=false,last=null;
    function setRotation(){groups.forEach(function(g){g.rotation.y=yaw;g.rotation.x=pitch});updateView();render()}
    function updateView(){var y=((yaw%(Math.PI*2))+Math.PI*2)%(Math.PI*2),kind="front",text="前外侧：看骨盆与股骨排列";if(y>Math.PI*.25&&y<Math.PI*.75||y>Math.PI*1.25&&y<Math.PI*1.75){kind="side";text="侧面：看脊柱、骨盆与足底关系"}else if(y>=Math.PI*.75&&y<=Math.PI*1.25){text="后侧：看骨盆两侧的稳定位置"}document.getElementById("viewText").textContent=text;stage.querySelectorAll(".cell").forEach(function(c){c.classList.toggle("active",c.dataset.view===kind)})}
    function resize(){var w=viewer.clientWidth,h=viewer.clientHeight;renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();render()}
    function render(){renderer.render(scene,camera)}
    canvas.addEventListener("pointerdown",function(e){down=true;last=Deck.pt(canvas,e);canvas.setPointerCapture(e.pointerId)});
    canvas.addEventListener("pointermove",function(e){if(!down)return;var p=Deck.pt(canvas,e);yaw+=(p.x-last.x)*.008;pitch=Deck.clamp(pitch+(p.y-last.y)*.006,-.55,.55);last=p;setRotation()});
    function end(){down=false;last=null}canvas.addEventListener("pointerup",end);canvas.addEventListener("pointercancel",end);
    canvas.addEventListener("keydown",function(e){var k=e.shiftKey?.18:.08;if(e.key==="ArrowLeft")yaw-=k;else if(e.key==="ArrowRight")yaw+=k;else if(e.key==="ArrowUp")pitch=Deck.clamp(pitch-k,-.55,.55);else if(e.key==="ArrowDown")pitch=Deck.clamp(pitch+k,-.55,.55);else return;e.preventDefault();setRotation()});
    stage.querySelector(".reset").addEventListener("click",function(){yaw=-.42;pitch=.08;setRotation();canvas.focus()});
    Deck.onResize(resize);resize();setRotation();
  </script>
</body>
</html>
