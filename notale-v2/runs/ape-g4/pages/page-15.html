<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:var(--sp-3)}
    .evidence{--cmp-cols:minmax(132px,.56fr) repeat(2,minmax(0,1fr));font-size:var(--fs-sec);line-height:var(--lh-copy)}
    .evidence>*{padding:var(--sp-2) var(--sp-3)}
    .evidence>.hdr{min-height:34px;font-size:var(--fs-body);align-items:center}
    .evidence>.dim{gap:var(--sp-2);justify-content:space-between;text-align:left}
    .tag{display:inline-flex;flex:0 0 auto;padding:var(--sp-1) var(--sp-2);border-radius:var(--radius-sm);background:var(--accent-soft);color:var(--accent-strong);font-size:var(--fs-label);line-height:1.4}
    heat-race{display:block;min-height:0;flex:1 1 auto}
    .race{height:100%;display:flex;flex-direction:column;gap:var(--sp-2)}
    .race-top{display:flex;align-items:center;gap:var(--sp-2)}
    .race-top .task{flex:1 1 auto;font-size:var(--fs-sec);line-height:var(--lh-copy)}
    .race-top button{min-height:36px;padding:var(--sp-1) var(--sp-3)}
    .race-top button[aria-pressed="true"]{color:var(--accent-strong);background:var(--accent-soft);border-color:var(--accent)}
    .race-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.72fr);gap:var(--sp-3);min-height:0;flex:1 1 auto}
    .race-body>.min0{min-height:0}
    .track{position:relative;display:flex;flex-direction:column;justify-content:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
    .trackline{height:9px;background:var(--surface-strong);border-radius:999px;overflow:hidden}
    .runner{height:100%;width:50%;border-radius:999px;background:var(--accent);transition:width .25s ease,background .25s ease}
    .status{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3)}
    .status strong{font-size:var(--fs-h2);line-height:1.3}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2)}
    .metric{padding:var(--sp-2) var(--sp-3);background:var(--surface-soft);border-radius:var(--radius-sm)}
    .metric b{display:block;font-size:var(--fs-h2);line-height:1.2;font-variant-numeric:tabular-nums}
    .metric span{font-size:var(--fs-label);color:var(--muted)}
    .bars{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:var(--sp-1) var(--sp-2);font-size:var(--fs-label)}
    .bar{height:12px;background:var(--surface-strong);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--warning)}
    .bar.cool i{background:var(--cyan)}
    .controls{display:flex;flex-direction:column;gap:var(--sp-2)}
    .controls .ctl{padding:var(--sp-2) var(--sp-3)}
    .ctl output{min-width:74px;text-align:right;font-size:var(--fs-label);font-variant-numeric:tabular-nums}
    .model-note{font-size:var(--fs-label);color:var(--muted)}
    @media (prefers-reduced-motion:reduce){.runner{transition:none}}
  </style>
</head>
<body data-page="15" data-total="50">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.K.evidenceLabels=Lec.K.evidenceLabels||["较确定","有支持但仍争议","模型推测"];
    Lec.K.bodyMassReferenceKg=Lec.K.bodyMassReferenceKg||70;
    Lec.K.waterDensityKgM3=Lec.K.waterDensityKgM3||1000;
    Lec.K.p15MinutesPerHour=Lec.K.p15MinutesPerHour||60;
    Lec.K.p15WaterLatentHeatJPerKg=Lec.K.p15WaterLatentHeatJPerKg||2430000;
    Lec.K.p15HeatModel=Lec.K.p15HeatModel||{skinTemperatureC:34,bodyAreaCoefficient:0.202,convectiveCoefficient:7,radiativeCoefficient:5,statusThresholdsW:[0,180]};
    Lec.K.p15HeatRaceScenarios=Lec.K.p15HeatRaceScenarios||{
      activity:{min:3,max:12,step:.5},
      dryWind:{activityWPerKg:7,airTemperatureC:32,relativeHumidityRatio:.25,windSpeedMPerS:3,sweatRateLPerHour:1.1,durationMinutes:45,paceMinutesPerKm:6,externalMechanicalPowerW:105},
      humidLowWind:{activityWPerKg:7,airTemperatureC:32,relativeHumidityRatio:.8,windSpeedMPerS:.3,sweatRateLPerHour:1.1,durationMinutes:45,paceMinutesPerKm:6,externalMechanicalPowerW:105}
    };
    (function(P,K,M){
      P.p15CelsiusToKelvin=P.p15CelsiusToKelvin||function(c){return c+273.15};
      P.p15MetabolicPower=P.p15MetabolicPower||function(wkg,kg){return wkg*kg};
      P.p15HeatProduction=P.p15HeatProduction||function(m,e){return m-e};
      P.p15SaturationVaporPressure=P.p15SaturationVaporPressure||function(k){let c=k-273.15;return 610.94*Math.exp(17.625*c/(c+243.04))};
      P.p15AmbientVaporPressure=P.p15AmbientVaporPressure||function(s,r){return s*r};
      P.p15SweatEvaporationPower=P.p15SweatEvaporationPower||function(lph,density,latent){return (lph/1000*density*latent)/3600};
      P.p15EvaporationEfficiency=P.p15EvaporationEfficiency||function(k,rh,wind){return Math.max(0,Math.min(1,(1-rh)*(.55+.12*wind)))};
      P.p15EffectiveEvaporativeCooling=P.p15EffectiveEvaporativeCooling||function(w,e){return w*e};
      P.p15DryHeatExchange=P.p15DryHeatExchange||function(kg,k,wind){let area=M.bodyAreaCoefficient*Math.pow(kg,.425)*Math.pow(170,.725)/100;return area*(M.convectiveCoefficient*Math.sqrt(Math.max(wind,.1))+M.radiativeCoefficient)*(M.skinTemperatureC-(k-273.15))};
      P.p15TotalCooling=P.p15TotalCooling||function(e,d){return e+d};
      P.p15HeatGap=P.p15HeatGap||function(h,c){return h-c};
      P.p15AccumulatedHeat=P.p15AccumulatedHeat||function(g,s){return g*s/1000};
      P.p15Distance=P.p15Distance||function(min,pace){return min/pace};
      P.p15HeatStatus=P.p15HeatStatus||function(g,t){return g<=t[0]?"可持续推进":g<=t[1]?"热量正在积累":"需要降速或改善散热"};
    })(Lec.P,Lec.K,Lec.K.p15HeatModel);
    class HeatRace extends HTMLElement{
      connectedCallback(){
        this.innerHTML=`<section class="race" aria-label="跑步散热赛">
          <div class="race-top"><p class="task">保持同一活动强度，切换环境；再调节强度，使散热追上产热。</p>
            <button type="button" data-scene="dry" aria-pressed="true">干热有风</button><button type="button" data-scene="humid" aria-pressed="false">湿热少风</button><button type="button" data-reset>重置</button></div>
          <div class="race-body">
            <div class="track min0">
              <div class="status"><strong data-status aria-live="polite"></strong><span class="label" data-distance></span></div>
              <div class="trackline" aria-hidden="true"><div class="runner"></div></div>
              <div class="bars"><span>产热</span><div class="bar"><i data-heatbar></i></div><b data-heat></b><span>可散热</span><div class="bar cool"><i data-coolbar></i></div><b data-cool></b></div>
              <div class="metrics"><div class="metric"><b data-gap></b><span>热量缺口</span></div><div class="metric"><b data-net></b><span>赛程净热量</span></div><div class="metric"><b data-env></b><span>当前环境</span></div></div>
            </div>
            <div class="controls min0"><div class="ctl"><label for="intensity">活动强度</label><input id="intensity" type="range"><output data-intensity></output></div><p class="note">现实天气通常不能由跑者控制；模型只比较热账本，不证明演化起因。</p><div class="model-note">教学简化模型｜参考体质量 <span data-mass></span></div></div>
          </div></section>`;
        this.cfg=Lec.K.p15HeatRaceScenarios; this.model=Lec.K.p15HeatModel;
        this.presets=this.pickPresets(this.cfg); this.scene="dry";
        this.range=this.findRange(this.cfg,"activity");
        let input=this.querySelector("#intensity"); input.min=this.range.min;input.max=this.range.max;input.step=this.range.step;input.value=this.presets.dry.activityWPerKg;
        this.state={scene:this.scene,activityWPerKg:Number(input.value)};
        this.querySelectorAll("[data-scene]").forEach(b=>b.addEventListener("click",()=>this.setScene(b.dataset.scene)));
        input.addEventListener("input",()=>{this.state.activityWPerKg=Number(input.value);this.update("intensity")});
        this.querySelector("[data-reset]").addEventListener("click",()=>this.reset()); this.update("start");
      }
      pickPresets(c){
        let objs=Object.values(c).filter(v=>v&&typeof v==="object"&&("activityWPerKg" in v));
        let dry=c.dryWind||c.dryHotWindy||c.dryHeatWind||objs[0]; let humid=c.humidLowWind||c.humidHotStill||c.humidHeatLowWind||objs[1];
        return {dry:dry,humid:humid};
      }
      findRange(c,key){
        let o=c[key]||c.activityIntensity||c.activityWPerKg||{};
        return {min:o.min, max:o.max, step:o.step};
      }
      setScene(name){this.scene=name;this.state.scene=name;this.querySelectorAll("[data-scene]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.scene===name)));this.update("scene")}
      reset(){let p=this.presets[this.scene],i=this.querySelector("#intensity");this.state.activityWPerKg=p.activityWPerKg;i.value=p.activityWPerKg;this.update("reset");this.dispatchEvent(new CustomEvent("game-reset",{bubbles:true,composed:true}))}
      start(){this.dispatchEvent(new CustomEvent("game-start",{bubbles:true,composed:true}));this.update("start")}
      getState(){return JSON.parse(JSON.stringify(this.state))}
      update(action){
        let p=this.presets[this.scene], mass=Lec.K.bodyMassReferenceKg, P=Lec.P;
        let tempK=P.p15CelsiusToKelvin(p.airTemperatureC), metabolic=P.p15MetabolicPower(this.state.activityWPerKg,mass), heat=P.p15HeatProduction(metabolic,p.externalMechanicalPowerW);
        let sat=P.p15SaturationVaporPressure(tempK), vapor=P.p15AmbientVaporPressure(sat,p.relativeHumidityRatio);
        let theo=P.p15SweatEvaporationPower(p.sweatRateLPerHour,Lec.K.waterDensityKgM3,Lec.K.p15WaterLatentHeatJPerKg);
        let rawEff=P.p15EvaporationEfficiency(tempK,p.relativeHumidityRatio,p.windSpeedMPerS), eff=P.finite(rawEff)?P.clamp(rawEff,0,1):0;
        let evap=P.p15EffectiveEvaporativeCooling(theo,eff), dry=P.p15DryHeatExchange(mass,tempK,p.windSpeedMPerS), cool=P.p15TotalCooling(evap,dry);
        let gap=P.p15HeatGap(heat,cool), sec=P.hoursToSeconds(p.durationMinutes/Lec.K.p15MinutesPerHour), net=P.p15AccumulatedHeat(gap,sec), dist=P.p15Distance(p.durationMinutes,p.paceMinutesPerKm), status=P.p15HeatStatus(gap,this.model.statusThresholdsW);
        let fmt=n=>String(P.roundTo(n,0)), fmt1=n=>String(P.roundTo(n,1));
        this.querySelector("[data-status]").textContent=status;this.querySelector("[data-distance]").textContent=fmt1(dist)+" km · "+P.formatDuration(sec);
        this.querySelector("[data-heat]").textContent=fmt(heat)+" W";this.querySelector("[data-cool]").textContent=fmt(cool)+" W";this.querySelector("[data-gap]").textContent=fmt(gap)+" W";this.querySelector("[data-net]").textContent=fmt(net)+" kJ";
        this.querySelector("[data-env]").textContent=this.scene==="dry"?"干热有风":"湿热少风";this.querySelector("[data-intensity]").textContent=fmt1(this.state.activityWPerKg)+" W/kg";this.querySelector("[data-mass]").textContent=fmt(mass)+" kg";
        let max=Math.max(heat,Math.abs(cool),1);this.querySelector("[data-heatbar]").style.width=(Math.max(0,heat)/max*100)+"%";this.querySelector("[data-coolbar]").style.width=(Math.max(0,cool)/max*100)+"%";
        let progress=gap<=this.model.statusThresholdsW[0]?100:gap<=this.model.statusThresholdsW[1]?68:38;this.querySelector(".runner").style.width=progress+"%";
        let detail={state:this.getState(),action:action,metrics:{heatProductionW:heat,totalCoolingW:cool,heatGapW:gap,accumulatedHeatKJ:net,distanceKm:dist,status:status,vaporPressurePa:vapor}};
        this.dispatchEvent(new CustomEvent("game-progress",{detail:detail,bubbles:true,composed:true}));if(progress===100)this.dispatchEvent(new CustomEvent("game-complete",{detail:{score:dist,metrics:detail.metrics,trace:[]},bubbles:true,composed:true}));
      }
    }
    customElements.define("heat-race",HeatRace);
    Lec.mount({index:15,kicker:"BODY × HEAT",title:"跑得久，是否因为更会散热？",take:"直立、出汗和耐力活动可能协同，但不存在单一公认起因。"});
    Deck.init({index:15,total:50});
    var stage=document.getElementById("stage"), main=document.getElementById("main");
    var labels=Lec.K.evidenceLabels;
    function label(i){return Array.isArray(labels)?labels[i]:labels[i===0?"certain":"supportedDisputed"]||labels[i===0?"high":"medium"]||Object.values(labels)[i]}
    main.innerHTML=`<section class="k-comparison evidence" aria-label="协同证据与推断边界">
      <div class="hdr">比较维度</div><div class="hdr">支持“可能协同”</div><div class="hdr">不能据此推出</div>
      <div class="dim">姿势与受热 <span class="tag">${label(1)}</span></div><div class="cell">直立可能减少正午迎光面积，并接触较高处气流。</div><div class="cell">直立并非只受散热影响，也不能写成预定目标。</div><div class="rowline"></div>
      <div class="dim">体表与蒸发 <span class="tag">${label(0)}</span></div><div class="cell">全身出汗与较少体毛，有利于蒸发带走热量。</div><div class="cell diff" data-limit>高湿、低风、缺水或汗未蒸发都会削弱收益。</div><div class="rowline"></div>
      <div class="dim">活动方式 <span class="tag">${label(1)}</span></div><div class="cell">适宜环境、配速和补水可支持较久的中低强度活动。</div><div class="cell">不能推成所有早期人类都以长跑狩猎为主。</div><div class="rowline"></div>
      <div class="dim">证据性质</div><div class="cell">生理实验、解剖比较与部分民族志可共同支持假说。</div><div class="cell">证据不足以唯一判定时间、场景或单一起因。</div>
    </section><heat-race></heat-race>`;
  </script>
</body>
</html>
