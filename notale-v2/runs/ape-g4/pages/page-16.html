<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    pelvis-tradeoff-game{display:block;width:100%;height:100%}
    .p16{height:100%;gap:var(--sp-3)}
    .p16-task{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-5)}
    .p16-task p{font-size:var(--fs-sec);line-height:var(--lh-copy)}
    .p16-class{flex:1;min-height:0;gap:var(--sp-3)}
    .p16-parent{height:100%;display:flex;flex-direction:column}
    .p16-parent>.bc{display:flex;flex-direction:column;gap:var(--sp-3);min-height:0;flex:1}
    .p16-work{display:flex;gap:var(--sp-4);min-height:0;flex:1}
    .p16-model{position:relative;flex:0 0 43%;min-width:0;min-height:0;background:var(--surface-soft);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden}
    #pelvis-canvas{position:absolute;inset:0}
    .p16-model-label{position:absolute;left:var(--sp-4);top:var(--sp-3);z-index:2}
    .p16-model-label strong{display:block;font-size:var(--fs-h2);line-height:1.3}
    .p16-model-label span{font-size:var(--fs-label);color:var(--muted)}
    .p16-controls{flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--sp-3);min-width:0}
    .p16-controls .ctl{justify-content:space-between}
    .p16-controls select{width:190px}
    .p16-branches{display:flex!important;flex-direction:row!important;margin-left:0!important;padding-left:var(--sp-5)!important;gap:var(--sp-3)!important;min-height:158px}
    .p16-branches:before{content:"";position:absolute;left:0;top:50%;width:var(--sp-5);height:3px;background:var(--line-strong)}
    .p16-branch{flex:1;min-width:0}
    .p16-branch .bc{display:flex;gap:var(--sp-3);align-items:flex-start}
    .p16-status{flex:0 0 auto;font-weight:760;padding:var(--sp-1) var(--sp-3);border-radius:var(--radius-sm);background:var(--surface-soft)}
    .p16-branch[data-state="有利"] .p16-status{color:var(--success);background:var(--success-soft)}
    .p16-branch[data-state="受限"] .p16-status{color:var(--danger);background:var(--danger-soft)}
    .p16-desc{font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--muted)}
    .p16-bottom{display:flex;align-items:center;gap:var(--sp-4)}
    .p16-feedback{flex:1;font-size:var(--fs-sec);line-height:var(--lh-copy)}
  </style>
</head>
<body data-page="16" data-total="50">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/konva.min.js"></script>
  <script>
    Lec.mount({
      index: 16,
      kicker: "BODY / TRADE-OFF",
      title: "骨盆要同时完成几种任务",
      take: "骨盆同时承担行走、支撑与分娩，多目标不会产生完美结构。"
    });
    Deck.init({ index: 16, total: 50 });

    class PelvisTradeoffGame extends HTMLElement {
      constructor(){ super(); this.state=this.fresh(); this.trace=[]; }
      fresh(){ return {hip:null,channel:null,ring:null,status:["可行","可行","可行"],complete:false}; }
      connectedCallback(){
        this.innerHTML=`<div class="p16 col">
          <div class="p16-task"><p>为三个插槽选择结构方案，观察同一改变怎样同时影响三项目标。</p></div>
          <div class="k-classification p16-class min0">
            <div class="box p16-parent min0"><div class="bt">多目标骨盆：一个结构同时响应三项目标</div><div class="bc min0">
              <div class="p16-work min0">
                <div class="p16-model min0" aria-label="简化骨盆结构图：躯干承重区连接左右髋关节，中央为盆腔通道"><div class="p16-model-label"><strong>骨盆结构</strong><span>连接躯干、下肢与盆腔</span></div><div id="pelvis-canvas"></div></div>
                <div class="p16-controls min0">
                  <div class="ctl"><label for="hip">髋关节位置</label><select id="hip"><option value="">选择模块</option><option value="0">更偏外</option><option value="1">居中</option><option value="2">更偏内</option></select></div>
                  <div class="ctl"><label for="channel">通道轮廓</label><select id="channel"><option value="">选择模块</option><option value="0">偏紧凑</option><option value="1">居中</option><option value="2">偏开阔</option></select></div>
                  <div class="ctl"><label for="ring">承重环形态</label><select id="ring"><option value="">选择模块</option><option value="0">偏轻窄</option><option value="1">居中</option><option value="2">偏厚宽</option></select></div>
                </div>
              </div>
              <div class="lv p16-branches">
                <div class="box p16-branch" data-i="0"><div class="bt">行走 · 传力与稳定</div><div class="bc"><span class="p16-status">待装配</span><span class="p16-desc">力传向下肢，髋关节保持可用。</span></div></div>
                <div class="box p16-branch" data-i="1"><div class="bt">支撑 · 承托与连接</div><div class="bc"><span class="p16-status">待装配</span><span class="p16-desc">稳定环保留附着与承托边界。</span></div></div>
                <div class="box p16-branch" data-i="2"><div class="bt">分娩 · 通过空间</div><div class="bc"><span class="p16-status">待装配</span><span class="p16-desc">入口、中段与出口共同可通过。</span></div></div>
              </div>
            </div></div>
          </div>
          <div class="p16-bottom"><div class="p16-feedback note" aria-live="polite">先装入任一模块；三条分支会同步更新。</div><button type="button" id="reset">重置</button></div>
        </div>`;
        this.sels=["hip","channel","ring"].map(id=>this.querySelector("#"+id));
        this.sels.forEach((s,i)=>s.addEventListener("change",()=>this.act(i,s.value)));
        this.querySelector("#reset").addEventListener("click",()=>this.reset());
        this.makeScene(); this.start();
      }
      makeScene(){
        this.ks=new Konva.Stage({container:this.querySelector("#pelvis-canvas"),width:570,height:250});
        this.layer=new Konva.Layer(); this.ks.add(this.layer); this.draw();
      }
      result(){
        var m=Lec.K.p16PelvisTradeoffModel, a=[this.state.hip,this.state.channel,this.state.ring];
        if(m){ var key=a.join("-"); var row=(m.combinations&&m.combinations[key])||(m.results&&m.results[key])||m[key]; if(row) return row.status||row.results||row; }
        var h=a[0],c=a[1],r=a[2], score=[0,0,0];
        score[0]=(h===1?1:0)+(c===2?-1:0)+(r===0?-1:0);
        score[1]=(r===2?1:r===0?-1:0)+(h===0?-1:0);
        score[2]=(c===2?1:c===0?-1:0)+(h===2?-1:0)+(r===2?-1:0);
        return score.map(v=>v>0?"有利":v<0?"受限":"可行");
      }
      act(i,val){
        var keys=["hip","channel","ring"], n=val===""?null:Lec.P.clamp(Lec.P.finite(Number(val),1),0,2);
        this.state[keys[i]]=n; this.trace.push({slot:keys[i],value:n});
        if([this.state.hip,this.state.channel,this.state.ring].every(v=>v!==null)) this.state.status=this.result();
        this.state.complete=this.state.status.every(x=>x!=="受限")&&[this.state.hip,this.state.channel,this.state.ring].every(v=>v!==null);
        this.render(i); this.dispatchEvent(new CustomEvent(this.state.complete?"game-complete":"game-progress",{bubbles:true,composed:true,detail:this.state.complete?{score:null,metrics:{status:this.state.status},trace:this.trace.slice()}:{state:this.getState(),action:"place",metrics:{status:this.state.status}}}));
      }
      render(changed){
        var filled=[this.state.hip,this.state.channel,this.state.ring].every(v=>v!==null);
        this.querySelectorAll(".p16-branch").forEach((el,i)=>{var s=filled?this.state.status[i]:"待装配";el.dataset.state=s;el.querySelector(".p16-status").textContent=s;});
        var f=this.querySelector(".p16-feedback");
        if(!filled) f.textContent="继续装配；完整组合会同时检验三项目标。";
        else if(this.state.complete) f.textContent="可行组合：三个目标都能工作，但没有一个目标被无限最大化。";
        else if(changed===1) f.textContent="通道更开阔，也会改变髋关节与承重环的关系。";
        else if(changed===2) f.textContent="承重结构更厚，并不自动让所有任务都更好。";
        else f.textContent="检查受限分支，再替换与它相连的模块。";
        this.draw();
      }
      draw(){ if(!this.layer)return; this.layer.destroyChildren(); var w=570,h=270, hip=this.state.hip==null?1:this.state.hip, ch=this.state.channel==null?1:this.state.channel, ring=this.state.ring==null?1:this.state.ring;
        var line=Deck.rgb("line-strong"), accent=Deck.rgb("accent"), soft=Deck.rgb("accent-soft"), xoff=[65,48,34][hip], hole=[42,58,76][ch], sw=[12,18,25][ring];
        this.layer.add(new Konva.Line({points:[285,54,220-xoff,92,160-xoff,190,224,225,285-hole/2,211],closed:true,fill:soft,stroke:accent,strokeWidth:sw,lineJoin:"round"}));
        this.layer.add(new Konva.Line({points:[285,54,350+xoff,92,410+xoff,190,346,225,285+hole/2,211],closed:true,fill:soft,stroke:accent,strokeWidth:sw,lineJoin:"round"}));
        this.layer.add(new Konva.Ellipse({x:285,y:177,radiusX:hole,radiusY:52,fill:Deck.rgb("surface"),stroke:line,strokeWidth:4}));
        this.layer.add(new Konva.Line({points:[285,35,285,70],stroke:line,strokeWidth:10,lineCap:"round"})); this.layer.draw(); }
      start(){this.dispatchEvent(new CustomEvent("game-start",{bubbles:true,composed:true}));}
      reset(){this.state=this.fresh();this.trace=[];this.sels.forEach(s=>s.value="");this.render();this.dispatchEvent(new CustomEvent("game-reset",{bubbles:true,composed:true}));}
      getState(){return JSON.parse(JSON.stringify(this.state));}
    }
    customElements.define("pelvis-tradeoff-game",PelvisTradeoffGame);
    document.getElementById("main").appendChild(document.createElement("pelvis-tradeoff-game"));
  </script>
</body>
</html>
