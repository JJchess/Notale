<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .p17{height:100%;display:flex;flex-direction:column;gap:var(--sp-3)}
    .p17-top{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4)}
    .p17-intro{font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--muted)}
    .p17 .ctl{padding:var(--sp-2) var(--sp-3)}
    .p17 .ctl button{min-width:44px;padding:var(--sp-2) var(--sp-3)}
    .compare-wrap{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:var(--radius-lg);box-shadow:var(--shadow-soft)}
    .p17-table{--cmp-cols:minmax(164px,.58fr) repeat(2,minmax(0,1fr));height:calc(100% - 2px);box-sizing:border-box;grid-template-rows:62px repeat(4,1fr)}
    .p17-table>.cell,.p17-table>.dim{position:relative;z-index:2;font-size:var(--fs-sec);line-height:var(--lh-copy)}
    .p17-table>.dim{justify-content:center;text-align:center;padding-right:var(--sp-4)}
    .p17-table>.hdr:first-child{font-size:var(--fs-label);color:var(--muted)}
    .p17-table>.ability{background:var(--accent-soft)}
    .p17-table>.cost{background:var(--warning-soft)}
    .cell strong{display:block;margin-right:var(--sp-2);color:var(--accent-strong)}
    .cost strong{color:var(--warning)}
    .body-map{position:absolute;z-index:3;left:148px;top:56px;width:64px;height:450px;pointer-events:none;opacity:.72}
    .reveal-layer{--reveal-x:50%;--reveal-y:30%;--reveal-radius:190px;position:absolute;z-index:5;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 0 50%,rgba(255,241,214,.9) 50% 100%);-webkit-mask-image:radial-gradient(circle var(--reveal-radius) at var(--reveal-x) var(--reveal-y),#000 0 42%,rgba(0,0,0,.72) 62%,rgba(0,0,0,.25) 84%,transparent 100%);mask-image:radial-gradient(circle var(--reveal-radius) at var(--reveal-x) var(--reveal-y),#000 0 42%,rgba(0,0,0,.72) 62%,rgba(0,0,0,.25) 84%,transparent 100%)}
    .lens-ring{position:absolute;z-index:6;width:calc(var(--reveal-radius) * 2);height:calc(var(--reveal-radius) * 2);left:var(--reveal-x);top:var(--reveal-y);transform:translate(-50%,-50%);border:2px solid var(--warning);border-radius:50%;pointer-events:none;box-shadow:0 0 0 4px rgba(154,90,0,.09)}
    .compare-wrap:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
    .floating-readout{position:absolute;z-index:8;right:var(--sp-4);top:74px;padding:var(--sp-2) var(--sp-3);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-sm);font-size:var(--fs-label);font-weight:700;box-shadow:var(--shadow-soft)}
    .ref-note{position:absolute;z-index:8;left:var(--sp-3);bottom:var(--sp-3);max-width:145px;font-size:var(--fs-label);line-height:1.4;color:var(--muted)}
  </style>
</head>
<body data-page="17" data-total="50">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
    Lec.mount({
      index: 17,
      kicker: "BIGGER, NOT FREE",
      title: "大脑变大，账单也变大",
      take: "更大的脑带来能力，也带来能量、发育和分娩成本。"
    });
    Deck.init({ index: 17, total: 50 });

    var main=document.getElementById("main");
    main.innerHTML='<section class="p17"><div class="p17-top"><p class="p17-intro">移动观察窗，对照能力条件与身体约束。<span id="massRef"></span> kg 是可调参考人物，不是标准人。</p><div class="ctl" aria-label="观察窗放大倍率"><label>局部放大</label><button type="button" id="zoomOut" aria-label="缩小观察窗">−</button><span id="zoomValue" class="label" aria-live="polite">1.0×</span><button type="button" id="zoomIn" aria-label="放大观察窗">＋</button></div></div><div class="compare-wrap no-pan" id="reveal" tabindex="0" role="application" aria-label="人体能力与成本比较图。用方向键移动观察窗，Shift加方向键大步移动。"><div class="k-comparison p17-table"><div class="hdr">同一副身体</div><div class="hdr">可能扩展的能力条件</div><div class="hdr">同步增加的身体约束</div><div class="dim">神经组织</div><div class="cell ability"><strong>整合</strong>更多组织可参与感知、记忆、计划与行为调节。</div><div class="cell cost diff"><strong>并非智力刻度</strong>判断还取决于连接、发育与经验。</div><div class="dim">日常供能</div><div class="cell ability"><strong>持续活跃</strong>快速整合身体内外的信息。</div><div class="cell cost diff"><strong>高维护</strong>成人静息脑能耗约占 <span id="energyShare"></span>。</div><div class="dim">成长发育</div><div class="cell ability"><strong>学习窗口</strong>较长成熟过程留下更多学习与可塑时间。</div><div class="cell cost diff"><strong>长期依赖</strong>更久需要照料、食物与社会支持。</div><div class="dim">出生过程</div><div class="cell ability"><strong>出生后成长</strong>部分脑发育可在子宫外继续。</div><div class="cell cost diff"><strong>通道约束</strong>头部仍须通过受行走与支撑约束的骨盆。</div></div><svg class="body-map" id="bodyMap" aria-hidden="true"></svg><div class="reveal-layer" aria-hidden="true"></div><div class="lens-ring" aria-hidden="true"></div></div></section>';

    var rawShare=Lec.K.brainRestingEnergyFraction;
    if(!Lec.P.finite(rawShare)) rawShare=0.20;
    var share=Lec.P.clamp(rawShare,0,1);
    document.getElementById("energyShare").textContent=Lec.P.formatNumber(Lec.P.percent(share,1),0)+"%";
    var referenceMass=Lec.K.bodyMassReferenceKg;
    if(!Lec.P.finite(referenceMass)) referenceMass=Lec.K.human.typicalMass;
    document.getElementById("massRef").textContent=Lec.P.formatNumber(referenceMass,0);

    var svg=d3.select("#bodyMap").attr("viewBox","0 0 64 450");
    var ys=d3.scaleLinear().domain([0,1]).range([22,428]);
    svg.append("circle").attr("cx",32).attr("cy",ys(0)).attr("r",20).attr("fill","var(--accent-soft)").attr("stroke","var(--accent)").attr("stroke-width",3);
    svg.append("path").attr("d","M32,43 C12,65 12,125 20,176 L12,288 L23,288 L27,190 L27,300 L18,428 L30,428 L34,310 L38,428 L50,428 L39,300 L39,190 L43,288 L54,288 L46,176 C54,125 52,65 32,43Z").attr("fill","var(--surface-strong)").attr("stroke","var(--line-strong)").attr("stroke-width",2);
    svg.append("ellipse").attr("cx",32).attr("cy",ys(.7)).attr("rx",19).attr("ry",13).attr("fill","var(--warning-soft)").attr("stroke","var(--warning)").attr("stroke-width",2);

    var reveal=document.getElementById("reveal"), zoom=1, state={x:760,y:150,user:false,drag:false};
    function radius(){return 150*zoom}
    function paint(){reveal.style.setProperty("--reveal-x",state.x+"px");reveal.style.setProperty("--reveal-y",state.y+"px");reveal.style.setProperty("--reveal-radius",radius()+"px");document.getElementById("zoomValue").textContent=zoom.toFixed(1)+"×"}
    function local(e){var p=Deck.pt(reveal,e);state.x=Deck.clamp(p.x,0,reveal.clientWidth);state.y=Deck.clamp(p.y,0,reveal.clientHeight);state.user=true;paint()}
    reveal.addEventListener("pointerdown",function(e){state.drag=true;state.user=true;reveal.setPointerCapture(e.pointerId);local(e)});
    reveal.addEventListener("pointermove",function(e){if(e.pointerType==="mouse"||state.drag)local(e)});
    function stop(e){state.drag=false;if(reveal.hasPointerCapture&&reveal.hasPointerCapture(e.pointerId))reveal.releasePointerCapture(e.pointerId)}
    reveal.addEventListener("pointerup",stop);reveal.addEventListener("pointercancel",stop);
    reveal.addEventListener("keydown",function(e){var step=e.shiftKey?52:18;if(e.key==="ArrowLeft")state.x-=step;else if(e.key==="ArrowRight")state.x+=step;else if(e.key==="ArrowUp")state.y-=step;else if(e.key==="ArrowDown")state.y+=step;else return;e.preventDefault();state.user=true;state.x=Deck.clamp(state.x,0,reveal.clientWidth);state.y=Deck.clamp(state.y,0,reveal.clientHeight);paint()});
    function setZoom(delta){zoom=Deck.clamp(zoom+delta,.8,1.6);state.user=true;paint()}
    document.getElementById("zoomOut").addEventListener("click",function(){setZoom(-.2)});
    document.getElementById("zoomIn").addEventListener("click",function(){setZoom(.2)});
    reveal.addEventListener("wheel",function(e){e.preventDefault();setZoom(e.deltaY<0?.2:-.2)},{passive:false});
    paint();
    if(!Deck.reduced()) Deck.loop(function(t){if(state.user)return false;var duration=5200;if(t>duration)return false;var u=t/duration;state.x=reveal.clientWidth*(.52+.18*Math.sin(u*Math.PI));state.y=82+(reveal.clientHeight-164)*u;paint();return true},{still:2600});
  </script>
</body>
</html>
