<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:var(--sp-3)}
    #stage{width:100%;height:100%}
    .grip-process{height:76px;padding:0;gap:var(--sp-2);flex:0 0 auto}
    .grip-process>.step{padding:var(--sp-2) var(--sp-3);display:flex;align-items:center;justify-content:center;text-align:center;font-size:var(--fs-label);line-height:1.4;font-weight:700}
    .grip-process>.arw{flex-basis:22px;font-size:var(--fs-body)}
    .lab{position:relative;flex:1 1 0;min-height:0;overflow:hidden;box-sizing:border-box;border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-soft)}
    #matterCanvas,.konva-layer{position:absolute;inset:0;width:100%;height:100%}
    #matterCanvas{z-index:1}.konva-layer{z-index:2}
    .scene-note{position:absolute;z-index:4;left:var(--sp-4);top:var(--sp-4);max-width:350px;pointer-events:none}
    .status{position:absolute;z-index:4;right:var(--sp-4);top:var(--sp-4);padding:var(--sp-2) var(--sp-4);border-radius:var(--radius-md);background:var(--surface-soft);border:1px solid var(--line);font-size:var(--fs-sec);font-weight:720}
    .feedback-arrow{position:absolute;z-index:3;right:var(--sp-5);bottom:var(--sp-4);font-size:var(--fs-label);color:var(--accent-strong);font-weight:700;pointer-events:none}
    .feedback-arrow::before{content:"↶";font-size:var(--fs-h2);margin-right:var(--sp-2)}
    .controls{display:flex;align-items:center;gap:var(--sp-3);flex:0 0 64px;min-width:0}
    .controls .ctl{height:64px;box-sizing:border-box}.task-button{min-width:176px}
    .grip-pad{position:relative;width:250px;height:42px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-soft);touch-action:none}
    .grip-pad::before,.grip-pad::after{content:"";position:absolute;background:var(--line)}
    .grip-pad::before{left:50%;top:0;bottom:0;width:1px}.grip-pad::after{top:50%;left:0;right:0;height:1px}
    .grip-knob{position:absolute;width:28px;height:28px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:var(--shadow-soft);transform:translate(-50%,-50%);left:34%;top:36%}
    .growctl{flex:1 1 0}.keyhint{margin-left:auto;white-space:nowrap}
    input[type="checkbox"]{width:22px;height:22px;accent-color:var(--accent)}
    .lab .sr-only{position:absolute!important;left:0;top:0;width:100%;height:auto;opacity:0;pointer-events:none;font-size:var(--fs-sec);line-height:var(--lh-copy)}
  </style>
</head>
<body data-page="19" data-total="50">
  <div id="stage"><main id="main"></main></div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/matter.min.js"></script>
  <script src="assets/lib/konva.min.js"></script>
  <script>
    Lec.mount({
      index: 19,
      kicker: "BODY / GRIP",
      title: "一次抓握，怎样由整只手完成？",
      take: "人手的力量握与精细握来自骨骼、肌肉、感觉和练习的协作。"
    });
    Deck.init({ index: 19, total: 50 });

    var main=document.getElementById("main");
    main.innerHTML='\
      <div class="k-process grip-process" aria-label="抓握过程">\
        <div class="axis"></div><div class="step is-current">确定目标</div><div class="arw"></div>\
        <div class="step">手掌定位</div><div class="arw"></div><div class="step">拇指对向</div><div class="arw"></div>\
        <div class="step">手指包合</div><div class="arw"></div><div class="step">感觉校正</div><div class="arw"></div>\
        <div class="step">稳定抓握</div>\
      </div>\
      <section class="lab no-pan" aria-label="抓握手指实验">\
        <canvas id="matterCanvas" class="cv-fill" aria-hidden="true"></canvas><div id="konva" class="konva-layer"></div>\
        <p class="scene-note secondary">拖动手掌靠近物体，再在协调区调整拇指对向与手指包合。</p>\
        <div id="status" class="status" role="status" aria-live="polite">调整中</div>\
        <div class="feedback-arrow">感觉校正会返回前两步</div>\
        <p id="sceneAlt" class="sr-only">教学用手模型正在接近任务物体；状态会报告滑动、调整中或稳定。</p>\
      </section>\
      <div class="controls">\
        <button id="task" type="button" class="primary task-button">力量握 · 切换并重置</button>\
        <div class="ctl growctl"><label id="padLabel">拇指 × 包合</label><div id="pad" class="grip-pad" role="slider" tabindex="0" aria-labelledby="padLabel" aria-valuetext="拇指与手指正在协调"><span class="grip-knob"></span></div></div>\
        <div class="ctl"><label for="sense">感觉反馈</label><input id="sense" type="checkbox" checked></div>\
        <span class="secondary keyhint">方向键调整；Shift 加大步幅</span>\
      </div>';

    var M=Matter, engine=M.Engine.create({gravity:{x:0,y:1}}), world=engine.world;
    var cv=document.getElementById("matterCanvas"), ctx=cv.getContext("2d"), lab=document.querySelector(".lab");
    var floor=M.Bodies.rectangle(704,404,1408,40,{isStatic:true,friction:0.9});
    var object, taskName="power", handX=430, handY=230, gripX=.34, gripY=.36, dragging=false, sense=true, stableFrames=0;
    M.Composite.add(world,floor);
    function taskData(){var bank=Lec.K.p19GripObjects||{};return bank[taskName]||null;}
    function makeObject(){
      if(object)M.Composite.remove(world,object);
      object=taskName==="power"?M.Bodies.rectangle(820,275,92,150,{chamfer:{radius:30},friction:0.45,restitution:0.05}):M.Bodies.rectangle(820,330,92,18,{friction:0.28,restitution:0.04});
      var d=taskData(); if(d&&d.massKg)M.Body.setMass(object,d.massKg);
      M.Composite.add(world,object); stableFrames=0;
    }
    makeObject();
    var ks=new Konva.Stage({container:"konva",width:1408,height:418}), layer=new Konva.Layer();ks.add(layer);
    var hand=new Konva.Group({x:handX,y:handY,draggable:true});
    var palm=new Konva.Rect({x:0,y:0,width:235,height:118,cornerRadius:50,fill:Deck.token("accent-soft"),stroke:Deck.token("accent"),strokeWidth:4});hand.add(palm);
    var fingers=[];[8,35,62,89].forEach(function(y,i){var f=new Konva.Line({points:[190,y,258-i*5,y-18-gripY*28,294-i*7,y+gripY*24],stroke:Deck.token("accent-strong"),strokeWidth:18,lineCap:"round",lineJoin:"round"});fingers.push(f);hand.add(f)});
    var thumb=new Konva.Line({points:[36,88,98+gripX*62,142,176+gripX*44,114-gripY*28],stroke:Deck.token("cyan"),strokeWidth:22,lineCap:"round",lineJoin:"round"});hand.add(thumb);layer.add(hand);
    var target=new Konva.Rect({x:1060,y:245,width:120,height:115,cornerRadius:14,stroke:Deck.token("success"),strokeWidth:3,dash:[10,8]});layer.add(target);layer.draw();
    hand.on("dragmove",function(){handX=hand.x();handY=hand.y();updateStep()});
    function redrawHand(){
      fingers.forEach(function(f,i){var y=[8,35,62,89][i];f.points([190,y,258-i*5-gripY*35,y-18-gripY*28,294-i*7-gripY*74,y+gripY*24])});
      thumb.points([36,88,98+gripX*62,142-gripX*30,176+gripX*44,114-gripY*28]);layer.batchDraw();updateStep();
    }
    function updateStep(){
      var dist=Math.abs((handX+250)-object.position.x), idx=dist>230?1:gripX<.42?2:gripY<.5?3:stableFrames<30?4:5;
      document.querySelectorAll(".grip-process .step").forEach(function(el,i){el.classList.toggle("is-current",i===idx);el.classList.toggle("is-past",i<idx)});
    }
    function draw(){
      var w=cv.clientWidth,h=cv.clientHeight;ctx.clearRect(0,0,w,h);ctx.save();ctx.scale(w/1408,h/418);
      ctx.fillStyle=Deck.token("surface-strong");ctx.fillRect(0,384,1408,34);
      ctx.translate(object.position.x,object.position.y);ctx.rotate(object.angle);ctx.fillStyle=Deck.token(taskName==="power"?"warning-soft":"cyan-soft");ctx.strokeStyle=Deck.token(taskName==="power"?"warning":"cyan");ctx.lineWidth=4;
      if(taskName==="power"){Deck.rr(ctx,-46,-75,92,150,28);ctx.fill();ctx.stroke()}else{Deck.rr(ctx,-46,-9,92,18,5);ctx.fill();ctx.stroke()}ctx.restore();
    }
    Deck.autofit(cv,draw);
    Deck.loop(function(t,dt){
      M.Engine.update(engine,Math.min(32,dt||16));
      var reach=Math.abs((handX+250)-object.position.x)<135, closed=gripX>.42&&gripY>.5;
      if(reach&&closed){var lift=taskName==="power"?handY+45:handY+108;M.Body.setVelocity(object,{x:(handX+285-object.position.x)*.08,y:(lift-object.position.y)*.08});M.Body.setAngularVelocity(object,object.angularVelocity*.72)}
      var moving=Math.abs(object.velocity.y)+Math.abs(object.velocity.x)+Math.abs(object.angularVelocity)*10;
      stableFrames=(reach&&closed&&moving<1.4)?stableFrames+1:0;
      var state=stableFrames>30?"稳定":reach&&closed?(sense?"感觉到滑动，继续校正":"接触中"):(object.position.y>365?"滑动":"调整中");
      document.getElementById("status").textContent=state;document.getElementById("status").className="status "+(state==="稳定"?"good":state.indexOf("滑动")>=0?"warn":"");
      draw();updateStep();
    },{still:700});
    var pad=document.getElementById("pad"),knob=pad.querySelector(".grip-knob");
    function setPad(x,y){gripX=Lec.P.clamp(Lec.P.finite(x,.34),0,1);gripY=Lec.P.clamp(Lec.P.finite(y,.36),0,1);knob.style.left=(gripX*100)+"%";knob.style.top=(gripY*100)+"%";pad.setAttribute("aria-valuetext","拇指对向与手指包合已更新");redrawHand()}
    function point(e){var p=Deck.pt(pad,e);setPad(p.x/pad.clientWidth,p.y/pad.clientHeight)}
    pad.addEventListener("pointerdown",function(e){dragging=true;pad.setPointerCapture(e.pointerId);point(e)});pad.addEventListener("pointermove",function(e){if(dragging)point(e)});pad.addEventListener("pointerup",function(){dragging=false});pad.addEventListener("pointercancel",function(){dragging=false});
    pad.addEventListener("keydown",function(e){var n=e.shiftKey ? .12 : .04,x=gripX,y=gripY;if(e.key==="ArrowLeft")x-=n;else if(e.key==="ArrowRight")x+=n;else if(e.key==="ArrowUp")y-=n;else if(e.key==="ArrowDown")y+=n;else return;e.preventDefault();setPad(x,y)});
    document.getElementById("sense").addEventListener("change",function(){sense=this.checked;document.querySelector(".feedback-arrow").style.opacity=sense?"1":".25"});
    document.getElementById("task").addEventListener("click",function(){taskName=taskName==="power"?"precision":"power";this.textContent=(taskName==="power"?"力量握":"精细握")+" · 切换并重置";hand.position({x:430,y:230});handX=430;handY=230;setPad(.34,.36);makeObject()});
  </script>
</body>
</html>
