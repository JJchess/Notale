<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .p21-shell{display:flex;width:100%;height:100%;gap:var(--sp-5)}
    .p21-left{flex:0 0 62%;display:flex;flex-direction:column;gap:var(--sp-3)}
    .p21-right{flex:1 1 0;display:flex;flex-direction:column;gap:var(--sp-2)}
    .p21-chart-panel{flex:1 1 0;padding:var(--sp-3);display:flex;flex-direction:column}
    #lifeChart{flex:1 1 0;min-height:0;width:100%}
    .p21-claim{padding:var(--sp-3) var(--sp-4);border-left:6px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius-md);font-size:var(--fs-lead);line-height:var(--lh-copy);font-weight:720}
    .p21-table{--cmp-cols:minmax(108px,.72fr) repeat(2,minmax(0,1fr));flex-shrink:0;font-size:var(--fs-sec);line-height:var(--lh-copy);border-radius:var(--radius-md)}
    .p21-table>*{padding:var(--sp-2) var(--sp-3)}
    .p21-table>.hdr{min-height:42px;font-size:var(--fs-sec)}
    .p21-table>.dim{font-size:var(--fs-label)}
    .p21-results{--cmp-cols:minmax(108px,.72fr) repeat(2,minmax(0,1fr));flex-shrink:0;font-size:var(--fs-sec);line-height:var(--lh-copy);border-radius:var(--radius-md)}
    .p21-results>*{padding:var(--sp-2) var(--sp-3)}
    .p21-results>.hdr{min-height:38px;font-size:var(--fs-sec)}
    .metric{display:flex;flex-direction:column;justify-content:center}
    .metric strong{font-size:var(--fs-body);font-variant-numeric:tabular-nums}
    .metric span{font-size:var(--fs-label);color:var(--muted)}
    .p21-control{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--sp-3);align-items:center}
    .p21-control label{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:baseline}
    .p21-control output{font-size:var(--fs-h2);color:var(--accent-strong);font-weight:760;font-variant-numeric:tabular-nums}
    .p21-control input{grid-column:1 / 3;width:100%}
    .p21-control button{grid-column:3}
    .p21-range{grid-column:1 / 3;display:flex;justify-content:space-between;font-size:var(--fs-tick);line-height:1.35;color:var(--muted)}
    .p21-note{flex:0 0 auto}
  </style>
</head>
<body data-page="21" data-total="50">
  <div id="stage"><main id="main"></main></div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script>
    Lec.mount({
      index: 21,
      kicker: "LIFE HISTORY TRADE-OFF",
      title: "长大得慢，学得更久",
      take: "人类漫长童年增加照料成本，也延长了学习窗口。"
    });
    Deck.init({ index: 21, total: 50 });

    var main = document.getElementById("main");
    main.innerHTML = '<div class="p21-shell">' +
      '<section class="p21-left min0" aria-label="生命周期曲线比较">' +
        '<div class="panel p21-chart-panel min0"><div id="lifeChart" role="img" aria-label="较短与较长依赖期的独立获取资源能力、照料需求和学习窗口比较图"></div></div>' +
        '<p class="note p21-note">曲线是用来观察折中的教学模型，不是所有儿童或所有社会的统一成长表。</p>' +
      '</section>' +
      '<section class="p21-right min0" aria-label="逐维度比较与控制">' +
        '<div class="p21-claim">“长大得慢”只有在持续照料、合作供给和安全关系中，才可能转化为更多学习机会。</div>' +
        '<div class="k-comparison p21-table">' +
          '<div class="hdr dim">比较维度</div><div class="hdr">较短依赖期</div><div class="hdr">较长依赖期</div>' +
          '<div class="rowline"></div><div class="dim">独立获取资源</div><div class="cell">较早接近稳定水平</div><div class="cell diff">较晚接近稳定水平</div>' +
          '<div class="rowline"></div><div class="dim">照料需求</div><div class="cell">较早下降</div><div class="cell diff">较晚下降，累计更多</div>' +
          '<div class="rowline"></div><div class="dim">学习窗口</div><div class="cell">较早收窄</div><div class="cell diff">保持开放更久</div>' +
          '<div class="rowline"></div><div class="dim">风险暴露</div><div class="cell">负担期较短</div><div class="cell diff">更依赖群体稳定</div>' +
        '</div>' +
        '<div class="k-comparison p21-results" aria-label="模型计算结果" aria-live="polite">' +
          '<div class="hdr dim">模型结果</div><div class="hdr" id="shortHead"></div><div class="hdr" id="longHead"></div>' +
          '<div class="rowline"></div><div class="dim">累计照料需求</div><div class="cell metric"><strong id="shortCare"></strong><span>相对支持年</span></div><div class="cell metric diff"><strong id="longCare"></strong><span id="careDiff"></span></div>' +
          '<div class="rowline"></div><div class="dim">学习窗口长度</div><div class="cell metric"><strong id="shortLearn"></strong><span>年</span></div><div class="cell metric diff"><strong id="longLearn"></strong><span id="learnDiff"></span></div>' +
        '</div>' +
        '<div class="ctl p21-control">' +
          '<label for="dependency"><span>调整较长依赖期</span><output id="dependencyOut"></output></label>' +
          '<input id="dependency" type="range" aria-label="较长依赖期长度">' +
          '<button type="button" id="reset">恢复默认</button>' +
          '<div class="p21-range"><span id="rangeMin"></span><span id="rangeMax"></span></div>' +
        '</div>' +
      '</section></div>';

    var K = Lec.K, P = Lec.P;
    /* 本页规划指定的 Lec 接口在当前共享底盘缺席时，按同名公开口径补齐。 */
    if (!K.p21LongDependencyRangeYears) {
      K.p21AgeAxisStartYears = 0;
      K.p21AgeAxisEndYears = 25;
      K.p21AgeStepYears = 0.25;
      K.p21ShortDependencyYears = 8;
      K.p21LongDependencyDefaultYears = 16;
      K.p21LongDependencyRangeYears = [10, 20];
      K.p21LongDependencyStepYears = 1;
      K.p21TransitionWidthYears = 2;
      K.p21LearningWindowThreshold = 0.5;
      K.p21RelativeScaleMin = 0;
      K.p21RelativeScaleMax = 1;
      K.p21ChartSampleCount = Math.floor((K.p21AgeAxisEndYears-K.p21AgeAxisStartYears)/K.p21AgeStepYears)+1;
      P.p21IndependentCapacity = function(a,d,w){ return P.clamp(1/(1+Math.exp(-(a-d)/w)),0,1); };
      P.p21CareNeed = function(a,d,w){ return P.clamp(1-P.p21IndependentCapacity(a,d,w),0,1); };
      P.p21LearningOpportunity = function(a,d){ return P.clamp(1/(1+Math.exp((a-d)/K.p21TransitionWidthYears)),0,1); };
      P.p21CurveArea = function(values,dx){ var s=0; for(var i=1;i<values.length;i++) s+=(values[i-1]+values[i])*dx/2; return s; };
      P.p21DurationAboveThreshold = function(values,t,dx){ var n=0; for(var i=0;i<values.length;i++) if(values[i]>t) n++; return n*dx; };
      P.p21Difference = function(a,b){ return P.finite(a) && P.finite(b) ? a-b : 0; };
    }
    var ageStart = K.p21AgeAxisStartYears;
    var ageEnd = K.p21AgeAxisEndYears;
    var ageStep = K.p21AgeStepYears;
    var shortD = K.p21ShortDependencyYears;
    var defaultD = K.p21LongDependencyDefaultYears;
    var range = K.p21LongDependencyRangeYears;
    var step = K.p21LongDependencyStepYears;
    var width = K.p21TransitionWidthYears;
    var threshold = K.p21LearningWindowThreshold;
    var sampleCount = Math.floor((ageEnd - ageStart) / ageStep) + 1;
    var slider = document.getElementById("dependency");
    slider.min = range[0]; slider.max = range[1]; slider.step = step; slider.value = defaultD;
    document.getElementById("rangeMin").textContent = range[0] + " 年";
    document.getElementById("rangeMax").textContent = range[1] + " 年";

    var chart = echarts.init(document.getElementById("lifeChart"), null, { renderer: "svg" });
    var shortModel = makeModel(shortD);

    function makeModel(d){
      var capacity=[], care=[], learning=[];
      for(var i=0;i<sampleCount;i++){
        var a=ageStart+i*ageStep;
        capacity.push([a,P.p21IndependentCapacity(a,d,width)]);
        care.push([a,P.p21CareNeed(a,d,width)]);
        learning.push([a,P.p21LearningOpportunity(a,d)]);
      }
      return {capacity:capacity,care:care,learning:learning,
        careArea:P.p21CurveArea(care.map(function(x){return x[1];}),ageStep),
        learnDuration:P.p21DurationAboveThreshold(learning.map(function(x){return x[1];}),threshold,ageStep)};
    }
    function fmt(v){ return P.formatNumber(v,1); }
    function update(){
      var candidate=Number(slider.value);
      var raw=P.finite(candidate)?candidate:defaultD;
      var d=P.clamp(raw,range[0],range[1]);
      slider.value=d;
      var longModel=makeModel(d);
      var careDelta=P.p21Difference(longModel.careArea,shortModel.careArea);
      var learnDelta=P.p21Difference(longModel.learnDuration,shortModel.learnDuration);
      document.getElementById("dependencyOut").textContent=d+" 年";
      document.getElementById("shortHead").textContent="较短 · "+shortD+" 年";
      document.getElementById("longHead").textContent="较长 · "+d+" 年";
      document.getElementById("shortCare").textContent=fmt(shortModel.careArea);
      document.getElementById("longCare").textContent=fmt(longModel.careArea);
      document.getElementById("careDiff").textContent="比基线 +"+fmt(careDelta)+" 相对支持年";
      document.getElementById("shortLearn").textContent=fmt(shortModel.learnDuration);
      document.getElementById("longLearn").textContent=fmt(longModel.learnDuration);
      document.getElementById("learnDiff").textContent="比基线 +"+fmt(learnDelta)+" 年";
      chart.setOption({
        animationDuration: Deck.reduced()?0:240,
        textStyle:{fontSize:16,fontFamily:Deck.token("--font-sans")},
        color:[Deck.rgb("--line-strong"),Deck.rgb("--accent"),Deck.rgb("--muted"),Deck.rgb("--cyan")],
        legend:{top:2,itemWidth:22,itemHeight:10,textStyle:{fontSize:14,color:Deck.rgb("--text")},data:["较短依赖期","较长依赖期","照料需求","学习窗口"]},
        grid:{left:62,right:24,top:66,bottom:54},
        xAxis:{type:"value",min:ageStart,max:ageEnd,name:"年龄（年）",nameLocation:"middle",nameGap:34,nameTextStyle:{fontSize:14,color:Deck.rgb("--muted")},axisLabel:{fontSize:14,color:Deck.rgb("--muted"),formatter:"{value} 岁"}},
        yAxis:{type:"value",min:K.p21RelativeScaleMin,max:K.p21RelativeScaleMax,interval:0.5,name:"相对水平",nameTextStyle:{fontSize:14,color:Deck.rgb("--muted")},axisLabel:{fontSize:14,color:Deck.rgb("--muted"),formatter:function(v){return v===0?"低 0":v===0.5?"中 0.5":"高 1.0";}}},
        tooltip:{trigger:"axis",textStyle:{fontSize:16}},
        series:[
          {name:"学习窗口",type:"line",data:longModel.learning,showSymbol:false,lineStyle:{width:0},areaStyle:{color:Deck.rgba("--cyan",.13)},z:0},
          {name:"照料需求",type:"line",data:shortModel.care,showSymbol:false,lineStyle:{width:1,type:"dashed",color:Deck.rgba("--line-strong",.7)},areaStyle:{color:Deck.rgba("--line-strong",.10)},z:1},
          {name:"照料需求",type:"line",data:longModel.care,showSymbol:false,lineStyle:{width:1,color:Deck.rgba("--accent",.65)},areaStyle:{color:Deck.rgba("--accent",.16)},z:2},
          {name:"较短依赖期",type:"line",data:shortModel.capacity,showSymbol:false,lineStyle:{width:3,type:"dashed",color:Deck.rgb("--line-strong")},z:4},
          {name:"较长依赖期",type:"line",data:longModel.capacity,showSymbol:false,lineStyle:{width:4,color:Deck.rgb("--accent")},z:5}
        ]
      },true);
    }
    slider.addEventListener("input",update);
    document.getElementById("reset").addEventListener("click",function(){slider.value=defaultD;update();slider.focus();});
    Deck.onResize(function(){chart.resize();});
    update();
  </script>
</body>
</html>
