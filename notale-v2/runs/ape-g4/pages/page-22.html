<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{width:100%;height:100%}
    .argument{height:100%;grid-template-columns:minmax(250px,.68fr) 42px minmax(0,2.35fr)}
    .argument>.claim{display:flex;flex-direction:column;gap:var(--sp-4)}
    .claim-main{font-size:var(--fs-h2);line-height:1.3;color:var(--accent-strong)}
    .claim-copy{font-size:var(--fs-body);line-height:var(--lh-copy);font-weight:500;color:var(--muted)}
    .evidence{display:flex;flex-direction:column;gap:var(--sp-3);min-width:0;min-height:0}
    .supports{display:flex;gap:var(--sp-2);min-width:0}
    .argument .supports>.support{flex:1 1 0;padding:var(--sp-2) var(--sp-3);font-size:var(--fs-label);line-height:1.4;text-align:center}
    .argument .support::before{display:none}
    .support.on{color:var(--success);background:var(--success-soft);border-color:var(--success)}
    .workspace{position:relative;flex:1 1 0;min-height:0;overflow:hidden;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft)}
    #network{display:block;width:100%;height:100%}
    .toolbar{position:absolute;z-index:3;left:var(--sp-4);right:var(--sp-4);bottom:var(--sp-3);display:flex;align-items:center;gap:var(--sp-3);pointer-events:none}
    .toolbar>*{pointer-events:auto}
    #status{flex:1 1 auto;padding:var(--sp-2) var(--sp-3);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);font-size:var(--fs-sec);line-height:var(--lh-copy)}
    #reset{flex:0 0 auto}
    .link{stroke:var(--line-strong);stroke-width:2;fill:none}
    .link.active{stroke:var(--accent);stroke-width:4}
    .link.preview{stroke-dasharray:7 6}
    .node circle,.node rect{fill:var(--surface);stroke:var(--line-strong);stroke-width:2}
    .node.person circle{fill:var(--accent-soft);stroke:var(--accent)}
    .node.knowledge circle{fill:var(--cyan-soft);stroke:var(--cyan)}
    .node.task rect{fill:var(--surface-soft)}
    .node.target rect,.node.outcome rect{fill:var(--warning-soft);stroke:var(--warning)}
    .node.selected circle,.node.selected rect{stroke:var(--accent-strong);stroke-width:4}
    .node.connected circle,.node.connected rect{fill:var(--success-soft);stroke:var(--success)}
    .node text{font-family:var(--font-sans);font-size:var(--fs-label);fill:var(--text);pointer-events:none;text-anchor:middle}
    .node .sub{font-size:var(--fs-label);fill:var(--muted)}
    .node:focus{outline:none}
    .node:focus circle,.node:focus rect{stroke:var(--focus);stroke-width:4}
    .dragline{stroke:var(--accent);stroke-width:3;stroke-dasharray:7 6;pointer-events:none}
  </style>
</head>
<body data-page="22" data-total="50">
  <main id="main"><div id="stage"></div></main>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
    Lec.mount({
      index: 22,
      kicker: "COOPERATIVE MINDS",
      title: "一个人会做的有限，一张网能完成更多",
      take: "人类优势来自共享注意、分工与知识网络，不只来自单个大脑。"
    });
    Deck.init({ index: 22, total: 50 });

    var stage=document.getElementById("stage");
    stage.innerHTML='<section class="k-generalization argument full" aria-label="合作网络的主张与四条支撑">'+
      '<div class="claim"><div class="claim-main">优势在网络中涌现</div><p class="claim-copy">合作不是把许多个体简单相加，而是让不同的人、知识和任务环节形成可用的连接。</p></div>'+
      '<div class="trunk" aria-hidden="true"></div><div class="evidence min0">'+
      '<div class="supports" id="supports"></div><div class="workspace no-pan">'+
      '<svg id="network" role="group" aria-label="搭建合作网络：选择一个节点，再选择另一个节点建立连接"></svg>'+
      '<div class="toolbar"><div id="status" aria-live="polite">选择一个节点，再选择可连接的目标。也可以从一个节点拖向另一个节点。</div><button id="reset" type="button">重置网络</button></div></div></div></section>';

    var scenario=Lec.K.p22CooperationNetworkScenario||{};
    var visual=Lec.K.p22NetworkVisual||{};
    var finite=function(v,f){var n=Lec.P.finite(v);return typeof n==="number"&&isFinite(n)?n:f};
    var clamp=function(v,a,b){return Lec.P.clamp(finite(v,a),a,b)};
    var radius=clamp(visual.nodeRadius||visual.radius,20,42);
    var linkDistance=clamp(visual.linkDistance,80,210);
    var collision=clamp(visual.collisionDistance,50,120);
    var duration=clamp(visual.animationDuration||visual.duration,120,900);
    var people=(scenario.people||[]).map(function(d){return Object.assign({},d,{kind:"person"})});
    var tasks=(scenario.taskParts||[]).map(function(d){return Object.assign({},d,{kind:"task"})});
    var knowledge=(scenario.knowledgeResources||[]).map(function(d){return Object.assign({},d,{kind:"knowledge"})});
    var nodes=people.concat(tasks,knowledge);
    function nid(d){return String(d.id!=null?d.id:d.key)}
    function label(d){return d.label||d.name||d.title||nid(d)}
    function addSpecial(id,kind,fallback){if(id!=null&&!nodes.some(function(n){return nid(n)===String(id)}))nodes.push({id:id,label:fallback,kind:kind})}
    addSpecial(scenario.sharedTargetId,"target","共同目标");
    addSpecial(scenario.sharedOutcomeId,"outcome","共同成果");
    var byId=new Map(nodes.map(function(d){d.id=nid(d);return[d.id,d]}));
    function ends(l){return [String(l.sourceId!=null?l.sourceId:(l.from!=null?l.from:l.source)),String(l.targetId!=null?l.targetId:(l.to!=null?l.to:l.target))]}
    var allowed=(scenario.allowedLinks||scenario.requiredLinks||[]).map(ends);
    var required=(scenario.requiredLinks||[]).map(ends);
    var links=[];var selected=null;var dragLine=null;
    var supportLabels=scenario.supportLabels||["共享注意","分工","知识分布","连接与整合"];
    d3.select("#supports").selectAll("div").data(supportLabels.slice(0,4)).join("div").attr("class","support").text(function(d){return typeof d==="string"?d:(d.label||d.name)});

    var svg=d3.select("#network"), W=1000,H=470;
    svg.attr("viewBox","0 0 "+W+" "+H).append("title").text("人物、任务和知识节点组成的合作网络");
    var linkLayer=svg.append("g"),dragLayer=svg.append("g"),nodeLayer=svg.append("g");
    var targetId=String(scenario.sharedTargetId),outcomeId=String(scenario.sharedOutcomeId);
    var taskX=d3.scalePoint().domain(tasks.map(nid)).range([400,760]).padding(.4);
    nodes.forEach(function(d,i){
      if(d.kind==="task"){d.fx=taskX(d.id);d.fy=235}
      else if(d.kind==="target"){d.fx=500;d.fy=70}
      else if(d.kind==="outcome"){d.fx=875;d.fy=235}
      else if(d.kind==="person"){d.x=130;d.y=90+i*72}
      else {d.x=500+(i%3)*140;d.y=390}
    });
    var sim=d3.forceSimulation(nodes).force("link",d3.forceLink().id(function(d){return d.id}).distance(linkDistance).strength(.25)).force("charge",d3.forceManyBody().strength(-180)).force("x",d3.forceX(function(d){return d.kind==="person"?150:d.kind==="knowledge"?560:520}).strength(.16)).force("y",d3.forceY(function(d){return d.kind==="person"?210:d.kind==="knowledge"?365:235}).strength(.16)).force("collide",d3.forceCollide(collision));
    var ng=nodeLayer.selectAll("g").data(nodes).join("g").attr("class",function(d){return"node "+d.kind}).attr("tabindex",0).attr("role","button").attr("aria-label",function(d){return label(d)+(d.kind==="person"&&d.ability?"，能力："+d.ability:"")});
    ng.each(function(d){var g=d3.select(this);if(d.kind==="person"||d.kind==="knowledge")g.append("circle").attr("r",radius);else g.append("rect").attr("x",-radius*1.75).attr("y",-radius).attr("width",radius*3.5).attr("height",radius*2).attr("rx",10);g.append("text").attr("y",d.ability?-4:5).text(label(d));if(d.ability)g.append("text").attr("class","sub").attr("y",17).text(d.ability)});
    ng.on("click",function(e,d){e.stopPropagation();choose(d)}).on("keydown",function(e,d){if(e.key==="Enter"||e.key===" "){e.preventDefault();choose(d)}});
    ng.call(d3.drag().on("start",function(e,d){selected=d;updateNodes();dragLine=dragLayer.append("line").attr("class","dragline").attr("x1",d.x).attr("y1",d.y).attr("x2",d.x).attr("y2",d.y)}).on("drag",function(e,d){dragLine.attr("x2",e.x).attr("y2",e.y)}).on("end",function(e,d){var hit=nodes.filter(function(n){return n!==d&&Math.hypot(n.x-e.x,n.y-e.y)<radius*2})[0];dragLine.remove();dragLine=null;if(hit)connect(d,hit);else message("未落在节点上，连接已撤回。");selected=null;updateNodes()}));
    sim.on("tick",function(){nodes.forEach(function(d){if(d.fx==null){d.x=Deck.clamp(d.x,65,W-65);d.y=Deck.clamp(d.y,55,H-70)}});ng.attr("transform",function(d){return"translate("+d.x+","+d.y+")"});linkLayer.selectAll("line").attr("x1",function(d){return byId.get(d.a).x}).attr("y1",function(d){return byId.get(d.a).y}).attr("x2",function(d){return byId.get(d.b).x}).attr("y2",function(d){return byId.get(d.b).y})});
    function key(a,b){return[a,b].sort().join("|")}
    function permitted(a,b){return allowed.some(function(p){return key(p[0],p[1])===key(a,b)})}
    function choose(d){if(!selected){selected=d;message("已选择“"+label(d)+"”；再选择目标节点。");updateNodes();return}if(selected===d){selected=null;message("已取消选择。");updateNodes();return}connect(selected,d);selected=null;updateNodes()}
    function connect(a,b){var k=key(a.id,b.id),old=links.findIndex(function(l){return key(l.a,l.b)===k});if(old>=0){links.splice(old,1);message("连接已撤回，可以重新安排。");render();return}if(!permitted(a.id,b.id)){message("这条连接不能承担该作用。");return}links.push({a:a.id,b:b.id});message("连接已建立；检查网络中还缺哪一段。");render(true)}
    function has(a,b){return links.some(function(l){return key(l.a,l.b)===key(a,b)})}
    function graphReach(start,end){var seen=new Set([start]),q=[start];while(q.length){var x=q.shift();links.forEach(function(l){var y=l.a===x?l.b:(l.b===x?l.a:null);if(y&&!seen.has(y)){seen.add(y);q.push(y)}})}return seen.has(end)}
    function states(){var attention=people.filter(function(p){return has(p.id,targetId)}).length>=Math.min(2,people.length);var division=tasks.length>0&&tasks.every(function(t){return people.some(function(p){return has(p.id,t.id)})});var know=knowledge.length>0&&knowledge.every(function(k){return people.some(function(p){return graphReach(k.id,p.id)})});var integration=tasks.length>0&&tasks.every(function(t){return graphReach(t.id,outcomeId)});return[attention,division,know,integration]}
    function render(flash){var ls=linkLayer.selectAll("line").data(links,function(d){return key(d.a,d.b)}).join("line").attr("class","link");sim.force("link").links(links.map(function(l){return{source:l.a,target:l.b}}));sim.alpha(.35).restart();var st=states();d3.select("#supports").selectAll(".support").classed("on",function(d,i){return !!st[i]});ng.classed("connected",function(d){return links.some(function(l){return l.a===d.id||l.b===d.id})});if(flash&&!Deck.reduced())ls.filter(function(d,i){return i===links.length-1}).classed("active",true).transition().duration(duration).on("end",function(){d3.select(this).classed("active",false)});if(st.every(Boolean))message("局部成果已接通：能力也存在于连接之中。");}
    function updateNodes(){ng.classed("selected",function(d){return d===selected})}
    function message(t){document.getElementById("status").textContent=t}
    document.getElementById("reset").addEventListener("click",function(){links=[];selected=null;render();updateNodes();message("网络已重置。选择一个节点开始连接。");});
    render();
  </script>
</body>
</html>
