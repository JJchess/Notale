<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;align-items:center;}
    .plate{width:100%;height:570px;box-sizing:border-box;position:relative;padding:var(--sp-4);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);overflow:hidden;}
    .plate::before{content:"";position:absolute;inset:var(--sp-4);border-top:1px solid var(--line);border-bottom:1px solid var(--line);pointer-events:none;}
    .k-process{height:100%;box-sizing:border-box;padding:var(--sp-6) 0;gap:var(--sp-2);align-items:center;}
    .k-process>.axis{left:var(--sp-4);right:var(--sp-4);background:var(--accent);}
    .k-process>.step{height:430px;box-sizing:border-box;padding:var(--sp-4);display:flex;flex-direction:column;justify-content:flex-start;border-radius:var(--radius-sm);box-shadow:none;}
    .k-process>.s1{flex:.8 1 0;background:var(--surface-soft);}
    .k-process>.s2{flex:1.05 1 0;}
    .k-process>.s3{flex:1.55 1 0;border-color:var(--accent);background:var(--accent-soft);}
    .k-process>.s4{flex:1.05 1 0;border-color:var(--cyan);}
    .k-process>.arw{flex-basis:32px;}
    .step-no{font-size:var(--fs-label);line-height:1.4;color:var(--muted);font-weight:700;letter-spacing:.08em;}
    .step h2{margin-top:var(--sp-2);}
    .tags{margin-top:var(--sp-5);display:flex;flex-wrap:wrap;gap:var(--sp-2);}
    .tag{padding:var(--sp-2) var(--sp-3);font-size:var(--fs-label);line-height:1.4;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-sm);}
    .body-note{margin-top:auto;font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--muted);}
    .human{width:92px;height:150px;margin:var(--sp-4) auto 0;color:var(--line-strong);}
    .human svg{display:block;width:100%;height:100%;}
    .branches{margin-top:var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-2);}
    .branch{position:relative;padding:var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-5);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-sm);font-size:var(--fs-sec);line-height:var(--lh-copy);}
    .branch::before{content:"→";position:absolute;left:var(--sp-2);top:var(--sp-2);color:var(--accent-strong);font-weight:800;}
    .branch strong{color:var(--accent-strong);}
    .output{margin-top:var(--sp-6);padding:var(--sp-4);font-size:var(--fs-lead);line-height:var(--lh-copy);font-weight:760;color:var(--success);background:var(--success-soft);border-left:4px solid var(--success);}
    .boundary{margin-top:var(--sp-5);height:74px;position:relative;border-left:2px dashed var(--cyan);border-right:2px dashed var(--cyan);}
    .boundary::before,.boundary::after{content:"";position:absolute;top:50%;width:34px;height:2px;background:var(--cyan);}
    .boundary::before{right:100%;}.boundary::after{left:100%;}
    .boundary span{display:block;padding:var(--sp-3);font-size:var(--fs-label);line-height:1.4;text-align:center;color:var(--cyan);}
  </style>
</head>
<body data-page="23" data-total="50">
  <div id="stage">
    <main id="main">
      <section class="plate" aria-label="从环境要求到文化承担适应功能的过程图">
        <div class="k-process full">
          <div class="axis" aria-hidden="true"></div>

          <section class="step s1 min0">
            <div class="step-no">STEP 01 · INPUT</div>
            <h2>环境提出要求</h2>
            <div class="tags" aria-label="环境要求">
              <span class="tag">冷</span><span class="tag">危险</span><span class="tag">距离</span><span class="tag">复杂任务</span>
            </div>
          </section>

          <div class="arw" aria-label="导致"></div>

          <section class="step s2 min0">
            <div class="step-no">STEP 02 · LIMIT</div>
            <h2>身体变化受时间约束</h2>
            <div class="human" aria-hidden="true">
              <svg viewBox="0 0 92 150" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="46" cy="20" r="13"/><path d="M46 33v49M24 56l22-15 22 15M46 82l-18 47M46 82l18 47"/><path d="M33 46l-9 48M59 46l9 48"/><path d="M37 72h18"/>
              </svg>
            </div>
            <div class="tag self-center">跨世代 · 缓慢</div>
            <p class="body-note">个体需要当下应对，遗传改变却要经过许多代。</p>
          </section>

          <div class="arw" aria-label="因而"></div>

          <section class="step s3 min0">
            <div class="step-no">STEP 03 · BYPASS</div>
            <h2>外部支持介入</h2>
            <div class="branches">
              <div class="branch"><strong>工具</strong>　替身体施力、延伸触及范围或提供防护。</div>
              <div class="branch"><strong>规则</strong>　固定协调方式，减少每次重新摸索。</div>
              <div class="branch"><strong>他人</strong>　以分工、照料和共享知识补足个体限制。</div>
            </div>
          </section>

          <div class="arw" aria-label="于是"></div>

          <section class="step s4 min0">
            <div class="step-no">STEP 04 · OUTPUT</div>
            <h2>无须先改变身体也能应对</h2>
            <div class="output">适应功能移到身体之外</div>
            <div class="boundary"><span>可应对的环境边界向外推开</span></div>
            <p class="body-note">身体仍受演化约束，但应对环境的速度可以由文化加快。</p>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 23,
      kicker: "CULTURE · TRANSITION",
      title: "把适应移到身体之外",
      take: "身体改变很慢之后，人类开始让工具、规则与他人替身体适应。"
    });
    Deck.init({ index: 23, total: 50 });
  </script>
</body>
</html>
