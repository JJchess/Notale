<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage .lesson{height:100%;display:flex;flex-direction:column;gap:var(--sp-3)}
    #stage .prompt{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4)}
    #stage .prompt p{font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--muted)}
    #stage .k-classification{flex:1;min-height:0;gap:var(--sp-2)}
    #stage .k-classification>.box{height:100%;display:flex;flex-direction:column}
    #stage .k-classification .box>.bt{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-2) var(--sp-4)}
    #stage .bt .hint{font-size:var(--fs-label);font-weight:600;color:var(--muted)}
    #stage .k-classification .box>.bc{flex:1;min-height:0;padding:var(--sp-2)}
    #stage .k-classification .lv{height:100%;margin-left:0;padding-left:var(--sp-4)}
    #stage .game{position:relative;flex:1;min-height:0;border-radius:var(--radius-md);background:var(--surface-soft);overflow:hidden}
    #stage #konva{position:absolute;inset:0}
    #stage .keys{position:absolute;left:var(--sp-3);top:var(--sp-3);display:flex;gap:var(--sp-2);z-index:2}
    #stage .keys button{font-size:var(--fs-sec);background:var(--surface)}
    #stage .status{min-width:0;flex:1;font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--muted)}
    #stage .status.done{color:var(--success);font-weight:700}
    #stage #reset{flex:0 0 auto}
  </style>
</head>
<body data-page="24" data-total="50">
  <div id="stage"><main id="main"></main></div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/konva.min.js"></script>
  <script>
    Lec.mount({
      index: 24,
      kicker: "EXTERNALIZED ADAPTATION",
      title: "身体不必独自完成所有功能",
      take: "衣物、住所和容器把保温、防护与储存功能移到身体之外。"
    });
    Deck.init({ index: 24, total: 50 });

    var stage = document.getElementById("main");
    stage.innerHTML = '<section class="lesson"><div class="prompt"><p>拖动功能到能替身体承担它的载体；同一功能可能连接多处。</p><div id="status" class="status" aria-live="polite">先建立一条功能关系。</div><button id="reset" type="button">重新分类</button></div><div class="k-classification min0"><div class="box"><div class="bt"><span>上位类别：身体面对的功能需求</span><span class="hint">下位项沿主干连接到体外载体</span></div><div class="bc"><div class="lv"><div class="game no-pan"><div id="konva" role="img" aria-label="功能类别连接衣物、住所和容器的分类舞台"></div><div class="keys"><button type="button" data-f="warm">放置保温</button><button type="button" data-f="protect">放置防护</button><button type="button" data-f="store">放置储存与携带</button></div></div></div></div></div></div></section>';

    var host=document.getElementById('konva'), status=document.getElementById('status');
    var funcs=[
      {id:'warm',name:'保温',targets:['cloth','shelter']},
      {id:'protect',name:'防护',targets:['cloth','shelter','vessel']},
      {id:'store',name:'储存与携带',targets:['vessel']}
    ];
    var carriers=[
      {id:'cloth',name:'衣物',sub:'可穿戴、可替换、贴近身体'},
      {id:'shelter',name:'住所',sub:'扩大身体周围可控制的环境'},
      {id:'vessel',name:'容器',sub:'让物质留存、搬运并与外界隔开'}
    ];
    var desc={
      'warm-cloth':'在身体表面增加可更换的隔离层','warm-shelter':'在身体之外建立较大的环境缓冲层',
      'protect-cloth':'让材料先接触身体周围的环境','protect-shelter':'把一部分危险挡在活动空间之外',
      'protect-vessel':'让外壳先保护其中的物品或液体','store-vessel':'让物质离开双手后仍能被保存和移动'
    };
    var state={links:{}};
    var palette={warm:'warning',protect:'accent',store:'cyan'};
    function color(id,a){return a==null?Deck.token(palette[id]):Deck.rgba(palette[id],a)}
    var ks=new Konva.Stage({container:host,width:host.clientWidth,height:host.clientHeight});
    var layer=new Konva.Layer();ks.add(layer);
    var W=ks.width(),H=ks.height(), bodyX=W/2, bodyY=74;
    function txt(o){return new Konva.Text(Object.assign({fontFamily:Deck.token('--font-sans'),fill:Deck.token('text')},o))}
    function person(){
      var g=new Konva.Group({opacity:.9});
      g.add(new Konva.Circle({x:bodyX,y:bodyY+20,radius:23,fill:Deck.token('surface'),stroke:Deck.token('line-strong'),strokeWidth:3}));
      g.add(new Konva.Line({points:[bodyX,bodyY+44,bodyX,bodyY+143],stroke:Deck.token('line-strong'),strokeWidth:18,lineCap:'round'}));
      g.add(new Konva.Line({points:[bodyX,bodyY+72,bodyX-43,bodyY+116],stroke:Deck.token('line-strong'),strokeWidth:12,lineCap:'round'}));
      g.add(new Konva.Line({points:[bodyX,bodyY+72,bodyX+43,bodyY+116],stroke:Deck.token('line-strong'),strokeWidth:12,lineCap:'round'}));
      g.add(new Konva.Line({points:[bodyX,bodyY+139,bodyX-32,bodyY+205],stroke:Deck.token('line-strong'),strokeWidth:13,lineCap:'round'}));
      g.add(new Konva.Line({points:[bodyX,bodyY+139,bodyX+32,bodyY+205],stroke:Deck.token('line-strong'),strokeWidth:13,lineCap:'round'}));
      g.add(txt({x:bodyX-80,y:bodyY+216,width:160,text:'身体原本独自承担',align:'center',fontSize:16,fill:Deck.token('muted')}));layer.add(g);return g;
    }
    var body=person(), targetNodes={}, cards={};
    var tw=330,th=154,ty=H-th-12, txs=[18,(W-tw)/2,W-tw-18];
    carriers.forEach(function(c,i){var x=txs[i],g=new Konva.Group();targetNodes[c.id]={x:x,y:ty,w:tw,h:th,g:g};
      g.add(new Konva.Rect({x:x,y:ty,width:tw,height:th,cornerRadius:14,fill:Deck.token('surface'),stroke:Deck.token('line-strong'),strokeWidth:2}));
      g.add(txt({x:x+18,y:ty+14,width:tw-36,text:c.name,fontSize:22,fontStyle:'bold'}));
      g.add(txt({x:x+18,y:ty+48,width:tw-36,text:c.sub,fontSize:16,fill:Deck.token('muted')}));
      g.add(new Konva.Line({points:[x+18,ty+83,x+18,ty+132],stroke:Deck.token('line-strong'),strokeWidth:3}));layer.add(g);
    });
    var origins=[bodyX-270,bodyX-80,bodyX+135];
    funcs.forEach(function(f,i){var ox=origins[i],oy=18,g=new Konva.Group({x:ox,y:oy,draggable:true});cards[f.id]={g:g,x:ox,y:oy};
      g.add(new Konva.Rect({width:f.id==='store'?150:112,height:48,cornerRadius:12,fill:color(f.id,.14),stroke:color(f.id),strokeWidth:2,shadowColor:Deck.token('line-strong'),shadowBlur:8,shadowOpacity:.18}));
      g.add(txt({x:8,y:12,width:f.id==='store'?134:96,text:f.name,align:'center',fontSize:18,fontStyle:'bold',fill:color(f.id)}));
      g.on('dragend',function(){drop(f,g.x()+55,g.y()+24);g.position({x:ox,y:oy});layer.draw()});layer.add(g);
    });
    function nextTarget(f){return f.targets.find(function(t){return !state.links[f.id+'-'+t]})}
    function addLink(f,t){var key=f.id+'-'+t;if(state.links[key])return;state.links[key]=true;var n=targetNodes[t],idx=Object.keys(state.links).filter(function(k){return k.endsWith('-'+t)}).length-1;
      layer.add(new Konva.Line({points:[bodyX,bodyY+145,n.x+n.w/2,n.y],stroke:color(f.id,.65),strokeWidth:3,dash:[8,5]}));
      n.g.add(new Konva.Rect({x:n.x+28+idx*92,y:n.y+91,width:84,height:34,cornerRadius:10,fill:color(f.id,.14),stroke:color(f.id)}));
      n.g.add(txt({x:n.x+32+idx*92,y:n.y+98,width:76,text:f.name,align:'center',fontSize:15,fontStyle:'bold',fill:color(f.id)}));
      status.textContent=desc[key];var done=funcs.every(function(q){return !nextTarget(q)});body.opacity(done?.28:.72);status.classList.toggle('done',done);
      if(done)status.textContent='适应的一部分已经移到身体之外。';layer.draw();
    }
    function drop(f,x,y){var hit=carriers.find(function(c){var n=targetNodes[c.id];return x>=n.x&&x<=n.x+n.w&&y>=n.y&&y<=n.y+n.h});
      if(hit&&f.targets.indexOf(hit.id)>=0){addLink(f,hit.id)}else if(hit){status.textContent=f.id==='store'&&hit.id==='cloth'?'这里强调物质离手后仍可留存；再找能包容内容物的载体。':'按它实际替身体承担的功能判断，不按外形判断。'}
    }
    document.querySelectorAll('.keys button').forEach(function(b){b.addEventListener('click',function(){var f=funcs.find(function(q){return q.id===b.dataset.f}),t=nextTarget(f);if(t)addLink(f,t);else status.textContent=f.name+'的关系已经全部建立。'})});
    document.getElementById('reset').addEventListener('click',function(){state={links:{}};status.textContent='先建立一条功能关系。';status.classList.remove('done');layer.destroyChildren();body=person();targetNodes={};cards={};location.reload()});
    layer.draw();
  </script>
</body>
</html>
