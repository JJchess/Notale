<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:var(--sp-3)}
    .cmp{height:252px;--cmp-cols:minmax(150px,.62fr) repeat(2,minmax(0,1fr));font-size:var(--fs-sec);line-height:var(--lh-copy)}
    .cmp>*{padding:var(--sp-2) var(--sp-3)}
    .cmp>.hdr{min-height:38px;font-size:var(--fs-body);align-items:center}
    .cmp .cell{justify-content:space-between;gap:var(--sp-3)}
    .metric{font-variant-numeric:tabular-nums;font-weight:720;white-space:nowrap}
    .dir{font-size:var(--fs-label);color:var(--warning);font-weight:700;white-space:nowrap}
    .bench{height:355px;display:flex;flex-direction:column;gap:var(--sp-2);min-height:0}
    .toolbar{display:flex;align-items:center;gap:var(--sp-3);min-height:48px}
    .toolbar .ctl{padding:var(--sp-2) var(--sp-3)}
    .foodctl{width:240px}.heatctl{flex:1}.heatctl output{width:58px;text-align:right;font-weight:740}
    .shared{font-size:var(--fs-label);color:var(--muted);flex:1;text-align:center}
    .trays{display:flex;gap:var(--sp-4);min-height:0;flex:1}
    .tray{position:relative;flex:1;min-width:0;overflow:hidden;border:1px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface-soft);box-shadow:inset 0 5px 12px rgba(28,49,78,.12),inset 0 1px 0 var(--surface)}
    .tray canvas{z-index:1}.trayhead{position:absolute;z-index:2;left:var(--sp-3);right:var(--sp-3);top:var(--sp-2);display:flex;justify-content:space-between;font-size:var(--fs-label);font-weight:700;pointer-events:none}
    .trayfoot{position:absolute;z-index:2;left:var(--sp-3);right:var(--sp-3);bottom:var(--sp-2);display:flex;justify-content:space-between;font-size:var(--fs-label);pointer-events:none}
    .actions{display:flex;justify-content:center;gap:var(--sp-3)}
    .actions button{min-width:150px;box-shadow:0 4px 0 var(--line-strong),0 6px 10px rgba(28,49,78,.14),inset 0 1px 0 var(--surface);transition:transform 180ms ease,box-shadow 180ms ease}
    .actions button:active{transform:translateY(3px);box-shadow:inset 0 3px 7px rgba(28,49,78,.18)}
    .flash{background:var(--warning-soft)!important}
  </style>
</head>
<body data-page="25" data-total="50">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/matter.min.js"></script>
  <script>
    Lec.mount({index:25,kicker:"OUTSOURCED DIGESTION",title:"烹饪不只加热：它同时改写能量、咀嚼与风险",take:"烹饪改变食物的可获取能量、咀嚼成本和安全风险；效果取决于食物与加工方式，并非越熟越好。"});
    Deck.init({index:25,total:50});
    var main=document.getElementById("main"), K=Lec.K, P=Lec.P;
    main.innerHTML='<section class="k-comparison cmp" aria-label="未烹饪与烹饪后的逐维比较">'+
      '<div class="hdr">比较维度</div><div class="hdr">未烹饪基线</div><div class="hdr">烹饪后</div><div class="rowline"></div>'+
      '<div class="dim">食物结构</div><div class="cell"><span>结构完整度</span><b class="metric" id="rawStruct"></b></div><div class="cell diff"><span>结构完整度</span><span><b class="metric" id="cookStruct"></b> <i class="dir" id="dStruct"></i></span></div><div class="rowline"></div>'+
      '<div class="dim">可获取能量</div><div class="cell"><span>净能量<small>（仅扣咀嚼）</small></span><b class="metric" id="rawEnergy"></b></div><div class="cell diff"><span>净能量<small>（仅扣咀嚼）</small></span><span><b class="metric" id="cookEnergy"></b> <i class="dir" id="dEnergy"></i></span></div><div class="rowline"></div>'+
      '<div class="dim">咀嚼成本</div><div class="cell"><span>教学模型</span><b class="metric" id="rawBites"></b></div><div class="cell diff"><span>教学模型</span><span><b class="metric" id="cookBites"></b> <i class="dir" id="dBites"></i></span></div><div class="rowline"></div>'+
      '<div class="dim">安全风险</div><div class="cell"><span>病原／毒素／副产物</span><b class="metric" id="rawRisk"></b></div><div class="cell diff"><span>病原／毒素／副产物</span><span><b class="metric" id="cookRisk"></b> <i class="dir" id="dRisk"></i></span></div></section>'+
      '<section class="bench"><div class="toolbar"><div class="ctl foodctl"><label for="food">同一食物</label><select id="food"></select></div><div class="shared" id="shared"></div><div class="ctl heatctl"><label for="heat">加热程度</label><input id="heat" type="range" min="0" max="1" step="0.01"><output id="heatOut"></output></div></div><div class="trays"><div class="tray"><canvas id="rawCv" class="cv-fill" role="img" aria-label="未烹饪食物颗粒咀嚼槽"></canvas><div class="trayhead"><span>未烹饪</span><span id="rawState">等待同时咀嚼</span></div><div class="trayfoot"><span id="rawTime"></span><span id="rawParts"></span></div></div><div class="tray"><canvas id="cookCv" class="cv-fill" role="img" aria-label="烹饪后食物颗粒咀嚼槽"></canvas><div class="trayhead"><span>烹饪后</span><span id="cookState">等待同时咀嚼</span></div><div class="trayfoot"><span id="cookTime"></span><span id="cookParts"></span></div></div></div><div class="actions"><button type="button" class="primary" id="chew">同时咀嚼</button><button type="button" id="reset">重置</button></div></section>';
    var scenarios=K.p25FoodScenarios||[]; if(!Array.isArray(scenarios)) scenarios=Object.keys(scenarios).map(function(x){var s=scenarios[x];s._key=x;return s});
    var food=document.getElementById('food'); scenarios.forEach(function(s,i){var o=document.createElement('option');o.value=i;o.textContent=s.name||s.label||s._key||('情景'+(i+1));food.appendChild(o)});
    var range=K.p25FoodMassRangeKg||[.1,.3], mass=P.clamp((range[0]+range[1])/2,range[0],range[1]);
    var rawLevel=K.p25RawProcessingLevel||0, heat=document.getElementById('heat');
    function finite(v,d){v=P.finite(Number(v));return typeof v==='number'&&isFinite(v)?v:d}
    P.p25CookedStructureIndex=P.p25CookedStructureIndex||function(s,l){return P.clamp(s.rawStructureIndex*(1-.65*l),0,1)};
    P.p25DigestibleFraction=P.p25DigestibleFraction||function(s,l){return P.clamp((s.rawDigestibleFraction||.5)+(s.digestibleGain||.3)*l,0,1)};
    P.p25ChewingDuration=P.p25ChewingDuration||function(n,d){return n*d};
    P.p25ChewingPower=P.p25ChewingPower||function(s,x){return (s.chewingPowerW||12)*(1+x)};
    P.p25NetAvailableEnergy=P.p25NetAvailableEnergy||function(a,c){return Math.max(0,a-c)};
    P.p25PathogenRisk=P.p25PathogenRisk||function(s,l){return (s.rawPathogenRisk||60)*(1-l)};
    P.p25ToxinRisk=P.p25ToxinRisk||function(s,l){return (s.rawToxinRisk||20)*(1-.35*l)};
    P.p25ProcessingByproductRisk=P.p25ProcessingByproductRisk||function(s,l){return (s.processingByproductRisk||18)*l*l};
    P.p25SafetyRiskIndex=P.p25SafetyRiskIndex||function(s,l){return P.p25PathogenRisk(s,l)+P.p25ToxinRisk(s,l)+P.p25ProcessingByproductRisk(s,l)};
    P.p25Direction=P.p25Direction||function(a,b){var d=b-a,t=Math.max(Math.abs(a),1)*.03;return Math.abs(d)<=t?'≈ 接近':d>a?'↑ 较高':'↓ 较低'};
    function fmt(v){return P.formatNumber(v)} function pct(v){return fmt(P.clamp(finite(v,0),0,1)*100)+'%'}
    function dir(a,b){return P.p25Direction(a,b)}
    var state={}, worlds=[];
    function scenario(){return scenarios[Number(food.value)]||scenarios[0]||{name:'食物',grossEnergyJPerKg:1000000,rawStructureIndex:.8,rawDigestibleFraction:.5,materialResponse:{}}}
    function riskParts(s,l){return [P.p25PathogenRisk(s,l),P.p25ToxinRisk(s,l),P.p25ProcessingByproductRisk(s,l)]}
    function compute(){var s=scenario(),l=P.clamp(finite(heat.value,s.defaultProcessingLevel||.55),0,1),rs=P.clamp(s.rawStructureIndex,0,1),cs=P.p25CookedStructureIndex(s,l),rd=P.p25DigestibleFraction(s,rawLevel),cd=P.p25DigestibleFraction(s,l),gross=mass*s.grossEnergyJPerKg;
      var rb=Math.max(1,Math.ceil(8+rs*22)),cb=Math.max(1,Math.ceil(8+cs*22)),bd=(K.p25ChewingModel&&K.p25ChewingModel.biteDurationSeconds)||.8,rDur=P.p25ChewingDuration(rb,bd),cDur=P.p25ChewingDuration(cb,bd),rp=P.p25ChewingPower(s,rs),cp=P.p25ChewingPower(s,cs),re=P.p25NetAvailableEnergy(gross*rd,P.metabolicEnergy(rp,rDur)),ce=P.p25NetAvailableEnergy(gross*cd,P.metabolicEnergy(cp,cDur)),rr=P.p25SafetyRiskIndex(s,rawLevel),cr=P.p25SafetyRiskIndex(s,l);
      state={s:s,l:l,rs:rs,cs:cs,rb:rb,cb:cb,rDur:rDur,cDur:cDur,re:re,ce:ce,rr:rr,cr:cr,rparts:riskParts(s,rawLevel),cparts:riskParts(s,l)};
      rawStruct.textContent=pct(rs);cookStruct.textContent=pct(cs);dStruct.textContent=dir(rs,cs);rawEnergy.textContent=fmt(re/1000)+' kJ';cookEnergy.textContent=fmt(ce/1000)+' kJ';dEnergy.textContent=dir(re,ce);rawBites.textContent=fmt(rb)+' 次';cookBites.textContent=fmt(cb)+' 次';dBites.textContent=dir(rb,cb);rawRisk.textContent=fmt(rr)+' 点';cookRisk.textContent=fmt(cr)+' 点';dRisk.textContent=dir(rr,cr);heatOut.textContent=pct(l);shared.textContent=fmt(mass*1000)+' g · 同一化学能 '+fmt(gross/1000)+' kJ';rawTime.textContent=P.formatDuration(rDur);cookTime.textContent=P.formatDuration(cDur);rawParts.textContent='风险 '+state.rparts.map(fmt).join('／');cookParts.textContent='风险 '+state.cparts.map(fmt).join('／');buildWorlds();}
    function build(cv,structure,cooked){var fit=Deck.fit(cv),w=fit.width,h=fit.height,eng=Matter.Engine.create({gravity:{x:0,y:0}}),b=[];b.push(Matter.Bodies.rectangle(w/2,h-18,w-20,18,{isStatic:true}),Matter.Bodies.rectangle(10,h/2,18,h,{isStatic:true}),Matter.Bodies.rectangle(w-10,h/2,18,h,{isStatic:true}));for(var i=0;i<12;i++){var x=w*.25+(i%4)*w*.13,y=h*.29+Math.floor(i/4)*34;b.push(Matter.Bodies.circle(x,y,13,{restitution:.18,friction:.2,render:{fillStyle:cooked?Deck.rgb('--warning'):Deck.rgb('--cyan')}}))}Matter.Composite.add(eng.world,b);return {cv:cv,ctx:cv.getContext('2d'),w:w,h:h,e:eng,b:b.slice(3),structure:structure,cooked:cooked}}
    function buildWorlds(){worlds=[build(rawCv,state.rs,false),build(cookCv,state.cs,true)];drawAll()}
    function drawOne(o,progress){var c=o.ctx;c.clearRect(0,0,o.w,o.h);c.fillStyle=Deck.rgba('--line-strong',.35);c.fillRect(0,o.h-28,o.w,18);var jawY=48+progress*55;c.fillStyle=Deck.rgb('--surface-strong');c.fillRect(30,jawY,o.w-60,18);o.b.forEach(function(b,i){var shrink=1-progress*(1-o.structure)*.55;c.beginPath();c.arc(b.position.x,b.position.y,13*shrink,0,Math.PI*2);c.fillStyle=o.cooked?Deck.rgb('--warning'):Deck.rgb('--cyan');c.fill();c.strokeStyle=Deck.rgb('--line-strong');c.stroke()})}
    function drawAll(p){worlds.forEach(function(o){drawOne(o,p||0)})}
    heat.value=(scenario().defaultProcessingLevel||.55);compute();
    heat.addEventListener('input',compute);food.addEventListener('change',function(){heat.value=scenario().defaultProcessingLevel||.55;compute()});
    chew.addEventListener('click',function(){chew.disabled=true;var steps=Math.max(state.rb,state.cb),n=0;if(Deck.reduced()){drawAll(1);finish();return}var timer=setInterval(function(){n++;worlds.forEach(function(o){Matter.Engine.update(o.e,1000/60)});drawAll(n/steps);if(n>=steps){clearInterval(timer);finish()}},35);function finish(){rawState.textContent='达到吞咽粒径';cookState.textContent='达到吞咽粒径';document.querySelectorAll('.diff').forEach(function(x){x.classList.add('flash')});chew.disabled=false}});
    reset.addEventListener('click',function(){heat.value=scenario().defaultProcessingLevel||.55;rawState.textContent=cookState.textContent='等待同时咀嚼';document.querySelectorAll('.diff').forEach(function(x){x.classList.remove('flash')});compute()});
  </script>
</body>
</html>
