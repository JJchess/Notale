<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{position:relative}
    #main{display:flex;flex-direction:column;gap:var(--sp-3)}
    .flow{height:92px;padding:0;gap:var(--sp-2)}
    .flow>.step{padding:var(--sp-3) var(--sp-2);display:flex;align-items:center;justify-content:center;text-align:center;font-size:var(--fs-label);line-height:1.4}
    .flow>.arw{flex-basis:22px}
    .game{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft)}
    .scene{position:absolute;inset:0 0 104px 0;overflow:hidden;background:var(--surface-soft)}
    canvas{display:block}
    .instruction{position:absolute;left:var(--sp-5);top:var(--sp-4);z-index:2;max-width:430px;padding:var(--sp-3) var(--sp-4);background:var(--surface);border-left:4px solid var(--accent);border-radius:var(--radius-sm);font-size:var(--fs-sec);line-height:var(--lh-copy);box-shadow:var(--shadow-soft)}
    .feedback{position:absolute;right:var(--sp-5);top:var(--sp-4);z-index:2;max-width:350px;padding:var(--sp-3) var(--sp-4);background:var(--surface);border-radius:var(--radius-sm);font-size:var(--fs-sec);line-height:var(--lh-copy)}
    .bar{position:absolute;inset:auto 0 0;height:104px;display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);box-sizing:border-box;background:var(--surface);border-top:1px solid var(--line)}
    .control{flex:1;min-width:0}.control .ctl{padding:var(--sp-2) var(--sp-3)}
    .actions{display:flex;gap:var(--sp-2)}
    .stats{display:flex;gap:var(--sp-4);margin-left:auto}
    .stat{min-width:106px}.stat b{display:block;font-size:var(--fs-body);color:var(--accent-strong);font-variant-numeric:tabular-nums}.stat span{font-size:var(--fs-label);color:var(--muted)}
    .loopback{position:absolute;left:62%;right:7%;bottom:96px;height:31px;border-left:3px solid var(--warning);border-bottom:3px solid var(--warning);border-right:3px solid var(--warning);border-radius:0 0 var(--radius-md) var(--radius-md);pointer-events:none}
    .loopback:before{content:"↖ 修正下一击";position:absolute;left:-102px;bottom:-11px;padding:0 var(--sp-2);background:var(--surface);color:var(--warning);font-size:var(--fs-label);font-weight:700}
  </style>
</head>
<body data-page="26" data-total="50">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/matter.min.js"></script>
  <script>
    Lec.mount({
      index: 26,
      kicker: "MAKING AS SEQUENCE",
      title: "先想要哪条刃，再决定这一锤怎么落",
      take: "工具制作把动作顺序、材料反馈和预期目标绑在一起。"
    });
    Deck.init({ index: 26, total: 50 });

    var main=document.getElementById('main');
    main.innerHTML='<div class="k-process flow" aria-label="打制石器动作流程"><div class="axis"></div><div class="step is-current">预想目标</div><div class="arw"></div><div class="step">选择击打位置</div><div class="arw"></div><div class="step">调整方向与力度</div><div class="arw"></div><div class="step">击打</div><div class="arw"></div><div class="step">读取材料反馈</div><div class="arw"></div><div class="step">保留或修正</div></div><section class="game"><div class="scene no-pan" tabindex="0" role="application" aria-label="石器打制场景；方向键调整当前选择"><canvas class="cv-fill" role="img" aria-label="石核中央显示目标刃缘、候选平台、击打方向和每次剥片留下的疤痕。"></canvas><div class="instruction" id="prompt">先选择希望形成连续锐边的位置。</div><div class="feedback" id="feedback" aria-live="polite">目标先于动作：未选刃缘时不能挥锤。</div></div><div class="loopback" aria-hidden="true"></div><div class="bar"><div class="control"><div class="ctl"><label id="rangeLabel" for="choice">目标刃缘</label><input id="choice" type="range" min="0" max="2" value="1" step="1" aria-describedby="prompt"><span class="tick" id="choiceVal">中部</span></div></div><div class="actions"><button type="button" class="primary" id="act">确认目标</button><button type="button" id="check">检查刃缘</button><button type="button" id="reset">重置石核</button></div><div class="stats"><div class="stat"><b id="edge">—</b><span>有效刃缘</span></div><div class="stat"><b id="grip">—</b><span>握持区</span></div><div class="stat"><b id="hits">0 击</b><span>击打次数</span></div></div></section>';

    var P=Lec.P;
    /* 旧版数据包没有本页专用口径时，仅启用同构的教学模型；正式口径存在时全部由 Lec 接管。 */
    var S=Lec.K.p26KnappingScenario||{platforms:[{angleWindowDeg:[-25,20]},{angleWindowDeg:[-15,30]},{angleWindowDeg:[-30,10]}],hammerMassKg:.7,success:{minEffectiveEdgeRatio:.7,minGripAreaRatio:.5},physics:{gravityScale:.8,restitution:.35,airFriction:.01}};
    var platforms=S.platforms;
    function finite(v,d){return P.finite?P.finite(v,d):(Number.isFinite(v)?v:d)}
    function clamp(v,a,b){return P.clamp?P.clamp(v,a,b):Math.max(a,Math.min(b,v))}
    function percent(v){return P.percent?P.percent(v,1):v*100}
    function impact(m,v){return P.p26ImpactImpulse?P.p26ImpactImpulse(m,v):m*v}
    function velocity(v){return P.p26MatterVelocityToMS?P.p26MatterVelocityToMS(v):v*.18}
    function deviation(a,w){return P.p26AngleDeviation?P.p26AngleDeviation(a,w):(a<w[0]?w[0]-a:a>w[1]?a-w[1]:0)}
    var cv=main.querySelector('canvas'), ctx=cv.getContext('2d'), scene=main.querySelector('.scene');
    var steps=[].slice.call(main.querySelectorAll('.step')), slider=document.getElementById('choice'), act=document.getElementById('act');
    var state={phase:0,target:1,platform:0,angle:0,power:50,strikes:[],damage:[],flakes:[],effective:0,grip:1};
    var Engine=Matter.Engine, Bodies=Matter.Bodies, Composite=Matter.Composite;
    var engine=Engine.create(); engine.gravity.y=(S.physics&&S.physics.gravityScale)||0.8;
    var hammer=Bodies.circle(260,90,32,{isStatic:true,restitution:(S.physics&&S.physics.restitution)||0.35,frictionAir:(S.physics&&S.physics.airFriction)||0.01});
    var ground=Bodies.rectangle(700,385,1400,30,{isStatic:true}); Composite.add(engine.world,[hammer,ground]);
    function fmt(v,d){return P.formatNumber(v,d||0);}
    function setPhase(n){state.phase=n;steps.forEach(function(x,i){x.className='step '+(i===n?'is-current':i<n?'is-past':'')});
      var labels=['目标刃缘','击打平台','落锤方向','击打','材料反馈','保留或修正'];
      document.getElementById('rangeLabel').textContent=labels[n]; slider.disabled=n>2;
      if(n===0){slider.min=0;slider.max=2;slider.step=1;slider.value=state.target;act.textContent='确认目标';}
      if(n===1){slider.min=0;slider.max=Math.max(0,platforms.length-1);slider.step=1;slider.value=state.platform;act.textContent='确认平台';}
      if(n===2){var w=platforms[state.platform].angleWindowDeg||[-35,35]; slider.min=-70;slider.max=70;slider.step=5;slider.value=state.angle;act.textContent='确认方向并击打';}
      document.getElementById('prompt').textContent=n===0?'选择一段目标刃缘。':n===1?'选择平台；石核会保留上次击打的损伤。':n===2?'调整方向。力度由按住确认键的时间决定。':n===4?'读取疤痕、剥片和平台状态。':'检查刃缘，或从现状继续修正。'; updateText();draw();}
    function updateText(){var v=+slider.value;document.getElementById('choiceVal').textContent=state.phase===0?['左侧','中部','右侧'][v]:state.phase===1?('平台 '+(v+1)):state.phase===2?(v+'°'):'';
      document.getElementById('edge').textContent=state.effective?fmt(percent(state.effective),0):'0%';document.getElementById('grip').textContent=fmt(percent(state.grip),0);document.getElementById('hits').textContent=state.strikes.length+' 击';}
    slider.addEventListener('input',function(){var v=+this.value;if(state.phase===0)state.target=v;if(state.phase===1)state.platform=v;if(state.phase===2)state.angle=clamp(finite(v,0),-70,70);updateText();draw();});
    var held=0; act.addEventListener('pointerdown',function(){held=performance.now()});
    act.addEventListener('click',function(){if(state.phase===0)setPhase(1);else if(state.phase===1)setPhase(2);else if(state.phase===2){state.power=clamp((performance.now()-held)/8+35,35,90);strike();}});
    function strike(){setPhase(3);Matter.Body.setPosition(hammer,{x:270,y:95});Matter.Body.setStatic(hammer,false);Matter.Body.setVelocity(hammer,{x:10+state.power/15,y:5+state.angle/30});setTimeout(resolveStrike,340);}
    function resolveStrike(){Matter.Body.setStatic(hammer,true);var plat=platforms[state.platform], velocityMS=velocity(Math.sqrt(hammer.velocity.x*hammer.velocity.x+hammer.velocity.y*hammer.velocity.y));var impulse=impact(S.hammerMassKg,velocityMS);var dev=deviation(state.angle,plat.angleWindowDeg);var kind=impulse<1?'未启动':dev>30?'短剥片':impulse>8?'平台破坏':'目标剥片';state.strikes.push({platform:state.platform,angle:state.angle,result:kind});state.flakes.push({x:820+state.platform*35,y:280,a:state.angle});if(kind==='目标剥片')state.effective=Math.min(1,state.effective+0.38);if(kind==='平台破坏'){state.damage.push(state.platform);state.grip=Math.max(0.45,state.grip-0.12);}document.getElementById('feedback').textContent=kind+'：材料的变化已保留，下一锤必须据此调整。';setPhase(4);setTimeout(function(){setPhase(5)},450);}
    act.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&state.phase===2)held=performance.now()-240;});
    document.getElementById('check').onclick=function(){var ok=state.effective>=S.success.minEffectiveEdgeRatio&&state.grip>=S.success.minGripAreaRatio;document.getElementById('feedback').textContent=ok?'刃缘连续，握持区仍可用：工具完成。':'刃缘或握持区尚未达标；从现有石核继续修正。';if(!ok)setPhase(1);};
    document.getElementById('reset').onclick=function(){state={phase:0,target:1,platform:0,angle:0,power:50,strikes:[],damage:[],flakes:[],effective:0,grip:1};document.getElementById('feedback').textContent='目标先于动作：未选刃缘时不能挥锤。';setPhase(0);};
    function draw(){Deck.fit(cv);var w=cv.clientWidth,h=cv.clientHeight;ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(w*.63,h*.56);ctx.beginPath();ctx.moveTo(-180,65);ctx.quadraticCurveTo(-210,-70,-90,-135);ctx.quadraticCurveTo(55,-175,180,-70);ctx.quadraticCurveTo(210,65,100,120);ctx.quadraticCurveTo(-35,150,-180,65);ctx.closePath();ctx.fillStyle=Deck.rgb('--line-strong');ctx.fill();ctx.strokeStyle=Deck.rgb('--text');ctx.lineWidth=3;ctx.stroke();
      var tx=[-120,0,115][state.target];ctx.beginPath();ctx.arc(tx,-105,70,Math.PI*.95,Math.PI*1.85);ctx.strokeStyle=Deck.rgb('--accent');ctx.lineWidth=8;ctx.globalAlpha=.75;ctx.stroke();ctx.globalAlpha=1;
      platforms.forEach(function(p,i){var a=Math.PI*(1.05+i/Math.max(1,platforms.length-1)*.8),x=Math.cos(a)*178,y=Math.sin(a)*118;ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fillStyle=state.damage.indexOf(i)>=0?Deck.rgb('--danger'):i===state.platform?Deck.rgb('--warning'):Deck.rgb('--surface');ctx.fill();ctx.strokeStyle=Deck.rgb('--text');ctx.stroke();});
      state.strikes.forEach(function(s,i){ctx.beginPath();ctx.moveTo(-60+i*20,-80);ctx.quadraticCurveTo(0,0,70-i*12,85);ctx.strokeStyle=s.result==='目标剥片'?Deck.rgb('--success'):Deck.rgb('--muted');ctx.lineWidth=5;ctx.stroke();});ctx.restore();
      ctx.beginPath();ctx.moveTo(300,110);ctx.lineTo(w*.58,h*.42);ctx.strokeStyle=Deck.rgb('--warning');ctx.lineWidth=4;ctx.stroke();Deck.arrow(ctx,300,110,w*.58,h*.42,14);
      ctx.beginPath();ctx.arc(260,90,32,0,Math.PI*2);ctx.fillStyle=Deck.rgb('--muted');ctx.fill();}
    Deck.onResize(draw);Deck.loop(function(t,dt){if(!hammer.isStatic){Engine.update(engine,Math.min(dt*1000,32));draw();}},{still:1});setPhase(0);
  </script>
</body>
</html>
