<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    origami-relay{display:block;width:100%;height:100%}
    .p27-shell{height:100%;display:flex;gap:var(--sp-5)}
    .p27-play{flex:2 1 0;min-width:0;display:flex;flex-direction:column;gap:var(--sp-3)}
    .p27-side{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:var(--sp-3)}
    .p27-instruction{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-4)}
    .p27-board{position:relative;flex:1 1 0;min-height:0;overflow:hidden;padding:var(--sp-4)}
    .p27-paper{position:relative;height:270px;outline:none;touch-action:none;cursor:grab}
    .p27-paper:focus-visible{box-shadow:0 0 0 4px var(--focus);border-radius:var(--radius-md)}
    .p27-paper svg{width:100%;height:100%;display:block}
    .p27-chain{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);padding-top:var(--sp-2)}
    .p27-node{flex:0 0 62px;text-align:center;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
    .p27-node::before{content:"";display:block;width:34px;height:34px;margin:0 auto var(--sp-1);background:var(--surface-soft);border:2px solid var(--line-strong);border-radius:50%}
    .p27-node.on::before{background:var(--accent-soft);border-color:var(--accent)}
    .p27-node.bad::before{background:var(--danger-soft);border-color:var(--danger)}
    .p27-link{height:3px;flex:1;background:var(--line);border-radius:999px}
    .p27-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2)}
    .p27-metric{padding:var(--sp-2) var(--sp-3);background:var(--surface-soft);border-radius:var(--radius-sm)}
    .p27-metric strong{display:block;font-size:var(--fs-h2);line-height:1.3;font-variant-numeric:tabular-nums}
    .p27-metric span{font-size:var(--fs-label);line-height:1.4;color:var(--muted)}
    .p27-side .k-generalization{flex:1;grid-template-columns:minmax(0,1fr) 28px minmax(0,1.18fr);min-height:0}
    .p27-side .k-generalization>.claim{padding:var(--sp-4);font-size:var(--fs-body)}
    .p27-side .k-generalization .support{padding:var(--sp-2) var(--sp-3)}
    .p27-support{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2)}
    .p27-support input{width:22px;height:22px;accent-color:var(--accent)}
    .p27-support b{color:var(--text);font-size:var(--fs-body)}
    .p27-result{padding:var(--sp-3) var(--sp-4);border-radius:var(--radius-md);background:var(--warning-soft);border:1px solid var(--line-strong)}
    .p27-result.good-state{background:var(--success-soft);border-color:var(--success)}
    .p27-result strong{display:block;font-size:var(--fs-h2);line-height:1.3}
    .p27-result span{font-size:var(--fs-sec);line-height:var(--lh-copy)}
    .p27-help{font-size:var(--fs-label);line-height:1.4;color:var(--muted)}
  </style>
</head>
<body data-page="27" data-total="50">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/seedrandom.min.js"></script>
  <script>
    Lec.mount({
      index: 27,
      kicker: "CULTURAL ACCUMULATION",
      title: "折得更准，才能折得更远",
      take: "文化累积依赖较准确的模仿、教学、修正与保存。"
    });
    Deck.init({ index: 27, total: 50 });

    class OrigamiRelay extends HTMLElement {
      constructor(){ super(); this.attachShadow({mode:"open"}); }
      connectedCallback(){
        var scenario=Lec.K.p27OrigamiChainScenario||{};
        this.cfg={
          people: Number(scenario.relayCount||scenario.people||6),
          actions: Number(scenario.actionCount||scenario.foldCount||5),
          tolerance: Number(scenario.correctionTolerance||scenario.tolerance||0.12),
          threshold: Number(scenario.successThreshold||0.72)
        };
        var configuredError=Number(Lec.K.culturalTransmissionErrorDefault); this.base=Number.isFinite(configuredError)?Lec.P.clamp(Lec.P.finite(configuredError),0,1):0;
        this.seed=Lec.K.p27TransmissionSeed;
        this.factors=Lec.K.p27TransmissionSupportFactors||{};
        this.render(); this.reset();
      }
      render(){
        var css=document.querySelector("style").textContent;
        this.shadowRoot.innerHTML='<style>'+css+'</style><section class="p27-shell">'+
          '<div class="p27-play min0"><div class="p27-instruction"><p class="lead">拖动右上纸角沿箭头折下；完成后自动传给下一位。</p><span class="p27-help">完成后再次操作：同种子重跑<br>Shift＋Enter：恢复默认条件</span></div>'+
          '<div class="p27-board panel"><div class="p27-paper no-pan" tabindex="0" role="button" aria-label="折下纸张右上角，开始传递" aria-describedby="foldHelp"><svg viewBox="0 0 760 270" aria-hidden="true"><path class="sheet" d="M180 20 H580 V250 H180 Z" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="3"/><path class="master" d="M180 20 L430 20 L580 170 L580 250 L180 250 Z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="3"/><path class="final" d="M180 20 L430 20 L580 170 L580 250 L180 250 Z" fill="none" stroke="var(--danger)" stroke-width="4" stroke-dasharray="10 8"/><path d="M580 20 C540 52 506 82 470 116" fill="none" stroke="var(--accent)" stroke-width="4"/><path d="M470 116 l8 -18 m-8 18 l18 -5" fill="none" stroke="var(--accent)" stroke-width="4"/><circle class="handle" cx="580" cy="20" r="18" fill="var(--accent)"/></svg></div><p id="foldHelp" class="sr-only">用指针拖动纸角，或按 Enter 完成折叠。</p><div class="p27-chain" aria-label="接力链"></div></div>'+
          '<div class="p27-metrics"><div class="p27-metric"><strong class="similar">—</strong><span>最终相似度</span></div><div class="p27-metric"><strong class="retain">—</strong><span>关键折痕保留率</span></div><div class="p27-metric"><strong class="corrected">—</strong><span>发生修正的动作数</span></div></div></div>'+
          '<aside class="p27-side min0"><div class="k-generalization"><div class="claim">传递准确度决定已有结构能否成为下一次改进的起点</div><div class="trunk"></div><div class="supports"><div class="support"><div class="p27-support"><b>模仿</b><span>观察并复现</span></div></div><label class="support p27-support"><b>教学</b><input data-key="teaching" type="checkbox" aria-label="启用教学"></label><label class="support p27-support"><b>修正</b><input data-key="correction" type="checkbox" aria-label="启用修正"></label><label class="support p27-support"><b>保存</b><input data-key="preservation" type="checkbox" aria-label="启用保存"></label></div></div><div class="p27-result" aria-live="polite"><strong>等待交棒</strong><span>先完成一次折叠，再比较不同支撑条件。</span></div></aside></section>';
        this.paper=this.shadowRoot.querySelector('.p27-paper');
        this.handle=this.shadowRoot.querySelector('.handle');
        this.finalPath=this.shadowRoot.querySelector('.final');
        this.inputs=[...this.shadowRoot.querySelectorAll('input')];
        this.paper.addEventListener('pointerdown',e=>{this.paper.setPointerCapture(e.pointerId);this.dragging=true;});
        this.paper.addEventListener('pointermove',e=>{if(!this.dragging)return;var p=Deck.pt(this.paper,e);this.handle.setAttribute('cx',Deck.clamp(p.x/this.paper.clientWidth*760,430,580));this.handle.setAttribute('cy',Deck.clamp(p.y/this.paper.clientHeight*270,20,170));});
        this.paper.addEventListener('pointerup',e=>{this.dragging=false;this.play();});
        this.paper.addEventListener('pointercancel',()=>this.dragging=false);
        this.paper.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(e.shiftKey)this.reset();else this.play();}});
        this.inputs.forEach(i=>i.addEventListener('change',()=>{this.state.supports[i.dataset.key]=i.checked;this.play();}));
      }
      fresh(){return {running:false,complete:false,supports:{teaching:false,correction:false,preservation:false},metrics:null,trace:[]};}
      factor(key){var v=this.factors[key];return Number.isFinite(Number(v))?Number(v):1;}
      play(){
        var rng=new Math.seedrandom(this.seed), s=this.state, rate=this.base;
        Object.keys(s.supports).forEach(k=>{if(s.supports[k])rate*=this.factor(k);});
        rate=Lec.P.clamp(Lec.P.finite(rate),0,1);
        var errors=0, omissions=0, shifts=0, corrected=0, total=this.cfg.actions*this.cfg.people;
        s.trace=[];
        for(var person=0;person<this.cfg.people;person++){
          var lost=0;
          for(var a=0;a<this.cfg.actions;a++) if(rng()<rate){errors++;lost++;if(rng()<0.45)omissions++;else shifts++;}
          if(s.supports.correction&&lost){var fix=Math.min(lost,Math.floor(lost*(1-this.factor('correction'))+0.5));corrected+=fix;errors-=fix;}
          if(s.supports.preservation) errors=Math.max(0,errors-Math.floor(errors*(1-this.factor('preservation'))));
          s.trace.push({person:person+1,errors:errors});
        }
        var similarity=Lec.P.clamp(1-errors/Math.max(1,total),0,1);
        var retained=Lec.P.ratio(Math.max(0,this.cfg.actions-Math.min(this.cfg.actions,omissions)),this.cfg.actions);
        var success=similarity>=this.cfg.threshold&&retained>0;
        s.complete=true;s.metrics={rate:rate,similarity:similarity,retained:retained,corrected:corrected,success:success,omissions:omissions,shifts:shifts};
        this.update();
        this.dispatchEvent(new CustomEvent('game-progress',{bubbles:true,composed:true,detail:{state:this.getState(),action:'fold-and-pass',metrics:s.metrics}}));
        this.dispatchEvent(new CustomEvent('game-complete',{bubbles:true,composed:true,detail:{score:similarity,metrics:s.metrics,trace:s.trace.slice()}}));
      }
      update(){
        var s=this.state,m=s.metrics, chain=this.shadowRoot.querySelector('.p27-chain');chain.innerHTML='';
        for(var i=0;i<this.cfg.people;i++){var n=document.createElement('span');n.className='p27-node'+(s.complete?' on':'')+(s.trace[i]&&s.trace[i].errors?' bad':'');n.textContent='第'+(i+1)+'棒';chain.appendChild(n);if(i<this.cfg.people-1){var l=document.createElement('i');l.className='p27-link';chain.appendChild(l);}}
        if(!m)return;
        this.shadowRoot.querySelector('.similar').textContent=Lec.P.percent(m.similarity);
        this.shadowRoot.querySelector('.retain').textContent=Lec.P.percent(m.retained);
        this.shadowRoot.querySelector('.corrected').textContent=Lec.P.formatNumber(m.corrected);
        var dx=Math.min(70,(m.omissions+m.shifts)*7),dy=Math.min(45,m.shifts*5);this.finalPath.setAttribute('transform','translate('+dx+' '+dy+')');
        var r=this.shadowRoot.querySelector('.p27-result');r.classList.toggle('good-state',m.success);r.querySelector('strong').textContent=m.success?'可继续累积':'版本明显流失';
        r.querySelector('span').textContent=m.success?'已有折痕被保留，仍有位置可增加新动作。':(m.omissions>=m.shifts?'主要损失来自动作遗漏。':'主要损失来自折痕偏移。');
        this.paper.setAttribute('aria-label','本轮完成；再次折叠可用同一种子重跑');
      }
      start(){this.play();this.dispatchEvent(new CustomEvent('game-start',{bubbles:true,composed:true}));}
      reset(){this.state=this.fresh();this.inputs.forEach(i=>i.checked=false);this.handle.setAttribute('cx','580');this.handle.setAttribute('cy','20');this.finalPath.setAttribute('transform','');this.shadowRoot.querySelector('.similar').textContent='—';this.shadowRoot.querySelector('.retain').textContent='—';this.shadowRoot.querySelector('.corrected').textContent='—';var r=this.shadowRoot.querySelector('.p27-result');r.classList.remove('good-state');r.querySelector('strong').textContent='等待交棒';r.querySelector('span').textContent='先完成一次折叠，再比较不同支撑条件。';this.update();this.dispatchEvent(new CustomEvent('game-reset',{bubbles:true,composed:true}));}
      getState(){return JSON.parse(JSON.stringify(this.state));}
    }
    customElements.define('origami-relay',OrigamiRelay);
    var game=document.createElement('origami-relay');
    document.getElementById('main').appendChild(game);
  </script>
</body>
</html>
