<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:var(--sp-3)}
    .taskline{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);height:32px;flex:0 0 32px}
    .taskline p{font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--muted)}
    .meter{flex:0 0 auto;font-size:var(--fs-label);font-weight:700;color:var(--accent-strong)}
    .game-shell{display:flex;flex-direction:column;gap:var(--sp-3);min-height:0;height:530px;flex:0 0 530px}
    .world{position:relative;height:250px;flex:0 0 250px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-soft);overflow:hidden}
    #konva{position:absolute;inset:0}
    .spoken{position:absolute;left:24%;right:24%;top:43%;z-index:2;display:flex;align-items:center;justify-content:center;min-height:54px;padding:var(--sp-2) var(--sp-4);box-sizing:border-box;border:2px dashed var(--line-strong);border-radius:var(--radius-md);background:var(--surface);font-size:var(--fs-body);line-height:var(--lh-copy);font-weight:700;text-align:center;pointer-events:none}
    .controls{position:absolute;left:var(--sp-4);right:var(--sp-4);bottom:var(--sp-3);z-index:3;display:flex;align-items:center;justify-content:center;gap:var(--sp-3)}
    .phrase{min-width:180px;background:var(--surface)}
    .phrase[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
    .action{min-width:104px}
    .class-wrap{position:absolute;left:0;right:0;top:350px;height:120px}
    .links{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none}
    .links path{fill:none;stroke:var(--line-strong);stroke-width:2;stroke-dasharray:6 5}
    .class-row{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-4);height:100%}
    .class-row>.min0{min-width:0}
    .k-classification{height:100%;gap:0}
    .k-classification>.lv{height:100%;width:100%;box-sizing:border-box}
    .k-classification .box{height:108px;box-sizing:border-box;overflow:visible;transition:background .2s,border-color .2s}
    .k-classification .box.is-on{background:var(--success-soft);border-color:var(--success)}
    .k-classification .box>.bt{padding:var(--sp-2) var(--sp-4);font-size:var(--fs-body)}
    .k-classification .box>.bc{padding:var(--sp-2) var(--sp-4);font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--muted)}
    .tag{display:block;margin-top:var(--sp-1);font-size:var(--fs-label);font-weight:700;color:var(--accent-strong)}
    button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  </style>
</head>
<body data-page="28" data-total="50">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/konva.min.js"></script>
  <script>
    Lec.mount({
      index: 28,
      kicker: "LANGUAGE / COORDINATION",
      title: "一句话，怎样让别人稍后在别处行动？",
      take: "语言能压缩经验、指向缺席对象，并安排尚未发生的行动。"
    });
    Deck.init({ index: 28, total: 50 });

    var main=document.getElementById('main');
    main.innerHTML='<div class="taskline"><p>侦察者掌握完整信息。选择短语拼出口头指令，再传达给远处的行动者。</p><span class="meter" id="meter">必要信息 0 / 4</span></div><section class="game-shell" aria-label="拼接协作指令小游戏"><div class="world no-pan" id="world"><div id="konva" aria-hidden="true"></div><div class="spoken" id="spoken">口头指令带：尚未拼接</div><div class="controls"><button type="button" class="phrase" data-i="0" aria-pressed="false">天亮后</button><button type="button" class="phrase" data-i="1" aria-pressed="false">不要走北坡</button><button type="button" class="phrase" data-i="2" aria-pressed="false">改走河谷取水</button><button type="button" class="primary action" id="send">传达</button></div></div><div class="class-wrap"><svg class="links" viewBox="0 0 1408 166" preserveAspectRatio="none" aria-hidden="true"><path d="M704 0 C704 34 235 22 235 56"/><path d="M704 0 L704 56"/><path d="M704 0 C704 34 1173 22 1173 56"/></svg><div class="class-row"><div class="min0 k-classification"><div class="lv"><div class="box" id="c0"><div class="bt">① 压缩经验</div><div class="bc">把危险线索压成可行动的判断。<span class="tag" id="t0">尚未表达风险</span></div></div></div></div><div class="min0 k-classification"><div class="lv"><div class="box" id="c1"><div class="bt">② 指向缺席对象</div><div class="bc">用方位排除错误地点。<span class="tag" id="t1">尚未指明地点</span></div></div></div><div class="min0 k-classification"><div class="lv"><div class="box" id="c2"><div class="bt">③ 安排未来行动</div><div class="bc">明确时机与替代动作。<span class="tag" id="t2">尚未形成计划</span></div></div></div></div></div></div><p class="sr-only" id="status" aria-live="polite"></p></section>';

    var state={picked:[false,false,false],done:false};
    var phrases=['天亮后','不要走北坡','改走河谷取水'];
    var buttons=[].slice.call(document.querySelectorAll('.phrase'));
    var send=document.getElementById('send');
    function slots(){return [state.picked[1],state.picked[1]||state.picked[2],state.picked[0]&&state.picked[2]]}
    function render(){
      buttons.forEach(function(b,i){b.setAttribute('aria-pressed',String(state.picked[i]));});
      var chosen=phrases.filter(function(_,i){return state.picked[i]});
      document.getElementById('spoken').textContent=chosen.length?chosen.join('，'):'口头指令带：尚未拼接';
      var s=slots(), count=(state.picked[0]?1:0)+(state.picked[1]?2:0)+(state.picked[2]?1:0);
      document.getElementById('meter').textContent='必要信息 '+Lec.P.formatNumber(count)+' / '+Lec.P.formatNumber(4);
      ['风险判断已表达','地点已指明','时机与行动已安排'].forEach(function(txt,i){document.getElementById('c'+i).classList.toggle('is-on',s[i]);document.getElementById('t'+i).textContent=s[i]?txt:['尚未表达风险','尚未指明地点','尚未形成计划'][i]});
      if(state.done){send.textContent='重拼';buttons.forEach(function(b){b.disabled=true})}else{send.textContent='传达';buttons.forEach(function(b){b.disabled=false})}
      draw();
    }
    buttons.forEach(function(b,i){b.addEventListener('click',function(){if(!state.done){state.picked[i]=!state.picked[i];render()}})});
    send.addEventListener('click',function(){
      if(state.done){state={picked:[false,false,false],done:false};document.getElementById('status').textContent='已恢复初始状态。';render();return}
      state.done=true;var s=slots();var msg;
      if(s[0]&&s[1]&&s[2]) msg='行动者等到天亮，避开北坡，沿河谷完成取水。';
      else if(!s[1]) msg='地点不明确，行动者停下确认该去哪里。';
      else if(!s[2]) msg='时机或动作不完整，行动者无法开始。';
      else msg='行动者知道地点，却不知道为何要避开北坡。';
      document.getElementById('status').textContent=msg;render();
    });

    var ks=new Konva.Stage({container:'konva',width:100,height:100});var layer=new Konva.Layer();ks.add(layer);
    function draw(){
      var el=document.getElementById('world'),w=el.clientWidth,h=el.clientHeight;ks.size({width:w,height:h});layer.destroyChildren();
      var text=Deck.rgb('--text'),muted=Deck.rgb('--muted'),line=Deck.rgb('--line'),accent=Deck.rgb('--accent'),danger=Deck.rgb('--danger'),good=Deck.rgb('--success');
      layer.add(new Konva.Line({points:[w*.22,h*.30,w*.78,h*.30],stroke:line,strokeWidth:3,dash:[8,7]}));
      layer.add(new Konva.Circle({x:w*.12,y:h*.24,r:28,fill:accent}));
      layer.add(new Konva.Text({x:w*.035,y:h*.34,width:w*.17,text:'侦察者\n看见北坡的新鲜猛兽足迹',align:'center',fontSize:16,lineHeight:1.45,fill:text,fontStyle:'bold'}));
      layer.add(new Konva.RegularPolygon({x:w*.30,y:h*.24,sides:3,radius:25,fill:danger}));
      layer.add(new Konva.Text({x:w*.24,y:h*.34,width:w*.13,text:'北坡\n危险迹象',align:'center',fontSize:16,lineHeight:1.45,fill:danger}));
      layer.add(new Konva.Circle({x:w*.88,y:h*.24,r:28,fill:state.done?(slots()[0]&&slots()[1]&&slots()[2]?good:danger):muted}));
      layer.add(new Konva.Text({x:w*.79,y:h*.34,width:w*.18,text:state.done?(slots()[0]&&slots()[1]&&slots()[2]?'行动者\n沿河谷安全取水':'行动者\n信息不足，行动受阻'):'行动者\n看不见北坡，等待口头指令',align:'center',fontSize:16,lineHeight:1.45,fill:text,fontStyle:'bold'}));
      layer.draw();
    }
    Deck.onResize(draw);render();
  </script>
</body>
</html>
