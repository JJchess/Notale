<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:var(--sp-2)}
    .work{display:flex;gap:var(--sp-4);min-height:0;flex:1 1 auto}
    .viz{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:var(--sp-2)}
    .controls{flex:0 0 270px;min-width:0;display:flex;flex-direction:column;gap:var(--sp-3)}
    .reference{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-2) var(--sp-4)}
    .device{display:flex;align-items:center;gap:var(--sp-2);font-weight:700}
    .device-mark{width:54px;height:32px;border:2px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent-soft);position:relative}
    .device-mark:after{content:"";position:absolute;right:var(--sp-2);top:var(--sp-2);width:12px;height:12px;border-radius:50%;background:var(--cyan)}
    .facts{display:flex;gap:var(--sp-4);flex-wrap:wrap}
    .fact{font-size:var(--fs-label);font-weight:680;color:var(--muted)}
    .process-wrap{position:relative;min-height:128px}
    .k-process{padding:var(--sp-4) 0;gap:var(--sp-2)}
    .k-process>.step{padding:var(--sp-3);text-align:center;font-size:var(--fs-label);font-weight:720}
    .k-process>.arw{flex-basis:22px}
    .tracks{flex:1 1 auto;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
    #relay{display:block;width:100%;height:100%}
    .svg-label{font:700 var(--fs-label) var(--font-sans);fill:var(--text)}
    .svg-note{font:500 var(--fs-label) var(--font-sans);fill:var(--muted)}
    .rail{stroke:var(--line-strong);stroke-width:3}
    .token{stroke:var(--surface);stroke-width:2}
    .tok-shape{fill:var(--accent)}.tok-order{fill:var(--cyan)}.tok-measure{fill:var(--warning)}
    .lost{fill:var(--danger-soft);stroke:var(--danger);stroke-width:2;stroke-dasharray:5 4}
    .saved{fill:var(--success-soft);stroke:var(--success);stroke-width:2}
    .ctl{flex-wrap:wrap}.ctl label{width:100%}.ctl select,.ctl input{width:100%}
    .stage-status{padding:var(--sp-4)}
    .status-title{font-size:var(--fs-h2);line-height:1.3;font-weight:720;margin-bottom:var(--sp-2)}
    .legend{display:flex;flex-direction:column;gap:var(--sp-2);font-size:var(--fs-label)}
    .key{display:flex;align-items:center;gap:var(--sp-2)}
    .sw{width:16px;height:16px;border-radius:50%}.sw.shape{background:var(--accent)}.sw.order{background:var(--cyan)}.sw.measure{background:var(--warning)}
    .controls button{width:100%}
    .feedback{min-height:72px}
  </style>
</head>
<body data-page="29" data-total="50">
  <div id="stage"><main id="main">
    <div class="reference panel" aria-label="原始测量装置参照">
      <div class="device"><span class="device-mark" aria-hidden="true"></span><span>原始对象：流量测量装置</span></div>
      <div class="facts">
        <span class="fact" id="shapeFact"></span><span class="fact">顺序：接管 → 开阀 → 读数</span><span class="fact" id="measureFact"></span>
      </div>
    </div>
    <div class="work">
      <section class="viz min0" aria-label="外部记忆接力过程">
        <div class="process-wrap">
          <div class="k-process" id="process"><div class="axis"></div></div>
        </div>
        <div class="tracks"><svg id="relay" role="img" aria-label="个人记忆与外部记录两条信息接力轨道"></svg></div>
      </section>
      <aside class="controls min0">
        <div class="panel stage-status"><div class="status-title" id="phaseTitle">观察</div><p class="secondary" id="phaseText">看清结构、步骤和带单位读数，再决定怎样留下记录。</p></div>
        <div class="ctl"><label for="plan">有限记录机会分配</label><select id="plan"><option value="balanced">三种载体互补</option><option value="image">只画图像</option><option value="text">只写文字</option><option value="meter">只记数值</option></select></div>
        <div class="ctl"><label for="distort">个人记忆失真：<span id="distortValue"></span></label><input id="distort" type="range" aria-label="个人记忆失真率" step="0.01"></div>
        <div class="legend" aria-label="信息令牌图例"><span class="key"><i class="sw shape"></i>形状关系</span><span class="key"><i class="sw order"></i>顺序条件</span><span class="key"><i class="sw measure"></i>数值与单位</span></div>
        <button type="button" class="primary" id="action">收起原物并编码</button>
        <div class="note feedback" id="feedback" aria-live="polite">原始对象仍可见；下一阶段将不能依靠口头补充。</div>
      </aside>
    </div>
  </main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
    Lec.mount({index:29,kicker:"EXTERNAL MEMORY",title:"当记住的人离开，知识还能留下吗？",take:"图像、文字和仪器让知识跨越个人记忆与寿命；但后来者仍要解码和校验。"});
    Deck.init({index:29,total:50});
    var events=["观察","记忆","编码","留存","解码","校验"];
    var kinds=[{id:"shape",label:"形状关系"},{id:"order",label:"顺序条件"},{id:"measure",label:"数值与单位"}];
    var device={parts:["入口管","阀门","刻度窗"],steps:["接管","开阀","读数"],base:4,multiplier:3,unit:"L/min"};
    var measured=device.base*device.multiplier;
    document.getElementById("shapeFact").textContent="结构："+device.parts.join("—");
    document.getElementById("measureFact").textContent="测量："+Lec.P.formatNumber(measured)+" "+device.unit;
    var process=document.getElementById("process");
    events.forEach(function(name,i){var s=document.createElement("div");s.className="step";s.textContent=(i+1)+" "+name;process.appendChild(s);if(i<events.length-1){var a=document.createElement("div");a.className="arw";a.setAttribute("aria-hidden","true");process.appendChild(a)}});
    var def=Lec.P.finite(Lec.K.culturalTransmissionErrorDefault)?Lec.K.culturalTransmissionErrorDefault:0.05;
    var min=0,max=def*4;
    var range=document.getElementById("distort");range.min=min;range.max=max;range.value=def;
    var state={phase:0,distortion:def,plan:"balanced"};
    function pct(v){return Lec.P.formatNumber(Lec.P.percent(Math.round(v*100),100),0)+"%"}
    function memoryKept(){return Math.max(0,kinds.length-Math.ceil(state.distortion*kinds.length*3))}
    function externalKept(){return state.plan==="balanced"?kinds.length:1}
    function update(){
      var raw=+range.value;state.distortion=Lec.P.clamp(Lec.P.finite(raw)?raw:def,min,max);state.plan=document.getElementById("plan").value;
      document.getElementById("distortValue").textContent=pct(state.distortion);
      var steps=process.querySelectorAll(".step");steps.forEach(function(el,i){el.classList.toggle("is-current",i===state.phase);el.classList.toggle("is-past",i<state.phase)});
      var titles=events;var texts=["看清结构、步骤和带单位读数，再决定怎样留下记录。","原物已收起；个人记忆可能遗漏或重组信息。","把记录机会分配给图像、文字和仪器记录。","原观察者离场，外部载体继续留存。","后来者只能读取留下的记录并重建对象。","把重建结果逐项与原始对象对齐。"];
      document.getElementById("phaseTitle").textContent=titles[state.phase];document.getElementById("phaseText").textContent=texts[state.phase];
      document.querySelector(".reference").style.opacity=(state.phase===0||state.phase===5)?"1":"0.38";
      var action=document.getElementById("action");action.textContent=state.phase===0?"收起原物并编码":state.phase<5?"交给后来者":"重来一次";
      document.getElementById("plan").disabled=state.phase>1;draw();
    }
    function draw(){
      var svg=d3.select("#relay"),w=920,h=300;svg.attr("viewBox","0 0 "+w+" "+h);svg.selectAll("*").remove();
      var rows=[{name:"只靠个人记忆",y:92,kept:memoryKept(),external:false},{name:"借助外部记录",y:218,kept:externalKept(),external:true}];
      rows.forEach(function(row){svg.append("text").attr("class","svg-label").attr("x",22).attr("y",row.y-28).text(row.name);svg.append("line").attr("class","rail").attr("x1",190).attr("x2",875).attr("y1",row.y).attr("y2",row.y);kinds.forEach(function(k,i){var x=245+i*230,ok=i<row.kept;var g=svg.append("g");if(k.id==="shape")g.append("rect").attr("x",x-14).attr("y",row.y-14).attr("width",28).attr("height",28).attr("rx",4).attr("class",ok?(row.external?"saved token":"tok-shape token"):"lost");else if(k.id==="order")g.append("path").attr("d","M"+(x-16)+","+(row.y+13)+" L"+x+","+(row.y-15)+" L"+(x+16)+","+(row.y+13)+" Z").attr("class",ok?(row.external?"saved token":"tok-order token"):"lost");else g.append("circle").attr("cx",x).attr("cy",row.y).attr("r",15).attr("class",ok?(row.external?"saved token":"tok-measure token"):"lost");g.append("text").attr("class","svg-note").attr("text-anchor","middle").attr("x",x).attr("y",row.y+42).text(ok?k.label:"丢失："+k.label)});var ratio=Lec.P.ratio(row.kept,kinds.length);svg.append("text").attr("class","svg-label").attr("text-anchor","end").attr("x",890).attr("y",row.y-28).text("保留 "+Lec.P.formatNumber(Lec.P.percent(row.kept,kinds.length),0)+"%")});
    }
    range.addEventListener("input",update);document.getElementById("plan").addEventListener("change",update);
    document.getElementById("action").addEventListener("click",function(){if(state.phase===5){state.phase=0;document.getElementById("feedback").textContent="原始对象仍可见；下一阶段将不能依靠口头补充。"}else{state.phase=state.phase===0?2:Math.min(5,state.phase+1);if(state.phase===5){var msg=state.plan==="balanced"?"三种载体互补：后来者能重建关系、步骤，并复查带单位读数。":state.plan==="image"?"空间关系保住了，操作条件与测量单位没有留下。":state.plan==="text"?"步骤可读，但部件关系与可复查读数需要猜测。":"数值留下了；缺少结构、步骤或单位时，记录仍无法可靠解释。";document.getElementById("feedback").textContent=msg}else document.getElementById("feedback").textContent="记录与最初记住它的人已经分离。"}update()});
    update();
  </script>
</body>
</html>
