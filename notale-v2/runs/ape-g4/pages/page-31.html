<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .p31{height:100%;display:flex;flex-direction:column;gap:var(--sp-3)}
    .p31-meta{display:flex;align-items:center;gap:var(--sp-3);font-size:var(--fs-sec);color:var(--muted)}
    .p31-meta strong{color:var(--success)}
    .p31-body{display:flex;gap:var(--sp-4);flex:1;min-height:0}
    .field{flex:2 1 0;display:flex;flex-direction:column;gap:var(--sp-3);padding:var(--sp-4)}
    .field-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
    .field-head h2{font-size:var(--fs-h2)}
    .readings{display:flex;gap:var(--sp-4);font-size:var(--fs-label);color:var(--muted)}
    .readings b{color:var(--accent-strong);font-variant-numeric:tabular-nums}
    .plot{position:relative;flex:1;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-soft)}
    .plot canvas{display:block;width:100%;height:100%}
    .plot-key{position:absolute;left:var(--sp-3);bottom:var(--sp-3);padding:var(--sp-2) var(--sp-3);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);font-size:var(--fs-label);color:var(--muted)}
    .controls{display:flex;align-items:center;gap:var(--sp-2)}
    .controls .ctl{flex:1;padding:var(--sp-2) var(--sp-3)}
    .controls select{flex:1}
    .feedback{font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--muted);min-height:24px}
    .loop{flex:1 1 0;display:flex;flex-direction:column;gap:var(--sp-2);padding:var(--sp-4)}
    .loop h2{font-size:var(--fs-h2)}
    .k-process.vertical{flex:1;padding:0 var(--sp-3);gap:var(--sp-1)}
    .k-process.vertical>.step{padding:var(--sp-2) var(--sp-3);font-size:var(--fs-label);font-weight:700;min-height:32px}
    .k-process.vertical>.arw{flex-basis:14px;font-size:var(--fs-body)}
    .return{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);border:2px dashed var(--line-strong);border-radius:var(--radius-md);font-size:var(--fs-label);font-weight:700;color:var(--muted)}
    .return.on{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft)}
    .tracks{display:flex;flex-direction:column;gap:var(--sp-2)}
    .track{display:grid;grid-template-columns:112px 1fr 46px;align-items:center;gap:var(--sp-2);font-size:var(--fs-label)}
    .rail{height:10px;background:var(--surface-strong);border-radius:999px;overflow:hidden}
    .rail i{display:block;height:100%;width:0;background:var(--cyan);border-radius:inherit;transition:width 500ms ease-out}
    .track output{font-size:var(--fs-tick);font-variant-numeric:tabular-nums;text-align:right}
    @media (prefers-reduced-motion:reduce){.rail i{transition:none}}
  </style>
</head>
<body data-page="31" data-total="50">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/lib/pixi.min.js"></script>
  <script>
    Lec.mount({index:31,kicker:"DOMESTICATION LOOP",title:"你在选择作物，作物也在重排你的生活",take:"人类改造其他物种的同时，也被定居生活重新塑造。"});
    Deck.init({index:31,total:50});
    var stage=document.getElementById("stage"), main=document.getElementById("main");
    var ago=Lec.P.formatNumber(Lec.K.agricultureYearsAgo || Lec.K.evolution.agricultureYearsAgo,0);
    main.innerHTML='<section class="p31"><div class="p31-meta"><strong>较确定</strong><span>农业约 '+ago+' 年前在多地先后出现，并非同时发生。</span></div><div class="p31-body"><section class="panel field min0"><div class="field-head"><h2>驯化选择实验</h2><div class="readings"><span id="season">第 1 季</span><span>可收获 <b id="yield">—</b> 粒</span><span>留种 <b id="quota">—</b> 粒</span></div></div><div class="plot" id="plot" role="img" aria-label="抽象谷物田：植株高度表示籽粒大小，穗色深浅表示成熟同步，圆形籽粒表示采集时仍未脱落。"><div class="plot-key">每株都不同；策略只从本季收获中留种</div></div><div class="controls"><div class="ctl"><label for="strategy">留种偏向</label><select id="strategy"><option value="mixed">混合留种</option><option value="large">大籽粒</option><option value="sync">同期成熟</option><option value="retain">不易脱落</option></select></div><button class="primary" id="next" type="button">进入下一季</button><button id="reset" type="button">重置</button><button id="reseed" type="button">换种子</button></div><div class="feedback" id="feedback" aria-live="polite">选择一种留种偏向，再推进至少两季，观察群体与生活安排如何一起变化。</div></section><aside class="panel loop min0"><h2>选择如何形成反馈</h2><div class="k-process vertical"><div class="axis"></div><div class="step is-current">1 野生差异</div><div class="arw"></div><div class="step">2 采集本季收获</div><div class="arw"></div><div class="step">3 人为留种</div><div class="arw"></div><div class="step">4 性状比例改变</div><div class="arw"></div><div class="step">5 收获与生活改变</div><div class="arw"></div><div class="step">6 下一轮条件改变</div></div><div class="tracks"><div class="track"><span>收获集中度</span><span class="rail"><i></i></span><output>—</output></div><div class="track"><span>储存需求</span><span class="rail"><i></i></span><output>—</output></div><div class="track"><span>劳动集中度</span><span class="rail"><i></i></span><output>—</output></div><div class="track"><span>食物来源多样性</span><span class="rail"><i></i></span><output>—</output></div></div><div class="return" id="return">↶ 完成两季后，生活投入反馈到下一轮留种</div></aside></div></section>';

    var cfg=Lec.K.p31DomesticationScenario || {populationSize:72,maxSeasons:6,seedQuota:14,traitVariation:0.22,harvestWindow:0.58,immediateUseFraction:0.32,otherFoodSources:0.55};
    var baseSeed=String(Lec.K.populationSimulationSeed)+"-p31-domestication", seedTurn=0, rng, plants=[], initialMeans, seasonIndex;
    var pop=Math.max(1,Math.round(Lec.P.finite(cfg.populationSize)));
    var maxSeasons=Math.max(2,Math.round(Lec.P.finite(cfg.maxSeasons)));
    var quota=Math.max(1,Math.round(cfg.seedQuota || pop*Lec.P.finite(cfg.seedQuotaFraction)));
    var app=new PIXI.Application({backgroundAlpha:0,antialias:true,resolution:1,autoDensity:false});
    document.getElementById('plot').insertBefore(app.view,document.getElementById('plot').firstChild);
    app.view.className='cv-fill'; Deck.fit(app.view);
    var layer=new PIXI.Container(); app.stage.addChild(layer);
    function mean(a,k){return a.reduce(function(s,p){return s+p[k]},0)/a.length}
    function makePlant(parent){var v=cfg.traitVariation||cfg.variation; return {grain:Deck.clamp(parent?parent.grain+(rng()-.5)*v:0.65+rng()*.7,.1,1.6),sync:Deck.clamp(parent?parent.sync+(rng()-.5)*v:rng(),0,1),retain:Deck.clamp(parent?parent.retain+(rng()-.5)*v:rng(),0,1)}}
    function harvestable(p){var window=cfg.harvestWindow; var w=Array.isArray(window)?Math.abs(window[1]-window[0]):Lec.P.finite(window); return Math.abs(p.sync-.5)<=w/2 && p.retain>rng()*.72}
    function resize(){var el=document.getElementById('plot');app.renderer.resize(el.clientWidth,el.clientHeight);draw()}
    function draw(){layer.removeChildren().forEach(function(c){c.destroy()});var w=app.renderer.width,h=app.renderer.height;plants.forEach(function(p,i){var x=28+(i%(Math.ceil(Math.sqrt(pop*1.7))))*(w-56)/(Math.ceil(Math.sqrt(pop*1.7))-1||1);var rows=Math.ceil(pop/Math.ceil(Math.sqrt(pop*1.7)));var y=35+Math.floor(i/Math.ceil(Math.sqrt(pop*1.7)))*(h-80)/(rows-1||1);var g=new PIXI.Graphics();var stem=16+p.grain*18;g.lineStyle(2,Deck.rgb('success'),.8).moveTo(x,y+18).lineTo(x,y+18-stem);g.beginFill(p.retain>.5?Deck.rgb('warning'):Deck.rgb('line-strong'));g.drawCircle(x,y+16-stem,3+p.grain*2);g.endFill();g.alpha=.45+p.sync*.5;layer.addChild(g)})}
    function reset(){rng=new Math.seedrandom(baseSeed+'-'+seedTurn);seasonIndex=1;plants=Array.from({length:pop},function(){return makePlant()});initialMeans={grain:mean(plants,'grain'),sync:mean(plants,'sync'),retain:mean(plants,'retain')};update(true)}
    function metrics(){var got=plants.filter(harvestable), concentration=Lec.P.ratio(got.length,pop)||0;var immediate=Lec.P.finite(cfg.immediateUseFraction);var storage=Deck.clamp(1-immediate,0,1)*concentration;var labor=Deck.clamp(concentration*(1+mean(plants,'sync'))/2,0,1);var crop=Deck.clamp((seasonIndex/maxSeasons)*concentration,0,1);var diversity=Deck.clamp(1-crop*(1-Lec.P.finite(cfg.otherFoodSources)),0,1);return {got:got,vals:[concentration,storage,labor,diversity]}}
    function update(fresh){var m=metrics();document.getElementById('season').textContent='第 '+seasonIndex+' 季';document.getElementById('yield').textContent=Lec.P.formatNumber(m.got.length,0);document.getElementById('quota').textContent=Lec.P.formatNumber(Math.min(quota,m.got.length),0);var tracks=document.querySelectorAll('.track');m.vals.forEach(function(v,i){var text=Lec.P.formatNumber(Lec.P.percent(v,1),0)+'%';tracks[i].querySelector('i').style.width=(v*100)+'%';tracks[i].querySelector('output').textContent=text});document.querySelectorAll('.step').forEach(function(s,i){s.className='step '+(i<Math.min(6,seasonIndex+1)?'is-past':i===Math.min(5,seasonIndex+1)?'is-current':'')});document.getElementById('return').classList.toggle('on',seasonIndex>=2);document.getElementById('feedback').textContent=fresh?'选择一种留种偏向，再推进至少两季，观察群体与生活安排如何一起变化。':seasonIndex>=2?'回路已闭合：收获模式改变了储存与劳动，也会影响下一季继续留种的条件。':'一季只能显示一次筛选；继续推进，才能判断是否形成跨季偏移。';draw()}
    function advance(){if(seasonIndex>=maxSeasons){document.getElementById('feedback').textContent='已到实验季数上限。重置或换种子，再比较另一种留种偏向。';return}var m=metrics(), pool=m.got.length?m.got.slice():plants.slice(), strategy=document.getElementById('strategy').value;pool.sort(function(a,b){if(strategy==='large')return b.grain-a.grain;if(strategy==='sync')return Math.abs(a.sync-.5)-Math.abs(b.sync-.5);if(strategy==='retain')return b.retain-a.retain;return rng()-.5});var selected=pool.slice(0,Math.min(quota,pool.length));plants=Array.from({length:pop},function(){return makePlant(selected[Math.floor(rng()*selected.length)])});seasonIndex++;update(false)}
    document.getElementById('next').addEventListener('click',advance);document.getElementById('reset').addEventListener('click',reset);document.getElementById('reseed').addEventListener('click',function(){seedTurn++;reset()});document.getElementById('strategy').addEventListener('change',function(){document.getElementById('feedback').textContent='策略已改变；推进下一季后，田地与四条生活轨道会共同更新。'});
    Deck.onResize(resize);reset();resize();
  </script>
</body>
</html>
