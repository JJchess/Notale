<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{height:100%;}
    .p32{height:100%;display:flex;flex-direction:column;gap:var(--sp-3);}
    .networks{height:258px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--sp-3);}
    .netbox{position:relative;min-width:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);}
    .netbox svg{display:block;width:100%;height:100%;}
    .netlabel{position:absolute;z-index:2;top:var(--sp-3);left:var(--sp-4);font-size:var(--fs-label);font-weight:700;color:var(--muted);}
    .legendline{position:absolute;z-index:2;right:var(--sp-4);top:var(--sp-3);display:flex;gap:var(--sp-3);font-size:var(--fs-label);color:var(--muted);}
    .legendline i{display:inline-block;width:16px;height:3px;margin-right:var(--sp-1);vertical-align:middle;background:var(--accent);}
    .legendline .supply{background:var(--warning);}
    .controls{display:flex;align-items:center;gap:var(--sp-3);min-width:0;}
    .controls .ctl{flex:1 1 auto;}
    .controls output{min-width:104px;font-size:var(--fs-label);font-weight:700;color:var(--accent-strong);}
    .controls button{flex:0 0 auto;}
    .k-comparison{flex:1 1 auto;--cmp-cols:minmax(176px,.62fr) repeat(2,minmax(0,1fr));font-size:var(--fs-sec);line-height:var(--lh-copy);}
    .k-comparison>*{padding:var(--sp-2) var(--sp-4);}
    .k-comparison>.hdr{min-height:38px;font-size:var(--fs-body);align-items:center;}
    .metric{font-weight:760;font-variant-numeric:tabular-nums;margin-right:var(--sp-2);}
    .modelnote{font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--muted);text-align:center;}
    .infected{stroke:var(--danger);stroke-width:3px;}
    .cutmark{stroke:var(--danger);stroke-width:3px;}
  </style>
</head>
<body data-page="32" data-total="50">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
    Lec.mount({
      index: 32,
      kicker: "DENSITY × CONNECTIONS",
      title: "同一张城市网络，交换更快，风险也传得更远",
      take: "高密度聚居提升交换效率，也扩大传染与资源中断风险。"
    });
    Deck.init({ index: 32, total: 50 });

    var stage = document.getElementById("stage");
    var main = document.getElementById("main");
    main.innerHTML = '<div class="p32">'+
      '<div class="networks">'+
        '<section class="netbox min0"><div class="netlabel">较低密度 · 共同基准</div><svg id="lowNet" role="img" aria-label="较低密度城市接触与供应网络"></svg></section>'+
        '<section class="netbox min0"><div class="netlabel">当前密度</div><div class="legendline"><span><i></i>接触</span><span><i class="supply"></i>供应</span></div><svg id="liveNet" role="img" aria-label="可调密度城市接触与供应网络"></svg></section>'+
      '</div>'+
      '<div class="controls">'+
        '<div class="ctl min0"><label for="density">聚居密度</label><input id="density" type="range"><output id="densityOut" for="density"></output></div>'+
        '<button type="button" class="primary" id="infect">放入一次感染</button>'+
        '<button type="button" id="interrupt">中断一个资源点</button>'+
        '<button type="button" id="reset">重置</button>'+
      '</div>'+
      '<div class="k-comparison" aria-label="低密度与当前密度的逐项比较">'+
        '<div class="hdr dim">比较维度</div><div class="hdr">较低密度</div><div class="hdr">当前密度</div><div class="rowline"></div>'+
        '<div class="dim">交换可达性</div><div class="cell" id="lReach"></div><div class="cell diff" id="hReach"></div><div class="rowline"></div>'+
        '<div class="dim">日常接触范围</div><div class="cell" id="lDegree"></div><div class="cell diff" id="hDegree"></div><div class="rowline"></div>'+
        '<div class="dim">传播触及范围</div><div class="cell" id="lSpread"></div><div class="cell diff" id="hSpread"></div><div class="rowline"></div>'+
        '<div class="dim">资源中断影响</div><div class="cell" id="lCut"></div><div class="cell diff" id="hCut"></div>'+
      '</div>'+
      '<p class="modelnote">教学网络模型；展示连接结构的方向性影响，不代表任何城市的实际疫情或供应数据。</p>'+
    '</div>';

    var C = Lec.K.p32NetworkScenarios || {
      populationSize:24, clusterCount:4, densityRange:{min:1,max:5,step:1}, defaultDensity:3,
      contactRadiusRange:{min:34,max:78}, exchangeOriginNode:0, exchangeStepLimit:3,
      transmissionRounds:3, resourceNodeCount:2
    };
    var range = C.densityRange;
    var minD = Array.isArray(range) ? range[0] : range.min;
    var maxD = Array.isArray(range) ? range[1] : range.max;
    var stepD = Array.isArray(range) ? (range[2] || 1) : (range.step || 1);
    var slider = document.getElementById('density');
    slider.min=minD; slider.max=maxD; slider.step=stepD; slider.value=C.defaultDensity;
    var mode = 'none';
    function safe(v){ return Lec.P.finite(v) ? v : minD; }
    function clamp(v){ return Lec.P.clamp(safe(v),minD,maxD); }
    function pct(a,b){ return Lec.P.formatNumber(Lec.P.percent(a,b))+'％'; }
    function num(v){ return Lec.P.formatNumber(v,1); }
    function rat(a,b){ return Lec.P.ratio(a,b); }
    function configValue(name, fallback){ return C[name] === undefined ? fallback : C[name]; }
    var N = C.populationSize, clusters=C.clusterCount;
    var steps=C.exchangeStepLimit, rounds=configValue('transmissionRounds', configValue('transmissionRule',{}).rounds);
    var resourceCount=configValue('resourceNodeCount',2);

    function makeState(density, svgId){
      var box=document.getElementById(svgId).parentElement, w=box.clientWidth, h=box.clientHeight;
      var compact=(density-minD)/(maxD-minD || 1), pad=42, usableW=w-pad*2, usableH=h-pad*2;
      var nodes=d3.range(N).map(function(i){
        var c=i%clusters, ring=Math.floor(i/clusters), angle=(c/clusters)*Math.PI*2 + ring*.73;
        var spread=(.42-.25*compact)*Math.min(usableW,usableH);
        var cx=w/2+Math.cos(c/clusters*Math.PI*2)*usableW*(.23-.13*compact);
        var cy=h/2+Math.sin(c/clusters*Math.PI*2)*usableH*(.20-.10*compact);
        return {id:i,x:cx+Math.cos(angle)*spread*(.25+(ring%3)*.18),y:cy+Math.sin(angle)*spread*(.25+(ring%3)*.18)};
      });
      var rr=C.contactRadiusRange, r0=Array.isArray(rr)?rr[0]:rr.min, r1=Array.isArray(rr)?rr[1]:rr.max;
      var radius=d3.interpolateNumber(r0,r1)(compact), links=[];
      for(var i=0;i<N;i++) for(var j=i+1;j<N;j++) if(Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y)<=radius) links.push({source:i,target:j});
      var resources=d3.range(resourceCount).map(function(i){return {id:i,x:w*(i+1)/(resourceCount+1),y:h-20};});
      var supply=nodes.map(function(n,i){ var ri=Math.min(resourceCount-1,Math.floor((i/N)*resourceCount*(1+compact*.7))); return {source:resources[ri],target:n}; });
      var adj=d3.range(N).map(function(){return[];}); links.forEach(function(l){adj[l.source].push(l.target);adj[l.target].push(l.source);});
      function bfs(limit){var seen=new Set([C.exchangeOriginNode]), q=[[C.exchangeOriginNode,0]]; while(q.length){var x=q.shift();if(x[1]>=limit)continue;adj[x[0]].forEach(function(y){if(!seen.has(y)){seen.add(y);q.push([y,x[1]+1]);}});}return seen;}
      var reached=bfs(steps), spread=bfs(rounds), cut=new Set(supply.filter(function(s){return s.source.id===0;}).map(function(s){return s.target.id;}));
      var degree=rat(links.length*2,N);
      return {w:w,h:h,nodes:nodes,links:links,resources:resources,supply:supply,reached:reached,spread:spread,cut:cut,degree:degree,density:density};
    }
    function draw(id,s){
      var svg=d3.select('#'+id).attr('viewBox','0 0 '+s.w+' '+s.h); svg.selectAll('*').remove();
      svg.append('g').selectAll('line').data(s.supply).join('line').attr('x1',function(d){return d.source.x}).attr('y1',function(d){return d.source.y}).attr('x2',function(d){return d.target.x}).attr('y2',function(d){return d.target.y}).attr('stroke','var(--warning)').attr('stroke-opacity',.25);
      svg.append('g').selectAll('line').data(s.links).join('line').attr('x1',function(d){return s.nodes[d.source].x}).attr('y1',function(d){return s.nodes[d.source].y}).attr('x2',function(d){return s.nodes[d.target].x}).attr('y2',function(d){return s.nodes[d.target].y}).attr('stroke','var(--accent)').attr('stroke-opacity',.28);
      svg.append('g').selectAll('rect').data(s.resources).join('rect').attr('x',function(d){return d.x-8}).attr('y',function(d){return d.y-8}).attr('width',16).attr('height',16).attr('rx',3).attr('fill','var(--warning)');
      var g=svg.append('g').selectAll('g').data(s.nodes).join('g').attr('transform',function(d){return 'translate('+d.x+','+d.y+')';});
      g.append('circle').attr('r',5).attr('fill','var(--surface)').attr('stroke','var(--accent-strong)').attr('stroke-width',2).attr('class',function(d){return mode==='infect'&&s.spread.has(d.id)?'infected':'';});
      if(mode==='cut') g.filter(function(d){return s.cut.has(d.id)}).append('path').attr('d','M-6,-6 L6,6 M6,-6 L-6,6').attr('class','cutmark');
    }
    function cell(id,value,text){document.getElementById(id).innerHTML='<span class="metric">'+value+'</span>'+text;}
    function render(){
      var d=clamp(Number(slider.value)); slider.value=d; document.getElementById('densityOut').textContent=num(d)+' · 模型值';
      var low=makeState(minD,'lowNet'), live=makeState(d,'liveNet'); draw('lowNet',low);draw('liveNet',live);
      cell('lReach',pct(low.reached.size,N),'限定步数可达');cell('hReach',pct(live.reached.size,N),'限定步数可达');
      cell('lDegree',num(low.degree),'人/节点');cell('hDegree',num(live.degree),'人/节点');
      cell('lSpread',mode==='infect'?pct(low.spread.size,N):'—','运行感染测试');cell('hSpread',mode==='infect'?pct(live.spread.size,N):'—','运行感染测试');
      cell('lCut',mode==='cut'?pct(low.cut.size,N):'—','运行中断测试');cell('hCut',mode==='cut'?pct(live.cut.size,N):'—','运行中断测试');
    }
    slider.addEventListener('input',render);
    document.getElementById('infect').addEventListener('click',function(){mode='infect';render();});
    document.getElementById('interrupt').addEventListener('click',function(){mode='cut';render();});
    document.getElementById('reset').addEventListener('click',function(){mode='none';slider.value=C.defaultDensity;render();});
    Deck.onResize(render);
    render();
  </script>
</body>
</html>
