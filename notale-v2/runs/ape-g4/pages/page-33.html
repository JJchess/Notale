<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:var(--sp-4)}
    .page33{height:100%;display:flex;flex-direction:column;gap:var(--sp-4)}
    .page33 .k-generalization{flex:1 1 auto;min-height:0;grid-template-columns:minmax(0,.72fr) 42px minmax(0,1.8fr)}
    .page33 .claim{height:max-content;box-sizing:border-box}
    .claim-title{font-size:var(--fs-h2);line-height:1.3;font-weight:760;color:var(--accent-strong);margin-bottom:var(--sp-4)}
    .causal{display:flex;flex-direction:column;align-items:stretch;gap:var(--sp-2);font-size:var(--fs-sec);line-height:var(--lh-copy);font-weight:650}
    .causal .down{text-align:center;color:var(--accent-strong);font-size:var(--fs-h2);line-height:1}
    .page33 .supports{min-height:0}
    .board{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;padding:0!important;background:var(--surface)!important}
    #konva-board{position:absolute;inset:0}
    .board-label{position:absolute;z-index:2;left:var(--sp-4);top:var(--sp-3);font-size:var(--fs-label);line-height:1.4;font-weight:720;color:var(--muted);pointer-events:none}
    .controls{position:absolute;z-index:3;left:var(--sp-4);right:var(--sp-4);bottom:var(--sp-3);display:flex;align-items:center;justify-content:center;gap:var(--sp-3)}
    .controls button{background:var(--surface);font-size:var(--fs-sec)}
    .controls button[aria-pressed="true"]{color:var(--danger);background:var(--danger-soft);border-color:var(--danger)}
    .feedback{flex:0 0 auto;min-height:50px;box-sizing:border-box;align-items:center;color:var(--text)}
    .instruction{font-size:var(--fs-label);line-height:1.4;color:var(--muted);margin-left:auto}
  </style>
</head>
<body data-page="33" data-total="50">
  <div id="stage"><main id="main"></main></div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/konva.min.js"></script>
  <script>
    Lec.mount({
      index: 33,
      kicker: "CULTURE AS INTERFACE",
      title: "能拔掉的能力，也可能随时失效",
      take: "文化让我们进入身体原本无法生存之处，同时形成新的脆弱接口。"
    });

    Deck.init({ index: 33, total: 50 });

    var main = document.getElementById("main");
    main.innerHTML = '<section class="page33">' +
      '<div class="k-generalization min0">' +
        '<div class="claim min0"><div class="claim-title">文化让身体跨越环境限制</div>' +
          '<div class="causal" aria-label="身体限制到接口脆弱性的因果主干">' +
            '<span>身体做不到</span><span class="down">↓</span><span>文化／技术接上功能</span><span class="down">↓</span>' +
            '<span>可进入更广环境</span><span class="down">↓</span><span>依赖形成</span><span class="down">↓</span><span class="danger">接口中断，脆弱性显现</span>' +
          '</div></div>' +
        '<div class="trunk" aria-hidden="true"></div>' +
        '<div class="supports min0"><div class="support board min0">' +
          '<div class="board-label">身体 × 外置功能接口</div><div id="konva-board" class="no-pan" role="img" aria-label="人体轮廓通过三条线路连接防护、供给和协作模块。拔出模块会断开线路，并缩小人体周围的安全边界。"></div>' +
          '<div class="controls" aria-label="技术依赖拔插板">' +
            '<button type="button" data-key="protect" aria-pressed="false">防护 · 扩展能力</button>' +
            '<button type="button" data-key="supply" aria-pressed="false">供给 · 扩展能力</button>' +
            '<button type="button" data-key="cooperate" aria-pressed="false">协作 · 扩展能力</button>' +
            '<button type="button" id="restore">全部插回</button>' +
          '</div></div></div>' +
      '</div>' +
      '<div class="note feedback" aria-live="polite"><strong id="feedback">拖动一个模块离开插槽，观察能力与依赖如何同时改变。</strong><span class="instruction">按钮与键盘同样可操作</span></div>' +
    '</section>';

    var host = document.getElementById('konva-board');
    var W = host.clientWidth, H = host.clientHeight;
    var ks = new Konva.Stage({container:'konva-board', width:W, height:H});
    var layer = new Konva.Layer(); ks.add(layer);
    var colors = {text:Deck.rgb('--text'), muted:Deck.rgb('--muted'), line:Deck.rgb('--line-strong'), accent:Deck.rgb('--accent'), soft:Deck.rgb('--accent-soft'), danger:Deck.rgb('--danger'), dangerSoft:Deck.rgb('--danger-soft'), surface:Deck.rgb('--surface')};
    var boundary = new Konva.Rect({x:W*.28,y:H*.13,width:W*.44,height:H*.63,cornerRadius:40,stroke:colors.accent,strokeWidth:3,dash:[10,8]});
    layer.add(boundary);
    var cx=W*.5, cy=H*.41;
    var human = new Konva.Group({listening:false});
    human.add(new Konva.Circle({x:cx,y:cy-92,radius:25,stroke:colors.text,strokeWidth:3}));
    human.add(new Konva.Line({points:[cx,cy-65,cx,cy+54],stroke:colors.text,strokeWidth:4,lineCap:'round'}));
    human.add(new Konva.Line({points:[cx,cy-38,cx-48,cy+10],stroke:colors.text,strokeWidth:3,lineCap:'round'}));
    human.add(new Konva.Line({points:[cx,cy-38,cx+48,cy+10],stroke:colors.text,strokeWidth:3,lineCap:'round'}));
    human.add(new Konva.Line({points:[cx,cy+54,cx-38,cy+118],stroke:colors.text,strokeWidth:3,lineCap:'round'}));
    human.add(new Konva.Line({points:[cx,cy+54,cx+38,cy+118],stroke:colors.text,strokeWidth:3,lineCap:'round'})); layer.add(human);
    var defs={protect:{label:'防护',x:W*.15,y:H*.28,tx:cx-35,ty:cy-25},supply:{label:'供给',x:W*.73,y:H*.28,tx:cx+35,ty:cy-25},cooperate:{label:'协作',x:W*.73,y:H*.57,tx:cx+30,ty:cy+60}};
    var state={protect:false,supply:false,cooperate:false}, modules={};
    Object.keys(defs).forEach(function(key){
      var d=defs[key];
      var line=new Konva.Line({points:[d.tx,d.ty,d.x+55,d.y+24],stroke:colors.accent,strokeWidth:3,dash:[7,5]}); layer.add(line);
      var g=new Konva.Group({x:d.x,y:d.y,draggable:true,name:key});
      g.add(new Konva.Rect({width:110,height:48,cornerRadius:8,fill:colors.soft,stroke:colors.accent,strokeWidth:2}));
      g.add(new Konva.Text({width:110,height:48,text:d.label,align:'center',verticalAlign:'middle',fontSize:18,fontStyle:'bold',fill:colors.text}));
      g.on('dragend',function(){var dx=g.x()-d.x,dy=g.y()-d.y;setState(key,Math.sqrt(dx*dx+dy*dy)>75);});
      g.on('click tap',function(){setState(key,!state[key]);});
      layer.add(g); modules[key]={group:g,line:line,def:d};
    });
    function setState(key, unplugged){
      state[key]=unplugged; var m=modules[key], d=m.def;
      m.group.position(unplugged?{x:d.x+(d.x<cx?-95:95),y:d.y}:{x:d.x,y:d.y});
      m.line.stroke(unplugged?colors.danger:colors.accent); m.line.dash(unplugged?[3,10]:[7,5]); m.line.opacity(unplugged?.45:1);
      m.group.findOne('Rect').fill(unplugged?colors.dangerSoft:colors.soft); m.group.findOne('Rect').stroke(unplugged?colors.danger:colors.accent);
      var button=document.querySelector('[data-key="'+key+'"]'); button.setAttribute('aria-pressed',String(unplugged)); button.textContent=d.label+(unplugged?' · 接口中断':' · 扩展能力');
      var count=Object.keys(state).filter(function(k){return state[k];}).length;
      boundary.setAttrs({x:W*(.28+count*.025),y:H*(.13+count*.015),width:W*(.44-count*.05),height:H*(.63-count*.03),stroke:count?colors.danger:colors.accent});
      if(key==='cooperate' && unplugged){Object.keys(modules).forEach(function(k){if(k!=='cooperate')modules[k].line.opacity(.55);});}
      document.getElementById('feedback').textContent=unplugged?'失去的不是新器官，而是由接口提供的能力。':'能力恢复，依赖仍然存在。';
      layer.draw();
    }
    document.querySelectorAll('[data-key]').forEach(function(btn){btn.addEventListener('click',function(){setState(btn.dataset.key,!state[btn.dataset.key]);});});
    document.getElementById('restore').addEventListener('click',function(){Object.keys(state).forEach(function(k){setState(k,false);});});
    layer.draw();
  </script>
</body>
</html>
