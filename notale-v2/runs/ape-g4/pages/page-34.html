<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .ledger-page {
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
    }
    .ledger-head,
    .k-enumeration > .it {
      display: grid;
      grid-template-columns: minmax(150px, .55fr) minmax(0, 1.18fr) minmax(0, 1.55fr) minmax(88px, .34fr);
      align-items: center;
      min-width: 0;
      column-gap: var(--sp-4);
    }
    .ledger-head {
      padding: var(--sp-2) var(--sp-4);
      color: var(--muted);
      background: var(--surface-strong);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      font-size: var(--fs-label);
      line-height: 1.4;
      font-weight: 700;
    }
    .k-enumeration.ledger {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      gap: var(--sp-2);
      min-height: 0;
    }
    .k-enumeration > .it {
      flex: 1 1 0;
      padding: var(--sp-2) var(--sp-4);
      border-top: 1px solid var(--line);
      border-left: 5px solid var(--cyan);
      border-radius: var(--radius-sm);
      box-shadow: none;
    }
    .k-enumeration > .it:hover {
      color: var(--accent-strong);
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    .item-name {
      display: flex;
      align-items: baseline;
      gap: var(--sp-3);
      min-width: 0;
    }
    .item-no {
      color: var(--accent-strong);
      font-size: var(--fs-label);
      line-height: 1.4;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
    }
    .k-enumeration > .it .it-title {
      margin: 0;
    }
    .condition,
    .question {
      min-width: 0;
      font-size: var(--fs-sec);
      line-height: var(--lh-copy);
    }
    .condition { color: var(--muted); }
    .route {
      justify-self: end;
      color: var(--accent-strong);
      font-size: var(--fs-label);
      line-height: 1.4;
      font-weight: 700;
      white-space: nowrap;
    }
    .synthesis {
      padding: var(--sp-3) var(--sp-4);
      color: var(--text);
      background: var(--surface-soft);
      border-left-color: var(--accent);
      font-size: var(--fs-body);
      font-weight: 700;
    }
  </style>
</head>
<body data-page="34" data-total="50">
  <div id="stage"><main id="main"></main></div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 34,
      kicker: "SPACE CHECKLIST",
      title: "进入太空，先检查身体失去了什么",
      take: "进入太空后，先逐项检查空气、压力、温度、水、食物、重力与辐射。"
    });

    Deck.init({ index: 34, total: 50 });

    var stage = document.getElementById("stage");
    var items = [
      ["空气", "持续获得可呼吸的气体，并排出呼吸产生的气体", "周围还有可呼吸气体吗？气体组成能否维持生命？", [1, 2]],
      ["压力", "身体内外存在适宜的压力关系", "外部压力是否足以维持正常呼吸与体液状态？", [1]],
      ["温度", "身体持续与环境交换热量", "产生的热如何排出，外界热量又如何进入？", [2]],
      ["水", "饮用、清洁与代谢都依赖持续可用的水", "可用水从哪里来，消耗后会去哪里？", [2, 10]],
      ["食物", "身体需要持续获得物质与能量", "任务期间需要带多少，储存与消耗如何延续？", [10]],
      ["重力", "感觉、体液分布、骨骼与肌肉长期处在日常负荷中", "当熟悉的承重与方向线索改变，身体会怎样反应？", [3, 6]],
      ["辐射", "地球大气与磁场提供了部分天然防护", "离开这些环境后，会遇到怎样的额外暴露？", [7, 8]]
    ];
    function routeLabel(offsets) {
      var pages = offsets.map(function (n) { return 34 + n; });
      if (pages.length === 2 && pages[1] === pages[0] + 1) return "p" + pages[0] + "–" + pages[1];
      return pages.map(function (n) { return "p" + n; }).join("、");
    }
    var shell = document.createElement("section");
    shell.className = "ledger-page";
    shell.setAttribute("aria-label", "太空生存条件检查账本");
    shell.innerHTML = '<div class="ledger-head" aria-hidden="true"><span>检查项</span><span>人体原本依赖</span><span>进入太空后要问</span><span>后续</span></div><div class="k-enumeration ledger"></div><p class="note synthesis">太空不是一种单一危险，而是人体与环境之间的多条接口同时改变。</p>';
    var ledger = shell.querySelector(".ledger");
    items.forEach(function (item, index) {
      var row = document.createElement("article");
      row.className = "it min0";
      var no = Lec.P.formatNumber(index + 1, 0, { minimumIntegerDigits: 2 });
      row.innerHTML = '<div class="item-name min0"><span class="item-no">' + no + '</span><h2 class="it-title">' + item[0] + '</h2></div><p class="condition">' + item[1] + '</p><p class="question">' + item[2] + '</p><span class="route" title="后续展开页">' + routeLabel(item[3]) + '</span>';
      ledger.appendChild(row);
    });
    document.getElementById("main").appendChild(shell);
  </script>
</body>
</html>
