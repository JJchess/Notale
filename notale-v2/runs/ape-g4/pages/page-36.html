<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:var(--sp-3)}
    .instruction{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);min-height:42px}
    .instruction p{font-size:var(--fs-sec);line-height:var(--lh-copy)}
    .progress{flex:0 0 auto;font-size:var(--fs-label);font-weight:700;color:var(--accent-strong)}
    .plate{position:relative;flex:1 1 auto;min-height:0;display:flex;gap:var(--sp-4)}
    .class-side{flex:0 0 350px;min-width:0}
    .support-side{flex:0 0 282px;min-width:0}
    .k-classification{height:100%;gap:var(--sp-3)}
    .k-classification .box>.bt{padding:var(--sp-2) var(--sp-3);font-size:var(--fs-body)}
    .k-classification .box>.bc{padding:var(--sp-3)}
    .module-pair{display:flex;gap:var(--sp-2)}
    .module-pair>*{flex:1 1 0;min-width:0}
    .module{position:relative;display:flex;flex-direction:column;justify-content:center;min-height:66px;padding:var(--sp-2) var(--sp-3);background:var(--surface-soft);border:1px solid var(--line);border-radius:var(--radius-sm)}
    .module strong{font-size:var(--fs-body);line-height:var(--lh-tight)}
    .module span{font-size:var(--fs-label);line-height:1.4;color:var(--muted)}
    .module.is-target{outline:3px solid var(--focus);outline-offset:2px;background:var(--warning-soft)}
    .core{position:relative;flex:1 1 auto;min-width:0;border:2px solid var(--line-strong);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden}
    .core svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    .cabin{position:absolute;left:29%;top:24%;width:42%;height:44%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-2);background:var(--surface-strong);border:2px solid var(--line-strong);border-radius:var(--radius-lg);text-align:center}
    .cabin strong{font-size:var(--fs-h2)}
    .cabin span{font-size:var(--fs-label);color:var(--muted)}
    .boundary{position:absolute;right:var(--sp-3);top:var(--sp-3);bottom:calc(var(--sp-9) + var(--sp-9));width:72px;display:flex;align-items:center;justify-content:center;padding:var(--sp-2);border:1px dashed var(--line-strong);font-size:var(--fs-label);line-height:1.4;text-align:center;color:var(--muted)}
    .supply{position:absolute;left:var(--sp-3);top:var(--sp-3);padding:var(--sp-2);border:1px dashed var(--line-strong);font-size:var(--fs-label);color:var(--muted)}
    .connector{position:absolute;left:var(--sp-4);bottom:var(--sp-4);right:var(--sp-4);display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-soft)}
    .plug{flex:0 0 auto;width:46px;height:46px;padding:0;border-radius:50%;background:var(--accent-soft);border:2px solid var(--accent);color:var(--accent-strong);cursor:grab;touch-action:none}
    .plug:active{cursor:grabbing}
    .task{flex:1 1 auto;min-width:0;font-size:var(--fs-sec);line-height:var(--lh-copy)}
    .task b{display:block;color:var(--accent-strong)}
    .kbd{display:flex;gap:var(--sp-2);align-items:center}
    .kbd select{width:112px;min-height:40px;padding:var(--sp-2);font:inherit;font-size:var(--fs-label);border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface)}
    .flow{fill:none;stroke:var(--accent);stroke-width:3;marker-end:url(#arrow)}
    .flow.return{stroke-width:6}
    .flow.pending{stroke:var(--line-strong);stroke-dasharray:7 7}
    .status-strip{display:flex;align-items:center;gap:var(--sp-3);min-height:66px;padding:var(--sp-2) var(--sp-3);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md)}
    .metric{flex:1 1 0;min-width:0;padding-right:var(--sp-2);border-right:1px solid var(--line)}
    .metric:last-of-type{border-right:0}
    .metric .label{display:block;color:var(--muted)}
    .metric output{display:block;font-size:var(--fs-body);font-weight:740;font-variant-numeric:tabular-nums;white-space:nowrap}
    .scenario{display:none;flex:0 0 auto}
    .scenario.show{display:flex}
    .scenario select{min-width:104px}
    .feedback{font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--muted)}
  </style>
</head>
<body data-page="36" data-total="50">
  <div id="stage"><main id="main"></main></div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
    Lec.mount({
      index: 36,
      kicker: "LIFE-SUPPORT LOOPS",
      title: "把六项生存需求接成回路",
      take: "航天器必须持续管理氧气、二氧化碳、水、废物、热量和电力。"
    });
    Deck.init({ index: 36, total: 50 });

    var main=document.getElementById("main");
    main.innerHTML=`
      <div class="instruction"><p>拖动接头到高亮模块；也可选目标后确认。依次接通物质流、供能与排热。</p><span class="progress" id="progress">已接通 0 / 8</span></div>
      <section class="plate" aria-label="生命支持系统技术图版">
        <div class="class-side min0 k-classification">
          <div class="lv">
            <section class="box"><h2 class="bt">气体交换</h2><div class="bc module-pair"><div class="module" data-node="oxygen"><strong>氧气</strong><span>供应 / 再生</span></div><div class="module" data-node="co2"><strong>二氧化碳</strong><span>移除 / 处理</span></div></div></section>
            <section class="box"><h2 class="bt">物质循环</h2><div class="bc module-pair"><div class="module" data-node="water"><strong>水</strong><span>库存 / 处理</span></div><div class="module" data-node="waste"><strong>废物</strong><span>收集 / 分流</span></div></div></section>
          </div>
        </div>
        <div class="core min0" id="core">
          <svg id="wires" role="img" aria-label="已接通的生命支持依赖线"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="currentColor"></path></marker></defs><g id="paths"></g></svg>
          <div class="supply" data-node="supply">补给 / 损失端口</div>
          <div class="cabin" data-node="crew"><strong>乘员舱</strong><span>消耗氧气和水<br>产生二氧化碳、废物与热量</span></div>
          <div class="boundary" data-node="outside">舱外<br>散热边界</div>
          <div class="connector">
            <button class="plug no-pan" id="plug" type="button" aria-label="拖动连接接头">接</button>
            <div class="task" id="task"></div>
            <div class="kbd"><select id="target" aria-label="选择连接目标"></select><button type="button" id="confirm">确认</button></div>
          </div>
        </div>
        <div class="support-side min0 k-classification">
          <div class="lv">
            <section class="box"><h2 class="bt">系统支撑</h2><div class="bc col gap-2"><div class="module" data-node="power"><strong>电力</strong><span>驱动处理设备</span></div><div class="module" data-node="heat"><strong>热量</strong><span>收集并排向舱外</span></div></div></section>
            <div class="note">“闭环”仍有补给、损失和向舱外排热。</div>
          </div>
        </div>
      </section>
      <div class="feedback" id="feedback" aria-live="polite">先接通氧气供应。</div>
      <div class="status-strip panel">
        <div class="metric"><span class="label">舱压</span><output id="pressure">—</output></div>
        <div class="metric"><span class="label">舱温</span><output id="temp">—</output></div>
        <div class="metric"><span class="label">耗氧率</span><output id="oxygenRate">—</output></div>
        <div class="metric"><span class="label">回收状态</span><output id="recoveryRead">待接通</output></div>
        <div class="metric"><span class="label">总热负荷</span><output id="heatRead">待接通</output></div>
        <div class="ctl scenario" id="scenarioCtl"><label for="scenario">回收情景</label><select id="scenario"></select></div>
      </div>`;

    var links=[
      {s:"oxygen",t:"crew",label:"氧气供应 → 乘员",kind:"物质流"},
      {s:"crew",t:"co2",label:"乘员 → 二氧化碳移除",kind:"产物流"},
      {s:"water",t:"crew",label:"水库存 → 乘员",kind:"物质流"},
      {s:"crew",t:"waste",label:"乘员 → 废物收集",kind:"产物流"},
      {s:"waste",t:"water",label:"可回收废物流 → 水处理",kind:"回收流"},
      {s:"power",t:"water",label:"电力 → 处理设备",kind:"供能流"},
      {s:"crew",t:"heat",label:"乘员与设备 → 热量",kind:"热流"},
      {s:"heat",t:"outside",label:"热量 → 舱外散热端",kind:"排热流"}
    ];
    var done=0, dragging=false;
    var core=document.getElementById("core"), plug=document.getElementById("plug");
    var target=document.getElementById("target"), feedback=document.getElementById("feedback");
    var nodeNames={oxygen:"氧气",co2:"二氧化碳",water:"水",waste:"废物",power:"电力",heat:"热量",crew:"乘员舱",outside:"舱外散热端"};

    function safeFormat(v,d){try{return Lec.P.formatNumber(v,d);}catch(e){return String(v);}}
    function setBackgroundReadouts(){
      var p=Lec.K.cabinPressurePa, k=Lec.K.cabinTemperatureK, o=Lec.K.humanOxygenUseRestLPerMin;
      document.getElementById("pressure").textContent=safeFormat(p,0)+" Pa";
      document.getElementById("temp").textContent=safeFormat(k,0)+" K / "+safeFormat(k-273.15,1)+" °C";
      document.getElementById("oxygenRate").textContent=safeFormat(o,2)+" L/min";
    }
    function center(el){var r=el.getBoundingClientRect(),cr=core.getBoundingClientRect();return{x:(r.left+r.right)/2-cr.left,y:(r.top+r.bottom)/2-cr.top};}
    function route(a,b){var m=(a.x+b.x)/2;return `M${a.x},${a.y} H${m} V${b.y} H${b.x}`;}
    function draw(){
      var data=links.slice(0,done).map(function(l){return Object.assign({},l,{a:center(document.querySelector('[data-node="'+l.s+'"]')),b:center(document.querySelector('[data-node="'+l.t+'"]'))});});
      d3.select("#paths").selectAll("path").data(data,function(d){return d.label;}).join("path").attr("class",function(d){return "flow"+(d.kind==="回收流"?" return":"");}).attr("d",function(d){return route(d.a,d.b);});
    }
    function updateTask(){
      document.querySelectorAll(".module,.cabin,.boundary").forEach(function(el){el.classList.remove("is-target");});
      document.getElementById("progress").textContent="已接通 "+done+" / "+links.length;
      if(done>=links.length){
        document.getElementById("task").innerHTML="<b>回路已接通</b>切换回收情景，观察回流与系统代价。";
        plug.disabled=true; document.getElementById("confirm").disabled=true; target.disabled=true;
        document.getElementById("scenarioCtl").classList.add("show"); updateScenario(); return;
      }
      var l=links[done];
      document.getElementById("task").innerHTML="<b>当前："+l.label+"</b>把接头送到“"+nodeNames[l.t]+"”。";
      var dest=document.querySelector('[data-node="'+l.t+'"]'); dest.classList.add("is-target");
      target.innerHTML=""; Object.keys(nodeNames).forEach(function(id){var op=document.createElement("option");op.value=id;op.textContent=nodeNames[id];target.appendChild(op);}); target.value=l.t;
    }
    function connect(id){
      var l=links[done]; if(!l)return;
      if(id!==l.t){feedback.textContent="未接通：当前是“"+l.kind+"”，目标应为“"+nodeNames[l.t]+"”。";return;}
      done++; feedback.textContent="已接通“"+l.label+"”。方向箭头表示流向。"; draw(); updateTask();
    }
    plug.addEventListener("pointerdown",function(e){if(plug.disabled)return;dragging=true;plug.setPointerCapture(e.pointerId);});
    plug.addEventListener("pointermove",function(e){if(!dragging)return;var p=Deck.pt(core,e);plug.style.transform="translate("+(p.x-46)+"px,"+(p.y-core.clientHeight+92)+"px)";});
    function finish(e){if(!dragging)return;dragging=false;plug.style.transform="";var p=Deck.pt(core,e), hit=null;document.querySelectorAll("[data-node]").forEach(function(el){var r=el.getBoundingClientRect(),cr=core.getBoundingClientRect();if(p.x>=r.left-cr.left&&p.x<=r.right-cr.left&&p.y>=r.top-cr.top&&p.y<=r.bottom-cr.top)hit=el.dataset.node;});connect(hit);}
    plug.addEventListener("pointerup",finish);plug.addEventListener("pointercancel",function(){dragging=false;plug.style.transform="";});
    document.getElementById("confirm").addEventListener("click",function(){connect(target.value);});

    function scenarioEntries(){var o=Lec.K.lifeSupportRecoveryScenarios||{};return Array.isArray(o)?o.map(function(v,i){return [String(i),v];}):Object.keys(o).map(function(k){return[k,o[k]];});}
    function findRate(obj){if(typeof obj==="number"&&obj>=0&&obj<=1)return obj;if(!obj||typeof obj!=="object")return 0;var keys=Object.keys(obj);for(var i=0;i<keys.length;i++){if(/water|recover|rate|fraction|回收/i.test(keys[i])&&typeof obj[keys[i]]==="number")return obj[keys[i]];}for(var j=0;j<keys.length;j++){var r=findRate(obj[keys[j]]);if(r)return r;}return 0;}
    var sc=document.getElementById("scenario"), entries=scenarioEntries();
    entries.forEach(function(e,i){var op=document.createElement("option");op.value=i;op.textContent=["低","中","高"][i]||e[0];sc.appendChild(op);});
    function updateScenario(){
      var e=entries[Number(sc.value)]||entries[0], rate=e?findRate(e[1]):0;
      var pct;try{pct=Lec.P.percent(rate);}catch(err){pct=safeFormat(rate*100,0)+"%";}
      document.getElementById("recoveryRead").textContent=pct+" 回收；仍需补给";
      var metabolic=Lec.K.humanMetabolicPowerRestW;
      document.getElementById("heatRead").textContent="≥ "+safeFormat(metabolic,0)+" W / 人";
      d3.select("#paths").selectAll("path.return").attr("stroke-width",3+rate*6);
      feedback.textContent="回收提高会减少补给损失；处理设备仍需电力，并把能量变成废热。";
    }
    sc.addEventListener("change",updateScenario);
    setBackgroundReadouts();updateTask();draw();Deck.onResize(draw);
  </script>
</body>
</html>
