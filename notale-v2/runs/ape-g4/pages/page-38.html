<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;gap:var(--sp-5)}
    .orbit-world{position:relative;flex:1 1 0;min-width:0;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-soft)}
    .orbit-world canvas{display:block}
    .world-tag{position:absolute;left:var(--sp-4);top:var(--sp-4);z-index:2;padding:var(--sp-2) var(--sp-3);border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--line);font-size:var(--fs-label);font-weight:700}
    .world-note{position:absolute;left:var(--sp-4);bottom:var(--sp-4);z-index:2;max-width:430px}
    .result-mark{position:absolute;right:var(--sp-4);top:var(--sp-4);z-index:2;padding:var(--sp-3) var(--sp-4);border-radius:var(--radius-md);background:var(--surface);border:2px solid var(--line-strong);font-size:var(--fs-body);font-weight:760}
    .result-mark.good{background:var(--success-soft);border-color:var(--success)}
    .result-mark.danger{background:var(--danger-soft);border-color:var(--danger)}
    .result-mark.warn{background:var(--warning-soft);border-color:var(--warning)}
    .side{flex:0 0 440px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:var(--sp-3)}
    .k-process.vertical{flex:1 1 0;min-height:0;padding:0 0 0 var(--sp-5);gap:var(--sp-1)}
    .k-process.vertical>.axis{left:calc(var(--sp-5) / 2)}
    .k-process.vertical>.step{flex:1 1 0;padding:var(--sp-2) var(--sp-3);border-width:1px;display:flex;flex-direction:column;justify-content:center}
    .k-process.vertical>.arw{position:absolute;left:0;z-index:3;flex:none;width:var(--sp-5);height:22px;font-size:var(--fs-body)}
    .k-process.vertical>.arw.a1{top:15%}.k-process.vertical>.arw.a2{top:31.5%}.k-process.vertical>.arw.a3{top:48%}.k-process.vertical>.arw.a4{top:64.5%}.k-process.vertical>.arw.a5{top:81%}
    .step-title{font-size:var(--fs-label);line-height:1.35;font-weight:760}
    .step-detail{font-size:var(--fs-sec);line-height:1.4;color:var(--muted)}
    .step-values{font-size:var(--fs-label);line-height:1.35;font-variant-numeric:tabular-nums}
    .control-box{padding:var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-2)}
    .ctl{padding:var(--sp-2) var(--sp-3)}
    .speed-val{font-size:var(--fs-body);font-weight:760;min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
    .actions{display:flex;gap:var(--sp-2)}
    .actions button{flex:1 1 0}
    .ref-mark{position:absolute;top:0;bottom:0;width:3px;background:var(--warning);pointer-events:none}
    .range-wrap{position:relative;flex:1 1 auto;display:flex}
    .range-wrap input{width:100%}
    @media (max-width:1000px){#main{flex-direction:column}.orbit-world{min-height:320px}.side{flex:1 1 0;width:100%}.k-process.vertical{display:none}}
  </style>
</head>
<body data-page="38" data-total="50">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/three.min.js"></script>
  <script>
    Lec.mount({
      index: 38,
      kicker: "ORBITAL THROW",
      title: "入轨的关键，是横向速度",
      take: "入轨不是一直向上，而是获得足够横向速度不断错过地面。"
    });
    Deck.init({ index: 38, total: 50 });

    var main=document.getElementById('main');
    main.innerHTML='<section class="orbit-world min0" id="world" aria-label="三维地球轨道投球场景"><span class="world-tag">简化二体模型</span><div id="result" class="result-mark" aria-live="polite">等待投出</div><div class="world-note note">物体已在教学高度；省略上升段、大气阻力与地球自转。</div></section><aside class="side min0"><div class="k-process vertical" id="process"><div class="axis"></div><div class="step is-current" data-step="1"><span class="step-title">1 准备高度</span><span class="step-values" id="prep"></span></div><i class="arw a1"></i><div class="step" data-step="2"><span class="step-title">2 设定横向速度</span><span class="step-values" id="setval"></span></div><i class="arw a2"></i><div class="step" data-step="3"><span class="step-title">3 切向释放</span><span class="step-detail">初始径向速度为零，只给横向速度。</span></div><i class="arw a3"></i><div class="step" data-step="4"><span class="step-title">4 引力持续弯折</span><span class="step-values" id="live">高度 —　速度 —　时间 —</span></div><i class="arw a4"></i><div class="step" data-step="5"><span class="step-title">5 判断结果</span><span class="step-detail" id="feedback">观察轨迹会撞地、闭合还是逃逸。</span></div><i class="arw a5"></i><div class="step" data-step="6"><span class="step-title">6 完成环绕</span><span class="step-values" id="win">完成圈数 —　周期 —</span></div></div><div class="panel control-box"><div class="ctl"><label for="speed">横向速度</label><div class="range-wrap"><input id="speed" type="range" aria-describedby="speedHelp"><span id="refMark" class="ref-mark" hidden title="圆轨道速度参考"></span></div><output id="speedOut" class="speed-val"></output></div><span id="speedHelp" class="secondary">调速后投出；先找一条不撞地的轨迹。</span><div class="actions"><button type="button" class="primary" id="throwBtn">投出</button><button type="button" id="refBtn" hidden>显示参考速度</button><button type="button" id="resetBtn">重置</button></div></div></aside>';

    var K=Lec.K, P=Lec.P, R=K.earth.meanRadius, alt=K.spacecraft.lowEarthOrbitAltitude, r0=R+alt;
    var circular=P.circularOrbitSpeedAtAltitude(K.earth.mass,R,alt), escape=P.escapeVelocityAtAltitude(K.earth.mass,R,alt);
    var cfg=K.p38OrbitGame||{speedMinMS:circular*0.5,speedMaxMS:escape*1.08,speedStepMS:50,initialRadialSpeedMS:0,physicsStepSeconds:8,escapeConfirmationRadiusM:R*2,requiredRevolutions:1,minimumSafeAltitudeM:1000,maxComparisonTrajectories:3,maximumSimulationSeconds:P.orbitalPeriodAtAltitude(K.earth.mass,R,alt)*1.4};
    var speed=document.getElementById('speed'), speedOut=document.getElementById('speedOut');
    speed.min=cfg.speedMinMS; speed.max=cfg.speedMaxMS; speed.step=cfg.speedStepMS;
    speed.value=P.clamp(circular*0.72,+speed.min,+speed.max);
    function km(v){return P.formatNumber(v/1000)+' km'}
    function kms(v){return P.formatNumber(v/1000)+' km/s'}
    document.getElementById('prep').textContent='高度 '+km(alt)+' · 地球半径 '+km(R);
    var state={running:false,done:false,status:'ready',x:r0,y:0,vx:cfg.initialRadialSpeedMS,vy:+speed.value,t:0,angle:0,lastAngle:0,minAlt:Infinity,points:[],past:[]};
    function updateSpeed(){var v=P.clamp(P.finite(+speed.value)?+speed.value:circular,+speed.min,+speed.max);speed.value=v;speedOut.value=kms(v);document.getElementById('setval').textContent='当前 '+kms(v);state.vy=v;}
    speed.addEventListener('input',function(){if(!state.running)updateSpeed();}); updateSpeed();

    var world=document.getElementById('world'), scene=new THREE.Scene(); scene.background=new THREE.Color(Deck.token('--surface-soft'));
    var camera=new THREE.PerspectiveCamera(42,1,.1,100), renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
    renderer.domElement.className='cv-fill';renderer.domElement.setAttribute('aria-hidden','true');world.insertBefore(renderer.domElement,world.firstChild);
    camera.position.set(0,7.2,10.5);camera.lookAt(0,0,0);
    scene.add(new THREE.HemisphereLight(Deck.token('--surface'),Deck.token('--muted'),2.2));
    var light=new THREE.DirectionalLight(Deck.token('--surface'),3);light.position.set(5,7,8);scene.add(light);
    var earth=new THREE.Mesh(new THREE.SphereGeometry(3,64,48),new THREE.MeshStandardMaterial({color:Deck.token('--accent-strong'),roughness:.72,metalness:.08}));earth.rotation.x=.18;scene.add(earth);
    var glow=new THREE.Mesh(new THREE.SphereGeometry(3.07,64,48),new THREE.MeshBasicMaterial({color:Deck.token('--cyan'),transparent:true,opacity:.13,side:THREE.BackSide}));scene.add(glow);
    var launchRadius=3*r0/R, ball=new THREE.Mesh(new THREE.SphereGeometry(.11,18,18),new THREE.MeshStandardMaterial({color:Deck.token('--warning'),emissive:Deck.token('--warning'),emissiveIntensity:.45}));scene.add(ball);
    var arrow=new THREE.ArrowHelper(new THREE.Vector3(0,1,0),new THREE.Vector3(launchRadius,0,0),1.3,Deck.token('--warning'),.24,.14);scene.add(arrow);
    var trace=null,pastGroup=new THREE.Group();scene.add(pastGroup);
    function lineFrom(points,color,opacity){var g=new THREE.BufferGeometry().setFromPoints(points),m=new THREE.LineBasicMaterial({color:color,transparent:opacity<1,opacity:opacity});return new THREE.Line(g,m)}
    function simToPoint(x,y){return new THREE.Vector3(3*x/R,3*y/R,0)}
    function resize(){var w=world.clientWidth,h=world.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();render();}
    Deck.onResize(resize);
    function render(){renderer.render(scene,camera)}
    function setStep(n){document.querySelectorAll('.step').forEach(function(el){var k=+el.dataset.step;el.classList.toggle('is-current',k===n);el.classList.toggle('is-past',k<n);});}
    function result(kind,text){state.running=false;state.done=true;state.status=kind;var el=document.getElementById('result');el.textContent=text;el.className='result-mark '+(kind==='stable-orbit'?'good':kind==='surface-impact'?'danger':'warn');document.getElementById('throwBtn').disabled=false;document.getElementById('feedback').textContent=text==='稳定入轨'?'轨迹保持闭合，并安全完成规定圈数。':kind==='surface-impact'?'速度不足，轨迹在绕过地球前与表面相交。':'这已不是入轨，而是非闭合轨迹。';setStep(kind==='stable-orbit'?6:5);if(kind==='surface-impact'){document.getElementById('refBtn').hidden=false;}world.dispatchEvent(new CustomEvent('game-complete',{bubbles:true,detail:{score:kind==='stable-orbit'?1:0,metrics:{result:kind,time:state.t},trace:state.points.length}}));}
    function start(){if(state.running)return;state.running=true;state.done=false;state.status='running';state.x=r0;state.y=0;state.vx=cfg.initialRadialSpeedMS;state.vy=P.clamp(P.finite(+speed.value)?+speed.value:circular,+speed.min,+speed.max);state.t=0;state.angle=0;state.lastAngle=0;state.minAlt=Infinity;state.points=[];if(trace){scene.remove(trace);trace.geometry.dispose();trace.material.dispose();trace=null;}ball.position.copy(simToPoint(state.x,state.y));arrow.setLength(1.3*P.ratio(state.vy,circular),.24,.14);document.getElementById('result').textContent='轨迹计算中';document.getElementById('result').className='result-mark';document.getElementById('throwBtn').disabled=true;setStep(3);world.dispatchEvent(new CustomEvent('game-start',{bubbles:true,detail:{speed:state.vy}}));}
    function archive(){if(!trace)return;var clone=lineFrom(state.points.map(function(p){return simToPoint(p[0],p[1])}),Deck.token('--line-strong'),.28);pastGroup.add(clone);while(pastGroup.children.length>cfg.maxComparisonTrajectories){var old=pastGroup.children[0];pastGroup.remove(old);old.geometry.dispose();old.material.dispose();}}
    function reset(){archive();state.running=false;state.done=false;state.status='reset';state.x=r0;state.y=0;state.t=0;state.points=[];ball.position.set(launchRadius,0,0);if(trace){scene.remove(trace);trace.geometry.dispose();trace.material.dispose();trace=null;}document.getElementById('result').textContent='等待投出';document.getElementById('result').className='result-mark';document.getElementById('feedback').textContent='观察轨迹会撞地、闭合还是逃逸。';document.getElementById('live').textContent='高度 —　速度 —　时间 —';document.getElementById('win').textContent='完成圈数 —　周期 —';document.getElementById('throwBtn').disabled=false;setStep(1);updateSpeed();render();world.dispatchEvent(new CustomEvent('game-reset',{bubbles:true,detail:{result:'reset'}}));}
    document.getElementById('throwBtn').addEventListener('click',start);document.getElementById('resetBtn').addEventListener('click',reset);
    document.getElementById('refBtn').addEventListener('click',function(){var mark=document.getElementById('refMark');var f=(circular-(+speed.min))/((+speed.max)-(+speed.min));mark.style.left=(f*100)+'%';mark.hidden=false;this.disabled=true;this.textContent='圆轨道参考已显示';});
    function physics(){var dt=cfg.physicsStepSeconds;var rr=Math.hypot(state.x,state.y),a=K.physics.standardGravity*Math.pow(R/rr,2);state.vx+=(-a*state.x/rr)*dt;state.vy+=(-a*state.y/rr)*dt;state.x+=state.vx*dt;state.y+=state.vy*dt;state.t+=dt;var nr=Math.hypot(state.x,state.y),ang=Math.atan2(state.y,state.x),d=ang-state.lastAngle;if(d < -Math.PI)d+=2*Math.PI;if(d>Math.PI)d-=2*Math.PI;state.angle+=Math.max(0,d);state.lastAngle=ang;state.minAlt=Math.min(state.minAlt,nr-R);state.points.push([state.x,state.y]);var vv=Math.hypot(state.vx,state.vy);if(nr<=R){result('surface-impact','撞地 ✕');return;}var energy=.5*vv*vv-K.physics.standardGravity*R*R/nr;if(energy>=0&&nr>=cfg.escapeConfirmationRadiusM){result('escape','逃逸 ↗');return;}var rev=state.angle/(2*Math.PI);if(rev>=cfg.requiredRevolutions&&state.minAlt>=cfg.minimumSafeAltitudeM){result('stable-orbit','稳定入轨');document.getElementById('win').textContent='完成 '+P.formatNumber(rev)+' 圈 · 周期 '+P.formatDuration(P.orbitalPeriodAtAltitude(K.earth.mass,R,alt))+' · 初速/圆轨道 '+P.percent(P.ratio(+speed.value,circular));return;}if(state.t>=cfg.maximumSimulationSeconds)result('escape','轨迹未闭合 ↗');}
    var accum=0;
    Deck.loop(function(t,dt){if(state.running){accum+=Math.min(dt,50);var steps=0;while(accum>=1&&steps<240&&state.running){physics();accum-=1;steps++;}ball.position.copy(simToPoint(state.x,state.y));if(trace){scene.remove(trace);trace.geometry.dispose();trace.material.dispose();}trace=lineFrom(state.points.map(function(p){return simToPoint(p[0],p[1])}),Deck.token('--accent'),1);scene.add(trace);var rr=Math.hypot(state.x,state.y),vv=Math.hypot(state.vx,state.vy);document.getElementById('live').textContent='高度 '+km(Math.max(0,rr-R))+' · 速度 '+kms(vv)+' · '+P.formatDuration(state.t);setStep(4);}render();},{still:1});
    resize();reset();
  </script>
</body>
</html>
