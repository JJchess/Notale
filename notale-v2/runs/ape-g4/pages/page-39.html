<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{display:flex;flex-direction:column;gap:var(--sp-3);height:100%;}
    .taskbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);min-height:42px;}
    .taskbar .lead{font-weight:700;}
    .progress{flex:0 0 auto;font-size:var(--fs-label);color:var(--muted);}
    .timeband{position:relative;height:82px;box-sizing:border-box;padding:var(--sp-3) var(--sp-5);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);}
    .time-head{display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-label);color:var(--muted);}
    .time-axis{position:relative;height:36px;margin-top:var(--sp-2);border-top:3px solid var(--line-strong);}
    .range{position:absolute;height:8px;border-radius:var(--radius-sm);background:var(--accent);min-width:8px;}
    .range.fluid{top:4px;background:var(--accent);}.range.orient{top:14px;background:var(--cyan);}.range.sickness{top:24px;background:var(--warning);}
    .range-label{position:absolute;left:var(--sp-2);top:2px;white-space:nowrap;font-size:var(--fs-label);line-height:1;color:var(--surface);font-weight:700;}
    .game-area{position:relative;height:342px;min-height:342px;}
    #konva{position:absolute;inset:0;z-index:2;}
    .class-shell{position:absolute;inset:0;z-index:1;}
    .class-shell>.lv{height:100%;display:flex;flex-direction:row;gap:var(--sp-4);padding-left:var(--sp-4);}
    .class-shell .box{flex:1 1 0;min-width:0;}
    .class-shell .bc{display:flex;flex-direction:column;gap:var(--sp-2);}
    .body-line{font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--muted);}
    .layer-label{font-size:var(--fs-label);font-weight:700;color:var(--muted);}
    .bottom{display:flex;align-items:center;gap:var(--sp-4);min-height:86px;}
    .feedback{flex:1 1 auto;min-width:0;min-height:58px;box-sizing:border-box;}
    .reset{flex:0 0 auto;}
    #cardHelp{font-size:var(--fs-label);color:var(--muted);}
  </style>
</head>
<body data-page="39" data-total="50">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/konva.min.js"></script>
  <script>
    Lec.mount({
      index: 39,
      kicker: "MICROGRAVITY / ACUTE RESPONSES",
      title: "刚进入失重，身体不是同时发生同一种变化",
      take: "体液转移、平衡错觉与太空运动病发生在不同时间尺度。"
    });
    Deck.init({ index: 39, total: 50 });

    var stage = document.getElementById("main");
    stage.innerHTML = `
      <div class="taskbar">
        <p class="lead">拖动当前反应卡，按主要受影响的身体关系归入一类。</p>
        <div class="progress" id="progress" aria-live="polite">已归类 0 / 10</div>
      </div>
      <section class="timeband" aria-label="短期反应典型时间窗">
        <div class="time-head"><span>刚进入微重力</span><span>典型量级，个体差异明显</span><span>最初数日</span></div>
        <div class="time-axis" id="timeAxis"></div>
      </section>
      <section class="game-area no-pan" aria-label="失重反应分类游戏">
        <div class="k-classification class-shell" aria-hidden="true">
          <div class="lv">
            <div class="box"><div class="bt">体液重新分布</div><div class="bc"><div class="layer-label">身体线索</div><div class="body-line">头脚方向的体液分布改变</div><div class="layer-label">常见体验</div><div class="body-line">卡片将吸附到这里</div><div class="layer-label">时间窗</div><div class="body-line" id="fluidText"></div></div></div>
            <div class="box"><div class="bt">平衡与方向错觉</div><div class="bc"><div class="layer-label">身体线索</div><div class="body-line">前庭、视觉与本体线索不一致</div><div class="layer-label">常见体验</div><div class="body-line">卡片将吸附到这里</div><div class="layer-label">时间窗</div><div class="body-line" id="orientText"></div></div></div>
            <div class="box"><div class="bt">太空运动病</div><div class="bc"><div class="layer-label">身体线索</div><div class="body-line">感觉冲突等因素形成综合症状</div><div class="layer-label">常见体验</div><div class="body-line">卡片将吸附到这里</div><div class="layer-label">时间窗</div><div class="body-line" id="sickText"></div></div></div>
          </div>
        </div>
        <div id="konva" role="application" tabindex="0" aria-label="当前反应卡。左右方向键切换分类舱，回车确认投放。" aria-describedby="cardHelp"></div>
      </section>
      <div class="bottom">
        <div class="note feedback" id="feedback" aria-live="polite">先判断：这是液体位置变化、方向线索冲突，还是一组综合症状？</div>
        <span id="cardHelp">键盘：← → 选舱，Enter 投放</span>
        <button class="reset" id="reset" type="button">重置并重排</button>
      </div>`;

    var W = Lec.K.microgravityAcuteResponseWindows || {
      fluidShift:{onsetMinSeconds:Lec.P.hoursToSeconds(1/60),onsetMaxSeconds:Lec.P.hoursToSeconds(1),adjustmentMinSeconds:Lec.P.hoursToSeconds(12),adjustmentMaxSeconds:Lec.P.daysToSeconds(3)},
      orientationIllusion:{episodeMinSeconds:10,episodeMaxSeconds:Lec.P.hoursToSeconds(1/12),susceptibleMinSeconds:10,susceptibleMaxSeconds:Lec.P.daysToSeconds(3)},
      spaceMotionSickness:{onsetMinSeconds:Lec.P.hoursToSeconds(1),onsetMaxSeconds:Lec.P.hoursToSeconds(8),commonWindowMinSeconds:Lec.P.hoursToSeconds(1),commonWindowMaxSeconds:Lec.P.daysToSeconds(3)}
    };
    function finite(v){ Lec.P.finite(v); return v; }
    function duration(v){ return Lec.P.formatDuration(finite(v)); }
    function span(a,b){ return duration(a) + "—" + duration(b); }
    document.getElementById("fluidText").textContent = "很快出现；调节约 " + span(W.fluidShift.adjustmentMinSeconds,W.fluidShift.adjustmentMaxSeconds);
    document.getElementById("orientText").textContent = "单次约 " + span(W.orientationIllusion.episodeMinSeconds,W.orientationIllusion.episodeMaxSeconds);
    document.getElementById("sickText").textContent = "常见于 " + span(W.spaceMotionSickness.commonWindowMinSeconds,W.spaceMotionSickness.commonWindowMaxSeconds);

    var cardsBase = [
      {t:"脸部显得浮肿或饱满",c:0},{t:"鼻塞般的感觉",c:0},{t:"腿部看起来变细",c:0},
      {t:"闭眼后不确定哪边是上",c:1},{t:"转头时觉得身体仍在旋转",c:1},{t:"看到舱壁后才重新确认方向",c:1},
      {t:"恶心",c:2},{t:"呕吐",c:2},{t:"头晕或明显不适",c:2},{t:"食欲下降",c:2}
    ];
    var order=[], solved=[], current=0, selected=1, attempt=0;
    var kstage = new Konva.Stage({container:"konva",width:1408,height:342});
    var layer = new Konva.Layer(); kstage.add(layer);
    var card = new Konva.Group({draggable:true});
    var cardRect = new Konva.Rect({width:300,height:58,cornerRadius:14,strokeWidth:3,shadowBlur:10,shadowOpacity:.12});
    var cardText = new Konva.Text({width:276,height:58,x:12,align:"center",verticalAlign:"middle",fontSize:18,fontStyle:"bold",fontFamily:Deck.token("--font-sans")});
    card.add(cardRect,cardText); layer.add(card);
    var markers=[];
    for(var i=0;i<3;i++){
      var m=new Konva.Rect({x:18+i*469,y:4,width:445,height:238,cornerRadius:14,strokeWidth:4,dash:[10,8],opacity:0});
      layer.add(m); markers.push(m);
    }
    var bins=[{x:18,w:445},{x:487,w:445},{x:956,w:434}];
    function colors(){ cardRect.stroke(Deck.rgb("--accent"));cardRect.fill(Deck.rgb("--surface"));cardText.fill(Deck.rgb("--text")); markers.forEach(function(m,j){m.stroke(j===selected?Deck.rgb("--accent"):Deck.rgb("--line-strong"));}); }
    function shuffle(){ var a=cardsBase.slice(); for(var i=a.length-1;i>0;i--){var j=(i*7+attempt*3)% (i+1),q=a[i];a[i]=a[j];a[j]=q;} return a; }
    function resetCard(){ card.position({x:554,y:270}); card.draggable(true); cardText.text(order[current].t); selected=1; colors(); layer.draw(); document.getElementById("konva").setAttribute("aria-label","当前卡片："+order[current].t+"。左右方向键切换分类舱，回车确认投放。"); }
    function addRange(cat){ if(document.querySelector('.range[data-c="'+cat+'"]'))return; var spec=[{cl:"fluid",name:"体液",a:W.fluidShift.onsetMinSeconds,b:W.fluidShift.adjustmentMaxSeconds},{cl:"orient",name:"方向",a:W.orientationIllusion.episodeMinSeconds,b:W.orientationIllusion.susceptibleMaxSeconds},{cl:"sickness",name:"运动病",a:W.spaceMotionSickness.onsetMinSeconds,b:W.spaceMotionSickness.commonWindowMaxSeconds}][cat]; var min=Math.min(W.orientationIllusion.episodeMinSeconds,W.fluidShift.onsetMinSeconds,W.spaceMotionSickness.onsetMinSeconds),max=Math.max(W.fluidShift.adjustmentMaxSeconds,W.orientationIllusion.susceptibleMaxSeconds,W.spaceMotionSickness.commonWindowMaxSeconds); function pos(v){return Lec.P.clamp(Math.log10(finite(v)/finite(min))/Math.log10(finite(max)/finite(min)),0,1)*100;} var el=document.createElement("div");el.className="range "+spec.cl;el.dataset.c=cat;el.style.left=pos(spec.a)+"%";el.style.width=Math.max(4,pos(spec.b)-pos(spec.a))+"%";el.title=spec.name+"："+span(spec.a,spec.b);document.getElementById("timeAxis").appendChild(el); }
    function place(cat){ var item=order[current]; if(cat!==item.c){ card.to({x:554,y:270,duration:Deck.reduced()?0:.22}); var special=item.c===2&&cat===1; document.getElementById("feedback").textContent=special?"感觉冲突可能参与太空运动病，但症状组合归入综合反应。":"再看身体关系：这是液体位置变化，还是感觉线索之间的冲突？"; return; } solved.push(item); addRange(cat); current++; document.getElementById("progress").textContent="已归类 "+current+" / "+order.length; document.getElementById("feedback").textContent=cat===0?"归入体液分布：液体没有突然变多，而是位置改变。":cat===1?"归入方向错觉：不同感觉线索暂时给出不同答案。":"归入太空运动病：这是可能出现的综合症状，并非人人都会发生。"; if(current===order.length){card.visible(false);markers.forEach(function(m){m.opacity(0)});layer.draw();document.getElementById("feedback").textContent="三类反应的起始速度不同，时间窗可以重叠，经历强度也因人而异。";document.getElementById("konva").setAttribute("aria-label","全部十张反应卡已正确归类。三类时间窗相互重叠。");return;} resetCard(); }
    card.on("dragstart",function(){markers.forEach(function(m){m.opacity(.7)});layer.draw();});
    card.on("dragmove",function(){var cx=card.x()+150;selected=cx<469?0:cx<938?1:2;colors();layer.draw();});
    card.on("dragend",function(){markers.forEach(function(m){m.opacity(0)});place(selected);});
    document.getElementById("konva").addEventListener("keydown",function(e){if(current>=order.length)return;if(e.key==="ArrowLeft"||e.key==="ArrowRight"){e.preventDefault();selected=Deck.clamp(selected+(e.key==="ArrowRight"?1:-1),0,2);markers.forEach(function(m,j){m.opacity(j===selected?.75:.18)});colors();layer.draw();}else if(e.key==="Enter"||e.key===" "){e.preventDefault();markers.forEach(function(m){m.opacity(0)});place(selected);}});
    function reset(){attempt++;order=shuffle();solved=[];current=0;card.visible(true);document.getElementById("timeAxis").innerHTML="";document.getElementById("progress").textContent="已归类 0 / 10";document.getElementById("feedback").textContent="先判断：这是液体位置变化、方向线索冲突，还是一组综合症状？";resetCard();}
    document.getElementById("reset").addEventListener("click",reset);
    reset();
  </script>
</body>
</html>
