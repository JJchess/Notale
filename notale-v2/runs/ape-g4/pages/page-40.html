<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:var(--sp-3)}
    .lab{height:292px;display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);position:relative}
    .rig{position:relative;min-width:0;overflow:hidden;padding:var(--sp-3);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg)}
    .rig-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-3);position:relative;z-index:2}
    .rig-head strong{font-size:var(--fs-h2)}
    .rig-head span{font-size:var(--fs-label);color:var(--muted)}
    .rig canvas{position:absolute;inset:54px 0 0;width:100%;height:184px}
    .trace{position:absolute;left:var(--sp-4);right:var(--sp-4);bottom:var(--sp-3);height:32px;display:flex;align-items:end;gap:var(--sp-1);border-bottom:2px solid var(--line-strong)}
    .pulse{flex:1 1 0;max-width:18px;background:var(--accent);border-radius:var(--radius-sm) var(--radius-sm) 0 0}
    .rig.low .pulse{background:var(--warning)}
    .links{position:absolute;left:0;right:0;bottom:-13px;height:16px;pointer-events:none}
    .links:before,.links:after{content:"";position:absolute;top:0;height:16px;border-left:2px dashed var(--line-strong)}
    .links:before{left:25%}.links:after{left:75%}
    .controlbar{height:56px;display:flex;gap:var(--sp-3);align-items:center}
    .controlbar .ctl{padding:var(--sp-2) var(--sp-3)}
    .pullctl{flex:1 1 auto}.pullctl input{min-width:240px}
    .status{font-size:var(--fs-sec);color:var(--muted);min-width:230px}
    .compare{flex:1 1 auto;--cmp-cols:minmax(145px,.55fr) repeat(2,minmax(0,1fr));font-size:var(--fs-sec);line-height:var(--lh-copy)}
    .compare>*{padding:var(--sp-2) var(--sp-3)}
    .compare>.hdr{min-height:38px;font-size:var(--fs-body)}
    .compare>.dim{font-size:var(--fs-label)}
    .result{font-weight:700}
    .footnote{grid-column:1/-1!important;justify-content:center!important;text-align:center;background:var(--surface-soft);color:var(--muted);font-size:var(--fs-sec)}
  </style>
</head>
<body data-page="40" data-total="50">
  <div id="stage"><main id="main">
    <section class="lab" aria-label="同步骨肌负荷装置">
      <div class="rig high min0"><div class="rig-head"><strong>负荷较多</strong><span id="highRead">支持负荷</span></div><canvas id="highCv" role="img" aria-label="相同动作下，这一列拉索张力、骨梁应变和肌肉收紧较明显。"></canvas><div class="trace" id="highTrace" aria-hidden="true"></div></div>
      <div class="rig low min0"><div class="rig-head"><strong>负荷较少</strong><span id="lowRead">支持负荷</span></div><canvas id="lowCv" role="img" aria-label="相同动作下，这一列负荷脉冲更少，累积维持刺激更低。"></canvas><div class="trace" id="lowTrace" aria-hidden="true"></div></div>
      <div class="links" aria-hidden="true"></div>
    </section>
    <div class="controlbar">
      <div class="ctl pullctl"><label for="pull">同步拉动</label><input id="pull" type="range" min="0" max="100" value="0" step="5" aria-describedby="task"><span id="pullVal" class="tick">0%</span></div>
      <div class="ctl"><label for="scenario">卸载情景</label><select id="scenario"></select></div>
      <button class="primary" id="advance" type="button">推进观察时间</button>
      <button id="reset" type="button">重置比较</button>
      <span class="status" id="task" aria-live="polite">拉动手柄，比较同幅动作的受力。</span>
    </div>
    <section class="k-comparison compare" aria-label="负荷条件逐行比较">
      <div class="hdr">比较维度</div><div class="hdr">负荷较多</div><div class="hdr">负荷较少</div>
      <div class="rowline"></div>
      <div class="dim">机械刺激</div><div class="cell">反复出现压缩、拉伸与张力脉冲</div><div class="cell diff">支撑需求降低，负荷脉冲更少</div>
      <div class="rowline"></div>
      <div class="dim">肌肉工作</div><div class="cell">持续产生张力，拉索位移与阻力较大</div><div class="cell diff">同幅动作所需张力较低</div>
      <div class="rowline"></div>
      <div class="dim">骨维持信号</div><div class="cell">重复受力提供较多机械刺激</div><div class="cell diff">卸载减少刺激；不同部位响应不同</div>
      <div class="rowline"></div>
      <div class="dim">时间累积</div><div class="cell result" id="highResult">较多刺激对应较高的功能维持需求</div><div class="cell diff result" id="lowResult">推进时间后显示教学量级</div>
      <div class="rowline"></div>
      <div class="cell footnote">这是负荷条件的比较，不是个人训练方案，也不是对个体结果的精确预测。</div>
    </section>
  </main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/matter.min.js"></script>
  <script>
    Lec.K.bodyMassReferenceKg = Lec.K.bodyMassReferenceKg || 70;
    Lec.K.standardGravityMS2 = Lec.K.standardGravityMS2 || 9.80665;
    Lec.K.microgravityBoneLossMonthlyRange = Lec.K.microgravityBoneLossMonthlyRange || [.005,.015];
    Lec.K.p40LoadFractionScenarios = Lec.K.p40LoadFractionScenarios || [{label:"长期卸载",high:1,low:.12},{label:"部分卸载",high:1,low:.38}];
    Lec.K.p40DurationScenarios = Lec.K.p40DurationScenarios || [2592000,7776000,15552000];
    Lec.K.p40LoadEventThresholdN = Lec.K.p40LoadEventThresholdN || 40;
    Lec.K.p40StimulusEventCap = Lec.K.p40StimulusEventCap || 1.2;
    Lec.K.p40TeachingMonthSeconds = Lec.K.p40TeachingMonthSeconds || 2592000;
    Lec.mount({index:40,kicker:"LOAD / UNLOAD",title:"同一副骨与肌肉，在“日常承重”和“长期卸载”下会收到不同信号",take:"骨与肌肉会响应日常负荷；长期卸载会减少维持它们的刺激。"});
    Deck.init({index:40,total:50});
    var P=Lec.P,K=Lec.K, MatterEngine=Matter.Engine, Bodies=Matter.Bodies, Composite=Matter.Composite, Constraint=Matter.Constraint;
    var pull=document.getElementById("pull"), scenario=document.getElementById("scenario"), task=document.getElementById("task");
    var events=0, stimulusHigh=0, stimulusLow=0, durationIndex=0;
    var scenarios=K.p40LoadFractionScenarios;
    scenarios.forEach(function(s,i){var o=document.createElement("option");o.value=i;o.textContent=s.label||("情景 "+(i+1));scenario.appendChild(o)});
    function frac(s,key){if(typeof s==="number") return key==="high"?1:s; return Number(s[key] != null?s[key]:(key==="high"?1:s.fraction));}
    function makeRig(canvas,low){
      var engine=MatterEngine.create({gravity:{x:0,y:1}}), w=660,h=184;
      var anchor=Bodies.circle(90,38,7,{isStatic:true}), weight=Bodies.rectangle(90,112,48,38,{frictionAir:.08}), beam=Bodies.rectangle(390,126,310,18,{isStatic:true});
      var rope=Constraint.create({bodyA:anchor,bodyB:weight,length:72,stiffness:.12}); Composite.add(engine.world,[anchor,weight,beam,rope]);
      var ctx=canvas.getContext("2d");
      function draw(){var d=Deck.fit(canvas),cw=canvas.clientWidth,ch=canvas.clientHeight, sx=cw/w,sy=ch/h;ctx.setTransform(d.dpr*sx,0,0,d.dpr*sy,0,0);ctx.clearRect(0,0,w,h);var amp=Number(pull.value)/100, f=frac(scenarios[scenario.value]||scenarios[0],low?"low":"high");Matter.Body.setPosition(weight,{x:90+amp*150*f,y:112-amp*34*f});MatterEngine.update(engine,16.67);ctx.strokeStyle=Deck.rgb("line-strong");ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(90,38);ctx.lineTo(weight.position.x,weight.position.y);ctx.stroke();ctx.fillStyle=Deck.rgb(low?"warning":"accent");ctx.fillRect(235,116,310,18);ctx.strokeStyle=Deck.rgb("text");ctx.lineWidth=3;ctx.strokeRect(235,116,310,18);ctx.fillStyle=Deck.rgba(low?"warning":"accent",.28+.6*amp*f);ctx.fillRect(300,62,34+150*amp*f,38);ctx.strokeStyle=Deck.rgb(low?"warning":"accent");ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(300,81);ctx.lineTo(334+150*amp*f,81);ctx.stroke();if(amp>.25){ctx.strokeStyle=Deck.rgb("danger");ctx.lineWidth=2;for(var i=0;i<4;i++){var x=330+i*48;ctx.beginPath();ctx.moveTo(x,116);ctx.lineTo(x+8,134);ctx.stroke()}}ctx.fillStyle=Deck.rgb("muted");ctx.fillRect(weight.position.x-24,weight.position.y-19,48,38)}
      Deck.autofit(canvas,draw); return draw;
    }
    var drawHigh=makeRig(document.getElementById("highCv"),false),drawLow=makeRig(document.getElementById("lowCv"),true);
    function fmtPct(v){return P.formatNumber(P.percent(v,1))+"%"}
    function update(){var s=scenarios[scenario.value]||scenarios[0],hf=frac(s,"high"),lf=frac(s,"low"), mass=K.bodyMassReferenceKg, ref=P.weight(mass,K.standardGravityMS2);document.getElementById("pullVal").textContent=pull.value+"%";document.getElementById("highRead").textContent="支持负荷 "+fmtPct(hf)+" · "+P.formatNumber(ref*hf)+" N";document.getElementById("lowRead").textContent="支持负荷 "+fmtPct(lf)+" · "+P.formatNumber(ref*lf)+" N";drawHigh();drawLow()}
    function addPulse(el,level){var p=document.createElement("i");p.className="pulse";p.style.height=(8+level*22)+"px";el.appendChild(p);while(el.children.length>18)el.removeChild(el.firstChild)}
    function commit(){var a=Number(pull.value)/100;if(a<.3)return;var s=scenarios[scenario.value]||scenarios[0],hf=frac(s,"high"),lf=frac(s,"low"),ref=P.weight(K.bodyMassReferenceKg,K.standardGravityMS2), highLoad=ref*hf*a,lowLoad=ref*lf*a;if(highLoad>K.p40LoadEventThresholdN){events++;stimulusHigh+=P.clamp(highLoad/ref,0,K.p40StimulusEventCap)}if(lowLoad>K.p40LoadEventThresholdN)stimulusLow+=P.clamp(lowLoad/ref,0,K.p40StimulusEventCap);addPulse(document.getElementById("highTrace"),a*hf);addPulse(document.getElementById("lowTrace"),a*lf);task.textContent="负荷事件增加：相同动作下，右列刺激较少。"}
    pull.addEventListener("input",update);pull.addEventListener("change",function(){commit();pull.value=0;update()});scenario.addEventListener("change",update);
    document.getElementById("advance").addEventListener("click",function(){var durations=K.p40DurationScenarios,d=durations[Math.min(durationIndex,durations.length-1)];durationIndex=Math.min(durationIndex+1,durations.length-1);var months=d/K.p40TeachingMonthSeconds, r=K.microgravityBoneLossMonthlyRange,lo=Array.isArray(r)?r[0]:(r.min||r.low),hi=Array.isArray(r)?r[1]:(r.max||r.high);document.getElementById("highResult").textContent="观察 "+P.formatDuration(d)+"：刺激指数 "+P.formatNumber(stimulusHigh);document.getElementById("lowResult").textContent="刺激指数 "+P.formatNumber(stimulusLow)+"；骨量变化量级 "+fmtPct(lo*months)+"–"+fmtPct(hi*months)+"（部位与个体差异；长期不保证线性）";task.textContent="时间已推进。许多次负荷刺激的差异开始累积。"});
    document.getElementById("reset").addEventListener("click",function(){events=0;stimulusHigh=0;stimulusLow=0;durationIndex=0;pull.value=0;scenario.value=0;document.getElementById("highTrace").textContent="";document.getElementById("lowTrace").textContent="";document.getElementById("highResult").textContent="较多刺激对应较高的功能维持需求";document.getElementById("lowResult").textContent="推进时间后显示教学量级";task.textContent="已重置。拉动手柄，比较同幅动作的受力。";update()});
    update();
  </script>
</body>
</html>
