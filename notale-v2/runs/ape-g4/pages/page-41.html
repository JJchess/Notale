<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:var(--sp-3)}
    .sim-shell{position:relative;flex:1 1 0;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow)}
    .pixi-host{position:absolute;inset:0;overflow:hidden}
    .pixi-host canvas{display:block}
    .control-rail{position:absolute;z-index:4;left:var(--sp-4);top:var(--sp-4);width:278px;padding:var(--sp-3);background:rgba(255,255,255,.94);backdrop-filter:blur(8px)}
    .control-rail .ctl{padding:var(--sp-2) var(--sp-3);gap:var(--sp-2)}
    .control-rail .ctl label{width:62px}
    .control-rail select{flex:1 1 0}
    .range-line{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:var(--sp-2)}
    .range-line output{min-width:52px;text-align:right;font-variant-numeric:tabular-nums;font-size:var(--fs-label)}
    .actions{display:flex;gap:var(--sp-2)}
    .actions button{flex:1 1 0;padding-inline:var(--sp-2)}
    .result-panel{position:absolute;z-index:4;right:var(--sp-4);top:var(--sp-4);width:300px;padding:var(--sp-4);background:rgba(255,255,255,.94);backdrop-filter:blur(8px)}
    .result-title{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-2);margin-bottom:var(--sp-3)}
    .run-id{font-size:var(--fs-label);color:var(--muted)}
    .metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2)}
    .metric{padding:var(--sp-2) var(--sp-3);border-left:3px solid var(--accent);background:var(--surface-soft)}
    .metric b{display:block;font-size:var(--fs-h2);line-height:1.2;font-variant-numeric:tabular-nums}
    .metric span{font-size:var(--fs-label);color:var(--muted)}
    .dist{margin-top:var(--sp-3)}
    .dist-track{position:relative;height:34px;margin-top:var(--sp-1);border-radius:var(--radius-sm);background:var(--surface-strong);overflow:hidden}
    .dist-band{position:absolute;left:12%;right:18%;top:11px;height:12px;border-radius:999px;background:var(--cyan)}
    .dist-mark{position:absolute;top:4px;width:4px;height:26px;border-radius:999px;background:var(--danger);transform:translateX(-50%)}
    .scene-labels{position:absolute;z-index:3;left:322px;right:332px;top:var(--sp-4);display:flex;justify-content:space-between;pointer-events:none}
    .scene-labels span{padding:var(--sp-1) var(--sp-2);font-size:var(--fs-label);font-weight:700;color:var(--muted);background:rgba(255,255,255,.86);border-radius:var(--radius-sm)}
    .model-note{position:absolute;z-index:4;left:322px;bottom:var(--sp-3);font-size:var(--fs-sec);color:var(--muted)}
    .process-strip{height:92px;padding:var(--sp-2) 0}
    .process-strip.k-process>.step{display:flex;align-items:center;justify-content:center;padding:var(--sp-2);text-align:center;font-size:var(--fs-label);font-weight:700}
    .process-strip.k-process>.arw{flex-basis:22px}
    .process-strip.k-process>.axis{height:3px}
  </style>
</head>
<body data-page="41" data-total="50">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/pixi.min.js"></script>
  <script src="assets/lib/seedrandom.min.js"></script>
  <script>
    Lec.mount({
      index: 41,
      kicker: "RADIATION · RANDOM HITS",
      title: "同一层屏蔽，不会挡住每一颗粒子",
      take: "太空辐射风险取决于粒子、能量、屏蔽、暴露时间和随机命中。"
    });
    Deck.init({ index: 41, total: 50 });

    var stage = document.getElementById("stage");
    var main = document.getElementById("main");
    main.innerHTML = `
      <section class="sim-shell min0" aria-label="辐射穿舱蒙特卡洛模拟">
        <div class="pixi-host" id="pixiHost" role="img" aria-label="粒子从左侧环境进入，经过中部单层屏蔽；部分被阻挡，部分穿透并随机命中舱内目标。"></div>
        <div class="scene-labels" aria-hidden="true"><span>辐射环境</span><span>单层屏蔽</span><span>舱内目标</span></div>
        <form class="control-rail panel stack-tight" onsubmit="return false" aria-label="模拟条件">
          <div class="ctl"><label for="scenario">环境</label><select id="scenario"></select></div>
          <div class="ctl"><label for="material">材料</label><select id="material"></select></div>
          <div class="ctl range-line"><label for="thickness">厚度</label><input id="thickness" type="range"><output id="thickOut"></output></div>
          <div class="ctl range-line"><label for="duration">时间</label><input id="duration" type="range"><output id="durationOut"></output></div>
          <div class="actions"><button class="primary" id="run" type="button">运行同条件试验</button><button id="pause" type="button">暂停</button></div>
          <div class="actions"><button id="newSeed" type="button">换种子</button><button id="reset" type="button">复位</button></div>
        </form>
        <aside class="result-panel panel" aria-live="polite">
          <div class="result-title"><h2>本轮与分布</h2><span class="run-id" id="runId">固定种子 · 第0轮</span></div>
          <div class="metrics">
            <div class="metric"><b id="incident">0</b><span>入射</span></div>
            <div class="metric"><b id="penetrated">0</b><span>穿透</span></div>
            <div class="metric"><b id="hits">0</b><span>有效命中</span></div>
            <div class="metric"><b id="energy">0</b><span id="energyLabel">相对沉积</span></div>
          </div>
          <div class="dist"><span class="label">命中次数分布</span><div class="dist-track"><i class="dist-band" id="hitBand"></i><i class="dist-mark" id="hitMark"></i></div></div>
          <p class="secondary" id="rates">穿透比例与命中比例将在运行后显示。</p>
        </aside>
        <p class="model-note">二维轨迹仅表示随机过程 · 简化比较模型</p>
      </section>
      <section class="k-process process-strip" id="process" aria-label="一次辐射穿舱的六步过程">
        <div class="axis"></div><div class="step is-current">选择环境</div><div class="arw"></div><div class="step">产生粒子</div><div class="arw"></div><div class="step">穿过屏蔽</div><div class="arw"></div><div class="step">相交命中</div><div class="arw"></div><div class="step">沉积能量</div><div class="arw"></div><div class="step">累积结果</div>
      </section>`;

    var scenarios = Lec.K.radiationDoseScenarios || {
      leo:{label:"近地轨道",particleMix:{charged:.72,heavy:.28},energyRanges:{charged:[1,3],heavy:[2,5]},durationControl:{min:1,max:30,step:1,default:7,unit:"day"},simulation:{emissionRate:2,displayScale:1,minSamples:24,maxSamples:180,repeatCount:32,hitModel:{charged:{low:.24,high:.34},heavy:{low:.32,high:.42}},depositionModel:{charged:{low:.18,high:.24},heavy:{low:.30,high:.40}},depositionModelUnit:"模型单位"}},
      deep:{label:"深空转移",particleMix:{charged:.58,heavy:.42},energyRanges:{charged:[2,5],heavy:[4,8]},durationControl:{min:1,max:30,step:1,default:7,unit:"day"},simulation:{emissionRate:3,displayScale:1,minSamples:24,maxSamples:220,repeatCount:32,hitModel:{charged:{low:.30,high:.40},heavy:{low:.38,high:.50}},depositionModel:{charged:{low:.22,high:.30},heavy:{low:.36,high:.48}},depositionModelUnit:"模型单位"}},
      surface:{label:"行星表面",particleMix:{charged:.65,heavy:.35},energyRanges:{charged:[1,4],heavy:[3,7]},durationControl:{min:1,max:30,step:1,default:7,unit:"day"},simulation:{emissionRate:2.4,displayScale:1,minSamples:24,maxSamples:200,repeatCount:32,hitModel:{charged:{low:.26,high:.36},heavy:{low:.34,high:.46}},depositionModel:{charged:{low:.20,high:.27},heavy:{low:.33,high:.44}},depositionModelUnit:"模型单位"}}
    };
    var materials = Lec.K.radiationShieldMaterials || {
      water:{label:"水",thicknessRange:[0,12],thicknessStep:1,defaultThickness:4,thicknessUnit:"cm",attenuation:{charged:{low:.12,high:.08},heavy:{low:.08,high:.05}}},
      polyethylene:{label:"聚乙烯",thicknessRange:[0,12],thicknessStep:1,defaultThickness:4,thicknessUnit:"cm",attenuation:{charged:{low:.14,high:.09},heavy:{low:.09,high:.06}}},
      aluminium:{label:"铝",thicknessRange:[0,12],thicknessStep:1,defaultThickness:4,thicknessUnit:"cm",attenuation:{charged:{low:.10,high:.06},heavy:{low:.06,high:.04}}}
    };
    var scenarioKeys = Object.keys(scenarios);
    var materialKeys = Object.keys(materials);
    var els = {};
    ["scenario","material","thickness","duration","thickOut","durationOut","run","pause","newSeed","reset","runId","incident","penetrated","hits","energy","energyLabel","rates","hitBand","hitMark"].forEach(function(id){ els[id]=document.getElementById(id); });
    function labelOf(v,k){ return v.label || v.name || k; }
    scenarioKeys.forEach(function(k){ els.scenario.add(new Option(labelOf(scenarios[k],k),k)); });
    materialKeys.forEach(function(k){ els.material.add(new Option(labelOf(materials[k],k),k)); });
    var initialScenario=scenarioKeys[0], initialMaterial=materialKeys[0];
    var seedSuffix=0, runNo=0, paused=false, particles=[], resultHistory=[];
    var baseSeed=String(Lec.K.populationSimulationSeed)+"|p41-radiation";
    function num(v, fallback){ var n=Number(v); return Number.isFinite(n)?n:fallback; }
    function rangeOf(v, fallback){ if(Array.isArray(v)) return [num(v[0],fallback[0]),num(v[1],fallback[1])]; if(v&&typeof v==='object') return [num(v.min,v.low),num(v.max,v.high)]; return fallback; }
    function configControls(){
      var s=scenarios[els.scenario.value]; var m=materials[els.material.value];
      var tr=rangeOf(m.thicknessRange || m.thicknessControl,[0,10]);
      els.thickness.min=tr[0]; els.thickness.max=tr[1]; els.thickness.step=num((m.thicknessControl||{}).step,m.thicknessStep||1); els.thickness.value=num((m.thicknessControl||{}).default,m.defaultThickness||(tr[0]+tr[1])/2);
      var dc=s.durationControl||{}; els.duration.min=num(dc.min,1); els.duration.max=num(dc.max,30); els.duration.step=num(dc.step,1); els.duration.value=num(dc.default,dc.initial||els.duration.min);
      updateOutputs();
    }
    function updateOutputs(){ var m=materials[els.material.value], s=scenarios[els.scenario.value]; els.thickOut.value=Lec.P.formatNumber(Number(els.thickness.value))+" "+(m.thicknessUnit||""); var dc=s.durationControl||{}; var unit=dc.unit||"day"; var sec=unit.indexOf("hour")>=0||unit.indexOf("时")>=0?Lec.P.hoursToSeconds(Number(els.duration.value)):Lec.P.daysToSeconds(Number(els.duration.value)); els.durationOut.value=Lec.P.formatDuration(sec); }
    configControls();

    var host=document.getElementById('pixiHost');
    var app=new PIXI.Application({width:1408,height:440,backgroundAlpha:0,antialias:true,autoDensity:true,resolution:1});
    app.stop(); app.view.className='cv-fill'; app.view.setAttribute('aria-hidden','true'); host.prepend(app.view); Deck.fit(app.view);
    var staticLayer=new PIXI.Graphics(), trailLayer=new PIXI.Graphics(), particleLayer=new PIXI.Container(); app.stage.addChild(staticLayer,trailLayer,particleLayer);
    function col(name){ var c=Deck.rgb(name); return (c[0]<<16)|(c[1]<<8)|c[2]; }
    function drawScene(){
      staticLayer.clear(); var w=app.renderer.width,h=app.renderer.height;
      staticLayer.beginFill(col('--surface-soft'),.55).drawRect(0,0,w,h).endFill();
      staticLayer.lineStyle(3,col('--line-strong'),1).beginFill(col('--surface-strong'),.8).drawRect(w*.49,58,34,h-116).endFill();
      staticLayer.lineStyle(2,col('--cyan'),.65);
      for(var r=0;r<3;r++) for(var c=0;c<4;c++){ var x=w*.64+c*48,y=118+r*64; staticLayer.drawCircle(x,y,13); }
      staticLayer.lineStyle(1,col('--line'),.8).moveTo(w*.31,46).lineTo(w*.31,h-36).moveTo(w*.79,46).lineTo(w*.79,h-36);
    }
    drawScene();
    function pickMix(rng,mix){ var entries=Array.isArray(mix)?mix.map(function(x,i){return [x.type||x.label||i,num(x.fraction||x.value,1)];}):Object.keys(mix||{particle:1}).map(function(k){return [k,num(mix[k],1)];}); var t=rng()*entries.reduce(function(a,e){return a+e[1];},0); for(var i=0;i<entries.length;i++){t-=entries[i][1];if(t<=0)return entries[i][0];} return entries[0][0]; }
    function nested(o,a,b,f){ var v=o&&o[a]; if(v&&typeof v==='object') v=v[b]!==undefined?v[b]:v.default; return num(v,f); }
    function simulate(){
      particles.forEach(function(p){particleLayer.removeChild(p.g);p.g.destroy();}); particles=[]; trailLayer.clear();
      var s=scenarios[els.scenario.value], m=materials[els.material.value], sim=s.simulation||{};
      var exposure=Number(els.duration.value), emission=num(sim.emissionRate,1), scale=num(sim.displayScale,1), lo=num(sim.minSamples,20), hi=num(sim.maxSamples,240);
      var count=Math.round(emission*exposure*scale); count=Deck.clamp(count,lo,hi);
      var rng=new Math.seedrandom(baseSeed+"|"+seedSuffix+"|"+(++runNo)); var thickness=Deck.clamp(Number(els.thickness.value),Number(els.thickness.min),Number(els.thickness.max));
      var incident=0,penetrated=0,hits=0,energy=0,lastDeposit=0;
      for(var i=0;i<count;i++){
        var type=pickMix(rng,s.particleMix), er=rangeOf((s.energyRanges||{})[type],[1,2]), e=er[0]+rng()*(er[1]-er[0]); var band=e<(er[0]+er[1])/2?'low':'high';
        var att=nested(m.attenuation,type,band,.1), prob=Math.exp(-att*thickness); prob=Deck.clamp(prob,0,1); var pass=rng()<prob;
        var y=72+rng()*(app.renderer.height-144), endX=pass?app.renderer.width*(.61+rng()*.14):app.renderer.width*.49; var hit=false, dep=0;
        incident++; if(pass){penetrated++; var hp=nested(sim.hitModel,type,band,.35); hit=rng()<Deck.clamp(hp,0,1); if(hit){hits++; dep=e*nested(sim.depositionModel,type,band,.25); energy+=dep; lastDeposit=dep;}}
        var g=new PIXI.Graphics(); var shape=i%3; g.lineStyle(2,shape===0?col('--accent'):shape===1?col('--warning'):col('--cyan'),.85); if(shape===0)g.drawCircle(0,0,4);else if(shape===1)g.drawRect(-4,-4,8,8);else g.moveTo(0,-5).lineTo(5,4).lineTo(-5,4).closePath(); g.x=app.renderer.width*.31;g.y=y; particleLayer.addChild(g);
        particles.push({g:g,x0:g.x,y0:y,x1:endX,y1:y+(pass?(rng()-.5)*54:0),pass:pass,hit:hit,dep:dep,progress:0,delay:i/Math.max(1,count)*.55});
      }
      var repeats=num(sim.repeatCount||sim.repetitions,24), trials=[];
      for(var q=0;q<repeats;q++){var trng=new Math.seedrandom(baseSeed+"|dist|"+seedSuffix+"|"+q),hv=0;for(var j=0;j<count;j++){if(trng()<Math.max(0,Math.min(1,penetrated/Math.max(1,incident)))&&trng()<Math.max(0,Math.min(1,hits/Math.max(1,penetrated))))hv++;}trials.push(hv);}
      trials.sort(function(a,b){return a-b}); resultHistory=trials; updateResults(incident,penetrated,hits,energy,lastDeposit,trials); setStep(1); paused=false;els.pause.textContent='暂停';
      if(Deck.reduced()){particles.forEach(function(p){p.progress=1;});renderParticles();setStep(5);} else startTime=performance.now();
    }
    function updateResults(a,b,c,e,last,trials){ els.incident.textContent=Lec.P.formatNumber(a);els.penetrated.textContent=Lec.P.formatNumber(b);els.hits.textContent=Lec.P.formatNumber(c);els.energy.textContent=Lec.P.formatNumber(e); var s=scenarios[els.scenario.value],unit=((s.simulation||{}).depositionModelUnit||'模型单位');els.energyLabel.textContent='相对沉积 · '+unit; els.rates.textContent='穿透 '+Lec.P.percent(b,a)+' · 命中 '+Lec.P.percent(c,a)+'；单次沉积 '+Lec.P.formatNumber(last)+' '+unit; els.runId.textContent=(seedSuffix?'新种子':'固定种子')+' · 第'+runNo+'轮'; var max=Math.max(1,trials[trials.length-1]);var low=trials[Math.floor(trials.length*.1)]||0, high=trials[Math.floor(trials.length*.9)]||0;els.hitBand.style.left=(low/max*86+7)+'%';els.hitBand.style.right=(93-high/max*86)+'%';els.hitMark.style.left=(c/max*86+7)+'%'; }
    function setStep(n){document.querySelectorAll('#process .step').forEach(function(el,i){el.className='step'+(i<n?' is-past':i===n?' is-current':'');});}
    var startTime=0;
    function renderParticles(){ trailLayer.clear(); particles.forEach(function(p){var t=Math.max(0,Math.min(1,(p.progress-p.delay)/(1-p.delay)));p.g.x=p.x0+(p.x1-p.x0)*t;p.g.y=p.y0+(p.y1-p.y0)*t;p.g.alpha=t<1?1:(p.hit?1:.35);if(t>=1&&p.hit){trailLayer.beginFill(col('--danger'),.8).drawCircle(p.x1,p.y1,7).endFill();}});app.renderer.render(app.stage);}
    Deck.loop(function(now,dt){if(!paused&&startTime){var t=Math.min(1,(now-startTime)/1800);particles.forEach(function(p){p.progress=t;});renderParticles();setStep(Math.min(5,1+Math.floor(t*5)));if(t>=1)startTime=0;}},{still:1800});
    els.scenario.addEventListener('change',function(){configControls();setStep(0);}); els.material.addEventListener('change',function(){configControls();setStep(0);}); els.thickness.addEventListener('input',function(){updateOutputs();setStep(0);});els.duration.addEventListener('input',function(){updateOutputs();setStep(0);});
    els.run.addEventListener('click',simulate);els.pause.addEventListener('click',function(){paused=!paused;els.pause.textContent=paused?'继续':'暂停';});els.newSeed.addEventListener('click',function(){seedSuffix++;runNo=0;simulate();});els.reset.addEventListener('click',function(){seedSuffix=0;runNo=0;els.scenario.value=initialScenario;els.material.value=initialMaterial;configControls();simulate();});
    simulate();
  </script>
</body>
</html>
