<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{height:100%;}
    .p42{height:100%;display:flex;flex-direction:column;gap:var(--sp-3)}
    .relation{display:flex;align-items:center;justify-content:center;gap:var(--sp-4);min-height:42px;padding:var(--sp-2) var(--sp-4);background:var(--surface-strong);border:1px solid var(--line);border-radius:var(--radius-md);font-size:var(--fs-sec);font-weight:700}
    .relation b:first-child{color:var(--cyan)} .relation b:last-child{color:var(--warning)}
    .work{display:flex;gap:var(--sp-3);flex:1 1 0;min-height:0}
    .materials{flex:0 0 190px;display:flex;flex-direction:column;gap:var(--sp-2)}
    .mat{flex:1 1 0;min-height:0;text-align:left;justify-content:flex-start;padding:var(--sp-3);background:var(--surface);border-left:6px solid var(--accent)}
    .mat span{display:block}.mat .label{color:var(--muted);font-weight:500}
    .bench{position:relative;flex:1 1 0;min-width:0;overflow:hidden;border:1px solid var(--line-strong);border-radius:var(--radius-lg);background:var(--surface-soft)}
    .bench canvas{touch-action:none}.bench-title{position:absolute;z-index:3;left:var(--sp-4);top:var(--sp-3);font-size:var(--fs-label);font-weight:700;color:var(--muted);pointer-events:none}
    .wall-label{position:absolute;z-index:3;right:var(--sp-3);top:var(--sp-3);font-size:var(--fs-label);font-weight:700;color:var(--muted);pointer-events:none}
    .compare{flex:0 0 500px;--cmp-cols:minmax(104px,.65fr) repeat(2,minmax(0,1fr));font-size:var(--fs-sec)}
    .compare>.hdr{min-height:42px;font-size:var(--fs-body)}
    .compare>*{padding:var(--sp-2) var(--sp-3)}
    .metric{display:flex;flex-direction:column;justify-content:center;gap:var(--sp-1);font-variant-numeric:tabular-nums}
    .metric strong{font-size:var(--fs-body)}
    .benefit{background:var(--cyan-soft)}.cost{background:var(--warning-soft)}
    .bar{height:8px;background:var(--line);border-radius:var(--radius-sm);overflow:hidden}.bar i{display:block;height:100%;background:var(--cyan)}
    .bottom{display:flex;align-items:center;gap:var(--sp-3);min-height:48px}
    .status{flex:1 1 auto;padding:var(--sp-2) var(--sp-4);border-left:4px solid var(--accent);background:var(--surface);font-size:var(--fs-sec);line-height:var(--lh-copy)}
    .model-note{font-size:var(--fs-label);color:var(--muted)}
    @media(max-width:900px){.work{flex-wrap:wrap}.materials{flex-basis:100%;flex-direction:row}.compare{flex-basis:100%}}
  </style>
</head>
<body data-page="42" data-total="50">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/matter.min.js"></script>
  <script>
    Lec.mount({index:42,kicker:"SHIELDING TRADE-OFF",title:"给火星舱加一道屏蔽，也给任务加一份负担",take:"增加屏蔽能降风险，却同时增加质量、结构与发射代价。"});
    Deck.init({index:42,total:50});
    var main=document.getElementById('main');
    main.innerHTML='<section class="p42"><div class="relation"><b>屏蔽增加 → 穿透通常减少</b><span>同一次选择</span><b>屏蔽增加 → 质量与结构负担增加</b></div><div class="work"><div class="materials min0" aria-label="材料模块"><button class="mat" data-m="water"><span>水</span><span class="label">储量 4 · 模型推测</span></button><button class="mat" data-m="poly"><span>聚乙烯</span><span class="label">储量 4 · 模型推测</span></button><button class="mat" data-m="al"><span>铝</span><span class="label">储量 4 · 模型推测</span></button><button class="mat" data-m="soil"><span>火星土壤</span><span class="label">储量 4 · 模型推测</span></button></div><div class="bench no-pan min0"><div class="bench-title">选材料加入；拖动模块覆盖舱壁</div><div class="wall-label">舱壁</div><canvas class="cv-fill" role="img" aria-label="侧视建造台。模块受重力、碰撞与摩擦影响，只有稳定覆盖舱壁的模块计入屏蔽。"></canvas></div><div class="k-comparison compare min0"><div class="hdr">维度</div><div class="hdr">屏蔽收益</div><div class="hdr">工程代价</div><div class="dim">总体</div><div class="cell metric benefit"><span>穿透比例</span><strong id="trans">—</strong><div class="bar"><i id="transbar"></i></div></div><div class="cell metric cost"><span>新增质量</span><strong id="mass">—</strong></div><div class="rowline"></div><div class="dim">路径</div><div class="cell metric benefit"><span>剂量情景</span><strong id="dose">—</strong></div><div class="cell metric cost"><span>有效厚度</span><strong id="depth">—</strong></div><div class="rowline"></div><div class="dim">薄弱处</div><div class="cell metric benefit"><span>最高穿透位置</span><strong id="weak">未覆盖</strong></div><div class="cell metric cost"><span>堆叠稳定性</span><strong id="stable">等待建造</strong></div><div class="rowline"></div><div class="dim">本局条件</div><div class="cell metric benefit diff"><span>屏蔽目标</span><strong id="shieldok">未达标</strong></div><div class="cell metric cost diff"><span>质量＋厚度</span><strong id="engok">合格</strong></div></div></div><div class="bottom"><button type="button" id="reset">重置建造台</button><div class="status" id="status" aria-live="polite">加入模块，先补齐覆盖缺口，再观察质量与厚度。</div><span class="model-note">简化比较模型</span></div></section>';

    var M=Matter, engine=M.Engine.create(), world=engine.world, cv=main.querySelector('canvas'), bench=main.querySelector('.bench');
    engine.gravity.y=.85;
    var cfg=(Lec.K&&Lec.K.p42ShieldChallenge)||{};
    var mats=(Lec.K&&Lec.K.radiationShieldMaterials)||{};
    var fallback={water:{density:1000,k:.0018},poly:{density:940,k:.0021},al:{density:2700,k:.0007},soil:{density:1500,k:.0011}};
    var colors=['accent','cyan','line-strong','warning'], keys=['water','poly','al','soil'], bodies=[], W=0,H=0,wall;
    function val(o,n,d){var x=o&&o[n];return Number.isFinite(+x)?+x:d}
    function profile(key){var p=(cfg.blockProfiles&&cfg.blockProfiles[key])||{}, m=mats[key]||fallback[key];return {w:val(p,'widthM',.18),h:val(p,'heightM',.28),d:val(p,'depthM',.24),rho:val(m,'densityKgM3',val(m,'density',fallback[key].density)),k:val(m,'attenuation',val(m,'teachingAttenuation',fallback[key].k))}}
    function setup(){W=bench.clientWidth;H=bench.clientHeight;Deck.fit(cv);M.Composite.clear(world,false);bodies=[];M.Composite.add(world,[M.Bodies.rectangle(W/2,H+18,W,36,{isStatic:true}),M.Bodies.rectangle(W-26,H/2,34,H,{isStatic:true})]);wall=W-45}
    function add(key){if(bodies.filter(function(b){return b.plugin.key===key}).length>=4)return;var p=profile(key), idx=keys.indexOf(key), b=M.Bodies.rectangle(95+idx*45,70,70,72,{friction:.72,restitution:.08,plugin:{key:key,p:p,color:colors[idx]}});bodies.push(b);M.Composite.add(world,b);update()}
    function reset(){setup();update()}
    keys.forEach(function(k){main.querySelector('[data-m="'+k+'"]').addEventListener('click',function(){add(k)})});main.querySelector('#reset').addEventListener('click',reset);
    setup();
    var mouse=M.Mouse.create(cv), mc=M.MouseConstraint.create(engine,{mouse:mouse,constraint:{stiffness:.18,render:{visible:false}}});M.Composite.add(world,mc);
    function fmt(n,d){return Lec.P&&Lec.P.formatNumber?Lec.P.formatNumber(n,d):n.toFixed(d||0)}
    function pct(n){var p=Lec.P&&Lec.P.percent?Lec.P.percent(n,1):n*100;return fmt(p,0)+'%'}
    function update(){var active=bodies.filter(function(b){return b.position.x>wall-115&&b.position.x<wall&&b.position.y>65&&b.position.y<H-30&&Math.abs(b.angle)<.22}), mass=0,depth=0,sum=0,moving=false;active.forEach(function(b){var p=b.plugin.p,v=p.w*p.h*p.d;mass+=p.rho*v;depth+=p.w;sum+=p.k*p.rho*p.w;moving=moving||b.speed>val(cfg,'settleLinearVelocityThreshold',.12)||Math.abs(b.angularVelocity)>val(cfg,'settleAngularVelocityThreshold',.03)});var t=Math.exp(-sum), target=val(cfg,'targetMaxTransmissionFraction',.45), maxMass=val(cfg,'maxShieldMassKg',260),maxDepth=val(cfg,'maxShieldDepthM',.7), shield=t<=target,eng=mass<=maxMass&&depth<=maxDepth,stable=active.length>0&&!moving;document.getElementById('trans').textContent=pct(t);document.getElementById('transbar').style.width=Math.max(2,t*100)+'%';document.getElementById('mass').textContent=fmt(mass,0)+' kg';document.getElementById('depth').textContent=fmt(depth,2)+' m';document.getElementById('dose').textContent='基线 × '+fmt(t,2);document.getElementById('weak').textContent=active.length?'覆盖上沿':'未覆盖';document.getElementById('stable').textContent=!active.length?'等待建造':moving?'滑移中':stable?'静止':'支撑不足';document.getElementById('shieldok').textContent=shield?'达标':'未达标';document.getElementById('engok').textContent=eng?'合格':'超出约束';var s=!shield&&eng?'工程约束合格，屏蔽不足。':shield&&!eng?'屏蔽达标，工程约束未达标。':shield&&eng&&stable?'方案可用：当前教学模型的四项条件同时成立。':'调整堆叠，让模块稳定覆盖舱壁。';document.getElementById('status').textContent=s}
    function draw(){var ctx=cv.getContext('2d'),r=cv.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle=Deck.rgb('line-strong');ctx.fillRect(W-43,0,34,H);ctx.strokeStyle=Deck.rgb('line');ctx.lineWidth=2;ctx.setLineDash([7,6]);ctx.strokeRect(W-125,46,80,H-78);ctx.setLineDash([]);bodies.forEach(function(b){var v=b.vertices;ctx.beginPath();ctx.moveTo(v[0].x,v[0].y);for(var i=1;i<v.length;i++)ctx.lineTo(v[i].x,v[i].y);ctx.closePath();ctx.fillStyle=Deck.rgb(b.plugin.color);ctx.fill();ctx.strokeStyle=Deck.rgb('text');ctx.stroke()})}
    Deck.loop(function(t,dt){M.Engine.update(engine,Math.min(33,dt||16.7));draw();update()},{still:1});
    Deck.onResize(function(){setup();update()});
  </script>
</body>
</html>
