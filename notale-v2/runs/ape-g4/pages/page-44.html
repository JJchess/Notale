<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage .k-generalization{height:100%;grid-template-columns:minmax(230px,.62fr) 42px minmax(0,2.7fr)}
    #stage .claim{display:flex;flex-direction:column;gap:var(--sp-5);justify-content:center}
    #stage .claim-chain{font-size:var(--fs-h2);line-height:var(--lh-roomy);color:var(--accent-strong)}
    #stage .supports{gap:var(--sp-2)}
    #stage .support{padding:var(--sp-2) var(--sp-4)}
    #stage .support.task{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
    #stage .task-facts{display:flex;gap:var(--sp-4);font-size:var(--fs-label);font-weight:700}
    #stage .workspace{display:grid;grid-template-columns:minmax(260px,.85fr) minmax(245px,.78fr) minmax(0,1.25fr);gap:var(--sp-3);height:450px;padding:var(--sp-3);background:var(--surface)}
    #stage .workspace>*{min-width:0;min-height:0}
    #stage .ledger-section{display:flex;flex-direction:column;gap:var(--sp-2)}
    #stage .ledger-title{font-size:var(--fs-h2);line-height:1.3;font-weight:720}
    #stage .ctl{padding:var(--sp-2) var(--sp-3);gap:var(--sp-2)}
    #stage .ctl label{width:44px;color:var(--text)}
    #stage .mass-out{width:68px;text-align:right;font-size:var(--fs-label);font-variant-numeric:tabular-nums;font-weight:700}
    #stage select{width:100%;font-size:var(--fs-label)}
    #stage .settle{border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;background:var(--surface)}
    #stage .settle-row{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--line);font-size:var(--fs-label)}
    #stage .settle-row:last-child{border-bottom:0}
    #stage .settle-row strong{font-size:var(--fs-body);font-variant-numeric:tabular-nums}
    #stage .settle-row.key{background:var(--accent-soft)}
    #stage .chart-wrap{position:relative;border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden}
    #stage #chart{width:100%;height:100%}
    #stage .formula{display:flex;justify-content:space-between;gap:var(--sp-4)}
    #stage .status{font-weight:760}
    #stage .support.outcome{display:flex;justify-content:space-between;gap:var(--sp-4);align-items:center}
    #stage .delta{font-variant-numeric:tabular-nums;font-weight:700}
  </style>
</head>
<body data-page="44" data-total="50">
  <div id="stage"><main id="main"></main></div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script>
    Lec.mount({
      index: 44,
      kicker: "MASS LEDGER",
      title: "每一份生存资源，都要推进能力买单",
      take: "每增加一份水、屏蔽或备件，都要由推进能力和任务目标买单。"
    });
    Deck.init({ index: 44, total: 50 });

    var stage = document.getElementById("main");
    stage.innerHTML = '<section class="k-generalization full">'+
      '<div class="claim"><div>“多带一点”会重算整本账</div><div class="claim-chain">生存资源 ↑<br>末端质量 ↑<br>推进剂 ↑<br>初始质量 ↑</div></div><div class="trunk" aria-hidden="true"></div>'+
      '<div class="supports">'+
        '<div class="support task"><strong>任务门槛</strong><select id="preset" aria-label="任务、回收与推进情景"><option value="0">近地任务 · 高回收 · 高效推进</option><option value="1">月球往返 · 中回收 · 常规推进</option><option value="2">深空航程 · 低回收 · 常规推进</option><option value="reset">恢复情景基线</option></select><div class="task-facts"><span id="duration"></span><span id="crew"></span><span id="dv"></span><span id="isp"></span></div></div>'+
        '<div class="support workspace">'+
          '<div class="ledger-section"><div class="ledger-title">生存资源</div><div class="ctl"><label for="water">水</label><input id="water" type="range" min="0" max="2000" step="20"><output class="mass-out" id="waterOut"></output></div><div class="ctl"><label for="shield">屏蔽</label><input id="shield" type="range" min="0" max="3000" step="50"><output class="mass-out" id="shieldOut"></output></div><div class="ctl"><label for="spares">备件</label><input id="spares" type="range" min="0" max="1500" step="25"><output class="mass-out" id="sparesOut"></output></div><div class="note">用途不同，装上火箭后都进入末端质量。</div></div>'+
          '<div class="ledger-section"><div class="ledger-title">推进结算</div><div class="settle"><div class="settle-row"><span>结构与固定设备</span><strong id="fixed"></strong></div><div class="settle-row"><span>其他任务载荷</span><strong id="payload"></strong></div><div class="settle-row key"><span>末端质量</span><strong id="finalMass"></strong></div><div class="settle-row"><span>质量比</span><strong id="ratio"></strong></div><div class="settle-row"><span>推进剂分数</span><strong id="fraction"></strong></div><div class="settle-row key"><span>推进剂质量</span><strong id="prop"></strong></div><div class="settle-row"><span>初始质量</span><strong id="initial"></strong></div><div class="settle-row"><span>预算余量</span><strong id="margin"></strong></div></div></div>'+
          '<div class="chart-wrap"><div id="chart" role="img" aria-label="基线方案与当前方案的质量堆叠图"></div></div>'+
        '</div>'+
        '<div class="support formula"><span>推进剂不是固定附加项：末端质量改变后，按当前 Δv 与比冲重新计算。</span><span>单级等效教学账本</span></div>'+
        '<div class="support outcome"><span class="status" id="status" aria-live="polite"></span><span class="delta" id="delta"></span></div>'+
      '</div></section>';

    var scenarios = [
      {name:"近地任务", days:1, crew:3, dv:Math.round(Lec.K.spacecraft.issTypicalSpeed), isp:450, fixed:5200, payload:900, water:180, shield:450, spares:220, cap:23000},
      {name:"月球往返", days:Lec.K.spacecraft.apolloTypicalTransitDays*2, crew:4, dv:Math.round(Lec.K.earth.escapeVelocity*.82), isp:380, fixed:7600, payload:1500, water:520, shield:900, spares:480, cap:62000},
      {name:"深空航程", days:30, crew:4, dv:Math.round(Lec.K.earth.escapeVelocity), isp:380, fixed:9800, payload:2200, water:1200, shield:1800, spares:900, cap:145000}
    ];
    var preset=document.getElementById("preset"), sliders=["water","shield","spares"].map(function(id){return document.getElementById(id)}), chart=echarts.init(document.getElementById("chart"),null,{renderer:"svg"}), baseline, currentScenario=0;
    function mass(v){return Math.abs(v)>=1000?Lec.P.formatNumber(v/1000,1)+" t":Lec.P.formatNumber(v,0)+" kg"}
    function state(){
      var s=scenarios[currentScenario], w=+sliders[0].value, sh=+sliders[1].value, sp=+sliders[2].value, water=Lec.P.clamp(Lec.P.finite(w)?w:0,0,2000), shield=Lec.P.clamp(Lec.P.finite(sh)?sh:0,0,3000), spares=Lec.P.clamp(Lec.P.finite(sp)?sp:0,0,1500);
      var finalMass=s.fixed+s.payload+water+shield+spares, ratio=Lec.P.rocketMassRatio(s.dv,s.isp), fraction=Lec.P.propellantFraction(s.dv,s.isp), prop=finalMass*(ratio-1), initial=finalMass+prop, check=Lec.P.rocketDeltaV(s.isp,initial,finalMass);
      return {water:water,shield:shield,spares:spares,finalMass:finalMass,ratio:ratio,fraction:fraction,prop:prop,initial:initial,margin:s.cap-initial,check:check};
    }
    function setScenario(i){currentScenario=i;var s=scenarios[i];sliders[0].value=s.water;sliders[1].value=s.shield;sliders[2].value=s.spares;baseline=state();render()}
    function render(){
      var s=scenarios[currentScenario], x=state();
      document.getElementById("duration").textContent=Lec.P.formatDuration(Lec.P.daysToSeconds(s.days)); document.getElementById("crew").textContent=s.crew+" 人"; document.getElementById("dv").textContent=Lec.P.formatNumber(s.dv/1000,1)+" km/s"; document.getElementById("isp").textContent=s.isp+" s";
      ["water","shield","spares"].forEach(function(k){document.getElementById(k+"Out").textContent=mass(x[k])});
      document.getElementById("fixed").textContent=mass(s.fixed);document.getElementById("payload").textContent=mass(s.payload);document.getElementById("finalMass").textContent=mass(x.finalMass);document.getElementById("ratio").textContent=Lec.P.formatNumber(x.ratio,2);document.getElementById("fraction").textContent=Lec.P.percent(x.fraction,1)+"%";document.getElementById("prop").textContent=mass(x.prop);document.getElementById("initial").textContent=mass(x.initial);document.getElementById("margin").textContent=mass(x.margin);
      var ok=Math.abs(x.check-s.dv)<1;var tight=x.margin>=0&&x.margin<s.cap*.1;var status=document.getElementById("status");status.className="status "+(x.margin<0?"danger":tight?"warn":"good");status.textContent=!ok?"输入错误":x.margin<0?"预算超出":tight?"预算吃紧":"账本可结算";
      document.getElementById("delta").textContent="资源 "+mass((x.water+x.shield+x.spares)-(baseline.water+baseline.shield+baseline.spares))+" · 推进剂 "+mass(x.prop-baseline.prop)+" · 初始质量 "+mass(x.initial-baseline.initial);
      var sets=[baseline,x]; chart.setOption({animationDuration:180,textStyle:{fontSize:16},grid:{left:58,right:18,top:38,bottom:42},legend:{top:4,textStyle:{fontSize:14},data:["固定设备","生存资源","任务载荷","推进剂"]},xAxis:{type:"category",data:["基线方案","当前方案"],axisLabel:{fontSize:14}},yAxis:{type:"value",name:"质量 / kg",nameTextStyle:{fontSize:14},axisLabel:{fontSize:14}},series:[{name:"固定设备",type:"bar",stack:"m",data:sets.map(function(){return s.fixed})},{name:"生存资源",type:"bar",stack:"m",data:sets.map(function(v){return v.water+v.shield+v.spares})},{name:"任务载荷",type:"bar",stack:"m",data:sets.map(function(){return s.payload})},{name:"推进剂",type:"bar",stack:"m",data:sets.map(function(v){return v.prop}),markLine:{symbol:"none",label:{fontSize:14,formatter:"预算上限"},data:[{yAxis:s.cap}]}}]});
    }
    sliders.forEach(function(el){el.addEventListener("input",render)});
    preset.addEventListener("change",function(){if(this.value==="reset"){this.value=String(currentScenario);setScenario(currentScenario)}else setScenario(+this.value)});
    setScenario(0); Deck.onResize(function(){chart.resize()});
  </script>
</body>
</html>
