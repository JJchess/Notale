<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .clock-plate{height:100%;display:flex;flex-direction:column;gap:var(--sp-3);min-width:0}
    .plate-lead{display:flex;align-items:center;gap:var(--sp-4);min-height:48px;padding:0 var(--sp-4);border-left:4px solid var(--accent);background:var(--surface-soft)}
    .plate-lead strong{font-size:var(--fs-lead);line-height:var(--lh-copy)}
    .plate-lead span{font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--muted)}
    .decision-flow{padding:var(--sp-3) 0;min-height:176px}
    .decision-flow>.step{padding:var(--sp-4);display:flex;flex-direction:column;justify-content:center;gap:var(--sp-2)}
    .decision-flow>.step:nth-of-type(1){flex:.72 1 0}
    .decision-flow>.step:nth-of-type(2){flex:1.28 1 0}
    .decision-flow>.step:nth-of-type(3){flex:1.05 1 0}
    .decision-flow>.step:nth-of-type(4){flex:1.18 1 0}
    .step-code{font-size:var(--fs-label);line-height:1.4;font-weight:760;color:var(--accent-strong);letter-spacing:.04em}
    .step-title{font-size:var(--fs-h2);line-height:1.3;font-weight:740}
    .step-copy{font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--muted)}
    .branch-zone{position:relative;flex:1 1 auto;min-height:0;padding-top:68px}
    .branch-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    .branch-lines path{fill:none;stroke:var(--line-strong);stroke-width:3}
    .branch-lines .trunk{stroke:var(--accent);stroke-width:5}
    .branch-lines circle{fill:var(--surface);stroke:var(--accent);stroke-width:3}
    .branch-label{position:absolute;top:8px;left:50%;transform:translateX(-50%);padding:var(--sp-2) var(--sp-4);font-size:var(--fs-label);font-weight:720;color:var(--accent-strong);background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--radius-sm)}
    .clock-row{position:relative;z-index:1;display:flex;align-items:stretch;gap:var(--sp-7);height:210px;padding:0 var(--sp-6)}
    .clock{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-4);background:var(--surface);border:2px solid var(--line-strong);border-radius:var(--radius-md);box-shadow:var(--shadow-soft)}
    .dial{position:relative;flex:0 0 112px;height:112px;border:3px solid var(--accent);border-radius:50%;background:var(--surface-soft);box-sizing:border-box}
    .dial:before,.dial:after{content:"";position:absolute;left:50%;bottom:50%;width:3px;transform-origin:50% 100%;border-radius:999px;background:var(--accent-strong)}
    .dial:before{height:34px;transform:translateX(-50%) rotate(35deg)}
    .dial:after{height:24px;transform:translateX(-50%) rotate(122deg)}
    .dial-mark{position:absolute;inset:10px;border-top:2px solid var(--line-strong);border-bottom:2px solid var(--line-strong);border-radius:50%}
    .clock-copy{min-width:0}
    .clock-scale{font-size:var(--fs-label);line-height:1.4;color:var(--muted);font-weight:700}
    .clock h2{margin-top:var(--sp-1)}
    .clock p{margin-top:var(--sp-2);font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--muted)}
    .clock:nth-child(2) .dial:before{transform:translateX(-50%) rotate(95deg)}
    .clock:nth-child(3) .dial:before{transform:translateX(-50%) rotate(155deg)}
  </style>
</head>
<body data-page="45" data-total="50">
  <div id="stage">
    <main id="main">
      <section class="clock-plate" aria-label="将身体变化归入三只时钟的判断流程">
        <div class="plate-lead">
          <strong>身体看起来变了。</strong>
          <span>先判断变化发生在哪个层级；时间长短只是线索。</span>
        </div>

        <div class="k-process decision-flow" aria-label="从观察变化到检查遗传的四步流程">
          <div class="axis" aria-hidden="true"></div>
          <article class="step is-past min0">
            <div class="step-code">01 / 观察</div>
            <div class="step-title">看到变化</div>
          </article>
          <div class="arw" aria-hidden="true"></div>
          <article class="step min0">
            <div class="step-code">02 / 层级</div>
            <div class="step-title">发生在谁身上？</div>
            <div class="step-copy">同一个体的状态或经历，还是群体组成？</div>
          </article>
          <div class="arw" aria-hidden="true"></div>
          <article class="step min0">
            <div class="step-code">03 / 尺度</div>
            <div class="step-title">何时出现？</div>
            <div class="step-copy">短期、生命历程，还是跨越许多代？</div>
          </article>
          <div class="arw" aria-hidden="true"></div>
          <article class="step is-current min0">
            <div class="step-code">04 / 遗传</div>
            <div class="step-title">能否跨代累积？</div>
            <div class="step-copy">改变是否通过可遗传差异进入下一代？</div>
          </article>
        </div>

        <div class="branch-zone">
          <div class="branch-label">05 / 归入不同层级</div>
          <svg class="branch-lines" viewBox="0 0 1408 278" preserveAspectRatio="none" aria-hidden="true">
            <path class="trunk" d="M704 0 V48"/>
            <path d="M704 48 H245 V82"/>
            <path d="M704 48 V82"/>
            <path d="M704 48 H1163 V82"/>
            <circle cx="704" cy="48" r="8"/>
          </svg>
          <div class="clock-row">
            <article class="clock min0">
              <div class="dial" aria-hidden="true"><span class="dial-mark"></span></div>
              <div class="clock-copy">
                <div class="clock-scale">短时｜同一个体</div>
                <h2>短时钟 · 生理调节</h2>
                <p>环境改变，身体状态随之调整。</p>
              </div>
            </article>
            <article class="clock min0">
              <div class="dial" aria-hidden="true"><span class="dial-mark"></span></div>
              <div class="clock-copy">
                <div class="clock-scale">生命历程｜同一个体</div>
                <h2>一生钟 · 个体改变</h2>
                <p>发育、学习、训练或长期经历留下改变。</p>
              </div>
            </article>
            <article class="clock min0">
              <div class="dial" aria-hidden="true"><span class="dial-mark"></span></div>
              <div class="clock-copy">
                <div class="clock-scale">跨世代｜群体</div>
                <h2>多代钟 · 生物演化</h2>
                <p>可遗传差异在群体中跨世代改变比例。</p>
              </div>
            </article>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 45,
      kicker: "THREE CLOCKS",
      title: "先把三只时钟分开",
      take: "最后一章必须先分清：几天内的调节、一生中的改变与多代演化。"
    });
    Deck.init({ index: 45, total: 50 });
  </script>
</body>
</html>
