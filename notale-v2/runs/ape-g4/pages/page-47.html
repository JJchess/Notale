<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .p47{height:100%;display:flex;flex-direction:column;gap:var(--sp-3)}
    .p47 .k-process{padding:0;gap:var(--sp-2);flex:0 0 88px}
    .p47 .k-process>.step{padding:var(--sp-2);display:flex;align-items:center;justify-content:center;text-align:center;font-size:var(--fs-label);line-height:1.4;font-weight:700}
    .p47 .k-process>.arw{flex-basis:22px}
    .sim{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft)}
    #pixiHost{position:absolute;inset:0 250px 0 0;overflow:hidden}
    #pixiHost canvas{display:block;width:100%;height:100%}
    .sim-label{position:absolute;z-index:2;left:var(--sp-4);top:var(--sp-3);font-size:var(--fs-label);color:var(--muted);pointer-events:none}
    .legend{position:absolute;z-index:2;left:var(--sp-4);bottom:var(--sp-3);display:flex;gap:var(--sp-4);font-size:var(--fs-label);color:var(--muted);pointer-events:none}
    .key{display:inline-flex;align-items:center;gap:var(--sp-2)}
    .sw{width:24px;height:4px;background:var(--line-strong)}
    .sw.now{background:var(--accent)}
    .status{position:absolute;z-index:3;right:var(--sp-3);top:var(--sp-3);bottom:var(--sp-3);width:214px;padding:var(--sp-3);background:var(--surface-soft);border:1px solid var(--line);border-radius:var(--radius-md);display:flex;flex-direction:column;gap:var(--sp-2)}
    .status h2{font-size:var(--fs-h2)}
    .metric{display:flex;justify-content:space-between;gap:var(--sp-2);font-size:var(--fs-label)}
    .metric strong{font-variant-numeric:tabular-nums;color:var(--accent-strong)}
    .verdict{margin-top:auto;padding:var(--sp-2);border-left:4px solid var(--accent);background:var(--accent-soft);font-size:var(--fs-sec);line-height:var(--lh-copy)}
    .bottom{flex:0 0 104px;display:flex;gap:var(--sp-3)}
    .controls{flex:1 1 auto;display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3)}
    .controls .ctl{padding:var(--sp-2) var(--sp-3);flex:1 1 auto}
    .controls select{flex:1 1 auto}
    .task{flex:0 0 420px;padding:var(--sp-3);font-size:var(--fs-sec);line-height:var(--lh-copy)}
    .task strong{color:var(--accent-strong)}
  </style>
</head>
<body data-page="47" data-total="50">
  <div id="stage"><main id="main"></main></div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/lib/pixi.min.js"></script>
  <script>
    Lec.mount({
      index: 47,
      kicker: "MANY GENERATIONS",
      title: "什么条件下，火星群体才会真的演化？",
      take: "只有可遗传差异持续影响繁殖，并经历许多代，群体才会发生演化改变。"
    });
    Deck.init({ index: 47, total: 50 });

    var main = document.getElementById("main");
    main.innerHTML = '<div class="p47">'+
      '<div class="k-process" aria-label="跨代演化的六步过程"><div class="axis"></div>'+
      '<div class="step is-current">1 建立群体</div><div class="arw"></div><div class="step">2 可遗传差异</div><div class="arw"></div><div class="step">3 环境条件</div><div class="arw"></div><div class="step">4 繁殖差异</div><div class="arw"></div><div class="step">5 继承重组</div><div class="arw"></div><div class="step">6 比较分布</div></div>'+
      '<section class="sim" aria-label="抽象性状 A 的多代群体模型"><div class="sim-label">横向位置＝性状 A（假想居住舱中的抽象性状）</div><div id="pixiHost" aria-hidden="true"></div>'+
      '<div class="legend"><span class="key"><i class="sw"></i>第 0 代基线</span><span class="key"><i class="sw now"></i>当前代</span></div>'+
      '<aside class="status panel"><h2>群体状态</h2><div class="metric"><span>当前代</span><strong id="gen">0</strong></div><div class="metric"><span>群体规模</span><strong id="pop">—</strong></div><div class="metric"><span>中位变化</span><strong id="delta">—</strong></div><div class="metric"><span>种子</span><strong id="seed">01</strong></div><div class="metric"><span>现实外推</span><strong id="evidence">模型推测</strong></div><div class="verdict" id="verdict" aria-live="polite">先运行三组对照，比较方向是否稳定。</div></aside></section>'+
      '<div class="bottom"><div class="controls panel"><div class="ctl"><label for="caseSel">对照条件</label><select id="caseSel"><option value="H0S0">有遗传／无繁殖差异</option><option value="H0S1">无遗传／有繁殖差异</option><option value="H1S1">有遗传／有繁殖差异</option></select></div><button type="button" class="primary" id="run">运行到终点</button><button type="button" id="seedBtn">换种子</button><button type="button" id="reset">重置</button></div>'+
      '<div class="task note"><span><strong>任务：</strong>依次运行三组对照。环境只改变差异被传下去的机会；有限群体仍会随机波动。突变率是抽象模型参数。</span></div></div></div>';

    var K=Lec.K, P=Lec.P;
    function finite(v,d){ var n=Number(v); if(P&&P.finite){ try{return P.finite(n,d);}catch(e){} } return Number.isFinite(n)?n:d; }
    function clamp(v,a,b){ if(P&&P.clamp){ try{return P.clamp(v,a,b);}catch(e){} } return Math.max(a,Math.min(b,v)); }
    function nums(o,out){out=out||[]; if(typeof o==='number')out.push(o); else if(o&&typeof o==='object')Object.keys(o).forEach(function(k){nums(o[k],out)}); return out;}
    var initialNums=nums(K.p47TraitInitialDistribution), inhNums=nums(K.p47InheritanceModel), pressureNums=nums(K.p47SelectionPressureScenarios);
    var mean=finite(initialNums[0],0.5), sd=Math.abs(finite(initialNums[1],0.14)); if(mean<0||mean>1)mean=0.5; if(sd<=0||sd>0.5)sd=0.14;
    var mutation=clamp(finite(K.mutationRateTeaching,0.01),0,1);
    var noise=Math.abs(finite(inhNums[0],0.04)); if(noise>0.4)noise=0.04;
    var strength=Math.abs(finite(pressureNums[pressureNums.length-1],0.8)); if(strength>4)strength=0.8;
    var population=finite(K.populationSimulationSize,500); if(typeof K.populationSimulationSize==='object'){var pn=nums(K.populationSimulationSize);population=pn.indexOf(500)>=0?500:finite(pn[0],500);} population=Math.max(50,Math.round(population));
    var displayN=Math.min(population,500), target=100;
    var baseSeed=String(K.populationSimulationSeed||'population')+'|p47-mars';
    var state={generation:0,seedNo:1,traits:[],base:[],done:{H0S0:false,H0S1:false,H1S1:false},running:false,step:0};
    var rng;
    function gaussian(){var u=Math.max(rng(),1e-9),v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
    function makeInitial(){rng=new Math.seedrandom(baseSeed+'|'+state.seedNo);state.traits=[];for(var i=0;i<displayN;i++)state.traits.push(clamp(mean+gaussian()*sd,0,1));state.base=state.traits.slice();state.generation=0;state.step=0;}
    function med(a){var b=a.slice().sort(function(x,y){return x-y});return b[Math.floor(b.length/2)]}
    function generation(mode){var hered=mode!=='H0S1', select=mode!=='H0S0', old=state.traits, next=[];for(var i=0;i<old.length;i++){var parent;if(select){var tries=0;do{parent=old[Math.floor(rng()*old.length)];tries++;}while(rng()>clamp(0.15+parent*strength,0.05,1)&&tries<12);}else parent=old[Math.floor(rng()*old.length)];var child=hered?parent:mean+gaussian()*sd;if(hered)child+=gaussian()*noise;if(rng()<mutation)child+=gaussian()*noise*2;next.push(clamp(child,0,1));}state.traits=next;state.generation++;}

    var host=document.getElementById('pixiHost');
    var app=new PIXI.Application({width:host.clientWidth,height:host.clientHeight,backgroundAlpha:0,antialias:true,resolution:1});host.appendChild(app.view);
    var g=new PIXI.Graphics();app.stage.addChild(g);
    function col(name){var v=Deck.token(name)||Deck.rgb(name);if(typeof v==='number')return v;if(Array.isArray(v))return (v[0]<<16)|(v[1]<<8)|v[2];v=String(v).trim();if(v.charAt(0)==='#')return parseInt(v.slice(1),16);var m=v.match(/\d+/g);return m?((+m[0]<<16)|(+m[1]<<8)|+m[2]):0;}
    function hist(arr,bins){var h=new Array(bins).fill(0);arr.forEach(function(x){h[Math.min(bins-1,Math.floor(x*bins))]++});return h;}
    function draw(){var w=app.renderer.width,h=app.renderer.height,bins=28,base=hist(state.base,bins),now=hist(state.traits,bins),max=Math.max.apply(null,base.concat(now)),left=34,right=w-28,top=64,mid=h*0.52,bottom=h-42;g.clear();g.lineStyle(1,col('--line'),1);g.moveTo(left,mid);g.lineTo(right,mid);for(var i=0;i<Math.min(state.traits.length,260);i++){var x=left+state.traits[i]*(right-left),y=top+(i%9)*13+(rng?0:0);g.beginFill(col('--accent'),0.32);g.drawCircle(x,y,3);g.endFill();}
      function curve(vals,color,alpha,yBase,amp){g.lineStyle(3,color,alpha);for(var j=0;j<bins;j++){var x2=left+j/(bins-1)*(right-left),y2=yBase-vals[j]/max*amp;if(j===0)g.moveTo(x2,y2);else g.lineTo(x2,y2);}}
      curve(base,col('--line-strong'),1,bottom,(bottom-mid)*0.8);curve(now,col('--accent'),1,bottom,(bottom-mid)*0.8);var mx=left+med(state.traits)*(right-left);g.lineStyle(2,col('--accent-strong'),0.8);g.moveTo(mx,mid+8);g.lineTo(mx,bottom);updateText();}
    function fmt(n){try{return P.formatNumber(n,{maximumFractionDigits:2})}catch(e){return n.toFixed(2)}}
    function updateText(){var d=med(state.traits)-med(state.base);document.getElementById('gen').textContent=fmt(state.generation);document.getElementById('pop').textContent=fmt(population);document.getElementById('delta').textContent=(d>=0?'+':'')+fmt(d);document.getElementById('seed').textContent=fmt(state.seedNo);document.querySelector('.sim').setAttribute('aria-label','抽象性状 A 的多代群体模型。当前第'+state.generation+'代，中位性状相对第0代变化'+fmt(d)+'模型单位。');}
    function setStep(n){state.step=n;document.querySelectorAll('.k-process .step').forEach(function(el,i){el.classList.toggle('is-current',i===n);el.classList.toggle('is-past',i<n)});}
    function reset(){state.running=false;makeInitial();setStep(0);document.getElementById('verdict').textContent='先运行三组对照，比较方向是否稳定。';draw();}
    function run(){if(state.running)return;state.running=true;var mode=document.getElementById('caseSel').value,chunk=Deck.reduced()?target:2;function tick(){if(!state.running)return;for(var i=0;i<chunk&&state.generation<target;i++)generation(mode);setStep(Math.min(5,Math.floor(state.generation/(target/6))));draw();if(state.generation>=target){state.running=false;state.done[mode]=true;setStep(5);var count=Object.keys(state.done).filter(function(k){return state.done[k]}).length;document.getElementById('verdict').textContent=count===3?'必要连接已点亮：跨代留下更多，才形成持续改变。':'已完成 '+count+'／3 组对照。换一组再运行。';return;}setTimeout(tick,Deck.reduced()?0:35);}tick();}
    document.getElementById('run').addEventListener('click',function(){if(state.generation)makeInitial();run()});
    document.getElementById('seedBtn').addEventListener('click',function(){state.seedNo++;reset()});
    document.getElementById('reset').addEventListener('click',function(){state.seedNo=1;state.done={H0S0:false,H0S1:false,H1S1:false};reset()});
    Deck.onResize(function(){app.renderer.resize(host.clientWidth,host.clientHeight);draw()});
    reset();
  </script>
</body>
</html>
