<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #hearing{height:100%;display:flex;flex-direction:column;gap:var(--sp-3)}
    .casebar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);padding:var(--sp-3) var(--sp-5);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md)}
    .casebar strong{font-size:var(--fs-lead)}
    .casebar span{font-size:var(--fs-sec);color:var(--muted)}
    .argument{flex:1 1 auto;min-height:0;grid-template-columns:minmax(0,.72fr) 42px minmax(0,1.55fr)}
    .argument>.claim{padding:var(--sp-4) var(--sp-5)}
    .claim small{display:block;margin-top:var(--sp-3);font-size:var(--fs-sec);line-height:var(--lh-copy);font-weight:500;color:var(--muted)}
    .board{position:relative;min-height:0;height:100%;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-soft)}
    #konva{position:absolute;inset:0}
    .chain{position:absolute;inset:var(--sp-4);display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
    .chain-row{display:flex;align-items:center;gap:var(--sp-2)}
    .node{flex:1 1 0;min-width:0;padding:var(--sp-2) var(--sp-3);background:var(--surface);border:2px solid var(--line-strong);border-radius:var(--radius-sm);font-size:var(--fs-sec);line-height:var(--lh-copy);font-weight:700;text-align:center}
    .node.on{border-color:var(--success);background:var(--success-soft);color:var(--success)}
    .arrow{font-size:var(--fs-h2);font-weight:800;color:var(--line-strong)}
    .arrow.on{color:var(--success)}
    .seats{display:flex;gap:var(--sp-3)}
    .seat{flex:1 1 0;min-width:0;padding:var(--sp-3);border:1px dashed var(--line-strong);border-radius:var(--radius-sm);background:var(--surface)}
    .seat b{display:block;font-size:var(--fs-label);margin-bottom:var(--sp-1)}
    .seat span{font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--muted)}
    .controls{display:flex;align-items:stretch;gap:var(--sp-3)}
    .controls .ctl{padding:var(--sp-2) var(--sp-3)}
    .controls .wide{flex:1 1 0}.controls select{flex:1 1 auto}
    #submit{min-width:112px;font-size:var(--fs-sec)}.feedback{min-height:48px;flex:1 1 0}
    .feedback.good-state{background:var(--success-soft);border-left-color:var(--success);color:var(--success)}
    .feedback.warn-state{background:var(--warning-soft);border-left-color:var(--warning);color:var(--warning)}
  </style>
</head>
<body data-page="49" data-total="50">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/konva.min.js"></script>
  <script>
    Lec.mount({
      index: 49,
      kicker: "SPECIES HEARING",
      title: "太空人会成为另一物种吗？先审查基因交流",
      take: "隔离时间、基因交流与繁殖分化比外形差异更能决定是否形成新物种。"
    });
    Deck.init({ index: 49, total: 50 });

    var stage = document.getElementById("stage");
    var main = document.getElementById("main");
    var gensRaw = Lec.K.speciationGenerationScenarios;
    function numericLeaves(value, out){
      out=out||[];
      if(typeof value==='number' && Number.isFinite(value)) out.push(value);
      else if(Array.isArray(value)) value.forEach(function(v){numericLeaves(v,out);});
      else if(value && typeof value==='object') Object.keys(value).forEach(function(k){numericLeaves(value[k],out);});
      else if(typeof value==='string' && /^\s*\d+(?:\.\d+)?\s*$/.test(value)) out.push(Number(value));
      return out;
    }
    var generationValues=numericLeaves(gensRaw);
    var generation=generationValues[Math.min(1,generationValues.length-1)];
    var fmt=Number.isFinite(generation)?Lec.P.formatNumber(generation):'多代探索';
    var labels = Lec.K.evidenceLabels;
    var modelLabel = Array.isArray(labels) ? labels[labels.length - 1] : ((labels && (labels.model || labels.speculative)) || "模型推测");

    main.innerHTML = '<section id="hearing" aria-label="太空人分物种听证会">'+
      '<div class="casebar"><strong>案情：封闭定居群体已延续 '+fmt+' 代</strong><span>证据强度：'+modelLabel+'；探索档位不是预测期限</span></div>'+
      '<div class="k-generalization argument min0">'+
        '<div class="claim">审查繁殖关系，而不是先看长相<small>长期隔离只是累积机会；若基因交流持续，或尚无繁殖分化，结论就必须保持开放。</small></div><div class="trunk" aria-hidden="true"></div>'+
        '<div class="supports min0"><div class="support board"><div id="konva" aria-hidden="true"></div><div class="chain">'+
          '<div class="chain-row"><div class="node" data-node="0">长期隔离</div><div class="arrow" data-arrow="0">→</div><div class="node" data-node="1">基因交流持续降低</div><div class="arrow" data-arrow="1">→</div><div class="node" data-node="2">繁殖分化累积</div><div class="arrow" data-arrow="2">→</div><div class="node" data-node="3">更支持物种形成</div></div>'+
          '<div class="seats"><div class="seat"><b>关键证据席</b><span id="keySeat">尚未归入证据</span></div><div class="seat"><b>旁证席</b><span id="sideSeat">尚未归入证据</span></div></div>'+
        '</div></div></div></div>'+
      '<div class="controls">'+
        '<div class="ctl wide"><label for="evidence">证据卡</label><select id="evidence"><option value="time">长期隔离</option><option value="flow">仅有低频基因交流</option><option value="repro">出现差异，但仍可交流</option><option value="looks">骨骼更纤细</option></select></div>'+
        '<div class="ctl"><label for="seatPick">归入</label><select id="seatPick"><option value="key">关键证据</option><option value="side">旁证</option></select></div>'+
        '<div class="ctl wide"><label for="verdict">裁决</label><select id="verdict"><option value="stable">仍有稳定基因交流</option><option value="open">证据不足，保持开放</option><option value="forming">支持繁殖分化正在形成</option></select></div>'+
        '<button id="submit" type="button" class="primary">提交裁决</button></div>'+
      '<div id="feedback" class="note feedback" aria-live="polite">依次选择四张证据卡的席位，再提交裁决。当前案情只支持谨慎判断。</div></section>';

    var evidence = document.getElementById('evidence');
    var seatPick = document.getElementById('seatPick');
    var verdict = document.getElementById('verdict');
    var submit = document.getElementById('submit');
    var feedback = document.getElementById('feedback');
    var assigned = {};
    var names = {time:'长期隔离',flow:'仅有低频基因交流',repro:'出现差异，但仍可交流',looks:'骨骼更纤细'};
    var state = {complete:false, assigned:assigned, verdict:'stable'};

    var ks = new Konva.Stage({container:'konva',width:800,height:240});
    var layer = new Konva.Layer(); ks.add(layer);
    var links=[];
    [0,1,2].forEach(function(i){var line=new Konva.Line({points:[85+i*210,54,225+i*210,54],stroke:Deck.rgb('--line-strong'),strokeWidth:5,lineCap:'round',dash:[12,10]});links.push(line);layer.add(line);});
    layer.draw();
    function resizeKonva(){var el=document.getElementById('konva');ks.width(el.clientWidth||800);ks.height(el.clientHeight||240);var sx=ks.width()/800;ks.scale({x:sx,y:sx});layer.draw();}
    Deck.onResize(resizeKonva); resizeKonva();

    function renderSeats(){
      var key=[],side=[]; Object.keys(assigned).forEach(function(k){(assigned[k]==='key'?key:side).push(names[k]);});
      document.getElementById('keySeat').textContent=key.length?key.join('、'):'尚未归入证据';
      document.getElementById('sideSeat').textContent=side.length?side.join('、'):'尚未归入证据';
    }
    function assign(){assigned[evidence.value]=seatPick.value;renderSeats();feedback.className='note feedback';feedback.textContent='已将“'+names[evidence.value]+'”归入'+(seatPick.value==='key'?'关键证据席。':'旁证席。');}
    evidence.addEventListener('change',function(){seatPick.value=assigned[evidence.value]||'key';});
    seatPick.addEventListener('change',assign);
    function reset(){assigned={};state.assigned=assigned;state.complete=false;verdict.value='stable';evidence.value='time';seatPick.value='key';renderSeats();submit.textContent='提交裁决';feedback.className='note feedback';feedback.textContent='依次选择四张证据卡的席位，再提交裁决。当前案情只支持谨慎判断。';document.querySelectorAll('.node,.arrow').forEach(function(x){x.classList.remove('on')});links.forEach(function(x){x.stroke(Deck.rgb('--line-strong'));x.dash([12,10])});layer.draw();}
    submit.addEventListener('click',function(){
      if(state.complete){reset();return;}
      assigned[evidence.value]=seatPick.value;renderSeats();
      var classified=assigned.time==='key'&&assigned.flow==='key'&&assigned.repro==='key'&&assigned.looks==='side';
      var consistent=verdict.value==='open';
      state.complete=true;state.verdict=verdict.value;submit.textContent='重新审理';
      document.querySelectorAll('.node').forEach(function(x,i){if(i<3)x.classList.add('on')});
      document.querySelectorAll('.arrow').forEach(function(x,i){if(i<2)x.classList.add('on')});
      links.forEach(function(x,i){if(i<2){x.stroke(Deck.rgb('--success'));x.dash([]);}});layer.draw();
      if(classified&&consistent){feedback.className='note feedback good-state';feedback.textContent='听证通过：三项关键证据被共同调用，外形留在旁证；现有证据仍不足以宣布新物种。';}
      else if(assigned.looks!=='side'){feedback.className='note feedback warn-state';feedback.textContent='外形卡应退回旁证席：长相变化不能单独判定物种。';}
      else if(!consistent){feedback.className='note feedback warn-state';feedback.textContent='裁决越过证据：仍可交流的繁殖差异，只支持保持开放。';}
      else{feedback.className='note feedback warn-state';feedback.textContent='论证缺环：隔离、基因交流与繁殖分化都应进入关键证据席。';}
    });
  </script>
</body>
</html>
