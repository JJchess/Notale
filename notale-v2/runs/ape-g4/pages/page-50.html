<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .closing-page{
      position:relative;
      display:flex;
      flex-direction:column;
      width:100%;
      height:100%;
      min-width:0;
      min-height:0;
      gap:var(--sp-4);
    }
    .system-contour{
      position:absolute;
      inset:var(--sp-5) var(--sp-6) var(--sp-7);
      z-index:0;
      width:calc(100% - var(--sp-6) - var(--sp-6));
      height:calc(100% - var(--sp-5) - var(--sp-7));
      color:var(--line-strong);
      opacity:.12;
      pointer-events:none;
    }
    .closing-page > :not(.system-contour){position:relative;z-index:1}
    .closing-page .k-comparison{
      --cmp-cols:minmax(140px,.54fr) minmax(0,.82fr) minmax(0,1.64fr);
      flex:1 1 auto;
      min-height:0;
      box-shadow:var(--shadow-soft);
    }
    .closing-page .k-comparison > *{
      padding:var(--sp-3) var(--sp-5);
    }
    .closing-page .k-comparison > .hdr{
      min-height:48px;
    }
    .closing-page .k-comparison > .hdr.old-head{
      color:var(--muted);
      background:var(--surface-soft);
    }
    .closing-page .k-comparison > .hdr.new-head{
      color:var(--accent-strong);
      background:var(--accent-soft);
    }
    .closing-page .k-comparison > .dim{
      justify-content:flex-start;
      text-align:left;
      font-size:var(--fs-lead);
      color:var(--text);
    }
    .closing-page .k-comparison > .cell{
      font-size:var(--fs-sec);
      line-height:var(--lh-copy);
    }
    .closing-page .k-comparison > .old-cell{
      color:var(--muted);
      background:var(--surface-soft);
    }
    .closing-page .k-comparison > .diff{
      color:var(--text);
      background:var(--accent-soft);
      box-shadow:inset 4px 0 0 var(--accent);
    }
    .closing-line{
      display:flex;
      align-items:center;
      min-width:0;
      gap:var(--sp-5);
      padding:var(--sp-3) var(--sp-5);
      border-top:1px solid var(--accent);
    }
    .boundary-system{
      flex:0 0 auto;
      color:var(--accent-strong);
      font-size:var(--fs-h2);
      line-height:1.3;
      font-weight:760;
      letter-spacing:.02em;
      white-space:nowrap;
    }
    .closing-thought{
      flex:1 1 auto;
      min-width:0;
      font-size:var(--fs-sec);
      line-height:var(--lh-copy);
      color:var(--muted);
    }
  </style>
</head>
<body data-page="50" data-total="50">
  <div id="stage">
    <main id="main"></main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 50,
      kicker: "APEMAN → SPACEMAN",
      title: "我们没有摆脱自然，只是重组了生存的边界",
      take: "从猿人到太空人，不是摆脱自然，而是不断重组身体、文化、技术与环境的边界。"
    });

    Deck.init({ index: 50, total: 50 });

    var main = document.getElementById("main");
    main.innerHTML = `
      <section class="closing-page" aria-label="摆脱自然与重组边界的四维对照">
        <svg class="system-contour" viewBox="0 0 1200 430" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="190" cy="92" r="42"></circle>
            <path d="M190 136 L190 270 M190 176 L112 232 M190 176 L292 215 M190 270 L128 368 M190 270 L260 368"></path>
            <path d="M292 215 L390 164 L466 222 L390 278 Z"></path>
            <path d="M466 222 C548 160 618 152 690 188"></path>
            <rect x="690" y="110" width="274" height="236" rx="70"></rect>
            <path d="M964 174 C1052 174 1090 118 1154 72 M964 282 C1050 282 1098 344 1162 390"></path>
          </g>
        </svg>
        <div class="k-comparison" role="table" aria-label="两种叙事的逐维比较">
          <div class="hdr dim" role="columnheader">维度</div>
          <div class="hdr old-head" role="columnheader">摆脱</div>
          <div class="hdr new-head" role="columnheader">重组</div>
          <div class="rowline" aria-hidden="true"></div>

          <div class="dim" role="rowheader">身体</div>
          <div class="cell old-cell" role="cell">身体一路升级，最后适合任何环境</div>
          <div class="cell diff" role="cell">身体保留演化留下的能力、成本与折中</div>
          <div class="rowline" aria-hidden="true"></div>

          <div class="dim" role="rowheader">文化</div>
          <div class="cell old-cell" role="cell">文化取代身体，人与自然从此分开</div>
          <div class="cell diff" role="cell">文化把部分适应移到衣物、知识、规则与协作中</div>
          <div class="rowline" aria-hidden="true"></div>

          <div class="dim" role="rowheader">技术</div>
          <div class="cell old-cell" role="cell">技术消除环境限制</div>
          <div class="cell diff" role="cell">技术重新安排空气、压力、资源、负荷与防护，同时带来新的依赖</div>
          <div class="rowline" aria-hidden="true"></div>

          <div class="dim" role="rowheader">环境</div>
          <div class="cell old-cell" role="cell">太空只是人类征服的下一站</div>
          <div class="cell diff" role="cell">太空把身体原有的环境关系暴露出来，迫使系统重新配合</div>
        </div>
        <div class="closing-line">
          <div class="boundary-system">身体 × 文化 × 技术 × 环境</div>
          <p class="closing-thought">变得最快的往往是工具与环境安排；被带进新世界的，仍是那副有能力、也有约束的身体。</p>
        </div>
      </section>`;
  </script>
</body>
</html>
