<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:var(--sp-5);
    }
    .misread{
      position:relative;
      align-self:center;
      padding:var(--sp-2) var(--sp-5);
      color:var(--ink-soft);
      font-size:var(--fs-h2);
      font-weight:700;
      line-height:1.35;
      letter-spacing:.035em;
      white-space:nowrap;
    }
    .misread::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:50%;
      height:5px;
      border-radius:999px;
      background:var(--danger);
      transform:rotate(-1.5deg);
      opacity:.9;
    }
    .opening-model.k-generalization{
      display:grid;
      grid-template-columns:1fr;
      grid-template-rows:auto 34px auto;
      width:1120px;
      margin-inline:auto;
    }
    .opening-model.k-generalization > .claim{
      justify-self:center;
      width:100%;
      box-sizing:border-box;
      padding:var(--sp-4) var(--sp-6);
      font-size:28px;
      line-height:1.4;
      text-align:center;
      border-left:0;
      border-bottom:8px solid var(--accent);
      border-radius:var(--radius-md) var(--radius-md) 0 0;
    }
    .opening-model.k-generalization > .claim strong{
      color:var(--accent-2);
      font-weight:820;
    }
    .opening-model.k-generalization > .trunk{
      min-height:34px;
    }
    .opening-model.k-generalization > .trunk::before{
      inset:0 auto 0 50%;
      width:4px;
    }
    .opening-model.k-generalization > .supports{
      gap:var(--sp-2);
    }
    .opening-model.k-generalization > .supports > .support{
      display:grid;
      grid-template-columns:110px minmax(0,1fr);
      align-items:baseline;
      gap:var(--sp-4);
      padding:var(--sp-2) var(--sp-4);
      font-size:var(--fs-body);
      line-height:var(--lh-copy);
      border:0;
      border-bottom:1px solid var(--line);
      border-radius:0;
      background:transparent;
    }
    .opening-model.k-generalization > .supports > .support::before{
      top:0;
      right:auto;
      left:50%;
      width:2px;
      height:var(--sp-2);
      transform:translate(-50%,-100%);
    }
    .support-label{
      color:var(--accent);
      font-size:var(--fs-label);
      font-weight:800;
      line-height:1.35;
      letter-spacing:.08em;
    }
  </style>
</head>
<body data-page="01" data-total="48">
  <div id="stage">
    <main id="main">
      <div class="misread" aria-label="被否定的误读：猿人到现代人再到太空人是一条等级线">猿人　→　现代人　→　太空人</div>

      <section class="k-generalization opening-model" aria-label="核心主张与三条支撑">
        <div class="claim">这不是一条<strong>“越来越高级”</strong>的直线，而是地球动物借助工具、知识与协作延伸自身的故事。</div>
        <div class="trunk" aria-hidden="true"></div>
        <div class="supports">
          <div class="support min0"><span class="support-label">身体</span><span>进入太空的仍是受地球环境塑造的人体。</span></div>
          <div class="support min0"><span class="support-label">延伸</span><span>工具、知识与协作把人的行动范围延伸到体外。</span></div>
          <div class="support min0"><span class="support-label">环境</span><span>到达太空描述活动环境与技术能力，不代表生命等级上升。</span></div>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 1,
      kicker: "APEMAN ≠ SPACEMAN LADDER",
      title: "从猿人到太空人，不是一条越来越高级的直线",
      take: "从猿人到太空人，不是一条“越来越高级”的直线，而是地球动物借助工具、知识与协作延伸自身的故事。"
    });
    Deck.init({ index: 1, total: 48 });
  </script>
</body>
</html>
