<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="06" data-total="48">
<div id="stage">
<main id="main">
  <style>
    .route-ledger{
      --item-cols:1;
      position:relative;
      height:100%;
      gap:var(--sp-2);
      padding-left:232px;
      box-sizing:border-box;
    }
    .route-ledger::before{
      content:"";
      position:absolute;
      left:110px;
      top:42px;
      bottom:42px;
      width:3px;
      background:var(--accent);
    }
    .route-object{
      position:absolute;
      left:0;
      top:50%;
      width:188px;
      padding:var(--sp-4) var(--sp-3);
      box-sizing:border-box;
      color:var(--text);
      font-size:var(--fs-lead);
      font-weight:760;
      line-height:var(--lh-copy);
      text-align:center;
      border:2px solid var(--accent);
      border-radius:var(--radius-md);
      background:var(--accent-soft);
      transform:translateY(-50%);
    }
    .route-object::after{
      content:"";
      position:absolute;
      left:100%;
      top:50%;
      width:44px;
      height:2px;
      background:var(--accent);
    }
    .route-ledger > .it{
      display:grid;
      grid-template-columns:180px minmax(0,1.5fr) minmax(0,1.15fr);
      align-items:center;
      gap:var(--sp-4);
      padding:var(--sp-3) var(--sp-5);
      box-shadow:none;
      border-radius:var(--radius-sm);
    }
    .route-ledger > .it::after{
      content:"";
      position:absolute;
      right:100%;
      top:50%;
      width:122px;
      height:1px;
      background:var(--line-strong);
    }
    .route-layer{
      color:var(--accent);
      font-size:var(--fs-h2);
      font-weight:780;
      line-height:1.35;
    }
    .route-question{
      font-size:var(--fs-sec);
      line-height:var(--lh-sec);
    }
    .route-chapter{
      padding-left:var(--sp-4);
      color:var(--ink-soft);
      font-size:var(--fs-sec);
      font-weight:680;
      line-height:var(--lh-sec);
      border-left:1px solid var(--line);
    }
    .route-note{
      position:absolute;
      left:0;
      bottom:0;
      width:196px;
      color:var(--ink-soft);
      font-size:var(--fs-sec);
      line-height:var(--lh-sec);
      text-align:center;
    }
  </style>

  <section class="k-enumeration route-ledger" aria-label="后续课程的四个分析层">
    <div class="route-object">同一种<br>地球动物</div>
    <article class="it min0">
      <h2 class="route-layer">身体</h2>
      <p class="route-question">演化留下了怎样的地球身体？获得能力时，又承担了什么成本？</p>
      <p class="route-chapter">一副为地球生活拼成的身体</p>
    </article>
    <article class="it min0">
      <h2 class="route-layer">文化</h2>
      <p class="route-question">个体生命有限，解决方案怎样被保存、传递，并由群体继续积累？</p>
      <p class="route-chapter">真正加速的是文化累积</p>
    </article>
    <article class="it min0">
      <h2 class="route-layer">火箭</h2>
      <p class="route-question">体外知识怎样被组织成足以离开地面的速度？</p>
      <p class="route-chapter">离开地面为什么如此困难</p>
    </article>
    <article class="it min0">
      <h2 class="route-layer">太空环境</h2>
      <p class="route-question">当地球提供的条件不再免费存在，这副身体与共同系统会面对什么边界？</p>
      <p class="route-chapter">太空会怎样对待猿类身体<br>成为“太空人”意味着什么</p>
    </article>
    <p class="route-note">研究对象没有换：<br>变化的是我们观察它的尺度。</p>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 6,
  kicker: "ROUTE AHEAD",
  title: "同一种地球动物，怎样走到地球之外？",
  take: "接下来沿“身体—文化—火箭—太空环境”追踪同一种地球动物。"
});
Deck.init({ index: 6, total: 48 });
</script>
</body>
</html>
