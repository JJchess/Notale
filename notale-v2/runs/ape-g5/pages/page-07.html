<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-lg);background:linear-gradient(90deg,rgb(255 253 248 / 94%),rgb(235 239 235 / 86%));box-shadow:var(--shadow)}
    .scene{position:absolute;inset:0}.scene canvas{cursor:grab}.scene canvas:active{cursor:grabbing}
    .scene canvas:focus-visible,.pose-ring:focus-visible,button:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
    .intro{position:absolute;z-index:3;left:24px;top:20px;width:360px;padding:16px 18px;background:rgb(255 253 248 / 91%);border-left:6px solid var(--accent);border-radius:0 var(--radius-md) var(--radius-md) 0}
    .intro p{font-size:var(--fs-lead);font-weight:720;line-height:var(--lh-copy)}
    .intro .secondary{margin-top:7px;font-size:var(--fs-sec);font-weight:500}
    .force-chain{--step-count:1;position:absolute;z-index:4;right:22px;top:18px;width:270px;height:472px;display:flex;flex-direction:column-reverse;gap:7px;padding-left:18px}
    .force-chain>.axis{inset:10px auto 10px 5px;width:3px;height:auto;top:auto;right:auto;left:5px;transform:none;background:var(--accent)}
    .force-chain>.step{flex:1;padding:7px 11px 7px 14px;display:flex;align-items:center;font-size:var(--fs-label);font-weight:720;line-height:1.35;box-shadow:none;background:rgb(255 253 248 / 90%);transition:background 180ms ease,border-color 180ms ease,opacity 180ms ease}
    .force-chain>.arw{display:none}
    .force-chain>.step[data-i]:not([data-i="0"])::before{content:"";position:absolute;left:-15px;width:9px;height:9px;border-top:3px solid var(--accent);border-right:3px solid var(--accent);transform:rotate(-45deg)}
    .force-chain>.step.is-current{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 2px rgb(0 109 119 / 12%)}
    .controls{position:absolute;z-index:5;right:22px;bottom:18px;width:270px;padding:12px 14px;background:rgb(255 253 248 / 94%);border:1px solid var(--line);border-radius:var(--radius-md)}
    .control-row{display:flex;align-items:center;gap:14px}.pose-ring{position:relative;flex:0 0 70px;width:70px;height:70px;border:3px solid var(--accent);border-radius:50%;background:radial-gradient(circle,var(--paper) 44%,var(--accent-soft) 46% 58%,var(--paper) 60%);cursor:ew-resize;touch-action:none}
    .pose-ring::before{content:"↔";position:absolute;inset:0;display:grid;place-items:center;color:var(--accent);font-size:var(--fs-h2);font-weight:800}
    .control-copy{min-width:0}.control-copy .label{color:var(--accent)}.control-copy p{margin-top:3px;font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .feedback{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:var(--fs-sec);line-height:var(--lh-sec);font-weight:650}
    .reset{margin-top:8px;min-height:38px;padding:6px 13px;color:#fff;font:700 var(--fs-label)/1.35 var(--font-sans);border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent);cursor:pointer}
    .ground-note{position:absolute;z-index:3;left:24px;bottom:20px;width:350px;padding:10px 14px;background:rgb(255 253 248 / 90%);border:1px solid var(--line);border-radius:var(--radius-sm);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    @media (prefers-reduced-motion:reduce){.force-chain>.step{transition:none}}
  </style>
</head>
<body data-page="07" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="scene" aria-label="可转动的概念骨架受力模型">
        <canvas id="skeleton" class="cv-fill no-pan" tabindex="0" aria-label="拖动空白处环绕骨架；方向键改变观察角度">概念骨架从四肢分担支撑连续变为双足承重。支撑区、重心垂线与受力链会同步改变。</canvas>
      </section>
      <div class="intro">
        <p>不是把躯干“站直”，而是让全身重新承接重量。</p>
        <p class="secondary">观察支撑区、关节排列与重心垂线怎样一起变化。</p>
      </div>
      <div class="k-process force-chain" aria-label="自下而上的六段受力链">
        <div class="axis" aria-hidden="true"></div>
        <div class="step is-current" data-i="0">地面反作用力</div><span class="arw a1" aria-hidden="true"></span>
        <div class="step" data-i="1">足部承接</div><span class="arw a2" aria-hidden="true"></span>
        <div class="step" data-i="2">膝与股骨传递</div><span class="arw a3" aria-hidden="true"></span>
        <div class="step" data-i="3">骨盆支撑</div><span class="arw a4" aria-hidden="true"></span>
        <div class="step" data-i="4">脊柱调节</div><span class="arw a5" aria-hidden="true"></span>
        <div class="step" data-i="5">头部平衡</div>
      </div>
      <div class="controls">
        <div class="control-row">
          <div id="pose" class="pose-ring" tabindex="0" role="slider" aria-label="支撑姿态" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-valuetext="过渡姿态"></div>
          <div class="control-copy"><div class="label">拖动姿态环</div><p id="poseName">过渡姿态</p></div>
        </div>
        <div id="feedback" class="feedback" aria-live="polite">躯干重量正从前后支点转向下肢承接。</div>
        <button id="reset" class="reset" type="button">重置姿态</button>
      </div>
      <p class="ground-note">拖动骨架空白处环绕查看；上下拖动改变仰俯角。方向键也可操作，Home 重置。</p>
    </main>
  </div>
  <script src="assets/lib/three.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:7,kicker:"EARTH-BUILT BODY",title:"双足行走，重排了全身的受力路径",take:"双足行走改变的是从足部、膝、骨盆到脊柱和头部的整条受力链，而不是简单地让猿“站直”。"});
    Deck.init({index:7,total:48});
    const cv=document.getElementById('skeleton'), host=document.getElementById('main');
    const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
    const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(34,1,.1,100);
    const target=new THREE.Vector3(0,2.45,0);let yaw=.62,pitch=.08,pose=.5,drag=null;
    scene.add(new THREE.HemisphereLight(0xffffff,0x9ca69d,2.2));const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(4,7,5);scene.add(key);
    const boneMat=new THREE.MeshStandardMaterial({color:new THREE.Color(Deck.token('--paper-2')),roughness:.7,metalness:.05});
    const jointMat=new THREE.MeshStandardMaterial({color:new THREE.Color(Deck.token('--accent')),roughness:.55});
    const warmMat=new THREE.MeshStandardMaterial({color:new THREE.Color(Deck.token('--accent-2')),roughness:.6});
    const body=new THREE.Group();scene.add(body);const parts={};
    function joint(name,r=.12){const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,12),jointMat);m.name=name;body.add(m);parts[name]=m;return m}
    function bone(name,a,b,r=.055,mat=boneMat){let m=parts[name];if(!m){m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,12),mat);body.add(m);parts[name]=m}const d=new THREE.Vector3().subVectors(b,a);m.position.copy(a).addScaledVector(d,.5);m.scale.set(1,d.length(),1);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());return m}
    ['ankL','ankR','kneeL','kneeR','hipL','hipR','shouldL','shouldR','head'].forEach(n=>joint(n,n==='head'?.28:.105));
    const pelvis=new THREE.Mesh(new THREE.BoxGeometry(.62,.28,.26),boneMat);body.add(pelvis);parts.pelvis=pelvis;
    const spine=new THREE.Group();body.add(spine);for(let i=0;i<7;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(.095,12,8),boneMat);spine.add(s)}
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(7,5),new THREE.MeshStandardMaterial({color:new THREE.Color(Deck.token('--paper-2')),transparent:true,opacity:.7,side:THREE.DoubleSide}));ground.rotation.x=-Math.PI/2;scene.add(ground);
    const supportGeom=new THREE.BufferGeometry(),supportMat=new THREE.MeshBasicMaterial({color:new THREE.Color(Deck.token('--accent')),transparent:true,opacity:.2,side:THREE.DoubleSide});const support=new THREE.Mesh(supportGeom,supportMat);support.rotation.x=-Math.PI/2;support.position.y=.012;scene.add(support);
    const lineMat=new THREE.LineDashedMaterial({color:new THREE.Color(Deck.token('--accent-2')),dashSize:.11,gapSize:.08});const comLine=new THREE.Line(new THREE.BufferGeometry(),lineMat);scene.add(comLine);
    const forceMat=new THREE.LineBasicMaterial({color:new THREE.Color(Deck.token('--accent')),transparent:true,opacity:.9});const forceLine=new THREE.Line(new THREE.BufferGeometry(),forceMat);scene.add(forceLine);
    function updateModel(){
      const t=pose, lean=(1-t)*.85, hipY=2.25+t*.2, zHip=(1-t)*.48;
      const P={ankL:new THREE.Vector3(-.24,.16,.04),ankR:new THREE.Vector3(.24,.16,.04),kneeL:new THREE.Vector3(-.34+t*.18,1.18,(1-t)*.16),kneeR:new THREE.Vector3(.34-t*.18,1.18,(1-t)*.16),hipL:new THREE.Vector3(-.3,hipY,zHip),hipR:new THREE.Vector3(.3,hipY,zHip),shouldL:new THREE.Vector3(-.48,3.43-lean*.2,zHip+lean),shouldR:new THREE.Vector3(.48,3.43-lean*.2,zHip+lean),head:new THREE.Vector3(0,4.15-lean*.28,zHip+lean*1.18)};
      Object.keys(P).forEach(k=>parts[k].position.copy(P[k]));parts.pelvis.position.set(0,hipY,zHip);parts.pelvis.rotation.x=-lean*.22;
      bone('shinL',P.ankL,P.kneeL);bone('shinR',P.ankR,P.kneeR);bone('femurL',P.kneeL,P.hipL,.07);bone('femurR',P.kneeR,P.hipR,.07);bone('shoulders',P.shouldL,P.shouldR,.055);
      bone('armL',P.shouldL,new THREE.Vector3(-.66,.58,(1-t)*1.65),.045);bone('armR',P.shouldR,new THREE.Vector3(.66,.58,(1-t)*1.65),.045);
      for(let i=0;i<7;i++){const q=i/6;spine.children[i].position.set(Math.sin(q*Math.PI)*.08*t,hipY+.28+q*.92,zHip+q*lean*.86)}
      bone('neck',spine.children[6].position,P.head,.06);
      const depth=(1-t)*1.75+.38,verts=[-.52,0,-.18,.52,0,-.18,.52,0,depth,-.52,0,depth];support.geometry.dispose();support.geometry=new THREE.BufferGeometry();support.geometry.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));support.geometry.setIndex([0,1,2,0,2,3]);
      const comX=(1-t)*.1,comZ=zHip+lean*.42;comLine.geometry.setFromPoints([new THREE.Vector3(comX,.03,comZ),new THREE.Vector3(comX,3.1,comZ)]);comLine.computeLineDistances();
      const pts=[new THREE.Vector3(0,.04,.03),new THREE.Vector3(0,.55,.05),new THREE.Vector3(0,1.2,.12*(1-t)),new THREE.Vector3(0,hipY,zHip),new THREE.Vector3(0,3.1,zHip+lean*.65),P.head];forceLine.geometry.setFromPoints(pts);
      const active=Math.min(5,Math.floor(t*6));document.querySelectorAll('.force-chain .step').forEach((e,i)=>e.classList.toggle('is-current',i===active));
      const name=t<.25?'四肢分担支撑':t>.8?'双足承重姿态':'过渡姿态';document.getElementById('poseName').textContent=name;const ring=document.getElementById('pose');ring.setAttribute('aria-valuenow',Math.round(t*100));ring.setAttribute('aria-valuetext',name);
      document.getElementById('feedback').textContent=t>.8?'不是只转直躯干：下肢、骨盆、脊柱与头部必须共同重排。':t<.25?'支撑区向前后展开，受力从前后肢分流。':t<.58?'躯干重量正从前后支点转向下肢承接。':'膝逐渐靠近重心下方，骨盆接上躯干重量。';
    }
    function view(){const r=8.2;camera.position.set(Math.sin(yaw)*r,target.y+Math.sin(pitch)*r*.48,Math.cos(yaw)*r);camera.lookAt(target)}
    function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
    Deck.onResize(resize);resize();view();updateModel();
    function begin(e,kind){drag={kind,p:Deck.pt(kind==='pose'?document.getElementById('pose'):cv,e),pose,yaw,pitch};e.currentTarget.setPointerCapture&&e.currentTarget.setPointerCapture(e.pointerId)}
    cv.addEventListener('pointerdown',e=>begin(e,'view'));document.getElementById('pose').addEventListener('pointerdown',e=>begin(e,'pose'));
    window.addEventListener('pointermove',e=>{if(!drag)return;const el=drag.kind==='pose'?document.getElementById('pose'):cv,p=Deck.pt(el,e),dx=p.x-drag.p.x,dy=p.y-drag.p.y;if(drag.kind==='pose'){pose=Deck.clamp(drag.pose+dx/150,0,1);pitch=Deck.clamp(drag.pitch-dy/220,-.3,.32);updateModel()}else{yaw=drag.yaw-dx/260;pitch=Deck.clamp(drag.pitch-dy/260,-.3,.32);view()}});window.addEventListener('pointerup',()=>drag=null);
    function keys(e,poseOnly){if(e.key==='Home'){reset();e.preventDefault();return}if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();if(poseOnly&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){pose=Deck.clamp(pose+(e.key==='ArrowRight'?.05:-.05),0,1);updateModel()}else{yaw+=e.key==='ArrowLeft'?-.08:e.key==='ArrowRight'?.08:0;pitch=Deck.clamp(pitch+(e.key==='ArrowUp'?.05:e.key==='ArrowDown'?-.05:0),-.3,.32);view()}}}
    cv.addEventListener('keydown',e=>keys(e,false));document.getElementById('pose').addEventListener('keydown',e=>keys(e,true));
    function reset(){pose=.5;yaw=.62;pitch=.08;updateModel();view()}document.getElementById('reset').addEventListener('click',reset);
    Deck.loop(()=>renderer.render(scene,camera),{still:0});
  </script>
</body>
</html>
