<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#main{display:flex;flex-direction:column;gap:12px}
.grip-root{height:100%;gap:10px}
.grip-root>.box{height:100%;box-sizing:border-box;padding:22px 18px 16px}
.grip-root>.box>.bt{margin-top:-23px;margin-bottom:8px}
.class-head{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:42px}
.split-label{font-size:var(--fs-lead);font-weight:760;color:var(--accent)}
.split-label span{display:inline-block;padding:4px 11px;margin-left:6px;border:1px solid var(--line);border-radius:999px;background:var(--paper-2);color:var(--ink-soft)}
.split-label span.on{color:#fff;background:var(--accent);border-color:var(--accent)}
.instruction{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--ink-soft)}
.reset{min-height:38px;padding:6px 16px;border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--paper);color:var(--accent);font:700 var(--fs-label)/1.35 var(--font-sans);cursor:pointer}
.branches{display:flex;gap:14px;min-height:0;flex:1}
.branch{--level:1;flex:1 1 0;min-width:0;display:flex;padding-left:18px!important}
.task{min-width:0;flex:1;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper);overflow:hidden;box-shadow:0 5px 16px rgb(23 33 43 / 6%)}
.task.is-done{border-color:var(--good);box-shadow:0 0 0 2px rgb(57 115 79 / 13%)}
.task-hd{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--paper-2);border-bottom:1px solid var(--line)}
.task-hd h2{font-size:var(--fs-h2)}
.need{font-size:var(--fs-label);font-weight:700;color:var(--ink-soft)}
.hand-stage{position:relative;height:205px;overflow:hidden;background:linear-gradient(180deg,#fffdf8,#f4efe4)}
.palm{position:absolute;left:152px;top:76px;width:105px;height:100px;border:3px solid var(--text);border-radius:36px 32px 48px 35px;background:var(--accent-warm);transform:rotate(-8deg)}
.finger{position:absolute;width:28px;height:92px;border:3px solid var(--text);border-radius:18px;background:var(--accent-warm);transform-origin:bottom center}
.f1{left:146px;top:18px;transform:rotate(-18deg)}.f2{left:178px;top:8px;transform:rotate(-7deg)}.f3{left:211px;top:13px;transform:rotate(6deg)}.f4{left:242px;top:29px;transform:rotate(18deg);height:78px}
.object{position:absolute;background:var(--accent);border:3px solid var(--text);z-index:3}
.power .object{left:107px;top:61px;width:62px;height:120px;border-radius:30px}
.hook .object{left:72px;top:50px;width:224px;height:27px;border-radius:18px}.hook .palm{top:91px}.hook .finger{top:48px;height:84px;transform:rotate(75deg)}.hook .f1{left:129px}.hook .f2{left:163px}.hook .f3{left:197px}.hook .f4{left:231px}
.precision .object{left:126px;top:91px;width:31px;height:31px;border-radius:50%;background:var(--accent-2)}
.zone{position:absolute;width:62px;height:62px;border:2px dashed var(--accent);border-radius:50%;background:rgb(0 109 119 / 8%);opacity:.38;z-index:5}
.power .zone{left:125px;top:105px}.hook .zone{left:267px;top:82px}.precision .zone{left:116px;top:76px}
.thumb{position:absolute;left:270px;top:133px;width:72px;height:32px;border:3px solid var(--text);border-radius:18px;background:#efbd75;z-index:8;cursor:grab;touch-action:none;transform:translate(0,0) rotate(-15deg);transition:box-shadow .15s}
.thumb:focus-visible{outline:4px solid var(--focus);outline-offset:3px}.thumb.dragging{cursor:grabbing;box-shadow:0 8px 16px rgb(23 33 43 / 22%)}
.feedback{min-height:72px;padding:8px 12px;border-top:1px solid var(--line)}
.feedback strong{display:block;font-size:var(--fs-sec);line-height:1.4;color:var(--accent)}
.feedback p{font-size:var(--fs-sec);line-height:1.4;color:var(--ink-soft)}
.summary{font-size:var(--fs-sec);line-height:var(--lh-sec);padding:7px 12px;border-left:4px solid var(--accent);background:var(--accent-soft)}
@media (prefers-reduced-motion:reduce){.thumb{transition:none}}
</style>
</head>
<body data-page="09" data-total="48">
<div id="stage">
<main id="main">
  <section class="k-classification grip-root" aria-label="抓握任务分类">
    <div class="box col">
      <div class="bt">主干：抓握任务</div>
      <div class="class-head">
        <div class="split-label" aria-live="polite">主要需求 → <span data-cap="力量">力量</span><span data-cap="悬挂">悬挂</span><span data-cap="精细控制">精细控制</span></div>
        <p class="instruction">拖动拇指到虚线接触区；方向键移动，Enter 或空格确认。</p>
        <button class="reset" type="button">重置握法</button>
      </div>
      <div class="branches">
        <div class="lv branch min0"><article class="task power" data-kind="power" data-name="力量握" data-cap="力量">
          <header class="task-hd"><h2>力量握</h2><span class="need">较大用力</span></header>
          <div class="hand-stage no-pan"><div class="finger f1"></div><div class="finger f2"></div><div class="finger f3"></div><div class="finger f4"></div><div class="palm"></div><div class="object"></div><div class="zone"></div><div class="thumb" role="slider" tabindex="0" aria-label="力量握卡片的拇指；方向键移动，确认键放下" aria-valuetext="尚未形成接触"></div></div>
          <div class="feedback" aria-live="polite"><strong>任务：稳定包住粗圆柱</strong><p>让拇指横向闭合，使物体压向掌面。</p></div>
        </article></div>
        <div class="lv branch min0"><article class="task hook" data-kind="hook" data-name="钩握／悬挂握" data-cap="悬挂">
          <header class="task-hd"><h2>钩握／悬挂握</h2><span class="need">持续承重</span></header>
          <div class="hand-stage no-pan"><div class="finger f1"></div><div class="finger f2"></div><div class="finger f3"></div><div class="finger f4"></div><div class="palm"></div><div class="object"></div><div class="zone"></div><div class="thumb" role="slider" tabindex="0" aria-label="悬挂握卡片的拇指；方向键移动，确认键放下" aria-valuetext="尚未形成接触"></div></div>
          <div class="feedback" aria-live="polite"><strong>任务：抓住横杆持续悬挂</strong><p>拇指可辅助闭合，主要负荷由弯曲手指承担。</p></div>
        </article></div>
        <div class="lv branch min0"><article class="task precision" data-kind="precision" data-name="精细握" data-cap="精细控制">
          <header class="task-hd"><h2>精细握</h2><span class="need">位置与方向</span></header>
          <div class="hand-stage no-pan"><div class="finger f1"></div><div class="finger f2"></div><div class="finger f3"></div><div class="finger f4"></div><div class="palm"></div><div class="object"></div><div class="zone"></div><div class="thumb" role="slider" tabindex="0" aria-label="精细握卡片的拇指；方向键移动，确认键放下" aria-valuetext="尚未形成接触"></div></div>
          <div class="feedback" aria-live="polite"><strong>任务：控制小物体的细微移动</strong><p>让拇指指腹与手指指腹相对，掌面少参与。</p></div>
        </article></div>
      </div>
      <p class="summary">不同握法优化不同任务。真实抓握还依赖其余手指、腕部、感觉反馈与情境。</p>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:9,kicker:"GRIP / 抓握分类",title:"拇指放在哪里，取决于你想怎样抓",take:"“灵巧”不是单一标尺，而是一组针对不同任务的能力。"});
Deck.init({index:9,total:48});
(function(){
  const initial=()=>({items:{power:{x:0,y:0,done:false},hook:{x:0,y:0,done:false},precision:{x:0,y:0,done:false}}});
  let state=initial();
  const cards=[...document.querySelectorAll('.task')];
  function render(card){
    const kind=card.dataset.kind,s=state.items[kind],thumb=card.querySelector('.thumb');
    thumb.style.transform=`translate(${s.x}px,${s.y}px) rotate(-15deg)`;
    thumb.setAttribute('aria-valuetext',s.done?`${card.dataset.name}接触已匹配`:'正在调整接触位置');
    card.classList.toggle('is-done',s.done);
    if(s.done){
      const copy={power:['掌面承力 · 整体包握','物体压向掌面，适合传递较大的力。'],hook:['手指成钩 · 拇指并非主角','弯曲手指持续承重，拇指只辅助闭合。'],precision:['指腹相对 · 掌面少参与','小接触范围便于控制位置与方向。']}[kind];
      card.querySelector('.feedback').innerHTML=`<strong>${copy[0]}</strong><p>${copy[1]}</p>`;
    }
    document.querySelector(`[data-cap="${card.dataset.cap}"]`).classList.toggle('on',s.done);
  }
  function confirm(card){
    const s=state.items[card.dataset.kind],zone=card.querySelector('.zone'),thumb=card.querySelector('.thumb');
    const tx=thumb.offsetLeft+s.x+thumb.offsetWidth/2,ty=thumb.offsetTop+s.y+thumb.offsetHeight/2;
    const zx=zone.offsetLeft+zone.offsetWidth/2,zy=zone.offsetTop+zone.offsetHeight/2;
    if(Math.hypot(tx-zx,ty-zy)<54){s.done=true;render(card)}else{
      s.done=false;s.x=0;s.y=0;render(card);
      const msg={power:'接触未能把物体锁向掌面。',hook:'拇指无需承担横杆的主要负荷。',precision:'这个小物体还缺少指腹相对控制。'}[card.dataset.kind];
      card.querySelector('.feedback').innerHTML=`<strong>再调整拇指落点</strong><p>${msg}</p>`;
    }
  }
  cards.forEach(card=>{
    const thumb=card.querySelector('.thumb'),stage=card.querySelector('.hand-stage');let drag=false,last=null;
    thumb.addEventListener('pointerdown',e=>{drag=true;last=Deck.pt(stage,e);thumb.setPointerCapture(e.pointerId);thumb.classList.add('dragging')});
    thumb.addEventListener('pointermove',e=>{if(!drag)return;const p=Deck.pt(stage,e),s=state.items[card.dataset.kind];s.x=Deck.clamp(s.x+p.x-last.x,-250,80);s.y=Deck.clamp(s.y+p.y-last.y,-130,45);last=p;render(card)});
    thumb.addEventListener('pointerup',()=>{if(!drag)return;drag=false;thumb.classList.remove('dragging');confirm(card)});
    thumb.addEventListener('keydown',e=>{const s=state.items[card.dataset.kind],step=8;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')s.x-=step;if(e.key==='ArrowRight')s.x+=step;if(e.key==='ArrowUp')s.y-=step;if(e.key==='ArrowDown')s.y+=step;s.x=Deck.clamp(s.x,-250,80);s.y=Deck.clamp(s.y,-130,45);render(card);if(e.key===' '||e.key==='Enter')confirm(card)});
  });
  document.querySelector('.reset').addEventListener('click',()=>{state=initial();cards.forEach(c=>{c.querySelector('.feedback').innerHTML=({power:'<strong>任务：稳定包住粗圆柱</strong><p>让拇指横向闭合，使物体压向掌面。</p>',hook:'<strong>任务：抓住横杆持续悬挂</strong><p>拇指可辅助闭合，主要负荷由弯曲手指承担。</p>',precision:'<strong>任务：控制小物体的细微移动</strong><p>让拇指指腹与手指指腹相对，掌面少参与。</p>'})[c.dataset.kind];render(c)})});
  cards.forEach(render);
})();
</script>
</body>
</html>
