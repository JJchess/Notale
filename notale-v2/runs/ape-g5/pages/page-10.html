<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:16px}
    .ledger-head{display:flex;justify-content:space-between;align-items:center;gap:24px}
    .ledger-head p{font-size:var(--fs-lead);font-weight:680;line-height:var(--lh-copy)}
    .legend{display:flex;gap:18px;color:var(--ink-soft);font-size:var(--fs-label);font-weight:680;white-space:nowrap}
    .legend i{display:inline-block;width:12px;height:12px;margin-right:6px;border-radius:3px;vertical-align:-1px}
    .flow-panel{height:294px;padding:12px 18px 10px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper);box-shadow:var(--shadow)}
    #flow{width:100%;height:238px}
    .connection{min-height:30px;padding:5px 12px;color:var(--ink-soft);font-size:var(--fs-sec);line-height:var(--lh-sec);text-align:center;border-top:1px solid var(--line)}
    .assembly{display:flex;gap:24px;min-height:0;flex:1}
    .assembly-main{display:flex;flex:1 1 auto;min-width:0;flex-direction:column;gap:10px}
    .assembly-title{display:flex;justify-content:space-between;align-items:baseline}
    .assembly-title h2{font-size:var(--fs-h2)}
    .assembly-title span{color:var(--ink-soft);font-size:var(--fs-label);font-weight:650}
    .slots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
    .slot{display:flex;min-height:72px;padding:8px;box-sizing:border-box;align-items:center;justify-content:center;text-align:center;color:var(--ink-soft);font-size:var(--fs-label);font-weight:700;line-height:1.35;border:2px dashed var(--line-strong);border-radius:var(--radius-sm);background:rgb(255 253 248 / 55%)}
    .slot.is-target{border-color:var(--accent-2);background:var(--accent-warm)}
    .slot.is-filled{color:var(--good);border-style:solid;border-color:var(--good);background:#edf4ee}
    .cards{display:flex;gap:10px;min-height:56px;flex-wrap:wrap}
    .account-card{min-width:142px;min-height:48px;padding:8px 14px;color:var(--text);font:700 var(--fs-label)/1.35 var(--font-sans);border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--paper);box-shadow:0 4px 10px rgb(23 33 43 / 8%);cursor:grab}
    .account-card:active{transform:translateY(1px);cursor:grabbing}
    .account-card[disabled]{display:none}
    .feedback{width:330px;box-sizing:border-box;padding:16px 18px;border-left:5px solid var(--accent);border-radius:0 var(--radius-md) var(--radius-md) 0;background:var(--accent-soft)}
    .feedback h2{margin-bottom:7px}
    #status{min-height:72px;font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .reset{width:100%;min-height:42px;margin-top:10px;color:#fff;font:720 var(--fs-label)/1.35 var(--font-sans);border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent);cursor:pointer}
    .reset:active{transform:translateY(1px)}
  </style>
</head>
<body data-page="10" data-total="48">
  <div id="stage">
    <main id="main">
      <div class="ledger-head">
        <p>把六项放入账目：能量从哪里进入，成本在哪里发生，又由谁分担？</p>
        <div class="legend" aria-label="账目角色图例"><span><i style="background:var(--accent)"></i>输入</span><span><i style="background:var(--accent-2)"></i>支出与时间</span><span><i style="background:var(--good)"></i>分担</span></div>
      </div>
      <section class="flow-panel k-process" aria-label="脑能量账流程">
        <div id="flow" role="img" aria-label="六个节点组成的账目链。未接通为灰色虚线，正确放置后路径变为暖色实线。"></div>
        <p id="connection" class="connection">先选择一张账目卡，再确定它在约束链中的位置。</p>
      </section>
      <section class="assembly" aria-label="组装区">
        <div class="assembly-main min0">
          <div class="assembly-title"><h2>组装脑能量账</h2><span>拖到槽位；或聚焦卡片后用方向键选位，按 Enter 放置</span></div>
          <div class="slots" aria-label="从输入到分担的六个槽位">
            <div class="slot" data-slot="0">输入</div><div class="slot" data-slot="1">身体支出</div><div class="slot" data-slot="2">脑需求</div><div class="slot" data-slot="3">时间</div><div class="slot" data-slot="4">缺口</div><div class="slot" data-slot="5">分担</div>
          </div>
          <div class="cards" id="cards"></div>
        </div>
        <aside class="feedback min0">
          <h2>当前反馈</h2>
          <p id="status" aria-live="polite">脑不是单独的一笔升级。请把各项接到账目中。</p>
          <button class="reset" id="reset" type="button">重置账目</button>
        </aside>
      </section>
    </main>
  </div>
  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 10,
      kicker: "BODY / ENERGY",
      title: "大脑不是免费升级",
      take: "大脑昂贵，脑容量变化必须与食物、发育和社会照料一起理解。"
    });
    Deck.init({ index: 10, total: 48 });

    const items = [
      {id:'food', name:'食物输入', explain:'食物决定账目中有多少可用能量。', color:'#006d77'},
      {id:'body', name:'身体维持', explain:'肌肉、内脏、体温、生长与活动都需要持续支出。', color:'#d97706'},
      {id:'brain', name:'脑的需求', explain:'脑组织的建立、维持和活动都需要能量。昂贵不等于越大越聪明。', color:'#d97706'},
      {id:'time', name:'发育时间', explain:'较长发育期意味着更长时间的供给、保护与学习条件。', color:'#d97706'},
      {id:'gap', name:'自给缺口', explain:'需要的能量与能独立取得的能量，并不总在同一个人身上匹配。', color:'#d97706'},
      {id:'care', name:'照料分担', explain:'照料重新分配已有资源、时间与风险，不会凭空增加总能量。', color:'#39734f'}
    ];
    const order = [5,2,0,4,1,3];
    let state = {placed:Array(6).fill(false), target:0};
    const cardsEl=document.getElementById('cards'), slots=[...document.querySelectorAll('.slot')];
    const statusEl=document.getElementById('status'), connectionEl=document.getElementById('connection');
    const chart=echarts.init(document.getElementById('flow'),null,{renderer:'svg'});

    function renderChart(){
      const nodes=items.map((d,i)=>({name:d.name,x:75+i*220,y:95,symbolSize:[148,62],itemStyle:{color:state.placed[i]?d.color:'#ebe7dc',borderColor:state.placed[i]?d.color:'#8b948f',borderWidth:2},label:{color:state.placed[i]?'#fff':'#53616c'}}));
      const links=items.slice(0,-1).map((d,i)=>({source:i,target:i+1,lineStyle:{color:state.placed[i]&&state.placed[i+1]?'#d97706':'#8b948f',width:state.placed[i]&&state.placed[i+1]?4:2,type:state.placed[i]&&state.placed[i+1]?'solid':'dashed',opacity:1}}));
      chart.setOption({animationDuration:Deck.reduced()?0:260,textStyle:{fontFamily:Deck.token('--font-sans'),fontSize:16},tooltip:{show:true,textStyle:{fontSize:16},formatter:p=>p.dataType==='node'?items[p.dataIndex].explain:''},series:[{type:'graph',layout:'none',roam:false,silent:false,edgeSymbol:['none','arrow'],edgeSymbolSize:12,data:nodes,links:links,label:{show:true,fontSize:15,fontWeight:700},lineStyle:{curveness:0}}]});
    }
    function makeCards(){
      cardsEl.innerHTML='';
      order.forEach(i=>{const b=document.createElement('button');b.type='button';b.className='account-card';b.textContent=items[i].name;b.dataset.index=i;b.draggable=true;b.setAttribute('aria-label',items[i].name+'，当前目标槽位'+(state.target+1));b.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',String(i)));b.addEventListener('focus',()=>selectTarget(state.target));b.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();selectTarget(state.target+1)}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();selectTarget(state.target-1)}else if(e.key==='Enter'){e.preventDefault();place(i,state.target)}else if(e.key==='Escape'){selectTarget(0);statusEl.textContent='已取消选位。可重新选择槽位。'}});cardsEl.appendChild(b)});
    }
    function selectTarget(n){state.target=(n+6)%6;slots.forEach((s,i)=>s.classList.toggle('is-target',i===state.target&&!state.placed[i]));cardsEl.querySelectorAll('button').forEach(b=>b.setAttribute('aria-label',items[+b.dataset.index].name+'，当前目标槽位'+(state.target+1)))}
    function place(cardIndex,slotIndex){
      if(state.placed[cardIndex])return;
      if(cardIndex!==slotIndex){
        if(cardIndex===5&&slotIndex===0) statusEl.textContent='照料重新分配资源，不会凭空增加能量。';
        else if(cardIndex===2&&slotIndex===1) statusEl.textContent='脑不是身体唯一的能量支出。身体其他组织也要维持。';
        else if(cardIndex===5&&slotIndex<4) statusEl.textContent='还缺少持续多久、谁在此期间不能自给这一层关系。';
        else statusEl.textContent='这项与槽位承担的角色不匹配。沿着“输入—支出—时间—缺口—分担”再试。';
        return;
      }
      state.placed[cardIndex]=true;
      slots[slotIndex].textContent=items[cardIndex].name;slots[slotIndex].classList.add('is-filled');
      const card=cardsEl.querySelector('[data-index="'+cardIndex+'"]');if(card)card.disabled=true;
      connectionEl.textContent=items[cardIndex].explain;statusEl.textContent='连接正确：'+items[cardIndex].explain;
      const next=state.placed.findIndex(v=>!v);if(next>=0)selectTarget(next);
      renderChart();
      if(state.placed.every(Boolean)){statusEl.textContent='账目成立：输入覆盖身体支出，长期依赖由跨个体照料分担。';connectionEl.textContent='社会照料不会创造能量，但能把资源、时间和风险分摊到多个个体。'}
    }
    slots.forEach((s,i)=>{s.addEventListener('dragover',e=>e.preventDefault());s.addEventListener('drop',e=>{e.preventDefault();place(+e.dataTransfer.getData('text/plain'),i)});s.addEventListener('pointerenter',()=>selectTarget(i))});
    function reset(){state={placed:Array(6).fill(false),target:0};slots.forEach((s,i)=>{s.className='slot';s.textContent=['输入','身体支出','脑需求','时间','缺口','分担'][i]});statusEl.textContent='脑不是单独的一笔升级。请把各项接到账目中。';connectionEl.textContent='先选择一张账目卡，再确定它在约束链中的位置。';makeCards();selectTarget(0);renderChart()}
    document.getElementById('reset').addEventListener('click',reset);
    reset();
  </script>
</body>
</html>
