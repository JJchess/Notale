<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:var(--sp-3)}
    .instruction{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4)}
    .instruction p{font-size:var(--fs-sec);color:var(--ink-soft)}
    .reset{min-height:42px;padding:var(--sp-2) var(--sp-4);color:#fff;font:700 var(--fs-label)/1.35 var(--font-sans);border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent);cursor:pointer;white-space:nowrap}
    .strategy-table{--compare-cols:3;flex:1;grid-template-columns:176px repeat(3,minmax(0,1fr));grid-template-rows:116px repeat(3,78px) 112px;align-content:stretch}
    .strategy-table>.hdr,.strategy-table>.dim,.strategy-table>.cell{padding:var(--sp-2) var(--sp-3)}
    .strategy-table>.hdr{display:flex;flex-direction:column;justify-content:center;gap:var(--sp-2)}
    .strategy-table>.hdr:first-child{color:var(--ink-soft);font-size:var(--fs-label);font-weight:720}
    .strategy-table>.dim{display:flex;align-items:center;justify-content:flex-end;font-size:var(--fs-label)}
    .strategy-table>.cell{display:flex;flex-direction:column;justify-content:center;gap:var(--sp-1);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .strategy-table>.rowline{display:none}
    .strategy-table>select.hdr{width:100%;border:0;border-right:1px solid var(--line);border-bottom:2px solid var(--line-strong);border-radius:0;color:var(--text);font:740 var(--fs-sec)/1.35 var(--font-sans);background:var(--paper-2);cursor:pointer}
    .strategy-table>select.hdr:focus-visible,.reset:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
    .strategy-table .status{font-weight:760;color:var(--accent)}
    .strategy-table .cost{color:var(--ink-soft)}
    .strategy-table .gap{color:var(--warn);font-weight:700}
    .strategy-table>.changed{background:var(--accent-soft)}
    .claim{padding:var(--sp-2) var(--sp-3);border-left:5px solid var(--accent);background:var(--accent-soft);font-size:var(--fs-sec);font-weight:680;line-height:var(--lh-sec)}
  </style>
</head>
<body data-page="11" data-total="48">
  <div id="stage">
    <main id="main">
      <div class="instruction">
        <p>为三套策略选择配置，横向观察同一维度；每个因素只改变部分结果。</p>
        <button class="reset" id="reset" type="button">恢复起始对照</button>
      </div>

      <section class="k-comparison strategy-table" id="table" aria-label="三种觅食策略的四维比较">
        <div class="hdr">比较维度</div>
        <select class="hdr min0" id="choice-a" aria-label="策略甲配置"></select>
        <select class="hdr min0" id="choice-b" aria-label="策略乙配置"></select>
        <select class="hdr min0" id="choice-c" aria-label="策略丙配置"></select>

        <div class="dim">可食来源</div><div class="cell" id="a-source"></div><div class="cell" id="b-source"></div><div class="cell" id="c-source"></div>
        <div class="dim">食前处理</div><div class="cell" id="a-process"></div><div class="cell" id="b-process"></div><div class="cell" id="c-process"></div>
        <div class="dim">分享与短缺</div><div class="cell" id="a-share"></div><div class="cell" id="b-share"></div><div class="cell" id="c-share"></div>
        <div class="dim">综合后果</div><div class="cell" id="a-total"></div><div class="cell" id="b-total"></div><div class="cell" id="c-total"></div>
      </section>

      <div class="claim">火、加工、多样食物和分享分别作用于“能否利用、处理成本、获取稳定性”，不能合并成一种机制。</div>
      <div class="sr-only" id="live" aria-live="polite"></div>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 11,
      kicker: "BODY / FOOD STRATEGY",
      title: "能量来自一套觅食策略，不是一种神奇食物",
      take: "没有一种“神奇食物”独自创造人类；起作用的是多种资源、技术与合作形成的组合。"
    });
    Deck.init({ index: 11, total: 48 });

    const configs = {
      focused: {label:"集中来源 · 直接食用 · 自取", diverse:false, machine:false, heat:false, fuel:false, share:false, partners:false},
      worked: {label:"集中来源 · 切捣加工 · 自取", diverse:false, machine:true, heat:false, fuel:false, share:false, partners:false},
      heated: {label:"适合加热 · 有燃料 · 自取", diverse:false, machine:true, heat:true, fuel:true, share:false, partners:false},
      combined: {label:"多样来源 · 加工 · 群体分享", diverse:true, machine:true, heat:true, fuel:true, share:true, partners:true},
      nofuel: {label:"多样来源 · 有火无燃料 · 自取", diverse:true, machine:false, heat:true, fuel:false, share:false, partners:false},
      alone: {label:"多样来源 · 不加工 · 无伙伴分享", diverse:true, machine:false, heat:false, fuel:false, share:true, partners:false}
    };
    const order = Object.keys(configs);
    const defaults = ["focused","heated","combined"];
    const ids = ["a","b","c"];

    function feedback(c){
      const heatWorks = c.heat && c.fuel;
      const shareWorks = c.share && c.partners;
      return {
        source: c.diverse
          ? ["来源较多样","短缺时可转向别类资源"]
          : ["来源较集中","更受单一来源波动影响"],
        process: c.machine || heatWorks
          ? ["可利用部分扩大", c.machine ? "负担转到工具、时间与技能" : "需要燃料、控制与等待"]
          : c.heat && !c.fuel
            ? ["有火尚未形成收益","缺少燃料，仍需直接处理"]
            : ["可利用部分受限","保留直接咀嚼与处理负担"],
        share: shareWorks
          ? ["短缺缓冲较强","依赖伙伴、互惠与分配"]
          : c.share && !c.partners
            ? ["分享条件未成立","没有伙伴就不能跨个体缓冲"]
            : ["短缺缓冲较弱","个体承担当天获取结果"],
        total: (c.diverse && (c.machine || heatWorks) && shareWorks)
          ? ["多条路径共同扩大并稳定获得能量","新增燃料、时间、技能和伙伴依赖"]
          : (c.heat && !c.fuel)
            ? ["条件缺口：有火不等于自动获益","先要燃料与可加热食物"]
            : (c.share && !c.partners)
              ? ["条件缺口：分享需要伙伴","来源多样仍不能替代群体流动"]
              : ["只改变了部分环节","没有一项配置让整套策略全面变好"]
      };
    }

    function fillCell(el, pair){
      el.innerHTML = `<span class="status">${pair[0]}</span><span class="cost">${pair[1]}</span>`;
      if(pair[0].includes("缺口") || pair[0].includes("未形成") || pair[0].includes("未成立")) el.firstElementChild.className = "gap";
    }
    function render(col, key, announce){
      const f = feedback(configs[key]);
      ["source","process","share","total"].forEach(name => fillCell(document.getElementById(`${col}-${name}`), f[name]));
      if(announce) document.getElementById("live").textContent = `策略${col === "a" ? "甲" : col === "b" ? "乙" : "丙"}已更新。${f.total.join("；")}`;
    }
    ids.forEach((col,i) => {
      const select = document.getElementById(`choice-${col}`);
      order.forEach(key => select.add(new Option(configs[key].label,key)));
      select.value = defaults[i];
      select.addEventListener("change", () => render(col,select.value,true));
      render(col,select.value,false);
    });
    document.getElementById("reset").addEventListener("click", () => {
      ids.forEach((col,i) => {
        const select = document.getElementById(`choice-${col}`);
        select.value = defaults[i]; render(col,defaults[i],false);
      });
      document.getElementById("live").textContent = "已恢复起始对照。";
    });
  </script>
</body>
</html>
