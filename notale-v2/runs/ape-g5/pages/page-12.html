<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main{display:flex;flex-direction:column;gap:var(--sp-3)}
  .game-top{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);height:42px}
  .instruction{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--ink-soft)}
  .reset{min-height:40px;padding:var(--sp-2) var(--sp-4);color:#fff;font:700 var(--fs-label)/1.35 var(--font-sans);border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent);cursor:pointer}
  .board{position:relative;display:flex;flex-direction:column;gap:var(--sp-3);height:562px;min-height:0}
  .families{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-3);height:318px;transition:transform .35s ease}
  .family{position:relative;min-width:0;padding:24px 14px 12px!important;border-color:var(--line)!important;background:var(--paper)}
  .family>.bt{margin-top:-25px!important;font-size:var(--fs-body)!important}
  .family button{width:100%;height:100%;padding:0;border:0;background:transparent;color:inherit;text-align:left;font:inherit;cursor:pointer}
  .family button:focus-visible{outline:3px solid var(--focus);outline-offset:5px;border-radius:var(--radius-sm)}
  .family.is-target{border-color:var(--accent)!important;background:var(--accent-soft)}
  .question{min-height:48px;margin:0;color:var(--ink-soft);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .placed{display:flex;flex-direction:column;gap:7px;margin-top:8px}
  .chip{padding:7px 9px;border-left:4px solid var(--good);border-radius:var(--radius-sm);background:#eef4ed;font-size:var(--fs-label);font-weight:700;line-height:1.35}
  .chip small{display:block;margin-top:2px;color:var(--ink-soft);font-size:var(--fs-label);font-weight:500;line-height:1.35}
  .pool{display:grid;grid-template-columns:240px minmax(0,1fr) 260px;align-items:stretch;gap:var(--sp-3);height:228px}
  .pool-label{display:flex;flex-direction:column;justify-content:center;padding-left:var(--sp-4);border-left:4px solid var(--accent)}
  .pool-label strong{font-size:var(--fs-h2);line-height:1.35}.pool-label span{color:var(--ink-soft);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .evidence{position:relative;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:var(--sp-3) var(--sp-4);border:2px solid var(--line-strong);border-radius:var(--radius-md);background:var(--paper);box-shadow:var(--shadow);cursor:grab;user-select:none;touch-action:none}
  .evidence:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .species{display:flex;align-items:center;gap:10px;color:var(--accent);font-size:var(--fs-label);font-weight:800}.sil{font-size:28px;filter:grayscale(1)}
  .behavior{font-size:var(--fs-body);line-height:var(--lh-copy);font-weight:650}.verb{color:var(--accent-2);font-size:var(--fs-label);font-weight:800}
  .feedback{display:flex;align-items:center;padding:var(--sp-3);border-radius:var(--radius-md);background:var(--paper-2);color:var(--ink-soft);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .feedback[data-state="good"]{background:#e7f0e8}.feedback[data-state="warn"]{background:var(--accent-warm)}
  .combo{display:none;position:absolute;z-index:4;inset:54px 205px 20px;padding:var(--sp-4);border:3px solid var(--accent);border-radius:var(--radius-lg);background:rgb(255 253 248 / 98%);box-shadow:0 18px 50px rgb(23 33 43 / 18%)}
  .combo.show{display:flex;flex-direction:column;gap:var(--sp-3)}
  .combo h2{text-align:center;color:var(--accent)}
  .combo-items{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2) var(--sp-4)}
  .combo-item{padding:var(--sp-2) var(--sp-3);border-left:4px solid var(--accent-2);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .combo .claim{margin-top:auto;padding:var(--sp-3);background:var(--accent-soft);font-size:var(--fs-lead);font-weight:760;line-height:var(--lh-copy);text-align:center}
  .dragging{opacity:.72;transform:scale(1.02)}
  @media(prefers-reduced-motion:reduce){.families{transition:none}}
</style>
</head>
<body data-page="12" data-total="48">
<div id="stage">
<main id="main">
  <div class="game-top">
    <p class="instruction">拖动证据卡，放入它最直接支持的能力家族。也可聚焦卡片后用方向键选槽，再按 Enter。</p>
    <button class="reset" id="reset" type="button">重新拼图</button>
  </div>
  <section class="board k-classification" aria-label="能力证据分类游戏">
    <div class="families lv" style="--level:1" id="families">
      <section class="family box min0" data-family="规划"><div class="bt">规划</div><button type="button" aria-label="把当前证据归入规划"><p class="question">当前行动是否指向尚未发生的情境？</p><div class="placed"></div></button></section>
      <section class="family box min0" data-family="模仿"><div class="bt">模仿</div><button type="button" aria-label="把当前证据归入模仿"><p class="question">是否观察并重现了他者的动作？</p><div class="placed"></div></button></section>
      <section class="family box min0" data-family="交流"><div class="bt">交流</div><button type="button" aria-label="把当前证据归入交流"><p class="question">信号是否改变了同伴的信息或行动？</p><div class="placed"></div></button></section>
      <section class="family box min0" data-family="合作"><div class="bt">合作</div><button type="button" aria-label="把当前证据归入合作"><p class="question">结果是否依赖多个个体协调行动？</p><div class="placed"></div></button></section>
    </div>
    <div class="pool lv" style="--level:2">
      <div class="pool-label"><strong>行为证据</strong><span id="progress">尚有 8 张待分类</span></div>
      <div class="evidence no-pan" id="card" tabindex="0" role="button" aria-grabbed="false"><div class="species"><span class="sil" aria-hidden="true">◆</span><span id="species"></span></div><div class="behavior" id="behavior"></div><div class="verb" id="verb"></div></div>
      <div class="feedback" id="feedback" aria-live="polite">先看动物做了什么，再判断主要能力。</div>
    </div>
    <section class="combo" id="combo" aria-live="polite">
      <h2>人类组合</h2>
      <div class="combo-items">
        <div class="combo-item"><strong>更长跨度的规划</strong><br>把多个中间步骤连接到较远目标。</div>
        <div class="combo-item"><strong>更高保真的社会学习</strong><br>动作、规则和做法可被较准确地重复。</div>
        <div class="combo-item"><strong>更开放的交流</strong><br>可以组合信息，讨论不在眼前的对象与方案。</div>
        <div class="combo-item"><strong>更灵活的大规模合作</strong><br>借助角色和共同规则协调更多人。</div>
      </div>
      <p class="claim">关键不在于人类独占其中某一块，而在于这些能力能够彼此放大。</p>
    </section>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:12,kicker:"COGNITIVE MOSAIC",title:"不是谁独占能力，而是谁把能力拼在一起",take:"规划、模仿、交流和合作分布在多种动物中；人类优势来自特殊组合。"});
Deck.init({index:12,total:48});
(function(){
 const data=[
  {s:'松鸦',b:'会根据之后可能获得的食物，调整现在储藏什么。',v:'为稍后准备',f:'规划',why:'当前行动受到未来情境影响。'},
  {s:'黑猩猩',b:'在实验任务中，会选择并保留之后才有用的工具。',v:'现在选择，稍后使用',f:'规划',why:'当前选择连接到之后的任务。'},
  {s:'宽吻海豚',b:'观察示范后，能复制并非固定套路的身体动作。',v:'照着新示范做',f:'模仿',why:'观察另一个个体后再现动作形式。'},
  {s:'黑猩猩',b:'观察同伴操作物体后，会重现部分动作顺序。',v:'观察后重现',f:'模仿',why:'主要证据是动作重现。',second:'也涉及共同活动情境。'},
  {s:'蜜蜂',b:'舞蹈能让同伴获得食物方向与距离的信息。',v:'把位置信息交给同伴',f:'交流',why:'行为改变了同伴对目标位置的行动。'},
  {s:'长尾猴',b:'不同警报声会使同伴面对威胁时采取不同反应。',v:'信号引导不同反应',f:'交流',why:'信号与接收者的行为变化相联系。'},
  {s:'狼群',b:'集体捕猎时调整位置，使多个个体彼此配合。',v:'配合彼此的位置',f:'合作',why:'结果依赖多个个体的行动衔接。',second:'协调也会使用姿态等信号。'},
  {s:'黑猩猩',b:'会等待或招募伙伴，共同完成单独难做的动作。',v:'需要伙伴一起完成',f:'合作',why:'任务依赖伙伴共同参与。',second:'等待伙伴也涉及行动时机。'}];
 let state; const card=document.querySelector('#card'), feedback=document.querySelector('#feedback'), combo=document.querySelector('#combo');
 const families=[...document.querySelectorAll('.family')];
 function fresh(){return {i:0,placed:[],selected:0,grab:false}}
 function render(){const d=data[state.i]; families.forEach((el,i)=>el.classList.toggle('is-target',state.grab&&i===state.selected));
  document.querySelector('#progress').textContent=state.i<8?'尚有 '+(8-state.i)+' 张待分类':'分类完成';
  if(d){document.querySelector('#species').textContent=d.s;document.querySelector('#behavior').textContent=d.b;document.querySelector('#verb').textContent='线索：'+d.v;card.hidden=false}else card.hidden=true;
  families.forEach(el=>{const list=el.querySelector('.placed');list.innerHTML='';state.placed.filter(x=>x.f===el.dataset.family).forEach(x=>{const n=document.createElement('div');n.className='chip';n.innerHTML='✓ '+x.s+'<small>'+x.why+(x.second?' · 次要线索：'+x.second:'')+'</small>';list.appendChild(n)})});
 }
 function place(name){if(state.i>=data.length)return;const d=data[state.i];if(name===d.f){state.placed.push(d);state.i++;state.grab=false;feedback.dataset.state='good';feedback.textContent='已归入“'+name+'”：'+d.why;if(state.i===data.length){render();combo.classList.add('show');feedback.textContent='四类能力都已有行为证据。';card.setAttribute('aria-grabbed','false');return}render()}else{feedback.dataset.state='warn';feedback.textContent='再看线索：最直接的证据更接近“'+d.v+'”，还是“'+name+'”？';state.grab=false;render()}card.setAttribute('aria-grabbed','false')}
 families.forEach((el,i)=>{el.querySelector('button').addEventListener('click',()=>place(el.dataset.family));el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',e=>{e.preventDefault();place(el.dataset.family)})});
 card.draggable=true;card.addEventListener('dragstart',()=>{state.grab=true;card.classList.add('dragging');card.setAttribute('aria-grabbed','true');render()});card.addEventListener('dragend',()=>{state.grab=false;card.classList.remove('dragging');card.setAttribute('aria-grabbed','false');render()});
 card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!state.grab){state.grab=true;feedback.textContent='用左右方向键选择能力家族，再按 Enter 放下。';render()}else place(families[state.selected].dataset.family)}else if(state.grab&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();state.selected=(state.selected+(e.key==='ArrowRight'?1:3))%4;render()}else if(e.key==='Escape'){state.grab=false;feedback.textContent='已取消移动。';render()}});
 document.querySelector('#reset').addEventListener('click',()=>{state=fresh();combo.classList.remove('show');feedback.dataset.state='';feedback.textContent='先看动物做了什么，再判断主要能力。';render();card.focus()});
 state=fresh();render();
})();
</script>
</body>
</html>
