<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main{display:flex;flex-direction:column;gap:14px}
  .tradeoff-map{flex:1;grid-template-columns:minmax(0,1.55fr) 42px minmax(360px,.75fr);min-height:0}
  .tradeoff-map>.claim{height:100%;box-sizing:border-box;padding:14px 22px;border-left-width:8px;display:flex;flex-direction:column;gap:10px}
  .claim-line{font-size:var(--fs-lead);font-weight:800;line-height:1.35;text-align:center}
  .scale-rig{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:var(--radius-md);background:linear-gradient(180deg,var(--paper),var(--paper-2));box-shadow:inset 0 1px 0 #fff,0 8px 20px rgb(23 33 43 / 9%);overflow:hidden}
  .scale-beam{position:absolute;left:16%;right:16%;top:120px;height:12px;border:1px solid var(--line-strong);border-radius:999px;background:linear-gradient(#f8f5ed,#aeb3ae);box-shadow:0 4px 6px rgb(23 33 43 / 18%),inset 0 1px #fff;transform:rotate(var(--tilt,0deg));transform-origin:center;transition:transform 520ms cubic-bezier(.2,.75,.25,1)}
  .scale-beam::after{content:"";position:absolute;left:50%;top:7px;width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:108px solid #737c78;transform:translateX(-50%)}
  .hanger{position:absolute;top:7px;width:2px;height:69px;background:var(--line-strong)}
  .hanger::after{content:"";position:absolute;left:50%;bottom:-5px;width:230px;height:34px;border:3px solid var(--line-strong);border-top:0;border-radius:0 0 120px 120px;transform:translateX(-50%);background:rgb(255 253 248 / 72%)}
  .hanger.left{left:8%}.hanger.right{right:8%}
  .pan-label{position:absolute;top:195px;width:265px;text-align:center;font-size:var(--fs-label);font-weight:760;line-height:1.35;color:var(--ink-soft)}
  .pan-label.left{left:3%}.pan-label.right{right:3%}
  .dropzone{position:absolute;left:4%;top:230px;width:250px;min-height:78px;padding:10px 14px;box-sizing:border-box;border:2px dashed var(--accent);border-radius:var(--radius-sm);background:rgb(220 239 238 / 62%);font-size:var(--fs-sec);line-height:var(--lh-sec);text-align:center}
  .cost{position:absolute;right:4%;top:230px;width:250px;min-height:78px;padding:10px 14px;box-sizing:border-box;border:1px solid var(--accent-2);border-radius:var(--radius-sm);background:var(--accent-warm);font-size:var(--fs-sec);font-weight:650;line-height:var(--lh-sec);opacity:.35;transform:translateY(-12px);transition:opacity 240ms ease,transform 240ms ease}
  .cost.on{opacity:1;transform:none}
  .relation{position:absolute;left:8%;right:8%;bottom:14px;padding-top:10px;border-top:1px solid var(--line);color:var(--ink-soft);font-size:var(--fs-sec);font-weight:620;line-height:var(--lh-sec);text-align:center}
  .supports{gap:9px!important}
  .support{padding:8px 12px!important;transition:border-color 200ms ease,background 200ms ease,box-shadow 200ms ease}
  .feature{width:100%;min-height:70px;padding:7px 12px;text-align:left;color:var(--text);font:inherit;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:linear-gradient(180deg,#fffdf8,#ebe7dc);box-shadow:0 5px 10px rgb(23 33 43 / 13%),inset 0 1px #fff,inset 0 -1px rgb(83 97 108 / 18%);cursor:grab;transition:transform 180ms ease,box-shadow 180ms ease}
  .feature:active{cursor:grabbing}.feature.is-active{background:linear-gradient(180deg,#d7e9e7,#edf7f6);box-shadow:inset 0 4px 8px rgb(23 33 43 / 16%),0 2px 5px rgb(23 33 43 / 9%)}
  .feature strong{display:block;font-size:var(--fs-body);line-height:1.35}.feature span{display:block;margin-top:2px;color:var(--ink-soft);font-size:var(--fs-label);line-height:1.35}
  .support.related{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px rgb(0 109 119 / 12%)}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px}
  .instruction,.status{font-size:var(--fs-sec);line-height:var(--lh-sec)}.instruction{color:var(--ink-soft)}.status{flex:1;font-weight:700;color:var(--accent)}
  .reset{min-height:42px;padding:8px 20px;color:#fff;font:700 var(--fs-label)/1.35 var(--font-sans);border:1px solid var(--accent);border-radius:var(--radius-sm);background:linear-gradient(180deg,#07818b,#005b63);box-shadow:0 4px 8px rgb(23 33 43 / 16%),inset 0 1px rgb(255 255 255 / 35%);cursor:pointer}
  .reset:active{transform:translateY(1px);box-shadow:inset 0 3px 6px rgb(23 33 43 / 20%)}
  .final{color:var(--accent);opacity:0;transition:opacity 300ms ease}.final.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.scale-beam,.cost,.support,.feature,.final{transition:none!important}}
</style>
</head>
<body data-page="13" data-total="48">
<div id="stage">
<main id="main">
  <section class="k-generalization tradeoff-map" aria-label="演化收益与成本的概念天平">
    <div class="claim min0">
      <div class="claim-line">每种演化收益都伴随成本</div>
      <div class="scale-rig" id="scaleRig">
        <div class="scale-beam" id="beam" aria-hidden="true"><i class="hanger left"></i><i class="hanger right"></i></div>
        <div class="pan-label left">在特定环境中的收益</div>
        <div class="pan-label right">身体与生活史成本</div>
        <div class="dropzone" id="dropzone" aria-live="polite">把一枚特征牌放到这里</div>
        <div class="cost" id="cost">右盘会同步出现成本</div>
        <div class="relation" id="relation">收益、成本与其他特征会一起显现。</div>
      </div>
      <div class="claim-line final" id="finalClaim">没有脱离成本的单项升级</div>
    </div>
    <div class="trunk" aria-hidden="true"></div>
    <div class="supports min0" id="supports">
      <div class="support" data-key="walk"><button class="feature no-pan" type="button" data-key="walk"><strong>直立与双足行走</strong><span>移动与腾出上肢</span></button></div>
      <div class="support" data-key="brain"><button class="feature no-pan" type="button" data-key="brain"><strong>昂贵的大脑</strong><span>规划、学习、交流与合作</span></button></div>
      <div class="support" data-key="child"><button class="feature no-pan" type="button" data-key="child"><strong>长童年</strong><span>更长的学习与社会化窗口</span></button></div>
      <div class="support" data-key="birth"><button class="feature no-pan" type="button" data-key="birth"><strong>分娩</strong><span>出生前后延续发育</span></button></div>
    </div>
  </section>
  <div class="toolbar">
    <div class="instruction">拖到左盘；也可聚焦后按 Enter 或空格。方向键切换特征牌。</div>
    <div class="status" id="status" aria-live="polite">先选一项收益，查看它牵连的成本。</div>
    <button class="reset" id="reset" type="button">重置天平</button>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 13,
  kicker: "EVOLUTIONARY TRADE-OFFS",
  title: "得到一种能力，也承担它的成本",
  take: "每种演化收益都伴随成本：直立、脑、长童年和分娩彼此牵连。"
});
Deck.init({ index: 13, total: 48 });

const facts={
  walk:{benefit:"部分地面情境中改善移动效率，并腾出上肢。",cost:"脊柱、骨盆、膝与足改变受力；稳定与灵活需要折中。",links:["birth"],relation:"骨盆同时参与行走与产道形成，不由单一功能决定。"},
  brain:{benefit:"支持更灵活的规划、学习、交流与合作。",cost:"持续消耗能量；出生后仍需长期发育与照料。",links:["child","birth"],relation:"脑发育、出生状态和照料需求彼此相关。"},
  child:{benefit:"提供更长的学习、练习与社会化窗口。",cost:"依赖期延长，需要持续投入食物、保护与时间。",links:["brain"],relation:"成长牵连脑发育，也依靠群体共同照料。"},
  birth:{benefit:"在母体内完成关键发育，出生后继续成长。",cost:"母婴负担较高，受骨盆、胎儿、软组织与姿势共同影响。",links:["walk","brain","child"],relation:"直立、脑和长童年都有关，但没有单一原因可以独自解释。"}
};
const buttons=[...document.querySelectorAll('.feature')], supports=[...document.querySelectorAll('.support')];
const dropzone=document.querySelector('#dropzone'), cost=document.querySelector('#cost'), relation=document.querySelector('#relation'), beam=document.querySelector('#beam'), status=document.querySelector('#status'), finalClaim=document.querySelector('#finalClaim');
const explored=new Set(); let current=null, drag=null;
function select(key){
  const f=facts[key]; current=key; explored.add(key);
  buttons.forEach(b=>b.classList.toggle('is-active',b.dataset.key===key));
  supports.forEach(s=>s.classList.toggle('related',f.links.includes(s.dataset.key)));
  dropzone.textContent=f.benefit; cost.textContent=f.cost; cost.classList.add('on'); relation.textContent=f.relation;
  beam.style.setProperty('--tilt', key==='birth' ? '3deg' : '-2deg');
  if(explored.size===4){finalClaim.classList.add('show');status.textContent='这不是四笔独立账，而是一套相互牵连的折中。';}
  else status.textContent='成本不等于失败，它是这套身体的一部分。';
}
function reset(){
  explored.clear();current=null;buttons.forEach(b=>b.classList.remove('is-active'));supports.forEach(s=>s.classList.remove('related'));
  dropzone.textContent='把一枚特征牌放到这里';cost.textContent='右盘会同步出现成本';cost.classList.remove('on');relation.textContent='收益、成本与其他特征会一起显现。';beam.style.setProperty('--tilt','0deg');finalClaim.classList.remove('show');status.textContent='先选一项收益，查看它牵连的成本。';
}
buttons.forEach((b,i)=>{
  b.addEventListener('click',()=>select(b.dataset.key));
  b.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();buttons[(i+1)%buttons.length].focus()}if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();buttons[(i+buttons.length-1)%buttons.length].focus()}});
  b.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={b,start:Deck.pt(document.querySelector('#main'),e)};b.setPointerCapture(e.pointerId)});
  b.addEventListener('pointermove',e=>{if(!drag||drag.b!==b)return;const p=Deck.pt(document.querySelector('#main'),e);b.style.transform=`translate(${p.x-drag.start.x}px,${p.y-drag.start.y}px) scale(1.02)`});
  b.addEventListener('pointerup',e=>{if(!drag||drag.b!==b)return;const p=Deck.pt(dropzone,e);const inside=p.x>=0&&p.y>=0&&p.x<=dropzone.clientWidth&&p.y<=dropzone.clientHeight;b.style.transform='';drag=null;if(inside)select(b.dataset.key)});
});
document.querySelector('#reset').addEventListener('click',reset);
</script>
</body>
</html>
