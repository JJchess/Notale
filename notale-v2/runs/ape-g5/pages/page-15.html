<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main{display:flex;flex-direction:column;gap:16px}
  .relay-process{--step-count:6;height:116px;gap:30px;grid-template-columns:repeat(5,minmax(0,1fr) 0) minmax(0,1fr)}
  .relay-process>.step{padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
  .relay-process>.arw::after{left:-27px}
  .station-mark{width:48px;height:36px;display:block}
  .station-mark path{fill:none;stroke:var(--line-strong);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .step.is-current .station-mark path{stroke:var(--accent)}
  .step.is-done .station-mark path{stroke:var(--ink-soft)}
  .relay-process .label{white-space:nowrap}
  .workbench{position:relative;flex:1;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--paper);box-shadow:var(--shadow)}
  .canvas-wrap{position:absolute;inset:0 300px 0 0;min-width:0;background:linear-gradient(var(--paper),var(--paper-2));touch-action:none}
  #gesture{width:100%;height:100%;display:block;cursor:crosshair;outline-offset:-5px}
  .side{position:absolute;inset:0 0 0 auto;width:300px;box-sizing:border-box;padding:24px;display:flex;flex-direction:column;gap:16px;border-left:1px solid var(--line);background:var(--paper)}
  .phase{color:var(--accent);font-size:var(--fs-h2);font-weight:760;line-height:1.35}
  .instruction{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--ink-soft)}
  .status{min-height:50px;font-size:var(--fs-sec);line-height:var(--lh-sec);padding-left:12px;border-left:3px solid var(--accent)}
  .actions{margin-top:auto;display:flex;flex-direction:column;gap:10px}
  .actions button{min-height:44px;padding:8px 16px;border:1px solid var(--accent);border-radius:var(--radius-sm);font:700 var(--fs-label)/1.35 var(--font-sans);cursor:pointer}
  #finish{color:#fff;background:var(--accent)}
  #reset{color:var(--accent);background:var(--paper)}
  .legend{position:absolute;left:22px;bottom:18px;display:none;gap:20px;padding:8px 12px;border-radius:var(--radius-sm);background:rgb(255 253 248 / 88%);font-size:var(--fs-label);font-weight:680}
  .legend.show{display:flex}.sw{display:inline-block;width:28px;height:4px;margin-right:7px;vertical-align:middle;border-radius:9px}.sw.first{background:var(--line-strong)}.sw.last{background:var(--accent-2)}
  .kbd{font-size:var(--fs-label);line-height:1.35;color:var(--ink-soft)}
</style>
</head>
<body data-page="15" data-total="48">
<div id="stage">
<main id="main">
  <section class="k-process relay-process" aria-label="信息跨代传递流程">
    <div class="axis" aria-hidden="true"></div>
    <div class="step is-current" data-i="0"><svg class="station-mark" viewBox="0 0 48 36" aria-hidden="true"><path d="M5 27 C13 5 22 32 31 10 S42 14 44 6"/></svg><span class="label">出现手势</span></div><div class="arw" aria-hidden="true"></div>
    <div class="step" data-i="1"><svg class="station-mark" viewBox="0 0 48 36" aria-hidden="true"><path d="M5 27 C13 5 22 32 31 10 S42 14 44 6"/></svg><span class="label">被观察</span></div><div class="arw" aria-hidden="true"></div>
    <div class="step" data-i="2"><svg class="station-mark" viewBox="0 0 48 36" aria-hidden="true"><path d="M5 27 C13 5 22 32 31 10 S42 14 44 6"/></svg><span class="label">留下记忆</span></div><div class="arw" aria-hidden="true"></div>
    <div class="step" data-i="3"><svg class="station-mark" viewBox="0 0 48 36" aria-hidden="true"><path d="M5 27 C13 5 22 32 31 10 S42 14 44 6"/></svg><span class="label">被复制</span></div><div class="arw" aria-hidden="true"></div>
    <div class="step" data-i="4"><svg class="station-mark" viewBox="0 0 48 36" aria-hidden="true"><path d="M5 27 C13 5 22 32 31 10 S42 14 44 6"/></svg><span class="label">成为新范本</span></div><div class="arw" aria-hidden="true"></div>
    <div class="step" data-i="5"><svg class="station-mark" viewBox="0 0 48 36" aria-hidden="true"><path d="M5 27 C13 5 22 32 31 10 S42 14 44 6"/></svg><span class="label">再次传递</span></div>
  </section>
  <section class="workbench" aria-label="手势接力操作区">
    <div class="canvas-wrap no-pan"><canvas id="gesture" tabindex="0" role="application" aria-label="手势画布。范本每轮只出现一次；用指针绘制，或按回车开始与结束并用方向键移动笔尖。终点叠加最初与最后轨迹。"></canvas><div class="legend" id="legend"><span><i class="sw first"></i>最初版本</span><span><i class="sw last"></i>最后版本</span></div></div>
    <aside class="side">
      <div class="phase" id="phase">观看范本</div>
      <p class="instruction" id="instruction">沿着移动光点看完整条轨迹。范本随后会隐去。</p>
      <div class="status" id="status" aria-live="polite">信息先进入观察者，才能继续传递。</div>
      <div class="kbd">键盘：回车开始或结束；方向键移动笔尖。</div>
      <div class="actions"><button id="finish" type="button" disabled>完成这一棒</button><button id="reset" type="button">重新开始</button></div>
    </aside>
  </section>
</main>
</div>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:15,kicker:"CULTURAL RELAY",title:"一条信息，怎样进入下一双手？",take:"信息只有被观察、学习和再次传递，才可能越过一个人的生命。"});
Deck.init({index:15,total:48});
(function(){
  const cv=document.getElementById('gesture'),ctx=cv.getContext('2d'),phase=document.getElementById('phase'),instruction=document.getElementById('instruction'),status=document.getElementById('status'),finish=document.getElementById('finish'),reset=document.getElementById('reset'),legend=document.getElementById('legend');
  const steps=[...document.querySelectorAll('.relay-process .step')];
  const initial=[[.13,.66],[.18,.31],[.29,.22],[.38,.58],[.49,.70],[.58,.40],[.68,.27],[.77,.50],[.86,.34]];
  let state,tl=null,down=false,keyDrawing=false,keyPt={x:0,y:0};
  function fresh(){return {round:0,mode:'observe',versions:[initial.map(p=>p.slice())],draw:[]};}
  function size(){Deck.fit(cv);return {w:cv.clientWidth,h:cv.clientHeight};}
  function map(points){const s=size();return points.map(p=>({x:p[0]*s.w,y:p[1]*s.h}));}
  function line(points,color,width,portion=1){if(points.length<2)return;const n=Math.max(2,Math.ceil(points.length*portion));ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<n;i++)ctx.lineTo(points[i].x,points[i].y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}
  function clear(){const s=size();ctx.clearRect(0,0,s.w,s.h);}
  function drawCurrent(){clear();if(state.mode==='draw')line(state.draw,Deck.token('--accent'),5);if(state.mode==='compare'){line(map(state.versions[0]),Deck.token('--line-strong'),7);line(map(state.versions.at(-1)),Deck.token('--accent-2'),4);}}
  function setSteps(i){steps.forEach((el,n)=>{el.classList.toggle('is-done',n<i);el.classList.toggle('is-current',n===i);});}
  function observe(){state.mode='observe';finish.disabled=true;legend.classList.remove('show');phase.textContent=state.round?'观看上一棒':'观看范本';instruction.textContent='沿着移动光点看完整条轨迹。范本随后会隐去。';status.textContent=state.round?'下一位接到的是上一位留下的版本。':'信息先进入观察者，才能继续传递。';setSteps(state.round?5:1);const pts=map(state.versions.at(-1));clear();if(tl)tl.kill();const prog={v:Deck.reduced()?1:0};tl=gsap.timeline({defaults:{ease:'none'},onComplete:memory});tl.to(prog,{v:1,duration:Deck.reduced()?.05:1.7,onUpdate(){clear();line(pts,Deck.token('--accent'),5,prog.v);const j=Math.min(pts.length-1,Math.floor(prog.v*(pts.length-1)));ctx.beginPath();ctx.arc(pts[j].x,pts[j].y,8,0,Math.PI*2);ctx.fillStyle=Deck.token('--accent-2');ctx.fill();}}).to(cv,{opacity:0,duration:Deck.reduced()?.01:.22},'>').set(cv,{opacity:1});}
  function memory(){clear();state.mode='memory';setSteps(2);phase.textContent='留下记忆';instruction.textContent='范本已经隐去。现在只凭刚才留下的记忆复现。';status.textContent='外部轨迹消失后，复制依赖观察者留下的版本。';gsap.timeline({defaults:{duration:Deck.reduced()?.01:.28,ease:'power2.out'}}).fromTo('.canvas-wrap',{opacity:.45},{opacity:1}).call(beginDraw);}
  function beginDraw(){state.mode='draw';state.draw=[];setSteps(3);phase.textContent='被复制';instruction.textContent='在画布上连续画出刚才的手势，再完成这一棒。';status.textContent='不会吸附或纠正；你留下的轨迹就是下一棒范本。';}
  function add(p){if(state.mode!=='draw')return;const a=state.draw.at(-1);if(!a){state.draw.push(p);}else{const dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy),gap=7;for(let k=gap;k<=d&&k/gap<15;k+=gap)state.draw.push({x:a.x+dx*k/d,y:a.y+dy*k/d});}finish.disabled=state.draw.length<8;drawCurrent();}
  function normalize(points){if(points.length<8)return null;const xs=points.map(p=>Lec.P.finiteNumber(p.x,0)),ys=points.map(p=>Lec.P.finiteNumber(p.y,0));const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),bw=maxX-minX,bh=maxY-minY;if(bw<20||bh<20)return null;const pad=.14,scale=Math.min((1-2*pad)/bw,(1-2*pad)/bh);const cx=(minX+maxX)/2,cy=(minY+maxY)/2;return points.map(p=>[(p.x-cx)*scale+.5,(p.y-cy)*scale+.5]);}
  function complete(){const v=normalize(state.draw);if(!v){status.textContent='请重新留下完整轨迹。';return;}state.versions.push(v);state.round++;setSteps(4);if(state.round>=4){state.mode='compare';phase.textContent='首尾对照';instruction.textContent='重叠的走向被保留；错开的线段发生偏移；只在初版出现的部分已经消失。';status.textContent='最后版本来自连续接力，而不是直接取回最初版本。';finish.disabled=true;legend.classList.add('show');setSteps(5);drawCurrent();return;}phase.textContent='成为新范本';instruction.textContent='这一棒只统一位置和大小，不修正局部形状。';status.textContent='复制品现在成为下一位唯一可见的范本。';finish.disabled=true;gsap.timeline({defaults:{duration:Deck.reduced()?.01:.35,ease:'power2.out'}}).to(cv,{scale:.96,opacity:.55}).to(cv,{scale:1,opacity:1}).call(observe);}
  cv.addEventListener('pointerdown',e=>{if(state.mode!=='draw')return;down=true;cv.setPointerCapture(e.pointerId);state.draw=[];add(Deck.pt(cv,e));});cv.addEventListener('pointermove',e=>{if(down)add(Deck.pt(cv,e));});cv.addEventListener('pointerup',()=>down=false);
  cv.addEventListener('keydown',e=>{if(state.mode!=='draw')return;if(e.key==='Enter'||e.key===' '){e.preventDefault();keyDrawing=!keyDrawing;if(keyDrawing){state.draw=[];const s=size();keyPt={x:s.w/2,y:s.h/2};add(keyPt);}return;}if(keyDrawing&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const d=12;keyPt={x:keyPt.x+(e.key==='ArrowRight'?d:e.key==='ArrowLeft'?-d:0),y:keyPt.y+(e.key==='ArrowDown'?d:e.key==='ArrowUp'?-d:0)};add(keyPt);}});
  finish.addEventListener('click',complete);reset.addEventListener('click',()=>{if(tl)tl.kill();state=fresh();observe();cv.focus();});Deck.onResize(drawCurrent);state=fresh();observe();
})();
</script>
</body>
</html>
