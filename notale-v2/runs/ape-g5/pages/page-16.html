<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;gap:24px}
    .lexicon{width:410px;height:620px;box-sizing:border-box;padding:20px;display:flex;flex-direction:column}
    .lex-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
    .lex-hint{font-size:var(--fs-label);font-weight:650;color:var(--ink-soft)}
    .wordbank{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;outline:none}
    .word{min-width:0;padding:7px 5px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper-2);text-align:center;cursor:grab;user-select:none}
    .word .glyph{display:block;font-size:25px;font-weight:780;line-height:1.05;color:var(--accent)}
    .word .meaning{display:block;font-size:var(--fs-label);font-weight:680;line-height:1.35;white-space:nowrap}
    .word.is-held{outline:3px solid var(--accent-2);outline-offset:1px;background:var(--accent-warm)}
    .wordbank:focus{outline:3px solid var(--focus);outline-offset:4px;border-radius:var(--radius-sm)}
    .lex-bottom{margin-top:auto}
    .instruction{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--ink-soft);margin:10px 0}
    .reset{min-height:42px;padding:8px 20px;color:#fff;font:700 var(--fs-label) var(--font-sans);border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent);cursor:pointer}
    .class-wrap{flex:1;min-width:0;height:620px}
    .class-root{height:100%;box-sizing:border-box;padding:18px 18px 14px}
    .class-root>.bt{font-size:var(--fs-h2)}
    .branch-note{position:absolute;right:18px;top:12px;font-size:var(--fs-label);font-weight:720;color:var(--accent)}
    .tracks{display:flex;flex-direction:column;gap:7px}
    .track{display:grid;grid-template-columns:126px 210px minmax(250px,1fr) 170px;gap:10px;align-items:center;min-height:92px;padding:8px 10px;box-sizing:border-box;border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--paper);opacity:.54}
    .track.is-current{opacity:1;border-left-color:var(--accent);box-shadow:0 0 0 2px rgb(0 109 119 / 10%)}
    .track.is-done{opacity:1;border-left-color:var(--good);background:rgb(57 115 79 / 5%)}
    .kind{font-size:var(--fs-h2);font-weight:760;line-height:1.25}
    .scene{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--ink-soft)}
    .slot{min-height:58px;box-sizing:border-box;padding:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;border:2px dashed var(--line-strong);border-radius:var(--radius-sm);background:var(--bg);outline:none}
    .slot:focus{border-style:solid;border-color:var(--focus);box-shadow:0 0 0 3px rgb(0 109 119 / 15%)}
    .slot[aria-disabled="true"]{cursor:not-allowed}
    .placed{padding:4px 7px;font-size:var(--fs-label);font-weight:720;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
    .placed.selected{outline:2px solid var(--accent-2)}
    .placed.wrong{color:var(--warn);border-color:var(--warn);background:var(--accent-warm)}
    .empty{font-size:var(--fs-label);color:var(--ink-soft)}
    .basis{font-size:var(--fs-label);font-weight:700;line-height:1.4}
    .basis b{display:block;color:var(--accent)}
    .feedback{grid-column:2/-1;margin-top:-4px;font-size:var(--fs-sec);line-height:1.35;color:var(--ink-soft)}
    .final{margin-top:8px;padding:8px 12px;font-size:var(--fs-sec);font-weight:700;line-height:1.4;border-left:4px solid var(--accent);background:var(--accent-soft)}
  </style>
</head>
<body data-page="16" data-total="48">
  <div id="stage"><main id="main">
    <section class="panel lexicon min0" aria-labelledby="lex-title">
      <div class="lex-head"><h2 id="lex-title">共享信号词典</h2><span class="lex-hint">字形意义来自共同约定</span></div>
      <div id="wordbank" class="wordbank no-pan" role="listbox" tabindex="0" aria-label="共享信号词典；方向键选择，回车拿取"></div>
      <div class="lex-bottom">
        <p id="status" class="instruction" aria-live="polite">先处理“眼前报告”。点选一个符号，再点消息槽放入。</p>
        <button id="reset" class="reset" type="button">重置全部</button>
      </div>
    </section>
    <section class="k-classification class-wrap min0" aria-label="符号表达的四类功能">
      <div class="box class-root lv" style="--level:0">
        <div class="bt">群体共享的符号表达</div><span class="branch-note">四类是功能分类，不是先后阶段</span>
        <div id="tracks" class="tracks"></div>
        <div id="final" class="final" hidden>同一部共享词典，通过不同组合，可以讨论事实、未来行动、共同约定和可能情境。</div>
      </div>
    </section>
  </main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:16,kicker:"SHARED SYMBOLS",title:"符号让不在场的事进入共同讨论",take:"符号不只替眼前事物贴标签；共享的符号还能把别处、未来、规则和未发生的可能带进当前讨论。"});
    Deck.init({index:16,total:48});
    const words=[['△','水源'],['○','此处'],['⌁','有'],['⊙','明日'],['→','前往'],['□','营地'],['☾','夜间'],['⊘','不得离开'],['◇','如果'],['≋','风暴'],['∴','那么'],['↩','留在']];
    const tasks=[
      {kind:'眼前报告',scene:'大家已看见营地旁的水源',target:['此处','有','水源'],where:'对象在眼前',fn:'报告当前事实',feedback:'这条消息报告眼前情况；对象就在此时此地。'},
      {kind:'计划',scene:'群体约定明天去取水',target:['明日','前往','水源'],where:'对象不在眼前',fn:'协调未来行动',feedback:'符号把明日和别处的水源带进当前讨论，群体可以提前协调行动。'},
      {kind:'规则',scene:'规定夜间不能独自离营',target:['夜间','不得离开','营地'],where:'对象不在眼前',fn:'建立共同约定',feedback:'这条消息不是描述眼前事实，而是在建立可共同执行的规则。'},
      {kind:'假设',scene:'讨论风暴可能到来时怎么办',target:['如果','风暴','那么','留在','营地'],where:'对象不在眼前',fn:'连接条件与结果',feedback:'群体正在讨论一个可能不发生的情境，并为它预先安排结果。'}
    ];
    const glyphByMeaning=Object.fromEntries(words.map(w=>[w[1],w[0]]));
    const initial=()=>({active:0,held:null,cursor:0,slots:tasks.map(()=>[]),done:tasks.map(()=>false)}); let state=initial();
    const bank=document.querySelector('#wordbank'),tracks=document.querySelector('#tracks'),status=document.querySelector('#status'),final=document.querySelector('#final');
    words.forEach(([g,m],i)=>{const el=document.createElement('div');el.className='word';el.dataset.i=i;el.role='option';el.draggable=true;el.setAttribute('aria-label',g+'，'+m);el.innerHTML=`<span class="glyph">${g}</span><span class="meaning">${m}</span>`;el.onclick=()=>hold(i);el.ondragstart=e=>{hold(i);e.dataTransfer.setData('text/plain',m)};bank.append(el)});
    tasks.forEach((t,i)=>{const row=document.createElement('div');row.className='track';row.innerHTML=`<div class="kind">${t.kind}</div><div class="scene">${t.scene}</div><div class="slot no-pan" tabindex="0" role="button" aria-label="${t.kind}消息槽" data-i="${i}"></div><div class="basis"><b class="where">待判断</b><span class="fn">待组合</span></div><div class="feedback">组合词典中的符号，回应这个情境。</div>`;tracks.append(row);const slot=row.querySelector('.slot');slot.onclick=()=>place(i);slot.ondragover=e=>e.preventDefault();slot.ondrop=e=>{e.preventDefault();place(i)};slot.onkeydown=e=>slotKey(e,i)});
    function hold(i){if(state.active>=tasks.length)return;state.held=i;state.cursor=i;status.textContent=`已拿取“${words[i][1]}”。点当前消息槽放入。`;render()}
    function place(i){if(i!==state.active){status.textContent='请先完成当前亮起的分类轨道。';return}if(state.held===null){if(state.slots[i].length){state.slots[i].selected=(state.slots[i].selected??state.slots[i].length-1);render()}else status.textContent='先从词典拿取一个符号。';return}const meaning=words[state.held][1],t=tasks[i];if(!t.target.includes(meaning)){status.textContent=`“${meaning}”不适合这个情境。请按情境选择需要的时间、地点、规则词或条件词。`;state.held=null;render();return}state.slots[i].push(meaning);state.slots[i].selected=state.slots[i].length-1;state.held=null;check(i);render()}
    function slotKey(e,i){if(e.key==='Enter'||e.key===' '){e.preventDefault();place(i)}else if(e.key==='Escape'){state.held=null;status.textContent='已取消拿取。';render()}else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&state.slots[i].length){e.preventDefault();let a=state.slots[i],p=a.selected??a.length-1,q=Deck.clamp(p+(e.key==='ArrowLeft'?-1:1),0,a.length-1);if(q!==p)[a[p],a[q]]=[a[q],a[p]];a.selected=q;check(i);render()}else if(e.key==='Backspace'&&state.slots[i].length){e.preventDefault();state.slots[i].pop();check(i);render()}}
    function check(i){const a=state.slots[i],t=tasks[i],exact=a.length===t.target.length&&a.every((v,j)=>v===t.target[j]);if(exact){state.done[i]=true;state.active++;status.textContent=t.feedback+(state.active<4?' 继续下一类。':'');}}
    function render(){[...bank.children].forEach((el,i)=>{el.classList.toggle('is-held',i===state.held);el.setAttribute('aria-selected',i===state.held)});[...tracks.children].forEach((row,i)=>{row.classList.toggle('is-current',i===state.active);row.classList.toggle('is-done',state.done[i]);const slot=row.querySelector('.slot'),a=state.slots[i],t=tasks[i];slot.setAttribute('aria-disabled',i!==state.active);slot.innerHTML=a.length?a.map((m,j)=>`<span class="placed ${j===(a.selected??-1)?'selected':''} ${m!==t.target[j]?'wrong':''}">${glyphByMeaning[m]} ${m}</span>`).join(''):'<span class="empty">把符号放在这里</span>';row.querySelector('.where').textContent=state.done[i]?t.where:'待判断';row.querySelector('.fn').textContent=state.done[i]?t.fn:'待组合';row.querySelector('.feedback').textContent=state.done[i]?t.feedback:(a.some((m,j)=>m!==t.target[j])?'符号可用，但位置需要调整；用左右方向键移动。':'组合词典中的符号，回应这个情境。')});final.hidden=state.active<4}
    bank.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();state.cursor=(state.cursor+1)%words.length;hold(state.cursor)}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();state.cursor=(state.cursor+words.length-1)%words.length;hold(state.cursor)}else if(e.key==='Enter'||e.key===' '){e.preventDefault();hold(state.cursor)}else if(e.key==='Escape'){state.held=null;render()}};
    document.querySelector('#reset').onclick=()=>{state=initial();status.textContent='先处理“眼前报告”。点选一个符号，再点消息槽放入。';render()};render();
  </script>
</body>
</html>
