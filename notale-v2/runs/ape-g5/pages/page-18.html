<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main{display:flex;flex-direction:column;gap:14px}
  .process-wrap{height:142px;position:relative}
  .k-process{--step-count:6;height:100%;gap:0;grid-template-columns:repeat(5,minmax(0,1fr) 28px) minmax(0,1fr)}
  .k-process>.step{padding:14px 10px;display:flex;flex-direction:column;justify-content:center;text-align:center}
  .step b{font-size:var(--fs-sec);line-height:1.35}.step small{font-size:var(--fs-label);line-height:1.35;color:var(--ink-soft);margin-top:5px}
  .k-process>.arw::after{left:-27px}
  .workbench{height:224px;display:flex;gap:16px;min-width:0}
  .demo{flex:1.45;min-width:0;padding:16px 20px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper);position:relative;overflow:hidden}
  .demo-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .demo-head h2{font-size:var(--fs-h2)}
  .stage-line{height:104px;display:flex;align-items:center;justify-content:center;gap:30px;border-radius:var(--radius-sm);background:var(--paper-2)}
  .object{width:68px;height:68px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);border:3px solid var(--accent);font-size:34px;font-weight:800;transition:transform 520ms cubic-bezier(.22,.75,.28,1),background 220ms ease-out}
  .object.move-right{transform:translateX(95px) rotate(90deg)}.object.move-left{transform:translateX(-95px) rotate(-90deg)}
  .motion-arrow{font-size:34px;color:var(--accent);font-weight:800}
  .feedback{width:390px;min-width:0;padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper)}
  .feedback p{font-size:var(--fs-sec);line-height:var(--lh-sec);min-height:46px}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  button{min-height:40px;padding:7px 14px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--paper);color:var(--text);font:700 var(--fs-label)/1.35 var(--font-sans);cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{opacity:.42;cursor:not-allowed}
  .compare{height:210px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper);overflow:hidden}
  .band{display:grid;grid-template-columns:170px repeat(4,1fr) 120px;height:47px;align-items:stretch;border-bottom:1px solid var(--line)}
  .band:last-child{border-bottom:0}.band>*{display:flex;align-items:center;justify-content:center;padding:8px;border-right:1px solid var(--line);min-width:0}.band>*:last-child{border-right:0}
  .band-label{font-size:var(--fs-sec);font-weight:760;justify-content:flex-start!important}.act{font-size:var(--fs-label);line-height:1.35;text-align:center;gap:5px}.act.bad{background:var(--accent-warm);color:var(--warn)}.act.good{background:var(--accent-soft);color:var(--good)}
  .score{font-size:var(--fs-label);font-weight:780;color:var(--accent)}
  .compare-note{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:20px}.compare-note p{font-size:var(--fs-sec);line-height:var(--lh-sec)}
  @media (prefers-reduced-motion:reduce){.object{transition:none!important}}
</style>
</head>
<body data-page="18" data-total="48">
<div id="stage"><main id="main">
  <section class="process-wrap" aria-label="教学传递过程">
    <div class="k-process" id="process">
      <div class="axis"></div>
      <div class="step is-current"><b>共同注意</b><small>看同一步</small></div><div class="arw"></div>
      <div class="step"><b>示范动作</b><small>看见过程</small></div><div class="arw"></div>
      <div class="step"><b>学习者尝试</b><small>暴露偏差</small></div><div class="arw"></div>
      <div class="step"><b>对照目标</b><small>逐项比较</small></div><div class="arw"></div>
      <div class="step"><b>指出偏差</b><small>定位差异</small></div><div class="arw"></div>
      <div class="step"><b>修正再传</b><small>阻止累积</small></div>
    </div>
  </section>
  <section class="workbench">
    <div class="demo min0" aria-label="当前动作示范">
      <div class="demo-head"><h2 id="currentTitle">第 1 项：蓝块向右转</h2><span class="badge" id="progress">0%</span></div>
      <div class="stage-line"><span class="object" id="object" aria-hidden="true">◆</span><span class="motion-arrow" id="arrow" aria-hidden="true">→</span></div>
    </div>
    <div class="feedback min0">
      <p id="status" aria-live="polite">先确认双方正在看同一个步骤。</p>
      <div class="actions">
        <button class="primary" id="advance">共同关注当前动作</button>
        <button class="choice" data-kind="对象" disabled>对象</button>
        <button class="choice" data-kind="方向" disabled>方向</button>
        <button class="choice" data-kind="顺序" disabled>顺序</button>
        <button id="reset">重新开始</button>
      </div>
    </div>
  </section>
  <section class="compare" aria-label="两种传递方式逐项比较">
    <div class="band" id="sourceBand"><div class="band-label">原始动作</div></div>
    <div class="band" id="baseBand"><div class="band-label">只看结果</div></div>
    <div class="band" id="teachBand"><div class="band-label">示范并纠错</div></div>
    <div class="compare-note"><p><strong>同列就是同一项。</strong>暖色表示过程信息发生了偏差；纠正后才进入下一次传递。</p><span class="score" id="summary">已纠正 0 项</span></div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:18,kicker:"CULTURAL RELAY",title:"信息怎样穿过一代又一代？",take:"示范、纠错和共享注意能减少信息在代际传递中的损失。"});
Deck.init({index:18,total:48});
const sourceSteps=[
 {object:'蓝块',dir:'向右',end:'右转',order:1,icon:'◆',arrow:'→'},
 {object:'橙环',dir:'向左',end:'左移',order:2,icon:'○',arrow:'←'},
 {object:'蓝块',dir:'向上',end:'上移',order:3,icon:'◆',arrow:'↑'},
 {object:'橙环',dir:'向右',end:'右转',order:4,icon:'○',arrow:'→'}
];
const baseline=[
 {...sourceSteps[0],dir:'向左',arrow:'←'},
 {...sourceSteps[1],object:'蓝块',icon:'◆'},
 {...sourceSteps[2],order:4},
 {...sourceSteps[3],dir:'向左',arrow:'←'}
];
const errors=['方向','对象','顺序','方向'];
let state;
const steps=[...document.querySelectorAll('.k-process>.step')], choices=[...document.querySelectorAll('.choice')];
function fresh(){return {item:0,phase:0,completed:0,corrections:[],generations:[baseline.map(x=>({...x}))]};}
function same(a,b){return a.object===b.object&&a.dir===b.dir&&a.end===b.end&&a.order===b.order;}
function pct(n,d){const safe=Lec.P.positive(Lec.P.finiteNumber(d,1),1);const fraction=Lec.P.fraction(Lec.P.finiteNumber(n,0),safe);return Deck.fmt(Lec.P.percent(fraction,1),{maximumFractionDigits:0})+'%';}
function label(a){return `${a.order}. ${a.icon} ${a.dir}${a.arrow}`;}
function renderBands(){
 const bands=[[document.querySelector('#sourceBand'),sourceSteps,''],[document.querySelector('#baseBand'),baseline,'base'],[document.querySelector('#teachBand'),sourceSteps,'teach']];
 bands.forEach(([el,data,type])=>{while(el.children.length>1)el.lastChild.remove();data.forEach((a,i)=>{const d=document.createElement('div');d.className='act';if(type==='base'&&!same(a,sourceSteps[i]))d.classList.add('bad');if(type==='teach'&&i<state.completed)d.classList.add('good');d.textContent=type==='teach'&&i>=state.completed?'待传递':label(a);el.appendChild(d)});const s=document.createElement('div');s.className='score';const matched=type==='base'?data.filter((a,i)=>same(a,sourceSteps[i])).length:type==='teach'?state.completed:sourceSteps.length;s.textContent=pct(matched,sourceSteps.length)+' 保真';el.appendChild(s)});
 document.querySelector('#summary').textContent=`已纠正 ${state.corrections.length} 项 · 传递 ${state.generations.length} 代`;
}
function render(){
 const idx=Lec.P.clamp(Lec.P.finiteNumber(state.item,0),0,sourceSteps.length-1), a=sourceSteps[idx];
 steps.forEach((el,i)=>{el.classList.toggle('is-current',i===state.phase);el.classList.toggle('is-done',i<state.phase)});
 document.querySelector('#currentTitle').textContent=`第 ${idx+1} 项：${a.object}${a.dir}${a.end}`;
 document.querySelector('#progress').textContent=pct(state.completed,sourceSteps.length);
 const obj=document.querySelector('#object');obj.textContent=a.icon;obj.className='object';document.querySelector('#arrow').textContent=a.arrow;
 choices.forEach(b=>b.disabled=state.phase!==4);document.querySelector('#advance').disabled=state.phase===4||state.completed===sourceSteps.length;
 const msgs=['先确认双方正在看同一个步骤。','正在示范起始态、方向与结束态。','下一代已经尝试；其中有一处偏差。','目标与尝试已上下对齐，请比较差异。','请选择发生偏差的属性。','偏差已修正，正确动作进入下一次传递。'];
 document.querySelector('#status').textContent=state.completed===sourceSteps.length?'四项动作已完成。逐列比较两条传递结果。':msgs[state.phase];
 renderBands();
}
function advance(){
 if(state.completed===sourceSteps.length||state.phase===4)return;
 state.phase++;
 if(state.phase===2){const obj=document.querySelector('#object');const dir=sourceSteps[state.item].dir;obj.classList.add(dir==='向左'?'move-left':'move-right');}
 if(state.phase===6){state.completed++;state.corrections.push(errors[state.item]);state.generations.push(sourceSteps.slice(0,state.completed).map(x=>({...x})));if(state.completed<sourceSteps.length){state.item++;state.phase=0;}else state.phase=5;}
 render();
}
document.querySelector('#advance').addEventListener('click',advance);
choices.forEach(b=>b.addEventListener('click',()=>{if(b.dataset.kind===errors[state.item]){state.phase=5;document.querySelector('#status').textContent=`已定位：${errors[state.item]}不一致。再推进一次完成修正。`;document.querySelector('#advance').disabled=false;choices.forEach(x=>x.disabled=true);}else document.querySelector('#status').textContent=`“${b.dataset.kind}”一致；再找另一个属性。`;}));
document.querySelector('#reset').addEventListener('click',()=>{state=fresh();render();document.querySelector('#advance').focus();});
state=fresh();render();
</script>
</body>
</html>
