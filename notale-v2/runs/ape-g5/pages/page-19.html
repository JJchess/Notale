<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#main{display:flex;flex-direction:column;gap:12px}.argument{height:520px;grid-template-columns:300px 34px minmax(0,1fr)}
.argument>.claim{padding:20px 22px}.claim strong{display:block;font-size:var(--fs-h2);line-height:1.35;margin-bottom:12px}.claim p{font-size:var(--fs-sec);line-height:var(--lh-sec);font-weight:500}.claim .micro{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--ink-soft)}
.argument>.supports{height:520px}.argument>.supports>.support{height:100%;box-sizing:border-box;padding:0;overflow:hidden;border-radius:var(--radius-md)}.argument>.supports>.support:before{top:50%}
.network{position:relative;width:100%;height:100%;background:linear-gradient(145deg,var(--paper),var(--paper-2))}.network svg{display:block;width:100%;height:100%}.zone{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2;stroke-dasharray:8 7}.zone-title{font-size:16px;font-weight:760;fill:var(--accent)}.task{font-size:16px;fill:var(--text);font-weight:650}.link{fill:none;stroke:var(--accent);stroke-width:2.5;opacity:.88}.node{cursor:grab;outline:none}.node:active{cursor:grabbing}.node rect{fill:var(--paper);stroke:var(--line-strong);stroke-width:2}.node.inside rect{fill:var(--accent-warm);stroke:var(--accent-2)}.node.connected rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3}.node:focus rect{stroke:var(--focus);stroke-width:4}.who{font-size:16px;font-weight:760;fill:var(--text)}.know{font-size:14px;fill:var(--ink-soft)}
.solution{position:absolute;right:18px;bottom:18px;width:305px;box-sizing:border-box;padding:15px 18px;border:2px solid var(--line-strong);border-radius:var(--radius-sm);background:rgb(255 253 248 / 96%);box-shadow:var(--shadow)}.solution.good{border-color:var(--good);background:#edf5ee}.solution .state{display:block;color:var(--accent);font-size:var(--fs-h2);line-height:1.35;font-weight:780}.solution p{margin-top:5px;font-size:var(--fs-sec);line-height:var(--lh-sec)}
.feedback{height:76px;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px;padding:12px 18px;border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:var(--radius-sm);background:var(--paper)}.feedback p{font-size:var(--fs-sec);line-height:var(--lh-sec)}.feedback .hint{display:block;color:var(--ink-soft);font-size:var(--fs-label);font-weight:650;line-height:1.35}.reset{min-height:42px;padding:8px 20px;color:#fff;font:700 var(--fs-label)/1.35 var(--font-sans);border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent);cursor:pointer}.reset:active{transform:translateY(1px)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-page="19" data-total="48">
<div id="stage">
<main id="main">
  <section class="k-generalization argument" aria-label="群体知识汇聚的主张与证据">
    <div class="claim">
      <strong>群体让局部知识汇合，创新不必来自一个全知个体。</strong>
      <p>把贡献者拖入协作区。只有互补经验同时在场，知识路径才会接通。</p>
      <p class="micro">关键不只是“有很多人”，而是经验能否被表达、接上并共同检验。</p>
    </div>
    <div class="trunk" aria-hidden="true"></div>
    <div class="supports">
      <div class="support">
        <div class="network" id="network">
          <svg id="net" viewBox="0 0 1070 520" role="group" aria-label="可拖动的贡献者知识网络">
            <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"></path></marker></defs>
          </svg>
          <div class="solution" id="solution"><span class="state" id="state">零散想法</span><p id="explain">已有局部经验，但尚未形成可执行组合。</p></div>
        </div>
      </div>
    </div>
  </section>
  <div class="feedback" aria-live="polite"><div><p id="feedback">先把一条局部经验带进协作区。</p><span class="hint">键盘：Enter 拾取，方向键移动，再按 Enter 放置；Esc 取消。</span></div><button class="reset" id="reset" type="button">重置</button></div>
</main>
</div>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:19,kicker:"CULTURAL ACCUMULATION · GROUP",title:"没有人知道全部，群体仍能做出新东西",take:"群体让不同人的局部知识汇合，创新不必来自一个全知个体。"});
Deck.init({index:19,total:48});
const initial=[
 {id:'observe',who:'观察者',know:'宽口易取水，也易洒出',x:120,y:90},
 {id:'material',who:'材料熟手',know:'薄片可折叠，接缝会漏',x:180,y:225},
 {id:'knot',who:'编结熟手',know:'绳结可固定提手与外框',x:125,y:390},
 {id:'seal',who:'密封熟手',know:'树脂可封住接缝',x:500,y:55},
 {id:'user',who:'使用者',know:'单手提起，放下不倾倒',x:810,y:80},
 {id:'test',who:'试验者',know:'少量试水，再增加负载',x:900,y:245}
];
const edges=[
 {a:'observe',b:'material',text:'宽口经验接上材料塑形：开口需要收束。'},
 {a:'material',b:'seal',text:'“接缝会漏”与“封住接缝”接通：材料经验变成制作步骤。'},
 {a:'material',b:'knot',text:'容器主体接上外框固定，形状开始可携带。'},
 {a:'knot',b:'user',text:'提手做法接上单手使用要求，结构有了约束。'},
 {a:'seal',b:'test',text:'密封方法接上逐步试水，做法能够被检验。'},
 {a:'user',b:'test',text:'使用条件接上负载检验，稳定与承重能够一起检查。'}
];
let nodes=[],previous=new Set(),picked=null,pickOrigin=null;const svg=d3.select('#net');const zone={x:325,y:120,w:560,h:320};
svg.append('rect').attr('class','zone').attr('x',zone.x).attr('y',zone.y).attr('width',zone.w).attr('height',zone.h).attr('rx',28);
svg.append('text').attr('class','zone-title').attr('x',zone.x+24).attr('y',zone.y+30).text('共同讨论区');
svg.append('text').attr('class','task').attr('x',zone.x+24).attr('y',zone.y+57).text('任务：做出便携、可重复使用且能安全取水的容器');
const linkLayer=svg.append('g');const nodeLayer=svg.append('g');
function inside(d){return d.x>zone.x+70&&d.x<zone.x+zone.w-70&&d.y>zone.y+55&&d.y<zone.y+zone.h-45}
function activeEdges(){return edges.filter(e=>inside(nodes.find(n=>n.id===e.a))&&inside(nodes.find(n=>n.id===e.b)))}
function setFeedback(t){document.getElementById('feedback').textContent=t}
function render(action){
 const active=activeEdges(),keys=new Set(active.map(e=>e.a+'-'+e.b)),connected=new Set(active.flatMap(e=>[e.a,e.b]));
 linkLayer.selectAll('line').data(active,d=>d.a+'-'+d.b).join(enter=>enter.append('line').attr('class','link').attr('marker-end','url(#arrow)').attr('opacity',0).call(s=>Deck.reduced()?s.attr('opacity',1):s.transition().duration(240).attr('opacity',1)),update=>update,exit=>exit.call(s=>Deck.reduced()?s.remove():s.transition().duration(180).attr('opacity',0).remove())).attr('x1',d=>nodes.find(n=>n.id===d.a).x).attr('y1',d=>nodes.find(n=>n.id===d.a).y).attr('x2',d=>nodes.find(n=>n.id===d.b).x).attr('y2',d=>nodes.find(n=>n.id===d.b).y);
 const sel=nodeLayer.selectAll('g.node').data(nodes,d=>d.id).join(enter=>{const g=enter.append('g').attr('class','node').attr('tabindex',0).attr('role','button');g.append('rect').attr('x',-92).attr('y',-31).attr('width',184).attr('height',62).attr('rx',10);g.append('text').attr('class','who').attr('text-anchor','middle').attr('y',-5).text(d=>d.who);g.append('text').attr('class','know').attr('text-anchor','middle').attr('y',18).text(d=>d.know);return g;});
 sel.attr('transform',d=>`translate(${d.x},${d.y})`).attr('aria-label',d=>`${d.who}：${d.know}。${inside(d)?'在协作区内':'在协作区外'}`).classed('inside',d=>inside(d)).classed('connected',d=>connected.has(d.id));
 const full=['material','seal','user','test'].every(id=>inside(nodes.find(n=>n.id===id)));const count=active.length;const state=full?'形成方案':count?'可以组合':'零散想法';document.getElementById('state').textContent=state;document.getElementById('solution').classList.toggle('good',full);document.getElementById('explain').textContent=full?'薄片成形并密封，提手与稳定性受约束，再用逐步负载检验。':count?'部分知识已经接通，仍缺少制作、使用约束或检验环节。':'已有局部经验，但尚未形成可执行组合。';
 if(action){const added=active.find(e=>!previous.has(e.a+'-'+e.b));if(full)setFeedback('材料、结构、使用条件与检验方法已经接成可执行路径。');else if(added)setFeedback(added.text);else if(action==='out')setFeedback('方案仍有想法，但这一步失去了来源；群体成果依赖可见的连接。');else if(action==='in'&&!count)setFeedback('这条经验已进入讨论，但还没有找到接续点。');}
 previous=keys;
}
function move(d,x,y,action){d.x=Deck.clamp(x,96,974);d.y=Deck.clamp(y,45,470);render(action)}
function reset(){nodes=initial.map(d=>({...d}));previous=new Set();picked=null;render();setFeedback('先把一条局部经验带进协作区。')}
reset();
nodeLayer.selectAll('.node').call(d3.drag().on('start',function(){d3.select(this).raise()}).on('drag',function(event,d){move(d,event.x,event.y)}).on('end',function(event,d){render(inside(d)?'in':'out')})).on('keydown',function(event,d){if(event.key==='Enter'||event.key===' '){event.preventDefault();if(picked===d.id){picked=null;render(inside(d)?'in':'out')}else{picked=d.id;pickOrigin={x:d.x,y:d.y};setFeedback('已拾取'+d.who+'，用方向键移动，再按 Enter 放置。')}}else if(event.key==='Escape'&&picked===d.id){move(d,pickOrigin.x,pickOrigin.y);picked=null;setFeedback('已取消移动。')}else if(picked===d.id&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){event.preventDefault();const step=event.shiftKey?30:14;move(d,d.x+(event.key==='ArrowRight'?step:event.key==='ArrowLeft'?-step:0),d.y+(event.key==='ArrowDown'?step:event.key==='ArrowUp'?-step:0));}});
document.getElementById('reset').addEventListener('click',reset);
</script>
</body>
</html>
