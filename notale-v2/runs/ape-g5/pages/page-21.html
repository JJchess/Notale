<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main{display:flex;flex-direction:column;gap:12px}
  .lesson-lead{font-size:var(--fs-lead);line-height:var(--lh-copy);font-weight:680}
  .workbench{display:flex;gap:24px;min-height:0;flex:1}
  .ledger{flex:1 1 0;min-width:0;padding:14px 18px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper);box-shadow:var(--shadow)}
  .ledger-head{display:grid;grid-template-columns:190px minmax(0,1fr) 120px;gap:16px;padding:0 18px 8px 54px;color:var(--ink-soft);font-size:var(--fs-label);font-weight:720;border-bottom:1px solid var(--line)}
  .chain.k-process.is-vertical{display:flex;flex-direction:column;gap:0;margin-top:4px}
  .chain.k-process.is-vertical>.axis{left:26px;top:30px;bottom:30px}
  .chain.k-process>.step{display:grid;grid-template-columns:190px minmax(0,1fr) 120px;align-items:center;gap:16px;min-height:55px;padding:7px 14px 7px 52px;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;background:transparent}
  .chain.k-process>.step:last-of-type{border-bottom:0}
  .step strong{font-size:var(--fs-body);line-height:1.35}
  .step .risk{color:var(--ink-soft);font-size:var(--fs-sec);line-height:1.35}
  .repair-slot{min-height:34px;display:flex;align-items:center;justify-content:center;padding:2px 7px;border:1px dashed var(--line-strong);border-radius:var(--radius-sm);color:var(--ink-soft);font-size:var(--fs-label);font-weight:700;background:var(--bg)}
  .repair-slot.selected{outline:3px solid rgb(0 109 119 / 18%);border-color:var(--accent)}
  .repair-slot.filled{color:var(--accent);border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
  .chain.k-process>.arw{position:absolute;left:0;width:0;height:0}
  .chain.k-process>.arw::after{display:none}
  .step::before{content:"↓";position:absolute;z-index:3;left:17px;bottom:-18px;color:var(--line-strong);font-size:var(--fs-h2);font-weight:800;line-height:1}
  .step:last-of-type::before{display:none}
  .step.protected::before{color:var(--accent)}
  .step.testing .risk{color:var(--accent);font-weight:720}
  .step.failed{background:#f8e4e1!important;box-shadow:inset 5px 0 0 var(--danger)!important}
  .step.passed{background:var(--accent-soft)!important}
  .side{flex:0 0 330px;min-width:0;display:flex;flex-direction:column;gap:12px}
  .repair-box{padding:16px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper)}
  .repair-box h2{margin-bottom:10px}
  .tags{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tag{min-height:48px;padding:8px 12px;color:var(--text);font:700 var(--fs-body)/1.35 var(--font-sans);border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--paper);cursor:grab}
  .tag[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .tag:active{transform:translateY(1px)}
  .feedback{flex:1;padding:16px;border-left:5px solid var(--accent);border-radius:0 var(--radius-md) var(--radius-md) 0;background:var(--accent-soft)}
  .feedback .result{margin-bottom:6px;font-size:var(--fs-h2);font-weight:780;line-height:1.35}
  .feedback p{font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .hint{color:var(--ink-soft);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .actions{display:flex;gap:10px}
  .actions button{min-height:46px;padding:8px 18px;white-space:nowrap;color:#fff;font:720 var(--fs-label)/1.35 var(--font-sans);border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent);cursor:pointer}
  .actions .reset{color:var(--text);border-color:var(--line-strong);background:var(--paper)}
  @media (max-width:1000px){.workbench{flex-direction:column}.side{flex-basis:auto}.tags{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body data-page="21" data-total="48">
<div id="stage">
<main id="main">
  <p class="lesson-lead">文化也会遗忘。把四种修补放到合适的断点，再检验一次人员交接。</p>
  <div class="workbench">
    <section class="ledger min0" aria-label="从经验到接续的六步知识链">
      <div class="ledger-head"><span>当前状态</span><span>传递动作与断点</span><span>修补位</span></div>
      <div class="chain k-process is-vertical" style="--step-count:6">
        <div class="axis" aria-hidden="true"></div>
        <article class="step" data-step="0"><strong>形成做法</strong><span class="risk">判断只在个人记忆中</span><span class="repair-slot" data-slot="record">断点 A</span></article>
        <article class="step" data-step="1"><strong>写成记录</strong><span class="risk">过程能否被准确描述？</span><span aria-hidden="true"></span></article>
        <article class="step" data-step="2"><strong>保存记录</strong><span class="risk">唯一入口可能损坏或遗失</span><span class="repair-slot" data-slot="redundancy">断点 B</span></article>
        <article class="step" data-step="3"><strong>检验记录</strong><span class="risk">错误、遗漏可能长期潜伏</span><span class="repair-slot" data-slot="test">断点 C</span></article>
        <article class="step" data-step="4"><strong>训练执行</strong><span class="risk">“读过”不等于“会做”</span><span class="repair-slot" data-slot="training">断点 D</span></article>
        <article class="step" data-step="5"><strong>交给下一批人</strong><span class="risk">原熟练者离开后仍要接续</span><span aria-hidden="true"></span></article>
      </div>
    </section>
    <aside class="side min0">
      <section class="repair-box">
        <h2>修补签</h2>
        <div class="tags">
          <button class="tag" draggable="true" data-repair="record" aria-pressed="false">记录</button>
          <button class="tag" draggable="true" data-repair="redundancy" aria-pressed="false">冗余</button>
          <button class="tag" draggable="true" data-repair="test" aria-pressed="false">测试</button>
          <button class="tag" draggable="true" data-repair="training" aria-pressed="false">训练</button>
        </div>
      </section>
      <p class="hint">拖到修补位；或聚焦修补签，用方向键选位置，按 Enter 放置或取回。</p>
      <section class="feedback" aria-live="polite">
        <div class="result" id="result">单链：断裂</div>
        <p id="message">做法仍依赖个人。记录、旁路、校验和重新习得都还没有建立。</p>
      </section>
      <div class="actions">
        <button id="run">运行交接检验</button>
        <button id="reset" class="reset">重置</button>
      </div>
    </aside>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:21,kicker:"KNOWLEDGE CHAIN",title:"知识不会自动留下来",take:"保存说明不等于保存能力：记录还要能找回、检验，并通过训练重新变成行动。"});
Deck.init({index:21,total:48});
(function(){
  const names={record:'记录',redundancy:'冗余',test:'测试',training:'训练'};
  const effects={record:'经验已外化为可查阅说明，但单份记录仍可能失去。',redundancy:'独立副本提供了旁路，但内容是否正确仍需检验。',test:'执行—核对—修订形成回路，但阅读还未必变成能力。',training:'练习与纠错接合了“读懂”和“会做”，其他断点仍需修补。'};
  const order=['record','redundancy','test','training'];
  let state={placed:{},selected:0,running:false,timers:[]};
  const tags=[...document.querySelectorAll('.tag')],slots=[...document.querySelectorAll('.repair-slot')],steps=[...document.querySelectorAll('.step')];
  const result=document.getElementById('result'),message=document.getElementById('message');
  function clearTimers(){state.timers.forEach(clearTimeout);state.timers=[];state.running=false}
  function render(){
    tags.forEach(t=>t.setAttribute('aria-pressed',String(!!state.placed[t.dataset.repair])));
    slots.forEach((s,i)=>{const key=s.dataset.slot;s.classList.toggle('selected',i===state.selected);s.classList.toggle('filled',!!state.placed[key]);s.textContent=state.placed[key]?names[key]:'断点 '+String.fromCharCode(65+i)});
    steps.forEach((s,i)=>{s.classList.toggle('protected',i<5&&!!state.placed[order[Math.max(0,i-1)]]);if(i===2&&state.placed.redundancy)s.querySelector('.risk').textContent='主记录不可用时，旁路副本接续';else if(i===3&&state.placed.test)s.querySelector('.risk').textContent='复现后核对，并返回修订';else if(i===4&&state.placed.training)s.querySelector('.risk').textContent='练习与纠错把说明变成行动'});
  }
  function place(key,target){
    clearTimers();steps.forEach(s=>s.classList.remove('failed','passed','testing'));
    if(key!==target){result.textContent='位置不匹配';message.textContent=names[key]+'不能修补这个断点。它改变的是“'+effects[key].split('，')[0]+'”。';render();return}
    if(state.placed[key]){delete state.placed[key];result.textContent='已取回 '+names[key];message.textContent='这段传递重新暴露。可把修补签再次放回。'}else{state.placed[key]=true;result.textContent='已放置 '+names[key];message.textContent=effects[key]}
    render();
  }
  tags.forEach(tag=>{
    tag.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',tag.dataset.repair));
    tag.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();state.selected=(state.selected+1)%slots.length;render()}if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();state.selected=(state.selected+slots.length-1)%slots.length;render()}if(e.key==='Enter'){e.preventDefault();place(tag.dataset.repair,slots[state.selected].dataset.slot)}});
  });
  slots.forEach((slot,i)=>{slot.addEventListener('dragover',e=>e.preventDefault());slot.addEventListener('drop',e=>{e.preventDefault();state.selected=i;place(e.dataTransfer.getData('text/plain'),slot.dataset.slot)})});
  document.getElementById('run').addEventListener('click',()=>{
    clearTimers();steps.forEach(s=>s.classList.remove('failed','passed','testing'));state.running=true;
    const firstMissing=order.findIndex(k=>!state.placed[k]);
    const finish=()=>{const count=Object.keys(state.placed).length;if(firstMissing>=0){steps[firstMissing].classList.add('failed');result.textContent=count<2?'交接检验：断裂':'交接检验：勉强接续';message.textContent=['原熟练者离开：做法没有成为可查说明。','单份记录不可用：没有独立副本可走。','文档含有遗漏：没有复现与修订回路。','新成员首次执行：读过说明却未形成能力。'][firstMissing]}else{steps[3].classList.add('testing');result.textContent='交接检验：耐断裂';message.textContent='下一批人继续执行；校验回路仍保留，因为记录不会自动保持正确。'}state.running=false};
    if(Deck.reduced()){steps.forEach((s,i)=>s.classList.toggle('passed',firstMissing<0||i<=firstMissing));finish();return}
    const stop=firstMissing<0?5:firstMissing;for(let i=0;i<=stop;i++)state.timers.push(setTimeout(()=>{steps[i].classList.add('passed');if(i===stop)finish()},i*190));
  });
  document.getElementById('reset').addEventListener('click',()=>{clearTimers();state={placed:{},selected:0,running:false,timers:[]};steps.forEach(s=>s.classList.remove('failed','passed','testing'));steps[2].querySelector('.risk').textContent='唯一入口可能损坏或遗失';steps[3].querySelector('.risk').textContent='错误、遗漏可能长期潜伏';steps[4].querySelector('.risk').textContent='“读过”不等于“会做”';result.textContent='单链：断裂';message.textContent='做法仍依赖个人。记录、旁路、校验和重新习得都还没有建立。';render()});
  render();
})();
</script>
</body>
</html>
