<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;align-items:center;justify-content:center}
    .knowledge-map.k-generalization{
      position:relative;display:block;width:100%;height:100%;
    }
    .knowledge-map > .claim{
      position:absolute;z-index:3;left:50%;top:50%;width:402px;height:404px;
      box-sizing:border-box;transform:translate(-50%,-50%);
      padding:0;border:2px solid var(--accent);border-radius:50%;
      background:var(--paper);box-shadow:var(--shadow);overflow:visible;
    }
    .system-ring{position:absolute;inset:25px;border:2px dashed var(--line-strong);border-radius:50%}
    .system-name{position:absolute;top:35px;left:50%;transform:translateX(-50%);padding:4px 14px;color:var(--accent);font-size:var(--fs-label);font-weight:760;line-height:1.35;background:var(--paper);white-space:nowrap}
    .person{position:absolute;left:50%;top:91px;width:116px;height:214px;transform:translateX(-50%)}
    .person circle,.person path{fill:var(--paper-2);stroke:var(--text);stroke-width:3}
    .node{position:absolute;padding:3px 9px;color:var(--text);font-size:var(--fs-label);font-weight:720;line-height:1.35;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
    .n1{left:38px;top:96px}.n2{right:35px;top:96px}.n3{left:22px;top:190px}.n4{right:20px;top:190px}.n5{left:55px;bottom:75px}.n6{right:53px;bottom:75px}
    .core-claim{position:absolute;z-index:2;left:50%;bottom:26px;width:330px;transform:translateX(-50%);color:var(--text);font-size:var(--fs-lead);font-weight:780;line-height:1.4;text-align:center}
    .action{position:absolute;z-index:4;left:50%;bottom:-51px;transform:translateX(-50%);padding:7px 18px;color:#fff;font-size:var(--fs-label);font-weight:760;line-height:1.35;border-radius:999px;background:var(--accent);white-space:nowrap}
    .action::before{content:"↓";position:absolute;left:50%;bottom:100%;color:var(--accent);font-size:var(--fs-h2);line-height:1;transform:translateX(-50%)}
    .knowledge-map > .trunk{position:absolute;z-index:1;inset:0;min-height:0;pointer-events:none}
    .knowledge-map > .trunk::before{display:none}
    .trunk svg{width:100%;height:100%;overflow:visible}
    .trunk path{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;marker-end:url(#arrow)}
    .knowledge-map > .supports{position:absolute;inset:0;display:block}
    .knowledge-map > .supports > .support{position:absolute;z-index:2;width:350px;box-sizing:border-box;padding:16px 20px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);box-shadow:0 5px 16px rgb(23 33 43 / 6%)}
    .knowledge-map > .supports > .support::before{display:none}
    .support strong{display:block;margin-bottom:4px;color:var(--accent);font-size:var(--fs-body);line-height:1.35}
    .support span{display:block;color:var(--ink-soft);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .s1{left:0;top:30px}.s2{right:0;top:30px}.s3{left:0;bottom:38px}.s4{right:0;bottom:38px}
    .metaphor{position:absolute;z-index:4;left:50%;top:67px;width:250px;transform:translateX(-50%);color:var(--ink-soft);font-size:var(--fs-label);font-weight:650;line-height:1.35;text-align:center}
  </style>
</head>
<body data-page="22" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="knowledge-map k-generalization" aria-label="体外知识系统的四项支撑汇聚图">
        <div class="claim">
          <div class="system-ring" aria-hidden="true"></div>
          <div class="system-name">体外知识系统</div>
          <svg class="person" viewBox="0 0 116 214" aria-hidden="true">
            <circle cx="58" cy="25" r="22"></circle>
            <path d="M32 60 Q58 48 84 60 L92 127 L78 130 L75 202 L57 202 L52 137 L47 202 L29 202 L26 130 L12 127 L20 65 Z"></path>
          </svg>
          <span class="node n1">记录</span><span class="node n2">教学</span>
          <span class="node n3">分工</span><span class="node n4">标准</span>
          <span class="node n5">测试</span><span class="node n6">工具</span>
          <p class="metaphor">功能比喻 · 不是生物器官</p>
          <p class="core-claim">关键变化不在身体内，<br>而在可调用的累积知识中。</p>
          <div class="action">可在太空行动</div>
        </div>
        <div class="trunk" aria-hidden="true">
          <svg viewBox="0 0 1408 620" preserveAspectRatio="none">
            <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--accent)" stroke="none"></path></marker></defs>
            <path d="M350 105 C455 105 484 160 526 205"></path>
            <path d="M1058 105 C953 105 924 160 882 205"></path>
            <path d="M350 500 C455 500 484 452 526 410"></path>
            <path d="M1058 500 C953 500 924 452 882 410"></path>
          </svg>
        </div>
        <div class="supports">
          <div class="support s1"><strong>记忆可以离开个体</strong><span>记录、图纸、程序和档案，让方案不随某个人离场而消失。</span></div>
          <div class="support s2"><strong>能力可以分布在群体中</strong><span>没有一名乘员需要独自掌握任务涉及的全部知识。</span></div>
          <div class="support s3"><strong>知识可以被校验和传递</strong><span>教学、训练、测试与纠错，让经验跨人、跨代继续使用。</span></div>
          <div class="support s4"><strong>知识可以封装为行动条件</strong><span>工具、标准、流程和设备，把既有判断变成当下可调用的能力。</span></div>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 22,
      kicker: "CULTURE / EXTERNAL MEMORY",
      title: "太空人的关键“新器官”，在身体之外",
      take: "太空人的关键新器官不是某块肌肉，而是体外累积的知识系统。"
    });
    Deck.init({ index: 22, total: 48 });
  </script>
</body>
</html>
