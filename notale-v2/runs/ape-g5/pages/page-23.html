<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:10px}
    .compare-strip{--compare-cols:2;grid-template-columns:150px repeat(2,minmax(0,1fr));flex:0 0 auto}
    .compare-strip>.hdr,.compare-strip>.dim,.compare-strip>.cell{padding:5px 14px}
    .compare-strip>.hdr{font-size:var(--fs-sec);line-height:1.35}
    .compare-strip>.dim{font-size:var(--fs-label)}
    .compare-strip>.cell{font-size:var(--fs-sec);line-height:1.35}
    .sim{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-md);background:linear-gradient(180deg,var(--paper),var(--accent-soft));box-shadow:var(--shadow)}
    .sim canvas{display:block}
    .sim .sr-only{width:900px;height:auto;clip:auto;clip-path:none;opacity:0;pointer-events:none}
    .sim-key{position:absolute;top:12px;left:14px;display:flex;gap:22px;padding:6px 10px;border-radius:var(--radius-sm);background:rgb(255 253 248 / 90%);font-size:var(--fs-label);font-weight:700}
    .key-solid::before,.key-dash::before{content:"";display:inline-block;width:30px;margin-right:8px;vertical-align:middle;border-top:3px solid var(--accent-2)}
    .key-dash::before{border-top-style:dashed;border-color:var(--accent)}
    .metric{position:absolute;top:12px;right:14px;padding:6px 10px;border-radius:var(--radius-sm);background:rgb(255 253 248 / 90%);font-size:var(--fs-label);font-weight:700;color:var(--ink-soft)}
    .bottom{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:center;flex:0 0 104px}
    .control-box{min-width:0}
    .ctl{grid-template-columns:116px minmax(0,1fr) 94px auto;padding:0}
    .ctl input{padding:0}
    .ctl button{white-space:nowrap}
    .ends{display:flex;justify-content:space-between;margin:0 104px 0 132px;color:var(--ink-soft);font-size:var(--fs-tick);line-height:1.35}
    .feedback{padding:10px 14px;border-left:5px solid var(--accent);border-radius:0 var(--radius-sm) var(--radius-sm) 0;background:var(--accent-soft);font-size:var(--fs-sec);line-height:1.45;font-weight:680}
    .assumption{display:block;color:var(--ink-soft);font-size:var(--fs-label);font-weight:500;margin-top:3px}
  </style>
</head>
<body data-page="23" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="k-comparison compare-strip" aria-label="普通掉落与带横向速度掉落的比较">
        <div class="hdr">比较维度</div><div class="hdr">近乎垂直掉落</div><div class="hdr">带横向速度的掉落</div>
        <div class="dim">起点与重力</div><div class="cell">同一高度 · 同一重力规则</div><div class="cell">同一高度 · 同一重力规则</div>
        <div class="rowline"></div>
        <div class="dim">速度与结果</div><div class="cell diff">横向速度不同 · 撞上地面</div><div class="cell diff" id="compareResult">横向速度不同 · 撞上地面</div>
      </section>

      <section class="sim min0" aria-label="地球截面与两条计算轨迹">
        <canvas id="orbitCanvas" class="cv-fill"></canvas>
        <span class="sr-only">两物体从同一高度出发并受同一重力。调节滑杆可改变虚线物体的横向速度；实线物体保持零横向速度。</span>
        <div class="sim-key"><span class="key-solid">实线：零横向速度</span><span class="key-dash">虚线：实验轨迹</span></div>
        <div class="metric"><span id="heightRead"></span>　起点重力：<span id="gravityRead"></span></div>
      </section>

      <section class="bottom">
        <div class="control-box min0">
          <div class="ctl">
            <label for="speed">横向速度</label>
            <input id="speed" type="range" min="0" max="1000" value="0" step="1" aria-describedby="feedback">
            <output id="speedRead" for="speed">0.00 km/s</output>
            <button id="reset" type="button">重置</button>
          </div>
          <div class="ends"><span>0 km/s</span><span id="orbitEnd"></span></div>
        </div>
        <div class="feedback" id="feedback" aria-live="polite">向下掉落，轨迹与地面相交。<span class="assumption">理想模型：忽略大气、自转与地形。</span></div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 23,
      kicker: "FALLING AROUND EARTH",
      title: "轨道为什么没有撞上地面？",
      take: "轨道不是没有重力，而是物体在不断下落时持续错过地面。"
    });
    Deck.init({ index: 23, total: 48 });

    const cv=document.getElementById('orbitCanvas'), speed=document.getElementById('speed');
    const speedRead=document.getElementById('speedRead'), feedback=document.getElementById('feedback');
    const compareResult=document.getElementById('compareResult');
    const M=Lec.K.EARTH_MASS_KG, R=Lec.K.EARTH_RADIUS_M, H=Lec.K.LEO_EXAMPLE_ALTITUDE_M;
    const r0=Lec.P.positive(Lec.P.altitudeToRadius(R,H));
    const vc=Lec.P.circularOrbitVelocity(M,r0);
    const period=Lec.P.circularOrbitPeriod(M,r0);
    const g0=Lec.P.gravity(M,r0);
    const kmH=Lec.P.metresToKilometres(H);
    document.getElementById('heightRead').textContent='高度：约 '+Deck.fmt(kmH,0)+' km';
    document.getElementById('gravityRead').textContent=Deck.fmt(g0,2)+' m/s²';
    document.getElementById('orbitEnd').textContent='圆轨道 '+Deck.fmt(vc/1000,2)+' km/s';

    function currentVelocity(){
      const raw=Lec.P.finiteNumber(Number(speed.value),0);
      const ratio=Lec.P.clamp(raw,0,1000)/1000;
      return ratio*vc;
    }
    function trace(vx){
      let x=r0,y=0,vxx=0,vyy=vx, hit=false;
      const pts=[[x,y]], dt=period/1100;
      for(let i=0;i<1250;i++){
        const rr=Lec.P.positive(Math.hypot(x,y));
        const a=Lec.P.gravity(M,rr);
        vxx+=(-x/rr)*a*dt; vyy+=(-y/rr)*a*dt;
        x+=vxx*dt; y+=vyy*dt; pts.push([x,y]);
        if(Math.hypot(x,y)<=R){hit=true;break}
      }
      return {pts,hit};
    }
    function draw(){
      const ctx=Deck.fit(cv), w=cv.clientWidth,h=cv.clientHeight;
      ctx.clearRect(0,0,w,h);
      const cx=w*.52,cy=h*.70, scale=Math.min(w*.37,h*.63)/R;
      ctx.fillStyle=Deck.token('--paper');ctx.fillRect(0,0,w,h);
      ctx.beginPath();ctx.arc(cx,cy,R*scale,0,Math.PI*2);ctx.fillStyle=Deck.token('--accent-soft');ctx.fill();
      ctx.strokeStyle=Deck.token('--accent');ctx.lineWidth=3;ctx.stroke();
      ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);ctx.fillStyle=Deck.token('--accent');ctx.fill();
      const v=currentVelocity(), base=trace(0), exp=trace(v);
      function path(data,color,dash){ctx.beginPath();data.pts.forEach((p,i)=>{const X=cx+p[1]*scale,Y=cy-p[0]*scale;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.strokeStyle=color;ctx.lineWidth=3;ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([])}
      path(base,Deck.token('--accent-2'),[]);path(exp,Deck.token('--accent'),[9,7]);
      const sx=cx,sy=cy-r0*scale;
      ctx.beginPath();ctx.arc(sx,sy,7,0,Math.PI*2);ctx.fillStyle=Deck.token('--text');ctx.fill();
      ctx.strokeStyle=Deck.token('--danger');ctx.lineWidth=3;Deck.arrow(ctx,sx,sy+8,sx,Math.min(cy-12,sy+64),10);
      ctx.fillStyle=Deck.token('--danger');ctx.font='700 15px '+Deck.token('--font-sans');ctx.fillText('重力始终指向地心',sx+14,sy+48);
      if(v>0){ctx.strokeStyle=Deck.token('--accent');Deck.arrow(ctx,sx+8,sy,sx+78,sy,10)}
    }
    function update(){
      const v=currentVelocity(), ratio=Lec.P.fraction(v,vc);
      speedRead.value=Deck.fmt(v/1000,2)+' km/s';
      let text,state,result;
      if(ratio>=.998){text='仍受重力，持续错过地面。圆轨道一周约 '+Deck.fmt(period/60,0)+' 分钟。';state='good';result='横向速度不同 · 持续错过地面'}
      else if(ratio>=.88){text='下落曲率正在接近地表曲率。';state='warn';result='横向速度不同 · 撞上地面'}
      else if(ratio>0){text='向前更远，仍与地面相交。';state='warn';result='横向速度不同 · 撞上地面'}
      else{text='向下掉落，轨迹与地面相交。';state='danger';result='横向速度不同 · 撞上地面'}
      feedback.dataset.state=state;feedback.firstChild.textContent=text;compareResult.textContent=result;draw();
    }
    speed.addEventListener('input',update);
    document.getElementById('reset').addEventListener('click',()=>{speed.value=0;update();speed.focus()});
    Deck.onResize(draw);update();
  </script>
</body>
</html>
