<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
.page24{display:flex;gap:24px;width:100%;height:100%}.route{flex:0 0 410px;height:100%}.route.k-process.is-vertical{gap:12px;grid-template-rows:repeat(4,1fr)}.route.k-process.is-vertical>.step{padding:13px 18px 12px 58px;box-shadow:none}.route.k-process.is-vertical>.axis{left:29px}.route.k-process.is-vertical>.arw{height:0}.route.k-process.is-vertical>.arw::after{top:-25px;left:17px}.step-no{position:absolute;left:16px;top:14px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--accent);font-size:var(--fs-label);font-weight:800}.route h2{font-size:var(--fs-body);margin-bottom:3px}.route p{font-size:var(--fs-sec);line-height:1.35}.step-read{margin-top:5px;color:var(--accent);font-size:var(--fs-label);font-weight:750}.sim{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;padding:16px 20px 14px}.simtop{display:flex;align-items:center;justify-content:space-between;gap:16px;height:42px}.simtop h2{font-size:var(--fs-h2)}.legend{display:flex;gap:18px;font-size:var(--fs-label);font-weight:680}.key{display:inline-block;width:18px;height:3px;margin-right:6px;vertical-align:middle;background:var(--accent)}.key.rad{background:var(--accent-2)}.key.orbit{height:0;border-top:2px dashed var(--line-strong);background:none}.world{position:relative;flex:1 1 0;min-height:0;margin-top:8px;border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;background:linear-gradient(#fffdf8,#eef5f3)}.world canvas{display:block}.steer{position:absolute;right:18px;top:16px;width:300px;padding:10px 14px;border-radius:var(--radius-sm);background:rgb(255 253 248 / 92%);border:1px solid var(--line)}.steer label{display:flex;justify-content:space-between;font-size:var(--fs-label);font-weight:720}.steer input{width:100%;margin-top:8px;accent-color:var(--accent)}.readouts{display:flex;gap:12px;margin-top:10px}.readout{flex:1;padding:8px 12px;border-left:4px solid var(--accent);background:var(--accent-soft)}.readout.radial{border-color:var(--accent-2);background:var(--accent-warm)}.readout b{display:block;font-size:var(--fs-lead);font-variant-numeric:tabular-nums}.readout span{font-size:var(--fs-label)}.feedback{display:flex;align-items:center;gap:14px;margin-top:10px;min-height:48px}.feedback p{flex:1;font-size:var(--fs-sec);font-weight:650;line-height:1.4}.feedback button{min-height:42px;padding:8px 18px;color:#fff;font:700 var(--fs-label) var(--font-sans);border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent);cursor:pointer}.claim{margin-top:8px;font-size:var(--fs-sec);font-weight:760;color:var(--text)}
</style>
</head>
<body data-page="24" data-total="48">
<div id="stage">
<main id="main">
  <div class="page24">
    <section class="route k-process is-vertical min0" aria-label="从离地到入轨的四步过程">
      <div class="axis" aria-hidden="true"></div>
      <article class="step is-done"><span class="step-no">1</span><h2>向上离地</h2><p>高度先解决别撞地面的问题。</p></article><i class="arw" aria-hidden="true"></i>
      <article class="step is-done"><span class="step-no">2</span><h2>逐渐转向</h2><p>继续加速，同时把方向压向当地水平。</p></article><i class="arw" aria-hidden="true"></i>
      <article class="step" id="step3"><span class="step-no">3</span><h2>积累横向速度</h2><p>轨道速度主要沿地球表面方向。</p></article><i class="arw" aria-hidden="true"></i>
      <article class="step" id="step4"><span class="step-no">4</span><h2>切向进入圆轨道</h2><p>在目标高度，速度要足够快，也要足够横。</p><div class="step-read"><span id="altRead"></span> · 所需 <span id="orbitRead"></span></div></article>
    </section>
    <section class="sim panel min0" aria-label="轨道插入方向操舵实验">
      <div class="simtop"><h2>轨道插入瞬间</h2><div class="legend"><span><i class="key"></i>横向</span><span><i class="key rad"></i>径向</span><span><i class="key orbit"></i>目标轨道</span></div></div>
      <div class="world no-pan" id="world">
        <canvas class="cv-fill" id="scene" role="img" aria-label="弧形地球上方有飞行器。调整方向舵可改变固定大小速度的方向，观察横向与径向分量及预测轨迹。"></canvas>
        <div class="steer">
          <label for="angle"><span>方向舵：相对当地水平</span><output id="angleOut">65°</output></label>
          <input id="angle" type="range" min="0" max="90" step="1" value="65" aria-describedby="hint">
          <div id="hint" class="label">拖动，或用左右方向键调整</div>
        </div>
      </div>
      <div class="readouts"><div class="readout"><span>横向速度</span><b id="hRead"></b><span id="shareRead"></span></div><div class="readout radial"><span>径向速度</span><b id="rRead"></b><span>远离地心方向</span></div></div>
      <div class="feedback"><p id="feedback" aria-live="polite"></p><button id="reset" type="button">重置方向</button></div>
      <p class="claim">入轨主要需要横向速度：向上让你离开地面，横着够快才让你持续绕过地面。</p>
    </section>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:24,kicker:"ORBIT INSERTION",title:"向上离地，横着入轨",take:"同样快时，方向决定你继续爬高，还是沿地球表面前进。"});
Deck.init({index:24,total:48});
const altitude=Lec.K.LEO_EXAMPLE_ALTITUDE_M;
const radius=Lec.P.altitudeToRadius(Lec.K.EARTH_RADIUS_M,altitude);
const speed=Lec.P.circularOrbitVelocity(Lec.K.EARTH_MASS_KG,radius);
const period=Lec.P.circularOrbitPeriod(Lec.K.EARTH_MASS_KG,radius);
const angle=document.getElementById('angle'), cv=document.getElementById('scene');
let state={angle:65};
document.getElementById('altRead').textContent=Deck.fmt(Lec.P.metresToKilometres(altitude),0)+' km';
document.getElementById('orbitRead').textContent=Deck.fmt(speed/1000,2)+' km/s';
function model(){
  const deg=Lec.P.clamp(Lec.P.finiteNumber(Number(angle.value),65),0,90);
  const rad=Lec.P.degreesToRadians(deg), h=speed*Math.cos(rad), r=speed*Math.sin(rad);
  return {deg,rad,h,r,share:Lec.P.percent(Lec.P.fraction(h,speed))};
}
function update(){
  const m=model(); state.angle=m.deg;
  document.getElementById('angleOut').textContent=Deck.fmt(m.deg,0)+'°';
  document.getElementById('hRead').textContent=Deck.fmt(m.h/1000,2)+' km/s';
  document.getElementById('rRead').textContent=Deck.fmt(m.r/1000,2)+' km/s';
  document.getElementById('shareRead').textContent='占总速度 '+Deck.fmt(m.share,0)+'%';
  let msg,good=false;
  if(m.deg<=8){msg='切向对准：同样的总速度现在主要沿当地水平，满足本页理想圆轨道示意。';good=true;}
  else if(m.deg<=30)msg='接近切向：大部分速度已经用于横向运动；继续把径向分量减小。';
  else msg='方向过于向上：离地很明显，但横向速度不足；这还不是圆轨道插入。';
  document.getElementById('feedback').textContent=msg;
  document.getElementById('step3').className='step '+(good?'is-done':'is-current');
  document.getElementById('step4').className='step '+(good?'is-current':'');
  angle.setAttribute('aria-valuetext',Deck.fmt(m.deg,0)+'度，横向速度'+Deck.fmt(m.h/1000,2)+'千米每秒。'+msg);
  draw();
}
function draw(){
  const m=model(), ctx=Deck.fit(cv), w=cv.parentElement.clientWidth, h=cv.parentElement.clientHeight;
  ctx.clearRect(0,0,w,h);
  const accent=Deck.rgb('--accent'), warm=Deck.rgb('--accent-2'), line=Deck.rgb('--line-strong'), paper=Deck.rgb('--paper-2');
  const cx=w*.48, cy=h+250, R=h+105, px=cx, py=cy-R-52;
  ctx.fillStyle=paper;ctx.beginPath();ctx.arc(cx,cy,R,Math.PI,Math.PI*2);ctx.fill();
  ctx.strokeStyle=line;ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,R,Math.PI,Math.PI*2);ctx.stroke();
  ctx.setLineDash([9,9]);ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,R+52,Math.PI*1.08,Math.PI*1.92);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle=Deck.rgba('--line-strong',.55);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px-185,py);ctx.lineTo(px+210,py);ctx.stroke();
  ctx.fillStyle=Deck.rgb('--text');ctx.save();ctx.translate(px,py);ctx.rotate(-m.rad);ctx.fillRect(-15,-7,30,14);ctx.beginPath();ctx.moveTo(15,-12);ctx.lineTo(31,0);ctx.lineTo(15,12);ctx.fill();ctx.restore();
  const L=145, hx=L*Math.cos(m.rad), ry=L*Math.sin(m.rad);
  ctx.strokeStyle=accent;ctx.lineWidth=5;Deck.arrow(ctx,px,py,px+hx,py,11);
  ctx.strokeStyle=warm;ctx.lineWidth=4;Deck.arrow(ctx,px+hx,py,px+hx,py-ry,10);
  ctx.strokeStyle=accent;ctx.lineWidth=4;Deck.arrow(ctx,px,py,px+hx,py-ry,12);
  ctx.strokeStyle=Deck.rgba('--accent',.55);ctx.lineWidth=3;ctx.setLineDash([7,7]);ctx.beginPath();ctx.moveTo(px,py);const bend=1-m.deg/90;ctx.quadraticCurveTo(px+hx*1.5,py-ry*.9+55*bend,px+hx*2.25,py-ry*1.25+75*bend);ctx.stroke();ctx.setLineDash([]);
}
angle.addEventListener('input',update);
document.getElementById('reset').addEventListener('click',()=>{angle.value=65;update();angle.focus();});
Deck.onResize(draw);update();
</script>
</body>
</html>
