<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/lib/katex.min.css">
  <style>
    #main{display:flex;flex-direction:column;gap:10px}
    .preset-bar{height:42px;display:flex;align-items:center;gap:10px}
    .preset-bar .hint{margin-right:auto;color:var(--ink-soft);font-size:var(--fs-label);font-weight:650}
    .preset-bar button{min-height:38px;padding:6px 16px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--paper);color:var(--text);font:650 var(--fs-label)/1.35 var(--font-sans);cursor:pointer}
    .preset-bar button[aria-pressed="true"]{color:#fff;border-color:var(--accent);background:var(--accent)}
    .preset-bar .reset{color:var(--accent);border-color:var(--accent)}
    .well-generalization{height:568px;grid-template-columns:minmax(0,1.65fr) 42px minmax(330px,.72fr)}
    .well-generalization>.claim{position:relative;align-self:stretch;padding:0;overflow:hidden;border-left-width:8px;background:var(--paper);box-shadow:var(--shadow)}
    .chart-wrap{position:absolute;inset:0;overflow:hidden}
    #wellChart{position:absolute;inset:0}
    .claim-copy{position:absolute;z-index:4;left:24px;right:230px;top:18px;padding:10px 14px;border-left:5px solid var(--accent);background:rgb(255 253 248 / 92%);font-size:var(--fs-lead);font-weight:780;line-height:1.4}
    .formula{position:absolute;z-index:4;right:20px;top:18px;padding:8px 12px;border-radius:var(--radius-sm);background:rgb(220 239 238 / 94%);font-size:20px}
    .readout{position:absolute;z-index:4;right:18px;bottom:18px;width:255px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:rgb(255 253 248 / 94%);font-size:var(--fs-sec);font-weight:650;line-height:1.45}
    .readout strong{display:block;color:var(--accent);font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
    .vehicles{position:absolute;z-index:4;left:22px;bottom:18px;display:flex;gap:12px;padding:9px 12px;border-radius:var(--radius-sm);background:rgb(255 253 248 / 92%);font-size:var(--fs-label);font-weight:700}
    .vehicles span{display:flex;align-items:center;gap:6px}.same-arrow{color:var(--accent);font-size:21px}
    .handle{position:absolute;z-index:6;width:34px;height:34px;margin:-17px 0 0 -17px;border:4px solid var(--paper);border-radius:50%;background:var(--accent-2);box-shadow:0 0 0 2px var(--accent-2),0 5px 14px rgb(23 33 43 / 25%);cursor:grab;touch-action:none}
    .handle:focus-visible{outline:4px solid var(--focus);outline-offset:5px}.handle:active{cursor:grabbing}
    .axis-tip{position:absolute;z-index:4;left:22px;top:118px;color:var(--ink-soft);font-size:var(--fs-label);font-weight:680;line-height:1.5}
    .well-generalization>.supports{gap:10px}
    .well-generalization>.supports>.support{padding:12px 16px;font-size:var(--fs-sec);line-height:1.4}
    .support b{display:block;margin-bottom:2px;color:var(--accent);font-size:var(--fs-body)}
    .support.active{border-color:var(--accent-2);background:var(--accent-warm)}
    .feedback{color:var(--text);font-weight:680}
    .support small{display:block;margin-top:4px;color:var(--ink-soft);font-size:var(--fs-label);line-height:1.35}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body data-page="25" data-total="48">
  <div id="stage">
    <main id="main">
      <div class="preset-bar" aria-label="天体参数预设">
        <span class="hint">拖动橙色控制柄：左右改出发半径，上下改天体质量。方向键也可操作。</span>
        <button type="button" data-body="moon">月球</button>
        <button type="button" data-body="mars">火星</button>
        <button type="button" data-body="earth" aria-pressed="true">地球</button>
        <button type="button" class="reset">重置</button>
      </div>
      <section class="k-generalization well-generalization" aria-label="逃逸速度的中心主张与四条支撑">
        <div class="claim min0">
          <div class="chart-wrap no-pan" id="wellWrap">
            <div id="wellChart" role="img" aria-label="抽象重力井剖面：质量增大使井加深，出发半径增大使起点外移；橙色箭头表示当前逃逸速度。"></div>
            <p class="claim-copy">离开天体所需的逃逸速度，由天体质量 M 与出发半径 r 决定，不由火箭自身质量决定。</p>
            <div class="formula" id="formula" aria-label="逃逸速度等于二倍通用引力常量乘天体质量除以出发半径，再开平方"></div>
            <div class="axis-tip">M ↑：井更深，vₑ ↑<br>r →：起点更远，vₑ ↓</div>
            <div class="vehicles" aria-label="轻型探测器与重型飞船面对相同速度门槛">
              <span>轻型探测器 <i class="same-arrow">⟶</i></span><span>重型飞船 <i class="same-arrow">⟶</i></span>
            </div>
            <div class="readout" aria-live="polite"><strong id="speedOut"></strong><span id="paramsOut"></span></div>
            <div class="handle" id="handle" role="slider" tabindex="0" aria-label="二维重力井控制柄；左右调整出发半径，上下调整天体质量"></div>
          </div>
        </div>
        <div class="trunk" aria-hidden="true"></div>
        <div class="supports min0">
          <div class="support" id="massSupport"><b>M ↑ → vₑ ↑</b><span>相同出发半径下，质量越大，速度门槛越高。</span></div>
          <div class="support" id="radiusSupport"><b>r ↑ → vₑ ↓</b><span>r 是天体中心到出发点的距离；起点越远，门槛越低。</span></div>
          <div class="support"><b>两个变量必须一起看</b><span>不能只凭天体“更大”或“更重”判断。</span><small id="feedback" class="feedback">当前为地球表面参数。</small></div>
          <div class="support"><b>飞行器质量不在公式中</b><span>轻重飞行器面对同一 vₑ 门槛。</span><small>更重的飞行器通常需要更多推进资源才能达到门槛。</small></div>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/lib/katex.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:25,kicker:"GRAVITY WELL",title:"拉宽重力井，逃离速度会怎样变？",take:"离开天体所需的逃逸速度取决于天体质量与出发半径，而不是火箭自身质量。"});
    Deck.init({index:25,total:48});
    const bodies={moon:{name:'月球',m:Lec.K.moon.mass,r:Lec.K.moon.meanRadius},mars:{name:'火星',m:Lec.K.mars.mass,r:Lec.K.mars.meanRadius},earth:{name:'地球',m:Lec.K.earth.mass,r:Lec.K.earth.meanRadius}};
    const minM=bodies.moon.m,maxM=bodies.earth.m,minR=bodies.moon.r,maxR=bodies.earth.r, metrePerKm=Lec.P.kilometresToMetres(1);
    let m=bodies.earth.m,r=bodies.earth.r,lastM=m,lastR=r,dragging=false;
    const wrap=document.getElementById('wellWrap'),handle=document.getElementById('handle'),chart=echarts.init(document.getElementById('wellChart'),null,{renderer:'svg'});
    katex.render('v_e=(2GM/r)^{1/2}',document.getElementById('formula'),{throwOnError:false});
    function safe(v,lo,hi,fallback){return Lec.P.positive(Lec.P.clamp(Lec.P.finiteNumber(v,fallback),lo,hi),fallback)}
    function normM(v){return Math.log(v/minM)/Math.log(maxM/minM)}
    function setFromNorm(x,y){r=safe(minR+x*(maxR-minR),minR,maxR,bodies.earth.r);m=safe(minM*Math.pow(maxM/minM,1-y),minM,maxM,bodies.earth.m);update('free')}
    function nearest(){let hit=null,best=.055;Object.keys(bodies).forEach(k=>{const b=bodies[k],d=Math.hypot((r-b.r)/(maxR-minR),(normM(m)-normM(b.m)));if(d<best){best=d;hit=k}});return hit}
    function update(mode){
      const x=(r-minR)/(maxR-minR), ym=normM(m), w=wrap.clientWidth,h=wrap.clientHeight;
      const depth=.34+.48*ym, width=.28+.34*x, pts=[];
      for(let i=0;i<=60;i++){const xx=i/60, z=(xx-.5)/width, yy=.78-depth*Math.exp(-z*z*2.2);pts.push([xx,yy])}
      const ve=Lec.P.escapeVelocity(m,r), kms=ve/metrePerKm, vmax=Lec.P.escapeVelocity(maxM,minR)/metrePerKm;
      chart.setOption({animation:false,textStyle:{fontSize:16,fontFamily:Deck.token('--font-sans')},grid:{left:18,right:18,top:112,bottom:16},xAxis:{type:'value',min:0,max:1,show:false},yAxis:{type:'value',min:0,max:1,inverse:true,show:false},series:[{type:'line',silent:true,symbol:'none',smooth:true,data:pts,lineStyle:{width:5,color:Deck.token('--accent')},areaStyle:{color:Deck.rgba('--accent',.12)}},{type:'line',silent:true,symbol:'none',data:[[.5,.78-depth],[.5,.78-depth-Math.min(.25,.07+.18*kms/vmax)]],lineStyle:{width:7,color:Deck.token('--accent-2')}}]});
      handle.style.transform=`translate(${Math.round(80+x*(w-160))}px,${Math.round(165+(1-ym)*(h-265))}px)`;
      document.getElementById('speedOut').textContent=Deck.fmt(kms,2)+' km/s';
      document.getElementById('paramsOut').textContent='M = '+m.toExponential(2)+' kg · r = '+Deck.fmt(Lec.P.metresToKilometres(r),0)+' km';
      const snap=nearest(); document.querySelectorAll('[data-body]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.body===snap)));
      let msg='两个因素正在相互竞争，请看实时计算结果。';
      if(mode==='preset') msg='不能只看天体“多大”或“多重”；质量与半径必须一起判断。';
      else if(Math.abs(m-lastM)>Math.abs(lastM)*.0001&&Math.abs(r-lastR)<100) msg='井更深：所需逃逸速度上升。';
      else if(Math.abs(r-lastR)>100&&Math.abs(m-lastM)<lastM*.0001) msg='起点离中心更远：所需逃逸速度下降。';
      document.getElementById('feedback').textContent=(snap?('接近'+bodies[snap].name+'。'):'自由参数。')+msg;
      document.getElementById('massSupport').classList.toggle('active',Math.abs(m-lastM)>lastM*.0001);
      document.getElementById('radiusSupport').classList.toggle('active',Math.abs(r-lastR)>100);
      handle.setAttribute('aria-valuetext','质量 '+m.toExponential(2)+' 千克，半径 '+Deck.fmt(Lec.P.metresToKilometres(r),0)+' 千米，逃逸速度 '+Deck.fmt(kms,2)+' 千米每秒');
      lastM=m;lastR=r;
    }
    function pointer(e){const p=Deck.pt(wrap,e);let x=Deck.clamp((p.x-80)/(wrap.clientWidth-160),0,1),y=Deck.clamp((p.y-165)/(wrap.clientHeight-265),0,1);setFromNorm(x,y)}
    handle.addEventListener('pointerdown',e=>{dragging=true;handle.setPointerCapture(e.pointerId);pointer(e)});handle.addEventListener('pointermove',e=>{if(dragging)pointer(e)});handle.addEventListener('pointerup',()=>dragging=false);
    handle.addEventListener('keydown',e=>{const step=e.shiftKey?.08:.025;let x=(r-minR)/(maxR-minR),y=1-normM(m);if(e.key==='ArrowLeft')x-=step;else if(e.key==='ArrowRight')x+=step;else if(e.key==='ArrowUp')y-=step;else if(e.key==='ArrowDown')y+=step;else if(e.key==='Home'){setBody('moon');e.preventDefault();return}else if(e.key==='End'){setBody('earth');e.preventDefault();return}else if(e.key.toLowerCase()==='r'){setBody('earth');e.preventDefault();return}else return;e.preventDefault();setFromNorm(Deck.clamp(x,0,1),Deck.clamp(y,0,1))});
    function setBody(k){m=bodies[k].m;r=bodies[k].r;update('preset')}
    document.querySelectorAll('[data-body]').forEach(b=>b.addEventListener('click',()=>setBody(b.dataset.body)));document.querySelector('.reset').addEventListener('click',()=>setBody('earth'));
    Deck.onResize(()=>{chart.resize();update('resize')});update('preset');
  </script>
</body>
</html>
