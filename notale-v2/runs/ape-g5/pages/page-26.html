<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:14px}
    .intro{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:42px}
    .intro p{font-size:var(--fs-sec);color:var(--ink-soft)}
    .reset{min-height:42px;padding:8px 20px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);color:var(--text);font:700 var(--fs-label)/1.35 var(--font-sans);background:linear-gradient(180deg,var(--paper),var(--paper-2));box-shadow:0 4px 8px rgb(23 33 43 / 10%),inset 0 1px 0 #fff;cursor:pointer}
    .reset:active{transform:translateY(1px);box-shadow:inset 0 3px 7px rgb(23 33 43 / 18%)}
    .compare-wrap{position:relative;flex:1;min-height:0}
    .k-comparison{--compare-cols:3;height:100%;grid-template-columns:150px repeat(3,minmax(0,1fr));grid-template-rows:82px 58px 64px 92px 1fr;box-shadow:var(--shadow)}
    .k-comparison>.hdr,.k-comparison>.dim,.k-comparison>.cell{display:flex;align-items:center}
    .k-comparison>.hdr:first-child{font-size:var(--fs-label);color:var(--ink-soft)}
    .place{position:relative;justify-content:center;padding:10px!important;cursor:pointer;background:linear-gradient(180deg,#fffdf8,#e5e0d4)!important;box-shadow:inset 0 1px 0 #fff,inset 0 -2px 3px rgb(23 33 43 / 9%)}
    .place input{position:absolute;opacity:0;width:1px;height:1px}
    .place:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:-4px}
    .place:has(input:checked){color:var(--accent);background:linear-gradient(180deg,#f7ffff,var(--accent-soft))!important;box-shadow:inset 0 4px 10px rgb(0 109 119 / 16%),inset 0 -1px 0 #fff}
    .place:has(input:checked)::after{content:"乘员在此";position:absolute;bottom:5px;font-size:var(--fs-label);font-weight:700;color:var(--accent)}
    .planet{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;margin-right:12px;border-radius:50%;color:#fff;font-size:var(--fs-label);font-weight:800;box-shadow:inset -7px -7px 12px rgb(23 33 43 / 25%),0 3px 7px rgb(23 33 43 / 18%)}
    .earth{background:linear-gradient(135deg,var(--accent),#7eb68b)}.moon{background:linear-gradient(135deg,#d8d4ca,#8b948f)}.mars{background:linear-gradient(135deg,var(--accent-2),#a43d3d)}
    .cell{justify-content:center;position:relative;font-variant-numeric:tabular-nums;font-size:var(--fs-body)!important}
    .mass{font-weight:760;background:var(--accent-soft)}
    .mass.flash{animation:pulse 420ms ease}
    @keyframes pulse{50%{box-shadow:inset 0 0 0 3px var(--accent)}}
    .gravity{color:var(--ink-soft)}
    .weight-cell{flex-direction:column;justify-content:center!important;gap:8px;font-size:var(--fs-h2)!important;font-weight:780}
    .meter{width:84%;height:12px;border:1px solid var(--line-strong);border-radius:999px;background:var(--paper-2);box-shadow:inset 0 2px 4px rgb(23 33 43 / 16%);overflow:hidden}
    .meter>i{display:block;height:100%;width:var(--w);border-radius:inherit;background:linear-gradient(180deg,#24a0a8,var(--accent));transition:width 220ms ease}
    .weight-cell.active{background:var(--accent-warm)}
    .relation{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:24px;padding:13px 24px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper)}
    .formula{font-size:28px;font-weight:800;letter-spacing:.03em;color:var(--accent)}
    .explain{font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .feedback{font-size:var(--fs-sec);font-weight:650;color:var(--text);padding-left:16px;border-left:4px solid var(--accent)}
    @media (prefers-reduced-motion:reduce){.meter>i{transition:none}.mass.flash{animation:none}}
  </style>
</head>
<body data-page="26" data-total="48">
  <div id="stage">
    <main id="main">
      <div class="intro">
        <p>选择一个天体，横向比较同一名乘员的质量、当地重力和重量。</p>
        <button class="reset" id="reset" type="button" title="快捷键 R">重置到地球</button>
      </div>

      <section class="compare-wrap" aria-label="地球、月球与火星上的质量和重量比较">
        <div class="k-comparison" id="comparison">
          <div class="hdr">对齐维度</div>
          <label class="hdr place"><input type="radio" name="place" value="earth" checked><span class="planet earth">地</span>地球</label>
          <label class="hdr place"><input type="radio" name="place" value="moon"><span class="planet moon">月</span>月球</label>
          <label class="hdr place"><input type="radio" name="place" value="mars"><span class="planet mars">火</span>火星</label>

          <div class="dim">质量</div><div class="cell mass"></div><div class="cell mass"></div><div class="cell mass"></div>
          <div class="dim">当地重力</div><div class="cell gravity"></div><div class="cell gravity"></div><div class="cell gravity"></div>
          <div class="dim">重量</div><div class="cell weight-cell"><span></span><div class="meter"><i></i></div></div><div class="cell weight-cell"><span></span><div class="meter"><i></i></div></div><div class="cell weight-cell"><span></span><div class="meter"><i></i></div></div>
          <div class="dim">当前地点</div><div class="cell" id="earth-state">同一名乘员</div><div class="cell" id="moon-state">同一名乘员</div><div class="cell" id="mars-state">同一名乘员</div>
        </div>
      </section>

      <div class="relation">
        <div class="formula" aria-label="重量等于质量乘以当地重力">W = m × g</div>
        <div class="explain">重量 = 质量 × 当地重力；kg 是质量单位，N（牛顿）是重量单位。</div>
      </div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 26,
      kicker: "MASS ≠ WEIGHT",
      title: "同一个人，在不同天体上有多“重”？",
      take: "天地换了，质量没换"
    });
    Deck.init({ index: 26, total: 48 });

    (function(){
      var massKg = Lec.K.human.nominalBodyMassKilograms;
      var bodies = [
        {key:'earth', name:'地球', mass:Lec.K.earth.mass, radius:Lec.K.earth.meanRadius},
        {key:'moon', name:'月球', mass:Lec.K.moon.mass, radius:Lec.K.moon.meanRadius},
        {key:'mars', name:'火星', mass:Lec.K.mars.mass, radius:Lec.K.mars.meanRadius}
      ];
      bodies.forEach(function(b){
        b.g = Lec.P.gravity(b.mass,b.radius);
        b.weight = Lec.P.weightOnBody(massKg,b.mass,b.radius);
      });
      var earthWeight=bodies[0].weight;
      var masses=document.querySelectorAll('.mass');
      var gravities=document.querySelectorAll('.gravity');
      var weights=document.querySelectorAll('.weight-cell');
      var radios=Array.from(document.querySelectorAll('input[name="place"]'));
      bodies.forEach(function(b,i){
        masses[i].textContent=Deck.fmt(massKg,0)+' kg';
        gravities[i].textContent=Deck.fmt(b.g,2)+' m/s²';
        weights[i].querySelector('span').textContent=Deck.fmt(b.weight,0)+' N';
        weights[i].querySelector('i').style.setProperty('--w',(Lec.P.ratio(b.weight,earthWeight)*100)+'%');
      });
      function select(key,resetting){
        var idx=bodies.findIndex(function(b){return b.key===key});
        var b=bodies[idx];
        radios[idx].checked=true;
        weights.forEach(function(el,i){el.classList.toggle('active',i===idx)});
        bodies.forEach(function(x,i){document.getElementById(x.key+'-state').textContent=i===idx?'乘员站位 ●':'同一名乘员'});
        masses.forEach(function(el){el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash')});
        document.getElementById('feedback').textContent=(resetting?'回到地球：恢复的是地球上的重量，不是恢复质量。':'地点变为'+b.name+'：')+'质量仍是'+Deck.fmt(massKg,0)+' kg；当地重力为'+Deck.fmt(b.g,2)+' m/s²，所以重量为'+Deck.fmt(b.weight,0)+' N。';
      }
      radios.forEach(function(r){r.addEventListener('change',function(){select(r.value,false)})});
      document.getElementById('reset').addEventListener('click',function(){massKg=Lec.K.human.nominalBodyMassKilograms;select('earth',true)});
      document.addEventListener('keydown',function(e){if(e.key.toLowerCase()==='r'&&!e.ctrlKey&&!e.metaKey){select('earth',true)}});
      select('earth',false);
    })();
  </script>
</body>
</html>
