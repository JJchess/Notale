<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/lib/katex.min.css">
  <style>
    #main{display:flex;flex-direction:column;gap:16px}
    .force-stage{height:292px;display:grid;grid-template-columns:minmax(0,1fr) 270px minmax(0,1fr);gap:24px;align-items:stretch}
    .craft{position:relative;min-width:0;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper);overflow:hidden;display:grid;grid-template-columns:104px 1fr 104px;align-items:center;padding:18px 24px;box-sizing:border-box}
    .craft-name{position:absolute;top:14px;left:18px;font-size:var(--fs-h2);font-weight:740}.mass{position:absolute;top:19px;right:18px;color:var(--ink-soft);font-size:var(--fs-label);font-weight:680}
    .force{height:184px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-soft);font-size:var(--fs-label);font-weight:700}
    .shaft{position:relative;width:5px;border-radius:5px;background:var(--line-strong);transition:height 220ms ease-out}.up .shaft{background:var(--accent)}
    .up .shaft:before{content:"";position:absolute;top:-11px;left:-7px;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:14px solid var(--accent)}
    .down .shaft:after{content:"";position:absolute;bottom:-11px;left:-7px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:14px solid var(--line-strong)}
    .rocket-wrap{align-self:end;text-align:center;transition:transform 240ms ease-out}.rocket{width:68px;height:118px;margin:auto;clip-path:polygon(50% 0,78% 27%,78% 75%,100% 100%,62% 90%,50% 100%,38% 90%,0 100%,22% 75%,22% 27%);background:linear-gradient(90deg,var(--paper-2),#fff 48%,var(--line));border-bottom:8px solid var(--ink-soft)}
    .pad{height:8px;margin-top:4px;border-radius:2px;background:var(--line-strong)}.craft-state{margin-top:8px;font-size:var(--fs-sec);font-weight:720;line-height:1.45}
    .control-bay{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:1px solid var(--line);border-radius:var(--radius-lg);background:linear-gradient(180deg,#fffdf8,var(--paper-2));box-shadow:0 12px 24px rgb(23 33 43 / 14%),inset 0 1px 0 #fff,inset 0 -2px 0 rgb(83 97 108 / 20%)}
    .control-bay:before,.control-bay:after{content:"";position:absolute;top:50%;width:25px;height:2px;background:var(--accent)}.control-bay:before{right:100%}.control-bay:after{left:100%}
    .dial{position:relative;width:82px;height:82px;border-radius:50%;background:radial-gradient(circle at 38% 28%,#fff 0 8%,var(--paper-2) 44%,#aeb5b2 100%);box-shadow:0 8px 14px rgb(23 33 43 / 22%),inset 0 2px 2px #fff,inset 0 -3px 5px rgb(23 33 43 / 20%)}
    .needle{position:absolute;left:39px;top:10px;width:4px;height:32px;border-radius:3px;background:var(--accent);transform-origin:2px 30px;transition:transform 180ms ease-out}
    .thrust-reading{font-size:var(--fs-h2);font-weight:780;color:var(--accent);font-variant-numeric:tabular-nums}.control-bay label{font-size:var(--fs-label);font-weight:720}
    .control-bay input{width:210px;accent-color:var(--accent)}.reset{min-height:38px;padding:6px 18px;border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent);color:#fff;font:700 var(--fs-label) var(--font-sans);cursor:pointer;box-shadow:0 3px 0 #005b63}.reset:active{transform:translateY(2px);box-shadow:0 1px 0 #005b63}
    .formula{font-size:20px;line-height:1.35;text-align:center}.formula-note{font-size:var(--fs-sec);line-height:var(--lh-sec);text-align:center;color:var(--ink-soft)}
    .lower{height:300px;display:grid;grid-template-columns:570px minmax(0,1fr);gap:30px}.chart-panel{position:relative;padding:10px 14px}.chart{width:100%;height:100%}
    .compare{height:100%;grid-template-columns:132px repeat(2,minmax(0,1fr));align-content:stretch}.compare>.hdr,.compare>.dim,.compare>.cell{padding:8px 12px;display:flex;align-items:center}.compare>.hdr{font-size:var(--fs-body)}.compare>.dim{font-size:var(--fs-label)}.compare>.cell{font-size:var(--fs-sec)}
    .value{font-weight:760;font-variant-numeric:tabular-nums}.status{font-weight:720}.feedback{grid-column:1/-1;padding:8px 14px;background:var(--accent-soft);font-size:var(--fs-sec);font-weight:730;line-height:1.45;border-top:1px solid var(--accent)}
    @media(prefers-reduced-motion:reduce){.shaft,.rocket-wrap,.needle{transition:none}}
  </style>
</head>
<body data-page="28" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="force-stage" aria-label="同一推力作用于轻重两架飞行器的受力比较">
        <article class="craft min0">
          <h2 class="craft-name">较轻飞行器</h2><div class="mass" id="lm"></div>
          <div class="force up"><span>推力 T</span><i class="shaft" id="lu"></i></div>
          <div class="rocket-wrap" id="lr"><div class="rocket" aria-hidden="true"></div><div class="pad"></div><div class="craft-state" id="ls"></div></div>
          <div class="force down"><span>重量 W</span><i class="shaft" id="ld"></i></div>
        </article>
        <section class="control-bay" aria-label="共同推力控制器">
          <label for="thrust">共同推力</label>
          <div class="dial" aria-hidden="true"><i class="needle" id="needle"></i></div>
          <output class="thrust-reading" id="tr" for="thrust"></output>
          <input id="thrust" type="range" aria-label="调节两架飞行器的共同推力">
          <div class="formula" id="formula"></div>
          <div class="formula-note">推力除以重量；两者都用牛顿（N）表示。</div>
          <button class="reset" id="reset" type="button">重置</button>
        </section>
        <article class="craft min0">
          <h2 class="craft-name">较重飞行器</h2><div class="mass" id="hm"></div>
          <div class="force up"><span>推力 T</span><i class="shaft" id="hu"></i></div>
          <div class="rocket-wrap" id="hr"><div class="rocket" aria-hidden="true"></div><div class="pad"></div><div class="craft-state" id="hs"></div></div>
          <div class="force down"><span>重量 W</span><i class="shaft" id="hd"></i></div>
        </article>
      </section>
      <section class="lower min0">
        <div class="panel chart-panel min0"><div id="chart" class="chart" role="img" aria-label="两架飞行器的推力与重量水平对比条"></div></div>
        <div class="k-comparison compare min0" aria-label="四个维度的对齐比较">
          <div class="hdr">比较维度</div><div class="hdr">较轻飞行器</div><div class="hdr">较重飞行器</div>
          <div class="dim">推力</div><div class="cell value" id="lt"></div><div class="cell value" id="ht"></div><div class="rowline"></div>
          <div class="dim">重量</div><div class="cell value" id="lw"></div><div class="cell value" id="hw"></div><div class="rowline"></div>
          <div class="dim">推重比</div><div class="cell value diff" id="lratio"></div><div class="cell value diff" id="hratio"></div><div class="rowline"></div>
          <div class="dim">理想离地判断</div><div class="cell status" id="lj"></div><div class="cell status" id="hj"></div>
          <div class="feedback" id="feedback" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/lib/katex.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:28,kicker:"THRUST / WEIGHT",title:"推力够不够，要看它正在托起多重的飞行器",take:"推力必须结合飞行器重量判断；推力大不等于一定能离地。"});
    Deck.init({index:28,total:48});
    const g=Lec.K.physics.standardGravity;
    const lightMass=Lec.K.human.nominalBodyMassKilograms*10, heavyMass=Lec.K.human.nominalBodyMassKilograms*20;
    const safeLight=Lec.P.positive(lightMass,1), safeHeavy=Lec.P.positive(heavyMass,1);
    const lightWeight=Lec.P.weight(safeLight,g), heavyWeight=Lec.P.weight(safeHeavy,g);
    const minT=0, maxT=1.5*heavyWeight, initialT=1.1*lightWeight;
    const input=document.querySelector('#thrust'); input.min=minT; input.max=maxT; input.step=10; input.value=initialT;
    document.querySelector('#lm').textContent=Deck.fmt(lightMass,0)+' kg'; document.querySelector('#hm').textContent=Deck.fmt(heavyMass,0)+' kg';
    katex.render(String.raw`\text{推重比}=\frac{T}{mg}`,document.querySelector('#formula'),{throwOnError:false});
    const chart=echarts.init(document.querySelector('#chart'),null,{renderer:'svg'});
    function verdict(r){if(Math.abs(r-1)<0.01)return '恰好平衡';return r>1?'达到理想离地门槛':'推力小于重量'}
    function update(){
      let raw=Lec.P.finiteNumber(Number(input.value),initialT); let thrust=Lec.P.clamp(raw,minT,maxT); input.value=thrust;
      const lr=Lec.P.thrustToWeight(thrust,safeLight,g), hr=Lec.P.thrustToWeight(thrust,safeHeavy,g);
      const ltxt=verdict(lr), htxt=verdict(hr), n=Deck.fmt(thrust,0)+' N';
      document.querySelector('#tr').textContent=n; document.querySelector('#lt').textContent=n; document.querySelector('#ht').textContent=n;
      document.querySelector('#lw').textContent=Deck.fmt(lightWeight,0)+' N'; document.querySelector('#hw').textContent=Deck.fmt(heavyWeight,0)+' N';
      document.querySelector('#lratio').textContent=Deck.fmt(lr,2); document.querySelector('#hratio').textContent=Deck.fmt(hr,2);
      document.querySelector('#lj').textContent=ltxt; document.querySelector('#hj').textContent=htxt; document.querySelector('#ls').textContent=ltxt; document.querySelector('#hs').textContent=htxt;
      const bothNear=Math.abs(lr-1)<.04||Math.abs(hr-1)<.04;
      let fb=bothNear?'推力与重量接近平衡；这不是明显向上加速的状态。':(lr>1&&hr<1?'同样的推力，对较轻者足够，对较重者不足。':(lr<1&&hr<1?'推力都小于各自重量。':'两者都达到理想离地门槛，但推重比仍不同。'));
      document.querySelector('#feedback').textContent=fb;
      const upH=32+112*(thrust/maxT); document.querySelector('#lu').style.height=upH+'px';document.querySelector('#hu').style.height=upH+'px';
      document.querySelector('#ld').style.height=(32+112*lightWeight/maxT)+'px';document.querySelector('#hd').style.height=(32+112*heavyWeight/maxT)+'px';
      document.querySelector('#lr').style.transform=lr>1?'translateY(-7px)':'none';document.querySelector('#hr').style.transform=hr>1?'translateY(-7px)':'none';
      document.querySelector('#needle').style.transform='rotate('+(-125+250*thrust/maxT)+'deg)';
      document.querySelector('#feedback').setAttribute('aria-label',fb+' 当前共同推力'+n+'；较轻飞行器推重比'+Deck.fmt(lr,2)+'，'+ltxt+'；较重飞行器推重比'+Deck.fmt(hr,2)+'，'+htxt+'。');
      chart.setOption({animation:!Deck.reduced(),textStyle:{fontSize:16,fontFamily:Deck.token('--font-sans')},grid:[{left:92,right:22,top:34,height:72},{left:92,right:22,top:148,height:72}],xAxis:[0,1].map((_,i)=>({type:'value',min:0,max:maxT,gridIndex:i,axisLabel:{fontSize:13,formatter:v=>Deck.fmt(v/1000,0)+' kN'},splitLine:{lineStyle:{color:Deck.token('--line')}}})),yAxis:[{type:'category',gridIndex:0,data:['重量','推力'],axisLabel:{fontSize:14}},{type:'category',gridIndex:1,data:['重量','推力'],axisLabel:{fontSize:14}}],series:[{type:'bar',xAxisIndex:0,yAxisIndex:0,data:[lightWeight,thrust],barWidth:18,itemStyle:{color:p=>p.dataIndex?Deck.token('--accent'):Deck.token('--line-strong')},markLine:{symbol:'none',label:{fontSize:14,formatter:'T = W'},lineStyle:{color:Deck.token('--accent-2'),width:2},data:[{xAxis:lightWeight}]}},{type:'bar',xAxisIndex:1,yAxisIndex:1,data:[heavyWeight,thrust],barWidth:18,itemStyle:{color:p=>p.dataIndex?Deck.token('--accent'):Deck.token('--line-strong')},markLine:{symbol:'none',label:{fontSize:14,formatter:'T = W'},lineStyle:{color:Deck.token('--accent-2'),width:2},data:[{xAxis:heavyWeight}]}}],title:[{text:'较轻飞行器',left:10,top:2,textStyle:{fontSize:16}},{text:'较重飞行器',left:10,top:116,textStyle:{fontSize:16}}],tooltip:{trigger:'axis',textStyle:{fontSize:16},valueFormatter:v=>Deck.fmt(v,0)+' N'}},true);
    }
    input.addEventListener('input',update); document.querySelector('#reset').addEventListener('click',()=>{input.value=initialT;update();input.focus()});
    update(); window.addEventListener('resize',()=>chart.resize());
  </script>
</body>
</html>
