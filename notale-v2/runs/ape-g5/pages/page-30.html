<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/lib/katex.min.css">
  <style>
    #main{display:flex;flex-direction:column;gap:16px}
    .mission{display:flex;gap:16px;height:448px;min-height:0}
    .orbit-panel{position:relative;flex:1 1 0;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper)}
    .orbit-panel:focus{outline:4px solid var(--focus);outline-offset:2px}
    .orbit-panel canvas{display:block}
    .orbit-help{position:absolute;left:16px;top:14px;z-index:2;max-width:390px;padding:8px 12px;border-radius:var(--radius-sm);background:rgb(255 253 248 / 90%);font-size:var(--fs-label);font-weight:680;line-height:1.35}
    .conditions{position:absolute;left:16px;bottom:14px;z-index:2;padding:8px 12px;border-radius:var(--radius-sm);background:rgb(255 253 248 / 92%);color:var(--ink-soft);font-size:var(--fs-label);line-height:1.35}
    .budget{width:450px;min-width:0;display:flex;flex-direction:column;gap:8px}
    .budget.k-enumeration{--item-cols:1;gap:8px}
    .budget.k-enumeration>.it{padding:10px 42px 9px 14px;box-shadow:none}
    .budget h2{font-size:var(--fs-body)}
    .budget p{font-size:var(--fs-sec);line-height:1.4}
    .metric{color:var(--accent);font-weight:780;font-variant-numeric:tabular-nums}
    .total{border-color:var(--accent)!important;background:var(--accent-soft)!important}
    .formula{font-size:20px;line-height:1.35;margin-top:3px}
    .controls{display:flex;align-items:center;gap:10px}
    .controls button{min-height:42px;padding:8px 18px;color:#fff;font:700 var(--fs-label) var(--font-sans);border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent)}
    .status{flex:1;min-width:0;color:var(--ink-soft);font-size:var(--fs-sec);line-height:1.4}
    .chart-row{height:156px;display:flex;gap:16px;min-height:0}
    #chart{flex:1 1 0;min-width:0;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper)}
    .model-note{width:450px;box-sizing:border-box;padding:12px 16px}
    .model-note p{font-size:var(--fs-sec);line-height:1.4}
  </style>
</head>
<body data-page="30" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="mission">
        <div id="orbit" class="orbit-panel no-pan min0" tabindex="0" role="slider" aria-label="目标轨道高度" aria-valuemin="800" aria-valuemax="38226" aria-valuenow="6371" aria-valuetext="目标高度 6371 千米">
          <canvas id="orbitCanvas" class="cv-fill" aria-hidden="true"></canvas>
          <div class="orbit-help">拖动外侧目标轨道；方向键也可调整高度。</div>
          <div class="conditions" id="conditions"></div>
        </div>
        <aside class="budget k-enumeration min0" aria-label="四项任务预算">
          <div class="it"><h2>点火 1｜进入转移椭圆</h2><p>出发轨道切点 · 支付 <span id="dv1" class="metric"></span></p></div>
          <div class="it"><h2>滑行｜沿半个椭圆等待</h2><p>发动机不必一路工作 · <span id="time" class="metric"></span></p></div>
          <div class="it"><h2>点火 2｜圆化目标轨道</h2><p>目标轨道切点 · 支付 <span id="dv2" class="metric"></span></p></div>
          <div class="it total"><h2>任务总账</h2><p><span id="total" class="metric"></span> · 理想推进剂 <span id="prop" class="metric"></span> · 氢氧比冲 <span id="isp"></span></p><div id="formula" class="formula" aria-label="总速度增量等于第一次与第二次速度增量之和"></div></div>
        </aside>
      </section>
      <div class="controls"><button id="reset" type="button">重置任务</button><div id="status" class="status" aria-live="polite">已回到基准任务。</div></div>
      <section class="chart-row">
        <div id="chart" aria-label="两次点火速度增量与滑行时间预算图"></div>
        <div class="model-note note"><p><strong>总速度增量</strong>是两次点火分别支付的速度变化之和，不是最终速度或距离。</p><p>理想双脉冲模型；忽略大气、自转、重力损失、结构限制与实际点火时长。</p></div>
      </section>
    </main>
  </div>
  <script src="assets/lib/katex.min.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:30,kicker:"ORBIT TRANSFER BUDGET",title:"两次点火，换一条轨道",take:"轨道转移是在时间、速度增量和燃料之间做预算，而非沿直线猛冲。"});
    Deck.init({index:30,total:48});
    const K=Lec.K,P=Lec.P;
    K.EARTH_MASS_KG ??= K.earth.mass; K.EARTH_RADIUS_M ??= K.earth.meanRadius;
    K.LEO_EXAMPLE_ALTITUDE_M ??= K.spaceflight.lowEarthOrbitRepresentativeAltitude;
    K.ISP_HYDROLOX_S ??= 450;
    const earth=K.EARTH_RADIUS_M, startAlt=K.LEO_EXAMPLE_ALTITUDE_M;
    const r1=earth+startAlt, minAlt=2*startAlt, maxAlt=6*earth, defaultAlt=earth;
    const kmFactor=P.kilometresToMetres(1), minuteSeconds=60;
    const orbit=document.getElementById('orbit'), cv=document.getElementById('orbitCanvas'), ctx=cv.getContext('2d');
    let altitude=defaultAlt, previous=defaultAlt, dragging=false, pending=false, previewStart=performance.now();
    const chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
    katex.render('\\Delta v_{\\text{总}}=\\Delta v_1+\\Delta v_2',document.getElementById('formula'),{throwOnError:false});
    function safe(v){return P.clamp(P.finiteNumber(v,defaultAlt),minAlt,maxAlt)}
    function result(){const r2=P.altitudeToRadius(earth,altitude);return {r2:r2,h:P.hohmannTransfer(r1,r2,K.EARTH_MASS_KG)}}
    function fmtTime(s){const mins=s/minuteSeconds;if(mins>=60){const h=Math.floor(mins/60),m=Math.round(mins-h*60);return `${Deck.fmt(mins,0)} min（${h} 小时 ${m} 分）`}return `${Deck.fmt(mins,0)} min`}
    function update(next,announce=true){previous=altitude;altitude=safe(next);previewStart=performance.now();const q=result(),h=q.h;
      document.getElementById('dv1').textContent=`Δv₁ ${Deck.fmt(h.deltaV1/kmFactor,3)} km/s`;
      document.getElementById('dv2').textContent=`Δv₂ ${Deck.fmt(h.deltaV2/kmFactor,3)} km/s`;
      document.getElementById('time').textContent=fmtTime(h.transferTime);
      document.getElementById('total').textContent=`Δv总 ${Deck.fmt(h.totalDeltaV/kmFactor,3)} km/s`;
      const frac=P.propellantFractionForDeltaV(h.totalDeltaV,K.ISP_HYDROLOX_S);
      document.getElementById('prop').textContent=`${Deck.fmt(P.percent(frac,1),1)}%`;
      document.getElementById('isp').textContent=`${Deck.fmt(K.ISP_HYDROLOX_S,0)} s`;
      document.getElementById('conditions').textContent=`地球 ${K.EARTH_MASS_KG.toExponential(4)} kg · 半径 ${Deck.fmt(P.metresToKilometres(earth),0)} km · 出发高度 ${Deck.fmt(P.metresToKilometres(startAlt),0)} km · 目标 ${Deck.fmt(P.metresToKilometres(altitude),0)} km`;
      const hk=Math.round(P.metresToKilometres(altitude));orbit.setAttribute('aria-valuenow',hk);orbit.setAttribute('aria-valuetext',`目标高度 ${hk} 千米`);
      chart.setOption({animationDuration:Deck.reduced()?0:220,textStyle:{fontSize:16,fontFamily:Deck.token('--font-sans')},grid:[{left:92,right:'55%',top:18,bottom:30},{left:'57%',right:25,top:18,bottom:30}],xAxis:[{type:'value',name:'km/s',axisLabel:{fontSize:13}},{type:'value',name:'min',gridIndex:1,axisLabel:{fontSize:13}}],yAxis:[{type:'category',data:['点火 2','点火 1'],axisLabel:{fontSize:14}},{type:'category',gridIndex:1,data:['滑行'],axisLabel:{fontSize:14}}],tooltip:{trigger:'axis',textStyle:{fontSize:16}},series:[{type:'bar',data:[h.deltaV2/kmFactor,h.deltaV1/kmFactor],itemStyle:{color:Deck.token('--accent')}},{type:'bar',xAxisIndex:1,yAxisIndex:1,data:[h.transferTime/minuteSeconds],itemStyle:{color:Deck.token('--accent-2')}}]});
      if(announce)document.getElementById('status').textContent=altitude===defaultAlt?'已回到基准任务。':altitude>previous?'目标更远：等待更久，总速度预算也发生变化。':'目标更近：转移时间缩短；请比较两次点火各自减少了多少。';scheduleDraw();
    }
    function scheduleDraw(){if(!pending){pending=true;requestAnimationFrame(()=>{pending=false;draw(performance.now())})}}
    function geometry(){const w=cv.clientWidth,h=cv.clientHeight,cx=w*.35,cy=h*.52,maxR=Math.min(h*.43,w*.31),scale=maxR/(earth+maxAlt),a=r1*scale,b=(earth+altitude)*scale;return {w,h,cx,cy,rIn:r1*scale,rOut:b,a:(a+b)/2,c:(b-a)/2,scale}}
    function draw(t){Deck.fit(cv);const g=geometry();ctx.clearRect(0,0,g.w,g.h);const accent=Deck.token('--accent'),warm=Deck.token('--accent-2'),line=Deck.token('--line');
      ctx.strokeStyle=line;ctx.lineWidth=2;ctx.setLineDash([7,7]);ctx.beginPath();ctx.arc(g.cx,g.cy,g.rIn,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle=accent;ctx.lineWidth=3;ctx.beginPath();ctx.arc(g.cx,g.cy,g.rOut,0,Math.PI*2);ctx.stroke();
      const earthPx=earth*g.scale;ctx.fillStyle=Deck.token('--accent-soft');ctx.beginPath();ctx.arc(g.cx,g.cy,earthPx,0,Math.PI*2);ctx.fill();ctx.strokeStyle=accent;ctx.stroke();
      ctx.strokeStyle=warm;ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(g.cx+g.c,g.cy,g.a,Math.sqrt(g.rIn*g.rOut),0,Math.PI,Math.PI*2);ctx.stroke();
      [[g.cx-g.rIn,'1'],[g.cx+g.rOut,'2']].forEach(([x,n],i)=>{ctx.fillStyle=warm;ctx.beginPath();ctx.arc(x,g.cy,9,0,Math.PI*2);ctx.fill();ctx.fillStyle=Deck.token('--text');ctx.font='700 15px '+Deck.token('--font-sans');ctx.fillText(n,x-4,g.cy-15)});
      const phases=Deck.reduced()?[.15,.5,.85]:[((t-previewStart)%5000)/5000];phases.forEach(p=>{const th=Math.PI+Math.PI*p,x=g.cx+g.c+g.a*Math.cos(th),y=g.cy+Math.sqrt(g.rIn*g.rOut)*Math.sin(th);ctx.fillStyle=Deck.token('--text');ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill()});
    }
    function fromPoint(e){const p=Deck.pt(orbit,e),g=geometry(),d=Math.hypot(p.x-g.cx,p.y-g.cy);return d/g.scale-earth}
    orbit.addEventListener('pointerdown',e=>{dragging=true;orbit.setPointerCapture(e.pointerId);update(fromPoint(e))});
    orbit.addEventListener('pointermove',e=>{if(dragging)update(fromPoint(e))});orbit.addEventListener('pointerup',()=>dragging=false);orbit.addEventListener('pointercancel',()=>dragging=false);
    orbit.addEventListener('keydown',e=>{const step=startAlt/4;if(e.key==='ArrowUp'||e.key==='ArrowRight'){e.preventDefault();update(altitude+step)}if(e.key==='ArrowDown'||e.key==='ArrowLeft'){e.preventDefault();update(altitude-step)}if(e.key==='Home'){e.preventDefault();update(minAlt)}if(e.key==='End'){e.preventDefault();update(maxAlt)}});
    document.getElementById('reset').addEventListener('click',()=>update(defaultAlt));Deck.onResize(()=>{chart.resize();scheduleDraw()});update(defaultAlt,false);Deck.loop((t)=>draw(t),{still:0});
  </script>
</body>
</html>
