<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:12px}
    .instruction{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--ink-soft)}
    .layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px;flex:1;min-height:0}
    .layout>.min0{min-width:0;min-height:0}
    .scene-panel{position:relative;display:flex;flex-direction:column;min-height:0;padding:16px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper);box-shadow:var(--shadow)}
    .scene{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:var(--radius-md);background:linear-gradient(155deg,#dcefee,#fffdf8 62%);perspective:900px}
    .earth{position:absolute;width:330px;height:330px;right:0;bottom:0;border-radius:50%;background:radial-gradient(circle at 35% 25%,#dcefee 0 24%,#006d77 25% 27%,#39734f 28% 31%,#006d77 32% 100%);opacity:0;transition:opacity 500ms ease}
    .orbit{position:absolute;right:22px;bottom:18px;width:390px;height:170px;border:2px dashed rgb(255 253 248 / 70%);border-radius:50%;opacity:0;transition:opacity 420ms ease}
    .craft{position:absolute;inset:48px 92px 44px;transform-style:preserve-3d;transition:transform 780ms cubic-bezier(.2,.75,.2,1)}
    .cabin{position:absolute;inset:0;border:5px solid var(--line-strong);border-radius:42% 42% 32% 32%;background:linear-gradient(90deg,rgb(235 231 220 / 96%),rgb(255 253 248 / 92%));box-shadow:inset 0 0 0 14px rgb(200 194 181 / 35%);transition:background 400ms ease,border-color 400ms ease}
    .window{position:absolute;right:28px;top:28px;width:95px;height:72px;border:5px solid var(--line-strong);border-radius:45%;background:#b9dadd}
    .person{position:absolute;left:43%;top:43%;width:58px;height:118px;transform:translate(-50%,-50%) rotate(-12deg);animation:float 5s ease-in-out infinite}
    .head{position:absolute;left:17px;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent-warm);border:2px solid var(--text)}
    .body{position:absolute;left:12px;top:31px;width:38px;height:55px;border-radius:16px;background:var(--accent);border:2px solid var(--text)}
    .limb{position:absolute;width:52px;height:8px;border-radius:8px;background:var(--accent);border:2px solid var(--text);transform-origin:5px 50%}.arm{left:29px;top:44px;transform:rotate(-28deg)}.leg{left:30px;top:78px;transform:rotate(55deg)}
    .pen{position:absolute;left:25%;top:31%;width:55px;height:8px;border-radius:8px;background:var(--accent-2);transform:rotate(22deg);animation:drift 6s ease-in-out infinite}
    .ball{position:absolute;right:25%;bottom:25%;width:25px;height:25px;border-radius:50%;background:var(--accent-2);border:2px solid var(--text);animation:drift 4.5s ease-in-out infinite reverse}
    .arrows{position:absolute;inset:0;pointer-events:none;opacity:.22;transition:opacity 420ms ease}.arrow{position:absolute;width:4px;height:70px;background:var(--accent-2);border-radius:4px}.arrow:after{content:"";position:absolute;left:-7px;bottom:-2px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:14px solid var(--accent-2)}.a1{left:38%;top:45%}.a2{left:62%;top:34%}
    .scene-label{position:absolute;left:18px;top:16px;padding:7px 12px;border-radius:999px;background:var(--accent);color:#fff;font-size:var(--fs-label);font-weight:740;line-height:1.35}
    .scene-panel[data-view="outside"] .earth,.scene-panel[data-view="outside"] .orbit{opacity:1;transform:none}.scene-panel[data-view="outside"] .craft{transform:rotateY(180deg)}.scene-panel[data-view="outside"] .cabin{background:rgb(255 253 248 / 48%);border-color:var(--accent)}.scene-panel[data-view="outside"] .person,.scene-panel[data-view="outside"] .pen,.scene-panel[data-view="outside"] .ball{transform:rotateY(180deg)}.scene-panel[data-view="outside"] .arrows{opacity:1}
    .readings{display:flex;align-items:center;gap:16px;padding-top:10px;font-size:var(--fs-label);line-height:1.35}.reading{font-weight:780;color:var(--accent);font-variant-numeric:tabular-nums}.caveat{margin-left:auto;color:var(--ink-soft)}
    .switch{position:absolute;right:-43px;top:48%;z-index:5;width:86px;height:86px;border:3px solid var(--accent);border-radius:50%;background:var(--paper);color:var(--accent);font-size:var(--fs-label);font-weight:780;line-height:1.2;cursor:pointer;box-shadow:var(--shadow);transition:transform 180ms ease}.switch:active{transform:scale(.96)}
    .right{display:flex;flex-direction:column;gap:10px}.k-comparison{grid-template-columns:100px repeat(2,minmax(0,1fr));flex:1}.k-comparison>.hdr,.k-comparison>.dim,.k-comparison>.cell{padding:10px 12px}.k-comparison>.hdr{font-size:var(--fs-body)}.k-comparison>.cell{transition:background 220ms ease,box-shadow 220ms ease}.k-comparison[data-view="inside"] .inside,.k-comparison[data-view="outside"] .outside{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
    .feedback{min-height:48px;padding:10px 14px;border-left:4px solid var(--accent);background:var(--accent-soft);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .actions{display:flex;justify-content:space-between;align-items:center}.reset{min-height:42px;padding:8px 18px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--paper);color:var(--text);font:650 var(--fs-label)/1.35 var(--font-sans);cursor:pointer}.done{font-size:var(--fs-label);font-weight:720;color:var(--good);visibility:hidden}.done.show{visibility:visible}
    @keyframes float{50%{translate:8px -10px;rotate:3deg}}@keyframes drift{50%{translate:-7px 9px;rotate:8deg}}
    @media(prefers-reduced-motion:reduce){.craft,.earth,.orbit,.cabin,.arrows,.k-comparison>.cell{transition:none}.person,.pen,.ball{animation:none}}
  </style>
</head>
<body data-page="32" data-total="48">
  <div id="stage">
    <main id="main">
      <p class="instruction">翻转舱体，看同一次失重如何随参照视角改变。</p>
      <div class="layout">
        <section class="scene-panel min0" id="scenePanel" data-view="inside" aria-label="同一次自由落体的双视角剖面">
          <div class="scene">
            <div class="earth" aria-hidden="true"></div><div class="orbit" aria-hidden="true"></div>
            <div class="craft" aria-hidden="true"><div class="cabin"><div class="window"></div><div class="person"><i class="head"></i><i class="body"></i><i class="limb arm"></i><i class="limb leg"></i></div><i class="pen"></i><i class="ball"></i><div class="arrows"><i class="arrow a1"></i><i class="arrow a2"></i></div></div></div>
            <div class="scene-label" id="sceneLabel">相对舱壁：漂浮</div>
          </div>
          <button class="switch no-pan" id="flip" type="button" aria-label="翻转到舱外视角" aria-pressed="false">翻转<br>视角</button>
          <div class="readings"><span>高度 <b class="reading" id="height"></b></span><span>当地引力 <b class="reading" id="gravity"></b></span><span>地表标准重力的 <b class="reading" id="ratio"></b></span><span class="caveat">教学示例：忽略大气阻力与局部潮汐差异</span></div>
        </section>
        <section class="right min0">
          <div class="k-comparison" id="comparison" data-view="inside">
            <div class="hdr">比较维度</div><div class="hdr inside">舱内视角</div><div class="hdr outside">舱外视角</div>
            <div class="dim">看见什么</div><div class="cell inside">人、笔和小球相对舱壁缓慢漂浮。</div><div class="cell outside">飞船与舱内物体一起向地球下落。</div><div class="rowline"></div>
            <div class="dim">仍然存在</div><div class="cell inside">引力仍在；舱壁几乎没有持续托住身体。</div><div class="cell outside">地球引力同时作用于飞船与舱内物体。</div><div class="rowline"></div>
            <div class="dim">怎样解释</div><div class="cell inside">彼此的相对加速度很小，因此体验“失重”。</div><div class="cell outside">这是近似共同自由落体，不是重力消失。</div>
          </div>
          <div class="feedback" id="feedback" aria-live="polite">你看见的是相对运动：人没有持续撞向地板。</div>
          <div class="actions"><span class="done" id="done">✓ 已比较两种视角</span><button class="reset" id="reset" type="button">重置</button></div>
        </section>
      </div>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:32,kicker:"ORBITAL FREE FALL",title:"舱里漂浮，舱外下落",take:"轨道中的“失重”是飞船与人体共同自由落体，不是重力消失。"});
    Deck.init({index:32,total:48});
    const fallbackAltitude=Lec.K.spaceflight.lowEarthOrbitRepresentativeAltitude;
    const earthRadius=Lec.K.earth.meanRadius;
    const earthMass=Lec.K.earth.mass;
    const standardGravity=Lec.K.physics.standardGravity;
    const altitude=Lec.P.positive(Lec.P.finiteNumber(fallbackAltitude,fallbackAltitude),fallbackAltitude);
    const radius=Lec.P.positive(Lec.P.finiteNumber(Lec.P.altitudeToRadius(earthRadius,altitude),earthRadius+fallbackAltitude),earthRadius+fallbackAltitude);
    const g=Lec.P.positive(Lec.P.finiteNumber(Lec.P.gravity(earthMass,radius),standardGravity),standardGravity);
    const frac=Lec.P.finiteNumber(Lec.P.fraction(g,standardGravity),1);
    const pct=Lec.P.finiteNumber(Lec.P.percent(g,standardGravity),100);
    height.textContent='约 '+Lec.P.metresToKilometres(altitude).toFixed(0)+' km'; gravity.textContent=g.toFixed(1)+' m/s²'; ratio.textContent=pct.toFixed(0)+'%';
    let outside=false,seenOutside=false,returned=false;
    function render(message){const view=outside?'outside':'inside';scenePanel.dataset.view=view;comparison.dataset.view=view;flip.setAttribute('aria-pressed',String(outside));flip.setAttribute('aria-label',outside?'翻转到舱内视角':'翻转到舱外视角');sceneLabel.textContent=outside?'相对地球：共同下落':'相对舱壁：漂浮';if(message)feedback.textContent=message;done.classList.toggle('show',returned)}
    function setView(next){outside=next;if(outside){seenOutside=true;render('重力仍约为地表标准重力的 '+pct.toFixed(0)+'%；共同下落使舱内缺少持续支撑。')}else{if(seenOutside)returned=true;render(returned?'两个画面没有矛盾，它们描述的是同一次自由落体。':'地板没有持续托住身体，因此产生漂浮体验。')}flip.focus()}
    flip.addEventListener('click',()=>setView(!outside));flip.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();setView(false)}if(e.key==='ArrowRight'){e.preventDefault();setView(true)}});
    reset.addEventListener('click',()=>{outside=false;seenOutside=false;returned=false;render('你看见的是相对运动：人没有持续撞向地板。');flip.focus()});
    render();
  </script>
</body>
</html>
