<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/lib/katex.min.css">
<style>
#main{display:flex;flex-direction:column;gap:12px}.mission-bar{display:flex;align-items:end;gap:24px;padding:12px 18px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field label{font-size:var(--fs-label);font-weight:720;line-height:1.35}.field input{width:150px;height:38px;box-sizing:border-box;padding:6px 10px;color:var(--text);font:inherit;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--paper)}.field.reserve{flex:1}.field.reserve input{width:100%;accent-color:var(--accent)}
.current{font-size:var(--fs-label);font-weight:760;color:var(--accent);font-variant-numeric:tabular-nums}.reset{height:38px;padding:0 20px;color:#fff;font-size:var(--fs-label);font-weight:720;border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent);cursor:pointer}
.formula-strip{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:4px 18px;color:var(--ink-soft);font-size:var(--fs-sec);line-height:1.4}.formula{font-size:20px;color:var(--text)}
.ledger{display:flex;gap:18px;min-height:0;flex:1}.ledger-table{flex:1 1 66%;min-width:0;border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;background:var(--paper)}
.ledger-head,.resource{display:grid;grid-template-columns:1.15fr 1fr 1fr .9fr 1fr;align-items:center}.ledger-head{height:38px;padding:0 18px;color:var(--ink-soft);font-size:var(--fs-label);font-weight:720;border-bottom:2px solid var(--line-strong);background:var(--paper-2)}
.k-enumeration.resources{--item-cols:1;display:block}.k-enumeration.resources>.it{height:94px;box-sizing:border-box;padding:14px 18px;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}.k-enumeration.resources>.it::before{display:none}
.resource-name{font-size:var(--fs-body);font-weight:760;line-height:1.35}.resource-name small{display:block;color:var(--ink-soft);font-size:var(--fs-label);font-weight:560}.num{font-size:var(--fs-sec);line-height:1.4;font-variant-numeric:tabular-nums}.load{color:var(--accent);font-size:var(--fs-lead);font-weight:800}
.chart-panel{flex:1 1 34%;min-width:0;position:relative;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper)}#chart{position:absolute;inset:8px;width:auto;height:auto}.total-row{display:flex;align-items:center;justify-content:space-between;height:66px;padding:0 22px;border:2px solid var(--accent);border-radius:var(--radius-md);background:var(--accent-soft)}.total-label{font-size:var(--fs-lead);font-weight:780}.total-reading{color:var(--accent);font-size:28px;font-weight:820;font-variant-numeric:tabular-nums}.feedback{font-size:var(--fs-sec);line-height:1.4;color:var(--ink-soft)}.warnline{font-weight:760;color:var(--warn)}
</style>
</head>
<body data-page="35" data-total="48">
<div id="stage">
<main id="main">
  <section class="mission-bar" aria-label="任务条件">
    <div class="field min0"><label for="crew">乘员人数</label><input id="crew" type="number" min="1" max="20" step="1" value="4" inputmode="numeric"></div>
    <div class="field min0"><label for="days">任务天数</label><input id="days" type="number" min="1" max="1000" step="1" value="30" inputmode="numeric"></div>
    <div class="field reserve min0"><label for="reserve">储备比例 <span class="warnline">（储备不是回收）</span></label><input id="reserve" type="range" min="0" max="30" step="1" value="10"></div>
    <output id="reserveOut" class="current" for="reserve">10%</output>
    <button id="reset" class="reset" type="button">重置任务</button>
  </section>
  <div class="formula-strip">
    <span>共同计算主干：每人每日需求率 × 人数 × 天数 → 基础需求 → 加上储备</span>
    <span id="formula" class="formula" aria-label="基础需求等于需求率乘人数乘天数；装载量等于基础需求乘一加储备比例"></span>
  </div>
  <section class="ledger min0" aria-label="三项并列资源账本">
    <div class="ledger-table min0">
      <div class="ledger-head"><span>资源</span><span>日需求率</span><span>基础需求</span><span>额外储备</span><span>计划装载</span></div>
      <div class="k-enumeration resources">
        <div class="it resource" data-key="oxygen"><div class="resource-name">氧气</div><div class="num rate">—</div><div class="num base">—</div><div class="num extra">—</div><div class="load planned">—</div></div>
        <div class="it resource" data-key="food"><div class="resource-name">干食物</div><div class="num rate">—</div><div class="num base">—</div><div class="num extra">—</div><div class="load planned">—</div></div>
        <div class="it resource" data-key="water"><div class="resource-name">基础用水<small>饮用与食物制备</small></div><div class="num rate">—</div><div class="num base">—</div><div class="num extra">—</div><div class="load planned">—</div></div>
      </div>
    </div>
    <div class="chart-panel min0"><div id="chart" role="img" aria-label="三项物资的基础需求与额外储备横向堆叠图"></div></div>
  </section>
  <section class="total-row"><div><div class="total-label">本页三项合计</div><div id="feedback" class="feedback">三项资源共享同一套人数 × 天数乘法。</div></div><div id="total" class="total-reading" aria-live="polite">—</div></section>
</main>
</div>
<script src="assets/lib/echarts.min.js"></script>
<script src="assets/lib/katex.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:35,kicker:"LIFE-SUPPORT LEDGER",title:"几个人，飞几天，要带多少？",take:"氧气、食物和水会随人数与任务时长累积，补给首先是一道乘法题。"});
Deck.init({index:35,total:48});
(function(){
  var crewEl=document.getElementById('crew'),daysEl=document.getElementById('days'),reserveEl=document.getElementById('reserve');
  var chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'}), last={crew:4,days:30,reserve:.1};
  var rates={oxygen:Lec.K.lifeSupport.oxygenKilogramsPerPersonDay,food:Lec.K.lifeSupport.foodKilogramsPerPersonDay,water:Lec.K.lifeSupport.potableWaterKilogramsPerPersonDay};
  var names={oxygen:'氧气',food:'干食物',water:'基础用水'};
  katex.render('B_i=r_i\\times N\\times D\qquad L_i=B_i(1+f)',document.getElementById('formula'),{throwOnError:false});
  function mass(v){if(v>=1000)return Deck.fmt(v/1000,2)+' t';if(v>=100)return Deck.fmt(v,0)+' kg';return Deck.fmt(v,1)+' kg'}
  function update(changed){
    var crew=Lec.P.positive(Lec.P.finiteNumber(crewEl.value,NaN),NaN), days=Lec.P.positive(Lec.P.finiteNumber(daysEl.value,NaN),NaN), f=Lec.P.clamp(Lec.P.finiteNumber(reserveEl.value,10)/100,0,.3);
    document.getElementById('reserveOut').textContent=Deck.fmt(Lec.P.percent(f),0)+'%';
    if(!Number.isFinite(crew)||!Number.isFinite(days)){document.getElementById('feedback').textContent='请输入大于零的人数与任务天数。';document.getElementById('total').textContent='等待输入';chart.clear();return}
    crew=Math.max(1,Math.round(crew)); crewEl.value=crew;
    var baseMission=Lec.P.missionConsumables(crew,days,0,1);
    var base={oxygen:baseMission.oxygenKilograms,food:baseMission.foodKilograms,water:rates.water*crew*days};
    var planned={},extra={},total=0;
    ['oxygen','food','water'].forEach(function(k){planned[k]=Lec.P.resourceNeed(rates[k],crew,days,f);extra[k]=planned[k]-base[k];total+=planned[k];var row=document.querySelector('[data-key="'+k+'"]');row.querySelector('.rate').textContent=Deck.fmt(rates[k],2)+' kg/人·日';row.querySelector('.base').textContent=mass(base[k]);row.querySelector('.extra').textContent=mass(extra[k]);row.querySelector('.planned').textContent=mass(planned[k])});
    document.getElementById('total').textContent=mass(total);
    var msg=changed==='reserve'?'基础需求不变；储备只增加额外装载量。':changed==='days'?'每日消耗乘以天数，累积为任务总量。':changed==='crew'?'人数变化时，三项需求按相同比例变化。':'三项资源共享同一套人数 × 天数乘法。';document.getElementById('feedback').textContent=msg;
    chart.setOption({animation:!Deck.reduced(),textStyle:{fontSize:16,fontFamily:Deck.token('--font-sans'),color:Deck.token('--text')},grid:{left:72,right:24,top:22,bottom:42},legend:{bottom:4,textStyle:{fontSize:14},data:['基础需求','额外储备']},xAxis:{type:'value',name:'kg',nameTextStyle:{fontSize:14},axisLabel:{fontSize:13},splitLine:{lineStyle:{color:Deck.token('--line')}}},yAxis:{type:'category',data:['基础用水','干食物','氧气'],axisLabel:{fontSize:14},axisTick:{show:false}},tooltip:{trigger:'axis',axisPointer:{type:'shadow'},textStyle:{fontSize:16},valueFormatter:function(v){return mass(v)}},series:[{name:'基础需求',type:'bar',stack:'load',barWidth:28,data:[base.water,base.food,base.oxygen],itemStyle:{color:Deck.token('--accent')}},{name:'额外储备',type:'bar',stack:'load',barWidth:28,data:[extra.water,extra.food,extra.oxygen],itemStyle:{color:Deck.token('--accent-warm'),borderColor:Deck.token('--accent-2'),borderWidth:1}}]});
    last={crew:crew,days:days,reserve:f};
  }
  crewEl.addEventListener('input',function(){update('crew')});daysEl.addEventListener('input',function(){update('days')});reserveEl.addEventListener('input',function(){update('reserve')});
  document.getElementById('reset').addEventListener('click',function(){crewEl.value='';daysEl.value='';reserveEl.value=Math.round(Lec.P.percent(.1));update('reset');crewEl.focus()});
  Deck.onResize(function(){chart.resize()});update('init');
})();
</script>
</body>
</html>
