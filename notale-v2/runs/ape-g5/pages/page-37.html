<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:12px}
    .eco-claim{height:82px!important;display:grid!important;grid-template-columns:280px 30px 1fr!important;align-items:center!important}
    .eco-claim>.claim{padding:12px 18px!important;font-size:var(--fs-lead)!important}
    .eco-claim>.supports{flex-direction:row!important;gap:10px!important}
    .eco-claim>.supports>.support{flex:1;padding:10px 12px!important;font-size:var(--fs-sec)!important;font-weight:690;line-height:1.35!important}
    .eco-claim>.supports>.support:before{width:30px!important}
    .world{position:relative;flex:1;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--paper);box-shadow:var(--shadow)}
    #ecoCanvas{display:block}
    .hud{position:absolute;inset:16px 16px 16px auto;width:310px;padding:14px 16px;background:rgb(255 253 248 / 94%);border:1px solid var(--line);border-radius:var(--radius-md)}
    .hud h2{font-size:var(--fs-h2);margin-bottom:8px}.statusline{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding:7px 0}.statusline span{font-size:var(--fs-label);font-weight:680}.statusline output{font-size:var(--fs-sec);font-weight:760;color:var(--accent);font-variant-numeric:tabular-nums}.bands{height:118px;margin:8px 0;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
    .bars{display:flex;gap:8px;height:100%;align-items:flex-end;padding:0 8px}.bar{flex:1;min-height:5px;border-radius:5px 5px 0 0;transition:height 220ms ease-out}.bar.p{background:var(--good)}.bar.c{background:var(--accent-2)}.bar.d{background:var(--accent)}
    .legend{display:flex;justify-content:space-between;font-size:var(--fs-label);font-weight:700}.feedback{min-height:46px;margin-top:8px;font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .model-note{position:absolute;left:18px;bottom:14px;font-size:var(--fs-label);font-weight:680;color:var(--ink-soft)}
    .control{position:absolute;left:356px;top:208px;width:190px;height:138px;border:2px solid var(--accent);border-radius:var(--radius-md);background:rgb(220 239 238 / 82%);touch-action:none}
    .control:focus-visible{outline:4px solid var(--focus);outline-offset:3px}.control:before,.control:after{content:"";position:absolute;background:rgb(0 109 119 / 35%)}.control:before{left:50%;top:0;bottom:0;width:1px}.control:after{top:50%;left:0;right:0;height:1px}
    .knob{position:absolute;width:28px;height:28px;border-radius:50%;background:var(--accent);border:4px solid var(--paper);box-shadow:0 3px 10px rgb(23 33 43 / 25%);transform:translate(-50%,-50%)}
    .axisx,.axisy{position:absolute;font-size:var(--fs-label);font-weight:720;color:var(--accent)}.axisx{left:50%;bottom:-29px;transform:translateX(-50%);white-space:nowrap}.axisy{right:calc(100% + 10px);top:50%;transform:translateY(-50%);width:78px;text-align:right}
    .reset{position:absolute;left:18px;top:16px;min-height:42px;padding:8px 18px;color:#fff;font:700 var(--fs-label) var(--font-sans);border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent);cursor:pointer}
    @media(prefers-reduced-motion:reduce){.bar{transition:none}}
  </style>
</head>
<body data-page="37" data-total="48">
  <div id="stage"><main id="main">
    <section class="k-generalization eco-claim" aria-label="主张与四条支撑">
      <div class="claim">封闭只描述边界；稳定取决于系统能否在波动中维持功能。</div><div class="trunk"></div>
      <div class="supports"><div class="support">物质在瓶内循环</div><div class="support">能量持续流过</div><div class="support">生物错峰响应</div><div class="support">三者协同管理</div></div>
    </section>
    <section class="world min0" aria-label="交互式二维生态瓶">
      <canvas id="ecoCanvas" class="cv-fill" role="img" aria-label="生态瓶系统图：物质闭环迁移，能量单向穿过边界。"></canvas>
      <button class="reset" id="reset">重置</button>
      <div class="control no-pan" id="control" tabindex="0" role="slider" aria-label="生态调节柄：左右调能量，上下调分解周转" aria-valuemin="0" aria-valuemax="100" aria-valuenow="55">
        <div class="knob" id="knob"></div><span class="axisx">能量输入 →</span><span class="axisy">分解周转<br>↑</span>
      </div>
      <aside class="hud panel">
        <h2>观察窗口</h2>
        <div class="statusline"><span>模拟时间</span><output id="days">0 day</output></div>
        <div class="statusline"><span>能量 / 分解</span><output id="controlsOut">—</output></div>
        <div class="bands"><div class="bars"><i class="bar p" id="bp"></i><i class="bar c" id="bc"></i><i class="bar d" id="bd"></i></div></div>
        <div class="legend"><span>生产者</span><span>消费者</span><span>分解者</span></div>
        <div class="statusline"><span>稳定度</span><output id="score">—</output></div>
        <div class="statusline"><span>窗口进度</span><output id="progress">—</output></div>
        <p class="feedback" id="feedback" aria-live="polite">拖动调节柄，观察延迟响应。</p>
      </aside>
      <div class="model-note">无量纲教学模型 · 物质在系统内转移，不等于每一环都自动平衡</div>
    </section>
  </main></div>
  <script src="assets/lib/pixi.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:37,kicker:"CLOSED ≠ SELF-SUSTAINING",title:"封闭，只是边界；稳定，才是任务",take:"稳定不是静止，也不是把某一项调到最大，而是在波动中仍能维持关键功能。"});
    Deck.init({index:37,total:48});
    const C=Lec.K.PAGE37_CFG={min:0,max:1,defE:.55,defD:.58,dt:.2,observe:120,total:1,lower:{p:.08,c:.05,d:.05},safe:{n:[.1,.42],w:[.05,.3]},variation:.2,history:180,step:.035,bigStep:.1,simRate:4};
    Lec.K.PAGE37_DEFAULT_ENERGY_INPUT=C.defE;Lec.K.PAGE37_DEFAULT_DECOMPOSITION_CAPACITY=C.defD;Lec.K.PAGE37_TIME_STEP_DAYS=C.dt;Lec.K.PAGE37_OBSERVATION_STEPS=C.observe;Lec.K.PAGE37_MATTER_TOTAL=C.total;Lec.K.PAGE37_FUNCTIONAL_LOWER_BOUNDS=C.lower;Lec.K.PAGE37_RESERVOIR_SAFE_RANGES=C.safe;Lec.K.PAGE37_RECOVERABLE_VARIATION_LIMIT=C.variation;Lec.K.PAGE37_CONTROL_MIN=C.min;Lec.K.PAGE37_CONTROL_MAX=C.max;
    Lec.K.PAGE37_INITIAL_STATE={p:.25,c:.13,d:.12,n:.27,w:.23,days:0,steps:0};
    Lec.P.ecosystemStep=(s,u,k)=>{const light=.012*u.e*s.n,graze=.013*s.c*s.p,dec=.018*u.d*s.d*s.w,lossP=.006*s.p,lossC=.007*s.c,lossD=.005*s.d;return {p:s.p+light-graze-lossP,c:s.c+graze*.55-lossC,d:s.d+dec*.25-lossD,n:s.n-light+dec*.72,w:s.w+lossP+lossC+lossD+graze*.45-dec,days:s.days+k.dt,steps:s.steps+1}};
    Lec.P.ecosystemMatterTotal=s=>s.p+s.c+s.d+s.n+s.w;Lec.P.ecosystemMatterFraction=(v,t)=>Lec.P.fraction(v,t);Lec.P.ecosystemNormalizedBiomass=v=>Lec.P.clamp(v,0,1);Lec.P.ecosystemElapsedDays=s=>s.days;
    Lec.P.ecosystemVariation=(h,key)=>h.length?Math.max(...h.map(x=>x[key]))-Math.min(...h.map(x=>x[key])):0;
    Lec.P.ecosystemStabilityScore=(h,safe)=>{if(!h.length)return 0;const q=h[h.length-1],bad=Math.abs(q.n-.26)+Math.abs(q.w-.17)+Math.max(0,C.lower.p-q.p)+Math.max(0,C.lower.c-q.c)+Math.max(0,C.lower.d-q.d)+Lec.P.ecosystemVariation(h,'p')+Lec.P.ecosystemVariation(h,'c');return Lec.P.clamp(1-bad*1.7,0,1)};
    Lec.P.ecosystemStatus=(score,trend)=>score<.42?'失衡':(score<.72||trend>.025?'脆弱':'稳定波动');
    const initial=()=>({state:{...Lec.K.PAGE37_INITIAL_STATE},u:{e:C.defE,d:C.defD},history:[],acc:0});let game=initial();
    const cv=document.querySelector('#ecoCanvas'),world=document.querySelector('.world');Deck.fit(cv);let renderer=null;try{renderer=PIXI.autoDetectRenderer({view:cv,width:world.clientWidth,height:world.clientHeight,backgroundAlpha:0,antialias:true,resolution:1})}catch(e){}const scene=new PIXI.Container(),g=new PIXI.Graphics();scene.addChild(g),ctx=cv.getContext('2d');
    const control=document.querySelector('#control'),knob=document.querySelector('#knob');let dragging=false;
    function setControl(x,y){game.u.e=Lec.P.clamp(Lec.P.finiteNumber(x,C.defE),C.min,C.max);game.u.d=Lec.P.clamp(Lec.P.finiteNumber(y,C.defD),C.min,C.max);updateUI()}
    function pointer(e){const p=Deck.pt(control,e);setControl(p.x/control.clientWidth,1-p.y/control.clientHeight)}
    control.addEventListener('pointerdown',e=>{dragging=true;control.setPointerCapture(e.pointerId);pointer(e)});control.addEventListener('pointermove',e=>{if(dragging)pointer(e)});control.addEventListener('pointerup',()=>dragging=false);
    control.addEventListener('keydown',e=>{const d=e.shiftKey?C.bigStep:C.step;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home'].includes(e.key))e.preventDefault();if(e.key==='Home')setControl(C.defE,C.defD);if(e.key==='ArrowLeft')setControl(game.u.e-d,game.u.d);if(e.key==='ArrowRight')setControl(game.u.e+d,game.u.d);if(e.key==='ArrowUp')setControl(game.u.e,game.u.d+d);if(e.key==='ArrowDown')setControl(game.u.e,game.u.d-d)});
    document.querySelector('#reset').onclick=()=>{game=initial();updateUI()};
    const pct=v=>Lec.P.percent(v), ids=id=>document.querySelector(id);
    function updateUI(){const s=game.state,h=game.history.slice(-C.observe),score=Lec.P.ecosystemStabilityScore(h,C.safe),trend=h.length>8?Math.abs(score-Lec.P.ecosystemStabilityScore(h.slice(0,-8),C.safe)):1,status=Lec.P.ecosystemStatus(score,trend);knob.style.left=pct(game.u.e)+'%';knob.style.top=pct(1-game.u.d)+'%';control.setAttribute('aria-valuenow',String(Math.round(pct((game.u.e+game.u.d)/2))));control.setAttribute('aria-valuetext',`能量${Math.round(pct(game.u.e))}%，分解${Math.round(pct(game.u.d))}%`);ids('#days').value=Deck.fmt(Lec.P.ecosystemElapsedDays(s),1)+' day';ids('#controlsOut').value=Math.round(pct(game.u.e))+'% / '+Math.round(pct(game.u.d))+'%';ids('#bp').style.height=Math.max(5,pct(Lec.P.ecosystemNormalizedBiomass(s.p)))+'%';ids('#bc').style.height=Math.max(5,pct(Lec.P.ecosystemNormalizedBiomass(s.c)))+'%';ids('#bd').style.height=Math.max(5,pct(Lec.P.ecosystemNormalizedBiomass(s.d)))+'%';ids('#score').value=Math.round(pct(score))+'% · '+status;ids('#progress').value=Math.round(pct(Lec.P.fraction(Math.min(h.length,C.observe),C.observe)))+'%';let msg=game.u.e<.28?'能量不足：生产者先下降，消费者随后响应。':s.w>C.safe.w[1]?'待分解物质正在积累：分解周转跟不上。':game.u.e>.82?'输入过高：生产者短期上升，养分消耗正在加快。':status==='稳定波动'&&h.length>=C.observe?'系统仍在波动，但关键功能保持在可恢复范围。':'消费者与分解者正在滞后响应。';ids('#feedback').textContent=msg;ids('#feedback').dataset.state=status==='稳定波动'?'good':status==='脆弱'?'warn':'danger'}
    function draw(t){const h=world.clientHeight,s=game.state;if(!renderer){ctx.clearRect(0,0,cv.width,cv.height);ctx.strokeStyle=Deck.token('--line-strong');ctx.lineWidth=3;Deck.rr(ctx,145,42,650,h-90,70);ctx.fillStyle=Deck.rgba('--accent',.06);ctx.fill();ctx.stroke();ctx.strokeStyle=Deck.token('--accent-2');ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(104,72);ctx.lineTo(280,72);ctx.stroke();const pts=[[270,150,'--good',s.p],[530,158,'--accent-2',s.c],[420,365,'--accent',s.d]];pts.forEach((a,j)=>{ctx.fillStyle=Deck.rgba(a[2],.72);for(let i=0;i<Math.round(18+a[3]*90);i++){const ang=i*2.4+j,rad=22+(i%9)*4;ctx.beginPath();ctx.arc(a[0]+Math.cos(ang+t*.00015*(j+1))*rad,a[1]+Math.sin(ang*1.3+t*.00012)*rad*.55,3+i%3,0,Math.PI*2);ctx.fill()}});[[340,168,466,168],[540,210,470,330],[390,365,300,h-150],[385,h-112,505,h-112],[595,h-142,510,360],[260,h-142,260,220]].forEach(a=>{ctx.strokeStyle=Deck.rgba('--accent',.65);ctx.lineWidth=3;Deck.arrow(ctx,...a,9)});return}g.clear();const line=Deck.rgb('--line-strong'),accent=Deck.rgb('--accent'),good=Deck.rgb('--good'),warm=Deck.rgb('--accent-2');g.lineStyle(3,line,1);g.beginFill(0xdcefee,.28);g.drawRoundedRect(145,42,650,h-90,70);g.endFill();g.lineStyle(12,warm,.65);g.moveTo(104,72);g.lineTo(280,72);g.lineStyle(4,warm,1);g.lineTo(332,110);g.lineStyle(7,warm,.5);g.moveTo(650,h-75);g.lineTo(790,h-75);const pts=[[270,150,good,s.p],[530,158,warm,s.c],[420,365,accent,s.d]];pts.forEach((a,j)=>{const n=Math.round(18+a[3]*90);g.beginFill(a[2],.72);for(let i=0;i<n;i++){const ang=i*2.4+j,rad=22+(i%9)*4,x=a[0]+Math.cos(ang+t*.00015*(j+1))*rad,y=a[1]+Math.sin(ang*1.3+t*.00012)*rad*.55;g.drawCircle(x,y,3+(i%3))}g.endFill()});[[205,good],[505,warm]].forEach(a=>{g.lineStyle(2,a[1],1);g.beginFill(a[1],.15);g.drawRoundedRect(a[0],h-142,180,58,10);g.endFill()});const arrows=[[340,168,466,168],[540,210,470,330],[390,365,300,h-150],[385,h-112,505,h-112],[595,h-142,510,360],[260,h-142,260,220]];arrows.forEach(a=>{const q=Math.atan2(a[3]-a[1],a[2]-a[0]);g.lineStyle(3,accent,.65);g.moveTo(a[0],a[1]);g.lineTo(a[2],a[3]);g.lineTo(a[2]-10*Math.cos(q-.55),a[3]-10*Math.sin(q-.55));g.moveTo(a[2],a[3]);g.lineTo(a[2]-10*Math.cos(q+.55),a[3]-10*Math.sin(q+.55))});renderer.render(scene)}
    updateUI();Deck.loop((t,dt)=>{game.acc+=dt*C.simRate;if(game.acc>C.dt){game.state=Lec.P.ecosystemStep(game.state,game.u,C);const sum=Lec.P.ecosystemMatterTotal(game.state),scale=C.total/sum;['p','c','d','n','w'].forEach(k=>game.state[k]=Math.max(.001,game.state[k]*scale));game.history.push({...game.state});if(game.history.length>C.history)game.history.shift();game.acc=0;updateUI()}draw(t)},{still:0});
  </script>
</body>
</html>
