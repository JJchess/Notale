<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:16px}
    .mission-band{height:238px;box-sizing:border-box;padding:18px 22px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--paper);box-shadow:var(--shadow)}
    .mission-head{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:12px}
    .mission-copy{display:flex;align-items:baseline;gap:18px;min-width:0}
    .mission-copy h2{white-space:nowrap}
    .mission-copy p{color:var(--ink-soft);font-size:var(--fs-sec)}
    .reset{min-height:42px;padding:8px 18px;color:#fff;font:700 var(--fs-label)/1.35 var(--font-sans);border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent);cursor:pointer}
    .schedule{display:flex;gap:8px;align-items:stretch;padding:11px;border:2px solid var(--line-strong);border-radius:var(--radius-md);background:var(--paper-2);outline-offset:4px}
    .slot{position:relative;flex:1 1 0;min-width:0;height:72px;box-sizing:border-box;padding:10px 8px 8px;border:1px solid var(--line-strong);border-top:6px solid var(--accent-2);border-radius:var(--radius-sm);background:var(--paper);font-size:var(--fs-label);font-weight:720;line-height:1.35;text-align:center;cursor:grab;user-select:none}
    .slot[data-kind="support"]{border-top-color:var(--accent);background:var(--accent-soft)}
    .slot.is-selected{outline:4px solid var(--focus);outline-offset:2px;transform:translateY(-3px)}
    .slot::after{content:attr(data-type);display:block;margin-top:4px;color:var(--ink-soft);font-size:var(--fs-label);font-weight:600}
    .feedback{min-height:42px;margin-top:10px;padding:8px 14px;border-left:5px solid var(--accent);background:var(--accent-soft);font-size:var(--fs-sec);font-weight:680;line-height:1.45}
    .compare{flex:1;min-height:0}
    .k-comparison{height:100%;grid-template-columns:140px minmax(0,1fr) minmax(0,1fr)}
    .k-comparison>.hdr,.k-comparison>.dim,.k-comparison>.cell{padding:8px 16px}
    .k-comparison>.hdr{font-size:var(--fs-body);display:flex;align-items:center}
    .k-comparison>.dim{display:flex;align-items:center;justify-content:flex-end;font-size:var(--fs-label)}
    .k-comparison>.cell{display:flex;align-items:center;gap:12px;font-size:var(--fs-sec);line-height:1.4}
    .state-mark{flex:0 0 88px;height:10px;border-radius:999px;background:var(--accent-warm);box-shadow:inset 0 0 0 1px var(--line)}
    .cell[data-buffered="true"] .state-mark{background:var(--accent)}
    .cell[data-buffered="false"] .state-mark{background:var(--accent-2)}
    .cell.changed{animation:flash .55s ease-out}
    @keyframes flash{0%{box-shadow:inset 0 0 0 4px var(--accent)}100%{box-shadow:none}}
    @media (prefers-reduced-motion:reduce){.cell.changed{animation:none;box-shadow:inset 0 0 0 3px var(--accent)}}
  </style>
</head>
<body data-page="38" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="mission-band" aria-labelledby="schedule-title">
        <div class="mission-head">
          <div class="mission-copy">
            <h2 id="schedule-title">一轮孤立任务</h2>
            <p>拖动卡片重排；键盘选中排班带后，用左右键移动当前卡片，回车切换选择。</p>
          </div>
          <button class="reset" id="reset" type="button">重置排班</button>
        </div>
        <div class="schedule no-pan" id="schedule" role="listbox" tabindex="0" aria-label="八张任务与支持卡从左到右排列。点击卡片或按回车选择，再用左右方向键移动。"></div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      </section>

      <section class="compare" aria-label="两种排班的同维度比较">
        <div class="k-comparison" id="comparison">
          <div class="hdr">压力维度</div><div class="hdr">任务填满</div><div class="hdr">当前排班</div>
          <div class="dim">狭小</div><div class="cell"><span class="state-mark"></span><span>恢复空间不足</span></div><div class="cell diff" data-row="space"><span class="state-mark"></span><span class="result"></span></div><div class="rowline"></div>
          <div class="dim">延迟</div><div class="cell"><span class="state-mark"></span><span>待确认事项积压</span></div><div class="cell diff" data-row="delay"><span class="state-mark"></span><span class="result"></span></div><div class="rowline"></div>
          <div class="dim">单调</div><div class="cell"><span class="state-mark"></span><span>重复任务集中，注意易滑向自动操作</span></div><div class="cell diff" data-row="monotony"><span class="state-mark"></span><span class="result"></span></div><div class="rowline"></div>
          <div class="dim">冲突</div><div class="cell"><span class="state-mark"></span><span>分歧可能被带入下一项任务</span></div><div class="cell diff" data-row="conflict"><span class="state-mark"></span><span class="result"></span></div>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 38,
      kicker: "ISOLATED MISSION",
      title: "判断力也需要生命保障",
      take: "心理支持不是任务完成后的额外福利，而是维持注意、沟通与判断的生命保障组成部分。"
    });
    Deck.init({ index: 38, total: 48 });

    const cards = {
      check:{label:'重复检查',kind:'task'}, maintain:{label:'设备维护',kind:'task'}, wait:{label:'异步等待',kind:'task'}, decide:{label:'共同决策',kind:'task'},
      quiet:{label:'安静独处',kind:'support'}, rotate:{label:'任务轮换',kind:'support'}, message:{label:'异步留言',kind:'support'}, handoff:{label:'交接复盘',kind:'support'}
    };
    const initial = ['check','maintain','wait','decide','quiet','rotate','message','handoff'];
    let state = { order: initial.slice(), selected: 0 };
    let dragged = null;
    const schedule = document.getElementById('schedule');
    const feedback = document.getElementById('feedback');

    function evaluate(order){
      const pos = id => order.indexOf(id);
      const adjacent = (a,b) => Math.abs(pos(a)-pos(b)) === 1;
      const betweenTasks = id => { const i=pos(id); return i>0 && i<order.length-1 && cards[order[i-1]].kind==='task' && cards[order[i+1]].kind==='task'; };
      return {
        space: betweenTasks('quiet'),
        delay: pos('wait') < order.length-1 && ['message','handoff'].includes(order[pos('wait')+1]),
        monotony: adjacent('check','rotate'),
        conflict: pos('decide') > 0 && ['handoff','quiet'].includes(order[pos('decide')-1])
      };
    }
    const copy = {
      space:['空间干扰仍会持续','独处形成可预期的恢复边界'],
      delay:['等待后仍缺少清楚的下一步','等待后可留言或明确交接'],
      monotony:['同类工作仍集中排列','任务类型切换，注意可重新唤起'],
      conflict:['决策前缺少交接与降温','决策前留有澄清信息的机会']
    };
    function render(changed=true){
      schedule.innerHTML='';
      state.order.forEach((id,i)=>{
        const c=cards[id], el=document.createElement('div');
        el.className='slot'+(i===state.selected?' is-selected':'');
        el.dataset.kind=c.kind; el.dataset.type=c.kind==='task'?'任务卡':'支持卡';
        el.id='slot-'+id; el.setAttribute('role','option'); el.setAttribute('aria-selected',i===state.selected?'true':'false');
        el.draggable=true; el.textContent=c.label;
        el.addEventListener('click',()=>{state.selected=i;render(false);schedule.focus()});
        el.addEventListener('dragstart',()=>{dragged=i});
        el.addEventListener('dragover',e=>e.preventDefault());
        el.addEventListener('drop',e=>{e.preventDefault();if(dragged===null||dragged===i)return;move(dragged,i);dragged=null});
        schedule.appendChild(el);
      });
      schedule.setAttribute('aria-activedescendant','slot-'+state.order[state.selected]);
      const result=evaluate(state.order); let count=0;
      Object.keys(result).forEach(key=>{
        const cell=document.querySelector('[data-row="'+key+'"]');
        cell.dataset.buffered=result[key]; cell.querySelector('.result').textContent=copy[key][result[key]?1:0];
        if(changed){cell.classList.remove('changed');void cell.offsetWidth;cell.classList.add('changed')}
        if(result[key])count++;
      });
      feedback.textContent = count===4 ? '这不是无压力排班，而是把心理支持纳入任务设计。' : '当前：'+count+' 类压力已有缓冲，仍有 '+(4-count)+' 类会继续叠加。';
    }
    function move(from,to){
      const item=state.order.splice(from,1)[0]; state.order.splice(to,0,item); state.selected=to; render(true);
    }
    schedule.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();schedule.querySelectorAll('.slot')[state.selected].classList.toggle('is-selected');return}
      if(e.key==='ArrowLeft'&&state.selected>0){e.preventDefault();move(state.selected,state.selected-1)}
      if(e.key==='ArrowRight'&&state.selected<state.order.length-1){e.preventDefault();move(state.selected,state.selected+1)}
    });
    document.getElementById('reset').addEventListener('click',()=>{state={order:initial.slice(),selected:0};render(true);schedule.focus()});
    render(false);
  </script>
</body>
</html>
