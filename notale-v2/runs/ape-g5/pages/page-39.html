<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .plate.k-enumeration{position:relative;display:block;width:100%;height:100%;overflow:hidden;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;background-position:-1px -1px}
    .plate::after{content:"";position:absolute;inset:0;border:1px solid var(--line);pointer-events:none}
    .plate-lines{position:absolute;inset:0;width:100%;height:100%;z-index:1}
    .plate-lines path{fill:none;stroke:var(--line-strong);stroke-width:2;vector-effect:non-scaling-stroke}
    .plate-lines circle{fill:var(--accent)}
    .plate-lines .shell{fill:var(--paper);stroke:var(--line-strong);stroke-width:2}
    .plate-lines .detail{fill:none;stroke:var(--accent);stroke-width:2}
    .plate-lines .ghost{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:7 7}
    .subject-label{position:absolute;z-index:2;left:594px;top:482px;width:220px;text-align:center}
    .subject-label strong{display:block;color:var(--text);font-size:var(--fs-h2);line-height:1.35}
    .subject-label span{display:block;color:var(--ink-soft);font-size:var(--fs-label);line-height:1.35;letter-spacing:.08em}
    .plate.k-enumeration>.it{position:absolute;z-index:3;box-sizing:border-box;width:400px;min-height:154px;padding:22px 22px 18px 24px;border-radius:0;background:rgb(255 253 248 / 96%);box-shadow:none}
    .plate.k-enumeration>.it::before{top:14px}
    .i1{left:0;top:70px}.i2{left:0;top:350px}.i3{right:0;top:4px}.i4{right:0;top:212px}.i5{right:0;top:420px}
    .it h2{margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid var(--line)}
    .plate.k-enumeration>.it{display:grid;grid-template-columns:66px minmax(0,1fr);gap:5px 10px;align-content:start}
    .it h2{grid-column:1/-1}
    .it .key{color:var(--accent);font-size:var(--fs-label);font-weight:760;line-height:1.45}
    .it .value{color:var(--text);font-size:var(--fs-sec);line-height:1.45}
  </style>
</head>
<body data-page="39" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="plate k-enumeration" aria-label="地球为人体默认提供的五类环境支持，以及进入太空后对应的缺口">
        <svg class="plate-lines" viewBox="0 0 1408 620" aria-hidden="true">
          <path d="M704 310 H470 V147 H400"/><circle cx="470" cy="147" r="5"/>
          <path d="M704 310 H470 V427 H400"/><circle cx="470" cy="427" r="5"/>

          <path d="M704 310 H938 V497 H1008"/><circle cx="938" cy="497" r="5"/>

        <div class="subject-label"><strong>地球动物</strong><span>同一身体 · 五类支持同时撤走</span></div>

        <article class="it i1 min0">
          <h2>重力</h2><span class="key">地球默认</span><span class="value">持续承重、上下方向与日常运动刺激。</span><span class="key">太空缺口</span><span class="value">自由落体中不再有稳定承重线索。</span>
        </article>
        <article class="it i2 min0">
          <h2>空气</h2><span class="key">地球默认</span><span class="value">可呼吸的大气与可生存的外部环境。</span><span class="key">太空缺口</span><span class="value">氧气、水和食物都不能随时取用。</span>
        </article>
        <article class="it i3 min0">
          <h2>屏蔽</h2><span class="key">地球默认</span><span class="value">大气与地球环境遮蔽部分外来辐射。</span><span class="key">太空缺口</span><span class="value">不再拥有与地表相同的天然屏蔽。</span>
        </article>
        <article class="it i4 min0">
          <h2>生态</h2><span class="key">地球默认</span><span class="value">开放、庞大且有缓冲余量的物质循环。</span><span class="key">太空缺口</span><span class="value">没有自动补充资源、吸收废物的背景生态。</span>
        </article>
        <article class="it i5 min0">
          <h2>社会空间</h2><span class="key">地球默认</span><span class="value">较大范围、丰富刺激与即时联系。</span><span class="key">太空缺口</span><span class="value">空间、变化感、无延迟沟通与退出条件受限。</span>
        </article>
      </section>
    </main>
  </div>

</html>
