<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:var(--sp-3)}
    .intro{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);min-height:38px}
    .intro p{font-size:var(--fs-lead);font-weight:680}
    .hint{color:var(--ink-soft);font-size:var(--fs-label);font-weight:650;line-height:1.35;white-space:nowrap}
    .adapt-table{--compare-cols:3;grid-template-columns:190px repeat(3,minmax(0,1fr));flex:1 1 auto;grid-template-rows:54px 1fr 1px 1fr}
    .adapt-table>.hdr,.adapt-table>.dim,.adapt-table>.cell{padding:var(--sp-2) var(--sp-3)}
    .adapt-table>.hdr{display:flex;align-items:center;font-size:var(--fs-body)}
    .adapt-table>.hdr.path{justify-content:center;color:var(--accent)}
    .adapt-table>.dim{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;font-size:var(--fs-sec)}
    .pressure-tag{color:var(--accent-2);font-size:var(--fs-label);font-weight:760}
    .adapt-table>.cell{position:relative;display:flex;flex-direction:column;justify-content:center;gap:var(--sp-1);transition:background .16s ease,box-shadow .16s ease}
    .adapt-table>.cell:last-child{border-right:0}
    .cell.is-target{background:var(--accent-soft);box-shadow:inset 0 0 0 3px var(--accent)}
    .cell.is-row-complete{background:var(--accent-soft)}
    .empty{color:var(--ink-soft);font-size:var(--fs-label);font-weight:650;text-align:center}
    .solution{font-size:var(--fs-sec);font-weight:760;line-height:1.35}
    .facts{display:grid;grid-template-columns:72px minmax(0,1fr);column-gap:var(--sp-2);font-size:var(--fs-label);line-height:1.35}
    .facts b{color:var(--ink-soft)}
    .traybar{display:grid;grid-template-columns:150px minmax(0,1fr) 132px;align-items:center;gap:var(--sp-3);min-height:104px;padding:var(--sp-2) var(--sp-3);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper)}
    .tray-title{font-size:var(--fs-sec);font-weight:760;line-height:1.35}
    .tray-title span{display:block;color:var(--ink-soft);font-size:var(--fs-label);font-weight:600}
    #tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2)}
    .match-card{min-width:0;min-height:38px;padding:var(--sp-1) var(--sp-2);overflow:hidden;color:var(--text);font-family:inherit;font-size:var(--fs-label);font-weight:680;line-height:1.35;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--paper-2);cursor:grab}
    .match-card[aria-pressed="true"]{color:#fff;border-color:var(--accent);background:var(--accent)}
    .match-card:focus-visible,.reset:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
    .match-card[hidden]{display:none}
    .reset{min-height:42px;padding:var(--sp-2) var(--sp-3);color:#fff;font-family:inherit;font-size:var(--fs-label);font-weight:720;border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent);cursor:pointer}
    .status{min-height:24px;color:var(--ink-soft);font-size:var(--fs-sec);font-weight:650;line-height:1.45;text-align:center}
    @media (prefers-reduced-motion:reduce){.adapt-table>.cell{transition:none}}
  </style>
</head>
<body data-page="40" data-total="48">
  <div id="stage">
    <main id="main">
      <div class="intro">
        <p>面对太空压力，可以改变环境、改变行为，或尝试改变身体。</p>
        <span class="hint">拖动卡片；或按 Enter 选中，← → 选栏，再按 Enter 放置</span>
      </div>

      <section class="k-comparison adapt-table" aria-label="两种太空压力下的三条适应路径比较">
        <div class="hdr">太空压力</div>
        <div class="hdr path">改变环境</div>
        <div class="hdr path">改变行为</div>
        <div class="hdr path">改变身体</div>

        <div class="dim"><span class="pressure-tag">压力 A</span>缺少日常承重刺激</div>
        <div class="cell" data-row="load" data-col="environment"><span class="empty">放入环境方案</span></div>
        <div class="cell" data-row="load" data-col="behavior"><span class="empty">放入行为方案</span></div>
        <div class="cell" data-row="load" data-col="body"><span class="empty">放入身体方案</span></div>
        <div class="rowline"></div>
        <div class="dim"><span class="pressure-tag">压力 B</span>辐射暴露</div>
        <div class="cell" data-row="radiation" data-col="environment"><span class="empty">放入环境方案</span></div>
        <div class="cell" data-row="radiation" data-col="behavior"><span class="empty">放入行为方案</span></div>
        <div class="cell" data-row="radiation" data-col="body"><span class="empty">放入身体方案</span></div>
      </section>

      <div class="traybar">
        <div class="tray-title">应对卡托盘<span>先判断它改变什么</span></div>
        <div id="tray" role="listbox" aria-label="待配对应对卡">
          <button class="match-card" role="option" tabindex="0" draggable="true" data-id="spin">旋转舱提供身体负荷</button>
          <button class="match-card" role="option" tabindex="-1" draggable="true" data-id="exercise">安排抗阻训练</button>
          <button class="match-card" role="option" tabindex="-1" draggable="true" data-id="bone">用药物减缓骨量流失</button>
          <button class="match-card" role="option" tabindex="-1" draggable="true" data-id="shield">增加屏蔽或设置避难区</button>
          <button class="match-card" role="option" tabindex="-1" draggable="true" data-id="eva">调整舱外活动流程</button>
          <button class="match-card" role="option" tabindex="-1" draggable="true" data-id="bio">生物医学辐射防护干预</button>
        </div>
        <button class="reset" id="reset" type="button">重置配对</button>
      </div>
      <div class="status" id="status" aria-live="polite">把六张卡放到它首先改变的路径中。</div>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 40,
      kicker: "ADAPTATION PATHS",
      title: "不只改变身体：我们可以改环境、改行为，或改身体",
      take: "三条路径改变的是系统中的不同部分；实际任务往往组合使用，而不是等待某一种方案单独解决全部问题。"
    });
    Deck.init({ index: 40, total: 48 });

    const paths = {
      environment:{object:"外部条件",depend:"设备、材料、能源与维护",limit:"增加质量、空间或系统复杂度"},
      behavior:{object:"行动与流程",depend:"训练、纪律、时间与持续执行",limit:"占用时间，效果依赖执行"},
      body:{object:"生理反应或身体结构",depend:"医学证据、个体反应与长期监测",limit:"可能有副作用，部分证据有限"}
    };
    const cards = {
      spin:{row:"load",col:"environment",title:"旋转舱提供身体负荷"},
      exercise:{row:"load",col:"behavior",title:"安排抗阻训练"},
      bone:{row:"load",col:"body",title:"用药物减缓骨量流失"},
      shield:{row:"radiation",col:"environment",title:"增加屏蔽或设置避难区"},
      eva:{row:"radiation",col:"behavior",title:"调整舱外活动流程"},
      bio:{row:"radiation",col:"body",title:"生物医学辐射防护干预"}
    };
    const labels={environment:"改变环境",behavior:"改变行为",body:"改变身体"};
    const cols=["environment","behavior","body"];
    const state={placed:{},selected:null,target:0};
    const status=document.getElementById("status");
    const cardEls=[...document.querySelectorAll(".match-card")];
    const cells=[...document.querySelectorAll(".cell")];

    function clearTargets(){ cells.forEach(el=>el.classList.remove("is-target")); }
    function showTarget(){
      clearTargets();
      if(!state.selected)return;
      const item=cards[state.selected];
      const target=document.querySelector(`.cell[data-row="${item.row}"][data-col="${cols[state.target]}"]`);
      if(target)target.classList.add("is-target");
      status.textContent=`已选“${item.title}”。目标：${labels[cols[state.target]]}。`;
    }
    function renderCell(item){
      const p=paths[item.col];
      return `<div class="solution">${item.title}</div><div class="facts"><b>改变对象</b><span>${p.object}</span><b>主要依赖</b><span>${p.depend}</span><b>典型局限</b><span>${p.limit}</span></div>`;
    }
    function place(id,col){
      const item=cards[id];
      if(col!==item.col){
        const wrong=document.querySelector(`.cell[data-row="${item.row}"][data-col="${col}"]`);
        wrong.classList.add("is-target");
        setTimeout(()=>wrong.classList.remove("is-target"),450);
        status.textContent="这个方案首先改变的是周围条件、人的行动，还是身体本身？";
        return false;
      }
      state.placed[id]=true;
      document.querySelector(`.cell[data-row="${item.row}"][data-col="${item.col}"]`).innerHTML=renderCell(item);
      const btn=document.querySelector(`[data-id="${id}"]`); btn.hidden=true; btn.setAttribute("aria-selected","true");
      state.selected=null; clearTargets();
      const rowDone=Object.keys(cards).filter(k=>cards[k].row===item.row).every(k=>state.placed[k]);
      if(rowDone){
        document.querySelectorAll(`.cell[data-row="${item.row}"]`).forEach(el=>el.classList.add("is-row-complete"));
        status.textContent="同一种压力，可以从系统的不同位置介入。";
      } else status.textContent=`“${item.title}”已放入${labels[item.col]}。`;
      if(Object.keys(state.placed).length===6) status.textContent="全部配对完成。实际方案常把多条路径组合起来。";
      return true;
    }
    cardEls.forEach((btn,i)=>{
      btn.setAttribute("aria-pressed","false");
      btn.addEventListener("focus",()=>{ cardEls.forEach((b,j)=>b.tabIndex=j===i?0:-1); });
      btn.addEventListener("dragstart",e=>{ e.dataTransfer.setData("text/plain",btn.dataset.id); });
      btn.addEventListener("keydown",e=>{
        const id=btn.dataset.id;
        if(e.key==="Enter"||e.key===" "){
          e.preventDefault();
          if(state.selected===id){ if(place(id,cols[state.target])) btn.setAttribute("aria-pressed","false"); }
          else { cardEls.forEach(b=>b.setAttribute("aria-pressed","false")); state.selected=id; state.target=cols.indexOf(cards[id].col); btn.setAttribute("aria-pressed","true"); showTarget(); }
        } else if(state.selected===id&&(e.key==="ArrowLeft"||e.key==="ArrowRight")){
          e.preventDefault(); state.target=Deck.clamp(state.target+(e.key==="ArrowRight"?1:-1),0,2); showTarget();
        } else if(e.key==="ArrowDown"||e.key==="ArrowUp"){
          e.preventDefault(); const visible=cardEls.filter(b=>!b.hidden); const at=visible.indexOf(btn); visible[(at+(e.key==="ArrowDown"?1:-1)+visible.length)%visible.length].focus();
        }
      });
    });
    cells.forEach(cell=>{
      cell.addEventListener("dragover",e=>{e.preventDefault();cell.classList.add("is-target")});
      cell.addEventListener("dragleave",()=>cell.classList.remove("is-target"));
      cell.addEventListener("drop",e=>{e.preventDefault();clearTargets();place(e.dataTransfer.getData("text/plain"),cell.dataset.col)});
    });
    document.getElementById("reset").addEventListener("click",()=>{
      state.placed={};state.selected=null;state.target=0;clearTargets();
      cells.forEach(cell=>{cell.classList.remove("is-row-complete");cell.innerHTML=`<span class="empty">放入${labels[cell.dataset.col].replace("改变","")}方案</span>`});
      cardEls.forEach((btn,i)=>{btn.hidden=false;btn.tabIndex=i===0?0:-1;btn.setAttribute("aria-pressed","false");btn.setAttribute("aria-selected","false")});
      status.textContent="把六张卡放到它首先改变的路径中。";cardEls[0].focus();
    });
  </script>
</body>
</html>
