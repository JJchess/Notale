<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/lib/katex.min.css">
  <style>
    #main{display:flex;flex-direction:column;gap:10px}
    .flow{--step-count:6;height:72px;gap:24px}
    .flow>.step{padding:9px 7px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:var(--fs-label);font-weight:720;line-height:1.35;border:0;background:transparent;box-shadow:none}
    .flow>.step.is-current{border-bottom:3px solid var(--accent);border-radius:0;background:transparent;box-shadow:none}
    .flow>.arw::after{left:-23px;width:22px}
    .work{display:flex;gap:12px;height:538px;min-height:0}
    .controls{width:258px;box-sizing:border-box;padding:16px;display:flex;flex-direction:column;gap:10px}
    .controls h2,.results h2{font-size:var(--fs-h2)}
    .choice-label{font-size:var(--fs-label);font-weight:740}
    .choice-row{display:flex;flex-wrap:wrap;gap:6px}
    .choice-row button,.reset{min-height:38px;padding:7px 11px;color:var(--text);font:700 var(--fs-label)/1.35 var(--font-sans);border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--paper);cursor:pointer}
    .choice-row button[aria-checked="true"]{color:#fff;border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
    .reset{width:100%;color:#fff;background:var(--accent);border-color:var(--accent)}
    .scheme{padding:10px;border-left:3px solid var(--accent);background:var(--accent-soft);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .middle{width:750px;display:flex;flex-direction:column;gap:10px;min-width:0}
    .scene{position:relative;height:320px;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-md);background:linear-gradient(145deg,#15242a,#0c171c);box-shadow:var(--shadow)}
    .scene canvas{display:block;width:100%;height:100%}
    .scene-tag{position:absolute;top:12px;left:14px;color:#fff;font-size:var(--fs-label);font-weight:720;letter-spacing:.05em}
    .scene-note{position:absolute;right:14px;bottom:10px;color:#dcefee;font-size:var(--fs-label);line-height:1.35}
    .chart{height:208px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper)}
    .results{width:364px;box-sizing:border-box;padding:15px;display:flex;flex-direction:column;gap:7px}
    .metric{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
    .metric .name{font-size:var(--fs-label);font-weight:700;color:var(--ink-soft)}
    .metric output{font-size:var(--fs-lead);font-weight:780;color:var(--accent);font-variant-numeric:tabular-nums}
    .formula{min-height:28px;font-size:20px;display:flex;align-items:center;gap:8px}
    .formula-copy{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--ink-soft)}
    .feedback{padding:9px 10px;border-left:4px solid var(--accent-2);background:var(--accent-warm);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .sr-only{font-size:16px}
  </style>
</head>
<body data-page="41" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="k-process flow" aria-label="人工重力方案的六步因果链">
        <div class="axis"></div>
        <div class="step is-current" data-step="radius">选择半径</div><div class="arw"></div>
        <div class="step is-current" data-step="rpm">选择转速</div><div class="arw"></div>
        <div class="step" data-step="omega">换算角速度</div><div class="arw"></div>
        <div class="step" data-step="accel">计算向心加速度</div><div class="arw"></div>
        <div class="step" data-step="compare">对比标准重力</div><div class="arw"></div>
        <div class="step" data-step="judge">判断规模与感受</div>
      </section>

      <div class="work">
        <section class="panel controls min0" aria-labelledby="choose-title">
          <h2 id="choose-title">选择环方案</h2>
          <div class="choice-label">环半径（m）</div>
          <div id="radiusChoices" class="choice-row" role="radiogroup" aria-label="环半径"></div>
          <div class="choice-label">转速（rpm，每分钟转数）</div>
          <div id="rpmChoices" class="choice-row" role="radiogroup" aria-label="转速"></div>
          <div class="scheme" aria-live="polite"><strong id="schemeTitle">当前方案</strong><br><span id="periodText"></span></div>
          <p class="secondary">方向键切换选项，空格或回车确认。</p>
          <button id="reset" class="reset" type="button">重置方案</button>
          <p class="note">旋转制造类似承重的体验，并没有把重力“打开”。</p>
        </section>

        <section class="middle min0" aria-label="旋转环与参数图">
          <div id="scene" class="scene">
            <div class="scene-tag">ROTATING HABITAT / FIXED VIEW</div>
            <div class="scene-note">轴心 → 脚端：向心加速度方向</div>
          </div>
          <div id="chart" class="chart" role="img" aria-label="半径与转速参数图，曲线表示相同人工重力效果，圆点表示当前方案"></div>
        </section>

        <aside class="panel results min0" aria-labelledby="result-title">
          <h2 id="result-title">计算结果</h2>
          <div class="formula"><span id="formulaOmega"></span></div>
          <div class="formula-copy">先把每分钟转数换成每秒转过的弧度。</div>
          <div class="metric"><span class="name">角速度</span><output id="omegaOut"></output></div>
          <div class="formula"><span id="formulaAccel"></span></div>
          <div class="formula-copy">转速的影响会被平方；环越大，同速下加速度越大。</div>
          <div class="metric"><span class="name">加速度</span><output id="accelOut"></output></div>
          <div class="metric"><span class="name">标准重力倍数</span><output id="gOut"></output></div>
          <div class="metric"><span class="name">环体直径</span><output id="diameterOut"></output></div>
          <div class="metric"><span class="name">头脚加速度差</span><output id="differenceOut"></output></div>
          <div id="feedback" class="feedback" aria-live="polite"></div>
        </aside>
      </div>
    </main>
  </div>

  <script src="assets/lib/three.min.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/lib/katex.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 41,
      kicker: "ROTATION / ARTIFICIAL GRAVITY",
      title: "选多大的环，转多快？",
      take: "同样的目标加速度，可以用较小而较快的环，也可以用较大而较慢的环；前者加重旋转体验，后者扩大工程规模。"
    });
    Deck.init({ index: 41, total: 48 });

    const radii = Array.from(Lec.K.PAGE41_RING_RADIUS_OPTIONS_M || [10, 25, 50, 100]);
    const rpms = Array.from(Lec.K.PAGE41_ROTATION_RATE_OPTIONS_RPM || [1, 2, 3, 4]);
    const defaults = { radius: Lec.K.PAGE41_DEFAULT_RING_RADIUS_M || radii[1], rpm: Lec.K.PAGE41_DEFAULT_ROTATION_RATE_RPM || rpms[1] };
    const state = { radius: defaults.radius, rpm: defaults.rpm, changed: "两项参数共同" };
    const minR = Math.min(...radii), maxR = Math.max(...radii), minRpm = Math.min(...rpms), maxRpm = Math.max(...rpms);

    Lec.P.page41ArtificialGravity = function(radiusInput, rpmInput){
      let radiusM = Lec.P.clamp(Lec.P.positive(Lec.P.finiteNumber(radiusInput, defaults.radius)), minR, maxR);
      let rpm = Lec.P.clamp(Lec.P.positive(Lec.P.finiteNumber(rpmInput, defaults.rpm)), minRpm, maxRpm);
      const degreesPerSecond = rpm * Lec.K.DEGREES_PER_TURN / Lec.K.SECONDS_PER_MINUTE;
      const omegaRadPerSecond = Lec.P.degreesToRadians(degreesPerSecond);
      const accelerationMps2 = omegaRadPerSecond * omegaRadPerSecond * radiusM;
      return { omegaRadPerSecond, accelerationMps2, gravityFraction: Lec.P.ratio(accelerationMps2, Lec.K.STANDARD_GRAVITY), periodSeconds: Lec.K.SECONDS_PER_MINUTE / rpm };
    };

    const radiusBox = document.getElementById('radiusChoices');
    const rpmBox = document.getElementById('rpmChoices');
    function makeChoices(box, values, key, unit){
      values.forEach((value, i) => {
        const b=document.createElement('button'); b.type='button'; b.setAttribute('role','radio'); b.dataset.value=value;
        b.textContent=Deck.fmt(value, {maximumFractionDigits:1})+' '+unit;
        b.addEventListener('click',()=>choose(key,value));
        b.addEventListener('keydown',e=>{ if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) return; e.preventDefault(); const d=(e.key==='ArrowRight'||e.key==='ArrowDown')?1:-1; const n=(i+d+values.length)%values.length; box.children[n].focus(); box.children[n].click(); });
        box.appendChild(b);
      });
    }
    function choose(key,value){ state.changed=key==='radius'?'半径改变':'转速改变'; state[key]=value; update(); }
    makeChoices(radiusBox,radii,'radius','m'); makeChoices(rpmBox,rpms,'rpm','rpm');
    document.getElementById('reset').addEventListener('click',()=>{state.radius=defaults.radius;state.rpm=defaults.rpm;state.changed='两项参数共同';update();});

    katex.render('\\omega=\\operatorname{rad}\\left(\\frac{\\mathrm{rpm}\\times360^\\circ}{60}\\right)',document.getElementById('formulaOmega'),{throwOnError:false});
    katex.render('a=\\omega^2r',document.getElementById('formulaAccel'),{throwOnError:false});

    const sceneEl=document.getElementById('scene');
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(window.devicePixelRatio,2)); sceneEl.insertBefore(renderer.domElement,sceneEl.firstChild);
    const scene=new THREE.Scene(); const camera=new THREE.PerspectiveCamera(34,1,.1,100); camera.position.set(0,6.5,9); camera.lookAt(0,0,0);
    scene.add(new THREE.HemisphereLight(0xe8ffff,0x102027,2.2)); const light=new THREE.DirectionalLight(0xffffff,2.4); light.position.set(5,7,6); scene.add(light);
    const ringGroup=new THREE.Group(); ringGroup.rotation.x=Math.PI/2.7; scene.add(ringGroup);
    const ringMat=new THREE.MeshStandardMaterial({color:0x2d9ca5,metalness:.55,roughness:.28});
    const ring=new THREE.Mesh(new THREE.TorusGeometry(3,.32,18,96),ringMat); ringGroup.add(ring);
    const spokes=new THREE.Group(); for(let i=0;i<6;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(5.5,.045,.045),new THREE.MeshBasicMaterial({color:0x8cc8c8}));s.rotation.z=i*Math.PI/3;spokes.add(s)} ringGroup.add(spokes);
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,.65,24),ringMat); hub.rotation.x=Math.PI/2; ringGroup.add(hub);
    const person=new THREE.Group(); const bodyMat=new THREE.MeshStandardMaterial({color:0xf2a93b}); const body=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.48,5,10),bodyMat); body.rotation.z=Math.PI/2; body.position.x=2.42; person.add(body); const head=new THREE.Mesh(new THREE.SphereGeometry(.16,16,12),bodyMat); head.position.x=2.08; person.add(head); ringGroup.add(person);
    const arrowMat=new THREE.MeshBasicMaterial({color:0xffc76b}); const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,1,12),arrowMat); shaft.rotation.z=-Math.PI/2; const cone=new THREE.Mesh(new THREE.ConeGeometry(.12,.3,16),arrowMat); cone.rotation.z=-Math.PI/2; const accelArrow=new THREE.Group(); accelArrow.add(shaft,cone); ringGroup.add(accelArrow);

    function sizeScene(){const w=sceneEl.clientWidth,h=sceneEl.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();} sizeScene(); Deck.onResize(sizeScene);
    let visualAngle=0;
    Deck.loop((t,dt)=>{if(!Deck.reduced()) visualAngle += dt*Math.min(state.rpm,.9)*.8; ringGroup.rotation.z=visualAngle; renderer.render(scene,camera);},{still:0});

    const chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'}); Deck.onResize(()=>chart.resize());
    function curve(targetG){return radii.map(r=>{const a=targetG*Lec.K.STANDARD_GRAVITY;const omega=Math.sqrt(a/r);const rpm=omega*Lec.K.SECONDS_PER_MINUTE/Lec.P.degreesToRadians(Lec.K.DEGREES_PER_TURN);return [r,rpm]})}
    function updateChart(){
      const targets=Array.from(Lec.K.PAGE41_TARGET_GRAVITY_FRACTIONS || [0.38, 1]);
      chart.setOption({animation:false,textStyle:{fontSize:16,color:Deck.token('--text')},grid:{left:58,right:18,top:26,bottom:43},xAxis:{type:'value',name:'半径 m',min:minR,max:maxR,nameTextStyle:{fontSize:14},axisLabel:{fontSize:13}},yAxis:{type:'value',name:'转速 rpm',min:0,max:maxRpm*1.08,nameTextStyle:{fontSize:14},axisLabel:{fontSize:13}},tooltip:{trigger:'item',textStyle:{fontSize:16}},series:[...targets.map((g,i)=>({name:Deck.fmt(g,{maximumFractionDigits:2})+' g',type:'line',showSymbol:false,data:curve(g),lineStyle:{width:2,color:i?Deck.token('--accent-2'):Deck.token('--accent')}})),{name:'当前方案',type:'scatter',symbolSize:15,data:[[state.radius,state.rpm]],itemStyle:{color:Deck.token('--danger'),borderColor:'#fff',borderWidth:3}}]});
    }
    function update(){
      const c=Lec.P.page41ArtificialGravity(state.radius,state.rpm); const diameter=state.radius*Lec.K.DIAMETER_RADIUS_FACTOR;
      const headR=Lec.P.positive(state.radius-Lec.K.PAGE41_CREW_REFERENCE_HEIGHT_M); const footA=c.omegaRadPerSecond*c.omegaRadPerSecond*state.radius; const headA=c.omegaRadPerSecond*c.omegaRadPerSecond*headR; const diffPct=Lec.P.percent(footA-headA,footA);
      [...radiusBox.children].forEach(b=>{const on=+b.dataset.value===state.radius;b.setAttribute('aria-checked',on);b.tabIndex=on?0:-1}); [...rpmBox.children].forEach(b=>{const on=+b.dataset.value===state.rpm;b.setAttribute('aria-checked',on);b.tabIndex=on?0:-1});
      document.getElementById('periodText').textContent=Deck.fmt(state.radius,{maximumFractionDigits:1})+' m · '+Deck.fmt(state.rpm,{maximumFractionDigits:2})+' rpm · '+Deck.fmt(c.periodSeconds,{maximumFractionDigits:1})+' s/圈';
      document.getElementById('omegaOut').textContent=Deck.fmt(c.omegaRadPerSecond,{maximumFractionDigits:2})+' rad/s'; document.getElementById('accelOut').textContent=Deck.fmt(c.accelerationMps2,{maximumFractionDigits:2})+' m/s²';
      document.getElementById('gOut').textContent=Deck.fmt(c.gravityFraction,{maximumFractionDigits:2})+' g · '+Deck.fmt(Lec.P.percent(c.accelerationMps2,Lec.K.STANDARD_GRAVITY),{maximumFractionDigits:0})+'%'; document.getElementById('diameterOut').textContent=Deck.fmt(diameter,{maximumFractionDigits:1})+' m'; document.getElementById('differenceOut').textContent=Deck.fmt(diffPct,{maximumFractionDigits:1})+'%';
      document.getElementById('feedback').textContent=state.changed+'驱动本次变化。小环的头脚半径相对差更明显；要获得相近加速度，小环通常需更快，大环则扩大结构。';
      const scale=.55+.55*(state.radius-minR)/(maxR-minR||1); ringGroup.scale.setScalar(scale); const arrowLen=.55+Math.min(c.gravityFraction,1.5)*.55; shaft.scale.y=arrowLen; shaft.position.x=3.05+arrowLen/2; cone.position.x=3.05+arrowLen; person.position.x=.1; updateChart();
      document.querySelectorAll('.flow .step').forEach(s=>{s.classList.add('is-current');s.classList.remove('is-done')});
    }
    update();
  </script>
</body>
</html>
