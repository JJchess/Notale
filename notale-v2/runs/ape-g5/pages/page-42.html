<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    risk-ledger-game{display:block;width:100%;height:100%}
    .risk-game{height:100%;display:flex;flex-direction:column;gap:12px}
    .risk-top{display:flex;align-items:center;gap:16px;min-height:104px;padding:14px 18px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper)}
    .risk-instruction{flex:0 0 245px;min-width:0}
    .risk-instruction strong{display:block;font-size:var(--fs-lead);line-height:1.35}
    .risk-instruction span{display:block;margin-top:4px;color:var(--ink-soft);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .risk-pool{display:flex;flex:1;flex-wrap:wrap;gap:8px;min-width:0}
    .risk-card{box-sizing:border-box;flex:1 1 29%;min-width:190px;padding:8px 11px;color:var(--text);font:700 var(--fs-label)/1.35 var(--font-sans);text-align:left;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--paper-2);cursor:grab}
    .risk-card:hover,.risk-card.is-held{border-color:var(--accent);background:var(--accent-soft)}
    .risk-card:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
    .risk-card[hidden]{display:none}
    .ledger-root{min-height:0;flex:1}
    .ledger-root>.lv{height:100%;padding-left:18px}
    .ledger-root>.lv:before{top:22px;width:12px}
    .ledger-root>.box{height:100%;box-sizing:border-box;padding:27px 16px 14px}
    .ledger-root>.box>.bt{margin:-28px 0 10px;font-size:var(--fs-lead)}
    .ledger-branches{display:flex;gap:14px;height:calc(100% - 30px)}
    .ledger{flex:1;min-width:0;height:100%;box-sizing:border-box;padding:23px 12px 10px!important;border-color:var(--line)!important}
    .ledger:before{top:20px!important;width:10px!important}
    .ledger.is-target{background:var(--accent-soft);border-color:var(--accent)!important}
    .ledger .bt{margin:-24px 0 7px!important;padding:3px 10px!important;font-size:var(--fs-body)!important}
    .ledger-q{min-height:47px;color:var(--ink-soft);font-size:var(--fs-sec);line-height:1.4}
    .ledger-count{margin:5px 0;color:var(--accent);font-size:var(--fs-label);font-weight:750}
    .ledger-items{display:flex;flex-direction:column;gap:5px;min-height:62px}
    .entry{padding:5px 8px;font-size:var(--fs-label);font-weight:680;line-height:1.35;border-left:3px solid var(--accent);background:var(--paper-2)}
    .risk-bottom{display:flex;align-items:stretch;gap:12px;min-height:88px}
    .chain{display:flex;align-items:center;justify-content:center;flex:1;min-width:0;padding:10px 16px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper)}
    .chain-step{font-size:var(--fs-sec);line-height:1.4;text-align:center}
    .chain-arrow{padding:0 12px;color:var(--accent);font-size:var(--fs-h2);font-weight:800}
    .status{flex:0 0 360px;padding:10px 14px;font-size:var(--fs-sec);line-height:1.4;border-left:5px solid var(--accent);background:var(--accent-soft)}
    .reset{align-self:center;min-height:42px;padding:8px 15px;color:#fff;font:720 var(--fs-label)/1.35 var(--font-sans);border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent);cursor:pointer}
    .complete .status{border-left-color:var(--good)}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body data-page="42" data-total="48">
  <div id="stage">
    <main id="main">
      <risk-ledger-game></risk-ledger-game>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
  class RiskLedgerGame extends HTMLElement {
    constructor(){ super(); this.state=this.fresh(); this.held=null; this.target=0; }
    fresh(){ return { assignments:{}, last:null, complete:false }; }
    connectedCallback(){ this.render(); this.start(); }
    start(){ this.dispatchEvent(new CustomEvent('game-start',{bubbles:true,composed:true})); }
    reset(){ this.state=this.fresh(); this.held=null; this.target=0; this.render(); this.dispatchEvent(new CustomEvent('game-reset',{bubbles:true,composed:true})); }
    getState(){ return JSON.parse(JSON.stringify(this.state)); }
    data(){ return {
      cats:[
        {id:'voluntary',name:'自愿承担',q:'承担者也是当前知情选择参与任务的人吗？'},
        {id:'others',name:'由他人承担',q:'后果落到未参与选择的同时代他人吗？'},
        {id:'future',name:'跨代承担',q:'当前选择把风险或义务留给未来人群吗？'}
      ],
      risks:[
        {id:'eva',name:'舱外作业受伤',cat:'voluntary',cause:'舱外作业安排',who:'执行者暴露于受伤风险'},
        {id:'health',name:'长期任务中的个人健康风险',cat:'voluntary',cause:'参加长期任务',who:'当前乘员承受健康影响'},
        {id:'debris',name:'发射残骸落入有人活动区域',cat:'others',cause:'发射与残骸处置',who:'地面居民暴露于损害'},
        {id:'rescue',name:'任务事故需要外部救援资源',cat:'others',cause:'任务事故',who:'外部人员与资源承受附加风险'},
        {id:'orbit',name:'长期轨道碎片增加未来碰撞风险',cat:'future',cause:'当前遗留碎片',who:'未来任务承受碰撞与清理负担'},
        {id:'life',name:'后代长期依赖单一生命保障设施',cat:'future',cause:'当前定居设计',who:'后代继承系统依赖与故障风险'}
      ]
    }; }
    render(){
      const d=this.data(), assigned=Object.keys(this.state.assignments).length;
      this.innerHTML=`<section class="risk-game ${this.state.complete?'complete':''}" aria-label="风险承担者分类游戏">
        <div class="risk-top"><div class="risk-instruction"><strong>把风险记到主要承担者的账上</strong><span>拖放；或聚焦条目后按 Enter 拿起，方向键选账簿，再按 Enter 放下。</span></div><div class="risk-pool" aria-label="待分配风险"></div><button class="reset" type="button">重置风险账</button></div>
        <div class="k-classification ledger-root"><div class="lv" style="--level:0"><div class="box"><div class="bt">航天风险 · 已归账 ${assigned} / ${d.risks.length}</div><div class="ledger-branches"></div></div></div></div>
        <div class="risk-bottom"><div class="chain" aria-label="因果链"></div><div class="status" aria-live="polite"></div></div></section>`;
      const pool=this.querySelector('.risk-pool');
      d.risks.forEach(r=>{ if(!this.state.assignments[r.id]){ const el=document.createElement('div'); el.className='risk-card'+(this.held===r.id?' is-held':''); el.tabIndex=0; el.draggable=true; el.setAttribute('role','button'); el.setAttribute('aria-label',r.name+'，未分配'); el.dataset.id=r.id; el.textContent=r.name; pool.appendChild(el); }});
      const branches=this.querySelector('.ledger-branches');
      d.cats.forEach((c,i)=>{ const el=document.createElement('section'); el.className='ledger lv box'+(this.held&&this.target===i?' is-target':''); el.style.setProperty('--level','1'); el.dataset.cat=c.id; el.innerHTML=`<h2 class="bt">${c.name}</h2><div class="ledger-q">${c.q}</div><div class="ledger-count">已分配 ${d.risks.filter(r=>this.state.assignments[r.id]===c.id).length}</div><div class="ledger-items"></div>`; d.risks.filter(r=>this.state.assignments[r.id]===c.id).forEach(r=>{el.querySelector('.ledger-items').insertAdjacentHTML('beforeend',`<div class="entry">${r.name}</div>`)}); branches.appendChild(el); });
      this.bind(); this.feedback();
    }
    bind(){
      this.querySelector('.reset').onclick=()=>this.reset();
      this.querySelectorAll('.risk-card').forEach(el=>{
        el.addEventListener('dragstart',e=>{this.held=el.dataset.id;e.dataTransfer.setData('text/plain',this.held)});
        el.addEventListener('keydown',e=>this.key(e,el.dataset.id));
        el.addEventListener('click',()=>{this.held=el.dataset.id;this.target=0;this.render();this.focusHeld()});
      });
      this.querySelectorAll('.ledger').forEach((el,i)=>{el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('is-target')});el.addEventListener('dragleave',()=>el.classList.remove('is-target'));el.addEventListener('drop',e=>{e.preventDefault();this.assign(e.dataTransfer.getData('text/plain'),el.dataset.cat)});});
    }
    key(e,id){ const cats=this.data().cats; if(e.key==='Enter'||e.key===' '){e.preventDefault();if(this.held===id)this.assign(id,cats[this.target].id);else{this.held=id;this.target=0;this.render();this.focusHeld()}} else if(this.held===id&&(e.key==='ArrowRight'||e.key==='ArrowDown')){e.preventDefault();this.target=(this.target+1)%3;this.render();this.focusHeld()} else if(this.held===id&&(e.key==='ArrowLeft'||e.key==='ArrowUp')){e.preventDefault();this.target=(this.target+2)%3;this.render();this.focusHeld()} else if(e.key==='Escape'){this.held=null;this.render();} }
    focusHeld(){ const el=this.querySelector(`[data-id="${this.held}"]`); if(el)el.focus(); }
    assign(id,cat){ const d=this.data(),r=d.risks.find(x=>x.id===id),c=d.cats.find(x=>x.id===cat); if(!r||!c)return; if(r.cat===cat){this.state.assignments[id]=cat;this.state.last={ok:true,r,c};}else{this.state.last={ok:false,r,c};} this.held=null; this.state.complete=Object.keys(this.state.assignments).length===d.risks.length; this.render(); const detail={state:this.getState(),action:'assign',metrics:{assigned:Object.keys(this.state.assignments).length,total:d.risks.length}}; this.dispatchEvent(new CustomEvent(this.state.complete?'game-complete':'game-progress',{detail:this.state.complete?{score:null,metrics:detail.metrics,trace:Object.keys(this.state.assignments)}:detail,bubbles:true,composed:true})); }
    feedback(){ const chain=this.querySelector('.chain'),status=this.querySelector('.status'),last=this.state.last; if(last&&last.ok){chain.innerHTML=`<span class="chain-step">${last.r.cause}</span><span class="chain-arrow">→</span><span class="chain-step">${last.r.who}</span><span class="chain-arrow">→</span><strong class="chain-step">${last.c.name}</strong>`;status.textContent=this.state.complete?'同一次任务可同时产生三类风险。船员愿意冒险，不能替地面他人或未来世代作选择。':'归账正确：看承担者，不看风险来自哪种技术。';}else if(last){chain.textContent='条目已退回待分区';status.textContent=`再看承担者：这项后果主要不落在“${last.c.name}”所描述的人身上。`;}else{chain.textContent='当前选择 → 暴露于后果的人 → 风险类别';status.textContent='分类先回答谁承担，不回答任务是否值得做。';} }
  }
  customElements.define('risk-ledger-game',RiskLedgerGame);
  Lec.mount({index:42,kicker:'RISK LEDGER',title:'同一次任务，风险可能记在不同人的账上',take:'航天风险可分为自愿承担、由他人承担和跨代承担，三者不能混为一谈。'});
  Deck.init({index:42,total:48});
  </script>
</body>
</html>
