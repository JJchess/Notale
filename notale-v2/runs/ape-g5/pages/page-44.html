<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{display:flex;flex-direction:column;gap:16px}
    .ethic-map{height:446px;grid-template-columns:390px 36px minmax(0,1fr);align-items:stretch}
    .ethic-map>.claim{align-self:stretch;padding:18px 22px;display:flex;flex-direction:column;justify-content:center;gap:12px;border-left-width:8px}
    .claim-title{font-size:var(--fs-h2);line-height:1.35;font-weight:780}
    .level{color:var(--accent);font-size:var(--fs-h2);line-height:1.35;font-weight:800}
    .requirements{display:flex;gap:12px}
    .requirement{flex:1 1 0;min-width:0;padding:12px;border:1px solid rgb(0 109 119 / 28%);border-radius:var(--radius-sm);background:var(--paper)}
    .requirement strong{display:block;margin-bottom:4px;font-size:var(--fs-label);line-height:1.35;color:var(--accent)}
    .requirement span{display:block;font-size:var(--fs-sec);line-height:var(--lh-sec);font-weight:560}
    .ethic-map>.supports{gap:10px}
    .ethic-map>.supports>.support{padding:11px 16px}
    .support-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .support h2{font-size:var(--fs-body)}
    .support p{margin-top:3px;font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--ink-soft)}
    .support select{min-width:210px;height:40px;padding:0 10px;color:var(--text);font:650 var(--fs-label)/1.35 var(--font-sans);border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--paper)}
    .support.is-pending{opacity:.58}
    .support.is-active{border-color:var(--accent);box-shadow:0 0 0 3px rgb(0 109 119 / 12%)}
    .journey{height:142px;padding:14px 20px;box-sizing:border-box;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper);box-shadow:var(--shadow)}
    .journey-top{display:flex;align-items:center;justify-content:space-between;gap:18px}
    .instruction{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--ink-soft)}
    .reset{min-height:40px;padding:7px 18px;color:#fff;font:720 var(--fs-label)/1.35 var(--font-sans);border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent);cursor:pointer}
    .track{position:relative;height:54px;margin-top:4px;padding:0 94px 0 58px;display:flex;align-items:center}
    .track::before{content:"";position:absolute;left:58px;right:94px;top:50%;height:4px;background:linear-gradient(90deg,var(--accent-soft),var(--accent-warm));transform:translateY(-50%)}
    .gate{position:absolute;right:116px;bottom:5px;width:8px;height:44px;border-radius:5px;background:var(--accent);transform-origin:bottom;transform:scaleY(var(--gate, .28));transition:transform 240ms ease-out}
    .gate::after{content:"伦理门槛";position:absolute;right:13px;top:0;width:80px;color:var(--accent);font-size:var(--fs-label);font-weight:760;line-height:1.35;text-align:right}
    input[type="range"]{position:relative;z-index:2;width:100%;height:44px;accent-color:var(--accent);cursor:grab}
    .checkpoint{position:absolute;top:2px;color:var(--ink-soft);font-size:var(--fs-label);font-weight:680;line-height:1.35}
    .cp1{left:35%}.cp2{left:58%}
    .feedback{font-size:var(--fs-sec);line-height:var(--lh-sec);font-weight:650;color:var(--text)}
    @media (prefers-reduced-motion:reduce){.gate{transition:none}}
  </style>
</head>
<body data-page="44" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="k-generalization ethic-map" aria-label="四项条件汇入伦理门槛原则">
        <div class="claim min0">
          <div class="claim-title">越难撤回、越影响未同意者，审议门槛越高</div>
          <div class="level" id="level">尚未抵达检查点</div>
          <div class="requirements">
            <div class="requirement min0"><strong>证据要求</strong><span id="evidence">先说明方案与预期后果</span></div>
            <div class="requirement min0"><strong>正当程序要求</strong><span id="process">先确认谁参与、谁受影响</span></div>
          </div>
        </div>
        <div class="trunk" aria-hidden="true"></div>
        <div class="supports min0">
          <article class="support" id="s-rev">
            <div class="support-head"><h2>后果是否容易撤回</h2><select id="reversibility" aria-label="实施后能否撤回" disabled><option value="unset">抵达后选择</option><option value="easy">容易停止</option><option value="hard">难以撤回</option><option value="none">不可逆</option></select></div>
            <p>越难撤回，犯错后可修正的空间越小。</p>
          </article>
          <article class="support is-pending" id="s-consent">
            <div class="support-head"><h2>谁无法亲自同意</h2><select id="consent" aria-label="谁无法亲自同意" disabled><option value="unset">抵达后选择</option><option value="participants">只有可退出的参与者</option><option value="others">还影响其他成员</option><option value="future">还影响未来世代</option></select></div>
            <p>个人同意不能自动替代对他人影响的审议。</p>
          </article>
          <article class="support"><div class="support-head"><h2>影响是否越出决策者本人</h2><span class="badge" id="reach">待确认</span></div><p>影响越广，越不能只凭个人勇气或任务效率。</p></article>
          <article class="support"><div class="support-head"><h2>证据与替代方案</h2><span class="badge" id="alternative">需核查</span></div><p>高门槛下，应先补证据并比较更可逆的方案。</p></article>
        </div>
      </section>

      <section class="journey" aria-label="穿越伦理门槛互动">
        <div class="journey-top"><p class="instruction">推动“身体改造方案”；抵达检查点后选择条件，再继续前进。方向键推动，Esc 返回上一检查点。</p><button class="reset" id="reset" type="button">重置</button></div>
        <div class="track" id="track"><span class="checkpoint cp1">① 能否撤回</span><span class="checkpoint cp2">② 谁会承受</span><div class="gate" aria-hidden="true"></div><input id="token" type="range" min="0" max="100" step="1" value="0" aria-label="身体改造方案推进位置"></div>
        <p class="feedback" id="feedback" aria-live="polite">方案尚未进入审议。先推动到第一个检查点。</p>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 44,
      kicker: "ETHICAL THRESHOLD",
      title: "越难撤回，越不能只凭“做得到”",
      take: "越不可逆、越影响未同意者的选择，越需要更高的证据与正当性门槛。"
    });
    Deck.init({ index: 44, total: 48 });

    const token=document.querySelector('#token'), rev=document.querySelector('#reversibility'), consent=document.querySelector('#consent');
    const level=document.querySelector('#level'), evidence=document.querySelector('#evidence'), process=document.querySelector('#process'), feedback=document.querySelector('#feedback');
    const sRev=document.querySelector('#s-rev'), sConsent=document.querySelector('#s-consent'), reach=document.querySelector('#reach'), alternative=document.querySelector('#alternative'), track=document.querySelector('#track');

    function classify(){
      const r=rev.value,c=consent.value;
      if(r==='unset'||c==='unset') return {name:'条件尚未完整',ev:'完成两项检查后展开',pr:'确认受影响者及退出条件',gate:.42,stop:true};
      if((r==='none'&&(c==='others'||c==='future'))){return {name:'暂缓，先补证据或寻找更可逆方案',ev:'补足直接证据、独立复核与替代方案比较',pr:'取得更广泛授权，公开理由并持续追责',gate:1,stop:true};}
      if(r==='none'||c==='future') return {name:'需要更广泛授权',ev:'提供可靠、相关且可复核的证据',pr:'扩大授权范围，公开不确定性与责任',gate:.82,stop:false};
      if(r==='hard'||c==='others') return {name:'加强证据与监督',ev:'增加独立复核与持续监测',pr:'审查同意限制，建立透明监督',gate:.62,stop:false};
      return {name:'常规审议',ev:'说明证据与风险边界',pr:'确认知情、拒绝与合理退出',gate:.3,stop:false};
    }
    function update(){
      let p=Number(token.value);
      const atRev=p>=34, atConsent=p>=62;
      rev.disabled=!atRev; consent.disabled=!atConsent;
      sRev.classList.toggle('is-active',atRev&&rev.value==='unset');
      sConsent.classList.toggle('is-pending',!atConsent);
      sConsent.classList.toggle('is-active',atConsent&&consent.value==='unset');
      if(p>42&&rev.value==='unset'){token.value=42;p=42;}
      if(p>70&&consent.value==='unset'){token.value=70;p=70;}
      const result=classify();
      track.style.setProperty('--gate',String(result.gate));
      level.textContent=result.name; evidence.textContent=result.ev; process.textContent=result.pr;
      reach.textContent=consent.value==='future'?'延伸到未来世代':consent.value==='others'?'影响其他成员':consent.value==='participants'?'主要由参与者承担':'待确认';
      alternative.textContent=(rev.value==='none'||rev.value==='hard')?'必须比较':'需核查';
      if(!atRev) feedback.textContent='方案尚未进入审议。先推动到第一个检查点。';
      else if(rev.value==='unset') feedback.textContent='先确认实施后能否撤回。';
      else if(!atConsent) feedback.textContent='已记录可逆性。继续推动，确认谁会承受后果。';
      else if(consent.value==='unset') feedback.textContent='再确认谁无法亲自同意。';
      else if(result.stop){token.value=Math.min(Number(token.value),84);feedback.textContent='这不是证明方案永远不应实施，而是当前理由还不足以替未同意者作不可逆决定。';}
      else if(p>=96) feedback.textContent='方案可继续审议；更高门槛不等于自动许可。尚需满足上方条件。';
      else feedback.textContent='条件已汇入门槛。继续推动，查看当前方案尚需满足什么。';
    }
    token.addEventListener('input',update); rev.addEventListener('change',update); consent.addEventListener('change',update);
    token.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();token.value=Number(token.value)>62?62:Number(token.value)>34?34:0;update();}});
    document.querySelector('#reset').addEventListener('click',()=>{token.value=0;rev.value='unset';consent.value='unset';update();token.focus();});
    update();
  </script>
</body>
</html>
