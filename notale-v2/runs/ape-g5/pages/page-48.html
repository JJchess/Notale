<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main { display: flex; align-items: stretch; }
    .final-system {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 210px 74px 1fr;
      align-items: stretch;
    }
    .final-system.k-generalization > .claim {
      align-self: stretch;
      width: 920px;
      box-sizing: border-box;
      margin: 0 auto;
      padding: var(--sp-5) var(--sp-6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 2px solid var(--accent);
      border-left-width: 8px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow);
    }
    .system-formula {
      color: var(--accent);
      font-size: 34px;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: .025em;
    }
    .system-conclusion {
      margin-top: var(--sp-3);
      font-size: var(--fs-h2);
      font-weight: 760;
      line-height: 1.35;
    }
    .final-system.k-generalization > .trunk {
      width: 100%;
      min-height: 0;
    }
    .final-system.k-generalization > .trunk::before {
      inset: 0 auto auto 50%;
      width: 4px;
      height: 38px;
      transform: translateX(-50%);
    }
    .final-system.k-generalization > .trunk::after {
      content: "";
      position: absolute;
      left: 12.5%;
      right: 12.5%;
      top: 36px;
      height: 4px;
      border-radius: 999px;
      background: var(--accent);
    }
    .final-system.k-generalization > .supports {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--sp-4);
      align-items: stretch;
      min-width: 0;
    }
    .final-system.k-generalization > .supports > .support {
      padding: var(--sp-5) var(--sp-4) var(--sp-4);
      text-align: center;
      border-top: 4px solid var(--accent);
      border-radius: var(--radius-md);
      box-shadow: 0 5px 16px rgb(23 33 43 / 6%);
    }
    .final-system.k-generalization > .supports > .support::before {
      top: auto;
      right: auto;
      left: 50%;
      bottom: 100%;
      width: 3px;
      height: 38px;
      transform: translateX(-50%);
    }
    .support h2 { color: var(--accent); }
    .support .phrase {
      margin-top: var(--sp-2);
      color: var(--text);
      font-size: var(--fs-lead);
      font-weight: 700;
      line-height: 1.4;
    }
    .support .detail {
      margin-top: var(--sp-3);
      color: var(--ink-soft);
      font-size: var(--fs-sec);
      line-height: var(--lh-sec);
      text-align: left;
    }
  </style>
</head>
<body data-page="48" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="k-generalization final-system" aria-label="身体、工具、知识与责任共同组成向地球之外延伸的人类系统">
        <div class="claim">
          <div class="system-formula">身体 × 工具 × 知识 × 责任</div>
          <div class="system-conclusion">共同组成延伸到地球之外的人类系统</div>
        </div>
        <div class="trunk" aria-hidden="true"></div>
        <div class="supports">
          <article class="support min0">
            <h2>身体</h2>
            <p class="phrase">演化留下的地球身体</p>
            <p class="detail">它带着直立、抓握、脑与合作的能力，也带着承重、能量和生理限制。</p>
          </article>
          <article class="support min0">
            <h2>工具</h2>
            <p class="phrase">把能力伸到体外的工具</p>
            <p class="detail">火箭、航天器与生命保障，把身体做不到的事交给工程系统。</p>
          </article>
          <article class="support min0">
            <h2>知识</h2>
            <p class="phrase">跨代累积的知识</p>
            <p class="detail">语言、教学、记录、分工与检验，使解决方案不必由每个人重新发明。</p>
          </article>
          <article class="support min0">
            <h2>责任</h2>
            <p class="phrase">共同承担后果的责任</p>
            <p class="detail">风险由谁承担、规则由谁决定，以及不可逆选择影响谁，都属于太空生存的一部分。</p>
          </article>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 48,
      kicker: "共同系统",
      title: "真正延伸出去的，不只是身体",
      take: "真正延伸出去的，是身体、工具、知识与责任组成的共同系统。"
    });
    Deck.init({ index: 48, total: 48 });
  </script>
</body>
</html>
