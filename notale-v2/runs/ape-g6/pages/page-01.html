<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>从“猿人”到“太空人”：先拆开那条线</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .opening {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .opening.k-generalization {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: var(--sp-6);
      width: 100%;
    }
    .lec-header__progress {
      appearance: none;
      border: 0;
      padding: 0;
      line-height: 0;
      font-size: 0;
    }
    .lec-header__progress::-webkit-progress-bar,
    .lec-header__progress::-webkit-progress-value { height: 5px; }
    .opening.k-generalization > .claim {
      align-self: center;
      width: 1200px;
      padding: 82px var(--sp-6);
      border-inline-start: 8px solid var(--accent);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      background: var(--accent-soft);
    }
    .relation {
      display: flex;
      align-items: baseline;
      justify-content: center;
      min-width: 0;
      color: var(--text);
      font-size: 94px;
      font-weight: 790;
      line-height: 1.08;
      letter-spacing: -0.055em;
      white-space: nowrap;
    }
    .endpoint { flex: 0 0 auto; }
    .broken-arrow {
      position: relative;
      display: flex;
      flex: 0 0 430px;
      align-items: center;
      align-self: center;
      margin: 0 var(--sp-7);
      height: 70px;
    }
    .shaft {
      height: 8px;
      flex: 1 1 0;
      background: var(--line-strong);
    }
    .shaft.left { margin-right: 34px; }
    .shaft.right {
      position: relative;
      margin-left: 34px;
    }
    .shaft.right::after {
      content: "";
      position: absolute;
      top: 50%;
      right: -2px;
      width: 28px;
      height: 28px;
      border-top: 8px solid var(--line-strong);
      border-right: 8px solid var(--line-strong);
      transform: translateY(-50%) rotate(45deg);
    }
    .break-mark {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 58px;
      background: var(--warm);
      transform: translate(-50%, -50%) rotate(18deg);
    }
    .opening.k-generalization > .supports {
      align-self: center;
      width: 470px;
      padding-inline-start: var(--sp-6);
    }
    .opening.k-generalization > .supports > .trunk {
      background: var(--warm);
    }
    .opening.k-generalization > .supports > .support {
      border-color: var(--warm);
      background: var(--warm-soft);
      color: var(--warm);
      font-size: 28px;
      font-weight: 760;
      line-height: 1.4;
      text-align: center;
    }
    .opening.k-generalization > .supports > .support::before {
      background: var(--warm);
    }
  </style>
</head>
<body data-page="01" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="opening k-generalization" aria-label="拆开从猿人到太空人的直线叙事">
        <div class="claim">
          <div class="relation" aria-label="引号中的猿人，断开的箭头，引号中的太空人">
            <span class="endpoint">“猿人”</span>
            <span class="broken-arrow" aria-hidden="true">
              <span class="shaft left"></span>
              <span class="shaft right"></span>
              <span class="break-mark"></span>
            </span>
            <span class="endpoint">“太空人”</span>
          </div>
        </div>
        <div class="supports">
          <span class="trunk" aria-hidden="true"></span>
          <p class="support">这条线，需要解释</p>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 1,
      kicker: "NOT A STRAIGHT LINE",
      title: "从“猿人”到“太空人”：先拆开那条线",
      take: "从“猿人”到“太空人”看似是一条线，本课要把这条线拆开。"
    });
    Deck.init({ index: 1, total: 48 });
  </script>
</body>
</html>
