<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>这六幅图，真的只能排成一条线吗？</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lec-header__progress{appearance:none;border:0;display:block;line-height:0;overflow:visible}
  .lec-header__progress>*{height:5px!important;max-height:5px!important;line-height:0}
  .lec-header__progress::-webkit-progress-bar,.lec-header__progress::-webkit-progress-value{height:5px}
  .page{height:100%;display:flex;flex-direction:column;gap:12px}
  .taskbar{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:42px}
  .taskbar .body{font-weight:600}
  .status{color:var(--accent-strong);font-size:var(--fs-sec);line-height:var(--lh-sec);white-space:nowrap}
  .game-shell{position:relative;height:340px;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-md);background:linear-gradient(180deg,var(--surface),var(--surface-2));box-shadow:var(--shadow)}
  #konva{width:100%;height:100%;outline:none}
  #konva:focus-visible{box-shadow:inset 0 0 0 4px var(--focus)}
  .mode-label{position:absolute;top:12px;left:16px;z-index:2;padding:4px 10px;border-radius:999px;background:var(--text);color:white;font-size:var(--fs-label);font-weight:700;line-height:1.4;pointer-events:none}
  .progress-track{position:absolute;left:16px;right:16px;bottom:10px;height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden;pointer-events:none}
  .progress-fill{height:100%;width:0;background:var(--accent);transition:width .2s ease}
  .compare-wrap{display:flex;flex-direction:column;gap:8px}
  .compare-title{font-size:var(--fs-label);font-weight:700;color:var(--muted)}
  .k-comparison{grid-template-columns:170px repeat(2,minmax(0,1fr))}
  .k-comparison>.hdr{min-height:38px;padding:6px 14px;font-size:var(--fs-sec)}
  .k-comparison>.dim,.k-comparison>.cell{padding:6px 14px}
  .k-comparison>.dim{font-size:var(--fs-label)}
  .k-comparison>.cell{font-size:var(--fs-sec);line-height:1.4}
  .btn{font-size:var(--fs-sec)}
</style>
</head>
<body data-page="02" data-total="48">
<div id="stage"><main id="main" class="lec-main"></main></div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/konva.min.js"></script>
<script>
Lec.mount({index:2,kicker:"BREAK THE LINE",title:"这六幅图，真的只能排成一条线吗？",take:"教科书式进化队列把分支、共存和灭绝误画成了接力赛。"});
Deck.init({index:2,total:48});
const main=document.getElementById('main');
main.innerHTML=`<section class="page">
  <div class="taskbar"><p class="body">拖动六张匿名人物卡放入任意槽位；观察同一组图像如何改变解释。</p><div class="row ai-center gap-3"><span id="status" class="status" aria-live="polite"></span><button id="reset" class="btn" type="button">重新排列</button></div></div>
  <div class="game-shell no-pan"><div class="mode-label" id="mode">进化队列</div><div id="konva" tabindex="0" role="application" aria-label="人物卡排列舞台。方向键选择卡片，回车放入下一个空槽。"></div><div class="progress-track" aria-hidden="true"><div id="prog" class="progress-fill"></div></div></div>
  <div class="compare-wrap"><div class="compare-title">同一维度，对齐比较</div><div class="k-comparison">
    <div class="hdr">比较维度</div><div class="hdr">进化队列</div><div class="hdr">分支历史</div>
    <div class="dim">关系形状</div><div class="cell diff">一条单向线</div><div class="cell">主干分出多条支路</div><div class="rowline"></div>
    <div class="dim">时间关系</div><div class="cell diff">视觉上严格先后</div><div class="cell">多个群体可以共存</div><div class="rowline"></div>
    <div class="dim">结局</div><div class="cell diff">都通向同一终点</div><div class="cell">多数支路会终止</div>
  </div></div>
</section>`;

const CARD_DEFS=[
 {skin:'#8f6147',hair:'#30231d',cloth:'#758b77',face:1},{skin:'#a87654',hair:'#4b3024',cloth:'#a27354',face:-1},
 {skin:'#704937',hair:'#241b18',cloth:'#607f88',face:1},{skin:'#b6805d',hair:'#593829',cloth:'#7f6b8e',face:-1},
 {skin:'#926044',hair:'#36231c',cloth:'#8d7c55',face:1},{skin:'#7e513e',hair:'#2b201c',cloth:'#567b69',face:-1}
];
const RELATION_EDGES=[{from:0,to:1},{from:1,to:2,terminal:true},{from:1,to:3},{from:3,to:4,terminal:true},{from:3,to:5}];
const placedCardIds=new Set();
const shell=document.querySelector('.game-shell');
const W=shell.clientWidth,H=shell.clientHeight,N=CARD_DEFS.length;
const stageK=new Konva.Stage({container:'konva',width:W,height:H});
const lineLayer=new Konva.Layer(),cardLayer=new Konva.Layer();stageK.add(lineLayer,cardLayer);
const margin=W*.055,gap=W*.018,cardW=(W-2*margin-gap*(N-1))/N,cardH=116;
const slotY=62,startY=196;
const slotX=i=>margin+i*(cardW+gap);
const slots=[],cards=[];let selected=0,complete=false;
function drawPerson(group,d){
 const cx=cardW/2,dir=d.face;
 group.add(new Konva.Circle({x:cx,y:31,radius:16,fill:d.skin}));
 group.add(new Konva.Arc({x:cx,y:28,innerRadius:12,outerRadius:17,angle:190,rotation:175,fill:d.hair}));
 group.add(new Konva.Line({points:[cx-19,92,cx-12,55,cx,47,cx+12,55,cx+19,92],closed:true,fill:d.cloth,stroke:'#18212b',strokeWidth:1.5}));
 group.add(new Konva.Line({points:[cx-7,92,cx-10,108],stroke:'#18212b',strokeWidth:5,lineCap:'round'}));
 group.add(new Konva.Line({points:[cx+7,92,cx+10,108],stroke:'#18212b',strokeWidth:5,lineCap:'round'}));
 group.add(new Konva.Circle({x:cx+dir*6,y:29,radius:1.8,fill:'#18212b'}));
}
function drawQueue(){lineLayer.destroyChildren();
 const y=slotY+cardH/2;
 lineLayer.add(new Konva.Arrow({points:[margin-18,y,W-margin+18,y],stroke:'#c95d32',fill:'#c95d32',strokeWidth:5,pointerLength:13,pointerWidth:13}));
 for(let i=0;i<N;i++){const s=new Konva.Rect({x:slotX(i),y:slotY,width:cardW,height:cardH,cornerRadius:10,stroke:'#77898d',strokeWidth:2,dash:[8,6],fill:'rgba(255,255,255,.55)'});slots.push(s);lineLayer.add(s)}
 lineLayer.draw();
}
function makeCard(d,i){const g=new Konva.Group({x:slotX(i),y:startY,draggable:true,name:'card',id:'card-'+i});
 g.add(new Konva.Rect({width:cardW,height:cardH,cornerRadius:10,fill:'#fffdf8',stroke:'#18212b',strokeWidth:2,shadowColor:'#18212b',shadowBlur:8,shadowOpacity:.14,shadowOffsetY:4}));drawPerson(g,d);
 g.on('dragstart',()=>{selected=i;highlight();g.moveToTop()});
 g.on('dragend',()=>placeNearest(i));g.on('click tap',()=>{selected=i;highlight()});cardLayer.add(g);return g}
function highlight(){cards.forEach((c,i)=>c.findOne('Rect').stroke(i===selected?'#007c91':'#18212b'));cardLayer.draw()}
function placeNearest(i){if(complete)return;const c=cards[i];let best=-1,dist=Infinity;for(let s=0;s<N;s++){const dx=Math.abs(c.x()-slotX(s)),dy=Math.abs(c.y()-slotY),dd=dx+dy;if(dd<dist){dist=dd;best=s}}
 if(dist<cardW*.8){const occupant=cards.findIndex((x,j)=>j!==i&&placedCardIds.has(j)&&Math.abs(x.x()-slotX(best))<2);if(occupant>=0){placedCardIds.delete(occupant);cards[occupant].to({x:slotX(occupant),y:startY,duration:.18})}placedCardIds.add(i);c.to({x:slotX(best),y:slotY,duration:.18});}
 else{placedCardIds.delete(i);c.to({x:slotX(i),y:startY,duration:.18})} update();}
function putNext(i){if(complete)return;let s=0;while(s<N&&cards.some((c,j)=>j!==i&&placedCardIds.has(j)&&Math.abs(c.x()-slotX(s))<2))s++;if(s<N){placedCardIds.add(i);cards[i].to({x:slotX(s),y:slotY,duration:.16});update()}}
function update(){const count=Lec.P.clamp(Lec.P.finiteNumber(placedCardIds.size,0),0,CARD_DEFS.length);document.getElementById('status').textContent=`已放置 ${count} / ${Lec.P.finiteNumber(CARD_DEFS.length,0)}`;document.getElementById('prog').style.width=(Lec.P.clamp(count/CARD_DEFS.length,0,1)*100)+'%';if(count===CARD_DEFS.length&&!complete)setTimeout(branch,250)}
function branch(){complete=true;document.getElementById('mode').textContent='分支历史';lineLayer.destroyChildren();
 const pos=[[.08,.42],[.25,.42],[.42,.16],[.48,.55],[.68,.73],[.82,.35]].map(p=>({x:W*p[0],y:H*p[1]}));
 RELATION_EDGES.forEach(e=>{const a=pos[e.from],b=pos[e.to];lineLayer.add(new Konva.Line({points:[a.x+cardW/2,a.y+cardH/2,(a.x+b.x)/2,a.y+cardH/2,(a.x+b.x)/2,b.y+cardH/2,b.x,b.y+cardH/2],stroke:e.terminal?'#c95d32':'#007c91',strokeWidth:4,lineCap:'round',lineJoin:'round',dash:e.terminal?[10,7]:[]}));if(e.terminal)lineLayer.add(new Konva.Line({points:[b.x+cardW+8,b.y+42,b.x+cardW+8,b.y+76],stroke:'#c95d32',strokeWidth:6}))});lineLayer.draw();
 cards.forEach((c,i)=>{c.draggable(false);c.to({x:pos[i].x,y:pos[i].y,duration:Deck.reduced()?0:.65,easing:Konva.Easings.EaseInOut})});
 document.getElementById('status').textContent='你可以排出许多队列，但队列本身不是演化史。';
}
function reset(){complete=false;placedCardIds.clear();document.getElementById('mode').textContent='进化队列';slots.length=0;drawQueue();cards.forEach((c,i)=>{c.draggable(true);c.position({x:slotX(i),y:startY})});update();cardLayer.draw();document.getElementById('konva').focus()}
drawQueue();CARD_DEFS.forEach((d,i)=>cards.push(makeCard(d,i)));highlight();update();
document.getElementById('reset').addEventListener('click',reset);
document.getElementById('konva').addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Enter',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowRight'){selected=(selected+1)%N;highlight()}if(e.key==='ArrowLeft'){selected=(selected+N-1)%N;highlight()}if(e.key==='Enter'||e.key===' '){putNext(selected);selected=(selected+1)%N;highlight()}});
</script>
</body>
</html>
