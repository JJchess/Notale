<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>把 35 亿年缩放到 64 年</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{height:620px;box-sizing:border-box}
    progress.lec-header__progress{appearance:none;-webkit-appearance:none;border:0;padding:0;line-height:0}
    progress.lec-header__progress::before{display:none}
    progress.lec-header__progress::-webkit-progress-bar{background:var(--surface-3)}
    progress.lec-header__progress::-webkit-progress-value{background:var(--accent)}
    .scale-page{height:100%;display:flex;flex-direction:column;gap:16px;min-width:0}
    .scale-top{display:flex;align-items:center;justify-content:space-between;gap:24px;min-width:0}
    .scale-question{font-size:var(--fs-lead);line-height:var(--lh-copy);font-weight:650}
    .span-readout{flex:0 0 250px}
    .timeline{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-lg);background:repeating-linear-gradient(0deg,rgb(0 124 145 / 9%) 0 2px,transparent 2px 20px),linear-gradient(180deg,var(--accent-soft),var(--surface-3));box-shadow:var(--shadow)}
    .scale-process{--process-axis-y:50%;position:absolute;inset:18px 34px auto;height:58px;z-index:4;gap:28px}
    .scale-process>.axis{height:3px;right:0;left:0;background:linear-gradient(90deg,var(--line-strong),var(--accent))}
    .scale-process>.step{display:flex;align-items:center;justify-content:center;padding:4px 6px;border:0;background:transparent;text-align:center;font-size:var(--fs-label);line-height:1.35;color:var(--muted)}
    .scale-process>.step.is-current{border:0;background:var(--accent-soft);box-shadow:none;color:var(--accent-strong);font-weight:700}
    .scale-process>.step.is-done{border:0;background:transparent;filter:none;color:var(--muted)}
    .scale-process>.arw{width:28px;font-size:18px;transform:translate(-28px,-50%)}
    .field{position:absolute;inset:92px 34px 28px;overflow:hidden;border-radius:var(--radius-md);background:linear-gradient(180deg,rgb(0 124 145 / 3%),rgb(255 253 248 / 78%))}
    .main-axis{position:absolute;right:22px;bottom:106px;left:22px;height:4px;border-radius:4px;background:var(--line-strong)}
    .main-axis::after{content:"→ 2025 年展示基准";position:absolute;right:0;top:14px;color:var(--accent-strong);font-size:var(--fs-label);font-weight:700;white-space:nowrap}
    .nest{position:absolute;bottom:80px;height:52px;border:2px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;opacity:.55;pointer-events:none}
    .event{position:absolute;bottom:112px;width:2px;height:36px;background:var(--accent);transform:translateX(-50%)}
    .event::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
    .event-label{position:absolute;left:50%;width:190px;padding:7px 9px;border-left:3px solid var(--accent);background:rgb(255 253 248 / 94%);font-size:var(--fs-label);line-height:1.4;transform:translateX(-50%)}
    .event:nth-of-type(even) .event-label{bottom:50px}.event:nth-of-type(odd) .event-label{top:48px}
    .event-label b{display:block;color:var(--text);font-size:var(--fs-sec);line-height:1.4}.event-label span{color:var(--muted)}
    .mote{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--line-strong);opacity:.28}
    .lens{position:absolute;z-index:8;top:2px;bottom:2px;width:170px;border:3px solid var(--accent);border-radius:18px;background:linear-gradient(90deg,rgb(217 238 241 / 32%),rgb(255 255 255 / 52%),rgb(217 238 241 / 32%));box-shadow:0 0 0 5px rgb(0 124 145 / 10%),0 12px 28px rgb(24 33 43 / 16%);cursor:ew-resize;touch-action:none;outline:none}
    .lens::before{content:"尺度变焦镜  ↔";position:absolute;top:12px;left:50%;padding:5px 9px;border-radius:999px;background:var(--accent);color:white;font-size:var(--fs-label);font-weight:700;white-space:nowrap;transform:translateX(-50%)}
    .lens:focus-visible{box-shadow:0 0 0 5px var(--focus),0 12px 28px rgb(24 33 43 / 16%)}
    .scroll-driver{position:absolute;width:1px;height:1px;overflow:auto;opacity:0;pointer-events:none}.scroll-driver>i{display:block;width:2000px;height:1px}
    .scale-bottom{display:flex;align-items:center;justify-content:space-between;gap:24px}
    .instruction{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
    .magnification{font-size:var(--fs-lead);font-weight:720;color:var(--accent-strong);white-space:nowrap}
    .claim{padding:10px 16px;border-left:5px solid var(--warm);background:var(--warm-soft);font-size:var(--fs-sec);line-height:var(--lh-sec);font-weight:650}
    @media (prefers-reduced-motion:reduce){.lens,.event,.event-label{transition:none!important}}
  </style>
</head>
<body data-page="03" data-total="48">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/lib/gsap.min.js"></script>
  <script src="assets/lib/ScrollTrigger.min.js"></script>
  <script>
    Lec.mount({index:3,kicker:"SCALE / 尺度变焦",title:"把 35 亿年缩放到 64 年",take:"生物演化、文化变化和航天史发生在相差数百万倍的时间尺度上。"});
    Deck.init({index:3,total:48});
    gsap.registerPlugin(ScrollTrigger);
    const main=document.getElementById('main');
    main.innerHTML=`<section class="scale-page">
      <div class="scale-top"><p class="scale-question">向右拖动变焦镜，看近现代事件如何从十亿年尺度中分开。</p><div class="readout span-readout"><span class="readout__label">当前观察窗口</span><strong class="readout__value" id="spanValue"></strong></div></div>
      <div class="timeline" aria-label="多尺度对数时间尺">
        <div class="k-process scale-process" aria-label="观察窗口依次缩短"><div class="axis"></div></div>
        <div class="field" id="field"><div class="main-axis"></div><div id="events"></div><div class="lens no-pan" id="lens" role="slider" tabindex="0" aria-label="尺度变焦镜" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div></div>
        <div class="scroll-driver" id="driver"></div>
      </div>
      <div class="scale-bottom"><p class="instruction">拖动镜片，或聚焦后按左右方向键；观察标签与相邻间隔。</p><p class="magnification" id="magValue"></p></div>
      <p class="claim">从最早生命证据到首次载人航天，观察窗口相差约五千多万倍；箭头只表示变焦，不表示事件必然相继发生。</p>
      <p class="sr-only" id="live" aria-live="polite"></p>
    </section>`;

    const K=(Lec.K||{}), P=(Lec.P||Lec);
    const finite=(v,f=0)=>P.finiteNumber(v,f), clamp=(v,a,b)=>P.clamp(v,a,b), round=(v,n)=>P.round(v,n);
    const present=finite(K.TIMELINE_PRESENT_YEAR,2025), life=clamp(finite(K.LIFE_EARLIEST_EVIDENCE_YEARS,3.5e9),0,finite(K.EARTH_AGE_YEARS,4.54e9));
    const spaceGap=finite(present-finite(K.FIRST_HUMAN_SPACEFLIGHT_YEAR,1961));
    const events=[
      {short:'生命尺度',date:'至少约 35 亿年前',name:'最早生命证据',age:life,detail:''},
      {short:'谱系尺度',date:'约 600 万至 700 万年前',name:'人类与黑猩猩谱系共同祖先',age:round((finite(K.HUMAN_CHIMP_LAST_COMMON_ANCESTOR_MIN_YEARS,6e6)+finite(K.HUMAN_CHIMP_LAST_COMMON_ANCESTOR_MAX_YEARS,7e6))/2,0),detail:''},
      {short:'石器尺度',date:'目前已知约 330 万年前',name:'最早石器',age:finite(K.EARLIEST_KNOWN_STONE_TOOLS_YEARS,3.3e6),detail:''},
      {short:'农业尺度',date:'约 1.2 万年前起',name:'多地农业转型',age:finite(K.AGRICULTURE_EARLY_YEARS,1.2e4),detail:'多个地区'},
      {short:'工业尺度',date:'1760 年',name:'工业革命近似起点',age:finite(present-finite(K.INDUSTRIAL_REVOLUTION_START_YEAR,1760)),detail:'并非全球同步'},
      {short:'航天尺度',date:'1961 年',name:'首次载人航天',age:spaceGap,detail:''}
    ];
    const proc=document.querySelector('.scale-process');
    events.forEach((e,i)=>{const s=document.createElement('div');s.className='step'+(i===0?' is-current':'');s.textContent=e.short;proc.appendChild(s);if(i<events.length-1){const a=document.createElement('div');a.className='arw';proc.appendChild(a)}});
    const field=document.getElementById('field'), holder=document.getElementById('events'), lens=document.getElementById('lens'), driver=document.getElementById('driver');
    events.forEach((e,i)=>{const el=document.createElement('div');el.className='event';el.title=e.date+(e.detail?'；'+e.detail:'');el.innerHTML=`<div class="event-label"><b>${e.name}</b><span>${e.date}${e.detail?' · '+e.detail:''}</span></div>`;holder.appendChild(el);e.el=el});
    const rng=new Math.seedrandom(K.SIM_SEED_TIMELINE||'apeman-spaceman-p03');
    for(let i=0;i<28;i++){const m=document.createElement('i');m.className='mote';m.style.left=(rng()*100)+'%';m.style.top=(20+rng()*64)+'%';field.appendChild(m)}
    for(let i=0;i<4;i++){const n=document.createElement('i');n.className='nest';n.style.left=(8+i*10)+'%';n.style.right=(4+i*13)+'%';field.appendChild(n)}
    const maxLog=Math.log10(life), minLog=Math.log10(spaceGap), spanValue=document.getElementById('spanValue'), magValue=document.getElementById('magValue'), live=document.getElementById('live');
    let progress=0, dragging=false;
    function spanText(v){if(v>=1e8)return round(v/1e8,1)+' 亿年';if(v>=1e4)return round(v/1e4,1)+' 万年';return round(v,0)+' 年'}
    function render(p,announce=false){progress=clamp(finite(p),0,1);const windowYears=Math.pow(10,maxLog+(minLog-maxLog)*progress);spanValue.textContent=spanText(windowYears);const mult=finite(life/windowYears,1);magValue.textContent='相对初始窗口放大 ×'+(mult>=1e6?round(mult/1e6,1)+' 万':round(mult,0));
      const w=field.clientWidth, lensW=lens.offsetWidth, lx=progress*(w-lensW);gsap.set(lens,{x:lx});lens.setAttribute('aria-valuenow',String(round(progress*100,0)));lens.setAttribute('aria-valuetext','当前窗口 '+spanText(windowYears));
      events.forEach((e,i)=>{const visible=e.age<=windowYears*1.08;const x=clamp(1-Math.log10(Math.max(e.age,spaceGap))/Math.log10(Math.max(windowYears,spaceGap*1.001)),0.02,.98);gsap.set(e.el,{left:(x*100)+'%',autoAlpha:visible?1:.1,scale:visible?1:.88});document.querySelectorAll('.scale-process .step')[i].className='step '+(i===Math.min(5,Math.floor(progress*6))?'is-current':i<progress*6?'is-done':'')});
      if(announce)live.textContent='当前窗口 '+spanText(windowYears)+'。';
    }
    const progressModel={value:0};
    const progressTween=gsap.to(progressModel,{value:1,paused:true,ease:'none',onUpdate:()=>render(progressModel.value)});
    ScrollTrigger.create({trigger:driver,start:'top top',end:'+=1000',animation:progressTween,scrub:true});
    function setProgress(p,announce=false){const q=clamp(p,0,1);progressTween.progress(q);render(q,announce)}
    lens.addEventListener('pointerdown',e=>{dragging=true;lens.setPointerCapture(e.pointerId)});
    lens.addEventListener('pointermove',e=>{if(!dragging)return;const pt=Deck.pt(field,e);setProgress((pt.x-lens.offsetWidth/2)/(field.clientWidth-lens.offsetWidth))});
    lens.addEventListener('pointerup',e=>{dragging=false;lens.releasePointerCapture(e.pointerId);render(progress,true)});
    lens.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();setProgress(progress+(e.key==='ArrowRight'?.05:-.05),true)}});
    Deck.onResize(()=>render(progress));render(0);
  </script>
</body>
</html>
