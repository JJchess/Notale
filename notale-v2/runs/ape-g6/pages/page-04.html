<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>五条线，一条主线</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-header__progress{overflow:visible}
    .lec-header__progress::before{height:5px;line-height:0}
    .course-map{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:var(--sp-5);
    }
    .map-intro{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:var(--sp-7);
      padding-inline:var(--sp-6);
    }
    .map-intro > *{min-width:0}
    .map-intro .lead{max-width:820px}
    .ledger.k-enumeration{
      --enum-cols:1;
      position:relative;
      display:flex;
      flex-direction:column;
      gap:0;
      width:100%;
      counter-reset:none;
      padding-inline-start:56px;
    }
    .ledger.k-enumeration::before{
      content:"";
      position:absolute;
      top:42px;
      bottom:42px;
      left:74px;
      width:4px;
      border-radius:999px;
      background:var(--accent);
    }
    .ledger.k-enumeration > .it{
      display:flex;
      align-items:center;
      gap:var(--sp-6);
      min-height:82px;
      padding:var(--sp-4) var(--sp-6) var(--sp-4) 72px;
      border-width:0 0 1px;
      border-radius:0;
      background:transparent;
    }
    .ledger.k-enumeration > .it:first-child{border-top:1px solid var(--line)}
    .ledger.k-enumeration > .it::before{
      content:"";
      top:50%;
      left:10px;
      width:18px;
      height:18px;
      border:4px solid var(--accent);
      background:var(--bg);
      transform:translateY(-50%);
    }
    .ledger .it-title{
      flex:0 0 170px;
      margin:0 !important;
      color:var(--accent-strong);
    }
    .ledger .question{
      min-width:0;
      color:var(--text);
      font-size:var(--fs-lead);
      line-height:var(--lh-copy);
    }
    .map-note{
      align-self:flex-end;
      max-width:920px;
      padding-inline-end:var(--sp-6);
      color:var(--muted);
      font-size:var(--fs-sec);
      line-height:var(--lh-sec);
    }
  </style>
</head>
<body data-page="04" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="course-map" aria-labelledby="map-heading">
        <div class="map-intro">
          <h2 id="map-heading" class="h2">全课路线</h2>
          <p class="lead">全课沿身体、文化、能量、火箭和责任五条线推进。</p>
        </div>
        <div id="course-ledger" class="k-enumeration ledger" role="list" aria-label="五条并列的课程观察线"></div>
        <p class="map-note">它们不是五级进步阶梯，而是解释同一次巨大尺度跨越的五个观察面。</p>
      </section>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    const courseLines = [
      ["身体", "一种灵长类获得了哪些可能性？"],
      ["文化", "知识怎样越过单个人的一生？"],
      ["能量", "分散的个体能力怎样被社会系统放大？"],
      ["火箭", "离开地球为什么不是“飞得更高”？"],
      ["责任", "获得航天能力之后，必须追问什么？"]
    ];
    const smallChinese = n => {
      const words = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
      return words[Lec.P.clamp(Math.trunc(Lec.P.finiteNumber(n, 0)), 0, 10)];
    };
    const lineCount = smallChinese(Lec.P.finiteNumber(courseLines.length, 0));

    Lec.mount({
      index: 4,
      kicker: "COURSE MAP",
      title: lineCount + "条线，一条主线",
      take: "全课沿身体、文化、能量、火箭和责任五条线推进。"
    });
    Deck.init({ index: 4, total: 48 });

    const ledger = document.getElementById("course-ledger");
    courseLines.forEach(([name, question]) => {
      const item = document.createElement("div");
      item.className = "it min0";
      item.setAttribute("role", "listitem");
      const title = document.createElement("div");
      title.className = "it-title";
      title.textContent = name;
      const prompt = document.createElement("div");
      prompt.className = "question";
      prompt.textContent = question;
      item.append(title, prompt);
      ledger.append(item);
    });
  </script>
</body>
</html>
