const main=document.getElementById('main');
main.innerHTML=`<section class="page"><div class="intro"><p class="lead">许多骨骼可以逐一对应；比例与形态却各有变化。</p><p class="hint">拖动揭示柄，比较同一位置；用左右方向键也可操作</p></div><div class="workspace"><figure class="viewer no-pan" tabindex="0" role="slider" aria-label="黑猩猩骨架揭示比例" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><img class="photo" src="${humanSrc}" alt="现代人完整装架骨骼，正面视角" title="Homo sapiens Skeleton，Wikimedia Commons 开放馆藏图片"><div class="chimp-wrap"><img class="photo" src="${chimpSrc}" alt="" aria-hidden="true" title="Chimpanzee's Skeleton in Giza Zoological Museum，Wikimedia Commons 开放许可图片"></div><span class="species c">黑猩猩骨架</span><span class="species h">现代人骨架</span><span class="handle" aria-hidden="true"></span><figcaption class="scale-note">比较用等高缩放，不代表真实体型比例</figcaption><small class="source">标本照：Wikimedia Commons</small></figure><div class="facts min0"><div class="k-comparison"><div class="hdr">解剖区域</div><div class="hdr">共享结构</div><div class="hdr">形态差异</div><div class="dim">颅骨与牙列</div><div class="cell">颅腔、眼眶、上下颌与基本牙型</div><div class="cell diff">脑颅与面部比例、颌部前突与犬齿大小</div><div class="rowline"></div><div class="dim">胸廓与脊柱</div><div class="cell">椎骨、肋骨与胸骨</div><div class="cell diff">胸廓轮廓与脊柱整体曲线</div><div class="rowline"></div><div class="dim">肩臂与手</div><div class="cell">肩胛、上臂、前臂、腕掌与五指</div><div class="cell diff">上肢长度、手指比例与弯曲程度</div><div class="rowline"></div><div class="dim">骨盆与下肢</div><div class="cell">骨盆、股骨、小腿、踝与趾骨</div><div class="cell diff">骨盆轮廓、腿长与足部比例</div></div></div></div><div class="branch" title="这是谱系分开的近似年代范围，不是一只黑猩猩变成人的时间。"><span class="end left">现代人谱系</span><span class="end right">黑猩猩谱系</span><svg viewBox="0 0 1408 42" aria-hidden="true"><path d="M704 40 L704 29 L330 2 M704 29 L1078 2" fill="none" stroke="var(--accent)" stroke-width="3"/><path d="M320 2l15-4-7 13M1088 2l-15-4 7 13" fill="none" stroke="var(--accent)" stroke-width="3"/></svg><span class="ancestor">共同祖先：约<span id="minYears"></span>万至<span id="maxYears"></span>万年前</span></div></section>`;
const minY=Lec.P.finiteNumber(6000000,6000000), maxY=Lec.P.finiteNumber(7000000,7000000), yearSeconds=Lec.P.secondsPerYear();
document.getElementById('minYears').textContent=Lec.P.round((minY*yearSeconds/yearSeconds)/10000,0);document.getElementById('maxYears').textContent=Lec.P.round((maxY*yearSeconds/yearSeconds)/10000,0);
const viewer=main.querySelector('.viewer'),wrap=main.querySelector('.chimp-wrap'),handle=main.querySelector('.handle'),diffs=[...main.querySelectorAll('.diff')];let value=50,drag=false;
function render(){const v=Lec.P.clamp(Lec.P.finiteNumber(value,50),0,100);value=v;wrap.style.clipPath=`inset(0 ${100-v}% 0 0)`;handle.style.left=v+'%';viewer.setAttribute('aria-valuenow',String(Lec.P.round(v,0)));diffs.forEach((el,i)=>el.classList.toggle('is-read',v>=(i+1)*20));}
function setFrom(e){const p=Deck.pt(viewer,e);value=p.x/viewer.offsetWidth*100;render()}
viewer.addEventListener('pointerdown',e=>{drag=true;viewer.setPointerCapture(e.pointerId);setFrom(e)});viewer.addEventListener('pointermove',e=>{if(drag)setFrom(e)});viewer.addEventListener('pointerup',()=>drag=false);viewer.addEventListener('pointercancel',()=>drag=false);viewer.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();value+=e.key==='ArrowRight'?5:-5;render()}});render();
</script></body></html>
