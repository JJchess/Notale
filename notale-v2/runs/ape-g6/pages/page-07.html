<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>人类演化更像一丛灌木</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{box-sizing:border-box}
    .lec-header__progress{line-height:0;appearance:none;overflow:visible}
    .page{height:620px;display:flex;flex-direction:column;gap:16px}
    .intro{height:142px;display:flex;gap:24px;flex:0 0 auto}
    .rules{flex:1 1 0;padding:18px 22px}.rules .bt{margin:-18px -22px 12px;padding:8px 22px}
    .rules p{font-size:18px;line-height:1.5}.rules strong{color:var(--accent-strong)}
    .detail{flex:0 0 500px;padding:18px 22px;box-shadow:none}
    .detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
    .detail h2{font-size:22px}.badge{font-size:15px;font-weight:700;color:var(--accent-strong)}
    #detailText{font-size:16px;line-height:1.45;color:var(--muted)}
    .tree-shell{position:relative;flex:1 1 0;min-height:0;overflow:auto;border-top:2px solid var(--line-strong);background:transparent}
    .tree-shell::before{content:"共同祖先层  ›  早期古人类层  ›  人属与旁支层";position:absolute;z-index:2;top:10px;left:18px;font-size:15px;font-weight:700;color:var(--muted)}
    #tree{display:block;width:100%;min-width:1160px;height:100%;min-height:420px}
    .link{fill:none;stroke:var(--line-strong);stroke-width:2.5}.link.disputed{stroke-dasharray:7 6}
    .link.on{stroke:var(--accent);stroke-width:5}.link.peer{stroke:var(--warm);stroke-width:3.5}
    .node{cursor:pointer;outline:none}.node .hit{fill:transparent}.node .dot{fill:var(--surface);stroke:var(--accent-strong);stroke-width:3}
    .node.extinct .dot{fill:var(--muted);stroke:var(--muted)}.node.current .dot{fill:var(--success);stroke:var(--success)}
    .node.disputed .dot{stroke-dasharray:4 3}.node.on .dot{fill:var(--accent);stroke:var(--accent)}.node.peer .dot{fill:var(--warm);stroke:var(--warm)}
    .node text{font-family:var(--font-sans);font-size:15px;font-weight:650;fill:var(--text);pointer-events:none}.node .status{font-size:14px;font-weight:500;fill:var(--muted)}
    .cross{cursor:pointer}.cross line{stroke:var(--warm);stroke-width:3;stroke-dasharray:8 7}.cross rect{fill:var(--warm-soft);stroke:var(--warm);stroke-width:2}.cross text{font-family:var(--font-sans);font-size:15px;font-weight:700;fill:var(--text)}
    .legend{position:absolute;right:16px;top:10px;display:flex;gap:16px;font-size:14px;color:var(--muted);background:var(--surface)}
    .legend span::before{content:"";display:inline-block;width:18px;border-top:3px solid var(--line-strong);margin-right:6px;vertical-align:middle}.legend .dash::before{border-top-style:dashed}.legend .cut::before{width:10px;border-top:8px solid var(--muted)}
    button.reset{min-height:42px;padding:8px 16px;border:1px solid var(--accent-strong);border-radius:8px;background:var(--accent);color:white;font:650 15px var(--font-sans);cursor:pointer}
    button.reset:focus-visible,.node:focus-visible .hit,.cross:focus-visible rect{outline:3px solid var(--focus);outline-offset:3px}
  </style>
</head>
<body data-page="07" data-total="48">
  <div id="stage"><main id="main">
    <div class="page">
      <section class="intro">
        <div class="rules box k-classification min0"><span class="bt">怎样读这棵树</span><p><strong>分叉表示谱系分化</strong>，不表示后一项替换前一项。所有树梢等高；选择一支，看它如何嵌在更大的分叉网络中。</p></div>
        <aside class="detail panel min0" aria-live="polite"><div class="detail-head"><h2 id="detailTitle">完整的分支灌木</h2><button class="reset" id="reset">恢复全树</button></div><p id="detailText">人类演化不是从“低等”走向“高等”的队列。点选节点，查看它的归属、近缘分支与共存关系。</p></aside>
      </section>
      <section class="tree-shell k-classification min0" aria-label="可点选的古人类分支谱系树">
        <div class="legend"><span>简化关系</span><span class="dash">关系有争议</span><span class="cut">已灭绝</span></div>
        <svg id="tree" role="tree" aria-label="横向古人类分支树；节点可用 Tab 聚焦，再按回车或空格选择"></svg>
      </section>
    </div>
  </main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
    Lec.mount({index:7,kicker:"BRANCHING HOMININS",title:"人类演化更像一丛灌木",take:"多个古人类分支曾同时存在；智人是延续至今的一支，不是预设终点。"});
    Deck.init({index:7,total:48});
    const N=Lec.P||Lec;
    const fmtWan=v=>N.round(N.finiteNumber(v,0)/10000,0);
    const common=`约${fmtWan(6000000)}万至${fmtWan(7000000)}万年前的共同祖先范围`;
    const homo=`最早人属证据约${fmtWan(N.clamp(N.finiteNumber(2800000,0),0,10000000))}万年前；边界并非突然发生`;
    const sapiens=`至少约${fmtWan(N.clamp(N.finiteNumber(300000,0),0,10000000))}万年前出现`;
    const data={name:"人类—黑猩猩谱系共同祖先",layer:"共同祖先层",info:common,children:[
      {name:"黑猩猩谱系",layer:"独立演化分支",info:"与人类谱系共享祖先，此后各自演化。"},
      {name:"早期古人类",layer:"早期古人类层",info:"包含多个已灭绝分支；早期位置与相互关系仍可能调整。",children:[
        {name:"南方古猿类",layer:"早期古人类层",info:"具有自身延续与分化，不是通往人属的一格台阶。",children:[{name:"傍人类",layer:"旁支",status:"已灭绝",info:"与早期人属在部分时期共存，并非智人的直接前身。"}]},
        {name:"早期人属",layer:"人属层",info:homo,children:[
          {name:"直立人",layer:"人属分支",status:"已灭绝",info:"长期延续的分支，不是自动通向智人的单线通道。"},
          {name:"较晚人属",layer:"人属层",info:"多个近缘或位置仍有争议的分支并行存在。",children:[
            {name:"尼安德特人",layer:"近缘分支",status:"已灭绝",peer:["丹尼索瓦人","智人"],info:"与智人近缘，存在基因交流；这里不展开迁徙过程。"},
            {name:"丹尼索瓦人",layer:"近缘分支",status:"关系仍在研究中",disputed:true,peer:["尼安德特人"],info:"化石记录有限，亲缘关系会随研究更新。"},
            {name:"智人",layer:"人属分支",status:"延续至今",current:true,peer:["尼安德特人"],info:sapiens+"；这是延续至今的一支，不是预设终点。"},
            {name:"弗洛勒斯人",layer:"旁支",status:"已灭绝",disputed:true,info:"较晚仍存在的旁支；与其他人属分支的确切关系仍有争议。"}
          ]}
        ]}
      ]}
    ]};
    const root=d3.hierarchy(data), W=1360,H=420;
    d3.tree().size([H-76,W-410])(root);
    root.descendants().forEach(d=>{d.y=70+d.depth*245;d.x+=46});
    const svg=d3.select("#tree").attr("viewBox",`0 0 ${W} ${H}`);
    const g=svg.append("g");
    const links=g.selectAll("path.link").data(root.links()).join("path").attr("class",d=>"link"+(d.target.data.disputed?" disputed":"")).attr("d",d3.linkHorizontal().x(d=>d.y).y(d=>d.x));
    const nodes=g.selectAll("g.node").data(root.descendants()).join("g").attr("class",d=>`node${d.data.status==='已灭绝'?' extinct':''}${d.data.current?' current':''}${d.data.disputed?' disputed':''}`).attr("transform",d=>`translate(${d.y},${d.x})`).attr("tabindex",0).attr("role","treeitem").attr("aria-label",d=>`${d.data.name}，${d.data.layer}，${d.data.status||'分支节点'}`);
    nodes.append("circle").attr("class","hit").attr("r",22);nodes.append("circle").attr("class","dot").attr("r",8);
    nodes.append("text").attr("x",14).attr("y",-3).text(d=>d.data.name);
    nodes.filter(d=>d.data.status).append("text").attr("class","status").attr("x",14).attr("y",17).text(d=>d.data.status);
    const late=root.descendants().filter(d=>["尼安德特人","丹尼索瓦人","智人","弗洛勒斯人"].includes(d.data.name));
    const cross=svg.append("g").attr("class","cross").attr("tabindex",0).attr("role","button").attr("aria-label","同期截面：四个较晚人属分支曾在部分时期共存");
    cross.append("line").attr("x1",1080).attr("x2",1080).attr("y1",d3.min(late,d=>d.x)-18).attr("y2",d3.max(late,d=>d.x)+18);
    cross.append("rect").attr("x",1100).attr("y",14).attr("width",116).attr("height",38).attr("rx",8);cross.append("text").attr("x",1158).attr("y",39).attr("text-anchor","middle").text("同期截面");
    const title=document.getElementById("detailTitle"), text=document.getElementById("detailText");
    function select(d){nodes.classed("on",false).classed("peer",false);links.classed("on",false).classed("peer",false);let p=d;while(p){nodes.filter(n=>n===p).classed("on",true);if(p.parent)links.filter(l=>l.target===p).classed("on",true);p=p.parent}const peers=d.data.peer||[];nodes.filter(n=>peers.includes(n.data.name)).classed("peer",true);title.textContent=d.data.name+" · "+d.data.layer;text.textContent=d.data.info+(d.data.disputed?" 关系仍在研究中。":"")}
    function coexist(){nodes.classed("on",d=>late.includes(d)).classed("peer",false);links.classed("on",false).classed("peer",false);title.textContent="多个分支曾同期存在";text.textContent="智人、尼安德特人、丹尼索瓦人与弗洛勒斯人曾在部分时期同时存在；共存不等于生活在同一地点，也不等于彼此关系完全清楚。"}
    nodes.on("click",(e,d)=>select(d)).on("keydown",(e,d)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(d)}});cross.on("click",coexist).on("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();coexist()}});
    document.getElementById("reset").addEventListener("click",()=>{nodes.classed("on peer",false);links.classed("on peer",false);title.textContent="完整的分支灌木";text.textContent="人类演化不是从“低等”走向“高等”的队列。点选节点，查看它的归属、近缘分支与共存关系。"});
  </script>
</body>
</html>
