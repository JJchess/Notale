<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>双足行走，可能不只由一种环境推动</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{box-sizing:border-box}
    .lec-header__progress{appearance:none;border:0;padding:0;font-size:0;line-height:0;display:block}
    .page08{height:620px;display:flex;flex-direction:column;gap:12px}
    .intro{display:flex;align-items:center;justify-content:space-between;gap:24px}
    .intro .lead{max-width:970px}
    .legend{display:flex;align-items:center;gap:16px;white-space:nowrap;font-size:var(--fs-label)}
    .legend span{display:inline-flex;align-items:center;gap:6px}
    .legend i{display:inline-block;width:28px;height:0;border-top:3px solid var(--success)}
    .legend .compat i{border-color:var(--accent);border-top-style:dashed}
    .legend .limit i{width:14px;border-color:var(--warm);position:relative}
    .legend .limit i::after{content:"";position:absolute;right:-2px;top:-7px;height:12px;border-right:3px solid var(--warm)}
    .board{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
    .matrix{--compare-n:3;grid-template-columns:164px repeat(3,minmax(0,1fr));position:relative;z-index:2;flex:1}
    .matrix>.hdr{min-height:76px;align-items:center;padding:10px 14px;font-size:19px}
    .matrix>.hdr small{display:block;margin-top:3px;color:var(--muted);font-size:14px;font-weight:500;line-height:1.35}
    .matrix>.dim,.matrix>.cell{min-height:43px;padding:8px 12px}
    .matrix>.cell{display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;font-weight:650}
    .matrix>.cell.is-related{background:var(--accent-soft)}
    #links{position:absolute;z-index:3;inset:0;pointer-events:none}
    .tray{position:relative;z-index:4;display:flex;align-items:center;gap:10px;min-height:82px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius-md);background:rgb(255 253 248 / 94%)}
    .tray-label{flex:0 0 84px;color:var(--muted);font-size:var(--fs-label);font-weight:700}
    .evidence{flex:1 1 0;min-width:0;min-height:62px;padding:8px 12px;border:2px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);font-size:16px;line-height:1.35;cursor:grab;user-select:none;touch-action:none}
    .evidence strong{color:var(--accent-strong)}
    .evidence:focus{outline:3px solid var(--focus);outline-offset:2px}
    .evidence.is-set{border-color:var(--success);background:var(--success-soft)}
    .controls{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:44px}
    .switch{display:flex;align-items:center;gap:9px;font-size:var(--fs-label);font-weight:650}
    .switch input{width:20px;height:20px;accent-color:var(--accent)}
    .status{flex:1;color:var(--muted);font-size:16px;line-height:1.4;text-align:right}
    .conclusion{display:none;padding:8px 14px;border-left:5px solid var(--accent);background:var(--accent-soft);font-size:16px;font-weight:650;line-height:1.4}
    .conclusion.show{display:block}
  </style>
</head>
<body data-page="08" data-total="48">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/konva.min.js"></script>
  <script>
    Lec.mount({
      index: 8,
      kicker: "BIPEDAL ORIGINS",
      title: "双足行走，可能不只由一种环境推动",
      take: "环境变化可能参与双足演化，但单一“走出森林”故事不足以解释全部证据。"
    });
    Deck.init({ index: 8, total: 48 });

    const main = document.getElementById("main");
    main.innerHTML = `
      <section class="page08">
        <div class="intro">
          <p class="lead">把证据拖向假说列；同一证据可连接多列。支持并不等于证明起因。</p>
          <div class="legend" aria-label="关系线图例"><span><i></i>支持</span><span class="compat"><i></i>兼容</span><span class="limit"><i></i>限制</span></div>
        </div>
        <div class="board no-pan" id="board">
          <div id="links" aria-hidden="true"></div>
          <div class="k-comparison matrix" id="matrix">
            <div class="hdr">证据维度</div>
            <div class="hdr" data-col="0">开阔地移动<small>远行、观察或散热</small></div>
            <div class="hdr" data-col="1">树上取食与姿势<small>取食、平衡与枝上移动</small></div>
            <div class="hdr" data-col="2">镶嵌环境适应<small>多环境、多任务共同作用</small></div>
            <div class="dim">古环境背景</div><div class="cell" data-r="0" data-c="0">开阔可支持</div><div class="cell" data-r="0" data-c="1">林木保留可能</div><div class="cell" data-r="0" data-c="2">混合环境吻合</div>
            <div class="dim">身体结构组合</div><div class="cell" data-r="1" data-c="0">地面结构兼容</div><div class="cell" data-r="1" data-c="1">攀爬仍重要</div><div class="cell" data-r="1" data-c="2">两类特征并存</div>
            <div class="dim">行为收益</div><div class="cell" data-r="2" data-c="0">地面收益可检验</div><div class="cell" data-r="2" data-c="1">树上收益可检验</div><div class="cell" data-r="2" data-c="2">收益不止一种</div>
            <div class="dim">解释限制</div><div class="cell diff" data-r="3" data-c="0">开阔≠自动双足</div><div class="cell diff" data-r="3" data-c="1">姿势≠稳定步行</div><div class="cell diff" data-r="3" data-c="2">预测可能过宽</div>
          </div>
          <div class="tray" aria-label="证据牌堆">
            <div class="tray-label">证据牌堆</div>
            <div class="evidence" role="button" tabindex="0" data-id="0"><strong>A</strong> 早期环境并非一律是无遮蔽草原</div>
            <div class="evidence" role="button" tabindex="0" data-id="1"><strong>B</strong> 双足特征与攀爬特征可同时存在</div>
            <div class="evidence" role="button" tabindex="0" data-id="2"><strong>C</strong> 地面移动与树上取食都可能受益</div>
            <div class="evidence" role="button" tabindex="0" data-id="3"><strong>D</strong> 环境、结构与行为并非自动因果链</div>
          </div>
        </div>
        <div class="controls">
          <label class="switch"><input id="limits" type="checkbox">同时看限制</label>
          <div class="status" id="status" aria-live="polite">拖动证据；键盘可用方向键选列，Enter 建立或取消关系。</div>
        </div>
        <p class="conclusion" id="conclusion">没有任何一列独占全部证据。多种环境与行为压力可能共同作用。</p>
      </section>`;

    const board = document.getElementById('board');
    const matrix = document.getElementById('matrix');
    const status = document.getElementById('status');
    const limits = document.getElementById('limits');
    const conclusion = document.getElementById('conclusion');
    const cards = [...document.querySelectorAll('.evidence')];
    const relType = [
      ['limit','compatible','support'],
      ['compatible','support','support'],
      ['support','support','compatible'],
      ['limit','limit','support']
    ];
    const relText = {support:'支持', compatible:'兼容，但不能单独区分', limit:'限制简单版本'};
    const selected = cards.map(() => new Set());
    const cursor = [0,0,0,0];

    const konvaStage = new Konva.Stage({container:'links', width:board.clientWidth, height:board.clientHeight});
    const lineLayer = new Konva.Layer();
    konvaStage.add(lineLayer);

    function center(el){
      const b = board.getBoundingClientRect(), r = el.getBoundingClientRect();
      const sx = board.offsetWidth / b.width, sy = board.offsetHeight / b.height;
      return {x:(r.left+r.width/2-b.left)*sx, y:(r.top+r.height/2-b.top)*sy};
    }
    function draw(){
      konvaStage.size({width:board.clientWidth,height:board.clientHeight});
      lineLayer.destroyChildren();
      document.querySelectorAll('.cell').forEach(x=>x.classList.remove('is-related'));
      selected.forEach((set,i)=>set.forEach(c=>{
        const type=relType[i][c];
        if(type==='limit' && !limits.checked) return;
        const a=center(cards[i]);
        const target=document.querySelector(`.cell[data-r="${i}"][data-c="${c}"]`);
        const z=center(target);
        target.classList.add('is-related');
        const color=type==='support'?'#39734d':type==='compatible'?'#007c91':'#c95d32';
        const line=new Konva.Line({points:[a.x,a.y-30,a.x,a.y-45,z.x,z.y+17],stroke:color,strokeWidth:3,lineCap:'round',lineJoin:'round',dash:type==='compatible'?[9,7]:[]});
        lineLayer.add(line);
        if(type==='limit') lineLayer.add(new Konva.Line({points:[z.x-8,z.y+12,z.x+8,z.y+22],stroke:color,strokeWidth:3}));
      }));
      lineLayer.draw();
      cards.forEach((card,i)=>card.classList.toggle('is-set',selected[i].size>0));
      const complete=selected.every(s=>s.size>0)&&limits.checked;
      conclusion.classList.toggle('show',complete);
      if(complete) status.textContent='已放置全部证据，并查看了限制关系。';
    }
    function toggle(i,c){
      if(selected[i].has(c)) selected[i].delete(c); else selected[i].add(c);
      const type=relType[i][c];
      status.textContent=`证据 ${'ABCD'[i]} 与“${document.querySelector(`[data-col="${c}"]`).childNodes[0].textContent.trim()}”：${relText[type]}。`;
      draw();
    }
    cards.forEach((card,i)=>{
      let start=null;
      card.addEventListener('pointerdown',e=>{ start=Deck.pt(board,e); card.setPointerCapture(e.pointerId); card.style.cursor='grabbing'; });
      card.addEventListener('pointermove',e=>{ if(!start)return; const p=Deck.pt(board,e); card.style.transform=`translate(${p.x-start.x}px,${p.y-start.y}px)`; });
      card.addEventListener('pointerup',e=>{
        if(!start)return; const p=Deck.pt(board,e); card.style.transform='';card.style.cursor='grab';start=null;
        const x=p.x-matrix.offsetLeft, label=matrix.offsetWidth*(164/(164+3*400));
        if(x>label){ const c=Lec.clamp(Math.floor((x-label)/((matrix.offsetWidth-label)/3)),0,2); cursor[i]=c; toggle(i,c); }
      });
      card.addEventListener('keydown',e=>{
        if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cursor[i]=Lec.clamp(cursor[i]+(e.key==='ArrowRight'?1:-1),0,2);status.textContent=`证据 ${'ABCD'[i]} 当前指向第 ${Lec.finiteNumber(cursor[i]+1,1)} 列，按 Enter 建立关系。`;}
        if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(i,cursor[i]);}
      });
    });
    limits.addEventListener('change',()=>{status.textContent=limits.checked?'已显示限制：它排除的是过强版本，不是整类假说。':'当前只看支持与兼容关系。';draw();});
    Deck.onResize(draw);
    draw();
  </script>
</body>
</html>
