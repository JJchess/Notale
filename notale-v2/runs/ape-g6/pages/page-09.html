function refresh(){document.querySelectorAll('.step').forEach(s=>{const a=s.dataset.accept;const done=a==='print'?placed.has('print'):a==='all'?placed.size===3:a==='conclusion'?false:placed.has(a);s.classList.toggle('is-done',done);if(done)s.querySelector('.slot').textContent=a==='all'?'三线汇入':'已就位'});document.getElementById('travel').classList.toggle('on',placed.has('print'));claim.disabled=placed.size!==3;if(placed.size===3){claim.focus();status.textContent='三条线索已汇合。现在检查：结论是否超出证据分辨范围？';status.classList.add('show')}}
function place(kind){placed.add(kind);cards.find(c=>c.dataset.kind===kind).setAttribute('aria-pressed','true');refresh()}
cards.forEach(c=>{c.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',c.dataset.kind));c.addEventListener('click',()=>place(c.dataset.kind))});document.querySelectorAll('.step').forEach(s=>{s.addEventListener('dragover',e=>e.preventDefault());s.addEventListener('drop',e=>{e.preventDefault();const k=e.dataTransfer.getData('text/plain');if(s.dataset.accept===k||(k==='print'&&s.dataset.accept==='print'))place(k);else{status.textContent='这条线索不能回答该步骤的问题。';status.classList.add('show')}})});
claim.addEventListener('change',()=>{const last=document.querySelector('[data-accept="conclusion"]');if(claim.value==='ok'){last.classList.add('is-done');last.querySelector('.slot').textContent='证据链闭合';status.textContent=`约${wan}万年前，拉埃托利已有古人类以双足连续行走；这一判断由足迹、相关骨骼与地层年代共同约束。`;document.getElementById('field').classList.add('complete')}else if(claim.value==='over'){last.classList.remove('is-done');last.querySelector('.slot').textContent='证据不足';status.textContent='这句话超出了现有证据能分辨的范围：相近年代的骨骼不是脚印制造者的同一个体证明。'}status.classList.add('show')});
</script></body></html>
