<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人手不是突然出现的“工具附件”</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
.lec-header__progress{appearance:none;border:0;overflow:visible}.hand-page{height:100%;display:flex;flex-direction:column;gap:12px}.workbench{display:flex;gap:16px;height:330px;min-height:0}.views{display:flex;gap:12px;flex:1 1 auto;min-width:0}.hand-view{position:relative;flex:1 1 0;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-md);background:linear-gradient(160deg,#edf3f2,#d9e6e5)}.hand-view.is-live{border-color:var(--accent);box-shadow:inset 0 0 0 2px rgb(0 124 145 / 12%)}.view-title{position:absolute;z-index:2;top:10px;left:14px;padding:4px 9px;border-radius:999px;background:rgb(255 253 248 / 88%);font-size:var(--fs-label);font-weight:700}.status{position:absolute;z-index:2;right:12px;bottom:10px;left:12px;display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);background:rgb(16 43 52 / 88%);color:#f6ffff;font-size:var(--fs-label);line-height:1.4}.hand-view canvas{display:block;width:100%;height:100%}.controls{flex:0 0 340px;min-width:0;padding:16px}.controls h2{margin-bottom:8px}.controls .ctl{min-height:42px}.controls select{flex:1;min-width:0;padding:7px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface)}.controls .btn{width:100%;margin-top:8px}.hint{margin-top:8px}.model-note{position:absolute;z-index:2;top:48px;left:14px;max-width:250px;color:var(--muted);font-size:var(--fs-label);line-height:1.4}.compare-wrap{min-height:0}.k-comparison{--compare-n:2}.k-comparison>.hdr{min-height:42px;padding:7px 12px;font-size:var(--fs-body)}.k-comparison>.dim,.k-comparison>.cell{padding:6px 12px}.k-comparison>.cell{font-size:var(--fs-sec);line-height:1.38}.k-comparison>.dim{font-size:var(--fs-label)}
</style>
</head>
<body data-page="10" data-total="48">
<div id="stage"><main id="main">
<section class="hand-page" aria-label="手部结构与控制比较">
  <div class="workbench">
    <div class="views min0">
      <figure class="hand-view min0" aria-label="继承的基本手型三维模型">
        <figcaption class="view-title">基准态｜基本手型</figcaption><canvas id="base3d"></canvas>
        <div class="status"><span>稳定性：<b id="baseStable">易滑落</b></span><span>挤压力：<b id="baseForce">较大</b></span></div>
      </figure>
      <figure class="hand-view is-live min0 no-pan" aria-label="可调整控制的三维手部模型">
        <figcaption class="view-title">改造态｜同一结构</figcaption><div class="model-note">拖动物体，观察接触是否仍能维持。</div><canvas id="live3d"></canvas>
        <div class="status" aria-live="polite"><span>稳定性：<b id="liveStable">勉强稳定</b></span><span>挤压力：<b id="liveForce">中等</b></span></div>
      </figure>
    </div>
    <aside class="panel panel--flat controls min0">
      <h2>改造控制配置</h2>
      <div class="ctl"><label for="task">抓握任务</label><select id="task"><option value="large">大物体整手抓握</option><option value="small">小物体指尖捏持</option></select></div>
      <div class="ctl"><label for="thumb">拇指更能对掌</label><input id="thumb" type="range" min="0" max="100" value="35" aria-label="拇指对掌能力"></div>
      <div class="ctl"><label for="independent">手指更能独立控制</label><input id="independent" type="range" min="0" max="100" value="35" aria-label="手指独立控制能力"></div>
      <button class="btn" id="reset" type="button">复原基准态</button>
      <p class="sec hint">切换大小物体，再调两项控制；比较两只手的接触、稳定性与用力。</p>
    </aside>
  </div>
  <div class="compare-wrap">
    <div class="k-comparison" role="table" aria-label="继承结构与精细控制逐行比较">
      <div class="hdr" role="columnheader">比较维度</div><div class="hdr" role="columnheader">继承结构保持不变</div><div class="hdr" role="columnheader">更精细的控制变化</div>
      <div class="dim">五指与关节</div><div class="cell">五指、掌骨、指骨与可弯关节仍在</div><div class="cell diff">不添新手指，扩大已有手指相遇范围</div><div class="rowline"></div>
      <div class="dim">拇指对掌</div><div class="cell">可以跨向掌面，但接触位置受限</div><div class="cell diff">指腹更容易与食指或中指相对</div><div class="rowline"></div>
      <div class="dim">手指协同</div><div class="cell">多指共同弯曲，适合包住大物体</div><div class="cell diff">各指可调弯曲程度与接触时机</div><div class="rowline"></div>
      <div class="dim">抓握结果</div><div class="cell">整手抓握可稳定，小物体易滑落</div><div class="cell diff">指尖接触集中，位置与方向更易细调</div>
    </div>
  </div>
</section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/three.min.js"></script>
<script>
Lec.mount({index:10,kicker:"HAND / CONTROL",title:"人手不是突然出现的“工具附件”",take:"人手沿用灵长类手的基本结构，并在对掌、独立控制与指腹接触上形成更精细的动作能力。"});
Deck.init({index:10,total:48});
const task=document.getElementById('task'),thumb=document.getElementById('thumb'),independent=document.getElementById('independent');
const Num=Lec.P||Lec;
const state={task:'large',thumb:.35,independent:.35,pull:0};
function makeHand(canvas,isLive){
 const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(34,1,.1,50);camera.position.set(0,1.1,10);scene.add(new THREE.HemisphereLight(0xffffff,0x587078,2.2));const dl=new THREE.DirectionalLight(0xffffff,2.4);dl.position.set(-4,7,8);scene.add(dl);
 const root=new THREE.Group();root.rotation.x=-.16;scene.add(root);const skin=new THREE.MeshStandardMaterial({color:0x87b7b5,roughness:.55,transparent:true,opacity:.82}),bone=new THREE.MeshStandardMaterial({color:0xf1e5c6,roughness:.4}),contact=new THREE.MeshBasicMaterial({color:0xe86132});
 const palm=new THREE.Mesh(new THREE.BoxGeometry(2.65,2.2,.62),skin);palm.position.y=-.55;root.add(palm);const fingers=[];const xs=[-1.02,-.5,0,.5,1.0];
 xs.forEach((x,i)=>{const fg=new THREE.Group();fg.position.set(x,.55,0);root.add(fg);const segs=[];for(let j=0;j<3;j++){const m=new THREE.Mesh(new THREE.CapsuleGeometry(.19,.58,5,10),bone);m.position.y=.43+j*.7;fg.add(m);segs.push(m)}fingers.push({fg,segs})});
 const th=new THREE.Group();th.position.set(-1.42,-.35,.05);th.rotation.z=.72;root.add(th);for(let j=0;j<2;j++){const m=new THREE.Mesh(new THREE.CapsuleGeometry(.23,.62,5,10),bone);m.position.y=.42+j*.72;th.add(m)}
 const tendMat=new THREE.LineBasicMaterial({color:0x007c91});fingers.forEach((f)=>{const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-.1,.35),new THREE.Vector3(0,2.35,.35)]);f.fg.add(new THREE.Line(g,tendMat))});
 const marks=[];for(let i=0;i<3;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.11,10,8),contact);root.add(m);marks.push(m)}
 const large=new THREE.Mesh(new THREE.CylinderGeometry(.72,.72,2.7,28),new THREE.MeshStandardMaterial({color:0xc95d32,roughness:.45}));large.rotation.z=Math.PI/2;large.position.set(0,.2,1);root.add(large);const small=new THREE.Mesh(new THREE.SphereGeometry(.38,24,16),large.material);small.position.set(-.15,1.25,.8);root.add(small);
 function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==w||canvas.height!==h){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}}
 function draw(cfg){resize();const fine=isLive?cfg.independent:.12,opp=isLive?cfg.thumb:.12;th.rotation.z=.72+opp*.58;th.rotation.x=-opp*.3;fingers.forEach((f,i)=>{const central=1-Math.abs(i-2)/2;f.fg.rotation.x=-(cfg.task==='large'?.42:.12)-(fine*(cfg.task==='small'?central:.12));f.fg.rotation.z=(i-2)*(cfg.task==='large'?.08:.02)});large.visible=cfg.task==='large';small.visible=!large.visible;const target=large.visible?large:small;target.position.z=(large.visible?1:.8)+cfg.pull;marks.forEach((m,i)=>{m.visible=true;if(large.visible)m.position.set((i-1)*.72,.3,1.62+cfg.pull);else m.position.set(-.28+i*.18,1.25,.98+cfg.pull)});root.rotation.y=(isLive?.06:-.06);renderer.render(scene,camera)}
 return {draw,canvas};
}
const base=makeHand(document.getElementById('base3d'),false),live=makeHand(document.getElementById('live3d'),true);
function level(score){return score>.68?'稳定':score>.36?'勉强稳定':'易滑落'}function force(score){return score>.68?'较小':score>.36?'中等':'较大'}
function update(){state.task=task.value;state.thumb=Num.clamp(Num.finiteNumber(Number(thumb.value)/100,.35),0,1);state.independent=Num.clamp(Num.finiteNumber(Number(independent.value)/100,.35),0,1);const optimal=state.task==='large'?.58:.82;const control=(state.thumb+state.independent)/2;const penalty=Math.abs(control-optimal)*(state.task==='large'?1.35:.55);const liveScore=Num.clamp(.9-penalty-state.pull*.75,0,1),baseScore=state.task==='large'?.72:.18;document.getElementById('baseStable').textContent=level(baseScore);document.getElementById('baseForce').textContent=force(baseScore);document.getElementById('liveStable').textContent=level(liveScore);document.getElementById('liveForce').textContent=force(liveScore);base.draw(state);live.draw(state)}
[task,thumb,independent].forEach(el=>el.addEventListener('input',update));document.getElementById('reset').addEventListener('click',()=>{task.value='large';thumb.value='35';independent.value='35';state.pull=0;update()});
let dragging=false,startY=0;live.canvas.addEventListener('pointerdown',e=>{dragging=true;startY=e.clientY;live.canvas.setPointerCapture(e.pointerId)});live.canvas.addEventListener('pointermove',e=>{if(!dragging)return;state.pull=Num.clamp((startY-e.clientY)/180,0,.75);update()});live.canvas.addEventListener('pointerup',()=>dragging=false);Deck.onResize(update);update();
</script>
</body></html>
