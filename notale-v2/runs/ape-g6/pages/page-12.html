<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>身体不是一次性变成“现代”的</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{min-width:0}
    .lec-header__progress{-webkit-appearance:none;appearance:none;border:0;min-height:0;font-size:0;line-height:0;display:block}
    .page12{height:620px;display:flex;flex-direction:column;gap:12px;min-width:0}
    .instruction{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
    .mosaic.k-generalization{flex:1;grid-template-columns:minmax(0,3.45fr) minmax(270px,1fr);gap:24px;align-items:stretch;min-height:0}
    .mosaic.k-generalization>.supports{padding-left:20px;gap:0;min-height:0}
    .mosaic.k-generalization>.supports>.trunk{left:5px;top:54px;bottom:8px}
    .ledger-head,.trait-row{display:grid;grid-template-columns:154px repeat(4,minmax(0,1fr));min-width:0}
    .ledger-head{min-height:50px;border:1px solid var(--line);border-radius:var(--radius-sm) var(--radius-sm) 0 0;background:var(--surface-2)}
    .ledger-head>div{display:flex;align-items:center;padding:8px 10px;border-left:1px solid var(--line);font-size:var(--fs-label);font-weight:700;line-height:1.4}
    .ledger-head>div:first-child{border-left:0;color:var(--muted)}
    .trait-row.support{display:grid!important;padding:0!important;border-radius:0!important;border-top:0!important;min-height:68px;transition:background 160ms ease,opacity 160ms ease}
    .trait-row.support::before{width:15px!important}
    .trait-row:last-child{border-radius:0 0 var(--radius-sm) var(--radius-sm)!important}
    .trait-row:not(.is-open){opacity:.62;background:var(--surface-2)!important}
    .trait-label{display:flex;align-items:center;gap:10px;padding:9px 10px;font-size:var(--fs-sec);font-weight:700;line-height:1.35}
    .trait-label input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--accent)}
    .state-cell{display:flex;align-items:center;justify-content:center;min-width:0;padding:7px 8px;border-left:1px solid var(--line);font-size:var(--fs-sec);line-height:1.35;text-align:center;color:transparent;background:repeating-linear-gradient(135deg,transparent 0 7px,rgb(86 102 109 / 8%) 7px 9px)}
    .is-open .state-cell{color:var(--text)}
    .is-open .state-cell.ancestor{background:repeating-linear-gradient(135deg,#eef1f1 0 7px,#c7d0d1 7px 9px)}
    .is-open .state-cell.mixed{background:repeating-linear-gradient(45deg,#fbebd9 0 7px,#dfb779 7px 9px),repeating-linear-gradient(135deg,transparent 0 7px,rgb(201 93 50 / 20%) 7px 9px)}
    .is-open .state-cell.common{background-color:var(--accent-soft);background-image:radial-gradient(var(--accent) 1.2px,transparent 1.2px);background-size:9px 9px}
    .is-open .state-cell.uncertain{background:var(--surface);outline:2px dashed var(--line-strong);outline-offset:-5px}
    .mosaic.k-generalization>.claim{display:flex;flex-direction:column;gap:12px;padding:20px;border-left-width:8px;font-size:var(--fs-lead);line-height:var(--lh-copy);overflow:hidden}
    .claim-title{font-size:var(--fs-h2);line-height:1.35;color:var(--accent-strong)}
    .claim-main{font-weight:760}
    .evidence{display:flex;flex-direction:column;gap:7px;min-height:0;font-size:var(--fs-sec);font-weight:520;line-height:1.4}
    .evidence p{padding-top:7px;border-top:1px solid rgb(0 91 108 / 22%)}
    .empty{color:var(--muted);font-weight:520}
    .complete{margin-top:auto;padding-top:10px;border-top:2px solid var(--accent);font-size:var(--fs-sec);font-weight:760;line-height:1.4}
    .footline{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:58px}
    .legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:var(--fs-label);line-height:1.4}
    .key{display:inline-flex;align-items:center;gap:6px}.swatch{width:25px;height:17px;border:1px solid var(--line-strong)}
    .swatch.a{background:repeating-linear-gradient(135deg,#eef1f1 0 5px,#c7d0d1 5px 7px)}.swatch.m{background:repeating-linear-gradient(45deg,#fbebd9 0 5px,#dfb779 5px 7px)}.swatch.c{background-color:var(--accent-soft);background-image:radial-gradient(var(--accent) 1px,transparent 1px);background-size:7px 7px}.swatch.u{border:2px dashed var(--line-strong);background:var(--surface)}
    .counts{display:flex;gap:18px;white-space:nowrap;font-size:var(--fs-label);font-weight:700;color:var(--accent-strong)}
    .qualifier{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
    @media (prefers-reduced-motion:reduce){.trait-row{transition:none}}
  </style>
</head>
<body data-page="12" data-total="48">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
    Lec.mount({index:12,kicker:"MOSAIC EVOLUTION",title:"身体不是一次性变成“现代”的",take:"双足、手、脑、牙齿和成长节奏并未同步抵达现生智人的常见状态。"});
    Deck.init({index:12,total:48});
    const stage=document.getElementById("stage");
    const main=document.getElementById("main");
    const traits=[
      {id:"walk",name:"双足",states:[["过渡组合","mixed"],["惯常双足＋攀爬","mixed"],["地面组合改变","mixed"],["智人常见组合","common"]],support:"双足变化较早出现，但不是一次完成。",detail:["已有双足活动特征，仍保留较强攀爬能力。","惯常双足行走，同时保留攀爬相关上肢组合。","地面双足移动的身体组合进一步改变。","现生智人常见的骨盆、下肢与足部协同组合。"]},
      {id:"hand",name:"手",states:[["祖先性抓握","ancestor"],["攀爬＋精细操作","mixed"],["比例继续变化","mixed"],["智人常见组合","common"]],support:"手在继承结构上变化，没有统一换挡时刻。",detail:["继承灵长类抓握结构，精细控制不能由单一骨骼判断。","兼有攀爬相关特征与较精细操作的可能。","手指比例与控制继续变化，并非突然出现工具专用手。","现生智人常见的拇指、指端与精细控制组合。"]},
      {id:"brain",name:"脑",states:[["接近祖先范围","ancestor"],["双足已先变化","ancestor"],["长期不均匀变化","mixed"],["智人常见组合","common"]],support:"显著脑部变化晚于最早双足变化。",detail:["脑容量总体仍接近其他类人猿范围。","已惯常双足活动，脑并未同步达到智人常见状态。","脑容量与组织方式经历长期且不均匀的变化。","现生智人常见脑部组合；脑大小不等同于智力等级。"]},
      {id:"teeth",name:"牙齿",states:[["祖先性较多","ancestor"],["多种咀嚼组合","mixed"],["方向速度不一","mixed"],["智人常见组合","common"]],support:"牙齿和颌面不与脑或手同步变化。",detail:["犬齿与咀嚼结构已有变化，仍保留多种祖先性特征。","不同种类呈现不同牙齿、颌骨与咀嚼组合。","牙齿与面部继续变化，方向和速度并不完全一致。","现生智人常见的牙齿与颌面组合。"]},
      {id:"growth",name:"成长节奏",states:[["证据有限","uncertain"],["尚非完整智人模式","mixed"],["逐步改变","mixed"],["较长童年与依赖期","common"]],support:"较长成长与依赖期是逐步形成的。",detail:["证据有限，成年骨骼不足以还原完整成长过程。","牙齿发育提示尚非现生智人的完整模式。","童年长度与成熟速度逐步改变，仍有不确定性。","较长童年、较晚成熟和较长依赖期的常见组合。"]}
    ];
    const selected=new Set();
    main.innerHTML='<section class="page12"><p class="instruction">勾选身体特征，比较同一列中的状态；保留多行展开，观察它们是否同步。</p><div class="mosaic k-generalization"><div class="supports" id="ledger"><span class="trunk" aria-hidden="true"></span></div><aside class="claim" aria-live="polite"><div class="claim-title">镶嵌演化</div><p class="claim-main">所谓“现代身体”，是不同路径最后形成的特征组合。</p><div class="evidence" id="evidence"><p class="empty">勾选一项，支撑会沿主干汇入这里。</p></div><p class="complete" id="complete" hidden></p></aside></div><div class="footline"><div><div class="legend"><span class="key"><i class="swatch a"></i>祖先性较多</span><span class="key"><i class="swatch m"></i>过渡或混合</span><span class="key"><i class="swatch c"></i>智人常见组合</span><span class="key"><i class="swatch u"></i>证据有限</span></div><p class="qualifier">“现代状态”只指现生智人的常见组合，不表示更高级或预定终点。</p></div><div class="counts"><span id="viewed"></span><span id="same"></span></div></div></section>';
    const ledger=d3.select("#ledger");
    ledger.append("div").attr("class","ledger-head").selectAll("div").data(["镶嵌特征","较早人族","南方古猿","早期人属","智人"]).join("div").text(d=>d);
    const rows=ledger.selectAll(".trait-row").data(traits,d=>d.id).join("div").attr("class","trait-row support");
    const labels=rows.append("label").attr("class","trait-label");
    labels.append("input").attr("type","checkbox").attr("aria-label",d=>"展开"+d.name+"的阶段变化").on("change",function(event,d){this.checked?selected.add(d.id):selected.delete(d.id);update();});
    labels.append("span").text(d=>d.name);
    rows.each(function(d){d3.select(this).selectAll(".state-cell").data(d.states.map((s,i)=>({text:s[0],kind:s[1],detail:d.detail[i]}))).join("div").attr("class",s=>"state-cell "+s.kind).attr("title",s=>s.detail).text(s=>s.text);});
    function safeCount(value,max){return Lec.P.round(Lec.P.clamp(Lec.P.finiteNumber(value,0),0,max),0)}
    function update(){
      rows.classed("is-open",d=>selected.has(d.id)).attr("aria-expanded",d=>selected.has(d.id));
      const active=traits.filter(d=>selected.has(d.id));
      const evidence=d3.select("#evidence");
      evidence.selectAll("p").remove();
      evidence.selectAll("p").data(active).join("p").text(d=>d.name+"："+d.support);
      if(!active.length)evidence.append("p").attr("class","empty").text("勾选一项，支撑会沿主干汇入这里。");
      const sequences=traits.map(d=>d.states.map(s=>s[1]).join("|"));
      const sameCount=sequences.filter((s,i)=>sequences.indexOf(s)!==i).length;
      d3.select("#viewed").text("已查看 "+safeCount(selected.size,traits.length)+" / "+safeCount(traits.length,traits.length)+" 项");
      d3.select("#same").text("变化节奏相同："+safeCount(sameCount,traits.length)+" 项");
      const complete=document.getElementById("complete");
      complete.hidden=active.length!==traits.length;
      complete.textContent="没有两条路径构成完全同步的整套切换——这就是镶嵌演化。";
    }
    update();
  </script>
</body>
</html>
