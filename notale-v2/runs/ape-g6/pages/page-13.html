<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>身体给出可能，但不预写未来</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main { box-sizing: border-box; }
    .lec-header__progress {
      appearance: none;
      min-height: 0;
      padding: 0;
      border: 0;
      line-height: 0;
      overflow: visible;
    }
    .focus-concept {
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: var(--sp-5);
    }
    .concept-map.k-generalization {
      grid-template-columns: minmax(0, 1.05fr) minmax(300px, .78fr) minmax(0, .78fr);
      gap: var(--sp-6);
      width: 100%;
      min-height: 500px;
      box-sizing: border-box;
      padding: var(--sp-5) var(--sp-6);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgb(255 253 248 / 72%);
      align-items: center;
    }
    .concept-map.k-generalization > .supports {
      order: 1;
      padding-inline: 0 var(--sp-6);
    }
    .concept-map.k-generalization > .supports > .trunk {
      right: 8px;
      left: auto;
    }
    .concept-map.k-generalization > .supports > .support {
      padding: var(--sp-3) var(--sp-4);
      border-radius: var(--radius-sm);
    }
    .concept-map.k-generalization > .supports > .support::before {
      right: auto;
      left: 100%;
      width: var(--sp-5);
    }
    .support strong {
      display: block;
      margin-bottom: var(--sp-1);
      color: var(--text);
      font-size: var(--fs-body);
      line-height: 1.35;
    }
    .support span {
      color: var(--muted);
      font-size: var(--fs-sec);
      line-height: var(--lh-sec);
    }
    .concept-map.k-generalization > .claim {
      order: 2;
      padding: var(--sp-6) var(--sp-5);
      border-inline-start: 0;
      border-top: 8px solid var(--accent);
      border-radius: var(--radius-md);
      text-align: center;
      box-shadow: var(--shadow);
    }
    .claim .premise {
      display: block;
      color: var(--accent-strong);
      font-size: var(--fs-h2);
      line-height: 1.35;
    }
    .claim .neq {
      display: block;
      margin: var(--sp-2) 0;
      color: var(--warm);
      font-size: 54px;
      font-weight: 800;
      line-height: 1;
    }
    .claim .script {
      display: block;
      font-size: 28px;
      line-height: 1.25;
    }
    .futures {
      order: 3;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
      min-width: 0;
      padding-inline-start: 78px;
    }
    .broken-link {
      position: absolute;
      top: 50%;
      left: 0;
      width: 54px;
      border-top: 4px dotted var(--line-strong);
    }
    .broken-link::after {
      content: "";
      position: absolute;
      top: -4px;
      left: 24px;
      width: 14px;
      height: 8px;
      background: var(--bg);
    }
    .gap-label {
      position: absolute;
      top: calc(50% + 14px);
      left: -6px;
      width: 70px;
      color: var(--warm);
      font-size: var(--fs-label);
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
    }
    .future {
      padding: var(--sp-3) var(--sp-5);
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-size: var(--fs-h2);
      font-weight: 720;
      line-height: 1.35;
      text-align: center;
    }
    .future-note {
      color: var(--muted);
      font-size: var(--fs-sec);
      line-height: var(--lh-sec);
      text-align: center;
    }
    .bottom-line {
      align-self: center;
      padding-inline-start: var(--sp-4);
      border-inline-start: 4px solid var(--warm);
      font-size: var(--fs-lead);
      font-weight: 650;
      line-height: var(--lh-copy);
    }
  </style>
</head>
<body data-page="13" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="focus-concept" aria-label="身体能力与历史结果的关系">
        <div class="concept-map k-generalization">
          <div class="supports min0" aria-label="身体演化形成能力条件的四条支撑">
            <span class="trunk" aria-hidden="true"></span>
            <div class="support"><strong>结构来自继承与改造</strong><span>身体在既有灵长类结构上逐步变化。</span></div>
            <div class="support"><strong>能力依赖协同与代价</strong><span>行走、操控和大脑活动都受身体约束。</span></div>
            <div class="support"><strong>特征以镶嵌方式出现</strong><span>不同特征并未同步抵达“现代状态”。</span></div>
            <div class="support"><strong>能力只限定可能范围</strong><span>能精细操作、学习和协作，只是条件。</span></div>
          </div>

          <div class="claim min0" aria-label="可能条件不等于历史剧本">
            <span class="premise">可能条件</span>
            <span class="neq" aria-hidden="true">≠</span>
            <span class="script">历史剧本</span>
          </div>

          <div class="futures min0" aria-label="未被身体预写的历史结果">
            <span class="broken-link" aria-hidden="true"></span>
            <span class="gap-label">还需要解释</span>
            <div class="future">石器</div>
            <div class="future">城市</div>
            <div class="future">火箭</div>
            <p class="future-note">不是身体自动生成的下一步</p>
          </div>
        </div>
        <p class="bottom-line">能做某事，不等于历史必然会走到那里。</p>
      </section>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 13,
      kicker: "BODY ≠ DESTINY",
      title: "身体给出可能，但不预写未来",
      take: "身体演化提供了可能性，但没有预写石器、城市或火箭。"
    });
    Deck.init({ index: 13, total: 48 });
  </script>
</body>
</html>
