<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一片石刃怎样被敲出来</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lesson{height:620px;display:flex;flex-direction:column;gap:12px;}
  .topline{display:flex;align-items:center;justify-content:space-between;gap:24px;}
  .age{flex:0 0 auto;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:var(--fs-label);line-height:1.4;}
  .work{display:flex;gap:20px;flex:1;min-height:0;}
  .steps{flex:0 0 210px;gap:8px;--process-axis-y:50%;}
  .steps.k-process.is-vertical{gap:8px;}
  .steps.k-process.is-vertical>.step{flex:0 0 auto;padding:9px 10px 9px 52px;border-width:1px;font-size:var(--fs-label);font-weight:680;line-height:1.4;}
  .steps.k-process.is-vertical>.axis{left:24px;top:18px;bottom:18px;width:3px;}
  .steps.k-process.is-vertical>.arw{left:24px;width:24px;transform:translate(-50%,-20px);font-size:18px;}
  .steps .return{margin-top:1px;padding-left:50px;color:var(--warm);font-size:var(--fs-label);line-height:1.4;}
  .sim{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;border:1px solid var(--line-strong);border-radius:var(--radius-lg);background:linear-gradient(180deg,#edf2f1 0%,#ddd5c5 72%,#c8b99c 100%);box-shadow:var(--shadow);}
  #simCanvas{z-index:1;touch-action:none;cursor:crosshair;}
  .scene-label{position:absolute;z-index:2;padding:4px 8px;border-radius:5px;background:rgb(255 253 248 / 88%);color:var(--text);font-size:var(--fs-label);font-weight:650;line-height:1.4;pointer-events:none;}
  .lab-platform{left:36%;top:25%;}.lab-convex{left:55%;top:55%;}.lab-edge{left:37%;top:72%;}
  .guide{position:absolute;z-index:3;top:14px;left:16px;max-width:560px;padding:8px 12px;border-radius:8px;background:rgb(16 43 52 / 90%);color:#fff;font-size:var(--fs-sec);line-height:1.45;}
  .result{position:absolute;z-index:3;right:16px;bottom:16px;width:380px;padding:14px 16px;border:1px solid var(--line-strong);border-radius:12px;background:rgb(255 253 248 / 94%);box-shadow:var(--shadow);}
  .result strong{display:block;margin-bottom:4px;color:var(--accent-strong);font-size:var(--fs-h2);line-height:1.35;}
  .result p{font-size:var(--fs-sec);line-height:1.45;}
  .controls{display:flex;align-items:center;gap:12px;min-height:44px;}
  .platforms{display:flex;align-items:center;gap:8px;}
  .platforms span{font-size:var(--fs-label);font-weight:650;}
  .platforms button,.reset{min-height:42px;padding:7px 14px;border:1px solid var(--accent-strong);border-radius:8px;background:var(--surface);color:var(--text);font:650 var(--fs-label)/1.4 var(--font-sans);cursor:pointer;}
  .platforms button[aria-pressed="true"]{background:var(--accent);color:#fff;}
  .reset{margin-left:auto;background:var(--accent);color:#fff;}
  .model-note{font-size:var(--fs-sec);line-height:1.45;color:var(--muted);}
  button:focus-visible,#simCanvas:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
  progress.lec-header__progress{-webkit-appearance:none;appearance:none;display:block;padding:0;border:0;line-height:0;}
  progress.lec-header__progress::-webkit-progress-bar{height:5px;background:var(--surface-3);}
</style>
</head>
<body data-page="14" data-total="48">
<div id="stage"><main id="main"></main></div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script>
Lec.mount({index:14,kicker:"CULTURE · MAKING",title:"一片石刃怎样被敲出来",take:"石器制造是材料怎样断、手怎样击打、制作者想得到什么三者共同作用的过程。"});
Deck.init({index:14,total:48});
const main=document.getElementById('main');
const earliest=Lec.P.round(Lec.P.finiteNumber(3.3e6,3300000)/10000,0);
main.innerHTML=`<section class="lesson">
  <div class="topline"><p class="lead">先预想刃缘，再让动作顺着材料结构发生。</p><span class="age">目前已知最早石器约${earliest}万年前</span></div>
  <div class="work">
    <div class="k-process is-vertical steps min0" aria-label="制造过程">
      <div class="axis"></div>
      ${['观察石核','选择台面','指定剥片目标','控制击打','石片脱离','检视并修正'].map((s,i)=>`<div class="step${i===0?' is-current':''}" data-step="${i}">${s}</div>${i<5?'<div class="arw"></div>':''}`).join('')}
      <div class="return">失败 ↶ 回到观察石核</div>
    </div>
    <div class="sim min0 no-pan">
      <canvas id="simCanvas" class="cv-fill" tabindex="0" role="application" aria-label="石核敲击台。选择台面后，在石核上拖出目标，再拖动锤石并释放；键盘可用方向键蓄势、回车击打。"></canvas>
      <div class="guide" id="guide">观察边缘、台面与凸面，再选择受击台面。</div>
      <span class="scene-label lab-platform">平整台面</span><span class="scene-label lab-convex">凸面</span><span class="scene-label lab-edge">可剥离边缘</span>
      <div class="result" aria-live="polite"><strong id="status">等待观察</strong><p id="feedback">裂纹需要从边缘获得向内扩展的空间。</p></div>
    </div>
  </div>
  <div class="controls">
    <div class="platforms" role="group" aria-label="选择受击台面"><span>选择台面</span><button data-p="0" aria-pressed="false">左缘</button><button data-p="1" aria-pressed="false">中缘</button><button data-p="2" aria-pressed="false">右缘</button></div>
    <p class="model-note">课堂简化模型：用于比较落点、方向与力度的联合作用。</p>
    <button class="reset" id="reset">重置同一石核</button>
  </div>
</section>`;
const cv=document.getElementById('simCanvas'), sim=cv.parentElement, statusEl=document.getElementById('status'), feedback=document.getElementById('feedback'), guide=document.getElementById('guide');
const steps=[...main.querySelectorAll('[data-step]')];
const cfg={gravity:Lec.P.clamp(Lec.P.finiteNumber(0.72,0.72),0.2,1.2),hammerRadius:Lec.P.clamp(Lec.P.finiteNumber(34,34),24,45),powerRef:Lec.P.clamp(Lec.P.finiteNumber(13,13),8,20)};
let engine,hammer,ground,ctx,W,H,platform=-1,target=null,dragMode='',dragStart=null,aim={x:-145,y:-105},result=null,contact=null,step=0,animStop=null;
function setStep(n){step=n;steps.forEach((el,i)=>{el.classList.toggle('is-current',i===n);el.classList.toggle('is-done',i<n);});}
function setup(){ctx=Deck.fit(cv);W=cv.offsetWidth;H=cv.offsetHeight;engine=Matter.Engine.create();engine.gravity.y=cfg.gravity;hammer=Matter.Bodies.circle(W*.79,H*.2,cfg.hammerRadius,{restitution:.42,friction:.55,density:.004,label:'hammer'});ground=Matter.Bodies.rectangle(W/2,H+24,W,50,{isStatic:true});Matter.Composite.add(engine.world,[hammer,ground]);}
function coreGeom(){return {x:W*.48,y:H*.61,w:410,h:235};}
function platPoint(){const g=coreGeom(),xs=[g.x-g.w*.36,g.x-g.w*.08,g.x+g.w*.25];return {x:xs[Math.max(0,platform)],y:g.y-g.h*.36};}
function draw(){ctx=Deck.fit(cv);W=cv.offsetWidth;H=cv.offsetHeight;const g=coreGeom();ctx.clearRect(0,0,W,H);
 ctx.save();ctx.translate(g.x,g.y);ctx.beginPath();ctx.moveTo(-g.w*.48,g.h*.32);ctx.quadraticCurveTo(-g.w*.53,-g.h*.15,-g.w*.3,-g.h*.4);ctx.quadraticCurveTo(0,-g.h*.55,g.w*.38,-g.h*.32);ctx.quadraticCurveTo(g.w*.55,0,g.w*.42,g.h*.35);ctx.closePath();ctx.fillStyle='#71685d';ctx.fill();ctx.strokeStyle='#3f4748';ctx.lineWidth=5;ctx.stroke();ctx.beginPath();ctx.ellipse(28,-15,145,74,-.12,0,Math.PI*2);ctx.strokeStyle='#a99c86';ctx.lineWidth=3;ctx.stroke();ctx.restore();
 const ps=[0,1,2].map(i=>{const old=platform;platform=i;const p=platPoint();platform=old;return p;});ps.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x,p.y,15,0,Math.PI*2);ctx.fillStyle=i===platform?'#007c91':'#fffdf8';ctx.fill();ctx.strokeStyle='#005b6c';ctx.lineWidth=3;ctx.stroke();});
 if(target){const p=platPoint();ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(target.x,target.y-34);ctx.lineTo(target.x+72,target.y+18);ctx.closePath();ctx.fillStyle='rgba(0,124,145,.20)';ctx.fill();ctx.setLineDash([9,7]);ctx.strokeStyle='#007c91';ctx.lineWidth=4;ctx.stroke();ctx.setLineDash([]);}
 if(contact){ctx.beginPath();ctx.arc(contact.x,contact.y,10,0,Math.PI*2);ctx.fillStyle='#c95d32';ctx.fill();}
 if(result&&result.pieces){result.pieces.forEach((q,i)=>{ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r||0);ctx.beginPath();ctx.moveTo(-45,-20);ctx.lineTo(45,-12);ctx.lineTo(28,30);ctx.lineTo(-38,20);ctx.closePath();ctx.fillStyle=i?'#9b8770':'#d6c5a8';ctx.fill();ctx.strokeStyle='#4d4540';ctx.lineWidth=3;ctx.stroke();ctx.restore();});}
 ctx.beginPath();ctx.arc(hammer.position.x,hammer.position.y,cfg.hammerRadius,0,Math.PI*2);ctx.fillStyle='#303b40';ctx.fill();ctx.strokeStyle='#fffdf8';ctx.lineWidth=4;ctx.stroke();
 if(dragMode==='hammer'||step===3){ctx.beginPath();ctx.moveTo(hammer.position.x,hammer.position.y);const p=platPoint();ctx.lineTo(p.x,p.y);ctx.strokeStyle='#c95d32';ctx.lineWidth=4;ctx.stroke();Deck.arrow(ctx,hammer.position.x,hammer.position.y,p.x,p.y,12);}}
function reset(){if(animStop){animStop();animStop=null;}platform=-1;target=null;result=null;contact=null;dragMode='';aim={x:-145,y:-105};setup();setStep(0);statusEl.textContent='等待观察';feedback.textContent='裂纹需要从边缘获得向内扩展的空间。';guide.textContent='观察边缘、台面与凸面，再选择受击台面。';main.querySelectorAll('[data-p]').forEach(b=>b.setAttribute('aria-pressed','false'));draw();}
main.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{platform=Number(b.dataset.p);main.querySelectorAll('[data-p]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));target=null;setStep(2);statusEl.textContent='台面已选';feedback.textContent='从亮起的台面向石核内部拖出目标刃缘。';guide.textContent='在石核上拖动，指定希望剥下的连续薄片。';draw();}));
function hitHammer(p){return Math.hypot(p.x-hammer.position.x,p.y-hammer.position.y)<cfg.hammerRadius+18;}
cv.addEventListener('pointerdown',e=>{const p=Deck.pt(cv,e);if(platform<0)return;if(hitHammer(p)&&target){dragMode='hammer';dragStart=p;cv.setPointerCapture(e.pointerId);setStep(3);}else if(step===2){dragMode='target';dragStart=platPoint();target=p;cv.setPointerCapture(e.pointerId);draw();}});
cv.addEventListener('pointermove',e=>{if(!dragMode)return;const p=Deck.pt(cv,e);if(dragMode==='target')target=p;else Matter.Body.setPosition(hammer,p);draw();});
cv.addEventListener('pointerup',e=>{if(dragMode==='target'){dragMode='';setStep(3);guide.textContent='拖动锤石形成击打方向；离目标越远，击打越强。';draw();}else if(dragMode==='hammer'){const p=Deck.pt(cv,e);dragMode='';strike(p);}});
function strike(release){const pp=platPoint(),dx=pp.x-release.x,dy=pp.y-release.y,mag=Math.hypot(dx,dy)||1;Matter.Body.setVelocity(hammer,{x:dx/mag*Math.min(18,mag/12),y:dy/mag*Math.min(18,mag/12)});setStep(4);guide.textContent='比较目标轮廓、接触点与实际脱落形状。';let elapsed=0,hit=false;animStop=Deck.loop((t,dt)=>{Matter.Engine.update(engine,Math.min(24,dt||16));elapsed+=dt||16;if(!hit&&Math.hypot(hammer.position.x-pp.x,hammer.position.y-pp.y)<cfg.hammerRadius+35){hit=true;contact={x:pp.x,y:pp.y};classify(mag,release,pp);}draw();if(elapsed>1450){animStop();animStop=null;if(!hit)classify(mag,release,pp);setStep(5);draw();}},{still:900});}
function classify(power,release,pp){const inward=(pp.x-release.x)>25;let kind,advice,pieces=[];if(power<110){kind='未剥离';advice='增强这次击打。';}else if(!inward){kind='擦过边缘';advice='让击打方向更进入石核。';}else if(platform===1){kind='局部压碎';advice='落点再靠近可剥离边缘。';pieces=[{x:pp.x+18,y:pp.y+34,r:.2}];}else if(power>255){kind='过度破碎';advice='减弱这次击打。';pieces=[{x:pp.x+70,y:pp.y+90,r:.4},{x:pp.x+125,y:pp.y+120,r:-.3}];}else{kind='连续剥片';advice='目标与实际刃缘接近，可以比较两者。';pieces=[{x:target?target.x+35:pp.x+100,y:target?target.y+45:pp.y+110,r:.18}];}result={kind,pieces};statusEl.textContent=kind;feedback.textContent=advice;}
cv.addEventListener('keydown',e=>{if(platform<0||!target)return;const d=12;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft')aim.x-=d;if(e.key==='ArrowRight')aim.x+=d;if(e.key==='ArrowUp')aim.y-=d;if(e.key==='ArrowDown')aim.y+=d;const pp=platPoint();Matter.Body.setPosition(hammer,{x:pp.x+aim.x,y:pp.y+aim.y});setStep(3);draw();}if(e.key==='Enter'||e.key===' '){e.preventDefault();strike({x:hammer.position.x,y:hammer.position.y});}});
document.getElementById('reset').addEventListener('click',reset);Deck.onResize(reset);reset();
</script>
</body>
</html>
