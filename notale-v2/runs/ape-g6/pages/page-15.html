const main=document.getElementById('main'); main.className='trace-lab'; main.innerHTML=`

 <div class="case-copy"><div class="progress" id="progress"></div><h2 id="caseName"></h2><p class="lead" id="ask"></p><p class="instruction sec">拖入最能被当前证据支持的解释。键盘：← → 选择，Enter 提交。</p><div id="feedback" class="feedback" aria-live="polite">先描述看见了什么，再作推断。</div></div></section>

  <div class="box drop" data-choice="worked" tabindex="0"><span class="bt">有意加工</span><ul><li>打击平台与受力起点</li><li>成组、有方向的剥片疤</li></ul></div>
 </div><div class="defer drop" data-choice="defer" tabindex="0">证据不足，暂缓判断</div></div></div></section>

const specimen=document.getElementById('specimen'), photo=document.getElementById('photo'), feedback=document.getElementById('feedback');
const drops=[...document.querySelectorAll('.drop')]; let selected=0;
function safeIndex(){const n=Lec.P.finiteNumber(state.index,0);return Lec.P.clamp(n,0,traceCases.length-1)}
function render(){state.index=safeIndex();const c=traceCases[state.index];photo.src=c.img;photo.title=c.title;document.getElementById('caseName').textContent=c.name;document.getElementById('ask').textContent=c.ask;document.getElementById('progress').textContent=`判读 ${Lec.P.round(state.index+1,0)} / ${Lec.P.round(traceCases.length,0)}`;specimen.classList.toggle('is-local',state.view==='local');document.getElementById('viewBadge').textContent=state.view==='local'?'边缘局部':'整体照';document.getElementById('view').textContent=state.view==='local'?'返回整体照':'切换局部照';specimen.classList.remove('revealed');drops.forEach(x=>x.classList.remove('is-target'));}
function choose(choice){const c=traceCases[state.index];if(choice!==c.answer){feedback.innerHTML=`<strong>再检查：</strong>${c.focus}`;return;}specimen.classList.add('revealed');state.answered.push(choice);feedback.innerHTML=`<strong>观察 → 推断：</strong>${c.why}`;if(state.index<traceCases.length-1){setTimeout(()=>{state.index++;state.view='whole';feedback.textContent='已记录。继续判读下一件标本。';render()},Deck.reduced()?0:700)}else{feedback.classList.add('done');feedback.innerHTML='<strong>题组完成：</strong>你坚持了先观察、后推断，并在材料不足时保留判断。';}}
specimen.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain','specimen'));
drops.forEach(d=>{d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('is-target')});d.addEventListener('dragleave',()=>d.classList.remove('is-target'));d.addEventListener('drop',e=>{e.preventDefault();choose(d.dataset.choice)});d.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(d.dataset.choice)}})});
specimen.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();selected=(selected+(e.key==='ArrowRight'?1:3))%4;drops.forEach((d,i)=>d.classList.toggle('is-target',i===selected));feedback.textContent=`已选择：${drops[selected].textContent.trim().split('\n')[0]}。按 Enter 提交。`}if(e.key==='Enter'){e.preventDefault();choose(drops[selected].dataset.choice)}});
document.getElementById('view').onclick=()=>{state.view=state.view==='whole'?'local':'whole';render()};document.getElementById('reset').onclick=()=>{state={index:0,answered:[],view:'whole'};feedback.classList.remove('done');feedback.textContent='先描述看见了什么，再作推断。';render()};render();
