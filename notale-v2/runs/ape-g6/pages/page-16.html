<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>你能让一堆篝火安全地烧过一夜吗？</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#main{box-sizing:border-box}.lec-header__progress{appearance:none;border:0;font-size:0;line-height:0}.fire-page{height:100%;display:flex;flex-direction:column;gap:12px}.k-process{height:66px;gap:18px;--process-axis-y:50%}.k-process>.step{padding:9px 8px;text-align:center;font-size:15px;line-height:1.4;display:flex;align-items:center;justify-content:center}.k-process>.arw{width:18px;transform:translate(-18px,-50%)}
.game{flex:1;display:flex;gap:16px;min-height:0}.actions{width:235px;padding:18px;display:flex;flex-direction:column;gap:14px}.actions h2{font-size:20px}.scene{position:relative;flex:1;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-lg);background:#182125}.scene canvas{display:block;width:100%;height:100%}.scene-label{position:absolute;left:18px;bottom:14px;color:#fff;font-size:15px;background:rgb(11 14 20 / 72%);padding:6px 10px;border-radius:8px}.phase{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:28px;color:#fff;font-size:15px;background:rgb(11 14 20 / 68%);padding:7px 14px;border-radius:99px}.phase b{color:#ffd09c}.meters{width:230px;padding:18px;display:flex;flex-direction:column;gap:17px}.meter label{display:flex;justify-content:space-between;font-size:15px;font-weight:650}.track{height:14px;margin-top:7px;border:1px solid var(--line-strong);border-radius:99px;overflow:hidden;background:var(--surface-2)}.fill{height:100%;width:30%;background:var(--accent);transition:width .25s}.risk .fill{background:var(--warm)}select,.action-btn{width:100%;min-height:44px;font:inherit;font-size:16px;border-radius:8px}.action-btn{border:1px solid var(--accent-strong);background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.action-btn:disabled{background:var(--surface-3);color:var(--muted);border-color:var(--line)}select{padding:6px;border:1px solid var(--line-strong);background:#fff}.hint{font-size:16px;line-height:1.45;color:var(--muted)}.status{font-size:18px;line-height:1.45;font-weight:650}.evidence{display:none;gap:12px}.evidence.show{display:flex;flex-direction:column}.evidence p{font-size:16px;line-height:1.45}.era{font-size:16px;line-height:1.45;border-left:3px solid var(--warm);padding-left:10px;margin-top:auto}
</style>
</head>
<body data-page="16" data-total="48">
<div id="stage"><main id="main"></main></div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/pixi.min.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
Lec.mount({index:16,kicker:"CONTROLLED FIRE",title:"你能让一堆篝火安全地烧过一夜吗？",take:"控火是选址、供料、调节与收火的持续管理；烧过不等于已证明人为控火。"});
Deck.init({index:16,total:48});
const main=document.getElementById('main');
main.innerHTML=`<section class="fire-page"><div class="k-process" aria-label="控火到考古判断的六步过程"><div class="axis"></div>${['选择火位','点燃引火物','添加燃料','调节火势','安全收火','检查遗迹'].map((x,i)=>`<div class="step ${i===0?'is-current':''}" data-step="${i}">${x}</div>${i<5?'<span class="arw"></span>':''}`).join('')}</div><div class="game"><section class="actions panel min0"><h2 id="actionTitle">先选火位</h2><p class="hint" id="hint">选择位置，比较使用便利与蔓延风险。</p><div class="ctl"><select id="choice" aria-label="当前步骤的选择"></select></div><button class="action-btn" id="act">确认火位</button><p class="status" id="status" aria-live="polite">火还没有点燃。</p><p class="era">约100万年前范围内已有受讨论的早期证据；早期证据存在争议，这不是确定起点。</p></section><figure class="scene min0" aria-labelledby="sceneCap"><div id="pixi"></div><div class="phase"><span>入夜</span><b id="phaseNow">准备</b><span>天明</span></div><figcaption class="scene-label" id="sceneCap">火位、燃料与风共同改变火势和风险。</figcaption></figure><aside class="meters panel min0"><div id="meterBox"><div class="meter"><label>火势 <span id="fireWord">无</span></label><div class="track"><div class="fill" id="fireFill"></div></div></div><div class="meter"><label>可用燃料 <span id="fuelWord">充足</span></label><div class="track"><div class="fill" id="fuelFill"></div></div></div><div class="meter risk"><label>失控风险 <span id="riskWord">低</span></label><div class="track"><div class="fill" id="riskFill"></div></div></div></div><div class="evidence" id="evidence"><h2 id="evTitle">遗迹判断</h2><p><b>现象：</b><span id="phen"></span></p><p><b>可能解释：</b><span id="interp"></span></p><p><b>证据限制：</b>自然火、搬运与后期扰动也可能留下相似痕迹。</p><button class="action-btn" id="again">重置本局</button><button class="action-btn" id="newset">换一组保存状况</button></div></aside></div></section>`;
const steps=[...main.querySelectorAll('.step')], choice=document.getElementById('choice'), act=document.getElementById('act');
const clamp=v=>Lec.P.clamp(Lec.P.finiteNumber(v,0),0,1); let group=0,rng,state;
function fresh(seed){rng=new Math.seedrandom(seed);return {step:0,fire:0,fuel:.82,risk:.08,stable:false,failed:false,site:0,trace:[],disturb:rng()};}
function opts(items){choice.innerHTML=items.map((x,i)=>`<option value="${i}">${x}</option>`).join('');}
function setup(){state=fresh('apeman-spaceman-p16'+(group?'-'+group:''));opts(['靠近活动区','靠近可燃物','相对隔离']);render();}
const configs=[['先选火位','选择位置，比较使用便利与蔓延风险。','确认火位'],['点燃引火物','按住按钮，让冒烟转为稳定燃烧。','按住点燃'],['添加燃料','细燃料接火快；粗燃料维持久。','加入燃料'],['调节火势','根据风势整理或压低火堆。','执行调节'],['安全收火','停止加料，把残余火势压入安全状态。','执行收火']];
function words(v){return v<.18?'低':v<.62?'适中':'高'}
function render(){steps.forEach((el,i)=>el.className='step '+(i<state.step?'is-done':i===state.step?'is-current':''));let c=configs[Math.min(state.step,4)];document.getElementById('actionTitle').textContent=c[0];document.getElementById('hint').textContent=c[1];act.textContent=c[2];document.getElementById('phaseNow').textContent=['准备','入夜','深夜','深夜','近天明','遗迹'][state.step];[['fire',state.fire],['fuel',state.fuel],['risk',state.risk]].forEach(([k,v])=>document.getElementById(k+'Fill').style.width=(clamp(v)*100)+'%');document.getElementById('fireWord').textContent=state.fire<.05?'无':words(state.fire);document.getElementById('fuelWord').textContent=state.fuel<.25?'少':state.fuel<.6?'适中':'充足';document.getElementById('riskWord').textContent=words(state.risk);drawScene();}
function advance(){let v=Number(choice.value);if(state.step===0){state.site=v;state.risk=clamp([.3,.52,.12][v]+rng()*.08);opts(['短按：火焰未稳','适时松开','持续过久：火星增多']);}
else if(state.step===1){state.fire=[.12,.48,.78][v];state.risk=clamp(state.risk+(v===2?.2:0));state.stable=v===1;opts(['细燃料：接火快','粗燃料：维持久','一次加入过多']);}
else if(state.step===2){state.fire=clamp(state.fire+[.28,.18,-.12][v]);state.fuel=clamp(state.fuel-[.24,.14,.32][v]);state.risk=clamp(state.risk+[.2,.04,.12][v]);opts(['整理燃料','压低火势','暂不处理']);}
else if(state.step===3){let wind=.12+rng()*.22;state.fire=clamp(state.fire+[.12,-.2,-.25][v]);state.risk=clamp(state.risk+wind+[.04,-.18,.12][v]);opts(['摊开余烬','覆盖火堆','放任燃烧']);}
else if(state.step===4){state.fire=clamp(state.fire-[.48,.65,.05][v]);state.risk=clamp(state.risk-[.32,.48,-.02][v]);state.failed=!state.stable||state.risk>.72||state.fire>.3;state.step=5;finish();return;}state.step++;document.getElementById('status').textContent=state.risk>.7?'风险很高：火星正越过火位边界。':state.fire<.16&&state.step>1?'火势过弱，夜间用途已经停止。':'火势仍在可管理范围。';render();}
function finish(){choice.parentElement.style.display='none';act.style.display='none';document.getElementById('meterBox').style.display='none';document.getElementById('evidence').classList.add('show');let strong=!state.failed&&state.disturb>.35;document.getElementById('evTitle').textContent=strong?'较支持人为使用':'只能确认燃烧';document.getElementById('phen').textContent=strong?'集中灰烬、受热材料与局部烧灼相互吻合。':'留下受热痕迹，但原始位置或管理过程不清楚。';document.getElementById('interp').textContent=strong?'痕迹组合支持局部、受管理的燃烧。':'这里曾燃烧；是否人为控制仍不确定。';document.getElementById('status').textContent=state.failed?'这一夜没有同时守住火势、安全与收火。':'你守住了火；但一次成功模拟不是历史证明。';render();}
act.addEventListener('pointerdown',()=>{if(state.step===1)act.textContent='保持…'});act.addEventListener('pointerup',advance);act.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();advance();}});
function restart(newGroup){if(newGroup)group++;document.getElementById('evidence').classList.remove('show');document.getElementById('meterBox').style.display='block';choice.parentElement.style.display='flex';act.style.display='block';setup();}document.getElementById('again').onclick=()=>restart(false);document.getElementById('newset').onclick=()=>restart(true);
const host=document.getElementById('pixi'), app=new PIXI.Application({width:880,height:450,backgroundColor:0x182125,antialias:true,autoStart:false});host.appendChild(app.view);app.view.style.width='100%';app.view.style.height='100%';const g=new PIXI.Graphics(), particles=new PIXI.Container();app.stage.addChild(g,particles);let motes=[];for(let i=0;i<80;i++){let s=new PIXI.Graphics();s.beginFill(i%3?0xff9d42:0xd8d1c4).drawCircle(0,0,2+(i%3)).endFill();particles.addChild(s);motes.push({s,x:440,y:330,dx:(rng?.()||.5)-.5,dy:-1-(i%5)/4,life:i/80});}
function drawScene(){g.clear();g.beginFill(0x39433b).drawRect(0,0,880,450).endFill();g.beginFill(0x242b26).drawEllipse(440,356,480,115).endFill();let glow=state.step===5?0:state.fire;g.beginFill(0xffa13a,.12+glow*.22).drawCircle(440,310,85+glow*80).endFill();g.beginFill(0x482d22).drawEllipse(440,350,150,42).endFill();for(let i=0;i<6;i++){g.lineStyle(14,0x593b28).moveTo(380+i*18,350).lineTo(470+i*8,318)}if(state.step!==5&&state.fire>.04){g.beginFill(0xffc15a).drawPolygon([405,337,425,230-state.fire*80,447,338]).endFill();g.beginFill(0xf36b2e).drawPolygon([438,340,462,250-state.fire*55,480,340]).endFill();}else if(state.step===5){g.beginFill(0xb9b1a2,.75).drawEllipse(440,346,130,30).endFill();}}
Deck.loop((t,dt)=>{if(!Deck.reduced()&&state.step>0&&state.step<5){motes.forEach((m,i)=>{m.life-=dt*.00022*(.3+state.fire);if(m.life<=0){m.life=1;m.x=430+rng()*30;m.y=315;m.dx=(rng()-.5)*(1+state.risk*3);m.dy=-.7-rng()*1.4;}m.x+=m.dx*dt*.05;m.y+=m.dy*dt*.05;m.s.position.set(m.x,m.y);m.s.alpha=m.life*state.fire;});}else particles.visible=false;particles.visible=!Deck.reduced()&&state.step<5;app.renderer.render(app.stage);},{still:1});
setup();
</script>
</body></html>
