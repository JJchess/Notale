<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>传着传着，步骤去哪了？</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#main{height:auto}.relay-page{height:100%;display:flex;flex-direction:column;gap:16px}.topline{display:flex;align-items:center;justify-content:space-between;gap:24px}.instruction{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}.status{font-size:var(--fs-body);font-weight:720;color:var(--accent-strong);white-space:nowrap}.relay-track{height:206px;--process-axis-y:48%;gap:38px}.relay-track>.step{padding:14px;display:flex;flex-direction:column;gap:10px}.relay-track>.arw{width:38px;transform:translate(-38px,-50%)}.step-head{display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-label);font-weight:720}.mini-seq,.sequence{display:flex;gap:6px;align-items:center}.mini-seq{flex-wrap:wrap}.glyph{display:flex;align-items:center;justify-content:center;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--accent-strong);font-weight:760;line-height:1;user-select:none}.mini-seq .glyph{width:34px;height:34px;font-size:22px}.empty-glyph{border-style:dashed;color:var(--line-strong)}.handoff{position:absolute;top:156px;left:0;right:0;text-align:center;font-size:14px;line-height:1.4;color:var(--muted)}.workbench{position:relative;display:flex;gap:18px;min-height:282px;padding:18px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow)}.bench-side{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:12px}.bench-side.options-side{flex:.78 1 0}.bench-title{font-size:var(--fs-h2);line-height:1.35}.slots,.options{display:flex;gap:9px;flex-wrap:wrap}.slot,.option{width:68px;height:68px;border:2px dashed var(--line-strong);border-radius:10px;background:var(--surface-2);font-size:32px;color:var(--accent-strong);font-weight:760;cursor:pointer}.slot.filled{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}.option{border-style:solid;background:var(--surface)}.option:disabled{opacity:.35;cursor:not-allowed}.actions{display:flex;align-items:center;gap:12px;margin-top:auto}.btn.secondary{background:var(--surface);color:var(--accent-strong)}.btn{font-size:16px}.watch{display:flex;gap:10px}.watch .glyph{width:62px;height:62px;font-size:30px}.mask{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-md);background:rgb(24 33 43 / 92%);color:white}.count{font-size:64px;font-weight:780;line-height:1}.mask-note{font-size:var(--fs-body);line-height:1.5}.result{display:none;min-height:282px;padding:18px;border:2px solid var(--accent);border-radius:var(--radius-md);background:var(--surface)}.result.show{display:flex;gap:24px}.compare{flex:1;min-width:0}.compare-row{display:flex;align-items:center;gap:8px;margin-top:10px}.compare-label{width:62px;font-size:var(--fs-label);font-weight:700}.compare-row .glyph{width:54px;height:54px;font-size:28px}.compare-row.final .glyph.keep{background:var(--success-soft);border-color:var(--success)}.compare-row.final .glyph.changed{background:var(--warm-soft);border-color:var(--warm)}.summary{width:330px;display:flex;flex-direction:column;gap:10px}.metric{font-size:var(--fs-h2);font-weight:750;color:var(--accent-strong)}.verdict{font-size:var(--fs-body);line-height:1.5;font-weight:650}.legend{font-size:var(--fs-label);line-height:1.45;color:var(--muted)}.mini-line{font-size:26px;letter-spacing:8px;color:var(--accent-strong);white-space:nowrap}.lec-header__progress{appearance:none;-webkit-appearance:none;font-size:0;line-height:0}button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
</style>
</head>
<body data-page="18" data-total="48">
<div id="stage"><main id="main"></main></div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
Lec.mount({index:18,kicker:"CULTURAL RELAY",title:"传着传着，步骤去哪了？",take:"模仿若有误差却没有纠正，复杂技能会在传递中迅速丢失。"});
Deck.init({index:18,total:48});
const main=document.getElementById('main');
const safe=n=>Lec.P.finiteNumber(n,0), clamp=(n,a,b)=>Lec.P.clamp(safe(n),a,b), round=(n,p=0)=>Lec.P.round(safe(n),p);
Lec.P18={};
Lec.P18.stepCount=round(Math.sqrt(safe(5400)/150),0);
Lec.P18.viewSeconds=clamp(round(Lec.P18.stepCount/2,0),1,Lec.P18.stepCount);
Lec.P18.relayCount=clamp(round(Lec.P18.stepCount*2/3,0),2,Lec.P18.stepCount);
Lec.P18.optionCount=Lec.P18.stepCount+round(Lec.P18.stepCount/3,0);
Lec.P18.passCount=Lec.P18.stepCount-1;
const icons=['↻','✦','⟳','⇥','↔','⌁','⇅','◫'];
const names=['翻转材料','敲击边缘','顺时针旋转','将细片穿入开口','向两侧拉紧','沿标记折叠','上下压合','翻开薄片'];
let groupIndex=0,timer=null;
const fresh=()=>{const rng=new Math.seedrandom('apeman-spaceman-p18-'+groupIndex);const initial=icons.slice(0,Lec.P18.stepCount);for(let i=initial.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[initial[i],initial[j]]=[initial[j],initial[i]]}return{relay:0,phase:'watch',initial,current:initial.slice(),submissions:[],chosen:[],options:[],count:Lec.P18.viewSeconds,rng}};
let state;
main.innerHTML=`<section class="relay-page"><div class="topline"><p class="instruction">短暂观察当前范本；遮住后，从候选动作中依次选满步骤。每棒只看上一棒。</p><div id="status" class="status" aria-live="polite"></div></div><div id="track" class="k-process relay-track"><div class="axis"></div></div><div id="bench" class="workbench"><div class="bench-side min0"><h2 class="bench-title">当前范本</h2><div id="watch" class="watch" aria-label="当前动作序列"></div><h2 class="bench-title">你的复现</h2><div id="slots" class="slots"></div><div class="actions"><button id="submit" class="btn" disabled>选满后提交</button><button id="reset" class="btn secondary">重置</button><button id="new" class="btn secondary">换一组</button></div></div><div class="bench-side options-side min0"><h2 class="bench-title">候选动作</h2><div id="options" class="options"></div><p class="note">点击候选卡填入；点击已填动作可撤回。用方向键调整已填顺序。</p></div><div id="mask" class="mask"><div id="count" class="count"></div><div class="mask-note">观察后，范本会被遮住</div></div></div><section id="result" class="result" aria-live="polite"></section></section>`;
const $=s=>main.querySelector(s), track=$('#track'),bench=$('#bench'),result=$('#result');
function glyph(x,extra=''){return `<span class="glyph ${extra}" title="动作图标" aria-hidden="true">${x}</span>`}
function setupOptions(){state.options=icons.slice();for(let i=state.options.length-1;i>0;i--){const j=Math.floor(state.rng()*(i+1));[state.options[i],state.options[j]]=[state.options[j],state.options[i]]}}
function renderTrack(){track.querySelectorAll('.step,.arw,.handoff').forEach(x=>x.remove());for(let i=0;i<Lec.P18.relayCount;i++){const d=document.createElement('div');d.className='step '+(i<state.submissions.length?'is-done':i===state.relay?'is-current':'');const seq=state.submissions[i];d.innerHTML=`<div class="step-head"><span>第 ${safe(i+1)} 棒</span><span>${seq?'已提交':i===state.relay?'当前':'待传递'}</span></div><div class="mini-seq"><span class="mini-line" aria-label="${seq?'该棒提交的六步序列':'尚未传到'}">${seq?seq.join(' '):'· · · · · ·'}</span></div>`;track.appendChild(d);if(i<Lec.P18.relayCount-1){const a=document.createElement('span');a.className='arw';a.style.left=`${safe((i+1)*25)}%`;track.appendChild(a)}}const q=document.createElement('div');q.className='handoff';q.textContent='上一棒的复现，就是下一棒看到的版本：它还能知道原版是什么吗？';track.appendChild(q)}
function renderPlay(){renderTrack();$('#status').textContent=`第 ${safe(state.relay+1)}/${safe(Lec.P18.relayCount)} 棒 · 题组 ${safe(groupIndex+1)}`;$('#watch').innerHTML=state.current.map(glyph).join('');$('#slots').innerHTML=Array.from({length:Lec.P18.stepCount},(_,i)=>`<button class="slot ${state.chosen[i]?'filled':''}" data-i="${safe(i)}" aria-label="第 ${safe(i+1)} 个复现位置">${state.chosen[i]||'·'}</button>`).join('');$('#options').innerHTML=state.options.map((x,i)=>`<button class="option" data-i="${safe(i)}" aria-label="候选动作 ${names[icons.indexOf(x)]}">${x}</button>`).join('');$('#submit').disabled=state.chosen.length!==Lec.P18.stepCount;$('#submit').textContent=state.chosen.length===Lec.P18.stepCount?'提交这一棒':`还需 ${safe(Lec.P18.stepCount-state.chosen.length)} 步`;$('#mask').style.display=state.phase==='watch'?'flex':'none';$('#count').textContent=safe(state.count);}
function startWatch(){clearInterval(timer);state.phase='watch';state.count=Lec.P18.viewSeconds;renderPlay();timer=setInterval(()=>{state.count--;if(state.count<=0){clearInterval(timer);state.phase='recall';renderPlay()}else renderPlay()},1000)}
function submit(){if(state.chosen.length!==Lec.P18.stepCount)return;state.submissions.push(state.chosen.slice());state.current=state.chosen.slice();state.chosen=[];state.relay++;if(state.relay>=Lec.P18.relayCount){clearInterval(timer);finish()}else{setupOptions();startWatch()}}
function finish(){state.phase='done';renderTrack();bench.style.display='none';const final=state.submissions.at(-1);const exact=final.reduce((n,x,i)=>n+(x===state.initial[i]?1:0),0);const fidelity=clamp(round(exact/Lec.P18.stepCount*100,0),0,100),changes=Lec.P18.stepCount-exact;const types=final.map((x,i)=>x===state.initial[i]?'保留':state.initial.includes(x)?'换位':'替换');const omitted=state.initial.filter(x=>!final.includes(x)).length;result.className='result show';result.innerHTML=`<div class="compare"><h2>初始版 × 最终版</h2><div class="compare-row"><span class="compare-label">初始</span>${state.initial.map((x,i)=>glyph(x)).join('')}</div><div class="compare-row final"><span class="compare-label">最终</span>${final.map((x,i)=>glyph(x,types[i]==='保留'?'keep':'changed')).join('')}</div><p class="legend">绿色：保留；橙色：换位或替换。遗漏 ${safe(omitted)} 步。</p></div><div class="summary"><div class="metric">保真度 ${safe(fidelity)}%</div><div class="metric">累计变化 ${safe(changes)} 步</div><p class="verdict">${exact>=Lec.P18.passCount?'接力保住了大部分步骤':'技能在接力中失真'}</p><p class="sec">每一棒只偏一点，最后看到的也可能已经不是原来的做法。这里刻意没有纠正。</p><div class="actions"><button class="btn" id="again">重置</button><button class="btn secondary" id="another">换一组</button></div></div>`;$('#again').onclick=reset;$('#another').onclick=newGroup;}
function reset(){clearInterval(timer);state=fresh();setupOptions();bench.style.display='flex';result.className='result';startWatch()}
function newGroup(){groupIndex++;reset()}
main.addEventListener('click',e=>{const op=e.target.closest('.option');if(op&&state.phase==='recall'&&state.chosen.length<Lec.P18.stepCount){state.chosen.push(state.options[+op.dataset.i]);renderPlay();return}const sl=e.target.closest('.slot');if(sl&&state.phase==='recall'&&state.chosen[+sl.dataset.i]){state.chosen.splice(+sl.dataset.i,1);renderPlay()}});
main.addEventListener('keydown',e=>{const sl=e.target.closest('.slot');if(!sl||state.phase!=='recall')return;const i=+sl.dataset.i;if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&state.chosen[i]){const j=clamp(i+(e.key==='ArrowLeft'?-1:1),0,state.chosen.length-1);[state.chosen[i],state.chosen[j]]=[state.chosen[j],state.chosen[i]];renderPlay();$('#slots').children[j].focus();e.preventDefault()}});
$('#submit').onclick=submit;$('#reset').onclick=reset;$('#new').onclick=newGroup;
window.p18Game={reset,getState:()=>JSON.parse(JSON.stringify({...state,rng:undefined})),completeDemo:()=>{clearInterval(timer);while(state.submissions.length<Lec.P18.relayCount){const n=state.current.slice();if(state.submissions.length%2===0)[n[0],n[1]]=[n[1],n[0]];state.submissions.push(n);state.current=n;state.relay++}finish()}};
reset();
</script>
</body>
</html>
