<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>同一个动作，“模仿”与“教学”有什么不同？</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-header__progress{appearance:none;border:0;font-size:0;line-height:0}
    .page19{height:620px;display:flex;flex-direction:column;gap:12px;min-width:0}
    .modebar{display:flex;align-items:center;justify-content:center;gap:12px;min-height:44px}
    .modebar .prompt{font-size:var(--fs-label);font-weight:700;color:var(--muted)}
    .modebar button{min-height:42px;padding:8px 20px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font:700 var(--fs-label)/1.4 var(--font-sans);cursor:pointer}
    .modebar button[aria-pressed="true"]{border-color:var(--accent-strong);background:var(--accent);color:#fff;box-shadow:0 0 0 3px rgb(0 124 145 / 12%)}
    .demo-band{display:grid;grid-template-columns:minmax(180px,.72fr) repeat(2,minmax(0,1fr));height:210px;min-width:0}
    .demo-key{display:flex;align-items:center;justify-content:flex-end;padding:16px;border-right:2px solid var(--line-strong);color:var(--muted);font-size:var(--fs-label);font-weight:700;text-align:right}
    .demo{position:relative;min-width:0;overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
    .demo + .demo{border-left:1px solid var(--line)}
    .demo.active{background:linear-gradient(180deg,var(--surface),var(--accent-soft))}
    .demo.teach.active{background:linear-gradient(180deg,var(--surface),var(--warm-soft))}
    .konva-host{position:absolute;inset:30px 12px 34px}
    .demo-title{position:absolute;z-index:2;top:6px;left:16px;font-size:var(--fs-sec);font-weight:750}
    .demo-state{position:absolute;z-index:2;right:16px;bottom:7px;font-size:var(--fs-label);font-weight:700;color:var(--muted)}
    .teach .demo-state{color:#8d3f25}
    .k-comparison{flex:1;grid-template-columns:minmax(180px,.72fr) repeat(2,minmax(0,1fr));align-content:stretch}
    .k-comparison>.hdr{min-height:48px;padding:8px 16px;font-size:var(--fs-body)}
    .k-comparison>.dim,.k-comparison>.cell{padding:7px 16px}
    .k-comparison>.cell{font-size:var(--fs-sec);line-height:1.4;transition:background-color 180ms ease}
    .k-comparison>.cell.is-active{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
    .k-comparison>.cell.teaching.is-active{background:var(--warm-soft);box-shadow:inset 4px 0 0 var(--warm)}
    .claim{padding:8px 16px;border-left:6px solid var(--warm);background:var(--surface);font-size:var(--fs-lead);font-weight:720;line-height:1.4}
    button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    @media (prefers-reduced-motion:reduce){.k-comparison>.cell{transition:none}}
  </style>
</head>
<body data-page="19" data-total="48">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/konva.min.js"></script>
  <script>
    Lec.mount({
      index: 19,
      kicker: "CULTURAL FIDELITY",
      title: "同一个动作，“模仿”与“教学”有什么不同？",
      take: "主动示范、反馈和共享注意能提高知识跨代传递的保真度。"
    });
    Deck.init({ index: 19, total: 48 });

    const main = document.getElementById("main");
    main.innerHTML = `
      <section class="page19" aria-label="模仿与教学的比较">
        <div class="modebar ctl" role="group" aria-label="选择传递方式">
          <span class="prompt">切换方式，观察信息怎样流动</span>
          <button id="imitateBtn" type="button" aria-pressed="false">只看后模仿</button>
          <button id="teachBtn" type="button" aria-pressed="true">互动式教学</button>
        </div>
        <div class="demo-band">
          <div class="demo-key">同一装配任务<br>同一目标与顺序</div>
          <div class="demo imitate min0" id="imitateDemo">
            <span class="demo-title">只看后模仿</span><div id="imitateHost" class="konva-host" aria-hidden="true"></div>
            <span class="demo-state" id="imitateState">出现偏移</span>
          </div>
          <div class="demo teach active min0" id="teachDemo">
            <span class="demo-title">互动式教学</span><div id="teachHost" class="konva-host" aria-hidden="true"></div>
            <span class="demo-state" id="teachState">关系保留</span>
          </div>
        </div>
        <div class="k-comparison" aria-label="四个维度上的比较">
          <div class="hdr">比较维度</div><div class="hdr">只看后模仿</div><div class="hdr">互动式教学</div>
          <div class="dim">注意焦点</div><div class="cell imitate-cell">自行判断看哪里</div><div class="cell teaching teach-cell is-active">双方共同指向当前接口</div><div class="rowline"></div>
          <div class="dim">动作呈现</div><div class="cell imitate-cell">连续看完，自行切分</div><div class="cell teaching teach-cell is-active">关键关系处分步暂停</div><div class="rowline"></div>
          <div class="dim">错误处理</div><div class="cell imitate-cell">尝试后没有回应</div><div class="cell teaching teach-cell is-active">偏差出现，立即反馈修正</div><div class="rowline"></div>
          <div class="dim">最终保留</div><div class="cell imitate-cell">显眼动作仍在，接口容易偏移</div><div class="cell teaching teach-cell is-active">关键连接关系更可能保留</div>
        </div>
        <p class="claim">教学不只是把动作再做一遍：它标出什么重要、哪里出错，以及怎样修正。</p>

      </section>`;

    const N = (value, min, max) => Lec.P.clamp(Lec.P.finiteNumber(value, min), min, max);
    const scenes = {};
    let timers = [];
    let mode = "teach";

    function makeScene(hostId, teaching){
      const host = document.getElementById(hostId);
      const w = N(host.clientWidth, 320, 620), h = N(host.clientHeight, 120, 180);
      const stage = new Konva.Stage({container:hostId,width:w,height:h});
      const layer = new Konva.Layer(); stage.add(layer);
      const ink = teaching ? "#c95d32" : "#66757b";
      const dark = "#24343b";
      const guide = new Konva.Line({points:[38,h-30,w-38,h-30],stroke:"#bec9cb",strokeWidth:2,dash:[7,7]});
      const socket = new Konva.Rect({x:w-145,y:h-63,width:108,height:38,cornerRadius:8,stroke:dark,strokeWidth:3,fill:"#fffdf8"});
      const a = new Konva.Circle({x:86,y:48,radius:18,fill:"#007c91",stroke:dark,strokeWidth:2});
      const b = new Konva.RegularPolygon({x:151,y:48,sides:3,radius:23,rotation:90,fill:"#e5a542",stroke:dark,strokeWidth:2});
      const c = new Konva.Rect({x:194,y:29,width:39,height:39,cornerRadius:8,fill:"#92a8aa",stroke:dark,strokeWidth:2});
      const forward = new Konva.Arrow({points:[255,48,w-174,48],stroke:ink,fill:ink,strokeWidth:3,pointerLength:9,pointerWidth:9});
      const attention = new Konva.Line({points:[w-180,10,w-106,h-64,w-42,10],stroke:ink,strokeWidth:3,dash:[5,5],visible:teaching});
      const feedback = new Konva.Arrow({points:[w-48,h-12,w/2,h-12],stroke:ink,fill:ink,strokeWidth:3,pointerLength:8,pointerWidth:8,visible:teaching});
      layer.add(guide,socket,forward,attention,feedback,a,b,c); layer.draw();
      return {stage,layer,w,h,a,b,c,attention,feedback,forward};
    }

    function resetScene(s, teaching){
      s.a.position({x:86,y:48}); s.b.position({x:151,y:48}); s.b.rotation(90); s.c.position({x:194,y:29});
      s.attention.visible(teaching); s.feedback.visible(teaching); s.layer.opacity(1); s.layer.draw();
    }
    function moveFinal(s, teaching){
      const baseX=s.w-120, y=s.h-44;
      s.a.position({x:baseX-27,y:y});
      s.b.position({x:baseX+8,y:y});
      s.b.rotation(teaching?90:112);
      s.c.position({x:baseX+24,y:y-20});
      s.layer.draw();
    }
    function play(selected){
      timers.forEach(clearTimeout); timers=[];
      const teach = selected === "teach";
      resetScene(scenes.imitate,false); resetScene(scenes.teach,true);
      moveFinal(teach ? scenes.imitate : scenes.teach, !teach);
      const s = teach ? scenes.teach : scenes.imitate;
      if(Deck.reduced()) { moveFinal(s,teach); finish(selected); return; }
      [s.a,s.b,s.c].forEach((shape,i)=>{
        timers.push(setTimeout(()=>{
          const baseX=s.w-120, y=s.h-44;
          if(shape===s.a) shape.position({x:baseX-27,y:y});
          if(shape===s.b){shape.position({x:baseX+8,y:y});shape.rotation(teach?90:112)}
          if(shape===s.c) shape.position({x:baseX+24,y:y-20});
          if(teach){s.attention.opacity(i===2?0.55:1);s.feedback.opacity(i===1?1:0.35)}
          s.layer.draw();
        },N(260+i*380,100,1600)));
      });
      timers.push(setTimeout(()=>finish(selected),N(1550,300,2200)));
    }
    function finish(selected){
      document.querySelectorAll(".imitate-cell").forEach(el=>el.classList.toggle("is-active",selected==="imitate"));
      document.querySelectorAll(".teach-cell").forEach(el=>el.classList.toggle("is-active",selected==="teach"));
      const state = document.getElementById(selected==="teach" ? "teachState" : "imitateState");
      state.setAttribute("aria-live","polite");
    }
    function select(next){
      mode=next;
      const teach=next==="teach";
      document.getElementById("teachBtn").setAttribute("aria-pressed",String(teach));
      document.getElementById("imitateBtn").setAttribute("aria-pressed",String(!teach));
      document.getElementById("teachDemo").classList.toggle("active",teach);
      document.getElementById("imitateDemo").classList.toggle("active",!teach);
      play(next);
    }
    scenes.imitate=makeScene("imitateHost",false);
    scenes.teach=makeScene("teachHost",true);
    document.getElementById("imitateBtn").addEventListener("click",()=>select("imitate"));
    document.getElementById("teachBtn").addEventListener("click",()=>select("teach"));
    document.querySelector(".modebar").addEventListener("keydown",e=>{
      if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
        e.preventDefault(); const next=e.key==="ArrowLeft"?"imitate":"teach"; select(next);
        document.getElementById(next==="teach"?"teachBtn":"imitateBtn").focus();
      }
    });
    select("teach");
  </script>
</body>
</html>
