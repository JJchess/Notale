<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>有限符号，怎样说出没说过的关系？</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  progress.lec-header__progress{appearance:none;border:0;padding:0;line-height:0;display:block;overflow:visible}
  .p20{height:100%;display:flex;flex-direction:column;gap:12px}
  .task{display:flex;align-items:center;justify-content:space-between;gap:24px}
  .task p{font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .bench{display:flex;gap:16px;min-height:0;flex:1}
  .inventory{flex:0 0 300px;overflow:hidden}
  .composer{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:12px}
  .receiver{flex:0 0 300px;overflow:hidden}
  .k-classification{gap:8px}
  .k-classification .box{padding:12px}
  .k-classification .box>.bt{margin:-12px -12px 10px;padding:7px 12px;font-size:18px}
  .k-classification .lv{gap:8px;margin-inline-start:8px;padding-inline-start:12px}
  .group-title,.role{font-size:var(--fs-label);font-weight:700;line-height:1.4;color:var(--muted)}
  .tokens{display:flex;flex-wrap:wrap;gap:7px}
  .token{min-height:34px;padding:5px 10px;border:2px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--text);font:650 var(--fs-sec)/1.35 var(--font-sans);cursor:grab}
  .token[data-kind="action"]{border-radius:7px;border-color:var(--warm)}
  .token[data-kind="marker"]{border-style:dashed;border-color:var(--accent)}
  .token[aria-pressed="true"]{outline:4px solid rgb(0 124 145 / 18%);background:var(--accent-soft)}
  .scene{display:flex;align-items:center;justify-content:center;gap:18px;min-height:104px;padding:12px;border:2px solid var(--accent);border-radius:var(--radius-md);background:var(--accent-soft)}
  .person,.thing{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:var(--fs-label);font-weight:700}
  .glyph{display:grid;place-items:center;width:48px;height:48px;border:3px solid var(--text);border-radius:50%;background:#78b8c4;font-size:24px}
  .orange .glyph{background:#e89a69}.thing .glyph{border-radius:8px;background:#d7c49a}
  .scene-arrow{font-size:30px;font-weight:800;color:var(--accent-strong)}
  .slots{display:flex;align-items:stretch;gap:10px;min-height:100px}
  .slot{flex:1 1 0;min-width:0;padding:8px;border:2px dashed var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);text-align:center}
  .slot.is-over{background:var(--accent-soft);border-color:var(--accent)}
  .slot-value{display:flex;align-items:center;justify-content:center;min-height:42px;margin-top:5px;font-size:var(--fs-sec);font-weight:700}
  .relation-line{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
  .relation-line::before{content:"";flex:1;height:3px;background:var(--accent)}
  .relation-line::after{content:"→";font-size:22px;color:var(--accent-strong)}
  .choices{display:flex;flex-direction:column;gap:8px}
  .choice{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:var(--fs-sec);line-height:1.4}
  .choice.selected{border:3px solid var(--success);background:var(--success-soft)}
  .choice.confused{border:3px dashed #b7791f;background:#fff2cf}
  .feedback{min-height:50px;padding:10px;border-inline-start:4px solid var(--line-strong);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .controls{display:flex;align-items:center;gap:10px}
  .controls .progress{display:flex;flex:1;gap:7px;align-items:center}
  .dot{height:8px;flex:1;border-radius:99px;background:var(--surface-3)}
  .dot.done{background:var(--success)}.dot.now{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .controls button{min-height:42px;padding:8px 16px;border:1px solid var(--accent-strong);border-radius:8px;background:var(--accent);color:white;font:680 var(--fs-sec)/1.4 var(--font-sans)}
  .controls button.secondary{background:var(--surface);color:var(--accent-strong)}
  button:focus-visible,.slot:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
</style>
</head>
<body data-page="20" data-total="48">
<div id="stage"><main id="main"></main></div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.P20={
 entities:["阿蓝","阿橙","石头","果实","山洞","河边"],
 actions:["给","拿","去","看"],
 relationMarkers:["行动者","对象","地点","之前","之后"],
 relationSlots:{动作关系:["行动者","动作","对象"]},
 targets:[
  {goal:["阿蓝","拿","果实"],scene:"阿蓝拿起果实",wrong:"果实拿起阿蓝"},
  {goal:["阿橙","拿","石头"],scene:"阿橙拿起石头",wrong:"石头拿起阿橙"},
  {goal:["阿蓝","给","阿橙"],scene:"阿蓝把果实给阿橙",wrong:"阿橙把果实给阿蓝"}
 ],
 initialTargetIndex:0,maxMisunderstandings:3,progressMin:0,progressMax:1,
 initialState(){return {target:0,slots:[null,null,null],mistakes:[],completed:[]}},
 countMisunderstandings(state){return state.mistakes.length}
};
Lec.mount({index:20,kicker:"LANGUAGE / COMBINATION",title:"有限符号，怎样说出没说过的关系？",take:"语言的关键力量不只是词多，而是用有限单位生成并共享新关系。"});
Deck.init({index:20,total:48});
const main=document.getElementById("main");
main.innerHTML=`<section class="p20">
 <div class="task"><p>拖动或选中符号放入角色槽，再“传达”，看接收者恢复了哪种关系。</p><p class="lead">同一批符号，角色一变，事情就变了。</p></div>
 <div class="bench">
  <section class="inventory panel panel--flat min0 k-classification" aria-label="可重复使用的有限单位"><div class="box"><span class="bt">可重复使用的有限单位</span><div class="lv">
   <div><div class="group-title">实体符号 · 人、物、地点</div><div class="tokens" id="entities"></div></div>
   <div><div class="group-title">动作符号 · 做什么</div><div class="tokens" id="actions"></div></div>
   <div><div class="group-title">关系标记 · 谁与谁</div><div class="tokens" id="markers"></div></div>
  </div></div></section>
  <section class="composer min0" aria-label="关系组合台">
   <div class="scene" id="targetScene"><div class="person"><span class="glyph">●</span><span>阿蓝</span></div><span class="scene-arrow">→</span><div class="thing"><span class="glyph">◆</span><span>果实</span></div></div>
   <div class="k-classification"><div class="box"><span class="bt">由单位组合出的关系类型</span><div class="lv"><div class="group-title">动作关系：谁对谁做了什么</div><div class="slots" id="slots"></div><div class="relation-line">组合槽把符号组织成可恢复的关系</div></div></div></div>
   <div class="controls"><div class="progress" id="progress" aria-label="完成轨迹"></div><button class="secondary" id="undo">撤回</button><button id="send">传达</button><button class="secondary" id="reset">重置</button></div>
  </section>
  <aside class="receiver panel panel--flat min0 k-classification"><div class="box"><span class="bt">接收者理解</span><div class="lv"><div class="group-title">候选情景</div><div class="choices"><div class="choice" id="rightChoice"></div><div class="choice" id="wrongChoice"></div></div><div class="feedback" id="feedback" aria-live="polite">等待关系传来。</div></div></div></aside>
 </div></section>`;
let state=Lec.P20.initialState(),selected=null;
const roles=Lec.P20.relationSlots["动作关系"];
function tokenButton(text,kind){const b=document.createElement("button");b.className="token";b.textContent=text;b.dataset.value=text;b.dataset.kind=kind;b.draggable=true;b.setAttribute("aria-pressed","false");b.addEventListener("click",()=>{document.querySelectorAll('.token').forEach(x=>x.setAttribute('aria-pressed','false'));selected=text;b.setAttribute('aria-pressed','true')});b.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",text));return b}
function fill(id,arr,kind){const el=document.getElementById(id);arr.forEach(x=>el.append(tokenButton(x,kind)))}
fill("entities",Lec.P20.entities,"entity");fill("actions",Lec.P20.actions,"action");fill("markers",Lec.P20.relationMarkers,"marker");
const slots=document.getElementById("slots");roles.forEach((role,i)=>{const el=document.createElement("div");el.className="slot";el.tabIndex=0;el.setAttribute("role","button");el.setAttribute("aria-label",role+"槽，选中符号后按回车放置");el.innerHTML=`<div class="role">${role}</div><div class="slot-value">待放入</div>`;function put(v){if(v){state.slots[i]=v;render()}}el.addEventListener("dragover",e=>{e.preventDefault();el.classList.add("is-over")});el.addEventListener("dragleave",()=>el.classList.remove("is-over"));el.addEventListener("drop",e=>{e.preventDefault();el.classList.remove("is-over");put(e.dataTransfer.getData("text/plain"))});el.addEventListener("click",()=>put(selected));el.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&selected){e.preventDefault();put(selected)}});slots.append(el)});
function render(){const t=Lec.P20.targets[state.target];document.querySelectorAll(".slot-value").forEach((el,i)=>el.textContent=state.slots[i]||"待放入");rightChoice.textContent=t.scene;wrongChoice.textContent=t.wrong;progress.innerHTML=Lec.P20.targets.map((_,i)=>`<span class="dot ${state.completed.includes(i)?'done':i===state.target?'now':''}"></span>`).join("")}
function send(){const t=Lec.P20.targets[state.target];rightChoice.className="choice";wrongChoice.className="choice";const filled=state.slots.every(Boolean),ok=filled&&state.slots.every((x,i)=>x===t.goal[i]);if(ok){rightChoice.classList.add("selected");feedback.textContent="关系明确：接收者恢复了目标情景。";if(!state.completed.includes(state.target))state.completed.push(state.target);if(state.completed.length===Lec.P20.targets.length){feedback.textContent="有限单位已经传达出多种新关系。你完成了组合。"}else{state.target+=1;state.slots=[null,null,null];setTimeout(render,250)}}else{state.mistakes.push(state.slots.slice());if(!filled){rightChoice.classList.add("confused");wrongChoice.classList.add("confused");feedback.textContent="符号或角色还不完整，接收者在情景间犹豫。"}else{wrongChoice.classList.add("selected");feedback.textContent="符号收到了，但角色关系被互换。调整槽位再传达。"}if(Lec.P20.countMisunderstandings(state)>=Lec.P20.maxMisunderstandings)feedback.textContent="符号收到了，关系没有被可靠恢复。可保留组合继续调整。"}render()}
document.getElementById("send").addEventListener("click",send);document.getElementById("undo").addEventListener("click",()=>{for(let i=state.slots.length-1;i>=0;i--)if(state.slots[i]){state.slots[i]=null;break}render()});document.getElementById("reset").addEventListener("click",()=>{state=Lec.P20.initialState();selected=null;document.querySelectorAll('.token').forEach(x=>x.setAttribute('aria-pressed','false'));feedback.textContent="等待关系传来。";rightChoice.className="choice";wrongChoice.className="choice";render()});
render();
</script>
</body>
</html>
