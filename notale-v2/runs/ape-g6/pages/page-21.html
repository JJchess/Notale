<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文化棘轮需要三处同时咬合</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{height:620px}
    .lec-header__progress{-webkit-appearance:none;appearance:none;border:0;font-size:0;line-height:0}
    .page21{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:16px}
    .page21.k-generalization{display:flex;align-items:stretch;gap:16px}
    .page21>.claim{flex:0 0 auto;padding:12px 24px;font-size:var(--fs-lead)}
    .instruction{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
    .system{position:relative;display:flex;flex:1 1 0;min-height:0;gap:24px;align-items:stretch}
    .inputs{position:relative;flex:0 0 300px;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-left:28px}
    .inputs .trunk{position:absolute;left:8px;top:62px;bottom:62px;width:4px;border-radius:99px;background:var(--line-strong)}
    .support.input{position:relative;padding:12px 16px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
    .support.input:before{content:"";position:absolute;right:100%;top:50%;width:20px;height:3px;background:var(--line-strong)}
    .ctl{display:grid;grid-template-columns:64px 1fr 28px;gap:10px;min-height:40px}
    .ctl label{font-size:var(--fs-body);font-weight:720}
    .ctl output{font-size:var(--fs-label);font-weight:720;color:var(--accent-strong);text-align:right}
    .why{margin-top:3px;font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
    .visual{flex:1 1 0;min-width:0;position:relative;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);overflow:hidden}
    .visual svg{display:block;width:100%;height:100%}
    .visual text{font-family:var(--font-sans);fill:var(--text)}
    .result{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:2;padding:6px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);font-size:var(--fs-sec);font-weight:760;white-space:nowrap}
    .result.blocked{background:var(--warm-soft);color:#8d3e21}
    .boundary{flex:0 0 auto;text-align:center;font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
    input[type=range]{width:100%;accent-color:var(--accent)}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body data-page="21" data-total="48">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
    Lec.mount({
      index: 21,
      kicker: "CUMULATIVE CULTURE",
      title: "文化棘轮需要三处同时咬合",
      take: "创新、传播、保留三者缺一，文化复杂度都难以持续上升。"
    });
    Deck.init({ index: 21, total: 48 });

    const main = document.getElementById("main");
    main.innerHTML = `
      <section class="page21 k-generalization" aria-labelledby="claim21">
        <div class="claim" id="claim21">累积文化不是自动上升：新做法必须产生、传开，并被后来者接住。</div>
        <p class="instruction">依次把任意一项降到“低”，观察棘轮在哪里失去咬合。</p>
        <div class="system min0">
          <div class="inputs min0 supports" aria-label="文化棘轮的三项条件">
            <span class="trunk" aria-hidden="true"></span>
            <div class="support input">
              <div class="ctl"><label for="innovation">创新</label><input id="innovation" type="range" min="0" max="2" step="1" value="1"><output for="innovation">中</output></div>
              <p class="why">产生可供选择的新做法</p>
            </div>
            <div class="support input">
              <div class="ctl"><label for="transmission">传播</label><input id="transmission" type="range" min="0" max="2" step="1" value="1"><output for="transmission">中</output></div>
              <p class="why">让做法越过个体边界</p>
            </div>
            <div class="support input">
              <div class="ctl"><label for="retention">保留</label><input id="retention" type="range" min="0" max="2" step="1" value="1"><output for="retention">中</output></div>
              <p class="why">让成果跨越时间</p>
            </div>
          </div>
          <div class="visual min0">
            <div id="result" class="result" aria-live="polite">缓慢累积</div>
            <svg id="cultureViz" viewBox="0 0 1040 400" role="img" aria-labelledby="vizTitle vizDesc">
              <title id="vizTitle">文化棘轮与传递轨迹</title>
              <desc id="vizDesc">三项条件汇入棘轮，右侧轨迹显示可继续利用的既有成果。</desc>
            </svg>
          </div>
        </div>
        <p class="boundary">“棘轮”不保证进步；成果可能停滞、遗失或被替换。示意系统关系，不是社会排名或历史预测。</p>
      </section>`;

    const levels = ["低","中","高"];
    const ids = ["innovation","transmission","retention"];
    const controls = ids.map(id => document.getElementById(id));
    const svg = d3.select("#cultureViz");
    const css = getComputedStyle(document.documentElement);
    const C = n => css.getPropertyValue(n).trim();
    const reduced = Deck.reduced();

    function stateValue(control){
      const safe = Lec.P.finiteNumber(Number(control.value), 1);
      return Lec.P.clamp(safe, 0, 2);
    }
    function normalized(control){ return Lec.P.round(stateValue(control) / 2, 2); }

    function compute(i,t,r){
      let previous = 0.15;
      const values = [previous];
      for(let turn=0; turn<9; turn++){
        const gain = i * t * r * (0.22 + (turn % 3) * 0.025);
        const loss = (1-r) * previous * 0.34;
        previous = Lec.P.clamp(previous + gain - loss, 0.04, 1);
        values.push(Lec.P.round(previous, 3));
      }
      return values;
    }

    function render(){
      const [i,t,r] = controls.map(normalized);
      controls.forEach(c => c.nextElementSibling.value = levels[stateValue(c)]);
      const values = compute(i,t,r);
      const weak = Math.min(i,t,r);
      let reason = "";
      if(weak < .5){ reason = i===weak ? "新做法不足" : t===weak ? "没有传开" : "没有留下"; }
      const result = document.getElementById("result");
      result.textContent = weak >= 1 ? "可持续累积 · 仍可能遗失" : weak < .5 ? `累积受阻 · ${reason}` : "缓慢累积";
      result.classList.toggle("blocked", weak < .5);
      result.setAttribute("aria-label", `当前状态：${result.textContent}`);

      svg.selectAll("g.scene").remove();
      const g = svg.append("g").attr("class","scene");
      const accent=C("--accent"), strong=C("--accent-strong"), line=C("--line"), warm=C("--warm"), muted=C("--muted"), surface=C("--surface-2");
      const ys=[112,200,288], vals=[i,t,r];
      g.selectAll("path.flow").data(ys).join("path").attr("class","flow")
        .attr("d", y => `M8,${y} C120,${y} 150,200 260,200`)
        .attr("fill","none").attr("stroke",(d,k)=>vals[k]<.5?warm:accent)
        .attr("stroke-width",(d,k)=>2+vals[k]*6).attr("stroke-dasharray",(d,k)=>vals[k]<.5?"10 10":null).attr("opacity",.8);
      g.selectAll("text.flowLabel").data(["产生变体","进入群体","跨越时间"]).join("text")
        .attr("x",16).attr("y",(d,k)=>ys[k]-14).attr("font-size",16).attr("font-weight",650).text(d=>d);

      const cx=365, cy=200, teeth=12, outer=104, inner=83;
      const gear=d3.range(teeth*2).map(k=>{
        const a=-Math.PI/2+k*Math.PI/teeth, rad=k%2===0?outer:inner;
        return [cx+Math.cos(a)*rad,cy+Math.sin(a)*rad];
      });
      g.append("path").attr("d",d3.line().curve(d3.curveLinearClosed)(gear)).attr("fill",surface).attr("stroke",weak<.5?warm:strong).attr("stroke-width",5);
      g.append("circle").attr("cx",cx).attr("cy",cy).attr("r",49).attr("fill",C("--accent-soft")).attr("stroke",strong).attr("stroke-width",3);
      g.append("text").attr("x",cx).attr("y",cy-5).attr("text-anchor","middle").attr("font-size",20).attr("font-weight",760).text("文化棘轮");
      g.append("text").attr("x",cx).attr("y",cy+22).attr("text-anchor","middle").attr("font-size",16).attr("fill",muted).text("后来者继续");
      const pawlOpacity=.2+r*.8;
      g.append("path").attr("d",`M${cx+45},${cy-115} L${cx+92},${cy-88} L${cx+52},${cy-64} Z`).attr("fill",r<.5?warm:accent).attr("opacity",pawlOpacity);
      g.append("text").attr("x",cx+96).attr("y",cy-92).attr("font-size",16).attr("fill",muted).text(r<.5?"锁止失效":"成果被接住");

      const x=d3.scaleLinear().domain([0,values.length-1]).range([560,1000]);
      const y=d3.scaleLinear().domain([0,1]).range([330,78]);
      g.append("line").attr("x1",560).attr("x2",1000).attr("y1",330).attr("y2",330).attr("stroke",line).attr("stroke-width",2);
      g.append("line").attr("x1",560).attr("x2",560).attr("y1",64).attr("y2",330).attr("stroke",line).attr("stroke-width",2);
      g.append("text").attr("x",560).attr("y",365).attr("font-size",15).attr("fill",muted).text("较早传递");
      g.append("text").attr("x",1000).attr("y",365).attr("text-anchor","end").attr("font-size",15).attr("fill",muted).text("较晚传递");
      g.append("text").attr("x",570).attr("y",58).attr("font-size",15).attr("fill",muted).text("可继续利用的既有成果");
      const path=g.append("path").datum(values).attr("d",d3.line().x((d,k)=>x(k)).y(y).curve(d3.curveMonotoneX)).attr("fill","none").attr("stroke",weak<.5?warm:accent).attr("stroke-width",6).attr("stroke-linecap","round");
      if(!reduced){ const length=path.node().getTotalLength(); path.attr("stroke-dasharray",`${length} ${length}`).attr("stroke-dashoffset",length).transition().duration(380).attr("stroke-dashoffset",0); }
      g.selectAll("circle.point").data(values).join("circle").attr("class","point").attr("cx",(d,k)=>x(k)).attr("cy",y).attr("r",5).attr("fill",weak<.5?warm:accent);
      if(reason) g.append("text").attr("x",830).attr("y",Math.min(310,y(values[values.length-1])+34)).attr("text-anchor","middle").attr("font-size",16).attr("font-weight",700).attr("fill",warm).text(reason);
    }
    controls.forEach(c => c.addEventListener("input", render));
    render();
  </script>
</body>
</html>
