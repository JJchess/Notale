<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>许多人留下的，成为后来者的起点</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-header__progress{overflow:visible;line-height:0}
    .page22{
      width:100%; height:100%;
      display:flex; flex-direction:column;
      gap:var(--sp-4);
    }
    .page22__intro{
      flex:0 0 auto;
      display:flex; align-items:baseline; justify-content:space-between;
      gap:var(--sp-6);
    }
    .page22__intro .lead{max-width:920px}
    .ledger{
      flex:1 1 auto; min-height:0;
      display:flex; flex-direction:column;
      border:1px solid var(--line);
      border-radius:var(--radius-md);
      overflow:hidden;
      background:var(--surface);
      box-shadow:var(--shadow);
    }
    .ledger__row{
      display:grid;
      grid-template-columns:minmax(0,.9fr) 42px minmax(0,1.18fr) 42px minmax(0,1.15fr);
      align-items:center;
      min-width:0;
      flex:1 1 0;
      border-top:1px solid var(--line);
    }
    .ledger__row--head{
      flex:0 0 48px;
      border-top:0;
      border-bottom:2px solid var(--line-strong);
      background:var(--surface-2);
    }
    .ledger__cell{
      min-width:0;
      padding:var(--sp-3) var(--sp-5);
      font-size:var(--fs-sec);
      line-height:var(--lh-sec);
    }
    .ledger__row--head .ledger__cell{
      color:var(--muted);
      font-size:var(--fs-label);
      font-weight:720;
      letter-spacing:.04em;
    }
    .ledger__arrow{
      color:var(--line-strong);
      font-size:var(--fs-h2);
      font-weight:760;
      line-height:1;
      text-align:center;
    }
    .ledger__outcome{
      height:100%;
      display:flex; align-items:center;
      border-inline-start:3px solid var(--accent);
      background:linear-gradient(90deg,var(--accent-soft),rgb(217 238 241 / 18%));
      color:var(--accent-strong);
      font-weight:680;
    }
    .k-generalization.page22__generalization{
      flex:0 0 auto;
      display:flex;
      flex-direction:column;
      gap:0;
      align-items:stretch;
    }
    .page22__generalization > .supports{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:0;
      padding:0 9%;
      height:26px;
    }
    .page22__generalization > .supports > .trunk{
      top:auto; bottom:0; left:9%; right:9%;
      width:auto; height:3px;
      background:var(--line-strong);
    }
    .page22__generalization > .supports > .support{
      padding:0;
      border:0;
      border-radius:0;
      background:transparent;
    }
    .page22__generalization > .supports > .support::before{
      top:0; right:auto; left:50%;
      width:3px; height:26px;
      background:var(--line-strong);
      transform:translateX(-50%);
    }
    .page22__generalization > .claim{
      padding:var(--sp-4) var(--sp-6);
      border-inline-start:0;
      border-radius:var(--radius-sm);
      border-bottom:6px solid var(--accent);
      text-align:center;
      font-size:var(--fs-lead);
    }
    .term{font-weight:760;color:var(--accent-strong)}
  </style>
</head>
<body data-page="22" data-total="48">
  <div id="stage">
    <main id="main"></main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 22,
      kicker: "CULTURE / TRANSITION",
      title: "许多人留下的，成为后来者的起点",
      take: "从此，人类适应越来越依赖“许多人留下的外部记忆”。"
    });
    Deck.init({ index: 22, total: 48 });

    const main = document.getElementById("main");
    main.innerHTML = `
      <section class="page22" aria-labelledby="ledger-intro">
        <div class="page22__intro">
          <p id="ledger-intro" class="lead">个人获得的东西，可以成为群体继续适应的起点。</p>
          <p class="sec"><span class="term">外部记忆</span>：留在他人、器物、共享符号与稳定做法中的既有成果。</p>
        </div>

        <div class="ledger" role="table" aria-label="从当下行为到后来者起点的四条记录">
          <div class="ledger__row ledger__row--head" role="row">
            <div class="ledger__cell" role="columnheader">当下发生的事</div><div></div>
            <div class="ledger__cell" role="columnheader">留下来的东西</div><div></div>
            <div class="ledger__cell" role="columnheader">后来者因此能做什么</div>
          </div>
          <div class="ledger__row" role="row">
            <div class="ledger__cell" role="cell">有人做出新办法</div><div class="ledger__arrow" aria-hidden="true">→</div>
            <div class="ledger__cell" role="cell">可观察、可复现的做法</div><div class="ledger__arrow" aria-hidden="true">→</div>
            <div class="ledger__cell ledger__outcome" role="cell">从已有办法继续尝试</div>
          </div>
          <div class="ledger__row" role="row">
            <div class="ledger__cell" role="cell">他人模仿并得到纠正</div><div class="ledger__arrow" aria-hidden="true">→</div>
            <div class="ledger__cell" role="cell">较少失真的动作与判断</div><div class="ledger__arrow" aria-hidden="true">→</div>
            <div class="ledger__cell ledger__outcome" role="cell">不必独自重犯全部错误</div>
          </div>
          <div class="ledger__row" role="row">
            <div class="ledger__cell" role="cell">人们用共享符号表达关系</div><div class="ledger__arrow" aria-hidden="true">→</div>
            <div class="ledger__cell" role="cell">可被复述和重新组合的意义</div><div class="ledger__arrow" aria-hidden="true">→</div>
            <div class="ledger__cell ledger__outcome" role="cell">讨论未在眼前的新情境</div>
          </div>
          <div class="ledger__row" role="row">
            <div class="ledger__cell" role="cell">群体反复采用并保留成果</div><div class="ledger__arrow" aria-hidden="true">→</div>
            <div class="ledger__cell" role="cell">分散在他人、器物与惯例中的经验</div><div class="ledger__arrow" aria-hidden="true">→</div>
            <div class="ledger__cell ledger__outcome" role="cell">把前人的终点当作自己的起点</div>
          </div>
        </div>

        <div class="k-generalization page22__generalization">
          <div class="supports" aria-hidden="true">
            <span class="trunk"></span><span class="support"></span><span class="support"></span><span class="support"></span><span class="support"></span>
          </div>
          <p class="claim">适应不再只取决于一个人此刻知道什么，也越来越取决于许多人此前留下了什么。</p>
        </div>
      </section>`;
  </script>
</body>
</html>
