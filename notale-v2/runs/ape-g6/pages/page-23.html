<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>同一块地，养活更多人就一定过得更好吗？</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-header__progress{font-size:0;line-height:0}
    .p23{height:620px;display:flex;flex-direction:column;gap:12px}
    .p23-intro{display:flex;align-items:center;justify-content:space-between;gap:24px}
    .era{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--accent-strong);font-weight:700}
    .claim{font-size:var(--fs-lead);line-height:var(--lh-copy);font-weight:700}
    .matrix{grid-template-columns:190px minmax(0,1fr) minmax(0,1fr)}
    .matrix>.hdr{min-height:42px;padding:7px 14px;font-size:18px;align-items:center}
    .matrix>.dim,.matrix>.cell{padding:6px 14px}
    .matrix>.dim{font-size:15px}
    .matrix>.cell{font-size:16px;line-height:1.35;transition:opacity 160ms ease,background 160ms ease}
    .matrix>.cell.is-soft{opacity:.55}
    .matrix>.cell.is-near{background:var(--accent-soft)}
    .workbench{display:flex;min-height:0;flex:1;gap:18px;align-items:stretch}
    .balance{width:280px;flex:0 0 280px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
    .balance .ctl{display:block}
    .balance label{display:block;font-size:16px;font-weight:700;margin-bottom:6px}
    .balance input{width:100%;accent-color:var(--accent)}
    .shares{display:flex;justify-content:space-between;margin-top:3px;font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums}
    .status{margin-top:7px;font-size:16px;line-height:1.4;color:var(--muted)}
    .model-note{margin-top:6px;font-size:16px;line-height:1.4;color:var(--muted)}
    .charts{position:relative;min-width:0;flex:1;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);overflow:hidden}
    #chart{width:100%;height:100%;min-height:210px}
    @media (prefers-reduced-motion:reduce){.matrix>.cell{transition:none}}
  </style>
</head>
<body data-page="23" data-total="48">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script>
    Lec.mount({index:23,kicker:"LAND / LIFE",title:"同一块地，养活更多人就一定过得更好吗？",take:"“养活更多人”与“每个人过得更好”是两个不同的问题。"});
    Deck.init({index:23,total:48});
    const main=document.getElementById('main');
    const early=Lec.P.round(Lec.P.finiteNumber(Lec.K.AGRICULTURE_EARLY_YEARS,12000)/1e4,1);
    main.innerHTML=`<section class="p23">
      <div class="p23-intro"><p class="era">约${early}万年前起，农业转型在多个地区发生</p><p class="claim">同一块地的供养能力，与个体生活状况，要分开记账。</p></div>
      <div class="k-comparison matrix" aria-label="采集与种植的四维比较">
        <div class="hdr">比较维度</div><div class="hdr">以采集为主</div><div class="hdr">以种植为主</div>
        <div class="dim">单位土地供养能力</div><div class="cell gather">通常较低，需要更大活动范围</div><div class="cell crop diff">通常较高，可在较小范围支持更多人口</div><div class="rowline"></div>
        <div class="dim">食物来源</div><div class="cell gather">来源可能更分散，并随季节变化</div><div class="cell crop diff">主粮可增加，但可能更依赖少数作物</div><div class="rowline"></div>
        <div class="dim">劳动组织</div><div class="cell gather">搜寻、移动与处理随环境波动</div><div class="cell crop diff">播种到储存形成集中劳动</div><div class="rowline"></div>
        <div class="dim">个体风险</div><div class="cell gather">面对季节短缺、迁移与采集失败</div><div class="cell crop diff">面对歉收、单一饮食与重复劳动风险</div>
      </div>
      <div class="workbench">
        <div class="balance min0">
          <div class="ctl"><label for="mix">配平采集与种植，看两本账如何变化</label><input id="mix" type="range" min="0" max="100" step="5" value="50" aria-describedby="live"></div>
          <div class="shares"><span>采集投入 <strong id="gatherPct"></strong></span><span>种植投入 <strong id="cropPct"></strong></span></div>
          <p id="live" class="status" aria-live="polite"></p>
          <p class="model-note">示意模型：结果受作物、气候、制度与人群差异影响。</p>
        </div>
        <div class="charts min0"><div id="chart" role="img" aria-label="种植投入占比与土地供养能力、食物多样性、劳动负担和暴露风险的关系图"></div></div>
      </div>
    </section>`;
    const finite=(v,f)=>Lec.P.finiteNumber(v,f), clamp=v=>Lec.P.clamp(finite(v,0),0,1);
    const model=x=>({support:clamp(.25+.75*x),diet:clamp(.75-.35*x+.10*x*(1-x)),labor:clamp(.35+.45*x+.10*x*x),risk:clamp(.30+.25*x+.20*x*x)});
    const qualitative=v=>v<1/3?'较低':v<2/3?'中等':'较高';
    const xs=Array.from({length:21},(_,i)=>clamp(i/20));
    const line=(name,key,color,type='solid')=>({name,type:'line',xAxisIndex:key==='support'?0:1,yAxisIndex:key==='support'?0:1,symbol:'none',smooth:true,lineStyle:{width:3,color,type},itemStyle:{color},data:xs.map(x=>[Lec.P.round(x*100,0),model(x)[key]])});
    const chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
    const colors={accent:Deck.token('--accent'),warm:Deck.token('--warm'),success:Deck.token('--success'),muted:Deck.token('--muted'),line:Deck.token('--line')};
    const baseSeries=[line('供养能力','support',colors.accent),line('食物多样性','diet',colors.success),line('劳动负担','labor',colors.warm,'dashed'),line('暴露风险','risk',colors.muted,'dotted')];
    function update(){
      const input=document.getElementById('mix'); const x=clamp(finite(Number(input.value)/100,.5)); const m=model(x);
      const crop=Lec.P.round(x*100,0), gather=Lec.P.round((1-x)*100,0);
      document.getElementById('cropPct').textContent=crop+'%'; document.getElementById('gatherPct').textContent=gather+'%';
      document.querySelectorAll('.gather').forEach(el=>el.classList.toggle('is-soft',x>.65));
      document.querySelectorAll('.crop').forEach(el=>el.classList.toggle('is-soft',x<.35));
      document.querySelectorAll('.gather').forEach(el=>el.classList.toggle('is-near',x<.5));
      document.querySelectorAll('.crop').forEach(el=>el.classList.toggle('is-near',x>=.5));
      document.getElementById('live').textContent=`供养能力${qualitative(m.support)}；食物多样性${qualitative(m.diet)}；劳动负担${qualitative(m.labor)}；暴露风险${qualitative(m.risk)}。`;
      const marker={type:'line',markLine:{silent:true,symbol:'none',label:{show:false},lineStyle:{color:colors.accent,width:2},data:[{xAxis:crop}]}};
      chart.setOption({series:baseSeries.map(s=>({...s,markLine:marker.markLine}))});
    }
    chart.setOption({animation:!Deck.reduced(),textStyle:{fontFamily:Deck.token('--font-sans'),fontSize:16,color:Deck.token('--text')},tooltip:{trigger:'axis',textStyle:{fontSize:16},formatter:p=>{const x=p[0].value[0];return `种植投入 ${x}%<br>${p.map(q=>q.seriesName+'：'+qualitative(q.value[1])).join('<br>')}<br>课堂示意关系，不是统一历史平均值`}},legend:{top:4,right:12,textStyle:{fontSize:14},itemWidth:24},grid:[{left:92,right:30,top:35,height:55},{left:92,right:30,top:118,bottom:34}],xAxis:[{type:'value',min:0,max:100,gridIndex:0,axisLabel:{show:false},axisTick:{show:false}},{type:'value',min:0,max:100,gridIndex:1,name:'种植投入占比（%）',nameTextStyle:{fontSize:14},axisLabel:{fontSize:12}}],yAxis:[{type:'value',min:0,max:1,gridIndex:0,name:'供养能力',nameTextStyle:{fontSize:14},axisLabel:{show:false}},{type:'value',min:0,max:1,gridIndex:1,name:'相对水平',nameTextStyle:{fontSize:14},axisLabel:{show:false}}],series:baseSeries});
    document.getElementById('mix').addEventListener('input',update); update();
    Deck.onResize(()=>chart.resize());
  </script>
</body>
</html>
