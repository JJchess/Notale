<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我们能调动的能量，如何越过身体边界？</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-header__progress{font-size:0;line-height:0}
    .energy-page{height:100%;display:flex;flex-direction:column;gap:12px}
    .energy-page .intro{display:flex;justify-content:space-between;align-items:baseline;gap:24px}
    .energy-page .intro .lead{max-width:1050px}
    .energy-process{--process-axis-y:58%;height:184px;gap:42px}
    .energy-process>.step{padding:18px 14px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:border-color .18s,background .18s,opacity .18s}
    .energy-process>.step.is-future{opacity:.48;background:transparent}
    .step-name{font-size:var(--fs-h2);font-weight:750;line-height:1.35}
    .step-flow{height:46px;display:flex;align-items:center}
    .flow-line{height:var(--flow-w,5px);width:100%;border-radius:999px;background:var(--flow-color);transform-origin:left center}
    .step-range{font-size:var(--fs-label);line-height:1.4;color:var(--muted)}
    .energy-process>.arw{transform:translate(-42px,-50%)}
    .detail{min-height:142px;padding:16px 20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;box-shadow:none;background:var(--accent-soft)}
    .detail-item{min-width:0;padding-left:14px;border-left:3px solid var(--line)}
    .detail-item strong{display:block;margin-bottom:4px;font-size:var(--fs-label);color:var(--accent-strong)}
    .detail-item span{font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .bridge{grid-column:1/-1;font-size:var(--fs-body);line-height:1.45;font-weight:650;color:var(--warm)}
    .expansion{display:flex;flex-direction:column;gap:8px;padding:10px 16px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2)}
    .band-row{display:flex;align-items:center;gap:14px}
    .band-label{flex:0 0 112px;font-size:var(--fs-label);font-weight:700}
    .band-track{height:14px;flex:1;background:var(--surface-3);border-radius:999px;overflow:hidden}
    .band-fill{height:100%;width:20%;border-radius:999px;background:linear-gradient(90deg,var(--warm),var(--accent));transform-origin:left}
    .range-fill{background:linear-gradient(90deg,var(--accent),#b9e8ef)}
    .control-panel{margin-top:auto;padding:10px 18px;box-shadow:none}
    .control-panel .ctl{width:100%}
    .current-label{min-width:150px;text-align:right;font-size:var(--fs-label);font-weight:700;color:var(--accent-strong)}
    input[type=range]:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
    @media (prefers-reduced-motion:reduce){.energy-process>.step{transition:none}}
  </style>
</head>
<body data-page="24" data-total="48">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script src="assets/lib/gsap.min.js"></script>
  <script src="assets/lib/ScrollTrigger.min.js"></script>
  <script>
    Lec.mount({
      index: 24,
      kicker: "ENERGY AMPLIFICATION",
      title: "我们能调动的能量，如何越过身体边界？",
      take: "火、肌肉、风水、化石燃料和电力逐层扩大可调动的功率与范围。"
    });
    Deck.init({ index: 24, total: 48 });

    const energySteps = [
      {name:"火",range:"局部热源",color:"#d96a35",entry:"燃料中储存的化学能",convert:"燃烧，产生热和光",task:"加热、取暖、照明、改变材料",bridge:"可利用能量不再只来自当下的肌肉动作。"},
      {name:"肌肉",range:"身体与近距离工具",color:"#b95d5a",entry:"食物中的化学能",convert:"肌肉收缩，输出机械功",task:"搬运、牵引、转动工具",bridge:"动作可被组织、重复，并集中到任务上。"},
      {name:"风与水",range:"作坊、河道与航线",color:"#278aa0",entry:"风、水流与落差",convert:"帆、风轮和水轮转成机械功",task:"航行、磨粉、提水、驱动作坊",bridge:"输出越过单个身体的持续体力上限。"},
      {name:"化石燃料",range:"城市、工业区与洲际运输",color:"#a36a18",entry:"煤、石油和天然气的化学能",convert:"燃烧产热，再驱动机器",task:"工厂、铁路、远洋运输、重型机械",bridge:"机器可脱离持续肌肉输出并长时运行。"},
      {name:"电力",range:"跨区域网络与即时控制",color:"#4e91a8",entry:"多种一次能源经发电转换",convert:"输配电后在终端再次转换",task:"机械、照明、制冷、通信与计算",bridge:"来源与使用地点分离，能量可精细分配。"}
    ];
    const main = document.getElementById("main");
    main.innerHTML = `<section class="energy-page">
      <div class="intro"><p class="lead">后一步不淘汰前一步；现实系统会把多种能量方式叠加使用。</p><p class="sec">流带宽度只表示定性扩大</p></div>
      <div class="k-process energy-process" aria-label="能量能力逐层放大的过程"><div class="axis"></div></div>
      <section class="panel detail" aria-live="polite"></section>
      <div class="expansion" aria-label="能力扩展趋势">
        <div class="band-row"><span class="band-label">可调动功率</span><div class="band-track"><div class="band-fill power-fill"></div></div></div>
        <div class="band-row"><span class="band-label">作用范围</span><div class="band-track"><div class="band-fill range-fill"></div></div></div>
      </div>
      <div class="panel control-panel"><div class="ctl"><label for="energy-level">拨动能量阶梯，观察当前层突破了什么限制</label><input id="energy-level" type="range" min="0" max="4" step="0.01" value="0" aria-describedby="level-status"><output id="level-status" class="current-label">火</output></div></div>
    </section>`;

    const process = d3.select(".energy-process");
    const x = d3.scalePoint().domain(d3.range(energySteps.length)).range([0, 100]);
    energySteps.forEach((d,i) => {
      process.append("article").attr("class","step min0").attr("data-i",i).html(`<span class="step-name">${d.name}</span><div class="step-flow"><div class="flow-line" style="--flow-color:${d.color}"></div></div><span class="step-range">${d.range}</span>`);
      if(i < energySteps.length-1) process.append("span").attr("class","arw").attr("aria-hidden","true").style("left",`${(x(i)+x(i+1))/2}%`);
    });

    const detail = document.querySelector(".detail");
    const slider = document.getElementById("energy-level");
    const status = document.getElementById("level-status");
    gsap.registerPlugin(ScrollTrigger);
    const state = {progress:0};
    const scrubTimeline = gsap.timeline({paused:true});
    scrubTimeline.to(state,{progress:energySteps.length-1,duration:1,ease:"none",onUpdate:render});
    ScrollTrigger.create({trigger:main,start:"top top",end:"bottom bottom",animation:scrubTimeline,scrub:true});

    function render(){
      const raw = Lec.P.finiteNumber(state.progress,0);
      const progress = Lec.P.clamp(raw,0,energySteps.length-1);
      const current = Lec.P.clamp(Math.round(progress),0,energySteps.length-1);
      const d = energySteps[current];
      document.querySelectorAll(".energy-process .step").forEach((el,i)=>{
        el.classList.toggle("is-done",i<current);
        el.classList.toggle("is-current",i===current);
        el.classList.toggle("is-future",i>current);
        const width = Lec.P.clamp(5 + i*2.5,5,15);
        el.style.setProperty("--flow-w",`${width}px`);
        el.querySelector(".flow-line").style.transform = `scaleX(${i <= progress ? 1 : .12})`;
      });
      detail.innerHTML = `<div class="detail-item"><strong>能量入口</strong><span>${d.entry}</span></div><div class="detail-item"><strong>怎样转换</strong><span>${d.convert}</span></div><div class="detail-item"><strong>可驱动任务</strong><span>${d.task}</span></div><p class="bridge">这一层突破了上一层的什么限制？ ${d.bridge}</p>`;
      const normalized = Lec.P.clamp((progress+1)/energySteps.length,0,1);
      gsap.set(".power-fill",{scaleX:normalized});
      gsap.set(".range-fill",{scaleX:normalized});
      status.value = d.name;
      status.textContent = d.name;
    }
    slider.addEventListener("input",()=>{
      const p = Lec.P.clamp(Lec.P.finiteNumber(slider.value,0),0,energySteps.length-1);
      if(Deck.reduced()){state.progress=p;render();}else{gsap.to(scrubTimeline,{progress:p/(energySteps.length-1),duration:.24,ease:"power1.out",overwrite:true});}
    });
    render();
  </script>
</body>
</html>
