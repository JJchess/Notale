<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>聚落没有“文明开关”</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-header__progress{appearance:none;-webkit-appearance:none;font-size:0;line-height:0}#main{height:auto}.settlement{height:620px;display:flex;flex-direction:column;gap:12px}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px}.claim{font-size:var(--fs-lead);font-weight:650;line-height:1.45}.event{padding:9px 14px;border-left:5px solid var(--warm);background:var(--warm-soft);border-radius:var(--radius-sm);font-size:var(--fs-sec);line-height:1.45;white-space:nowrap}.game{display:flex;gap:16px;min-height:0;flex:1}.mechanisms{width:300px;overflow:auto;padding-right:4px}.k-classification{gap:8px}.k-classification .lv{gap:7px;margin-inline-start:8px;padding-inline-start:12px}.k-classification .box{padding:10px;border-width:2px}.k-classification .box>.bt{margin:-10px -10px 8px;padding:5px 10px;font-size:16px}.choice{display:block;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);font:650 16px/1.35 var(--font-sans);color:var(--text);text-align:left;cursor:pointer}.choice:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.choice[aria-disabled="true"]{opacity:.48;cursor:not-allowed}.stable{border-left-color:#b58a2d!important}.stable>.box>.bt{background:#f5e9c8}.ability{border-left-color:#2877a5!important}.ability>.box>.bt{background:#dcecf5}.cost{border-left-color:#c95d32!important}.cost>.box>.bt{background:var(--warm-soft)}.power{border-left-color:#79539b!important}.power>.box>.bt{background:#eadff2}.board{position:relative;flex:1;min-width:0;border:2px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface);overflow:hidden}.board svg{width:100%;height:100%;display:block}.edge{stroke:var(--line-strong);stroke-width:4;fill:none;marker-end:url(#arrow)}.edge.conditional{stroke-dasharray:10 8}.edge.costline{stroke-dasharray:4 7}.edge.active{stroke:var(--accent);stroke-width:7}.node circle{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:3}.node.active circle{fill:var(--accent-soft);stroke:var(--accent)}.node text{font:650 17px var(--font-sans);fill:var(--text);text-anchor:middle}.legend{position:absolute;left:14px;bottom:10px;padding:7px 10px;background:rgb(255 253 248 / 92%);font-size:14px;line-height:1.4}.status{width:260px;display:flex;flex-direction:column;gap:12px}.status h2{font-size:18px}.meter-label{display:flex;justify-content:space-between;font-size:16px;line-height:1.4}.segments{display:flex;gap:4px}.seg{height:18px;flex:1;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:3px}.seg.on{background:var(--accent)}.power-meter .seg.on{background:#79539b}.rounds{display:flex;gap:7px}.dot{width:14px;height:14px;border:2px solid var(--line-strong);border-radius:50%}.dot.done{background:var(--accent)}.controls{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px}.controls .btn{font-size:15px;padding:7px 10px}.feedback{min-height:78px;padding:12px 16px;border-left:6px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius-sm)}.feedback strong{display:block;font-size:16px;line-height:1.4}.feedback p{font-size:16px;line-height:1.45}.hint{color:var(--muted);font-size:14px;line-height:1.4}
  </style>
</head>
<body data-page="25" data-total="48">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/seedrandom.min.js"></script>
  <script>
    Lec.mount({index:25,kicker:"SETTLEMENT FEEDBACKS",title:"聚落没有“文明开关”",take:"同一种安排可能同时增加能力与脆弱性；聚落能否维持，取决于网络如何连接。"});
    Deck.init({index:25,total:48});
    const main=document.getElementById('main');
    main.innerHTML=`<section class="settlement">
      <div class="topline"><p class="claim">四类机制彼此反馈，不是依次亮起的“文明开关”。</p><div class="event" id="event">本轮条件：等待开始</div></div>
      <div class="game">
        <section class="mechanisms k-classification min0" aria-label="机制分类与项目手牌">
          <div class="lv stable"><div class="box"><span class="bt">稳定条件</span><button class="choice" data-project="store">扩建仓储</button><button class="choice" data-project="water">改善取水与排污</button></div></div>
          <div class="lv ability"><div class="box"><span class="bt">能力放大</span><button class="choice" data-project="workshop">建立工坊</button></div></div>
          <div class="lv cost"><div class="box"><span class="bt">聚集代价</span><p class="sec">疾病风险由接触、取水与储存条件共同生成。</p></div></div>
          <div class="lv power"><div class="box"><span class="bt">协调与分配</span><button class="choice" data-project="council">建立共同议事</button></div></div>
        </section>
        <figure class="board min0" aria-label="居所、田地、仓库、工坊与公共节点构成的聚落反馈网络">
          <svg viewBox="0 0 700 360" role="img" aria-labelledby="netTitle"><title id="netTitle">聚落反馈网络</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#77898d"/></marker></defs>
            <path class="edge" data-edge="field-store" d="M180 245 Q285 250 340 190"/><path class="edge conditional" data-edge="store-work" d="M385 170 Q480 120 535 185"/><path class="edge costline" data-edge="home-water" d="M160 105 Q300 55 410 90"/><path class="edge conditional" data-edge="home-council" d="M170 115 Q350 160 535 85"/>
            <g class="node" data-node="home" transform="translate(135 105)"><circle r="50"/><text y="6">居所</text></g><g class="node" data-node="field" transform="translate(145 270)"><circle r="48"/><text y="6">田地</text></g><g class="node" data-node="store" transform="translate(365 175)"><circle r="52"/><text y="6">仓库</text></g><g class="node" data-node="water" transform="translate(430 78)"><circle r="48"/><text y="6">取水点</text></g><g class="node" data-node="work" transform="translate(565 205)"><circle r="48"/><text y="6">工坊</text></g><g class="node" data-node="council" transform="translate(570 75)"><circle r="52"/><text y="6">公共节点</text></g>
          </svg><figcaption class="legend">实线：直接作用　虚线：代价／条件性反馈</figcaption>
        </figure>
        <aside class="status min0"><h2>聚落状态</h2><div id="meters"></div><div><span class="label">事件牌堆</span><div class="rounds" id="rounds"></div></div><div class="controls"><button class="btn" id="undo">撤销</button><button class="btn" id="replay">回看上一轮</button><button class="btn" id="reset">重置</button><button class="btn" id="newset">换一组</button></div><p class="hint">选一张项目卡，观察它改变哪条连接；方向键可选卡，Enter 放置。</p></aside>
      </div>
      <div class="feedback" aria-live="polite"><strong id="result">目标：在事件牌堆结束前维持食物、健康与协作。</strong><p id="chain">先选择一项安排。权力集中度只记录结构变化，不单独决定成败。</p></div>
    </section>`;
    const MAX=Lec.P.clamp(Lec.P.finiteNumber(5,5),1,9), START=Lec.P.clamp(Lec.P.round(MAX/2,0),1,MAX);
    const projects={store:{edge:'field-store',nodes:['field','store'],delta:{food:1,power:1},chain:'扩建仓储 → 食物缓冲增加；集中保管 → 分配影响更集中。'},water:{edge:'home-water',nodes:['home','water'],delta:{health:1,food:-1},chain:'改善取水与排污 → 传播路径减少；建设占用资源 → 食物缓冲暂时下降。'},workshop:{edge:'store-work',nodes:['store','work'],delta:{coop:1,food:-1},chain:'建立工坊 → 专门能力提高；角色依赖稳定供给 → 食物缓冲承压。'},council:{edge:'home-council',nodes:['home','council'],delta:{coop:1,power:-1},chain:'共同议事 → 协作能力增加；多条参与路径 → 决策影响较分散。'}};
    const eventNames=['收成低于预期','储藏腐坏','接触性疾病风险增加','新成员迁入','专门技能提高产出','分配争议','公共设施受损','邻近交换机会出现'];
    const eventEffects=[{food:-1},{food:-1},{health:-1},{health:-1,coop:1},{coop:1},{coop:-1,power:1},{health:-1},{food:1}];
    let seedIndex=0,state,history=[],lastVisual=null;
    function makeState(){const seed='apeman-spaceman-p25-'+seedIndex,rng=new Math.seedrandom(seed),deck=eventNames.map((n,i)=>({name:n,e:eventEffects[i]}));for(let i=deck.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}return{food:START,health:START,coop:START,power:START,turn:0,deck,ended:false,seed};}
    function safe(v){return Lec.P.clamp(Lec.P.finiteNumber(v,START),0,MAX)}
    function applyDelta(delta){Object.keys(delta).forEach(k=>state[k]=safe(state[k]+delta[k]));}
    function outcome(){if(state.food===0)return'储备无法继续吸收波动。';if(state.health===0)return'接触风险超过了现有照护能力。';if(state.coop===0)return'角色之间的依赖失去协调。';if(state.turn>=state.deck.length)return'这个聚落暂时维持住了；它依靠的是一组相互牵制的安排。';return''}
    function play(key){if(state.ended)return;history.push(JSON.parse(JSON.stringify(state)));const ev=state.deck[state.turn];applyDelta(ev.e);applyDelta(projects[key].delta);state.turn++;const end=outcome();state.ended=!!end;lastVisual=projects[key];render();document.getElementById('event').textContent='本轮条件：'+ev.name;document.getElementById('chain').textContent=projects[key].chain;document.getElementById('result').textContent=end||'安排已进入网络：收益与代价同时保留。';pulse(projects[key]);}
    function pulse(p){document.querySelectorAll('.active').forEach(x=>x.classList.remove('active'));document.querySelector(`[data-edge="${p.edge}"]`).classList.add('active');p.nodes.forEach(n=>document.querySelector(`[data-node="${n}"]`).classList.add('active'));if(!Deck.reduced())setTimeout(()=>document.querySelectorAll('.active').forEach(x=>x.classList.remove('active')),700)}
    function render(){const labels=[['食物缓冲','food',''],['群体健康','health',''],['协作能力','coop',''],['权力集中度','power','power-meter']];document.getElementById('meters').innerHTML=labels.map(([l,k,c])=>`<div class="${c}"><div class="meter-label"><span>${l}</span><span>${Lec.P.round(state[k],0)} / ${Lec.P.round(MAX,0)}</span></div><div class="segments">${Array.from({length:MAX},(_,i)=>`<i class="seg ${i<state[k]?'on':''}"></i>`).join('')}</div></div>`).join('');document.getElementById('rounds').innerHTML=state.deck.map((_,i)=>`<i class="dot ${i<state.turn?'done':''}"></i>`).join('');document.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-disabled',state.ended?'true':'false'));document.getElementById('undo').disabled=!history.length||state.ended;document.getElementById('replay').disabled=!lastVisual;}
    function reset(){state=makeState();history=[];lastVisual=null;document.getElementById('event').textContent='本轮条件：等待开始';document.getElementById('result').textContent='目标：在事件牌堆结束前维持食物、健康与协作。';document.getElementById('chain').textContent='先选择一项安排。权力集中度只记录结构变化，不单独决定成败。';render()}
    document.querySelectorAll('.choice').forEach((b,i,all)=>{b.onclick=()=>b.getAttribute('aria-disabled')!=='true'&&play(b.dataset.project);b.onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();all[(i+1)%all.length].focus()}if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();all[(i+all.length-1)%all.length].focus()}}});
    document.getElementById('undo').onclick=()=>{if(history.length){state=history.pop();lastVisual=null;render();document.getElementById('result').textContent='已撤销上一轮。';document.getElementById('chain').textContent='选择另一项安排，比较网络变化。'}};
    document.getElementById('replay').onclick=()=>lastVisual&&pulse(lastVisual);document.getElementById('reset').onclick=()=>{seedIndex=0;reset()};document.getElementById('newset').onclick=()=>{seedIndex++;reset()};reset();
  </script>
</body>
</html>
