<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>把记忆放到人脑之外</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .memory-page{height:100%;display:flex;gap:32px}.memory-controls{flex:0 0 382px;display:flex;flex-direction:column;gap:16px;padding:20px;border:1px solid var(--line);border-radius:var(--radius-lg);background:rgb(255 253 248 / 72%)}.memory-flow{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:16px;padding:20px;border:1px solid var(--line);border-radius:var(--radius-lg);background:rgb(255 253 248 / 72%)}.instruction{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
    .layer-stack{display:flex;flex-direction:column;gap:12px}.layer{position:relative;width:100%;min-height:90px;padding:12px 16px 12px 68px;border:2px solid var(--line);border-radius:var(--radius-md);background:var(--surface);color:var(--text);font:inherit;text-align:left;cursor:pointer;box-shadow:0 5px 0 var(--surface-3);transition:transform 180ms ease,border-color 180ms ease,background 180ms ease}.layer:hover{transform:translateY(-2px)}.layer[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 5px 0 #9dcdd3}.layer-mark{position:absolute;left:18px;top:17px;width:34px;height:34px;display:grid;place-items:center;border:2px solid var(--accent-strong);border-radius:8px;color:var(--accent-strong);font-size:20px;font-weight:800}.layer:nth-child(2) .layer-mark{background:repeating-linear-gradient(90deg,transparent 0 6px,rgb(0 124 145/.16) 6px 8px)}.layer:nth-child(3) .layer-mark{border-radius:50%;background:radial-gradient(circle,var(--accent) 2px,transparent 3px)}.layer-name{display:block;font-size:var(--fs-body);font-weight:750;line-height:1.35}.layer-function{display:block;margin-top:3px;color:var(--muted);font-size:var(--fs-label);line-height:1.4}.summary{margin-top:auto;min-height:132px}.summary strong{display:block;margin-bottom:8px;font-size:var(--fs-h2);line-height:1.35}.summary p{font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .scope-strip{display:flex;align-items:center;gap:10px;min-height:50px;padding:8px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}.scope-label{font-size:var(--fs-label);font-weight:700;color:var(--muted)}.scope{flex:1;padding:6px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:var(--fs-label);font-weight:700;text-align:center;transition:background 240ms ease,color 240ms ease}.scope.on{background:var(--accent-soft);color:var(--accent-strong);box-shadow:inset 0 0 0 1px var(--accent)}
    .process-wrap{position:relative;height:340px;padding-top:42px}.baseline{position:absolute;right:0;top:0;color:var(--muted);font-size:var(--fs-label);line-height:1.4}.k-process.memory-process{height:280px;gap:24px;--process-axis-y:48%}.k-process.memory-process>.step{display:flex;flex-direction:column;justify-content:center;padding:14px 10px;text-align:center;opacity:.48;transition:opacity 260ms ease,border-color 260ms ease,background 260ms ease,transform 260ms ease}.k-process.memory-process>.step.is-current{opacity:1;transform:translateY(-3px)}.k-process.memory-process>.step.is-done{opacity:.86}.step-title{font-size:var(--fs-body);font-weight:760;line-height:1.35}.step-desc{margin-top:8px;color:var(--muted);font-size:var(--fs-label);line-height:1.4}.k-process.memory-process>.arw{width:24px;transform:translate(-24px,-50%);font-size:20px}.link-broken{stroke-dasharray:8 9}.questions{display:flex;gap:10px}.question{flex:1;min-width:0;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-top:3px solid var(--line);border-radius:0 0 var(--radius-sm) var(--radius-sm);background:var(--surface-2);color:var(--muted);font-size:var(--fs-label);line-height:1.4}.question.active{border-color:var(--accent);color:var(--text);background:linear-gradient(180deg,var(--accent-soft),transparent)}.era{align-self:flex-end;font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}.era strong{color:var(--accent-strong)}
    .lec-header__progress{overflow:visible}.summary{border-color:var(--accent);background:var(--accent-soft)}
    @media (prefers-reduced-motion:reduce){.layer,.k-process.memory-process>.step,.scope{transition:none}}
  </style>
</head>
<body data-page="26" data-total="48">
  <div id="stage"><main id="main">
    <section class="memory-page">
      <aside class="memory-controls min0" aria-labelledby="control-title">
        <h2 id="control-title">叠加外部记忆</h2>
        <p class="instruction">切换三层，观察信息能走到哪一步、跨越多远。</p>
        <div class="layer-stack" role="group" aria-label="外部记忆层">
          <button class="layer" data-layer="writing" aria-pressed="false"><span class="layer-mark">文</span><span class="layer-name">文字</span><span class="layer-function">固定名称、规则与叙述</span></button>
          <button class="layer" data-layer="diagram" aria-pressed="false"><span class="layer-mark">↔</span><span class="layer-name">图表</span><span class="layer-function">固定位置、数量、顺序与关系</span></button>
          <button class="layer" data-layer="archive" aria-pressed="false"><span class="layer-mark">⌕</span><span class="layer-name">档案</span><span class="layer-function">固定出处、版本、索引与位置</span></button>
        </div>
        <div class="panel panel--flat summary" aria-live="polite"><strong id="summary-title">只靠个人记忆</strong><p id="summary-text">经验只能由在场者记住并当面转述；路径容易随人离场而中断。</p></div>
      </aside>
      <section class="memory-flow min0" aria-labelledby="flow-title">
        <h2 id="flow-title">一条经验如何成为协作资源</h2>
        <div class="scope-strip" aria-label="协作可达范围"><span class="scope-label">可达范围</span><span class="scope on" data-scope="same">同场</span><span class="scope" data-scope="far">异地</span><span class="scope" data-scope="generation">跨世代</span></div>
        <div class="process-wrap">
          <span class="baseline">浅色前态：只靠个人记忆</span>
          <div class="k-process memory-process" id="process">
            <div class="axis"></div>
            <div class="step is-current" data-step="0"><span class="step-title">发生</span><span class="step-desc">观察、约定或操作</span></div><span class="arw"></span>
            <div class="step" data-step="1"><span class="step-title">记下</span><span class="step-desc">可重复读取</span></div><span class="arw"></span>
            <div class="step" data-step="2"><span class="step-title">组织</span><span class="step-desc">显出数量与关系</span></div><span class="arw"></span>
            <div class="step" data-step="3"><span class="step-title">归档</span><span class="step-desc">附上出处与索引</span></div><span class="arw"></span>
            <div class="step" data-step="4"><span class="step-title">取回</span><span class="step-desc">后来者按线索找到</span></div><span class="arw"></span>
            <div class="step" data-step="5"><span class="step-title">协作</span><span class="step-desc">共同调用并继续记录</span></div>
          </div>
        </div>
        <div class="questions" aria-label="流程中的连接问题">
          <div class="question active">没有记录，谁必须在场？</div><div class="question">写下后，什么能再读？</div><div class="question">图表让什么更易比较？</div><div class="question">后来者怎样找到它？</div><div class="question">远方的人怎样对齐行动？</div>
        </div>
        <p class="era">尺度参照：最早文字系统约 <strong id="writing-years">—</strong> 年前；并非各地同时出现。</p>
      </section>
    </section>
  </main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
    Lec.mount({index:26,kicker:"EXTERNAL MEMORY",title:"把记忆放到人脑之外",take:"文字、图表和档案让信息脱离单个人脑，复杂协作得以跨越世代与远方。"});
    Deck.init({index:26,total:48});
    const state={writing:false,diagram:false,archive:false};
    const yearRaw=(Lec.K&&Lec.K.WRITING_EARLY_YEARS)!=null?Lec.K.WRITING_EARLY_YEARS:5200;
    const year=Lec.P.round(Lec.P.clamp(Lec.P.finiteNumber(yearRaw,5200),0,100000),0);
    document.getElementById('writing-years').textContent=String(year);
    const summaries={
      writing:['文字已加入','名称、步骤与约定可以离开讲述者，供别人再次读取。'],
      diagram:['图表已加入','条目获得位置、数量、顺序和关系，但仍缺少稳定索引。'],
      archive:['档案已加入','记录获得出处、版本与索引，可以被定位和取回。'],
      full:['三层共同工作','信息可被固定、组织、查找和共同调用，但保存不等于内容必然正确。'],
      none:['只靠个人记忆','经验只能由在场者记住并当面转述；路径容易随人离场而中断。']
    };
    function update(){
      const active=Object.values(state).filter(Boolean).length;
      const reach=state.archive?4:state.diagram?2:state.writing?1:0;
      const complete=active===3;
      d3.selectAll('.layer').attr('aria-pressed',function(){return String(state[this.dataset.layer])});
      d3.selectAll('.step').classed('is-done',d=>false).classed('is-current',function(){const i=+this.dataset.step;return complete||i<=reach||(i===5&&complete)}).style('opacity',function(){const i=+this.dataset.step;return (complete||i<=reach)?1:(i===5?.42:.48)});
      d3.selectAll('.arw').style('color',function(_,i){return (complete||i<reach)?'var(--accent-strong)':'var(--line)'}).style('opacity',function(_,i){return (complete||i<reach)?1:.5});
      d3.select('[data-scope="same"]').classed('on',true);
      d3.select('[data-scope="far"]').classed('on',state.writing&&state.diagram);
      d3.select('[data-scope="generation"]').classed('on',complete);
      d3.selectAll('.question').classed('active',function(_,i){return i===Math.min(reach,4)});
      let key=complete?'full':active===0?'none':state.archive?'archive':state.diagram?'diagram':'writing';
      document.getElementById('summary-title').textContent=summaries[key][0];
      document.getElementById('summary-text').textContent=summaries[key][1];
    }
    document.querySelectorAll('.layer').forEach(btn=>btn.addEventListener('click',()=>{state[btn.dataset.layer]=!state[btn.dataset.layer];update()}));
    update();
  </script>
</body>
</html>
