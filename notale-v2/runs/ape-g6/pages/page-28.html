<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>好解释，要先冒被证据否定的风险</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-header__progress{appearance:none;-webkit-appearance:none;border:0;padding:0;min-height:0;height:5px!important;line-height:0;font-size:0;display:block}.lec-header__progress::-webkit-progress-bar,.lec-header__progress::-webkit-progress-value{height:5px}
    #main{height:auto}
    .lab{height:var(--content-h);display:flex;flex-direction:column;gap:12px}
    .toolbar{display:flex;align-items:center;gap:16px;min-height:46px}
    .question{font-size:var(--fs-lead);font-weight:720;margin-right:auto}
    .metrics{display:flex;gap:12px;color:var(--muted);font-size:var(--fs-label)}
    .metric{padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
    .arena{display:flex;gap:16px;min-height:0;flex:1}
    .bench{flex:1.15;min-width:0;padding:16px;border:2px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface);display:flex;flex-direction:column;gap:10px}
    .bench-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .controls{display:flex;gap:12px;align-items:center}.controls .ctl{min-width:0}
    select,input,button{font:inherit}.controls select{min-height:42px;border:1px solid var(--line-strong);border-radius:8px;background:white;padding:6px 10px}
    .range{flex:1}.range output{min-width:28px;font-weight:750;color:var(--accent-strong)}
    .machine{display:flex;align-items:stretch;gap:12px;min-height:104px}
    .inputs{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:var(--fs-sec);line-height:1.45}
    .blackbox{width:150px;display:flex;align-items:center;justify-content:center;border:3px solid #173640;border-radius:10px;background:#102b34;color:white;font-weight:750;letter-spacing:.08em}
    .signal{flex:1;padding:12px;border:1px solid var(--accent);border-radius:10px;background:var(--accent-soft)}
    .signal strong{display:block;font-size:26px;color:var(--accent-strong)}
    .signal-line{height:9px;margin-top:8px;border-radius:99px;background:linear-gradient(90deg,var(--surface-3),var(--accent));position:relative}
    .signal-dot{position:absolute;top:50%;width:16px;height:16px;border:3px solid white;border-radius:50%;background:var(--warm);transform:translate(-50%,-50%);transition:left .25s ease}
    .feedback{min-height:46px;padding:9px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);font-size:var(--fs-sec);line-height:1.45}
    .judge{display:flex;gap:12px;align-items:center}.judge select{flex:1;min-height:42px;border:1px solid var(--line-strong);border-radius:8px;background:white;padding:6px 10px}
    .board{flex:.85;min-width:0;border:1px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface);overflow:hidden}
    .board-title,.hyp{display:grid;grid-template-columns:1.35fr .8fr .55fr .85fr;gap:8px;align-items:center;padding:9px 12px}
    .board-title{background:var(--surface-2);border-bottom:2px solid var(--line-strong);font-size:var(--fs-label);font-weight:700}
    .hyp{min-height:60px;border-bottom:1px solid var(--line);font-size:var(--fs-sec);line-height:1.35}
    .hyp.focus{box-shadow:inset 5px 0 0 var(--accent);background:var(--accent-soft)}
    .hyp.out{border-left:5px dashed var(--warm);background:var(--warm-soft)}
    .hyp.keep{border:2px solid var(--success);background:var(--success-soft)}
    .status{font-size:var(--fs-label);font-weight:700}.cracks{font-variant-numeric:tabular-nums}
    .process-wrap{position:relative}.k-process{gap:24px;--process-axis-y:50%}.k-process>.step{padding:8px 6px;text-align:center;font-size:var(--fs-label);font-weight:700}.k-process>.arw{width:24px;transform:translate(-24px,-50%)}
    .loop{position:absolute;right:16px;bottom:-15px;color:var(--accent-strong);font-size:var(--fs-label);font-weight:700}
    .records{height:62px;display:flex;gap:8px;overflow:hidden}.rec{flex:1;min-width:0;padding:7px 9px;border-left:3px solid var(--line-strong);background:var(--surface-2);font-size:var(--fs-label);line-height:1.35}
    .empty{color:var(--muted);font-size:var(--fs-sec);align-self:center}
    button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body data-page="28" data-total="48">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/seedrandom.min.js"></script>
  <script>
    Lec.mount({index:28,kicker:"SCIENCE / CORRECTION",title:"好解释，要先冒被证据否定的风险",take:"科学的力量来自公开预测、测量、纠错和可重复，而不是科学家从不犯错。"});
    Deck.init({index:28,total:48});
    const C={min:Lec.P.finiteNumber(0,0),max:Lec.P.finiteNumber(10,10),base:Lec.P.finiteNumber(5,5),outMin:Lec.P.finiteNumber(0,0),outMax:Lec.P.finiteNumber(100,100),outBase:Lec.P.finiteNumber(50,50),noise:Lec.P.finiteNumber(4,4),tol:Lec.P.finiteNumber(8,8),repeat:Lec.P.finiteNumber(3,3),distinct:Lec.P.finiteNumber(2,2),trials:Lec.P.finiteNumber(9,9)};
    const names=["光照","温度","按键"], explanations=["光照决定输出","温度决定输出","按键次数决定输出","输出只是随机变化"];
    const main=document.getElementById('main');
    main.innerHTML=`<section class="lab"><div class="toolbar"><div class="question">信号盒的输出主要由哪个输入决定？</div><div class="metrics"><span class="metric" id="variant">题组 1</span><span class="metric" id="left"></span></div><button class="btn" id="reset">重置本局</button></div><div class="arena"><section class="bench min0"><div class="bench-head"><h2>黑箱实验台</h2><span class="label muted">每次只改变一个输入</span></div><div class="controls"><div class="ctl"><label for="cond">改变</label><select id="cond"><option value="0">光照强度</option><option value="1">环境温度</option><option value="2">按键次数</option></select></div><div class="ctl range"><label for="value">设为</label><input id="value" type="range" min="0" max="10" step="1" value="10"><output id="val">10</output></div><button class="btn" id="act">锁定公开预测</button></div><div class="machine"><div class="inputs" id="inputs"></div><div class="blackbox">SIGNAL BOX</div><div class="signal"><span class="label">测量输出</span><strong id="output">—</strong><span class="label" id="uncertainty">波动不超过 ±4 信号单位</span><div class="signal-line"><i class="signal-dot" id="dot" style="left:50%"></i></div></div></div><div class="judge"><label class="label" for="verdict">聚焦解释与本次结果</label><select id="verdict" disabled><option value="match">与预测相符</option><option value="unclear">结果不足以区分</option><option value="conflict">与预测冲突</option></select></div><div class="feedback" id="feedback" aria-live="polite">选择一个条件，先锁定所有解释的预测；锁定后本轮不得修改。</div></section><section class="board min0"><div class="board-title"><span>候选解释</span><span>公开预测</span><span>冲突</span><span>状态</span></div><div id="hyps"></div></section></div><div class="process-wrap"><div class="k-process" id="process"><i class="axis"></i></div><div class="loop">↩ 重复检验返回公开预测</div></div><div class="records" id="records"><span class="empty">测量记录会保留在这里，解释退出后也不消失。</span></div></section>`;
    let state;
    function fresh(){const rng=new Math.seedrandom('apeman-spaceman-p28'); const truth=Math.floor(rng()*3), sign=rng()>.5?1:-1, strength=C.tol+2+rng()*12; return {rng,truth,sign,strength,phase:'choose',trial:0,focus:0,conf:[0,0,0,0],out:[false,false,false,false],used:new Set(),records:[],measurement:null};}
    function direction(i,cond,val){if(i===3)return '无稳定方向';if(i!==cond)return '基本不变';const d=val-C.base;if(!d)return '基本不变';return d*state.sign>0?'升高':'降低';}
    function measuredDir(v){const d=v-C.outBase;return Math.abs(d)<=C.tol?'基本不变':d>0?'升高':'降低';}
    function activeFocus(){for(let n=0;n<4;n++){const i=(state.focus+n)%4;if(!state.out[i]){state.focus=i;return i}}return 0}
    function render(){document.getElementById('left').textContent=`剩余测量：${C.trials-state.trial}`; const cond=+document.getElementById('cond').value,val=+document.getElementById('value').value; document.getElementById('val').value=val; document.getElementById('inputs').innerHTML=names.map((n,i)=>`${n}：<b>${i===cond?val:C.base}</b>${i===cond?'（改变）':''}`).join('<br>');
      const f=activeFocus(); document.getElementById('hyps').innerHTML=explanations.map((x,i)=>`<div class="hyp ${i===f&&!state.out[i]?'focus':''} ${state.out[i]?'out':''}"><span>${'甲乙丙丁'[i]}：${x}</span><span>${state.phase==='choose'?'待锁定':direction(i,cond,val)}</span><span class="cracks">${state.conf[i]} / ${C.repeat}</span><span class="status">${state.out[i]?'与证据冲突':state.records.length?'暂时保留':'待检验'}</span></div>`).join('');
      const steps=['提出问题','并列解释','公开预测','运行测量','对照淘汰','重复检验'];let current=state.phase==='choose'?2:state.phase==='locked'?3:state.phase==='judge'?4:5;document.getElementById('process').innerHTML='<i class="axis"></i>'+steps.map((s,i)=>`<div class="step ${i===current?'is-current':''} ${i<current?'is-done':''}">${i+1} ${s}</div>${i<5?'<i class="arw" style="left:'+((i+1)*16.67)+'%"></i>':''}`).join('');
      document.getElementById('records').innerHTML=state.records.length?state.records.slice(-5).map(r=>`<div class="rec">#${r.n} ${names[r.cond]}=${r.val}<br><b>${r.out} 信号单位</b> · ${r.dir}</div>`).join(''):'<span class="empty">测量记录会保留在这里，解释退出后也不消失。</span>';
    }
    function reset(){state=fresh();document.getElementById('act').textContent='锁定公开预测';document.getElementById('verdict').disabled=true;document.getElementById('cond').disabled=false;document.getElementById('value').disabled=false;document.getElementById('output').textContent='—';document.getElementById('feedback').textContent='选择一个条件，先锁定所有解释的预测；锁定后本轮不得修改。';render()}
    document.getElementById('value').addEventListener('input',render);document.getElementById('cond').addEventListener('change',render);document.getElementById('reset').addEventListener('click',reset);
    document.getElementById('act').addEventListener('click',()=>{const cond=+document.getElementById('cond').value,val=Lec.P.clamp(+document.getElementById('value').value,C.min,C.max),btn=document.getElementById('act'),ver=document.getElementById('verdict');
      if(state.phase==='choose'){state.phase='locked';document.getElementById('cond').disabled=true;document.getElementById('value').disabled=true;btn.textContent='运行测量';document.getElementById('feedback').textContent='预测已公开且锁定。现在运行测量，观察信号与波动范围。';}
      else if(state.phase==='locked'){const noise=(state.rng()*2-1)*C.noise;const response=cond===state.truth?state.sign*state.strength*(val-C.base)/5:0;const out=Lec.P.round(Lec.P.clamp(C.outBase+response+noise,C.outMin,C.outMax),0);state.measurement={cond,val,out,dir:measuredDir(out)};state.trial++;state.used.add(cond);document.getElementById('output').textContent=out+' 信号单位';document.getElementById('dot').style.left=out+'%';state.phase='judge';ver.disabled=false;btn.textContent='提交判断';document.getElementById('feedback').textContent=`判断聚焦的解释${'甲乙丙丁'[state.focus]}：比较锁定预测与本次测量。`;}
      else if(state.phase==='judge'){const f=state.focus,m=state.measurement,p=direction(f,m.cond,m.val);let actual=(f===3)?'unclear':(p===m.dir?'match':'conflict');if(ver.value!==actual){document.getElementById('feedback').textContent=actual==='conflict'?'预测与测量方向冲突；但一次异常还不能淘汰，请重复。':actual==='unclear'?'这次结果不能区分随机解释与稳定解释。':'测量落在预测方向内。';return} if(actual==='conflict')state.conf[f]++;else if(actual==='match')state.conf[f]=0;if(state.conf[f]>=C.repeat)state.out[f]=true;state.records.push({...m,n:state.trial});state.focus=(f+1)%4;const alive=state.out.filter(x=>!x).length;if(alive===1&&state.used.size>=C.distinct){state.phase='done';btn.textContent='暂时保留，并允许别人重做';btn.disabled=true;document.getElementById('feedback').textContent='一次相符只能增加信心；稳定冲突迫使解释被淘汰或修订。剩下的解释仍只是暂时保留。';}else if(state.trial>=C.trials){state.phase='done';btn.textContent='测量次数已用完';btn.disabled=true;document.getElementById('feedback').textContent='证据还不足：可能缺少有区分力的条件，或冲突尚未重复。重置后再规划实验。';}else{state.phase='choose';btn.textContent='锁定下一轮预测';ver.disabled=true;document.getElementById('cond').disabled=false;document.getElementById('value').disabled=false;document.getElementById('feedback').textContent='本轮已写入记录。换一个有区分力的条件，或重复确认冲突。';}}
      render();
    });
    reset();
  </script>
</body>
</html>
