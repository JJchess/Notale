<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>工业化的两面</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-header__progress{font-size:0;line-height:0}
    .p29{height:100%;display:flex;flex-direction:column;gap:16px;min-height:0}
    .trunk{display:flex;align-items:center;gap:24px;padding:14px 20px;border-left:7px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius-md) var(--radius-md) 0}
    .trunk .lead{flex:1;min-width:0}
    .era{flex:0 0 330px;padding-left:18px;border-left:1px solid var(--line-strong)}
    .era strong{display:block;color:var(--accent-strong);font-size:var(--fs-h2);line-height:1.35}
    .comparison-shell{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;background:var(--surface)}
    .compare-head{display:grid;grid-template-columns:1fr 190px 1fr;align-items:center;min-height:52px;background:var(--surface-2);border-bottom:3px solid var(--line-strong)}
    .compare-head strong{font-size:var(--fs-h2);line-height:1.35;padding:0 20px}
    .compare-head strong:last-child{text-align:right;color:var(--warm)}
    .compare-head strong:first-child{color:var(--success)}
    .question{text-align:center;font-size:var(--fs-sec);line-height:1.45;font-weight:700}
    .balance{position:relative;height:54px;margin:0 210px;touch-action:none;cursor:ew-resize}
    .rail{position:absolute;left:0;right:0;top:24px;height:4px;border-radius:999px;background:linear-gradient(90deg,var(--success),var(--line-strong) 50%,var(--warm))}
    .rail:after{content:"";position:absolute;left:50%;top:-8px;width:2px;height:20px;background:var(--text)}
    .weight{position:absolute;top:10px;width:34px;height:30px;border:2px solid var(--text);border-radius:7px;background:var(--surface);box-shadow:var(--shadow);transform:translateX(-50%)}
    .weight:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
    .weight:after{content:"秤砣";position:absolute;top:32px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:var(--fs-label);font-weight:700}
    .chart-wrap{position:relative;flex:1;min-height:0}
    #chart{position:absolute;inset:0}
    .chart-note{position:absolute;right:16px;bottom:7px;font-size:var(--fs-label);line-height:1.4;color:var(--muted);pointer-events:none}
    .status{min-height:30px;padding:5px 18px;border-top:1px solid var(--line);text-align:center;font-size:var(--fs-sec);line-height:1.45;font-weight:650}
  </style>
</head>
<body data-page="29" data-total="48">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script>
    Lec.mount({
      index: 29,
      kicker: "POWER / PRICE",
      title: "同一种工业能力，扩大生活机会，也扩大外部代价",
      take: "工业能力同时带来寿命、运输和知识扩张，也带来污染、战争与碳排放。"
    });
    Deck.init({ index: 29, total: 48 });

    const main = document.getElementById('main');
    const year = Lec.P.round(Lec.P.finiteNumber(1760, 1760), 0);
    main.innerHTML = `
      <section class="p29">
        <div class="trunk">
          <p class="lead">高密度能源、机器生产与大规模组织，共同扩大了工业系统的能力。</p>
          <p class="era sec"><strong>约 ${year} 年起</strong>常用教学近似起点，并非全球同步进入工业社会。</p>
        </div>
        <section class="comparison-shell k-comparison" style="display:flex" aria-label="工业能力与外部代价的同维度比较">
          <div class="compare-head">
            <strong>能力扩张</strong><span class="question" id="question">同一系统的两面</span><strong>外部代价</strong>
          </div>
          <div class="balance no-pan" id="balance" aria-label="工业代价秤拖动区域">
            <div class="rail"></div>
            <div class="weight" id="weight" role="slider" tabindex="0" aria-label="调整观察重心" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></div>
          </div>
          <div class="chart-wrap">
            <div id="chart" role="img" aria-label="四个共同维度的镜像条带；左右长度固定且等长，不代表可相加的实测数量"></div>
            <span class="chart-note">条带等长只表示两面都要纳入判断</span>
          </div>
          <p class="status" id="status" aria-live="polite">同一系统的两面不能拆开判断。</p>
        </section>
      </section>`;

    const rows = ['健康与生产','运输与连接','知识与制造','能源与力量'];
    const gains = ['食物、清洁水与医疗机会扩大','人员与物资移动更快、更稳定','知识复制、测量与传播扩展','城市与复杂工程获得高功率'];
    const costs = ['职业暴露与污染风险集中','污染、噪声与生态切割增加','也可用于监控、宣传与破坏','碳累积与战争动员能力扩大'];
    const chart = echarts.init(document.getElementById('chart'), null, {renderer:'svg'});
    let p = 0.5;
    function option(){
      const leftA = 0.38 + (1-p)*0.62, rightA = 0.38 + p*0.62;
      return {
        animation:false,
        textStyle:{fontFamily:getComputedStyle(document.documentElement).getPropertyValue('--font-sans'),fontSize:16},
        grid:{left:220,right:220,top:2,bottom:34,containLabel:false},
        xAxis:{type:'value',min:-1,max:1,show:false},
        yAxis:{type:'category',data:rows,inverse:true,axisLine:{show:true,lineStyle:{color:'#77898d',width:2}},axisTick:{show:false},axisLabel:{fontSize:15,fontWeight:700,color:'#18212b',margin:22,width:130,align:'center'}},
        series:[
          {type:'bar',barWidth:40,data:rows.map(()=>-0.92),itemStyle:{color:`rgba(57,115,77,${leftA})`,borderRadius:[7,0,0,7]},label:{show:true,position:'insideLeft',distance:12,fontSize:16,lineHeight:23,color:'#102419',fontWeight:p<0.38?700:500,formatter:x=>gains[x.dataIndex]}},
          {type:'bar',barWidth:40,data:rows.map(()=>0.92),itemStyle:{color:`rgba(201,93,50,${rightA})`,borderRadius:[0,7,7,0]},label:{show:true,position:'insideRight',distance:12,fontSize:16,lineHeight:23,color:'#35170e',fontWeight:p>0.62?700:500,formatter:x=>costs[x.dataIndex]}}
        ]
      };
    }
    const weight=document.getElementById('weight'), status=document.getElementById('status'), question=document.getElementById('question'), balance=document.getElementById('balance');
    function render(){
      weight.style.left=(p*100)+'%';
      weight.setAttribute('aria-valuenow',String(Math.round(p*100)));
      if(p<0.38){question.textContent='能力扩大了什么？';status.textContent='工业能力扩大生活机会，但这些机会并非同步到达所有群体。';}
      else if(p>0.62){question.textContent='代价落在谁身上，并持续多久？';status.textContent='风险常集中到特定工人、地区，并把碳排放留给后续世代。';}
      else {question.textContent='同一系统的两面';status.textContent='同一系统的两面不能拆开判断。';}
      chart.setOption(option(),true);
    }
    function setFromEvent(e){const q=Deck.pt(balance,e);p=Lec.P.clamp(Lec.P.finiteNumber(q.x/balance.offsetWidth,0.5),0,1);render();}
    balance.addEventListener('pointerdown',e=>{balance.setPointerCapture(e.pointerId);setFromEvent(e);weight.focus();});
    balance.addEventListener('pointermove',e=>{if(balance.hasPointerCapture(e.pointerId))setFromEvent(e);});
    weight.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')p-=0.1;else if(e.key==='ArrowRight')p+=0.1;else if(e.key==='Home')p=0;else if(e.key==='End')p=1;else return;e.preventDefault();p=Lec.P.clamp(Lec.P.finiteNumber(p,0.5),0,1);render();});
    window.setFocus=v=>{p=Lec.P.clamp(Lec.P.finiteNumber(v,0.5),0,1);render();};
    Deck.onResize(()=>chart.resize());
    render();
  </script>
</body>
</html>
