<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一枚火箭，来自六条地面支撑</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lec-header__progress{overflow:visible}
  .supply-page{height:620px;display:flex;flex-direction:column;gap:12px}
  .topline{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:42px}
  .instruction{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
  .progress{font-size:var(--fs-label);font-weight:720;color:var(--accent-strong);white-space:nowrap}
  .supply-map.k-generalization{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 286px;gap:24px;align-items:stretch;flex:1;min-height:0}
  .supply-map.k-generalization>.supports{order:1;position:relative;padding:0;display:block;min-height:0;border:1px solid var(--line);border-radius:var(--radius-md);background:rgb(255 253 248 / 72%);overflow:hidden}
  .supply-map.k-generalization>.supports>.trunk{display:none}
  .supply-map.k-generalization>.claim{order:2;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 22px;border:2px solid var(--line-strong);border-inline-start:8px solid var(--line-strong);background:var(--surface-2);font-size:var(--fs-lead);font-weight:760;line-height:var(--lh-copy);transition:background .2s,border-color .2s}
  .supply-map.k-generalization>.claim.is-live{border-color:var(--accent);border-inline-start-color:var(--accent);background:var(--accent-soft)}
  .launch-mark{width:84px;height:92px;margin-bottom:18px;position:relative;border-bottom:5px solid currentColor;color:var(--line-strong)}
  .launch-mark:before{content:"";position:absolute;left:35px;bottom:10px;width:14px;height:58px;border:3px solid currentColor;border-radius:50% 50% 8px 8px;transform:rotate(-8deg)}
  .launch-mark:after{content:"↗";position:absolute;right:2px;top:-8px;font-size:48px;line-height:1}
  .claim.is-live .launch-mark{color:var(--accent-strong)}
  .claim-title{font-size:var(--fs-h2);line-height:1.35}
  .claim-copy{margin-top:12px;font-size:var(--fs-sec);font-weight:520;line-height:var(--lh-sec);color:var(--muted)}
  .workspace{position:absolute;inset:0}
  .pool{position:absolute;left:16px;top:44px;width:328px;height:442px;padding:12px;border-right:1px dashed var(--line-strong)}
  .area-title{position:absolute;top:12px;left:18px;font-size:var(--fs-label);font-weight:720;color:var(--muted)}
  .layer{position:absolute;left:370px;right:16px;border:2px dashed var(--line);border-radius:var(--radius-md);background:rgb(233 238 240 / 55%);transition:border-color .15s,background .15s}
  .layer[data-layer="0"]{top:44px;height:142px}
  .layer[data-layer="1"]{top:198px;height:204px}
  .layer[data-layer="2"]{top:414px;height:90px}
  .layer.is-candidate{border-color:var(--accent);background:var(--accent-soft)}
  .layer-label{position:absolute;left:12px;top:8px;font-size:var(--fs-label);font-weight:750;color:var(--accent-strong)}
  .card{position:absolute;width:148px;min-height:76px;padding:10px 12px;border:2px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);box-shadow:0 5px 14px rgb(24 33 43 / 10%);cursor:grab;touch-action:none;user-select:none;z-index:4;transition:box-shadow .15s,border-color .15s,background .15s}
  .card:focus-visible{outline:4px solid rgb(0 111 139 / 28%);outline-offset:2px}
  .card.is-dragging{cursor:grabbing;box-shadow:var(--shadow);z-index:8}
  .card.is-locked{cursor:pointer;border-color:var(--success);background:var(--success-soft)}
  .card h2{font-size:18px;line-height:1.35;margin:0 0 4px}
  .card p{font-size:14px;line-height:1.4;color:var(--muted)}
  .card .more{display:none;margin-top:5px;padding-top:5px;border-top:1px solid var(--line);font-size:14px;line-height:1.4;color:var(--text)}
  .card.is-open .more{display:block}
  .links{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
  .dep{fill:none;stroke:var(--line-strong);stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}
  .mainlink{fill:none;stroke:var(--accent);stroke-width:3;marker-end:url(#arrowLive)}
  .feedback{position:absolute;left:18px;bottom:12px;width:320px;min-height:46px;font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted);z-index:5}
  .reset{min-height:42px;padding:8px 15px;border:1px solid var(--accent-strong);border-radius:var(--radius-sm);background:var(--accent);color:#fff;font:680 var(--fs-label)/1.4 var(--font-sans);cursor:pointer}
  @media (prefers-reduced-motion:reduce){.card,.layer,.claim{transition:none!important}}
</style>
</head>
<body data-page="30" data-total="48">
<div id="stage"><main id="main"></main></div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
Lec.mount({index:30,kicker:"GROUND SYSTEMS",title:"一枚火箭，来自六条地面支撑",take:"火箭是矿业、能源、制造、测量、计算和国家组织共同结出的果实。"});
Deck.init({index:30,total:48});
const main=document.getElementById('main');
main.innerHTML=`
<section class="supply-page">
  <div class="topline"><p class="instruction">拖动卡片接入三层接口；看哪些依赖线随之连通。键盘可用方向键选层，Enter 接入。</p><div class="row ai-center gap-4"><span id="count" class="progress" aria-live="polite"></span><button id="reset" class="reset" type="button">重新拼接</button></div></div>
  <div class="supply-map k-generalization">
    <div class="supports min0">
      <div class="trunk"></div><div id="workspace" class="workspace no-pan">
        <svg id="links" class="links" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#77898d"/></marker><marker id="arrowLive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#007c91"/></marker></defs></svg>
        <div class="area-title">待接入支撑</div><div class="pool" aria-hidden="true"></div>
        <div class="layer" data-layer="0"><span class="layer-label">物质基础 · 2 个接口</span></div>
        <div class="layer" data-layer="1"><span class="layer-label">工业与信息 · 3 个接口</span></div>
        <div class="layer" data-layer="2"><span class="layer-label">集体组织 · 1 个接口</span></div>
        <div id="feedback" class="feedback" aria-live="polite">先观察六张散卡：发射能力尚未形成。</div>
      </div>
    </div>
    <div id="claim" class="claim min0"><div class="launch-mark" aria-hidden="true"></div><div class="claim-title">可执行的发射能力</div><p id="claimCopy" class="claim-copy">六条地面支撑尚未汇合。</p></div>
  </div>
</section>`;
const supports=[
 {id:'mining',name:'矿业',layer:0,short:'稳定材料让设计成为实物。',provide:'提供金属、矿物与可追溯原料。',deps:'依赖能源动力与测量判定。',links:['manufacture']},
 {id:'energy',name:'能源',layer:0,short:'发射前已消耗庞大地面能量。',provide:'提供开采、加工与设施电力。',deps:'支撑矿业、制造与计算。',links:['mining','manufacture','compute']},
 {id:'manufacture',name:'制造',layer:1,short:'能做一次，不等于稳定再做一次。',provide:'把设计变成可重复生产的实物。',deps:'接收材料、动力、检验与设计。',links:[]},
 {id:'measure',name:'测量',layer:1,short:'共同测量才能确认是否合格。',provide:'提供记录、检验结果与误差范围。',deps:'支持矿业判定、制造检验与计算验证。',links:['mining','manufacture','compute']},
 {id:'compute',name:'计算',layer:1,short:'把分散信息变成协调决定。',provide:'处理设计、排程与检测信息。',deps:'使用测量数据，反馈制造要求。',links:['manufacture']},
 {id:'state',name:'国家组织',layer:2,short:'长期公共组织让网络持续运转。',provide:'提供资金、标准、采购与责任安排。',deps:'为能源、测量、计算和制造建立条件。',links:['energy','measure','compute','manufacture']}
];
const poolPos=[[18,78],[178,78],[18,170],[178,170],[18,262],[178,262]];
const slotPos={0:[[410,84],[650,84]],1:[[410,238],[650,238],[890,238]],2:[[650,438]]};
const workspace=document.getElementById('workspace'), svg=d3.select('#links');
const locked=new Set(); let keyboardLayer=new Map(); let drag=null;
function safeNum(v,f=0){return Lec.P.finiteNumber(v,f)}
function setTransform(el,x,y){el.dataset.x=x;el.dataset.y=y;el.style.transform=`translate(${x}px,${y}px)`}
supports.forEach((d,i)=>{const el=document.createElement('div');el.className='card';el.id='card-'+d.id;el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',`${d.name}：${d.short}`);el.innerHTML=`<h2>${d.name}</h2><p>${d.short}</p><p class="more">${d.provide}<br>${d.deps}</p>`;workspace.appendChild(el);setTransform(el,...poolPos[i]);el.addEventListener('pointerdown',e=>startDrag(e,d,el));el.addEventListener('click',()=>{if(locked.has(d.id)){el.classList.toggle('is-open');drawLinks()}});el.addEventListener('keydown',e=>keyCard(e,d,el));});
function layerEls(){return [...document.querySelectorAll('.layer')]}
function highlight(n){layerEls().forEach((el,i)=>el.classList.toggle('is-candidate',i===n))}
function startDrag(e,d,el){if(locked.has(d.id))return;e.preventDefault();el.setPointerCapture(e.pointerId);const p=Deck.pt(workspace,e);drag={d,el,dx:p.x-safeNum(el.dataset.x),dy:p.y-safeNum(el.dataset.y),pointer:e.pointerId};el.classList.add('is-dragging');highlight(d.layer);el.addEventListener('pointermove',moveDrag);el.addEventListener('pointerup',endDrag,{once:true});el.addEventListener('pointercancel',endDrag,{once:true})}
function moveDrag(e){if(!drag)return;const p=Deck.pt(workspace,e);setTransform(drag.el,p.x-drag.dx,p.y-drag.dy);drawLinks()}
function endDrag(e){if(!drag)return;const {d,el}=drag;el.classList.remove('is-dragging');el.removeEventListener('pointermove',moveDrag);const p=Deck.pt(workspace,e);const layers=layerEls();let found=-1;layers.forEach((l,i)=>{const y=safeNum(l.offsetTop),h=safeNum(l.offsetHeight);if(p.y>=y&&p.y<=y+h)found=i});if(found===d.layer)lockCard(d,el);else{const i=supports.indexOf(d);setTransform(el,...poolPos[i]);document.getElementById('feedback').textContent=wrongMessage(d,found)}highlight(-1);drag=null;drawLinks()}
function wrongMessage(d,found){if(found<0)return `${d.name}尚未接入：请放进一种接口层。`;if(d.id==='measure')return '接口不匹配：测量产生可比较记录，不直接提供原料。';if(d.id==='state')return '接口不匹配：组织协调持续条件，不直接生产材料或信息。';return `接口不匹配：${d.name}提供的能力与这一层不同。`}
function lockCard(d,el){if(locked.has(d.id))return;const peers=supports.filter(x=>x.layer===d.layer&&locked.has(x.id)).length;const pos=slotPos[d.layer][peers];setTransform(el,...pos);locked.add(d.id);el.classList.add('is-locked','is-open');el.setAttribute('aria-pressed','true');document.getElementById('feedback').textContent=`${d.name}已接入：${d.provide}`;update()}
function keyCard(e,d,el){if(locked.has(d.id)){if(e.key==='Enter'||e.key===' '){e.preventDefault();el.classList.toggle('is-open');drawLinks()}return}let n=keyboardLayer.has(d.id)?keyboardLayer.get(d.id):d.layer;if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();n=Math.min(2,n+1);keyboardLayer.set(d.id,n);highlight(n);document.getElementById('feedback').textContent=`当前选择：${layerEls()[n].textContent.trim()}，按 Enter 接入。`}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();n=Math.max(0,n-1);keyboardLayer.set(d.id,n);highlight(n);document.getElementById('feedback').textContent=`当前选择：${layerEls()[n].textContent.trim()}，按 Enter 接入。`}else if(e.key==='Enter'){e.preventDefault();if(n===d.layer)lockCard(d,el);else document.getElementById('feedback').textContent=wrongMessage(d,n);highlight(-1)}else if(e.key==='Escape'){keyboardLayer.delete(d.id);highlight(-1);document.getElementById('feedback').textContent='已取消本次选择。'}}
function center(id){const el=document.getElementById('card-'+id);return [safeNum(el.dataset.x)+el.offsetWidth/2,safeNum(el.dataset.y)+el.offsetHeight/2]}
function drawLinks(){svg.selectAll('path.line').remove();const lines=[];supports.forEach(d=>{if(!locked.has(d.id))return;d.links.forEach(t=>{if(locked.has(t)){const a=center(d.id),b=center(t);lines.push({a,b,kind:'dep'})}})});const rootX=workspace.clientWidth+24,rootY=workspace.clientHeight/2;if(locked.size===supports.length)supports.forEach(d=>lines.push({a:center(d.id),b:[rootX,rootY],kind:'mainlink'}));svg.selectAll('path.line').data(lines).join('path').attr('class',d=>`line ${d.kind}`).attr('d',d=>`M${d.a[0]},${d.a[1]} C${(d.a[0]+d.b[0])/2},${d.a[1]} ${(d.a[0]+d.b[0])/2},${d.b[1]} ${d.b[0]},${d.b[1]}`)}
function update(){const total=Lec.P.round(Lec.P.finiteNumber(supports.length,0),0);const current=Lec.P.round(Lec.P.clamp(Lec.P.finiteNumber(locked.size,0),0,total),0);document.getElementById('count').textContent=`已接入：${current} / ${total}`;const done=current===total;document.getElementById('claim').classList.toggle('is-live',done);document.getElementById('claimCopy').textContent=done?'材料、动力、生产、信息、计算与长期组织同时可用，发射才成为集体行动。':'六条地面支撑尚未汇合。';if(done)document.getElementById('feedback').textContent='六条主线同时汇合：结果属于整个网络，而非任一节点。';drawLinks()}
function resetAll(){locked.clear();keyboardLayer.clear();supports.forEach((d,i)=>{const el=document.getElementById('card-'+d.id);el.className='card';el.setAttribute('aria-pressed','false');setTransform(el,...poolPos[i])});document.getElementById('feedback').textContent='先观察六张散卡：发射能力尚未形成。';highlight(-1);update()}
document.getElementById('reset').addEventListener('click',resetAll);window.addEventListener('resize',drawLinks);update();
</script>
</body>
</html>
