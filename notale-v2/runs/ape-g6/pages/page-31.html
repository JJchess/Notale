<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>太空人站在一整段人类历史之上</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .plate{
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      padding:0 56px;
      background-image:linear-gradient(rgb(119 137 141 / 10%) 1px,transparent 1px),linear-gradient(90deg,rgb(119 137 141 / 8%) 1px,transparent 1px);
      background-size:100% 52px,52px 100%;
      background-position:center;
    }
    .plate.k-generalization{display:flex;align-items:center;gap:14px}
    .plate.k-generalization>.claim{
      width:1100px;
      min-height:106px;
      padding:10px 30px 12px;
      border:1px solid var(--line-strong);
      border-top:4px solid var(--accent);
      border-inline-start:1px solid var(--line-strong);
      border-radius:var(--radius-sm);
      background:rgb(255 253 248 / 92%);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:28px;
      text-align:left;
      box-shadow:0 8px 22px rgb(24 33 43 / 8%);
    }
    .astronaut{width:64px;height:78px;flex:0 0 auto;color:var(--accent-strong)}
    .claim-copy{max-width:690px}
    .claim-copy strong{display:block;font-size:var(--fs-h2);line-height:1.35;color:var(--text)}
    .claim-copy span{display:block;margin-top:4px;font-size:var(--fs-sec);font-weight:500;line-height:var(--lh-sec);color:var(--muted)}
    .plate.k-generalization>.supports{
      width:1140px;
      flex:1 1 auto;
      padding:0;
      gap:7px;
      align-items:center;
      justify-content:flex-start;
    }
    .plate.k-generalization>.supports>.trunk{
      z-index:0;top:-15px;bottom:-5px;left:50%;width:4px;background:var(--accent);transform:translateX(-50%);
    }
    .plate.k-generalization>.supports>.support{
      z-index:1;
      min-height:70px;
      padding:9px 18px;
      border:1px solid var(--line-strong);
      border-radius:2px;
      background:rgb(255 253 248 / 96%);
      display:flex;
      align-items:center;
      gap:18px;
      box-shadow:none;
    }
    .plate.k-generalization>.supports>.support::before{display:none}
    .support:nth-of-type(2){width:72%}
    .support:nth-of-type(3){width:78%}
    .support:nth-of-type(4){width:84%}
    .support:nth-of-type(5){width:90%}
    .lec-header__progress{font-size:0;line-height:0}
    .part-mark{width:31%;flex:0 0 31%;font-size:var(--fs-label);font-weight:760;line-height:1.4;color:var(--accent-strong);letter-spacing:.02em}
    .part-copy{min-width:0;font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
    .joint{position:absolute;left:50%;width:16px;height:7px;border:2px solid var(--accent);background:var(--surface);transform:translate(-50%,-7px);z-index:3}
    .transition{
      width:1060px;
      padding-top:8px;
      border-top:1px solid var(--line);
      color:var(--text);
      font-size:var(--fs-sec);
      line-height:var(--lh-sec);
      text-align:center;
    }
    .transition strong{color:var(--accent-strong)}
  </style>
</head>
<body data-page="31" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="plate k-generalization" aria-label="太空人由四层历史能力共同托起的结构图">
        <div class="claim min0">
          <svg class="astronaut" viewBox="0 0 64 78" aria-hidden="true">
            <circle cx="32" cy="15" r="11" fill="none" stroke="currentColor" stroke-width="3"/>
            <path d="M23 27h18l5 25-9 5v16H27V57l-9-5 5-25Z" fill="none" stroke="currentColor" stroke-width="3"/>
            <path d="M22 31 10 45m32-14 12 14M27 57h10M25 38h14" fill="none" stroke="currentColor" stroke-width="3"/>
          </svg>
          <div class="claim-copy min0">
            <strong>“太空人”是巨大地面系统暂时汇聚后的可见顶点</strong>
            <span>我们最容易看见顶端的个人，真正托起他的是下方层层累积的能力。</span>
          </div>
        </div>

        <div class="supports min0">
          <div class="trunk" aria-hidden="true"></div>
          <div class="support min0">
            <span class="joint" aria-hidden="true"></span>
            <div class="part-mark">集体组织｜让许多人的工作形成同一行动</div>
            <p class="part-copy">分工、标准与制度连接分散能力，太空人才可能出现在顶端。</p>
          </div>
          <div class="support min0">
            <span class="joint" aria-hidden="true"></span>
            <div class="part-mark">能量与制造｜把意图放大成物质能力</div>
            <p class="part-copy">能源、材料与制造体系，让个人身体无法完成的尺度成为可能。</p>
          </div>
          <div class="support min0">
            <span class="joint" aria-hidden="true"></span>
            <div class="part-mark">累积文化｜跨代保存并改进知识</div>
            <p class="part-copy">工具、符号、教学与外部记忆，使个人从前人留下的位置继续。</p>
          </div>
          <div class="support min0">
            <span class="joint" aria-hidden="true"></span>
            <div class="part-mark">身体遗产｜能行动、操控与学习的身体</div>
            <p class="part-copy">双足、手与大脑提供可能性，但没有预写后来的技术。</p>
          </div>
        </div>

        <p class="transition"><strong>下一步：</strong>这一整套系统，怎样跨过离开地球的物理门槛？</p>
      </section>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 31,
      kicker: "GROUND BENEATH SPACE",
      title: "太空人站在一整段人类历史之上",
      take: "“太空人”不是脱离历史的人，而是站在巨大地面系统顶端的人。"
    });
    Deck.init({ index: 31, total: 48 });
  </script>
</body>
</html>
