<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>轨道不是没有重力，而是不断错过地面</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-header__progress{font-size:0;line-height:0}
    .orbit-page{height:100%;display:flex;flex-direction:column;gap:12px}.orbit-view{position:relative;height:302px;flex:0 0 302px;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-md);background:linear-gradient(#102b34,#173e48)}
    .orbit-view canvas{cursor:default}.scene-head{position:absolute;z-index:2;top:12px;font-size:var(--fs-h2);font-weight:700;color:#f6ffff}.scene-head.left{left:18px}.scene-head.right{left:calc(50% + 18px)}.divider{position:absolute;z-index:2;top:0;bottom:0;left:50%;border-left:1px dashed rgb(255 255 255 / 45%)}
    .legend{position:absolute;z-index:2;right:16px;top:14px;display:flex;gap:16px;color:#e8f5f4;font-size:var(--fs-label)}.legend i{display:inline-block;width:22px;height:3px;margin-right:7px;vertical-align:middle}.legend .g{background:#f1ba55}.legend .v{background:#79d6e5}
    .ctlbar{position:absolute;z-index:3;left:18px;right:18px;bottom:12px;display:flex;align-items:center;gap:16px;padding:8px 12px;border-radius:var(--radius-sm);background:rgb(255 253 248 / 94%)}.ctlbar .ctl{flex:1}.speed{min-width:126px;font-size:var(--fs-body);font-weight:720;color:var(--accent-strong);font-variant-numeric:tabular-nums}.snap{min-width:142px;font-size:var(--fs-label);color:var(--warm);font-weight:700}.model{position:absolute;z-index:2;left:18px;bottom:70px;color:#d6e6e7;font-size:var(--fs-label)}
    .compare-wrap{min-height:0;flex:1}.k-comparison{height:100%;grid-template-columns:minmax(150px,.62fr) repeat(2,minmax(0,1fr))}.k-comparison>.hdr{min-height:38px;padding:6px 12px;font-size:var(--fs-body)}.k-comparison>.dim,.k-comparison>.cell{padding:5px 12px}.k-comparison>.cell{font-size:16px;line-height:1.35}.k-comparison>.dim{font-size:15px}.k-comparison .lit{background:var(--accent-soft);transition:background .25s ease}.status{font-weight:750;color:var(--accent-strong)}
  </style>
</head>
<body data-page="32" data-total="48">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/matter.min.js"></script>
  <script>
    Lec.mount({index:32,kicker:"ORBITAL FALL",title:"轨道不是没有重力，而是不断错过地面",take:"轨道不是摆脱重力，而是在持续下落时不断错过地面。"});
    Deck.init({index:32,total:48});
    const main=document.getElementById('main');
    const K=Lec.K||{}, P=Lec.P;
    const earthM=P.finiteNumber(K.EARTH_RADIUS_M,6371000), altM=P.clamp(P.finiteNumber(K.LOW_EARTH_ORBIT_ALTITUDE_M,400000),0,earthM), orbitV=P.clamp(P.finiteNumber(K.LOW_EARTH_ORBIT_SPEED_MPS,7700),0,20000), g0=P.finiteNumber(K.EARTH_SURFACE_GRAVITY_MPS2,9.81);
    const km=n=>P.round(P.finiteNumber(n,0)/1000,0), kms=n=>P.round(P.finiteNumber(n,0)/1000,1);
    main.innerHTML=`<section class="orbit-page"><div class="orbit-view no-pan"><canvas class="cv-fill" id="orbitCanvas" role="img" aria-label="两幅同步侧视图比较苹果直接落地与在重力下持续绕行。"></canvas><div class="scene-head left">直接落下</div><div class="scene-head right">持续下落</div><div class="divider"></div><div class="legend"><span><i class="g"></i>重力方向</span><span><i class="v"></i>初始速度</span></div><div class="model">理想化二维模型：忽略大气阻力、地球非球形、自转与姿态控制；轨迹不用于任务级预测。</div><div class="ctlbar"><div class="ctl"><label for="throwSpeed">向右拖动投掷手柄</label><input id="throwSpeed" type="range" min="0" max="${orbitV}" step="100" value="${orbitV}" aria-describedby="speedStatus"></div><output class="speed" id="speedStatus" aria-live="polite"></output><span class="snap" id="snap">试试这个代表值</span><button class="btn" id="reset">重新投掷</button></div></div><div class="compare-wrap"><div class="k-comparison" aria-label="直接下落与持续下落比较"><div class="hdr">比较维度</div><div class="hdr">直接落下</div><div class="hdr">持续下落</div><div class="dim">初始运动</div><div class="cell">横向速度 <b id="zeroV"></b></div><div class="cell diff">横向速度 <b id="setV"></b></div><div class="rowline"></div><div class="dim">重力作用</div><div class="cell same">始终指向地心，使苹果接近地面</div><div class="cell same">同样指向地心，使方向持续弯曲</div><div class="rowline"></div><div class="dim">地面关系</div><div class="cell ground">轨迹很快与地表相交</div><div class="cell ground diff">球形地面持续弯离，轨迹不断错过</div><div class="rowline"></div><div class="dim">最终观察</div><div class="cell status" id="leftResult">下落并撞地</div><div class="cell status" id="rightResult">等待投掷</div></div></div></section>`;
    document.getElementById('zeroV').textContent=`${kms(P.clamp(0,0,orbitV))} km/s`;
    const slider=document.getElementById('throwSpeed'), speedOut=document.getElementById('speedStatus'), snap=document.getElementById('snap'), setV=document.getElementById('setV'), result=document.getElementById('rightResult');
    const cv=document.getElementById('orbitCanvas'), ctx=Deck.fit(cv), W=cv.offsetWidth,H=cv.offsetHeight;
    const {Engine,Bodies,Body,Composite}=Matter; const engine=Engine.create({gravity:{x:0,y:0,scale:0}});
    const scale=earthM/112; const centers=[{x:W*.25,y:207},{x:W*.75,y:207}]; const startR=(earthM+altM)/scale; let bodies=[],trails=[[],[]],running=false,t=0;
    function makeBody(c,v){const b=Bodies.circle(c.x,c.y-startR,6,{frictionAir:0,inertia:Infinity});Body.setVelocity(b,{x:v/scale/60,y:0});Composite.add(engine.world,b);return b}
    function reset(run=false){Composite.clear(engine.world,false);trails=[[],[]];t=0;bodies=[makeBody(centers[0],0),makeBody(centers[1],Number(slider.value))];running=run;result.textContent=run?'持续下落中':'等待投掷';document.querySelectorAll('.same,.ground').forEach(x=>x.classList.remove('lit'));draw()}
    function updateRead(){const v=P.clamp(P.finiteNumber(slider.value,0),0,orbitV);speedOut.textContent=`${kms(v)} km/s`;setV.textContent=`${kms(v)} km/s`;snap.textContent=Math.abs(v-orbitV)<150?'试试这个代表值':''}
    slider.addEventListener('input',()=>{updateRead();reset(false)}); slider.addEventListener('change',()=>reset(true)); document.getElementById('reset').addEventListener('click',()=>reset(false));
    function gravitate(b,c){const dx=c.x-b.position.x,dy=c.y-b.position.y,rpx=Math.hypot(dx,dy),rm=rpx*scale,g=g0*(earthM/rm)**2,acc=g/scale/3600;Body.applyForce(b,b.position,{x:(dx/rpx)*acc*b.mass,y:(dy/rpx)*acc*b.mass})}
    function lineArrow(x1,y1,x2,y2,color){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-9*Math.cos(a-.5),y2-9*Math.sin(a-.5));ctx.lineTo(x2-9*Math.cos(a+.5),y2-9*Math.sin(a+.5));ctx.fill()}
    function draw(){ctx.clearRect(0,0,W,H);centers.forEach((c,i)=>{ctx.fillStyle=Deck.rgba('--accent',.28);ctx.beginPath();ctx.arc(c.x,c.y,earthM/scale,Math.PI,Math.PI*2);ctx.lineTo(c.x+earthM/scale,H);ctx.lineTo(c.x-earthM/scale,H);ctx.fill();ctx.strokeStyle=Deck.rgba('--accent',.85);ctx.lineWidth=3;ctx.beginPath();ctx.arc(c.x,c.y,earthM/scale,Math.PI,Math.PI*2);ctx.stroke();ctx.fillStyle='#eef7f5';ctx.font='15px sans-serif';ctx.fillText(`高度约 ${km(altM)} km`,c.x-54,38);ctx.fillText(`地球半径约 ${km(earthM)} km`,c.x-67,225);ctx.strokeStyle=i?'#79d6e5':'#f0a86e';ctx.lineWidth=2;ctx.beginPath();trails[i].forEach((p,j)=>j?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();trails[i].forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,7);ctx.fillStyle=ctx.strokeStyle;ctx.fill()});const b=bodies[i];if(b){ctx.fillStyle='#d94b34';ctx.beginPath();ctx.arc(b.position.x,b.position.y,7,0,7);ctx.fill();const dx=c.x-b.position.x,dy=c.y-b.position.y,d=Math.hypot(dx,dy);lineArrow(b.position.x,b.position.y,b.position.x+dx/d*32,b.position.y+dy/d*32,'#f1ba55')}});if(!running){const b=bodies[1],len=90*(Number(slider.value)/orbitV);lineArrow(b.position.x,b.position.y,b.position.x+len,b.position.y,'#79d6e5')}}
    updateRead();reset(false);
    Deck.loop((now,dt)=>{if(running){const steps=Math.max(1,Math.round(dt/16));for(let s=0;s<steps;s++){bodies.forEach((b,i)=>gravitate(b,centers[i]));Engine.update(engine,16.666);t++;if(t%18===0)bodies.forEach((b,i)=>trails[i].push({x:b.position.x,y:b.position.y}));}if(t>45)document.querySelectorAll('.same').forEach(x=>x.classList.add('lit'));if(t>95)document.querySelectorAll('.ground').forEach(x=>x.classList.add('lit'));const rb=bodies[1],rr=Math.hypot(rb.position.x-centers[1].x,rb.position.y-centers[1].y)*scale;if(rr<=earthM){result.textContent='下落并撞地';running=false}else if(t>420){result.textContent='持续下落：不断错过地面';running=false}}draw()},{still:1});
  </script>
</body>
</html>
