<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>向后喷出质量，火箭就向前获得动量</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{height:auto}
    .page33{height:620px;display:flex;gap:32px;align-items:stretch}
    .lab{flex:1.35 1 0;display:flex;flex-direction:column;gap:12px;min-width:0}
    .theory{flex:1 1 0;display:flex;flex-direction:column;gap:14px;min-width:0}
    .chambers{position:relative;flex:1 1 0;min-height:0;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
    .chambers::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
    .env{position:absolute;z-index:2;left:16px;padding:5px 10px;border-radius:999px;background:var(--surface-2);font-size:var(--fs-label);font-weight:700;line-height:1.4}
    .env.air{top:14px}.env.vac{top:calc(50% + 14px)}
    .dir{position:absolute;z-index:2;right:16px;color:var(--accent-strong);font-size:var(--fs-label);font-weight:700;line-height:1.4}.dir.one{top:16px}.dir.two{top:calc(50% + 16px)}
    .controlbar{display:flex;align-items:center;justify-content:center;gap:16px;min-height:54px}
    .ignite{min-width:150px;min-height:48px;border:1px solid #8b351d;border-radius:var(--radius-sm);background:var(--warm);color:#fff;font:700 var(--fs-body)/1.4 var(--font-sans);cursor:pointer;box-shadow:0 5px 0 #8b351d}
    .ignite:active,.ignite.is-on{transform:translateY(3px);box-shadow:0 2px 0 #8b351d;background:#a94324}
    .reset{min-height:44px;padding:8px 16px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);font:650 var(--fs-label)/1.4 var(--font-sans);color:var(--text);cursor:pointer}
    .hint{font-size:var(--fs-label);line-height:1.4;color:var(--muted);text-align:center}
    .k-process.compact{height:142px;gap:20px;--process-axis-y:54%}
    .k-process.compact>.step{padding:14px 9px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:var(--fs-label);font-weight:700;line-height:1.4}
    .k-process.compact>.arw{width:20px;transform:translate(-20px,-50%);font-size:18px}
    .explain{min-height:74px;padding:14px 16px;border-inline-start:5px solid var(--accent);background:var(--accent-soft);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .formula{font-size:var(--fs-lead);font-weight:750;color:var(--accent-strong)}
    .ledger{padding:16px 18px}
    .ledger-title{font-size:var(--fs-h2);font-weight:700;line-height:1.35;margin-bottom:10px}
    .balance{position:relative;height:62px;display:flex;align-items:center;justify-content:center}
    .balance::before{content:"";position:absolute;left:50%;top:3px;bottom:3px;width:2px;background:var(--line-strong)}
    .bar{height:20px;max-width:46%;width:0;background:var(--warm);transition:width .12s linear}
    .bar.left{margin-left:auto;transform-origin:right;border-radius:9px 0 0 9px}.bar.right{margin-right:auto;background:var(--accent);border-radius:0 9px 9px 0}
    .balance-labels{display:flex;justify-content:space-between;font-size:var(--fs-label);font-weight:650;line-height:1.4}
    .claim{padding:12px 16px;border-radius:var(--radius-sm);background:var(--warm-soft);font-size:var(--fs-body);font-weight:700;line-height:var(--lh-copy)}
    .note{margin-top:auto}
    canvas{display:block}
    button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  </style>
</head>
<body data-page="33" data-total="48">
  <div id="stage"><main id="main">
    <section class="page33">
      <div class="lab min0">
        <div class="chambers no-pan">
          <canvas id="sim" class="cv-fill" role="img" aria-label="两个相同火箭同步向左喷出有质量的颗粒，并向右移动；真空舱内同样发生反冲。"></canvas>
          <span class="env air">有空气</span><span class="env vac">接近真空</span>
          <span class="dir one">喷流 ←　→ 火箭</span><span class="dir two">喷流 ←　→ 火箭</span>
        </div>
        <div class="controlbar ctl">
          <button id="ignite" class="ignite" aria-label="按住点火，同时观察两舱的喷流与火箭方向">按住点火</button>
          <button id="reset" class="reset">复位</button>
        </div>
        <p class="hint">按住点火，比较两种环境中喷流与火箭的运动方向。</p>
      </div>
      <div class="theory min0">
        <div class="k-process compact" aria-label="点火到反冲的五步过程">
          <span class="axis"></span>
          <div class="step" data-step="0">点火释放<br>能量</div><span class="arw"></span>
          <div class="step" data-step="1">形成高速<br>喷流</div><span class="arw"></span>
          <div class="step" data-step="2">喷流携带<br>向后动量</div><span class="arw"></span>
          <div class="step" data-step="3">火箭获得<br>向前动量</div><span class="arw"></span>
          <div class="step" data-step="4">真空中<br>仍会反冲</div>
        </div>
        <div id="explain" class="explain" aria-live="polite">按住点火：推进剂中的能量将转化为喷流的运动。</div>
        <div id="formula" class="formula">动量 = 质量 × 速度</div>
        <div class="panel panel--flat ledger">
          <div class="ledger-title">“火箭＋喷出物”的动量账本</div>
          <div class="balance" aria-hidden="true"><div id="leftbar" class="bar left"></div><div id="rightbar" class="bar right"></div></div>
          <div class="balance-labels"><span>喷出物：向后</span><span>火箭：向前</span></div>
        </div>
        <p class="claim">火箭不是推着空气前进，而是靠向后喷出质量获得向前动量。</p>
        <p class="note">理想化二维演示；忽略真实喷管流动、复杂姿态控制、地球曲率与重力变化，不用于任务轨迹预测。</p>
        <span id="status" class="hint" aria-live="polite">已停止喷射</span>
      </div>
    </section>
  </main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/matter.min.js"></script>
  <script>
    Lec.mount({index:33,kicker:"MOMENTUM IN MOTION",title:"向后喷出质量，火箭就向前获得动量",take:"火箭靠向后高速喷出质量获得向前动量，在真空中同样有效。"});
    Deck.init({index:33,total:48});
    const {Engine,Bodies,Body,Composite}=Matter;
    const cv=document.getElementById('sim'), box=cv.parentElement;
    const engine=Engine.create({gravity:{x:0,y:0}}); let rockets=[], particles=[], firing=false, elapsed=0, totalImpulse=0, stageStep=-1;
    const reduced=Deck.reduced();
    function n(v,f){return Lec.P.finiteNumber(v,f)} function lim(v,a,b){return Lec.P.clamp(n(v,a),a,b)}
    function dims(){return {w:box.clientWidth,h:box.clientHeight}}
    function setup(){Composite.clear(engine.world,false);particles=[];totalImpulse=0;elapsed=0;stageStep=-1;const d=dims();rockets=[Bodies.rectangle(d.w*.38,d.h*.25,d.w*.13,32,{frictionAir:0,inertia:Infinity}),Bodies.rectangle(d.w*.38,d.h*.75,d.w*.13,32,{frictionAir:0,inertia:Infinity})];Composite.add(engine.world,rockets);updateUI()}
    function emit(){const d=dims(), mass=.55, speed=lim(5.2,1,8);rockets.forEach((r,i)=>{const p=Bodies.circle(r.position.x-d.w*.075,r.position.y,5,{mass,frictionAir:0,restitution:.4});Body.setVelocity(p,{x:-speed,y:(i===0?(Math.sin(totalImpulse)*.8):0)});Body.setVelocity(r,{x:lim(r.velocity.x+.065,0,2.4),y:0});particles.push({body:p,air:i===0});Composite.add(engine.world,p)});totalImpulse+=mass*speed}
    const steps=["点火释放能量，推进剂中的能量转化为喷流运动。","一部分质量从喷口向后高速离开火箭主体。","喷出物有质量和向后速度，因此携带向后动量。","系统总动量守恒：火箭同时获得向前动量。","没有外部空气，真空舱中的火箭仍然反冲。"];
    function updateUI(){const s=firing?Math.min(4,Math.floor(elapsed/.55)):-1;if(s!==stageStep){stageStep=s;document.querySelectorAll('.step').forEach((el,i)=>{el.classList.toggle('is-current',i===s);el.classList.toggle('is-done',s>i)});document.getElementById('explain').textContent=s<0?'按住点火：推进剂中的能量将转化为喷流的运动。':steps[s];document.getElementById('formula').textContent=s>=3?'火箭动量变化 + 喷出物动量变化 = 0':'动量 = 质量 × 速度'}const width=Math.min(46,totalImpulse*1.25);document.getElementById('leftbar').style.width=width+'%';document.getElementById('rightbar').style.width=width+'%'}
    function draw(){const ctx=Deck.fit(cv),d=dims();ctx.clearRect(0,0,d.w,d.h);ctx.strokeStyle=Deck.rgba('--line-strong',.55);ctx.lineWidth=2;[d.h*.5].forEach(y=>{ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(d.w,y);ctx.stroke()});particles.forEach(o=>{ctx.fillStyle=o.air?Deck.rgba('--warm',.65):Deck.rgba('--warm',.9);ctx.beginPath();ctx.arc(o.body.position.x,o.body.position.y,5,0,Math.PI*2);ctx.fill()});rockets.forEach(r=>{const x=r.position.x,y=r.position.y,w=d.w*.13;ctx.fillStyle=Deck.token('--accent');ctx.beginPath();ctx.moveTo(x+w*.55,y);ctx.lineTo(x+w*.34,y-18);ctx.lineTo(x-w*.45,y-18);ctx.lineTo(x-w*.55,y);ctx.lineTo(x-w*.45,y+18);ctx.lineTo(x+w*.34,y+18);ctx.closePath();ctx.fill();ctx.strokeStyle=Deck.token('--accent-strong');ctx.stroke();if(totalImpulse>0){ctx.strokeStyle=Deck.token('--accent-strong');ctx.lineWidth=4;Deck.arrow(ctx,x,y-31,x+Math.min(100,totalImpulse*2),y-31,10)}})}
    setup();
    Deck.loop((t,dt)=>{const delta=lim(dt,0,32);if(firing){elapsed+=delta/1000;if(elapsed*1000-totalImpulse*34>130)emit()}particles.forEach(o=>{if(o.air){Body.setVelocity(o.body,{x:o.body.velocity.x*.94,y:o.body.velocity.y+Math.sin(o.body.position.x*.08)*.05})}});Engine.update(engine,delta||16.67);const d=dims();particles=particles.filter(o=>{const keep=o.body.position.x>-20&&o.body.position.y>-10&&o.body.position.y<d.h+10;if(!keep)Composite.remove(engine.world,o.body);return keep});rockets.forEach(r=>{if(r.position.x>d.w*.78)Body.setVelocity(r,{x:0,y:0})});updateUI();draw()},{still:1200});
    function setFire(on){if(firing===on)return;firing=on;document.getElementById('ignite').classList.toggle('is-on',on);document.getElementById('status').textContent=on?'正在喷出质量；喷流向后，火箭向前':'已停止喷射'}
    const ignite=document.getElementById('ignite');ignite.addEventListener('pointerdown',e=>{ignite.setPointerCapture(e.pointerId);setFire(true)});ignite.addEventListener('pointerup',()=>setFire(false));ignite.addEventListener('pointercancel',()=>setFire(false));ignite.addEventListener('lostpointercapture',()=>setFire(false));ignite.addEventListener('blur',()=>setFire(false));ignite.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();setFire(true)}});ignite.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();setFire(false)}});document.getElementById('reset').addEventListener('click',()=>{setFire(false);setup()});Deck.onResize(setup);
  </script>
</body>
</html>
