<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>同一起点，不同速度与方向，会去哪里？</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{box-sizing:border-box}
    .lec-header__progress{display:block;appearance:none;border:0;padding:0;line-height:0}
    .orbit-page{height:620px;display:flex;flex-direction:column;gap:14px}
    .upper{height:390px;display:flex;gap:18px;min-height:0}
    .viz{position:relative;flex:1 1 auto;min-width:0;border:2px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface);overflow:hidden}
    #orbitSvg{display:block;width:100%;height:100%}
    .viz-tip{position:absolute;left:14px;top:12px;padding:6px 10px;border-radius:var(--radius-sm);background:rgb(255 253 248 / 92%);font-size:var(--fs-label);line-height:1.4;color:var(--muted);pointer-events:none}
    .side{flex:0 0 350px;display:flex;flex-direction:column;gap:10px}
    .side .panel{padding:14px 16px;box-shadow:none}
    .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .metric{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
    .metric b{display:block;font-size:var(--fs-h2);line-height:1.25;color:var(--accent-strong);font-variant-numeric:tabular-nums}
    .metric span{font-size:var(--fs-label);line-height:1.4;color:var(--muted)}
    .verdict{padding:10px 12px;border-inline-start:5px solid var(--accent);background:var(--accent-soft)}
    .verdict strong{font-size:var(--fs-h2);line-height:1.35}
    .verdict p{font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .instruction{font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .classification{flex:1 1 auto;min-height:0;gap:6px}
    .classification>.box{padding:10px 14px;border-width:2px}
    .classification>.box>.bt{margin:-10px -14px 8px;padding:5px 14px;font-size:var(--fs-body)}
    .branchline{display:flex;align-items:center;justify-content:center;gap:16px;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
    .branchline span{padding:2px 10px;border-left:3px solid var(--line-strong)}
    .classification .lv{margin-left:18px;padding-left:18px;gap:6px}
    .families{display:flex;gap:10px;min-height:0}
    .family{position:relative;flex:1 1 0;min-width:0;padding:8px 12px;border:2px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);transition:background 120ms,border-color 120ms}
    .family.is-current{border-color:var(--family);background:color-mix(in srgb,var(--family) 12%,white);box-shadow:inset 0 4px 0 var(--family)}
    .family-head{display:flex;align-items:center;gap:8px}
    .lamp{width:12px;height:12px;border:2px solid var(--family);border-radius:50%;background:transparent}
    .is-current .lamp{background:var(--family)}
    .family strong{font-size:var(--fs-body);line-height:1.35}
    .family p{margin-top:3px;font-size:var(--fs-sec);line-height:1.4;color:var(--muted)}
    .mini{position:absolute;right:10px;top:9px;width:58px;height:28px}
    .model-note{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
    #orbitSvg .handle{cursor:grab;outline:none}
    #orbitSvg .handle:focus-visible{filter:drop-shadow(0 0 4px var(--focus))}
  </style>
</head>
<body data-page="35" data-total="48">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
    Lec.mount({index:35,kicker:"ORBIT FAMILIES",title:"同一起点，不同速度与方向，会去哪里？",take:"同一起点上，速度大小和方向共同决定完整轨迹属于哪个家族。"});
    Deck.init({index:35,total:48});
    const main=document.getElementById('main');
    main.innerHTML=`<section class="orbit-page">
      <div class="upper">
        <figure class="viz min0" aria-labelledby="viz-caption"><svg id="orbitSvg" role="img" aria-label="可调整初速度大小和方向的二维地球轨迹图"></svg><figcaption id="viz-caption" class="viz-tip">拖动速度箭头；看整条路径落入哪一类</figcaption></figure>
        <aside class="side min0">
          <div class="metrics"><div class="metric"><span>当前速度</span><b id="speedOut">—</b></div><div class="metric"><span>相对当地水平</span><b id="angleOut">—</b></div><div class="metric"><span>起点高度</span><b id="heightOut">—</b></div><div class="metric"><span>圆轨道参照</span><b id="circleOut">—</b></div></div>
          <div class="verdict" aria-live="polite"><strong id="kindOut">—</strong><p id="detailOut">—</p></div>
          <p class="instruction">聚焦箭头后：← → 改变方向，↑ ↓ 改变速度。</p>
          <p class="model-note">理想化球对称模型：忽略大气阻力、地球非球形、自转和姿态控制。轨迹只用于分类，不是任务预测。</p>
        </aside>
      </div>
      <section class="k-classification classification" aria-label="完整轨迹的四类结果">
        <div class="box"><span class="bt">完整轨迹 → 唯一归属</span><div class="branchline"><span>是否再次接触地球？</span><span>若不接触，是否闭合？</span><span>若闭合，半径是否近似恒定？</span></div></div>
        <div class="lv"><div class="families">
          <article class="family" data-kind="fall" style="--family:#c95d32"><div class="family-head"><i class="lamp"></i><strong>坠落</strong></div><svg class="mini"></svg><p>轨迹与地球相交。</p></article>
          <article class="family" data-kind="ellipse" style="--family:#8a5a9e"><div class="family-head"><i class="lamp"></i><strong>椭圆轨道</strong></div><svg class="mini"></svg><p>闭合，但地心距离变化。</p></article>
          <article class="family" data-kind="circle" style="--family:#39734d"><div class="family-head"><i class="lamp"></i><strong>近似圆轨道</strong></div><svg class="mini"></svg><p>闭合，地心距离近似不变。</p></article>
          <article class="family" data-kind="escape" style="--family:#007c91"><div class="family-head"><i class="lamp"></i><strong>逃逸</strong></div><svg class="mini"></svg><p>开放离场，不再闭合。</p></article>
        </div></div>
      </section>
    </section>`;

    const R=Lec.P.finiteNumber(6371000,6371000), H=Lec.P.clamp(Lec.P.finiteNumber(400000,400000),0,1000000);
    const g0=Lec.P.finiteNumber(9.81,9.81), mu=g0*R*R, r0=R+H;
    const vc=Math.sqrt(mu/r0), ve=Math.sqrt(2*mu/r0);
    let speed=6.8e3, angle=0;
    const colors={fall:'#c95d32',ellipse:'#8a5a9e',circle:'#39734d',escape:'#007c91'};
    const labels={fall:'坠落',ellipse:'椭圆轨道',circle:'近似圆轨道',escape:'逃逸'};
    const svg=d3.select('#orbitSvg').attr('viewBox','0 0 1000 390');
    const defs=svg.append('defs');
    defs.append('marker').attr('id','arrow').attr('viewBox','0 -5 10 10').attr('refX',8).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto').append('path').attr('d','M0,-5L10,0L0,5Z').attr('fill','currentColor');
    const plot=svg.append('g'), link=svg.append('path').attr('fill','none').attr('stroke-width',2).attr('stroke-dasharray','6 5');
    const cx=390,cy=196, earthPx=82, scale=earthPx/R;
    plot.append('circle').attr('cx',cx).attr('cy',cy).attr('r',earthPx).attr('fill','#b8dce2').attr('stroke','#005b6c').attr('stroke-width',3);
    plot.append('path').attr('d',`M${cx-67},${cy-18} Q${cx-25},${cy-52} ${cx+12},${cy-22} T${cx+66},${cy-3} M${cx-55},${cy+32} Q${cx-8},${cy+5} ${cx+52},${cy+39}`).attr('fill','none').attr('stroke','#6ea7ad').attr('stroke-width',8).attr('stroke-linecap','round');
    plot.append('text').attr('x',cx).attr('y',cy+6).attr('text-anchor','middle').attr('font-size',16).attr('fill','#005b6c').text('地球');
    const pathEl=plot.append('path').attr('fill','none').attr('stroke-width',4).attr('stroke-linecap','round');
    const marks=plot.append('g');
    const startX=cx+r0*scale,startY=cy;
    plot.append('circle').attr('cx',startX).attr('cy',startY).attr('r',6).attr('fill','#18212b');
    const velocity=plot.append('line').attr('class','handle no-pan').attr('tabindex',0).attr('role','slider').attr('aria-label','初速度向量；方向键调整').attr('stroke','#18212b').attr('stroke-width',6).attr('stroke-linecap','round').attr('marker-end','url(#arrow)');
    const hit=plot.append('circle').attr('class','handle no-pan').attr('tabindex',0).attr('role','slider').attr('aria-label','拖动改变初速度大小和方向').attr('r',18).attr('fill','transparent');

    function simulate(){
      let x=r0,y=0,vx=speed*Math.sin(angle),vy=-speed*Math.cos(angle), t=0, pts=[[x,y]], min=r0,max=r0, totalAng=0,prev=Math.atan2(y,x), kind='ellipse';
      const dt=8, energy=.5*speed*speed-mu/r0;
      for(let i=0;i<2200;i++){
        const rr=Math.hypot(x,y), a=-mu/(rr*rr*rr); vx+=a*x*dt;vy+=a*y*dt;x+=vx*dt;y+=vy*dt;t+=dt;
        const nr=Math.hypot(x,y); pts.push([x,y]);min=Math.min(min,nr);max=Math.max(max,nr);
        let q=Math.atan2(y,x),d=q-prev;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;totalAng+=Math.abs(d);prev=q;
        if(i>2&&nr<=R){kind='fall';break}
        if(energy>=0&&nr>R*3.15&&x*vx+y*vy>0){kind='escape';break}
        if(totalAng>=Math.PI*2){kind=(max-min)/((max+min)/2)<.025?'circle':'ellipse';break}
      }
      return {pts,kind,min,max,energy};
    }
    function update(){
      speed=Lec.P.clamp(Lec.P.finiteNumber(speed,6800),1000,ve*1.22);angle=Lec.P.clamp(Lec.P.finiteNumber(angle,0),-Math.PI*.48,Math.PI*.48);
      const res=simulate(), col=colors[res.kind];
      const line=d3.line().x(d=>cx+d[0]*scale).y(d=>cy+d[1]*scale);
      pathEl.attr('d',line(res.pts)).attr('stroke',col); marks.selectAll('*').remove();
      if(res.kind==='ellipse'){
        const ext=[res.pts.reduce((a,b)=>Math.hypot(...b)<Math.hypot(...a)?b:a),res.pts.reduce((a,b)=>Math.hypot(...b)>Math.hypot(...a)?b:a)];
        marks.selectAll('circle').data(ext).join('circle').attr('cx',d=>cx+d[0]*scale).attr('cy',d=>cy+d[1]*scale).attr('r',5).attr('fill',col);
      }
      const len=55+speed/ve*90, ex=startX+Math.sin(angle)*len,ey=startY-Math.cos(angle)*len;
      velocity.attr('x1',startX).attr('y1',startY).attr('x2',ex).attr('y2',ey).attr('stroke',col).style('color',col);hit.attr('cx',ex).attr('cy',ey);
      document.getElementById('speedOut').textContent=Lec.P.round(speed/1000,1)+' km/s';
      const deg=Lec.P.round(angle*180/Math.PI,0);document.getElementById('angleOut').textContent=(deg>0?'+':'')+deg+'°';
      document.getElementById('heightOut').textContent='约 '+Lec.P.round(H/1000,0)+' km';
      document.getElementById('circleOut').textContent='约 '+Lec.P.round(7700/1000,1)+' km/s';
      document.getElementById('kindOut').textContent=labels[res.kind];
      let detail=res.kind==='fall'?'方向使完整轨迹与地球相交。':res.kind==='escape'?'仍受地球引力，但不再返回成闭合轨道。':res.kind==='circle'?'当前轨迹闭合，地心距离近似不变。':`近地点约 ${Lec.P.round(Math.max(0,res.min-R)/1000,0)} km；远地点约 ${Lec.P.round((res.max-R)/1000,0)} km。`;
      document.getElementById('detailOut').textContent=detail;
      document.querySelectorAll('.family').forEach(e=>e.classList.toggle('is-current',e.dataset.kind===res.kind));
      const idx=['fall','ellipse','circle','escape'].indexOf(res.kind), targetX=176+idx*347;
      link.attr('d',`M${startX},${startY+10} Q${startX+120},330 ${targetX},385`).attr('stroke',col);
      velocity.attr('aria-valuetext',`${Lec.P.round(speed/1000,1)}千米每秒，相对水平${deg}度，${labels[res.kind]}`);
    }
    function dragTo(event){const p=d3.pointer(event,svg.node()),dx=p[0]-startX,dy=p[1]-startY;angle=Math.atan2(dx,-dy);speed=(Math.hypot(dx,dy)-55)/90*ve;update()}
    hit.call(d3.drag().on('drag',dragTo));
    function keys(event){if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;event.preventDefault();if(event.key==='ArrowLeft')angle-=Math.PI/180*2;if(event.key==='ArrowRight')angle+=Math.PI/180*2;if(event.key==='ArrowUp')speed+=100;if(event.key==='ArrowDown')speed-=100;update()}
    velocity.on('keydown',keys);hit.on('keydown',keys);
    const mini={fall:'M3,5 Q28,5 35,24 L48,24',ellipse:'M5,14 A24,10 0 1,0 48,14 A24,10 0 1,0 5,14',circle:'M15,14 A12,12 0 1,0 39,14 A12,12 0 1,0 15,14',escape:'M4,24 Q19,4 53,4'};
    d3.selectAll('.family').each(function(){const k=this.dataset.kind,s=d3.select(this).select('svg').attr('viewBox','0 0 58 28');s.append('circle').attr('cx',8).attr('cy',14).attr('r',6).attr('fill','#b8dce2');s.append('path').attr('d',mini[k]).attr('fill','none').attr('stroke',colors[k]).attr('stroke-width',2.5);if(k==='escape')s.append('path').attr('d','M48,1L55,4L49,8').attr('fill','none').attr('stroke',colors[k]).attr('stroke-width',2)});
    update();
  </script>
</body>
</html>
