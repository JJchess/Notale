<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>为什么火箭要一节一节地丢掉自己？</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main{height:auto}
  .lec-header__progress{border:0;padding:0;appearance:none;overflow:visible}
  .lesson{height:620px;display:flex;flex-direction:column;gap:16px}
  .process-strip{height:92px;--process-axis-y:50%;gap:30px;flex:none}
  .process-strip>.step{padding:12px 10px;text-align:center;display:flex;flex-direction:column;justify-content:center}
  .process-strip>.step b{font-size:16px;line-height:1.35}.process-strip>.step span{font-size:14px;line-height:1.4;color:var(--muted)}
  .process-strip>.arw{width:30px;transform:translate(-30px,-50%)}
  .workbench{display:flex;gap:20px;min-height:0;flex:1}
  .sim{position:relative;flex:1.35;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-md);background:linear-gradient(180deg,#dcebef 0%,#edf0ec 72%,#d9d2c2 72%)}
  .rack{position:absolute;left:320px;bottom:44px;width:250px;height:390px;border-bottom:8px solid var(--line-strong)}
  .rack:before,.rack:after{content:"";position:absolute;bottom:0;width:5px;height:380px;background:var(--line-strong)}.rack:before{left:25px}.rack:after{right:25px}
  .rocket{position:absolute;left:50%;bottom:8px;width:112px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:stretch;transition:transform 700ms cubic-bezier(.22,.75,.25,1)}
  .rocket.flying{transform:translate(-50%,-68px)}
  .payload{height:58px;clip-path:polygon(50% 0,100% 55%,100% 100%,0 100%,0 55%);background:var(--warm);border:3px solid #7f3b23}
  .mounted{display:flex;flex-direction:column}
  .module,.tray-module{position:relative;height:96px;border:3px solid var(--accent-strong);background:#eef7f7;touch-action:none;user-select:none}
  .module+.module{border-top-width:6px}.fuel{position:absolute;inset:10px 14px 20px;background:var(--accent);transform-origin:bottom;transition:transform 900ms linear}.engine{position:absolute;bottom:0;left:32px;width:42px;height:15px;background:var(--text);clip-path:polygon(0 0,100% 0,82% 100%,18% 100%)}
  .module.empty{border-color:var(--warm);background:var(--warm-soft)}.module.empty .fuel{transform:scaleY(0)}
  .flame{display:none;position:absolute;left:39px;bottom:-30px;width:30px;height:34px;background:linear-gradient(#fff1a8,var(--warm));clip-path:polygon(50% 100%,0 0,100% 0)}.burning>.flame{display:block}
  .tray{position:absolute;left:24px;bottom:22px;width:190px;display:flex;flex-direction:column;gap:10px}.tray-module{height:72px;padding:12px 10px;font-size:16px;font-weight:700;cursor:grab}.tray-module:focus{outline:3px solid var(--focus);outline-offset:2px}.tray-module.placed{opacity:.28;pointer-events:none}
  .drop-hint{position:absolute;left:270px;top:18px;width:350px;text-align:center;font-size:15px;color:var(--muted)}
  .velocity{position:absolute;right:24px;top:44px;width:110px;height:300px;border-left:4px solid var(--line-strong)}.velocity-fill{position:absolute;left:-4px;bottom:0;width:4px;height:25%;background:var(--accent);transition:height 700ms ease-out}.velocity span{position:absolute;left:14px;top:0;width:90px;font-size:14px;line-height:1.4;color:var(--muted)}
  .detail{flex:.9;min-width:0;display:flex;flex-direction:column;gap:12px}.detail .panel{padding:18px;box-shadow:none}.question{border-left:6px solid var(--accent);background:var(--accent-soft)}
  .rows{display:flex;flex-direction:column;gap:8px;margin-top:10px}.mass-row{display:flex;justify-content:space-between;gap:12px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:16px;line-height:1.4}.mass-row strong{color:var(--accent-strong)}
  .status{min-height:48px;font-size:16px;line-height:1.45}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions .btn{font-size:16px}.model-note{position:absolute;left:238px;bottom:10px;font-size:14px;color:var(--muted)}
  .detached{position:absolute;width:112px;height:96px;z-index:5;pointer-events:none}.detached .fuel{transform:scaleY(0)}
  @media (prefers-reduced-motion:reduce){*{transition-duration:0.01ms!important}.flame{display:none!important}}
</style>
</head>
<body data-page="36" data-total="48">
<div id="stage"><main id="main"></main></div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script>
Lec.mount({index:36,kicker:"MASS ON MASS",title:"为什么火箭要一节一节地丢掉自己？",take:"多级结构会在一级完成任务后抛弃空质量，让后面的发动机不必继续拖着它。"});
Deck.init({index:36,total:48});
const main=document.getElementById('main');
const processSteps=[['堆叠','装上各级'],['点火','推动全部'],['耗尽','空壳仍在'],['分离','抛掉空级'],['再点火','轻装加速'],['重复','燃烧再分离']];
const n=Lec.P.finiteNumber(processSteps.length,6);
main.innerHTML=`<div class="lesson"><div class="k-process process-strip"><div class="axis"></div>${processSteps.map((s,i)=>`<section class="step ${i===0?'is-current':''}" data-step="${i}"><b>${s[0]}</b><span>${s[1]}</span></section>${i<n-1?'<i class="arw" aria-hidden="true"></i>':''}`).join('')}</div><div class="workbench"><section class="sim min0 no-pan" aria-label="可拆分多级火箭教学模型"><p class="drop-hint">拖动级段到发射架；键盘聚焦后按 Enter 也可装配。</p><div class="tray"><div class="tray-module" tabindex="0" role="button" data-id="upper" aria-label="装配上面级">上面级</div><div class="tray-module" tabindex="0" role="button" data-id="lower" aria-label="装配底级">底级</div></div><div class="rack"><div class="rocket"><div class="payload" title="始终保留的载荷"></div><div class="mounted"></div></div></div><div class="velocity"><span>相对速度趋势<br>暂停点火</span><i class="velocity-fill"></i></div><p class="model-note">教学模型：忽略大气阻力、地球非球形、姿态控制与真实发动机差异。</p></section><aside class="detail min0"><section class="panel question"><h2>起飞时，下面级需要加速什么？</h2><p class="sec">把两级由上到下装好，再观察每一步。</p></section><section class="panel grow"><div class="rows"></div></section><p class="status" aria-live="polite">先装上面级，再装底级。</p><div class="actions"><button class="btn fire" disabled>点火</button><button class="btn separate" disabled>分离空级</button><button class="btn reset">重置堆叠</button></div></aside></div></div>`;
const rocket=main.querySelector('.rocket'), mounted=main.querySelector('.mounted'), rows=main.querySelector('.rows'), statusEl=main.querySelector('.status'), fireBtn=main.querySelector('.fire'), sepBtn=main.querySelector('.separate'), vel=main.querySelector('.velocity-fill'), velText=main.querySelector('.velocity span');
let state={step:0,placed:[],active:1,burning:false,detached:0};
function moduleHTML(id){return `<div class="module" data-id="${id}"><i class="fuel"></i><i class="engine"></i><i class="flame"></i></div>`}
function setStep(x){state.step=Lec.P.clamp(Lec.P.finiteNumber(x,0),0,n-1);main.querySelectorAll('[data-step]').forEach((el,i)=>{el.classList.toggle('is-current',i===state.step);el.classList.toggle('is-done',i<state.step)});renderRows()}
function renderRows(){let carried=['载荷',...state.placed.map(x=>x==='upper'?'上面级':'底级')];let empty=state.step===2?'底级':state.step===3||state.step===4?'已抛弃底级':'—';if(state.step===5) empty='已抛弃完成任务的级段';const action=['继续装配','点燃底级','识别空结构','点击分离接口','点燃上面级','重复同一过程'][state.step];rows.innerHTML=`<div class="mass-row"><span>当前点火级</span><strong>${state.step<4?'底级':state.step===4?'上面级':'依次向上'}</strong></div><div class="mass-row"><span>仍携带</span><strong>${carried.join('＋')}</strong></div><div class="mass-row"><span>无用空结构</span><strong>${empty}</strong></div><div class="mass-row"><span>下一动作</span><strong>${action}</strong></div>`}
function place(id){if(state.step!==0||state.placed.includes(id))return;const expected=state.placed.length===0?'upper':'lower';if(id!==expected){statusEl.textContent='级段需要连续对接：先放上面级，再放底级。';return}state.placed.push(id);mounted.insertAdjacentHTML('beforeend',moduleHTML(id));main.querySelector(`[data-id="${id}"].tray-module`).classList.add('placed');statusEl.textContent=state.placed.length===2?'整枚火箭已连接。底级将推动上方全部质量。':'上面级已对接；继续把底级接在下方。';if(state.placed.length===2){fireBtn.disabled=false;renderRows()}}
main.querySelectorAll('.tray-module').forEach(el=>{el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();place(el.dataset.id)}});el.addEventListener('pointerdown',e=>{if(el.classList.contains('placed'))return;el.setPointerCapture(e.pointerId);el.dataset.drag='1'});el.addEventListener('pointerup',e=>{if(el.dataset.drag){delete el.dataset.drag;place(el.dataset.id)}})});
function burn(which){fireBtn.disabled=true;state.burning=true;setStep(which==='lower'?1:4);rocket.classList.add('flying');const mod=mounted.querySelector(`[data-id="${which}"]`);mod.classList.add('burning');vel.style.height=which==='lower'?'54%':'88%';velText.innerHTML='相对速度趋势<br>继续增加';statusEl.textContent=which==='lower'?'底级正在推动载荷、上面级、两级结构和剩余推进剂。':'空底级已离开；较轻的剩余组合继续加速。';setTimeout(()=>{mod.classList.remove('burning');mod.classList.add('empty');state.burning=false;if(which==='lower'){setStep(2);sepBtn.disabled=false;velText.innerHTML='相对速度趋势<br>增加变慢';statusEl.textContent='推进剂已耗尽，但空贮箱和发动机仍被携带。'}else{setStep(5);velText.innerHTML='相对速度趋势<br>继续增加';statusEl.textContent='同一链条可以向上重复：携带 → 燃烧 → 抛弃 → 继续加速。'}},Deck.reduced()?20:950)}
fireBtn.addEventListener('click',()=>burn(state.detached?'upper':'lower'));
const engine=Matter.Engine.create();engine.gravity.y=0.75;let falling=null;
sepBtn.addEventListener('click',()=>{if(state.step!==2)return;sepBtn.disabled=true;const lower=mounted.querySelector('[data-id="lower"]');const sim=main.querySelector('.sim');const d=document.createElement('div');d.className='module empty detached';d.innerHTML='<i class="fuel"></i><i class="engine"></i>';sim.appendChild(d);lower.remove();state.placed=state.placed.filter(x=>x!=='lower');state.detached=1;const body=Matter.Bodies.rectangle(430,335,112,96,{restitution:.2});Matter.Composite.add(engine.world,body);falling={el:d,body};setStep(3);statusEl.textContent='完成任务的空底级已分离；上面级与载荷继续前进。';fireBtn.disabled=false;fireBtn.textContent='点燃上面级';renderRows()});
Deck.loop((t,dt)=>{if(!falling)return;Matter.Engine.update(engine,Lec.P.clamp(Lec.P.finiteNumber(dt,16),0,32));const p=falling.body.position;falling.el.style.transform=`translate(${p.x-56}px,${p.y-48}px) rotate(${falling.body.angle}rad)`},{still:1});
main.querySelector('.reset').addEventListener('click',()=>{state={step:0,placed:[],active:1,burning:false,detached:0};mounted.innerHTML='';main.querySelectorAll('.tray-module').forEach(x=>x.classList.remove('placed'));main.querySelectorAll('.detached').forEach(x=>x.remove());Matter.Composite.clear(engine.world,false);falling=null;rocket.classList.remove('flying');vel.style.height='25%';velText.innerHTML='相对速度趋势<br>暂停点火';fireBtn.textContent='点火';fireBtn.disabled=true;sepBtn.disabled=true;statusEl.textContent='先装上面级，再装底级。';setStep(0)});
renderRows();
</script>
</body>
</html>
