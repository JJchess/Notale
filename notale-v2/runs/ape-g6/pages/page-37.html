<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>多要一点速度，为什么会多带这么多推进剂？</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/lib/katex.min.css">
  <style>
    .lec-header__progress{-webkit-appearance:none;appearance:none;min-height:0;border:0;padding:0;overflow:visible}
    .page37{display:flex;gap:var(--sp-5);height:var(--content-h);min-width:0}
    .config{flex:0 0 41%;display:flex;flex-direction:column;gap:var(--sp-3);min-width:0}
    .results{flex:1 1 0;display:flex;flex-direction:column;gap:var(--sp-3);min-width:0}
    .formula-line{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-3) var(--sp-4);border-inline-start:5px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
    #formula{font-size:20px;white-space:nowrap}
    .symbols{font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .fixed{display:flex;justify-content:space-between;align-items:baseline;padding:var(--sp-2) var(--sp-4);border-bottom:1px solid var(--line)}
    .fixed strong{font-size:var(--fs-h2);font-variant-numeric:tabular-nums;color:var(--accent-strong)}
    .control-block{padding:var(--sp-3) var(--sp-4);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
    .ctl{flex-wrap:wrap}.ctl label{width:100%}.ctl output{min-width:88px;text-align:right;font-size:var(--fs-body);font-weight:720;font-variant-numeric:tabular-nums}
    .anchors{display:flex;gap:var(--sp-2);margin-top:var(--sp-2)}
    .anchors button{flex:1;min-height:42px;padding:var(--sp-2);border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font:650 var(--fs-label)/1.4 var(--font-sans);cursor:pointer}
    .anchors button.is-current{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 -3px 0 var(--accent)}
    .mass-wrap{display:flex;gap:var(--sp-4);align-items:stretch;min-height:176px}
    .massbar{width:112px;display:flex;flex-direction:column;border:2px solid var(--line-strong);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
    .fuel,.dry{display:flex;align-items:center;justify-content:center;padding:var(--sp-2);font-size:var(--fs-label);font-weight:700;text-align:center;transition:flex-basis 120ms ease}
    .fuel{background:var(--warm-soft);color:var(--text)}.dry{background:var(--surface-3);color:var(--text)}
    .mass-readings{flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--sp-2);min-width:0}
    .mass-readings .readout{padding:var(--sp-2) var(--sp-3)}
    .mass-readings .readout__value{font-size:var(--fs-lead)}
    .chart-panel{height:338px;padding:var(--sp-2) var(--sp-3) var(--sp-1);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
    #chart{width:100%;height:100%}
    .compare-table{--compare-n:3;grid-template-columns:minmax(135px,.8fr) repeat(3,minmax(0,1fr));font-variant-numeric:tabular-nums}
    .compare-table>.hdr{min-height:42px;padding:var(--sp-2) var(--sp-3);font-size:var(--fs-sec)}
    .compare-table>.dim,.compare-table>.cell{padding:var(--sp-2) var(--sp-3)}
    .compare-table>.cell{text-align:center}.compare-table>.active{background:var(--accent-soft);font-weight:720}
    .model-note{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
    @media(max-width:900px){.page37{flex-direction:column;overflow:auto}.config{flex:none}.chart-panel{height:320px}}
  </style>
</head>
<body data-page="37" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="page37" aria-label="速度增量与质量比比较">
        <div class="config min0">
          <div class="formula-line">
            <div id="formula" aria-label="m零除以m一等于e的德尔塔v除以v e次方"></div>
            <p class="symbols">m₀ 点火前总质量；m₁ 燃尽后质量<br>Δv 累计改速能力；vₑ 有效喷气速度</p>
          </div>
          <div class="fixed"><span class="label">固定喷气速度 vₑ</span><strong id="veRead">—</strong></div>
          <div class="control-block">
            <div class="ctl">
              <label for="dv">拖动所需速度增量，观察曲线和质量组成</label>
              <input id="dv" type="range" aria-describedby="live">
              <output id="dvRead" for="dv">—</output>
            </div>
            <div class="anchors" aria-label="速度增量锚点">
              <button type="button" data-level="low">低 · —</button>
              <button type="button" data-level="mid">中 · —</button>
              <button type="button" data-level="high">高 · —</button>
            </div>
          </div>
          <div class="mass-wrap">
            <div class="massbar" aria-label="当前初始质量组成">
              <div class="fuel" id="fuelBar">推进剂</div>
              <div class="dry" id="dryBar">非推进剂</div>
            </div>
            <div class="mass-readings">
              <div class="readout"><span class="readout__label">质量比 m₀/m₁</span><strong class="readout__value" id="ratioRead">—</strong></div>
              <div class="readout"><span class="readout__label">理想推进剂比例</span><strong class="readout__value" id="fuelRead">—</strong></div>
              <p class="sec">非推进剂包含结构、发动机、载荷等燃尽后剩余质量。</p>
            </div>
          </div>
          <p class="note">推进剂越多，被继续加速的初始质量也越大。</p>
        </div>
        <div class="results min0">
          <div class="chart-panel"><div id="chart" role="img" aria-label="速度增量增加时质量比加速增长的曲线"></div></div>
          <div class="k-comparison compare-table" id="comparison" aria-label="低中高三档结果比较"></div>
          <p class="model-note">理想化单级关系：忽略大气阻力、地球非球形、重力损失、复杂姿态控制和发动机性能变化，不是任务级预测。</p>
          <div id="live" class="sr-only" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/katex.min.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script>
    Lec.mount({index:37,kicker:"ORBITAL COST",title:"多要一点速度，为什么会多带这么多推进剂？",take:"所需速度增量上升时，推进剂比例以越来越不友好的方式增长。"});
    Deck.init({index:37,total:48});
    const finite=(v,f)=>Lec.P.finiteNumber(v,f), clamp=(v,a,b)=>Lec.P.clamp(v,a,b), round=(v,n)=>Lec.P.round(v,n);
    const ve=finite(3000,3000), low=finite(3000,3000), mid=finite(6000,6000), high=finite(9000,9000);
    const step=finite((high-low)/60,100);
    const levels={low,mid,high};
    const calc=d=>{const dv=clamp(finite(d,mid),low,high);const ratio=finite(Math.exp(dv/ve),1);return {dv,ratio,fuel:finite(1-1/ratio,0),dry:finite(1/ratio,1)}};
    const fmtKm=v=>round(finite(v,0)/1000,1).toFixed(1)+" km/s";
    const fmtRatio=v=>round(finite(v,1),2).toFixed(2);
    const fmtPct=v=>round(finite(v,0)*100,1).toFixed(1)+"%";
    katex.render("m_0/m_1=e^{\\Delta v/v_e}",document.getElementById("formula"),{throwOnError:false});
    const slider=document.getElementById("dv");slider.min=low;slider.max=high;slider.step=step;slider.value=mid;
    document.getElementById("veRead").textContent=fmtKm(ve);
    const levelKeys=["low","mid","high"], levelNames=["低","中","高"];
    document.querySelectorAll(".anchors button").forEach((b,i)=>{b.textContent=levelNames[i]+" · "+fmtKm(levels[b.dataset.level]);b.addEventListener("click",()=>{slider.value=levels[b.dataset.level];update(true)})});
    const rows=[{name:"速度增量",get:r=>fmtKm(r.dv)},{name:"质量比",get:r=>fmtRatio(r.ratio)},{name:"推进剂比例",get:r=>fmtPct(r.fuel)},{name:"非推进剂比例",get:r=>fmtPct(r.dry)}];
    const table=document.getElementById("comparison");
    table.innerHTML='<div class="hdr">同一维度</div>'+levelNames.map(n=>'<div class="hdr">'+n+'档</div>').join("")+rows.map(row=>'<div class="dim">'+row.name+'</div>'+levelKeys.map(k=>'<div class="cell" data-col="'+k+'">'+row.get(calc(levels[k]))+'</div>').join("")+'<div class="rowline"></div>').join("");
    const points=[];for(let d=low;d<=high+step/2;d+=step)points.push([round(d/1000,3),calc(d).ratio]);
    const anchors=levelKeys.map(k=>[levels[k]/1000,calc(levels[k]).ratio]);
    const chart=echarts.init(document.getElementById("chart"),null,{renderer:"svg"});
    const option={animation:false,grid:{left:68,right:26,top:24,bottom:52},textStyle:{fontFamily:getComputedStyle(document.documentElement).getPropertyValue('--font-sans'),fontSize:16},xAxis:{type:"value",min:low/1000,max:high/1000,splitNumber:3,name:"所需速度增量 Δv（km/s）",nameLocation:"middle",nameGap:34,nameTextStyle:{fontSize:14},axisLabel:{fontSize:12}},yAxis:{type:"value",min:calc(low).ratio,max:calc(high).ratio*1.06,splitNumber:3,name:"质量比 m₀/m₁",nameTextStyle:{fontSize:14},axisLabel:{fontSize:12}},tooltip:{trigger:"item",textStyle:{fontSize:16},formatter:p=>"Δv："+round(p.value[0],2)+" km/s<br>质量比："+fmtRatio(p.value[1])+"<br>vₑ："+round(ve,0)+" m/s"},series:[{type:"line",data:points,symbol:"none",lineStyle:{width:4,color:"#007c91"}},{type:"scatter",data:anchors,symbolSize:11,itemStyle:{color:"#c95d32"}},{id:"current",type:"scatter",data:[],symbolSize:18,itemStyle:{color:"#005b6c",borderColor:"#fff",borderWidth:3},markLine:{silent:true,symbol:"none",lineStyle:{type:"dashed",color:"#77898d"},label:{show:false},data:[]}}]};
    chart.setOption(option);
    let liveTimer;
    function update(announce){const r=calc(Number(slider.value));document.getElementById("dvRead").textContent=fmtKm(r.dv);document.getElementById("ratioRead").textContent=fmtRatio(r.ratio);document.getElementById("fuelRead").textContent=fmtPct(r.fuel);document.getElementById("fuelBar").style.flexBasis=(r.fuel*100)+"%";document.getElementById("dryBar").style.flexBasis=(r.dry*100)+"%";document.getElementById("fuelBar").textContent="推进剂 "+fmtPct(r.fuel);document.getElementById("dryBar").textContent="非推进剂 "+fmtPct(r.dry);let nearest=levelKeys.reduce((a,k)=>Math.abs(levels[k]-r.dv)<Math.abs(levels[a]-r.dv)?k:a,"low");document.querySelectorAll(".anchors button").forEach(b=>b.classList.toggle("is-current",b.dataset.level===nearest));document.querySelectorAll("[data-col]").forEach(c=>c.classList.toggle("active",c.dataset.col===nearest));chart.setOption({series:[{},{},{id:"current",data:[[r.dv/1000,r.ratio]],markLine:{data:[{xAxis:r.dv/1000},{yAxis:r.ratio}]}}]});clearTimeout(liveTimer);if(announce!==false)liveTimer=setTimeout(()=>document.getElementById("live").textContent="速度增量"+fmtKm(r.dv)+"，质量比"+fmtRatio(r.ratio)+"，推进剂比例"+fmtPct(r.fuel),350)}
    slider.addEventListener("input",()=>update(true));update(false);Deck.onResize(()=>chart.resize());
  </script>
</body>
</html>
