<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>等地球把发射场转到轨道下面</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
.lec-header__progress{overflow:visible}.page38{height:100%;display:flex;flex-direction:column;gap:12px}.hero{position:relative;flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;background:linear-gradient(135deg,#071b24,#123542);box-shadow:var(--shadow)}
#globe{position:absolute;inset:0 310px 0 0}.overlay-title{position:absolute;z-index:4;left:20px;top:18px;width:330px;color:#effcfd;pointer-events:none}.overlay-title .lead{margin-top:8px}.facts{margin-top:10px;color:#bad8db;font-size:var(--fs-label);line-height:1.45}.status{position:absolute;z-index:5;right:16px;top:16px;width:278px;padding:16px;background:rgb(255 253 248 / 94%)}.state{font-size:var(--fs-h2);font-weight:750;color:var(--warm);margin-bottom:10px}.state.open{color:var(--success)}.condition{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:var(--fs-sec);line-height:1.45}.condition b{white-space:nowrap}.condition.ok b{color:var(--success)}
.controls{position:absolute;z-index:6;left:350px;right:326px;bottom:14px;padding:12px 16px;background:rgb(255 253 248 / 94%);border-radius:var(--radius-md)}.ctl{min-height:36px}.ctl output{min-width:108px;text-align:right;font-size:var(--fs-label);font-variant-numeric:tabular-nums}.model{position:absolute;z-index:4;left:18px;bottom:18px;width:310px;color:#c5dcde;font-size:var(--fs-sec);line-height:1.45;border-left:3px solid #69bdc5;padding-left:10px}
.k-process{height:116px;flex:0 0 auto;gap:26px;--process-axis-y:50%}.k-process>.step{padding:12px 10px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:var(--fs-label);line-height:1.4}.k-process>.arw{width:26px;transform:translate(-26px,-50%)}.k-process>.step.is-current{font-weight:700}.reset{flex:0 0 auto}.sr-only{font-size:16px}
</style>
</head>
<body data-page="38" data-total="48">
<div id="stage"><main id="main"></main></div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/three.min.js"></script>
<script src="assets/lib/globe.gl.min.js"></script>
<script>
Lec.mount({index:38,kicker:"ORBITAL GEOMETRY",title:"等地球把发射场转到轨道下面",take:"发射窗口来自地球自转、轨道平面、发射方向与目标位置的短暂对齐。"});
Deck.init({index:38,total:48});
const main=document.getElementById('main');
main.innerHTML=`<section class="page38">
 <div class="hero min0">
  <div id="globe" role="img" aria-label="三维地球上叠加固定轨道平面、移动发射场、发射方向与目标航天器。"></div>
  <div class="overlay-title"><div class="lead">发射窗口不是“天气好就能起飞”</div><div class="facts" id="facts"></div></div>
  <aside class="panel status" aria-live="polite"><div id="state" class="state">窗口关闭 · 等待对齐</div><div id="plane" class="condition"><span>平面条件</span><b></b></div><div id="direction" class="condition"><span>方向条件</span><b></b></div><div id="phase" class="condition"><span>位置条件</span><b></b></div></aside>
  <div class="controls panel panel--flat"><div class="ctl"><label for="time">恒星日内时刻</label><input id="time" type="range" min="0" max="86164" step="120" value="0"><output id="timeOut"></output></div><div class="ctl"><label for="az">发射方位</label><input id="az" type="range" min="0" max="359" step="1" value="90"><output id="azOut"></output><button id="reset" class="reset">回到起点</button></div></div>
  <p class="model">理想化几何模型：忽略大气阻力、地球非球形、复杂姿态控制与真实上升轨迹。</p>
 </div>
 <div class="k-process"><div class="axis"></div>
  <div class="step is-current">轨道平面<br>固定在空间</div><i class="arw"></i><div class="step">地球在平面<br>下方自转</div><i class="arw"></i><div class="step">发射场接近<br>轨道平面</div><i class="arw"></i><div class="step">选择顺行<br>发射方向</div><i class="arw"></i><div class="step">目标进入<br>简化相位门</div><i class="arw"></i><div class="step">窗口开启<br>然后关闭</div>
 </div></section>`;
const finite=(v,f)=>Lec.P.finiteNumber(v,f), clamp=(v,a,b)=>Lec.P.clamp(v,a,b), round=(v,n)=>Lec.P.round(v,n);
const earthR=finite(6371000,6371000), rotation=finite(86164,86164), altitude=finite(400000,400000), speed=finite(7700,7700), orbitPeriod=finite(5520,5520);
const secDay=Lec.P.secondsPerDay(), secMinute=secDay/(24*60);
document.getElementById('facts').textContent=`地球半径约 ${round(earthR/1000,0)} 千米 · 轨道高约 ${round(altitude/1000,0)} 千米 · ${round(speed/1000,1)} km/s · 周期约 ${round(orbitPeriod/secMinute,0)} 分钟（实际值随轨道变化）`;
const globeEl=document.getElementById('globe');
const globe=Globe()(globeEl).backgroundColor('rgba(0,0,0,0)').showAtmosphere(true).atmosphereColor('#5ec4cf').atmosphereAltitude(.12).width(globeEl.clientWidth).height(globeEl.clientHeight).pointsData([{lat:28,lng:0,size:.7,color:'#f18a52'}]).pointLat('lat').pointLng('lng').pointAltitude(.03).pointRadius('size').pointColor('color');
globe.controls().enabled=false; globe.pointOfView({lat:18,lng:22,altitude:2.1},0); globe.globeMaterial().color.set('#176178'); globe.globeMaterial().roughness=.75;
const scene=globe.scene();
const plane=new THREE.Mesh(new THREE.CircleGeometry(112,96),new THREE.MeshBasicMaterial({color:0x55c7d1,transparent:true,opacity:.16,side:THREE.DoubleSide,depthWrite:false})); plane.rotation.x=Math.PI/2; plane.rotation.z=40*Math.PI/180; scene.add(plane);
const orbit=new THREE.Mesh(new THREE.TorusGeometry(112,1.05,8,128),new THREE.MeshBasicMaterial({color:0x8fe3e8})); orbit.rotation.copy(plane.rotation); scene.add(orbit);
const craft=new THREE.Mesh(new THREE.SphereGeometry(3.1,16,12),new THREE.MeshBasicMaterial({color:0xffb06f})); scene.add(craft);
const arrow=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(),24,0xff9a62,7,4); scene.add(arrow);
const time=document.getElementById('time'), az=document.getElementById('az');
const tol=round(360/clamp(globeEl.clientWidth/44,16,30),1); let wasOpen=false;
function angleDiff(a,b){return Math.abs(((a-b+540)%360)-180)}
function update(){
 const t=clamp(finite(time.value,0),0,rotation), a=clamp(finite(az.value,90),0,359), spin=t/rotation*Math.PI*2;
 const lat=28*Math.PI/180, inc=40*Math.PI/180;
 const planeDev=Math.abs(Math.asin(clamp(Math.sin(lat)*Math.cos(inc)-Math.cos(lat)*Math.sin(inc)*Math.sin(spin),-1,1))*180/Math.PI);
 const desired=(78+18*Math.sin(spin)); const dirDev=angleDiff(a,desired);
 const phaseAngle=(t/orbitPeriod*360)%360, gate=(spin*180/Math.PI*1.7+46)%360, phaseDev=angleDiff(phaseAngle,gate);
 const ok=[planeDev<tol,dirDev<tol,phaseDev<tol]; const open=ok.every(Boolean);
 const lng=spin*180/Math.PI-180; globe.pointsData([{lat:28,lng,size:.7,color:open?'#8be09c':'#f18a52'}]);
 const ph=phaseAngle*Math.PI/180; craft.position.set(112*Math.cos(ph),0,112*Math.sin(ph)); craft.position.applyEuler(plane.rotation);
 const p=globe.getCoords(28,lng,.04); arrow.position.set(p.x,p.y,p.z); const dir=new THREE.Vector3(Math.cos(a*Math.PI/180),.25,Math.sin(a*Math.PI/180)).normalize(); arrow.setDirection(dir); arrow.setColor(new THREE.Color(ok[1]?0x72dc9a:0xff805f));
 const hh=Math.floor(t/(secMinute*60)), mm=Math.floor((t/(secMinute))%60); document.getElementById('timeOut').textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`; document.getElementById('azOut').textContent=`${round(a,0)}°`;
 const vals=[["plane",ok[0],`${round(planeDev,1)}°`],["direction",ok[1],ok[1]?`顺行 · ${round(dirDev,1)}°`:`偏差 ${round(dirDev,1)}°`],["phase",ok[2],`${round(phaseDev,1)}°`]];
 vals.forEach(([id,pass,text])=>{const el=document.getElementById(id);el.classList.toggle('ok',pass);el.querySelector('b').textContent=(pass?'满足 ':'未满足 ')+text});
 const st=document.getElementById('state');st.textContent=open?'窗口开启':'窗口关闭 · 等待对齐';st.classList.toggle('open',open);
 const score=ok.filter(Boolean).length; document.querySelectorAll('.k-process .step').forEach((el,i)=>{el.classList.toggle('is-current',i===Math.min(score+1,5));el.classList.toggle('is-done',i<Math.min(score+1,5))});
 wasOpen=open; renderer();
}
function renderer(){globe.renderer().render(scene,globe.camera())}
time.addEventListener('input',update);az.addEventListener('input',update);document.getElementById('reset').addEventListener('click',()=>{time.value=0;az.value=90;update()});
Deck.onResize(()=>{globe.width(globeEl.clientWidth).height(globeEl.clientHeight)}); update();
</script>
</body></html>
