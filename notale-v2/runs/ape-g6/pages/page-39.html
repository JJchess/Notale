<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>舱内危机，要对症处理</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{height:var(--content-h)}.lec-header__progress{font-size:0;line-height:0}.game{height:100%;display:flex;flex-direction:column;gap:12px}.game-top{display:flex;gap:16px;min-height:0;flex:1}.rack{width:270px;padding:14px;border:2px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface-3)}.rack-title{font-size:var(--fs-label);font-weight:750;margin-bottom:10px}.module{padding:10px 12px;margin-top:9px;border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--surface);font-size:var(--fs-sec);line-height:1.45;cursor:grab}.module:focus-visible,.support:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.module.is-used{opacity:.42;cursor:default}.console{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}.brief{display:flex;align-items:center;justify-content:space-between;gap:16px}.brief p{font-size:var(--fs-sec);line-height:1.45}.pressure{white-space:nowrap;font-size:var(--fs-label);color:var(--muted)}.pressure sup{font-size:var(--fs-label)}.crisis{flex:1;min-height:0;padding:16px 20px;border:3px solid var(--warm);border-radius:var(--radius-lg);background:var(--accent-soft);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}.crisis.stable{border-color:var(--success)}.crisis-head{display:flex;justify-content:space-between;align-items:center;gap:16px}.crisis-head h2{font-size:var(--fs-h2)}.margin{display:flex;gap:6px;align-items:center;font-size:var(--fs-label)}.pip{width:28px;height:10px;border-radius:10px;background:var(--success)}.pip.off{background:var(--line)}.signal{font-size:var(--fs-lead);font-weight:650;line-height:1.45}.slot{min-height:62px;display:flex;align-items:center;justify-content:center;padding:10px;border:2px dashed var(--accent);border-radius:var(--radius-md);background:var(--accent-soft);font-size:var(--fs-sec);line-height:1.45;text-align:center}.chain{display:flex;align-items:stretch;gap:8px}.chain-part{flex:1;min-width:0;padding:8px;border-left:4px solid var(--line-strong);background:var(--surface-2);font-size:var(--fs-sec);line-height:1.4}.arrow{align-self:center;color:var(--accent-strong);font-size:22px;font-weight:800}.supports{display:flex;gap:10px}.support{flex:1;min-height:42px;padding:7px 12px;border:1px solid var(--accent-strong);border-radius:var(--radius-sm);background:var(--accent);color:#fff;font:650 var(--fs-sec)/1.4 var(--font-sans);cursor:pointer}.feedback{min-height:25px;font-size:var(--fs-sec);line-height:1.45;color:var(--muted)}.summary{padding:10px 12px;border:2px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface-3)}.summary-title{font-size:var(--fs-label);font-weight:750;margin-bottom:6px}.summary-row{display:grid;grid-template-columns:1.3fr .85fr 1.25fr 1.35fr;border-top:1px solid var(--line)}.summary-row>span{min-width:0;padding:5px 8px;font-size:14px;line-height:1.35}.summary-row.head{border-top:0;background:var(--surface-2);font-weight:750}.summary-row.done{background:var(--success-soft)}.reset{align-self:flex-end;min-height:42px;padding:7px 16px;border:1px solid var(--accent-strong);border-radius:var(--radius-sm);background:var(--accent);color:#fff;font:680 var(--fs-sec)/1.4 var(--font-sans)}.win{font-size:var(--fs-lead);font-weight:750;color:var(--success)}
  </style>
</head>
<body data-page="39" data-total="48">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({index:39,kicker:"LIFE-SUPPORT TRIAGE",title:"舱内危机，要对症处理",take:"生命保障先识别致害机制，再调用对症且没有明显短板的系统。"});
    Deck.init({index:39,total:48});
    const main=document.getElementById('main');
    const pa=Lec.P.finiteNumber(Lec.K.SEA_LEVEL_PRESSURE_PA,0), vac=Lec.P.finiteNumber(Lec.K.SPACE_VACUUM_PRESSURE_PA,0);
    const kpa=Lec.P.finiteNumber(1000,1), ref=Lec.P.round(Lec.P.clamp(pa/kpa,vac,pa),1), outside=Lec.P.round(Lec.P.clamp(vac/kpa,vac,pa),1);
    const cases=[
      {name:'真空与失压',signal:'舱壁受损，舱压持续下降。',cat:'压力边界失效',module:'隔离并封堵',support:'边界恢复后重新加压',other:'只增加供氧',goal:'阻止气体逸散，重建压力环境'},
      {name:'温度失控',signal:'热控回路异常，舱温持续偏高。',cat:'热量转移与排散失衡',module:'恢复主动热控',support:'启用散热路径',other:'增加舱压',goal:'恢复可工作的温度范围'},
      {name:'辐射',signal:'外部粒子事件使预计暴露升高。',cat:'高能粒子穿透与沉积',module:'进入遮蔽区',support:'持续监测并减少暴露',other:'开启空气净化',goal:'降低累计暴露'},
      {name:'失重环境',signal:'工具漂浮，面部附近空气滞留。',cat:'缺少稳定上下与自然对流',module:'固定人员与物体',support:'启动强制通风',other:'开启加热器',goal:'控制漂浮物并带走呼出气体'},
      {name:'二氧化碳积累',signal:'空气处理异常，二氧化碳进入过量区。',cat:'代谢废气超过处理能力',module:'恢复空气循环与去除单元',support:'检查或更换去除单元',other:'只补充氧气',goal:'带走并去除二氧化碳'}
    ];
    const modules=cases.map(x=>x.module); let state;
    main.innerHTML=`<section class="game k-classification" aria-label="舱内危机分类游戏"><div class="game-top"><aside class="rack min0"><div class="rack-title">环境控制模块</div><div id="leftRack"></div></aside><div class="console min0"><div class="brief"><p>拖动或选中对策模块，观察它对应哪种致害机制。</p><span class="pressure">压力参考 <b>${ref} kPa</b>｜外部接近 <b>${outside} kPa</b><sup title="教学近似，不表示宇宙空间绝对没有粒子">＊</sup></span></div><article id="crisis" class="crisis lv"></article><div id="feedback" class="feedback" aria-live="polite"></div></div><aside class="rack min0"><div class="rack-title">暴露与操作模块</div><div id="rightRack"></div></aside></div><section class="summary box"><span class="bt summary-title">已建立的威胁—对策分类</span><div class="summary-row head"><span>信号</span><span>威胁类别</span><span>首要对策</span><span>恢复目标</span></div><div id="rows"></div></section><button id="reset" class="reset">重置危机</button></section>`;
    const crisis=document.getElementById('crisis'),feedback=document.getElementById('feedback'),rows=document.getElementById('rows');
    function fresh(){return {index:0,safety:3,phase:'module',done:[],over:false};}
    function moduleEl(label,i){const el=document.createElement('div');el.className='module';el.textContent=label;el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('draggable','true');el.setAttribute('aria-label','选择对策：'+label);el.dataset.i=i;el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',String(i)));el.addEventListener('click',()=>choose(i));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(i)}});return el}
    modules.forEach((m,i)=>(i<3?leftRack:rightRack).appendChild(moduleEl(m,i)));
    crisis.addEventListener('dragover',e=>e.preventDefault());crisis.addEventListener('drop',e=>{e.preventDefault();choose(Number(e.dataTransfer.getData('text/plain')))});
    function choose(i){if(state.over||state.phase!=='module')return;const c=cases[state.index];if(i===state.index){state.phase='support';feedback.textContent='机制匹配。再选择一个支持动作，使系统恢复稳定。'}else{state.safety--;feedback.textContent=`“${modules[i]}”处理的是${cases[i].cat}，不是${c.cat}。`;if(state.safety<=0){state.over=true;feedback.textContent+=' 安全余量耗尽，本轮失败。重置后再试。'}}render();}
    function support(ok){if(state.over||state.phase!=='support')return;const c=cases[state.index];if(!ok){state.safety--;feedback.textContent=`“${c.other}”没有阻断${c.cat}。`;if(state.safety<=0){state.over=true;feedback.textContent+=' 安全余量耗尽，本轮失败。'}}else{state.done.push(state.index);state.index++;state.safety=3;state.phase='module';feedback.textContent=state.index===cases.length?'五类危机全部稳定：相似警报，需要不同系统。':'系统恢复稳定。读取下一条信号。';if(state.index===cases.length)state.over=true;}render();}
    function render(){document.querySelectorAll('.module').forEach((el,i)=>el.classList.toggle('is-used',state.done.includes(i)));rows.innerHTML=state.done.map(i=>{const c=cases[i];return `<div class="summary-row done"><span>${c.signal}</span><span>${c.cat}</span><span>${c.module}</span><span>${c.goal}</span></div>`}).join('');if(state.index>=cases.length){crisis.className='crisis stable lv';crisis.innerHTML='<div class="win">全部系统稳定</div><div class="signal">危险并非同一种“缺空气”：压力、热、辐射、失重环境与空气成分，致害机制各不相同。</div>';return}const c=cases[state.index];const pips=[0,1,2].map(i=>`<i class="pip ${i<state.safety?'':'off'}"></i>`).join('');crisis.className='crisis lv'+(state.phase==='support'?' stable':'');crisis.innerHTML=`<div class="crisis-head"><h2>危机 ${state.index+1}｜${c.name}</h2><div class="margin">安全余量 ${pips}</div></div><div class="signal">信号：${c.signal}</div><div class="slot">${state.phase==='module'?'把首要对策拖到这里，或用键盘选中模块':'已匹配：'+c.module}</div>${state.phase==='support'?`<div class="chain"><div class="chain-part">${c.signal}</div><b class="arrow">→</b><div class="chain-part">${c.cat}</div><b class="arrow">→</b><div class="chain-part">${c.module}</div><b class="arrow">→</b><div class="chain-part">${c.goal}</div></div><div class="supports"><button class="support" data-ok="1">${c.support}</button><button class="support" data-ok="0">${c.other}</button></div>`:''}`;crisis.querySelectorAll('.support').forEach(b=>b.onclick=()=>support(b.dataset.ok==='1'));}
    document.getElementById('reset').onclick=()=>{state=fresh();feedback.textContent='已重置。先判断当前信号属于哪种机制。';render()};state=fresh();render();
  </script>
</body>
</html>
