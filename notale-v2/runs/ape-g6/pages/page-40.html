<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>离开地球，靠的是整串系统都能工作</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #main{height:var(--content-h)}
    .lec-header__progress{appearance:none;-webkit-appearance:none;display:block;border:0;padding:0;line-height:0;font-size:0} progress::-webkit-progress-bar{height:5px;background:var(--surface-3)} progress::-webkit-progress-value{height:5px;background:var(--accent)}
    .system-ledger{height:100%;display:flex;flex-direction:column;gap:var(--sp-4)}
    .ledger-intro{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-6);padding-bottom:var(--sp-3);border-bottom:1px solid var(--line)}
    .ledger-intro .lead{max-width:980px}
    .plate-mark{flex:0 0 auto;color:var(--muted);font-size:var(--fs-label);font-weight:700;letter-spacing:.12em}
    .k-generalization.system-map{display:flex;flex-direction:column;gap:var(--sp-3);align-items:stretch;flex:1;min-height:0}
    .system-map>.supports{display:flex;flex-direction:column;gap:var(--sp-2);padding:30px 0 0;flex:1;min-height:0}
    .system-map>.supports::before{content:"必须做到                                      系统支撑                                      明显短板的结果";position:absolute;top:0;left:32px;right:0;white-space:pre;color:var(--muted);font-size:var(--fs-label);font-weight:700;letter-spacing:.03em}
    .system-map>.supports>.trunk{top:38px;bottom:0;left:8px;width:3px;background:var(--line-strong)}
    .system-map>.supports>.support{display:grid;grid-template-columns:minmax(0,1.14fr) minmax(220px,.72fr) minmax(0,1.38fr);align-items:center;gap:var(--sp-5);flex:1;padding:var(--sp-2) var(--sp-5);border-radius:0;border-width:1px 0;background:rgb(255 253 248 / 72%);box-shadow:none;font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .system-map>.supports>.support::before{width:var(--sp-5);height:2px}
    .support .need{font-weight:650;color:var(--text)}
    .support .system{position:relative;padding:var(--sp-2) var(--sp-4);border:1px solid var(--line-strong);background:var(--surface);text-align:center;font-weight:720;letter-spacing:.02em}
    .support .system::before,.support .system::after{content:"";position:absolute;top:50%;width:var(--sp-5);border-top:1px dashed var(--line-strong)}
    .support .system::before{right:100%}.support .system::after{left:100%}
    .support .fail{color:#8b4b34}
    .system-map>.claim{position:relative;align-self:center;width:780px;padding:var(--sp-3) var(--sp-6);border:2px solid var(--accent);border-inline-start-width:8px;border-radius:0;background:var(--accent-soft);color:var(--accent-strong);font-size:var(--fs-lead);font-weight:780;line-height:var(--lh-copy);text-align:center}
    .system-map>.claim::before{content:"";position:absolute;bottom:100%;left:50%;height:var(--sp-5);border-left:3px solid var(--line-strong)}
    .handoff{align-self:flex-end;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  </style>
</head>
<body data-page="40" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="system-ledger" aria-label="航天系统技术账簿">
        <div class="ledger-intro min0">
          <p class="lead">一部分做得极强，不能补偿另一部分低于飞行或生存门槛。</p>
          <span class="plate-mark">SYSTEM INTEGRATION</span>
        </div>
        <div class="k-generalization system-map min0">
          <div class="claim">速度、方向、质量、控制、生存条件同时达标 → 任务才成立</div>
          <div class="supports min0">
            <span class="trunk" aria-hidden="true"></span>
            <div class="support min0"><span class="need">获得合适的速度与方向</span><span class="system">轨道与发射条件</span><span class="fail">飞得很高，也可能无法进入目标轨道</span></div>
            <div class="support min0"><span class="need">持续改变速度</span><span class="system">推进与反冲</span><span class="fail">推力存在，却无法完成所需速度变化</span></div>
            <div class="support min0"><span class="need">不把过多能力耗在无效质量上</span><span class="system">质量配置与分级</span><span class="fail">推进剂主要用于加速推进剂与空结构</span></div>
            <div class="support min0"><span class="need">在正确时机执行正确动作</span><span class="system">导航、测量与控制</span><span class="fail">微小偏差累积成错误轨迹或错失窗口</span></div>
            <div class="support min0"><span class="need">让乘员在严酷环境中继续生存</span><span class="system">舱体与生命保障</span><span class="fail">轨道正确，任务仍可能因舱内环境失效</span></div>
          </div>
        </div>
        <p class="handoff">下一页：谁在地面上让这些系统持续工作。</p>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 40,
      kicker: "SYSTEMS SYNTHESIS",
      title: "离开地球，靠的是整串系统都能工作",
      take: "离开地球靠的不是一项神奇发明，而是一串没有明显短板的系统。"
    });
    Deck.init({ index: 40, total: 48 });
  </script>
</body>
</html>
