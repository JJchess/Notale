<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>轨道上的一个人，地面上的一张网</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .mission{height:620px;display:flex;flex-direction:column;gap:12px}
    .mission-summary{height:54px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px 18px;border-left:5px solid var(--accent);background:var(--surface);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
    .mission-summary strong{font-size:var(--fs-lead);line-height:1.35}.mission-summary span{font-size:var(--fs-sec);line-height:1.45;color:var(--muted);text-align:right}
    .network{position:relative;height:438px;min-height:0;box-sizing:border-box;border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;background:linear-gradient(135deg,#102b34,#173f48);box-shadow:var(--shadow)}
    #globe{position:absolute;left:374px;top:1px;width:660px;height:434px;overflow:hidden;cursor:grab}#globe:active{cursor:grabbing}
    .orbit-data{position:absolute;z-index:5;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:12px;padding:6px 12px;border-radius:999px;background:rgb(10 35 42 / 88%);color:#eaffff;font-size:var(--fs-label);line-height:1.4;white-space:nowrap}
    .k-enumeration.nodes{--enum-cols:1;position:absolute;z-index:6;inset:14px 16px;display:block;pointer-events:none}
    .nodes>.it{position:absolute;width:300px;height:122px;padding:13px 14px 12px 52px;background:rgb(255 253 248 / 96%);pointer-events:auto;cursor:pointer;transition:border-color .15s,opacity .15s}
    .nodes>.it:nth-child(1),.nodes>.it:nth-child(4){top:0}.nodes>.it:nth-child(2),.nodes>.it:nth-child(5){top:143px}.nodes>.it:nth-child(3),.nodes>.it:nth-child(6){top:286px}.nodes>.it:nth-child(-n+3){left:0}.nodes>.it:nth-child(n+4){right:0}
    .nodes>.it::before{top:13px;left:12px}.nodes>.it:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.nodes>.it.is-active{border:2px solid var(--accent);box-shadow:0 0 0 3px rgb(0 124 145 / 18%)}.nodes>.it.is-dim{opacity:.42}
    .nodes .it-title{font-size:18px;margin:0 0 4px}.node-state{display:inline-block;font-size:14px;font-weight:750;color:var(--accent-strong);margin-right:7px}.node-detail{display:block;font-size:16px;line-height:1.38;color:var(--muted)}
    .lec-header__progress{overflow:visible}
    .controls{height:104px;padding:10px 16px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
    .ctl{min-height:42px}.ctl output{min-width:100px;font-size:var(--fs-body);font-weight:700;font-variant-numeric:tabular-nums}.range-ends{display:flex;justify-content:space-between;margin-left:104px;color:var(--muted);font-size:14px;line-height:1.4}
    .statusline{display:flex;justify-content:space-between;gap:16px;margin-top:4px;font-size:var(--fs-sec);line-height:1.4;color:var(--muted)}
    .statusline strong{color:var(--text)}
  </style>
</head>
<body data-page="41" data-total="48">
  <div id="stage"><main id="main"></main></div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/three.min.js"></script>
  <script src="assets/lib/globe.gl.min.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
    Lec.mount({index:41,kicker:"GROUND MAKES SPACEFLIGHT",title:"轨道上的一个人，地面上的一张网",take:"宇航员在轨道上，但任务能力分布在持续工作的全球地面网络中。"});
    Deck.init({index:41,total:48});
    const main=document.getElementById('main');
    main.innerHTML=`<section class="mission"><div class="mission-summary"><strong id="eventTitle">常规监测：全球网络同时值守</strong><span id="eventWhy">遥测下传后，软件检查数据，测控与医生共同监看。</span></div><div class="network"><div id="globe" aria-label="代表性近地轨道与全球任务支持节点"></div><div class="orbit-data"><span id="alt"></span><span id="speed"></span><span id="period"></span></div><div class="k-enumeration nodes" id="nodes" aria-label="六类并列支持节点"></div></div><div class="controls"><div class="ctl"><label for="time">追踪本圈时刻</label><input id="time" type="range" min="0" step="1" aria-describedby="eventWhy"><output id="clock" for="time">第0分0秒</output></div><div class="range-ends"><span>本圈开始</span><span>本圈结束</span></div><div class="statusline"><span id="counts" aria-live="polite"></span><span>代表性教学任务 · 轨道高度为便于观察而视觉夸张；实际周期会随轨道变化</span></div></div></section>`;
    const K=(Lec.K||{}), P=(Lec.P||Lec), fn=(name,v)=>P.finiteNumber(K[name],v);
    const period=fn('ISS_ORBIT_PERIOD_SECONDS',5520), altitude=fn('LOW_EARTH_ORBIT_ALTITUDE_M',400000), speed=fn('LOW_EARTH_ORBIT_SPEED_MPS',7700), earthR=fn('EARTH_RADIUS_M',6371000);
    document.getElementById('alt').textContent=`高度约${P.round(altitude/1000,0)}千米`;
    document.getElementById('speed').textContent=`速度约${P.round(speed/1000,1)}千米/秒`;
    document.getElementById('period').textContent=`周期约${P.round(period/60,0)}分钟`;
    const categories=[
      {id:'launch',name:'发射场',details:['上升段跟踪','返回协调','点火许可'],lat:28.5,lng:-80.6},
      {id:'tracking',name:'测控站',details:['遥测下传','站间接力','指令上行'],lat:35.2,lng:-116.8},
      {id:'supplier',name:'供应商',details:['设备支持','故障资料','替换件状态'],lat:48.8,lng:2.3},
      {id:'doctor',name:'医生',details:['健康监测','适任复核','处置建议'],lat:29.6,lng:-95.1},
      {id:'software',name:'软件系统',details:['遥测检查','导航处理','告警生成'],lat:51.5,lng:-0.1},
      {id:'rules',name:'国际规则',details:['频率协调','安全协议','责任边界'],lat:46.2,lng:6.1}
    ];
    const events=[
      {p:0,title:'常规监测：全球网络同时值守',why:'遥测下传后，软件检查数据，测控与医生共同监看。',active:['tracking','doctor','software'],states:{tracking:'监看',doctor:'监看',software:'监看'}},
      {p:.28,title:'测控站接力：连接改变，支持不中断',why:'飞行器离开一个站的覆盖区，另一站接续遥测与语音。',active:['tracking','software','rules'],states:{tracking:'响应',software:'监看',rules:'约束'}},
      {p:.57,title:'软件告警：机器提示，人员复核',why:'软件生成告警；测控、医生与设备团队共同判断。',active:['software','tracking','doctor','supplier'],states:{software:'响应',tracking:'响应',doctor:'响应',supplier:'响应'}},
      {p:.82,title:'返回前确认：多类节点共同放行',why:'返回协调、健康判断、设备状态与安全程序同时确认。',active:['launch','tracking','supplier','doctor','software','rules'],states:{launch:'响应',tracking:'监看',supplier:'监看',doctor:'响应',software:'监看',rules:'约束'}}
    ];
    const nodeSel=d3.select('#nodes').selectAll('button').data(categories,d=>d.id).join('button').attr('type','button').attr('class','it').attr('aria-pressed','false').html(d=>`<span class="it-title">${d.name}</span><span class="node-state">待命</span><span class="node-detail">${d.details.join(' · ')}</span>`);
    let focus=null;
    nodeSel.on('click',(e,d)=>{focus=focus===d.id?null:d.id;render(+time.value);});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){focus=null;render(+time.value)}});
    const globe=Globe()(document.getElementById('globe')).width(660).height(434).backgroundColor('rgba(0,0,0,0)').showAtmosphere(true).atmosphereColor('#67c8d5').atmosphereAltitude(.16).globeImageUrl(null).globeMaterial(new THREE.MeshPhongMaterial({color:'#295d66',emissive:'#102a32',shininess:8})).pointLat('lat').pointLng('lng').pointAltitude(.015).pointRadius(.38).pointColor(d=>d.active?'#5de5ef':'#71888c').arcStartLat('lat').arcStartLng('lng').arcEndLat('satLat').arcEndLng('satLng').arcAltitude(.18).arcStroke(.55).arcDashLength(.45).arcDashGap(.18).arcColor(d=>d.kind==='响应'?'#f2a65a':d.kind==='约束'?'#bd8cff':'#60d9e5');
    globe.controls().autoRotate=false; globe.controls().enableZoom=false; globe.controls().minPolarAngle=Math.PI/2; globe.controls().maxPolarAngle=Math.PI/2;
    const time=document.getElementById('time'); time.max=period;
    time.addEventListener('input',()=>render(+time.value));
    function currentEvent(r){let out=events[0];events.forEach(e=>{if(r>=e.p)out=e});return out}
    function render(raw){const sec=P.clamp(P.finiteNumber(raw,0),0,period),ratio=P.clamp(sec/period,0,1),ev=currentEvent(ratio),angle=2*Math.PI*ratio;
      const satLat=12*Math.sin(angle),satLng=((ratio*360+20)%360)-180;
      const states=categories.map(d=>({...d,active:ev.active.includes(d.id),state:ev.states[d.id]||'待命'}));
      const shown=focus?states.filter(d=>d.id===focus):states.filter(d=>d.active); const arcs=shown.filter(d=>d.active).map(d=>({...d,satLat,satLng,kind:d.state}));
      globe.pointsData(states).arcsData(arcs).pointOfView({lat:0,lng:satLng,altitude:2.05},Deck.reduced()?0:240);
      nodeSel.classed('is-active',d=>states.find(x=>x.id===d.id).active).classed('is-dim',d=>focus&&focus!==d.id).attr('aria-pressed',d=>String(focus===d.id)).select('.node-state').text(d=>states.find(x=>x.id===d.id).state);
      document.getElementById('eventTitle').textContent=ev.title;document.getElementById('eventWhy').textContent=ev.why;
      const mins=Math.floor(sec/60),secs=P.round(sec%60,0);document.getElementById('clock').textContent=`第${mins}分${secs}秒`;
      const active=states.filter(d=>d.active), pending=states.filter(d=>d.state==='响应').length;
      document.getElementById('counts').innerHTML=`当前参与：<strong>${active.length}/${categories.length}类</strong>　连线：<strong>${arcs.length}</strong>　待确认：<strong>${pending}</strong>`;
      time.setAttribute('aria-label',`追踪本圈时刻：第${mins}分${secs}秒。正在参与：${active.map(d=>d.name).join('、')}`);
    }
    render(0);
  </script>
</body>
</html>
