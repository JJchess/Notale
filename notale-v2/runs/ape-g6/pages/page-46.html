main.innerHTML=`<section class="page"><div class="intro"><p>四条路线不是进步阶梯。移动四枚筹码，再说明你看重什么、愿承担什么。</p><span class="counts"></span></div><div class="route-heads"><div class="corner">人类驻留 →<br><span class="hint">两条路线并列</span></div>${routes.map((r,i)=>`<div class="route" data-route="${i}"><img src="${r.img}" alt="${r.tag}" title="${r.title}"><div class="stake">0%</div><div class="route-copy"><strong>${r.name}</strong><span>${r.tag}｜${r.desc}</span></div></div>`).join('')}</div><div class="k-comparison matrix" hidden></div><div class="betbar"><div><div class="chips" aria-label="路线筹码">${state.stakes.map((r,i)=>`<button class="chip" draggable="true" data-chip="${i}" aria-label="筹码 ${i+1}，按空格移动到下一路线">${i+1}</button>`).join('')}</div><div class="hint">拖到照片；键盘可按空格轮换</div></div><label>首要理由 <select id="reason"><option value="">请选择</option><option>科学知识</option><option>长期居住</option><option>近期公共利益</option><option>降低人员风险</option></select></label><label>接受代价 <select id="cost"><option value="">请选择</option><option>高资源投入</option><option>人员风险</option><option>机会集中</option><option>不可逆承诺</option></select></label><div class="feedback" aria-live="polite"></div><button class="btn reset">重置</button></div></section>`;
const counts=main.querySelector('.counts'),matrix=main.querySelector('.matrix');counts.textContent=`${Lec.P.round(Lec.P.finiteNumber(routes.length,0),0)} 条路线 · ${Lec.P.round(Lec.P.finiteNumber(dimensions.length,0),0)} 个维度`;
matrix.innerHTML=`<div class="hdr">同一维度</div>${routes.map(r=>`<div class="hdr">${r.name}</div>`).join('')}${dimensions.map(row=>`<div class="dim">${row[0]}</div>${row.slice(1).map((x,i)=>`<div class="cell ${i===1||i===3?'diff':''}">${x}</div>`).join('')}<div class="rowline"></div>`).join('')}`;
function render(){const total=Lec.P.finiteNumber(state.stakes.length,0);const cs=routes.map((_,i)=>state.stakes.filter(x=>x===i).length);const max=Math.max(...cs);main.querySelectorAll('.route').forEach((el,i)=>{const ratio=Lec.P.clamp(Lec.P.finiteNumber(cs[i]/total,0),0,1);el.querySelector('.stake').textContent=Lec.P.round(ratio*100,0)+'%';el.classList.toggle('is-led',cs[i]===max&&max>0)});const ready=state.reason&&state.cost;matrix.hidden=!ready;const leaders=cs.map((n,i)=>({n,i})).filter(x=>x.n===max).map(x=>routes[x.i].name);const f=main.querySelector('.feedback');if(!ready)f.textContent='筹码可集中，也可分散；完成两项选择后展开比较。';else if(leaders.length===1)f.textContent=`你优先选择了${leaders[0]}，主要因为${state.reason}；这也意味着接受${state.cost}。`;else f.textContent=`你同时押注${leaders.join('、')}；目标之间的资源分配本身成为选择。`;}
function moveChip(ci,ri){state.stakes[ci]=ri;render()}
main.querySelectorAll('.chip').forEach(b=>{b.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',b.dataset.chip));b.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();const i=+b.dataset.chip;moveChip(i,(state.stakes[i]+1)%routes.length)}})});main.querySelectorAll('.route').forEach(el=>{el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',e=>{e.preventDefault();moveChip(+e.dataTransfer.getData('text/plain'),+el.dataset.route)})});
main.querySelector('#reason').addEventListener('change',e=>{state.reason=e.target.value;render()});main.querySelector('#cost').addEventListener('change',e=>{state.cost=e.target.value;render()});main.querySelector('.reset').addEventListener('click',()=>{state={stakes:[0,1,2,3],reason:'',cost:'',done:false};main.querySelector('#reason').value='';main.querySelector('#cost').value='';render()});render();
</script></body></html>
