<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>从猿人到太空人，是层层嵌套的历史</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    progress.lec-header__progress { appearance: none; -webkit-appearance: none; border: 0; overflow: visible; }
    .synthesis {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
    }
    .synthesis__intro {
      color: var(--muted);
      font-size: var(--fs-lead);
      font-weight: 580;
      line-height: var(--lh-copy);
    }
    .k-generalization.ledger {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      min-height: 0;
      align-items: stretch;
    }
    .k-generalization.ledger > .claim {
      padding: var(--sp-3) var(--sp-5);
      border-inline-start-width: 8px;
      font-size: var(--fs-lead);
      line-height: 1.4;
    }
    .ledger__system {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
      align-items: stretch;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface-2);
    }
    .k-generalization.ledger .supports {
      flex: 1 1 auto;
      gap: 0;
      padding-inline-start: var(--sp-6);
    }
    .k-generalization.ledger .supports > .trunk {
      top: var(--sp-3);
      bottom: var(--sp-3);
      background: var(--accent);
    }
    .k-generalization.ledger .support {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      gap: var(--sp-5);
      padding: var(--sp-2) var(--sp-5);
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: var(--surface);
      font-size: var(--fs-body);
      line-height: 1.4;
    }
    .k-generalization.ledger .support:last-child { border-bottom: 0; }
    .k-generalization.ledger .support::before {
      width: var(--sp-5);
      height: 3px;
      background: var(--accent);
    }
    .layer-name {
      flex: 0 0 250px;
      color: var(--text);
      font-size: var(--fs-h2);
      font-weight: 730;
      line-height: 1.3;
    }
    .layer-copy { flex: 1 1 auto; min-width: 0; }
    .convergence {
      position: relative;
      flex: 0 0 250px;
      display: flex;
      align-items: center;
      margin-left: var(--sp-6);
      padding-left: var(--sp-6);
      background: linear-gradient(90deg, transparent, var(--accent-soft));
    }
    .convergence::before {
      content: "";
      position: absolute;
      inset: var(--sp-4) auto var(--sp-4) 0;
      width: 24px;
      border: 3px solid var(--accent);
      border-left: 0;
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
    }
    .convergence::after {
      content: "";
      position: absolute;
      left: 24px;
      width: var(--sp-5);
      height: 3px;
      background: var(--accent);
    }
    .convergence__label {
      padding: var(--sp-4);
      border: 2px solid var(--accent);
      border-radius: var(--radius-md);
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: var(--fs-h2);
      font-weight: 760;
      line-height: 1.35;
      text-align: center;
    }
    .return {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      border-top: 3px solid var(--accent);
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: var(--fs-lead);
      font-weight: 760;
      line-height: 1.4;
    }
    .return::before {
      content: "↰";
      margin-right: var(--sp-3);
      font-size: 30px;
      line-height: 1;
    }
  </style>
</head>
<body data-page="47" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="synthesis" aria-labelledby="synthesis-claim">
        <p class="synthesis__intro">四层能力彼此托住，没有一层取代前一层。</p>
        <div class="k-generalization ledger">
          <div class="claim" id="synthesis-claim">太空能力属于整个嵌套系统；任何一层都不能单独解释它。</div>
          <div class="ledger__system min0">
            <div class="supports min0">
              <span class="trunk" aria-hidden="true"></span>
              <div class="support">
                <strong class="layer-name">身体提供可能性</strong>
                <span class="layer-copy">直立活动、精细控制与高成本的大脑，为更多行为留下可能；身体没有预写石器、城市或火箭。</span>
              </div>
              <div class="support">
                <strong class="layer-name">文化保存并累积知识</strong>
                <span class="layer-copy">模仿、教学、语言和外部记忆，使经验跨越个体与世代，不必每次从头开始。</span>
              </div>
              <div class="support">
                <strong class="layer-name">能源放大行动规模</strong>
                <span class="layer-copy">可调动的能量越多，人类越能制造、运输、测量和发射；这种放大也同时放大代价。</span>
              </div>
              <div class="support">
                <strong class="layer-name">制度组织协作与选择</strong>
                <span class="layer-copy">分工、标准、证据纠错和公共规则，把许多人的行动接成系统，并决定如何使用能力。</span>
              </div>
            </div>
            <aside class="convergence min0" aria-label="四层共同汇合">
              <div class="convergence__label">离开地球的能力</div>
            </aside>
          </div>
          <div class="return">新的选择与责任，反过来牵动全部四层</div>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 47,
      kicker: "SYSTEM SYNTHESIS",
      title: "从猿人到太空人，是层层嵌套的历史",
      take: "“从猿人到太空人”真正描述的是身体、文化、能源和制度相互嵌套的历史。"
    });
    Deck.init({ index: 47, total: 48 });
  </script>
</body>
</html>
