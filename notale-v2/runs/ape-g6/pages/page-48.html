<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>一种未来，值得追求吗？</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-header__progress{
      overflow:visible;
      line-height:0;
    }
    .lec-header__progress::before{
      box-sizing:border-box;
    }
    .final-lens{
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
      min-width:0;
    }
    .final-lens.k-generalization{
      display:flex;
      gap:0;
      align-items:stretch;
    }
    .final-lens.k-generalization > .supports{
      display:flex;
      flex-direction:row;
      gap:var(--sp-7);
      padding:var(--sp-6) 0 76px;
      min-width:0;
      min-height:430px;
      background:var(--surface-2);
    }
    .final-lens.k-generalization > .supports > .trunk{
      top:auto;
      right:calc(16.666% - 8px);
      bottom:36px;
      left:calc(16.666% - 8px);
      width:auto;
      height:3px;
      border-radius:999px;
      background:var(--line-strong);
    }
    .final-lens.k-generalization > .supports > .support{
      flex:1 1 0;
      min-width:0;
      padding:0 var(--sp-5) var(--sp-5);
      border:0;
      border-radius:0;
      background:transparent;
      text-align:center;
    }
    .final-lens.k-generalization > .supports > .support::before{
      top:100%;
      right:50%;
      width:3px;
      height:76px;
      background:var(--line-strong);
      transform:translateX(50%);
    }
    .lens-label{
      display:block;
      margin-bottom:var(--sp-3);
      color:var(--muted);
      font-size:var(--fs-label);
      font-weight:700;
      line-height:1.4;
      letter-spacing:.12em;
    }
    .lens-question{
      margin:0 0 var(--sp-3);
      color:var(--text);
      font-size:42px;
      font-weight:790;
      line-height:1.2;
      letter-spacing:-.035em;
      white-space:nowrap;
    }
    .lens-question .mark{color:var(--accent-strong)}
    .lens-copy{
      color:var(--muted);
      font-size:var(--fs-body);
      line-height:var(--lh-copy);
    }
    .final-lens.k-generalization > .claim{
      position:relative;
      align-self:center;
      width:520px;
      padding:var(--sp-4) var(--sp-6);
      border:0;
      border-radius:var(--radius-md);
      background:var(--accent-soft);
      color:var(--text);
      font-size:26px;
      font-weight:780;
      line-height:1.4;
      text-align:center;
    }
    .final-lens.k-generalization > .claim::before{
      content:"";
      position:absolute;
      bottom:100%;
      left:50%;
      width:14px;
      height:14px;
      border:4px solid var(--bg);
      border-radius:50%;
      background:var(--accent);
      transform:translate(-50%,7px);
    }
    .closing{
      margin-top:var(--sp-5);
      color:var(--muted);
      font-size:var(--fs-sec);
      line-height:var(--lh-sec);
      text-align:center;
    }
  </style>
</head>
<body data-page="48" data-total="48">
  <div id="stage">
    <main id="main">
      <section class="final-lens k-generalization" aria-label="判断未来是否值得追求的三个共同维度">
        <div class="supports">
          <div class="trunk" aria-hidden="true"></div>
          <article class="support min0">
            <span class="lens-label">可行性</span>
            <h2 class="lens-question">能不能<span class="mark">？</span></h2>
            <p class="lens-copy">技术、资源与协作条件是否足够？</p>
          </article>
          <article class="support min0">
            <span class="lens-label">受益者</span>
            <h2 class="lens-question">为谁做<span class="mark">？</span></h2>
            <p class="lens-copy">谁能参与，谁能获得成果？</p>
          </article>
          <article class="support min0">
            <span class="lens-label">责任</span>
            <h2 class="lens-question">代价由谁承担<span class="mark">？</span></h2>
            <p class="lens-copy">风险、成本与长期影响落在谁身上？</p>
          </article>
        </div>
        <div class="claim">共同判断：值得追求？</div>
        <p class="closing">这三问不替你给出答案，但能让答案更完整、更可辩护。</p>
      </section>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Lec.mount({
      index: 48,
      kicker: "FINAL LENS",
      title: "一种未来，值得追求吗？",
      take: "判断一种未来是否值得追求，要同时问：能不能、为谁做、代价由谁承担。"
    });
    Deck.init({ index: 48, total: 48 });
  </script>
</body>
</html>
