<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>从谱系出发，直到太空暴露我们的脆弱</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .route-page {
    height: 100%;
    box-sizing: border-box;
  }
  .route-intro {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--sp-6);
    padding-bottom: var(--sp-4);
    border-bottom: 1px solid var(--line);
  }
  .route-intro .lead {
    max-width: 820px;
    color: var(--text);
    font-weight: 750;
  }
  .route-intro .note {
    max-width: 470px;
    text-align: right;
  }
  .route-ledger {
    --enum-cols: 1;
    position: relative;
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
    margin-top: var(--sp-4);
    padding-left: 46px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-soft);
    overflow: hidden;
  }
  .route-ledger::before {
    position: absolute;
    top: 52px;
    bottom: 52px;
    left: 69px;
    width: 3px;
    background: var(--line-strong);
    content: "";
  }
  .route-head,
  .route-ledger > .it {
    display: grid;
    grid-template-columns: 116px 260px minmax(0, 1fr);
    align-items: center;
    min-width: 0;
  }
  .route-head {
    min-height: 42px;
    color: var(--muted);
    background: var(--surface-soft);
    border-bottom: 1px solid var(--line);
    font-size: var(--fs-label);
    font-weight: 700;
    letter-spacing: .04em;
  }
  .route-head > span,
  .route-ledger > .it > * {
    min-width: 0;
  }
  .route-head > span {
    align-self: stretch;
    display: flex;
    align-items: center;
    padding-left: var(--sp-3);
    border-right: 1px solid var(--line);
  }
  .route-head > span:last-child {
    background: var(--primary-soft);
    border-right: 0;
  }
  .route-ledger > .it {
    position: relative;
    min-height: 98px;
    padding: 0;
    background: var(--surface);
    border: 0;
    border-top: 1px solid var(--line);
    border-radius: 0;
    box-shadow: none;
  }
  .route-ledger > .it:first-of-type {
    border-top: 0;
  }
  .route-index {
    position: relative;
    z-index: 1;
    align-self: stretch;
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    padding-left: var(--sp-3);
    color: var(--muted);
    background: var(--surface-soft);
    font-size: var(--fs-sec);
    font-weight: 750;
  }
  .route-index::before {
    width: 15px;
    height: 15px;
    flex: 0 0 auto;
    box-sizing: border-box;
    background: var(--surface);
    border: 3px solid var(--line-strong);
    border-radius: 50%;
    content: "";
  }
  .route-key {
    align-self: stretch;
    display: flex;
    align-items: center;
    padding-left: var(--sp-5);
    color: #7a3512;
    background: var(--accent-soft);
    border-left: 1px solid #efbd99;
    font-size: var(--fs-h2);
    font-weight: 800;
    line-height: var(--lh-tight);
  }
  .route-question {
    align-self: stretch;
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    align-items: center;
    min-width: 0;
    height: 100%;
    border-left: 1px solid var(--line);
  }
  .route-question strong,
  .route-question span {
    align-self: stretch;
    display: flex;
    align-items: center;
    box-sizing: border-box;
    padding: 0 var(--sp-5);
  }
  .route-question strong {
    background: var(--surface-soft);
    font-size: var(--fs-body);
    line-height: var(--lh-body);
  }
  .route-question span {
    color: var(--muted);
    background: var(--primary-soft);
    border-left: 1px solid var(--line);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
  }
</style>
</head>
<body data-page="02" data-total="45">
<div id="stage">
<main id="main">
  <section class="route-page col min0" aria-labelledby="route-summary">
    <div class="route-intro min0">
      <p class="lead" id="route-summary">全课沿“谱系—身体—文化—航天系统—脆弱性”推进。</p>
      <p class="note">这不是一条从低到高的升级路线，而是依次回答的五组问题。</p>
    </div>

    <div class="k-enumeration route-ledger min0" aria-label="全课五站路线">
      <div class="route-head" aria-hidden="true">
        <span>章节</span><span>关键词</span><span>本章追问与方向</span>
      </div>

      <article class="it">
        <div class="route-index"><span>第一站</span></div>
        <div class="route-key">谱系</div>
        <div class="route-question"><strong>我们是谁的近亲？</strong><span>人类仍位于猿类谱系之中。</span></div>
      </article>

      <article class="it">
        <div class="route-index"><span>第二站</span></div>
        <div class="route-key">身体</div>
        <div class="route-question"><strong>哪些部分先后改变？</strong><span>身体特征并未同步“升级”。</span></div>
      </article>

      <article class="it">
        <div class="route-index"><span>第三站</span></div>
        <div class="route-key">文化</div>
        <div class="route-question"><strong>能力怎样跨代保存？</strong><span>个体能够借用前人的成果。</span></div>
      </article>

      <article class="it">
        <div class="route-index"><span>第四站</span></div>
        <div class="route-key">航天系统</div>
        <div class="route-question"><strong>什么把人送入太空？</strong><span>能源、技术与组织必须共同运作。</span></div>
      </article>

      <article class="it">
        <div class="route-index"><span>第五站</span></div>
        <div class="route-key">脆弱性</div>
        <div class="route-question"><strong>离开地球要带上什么？</strong><span>人体仍依赖地球式生存条件。</span></div>
      </article>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Lec.mount({
    index: 2,
    kicker: "COURSE ROUTE",
    title: "从谱系出发，直到太空暴露我们的脆弱",
    take: "全课沿“谱系—身体—文化—航天系统—脆弱性”推进"
  });
</script>
</body>
</html>
