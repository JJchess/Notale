<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>黑猩猩不是我们的过去</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page04{height:100%;display:flex;flex-direction:column;gap:16px;min-width:0}
  .process-strip{height:78px;flex:0 0 auto;--process-gap:28px}
  .process-strip .step{padding:10px 12px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:var(--fs-label);line-height:var(--lh-tight)}
  .tree-wrap{position:relative;flex:1 1 auto;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-soft);overflow:hidden}
  #tree{display:block;width:100%;height:100%}
  .tree-link{fill:none;stroke:var(--line-strong);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .tree-link.active{stroke:var(--primary);stroke-width:8}
  .tree-node{fill:var(--surface);stroke:var(--line-strong);stroke-width:4}
  .tree-node.active{fill:var(--primary-soft);stroke:var(--primary);stroke-width:6}
  .tree-node.ancestor{fill:var(--accent-soft);stroke:var(--accent)}
  .tree-label{font-family:var(--font-sans);font-size:22px;font-weight:750;fill:var(--text)}
  .tree-small{font-family:var(--font-sans);font-size:16px;fill:var(--muted)}
  .tree-guide{stroke:var(--line);stroke-width:2;stroke-dasharray:7 8}
  .tree-time{font-family:var(--font-sans);font-size:15px;font-weight:700;fill:var(--muted)}
  .node-control{position:absolute;min-width:150px;min-height:48px;font-size:var(--fs-sec);transform:translate(-50%,-50%);z-index:3}
  #advance{left:42%;top:53%}
  .status{position:absolute;left:28px;bottom:22px;max-width:520px;padding:12px 16px;background:rgb(255 255 255 / 94%);border-left:5px solid var(--primary);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:var(--fs-sec);line-height:var(--lh-body);z-index:2}
  .reading-key{position:absolute;left:28px;top:20px;z-index:2;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:var(--fs-label);line-height:var(--lh-tight)}
  .reading-key span{padding:6px 10px;background:var(--surface-soft);border-radius:var(--r-sm)}
  .claim-row{min-height:62px;flex:0 0 auto;display:flex;align-items:center;gap:18px;padding:0 20px;color:var(--primary-strong);background:var(--primary-soft);border-left:8px solid var(--primary);border-radius:0 var(--r-md) var(--r-md) 0;font-size:var(--fs-lead);font-weight:800;line-height:var(--lh-body)}
  .claim-row button{margin-left:auto;flex:0 0 auto}
</style>
</head>
<body data-page="04" data-total="45">
<div id="stage">
<main id="main">
  <section class="page04 min0" aria-label="共同祖先树互动">
    <div class="k-process process-strip axis" aria-label="回溯共同祖先的五步过程">
      <div class="step is-current" data-step="0">现生枝端并列</div><span class="arw" aria-hidden="true"></span>
      <div class="step" data-step="1">沿两枝回溯</div><span class="arw" aria-hidden="true"></span>
      <div class="step" data-step="2">路径汇合</div><span class="arw" aria-hidden="true"></span>
      <div class="step" data-step="3">辨认祖先节点</div><span class="arw" aria-hidden="true"></span>
      <div class="step" data-step="4">向更早节点展开</div>
    </div>

    <div class="tree-wrap min0">
      <svg id="tree" viewBox="0 0 1408 408" role="img" aria-labelledby="treeTitle treeDesc">
        <title id="treeTitle">人类、黑猩猩与大猩猩的共同祖先分叉树</title>
        <desc id="treeDesc">现生物种在右侧并列，沿枝向左回溯，在过去的共同祖先节点汇合。</desc>
      </svg>
      <div class="reading-key" aria-label="读图约定">
        <span>枝端：现生物种</span><span>节点：祖先种群</span><span>向左：回到过去</span><span>横向位置：时间方向</span><span>上下位置：只为分开枝条</span><span>箭头：回溯，不是进步</span>
      </div>
      <button id="advance" class="node-control" type="button" aria-describedby="status">沿枝回溯</button>
      <p id="status" class="status" aria-live="polite">先看右侧：人类与黑猩猩都活在今天，位于并列枝端。</p>
    </div>

    <div class="claim-row">
      <span>人类与黑猩猩来自共享的祖先种群；今天的黑猩猩是近亲，不是人类演化途中停留的旧版本。</span>
      <button id="reset" type="button" hidden>收起重看</button>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 4,
  kicker: "SHARED ANCESTOR",
  title: "黑猩猩不是我们的过去",
  take: "人类与黑猩猩共享祖先，不是由现生黑猩猩变来"
});

(function(){
  var svg=d3.select('#tree'), state=0;
  var advance=document.getElementById('advance'), reset=document.getElementById('reset'), status=document.getElementById('status');
  var messages=[
    '先看右侧：人类与黑猩猩都活在今天，位于并列枝端。',
    '沿两条枝向过去回溯，而不是从一种现生物种走向另一种。',
    '两条路径在同一个分叉节点汇合：这里回答“在哪里汇合”。',
    '这个节点代表共同祖先种群；它不是今天的黑猩猩。',
    '继续向过去展开：大猩猩支系在更早的节点与这两支共享祖先。'
  ];
  var buttonText=['沿枝回溯','查看汇合处','辨认这个节点','展开更早分叉'];
  function link(points, cls){ return svg.append('path').attr('class','tree-link '+(cls||'')).attr('d',d3.line().curve(d3.curveBumpX)(points)); }
  function node(x,y,cls){ svg.append('circle').attr('class','tree-node '+(cls||'')).attr('cx',x).attr('cy',y).attr('r',13); }
  function label(x,y,text,anchor,cls){ svg.append('text').attr('class',cls||'tree-label').attr('x',x).attr('y',y).attr('text-anchor',anchor||'start').text(text); }
  function draw(){
    svg.selectAll('*:not(title):not(desc)').remove();
    svg.append('line').attr('class','tree-guide').attr('x1',1110).attr('x2',1110).attr('y1',44).attr('y2',362);
    label(1110,28,'今天：所有现生枝端对齐','middle','tree-time');
    node(1110,132,'active'); node(1110,276,'active');
    label(1144,140,'人类'); label(1144,284,'黑猩猩');
    if(state>=1){ link([[1110,132],[760,204]],'active'); link([[1110,276],[760,204]],'active'); }
    if(state>=2){ node(760,204,state>=3?'ancestor active':'active'); }
    if(state>=3){ label(760,180,'共同祖先种群','middle'); label(760,239,'不是现生黑猩猩','middle','tree-small'); }
    if(state>=4){
      link([[760,204],[430,204]],'active'); link([[430,204],[1110,348]],'active');
      node(430,204,'ancestor active'); node(1110,348,'active');
      label(430,178,'更早的共享节点','middle'); label(1144,356,'大猩猩');
      label(118,210,'过去','start','tree-time');
      svg.append('line').attr('x1',178).attr('x2',360).attr('y1',204).attr('y2',204).attr('stroke','var(--muted)').attr('stroke-width',3).attr('marker-end','url(#none)');
    }
    status.textContent=messages[state];
    document.querySelectorAll('.process-strip .step').forEach(function(el,i){el.classList.toggle('is-current',i===state);el.classList.toggle('is-done',i<state);});
    advance.hidden=state===4; reset.hidden=state!==4;
    if(state<4) advance.textContent=buttonText[state];
  }
  advance.addEventListener('click',function(){ if(state<4){state++;draw();} });
  reset.addEventListener('click',function(){state=0;draw();advance.focus();});
  draw();
})();
</script>
</body>
</html>
