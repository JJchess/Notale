<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>人也在猿类之内</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lesson{height:100%;display:flex;flex-direction:column;gap:16px}
  .triptych{display:flex;gap:16px;flex:1;min-height:0}
  .guidebar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 18px;background:var(--primary-soft);border-left:8px solid var(--primary);border-radius:0 var(--r-md) var(--r-md) 0}
  .guidebar .lead{font-weight:750;color:var(--primary-strong)}
  .guidebar .path{display:flex;align-items:center;gap:10px;font-size:var(--fs-sec);font-weight:750;color:var(--muted)}
  .guidebar .path b{padding:5px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--text)}
  .bottom-note{display:flex;gap:12px}
  .bottom-note>div{flex:1;min-width:0;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
  .bottom-note b{display:block;color:var(--primary-strong);font-size:var(--fs-sec);line-height:1.35}
  .bottom-note span{display:block;color:var(--muted);font-size:var(--fs-sec);line-height:1.35;margin-top:3px}
  .side{width:190px;flex:0 0 190px;display:flex;flex-direction:column;gap:12px}
  .side .panel{padding:12px;min-height:142px}
  .side h2{margin-bottom:10px}
  .side p{font-size:var(--fs-sec);line-height:var(--lh-body)}
  .workspace{flex:1;min-width:0}
  .k-classification{height:100%;gap:0}
  .k-classification>.lv{height:100%;padding-left:18px}
  .primate-box{position:relative;height:100%;display:flex;flex-direction:column;padding:12px!important;background:var(--surface-muted)!important;border-color:var(--primary)!important}
  .class-lines{position:absolute;inset:42px 8px 8px;width:calc(100% - 16px);height:calc(100% - 50px);pointer-events:none;z-index:0}
  .members{position:relative;z-index:1}
  .primate-box>.bt{margin:-12px -12px 10px!important;padding:6px 14px!important}
  .members{display:flex;gap:10px;flex:1;min-height:0}
  .ape-zone{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:8px;flex:1;min-width:0;padding:8px;border:3px dashed transparent;border-radius:var(--r-md);transition:border-color .2s,background .2s}
  .ape-zone.revealed{border-color:var(--success);background:var(--success-soft)}
  .ape-zone.revealed::before{content:"猿类（人猿总科 Hominoidea）";grid-column:1/-1;color:var(--success);font-size:var(--fs-label);font-weight:800;line-height:20px;margin-bottom:-28px;z-index:2;pointer-events:none}
  .nonape{width:154px;display:flex;flex-direction:column;gap:6px;padding:8px;border:2px dashed var(--line);border-radius:var(--r-md);background:var(--surface-soft)}
  .nonape .branch{font-size:var(--fs-label);line-height:1.35;color:var(--muted);font-weight:750;text-align:center}
  .specimen{position:relative;min-width:0;min-height:0;padding:0;overflow:hidden;display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-sm);text-align:left;box-shadow:none}
  .specimen:hover{background:var(--surface);border-color:var(--primary)}
  .specimen img{width:100%;height:104px;object-fit:contain;background:var(--primary-strong);display:block}
  .specimen .name{padding:5px 8px 0;font-size:var(--fs-label);line-height:1.2;font-weight:800;color:var(--text)}
  .specimen .latin{padding:0 8px 2px;font-size:14px;line-height:1.2;color:var(--muted);font-style:italic}
  .specimen .prompt{margin-top:auto;padding:3px 8px;background:var(--surface-soft);border-top:1px solid var(--line);font-size:14px;line-height:1.2;color:var(--primary-strong);font-weight:750}
  .specimen[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 3px rgb(20 93 160 / 15%)}
  .specimen[aria-pressed="true"]::after{content:"✓ 已选";position:absolute;top:6px;right:6px;padding:2px 7px;color:#fff;background:var(--primary);border-radius:999px;font-size:14px;font-weight:800}
  .specimen.correct{border-color:var(--success);box-shadow:0 0 0 3px rgb(36 122 85 / 18%)}
  .specimen.wrong{border-color:var(--danger)}
  .status{min-height:104px;border-left:6px solid var(--primary)}
  .status strong{display:block;margin-bottom:6px;color:var(--primary-strong);font-size:var(--fs-lead);line-height:1.35}
  .status p{font-size:var(--fs-sec);line-height:var(--lh-body)}
  .actions{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap}
  .actions button{min-width:94px;min-height:44px;font-size:var(--fs-sec)}
  #submit{color:#fff;background:var(--primary);border-color:var(--primary)}
  .key{padding:12px 16px;border-left:6px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-md) var(--r-md) 0;font-size:var(--fs-lead);line-height:var(--lh-body);font-weight:750}
  .credits{font-size:14px!important;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){.ape-zone{transition:none}}
</style>
</head>

      <aside class="side min0">
        <section class="panel" data-tone="accent">
          <h2 id="task-title">谁属于猿类？</h2>
          <p>点选所有属于猿类的标本，再检查答案。名称已经给出；不要只凭“像不像人”判断。</p>
        </section>
        <section class="panel">
          <h2>分类规则</h2>
          <p>下位类必须放在上位类之内。这里所有对象都属于灵长目，其中一部分属于猿类。</p>
        </section>
        <p class="key">人类既可以与其他猿类不同，也仍然属于猿类。</p>
      </aside>

<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 5,
  kicker: "KINSHIP / CLASSIFICATION",
  title: "人也在猿类之内",
  take: "“猿类”是包含人类的生物分类，不是“还没进化成人”的俗称。"
});
(function(){
  var items=Array.from(document.querySelectorAll('.specimen'));
  var status=document.getElementById('status');
  var zone=document.getElementById('apeZone');
  var submit=document.getElementById('submit');
  function selected(el){return el.getAttribute('aria-pressed')==='true'}
  function say(title,text){status.innerHTML='<strong>'+title+'</strong><p>'+text+'</p>'}
  items.forEach(function(el){
    el.addEventListener('click',function(){
      var on=!selected(el); el.setAttribute('aria-pressed',String(on));
      el.classList.remove('correct','wrong'); zone.classList.remove('revealed');
      if(el.dataset.ape==='true') say(on?'在猿类框内':'已取消',on?'它属于猿类，也属于外层的灵长目。':'可以继续比较其他标本。');
      else say(on?'属于灵长目，但不在猿类框内':'已取消',on?'猕猴是猴类，不属于猿类。':'猕猴仍保留在灵长目外框内。');
    });
  });
  submit.addEventListener('click',function(){
    var ok=true, human=false;
    items.forEach(function(el){
      var right=selected(el)===(el.dataset.ape==='true');
      el.classList.toggle('correct',right); el.classList.toggle('wrong',!right); if(!right) ok=false;
      if(el.querySelector('.name').textContent==='人类') human=selected(el);
    });
    if(ok){zone.classList.add('revealed');say('分类完成','五个对象同在猿类框内；猕猴在灵长目内、猿类框外。');}
    else if(!human){say('还漏了人类','分类不会因为对象是我们自己而改变。人类也在猿类之内。');}
    else {say('再看边框','检查漏选的猿类，或移出不属于猿类的猕猴。');}
  });
  document.getElementById('reset').addEventListener('click',function(){
    items.forEach(function(el){el.setAttribute('aria-pressed','false');el.classList.remove('correct','wrong')});
    zone.classList.remove('revealed'); say('等待选择','每点一次，先看它是否应在猿类框内。选完后检查完整集合。'); items[0].focus();
  });
})();
</script>
