<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>同一套骨架，不同的身体</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--sk-a:#247a55;--sk-b:#145da0;--sk-c:#d86b2b}
.lesson{height:620px;display:flex;gap:24px}.specimens{width:810px;height:100%;display:flex;flex-direction:column;gap:12px}.work{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;gap:12px}.specimen-head{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.specimen-head div{text-align:center;font-size:var(--fs-h2);font-weight:750;color:var(--primary-strong)}
.skeleton-stage{position:relative;flex:1;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}.skeletons{position:absolute;inset:10px 14px 96px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.sk{position:relative;border-right:1px dashed var(--line)}.sk:last-child{border:0}.sk svg{position:absolute;inset:0;display:block;width:100%;height:100%;overflow:hidden}.bone{fill:none;stroke:#7e8997;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.joint{fill:#f7fafc;stroke:#7e8997;stroke-width:5}.hot{stroke:var(--accent);stroke-width:15;filter:drop-shadow(0 0 4px #fff)}
.drag-labels{position:absolute;left:16px;right:16px;bottom:10px;height:72px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;pointer-events:none}.drag-labels span{align-self:end;text-align:center;font-size:var(--fs-label);font-weight:700;color:var(--muted)}#konva{position:absolute;inset:0}.hint{padding:10px 14px;background:var(--warning-soft);border-radius:var(--r-sm);font-size:var(--fs-sec);line-height:1.5}
.overlay{height:220px;flex:0 0 220px;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}.overlay::before,.overlay::after{content:"";position:absolute;background:var(--line)}.overlay::before{left:50%;top:20px;bottom:20px;width:1px}.overlay::after{top:50%;left:20px;right:20px;height:1px}.target{position:absolute;inset:34px;border:2px dashed var(--line-strong);border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:var(--fs-sec);line-height:1.5;text-align:center}.locked{position:absolute;inset:0;pointer-events:none}.locked i{position:absolute;left:50%;top:50%;width:170px;height:22px;border:7px solid currentColor;border-radius:50%;transform-origin:center;opacity:.56}.locked i:nth-child(1){color:var(--sk-a);transform:translate(-50%,-50%) rotate(-7deg)}.locked i:nth-child(2){color:var(--sk-b);transform:translate(-50%,-50%) rotate(1deg) scale(.92)}.locked i:nth-child(3){color:var(--sk-c);transform:translate(-50%,-50%) rotate(8deg) scale(1.08)}
.k-comparison{--comparison-cols:150px repeat(3,minmax(0,1fr));font-size:var(--fs-label);flex:0 0 204px}.k-comparison>*{padding:8px 10px}.k-comparison>:nth-child(3n){border-right:1px solid var(--line)}.k-comparison>:nth-child(4n){border-right:0}.k-comparison .hdr{font-size:var(--fs-sec)}.k-comparison .dim{text-align:left}.cell{text-align:center;color:var(--muted);font-weight:700}.cell.done{color:var(--success);background:var(--success-soft)}.claim{padding:12px 16px;border-left:7px solid var(--primary);background:var(--primary-soft);font-size:var(--fs-lead);font-weight:800;line-height:1.45}.ctl{justify-content:space-between}.ctl select{min-width:180px}.status{font-size:var(--fs-sec);line-height:1.4;color:var(--primary-strong);min-height:23px}.tiny{font-size:14px;color:var(--muted)}
</style>
</head>
<body data-page="06" data-total="45">
<div id="stage"><main id="main">
  <section class="lesson min0" aria-label="同源骨骼叠合练习">
    <div class="specimens min0">
      <div class="specimen-head"><div>人</div><div>黑猩猩</div><div>长臂猿</div></div>
      <div class="skeleton-stage no-pan" id="scene">
        <div class="skeletons" aria-hidden="true">
          <div class="sk"><svg viewBox="0 0 180 390"><circle class="joint" cx="90" cy="34" r="25"/><path class="bone" d="M90 60L90 160M55 85L125 85M55 85L35 165L50 225M125 85L145 165L130 225M70 160L55 245L58 360M110 160L125 245L122 360"/><path class="bone hot" data-part="upper" d="M55 85L35 165L50 225M125 85L145 165L130 225"/></svg></div>
          <div class="sk"><svg viewBox="0 0 180 390"><circle class="joint" cx="90" cy="38" r="25"/><path class="bone" d="M90 65L90 170M48 90L132 90M48 90L20 185L34 260M132 90L160 185L146 260M67 170L48 250L55 360M113 170L132 250L125 360"/><path class="bone hot" data-part="upper" d="M48 90L20 185L34 260M132 90L160 185L146 260"/></svg></div>
          <div class="sk"><svg viewBox="0 0 180 390"><circle class="joint" cx="90" cy="36" r="23"/><path class="bone" d="M90 60L90 165M52 84L128 84M52 84L15 190L28 285M128 84L165 190L152 285M70 165L55 250L60 360M110 165L125 250L120 360"/><path class="bone hot" data-part="upper" d="M52 84L15 190L28 285M128 84L165 190L152 285"/></svg></div>
        </div>
        <div id="konva" aria-label="可拖动的三种骨骼部位"></div>
        <div class="drag-labels"><span>拖动绿色部位</span><span>拖动蓝色部位</span><span>拖动橙色部位</span></div>
      </div>
      <p class="hint">把三种动物的高亮部位拖入右侧叠合区。错误位置会回弹；判断时看它连接谁，不只看轮廓。</p>
    </div>
    <div class="work min0">
      <div class="ctl"><label for="part">当前比较部位</label><select id="part"><option value="upper">肩带—上肢</option><option value="lower">骨盆—下肢</option><option value="hand">手</option><option value="foot">足</option></select><button id="reset">重置</button></div>
      <div class="overlay" id="overlay"><div class="target" id="target">将三种高亮部位<br>拖到这里叠合</div><div class="locked" id="locked" hidden><i></i><i></i><i></i></div></div>
      <div class="status" id="status" aria-live="polite">先叠合肩带—上肢。</div>
      <div class="k-comparison" id="matrix">
        <div class="hdr">同一部位</div><div class="hdr">人</div><div class="hdr">黑猩猩</div><div class="hdr">长臂猿</div>
        <div class="rowline"></div><div class="dim">肩带—上肢</div><div class="cell" data-r="upper">肩胛·肱骨</div><div class="cell" data-r="upper">桡骨·尺骨</div><div class="cell" data-r="upper">对应连接</div>
        <div class="rowline"></div><div class="dim">骨盆—下肢</div><div class="cell" data-r="lower">骨盆·股骨</div><div class="cell" data-r="lower">胫骨·腓骨</div><div class="cell" data-r="lower">对应连接</div>
        <div class="rowline"></div><div class="dim">手</div><div class="cell" data-r="hand">腕骨</div><div class="cell" data-r="hand">掌骨</div><div class="cell" data-r="hand">指骨</div>
        <div class="rowline"></div><div class="dim">足</div><div class="cell" data-r="foot">跗骨</div><div class="cell" data-r="foot">跖骨</div><div class="cell" data-r="foot">趾骨</div>
      </div>
      <p class="claim">人、黑猩猩和长臂猿的身体差异，建立在大量位置和连接关系相应的同源结构之上。</p>
      <p class="tiny" title="本页采用示意骨架以避免将装架差异误当作骨骼差异">同源：来源于共同祖先、位置与连接关系相应的结构；形状和比例不必相同。</p>
    </div>
  </section>
</main></div>
<script src="assets/lib/konva.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:6,kicker:"HOMOLOGOUS BONES",title:"同一套骨架，不同的身体",take:"人、黑猩猩和长臂猿的身体差异，建立在大量同源结构之上。"});
(function(){
  const names={upper:'肩带—上肢',lower:'骨盆—下肢',hand:'手',foot:'足'};
  const state={part:'upper',done:{},placed:[false,false,false]};
  const host=document.getElementById('konva'), scene=document.getElementById('scene');
  const stage=new Konva.Stage({container:'konva',width:808,height:390}); const layer=new Konva.Layer();stage.add(layer);
  const colors=['#247a55','#145da0','#d86b2b']; const starts=[128,400,672]; const pieces=[];
  function shape(i){let p=state.part,w=p==='hand'||p==='foot'?72:104,h=p==='upper'?20:28;return new Konva.Rect({x:starts[i]-w/2,y:330,width:w,height:h,cornerRadius:12,fill:colors[i],opacity:.86,stroke:'#fff',strokeWidth:3,draggable:true,shadowColor:'#172033',shadowBlur:8,shadowOpacity:.18});}
  function targetBox(){const a=scene.getBoundingClientRect(),b=document.getElementById('overlay').getBoundingClientRect();return {x:(b.left-a.left)/Deck.s,y:(b.top-a.top)/Deck.s,w:b.width/Deck.s,h:b.height/Deck.s};}
  function rebuild(){layer.destroyChildren();pieces.length=0;state.placed=[false,false,false];for(let i=0;i<3;i++){const s=shape(i);pieces.push(s);layer.add(s);s.on('dragend',()=>drop(i));}layer.draw();document.getElementById('locked').hidden=true;document.getElementById('target').hidden=false;document.getElementById('status').textContent=state.done[state.part]?'这一行已完成；可重做或切换下一行。':'把三种'+names[state.part]+'拖到叠合区。';}
  function drop(i){const t=targetBox(),p=pieces[i],cx=p.x()+p.width()/2,cy=p.y()+p.height()/2;if(cx>t.x&&cx<t.x+t.w&&cy>t.y&&cy<t.y+t.h){state.placed[i]=true;p.visible(false);document.getElementById('status').textContent='已放入 '+(i===0?'人':i===1?'黑猩猩':'长臂猿')+' 的对应部位。';if(state.placed.every(Boolean))complete();}else{p.to({x:starts[i]-p.width()/2,y:330,duration:Deck.reduced()?0:.22});document.getElementById('status').textContent='看它连接谁，不只看轮廓。';}}
  function complete(){state.done[state.part]=true;document.getElementById('locked').hidden=false;document.getElementById('target').hidden=true;document.querySelectorAll('[data-r="'+state.part+'"]').forEach(x=>x.classList.add('done'));let n=Object.keys(state.done).length;let pct=Lec.P.percent(Lec.P.ratio(n,4));document.getElementById('status').textContent=names[state.part]+'已锁定：位置与连接相应，形状和比例不同。完成 '+pct+'。';}
  document.getElementById('part').addEventListener('change',e=>{state.part=e.target.value;rebuild()});document.getElementById('reset').addEventListener('click',()=>{state.done={};document.querySelectorAll('.cell').forEach(x=>x.classList.remove('done'));document.getElementById('part').value='upper';state.part='upper';rebuild()});
  rebuild();
})();
</script>
</body></html>
