<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>把数百万年拖到眼前</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .p07-shell{height:620px;width:100%;display:flex;flex-direction:column;gap:14px}
  .p07-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
  .p07-copy{max-width:900px}
  .p07-copy h1{margin-bottom:6px}
  .p07-claim{color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-body)}
  .p07-control{width:430px;padding:12px 16px}
  .p07-control .ctl{min-height:44px}
  .p07-control input{width:250px;min-height:44px}
  .p07-read{min-width:112px;text-align:right;color:var(--primary-strong);font-size:var(--fs-body);font-weight:750}
  .p07-chart{position:relative;flex:1;min-height:0;padding:10px 18px 8px;overflow:hidden}
  #timeline{display:block;width:100%;height:100%}
  .p07-process{--process-gap:34px;height:54px;align-items:center}
  .p07-process .step{padding:7px 12px;text-align:center;font-size:var(--fs-label);font-weight:700}
  .p07-process .arw{height:44px}
  .p07-bottom{display:flex;align-items:center;justify-content:space-between;gap:18px}
  .p07-question{flex:1;padding:10px 16px;border-left:5px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:var(--fs-sec);line-height:var(--lh-body)}
  .p07-legend{flex:0 0 auto}
  .line-key{width:22px;height:3px;background:var(--primary);display:inline-block}
  .band-key{width:22px;height:12px;background:var(--accent-soft);border:2px solid var(--accent);display:inline-block}
  .axis text{fill:var(--muted);font-family:var(--font-sans);font-size:13px}
  .axis path,.axis line{stroke:var(--line-strong)}
  .event-name{font-family:var(--font-sans);font-size:15px;font-weight:750;fill:var(--text)}
  .event-date{font-family:var(--font-sans);font-size:14px;fill:var(--muted)}
  .axis-title{font-family:var(--font-sans);font-size:16px;font-weight:750;fill:var(--primary-strong)}
  .window-label{font-family:var(--font-sans);font-size:14px;font-weight:750;fill:var(--primary-strong)}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body data-page="07" data-total="45">
<div id="stage">
<main id="main">
  <section class="p07-shell min0" aria-labelledby="p07-title">
    <div class="p07-top">
      <div class="p07-copy min0">
        <h1 id="p07-title">把数百万年拖到眼前</h1>
        <p class="p07-claim">数百万年尺度会让“祖先”“近亲”和“我们小时候”显得过分接近。时间轴上挨得近，不等于亲缘身份相同，也不等于事件几乎同时发生。</p>
      </div>
      <div class="p07-control panel shrink0">
        <div class="ctl">
          <label for="compress">时间压缩尺</label>
          <input id="compress" class="no-pan" type="range" min="0" max="100" value="0" step="1" aria-describedby="range-help">
          <output id="span-read" class="p07-read mono-num" aria-live="polite">—</output>
        </div>
        <p id="range-help" class="note">向右拖近近期；向左拉回完整深时。</p>
      </div>
    </div>

    <div class="k-process axis p07-process" aria-label="阅读时间压缩尺的三个步骤">
      <div class="step is-done">全局轴定位</div><div class="arw" aria-hidden="true"></div>
      <div class="step is-current">拖动压缩尺</div><div class="arw" aria-hidden="true"></div>
      <div class="step">局部轴辨间隔</div>
    </div>

    <figure class="p07-chart panel min0">
      <svg id="timeline" role="img" aria-label="六个事件的全局与局部时间轴，上下由连线对应。谱系分开以六百万至七百万年前的范围表示。"></svg>
    </figure>

    <div class="p07-bottom">
      <div class="legend p07-legend" aria-label="图例"><span><i class="band-key"></i>年代范围</span><span><i class="line-key"></i>上下对应</span></div>
      <p id="prompt" class="p07-question">拖动后判断：哪两段间隔最容易被视觉压扁？先比较“智人—载人航天”，再看“载人航天—登月”。</p>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/lib/ScrollTrigger.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:7,kicker:"DEEP TIME",title:"把数百万年拖到眼前",take:"数百万年尺度会让“祖先”“近亲”和“我们小时候”显得过分接近"});

(function(){
  gsap.registerPlugin(ScrollTrigger);
  var P=Lec.P, K=Lec.K.evolution, presentYear=2025, oldest=K.humanChimpCommonAncestorYearsAgo;
  var laetoliYears=3.66e6, splitYoung=6e6;
  var events=[
    {id:"split",name:"人类与黑猩猩谱系分开",years:K.humanChimpCommonAncestorYearsAgo,range:[K.humanChimpCommonAncestorYearsAgo,splitYoung],date:"约700万—600万年前",tone:"range"},
    {id:"laetoli",name:"拉埃托利足迹",years:laetoliYears,date:"约366万年前"},
    {id:"homo",name:"早期人属化石",years:K.genusHomoYearsAgo,date:"至少约280万年前"},
    {id:"sapiens",name:"智人出现",years:K.homoSapiensYearsAgo,date:"约30万年前"},
    {id:"space",name:"首次载人进入太空",years:P.elapsedYears(K.firstHumanInSpaceYear,presentYear),date:String(K.firstHumanInSpaceYear)+"年"},
    {id:"moon",name:"首次载人登月",years:P.elapsedYears(K.firstMoonLandingYear,presentYear),date:String(K.firstMoonLandingYear)+"年"}
  ];
  var svg=d3.select("#timeline"), slider=document.getElementById("compress"), read=document.getElementById("span-read");
  var W=1368,H=334, left=48,right=34, topY=62,bottomY=242;
  svg.attr("viewBox","0 0 "+W+" "+H);
  var root=svg.append("g");
  root.append("text").attr("class","axis-title").attr("x",left).attr("y",22).text("全局：700万年前 → 现在");
  root.append("text").attr("class","axis-title").attr("x",left).attr("y",174).text("局部：当前窗口");
  var connectorG=root.append("g"), topG=root.append("g"), bottomG=root.append("g"), labelG=root.append("g");
  var topScale=d3.scaleLinear().domain([oldest,0]).range([left,W-right]);
  topG.attr("class","axis").attr("transform","translate(0,"+topY+")").call(d3.axisBottom(topScale).tickValues([7e6,6e6,5e6,4e6,3e6,2e6,1e6,0]).tickFormat(function(d){return d===0?"现在":(d/1e6)+" Ma";}));
  var winRect=root.append("rect").attr("y",topY-18).attr("height",36).attr("fill","var(--primary-soft)").attr("stroke","var(--primary)").attr("stroke-width",2).attr("rx",6);
  var winLabel=root.append("text").attr("class","window-label").attr("y",topY-25).attr("text-anchor","end");

  function spanFrom(v){ var t=P.clamp(Number(v),0,100)/100; return Math.pow(10,Math.log10(oldest)*(1-t)+Math.log10(100)*t); }
  function fmtSpan(v){ if(v>=1e6)return P.roundTo(v/1e6,2)+" 百万年"; if(v>=1e4)return P.roundTo(v/1e4,1)+" 万年"; return P.roundTo(v,0)+" 年"; }
  function distribute(items,minGap,minX,maxX){
    var pos=items.map(function(d){return Math.max(minX,Math.min(maxX,d.x));});
    for(var i=1;i<pos.length;i++) pos[i]=Math.max(pos[i],pos[i-1]+minGap);
    if(pos[pos.length-1]>maxX){var shift=pos[pos.length-1]-maxX;for(i=0;i<pos.length;i++)pos[i]-=shift;}
    for(i=pos.length-2;i>=0;i--)pos[i]=Math.min(pos[i],pos[i+1]-minGap);
    return pos;
  }
  function update(animate){
    var span=spanFrom(slider.value), local=d3.scaleLinear().domain([span,0]).range([left,W-right]);
    read.value=fmtSpan(span); read.textContent=fmtSpan(span);
    winRect.attr("x",topScale(span)).attr("width",Math.max(3,topScale(0)-topScale(span)));
    winLabel.attr("x",W-right).text("窗口跨度 "+fmtSpan(span));
    bottomG.selectAll("*").remove();
    bottomG.attr("class","axis").attr("transform","translate(0,"+bottomY+")").call(d3.axisBottom(local).ticks(7).tickFormat(function(d){if(d===0)return "现在";if(d>=1e6)return P.roundTo(d/1e6,1)+" Ma";if(d>=1e4)return P.roundTo(d/1e4,1)+" 万年前";return P.roundTo(d,0)+" 年前";}));
    var plotted=events.map(function(d){return {d:d,tx:topScale(d.years),bx:local(Math.min(d.years,span)),outside:d.years>span};}).sort(function(a,b){return a.bx-b.bx;});
    var labelXs=plotted.map(function(p,i){return left+120+i*((W-right-left-240)/(plotted.length-1));});
    plotted.forEach(function(p,i){p.lx=labelXs[i];});
    var joins=connectorG.selectAll("path.link").data(plotted,function(p){return p.d.id;});
    joins.join("path").attr("class","link").attr("fill","none").attr("stroke",function(p){return p.outside?"var(--line)":"var(--primary)";}).attr("stroke-width",2).attr("stroke-dasharray",function(p){return p.outside?"4 5":null;}).attr("d",function(p){return "M"+p.tx+","+(topY+10)+" C"+p.tx+","+(topY+72)+" "+p.bx+","+(bottomY-72)+" "+p.bx+","+(bottomY-8);});
    labelG.selectAll("*").remove();
    var labels=labelG.selectAll("g.ev").data(plotted).join("g").attr("class","ev").attr("transform",function(p){return "translate("+p.lx+","+(bottomY+38)+")";});
    labels.append("line").attr("x1",0).attr("y1",-30).attr("x2",function(p){return p.bx-p.lx;}).attr("y2",-38).attr("stroke","var(--line-strong)");
    labels.append("circle").attr("cx",function(p){return p.bx-p.lx;}).attr("cy",-38).attr("r",5).attr("fill",function(p){return p.d.tone?"var(--accent)":"var(--primary)";});
    labels.append("text").attr("class","event-name").attr("text-anchor","middle").attr("y",0).text(function(p){return p.d.name;});
    labels.append("text").attr("class","event-date").attr("text-anchor","middle").attr("y",20).text(function(p){return p.outside?"早于窗口 · "+p.d.date:p.d.date;});
    if(animate && !Deck.reduced()) gsap.fromTo("#timeline .ev",{opacity:.35},{opacity:1,duration:.25,ease:"power1.out"});
  }
  slider.addEventListener("input",function(){update(true);});
  slider.addEventListener("change",function(){document.getElementById("prompt").textContent="当前窗口跨度："+fmtSpan(spanFrom(slider.value))+"。哪两段间隔最容易被视觉压扁？";});
  update(false);
  if(!Deck.reduced()) gsap.from(".p07-chart",{opacity:0,y:12,duration:.45,ease:"power1.out",scrollTrigger:{trigger:".p07-chart",start:"top 95%",once:true}});
})();
</script>
</body>
</html>
