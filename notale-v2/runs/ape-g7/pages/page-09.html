<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>给化石分类，也给结论贴置信度</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lesson{height:620px;display:flex;flex-direction:column;gap:14px}
  .intro{display:flex;align-items:center;justify-content:space-between;gap:24px}
  .intro p{font-size:var(--fs-lead);line-height:var(--lh-body);font-weight:700}
  .tags{display:flex;gap:8px;align-items:center;flex:0 0 auto}
  .tags button{min-width:86px;min-height:44px;padding:8px 12px;cursor:grab;background:var(--surface);font-size:var(--fs-sec)}
  .tags button[aria-pressed="true"]{color:#fff;background:var(--primary);border-color:var(--primary)}
  .work{display:flex;gap:18px;min-height:0;flex:1}
  .evidence{width:294px;flex:0 0 294px;padding:16px}
  .evidence h2{margin-bottom:10px}
  .evidence .k-classification{gap:8px}
  .evidence .k-classification .lv{gap:6px;margin-left:12px;padding-left:14px}
  .evidence .k-classification>.lv{margin-left:0}
  .evidence .k-classification .lv::before{top:18px;width:14px}
  .evidence .box{padding:10px 12px}
  .evidence .box>.bt{margin:-10px -12px 6px;padding:6px 12px;font-size:var(--fs-sec)}
  .evidence p{font-size:var(--fs-sec);line-height:var(--lh-body)}
  .ledger{flex:1;min-width:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
  .ledger-head,.claim-row{display:grid;grid-template-columns:1.05fr 1.18fr 1.18fr 132px;align-items:stretch}
  .ledger-head{background:var(--surface-muted);color:var(--primary-strong);font-size:var(--fs-label);font-weight:800}
  .ledger-head>div,.cell{padding:8px 12px;border-right:1px solid var(--line)}
  .ledger-head>div:last-child,.cell:last-child{border-right:0}
  #rows{position:relative;flex:1;min-height:0}
  #links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
  #links path{fill:none;stroke:var(--line-strong);stroke-width:2;stroke-dasharray:5 5;opacity:.72}
  #links circle{fill:var(--surface);stroke:var(--primary);stroke-width:2}
  .claim-row{position:absolute;left:0;right:0;height:108px;border-top:1px solid var(--line);background:var(--surface);transition:background .2s}
  .claim-row.is-focus{background:var(--primary-soft)}
  .cell{display:flex;flex-direction:column;justify-content:center;min-width:0;font-size:var(--fs-sec);line-height:1.38}
  .claim{font-weight:800;color:var(--primary-strong)}
  .grain{font-size:var(--fs-label);color:var(--muted);font-weight:600}
  .support::before{content:"支持  ";color:var(--success);font-weight:800}
  .rival::before{content:"但也可能  ";color:var(--warning);font-weight:800}
  .confidence{align-items:center;text-align:center;font-weight:800}
  .confidence span{display:inline-flex;min-width:82px;min-height:38px;align-items:center;justify-content:center;border:1px dashed var(--line-strong);border-radius:var(--r-sm);background:var(--surface-soft)}
  .confidence span[data-set="true"]{border-style:solid;color:var(--primary-strong);background:var(--primary-soft)}
  .feedback{min-height:48px;display:flex;align-items:center;gap:12px;padding:8px 16px;border-left:6px solid var(--primary);border-radius:var(--r-sm);background:var(--surface-soft);font-size:var(--fs-sec);line-height:var(--lh-body)}
  .feedback strong{color:var(--primary-strong)}
  .feedback.warn{border-left-color:var(--warning);background:var(--warning-soft)}
  .feedback.good{border-left-color:var(--success);background:var(--success-soft)}
  @media (prefers-reduced-motion:reduce){.claim-row{transition:none}}
</style>
</head>
<body data-page="09" data-total="45">
<div id="stage">
<main id="main">
  <section class="lesson" aria-label="化石分类置信度账本">
    <div class="intro">
      <p>把标签拖到主张上：结论越精细，通常越需要完整、排他的证据。</p>
      <div class="tags" role="group" aria-label="置信度标签">
        <button draggable="true" data-level="high" aria-pressed="false">高</button>
        <button draggable="true" data-level="mid" aria-pressed="false">中</button>
        <button draggable="true" data-level="low" aria-pressed="false">低</button>
        <button draggable="true" data-level="none" aria-pressed="false">证据不足</button>
      </div>
    </div>
    <div class="work">
      <aside class="evidence panel min0" aria-label="固定证据摘要">
        <h2>固定证据摘要</h2>
        <div class="k-classification">
          <div class="lv">
            <div class="box"><div class="bt">可观察</div><p>牙齿形态与颌骨比例</p><p>局部颅骨的连接特征</p></div>
            <div class="lv">
              <div class="box"><div class="bt">保存限制</div><p>关键部位缺失</p><p>受压后发生变形</p></div>
              <div class="lv">
                <div class="box"><div class="bt">语境限制</div><p>地层来源仍待核对</p></div>
                <div class="box"><div class="bt">推断上限</div><p>能支持近缘位置</p><p>暂不能排除相邻候选</p></div>
              </div>
            </div>
          </div>
        </div>
        <p class="note">这些限制不会抹去全部信息，却会限制结论能细到哪一层。</p>
      </aside>
      <section class="ledger min0" aria-label="可排序分类账本">
        <div class="ledger-head"><div>分类主张</div><div>支持</div><div>竞争解释</div><div>置信度</div></div>
        <div id="rows"><svg id="links" aria-hidden="true"></svg></div>
      </section>
    </div>
    <div id="feedback" class="feedback" aria-live="polite"><strong>先判断粒度</strong><span>可接受并列：同一证据可能支持多个近缘位置。</span></div>
  </section>
</main>
</div>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:9,kicker:"CONFIDENCE LEDGER",title:"给化石分类，也给结论贴置信度",take:"化石分类包含不确定性，同一证据可能支持多个近缘位置。"});

const levels={high:{label:"高",rank:0},mid:{label:"中",rank:1},low:{label:"低",rank:2},none:{label:"证据不足",rank:3}};
const data=[
 {id:"branch",grain:"大分支归属",claim:"归入较大的近缘分支",support:"多项牙齿与颌骨特征一致",rival:"保存变形仍可能改变局部形态",fit:["high","mid"]},
 {id:"near",grain:"近缘位置",claim:"位于两个相邻候选附近",support:"共享一组可比较特征",rival:"候选甲与候选乙都能解释这些特征",fit:["mid","low"]},
 {id:"species",grain:"物种归属",claim:"精确归入候选甲物种",support:"部分形态更接近候选甲",rival:"材料残缺，关键排除特征未保存",fit:["low","none"]},
 {id:"exclude",grain:"排除性结论",claim:"排除候选乙",support:"现存部位与候选乙不完全一致",rival:"“不太像”尚不足以真正排除",fit:["low","none"]}
];
let selected=null;
const rowH=108;
const rows=d3.select("#rows").selectAll(".claim-row").data(data,d=>d.id).join("div")
 .attr("class","claim-row").attr("tabindex","0").attr("role","button")
 .attr("aria-label",d=>`${d.grain}：${d.claim}。选择置信度标签后按回车贴标`)
 .html(d=>`<div class="cell claim"><span class="grain">${d.grain}</span><span>${d.claim}</span></div><div class="cell support">${d.support}</div><div class="cell rival">${d.rival}</div><div class="cell confidence"><span>待判断</span></div>`)
 .style("transform",(d,i)=>`translateY(${i*rowH}px)`)
 .on("dragover",e=>e.preventDefault()).on("drop",function(e,d){e.preventDefault();apply(d,e.dataTransfer.getData("text/plain"));})
 .on("click",function(e,d){if(selected)apply(d,selected);})
 .on("keydown",function(e,d){if((e.key==="Enter"||e.key===" ")&&selected){e.preventDefault();apply(d,selected);}});

const linkSvg=d3.select("#links").attr("viewBox","0 0 1060 432").attr("preserveAspectRatio","none");
const linkData=data.flatMap((d,i)=>[
 {y:i*rowH+36,x1:505,x2:930},{y:i*rowH+73,x1:760,x2:930}
]);
linkSvg.selectAll("path").data(linkData).join("path").attr("d",d=>`M${d.x1},${d.y} C${d.x1+80},${d.y} ${d.x2-70},${d.y} ${d.x2},${d.y}`);
linkSvg.selectAll("circle").data(linkData).join("circle").attr("cx",d=>d.x2).attr("cy",d=>d.y).attr("r",4);

d3.selectAll(".tags button")
 .on("dragstart",function(e){selected=this.dataset.level;e.dataTransfer.setData("text/plain",selected);})
 .on("click",function(){selected=this.dataset.level;d3.selectAll(".tags button").attr("aria-pressed","false");d3.select(this).attr("aria-pressed","true");document.getElementById("feedback").innerHTML="<strong>标签已拿起</strong><span>点击一条主张，或聚焦后按回车贴上。</span>";});

function apply(d,key){
 if(!levels[key])return;
 d.level=key;
 rows.classed("is-focus",x=>x.id===d.id).select(".confidence span").text(x=>x.level?levels[x.level].label:"待判断").attr("data-set",x=>x.level?"true":"false");
 const ordered=[...data].sort((a,b)=>(a.level?levels[a.level].rank:4)-(b.level?levels[b.level].rank:4));
 d3.select("#rows").selectAll(".claim-row").data(ordered,d=>d.id).transition().duration(Deck.reduced()?0:350).style("transform",(x,i)=>`translateY(${i*rowH}px)`);
 const fb=document.getElementById("feedback");
 const tooHigh=(d.id==="species"||d.id==="exclude")&&(key==="high"||key==="mid");
 if(tooHigh){fb.className="feedback warn";fb.innerHTML="<strong>结论粒度超过证据</strong><span>残缺材料能提示“更像”，却还不能精确归种或排除近邻。</span>";}
 else if(data.every(x=>x.level) && ["high","mid"].includes(data[0].level) && ["low","none"].includes(data[2].level)) {fb.className="feedback good";fb.innerHTML="<strong>层级已拉开</strong><span>“不确定”不是一无所知：大分支较稳，精确物种仍是暂定。</span>";}
 else {fb.className="feedback";fb.innerHTML="<strong>证据与解释同时看</strong><span>允许近缘候选并存，不必把账本排成唯一队列。</span>";}
 selected=null;d3.selectAll(".tags button").attr("aria-pressed","false");
}
</script>
</body>
</html>
