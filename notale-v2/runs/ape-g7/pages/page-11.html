<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>图像也会偷渡等级</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page11{height:100%;display:flex;flex-direction:column;gap:12px}
  .prompt{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:38px}
  .prompt p{font-size:var(--fs-body);line-height:var(--lh-body)}
  .hint{color:var(--muted);font-size:var(--fs-sec);white-space:nowrap}
  .k-comparison.visual-compare{--comparison-cols:150px repeat(3,minmax(0,1fr));flex:1;grid-template-rows:250px 48px 48px 48px 48px;overflow:visible}
  .visual-compare>*{padding:10px 14px}
  .visual-compare>:nth-child(4n){border-right:0}
  .visual-compare .rowline{grid-column:1/-1;height:1px;padding:0}
  .corner{display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--surface-soft);font-size:var(--fs-sec);font-weight:700;line-height:var(--lh-body)}
  .diagram-cell{display:flex;flex-direction:column;gap:8px;background:var(--surface-soft)}
  .diagram-title{color:var(--primary-strong);font-size:var(--fs-h2);font-weight:750;line-height:var(--lh-tight);text-align:center}
  .reveal{--reveal-x:50%;--reveal-y:50%;--reveal-radius:0px;position:relative;flex:1;min-height:0;overflow:hidden;isolation:isolate;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);touch-action:none;cursor:crosshair}
  .reveal:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  .reveal svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .reveal .overlay{z-index:2;pointer-events:none;-webkit-mask-image:radial-gradient(circle var(--reveal-radius) at var(--reveal-x) var(--reveal-y),#000 0%,#000 40%,rgb(0 0 0/.75) 60%,rgb(0 0 0/.4) 75%,rgb(0 0 0/.12) 88%,transparent 100%);mask-image:radial-gradient(circle var(--reveal-radius) at var(--reveal-x) var(--reveal-y),#000 0%,#000 40%,rgb(0 0 0/.75) 60%,rgb(0 0 0/.4) 75%,rgb(0 0 0/.12) 88%,transparent 100%);will-change:mask-image,-webkit-mask-image}
  .celltext{display:flex;align-items:center;font-size:var(--fs-sec);line-height:var(--lh-body)}
  .dim{display:flex;align-items:center;justify-content:flex-end}
  .diff{box-shadow:inset 4px 0 0 var(--accent)}
  .takeaway{min-height:56px;display:flex;align-items:center;justify-content:center;padding:0 24px;color:var(--primary-strong);background:var(--primary-soft);border-left:8px solid var(--primary);border-radius:0 var(--r-md) var(--r-md) 0;font-size:var(--fs-lead);font-weight:800;line-height:var(--lh-body);text-align:center}
  .seenmark{position:absolute;right:8px;bottom:7px;z-index:4;padding:3px 8px;color:var(--success);background:var(--success-soft);border-radius:999px;font-size:var(--fs-label);font-weight:700;opacity:0;transition:opacity .2s}
  .reveal.seen .seenmark{opacity:1}
  @media (prefers-reduced-motion:reduce){.seenmark{transition:none}}
</style>
</head>
<body data-page="11" data-total="45">
<div id="stage">
<main id="main">
  <section class="page11" aria-labelledby="frame-prompt">
    <div class="prompt">
      <p id="frame-prompt"><strong>先看图中画了什么，再移动指针检查：画面把谁放在了“更好”的位置？</strong></p>
      <span class="hint">触屏拖动；键盘聚焦后按 Enter 揭示</span>
    </div>

    <div class="k-comparison visual-compare" aria-label="三种演化图式的逐维比较">
      <div class="corner">同一把构图尺</div>

      <div class="diagram-cell min0">
        <div class="diagram-title">斜向上升队列</div>
        <div class="reveal no-pan" data-reveal tabindex="0" role="button" aria-label="检查斜向上升队列的构图暗示，按 Enter 完整揭示">
          <svg viewBox="0 0 380 210" role="img" aria-label="五个相同的抽象人物从左下到右上排列">
            <rect width="380" height="210" fill="#fff"/>
            <path d="M35 170L345 45" stroke="#c7d3e1" stroke-width="3"/>
            <g fill="#53657a" stroke="#172033" stroke-width="2">
              <g transform="translate(55 140) scale(.72)"><circle cy="-32" r="15"/><path d="M0-16V28M-24 2H24M0 28L-20 62M0 28L20 62"/></g>
              <g transform="translate(120 116) scale(.82)"><circle cy="-32" r="15"/><path d="M0-16V28M-24 2H24M0 28L-20 62M0 28L20 62"/></g>
              <g transform="translate(190 91) scale(.92)"><circle cy="-32" r="15"/><path d="M0-16V28M-24 2H24M0 28L-20 62M0 28L20 62"/></g>
              <g transform="translate(265 65)"><circle cy="-32" r="15"/><path d="M0-16V28M-24 2H24M0 28L-20 62M0 28L20 62"/></g>
              <g transform="translate(335 40) scale(1.1)"><circle cy="-32" r="15" fill="#145da0"/><path d="M0-16V28M-24 2H24M0 28L-20 62M0 28L20 62" stroke="#145da0"/></g>
            </g>
          </svg>
          <svg class="overlay" viewBox="0 0 380 210" aria-hidden="true">
            <rect width="380" height="210" fill="rgba(255,240,228,.9)"/>
            <path d="M25 178L350 46" stroke="#d86b2b" stroke-width="5"/><path d="M326 43L353 45L340 68" fill="none" stroke="#d86b2b" stroke-width="5"/>
            <path d="M28 188H350" stroke="#8799ae" stroke-dasharray="7 6" stroke-width="2"/>
            <text x="32" y="28" fill="#7a3512" font-size="18" font-weight="700">高＝更好？</text><text x="210" y="168" fill="#7a3512" font-size="16">越来越大、越来越亮</text>
          </svg><span class="seenmark">已检查</span>
        </div>
      </div>

      <div class="diagram-cell min0">
        <div class="diagram-title">水平单向队列</div>
        <div class="reveal no-pan" data-reveal tabindex="0" role="button" aria-label="检查水平单向队列的构图暗示，按 Enter 完整揭示">
          <svg viewBox="0 0 380 210" role="img" aria-label="五个相同的抽象人物沿水平线向右排列">
            <rect width="380" height="210" fill="#fff"/><path d="M35 145H345" stroke="#c7d3e1" stroke-width="3"/>
            <g fill="#53657a" stroke="#172033" stroke-width="2">
              <g transform="translate(55 88)"><circle cy="-32" r="15"/><path d="M0-16V28M-24 2H24M0 28L-20 62M0 28L20 62"/></g><g transform="translate(122 88)"><circle cy="-32" r="15"/><path d="M0-16V28M-24 2H24M0 28L-20 62M0 28L20 62"/></g><g transform="translate(190 88)"><circle cy="-32" r="15"/><path d="M0-16V28M-24 2H24M0 28L-20 62M0 28L20 62"/></g><g transform="translate(258 88)"><circle cy="-32" r="15"/><path d="M0-16V28M-24 2H24M0 28L-20 62M0 28L20 62"/></g><g transform="translate(325 88)" fill="#145da0"><circle cy="-32" r="15"/><path d="M0-16V28M-24 2H24M0 28L-20 62M0 28L20 62" stroke="#145da0"/></g>
            </g>
          </svg>
          <svg class="overlay" viewBox="0 0 380 210" aria-hidden="true"><rect width="380" height="210" fill="rgba(255,240,228,.9)"/><path d="M28 105H345" stroke="#d86b2b" stroke-width="5"/><path d="M324 88L348 105L324 122" fill="none" stroke="#d86b2b" stroke-width="5"/><circle cx="345" cy="105" r="35" fill="none" stroke="#d86b2b" stroke-width="3" stroke-dasharray="6 5"/><text x="26" y="32" fill="#7a3512" font-size="18" font-weight="700">只有一个方向？</text><text x="248" y="175" fill="#7a3512" font-size="16">终点被预先画好</text></svg><span class="seenmark">已检查</span>
        </div>
      </div>

      <div class="diagram-cell min0">
        <div class="diagram-title">突出人类的分叉图</div>
        <div class="reveal no-pan" data-reveal tabindex="0" role="button" aria-label="检查突出人类的分叉图构图暗示，按 Enter 完整揭示">
          <svg viewBox="0 0 380 210" role="img" aria-label="一棵分叉图，其中中央末端更粗更深">
            <rect width="380" height="210" fill="#fff"/><g fill="none" stroke="#8799ae" stroke-width="4"><path d="M190 190V135M190 150L90 92M190 150L285 92M190 135V45M90 92L48 50M90 92L120 42M285 92L255 48M285 92L330 55"/><path d="M190 135V42" stroke="#145da0" stroke-width="9"/></g><g fill="#53657a"><circle cx="48" cy="46" r="10"/><circle cx="120" cy="38" r="10"/><circle cx="255" cy="44" r="10"/><circle cx="330" cy="51" r="10"/><circle cx="190" cy="34" r="15" fill="#145da0"/></g>
          </svg>
          <svg class="overlay" viewBox="0 0 380 210" aria-hidden="true"><rect width="380" height="210" fill="rgba(255,240,228,.88)"/><circle cx="190" cy="52" r="62" fill="rgba(216,107,43,.2)" stroke="#d86b2b" stroke-width="3"/><path d="M190 188V30" stroke="#d86b2b" stroke-width="2" stroke-dasharray="7 6"/><text x="25" y="30" fill="#7a3512" font-size="18" font-weight="700">分叉也能居中聚光</text><text x="218" y="185" fill="#7a3512" font-size="16">“主角”更粗、更亮</text></svg><span class="seenmark">已检查</span>
        </div>
      </div>

      <div class="dim">位置与尺度</div><div class="celltext diff">越靠右越高、形象越大</div><div class="celltext">同高同大，仍朝同一边</div><div class="celltext diff">人类居中，末端加粗</div>
      <div class="dim">方向与终点</div><div class="celltext">斜线把“后来”画成“向上”</div><div class="celltext diff">箭头锁定唯一终点</div><div class="celltext">分叉存在，却仍设主角</div>
      <div class="dim">明暗与视觉重心</div><div class="celltext diff">末位最亮，视线被向上牵引</div><div class="celltext">亮度接近，箭头承担重心</div><div class="celltext diff">聚光与粗线锁定中央末端</div>
      <div class="dim">容易偷渡的判断</div><div class="celltext diff">后来等于更好</div><div class="celltext diff">演化有预定方向</div><div class="celltext diff">分叉仍以人类为中心</div>
    </div>

    <div class="takeaway" id="takeaway">图像会用高低、方向、大小和聚光加入价值判断；分叉画对了，也不等于构图中立。</div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:11,kicker:"READ THE FRAME",title:"图像也会偷渡等级",take:"图像的构图本身会偷偷加入“更高、更好、更现代”的价值判断"});
(function(){
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
  document.querySelectorAll('[data-reveal]').forEach(function(el){
    var s={x:0,y:0,tx:0,ty:0,r:0,tr:0,frame:0,inside:false};
    function radius(){return Math.min(170,Math.max(125,el.clientWidth*.38));}
    function target(e){var p=Deck.pt(el,e);s.tx=p.x;s.ty=p.y;}
    function schedule(){if(!s.frame)s.frame=requestAnimationFrame(tick);}
    function tick(){s.frame=0;var pe=reduce.matches?1:.18,re=reduce.matches?1:.2;s.x+=(s.tx-s.x)*pe;s.y+=(s.ty-s.y)*pe;s.r+=(s.tr-s.r)*re;el.style.setProperty('--reveal-x',s.x.toFixed(1)+'px');el.style.setProperty('--reveal-y',s.y.toFixed(1)+'px');el.style.setProperty('--reveal-radius',s.r.toFixed(1)+'px');if(Math.abs(s.tx-s.x)>.1||Math.abs(s.ty-s.y)>.1||Math.abs(s.tr-s.r)>.1)schedule();}
    function enter(e){target(e);if(s.r<.5){s.x=s.tx;s.y=s.ty}s.inside=true;s.tr=radius();el.classList.add('seen');schedule();}
    function leave(){s.inside=false;s.tr=0;schedule();}
    el.addEventListener('pointerenter',enter);el.addEventListener('pointermove',function(e){if(!s.inside)enter(e);else{target(e);schedule();}});el.addEventListener('pointerleave',leave);el.addEventListener('pointercancel',leave);
    el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();s.tx=el.clientWidth/2;s.ty=el.clientHeight/2;s.x=s.tx;s.y=s.ty;s.tr=s.tr?0:Math.max(el.clientWidth,el.clientHeight);el.classList.add('seen');schedule();}});
    el.addEventListener('blur',leave);
  });
})();
</script>
</body>
</html>
