<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .turn{height:100%;display:flex;flex-direction:column;gap:20px}
  .turn-intro{display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
  .turn-intro h1{max-width:760px}
  .turn-intro .lead{max-width:590px;color:var(--muted);padding-bottom:3px}
  .body-map{position:relative;flex:1;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-lg);background:radial-gradient(ellipse at 50% 48%,rgb(219 238 255 / 96%) 0 19%,rgb(225 244 234 / 58%) 20% 34%,rgb(255 240 228 / 46%) 35% 48%,var(--surface-soft) 49% 100%)}

  .map-tag.left{left:24px}.map-tag.right{right:24px}

  .figure svg{display:block;width:100%;height:100%}
  .k-enumeration{--enum-cols:2;position:relative;z-index:2;height:100%;grid-template-rows:1fr 1fr;column-gap:470px;row-gap:22px;align-items:center}
  .k-enumeration>.it{min-height:122px;padding:18px 22px;background:rgb(255 255 255 / 92%)}
  .k-enumeration>.it:nth-child(odd){text-align:right}
  .k-enumeration>.it .bt{margin-bottom:6px}
  .k-enumeration>.it .cue{color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-body)}
  .k-enumeration>.it .ask{display:inline-block;margin-top:7px;color:var(--primary-strong);font-size:var(--fs-label);font-weight:700;line-height:var(--lh-tight)}
  .it::after{position:absolute;top:50%;width:74px;height:2px;background:var(--line-strong);content:""}
  .it:nth-child(odd)::after{left:100%}.it:nth-child(even)::after{right:100%}
  .closing{align-self:center;padding:10px 28px;color:var(--primary-strong);background:var(--primary-soft);border-radius:var(--r-md);font-size:var(--fs-lead);font-weight:750;line-height:var(--lh-body)}
</style>
</head>

        </article>

</main>
