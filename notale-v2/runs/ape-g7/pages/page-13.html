<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>一步之中，骨盆怎样稳住躯干？</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .p13{height:100%;display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0}
  .p13 .k-process{height:92px;flex:0 0 auto;--process-gap:38px}
  .p13 .k-process .step{padding:12px 16px;display:flex;align-items:center;gap:12px}
  .step-no{display:grid;place-items:center;flex:0 0 36px;height:36px;border-radius:50%;background:var(--surface-muted);color:var(--primary-strong);font-size:var(--fs-sec);font-weight:800}
  .step.is-current .step-no{color:#fff;background:var(--primary)}
  .step-copy{min-width:0}.step-copy strong{display:block;color:var(--primary-strong);font-size:var(--fs-h2);line-height:1.35}.step-copy span{display:block;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
  .model-stage{position:relative;flex:1 1 0;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-lg);background:linear-gradient(135deg,#eef4fa 0%,#fff 55%,#e7f0f8 100%);box-shadow:var(--shadow-soft)}
  #pelvis-canvas{display:block;cursor:grab}.model-stage.is-dragging #pelvis-canvas{cursor:grabbing}
  .scene-title{position:absolute;z-index:3;top:18px;left:20px;max-width:290px;padding:14px 16px;background:rgb(255 255 255 / 88%);border:1px solid var(--line);border-radius:var(--r-md);backdrop-filter:blur(5px)}
  .scene-title strong{display:block;color:var(--primary-strong);font-size:var(--fs-h2);line-height:1.35}.scene-title span{display:block;margin-top:4px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
  .view-note{position:absolute;z-index:3;top:18px;right:20px;width:310px;padding:16px 18px;background:rgb(255 240 228 / 92%);border:1px solid #efbd99;border-radius:var(--r-md)}
  .view-note .eyebrow{color:#7a3512;font-size:var(--fs-label);font-weight:800}.view-note strong{display:block;margin-top:4px;color:var(--text);font-size:var(--fs-lead);line-height:1.45}
  .tag{position:absolute;z-index:4;transform:translate(-50%,-50%);padding:5px 9px;color:var(--primary-strong);background:rgb(255 255 255 / 92%);border:1px solid var(--line-strong);border-radius:var(--r-sm);font-size:var(--fs-label);font-weight:700;line-height:1.35;pointer-events:none;white-space:nowrap}
  .tag::after{position:absolute;top:100%;left:50%;width:1px;height:20px;background:var(--line-strong);content:""}
  .scene-bottom{position:absolute;z-index:5;right:20px;bottom:18px;left:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;pointer-events:none}
  .hint{padding:9px 14px;color:var(--muted);background:rgb(255 255 255 / 90%);border:1px solid var(--line);border-radius:var(--r-sm);font-size:var(--fs-label);font-weight:650;line-height:1.35}
  .reset{min-width:164px;min-height:44px;pointer-events:auto;font-size:var(--fs-sec)}
  .legend-local{position:absolute;z-index:3;left:20px;bottom:72px;display:flex;gap:16px;padding:8px 12px;background:rgb(255 255 255 / 88%);border-radius:var(--r-sm);font-size:var(--fs-label);color:var(--muted)}
  .legend-local span{display:flex;align-items:center;gap:7px}.dot{width:12px;height:12px;border-radius:50%}.dot.blue{background:var(--primary)}.dot.orange{background:var(--accent)}
  @media (prefers-reduced-motion:reduce){.model-stage *{scroll-behavior:auto}}
</style>
</head>
<body data-page="13" data-total="45">
<div id="stage">
<main id="main">
  <section class="p13" aria-label="骨盆在单腿支撑中的作用">
    <div class="k-process axis" aria-label="一步中的三个连续阶段">
      <div class="step is-done"><span class="step-no">1</span><span class="step-copy"><strong>落脚</strong><span>支撑侧股骨头托住骨盆</span></span></div>
      <span class="arw" aria-hidden="true"></span>
      <div class="step is-done"><span class="step-no">2</span><span class="step-copy"><strong>单腿支撑</strong><span>另一侧离地，骨盆有下沉趋势</span></span></div>
      <span class="arw" aria-hidden="true"></span>
      <div class="step is-current"><span class="step-no">3</span><span class="step-copy"><strong>保持稳定</strong><span>髋周围结构限制摆动侧下沉</span></span></div>
    </div>

    <div class="model-stage no-pan min0" id="model-stage">
      <canvas id="pelvis-canvas" class="cv-fill" aria-label="可拖动旋转的骨盆、腰椎与股骨头三维模型"></canvas>
      <div class="scene-title"><strong>短、宽，不只是“大”</strong><span>拖到正面、侧面或上方，比较宽度、上下长度与髋关节的位置。</span></div>
      <div class="view-note" aria-live="polite"><span class="eyebrow" id="view-name">关键视角 · 前外侧</span><strong>短而宽的骨盆帮助躯干在单腿支撑时保持稳定。</strong></div>
      <span class="tag" id="tag-torso">躯干中线</span>
      <span class="tag" id="tag-hip">支撑侧髋关节</span>
      <div class="legend-local" aria-label="模型图例"><span><i class="dot blue"></i>支撑侧</span><span><i class="dot orange"></i>下沉趋势</span></div>
      <div class="scene-bottom"><span class="hint">拖动模型旋转 · 方向键也可转动</span><button class="reset" id="reset-view" type="button">回到关键视角</button></div>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/three.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:13,kicker:"BODY FIRST",title:"一步之中，骨盆怎样稳住躯干？",take:"短而宽的骨盆帮助躯干在单腿支撑时保持稳定。"});
(function(){
  var host=document.getElementById('model-stage'), canvas=document.getElementById('pelvis-canvas');
  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(32,1,.1,100); camera.position.set(0,1.1,10.5);
  var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  var root=new THREE.Group(); scene.add(root);
  var bone=new THREE.MeshStandardMaterial({color:0xe7d5b7,roughness:.67,metalness:.02});
  var boneDark=new THREE.MeshStandardMaterial({color:0xc7ad84,roughness:.72});
  var support=new THREE.MeshStandardMaterial({color:0x145da0,roughness:.48});
  var accent=new THREE.MeshStandardMaterial({color:0xd86b2b,roughness:.48});
  function ellipsoid(name,x,y,z,sx,sy,sz,mat){var m=new THREE.Mesh(new THREE.SphereGeometry(1,40,28),mat||bone);m.name=name;m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;m.receiveShadow=true;root.add(m);return m;}
  ellipsoid('left-ilium',-1.55,.65,0,1.55,1.48,.55,bone).rotation.z=-.2;
  ellipsoid('right-ilium',1.55,.65,0,1.55,1.48,.55,bone).rotation.z=.2;
  ellipsoid('sacrum',0,.45,-.18,.72,1.3,.48,boneDark);
  ellipsoid('left-lower',-1.05,-.55,.05,.78,1.12,.48,bone).rotation.z=-.35;
  ellipsoid('right-lower',1.05,-.55,.05,.78,1.12,.48,bone).rotation.z=.35;
  var holeMat=new THREE.MeshStandardMaterial({color:0x5f7184,roughness:.9});
  ellipsoid('left-socket',-1.62,-.28,.45,.43,.43,.25,support);
  ellipsoid('right-socket',1.62,-.28,.45,.43,.43,.25,holeMat);
  ellipsoid('support-head',-1.72,-.68,.48,.48,.48,.48,support);
  var femur=ellipsoid('support-femur',-1.78,-1.82,.5,.38,1.25,.38,support); femur.rotation.z=-.05;
  ellipsoid('swing-head',1.72,-.68,.48,.48,.48,.48,boneDark);
  var lumbar=new THREE.Group();root.add(lumbar);
  for(var i=0;i<4;i++){var v=new THREE.Mesh(new THREE.CylinderGeometry(.38,.44,.28,24),boneDark);v.position.set(0,1.55+i*.34,-.05);v.castShadow=true;lumbar.add(v)}
  var torsoLine=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,3,12),support);torsoLine.position.set(0,2.05,.55);root.add(torsoLine);
  function arrow(color,from,to){var d=to.clone().sub(from),len=d.length();var a=new THREE.ArrowHelper(d.normalize(),from,len,color,.28,.16);root.add(a);return a}
  arrow(0x145da0,new THREE.Vector3(-1.75,-3,.55),new THREE.Vector3(-1.75,-.9,.55));
  arrow(0xd86b2b,new THREE.Vector3(1.9,.45,.7),new THREE.Vector3(1.9,-.85,.7));
  var ground=new THREE.Mesh(new THREE.CircleGeometry(5.2,64),new THREE.MeshStandardMaterial({color:0xdfe8f2,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-3.05;ground.receiveShadow=true;scene.add(ground);
  scene.add(new THREE.HemisphereLight(0xffffff,0x91a2b5,2.1));
  var key=new THREE.DirectionalLight(0xffffff,3);key.position.set(-4,7,7);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
  var rim=new THREE.DirectionalLight(0x9bc9ef,1.6);rim.position.set(6,3,-5);scene.add(rim);
  var yaw=-.48,pitch=.1,targetYaw=yaw,targetPitch=pitch,drag=false,last={x:0,y:0};
  root.rotation.set(pitch,yaw,0);
  function resize(){var w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();render()}
  function project(obj,el){var p=new THREE.Vector3();obj.getWorldPosition(p);p.project(camera);el.style.left=((p.x*.5+.5)*host.clientWidth)+'px';el.style.top=((-p.y*.5+.5)*host.clientHeight-24)+'px';el.style.opacity=p.z<1?'1':'0'}
  function classify(){var a=((yaw%(Math.PI*2))+Math.PI*2)%(Math.PI*2),name='前外侧：宽度与髋关节同时可见';if(pitch<-.55)name='上方：看清骨盆的左右宽度';else if(a>1.05&&a<2.15||a>4.15&&a<5.25)name='侧面：比较上下长度与髋位置';else if(Math.abs(Math.sin(a))<.28)name='正面：看清两侧承托关系';document.getElementById('view-name').textContent=name}
  function render(){root.rotation.x=pitch;root.rotation.y=yaw;renderer.render(scene,camera);project(torsoLine,document.getElementById('tag-torso'));project(root.getObjectByName('support-head'),document.getElementById('tag-hip'));classify()}
  function point(e){return Deck.pt(canvas,e)}
  canvas.tabIndex=0;canvas.setAttribute('role','application');
  canvas.addEventListener('pointerdown',function(e){drag=true;host.classList.add('is-dragging');last=point(e);canvas.setPointerCapture(e.pointerId)});
  canvas.addEventListener('pointermove',function(e){if(!drag)return;var p=point(e);yaw+=(p.x-last.x)*.009;pitch=Deck.clamp(pitch+(p.y-last.y)*.007,-.8,.7);last=p;render()});
  canvas.addEventListener('pointerup',function(){drag=false;host.classList.remove('is-dragging')});
  canvas.addEventListener('keydown',function(e){if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();if(e.key==='ArrowLeft')yaw-=.12;if(e.key==='ArrowRight')yaw+=.12;if(e.key==='ArrowUp')pitch=Deck.clamp(pitch-.1,-.8,.7);if(e.key==='ArrowDown')pitch=Deck.clamp(pitch+.1,-.8,.7);render()});
  document.getElementById('reset-view').addEventListener('click',function(){yaw=-.48;pitch=.1;render();canvas.focus()});
  Deck.onResize(resize);resize();
})();
</script>
</body>
</html>
