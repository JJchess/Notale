<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>膝盖为什么向中线靠</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .p14-layout{height:100%;display:flex;gap:var(--sp-6);min-width:0}
  .scene-panel{position:relative;flex:3 1 0;min-width:0;min-height:0;overflow:hidden;padding:0;background:linear-gradient(180deg,#eaf1f8 0%,#fff 72%)}
  #scene{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  .scene-head{position:absolute;z-index:2;top:18px;left:22px;right:22px;pointer-events:none}
  .scene-head h2{margin-bottom:4px}
  .scene-labels{position:absolute;z-index:2;inset:0;pointer-events:none}
  .tag{position:absolute;padding:5px 9px;color:var(--primary-strong);background:rgb(255 255 255 / 90%);border:1px solid var(--line);border-radius:var(--r-sm);font-size:var(--fs-label);line-height:var(--lh-tight)}
  .tag-mid{top:19%;left:47%}.tag-knee{top:55%;left:62%}.tag-foot{bottom:11%;left:57%}
  .scene-legend{position:absolute;z-index:2;bottom:16px;left:20px;right:20px;padding:10px 12px;background:rgb(255 255 255 / 90%);border-radius:var(--r-sm)}
  .right{flex:2 1 0;min-width:0;min-height:0}
  .controls{padding:var(--sp-4);box-shadow:none}
  .mode-buttons{display:flex;gap:var(--sp-2)}
  .mode-buttons button{min-width:132px;min-height:44px}
  .range-row input{flex:1;min-width:0}
  .angle-value{min-width:52px;color:var(--primary-strong);font-size:var(--fs-h2);font-weight:750;text-align:right}
  .k-comparison{--comparison-cols:128px repeat(2,minmax(0,1fr));font-size:var(--fs-sec)}
  .k-comparison > *{padding:10px 12px;line-height:1.4;border-bottom:1px solid var(--line)}
  .k-comparison > :nth-last-child(-n+3){border-bottom:0}
  .k-comparison .hdr{font-size:var(--fs-sec);display:flex;align-items:center;justify-content:center}
  .k-comparison .dim{text-align:left;display:flex;align-items:center}
  .k-comparison .state-cell{transition:background .18s ease,box-shadow .18s ease}
  .k-comparison[data-mode="vertical"] .v-cell,.k-comparison[data-mode="angled"] .a-cell{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent);color:var(--primary-strong);font-weight:700}
  .takeaway{padding:var(--sp-4);border-left:6px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:var(--fs-lead);line-height:var(--lh-body);font-weight:750}
  @media (prefers-reduced-motion:reduce){.k-comparison .state-cell{transition:none}}
</style>
</head>
<body data-page="14" data-total="45">
<div id="stage">
<main id="main">
  <div class="p14-layout">
    <section class="panel scene-panel min0" aria-labelledby="model-title">
      <div class="scene-head">
        <h2 id="model-title">同一副骨架，只改变股骨角度</h2>
        <p class="sec muted">正面观察单腿支撑：骨盆宽度、腿长和视角保持不变。</p>
      </div>
      <div id="scene" role="img" aria-label="三维骨盆、股骨、膝、胫骨以及重心投影的联动示意"></div>
      <div class="scene-labels" aria-hidden="true">
        <span class="tag tag-mid">身体中线</span>
        <span class="tag tag-knee">支撑膝</span>
        <span class="tag tag-foot">支撑块</span>
      </div>
      <div class="legend scene-legend">
        <span><i class="swatch" style="background:#d86b2b"></i>髋—膝—足力线</span>
        <span><i class="swatch" style="background:#145da0"></i>重心轨迹</span>
        <span><i class="swatch" style="background:#8799ae"></i>身体中线</span>
      </div>
    </section>

    <section class="right col gap-3 min0" aria-label="角度控制与逐维比较">
      <div class="panel controls col gap-3">
        <div class="row between items-center">
          <h2>切换股骨方向</h2>
          <button id="reset" type="button" title="恢复向内倾斜状态">重置</button>
        </div>
        <div class="mode-buttons" role="group" aria-label="股骨方向预设">
          <button id="vertical" type="button" aria-pressed="false">近乎垂直</button>
          <button id="angled" type="button" aria-pressed="true">向内倾斜</button>
        </div>
        <div class="ctl range-row">
          <label for="angle">角度控制柄</label>
          <input id="angle" type="range" min="0" max="12" step="1" value="9" aria-describedby="angle-help">
          <output id="angleOut" class="angle-value mono-num" for="angle">9°</output>
        </div>
        <p id="angle-help" class="sec muted">拖动时，膝、支撑块与重心路径一起改变。</p>
      </div>

      <div id="comparison" class="k-comparison grow" data-mode="angled" aria-label="四个维度的对照表">
        <div class="hdr">比较维度</div><div class="hdr v-cell">近乎垂直</div><div class="hdr a-cell">向内倾斜</div>
        <div class="dim">膝的位置</div><div class="state-cell v-cell">更偏身体外侧</div><div class="state-cell a-cell">更靠近身体中线</div>
        <div class="dim">支撑块位置</div><div class="state-cell v-cell">需更向外接住身体</div><div class="state-cell a-cell">可更接近中线</div>
        <div class="dim">重心投影</div><div class="state-cell v-cell">离支撑点较远</div><div class="state-cell a-cell">更接近支撑点</div>
        <div class="dim">躯干路径</div><div class="state-cell v-cell">左右摆动较大</div><div class="state-cell a-cell">左右摆动较小</div>
      </div>

      <p class="takeaway">股骨向内倾斜，使膝部靠近身体中线；单腿支撑时，重心不必靠大幅左右摆动才能移到支撑脚上方。</p>
    </section>
  </div>
</main>
</div>
<script src="assets/lib/three.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index:14,
  kicker:"BODY II / LOAD LINE",
  title:"膝盖为什么向中线靠",
  take:"膝部靠近身体中线，使双足步行时重心不必左右大幅摆动"
});

(function(){
  var host=document.getElementById('scene');
  var slider=document.getElementById('angle');
  var out=document.getElementById('angleOut');
  var table=document.getElementById('comparison');
  var btnV=document.getElementById('vertical');
  var btnA=document.getElementById('angled');
  var reset=document.getElementById('reset');
  var scene=new THREE.Scene();
  scene.background=new THREE.Color(0xeaf1f8);
  var camera=new THREE.PerspectiveCamera(34,1,.1,100);
  camera.position.set(0,1.1,11.5);
  camera.lookAt(0,.5,0);
  var renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  host.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff,0x9dafc0,2.2));
  var key=new THREE.DirectionalLight(0xffffff,2.6);key.position.set(4,8,7);key.castShadow=true;scene.add(key);
  var floor=new THREE.Mesh(new THREE.PlaneGeometry(10,5),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.9}));
  floor.rotation.x=-Math.PI/2;floor.position.y=-3.25;floor.receiveShadow=true;scene.add(floor);
  var body=new THREE.Group();scene.add(body);
  var boneMat=new THREE.MeshStandardMaterial({color:0xf4e4c5,roughness:.58,metalness:.04});
  var jointMat=new THREE.MeshStandardMaterial({color:0xe1c596,roughness:.5});
  var pelvisMat=new THREE.MeshPhysicalMaterial({color:0x72a4ca,transparent:true,opacity:.48,roughness:.35,side:THREE.DoubleSide});
  var lineMat=new THREE.MeshBasicMaterial({color:0xd86b2b});
  var blueMat=new THREE.MeshBasicMaterial({color:0x145da0});
  var grayMat=new THREE.MeshBasicMaterial({color:0x8799ae,transparent:true,opacity:.8});

  var pelvis=new THREE.Mesh(new THREE.BoxGeometry(3.35,1.05,.9),pelvisMat);pelvis.position.y=2.55;pelvis.castShadow=true;body.add(pelvis);
  var waist=new THREE.Mesh(new THREE.CylinderGeometry(.82,1.05,1.35,24),pelvisMat);waist.position.y=3.7;body.add(waist);
  function sphere(r,mat){var m=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),mat);m.castShadow=true;body.add(m);return m}
  function bar(a,b,r,mat){var d=new THREE.Vector3().subVectors(b,a),m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),18),mat);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());m.castShadow=true;body.add(m);return m}
  var parts=[];
  function rebuild(angle,phase){
    parts.forEach(function(x){body.remove(x);x.geometry.dispose()});parts=[];
    var t=angle/12, inward=.68*t, sway=(1-t)*.72;
    var shift=sway*Math.sin(phase*Math.PI);
    body.position.x=shift;
    var hipY=2.35,kneeY=-.15,footY=-3.02;
    [-1,1].forEach(function(side){
      var hipX=side*1.25, kneeX=side*(1.25-inward), footX=side*(1.42-inward*.72);
      var hip=new THREE.Vector3(hipX,hipY,0),knee=new THREE.Vector3(kneeX,kneeY,0),ankle=new THREE.Vector3(footX,-2.55,0);
      var f=bar(hip,knee,.18,boneMat),s1=sphere(.27,jointMat);s1.position.copy(knee);var tib=bar(knee,ankle,.15,boneMat);
      var foot=new THREE.Mesh(new THREE.BoxGeometry(.72,.28,1.25),new THREE.MeshStandardMaterial({color:side===1?0x145da0:0xb8c5d2,roughness:.75}));foot.position.set(footX,footY,.18);foot.castShadow=true;body.add(foot);
      parts.push(f,s1,tib,foot);
      if(side===1){var load=bar(hip,new THREE.Vector3(footX,footY+.2,0),.045,lineMat);parts.push(load)}
    });
    var mid=bar(new THREE.Vector3(0,4.55,-.15),new THREE.Vector3(0,-3.15,-.15),.025,grayMat);parts.push(mid);
    var com=sphere(.18,blueMat);com.position.set(0,3.8,.55);parts.push(com);
    var proj=bar(new THREE.Vector3(0,3.7,.55),new THREE.Vector3(0,-3.12,.55),.035,blueMat);parts.push(proj);
    var ring=new THREE.Mesh(new THREE.RingGeometry(.18,.3,32),blueMat);ring.rotation.x=-Math.PI/2;ring.position.set(0,-3.22,.55);body.add(ring);parts.push(ring);
  }
  var state={angle:9,start:performance.now(),active:true};
  function mode(){return state.angle<4?'vertical':'angled'}
  function sync(play){
    state.angle=Number(slider.value);
    out.textContent=Lec.P.roundTo(state.angle,0)+'°';
    var m=mode();table.dataset.mode=m;
    btnV.setAttribute('aria-pressed',String(m==='vertical'));btnA.setAttribute('aria-pressed',String(m==='angled'));
    if(play){state.start=performance.now();state.active=!Deck.reduced()}
    rebuild(state.angle,Deck.reduced()?0.5:0);
  }
  slider.addEventListener('input',function(){sync(true)});
  btnV.addEventListener('click',function(){slider.value=0;sync(true)});
  btnA.addEventListener('click',function(){slider.value=9;sync(true)});
  reset.addEventListener('click',function(){slider.value=9;sync(true);slider.focus()});
  function resize(){var w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
  Deck.onResize(resize);resize();sync(false);
  Deck.loop(function(now){
    var phase=.5;
    if(state.active){var elapsed=(now-state.start)/2300;if(elapsed>=1){state.active=false;phase=1}else phase=elapsed}
    rebuild(state.angle,phase);
    renderer.render(scene,camera);
  },{still:0.5});
})();
</script>
</body>
</html>
