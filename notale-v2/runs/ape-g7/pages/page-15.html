<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>走路，是不断接住正在跌倒的身体</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .balance-page{height:100%;display:flex;flex-direction:column;gap:16px;min-height:0}
  .cycle{--process-gap:22px;flex:0 0 82px;align-items:center}
  .cycle .step{height:68px;padding:9px 10px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:15px;line-height:1.35}
  .cycle .step b{font-size:16px;color:var(--primary-strong)}
  .cycle .return{flex:0 0 50px;color:var(--primary);font-size:28px;font-weight:800;text-align:center}
  .playfield{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-soft)}
  #world{display:block}
  .scene-label{position:absolute;z-index:2;padding:6px 10px;border-radius:var(--r-sm);background:rgb(255 255 255 / 88%);color:var(--muted);font-size:15px;line-height:1.35;pointer-events:none}
  .lab-com{top:20px;left:50%;transform:translateX(-50%);color:#7a3512;font-weight:700}
  .lab-support{bottom:18px;left:50%;transform:translateX(-50%);color:#7a3512;font-weight:700}
  .hud{position:absolute;z-index:3;top:16px;left:16px;display:flex;gap:10px}
  .pill{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgb(255 255 255 / 92%);font-size:16px;line-height:1.35;font-variant-numeric:tabular-nums}
  .status{position:absolute;z-index:3;right:16px;top:16px;max-width:410px;padding:10px 14px;border-radius:var(--r-sm);background:var(--primary-soft);color:var(--primary-strong);font-size:16px;line-height:1.4;font-weight:700}
  .status.fail{background:var(--danger-soft);color:var(--danger)} .status.win{background:var(--success-soft);color:var(--success)}
  .controls{flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;gap:18px}
  .control-set{display:flex;align-items:center;gap:10px}.control-set button{min-width:58px;min-height:48px;font-size:18px}
  .control-set .reset{min-width:92px;font-size:15px}
  .takeaway{max-width:790px;color:var(--text);font-size:18px;line-height:1.45;font-weight:700}
  .hint{font-size:15px;color:var(--muted);line-height:1.35}
  @media (prefers-reduced-motion:reduce){.playfield{scroll-behavior:auto}}
</style>
</head>
<body data-page="15" data-total="45">
<div id="stage">
<main id="main">
  <section class="balance-page min0" aria-label="侧向平衡挑战">
    <div class="k-process cycle axis" aria-label="步行的六步循环">
      <div class="step is-current"><b>1 落地</b><span>双脚短暂接地</span></div><i class="arw" aria-hidden="true"></i>
      <div class="step"><b>2 缩窄</b><span>一脚抬起</span></div><i class="arw" aria-hidden="true"></i>
      <div class="step"><b>3 侧移</b><span>重心移向承重侧</span></div><i class="arw" aria-hidden="true"></i>
      <div class="step"><b>4 摆动</b><span>另一脚寻找落点</span></div><i class="arw" aria-hidden="true"></i>
      <div class="step"><b>5 接住</b><span>新脚落地</span></div><i class="arw" aria-hidden="true"></i>
      <div class="step"><b>6 交换</b><span>支撑侧切换</span></div>
      <div class="return" title="回到下一步落地" aria-label="循环回到落地">↩</div>
    </div>

    <div class="playfield min0 no-pan" id="arena" tabindex="0" role="application" aria-label="平衡场景。用左右方向键调整躯干侧移，也可在场景中横向拖动。">
      <canvas id="world" class="cv-fill" aria-hidden="true"></canvas>
      <div class="hud"><span class="pill">步数 <b id="steps">0</b>/<b id="target">0</b></span><span class="pill">稳定度 <b id="balance">100%</b></span></div>
      <div id="status" class="status" aria-live="polite">双脚着地：准备把重心移向承重脚</div>
      <div class="scene-label lab-com">重心投影 ↓</div>
      <div class="scene-label lab-support">当前支撑区</div>
    </div>

    <div class="controls">
      <div class="control-set" aria-label="侧移控制"><span class="hint">横向拖动，或按</span><button id="left" aria-label="重心向左">←</button><button id="right" aria-label="重心向右">→</button><span class="hint">迈步节奏自动推进</span><button id="reset" class="reset">重新开始</button></div>
      <p class="takeaway">双足步行不是“少用两条腿”，而是每一步都重新安排支撑面，让移动中的重心被下一只脚接住。</p>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/matter.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:15,kicker:"BALANCE IN MOTION",title:"走路，是不断接住正在跌倒的身体",take:"双足步行不是“少两条腿”，而是连续控制支撑面与重心。"});

(function(){
  var Engine=Matter.Engine, Bodies=Matter.Bodies, Body=Matter.Body, Composite=Matter.Composite, Constraint=Matter.Constraint;
  var arena=document.getElementById('arena'), cv=document.getElementById('world');
  var stepsEl=document.getElementById('steps'), targetEl=document.getElementById('target'), balanceEl=document.getElementById('balance'), statusEl=document.getElementById('status');
  var duration=Lec.K.page15ChallengeDuration, target=Lec.K.page15TargetSteps, tolerance=Lec.K.page15BalanceTolerance;
  var phaseNames=['双脚着地：支撑区较宽','抬起摆动脚：支撑区缩窄','侧移：把重心送向承重脚','摆动：新脚正在寻找落点','落地：用新脚接住身体','交换：新脚成为承重脚'];
  var state, engine, torso, hip, leftFoot, rightFoot, links, stopLoop, dragging=false, lastX=0;
  targetEl.textContent=target;

  function fresh(){return {phase:0,elapsed:0,steps:0,side:-1,offset:0,done:false,failed:false,reason:'',trace:[]};}
  function setupPhysics(){
    engine=Engine.create({gravity:{x:0,y:0,scale:0}});
    torso=Bodies.rectangle(704,155,104,126,{frictionAir:.12,inertia:Infinity});
    hip=Bodies.circle(704,250,18,{frictionAir:.15,inertia:Infinity});
    leftFoot=Bodies.rectangle(630,365,116,20,{isStatic:true}); rightFoot=Bodies.rectangle(778,365,116,20,{isStatic:true});
    links=[Constraint.create({bodyA:torso,bodyB:hip,length:100,stiffness:.8}),Constraint.create({bodyA:hip,bodyB:leftFoot,length:122,stiffness:.32}),Constraint.create({bodyA:hip,bodyB:rightFoot,length:122,stiffness:.32})];
    Composite.add(engine.world,[torso,hip,leftFoot,rightFoot].concat(links));
  }
  function reset(){state=fresh();setupPhysics();statusEl.className='status';renderUI();draw();arena.focus();}
  function phaseDuration(){return Math.max(.35,duration/(target*6));}
  function support(){
    if(state.phase===0||state.phase===4) return {a:586,b:836};
    var x=state.side<0?630:778; return {a:x-58,b:x+58};
  }
  function projection(){return 704+state.offset;}
  function nudge(v){if(state.done||state.failed)return;state.offset=Lec.P.clamp(state.offset+v,-190,190);Body.setVelocity(torso,{x:v*.08,y:0});renderUI();draw();}
  function judge(){
    var s=support(), p=projection(), margin=Math.min(p-s.a,s.b-p), stable=Lec.P.clamp((margin+tolerance)/(tolerance*2),0,1);
    if((state.phase===2||state.phase===3) && margin < -tolerance){fail('侧移过量：重心过早越出支撑区');return stable;}
    if(state.phase===4){
      var desired=state.side<0?44:-44;
      if(Math.abs(state.offset-desired)>tolerance*1.8){fail(Math.abs(state.offset)<Math.abs(desired)?'侧移不足：新脚没有接到重心':'落脚过晚：重心已越过新支撑区');}
    }
    return stable;
  }
  function fail(msg){state.failed=true;state.reason=msg;statusEl.className='status fail';statusEl.textContent=msg+'。重新开始再试。';}
  function advance(){
    if(state.done||state.failed)return;
    state.phase=(state.phase+1)%6;
    if(state.phase===0){state.steps++;state.side*=-1;state.trace.push(state.offset);if(state.steps>=target){state.done=true;statusEl.className='status win';statusEl.textContent='完成挑战：每次落脚都接住了移动中的重心。';}}
    judge();renderUI();
  }
  function renderUI(){
    stepsEl.textContent=state.steps;
    var stable=judge();balanceEl.textContent=Lec.P.percent(stable,0);
    document.querySelectorAll('.cycle .step').forEach(function(el,i){el.classList.toggle('is-current',i===state.phase);el.classList.toggle('is-done',i<state.phase);});
    if(!state.done&&!state.failed)statusEl.textContent=phaseNames[state.phase];
  }
  function draw(){
    var ctx=Deck.fit(cv), w=arena.clientWidth,h=arena.clientHeight, sx=w/1408, sy=h/420;
    ctx.save();ctx.scale(sx,sy);ctx.clearRect(0,0,1408,420);
    ctx.fillStyle=Deck.rgba('--primary',.045);ctx.fillRect(0,0,1408,420);
    ctx.strokeStyle=Deck.rgba('--line-strong',.65);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,376);ctx.lineTo(1408,376);ctx.stroke();
    var s=support(), p=projection();
    ctx.fillStyle=Deck.rgba('--accent',.22);ctx.fillRect(s.a,365,s.b-s.a,24);ctx.strokeStyle=Deck.token('--accent');ctx.lineWidth=3;ctx.strokeRect(s.a,365,s.b-s.a,24);
    var lx=state.phase===1||state.phase===2||state.phase===3?(state.side<0?630:778):630;
    var rx=state.phase===1||state.phase===2||state.phase===3?(state.side<0?778:630):778;
    var raised=state.phase===1||state.phase===2||state.phase===3;
    function limb(x1,y1,x2,y2){ctx.strokeStyle=Deck.token('--primary-strong');ctx.lineWidth=16;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
    limb(p,250,lx,raised&&state.side>0?330:360);limb(p,250,rx,raised&&state.side<0?330:360);
    ctx.fillStyle=Deck.token('--primary');Deck.rr(ctx,p-52,82,104,130,24);ctx.fill();ctx.beginPath();ctx.arc(p,52,31,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=Deck.token('--accent');ctx.lineWidth=3;ctx.setLineDash([8,7]);ctx.beginPath();ctx.moveTo(p,82);ctx.lineTo(p,365);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=Deck.token('--accent');ctx.beginPath();ctx.arc(p,147,9,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  function tick(t,dt){if(!state.done&&!state.failed){state.elapsed+=dt/1000;Engine.update(engine,Math.min(dt,32));Body.setPosition(torso,{x:704+state.offset,y:155});if(state.elapsed>=phaseDuration()){state.elapsed=0;advance();}}draw();}
  function pointer(e){var p=Deck.pt(arena,e);if(dragging){nudge((p.x-lastX)*.55);lastX=p.x;e.preventDefault();}}
  arena.addEventListener('pointerdown',function(e){dragging=true;lastX=Deck.pt(arena,e).x;arena.setPointerCapture(e.pointerId);});
  arena.addEventListener('pointermove',pointer);arena.addEventListener('pointerup',function(){dragging=false;});
  document.getElementById('left').addEventListener('click',function(){nudge(-18);});document.getElementById('right').addEventListener('click',function(){nudge(18);});
  document.getElementById('reset').addEventListener('click',reset);
  arena.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'){nudge(-18);e.preventDefault();}if(e.key==='ArrowRight'){nudge(18);e.preventDefault();}});
  Deck.onResize(draw);reset();stopLoop=Deck.loop(tick,{still:1000});
})();
</script>
</body>
</html>
