<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>稳住，也要省力</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .p17{height:100%;display:flex;flex-direction:column;gap:14px;min-height:0}
  .lab{height:338px;display:flex;gap:16px;min-height:0}
  .controls{width:330px;padding:16px;display:flex;flex-direction:column;gap:7px}
  .controls h2{margin-bottom:2px}.ctl{justify-content:space-between}.ctl label{width:96px}.ctl input{width:138px;min-width:138px}.ctl output{width:56px;text-align:right;font-size:var(--fs-label);font-variant-numeric:tabular-nums}
  .actions{display:flex;gap:10px;margin-top:auto}.actions button{min-height:44px;flex:1}.start-btn{color:white;background:var(--primary);border-color:var(--primary)}
  .track{position:relative;flex:1;min-width:0;overflow:hidden;padding:68px 18px 0;color:var(--muted);font-size:var(--fs-label);background:linear-gradient(#e9f4ff 0 70%,#dce8d2 70% 100%)}
  .track-head{position:absolute;z-index:3;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start}
  .status{font-size:var(--fs-body);font-weight:750;color:var(--primary-strong)}
  .metric{display:flex;gap:10px}.pill{padding:5px 10px;background:rgb(255 255 255 / 90%);border:1px solid var(--line);border-radius:var(--r-sm);font-size:var(--fs-label)}
  .lane{position:absolute;left:24px;right:24px;bottom:55px;height:4px;background:var(--line-strong)}
  .finish{position:absolute;right:55px;bottom:55px;width:5px;height:180px;background:repeating-linear-gradient(to bottom,var(--text) 0 12px,#fff 12px 24px)}
  .walker{position:absolute;left:78px;bottom:59px;width:78px;height:150px;transform-origin:50% 90%;transition:opacity .2s}
  .walker .head{position:absolute;left:26px;top:0;width:27px;height:27px;border-radius:50%;background:var(--accent)}
  .walker .torso{position:absolute;left:21px;top:29px;width:37px;height:63px;border-radius:18px 18px 10px 10px;background:var(--primary)}
  .walker .leg{position:absolute;top:84px;width:12px;height:63px;border-radius:8px;background:var(--primary-strong);transform-origin:50% 3px}.leg.a{left:27px}.leg.b{left:42px}
  .ground-note{position:absolute;left:18px;bottom:14px;color:var(--muted);font-size:var(--fs-sec)}
  .course{position:absolute;left:190px;right:105px;top:96px;bottom:73px;border-top:2px dashed var(--line-strong);border-bottom:2px dashed var(--line-strong);background:repeating-linear-gradient(90deg,transparent 0 78px,rgb(20 93 160 / 8%) 78px 80px)}
  .course span{position:absolute;width:28px;height:48px;border:3px solid var(--primary);border-radius:50% 50% 44% 44%;opacity:.32}.course span:nth-child(odd){top:70px;transform:rotate(12deg)}.course span:nth-child(even){top:125px;transform:rotate(-12deg)}
  .course .z1{left:4%}.course .z2{left:14%}.course .z3{left:24%}.course .z4{left:34%}.course .z5{left:44%}.course .z6{left:54%}.course .z7{left:64%}.course .z8{left:74%}
  .checkpoint{position:absolute;top:72px;font-size:var(--fs-label);color:var(--muted);font-weight:700}.cp1{left:21%}.cp2{left:51%}.cp3{left:79%}
  .lower{display:flex;gap:16px;min-height:0;flex:1}.evidence{width:535px;padding:14px 16px;min-width:0}.evidence h2{margin-bottom:8px}
  .history{display:flex;gap:8px;align-items:stretch;height:116px}.run{flex:1;min-width:0;padding:8px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-soft);font-size:var(--fs-label);line-height:1.35}.run.current{border:2px solid var(--accent);background:var(--accent-soft)}.run b,.run span{display:block}.run::after{content:"";display:block;height:18px;margin-top:8px;border-radius:4px;background:linear-gradient(90deg,var(--danger-soft) 0 28%,var(--warning-soft) 28% 62%,var(--success-soft) 62% 100%);border:1px solid var(--line)}.run.empty{display:grid;place-items:center;color:var(--muted)}
  .general{flex:1;min-width:0;gap:9px}.general .claim{padding:10px 16px}.general .supports{--support-cols:4;gap:8px;padding-top:18px}.general .support{padding:9px 10px}.general .support::before{height:18px}.general .trunk::before{height:18px}.general .trunk{right:6%;left:6%}
  .support b{display:block;color:var(--primary-strong);font-size:var(--fs-label);margin-bottom:2px}.support span{font-size:var(--fs-label);line-height:1.35;display:block}
  @media (prefers-reduced-motion:reduce){.walker{transition:none}}
</style>
</head>
<body data-page="17" data-total="45">
<div id="stage"><main id="main">
  <section class="p17">
    <div class="lab">
      <section class="panel controls min0" aria-label="身体组合参数">
        <h2>配置一轮</h2>
        <div class="ctl"><label for="stride">步幅</label><input id="stride" type="range"><output id="strideO"></output></div>
        <div class="ctl"><label for="width">支撑宽度</label><input id="width" type="range"><output id="widthO"></output></div>
        <div class="ctl"><label for="mass">躯干质量</label><input id="mass" type="range"><output id="massO"></output></div>
        <div class="ctl"><label for="speed">行走速度</label><input id="speed" type="range"><output id="speedO"></output></div>
        <p class="note">相对指标只用于比较本模型，不是真实人体测量。</p>
        <div class="actions"><button class="start-btn" id="start">开赛</button><button id="reset">重置</button></div>
      </section>
      <section class="panel track min0" aria-label="侧视步行赛道">足迹间距呈现步幅，身体倾角呈现晃动。
        <div class="track-head"><div><h2>同一赛道</h2><div class="status" id="status" aria-live="polite">调整组合，再开赛</div></div><div class="metric"><span class="pill" id="stable">稳定性 —</span><span class="pill" id="cost">代价 —</span></div></div>
        <span class="checkpoint cp1">起步：建立节律</span><span class="checkpoint cp2">中段：控制晃动</span><span class="checkpoint cp3">终段：保持落脚</span>
        <div class="course" aria-hidden="true"><span class="z1"></span><span class="z2"></span><span class="z3"></span><span class="z4"></span><span class="z5"></span><span class="z6"></span><span class="z7"></span><span class="z8"></span></div>
        <div class="finish" aria-hidden="true"></div><div class="lane" aria-hidden="true"></div>
        <div class="walker" id="walker" aria-hidden="true"><i class="head"></i><i class="torso"></i><i class="leg a"></i><i class="leg b"></i></div>
        <p class="ground-note">晃动放大时可能失稳；抵达终点才记为完成。</p>
      </section>
    </div>
    <div class="lower">
      <section class="panel evidence min0"><h2>历次结果 · 最多 4 轮</h2>每轮用同一尺度记录，比较成功组合而非只看一次胜负。<div class="history" id="history"><div class="run empty">第 1 轮</div><div class="run empty">第 2 轮</div><div class="run empty">第 3 轮</div><div class="run empty">第 4 轮</div></div></section>
      <section class="k-generalization general min0">
        <div class="claim">不同身体组合会改变稳定性与能量代价；“更稳”和“更省”不总在同一方向。</div>
        <div class="supports"><i class="trunk" aria-hidden="true"></i>
          <div class="support"><b>步幅</b><span>步数少，也可能加大摆动与冲击。</span></div>
          <div class="support"><b>支撑宽度</b><span>通常更稳，路径与动作代价也会变。</span></div>
          <div class="support"><b>质量分布</b><span>躯干越偏重，重心越难控制。</span></div>
          <div class="support"><b>速度条件</b><span>同一组合换速度，结果可能反转。</span></div>
        </div>
      </section>
    </div>
  </section>
</main></div>
<script src="assets/lib/matter.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:17,kicker:"BODY COMBINATIONS",title:"稳住，也要省力",take:"不存在脱离条件与评价标准的万能“最佳身体”。"});
(function(){
  var P=Lec.P, K=Lec.K, human=K.human;
  var cfg={stride:[P.roundTo(human.typicalHeight*0.24,2),P.roundTo(human.typicalHeight*0.58,2),P.roundTo(human.typicalHeight*0.38,2),0.01],width:[P.roundTo(human.typicalHeight*0.06,2),P.roundTo(human.typicalHeight*0.24,2),P.roundTo(human.typicalHeight*0.12,2),0.01],mass:[P.roundTo(human.typicalMass*0.55,0),P.roundTo(human.typicalMass*0.85,0),P.roundTo(human.typicalMass*0.68,0),1],speed:[P.roundTo(human.walkingSpeed*0.55,1),P.roundTo(human.walkingSpeed*1.45,1),human.walkingSpeed,0.1]};
  var ids=['stride','width','mass','speed'], units={stride:' m',width:' m',mass:' kg',speed:' m/s'}, runs=[], running=false, stopLoop=null, body=null;
  ids.forEach(function(id){var el=document.getElementById(id),c=cfg[id];el.min=c[0];el.max=c[1];el.value=c[2];el.step=c[3];el.addEventListener('input',show);});
  function show(){ids.forEach(function(id){var v=+document.getElementById(id).value;document.getElementById(id+'O').value=P.roundTo(v,id==='mass'?0:2)+units[id];});}
  function metrics(){var s=+stride.value,w=+width.value,m=+mass.value,v=+speed.value;var sr=P.ratio(s,cfg.stride[2]),wr=P.ratio(w,cfg.width[2]),mr=P.ratio(m,cfg.mass[2]),vr=P.ratio(v,cfg.speed[2]);var sway=Math.abs(sr-1)*22+Math.abs(vr-1)*24+Math.max(0,mr-1)*25-Math.max(0,wr-1)*22;var stability=P.clamp(88-sway,18,98);var cost=P.clamp(42+30/sr+18*vr*vr+13*wr+10*mr,35,100);return {stability:P.roundTo(stability,0),cost:P.roundTo(cost,0),success:stability>=48,vals:{s:s,w:w,m:m,v:v}};}
  function renderHistory(){var box=document.getElementById('history');box.innerHTML='';for(var i=0;i<4;i++){var r=runs[i],d=document.createElement('div');d.className='run'+(i===runs.length-1&&r?' current':'');if(!r){d.className='run empty';d.textContent='第 '+(i+1)+' 轮';}else{d.innerHTML='<b>第 '+(i+1)+'轮 · '+(r.success?'完成':'失稳')+'</b><span>稳 '+P.percent(P.ratio(r.stability,100),0)+' · 代价 '+r.cost+'</span><span>幅 '+P.roundTo(r.vals.s,2)+' / 宽 '+P.roundTo(r.vals.w,2)+'</span><span>速 '+P.roundTo(r.vals.v,1)+' m/s</span>';}box.appendChild(d);}}
  function finish(r){running=false;if(stopLoop){stopLoop();stopLoop=null;}runs.push(r);if(runs.length>4)runs.shift();stable.textContent='稳定性 '+P.percent(P.ratio(r.stability,100),0);cost.textContent='相对代价 '+r.cost;status.textContent=r.success?'抵达：换一组参数再比较':'失稳：调整组合再试';renderHistory();start.disabled=false;}
  function startRun(){if(running)return;running=true;start.disabled=true;status.textContent='行走中…';var r=metrics(),engine=Matter.Engine.create({gravity:{x:0,y:0}});body=Matter.Bodies.rectangle(0,0,20,60,{frictionAir:0.08});Matter.Body.setVelocity(body,{x:2.3*r.vals.v,y:0});Matter.Composite.add(engine.world,body);var t=0;walker.style.opacity='1';stopLoop=Deck.loop(function(_,dt){var step=dt||16.67;t+=step;Matter.Engine.update(engine,step);var progress=P.clamp(body.position.x/6.2,0,1);var sway=(100-r.stability)*0.22*Math.sin(t/90);walker.style.left=(78+progress*820)+'px';walker.style.transform='rotate('+sway+'deg)';walker.querySelector('.leg.a').style.transform='rotate('+(22*Math.sin(t/100))+'deg)';walker.querySelector('.leg.b').style.transform='rotate('+(-22*Math.sin(t/100))+'deg)';if((!r.success&&progress>.55)||progress>=1){if(!r.success)walker.style.transform='rotate(72deg)';finish(r);}}, {still:1000});if(Deck.reduced()){walker.style.left=(r.success?898:530)+'px';finish(r);}}
  function resetAll(){if(stopLoop)stopLoop();stopLoop=null;running=false;runs=[];ids.forEach(function(id){document.getElementById(id).value=cfg[id][2];});walker.style.left='78px';walker.style.transform='none';stable.textContent='稳定性 —';cost.textContent='代价 —';status.textContent='调整组合，再开赛';start.disabled=false;show();renderHistory();}
  start.addEventListener('click',startRun);reset.addEventListener('click',resetAll);show();
})();
</script>
</body></html>
