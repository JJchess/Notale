<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>镶嵌，而非升级队列</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main{--lane:#edf3f8;}
  .page20{height:100%;display:flex;flex-direction:column;gap:12px}
  .question{padding:11px 18px;border-left:8px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-md) var(--r-md) 0;font-size:var(--fs-lead);font-weight:800;line-height:var(--lh-tight)}
  .gamebar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px}
  .instruction{font-size:var(--fs-sec);line-height:var(--lh-body);color:var(--muted)}
  .instruction strong{color:var(--text)}
  .actions{display:flex;align-items:center;gap:10px;flex:none}
  .actions button{min-width:88px;min-height:44px;font-size:var(--fs-sec)}
  .actions .primary{color:#fff;background:var(--primary);border-color:var(--primary)}
  .board-shell{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow-soft);overflow:hidden}
  #konvaBoard{position:absolute;inset:0;z-index:2}
  .board-labels{position:absolute;inset:0;z-index:3;pointer-events:none}
  .axis-label{position:absolute;top:8px;color:var(--muted);font-size:var(--fs-label);line-height:1.35}
  .axis-label.early{left:126px}.axis-label.late{right:24px}
  .tick-label{position:absolute;top:31px;transform:translateX(-50%);font-size:var(--fs-tick);line-height:1.35;color:var(--muted)}
  .lane-name{position:absolute;left:18px;width:74px;font-size:var(--fs-h2);font-weight:800;color:var(--primary-strong);line-height:1.35}
  .lane-note{position:absolute;right:18px;width:178px;font-size:var(--fs-sec);line-height:1.35;color:var(--muted)}
  .slot-label{position:absolute;top:54px;font-size:var(--fs-label);font-weight:700;color:var(--muted)}
  .slot-label.left{left:16px}.slot-label.right{right:18px}
  .focus-help{position:absolute;left:110px;bottom:7px;font-size:var(--fs-label);color:var(--muted)}
  #boardFocus{position:absolute;z-index:5;inset:0;background:transparent;cursor:grab}
  #boardFocus:focus-visible{outline:4px solid var(--focus);outline-offset:-5px}
  .status{min-height:25px;font-size:var(--fs-sec);line-height:1.45;color:var(--primary-strong);font-weight:700}
  .k-generalization.result{display:none;gap:8px}
  .k-generalization.result.show{display:grid}
  .k-generalization.result .claim{padding:10px 18px;font-size:var(--fs-lead)}
  .k-generalization.result .supports{--support-cols:4;padding-top:12px;gap:12px}
  .k-generalization.result .trunk{height:2px}
  .k-generalization.result .trunk::before,.k-generalization.result .support::before{height:12px;width:2px}
  .k-generalization.result .support{padding:8px 12px;font-size:var(--fs-sec);line-height:1.35}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body data-page="20" data-total="45">
<div id="stage">
<main id="main">
  <section class="page20 min0" aria-labelledby="gamePrompt">
    <div id="gamePrompt" class="question">八条证据会排成一条整齐、同步的“升级队列”吗？先把它们放回共同时间尺。</div>
    <div class="gamebar">
      <p class="instruction"><strong>拖动卡片到对应轨道。</strong> 横向表示年代；键盘可用 ↑↓ 选卡、←→ 移动。</p>
      <div class="actions"><button id="submit" class="primary">提交排序</button><button id="reset">重置</button></div>
    </div>
    <div class="board-shell no-pan min0" aria-label="四条特征年代轨道">
      <div id="konvaBoard" aria-hidden="true"></div>
      <div class="board-labels">
        <span class="axis-label early">更早</span><span class="axis-label late">更晚 →</span>
        <span class="tick-label" data-ma="6">600 万年前</span><span class="tick-label" data-ma="4">400 万年前</span><span class="tick-label" data-ma="2">200 万年前</span><span class="tick-label" data-ma="0">现在</span>
        <span class="slot-label left">待放卡槽</span><span class="slot-label right">待放卡槽</span>
        <span class="lane-name" data-row="0">腿</span><span class="lane-note" data-row="0">足迹与骨盆证据</span>
        <span class="lane-name" data-row="1">牙</span><span class="lane-note" data-row="1">犬齿与牙列证据</span>
        <span class="lane-name" data-row="2">手</span><span class="lane-note" data-row="2">骨形态与抓握证据</span>
        <span class="lane-name" data-row="3">脑</span><span class="lane-note" data-row="3">颅腔容量证据</span>
        <span class="focus-help">当前卡：<b id="activeName">早期双足证据</b></span>
      </div>
      <div id="boardFocus" role="application" tabindex="0" aria-label="排序舞台。当前卡为早期双足证据。上下方向键选择卡片，左右方向键移动，空格放入轨道。"></div>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">先放置全部八张卡片；提交后只会提示应更早或更晚。</div>
    <section id="result" class="k-generalization result" aria-label="四条证据支持的共同结论">
      <div class="claim">手、牙、腿和脑以不同节奏变化：人类身体是一组镶嵌，而不是同时升级的套装。</div>
      <div class="supports"><div class="trunk"></div>
        <div class="support"><strong>腿</strong>　双足证据很早，之后仍继续改变。</div>
        <div class="support"><strong>牙</strong>　牙齿变化没有等待脑容量增大。</div>
        <div class="support"><strong>手</strong>　可操作的手不是突然开启的开关。</div>
        <div class="support"><strong>脑</strong>　显著增大较晚，也不等于聪明程度。</div>
      </div>
    </section>
  </section>
</main>
</div>
<script src="assets/lib/konva.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:20,kicker:"MOSAIC EVOLUTION",title:"镶嵌，而非升级队列",take:"手、牙、腿和脑呈镶嵌式变化，“先站立再变聪明”也只是粗略摘要"});
(function(){
  var K=Lec.K, P=Lec.P;
  var constants={
    laetoliFootprintsAge:(K.laetoliFootprintsAge||3660000),
    afarensisAgeRange:(K.afarensisAgeRange||[3900000,2900000]),
    earliestHomoAge:(K.earliestHomoAge||K.evolution.genusHomoYearsAgo),
    homoSapiensAge:(K.homoSapiensAge||K.evolution.homoSapiensYearsAgo)
  };
  var events=[
    {name:"早期双足证据",row:0,age:constants.afarensisAgeRange[0],detail:"约390万—290万年前｜骨盆与股骨"},
    {name:"拉埃托利足迹",row:0,age:constants.laetoliFootprintsAge,detail:"约366万年前｜足迹；行为证据"},
    {name:"犬齿缩小",row:1,age:4500000,detail:"约450万年前起｜牙齿；范围有争议"},
    {name:"牙列持续改变",row:1,age:1800000,detail:"约180万年前后｜牙列；持续变化"},
    {name:"精细抓握形态",row:2,age:3200000,detail:"约320万年前｜手骨；能力非开关"},
    {name:"现代手部组合",row:2,age:1400000,detail:"约140万年前后｜手骨；仍非唯一起点"},
    {name:"脑容量明显增大",row:3,age:constants.earliestHomoAge,detail:"约280万年前后｜颅腔；较晚加速"},
    {name:"智人颅形范围",row:3,age:constants.homoSapiensAge,detail:"约30万年前｜颅骨；不等同智力"}
  ];
  var shell=document.querySelector('.board-shell'), host=document.getElementById('konvaBoard');
  var W=shell.clientWidth,H=shell.clientHeight, x0=110,x1=W-215, top=73,laneH=(H-105)/4;
  var stage=new Konva.Stage({container:host,width:W,height:H}); var layer=new Konva.Layer();stage.add(layer);
  var colors={line:Deck.token('--line'),primary:Deck.token('--primary'),soft:Deck.token('--primary-soft'),accent:Deck.token('--accent'),surface:Deck.token('--surface'),muted:Deck.token('--muted'),success:Deck.token('--success')};
  function xFor(age){return x0+P.mapTimeline(age,6000000,x1-x0)}
  function yFor(row){return top+row*laneH+laneH/2}
  for(var i=0;i<4;i++){layer.add(new Konva.Rect({x:x0,y:top+i*laneH,width:x1-x0,height:laneH-4,fill:i%2? '#f7f9fc':'#edf3f8',cornerRadius:8}));layer.add(new Konva.Line({points:[x0,yFor(i),x1,yFor(i)],stroke:colors.line,strokeWidth:2}));}
  [6,4,2,0].forEach(function(ma){var x=xFor(ma*1e6);layer.add(new Konva.Line({points:[x,50,x,H-28],stroke:colors.line,strokeWidth:1,dash:[4,5]}));var lab=document.querySelector('[data-ma="'+ma+'"]');lab.style.left=x+'px';});
  document.querySelectorAll('[data-row]').forEach(function(el){var r=+el.dataset.row;el.style.top=(yFor(r)-15)+'px';});
  var state={attempt:0,active:0,complete:false,cards:[]};
  function cardX(i){return i%2===0?18:W-204}
  events.forEach(function(e,i){var g=new Konva.Group({x:cardX(i),y:yFor(e.row)-22,draggable:true});var rect=new Konva.Rect({width:186,height:44,fill:colors.surface,stroke:colors.primary,strokeWidth:2,cornerRadius:9,shadowColor:'#17324d',shadowBlur:5,shadowOpacity:.12});var text=new Konva.Text({x:10,y:10,width:166,text:e.name,fontFamily:'sans-serif',fontSize:16,fontStyle:'bold',fill:colors.primary,align:'center'});g.add(rect,text);layer.add(g);state.cards.push({g:g,placed:false,hint:'',rect:rect,text:text});
    g.on('pointerdown',function(){state.active=i;syncActive()});
    g.on('dragend',function(){var p=g.position();g.x(Math.max(x0,Math.min(x1-186,p.x)));g.y(yFor(e.row)-22);state.cards[i].placed=true;renderCard(i);emitProgress('drag');});
  });
  function renderCard(i){var c=state.cards[i];c.rect.stroke(i===state.active?colors.accent:colors.primary);c.rect.strokeWidth(i===state.active?3:2);}
  function syncActive(){state.cards.forEach(function(_,i){renderCard(i)});document.getElementById('activeName').textContent=events[state.active].name;document.getElementById('boardFocus').setAttribute('aria-label','排序舞台。当前卡为'+events[state.active].name+'。上下方向键选择卡片，左右方向键移动，空格放入轨道。');layer.draw();}
  function emitProgress(action){document.dispatchEvent(new CustomEvent('game-progress',{bubbles:true,detail:{state:getState(),action:action,metrics:{placed:state.cards.filter(function(c){return c.placed}).length}}}));}
  function getState(){return {attempt:state.attempt,active:state.active,complete:state.complete,positions:state.cards.map(function(c){return {x:P.roundTo(c.g.x(),0),placed:c.placed}})}}
  function finish(){state.complete=true;events.forEach(function(e,i){var c=state.cards[i],tx=xFor(e.age)-93;c.g.to({x:Math.max(x0,Math.min(x1-186,tx)),duration:Deck.reduced()?0:.35});c.text.text(e.name+'\n'+e.detail);c.text.y(5);c.text.fontSize(14);c.rect.height(60);c.g.y(yFor(e.row)-30);c.g.draggable(false);});
    layer.add(new Konva.Line({points:[xFor(5000000),yFor(0),xFor(3800000),yFor(1),xFor(2600000),yFor(2),xFor(1400000),yFor(3)],stroke:colors.accent,strokeWidth:3,dash:[9,7],opacity:.65}));layer.draw();
    document.getElementById('result').classList.add('show');document.getElementById('status').textContent='虚线是假想的“同步升级队列”；真实证据彼此错开、重叠，并在各轨道内持续变化。';document.getElementById('submit').disabled=true;
    document.dispatchEvent(new CustomEvent('game-complete',{bubbles:true,detail:{score:Math.max(1,3-state.attempt),metrics:{attempts:state.attempt},trace:getState()}}));
  }
  document.getElementById('submit').onclick=function(){if(state.complete)return;var missing=state.cards.filter(function(c){return !c.placed}).length;if(missing){document.getElementById('status').textContent='还有 '+missing+' 张卡片未放入时间尺。';return}state.attempt++;var wrong=0;events.forEach(function(e,i){var dx=state.cards[i].g.x()+93-xFor(e.age);var hint=Math.abs(dx)<90?'接近':(dx>0?'应更早':'应更晚');state.cards[i].hint=hint;if(hint!=='接近')wrong++;state.cards[i].text.text(e.name+(hint==='接近'?' ✓':' · '+hint));});layer.draw();if(!wrong||state.attempt>=2)finish();else document.getElementById('status').textContent='第 1 次提示：卡片已标出“应更早／应更晚”。调整后再提交。';emitProgress('submit')};
  function reset(){state.attempt=0;state.active=0;state.complete=false;document.getElementById('result').classList.remove('show');document.getElementById('submit').disabled=false;document.getElementById('status').textContent='先放置全部八张卡片；提交后只会提示应更早或更晚。';layer.destroyChildren();location.reload();}
  document.getElementById('reset').onclick=reset;
  document.getElementById('boardFocus').addEventListener('keydown',function(ev){if(state.complete)return;if(ev.key==='ArrowUp'||ev.key==='ArrowDown'){ev.preventDefault();state.active=(state.active+(ev.key==='ArrowDown'?1:7))%8;syncActive();return}if(ev.key==='ArrowLeft'||ev.key==='ArrowRight'){ev.preventDefault();var c=state.cards[state.active];c.x=Math.max(x0,Math.min(x1-186,c.g.x()+(ev.key==='ArrowRight'?35:-35)));c.g.x(c.x);c.g.y(yFor(events[state.active].row)-22);c.placed=true;layer.draw();emitProgress('key-move')}if(ev.key===' '){ev.preventDefault();var c2=state.cards[state.active];c2.placed=true;c2.g.x(Math.max(x0,Math.min(x1-186,c2.g.x())));layer.draw();}});
  syncActive();layer.draw();
  window.mosaicGame={start:function(){document.getElementById('boardFocus').focus();document.dispatchEvent(new CustomEvent('game-start',{bubbles:true}))},reset:reset,getState:getState,complete:finish};
})();
</script>
</body>
</html>
