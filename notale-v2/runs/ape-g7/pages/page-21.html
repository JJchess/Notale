<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>骨盆不是只为一件事而形成</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .p21 { height:100%; display:flex; flex-direction:column; gap:16px; }
  .intro { display:flex; justify-content:space-between; align-items:flex-start; gap:32px; }
  .intro-copy { max-width:920px; }
  .intro-copy strong { color:var(--primary-strong); }
  .workbench { position:relative; flex:1 1 0; display:flex; gap:24px; min-height:0; }
  .relation-lines { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .workbench > section { position:relative; z-index:1; }
  .model-panel { flex:0 0 800px; display:flex; flex-direction:column; gap:12px; padding:18px; }
  .model-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  .model-head .note { max-width:300px; text-align:right; }
  .model-wrap { position:relative; flex:1 1 0; min-height:0; overflow:hidden; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface-soft); }
  #konvaHost { position:absolute; inset:0; }
  .diagram-label { position:absolute; z-index:2; padding:4px 8px; color:var(--primary-strong); background:rgb(255 255 255 / 90%); border:1px solid var(--line); border-radius:var(--r-sm); font-size:var(--fs-label); line-height:var(--lh-tight); pointer-events:none; }
  .lab-bone { left:18px; top:18px; }
  .lab-channel { left:230px; top:22px; }
  .lab-object { right:18px; bottom:18px; }
  .controls { display:flex; align-items:center; gap:14px; min-height:48px; }
  .controls label { font-size:var(--fs-label); font-weight:750; color:var(--muted); }
  #shapeRange { flex:1; min-width:220px; }
  .edge-word { min-width:36px; color:var(--muted); font-size:var(--fs-label); text-align:center; }
  #resetBtn { min-width:72px; min-height:44px; }
  .compare-side { flex:1 1 0; display:flex; flex-direction:column; gap:12px; min-width:0; }
  .k-comparison { --comparison-cols:170px repeat(2,minmax(0,1fr)); flex:1 1 0; }
  .k-comparison > * { display:flex; align-items:center; justify-content:center; }
  .k-comparison .dim { justify-content:flex-end; }
  .cell { flex-direction:column; gap:7px; font-size:var(--fs-body); font-weight:800; line-height:var(--lh-body); text-align:center; color:var(--primary-strong); background:var(--primary-soft); }
  .cell.complex-cell { background:var(--accent-soft); }
  .direction { font-size:var(--fs-body); font-weight:800; color:var(--primary-strong); }
  .meter { width:100%; max-width:150px; height:9px; overflow:hidden; background:var(--surface-muted); border-radius:999px; }
  .meter > i { display:block; height:100%; width:50%; border-radius:inherit; background:var(--primary); transition:width .16s ease; }
  .complex i { background:var(--accent); }
  .conclusion { padding:12px 18px; border-left:7px solid var(--accent); background:var(--accent-soft); border-radius:0 var(--r-md) var(--r-md) 0; font-size:var(--fs-lead); font-weight:800; line-height:var(--lh-body); }
  .conclusion span { display:block; font-size:var(--fs-sec); font-weight:400; }
  .prompt { color:var(--muted); font-size:var(--fs-sec); line-height:var(--lh-body); }
  @media (prefers-reduced-motion: reduce) { .meter > i { transition:none; } }
</style>
</head>
<body data-page="21" data-total="45">
<div id="stage">
<main id="main">
  <section class="p21" aria-label="骨盆多重约束交互">
    <div class="intro">
      <p class="lead intro-copy">骨盆同时参与<strong>步行、承托和分娩</strong>，不是只服务于其中一项。拖动通道形态，逐行比较同一次改变带来的后果。</p>
      <p class="note">教学示意：只表达变化方向，不用于个体诊断。</p>
    </div>

    <div class="workbench">
      <svg class="relation-lines" viewBox="0 0 1408 500" preserveAspectRatio="none" aria-hidden="true">
        <path d="M785 250 H825" fill="none" stroke="#8799ae" stroke-width="4"/>
        <path d="M825 250 l-14 -10 v20 z" fill="#8799ae"/>
      </svg>
      <section class="panel model-panel min0" aria-labelledby="modelTitle">
        <div class="model-head">
          <h2 id="modelTitle">横剖面模型</h2>
          <p class="note">通过对象大小保持不变</p>
        </div>
        <div class="model-wrap no-pan" role="img" aria-label="骨盆横剖面、中央通道与通过对象的动态示意">
          <div id="konvaHost" aria-hidden="true"></div>
          <span class="diagram-label lab-bone">骨性轮廓</span>
          <span class="diagram-label lab-channel">分娩通道</span>
          <span class="diagram-label lab-object">通过对象</span>
        </div>
        <div class="controls ctl">
          <label for="shapeRange">通道形态</label>
          <span class="edge-word">收拢</span>
          <input id="shapeRange" type="range" min="0" max="100" value="50" step="1" aria-describedby="shapeHelp">
          <span class="edge-word">展开</span>
          <button id="resetBtn" type="button">复位</button>
        </div>
        <p id="shapeHelp" class="prompt">停在任一位置，比较三项是否会一起“变好”。</p>
      </section>

      <section class="compare-side min0" aria-labelledby="compareTitle">
        <h2 id="compareTitle">同一调节，三项约束同步受影响</h2>
        <div class="k-comparison" aria-live="polite">
          <div class="hdr">约束</div><div class="hdr">相对收拢</div><div class="hdr">相对展开</div>
          <div class="rowline"></div>
          <div class="dim">分娩通过</div>
          <div class="cell">可用空间趋小<span class="meter"><i id="birthNarrow"></i></span></div>
          <div class="cell diff">可用空间趋大<span class="meter"><i id="birthWide"></i></span></div>
          <div class="rowline"></div>
          <div class="dim">躯干与盆底支撑</div>
          <div class="cell complex-cell">关系复杂<span class="meter complex"><i id="supportNarrow"></i></span></div>
          <div class="cell complex-cell">关系复杂<span class="meter complex"><i id="supportWide"></i></span></div>
          <div class="rowline"></div>
          <div class="dim">双足步行</div>
          <div class="cell complex-cell">稳定与代价可能改变<span class="meter complex"><i id="walkNarrow"></i></span></div>
          <div class="cell complex-cell">稳定与代价可能改变<span class="meter complex"><i id="walkWide"></i></span></div>
        </div>
        <p class="conclusion">改变一个结构，会同时牵动多项功能。<span>演化结果常是多重约束下可行的折中，而不是完美设计。</span></p>
      </section>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/konva.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 21,
  kicker: "TRADE-OFFS",
  title: "骨盆不是只为一件事而形成",
  take: "骨盆承担步行、支撑与分娩等多重约束，演化结果常是折中"
});

(function () {
  var host = document.getElementById('konvaHost');
  var range = document.getElementById('shapeRange');
  var stage = new Konva.Stage({ container: 'konvaHost', width: host.clientWidth, height: host.clientHeight });
  var layer = new Konva.Layer();
  stage.add(layer);
  var leftBone = new Konva.Line({ closed:true, fill:'#dbeeff', stroke:'#145da0', strokeWidth:5, tension:.35 });
  var rightBone = new Konva.Line({ closed:true, fill:'#dbeeff', stroke:'#145da0', strokeWidth:5, tension:.35 });
  var passage = new Konva.Ellipse({ stroke:'#d86b2b', strokeWidth:4, dash:[10,7], fill:'rgba(255,240,228,.72)' });
  var object = new Konva.Circle({ radius:41, fill:'#fff', stroke:'#53657a', strokeWidth:4 });
  var axis = new Konva.Line({ stroke:'#8799ae', strokeWidth:2, dash:[5,7] });
  layer.add(axis, passage, leftBone, rightBone, object);

  function pct(n) { return Lec.P.percent(Lec.P.clamp(n, 0, 1)); }
  function setWidth(id, n) { document.getElementById(id).style.width = pct(n); }
  function draw() {
    var w = host.clientWidth, h = host.clientHeight;
    stage.size({width:w, height:h});
    var t = Lec.P.clamp(Number(range.value) / 100, 0, 1);
    var cx = w / 2, cy = h / 2 + 8;
    var gap = 72 + t * 78;
    var outer = Math.min(215, w * .38);
    leftBone.points([cx-gap/2,cy-105, cx-outer,cy-126, cx-outer-20,cy-35, cx-outer+20,cy+88, cx-gap/2,cy+112, cx-gap/2-25,cy+38]);
    rightBone.points([cx+gap/2,cy-105, cx+outer,cy-126, cx+outer+20,cy-35, cx+outer-20,cy+88, cx+gap/2,cy+112, cx+gap/2+25,cy+38]);
    passage.position({x:cx,y:cy}); passage.radiusX(gap*.58); passage.radiusY(92 + t*8);
    object.position({x:cx,y:cy});
    axis.points([cx,cy-126,cx,cy+126]);
    setWidth('birthNarrow', 1-t); setWidth('birthWide', t);
    setWidth('supportNarrow', .58 - .16*t); setWidth('supportWide', .42 + .14*t);
    setWidth('walkNarrow', .48 + .12*(1-t)); setWidth('walkWide', .48 + .12*t);
    layer.batchDraw();
  }
  range.addEventListener('input', draw);
  document.getElementById('resetBtn').addEventListener('click', function(){ range.value = 50; draw(); range.focus(); });
  var offResize = Deck.onResize(draw);
  window.addEventListener('pagehide', function(){ offResize(); stage.destroy(); }, {once:true});
  draw();
})();
</script>
</body>
</html>
