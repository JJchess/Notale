<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>传着传着，变了</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .p25{height:100%;display:flex;flex-direction:column;gap:12px}
  .sim-head{min-height:48px;box-sizing:border-box;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
  .sim-head .ctl{flex:0 0 auto}
  .seed{padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-soft);color:var(--muted)}
  .chain-panel{position:relative;height:330px;flex:0 0 330px;padding:12px 18px;display:flex;flex-direction:column;gap:4px}.lane-bg{position:absolute;left:18px;right:18px;height:50px;border:1px solid var(--line);border-radius:var(--r-sm);background:#f8fafc;pointer-events:none}.lane-a{top:39px}.lane-b{top:117px}#chains,.chain-panel .note{position:relative;z-index:1}
  #chains{display:block;width:100%;height:266px;overflow:visible}
  #chains text{font-family:var(--font-sans)}
  .chain-label{font-size:16px;font-weight:750;fill:var(--primary-strong)}
  .gen-label{font-size:14px;fill:var(--muted)}
  .node-main{font-size:16px;font-weight:750;fill:var(--text)}
  .node-sub{font-size:14px;fill:var(--muted)}
  .legend{justify-content:flex-end}
  .legend .improve{background:var(--success)}
  .legend .simplify{background:var(--accent)}
  .legend .replace{background:var(--primary)}
  .compare-wrap{display:flex;gap:14px;align-items:stretch;min-height:0}
  .k-comparison{flex:1;--comparison-cols:170px repeat(2,minmax(0,1fr))}
  .k-comparison > *{padding:4px 12px}
  .k-comparison .hdr{font-size:18px}
  .k-comparison .dim{font-size:16px;display:flex;align-items:center;justify-content:flex-end}
  .cell{font-size:16px;line-height:1.4;display:flex;align-items:center}
  .summary{width:360px;box-sizing:border-box;padding:12px 16px;background:var(--primary-soft);border-left:6px solid var(--primary);border-radius:0 var(--r-md) var(--r-md) 0;display:flex;flex-direction:column;gap:8px}.end-title{font-size:18px;font-weight:750;color:var(--primary-strong)}.end-row{display:grid;grid-template-columns:74px 1fr 1fr;gap:6px;font-size:16px;line-height:1.4}.end-row strong{color:var(--primary-strong)}.end-note{font-size:16px;line-height:1.4;font-weight:700;border-top:1px solid var(--line);padding-top:7px}
  button{min-height:44px}
  button:disabled{cursor:default;opacity:.55}
  @media (prefers-reduced-motion:reduce){#chains *{transition:none!important}}
</style>
</head>
<body data-page="25" data-total="45">
<div id="stage">
<main id="main">
  <section class="p25 min0" aria-label="文化传递模拟与比较">
    <div class="sim-head">
      <div class="ctl">
        <button id="run" type="button">运行传话链</button>
        <button id="reset" type="button">重置并重放同一种子</button>
        <span class="seed label">固定种子：page-25</span>
        <span id="settings" class="label muted"></span>
      </div>
      <div class="legend" aria-label="变化类型图例">
        <span><i class="swatch improve"></i>改进</span>
        <span><i class="swatch simplify"></i>简化</span>
        <span><i class="swatch replace"></i>随机替换</span>
      </div>
    </div>

    <div class="panel chain-panel min0">
      <div class="lane-bg lane-a" aria-hidden="true"></div><div class="lane-bg lane-b" aria-hidden="true"></div>
      <svg id="chains" role="img" aria-labelledby="chart-title chart-desc" viewBox="0 0 1368 174" preserveAspectRatio="none">
        <title id="chart-title">同一初始方案的两条逐代传递链</title>
        <desc id="chart-desc">上链包含定向修改偏向，下链只有随机复制误差；每一列代表同一代。</desc>
      </svg>
      <p id="status" class="note" aria-live="polite">两条链从同一套 8 步方案出发。点击运行，逐代比较变化方向。</p>
    </div>

    <div class="compare-wrap min0">
      <div class="k-comparison min0" aria-label="有方向的改变与无方向漂变逐维比较">
        <div class="hdr">比较维度</div><div class="hdr">有方向的改变</div><div class="hdr">无方向的漂变</div>
        <div class="rowline"></div>
        <div class="dim">改变来源</div><div class="cell diff">试用后的定向修改</div><div class="cell">无方向复制误差</div>
        <div class="rowline"></div>
        <div class="dim">局部结果</div><div class="cell">表现提高或步骤减少</div><div class="cell">中性、变差或偶然变好</div>
        <div class="rowline"></div>
        <div class="dim">跨代轨迹</div><div class="cell">某些修改连续保留</div><div class="cell">变体随机扩散或消失</div>
        <div class="rowline"></div>
        <div class="dim">可否预言终点</div><div class="cell">只能描述偏向</div><div class="cell diff">连方向也无法预先确定</div>
      </div>
      <div class="summary" aria-label="两条传递链末端比较">
        <div class="end-title">末端并列比较</div>
        <div class="end-row"><span>链条</span><strong>定向链</strong><strong>漂变链</strong></div>
        <div class="end-row"><span>复杂度</span><span id="dirSteps">待运行</span><span id="driftSteps">待运行</span></div>
        <div class="end-row"><span>任务表现</span><span id="dirScore">待运行</span><span id="driftScore">待运行</span></div>
        <div class="end-note">“后来更常见”不等于“它一定更好”。</div>
      </div>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index:25,
  kicker:"CULTURAL DRIFT",
  title:"传着传着，变了",
  take:"文化传递既会累积改进，也会产生偏差、简化与偶然漂变。"
});

(function(){
  var generations=Number(Lec.K.transmissionGenerations);
  var errorRate=Number(Lec.K.transmissionErrorRate);
  var simplifyBias=Number(Lec.K.simplificationBias);
  var improveRate=Number(Lec.K.improvementRate);
  if(!Number.isFinite(generations)) generations=6;
  if(!Number.isFinite(errorRate)) errorRate=0.28;
  if(!Number.isFinite(simplifyBias)) simplifyBias=0.30;
  if(!Number.isFinite(improveRate)) improveRate=0.34;
  var total=Math.max(3,Math.round(generations));
  document.getElementById('settings').textContent=total+' 代 · 误差 '+Lec.P.percent(errorRate)+' · 简化偏向 '+Lec.P.percent(simplifyBias);

  var svg=d3.select('#chains'), W=1368, left=155, right=48;
  var x=d3.scalePoint().domain(d3.range(total+1)).range([left,W-right]);
  var colors={improve:'#247a55',simplify:'#d86b2b',replace:'#145da0',base:'#8799ae'};
  var runBtn=document.getElementById('run'), resetBtn=document.getElementById('reset'), status=document.getElementById('status');
  var timer=null;

  function makeData(){
    var rng=new Math.seedrandom('page-25');
    var directed=[{gen:0,steps:8,score:58,type:'base'}];
    var drift=[{gen:0,steps:8,score:58,type:'base'}];
    for(var i=1;i<=total;i++){
      var prev=directed[i-1], r=rng(), type='replace', steps=prev.steps, score=prev.score;
      if(r<improveRate){type='improve';score+=4+Math.floor(rng()*5)}
      else if(r<improveRate+simplifyBias){type='simplify';steps=Math.max(3,steps-1);score+=1+Math.floor(rng()*3)}
      else {score+=Math.floor(rng()*5)-2}
      directed.push({gen:i,steps:steps,score:Math.max(30,Math.min(95,score)),type:type});
      prev=drift[i-1]; r=rng(); steps=prev.steps; score=prev.score;
      if(r<errorRate){type='replace';steps=Math.max(3,Math.min(11,steps+(rng()<.5?-1:1)));score+=Math.floor(rng()*9)-4}
      else {type='replace';score+=Math.floor(rng()*3)-1}
      drift.push({gen:i,steps:steps,score:Math.max(30,Math.min(95,score)),type:type});
    }
    return {directed:directed,drift:drift};
  }
  var data=makeData();

  function draw(limit){
    svg.selectAll('*:not(title):not(desc)').remove();
    var ys=[54,132], chains=[data.directed,data.drift], names=['有方向的改变','无方向的漂变'];
    d3.range(total+1).forEach(function(i){
      svg.append('text').attr('class','gen-label').attr('x',x(i)).attr('y',14).attr('text-anchor','middle').text(i===0?'初始':'第 '+i+' 代');
    });
    chains.forEach(function(chain,row){
      svg.append('text').attr('class','chain-label').attr('x',4).attr('y',ys[row]+5).text(names[row]);
      var shown=chain.slice(0,limit+1);
      svg.append('path').datum(chain).attr('fill','none').attr('stroke','#dfe8f2').attr('stroke-width',3).attr('stroke-dasharray','7 7')
        .attr('d',d3.line().x(function(d){return x(d.gen)}).y(function(){return ys[row]}));
      svg.selectAll('.placeholder'+row).data(chain.slice(1)).join('circle').attr('cx',function(d){return x(d.gen)}).attr('cy',ys[row]).attr('r',22).attr('fill','#f8fafc').attr('stroke','#c7d3e1').attr('stroke-width',2);
      svg.selectAll('.pending'+row).data(chain.slice(limit+1)).join('text').attr('class','gen-label').attr('text-anchor','middle').attr('x',function(d){return x(d.gen)}).attr('y',ys[row]+5).text('待传');
      svg.append('path').datum(shown).attr('fill','none').attr('stroke','#c7d3e1').attr('stroke-width',4)
        .attr('d',d3.line().x(function(d){return x(d.gen)}).y(function(){return ys[row]}));
      var typeName={improve:'改进',simplify:'简化',replace:'替换'};
      svg.selectAll('.change'+row).data(shown.slice(1)).join('text')
        .attr('class','gen-label').attr('text-anchor','middle')
        .attr('x',function(d){return (x(d.gen-1)+x(d.gen))/2})
        .attr('y',ys[row]-27).attr('fill',function(d){return colors[d.type]})
        .text(function(d){return typeName[d.type]});
      var node=svg.selectAll('.n'+row).data(shown).join('g').attr('transform',function(d){return 'translate('+x(d.gen)+','+ys[row]+')'});
      node.append('circle').attr('r',22).attr('fill',function(d){return d.gen===0?'#eaf1f8':colors[d.type]}).attr('stroke','#fff').attr('stroke-width',3);
      node.append('text').attr('class','node-main').attr('text-anchor','middle').attr('dy','0.35em').attr('fill',function(d){return d.gen===0?'#172033':'#fff'}).text(function(d){return d.steps});
      node.append('text').attr('class','node-sub').attr('text-anchor','middle').attr('y',35).text(function(d){return '表现 '+Lec.P.roundTo(d.score,0)});
    });
  }
  function showEnds(show){
    var a=data.directed[total],b=data.drift[total];
    document.getElementById('dirSteps').textContent=show?a.steps+' 步':'待运行';
    document.getElementById('driftSteps').textContent=show?b.steps+' 步':'待运行';
    document.getElementById('dirScore').textContent=show?Lec.P.roundTo(a.score,0)+' 分':'待运行';
    document.getElementById('driftScore').textContent=show?Lec.P.roundTo(b.score,0)+' 分':'待运行';
  }
  function stop(){if(timer){clearInterval(timer);timer=null} runBtn.disabled=false}
  function play(){
    stop(); draw(0); runBtn.disabled=true; var i=0;
    if(Deck.reduced()){draw(total);showEnds(true);status.textContent='同一种子已生成 '+total+' 代结果：上下链终点不同，但单次结果不能证明必然进步。';runBtn.disabled=false;return}
    timer=setInterval(function(){i++;draw(i);status.textContent='正在传到第 '+i+' 代：同一列表示同一次传递。';if(i>=total){stop();showEnds(true);status.textContent='末端已对齐：有偏向不等于终点可预言，随机漂变也可能偶然变好。'}},320);
  }
  runBtn.addEventListener('click',play);
  resetBtn.addEventListener('click',function(){stop();data=makeData();draw(0);showEnds(false);status.textContent='已回到同一初始方案；再次运行会得到完全相同的传递路径。'});
  draw(0);
})();
</script>
</body>
</html>
