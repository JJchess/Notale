<body data-page="28" data-total="45">
<div id="stage">
<main id="main">
  <section class="p28">
    <div class="p28-head">
      <div><h1>一击为什么会剥下一片？</h1><p class="lead">在同一石核上校准三个输入，观察冲击怎样沿近似路径传播。</p></div>
      <p class="approx">教学近似，不是材料断裂预测</p>
    </div>
    <div class="k-process flow axis" aria-label="断裂过程">
      <div class="step is-current" data-step="0"><span class="n">01</span><span>选打击点</span></div><span class="arw"></span>
      <div class="step" data-step="1"><span class="n">02</span><span>调入射角</span></div><span class="arw"></span>
      <div class="step" data-step="2"><span class="n">03</span><span>设定力度</span></div><span class="arw"></span>
      <div class="step" data-step="3"><span class="n">04</span><span>落锤碰撞</span></div><span class="arw"></span>
      <div class="step" data-step="4"><span class="n">05</span><span>裂纹传播</span></div><span class="arw"></span>
      <div class="step" data-step="5"><span class="n">06</span><span>剥离或失败</span></div>
    </div>
    <div class="workbench">
      <div class="scene no-pan" id="scene"><canvas id="sim" class="cv-fill" aria-label="石核侧视断裂近似模拟"></canvas><span class="scene-tag">淡色线：上一击轮廓　实线箭头：冲击方向　虚线：近似裂纹</span><span class="model-region input" aria-hidden="true"></span><span class="model-region path" aria-hidden="true"></span><span class="local-note a"><strong>打击点</strong>改变冲击进入石核的位置</span><span class="local-note b"><strong>入射角</strong>改变能量传入的方向</span><span class="local-note c"><strong>力度</strong>过小不剥离，过大则碎裂</span><span class="hit-label">先沿石核边缘选择打击点，再调角度</span></div>
      <aside class="result" aria-live="polite">
        <h2>本次结果</h2><div class="verdict" id="verdict">等待敲击</div>
        <p class="feedback" id="feedback">目标：形成连续石片，同时避免力度过大导致碎裂。</p>
        <h2>尝试轨迹</h2><ul class="trace" id="trace"><li><span>尚无记录</span><span>—</span></li></ul>
        <p class="goal">打击点、角度与力度共同决定结果。知道规则不等于立刻会做；稳定结果需要反复校准动作。</p>
      </aside>
      <div class="controls">
        <div class="ctl"><label for="point">打击点</label><input id="point" type="range" min="0" max="100" value="46" aria-label="沿边缘选择打击点"><output class="meter" id="pointOut">边缘中段</output></div>
        <div class="ctl"><label for="angle">入射角</label><input id="angle" type="range" min="0" max="100" value="48"><output class="meter" id="angleOut">48%</output></div>
        <button class="power" id="strike">按住蓄力</button><output class="meter" id="powerOut">力度 0%</output>
        <button class="reset" id="reset">重置</button>
      </div>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/matter.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:28,kicker:"MAKING BY DOING",title:"一击为什么会剥下一片？",take:"打击点、角度与力度共同决定石片是否剥离；稳定结果来自反复校准动作。"});
(function(){
  var P=Lec.P,K=Lec.K;
  var cfg={angles:K.p28StrikeAngleRange,forces:K.p28ForceRange,zones:K.p28EdgeZones,thresholds:K.p28FractureThresholds};
  var cv=document.getElementById('sim'),scene=document.getElementById('scene'),point=document.getElementById('point'),angle=document.getElementById('angle');
  var verdict=document.getElementById('verdict'),feedback=document.getElementById('feedback'),traceEl=document.getElementById('trace'),powerOut=document.getElementById('powerOut');
  var engine=Matter.Engine.create({gravity:{x:0,y:0.8}}),hammer=null,flake=null,holding=false,holdStart=0,phase=0,anim=0,lastShape=null,trace=[];
  function bounds(v,a,b){if(Array.isArray(v))return [Number(v[0]),Number(v[1])];if(v&&typeof v==='object')return [Number(v.min),Number(v.max)];return [a,b]}
  var ar=bounds(cfg.angles,20,80),fr=bounds(cfg.forces,0,100);
  function pct(n){try{return P.percent(n/100)}catch(e){return P.roundTo(n,0)+'%'}}
  function mapped(el,range){return range[0]+(range[1]-range[0])*Number(el.value)/100}
  function zoneName(v){var names=Array.isArray(cfg.zones)?cfg.zones:['边缘上段','边缘中段','边缘下段'];return names[Math.min(names.length-1,Math.floor(Number(v)/101*names.length))]||'边缘'}
  function setPhase(n){phase=n;document.querySelectorAll('.flow .step').forEach(function(el,i){el.classList.toggle('is-current',i===n);el.classList.toggle('is-done',i<n)})}
  function updateLabels(){document.getElementById('pointOut').textContent=zoneName(point.value);document.getElementById('angleOut').textContent=pct(Number(angle.value));setPhase(document.activeElement===angle?1:0);draw()}
  point.addEventListener('input',updateLabels);angle.addEventListener('input',updateLabels);
  function thresholds(){var t=cfg.thresholds||{};return {min:Number(t.minForce||t.min||34),max:Number(t.maxForce||t.max||78),angle:Number(t.angleTolerance||t.angle||24),point:Number(t.edgeTolerance||t.point||30)}}
  function assess(pow){var t=thresholds(),p=Number(point.value),a=Number(angle.value),fit=Math.abs(p-46)+Math.abs(a-48);if(pow>t.max)return ['碎裂','力度过大，裂纹分散；降低力度再校准。','danger'];if(pow<t.min)return ['未剥离','冲击不足以让裂纹连续传播；略增力度。','warning'];if(fit>(t.angle+t.point))return ['未剥离','打击点与入射方向没有形成连续裂纹；调整二者。','warning'];return ['连续石片','裂纹连续到达外缘，石片剥离。','success']}
  function strike(pow){setPhase(3);var r=assess(pow);anim=1;lastShape={point:Number(point.value),angle:Number(angle.value),power:pow,result:r[0]};hammer=Matter.Bodies.circle(170,35,20,{restitution:.2});Matter.Body.setVelocity(hammer,{x:7,y:8});Matter.Composite.add(engine.world,hammer);setTimeout(function(){setPhase(4)},Deck.reduced()?0:220);setTimeout(function(){setPhase(5);verdict.textContent=r[0];verdict.className='verdict is-'+r[2];feedback.textContent=r[1];trace.unshift({n:trace.length+1,r:r[0],p:pct(pow)});trace=trace.slice(0,4);traceEl.innerHTML=trace.map(function(x){return '<li><span>第 '+x.n+' 击 · '+x.r+'</span><span>'+x.p+'</span></li>'}).join('');if(r[0]==='连续石片'){flake=Matter.Bodies.polygon(720,300,5,34,{restitution:.3});Matter.Composite.add(engine.world,flake)}},Deck.reduced()?0:520)}
  var btn=document.getElementById('strike');function begin(){if(holding)return;holding=true;holdStart=performance.now();btn.classList.add('is-holding');btn.textContent='释放敲击';setPhase(2)}function end(){if(!holding)return;holding=false;btn.classList.remove('is-holding');btn.textContent='按住蓄力';var ms=P.clamp(performance.now()-holdStart,0,1400),pow=P.clamp(P.roundTo(ms/14,0),0,100);powerOut.textContent='力度 '+pct(pow);strike(pow)}
  btn.addEventListener('pointerdown',begin);btn.addEventListener('pointerup',end);btn.addEventListener('pointercancel',end);btn.addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();begin()}});btn.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();end()}});
  function reset(){Matter.Composite.clear(engine.world,false);hammer=flake=null;trace=[];lastShape=null;verdict.textContent='等待敲击';verdict.className='verdict';feedback.textContent='目标：形成连续石片，同时避免力度过大导致碎裂。';traceEl.innerHTML='<li><span>尚无记录</span><span>—</span></li>';powerOut.textContent='力度 0%';setPhase(0);draw()}
  document.getElementById('reset').addEventListener('click',reset);
  function draw(){var ctx=Deck.fit(cv),w=cv.offsetWidth,h=cv.offsetHeight;if(!w||!h)return;ctx.clearRect(0,0,w,h);var hitY=145+Number(point.value)*1.9,ang=(-35+Number(angle.value)*.7)*Math.PI/180;
    if(lastShape){ctx.strokeStyle=Deck.rgba('--line-strong',.35);ctx.lineWidth=5;ctx.setLineDash([10,9]);ctx.beginPath();ctx.moveTo(290,110);ctx.quadraticCurveTo(650,80,820,210);ctx.lineTo(770,390);ctx.quadraticCurveTo(520,430,270,350);ctx.closePath();ctx.stroke();ctx.setLineDash([])}
    ctx.fillStyle='#8796a3';ctx.strokeStyle='#43566a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(290,110);ctx.quadraticCurveTo(650,80,820,210);ctx.lineTo(770,390);ctx.quadraticCurveTo(520,430,270,350);ctx.closePath();ctx.fill();ctx.stroke();
    var hx=300,hy=hitY;ctx.fillStyle=Deck.token('--accent');ctx.beginPath();ctx.arc(hx,hy,10,0,Math.PI*2);ctx.fill();Deck.arrow(ctx,hx-115*Math.cos(ang),hy-115*Math.sin(ang),hx,hy,12);ctx.strokeStyle=Deck.token('--accent');ctx.lineWidth=5;ctx.stroke();
    if(lastShape){ctx.strokeStyle=lastShape.result==='连续石片'?Deck.token('--success'):Deck.token('--danger');ctx.lineWidth=5;ctx.setLineDash([12,8]);ctx.beginPath();ctx.moveTo(hx,hy);ctx.quadraticCurveTo(430,hy+55,620,350);ctx.stroke();ctx.setLineDash([])}
    Matter.Engine.update(engine,16);[hammer,flake].forEach(function(b){if(!b)return;ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);ctx.fillStyle=b===hammer?'#71533c':Deck.token('--accent');ctx.beginPath();if(b===hammer)ctx.arc(0,0,20,0,Math.PI*2);else{ctx.moveTo(-30,-20);ctx.lineTo(38,-8);ctx.lineTo(22,30);ctx.lineTo(-20,22);ctx.closePath()}ctx.fill();ctx.restore()})}
  Deck.autofit(cv,draw);Deck.loop(function(){if(holding){var p=P.clamp(P.roundTo((performance.now()-holdStart)/14,0),0,100);powerOut.textContent='力度 '+pct(p)}if(hammer||flake)draw()},{still:1});
  updateLabels();
})();
</script>
