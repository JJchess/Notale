<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>把创新年代压到同一把尺上</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .time-page{height:100%;display:flex;flex-direction:column;gap:14px}
  .intro{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
  .intro p{max-width:820px}
  .scale-control{width:500px;padding:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
  .scale-control input{width:300px;min-height:44px}
  .ends{display:flex;justify-content:space-between;color:var(--muted);font-size:var(--fs-label)}
  .timeline-compare{--comparison-cols:180px minmax(0,1fr) minmax(0,1fr);flex:1;grid-template-rows:52px repeat(4,1fr)}
  .timeline-compare>div{display:flex;align-items:center}
  .timeline-compare .hdr{justify-content:center}
  .timeline-compare .dim{justify-content:flex-end;flex-direction:column;align-items:flex-end}
  .era-name{font-size:var(--fs-sec);font-weight:750;color:var(--text)}
  .era-span{font-size:var(--fs-label);font-weight:500;color:var(--muted)}
  .bandcell{position:relative;padding:6px 16px!important;background-image:repeating-linear-gradient(90deg,transparent 0,transparent 11.8%,var(--surface-soft) 12%,transparent 12.2%)}
  .dom-track{position:absolute;z-index:0;left:24px;right:24px;top:25px;height:20px;background:var(--surface-muted);border:1px solid var(--line);border-radius:var(--r-sm)}
  .bandcell svg{width:100%;height:58px;overflow:visible}
  .axis-label{font-size:14px;fill:var(--muted)}
  .event-label{font-size:14px;fill:var(--text);font-weight:650}
  .summary{display:flex;align-items:center;gap:20px;padding:10px 18px;border-left:6px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-md) var(--r-md) 0}
  .summary strong{font-size:var(--fs-lead);color:#7a3512;white-space:nowrap}
  .summary span{font-size:var(--fs-sec);line-height:var(--lh-body)}
</style>
</head>
<body data-page="32" data-total="45">
<div id="stage">
<main id="main">
  <section class="time-page min0" aria-labelledby="chart-title">
    <div class="intro">
      <div class="min0">
        <h2 id="chart-title">同一组时代，两种观察尺度</h2>
        <p class="lead">完整深时显示持续时间；放大末端，才看得见农业、工业与航天的内部差异。</p>
      </div>
      <div class="scale-control shrink0">
        <div class="ctl"><label for="zoom">压缩尺度</label><input id="zoom" type="range" min="0" max="100" value="42" step="1" aria-describedby="zoom-help"><output id="zoom-value" aria-live="polite">近期放大 42%</output></div>
        <div class="ends" id="zoom-help"><span>完整深时</span><span>近期放大</span></div>
      </div>
    </div>

    <div class="k-comparison timeline-compare min0" aria-label="四个时代在完整深时与末端放大尺度上的比较">
      <div class="hdr">时代</div><div class="hdr">完整深时中的占比</div><div class="hdr">放大末端后的内部差异</div>
      <div class="dim"><span class="era-name">旧石器时代</span><span class="era-span" id="span-paleo"></span></div><div class="bandcell" data-era="paleo" data-view="full"></div><div class="bandcell" data-era="paleo" data-view="zoom"></div>
      <div class="dim"><span class="era-name">农业时代</span><span class="era-span" id="span-agri"></span></div><div class="bandcell" data-era="agri" data-view="full"></div><div class="bandcell diff" data-era="agri" data-view="zoom"></div>
      <div class="dim"><span class="era-name">工业时代</span><span class="era-span" id="span-ind"></span></div><div class="bandcell" data-era="ind" data-view="full"></div><div class="bandcell diff" data-era="ind" data-view="zoom"></div>
      <div class="dim"><span class="era-name">航天时代</span><span class="era-span" id="span-space"></span></div><div class="bandcell" data-era="space" data-view="full"></div><div class="bandcell diff" data-era="space" data-view="zoom"></div>
    </div>

    <div class="summary"><strong>绝大部分时间在旧石器时代</strong><span>它远长于农业、工业和航天时代之和。时代边界是教学性分段，各地区并非同步进入；末端事件密集，也不等于创新速度始终单调加快。</span></div>
  </section>
</main>
</div>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 32,
  kicker: "DEEP TIME / RECENT CHANGE",
  title: "把创新年代压到同一把尺上",
  take: "旧石器时代绝大部分时间，远长于农业、工业和航天时代之和。"
});

(function(){
  var K=Lec.K.evolution, P=Lec.P;
  var oldest=K.genusHomoYearsAgo;
  var now=new Date().getFullYear();
  var spaceAgo=P.elapsedYears(K.firstHumanInSpaceYear,now);
  var moonAgo=P.elapsedYears(K.firstMoonLandingYear,now);
  var events=[
    {id:'paleo',start:oldest,end:K.agricultureYearsAgo,color:'var(--primary)',label:'早期人属至农业'},
    {id:'agri',start:K.agricultureYearsAgo,end:K.industrialRevolutionYearsAgo,color:'var(--success)',label:'农业出现'},
    {id:'ind',start:K.industrialRevolutionYearsAgo,end:spaceAgo,color:'var(--accent)',label:'工业时代'},
    {id:'space',start:spaceAgo,end:0,color:'var(--danger)',label:'载人航天'}
  ];
  var durations={
    paleo:oldest-K.agricultureYearsAgo,
    agri:K.agricultureYearsAgo-K.industrialRevolutionYearsAgo,
    ind:K.industrialRevolutionYearsAgo-spaceAgo,
    space:spaceAgo
  };
  function fmtYears(v){
    if(v>=10000) return P.roundTo(v/10000,0)+' 万年';
    return P.roundTo(v,0)+' 年';
  }
  document.getElementById('span-paleo').textContent='约 '+fmtYears(durations.paleo);
  document.getElementById('span-agri').textContent='约 '+fmtYears(durations.agri);
  document.getElementById('span-ind').textContent='约 '+fmtYears(durations.ind);
  document.getElementById('span-space').textContent=fmtYears(durations.space);
  P.compressHistoryToYear(K.agricultureYearsAgo,oldest);
  P.timelineFraction(K.agricultureYearsAgo,oldest);

  function draw(value){
    var t=value/100;
    var zoomOld=P.lerp(oldest,K.agricultureYearsAgo*1.15,t);
    d3.selectAll('.bandcell').each(function(){
      var cell=d3.select(this), era=cell.attr('data-era'), view=cell.attr('data-view');
      cell.selectAll('*').remove();
      cell.append('span').attr('class','dom-track').attr('aria-hidden','true');
      var W=520,H=58, domainOld=view==='full'?oldest:zoomOld;
      var x=d3.scaleLinear().domain([domainOld,0]).range([8,W-8]).clamp(true);
      var svg=cell.append('svg').attr('viewBox','0 0 '+W+' '+H).attr('role','img').attr('aria-label',events.find(function(d){return d.id===era}).label+'时间带');
      svg.append('rect').attr('x',8).attr('y',5).attr('width',W-16).attr('height',48).attr('rx',5).attr('fill','var(--surface-muted)');
      svg.append('line').attr('x1',8).attr('x2',W-8).attr('y1',30).attr('y2',30).attr('stroke','var(--line-strong)').attr('stroke-width',2);
      [0.25,0.5,0.75].forEach(function(f){
        var tx=8+(W-16)*f;
        svg.append('line').attr('x1',tx).attr('x2',tx).attr('y1',18).attr('y2',42).attr('stroke','var(--line)').attr('stroke-width',1);
      });
      var d=events.find(function(q){return q.id===era});
      var xa=x(Math.min(d.start,domainOld)), xb=x(d.end);
      svg.append('rect').attr('x',xa).attr('y',20).attr('width',Math.max(3,xb-xa)).attr('height',20).attr('rx',5).attr('fill',d.color);
      var share=P.roundTo(P.ratio(durations[era],oldest)*100,era==='paleo'?0:2);
      svg.append('text').attr('class','event-label').attr('x',W/2).attr('y',36).attr('text-anchor','middle').text(view==='full'?'占全程 '+share+'%':'窗口内的位置');
      svg.append('text').attr('class','axis-label').attr('x',8).attr('y',15).text(view==='full'?'约 280 万年前':'窗口：'+fmtYears(domainOld));
      if(!(era==='space' && view==='zoom')) svg.append('text').attr('class','axis-label').attr('x',W-8).attr('y',54).attr('text-anchor','end').text('现在');
      if(era==='space' && view==='zoom'){
        [{ago:spaceAgo,label:K.firstHumanInSpaceYear+' 进入太空'},{ago:moonAgo,label:K.firstMoonLandingYear+' 登月'}].forEach(function(e,i){
          svg.append('line').attr('x1',x(e.ago)).attr('x2',x(e.ago)).attr('y1',17).attr('y2',43).attr('stroke','var(--danger)').attr('stroke-width',2);
          svg.append('text').attr('class','event-label').attr('x',x(e.ago)+(i?7:-7)).attr('y',i?16:54).attr('text-anchor',i?'start':'end').text(e.label);
        });
      }
    });
    document.getElementById('zoom-value').textContent='近期放大 '+P.roundTo(value,0)+'%';
  }
  var slider=document.getElementById('zoom');
  slider.addEventListener('input',function(){draw(+slider.value)});
  draw(+slider.value);
})();
</script>
</body>
</html>
