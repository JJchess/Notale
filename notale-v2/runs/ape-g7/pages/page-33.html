<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>一枚火箭，装着许多人的知识</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page33{height:100%;--support-cols:4;gap:16px}
  .page33 .claim{padding:12px 20px}
  .game-shell{display:flex;gap:20px;min-height:0;flex:1}
  .network{position:relative;flex:1 1 auto;min-width:0;height:440px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-soft);overflow:hidden}
  .network svg{display:block;width:100%;height:100%}
  .network-note{position:absolute;z-index:3;right:218px;top:164px;width:160px;padding:9px 11px;background:var(--warning-soft);border:1px solid var(--warning);border-radius:var(--r-sm);font-size:var(--fs-sec);line-height:1.4;pointer-events:none}
  .side{flex:0 0 290px;min-width:0;display:flex;flex-direction:column;gap:12px}
  .side .panel{padding:16px}
  .side h2{margin-bottom:8px}
  .status{min-height:73px;font-size:var(--fs-sec);line-height:var(--lh-body)}
  .progress-list{display:flex;flex-direction:column;gap:7px;margin-top:8px}
  .progress-item{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:var(--fs-label)}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--surface-muted);border:1px solid var(--line-strong)}
  .progress-item.done{color:var(--success);font-weight:700}.progress-item.done .dot{background:var(--success)}
  #reset{min-height:44px;font-size:var(--fs-sec)}
  .support{padding:10px 13px!important}
  .support strong{display:block;color:var(--primary-strong);font-size:var(--fs-body);margin-bottom:2px}
  .support span{font-size:var(--fs-sec);line-height:1.4}
  .expert rect{fill:var(--surface-soft);stroke:var(--primary);stroke-width:2}.expert{cursor:grab;outline:none}.expert:focus rect{stroke:var(--focus);stroke-width:4}.expert.connected rect{fill:var(--success-soft);stroke:var(--success)}
  .institution rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}.mission rect{fill:var(--surface-muted);stroke:var(--line-strong);stroke-width:3}.mission.ready rect{fill:var(--success-soft);stroke:var(--success)}
  svg text{font-family:var(--font-sans);fill:var(--text)}.node-title{font-size:17px;font-weight:750}.node-sub{font-size:14px;fill:var(--muted)}.layer-label{font-size:14px;font-weight:750;fill:var(--muted);letter-spacing:.08em}
  .link{fill:none;stroke:var(--line-strong);stroke-width:3;stroke-dasharray:7 6;opacity:.42}.link.active{stroke:var(--success);stroke-dasharray:none;opacity:1}.preview{fill:none;stroke:var(--primary);stroke-width:3;stroke-dasharray:6 5;pointer-events:none}
  .port{fill:var(--surface);stroke:var(--primary);stroke-width:3}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body data-page="33" data-total="45">
<div id="stage">
<main id="main">
  <section class="page33 k-generalization col min0">
    <div class="claim">没有人独自掌握火箭所需的全部知识；制度把分散专长接成可检查、可传递、可行动的系统。</div>
    <div class="game-shell min0">
      <div id="network" class="network no-pan min0" aria-label="群体知识连线游戏"><div class="network-note">连线表示知识与责任的传递，不表示人物等级。</div></div>
      <aside class="side min0">
        <div class="panel">
          <h2>组装群体大脑</h2>
          <p class="sec">把每组专长拖向合适的制度接口。直接拖向任务卡，看看缺少了什么。</p>
        </div>
        <div class="panel grow">
          <h2>连接状态</h2>
          <div id="status" class="status" aria-live="polite">四组专长彼此隔离，任务还不能行动。</div>
          <div id="progress" class="progress-list"></div>
        </div>
        <button id="reset" type="button">重置网络</button>
      </aside>
    </div>
    <div class="supports" style="--support-cols:4">
      <div class="trunk" aria-hidden="true"></div>
      <div class="support"><strong>知识分散</strong><span>专长掌握在不同成员手中。</span></div>
      <div class="support"><strong>接口可接</strong><span>规格与文档让结果成为输入。</span></div>
      <div class="support"><strong>错误可查</strong><span>复核与记录帮助定位、修正。</span></div>
      <div class="support"><strong>行动可协调</strong><span>计划与规则汇成共同操作。</span></div>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:33,kicker:"DISTRIBUTED KNOWLEDGE",title:"一枚火箭，装着许多人的知识",take:"群体大脑不是许多聪明人的简单相加，而是制度把分散专长接成可检查、可传递、可行动的系统。"});
(function(){
  var W=1050,H=410;
  var experts=[
    {id:'materials',title:'材料 × 制造',sub:'强度、工艺',x:24,y:50,target:'standard'},
    {id:'software',title:'软件 × 通信',sub:'代码、信号',x:24,y:140,target:'document'},
    {id:'medicine',title:'医学',sub:'人体与风险',x:24,y:230,target:'coordinate'},
    {id:'testing',title:'测试',sub:'验证与边界',x:24,y:320,target:'review'}
  ];
  var institutions=[
    {id:'standard',title:'共享标准',sub:'术语与规格',x:400,y:40},
    {id:'document',title:'记录交接',sub:'结果可传递',x:400,y:135},
    {id:'review',title:'复核测试',sub:'错误可追查',x:400,y:230},
    {id:'coordinate',title:'计划决策',sub:'判断变行动',x:400,y:325}
  ];
  var mission={x:820,y:166,w:190,h:82};
  var state={links:{},started:false,complete:false};
  var host=d3.select('#network');
  var svg=host.append('svg').attr('viewBox','0 0 '+W+' '+H).attr('role','application').attr('aria-label','拖动专长卡，经制度接口连接到共同任务');
  svg.append('text').attr('class','layer-label').attr('x',24).attr('y',25).text('分散专长');
  svg.append('text').attr('class','layer-label').attr('x',400).attr('y',25).text('制度接口');
  svg.append('text').attr('class','layer-label').attr('x',820).attr('y',145).text('共同产出');
  var linkLayer=svg.append('g');
  linkLayer.selectAll('.route-guide').data(institutions).join('path').attr('class','link route-guide').attr('d',function(n){return path({x:n.x+190,y:n.y+32},{x:mission.x,y:mission.y+mission.h/2});});
  var routeWords=[{t:'结果可读',x:675,y:73},{t:'交接有据',x:690,y:157},{t:'责任可追',x:690,y:267},{t:'决策可执行',x:670,y:355}];
  svg.selectAll('.route-word').data(routeWords).join('text').attr('class','node-sub route-word').attr('x',d=>d.x).attr('y',d=>d.y).text(d=>d.t);
  var preview=svg.append('path').attr('class','preview').style('display','none');
  var inst=svg.selectAll('.institution').data(institutions).join('g').attr('class','institution').attr('transform',d=>'translate('+d.x+','+d.y+')');
  inst.append('rect').attr('width',190).attr('height',64).attr('rx',12);
  inst.append('text').attr('class','node-title').attr('x',18).attr('y',27).text(d=>d.title);
  inst.append('text').attr('class','node-sub').attr('x',18).attr('y',49).text(d=>d.sub);
  inst.append('circle').attr('class','port').attr('cx',190).attr('cy',32).attr('r',7);
  var mg=svg.append('g').attr('class','mission').attr('transform','translate('+mission.x+','+mission.y+')');
  mg.append('rect').attr('width',mission.w).attr('height',mission.h).attr('rx',16);
  mg.append('text').attr('class','node-title').attr('x',mission.w/2).attr('y',35).attr('text-anchor','middle').text('共同任务');
  mg.append('text').attr('class','node-sub').attr('x',mission.w/2).attr('y',59).attr('text-anchor','middle').text('可检查 · 可行动');
  var eg=svg.selectAll('.expert').data(experts).join('g').attr('class','expert').attr('tabindex',0).attr('role','button').attr('aria-label',d=>d.title+'，用方向键选择接口，回车连接').attr('transform',d=>'translate('+d.x+','+d.y+')');
  eg.append('rect').attr('width',210).attr('height',64).attr('rx',12);
  eg.append('text').attr('class','node-title').attr('x',18).attr('y',27).text(d=>d.title);
  eg.append('text').attr('class','node-sub').attr('x',18).attr('y',49).text(d=>d.sub);
  eg.append('circle').attr('class','port').attr('cx',210).attr('cy',32).attr('r',7);
  function center(n){return {x:n.x+95,y:n.y+32}}
  function path(a,b){return 'M'+a.x+','+a.y+' C'+(a.x+80)+','+a.y+' '+(b.x-80)+','+b.y+' '+b.x+','+b.y}
  function draw(){
    var active=experts.filter(e=>state.links[e.id]).map(function(e){var t=institutions.find(i=>i.id===state.links[e.id]);return {id:e.id,a:{x:e.x+210,y:e.y+32},b:{x:t.x,y:t.y+32}}});
    linkLayer.selectAll('.expert-link').data(active,d=>d.id).join('path').attr('class','link active expert-link').attr('d',d=>path(d.a,d.b));
    var all=experts.every(e=>state.links[e.id]===e.target);
    var chain=all?institutions.map(function(n){return{id:n.id,a:{x:n.x+190,y:n.y+32},b:{x:mission.x,y:mission.y+mission.h/2}}}):[];
    linkLayer.selectAll('.system-link').data(chain,d=>d.id).join('path').attr('class','link active system-link').attr('d',d=>path(d.a,d.b));
    eg.classed('connected',d=>!!state.links[d.id]); mg.classed('ready',all); state.complete=all;
    var labels=[['输入齐全',experts.every(e=>!!state.links[e.id])],['接口匹配',all],['交接可传递',all],['复核路径闭合',all]];
    d3.select('#progress').selectAll('.progress-item').data(labels).join('div').attr('class',d=>'progress-item'+(d[1]?' done':'')).html(d=>'<span class="dot"></span><span>'+d[0]+'</span>');
    if(all){d3.select('#status').text('网络闭合：分散知识经过接口、交接与复核，已经能汇成共同操作。');if(!state.wasComplete){state.wasComplete=true;window.dispatchEvent(new CustomEvent('game-complete',{detail:{score:1,metrics:{connected:4},trace:Object.assign({},state.links)}}));}}
  }
  function connect(e,target){
    if(target==='mission'){d3.select('#status').text('接口不明、无人复核：专家直接汇报，结果还不能可靠接入任务。');return;}
    if(target===e.target){state.links[e.id]=target;d3.select('#status').text(e.title+' 已通过“'+institutions.find(i=>i.id===target).title+'”接入。');}
    else d3.select('#status').text('这条路径无法接住该成果；换一个能保存其知识或责任的接口。');
    draw();
  }
  eg.call(d3.drag().on('start',function(event,d){state.started=true;preview.style('display',null).attr('d',path({x:d.x+210,y:d.y+32},{x:event.x,y:event.y}));}).on('drag',function(event,d){preview.attr('d',path({x:d.x+210,y:d.y+32},{x:event.x,y:event.y}));}).on('end',function(event,d){preview.style('display','none');var hit=institutions.find(n=>event.x>=n.x&&event.x<=n.x+190&&event.y>=n.y&&event.y<=n.y+64);if(event.x>=mission.x&&event.x<=mission.x+mission.w&&event.y>=mission.y&&event.y<=mission.y+mission.h)connect(d,'mission');else if(hit)connect(d,hit.id);else d3.select('#status').text('连线没有接到接口，专长仍然孤立。');}));
  eg.each(function(d){d.choice=0}).on('keydown',function(event,d){if(event.key==='ArrowDown'||event.key==='ArrowRight'){event.preventDefault();d.choice=(d.choice+1)%institutions.length;d3.select('#status').text('已选择接口：'+institutions[d.choice].title);}else if(event.key==='ArrowUp'||event.key==='ArrowLeft'){event.preventDefault();d.choice=(d.choice+institutions.length-1)%institutions.length;d3.select('#status').text('已选择接口：'+institutions[d.choice].title);}else if(event.key==='Enter'||event.key===' '){event.preventDefault();connect(d,institutions[d.choice].id);}});
  document.getElementById('reset').addEventListener('click',function(){state={links:{},started:false,complete:false,wasComplete:false};d3.select('#status').text('四组专长彼此隔离，任务还不能行动。');draw();window.dispatchEvent(new CustomEvent('game-reset'));});
  draw();
})();
</script>
</body>
</html>
