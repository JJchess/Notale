<style>
.system-focus{position:relative;width:100%;height:100%;min-height:0;overflow:hidden;border-radius:var(--r-lg);background:#071522;box-shadow:var(--shadow)}

.k-enumeration>.it{padding:var(--sp-4);background:rgba(7,21,34,.83);border-color:rgba(184,217,244,.38);border-top-color:#73baf2;box-shadow:none;backdrop-filter:blur(6px)}

.k-enumeration>.it>.bt{margin-bottom:var(--sp-2);color:#fff}
.k-enumeration .sec{color:#dceaf5}
.scene-label{position:absolute;top:8px;left:0;color:#dceaf5;font-weight:750}.scene-label.middle{left:43%}.scene-label.aboard{right:168px;left:auto}
.destination{position:absolute;top:8px;right:0;display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);color:#fff;background:var(--accent);border-radius:999px;font-size:var(--fs-label);font-weight:800}

.source{position:absolute;right:var(--sp-4);bottom:var(--sp-3);z-index:3;color:rgba(255,255,255,.7);font-size:14px;line-height:1.35}
