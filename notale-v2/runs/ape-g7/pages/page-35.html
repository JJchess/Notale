<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>一直下落，始终错过</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  orbit-game{display:block;width:100%;height:620px}
  .orbit-layout{display:flex;gap:24px;width:100%;height:100%}
  .space{position:relative;flex:1 1 auto;min-width:0;height:620px;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-lg);background:#071728;box-shadow:var(--shadow)}
  .space canvas{display:block;width:100%;height:100%}
  .scene-label{position:absolute;z-index:3;padding:8px 12px;color:#fff;background:rgb(7 23 40 / 82%);border:1px solid #6687a5;border-radius:var(--r-sm);font-size:var(--fs-label);line-height:var(--lh-tight);pointer-events:none}
  .launch-label{left:42px;top:26px}.gravity-label{left:46px;bottom:92px}.status{right:24px;top:24px;max-width:300px;font-size:var(--fs-sec);line-height:var(--lh-body)}
  .status[data-state="success"]{color:#d9ffe9;border-color:#65d69a}.status[data-state="impact"]{color:#ffe7d8;border-color:#eea270}
  .aim{position:absolute;z-index:4;left:78px;right:78px;bottom:24px;display:flex;align-items:center;gap:14px;padding:12px 16px;color:#fff;background:rgb(7 23 40 / 88%);border:1px solid #6687a5;border-radius:var(--r-md)}
  .aim label{font-size:var(--fs-label);font-weight:750;white-space:nowrap}.aim input{width:100%;min-width:0}.aim-output{min-width:72px;text-align:right;font-size:var(--fs-sec);font-variant-numeric:tabular-nums}
  .side{flex:0 0 360px;min-width:0;height:620px;display:flex;flex-direction:column;gap:14px}
  .side h2{font-size:var(--fs-h2)}
  .side .lead{padding:14px 16px;border-left:6px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-md) var(--r-md) 0;font-weight:750}
  .k-comparison{--comparison-cols:92px repeat(2,minmax(0,1fr));font-size:var(--fs-sec)}
  .k-comparison> *{padding:9px 8px;line-height:1.35}.k-comparison .hdr{font-size:var(--fs-sec)}.k-comparison .dim{text-align:left}
  .side-actions{display:flex;align-items:center;justify-content:space-between;gap:12px}.side-actions button{min-width:92px;min-height:44px;font-size:var(--fs-sec)}
  .attempts{font-size:var(--fs-sec);color:var(--muted)}
  .note{padding:10px 12px;background:var(--surface-soft);border-radius:var(--r-sm)}
  @media (prefers-reduced-motion:reduce){.space canvas{scroll-behavior:auto}}
</style>
</head>
<body data-page="35" data-total="45">
<div id="stage"><main id="main"><orbit-game></orbit-game></main></div>
<script src="assets/lib/three.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
class OrbitGame extends HTMLElement{
  constructor(){super();this.state={power:42,running:false,result:'ready',attempts:0,trace:[],previous:null,angle:0};}
  connectedCallback(){
    this.innerHTML=`<div class="orbit-layout">
      <section class="space min0 no-pan" aria-label="地球轨道模拟">
        <span class="scene-label launch-label">同一起点 · 沿地表切线掷出</span>
        <span class="scene-label gravity-label">↓ 重力始终指向地心</span>
        <div class="scene-label status" role="status" aria-live="polite">拖动力度，释放后观察轨迹。</div>
        <div class="aim"><label for="power">拖动球的切向力度</label><input id="power" type="range" min="15" max="100" value="42" aria-label="切向掷出力度"><span class="aim-output">42%</span></div>
      </section>
      <aside class="side min0">
        <h2>同样下落，哪里不同？</h2>
        <p class="lead">轨道不是重力被关闭，而是物体一边下落，一边快到持续错过地面。</p>
        <div class="k-comparison" aria-label="普通掷球与进入轨道逐维比较">
          <div class="hdr">比较维度</div><div class="hdr">普通掷球</div><div class="hdr">进入轨道</div><div class="rowline"></div>
          <div class="dim">初始方向</div><div>沿地表切线向前</div><div>沿地表切线向前</div><div class="rowline"></div>
          <div class="dim">重力</div><div>持续拉向地心</div><div>持续拉向地心</div><div class="rowline"></div>
          <div class="dim">地面关系</div><div class="diff">很快与地面相交</div><div class="diff">曲面持续避开</div><div class="rowline"></div>
          <div class="dim">结果</div><div class="diff">落地</div><div class="diff">绕行，仍在下落</div>
        </div>
        <div class="side-actions"><span class="attempts">已掷出：0 次</span><button type="button" class="reset">重置</button></div>
        <p class="note">教学近似：忽略大气阻力；亮线保留上一条轨迹，便于比较。</p>
      </aside>
    </div>`;
    this.space=this.querySelector('.space');this.range=this.querySelector('#power');this.output=this.querySelector('.aim-output');this.status=this.querySelector('.status');this.attemptEl=this.querySelector('.attempts');
    this.setupThree();
    this.range.addEventListener('input',()=>{this.state.power=+this.range.value;this.output.textContent=this.state.power+'%';this.preview();});
    this.range.addEventListener('change',()=>this.launch());
    this.querySelector('.reset').addEventListener('click',()=>this.reset());
    this.preview();this.start();
  }
  setupThree(){
    const w=this.space.clientWidth,h=this.space.clientHeight;this.scene=new THREE.Scene();this.scene.background=new THREE.Color(0x071728);
    this.camera=new THREE.PerspectiveCamera(38,w/h,.1,100);this.camera.position.set(0,0,16);this.camera.lookAt(0,0,0);
    this.renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});this.renderer.setPixelRatio(Math.min(devicePixelRatio,2));this.renderer.setSize(w,h);this.renderer.outputColorSpace=THREE.SRGBColorSpace;this.space.insertBefore(this.renderer.domElement,this.space.firstChild);
    this.earth=new THREE.Mesh(new THREE.SphereGeometry(4.15,64,40),new THREE.MeshStandardMaterial({color:0x1768a3,roughness:.72,metalness:.04}));this.earth.position.set(-1.5,-1.45,0);this.scene.add(this.earth);
    const landMat=new THREE.MeshStandardMaterial({color:0x4b9671,roughness:.9});for(const p of [[-2.3,.3,4],[-.2,-2.5,3.4],[-3.4,-2.2,3.1]]){const m=new THREE.Mesh(new THREE.SphereGeometry(.42,16,10),landMat);m.position.set(p[0],p[1],p[2]);m.scale.set(1.8,.7,.25);this.scene.add(m);}
    this.scene.add(new THREE.HemisphereLight(0xbfe5ff,0x061321,1.8));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(4,7,9);this.scene.add(light);
    this.ball=new THREE.Mesh(new THREE.SphereGeometry(.18,24,16),new THREE.MeshStandardMaterial({color:0xffb25c,emissive:0x7a2800,emissiveIntensity:.45}));this.scene.add(this.ball);
    this.gravity=new THREE.ArrowHelper(new THREE.Vector3(-1,-1,0).normalize(),new THREE.Vector3(1.44,2.48,.2),1.25,0xffd166,.32,.2);this.scene.add(this.gravity);
    this.currentLine=this.makeLine(0xffa657);this.previousLine=this.makeLine(0x62c6ff);
    this.resizeOff=Deck.onResize(()=>this.resize());
  }
  makeLine(color){const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3()]);const l=new THREE.Line(g,new THREE.LineBasicMaterial({color,transparent:true,opacity:.95}));this.scene.add(l);return l;}
  setLine(line,pts){line.geometry.dispose();line.geometry=new THREE.BufferGeometry().setFromPoints(pts.length?pts:[new THREE.Vector3()]);}
  point(a,r=4.55){return new THREE.Vector3(-1.5+r*Math.cos(a),-1.45+r*Math.sin(a),.2);}
  preview(){if(this.state.running)return;this.ball.position.copy(this.point(.98));const len=.7+this.state.power/100*1.5;this.gravity.setLength(1.15,.3,.18);this.render();}
  launch(){
    if(this.state.running)return;this.state.previous=this.state.trace.slice();this.setLine(this.previousLine,this.state.previous);this.state.trace=[];this.state.running=true;this.state.result='running';this.state.attempts++;this.state.angle=.98;
    this.attemptEl.textContent='已掷出：'+this.state.attempts+' 次';this.status.dataset.state='';this.status.textContent='正在下落：重力仍指向地心。';
    this.dispatchEvent(new CustomEvent('game-start',{bubbles:true,composed:true}));
  }
  tick(t,dt){
    if(this.state.running){const target=this.state.power>=86;const speed=target?1.35:.55+.65*this.state.power/100;this.state.angle-=speed*Math.min(dt,.04);let r=4.55;
      if(!target)r-=Math.max(0,(.98-this.state.angle))*(1.38-this.state.power/100);
      const p=this.point(this.state.angle,r);this.ball.position.copy(p);this.state.trace.push(p.clone());if(this.state.trace.length%2===0)this.setLine(this.currentLine,this.state.trace);
      const toward=new THREE.Vector3(-1.5,-1.45,.2).sub(p).normalize();this.gravity.position.copy(p);this.gravity.setDirection(toward);
      if(r<=4.16)this.finish(false);else if(target && .98-this.state.angle>=Math.PI*2)this.finish(true);
    }else if(!Deck.reduced())this.earth.rotation.y+=dt*.08;
    this.render();
  }
  finish(success){this.state.running=false;this.state.result=success?'success':'impact';this.status.dataset.state=this.state.result;this.status.textContent=success?'完成一圈：仍受重力，持续下落并错过地面。':'落地：前向位移不够快，轨迹与地面相交。';this.dispatchEvent(new CustomEvent(success?'game-complete':'game-progress',{detail:{state:this.getState(),action:'release',metrics:{completedOrbit:success}},bubbles:true,composed:true}));}
  start(){this.stop=Deck.loop((t,dt)=>this.tick(t,dt),{still:1});}
  reset(){this.state={power:42,running:false,result:'ready',attempts:0,trace:[],previous:null,angle:0};this.range.value=42;this.output.textContent='42%';this.attemptEl.textContent='已掷出：0 次';this.status.dataset.state='';this.status.textContent='拖动力度，释放后观察轨迹。';this.setLine(this.currentLine,[]);this.setLine(this.previousLine,[]);this.preview();this.dispatchEvent(new CustomEvent('game-reset',{bubbles:true,composed:true}));}
  resize(){const w=this.space.clientWidth,h=this.space.clientHeight;this.camera.aspect=w/h;this.camera.updateProjectionMatrix();this.renderer.setSize(w,h);this.render();}
  render(){this.renderer.render(this.scene,this.camera)}
  getState(){return JSON.parse(JSON.stringify(this.state,(k,v)=>k==='trace'||k==='previous'?undefined:v));}
  disconnectedCallback(){if(this.stop)this.stop();if(this.resizeOff)this.resizeOff();if(this.renderer)this.renderer.dispose();}
}
customElements.define('orbit-game',OrbitGame);
Lec.mount({index:35,kicker:'ORBIT / FALLING',title:'一直下落，始终错过',take:'轨道不是关闭重力，而是物体下落时持续错过地面。'});
const earthRadius=Lec.K.earth.meanRadius;
const earthMass=Lec.K.earth.mass;
const orbitAltitude=Lec.K.spaceflight.issTypicalAltitude;
const orbitRadius=Lec.P.orbitRadiusFromAltitude(earthRadius,orbitAltitude);
const orbitSpeed=Lec.P.roundTo(Lec.P.circularOrbitVelocity(earthMass,orbitRadius)/1000,1);
document.querySelector('orbit-game').dataset.orbitSpeed=orbitSpeed;
</script>
</body>
</html>
