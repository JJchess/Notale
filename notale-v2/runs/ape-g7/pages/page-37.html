<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>失重不是没有重力</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lesson{height:620px;display:flex;flex-direction:column;gap:12px}
  .intro{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:52px}
  .intro .lead{font-weight:750;color:var(--primary-strong)}
  .metric{font-size:var(--fs-sec);line-height:var(--lh-body);color:var(--muted);white-space:nowrap}
  .myths{display:flex;gap:12px;align-items:stretch}
  .myth{flex:1 1 0;min-width:0;padding:12px 12px;border-left:5px solid var(--danger);border-radius:0 var(--r-sm) var(--r-sm) 0;background:var(--danger-soft);font-size:var(--fs-sec);line-height:1.35}
  .myth b{display:block;color:var(--danger)}
  .k-classification.scenes{flex:1;min-height:0;display:flex;flex-direction:row;gap:16px}
  .scenes>.lv{flex:1 1 0;min-width:0;margin-left:0;padding-left:10px;border-left:3px solid var(--line-strong)}
  .scenes>.lv.orbit{border-left-color:var(--accent)}
  .scenes>.lv:before{top:23px;width:10px}
  .scene-box{height:100%;display:flex;flex-direction:column;padding:12px!important;overflow:hidden;background:var(--surface-soft)}
  .scene-box>.bt{margin:-12px -12px 8px!important;padding:7px 12px!important}
  .orbit .scene-box{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-soft)}
  .viewport{position:relative;height:184px;flex:0 0 184px;overflow:hidden;border-radius:var(--r-sm);background:#102b46}
  .viewport canvas{display:block;width:100%;height:100%}
  .force-label{position:absolute;z-index:2;padding:3px 7px;border-radius:var(--r-sm);font-size:var(--fs-label);line-height:var(--lh-tight);font-weight:750;background:rgb(255 255 255 / 90%);opacity:0;transition:opacity .2s}
  .force-label.g{left:10px;bottom:10px;color:var(--accent)}
  .force-label.n{right:10px;bottom:10px;color:var(--success)}
  .revealed .force-label.show{opacity:1}
  .classify{display:flex;align-items:center;gap:8px;margin-top:8px;min-height:44px}
  .classify label{font-size:var(--fs-label);font-weight:700;color:var(--muted);white-space:nowrap}
  .classify select{flex:1;min-width:0;height:44px;font-size:var(--fs-sec)}
  .criteria{margin-top:7px;display:flex;flex-direction:column;gap:3px;font-size:var(--fs-sec);line-height:1.35}
  .criterion{display:flex;gap:7px;align-items:center;min-height:32px;box-sizing:border-box;padding:4px 8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm)}
  .criterion b{color:var(--primary-strong);min-width:68px}
  .feedback{min-height:24px;margin-top:4px;font-size:var(--fs-sec);line-height:1.35;font-weight:700;color:var(--muted)}
  .feedback.ok{color:var(--success)}.feedback.bad{color:var(--danger)}
  .actions{display:flex;align-items:center;gap:12px;min-height:48px}
  .actions button{min-height:44px;font-size:var(--fs-sec)}
  #submit{color:#fff;background:var(--primary);border-color:var(--primary)}
  .result{flex:1;padding:9px 14px;border-left:6px solid var(--line-strong);border-radius:0 var(--r-sm) var(--r-sm) 0;background:var(--surface-soft);font-size:var(--fs-body);line-height:1.4}
  .result.won{border-left-color:var(--accent);background:var(--accent-soft);font-weight:750;color:#7a3512}
  @media (prefers-reduced-motion:reduce){.force-label{transition:none}}
</style>
</head>
<body data-page="37" data-total="45">
<div id="stage">
<main id="main">
  <section class="lesson" aria-labelledby="task-title">
    <div class="intro">
      <p id="task-title" class="lead">把三种“漂浮或不漂浮”按受力原因归类。</p>
      <p class="metric" id="orbitMetric">近地轨道示例正在计算…</p>
    </div>
    <div class="myths" aria-label="需要检验的三个常见误区">
      <p class="myth"><b>误区</b>太空没有重力</p>
      <p class="myth"><b>误区</b>轨道舱关闭了重力</p>
      <p class="myth"><b>误区</b>漂浮都只有同一个原因</p>
    </div>

    <div class="k-classification scenes" aria-label="漂浮现象的三类受力原因">
      <div class="lv orbit min0" data-scene="orbit">
        <article class="box scene-box">
          <h2 class="bt">轨道舱</h2>
          <div class="viewport" aria-label="地球旁的轨道舱与人体同步运动的三维示意">
            <span class="force-label g show">重力 ↓ 地球</span><canvas></canvas>
          </div>
          <div class="classify ctl"><label for="pick-orbit">归入</label><select id="pick-orbit"><option value="">请选择</option><option value="freefall">共同自由落体</option><option value="support">有支持力</option><option value="weak">重力很弱</option></select></div>
          <div class="criteria"><div class="criterion"><b>重力</b><span>仍然显著</span></div><div class="criterion"><b>地板托举</b><span>几乎没有持续支持力</span></div></div>
          <p class="feedback" aria-live="polite">等待归类</p>
        </article>
      </div>

      <div class="lv min0" data-scene="ground">
        <article class="box scene-box">
          <h2 class="bt">地面房间</h2>
          <div class="viewport" aria-label="人物站在地板上的三维示意">
            <span class="force-label g show">重力 ↓</span><span class="force-label n show">支持力 ↑</span><canvas></canvas>
          </div>
          <div class="classify ctl"><label for="pick-ground">归入</label><select id="pick-ground"><option value="">请选择</option><option value="freefall">共同自由落体</option><option value="support">有支持力</option><option value="weak">重力很弱</option></select></div>
          <div class="criteria"><div class="criterion"><b>重力</b><span>显著</span></div><div class="criterion"><b>地板托举</b><span>提供向上的支持力</span></div></div>
          <p class="feedback" aria-live="polite">等待归类</p>
        </article>
      </div>

      <div class="lv min0" data-scene="deep">
        <article class="box scene-box">
          <h2 class="bt">理想化深空</h2>
          <div class="viewport" aria-label="远离主要天体时物体漂浮的三维示意">
            <span class="force-label g">重力箭头很短</span><canvas></canvas>
          </div>
          <div class="classify ctl"><label for="pick-deep">归入</label><select id="pick-deep"><option value="">请选择</option><option value="freefall">共同自由落体</option><option value="support">有支持力</option><option value="weak">重力很弱</option></select></div>
          <div class="criteria"><div class="criterion"><b>重力</b><span>局部可很弱</span></div><div class="criterion"><b>用途</b><span>对照，不解释近地轨道</span></div></div>
          <p class="feedback" aria-live="polite">等待归类</p>
        </article>
      </div>
    </div>

    <div class="actions">
      <button id="submit" type="button">提交三项归类</button><button id="reset" type="button">重置</button>
      <p id="result" class="result" aria-live="polite">漂浮不等于没有重力。选择原因，再看每个场景的力。</p>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/three.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:37,kicker:"ORBITAL FREE FALL",title:"失重不是没有重力",take:"轨道舱内的“失重”主要来自舱与人体共同自由落体。"});
(function(){
  var radius=Lec.K.earth.meanRadius;
  var mass=Lec.K.earth.mass;
  var altitude=Lec.K.spaceflight.issTypicalAltitude;
  var orbitRadius=Lec.P.orbitRadiusFromAltitude(radius,altitude);
  var orbitG=Lec.P.surfaceGravity(mass,orbitRadius);
  var orbitV=Lec.P.circularOrbitVelocity(mass,orbitRadius);
  document.getElementById('orbitMetric').textContent='约 '+Lec.P.roundTo(altitude/1000,0)+' km 高度：重力约 '+Lec.P.roundTo(orbitG,1)+' m/s² · 速度约 '+Lec.P.roundTo(orbitV/1000,1)+' km/s';

  var views=[];
  document.querySelectorAll('[data-scene]').forEach(function(holder){
    var kind=holder.dataset.scene, host=holder.querySelector('.viewport'), canvas=host.querySelector('canvas');
    var scene=new THREE.Scene(); scene.background=new THREE.Color(kind==='deep'?0x07111f:0x102b46);
    var camera=new THREE.PerspectiveCamera(40,host.clientWidth/host.clientHeight,.1,100); camera.position.set(0,1.0,4.8); camera.lookAt(0,0,0);
    var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:false}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(host.clientWidth,host.clientHeight,false); renderer.outputColorSpace=THREE.SRGBColorSpace;
    scene.add(new THREE.HemisphereLight(0xdbeeff,0x152535,2.2)); var dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(3,5,4);scene.add(dl);
    var group=new THREE.Group();scene.add(group);
    function mesh(g,c){var m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.1}));group.add(m);return m}
    var head=mesh(new THREE.SphereGeometry(.25,20,14),0xffc88f);head.position.y=.62;
    var body=mesh(new THREE.CapsuleGeometry(.28,.7,6,12),0xd86b2b);body.rotation.z=kind==='ground'?0:.38;
    var arm=mesh(new THREE.CapsuleGeometry(.09,.62,4,8),0xffc88f);arm.rotation.z=1.15;arm.position.set(.1,.15,0);
    if(kind==='ground'){
      var floor=mesh(new THREE.BoxGeometry(5,.25,3),0x66809a);floor.position.y=-.85;
    } else if(kind==='orbit'){
      var earth=mesh(new THREE.SphereGeometry(2.2,32,24),0x287bc1);earth.position.set(-2.9,-2.8,-1.5);
      var cabin=mesh(new THREE.TorusGeometry(1.15,.08,10,32),0x9bc9ef);cabin.rotation.x=Math.PI/2;
    } else {
      for(var i=0;i<18;i++){var star=mesh(new THREE.SphereGeometry(.025,6,5),0xffffff);star.position.set((i%6-2.5)*.8,(Math.floor(i/6)-1)*1.1,-1-(i%3));}
    }
    renderer.render(scene,camera);
    views.push({kind:kind,host:host,scene:scene,camera:camera,renderer:renderer,group:group,phase:0,active:false});
  });
  function resize(){views.forEach(function(v){var w=v.host.clientWidth,h=v.host.clientHeight;v.camera.aspect=w/h;v.camera.updateProjectionMatrix();v.renderer.setSize(w,h,false);v.renderer.render(v.scene,v.camera);});}
  Deck.onResize(resize);
  var stop=Deck.loop(function(t,dt){views.forEach(function(v){if(v.active&&!Deck.reduced()){v.phase+=dt; if(v.kind==='orbit'){v.group.rotation.z=-.08*Math.sin(v.phase*2);v.group.position.y=-.18*Math.sin(v.phase*2);} else if(v.kind==='ground'){v.group.position.y=.025*Math.sin(v.phase*5);} else {v.group.rotation.z=.06*Math.sin(v.phase);}}v.renderer.render(v.scene,v.camera);});},{still:1});

  var answer={orbit:'freefall',ground:'support',deep:'weak'};
  var labels={freefall:'共同自由落体',support:'有支持力',weak:'重力很弱'};
  function submit(){var all=true,correct=true;
    document.querySelectorAll('[data-scene]').forEach(function(h,i){var k=h.dataset.scene,sel=h.querySelector('select'),fb=h.querySelector('.feedback');all=all&&!!sel.value;var ok=sel.value===answer[k];correct=correct&&ok;h.querySelector('.viewport').classList.add('revealed');views[i].active=true;fb.className='feedback '+(ok?'ok':'bad');fb.textContent=ok?'正确：'+labels[answer[k]]:(sel.value?'再比较：这里应看“'+labels[answer[k]]+'”':'还没有选择');});
    var out=document.getElementById('result');out.classList.toggle('won',all&&correct);
    out.textContent=all&&correct?'人在轨道上不是摆脱了重力，而是与周围的一切一起不断下落。':(!all?'请完成三个场景，再提交。':'重看重力是否显著，以及地板是否持续托举。');
  }
  function reset(){document.querySelectorAll('select').forEach(function(s){s.value='';});document.querySelectorAll('.feedback').forEach(function(f){f.className='feedback';f.textContent='等待归类';});document.querySelectorAll('.viewport').forEach(function(v){v.classList.remove('revealed');});views.forEach(function(v){v.active=false;v.phase=0;v.group.position.set(0,0,0);v.group.rotation.set(0,0,0);});var out=document.getElementById('result');out.className='result';out.textContent='漂浮不等于没有重力。选择原因，再看每个场景的力。';}
  document.getElementById('submit').addEventListener('click',submit);document.getElementById('reset').addEventListener('click',reset);
  window.addEventListener('beforeunload',function(){stop();views.forEach(function(v){v.renderer.dispose();});});
})();
</script>
</body>
</html>
