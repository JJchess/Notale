<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>同样起飞，离开每个世界有多难？</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .escape-page{height:100%;display:flex;flex-direction:column;gap:16px}
  .chart-panel{height:334px;padding:16px 20px 12px;display:flex;flex-direction:column}
  .chart-head{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:44px}
  .world-picks{display:flex;align-items:center;gap:8px}
  .world-picks button{min-width:82px;min-height:44px}
  #escapeChart{width:100%;height:254px;min-height:0}
  .compare-wrap{display:flex;flex-direction:column;gap:10px;min-height:0}
  .k-comparison{--comparison-cols:220px repeat(2,minmax(0,1fr));box-shadow:var(--shadow-soft)}
  .k-comparison>div{padding:8px 16px;display:flex;align-items:center;justify-content:center}
  .k-comparison .dim{justify-content:flex-end}
  .k-comparison .hdr{gap:10px}
  .planet-dot{width:20px;height:20px;border-radius:50%;display:inline-block;border:2px solid rgb(23 32 51 / 20%)}
  .metric{font-size:var(--fs-body);font-variant-numeric:tabular-nums;font-weight:700}
  .judgement{min-height:48px;padding:10px 18px;border-left:6px solid var(--accent);border-radius:0 var(--r-sm) var(--r-sm) 0;background:var(--accent-soft);font-size:var(--fs-sec);line-height:var(--lh-body)}
  .core{color:var(--primary-strong);background:var(--primary-soft);border-left-color:var(--primary);font-weight:750}
  .top-note{font-size:var(--fs-sec);line-height:var(--lh-body);color:var(--muted)}
</style>
</head>
<body data-page="38" data-total="45">
<div id="stage">
<main id="main">
  <section class="escape-page">
    <div class="panel chart-panel">
      <div class="chart-head">
        <p class="top-note">选两颗天体，比较同一行中的质量、半径与逃逸门槛。</p>
        <div class="world-picks" role="group" aria-label="选择两颗天体进行比较">
          <button type="button" data-world="earth" aria-pressed="true">地球</button>
          <button type="button" data-world="moon" aria-pressed="true">月球</button>
          <button type="button" data-world="mars" aria-pressed="false">火星</button>
          <button type="button" data-world="jupiter" aria-pressed="false">木星</button>
          <button type="button" id="reset">重置</button>
        </div>
      </div>
      <div id="escapeChart" class="min0" role="img" aria-label="地球、月球、火星和木星的地表附近逃逸速度横向比较图"></div>
    </div>

    <div class="compare-wrap">
      <div class="k-comparison" aria-label="所选天体逐维比较">
        <div class="hdr">比较维度</div><div class="hdr" id="headA"></div><div class="hdr" id="headB"></div>
        <div class="rowline"></div>
        <div class="dim">质量（地球＝1）</div><div class="metric" id="massA"></div><div class="metric" id="massB"></div>
        <div class="rowline"></div>
        <div class="dim">参考半径</div><div class="metric" id="radiusA"></div><div class="metric" id="radiusB"></div>
        <div class="rowline"></div>
        <div class="dim">地表附近逃逸速度</div><div class="metric diff" id="speedA"></div><div class="metric diff" id="speedB"></div>
      </div>
      <p class="judgement" id="judgement" aria-live="polite"></p>
      <p class="judgement core" id="core" hidden>逃离天体所需速度取决于天体质量与半径，不取决于火箭“想飞多高”。</p>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/echarts.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 38,
  kicker: "ORBIT / ESCAPE",
  title: "同样起飞，离开每个世界有多难？",
  take: "逃离天体所需速度取决于天体质量与半径，不取决于火箭“想飞多高”。"
});

(function(){
  var K=Lec.K, P=Lec.P;
  var worlds={
    earth:{name:"地球",mass:K.earth.mass,radius:K.earth.meanRadius,color:"#145da0"},
    moon:{name:"月球",mass:K.moon.mass,radius:K.moon.meanRadius,color:"#8799ae"},
    mars:{name:"火星",mass:K.mars.mass,radius:K.mars.meanRadius,color:"#d86b2b"},
    jupiter:{name:"木星",mass:1.89813e27,radius:69911000,color:"#a76008"}
  };
  var order=["earth","moon","mars","jupiter"];
  order.forEach(function(k){worlds[k].speed=P.escapeVelocity(worlds[k].mass,worlds[k].radius);});
  var selected=["earth","moon"], compared={};
  var chart=echarts.init(document.getElementById("escapeChart"),null,{renderer:"svg"});
  function fmtMass(v){return P.roundTo(v/K.earth.mass,3).toLocaleString("zh-CN");}
  function fmtRadius(v){return P.roundTo(P.convert(v,1000,1000000),0).toLocaleString("zh-CN")+" km";}
  function fmtSpeed(v){return P.roundTo(P.convert(v,1,1000),1).toFixed(1)+" km/s";}
  function render(){
    chart.setOption({
      animation:false,
      textStyle:{fontSize:16,fontFamily:getComputedStyle(document.documentElement).getPropertyValue("--font-sans")},
      grid:{left:92,right:72,top:20,bottom:42},
      xAxis:{type:"value",name:"地表附近逃逸速度（km/s）",nameLocation:"middle",nameGap:30,nameTextStyle:{fontSize:14,color:"#53657a"},axisLabel:{fontSize:13,color:"#53657a"},splitLine:{lineStyle:{color:"#dfe8f2"}}},
      yAxis:{type:"category",inverse:true,data:order.map(function(k){return worlds[k].name;}),axisTick:{show:false},axisLine:{show:false},axisLabel:{fontSize:16,fontWeight:700,color:function(v){var k=order.filter(function(x){return worlds[x].name===v;})[0];return selected.indexOf(k)>=0?worlds[k].color:"#8799ae";}}},
      tooltip:{trigger:"item",textStyle:{fontSize:16},formatter:function(p){return p.name+"<br>逃逸门槛："+p.value+" km/s";}},
      series:[{type:"bar",barWidth:24,data:order.map(function(k){return {name:worlds[k].name,value:P.roundTo(P.convert(worlds[k].speed,1,1000),1),itemStyle:{color:selected.indexOf(k)>=0?worlds[k].color:"#dfe8f2",borderRadius:[0,7,7,0]}};}),label:{show:true,position:"right",fontSize:14,color:"#172033",formatter:"{c} km/s"}}]
    },true);
    var a=worlds[selected[0]],b=worlds[selected[1]];
    document.getElementById("headA").innerHTML='<span class="planet-dot" style="background:'+a.color+'"></span>'+a.name;
    document.getElementById("headB").innerHTML='<span class="planet-dot" style="background:'+b.color+'"></span>'+b.name;
    document.getElementById("massA").textContent=fmtMass(a.mass);
    document.getElementById("massB").textContent=fmtMass(b.mass);
    document.getElementById("radiusA").textContent=fmtRadius(a.radius);
    document.getElementById("radiusB").textContent=fmtRadius(b.radius)+(selected[1]==="jupiter"?"（统一参考半径）":"");
    document.getElementById("speedA").textContent=fmtSpeed(a.speed);
    document.getElementById("speedB").textContent=fmtSpeed(b.speed);
    var faster=a.speed>b.speed?a:b, slower=a.speed>b.speed?b:a;
    document.getElementById("judgement").textContent=faster.name+"的门槛更高。半径增大会降低门槛，质量增大却会抬高门槛；必须把两者一起比较。逃逸速度是“不再落回”的门槛，并非火箭必须瞬间达到的单一读数。"+(selected.indexOf("jupiter")>=0?" 木星的“地表附近”采用统一参考半径。":"");
    var key=selected.slice().sort().join("-"); compared[key]=true;
    if(Object.keys(compared).length>=3) document.getElementById("core").hidden=false;
    document.querySelectorAll("[data-world]").forEach(function(btn){btn.setAttribute("aria-pressed",selected.indexOf(btn.dataset.world)>=0?"true":"false");});
  }
  document.querySelectorAll("[data-world]").forEach(function(btn){btn.addEventListener("click",function(){var k=btn.dataset.world,pos=selected.indexOf(k);if(pos>=0)return;selected=[selected[1],k];render();});});
  document.getElementById("reset").addEventListener("click",function(){selected=["earth","moon"];compared={};document.getElementById("core").hidden=true;render();});
  render();
  Deck.onResize(function(){chart.resize();});
})();
</script>
</body>
</html>
