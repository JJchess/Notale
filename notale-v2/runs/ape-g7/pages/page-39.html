<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>造一枚分级火箭</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .rocket-page{height:100%;display:flex;flex-direction:column;gap:12px}.mission{height:440px;display:flex;gap:16px}.rack{width:285px;padding:16px}.sim{position:relative;flex:1;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-md);background:repeating-linear-gradient(0deg,transparent 0 43px,rgb(20 93 160 / 18%) 44px 45px),repeating-linear-gradient(90deg,transparent 0 63px,rgb(20 93 160 / 12%) 64px 65px),linear-gradient(#dbeeff 0 70%,#dfe8f2 70%)}.sim canvas{position:absolute;inset:0;z-index:1;width:100%!important;height:100%!important}.dash{width:285px;padding:16px}.rack h2,.dash h2{margin-bottom:10px}.stage-pick{display:flex;gap:6px}.stage-pick button{flex:1;padding:8px}.ctl.stackctl{display:block;margin-top:12px}.ctl.stackctl label{display:block;margin-bottom:5px}.ctl.stackctl input{width:100%;min-width:0}.smallread{display:flex;justify-content:space-between;margin:9px 0;font-size:var(--fs-sec)}.massbar{height:18px;display:flex;overflow:hidden;border-radius:5px;background:var(--surface-muted);margin:7px 0 14px}.massbar i{display:block;height:100%}.fuel{background:var(--accent)}.dry{background:var(--line-strong)}.pay{background:var(--primary)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actions button{min-width:98px;min-height:44px}.actions .launch{color:#fff;background:var(--primary)}.status{margin-top:12px;padding:10px;border-radius:var(--r-sm);background:var(--surface-soft);font-size:var(--fs-sec);line-height:1.4}.sim-label{position:absolute;left:14px;top:12px;padding:7px 10px;border-radius:var(--r-sm);background:rgb(255 255 255 / 88%);font-size:var(--fs-label);z-index:2}.flight-field{position:absolute;inset:54px 18px 18px;z-index:1;border-left:3px solid var(--primary);border-bottom:3px solid var(--line-strong);border-radius:0 0 0 var(--r-sm);pointer-events:none}.flight-field::before{position:absolute;left:0;top:18px;width:76%;height:58%;border-top:3px dashed var(--primary);border-right:3px dashed var(--primary);border-radius:0 80px 0 0;content:""}.alt-label{position:absolute;left:9px;bottom:10px;color:var(--muted);font-size:var(--fs-label)}.target-label{position:absolute;right:10px;top:4px;padding:5px 8px;color:var(--success);background:var(--success-soft);border-radius:var(--r-sm);font-size:var(--fs-label);font-weight:750}.phase-zones{position:relative;display:flex;width:100%;height:100%;z-index:0}.phase-zone{flex:1;box-sizing:border-box;padding:84px 10px 0;border-right:1px dashed var(--line-strong);color:var(--muted);background:var(--primary-soft);font-size:var(--fs-label);text-align:center}.phase-zone:nth-child(2){background:var(--accent-soft)}.phase-zone:nth-child(3){background:var(--success-soft)}.phase-zone:last-child{border-right:0}.snapshots{position:absolute;right:14px;bottom:14px;z-index:3;display:flex;align-items:center;gap:7px}.snapshot{width:118px;min-height:82px;box-sizing:border-box;padding:9px;background:rgb(255 255 255 / 92%);border:1px solid var(--line);border-radius:var(--r-sm);font-size:var(--fs-label);line-height:1.35}.snapshot strong{display:block;color:var(--primary-strong);font-size:var(--fs-sec)}.snap-arrow{color:var(--primary);font-size:22px;font-weight:800}.k-process{--process-gap:4px;height:106px}.k-process .arw{flex:0 0 20px}.k-process>.step{padding:10px 8px;text-align:center;font-size:var(--fs-label);line-height:1.35}.step b{display:block;color:var(--primary-strong);font-size:var(--fs-sec)}.step span{display:block;margin-top:3px}.claimline{font-size:var(--fs-sec);line-height:1.4;color:var(--primary-strong);font-weight:750}.legend{gap:10px}.legend .swatch{width:12px;height:12px}@media(prefers-reduced-motion:reduce){.sim canvas{scroll-behavior:auto}}
</style>
</head>
<body data-page="39" data-total="45">
<div id="stage"><main id="main">
  <section class="rocket-page">
    <p class="claimline">携带燃料本身也要燃料；分级的关键收益，是及时抛弃已经无用的空结构，改善后续飞行的质量比。</p>
    <div class="mission">
      <section class="panel rack min0" aria-label="火箭装配架">
        <h2>装配架</h2>
        <div class="ctl stackctl"><label>级数</label><div class="stage-pick" role="group" aria-label="选择级数"><button data-n="1">单级</button><button data-n="2" aria-pressed="true">二级</button><button data-n="3">三级</button></div></div>
        <div class="ctl stackctl"><label for="fuel">每级推进剂 <output id="fuelOut">72%</output></label><input id="fuel" type="range" min="45" max="82" value="72" step="1"></div>
        <div class="smallread"><span>目标速度增量</span><strong id="target">9.2 km/s</strong></div>
        <div class="smallread"><span>最低载荷</span><strong id="minPayload">4.0 t</strong></div>
        <p class="note">点火后观察燃料减少。级耗尽时，决定是否立即抛掉空壳。</p>
        <div class="actions"><button class="launch" id="launch">点火</button><button id="separate" disabled>分离空级</button><button id="reset">重置</button></div>
      </section>

      <section class="sim min0 no-pan" id="sim" aria-label="火箭侧视物理场景">
        <div class="phase-zones" aria-hidden="true"><div class="phase-zone"></div><div class="phase-zone"></div><div class="phase-zone"></div></div>
        <div class="sim-label" id="phase">待发射 · 火箭完整</div>
        <div class="flight-field" aria-hidden="true"><span class="alt-label">发射点</span><span class="target-label">速度目标</span></div>
        <div class="snapshots" aria-label="分离前后质量关系"><div class="snapshot"><strong>分离前</strong>空结构仍被加速</div><span class="snap-arrow">→</span><div class="snapshot"><strong>分离后</strong>后续级推动更少质量</div></div>
      </section>

      <aside class="panel dash min0" aria-label="飞行仪表">
        <h2>质量与速度</h2>
        <div class="legend"><span><i class="swatch" style="background:var(--accent)"></i>推进剂</span><span><i class="swatch" style="background:var(--line-strong)"></i>结构</span><span><i class="swatch" style="background:var(--primary)"></i>载荷</span></div>
        <div class="massbar" aria-hidden="true"><i class="fuel" id="barFuel"></i><i class="dry" id="barDry"></i><i class="pay" id="barPay"></i></div>
        <div class="readout"><span class="label">当前总质量</span><strong class="value" id="mass">—</strong></div>
        <div class="readout" style="margin-top:10px"><span class="label">累计速度增量</span><strong class="value" id="dv">—</strong></div>
        <div class="smallread"><span>当前级</span><strong id="activeStage">—</strong></div>
        <div class="smallread"><span>剩余推进剂</span><strong id="remain">—</strong></div>
        <div class="status" id="status" aria-live="polite">先装配，再点火。</div>
      </aside>
    </div>

    <nav class="k-process axis" aria-label="六步飞行进程">
      <div class="step is-current"><b>1 读取任务</b><span>目标与载荷</span></div><i class="arw"></i>
      <div class="step"><b>2 配置火箭</b><span>级数与燃料</span></div><i class="arw"></i>
      <div class="step"><b>3 点火燃烧</b><span>质量下降</span></div><i class="arw"></i>
      <div class="step"><b>4 空级拖累</b><span>仍随行</span></div><i class="arw"></i>
      <div class="step"><b>5 抛弃空壳</b><span>质量骤减</span></div><i class="arw"></i>
      <div class="step"><b>6 检验抵达</b><span>速度与载荷</span></div>
    </nav>
  </section>
</main></div>
<script src="assets/lib/matter.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:39,kicker:"MASS FIGHTS MASS",title:"造一枚分级火箭",take:"携带燃料本身也要燃料；分级通过抛弃空结构改善质量比。"});
(function(){
  var P=Lec.P, K=Lec.K.spaceflight;
  var C={target:9200,isp:340,payload:4000,dry:1400,prop:5200};
  var state, timer=null, engine=Matter.Engine.create(), render;
  var sim=document.getElementById('sim'); engine.gravity.y=0.45;
  render=Matter.Render.create({element:sim,engine:engine,options:{width:650,height:440,wireframes:false,background:'transparent',showAngleIndicator:false}});
  Matter.Render.run(render); var runner=Matter.Runner.create(); Matter.Runner.run(runner,engine);
  function fresh(){return {n:2,fuelPct:72,active:0,burn:0,dv:0,mode:'setup',bodies:[]};}
  function stageMass(){return C.dry+C.prop*state.fuelPct/100;}
  function totalMass(){var remaining=(state.n-state.active)*stageMass()+C.payload;var burned=state.mode==='burn'?C.prop*state.fuelPct/100*state.burn:0;return Math.max(C.payload,remaining-burned);}
  function setStep(n){document.querySelectorAll('.k-process .step').forEach(function(el,i){el.className='step'+(i+1<n?' is-done':i+1===n?' is-current':'');});}
  function build(){Matter.Composite.clear(engine.world,false);state.bodies=[];var x=325,base=350;for(var i=0;i<state.n;i++){var b=Matter.Bodies.rectangle(x,base-i*62,62,58,{isStatic:true,label:'stage',render:{fillStyle:i===0?'#d86b2b':'#145da0',strokeStyle:'#0d477d',lineWidth:2}});state.bodies.push(b);Matter.Composite.add(engine.world,b);}var nose=Matter.Bodies.polygon(x,base-state.n*62,3,38,{isStatic:true,angle:-Math.PI/2,render:{fillStyle:'#ffffff',strokeStyle:'#0d477d',lineWidth:2}});state.bodies.push(nose);Matter.Composite.add(engine.world,nose);}
  function update(){var mass=totalMass(), fuel=Math.max(0,(state.n-state.active-(state.mode==='burn'?state.burn:0))*C.prop*state.fuelPct/100),dry=Math.max(0,(state.n-state.active)*C.dry),sum=fuel+dry+C.payload;document.getElementById('mass').textContent=P.roundTo(mass/1000,1)+' t';document.getElementById('dv').textContent=P.roundTo(state.dv/1000,2)+' km/s';document.getElementById('activeStage').textContent=state.mode==='done'?'任务结束':(state.active+1)+' / '+state.n;document.getElementById('remain').textContent=P.roundTo(P.percent(fuel,Math.max(1,C.prop*state.fuelPct/100*state.n)),0)+'%';document.getElementById('barFuel').style.width=P.percent(fuel,sum)+'%';document.getElementById('barDry').style.width=P.percent(dry,sum)+'%';document.getElementById('barPay').style.width=P.percent(C.payload,sum)+'%';}
  function reset(){if(timer)clearInterval(timer);state=fresh();document.getElementById('fuel').value=72;document.getElementById('fuelOut').textContent='72%';document.querySelectorAll('[data-n]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.n==='2');b.disabled=false;});document.getElementById('fuel').disabled=false;document.getElementById('launch').disabled=false;document.getElementById('separate').disabled=true;document.getElementById('status').textContent='先装配，再点火。';document.getElementById('phase').textContent='待发射 · 火箭完整';setStep(1);build();update();}
  function finish(){state.mode='done';clearInterval(timer);var ok=state.dv>=C.target;document.getElementById('status').textContent=ok?'成功：保住载荷并达到目标。试试单级需要多少燃料。':'未达到目标：重置后改变级数或推进剂比例。';document.getElementById('phase').textContent=ok?'抵达目标':'速度不足';document.getElementById('separate').disabled=true;setStep(6);update();}
  function burn(){state.mode='burn';document.getElementById('separate').disabled=true;setStep(3);timer=setInterval(function(){var before=totalMass();state.burn=Math.min(1,state.burn+.04);var after=totalMass();state.dv+=P.rocketDeltaV(C.isp,before,after);state.bodies.forEach(function(b){Matter.Body.translate(b,{x:0,y:-1.2});});update();if(state.burn>=1){clearInterval(timer);state.mode='empty';document.getElementById('separate').disabled=false;document.getElementById('status').textContent='推进剂耗尽：空结构仍在随行，立即分离可减轻后续负担。';document.getElementById('phase').textContent='空级拖累 · 等待分离';setStep(4);if(state.active===state.n-1)setTimeout(finish,700);}},Deck.reduced()?25:60);}
  function separate(){if(state.mode!=='empty')return;var b=state.bodies[state.active];if(b){Matter.Body.setStatic(b,false);Matter.Body.setVelocity(b,{x:-2.5,y:1});Matter.Body.setAngularVelocity(b,.08);}state.active++;state.burn=0;document.getElementById('phase').textContent='空壳已抛弃 · 剩余级继续';document.getElementById('status').textContent='空壳坠落，总质量骤减；下一阶段用同样的燃料推动更轻的火箭。';setStep(5);update();if(state.active>=state.n)finish();else setTimeout(burn,Deck.reduced()?50:650);}
  document.querySelectorAll('[data-n]').forEach(function(b){b.addEventListener('click',function(){state.n=+b.dataset.n;document.querySelectorAll('[data-n]').forEach(function(x){x.setAttribute('aria-pressed',x===b);});setStep(2);build();update();});});
  document.getElementById('fuel').addEventListener('input',function(){state.fuelPct=+this.value;document.getElementById('fuelOut').textContent=this.value+'%';setStep(2);build();update();});
  document.getElementById('launch').addEventListener('click',function(){this.disabled=true;document.getElementById('fuel').disabled=true;document.querySelectorAll('[data-n]').forEach(function(b){b.disabled=true;});document.getElementById('status').textContent='燃烧中：推进剂减少，总质量与速度增量同步变化。';document.getElementById('phase').textContent='点火 · 推进剂正在消耗';burn();});
  document.getElementById('separate').addEventListener('click',separate);document.getElementById('reset').addEventListener('click',reset);window.addEventListener('pagehide',function(){clearInterval(timer);Matter.Runner.stop(runner);Matter.Render.stop(render);});reset();
})();
</script>
</body></html>
