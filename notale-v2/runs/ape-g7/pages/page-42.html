<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>呼吸不是一只氧气罐</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#f4f7fb;--text:#172033;--font-sans:Inter,"Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.lesson{height:620px;display:flex;flex-direction:column;gap:12px}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.intro{max-width:820px;font-size:var(--fs-lead);line-height:var(--lh-body)}
.lamps{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:500px}
.lamp{display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);font-size:var(--fs-label);font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line-strong)}
.lamp.ok{color:var(--success);background:var(--success-soft);border-color:var(--success)}.lamp.ok .dot{background:var(--success)}
.class-wrap{height:162px}.class-wrap>.lv{height:100%}.class-wrap .box{padding:10px 12px}.class-wrap .box>.bt{margin:-10px -12px 8px;padding:6px 12px;font-size:18px}
.classes{display:flex;gap:10px}.class-item{flex:1;min-width:0}.class-item .lv{margin-left:0;padding-left:0;border-left:0;gap:0}.class-item .lv:before{display:none}
.roles{display:flex;gap:6px;flex-wrap:wrap}.role{padding:3px 7px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;line-height:1.35}
.class-item[data-cat="air"]{border-top:4px solid #2f79c7}.class-item[data-cat="water"]{border-top:4px solid #248c9d}.class-item[data-cat="heat"]{border-top:4px solid #d86b2b}.class-item[data-cat="waste"]{border-top:4px solid #8a659e}.class-item[data-cat="pressure"]{border-top:4px solid #b08b1e}
.board{position:relative;display:flex;flex-direction:column;flex:1;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-soft);overflow:hidden}
#network{display:block;width:100%;flex:1 1 0;min-height:0}.pipe{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round}.pipe.on{stroke:var(--pipe);stroke-dasharray:10 8;animation:flow 1s linear infinite}.pipe.bad{stroke:var(--danger);stroke-dasharray:4 8}.node{fill:var(--surface);stroke:var(--line-strong);stroke-width:2}.node.done{fill:var(--success-soft);stroke:var(--success)}
.node-label{font-size:16px;font-weight:700;fill:var(--text);text-anchor:middle;pointer-events:none}.node-sub{font-size:14px;fill:var(--muted);text-anchor:middle;pointer-events:none}
@keyframes flow{to{stroke-dashoffset:-18}}
.controlbar{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 12px;background:var(--surface-soft);border-top:1px solid var(--line)}
.controlbar label{font-size:15px;font-weight:700;color:var(--muted)}
.controlbar select{min-width:210px;height:44px}.controlbar button{min-height:44px;font-size:16px}.feedback{flex:1;font-size:16px;line-height:1.4;color:var(--primary-strong);font-weight:650}.feedback.bad{color:var(--danger)}
.key{font-size:14px;color:var(--muted);white-space:nowrap}.final{color:var(--success);font-weight:800}
@media(prefers-reduced-motion:reduce){.pipe.on{animation:none;stroke-dasharray:none}}
</style>
</head>
<body data-page="42" data-total="45">
<div id="stage">
<main id="main">
<section class="lesson" aria-labelledby="system-heading">
  <div class="topline">
    <p id="system-heading" class="intro">把五类条件分别接成“来源—处理—去向—监测”。一条管路只有同时有供给、处理与监测，才会进入安全状态。</p>
    <div class="lamps" id="lamps" aria-label="五类生命保障状态"></div>
  </div>

  <div class="k-classification class-wrap" aria-label="生命保障按被维持的条件分类">
    <div class="lv"><div class="box">
      <div class="bt">生命保障系统：被维持的五类条件</div>
      <div class="classes">
        <div class="box class-item" data-cat="air"><div class="lv"><div class="bt">◌ 呼吸</div><div class="roles"><span class="role">氧气来源</span><span class="role">舱内空气</span><span class="role">移除二氧化碳</span><span class="role">成分监测</span></div></div></div>
        <div class="box class-item" data-cat="water"><div class="lv"><div class="bt">≈ 水</div><div class="roles"><span class="role">储水</span><span class="role">使用与收集</span><span class="role">净化回用</span><span class="role">水质监测</span></div></div></div>
        <div class="box class-item" data-cat="heat"><div class="lv"><div class="bt">♨ 温度</div><div class="roles"><span class="role">人体与设备产热</span><span class="role">冷却回路</span><span class="role">向外散热</span><span class="role">温度监测</span></div></div></div>
        <div class="box class-item" data-cat="waste"><div class="lv"><div class="bt">▱ 废物</div><div class="roles"><span class="role">产生</span><span class="role">收集</span><span class="role">隔离或处理</span><span class="role">状态监测</span></div></div></div>
        <div class="box class-item" data-cat="pressure"><div class="lv"><div class="bt">◎ 压力</div><div class="roles"><span class="role">密闭舱体</span><span class="role">气体补充</span><span class="role">泄漏检测</span><span class="role">压力监测</span></div></div></div>
      </div>
    </div></div>
  </div>

  <div class="board no-pan min0">
    <svg id="network" role="img" aria-label="五类生命保障管路连接图"></svg>
    <div class="controlbar">
      <label for="from">从</label><select id="from" aria-label="起点"></select>
      <label for="to">接到</label><select id="to" aria-label="终点"></select>
      <button id="connect">连接管路</button><button id="reset">重置</button>
      <div id="feedback" class="feedback" aria-live="polite">先完成任意一类；错误连接会指出缺少的功能。</div>
      <span class="key">键盘：Tab 选择，Enter 连接</span>
    </div>
  </div>
</section>
</main>
</div>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:42,kicker:"LIFE SUPPORT",title:"呼吸不是一只氧气罐",take:"人在太空中维持生命，靠的不是单件设备，而是呼吸、水、温度、废物与压力组成的受监测循环。"});
(function(){
  var cats=[
    {id:'air',name:'呼吸',icon:'◌',color:'#2f79c7',steps:['氧气来源','乘员舱','二氧化碳移除','成分监测']},
    {id:'water',name:'水',icon:'≈',color:'#248c9d',steps:['储水','乘员舱','污水净化','水质监测']},
    {id:'heat',name:'温度',icon:'♨',color:'#d86b2b',steps:['人体与设备产热','冷却回路','向外散热','温度监测']},
    {id:'waste',name:'废物',icon:'▱',color:'#8a659e',steps:['乘员舱','废物收集','隔离或处理','状态监测']},
    {id:'pressure',name:'压力',icon:'◎',color:'#b08b1e',steps:['气体补充','密闭舱体','泄漏检测','压力监测']}
  ];
  var allNodes=[], links=[];
  cats.forEach(function(c){c.steps.forEach(function(s,i){var key=c.id+'-'+i;allNodes.push({key:key,label:s,cat:c.id,step:i});if(i<c.steps.length-1)links.push({cat:c.id,from:key,to:c.id+'-'+(i+1)});});});
  var state;
  function fresh(){return {made:[],wrong:null,complete:false};}
  var svg=d3.select('#network').attr('viewBox','0 0 1406 290');
  svg.append('title').text('生命保障管路模型');svg.append('desc').text('五类条件各由四种角色组成，连成完整路径并接受监测。');
  var positions={};
  cats.forEach(function(c,ci){var y=32+ci*50;c.steps.forEach(function(s,i){positions[c.id+'-'+i]={x:155+i*360,y:y};});});
  var linkG=svg.append('g'),nodeG=svg.append('g');
  links.forEach(function(l){var a=positions[l.from],b=positions[l.to];linkG.append('path').datum(l).attr('class','pipe').attr('data-key',l.from+'>'+l.to).style('--pipe',cats.find(function(c){return c.id===l.cat}).color).attr('d','M'+(a.x+72)+','+a.y+' C'+(a.x+150)+','+a.y+' '+(b.x-150)+','+b.y+' '+(b.x-72)+','+b.y);});
  allNodes.forEach(function(n){var p=positions[n.key],g=nodeG.append('g').attr('transform','translate('+p.x+','+p.y+')');g.append('rect').attr('class','node').attr('data-node',n.key).attr('x',-72).attr('y',-19).attr('width',144).attr('height',38).attr('rx',10);g.append('text').attr('class','node-label').attr('y',6).text(n.label);});
  function fillSelect(el){el.innerHTML='';cats.forEach(function(c){var og=document.createElement('optgroup');og.label=c.icon+' '+c.name;c.steps.forEach(function(s,i){var o=document.createElement('option');o.value=c.id+'-'+i;o.textContent=s;og.appendChild(o);});el.appendChild(og);});}
  var from=document.getElementById('from'),to=document.getElementById('to'),fb=document.getElementById('feedback');fillSelect(from);fillSelect(to);to.selectedIndex=1;
  function catDone(c){return links.filter(function(l){return l.cat===c.id}).every(function(l){return state.made.indexOf(l.from+'>'+l.to)>=0;});}
  function render(){
    linkG.selectAll('.pipe').attr('class',function(d){var k=d.from+'>'+d.to;return 'pipe'+(state.made.indexOf(k)>=0?' on':'')+(state.wrong===k?' bad':'');});
    nodeG.selectAll('.node').attr('class',function(){var k=this.getAttribute('data-node');return 'node'+(state.made.some(function(e){return e.indexOf(k+'>')===0||e.indexOf('>'+k)>0;})?' done':'');});
    document.getElementById('lamps').innerHTML=cats.map(function(c){var ok=catDone(c);return '<span class="lamp '+(ok?'ok':'')+'"><span class="dot"></span>'+c.icon+' '+c.name+' · '+(ok?'安全':'待接')+'</span>';}).join('');
  }
  function connect(){var key=from.value+'>'+to.value,link=links.find(function(l){return l.from===from.value&&l.to===to.value;});state.wrong=null;fb.className='feedback';
    if(!link){state.wrong=key;fb.className='feedback bad';var a=allNodes.find(function(n){return n.key===from.value}),b=allNodes.find(function(n){return n.key===to.value});fb.textContent=a.cat!==b.cat?'错接：两端属于不同条件。先在同一类中接完整路径。':'这里缺少正确的处理顺序；沿“来源—处理—去向—监测”连接。';}
    else if(state.made.indexOf(key)>=0){fb.textContent='这段管路已经接通；继续补上同类的断点或另一类。';}
    else{state.made.push(key);var c=cats.find(function(x){return x.id===link.cat});if(catDone(c))fb.textContent=c.name+'循环已受监测；继续检查其余类别。';else fb.textContent='管路接通，但'+c.name+'仍有断点。只接来源不等于系统稳定。';}
    if(cats.every(catDone)){state.complete=true;fb.className='feedback final';fb.textContent='五类条件全部稳定。循环能回收一部分物质，但仍会损失、需要补给，也必须把热量排向舱外。';document.dispatchEvent(new CustomEvent('game-complete',{detail:{score:state.made.length,metrics:{stable:5},trace:state.made.slice()}}));}
    render();document.dispatchEvent(new CustomEvent('game-progress',{detail:{state:JSON.parse(JSON.stringify(state)),action:'connect',metrics:{stable:cats.filter(catDone).length}}}));
  }
  document.getElementById('connect').addEventListener('click',connect);document.getElementById('reset').addEventListener('click',function(){state=fresh();fb.className='feedback';fb.textContent='先完成任意一类；错误连接会指出缺少的功能。';render();document.dispatchEvent(new CustomEvent('game-reset'));});
  state=fresh();render();document.dispatchEvent(new CustomEvent('game-start'));
  window.lifeSupportGame={start:function(){state=fresh();render();},reset:function(){state=fresh();render();},getState:function(){return JSON.parse(JSON.stringify(state));}};
})();
</script>
</body>
</html>
