<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>你会批准这次火星任务吗？</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#f4f7fb;--text:#172033;--font-sans:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
.review{height:620px;display:flex;flex-direction:column;gap:16px}
.claim{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:12px!important;padding-bottom:12px!important}
.claim small{font-size:var(--fs-sec);font-weight:500;color:var(--muted)}
.board{display:flex;gap:20px;min-height:0;flex:1}
.role-zone{flex:0 0 680px;display:flex;flex-direction:column;gap:12px;min-height:0;padding:16px;background:var(--surface-soft);border:1px solid var(--line);border-radius:var(--r-md)}
.role-strip{display:flex;gap:8px}
.role-dot{flex:1;padding:8px 4px;text-align:center;border-bottom:4px solid var(--line);font-size:var(--fs-label);color:var(--muted)}
.role-dot.active{border-color:var(--primary);color:var(--primary-strong);font-weight:750}.role-dot.done{border-color:var(--success);color:var(--success)}
.role-card{flex:1;padding:16px 20px}.role-card h2{margin-bottom:6px}.prompt{min-height:48px;color:var(--muted)}
.reason-bank{display:flex;gap:10px;margin:12px 0}.reason{min-height:150px;flex:1;padding:9px 10px;font-size:var(--fs-sec);line-height:1.35;text-align:left;cursor:grab}.reason strong{display:block;margin-bottom:12px;color:var(--primary-strong);font-size:var(--fs-label)}.reason span{display:block}.reason:focus{outline:3px solid var(--focus);outline-offset:2px}
.drop{min-height:110px;border:2px dashed var(--line-strong);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;padding:8px 14px;color:var(--muted);font-size:var(--fs-sec);line-height:1.35}.drop.has{border-style:solid;border-color:var(--primary);background:var(--primary-soft);color:var(--primary-strong);font-weight:700}
.actions{display:flex;align-items:center;gap:10px}.actions label{font-size:var(--fs-label);font-weight:700;color:var(--muted)}.actions select{min-height:44px;flex:1;font-size:var(--fs-sec)}
.primary-action{background:var(--primary);color:white;border-color:var(--primary);min-height:44px}.primary-action:disabled{opacity:.45;cursor:not-allowed}
.map-zone{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--surface-soft);border:1px solid var(--line);border-radius:var(--r-md)}.map-head{display:flex;align-items:center;justify-content:space-between}.map-head h2{font-size:var(--fs-h2)}
#reasonMap{width:100%;height:318px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.criteria{display:flex;flex-wrap:wrap;gap:8px}.criterion{flex:1 1 42%;padding:8px 10px;background:var(--surface);border-left:4px solid var(--line-strong);border-radius:var(--r-sm);font-size:var(--fs-sec);line-height:1.35}.criterion strong{display:block;color:var(--primary-strong)}.result{min-height:96px;padding:10px 16px;box-shadow:none}.result h2{font-size:var(--fs-h2);margin-bottom:5px}.result p{font-size:var(--fs-sec);line-height:1.45}.hidden{visibility:hidden}
svg text{font-family:var(--font-sans);fill:var(--text)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body data-page="44" data-total="45">
<div id="stage">
<main id="main">
  <section class="review k-generalization" aria-labelledby="review-claim">
    <div class="claim" id="review-claim"><span>技术上“做得到”，不自动推出“应该做”。</span><small>逐一回应五种关切，再作总体决定</small></div>
    <div class="board">
      <div class="role-zone min0">
        <div class="role-strip" id="roleStrip" aria-label="审查进度"></div>
        <article class="panel role-card">
          <h2 id="roleName">工程师</h2>
          <p class="sec prompt" id="rolePrompt"></p>
          <div class="reason-bank" id="reasonBank" aria-label="核心理由"></div>
          <div class="drop" id="dropZone" tabindex="0" role="button" aria-label="核心理由投放区；也可聚焦理由后按回车选择">拖入一张核心理由卡，或聚焦理由后按回车</div>
          <div class="actions ctl">
            <label for="stance">该角色立场</label>
            <select id="stance"><option value="">请选择</option><option>支持</option><option>附条件</option><option>反对</option></select>
            <button id="saveRole" disabled>记录并听下一位</button>
          </div>
        </article>
        <div class="actions ctl">
          <label for="overall">总体审批</label>
          <select id="overall" disabled><option value="">请选择</option><option>批准</option><option>附条件批准</option><option>拒绝</option></select>
          <button class="primary-action" id="submit" disabled>提交审查</button>
        </div>
      </div>
      <div class="map-zone min0">
        <div class="map-head"><h2>并列理由分支</h2><span class="label muted" id="remaining">尚未回应：5 位</span></div>
        <svg id="reasonMap" role="img" aria-label="五种角色关切与总体审批之间的理由分布图"></svg>
        <div class="criteria" aria-label="五种关切的审查范围"><div class="criterion"><strong>技术可行</strong>关键环节能否完成，未知能否缓解</div><div class="criterion"><strong>人员风险</strong>知情是否充分，不可逆风险能否救援</div><div class="criterion"><strong>公共成本</strong>哪些目标被排挤，超支与失败由谁承担</div><div class="criterion"><strong>公平</strong>风险、决策权与收益是否落在不同群体</div><div class="criterion"><strong>科学收益</strong>知识是否必须由载人任务取得，有无替代</div></div>
        <aside class="panel result" id="result" aria-live="polite"><h2>审查原则</h2><p>五条分支回答的是不同问题。支持某一项，不能抵消另一项的担忧；未知也不能自动算作反对。提交后保留多数意见、少数意见与未解决条件。</p></aside>
      </div>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index:44,kicker:"MISSION REVIEW",title:"你会批准这次火星任务吗？",take:"风险、成本、公平与科学收益是不同问题；透明决定必须保留它们之间的冲突，而不是压成一个分数。"});
(function(){
  const roles=[
    {name:'工程师',dim:'技术可行',prompt:'关键环节能否由现有系统完成？未知是否有可接受的缓解方案？',reasons:['关键系统已有验证','关键故障仍缺缓解','未知项需先完成测试']},
    {name:'乘员代表',dim:'人员风险',prompt:'乘员承担哪些难以救援或不可逆的风险？知情同意是否充分？',reasons:['乘员已充分知情','救援能力仍不足','不可逆风险需再评估']},
    {name:'预算代表',dim:'公共成本',prompt:'投入会排挤哪些目标？超支与失败的责任由谁承担？',reasons:['投入与公共目标相称','超支责任尚不清楚','替代项目机会成本过高']},
    {name:'公平代表',dim:'公平',prompt:'风险、决策权与收益落在谁身上？谁没有被代表？',reasons:['受影响群体已有席位','承担风险者缺少决策权','收益与代价分配失衡']},
    {name:'科学家',dim:'科学收益',prompt:'哪些知识必须由载人任务取得？是否有风险更低的替代方式？',reasons:['载人任务有独特收益','机器人可取得主要知识','科学目标仍不够明确']}
  ];
  const initial=()=>({index:0,chosen:null,records:[],overall:'',complete:false}); let state=initial();
  const strip=document.querySelector('#roleStrip'), bank=document.querySelector('#reasonBank'), drop=document.querySelector('#dropZone'), stance=document.querySelector('#stance'), save=document.querySelector('#saveRole'), overall=document.querySelector('#overall'), submit=document.querySelector('#submit'), result=document.querySelector('#result');
  roles.forEach((r,i)=>{const el=document.createElement('div');el.className='role-dot';el.textContent=r.dim;strip.appendChild(el)});
  function choose(reason){state.chosen=reason;drop.textContent=reason;drop.classList.add('has');save.disabled=!stance.value;renderMap()}
  function renderRole(){const r=roles[state.index];document.querySelector('#roleName').textContent=r.name+' · '+r.dim;document.querySelector('#rolePrompt').textContent=r.prompt;state.chosen=null;stance.value='';save.disabled=true;drop.textContent='拖入一张核心理由卡，或聚焦理由后按回车';drop.classList.remove('has');bank.innerHTML='';r.reasons.forEach(txt=>{const b=document.createElement('button');b.className='reason';b.innerHTML='<strong>'+['支持依据','阻断条件','待确认未知'][r.reasons.indexOf(txt)]+'</strong><span>'+txt+'</span>';b.draggable=true;b.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',txt));b.addEventListener('click',()=>choose(txt));bank.appendChild(b)});[...strip.children].forEach((e,i)=>e.className='role-dot '+(i<state.index?'done':i===state.index?'active':''));}
  drop.addEventListener('dragover',e=>e.preventDefault());drop.addEventListener('drop',e=>{e.preventDefault();choose(e.dataTransfer.getData('text/plain'))});
  stance.addEventListener('change',()=>save.disabled=!(stance.value&&state.chosen));
  save.addEventListener('click',()=>{state.records.push({role:roles[state.index],stance:stance.value,reason:state.chosen});state.index++;if(state.index<roles.length)renderRole();else{document.querySelector('.role-card').style.display='none';overall.disabled=false;document.querySelector('#remaining').textContent='五种关切均已回应'}renderMap()});
  overall.addEventListener('change',()=>{state.overall=overall.value;submit.disabled=!state.overall});
  submit.addEventListener('click',()=>{if(state.complete){state=initial();document.querySelector('.role-card').style.display='block';overall.value='';overall.disabled=true;submit.disabled=true;submit.textContent='提交审查';result.querySelector('h2').textContent='审查原则';result.querySelector('p').textContent='五条分支回答的是不同问题。支持某一项，不能抵消另一项的担忧；未知也不能自动算作反对。提交后保留多数意见、少数意见与未解决条件。';renderRole();renderMap();return}state.complete=true;showResult();submit.textContent='重新审查';});
  function renderMap(){const svg=d3.select('#reasonMap'),w=780,h=318;svg.attr('viewBox',`0 0 ${w} ${h}`).selectAll('*').remove();const rows=roles.map((r,i)=>state.records[i]||{role:r,stance:'待回应',reason:i===state.index&&state.chosen?state.chosen:'—'});const colors={'支持':'#247a55','附条件':'#a76008','反对':'#b33b45','待回应':'#8799ae'};svg.selectAll('rect.lane').data(rows).join('rect').attr('class','lane').attr('x',8).attr('y',(d,i)=>12+i*57).attr('width',764).attr('height',44).attr('rx',8).attr('fill',(d,i)=>i%2?'#f4f7fb':'#eaf1f8');svg.append('line').attr('x1',155).attr('x2',155).attr('y1',36).attr('y2',282).attr('stroke','#8799ae').attr('stroke-width',3);const g=svg.selectAll('g.branch').data(rows).join('g').attr('class','branch').attr('transform',(d,i)=>`translate(0,${34+i*57})`);g.append('text').attr('x',16).attr('y',6).style('font-size','16px').style('font-weight',700).text(d=>d.role.dim);g.append('line').attr('x1',155).attr('x2',205).attr('stroke',d=>colors[d.stance]).attr('stroke-width',4);g.append('circle').attr('cx',205).attr('r',8).attr('fill',d=>colors[d.stance]);g.append('text').attr('x',225).attr('y',6).style('font-size','16px').style('font-weight',700).attr('fill',d=>colors[d.stance]).text(d=>d.stance);g.append('text').attr('x',325).attr('y',6).style('font-size','16px').text(d=>d.reason);document.querySelector('#remaining').textContent=state.records.length===5?'五种关切均已回应':'尚未回应：'+(5-state.records.length)+' 位';}
  function showResult(){const counts=d3.rollup(state.records,v=>v.length,d=>d.stance),max=d3.max(Array.from(counts.values()));const majority=Array.from(counts).filter(d=>d[1]===max).map(d=>d[0]).join('、');const minority=state.records.filter(d=>d.stance!==majority).map(d=>d.role.dim+'：'+d.stance).join('；')||'无单独少数意见';const conditions=state.records.filter(d=>d.stance==='附条件'||/仍|缺|不足|失衡|过高/.test(d.reason)).map(d=>d.role.dim).join('、')||'没有记录附加条件';result.classList.remove('hidden');result.querySelector('h2').textContent='总体决定：'+state.overall;result.querySelector('p').textContent='多数意见：'+majority+'。少数意见：'+minority+'。未解决条件：'+conditions+'。这些理由并列保留，不合成为总分。';}
  renderRole();renderMap();
})();
</script>
</body>
</html>
