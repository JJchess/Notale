<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>离开地面，没有离开自己的来处</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .finale{height:100%;display:flex;flex-direction:column;gap:12px;min-width:0}
  .plate{position:relative;height:236px;flex:0 0 236px;overflow:hidden;background:linear-gradient(110deg,var(--surface),var(--surface-soft));border:1px solid var(--line);border-radius:var(--r-md)}
  .plate::before{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;opacity:.22;content:""}
  .plate svg{position:absolute;inset:0;width:100%;height:100%}
  .wire{fill:none;stroke:var(--primary);stroke-width:2}
  .ghost{fill:none;stroke:var(--line-strong);stroke-width:1.5;stroke-dasharray:6 6}
  .earth{fill:var(--primary-soft);stroke:var(--primary);stroke-width:2}
  .flame{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
  .call{position:absolute;padding:5px 10px;color:var(--primary-strong);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);font-size:var(--fs-label);font-weight:700;line-height:var(--lh-tight);box-shadow:var(--shadow-soft)}
  .c1{left:24px;top:20px}.c2{left:170px;top:174px}.c3{left:390px;top:24px}.c4{right:198px;top:25px}.c5{right:24px;top:171px}
  .axis-note{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:4px 12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;font-size:var(--fs-label);line-height:var(--lh-tight)}
  .compare{--comparison-cols:168px minmax(0,1fr) minmax(0,1.35fr);flex:1 1 auto}
  .compare > *{padding:8px 14px}
  .compare .hdr{font-size:var(--fs-body)}
  .compare .dim{display:flex;align-items:center;justify-content:flex-end;font-size:var(--fs-label)}
  .compare .cell{display:flex;align-items:center;font-size:var(--fs-sec);line-height:var(--lh-tight)}
  .compare .diff{font-weight:700}
  .claim{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 20px;color:var(--primary-strong);background:var(--primary-soft);border-left:8px solid var(--primary);font-size:var(--fs-lead);font-weight:800;line-height:var(--lh-tight)}
  .claim span+span{padding-left:18px;border-left:1px solid var(--line-strong)}
</style>
</head>
<body data-page="45" data-total="45">
<div id="stage">
<main id="main">
  <section class="finale min0" aria-label="从猿类谱系到太空生命保障的综合比较">
    <figure class="plate" aria-labelledby="plate-caption">
      <svg viewBox="0 0 1408 236" role="img" aria-label="谱系、直立身体、火种、月面脚印、轨道和生命保障共同连接到宇航员">
        <path class="ghost" d="M82 63 H210 L270 112 H440 L510 73 H650 M758 72 H925 C990 72 1004 24 1080 24 H1284 M758 149 H930 C1000 149 1028 205 1100 205 H1306"/>
        <path class="wire" d="M82 63v42m0-20-28 25m28-25 30 25m0-25 30-24M210 112c18-31 34-31 52 0 18-31 34-31 52 0"/>
        <path class="flame" d="M430 127c-18-22 8-42 5-67 26 18 35 39 19 57 15-7 24-20 27-32 16 34-2 61-31 61-19 0-31-7-40-20 8 4 14 4 20 1z"/>
        <g class="wire"><circle cx="704" cy="48" r="22"/><path d="M675 76Q704 65 733 76l15 73-18 56h-22l-4-54-4 54h-22l-18-56zM677 82l-47 58m101-58 47 58M683 49h42M688 41q16-15 32 0"/><rect x="661" y="82" width="22" height="58" rx="5"/></g>
        <path class="wire" d="M825 170q22-18 43 0-5 16-21 18-17-2-22-18zm10 0 5-12m13 12 8-13"/>
        <ellipse class="ghost" cx="1150" cy="116" rx="160" ry="72" transform="rotate(-12 1150 116)"/>
        <circle class="earth" cx="1160" cy="116" r="54"/><path class="wire" d="M1121 101q23-25 45-5t45 2m-88 37q29-17 72 5M1160 62q-25 52 0 108m0-108q28 54 0 108"/>
        <circle class="wire" cx="1160" cy="116" r="76"/><path class="ghost" d="M1106 61q54-36 108 0M1106 171q54 36 108 0"/>
      </svg>
      <span class="call c1">分叉谱系</span><span class="call c2">直立身体</span><span class="call c3">跨代火种</span><span class="call c4">轨道与月面</span><span class="call c5">生命保障环</span>
      <figcaption id="plate-caption" class="axis-note">文化与工程层层叠加，没有替换猿类身体</figcaption>
    </figure>

    <div class="k-comparison compare min0" aria-label="五个维度的对照">
      <div class="hdr">维度</div><div class="hdr">看似完成的跨越</div><div class="hdr">始终存在的依赖</div>
      <div class="rowline"></div>
      <div class="dim">谱系</div><div class="cell">从猿到人</div><div class="cell diff">人类仍位于猿类分叉树内</div>
      <div class="rowline"></div>
      <div class="dim">身体</div><div class="cell">从四足祖先到直立身体</div><div class="cell diff">身体特征以不同速度镶嵌变化</div>
      <div class="rowline"></div>
      <div class="dim">文化</div><div class="cell">从个体能力到复杂技术</div><div class="cell diff">能力由跨代文化保存和累积</div>
      <div class="rowline"></div>
      <div class="dim">航天</div><div class="cell">从地面到轨道与月面</div><div class="cell diff">抵达依靠能源、计算、材料与组织系统</div>
      <div class="rowline"></div>
      <div class="dim">环境</div><div class="cell">从地球环境到太空舱</div><div class="cell diff">身体仍需空气、水、压力、温度与循环</div>
    </div>

    <div class="claim"><span>太空人不是演化阶梯顶端的新物种，而是仍属于猿类的人。</span><span>越过地球边界，靠累积文化与协作，也要携带一小部分地球条件。</span></div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 45,
  kicker: "RETURN / 回望",
  title: "离开地面，没有离开自己的来处",
  take: "从分叉谱系到生命保障，太空人始终是一只借助累积文化并携带地球条件的猿"
});
</script>
</body>
</html>
