<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main.opening-scene {
    isolation: isolate;
    background:
      linear-gradient(112deg, rgba(26, 32, 34, 0.3), rgba(17, 20, 23, 0.06) 54%, rgba(8, 12, 13, 0.46)),
      var(--surface);
  }

  .opening-scene.k-generalization {
    grid-template-rows: 214px minmax(0, 1fr);
    gap: 0;
  }

  .opening-scene.k-generalization > .claim {
    width: 716px;
    max-width: none;
    box-sizing: border-box;
    margin: 78px 0 0 116px;
    padding: 0 0 0 var(--sp-5);
    background: rgba(26, 32, 34, 0.84);
    border-left-color: var(--accent);
    box-shadow: 0 22px 56px rgba(0, 0, 0, 0.24);
  }

  .claim-kicker {
    display: block;
    margin-bottom: var(--sp-3);
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 700;
    line-height: 1.35;
  }

  .claim-title {
    display: block;
    max-width: 15ch;
    color: var(--text);
    font-size: var(--fs-h1);
    font-weight: 700;
    line-height: var(--lh-heading);
  }

  .claim-title span {
    display: block;
  }

  .claim-line span {
    display: inline-block;
  }

  .claim-line {
    display: block;
    max-width: 33em;
    margin-top: var(--sp-4);
    color: var(--text-secondary);
    font-size: var(--fs-lead);
    font-weight: 500;
    line-height: var(--lh-body);
  }

  .claim-line strong {
    color: var(--text);
  }

  .opening-scene.k-generalization > .supports {
    --support-cols: 3;
    position: relative;
    display: block;
    min-height: 0;
    padding-top: 0;
  }

  .opening-scene.k-generalization > .supports::before {
    display: none;
  }

  .opening-scene.k-generalization > .supports > .trunk {
    top: -214px;
    right: -96px;
    bottom: -48px;
    left: -96px;
    width: auto;
    height: auto;
    background: transparent;
    transform: none;
  }

  .scene-art {
    display: block;
    width: 100%;
    height: 100%;
  }

  .opening-scene.k-generalization .support {
    position: absolute;
    z-index: 3;
    width: 220px;
    box-sizing: border-box;
    padding: 9px 12px 10px;
    color: var(--text-secondary);
    background: rgba(17, 20, 23, 0.84);
    border: 0;
    border-top: 2px solid var(--primary-line);
    border-radius: 0;
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
    backdrop-filter: blur(4px);
  }

  .opening-scene.k-generalization .support::before {
    display: none;
  }

  .support .object-name {
    display: block;
    color: var(--primary);
    font-size: var(--fs-label);
    font-weight: 700;
    line-height: 1.35;
  }

  .support .object-role {
    display: block;
    margin-top: 2px;
  }

  .support-foot {
    bottom: 12px;
    left: 26px;
  }

  .support-body {
    bottom: 54px;
    left: 554px;
  }

  .support-craft {
    top: -142px;
    right: 16px;
  }

  .footprint {
    opacity: 0;
    animation: print-in 500ms ease-out forwards;
  }

  .footprint.second {
    animation-delay: 170ms;
  }

  .continuity-line {
    stroke-dasharray: 1500;
    stroke-dashoffset: 1500;
    animation: draw-line 1350ms 360ms cubic-bezier(0.42, 0, 0.2, 1) forwards;
  }

  .claim-content {
    opacity: 0;
    transform: translateY(8px);
    animation: claim-in 520ms 1400ms ease-out forwards;
  }

  .interface-node {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: node-on 700ms 1450ms ease-out forwards;
  }

  @keyframes print-in {
    from { opacity: 0; }
    to { opacity: 0.88; }
  }

  @keyframes draw-line {
    to { stroke-dashoffset: 0; }
  }

  @keyframes claim-in {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes node-on {
    0% { opacity: 0; transform: scale(0.5); }
    48% { opacity: 1; transform: scale(1.55); }
    100% { opacity: 1; transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .footprint,
    .continuity-line,
    .claim-content,
    .interface-node {
      animation: none;
      opacity: 1;
      transform: none;
      stroke-dashoffset: 0;
    }
  }
</style>
</head>
