<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main {
    background:
      linear-gradient(90deg, rgba(85, 194, 176, 0.035) 1px, transparent 1px) 0 0 / 88px 100%,
      var(--surface);
  }

  .route-page {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
  }

  .route-question {
    display: flex;
    align-items: baseline;
    gap: var(--sp-5);
    min-width: 0;
    padding-bottom: var(--sp-4);
    border-bottom: 1px solid var(--line-strong);
    animation: question-in 420ms ease-out both;
  }

  .question-tag {
    flex: 0 0 152px;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 700;
    line-height: 1.35;
  }

  .question-copy {
    color: var(--text);
    font-size: var(--fs-lead);
    font-weight: 650;
    line-height: var(--lh-body);
  }

  .route-field {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    padding: var(--sp-4) 0;
  }

  .route-contour {
    position: absolute;
    z-index: 2;
    inset: 16px 48px;
    width: calc(100% - 96px);
    height: calc(100% - 32px);
    overflow: visible;
    pointer-events: none;
    fill: none;
    stroke: var(--primary);
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.5;
    opacity: 0.32;
  }

  .route-contour .measure {
    stroke: var(--line-strong);
    stroke-dasharray: 3 13;
    stroke-width: 1;
  }

  .route-contour .accent-start {
    fill: var(--accent);
    stroke: none;
  }

  .route-trunk {
    position: absolute;
    z-index: 2;
    top: 16px;
    bottom: 16px;
    left: 116px;
    width: 12px;
    background: linear-gradient(90deg, transparent 5px, var(--primary-line) 5px 7px, transparent 7px);
    transform-origin: top;
    animation: trunk-in 700ms 360ms ease-out both;
  }

  .route-trunk::before,
  .route-trunk::after {
    position: absolute;
    left: 50%;
    width: 9px;
    height: 9px;
    content: "";
    background: var(--primary);
    border: 2px solid var(--surface);
    border-radius: 50%;
    transform: translateX(-50%);
  }

  .route-trunk::before { top: 0; }
  .route-trunk::after { bottom: 0; }

  .ledger-head {
    display: grid;
    grid-template-columns: 48px 96px 176px minmax(0, 1fr) 210px;
    align-items: center;
    gap: var(--sp-5);
    height: 34px;
    margin: 0 48px;
    padding: 0 var(--sp-4) 0 56px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: 1.35;
    background: var(--surface);
    border-bottom: 1px solid var(--line-strong);
  }

  .ledger-head .object-head { grid-column: 3; }
  .ledger-head .question-head { grid-column: 4; }
  .ledger-head .scale-head { grid-column: 5; text-align: right; }

  .route-ledger.k-enumeration {
    --enum-cols: 1;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 0;
    height: calc(100% - 34px);
    margin: 0 48px;
    border-right: 1px solid var(--line);
    border-left: 1px solid var(--line);
  }

  .route-ledger.k-enumeration > .it {
    flex: 1 1 0;
    display: grid;
    grid-template-columns: 48px 96px 176px minmax(0, 1fr) 210px;
    align-items: center;
    align-content: center;
    gap: var(--sp-5);
    min-height: 0;
    padding: var(--sp-3) var(--sp-4) var(--sp-3) 56px;
    background: var(--surface-strong);
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    opacity: 1;
    transform: translateX(-18px);
    animation: item-in 340ms ease-out forwards;
  }

  .route-ledger.k-enumeration > .it:last-child {
    border-bottom-color: transparent;
  }

  .route-ledger.k-enumeration > .it:nth-child(1) { animation-delay: 760ms; }
  .route-ledger.k-enumeration > .it:nth-child(2) { animation-delay: 970ms; }
  .route-ledger.k-enumeration > .it:nth-child(3) { animation-delay: 1180ms; }
  .route-ledger.k-enumeration > .it:nth-child(4) { animation-delay: 1390ms; }

  .route-ledger.k-enumeration > .it::before {
    position: relative;
    z-index: 2;
    width: 36px;
    height: 36px;
    color: var(--primary);
    background: var(--surface);
    border-color: var(--primary);
    border-radius: 50%;
  }

  .route-ledger.k-enumeration > .it:first-child::before {
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
  }

  .route-glyph {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 88px;
    height: 58px;
    color: var(--primary);
  }

  .route-glyph svg {
    width: 82px;
    height: 52px;
    overflow: visible;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2;
  }

  .route-glyph .minor {
    stroke: var(--line-strong);
    stroke-width: 1.5;
  }

  .route-ledger.k-enumeration .it-title {
    align-self: center;
    color: var(--text);
    font-size: var(--fs-h2);
    line-height: var(--lh-heading);
  }

  .route-ledger.k-enumeration .it-body {
    grid-column: auto;
    color: var(--text-secondary);
    font-size: var(--fs-body);
    line-height: var(--lh-body);
  }

  .route-scale {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: var(--sp-3);
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .route-scale::before {
    width: 72px;
    height: 8px;
    content: "";
    opacity: 0.75;
    background: repeating-linear-gradient(90deg, var(--line-strong) 0 1px, transparent 1px 12px);
    border-bottom: 1px solid var(--line-strong);
  }

  .route-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-6);
    min-width: 0;
    padding-top: var(--sp-3);
    border-top: 1px solid var(--line-strong);
    animation: bottom-in 300ms 1580ms ease-out both;
  }

  .route-bottom p {
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
  }

  .route-bottom .dependency {
    color: var(--text);
    font-weight: 650;
  }

  .route-bottom .status {
    flex: 0 0 auto;
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  @keyframes question-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes trunk-in {
    from { transform: scaleY(0); }
    to { transform: scaleY(1); }
  }

  @keyframes item-in {
    to { transform: translateX(0); }
  }

  @keyframes bottom-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .route-question,
    .route-trunk,
    .route-ledger.k-enumeration > .it,
    .route-bottom {
      opacity: 1;
      transform: none;
      animation: none;
    }
  }
</style>
</head>
