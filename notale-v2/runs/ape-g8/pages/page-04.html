<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main { padding-top: 28px; padding-bottom: 24px; }
  .page04 { height: 100%; }
  .scene-head { align-items: flex-end; min-height: 52px; }
  .scene-head h2 { font-size: var(--fs-h2); }
  .scene-head p { max-width: 760px; color: var(--text-secondary); font-size: var(--fs-sec); line-height: var(--lh-sec); text-align: right; }

  .strata-scene {
    position: relative;
    flex: 1 1 0;
    min-height: 0;
    overflow: hidden;
    background: #151a1c;
    border-top: 1px solid var(--line-strong);
    border-bottom: 1px solid var(--line-strong);
  }
  .time-domain { position: absolute; z-index: 1; top: 48px; bottom: 46px; box-sizing: border-box; padding: 18px; pointer-events: none; }
  .time-domain.ancient { left: 18px; width: 31%; background: rgba(242,184,75,.055); border: 1px solid var(--accent-line); border-right-color: transparent; }
  .time-domain.modern { right: 18px; width: 28%; background: rgba(85,194,176,.055); border: 1px solid var(--primary-line); border-left-color: transparent; }
  .domain-title { color: var(--text); font-size: var(--fs-sec); font-weight: 700; line-height: var(--lh-sec); }
  .time-domain.ancient .domain-title { text-align: right; }
  .strata-visual { position: absolute; z-index: 2; top: 54px; right: 0; bottom: 58px; left: 0; width: 100%; height: calc(100% - 112px); pointer-events: none; }
  .domain-note { position: absolute; right: 18px; bottom: 14px; left: 18px; color: var(--text-secondary); font-size: var(--fs-sec); line-height: var(--lh-sec); }
  .era-band { position: absolute; top: 18px; z-index: 4; font-size: var(--fs-label); font-weight: 700; line-height: 1.35; }
  .era-ancient { left: 24px; color: var(--accent); }
  .era-modern { right: 24px; color: var(--primary); }
  .deep-gap { position: absolute; top: 18px; left: 394px; right: 318px; color: var(--text-muted); font-size: var(--fs-label); line-height: 1.35; text-align: center; }
  .deep-gap::before, .deep-gap::after { position: absolute; top: 10px; width: 33%; height: 1px; content: ""; background: var(--line); }
  .deep-gap::before { left: 0; }
  .deep-gap::after { right: 0; }

  .layers { position: absolute; inset: 54px 0 58px; overflow: hidden; }
  .layer { position: absolute; right: 0; left: 0; transform-origin: left center; }
  .layer-a { top: 0; height: 38px; background: #273034; border-bottom: 1px solid #455154; }
  .layer-b { top: 38px; height: 54px; background: #20282b; border-bottom: 1px solid #3b4749; }
  .layer-c { top: 92px; height: 68px; background: #293235; border-bottom: 1px solid #4a5658; }
  .layer-d { top: 160px; bottom: 0; background: #1c2325; }
  .ash-line { position: absolute; top: 89px; right: 0; left: 0; height: 5px; background: var(--accent); opacity: .52; }
  .footprint { position: absolute; left: 82px; top: 100px; width: 86px; height: 34px; border: 2px solid var(--accent-line); border-radius: 48% 52% 42% 58%; transform: rotate(-8deg); box-shadow: inset 0 0 18px rgba(242,184,75,.12); }
  .footprint::before { position: absolute; top: -13px; left: 7px; width: 48px; height: 18px; content: ""; border: 2px solid var(--accent-line); border-bottom: 0; border-radius: 50% 50% 0 0; }
  .footprint::after { position: absolute; top: -16px; right: 2px; width: 10px; height: 10px; content: ""; border: 2px solid var(--accent-line); border-radius: 50%; }
  .measure-line { position: absolute; z-index: 2; top: 92px; left: 160px; width: calc(100% - 230px); height: 2px; background: var(--primary-line); transform-origin: left center; }
  .measure-line::after { position: absolute; right: -1px; bottom: -5px; width: 10px; height: 10px; content: ""; border-top: 2px solid var(--primary); border-right: 2px solid var(--primary); transform: rotate(45deg); }

  .event-mark { position: absolute; z-index: 3; top: 68px; width: 2px; height: 76px; background: var(--line-strong); }
  .event-mark::before { position: absolute; top: -4px; left: -4px; width: 10px; height: 10px; content: ""; background: var(--surface); border: 2px solid var(--line-strong); border-radius: 50%; }
  .event-mark.done { background: var(--primary); }
  .event-mark.done::before { background: var(--primary); border-color: var(--primary); }
  .event-mark.active { background: var(--accent); }
  .event-mark.active::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
  .event-mark .mark-label { position: absolute; top: 84px; left: 50%; width: 126px; color: var(--text-secondary); font-size: var(--fs-label); line-height: 1.35; text-align: center; transform: translateX(-50%); }
  .event-mark.active .mark-label { color: var(--accent); font-weight: 700; }

  .sample-window { position: absolute; z-index: 8; top: 52px; left: 0; box-sizing: border-box; width: 236px; height: 188px; pointer-events: none; border: 3px solid var(--accent); background: rgba(242,184,75,.035); box-shadow: 0 0 0 1px rgba(17,20,23,.8), inset 0 0 24px rgba(242,184,75,.08); }
  .sample-window::before, .sample-window::after { position: absolute; width: 24px; height: 3px; content: ""; background: var(--accent); }
  .sample-window::before { top: 10px; left: -12px; }
  .sample-window::after { right: -12px; bottom: 10px; }
  .window-readout { position: absolute; z-index: 9; top: 58px; left: 0; width: 220px; pointer-events: none; }
  .window-readout .mode { color: var(--accent); font-family: var(--font-mono); font-size: var(--fs-label); font-weight: 700; line-height: 1.35; }
  .window-readout .detail { margin-top: 8px; color: var(--text); font-size: var(--fs-sec); line-height: var(--lh-sec); }

  .scene-feedback { position: absolute; z-index: 10; right: 24px; bottom: 12px; left: 24px; min-height: 24px; color: var(--text-secondary); font-size: var(--fs-sec); line-height: var(--lh-sec); }
  .scene-feedback.is-error { color: var(--danger); }
  .pulse { position: absolute; z-index: 7; top: 90px; left: 160px; width: 16px; height: 6px; opacity: 0; background: var(--primary); box-shadow: 0 0 14px var(--primary); border-radius: 2px; }

  .control-line { min-height: 50px; }
  .control-line label { width: 150px; color: var(--text); font-size: var(--fs-label); }
  #timeWindow { flex: 1 1 0; min-width: 0; }
  .target-count { width: 178px; color: var(--text-secondary); font-size: var(--fs-sec); line-height: var(--lh-sec); text-align: right; }
  .reset-btn { width: 44px; min-width: 44px; padding: 0; font-size: 22px; }

  .process-wrap { position: relative; min-height: 126px; }
  .page04 .k-process { --process-gap: 24px; height: 102px; padding: 10px 0 14px; }
  .page04 .k-process > .step { display: flex; flex-direction: column; justify-content: center; padding: 10px 12px; background: var(--surface-raised); }
  .page04 .k-process > .axis { top: 74%; }
  .page04 .k-process > .arw { top: 74%; right: calc(var(--process-gap) * -1 + 6px); width: calc(var(--process-gap) - 12px); }
  .step-num { color: var(--primary); font-family: var(--font-mono); font-size: var(--fs-tick); line-height: 1.35; }
  .step-title { margin-top: 3px; color: var(--text); font-size: var(--fs-label); font-weight: 650; line-height: 1.35; }
  .page04 .k-process > .step.is-done { filter: none; opacity: .62; }
  .page04 .k-process > .step.is-current { opacity: 1; }
  .era-divider { position: absolute; z-index: 5; top: 8px; bottom: 10px; left: 50%; width: 2px; background: var(--accent); }
  .era-divider span { position: absolute; top: -2px; left: 50%; width: 142px; padding: 2px 8px; color: var(--accent); background: var(--surface); font-size: var(--fs-label); line-height: 1.35; text-align: center; transform: translate(-50%,-100%); }
  .claim { display: none; min-height: 58px; padding: 10px 16px; color: var(--text); background: var(--primary-soft); border-left: 5px solid var(--primary); font-size: var(--fs-lead); font-weight: 700; line-height: var(--lh-body); }
  .claim.visible { display: block; }

  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body data-page="04" data-total="44">
<div id="stage">
<main id="main">
  <section class="page04 col gap-3" aria-labelledby="scene-title">
    <div class="scene-head row between gap-5">
      <h2 id="scene-title">沿同一地层尺，找出三种时间</h2>
      <p>拖动取样窗。每次松手，窗口会判断它靠近的是证据形成、现代研究，还是名称归属。</p>
    </div>

    <div class="strata-scene no-pan min0" id="strataScene">
      <div class="era-band era-ancient">远古地层 · 证据形成</div>
      <div class="deep-gap">跨越约数百万年</div>
      <div class="era-band era-modern">现代研究 · 解释形成</div>
      <div class="time-domain ancient"><div class="domain-note">灰面、脚印与覆盖层都在研究者出现之前形成。</div></div>
      <div class="time-domain modern"><div class="domain-title">研究记录</div><div class="domain-note">发现、测年和名称是后来形成的认识。</div></div>
      <svg class="strata-visual" viewBox="0 0 1408 220" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 34 C150 19 280 48 430 32 S740 48 900 31 S1210 46 1408 26 V72 C1210 90 1080 62 900 79 S590 61 430 82 S145 65 0 88 Z" fill="#273034" stroke="#455154" stroke-width="2"/>
        <path d="M0 88 C150 65 280 94 430 82 S740 100 900 79 S1210 96 1408 72 V132 C1200 145 1080 121 900 139 S600 119 430 143 S150 126 0 148 Z" fill="#20282b" stroke="#3b4749" stroke-width="2"/>
        <path d="M0 148 C150 126 280 157 430 143 S740 158 900 139 S1210 156 1408 132 V220 H0 Z" fill="#293235" stroke="#4a5658" stroke-width="2"/>
        <path d="M160 118 H1260" stroke="#55c2b0" stroke-opacity=".58" stroke-width="3" stroke-dasharray="10 12"/>
        <path d="M1250 110 L1264 118 L1250 126" fill="none" stroke="#55c2b0" stroke-width="3"/>
        <g stroke="#61716f" stroke-width="2"><path d="M90 42 V176"/><path d="M230 42 V176"/><path d="M370 42 V176"/><path d="M1030 42 V176"/><path d="M1168 42 V176"/><path d="M1306 42 V176"/></g>
      </svg>
      <div class="layers" aria-hidden="true">
        <div class="layer layer-a"></div><div class="layer layer-b"></div><div class="layer layer-c"></div><div class="layer layer-d"></div>
        <div class="ash-line"></div><div class="footprint"></div><div class="measure-line"></div><div class="pulse"></div>
      </div>
      <div class="sample-window" id="sampleWindow" aria-hidden="true"></div>
      <div class="window-readout" id="windowReadout"><div class="mode">取样窗</div><div class="detail">当前观察：火山灰与被覆盖的脚印层</div></div>
      <div class="scene-feedback" id="feedback" aria-live="polite">先定位“脚印形成”。</div>
    </div>

    <div class="control-line ctl row gap-4">
      <label for="timeWindow">拖动地层时间窗</label>
      <input id="timeWindow" type="range" min="0" max="100" step="1" value="8" aria-describedby="feedback">
      <div class="target-count" id="targetCount">已定位 0 / 3 个时间目标</div>
      <button class="reset-btn" id="resetBtn" type="button" title="重置时间窗" aria-label="重置时间窗">↺</button>
    </div>

    <div class="process-wrap min0">
      <div class="k-process" id="processChain" aria-label="证据形成到解释形成的六步过程">
        <div class="axis" aria-hidden="true"></div>
        <div class="step" data-step="0"><span class="step-num">01</span><span class="step-title">火山灰形成表面</span><span class="arw" aria-hidden="true"></span></div>
        <div class="step" data-step="1"><span class="step-num">02</span><span class="step-title">行走留下脚印</span><span class="arw" aria-hidden="true"></span></div>
        <div class="step" data-step="2"><span class="step-num">03</span><span class="step-title">沉积覆盖保存</span><span class="arw" aria-hidden="true"></span></div>
        <div class="step" data-step="3"><span class="step-num">04</span><span class="step-title">研究者发现记录</span><span class="arw" aria-hidden="true"></span></div>
        <div class="step" data-step="4"><span class="step-num">05</span><span class="step-title">地层与测年定年</span><span class="arw" aria-hidden="true"></span></div>
        <div class="step" data-step="5"><span class="step-num">06</span><span class="step-title">比较后给出标签</span></div>
      </div>
      <div class="era-divider" aria-hidden="true"><span>证据年龄 ≠ 命名日期</span></div>
    </div>

    <div class="claim" id="claim" aria-live="polite"></div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
(function () {
  'use strict';

  var mountInfo = {
    index: 4,
    kicker: 'EVIDENCE / LABEL',
    title: '脚印有两个时间：留下时与命名时',
    take: '证据先形成；发现、测年与命名发生在很久以后。',
    act: 'EVIDENCE / LABEL',
    sub: '证据先形成，解释后来到。',
    foot: '拖动地层时间窗，依次定位三个时间目标。'
  };
  Lec.mount(mountInfo);

  var scene = document.getElementById('strataScene');
  var slider = document.getElementById('timeWindow');
  var sampleWindow = document.getElementById('sampleWindow');
  var readout = document.getElementById('windowReadout');
  var feedback = document.getElementById('feedback');
  var targetCount = document.getElementById('targetCount');
  var resetBtn = document.getElementById('resetBtn');
  var claim = document.getElementById('claim');
  var steps = Array.prototype.slice.call(document.querySelectorAll('.step'));
  var marks = [];
  var found = [false, false, false];
  var nextTarget = 0;
  var reduced = Deck.reduced();
  var ancientAge = (typeof Lec.K.LAETOLI_AGE_MA === 'number') ? Lec.K.LAETOLI_AGE_MA : 3.66;
  var ageText = '约 ' + Math.round(ancientAge * 100) + ' 万年前';
  var targets = [
    { value: 8, step: 1, label: '脚印形成', mode: ageText, detail: '行走者经过湿火山灰，脚印成为物理证据。' },
    { value: 78, step: 4, label: '现代研究', mode: '现代研究', detail: '研究者记录地层，并用测年工作估计形成时间。' },
    { value: 94, step: 5, label: '名称归属', mode: '可修正的标签', detail: '名称来自后来比较，不是脚印形成时自带的事实。' }
  ];

  function createMarks() {
    var values = [3, 8, 16, 70, 78, 94];
    var labels = ['灰面形成', '脚印留下', '覆盖保存', '发现记录', '测年定年', '名称归属'];
    values.forEach(function (value, i) {
      var mark = document.createElement('div');
      mark.className = 'event-mark';
      mark.style.left = 'calc(' + value + '% - 1px)';
      mark.innerHTML = '<span class="mark-label">' + labels[i] + '</span>';
      scene.appendChild(mark);
      marks.push(mark);
    });
  }

  function placeWindow(value, animate) {
    var usable = scene.clientWidth - sampleWindow.offsetWidth;
    var x = Math.round(usable * value / 100);
    var readX = Math.max(16, Math.min(scene.clientWidth - 236, x + 8));
    if (animate && !reduced) {
      gsap.to(sampleWindow, { x: x, duration: 0.28, ease: 'power2.out', overwrite: 'auto' });
      gsap.to(readout, { x: readX, duration: 0.28, ease: 'power2.out', overwrite: 'auto' });
    } else {
      gsap.set(sampleWindow, { x: x });
      gsap.set(readout, { x: readX });
    }
  }

  function nearestTarget(value) {
    var best = 0;
    var dist = Infinity;
    targets.forEach(function (target, i) {
      var d = Math.abs(value - target.value);
      if (d < dist) { dist = d; best = i; }
    });
    return { index: best, distance: dist };
  }

  function updateReadout(value) {
    var near = nearestTarget(value);
    var t = targets[near.index];
    var mode = readout.querySelector('.mode');
    var detail = readout.querySelector('.detail');
    if (near.distance <= 8) {
      mode.textContent = t.mode;
      detail.textContent = t.detail;
    } else if (value < 40) {
      mode.textContent = '远古地层';
      detail.textContent = '当前观察：脚印形成与保存的物理过程。';
    } else {
      mode.textContent = '跨越深时';
      detail.textContent = '这里没有同样密集的事件；继续移向现代研究端。';
    }
  }

  function renderProgress(activeStep) {
    steps.forEach(function (step, i) {
      step.classList.toggle('is-current', i === activeStep);
      step.classList.toggle('is-done', i < activeStep || (i === 1 && found[0]) || (i === 4 && found[1]) || (i === 5 && found[2]));
    });
    marks.forEach(function (mark, i) {
      var targetIndex = i === 1 ? 0 : (i === 4 ? 1 : (i === 5 ? 2 : -1));
      mark.classList.toggle('done', targetIndex >= 0 && found[targetIndex]);
      mark.classList.toggle('active', i === activeStep);
    });
    var count = found.filter(Boolean).length;
    targetCount.textContent = '已定位 ' + count + ' / 3 个时间目标';
  }

  function pulseLine() {
    if (reduced) { return; }
    gsap.fromTo('.pulse', { x: 0, autoAlpha: 0 }, { x: scene.clientWidth - 410, autoAlpha: 1, duration: 0.52, ease: 'power2.out', onComplete: function () { gsap.set('.pulse', { autoAlpha: 0 }); } });
  }

  function completeTarget(index) {
    var target = targets[index];
    found[index] = true;
    nextTarget = Math.min(3, index + 1);
    slider.value = String(target.value);
    placeWindow(target.value, true);
    updateReadout(target.value);
    renderProgress(target.step);
    feedback.classList.remove('is-error');
    feedback.textContent = index < 2 ? '已定位“' + target.label + '”。继续寻找“' + targets[index + 1].label + '”。' : '三个时间目标已连接：证据先形成，解释后来到。';
    pulseLine();

    if (index === 2) {
      var sentence = ageText + '是脚印留下的时间；我们发现、测定并给它名称，是发生在很久以后、而且仍可修正的认识过程。';
      claim.textContent = sentence;
      claim.classList.add('visible');
      if (!reduced) {
        gsap.fromTo(claim, { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power2.out' });
        gsap.to('.deep-gap', { color: 'var(--primary)', duration: 0.35 });
      }
    }
  }

  function reject(value, near) {
    var expected = targets[nextTarget];
    var seen = targets[near.index];
    feedback.classList.add('is-error');
    if (value < 40 && nextTarget > 0) {
      feedback.textContent = '这里是证据形成或保存的时间，不是研究者给出名称的时间。';
    } else if (value > 55 && nextTarget === 0) {
      feedback.textContent = '这里是后来研究的时间；先回到远古端定位脚印形成。';
    } else {
      feedback.textContent = '当前靠近“' + seen.label + '”；请按顺序寻找“' + expected.label + '”。';
    }
    if (!reduced) {
      gsap.timeline({ defaults: { duration: 0.07, ease: 'power1.inOut' } })
        .to(sampleWindow, { x: '-=7' }).to(sampleWindow, { x: '+=14' }).to(sampleWindow, { x: '-=7' })
        .to(sampleWindow, { duration: 0.24, x: Math.round((scene.clientWidth - sampleWindow.offsetWidth) * expected.value / 100), ease: 'power2.out' });
    } else {
      placeWindow(expected.value, false);
    }
    slider.value = String(expected.value);
    updateReadout(expected.value);
  }

  function evaluate() {
    if (nextTarget >= targets.length) { return; }
    var value = Number(slider.value);
    var near = nearestTarget(value);
    if (near.index === nextTarget && near.distance <= 7) {
      completeTarget(nextTarget);
    } else {
      reject(value, near);
    }
  }

  function reset() {
    found = [false, false, false];
    nextTarget = 0;
    slider.value = '8';
    claim.classList.remove('visible');
    claim.textContent = '';
    feedback.classList.remove('is-error');
    feedback.textContent = '先定位“脚印形成”。';
    renderProgress(-1);
    updateReadout(8);
    placeWindow(8, true);
  }

  slider.addEventListener('input', function () {
    var value = Number(slider.value);
    placeWindow(value, false);
    updateReadout(value);
    feedback.classList.remove('is-error');
    feedback.textContent = '松手后判断当前位置。';
  });
  slider.addEventListener('change', evaluate);
  resetBtn.addEventListener('click', reset);
  Deck.onResize(function () { placeWindow(Number(slider.value), false); });

  createMarks();
  renderProgress(-1);
  placeWindow(8, false);

  if (!reduced) {
    gsap.timeline({ defaults: { ease: 'power2.out' } })
      .from('.layer', { scaleX: 0, duration: 0.72, stagger: 0.06 }, 0)
      .from('.footprint', { scale: 0.72, autoAlpha: 0, duration: 0.42 }, 0.28)
      .from('.layer-a', { y: -26, duration: 0.46 }, 0.48)
      .from('.measure-line', { scaleX: 0, duration: 0.76 }, 0.72)
      .from('.event-mark', { autoAlpha: 0, y: 10, duration: 0.28, stagger: 0.05 }, 0.88)
      .from(sampleWindow, { autoAlpha: 0, scale: 0.98, duration: 0.35 }, 1.05);
  }
}());
</script>
</body>
</html>
