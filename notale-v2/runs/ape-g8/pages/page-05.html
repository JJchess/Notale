<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #111417;
  --text: #edf2f0;
  --font-sans: Inter, "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
}

#main {
  background:
    linear-gradient(rgba(85, 194, 176, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(85, 194, 176, 0.035) 1px, transparent 1px),
    var(--surface);
  background-size: 40px 40px;
}

.page-shell {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: var(--content-h);
  min-height: 0;
  gap: var(--sp-4);
}

.scene-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: 0 0 48px;
  min-width: 0;
  border-bottom: 1px solid var(--line);
}

.prompt-line {
  display: flex;
  align-items: center;
  min-width: 0;
  gap: var(--sp-4);
}

.prompt-mark {
  width: 10px;
  height: 10px;
  flex: 0 0 auto;
  background: var(--accent);
  transform: rotate(45deg);
}

#promptText {
  color: var(--text);
  font-size: var(--fs-lead);
  line-height: var(--lh-body);
}

.status-tools {
  display: flex;
  align-items: center;
  flex: 0 0 auto;
  gap: var(--sp-4);
}

.progress-readout {
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
}

.progress-readout strong {
  color: var(--accent);
  font-size: var(--fs-lead);
}

.reset-button {
  width: var(--control-h);
  min-width: var(--control-h);
  padding: 0;
  font-size: 24px;
  line-height: 1;
}

.scene-body {
  display: flex;
  flex: 1 1 0;
  min-height: 0;
  gap: var(--sp-5);
}

.lineage-figure {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: rgba(17, 20, 23, 0.68);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
}

.lineage-figure::before {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 78px;
  width: 1px;
  content: "";
  background: linear-gradient(transparent, var(--primary-line) 12%, var(--primary-line) 88%, transparent);
}

.figure-label {
  position: absolute;
  z-index: 2;
  top: 14px;
  left: 18px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: var(--fs-label);
  line-height: 1.35;
}

.relation-note {
  position: absolute;
  z-index: 3;
  max-width: 190px;
  padding: 5px 9px;
  color: var(--text-secondary);
  background: rgba(34, 41, 43, 0.94);
  border-left: 3px solid var(--primary);
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
  pointer-events: none;
}

.relation-note.n1 { left: 4%; top: 61%; }
.relation-note.n2 { left: 29%; top: 18%; }
.relation-note.n3 { right: 3%; top: 18%; }
.relation-note.n4 { right: 3%; top: 43%; }

#lineageSvg {
  display: block;
  width: 100%;
  height: 100%;
}

.guide-line {
  stroke: var(--line);
  stroke-width: 1;
  stroke-dasharray: 3 9;
}

.path-band {
  fill: none;
  stroke: rgba(85, 194, 176, 0.08);
  stroke-width: 42;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.path-band.ended {
  stroke: rgba(141, 155, 152, 0.08);
}

.footprint {
  fill: var(--primary-soft);
  stroke: rgba(85, 194, 176, 0.28);
  stroke-width: 1.5;
}

.footprint.ended {
  fill: rgba(141, 155, 152, 0.12);
  stroke: rgba(141, 155, 152, 0.34);
}

.link {
  fill: none;
  stroke: var(--primary-line);
  stroke-width: 3;
  vector-effect: non-scaling-stroke;
}

.link.disputed {
  stroke: var(--text-muted);
  stroke-dasharray: 7 8;
}

.link.hidden-link {
  opacity: 0;
}

.link.revealed {
  opacity: 1;
  stroke-dasharray: none;
}

.link.disputed.revealed {
  stroke-dasharray: 7 8;
}

.node-dot {
  fill: var(--surface);
  stroke: var(--primary);
  stroke-width: 3;
  vector-effect: non-scaling-stroke;
}

.branch-hit {
  cursor: pointer;
  outline: none;
}

.branch-hit .node-halo {
  fill: transparent;
  stroke: transparent;
  stroke-width: 2;
}

.branch-hit:hover .node-halo,
.branch-hit:focus-visible .node-halo {
  fill: var(--primary-soft);
  stroke: var(--focus);
}

.branch-hit.is-found .node-dot {
  fill: var(--accent);
  stroke: var(--accent);
}

.branch-hit.is-found .node-halo {
  fill: var(--accent-soft);
  stroke: var(--accent-line);
}

.node-label {
  fill: var(--text);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.4;
  pointer-events: none;
}

.node-label.secondary-label {
  fill: var(--text-secondary);
  font-size: 15px;
}

.branch-code {
  fill: var(--accent);
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 700;
  pointer-events: none;
}

.terminal {
  opacity: 0;
  transition: opacity 220ms ease;
}

.terminal.visible,
.terminal.decoy {
  opacity: 1;
}

.terminal-mark {
  fill: var(--surface-raised);
  stroke: var(--line-strong);
  stroke-width: 2;
}

.terminal.decoy {
  cursor: pointer;
  outline: none;
}

.terminal.decoy:hover .terminal-mark,
.terminal.decoy:focus-visible .terminal-mark {
  stroke: var(--focus);
}

.terminal-stop {
  stroke: var(--text-muted);
  stroke-width: 3;
}

.completion-banner {
  position: absolute;
  z-index: 4;
  top: 54px;
  right: 28px;
  bottom: auto;
  left: 292px;
  padding: var(--sp-3) var(--sp-5);
  color: var(--text);
  background: rgba(17, 20, 23, 0.94);
  border: 1px solid var(--accent-line);
  border-left: 5px solid var(--accent);
  font-size: var(--fs-lead);
  font-weight: 700;
  line-height: var(--lh-body);
  visibility: hidden;
  opacity: 0;
  transform: translateY(8px);
  transition: visibility 0s linear 180ms, opacity 180ms ease, transform 180ms ease;
  pointer-events: none;
}

.completion-banner.visible {
  visibility: visible;
  opacity: 1;
  transform: translateY(0);
  transition-delay: 0s;
}

.judgement {
  flex: 0 0 400px;
  min-width: 0;
  min-height: 0;
  padding: var(--sp-4);
  background: rgba(17, 20, 23, 0.92);
  border-top: 3px solid var(--primary);
}

.judgement-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: var(--sp-3);
}

.judgement-title h2 {
  font-size: var(--fs-h2);
}

.judgement-title span {
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: var(--fs-label);
  line-height: 1.35;
}

.judgement.k-classification {
  gap: var(--sp-2);
}

.judgement.k-classification .lv {
  gap: var(--sp-2);
  margin-left: var(--sp-2);
  padding-left: var(--sp-2);
}

.judgement.k-classification > .lv {
  margin-left: 0;
}

.judgement.k-classification .lv::before {
  top: 18px;
  width: 11px;
}

.judgement.k-classification .box {
  padding: var(--sp-3);
  background: var(--surface);
  border-left-color: var(--line-strong);
  transition: border-color 160ms ease, background-color 160ms ease;
}

.judgement.k-classification .box > .bt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: calc(var(--sp-3) * -1) calc(var(--sp-3) * -1) var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
}

.class-state {
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: var(--fs-label);
  font-weight: 500;
}

.class-copy {
  color: var(--text-secondary);
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
}

.class-item.is-active .box,
.class-item.is-done .box {
  border-color: var(--accent-line);
  border-left-color: var(--accent);
}

.class-item.is-active .box {
  background: var(--accent-soft);
}

.class-item.is-done .class-state,
.class-item.is-active .class-state {
  color: var(--accent);
}

.reading-key {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--sp-1);
  margin-top: auto;
  padding-top: var(--sp-2);
  border-top: 1px solid var(--line);
}

.key-row {
  display: flex;
  align-items: center;
  min-width: 0;
  box-sizing: border-box;
  min-height: 30px;
  gap: var(--sp-1);
  padding: var(--sp-1) var(--sp-2);
  background: var(--surface-raised);
  border: 1px solid var(--line);
  border-left: 3px solid var(--primary);
  border-radius: var(--radius-sm);
}

.key-symbol {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  height: 26px;
  color: var(--primary);
  background: var(--primary-soft);
  border-left: 3px solid var(--primary);
  font-family: var(--font-mono);
  font-size: var(--fs-label);
  line-height: 1.35;
}

.key-copy {
  color: var(--text-secondary);
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
}

.legend-strip {
  display: flex;
  align-items: center;
  flex: 0 0 auto;
  gap: var(--sp-3);
  padding-top: var(--sp-1);
}

.legend-strip .legend-item {
  color: var(--text-secondary);
  font-size: var(--fs-label);
  line-height: 1.35;
}

.legend-line {
  width: 28px;
  height: 0;
  border-top: 3px solid var(--primary);
}

.legend-line.disputed {
  border-top-color: var(--text-muted);
  border-top-style: dashed;
}

.shake {
  animation: node-shake 260ms ease-in-out;
}

@keyframes node-shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-7px); }
  75% { transform: translateX(7px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body data-page="05" data-total="44">
<div id="stage">
<main id="main">
  <section class="page-shell min0" aria-label="人类谱系分叉判读">
    <div class="scene-head">
      <div class="prompt-line min0">
        <span class="prompt-mark" aria-hidden="true"></span>
        <p id="promptText">先找出：现生黑猩猩支系与人类支系在哪里分开？</p>
      </div>
      <div class="status-tools">
        <div class="progress-readout" aria-live="polite">已找到 <strong id="foundCount">0</strong>／3 处分叉</div>
        <button id="resetButton" class="reset-button" type="button" title="折叠并重置谱系图" aria-label="折叠并重置谱系图">↺</button>
      </div>
    </div>

    <div class="scene-body min0">
      <figure class="lineage-figure min0" aria-labelledby="figureCaption">
        <figcaption id="figureCaption" class="figure-label">概括模型 · 纵向位置不表示高低</figcaption>
        <svg id="lineageSvg" viewBox="0 0 930 530" role="group" aria-label="可点选分叉的人类谱系概括图"></svg>
        <span class="relation-note n1">共同祖先：亲缘关系，不是前后站点</span>
        <span class="relation-note n2">分叉：一处分出多条支系</span>
        <span class="relation-note n3">并存：不同末端可同时存在</span>
        <span class="relation-note n4">终止：未延续不等于失败</span>
        <div id="completionBanner" class="completion-banner" role="status">没有一条通往必然终点的主线</div>
      </figure>

      <aside class="judgement k-classification min0" aria-label="谱系关系分类判读">
        <div class="judgement-title">
          <h2>关系判读</h2>
          <span>归属层级</span>
        </div>

        <div class="lv class-item" data-class="ancestor">
          <div class="box">
            <div class="bt"><span>共同祖先</span><span class="class-state">待判读</span></div>
            <p class="class-copy">黑猩猩不是人类祖先；两者来自共同祖先。</p>
          </div>
          <div class="lv class-item" data-class="branch">
            <div class="box">
              <div class="bt"><span>分叉支系</span><span class="class-state">待展开</span></div>
              <p class="class-copy">Australopithecus、Paranthropus 与 Homo 是代表性支系。</p>
            </div>
            <div class="lv class-item" data-class="coexist">
              <div class="box">
                <div class="bt"><span>并存末端</span><span class="class-state">待展开</span></div>
                <p class="class-copy">Homo sapiens 与尼安德特人曾是不同的并存支系。</p>
              </div>
              <div class="lv class-item" data-class="ended">
                <div class="box">
                  <div class="bt"><span>终止支系</span><span class="class-state">待展开</span></div>
                  <p class="class-copy">没有延续到今天，不等于失败或较低级。</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="reading-key" aria-label="谱系图读图规则">
          <div class="key-row"><span class="key-symbol">Y 形</span><span class="key-copy">共同点分出多支</span></div>
          <div class="key-row"><span class="key-symbol">平行</span><span class="key-copy">不同支系可并存</span></div>
          <div class="key-row"><span class="key-symbol">停止线</span><span class="key-copy">支系没有延续</span></div>
          <div class="legend-strip" aria-label="连线图例">
            <span class="legend-item"><i class="legend-line" aria-hidden="true"></i>概括关系</span>
            <span class="legend-item"><i class="legend-line disputed" aria-hidden="true"></i>连接仍有争议</span>
          </div>
        </div>
      </aside>
    </div>
  </section>
</main>
</div>

<script>
Lec.mount({
  index: 5,
  kicker: "BRANCHING LINEAGES",
  title: "人类谱系更像灌木",
  take: "人类谱系不是一条从猿到人的升级路线，而是不断分叉、共存并有许多支系消失的灌木。现生猿类是我们的亲缘支系，不是停留在过去的祖先。"
});

(function () {
  var svg = d3.select("#lineageSvg");
  var reduced = Deck.reduced();
  var state = { found: [] };

  var nodes = [
    { id: "root", x: 92, y: 268, label: "共同祖先", type: "root" },
    { id: "b1", x: 270, y: 268, code: "分叉 A", type: "branch", step: 0 },
    { id: "chimp", x: 450, y: 92, label: "现生黑猩猩支系", type: "terminal", reveal: 0 },
    { id: "b2", x: 450, y: 310, code: "分叉 B", type: "branch", step: 1 },
    { id: "australo", x: 650, y: 190, label: "Australopithecus", sub: "代表性支系", type: "terminal", reveal: 1 },
    { id: "paranth", x: 650, y: 325, label: "Paranthropus", sub: "终止支系", type: "terminal", reveal: 1, decoy: true },
    { id: "b3", x: 650, y: 420, code: "分叉 C", type: "branch", step: 2 },
    { id: "neander", x: 842, y: 370, label: "尼安德特人", sub: "终止支系", type: "terminal", reveal: 2, decoy: true },
    { id: "sapiens", x: 842, y: 472, label: "Homo sapiens", sub: "延续至今", type: "terminal", reveal: 2 }
  ];

  var links = [
    { source: "root", target: "b1", base: true },
    { source: "b1", target: "chimp", reveal: 0 },
    { source: "b1", target: "b2", reveal: 0 },
    { source: "b2", target: "australo", reveal: 1, disputed: true },
    { source: "b2", target: "paranth", reveal: 1 },
    { source: "b2", target: "b3", reveal: 1 },
    { source: "b3", target: "neander", reveal: 2 },
    { source: "b3", target: "sapiens", reveal: 2 }
  ];

  var byId = new Map(nodes.map(function (d) { return [d.id, d]; }));
  var prompts = [
    "先找出：现生黑猩猩支系与人类支系在哪里分开？",
    "再找出：代表性早期支系在哪里分开？",
    "最后找出：Homo 的两个末端支系在哪里分开？",
    "完整灌木同时包含分叉、并存与终止。"
  ];
  var explanations = [
    "两条亲缘支系从共同祖先处分开。",
    "这里展开多个支系，不是一条路线的下一站。",
    "两个 Homo 末端曾经并存，并非先后替换。"
  ];

  function elbow(d) {
    var s = byId.get(d.source);
    var t = byId.get(d.target);
    var mid = s.x + (t.x - s.x) * 0.48;
    return "M" + s.x + "," + s.y + "H" + mid + "V" + t.y + "H" + t.x;
  }

  svg.append("g")
    .selectAll("line")
    .data([92, 270, 450, 650, 842])
    .join("line")
    .attr("class", "guide-line")
    .attr("x1", function (d) { return d; })
    .attr("x2", function (d) { return d; })
    .attr("y1", 58)
    .attr("y2", 500);

  var footprintPaths = [
    { ended: false, points: [[26, 276], [57, 255], [86, 279], [118, 258], [149, 279], [181, 259], [213, 276]] },
    { ended: false, points: [[323, 248], [356, 215], [389, 181], [421, 148], [454, 116], [488, 87], [526, 72], [566, 64]] },
    { ended: true, points: [[510, 330], [546, 337], [582, 325], [618, 334], [654, 326], [690, 336], [726, 327], [762, 335]] },
    { ended: false, points: [[694, 427], [726, 446], [757, 459], [789, 471], [821, 480], [853, 488], [885, 494]] }
  ];

  var footprintGroup = svg.append("g").attr("aria-hidden", "true");
  footprintPaths.forEach(function (path, pathIndex) {
    footprintGroup.append("path")
      .attr("class", "path-band" + (path.ended ? " ended" : ""))
      .attr("d", d3.line().curve(d3.curveCatmullRom.alpha(0.5))(path.points));
    footprintGroup.selectAll("ellipse.foot-" + pathIndex)
      .data(path.points)
      .join("ellipse")
      .attr("class", "footprint" + (path.ended ? " ended" : ""))
      .attr("cx", function (d) { return d[0]; })
      .attr("cy", function (d) { return d[1]; })
      .attr("rx", 8)
      .attr("ry", 15)
      .attr("transform", function (d, i) {
        return "rotate(" + (i % 2 ? 24 : -20) + " " + d[0] + " " + d[1] + ")";
      });
  });

  var linkSel = svg.append("g")
    .attr("aria-hidden", "true")
    .selectAll("path")
    .data(links)
    .join("path")
    .attr("class", function (d) {
      return "link" + (d.disputed ? " disputed" : "") + (d.base ? " revealed" : " hidden-link");
    })
    .attr("d", elbow);

  var staticNodes = svg.append("g")
    .selectAll("g")
    .data(nodes.filter(function (d) { return d.type === "root" || d.type === "terminal"; }))
    .join("g")
    .attr("class", function (d) {
      return d.type === "root" ? "terminal visible" : "terminal" + (d.decoy ? " decoy" : "");
    })
    .attr("transform", function (d) { return "translate(" + d.x + "," + d.y + ")"; })
    .attr("tabindex", function (d) { return d.decoy ? 0 : null; })
    .attr("role", function (d) { return d.decoy ? "button" : null; })
    .attr("aria-label", function (d) { return d.decoy ? d.label + "，支系末端" : null; });

  staticNodes.append("rect")
    .attr("class", "terminal-mark")
    .attr("x", -9)
    .attr("y", -9)
    .attr("width", 18)
    .attr("height", 18)
    .attr("transform", "rotate(45)");

  staticNodes.filter(function (d) { return d.type === "terminal"; })
    .append("line")
    .attr("class", "terminal-stop")
    .attr("x1", 13)
    .attr("x2", 13)
    .attr("y1", -11)
    .attr("y2", 11);

  staticNodes.append("text")
    .attr("class", "node-label")
    .attr("x", 22)
    .attr("y", -2)
    .text(function (d) { return d.label; });

  staticNodes.filter(function (d) { return d.sub; })
    .append("text")
    .attr("class", "node-label secondary-label")
    .attr("x", 22)
    .attr("y", 20)
    .text(function (d) { return d.sub; });

  var branchNodes = svg.append("g")
    .selectAll("g")
    .data(nodes.filter(function (d) { return d.type === "branch"; }))
    .join("g")
    .attr("class", "branch-hit")
    .attr("transform", function (d) { return "translate(" + d.x + "," + d.y + ")"; })
    .attr("tabindex", 0)
    .attr("role", "button")
    .attr("aria-label", function (d) { return d.code + "，点选并展开相邻支系"; })
    .attr("aria-pressed", "false");

  branchNodes.append("circle").attr("class", "node-halo").attr("r", 24);
  branchNodes.append("circle").attr("class", "node-dot").attr("r", 9);
  branchNodes.append("text")
    .attr("class", "branch-code")
    .attr("x", 0)
    .attr("y", -20)
    .attr("text-anchor", "middle")
    .text(function (d) { return d.code; });

  function setClassState(name, status, text) {
    var item = document.querySelector('[data-class="' + name + '"]');
    item.classList.remove("is-active", "is-done");
    if (status) item.classList.add(status);
    item.querySelector(".class-state").textContent = text;
  }

  function update() {
    var count = state.found.length;
    document.getElementById("foundCount").textContent = count;
    document.getElementById("promptText").textContent = prompts[count];

    branchNodes
      .classed("is-found", function (d) { return state.found.indexOf(d.step) !== -1; })
      .attr("aria-pressed", function (d) { return state.found.indexOf(d.step) !== -1 ? "true" : "false"; });

    linkSel.each(function (d) {
      var visible = d.base || state.found.indexOf(d.reveal) !== -1;
      var path = d3.select(this);
      path.classed("hidden-link", !visible).classed("revealed", visible);
      if (visible && !reduced && !d.base) {
        var length = this.getTotalLength();
        path.attr("stroke-dasharray", length + " " + length)
          .attr("stroke-dashoffset", length)
          .transition().duration(380)
          .attr("stroke-dashoffset", 0)
          .on("end", function () {
            d3.select(this).attr("stroke-dasharray", d.disputed ? "7 8" : null);
          });
      }
    });

    staticNodes.classed("visible", function (d) {
      return d.type === "root" || state.found.indexOf(d.reveal) !== -1;
    });

    setClassState("ancestor", count > 0 ? "is-done" : "is-active", count > 0 ? "已判读" : "当前目标");
    setClassState("branch", count > 1 ? "is-done" : count === 1 ? "is-active" : "", count > 1 ? "已展开" : count === 1 ? "当前目标" : "待展开");
    setClassState("coexist", count === 3 ? "is-done" : count === 2 ? "is-active" : "", count === 3 ? "已判读" : count === 2 ? "当前目标" : "待展开");
    setClassState("ended", count === 3 ? "is-done" : "", count === 3 ? "已判读" : "待展开");
    document.getElementById("completionBanner").classList.toggle("visible", count === 3);
  }

  function activateBranch(event, d) {
    var next = state.found.length;
    if (state.found.indexOf(d.step) !== -1) return;
    if (d.step !== next) {
      wrongFeedback(event.currentTarget);
      return;
    }
    state.found.push(d.step);
    update();
    document.getElementById("promptText").textContent = state.found.length === 3 ? prompts[3] : explanations[d.step] + " " + prompts[state.found.length];
  }

  function wrongFeedback(el) {
    el.classList.remove("shake");
    void el.getBoundingClientRect();
    el.classList.add("shake");
    document.getElementById("promptText").textContent = "这里是支系末端；请点两条谱系分开的连接处。";
    window.setTimeout(function () {
      el.classList.remove("shake");
      document.getElementById("promptText").textContent = prompts[state.found.length];
    }, reduced ? 20 : 900);
  }

  branchNodes.on("click", activateBranch).on("keydown", function (event, d) {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      activateBranch(event, d);
    }
  });

  staticNodes.filter(function (d) { return d.decoy; })
    .on("click", function (event) { wrongFeedback(event.currentTarget); })
    .on("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        wrongFeedback(event.currentTarget);
      }
    });

  document.getElementById("resetButton").addEventListener("click", function () {
    state.found = [];
    update();
    branchNodes.filter(function (d) { return d.step === 0; }).node().focus();
  });

  update();
})();
</script>
</body>
</html>
