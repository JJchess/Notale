<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #111417;
  --text: #edf2f0;
  --font-sans: Inter, "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
}

#main { padding-top: 32px; padding-bottom: 32px; }

.lineage-generalization {
  height: 100%;
  gap: 16px;
}

.lineage-generalization > .claim {
  width: 100%;
  max-width: none;
  box-sizing: border-box;
  padding-top: 12px;
  padding-bottom: 12px;
}

.lineage-generalization > .supports {
  --support-cols: 4;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: 430px minmax(0, 1fr);
  gap: 12px 16px;
  padding-top: 0;
}

.lineage-generalization > .supports::before {
  top: 422px;
  right: 12.5%;
  left: 12.5%;
}

.lineage-generalization > .supports > .trunk {
  top: -16px;
  height: 438px;
}

.lineage-shell {
  position: relative;
  z-index: 1;
  grid-column: 1 / -1;
  grid-row: 1;
  align-self: stretch;
  display: flex;
  min-width: 0;
  overflow: hidden;
  background: #141a1c;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
}

.tree-zone {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  overflow: hidden;
  border-right: 1px solid var(--line);
  touch-action: none;
}

.tree-zone::after {
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  height: 56px;
  pointer-events: none;
  content: "";
  background:
    linear-gradient(180deg, transparent, rgba(20, 26, 28, 0.92)),
    repeating-linear-gradient(90deg, rgba(97, 113, 111, 0.18) 0 2px, transparent 2px 34px);
}

.era-bands {
  position: absolute;
  z-index: 0;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  pointer-events: none;
}

.era-band {
  position: relative;
  padding: 78px 12px 0;
  color: var(--text-muted);
  background: rgba(85, 194, 176, 0.09);
  border-right: 1px solid rgba(97, 113, 111, 0.34);
  font-family: var(--font-mono);
  font-size: var(--fs-label);
  line-height: 1.35;
  text-align: center;
}

.era-band:nth-child(even) { background: rgba(97, 113, 111, 0.16); }
.era-band:last-child { border-right: 0; }

.event-track {
  position: absolute;
  z-index: 4;
  top: 12px;
  right: 16px;
  left: 16px;
  display: flex;
  align-items: stretch;
  gap: 8px;
}

.event-step {
  position: relative;
  flex: 1 1 0;
  min-height: 28px;
  overflow: hidden;
  padding-top: 8px;
  color: var(--text-muted);
  border-top: 4px solid var(--surface-strong);
  font-size: var(--fs-label);
  line-height: 1.35;
  text-align: center;
}

.event-step.is-done { color: var(--text-secondary); border-top-color: var(--primary); }
.event-step.is-current { color: var(--accent); border-top-color: var(--accent); font-weight: 700; }

.tree-svg {
  display: block;
  width: 100%;
  height: 100%;
}

.time-line {
  stroke: var(--line);
  stroke-width: 1;
  stroke-dasharray: 4 8;
}

.time-label {
  fill: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 13px;
}

.branch {
  fill: none;
  stroke: var(--primary);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.branch.is-dead { stroke: var(--text-muted); }

.endpoint {
  fill: #141a1c;
  stroke: var(--primary);
  stroke-width: 3;
  transition: r 180ms ease, stroke 180ms ease, fill 180ms ease;
}

.endpoint.is-selected { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 5; }
.endpoint.is-dead { fill: var(--surface-strong); stroke: var(--text-muted); }
.endpoint.is-flash { stroke: var(--danger); }

.end-cap { stroke: var(--text-muted); stroke-width: 4; }
.measure-line { display: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 7 6; }
.measure-line.is-visible { display: block; }
.measure-label { display: none; fill: var(--accent); font-size: 15px; }
.measure-label.is-visible { display: block; }

.event-card {
  position: absolute;
  z-index: 7;
  bottom: 18px;
  left: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 276px;
  min-height: 54px;
  box-sizing: border-box;
  padding: 9px 14px;
  color: var(--text);
  background: var(--surface-soft);
  border: 2px solid var(--accent);
  border-radius: var(--radius-sm);
  cursor: grab;
  user-select: none;
  touch-action: none;
  transition: opacity 180ms ease, border-color 180ms ease, background-color 180ms ease;
}

.event-card:active { cursor: grabbing; }
.event-card.is-dragging { background: #2c3028; }
.event-card.is-shaking { animation: card-shake 220ms ease-in-out; }
.event-card[aria-disabled="true"] { cursor: default; opacity: 0; pointer-events: none; }

.event-icon {
  display: grid;
  flex: 0 0 34px;
  width: 34px;
  height: 34px;
  place-items: center;
  color: var(--bg);
  background: var(--accent);
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 800;
  line-height: 1;
}

.event-copy { display: flex; flex-direction: column; min-width: 0; }
.event-kind { font-size: var(--fs-body); font-weight: 700; line-height: 1.35; }
.event-hint { color: var(--text-secondary); font-size: var(--fs-label); line-height: 1.35; }

.rule-rail {
  display: flex;
  flex: 0 0 286px;
  flex-direction: column;
  box-sizing: border-box;
  padding: 18px 20px;
  background: var(--surface-raised);
}

.rail-kicker { color: var(--primary); font-family: var(--font-mono); font-size: var(--fs-label); font-weight: 700; line-height: 1.35; }
.rail-progress { margin-top: 4px; color: var(--text); font-family: var(--font-mono); font-size: var(--fs-h2); font-weight: 700; line-height: 1.35; }
.rail-rule { margin-top: 14px; color: var(--text-secondary); font-size: var(--fs-sec); line-height: var(--lh-sec); }
.rail-status { min-height: 52px; margin-top: 12px; color: var(--text); font-size: var(--fs-sec); line-height: var(--lh-sec); }
.rail-status.is-error { color: var(--danger); }

.reset-button {
  align-self: flex-end;
  min-width: 120px;
  margin-top: auto;
}

.reset-icon { font-size: 22px; line-height: 1; }

.crossed-preview {
  position: absolute;
  z-index: 5;
  top: 46px;
  left: 24px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text-muted);
  font-size: var(--fs-label);
  line-height: 1.35;
  display: none;
}

.crossed-preview.is-visible { display: flex; }
.preview-line { position: relative; width: 96px; height: 2px; background: var(--text-muted); }
.preview-line::after { position: absolute; top: -5px; left: 45px; width: 2px; height: 13px; content: ""; background: var(--danger); transform: rotate(62deg); }

.supports > .support {
  z-index: 2;
  grid-row: 2;
  min-height: 92px;
  padding: 12px 14px;
}

.supports > .support::before { height: 12px; }
.support-title { display: block; margin-bottom: 4px; color: var(--text); font-size: var(--fs-body); font-weight: 700; line-height: 1.35; }
.support-copy { display: block; font-size: var(--fs-sec); line-height: var(--lh-sec); }

@keyframes card-shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}
</style>
</head>
<body data-page="06" data-total="44">
<div id="stage">
<main id="main">
  <section class="k-generalization lineage-generalization" aria-labelledby="claim">
    <div class="claim" id="claim">进化产生的是不断分叉、共存和消失的谱系，不是一条从低级通往高级的跑道。</div>
    <div class="supports">
      <div class="trunk" aria-hidden="true"></div>
      <div class="lineage-shell">
        <div class="tree-zone min0 no-pan" id="treeZone">
          <div class="era-bands" aria-hidden="true">
            <span class="era-band"><span>共同祖先</span></span>
            <span class="era-band"><span>分支展开</span></span>
            <span class="era-band"><span>同期共存</span></span>
            <span class="era-band"><span>后来状态</span></span>
          </div>
          <div class="event-track" id="eventTrack" aria-label="事件进度"></div>
          <div class="crossed-preview" id="crossedPreview"><span>单线预想</span><span class="preview-line" aria-hidden="true"></span></div>
          <svg class="tree-svg" id="treeSvg" role="img" aria-labelledby="treeTitle treeDesc">
            <title id="treeTitle">互动式谱系分叉图</title>
            <desc id="treeDesc">将当前事件放到仍存续的端点，让一条谱系形成分叉、共存与消失的灌木状结构。</desc>
          </svg>
          <div class="event-card" id="eventCard" role="button" tabindex="0" aria-describedby="keyboardHint">
            <span class="event-icon" id="eventIcon">Y</span>
            <span class="event-copy">
              <span class="event-kind" id="eventKind">分叉</span>
              <span class="event-hint" id="keyboardHint">拖到亮点；方向键选择，Enter 放置</span>
            </span>
          </div>
        </div>
        <aside class="rule-rail" aria-label="当前规则与进度">
          <div class="rail-kicker">当前事件 / 全部事件</div>
          <div class="rail-progress" id="railProgress">1 / 7</div>
          <p class="rail-rule" id="railRule">分叉必须放在仍存续的端点。</p>
          <p class="rail-status" id="railStatus" aria-live="polite">选择任一青绿端点，开始形成新的谱系。</p>
          <button class="reset-button" id="resetButton" type="button" title="恢复单一主干">
            <span class="reset-icon" aria-hidden="true">↻</span><span>一键重来</span>
          </button>
        </aside>
      </div>
      <div class="support">
        <span class="support-title">分叉</span>
        <span class="support-copy">共同祖先之后，可以出现多个后继谱系。</span>
      </div>
      <div class="support">
        <span class="support-title">共存</span>
        <span class="support-copy">同一时期可以有多条谱系，不必排成等级。</span>
      </div>
      <div class="support">
        <span class="support-title">消失</span>
        <span class="support-copy">支系终止，不等于被“更高级”支系替换。</span>
      </div>
      <div class="support">
        <span class="support-title">无预设终点</span>
        <span class="support-copy">延续到后来，只表示仍存在，不表示赢得比赛。</span>
      </div>
    </div>
  </section>
</main>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
Lec.mount({
  index: 6,
  kicker: "BRANCH, COEXIST, END",
  title: "进化不是一场升级赛",
  take: "进化产生的是不断分叉、共存和消失的谱系，不是一条从低级通往高级的跑道。"
});

(function () {
  "use strict";

  var EVENTS = [
    { type: "split", label: "分叉", icon: "Y" },
    { type: "continue", label: "延续", icon: "→" },
    { type: "split", label: "分叉", icon: "Y" },
    { type: "end", label: "消失", icon: "⊣" },
    { type: "continue", label: "延续", icon: "→" },
    { type: "split", label: "分叉", icon: "Y" },
    { type: "end", label: "消失", icon: "⊣" }
  ];

  var zone = document.getElementById("treeZone");
  var svg = d3.select("#treeSvg");
  var card = document.getElementById("eventCard");
  var statusEl = document.getElementById("railStatus");
  var progressEl = document.getElementById("railProgress");
  var ruleEl = document.getElementById("railRule");
  var kindEl = document.getElementById("eventKind");
  var iconEl = document.getElementById("eventIcon");
  var eventTrack = document.getElementById("eventTrack");
  var preview = document.getElementById("crossedPreview");
  var resetButton = document.getElementById("resetButton");
  var drag = null;
  var gameStarted = false;

  function freshState() {
    return {
      step: 0,
      selected: 0,
      nextId: 1,
      nodes: [{ id: "n0", parent: null, depth: 0, lane: 0, alive: true, terminal: false }],
      trace: [],
      complete: false
    };
  }

  var state = freshState();

  function aliveNodes() {
    return state.nodes.filter(function (node) { return node.alive && !node.terminal; });
  }

  function nodeById(id) {
    return state.nodes.find(function (node) { return node.id === id; });
  }

  function childCount(id) {
    return state.nodes.filter(function (node) { return node.parent === id; }).length;
  }

  function endpointNodes() {
    return state.nodes.filter(function (node) { return childCount(node.id) === 0; });
  }

  function normalizeSelection() {
    var alive = aliveNodes();
    if (!alive.length) return;
    state.selected = Deck.clamp(state.selected, 0, alive.length - 1);
  }

  function transition(targetId) {
    if (state.complete) return { ok: false, message: "这一轮已经完成，请一键重来。" };
    var target = nodeById(targetId);
    var event = EVENTS[state.step];
    if (!target || !target.alive || target.terminal || childCount(target.id) > 0) {
      return {
        ok: false,
        message: event.type === "split" ? "分叉必须放在仍存续的端点。" : "这条支系已经消失，不能再从它继续。"
      };
    }

    var created = [];
    target.alive = false;
    if (event.type === "split") {
      [-1, 1].forEach(function (offset) {
        var child = {
          id: "n" + state.nextId++,
          parent: target.id,
          depth: target.depth + 1,
          lane: target.lane + offset,
          alive: true,
          terminal: false
        };
        state.nodes.push(child);
        created.push(child.id);
      });
    } else if (event.type === "continue") {
      var continuation = {
        id: "n" + state.nextId++,
        parent: target.id,
        depth: target.depth + 1,
        lane: target.lane,
        alive: true,
        terminal: false
      };
      state.nodes.push(continuation);
      created.push(continuation.id);
    } else {
      target.terminal = true;
    }

    state.trace.push({ event: event.type, target: targetId, created: created.slice() });
    state.step += 1;
    state.selected = 0;
    state.complete = state.step >= EVENTS.length;
    normalizeSelection();
    return { ok: true, event: event, created: created };
  }

  function layout() {
    var width = zone.clientWidth;
    var height = zone.clientHeight;
    var byDepth = d3.group(state.nodes, function (d) { return d.depth; });
    var maxDepth = Math.max(4, d3.max(state.nodes, function (d) { return d.depth; }) || 1);
    var positions = new Map();
    var x = d3.scaleLinear().domain([0, maxDepth + 1]).range([78, width - 76]);

    byDepth.forEach(function (nodes, depth) {
      var ordered = nodes.slice().sort(function (a, b) { return a.lane - b.lane || a.id.localeCompare(b.id); });
      var y = d3.scalePoint().domain(d3.range(ordered.length)).range([80, height - 92]).padding(0.55);
      ordered.forEach(function (node, index) {
        positions.set(node.id, { x: x(depth), y: y(index) });
      });
    });
    return { width: width, height: height, positions: positions };
  }

  function render(animateCreated) {
    normalizeSelection();
    var dims = layout();
    var positions = dims.positions;
    svg.attr("viewBox", "0 0 " + dims.width + " " + dims.height);

    var guides = svg.selectAll("line.time-line").data([1, 2, 3, 4]);
    guides.join("line")
      .attr("class", "time-line")
      .attr("x1", function (d) { return 78 + d * (dims.width - 154) / 5; })
      .attr("x2", function (d) { return 78 + d * (dims.width - 154) / 5; })
      .attr("y1", 42)
      .attr("y2", dims.height - 52);

    var links = state.nodes.filter(function (d) { return d.parent !== null; });
    var linkSel = svg.selectAll("path.branch").data(links, function (d) { return d.id; });
    linkSel.join(
      function (enter) {
        var paths = enter.append("path").attr("class", function (d) { return "branch" + (d.terminal ? " is-dead" : ""); });
        if (!Deck.reduced() && animateCreated) {
          paths.attr("stroke-dasharray", function () { return 260; })
            .attr("stroke-dashoffset", 260)
            .transition().duration(420).ease(d3.easeCubicOut).attr("stroke-dashoffset", 0);
        }
        return paths;
      },
      function (update) { return update; },
      function (exit) { return exit.remove(); }
    ).attr("d", function (d) {
      var a = positions.get(d.parent);
      var b = positions.get(d.id);
      var mid = (a.x + b.x) / 2;
      return "M" + a.x + "," + a.y + " C" + mid + "," + a.y + " " + mid + "," + b.y + " " + b.x + "," + b.y;
    }).classed("is-dead", function (d) { return d.terminal; });

    var endpoints = endpointNodes();
    var selectedAlive = aliveNodes()[state.selected];
    var endpointSel = svg.selectAll("circle.endpoint").data(endpoints, function (d) { return d.id; });
    endpointSel.join("circle")
      .attr("class", "endpoint")
      .attr("cx", function (d) { return positions.get(d.id).x; })
      .attr("cy", function (d) { return positions.get(d.id).y; })
      .attr("r", function (d) { return d.terminal ? 7 : 10; })
      .classed("is-dead", function (d) { return d.terminal; })
      .classed("is-selected", function (d) { return selectedAlive && d.id === selectedAlive.id; });

    var dead = endpoints.filter(function (d) { return d.terminal; });
    svg.selectAll("line.end-cap").data(dead, function (d) { return d.id; }).join("line")
      .attr("class", "end-cap")
      .attr("x1", function (d) { return positions.get(d.id).x - 1; })
      .attr("x2", function (d) { return positions.get(d.id).x + 15; })
      .attr("y1", function (d) { return positions.get(d.id).y - 9; })
      .attr("y2", function (d) { return positions.get(d.id).y + 9; });

    var living = endpoints.filter(function (d) { return !d.terminal; });
    var measurement = living.length ? d3.max(living, function (d) { return positions.get(d.id).x; }) : 0;
    svg.selectAll("line.measure-line").data([0]).join("line")
      .attr("class", "measure-line" + (state.complete ? " is-visible" : ""))
      .attr("x1", measurement)
      .attr("x2", measurement)
      .attr("y1", 52)
      .attr("y2", dims.height - 62);
    svg.selectAll("text.measure-label").data([0]).join("text")
      .attr("class", "measure-label" + (state.complete ? " is-visible" : ""))
      .attr("x", measurement - 8)
      .attr("y", 52)
      .attr("text-anchor", "end")
      .text("同时存续");

    updateInterface();
  }

  function updateInterface() {
    eventTrack.innerHTML = EVENTS.map(function (event, index) {
      var cls = index < state.step ? " is-done" : index === state.step ? " is-current" : "";
      return '<span class="event-step' + cls + '">' + event.label + '</span>';
    }).join("");

    if (state.complete) {
      card.setAttribute("aria-disabled", "true");
      progressEl.textContent = EVENTS.length + " / " + EVENTS.length;
      ruleEl.textContent = "完整谱系中，延续、并存和消失同时可见。";
      statusEl.textContent = "分叉，不是升级。后来仍存在，只表示这个分支延续到了后来。";
      statusEl.classList.remove("is-error");
      preview.classList.add("is-visible");
      return;
    }

    var event = EVENTS[state.step];
    card.setAttribute("aria-disabled", "false");
    kindEl.textContent = event.label;
    iconEl.textContent = event.icon;
    progressEl.textContent = (state.step + 1) + " / " + EVENTS.length;
    ruleEl.textContent = event.type === "split"
      ? "分叉必须放在仍存续的端点。"
      : event.type === "continue"
        ? "延续会拉长所选支系，不改变其他支系。"
        : "消失会截断所选支系，其他支系仍可延续。";
  }

  function nearestEndpoint(point, includeDead) {
    var dims = layout();
    var candidates = endpointNodes().filter(function (d) { return includeDead || !d.terminal; });
    var best = null;
    candidates.forEach(function (node) {
      var p = dims.positions.get(node.id);
      var distance = Math.hypot(point.x - p.x, point.y - p.y);
      if (!best || distance < best.distance) best = { node: node, distance: distance };
    });
    return best;
  }

  function applyTo(targetId) {
    if (!gameStarted) {
      gameStarted = true;
      zone.dispatchEvent(new CustomEvent("game-start", { bubbles: true, composed: true }));
    }
    var result = transition(targetId);
    if (!result.ok) {
      statusEl.textContent = result.message;
      statusEl.classList.add("is-error");
      card.classList.remove("is-shaking");
      void card.offsetWidth;
      card.classList.add("is-shaking");
      render(false);
      return;
    }
    statusEl.classList.remove("is-error");
    statusEl.textContent = result.event.type === "split"
      ? "一个端点分成两支；两条支系从此可以同时存在。"
      : result.event.type === "continue"
        ? "这条支系延续了；其他同期支系没有因此变低级。"
        : "这条支系在此终止；它没有被标成失败者。";
    render(true);
    zone.dispatchEvent(new CustomEvent("game-progress", {
      bubbles: true,
      composed: true,
      detail: { state: snapshot(), action: result.event.type, metrics: { completed: state.step, total: EVENTS.length } }
    }));
    if (state.complete) {
      zone.dispatchEvent(new CustomEvent("game-complete", {
        bubbles: true,
        composed: true,
        detail: { score: EVENTS.length, metrics: { branches: endpointNodes().length }, trace: state.trace.slice() }
      }));
    }
  }

  function snapshot() {
    return JSON.parse(JSON.stringify(state));
  }

  card.addEventListener("pointerdown", function (event) {
    if (state.complete) return;
    event.preventDefault();
    card.setPointerCapture(event.pointerId);
    var origin = Deck.pt(zone, event);
    drag = { pointerId: event.pointerId, origin: origin };
    card.classList.add("is-dragging");
  });

  card.addEventListener("pointermove", function (event) {
    if (!drag || drag.pointerId !== event.pointerId) return;
    var p = Deck.pt(zone, event);
    card.style.transform = "translate(" + (p.x - drag.origin.x) + "px," + (p.y - drag.origin.y) + "px)";
    var nearest = nearestEndpoint(p, false);
    if (nearest && nearest.distance < 44) {
      var alive = aliveNodes();
      state.selected = Math.max(0, alive.findIndex(function (d) { return d.id === nearest.node.id; }));
      render(false);
    }
  });

  function endDrag(event) {
    if (!drag || drag.pointerId !== event.pointerId) return;
    var p = Deck.pt(zone, event);
    var nearestAny = nearestEndpoint(p, true);
    card.releasePointerCapture(event.pointerId);
    card.classList.remove("is-dragging");
    card.style.transform = "";
    drag = null;
    if (!nearestAny || nearestAny.distance >= 48) {
      statusEl.textContent = "把事件放到一个端点上。";
      statusEl.classList.add("is-error");
      card.classList.add("is-shaking");
      return;
    }
    applyTo(nearestAny.node.id);
  }

  card.addEventListener("pointerup", endDrag);
  card.addEventListener("pointercancel", function (event) {
    if (!drag || drag.pointerId !== event.pointerId) return;
    card.classList.remove("is-dragging");
    card.style.transform = "";
    drag = null;
  });

  card.addEventListener("keydown", function (event) {
    var alive = aliveNodes();
    if (!alive.length || state.complete) return;
    if (["ArrowLeft", "ArrowUp"].includes(event.key)) {
      event.preventDefault();
      state.selected = (state.selected - 1 + alive.length) % alive.length;
      statusEl.textContent = "已选择第 " + (state.selected + 1) + " 个存续端点。";
      statusEl.classList.remove("is-error");
      render(false);
    } else if (["ArrowRight", "ArrowDown"].includes(event.key)) {
      event.preventDefault();
      state.selected = (state.selected + 1) % alive.length;
      statusEl.textContent = "已选择第 " + (state.selected + 1) + " 个存续端点。";
      statusEl.classList.remove("is-error");
      render(false);
    } else if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      applyTo(alive[state.selected].id);
    }
  });

  resetButton.addEventListener("click", function () {
    state = freshState();
    gameStarted = false;
    statusEl.textContent = "选择任一青绿端点，开始形成新的谱系。";
    statusEl.classList.remove("is-error");
    preview.classList.remove("is-visible");
    card.style.transform = "";
    render(false);
    card.focus();
    zone.dispatchEvent(new CustomEvent("game-reset", { bubbles: true, composed: true }));
  });

  window.lineageGame = {
    start: function () { card.focus(); },
    reset: function () { resetButton.click(); },
    getState: snapshot
  };

  Deck.onResize(function () { render(false); });
  render(false);
})();
</script>
</body>
</html>
