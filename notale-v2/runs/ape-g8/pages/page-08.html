<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .gait-page {
    --motion-fast: 180ms;
    --motion-scene: 520ms;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    height: 100%;
  }
  .gait-scene {
    position: relative;
    flex: 1 1 0;
    min-height: 0;
    overflow: hidden;
    background: #121719;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
  }
  .gait-scene::after {
    position: absolute;
    right: 0;
    bottom: 45px;
    left: 0;
    height: 1px;
    content: "";
    background: linear-gradient(90deg, transparent, var(--line-strong) 8%, var(--line-strong) 92%, transparent);
    transform-origin: left;
    animation: ground-in 700ms ease-out both;
  }
  .gait-canvas { z-index: 1; }
  .scene-copy {
    position: absolute;
    z-index: 3;
    top: 18px;
    left: 22px;
    width: 420px;
  }
  .scene-copy .lead { max-width: 25em; font-weight: 650; }
  .scene-copy .secondary { margin-top: 4px; color: var(--text-secondary); }
  .scene-status {
    position: absolute;
    z-index: 3;
    top: 18px;
    right: 22px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .phase-chip {
    min-width: 104px;
    padding: 7px 10px;
    color: var(--bg);
    background: var(--accent);
    border-radius: var(--radius-sm);
    font-size: var(--fs-label);
    font-weight: 750;
    line-height: 1.35;
    text-align: center;
  }
  .counter {
    min-width: 116px;
    padding: 6px 10px;
    color: var(--text-secondary);
    background: rgba(17, 20, 23, 0.88);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    font-family: var(--font-mono);
    font-size: var(--fs-sec);
    line-height: 1.45;
    text-align: center;
  }
  .criteria {
    position: absolute;
    z-index: 3;
    top: 150px;
    left: 22px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    width: 340px;
    padding: 11px 12px;
    background: rgba(17, 20, 23, 0.9);
    border: 1px solid var(--line);
    border-left: 3px solid var(--primary);
    border-radius: var(--radius-sm);
  }
  .criterion {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 25px;
    padding-bottom: 5px;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--line);
    font-size: var(--fs-label);
    line-height: 1.35;
  }
  .criterion:last-child { padding-bottom: 0; border-bottom: 0; }
  .criterion output {
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: var(--fs-sec);
    line-height: 1.45;
  }
  .criterion output.ok { color: var(--primary); }
  .scene-label {
    position: absolute;
    z-index: 3;
    color: var(--text-secondary);
    font-size: var(--fs-label);
    line-height: 1.35;
    pointer-events: none;
  }
  .label-com { left: 53.5%; top: 34%; }
  .label-support { left: 49.2%; bottom: 13px; color: var(--primary); }
  .label-clearance { left: 68%; bottom: 14px; }
  .trajectory-strip {
    position: absolute;
    z-index: 3;
    bottom: 18px;
    left: 22px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 470px;
    padding: 9px 12px;
    background: rgba(17, 20, 23, 0.9);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
  }
  .trajectory-row {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }
  .trajectory-name {
    flex: 0 0 44px;
    color: var(--text-secondary);
    font-size: var(--fs-label);
    line-height: 1.35;
  }
  .trajectory-values {
    display: flex;
    flex: 1 1 0;
    min-width: 0;
    height: 20px;
    align-items: center;
  }
  .trajectory-values span {
    display: flex;
    flex: 1 1 0;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-secondary);
    border-bottom: 2px solid var(--line-strong);
    font-family: var(--font-mono);
    font-size: var(--fs-tick);
    line-height: 1.35;
  }
  .trajectory-values span.current {
    color: var(--bg);
    background: var(--accent);
    border-bottom-color: var(--accent);
  }
  .trajectory-values span.done { border-bottom-color: var(--primary); }
  .meters {
    position: absolute;
    z-index: 3;
    right: 22px;
    bottom: 18px;
    display: flex;
    gap: 20px;
    width: 390px;
    padding: 10px 12px;
    background: rgba(17, 20, 23, 0.9);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
  }
  .meter { flex: 1 1 0; min-width: 0; }
  .meter-head {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    color: var(--text-secondary);
    font-size: var(--fs-label);
    line-height: 1.35;
  }
  .meter-head output { color: var(--text); font-family: var(--font-mono); font-size: var(--fs-sec); }
  .meter-bar { height: 5px; margin-top: 6px; overflow: hidden; background: var(--surface-strong); }
  .meter-bar i { display: block; width: 0; height: 100%; background: var(--primary); transition: width var(--motion-fast) ease-out; }
  .meter.cost .meter-bar i,
  .meter.impact .meter-bar i { background: var(--accent); }
  .feedback {
    position: absolute;
    z-index: 4;
    top: 88px;
    left: 22px;
    max-width: 520px;
    padding: 8px 12px;
    color: var(--text);
    background: rgba(17, 20, 23, 0.92);
    border-left: 3px solid var(--accent);
    font-size: var(--fs-sec);
    line-height: 1.45;
  }
  .feedback.ok { border-left-color: var(--primary); }

  .cycle-wrap { flex: 0 0 102px; min-height: 0; }
  .cycle-axis {
    --process-gap: 34px;
    height: 62px;
    padding: 4px 0;
  }
  .cycle-axis > .axis { background: var(--primary-line); }
  .cycle-axis > .step {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 8px 12px;
    cursor: default;
    transition: border-color var(--motion-fast), background-color var(--motion-fast), filter var(--motion-fast);
  }
  .cycle-axis .step-name { font-size: var(--fs-sec); font-weight: 700; line-height: 1.35; }
  .cycle-axis .step-note { color: var(--text-secondary); font-size: var(--fs-label); line-height: 1.35; }
  .cycle-axis .is-complete { border-top-color: var(--primary); box-shadow: inset 0 2px 0 var(--primary); }
  .cycle-axis .is-costly { border-bottom: 3px solid var(--accent); }
  .cycle-control {
    display: flex;
    align-items: center;
    gap: 14px;
    height: 40px;
  }
  .cycle-control label { flex: 0 0 92px; font-size: var(--fs-label); font-weight: 650; line-height: 1.35; }
  .cycle-control input { flex: 1 1 0; min-width: 0; height: 40px; }
  .phase-readout { flex: 0 0 120px; color: var(--accent); font-family: var(--font-mono); font-size: var(--fs-sec); line-height: 1.45; text-align: right; }

  .control-bench {
    display: flex;
    flex: 0 0 92px;
    gap: 18px;
    min-height: 0;
    padding-top: 8px;
    border-top: 1px solid var(--line);
  }
  .joint-control {
    display: flex;
    flex: 1 1 0;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .joint-meta { flex: 0 0 72px; }
  .joint-meta label { display: block; color: var(--text); font-size: var(--fs-label); font-weight: 700; line-height: 1.35; }
  .joint-meta output { display: block; color: var(--primary); font-family: var(--font-mono); font-size: var(--fs-sec); line-height: 1.45; }
  .joint-control input { flex: 1 1 0; min-width: 0; }
  .reset {
    flex: 0 0 44px;
    width: 44px;
    min-width: 44px;
    padding: 0;
    font-size: 24px;
  }
  .joint-control input:focus-visible,
  .cycle-control input:focus-visible,
  .reset:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .gait-page.ready .gait-scene { animation: scene-in var(--motion-scene) ease-out both; }
  .gait-page.failing .gait-scene { animation: fail-shake 260ms ease-out; }
  .gait-page.success .counter { color: var(--bg); background: var(--primary); border-color: var(--primary); }
  @keyframes ground-in { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes scene-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fail-shake { 0%,100% { transform: translateX(0); } 35% { transform: translateX(-5px); } 70% { transform: translateX(4px); } }
  @media (prefers-reduced-motion: reduce) {
    .gait-scene, .gait-scene::after, .gait-page.failing .gait-scene { animation: none; }
    .meter-bar i, .cycle-axis > .step { transition: none; }
  }
</style>
</head>
<body data-page="08" data-total="44">
<div id="stage">
<main id="main">
  <section class="gait-page" id="gaitPage" aria-label="步态循环稳定性实验">
    <figure class="gait-scene min0 no-pan" id="scene">
      <canvas class="gait-canvas cv-fill" id="gaitCanvas" aria-hidden="true"></canvas>
      <div class="scene-copy">
        <p class="lead">把重心接回脚掌，才有下一步。</p>
        <p class="secondary">同一姿势不能完成整段步态，关节必须按阶段配合。</p>
      </div>
      <div class="scene-status">
        <span class="phase-chip" id="phaseChip">承重</span>
        <span class="counter" id="counter">已稳定 0 / 4</span>
      </div>
      <div class="criteria" aria-label="当前阶段稳定判据">
        <div class="criterion"><span>重心相对支撑区</span><output id="balanceCriterion">区外</output></div>
        <div class="criterion"><span>摆动脚离地</span><output id="clearCriterion">不足</output></div>
        <div class="criterion"><span>落脚冲击</span><output id="impactCriterion">待调整</output></div>
      </div>
      <span class="scene-label label-com">重心投影</span>
      <span class="scene-label label-support">支撑区</span>
      <span class="scene-label label-clearance">离地间隙</span>
      <div class="trajectory-strip" aria-label="四阶段关节角度轨迹">
        <div class="trajectory-row"><span class="trajectory-name">髋部</span><div class="trajectory-values" id="hipTrace"><span></span><span></span><span></span><span></span></div></div>
        <div class="trajectory-row"><span class="trajectory-name">膝部</span><div class="trajectory-values" id="kneeTrace"><span></span><span></span><span></span><span></span></div></div>
        <div class="trajectory-row"><span class="trajectory-name">脚掌</span><div class="trajectory-values" id="footTrace"><span></span><span></span><span></span><span></span></div></div>
      </div>
      <div class="meters" aria-label="相对仪表">
        <div class="meter"><div class="meter-head"><span>稳定</span><output id="stableOut">0</output></div><div class="meter-bar"><i id="stableBar"></i></div></div>
        <div class="meter cost"><div class="meter-head"><span>调整量</span><output id="costOut">0</output></div><div class="meter-bar"><i id="costBar"></i></div></div>
        <div class="meter impact"><div class="meter-head"><span>冲击</span><output id="impactOut">0</output></div><div class="meter-bar"><i id="impactBar"></i></div></div>
      </div>
      <p class="feedback" id="feedback" aria-live="polite">拖动阶段游标，再调整三个关节。</p>
    </figure>

    <section class="cycle-wrap" aria-label="一步的四阶段闭环">
      <div class="k-process cycle-axis" id="cycleAxis">
        <div class="axis" aria-hidden="true"></div>
        <div class="step is-current" data-phase="0"><span class="step-name">1 承重</span><span class="step-note">脚掌接地</span><i class="arw" aria-hidden="true"></i></div>
        <div class="step" data-phase="1"><span class="step-name">2 推进</span><span class="step-note">全掌到前掌</span><i class="arw" aria-hidden="true"></i></div>
        <div class="step" data-phase="2"><span class="step-name">3 摆动</span><span class="step-note">屈膝离地</span><i class="arw" aria-hidden="true"></i></div>
        <div class="step" data-phase="3"><span class="step-name">4 落脚</span><span class="step-note">重新承重</span><i class="arw" aria-hidden="true"></i></div>
      </div>
      <div class="cycle-control">
        <label for="phaseRange">步态循环</label>
        <input id="phaseRange" type="range" min="0" max="3" step="1" value="0" aria-valuetext="承重">
        <output class="phase-readout" id="phaseReadout">01 / 04</output>
      </div>
    </section>

    <section class="control-bench" aria-label="当前阶段关节角度">
      <div class="joint-control min0"><div class="joint-meta"><label for="hipRange">髋部</label><output id="hipOut">−18°</output></div><input id="hipRange" type="range" min="-30" max="30" step="1" value="-18"></div>
      <div class="joint-control min0"><div class="joint-meta"><label for="kneeRange">膝部</label><output id="kneeOut">28°</output></div><input id="kneeRange" type="range" min="0" max="60" step="1" value="28"></div>
      <div class="joint-control min0"><div class="joint-meta"><label for="footRange">脚掌</label><output id="footOut">12°</output></div><input id="footRange" type="range" min="-25" max="30" step="1" value="12"></div>
      <button class="reset" id="resetBtn" type="button" title="重置四个阶段" aria-label="重置四个阶段">↺</button>
    </section>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script>
Lec.mount({
  index: 8,
  kicker: "BODY · GAIT CYCLE",
  title: "稳定行走，是连续接住自己的身体",
  take: "稳定行走不是摆出一个“正确姿势”，而是髋部、膝部和脚掌在正确时刻共同把重心接回支撑面；稳定越高，关节调整和落地冲击的代价也可能越大。"
});

(function () {
  'use strict';

  var phaseNames = ['承重', '推进', '摆动', '落脚'];
  var targets = [
    { hip: -6, knee: 10, foot: 0, tol: [7, 9, 7] },
    { hip: 12, knee: 5, foot: 22, tol: [8, 8, 7] },
    { hip: -14, knee: 46, foot: 4, tol: [8, 10, 9] },
    { hip: -18, knee: 14, foot: -7, tol: [8, 9, 8] }
  ];
  var initial = [
    { hip: -18, knee: 28, foot: 12 },
    { hip: -2, knee: 22, foot: 8 },
    { hip: 4, knee: 18, foot: 18 },
    { hip: -2, knee: 30, foot: 16 }
  ];
  var state;
  var page = document.getElementById('gaitPage');
  var canvas = document.getElementById('gaitCanvas');
  var phaseRange = document.getElementById('phaseRange');
  var ranges = {
    hip: document.getElementById('hipRange'),
    knee: document.getElementById('kneeRange'),
    foot: document.getElementById('footRange')
  };
  var outputs = {
    hip: document.getElementById('hipOut'),
    knee: document.getElementById('kneeOut'),
    foot: document.getElementById('footOut')
  };
  var feedback = document.getElementById('feedback');
  var reduced = Deck.reduced();
  var lastFailure = 0;

  var engine = Matter.Engine.create({ gravity: { x: 0, y: Lec.K.g0 / 9.81, scale: 0.001 } });
  var ground = Matter.Bodies.rectangle(760, 316, 1100, 24, { isStatic: true, friction: 0.9, label: 'ground' });
  var pelvis = Matter.Bodies.circle(720, 128, 17, { frictionAir: 0.09, label: 'pelvis' });
  var thigh = Matter.Bodies.rectangle(720, 178, 18, 100, { density: 0.002, label: 'thigh' });
  var shin = Matter.Bodies.rectangle(720, 252, 15, 92, { density: 0.0016, label: 'shin' });
  var foot = Matter.Bodies.rectangle(740, 304, 72, 14, { density: 0.001, friction: 0.95, label: 'foot' });
  var hipJoint = Matter.Constraint.create({ bodyA: pelvis, bodyB: thigh, pointA: { x: 0, y: 12 }, pointB: { x: 0, y: -48 }, stiffness: 0.86, damping: 0.18, length: 0 });
  var kneeJoint = Matter.Constraint.create({ bodyA: thigh, bodyB: shin, pointA: { x: 0, y: 48 }, pointB: { x: 0, y: -44 }, stiffness: 0.84, damping: 0.2, length: 0 });
  var ankleJoint = Matter.Constraint.create({ bodyA: shin, bodyB: foot, pointA: { x: 0, y: 44 }, pointB: { x: -24, y: 0 }, stiffness: 0.88, damping: 0.2, length: 0 });
  Matter.Composite.add(engine.world, [ground, pelvis, thigh, shin, foot, hipJoint, kneeJoint, ankleJoint]);

  function freshState() {
    return {
      phase: 0,
      angles: initial.map(function (v) { return { hip: v.hip, knee: v.knee, foot: v.foot }; }),
      done: [false, false, false, false],
      touched: [false, false, false, false],
      completeAt: 0
    };
  }

  function signed(value) {
    return (value < 0 ? '−' + Math.abs(value) : value) + '°';
  }

  function metricsFor(index) {
    var a = state.angles[index];
    var t = targets[index];
    var errors = [Math.abs(a.hip - t.hip) / t.tol[0], Math.abs(a.knee - t.knee) / t.tol[1], Math.abs(a.foot - t.foot) / t.tol[2]];
    var meanError = (errors[0] + errors[1] + errors[2]) / 3;
    var stable = Math.round(Lec.P.clamp(100 - meanError * 38, 0, 100));
    var adjustment = Math.round(Lec.P.clamp((Math.abs(a.hip) + a.knee + Math.abs(a.foot)) / 1.15, 0, 100));
    var impact = index === 3
      ? Math.round(Lec.P.clamp((Math.abs(a.foot + 5) * 3 + Math.max(0, 22 - a.knee) * 2.2) * (Lec.K.g0 / 9.81), 0, 100))
      : Math.round(Lec.P.clamp((Math.abs(a.foot) + Math.max(0, 12 - a.knee)) * 1.25, 0, 100));
    var success = errors.every(function (e) { return e <= 1; }) && (index !== 3 || impact < 48);
    return { stable: stable, adjustment: adjustment, impact: impact, success: success, errors: errors };
  }

  function feedbackFor(index, m) {
    if (m.success) {
      return index === 0 ? '重心进入支撑区：身体被脚掌接住。'
        : index === 1 ? '推进接通：重心越过支撑脚，准备摆动。'
        : index === 2 ? '摆动脚离地：屈膝留出了通过间隙。'
        : '落脚可承重：冲击仍需由关节吸收。';
    }
    if (index === 0 || index === 1) return '重心落在脚掌之外：调整髋部与脚掌。';
    if (index === 2) return '摆动脚擦地：增加屈膝并带腿前摆。';
    if (m.impact >= 48) return '落脚冲击过大：弯曲膝部并调整脚掌角度。';
    return '落脚尚未接住重心：让髋部带腿向前。';
  }

  function applyPose(index, animatedPhase) {
    var a = state.angles[index];
    var baseX = 720 + animatedPhase * 22;
    var hipRad = Lec.P.degToRad(a.hip);
    var kneeRad = Lec.P.degToRad(a.hip + a.knee * 0.72);
    var footRad = Lec.P.degToRad(a.foot);
    var hipY = 132;
    var kneeX = baseX + Math.sin(hipRad) * 88;
    var kneeY = hipY + Math.cos(hipRad) * 88;
    var ankleX = kneeX + Math.sin(kneeRad) * 82;
    var ankleY = kneeY + Math.cos(kneeRad) * 82;
    if (index !== 2) ankleY = Math.min(ankleY, 292);
    Matter.Body.setPosition(pelvis, { x: baseX, y: hipY });
    Matter.Body.setPosition(thigh, { x: (baseX + kneeX) / 2, y: (hipY + kneeY) / 2 });
    Matter.Body.setAngle(thigh, -hipRad);
    Matter.Body.setPosition(shin, { x: (kneeX + ankleX) / 2, y: (kneeY + ankleY) / 2 });
    Matter.Body.setAngle(shin, -kneeRad);
    Matter.Body.setPosition(foot, { x: ankleX + Math.cos(footRad) * 28, y: ankleY + Math.sin(footRad) * 28 });
    Matter.Body.setAngle(foot, footRad);
  }

  function updateModel(markAttempt) {
    var p = state.phase;
    var m = metricsFor(p);
    if (markAttempt) {
      state.touched[p] = true;
      if (m.success) state.done[p] = true;
      else {
        lastFailure = performance.now();
        page.classList.remove('failing');
        void page.offsetWidth;
        page.classList.add('failing');
      }
    }
    if (state.done.every(Boolean) && !state.completeAt) {
      state.completeAt = performance.now();
      page.classList.add('success');
    }
    renderUI(m);
    applyPose(p, 0);
  }

  function renderUI(m) {
    var p = state.phase;
    var a = state.angles[p];
    var doneCount = state.done.filter(Boolean).length;
    document.getElementById('phaseChip').textContent = phaseNames[p];
    document.getElementById('counter').textContent = '已稳定 ' + doneCount + ' / 4';
    document.getElementById('phaseReadout').textContent = '0' + (p + 1) + ' / 04';
    var balanceOk = m.errors[0] <= 1 && m.errors[2] <= 1;
    var clearOk = p !== 2 || m.errors[1] <= 1;
    var impactOk = p !== 3 || m.impact < 48;
    var criteria = [
      [document.getElementById('balanceCriterion'), balanceOk ? '区内' : '区外', balanceOk],
      [document.getElementById('clearCriterion'), p === 2 ? (clearOk ? '通过' : '不足') : '非本段', clearOk],
      [document.getElementById('impactCriterion'), p === 3 ? (impactOk ? '受控' : '过大') : '非本段', impactOk]
    ];
    criteria.forEach(function (item) { item[0].textContent = item[1]; item[0].classList.toggle('ok', item[2]); });
    phaseRange.value = p;
    phaseRange.setAttribute('aria-valuetext', phaseNames[p]);
    Object.keys(ranges).forEach(function (key) {
      ranges[key].value = a[key];
      outputs[key].textContent = signed(a[key]);
      Array.prototype.forEach.call(document.getElementById(key + 'Trace').children, function (cell, i) {
        cell.textContent = signed(state.angles[i][key]);
        cell.classList.toggle('current', i === p);
        cell.classList.toggle('done', state.done[i] && i !== p);
      });
    });
    ['stable', 'cost', 'impact'].forEach(function (key) {
      var value = key === 'cost' ? m.adjustment : m[key];
      document.getElementById(key + 'Out').textContent = value;
      document.getElementById(key + 'Bar').style.width = value + '%';
    });
    feedback.textContent = state.completeAt
      ? '四段已经接通。注意琥珀标记：更稳定也可能伴随更高代价。'
      : feedbackFor(p, m);
    feedback.classList.toggle('ok', m.success || !!state.completeAt);
    Array.prototype.forEach.call(document.querySelectorAll('.cycle-axis .step'), function (el, i) {
      el.classList.toggle('is-current', i === p);
      el.classList.toggle('is-complete', state.done[i]);
      el.classList.toggle('is-done', state.done[i] && i !== p);
      el.classList.remove('is-costly');
    });
    if (state.completeAt) {
      var costs = targets.map(function (_, i) { var x = metricsFor(i); return x.adjustment + x.impact; });
      var highest = costs.indexOf(Math.max.apply(Math, costs));
      document.querySelector('.cycle-axis .step[data-phase="' + highest + '"]').classList.add('is-costly');
    }
  }

  function drawScene(now) {
    var ctx = Deck.fit(canvas);
    var w = canvas.offsetWidth;
    var h = canvas.offsetHeight;
    var p = state.phase;
    var m = metricsFor(p);
    var completionMotion = state.completeAt && !reduced ? Math.min(2, (now - state.completeAt) / 1500) : 0;
    if (completionMotion > 0 && completionMotion < 2) {
      var walkingPhase = Math.floor(completionMotion * 4) % 4;
      applyPose(walkingPhase, completionMotion);
    } else {
      applyPose(p, 0);
    }
    Matter.Engine.update(engine, 1000 / 60);

    var primary = Deck.token('--primary');
    var accent = Deck.token('--accent');
    var textMuted = Deck.token('--text-muted');
    var line = Deck.token('--line');
    var groundY = h - 45;
    var pxScale = w / 1100;
    var ox = (w - 1100 * pxScale) / 2;
    function sx(x) { return ox + x * pxScale; }
    function sy(y) { return groundY - (316 - y) * Math.min(pxScale, 0.78); }

    ctx.clearRect(0, 0, w, h);
    ctx.save();
    ctx.strokeStyle = Deck.rgba('--line-strong', 0.36);
    ctx.lineWidth = 1;
    for (var x = 80; x < w; x += 64) {
      ctx.beginPath(); ctx.moveTo(x, groundY - 7); ctx.lineTo(x, groundY + 7); ctx.stroke();
    }
    for (var gx = 0; gx < w; gx += 160) {
      ctx.fillStyle = Deck.rgba('--primary', 0.07);
      ctx.fillRect(gx + 24, groundY + 2, 78, 9);
    }

    var bodies = [thigh, shin, foot];
    ctx.lineCap = 'round';
    bodies.forEach(function (body) {
      var v = body.vertices;
      ctx.beginPath();
      ctx.moveTo(sx(v[0].x), sy(v[0].y));
      for (var i = 1; i < v.length; i++) ctx.lineTo(sx(v[i].x), sy(v[i].y));
      ctx.closePath();
      ctx.fillStyle = Deck.rgba('--text', 0.08);
      ctx.fill();
      ctx.strokeStyle = m.success ? primary : textMuted;
      ctx.lineWidth = m.success ? 3 : 2;
      ctx.stroke();
    });
    var hipX = sx(pelvis.position.x);
    var hipY = sy(pelvis.position.y);
    var kneeX = sx((thigh.position.x + shin.position.x) / 2);
    var kneeY = sy((thigh.position.y + shin.position.y) / 2);
    var ankleX = sx((shin.position.x + foot.position.x) / 2);
    var ankleY = sy((shin.position.y + foot.position.y) / 2);
    [ [hipX, hipY], [kneeX, kneeY], [ankleX, ankleY] ].forEach(function (pt) {
      ctx.beginPath(); ctx.arc(pt[0], pt[1], 8, 0, Lec.K.tau);
      ctx.fillStyle = '#121719'; ctx.fill();
      ctx.strokeStyle = m.success ? primary : accent; ctx.lineWidth = 2; ctx.stroke();
    });

    var torsoTilt = (!m.success && performance.now() - lastFailure < 500) ? (state.angles[p].hip < targets[p].hip ? -0.18 : 0.18) : 0;
    ctx.save();
    ctx.translate(hipX, hipY);
    ctx.rotate(torsoTilt);
    ctx.strokeStyle = m.success ? primary : textMuted;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(2, -82); ctx.lineTo(26, -118); ctx.stroke();
    ctx.beginPath(); ctx.arc(28, -137, 18, 0, Lec.K.tau); ctx.stroke();
    ctx.restore();

    var supportCenter = sx(foot.position.x);
    var supportWidth = 82 * pxScale;
    ctx.fillStyle = Deck.rgba('--primary', m.success ? 0.34 : 0.15);
    ctx.fillRect(supportCenter - supportWidth / 2, groundY - 4, supportWidth, 8);
    var projection = hipX + torsoTilt * 135;
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = m.success ? primary : accent;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(projection, hipY - 118); ctx.lineTo(projection, groundY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(projection, groundY, 5, 0, Lec.K.tau); ctx.fillStyle = m.success ? primary : accent; ctx.fill();

    var clearance = Math.max(0, groundY - sy(foot.position.y) - 7);
    ctx.strokeStyle = line;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx(foot.position.x + 45), sy(foot.position.y)); ctx.lineTo(sx(foot.position.x + 45), groundY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx(foot.position.x + 40), sy(foot.position.y)); ctx.lineTo(sx(foot.position.x + 50), sy(foot.position.y)); ctx.moveTo(sx(foot.position.x + 40), groundY); ctx.lineTo(sx(foot.position.x + 50), groundY); ctx.stroke();

    if (!m.success && performance.now() - lastFailure < 650) {
      ctx.strokeStyle = accent;
      ctx.lineWidth = 3;
      var dir = state.angles[p].hip < targets[p].hip ? -1 : 1;
      Deck.arrow(ctx, hipX, hipY - 70, hipX + dir * 74, hipY - 88, 10);
    }
    ctx.restore();
  }

  phaseRange.addEventListener('input', function () {
    state.phase = Number(phaseRange.value);
    updateModel(false);
  });
  Object.keys(ranges).forEach(function (key) {
    ranges[key].addEventListener('input', function () {
      state.angles[state.phase][key] = Number(ranges[key].value);
      updateModel(true);
    });
  });
  document.getElementById('resetBtn').addEventListener('click', function () {
    state = freshState();
    page.classList.remove('success', 'failing');
    updateModel(false);
  });

  state = freshState();
  updateModel(false);
  page.classList.add('ready');
  Deck.loop(function (now) { drawScene(now); }, { still: 1800 });
}());
</script>
</body>
</html>
