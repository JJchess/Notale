<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #111417;
  --text: #edf2f0;
  --font-sans: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
#main { padding: 24px 96px 20px; background: #151b1c; }
.lesson { height: 100%; display: flex; flex-direction: column; gap: 12px; }
.scene {
  position: relative;
  flex: 0 0 344px;
  min-height: 0;
  overflow: hidden;
  background: #111817;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
}
.scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene::after {
  position: absolute; inset: 0; pointer-events: none; content: "";
  background: linear-gradient(180deg, rgba(10,14,14,.04) 42%, rgba(10,14,14,.58) 100%);
}
.scene-top, .scene-bottom { position: absolute; z-index: 4; right: 18px; left: 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.scene-top { top: 14px; }
.scene-bottom { bottom: 14px; align-items: flex-end; }
.env-progress { display: flex; align-items: center; gap: 10px; color: var(--text-secondary); font-size: var(--fs-label); line-height: 1.35; }
.step-dot { width: 11px; height: 11px; border: 2px solid var(--primary); border-radius: 50%; background: #111817; }
.step-dot.done { background: var(--primary); }
.status-pair { display: flex; gap: 8px; }
.metric {
  min-width: 118px; padding: 7px 10px; color: var(--text-secondary); background: rgba(17,20,23,.83);
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm); font-size: var(--fs-label); line-height: 1.35;
}
.metric strong { display: block; color: var(--primary); font-size: var(--fs-sec); line-height: 1.4; }
.metric.flash { animation: metric-flash 300ms ease 2; }
.question {
  max-width: 500px; padding: 10px 14px; color: var(--text); background: rgba(17,20,23,.86);
  border-left: 3px solid var(--accent); font-size: var(--fs-sec); line-height: var(--lh-sec);
}
.answer-status { display: block; margin-top: 2px; color: var(--accent); font-weight: 700; }
.scene-controls { display: flex; align-items: flex-end; gap: 12px; }
.control-set { display: flex; flex-direction: column; gap: 5px; }
.control-set > span { color: var(--text-secondary); font-size: var(--fs-label); line-height: 1.35; }
.segmented { display: flex; gap: 4px; }
.segmented button { min-width: 112px; background: rgba(27,35,36,.94); }
.segmented.judgment button { min-width: 136px; }
.segmented button.correct { color: var(--bg); background: var(--accent); border-color: var(--accent); }
.segmented.shake { animation: shake 340ms ease; }
.reset { width: 44px; min-width: 44px; padding: 0; font-size: 24px; line-height: 1; }
.split-label {
  position: absolute; z-index: 5; top: 48%; left: 50%; display: none; padding: 8px 16px;
  color: var(--bg); background: var(--accent); border-radius: var(--radius-sm); font-size: var(--fs-lead); font-weight: 800;
  line-height: 1.35; transform: translate(-50%,-50%);
}
.split-heads { position: absolute; z-index: 4; top: 50px; right: 0; left: 0; display: none; pointer-events: none; }
.split-heads span { width: 50%; color: var(--text); font-size: var(--fs-lead); font-weight: 750; line-height: 1.35; text-align: center; text-shadow: 0 2px 8px #000; }
.scene.is-complete .split-label, .scene.is-complete .split-heads { display: flex; }
.scene.is-complete .scene-top, .scene.is-complete .question, .scene.is-complete .scene-controls { opacity: 0; pointer-events: none; }
.connector { position: absolute; z-index: 3; bottom: 0; left: var(--trace-x, 50%); width: 2px; height: 0; background: var(--accent); opacity: 0; transition: height 420ms ease, opacity 180ms ease; }
.connector.show { height: 94px; opacity: 1; }
.compare-wrap { flex: 1 1 auto; min-height: 0; display: flex; gap: 12px; align-items: stretch; }
.k-comparison { flex: 1 1 auto; min-width: 0; --compare-cols: 2; }
.k-comparison > .hdr, .k-comparison > .dim, .k-comparison > .cell { padding: 7px 13px; }
.k-comparison > .hdr { min-height: 36px; align-items: center; }
.k-comparison > .dim { font-size: var(--fs-label); }
.k-comparison > .cell { font-size: var(--fs-sec); line-height: 1.35; }
.k-comparison .cell.active-col { background: var(--primary-soft); }
.k-comparison .cell.diff { background: var(--accent-soft); }
.conclusion {
  flex: 0 0 286px; box-sizing: border-box; padding: 13px 16px; background: var(--surface-raised);
  border-left: 4px solid var(--accent); font-size: var(--fs-sec); line-height: var(--lh-sec);
}
.conclusion strong { display: block; margin-bottom: 5px; color: var(--accent); font-size: var(--fs-lead); line-height: 1.4; }
.caveat { display: block; margin-top: 7px; color: var(--text-secondary); }
@keyframes shake { 25% { transform: translateX(-7px); } 55% { transform: translateX(6px); } 80% { transform: translateX(-3px); } }
@keyframes metric-flash { 50% { color: var(--text); background: var(--accent-soft); border-color: var(--accent); } }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}
</style>
</head>
<body data-page="09" data-total="44">
<div id="stage">
<main id="main">
  <section class="lesson" aria-label="环境与身体策略比较">
    <div class="scene min0 no-pan" id="scene">
      <div id="threeHost" class="full" role="img" aria-label="同一路径从湿润林地连续变为开阔地。林地有树根、落差和近距离遮挡；开阔地有连续路面、低草和更远视距。"></div>
      <div class="scene-top">
        <div class="env-progress"><span id="progressText">环境 1 / 2</span><i class="step-dot" id="dot0"></i><i class="step-dot" id="dot1"></i></div>
        <div class="status-pair">
          <div class="metric" id="groundMetric">地面阻碍<strong id="groundValue">较高</strong></div>
          <div class="metric" id="viewMetric">视野距离<strong id="viewValue">较近</strong></div>
        </div>
      </div>
      <div class="split-heads"><span>林地</span><span>开阔地</span></div>
      <div class="split-label">答案随条件改变</div>
      <div class="connector" id="connector"></div>
      <div class="scene-bottom">
        <div class="question" id="feedback">先看地面阻碍与视野距离，再判断哪种策略相对省力。<span class="answer-status" id="answerStatus"></span></div>
        <div class="scene-controls">
          <div class="control-set">
            <span>选择环境</span>
            <div class="segmented" id="envButtons">
              <button type="button" data-env="0" aria-pressed="true">林地</button>
              <button type="button" data-env="1" aria-pressed="false">开阔地</button>
            </div>
          </div>
          <div class="control-set">
            <span>判断当前条件</span>
            <div class="segmented judgment" id="strategyButtons">
              <button type="button" data-strategy="low">低位四点支撑</button>
              <button type="button" data-strategy="upright">直立步行</button>
            </div>
          </div>
          <button type="button" class="reset" id="reset" title="重置" aria-label="重置">↺</button>
        </div>
      </div>
    </div>

    <div class="compare-wrap min0">
      <div class="k-comparison min0" id="comparison" aria-label="林地与开阔地四项对照">
        <div class="hdr">比较维度</div><div class="hdr" data-col="0">林地</div><div class="hdr" data-col="1">开阔地</div>
        <div class="rowline"></div>
        <div class="dim">地面</div><div class="cell" data-col="0">根系、落差与绕行动作较多</div><div class="cell" data-col="1">连续路面与较长直线路径较多</div>
        <div class="rowline"></div>
        <div class="dim">视野</div><div class="cell" data-col="0">遮挡近，抬高视点的收益局部出现</div><div class="cell" data-col="1">远处目标更早进入视线</div>
        <div class="rowline"></div>
        <div class="dim">动作代价</div><div class="cell" data-col="0">跨越、转向、稳定身体更关键</div><div class="cell" data-col="1">重复步行与维持节律更关键</div>
        <div class="rowline"></div>
        <div class="dim">相对省力</div><div class="cell" data-col="0">取决于障碍密度与路径长度</div><div class="cell" data-col="1">取决于距离、暴露与观察需求</div>
      </div>
      <aside class="conclusion">
        <strong>没有脱离条件的总冠军</strong>
        不同地面和视野条件，会改变“哪种身体更省力”的答案。
        <span class="caveat">环境不是单一开关；它只会改变多种身体结构、行为与生存压力之间的代价。</span>
      </aside>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/three.min.js"></script>
<script>
Lec.mount({
  index: 9,
  kicker: "BODY × HABITAT",
  title: "哪种身体更省力，要先问走在什么地方",
  take: "不同地面和视野条件，会改变“哪种身体更省力”的答案。"
});

(function () {
  var host = document.getElementById('threeHost');
  var sceneEl = document.getElementById('scene');
  var envButtons = Array.from(document.querySelectorAll('[data-env]'));
  var strategyButtons = Array.from(document.querySelectorAll('[data-strategy]'));
  var comparisonCells = Array.from(document.querySelectorAll('[data-col]'));
  var progressText = document.getElementById('progressText');
  var groundValue = document.getElementById('groundValue');
  var viewValue = document.getElementById('viewValue');
  var feedback = document.getElementById('feedback');
  var answerStatus = document.getElementById('answerStatus');
  var connector = document.getElementById('connector');
  var state = { env: 0, blend: 0, done: [false, false], selected: null, complete: false, nudge: 0 };

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  host.appendChild(renderer.domElement);

  var world = new THREE.Scene();
  world.background = new THREE.Color(0x829a8d);
  world.fog = new THREE.Fog(0x829a8d, 16, 58);
  var camera = new THREE.PerspectiveCamera(41, 1, 0.1, 120);
  camera.position.set(0, 4.8, 13.5);
  camera.lookAt(0, 1.1, -18);

  world.add(new THREE.HemisphereLight(0xc5ddd2, 0x17211e, 1.65));
  var sun = new THREE.DirectionalLight(0xffe3ae, 2.25);
  sun.position.set(-8, 14, 6); sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024); world.add(sun);

  function groundHeight(x, z) {
    return Math.sin(z * 0.42) * 0.16 + Math.sin(x * 1.25 + z * 0.18) * 0.09;
  }
  var groundGeo = new THREE.PlaneGeometry(46, 78, 70, 110);
  groundGeo.rotateX(-Math.PI / 2);
  var pos = groundGeo.attributes.position;
  for (var i = 0; i < pos.count; i++) pos.setY(i, groundHeight(pos.getX(i), pos.getZ(i)));
  groundGeo.computeVertexNormals();
  var groundMat = new THREE.MeshStandardMaterial({ color: 0x3e5144, roughness: 1, metalness: 0 });
  var ground = new THREE.Mesh(groundGeo, groundMat); ground.position.z = -21; ground.receiveShadow = true; world.add(ground);

  var pathMat = new THREE.MeshStandardMaterial({ color: 0x514a3b, roughness: 1 });
  var path = new THREE.Mesh(new THREE.PlaneGeometry(4.3, 74, 1, 1), pathMat);
  path.rotation.x = -Math.PI / 2; path.position.set(0, .06, -21); path.receiveShadow = true; world.add(path);

  var forest = new THREE.Group();
  var open = new THREE.Group();
  world.add(forest, open);
  var trunkMat = new THREE.MeshStandardMaterial({ color: 0x3a2e25, roughness: 1, transparent: true });
  var crownMat = new THREE.MeshStandardMaterial({ color: 0x244b37, roughness: 1, transparent: true });
  [[-5,-2],[-7,-9],[5,-8],[-5,-16],[6,-18],[-8,-25],[5,-29],[-6,-36]].forEach(function (p, idx) {
    var g = new THREE.Group();
    var trunk = new THREE.Mesh(new THREE.CylinderGeometry(.28 + idx%2*.08, .48, 6.5, 7), trunkMat);
    trunk.position.y = 3.2; trunk.castShadow = true;
    var crown = new THREE.Mesh(new THREE.ConeGeometry(2.2, 5.5, 8), crownMat);
    crown.position.y = 7.1; crown.castShadow = true;
    g.add(trunk, crown); g.position.set(p[0], groundHeight(p[0],p[1]-21), p[1]-21); forest.add(g);
  });
  var rootMat = new THREE.MeshStandardMaterial({ color: 0x594834, roughness: 1, transparent: true });
  for (var r = 0; r < 9; r++) {
    var root = new THREE.Mesh(new THREE.CylinderGeometry(.10, .16, 3 + (r%3)*.55, 7), rootMat);
    root.rotation.set(Math.PI/2, 0, (r%2 ? .72 : -.72)); root.position.set((r%2 ? 1 : -1) * (1.2 + r%3*.45), .3, 4-r*5.2); root.castShadow = true; forest.add(root);
  }
  var grassMat = new THREE.MeshStandardMaterial({ color: 0x6d8060, roughness: 1, transparent: true });
  var grassGeo = new THREE.ConeGeometry(.16, 1.15, 4);
  for (var g = 0; g < 110; g++) {
    var side = g % 2 ? 1 : -1;
    var z = 8 - (g % 55) * 1.08;
    var x = side * (2.8 + ((g * 17) % 23) * .34);
    var blade = new THREE.Mesh(grassGeo, grassMat);
    blade.position.set(x, .54 + groundHeight(x,z), z); blade.scale.y = .55 + (g%5)*.11; open.add(blade);
  }
  var rockMat = new THREE.MeshStandardMaterial({ color: 0x70736a, roughness: 1, transparent: true });
  for (var q = 0; q < 22; q++) {
    var rock = new THREE.Mesh(new THREE.DodecahedronGeometry(.22 + (q%4)*.08, 0), rockMat);
    var rx = (q%2 ? 1 : -1) * (2.4 + (q*7%19)*.36), rz = 6-q*2.7;
    rock.position.set(rx, .22 + groundHeight(rx,rz), rz); rock.scale.y = .55; rock.rotation.y = q*.8; open.add(rock);
  }

  var footprintMat = new THREE.MeshStandardMaterial({ color: 0x55c2b0, emissive: 0x173d36, transparent: true });
  var footprints = [];
  for (var f = 0; f < 12; f++) {
    var foot = new THREE.Mesh(new THREE.CapsuleGeometry(.17, .48, 3, 8), footprintMat.clone());
    foot.scale.set(.72, .18, 1); foot.rotation.x = Math.PI/2; foot.rotation.z = (f%2 ? -.12 : .12);
    foot.position.set((f%2 ? .42 : -.42), .13, 7-f*3.35); world.add(foot); footprints.push(foot);
  }

  var measureMat = new THREE.LineBasicMaterial({ color: 0x55c2b0, transparent: true, opacity: .85 });
  function makeLine(points, mat) {
    var geo = new THREE.BufferGeometry().setFromPoints(points.map(function (p) { return new THREE.Vector3(p[0],p[1],p[2]); }));
    var line = new THREE.Line(geo, mat); world.add(line); return line;
  }
  var sight = makeLine([[-.8,2.7,5],[-.8,2.7,-37]], measureMat);
  var detour = makeLine([[.7,.25,6],[1.9,.35,1],[.7,.27,-4],[2.0,.35,-9],[.7,.25,-15]], measureMat);

  var uprightMat = new THREE.LineBasicMaterial({ color: 0x55c2b0, transparent: true, opacity: .62 });
  var lowMat = new THREE.LineBasicMaterial({ color: 0x55c2b0, transparent: true, opacity: .62 });
  var upright = makeLine([[1.15,.2,5],[1.15,2.7,5],[1.15,3.55,5],[.55,2.25,5],[1.8,2.1,5],[.25,.2,5],[1.15,1.45,5],[2.0,.2,5]], uprightMat);
  var low = makeLine([[-2.1,.28,5],[-1.65,1.15,5],[-.45,1.0,5],[-.05,.25,5],[-1.45,.95,5],[-2.35,.25,5]], lowMat);

  function size() {
    var w = host.clientWidth || 1408, h = host.clientHeight || 344;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); render(1);
  }
  Deck.onResize(size);

  function setMaterialsOpacity(group, opacity) {
    group.traverse(function (obj) { if (obj.material) { obj.material.transparent = true; obj.material.opacity = opacity; obj.visible = opacity > .02; } });
  }
  function applyWorld(t) {
    setMaterialsOpacity(forest, 1-t);
    setMaterialsOpacity(open, t);
    groundMat.color.lerpColors(new THREE.Color(0x34483d), new THREE.Color(0x59634a), t);
    pathMat.color.lerpColors(new THREE.Color(0x463c31), new THREE.Color(0x686150), t);
    world.background.lerpColors(new THREE.Color(0x718a7e), new THREE.Color(0xaab59b), t);
    world.fog.color.copy(world.background); world.fog.far = 45 + t*34;
    sight.scale.z = .32 + t*.68; sight.position.z = 5 - (1-sight.scale.z)*-21;
    detour.material.opacity = .88 - t*.55;
  }
  function render(still) {
    if (state.complete) {
      renderer.setScissorTest(true);
      var w = host.clientWidth, h = host.clientHeight;
      renderer.setViewport(0,0,w/2,h); renderer.setScissor(0,0,w/2,h); camera.aspect = (w/2)/h; camera.updateProjectionMatrix(); applyWorld(0); renderer.render(world,camera);
      renderer.setViewport(w/2,0,w/2,h); renderer.setScissor(w/2,0,w/2,h); applyWorld(1); renderer.render(world,camera);
      renderer.setScissorTest(false); camera.aspect = w/h; camera.updateProjectionMatrix();
      return;
    }
    applyWorld(state.blend);
    camera.position.x = state.nudge;
    renderer.setViewport(0,0,host.clientWidth,host.clientHeight);
    renderer.render(world,camera);
  }

  var start = performance.now();
  Deck.loop(function (time, dt) {
    var target = state.env;
    state.blend += (target - state.blend) * Math.min(1, dt * 5.5);
    state.nudge *= Math.max(0, 1-dt*8);
    var elapsed = Deck.reduced() ? 3 : (time-start)/1000;
    footprints.forEach(function (foot, idx) { foot.material.opacity = Math.max(.18, Math.min(.9, elapsed*2.2-idx*.13)); });
    render();
  }, { still: 3000 });

  function updateUI() {
    envButtons.forEach(function (b) { b.setAttribute('aria-pressed', Number(b.dataset.env) === state.env ? 'true' : 'false'); });
    strategyButtons.forEach(function (b) { b.classList.toggle('correct', state.done[state.env] && b.dataset.strategy === (state.env === 0 ? 'low' : 'upright')); });
    document.getElementById('dot0').classList.toggle('done', state.done[0]);
    document.getElementById('dot1').classList.toggle('done', state.done[1]);
    progressText.textContent = '环境 ' + (state.env + 1) + ' / 2';
    groundValue.textContent = state.env === 0 ? '较高' : '较低';
    viewValue.textContent = state.env === 0 ? '较近' : '较远';
    comparisonCells.forEach(function (cell) { cell.classList.toggle('active-col', Number(cell.dataset.col) === state.env && !state.complete); });
    if (!state.done[state.env]) answerStatus.textContent = '';
  }
  function chooseEnvironment(env) {
    if (state.complete) return;
    state.env = env; state.selected = null;
    feedback.firstChild.nodeValue = env === 0 ? '根系和落差增加稳定与绕行代价。' : '长距离与远视野改变重复步行的收益。';
    updateUI();
  }
  function judge(strategy) {
    if (state.complete || state.done[state.env]) return;
    var correct = state.env === 0 ? 'low' : 'upright';
    if (strategy === correct) {
      state.done[state.env] = true; state.selected = strategy;
      answerStatus.textContent = '在这些条件下相对省力';
      connector.style.setProperty('--trace-x', strategy === 'low' ? '31%' : '69%'); connector.classList.add('show');
      (strategy === 'low' ? lowMat : uprightMat).color.setHex(0xf2b84b);
      setTimeout(function () { connector.classList.remove('show'); }, 650);
      updateUI();
      if (state.done[0] && state.done[1]) {
        setTimeout(function () { state.complete = true; sceneEl.classList.add('is-complete'); render(); }, Deck.reduced() ? 0 : 700);
      }
    } else {
      var group = document.getElementById('strategyButtons');
      group.classList.remove('shake'); void group.offsetWidth; group.classList.add('shake');
      var metric = document.getElementById(state.env === 0 ? 'groundMetric' : 'viewMetric');
      metric.classList.remove('flash'); void metric.offsetWidth; metric.classList.add('flash');
      feedback.firstChild.nodeValue = state.env === 0 ? '你忽略了当前的地面阻碍。' : '你忽略了当前的视野距离。';
      state.nudge = state.env === 0 ? -.32 : .32;
    }
  }
  envButtons.forEach(function (b) { b.addEventListener('click', function () { chooseEnvironment(Number(b.dataset.env)); }); });
  strategyButtons.forEach(function (b) { b.addEventListener('click', function () { judge(b.dataset.strategy); }); });
  document.getElementById('reset').addEventListener('click', function () {
    state.env = 0; state.blend = 0; state.done = [false,false]; state.selected = null; state.complete = false; state.nudge = 0;
    sceneEl.classList.remove('is-complete'); lowMat.color.setHex(0x55c2b0); uprightMat.color.setHex(0x55c2b0);
    feedback.firstChild.nodeValue = '先看地面阻碍与视野距离，再判断哪种策略相对省力。'; answerStatus.textContent = ''; connector.classList.remove('show'); updateUI(); render();
  });
  updateUI(); size();
})();
</script>
</body>
</html>
