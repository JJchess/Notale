<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .body-ledger {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
  }

  .body-ledger::before {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 58px;
    width: 1px;
    content: "";
    background: linear-gradient(to bottom, transparent, var(--primary-line) 12%, var(--primary-line) 88%, transparent);
  }

  .ledger-intro {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    min-width: 0;
    margin-bottom: var(--sp-4);
    padding-left: 82px;
  }

  .ledger-intro h2 {
    color: var(--text);
  }

  .ledger-intro p {
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
  }

  .ledger-head {
    display: grid;
    grid-template-columns: 40px 188px 232px minmax(0, 1.05fr) minmax(0, 0.95fr);
    gap: var(--sp-4);
    align-items: end;
    min-width: 0;
    padding: 0 var(--sp-4) var(--sp-2);
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 700;
    line-height: 1.35;
  }

  .ledger-head span:first-child {
    grid-column: 2;
  }

  .ledger-list.k-enumeration {
    --enum-cols: 1;
    display: grid;
    flex: 1 1 auto;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: repeat(3, minmax(0, 1fr));
    gap: 0;
    min-width: 0;
    min-height: 0;
    border-top: 1px solid var(--line-strong);
  }

  .ledger-list.k-enumeration > .it {
    display: grid;
    grid-template-columns: 40px 188px 232px minmax(0, 1.05fr) minmax(0, 0.95fr);
    align-items: center;
    align-content: center;
    gap: var(--sp-4);
    min-width: 0;
    padding: var(--sp-3) var(--sp-4);
    overflow: hidden;
    background: var(--surface-soft);
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    opacity: 0;
    transform: translateY(8px);
    animation: ledger-row 380ms ease forwards;
  }

  .ledger-list.k-enumeration > .it:nth-child(1) { animation-delay: 720ms; }
  .ledger-list.k-enumeration > .it:nth-child(2) { animation-delay: 900ms; }
  .ledger-list.k-enumeration > .it:nth-child(3) { animation-delay: 1080ms; }

  .row-measure {
    position: absolute;
    z-index: 0;
    inset: 0;
    width: 100%;
    height: 100%;
    color: var(--primary);
    pointer-events: none;
  }

  .row-measure .measure-main {
    stroke: currentColor;
    stroke-width: 1.5;
    opacity: 0.75;
  }

  .row-measure .measure-tick {
    stroke: var(--line-strong);
    stroke-width: 1;
  }

  .ledger-list.k-enumeration > .it > :not(.row-measure) {
    position: relative;
    z-index: 1;
  }

  .ledger-list.k-enumeration > .it::after {
    position: absolute;
    right: 0;
    bottom: -1px;
    left: 0;
    height: 1px;
    content: "";
    background: var(--primary);
    transform: scaleX(0);
    transform-origin: left center;
    animation: measure-line 560ms ease forwards;
  }

  .ledger-list.k-enumeration > .it:nth-child(1)::after { animation-delay: 180ms; }
  .ledger-list.k-enumeration > .it:nth-child(2)::after { animation-delay: 340ms; }
  .ledger-list.k-enumeration > .it:nth-child(3)::after { animation-delay: 500ms; }

  .ledger-list.k-enumeration > .it::before {
    width: 34px;
    height: 34px;
    color: var(--primary);
    background: transparent;
    border-color: var(--primary-line);
    border-radius: 50%;
    font-size: var(--fs-label);
  }

  .ledger-list .it-title {
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-sizing: border-box;
    min-width: 0;
    min-height: 92px;
    padding: var(--sp-3);
    background: var(--surface-strong);
    border: 1px solid var(--line-strong);
    border-left: 3px solid var(--primary);
  }

  .ledger-list .it-title strong {
    display: block;
    font-size: var(--fs-h2);
    line-height: var(--lh-heading);
  }

  .ledger-list .it-title span {
    display: block;
    margin-top: var(--sp-1);
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .ledger-list.k-enumeration > .it > .it-body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-sizing: border-box;
    grid-column: auto;
    min-width: 0;
    min-height: 92px;
    padding: var(--sp-3) var(--sp-4);
    color: var(--text-secondary);
    background: var(--surface-strong);
    border: 1px solid var(--line-strong);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
  }

  .ledger-list .it-body strong {
    display: block;
    margin-bottom: var(--sp-1);
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .ledger-symbol {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 216px;
    height: 92px;
    min-width: 0;
    color: var(--primary);
    border-right: 1px solid var(--line);
    border-left: 1px solid var(--line);
  }

  .ledger-symbol svg {
    width: 170px;
    height: 78px;
    overflow: visible;
  }

  .ledger-symbol .shape {
    fill: none;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .ledger-symbol .faint {
    fill: none;
    stroke: var(--line-strong);
    stroke-width: 1.2;
    stroke-dasharray: 4 5;
  }

  .ledger-symbol .land {
    fill: var(--primary-soft);
    stroke: var(--primary);
    stroke-width: 1.8;
  }

  .ledger-symbol .open {
    fill: var(--accent-soft);
    stroke: var(--accent);
    stroke-width: 1.8;
  }

  .symbol-label {
    position: absolute;
    right: var(--sp-2);
    bottom: 1px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .symbol-parts {
    display: flex;
    align-items: stretch;
    gap: var(--sp-2);
    width: 100%;
    height: 100%;
    padding: var(--sp-2);
  }

  .symbol-part {
    display: flex;
    flex: 1 1 0;
    align-items: center;
    justify-content: center;
    min-width: 0;
    color: var(--text-secondary);
    background: rgba(85, 194, 176, 0.26);
    border: 1px solid var(--primary-line);
    border-top: 3px solid var(--primary);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: 1.35;
    text-align: center;
  }

  .symbol-part.accent {
    background: rgba(242, 184, 75, 0.28);
    border-color: var(--accent-line);
    border-top-color: var(--accent);
  }

  .ledger-total {
    position: relative;
    display: grid;
    grid-template-columns: 230px minmax(0, 1fr);
    align-items: center;
    gap: var(--sp-5);
    min-width: 0;
    min-height: 104px;
    margin-top: var(--sp-4);
    padding: var(--sp-3) var(--sp-5);
    color: var(--text);
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    border-top: 2px solid var(--accent);
    opacity: 0;
    animation: total-in 420ms ease 1420ms forwards;
  }

  .ledger-total::before {
    position: absolute;
    top: -2px;
    right: 0;
    left: 0;
    height: 2px;
    content: "";
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left center;
    animation: total-line 620ms ease 1240ms forwards;
  }

  .total-label {
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 700;
    line-height: 1.35;
  }

  .total-label span {
    display: block;
    margin-top: var(--sp-1);
    color: var(--text-secondary);
    font-family: var(--font-sans);
    font-size: var(--fs-sec);
    font-weight: 400;
    line-height: var(--lh-sec);
  }

  .total-claim {
    font-size: var(--fs-lead);
    font-weight: 700;
    line-height: var(--lh-body);
  }

  .total-claim span {
    color: var(--accent);
  }

  .footprints {
    position: absolute;
    z-index: 0;
    bottom: 116px;
    left: 5px;
    width: 54px;
    height: 392px;
    pointer-events: none;
  }

  .print {
    position: absolute;
    width: 21px;
    height: 43px;
    opacity: 0;
    animation: print-in 280ms ease forwards;
  }

  .print::before {
    position: absolute;
    top: 0;
    left: 3px;
    width: 15px;
    height: 26px;
    content: "";
    background: var(--primary-soft);
    border: 1px solid var(--primary-line);
    border-radius: 55% 55% 44% 44%;
  }

  .print::after {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 20px;
    height: 14px;
    content: "";
    background: var(--primary-soft);
    border: 1px solid var(--primary-line);
    border-radius: 50%;
  }

  .print:nth-child(1) { bottom: 0; left: 1px; transform: rotate(-14deg); animation-delay: 60ms; }
  .print:nth-child(2) { bottom: 70px; left: 27px; transform: rotate(13deg); animation-delay: 130ms; }
  .print:nth-child(3) { bottom: 140px; left: 2px; transform: rotate(-12deg); animation-delay: 200ms; }
  .print:nth-child(4) { bottom: 210px; left: 27px; transform: rotate(12deg); animation-delay: 270ms; }
  .print:nth-child(5) { bottom: 280px; left: 3px; transform: rotate(-10deg); animation-delay: 340ms; }
  .print:nth-child(6) { bottom: 345px; left: 27px; transform: rotate(10deg); animation-delay: 410ms; }

  @keyframes print-in {
    from { opacity: 0; }
    to { opacity: 0.9; }
  }

  @keyframes measure-line {
    to { transform: scaleX(1); }
  }

  @keyframes ledger-row {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes total-line {
    to { transform: scaleX(1); }
  }

  @keyframes total-in {
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .print,
    .ledger-list.k-enumeration > .it,
    .ledger-list.k-enumeration > .it::after,
    .ledger-total,
    .ledger-total::before {
      animation: none;
      opacity: 1;
      transform: none;
    }
  }
</style>
</head>
<body data-page="10" data-total="44">
<div id="stage">
<main id="main">
  <section class="body-ledger" aria-labelledby="ledger-heading">
    <div class="footprints" aria-hidden="true">
      <span class="print"></span><span class="print"></span><span class="print"></span>
      <span class="print"></span><span class="print"></span><span class="print"></span>
    </div>

    <header class="ledger-intro">
      <h2 id="ledger-heading">三项证据，同一方向</h2>
      <p>身体结构、行走方式、环境条件共同改变</p>
    </header>

    <div class="ledger-head" aria-hidden="true">
      <span>对象</span>
      <span>技术符号</span>
      <span>已看到什么</span>
      <span>说明什么</span>
    </div>

    <div class="ledger-list k-enumeration min0">
      <article class="it min0">
        <svg class="row-measure" viewBox="0 0 1408 156" preserveAspectRatio="none" aria-hidden="true"><path class="measure-main" d="M0 78H1408"/><path class="measure-tick" d="M40 68v20M244 68v20M492 68v20M970 68v20M1390 68v20"/></svg>
        <div class="it-title min0">
          <strong>身体结构</strong>
          <span>STRUCTURE</span>
        </div>
        <div class="ledger-symbol" aria-label="骨盆、膝部、足弓协同">
          <div class="symbol-parts">
            <span class="symbol-part">骨盆</span>
            <span class="symbol-part">膝部</span>
            <span class="symbol-part">足弓</span>
          </div>
        </div>
        <p class="it-body min0"><strong>观察</strong>骨盆、膝部与足弓需要协同。</p>
        <p class="it-body min0"><strong>判断</strong>直立行走不是单一部位的变化。</p>
      </article>

      <article class="it min0">
        <svg class="row-measure" viewBox="0 0 1408 156" preserveAspectRatio="none" aria-hidden="true"><path class="measure-main" d="M0 78H1408"/><path class="measure-tick" d="M40 68v20M244 68v20M492 68v20M970 68v20M1390 68v20"/></svg>
        <div class="it-title min0">
          <strong>行走方式</strong>
          <span>GAIT</span>
        </div>
        <div class="ledger-symbol" aria-label="支撑、摆动、落地连续调整">
          <div class="symbol-parts">
            <span class="symbol-part">支撑</span>
            <span class="symbol-part">摆动</span>
            <span class="symbol-part">落地</span>
          </div>
        </div>
        <p class="it-body min0"><strong>观察</strong>稳定步态来自连续的姿态调整。</p>
        <p class="it-body min0"><strong>判断</strong>保持稳定的同时，身体也承担代价。</p>
      </article>

      <article class="it min0">
        <svg class="row-measure" viewBox="0 0 1408 156" preserveAspectRatio="none" aria-hidden="true"><path class="measure-main" d="M0 78H1408"/><path class="measure-tick" d="M40 68v20M244 68v20M492 68v20M970 68v20M1390 68v20"/></svg>
        <div class="it-title min0">
          <strong>环境条件</strong>
          <span>SETTING</span>
        </div>
        <div class="ledger-symbol" aria-label="地面、视野、条件共同影响身体方案">
          <div class="symbol-parts">
            <span class="symbol-part">地面</span>
            <span class="symbol-part accent">视野</span>
            <span class="symbol-part">条件</span>
          </div>
        </div>
        <p class="it-body min0"><strong>观察</strong>地面与视野会随环境而不同。</p>
        <p class="it-body min0"><strong>判断</strong>身体方案是否合适，要看所处条件。</p>
      </article>
    </div>

    <div class="ledger-total">
      <p class="total-label">TOTAL / 总账<span>不是单一起因，也不是升级阶梯</span></p>
      <p class="total-claim">先出现的，不是一个突然变聪明的人，<br>而是一种新的<span>身体与环境关系</span>。</p>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>

</script>

</html>
