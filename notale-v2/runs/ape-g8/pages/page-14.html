<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main {
    --body-x: 214px;
    --tool-x: 1126px;
    --env-y: 454px;
  }

  .lesson {
    height: 100%;
    gap: 12px;
  }

  .progress-strip {
    min-height: 46px;
    padding: 0 8px 0 24px;
    border-left: 2px solid var(--primary-line);
  }

  .progress-label {
    color: var(--text-secondary);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: 1.35;
  }

  .progress-dots {
    display: flex;
    gap: 10px;
    margin-left: 16px;
  }

  .progress-dot {
    width: 18px;
    height: 18px;
    box-sizing: border-box;
    background: var(--surface);
    border: 2px solid var(--line-strong);
    border-radius: 50%;
    transition: background-color 180ms ease, border-color 180ms ease;
  }

  .progress-dot.done {
    background: var(--primary);
    border-color: var(--primary);
  }

  .progress-count {
    min-width: 92px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: var(--fs-sec);
    font-weight: 700;
    line-height: 1.45;
    text-align: right;
  }

  .reset {
    width: 44px;
    min-width: 44px;
    padding: 0;
    color: var(--text-secondary);
    font-size: 24px;
  }

  .classification-board {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
  }

  .classification-board > .lv {
    height: 100%;
  }

  .category-row {
    position: relative;
    z-index: 2;
    display: flex;
    flex: 1 1 auto;
    align-items: stretch;
    gap: 24px;
    min-width: 0;
  }

  .ability-box {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    overflow: hidden;
  }

  .ability-box > .bt {
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: color 220ms ease, opacity 220ms ease;
  }

  .direct-mark {
    color: var(--text-muted);
    font-size: var(--fs-label);
    font-weight: 600;
    line-height: 1.35;
  }

  .ability-box.body-box {
    border-left-color: var(--primary);
  }

  .ability-box.tool-box {
    border-left-color: var(--accent);
  }

  .ability-box.tool-box > .bt {
    border-bottom-color: var(--accent-line);
  }

  .slots {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .ability-slot {
    position: relative;
    display: flex;
    min-height: 67px;
    box-sizing: border-box;
    align-items: center;
    padding: 9px 12px;
    color: var(--text-muted);
    background: rgba(17, 20, 23, 0.52);
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius-sm);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .ability-slot.filled {
    align-items: stretch;
    color: var(--text);
    background: var(--primary-soft);
    border-color: var(--primary-line);
    border-style: solid;
    animation: settle 240ms ease-out both;
  }

  .placed-content {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    gap: 4px;
  }

  .placed-action {
    overflow: hidden;
    font-size: var(--fs-sec);
    font-weight: 700;
    line-height: 1.45;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .relation-line {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
    color: var(--text-secondary);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .relation-line::before {
    flex: 0 0 18px;
    height: 1px;
    content: "";
    background: var(--primary);
  }

  .relation-line strong {
    color: var(--primary);
    font-size: var(--fs-label);
  }

  .decision-bay {
    flex: 0 0 348px;
    align-self: center;
    min-width: 0;
    padding: 18px;
    background: #141a1c;
    border: 1px solid var(--accent-line);
    border-top: 3px solid var(--accent);
    border-radius: var(--radius-sm);
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.22);
    animation: card-in 360ms ease-out both;
  }

  .decision-bay.shake {
    animation: shake 260ms ease-in-out;
  }

  .prompt {
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    line-height: 1.45;
    text-align: center;
  }

  .current-action {
    min-height: 58px;
    margin: 8px 0 12px;
    color: var(--text);
    font-size: var(--fs-h2);
    font-weight: 700;
    line-height: 1.35;
    text-align: center;
  }

  .choice-row {
    display: flex;
    gap: 10px;
  }

  .choice-row button {
    flex: 1 1 0;
    min-width: 0;
  }

  .choice-row button:first-child {
    border-color: var(--primary-line);
  }

  .choice-row button:last-child {
    border-color: var(--accent-line);
  }

  .feedback {
    min-height: 44px;
    margin-top: 10px;
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    line-height: 1.45;
    text-align: center;
  }

  .feedback.error {
    color: var(--danger);
  }

  .environment-box {
    position: relative;
    z-index: 2;
    flex: 0 0 86px;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 12px 18px 12px 22px;
    border-left-color: var(--line-strong);
    background: #151b1d;
  }

  .environment-title {
    flex: 0 0 126px;
  }

  .environment-title strong {
    display: block;
    font-size: var(--fs-sec);
    line-height: 1.45;
  }

  .environment-title span {
    display: block;
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .baseline {
    position: relative;
    display: flex;
    flex: 1 1 auto;
    justify-content: space-around;
    min-width: 0;
    padding-top: 17px;
    border-top: 2px solid var(--line-strong);
  }

  .baseline::before,
  .baseline::after {
    position: absolute;
    top: -7px;
    width: 1px;
    height: 12px;
    content: "";
    background: var(--line-strong);
  }

  .baseline::before { left: 0; }
  .baseline::after { right: 0; }

  .env-node {
    position: relative;
    min-width: 132px;
    color: var(--text-secondary);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: 1.35;
    text-align: center;
  }

  .env-node::before {
    position: absolute;
    top: -23px;
    left: 50%;
    width: 9px;
    height: 9px;
    content: "";
    background: var(--surface);
    border: 2px solid var(--primary);
    border-radius: 50%;
    transform: translateX(-50%);
  }

  .network {
    position: absolute;
    z-index: 1;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .network path {
    fill: none;
    stroke: var(--primary);
    stroke-width: 1.5;
    stroke-dasharray: 7 8;
    opacity: 0;
    transition: opacity 260ms ease, stroke-width 260ms ease;
  }

  .network path.on {
    opacity: 0.48;
  }

  .classification-board.complete .network path.on {
    stroke-width: 2.5;
    opacity: 0.9;
  }

  .classification-board.complete .ability-box > .bt {
    color: var(--text-secondary);
    opacity: 0.62;
  }

  .takeaway {
    min-height: 56px;
    padding: 10px 18px;
    color: var(--text-secondary);
    background: var(--surface-raised);
    border-left: 4px solid var(--primary);
    font-size: var(--fs-sec);
    line-height: 1.45;
    transition: border-color 240ms ease, background-color 240ms ease;
  }

  .takeaway strong {
    color: var(--text);
  }

  .takeaway.complete {
    background: var(--primary-soft);
    border-left-color: var(--accent);
  }

  .final-claim {
    color: var(--accent);
    font-size: var(--fs-lead);
    font-weight: 700;
    line-height: 1.5;
  }

  @keyframes settle {
    from { opacity: 0; transform: translateY(9px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-9px); }
    55% { transform: translateX(8px); }
    78% { transform: translateX(-4px); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body data-page="14" data-total="44">
<div id="stage">
<main id="main">
  <section class="lesson col" aria-label="分布式能力分类活动">
    <div class="progress-strip row items-center between shrink0">
      <div class="row items-center min0">
        <span class="progress-label">按直接执行者归类</span>
        <div class="progress-dots" id="progressDots" aria-label="六项分类进度"></div>
      </div>
      <div class="row items-center gap-3 shrink0">
        <output class="progress-count" id="progressCount">已归类 0/6</output>
        <button class="reset" id="resetBtn" type="button" title="清空并重做" aria-label="清空并重做">↻</button>
      </div>
    </div>

    <div class="classification-board k-classification min0" id="board">
      <div class="lv min0">
        <svg class="network" viewBox="0 0 1360 462" preserveAspectRatio="none" aria-hidden="true">
          <path id="line-0" d="M 205 118 C 265 260, 330 330, 470 424" />
          <path id="line-1" d="M 1152 118 C 1050 250, 960 330, 870 424" />
          <path id="line-2" d="M 205 196 C 360 260, 560 335, 680 424" />
          <path id="line-3" d="M 1152 196 C 1020 268, 860 345, 680 424" />
          <path id="line-4" d="M 205 274 C 360 328, 700 360, 870 424" />
          <path id="line-5" d="M 1152 274 C 980 330, 700 350, 470 424" />
        </svg>

        <div class="category-row min0">
          <section class="box ability-box body-box min0" aria-labelledby="bodyTitle">
            <h2 class="bt" id="bodyTitle"><span>身体能力</span><span class="direct-mark">身体直接完成</span></h2>
            <div class="slots" id="bodySlots"></div>
          </section>

          <section class="decision-bay min0" id="decisionBay" aria-labelledby="currentAction">
            <p class="prompt">此刻，谁直接完成这个动作？</p>
            <div class="current-action" id="currentAction"></div>
            <div class="choice-row">
              <button type="button" id="chooseBody">身体</button>
              <button type="button" id="chooseTool">工具</button>
            </div>
            <p class="feedback" id="feedback" aria-live="polite">归位后再看它依赖什么。</p>
          </section>

          <section class="box ability-box tool-box min0" aria-labelledby="toolTitle">
            <h2 class="bt" id="toolTitle"><span>工具能力</span><span class="direct-mark">工具直接完成</span></h2>
            <div class="slots" id="toolSlots"></div>
          </section>
        </div>

        <section class="box environment-box min0" aria-label="环境支撑层">
          <div class="environment-title shrink0">
            <strong>环境支撑</strong>
            <span>贯穿两类</span>
          </div>
          <div class="baseline min0">
            <span class="env-node">砧面 · 反作用力</span>
            <span class="env-node">光线 · 边缘可见</span>
            <span class="env-node">材料 · 限制动作</span>
          </div>
        </section>
      </div>
    </div>

    <div class="takeaway shrink0" id="takeaway">
      <strong>“会切割”</strong>既不只在手里，也不只在石片里；它存在于抓握、锋刃、材料与视觉反馈组成的关系中。
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Lec.mount({
    index: 14,
    kicker: "DISTRIBUTED ABILITY",
    title: "能力不只在脑中",
    take: "很多看似属于大脑的能力，其实分布在身体、工具和环境之间。"
  });

  const items = [
    { action: "抓稳石核", owner: "body", direct: "身体直接执行", support: "石核 + 材料" },
    { action: "集中冲击力", owner: "tool", direct: "工具直接执行", support: "手臂 + 材料" },
    { action: "控制打击落点", owner: "body", direct: "身体直接执行", support: "石锤 + 砧面" },
    { action: "保持锋利边缘", owner: "tool", direct: "工具直接执行", support: "材料 + 打击角度" },
    { action: "根据视觉反馈调整动作", owner: "body", direct: "身体直接执行", support: "光线 + 工具边缘" },
    { action: "让切割动作可重复", owner: "tool", direct: "工具直接执行", support: "抓握 + 材料" }
  ];

  const state = { index: 0, bodyCount: 0, toolCount: 0 };
  const bodySlots = document.getElementById("bodySlots");
  const toolSlots = document.getElementById("toolSlots");
  const currentAction = document.getElementById("currentAction");
  const feedback = document.getElementById("feedback");
  const decisionBay = document.getElementById("decisionBay");
  const board = document.getElementById("board");
  const takeaway = document.getElementById("takeaway");
  const progressCount = document.getElementById("progressCount");
  const chooseBody = document.getElementById("chooseBody");
  const chooseTool = document.getElementById("chooseTool");
  const dots = document.getElementById("progressDots");

  function makeSlots(target, ownerLabel) {
    target.replaceChildren();
    for (let i = 0; i < 3; i += 1) {
      const slot = document.createElement("div");
      slot.className = "ability-slot";
      slot.textContent = `${ownerLabel}空位 ${i + 1}`;
      target.appendChild(slot);
    }
  }

  function reset() {
    state.index = 0;
    state.bodyCount = 0;
    state.toolCount = 0;
    makeSlots(bodySlots, "身体能力");
    makeSlots(toolSlots, "工具能力");
    dots.replaceChildren();
    items.forEach((_, index) => {
      const dot = document.createElement("span");
      dot.className = "progress-dot";
      dot.setAttribute("aria-label", `第 ${index + 1} 项未完成`);
      dots.appendChild(dot);
      document.getElementById(`line-${index}`).classList.remove("on");
    });
    board.classList.remove("complete");
    takeaway.classList.remove("complete");
    takeaway.innerHTML = "<strong>“会切割”</strong>既不只在手里，也不只在石片里；它存在于抓握、锋刃、材料与视觉反馈组成的关系中。";
    chooseBody.disabled = false;
    chooseTool.disabled = false;
    feedback.className = "feedback";
    renderCurrent();
  }

  function renderCurrent() {
    progressCount.value = `已归类 ${state.index}/6`;
    progressCount.textContent = `已归类 ${state.index}/6`;
    if (state.index < items.length) {
      currentAction.textContent = items[state.index].action;
      feedback.textContent = "归位后再看它依赖什么。";
      return;
    }
    currentAction.textContent = "能力存在于关系中";
    feedback.textContent = "六项能力已接入身体、工具与环境。";
    chooseBody.disabled = true;
    chooseTool.disabled = true;
    board.classList.add("complete");
    takeaway.classList.add("complete");
    takeaway.innerHTML = "<span class=\"final-claim\">能力存在于关系中。</span> 身体执行动作，工具保持作用，环境提供成立条件。";
  }

  function place(item) {
    const slotIndex = item.owner === "body" ? state.bodyCount++ : state.toolCount++;
    const target = item.owner === "body" ? bodySlots : toolSlots;
    const slot = target.children[slotIndex];
    slot.classList.add("filled");
    slot.replaceChildren();

    const content = document.createElement("div");
    content.className = "placed-content";
    const action = document.createElement("div");
    action.className = "placed-action";
    action.textContent = item.action;
    const relation = document.createElement("div");
    relation.className = "relation-line";
    const direct = document.createElement("strong");
    direct.textContent = item.direct;
    const support = document.createElement("span");
    support.textContent = `支撑：${item.support}`;
    relation.append(direct, support);
    content.append(action, relation);
    slot.appendChild(content);
  }

  function choose(owner) {
    if (state.index >= items.length) return;
    const item = items[state.index];
    if (owner !== item.owner) {
      feedback.className = "feedback error";
      feedback.textContent = "看直接完成动作的是身体还是工具；依赖关系会在归位后展开。";
      decisionBay.classList.remove("shake");
      void decisionBay.offsetWidth;
      decisionBay.classList.add("shake");
      return;
    }

    place(item);
    dots.children[state.index].classList.add("done");
    dots.children[state.index].setAttribute("aria-label", `第 ${state.index + 1} 项已完成`);
    document.getElementById(`line-${state.index}`).classList.add("on");
    state.index += 1;
    feedback.className = "feedback";
    renderCurrent();
  }

  chooseBody.addEventListener("click", () => choose("body"));
  chooseTool.addEventListener("click", () => choose("tool"));
  document.getElementById("resetBtn").addEventListener("click", reset);
  reset();
</script>
</body>
</html>
