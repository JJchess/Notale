<style>
  #main { padding-top: 32px; padding-bottom: 28px; }
  .loop-page { height: 100%; }
  .loop-page.k-generalization { grid-template-rows: auto minmax(0, 1fr); gap: 14px; }
  .loop-page.k-generalization > .claim {
    width: 100%; max-width: none; box-sizing: border-box; padding: 12px 20px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 32px;
  }
  .claim-main { font-size: var(--fs-lead); font-weight: 700; line-height: var(--lh-body); }
  .claim-guard { color: var(--text-secondary); font-size: var(--fs-sec); font-weight: 400; line-height: var(--lh-sec); }
  .loop-page.k-generalization > .supports {
    display: block; position: relative; min-height: 0; padding: 0; overflow: visible;
  }
  .loop-page.k-generalization > .supports::before { display: none; }
  .loop-page.k-generalization > .supports > .trunk {
    top: -14px; left: 50%; width: 2px; height: 14px; background: var(--accent);
  }
  .loop-field { position: absolute; inset: 0; min-width: 0; }
  .route-map { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .guide-ring { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 9; }
  .route-base { fill: none; stroke: var(--line-strong); stroke-width: 2; }
  .route-live { fill: none; stroke: var(--primary); stroke-width: 4; stroke-linecap: round; opacity: 0; filter: drop-shadow(0 0 6px rgba(85,194,176,.35)); }
  .route-live.complete { opacity: 1; }
  .route-dot { fill: var(--primary); opacity: 0; }
  .path-legend { position: absolute; top: 4px; left: 16px; color: var(--text-muted); font-size: var(--fs-label); line-height: 1.35; }
  .node {
    position: absolute; z-index: 4; width: 184px; min-height: 78px; box-sizing: border-box;
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    color: var(--text-secondary); background: var(--surface-raised); border: 1px solid var(--line-strong);
    border-left: 4px solid var(--primary); border-radius: var(--radius-sm); will-change: transform, opacity;
  }
  .node.is-current { color: var(--text); border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .node.is-seen:not(.is-current) { border-color: var(--primary-line); }
  .node-icon { width: 42px; height: 42px; flex: 0 0 auto; color: var(--primary); }
  .node.is-current .node-icon { color: var(--accent); }
  .node-title { display: block; color: var(--text); font-size: var(--fs-h2); font-weight: 700; line-height: var(--lh-heading); }
  .node-sub { display: block; color: var(--text-muted); font-size: var(--fs-label); line-height: 1.35; }
  .node-hand { top: 4px; left: calc(50% - 92px); }
  .node-tool { top: calc(50% - 39px); right: 36px; }
  .node-food { bottom: 4px; left: calc(50% - 92px); }
  .node-brain { top: calc(50% - 39px); left: 36px; }
  .support {
    z-index: 3; width: 286px; min-height: 88px; box-sizing: border-box; padding: 9px 12px !important;
    opacity: .43; transition: opacity 180ms ease, border-color 180ms ease, background-color 180ms ease;
  }
  .loop-page.k-generalization .support::before { display: none; }
  .support.is-active, .support.is-seen { opacity: 1; }
  .support.is-active { background: var(--primary-soft); border-color: var(--primary-line); }
  .support-title { display: block; margin-bottom: 3px; color: var(--text); font-size: var(--fs-label); font-weight: 700; line-height: 1.35; }
  .support-line { display: block; font-size: var(--fs-sec); line-height: var(--lh-sec); }
  .loop-page.k-generalization .support-ht { position: absolute; top: 26px; right: 218px; }
  .loop-page.k-generalization .support-tf { position: absolute; right: 72px; bottom: 36px; }
  .loop-page.k-generalization .support-fb { position: absolute; bottom: 36px; left: 72px; }
  .loop-page.k-generalization .support-bh { position: absolute; top: 26px; left: 218px; }
  .dial-zone {
    position: absolute; z-index: 6; top: 50%; left: 50%; width: 250px; height: 250px;
    transform: translate(-50%, -50%); text-align: center;
  }
  .dial {
    position: relative; width: 170px; height: 170px; margin: 0 auto; border-radius: 50%;
    background: #141a1c; border: 2px solid var(--line-strong); box-shadow: inset 0 0 0 12px var(--surface-raised);
    cursor: grab; touch-action: none; outline: none;
  }
  .dial:active { cursor: grabbing; }
  .dial:focus-visible { box-shadow: inset 0 0 0 12px var(--surface-raised), 0 0 0 4px var(--focus); }
  .dial-ticks { position: absolute; inset: -14px; border: 1px solid var(--line); border-radius: 50%; pointer-events: none; }
  .dial-tick { position: absolute; width: 8px; height: 8px; background: var(--line-strong); border-radius: 50%; }
  .dial-tick.is-seen { background: var(--primary); box-shadow: 0 0 8px var(--primary); }
  .tick-0 { top: -4px; left: calc(50% - 4px); }
  .tick-1 { top: calc(50% - 4px); right: -4px; }
  .tick-2 { bottom: -4px; left: calc(50% - 4px); }
  .tick-3 { top: calc(50% - 4px); left: -4px; }
  .dial-pointer { position: absolute; top: 17px; left: calc(50% - 3px); width: 6px; height: 52px; background: var(--accent); transform-origin: 3px 68px; }
  .dial-pointer::before { position: absolute; top: -7px; left: -4px; width: 14px; height: 14px; content: ""; background: var(--accent); clip-path: polygon(50% 0,100% 100%,0 100%); }
  .dial-core { position: absolute; inset: 50%; width: 70px; height: 70px; transform: translate(-50%,-50%); border-radius: 50%; background: var(--surface-strong); border: 1px solid var(--line-strong); }
  .dial-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text); font-size: var(--fs-label); font-weight: 700; line-height: 1.35; }
  .status { margin-top: 12px; color: var(--text); font-family: var(--font-mono); font-size: var(--fs-sec); line-height: var(--lh-sec); }
  .instruction { margin-top: 2px; color: var(--text-secondary); font-size: var(--fs-sec); line-height: var(--lh-sec); white-space: nowrap; }
  .instruction.is-error { color: var(--accent); }
  .reset {
    display: none; position: absolute; z-index: 8; right: 8px; bottom: 6px; width: 44px; height: 44px; padding: 0;
  }
  .reset.is-visible { display: inline-flex; }
  .reset svg { width: 22px; height: 22px; }
  @media (prefers-reduced-motion: reduce) {
    .node, .support { transition: none; }
  }
</style>

<script>
Lec.mount({
  index: 16,
  kicker: "E3 · FEEDBACK LOOP",
  title: "工具、食物、手和大脑怎样彼此改变？",
  take: "工具、食物、手和大脑之间不是单向因果，而是循环反馈。"
});

(function () {
  var names = ["手", "工具", "食物加工", "大脑"];
  var dial = document.getElementById("dial");
  var pointer = document.getElementById("dialPointer");
  var label = document.getElementById("dialLabel");
  var status = document.getElementById("status");
  var instruction = document.getElementById("instruction");
  var reset = document.getElementById("reset");
  var claim = document.getElementById("claimText");
  var nodes = Array.prototype.slice.call(document.querySelectorAll(".node"));
  var supports = Array.prototype.slice.call(document.querySelectorAll(".support"));
  var routes = Array.prototype.slice.call(document.querySelectorAll(".route-live"));
  var ticks = Array.prototype.slice.call(document.querySelectorAll(".dial-tick"));
  var state = { current: 0, seen: [false, false, false, false], dragging: false, angle: 0 };
  var reduced = Deck.reduced();

  function stopAngle(index) { return index * 90; }
  function nearestIndex(angle) { return Math.round((((angle % 360) + 360) % 360) / 90) % 4; }
  function angularDistance(a, b) {
    var d = Math.abs((((a - b) % 360) + 360) % 360);
    return Math.min(d, 360 - d);
  }
  function setPointer(angle, animateIt) {
    state.angle = angle;
    anime.remove(pointer);
    if (animateIt && !reduced) {
      anime({ targets: pointer, rotate: angle, duration: 420, easing: "easeOutBack" });
    } else {
      pointer.style.transform = "rotate(" + angle + "deg)";
    }
  }
  function prepPath(path) {
    var len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    return len;
  }
  routes.forEach(prepPath);

  function illuminate(index) {
    var outgoing = index;
    var returning = (index + 3) % 4;
    routes.forEach(function (route, i) {
      anime.remove(route);
      if (!state.seen.every(Boolean)) {
        route.style.opacity = (i === outgoing || i === returning) ? "1" : "0";
        route.style.strokeDashoffset = route.getTotalLength();
      }
    });
    supports.forEach(function (el, i) {
      el.classList.toggle("is-active", i === outgoing || i === returning);
      if (state.seen[i] || state.seen[(i + 1) % 4]) el.classList.add("is-seen");
    });
    if (!reduced) {
      anime.timeline({ easing: "easeInOutQuad" })
        .add({ targets: routes[outgoing], strokeDashoffset: 0, duration: 620 })
        .add({ targets: routes[returning], strokeDashoffset: 0, duration: 620 }, "-=160");
    } else {
      routes[outgoing].style.strokeDashoffset = 0;
      routes[returning].style.strokeDashoffset = 0;
    }
  }

  function render(index, markSeen) {
    state.current = index;
    if (markSeen) state.seen[index] = true;
    setPointer(stopAngle(index), true);
    label.textContent = names[index];
    dial.setAttribute("aria-valuenow", String(index + 1));
    dial.setAttribute("aria-valuetext", names[index]);
    nodes.forEach(function (el, i) {
      el.classList.toggle("is-current", i === index);
      el.classList.toggle("is-seen", state.seen[i]);
    });
    ticks.forEach(function (el, i) { el.classList.toggle("is-seen", state.seen[i]); });
    var count = state.seen.filter(Boolean).length;
    status.textContent = "已查看 " + count + " / 4 个视角";
    instruction.classList.remove("is-error");
    instruction.textContent = "从“" + names[index] + "”出发：相邻两条影响路径依次接通。";
    illuminate(index);
    if (count === 4) complete();
  }

  function complete() {
    claim.textContent = "不是单向因果，而是循环反馈";
    instruction.textContent = "四条局部关系共同构成回路，没有唯一开端。";
    reset.classList.add("is-visible");
    supports.forEach(function (el) { el.classList.add("is-seen"); el.classList.remove("is-active"); });
    routes.forEach(function (route) { route.style.opacity = "1"; route.style.strokeDashoffset = "0"; });
    if (!reduced) {
      anime({
        targets: routes,
        strokeDashoffset: function (el) { return [el.getTotalLength(), 0]; },
        delay: anime.stagger(180), duration: 700, easing: "easeInOutQuad"
      });
    }
  }

  function angleFromEvent(e) {
    var p = Deck.pt(dial, e);
    var dx = p.x - dial.offsetWidth / 2;
    var dy = p.y - dial.offsetHeight / 2;
    return (Math.atan2(dy, dx) * 180 / Math.PI + 90 + 360) % 360;
  }
  function begin(e) {
    state.dragging = true;
    dial.setPointerCapture(e.pointerId);
    setPointer(angleFromEvent(e), false);
  }
  function move(e) {
    if (!state.dragging) return;
    setPointer(angleFromEvent(e), false);
  }
  function end(e) {
    if (!state.dragging) return;
    state.dragging = false;
    var angle = angleFromEvent(e);
    var idx = nearestIndex(angle);
    if (angularDistance(angle, stopAngle(idx)) > 24) {
      setPointer(stopAngle(state.current), true);
      instruction.textContent = "停在一个节点：先看它改变了什么，再看什么可能反过来改变它。";
      instruction.classList.add("is-error");
      if (!reduced) anime({ targets: ".dial-zone", translateX: [0, -7, 7, -4, 4, 0], duration: 330, easing: "easeInOutSine" });
      return;
    }
    render(idx, true);
  }
  dial.addEventListener("pointerdown", begin);
  dial.addEventListener("pointermove", move);
  dial.addEventListener("pointerup", end);
  dial.addEventListener("pointercancel", function () { state.dragging = false; setPointer(stopAngle(state.current), true); });
  dial.addEventListener("keydown", function (e) {
    var next = state.current;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (next + 1) % 4;
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (next + 3) % 4;
    else if (e.key === "Home") next = 0;
    else if (e.key === "End") next = 3;
    else return;
    e.preventDefault();
    render(next, true);
  });
  reset.addEventListener("click", function () {
    state.seen = [false, false, false, false];
    claim.textContent = "能力形成于循环反馈";
    reset.classList.remove("is-visible");
    supports.forEach(function (el) { el.classList.remove("is-seen", "is-active"); });
    routes.forEach(function (route) { anime.remove(route); route.style.opacity = "0"; route.style.strokeDashoffset = route.getTotalLength(); });
    render(0, false);
    instruction.textContent = "转动拨盘：先看改变怎样传出，再看影响怎样返回。";
  });

  if (!reduced) {
    anime.timeline({ easing: "easeOutCubic" })
      .add({ targets: ".node", translateX: function (_, i) { return [i === 1 ? 90 : i === 3 ? -90 : 0, 0]; }, translateY: function (_, i) { return [i === 0 ? -70 : i === 2 ? 70 : 0, 0]; }, opacity: [0, 1], delay: anime.stagger(90), duration: 560 })
      .add({ targets: ".dial-tick", scale: [0, 1], opacity: [0, 1], delay: anime.stagger(70), duration: 300 }, "-=180")
      .add({ targets: ".route-base", strokeDashoffset: [anime.setDashoffset, 0], delay: anime.stagger(100), duration: 520 }, "-=180");
  }
  render(0, false);
})();
</script>
