(function(){
var events=[{name:"Oldowan",notes:{brain:"范围重叠，并非同步跃迁",tool:"少步打制",social:"与可重复动作相容"},states:{brain:"宽范围重叠",tool:"少步打制",social:"重复动作"}},{name:"Acheulean",notes:{brain:"总体仍呈渐变",tool:"多步修整与较高标准化",social:"与长序列规划相容"},states:{brain:"总体渐变",tool:"多步修整",social:"长序列规划"}},{name:"预制石核",notes:{brain:"未见同刻突变",tool:"先规划石核形状",social:"较高学习要求，但证据间接"},states:{brain:"无同刻突变",tool:"预先塑形",social:"间接推断"}},{name:"复合工具",notes:{brain:"已较早进入宽范围",tool:"多材料、多部件组合",social:"协作推断增强，仍不能直测语言"},states:{brain:"较早进入范围",tool:"组合多材料",social:"协作相容"}}];
var rows=[{id:"brain",range:[5,93]},{id:"tool",range:[7,91]},{id:"social",range:[12,88]}],positions=[12,38,65,88],placed=new Set();
d3.selectAll(".cell").data(rows).each(function(row){var lane=d3.select(this).append("div").attr("class","lane");lane.append("div").attr("class","baseline");lane.append("div").attr("class","range-band").style("left",row.range[0]+"%").style("width",(row.range[1]-row.range[0])+"%");lane.selectAll(".evidence-window").data(events).join("span").attr("class","evidence-window").attr("data-kind",row.id).style("left",function(d,i){return positions[i]+"%"}).text(function(d){return d.states[row.id]});lane.selectAll(".event-mark").data(events).join("span").attr("class","event-mark").attr("data-slot",function(d,i){return i}).style("left",function(d,i){return positions[i]+"%"});if(row.id==="tool"){lane.selectAll(".dropzone").data(events).join("span").attr("class","dropzone").attr("data-slot",function(d,i){return i}).attr("data-roman",function(d,i){return["I","II","III","IV"][i]}).style("left",function(d,i){return positions[i]+"%"})}lane.selectAll(".sync-note").data(events).join("span").attr("class","sync-note").attr("data-slot",function(d,i){return i}).text(function(d){return d.notes[row.id]})});
d3.select("#comparison").selectAll(".cursor").data(events).join("span").attr("class","cursor").attr("data-slot",function(d,i){return i}).style("left",function(d,i){return"calc(240px + (100% - 240px) * "+positions[i]/100+")"});
var feedback=document.getElementById("feedback"),count=document.getElementById("doneCount"),reset=document.getElementById("resetBtn"),claim=document.getElementById("claim");
function setFeedback(text,isError){feedback.textContent=text;feedback.classList.toggle("error",!!isError)}
function place(card,slot){if(placed.has(slot))return;placed.add(slot);card.classList.add("placed");card.disabled=true;document.querySelector('.dropzone[data-slot="'+slot+'"]').classList.add("is-set");document.querySelectorAll('.event-mark[data-slot="'+slot+'"]').forEach(function(el){el.classList.add("is-set")});document.querySelector('.cursor[data-slot="'+slot+'"]').classList.add("show");document.querySelectorAll(".sync-note").forEach(function(el){el.classList.remove("show")});document.querySelectorAll('.sync-note[data-slot="'+slot+'"]').forEach(function(el){el.classList.add("show")});count.textContent=String(placed.size);setFeedback(events[slot].name+" 已接通：同一年代的三类证据并未一起跃迁。",false);if(placed.size===4){claim.classList.add("show");reset.hidden=false;setFeedback("四个窗已对齐：宽色带表示渐变与差异，事件点只表示考古证据。",false)}}
function reject(card){card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake");setFeedback("年代不符：先比较它与相邻工具的制作顺序。",true)}
function resetAll(){placed.clear();document.querySelectorAll(".artifact").forEach(function(card){card.disabled=false;card.classList.remove("placed","shake");card.style.transform=""});document.querySelectorAll(".dropzone,.event-mark").forEach(function(el){el.classList.remove("is-set")});document.querySelectorAll(".cursor").forEach(function(el){el.classList.remove("show")});document.querySelectorAll(".sync-note").forEach(function(el){el.classList.remove("show")});claim.classList.remove("show");reset.hidden=true;count.textContent="0";setFeedback("先比较器物的制作顺序，再把它们放进同一条年代尺。",false)}reset.addEventListener("click",resetAll);
document.querySelectorAll(".artifact").forEach(function(card){var startX=0,startY=0,dx=0,dy=0,dragging=false;card.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&!card.disabled){e.preventDefault();place(card,Number(card.dataset.slot))}});card.addEventListener("pointerdown",function(e){if(card.disabled)return;dragging=true;startX=e.clientX;startY=e.clientY;dx=0;dy=0;card.setPointerCapture(e.pointerId);card.classList.add("dragging")});card.addEventListener("pointermove",function(e){if(!dragging)return;dx=(e.clientX-startX)/Deck.s;dy=(e.clientY-startY)/Deck.s;card.style.transform="translate("+dx+"px,"+dy+"px)"});card.addEventListener("pointerup",function(e){if(!dragging)return;dragging=false;card.releasePointerCapture(e.pointerId);card.classList.remove("dragging");card.style.transform="";var target=document.elementsFromPoint(e.clientX,e.clientY).map(function(el){return el.closest&&el.closest(".dropzone")}).find(Boolean);if(target&&Number(target.dataset.slot)===Number(card.dataset.slot))place(card,Number(card.dataset.slot));else reject(card)});card.addEventListener("pointercancel",function(){dragging=false;card.classList.remove("dragging");card.style.transform=""})})
})();
