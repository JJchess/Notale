<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="18" data-total="44">
<div id="stage">
<main id="main">
<style>
  .transfer-ledger {
    --support-cols: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    gap: 18px;
  }

  .transfer-ledger::before {
    position: absolute;
    inset: 0;
    pointer-events: none;
    content: "";
    background-image:
      linear-gradient(rgba(85, 194, 176, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(85, 194, 176, 0.035) 1px, transparent 1px);
    background-size: 100% 40px, 40px 100%;
    mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
  }

  .transfer-ledger > .supports {
    order: 1;
    flex: 1 1 0;
    align-items: stretch;
    display: flex;
    flex-direction: column;
    gap: 0;
    padding: 0 74px 0 92px;
    min-height: 0;
    background: var(--surface-raised);
    border-top: 1px solid var(--line-strong);
    border-bottom: 1px solid var(--line-strong);
  }

  .transfer-ledger > .supports::before {
    display: none;
  }

  .transfer-ledger > .supports > .trunk {
    top: auto;
    right: 42px;
    bottom: -22px;
    left: 42px;
    width: auto;
    height: 2px;
    background: var(--primary-line);
    transform: none;
  }

  .ledger-head,
  .transfer-ledger .support {
    display: grid;
    grid-template-columns: 42px minmax(0, 1fr) 36px minmax(0, 1.05fr) 36px minmax(0, 1fr);
    align-items: center;
    min-width: 0;
  }

  .ledger-head {
    min-height: 42px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--line-strong);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 700;
    line-height: 1.35;
  }

  .ledger-head .head-body { grid-column: 2; }
  .ledger-head .head-tool { grid-column: 4; color: var(--accent); }
  .ledger-head .head-depend { grid-column: 6; }

  .transfer-ledger .support {
    flex: 1 1 0;
    width: 100%;
    padding: 0;
    color: var(--text-secondary);
    background: rgba(38, 48, 51, 0.42);
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
    opacity: 0;
    animation: row-in 360ms ease-out forwards;
  }

  .transfer-ledger .support:nth-of-type(even) {
    background: rgba(48, 58, 61, 0.5);
  }

  .transfer-ledger .support:nth-of-type(2) { animation-delay: 240ms; }
  .transfer-ledger .support:nth-of-type(3) { animation-delay: 390ms; }
  .transfer-ledger .support:nth-of-type(4) { animation-delay: 540ms; }
  .transfer-ledger .support:nth-of-type(5) { animation-delay: 690ms; }

  .transfer-ledger .support::before {
    top: 50%;
    right: 0;
    bottom: auto;
    left: 0;
    width: 100%;
    height: 1px;
    background: var(--primary-line);
    transform: scaleX(0);
    transform-origin: left center;
    animation: line-grow 520ms ease-out forwards;
  }

  .transfer-ledger .support:nth-of-type(2)::before { animation-delay: 260ms; }
  .transfer-ledger .support:nth-of-type(3)::before { animation-delay: 410ms; }
  .transfer-ledger .support:nth-of-type(4)::before { animation-delay: 560ms; }
  .transfer-ledger .support:nth-of-type(5)::before { animation-delay: 710ms; }

  .row-code {
    position: relative;
    z-index: 2;
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 700;
  }

  .entry {
    position: relative;
    z-index: 2;
    align-self: stretch;
    display: flex;
    align-items: center;
    padding: 9px 14px;
    background: var(--surface-soft);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }

  .entry:first-of-type {
    border-left: 2px solid var(--primary-line);
  }

  .entry.tool {
    color: var(--text);
    background: rgba(242, 184, 75, 0.14);
    border-top-color: var(--accent-line);
    border-bottom-color: var(--accent-line);
    border-left: 3px solid var(--accent);
    font-weight: 650;
  }

  .entry:last-child {
    border-right: 2px solid var(--primary-line);
  }

  .connector {
    position: relative;
    z-index: 2;
    width: 26px;
    height: 26px;
    justify-self: center;
    background: var(--surface-strong);
    border: 2px solid var(--primary-line);
    transform: rotate(45deg);
  }

  .connector.tool-joint {
    border-color: var(--accent-line);
    box-shadow: inset 0 0 0 4px var(--accent-soft);
  }

  .transfer-ledger > .claim {
    order: 2;
    align-self: center;
    box-sizing: border-box;
    width: calc(100% - 80px);
    max-width: none;
    min-height: 112px;
    margin: 0 40px;
    padding: 15px 24px;
    color: var(--text);
    background: #242b2c;
    border-top: 2px solid var(--accent-line);
    border-right: 2px solid var(--accent-line);
    border-bottom: 2px solid var(--accent-line);
    border-left: 8px solid var(--accent);
    opacity: 0;
    animation: claim-in 420ms ease-out 1.2s forwards;
  }

  .claim-main {
    display: block;
    color: var(--accent);
    font-size: var(--fs-lead);
    font-weight: 750;
    line-height: var(--lh-body);
  }

  .claim-depend {
    display: block;
    margin-top: 3px;
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    font-weight: 500;
    line-height: var(--lh-sec);
  }

  .hand-mark {
    position: absolute;
    z-index: 3;
    bottom: 74px;
    left: 0;
    width: 126px;
    height: 180px;
    color: var(--primary);
    opacity: 0;
    animation: outline-in 440ms ease-out forwards;
  }

  .people-mark {
    position: absolute;
    z-index: 3;
    right: 0;
    bottom: 88px;
    width: 110px;
    height: 148px;
    color: var(--primary);
    opacity: 0;
    animation: outline-in 440ms ease-out 940ms forwards;
  }

  .hand-mark path,
  .hand-mark polygon,
  .people-mark path,
  .people-mark circle {
    vector-effect: non-scaling-stroke;
  }

  .interface-label {
    position: absolute;
    z-index: 4;
    bottom: 46px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .interface-label.body { left: 12px; }
  .interface-label.group { right: 4px; text-align: right; }

  @keyframes outline-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 0.82; transform: translateY(0); }
  }

  @keyframes row-in {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes line-grow {
    to { transform: scaleX(1); }
  }

  @keyframes claim-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .hand-mark,
    .people-mark,
    .transfer-ledger .support,
    .transfer-ledger .support::before,
    .transfer-ledger > .claim {
      animation: none;
      opacity: 1;
      transform: none;
    }
  }
</style>

<section class="k-generalization transfer-ledger min0" aria-labelledby="ledger-claim">

    <path d="M14 166 C24 145 28 125 29 99 L30 42 C30 34 41 34 42 42 L44 82 L48 20 C49 11 60 11 61 20 L61 79 L67 13 C68 5 79 6 80 14 L78 80 L85 27 C87 19 97 21 97 29 L92 92 L104 68 C108 60 118 65 115 74 L102 111 C96 128 84 140 72 149 L68 170" fill="none" stroke="currentColor" stroke-width="2"/>

  <span class="interface-label body">身体 / HAND</span>

  <div class="supports min0">

      <span class="head-tool">工具承接的部分</span>
      <span class="head-depend">工具仍然需要</span>
    </div>

    <article class="support">
      <span class="row-code">力</span>
      <span class="entry">手掌难以集中巨大作用力</span>
      <span class="connector" aria-hidden="true"></span>

      <span class="entry">手臂施力与视觉校准</span>
    </article>

    <article class="support">
      <span class="row-code">准</span>
      <span class="entry">手指难以稳定复制锋利形状</span>
      <span class="connector" aria-hidden="true"></span>
      <span class="entry tool">工具固定可重复的切割界面</span>
      <span class="connector tool-joint" aria-hidden="true"></span>
      <span class="entry">手腕、拇指与练习配合</span>

    <article class="support">
      <span class="row-code">能</span>
      <span class="entry">牙齿和消化承担加工成本</span>
      <span class="connector" aria-hidden="true"></span>
      <span class="entry tool">切割、敲碎与加热改变食物</span>
      <span class="connector tool-joint" aria-hidden="true"></span>
      <span class="entry">获取材料、操作与维护</span>
    </article>

    <article class="support">
      <span class="row-code">续</span>
      <span class="entry">单个身体会疲劳、受伤并死亡</span>
      <span class="connector" aria-hidden="true"></span>
      <span class="entry tool">工具保留可再次调用的动作形式</span>
      <span class="connector tool-joint" aria-hidden="true"></span>
      <span class="entry">其他人制作、使用并接续</span>
    </article>
  </div>

  <div class="claim" id="ledger-claim">
    <span class="claim-main">限制被转移，而不是被消灭。</span>
    <span class="claim-depend">工具离不开手、眼和能量，也离不开继续制作和使用它的人群。</span>
  </div>

  <svg class="people-mark" viewBox="0 0 110 148" aria-hidden="true">
    <circle cx="55" cy="25" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M34 94 C36 63 42 47 55 47 C68 47 74 63 76 94 M55 48 L55 112 M55 68 L28 87 M55 68 L85 83 M55 112 L38 140 M55 112 L72 140" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="22" cy="48" r="9" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".58"/>
    <path d="M7 101 C9 73 12 61 22 61 C30 61 34 70 37 83 M22 62 L22 117 M22 79 L7 92 M22 117 L12 140" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".58"/>
    <circle cx="90" cy="49" r="9" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".58"/>
    <path d="M74 83 C78 69 81 62 90 62 C100 62 103 74 104 101 M90 63 L90 117 M90 79 L104 92 M90 117 L100 140" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".58"/>
  </svg>
  <span class="interface-label group">人群 / CONTINUITY</span>
</section>
</main>

    take: "人类把一部分身体限制交给了工具，但限制并没有消失，只是转移到新的接口上。"
  });
</script>
