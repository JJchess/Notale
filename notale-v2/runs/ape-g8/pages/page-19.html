<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root {
    --bg: #111417;
    --text: #edf2f0;
    --font-sans: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }

  #main {
    background:
      linear-gradient(rgba(97, 113, 111, 0.10) 1px, transparent 1px) 0 47px / 100% 86px,
      var(--surface);
  }

  .p19-shell {
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
    width: 100%;
    height: 100%;
    min-height: 0;
  }

  .p19-guide {
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-sizing: border-box;
    min-height: 48px;
    padding: 0 var(--sp-3) 0 var(--sp-4);
    gap: var(--sp-5);
    color: var(--text-secondary);
    background: #141a1c;
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
  }

  .p19-guide strong {
    color: var(--accent);
    font-weight: 700;
  }

  .p19-reset {
    flex: 0 0 44px;
    width: 44px;
    padding: 0;
    font-size: 24px;
    line-height: 1.35;
  }

  .p19-reset:focus-visible,
  .workbench:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }

  .segment-meter {
    display: flex;
    flex: 0 0 420px;
    align-self: stretch;
    gap: var(--sp-2);
    min-height: 40px;
  }

  .segment-meter span {
    display: flex;
    flex: 1 1 0;
    align-items: center;
    justify-content: center;
    min-width: 0;
    color: var(--text-muted);
    background: #141a1c;
    border-top: 3px solid var(--line-strong);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 700;
    line-height: 1.35;
  }

  .segment-meter span.is-current {
    color: var(--accent);
    background: var(--accent-soft);
    border-top-color: var(--accent);
  }

  .segment-meter span.is-done {
    color: var(--primary);
    background: var(--primary-soft);
    border-top-color: var(--primary);
  }

  .p19-enum {
    position: relative;
    flex: 1 1 0;
    gap: var(--sp-3);
    min-height: 0;
  }

  .p19-enum > .it {
    grid-template-rows: 36px auto minmax(0, 1fr) 26px;
    align-content: stretch;
    gap: var(--sp-2) var(--sp-3);
    overflow: visible;
    padding: var(--sp-4);
  }

  .p19-enum > .it > .it-title {
    font-size: var(--fs-h2);
  }

  .p19-enum > .it > .it-body {
    min-height: 46px;
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
  }

  .workbench {
    position: relative;
    grid-column: 1 / -1;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background:
      linear-gradient(rgba(97, 113, 111, 0.20) 1px, transparent 1px) 0 0 / 100% 48px,
      linear-gradient(90deg, rgba(97, 113, 111, 0.16) 1px, transparent 1px) 0 0 / 64px 100%,
      #141a1c;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    touch-action: none;
  }

  .konva-host {
    position: absolute;
    inset: 0;
  }

  .workbench::before,
  .workbench::after {
    position: absolute;
    z-index: 2;
    top: 10px;
    bottom: 10px;
    width: 1px;
    pointer-events: none;
    content: "";
    background: repeating-linear-gradient(to bottom, var(--line-strong) 0 4px, transparent 4px 10px);
    opacity: 0.55;
  }

  .workbench::before { left: 10px; }
  .workbench::after { right: 10px; }

  .scene-label {
    position: absolute;
    z-index: 4;
    top: 10px;
    left: 14px;
    padding: 2px 7px;
    color: var(--text-secondary);
    background: rgba(17, 20, 23, 0.88);
    border-left: 2px solid var(--primary);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    line-height: 1.35;
    pointer-events: none;
  }

  .scene-label.is-action { border-left-color: var(--accent); }

  .scene-cues {
    position: absolute;
    z-index: 4;
    right: 14px;
    bottom: 10px;
    left: 14px;
    display: flex;
    justify-content: space-between;
    gap: var(--sp-2);
    pointer-events: none;
  }

  .scene-cues span {
    padding: 2px 6px;
    color: var(--text-secondary);
    background: rgba(17, 20, 23, 0.88);
    border-top: 2px solid var(--line-strong);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .scene-cues span:nth-child(2) { border-top-color: var(--accent); }
  .scene-cues span:nth-child(3) { border-top-color: var(--primary); }

  .scene-status {
    grid-column: 1 / -1;
    overflow: hidden;
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    line-height: 1.45;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .scene-status[data-tone="active"] { color: var(--accent); }
  .scene-status[data-tone="done"] { color: var(--primary); }
  .scene-status[data-tone="error"] { color: var(--danger); }

  .completion-loop {
    position: absolute;
    z-index: 8;
    inset: -7px;
    pointer-events: none;
    border: 2px solid var(--primary);
    border-radius: var(--radius-md);
    opacity: 0;
    transform: scaleX(0.985);
  }

  .completion-loop::before,
  .completion-loop::after {
    position: absolute;
    top: 50%;
    width: 18px;
    height: 2px;
    content: "";
    background: var(--primary);
  }

  .completion-loop::before { left: calc(33.333% - 9px); }
  .completion-loop::after { right: calc(33.333% - 9px); }

  .p19-claim {
    min-height: 48px;
    box-sizing: border-box;
    padding: var(--sp-3) var(--sp-5);
    color: var(--text-secondary);
    background: #141a1c;
    border-left: 5px solid var(--line-strong);
    font-size: var(--fs-lead);
    font-weight: 650;
    line-height: var(--lh-body);
    opacity: 0.62;
  }

  .p19-claim.is-visible {
    color: var(--text);
    border-left-color: var(--primary);
    opacity: 1;
  }

  @media (prefers-reduced-motion: reduce) {
    .completion-loop,
    .p19-claim { transition: none; }
  }
</style>
</head>
<body data-page="19" data-total="44">
<div id="stage">
<main id="main">
  <section class="p19-shell" aria-label="模仿动作工作台">
    <div class="p19-guide">
      <p>先辨认左侧的起点、方向与落点，再把中间<strong>当前石片</strong>拖到对应位置。</p>
      <div class="segment-meter" id="segmentMeter" aria-label="三段动作进度">
        <span class="is-current">动作段 1</span>
        <span>动作段 2</span>
        <span>动作段 3</span>
      </div>
      <button class="p19-reset" id="resetBtn" type="button" title="重置并重播示范" aria-label="重置并重播示范">↺</button>
    </div>

    <div class="k-enumeration p19-enum" style="--enum-cols:3">
      <article class="it min0">
        <h2 class="it-title">动作可观察</h2>
        <p class="it-body">起点、移动方向、停顿和落点，都留在示范轨迹上。</p>
        <div class="workbench" aria-hidden="true">
          <div class="konva-host" id="demoScene"></div>
          <span class="scene-label">示范轨迹</span>
          <div class="scene-cues"><span>起点</span><span>移动方向</span><span>落点</span></div>
        </div>
        <p class="scene-status" id="demoStatus">观看三块石片依次移动</p>
      </article>

      <article class="it min0 is-key" id="practiceItem">
        <h2 class="it-title">步骤可重复</h2>
        <p class="it-body">按同一先后关系复现每一段，稳定结果才会出现。</p>
        <div class="workbench no-pan" id="practiceWorkbench" tabindex="0" role="application" aria-label="拖动当前石片；也可用方向键移动，按回车确认落点">
          <div class="konva-host" id="practiceScene"></div>
          <span class="scene-label is-action">你的尝试</span>
          <div class="scene-cues"><span>起点</span><span>移动方向</span><span>落点</span></div>
        </div>
        <p class="scene-status" id="practiceStatus" data-tone="active">第 1 段：拖动琥珀石片</p>
      </article>

      <article class="it min0">
        <h2 class="it-title">结果可纠正</h2>
        <p class="it-body">反馈指出具体偏差，只需重做出错的这一段。</p>
        <div class="workbench" aria-hidden="true">
          <div class="konva-host" id="compareScene"></div>
          <span class="scene-label">轨迹校准</span>
          <div class="scene-cues"><span>起点一致</span><span>方向对齐</span><span>落点重合</span></div>
        </div>
        <p class="scene-status" id="compareStatus">灰色轮廓是示范落点</p>
      </article>
      <div class="completion-loop" id="completionLoop" aria-hidden="true"></div>
    </div>

    <p class="p19-claim" id="claim">一项技能能否传下去，取决于动作是否可观察、可重复，并能在偏差出现时被纠正。纠正只重做出错段，已完成步骤保留。</p>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/konva.min.js"></script>
<script src="assets/lib/anime.min.js"></script>
<script>
Lec.mount({
  index: 19,
  kicker: "CULTURAL TRANSMISSION",
  title: "看得见，做得出，改得回",
  take: "一项技能能否传下去，取决于动作是否可观察、可重复和可纠正。"
});

(function () {
  var palette = {
    text: Deck.token("--text"),
    muted: Deck.token("--text-muted"),
    line: Deck.token("--line-strong"),
    primary: Deck.token("--primary"),
    accent: Deck.token("--accent"),
    danger: Deck.token("--danger")
  };
  var specs = [
    { points: [-22,-12, 2,-18, 24,-4, 16,17, -10,20, -26,5], rot: -8 },
    { points: [-25,-8, -5,-22, 20,-15, 27,7, 5,20, -20,14], rot: 7 },
    { points: [-18,-20, 13,-18, 26,1, 8,23, -22,13, -27,-5], rot: -4 }
  ];
  var startRatios = [[0.16,0.76], [0.49,0.77], [0.82,0.76]];
  var targetRatios = [[0.76,0.25], [0.22,0.28], [0.56,0.40]];
  var scenes = {};
  var state = { current: 0, complete: [false, false, false], demo: null };
  var practiceStatus = document.getElementById("practiceStatus");
  var compareStatus = document.getElementById("compareStatus");
  var demoStatus = document.getElementById("demoStatus");
  var claim = document.getElementById("claim");
  var loop = document.getElementById("completionLoop");
  var meterSteps = Array.prototype.slice.call(document.querySelectorAll("#segmentMeter span"));

  function point(ratio, w, h) {
    return { x: ratio[0] * w, y: ratio[1] * h };
  }

  function stone(spec, x, y, options) {
    return new Konva.Line({
      x: x,
      y: y,
      points: spec.points.map(function (v) { return v * 1.48; }),
      closed: true,
      rotation: spec.rot,
      fill: options.fill || "transparent",
      stroke: options.stroke,
      strokeWidth: options.strokeWidth || 2,
      opacity: options.opacity == null ? 1 : options.opacity,
      lineJoin: "round",
      draggable: !!options.draggable,
      shadowColor: options.shadowColor || "transparent",
      shadowBlur: options.shadowBlur || 0
    });
  }

  function baseScene(id, mode) {
    var el = document.getElementById(id);
    var w = el.clientWidth;
    var h = el.clientHeight;
    var stage = new Konva.Stage({ container: id, width: w, height: h });
    var layer = new Konva.Layer();
    stage.add(layer);
    var starts = startRatios.map(function (r) { return point(r, w, h); });
    var targets = targetRatios.map(function (r) { return point(r, w, h); });
    var paths = [];
    var targetNodes = [];
    var stones = [];

    starts.forEach(function (p, i) {
      var t = targets[i];
      var path = new Konva.Line({
        points: [p.x, p.y, t.x, t.y],
        stroke: palette.line,
        strokeWidth: 8,
        dash: [14, 8],
        lineCap: "round",
        opacity: 0.58
      });
      layer.add(path);
      paths.push(path);
      var target = stone(specs[i], t.x, t.y, {
        stroke: palette.line,
        strokeWidth: 2,
        opacity: 0.72
      });
      layer.add(target);
      targetNodes.push(target);
    });

    starts.forEach(function (p, i) {
      var node = stone(specs[i], p.x, p.y, {
        fill: mode === "compare" ? "transparent" : "#303a3d",
        stroke: mode === "compare" ? palette.accent : palette.text,
        strokeWidth: 2,
        opacity: mode === "compare" ? 0 : 1,
        draggable: mode === "practice"
      });
      layer.add(node);
      stones.push(node);
    });
    layer.draw();
    return { el: el, stage: stage, layer: layer, w: w, h: h, starts: starts, targets: targets, paths: paths, targetsNodes: targetNodes, stones: stones };
  }

  scenes.demo = baseScene("demoScene", "demo");
  scenes.practice = baseScene("practiceScene", "practice");
  scenes.compare = baseScene("compareScene", "compare");

  var hand = new Konva.Group({ opacity: 0 });
  hand.add(new Konva.Circle({ radius: 13, stroke: palette.accent, strokeWidth: 2 }));
  hand.add(new Konva.Line({ points: [10,8, 27,22, 35,20], stroke: palette.accent, strokeWidth: 3, lineCap: "round", lineJoin: "round" }));
  scenes.demo.layer.add(hand);

  function syncPracticeStyles() {
    meterSteps.forEach(function (step, i) {
      step.classList.toggle("is-done", state.complete[i]);
      step.classList.toggle("is-current", i === state.current && !state.complete[i]);
    });
    scenes.practice.stones.forEach(function (node, i) {
      var active = i === state.current && !state.complete[i];
      node.draggable(active);
      node.fill(state.complete[i] ? "rgba(85,194,176,0.24)" : active ? "rgba(242,184,75,0.20)" : "#303a3d");
      node.stroke(state.complete[i] ? palette.primary : active ? palette.accent : palette.text);
      node.shadowColor(active ? palette.accent : "transparent");
      node.shadowBlur(active ? 12 : 0);
      scenes.practice.paths[i].stroke(state.complete[i] ? palette.primary : active ? palette.accent : palette.line);
      scenes.practice.targetsNodes[i].stroke(active ? palette.accent : state.complete[i] ? palette.primary : palette.line);
    });
    scenes.practice.layer.draw();
  }

  function setCompare(i, x, y, tone) {
    var node = scenes.compare.stones[i];
    node.position({ x: x, y: y });
    node.opacity(0.9);
    node.stroke(tone === "done" ? palette.primary : tone === "error" ? palette.danger : palette.accent);
    scenes.compare.paths[i].stroke(tone === "done" ? palette.primary : tone === "error" ? palette.danger : palette.accent);
    scenes.compare.paths[i].points([scenes.compare.starts[i].x, scenes.compare.starts[i].y, x, y]);
    scenes.compare.layer.batchDraw();
  }

  function announceCurrent() {
    if (state.current >= specs.length) {
      practiceStatus.textContent = "三段均已复现";
      practiceStatus.dataset.tone = "done";
      compareStatus.textContent = "三处偏差标记已闭合";
      compareStatus.dataset.tone = "done";
      claim.classList.add("is-visible");
      anime.remove([claim, loop]);
      anime({ targets: loop, opacity: [0, 1], scaleX: [0.985, 1], duration: 650, easing: "easeOutCubic" });
      anime({ targets: claim, opacity: [0.62, 1], translateY: [6, 0], duration: 500, easing: "easeOutCubic" });
      return;
    }
    practiceStatus.textContent = "第 " + (state.current + 1) + " 段：拖动琥珀石片";
    practiceStatus.dataset.tone = "active";
    compareStatus.textContent = "校准第 " + (state.current + 1) + " 段的方向与落点";
    compareStatus.dataset.tone = "active";
  }

  function accept(i) {
    var node = scenes.practice.stones[i];
    var target = scenes.practice.targets[i];
    var proxy = { x: node.x(), y: node.y(), s: 1 };
    node.draggable(false);
    anime({
      targets: proxy,
      x: target.x,
      y: target.y,
      s: [1.08, 1],
      duration: 360,
      easing: "easeOutBack",
      update: function () {
        node.position({ x: proxy.x, y: proxy.y });
        node.scale({ x: proxy.s, y: proxy.s });
        setCompare(i, proxy.x, proxy.y, "done");
        scenes.practice.layer.batchDraw();
      },
      complete: function () {
        state.complete[i] = true;
        state.current += 1;
        syncPracticeStyles();
        announceCurrent();
      }
    });
  }

  function reject(i) {
    var node = scenes.practice.stones[i];
    var origin = scenes.practice.starts[i];
    var proxy = { x: node.x(), y: node.y() };
    node.draggable(false);
    practiceStatus.textContent = "这一段的方向或落点与示范不同";
    practiceStatus.dataset.tone = "error";
    compareStatus.textContent = "偏差未闭合：只重做当前段";
    compareStatus.dataset.tone = "error";
    setCompare(i, node.x(), node.y(), "error");
    anime({
      targets: proxy,
      keyframes: [
        { x: proxy.x - 9, duration: 65 },
        { x: proxy.x + 9, duration: 65 },
        { x: proxy.x - 6, duration: 65 },
        { x: origin.x, y: origin.y, duration: 250 }
      ],
      easing: "easeInOutQuad",
      update: function () {
        node.position({ x: proxy.x, y: proxy.y });
        scenes.practice.layer.batchDraw();
      },
      complete: function () {
        node.draggable(true);
        setCompare(i, scenes.compare.starts[i].x, scenes.compare.starts[i].y, "active");
        scenes.compare.stones[i].opacity(0);
        scenes.compare.layer.draw();
        announceCurrent();
      }
    });
  }

  function evaluateCurrent() {
    var i = state.current;
    if (i >= specs.length) return;
    var node = scenes.practice.stones[i];
    var target = scenes.practice.targets[i];
    var distance = Math.hypot(node.x() - target.x, node.y() - target.y);
    if (distance <= 42) accept(i); else reject(i);
  }

  scenes.practice.stones.forEach(function (node, i) {
    node.on("dragmove", function () {
      if (i !== state.current) return;
      var x = Deck.clamp(node.x(), 34, scenes.practice.w - 34);
      var y = Deck.clamp(node.y(), 46, scenes.practice.h - 30);
      node.position({ x: x, y: y });
      setCompare(i, x, y, "active");
      compareStatus.textContent = "实线是当前尝试，灰色轮廓是示范";
      compareStatus.dataset.tone = "active";
    });
    node.on("dragend", function () {
      if (i === state.current) evaluateCurrent();
    });
  });

  document.getElementById("practiceWorkbench").addEventListener("keydown", function (event) {
    if (state.current >= specs.length) return;
    var node = scenes.practice.stones[state.current];
    var step = event.shiftKey ? 24 : 12;
    var dx = 0;
    var dy = 0;
    if (event.key === "ArrowLeft") dx = -step;
    else if (event.key === "ArrowRight") dx = step;
    else if (event.key === "ArrowUp") dy = -step;
    else if (event.key === "ArrowDown") dy = step;
    else if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      evaluateCurrent();
      return;
    } else return;
    event.preventDefault();
    node.position({
      x: Deck.clamp(node.x() + dx, 34, scenes.practice.w - 34),
      y: Deck.clamp(node.y() + dy, 46, scenes.practice.h - 30)
    });
    setCompare(state.current, node.x(), node.y(), "active");
    scenes.practice.layer.draw();
  });

  function playDemo() {
    if (state.demo) state.demo.pause();
    anime.remove(scenes.demo.stones);
    scenes.demo.stones.forEach(function (node, i) {
      node.position(scenes.demo.starts[i]);
      scenes.demo.paths[i].stroke(palette.line);
    });
    hand.opacity(0);
    scenes.demo.layer.draw();
    if (Deck.reduced()) {
      scenes.demo.stones.forEach(function (node, i) {
        node.position(scenes.demo.targets[i]);
        scenes.demo.paths[i].stroke(palette.primary);
      });
      demoStatus.textContent = "三段示范轨迹已完整显示";
      demoStatus.dataset.tone = "done";
      scenes.demo.layer.draw();
      return;
    }
    var proxies = scenes.demo.stones.map(function (node) { return { x: node.x(), y: node.y() }; });
    var tl = anime.timeline({ loop: true, easing: "easeInOutCubic", loopComplete: function () {
      scenes.demo.stones.forEach(function (node, i) {
        node.position(scenes.demo.starts[i]);
        proxies[i].x = scenes.demo.starts[i].x;
        proxies[i].y = scenes.demo.starts[i].y;
        scenes.demo.paths[i].stroke(palette.line);
      });
      scenes.demo.layer.draw();
    }});
    proxies.forEach(function (proxy, i) {
      tl.add({
        targets: proxy,
        x: scenes.demo.targets[i].x,
        y: scenes.demo.targets[i].y,
        duration: 820,
        delay: i === 0 ? 220 : 100,
        begin: function () {
          demoStatus.textContent = "示范第 " + (i + 1) + " 段：辨认方向与落点";
          demoStatus.dataset.tone = "active";
          scenes.demo.paths[i].stroke(palette.accent);
          hand.opacity(1);
        },
        update: function () {
          scenes.demo.stones[i].position({ x: proxy.x, y: proxy.y });
          hand.position({ x: proxy.x, y: proxy.y });
          scenes.demo.layer.batchDraw();
        },
        complete: function () {
          scenes.demo.paths[i].stroke(palette.primary);
          hand.opacity(0);
          scenes.demo.layer.draw();
        }
      });
    });
    tl.add({ duration: 900 });
    state.demo = tl;
  }

  function resetAll() {
    anime.remove("*");
    state.current = 0;
    state.complete = [false, false, false];
    scenes.practice.stones.forEach(function (node, i) {
      node.position(scenes.practice.starts[i]);
      node.scale({ x: 1, y: 1 });
    });
    scenes.compare.stones.forEach(function (node, i) {
      node.position(scenes.compare.starts[i]);
      node.opacity(0);
      scenes.compare.paths[i].points([
        scenes.compare.starts[i].x, scenes.compare.starts[i].y,
        scenes.compare.targets[i].x, scenes.compare.targets[i].y
      ]);
      scenes.compare.paths[i].stroke(palette.line);
    });
    claim.classList.remove("is-visible");
    claim.style.opacity = "";
    claim.style.transform = "";
    loop.style.opacity = "0";
    loop.style.transform = "scaleX(.985)";
    syncPracticeStyles();
    scenes.compare.layer.draw();
    announceCurrent();
    playDemo();
  }

  document.getElementById("resetBtn").addEventListener("click", resetAll);
  syncPracticeStyles();
  announceCurrent();
  playDemo();
})();
</script>
</body>
</html>
