<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #111417;
  --text: #edf2f0;
  --font-sans: Inter, "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
}
#main {
  background:
    linear-gradient(rgba(85, 194, 176, 0.035) 1px, transparent 1px) 0 20px / 100% 52px,
    var(--surface);
}
.workbench {
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.game-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 46px;
  gap: 24px;
}
.generation {
  color: var(--text);
  font-size: var(--fs-lead);
  font-weight: 700;
  line-height: 1.35;
}
.generation .data { color: var(--accent); }
.marks {
  display: flex;
  align-items: center;
  flex: 1;
  max-width: 720px;
}
.mark {
  display: flex;
  align-items: center;
  flex: 1;
  color: var(--text-muted);
  font-size: var(--fs-label);
  line-height: 1.35;
}
.mark::before {
  width: 14px;
  height: 14px;
  margin-right: 7px;
  content: "";
  border: 2px solid var(--line-strong);
  border-radius: 50%;
  background: var(--surface);
}
.mark:not(:last-child)::after {
  flex: 1;
  height: 1px;
  margin: 0 8px;
  content: "";
  background: var(--line);
}
.mark.is-done { color: var(--primary); }
.mark.is-done::before { border-color: var(--primary); background: var(--primary); }
.mark.is-current { color: var(--accent); font-weight: 700; }
.mark.is-current::before { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.legend { flex: 0 0 auto; }
.process-shell {
  position: relative;
  min-height: 244px;
  padding: 0 12px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
#chain.k-process {
  --process-gap: 34px;
  height: 242px;
  box-sizing: border-box;
  padding: 18px 0;
}
#chain.k-process > .axis { background: var(--line); }
#chain.k-process > .step {
  display: flex;
  background: var(--surface-strong);
  flex-direction: column;
  justify-content: center;
  min-height: 206px;
  padding: 18px;
  overflow: hidden;
  font-size: var(--fs-sec);
  font-weight: 700;
  line-height: var(--lh-sec);
  text-align: center;
}
#chain.k-process > .step.is-future {
  background: transparent;
  border: 1px dashed var(--line-strong);
  border-top: 3px solid var(--line-strong);
}
#chain.k-process > .step.is-current {
  transform: translateY(-5px);
  box-shadow: 0 7px 0 rgba(0, 0, 0, 0.22);
}
.gen-label {
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: var(--fs-label);
  font-weight: 700;
  line-height: 1.35;
}
.step-name {
  color: var(--text);
  font-size: var(--fs-sec);
  font-weight: 700;
  line-height: 1.4;
}
.step-state {
  color: var(--text-secondary);
  font-size: var(--fs-label);
  line-height: 1.35;
}
.step-state.good { color: var(--primary); }
.step-state.new { color: var(--accent); }
.future-no {
  align-self: center;
  color: var(--line-strong);
  font-family: var(--font-mono);
  font-size: 28px;
  line-height: 1.35;
}
.play-zone {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  gap: 12px;
}
.prompt-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 28px;
  gap: 24px;
}
.prompt {
  color: var(--text);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
}
.feedback {
  min-width: 390px;
  color: var(--text-secondary);
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
  text-align: right;
}
.feedback.is-error { color: var(--danger); }
.feedback.is-good { color: var(--primary); }
.choices {
  display: flex;
  align-items: stretch;
  justify-content: center;
  gap: 22px;
  min-height: 254px;
}
.craft-choice {
  position: relative;
  display: flex;
  flex: 1 1 0;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  max-width: 414px;
  min-height: 254px;
  padding: 18px 20px;
  text-align: left;
  background: var(--surface-strong);
  border-color: var(--line-strong);
}
.craft-choice:hover { border-color: var(--primary-line); }
.craft-choice:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.choice-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.choice-name {
  color: var(--text);
  font-size: var(--fs-body);
  font-weight: 700;
  line-height: 1.35;
}
.choice-test {
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: var(--fs-label);
  line-height: 1.35;
}
.craft-body {
  display: flex;
  align-items: center;
  gap: 18px;
  flex: 1;
}
.vessel {
  position: relative;
  flex: 0 0 88px;
  height: 92px;
  border: 3px solid var(--text-secondary);
  border-top: 0;
  clip-path: polygon(7% 0, 93% 0, 82% 100%, 18% 100%);
}
.vessel::before {
  position: absolute;
  top: -4px;
  left: 12px;
  width: 58px;
  height: 42px;
  content: "";
  border: 3px solid var(--text-secondary);
  border-bottom: 0;
  border-radius: 42px 42px 0 0;
}
.craft-choice[data-kind="correct"] .vessel { border-color: var(--primary); }
.craft-choice[data-kind="improve"] .vessel { border-color: var(--accent); border-top: 7px solid var(--accent); }
.craft-choice[data-kind="omit"] .vessel { border-right-style: dashed; }
.step-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}
.step-line {
  color: var(--text-secondary);
  font-size: var(--fs-sec);
  line-height: 1.4;
}
.step-line::before { content: "✓ "; color: var(--primary); font-weight: 700; }
.step-line.omit { color: var(--danger); text-decoration: line-through; }
.step-line.omit::before { content: "− "; color: var(--danger); }
.step-line.add { color: var(--accent); }
.step-line.add::before { content: "+ "; color: var(--accent); }
.task-result {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 12px;
  padding-top: 10px;
  color: var(--text-secondary);
  border-top: 1px solid var(--line);
  font-size: var(--fs-label);
  line-height: 1.35;
}
.task-result strong { color: var(--primary); font-size: var(--fs-sec); }
.craft-choice[data-kind="omit"] .task-result strong { color: var(--danger); }
.craft-choice[data-kind="noise"] .task-result strong { color: var(--text-secondary); }
.craft-choice[data-kind="improve"] .task-result strong { color: var(--accent); }
.craft-choice.shake { animation: shake 240ms ease-in-out; border-color: var(--danger); }
.completion {
  display: none;
  flex: 1;
  min-height: 0;
  align-items: stretch;
  gap: 24px;
}
.workbench.is-complete .play-zone { display: none; }
.workbench.is-complete .completion { display: flex; }
.compare-end {
  display: flex;
  flex: 1;
  align-items: center;
  gap: 20px;
  min-width: 0;
  padding: 18px 24px;
  background: var(--surface-raised);
  border: 1px solid var(--line);
}
.end-version { flex: 1; min-width: 0; }
.end-version h2 { margin-bottom: 8px; }
.end-version p { color: var(--text-secondary); font-size: var(--fs-sec); line-height: var(--lh-sec); }
.end-version.final h2 { color: var(--accent); }
.end-arrow {
  color: var(--primary);
  font-family: var(--font-mono);
  font-size: 34px;
  line-height: 1.35;
}
.conclusion {
  display: flex;
  flex: 0 0 410px;
  flex-direction: column;
  justify-content: center;
  gap: 14px;
  padding: 20px 24px;
  border-left: 5px solid var(--accent);
  background: var(--accent-soft);
}
.conclusion p { font-size: var(--fs-lead); font-weight: 700; line-height: var(--lh-body); }
.reset-button { align-self: flex-start; }
.reset-icon { font-size: 22px; line-height: 1; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  30% { transform: translateX(-8px); }
  65% { transform: translateX(8px); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body data-page="20" data-total="44">
<div id="stage">
<main id="main">
  <section class="workbench" id="game" aria-labelledby="gamePrompt">
    <div class="game-head">
      <div class="generation">第 <span class="data" id="genNow">1</span> / 6 代</div>
      <div class="marks" id="marks" aria-label="六代传递进度"></div>
      <div class="legend" aria-label="步骤颜色说明">
        <span class="legend-item"><span class="swatch"></span>保留</span>
        <span class="legend-item"><span class="swatch is-key"></span>有效新增</span>
      </div>
    </div>

    <div class="process-shell">
      <div class="k-process" id="chain" aria-label="六代工艺传递链"></div>
    </div>

    <div class="play-zone">
      <div class="prompt-row">
        <p class="prompt" id="gamePrompt">选择要传给下一代的取水器工艺。</p>
        <p class="feedback" id="feedback" aria-live="polite">先保住能工作的步骤，再判断改动是否有效。</p>
      </div>
      <div class="choices" id="choices"></div>
    </div>

    <div class="completion" id="completion">
      <div class="compare-end">
        <div class="end-version">
          <h2>第一代 · 能取水</h2>
          <p>裁开筒身 → 扎紧接缝 → 固定提绳</p>
        </div>
        <div class="end-arrow" aria-hidden="true">→</div>
        <div class="end-version final">
          <h2>第六代 · 更耐用</h2>
          <p>旧步骤全部保留，并加入通过测试的加固提口。</p>
        </div>
      </div>
      <div class="conclusion">
        <p>累积文化不是一次大发明，而是“保留下来，再多走一步”。</p>
        <button class="reset-button" id="reset" type="button" title="从第一代重新开始"><span class="reset-icon" aria-hidden="true">↻</span><span>重新传递</span></button>
      </div>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 20,
  kicker: "CULTURE · TRANSMISSION",
  title: "手艺怎样越传越多",
  take: "每一代都可能传错；只有有效做法被准确保存，改良才不会随人消失。"
});

(function () {
  var stages = [
    { name: "基础工艺", state: "可工作", tone: "good" },
    { name: "识别遗漏", state: "旧步骤保住", tone: "good" },
    { name: "完整复制", state: "保真保存", tone: "good" },
    { name: "尝试加固", state: "候选改良", tone: "new" },
    { name: "通过测试", state: "改良被保留", tone: "new" },
    { name: "继续传递", state: "能力已累积", tone: "new" }
  ];

  var rounds = [
    [
      { name: "漏扎接缝", kind: "omit", lines: [["裁开筒身", ""], ["扎紧接缝", "omit"], ["固定提绳", ""]], error: "这一版丢了已有关键步骤" },
      { name: "完整照做", kind: "correct", lines: [["裁开筒身", ""], ["扎紧接缝", ""], ["固定提绳", ""]], ok: true },
      { name: "涂亮外壁", kind: "noise", lines: [["原有三步", ""], ["涂亮外壁", "add"]], error: "新增步骤没有改善任务结果" }
    ],
    [
      { name: "缩短提绳", kind: "noise", lines: [["原有三步", ""], ["缩短提绳", "add"]], error: "新增步骤没有改善任务结果" },
      { name: "再次照做", kind: "correct", lines: [["裁开筒身", ""], ["扎紧接缝", ""], ["固定提绳", ""]], ok: true },
      { name: "漏固定提绳", kind: "omit", lines: [["裁开筒身", ""], ["扎紧接缝", ""], ["固定提绳", "omit"]], error: "这一版丢了已有关键步骤" }
    ],
    [
      { name: "加固提口", kind: "improve", lines: [["原有三步", ""], ["加固提口", "add"]], ok: true },
      { name: "漏扎接缝", kind: "omit", lines: [["扎紧接缝", "omit"], ["固定提绳", ""]], error: "这一版丢了已有关键步骤" },
      { name: "加重筒底", kind: "noise", lines: [["原有三步", ""], ["加重筒底", "add"]], error: "新增步骤没有改善任务结果" }
    ],
    [
      { name: "换回旧提口", kind: "omit", lines: [["原有三步", ""], ["加固提口", "omit"]], error: "这一版丢了已通过测试的步骤" },
      { name: "保留加固提口", kind: "improve", lines: [["原有三步", ""], ["加固提口", "add"]], ok: true },
      { name: "增加装饰结", kind: "noise", lines: [["原有三步", ""], ["装饰绳结", "add"]], error: "新增步骤没有改善任务结果" }
    ],
    [
      { name: "省去接缝", kind: "omit", lines: [["扎紧接缝", "omit"], ["加固提口", "add"]], error: "这一版丢了已有关键步骤" },
      { name: "完整继续传", kind: "improve", lines: [["原有三步", ""], ["加固提口", "add"]], ok: true },
      { name: "加长提绳", kind: "noise", lines: [["原有三步", ""], ["加长提绳", "add"]], error: "新增步骤没有改善任务结果" }
    ]
  ];

  function initialState() {
    return { generation: 1, trace: [0], complete: false, lastAction: null };
  }

  var state = initialState();
  var game = document.getElementById("game");
  var marks = document.getElementById("marks");
  var chain = document.getElementById("chain");
  var choices = document.getElementById("choices");
  var feedback = document.getElementById("feedback");
  var genNow = document.getElementById("genNow");

  function snapshot() {
    return JSON.parse(JSON.stringify(state));
  }

  function emit(name, detail) {
    game.dispatchEvent(new CustomEvent(name, { bubbles: true, composed: true, detail: detail }));
  }

  function stepMarkup(item) {
    return '第 ' + item.index + ' 代 · ' + item.name + ' · ' + item.state;
  }

  function renderProgress() {
    marks.innerHTML = stages.map(function (_, i) {
      var n = i + 1;
      var cls = n < state.generation ? "is-done" : (n === state.generation ? "is-current" : "");
      return '<span class="mark ' + cls + '">' + n + '</span>';
    }).join("");
  }

  function renderChain() {
    var html = '<div class="axis" aria-hidden="true"></div>';
    stages.forEach(function (stage, i) {
      var n = i + 1;
      var reached = n <= state.generation;
      var cls = reached ? (n === state.generation ? "is-current" : "is-done") : "is-future";
      html += '<div class="step ' + cls + '">';
      html += reached ? stepMarkup({ index: n, name: stage.name, state: stage.state, tone: stage.tone }) : ('第 ' + n + ' 代 · 等待传递');
      if (n < 6) html += '<span class="arw" aria-hidden="true"></span>';
      html += '</div>';
    });
    chain.innerHTML = html;
  }

  function renderChoices() {
    if (state.complete) return;
    var set = rounds[state.generation - 1];
    choices.innerHTML = set.map(function (choice, i) {
      var lines = choice.lines.map(function (line) {
        return '<span class="step-line ' + line[1] + '">' + line[0] + '</span>';
      }).join("");
      var result = choice.ok ? (choice.kind === "improve" ? "不漏水，更耐拉" : "能完成取水") : (choice.kind === "omit" ? "漏水或脱绳" : "表现没有改善");
      return '<button type="button" class="craft-choice" data-choice="' + i + '" data-kind="' + choice.kind + '" aria-label="选择' + choice.name + '">' +
        '<span class="choice-top"><span class="choice-name">' + choice.name + '</span><span class="choice-test">方案 ' + (i + 1) + '</span></span>' +
        '<span class="craft-body"><span class="vessel" aria-hidden="true"></span><span class="step-list">' + lines + '</span></span>' +
        '<span class="task-result"><span>取水测试</span><strong>' + result + '</strong></span></button>';
    }).join("");
  }

  function render() {
    genNow.textContent = state.generation;
    game.classList.toggle("is-complete", state.complete);
    renderProgress();
    renderChain();
    renderChoices();
  }

  function choose(index, button) {
    if (state.complete) return;
    var choice = rounds[state.generation - 1][index];
    state.lastAction = { generation: state.generation, choice: choice.name, valid: !!choice.ok };
    if (!choice.ok) {
      feedback.textContent = choice.error;
      feedback.className = "feedback is-error";
      if (!Deck.reduced()) {
        button.classList.remove("shake");
        void button.offsetWidth;
        button.classList.add("shake");
      }
      emit("game-progress", { state: snapshot(), action: state.lastAction, metrics: { completed: state.generation - 1, total: 5 } });
      return;
    }

    state.trace.push(index);
    state.generation += 1;
    state.complete = state.generation === 6;
    feedback.textContent = state.complete ? "六代工艺链已接通" : (state.generation >= 4 ? "旧步骤保住了，继续检验新增步骤" : "已有关键步骤被完整保留");
    feedback.className = "feedback is-good";
    render();
    emit("game-progress", { state: snapshot(), action: state.lastAction, metrics: { completed: state.generation - 1, total: 5 } });
    if (state.complete) {
      emit("game-complete", { score: 5, metrics: { generations: 6, retained: 3, improvements: 1 }, trace: state.trace.slice() });
      document.getElementById("reset").focus();
    } else {
      var first = choices.querySelector("button");
      if (first) first.focus();
    }
  }

  choices.addEventListener("click", function (event) {
    var button = event.target.closest("button[data-choice]");
    if (button) choose(Number(button.dataset.choice), button);
  });

  document.getElementById("reset").addEventListener("click", function () {
    state = initialState();
    feedback.textContent = "先保住能工作的步骤，再判断改动是否有效。";
    feedback.className = "feedback";
    render();
    emit("game-reset", { state: snapshot() });
    var first = choices.querySelector("button");
    if (first) first.focus();
  });

  game.start = function () {
    emit("game-start", { state: snapshot() });
    render();
  };
  game.reset = function () { document.getElementById("reset").click(); };
  game.getState = snapshot;

  render();
  emit("game-start", { state: snapshot() });
}());
</script>
</body>
</html>
