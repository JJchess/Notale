<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #111417;
  --text: #edf2f0;
  --font-sans: Inter, "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
  --focus: #f2b84b;
}
#main { padding-top: 28px; padding-bottom: 24px; }
.lesson { height: 100%; gap: 14px; }
.topline { min-height: 48px; align-items: center; gap: 24px; }
.claim { flex: 1 1 auto; font-size: var(--fs-lead); font-weight: 700; line-height: var(--lh-body); }
.claim strong { color: var(--accent); }
.status { flex: 0 0 390px; align-items: center; justify-content: flex-end; gap: 16px; }
.status-copy { min-width: 0; text-align: right; }
.status-main { color: var(--primary); font-size: var(--fs-body); font-weight: 700; line-height: 1.35; }
.status-sub { color: var(--text-secondary); font-size: var(--fs-label); line-height: 1.35; }
.progress-track { position: relative; flex: 0 0 176px; height: 8px; overflow: hidden; background: var(--surface-strong); border: 1px solid var(--line); border-radius: 2px; }
.progress-fill { width: 0; height: 100%; background: var(--primary); transition: width 180ms ease; }
.task-tree { flex: 1 1 0; min-height: 0; gap: 0; }
.task-tree > .lv { height: 100%; padding-left: 16px; border-left-color: var(--primary); }
.task-tree > .lv::before { top: 22px; width: 14px; }
.task-shell { position: relative; display: flex; flex-direction: column; height: 100%; padding: 0 !important; overflow: hidden; background: #151b1d !important; border-left-color: var(--primary) !important; }
.task-shell > .bt { position: relative; z-index: 8; display: flex; align-items: center; justify-content: space-between; min-height: 48px; margin: 0 !important; padding: 8px 18px !important; font-size: var(--fs-body) !important; }
.task-label { display: inline-flex; align-items: center; gap: 10px; }
.task-label::before { width: 10px; height: 10px; content: ""; background: var(--accent); transform: rotate(45deg); }
.task-meta { color: var(--text-secondary); font-family: var(--font-mono); font-size: var(--fs-label); font-weight: 500; }
.scene { position: relative; flex: 1 1 0; min-height: 0; overflow: hidden; touch-action: none; background: linear-gradient(180deg, #182023 0%, #151b1d 55%, #111719 100%); }
.scene::before { position: absolute; right: 0; bottom: 58px; left: 0; height: 96px; content: ""; opacity: .7; background: repeating-linear-gradient(104deg, transparent 0 54px, rgba(85,194,176,.07) 55px 57px), linear-gradient(180deg, transparent, rgba(7,11,12,.9)); border-top: 1px solid var(--line); transform: skewY(-1deg); transform-origin: left bottom; }
.scene canvas { z-index: 2; }
.measure { position: absolute; z-index: 3; right: 92px; bottom: 116px; left: 110px; height: 2px; background: repeating-linear-gradient(90deg, var(--line-strong) 0 2px, transparent 2px 20px); }
.measure::after { position: absolute; right: -2px; top: -5px; width: 10px; height: 10px; content: ""; border-top: 2px solid var(--primary); border-right: 2px solid var(--primary); transform: rotate(45deg); }
.start-mark,.finish-mark { position: absolute; z-index: 4; bottom: 102px; color: var(--text-secondary); font-family: var(--font-mono); font-size: var(--fs-label); line-height: 1.35; }
.start-mark { left: 100px; }
.finish-mark { right: 66px; color: var(--accent); }
.hazard { position: absolute; z-index: 1; left: 59%; bottom: 55px; width: 118px; height: 50px; opacity: .35; background: repeating-linear-gradient(115deg, transparent 0 12px, rgba(242,184,75,.22) 12px 18px); border: 1px dashed var(--accent-line); transform: skewX(-14deg); transition: opacity 150ms ease; }
.hazard.is-seen { z-index: 4; opacity: 1; }
.hazard-label { position: absolute; z-index: 5; left: calc(59% + 2px); bottom: 112px; color: var(--accent); font-size: var(--fs-label); line-height: 1.35; opacity: 0; transition: opacity 150ms ease; }
.hazard-label.is-seen { opacity: 1; }
.footprints { position: absolute; z-index: 1; right: 170px; bottom: 122px; width: 300px; height: 40px; opacity: .36; background: radial-gradient(ellipse at 8% 62%, var(--primary) 0 6px, transparent 7px), radial-gradient(ellipse at 24% 32%, var(--primary) 0 6px, transparent 7px), radial-gradient(ellipse at 42% 62%, var(--primary) 0 6px, transparent 7px), radial-gradient(ellipse at 60% 32%, var(--primary) 0 6px, transparent 7px), radial-gradient(ellipse at 78% 62%, var(--primary) 0 6px, transparent 7px); transform: rotate(-3deg); }
.interface { position: absolute; z-index: 7; width: 222px; min-height: 70px; padding: 10px 12px !important; background: rgba(34,41,43,.96) !important; border: 1px solid var(--line-strong) !important; border-left: 3px solid var(--line-strong) !important; border-radius: 3px !important; cursor: pointer; transition: border-color 140ms ease, background-color 140ms ease, transform 140ms ease; }
.interface::after { position: absolute; width: 44px; height: 1px; content: ""; background: var(--line-strong); }
.interface .bt { margin: 0 0 3px !important; padding: 0 !important; background: transparent !important; border: 0 !important; font-size: var(--fs-sec) !important; }
.interface p { color: var(--text-secondary); font-size: var(--fs-label); line-height: 1.35; }
.interface .port { position: absolute; width: 11px; height: 11px; background: var(--surface-strong); border: 2px solid var(--line-strong); border-radius: 50%; }
.interface[data-slot="observe"] { top: 28px; left: 54px; }
.interface[data-slot="pull"] { top: 28px; right: 54px; }
.interface[data-slot="steady"] { bottom: 38px; left: 54px; }
.interface[data-slot="record"] { right: 54px; bottom: 38px; }
.interface[data-slot="observe"]::after,.interface[data-slot="steady"]::after { right: -44px; top: 50%; }
.interface[data-slot="pull"]::after,.interface[data-slot="record"]::after { left: -44px; top: 50%; }
.interface[data-slot="observe"] .port,.interface[data-slot="steady"] .port { right: -51px; top: calc(50% - 6px); }
.interface[data-slot="pull"] .port,.interface[data-slot="record"] .port { left: -51px; top: calc(50% - 6px); }
.interface.is-filled { background: rgba(85,194,176,.13) !important; border-color: var(--primary) !important; border-left-color: var(--primary) !important; }
.interface.is-filled::after { background: var(--primary); box-shadow: 0 0 8px rgba(85,194,176,.4); }
.interface.is-filled .port { background: var(--primary); border-color: var(--primary); }
.interface.is-error { animation: slotFlash 300ms ease 2; }
.interface:focus-visible,.role-card:focus-visible,.reset:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.scene-feedback { position: absolute; z-index: 9; left: 50%; bottom: 20px; width: 560px; min-height: 28px; color: var(--accent); font-size: var(--fs-sec); line-height: 1.45; text-align: center; transform: translateX(-50%); }
.record-strip { position: absolute; z-index: 5; right: 344px; bottom: 76px; width: 150px; height: 10px; opacity: .25; background: repeating-linear-gradient(90deg, var(--text-secondary) 0 4px, transparent 4px 9px); border-bottom: 1px solid var(--text-secondary); transition: opacity 150ms ease; }
.record-strip.is-on { opacity: 1; border-color: var(--primary); }
.role-area { min-height: 112px; gap: 14px; align-items: stretch; }
.role-intro { flex: 0 0 210px; padding: 10px 0; }
.role-intro h2 { font-size: var(--fs-body); }
.role-intro p { margin-top: 4px; color: var(--text-secondary); font-size: var(--fs-sec); line-height: 1.45; }
.role-cards { flex: 1 1 0; gap: 12px; }
.role-card { position: relative; flex: 1 1 0; min-width: 0; padding: 11px 14px; color: var(--text); background: var(--surface-raised); border: 1px solid var(--line-strong); border-left: 4px solid var(--accent); border-radius: 3px; cursor: grab; user-select: none; touch-action: none; transition: transform 140ms ease, opacity 140ms ease, border-color 140ms ease; }
.role-card strong { display: block; font-size: var(--fs-sec); line-height: 1.35; }
.role-card span { display: block; margin-top: 3px; color: var(--text-secondary); font-size: var(--fs-label); line-height: 1.35; }
.role-card.is-selected { border-color: var(--accent); background: var(--accent-soft); }
.role-card.is-assigned { opacity: .38; cursor: default; }
.role-card.is-dragging { z-index: 40; cursor: grabbing; filter: drop-shadow(0 12px 18px rgba(0,0,0,.42)); transition: none; }
.role-card.is-wrong { animation: cardRebound 300ms ease; }
.reset { display: none; flex: 0 0 48px; width: 48px; min-height: 48px; align-self: center; padding: 0; font-size: 24px; }
.reset.is-visible { display: inline-flex; }
@keyframes cardRebound { 0%,100% { transform: translateX(0); } 35% { transform: translateX(-9px); } 70% { transform: translateX(6px); } }
@keyframes slotFlash { 50% { border-color: var(--accent) !important; background: var(--accent-soft) !important; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body data-page="21" data-total="44">
<div id="stage">
<main id="main">
  <section class="lesson col" aria-labelledby="task-heading">
    <div class="topline row">
      <p class="claim">分工不是把人排成等级，<strong>而是把不同能力接入同一任务。</strong></p>
      <div class="status row" aria-live="polite">
        <div class="status-copy">
          <div class="status-main" id="status-main">已接通 0 / 4</div>
          <div class="status-sub" id="status-sub">仍缺失：观察、牵引、稳定、保存</div>
        </div>
        <div class="progress-track" aria-label="石料到终点的路径进度"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
    </div>

    <div class="k-classification task-tree min0" aria-label="共同搬运任务及四类功能">
      <div class="lv min0">
        <section class="box task-shell min0">
          <h2 class="bt" id="task-heading"><span class="task-label">共同搬运一块石料</span><span class="task-meta">四类功能 · 同一完成态</span></h2>
          <div class="scene no-pan min0" id="scene">
            <canvas class="cv-fill" id="world" aria-hidden="true"></canvas>
            <div class="measure"></div>
            <div class="start-mark">起点</div><div class="finish-mark">终点</div>
            <div class="hazard" id="hazard"></div><div class="hazard-label" id="hazard-label">湿滑坡坎已标出</div>
            <div class="footprints"></div><div class="record-strip" id="record-strip"></div>

            <section class="box interface" data-slot="observe" tabindex="0" role="button" aria-label="观察路径接口，需要提前识别坡坎与湿滑区域">
              <h3 class="bt">观察路径</h3><p>提前识别坡坎与湿滑区域</p><span class="port"></span>
            </section>
            <section class="box interface" data-slot="pull" tabindex="0" role="button" aria-label="提供牵引接口，需要持续输入移动所需的力">
              <h3 class="bt">提供牵引</h3><p>持续输入移动所需的力</p><span class="port"></span>
            </section>
            <section class="box interface" data-slot="steady" tabindex="0" role="button" aria-label="稳定载荷接口，需要抑制摆动侧翻和绳索偏转">
              <h3 class="bt">稳定载荷</h3><p>抑制摆动、侧翻与绳索偏转</p><span class="port"></span>
            </section>
            <section class="box interface" data-slot="record" tabindex="0" role="button" aria-label="保存方法接口，需要留下有效路线绑法与动作顺序">
              <h3 class="bt">保存方法</h3><p>留下路线、绑法与动作顺序</p><span class="port"></span>
            </section>
            <p class="scene-feedback" id="feedback">拖动能力卡到对应接口；也可先选卡片，再点接口。</p>
          </div>
        </section>
      </div>
    </div>

    <div class="role-area row">
      <div class="role-intro shrink0">
        <h2>把能力接入任务</h2>
        <p>每张卡只负责一种功能。<br>接口没有上下次序。</p>
      </div>
      <div class="role-cards row min0" id="role-cards">
        <div class="role-card min0" data-role="observe" tabindex="0" role="button" aria-pressed="false"><strong>识别前方坡坎</strong><span>看路 · 标出湿滑处</span></div>
        <div class="role-card min0" data-role="pull" tabindex="0" role="button" aria-pressed="false"><strong>持续拉紧绳索</strong><span>供力 · 让石料前移</span></div>
        <div class="role-card min0" data-role="steady" tabindex="0" role="button" aria-pressed="false"><strong>压住横向摆动</strong><span>扶稳 · 控制侧翻</span></div>
        <div class="role-card min0" data-role="record" tabindex="0" role="button" aria-pressed="false"><strong>记下路线与绑法</strong><span>保存 · 留给下一轮</span></div>
      </div>
      <button class="reset" id="reset" type="button" title="重置分配" aria-label="重置角色分配">↻</button>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script>
Lec.mount({
  index: 21,
  kicker: "DIVISION OF LABOR",
  title: "分工不是排队，而是接力",
  take: "分工不是简单地把人排成等级，而是把不同能力接入同一任务。"
});

(function () {
  var Engine = Matter.Engine;
  var Bodies = Matter.Bodies;
  var Body = Matter.Body;
  var Composite = Matter.Composite;
  var Constraint = Matter.Constraint;
  var engine = Engine.create({ gravity: { x: 0, y: 0.78 } });
  var canvas = document.getElementById('world');
  var scene = document.getElementById('scene');
  var ctx;
  var W = scene.clientWidth;
  var H = scene.clientHeight;
  var assigned = { observe: false, pull: false, steady: false, record: false };
  var selected = null;
  var dragging = null;
  var finished = false;
  var initialX = W * 0.39;
  var finishX = W * 0.82;
  var ground = Bodies.rectangle(W / 2, H - 40, W + 100, 82, { isStatic: true, friction: 0.72, render: { visible: false } });
  var stone = Bodies.polygon(initialX, H - 112, 7, 48, { density: 0.004, friction: 0.74, frictionAir: 0.028, restitution: 0.08, angle: -0.13 });
  var pullAnchor = Bodies.circle(W - 90, H - 150, 5, { isStatic: true });
  var rope = Constraint.create({ bodyA: stone, pointA: { x: 30, y: -14 }, bodyB: pullAnchor, stiffness: 0.018, damping: 0.08, length: Math.max(180, W * 0.34), render: { visible: false } });
  Composite.add(engine.world, [ground, stone, pullAnchor, rope]);

  var slotNames = { observe: '观察路径', pull: '提供牵引', steady: '稳定载荷', record: '保存方法' };
  var missingNames = { observe: '观察', pull: '牵引', steady: '稳定', record: '保存' };
  var mismatch = {
    observe: '这里需要的是观察路径，不是{role}。',
    pull: '这里需要的是持续牵引，不是{role}。',
    steady: '这里需要的是稳定载荷，不是{role}。',
    record: '这里需要的是保存方法，不是{role}。'
  };

  function cardFor(role) { return document.querySelector('.role-card[data-role="' + role + '"]'); }
  function slotFor(role) { return document.querySelector('.interface[data-slot="' + role + '"]'); }

  function fitWorld() {
    W = scene.clientWidth;
    H = scene.clientHeight;
    ctx = Deck.fit(canvas);
  }
  fitWorld();
  Deck.onResize(fitWorld);

  function polygonPoints(body) {
    return body.vertices.map(function (p) { return p.x + ',' + p.y; }).join(' ');
  }

  function draw() {
    if (!ctx) return;
    ctx.clearRect(0, 0, W, H);
    var primary = Deck.rgb('--primary');
    var accent = Deck.rgb('--accent');
    var text = Deck.rgb('--text-secondary');
    var ropeOn = assigned.pull;
    var sx = stone.position.x;
    var sy = stone.position.y;

    ctx.save();
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sx + 26, sy - 12);
    ctx.lineTo(pullAnchor.position.x, pullAnchor.position.y);
    ctx.strokeStyle = ropeOn ? 'rgba(' + primary.join(',') + ',0.9)' : 'rgba(' + text.join(',') + ',0.28)';
    ctx.lineWidth = ropeOn ? 4 : 2;
    if (!ropeOn) ctx.setLineDash([8, 9]);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.beginPath();
    stone.vertices.forEach(function (p, i) { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
    ctx.closePath();
    ctx.fillStyle = '#68716e';
    ctx.fill();
    ctx.strokeStyle = assigned.steady ? 'rgba(' + primary.join(',') + ',1)' : 'rgba(' + accent.join(',') + ',0.88)';
    ctx.lineWidth = assigned.steady ? 4 : 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(sx - 25, sy - 7); ctx.lineTo(sx + 18, sy + 13);
    ctx.moveTo(sx - 8, sy - 28); ctx.lineTo(sx + 28, sy - 4);
    ctx.strokeStyle = 'rgba(17,20,23,.48)'; ctx.lineWidth = 3; ctx.stroke();

    if (assigned.steady) {
      ctx.beginPath();
      ctx.moveTo(sx - 68, sy - 48); ctx.lineTo(sx - 34, sy - 14);
      ctx.moveTo(sx - 68, sy + 28); ctx.lineTo(sx - 38, sy + 12);
      ctx.strokeStyle = 'rgba(' + primary.join(',') + ',0.75)'; ctx.lineWidth = 3; ctx.stroke();
    }
    ctx.restore();
  }

  function physicsStep(t, dt) {
    if (!finished) {
      if (assigned.pull) {
        var routeReady = assigned.observe;
        var force = routeReady ? 0.00042 : 0.00027;
        Body.applyForce(stone, { x: stone.position.x, y: stone.position.y - 18 }, { x: force * stone.mass, y: routeReady && stone.position.x > W * 0.56 ? -0.00012 * stone.mass : 0 });
      }
      if (!assigned.steady && assigned.pull) {
        Body.setAngularVelocity(stone, stone.angularVelocity + Math.sin(t / 210) * 0.0016);
      } else if (assigned.steady) {
        Body.setAngularVelocity(stone, stone.angularVelocity * 0.72);
        Body.setAngle(stone, stone.angle * 0.91);
      }
      if (!assigned.observe && stone.position.x > W * 0.59) {
        Body.setVelocity(stone, { x: Math.min(stone.velocity.x, 0.18), y: stone.velocity.y });
      }
      if (Object.keys(assigned).every(function (k) { return assigned[k]; }) && stone.position.x >= finishX) {
        finished = true;
        Body.setVelocity(stone, { x: 0, y: 0 });
        Body.setAngularVelocity(stone, 0);
        document.getElementById('feedback').textContent = '四种能力汇入同一任务：石料稳定抵达终点。';
        document.getElementById('reset').classList.add('is-visible');
      }
    }
    Engine.update(engine, Math.min(dt || 16.67, 33));
    var progress = Deck.clamp((stone.position.x - initialX) / (finishX - initialX), 0, 1);
    document.getElementById('progress-fill').style.width = Math.round(progress * 100) + '%';
    draw();
  }
  Deck.loop(physicsStep, { still: 1200 });

  function updateStatus() {
    var keys = Object.keys(assigned);
    var count = keys.filter(function (k) { return assigned[k]; }).length;
    var missing = keys.filter(function (k) { return !assigned[k]; }).map(function (k) { return missingNames[k]; });
    document.getElementById('status-main').textContent = '已接通 ' + count + ' / 4';
    document.getElementById('status-sub').textContent = missing.length ? '仍缺失：' + missing.join('、') : '四类功能已全部接通';
    document.getElementById('hazard').classList.toggle('is-seen', assigned.observe);
    document.getElementById('hazard-label').classList.toggle('is-seen', assigned.observe);
    document.getElementById('record-strip').classList.toggle('is-on', assigned.record);
  }

  function clearSelection() {
    selected = null;
    document.querySelectorAll('.role-card').forEach(function (card) {
      card.classList.remove('is-selected');
      card.setAttribute('aria-pressed', 'false');
    });
  }

  function assign(role, slot) {
    var card = cardFor(role);
    var target = slotFor(slot);
    if (!card || assigned[role]) return;
    if (role !== slot) {
      card.classList.remove('is-wrong'); target.classList.remove('is-error');
      void card.offsetWidth;
      card.classList.add('is-wrong'); target.classList.add('is-error');
      document.getElementById('feedback').textContent = mismatch[slot].replace('{role}', slotNames[role]);
      setTimeout(function () { card.classList.remove('is-wrong'); target.classList.remove('is-error'); }, 620);
      clearSelection();
      return;
    }
    assigned[role] = true;
    card.classList.add('is-assigned');
    card.setAttribute('aria-disabled', 'true');
    target.classList.add('is-filled');
    target.setAttribute('aria-label', slotNames[slot] + '接口，已接通');
    document.getElementById('feedback').textContent = slotNames[slot] + '已接通；石料状态随之改变。';
    if (role === 'pull') rope.stiffness = 0.08;
    updateStatus();
    if (Deck.reduced() && Object.keys(assigned).every(function (k) { return assigned[k]; })) {
      Body.setPosition(stone, { x: finishX, y: H - 112 });
      Body.setAngle(stone, 0);
      finished = true;
      document.getElementById('progress-fill').style.width = '100%';
      document.getElementById('feedback').textContent = '四种能力汇入同一任务：石料稳定抵达终点。';
      document.getElementById('reset').classList.add('is-visible');
      draw();
    }
    clearSelection();
  }

  document.querySelectorAll('.role-card').forEach(function (card) {
    card.addEventListener('pointerdown', function (e) {
      var role = card.dataset.role;
      if (assigned[role]) return;
      e.preventDefault();
      card.setPointerCapture(e.pointerId);
      var p = Deck.pt(scene, e);
      dragging = { card: card, role: role, id: e.pointerId, x0: p.x, y0: p.y, dx: 0, dy: 0 };
      card.classList.add('is-dragging');
    });
    card.addEventListener('pointermove', function (e) {
      if (!dragging || dragging.card !== card) return;
      var p = Deck.pt(scene, e);
      dragging.dx = p.x - dragging.x0;
      dragging.dy = p.y - dragging.y0;
      card.style.transform = 'translate(' + dragging.dx + 'px,' + dragging.dy + 'px)';
    });
    card.addEventListener('pointerup', function (e) {
      if (!dragging || dragging.card !== card) return;
      var p = Deck.pt(scene, e);
      var hit = document.elementsFromPoint(e.clientX, e.clientY).find(function (el) { return el.classList && el.classList.contains('interface'); });
      card.classList.remove('is-dragging');
      card.style.transform = '';
      var moved = Math.abs(dragging.dx) + Math.abs(dragging.dy) > 8;
      if (hit) assign(dragging.role, hit.dataset.slot);
      else if (!moved) selectCard(card);
      dragging = null;
    });
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectCard(card); }
    });
  });

  function selectCard(card) {
    var role = card.dataset.role;
    if (assigned[role]) return;
    var wasSelected = selected === role;
    clearSelection();
    if (!wasSelected) {
      selected = role;
      card.classList.add('is-selected');
      card.setAttribute('aria-pressed', 'true');
      document.getElementById('feedback').textContent = '已选择“' + card.querySelector('strong').textContent + '”，再选择一个接口。';
    }
  }

  document.querySelectorAll('.interface').forEach(function (slot) {
    function useSlot() {
      if (selected) assign(selected, slot.dataset.slot);
      else document.getElementById('feedback').textContent = '先选择一张能力卡，再接入“' + slotNames[slot.dataset.slot] + '”。';
    }
    slot.addEventListener('click', useSlot);
    slot.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); useSlot(); } });
  });

  document.getElementById('reset').addEventListener('click', function () {
    Object.keys(assigned).forEach(function (k) { assigned[k] = false; });
    finished = false;
    Body.setPosition(stone, { x: initialX, y: H - 112 });
    Body.setAngle(stone, -0.13);
    Body.setVelocity(stone, { x: 0, y: 0 });
    Body.setAngularVelocity(stone, 0);
    rope.stiffness = 0.018;
    document.querySelectorAll('.role-card').forEach(function (card) { card.classList.remove('is-assigned'); card.removeAttribute('aria-disabled'); });
    document.querySelectorAll('.interface').forEach(function (slot) { slot.classList.remove('is-filled'); slot.setAttribute('aria-label', slotNames[slot.dataset.slot] + '接口'); });
    document.getElementById('reset').classList.remove('is-visible');
    document.getElementById('feedback').textContent = '拖动能力卡到对应接口；也可先选卡片，再点接口。';
    document.getElementById('progress-fill').style.width = '0%';
    updateStatus();
    clearSelection();
  });

  updateStatus();
  draw();
})();
</script>
</body>
</html>
