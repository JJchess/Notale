<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root {
    --bg: #111417;
    --text: #edf2f0;
    --font-sans: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }

  #main { padding-top: 28px; padding-bottom: 24px; }

  .lesson {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    gap: 12px;
  }

  .compare-strip {
    --compare-cols: 3;
    flex: 0 0 154px;
    grid-template-columns: 172px repeat(3, minmax(0, 1fr));
    border-radius: 3px;
  }

  .compare-strip::after { left: 172px; }
  .compare-strip > .hdr,
  .compare-strip > .dim,
  .compare-strip > .cell { padding: 7px 13px; }
  .compare-strip > .hdr { min-height: 35px; align-items: center; }
  .compare-strip > .dim { justify-content: flex-start; text-align: left; }
  .compare-strip > .cell { display: flex; align-items: center; gap: 9px; }
  .compare-strip > :nth-child(3n) { border-right-color: var(--line); }
  .compare-strip > :nth-child(4n) { border-right-color: transparent; }
  .compare-strip .hdr.mode-head { justify-content: space-between; }
  .compare-strip .mode-head.active { color: var(--bg); background: var(--primary); }
  .compare-strip .mode-head.done { box-shadow: inset 0 -3px 0 var(--accent); }
  .compare-strip .mark {
    width: 8px;
    height: 8px;
    flex: 0 0 auto;
    border: 1px solid var(--line-strong);
    border-radius: 50%;
  }
  .compare-strip .active .mark { background: var(--bg); border-color: var(--bg); }
  .compare-strip .done .mark { background: var(--accent); border-color: var(--accent); }
  .metric { color: var(--text-secondary); font-family: var(--font-mono); font-size: var(--fs-label); }
  .metric strong { color: inherit; }

  .sim-shell {
    position: relative;
    flex: 1 1 0;
    min-height: 0;
    overflow: hidden;
    background: #14191b;
    border: 1px solid var(--line-strong);
    border-radius: 3px;
  }

  .sim-canvas { z-index: 1; }
  .sim-ui { position: absolute; z-index: 3; inset: 0; pointer-events: none; }

  .toolbar {
    position: absolute;
    top: 12px;
    left: 14px;
    right: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    pointer-events: auto;
  }

  .mode-control {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .mode-control label { color: var(--text-secondary); font-size: var(--fs-label); font-weight: 650; }
  #mode-select { width: 174px; }
  .weight-readout {
    padding: 7px 12px;
    color: var(--text-secondary);
    background: rgba(17, 20, 23, 0.88);
    border: 1px solid var(--line);
    font-size: var(--fs-label);
    line-height: 1.35;
  }
  .weight-readout strong { color: var(--text); font-family: var(--font-mono); }
  #reset-btn { width: 44px; min-width: 44px; padding: 0; font-size: 22px; }

  .clue-rack {
    position: absolute;
    top: 66px;
    left: 18px;
    display: flex;
    gap: 8px;
    max-width: 760px;
    transition: opacity 240ms ease;
  }
  .clue-rack.hidden { opacity: 0.18; }
  .clue {
    padding: 5px 9px;
    color: var(--accent);
    background: rgba(17, 20, 23, 0.9);
    border: 1px solid var(--accent-line);
    font-size: var(--fs-label);
    line-height: 1.35;
  }
  .clue b { color: var(--text); font-weight: 650; }

  .node-label {
    position: absolute;
    bottom: 46px;
    color: var(--text-secondary);
    font-size: var(--fs-label);
    line-height: 1.35;
    transform: translateX(-50%);
  }
  .node-label.passed { color: var(--primary); }
  .node-label.current { color: var(--accent); font-weight: 700; }
  .node-1 { left: 38%; }
  .node-2 { left: 59%; }
  .node-3 { left: 79%; }

  .pull-handle {
    position: absolute;
    z-index: 5;
    width: 62px;
    height: 62px;
    margin: -31px 0 0 -31px;
    padding: 0;
    color: var(--bg);
    background: var(--accent);
    border: 3px solid #ffe0a0;
    border-radius: 50%;
    box-shadow: 0 0 0 8px rgba(242, 184, 75, 0.12);
    cursor: grab;
    touch-action: none;
    pointer-events: auto;
    font-size: 24px;
    transition: box-shadow 140ms ease, background-color 140ms ease;
  }
  .pull-handle.dragging { cursor: grabbing; box-shadow: 0 0 0 12px rgba(242, 184, 75, 0.2); }
  .pull-handle.good { background: var(--primary); border-color: #b9f0e6; }

  .status-line {
    position: absolute;
    right: 16px;
    bottom: 14px;
    left: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    pointer-events: none;
  }
  .status-message {
    max-width: 880px;
    padding: 7px 11px;
    color: var(--text);
    background: rgba(17, 20, 23, 0.9);
    border-left: 3px solid var(--primary);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
  }
  .status-message.warn { border-left-color: var(--accent); }
  .progress-readout {
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
    white-space: nowrap;
  }

  .claim-band {
    flex: 0 0 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 28px;
    padding: 0 18px;
    background: var(--surface-soft);
    border-left: 5px solid var(--accent);
  }
  .claim-band p { font-size: var(--fs-lead); font-weight: 700; line-height: var(--lh-body); }
  .claim-band .subclaim { color: var(--text-secondary); font-size: var(--fs-sec); font-weight: 400; }

  .summary-overlay {
    position: absolute;
    z-index: 8;
    inset: 76px 210px 52px;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(20, 25, 27, 0.96);
    border: 1px solid var(--accent-line);
  }
  .summary-overlay.show { display: flex; }
  .summary-overlay p { max-width: 780px; font-size: var(--fs-lead); line-height: var(--lh-body); text-align: center; }
  .summary-overlay strong { color: var(--accent); }

  button:focus-visible, select:focus-visible, .pull-handle:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body data-page="22" data-total="44">
<div id="stage">
<main id="main">
  <section class="lesson" aria-label="群体搬运比较模拟">
    <div class="k-comparison compare-strip" aria-label="单人、两人与群体的同维度比较">
      <div class="hdr">同一搬运任务</div>
      <div class="hdr mode-head active" data-head="solo"><span>单人</span><span class="mark" aria-hidden="true"></span></div>
      <div class="hdr mode-head" data-head="pair"><span>两人</span><span class="mark" aria-hidden="true"></span></div>
      <div class="hdr mode-head" data-head="group"><span>群体</span><span class="mark" aria-hidden="true"></span></div>
      <div class="rowline"></div>
      <div class="dim">力量边界</div>
      <div class="cell"><span>可能停滞</span><span class="metric" data-metric="solo-force">待尝试</span></div>
      <div class="cell"><span>合力越坡</span><span class="metric" data-metric="pair-force">待尝试</span></div>
      <div class="cell"><span>多点牵引</span><span class="metric" data-metric="group-force">待尝试</span></div>
      <div class="rowline"></div>
      <div class="dim">路线信息</div>
      <div class="cell">独记三段</div>
      <div class="cell">各记一部分</div>
      <div class="cell">线索分散后汇合</div>
      <div class="rowline"></div>
      <div class="dim">协调代价</div>
      <div class="cell">动作直接</div>
      <div class="cell">同步转向</div>
      <div class="cell">冲突会抵消合力</div>
    </div>

    <div class="sim-shell no-pan min0" id="sim-shell">
      <canvas id="sim-canvas" class="sim-canvas cv-fill" aria-hidden="true"></canvas>
      <div class="sim-ui">
        <div class="toolbar">
          <div class="mode-control ctl">
            <label for="mode-select">协作规模</label>
            <select id="mode-select" aria-label="选择协作规模">
              <option value="solo">单人</option>
              <option value="pair">两人</option>
              <option value="group">群体</option>
            </select>
            <span class="weight-readout">同一货物 <strong id="weight-value">—</strong></span>
          </div>
          <button id="reset-btn" type="button" title="清空三次结果并重来" aria-label="重置模拟">↻</button>
        </div>

        <div class="clue-rack" id="clue-rack" aria-label="短暂显示的路线线索"></div>
        <span class="node-label node-1" data-node="0">岔口 1</span>
        <span class="node-label node-2" data-node="1">岔口 2</span>
        <span class="node-label node-3" data-node="2">岔口 3</span>

        <button class="pull-handle" id="pull-handle" type="button" aria-label="牵引握点。拖向右侧前进，在岔口向上或向下选择路线" aria-describedby="status-message">→</button>

        <div class="status-line">
          <div class="status-message" id="status-message" role="status" aria-live="polite">拖动琥珀握点向右牵引；到岔口时，按线索向上或向下转向。</div>
          <div class="progress-readout"><span id="node-count">0 / 3</span> 节点</div>
        </div>

        <div class="summary-overlay" id="summary-overlay" aria-live="polite">
          <p>三次结果使用同一货物与路线。<strong>人数扩大了力量与记忆边界</strong>，但只有协调方向和时机，人数才会变成能力。</p>
        </div>
      </div>
    </div>

    <div class="claim-band">
      <p>群体合作可以突破单个人的力量和记忆边界。</p>
      <p class="subclaim">增加成员并不自动成功：力量、信息和时机需要协调。</p>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script>
(function () {
  "use strict";

  Lec.mount({
    index: 22,
    kicker: "CHAPTER IV · SHARED LOAD",
    title: "多一双手，也多一份记忆",
    take: "群体合作可以突破单个人的力量和记忆边界"
  });

  var Engine = Matter.Engine;
  var Bodies = Matter.Bodies;
  var Body = Matter.Body;
  var Composite = Matter.Composite;
  var engine = Engine.create({ enableSleeping: false });
  engine.gravity.y = 1.05;

  var canvas = document.getElementById("sim-canvas");
  var shell = document.getElementById("sim-shell");
  var handle = document.getElementById("pull-handle");
  var modeSelect = document.getElementById("mode-select");
  var resetButton = document.getElementById("reset-btn");
  var statusMessage = document.getElementById("status-message");
  var nodeCount = document.getElementById("node-count");
  var clueRack = document.getElementById("clue-rack");
  var summary = document.getElementById("summary-overlay");
  var weightValue = document.getElementById("weight-value");
  var nodeLabels = Array.prototype.slice.call(document.querySelectorAll(".node-label"));

  var W = 1408;
  var H = 370;
  var massKg = 80;
  var route = [-1, 1, -1];
  var nodeXs = [535, 830, 1110];
  var modes = {
    solo:  { label: "单人", pull: 0.00092, hands: 1, clueOwners: ["你", "你", "你"] },
    pair:  { label: "两人", pull: 0.00126, hands: 2, clueOwners: ["甲", "乙", "甲"] },
    group: { label: "群体", pull: 0.00162, hands: 4, clueOwners: ["甲", "乙", "丙"] }
  };

  var state;
  var cargo;
  var grounds = [];
  var traces = { solo: [], pair: [], group: [] };
  var results = { solo: null, pair: null, group: null };
  var dragging = false;
  var keyPull = false;
  var clueTimer = 0;
  var lastTime = 0;

  function freshState(mode) {
    return {
      mode: mode || "solo",
      started: false,
      complete: false,
      passed: 0,
      elapsed: 0,
      stalls: 0,
      corrections: 0,
      pullX: 235,
      pullY: 205,
      lastX: 118,
      stableDirection: 1,
      warningAt: 0
    };
  }

  function buildWorld() {
    Composite.clear(engine.world, false);
    Engine.clear(engine);
    grounds = [];
    var points = [
      [0, 302], [180, 302], [330, 270], [470, 303], [650, 252],
      [780, 292], [960, 244], [1130, 285], [1408, 252]
    ];
    for (var i = 0; i < points.length - 1; i++) {
      var a = points[i];
      var b = points[i + 1];
      var dx = b[0] - a[0];
      var dy = b[1] - a[1];
      var len = Math.sqrt(dx * dx + dy * dy);
      var ground = Bodies.rectangle((a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + 24, len + 8, 48, {
        isStatic: true,
        angle: Math.atan2(dy, dx),
        friction: 0.84,
        restitution: 0.02,
        render: { visible: false }
      });
      grounds.push(ground);
    }
    cargo = Bodies.polygon(118, 236, 7, 29, {
      friction: 0.78,
      frictionAir: 0.046,
      restitution: 0.08,
      density: 0.006
    });
    Composite.add(engine.world, grounds.concat([cargo]));
  }

  function showClues() {
    var cfg = modes[state.mode];
    clueRack.innerHTML = "";
    route.forEach(function (dir, i) {
      var piece = document.createElement("span");
      piece.className = "clue";
      piece.innerHTML = "<b>" + cfg.clueOwners[i] + "</b> · 岔口 " + (i + 1) + " " + (dir < 0 ? "向上" : "向下");
      clueRack.appendChild(piece);
    });
    clueRack.classList.remove("hidden");
    window.clearTimeout(clueTimer);
    clueTimer = window.setTimeout(function () {
      clueRack.classList.add("hidden");
    }, Deck.reduced() ? 9000 : 3600);
  }

  function setStatus(text, warn) {
    statusMessage.textContent = text;
    statusMessage.classList.toggle("warn", !!warn);
  }

  function resetRun(mode, preserveResults) {
    state = freshState(mode || state && state.mode || "solo");
    modeSelect.value = state.mode;
    buildWorld();
    if (!preserveResults) {
      traces = { solo: [], pair: [], group: [] };
      results = { solo: null, pair: null, group: null };
      document.querySelectorAll(".mode-head").forEach(function (el) { el.classList.remove("done"); });
    } else {
      traces[state.mode] = [];
    }
    dragging = false;
    keyPull = false;
    handle.classList.remove("dragging", "good");
    summary.classList.remove("show");
    showClues();
    updateDOM();
    setStatus("拖动琥珀握点向右牵引；到岔口时，按线索向上或向下转向。", false);
  }

  function updateDOM() {
    var px = Deck.clamp(state.pullX / W * shell.clientWidth, 54, shell.clientWidth - 54);
    var py = Deck.clamp(state.pullY / H * shell.clientHeight, 104, shell.clientHeight - 62);
    handle.style.left = px + "px";
    handle.style.top = py + "px";
    nodeCount.textContent = state.passed + " / " + route.length;
    nodeLabels.forEach(function (el, i) {
      el.classList.toggle("passed", i < state.passed);
      el.classList.toggle("current", i === state.passed && !state.complete);
    });
    document.querySelectorAll(".mode-head").forEach(function (el) {
      el.classList.toggle("active", el.getAttribute("data-head") === state.mode);
    });
  }

  function startRun() {
    if (state.started || state.complete) return;
    state.started = true;
    state.elapsed = 0;
    showClues();
    shell.dispatchEvent(new CustomEvent("game-start", { bubbles: true, detail: { mode: state.mode } }));
  }

  function routeCheck() {
    if (state.passed >= nodeXs.length) return;
    var nx = nodeXs[state.passed];
    if (state.lastX < nx && cargo.position.x >= nx) {
      var desired = route[state.passed];
      var chosen = state.pullY < cargo.position.y - 8 ? -1 : (state.pullY > cargo.position.y + 8 ? 1 : 0);
      if (chosen === desired) {
        state.passed += 1;
        handle.classList.add("good");
        window.setTimeout(function () { handle.classList.remove("good"); }, 260);
        setStatus("路线片段已接上，继续牵引。", false);
      } else {
        state.corrections += 1;
        Body.setPosition(cargo, { x: nx - 42, y: cargo.position.y - 4 });
        Body.setVelocity(cargo, { x: -2.2, y: -0.5 });
        setStatus("路线片段没有拼完整。回到岔口，按线索改变方向。", true);
      }
      updateDOM();
    }
    state.lastX = cargo.position.x;
  }

  function finishRun() {
    if (state.complete) return;
    state.complete = true;
    dragging = false;
    keyPull = false;
    var elapsed = Math.max(1, state.elapsed);
    results[state.mode] = {
      time: elapsed,
      stalls: state.stalls,
      corrections: state.corrections
    };
    var head = document.querySelector('[data-head="' + state.mode + '"]');
    head.classList.add("done");
    var metric = document.querySelector('[data-metric="' + state.mode + '-force"]');
    metric.textContent = Math.round(elapsed) + " s · 停 " + state.stalls + " 次";
    setStatus(modes[state.mode].label + "已送达：路线完整，货物停靠成功。", false);
    shell.dispatchEvent(new CustomEvent("game-complete", {
      bubbles: true,
      detail: { score: Math.max(0, 100 - state.stalls * 8 - state.corrections * 12), metrics: results[state.mode], trace: traces[state.mode].slice() }
    }));
    if (results.solo && results.pair && results.group) {
      summary.classList.add("show");
      setStatus("三种协作规模均已送达。比较顶部同一维度的结果。", false);
    }
  }

  function applyPull(dt) {
    if (!state.started || state.complete || (!dragging && !keyPull)) return;
    var cfg = modes[state.mode];
    var dx = state.pullX - cargo.position.x;
    var dy = state.pullY - cargo.position.y;
    var len = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    var direction = dx > 0 ? 1 : -0.35;
    var alignment = Math.abs(dy / len);
    var coordination = 1;
    if (state.mode === "pair") coordination = Math.max(0.68, 1 - alignment * 0.42);
    if (state.mode === "group") coordination = Math.max(0.42, 1 - alignment * 0.88);
    var force = cfg.pull * coordination * direction;
    Body.applyForce(cargo, cargo.position, {
      x: force * dx / len,
      y: force * dy / len - 0.00012
    });
    if (coordination < 0.58 && performance.now() - state.warningAt > 1000) {
      state.stalls += 1;
      state.warningAt = performance.now();
      setStatus("牵引方向冲突，部分合力被抵消。把握点移回路线前方。", true);
    } else if (cargo.speed < 0.24 && state.elapsed > 1.5 && performance.now() - state.warningAt > 1500) {
      state.stalls += 1;
      state.warningAt = performance.now();
      setStatus("这次合力不足，货物正在回滑。向更远的前方持续牵引。", true);
    }
    state.elapsed += dt / 1000;
  }

  function pointerPosition(e) {
    var p = Deck.pt(shell, e);
    return {
      x: Deck.clamp(p.x / shell.clientWidth * W, 70, W - 28),
      y: Deck.clamp(p.y / shell.clientHeight * H, 92, H - 48)
    };
  }

  handle.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    startRun();
    dragging = true;
    handle.classList.add("dragging");
    handle.setPointerCapture(e.pointerId);
    var p = pointerPosition(e);
    state.pullX = p.x;
    state.pullY = p.y;
    updateDOM();
  });

  handle.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var p = pointerPosition(e);
    state.pullX = p.x;
    state.pullY = p.y;
    updateDOM();
  });

  function releasePointer(e) {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove("dragging");
    if (e && handle.hasPointerCapture(e.pointerId)) handle.releasePointerCapture(e.pointerId);
  }
  handle.addEventListener("pointerup", releasePointer);
  handle.addEventListener("pointercancel", releasePointer);

  handle.addEventListener("keydown", function (e) {
    var used = true;
    if (e.key === "ArrowRight") { startRun(); keyPull = true; state.pullX = Math.min(W - 28, state.pullX + 62); }
    else if (e.key === "ArrowLeft") state.pullX = Math.max(70, state.pullX - 36);
    else if (e.key === "ArrowUp") state.pullY = Math.max(92, state.pullY - 44);
    else if (e.key === "ArrowDown") state.pullY = Math.min(H - 48, state.pullY + 44);
    else if (e.key === " " || e.key === "Enter") { startRun(); keyPull = !keyPull; }
    else used = false;
    if (used) { e.preventDefault(); updateDOM(); }
  });
  handle.addEventListener("keyup", function (e) { if (e.key === "ArrowRight") keyPull = false; });

  modeSelect.addEventListener("change", function () {
    resetRun(modeSelect.value, true);
    shell.dispatchEvent(new CustomEvent("game-progress", { bubbles: true, detail: { action: "mode", state: { mode: state.mode } } }));
  });

  resetButton.addEventListener("click", function () {
    resetRun("solo", false);
    shell.dispatchEvent(new CustomEvent("game-reset", { bubbles: true }));
  });

  weightValue.textContent = Math.round(Lec.P.weight(massKg, Lec.K.EARTH_G)) + " N";

  function drawGround(ctx) {
    ctx.beginPath();
    ctx.moveTo(0, 302);
    ctx.lineTo(180, 302);
    ctx.lineTo(330, 270);
    ctx.lineTo(470, 303);
    ctx.lineTo(650, 252);
    ctx.lineTo(780, 292);
    ctx.lineTo(960, 244);
    ctx.lineTo(1130, 285);
    ctx.lineTo(W, 252);
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fillStyle = "#202729";
    ctx.fill();
    ctx.strokeStyle = Deck.rgba("--primary", 0.52);
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.setLineDash([6, 10]);
    ctx.strokeStyle = Deck.rgba("--primary", 0.24);
    ctx.lineWidth = 1;
    for (var x = 60; x < W; x += 100) {
      ctx.beginPath();
      ctx.moveTo(x, 315);
      ctx.lineTo(x + 20, 325);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawTrace(ctx, trace, color, alpha) {
    if (trace.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(trace[0][0], trace[0][1]);
    for (var i = 1; i < trace.length; i++) ctx.lineTo(trace[i][0], trace[i][1]);
    ctx.strokeStyle = Deck.rgba(color, alpha);
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  function drawScene() {
    var ctx = Deck.fit(canvas);
    var sx = canvas.clientWidth / W;
    var sy = canvas.clientHeight / H;
    ctx.save();
    ctx.scale(sx, sy);
    ctx.fillStyle = "#14191b";
    ctx.fillRect(0, 0, W, H);

    drawTrace(ctx, traces.solo, "--text-muted", results.solo ? 0.58 : 0.2);
    drawTrace(ctx, traces.pair, "--accent", results.pair ? 0.54 : 0.18);
    drawTrace(ctx, traces.group, "--primary", results.group ? 0.62 : 0.18);
    drawGround(ctx);

    nodeXs.forEach(function (x, i) {
      var passed = i < state.passed;
      var current = i === state.passed;
      ctx.beginPath();
      ctx.arc(x, 250, 11, 0, Math.PI * 2);
      ctx.fillStyle = passed ? Deck.rgba("--primary", 0.95) : Deck.rgba("--accent", current ? 0.9 : 0.42);
      ctx.fill();
      ctx.strokeStyle = passed ? Deck.rgba("--primary", 1) : Deck.rgba("--accent", 1);
      ctx.lineWidth = current ? 4 : 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, 250);
      ctx.lineTo(x + 34, 214);
      ctx.moveTo(x, 250);
      ctx.lineTo(x + 34, 284);
      ctx.strokeStyle = Deck.rgba("--accent", 0.52);
      ctx.lineWidth = 3;
      ctx.stroke();
    });

    var hp = { x: state.pullX, y: state.pullY };
    var cfg = modes[state.mode];
    for (var h = 0; h < cfg.hands; h++) {
      var spread = (h - (cfg.hands - 1) / 2) * 8;
      ctx.beginPath();
      ctx.moveTo(cargo.position.x + 18, cargo.position.y + spread);
      ctx.lineTo(hp.x, hp.y + spread * 1.5);
      ctx.strokeStyle = dragging || keyPull ? Deck.rgba("--accent", 0.9) : Deck.rgba("--text-secondary", 0.6);
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    ctx.save();
    ctx.translate(cargo.position.x, cargo.position.y);
    ctx.rotate(cargo.angle);
    ctx.beginPath();
    var verts = cargo.vertices;
    ctx.moveTo(verts[0].x - cargo.position.x, verts[0].y - cargo.position.y);
    for (var v = 1; v < verts.length; v++) ctx.lineTo(verts[v].x - cargo.position.x, verts[v].y - cargo.position.y);
    ctx.closePath();
    ctx.fillStyle = "#596461";
    ctx.fill();
    ctx.strokeStyle = "#aebbb7";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  resetRun("solo", false);
  Deck.onResize(function () { updateDOM(); drawScene(); });
  Deck.loop(function (t, dt) {
    var step = dt || 16.67;
    if (step > 34) step = 34;
    if (!state.complete) {
      applyPull(step);
      Engine.update(engine, step);
      routeCheck();
      if (state.started && (!traces[state.mode].length || t - lastTime > 90)) {
        traces[state.mode].push([cargo.position.x, cargo.position.y]);
        lastTime = t;
      }
      if (cargo.position.x > W - 92 && state.passed === route.length) finishRun();
      if (cargo.position.x < 70) Body.setPosition(cargo, { x: 70, y: cargo.position.y });
    }
    updateDOM();
    drawScene();
  }, { still: 1 });
})();
</script>
</body>
</html>
