<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .status-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 34px;
  }

  .status-line p {
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
  }

  .status-line strong {
    color: var(--accent);
  }

  .status-key {
    display: flex;
    gap: 20px;
    color: var(--text-secondary);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .status-key span {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .status-key i {
    width: 18px;
    height: 3px;
    background: var(--primary);
  }

  .status-key .noise-key {
    background: var(--accent);
  }

  .k-process {
    --process-gap: 28px;
    flex: 0 0 126px;
    padding: 0;
  }

  .k-process > .step {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 12px;
  }

  .step-no {
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-tick);
    line-height: 1.35;
  }

  .step-name {
    font-size: var(--fs-sec);
    font-weight: 700;
    line-height: var(--lh-sec);
  }

  .step-value {
    overflow: hidden;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    line-height: 1.35;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .k-process > .step.is-done .step-value {
    color: var(--primary);
  }

  .k-process > .step.is-error {
    background: var(--accent-soft);
    border-color: var(--accent-line);
    border-style: dashed;
    border-top-color: var(--accent);
  }

  .k-process > .step.is-error .step-value {
    color: var(--accent);
  }

  .signal-field {
    position: relative;
    flex: 1 1 0;
    min-height: 0;
    background: #141a1c;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }

  .signal-field::before {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 40%;
    width: 1px;
    content: "";
    background: var(--line-strong);
  }

  .field-heading {
    position: absolute;
    z-index: 2;
    top: 12px;
    color: var(--text-secondary);
    font-size: var(--fs-label);
    font-weight: 700;
    line-height: 1.35;
  }

  .field-heading.sender {
    left: 18px;
  }

  .field-heading.receiver {
    left: calc(40% + 18px);
  }

  #signal-svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  #signal-svg text {
    font-family: var(--font-sans);
  }

  #signal-svg .svg-label {
    fill: var(--text-secondary);
    font-size: 15px;
  }

  #signal-svg .svg-body {
    fill: var(--text);
    font-size: 17px;
    font-weight: 700;
  }

  #signal-svg .svg-token {
    fill: var(--text);
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 700;
  }

  #signal-svg .svg-tick {
    fill: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 13px;
  }

  #signal-svg .pulse {
    pointer-events: none;
  }

  .control-band {
    display: flex;
    align-items: center;
    gap: 24px;
    flex: 0 0 62px;
    min-width: 0;
  }

  .noise-control {
    display: grid;
    grid-template-columns: auto 250px 54px;
    gap: 12px;
    flex: 0 0 auto;
  }

  .noise-control output {
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: var(--fs-body);
    font-weight: 700;
    line-height: 1.35;
    text-align: right;
  }

  .table-control select {
    width: 188px;
  }

  .reset-button {
    width: 44px;
    padding: 0;
    font-size: 24px;
  }

  .result-copy {
    flex: 1 1 0;
    min-width: 0;
    padding-left: 18px;
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
    border-left: 2px solid var(--primary-line);
  }

  .result-copy.is-success {
    color: var(--text);
    border-left-color: var(--accent);
  }

  .result-copy.is-error {
    color: var(--accent);
    border-left-color: var(--accent);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body data-page="23" data-total="44">
<div id="stage">
<main id="main">
  <div class="status-line">
    <p>当前：<strong id="phase-readout">执行</strong>　目标动作保持不变，比较符号规则与噪声的影响。</p>
    <div class="status-key" aria-label="图例">
      <span><i></i>规则一致</span>
      <span><i class="noise-key"></i>歧义或偏离</span>
    </div>
  </div>

  <section class="k-process min0" aria-label="从意图到动作的六步过程">
    <div class="axis" aria-hidden="true"></div>
    <div class="step" data-step="0">
      <span class="step-no">01</span><span class="step-name">意图形成</span><span class="step-value">移到位置 4</span><i class="arw" aria-hidden="true"></i>
    </div>
    <div class="step" data-step="1">
      <span class="step-no">02</span><span class="step-name">符号编码</span><span class="step-value" id="encoded-step">◆ ④</span><i class="arw" aria-hidden="true"></i>
    </div>
    <div class="step" data-step="2">
      <span class="step-no">03</span><span class="step-name">指令传递</span><span class="step-value">跨越时间</span><i class="arw" aria-hidden="true"></i>
    </div>
    <div class="step" data-step="3">
      <span class="step-no">04</span><span class="step-name">噪声干扰</span><span class="step-value" id="noise-step">无变形</span><i class="arw" aria-hidden="true"></i>
    </div>
    <div class="step" data-step="4">
      <span class="step-no">05</span><span class="step-name">符号解码</span><span class="step-value" id="decoded-step">位置 4</span><i class="arw" aria-hidden="true"></i>
    </div>
    <div class="step" data-step="5">
      <span class="step-no">06</span><span class="step-name">动作执行</span><span class="step-value" id="action-step">对准目标</span>
    </div>
  </section>

  <figure class="signal-field min0" aria-label="发出者编码目标动作，接收者解码并执行">
    <span class="field-heading sender">发出者 · 符号表 A</span>
    <span class="field-heading receiver">稍后行动的接收者</span>
    <svg id="signal-svg" role="img" aria-label="目标动作、传递中的符号和执行动作对照"></svg>
  </figure>

  <div class="control-band">
    <div class="ctl noise-control">
      <label for="noise">噪声</label>
      <input id="noise" type="range" min="0" max="3" step="1" value="0" aria-describedby="noise-value">
      <output id="noise-value" for="noise">0 / 3</output>
    </div>
    <div class="ctl table-control">
      <label for="receiver-table">接收端符号表</label>
      <select id="receiver-table">
        <option value="A" selected>A · 与发送端共享</option>
        <option value="B">B · 另一套规则</option>
      </select>
    </div>
    <button id="reset" class="reset-button" type="button" title="重置" aria-label="重置">↺</button>
    <p id="result-copy" class="result-copy is-success" aria-live="polite">共同任务需要共享符号；噪声为零时，动作在不同时刻仍能对准。</p>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
  Lec.mount({
    index: 23,
    kicker: "SHARED SYMBOLS",
    title: "同一个符号，才能接上彼此的动作",
    take: "共同任务需要共享符号，否则动作无法在不同时刻协调。"
  });

  (function () {
    var initial = { noise: 0, table: "A" };
    var state = { noise: initial.noise, table: initial.table };
    var targetSlot = 4;
    var slots = [1, 2, 3, 4, 5];
    var noiseInput = document.getElementById("noise");
    var tableSelect = document.getElementById("receiver-table");
    var resetButton = document.getElementById("reset");
    var svg = d3.select("#signal-svg");

    function model() {
      var receivedByNoise = ["◆ ④", "◆ ?", "◇ ④", "④ ◆"][state.noise];
      var decoded;
      if (state.noise === 0) decoded = state.table === "A" ? 4 : 2;
      else if (state.noise === 1) decoded = state.table === "A" ? 3 : 1;
      else if (state.noise === 2) decoded = state.table === "A" ? 5 : 2;
      else decoded = state.table === "A" ? 1 : 5;
      return {
        encoded: "◆ ④",
        received: receivedByNoise,
        decoded: decoded,
        success: decoded === targetSlot,
        ruleShared: state.table === "A",
        noiseText: ["无变形", "位置缺失", "动作替换", "次序颠倒"][state.noise]
      };
    }

    function render() {
      var m = model();
      var width = 1408;
      var height = 248;
      var senderEnd = width * 0.4;
      var slotScale = d3.scalePoint().domain(slots).range([72, 430]);
      var receiverScale = d3.scalePoint().domain(slots).range([930, 1328]);
      var colors = {
        primary: Deck.token("--primary"),
        accent: Deck.token("--accent"),
        text: Deck.token("--text"),
        muted: Deck.token("--text-muted"),
        line: Deck.token("--line-strong"),
        surface: Deck.token("--surface-soft")
      };

      noiseInput.value = state.noise;
      tableSelect.value = state.table;
      document.getElementById("noise-value").textContent = state.noise + " / 3";
      document.getElementById("encoded-step").textContent = m.encoded;
      document.getElementById("noise-step").textContent = m.noiseText;
      document.getElementById("decoded-step").textContent = "位置 " + m.decoded;
      document.getElementById("action-step").textContent = m.success ? "对准目标" : "偏到位置 " + m.decoded;
      document.getElementById("phase-readout").textContent = m.success ? "执行完成" : "解码偏离";

      var copy = document.getElementById("result-copy");
      copy.className = "result-copy " + (m.success ? "is-success" : "is-error");
      if (m.success) {
        copy.textContent = "共同任务需要共享符号；噪声为零时，动作在不同时刻仍能对准。";
      } else if (!m.ruleShared && state.noise === 0) {
        copy.textContent = "指令已送达，但接收端使用了不同的符号规则。";
      } else if (!m.ruleShared) {
        copy.textContent = "符号既受噪声干扰，接收端又使用了不同规则，执行动作偏离目标。";
      } else {
        copy.textContent = "两端共享符号规则，但传递噪声改变了指令，执行动作仍会偏离。";
      }

      d3.selectAll(".k-process > .step")
        .classed("is-done", function (_, i) { return i < (m.success ? 6 : 4); })
        .classed("is-current", function (_, i) { return i === (m.success ? 5 : 4); })
        .classed("is-error", function (_, i) { return !m.success && (i === 3 || i === 4 || i === 5); });

      svg.attr("viewBox", "0 0 " + width + " " + height);
      svg.selectAll("*").remove();
      svg.append("title").text("符号从发送端跨越时间到达接收端");
      svg.append("desc").text("目标是位置四。当前收到的符号为" + m.received + "，执行位置为" + m.decoded + "。");

      var defs = svg.append("defs");
      defs.append("marker")
        .attr("id", "flow-arrow")
        .attr("viewBox", "0 0 10 10")
        .attr("refX", 8).attr("refY", 5)
        .attr("markerWidth", 7).attr("markerHeight", 7)
        .attr("orient", "auto-start-reverse")
        .append("path").attr("d", "M 0 0 L 10 5 L 0 10 z").attr("fill", colors.primary);

      var baselineY = 184;
      var groups = [
        { key: "sender", scale: slotScale, start: 72, end: 430 },
        { key: "receiver", scale: receiverScale, start: 930, end: 1328 }
      ];

      groups.forEach(function (group) {
        svg.append("line")
          .attr("x1", group.start).attr("x2", group.end)
          .attr("y1", baselineY).attr("y2", baselineY)
          .attr("stroke", colors.line).attr("stroke-width", 2);
        svg.selectAll(".tick-" + group.key)
          .data(slots).join("line")
          .attr("class", "tick-" + group.key)
          .attr("x1", function (d) { return group.scale(d); })
          .attr("x2", function (d) { return group.scale(d); })
          .attr("y1", baselineY - 8).attr("y2", baselineY + 8)
          .attr("stroke", colors.line).attr("stroke-width", 2);
        svg.selectAll(".label-" + group.key)
          .data(slots).join("text")
          .attr("class", "svg-tick label-" + group.key)
          .attr("x", function (d) { return group.scale(d); })
          .attr("y", baselineY + 28)
          .attr("text-anchor", "middle")
          .text(function (d) { return d; });
      });

      svg.append("circle")
        .attr("cx", slotScale(targetSlot)).attr("cy", baselineY)
        .attr("r", 17).attr("fill", colors.surface)
        .attr("stroke", colors.accent).attr("stroke-width", 4);
      svg.append("text")
        .attr("class", "svg-body")
        .attr("x", slotScale(targetSlot)).attr("y", 112)
        .attr("text-anchor", "middle").text("目标：位置 4");
      svg.append("line")
        .attr("x1", slotScale(targetSlot)).attr("x2", slotScale(targetSlot))
        .attr("y1", 120).attr("y2", baselineY - 22)
        .attr("stroke", colors.accent).attr("stroke-width", 2)
        .attr("stroke-dasharray", "5 5");

      var flowY = 83;
      svg.append("line")
        .attr("x1", 470).attr("x2", 888)
        .attr("y1", flowY).attr("y2", flowY)
        .attr("stroke", m.success ? colors.primary : colors.accent)
        .attr("stroke-width", 3)
        .attr("stroke-dasharray", m.success ? null : "8 7")
        .attr("marker-end", "url(#flow-arrow)");

      svg.append("text")
        .attr("class", "svg-token")
        .attr("x", 488).attr("y", flowY - 17)
        .text(m.encoded);
      svg.append("text")
        .attr("class", "svg-label")
        .attr("x", 488).attr("y", flowY + 30)
        .text("编码");

      var noiseTicks = d3.range(0, 4);
      svg.selectAll(".noise-mark")
        .data(noiseTicks).join("line")
        .attr("class", "noise-mark")
        .attr("x1", function (d) { return 640 + d * 48; })
        .attr("x2", function (d) { return 640 + d * 48; })
        .attr("y1", function (d) { return flowY - 8 - d * 3; })
        .attr("y2", function (d) { return flowY + 8 + d * 3; })
        .attr("stroke", function (d) { return d <= state.noise ? colors.accent : colors.line; })
        .attr("stroke-width", 3);
      svg.append("text")
        .attr("class", "svg-label")
        .attr("x", 712).attr("y", flowY + 52)
        .attr("text-anchor", "middle").text("噪声区 · " + m.noiseText);

      svg.append("text")
        .attr("class", "svg-token")
        .attr("x", 842).attr("y", flowY - 17)
        .attr("text-anchor", "end")
        .attr("fill", m.success ? colors.text : colors.accent)
        .text(m.received);
      svg.append("text")
        .attr("class", "svg-label")
        .attr("x", 842).attr("y", flowY + 30)
        .attr("text-anchor", "end")
        .text("收到");

      svg.append("circle")
        .attr("cx", receiverScale(m.decoded)).attr("cy", baselineY)
        .attr("r", 17)
        .attr("fill", m.success ? colors.primary : colors.accent)
        .attr("stroke", m.success ? colors.accent : colors.text)
        .attr("stroke-width", m.success ? 5 : 2);
      svg.append("text")
        .attr("class", "svg-body")
        .attr("x", receiverScale(m.decoded)).attr("y", 142)
        .attr("text-anchor", "middle")
        .attr("fill", m.success ? colors.primary : colors.accent)
        .text("执行：位置 " + m.decoded);

      svg.append("path")
        .attr("d", "M " + slotScale(targetSlot) + " 224 H " + receiverScale(targetSlot))
        .attr("fill", "none")
        .attr("stroke", m.success ? colors.primary : colors.accent)
        .attr("stroke-width", 2)
        .attr("stroke-dasharray", m.success ? null : "6 6");
      svg.append("text")
        .attr("class", "svg-label")
        .attr("x", (slotScale(targetSlot) + receiverScale(targetSlot)) / 2)
        .attr("y", 242).attr("text-anchor", "middle")
        .text(m.success ? "原始意图与执行结果对齐" : "执行结果没有回到原始意图");

      if (!Deck.reduced()) {
        svg.append("circle")
          .attr("class", "pulse")
          .attr("cx", 470).attr("cy", flowY).attr("r", 6)
          .attr("fill", m.success ? colors.primary : colors.accent)
          .transition().duration(650)
          .ease(d3.easeCubicInOut)
          .attr("cx", m.success ? 888 : 790)
          .on("end", function () { d3.select(this).remove(); });
      }
    }

    noiseInput.addEventListener("input", function () {
      state.noise = Number(noiseInput.value);
      render();
    });
    tableSelect.addEventListener("change", function () {
      state.table = tableSelect.value;
      render();
    });
    resetButton.addEventListener("click", function () {
      state.noise = initial.noise;
      state.table = initial.table;
      render();
      noiseInput.focus();
    });

    render();
  })();
</script>
</body>
</html>
