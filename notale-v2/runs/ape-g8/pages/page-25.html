<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .task-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 44px;
    gap: 24px;
  }

  .task-prompt {
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
  }

  .task-prompt strong {
    color: var(--accent);
  }

  .comparison-constant {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1 1 auto;
    gap: 24px;
    color: var(--text-secondary);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .constant-item {
    padding-left: 12px;
    border-left: 2px solid var(--primary-line);
  }

  .constant-item.changed {
    color: var(--text);
    border-left-color: var(--accent);
  }

  .reset-btn {
    width: 44px;
    min-width: 44px;
    padding: 0;
    font-size: 24px;
    line-height: 1.35;
  }

  .workspace {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px minmax(0, 1fr);
    min-height: 0;
    height: 286px;
    background:
      linear-gradient(90deg, transparent 49.96%, var(--line-strong) 50%, transparent 50.04%),
      repeating-linear-gradient(0deg, transparent 0 31px, rgba(97, 113, 111, 0.12) 31px 32px),
      #151a1c;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
  }

  .round-ledger {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 18px 22px;
  }

  .round-ledger.is-active {
    background: linear-gradient(90deg, transparent, var(--accent-soft));
  }

  .round-ledger.right.is-active {
    background: linear-gradient(90deg, var(--accent-soft), transparent);
  }

  .round-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    color: var(--text);
    font-size: var(--fs-h2);
    font-weight: 650;
    line-height: var(--lh-heading);
  }

  .mode-note {
    color: var(--text-muted);
    font-size: var(--fs-label);
    font-weight: 500;
    line-height: 1.35;
  }

  .trace {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    flex: 1;
    gap: 6px;
    min-width: 0;
  }

  .trace-step {
    position: relative;
    display: flex;
    flex: 0 0 40px;
    align-items: center;
    justify-content: flex-start;
    min-width: 0;
    height: 40px;
    padding: 0 16px 0 44px;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius-sm);
    font-size: var(--fs-label);
    line-height: 1.35;
    text-align: center;
  }

  .trace-step::before {
    position: absolute;
    left: 17px;
    width: 12px;
    height: 12px;
    content: "";
    border: 1px solid var(--line-strong);
    border-radius: 50%;
  }

  .trace-step + .trace-step::after {
    position: absolute;
    bottom: 100%;
    left: 23px;
    width: 1px;
    height: 7px;
    content: "";
    background: var(--line-strong);
  }

  .trace-step.is-done {
    color: var(--text);
    background: var(--primary-soft);
    border-style: solid;
    border-color: var(--primary-line);
  }

  .trace-step.is-done::before {
    background: var(--primary);
    border-color: var(--primary);
  }

  .trace-step.is-current {
    color: var(--accent);
    border-style: solid;
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent-line);
  }

  .trace-step.is-error::after {
    position: absolute;
    top: -9px;
    right: -4px;
    width: 10px;
    height: 10px;
    content: "";
    background: var(--danger);
    border-radius: 50%;
  }

  .progress-marks {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 20px;
  }

  .mark {
    width: 10px;
    height: 10px;
    border: 1px solid var(--line-strong);
    border-radius: 50%;
  }

  .mark.is-done {
    background: var(--primary);
    border-color: var(--primary);
  }

  .mark.is-current {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .action-bay {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    min-width: 0;
    padding: 16px;
    background: rgba(17, 20, 23, 0.82);
    border-right: 1px solid var(--line);
    border-left: 1px solid var(--line);
  }

  .tray-label {
    color: var(--text-secondary);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: 1.35;
    text-align: center;
  }

  .task-options {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .task-option {
    min-width: 0;
    height: 44px;
    padding: 0 8px;
    white-space: nowrap;
  }

  .task-option:last-child {
    grid-column: 1 / -1;
  }

  .task-option.is-correct {
    color: var(--bg);
    background: var(--primary);
    border-color: var(--primary);
  }

  .task-option.is-wrong {
    border-color: var(--danger);
    animation: recoil 180ms ease-in-out;
  }

  .reference {
    min-height: 44px;
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
    text-align: center;
  }

  .sequence-preview {
    color: var(--text);
  }

  .check-path {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 4px 8px;
  }

  .check-node {
    color: var(--primary);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .check-node.current {
    color: var(--accent);
    font-weight: 700;
  }

  .check-arrow {
    color: var(--line-strong);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .feedback {
    min-height: 23px;
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
    text-align: center;
  }

  .feedback.error {
    color: var(--danger);
  }

  .k-comparison {
    flex: 0 0 205px;
    min-height: 0;
  }

  .k-comparison > .hdr,
  .k-comparison > .dim,
  .k-comparison > .cell {
    padding: 8px 16px;
  }

  .k-comparison > .hdr {
    min-height: 42px;
  }

  .k-comparison > .cell {
    display: flex;
    align-items: center;
  }

  .cell-trace {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-left: 10px;
  }

  .scar {
    display: inline-block;
    width: 3px;
    height: 16px;
    background: var(--danger);
  }

  .pause {
    display: inline-block;
    width: 8px;
    height: 16px;
    border-right: 2px solid var(--text-muted);
    border-left: 2px solid var(--text-muted);
  }

  .claim {
    color: var(--text);
    font-size: var(--fs-lead);
    font-weight: 700;
    line-height: var(--lh-body);
  }

  .claim em {
    color: var(--accent);
    font-style: normal;
  }

  .claim-secondary {
    margin-left: 18px;
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    font-weight: 500;
    line-height: var(--lh-sec);
  }

  @keyframes recoil {
    0%, 100% { transform: translateX(0); }
    40% { transform: translateX(-7px); }
    70% { transform: translateX(5px); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body data-page="25" data-total="44">
<div id="stage">
<main id="main">
  <div class="task-head">
    <p class="task-prompt" id="taskPrompt"><strong>第一轮：</strong>记住刚才展示的顺序，再依次选择准备项。</p>
    <div class="comparison-constant" aria-label="两轮比较条件">
      <span class="constant-item">同一任务</span>
      <span class="constant-item">同一步骤顺序</span>
      <span class="constant-item changed">只改变：提示是否留在眼前</span>
    </div>
    <button class="reset-btn" id="resetBtn" type="button" title="重新开始" aria-label="重新开始">↻</button>
  </div>

  <section class="workspace" aria-label="两轮出发准备任务">
    <div class="round-ledger left is-active min0" id="leftLedger">
      <div class="round-title"><span>只凭记忆</span><span class="mode-note">提示会收起</span></div>
      <div class="trace" id="leftTrace" aria-label="首轮操作轨迹"></div>
      <div class="progress-marks" id="leftMarks" aria-label="首轮进度"></div>
    </div>

    <div class="action-bay min0">
      <div class="tray-label">出发准备项</div>
      <div class="task-options" id="taskOptions"></div>
      <div class="reference" id="reference" aria-live="polite"></div>
      <div class="feedback" id="feedback" aria-live="assertive"></div>
    </div>

    <div class="round-ledger right min0" id="rightLedger">
      <div class="round-title"><span>有外部提示</span><span class="mode-note">清单持续可见</span></div>
      <div class="trace" id="rightTrace" aria-label="次轮操作轨迹"></div>
      <div class="progress-marks" id="rightMarks" aria-label="次轮进度"></div>
    </div>
  </section>

  <section class="k-comparison" aria-label="记忆负荷前后对照">
    <div class="hdr">比较维度</div><div class="hdr">只凭记忆</div><div class="hdr diff">有外部提示</div>
    <div class="rowline"></div>
    <div class="dim">信息位置</div><div class="cell">提示消失后留在脑内</div><div class="cell diff">清单与图示持续可见</div>
    <div class="rowline"></div>
    <div class="dim">行动依据</div><div class="cell">回想下一步</div><div class="cell diff">查找当前标记与连线</div>
    <div class="rowline"></div>
    <div class="dim">出错表现</div><div class="cell" id="leftErrorCell">等待首轮轨迹</div><div class="cell diff" id="rightErrorCell">已完成项和依赖关系可检查</div>
    <div class="rowline"></div>
    <div class="dim">恢复方式</div><div class="cell">重新回想整段过程</div><div class="cell diff" id="rightRecovery">从最近标记处继续</div>
  </section>

  <p class="claim" id="claim">符号、清单和图示不会替人完成任务，却能把一部分<em>“必须一直记住”</em>的内容留在环境中。<span class="claim-secondary">复杂技能也存在于群体反复使用的提示物与安排里。</span></p>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Lec.mount({
    index: 25,
    kicker: "CULTURE / MEMORY",
    title: "清单让任务不必全靠脑内记住",
    take: "符号、清单和图示把一部分记忆从脑内移到环境中"
  });

  const steps = ["看路线", "装水", "包石器", "系背带", "留标记"];
  const trayOrder = [1, 4, 0, 3, 2];
  const state = {
    round: 1,
    index: 0,
    errors: [[], []],
    pauses: [[], []],
    lastAction: performance.now(),
    previewing: true,
    finished: false
  };

  const taskPrompt = document.getElementById("taskPrompt");
  const taskOptions = document.getElementById("taskOptions");
  const reference = document.getElementById("reference");
  const feedback = document.getElementById("feedback");
  const leftLedger = document.getElementById("leftLedger");
  const rightLedger = document.getElementById("rightLedger");
  const leftErrorCell = document.getElementById("leftErrorCell");
  const rightErrorCell = document.getElementById("rightErrorCell");
  const rightRecovery = document.getElementById("rightRecovery");
  let previewTimer = 0;

  function renderTrace(targetId, roundIndex) {
    const target = document.getElementById(targetId);
    const completed = state.round - 1 > roundIndex ? steps.length : (state.round - 1 === roundIndex ? state.index : 0);
    target.innerHTML = steps.map((step, i) => {
      const done = i < completed;
      const current = state.round - 1 === roundIndex && i === state.index && !state.previewing && !state.finished;
      const error = state.errors[roundIndex].includes(i);
      const visible = done || roundIndex === 1 ? step : "脑内保持";
      const location = roundIndex === 1 && !done ? " · 清单可查" : "";
      return `<span class="trace-step${done ? " is-done" : ""}${current ? " is-current" : ""}${error ? " is-error" : ""}">${visible}${location}</span>`;
    }).join("");
  }

  function renderMarks(targetId, roundIndex) {
    const target = document.getElementById(targetId);
    const completed = state.round - 1 > roundIndex ? steps.length : (state.round - 1 === roundIndex ? state.index : 0);
    target.innerHTML = steps.map((_, i) => {
      const done = i < completed;
      const current = state.round - 1 === roundIndex && i === state.index && !state.finished;
      return `<span class="mark${done ? " is-done" : ""}${current ? " is-current" : ""}"></span>`;
    }).join("");
  }

  function traceMarks(kind, count) {
    if (!count) return "";
    const cls = kind === "error" ? "scar" : "pause";
    const label = kind === "error" ? "错误痕迹" : "停顿痕迹";
    return `<span class="cell-trace" aria-label="${label}">${Array.from({ length: Math.min(count, 5) }, () => `<i class="${cls}"></i>`).join("")}</span>`;
  }

  function updateComparison() {
    const leftErrors = state.errors[0].length;
    const rightErrors = state.errors[1].length;
    const leftPauses = state.pauses[0].length;
    const rightPauses = state.pauses[1].length;
    leftErrorCell.innerHTML = state.round === 1 && !leftErrors ? "操作后留下错误与停顿痕迹" : `漏项、倒序或反复确认 ${traceMarks("error", leftErrors)}${traceMarks("pause", leftPauses)}`;
    rightErrorCell.innerHTML = state.round < 2 ? "已完成项和依赖关系可检查" : `沿可见路径检查 ${traceMarks("error", rightErrors)}${traceMarks("pause", rightPauses)}`;
    rightRecovery.textContent = state.finished ? "从最近标记处继续，不必重想全程" : "从最近标记处继续";
  }

  function renderReference() {
    if (state.previewing) {
      reference.innerHTML = `<span class="sequence-preview">${steps.join(" → ")}</span>`;
      return;
    }
    if (state.round === 1) {
      reference.textContent = "顺序提示已收起";
      return;
    }
    reference.innerHTML = `<span class="check-path">${steps.map((step, i) => `<span class="check-node${i === state.index ? " current" : ""}">${i < state.index ? "✓ " : "○ "}${step}</span>${i < steps.length - 1 ? '<span class="check-arrow">→</span>' : ""}`).join("")}</span>`;
  }

  function renderOptions() {
    taskOptions.innerHTML = "";
    trayOrder.forEach((stepIndex) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "task-option";
      button.textContent = steps[stepIndex];
      button.dataset.step = String(stepIndex);
      button.disabled = state.previewing || state.finished || stepIndex < state.index;
      if (stepIndex < state.index) button.classList.add("is-correct");
      button.addEventListener("click", chooseStep);
      taskOptions.appendChild(button);
    });
  }

  function render() {
    leftLedger.classList.toggle("is-active", state.round === 1 && !state.finished);
    rightLedger.classList.toggle("is-active", state.round === 2 && !state.finished);
    renderTrace("leftTrace", 0);
    renderTrace("rightTrace", 1);
    renderMarks("leftMarks", 0);
    renderMarks("rightMarks", 1);
    renderReference();
    renderOptions();
    updateComparison();
  }

  function chooseStep(event) {
    const chosen = Number(event.currentTarget.dataset.step);
    const roundIndex = state.round - 1;
    const elapsed = performance.now() - state.lastAction;
    if (elapsed > 3200) state.pauses[roundIndex].push(state.index);

    if (chosen !== state.index) {
      state.errors[roundIndex].push(state.index);
      event.currentTarget.classList.add("is-wrong");
      feedback.className = "feedback error";
      feedback.textContent = state.round === 1
        ? "这一步与刚才展示的顺序不一致。"
        : "这一步依赖的前项尚未勾选，请沿连线检查。";
      setTimeout(() => event.currentTarget.classList.remove("is-wrong"), 220);
      state.lastAction = performance.now();
      updateComparison();
      return;
    }

    state.index += 1;
    state.lastAction = performance.now();
    feedback.className = "feedback";
    feedback.textContent = state.index < steps.length ? "当前项已记入账本。" : "这一轮已完成。";

    if (state.index === steps.length) {
      if (state.round === 1) {
        state.round = 2;
        state.index = 0;
        taskPrompt.innerHTML = "<strong>第二轮：</strong>沿持续可见的清单与连线，完成同一任务。";
        feedback.textContent = "清单保留在眼前，从当前标记开始。";
      } else {
        state.finished = true;
        taskPrompt.innerHTML = "<strong>对照完成：</strong>任务相同，改变的是信息留在哪里、如何检查。";
        feedback.textContent = "两轮轨迹已并排保留。";
        document.getElementById("claim").innerHTML = "符号、清单和图示不会替人完成任务，却能把一部分<em>“必须一直记住”</em>的内容留在环境中。<span class=\"claim-secondary\">复杂技能也存在于群体反复使用的提示物与安排里。</span>";
      }
    }
    render();
  }

  function beginRecall() {
    state.previewing = false;
    state.lastAction = performance.now();
    feedback.textContent = "从第一项开始回想。";
    render();
  }

  function reset() {
    clearTimeout(previewTimer);
    state.round = 1;
    state.index = 0;
    state.errors = [[], []];
    state.pauses = [[], []];
    state.previewing = true;
    state.finished = false;
    state.lastAction = performance.now();
    taskPrompt.innerHTML = "<strong>第一轮：</strong>记住刚才展示的顺序，再依次选择准备项。";
    feedback.textContent = "先看一遍准备顺序。";
    document.getElementById("claim").innerHTML = "符号、清单和图示不会替人完成任务，却能把一部分<em>“必须一直记住”</em>的内容留在环境中。<span class=\"claim-secondary\">复杂技能也存在于群体反复使用的提示物与安排里。</span>";
    render();
    previewTimer = setTimeout(beginRecall, Deck.reduced() ? 900 : 3600);
  }

  document.getElementById("resetBtn").addEventListener("click", reset);
  reset();
</script>
</body>
</html>
