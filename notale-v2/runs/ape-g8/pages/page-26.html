<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#111417;--text:#edf2f0;--font-sans:Inter,"Noto Sans SC","Source Han Sans SC","Microsoft YaHei","PingFang SC",Arial,sans-serif;--motion-fast:180ms;--motion-state:360ms;--motion-enter:620ms;--motion-ease:cubic-bezier(.2,.75,.25,1)}
#main{isolation:isolate}
.lesson{height:620px;display:flex;flex-direction:column;gap:16px}
.statusbar{height:48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.progress-copy{display:flex;align-items:baseline;gap:12px;color:var(--text-secondary);font-size:var(--fs-sec);line-height:var(--lh-sec)}
.progress-copy strong{color:var(--accent);font-family:var(--font-mono);font-size:var(--fs-lead)}
.prompt{color:var(--text-secondary);font-size:var(--fs-sec);line-height:var(--lh-sec)}
.workbench{position:relative;flex:1;min-height:0;display:flex;align-items:stretch;gap:24px}
.links{position:absolute;inset:0;z-index:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.links .trunk{fill:none;stroke:var(--line-strong);stroke-width:2}
.links .live{fill:none;stroke:var(--primary);stroke-width:3;stroke-linecap:round}
.links .broken{fill:none;stroke:var(--danger);stroke-width:3;stroke-dasharray:8 7}
.links .pulse{fill:var(--accent);stroke:var(--bg);stroke-width:3}
.branch,.decision{position:relative;z-index:1;min-width:0}
.branch{flex:1 1 0;display:flex}
.decision{flex:0 0 390px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 0}
.k-classification.branch .lv{width:100%;margin:0;padding:0;border-left:2px solid var(--primary-line)}
.k-classification.branch .lv::before{width:18px}
.k-classification.branch .box{box-sizing:border-box;width:100%;height:100%;padding:16px;border-left-width:4px;background:rgba(34,41,43,.84)}
.k-classification.branch .box>.bt{display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px;margin:-16px -16px 12px;padding:10px 16px}
.branch-name{font-size:var(--fs-h2);font-weight:650;line-height:var(--lh-heading)}
.branch-test{color:var(--text-secondary);font-size:var(--fs-label);font-weight:500;line-height:1.35;text-align:right}
.branch-target{width:100%;min-height:52px;margin-bottom:12px;color:var(--text);background:transparent;border:1px dashed var(--line-strong);font-size:var(--fs-label)}
.branch-target:hover,.branch-target:focus-visible{background:var(--accent-soft);border-color:var(--accent)}
.evidence-list{display:flex;flex-direction:column;gap:8px;min-height:244px}
.evidence{display:flex;align-items:flex-start;gap:10px;min-height:37px;padding:7px 9px;color:var(--text-secondary);background:#171c1e;border-left:2px solid var(--primary);font-size:var(--fs-sec);line-height:var(--lh-sec);animation:evidence-in var(--motion-state) var(--motion-ease) both}
.evidence-mark{flex:0 0 18px;color:var(--primary);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;line-height:1.55}
.empty-slot{height:35px;border-bottom:1px solid rgba(97,113,111,.35)}
.hand-motif{width:72px;height:38px;margin-bottom:14px;opacity:.64}
.hand-motif span{display:inline-block;width:12px;height:30px;margin:0 2px;border:1px solid var(--line-strong);border-radius:10px 10px 3px 3px;transform-origin:bottom}
.hand-motif span:nth-child(1){height:23px;transform:rotate(-18deg)}
.hand-motif span:nth-child(2){height:34px}.hand-motif span:nth-child(3){height:38px}.hand-motif span:nth-child(4){height:31px}
.scene-label{margin-bottom:10px;color:var(--accent);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;line-height:1.35}
.situation{box-sizing:border-box;width:350px;min-height:142px;padding:20px;color:var(--text);background:var(--surface-raised);border:2px solid var(--accent);border-radius:var(--radius-sm);box-shadow:0 14px 30px rgba(0,0,0,.26);cursor:grab;touch-action:none;user-select:none;transition:border-color var(--motion-fast),background var(--motion-fast),transform var(--motion-fast);animation:card-enter var(--motion-enter) var(--motion-ease) both}
.situation:active{cursor:grabbing}.situation:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.situation.is-dragging{transition:none;box-shadow:0 20px 40px rgba(0,0,0,.38)}
.situation.is-wrong{animation:shake 340ms ease-out}
.situation.is-right{border-color:var(--primary);background:var(--primary-soft)}
.situation .count{display:block;margin-bottom:10px;color:var(--text-muted);font-family:var(--font-mono);font-size:var(--fs-label);line-height:1.35}
.situation .text{display:block;font-size:var(--fs-lead);font-weight:650;line-height:var(--lh-body)}
.feedback{width:350px;min-height:48px;margin-top:12px;color:var(--text-secondary);font-size:var(--fs-sec);line-height:var(--lh-sec);text-align:center}
.feedback.is-error{color:#f3a09a}
.criteria{height:70px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid var(--line)}
.ruler{display:flex;align-items:center;gap:0;min-width:0}
.criterion{position:relative;display:flex;align-items:center;gap:8px;padding:0 20px;color:var(--text-secondary);font-size:var(--fs-label);line-height:1.35;white-space:nowrap}
.criterion:first-child{padding-left:0}.criterion::after{width:72px;height:1px;margin-left:8px;content:"";background:var(--line-strong)}.criterion:last-child::after{display:none}
.dot{width:8px;height:8px;background:var(--line-strong);border-radius:50%}.criterion.is-met .dot{background:var(--primary)}
.reset{flex:0 0 46px;width:46px;padding:0;font-size:22px;line-height:1}
.claim{display:none;max-width:900px;color:var(--text);font-size:var(--fs-lead);font-weight:700;line-height:var(--lh-body)}
.lesson.is-complete .claim{display:block;animation:claim-in var(--motion-enter) var(--motion-ease) both}
.lesson.is-complete .prompt,.lesson.is-complete .ruler{display:none}
.lesson.is-complete .decision{opacity:.18;pointer-events:none}
.lesson.is-complete .branch.personal{opacity:.45}
.save-chain{display:none;flex-direction:column;gap:9px;margin-top:8px}
.lesson.is-complete .saved .evidence-list,.lesson.is-complete .saved .branch-target{display:none}
.lesson.is-complete .saved .save-chain{display:flex}
.chain-step{position:relative;padding:10px 12px 10px 36px;color:var(--text);background:var(--primary-soft);border-left:3px solid var(--primary);font-size:var(--fs-sec);line-height:var(--lh-sec)}
.chain-step::before{position:absolute;left:12px;color:var(--primary);content:"↓"}.chain-step:first-child::before{content:"●"}
@keyframes card-enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes evidence-in{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}55%{transform:translateX(8px)}80%{transform:translateX(-4px)}}
@keyframes claim-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:1ms!important;transition-duration:1ms!important}.links .pulse{display:none}}
</style>
</head>
<body data-page="26" data-total="44">
<div id="stage">
<main id="main">
  <section class="lesson" aria-label="个人学会与群体保存分类活动">
    <div class="statusbar">
      <div class="progress-copy"><span>已判定</span><strong id="progress">0 / 8</strong></div>
      <div class="row gap-5 items-center"><span class="label text-accent">能否跨越个人与当下</span><p class="prompt">拖到两侧归类；键盘可用左右方向键。</p></div>
    </div>
    <div class="workbench no-pan" id="workbench">
      <svg class="links" id="links" aria-hidden="true"></svg>
      <section class="branch personal k-classification min0" aria-labelledby="personal-title">
        <div class="lv">
          <div class="box">
            <div class="bt"><span class="branch-name" id="personal-title">个人学会</span><span class="branch-test">只证明本人此刻会做</span></div>
            <button class="branch-target" id="personal-target" type="button">归入个人学会</button>
            <div class="evidence-list" id="personal-list" aria-live="polite"></div>
          </div>
        </div>
      </section>
      <section class="decision min0" aria-label="待判定情境">
        <div class="hand-motif" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <div class="scene-label">待判定情境</div>
        <div class="situation" id="situation" role="button" tabindex="0" aria-describedby="feedback" aria-label="待判定情境，拖向左或右，或按左右方向键归类">
          <span class="count" id="card-count"></span><span class="text" id="card-text"></span>
        </div>
        <div class="feedback" id="feedback" aria-live="polite">判断它是否证明：换个人、换时刻仍能恢复。</div>
      </section>
      <section class="branch saved k-classification min0" aria-labelledby="saved-title">
        <div class="lv">
          <div class="box">
            <div class="bt"><span class="branch-name" id="saved-title">群体保存</span><span class="branch-test">能力跨越个人与当下</span></div>
            <button class="branch-target" id="saved-target" type="button">归入群体保存</button>
            <div class="evidence-list" id="saved-list" aria-live="polite"></div>
            <div class="save-chain" aria-label="群体保存链">
              <div class="chain-step">记录或示范：信息留在群体可接触处</div>
              <div class="chain-step">他人取得与纠错：做法不只留在发明者脑中</div>
              <div class="chain-step">再次使用：原学习者缺席仍能恢复技能</div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <div class="criteria">
      <div class="ruler" aria-label="群体保存的三个判据"><span class="axis-label">判据</span><span class="criterion" id="c-self"><span class="dot"></span>本人</span><span class="criterion" id="c-other"><span class="dot"></span>他人取得</span><span class="criterion" id="c-reuse"><span class="dot"></span>再次使用</span></div>
      <p class="claim">文化的关键不是有人发明，而是群体能否保存并再次利用。</p>
      <button class="reset" id="reset" type="button" title="重置并重来" aria-label="重置并重来">↻</button>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
Lec.mount({index:26,kicker:"CULTURE / PRESERVATION",title:"发明发生在个人，文化保存在群体",take:"“一个人会做”是能力出现；“换一个人、换一个时刻仍能恢复”才是群体保存。"});

const situations=[
  {text:"独自摸索出更快的打法",kind:"personal"},
  {text:"动作可被旁观者模仿",kind:"saved"},
  {text:"练习后能稳定完成动作",kind:"personal"},
  {text:"步骤被刻痕、图示或清单记录",kind:"saved"},
  {text:"发明者本人记得操作顺序",kind:"personal"},
  {text:"他人能依记录复现",kind:"saved"},
  {text:"错误会被示范者纠正",kind:"saved"},
  {text:"原学习者缺席后，技能仍能被重新调用",kind:"saved"}
];
const state=window.page26State={index:0,placed:[],drag:null};
const lesson=document.querySelector('.lesson');
const bench=document.getElementById('workbench');
const card=document.getElementById('situation');
const feedback=document.getElementById('feedback');
const progress=document.getElementById('progress');
const cardCount=document.getElementById('card-count');
const cardText=document.getElementById('card-text');
const targets={personal:document.getElementById('personal-target'),saved:document.getElementById('saved-target')};
const lists={personal:document.getElementById('personal-list'),saved:document.getElementById('saved-list')};
const svg=d3.select('#links');

function current(){return situations[state.index]}
function localRect(el){const b=bench.getBoundingClientRect(),r=el.getBoundingClientRect(),sx=bench.offsetWidth/b.width,sy=bench.offsetHeight/b.height;return{x:(r.left-b.left)*sx,y:(r.top-b.top)*sy,w:r.width*sx,h:r.height*sy}}
function center(el){const r=localRect(el);return{x:r.x+r.w/2,y:r.y+r.h/2}}
function pathBetween(a,b){const bend=(a.x+b.x)/2;return `M${a.x},${a.y} C${bend},${a.y} ${bend},${b.y} ${b.x},${b.y}`}
function drawLinks(pulseKind,broken){
  const data=state.placed.map((d,i)=>({d,i,el:lists[d.kind].children[[...state.placed.slice(0,i+1)].filter(x=>x.kind===d.kind).length-1]})).filter(x=>x.el);
  const cardPoint=center(card);
  svg.attr('viewBox',`0 0 ${bench.offsetWidth} ${bench.offsetHeight}`);
  svg.selectAll('path.live').data(data,d=>d.i).join('path').attr('class','live').attr('d',x=>pathBetween(cardPoint,center(x.el)));
  svg.selectAll('path.broken').data(broken?[broken]:[]).join('path').attr('class','broken').attr('d',d=>pathBetween(cardPoint,d));
  svg.selectAll('circle.pulse').remove();
  if(pulseKind&&!Deck.reduced()){
    const el=lists[pulseKind].lastElementChild;if(!el)return;
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',pathBetween(cardPoint,center(el)));const len=p.getTotalLength();
    svg.append('circle').attr('class','pulse').attr('r',7).transition().duration(520).ease(d3.easeCubicOut).attrTween('transform',()=>t=>{const q=p.getPointAtLength(t*len);return `translate(${q.x},${q.y})`}).remove();
  }
}
function renderList(kind){
  const items=state.placed.filter(d=>d.kind===kind);
  lists[kind].innerHTML=items.map((d,i)=>`<div class="evidence"><span class="evidence-mark">${String(i+1).padStart(2,'0')}</span><span>${d.text}</span></div>`).join('')+Array.from({length:Math.max(0,(kind==='personal'?3:5)-items.length)},()=>'<div class="empty-slot" aria-hidden="true"></div>').join('');
}
function render(pulseKind){window.page26Render=render;
  progress.textContent=`${state.placed.length} / ${situations.length}`;
  renderList('personal');renderList('saved');
  const done=state.index>=situations.length;
  lesson.classList.toggle('is-complete',done);
  card.hidden=done;document.querySelector('.scene-label').hidden=done;document.querySelector('.hand-motif').hidden=done;
  if(!done){cardCount.textContent=`情境 ${state.index+1} / ${situations.length}`;cardText.textContent=current().text;card.style.transform='';card.classList.remove('is-right','is-wrong');}
  document.getElementById('c-self').classList.add('is-met');
  document.getElementById('c-other').classList.toggle('is-met',state.placed.some(d=>d.kind==='saved'));
  document.getElementById('c-reuse').classList.toggle('is-met',state.placed.filter(d=>d.kind==='saved').length>=3);
  requestAnimationFrame(()=>drawLinks(pulseKind));
}
function classify(kind){
  if(state.index>=situations.length)return;
  const item=current();
  if(item.kind!==kind){
    feedback.textContent=item.kind==='personal'?"这只说明本人会做，还没有证明别人能够取得并复用。":"这里已有他人取得、纠错或再次使用的证据。";
    feedback.classList.add('is-error');card.classList.remove('is-wrong');void card.offsetWidth;card.classList.add('is-wrong');
    const c=center(card),t=center(targets[kind]);drawLinks(null,{x:c.x+(t.x-c.x)*.55,y:c.y+(t.y-c.y)*.55});setTimeout(()=>drawLinks(),360);return;
  }
  feedback.textContent=kind==='saved'?"证据跨过了本人或当下，接入群体保存。":"这项证据止于本人和当下。";feedback.classList.remove('is-error');card.classList.add('is-right');
  state.placed.push(item);state.index+=1;setTimeout(()=>render(kind),Deck.reduced()?0:180);
}
function reset(){state.index=0;state.placed=[];feedback.textContent="判断它是否证明：换个人、换时刻仍能恢复。";feedback.classList.remove('is-error');render();card.focus()}

targets.personal.addEventListener('click',()=>classify('personal'));targets.saved.addEventListener('click',()=>classify('saved'));document.getElementById('reset').addEventListener('click',reset);
card.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();classify('personal')}if(e.key==='ArrowRight'){e.preventDefault();classify('saved')}if(e.key==='Enter'||e.key===' '){e.preventDefault();feedback.textContent="按左方向键归入个人学会，按右方向键归入群体保存。"}});
card.addEventListener('pointerdown',e=>{if(state.index>=situations.length)return;card.setPointerCapture(e.pointerId);const p=Deck.pt(bench,e);state.drag={id:e.pointerId,start:p};card.classList.add('is-dragging')});
card.addEventListener('pointermove',e=>{if(!state.drag||state.drag.id!==e.pointerId)return;const p=Deck.pt(bench,e),dx=p.x-state.drag.start.x,dy=p.y-state.drag.start.y;card.style.transform=`translate(${dx}px,${dy}px)`});
function finishDrag(e){if(!state.drag||state.drag.id!==e.pointerId)return;const p=Deck.pt(bench,e),left=localRect(targets.personal),right=localRect(targets.saved);card.classList.remove('is-dragging');card.style.transform='';state.drag=null;if(p.x>=left.x&&p.x<=left.x+left.w&&p.y>=left.y&&p.y<=left.y+left.h)classify('personal');else if(p.x>=right.x&&p.x<=right.x+right.w&&p.y>=right.y&&p.y<=right.y+right.h)classify('saved')}
card.addEventListener('pointerup',finishDrag);card.addEventListener('pointercancel',e=>{card.classList.remove('is-dragging');card.style.transform='';state.drag=null});
Deck.onResize(()=>requestAnimationFrame(()=>drawLinks()));
render();
</script>
</body>
</html>
