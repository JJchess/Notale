<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="27" data-total="44">
<div id="stage">
<main id="main">
<style>
  .memory-plate {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .memory-head {
    position: relative;
    z-index: 4;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--sp-7);
    height: 82px;
  }

  .memory-head h1 {
    max-width: 700px;
  }

  .memory-claim {
    width: 590px;
    padding: 0 0 0 var(--sp-5);
    color: var(--text-secondary);
    border-left: 3px solid var(--accent);
    font-size: var(--fs-lead);
    line-height: var(--lh-body);
  }

  .memory-claim strong {
    color: var(--accent);
  }

  .system-map {
    position: relative;
    box-sizing: border-box;
    height: 454px;
    overflow: hidden;
    background: #151b1d;
    border: 1px solid var(--line);
    border-left: 4px solid var(--primary);
  }

  .calibration {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    opacity: .52;
    background-image:
      repeating-linear-gradient(90deg, transparent 0 63px, rgba(97,113,111,.16) 63px 64px),
      linear-gradient(180deg, rgba(85,194,176,.035), transparent 38%, transparent 72%, rgba(85,194,176,.025));
  }

  .calibration::before,
  .calibration::after {
    position: absolute;
    left: 0;
    width: 100%;
    height: 8px;
    content: "";
    background: repeating-linear-gradient(90deg, var(--line-strong) 0 1px, transparent 1px 32px);
  }

  .calibration::before { top: 14px; }
  .calibration::after { bottom: 14px; }

  .system-lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .cal-label {
    position: absolute;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .cal-a { top: 27px; left: 8px; }
  .cal-b { top: 27px; left: 48%; }
  .cal-c { right: 8px; bottom: 27px; }

  .skill-set {
    --enum-cols: 5;
    position: absolute;
    z-index: 3;
    top: 34px;
    left: 118px;
    width: 1146px;
    height: 248px;
    gap: 18px;
  }

  .skill-set.k-enumeration > .it {
    min-height: 248px;
    padding: 18px 16px 20px;
    background: #303a3d;
    border: 2px solid var(--line-strong);
    border-top: 6px solid var(--accent);
    border-bottom: 6px solid var(--primary);
    box-shadow: inset 0 -52px 0 rgba(17,20,23,.34);
    border-radius: 0;
  }

  .skill-set.k-enumeration > .it::before {
    width: 34px;
    height: 34px;
    color: var(--accent);
    background: var(--accent-soft);
    border-color: var(--accent-line);
  }

  .skill-set.k-enumeration > .it > .it-title {
    font-size: 20px;
  }

  .skill-set.k-enumeration > .it > .it-body {
    color: var(--text);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
  }

  .channel-evidence {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 2px;
  }

  .channel-evidence span {
    display: flex;
    align-items: center;
    min-height: 30px;
    padding: 0 10px;
    color: var(--text-secondary);
    background: rgba(17,20,23,.58);
    border-left: 3px solid var(--primary);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: 1.35;
  }

  .tap {
    position: absolute;
    z-index: 2;
    top: 282px;
    width: 2px;
    height: 56px;
    background: var(--accent);
    transform: scaleY(0);
    transform-origin: top;
    animation: tap-in 420ms ease-out forwards;
  }

  .tap::before {
    position: absolute;
    top: -4px;
    left: -4px;
    width: 10px;
    height: 10px;
    content: "";
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 0 5px var(--accent-soft);
  }

  .tap-1 { left: 232px; animation-delay: 520ms; }
  .tap-2 { left: 466px; animation-delay: 650ms; }
  .tap-3 { left: 700px; animation-delay: 780ms; }
  .tap-4 { left: 934px; animation-delay: 910ms; }
  .tap-5 { left: 1168px; animation-delay: 1040ms; }

  .trunk {
    position: absolute;
    z-index: 2;
    top: 337px;
    left: 88px;
    width: 1228px;
    height: 3px;
    background: var(--primary);
    box-shadow: 0 0 16px rgba(85,194,176,.22);
    transform: scaleX(0);
    transform-origin: left;
    animation: trunk-in 920ms cubic-bezier(.2,.75,.2,1) 100ms forwards;
  }

  .trunk::after {
    position: absolute;
    top: -5px;
    right: -1px;
    width: 11px;
    height: 11px;
    content: "";
    border-top: 3px solid var(--primary);
    border-right: 3px solid var(--primary);
    transform: rotate(45deg);
  }

  .origin {
    position: absolute;
    z-index: 4;
    top: 299px;
    left: 0;
    width: 112px;
    height: 80px;
  }

  .stone {
    position: absolute;
    top: 20px;
    left: 38px;
    width: 48px;
    height: 38px;
    background: var(--surface-strong);
    border: 2px solid var(--primary);
    clip-path: polygon(8% 64%, 23% 13%, 73% 0, 100% 44%, 78% 100%, 25% 88%);
  }

  .finger {
    position: absolute;
    left: 0;
    width: 52px;
    height: 12px;
    border-top: 2px solid var(--text-muted);
    border-radius: 50%;
    transform-origin: right;
  }

  .finger-a { top: 23px; transform: rotate(18deg); }
  .finger-b { top: 38px; transform: rotate(4deg); }
  .finger-c { top: 53px; transform: rotate(-13deg); }

  .origin-label {
    position: absolute;
    z-index: 4;
    top: 386px;
    left: 0;
    color: var(--text-secondary);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .origin-sub {
    display: block;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }

  .door {
    position: absolute;
    z-index: 3;
    top: 274px;
    right: 0;
    width: 108px;
    height: 132px;
    border: 3px solid var(--line-strong);
    border-radius: 54px 54px 8px 8px;
    box-shadow: inset 0 0 0 10px rgba(97,113,111,.08);
    animation: door-on 500ms ease-out 1450ms forwards;
  }

  .door::before {
    position: absolute;
    inset: 14px;
    content: "";
    border: 1px solid var(--primary-line);
    border-radius: 40px 40px 4px 4px;
  }

  .door::after {
    position: absolute;
    top: 65px;
    right: 12px;
    width: 12px;
    height: 12px;
    content: "";
    background: var(--accent);
    border-radius: 50%;
  }

  .outlet {
    position: absolute;
    z-index: 4;
    right: 132px;
    bottom: 17px;
    width: 350px;
    padding: 10px 14px;
    color: var(--text);
    background: rgba(17,20,23,.94);
    border-left: 4px solid var(--primary);
  }

  .outlet-kicker {
    display: block;
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 700;
    line-height: 1.35;
  }

  .outlet-title {
    display: block;
    font-size: var(--fs-lead);
    font-weight: 700;
    line-height: var(--lh-body);
  }

  .memory-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-6);
    height: 84px;
  }

  .set-name {
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
  }

  .set-name strong {
    display: block;
    color: var(--primary);
    font-size: var(--fs-lead);
    line-height: var(--lh-body);
  }

  .closing {
    max-width: 780px;
    color: var(--text);
    font-size: var(--fs-lead);
    font-weight: 650;
    line-height: var(--lh-body);
    text-align: right;
  }

  /* Five equal knowledge channels feed one shared collector. */
  .skill-set {
    --enum-cols: 1;
    top: 12px;
    left: 72px;
    width: 1110px;
    height: 416px;
    gap: 8px;
  }

  .skill-set.k-enumeration > .it {
    grid-template-columns: 40px 210px minmax(0, 1fr) 330px;
    align-items: center;
    align-content: center;
    min-height: 0;
    padding: 8px 14px;
    border: 1px solid var(--line-strong);
    border-left: 5px solid var(--accent);
    border-bottom: 3px solid var(--primary);
    box-shadow: none;
  }

  .skill-set.k-enumeration > .it > .it-body {
    grid-column: 3;
    padding-right: 16px;
  }

  .channel-evidence {
    grid-column: 4;
    flex-direction: row;
    margin: 0;
  }

  .channel-evidence span {
    flex: 1 1 0;
    justify-content: center;
    min-height: 38px;
    padding: 0 6px;
    border-left: 0;
    border-bottom: 3px solid var(--primary);
  }

  .tap {
    top: auto;
    left: 1182px;
    width: 54px;
    height: 2px;
    transform: scaleX(0);
    transform-origin: left;
  }

  .tap::before {
    top: -4px;
    left: -4px;
  }

  .tap-1 { top: 53px; }
  .tap-2 { top: 136px; }
  .tap-3 { top: 220px; }
  .tap-4 { top: 303px; }
  .tap-5 { top: 386px; }

  .trunk {
    top: 52px;
    left: 1234px;
    width: 3px;
    height: 336px;
    transform: scaleY(0);
    transform-origin: top;
  }

  .trunk::after {
    top: auto;
    right: -76px;
    bottom: -1px;
    width: 76px;
    height: 3px;
    background: var(--primary);
    border: 0;
    transform: none;
  }

  .origin {
    top: 342px;
    left: 6px;
    transform: scale(.72);
    transform-origin: left bottom;
  }

  .origin-label {
    top: 408px;
    left: 4px;
  }

  .door {
    top: 142px;
    right: 10px;
  }

  .outlet {
    right: 0;
    bottom: 13px;
    width: 300px;
  }

  @keyframes trunk-in { to { transform: scaleY(1); } }
  @keyframes tap-in { to { transform: scaleX(1); } }
  @keyframes door-on {
    to {
      border-color: var(--primary);
      box-shadow: inset 0 0 0 10px rgba(85,194,176,.08), 0 0 20px rgba(85,194,176,.16);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .trunk, .tap { animation: none; transform: none; }
    .door { animation: none; border-color: var(--primary); }
  }
</style>

<section class="memory-plate" aria-labelledby="memory-title">
  <header class="memory-head">
    <h1 id="memory-title">太空能力，不属于某一个人</h1>
    <p class="memory-claim">没有任何一个人能独自发明、掌握并维持<strong>全部能力</strong>。</p>
  </header>

  <figure class="system-map" aria-label="五项同级能力接入同一主干，共同形成可被下一代继续调用的群体技能集合。">
    <div class="calibration" aria-hidden="true">
      <span class="cal-label cal-a">RECORD</span>
      <span class="cal-label cal-b">CHECK · REPEAT</span>
    </div>

    <svg class="system-lines" viewBox="0 0 1408 454" aria-hidden="true" focusable="false">
      <g fill="#263033" stroke="#55c2b0" stroke-width="3">
        <path d="M54 14H1174L1238 52H1318V90H1238L1174 74H54Z"/>
        <path d="M54 96H1174L1238 136H1318V174H1238L1174 158H54Z"/>
        <path d="M54 180H1174L1238 220H1318V258H1238L1174 242H54Z"/>
        <path d="M54 264H1174L1238 303H1318V341H1238L1174 326H54Z"/>
        <path d="M54 348H1174L1238 386H1318V424H1238L1174 410H54Z"/>
      </g>
      <g fill="none" stroke="#f2b84b" stroke-width="4">
        <path d="M70 33H1152"/><path d="M70 116H1152"/><path d="M70 200H1152"/>
        <path d="M70 284H1152"/><path d="M70 368H1152"/>
      </g>
      <path d="M1318 52V405H1384" fill="none" stroke="#55c2b0" stroke-width="8"/>
    </svg>

    <div class="k-enumeration skill-set" aria-label="群体保存的五项同级能力">
      <article class="it">
        <h2 class="it-title">观察与记录</h2>
        <p class="it-body">把经验变成他人可检查的外部记录。</p>
        <div class="channel-evidence" aria-label="保存载体"><span>符号</span><span>清单</span><span>图示</span></div>
      </article>
      <article class="it">
        <h2 class="it-title">制作与操作</h2>
        <p class="it-body">让动作跨越不同的人仍能被重复。</p>
        <div class="channel-evidence" aria-label="重复条件"><span>工具</span><span>规范</span><span>练习</span></div>
      </article>
      <article class="it">
        <h2 class="it-title">协作与交接</h2>
        <p class="it-body">让不同角色在不同时间接续同一任务。</p>
        <div class="channel-evidence" aria-label="接续条件"><span>角色</span><span>接口</span><span>交接</span></div>
      </article>
      <article class="it">
        <h2 class="it-title">纠错与改良</h2>
        <p class="it-body">保存失败信息，使下一次不必从头试起。</p>
        <div class="channel-evidence" aria-label="改良环节"><span>检查</span><span>修订</span><span>复核</span></div>
      </article>
      <article class="it">
        <h2 class="it-title">教学与再训练</h2>
        <p class="it-body">让技能跨越个人寿命继续存在。</p>
        <div class="channel-evidence" aria-label="传承环节"><span>示范</span><span>训练</span><span>再训练</span></div>
      </article>
    </div>

    <span class="tap tap-1" aria-hidden="true"></span>
    <span class="tap tap-2" aria-hidden="true"></span>
    <span class="tap tap-3" aria-hidden="true"></span>
    <span class="tap tap-4" aria-hidden="true"></span>
    <span class="tap tap-5" aria-hidden="true"></span>
    <span class="trunk" aria-hidden="true"></span>

    <div class="origin" aria-hidden="true">
      <span class="finger finger-a"></span>
      <span class="finger finger-b"></span>
      <span class="finger finger-c"></span>
      <span class="stone"></span>
    </div>
    <p class="origin-label">手与工具的接口<span class="origin-sub">INDIVIDUAL ACTION</span></p>

    <div class="door" aria-hidden="true"></div>
    <div class="outlet">
      <span class="outlet-kicker">SHARED OUTPUT</span>
      <span class="outlet-title">可被下一代继续调用</span>
    </div>
  </figure>

  <div class="memory-foot">
    <p class="set-name">五项缺一，能力都难以长期保存。<strong>群体长期保存的技能集合</strong></p>
    <p class="closing">太空能力首先不是英雄的本领，而是群体能够记录、传递、纠错并再次调用的技能集合。</p>
  </div>
</section>
</main>
</div>
