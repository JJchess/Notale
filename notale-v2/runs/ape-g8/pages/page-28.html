<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root {
    --bg: #111417;
    --text: #edf2f0;
    --font-sans: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
  }

  #main {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .orbit-workbench {
    position: relative;
    display: flex;
    flex: 1 1 0;
    min-height: 0;
    overflow: hidden;
    background: #121719;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
  }

  .orbit-scene {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background:
      linear-gradient(rgba(85, 194, 176, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(85, 194, 176, 0.035) 1px, transparent 1px),
      #101416;
    background-size: 48px 48px;
  }

  .earth-field {
    position: absolute;
    z-index: 0;
    box-sizing: border-box;
    width: 390px;
    height: 390px;
    background: #182326;
    border: 3px solid var(--primary);
    border-radius: 50%;
    box-shadow: inset 24px -18px 0 rgba(85, 194, 176, 0.04);
    pointer-events: none;
  }

  .earth-field::after {
    position: absolute;
    inset: 38px;
    content: "";
    border: 1px solid var(--primary-line);
    border-radius: 50%;
    opacity: 0.34;
  }

  .orbit-canvas {
    z-index: 1;
  }

  .scene-caption,
  .scene-legend,
  .vector-label,
  .height-label,
  .fall-note {
    position: absolute;
    z-index: 3;
    pointer-events: none;
  }

  .scene-caption {
    top: 16px;
    left: 18px;
    color: var(--text-secondary);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .scene-caption strong {
    display: block;
    color: var(--text);
    font-size: var(--fs-lead);
    line-height: 1.35;
  }

  .scene-legend {
    top: 16px;
    right: 18px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    color: var(--text-secondary);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .scene-legend span {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .scene-legend i {
    display: block;
    width: 22px;
    height: 3px;
    background: var(--primary);
  }

  .scene-legend .velocity-key { background: var(--accent); }
  .scene-legend .surface-key { background: var(--line-strong); }

  .vector-label,
  .height-label {
    padding: 2px 6px;
    color: var(--text);
    background: rgba(17, 20, 23, 0.88);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    font-size: var(--fs-label);
    line-height: 1.35;
    white-space: nowrap;
  }

  .fall-note {
    left: 18px;
    bottom: 16px;
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
  }

  .path-callout {
    position: absolute;
    z-index: 3;
    width: 176px;
    padding: 8px 10px;
    color: var(--text-secondary);
    background: rgba(17, 20, 23, 0.86);
    border-left: 2px solid var(--primary-line);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
    pointer-events: none;
  }

  .callout-turn { top: 112px; left: 190px; }
  .callout-curve { top: 244px; right: 24px; }
  .callout-miss { top: 332px; left: 40px; }

  .height-scale {
    position: absolute;
    z-index: 3;
    left: 50%;
    top: 74px;
    display: flex;
    flex-direction: column-reverse;
    justify-content: space-between;
    width: 66px;
    height: 108px;
    color: var(--text-secondary);
    border-left: 1px solid var(--line-strong);
    font-family: var(--font-mono);
    font-size: var(--fs-tick);
    line-height: 1.35;
    pointer-events: none;
  }

  .height-scale span {
    position: relative;
    padding-left: 10px;
  }

  .height-scale span::before {
    position: absolute;
    top: 50%;
    left: 0;
    width: 7px;
    height: 1px;
    content: "";
    background: var(--line-strong);
  }

  .condition-chain {
    position: absolute;
    z-index: 3;
    right: 18px;
    bottom: 16px;
    display: flex;
    align-items: stretch;
    gap: 20px;
    pointer-events: none;
  }

  .condition-chain span {
    position: relative;
    width: 104px;
    padding: 8px 10px;
    color: var(--text-secondary);
    background: rgba(20, 26, 28, 0.92);
    border-top: 2px solid var(--primary);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .condition-chain span:not(:last-child)::after {
    position: absolute;
    top: 50%;
    left: calc(100% + 5px);
    color: var(--primary);
    content: "→";
    transform: translateY(-50%);
  }

  .fall-note .data {
    color: var(--primary);
  }

  .orbit-console {
    display: flex;
    flex: 0 0 350px;
    flex-direction: column;
    gap: 10px;
    box-sizing: border-box;
    min-width: 0;
    padding: 16px;
    background: var(--surface-raised);
    border-left: 1px solid var(--line);
  }

  .console-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .console-head h2 {
    font-size: var(--fs-h2);
  }

  .reset-btn {
    flex: 0 0 auto;
    width: 44px;
    padding: 0;
    font-size: 22px;
  }

  .console-claim {
    padding: 7px 10px;
    color: var(--text-secondary);
    background: var(--primary-soft);
    border-left: 3px solid var(--primary);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
  }

  .status {
    min-height: 49px;
    padding: 10px 12px;
    color: var(--text);
    background: #141a1c;
    border-left: 3px solid var(--accent);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
  }

  .status[data-mode="orbit"] {
    border-left-color: var(--primary);
  }

  .status[data-mode="high"] {
    border-left-color: var(--danger);
  }

  .metrics {
    display: flex;
    flex-wrap: wrap;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }

  .metric {
    flex: 1 1 105px;
    min-width: 0;
    padding: 8px 10px;
    background: #141a1c;
  }

  .metric dt {
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .metric dd {
    color: var(--text);
    font-family: var(--font-mono);
    font-size: var(--fs-sec);
    font-weight: 700;
    line-height: 1.45;
    white-space: nowrap;
  }

  .metric.is-key dd {
    color: var(--accent);
  }

  .control-stack {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .ctl {
    display: grid;
    grid-template-columns: 80px minmax(0, 1fr) 78px;
    gap: 10px;
  }

  .ctl output {
    color: var(--text);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    line-height: 1.35;
    text-align: right;
    white-space: nowrap;
  }

  .target-note {
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
  }

  .target-note strong {
    color: var(--primary);
  }

  .progress-line {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: auto;
  }

  .progress-track {
    flex: 1 1 0;
    height: 5px;
    overflow: hidden;
    background: var(--surface-strong);
  }

  .progress-track span {
    display: block;
    width: 0;
    height: 100%;
    background: var(--primary);
    transition: width 140ms ease-out;
  }

  .progress-line output {
    flex: 0 0 42px;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    line-height: 1.35;
    text-align: right;
  }

  .orbit-process {
    --process-gap: 24px;
    flex: 0 0 100px;
    padding: 8px 0 0;
  }

  .orbit-process > .step {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 10px 12px;
  }

  .orbit-process .step-no {
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 700;
    line-height: 1.35;
  }

  .orbit-process .step-text {
    color: inherit;
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
  }

  @media (prefers-reduced-motion: reduce) {
    .progress-track span { transition: none; }
  }
</style>
</head>
<body data-page="28" data-total="44">
<div id="stage">
<main id="main">
  <section class="orbit-workbench" aria-label="轨道形成动态模拟">
    <figure class="orbit-scene min0 no-pan">
      <div id="earthField" class="earth-field" aria-hidden="true"></div>
      <canvas id="orbitCanvas" class="orbit-canvas cv-fill" aria-hidden="true"></canvas>
      <figcaption class="scene-caption">
        <strong>侧视剖面</strong>
        地球曲率与自由落体同步显示
      </figcaption>
      <div class="scene-legend" aria-label="场景图例">
        <span><i></i>运动轨迹</span>
        <span><i class="velocity-key"></i>速度方向</span>
        <span><i class="surface-key"></i>弯曲地面</span>
      </div>
      <span id="velocityLabel" class="vector-label">切向速度</span>
      <span id="gravityLabel" class="vector-label">重力指向地心</span>
      <span id="heightLabel" class="height-label">高度</span>
      <p class="path-callout callout-turn">速度方向每一刻都被重力偏转</p>
      <p class="path-callout callout-curve">地表也在轨迹下方向远处弯离</p>
      <p class="path-callout callout-miss">速度合适时，下落持续错过地面</p>
      <div id="heightScale" class="height-scale" aria-label="高度刻度">
        <span>0 km</span><span>200 km</span><span>400 km</span><span>800 km</span>
      </div>
      <p class="fall-note">起步 1 s：向下 <span id="fallDistance" class="data">—</span>，速度增加 <span id="fallSpeed" class="data">—</span></p>
      <div class="condition-chain" aria-label="轨道成立条件链">
        <span>高度改变目标速度</span>
        <span>切向速度接近目标</span>
        <span>下落路径闭合</span>
      </div>
    </figure>

    <aside class="orbit-console min0" aria-label="轨道参数控制台">
      <div class="console-head">
        <h2>轨道条件</h2>
        <button id="resetButton" class="reset-btn" type="button" title="重置" aria-label="重置轨道参数">↺</button>
      </div>

      <p class="console-claim">高度改变目标速度；横向速度决定下落路径。</p>

      <p id="status" class="status" data-mode="impact">横向速度不足：下落路径先遇到地面</p>

      <dl class="metrics">
        <div class="metric"><dt>当前高度</dt><dd id="heightReadout">—</dd></div>
        <div class="metric"><dt>当前速度</dt><dd id="speedReadout">—</dd></div>
        <div class="metric is-key"><dt>目标速度差</dt><dd id="deltaReadout">—</dd></div>
      </dl>

      <div class="control-stack">
        <div class="ctl">
          <label for="heightRange">高度</label>
          <input id="heightRange" type="range" min="200" max="800" step="25" value="400">
          <output id="heightOutput" for="heightRange">—</output>
        </div>
        <div class="ctl">
          <label for="speedRange">切向速度</label>
          <input id="speedRange" type="range" min="5000" max="9000" step="25" value="6000">
          <output id="speedOutput" for="speedRange">—</output>
        </div>
      </div>

      <div class="target-note">
        <p>此高度闭合轨道约需 <strong id="targetSpeed">—</strong></p>
        <p>闭合一圈约需 <strong id="periodReadout">—</strong></p>
      </div>

      <div class="progress-line" aria-label="轨道完成进度">
        <span class="label">环周进度</span>
        <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
        <output id="progressText">0%</output>
      </div>
    </aside>
  </section>

  <section class="k-process orbit-process" aria-label="轨道形成的六步因果链">
    <div class="axis" aria-hidden="true"></div>
    <div class="step" data-step="0"><span class="step-no">01</span><span class="step-text">选定初始高度</span><span class="arw" aria-hidden="true"></span></div>
    <div class="step" data-step="1"><span class="step-no">02</span><span class="step-text">给出切向速度</span><span class="arw" aria-hidden="true"></span></div>
    <div class="step" data-step="2"><span class="step-no">03</span><span class="step-text">重力拉向地心</span><span class="arw" aria-hidden="true"></span></div>
    <div class="step" data-step="3"><span class="step-no">04</span><span class="step-text">飞行器持续下落</span><span class="arw" aria-hidden="true"></span></div>
    <div class="step" data-step="4"><span class="step-no">05</span><span class="step-text">地面向远处弯离</span><span class="arw" aria-hidden="true"></span></div>
    <div class="step" data-step="5"><span class="step-no">06</span><span class="step-text">持续错过地面</span></div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script>
(function () {
  'use strict';

  Lec.mount({
    index: 28,
    kicker: 'FREE FALL / ORBIT',
    title: '一直下落，为什么撞不到地面？',
    take: '进入轨道不是飞到足够高后停住，而是以合适的横向速度持续自由落体，并不断错过弯曲的地面。'
  });

  var canvas = document.getElementById('orbitCanvas');
  var scene = canvas.parentElement;
  var heightRange = document.getElementById('heightRange');
  var speedRange = document.getElementById('speedRange');
  var resetButton = document.getElementById('resetButton');
  var steps = Array.prototype.slice.call(document.querySelectorAll('.orbit-process .step'));
  var earthRadiusM = Lec.K.EARTH_RADIUS || Lec.K.earth.radius;
  var issAltitudeM = Lec.K.ISS_ALTITUDE || Lec.P.kilometresToMetres(400);
  var orbitalVelocity = Lec.P.orbitalVelocity || Lec.P.circularOrbitalVelocity;
  var freeFallVelocity = Lec.P.freeFallVelocity || Lec.P.freeFallSpeed;
  var state = { trace: [], mode: 'impact', frame: 0, progress: 0, flash: 0 };
  var colours = {};
  var layout = {};

  function fmt(value, digits) {
    return Number(value).toFixed(digits);
  }

  function calculate() {
    var altitudeKm = Number(heightRange.value);
    var altitudeM = Lec.P.kilometresToMetres(altitudeKm);
    var speed = Number(speedRange.value);
    var radiusM = earthRadiusM + altitudeM;
    var target = orbitalVelocity(Lec.K.earth.mass, radiusM);
    var period = Lec.P.orbitalPeriod(Lec.K.earth.mass, radiusM);
    var gravity = Lec.P.gravityAtAltitude(Lec.P.surfaceGravity(Lec.K.earth.mass, earthRadiusM), earthRadiusM, altitudeM);
    var ratio = speed / target;

    state.values = {
      altitudeKm: Lec.P.metresToKilometres(altitudeM),
      speed: speed,
      target: target,
      periodMin: Lec.P.convert(period, 'second', 'minute'),
      delta: speed - target,
      gravity: gravity,
      fallDistance: Lec.P.freeFallDistance(1, gravity),
      fallSpeed: freeFallVelocity(1, gravity),
      ratio: ratio
    };

    state.mode = ratio >= 0.985 && ratio <= 1.015 ? 'orbit' : (ratio > 1.12 ? 'high' : 'impact');
    buildMatterTrace();
    state.frame = 0;
    state.progress = Deck.reduced() ? 1 : 0;
    state.flash = 0;
    updateText();
    updateSteps();
    draw();
  }

  function buildMatterTrace() {
    var Engine = Matter.Engine;
    var Bodies = Matter.Bodies;
    var Body = Matter.Body;
    var Composite = Matter.Composite;
    var Events = Matter.Events;
    var engine = Engine.create({ gravity: { x: 0, y: 0 } });
    var r = layout.earthR;
    var altitudePx = 42 + (state.values.altitudeKm - 200) / 600 * 52;
    var startRadius = r + altitudePx;
    var craft = Bodies.circle(layout.cx, layout.cy - startRadius, 4, {
      frictionAir: 0,
      friction: 0,
      restitution: 0.32,
      inertia: Infinity,
      collisionFilter: { group: -1 }
    });
    var surface = Bodies.circle(layout.cx, layout.cy, r, {
      isStatic: true,
      isSensor: true
    });
    var circularStepSpeed = 2.18 * Math.sqrt(startRadius / (r + 76));
    Body.setVelocity(craft, { x: circularStepSpeed * state.values.ratio, y: 0 });
    Composite.add(engine.world, [surface, craft]);

    var collided = false;
    Events.on(engine, 'collisionStart', function (event) {
      if (event.pairs.length) collided = true;
    });

    var delta = 1000 / 120;
    var baseAccel = circularStepSpeed * circularStepSpeed / startRadius;
    var maxSteps = 1180;
    var trace = [];
    var angleTravel = 0;
    var previousAngle = -Math.PI / 2;

    for (var i = 0; i < maxSteps; i += 1) {
      var dx = layout.cx - craft.position.x;
      var dy = layout.cy - craft.position.y;
      var distance = Math.max(1, Math.sqrt(dx * dx + dy * dy));
      var accel = baseAccel * startRadius * startRadius / (distance * distance);
      Body.applyForce(craft, craft.position, {
        x: craft.mass * accel * dx / distance / (delta * delta),
        y: craft.mass * accel * dy / distance / (delta * delta)
      });
      Engine.update(engine, delta);

      var angle = Math.atan2(craft.position.y - layout.cy, craft.position.x - layout.cx);
      var change = angle - previousAngle;
      if (change < -Math.PI) change += Math.PI * 2;
      if (change > Math.PI) change -= Math.PI * 2;
      angleTravel += Math.max(0, change);
      previousAngle = angle;
      trace.push({
        x: craft.position.x,
        y: craft.position.y,
        vx: craft.velocity.x,
        vy: craft.velocity.y,
        angleTravel: angleTravel
      });

      if (collided || distance <= r + 3 || distance > Math.max(scene.clientWidth, scene.clientHeight) * 0.78 || angleTravel >= Math.PI * 2) break;
    }

    state.trace = trace;
    state.completed = angleTravel >= Math.PI * 1.96 && !collided;
    if (state.mode === 'orbit' && !state.completed) state.mode = 'impact';
  }

  function measure() {
    layout.w = scene.clientWidth;
    layout.h = scene.clientHeight;
    layout.cx = Math.round(layout.w * 0.46);
    layout.cy = Math.round(layout.h * 0.57);
    layout.earthR = Math.round(Math.min(layout.h * 0.40, layout.w * 0.24));
    var earthField = document.getElementById('earthField');
    var diameter = layout.earthR * 2;
    earthField.style.width = diameter + 'px';
    earthField.style.height = diameter + 'px';
    earthField.style.left = (layout.cx - layout.earthR) + 'px';
    earthField.style.top = (layout.cy - layout.earthR) + 'px';
    var heightScale = document.getElementById('heightScale');
    heightScale.style.left = (layout.cx - 92) + 'px';
    heightScale.style.top = Math.max(68, layout.cy - layout.earthR - 118) + 'px';
  }

  function updateText() {
    var v = state.values;
    var speedKm = Lec.P.convert(v.speed, 'metre', 'kilometre');
    var targetKm = Lec.P.convert(v.target, 'metre', 'kilometre');
    var deltaKm = Lec.P.convert(v.delta, 'metre', 'kilometre');
    document.getElementById('heightReadout').textContent = fmt(v.altitudeKm, 0) + ' km';
    document.getElementById('speedReadout').textContent = fmt(speedKm, 2) + ' km/s';
    document.getElementById('deltaReadout').textContent = (deltaKm >= 0 ? '+' : '') + fmt(deltaKm, 2) + ' km/s';
    document.getElementById('heightOutput').textContent = fmt(v.altitudeKm, 0) + ' km';
    document.getElementById('speedOutput').textContent = fmt(speedKm, 2) + ' km/s';
    document.getElementById('targetSpeed').textContent = fmt(targetKm, 2) + ' km/s';
    document.getElementById('periodReadout').textContent = fmt(v.periodMin, 0) + ' min';
    document.getElementById('fallDistance').textContent = fmt(v.fallDistance, 1) + ' m';
    document.getElementById('fallSpeed').textContent = fmt(v.fallSpeed, 1) + ' m/s';

    var status = document.getElementById('status');
    status.dataset.mode = state.mode;
    status.textContent = state.mode === 'orbit'
      ? '持续错过地面：轨道成立'
      : (state.mode === 'high' ? '速度过高：当前路径不再闭合' : '横向速度不足：下落路径先遇到地面');
  }

  function updateProgress() {
    var pct = Math.round(state.progress * 100);
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressText').textContent = pct + '%';
  }

  function updateSteps() {
    var active = Math.min(5, Math.floor(state.progress * 6));
    steps.forEach(function (step, index) {
      step.classList.toggle('is-current', state.progress < 1 && index === active);
      step.classList.toggle('is-done', index < active || state.progress >= 1);
    });
    updateProgress();
  }

  function placeLabel(el, x, y) {
    el.style.left = Deck.clamp(x, 8, layout.w - el.offsetWidth - 8) + 'px';
    el.style.top = Deck.clamp(y, 8, layout.h - el.offsetHeight - 8) + 'px';
  }

  function drawArrow(ctx, x1, y1, x2, y2, color, width) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = width;
    Deck.arrow(ctx, x1, y1, x2, y2, 8);
    ctx.stroke();
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    if (!state.trace.length) return;
    var ctx = Deck.fit(canvas);
    ctx.clearRect(0, 0, layout.w, layout.h);

    ctx.save();
    var visibleCount = state.progress >= 1 ? state.trace.length : Math.max(1, Math.floor(state.trace.length * state.progress));
    ctx.beginPath();
    ctx.moveTo(layout.cx, layout.cy - (layout.earthR + 42 + (state.values.altitudeKm - 200) / 600 * 52));
    for (var i = 0; i < visibleCount; i += 1) ctx.lineTo(state.trace[i].x, state.trace[i].y);
    ctx.strokeStyle = state.completed && state.progress >= 1 ? colours.primary : colours.primaryLine;
    ctx.lineWidth = state.completed && state.progress >= 1 ? 2.5 : 2;
    ctx.stroke();

    var point = state.trace[Math.max(0, visibleCount - 1)];
    var dx = layout.cx - point.x;
    var dy = layout.cy - point.y;
    var dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    var speedMag = Math.max(0.01, Math.sqrt(point.vx * point.vx + point.vy * point.vy));

    drawArrow(ctx, point.x, point.y, point.x + point.vx / speedMag * 58, point.y + point.vy / speedMag * 58, colours.accent, 2);
    drawArrow(ctx, point.x, point.y, point.x + dx / dist * 50, point.y + dy / dist * 50, colours.primary, 2);

    ctx.save();
    ctx.translate(point.x, point.y);
    ctx.rotate(Math.atan2(point.vy, point.vx));
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(-7, -6);
    ctx.lineTo(-4, 0);
    ctx.lineTo(-7, 6);
    ctx.closePath();
    ctx.fillStyle = '#111417';
    ctx.fill();
    ctx.strokeStyle = state.completed && state.progress >= 1 ? colours.accent : colours.text;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.restore();

    var startY = layout.cy - (layout.earthR + 42 + (state.values.altitudeKm - 200) / 600 * 52);
    ctx.setLineDash([4, 5]);
    ctx.strokeStyle = colours.textMuted;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(layout.cx - 32, layout.cy - layout.earthR);
    ctx.lineTo(layout.cx - 32, startY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(layout.cx - 38, layout.cy - layout.earthR);
    ctx.lineTo(layout.cx - 26, layout.cy - layout.earthR);
    ctx.moveTo(layout.cx - 38, startY);
    ctx.lineTo(layout.cx - 26, startY);
    ctx.stroke();

    if (state.flash > 0 && state.mode === 'impact') {
      ctx.beginPath();
      ctx.arc(point.x, point.y, 11 + state.flash * 12, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(242,184,75,' + state.flash + ')';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    ctx.restore();

    placeLabel(document.getElementById('velocityLabel'), point.x + point.vx / speedMag * 62, point.y + point.vy / speedMag * 62 - 10);
    placeLabel(document.getElementById('gravityLabel'), point.x + dx / dist * 54, point.y + dy / dist * 54);
    placeLabel(document.getElementById('heightLabel'), layout.cx - 118, (startY + layout.cy - layout.earthR) / 2 - 12);
  }

  function reset() {
    heightRange.value = String(Lec.P.metresToKilometres(issAltitudeM));
    speedRange.value = '6000';
    calculate();
  }

  heightRange.addEventListener('input', calculate);
  speedRange.addEventListener('input', calculate);
  resetButton.addEventListener('click', reset);

  Deck.autofit(canvas, function () {
    measure();
    colours = {
      primary: Deck.token('--primary'),
      primaryLine: Deck.rgba('--primary', 0.62),
      primaryFaint: Deck.rgba('--primary', 0.16),
      accent: Deck.token('--accent'),
      text: Deck.token('--text'),
      textMuted: Deck.token('--text-muted')
    };
    calculate();
  });

  Deck.loop(function (time, dt) {
    if (!state.trace.length || state.progress >= 1) return;
    var duration = state.mode === 'orbit' ? 5200 : 3100;
    state.progress = Math.min(1, state.progress + dt / duration);
    if (state.progress >= 1 && state.mode === 'impact') state.flash = 1;
    updateSteps();
    draw();
    if (state.flash > 0) state.flash = Math.max(0, state.flash - dt / 260);
  }, { still: 1 });
}());
</script>
</body>
</html>
