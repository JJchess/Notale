<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --bg: #111417;
  --text: #edf2f0;
  --font-sans: Inter, "Noto Sans SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
  --motion-ui: 180ms;
  --motion-scene: 520ms;
  --ease-out: cubic-bezier(.22,.72,.22,1);
}
#main { padding-top: 32px; padding-bottom: 28px; }
.lesson { height: 100%; gap: 14px; }
.predict-bar {
  display: grid;
  grid-template-columns: 230px minmax(0, 1fr) 170px;
  align-items: center;
  gap: 16px;
  min-height: 58px;
}
.predict-copy { min-width: 0; }
.predict-copy strong { display: block; font-size: var(--fs-sec); line-height: 1.4; }
.predict-copy span { color: var(--text-secondary); font-size: var(--fs-label); line-height: 1.35; }
.prediction-slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; min-width: 0; }
.prediction-slot {
  display: flex;
  align-items: center;
  min-width: 0;
  min-height: 48px;
  padding: 5px;
  background: #141a1c;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-sm);
}
.prediction-slot::before {
  flex: 0 0 30px;
  color: var(--text-muted);
  content: attr(data-rank);
  font-family: var(--font-mono);
  font-size: var(--fs-tick);
  line-height: 1.35;
  text-align: center;
}
.world-chip {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 36px;
  padding: 0 10px;
  color: var(--text);
  background: var(--surface-soft);
  border: 1px solid var(--primary-line);
  cursor: grab;
  transition: transform var(--motion-ui) var(--ease-out), border-color var(--motion-ui) ease;
}
.world-chip:active { cursor: grabbing; }
.world-chip.is-picked { color: var(--bg); background: var(--primary); }
.prediction-slot.is-wrong .world-chip { border-color: var(--danger); animation: reject 260ms ease-out; }
.predict-actions { justify-content: flex-end; }
.icon-button { width: 44px; padding: 0; font-size: 22px; }
.icon-button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
.status { min-width: 92px; color: var(--text-secondary); font-size: var(--fs-label); line-height: 1.35; text-align: right; }
.experiment {
  position: relative;
  height: 282px;
  overflow: hidden;
  background: #101518;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
}
.experiment canvas { display: block; }
.world-heads {
  position: absolute;
  z-index: 3;
  top: 0;
  right: 0;
  left: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  pointer-events: none;
}
.world-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  min-width: 0;
  padding: 12px 18px;
  background: rgba(17, 20, 23, .78);
  border-right: 1px solid var(--line);
}
.world-head:last-child { border-right: 0; }
.world-name { font-size: var(--fs-h2); font-weight: 700; line-height: 1.25; }
.gravity-label { color: var(--text-secondary); font-family: var(--font-mono); font-size: var(--fs-label); line-height: 1.35; }
.world-timer {
  position: absolute;
  z-index: 4;
  top: 57px;
  width: 120px;
  margin-left: -60px;
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: var(--fs-lead);
  font-weight: 700;
  line-height: 1.35;
  text-align: center;
  pointer-events: none;
}
.world-timer[data-i="0"] { left: 16.666%; }
.world-timer[data-i="1"] { left: 50%; }
.world-timer[data-i="2"] { left: 83.333%; }
.world-timer.landed::after { display: block; color: var(--text-secondary); content: "触地"; font-family: var(--font-sans); font-size: var(--fs-label); font-weight: 500; }
.scene-divider { position: absolute; z-index: 2; top: 50px; bottom: 0; width: 1px; background: var(--line); pointer-events: none; }
.scene-divider.one { left: 33.333%; }
.scene-divider.two { left: 66.666%; }
.k-comparison.metrics {
  --compare-cols: 3;
  grid-template-columns: 154px repeat(3, minmax(0, 1fr));
  overflow: visible;
  background: transparent;
}
.metrics::after { left: 154px; }
.metrics > .hdr { min-height: 38px; padding: 7px 14px; align-items: center; }
.metrics > .hdr:first-child { color: var(--text-secondary); }
.metrics > .dim,
.metrics > .cell { min-height: 38px; padding: 7px 14px; }
.metrics > .cell { display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: var(--fs-sec); }
.metrics > .dim { justify-content: flex-start; text-align: left; }
.metrics > .mass-cell { color: var(--primary); background: var(--primary-soft); }
.metrics > .diff { color: var(--accent); }
.metrics > :nth-child(3n) { border-right-color: var(--line); }
.metrics > :nth-child(4n) { border-right-color: transparent; }
.mass-bridge { position: absolute; z-index: 2; top: 93px; right: 4%; left: 15%; height: 1px; background: var(--primary); pointer-events: none; }
.takeaway {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 24px;
  min-height: 50px;
  padding: 8px 14px 8px 18px;
  background: var(--surface-soft);
  border-left: 4px solid var(--primary);
}
.takeaway p { font-size: var(--fs-sec); line-height: var(--lh-sec); }
.takeaway strong { color: var(--primary); }
.correction { color: var(--accent); white-space: nowrap; }
.world-landed { box-shadow: inset 0 -3px 0 var(--accent); }
@keyframes reject { 0%,100% { transform: translateX(0); } 35% { transform: translateX(-8px); } 70% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}
</style>
</head>
<body data-page="29" data-total="44">
<div id="stage">
<main id="main">
  <section class="lesson col min0" aria-label="同一个人在三种重力下的对照实验">
    <div class="predict-bar min0">
      <div class="predict-copy">
        <strong>预测落地顺序</strong>
        <span>从先到后放入三个天体</span>
      </div>
      <div class="prediction-slots min0" id="predictionSlots" aria-label="预计落地顺序">
        <div class="prediction-slot min0" data-rank="1" data-slot="0"></div>
        <div class="prediction-slot min0" data-rank="2" data-slot="1"></div>
        <div class="prediction-slot min0" data-rank="3" data-slot="2"></div>
      </div>
      <div class="predict-actions ctl min0">
        <span class="status" id="status" aria-live="polite">已排 0 / 3</span>
        <button class="primary" id="jumpBtn" disabled>同时起跳</button>
        <button class="icon-button" id="resetBtn" title="重置" aria-label="重置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
    </div>

    <figure class="experiment min0" id="experiment" aria-label="地球、火星和月球上相同人物同步起跳的三维对照">
      <canvas id="scene" class="cv-fill" aria-hidden="true"></canvas>
      <div class="world-heads">
        <div class="world-head"><span class="world-name">地球</span><span class="gravity-label" id="g-earth"></span></div>
        <div class="world-head"><span class="world-name">火星</span><span class="gravity-label" id="g-mars"></span></div>
        <div class="world-head"><span class="world-name">月球</span><span class="gravity-label" id="g-moon"></span></div>
      </div>
      <div class="world-timer" data-i="0">0.00 s</div>
      <div class="world-timer" data-i="1">0.00 s</div>
      <div class="world-timer" data-i="2">0.00 s</div>
      <div class="scene-divider one"></div><div class="scene-divider two"></div>
    </figure>

    <div class="k-comparison metrics min0" id="metrics" aria-label="质量、重量和落地时间的三列对照">
      <div class="hdr">同一人物</div><div class="hdr">地球</div><div class="hdr">火星</div><div class="hdr">月球</div>
      <div class="rowline"></div>
      <div class="dim">质量</div><div class="cell mass-cell" id="mass-earth"></div><div class="cell mass-cell" id="mass-mars"></div><div class="cell mass-cell" id="mass-moon"></div>
      <div class="rowline"></div>
      <div class="dim">重量</div><div class="cell diff" id="weight-earth"></div><div class="cell diff" id="weight-mars"></div><div class="cell diff" id="weight-moon"></div>
      <div class="rowline"></div>
      <div class="dim">起跳至落地</div><div class="cell diff" id="time-earth"></div><div class="cell diff" id="time-mars"></div><div class="cell diff" id="time-moon"></div>
      <div class="mass-bridge" aria-hidden="true"></div>
    </div>

    <div class="takeaway min0">
      <p><strong>换天体，质量不变。</strong>重力改变重量，也改变跳起后回到地面的时间。</p>
      <p class="correction" id="feedback">跳得更高、落得更慢，不等于肌肉变强。</p>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/three.min.js"></script>
<script>
Lec.mount({
  index: 29,
  kicker: "E5 · GRAVITY IS CONTEXT",
  title: "质量没有变，重量和落地时间变了",
  take: "换一个天体，同一个人的质量不变；改变的是重力产生的重量，以及跳起后回到地面的时间。"
});

(function () {
  'use strict';

  if (typeof Lec.K.G_EARTH !== 'number') Lec.K.G_EARTH = Lec.K.g0;
  if (typeof Lec.K.MOON_G_RATIO !== 'number') Lec.K.MOON_G_RATIO = Lec.P.earthMoonWeightRatio();
  if (typeof Lec.K.MARS_G_RATIO !== 'number') Lec.K.MARS_G_RATIO = Lec.P.earthMarsWeightRatio();

  var model = { massKg: 60, launchSpeed: 4, running: false, elapsed: 0 };
  var worlds = [
    { id: 'earth', name: '地球', g: Lec.K.G_EARTH, x: -6.2, color: 0x55c2b0 },
    { id: 'mars', name: '火星', g: Lec.K.G_EARTH * Lec.K.MARS_G_RATIO, x: 0, color: 0xc97955 },
    { id: 'moon', name: '月球', g: Lec.K.G_EARTH * Lec.K.MOON_G_RATIO, x: 6.2, color: 0xbcc8c5 }
  ];
  worlds.forEach(function (w) {
    w.weight = Lec.P.weight(model.massKg, w.g);
    w.apex = Lec.P.projectileHeight(model.launchSpeed, 90, w.g);
    w.fallTime = Lec.P.freeFallTime(w.apex, w.g);
    w.totalTime = w.fallTime * 2;
    w.landed = false;
  });

  function fmt(value, digits) { return Number(value).toFixed(digits); }
  worlds.forEach(function (w) {
    document.getElementById('g-' + w.id).textContent = fmt(w.g, 2) + ' m/s²';
    document.getElementById('mass-' + w.id).textContent = fmt(model.massKg, 0) + ' kg';
    document.getElementById('weight-' + w.id).textContent = fmt(w.weight, 1) + ' N';
    document.getElementById('time-' + w.id).textContent = fmt(w.totalTime, 2) + ' s';
  });

  var slots = Array.prototype.slice.call(document.querySelectorAll('.prediction-slot'));
  var statusEl = document.getElementById('status');
  var feedbackEl = document.getElementById('feedback');
  var defaultFeedback = '跳得更高、落得更慢，不等于肌肉变强。';
  var jumpBtn = document.getElementById('jumpBtn');
  var resetBtn = document.getElementById('resetBtn');
  var selectedChip = null;
  var initialOrder = ['moon', 'earth', 'mars'];

  function makeChip(id) {
    var world = worlds.filter(function (w) { return w.id === id; })[0];
    var b = document.createElement('button');
    b.className = 'world-chip';
    b.type = 'button';
    b.draggable = true;
    b.dataset.world = id;
    b.textContent = world.name;
    b.setAttribute('aria-label', world.name + '，拖动或用方向键调整顺序');
    b.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', id); });
    b.addEventListener('click', function () {
      if (!selectedChip) {
        selectedChip = b;
        b.classList.add('is-picked');
      } else if (selectedChip !== b) {
        swapChips(selectedChip, b);
        selectedChip.classList.remove('is-picked');
        selectedChip = null;
      } else {
        b.classList.remove('is-picked');
        selectedChip = null;
      }
    });
    b.addEventListener('keydown', function (e) {
      var slot = b.parentElement;
      var index = slots.indexOf(slot);
      var next = e.key === 'ArrowLeft' ? index - 1 : e.key === 'ArrowRight' ? index + 1 : index;
      if (next !== index && slots[next]) {
        e.preventDefault();
        var other = slots[next].querySelector('.world-chip');
        swapChips(b, other);
        b.focus();
      }
    });
    return b;
  }

  function swapChips(a, b) {
    if (!a || !b) return;
    var aSlot = a.parentElement;
    var bSlot = b.parentElement;
    aSlot.appendChild(b);
    bSlot.appendChild(a);
    clearWrong();
    updatePredictionStatus();
  }

  slots.forEach(function (slot) {
    slot.addEventListener('dragover', function (e) { e.preventDefault(); });
    slot.addEventListener('drop', function (e) {
      e.preventDefault();
      var dragged = document.querySelector('[data-world="' + e.dataTransfer.getData('text/plain') + '"]');
      var other = slot.querySelector('.world-chip');
      swapChips(dragged, other);
    });
  });

  function clearWrong() {
    slots.forEach(function (s) { s.classList.remove('is-wrong'); });
    feedbackEl.textContent = defaultFeedback;
  }

  function updatePredictionStatus() {
    statusEl.textContent = '已排 3 / 3';
    jumpBtn.disabled = false;
  }

  function renderInitialOrder() {
    slots.forEach(function (slot, i) {
      slot.innerHTML = '';
      slot.appendChild(makeChip(initialOrder[i]));
    });
    statusEl.textContent = '已排 3 / 3';
    jumpBtn.disabled = false;
  }

  var experiment = document.getElementById('experiment');
  var canvas = document.getElementById('scene');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x101518);
  scene.fog = new THREE.Fog(0x101518, 9, 19);
  var camera = new THREE.PerspectiveCamera(36, 1, 0.1, 50);
  camera.position.set(0, 4.8, 16.8);
  camera.lookAt(0, 2.8, 0);
  scene.add(new THREE.HemisphereLight(0xdde8e5, 0x172022, 1.7));
  var key = new THREE.DirectionalLight(0xffffff, 2.4);
  key.position.set(-4, 9, 7);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.left = -10; key.shadow.camera.right = 10;
  key.shadow.camera.top = 9; key.shadow.camera.bottom = -3;
  scene.add(key);

  function createPerson(color) {
    var group = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: color, roughness: .55, metalness: .08 });
    var jointMat = new THREE.MeshStandardMaterial({ color: 0xedf2f0, roughness: .65 });
    var torso = new THREE.Mesh(new THREE.CapsuleGeometry(.28, .72, 5, 10), mat);
    torso.position.y = 1.48; torso.castShadow = true; group.add(torso);
    var head = new THREE.Mesh(new THREE.SphereGeometry(.25, 18, 14), jointMat);
    head.position.y = 2.28; head.castShadow = true; group.add(head);
    function limb(x, y, h, angle) {
      var m = new THREE.Mesh(new THREE.CapsuleGeometry(.105, h, 4, 8), mat);
      m.position.set(x, y, 0); m.rotation.z = angle; m.castShadow = true; group.add(m);
    }
    limb(-.2, .63, .62, -.08); limb(.2, .63, .62, .08);
    limb(-.43, 1.45, .58, -.25); limb(.43, 1.45, .58, .25);
    return group;
  }

  worlds.forEach(function (w, index) {
    var floorMat = new THREE.MeshStandardMaterial({ color: w.color, roughness: .92 });
    var floor = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 2.0, .22, 48), floorMat);
    floor.position.set(w.x, .02, 0); floor.receiveShadow = true; scene.add(floor);
    var arc = new THREE.Mesh(
      new THREE.TorusGeometry(1.16, .018, 6, 56, Math.PI * 1.45),
      new THREE.MeshBasicMaterial({ color: 0x55c2b0, transparent: true, opacity: .52 })
    );
    arc.position.set(w.x, 1.25, -.12); arc.rotation.z = -.72; scene.add(arc);
    w.person = createPerson(0x55c2b0); w.person.position.set(w.x, .13, 0); scene.add(w.person);
    var pts = [];
    for (var j = 0; j <= 24; j++) {
      var t = w.totalTime * j / 24;
      var y;
      if (t <= w.fallTime) y = model.launchSpeed * t - Lec.P.freeFallDistance(t, w.g);
      else y = w.apex - Lec.P.freeFallDistance(t - w.fallTime, w.g);
      pts.push(new THREE.Vector3(w.x - .62, .22 + Math.max(0, y), -.3));
    }
    var traj = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineDashedMaterial({ color: 0xf2b84b, dashSize: .11, gapSize: .08, transparent: true, opacity: 0 })
    );
    traj.computeLineDistances(); scene.add(traj); w.trajectory = traj;
    w.timer = document.querySelector('.world-timer[data-i="' + index + '"]');
  });

  function resizeRenderer() {
    var width = experiment.clientWidth;
    var height = experiment.clientHeight;
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
  }
  Deck.onResize(resizeRenderer);
  resizeRenderer();

  function positionAt(w, t) {
    if (t >= w.totalTime) return 0;
    if (t <= w.fallTime) return model.launchSpeed * t - Lec.P.freeFallDistance(t, w.g);
    var descent = t - w.fallTime;
    Lec.P.freeFallSpeed(descent, w.g);
    return Math.max(0, w.apex - Lec.P.freeFallDistance(descent, w.g));
  }

  function setExperimentState(t) {
    var landedCount = 0;
    worlds.forEach(function (w, i) {
      var local = Math.min(t, w.totalTime);
      var y = positionAt(w, local);
      w.person.position.y = .13 + y;
      w.person.scale.y = t >= w.totalTime && t < w.totalTime + .16 ? .93 : 1;
      w.timer.textContent = fmt(local, 2) + ' s';
      if (t >= w.totalTime) {
        landedCount += 1;
        if (!w.landed) {
          w.landed = true;
          w.timer.classList.add('landed');
          document.querySelectorAll('.world-head')[i].classList.add('world-landed');
        }
      }
    });
    statusEl.textContent = '已落地 ' + landedCount + ' / 3';
  }

  var stopLoop = null;
  function runJump() {
    model.running = true;
    model.elapsed = 0;
    worlds.forEach(function (w) {
      w.landed = false;
      w.trajectory.material.opacity = .78;
      w.timer.classList.remove('landed');
    });
    document.querySelectorAll('.world-head').forEach(function (h) { h.classList.remove('world-landed'); });
    jumpBtn.disabled = true;
    var maxTime = Math.max.apply(null, worlds.map(function (w) { return w.totalTime; }));
    if (Deck.reduced()) {
      setExperimentState(maxTime + .2);
      renderer.render(scene, camera);
      model.running = false;
      return;
    }
    stopLoop = Deck.loop(function (time, dt) {
      model.elapsed += dt;
      setExperimentState(model.elapsed);
      renderer.render(scene, camera);
      if (model.elapsed >= maxTime + .22) {
        model.running = false;
        jumpBtn.disabled = false;
        if (stopLoop) stopLoop();
      }
    });
  }

  jumpBtn.addEventListener('click', function () {
    if (model.running) return;
    var order = slots.map(function (s) { return s.querySelector('.world-chip').dataset.world; });
    var correct = ['earth', 'mars', 'moon'];
    var wrong = [];
    order.forEach(function (id, i) { if (id !== correct[i]) wrong.push(i); });
    if (wrong.length) {
      wrong.forEach(function (i) { slots[i].classList.add('is-wrong'); });
      statusEl.textContent = '顺序不对';
      feedbackEl.textContent = '顺序只由天体重力决定，不由人物质量决定。';
      return;
    }
    clearWrong();
    runJump();
  });

  resetBtn.addEventListener('click', function () {
    if (stopLoop) stopLoop();
    model.running = false;
    worlds.forEach(function (w) {
      w.person.position.y = .13;
      w.person.scale.y = 1;
      w.landed = false;
      w.trajectory.material.opacity = 0;
      w.timer.textContent = '0.00 s';
      w.timer.classList.remove('landed');
    });
    document.querySelectorAll('.world-head').forEach(function (h) { h.classList.remove('world-landed'); });
    renderInitialOrder();
    renderer.render(scene, camera);
  });

  renderInitialOrder();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
