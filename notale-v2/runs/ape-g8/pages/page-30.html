<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main {
    --plate-line: rgba(188, 200, 197, 0.34);
    --plate-faint: rgba(188, 200, 197, 0.1);
    --connected: var(--primary);
    padding-top: 32px;
    padding-bottom: 32px;
  }

  .page-shell {
    display: flex;
    flex-direction: column;
    gap: 18px;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
  }

  .page-intro {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 28px;
    min-width: 0;
  }

  .intro-copy {
    min-width: 0;
  }

  .intro-copy h1 {
    margin-bottom: 5px;
  }

  .intro-copy p {
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
  }

  .progress-block {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 0 0 auto;
    min-width: 324px;
    padding-bottom: 3px;
  }

  .progress-copy {
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: var(--fs-sec);
    line-height: 1.45;
    white-space: nowrap;
  }

  #progressCount {
    color: var(--accent);
    font-weight: 700;
  }

  .progress-ticks {
    display: flex;
    gap: 5px;
    flex: 1 1 auto;
  }

  .progress-ticks i {
    display: block;
    width: 22px;
    height: 8px;
    background: var(--surface-strong);
    border: 1px solid var(--line-strong);
    transition: background-color 180ms ease, border-color 180ms ease;
  }

  .progress-ticks i.on {
    background: var(--primary);
    border-color: var(--primary);
  }

  .reset-button {
    display: none;
    width: 42px;
    min-width: 42px;
    height: 42px;
    padding: 0;
  }

  .reset-button.show {
    display: inline-flex;
  }

  .reset-button svg {
    width: 20px;
    height: 20px;
  }

  .workspace {
    position: relative;
    display: flex;
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background-color: #151a1c;
    background-image:
      linear-gradient(var(--plate-faint) 1px, transparent 1px),
      linear-gradient(90deg, var(--plate-faint) 1px, transparent 1px);
    background-size: 32px 32px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
  }

  .condition-zone {
    position: relative;
    z-index: 4;
    flex: 0 0 380px;
    box-sizing: border-box;
    min-width: 0;
    padding: 18px 20px;
    background: rgba(26, 32, 34, 0.96);
    border-right: 1px solid var(--line-strong);
    outline: none;
  }

  .condition-zone:focus-visible {
    box-shadow: inset 0 0 0 3px var(--focus);
  }

  .zone-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .zone-label strong {
    color: var(--text-secondary);
    font-size: var(--fs-label);
  }

  .condition-list.k-enumeration {
    --enum-cols: 1;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .condition-list.k-enumeration > .it {
    grid-template-columns: 30px 74px minmax(0, 1fr);
    align-items: center;
    gap: 9px;
    min-height: 58px;
    padding: 6px 10px;
    cursor: grab;
    touch-action: none;
    user-select: none;
    transition: border-color 150ms ease, background-color 150ms ease, opacity 150ms ease;
  }

  .condition-list.k-enumeration > .it::before {
    width: 28px;
    height: 28px;
    font-size: var(--fs-tick);
  }

  .condition-list.k-enumeration > .it > .it-title {
    font-size: var(--fs-lead);
  }

  .condition-list.k-enumeration > .it > .it-body {
    grid-column: 3;
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    line-height: 1.42;
  }

  .condition-list .it.selected {
    background: var(--accent-soft);
    border-color: var(--accent);
  }

  .condition-list .it.dragging {
    z-index: 20;
    cursor: grabbing;
    border-color: var(--accent);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.42);
  }

  .condition-list .it.connected {
    color: var(--primary);
    background: var(--primary-soft);
    border-color: var(--primary-line);
  }

  .condition-list .it.connected::before {
    color: var(--bg);
    background: var(--primary);
    border-color: var(--primary);
  }

  .condition-list .it.shake {
    animation: reject 280ms ease;
  }

  @keyframes reject {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-9px); }
    55% { transform: translateX(8px); }
    78% { transform: translateX(-4px); }
  }

  .diagram-zone {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .cabin-volume {
    position: absolute;
    z-index: 0;
    top: 11%;
    left: 13%;
    width: 76%;
    height: 77%;
    background: var(--surface-strong);
    border: 1px solid var(--line-strong);
    clip-path: polygon(14% 0, 86% 0, 100% 14%, 100% 86%, 86% 100%, 14% 100%, 0 86%, 0 14%);
  }

  .boundary-caption {
    position: absolute;
    z-index: 3;
    color: var(--text-secondary);
    background: #151a1c;
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .boundary-caption.outside { top: 18px; right: 22px; }
  .boundary-caption.inside { top: 56px; left: 44%; color: var(--primary); }

  .service-bay {
    position: absolute;
    z-index: 1;
    top: 25%;
    box-sizing: border-box;
    width: 19%;
    height: 43%;
    background: #111719;
    border: 2px solid var(--line-strong);
    border-top: 6px solid var(--primary-line);
  }

  .service-bay.left { left: 12%; }
  .service-bay.right { right: 9%; }

  .service-bay::before,
  .service-bay::after {
    position: absolute;
    right: 12px;
    left: 12px;
    height: 28%;
    content: "";
    background: var(--surface-strong);
    border: 1px solid var(--line-strong);
  }

  .service-bay::before { top: 14%; }
  .service-bay::after { bottom: 14%; }

  .plate-meta {
    position: absolute;
    z-index: 3;
    top: 16px;
    left: 20px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .plate-meta span {
    color: var(--text-secondary);
  }

  .diagram-canvas {
    z-index: 0;
  }

  .diagram-svg {
    position: absolute;
    z-index: 2;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .hull, .module, .person, .detail, .earth, .boundary, .route {
    fill: none;
    vector-effect: non-scaling-stroke;
  }

  .hull-fill {
    fill: rgba(188, 200, 197, 0.045);
    stroke: none;
  }

  .module-fill {
    fill: rgba(85, 194, 176, 0.16);
    stroke: rgba(85, 194, 176, 0.4);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  .hull { stroke: rgba(237, 242, 240, 0.72); stroke-width: 2; }
  .module { stroke: var(--plate-line); stroke-width: 1.2; stroke-dasharray: 5 5; }
  .detail { stroke: rgba(188, 200, 197, 0.28); stroke-width: 1; }
  .person { stroke: rgba(237, 242, 240, 0.8); stroke-width: 1.8; }
  .earth { stroke: rgba(85, 194, 176, 0.34); stroke-width: 2; }
  .boundary { stroke: rgba(242, 184, 75, 0.5); stroke-width: 2; stroke-dasharray: 7 7; }
  .boundary.complete { stroke: var(--primary); stroke-dasharray: 0; filter: drop-shadow(0 0 7px rgba(85, 194, 176, 0.55)); }
  .route { stroke: rgba(188, 200, 197, 0.72); stroke-width: 3; stroke-dasharray: 7 5; transition: stroke 180ms ease; }
  .route.on { stroke: var(--primary); stroke-width: 2.3; stroke-dasharray: 0; filter: drop-shadow(0 0 5px rgba(85, 194, 176, 0.62)); }
  .route.pulse { stroke-dasharray: 9 7; animation: flow 550ms linear; }

  @keyframes flow { to { stroke-dashoffset: -32; } }

  .endpoint {
    position: absolute;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    color: var(--accent);
    background: #151a1c;
    border: 2px solid var(--accent);
    border-radius: 50%;
    font-family: var(--font-mono);
    font-size: var(--fs-tick);
    font-weight: 700;
    line-height: 1;
    transform: translate(-50%, -50%);
    transition: color 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
  }

  .endpoint.keyboard-target {
    box-shadow: 0 0 0 4px rgba(242, 184, 75, 0.22);
  }

  .endpoint.on {
    color: var(--bg);
    background: var(--primary);
    border-color: var(--primary);
  }

  .endpoint.error {
    color: var(--danger);
    border-color: var(--danger);
    box-shadow: 0 0 0 5px rgba(239, 117, 109, 0.2);
  }

  .system-label {
    position: absolute;
    z-index: 4;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    box-sizing: border-box;
    width: 220px;
    min-height: 98px;
    padding: 10px 14px;
    color: var(--text-muted);
    background: rgba(17, 20, 23, 0.9);
    border: 1px solid var(--line-strong);
    border-left: 3px solid var(--line-strong);
    font-size: var(--fs-label);
    line-height: 1.35;
    opacity: 0.78;
    transition: color 160ms ease, opacity 160ms ease, border-color 160ms ease;
  }

  .system-label strong {
    color: inherit;
    font-size: var(--fs-label);
  }

  .system-label.on {
    color: var(--primary);
    border-color: var(--primary);
    opacity: 1;
  }

  .habitable-field {
    position: absolute;
    z-index: 1;
    top: 50%;
    left: 59%;
    width: 274px;
    height: 340px;
    background: rgba(85, 194, 176, 0.055);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: background-color 180ms ease, box-shadow 180ms ease;
  }

  .habitable-field.complete {
    background: rgba(85, 194, 176, 0.13);
    box-shadow: inset 0 0 0 2px rgba(85, 194, 176, 0.34);
  }

  .relation-key {
    position: absolute;
    z-index: 5;
    top: 15%;
    left: 50%;
    display: flex;
    gap: 8px;
    color: var(--text-secondary);
    font-size: var(--fs-label);
    line-height: 1.35;
    transform: translateX(-50%);
  }

  .relation-key span {
    padding: 6px 10px;
    background: #111417;
    border-bottom: 2px solid var(--primary-line);
  }

  .environment-gauge {
    position: absolute;
    z-index: 3;
    right: 24px;
    bottom: 20px;
    left: 24px;
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 8px;
  }

  .environment-gauge span {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    color: var(--text-muted);
    background: rgba(17, 20, 23, 0.92);
    border: 1px solid var(--line-strong);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .environment-gauge span.on {
    color: var(--primary);
    border-color: var(--primary);
  }

  .center-status {
    position: absolute;
    z-index: 5;
    top: 50%;
    left: 59%;
    box-sizing: border-box;
    width: 210px;
    padding: 10px 12px;
    color: var(--text-secondary);
    background: rgba(17, 20, 23, 0.88);
    border: 1px solid var(--line-strong);
    font-size: var(--fs-sec);
    line-height: 1.45;
    text-align: center;
    transform: translate(-50%, -50%);
  }

  .center-status.complete {
    color: var(--primary);
    border-color: var(--primary);
    font-weight: 700;
  }

  .feedback {
    position: absolute;
    z-index: 8;
    right: 20px;
    bottom: 16px;
    max-width: 500px;
    min-height: 24px;
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    line-height: 1.45;
    text-align: right;
  }

  .feedback.error {
    color: var(--danger);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>

    var actions = {
      pressure: "密封舱壁已接入：持续守住压力边界。",
      oxygen: "气体接口已接入：供应氧气并监测舱内气体。",
      temperature: "热控管路已接入：收集热量并向舱外排热。",
      radiation: "外层防护已接入：监测暴露并降低累积剂量。",
      waste: "废物接口已接入：收集、隔离并处理废物。",
      food: "补给储存区已接入：保护并按任务周期提供食物。"
    };
    var connected = new Set();
    var selected = 0;
    var target = 0;
    var drag = null;
    var workspace = document.getElementById("workspace");
    var zone = document.getElementById("conditionZone");
    var items = Array.prototype.slice.call(document.querySelectorAll(".condition-list .it"));
    var endpoints = Array.prototype.slice.call(document.querySelectorAll(".endpoint"));
    var ticks = Array.prototype.slice.call(document.querySelectorAll(".progress-ticks i"));
    var gauge = Array.prototype.slice.call(document.querySelectorAll(".environment-gauge span"));
    var progress = document.getElementById("progressCount");
    var feedback = document.getElementById("feedback");
    var center = document.getElementById("centerStatus");
    var boundary = document.getElementById("environmentBoundary");
    var habitableField = document.getElementById("habitableField");
    var reset = document.getElementById("resetButton");
    var keyboardReadout = document.getElementById("keyboardReadout");
    var diagramCanvas = document.getElementById("diagramCanvas");

    Deck.autofit(diagramCanvas, function (ctx) {
      var w = diagramCanvas.clientWidth;
      var h = diagramCanvas.clientHeight;
      var primary = Deck.rgba("--primary", 0.16);
      var line = Deck.rgba("--text-secondary", 0.28);
      var strong = Deck.rgba("--text-secondary", 0.12);
      ctx.clearRect(0, 0, w, h);

      ctx.fillStyle = strong;
      ctx.beginPath();
      ctx.moveTo(w * 0.13, h * 0.22);
      ctx.lineTo(w * 0.25, h * 0.11);
      ctx.lineTo(w * 0.78, h * 0.11);
      ctx.lineTo(w * 0.9, h * 0.22);
      ctx.lineTo(w * 0.9, h * 0.78);
      ctx.lineTo(w * 0.78, h * 0.89);
      ctx.lineTo(w * 0.25, h * 0.89);
      ctx.lineTo(w * 0.13, h * 0.78);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = primary;
      [[0.18, 0.29], [0.68, 0.29], [0.18, 0.58], [0.68, 0.58]].forEach(function (box) {
        ctx.fillRect(w * box[0], h * box[1], w * 0.14, h * 0.16);
      });

      ctx.strokeStyle = line;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(w * 0.52, h * 0.5, w * 0.14, h * 0.35, 0, 0, Math.PI * 2);
      ctx.stroke();
      for (var i = 0; i < 6; i++) {
        var y = h * (0.19 + i * 0.127);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w * (0.16 + i * 0.035), y);
        ctx.stroke();
      }
    });

    function endpointCenter(ep) {
      var diagram = ep.parentElement;
      return {
        x: diagram.offsetLeft + ep.offsetLeft,
        y: diagram.offsetTop + ep.offsetTop
      };
    }

    function setSelection(nextItem, nextTarget) {
      selected = (nextItem + ids.length) % ids.length;
      target = (nextTarget + ids.length) % ids.length;
      items.forEach(function (item, i) { item.classList.toggle("selected", i === selected && !connected.has(ids[i])); });
      endpoints.forEach(function (ep, i) { ep.classList.toggle("keyboard-target", i === target && !connected.has(ids[i])); });
      keyboardReadout.textContent = "选择 " + String(selected + 1).padStart(2, "0") + " · 目标 " + String(target + 1).padStart(2, "0");
    }

    function render() {
      var count = connected.size;
      progress.textContent = count + " / 6";
      ticks.forEach(function (tick, i) { tick.classList.toggle("on", i < count); });
      gauge.forEach(function (mark, i) { mark.classList.toggle("on", connected.has(ids[i])); });
      items.forEach(function (item) { item.classList.toggle("connected", connected.has(item.dataset.id)); });
      endpoints.forEach(function (ep) { ep.classList.toggle("on", connected.has(ep.dataset.id)); });
      ids.forEach(function (id) {
        document.getElementById("route-" + id).classList.toggle("on", connected.has(id));
        document.querySelector('[data-label="' + id + '"]').classList.toggle("on", connected.has(id));
      });
      if (count === 6) {
        center.classList.add("complete");
        center.innerHTML = "6 项同时在线<br><span>可居住环境边界已建立</span>";
        boundary.classList.add("complete");
        habitableField.classList.add("complete");
        reset.classList.add("show");
        feedback.classList.remove("error");
        feedback.textContent = "六项共同接入同一环境边界。";
      } else {
        center.classList.remove("complete");
        center.innerHTML = "人体周围的环境边界<br><span>仍有 " + (6 - count) + " 项待接入</span>";
        boundary.classList.remove("complete");
        habitableField.classList.remove("complete");
        reset.classList.remove("show");
      }
      setSelection(selected, target);
    }

    function reject(itemId, endpointId) {
      var item = items[ids.indexOf(itemId)];
      var endpoint = endpoints[ids.indexOf(endpointId)];
      item.classList.remove("shake");
      void item.offsetWidth;
      item.classList.add("shake");
      endpoint.classList.add("error");
      feedback.classList.add("error");
      feedback.textContent = "这里处理的是" + names[endpointId] + "，不是" + names[itemId] + "。";
      window.setTimeout(function () {
        item.classList.remove("shake");
        endpoint.classList.remove("error");
      }, 420);
    }

    function connect(itemId, endpointId) {
      if (connected.has(itemId)) return;
      if (itemId !== endpointId) {
        reject(itemId, endpointId);
        return;
      }
      connected.add(itemId);
      feedback.classList.remove("error");
      feedback.textContent = actions[itemId];
      var route = document.getElementById("route-" + itemId);
      route.classList.add("pulse");
      window.setTimeout(function () { route.classList.remove("pulse"); }, 600);
      render();
    }

    function nearestEndpoint(point) {
      var best = null;
      var bestDistance = Infinity;
      endpoints.forEach(function (ep) {
        var c = endpointCenter(ep);
        var d = Math.hypot(point.x - c.x, point.y - c.y);
        if (d < bestDistance) { bestDistance = d; best = ep; }
      });
      return bestDistance < 58 ? best : null;
    }

    zone.addEventListener("pointerdown", function (event) {
      var item = event.target.closest(".it");
      if (!item || connected.has(item.dataset.id)) return;
      selected = ids.indexOf(item.dataset.id);
      setSelection(selected, target);
      var p = Deck.pt(workspace, event);
      drag = { item: item, startX: p.x, startY: p.y };
      item.classList.add("dragging");
      item.setPointerCapture(event.pointerId);
    });

    zone.addEventListener("pointermove", function (event) {
      if (!drag) return;
      var p = Deck.pt(workspace, event);
      drag.item.style.transform = "translate(" + (p.x - drag.startX) + "px," + (p.y - drag.startY) + "px)";
    });

    function finishDrag(event) {
      if (!drag) return;
      var p = Deck.pt(workspace, event);
      var endpoint = nearestEndpoint(p);
      var item = drag.item;
      item.classList.remove("dragging");
      item.style.transform = "";
      drag = null;
      if (endpoint) {
        target = ids.indexOf(endpoint.dataset.id);
        connect(item.dataset.id, endpoint.dataset.id);
      } else {
        feedback.classList.remove("error");
        feedback.textContent = "把标签放到一个编号端点上。";
      }
    }

    zone.addEventListener("pointerup", finishDrag);
    zone.addEventListener("pointercancel", function () {
      if (!drag) return;
      drag.item.classList.remove("dragging");
      drag.item.style.transform = "";
      drag = null;
    });

    zone.addEventListener("keydown", function (event) {
      if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        event.preventDefault();
        setSelection(selected + (event.key === "ArrowUp" ? -1 : 1), target);
      } else if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
        event.preventDefault();
        setSelection(selected, target + (event.key === "ArrowLeft" ? -1 : 1));
      } else if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        connect(ids[selected], ids[target]);
      }
    });

    reset.addEventListener("click", function () {
      connected.clear();
      selected = 0;
      target = 0;
      feedback.classList.remove("error");
      feedback.textContent = "六项没有先后次序，缺少任何一项都不是可居住环境。";
      render();
      zone.focus();
    });

    render();
  }());
</script>
</body>
</html>
