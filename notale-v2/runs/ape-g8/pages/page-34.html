<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#111417;--text:#edf2f0;--font-sans:Inter,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif}
#main{display:flex;flex-direction:column;gap:12px}
.p34-top{height:44px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.p34-prompt{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--text-secondary)}
.p34-status{font-family:var(--font-mono);font-size:var(--fs-body);line-height:1.35;color:var(--primary);white-space:nowrap}
.p34-reset{width:44px;min-width:44px;padding:0;font-size:22px;line-height:1}
.p34-compare{--compare-cols:3;flex:1;grid-template-columns:176px repeat(3,minmax(0,1fr));grid-template-rows:50px 84px 106px 74px 190px;overflow:visible}
.p34-compare::after{left:176px}
.comparison-field{position:absolute;z-index:0;top:50px;right:0;bottom:0;left:176px;width:calc(100% - 176px);height:calc(100% - 50px);pointer-events:none}
.p34-compare>.hdr,.p34-compare>.dim,.p34-compare>.cell{position:relative;z-index:1;padding:8px 14px}
.p34-compare>.hdr{min-height:0;align-items:center;font-size:var(--fs-body)}
.p34-compare>.hdr:first-child{font-size:var(--fs-label);color:var(--text-secondary)}
.p34-compare>.dim{position:relative;justify-content:flex-start;text-align:left;font-size:var(--fs-label);background:#2a3335;border-bottom:1px solid var(--line-strong)}
.p34-compare>.cell{position:relative;display:flex;align-items:center;min-width:0;overflow:visible;background:#242c2e;border-bottom:1px solid var(--line-strong)}
.p34-compare>.rowline{height:1px}
.p34-compare>.hdr:nth-child(4n),.p34-compare>.cell:nth-child(4n){border-right-color:transparent}
.material-name{display:flex;align-items:center;gap:10px;width:100%}
.material-mark{width:18px;height:18px;border:2px solid var(--primary);background:var(--primary-soft)}
.calibration{margin-left:auto;color:var(--text-muted);font-family:var(--font-mono);font-size:var(--fs-tick);line-height:1.35;opacity:0;transition:opacity 180ms ease}
.hdr.done .calibration{opacity:1;color:var(--accent)}
.beam-cell{background:linear-gradient(90deg,rgba(85,194,176,.16),rgba(85,194,176,.04))!important}
.beam{position:relative;width:100%;height:54px;overflow:hidden;border-left:2px solid var(--primary-line);border-right:1px solid var(--line)}
.beam::before{position:absolute;top:9px;right:0;bottom:9px;left:0;content:"";background:repeating-linear-gradient(0deg,transparent 0 8px,rgba(85,194,176,.15) 8px 10px)}
.beam svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.beam .scan{position:absolute;z-index:2;top:0;bottom:0;left:0;width:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);opacity:0}
.beam.scanning .scan{animation:scan 620ms cubic-bezier(.22,.75,.25,1)}
@keyframes scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}100%{transform:translateX(310px);opacity:0}}
.slot-cell{gap:12px;background:#20282a!important}
.slot{position:relative;flex:1;height:72px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:var(--fs-label);line-height:1.35;border:1px dashed var(--line-strong);border-radius:var(--radius-sm);transition:border-color 180ms ease,background-color 180ms ease}
.slot::before{position:absolute;top:-1px;bottom:-1px;left:50%;width:2px;content:"";background:var(--primary-line)}
.slot.ready{color:var(--text);background:var(--primary-soft);border-color:var(--primary)}
.slot.error{animation:slot-flash 360ms ease}
@keyframes slot-flash{50%{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-line)}}
.sample{position:relative;z-index:5;width:112px;height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:none;touch-action:none;cursor:grab;color:var(--text);background:var(--surface-strong);border:1px solid var(--line-strong);border-radius:var(--radius-sm);user-select:none;transition:border-color 180ms ease,background-color 180ms ease}
.sample:active{cursor:grabbing}.sample:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.sample .sample-name{font-size:var(--fs-label);font-weight:700;line-height:1.35}
.sample .sample-density{font-family:var(--font-mono);font-size:var(--fs-tick);line-height:1.35;color:var(--text-secondary)}
.sample.placed{cursor:default;background:var(--primary-soft);border-color:var(--primary)}
.sample.shake{animation:reject 380ms ease}
@keyframes reject{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}65%{transform:translateX(-5px)}100%{transform:translateX(0)}}
.ratio-wrap{width:100%}.ratio-track{position:relative;height:16px;overflow:hidden;background:#111719;border:1px solid var(--line)}
.ratio-fill{height:100%;width:0;background:var(--primary);transition:width 520ms cubic-bezier(.22,.75,.25,1)}
.ratio-value{margin-top:7px;font-family:var(--font-mono);font-size:var(--fs-sec);line-height:1.35;color:var(--text-muted)}
.cell.done .ratio-value{color:var(--text)}
.curve-cell{align-items:stretch!important;flex-direction:column;padding-top:10px!important;background:linear-gradient(180deg,#263032,#202729)!important}
.curve-cell svg{display:block;width:100%;height:124px;overflow:visible}
.curve-value{font-family:var(--font-mono);font-size:var(--fs-sec);line-height:1.35;color:var(--text-muted)}
.cell.done .curve-value{color:var(--accent)}
.axis-note{position:absolute;right:12px;bottom:8px;font-size:var(--fs-tick);line-height:1.35;color:var(--text-muted);font-family:var(--font-mono)}
.p34-claim{height:44px;display:flex;align-items:center;padding:0 16px;color:var(--text);font-size:var(--fs-sec);line-height:var(--lh-sec);background:var(--accent-soft);border-left:4px solid var(--accent);opacity:0;transform:translateY(8px);transition:opacity 320ms ease,transform 320ms ease}
.p34-claim.show{opacity:1;transform:none}
.p34-message{position:absolute;z-index:12;top:260px;left:176px;right:0;text-align:center;pointer-events:none;color:var(--accent);font-size:var(--fs-sec);line-height:var(--lh-sec);opacity:0;transition:opacity 160ms ease}
.p34-message.show{opacity:1}
.particle{stroke:var(--primary);stroke-width:2;stroke-linecap:round;opacity:.72}
.particle.blocked{stroke:var(--line-strong);opacity:.28}
.curve-line{fill:none;stroke:var(--primary);stroke-width:3}.curve-guide{stroke:var(--line);stroke-width:1}.curve-end{fill:var(--accent)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}.p34-claim{transform:none}}
</style>
</head>
<body data-page="34" data-total="44">
<div id="stage">
<main id="main">
  <div class="p34-top min0">
    <p class="p34-prompt">把样片拖入对应通道。三列只比较材料，面密度必须相同。</p>
    <div class="row items-center gap-3 shrink0">
      <span id="status" class="p34-status" aria-live="polite">已完成 0/3 种材料</span>
      <button id="reset" class="p34-reset" type="button" title="重置全部测试" aria-label="重置全部测试">↺</button>
    </div>
  </div>

  <section id="comparison" class="k-comparison p34-compare min0" aria-label="三种辐射屏蔽材料的公平比较">
    <svg class="comparison-field" viewBox="0 0 1200 454" preserveAspectRatio="none" aria-hidden="true">
      <defs><pattern id="measureTicks" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 0V7M0 0H7" stroke="rgba(85,194,176,.32)" stroke-width="1"/></pattern></defs>
      <rect width="1200" height="454" fill="url(#measureTicks)" opacity=".45"/>
      <path d="M0 84H1200M0 190H1200M0 264H1200" stroke="rgba(85,194,176,.42)" stroke-width="2"/>
      <path d="M400 0V454M800 0V454" stroke="rgba(85,194,176,.3)" stroke-width="2" stroke-dasharray="5 10"/>
    </svg>
    <div class="hdr">比较维度</div>
    <div class="hdr" data-head="aluminum"><div class="material-name"><span class="material-mark"></span><span>铝</span><span class="calibration">✓ CAL</span></div></div>
    <div class="hdr" data-head="polyethylene"><div class="material-name"><span class="material-mark"></span><span>聚乙烯</span><span class="calibration">✓ CAL</span></div></div>
    <div class="hdr" data-head="water"><div class="material-name"><span class="material-mark"></span><span>水</span><span class="calibration">✓ CAL</span></div></div>

    <div class="dim">共同入射</div>
    <div class="cell beam-cell" data-beam="aluminum"><div class="beam"><span class="scan"></span><svg aria-hidden="true"></svg></div></div>
    <div class="cell beam-cell" data-beam="polyethylene"><div class="beam"><span class="scan"></span><svg aria-hidden="true"></svg></div></div>
    <div class="cell beam-cell" data-beam="water"><div class="beam"><span class="scan"></span><svg aria-hidden="true"></svg></div></div>

    <div class="dim">相同面密度</div>
    <div class="cell slot-cell" data-cell="aluminum"><div class="sample no-pan" data-material="aluminum" role="button" tabindex="0" aria-label="铝样片，按回车放入通道"><span class="sample-name">铝样片</span><span class="sample-density"></span></div><div class="slot" data-slot="aluminum">放入通道</div></div>
    <div class="cell slot-cell" data-cell="polyethylene"><div class="sample no-pan" data-material="polyethylene" role="button" tabindex="0" aria-label="聚乙烯样片，按回车放入通道"><span class="sample-name">聚乙烯样片</span><span class="sample-density"></span></div><div class="slot" data-slot="polyethylene">放入通道</div></div>
    <div class="cell slot-cell" data-cell="water"><div class="sample no-pan" data-material="water" role="button" tabindex="0" aria-label="水样片，按回车放入通道"><span class="sample-name">水样片</span><span class="sample-density"></span></div><div class="slot" data-slot="water">放入通道</div></div>

    <div class="dim">透射比例</div>
    <div class="cell" data-ratio="aluminum"><div class="ratio-wrap"><div class="ratio-track"><div class="ratio-fill"></div></div><div class="ratio-value">等待测试</div></div></div>
    <div class="cell" data-ratio="polyethylene"><div class="ratio-wrap"><div class="ratio-track"><div class="ratio-fill"></div></div><div class="ratio-value">等待测试</div></div></div>
    <div class="cell" data-ratio="water"><div class="ratio-wrap"><div class="ratio-track"><div class="ratio-fill"></div></div><div class="ratio-value">等待测试</div></div></div>

    <div class="dim">任务期累计剂量<span class="axis-note" id="durationLabel"></span></div>
    <div class="cell curve-cell" data-curve="aluminum"><svg role="img" aria-label="铝屏蔽下累计剂量曲线"></svg><div class="curve-value">等待测试</div></div>
    <div class="cell curve-cell" data-curve="polyethylene"><svg role="img" aria-label="聚乙烯屏蔽下累计剂量曲线"></svg><div class="curve-value">等待测试</div></div>
    <div class="cell curve-cell" data-curve="water"><svg role="img" aria-label="水屏蔽下累计剂量曲线"></svg><div class="curve-value">等待测试</div></div>
    <div id="message" class="p34-message" aria-live="polite"></div>
  </section>

  <p id="claim" class="p34-claim">辐射风险往往看不见，也不会在一次穿透后立刻显现；需要管理的是随暴露时间不断累积的剂量。</p>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  Lec.K.RADIATION_MATERIALS = Lec.K.RADIATION_MATERIALS || [
    {id:'aluminum', name:'铝', arealDensity:10, transmission:0.62},
    {id:'polyethylene', name:'聚乙烯', arealDensity:10, transmission:0.39},
    {id:'water', name:'水', arealDensity:10, transmission:0.46}
  ];
  Lec.K.RADIATION_REFERENCE_FIELD = Lec.K.RADIATION_REFERENCE_FIELD || {doseRate:100, unit:'μSv/天', label:'100 μSv/天'};
  Lec.K.RADIATION_MISSION_DURATION = Lec.K.RADIATION_MISSION_DURATION || {value:180, unit:'天', label:'180 天'};
  Lec.P.radiationTransmission = Lec.P.radiationTransmission || function(material, field, density){
    var ratio = Math.pow(material.transmission, density / material.arealDensity);
    return {value:ratio, unit:'%', formatted:(ratio * 100).toFixed(0) + '%', incoming:field.label};
  };
  Lec.P.accumulatedDose = Lec.P.accumulatedDose || function(field, transmission, duration){
    var value = field.doseRate * transmission.value * duration.value / 1000;
    return {value:value, unit:'mSv', formatted:value.toFixed(1) + ' mSv', duration:duration.label};
  };

  Lec.mount({
    index:34,
    kicker:'E5 · INVISIBLE DOSE',
    title:'穿过去多少，决定长期累积多少',
    take:'太空中的辐射风险往往看不见，也不会在一次穿透后立刻显现；真正需要管理的是随暴露时间不断累积的剂量。'
  });

  var targetDensity = Lec.K.RADIATION_MATERIALS[0].arealDensity;
  var initialDensity = {aluminum:targetDensity, polyethylene:targetDensity - 2, water:targetDensity + 2};
  var state = {placed:{}, density:Object.assign({}, initialDensity)};
  var reduced = Deck.reduced();
  var $ = function(s){return document.querySelector(s)};
  var $$ = function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
  var materials = Lec.K.RADIATION_MATERIALS;

  function densityText(v){return v.toFixed(0) + ' g/cm²';}
  function model(material){
    var transmission = Lec.P.radiationTransmission(material, Lec.K.RADIATION_REFERENCE_FIELD, state.density[material.id]);
    return {material:material, transmission:transmission, dose:Lec.P.accumulatedDose(Lec.K.RADIATION_REFERENCE_FIELD, transmission, Lec.K.RADIATION_MISSION_DURATION)};
  }

  function drawBeam(m){
    var svg = d3.select('[data-beam="'+m.material.id+'"] svg');
    svg.selectAll('*').remove();
    var count = 16, passed = Math.round(count * m.transmission.value);
    var rows = d3.range(count).map(function(i){return {i:i, pass:i < passed};});
    svg.selectAll('line').data(rows).join('line')
      .attr('class',function(d){return 'particle'+(d.pass?'':' blocked');})
      .attr('x1',8).attr('x2',function(d){return d.pass ? 292 : 150;})
      .attr('y1',function(d){return 5 + (d.i % 8) * 6.3;})
      .attr('y2',function(d){return 5 + (d.i % 8) * 6.3;})
      .attr('stroke-dasharray','5 7')
      .attr('stroke-dashoffset',reduced?0:28)
      .transition().duration(reduced?0:560).attr('stroke-dashoffset',0);
  }

  function drawCurve(m){
    var svg = d3.select('[data-curve="'+m.material.id+'"] svg');
    svg.selectAll('*').remove();
    var w=290,h=118, duration=Lec.K.RADIATION_MISSION_DURATION.value;
    var maxDose=d3.max(materials,function(x){
      var t=Lec.P.radiationTransmission(x,Lec.K.RADIATION_REFERENCE_FIELD,targetDensity);
      return Lec.P.accumulatedDose(Lec.K.RADIATION_REFERENCE_FIELD,t,Lec.K.RADIATION_MISSION_DURATION).value;
    });
    var x=d3.scaleLinear().domain([0,duration]).range([8,w-10]);
    var y=d3.scaleLinear().domain([0,maxDose*1.08]).range([h-20,8]);
    svg.attr('viewBox','0 0 '+w+' '+h);
    svg.append('line').attr('class','curve-guide').attr('x1',8).attr('x2',w-10).attr('y1',h-20).attr('y2',h-20);
    svg.append('line').attr('class','curve-guide').attr('x1',8).attr('x2',8).attr('y1',8).attr('y2',h-20);
    var data=d3.range(0,7).map(function(i){var day=duration*i/6;return {day:day,dose:m.dose.value*i/6};});
    var path=svg.append('path').datum(data).attr('class','curve-line').attr('d',d3.line().x(function(d){return x(d.day);}).y(function(d){return y(d.dose);}));
    var length=path.node().getTotalLength();
    if(!reduced){path.attr('stroke-dasharray',length+' '+length).attr('stroke-dashoffset',length).transition().duration(700).attr('stroke-dashoffset',0);}
    svg.append('circle').attr('class','curve-end').attr('cx',x(duration)).attr('cy',y(m.dose.value)).attr('r',5).attr('opacity',reduced?1:0).transition().delay(reduced?0:620).attr('opacity',1);
  }

  function complete(id){
    if(state.placed[id]) return;
    var material=materials.find(function(d){return d.id===id;});
    var m=model(material);
    state.placed[id]=true;
    var sample=$('[data-material="'+id+'"]'), slot=$('[data-slot="'+id+'"]');
    sample.style.transform=''; sample.classList.add('placed'); sample.setAttribute('aria-disabled','true'); sample.tabIndex=-1;
    slot.classList.add('ready'); slot.textContent='已校准';
    $('[data-head="'+id+'"]').classList.add('done');
    var ratio=$('[data-ratio="'+id+'"]'); ratio.classList.add('done');
    ratio.querySelector('.ratio-fill').style.width=(m.transmission.value*100)+'%';
    ratio.querySelector('.ratio-value').textContent=m.transmission.formatted+' 透射';
    var curve=$('[data-curve="'+id+'"]'); curve.classList.add('done');
    curve.querySelector('.curve-value').textContent=m.dose.formatted+' / '+m.dose.duration;
    var beam=$('[data-beam="'+id+'"] .beam'); beam.classList.remove('scanning'); void beam.offsetWidth; beam.classList.add('scanning');
    drawBeam(m); drawCurve(m); updateStatus();
  }

  function reject(id){
    var sample=$('[data-material="'+id+'"]'), slot=$('[data-slot="'+id+'"]');
    sample.style.transform=''; sample.classList.remove('shake'); slot.classList.remove('error'); void sample.offsetWidth;
    sample.classList.add('shake'); slot.classList.add('error');
    state.density[id]=targetDensity;
    sample.querySelector('.sample-density').textContent=densityText(targetDensity);
    showMessage('要比较材料，先让面密度相同。样片已校准，请再次放入。');
  }

  function attempt(id){
    if(state.placed[id]) return;
    if(Math.abs(state.density[id]-targetDensity)>0.001) reject(id); else complete(id);
  }

  function showMessage(text){
    var el=$('#message'); el.textContent=text; el.classList.add('show');
    window.clearTimeout(showMessage.timer); showMessage.timer=window.setTimeout(function(){el.classList.remove('show');},2200);
  }

  function updateStatus(){
    var n=Object.keys(state.placed).length;
    $('#status').textContent='已完成 '+n+'/3 种材料';
    if(n===3) $('#claim').classList.add('show');
  }

  function setupDrag(el){
    var id=el.dataset.material, origin=null;
    d3.select(el).call(d3.drag()
      .on('start',function(){if(state.placed[id])return;origin={x:0,y:0};d3.select(this).raise();})
      .on('drag',function(event){if(state.placed[id])return;origin.x+=event.dx;origin.y+=event.dy;this.style.transform='translate('+origin.x+'px,'+origin.y+'px)';})
      .on('end',function(event){
        if(state.placed[id])return;
        var p=event.sourceEvent, under=document.elementFromPoint(p.clientX,p.clientY);
        var slot=under&&under.closest('[data-slot="'+id+'"]');
        if(slot) attempt(id); else {this.style.transform='';showMessage('把样片放入同一列的测试通道。');}
      }));
    el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();attempt(id);}});
  }

  function reset(){
    state.placed={};state.density=Object.assign({},initialDensity);
    $$('.sample').forEach(function(el){var id=el.dataset.material;el.style.transform='';el.classList.remove('placed','shake');el.removeAttribute('aria-disabled');el.tabIndex=0;el.querySelector('.sample-density').textContent=densityText(state.density[id]);});
    $$('.slot').forEach(function(el){el.classList.remove('ready','error');el.textContent='放入通道';});
    $$('.hdr.done,.cell.done').forEach(function(el){el.classList.remove('done');});
    $$('.ratio-fill').forEach(function(el){el.style.width='0';});
    $$('.ratio-value,.curve-value').forEach(function(el){el.textContent='等待测试';});
    $$('.beam svg,.curve-cell svg').forEach(function(el){d3.select(el).selectAll('*').remove();});
    $('#claim').classList.remove('show');$('#message').classList.remove('show');updateStatus();
  }

  $('#durationLabel').textContent=Lec.K.RADIATION_MISSION_DURATION.label;
  $$('.sample').forEach(function(el){el.querySelector('.sample-density').textContent=densityText(state.density[el.dataset.material]);setupDrag(el);});
  $('#reset').addEventListener('click',reset);
  updateStatus();
})();
</script>
</body>
</html>
