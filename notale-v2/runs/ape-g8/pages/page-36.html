<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="36" data-total="44">
<div id="stage">
<main id="main">
  <style>
    .p36 {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .p36-lead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      padding: 0 18px;
      background: var(--surface-raised);
      border-left: 5px solid var(--primary);
    }

    .p36-lead strong {
      font-size: var(--fs-lead);
      line-height: var(--lh-body);
    }

    .p36-legend {
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--text-secondary);
      font-size: var(--fs-label);
      line-height: 1.35;
    }

    .p36-key {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .p36-key::before {
      width: 18px;
      height: 3px;
      content: "";
      background: var(--primary);
    }

    .p36-key.cost::before {
      background: var(--accent);
    }

    .p36-map {
      position: relative;
      min-height: 0;
      height: 412px;
    }

    .p36-map > * {
      min-width: 0;
      min-height: 0;
    }

    .p36-schematic {
      position: absolute;
      z-index: 4;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .p36-schematic .shell {
      fill: rgba(17, 20, 23, .2);
      stroke: var(--line-strong);
      stroke-width: 2;
    }

    .p36-schematic .system-line {
      fill: none;
      stroke: var(--primary);
      stroke-width: 2;
      stroke-opacity: .72;
    }

    .p36-schematic .system-soft {
      fill: none;
      stroke: var(--primary-line);
      stroke-width: 1;
    }

    .p36-schematic .part-fill {
      fill: var(--primary-soft);
      stroke: var(--primary-line);
      stroke-width: 1.5;
    }

    .p36-schematic .cost-mark {
      fill: var(--accent);
    }

    .p36-boundary,
    .p36-craft {
      position: absolute;
      z-index: 3;
      top: 0;
      bottom: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .p36-boundary {
      left: 0;
      width: 210px;
      border-right: 1px solid var(--primary-line);
    }

    .p36-craft {
      right: 0;
      width: 246px;
      border-left: 1px solid var(--primary-line);
    }

    .p36-side-title {
      position: absolute;
      z-index: 3;
      top: 12px;
      left: 14px;
      color: var(--text-secondary);
      font-size: var(--fs-label);
      font-weight: 700;
      line-height: 1.35;
    }

    .p36-human {
      position: absolute;
      z-index: 1;
      top: 58px;
      left: 37px;
      width: 118px;
      height: 304px;
      opacity: 1;
      animation: p36-human-in 500ms ease-out 100ms both;
    }

    .p36-human .head {
      position: absolute;
      top: 0;
      left: 41px;
      width: 36px;
      height: 42px;
      border: 2px solid var(--text-secondary);
      border-radius: 48% 48% 44% 44%;
    }

    .p36-human .torso {
      position: absolute;
      top: 48px;
      left: 31px;
      width: 55px;
      height: 112px;
      border: 2px solid var(--text-secondary);
      border-radius: 42% 42% 24% 24%;
    }

    .p36-human .pelvis {
      position: absolute;
      top: 148px;
      left: 29px;
      width: 60px;
      height: 38px;
      border: 2px solid var(--primary);
      border-radius: 45% 45% 36% 36%;
    }

    .p36-human .arm,
    .p36-human .leg {
      position: absolute;
      width: 2px;
      background: var(--text-secondary);
      transform-origin: top;
    }

    .p36-human .arm { top: 67px; height: 116px; }
    .p36-human .arm.left { left: 29px; transform: rotate(10deg); }
    .p36-human .arm.right { right: 30px; transform: rotate(-10deg); }
    .p36-human .leg { top: 181px; height: 112px; }
    .p36-human .leg.left { left: 44px; transform: rotate(5deg); }
    .p36-human .leg.right { right: 44px; transform: rotate(-5deg); }

    .p36-scale {
      position: absolute;
      z-index: 2;
      top: 62px;
      right: 12px;
      bottom: 44px;
      width: 38px;
      border-right: 1px solid var(--primary-line);
      background: repeating-linear-gradient(to bottom, transparent 0 17px, var(--primary-line) 18px 19px, transparent 20px 35px);
    }

    .p36-scale-label {
      position: absolute;
      right: 14px;
      bottom: 12px;
      color: var(--primary);
      font-family: var(--font-mono);
      font-size: var(--fs-label);
      line-height: 1.35;
    }

    .p36-enum {
      --enum-cols: 1;
      position: absolute;
      z-index: 2;
      inset: 0;
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 8px;
      height: 100%;
    }

    .p36-enum > .it {
      grid-template-columns: 42px minmax(0, 1fr);
      align-content: center;
      gap: 10px;
      padding: 10px 258px 10px 222px;
      opacity: 1;
      animation: p36-line-in 420ms ease-out both;
    }

    .p36-enum > .it:nth-child(1) { animation-delay: 350ms; }
    .p36-enum > .it:nth-child(2) { animation-delay: 500ms; }
    .p36-enum > .it:nth-child(3) { animation-delay: 650ms; }
    .p36-enum > .it:nth-child(4) { animation-delay: 800ms; }

    .p36-enum > .it::before {
      width: 34px;
      height: 34px;
    }

    .p36-chain {
      display: grid;
      grid-template-columns: minmax(132px, .78fr) 24px minmax(210px, 1.25fr) 24px minmax(150px, .9fr);
      align-items: center;
      min-width: 0;
      height: 100%;
    }

    .p36-node {
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-sizing: border-box;
      min-width: 0;
      min-height: 68px;
      padding: 8px 12px;
      background: var(--surface-soft);
      border-top: 1px solid var(--primary-line);
      border-bottom: 1px solid var(--line);
    }

    .p36-node b {
      display: block;
      color: var(--text);
      font-size: var(--fs-sec);
      line-height: var(--lh-sec);
    }

    .p36-node span {
      display: block;
      color: var(--text-secondary);
      font-size: var(--fs-sec);
      line-height: var(--lh-sec);
    }

    .p36-chainline {
      position: relative;
      height: 1px;
      margin: 0 4px;
      background: var(--primary-line);
    }

    .p36-chainline::after {
      position: absolute;
      top: 50%;
      right: 0;
      width: 6px;
      height: 6px;
      content: "";
      border-top: 1px solid var(--primary);
      border-right: 1px solid var(--primary);
      transform: translateY(-50%) rotate(45deg);
    }

    .p36-cost {
      padding-left: 12px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-line);
      border-left: 3px solid var(--accent);
    }

    .p36-cost b {
      color: var(--accent);
    }

    .p36-craft::before {
      position: absolute;
      z-index: 1;
      top: 52px;
      right: 26px;
      bottom: 48px;
      left: 28px;
      content: "";
      background: linear-gradient(90deg, rgba(85,194,176,.08), transparent 42%);
      border: 2px solid var(--line-strong);
      border-radius: 44% 16% 16% 44% / 50% 24% 24% 50%;
    }

    .p36-craft::after {
      position: absolute;
      z-index: 0;
      right: 8px;
      bottom: 0;
      width: 224px;
      height: 48px;
      content: "";
      border: 2px solid var(--primary-line);
      border-radius: 50% 50% 0 0;
    }

    .p36-parts {
      position: absolute;
      z-index: 2;
      top: 66px;
      right: 42px;
      left: 42px;
      display: grid;
      grid-template-rows: repeat(4, 1fr);
      gap: 14px;
      height: 272px;
    }

    .p36-part {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 0 10px;
      color: var(--text-secondary);
      background: rgba(17,20,23,.82);
      border: 1px solid var(--line);
      font-size: var(--fs-label);
      line-height: 1.35;
      opacity: 1;
      animation: p36-part-in 350ms ease-out both;
    }

    .p36-part:nth-child(1) { animation-delay: 520ms; }
    .p36-part:nth-child(2) { animation-delay: 670ms; }
    .p36-part:nth-child(3) { animation-delay: 820ms; }
    .p36-part:nth-child(4) { animation-delay: 970ms; }

    .p36-part::before {
      flex: 0 0 auto;
      width: 10px;
      height: 10px;
      content: "";
      background: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-soft);
    }

    .p36-earth-label {
      position: absolute;
      z-index: 2;
      right: 14px;
      bottom: 10px;
      color: var(--text-muted);
      font-size: var(--fs-label);
      line-height: 1.35;
    }

    .p36-close {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 410px;
      align-items: center;
      gap: 28px;
      min-height: 104px;
      padding: 0 22px;
      background: var(--surface-soft);
      border-top: 1px solid var(--primary-line);
    }

    .p36-close > * {
      min-width: 0;
    }

    .p36-claim {
      font-size: var(--fs-lead);
      font-weight: 700;
      line-height: var(--lh-body);
    }

    .p36-ledger {
      padding-left: 18px;
      color: var(--text-secondary);
      border-left: 4px solid var(--accent);
      font-size: var(--fs-body);
      line-height: var(--lh-body);
    }

    .p36-ledger strong {
      color: var(--accent);
    }

    @keyframes p36-human-in {
      from { filter: brightness(.7); }
      to { filter: brightness(1); }
    }

    @keyframes p36-line-in {
      from { border-color: var(--line-strong); }
      to { border-color: var(--primary-line); }
    }

    @keyframes p36-part-in {
      from { border-color: var(--line-strong); }
      to { border-color: var(--primary-line); }
    }

    @media (prefers-reduced-motion: reduce) {
      .p36-human,
      .p36-enum > .it,
      .p36-part {
        opacity: 1;
        animation: none;
        transform: none;
      }
    }
  </style>

  <section class="p36" aria-label="人体环境边界与航天器管理系统">
    <div class="p36-lead">
      <strong>舱内的“正常环境”，是系统持续工作的结果。</strong>
      <div class="p36-legend" aria-label="图例">
        <span class="p36-key">环境管理</span>
        <span class="p36-key cost">系统代价</span>
      </div>
    </div>

    <div class="p36-map">
      <svg class="p36-schematic" viewBox="0 0 1408 412" role="img" aria-label="四条环境条件管线从人体边界接入航天器的密封舱、散热面、屏蔽层和通信链路">
        <path class="shell" d="M28 35 H170 Q205 35 216 76 V336 Q205 377 170 377 H28" />
        <path class="shell" d="M1168 42 H1318 Q1378 42 1388 112 V300 Q1378 370 1318 370 H1168" />
        <path class="system-soft" d="M58 52 V360 M82 52 V360 M106 52 V360 M130 52 V360" />
        <path class="system-line" d="M176 53 H1240" />
        <path class="system-line" d="M176 155 H1240" />
        <path class="system-line" d="M176 257 H1240" />
        <path class="system-line" d="M176 359 H1240" />
        <rect class="part-fill" x="1250" y="24" width="112" height="58" rx="3" />
        <path class="part-fill" d="M1248 127 h112 v56 h-112 z M1222 135 h20 v40 h-20 z M1366 135 h20 v40 h-20 z" />
        <path class="part-fill" d="M1238 218 h134 v78 h-134 z M1253 232 h104 v50 h-104 z" fill-rule="evenodd" />
        <path class="part-fill" d="M1250 326 h72 v58 h-72 z M1324 350 q38 -30 60 0 M1332 350 q28 -18 44 0" />
        <circle class="cost-mark" cx="1238" cy="53" r="5" />
        <circle class="cost-mark" cx="1238" cy="155" r="5" />
        <circle class="cost-mark" cx="1238" cy="257" r="5" />
        <circle class="cost-mark" cx="1238" cy="359" r="5" />
      </svg>
      <figure class="p36-boundary min0" aria-label="被舱壁包围的人体轮廓与环境参数刻度">
        <figcaption class="p36-side-title">人体边界</figcaption>
        <div class="p36-human" aria-hidden="true">
          <span class="head"></span>
          <span class="torso"></span>
          <span class="pelvis"></span>
          <span class="arm left"></span>
          <span class="arm right"></span>
          <span class="leg left"></span>
          <span class="leg right"></span>
        </div>
        <div class="p36-scale" aria-hidden="true"></div>
        <span class="p36-scale-label">ENV / BODY</span>
      </figure>

      <div class="k-enumeration p36-enum min0" aria-label="四项并列的环境管理关系">
        <article class="it">
          <div class="p36-chain">
            <div class="p36-node"><b>空气与压力</b><span>人体需要稳定舱内条件</span></div>
            <span class="p36-chainline" aria-hidden="true"></span>
            <div class="p36-node"><b>检测 · 供给 · 密封</b><span>把空气状态接入持续管理</span></div>
            <span class="p36-chainline" aria-hidden="true"></span>
            <div class="p36-node p36-cost"><b>质量 · 能量</b><span>维护</span></div>
          </div>
        </article>

        <article class="it">
          <div class="p36-chain">
            <div class="p36-node"><b>温度与废热</b><span>人体和设备不断产热</span></div>
            <span class="p36-chainline" aria-hidden="true"></span>
            <div class="p36-node"><b>测量 · 输运 · 散热</b><span>把热量送到舱外</span></div>
            <span class="p36-chainline" aria-hidden="true"></span>
            <div class="p36-node p36-cost"><b>功耗 · 面积</b><span>设备负担</span></div>
          </div>
        </article>

        <article class="it">
          <div class="p36-chain">
            <div class="p36-node"><b>辐射暴露</b><span>风险随暴露继续累积</span></div>
            <span class="p36-chainline" aria-hidden="true"></span>
            <div class="p36-node"><b>监测 · 屏蔽 · 缩短暴露</b><span>风险可管理，但没有消失</span></div>
            <span class="p36-chainline" aria-hidden="true"></span>
            <div class="p36-node p36-cost"><b>质量</b><span>任务约束</span></div>
          </div>
        </article>

        <article class="it">
          <div class="p36-chain">
            <div class="p36-node"><b>资源与信息</b><span>供给与反馈都不无限</span></div>
            <span class="p36-chainline" aria-hidden="true"></span>
            <div class="p36-node"><b>储存 · 循环 · 延迟决策</b><span>在有限反馈下维持任务</span></div>
            <span class="p36-chainline" aria-hidden="true"></span>
            <div class="p36-node p36-cost"><b>容量 · 损失</b><span>时间代价</span></div>
          </div>
        </article>
      </div>

      <figure class="p36-craft min0" aria-label="航天器剖面与四类管理部件">
        <figcaption class="p36-side-title">航天器系统</figcaption>
        <div class="p36-parts">
          <div class="p36-part">密封舱与供气管路</div>
          <div class="p36-part">热输运与散热面</div>
          <div class="p36-part">屏蔽层与监测器</div>
          <div class="p36-part">储存舱与通信链路</div>
        </div>
        <span class="p36-earth-label">地球原本隐性提供这些条件</span>
      </figure>
    </div>

    <div class="p36-close">
      <p class="p36-claim">航天器没有消除人体对环境的依赖，而是把这些条件变成可测量、可管理的系统。</p>
      <p class="p36-ledger">每一种管理，都要用<strong>质量、能量、时间或维护</strong>来付账。</p>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 36,
  kicker: "ACT IV · SYSTEMS",
  title: "航天器把环境变成了一组必须持续管理的条件",
  take: "航天器把环境条件做成了可测、可管理、但有代价的系统"
});
</script>
</body>
</html>
