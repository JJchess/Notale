<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#111417;--text:#edf2f0;--font-sans:Inter,"Noto Sans SC","Source Han Sans SC","Microsoft YaHei","PingFang SC",Arial,sans-serif}
.audit-page{height:100%;display:flex;flex-direction:column;gap:12px;min-height:0}
.audit-intro{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:36px}
.audit-intro p{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--text-secondary)}
.audit-progress{flex:0 0 auto;color:var(--primary);font-family:var(--font-mono);font-size:var(--fs-sec);line-height:1.45}
.audit-progress strong{color:var(--text)}
.viewport-row{position:relative;display:grid;grid-template-columns:minmax(176px,.72fr) repeat(3,minmax(0,1fr));height:148px;min-height:148px;overflow:hidden;background:#0d1113;border:1px solid var(--line);border-radius:var(--radius-md)}
.viewport-row canvas{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.72}
.scale-rail{position:relative;z-index:3;display:flex;flex-direction:column;justify-content:space-between;padding:14px 16px;border-right:1px solid var(--primary-line);background:rgba(17,20,23,.86)}
.scale-rail .label{color:var(--text-secondary)}
.scale-line{height:1px;background:var(--line-strong)}
.scale-line::after{display:block;width:8px;height:8px;margin-top:-4px;content:"";background:var(--primary);border-radius:50%}
.viewport{position:relative;z-index:1;min-width:0;overflow:hidden;border-right:1px solid var(--line);background:#101416}
.viewport:last-child{border-right:0}
.viewport img{box-sizing:border-box;display:block;width:calc(100% - 16px);height:calc(100% - 16px);margin:8px;object-fit:cover;filter:saturate(.78) contrast(1.05);opacity:.72;border:1px solid var(--line-strong)}
.viewport::after{position:absolute;inset:0;content:"";background:linear-gradient(180deg,rgba(10,13,14,.06),rgba(10,13,14,.82));pointer-events:none}
.place-title{position:absolute;z-index:4;right:14px;bottom:12px;left:14px;display:flex;align-items:end;justify-content:space-between;gap:8px;color:var(--text);font-size:var(--fs-h2);font-weight:700;line-height:1.25}
.place-title small{color:var(--text-secondary);font-size:var(--fs-label);font-weight:500;line-height:1.35;text-align:right}
.evidence-band{position:absolute;z-index:4;top:10px;right:12px;left:12px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.evidence-band span{box-sizing:border-box;min-height:25px;padding:3px 9px;color:var(--text);background:rgba(17,20,23,.78);border-left:3px solid var(--primary);font-size:var(--fs-label);line-height:1.35}
.evidence-band b{color:var(--primary);font-weight:700}
.source-bar{display:flex;align-items:center;gap:10px;min-height:48px}
.source-bar>span{flex:0 0 auto;color:var(--text-secondary);font-size:var(--fs-label);font-weight:650;line-height:1.35}
.source-chip{min-height:38px;padding:0 13px;border-color:var(--accent-line);background:var(--accent-soft);font-size:var(--fs-label);cursor:grab;touch-action:none}
.source-chip[aria-pressed="true"]{color:var(--bg);background:var(--accent);border-color:var(--accent)}
.source-chip.dragging{position:relative;z-index:20;cursor:grabbing;box-shadow:0 8px 22px rgba(0,0,0,.38);transition:none}
.reset{width:42px;min-width:42px;min-height:38px;margin-left:auto;padding:0;font-size:23px;line-height:1}
.audit-matrix{--compare-cols:3;flex:1 1 auto;grid-template-columns:minmax(176px,.72fr) repeat(3,minmax(0,1fr));grid-template-rows:44px 1px repeat(3,minmax(0,1fr));min-height:0}
.audit-matrix::after{left:max(176px,calc(100% / 4))}
.audit-matrix>.hdr{min-height:44px;padding:8px 14px;align-items:center}
.audit-matrix>.dim{position:relative;justify-content:flex-start;padding:10px 14px;text-align:left;font-size:var(--fs-sec)}
.audit-matrix>.dim::before{width:8px;height:8px;margin-right:10px;content:"";background:var(--line-strong);border-radius:50%}
.audit-matrix>.dim.row-complete{color:var(--primary)}
.audit-matrix>.dim.row-complete::before{background:var(--primary);box-shadow:0 0 10px var(--primary)}
.audit-matrix>.cell{position:relative;display:flex;align-items:center;min-height:0;padding:9px 14px;background:#171d1f;border-right:1px solid var(--line);font-size:var(--fs-sec);line-height:1.4;cursor:pointer;outline-offset:-3px}
.audit-matrix>.cell>.prompt{box-sizing:border-box;display:flex;flex:1 1 auto;min-height:58px;flex-direction:column;justify-content:center;gap:3px;padding:7px 11px;color:var(--text-secondary);background:rgba(38,48,51,.62);border:1px dashed var(--line-strong);border-left:3px solid var(--accent)}
.audit-matrix>.cell>.prompt{font-size:var(--fs-sec);line-height:1.4}
.audit-matrix>.cell:nth-child(3n){border-right:1px solid var(--line)}
.audit-matrix>.cell:nth-child(4n){border-right-color:transparent}
.audit-matrix>.cell::before{position:absolute;top:0;left:50%;width:1px;height:0;content:"";background:var(--primary);transition:height 260ms ease}
.audit-matrix>.cell::after{width:7px;height:7px;margin-right:9px;content:"";border:1px solid var(--accent);border-radius:50%;flex:0 0 auto}
.audit-matrix>.cell.target{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.audit-matrix>.cell.done{color:var(--text);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary-line);cursor:default}
.audit-matrix>.cell.done::before{height:100%}
.audit-matrix>.cell.done::after{background:var(--primary);border-color:var(--primary);box-shadow:0 0 8px var(--primary)}
.audit-matrix>.cell.wrong{animation:reject 260ms ease}
.audit-matrix>.cell.done{padding:10px 16px;color:var(--text);font-size:var(--fs-sec);line-height:1.4}
.closure{display:grid;grid-template-columns:minmax(176px,.72fr) repeat(3,minmax(0,1fr));min-height:34px;color:var(--text-secondary);font-size:var(--fs-label);line-height:1.35}
.closure span{display:flex;align-items:center;justify-content:center;border-top:1px solid var(--line);opacity:.25}
.closure span:first-child{justify-content:flex-start;border-top-color:transparent}
.closure.complete span{color:var(--primary);opacity:1}
.conclusion{display:none;align-items:center;gap:14px;min-height:42px;padding:7px 14px;color:var(--text);background:var(--surface-soft);border-left:4px solid var(--accent);font-size:var(--fs-sec);line-height:var(--lh-sec)}
.conclusion.show{display:flex}
@keyframes reject{0%,100%{transform:translateX(0)}30%{transform:translateX(-7px)}65%{transform:translateX(7px)}}
@media(prefers-reduced-motion:reduce){.audit-matrix>.cell::before{transition:none}.audit-matrix>.cell.wrong{animation:none}}
</style>
</head>

<script>
Lec.mount({index:38,kicker:"SYSTEM AUDIT",title:"谁在替身体维持生存？",take:"环境越远离地球，生命支持、维修和补给越不能被忽略"});

(function(){
  var labels={nature:"行星环境",local:"当地基础设施",cabin:"舱内 / 基地系统",earthlink:"地球链路"};
  var prompts={life:'空气、水与温度：谁在日常维持？',repair:'故障诊断与修复：谁能持续响应？',supply:'食物、耗材与备件：谁能按需送达？'};
  var detail={
    "life-earth":"空气、水与适宜温度由环境大量承担",
    "life-iss":"舱内循环，并接受地球支援",
    "life-mars":"基地系统必须持续维持",
    "repair-earth":"密集设施与人员可随时调用",
    "repair-iss":"在轨操作，制造与发射仍在地面",
    "repair-mars":"备件、工具与维修能力必须预置",
    "supply-earth":"接入连续的日常供应网络",
    "supply-iss":"依赖定期运输",
    "supply-mars":"链路漫长且不连续，库存须前置"
  };
  var selected=null,done=new Set(),pointerDrag=null,suppressClick=false,chips=[].slice.call(document.querySelectorAll('.source-chip'));
  var cells=[].slice.call(document.querySelectorAll('.audit-matrix .cell'));
  var count=document.getElementById('doneCount'),closure=document.getElementById('closure'),conclusion=document.getElementById('conclusion');

  function choose(source){selected=source;chips.forEach(function(chip){chip.setAttribute('aria-pressed',String(chip.dataset.source===source));});cells.filter(function(cell){return !cell.classList.contains('done');}).forEach(function(cell){cell.classList.toggle('target',cell.dataset.answer===source);});}
  function clearChoice(){selected=null;chips.forEach(function(chip){chip.setAttribute('aria-pressed','false');chip.classList.remove('dragging');chip.style.transform='';});cells.forEach(function(cell){cell.classList.remove('target');});}
  function updateRows(){['life','repair','supply'].forEach(function(row){var complete=cells.filter(function(cell){return cell.dataset.key.indexOf(row+'-')===0;}).every(function(cell){return cell.classList.contains('done');});document.querySelector('[data-row-label="'+row+'"]').classList.toggle('row-complete',complete);});}
  function place(cell,source){
    if(!source||cell.classList.contains('done'))return;
    if(cell.dataset.answer!==source){cell.classList.remove('wrong');void cell.offsetWidth;cell.classList.add('wrong');cell.setAttribute('aria-label','不匹配：这项支撑在此处不能由该来源日常提供');return;}
    done.add(cell.dataset.key);cell.classList.add('done');cell.classList.remove('target','wrong');cell.textContent=labels[source]+'：'+detail[cell.dataset.key];cell.setAttribute('aria-label',labels[source]+'：'+detail[cell.dataset.key]);count.textContent=String(done.size);updateRows();
    if(done.size===9){closure.classList.add('complete');closure.setAttribute('aria-hidden','false');conclusion.classList.add('show');}
    clearChoice();
  }
  chips.forEach(function(chip){
    chip.addEventListener('click',function(){if(suppressClick){suppressClick=false;return;}choose(chip.dataset.source);});
    chip.addEventListener('dragstart',function(e){choose(chip.dataset.source);chip.classList.add('dragging');e.dataTransfer.setData('text/plain',chip.dataset.source);});
    chip.addEventListener('dragend',clearChoice);
    chip.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse')return;choose(chip.dataset.source);pointerDrag={chip:chip,id:e.pointerId,x:e.clientX,y:e.clientY};chip.setPointerCapture(e.pointerId);chip.classList.add('dragging');});
    chip.addEventListener('pointermove',function(e){if(!pointerDrag||pointerDrag.id!==e.pointerId)return;var dx=(e.clientX-pointerDrag.x)/Deck.s,dy=(e.clientY-pointerDrag.y)/Deck.s;chip.style.transform='translate('+dx+'px,'+dy+'px)';});
    chip.addEventListener('pointerup',function(e){if(!pointerDrag||pointerDrag.id!==e.pointerId)return;suppressClick=true;var target=document.elementFromPoint(e.clientX,e.clientY),cell=target&&target.closest('.audit-matrix .cell');if(cell)place(cell,chip.dataset.source);else clearChoice();pointerDrag=null;});
    chip.addEventListener('pointercancel',function(){pointerDrag=null;clearChoice();});
    chip.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&selected===chip.dataset.source){e.preventDefault();cells.find(function(cell){return !cell.classList.contains('done');}).focus();}});
  });
  cells.forEach(function(cell){
    cell.addEventListener('dragover',function(e){e.preventDefault();});
    cell.addEventListener('drop',function(e){e.preventDefault();place(cell,e.dataTransfer.getData('text/plain')||selected);});
    cell.addEventListener('click',function(){place(cell,selected);});
    cell.addEventListener('keydown',function(e){
      var i=cells.indexOf(cell),next=i;
      if(e.key==='ArrowRight')next=Math.min(8,i+1);if(e.key==='ArrowLeft')next=Math.max(0,i-1);if(e.key==='ArrowDown')next=Math.min(8,i+3);if(e.key==='ArrowUp')next=Math.max(0,i-3);
      if(next!==i){e.preventDefault();cells[next].focus();}else if(e.key==='Enter'||e.key===' '){e.preventDefault();place(cell,selected);}
    });
  });
  document.getElementById('resetAudit').addEventListener('click',function(){done.clear();cells.forEach(function(cell){cell.className='cell';cell.innerHTML=prompts[cell.dataset.key.split('-')[0]];cell.setAttribute('aria-label',cell.dataset.key+'，待审计');});count.textContent='0';closure.classList.remove('complete');closure.setAttribute('aria-hidden','true');conclusion.classList.remove('show');updateRows();clearChoice();});

  var canvas=document.getElementById('systemScene');
  var renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true});
  renderer.setClearColor(0x000000,0);renderer.outputColorSpace=THREE.SRGBColorSpace;
  var scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(32,1408/148,.1,100);camera.position.set(0,0,13);
  scene.add(new THREE.AmbientLight(0x55c2b0,1.2));
  var lineMat=new THREE.MeshBasicMaterial({color:0x55c2b0,wireframe:true,transparent:true,opacity:.72});
  var accentMat=new THREE.MeshBasicMaterial({color:0xf2b84b,transparent:true,opacity:.78});
  var group=new THREE.Group();scene.add(group);
  [-4.15,0,4.15].forEach(function(x,i){var ring=new THREE.Mesh(new THREE.TorusGeometry(i===1?.62:.82,.025,8,64),accentMat);ring.position.set(x,0,0);ring.rotation.x=1.18;group.add(ring);var body=new THREE.Mesh(new THREE.IcosahedronGeometry(i===1?.46:.62,1),lineMat);body.position.set(x,0,0);group.add(body);});
  var pipe=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,8.3,8),lineMat);pipe.rotation.z=Math.PI/2;group.add(pipe);
  function size3d(){Deck.fit(canvas);renderer.setViewport(0,0,canvas.width,canvas.height);camera.aspect=1408/148;camera.updateProjectionMatrix();}
  size3d();Deck.onResize(size3d);
  Deck.loop(function(t,dt){if(!Deck.reduced())group.rotation.y+=dt*.00008;renderer.render(scene,camera);},{still:1600});
})();
</script>
