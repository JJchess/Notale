<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --motion-fast: 180ms;
  --motion-state: 420ms;
  --motion-enter: 760ms;
  --ease-out: cubic-bezier(.22,.72,.22,1);
}

#main {
  padding-top: 30px;
  padding-bottom: 28px;
}

.system-page {
  height: 100%;
  gap: 18px;
}

.system-page > * {
  min-width: 0;
}

.system-page > .claim {
  flex: 0 0 92px;
  max-width: none;
  min-height: 58px;
  display: flex;
  align-items: stretch;
  gap: 24px;
  padding: 0;
  background: transparent;
  border-left: 0;
}

.claim-text {
  display: flex;
  flex: 1 1 auto;
  align-items: center;
  min-width: 0;
  padding: 13px 20px;
  background: var(--surface-soft);
  border-left: 6px solid var(--accent);
}

.progress-box {
  flex: 0 0 400px;
  padding: 10px 16px;
  background: #151a1c;
  border: 1px solid var(--line);
}

.progress-label {
  color: var(--text-secondary);
  font-size: var(--fs-label);
  line-height: 1.35;
}

.progress-label strong {
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: var(--fs-body);
}

.layer-scale {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.scale-mark {
  position: relative;
  flex: 1 1 0;
  padding-top: 7px;
  color: var(--text-muted);
  font-size: var(--fs-label);
  line-height: 1.35;
  text-align: center;
  border-top: 3px solid var(--line-strong);
}

.scale-mark.is-current {
  color: var(--primary);
  border-top-color: var(--primary);
  animation: mark-pulse 1.4s ease-in-out infinite;
}

.scale-mark.is-done {
  color: var(--text);
  border-top-color: var(--accent);
}

.system-body {
  position: relative;
  flex: 1 1 0;
  min-height: 0;
  overflow: hidden;
  background: #14191b;
  border: 1px solid var(--line);
}

.scene {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  height: 100%;
  overflow: hidden;
}

.scene-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.hull,
.earth,
.pipe,
.branch,
.loop-path,
.interface-line,
.measure {
  fill: none;
  vector-effect: non-scaling-stroke;
}

.hull {
  stroke: #52605f;
  stroke-width: 2;
  stroke-dasharray: 1280;
  stroke-dashoffset: 1280;
  animation: draw-hull 1.1s var(--ease-out) .28s forwards;
}

.earth {
  stroke: var(--primary-line);
  stroke-width: 3;
  transform: translateY(55px);
  animation: rise-earth .8s var(--ease-out) forwards;
}

.earth-grid {
  fill: none;
  stroke: rgba(85,194,176,.18);
  stroke-width: 1;
}

.measure {
  stroke: var(--line-strong);
  stroke-width: 1;
  stroke-dasharray: 3 8;
}

.interface-line,
.pipe {
  stroke: #52605f;
  stroke-width: 2;
}

.branch {
  stroke: #405052;
  stroke-width: 3;
  stroke-dasharray: 9 9;
  transition: stroke var(--motion-state) var(--ease-out), opacity var(--motion-state) ease;
}

.branch-flow {
  opacity: 0;
  stroke: var(--accent);
  stroke-width: 5;
  stroke-linecap: round;
  stroke-dasharray: 14 34;
  animation: flow 1s linear infinite;
}

.scene[data-active="personal"] .branch-personal,
.scene[data-active="team"] .branch-team,
.scene[data-active="infra"] .branch-infra,
.scene[data-complete="true"] .branch {
  stroke: var(--primary);
  opacity: 1;
}

.scene[data-active="personal"] .flow-personal,
.scene[data-active="team"] .flow-team,
.scene[data-active="infra"] .flow-infra,
.scene[data-complete="true"] .branch-flow {
  opacity: 1;
}

.loop-path {
  opacity: 0;
  stroke: var(--accent);
  stroke-width: 3;
  stroke-dasharray: 12 12;
  transition: opacity var(--motion-state) ease;
  animation: flow 1.2s linear infinite;
}

.scene[data-complete="true"] .loop-path {
  opacity: 1;
}

.person {
  opacity: 0;
  transform: translateY(10px);
  transform-origin: center;
  animation: person-in .55s var(--ease-out) 1.05s forwards;
}

.person-body {
  fill: #263033;
  stroke: #9aaba8;
  stroke-width: 2;
}

.person-visor {
  fill: rgba(85,194,176,.16);
  stroke: var(--primary);
  stroke-width: 2;
}

.node {
  fill: #1a2022;
  stroke: #586765;
  stroke-width: 2;
  transition: fill var(--motion-state) ease, stroke var(--motion-state) ease, transform var(--motion-state) var(--ease-out);
  transform-box: fill-box;
  transform-origin: center;
}

.scene[data-active="personal"] .node-personal,
.scene[data-active="team"] .node-team,
.scene[data-active="infra"] .node-infra,
.scene[data-complete="true"] .node {
  fill: var(--primary);
  stroke: var(--accent);
  transform: scale(1.12);
}

.scene-label {
  position: absolute;
  z-index: 4;
  padding: 5px 8px;
  color: var(--text-secondary);
  background: rgba(20,25,27,.9);
  border-left: 2px solid var(--line-strong);
  font-size: var(--fs-label);
  line-height: 1.35;
  transition: color var(--motion-state) ease, border-color var(--motion-state) ease;
}

.scene-label b {
  display: block;
  color: var(--text);
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
}

.scene[data-active="personal"] .label-personal,
.scene[data-active="team"] .label-team,
.scene[data-active="infra"] .label-infra,
.scene[data-complete="true"] .scene-label {
  color: var(--text);
  border-left-color: var(--accent);
}

.label-personal { left: 40px; top: 58px; }
.label-team { left: 46px; bottom: 76px; }
.label-infra { right: 34px; top: 48px; }
.label-task {
  left: 50%;
  top: 50%;
  border-left-color: var(--accent);
  transform: translate(-49%, 94px);
}

.scene-caption {
  position: absolute;
  right: 24px;
  bottom: 18px;
  max-width: 370px;
  color: var(--text-secondary);
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
  text-align: right;
}

.controls {
  position: relative;
  flex: 0 0 348px;
  height: 100%;
  padding: 22px 22px 18px 28px;
  background: var(--surface-raised);
  border-left: 1px solid var(--line);
}

.controls::before {
  position: absolute;
  top: 22px;
  bottom: 22px;
  left: 12px;
  width: 1px;
  content: "";
  background: var(--line-strong);
}

.controls::after {
  position: absolute;
  top: 22px;
  left: 7px;
  width: 11px;
  height: 1px;
  content: "";
  background: var(--accent);
  box-shadow: 0 116px 0 var(--line-strong), 0 232px 0 var(--line-strong), 0 348px 0 var(--line-strong);
}

.prompt-kicker {
  color: var(--primary);
  font-family: var(--font-mono);
  font-size: var(--fs-label);
  font-weight: 700;
  line-height: 1.35;
}

.prompt {
  min-height: 64px;
  margin-top: 8px;
  color: var(--text);
  font-size: var(--fs-h2);
  font-weight: 650;
  line-height: var(--lh-heading);
}

.choice-set {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 16px;
}

.choice {
  justify-content: flex-start;
  min-height: 48px;
  padding-left: 16px;
  font-size: var(--fs-sec);
  text-align: left;
}

.choice .choice-code {
  width: 32px;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

.choice.is-wrong {
  color: var(--danger);
  border-color: var(--danger);
  animation: wrong-shake 260ms ease-in-out;
}

.feedback {
  min-height: 52px;
  margin-top: 16px;
  padding-left: 12px;
  color: var(--text-secondary);
  border-left: 2px solid var(--primary-line);
  font-size: var(--fs-sec);
  line-height: var(--lh-sec);
}

.feedback.is-error {
  color: var(--danger);
  border-left-color: var(--danger);
}

.reset {
  position: absolute;
  right: 22px;
  bottom: 18px;
  width: 44px;
  min-width: 44px;
  padding: 0;
  color: var(--text-secondary);
}

.reset[hidden] { display: none; }

.reset-glyph {
  font-size: 23px;
  line-height: 1;
}

.supports {
  --support-cols: 3;
  flex: 0 0 126px;
  padding-top: 18px !important;
}

.k-generalization > .supports > .trunk {
  top: -18px;
  height: 18px;
}

.k-generalization > .supports::before {
  top: 12px;
}

.k-generalization .support {
  min-height: 106px;
  padding: 12px 16px;
  transition: color var(--motion-state) ease, background var(--motion-state) ease, border-color var(--motion-state) ease;
}

.k-generalization .support::before {
  height: 18px;
}

.support-title {
  display: block;
  margin-bottom: 4px;
  color: var(--text);
  font-size: var(--fs-h2);
  font-weight: 650;
  line-height: var(--lh-heading);
}

.support.is-active {
  color: var(--text);
  background: var(--primary-soft);
  border-color: var(--primary-line);
  border-top-color: var(--accent);
}

@keyframes rise-earth { to { transform: translateY(0); } }
@keyframes draw-hull { to { stroke-dashoffset: 0; } }
@keyframes person-in { to { opacity: 1; transform: translateY(0); } }
@keyframes flow { to { stroke-dashoffset: -48; } }
@keyframes wrong-shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-7px); }
  55% { transform: translateX(6px); }
  80% { transform: translateX(-3px); }
}
@keyframes mark-pulse { 50% { opacity: .48; } }

@media (prefers-reduced-motion: reduce) {
  .hull, .earth, .person, .branch-flow, .loop-path, .scale-mark, .choice {
    animation: none !important;
    transition-duration: 0ms !important;
  }
  .hull { stroke-dashoffset: 0; }
  .earth { transform: none; }
  .person { opacity: 1; transform: none; }
}
</style>
</head>
<body data-page="40" data-total="44">
<div id="stage">
<main id="main">
  <section class="system-page k-generalization col" aria-labelledby="claim">
    <div class="claim min0">
      <div class="claim-text" id="claim" aria-live="polite">具体行动首先依赖哪一层支撑？从三个情境中归纳。</div>
      <div class="progress-box shrink0" aria-label="识别进度">
        <div class="progress-label">已识别 <strong id="progressCount">0 / 3</strong> 层</div>
        <div class="layer-scale" aria-hidden="true">
          <span class="scale-mark is-current">个人</span>
          <span class="scale-mark">团队</span>

        </div>
      </div>
    </div>

    <div class="system-body row min0">
      <figure class="scene min0" id="scene" data-active="none" data-complete="false" aria-labelledby="sceneSummary">
        <svg class="scene-svg" viewBox="0 0 1020 360" role="img" aria-label="个人、团队与基础设施共同汇入一项舱内任务的系统剖面">
          <path class="earth" d="M-40 370 Q320 236 715 374" />

          <path class="hull" d="M166 83 L812 83 Q871 89 906 126 L906 250 Q838 284 682 291 L274 286 Q184 263 148 210 Z" />
          <path class="measure" d="M40 24 V326 M975 28 V326 M48 60 H77 M48 120 H77 M48 180 H77 M48 240 H77 M48 300 H77" />
          <path class="pipe" d="M666 55 H850 V132 H915 M666 69 H823 V188 H914 M667 84 H790 V246 H910" />

          </g>
        </svg>

        <div class="scene-label label-personal"><b>个人</b>感知 · 判断 · 操作</div>
        <div class="scene-label label-team"><b>团队</b>训练 · 协作 · 保存知识</div>

      <aside class="controls shrink0" aria-labelledby="prompt">

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 40,
  kicker: "SYSTEM, NOT SOLO",
  title: "谁把一个人送进太空？",
  take: "太空探索的主体不是孤立的英雄，而是由个人、团队、工具和基础设施共同组成的系统。个人的勇气与责任真实存在，但只有接入其余支撑，才能转化为可持续的太空能力。"
});

(function () {
  var cases = [
    {
      prompt: "现场出现未预期状况，需要立即判断。",
      answer: "personal",
      success: "个人完成感知与判断，并承担现场责任。",
      errors: {
        team: "这项首先需要现场判断。团队仍提供训练与支持。",
        infra: "这项首先需要现场判断。基础设施仍维持行动条件。"
      }
    },
    {
      prompt: "复杂任务跨越多个岗位，需要同步行动。",
      answer: "team",
      success: "团队把不同岗位接入同一任务，并保存可复用的程序。",
      errors: {
        personal: "这项首先依赖团队协作。个人负责各自的现场环节。",
        infra: "这项首先依赖团队协作。通信设施让协作得以延伸。"
      }
    },
    {
      prompt: "舱内必须持续维持可呼吸环境。",
      answer: "infra",
      success: "舱内基础设施维持环境，团队监测，个人按程序操作。",
      errors: {
        personal: "这项首先依赖舱内基础设施。个人负责操作与响应。",
        team: "这项首先依赖舱内基础设施。团队负责监测与维护。"
      }
    }
  ];

  var step = 0;
  var complete = false;
  var scene = document.getElementById("scene");
  var prompt = document.getElementById("prompt");
  var stepLabel = document.getElementById("stepLabel");
  var feedback = document.getElementById("feedback");
  var count = document.getElementById("progressCount");
  var claim = document.getElementById("claim");
  var reset = document.getElementById("reset");
  var choices = Array.prototype.slice.call(document.querySelectorAll(".choice"));
  var marks = Array.prototype.slice.call(document.querySelectorAll(".scale-mark"));
  var supports = Array.prototype.slice.call(document.querySelectorAll(".support"));

  function paintProgress() {
    count.textContent = step + " / 3";
    marks.forEach(function (mark, i) {
      mark.classList.toggle("is-done", i < step || complete);
      mark.classList.toggle("is-current", !complete && i === step);
    });
  }

  function setActive(layer) {
    scene.dataset.active = layer;
    supports.forEach(function (support) {
      support.classList.toggle("is-active", support.dataset.support === layer || complete);
    });
  }

  function finish() {
    complete = true;
    scene.dataset.complete = "true";
    setActive("all");
    claim.textContent = "太空探索的主体，是个人、团队、工具与基础设施共同组成的系统。";
    stepLabel.textContent = "归纳完成";
    prompt.textContent = "个人的勇气与责任，接入其余支撑后才成为可持续的太空能力。";
    feedback.textContent = "任务表现来自三层协同，不能只归因于画面中央的人。";
    feedback.classList.remove("is-error");
    choices.forEach(function (button) { button.hidden = true; });
    reset.hidden = false;
    paintProgress();
  }

  function advance(layer) {
    var current = cases[step];
    setActive(layer);
    feedback.textContent = current.success;
    feedback.classList.remove("is-error");
    choices.forEach(function (button) {
      button.disabled = true;
      button.setAttribute("aria-pressed", String(button.dataset.layer === layer));
    });
    step += 1;
    paintProgress();

    window.setTimeout(function () {
      if (step >= cases.length) {
        finish();
        return;
      }
      prompt.textContent = cases[step].prompt;
      stepLabel.textContent = "情境 " + (step + 1) + " / 3";
      feedback.textContent = "选择当前首先要观察的层。";
      setActive("none");
      choices.forEach(function (button) {
        button.disabled = false;
        button.setAttribute("aria-pressed", "false");
      });
      choices[0].focus();
    }, Deck.reduced() ? 0 : 720);
  }

  choices.forEach(function (button) {
    button.setAttribute("aria-pressed", "false");
    button.addEventListener("click", function () {
      if (complete) return;
      var selected = button.dataset.layer;
      var current = cases[step];
      if (selected === current.answer) {
        advance(selected);
      } else {
        setActive("none");
        button.classList.remove("is-wrong");
        void button.offsetWidth;
        button.classList.add("is-wrong");
        feedback.textContent = current.errors[selected];
        feedback.classList.add("is-error");
        window.setTimeout(function () { button.classList.remove("is-wrong"); }, 300);
      }
    });
  });

  reset.addEventListener("click", function () {
    step = 0;
    complete = false;
    scene.dataset.complete = "false";
    claim.textContent = "具体行动首先依赖哪一层支撑？从三个情境中归纳。";
    prompt.textContent = cases[0].prompt;
    stepLabel.textContent = "情境 1 / 3";
    feedback.textContent = "选择当前首先要观察的层。";
    feedback.classList.remove("is-error");
    choices.forEach(function (button) {
      button.hidden = false;
      button.disabled = false;
      button.setAttribute("aria-pressed", "false");
    });
    reset.hidden = true;
    setActive("none");
    paintProgress();
    choices[0].focus();
  });

  paintProgress();
})();
</script>
</body>
</html>
