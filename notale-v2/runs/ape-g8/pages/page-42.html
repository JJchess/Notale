<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="42" data-total="44">
<div id="stage">
<main id="main">
<style>
  .synthesis {
    --support-cols: 1;
    position: relative;
    height: 100%;
  }

  .synthesis.k-generalization {
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 14px;
  }

  .system-outline {
    position: absolute;
    z-index: 0;
    inset: 68px 0 72px 0;
    width: 100%;
    height: calc(100% - 140px);
    pointer-events: none;
  }

  .system-outline .continuity {
    fill: none;
    stroke: var(--primary);
    stroke-width: 3;
    stroke-linecap: square;
    stroke-linejoin: round;
    opacity: .72;
  }

  .system-outline .measure {
    fill: none;
    stroke: var(--line-strong);
    stroke-width: 2;
    stroke-dasharray: 8 12;
  }

  .system-outline .interface {
    fill: var(--surface);
    stroke: var(--accent);
    stroke-width: 3;
  }

  .synthesis > .claim,
  .synthesis > .supports,
  .synthesis > .balance {
    z-index: 1;
  }

  .synthesis > .claim {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: none;
    min-height: 54px;
    padding: 10px 22px;
    background: var(--surface-soft);
  }

  .claim-main {
    color: var(--text);
    font-size: var(--fs-lead);
    font-weight: 700;
    line-height: var(--lh-body);
  }

  .claim-premise {
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    font-weight: 500;
    line-height: var(--lh-sec);
  }

  .claim-premise strong {
    color: var(--accent);
  }

  .synthesis > .supports {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 0 0 0 52px;
  }

  .synthesis > .supports::before {
    display: none;
  }

  .synthesis > .supports > .trunk {
    top: 0;
    bottom: -16px;
    left: 24px;
    width: 3px;
    height: auto;
    background: var(--primary);
    transform: scaleY(0);
    transform-origin: top;
    animation: trace-line 420ms ease-out forwards;
  }

  .synthesis .support {
    position: relative;
    display: grid;
    grid-template-columns: 116px 330px 42px minmax(0, 1fr);
    align-items: center;
    flex: 1 1 0;
    min-height: 82px;
    padding: 0 20px;
    color: var(--text);
    background: var(--surface-raised);
    border: 1px solid var(--line-strong);
    border-left: 3px solid var(--primary);
    border-bottom-color: var(--accent-line);
    border-radius: 0;
    opacity: 1;
    transform: translateX(0);
    transform-origin: left center;
    background-image:
      repeating-linear-gradient(
        90deg,
        transparent 0,
        transparent 23px,
        var(--line-strong) 23px,
        var(--line-strong) 24px
      ),
      linear-gradient(
        transparent calc(50% - 1px),
        var(--primary-line) calc(50% - 1px),
        var(--primary-line) 50%,
        transparent 50%
      );
    animation: ledger-in 260ms ease-out backwards;
  }

  .synthesis .support::before {
    top: 50%;
    right: 100%;
    bottom: auto;
    left: auto;
    width: 28px;
    height: 2px;
    background: var(--primary-line);
    transform: none;
  }

  .synthesis .support:nth-of-type(2) { animation-delay: 420ms; }
  .synthesis .support:nth-of-type(3) { animation-delay: 620ms; background-color: var(--surface-soft); }
  .synthesis .support:nth-of-type(4) { animation-delay: 820ms; }
  .synthesis .support:nth-of-type(5) { animation-delay: 1020ms; background-color: var(--surface-soft); }

  .ledger-subject {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    align-self: stretch;
    color: var(--accent);
    font-size: var(--fs-h2);
    font-weight: 700;
    line-height: var(--lh-heading);
    background: var(--surface-strong);
    border-right: 1px solid var(--line-strong);
  }

  .evidence-tag,
  .cell-tag {
    display: block;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: 1.35;
  }

  .ledger-boundary,
  .ledger-dependence {
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
  }

  .ledger-boundary {
    height: 100%;
    display: flex;
    align-items: center;
    color: var(--text);
    background: var(--surface-strong);
    border-left: 1px solid var(--line);
    padding-left: 18px;
  }

  .ledger-dependence {
    height: 100%;
    display: flex;
    align-items: center;
    color: var(--text-secondary);
    background: var(--surface-soft);
    border-left: 1px solid var(--line);
    padding-left: 20px;
  }

  .transfer {
    position: relative;
    align-self: stretch;
    width: 42px;
    height: auto;
    background: var(--surface-raised);
    border-right: 1px solid var(--line-strong);
  }

  .transfer::before {
    position: absolute;
    top: 50%;
    left: 7px;
    width: 26px;
    height: 2px;
    content: "";
    background: var(--accent);
    transform: translateY(-50%);
  }

  .transfer::after {
    position: absolute;
    top: 50%;
    right: 8px;
    width: 8px;
    height: 8px;
    content: "";
    border-top: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
    transform: translateY(-50%) rotate(45deg);
  }

  .ledger-head {
    display: grid;
    grid-template-columns: 116px 330px 42px minmax(0, 1fr);
    align-items: end;
    height: 30px;
    padding: 0 20px 6px;
    color: var(--text-muted);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: 1.35;
    border-bottom: 1px solid var(--line-strong);
  }

  .ledger-head .head-right {
    grid-column: 4;
  }

  .balance {
    position: relative;
    display: grid;
    grid-template-columns: 150px minmax(0, 1fr) auto;
    align-items: center;
    min-height: 78px;
    margin-left: 52px;
    padding: 0 22px;
    background: var(--accent-soft);
    border-top: 2px solid var(--accent);
    opacity: 1;
    transform: translateY(0);
    animation: balance-in 300ms 1280ms ease-out backwards;
  }

  .balance-label {
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 700;
    line-height: 1.35;
  }

  .balance-main {
    color: var(--text);
    font-size: var(--fs-h2);
    font-weight: 700;
    line-height: var(--lh-heading);
  }

  .balance-tail {
    max-width: 510px;
    color: var(--text-secondary);
    font-size: var(--fs-sec);
    line-height: var(--lh-sec);
    text-align: right;
  }

  .motif-node {
    position: absolute;
    left: -38px;
    top: 50%;
    width: 18px;
    height: 18px;
    box-sizing: border-box;
    background: var(--surface);
    border: 3px solid var(--primary);
    transform: translateY(-50%);
  }

  .foot-node { border-radius: 52% 48% 58% 42%; }
  .hand-node { transform: translateY(-50%) rotate(45deg); }
  .group-node { border-radius: 50%; box-shadow: 11px 0 0 -5px var(--surface), 11px 0 0 -2px var(--primary); }
  .cabin-node { width: 22px; border-radius: 9px 2px 9px 2px; }

  @keyframes trace-line { to { transform: scaleY(1); } }
  @keyframes ledger-in {
    from { transform: translateX(-18px); }
    to { transform: translateX(0); }
  }
  @keyframes balance-in {
    from { transform: translateY(18px); }
    to { transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .synthesis > .supports > .trunk,
    .synthesis .support,
    .balance {
      animation: none;
      opacity: 1;
      transform: none;
    }
  }
</style>

<section class="synthesis k-generalization" aria-labelledby="synthesis-claim">
  <svg class="system-outline" viewBox="0 0 1408 480" aria-hidden="true" preserveAspectRatio="none">
    <path class="measure" d="M4 62H1404 M4 174H1404 M4 286H1404 M4 398H1404" />
    <path class="continuity" d="M10 18 C70 18 82 54 48 78 C18 98 20 128 68 142 L104 154 C138 166 128 205 88 216 C45 228 48 267 98 278 L143 290 C188 302 180 340 132 354 L98 364 C58 377 72 430 132 442 L1244 442 C1290 442 1310 420 1310 388 L1310 344 C1310 316 1330 300 1360 300 H1400" />
    <circle class="interface" cx="48" cy="78" r="7" />
    <circle class="interface" cx="88" cy="216" r="7" />
    <circle class="interface" cx="132" cy="354" r="7" />
    <rect class="interface" x="1298" y="332" width="24" height="24" rx="3" />
  </svg>
  <div class="claim" id="synthesis-claim">
    <span class="claim-main">Spaceman 不是离开 Apeman，而是把依赖扩展到工程系统。</span>
    <span class="claim-premise"><strong>前提 E1</strong>：这不是升级阶梯</span>
  </div>

  <div class="supports min0" aria-label="身体、工具、文化与航天器四条支撑总账">
    <span class="trunk" aria-hidden="true"></span>
    <div class="ledger-head" aria-hidden="true">
      <span>支撑</span>
      <span>原有边界被转交</span>
      <span class="head-right">仍然依赖</span>
    </div>

    <article class="support min0">
      <span class="motif-node foot-node" aria-hidden="true"></span>
      <h2 class="ledger-subject"><span class="evidence-tag">E2</span>身体</h2>
      <p class="ledger-boundary"><span class="cell-tag">接口变化</span>直立改变了人与环境的接口</p>
      <span class="transfer" aria-hidden="true"></span>
      <p class="ledger-dependence"><span class="cell-tag">约束保留</span>仍受身体结构与环境约束</p>
    </article>

    <article class="support min0">
      <span class="motif-node hand-node" aria-hidden="true"></span>
      <h2 class="ledger-subject"><span class="evidence-tag">E3</span>工具</h2>
      <p class="ledger-boundary"><span class="cell-tag">接口变化</span>动作被放大、固定并外置</p>
      <span class="transfer" aria-hidden="true"></span>
      <p class="ledger-dependence"><span class="cell-tag">约束保留</span>仍需手、感知和学习来调用</p>
    </article>

    <article class="support min0">
      <span class="motif-node group-node" aria-hidden="true"></span>
      <h2 class="ledger-subject"><span class="evidence-tag">E4</span>文化</h2>
      <p class="ledger-boundary"><span class="cell-tag">接口变化</span>技能越过个人寿命被群体保存</p>
      <span class="transfer" aria-hidden="true"></span>
      <p class="ledger-dependence"><span class="cell-tag">约束保留</span>仍需模仿、合作、符号与纠正</p>
    </article>

    <article class="support min0">
      <span class="motif-node cabin-node" aria-hidden="true"></span>
      <h2 class="ledger-subject"><span class="evidence-tag">E5</span>航天器</h2>
      <p class="ledger-boundary"><span class="cell-tag">接口变化</span>生存条件被工程系统接管</p>
      <span class="transfer" aria-hidden="true"></span>
      <p class="ledger-dependence"><span class="cell-tag">约束保留</span>人体依赖延伸到更长的维护链</p>
    </article>
  </div>

  <div class="balance" aria-label="总账结余">
    <span class="balance-label">总账结余</span>
    <strong class="balance-main">能力扩大，不等于依赖减少。</strong>
    <span class="balance-tail">改变的是人与环境之间的接口，不是人的生物出身。</span>
  </div>
</section>
</main>
</div>

  });
</script>
