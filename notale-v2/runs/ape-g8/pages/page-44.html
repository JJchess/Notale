<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root {
    --bg: #111417;
    --text: #edf2f0;
    --font-sans: Inter, "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
  }

  #main {
    isolation: isolate;
  }

  .final-scene {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .system-outline {
    position: absolute;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
  }

  .system-outline path,
  .system-outline line,
  .system-outline circle {
    vector-effect: non-scaling-stroke;
  }

  .earth-arc,
  .horizon-echo {
    fill: none;
    stroke-dasharray: 1900;
    stroke-dashoffset: 1900;
    animation: trace 900ms ease-out forwards;
  }

  .earth-arc {
    stroke: var(--primary);
    stroke-width: 3;
  }

  .horizon-echo {
    stroke: var(--primary-line);
    stroke-width: 1;
    animation-delay: 100ms;
  }

  .continuity,
  .body-line,
  .pipe,
  .port,
  .tickmark {
    opacity: 0;
    animation: connect 700ms ease-out 650ms forwards;
  }

  .continuity,
  .pipe {
    fill: none;
    stroke: var(--primary);
    stroke-width: 2;
  }

  .body-line {
    fill: rgba(85, 194, 176, 0.04);
    stroke: var(--primary);
    stroke-width: 2.4;
  }

  .pipe {
    stroke-width: 5;
  }

  .port {
    fill: var(--surface);
    stroke: var(--accent);
    stroke-width: 2;
  }

  .tickmark {
    stroke: var(--line-strong);
    stroke-width: 1;
  }

  .peer-line {
    position: absolute;
    z-index: 1;
    top: 82px;
    left: 2%;
    width: 96%;
    height: 1px;
    background: var(--primary-line);
    opacity: 0;
    animation: connect 500ms ease-out 950ms forwards;
  }

  .peer-line::before,
  .peer-line::after {
    position: absolute;
    top: -4px;
    width: 9px;
    height: 9px;
    content: "";
    background: var(--surface);
    border: 1px solid var(--primary);
    border-radius: 50%;
  }

  .peer-line::before { left: 0; }
  .peer-line::after { right: 0; }

  .k-enumeration.final-peers {
    --enum-cols: 4;
    position: absolute;
    z-index: 2;
    top: 24px;
    right: 0;
    left: 0;
    gap: 56px;
  }

  .k-enumeration.final-peers > .it {
    grid-template-columns: 36px minmax(0, 1fr);
    align-items: center;
    min-height: 116px;
    padding: 20px 12px;
    background: transparent;
    border: 0;
    border-radius: 0;
    opacity: 0;
    transform: translateY(10px);
    animation: item-in 420ms ease-out forwards;
  }

  .k-enumeration.final-peers > .it:nth-child(1) { animation-delay: 1050ms; }
  .k-enumeration.final-peers > .it:nth-child(2) { animation-delay: 1180ms; }
  .k-enumeration.final-peers > .it:nth-child(3) { animation-delay: 1310ms; }
  .k-enumeration.final-peers > .it:nth-child(4) { animation-delay: 1440ms; }

  .k-enumeration.final-peers > .it::before {
    width: 32px;
    height: 32px;
    background: var(--surface);
    font-size: var(--fs-label);
  }

  .k-enumeration.final-peers > .it > .it-title {
    display: inline-flex;
    gap: 0;
    font-size: 24px;
    font-weight: 650;
    line-height: 1.35;
    white-space: nowrap;
  }

  .final-claim {
    position: absolute;
    z-index: 4;
    top: 205px;
    right: 160px;
    left: 160px;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--text);
    font-size: 38px;
    font-weight: 700;
    line-height: 1.45;
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    animation: claim-in 600ms ease-out 1750ms forwards;
  }

  .claim-line {
    display: block;
  }

  .claim-line:first-child {
    margin-bottom: 4px;
    color: var(--text-secondary);
    font-size: 24px;
    font-weight: 600;
  }

  .environment-interface {
    color: var(--accent);
  }

  .biological-origin {
    color: var(--primary);
  }

  .continuity-caption {
    position: absolute;
    z-index: 3;
    bottom: 32px;
    left: 50%;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    line-height: 1.35;
    opacity: 0;
    transform: translateX(-50%);
    animation: connect 500ms ease-out 1450ms forwards;
  }

  .continuity-caption::before,
  .continuity-caption::after {
    width: 56px;
    height: 1px;
    content: "";
    background: var(--primary-line);
  }

  @keyframes trace {
    to { stroke-dashoffset: 0; }
  }

  @keyframes connect {
    to { opacity: 1; }
  }

  @keyframes item-in {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes claim-in {
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .earth-arc,
    .horizon-echo,
    .continuity,
    .body-line,
    .pipe,
    .port,
    .tickmark,
    .peer-line,
    .k-enumeration.final-peers > .it,
    .final-claim,
    .continuity-caption {
      animation: none;
      opacity: 1;
      stroke-dashoffset: 0;
      transform: none;
    }

    .continuity-caption {
      transform: translateX(-50%);
    }
  }
</style>
</head>
