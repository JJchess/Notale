<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lec-progress {
    overflow: visible;
  }

  .route-page {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .route-intro {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex: 0 0 44px;
    min-width: 0;
    padding: 0 var(--sp-4) 0 104px;
    border-bottom: var(--border);
  }

  .route-intro p {
    display: flex;
    align-items: center;
    align-self: stretch;
    width: 880px;
    box-sizing: border-box;
    padding: 0 var(--sp-4);
    color: var(--text-strong);
    font-size: var(--fs-lead);
    font-weight: 700;
    line-height: var(--lh-copy);
    border-left: 3px solid var(--primary);
    background: var(--surface-teal);
  }

  .route-intro .route-key {
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 600;
    line-height: 1.35;
  }

  .ledger-head,
  .route-ledger > .it {
    display: grid;
    grid-template-columns: 80px 160px 360px minmax(0, 1fr) 150px;
    align-items: center;
    min-width: 0;
  }

  .ledger-head {
    flex: 0 0 42px;
    padding: 0 var(--sp-4);
    color: var(--text-faint);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 600;
    line-height: 1.35;
    border-bottom: 2px solid var(--line-strong);
  }

  .ledger-head span {
    display: flex;
    align-items: center;
    align-self: stretch;
    padding: 0 var(--sp-4);
    border-left: var(--border);
    background: var(--surface-1);
  }

  .ledger-head span:first-child {
    grid-column: 2;
  }

  .ledger-head span:last-child {
    border-right: var(--border);
  }

  .route-ledger.k-enumeration {
    --enum-cols: 1;
    position: relative;
    display: grid;
    flex: 1 1 0;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: repeat(4, minmax(0, 1fr));
    gap: 0;
    min-width: 0;
    min-height: 0;
    padding: 0 var(--sp-4);
  }

  .route-ledger::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 56px;
    width: 3px;
    background: var(--primary-dark);
    transform: scaleY(0);
    transform-origin: top;
    animation: trunk-grow 520ms 180ms ease-out forwards;
  }

  .route-ledger.k-enumeration > .it {
    position: relative;
    grid-template-rows: none;
    width: 100%;
    min-height: 0;
    box-sizing: border-box;
    padding: var(--sp-3) 0;
    opacity: 1;
    border: 0;
    border-right: var(--border);
    border-bottom: var(--border);
    border-left: var(--border);
    border-radius: 0;
    background: var(--surface-1);
    box-shadow: inset 4px 0 0 var(--primary-dark);
    transform: translateX(0);
    animation: row-enter 360ms ease-out both;
  }

  .route-ledger.k-enumeration > .it:first-child {
    border-top: var(--border);
  }

  .route-ledger.k-enumeration > .it:last-child {
    border-bottom: var(--border);
  }

  .route-ledger.k-enumeration > .it.is-current {
    background: linear-gradient(90deg, var(--surface-yellow), var(--surface-1) 46%);
    box-shadow: inset 4px 0 0 var(--accent);
  }

  .route-ledger.k-enumeration > .it:nth-child(1) { animation-delay: 300ms; }
  .route-ledger.k-enumeration > .it:nth-child(2) { animation-delay: 420ms; }
  .route-ledger.k-enumeration > .it:nth-child(3) { animation-delay: 540ms; }
  .route-ledger.k-enumeration > .it:nth-child(4) { animation-delay: 660ms; }

  .route-ledger > .it::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 38px;
    width: 38px;
    height: 2px;
    background: var(--primary-dark);
  }

  .route-ledger > .it.is-current::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 0;
    width: 28px;
    height: 4px;
    background: var(--accent);
    transform: translateY(-50%);
  }

  .route-num {
    position: relative;
    z-index: 1;
    display: grid;
    align-self: stretch;
    width: 80px;
    place-items: center;
    color: var(--primary-bright);
    font-family: var(--font-mono);
    font-size: var(--fs-lead);
    font-weight: 700;
    line-height: 1;
    border-right: var(--border);
    background: var(--surface-teal);
  }

  .route-num::before {
    content: "";
    position: absolute;
    left: 38px;
    width: 38px;
    height: 38px;
    border: 2px solid var(--primary-dark);
    border-radius: 50%;
    background: var(--surface-0);
    z-index: -1;
  }

  .is-current .route-num {
    color: var(--accent);
  }

  .is-current .route-num::before {
    border-color: var(--accent);
  }

  .route-object {
    display: flex;
    align-items: center;
    align-self: stretch;
    min-width: 0;
    padding: 0 var(--sp-4);
    color: var(--text-strong);
    border-left: var(--border);
    background: var(--surface-2);
    font-family: var(--font-narrow);
    font-size: var(--fs-h2);
    font-weight: 700;
    line-height: 1.3;
  }

  .route-question,
  .route-action {
    display: flex;
    align-items: center;
    align-self: stretch;
    min-width: 0;
    padding: 0 var(--sp-5);
    font-size: var(--fs-body);
    border-left: var(--border);
    line-height: var(--lh-copy);
  }

  .route-question {
    color: var(--text-strong);
    font-weight: 600;
    background: rgba(204, 229, 225, 0.035);
  }

  .route-action {
    color: var(--text-muted);
    background: rgba(53, 198, 180, 0.055);
  }

  .route-mark {
    position: relative;
    display: grid;
    width: 112px;
    height: 70px;
    place-items: center;
    justify-self: stretch;
    border-left: var(--border);
    background: var(--surface-teal);
  }

  .body-core {
    position: relative;
    width: 24px;
    height: 36px;
    border: 2px solid var(--primary-bright);
    border-radius: 50% 50% var(--radius-2) var(--radius-2);
  }

  .body-core::before {
    content: "";
    position: absolute;
    top: -15px;
    left: 50%;
    width: 14px;
    height: 14px;
    border: 2px solid var(--primary-bright);
    border-radius: 50%;
    transform: translateX(-50%);
  }

  .route-mark .ring {
    position: absolute;
    border: 2px solid var(--primary-dark);
    border-radius: 50%;
  }

  .mark-culture .ring-a { width: 64px; height: 48px; }
  .mark-culture .ring-b { width: 92px; height: 62px; border-style: dashed; }
  .mark-culture .tool {
    position: absolute;
    top: 7px;
    right: 5px;
    width: 24px;
    height: 5px;
    background: var(--primary-bright);
    transform: rotate(-28deg);
  }

  .mark-space .cabin {
    position: absolute;
    width: 82px;
    height: 58px;
    border: 2px solid var(--primary-dark);
    border-radius: var(--radius-3);
  }

  .mark-space .constraint {
    position: absolute;
    right: 0;
    width: 35px;
    height: 2px;
    background: var(--accent);
  }

  .mark-space .constraint::before,
  .mark-space .constraint::after {
    content: "";
    position: absolute;
    right: 0;
    width: 8px;
    height: 8px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    background: var(--surface-0);
    transform: translateY(-43%);
  }

  .mark-choice .loop {
    position: absolute;
    width: 94px;
    height: 58px;
    border: 2px solid var(--primary-bright);
    border-right-color: transparent;
    border-radius: 50%;
    clip-path: inset(0 0 0 0);
    stroke-dasharray: 200;
    animation: loop-finish 420ms 860ms ease-out both;
  }

  .mark-choice .loop::before,
  .mark-choice .loop::after {
    content: "";
    position: absolute;
    right: -2px;
    width: 11px;
    height: 2px;
    background: var(--primary-bright);
    transform-origin: right center;
  }

  .mark-choice .loop::before { top: 5px; transform: rotate(32deg); }
  .mark-choice .loop::after { bottom: 5px; transform: rotate(-32deg); }

  .route-close {
    position: relative;
    display: flex;
    flex: 0 0 54px;
    align-items: center;
    justify-content: space-between;
    min-width: 0;
    padding: 0 176px 0 104px;
    border-top: 2px solid var(--primary-dark);
    background: linear-gradient(90deg, var(--surface-teal), transparent 68%);
  }

  .route-close p {
    display: flex;
    align-items: center;
    align-self: stretch;
    width: 920px;
    box-sizing: border-box;
    padding: 0 var(--sp-5);
    color: var(--text-strong);
    font-size: var(--fs-lead);
    font-weight: 700;
    line-height: var(--lh-copy);
    border-left: 4px solid var(--accent);
    background: var(--surface-yellow);
  }

  .earth-arc {
    position: absolute;
    right: 2px;
    bottom: 2px;
    width: 300px;
    height: 48px;
    border-top: 3px solid var(--primary-bright);
    border-radius: 50% 50% 0 0;
    box-shadow: 0 -2px 16px rgba(53, 198, 180, 0.34);
    opacity: 0;
    transform: scaleX(0.2);
    transform-origin: left center;
    animation: horizon-enter 440ms ease-out forwards;
    pointer-events: none;
  }

  @keyframes horizon-enter {
    to { opacity: 1; transform: scaleX(1); }
  }

  @keyframes trunk-grow {
    to { transform: scaleY(1); }
  }

  @keyframes row-enter {
    from { opacity: 0.18; transform: translateX(-16px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes loop-finish {
    from { opacity: 0; transform: rotate(-18deg) scale(0.88); }
    to { opacity: 1; transform: rotate(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .earth-arc,
    .route-ledger::before,
    .route-ledger.k-enumeration > .it,
    .mark-choice .loop {
      animation: none;
      opacity: 1;
      transform: none;
    }
  }
</style>
</head>
<body data-page="02" data-total="52">
<div id="stage">
<main id="main">
  <section class="route-page min0" aria-labelledby="route-summary">
    <div class="route-intro min0">
      <p id="route-summary">这不是四个互不相干的话题，而是全课依次检查的四层条件。</p>
      <span class="route-key">COURSE MAP</span>
    </div>

    <div class="ledger-head" aria-hidden="true">
      <span>对象</span>
      <span>核心问题</span>
      <span>本课动作</span>
      <span>路线标记</span>
    </div>

    <div class="k-enumeration route-ledger min0" role="list" aria-label="全课四个并列站点">
      <article class="it is-current min0" role="listitem" aria-current="step">
        <span class="route-num">01</span>
        <h2 class="route-object">身体</h2>
        <p class="route-question">我们带着怎样的灵长类身体？</p>
        <p class="route-action">检查它的来处、能力与边界</p>
        <div class="route-mark mark-body" aria-hidden="true">
          <span class="body-core"></span>
        </div>
      </article>

      <article class="it min0" role="listitem">
        <span class="route-num">02</span>
        <h2 class="route-object">文化</h2>
        <p class="route-question">身体没快速改变，能力为何能累积？</p>
        <p class="route-action">追踪工具、知识与合作如何接力</p>
        <div class="route-mark mark-culture" aria-hidden="true">
          <span class="ring ring-a"></span>
          <span class="ring ring-b"></span>
          <span class="body-core"></span>
          <span class="tool"></span>
        </div>
      </article>

      <article class="it min0" role="listitem">
        <span class="route-num">03</span>
        <h2 class="route-object">太空约束</h2>
        <p class="route-question">离开地表后，什么不能靠想象绕过？</p>
        <p class="route-action">对照重力、能量、质量与生命保障</p>
        <div class="route-mark mark-space" aria-hidden="true">
          <span class="cabin"></span>
          <span class="body-core"></span>
          <span class="constraint"></span>
        </div>
      </article>

      <article class="it min0" role="listitem">
        <span class="route-num">04</span>
        <h2 class="route-object">选择</h2>
        <p class="route-question">能去之后，要把什么带向远方？</p>
        <p class="route-action">权衡环境、身体与制度的改变</p>
        <div class="route-mark mark-choice" aria-hidden="true">
          <span class="loop"></span>
          <span class="body-core"></span>
        </div>
      </article>
    </div>

    <div class="route-close">
      <p>全课沿身体、文化、太空约束和选择四步推进。</p>
    </div>
    <div class="earth-arc" aria-hidden="true"></div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Lec.mount({index: "02", kicker: "ROUTE / 04", title: "从身体出发，抵达选择", take: "全课沿身体、文化、太空约束和选择四步推进。"});
</script>
</body>
</html>
