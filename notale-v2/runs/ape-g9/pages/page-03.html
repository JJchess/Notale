<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main {
    --scene-h: 470px;
  }

  .lec-progress {
    overflow: visible;
  }

  .identity-page {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    gap: var(--sp-4);
  }

  .prompt-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-5);
    min-height: 42px;
  }

  .prompt-line h2 {
    color: var(--text-strong);
    font-size: var(--fs-lead);
  }

  .vote-count {
    flex: 0 0 auto;
    color: var(--primary-bright);
    font-family: var(--font-mono);
    font-size: var(--fs-sec);
    font-weight: 700;
  }

  .identity-stage {
    position: relative;
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    gap: var(--sp-6);
    min-height: var(--scene-h);
    padding: var(--sp-3) var(--sp-5);
    box-sizing: border-box;
    border: var(--border);
    border-left: 3px solid var(--primary-dark);
    border-radius: var(--radius-3);
    background:
      linear-gradient(90deg, transparent, var(--surface-teal) 50%, transparent),
      var(--surface-1);
  }

  .boundary-map {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .boundary-map line,
  .boundary-map ellipse {
    fill: none;
    stroke: var(--primary-dark);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  .boundary-map .outer {
    stroke: var(--line-strong);
    stroke-dasharray: 8 8;
  }

  .boundary-column {
    display: flex;
    flex: 0 0 480px;
    flex-direction: column;
    justify-content: space-between;
    gap: var(--sp-4);
    min-width: 0;
    z-index: 2;
  }

  .definition.choice {
    position: relative;
    display: block;
    width: 100%;
    min-height: 198px;
    padding: var(--sp-6);
    text-align: left;
    border-left: 4px solid var(--primary-dark);
    background: var(--surface-1);
  }

  .definition.choice:hover {
    border-left-color: var(--primary);
  }

  .definition.choice[aria-pressed="true"] {
    color: var(--text-strong);
    border: 2px solid var(--accent);
    border-left: 5px solid var(--accent);
    background: var(--surface-yellow);
    box-shadow: 0 0 0 2px rgba(255, 204, 77, 0.12);
  }

  .definition-name {
    display: block;
    color: var(--text-strong);
    font-family: var(--font-narrow);
    font-size: var(--fs-h2);
    font-weight: 700;
    line-height: 1.3;
  }

  .definition-test {
    display: block;
    margin-top: var(--sp-1);
    color: var(--text-muted);
    font-size: var(--fs-sec);
    font-weight: 400;
    line-height: var(--lh-copy);
  }

  .definition[aria-pressed="true"] .definition-test {
    color: var(--text-strong);
  }

  .boundary-preview {
    display: flex;
    margin-top: var(--sp-4);
    border-top: var(--border);
  }

  .preview-branch {
    flex: 1 1 0;
    padding-top: var(--sp-3);
    color: var(--primary-bright);
    font-size: var(--fs-label);
    line-height: 1.35;
    text-align: center;
  }

  .preview-branch + .preview-branch {
    border-left: var(--border);
  }

  .preview-branch.out {
    color: var(--text-muted);
  }

  .definition[aria-pressed="true"]::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 76px;
    height: 2px;
    background: var(--accent);
  }

  .boundary-column:first-child .definition[aria-pressed="true"]::after {
    left: 100%;
  }

  .boundary-column:last-child .definition[aria-pressed="true"]::after {
    right: 100%;
  }

  .person-system {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--line-strong);
    border-left: 4px solid var(--primary);
    border-radius: var(--radius-3);
    background: var(--surface-teal);
  }

  .system-ring {
    position: absolute;
    left: 50%;
    top: 50%;
    border: 2px solid var(--primary-dark);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.74;
  }

  .ring-body { width: 128px; height: 220px; }
  .ring-role { width: 190px; height: 258px; border-style: dashed; }
  .ring-life { width: 258px; height: 282px; border-color: var(--line-strong); }

  .person-system[data-selected="location"] .ring-life,
  .person-system[data-selected="system"] .ring-life,
  .person-system[data-selected="profession"] .ring-role,
  .person-system[data-selected="body"] .ring-body {
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(255, 204, 77, 0.18);
    opacity: 1;
  }

  .ring-label {
    position: absolute;
    left: 50%;
    padding: 0 var(--sp-2);
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: 1.35;
    white-space: nowrap;
    background: var(--bg);
    transform: translateX(-50%);
  }

  .label-life { top: 4px; }
  .label-role { top: 28px; }
  .label-body { top: 51px; }

  .person {
    position: relative;
    width: 92px;
    height: 190px;
    z-index: 1;
  }

  .helmet {
    position: absolute;
    top: 0;
    left: 24px;
    width: 44px;
    height: 48px;
    border: 3px solid var(--primary-bright);
    border-radius: 50% 50% 44% 44%;
    background: var(--surface-2);
  }

  .visor {
    position: absolute;
    top: 11px;
    left: 7px;
    width: 30px;
    height: 18px;
    border-radius: 50% 50% 42% 42%;
    background: var(--surface-teal);
    border: 1px solid var(--line-strong);
  }

  .torso {
    position: absolute;
    top: 48px;
    left: 19px;
    width: 54px;
    height: 78px;
    border: 3px solid var(--primary-bright);
    border-radius: var(--radius-3);
    background: var(--surface-2);
  }

  .badge {
    position: absolute;
    top: 15px;
    left: 12px;
    width: 12px;
    height: 12px;
    border: 2px solid var(--primary);
    transform: rotate(45deg);
  }

  .limb {
    position: absolute;
    width: 16px;
    border: 3px solid var(--primary-bright);
    border-radius: var(--radius-3);
    background: var(--surface-2);
  }

  .arm-left { top: 57px; left: 2px; height: 76px; transform: rotate(9deg); }
  .arm-right { top: 57px; right: 2px; height: 76px; transform: rotate(-9deg); }
  .leg-left { top: 121px; left: 24px; height: 66px; transform: rotate(3deg); }
  .leg-right { top: 121px; right: 24px; height: 66px; transform: rotate(-3deg); }

  .model-note {
    position: absolute;
    left: 50%;
    width: 270px;
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
    text-align: center;
    transform: translateX(-50%);
  }

  .model-note.top { top: 62px; }
  .model-note.bottom { bottom: 34px; }

  .person-caption {
    position: absolute;
    bottom: 8px;
    left: 50%;
    color: var(--text-strong);
    font-size: var(--fs-sec);
    font-weight: 700;
    white-space: nowrap;
    transform: translateX(-50%);
    z-index: 2;
  }

  .action-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-4);
    min-height: 48px;
  }

  .feedback {
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
  }

  .feedback.is-error {
    color: var(--danger);
  }

  #confirmBtn,
  #resetBtn {
    flex: 0 0 auto;
    min-width: 128px;
    font-size: var(--fs-sec);
  }

  .shake {
    animation: shake 240ms ease-in-out 2;
  }

  .results-wrap {
    position: relative;
    display: none;
    flex: 1 1 0;
    min-height: 0;
  }

  .result-map {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .result-map path {
    fill: none;
    stroke: var(--primary-dark);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  .classification-results {
    position: relative;
    z-index: 1;
  }

  .identity-page.is-complete {
    gap: var(--sp-3);
  }

  .identity-page.is-complete .identity-stage {
    min-height: 156px;
    padding-block: var(--sp-2);
  }

  .identity-page.is-complete .boundary-column {
    flex-basis: 390px;
    flex-direction: row;
    flex-wrap: wrap;
    align-content: center;
    gap: var(--sp-2);
  }

  .identity-page.is-complete .definition.choice {
    width: calc(50% - var(--sp-1));
    min-height: 58px;
    padding: var(--sp-2) var(--sp-3);
  }

  .identity-page.is-complete .definition-name {
    font-size: var(--fs-lead);
  }

  .identity-page.is-complete .definition-test,
  .identity-page.is-complete .boundary-preview,
  .identity-page.is-complete .ring-label,
  .identity-page.is-complete .model-note,
  .identity-page.is-complete .ring-role,
  .identity-page.is-complete .ring-life,
  .identity-page.is-complete .person-caption {
    display: none;
  }

  .identity-page.is-complete .ring-body {
    width: 92px;
    height: 136px;
  }

  .identity-page.is-complete .person {
    transform: scale(0.68);
  }

  .identity-page.is-complete .results-wrap {
    display: flex;
  }

  .classification-results {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: var(--sp-2);
    height: 100%;
  }

  .classification-results .lv.result-row {
    display: flex;
    flex: 1 1 0;
    min-height: 0;
    margin-left: 0;
    padding-left: var(--sp-5);
  }

  .classification-results .lv.result-row::before {
    top: 50%;
  }

  .result-row > .box {
    display: flex;
    flex: 1 1 0;
    align-items: stretch;
    min-width: 0;
    padding: 0;
    overflow: hidden;
  }

  .result-row .bt {
    display: flex;
    flex: 0 0 180px;
    align-items: center;
    margin: 0;
    padding: var(--sp-2) var(--sp-4);
    border-right: var(--border);
    border-bottom: 0;
  }

  .branches {
    display: flex;
    flex: 1 1 0;
    min-width: 0;
  }

  .branch {
    display: flex;
    flex: 1 1 0;
    align-items: center;
    gap: var(--sp-3);
    min-width: 0;
    padding: var(--sp-2) var(--sp-4);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
  }

  .branch + .branch {
    border-left: var(--border);
  }

  .branch-key {
    flex: 0 0 auto;
    color: var(--primary-bright);
    font-weight: 700;
  }

  .branch.out .branch-key {
    color: var(--text-muted);
  }

  .result-row.is-selected > .box {
    border-color: var(--accent);
    border-left-color: var(--accent);
    background: var(--surface-yellow);
  }

  .result-row.is-selected .branch-key {
    color: var(--accent);
  }

  .conclusion {
    display: none;
    padding: var(--sp-3) var(--sp-5);
    color: var(--text-strong);
    font-size: var(--fs-lead);
    font-weight: 700;
    line-height: var(--lh-copy);
    border-left: 6px solid var(--accent);
    background: var(--surface-yellow);
  }

  .identity-page.is-complete .conclusion {
    display: block;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    35% { transform: translateX(-8px); }
    70% { transform: translateX(8px); }
  }

  @media (prefers-reduced-motion: no-preference) {
    .person { animation: person-enter 420ms ease-out both; }
    .ring-body { animation: ring-enter 360ms 120ms ease-out both; }
    .ring-role { animation: ring-enter 360ms 210ms ease-out both; }
    .ring-life { animation: ring-enter 360ms 300ms ease-out both; }
    .boundary-column:first-child { animation: left-enter 360ms 280ms ease-out both; }
    .boundary-column:last-child { animation: right-enter 360ms 280ms ease-out both; }
  }

  @keyframes person-enter {
    from { opacity: 0; transform: translateY(22px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes ring-enter {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
  }

  @keyframes left-enter {
    from { opacity: 0; transform: translateX(-24px); }
  }

  @keyframes right-enter {
    from { opacity: 0; transform: translateX(24px); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body data-page="03" data-total="52">
<div id="stage">
<main id="main">
  <section class="identity-page" id="identityPage" aria-labelledby="voteQuestion">
    <div class="prompt-line">
      <h2 id="voteQuestion">如果只能选一条，你会用什么来定义“太空人”？</h2>
      <div class="vote-count" id="voteCount" aria-live="polite">投票 0 / 1</div>
    </div>

    <div class="identity-stage">
      <svg class="boundary-map" viewBox="0 0 1408 470" preserveAspectRatio="none" aria-hidden="true">
        <line x1="440" y1="104" x2="610" y2="190"></line>
        <line x1="440" y1="366" x2="610" y2="280"></line>
        <line x1="968" y1="104" x2="798" y2="190"></line>
        <line x1="968" y1="366" x2="798" y2="280"></line>
        <ellipse cx="704" cy="235" rx="94" ry="150"></ellipse>
        <ellipse class="outer" cx="704" cy="235" rx="134" ry="190"></ellipse>
      </svg>
      <div class="boundary-column min0">
        <button class="definition choice" type="button" data-boundary="location" aria-pressed="false">
          <span class="definition-name">地点</span>
          <span class="definition-test">此刻位于约定的太空边界之外</span>
          <span class="boundary-preview"><span class="preview-branch">纳入</span><span class="preview-branch out">排除</span></span>
        </button>
        <button class="definition choice" type="button" data-boundary="body" aria-pressed="false">
          <span class="definition-name">身体状态</span>
          <span class="definition-test">身体正在经历或恢复于太空环境变化</span>
          <span class="boundary-preview"><span class="preview-branch">纳入</span><span class="preview-branch out">排除</span></span>
        </button>
      </div>

      <figure class="person-system min0" id="personSystem" data-selected="none" aria-label="同一名任务参与者，外层依次显示身体、职业角色与生命支持系统边界">
        <div class="system-ring ring-life" aria-hidden="true"></div>
        <span class="ring-label label-life">舱体与生命支持</span>
        <div class="system-ring ring-role" aria-hidden="true"></div>
        <span class="ring-label label-role">职业角色</span>
        <div class="system-ring ring-body" aria-hidden="true"></div>
        <span class="ring-label label-body">身体</span>
        <div class="person" aria-hidden="true">
          <div class="helmet"><div class="visor"></div></div>
          <div class="torso"><div class="badge"></div></div>
          <div class="limb arm-left"></div>
          <div class="limb arm-right"></div>
          <div class="limb leg-left"></div>
          <div class="limb leg-right"></div>
        </div>
        <p class="model-note top">每条判据形成自己的纳入与排除边界。</p>
        <p class="model-note bottom">四种边界并列，不是四类互斥人群。</p>
        <figcaption class="person-caption">同一个人，不同判据</figcaption>
      </figure>

      <div class="boundary-column min0">
        <button class="definition choice" type="button" data-boundary="profession" aria-pressed="false">
          <span class="definition-name">职业</span>
          <span class="definition-test">以受训任务角色参与载人航天</span>
          <span class="boundary-preview"><span class="preview-branch">纳入</span><span class="preview-branch out">排除</span></span>
        </button>
        <button class="definition choice" type="button" data-boundary="system" aria-pressed="false">
          <span class="definition-name">系统依赖</span>
          <span class="definition-test">此刻生存直接依靠舱体与地面协作</span>
          <span class="boundary-preview"><span class="preview-branch">纳入</span><span class="preview-branch out">排除</span></span>
        </button>
      </div>
    </div>

    <div class="action-line">
      <p class="feedback" id="feedback" aria-live="polite">先选择一条定义边界；这里没有唯一正确答案。</p>
      <button class="btn is-primary" id="confirmBtn" type="button">确认选择</button>
      <button class="btn" id="resetBtn" type="button" hidden>更换选择</button>
    </div>

    <div class="results-wrap min0" id="resultsWrap">
      <svg class="result-map" viewBox="0 0 1408 300" preserveAspectRatio="none" aria-hidden="true">
        <path d="M24 37 H196 M196 37 H1400"></path>
        <path d="M24 112 H196 M196 112 H1400"></path>
        <path d="M24 188 H196 M196 188 H1400"></path>
        <path d="M24 263 H196 M196 263 H1400"></path>
      </svg>
      <div class="k-classification classification-results grow min0" aria-label="四种定义边界的纳入与排除结果">
        <div class="lv result-row" data-row="location" style="--level:0">

            <div class="bt">地点边界</div>

          <div class="box">
            <div class="bt">职业边界</div>
            <div class="branches min0">
              <div class="branch in"><span class="branch-key">纳入</span><span>地面待命的职业航天员</span></div>
              <div class="branch out"><span class="branch-key">排除</span><span>在轨游客</span></div>

            <div class="bt">身体状态边界</div>

          <div class="box">
            <div class="bt">系统依赖边界</div>
            <div class="branches min0">
              <div class="branch in"><span class="branch-key">纳入</span><span>在轨游客</span></div>
              <div class="branch out"><span class="branch-key">排除</span><span>已返航的职业航天员</span></div>

          </div>
        </div>
      </div>
    </div>

    <p class="conclusion">“太空人”没有唯一的天然边界。先说明采用哪条判据，身份判断才有可讨论的意义。</p>
  </section>
</main>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Lec.mount({index: 3, kicker: "IDENTITY / 身份边界", title: "谁算“太空人”？", take: "“太空人”可以按地点、职业、身体状态或系统依赖来定义。"});

  (function () {
    const page = document.getElementById('identityPage');
    const choices = Array.from(document.querySelectorAll('.definition'));
    const personSystem = document.getElementById('personSystem');
    const voteCount = document.getElementById('voteCount');
    const feedback = document.getElementById('feedback');
    const confirmBtn = document.getElementById('confirmBtn');
    const resetBtn = document.getElementById('resetBtn');
    let selected = null;

    const boundaryNames = {
      location: '地点',
      profession: '职业',
      body: '身体状态',
      system: '系统依赖'
    };

    function selectBoundary(boundary) {
      selected = boundary;
      choices.forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.boundary === boundary));
      });
      personSystem.dataset.selected = boundary;
      feedback.classList.remove('is-error');
      feedback.textContent = '已选择“' + boundaryNames[boundary] + '”。确认后比较四种边界。';
    }

    function submitVote() {
      if (!selected) {
        feedback.classList.add('is-error');
        feedback.textContent = '先选择一条定义边界；这里没有唯一正确答案。';
        confirmBtn.classList.remove('shake');
        void confirmBtn.offsetWidth;
        confirmBtn.classList.add('shake');
        return;
      }

      page.classList.add('is-complete');
      document.querySelectorAll('.result-row').forEach((row) => {
        row.classList.toggle('is-selected', row.dataset.row === selected);
      });
      voteCount.textContent = '投票 1 / 1 · 已比较四种边界';
      feedback.classList.remove('is-error');
      feedback.textContent = '黄色是你的选择；其余判据也会改变同一身份词的边界。';
      confirmBtn.hidden = true;
      resetBtn.hidden = false;
      resetBtn.focus();
    }

    function resetVote() {
      selected = null;
      page.classList.remove('is-complete');
      choices.forEach((button) => button.setAttribute('aria-pressed', 'false'));
      document.querySelectorAll('.result-row').forEach((row) => row.classList.remove('is-selected'));
      personSystem.dataset.selected = 'none';
      voteCount.textContent = '投票 0 / 1';
      feedback.classList.remove('is-error');
      feedback.textContent = '先选择一条定义边界；这里没有唯一正确答案。';
      resetBtn.hidden = true;
      confirmBtn.hidden = false;
      choices[0].focus();
    }

    choices.forEach((button) => {
      button.addEventListener('click', () => selectBoundary(button.dataset.boundary));
    });
    confirmBtn.addEventListener('click', submitVote);
    confirmBtn.addEventListener('animationend', () => confirmBtn.classList.remove('shake'));
    resetBtn.addEventListener('click', resetVote);
  }());
</script>
</body>
</html>
