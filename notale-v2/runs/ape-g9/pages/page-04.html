<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .scale-page {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    gap: var(--sp-3);
  }

  .scale-compare {
    --compare-cols: 2;
    flex: 0 0 auto;
    grid-template-columns: 176px minmax(0, 1fr) minmax(0, 1fr);
  }

  .scale-compare > .hdr,
  .scale-compare > .dim,
  .scale-compare > .cell,
  .scale-compare > .diff {
    padding-top: var(--sp-2);
    padding-bottom: var(--sp-2);
  }

  .scale-compare > .hdr {
    font-size: var(--fs-sec);
  }

  .scale-compare > .cell,
  .scale-compare > .diff {
    justify-content: center;
    font-size: var(--fs-sec);
  }

  .scale-figure {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    border-top: var(--border);
    border-bottom: var(--border);
    background: rgba(7, 16, 21, 0.38);
  }

  #time-svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  #time-svg text {
    fill: var(--text-muted);
    font-family: var(--font-sans);
    font-size: 16px;
    letter-spacing: 0;
  }

  #time-svg .axis-title {
    fill: var(--text-strong);
    font-family: var(--font-narrow);
    font-size: 22px;
    font-weight: 700;
  }

  #time-svg .axis-note,
  #time-svg .tick-text {
    font-size: 14px;
  }

  #time-svg .event-label {
    fill: var(--text-strong);
    font-size: 16px;
    font-weight: 700;
  }

  #time-svg .event-year {
    fill: var(--primary-bright);
    font-family: var(--font-mono);
    font-size: 16px;
  }

  #time-svg .order-reading {
    fill: var(--accent);
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 700;
  }

  #time-svg .axis-line {
    stroke: var(--primary);
    stroke-width: 5;
  }

  #time-svg .axis-branch {
    fill: none;
    stroke: var(--primary-dark);
    stroke-width: 3;
  }

  #time-svg .identity-link {
    stroke: var(--line-strong);
    stroke-width: 2;
    stroke-dasharray: 7 8;
  }

  #time-svg .event-mark {
    fill: var(--surface-0);
    stroke: var(--primary-bright);
    stroke-width: 4;
  }

  #time-svg .space-mark {
    stroke: var(--accent);
  }

  #time-svg .space-span {
    stroke: var(--accent);
    stroke-width: 11;
    stroke-linecap: round;
  }

  .scale-controls {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 52px;
    gap: var(--sp-4);
    align-items: end;
    flex: 0 0 112px;
    min-width: 0;
  }

  .scale-controls > * {
    min-width: 0;
  }

  .scale-slider-wrap {
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
    min-width: 0;
  }

  .scale-slider-wrap.is-rejecting input[type="range"] {
    animation: scale-shake 260ms ease-in-out;
  }

  .slider-line {
    display: grid;
    grid-template-columns: 176px minmax(0, 1fr) 190px;
    gap: var(--sp-3);
    align-items: center;
    min-width: 0;
  }

  .slider-line > * {
    min-width: 0;
  }

  .scale-status {
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
    text-align: right;
  }

  .scale-status.is-complete {
    color: var(--primary-bright);
  }

  .scale-progress {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--sp-2);
    padding-left: 188px;
    padding-right: 202px;
  }

  .scale-progress span {
    min-height: 24px;
    box-sizing: border-box;
    color: var(--text-faint);
    font-size: var(--fs-label);
    font-weight: 700;
    line-height: 24px;
    text-align: center;
    border-top: 3px solid var(--line-strong);
  }

  .scale-progress span.is-past {
    color: var(--primary-bright);
    border-top-color: var(--primary);
  }

  .scale-progress span.is-current {
    color: var(--accent);
    border-top-color: var(--accent);
  }

  .reset-btn {
    align-self: end;
    width: 44px;
    height: 44px;
    min-height: 44px;
    padding: 0;
    font-family: var(--font-mono);
    font-size: 24px;
  }

  .conclusion {
    min-height: 26px;
    color: var(--text-strong);
    font-size: var(--fs-lead);
    font-weight: 700;
    line-height: var(--lh-copy);
    text-align: center;
    opacity: 0;
  }

  .conclusion.is-visible {
    opacity: 1;
  }

  @keyframes scale-shake {
    0%, 100% { transform: translateX(0); }
    30% { transform: translateX(-8px); }
    65% { transform: translateX(6px); }
  }

  body[data-page="04"] .lec-progress {
    overflow: visible;
  }

  @media (prefers-reduced-motion: reduce) {
    .scale-slider-wrap.is-rejecting input[type="range"] { animation: none; }
    .conclusion { transition: none; }
  }
</style>
</head>
<body data-page="04" data-total="52">
<div id="stage">
<main id="main">
  <section class="scale-page min0" aria-label="演化史与航天史时间尺度比较">
    <div class="k-comparison scale-compare" aria-label="两种显示尺度的比较">
      <div class="hdr">比较维度</div>
      <div class="hdr">等距时间尺</div>
      <div class="hdr">压缩时间尺</div>
      <div class="dim">事件顺序与年代</div>
      <div class="cell">保持不变</div>
      <div class="cell">保持不变</div>
      <div class="rowline"></div>
      <div class="dim">可见宽度</div>
      <div class="cell">按真实跨度分配</div>
      <div class="diff">按数量级展开近期</div>
    </div>

    <figure class="scale-figure min0" aria-label="上方为等距时间尺，下方为可调压缩时间尺；垂直虚线连接同一事件">
      <svg id="time-svg" viewBox="0 0 1440 900" role="img" aria-label="同一组历史事件在等距尺和压缩尺上的位置比较"></svg>
    </figure>

    <div class="scale-controls">
      <div class="scale-slider-wrap min0" id="slider-wrap">
        <div class="slider-line">
          <label for="compression">显示尺度：<span id="mode-label">等距</span></label>
          <input id="compression" type="range" min="0" max="100" step="1" value="0" aria-describedby="scale-status">
          <div id="scale-status" class="scale-status" aria-live="polite">航天史仍挤在右端细缝</div>
        </div>
        <div class="scale-progress" aria-label="压缩进度">
          <span data-step="0" class="is-current">等距</span>
          <span data-step="1">折中</span>
          <span data-step="2">数量级</span>
        </div>
        <p id="conclusion" class="conclusion">压缩只改变显示尺度；真实持续时间没有变。</p>
      </div>
      <button id="reset" class="btn icon-only reset-btn" type="button" title="重置为等距时间尺" aria-label="重置为等距时间尺" disabled>↺</button>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/lib/ScrollTrigger.min.js"></script>
<script>
(function () {
  'use strict';

  Lec.mount({index:4,kicker:'SCALE CHECK',title:'把航天史放回人体演化史',take:'载人航天史在人体演化史上只占近乎看不见的一小段。'});
  gsap.registerPlugin(ScrollTrigger);

  var sourceScale = {
    splitRangeYears: 1000000,
    timelineMinimumYearsAgo: 1
  };
  Lec.K.homininChimpSplitMaxYears = Lec.K.human.chimpHumanSplitYearsAgo;
  Lec.K.homininChimpSplitMinYears = Lec.P.difference(sourceScale.splitRangeYears, Lec.K.homininChimpSplitMaxYears);
  Lec.K.homoSapiensYearsAgo = Lec.K.human.homoSapiensYearsAgo;
  Lec.K.firstHumanSpaceflightYear = Lec.K.spaceflight.firstHumanInSpaceYear;
  Lec.K.referenceYear = Lec.K.time.currentReferenceYear;
  Lec.K.timelineOldestYearsAgo = Lec.K.homininChimpSplitMaxYears;
  Lec.K.timelineMinimumYearsAgo = sourceScale.timelineMinimumYearsAgo;

  var svg = d3.select('#time-svg');
  var slider = document.getElementById('compression');
  var sliderWrap = document.getElementById('slider-wrap');
  var status = document.getElementById('scale-status');
  var modeLabel = document.getElementById('mode-label');
  var conclusion = document.getElementById('conclusion');
  var reset = document.getElementById('reset');
  var progressSteps = Array.prototype.slice.call(document.querySelectorAll('.scale-progress span'));
  var reduced = Deck.reduced();
  var compression = 0;
  var complete = false;
  var W = 1440;
  var left = 142;
  var right = 1320;
  var axisWidth = right - left;
  var yLinear = 258;
  var yCompressed = 598;

  var flightYearsAgo = Lec.P.yearsAgoFromYear(Lec.K.firstHumanSpaceflightYear, Lec.K.referenceYear);
  var spaceflightSpan = Lec.P.elapsedYears(Lec.K.firstHumanSpaceflightYear, Lec.K.referenceYear);
  var orders = Lec.P.ordersOfMagnitude(spaceflightSpan, Lec.K.homininChimpSplitMinYears);
  var splitMid = Lec.P.lerp(Lec.K.homininChimpSplitMinYears, Lec.K.homininChimpSplitMaxYears, 0.5);

  var events = [
    { id: 'split', label: '人类与黑猩猩谱系分开', yearsAgo: splitMid, ancient: true },
    { id: 'sapiens', label: 'Homo sapiens 出现', yearsAgo: Lec.K.homoSapiensYearsAgo, ancient: true },
    { id: 'flight', label: '首次载人航天', yearsAgo: flightYearsAgo, recent: true },
    { id: 'reference', label: '参照年', yearsAgo: Lec.K.timelineMinimumYearsAgo, recent: true }
  ];

  function linearFraction(yearsAgo) {
    return Lec.P.timelineFraction(yearsAgo, Lec.K.timelineOldestYearsAgo);
  }

  function mixedFraction(yearsAgo) {
    var logarithmic = Lec.P.difference(
      1,
      Lec.P.logTimelineFraction(yearsAgo, Lec.K.timelineMinimumYearsAgo, Lec.K.timelineOldestYearsAgo)
    );
    return Lec.P.lerp(
      Lec.P.timelineFraction(yearsAgo, Lec.K.timelineOldestYearsAgo),
      logarithmic,
      compression
    );
  }

  function px(fraction) {
    return left + fraction * axisWidth;
  }

  function displayYear(d) {
    if (d.id === 'split') {
      var minMa = Lec.P.significant(Lec.K.homininChimpSplitMinYears / 1000000, 1);
      var maxMa = Lec.P.significant(Lec.K.homininChimpSplitMaxYears / 1000000, 1);
      return '约 ' + minMa + '–' + maxMa + ' Ma';
    }
    if (d.id === 'sapiens') {
      return '约 ' + Lec.P.significant(Lec.K.homoSapiensYearsAgo / 1000, 1) + ' ka';
    }
    if (d.id === 'flight') return String(Lec.K.firstHumanSpaceflightYear);
    return String(Lec.K.referenceYear);
  }

  var defs = svg.append('defs');
  defs.append('filter')
    .attr('id', 'space-glow')
    .append('feGaussianBlur')
    .attr('stdDeviation', 8)
    .attr('result', 'blur');

  var root = svg.append('g');
  var axisGroup = root.append('g');
  var linksGroup = root.append('g');
  var marksGroup = root.append('g');
  var readingGroup = root.append('g').attr('opacity', 0);

  function drawAxis(y, title, note) {
    var g = axisGroup.append('g').attr('class', 'scale-axis');
    g.append('text').attr('class', 'axis-title').attr('x', left).attr('y', y - 70).text(title);
    g.append('text').attr('class', 'axis-note').attr('x', right).attr('y', y - 70).attr('text-anchor', 'end').text(note);
    g.append('path').attr('class', 'axis-branch').attr('d', 'M ' + left + ' ' + y + ' L ' + (left + axisWidth * 0.36) + ' ' + y + ' L ' + (left + axisWidth * 0.46) + ' ' + (y - 24) + ' L ' + (left + axisWidth * 0.57) + ' ' + y + ' L ' + right + ' ' + y);
    g.append('line').attr('class', 'axis-line').attr('x1', left).attr('x2', right).attr('y1', y).attr('y2', y);
    g.append('text').attr('class', 'tick-text').attr('x', left).attr('y', y + 44).text('较久远');
    g.append('text').attr('class', 'tick-text').attr('x', right).attr('y', y + 44).attr('text-anchor', 'end').text('接近参照年');
    return g;
  }

  var topAxis = drawAxis(yLinear, '等距时间尺', '横向宽度 = 实际持续时间');
  var bottomAxis = drawAxis(yCompressed, '压缩时间尺', '横向宽度 = 压缩后的显示尺度');

  var topMarks = marksGroup.selectAll('.top-mark')
    .data(events)
    .join('g')
    .attr('class', 'top-mark');

  topMarks.append('circle').attr('class', function (d) { return 'event-mark' + (d.recent ? ' space-mark' : ''); }).attr('r', 9);
  topMarks.append('line').attr('y1', -30).attr('y2', 30).attr('stroke', 'var(--line-strong)').attr('stroke-width', 2);
  topMarks.append('text').attr('class', 'event-label');
  topMarks.append('text').attr('class', 'event-year');

  var bottomMarks = marksGroup.selectAll('.bottom-mark')
    .data(events)
    .join('g')
    .attr('class', 'bottom-mark');

  bottomMarks.append('circle').attr('class', function (d) { return 'event-mark' + (d.recent ? ' space-mark' : ''); }).attr('r', 9);
  bottomMarks.append('line').attr('y1', -30).attr('y2', 30).attr('stroke', 'var(--line-strong)').attr('stroke-width', 2);
  bottomMarks.append('text').attr('class', 'event-label');
  bottomMarks.append('text').attr('class', 'event-year');

  var links = linksGroup.selectAll('.identity-link')
    .data(events)
    .join('line')
    .attr('class', 'identity-link');

  var spanGlow = marksGroup.append('line').attr('class', 'space-span').attr('opacity', 0).attr('filter', 'url(#space-glow)');
  var spaceSpan = marksGroup.append('line').attr('class', 'space-span');

  readingGroup.append('text')
    .attr('class', 'order-reading')
    .attr('x', W / 2)
    .attr('y', 454)
    .attr('text-anchor', 'middle')
    .text('相差约 ' + Lec.P.roundTo(orders, 0) + ' 个数量级');
  readingGroup.append('text')
    .attr('x', W / 2)
    .attr('y', 488)
    .attr('text-anchor', 'middle')
    .text('可见宽度不等于真实持续时间');

  function setMarkLabels(selection, isBottom) {
    selection.select('.event-label')
      .attr('x', function (d) { return d.id === 'sapiens' || d.id === 'reference' ? -14 : 14; })
      .attr('y', function (d) { return d.ancient ? -38 : 58; })
      .attr('text-anchor', function (d) { return d.id === 'sapiens' || d.id === 'reference' ? 'end' : 'start'; })
      .attr('opacity', function (d) { return d.recent && (!isBottom || !complete) ? 0 : 1; })
      .text(function (d) { return d.label; });
    selection.select('.event-year')
      .attr('x', function (d) { return d.id === 'sapiens' || d.id === 'reference' ? -14 : 14; })
      .attr('y', function (d) { return d.ancient ? -14 : 82; })
      .attr('text-anchor', function (d) { return d.id === 'sapiens' || d.id === 'reference' ? 'end' : 'start'; })
      .attr('opacity', function (d) { return d.recent && (!isBottom || !complete) ? 0 : 1; })
      .text(displayYear);
  }

  function update() {
    topMarks.attr('transform', function (d) { return 'translate(' + px(linearFraction(d.yearsAgo)) + ',' + yLinear + ')'; });
    bottomMarks.attr('transform', function (d) { return 'translate(' + px(mixedFraction(d.yearsAgo)) + ',' + yCompressed + ')'; });

    links
      .attr('x1', function (d) { return px(linearFraction(d.yearsAgo)); })
      .attr('y1', yLinear + 12)
      .attr('x2', function (d) { return px(mixedFraction(d.yearsAgo)); })
      .attr('y2', yCompressed - 12);

    var flightX = px(mixedFraction(flightYearsAgo));
    var referenceX = px(mixedFraction(Lec.K.timelineMinimumYearsAgo));
    spaceSpan.attr('x1', flightX).attr('x2', referenceX).attr('y1', yCompressed).attr('y2', yCompressed);
    spanGlow.attr('x1', flightX).attr('x2', referenceX).attr('y1', yCompressed).attr('y2', yCompressed);

    setMarkLabels(topMarks, false);
    setMarkLabels(bottomMarks, true);
    readingGroup.attr('opacity', complete ? 1 : 0);
    conclusion.classList.toggle('is-visible', complete);
    reset.disabled = compression === 0;

    var step = compression < 0.34 ? 0 : (compression < 0.82 ? 1 : 2);
    progressSteps.forEach(function (el, i) {
      el.classList.toggle('is-past', i < step);
      el.classList.toggle('is-current', i === step);
    });
    modeLabel.textContent = step === 0 ? '等距' : (step === 1 ? '折中' : '数量级');
  }

  function setCompression(value) {
    compression = Lec.P.clamp ? Lec.P.clamp(value, 0, 1) : Math.max(0, Math.min(1, value));
    complete = compression >= 0.98;
    slider.value = String(Lec.P.roundTo(compression * 100, 0));
    status.textContent = complete
      ? Lec.K.firstHumanSpaceflightYear + '—' + Lec.K.referenceYear + '：共 ' + spaceflightSpan + ' 年，现已可见'
      : (compression < 0.34 ? '航天史仍挤在右端细缝' : '近期区间正在展开');
    status.classList.toggle('is-complete', complete);
    update();
  }

  slider.addEventListener('input', function () {
    setCompression(Number(slider.value) / 100);
  });

  slider.addEventListener('change', function () {
    var value = Number(slider.value) / 100;
    if (value >= 0.82) {
      setCompression(1);
      if (!reduced) {
        gsap.fromTo(spanGlow, { attr: { opacity: 0.9 } }, { attr: { opacity: 0 }, duration: 0.7, ease: 'power2.out' });
      }
      return;
    }
    if (value > 0.06) {
      sliderWrap.classList.remove('is-rejecting');
      void sliderWrap.offsetWidth;
      sliderWrap.classList.add('is-rejecting');
      status.textContent = '还看不见 ' + Lec.K.firstHumanSpaceflightYear + '—' + Lec.K.referenceYear + '：继续向右压缩较久远年代。';
      window.setTimeout(function () {
        sliderWrap.classList.remove('is-rejecting');
        setCompression(0);
      }, reduced ? 0 : 300);
    }
  });

  reset.addEventListener('click', function () {
    setCompression(0);
    slider.focus();
  });

  setCompression(0);

  if (!reduced) {
    gsap.from('.scale-compare', { opacity: 0, y: -10, duration: 0.45, ease: 'power1.out' });
    gsap.fromTo('.axis-line', { attr: { x2: left } }, { attr: { x2: right }, duration: 0.9, stagger: 0.14, ease: 'power1.inOut' });
    gsap.from('.event-mark', { opacity: 0, duration: 0.24, stagger: 0.08, delay: 0.45 });
  }

  const scroll = ScrollTrigger.create({trigger:'#main',start:'top top',end:'+=125%',pin:true,scrub:0.35});
  scroll.disable(false);
  window.__page04 = { setCompression: setCompression, reset: function () { setCompression(0); }, scroll: scroll };
}());
</script>
</body>
</html>
