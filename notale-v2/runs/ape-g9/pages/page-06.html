<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lec-progress {
    overflow: visible;
  }

  .origin-scene {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--surface-0);
  }

  .origin-photo {
    position: absolute;
    inset: 0;
    margin: 0;
    overflow: hidden;
    opacity: 0;
    animation: photo-in 520ms ease-out forwards;
  }

  .origin-photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 38% 42%;
    filter: brightness(0.7) saturate(0.72) contrast(1.08);
  }

  .origin-photo::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(7, 16, 21, 0.12) 0%, rgba(7, 16, 21, 0.04) 38%, rgba(7, 16, 21, 0.72) 59%, rgba(7, 16, 21, 0.96) 100%);
    pointer-events: none;
  }

  .body-trace {
    position: absolute;
    top: 24px;
    left: 190px;
    width: 480px;
    height: 584px;
    overflow: visible;
    opacity: 0;
    animation: trace-in 560ms 480ms ease-out forwards;
  }

  .body-trace path,
  .body-trace ellipse {
    fill: rgba(53, 198, 180, 0.05);
    stroke: var(--primary-bright);
    stroke-width: 3;
    vector-effect: non-scaling-stroke;
  }

  .layer-tag {
    position: absolute;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    color: var(--text-strong);
    font-size: var(--fs-label);
    font-weight: 700;
    line-height: 1.35;
  }

  .layer-tag::before {
    content: "";
    width: 34px;
    height: 2px;
    background: currentColor;
  }

  .tag-body {
    top: 238px;
    left: 218px;
    color: var(--primary-bright);
  }

  .tag-suit {
    top: 352px;
    left: 132px;
    color: var(--text-muted);
  }

  .scan {
    position: absolute;
    top: 38px;
    left: 246px;
    width: 356px;
    height: 2px;
    background: var(--primary-bright);
    box-shadow: 0 0 14px rgba(53, 198, 180, 0.7);
    opacity: 0;
    animation: scan-down 560ms 480ms ease-in-out forwards;
  }

  .scene-label {
    position: absolute;
    top: 24px;
    left: 24px;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 600;
    line-height: 1.35;
  }

  .scene-label::before {
    content: "";
    width: 28px;
    height: 2px;
    background: var(--primary);
  }

  .check-wrap {
    position: absolute;
    top: 44px;
    right: 24px;
    z-index: 4;
    width: 610px;
    height: 432px;
  }

  .check-heading {
    margin: 0 0 var(--sp-4) 86px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 600;
    line-height: 1.35;
  }

  .check-list.k-enumeration {
    --enum-cols: 1;
    gap: var(--sp-3);
    height: 392px;
    padding-left: 86px;
  }

  .check-list.k-enumeration > .it {
    position: relative;
    grid-template-columns: 52px 142px minmax(0, 1fr);
    grid-template-rows: 1fr;
    align-items: center;
    min-height: 0;
    padding: var(--sp-3) var(--sp-4);
    border-color: var(--line-strong);
    border-top: var(--border);
    border-left: 3px solid var(--primary-dark);
    background: rgba(13, 26, 32, 0.84);
    backdrop-filter: blur(8px);
    opacity: 0;
    transform: translateX(-24px);
    animation: item-in 360ms ease-out forwards;
  }

  .check-list.k-enumeration > .it::before {
    content: "";
    position: absolute;
    top: 50%;
    right: 100%;
    width: 170px;
    height: 2px;
    background: var(--primary);
    transform: translateY(-50%) scaleX(0);
    transform-origin: right center;
    animation: line-in 360ms ease-out forwards;
  }

  .check-list.k-enumeration > .it::after {
    content: "";
    position: absolute;
    top: 50%;
    right: calc(100% + 166px);
    width: 9px;
    height: 9px;
    border: 2px solid var(--primary-bright);
    border-radius: 50%;
    background: var(--surface-0);
    transform: translateY(-50%);
  }

  .check-list.k-enumeration > .it:nth-child(1) { animation-delay: 800ms; }
  .check-list.k-enumeration > .it:nth-child(2) { animation-delay: 880ms; }
  .check-list.k-enumeration > .it:nth-child(3) { animation-delay: 960ms; }
  .check-list.k-enumeration > .it:nth-child(4) { animation-delay: 1040ms; }
  .check-list.k-enumeration > .it:nth-child(1)::before { animation-delay: 800ms; }
  .check-list.k-enumeration > .it:nth-child(2)::before { animation-delay: 880ms; }
  .check-list.k-enumeration > .it:nth-child(3)::before { animation-delay: 960ms; }
  .check-list.k-enumeration > .it:nth-child(4)::before { animation-delay: 1040ms; }

  .check-list .num {
    color: var(--primary-bright);
    font-family: var(--font-mono);
    font-size: var(--fs-lead);
    font-weight: 700;
    line-height: 1.35;
  }

  .check-list .it:first-child {
    border-left-color: var(--accent);
    background: rgba(255, 204, 77, 0.11);
  }

  .check-list .it:first-child::before {
    background: var(--accent);
  }

  .check-list .it:first-child::after {
    border-color: var(--accent);
  }

  .check-list .it:first-child .num {
    color: var(--accent);
  }

  .check-list.k-enumeration > .it > .it-title {
    margin: 0;
    font-size: var(--fs-h2);
  }

  .check-list .question {
    color: var(--text-strong);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
  }

  .chapter-claim {
    position: absolute;
    right: 24px;
    bottom: 42px;
    z-index: 4;
    width: 824px;
    box-sizing: border-box;
    padding: var(--sp-4) var(--sp-5);
    color: var(--text-strong);
    font-size: var(--fs-lead);
    font-weight: 700;
    line-height: var(--lh-copy);
    border-left: 6px solid var(--accent);
    background: rgba(7, 16, 21, 0.9);
  }

  .continuation {
    position: absolute;
    bottom: 0;
    left: 356px;
    z-index: 4;
    width: 4px;
    height: 78px;
    background: var(--primary);
    box-shadow: 0 0 10px rgba(53, 198, 180, 0.38);
  }

  .continuation::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    width: 74px;
    height: 2px;
    background: var(--primary);
    transform: translateX(-50%);
  }

  @keyframes photo-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes trace-in {
    from { opacity: 0; clip-path: inset(0 0 100% 0); }
    to { opacity: 0.76; clip-path: inset(0); }
  }

  @keyframes scan-down {
    0% { opacity: 0; transform: translateY(0); }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { opacity: 0; transform: translateY(520px); }
  }

  @keyframes item-in {
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes line-in {
    to { transform: translateY(-50%) scaleX(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .origin-photo,
    .body-trace,
    .check-list.k-enumeration > .it,
    .check-list.k-enumeration > .it::before {
      animation: none;
      opacity: 1;
      transform: none;
    }

    .body-trace { opacity: 0.76; clip-path: inset(0); }
    .scan { display: none; }
    .check-list.k-enumeration > .it::before { transform: translateY(-50%) scaleX(1); }
  }
</style>
</head>
