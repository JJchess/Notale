<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage .lec-progress { overflow: visible; }
  .p07-page { height: 100%; }
  .p07-classification { height: 100%; gap: var(--sp-2); }
  .p07-root.box { height: 100%; box-sizing: border-box; padding: var(--sp-3); overflow: hidden; }
  .p07-root.box > .bt { display: flex; align-items: center; justify-content: space-between; margin: calc(-1 * var(--sp-3)) calc(-1 * var(--sp-3)) var(--sp-2); padding: var(--sp-2) var(--sp-4); }
  .p07-root-title { display: flex; align-items: center; gap: var(--sp-3); }
  .p07-human { display: grid; width: 34px; height: 34px; place-items: center; border: 2px solid var(--primary-dark); border-radius: 50%; color: var(--text-muted); font-size: var(--fs-sec); transition: color 180ms ease, border-color 180ms ease, box-shadow 180ms ease; }
  .p07-human.is-complete { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 18px rgba(255, 204, 77, .34); }
  .p07-count { color: var(--text-muted); font-family: var(--font-mono); font-size: var(--fs-sec); font-weight: 600; }
  .p07-claim { display: flex; align-items: center; height: 52px; box-sizing: border-box; padding: var(--sp-2) var(--sp-4); color: var(--text-strong); font-size: var(--fs-body); line-height: var(--lh-copy); border-left: 4px solid var(--accent); background: var(--surface-yellow); }
  .p07-tree-wrap { position: relative; height: 76px; min-height: 76px; overflow: hidden; }
  .p07-tree { width: 100%; height: 100%; overflow: visible; }
  .p07-link { fill: none; stroke: var(--primary-dark); stroke-width: 2; opacity: .55; transition: opacity 180ms ease, stroke 180ms ease, stroke-width 180ms ease; }
  .p07-link.is-on { stroke: var(--primary-bright); stroke-width: 3; opacity: 1; }
  .p07-node circle { fill: var(--surface-2); stroke: var(--primary-dark); stroke-width: 2; transition: fill 180ms ease, stroke 180ms ease; }
  .p07-node text { fill: var(--text-muted); font-family: var(--font-sans); font-size: var(--fs-sec); font-weight: 600; }
  .p07-node.is-branch text, .p07-node.is-root text { fill: var(--text-strong); font-size: var(--fs-body); font-weight: 700; }
  .p07-node.is-on circle { fill: var(--accent); stroke: var(--accent); }
  .p07-node.is-on text { fill: var(--text-strong); }
  .p07-node.is-leaf:not(.is-on) { opacity: .42; }
  .p07-photo-row { display: flex; gap: var(--sp-4); height: 320px; min-height: 320px; }
  .p07-branch { flex: 1 1 0; min-width: 0; border-left: 3px solid var(--primary-dark); background: var(--surface-1); opacity: 0; transform: translateY(18px); animation: p07-enter 420ms ease forwards; }
  .p07-branch:nth-child(2) { animation-delay: 90ms; }
  .p07-branch:nth-child(3) { animation-delay: 180ms; }
  .p07-branch.is-active { border-left-color: var(--primary); }
  .p07-branch-head { display: flex; align-items: center; justify-content: space-between; height: 42px; box-sizing: border-box; padding: 0 var(--sp-3); border-bottom: var(--border); }
  .p07-branch-name { color: var(--text-strong); font-family: var(--font-narrow); font-size: var(--fs-h2); font-weight: 700; }
  .p07-slots { display: flex; gap: var(--sp-2); }
  .p07-slot { width: 13px; height: 13px; border: 2px solid var(--line-strong); border-radius: 50%; background: var(--surface-0); }
  .p07-slot.is-on { border-color: var(--accent); background: var(--accent); }
  .p07-photo-btn { position: relative; display: block; width: 100%; height: 278px; min-height: 278px; padding: 0; overflow: hidden; border: 0; border-radius: 0; background: var(--surface-2); cursor: crosshair; }
  .p07-photo-btn:hover { border: 0; background: var(--surface-2); }
  .p07-photo-btn:active { transform: none; }
  .p07-photo-btn img { display: block; width: 100%; height: 100%; object-fit: cover; filter: saturate(.82) contrast(1.05) brightness(.76); transition: filter 180ms ease; }
  .p07-branch.is-active img { filter: saturate(.96) contrast(1.05) brightness(.86); }
  .p07-photo-btn::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px var(--line); pointer-events: none; }
  .p07-hotspot { position: absolute; width: 38px; height: 38px; margin: -19px 0 0 -19px; border: 3px solid var(--accent); border-radius: 50%; background: rgba(7, 16, 21, .28); box-shadow: 0 0 0 7px rgba(255, 204, 77, .12); pointer-events: none; transition: transform 180ms ease, opacity 180ms ease; }
  .p07-hotspot::after { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: var(--accent); }
  .p07-hotspot.is-found { transform: scale(.76); border-color: var(--primary-bright); box-shadow: 0 0 0 9px rgba(53, 198, 180, .16); }
  .p07-hotspot.is-found::after { background: var(--primary-bright); }
  .p07-photo-btn.is-wrong { animation: p07-shake 180ms linear 2; }
  .p07-label { position: absolute; z-index: 2; max-width: 190px; padding: var(--sp-2) var(--sp-3); color: var(--text-strong); font-size: var(--fs-sec); font-weight: 700; line-height: var(--lh-copy); text-align: left; border-left: 3px solid var(--primary); background: rgba(7, 16, 21, .9); opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity 180ms ease, transform 180ms ease; }
  .p07-label.is-on { opacity: 1; transform: translateY(0); }
  .p07-bottom { display: flex; align-items: center; gap: var(--sp-4); height: 78px; min-height: 78px; padding-top: var(--sp-2); }
  .p07-instruction { flex: 0 0 290px; color: var(--text-muted); font-size: var(--fs-sec); line-height: var(--lh-copy); }
  .p07-feedback { flex: 1 1 auto; min-width: 0; padding-left: var(--sp-4); color: var(--text-strong); font-size: var(--fs-body); line-height: var(--lh-copy); border-left: 3px solid var(--primary-dark); }
  .p07-feedback.is-wrong { color: var(--danger); border-left-color: var(--danger); }
  .p07-feedback.is-complete { color: var(--primary-bright); border-left-color: var(--accent); }
  .p07-reset { flex: 0 0 44px; width: 44px; height: 44px; padding: 0; font-size: 24px; opacity: 0; pointer-events: none; }
  .p07-reset.is-visible { opacity: 1; pointer-events: auto; }
  @keyframes p07-enter { to { opacity: 1; transform: translateY(0); } }
  @keyframes p07-shake { 0%,100% { transform: translateX(0); } 35% { transform: translateX(-7px); } 70% { transform: translateX(7px); } }
  @media (prefers-reduced-motion: reduce) {
    .p07-branch { opacity: 1; transform: none; animation: none; }
    .p07-photo-btn.is-wrong { animation: none; }
    .p07-link, .p07-node circle, .p07-hotspot, .p07-label, .p07-human { transition: none; }
  }
</style>

const photoRow = document.getElementById('photoRow');
groups.forEach(group => {
  const branch = document.createElement('section');
  branch.className = 'p07-branch min0';
  branch.dataset.group = group.key;
  branch.innerHTML = `
    <div class="p07-branch-head">
      <span class="p07-branch-name">${group.name}</span>

const found = new Set();
const width = 1380;
const height = 128;
const hierarchy = d3.hierarchy(rootData);
d3.tree().size([width - 48, height - 72])(hierarchy);
const svg = d3.select('#tree').attr('viewBox', `0 0 ${width} ${height}`);
const chart = svg.append('g').attr('transform', 'translate(24,4)');
chart.selectAll('path').data(hierarchy.links()).join('path')
  .attr('class', 'p07-link')
  .attr('data-target', d => d.target.data.key || 'root')
  .attr('d', d3.linkVertical().x(d => d.x).y(d => d.y));
const nodes = chart.selectAll('g').data(hierarchy.descendants()).join('g')
  .attr('class', d => `p07-node ${d.depth === 0 ? 'is-root' : d.depth === 1 ? 'is-branch' : 'is-leaf'}`)
  .attr('data-key', d => d.data.key || 'root')
  .attr('transform', d => `translate(${d.x},${d.y})`);
nodes.append('circle').attr('r', d => d.depth === 0 ? 7 : 6);
nodes.append('text')
  .attr('text-anchor', d => d.depth === 0 ? 'middle' : d.depth === 1 ? 'middle' : d.x < width / 2 ? 'start' : 'end')
  .attr('x', d => d.depth < 2 ? 0 : d.x < width / 2 ? 10 : -10)
  .attr('y', d => d.depth === 0 ? 34 : d.depth === 1 ? -12 : 5)
  .text(d => d.data.name);

function updateTree() {
  groups.forEach(group => {
    const branchOn = group.items.some(item => found.has(item.key));
    document.querySelector(`.p07-branch[data-group="${group.key}"]`).classList.toggle('is-active', branchOn);
    document.querySelector(`.p07-node[data-key="${group.key}"]`).classList.toggle('is-on', branchOn);
    document.querySelector(`.p07-link[data-target="${group.key}"]`).classList.toggle('is-on', branchOn);
    const slots = document.querySelectorAll(`.p07-branch[data-group="${group.key}"] .p07-slot`);
    group.items.forEach((item, i) => {
      const on = found.has(item.key);
      slots[i].classList.toggle('is-on', on);
      document.querySelector(`.p07-hotspot[data-key="${item.key}"]`).classList.toggle('is-found', on);
      document.querySelector(`.p07-label[data-label="${item.key}"]`).classList.toggle('is-on', on);
      document.querySelector(`.p07-node[data-key="${item.key}"]`).classList.toggle('is-on', on);
      document.querySelector(`.p07-link[data-target="${item.key}"]`).classList.toggle('is-on', on);
    });
  });
  const complete = found.size === 6;
  document.getElementById('count').textContent = `已找到 ${found.size}/6 项`;
  document.getElementById('humanMark').classList.toggle('is-complete', complete);
  document.getElementById('reset').classList.toggle('is-visible', complete);
  if (complete) {
    const feedback = document.getElementById('feedback');
    feedback.className = 'p07-feedback is-complete';
    feedback.textContent = '人类不是脱离灵长类后才成为人类；手、眼和社会依赖仍建立在共同遗产上。共同遗产来自共同祖先，不表示今天任何一种猿是人的祖先。';
  }
}

function reveal(group, item) {
  if (found.has(item.key)) return;
  found.add(item.key);
  const feedback = document.getElementById('feedback');
  feedback.className = 'p07-feedback';
  feedback.textContent = `${item.name}：${item.meaning}。它归入“${group.name}”分支。`;
  updateTree();
}

function wrong(button) {
  const feedback = document.getElementById('feedback');
  button.classList.remove('is-wrong');
  void button.offsetWidth;
  button.classList.add('is-wrong');
  feedback.className = 'p07-feedback is-wrong';
  feedback.textContent = '这不是本页要找的灵长类共同特征，请观察手、双眼方向或同伴关系。';
}

document.querySelectorAll('.p07-photo-btn').forEach(button => {
  const group = groups.find(item => item.key === button.dataset.group);
  button.addEventListener('click', event => {
    if (event.detail === 0) {
      const next = group.items.find(item => !found.has(item.key));
      if (next) reveal(group, next);
      return;
    }
    const point = Deck.pt(button, event);
    const px = point.x / button.offsetWidth * 100;
    const py = point.y / button.offsetHeight * 100;
    const target = group.items.find(item => Math.hypot(px - item.x, py - item.y) <= 8.5);
    if (target) reveal(group, target); else wrong(button);
  });
  button.addEventListener('animationend', () => button.classList.remove('is-wrong'));
});

document.getElementById('reset').addEventListener('click', () => {
  found.clear();
  const feedback = document.getElementById('feedback');
  feedback.className = 'p07-feedback';
  feedback.textContent = '三幅照片中的相似之处，属于同一个上位分类。';
  updateTree();
});

updateTree();
</script>
</body>
</html>
