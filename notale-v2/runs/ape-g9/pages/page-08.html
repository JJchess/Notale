<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main { position: relative; }
  .foot-lab {
    position: relative;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    overflow: hidden;
    border: var(--border);
    border-radius: var(--radius-3);
    background: var(--surface-1);
    box-shadow: var(--shadow-panel);
    isolation: isolate;
  }
  .lec-progress { overflow: visible; }
  .track-photo,
  .track-annotation {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .track-photo {
    z-index: 0;
    display: block;
    object-fit: cover;
    object-position: 50% 55%;
    filter: saturate(.62) contrast(1.12) brightness(.62);
  }
  .photo-shade {
    position: absolute;
    z-index: 1;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(90deg, rgba(7,16,21,.72), transparent 28%, transparent 70%, rgba(7,16,21,.52)),
      linear-gradient(0deg, rgba(7,16,21,.66), transparent 26%, rgba(7,16,21,.18));
  }
  .track-annotation {
    --reveal-x: 50%;
    --reveal-y: 50%;
    --reveal-radius: 0px;
    z-index: 3;
    pointer-events: none;
    -webkit-mask-image: radial-gradient(circle var(--reveal-radius) at var(--reveal-x) var(--reveal-y), #000 0 40%, rgba(0,0,0,.75) 60%, rgba(0,0,0,.4) 75%, rgba(0,0,0,.12) 88%, transparent 100%);
    mask-image: radial-gradient(circle var(--reveal-radius) at var(--reveal-x) var(--reveal-y), #000 0 40%, rgba(0,0,0,.75) 60%, rgba(0,0,0,.4) 75%, rgba(0,0,0,.12) 88%, transparent 100%);
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
  }
  .track-annotation svg { width: 100%; height: 100%; display: block; }
  .route {
    fill: none;
    stroke: var(--primary);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 1 24;
    opacity: .8;
  }
  .route-live {
    fill: none;
    stroke: var(--primary-bright);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 620;
    stroke-dashoffset: calc(620 - (var(--matched) * 103));
    transition: stroke-dashoffset 280ms ease;
  }
  .site-ring { fill: rgba(7,16,21,.38); stroke: rgba(233,241,239,.78); stroke-width: 2; stroke-dasharray: 6 7; }
  .site-ring.done { stroke: var(--accent); stroke-dasharray: none; filter: drop-shadow(0 0 7px rgba(255,204,77,.75)); }
  .lab-top {
    position: absolute;
    z-index: 7;
    top: var(--sp-4);
    left: var(--sp-4);
    display: flex;
    align-items: flex-start;
    gap: var(--sp-4);
    pointer-events: none;
  }
  .instruction {
    width: 310px;
    padding: var(--sp-4);
    border-left: 3px solid var(--primary);
    background: rgba(7,16,21,.84);
  }
  .instruction strong { display: block; color: var(--text-strong); font-size: var(--fs-lead); line-height: var(--lh-copy); }
  .instruction p { margin-top: var(--sp-2); color: var(--text-muted); font-size: var(--fs-sec); line-height: var(--lh-copy); }
  .evidence-compare.k-comparison {
    --compare-cols: 2;
    width: 520px;
    grid-template-columns: 112px repeat(2, minmax(0, 1fr));
    border-color: var(--line-strong);
    background: rgba(7,16,21,.84);
  }
  .evidence-compare.k-comparison > .hdr { padding: var(--sp-2) var(--sp-3); font-size: var(--fs-sec); }
  .evidence-compare.k-comparison > .dim,
  .evidence-compare.k-comparison > .cell,
  .evidence-compare.k-comparison > .diff { padding: var(--sp-2) var(--sp-3); }
  .status-panel {
    position: absolute;
    z-index: 8;
    top: var(--sp-4);
    right: var(--sp-4);
    width: 250px;
    padding: var(--sp-4);
    background: rgba(7,16,21,.88);
  }
  .status-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); }
  .status-head span:first-child { color: var(--text-muted); font-size: var(--fs-label); font-weight: 700; }
  .status-count { color: var(--accent); font-size: var(--fs-lead); font-weight: 700; }
  .step-marks { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); }
  .step-mark {
    width: 24px;
    height: 32px;
    border: 1px solid var(--line-strong);
    border-radius: 48% 48% 42% 42%;
    color: var(--text-faint);
    background: var(--surface-2);
  }
  .step-mark.done { border-color: var(--accent); background: var(--surface-yellow); box-shadow: 0 0 10px rgba(255,204,77,.28); }
  .step-name { margin-top: var(--sp-2); color: var(--primary-bright); font-size: var(--fs-sec); line-height: var(--lh-copy); }
  .age-plate {
    position: absolute;
    z-index: 8;
    right: var(--sp-4);
    bottom: 94px;
    min-width: 250px;
    padding: var(--sp-3) var(--sp-4);
    border: 1px solid var(--line-strong);
    border-left: 4px solid var(--primary);
    background: rgba(7,16,21,.88);
  }
  .age-plate.is-complete { border-color: var(--accent); border-left-color: var(--accent); box-shadow: 0 0 22px rgba(255,204,77,.22); }
  .age-label { color: var(--text-muted); font-size: var(--fs-label); }
  .age-value { color: var(--primary-bright); font-size: var(--fs-lead); font-weight: 700; }
  .age-plate.is-complete .age-value { color: var(--accent); }
  .tray {
    position: absolute;
    z-index: 9;
    right: var(--sp-4);
    bottom: var(--sp-4);
    left: var(--sp-4);
    display: flex;
    align-items: center;
    gap: var(--sp-4);
    min-height: 62px;
    box-sizing: border-box;
    padding: var(--sp-2) var(--sp-3);
    border: var(--border);
    background: rgba(7,16,21,.9);
  }
  .tray-label { width: 210px; color: var(--text-muted); font-size: var(--fs-label); line-height: 1.35; }
  .turn-controls { display: flex; gap: var(--sp-2); }
  .turn-controls button { min-width: 48px; padding: 0; font-size: 22px; }
  .rotation-readout { width: 94px; color: var(--text-muted); font-size: var(--fs-label); }
  .feedback { flex: 1 1 0; min-width: 0; color: var(--text-strong); font-size: var(--fs-sec); line-height: var(--lh-copy); }
  .feedback.is-error { color: var(--danger); }
  .reset-btn { flex: 0 0 auto; font-size: var(--fs-sec); }
  .foot-piece {
    position: absolute;
    z-index: 10;
    width: 48px;
    height: 80px;
    box-sizing: border-box;
    border: 3px solid var(--text-strong);
    border-radius: 48% 48% 42% 42% / 35% 35% 60% 60%;
    background: rgba(233,241,239,.12);
    box-shadow: inset 0 0 0 1px rgba(7,16,21,.45), 0 6px 20px rgba(0,0,0,.32);
    cursor: grab;
    touch-action: none;
    transform: translate(-50%, -50%) rotate(var(--angle));
    transition: box-shadow 160ms ease, border-color 160ms ease;
  }
  .foot-piece::before {
    content: "";
    position: absolute;
    top: -17px;
    left: -2px;
    width: 46px;
    height: 28px;
    background: radial-gradient(circle at 7px 17px, var(--text-strong) 0 4px, transparent 5px), radial-gradient(circle at 17px 9px, var(--text-strong) 0 5px, transparent 6px), radial-gradient(circle at 29px 6px, var(--text-strong) 0 5px, transparent 6px), radial-gradient(circle at 41px 10px, var(--text-strong) 0 5px, transparent 6px), radial-gradient(circle at 49px 18px, var(--text-strong) 0 4px, transparent 5px);
  }
  .foot-piece[data-side="R"] { border-style: dashed; }
  .foot-piece:focus-visible { outline: 3px solid var(--focus); outline-offset: 5px; }
  .foot-piece.is-dragging { cursor: grabbing; border-color: var(--accent); box-shadow: 0 0 0 8px rgba(255,204,77,.12), 0 0 24px rgba(255,204,77,.45); }
  .foot-piece.is-wrong { animation: wrong 240ms ease 2; }
  .placed-foot {
    position: absolute;
    z-index: 5;
    width: 56px;
    height: 100px;
    box-sizing: border-box;
    border: 3px solid var(--accent);
    border-radius: 48% 48% 42% 42% / 35% 35% 60% 60%;
    background: rgba(255,204,77,.12);
    transform: translate(-50%, -50%) rotate(var(--angle));
    box-shadow: 0 0 18px rgba(255,204,77,.45);
    pointer-events: none;
  }
  .placed-foot[data-side="R"] { border-style: dashed; }
  .claim {
    position: absolute;
    z-index: 8;
    bottom: 98px;
    left: var(--sp-4);
    max-width: 720px;
    padding: var(--sp-3) var(--sp-4);
    color: var(--text-strong);
    font-size: var(--fs-lead);
    font-weight: 700;
    line-height: var(--lh-copy);
    border-left: 5px solid var(--accent);
    background: rgba(7,16,21,.9);
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
  }
  .claim.show { opacity: 1; transform: none; transition: opacity 220ms ease, transform 220ms ease; }
  @keyframes wrong { 0%,100% { margin-left: 0; } 35% { margin-left: -10px; } 70% { margin-left: 10px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>

  piece.dataset.side = target.side;
  const side = target.side === 'L' ? '左脚' : '右脚';
  piece.setAttribute('aria-label', `当前${side}轮廓，可拖动；方向键移动，方括号键旋转`);
  sideLabel.textContent = side;
  stepName.textContent = `当前：${target.result}`;
  homePiece();
}
function reject() {
  piece.classList.remove('is-wrong');
  void piece.offsetWidth;
  piece.classList.add('is-wrong');
  feedback.className = 'feedback is-error';
  feedback.textContent = '这一处的左右脚方向或落点不符。';
  setReveal(state.x, state.y, ALIGN.revealRadius);
  homePiece();
}
function accept() {
  const target = targets[state.index];
  const placed = document.createElement('span');
  placed.className = 'placed-foot';
  placed.dataset.side = target.side;
  placed.style.left = `${target.x}px`;
  placed.style.top = `${target.y}px`;
  placed.style.setProperty('--angle', `${target.angle}deg`);
  placed.setAttribute('aria-hidden', 'true');
  lab.appendChild(placed);
  document.getElementById(`ring${state.index}`).classList.add('done');
  marks.children[state.index].classList.add('done');
  marks.children[state.index].setAttribute('aria-label', `第 ${state.index + 1} 位已对齐`);
  feedback.className = 'feedback';
  feedback.textContent = target.result;
  state.index += 1;
  statusCount.textContent = `${state.index} / ${ALIGN.requiredMatches}`;
  routeLive.style.setProperty('--matched', state.index);
  if (state.index === ALIGN.requiredMatches) {
    piece.hidden = true;
    document.getElementById('turnLeft').disabled = true;
    document.getElementById('turnRight').disabled = true;
    stepName.textContent = '左右交替 · 连续前进';
    feedback.textContent = '两条行程线已经贯通。';
    agePlate.classList.add('is-complete');
    claim.classList.add('show');
    setReveal(704, 276, 760);
    return;
  }
  updateCurrent();
}
function evaluate() {
  const target = targets[state.index];
  const distance = Math.hypot(state.x - target.x, state.y - target.y);
  if (distance <= ALIGN.snapDistance && angleGap(state.angle, target.angle) <= ALIGN.snapAngle) accept();
  else reject();
}
function rotate(delta) {
  if (piece.hidden) return;
  state.angle = (state.angle + delta + 360) % 360;
  renderPiece();
}

piece.addEventListener('pointerdown', (event) => {
  state.dragging = true;
  piece.classList.add('is-dragging');
  piece.setPointerCapture(event.pointerId);
  const p = Deck.pt(lab, event);
  state.x = p.x;
  state.y = p.y;
  setReveal(p.x, p.y, ALIGN.revealRadius);
  renderPiece();
});
piece.addEventListener('pointermove', (event) => {
  if (!state.dragging) return;
  const p = Deck.pt(lab, event);
  state.x = Deck.clamp(p.x, 42, 1366);
  state.y = Deck.clamp(p.y, 62, 520);
  setReveal(p.x, p.y, ALIGN.revealRadius);
  renderPiece();
});
piece.addEventListener('pointerup', () => {
  if (!state.dragging) return;
  state.dragging = false;
  piece.classList.remove('is-dragging');
  evaluate();
});
piece.addEventListener('pointercancel', () => {
  state.dragging = false;
  piece.classList.remove('is-dragging');
  homePiece();
});
lab.addEventListener('pointermove', (event) => {
  if (state.dragging || event.pointerType === 'touch') return;
  const p = Deck.pt(lab, event);
  setReveal(p.x, p.y, ALIGN.revealRadius);
});
lab.addEventListener('pointerleave', () => {
  if (!state.dragging && state.index < ALIGN.requiredMatches) setReveal(0, 0, 0);
});
piece.addEventListener('keydown', (event) => {
  const step = event.shiftKey ? 12 : 4;
  if (event.key === 'ArrowLeft') state.x -= step;
  else if (event.key === 'ArrowRight') state.x += step;
  else if (event.key === 'ArrowUp') state.y -= step;
  else if (event.key === 'ArrowDown') state.y += step;
  else if (event.key === '[') rotate(-4);
  else if (event.key === ']') rotate(4);
  else if (event.key === 'Enter' || event.key === ' ') evaluate();
  else return;
  event.preventDefault();
  state.x = Deck.clamp(state.x, 42, 1366);
  state.y = Deck.clamp(state.y, 62, 520);
  setReveal(state.x, state.y, ALIGN.revealRadius);
  renderPiece();
});
document.getElementById('turnLeft').addEventListener('click', () => rotate(-4));
document.getElementById('turnRight').addEventListener('click', () => rotate(4));
document.getElementById('resetBtn').addEventListener('click', () => {
  state.index = 0;
  state.dragging = false;
  lab.querySelectorAll('.placed-foot').forEach(el => el.remove());
  lab.querySelectorAll('.site-ring').forEach(el => el.classList.remove('done'));
  Array.from(marks.children).forEach((el, i) => {
    el.classList.remove('done');
    el.setAttribute('aria-label', `第 ${i + 1} 位未对齐`);
  });
  statusCount.textContent = '0 / 6';
  routeLive.style.setProperty('--matched', 0);
  agePlate.classList.remove('is-complete');
  claim.classList.remove('show');
  piece.hidden = false;
  document.getElementById('turnLeft').disabled = false;
  document.getElementById('turnRight').disabled = false;
  feedback.className = 'feedback';
  feedback.textContent = '先找左侧较近的足形凹痕。';
  setReveal(0, 0, 0);
  updateCurrent();
  piece.focus();
});
updateCurrent();
</script>
</body>
</html>
