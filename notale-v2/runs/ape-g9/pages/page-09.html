<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .assembly-page{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:var(--sp-5);width:100%;height:100%;min-width:0;min-height:0}
  .bench{position:relative;min-width:0;min-height:0;overflow:hidden;border:var(--border);border-left:3px solid var(--primary);border-radius:var(--radius-3);background:linear-gradient(90deg,rgba(53,198,180,.06),transparent 42%),var(--surface-1)}
  .bench::before{content:"";position:absolute;inset:0;background:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;opacity:.22;pointer-events:none}
  .bench-head{position:absolute;z-index:5;top:var(--sp-4);left:var(--sp-5);display:flex;align-items:center;gap:var(--sp-4)}
  .bench-head strong{font-family:var(--font-narrow);font-size:var(--fs-h2);line-height:1.3;color:var(--text-strong)}
  .bench-head span{font-size:var(--fs-label);color:var(--text-muted)}
  .specimen{position:absolute;top:14px;bottom:18px;left:15%;width:45%;margin:0;display:flex;justify-content:center;pointer-events:none}
  .specimen img{height:100%;max-width:100%;object-fit:contain;filter:grayscale(1) contrast(1.18);mix-blend-mode:screen;opacity:.19}
  .specimen figcaption{position:absolute;left:4px;bottom:42px;font-size:var(--fs-label);line-height:1.35;color:var(--text-faint)}
  .body-overlay{position:absolute;z-index:2;top:18px;bottom:18px;left:4%;width:92%;height:calc(100% - 36px);overflow:visible;pointer-events:none}
  .body-outline{fill:none;stroke:var(--line-strong);stroke-width:1.5;stroke-dasharray:5 7}
  .load-base{fill:none;stroke:#6e8588;stroke-width:5;stroke-linecap:round;opacity:.62}
  .load-segment{fill:none;stroke:var(--primary);stroke-width:5;stroke-linecap:round;stroke-dasharray:1 12;opacity:.12;transition:opacity 180ms ease,stroke-dasharray 240ms ease}
  .load-segment.on{opacity:1;stroke-dasharray:none}
  .load-segment.pulse{animation:pathPulse 520ms ease-out}
  .gravity{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;opacity:0;transition:opacity 220ms ease}
  .gravity.on{opacity:1;animation:gravityDrop 900ms ease-out}
  .ground{stroke:var(--line-strong);stroke-width:2}
  .ground-label{fill:var(--text-muted);font:15px var(--font-sans)}
  .slot{position:absolute;z-index:4;left:calc(37.5% - 84px);width:168px;box-sizing:border-box;border:1.5px dashed #6e8588;border-radius:var(--radius-2);background:rgba(7,16,21,.66);color:var(--text-muted);font-size:var(--fs-label);font-weight:700;line-height:1.35;text-align:center;display:flex;align-items:center;justify-content:center;transition:border-color 180ms ease,background 180ms ease,color 180ms ease}
  .slot::after{content:"";position:absolute;left:100%;top:50%;width:70px;border-top:1.5px solid #6e8588}
  .slot[data-slot="spine"]{top:112px;height:116px}
  .slot[data-slot="pelvis"]{top:246px;height:72px}
  .slot[data-slot="femur"]{top:338px;height:114px}
  .slot[data-slot="foot"]{top:486px;height:54px}
  .slot.is-target{border-color:var(--accent);color:var(--accent);background:var(--surface-yellow)}
  .slot.is-done{border-style:solid;border-color:var(--primary);color:var(--primary-bright);background:var(--surface-teal)}
  .slot.is-done::after{border-color:var(--primary)}
  .annotation{position:absolute;z-index:4;left:59%;right:var(--sp-3);min-height:72px;padding:var(--sp-3) var(--sp-4);box-sizing:border-box;border:var(--border);border-left:3px solid var(--line-strong);background:rgba(13,26,32,.74);color:var(--text-faint);font-size:var(--fs-sec);line-height:var(--lh-copy);opacity:.42;transition:opacity 180ms ease,border-color 180ms ease,color 180ms ease}
  .annotation strong{display:block;color:inherit;font-family:var(--font-narrow);font-size:var(--fs-body);line-height:1.35}
  .annotation[data-for="spine"]{top:92px}.annotation[data-for="pelvis"]{top:226px}.annotation[data-for="femur"]{top:322px}.annotation[data-for="foot"]{top:462px}
  .annotation.on{opacity:1;color:var(--text);border-color:var(--primary)}
  .feedback{position:absolute;z-index:6;right:var(--sp-4);bottom:var(--sp-4);left:var(--sp-5);min-height:30px;color:var(--accent);font-size:var(--fs-sec);line-height:var(--lh-copy)}
  .side{display:flex;flex-direction:column;gap:var(--sp-3);min-width:0;min-height:0}
  .statusbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);min-height:44px;padding:0 var(--sp-3);border-bottom:2px solid var(--line-strong)}
  .statusbar strong{font-family:var(--font-mono);font-size:var(--fs-lead);color:var(--accent)}
  .done-note{font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--primary-bright);visibility:hidden}
  .done-note.on{visibility:visible}
  .parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-3)}
  .part{position:relative;min-width:0;min-height:88px;padding:var(--sp-4);justify-content:flex-start;border-left:3px solid var(--primary-dark);background:var(--surface-2);font-size:var(--fs-body);touch-action:none;user-select:none;transition:transform 120ms ease,opacity 160ms ease}
  .part span{display:block;width:100%;text-align:left}.part small{display:block;margin-top:2px;color:var(--text-muted);font-size:var(--fs-label);font-weight:600;line-height:1.35}
  .part.dragging{z-index:20;border-color:var(--accent);background:var(--surface-yellow);box-shadow:var(--shadow-panel);transition:none}
  .part.shake{animation:wrongShake 300ms ease}.part.done{opacity:.38}.part:disabled{opacity:.38}
  .chain{--process-line-y:50%;flex:1 1 0;gap:var(--sp-1);padding:0 var(--sp-2);overflow:visible}
  .chain.k-process.is-vertical>.axis{top:20px;bottom:20px;left:25px}
  .chain.k-process.is-vertical>.step{min-height:48px;padding:var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-6);border-top:var(--border);border-left:3px solid var(--primary-dark);border-radius:var(--radius-2);background:var(--surface-1)}
  .chain .step strong{font-family:var(--font-narrow);font-size:var(--fs-body);line-height:1.35;color:var(--text-strong)}
  .chain .step span{font-size:var(--fs-label);line-height:1.35;color:var(--text-muted)}
  .chain .step::before{content:"";position:absolute;left:13px;top:50%;width:10px;height:10px;border:2px solid #6e8588;border-radius:50%;background:var(--surface-1);transform:translateY(-50%)}
  .chain .step.is-current{border-color:var(--accent);background:var(--surface-yellow)}
  .chain .step.is-current::before{border-color:var(--accent);background:var(--accent)}
  .chain .step.is-past{filter:none;color:inherit;border-left-color:var(--primary);background:var(--surface-teal)}
  .chain .step.is-past::before{border-color:var(--primary);background:var(--primary)}
  .chain.k-process.is-vertical>.arw{flex-basis:12px;font-size:var(--fs-body)}
  .side-foot{display:flex;align-items:center;gap:var(--sp-3)}
  .claim{flex:1 1 0;padding:var(--sp-3);border-left:4px solid var(--accent);background:var(--surface-yellow);color:var(--text-strong);font-size:var(--fs-sec);font-weight:700;line-height:var(--lh-copy)}
  .reset{flex:0 0 44px;width:44px;height:44px;padding:0;font-size:24px;line-height:1}
  @keyframes wrongShake{0%,100%{transform:translateX(0)}30%{transform:translateX(-8px)}65%{transform:translateX(8px)}}
  @keyframes pathPulse{0%{filter:drop-shadow(0 0 0 transparent)}45%{filter:drop-shadow(0 0 8px var(--primary-bright))}100%{filter:drop-shadow(0 0 0 transparent)}}
  @keyframes gravityDrop{0%{stroke-dasharray:0 600;opacity:0}20%{opacity:1}100%{stroke-dasharray:600 0;opacity:1}}
  @media(prefers-reduced-motion:reduce){.load-segment,.gravity,.slot,.annotation,.part{transition:none!important;animation:none!important}}
  .lec-progress{overflow:visible}
</style>

<script>
Lec.mount({index: 9, kicker: 'BODY ASSEMBLY', title: '直立不是一块骨头的功劳', take: '双足行走依靠骨盆、脊柱、股骨和足部共同改变。'});

(function(){
  const order=['spine','pelvis','femur','foot'];
  const labels={spine:'脊柱',pelvis:'骨盆',femur:'股骨',foot:'足部'};
  const bench=document.getElementById('bench');
  const count=document.getElementById('count');
  const feedback=document.getElementById('feedback');
  const doneNote=document.getElementById('doneNote');
  const gravity=document.getElementById('gravity');
  let completed=[];
  let drag=null;

  function refresh(){
    const next=order[completed.length];
    count.textContent=completed.length+' / '+order.length;
    order.forEach((id,i)=>{
      const isDone=completed.includes(id);
      const step=document.querySelector('[data-step="'+id+'"]');
      const slot=document.querySelector('[data-slot="'+id+'"]');
      const part=document.querySelector('[data-part="'+id+'"]');
      const note=document.querySelector('[data-for="'+id+'"]');
      const path=document.getElementById('path-'+id);
      step.classList.toggle('is-past',isDone);
      step.classList.toggle('is-current',id===next);
      if(id===next) step.setAttribute('aria-current','step'); else step.removeAttribute('aria-current');
      slot.classList.toggle('is-done',isDone);
      slot.textContent=isDone?labels[id]+'已接通':labels[id]+'空位';
      part.disabled=isDone;
      part.classList.toggle('done',isDone);
      note.classList.toggle('on',isDone);
      path.classList.toggle('on',isDone);
    });
    const done=completed.length===order.length;
    doneNote.classList.toggle('on',done);
    gravity.classList.toggle('on',done);
    if(done) feedback.textContent='重量可以沿连续结构从躯干传到地面。';
  }

  function install(id){
    const expected=order[completed.length];
    const part=document.querySelector('[data-part="'+id+'"]');
    if(id!==expected){
      part.classList.remove('shake'); void part.offsetWidth; part.classList.add('shake');
      feedback.textContent='这里接不上：观察部件与相邻关节的形状。下一段应接入'+labels[expected]+'。';
      return;
    }
    completed.push(id);
    refresh();
    const path=document.getElementById('path-'+id);
    path.classList.remove('pulse'); void path.getBoundingClientRect(); path.classList.add('pulse');
    if(completed.length<order.length) feedback.textContent=labels[id]+'已归位。继续连接'+labels[order[completed.length]]+'。';
  }

  function slotAt(x,y){
    return order.find(id=>{
      const el=document.querySelector('[data-slot="'+id+'"]');
      const r=el.getBoundingClientRect();
      return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
    });
  }

  document.querySelectorAll('.part').forEach(part=>{
    part.addEventListener('click',()=>install(part.dataset.part));
    part.addEventListener('pointerdown',e=>{
      if(part.disabled) return;
      e.preventDefault();
      part.setPointerCapture(e.pointerId);
      drag={part,id:part.dataset.part,startX:e.clientX,startY:e.clientY,moved:false};
      part.classList.add('dragging');
    });
    part.addEventListener('pointermove',e=>{
      if(!drag||drag.part!==part) return;
      const dx=(e.clientX-drag.startX)/Deck.s;
      const dy=(e.clientY-drag.startY)/Deck.s;
      drag.moved=drag.moved||Math.abs(dx)+Math.abs(dy)>6;
      part.style.transform='translate('+dx+'px,'+dy+'px)';
      document.querySelectorAll('.slot').forEach(s=>s.classList.remove('is-target'));
      const hit=slotAt(e.clientX,e.clientY);
      if(hit) document.querySelector('[data-slot="'+hit+'"]').classList.add('is-target');
    });
    part.addEventListener('pointerup',e=>{
      if(!drag||drag.part!==part) return;
      const hit=slotAt(e.clientX,e.clientY);
      part.classList.remove('dragging');
      part.style.transform='';
      document.querySelectorAll('.slot').forEach(s=>s.classList.remove('is-target'));
      const moved=drag.moved; drag=null;
      if(moved){
        if(hit===part.dataset.part) install(part.dataset.part);
        else {
          part.classList.remove('shake'); void part.offsetWidth; part.classList.add('shake');
          feedback.textContent='这里接不上：观察部件与相邻关节的形状。';
        }
      }
    });
    part.addEventListener('pointercancel',()=>{part.classList.remove('dragging');part.style.transform='';drag=null;});
  });

  document.getElementById('reset').addEventListener('click',()=>{
    completed=[];
    feedback.textContent='从脊柱开始：拖动部件，观察承重路径如何接通。';
    refresh();
  });
  refresh();
})();
</script>
</body>
</html>
