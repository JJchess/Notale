<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  evidence-sorter { display:block; width:100%; height:100%; min-width:0; min-height:0; }
  .lec-progress { overflow:visible; }
</style>
</head>
<body data-page="13" data-total="52">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({index: 13, kicker: 'EVIDENCE DESK', title: '证据不是同一把尺', take: '化石、遗物、基因与现代观察回答的问题不同，确定性也不同。'});

const gameConfig = {cardCount: 6, categories: ['化石','遗物','基因','现代观察'], confidenceLabels: ['直接支持','受条件限制','类比线索'], successText: '归类正确：现在检查它能回答什么。', completionText: '可信度不由证据名称决定，而由问题是否匹配、推断有几步、证据能否相互印证决定。'};

class EvidenceSorter extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({mode:'open'}).innerHTML = '<slot></slot>';
    this.cards = [
      {id:'fossil-form', front:'有年代地层中的人类化石', category:'化石', can:'当时存在何种身体形态', cannot:'是否会语言或举行仪式', mark:'直接支持形态，行为推断受限'},
      {id:'fossil-heal', front:'带愈合痕迹的受伤个体遗存', category:'化石', can:'个体曾受伤并存活一段时间', cannot:'是否一定得到他人照料', mark:'受条件限制'},
      {id:'artifact-wear', front:'带使用磨痕的石器', category:'遗物', can:'工具曾怎样接触材料', cannot:'仅凭石器确定制作者身份', mark:'直接支持用途，身份受限'},
      {id:'dna', front:'保存可靠的古 DNA 片段', category:'基因', can:'个体间亲缘与群体联系', cannot:'日常行为与社会规则', mark:'直接支持亲缘，保存条件受限'},
      {id:'primate-learning', front:'现生灵长类的社会学习记录', category:'现代观察', can:'学习机制在今天如何发生', cannot:'远古某次行为确实发生过', mark:'类比线索'},
      {id:'motion-test', front:'现代人的受控运动实验', category:'现代观察', can:'活体机制在实验条件下怎样运作', cannot:'古人处于完全相同条件', mark:'直接支持现今机制，外推受限'}
    ];
    this.state = this.freshState();
    this.drag = null;
  }

  freshState() {
    return {started:false, archived:{}, selected:0, errors:0, complete:false, trace:[]};
  }

  connectedCallback() {
    this.render();
    this.bind();
    this.start();
  }

  start() {
    if (this.state.started) return;
    this.state.started = true;
    this.dispatchEvent(new CustomEvent('game-start', {bubbles:true, composed:true}));
  }

  reset() {
    this.state = this.freshState();
    this.render();
    this.bind();
    this.start();
    this.dispatchEvent(new CustomEvent('game-reset', {bubbles:true, composed:true}));
  }

  getState() {
    return JSON.parse(JSON.stringify(this.state));
  }

  transition(action) {
    if (action.type === 'select') {
      const pending = this.cards.filter(card => !this.state.archived[card.id]);
      if (!pending.length) return;
      this.state.selected = (this.state.selected + action.delta + pending.length) % pending.length;
      this.syncSelection();
      return;
    }
    if (action.type !== 'archive' || this.state.archived[action.id]) return;
    const card = this.cards.find(item => item.id === action.id);
    if (!card) return;
    if (card.category !== action.category) {
      this.state.errors += 1;
      this.state.trace.push({card:card.id, category:action.category, correct:false});
      this.rejectCard(card.id);
      this.emitProgress(action, false);
      return;
    }
    this.state.archived[card.id] = card.category;
    this.state.trace.push({card:card.id, category:action.category, correct:true});
    this.state.selected = 0;
    this.state.complete = Object.keys(this.state.archived).length === gameConfig.cardCount;
    this.render();
    this.bind();
    this.announce(this.state.complete ? gameConfig.completionText : gameConfig.successText);
    this.emitProgress(action, true);
    if (this.state.complete) {
      this.dispatchEvent(new CustomEvent('game-complete', {bubbles:true, composed:true, detail:{score:gameConfig.cardCount, metrics:{archived:gameConfig.cardCount, errors:this.state.errors}, trace:this.state.trace.slice()}}));
    }
  }

  emitProgress(action, correct) {
    this.dispatchEvent(new CustomEvent('game-progress', {bubbles:true, composed:true, detail:{state:this.getState(), action, metrics:{archived:Object.keys(this.state.archived).length, errors:this.state.errors, correct}}}));
  }

  archive(cardId, category) {
    this.transition({type:'archive', id:cardId, category});
  }

  rejectCard(id) {
    const el = this.querySelector('[data-card="' + id + '"]');
    if (!el) return;
    el.classList.remove('is-dragging');
    el.style.transform = '';
    el.classList.add('is-wrong');
    this.announce('分类看证据本身：这不是你选择的证据类型。');
    window.setTimeout(() => el.classList.remove('is-wrong'), Deck.reduced() ? 0 : 360);
  }

  announce(text) {
    const live = this.querySelector('#live');
    if (live) live.textContent = text;
  }

  bind() {
    const board = this.querySelector('.game-board');
    const reset = this.querySelector('#reset');
    reset.addEventListener('click', () => this.reset());
    board.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
        event.preventDefault(); this.transition({type:'select', delta:-1});
      } else if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
        event.preventDefault(); this.transition({type:'select', delta:1});
      } else if (/^[1-4]$/.test(event.key)) {
        const pending = this.cards.filter(card => !this.state.archived[card.id]);
        const chosen = pending[this.state.selected];
        if (chosen) this.archive(chosen.id, gameConfig.categories[Number(event.key) - 1]);
      }
    });
    this.querySelectorAll('.evidence-card:not(.is-archived)').forEach(card => {
      card.addEventListener('pointerdown', event => this.pointerDown(event, card));
      card.addEventListener('click', () => {
        const pending = this.cards.filter(item => !this.state.archived[item.id]);
        this.state.selected = Math.max(0, pending.findIndex(item => item.id === card.dataset.card));
        this.syncSelection();
        board.focus();
      });
    });
  }

  syncSelection() {
    const pending = this.cards.filter(card => !this.state.archived[card.id]);
    this.querySelectorAll('.evidence-card:not(.is-archived)').forEach(el => {
      el.classList.toggle('is-selected', pending[this.state.selected] && el.dataset.card === pending[this.state.selected].id);
    });
    const name = pending[this.state.selected] ? pending[this.state.selected].front : '';
    this.announce(name ? '已选择：' + name + '。按数字 1 到 4 归档。' : '');
  }

  pointerDown(event, card) {
    if (event.button !== 0 && event.pointerType !== 'touch') return;
    event.preventDefault();
    const board = this.querySelector('.game-board');
    const p = Deck.pt(board, event);
    this.drag = {id:card.dataset.card, pointer:event.pointerId, x:p.x, y:p.y, el:card};
    card.setPointerCapture(event.pointerId);
    card.classList.add('is-dragging');
    const move = e => {
      if (!this.drag || e.pointerId !== this.drag.pointer) return;
      const q = Deck.pt(board, e);
      card.style.transform = 'translate(' + (q.x - this.drag.x) + 'px,' + (q.y - this.drag.y) + 'px) rotate(1deg)';
    };
    const up = e => {
      if (!this.drag || e.pointerId !== this.drag.pointer) return;
      card.removeEventListener('pointermove', move);
      card.removeEventListener('pointerup', up);
      card.removeEventListener('pointercancel', cancel);
      const hit = document.elementFromPoint(e.clientX, e.clientY);
      const cabinet = hit && hit.closest ? hit.closest('[data-category]') : null;
      const id = this.drag.id;
      this.drag = null;
      if (cabinet) this.archive(id, cabinet.dataset.category);
      else { card.classList.remove('is-dragging'); card.style.transform = ''; }
    };
    const cancel = () => {
      card.classList.remove('is-dragging'); card.style.transform = ''; this.drag = null;
    };
    card.addEventListener('pointermove', move);
    card.addEventListener('pointerup', up);
    card.addEventListener('pointercancel', cancel);
  }

  renderCard(card, archived) {
    if (archived) {
      return `<article class="evidence-card is-archived" data-card="${card.id}" aria-label="${card.front}，已归入${card.category}">
        <div class="card-title">${card.front}</div>
        <div class="boundary can"><b>能回答</b><span>${card.can}</span></div>
        <div class="boundary cannot"><b>不能单独回答</b><span>${card.cannot}</span></div>
        <div class="confidence">${card.mark}</div>
      </article>`;
    }
    return `<article class="evidence-card${this.cards.filter(item => !this.state.archived[item.id])[this.state.selected]?.id === card.id ? ' is-selected' : ''}" data-card="${card.id}" role="option" aria-selected="false">
      <span class="file-code">EVIDENCE FILE</span><div class="card-title">${card.front}</div><span class="grip" aria-hidden="true">⋮⋮</span>
    </article>`;
  }

  render() {
    const archivedCount = Object.keys(this.state.archived).length;
    const pending = this.cards.filter(card => !this.state.archived[card.id]);
    const cabinets = gameConfig.categories.map((category, index) => {
      const stored = this.cards.filter(card => this.state.archived[card.id] === category);
      return `<section class="box cabinet${stored.length ? ' has-card' : ''}" data-category="${category}" aria-label="${category}证据柜，已收${stored.length}张">
        <div class="bt"><span class="cabinet-index">${index + 1}</span>${category}<span class="cabinet-count">${stored.length} 张</span></div>
        <div class="shelf">${stored.length ? stored.map(card => this.renderCard(card, true)).join('') : '<span class="drop-copy">拖到这里</span>'}</div>
      </section>`;
    }).join('');
    this.innerHTML = `<style>
      evidence-sorter { display:block; width:100%; height:100%; color:var(--text); font-family:var(--font-sans); }
      * { box-sizing:border-box; }
      button { font-family:inherit; }
      .game-board { position:relative; display:flex; flex-direction:column; gap:8px; width:100%; height:100%; min-width:0; min-height:0; outline:none; }
      .structure-map { position:absolute; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none; }
      .structure-map path { fill:none; stroke:var(--primary-dark); stroke-width:2; vector-effect:non-scaling-stroke; }
      .structure-map .join { opacity:0; stroke:var(--primary); stroke-width:3; }
      .game-board.is-complete .structure-map .join { opacity:1; }
      .game-board:focus-visible { outline:3px solid var(--focus); outline-offset:4px; }
      .k-classification { display:flex; flex-direction:column; gap:12px; width:100%; min-width:0; }
      .lv { position:relative; min-width:0; padding-left:24px; border-left:4px solid var(--primary-dark); }
      .lv::before { content:""; position:absolute; top:22px; left:0; width:16px; height:2px; background:var(--primary-dark); }
      .box { min-width:0; border:2px solid var(--line-strong); border-left:4px solid var(--primary); border-radius:var(--radius-3); background:var(--surface-1); }
      .bt { color:var(--text-strong); font-family:var(--font-narrow); font-size:var(--fs-h2); font-weight:700; line-height:1.3; background:var(--surface-teal); }
      .claim-box { position:relative; flex:0 0 42px; display:flex; align-items:center; gap:16px; padding:8px 20px; border-left-color:var(--accent); background:var(--surface-yellow); }
      .claim-label { flex:0 0 auto; color:var(--accent); font-family:var(--font-mono); font-size:var(--fs-label); font-weight:700; }
      .claim-text { color:var(--text-strong); font-size:var(--fs-lead); font-weight:700; line-height:1.45; }
      .branches { position:relative; flex:0 0 18px; margin:0 8%; }
      .branches::before { content:""; position:absolute; top:0; left:50%; width:2px; height:8px; background:var(--primary); }
      .branches::after { content:""; position:absolute; top:8px; right:12.5%; left:12.5%; height:10px; border-top:2px solid var(--primary); border-right:2px solid var(--primary); border-left:2px solid var(--primary); }
      .cabinet-row { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; flex:0 0 258px; min-width:0; }
      .cabinet { display:flex; flex-direction:column; min-width:0; padding:0; overflow:hidden; transition:border-color 180ms ease, background 180ms ease; }
      .cabinet.has-card { border-color:var(--primary); background:rgba(53,198,180,.07); }
      .cabinet > .bt { display:flex; align-items:center; gap:10px; flex:0 0 44px; padding:8px 12px; border-bottom:var(--border); font-size:var(--fs-h2); }
      .cabinet-index { display:grid; place-items:center; width:26px; height:26px; color:var(--accent-ink); font-family:var(--font-mono); font-size:var(--fs-label); border-radius:50%; background:var(--accent); }
      .cabinet-count { margin-left:auto; color:var(--text-muted); font-family:var(--font-mono); font-size:var(--fs-label); font-weight:600; }
      .shelf { display:flex; flex-direction:column; justify-content:center; gap:8px; flex:1 1 0; min-height:0; padding:8px; }
      .drop-copy { align-self:center; color:var(--text-faint); font-size:var(--fs-sec); line-height:1.45; }
      .tray { position:relative; flex:1 1 0; min-height:0; padding:12px 16px 10px 40px; border:1px solid var(--line-strong); border-left:4px solid var(--primary-dark); background:linear-gradient(90deg,rgba(53,198,180,.07),transparent 38%),var(--surface-1); }
      .tray::before { content:"待归档"; position:absolute; top:12px; left:12px; color:var(--text-muted); font-family:var(--font-mono); font-size:var(--fs-label); font-weight:700; writing-mode:vertical-rl; }
      .tray-cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:repeat(2,minmax(0,1fr)); gap:8px 12px; height:100%; min-width:0; min-height:0; }
      .tray-empty { display:flex; align-items:center; justify-content:center; height:100%; color:var(--primary-bright); font-size:var(--fs-lead); font-weight:700; line-height:1.45; }
      .evidence-card { position:relative; min-width:0; min-height:0; border:1px solid var(--line-strong); border-left:3px solid var(--accent); border-radius:var(--radius-2); background:var(--surface-2); box-shadow:0 8px 18px rgba(0,0,0,.18); }
      .tray .evidence-card { display:flex; align-items:center; gap:12px; padding:8px 34px 8px 12px; cursor:grab; touch-action:none; user-select:none; transition:transform 180ms ease,border-color 180ms ease; }
      .tray .evidence-card.is-selected { border-color:var(--accent); box-shadow:0 0 0 2px rgba(255,204,77,.28); }
      .tray .evidence-card.is-dragging { z-index:20; cursor:grabbing; transition:none; box-shadow:0 18px 36px rgba(0,0,0,.42); }
      .tray .evidence-card.is-wrong { animation:reject 320ms ease; border-color:var(--danger); }
      .file-code { flex:0 0 auto; color:var(--text-faint); font-family:var(--font-mono); font-size:var(--fs-label); line-height:1.35; }
      .card-title { color:var(--text-strong); font-size:var(--fs-sec); font-weight:700; line-height:1.4; }
      .grip { position:absolute; right:10px; color:var(--text-muted); font-size:20px; }
      .is-archived { display:grid; grid-template-columns:92px minmax(0,1fr); gap:3px 8px; padding:7px 9px; border-left-color:var(--primary); animation:flipIn 300ms ease both; }
      .is-archived .card-title { grid-column:1/-1; padding-bottom:4px; border-bottom:var(--border); }
      .boundary { display:contents; }
      .boundary b { color:var(--text-muted); font-size:var(--fs-label); line-height:1.35; }
      .boundary span { color:var(--text); font-size:var(--fs-sec); line-height:1.4; }
      .cannot b { color:var(--accent); }
      .confidence { grid-column:1/-1; color:var(--primary-bright); font-size:var(--fs-label); font-weight:700; line-height:1.35; }
      .result-row { position:relative; display:flex; align-items:center; gap:16px; flex:0 0 46px; min-width:0; }
      .status { flex:0 0 180px; color:var(--text-strong); font-family:var(--font-mono); font-size:var(--fs-sec); font-weight:700; }
      .result { flex:1 1 0; min-width:0; color:var(--text-muted); font-size:var(--fs-sec); line-height:1.45; }
      .result.complete { color:var(--text-strong); }
      .converge { display:none; align-items:center; gap:8px; color:var(--primary-bright); font-size:var(--fs-sec); font-weight:700; white-space:nowrap; }
      .complete + .converge, .result.complete ~ .converge { display:flex; }
      .converge::before { content:""; width:80px; height:2px; background:var(--primary); }
      .reset { flex:0 0 44px; width:44px; min-height:40px; padding:0; color:var(--text-strong); font-size:22px; border:1px solid var(--line-strong); border-radius:var(--radius-2); background:var(--surface-2); cursor:pointer; }
      .reset:hover { border-color:var(--primary); background:var(--surface-3); }
      .reset:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
      @keyframes reject { 25%{transform:translateX(-8px)} 50%{transform:translateX(8px)} 75%{transform:translateX(-4px)} }
      @keyframes flipIn { from{opacity:0;transform:rotateX(70deg)} to{opacity:1;transform:none} }
      @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
    </style>
    <div class="game-board k-classification no-pan${this.state.complete ? ' is-complete' : ''}" tabindex="0" role="application" aria-label="证据可信度分拣。方向键选择档案，数字一到四对应四个证据柜。">
      <svg class="structure-map" viewBox="0 0 1408 620" preserveAspectRatio="none" aria-label="关于过去的主张分叉到四类证据，完成后重新汇合为相互印证">
        <path d="M704 42 V74 H190 V94 M704 74 H533 V94 M704 74 H875 V94 M704 74 H1218 V94"/>
        <path class="join" d="M190 352 V378 H704 M533 352 V378 H704 M875 352 V378 H704 M1218 352 V378 H704 V606"/>
      </svg>
      <section class="box claim-box"><span class="claim-label">关于过去的主张</span><span class="claim-text">先问证据是什么，再问它能支持哪个问题。</span></section>
      <div class="branches" aria-hidden="true"></div>
      <div class="cabinet-row lv" style="--level:1">${cabinets}</div>
      <section class="tray lv" style="--level:1" aria-label="待归档档案托盘">
        ${pending.length ? `<div class="tray-cards">${pending.map(card => this.renderCard(card, false)).join('')}</div>` : '<div class="tray-empty">四类证据已汇合：检查它们能否相互印证。</div>'}
      </section>
      <div class="result-row">
        <div class="status">已归档 ${archivedCount} / ${gameConfig.cardCount}</div>
        <div class="result${this.state.complete ? ' complete' : ''}">${this.state.complete ? gameConfig.completionText : '拖动档案到证据柜；键盘可用方向键选卡、数字 1–4 归档。'}</div>
        <div class="converge">相互印证</div>
        <button id="reset" class="reset" type="button" title="重置分拣" aria-label="重置分拣">↻</button>
      </div>
      <div id="live" class="sr-only" aria-live="polite"></div>
    </div>`;
  }
}
customElements.define('evidence-sorter', EvidenceSorter);
const evidenceGame = document.createElement('evidence-sorter');
document.getElementById('main').appendChild(evidenceGame);
</script>
</body>
</html>
