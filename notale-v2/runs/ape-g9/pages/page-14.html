<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main { --heat-in: 64%; --dry-out: 45%; --evap-out: 38%; --balance-x: 72%; }
  .heat-page { height: 100%; display: flex; flex-direction: column; gap: var(--sp-3); }
  .heat-scene { position: relative; flex: 0 0 334px; min-height: 0; overflow: hidden; border: var(--border); background: linear-gradient(90deg, transparent, var(--surface-teal) 48%, transparent); }
  .heat-svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .air-ring { fill: none; stroke: var(--primary-dark); stroke-width: 3; opacity: .55; transform-origin: 704px 125px; }
  .body-shape { fill: var(--surface-2); stroke: var(--primary); stroke-width: 3; }
  .body-core { fill: var(--accent); opacity: .82; }
  .heat-line { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; marker-end: url(#arrow-heat); transition: stroke-width 420ms ease-out, opacity 420ms ease-out; }
  .cool-line { fill: none; stroke: var(--primary-bright); stroke-linecap: round; marker-end: url(#arrow-cool); transition: stroke-width 420ms ease-out, opacity 420ms ease-out; }
  .dry-line { stroke-width: calc(3px + var(--dry-out) * .06); opacity: calc(.3 + var(--dry-out) * .007); }
  .evap-line { stroke-width: calc(3px + var(--evap-out) * .06); opacity: calc(.3 + var(--evap-out) * .007); }
  .heat-line { stroke-width: calc(4px + var(--heat-in) * .07); }
  .sweat-drop { fill: var(--primary-bright); transform-box: fill-box; transform-origin: center; animation: evaporate 1.8s ease-out infinite; }
  .sweat-drop:nth-of-type(2) { animation-delay: .5s; }
  .sweat-drop:nth-of-type(3) { animation-delay: 1s; }
  .is-humid .sweat-drop { animation-duration: 5s; opacity: .9; }
  .scene-label { position: absolute; z-index: 2; font-size: var(--fs-sec); line-height: var(--lh-copy); color: var(--text-muted); }
  .scene-label strong { display: block; color: var(--text-strong); font-size: var(--fs-body); }
  .label-activity { left: 88px; top: 82px; text-align: right; }
  .label-dry { right: 82px; top: 45px; }
  .label-evap { right: 74px; bottom: 36px; }
  .body-readout { position: absolute; left: 50%; top: 98px; width: 170px; transform: translateX(-50%); text-align: center; color: var(--accent-ink); font-size: var(--fs-label); font-weight: 800; line-height: 1.35; }
  .body-readout output { display: block; font-family: var(--font-mono); font-size: var(--fs-lead); }
  .model-statement { position: absolute; left: 24px; right: 24px; bottom: 10px; z-index: 2; display: flex; justify-content: space-between; gap: var(--sp-5); padding: var(--sp-2) var(--sp-4); border-left: 3px solid var(--accent); background: var(--surface-glass); color: var(--text-muted); font-size: var(--fs-sec); line-height: var(--lh-copy); }
  .model-statement strong { color: var(--text-strong); font-weight: 700; }
  .process-wrap { position: relative; flex: 0 0 112px; min-height: 0; padding: var(--sp-2); overflow: hidden; border: var(--border); background: var(--surface-1); }
  .flow-backplane { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .48; pointer-events: none; }
  .heat-process { position: relative; z-index: 1; height: 100%; gap: var(--sp-3); --process-line-y: 50%; }
  .heat-process > .step { padding: var(--sp-3) var(--sp-4); justify-content: flex-start; }
  .heat-process > .arw { flex-basis: 18px; }
  .step-name { color: var(--text-strong); font-family: var(--font-narrow); font-size: var(--fs-body); font-weight: 700; line-height: 1.35; }
  .step-value { margin-top: var(--sp-1); color: var(--text-muted); font-size: var(--fs-sec); line-height: 1.35; }
  .step-value output { color: var(--primary-bright); font-family: var(--font-mono); font-weight: 700; }
  .balance-rail { position: relative; height: 12px; margin-top: var(--sp-2); border-radius: var(--radius-1); background: linear-gradient(90deg, var(--accent) 0 43%, var(--primary-dark) 43% 57%, var(--accent) 57% 100%); }
  .balance-pin { position: absolute; top: 50%; left: var(--balance-x); width: 12px; height: 22px; border: 2px solid var(--text-strong); border-radius: var(--radius-1); background: var(--surface-0); transform: translate(-50%, -50%); transition: left 420ms ease-out; }
  .control-deck { display: flex; flex: 0 0 150px; min-height: 0; gap: var(--sp-4); align-items: stretch; }
  .environment-control { flex: 0 0 238px; display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-left: 3px solid var(--accent); background: var(--surface-yellow); }
  .environment-control label, .slider-control label { color: var(--text-strong); font-size: var(--fs-label); font-weight: 700; line-height: 1.35; }
  .environment-control select { width: 100%; }
  .env-facts { display: flex; justify-content: space-between; color: var(--text-muted); font-size: var(--fs-label); line-height: 1.35; }
  .sliders { display: flex; flex: 1 1 0; min-width: 0; gap: var(--sp-4); }
  .slider-control { flex: 1 1 0; min-width: 0; padding: var(--sp-3) var(--sp-4); border: var(--border); background: var(--surface-1); }
  .slider-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2); }
  .slider-head output { color: var(--accent); font-family: var(--font-mono); font-size: var(--fs-sec); font-weight: 700; }
  .range-ends { display: flex; justify-content: space-between; color: var(--text-faint); font-size: var(--fs-label); line-height: 1.35; }
  .status-panel { flex: 0 0 304px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; padding: var(--sp-3) var(--sp-4); border: var(--border); border-left: 3px solid var(--primary); background: var(--surface-glass); }
  .status-line { color: var(--text-strong); font-size: var(--fs-sec); line-height: var(--lh-copy); }
  .status-line strong { color: var(--accent); font-size: var(--fs-body); }
  .progress-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
  .env-nodes { display: flex; align-items: center; gap: var(--sp-2); }
  .env-node { width: 13px; height: 13px; box-sizing: border-box; border: 2px solid var(--text-muted); border-radius: 50%; }
  .env-node.is-current { border-color: var(--accent); box-shadow: 0 0 0 3px var(--surface-yellow); }
  .env-node.is-done { border-color: var(--primary); background: var(--primary); }
  .reset-btn { width: 40px; min-width: 40px; min-height: 40px; padding: 0; font-size: 23px; }
  .heat-page.is-balanced .body-shape { filter: drop-shadow(0 0 7px var(--primary)); }
  .heat-page.is-balanced .balance-pin { left: 50%; }
  .shake { animation: rail-shake 160ms ease-out; }
  .flash { animation: label-flash 420ms ease-out; }
  .complete-summary { display: none; position: absolute; inset: 16px 300px 54px; z-index: 5; align-items: center; justify-content: center; padding: var(--sp-4); border: 1px solid var(--primary); background: var(--surface-glass); color: var(--text-strong); font-size: var(--fs-lead); font-weight: 700; text-align: center; }
  .lec-progress { overflow: visible; }
  .heat-page.is-complete .complete-summary { display: flex; }
  @keyframes evaporate { 0% { transform: translateY(8px); opacity: 1; } 70%,100% { transform: translateY(-20px) scale(.55); opacity: 0; } }
  @keyframes rail-shake { 0%,100% { transform: translateX(0); } 35% { transform: translateX(-7px); } 70% { transform: translateX(7px); } }
  @keyframes label-flash { 50% { color: var(--accent); } }
  @media (prefers-reduced-motion: reduce) {
    .sweat-drop { animation: none; opacity: .7; }
    .heat-line, .cool-line, .balance-pin { transition-duration: 0ms; }
    .shake, .flash { animation: none; }
  }
</style>
</head>
<body data-page="14" data-total="52">
<div id="stage">
<main id="main">
  <section class="heat-page" id="heatPage" aria-label="人体热收支相对量模拟">
    <figure class="heat-scene min0" id="heatScene">
      <svg class="heat-svg" viewBox="0 0 1408 334" role="img" aria-labelledby="heatDiagramTitle heatDiagramDesc">
        <title id="heatDiagramTitle">人体与环境之间的热流</title>
        <desc id="heatDiagramDesc">活动向身体增加热，干性散热和汗液蒸发把热送向环境。</desc>
        <defs>
          <marker id="arrow-heat" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="var(--accent)"/></marker>
          <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="var(--primary-bright)"/></marker>
        </defs>
        <ellipse class="air-ring" cx="704" cy="124" rx="172" ry="107"/>
        <ellipse class="air-ring" cx="704" cy="124" rx="207" ry="119" opacity=".3"/>
        <path class="body-shape" d="M704 20c22 0 37 17 37 39 0 15-7 27-18 34l20 13 38 70-20 9-30-52-7 91h-40l-7-91-30 52-20-9 38-70 20-13c-11-7-18-19-18-34 0-22 15-39 37-39z"/>
        <ellipse class="body-core" cx="704" cy="125" rx="31" ry="47"/>
        <path class="heat-line" d="M474 126 C540 126 596 126 660 126"/>
        <path class="cool-line dry-line" d="M744 90 C812 58 876 54 944 58"/>
        <path class="cool-line evap-line" d="M746 157 C815 178 878 185 946 181"/>
        <g aria-hidden="true">
          <path class="sweat-drop" d="M758 111c-9 12-12 18-12 24a12 12 0 0024 0c0-6-3-12-12-24z"/>
          <path class="sweat-drop" d="M775 135c-7 9-9 14-9 19a9 9 0 0018 0c0-5-2-10-9-19z"/>
          <path class="sweat-drop" d="M752 161c-6 8-8 12-8 16a8 8 0 0016 0c0-4-2-8-8-16z"/>
        </g>
      </svg>
      <div class="scene-label label-activity"><strong>活动产热</strong><span>肌肉活动不断产生热</span></div>
      <div class="scene-label label-dry"><strong>干性散热</strong><span>皮肤向较凉环境放热</span></div>
      <div class="scene-label label-evap"><strong>蒸发散热</strong><span id="evapCaption">汗滴蒸发并带走热</span></div>
      <div class="body-readout"><span>教学基准</span><output id="baseTemp">—</output></div>
      <div class="model-statement"><span><strong>热收支：</strong>产热 − 散热 = 体内热量变化</span><span>能否持续活动，还取决于汗能否蒸发、有效散热体表与活动产热。</span></div>
      <div class="complete-summary" id="completeSummary">环境改变了可持续活动的条件</div>
    </figure>

    <div class="process-wrap min0">
      <svg class="flow-backplane" viewBox="0 0 1408 112" aria-hidden="true">
        <path d="M20 25 H330 L365 56 H690" fill="none" stroke="var(--accent)" stroke-width="4"/>
        <path d="M380 88 H690 L725 56 H1038" fill="none" stroke="var(--primary)" stroke-width="4"/>
        <path d="M735 88 H1038 L1073 56 H1388" fill="none" stroke="var(--primary-bright)" stroke-width="4"/>
      </svg>
      <div class="k-process heat-process" aria-label="热收支过程">
        <div class="axis" aria-hidden="true"></div>
        <div class="step is-past"><div class="step-name">1 活动产热</div><div class="step-value">输入 <output id="heatValue">—</output></div></div>
        <div class="arw" aria-hidden="true"></div>
        <div class="step is-past"><div class="step-name">2 干性散热</div><div class="step-value">向环境 <output id="dryValue">—</output></div></div>
        <div class="arw" aria-hidden="true"></div>
        <div class="step is-past"><div class="step-name">3 蒸发散热</div><div class="step-value">汗液蒸发 <output id="evapValue">—</output></div></div>
        <div class="arw" aria-hidden="true"></div>
        <div class="step is-current" aria-current="step"><div class="step-name">4 热收支 → 体温趋势</div><div class="balance-rail" id="balanceRail" aria-hidden="true"><span class="balance-pin"></span></div><div class="step-value"><output id="trendShort">—</output></div></div>
      </div>
    </div>

    <div class="control-deck min0">
      <div class="environment-control min0 constraint-line">
        <label for="environment">环境</label>
        <select id="environment" aria-label="选择环境"></select>
        <div class="env-facts"><span id="tempFact">温度 —</span><span id="humidityFact">湿度 —</span></div>
        <div class="note">所有量均为教学相对量</div>
      </div>

      <div class="sliders min0">
        <div class="slider-control min0" id="activityBox">
          <div class="slider-head"><label for="activity">活动强度</label><output id="activityOut">高</output></div>
          <input id="activity" type="range" min="0" max="2" step="1" value="2">
          <div class="range-ends"><span>低</span><span>高</span></div>
        </div>
        <div class="slider-control min0" id="areaBox">
          <div class="slider-head"><label for="area">有效散热体表</label><output id="areaOut">中</output></div>
          <input id="area" type="range" min="0" max="2" step="1" value="1">
          <div class="range-ends"><span>小</span><span>大</span></div>
        </div>
        <div class="slider-control min0" id="sweatBox">
          <div class="slider-head"><label for="sweat">出汗量</label><output id="sweatOut">低</output></div>
          <input id="sweat" type="range" min="0" max="2" step="1" value="0">
          <div class="range-ends"><span>低</span><span>高</span></div>
        </div>
      </div>

      <aside class="status-panel min0" aria-live="polite">
        <div class="status-line"><strong id="statusTitle">趋于升高</strong><br><span id="statusText">热留在体内：降低活动，或增加可实现的散热。</span></div>
        <div class="progress-row">
          <div><span class="muted fs-label">已平衡 </span><output class="mono fs-sec" id="progressCount">—</output></div>
          <div class="env-nodes" id="envNodes" aria-label="三个环境完成进度"></div>
          <button class="btn icon-only reset-btn" id="resetBtn" type="button" aria-label="重置模拟" title="重置">↺</button>
        </div>
      </aside>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  'use strict';
  Lec.mount({index:14,kicker:'BODY / HEAT BALANCE',title:'热从身体流向哪里',take:'出汗、体表面积、活动强度和环境共同决定人体能否持续散热。'});

  const heatMotion={entry:{duration:600,easing:'cubic-bezier(.2,.8,.2,1)'},feedback:{duration:420,easing:'ease-out'},reducedMotion:{duration:0}};
  const environments = [
    {label:'温和干燥', temperature:'较低', humidity:'低', dry:1.2, evap:0.8},
    {label:'炎热干燥', temperature:'高', humidity:'低', dry:0.3, evap:1.25},
    {label:'炎热潮湿', temperature:'高', humidity:'高', dry:0.2, evap:0.45}
  ];
  const levelNames = ['低','中','高'];
  const areaNames = ['小','中','大'];
  const activityScale = [1,2,3];
  const areaScale = [0.7,1,1.3];
  const sweatScale = [0.6,1,1.4];
  const state = {environment:0, activity:2, area:1, sweat:0, completed:[false,false,false]};
  const el = id => document.getElementById(id);
  const page = el('heatPage');
  const controls = {activity:el('activity'), area:el('area'), sweat:el('sweat')};

  environments.forEach((env, i) => {
    const option = document.createElement('option');
    option.value = String(i);
    option.textContent = env.label;
    el('environment').appendChild(option);
    const node = document.createElement('span');
    node.className = 'env-node';
    node.title = env.label;
    el('envNodes').appendChild(node);
  });

  function calculate() {
    const env = environments[state.environment];
    const heat = activityScale[state.activity];
    const dry = areaScale[state.area] * env.dry;
    const evaporation = sweatScale[state.sweat] * env.evap;
    const balance = heat - dry - evaporation;
    return {heat, dry, evaporation, balance};
  }

  function relativeWord(value) {
    if (value < 0.75) return '较弱';
    if (value < 1.45) return '中等';
    return '较强';
  }

  function render(action) {
    const env = environments[state.environment];
    const result = calculate();
    const balanced = Math.abs(result.balance) <= 0.18;
    const hot = result.balance > 0.18;
    if (balanced) state.completed[state.environment] = true;

    page.classList.toggle('is-balanced', balanced);
    page.classList.toggle('is-complete', state.completed.every(Boolean));
    el('heatScene').classList.toggle('is-humid', env.humidity === '高');
    el('activityOut').textContent = levelNames[state.activity];
    el('areaOut').textContent = areaNames[state.area];
    el('sweatOut').textContent = levelNames[state.sweat];
    el('tempFact').textContent = `温度 ${env.temperature}`;
    el('humidityFact').textContent = `湿度 ${env.humidity}`;
    el('evapCaption').textContent = env.humidity === '高' ? '潮湿使汗滴更易停留' : '汗滴蒸发并带走热';
    el('heatValue').textContent = relativeWord(result.heat / 2);
    el('dryValue').textContent = relativeWord(result.dry);
    el('evapValue').textContent = relativeWord(result.evaporation);
    el('baseTemp').textContent = `${Lec.P.roundTo(Lec.K.humanReferenceBodyTemperatureC, 0)} °C`;
    el('progressCount').textContent = `${state.completed.filter(Boolean).length} / ${state.completed.length}`;

    const balancePosition = Deck.clamp(50 + result.balance * 22, 8, 92);
    page.style.setProperty('--heat-in', `${Deck.clamp(result.heat / 3 * 100, 20, 100)}%`);
    page.style.setProperty('--dry-out', `${Deck.clamp(result.dry / 1.6 * 100, 10, 100)}%`);
    page.style.setProperty('--evap-out', `${Deck.clamp(result.evaporation / 1.75 * 100, 10, 100)}%`);
    page.style.setProperty('--balance-x', `${balancePosition}%`);

    if (balanced) {
      el('statusTitle').textContent = '可持续：接近平衡';
      el('statusText').textContent = '产热与散热接近平衡。';
      el('trendShort').textContent = '接近平衡';
    } else if (hot) {
      el('statusTitle').textContent = '趋于升高';
      el('statusText').textContent = '热留在体内：降低活动，或增加可实现的散热。';
      el('trendShort').textContent = '体温趋于升高';
    } else {
      el('statusTitle').textContent = '趋于降低';
      el('statusText').textContent = '散热超过产热：当前组合不是热平衡。';
      el('trendShort').textContent = '体温趋于降低';
    }

    [...el('envNodes').children].forEach((node, i) => {
      node.classList.toggle('is-current', i === state.environment);
      node.classList.toggle('is-done', state.completed[i]);
    });

    if (action && !balanced && !Deck.reduced()) {
      el('balanceRail').classList.remove('shake');
      const box = action === 'activity' ? el('activityBox') : action === 'area' ? el('areaBox') : el('sweatBox');
      box.classList.remove('flash');
      void el('balanceRail').offsetWidth;
      el('balanceRail').classList.add('shake');
      box.classList.add('flash');
    }
  }

  function reset() {
    Object.assign(state, {environment:0, activity:2, area:1, sweat:0, completed:[false,false,false]});
    el('environment').value = '0';
    controls.activity.value = '2';
    controls.area.value = '1';
    controls.sweat.value = '0';
    render();
  }

  el('environment').addEventListener('change', event => {
    state.environment = Number(event.target.value);
    render();
  });
  Object.entries(controls).forEach(([name, input]) => {
    input.addEventListener('input', event => {
      state[name] = Number(event.target.value);
      render(name);
    });
  });
  el('resetBtn').addEventListener('click', reset);

  if (!Deck.reduced()) {
    const items = [document.querySelector('.air-ring'), document.querySelector('.heat-line'), document.querySelector('.dry-line'), document.querySelector('.evap-line'), document.querySelector('.balance-pin')];
    items.forEach((item, i) => {
      item.animate([{opacity:0, transform:'translateY(8px)'},{opacity:1, transform:'translateY(0)'}], {duration:heatMotion.entry.duration, delay:i*90, easing:heatMotion.entry.easing, fill:'backwards'});
    });
  }
  render();
})();
</script>
</body>
</html>
