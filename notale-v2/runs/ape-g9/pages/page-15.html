<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main { --compare-cols: 3; display: flex; flex-direction: column; gap: var(--sp-3); }
  #stage .lec-progress { overflow: visible; }
  .p15-top { display: flex; align-items: center; justify-content: space-between; min-height: 42px; gap: var(--sp-5); }
  .p15-prompt { color: var(--text-strong); font-size: var(--fs-body); line-height: var(--lh-copy); }
  .p15-progress { display: flex; align-items: center; gap: var(--sp-3); flex: 0 0 auto; color: var(--text-muted); font-size: var(--fs-sec); }
  .p15-marks { display: flex; gap: var(--sp-2); }
  .p15-mark { width: 34px; height: 5px; border-radius: var(--radius-1); background: var(--surface-3); }
  .p15-mark.is-on { background: var(--accent); }
  .p15-board { position: relative; flex: 0 0 344px; background: var(--surface-1); }
  .p15-bindings { position: absolute; inset: 0; z-index: 4; width: 100%; height: 100%; pointer-events: none; }
  .p15-binding { fill: none; stroke: var(--accent); stroke-width: 2; opacity: .16; vector-effect: non-scaling-stroke; transition: opacity 180ms ease, filter 180ms ease; }
  .p15-binding.is-on { opacity: .92; filter: drop-shadow(0 0 4px rgba(255,204,77,.45)); }
  .p15-node { fill: var(--accent); opacity: .25; }
  @media (prefers-reduced-motion: reduce) { .p15-binding { transition: none; } }
  .p15-board > .hdr, .p15-board > .dim, .p15-board > .cell { box-sizing: border-box; background: var(--surface-1); }
  .p15-board > .dim { background: var(--surface-2); }
  .p15-board > .cell:nth-of-type(even) { background: rgba(19,36,43,.92); }
  .p15-board > .hdr { height: 126px; padding-top: var(--sp-2); padding-bottom: var(--sp-2); align-items: stretch; }
  .p15-corner { color: var(--text-muted) !important; font-size: var(--fs-sec) !important; align-items: center !important; }
  .p15-species { position: relative; overflow: hidden; border-left: var(--border); }
  .p15-species img { display: block; width: 100%; height: 100%; object-fit: cover; filter: saturate(.78) contrast(1.04); }
  .p15-species::after { content: ""; position: absolute; inset: 55% 0 0; background: linear-gradient(transparent, rgba(7,16,21,.92)); pointer-events: none; }
  .p15-species-name { position: absolute; z-index: 1; right: var(--sp-3); bottom: var(--sp-2); left: var(--sp-3); color: var(--text-strong); font-size: var(--fs-h2); line-height: 1.3; }
  .p15-dim-short, .p15-length { height: 54px; }
  .p15-dim-long, .p15-detail { height: 77px; }
  .p15-length { position: relative; padding: var(--sp-3) var(--sp-4) !important; }
  .p15-slot { position: relative; width: 100%; height: 30px; border: 1px dashed var(--line-strong); border-radius: var(--radius-2); background: var(--surface-1); }
  .p15-slot::before { content: "放置成长带"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-faint); font-size: var(--fs-label); }
  .p15-slot.is-filled { border-style: solid; border-color: var(--primary); background: var(--surface-teal); box-shadow: 0 0 0 1px rgba(53,198,180,.18); }
  .p15-slot.is-filled::before { content: ""; }
  .p15-slot-fill { position: absolute; top: 5px; left: 6px; height: 18px; width: var(--band-w); border-radius: var(--radius-2); background: var(--primary); transform-origin: left; }
  .p15-slot-label { position: absolute; top: 3px; right: var(--sp-2); z-index: 1; color: var(--text-strong); font-size: var(--fs-sec); font-weight: 700; line-height: 1.35; }
  .p15-detail { position: relative; color: var(--text-muted); }
  .p15-detail-copy { opacity: 0; transform: translateY(5px); transition: opacity 180ms ease, transform 180ms ease; }
  .p15-detail.is-revealed { color: var(--text-strong); background: var(--surface-yellow); }
  .p15-detail.is-revealed .p15-detail-copy { opacity: 1; transform: none; }
  .p15-detail:not(.is-revealed) { color: var(--text-faint); font-size: var(--fs-label); }
  .p15-detail.is-revealed::after { content: ""; position: absolute; left: 9px; width: 2px; height: 50%; background: var(--accent); }
  .p15-learn.is-revealed::after { top: 50%; }
  .p15-care.is-revealed::after { bottom: 50%; }
  .p15-join { flex: 0 0 54px; display: grid; grid-template-columns: 176px repeat(3, minmax(0,1fr)); align-items: center; border: var(--border); background: var(--surface-1); }
  .p15-join-label { color: var(--text-muted); font-size: var(--fs-label); font-weight: 700; text-align: right; padding-right: var(--sp-4); }
  .p15-join-line { grid-column: 2 / -1; position: relative; height: 34px; margin: 0 var(--sp-4); color: var(--accent); }
  .p15-join-svg { position: absolute; inset: 0 0 auto; width: 100%; height: 16px; overflow: visible; }
  .p15-join-path { fill: none; stroke: currentColor; stroke-width: 2; opacity: .32; vector-effect: non-scaling-stroke; }
  .p15-join-copy { position: absolute; right: 0; bottom: 0; left: 0; color: var(--text-faint); font-size: var(--fs-sec); font-weight: 700; text-align: center; }
  .p15-join.is-complete .p15-join-path { opacity: 1; filter: drop-shadow(0 0 4px rgba(255,204,77,.4)); }
  .p15-join.is-complete .p15-join-copy { color: var(--accent); }
  .p15-tray { position: relative; display: flex; align-items: center; gap: var(--sp-4); min-height: 91px; padding: var(--sp-3) var(--sp-4); box-sizing: border-box; border: var(--border); border-left: 3px solid var(--primary); border-radius: var(--radius-3); background: var(--surface-1); }
  .p15-tray-label { flex: 0 0 156px; }
  .p15-tray-title { color: var(--text-strong); font-size: var(--fs-sec); font-weight: 700; }
  .p15-tray-note { color: var(--text-muted); font-size: var(--fs-label); line-height: 1.35; }
  .p15-bands { display: flex; flex: 1 1 0; align-items: center; gap: var(--sp-4); min-width: 0; }
  .p15-band { position: relative; justify-content: flex-start; flex: 1 1 0; height: 48px; padding: 0 var(--sp-3); overflow: hidden; touch-action: none; background: var(--surface-2); cursor: grab; }
  .p15-band::before { content: ""; position: absolute; left: var(--sp-3); width: var(--band-w); height: 12px; border-radius: var(--radius-2); background: var(--primary); }
  .p15-band span { position: relative; z-index: 1; margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-sec); color: var(--text-strong); }
  .p15-band.is-selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255,204,77,.2); }
  .p15-band.is-dragging { z-index: 8; cursor: grabbing; }
  .p15-band.is-placed { visibility: hidden; pointer-events: none; }
  .p15-band.is-wrong { border-color: var(--danger); }
  .p15-reset { flex: 0 0 auto; display: none; }
  .p15-reset.is-visible { display: inline-flex; }
  .p15-live { position: absolute; right: var(--sp-4); bottom: calc(100% + var(--sp-2)); max-width: 820px; color: var(--accent); font-size: var(--fs-sec); line-height: var(--lh-copy); text-align: right; }
  @keyframes p15-shake { 0%,100% { transform: translateX(0); } 30% { transform: translateX(-10px); } 70% { transform: translateX(10px); } }
  .p15-band.is-wrong { animation: p15-shake 260ms ease; }
  @media (prefers-reduced-motion: reduce) { .p15-detail-copy { transition: none; } .p15-band.is-wrong { animation: none; } }
  @media (max-width: 720px) { .p15-board { grid-template-columns: 128px repeat(3,minmax(0,1fr)); } .p15-join { grid-template-columns: 128px repeat(3,minmax(0,1fr)); } }
</style>
</head>

<script src="assets/lec.js"></script>
<script>
(() => {
  Lec.mount({index: 15, kicker: 'LIFE HISTORY', title: '漫长童年：学习窗口，也是照料账单', take: '人类漫长童年把学习潜力与长期照料需求绑在一起。'});

  const order = ['macaque', 'chimp', 'human'];
  const rank = { macaque: 0, chimp: 1, human: 2 };
  const relative = { macaque: 0.38, chimp: 0.62, human: 0.88 };
  const words = { macaque: '较短', chimp: '较长', human: '最长' };
  const state = { placed: {}, trace: [], selectedTarget: 0 };
  const bands = [...document.querySelectorAll('.p15-band')];
  const marks = [...document.querySelectorAll('.p15-mark')];
  const slots = [...document.querySelectorAll('[data-slot]')];
  const live = document.getElementById('live');
  const resetBtn = document.getElementById('resetBtn');
  const join = document.getElementById('join');
  let drag = null;

  function percent(key) {
    return Lec.P.roundTo(Lec.P.percent(relative[key], 1), 0) + '%';
  }

  bands.forEach(band => { band.querySelector('.band-value').textContent = percent(band.dataset.band); });

  function snapshot() { return JSON.parse(JSON.stringify(state)); }
  function metrics() { return { matched: Object.keys(state.placed).length, total: order.length }; }
  function emit(name, detail) { document.getElementById('main').dispatchEvent(new CustomEvent(name, { bubbles: true, detail })); }

  function update() {
    const count = Object.keys(state.placed).length;
    document.getElementById('progressValue').textContent = count + ' / ' + order.length;
    marks.forEach((mark, i) => mark.classList.toggle('is-on', i < count));
    slots.forEach(cell => {
      const key = cell.dataset.slot;
      const slot = cell.querySelector('.p15-slot');
      const filled = state.placed[key] === key;
      slot.classList.toggle('is-filled', filled);
      slot.replaceChildren();
      if (filled) {
        const fill = document.createElement('span');
        fill.className = 'p15-slot-fill';
        fill.style.setProperty('--band-w', percent(key));
        const label = document.createElement('span');
        label.className = 'p15-slot-label';
        label.textContent = words[key];
        slot.append(fill, label);
      }
    });
    document.querySelectorAll('[data-detail]').forEach(cell => {
      const revealed = state.placed[cell.dataset.detail] === cell.dataset.detail;
      cell.classList.toggle('is-revealed', revealed);
      cell.firstChild.nodeValue = revealed ? '' : '配对后揭示';
    });
    bands.forEach(band => band.classList.toggle('is-placed', state.placed[band.dataset.band] === band.dataset.band));
    document.querySelectorAll('[data-binding]').forEach(path => path.classList.toggle('is-on', state.placed[path.dataset.binding] === path.dataset.binding));
    const complete = count === order.length;
    join.classList.toggle('is-complete', complete);
    resetBtn.classList.toggle('is-visible', complete);
    if (complete) live.textContent = '时间窗口变长，不等于自动学会更多；它同时要求持续的供养、保护和教导。';
  }

  function attempt(band, target) {
    const key = band.dataset.band;
    if (state.placed[target]) {
      live.textContent = '这一栏已经完成，请选择另一栏。';
      return;
    }
    if (key === target) {
      state.placed[target] = key;
      state.trace.push({ band: key, target, correct: true });
      live.textContent = words[key] + '成长带已归位：学习机会与照料需求同时展开。';
      update();
      emit(Object.keys(state.placed).length === order.length ? 'game-complete' : 'game-progress', Object.keys(state.placed).length === order.length ? { score: order.length, metrics: metrics(), trace: state.trace.slice() } : { state: snapshot(), action: 'match', metrics: metrics() });
      const next = bands.find(item => !item.classList.contains('is-placed'));
      if (next) next.focus(); else resetBtn.focus();
    } else {
      state.trace.push({ band: key, target, correct: false });
      band.classList.remove('is-wrong');
      void band.offsetWidth;
      band.classList.add('is-wrong');
      const relation = rank[key] > rank[target] ? '更长' : '更短';
      live.textContent = '这条幼年期比' + document.querySelector('[data-species="' + target + '"] .p15-species-name').textContent + '的' + relation + '，请比较另外两条成长带。';
      setTimeout(() => band.classList.remove('is-wrong'), Deck.reduced() ? 0 : 280);
      emit('game-progress', { state: snapshot(), action: 'mismatch', metrics: metrics() });
    }
  }

  function selectTarget(band, delta) {
    state.selectedTarget = (state.selectedTarget + delta + order.length) % order.length;
    bands.forEach(item => item.classList.toggle('is-selected', item === band));
    const name = document.querySelector('[data-species="' + order[state.selectedTarget] + '"] .p15-species-name').textContent;
    live.textContent = '当前目标：' + name + '。按 Enter 放置。';
  }

  bands.forEach(band => {
    band.addEventListener('focus', () => { bands.forEach(item => item.classList.toggle('is-selected', item === band)); });
    band.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); selectTarget(band, -1); }
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); selectTarget(band, 1); }
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); attempt(band, order[state.selectedTarget]); }
    });
    band.addEventListener('pointerdown', e => {
      if (band.classList.contains('is-placed')) return;
      const p = Deck.pt(document.getElementById('main'), e);
      drag = { band, id: e.pointerId, x: p.x, y: p.y };
      band.setPointerCapture(e.pointerId);
      band.classList.add('is-dragging');
      emit('game-start', { state: snapshot() });
    });
    band.addEventListener('pointermove', e => {
      if (!drag || drag.id !== e.pointerId) return;
      const p = Deck.pt(document.getElementById('main'), e);
      band.style.transform = 'translate(' + (p.x - drag.x) + 'px,' + (p.y - drag.y) + 'px)';
    });
    band.addEventListener('pointerup', e => {
      if (!drag || drag.id !== e.pointerId) return;
      const p = Deck.pt(document.getElementById('main'), e);
      band.releasePointerCapture(e.pointerId);
      band.classList.remove('is-dragging');
      band.style.transform = '';
      const board = document.querySelector('.p15-board');
      const x = p.x - board.offsetLeft;
      const candidates = slots.map(cell => ({ key: cell.dataset.slot, center: cell.offsetLeft + cell.offsetWidth / 2 }));
      const nearest = candidates.reduce((a, b) => Math.abs(b.center - x) < Math.abs(a.center - x) ? b : a);
      if (p.y >= board.offsetTop && p.y <= board.offsetTop + board.offsetHeight) attempt(band, nearest.key);
      else live.textContent = '请把成长带放到照片下方的“幼年期相对长度”一行。';
      drag = null;
    });
    band.addEventListener('pointercancel', () => { if (drag) { drag.band.style.transform = ''; drag.band.classList.remove('is-dragging'); drag = null; } });
  });

  resetBtn.addEventListener('click', () => {
    state.placed = {};
    state.trace = [];
    state.selectedTarget = 0;
    live.textContent = '已复原。先比较三张照片，再选择成长带。';
    update();
    bands[0].focus();
    emit('game-reset', { state: snapshot() });
  });

  window.p15Game = {
    start() { bands[0].focus(); emit('game-start', { state: snapshot() }); },
    reset() { resetBtn.click(); },
    getState: snapshot,
    place(band, target) { const el = document.querySelector('[data-band="' + band + '"]'); if (el) attempt(el, target); }
  };
  update();
})();
</script>
</body>
</html>
