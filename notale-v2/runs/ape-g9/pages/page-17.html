<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main { --support-cols: 1; }
  .lec-progress { overflow: visible; }
  .evo-page { position: relative; width: 100%; height: 100%; gap: var(--sp-3); }
  .evo-page > .claim { display: flex; align-items: center; justify-content: space-between; min-height: 54px; box-sizing: border-box; padding-block: var(--sp-3); }
  .claim-text { min-width: 0; }
  .progress-box { display: flex; flex: 0 0 auto; align-items: center; gap: var(--sp-3); margin-left: var(--sp-5); color: var(--accent); font-family: var(--font-mono); font-size: var(--fs-sec); line-height: var(--lh-copy); white-space: nowrap; }
  .forks { display: flex; gap: var(--sp-2); }
  .fork { color: var(--text-faint); font-size: var(--fs-lead); }
  .fork.is-on { color: var(--accent); }
  .evo-page > .trunk { display: none; }
  .evo-page > .supports { min-height: 0; padding-top: 0; }
  .evo-page > .supports::before { display: none; }
  .tree-support { position: relative; height: 100%; min-height: 0; padding: 0 !important; overflow: hidden; border-color: transparent !important; border-top-color: var(--primary-dark) !important; background: rgba(7, 16, 21, 0.46) !important; }
  .tree-support::before { display: none !important; }
  .tree-head { position: absolute; z-index: 8; top: var(--sp-3); left: var(--sp-4); display: flex; align-items: center; gap: var(--sp-5); }
  .mode-label { color: var(--accent); font-family: var(--font-mono); font-size: var(--fs-label); font-weight: 700; line-height: 1.35; }
  .legend { display: flex; gap: var(--sp-4); }
  .legend-line { display: inline-flex; align-items: center; gap: var(--sp-2); color: var(--text-muted); font-size: var(--fs-label); font-weight: 600; line-height: 1.35; }
  .legend-line::before { content: ""; width: 24px; height: 0; border-top: 2px solid var(--primary); }
  .legend-line.extinct::before { border-color: var(--text-faint); }
  .tree-svg { position: absolute; inset: 42px 0 92px; width: 100%; height: calc(100% - 134px); overflow: visible; }
  .tree-link { fill: none; stroke: var(--text-faint); stroke-width: 2px; opacity: .46; }
  .tree-link.is-live { stroke: var(--primary); opacity: 1; }
  .tree-node circle { fill: var(--surface-2); stroke: var(--text-faint); stroke-width: 2px; }
  .tree-node.is-live circle { fill: var(--primary); stroke: var(--primary-bright); }
  .tree-node text { fill: var(--text-strong); font-family: var(--font-sans); font-size: 16px; font-weight: 700; }
  .tree-node .status-text { fill: var(--text-muted); font-size: 14px; font-weight: 500; }
  .tree-node.is-extinct .end-cap { stroke: var(--text-faint); stroke-width: 2px; }
  .drop-slot { fill: rgba(255, 204, 77, .04); stroke: var(--accent); stroke-width: 2px; stroke-dasharray: 7 6; opacity: .76; }
  .drop-slot.is-filled { fill: rgba(53, 198, 180, .12); stroke: var(--primary); stroke-dasharray: none; }
  .culture-orbit { fill: none; stroke: var(--accent); stroke-width: 2px; stroke-dasharray: 7 6; opacity: 0; }
  .culture-orbit.is-visible { opacity: 1; }
  .culture-label { fill: var(--accent); font-family: var(--font-sans); font-size: 16px; font-weight: 700; opacity: 0; }
  .culture-label.is-visible { opacity: 1; }
  .footprint { fill: var(--primary); opacity: .9; }
  .bootprint { fill: var(--accent); opacity: 0; }
  .bootprint.is-visible { opacity: 1; }
  .step-outline { position: absolute; z-index: 1; inset: 80px 160px 112px 220px; pointer-events: none; opacity: .58; transition: opacity 300ms ease; }
  .step-outline::before { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, transparent 0 14%, rgba(255,204,77,.12) 14% 15%, transparent 15% 31%, rgba(255,204,77,.12) 31% 32%, transparent 32% 48%, rgba(255,204,77,.12) 48% 49%, transparent 49% 65%, rgba(255,204,77,.12) 65% 66%, transparent 66%); }
  .step-caption { position: absolute; left: 0; bottom: 0; color: var(--text-faint); font-size: var(--fs-label); font-weight: 600; }
  .step-outline.is-gone { opacity: 0; }
  .relation-card { position: absolute; z-index: 10; width: 222px; min-height: 46px; padding: var(--sp-2) var(--sp-3); border: 2px solid var(--accent); background: var(--surface-2); color: var(--text-strong); font-size: var(--fs-sec); line-height: 1.35; box-shadow: var(--shadow-panel); cursor: grab; touch-action: none; user-select: none; will-change: transform; }
  .relation-card:active { cursor: grabbing; }
  .relation-card.is-placed { border-color: var(--primary); background: var(--surface-teal); box-shadow: 0 0 0 3px rgba(53,198,180,.17); pointer-events: none; }
  .relation-card.is-wrong { border-color: var(--danger); }
  .relation-card.is-fading { opacity: 0; transition: opacity 260ms ease; }
  .feedback { position: absolute; z-index: 12; right: 72px; bottom: 18px; left: 72px; min-height: 52px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: var(--sp-2) 64px; color: var(--text-strong); font-size: var(--fs-sec); line-height: var(--lh-copy); text-align: center; border-top: var(--border); background: rgba(7,16,21,.9); }
  .feedback.is-success { color: var(--primary-bright); }
  .feedback.is-error { color: var(--danger); }
  .reset { position: absolute; z-index: 14; right: var(--sp-4); bottom: 24px; }
  .final-claim { position: absolute; z-index: 13; right: 74px; bottom: 13px; left: 74px; display: none; min-height: 62px; align-items: center; justify-content: center; padding: 0 var(--sp-5); color: var(--text-strong); font-family: var(--font-narrow); font-size: var(--fs-lead); font-weight: 700; line-height: var(--lh-copy); text-align: center; border-left: 6px solid var(--accent); background: var(--surface-yellow); }
  .final-claim.is-visible { display: flex; }
  @media (prefers-reduced-motion: reduce) {
    .step-outline, .relation-card { transition: none !important; }
  }
</style>
</head>
<body data-page="17" data-total="52">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function () {
  Lec.mount({index:17,kicker:"EVOLUTION IS A TREE",title:"人类演化不是一架通往宇航员的阶梯",take:"把直线改写成分支树：许多谱系曾经并存，多数已经灭绝，现代人只是仍存的一条末端分支。"});

  const main = document.getElementById('main');
  main.innerHTML = `
    <section class="k-generalization evo-page full" aria-labelledby="page-claim">
      <div class="claim" id="page-claim">
        <span class="claim-text">人类演化是一棵有分支和灭绝的树，不是朝宇航员前进的阶梯。</span>
        <span class="progress-box" aria-live="polite"><span id="progressText">已改写 0/4</span><span class="forks" aria-hidden="true"><span class="fork">⑂</span><span class="fork">⑂</span><span class="fork">⑂</span><span class="fork">⑂</span></span></span>
      </div>
      <div class="trunk" aria-hidden="true"></div>
      <div class="supports min0">
        <div class="support tree-support min0 no-pan" id="treeWall">
          <div class="tree-head">
            <span class="mode-label">把阶梯关系拖到树上对应的虚线槽</span>
            <span class="legend" aria-label="图例"><span class="legend-line">接通分支</span><span class="legend-line extinct">终止分支</span></span>
          </div>
          <svg class="tree-svg" id="treeSvg" role="img" aria-label="从共同祖先向右展开的人类演化分支树"></svg>
          <div class="step-outline" id="stepOutline" aria-hidden="true"><span class="step-caption">错误模型：一个接一个地升级</span></div>
          <button class="relation-card" data-id="a" type="button">南方古猿变成直立人</button>
          <button class="relation-card" data-id="b" type="button">直立人被尼安德特人取代</button>
          <button class="relation-card" data-id="c" type="button">尼安德特人变成现代人</button>
          <button class="relation-card" data-id="d" type="button">现代人的下一阶是宇航员</button>
          <div class="feedback" id="feedback" role="status">比较分叉：较晚出现不等于更高级，近缘也不等于直接祖先。</div>
          <div class="final-claim" id="finalClaim">宇航员仍是现代人：这是文化处境，不是物种树的更高一级。</div>
          <button class="btn icon-only reset" id="resetBtn" type="button" title="重置阶梯" aria-label="重置阶梯">↺</button>
        </div>
      </div>
    </section>`;

  const width = 1360;
  const height = 390;
  const treeData = {
    name: '共同祖先', status: '包含已灭绝谱系', children: [{
      name: '早期人族', status: '包含已灭绝谱系', children: [
        { name: '南方古猿类', status: '已灭绝', slot: 'a', children: [{ name: '傍人类', status: '已灭绝' }] },
        { name: 'Homo', status: '包含已灭绝谱系', children: [
          { name: '直立人', status: '已灭绝', slot: 'b' },
          { name: '', hidden: true, children: [
            { name: '尼安德特人', status: '已灭绝', slot: 'c' },
            { name: '现代人', status: '仍存', slot: 'd', modern: true }
          ] }
        ] }
      ]
    }]
  };

  const svg = d3.select('#treeSvg').attr('viewBox', `0 0 ${width} ${height}`);
  svg.append('title').text('人类演化横向分支树');
  svg.append('desc').text('共同祖先分成多条并存谱系，多个分支终止，现代人是仍存的一条末端分支。');
  const root = d3.hierarchy(treeData);
  const tree = d3.tree().size([height - 96, width - 240]);
  tree(root);
  const linkHorizontal = d3.linkHorizontal().x(d => d.y).y(d => d.x);
  const offset = { x: 112, y: 52 };
  const pos = d => ({ x: d.y + offset.x, y: d.x + offset.y });
  const nodeBySlot = new Map(root.descendants().filter(d => d.data.slot).map(d => [d.data.slot, d]));

  const g = svg.append('g');
  const links = g.append('g').selectAll('path').data(root.links()).join('path')
    .attr('class', 'tree-link')
    .attr('data-target', d => d.target.data.slot || d.target.data.name || 'split')
    .attr('d', d => {
      const source = pos(d.source);
      const target = pos(d.target);
      return linkHorizontal({
        source: { x: source.y, y: source.x },
        target: { x: target.y, y: target.x }
      });
    });

  const nodes = g.append('g').selectAll('g').data(root.descendants()).join('g')
    .attr('class', d => `tree-node${d.data.status === '已灭绝' ? ' is-extinct' : ''}`)
    .attr('data-name', d => d.data.name || 'split')
    .attr('transform', d => `translate(${pos(d).x},${pos(d).y})`);

  nodes.filter(d => !d.data.hidden).append('circle').attr('r', 7);
  nodes.filter(d => d.depth === 0).append('path').attr('class', 'footprint').attr('d', 'M-7,-11 C-12,-2 -10,9 -3,12 C4,14 9,7 8,-1 C7,-9 0,-15 -7,-11 Z');
  nodes.filter(d => d.data.status === '已灭绝').append('line').attr('class', 'end-cap').attr('x1', 13).attr('x2', 13).attr('y1', -9).attr('y2', 9);
  nodes.filter(d => !d.data.hidden).append('text').attr('x', 15).attr('y', -7).text(d => d.data.name);
  nodes.filter(d => !d.data.hidden).append('text').attr('class', 'status-text').attr('x', 15).attr('y', 14).text(d => d.data.status);

  nodes.filter(d => d.data.slot).append('rect').attr('class', 'drop-slot').attr('data-slot', d => d.data.slot).attr('x', -22).attr('y', -22).attr('width', 44).attr('height', 44).attr('rx', 4);

  const modern = root.descendants().find(d => d.data.modern);
  const mp = pos(modern);
  const culture = g.append('g').attr('transform', `translate(${mp.x + 126},${mp.y})`);
  culture.append('ellipse').attr('class', 'culture-orbit').attr('rx', 82).attr('ry', 39);
  culture.append('path').attr('class', 'bootprint').attr('d', 'M-16,-28 L7,-27 L13,2 L31,9 L29,24 L-13,22 L-21,4 Z');
  culture.append('text').attr('class', 'culture-label').attr('x', -44).attr('y', 54).text('文化处境 · 宇航员');

  const initial = {
    a: { x: 178, y: 340 },
    b: { x: 412, y: 274 },
    c: { x: 646, y: 208 },
    d: { x: 1030, y: 392 }
  };
  const cards = Array.from(document.querySelectorAll('.relation-card'));
  const done = new Set();
  const feedback = document.getElementById('feedback');
  const progressText = document.getElementById('progressText');
  const forks = Array.from(document.querySelectorAll('.fork'));
  const reduced = Deck.reduced();

  function setCardPosition(el, x, y) {
    el.dataset.x = x;
    el.dataset.y = y;
    el.style.transform = `translate(${x}px,${y}px)`;
  }

  function targetPosition(id) {
    const p = pos(nodeBySlot.get(id));
    const svgBox = document.getElementById('treeSvg');
    return { x: p.x - 111, y: p.y + svgBox.offsetTop - 23 };
  }

  function updateTree() {
    const activeNames = new Set(['共同祖先', '早期人族', 'Homo']);
    done.forEach(id => {
      let n = nodeBySlot.get(id);
      while (n) { activeNames.add(n.data.name || 'split'); n = n.parent; }
    });
    nodes.classed('is-live', d => activeNames.has(d.data.name || 'split'));
    links.classed('is-live', d => activeNames.has(d.target.data.name || 'split'));
    done.forEach(id => svg.select(`[data-slot="${id}"]`).classed('is-filled', true));
  }

  function wrongMessage(id) {
    return {
      a: '这里把展示节点误当成确定的直接祖先；南方古猿类本身也有多条分支。',
      b: '这里把并存误当成整齐接班；不同 Homo 谱系在时间上有重叠。',
      c: '这里把近缘误当成直接祖先；尼安德特人与现代人是近缘分支。',
      d: '宇航员不是物种分支；他仍属于现代人。'
    }[id];
  }

  function complete() {
    document.getElementById('stepOutline').classList.add('is-gone');
    feedback.style.display = 'none';
    cards.forEach(el => el.classList.add('is-fading'));
    document.getElementById('finalClaim').classList.add('is-visible');
    culture.selectAll('.culture-orbit,.culture-label,.bootprint').classed('is-visible', true);
  }

  function place(el, id) {
    if (done.has(id)) return;
    const target = targetPosition(id);
    setCardPosition(el, target.x, target.y);
    el.classList.add('is-placed');
    el.setAttribute('aria-pressed', 'true');
    done.add(id);
    feedback.className = 'feedback is-success';
    feedback.textContent = {
      a: '南方古猿类有分支；展示节点不能被读成确定的直接祖先。',
      b: '不同 Homo 谱系曾经重叠；出现较晚不等于取代前者。',
      c: '尼安德特人与现代人是近缘分支；前者的分支已经终止。',
      d: '宇航员仍是现代人；文化处境不进入物种树。'
    }[id];
    progressText.textContent = `已改写 ${done.size}/${cards.length}`;
    forks.forEach((f, i) => f.classList.toggle('is-on', i < done.size));
    updateTree();
    if (done.size === cards.length) complete();
  }

  function reject(el, id) {
    feedback.className = 'feedback is-error';
    feedback.textContent = wrongMessage(id);
    el.classList.add('is-wrong');
    const start = initial[id];
    if (reduced) {
      setCardPosition(el, start.x, start.y);
      el.classList.remove('is-wrong');
    } else {
      d3.select(el).transition().duration(70).attrTween('style', function () {
        const y = Number(el.dataset.y);
        return t => `transform:translate(${Number(el.dataset.x) + Math.sin(t * Math.PI * 4) * 9}px,${y}px)`;
      }).transition().duration(180).styleTween('transform', function () {
        const x0 = Number(el.dataset.x), y0 = Number(el.dataset.y);
        return t => `translate(${x0 + (start.x - x0) * t}px,${y0 + (start.y - y0) * t}px)`;
      }).on('end', function () { setCardPosition(el, start.x, start.y); el.classList.remove('is-wrong'); });
    }
  }

  function tryDrop(el) {
    const id = el.dataset.id;
    const target = targetPosition(id);
    const cx = Number(el.dataset.x) + 111;
    const cy = Number(el.dataset.y) + 23;
    const tx = target.x + 111;
    const ty = target.y + 23;
    const distance = Math.hypot(cx - tx, cy - ty);
    if (distance < 36) place(el, id); else reject(el, id);
  }

  cards.forEach(el => {
    const id = el.dataset.id;
    setCardPosition(el, initial[id].x, initial[id].y);
    el.setAttribute('aria-label', `${el.textContent}。方向键移动，回车放置。`);
    d3.select(el).call(d3.drag()
      .on('start', function () { d3.select(this).interrupt(); })
      .on('drag', function (event) {
        if (done.has(id)) return;
        const x = Deck.clamp(Number(this.dataset.x) + event.dx, 0, 1134);
        const y = Deck.clamp(Number(this.dataset.y) + event.dy, 42, 428);
        setCardPosition(this, x, y);
      })
      .on('end', function () { tryDrop(this); }));
    el.addEventListener('keydown', e => {
      if (done.has(id)) return;
      const delta = e.shiftKey ? 24 : 12;
      let x = Number(el.dataset.x), y = Number(el.dataset.y);
      if (e.key === 'ArrowLeft') x -= delta;
      else if (e.key === 'ArrowRight') x += delta;
      else if (e.key === 'ArrowUp') y -= delta;
      else if (e.key === 'ArrowDown') y += delta;
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tryDrop(el); return; }
      else return;
      e.preventDefault();
      setCardPosition(el, Deck.clamp(x, 0, 1134), Deck.clamp(y, 42, 428));
    });
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    done.clear();
    cards.forEach(el => {
      const id = el.dataset.id;
      d3.select(el).interrupt();
      el.className = 'relation-card';
      el.setAttribute('aria-pressed', 'false');
      setCardPosition(el, initial[id].x, initial[id].y);
    });
    svg.selectAll('.drop-slot').classed('is-filled', false);
    culture.selectAll('.culture-orbit,.culture-label,.bootprint').classed('is-visible', false);
    document.getElementById('stepOutline').classList.remove('is-gone');
    document.getElementById('finalClaim').classList.remove('is-visible');
    feedback.style.display = 'flex';
    feedback.className = 'feedback';
    feedback.textContent = '比较分叉：较晚出现不等于更高级，近缘也不等于直接祖先。';
    progressText.textContent = `已改写 ${done.size}/${cards.length}`;
    forks.forEach(f => f.classList.remove('is-on'));
    updateTree();
    cards[0].focus();
  });

  updateTree();
})();
</script>
</body>
</html>
