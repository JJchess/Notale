<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
body[data-page="18"] .lec-stage { background: #071015; }
body[data-page="18"] .lec-title { max-width: 12em; }
body[data-page="18"] .lec-subtitle { max-width: 34em; }
body[data-page="18"] progress.lec-progress { appearance: none; overflow: visible; border: 0; }
#main { position: relative; }
.p18-scene {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  isolation: isolate;
}
.p18-art {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: .94;
}
.p18-art .zone { fill: var(--surface-teal); stroke: rgba(53, 198, 180, .26); stroke-width: 1.5; }
.p18-art .terrain { fill: rgba(13, 26, 32, .88); stroke: var(--line); stroke-width: 1.5; }
.p18-art .branch-base { fill: none; stroke: rgba(53, 198, 180, .16); stroke-width: 12; stroke-linecap: round; }
.p18-art .branch {
  fill: none;
  stroke: var(--primary);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 520;
  stroke-dashoffset: 520;
  animation: p18-grow 850ms cubic-bezier(.22,.75,.2,1) forwards;
}
.p18-art .b2 { animation-delay: 120ms; }
.p18-art .b3 { animation-delay: 240ms; }
.p18-art .human {
  opacity: 0;
  animation: p18-person 620ms ease-out forwards;
}
.p18-art .human-body { fill: rgba(233, 241, 239, .13); stroke: var(--text-muted); stroke-width: 2; }
.p18-art .human-core { fill: none; stroke: rgba(233, 241, 239, .22); stroke-width: 1.5; }
.p18-art .object { fill: rgba(53, 198, 180, .13); stroke: var(--primary-bright); stroke-width: 2; }
.p18-art .warm { fill: var(--surface-yellow); stroke: var(--accent); stroke-width: 2; }
.p18-art .ray { fill: rgba(255, 204, 77, .06); stroke: rgba(255, 204, 77, .38); stroke-width: 1.5; }
.p18-art .converge {
  fill: var(--accent);
  filter: drop-shadow(0 0 10px rgba(255, 204, 77, .7));
  opacity: 0;
  animation: p18-point 420ms 980ms ease-out forwards;
}
.p18-copy {
  position: absolute;
  top: 20px;
  left: 24px;
  z-index: 4;
  width: 410px;
}
.p18-copy p { max-width: 34ch; }
.p18-copy .lead {
  color: var(--text-strong);
  font-size: var(--fs-lead);
  font-weight: 700;
  line-height: var(--lh-copy);
}
.p18-copy .bridge {
  margin-top: var(--sp-3);
  color: var(--text-muted);
  font-size: var(--fs-body);
  line-height: var(--lh-copy);
}
.p18-copy .fast { color: var(--accent); }
.p18-enum.k-enumeration {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: block;
}
.p18-enum.k-enumeration > .it {
  position: absolute;
  display: block;
  width: 300px;
  min-height: 104px;
  box-sizing: border-box;
  padding: var(--sp-4) var(--sp-5);
  border: var(--border);
  border-top: 3px solid var(--primary-dark);
  border-radius: var(--radius-3);
  background: rgba(7, 16, 21, .9);
  box-shadow: var(--shadow-panel);
  opacity: 0;
  animation: p18-tag 460ms ease-out forwards;
}
.p18-enum .it[data-order="1"] { top: 34px; right: 70px; animation-delay: 500ms; }
.p18-enum .it[data-order="2"] { bottom: 42px; left: 72px; animation-delay: 620ms; }
.p18-enum .it[data-order="3"] { right: 44px; bottom: 48px; animation-delay: 740ms; }
.p18-enum.k-enumeration > .it > .it-title {
  margin-bottom: var(--sp-1);
  color: var(--text-strong);
  font-size: var(--fs-h2);
  line-height: 1.3;
}
.p18-enum .it p {
  color: var(--text-muted);
  font-size: var(--fs-body);
  line-height: var(--lh-copy);
}
.p18-enum .scene-key {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  margin-top: var(--sp-2);
  color: var(--primary-bright);
  font-size: var(--fs-label);
  line-height: 1.35;
}
.p18-enum .scene-key span + span::before { content: "·"; margin-right: var(--sp-2); color: var(--text-faint); }
.p18-body-note {
  position: absolute;
  left: 50%;
  bottom: 26px;
  z-index: 6;
  padding: var(--sp-2) var(--sp-3);
  color: var(--text-muted);
  font-size: var(--fs-label);
  line-height: 1.35;
  border: var(--border);
  border-radius: var(--radius-2);
  background: rgba(7, 16, 21, .86);
  transform: translateX(-50%);
}
.p18-body-note strong { color: var(--text-strong); }
.p18-converge-label {
  position: absolute;
  top: 271px;
  right: 6px;
  z-index: 6;
  width: 188px;
  color: var(--accent);
  font-size: var(--fs-body);
  font-weight: 700;
  line-height: var(--lh-copy);
}
@keyframes p18-person { to { opacity: 1; } }
@keyframes p18-grow { to { stroke-dashoffset: 0; } }
@keyframes p18-tag { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes p18-point { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .p18-art .human,
  .p18-art .branch,
  .p18-art .converge,
  .p18-enum.k-enumeration > .it {
    animation: none;
    opacity: 1;
  }
  .p18-art .branch { stroke-dashoffset: 0; }
}
</style>
</head>
