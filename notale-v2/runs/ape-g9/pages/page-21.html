function render(){const done=Object.keys(state.placed).length;cards.forEach(card=>{const placed=Boolean(state.placed[card.dataset.item]),selected=state.selected===card.dataset.item;card.classList.toggle("is-placed",placed);card.classList.toggle("is-selected",selected);card.setAttribute("aria-pressed",String(selected));card.setAttribute("draggable",String(!placed))});slots.forEach(slot=>{const filled=Object.values(state.placed).includes(slot.dataset.slot);slot.classList.toggle("is-filled",filled);slot.classList.toggle("is-candidate",Boolean(state.selected)&&slotOrder[state.candidate]===slot.dataset.slot)});document.querySelectorAll(".route").forEach(route=>route.classList.toggle("is-live",Boolean(state.placed[route.dataset.route])));document.querySelectorAll(".progress-nodes i").forEach((node,i)=>node.classList.toggle("on",i<done));document.getElementById("counter").textContent=`已接通 ${done}/4`;board.classList.toggle("is-complete",done===4)}
function selectItem(item){if(state.placed[item])return;state.selected=item;const card=cards.find(c=>c.dataset.item===item);state.candidate=Math.max(0,slotOrder.indexOf(card.dataset.target));feedback.textContent=`已选择${itemNames[item]}：当前功能槽为${slotNames[slotOrder[state.candidate]]}。`;render()}
function attempt(item,slot){const card=cards.find(c=>c.dataset.item===item);if(!card||state.placed[item])return;if(card.dataset.target===slot){state.placed[item]=slot;state.trace.push({item,slot,correct:true});state.selected=null;feedback.textContent=`${itemNames[item]}已接通“${slotNames[slot]}”。`;render();if(Object.keys(state.placed).length===4)setTimeout(()=>{feedback.textContent="工具没有让身体消失，而是把功能移到身体之外。学习、制作、使用和传承的方法，才让这种外移延续。"},interaction.completionDelay)}else{state.trace.push({item,slot,correct:false});card.classList.add("is-wrong");const target=slots.find(s=>s.dataset.slot===slot);target.classList.add("is-error");feedback.textContent="它延伸的不是这一功能：看它替身体保存、保护、携带还是运算。";setTimeout(()=>{card.classList.remove("is-wrong");target.classList.remove("is-error")},interaction.errorReturn)}}
cards.forEach(card=>{card.addEventListener("click",()=>selectItem(card.dataset.item));card.addEventListener("dragstart",e=>{dragged=card.dataset.item;selectItem(dragged);e.dataTransfer.setData("text/plain",dragged)});card.addEventListener("dragend",()=>{dragged=null});card.addEventListener("keydown",e=>{if(!state.selected)return;if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();state.candidate=(state.candidate+1)%slotOrder.length;feedback.textContent=`候选功能：${slotNames[slotOrder[state.candidate]]}`;render()}if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();state.candidate=(state.candidate+slotOrder.length-1)%slotOrder.length;feedback.textContent=`候选功能：${slotNames[slotOrder[state.candidate]]}`;render()}if(e.key==="Enter"||e.key===" "){e.preventDefault();attempt(state.selected,slotOrder[state.candidate])}})});
slots.forEach(slot=>{slot.addEventListener("dragover",e=>{e.preventDefault();slot.classList.add("is-candidate")});slot.addEventListener("dragleave",render);slot.addEventListener("drop",e=>{e.preventDefault();attempt(dragged||e.dataTransfer.getData("text/plain"),slot.dataset.slot);dragged=null})});
document.getElementById("reset").addEventListener("click",()=>{state.selected=null;state.candidate=0;state.placed={};state.trace=[];feedback.textContent="先选择一件器物。";render();cards[0].focus()});render();
</script>
</body>
</html>
