<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .tool-page{height:100%;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
  .compare-summary{flex:0 0 180px;grid-template-columns:176px repeat(2,minmax(0,1fr))}
  progress.lec-progress{overflow:visible}
  .compare-summary>.hdr,.compare-summary>.dim,.compare-summary>.cell{padding:6px 14px}
  .compare-summary>.hdr{font-size:18px;align-items:center}
  .compare-summary>.dim{font-size:15px}
  .compare-summary>.cell{font-size:16px;line-height:1.35}
  .workshop{position:relative;flex:1 1 auto;min-height:0;border:1px solid var(--line-strong);background:var(--surface-1);overflow:hidden}
  .workshop::before{content:"";position:absolute;inset:44px 0 108px;background:repeating-linear-gradient(90deg,var(--surface-teal) 0,var(--surface-teal) calc(22% - 1px),var(--line) calc(22% - 1px),var(--line) 22%);opacity:.72;pointer-events:none}
  .genealogy{position:absolute;inset:0;width:100%;height:100%;color:var(--primary-dark);pointer-events:none}
  .genealogy .trunk{fill:none;stroke:currentColor;stroke-width:4}
  .genealogy .branch{fill:none;stroke:var(--primary);stroke-width:2;opacity:.66}
  .genealogy .constraint{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:7 7;opacity:.72}
  .workshop-top{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 18px;border-bottom:var(--border)}
  .progress-copy{font-size:16px;line-height:1.35;color:var(--text-strong)}
  .progress-copy strong{color:var(--accent);font-family:var(--font-mono)}
  .reset{width:40px;height:40px;padding:0;font-size:22px;line-height:1}
  .tracks{position:relative;height:190px;margin:0 58px 0 118px}
  .scale{position:absolute;top:12px;right:-44px;bottom:14px;width:36px;border-left:2px solid var(--line-strong)}
  .scale span{position:absolute;left:8px;transform:translateY(-50%);font-size:13px;color:var(--text-faint);font-family:var(--font-mono)}
  .scale i{position:absolute;left:-5px;width:9px;height:1px;background:var(--line-strong)}
  .shared-start{position:absolute;left:-102px;top:73px;width:86px;text-align:center;color:var(--text-muted);font-size:15px;line-height:1.35}
  .start-tool{width:58px;height:28px;margin:0 auto 4px;background:var(--primary-dark);clip-path:polygon(0 42%,58% 3%,100% 24%,82% 53%,100% 80%,56% 96%,0 63%)}
  .track{position:absolute;left:0;right:0;height:76px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(7,16,21,.38)}
  .track.solo{top:16px}.track.lineage{top:106px}
  .track-label{position:absolute;left:-102px;top:25px;width:92px;text-align:right;font-size:16px;font-weight:700;color:var(--text-strong)}
  .mainline{position:absolute;left:0;right:0;top:38px;height:4px;background:var(--primary-dark)}
  .solo .mainline{right:48%}
  .mainline::before{content:"";position:absolute;left:0;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--primary)}
  .node{position:absolute;top:29px;width:18px;height:18px;border:2px solid var(--primary-dark);border-radius:50%;background:var(--surface-0);transform:translateX(-50%)}
  .node.done{border-color:var(--accent);background:var(--primary)}
  .node span{position:absolute;top:20px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;color:var(--text-faint);font-family:var(--font-mono)}
  .finish{position:absolute;top:4px;bottom:0;width:2px;background:var(--line-strong)}
  .finish::after{position:absolute;top:0;left:8px;white-space:nowrap;color:var(--text-muted);font-size:15px}
  .solo .finish{left:52%}.solo .finish::after{content:"一生终点"}
  .lineage .finish{right:0}.lineage .finish::after{content:"第4代";left:auto;right:8px}
  .finish.lit{background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .endpoint{position:absolute;top:16px;transform:translateX(-50%);font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--primary-bright)}
  .candidate-dock{position:absolute;left:152px;right:126px;bottom:12px;height:96px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch;padding:5px 8px;box-sizing:border-box;border-top:1px solid var(--line-strong);background:var(--surface-teal)}
  .candidate{position:relative;min-width:0;height:86px;flex-direction:column;gap:2px;padding:6px 10px;font-size:16px;background:var(--surface-2);transition:transform 150ms ease,border-color 150ms ease,opacity 150ms ease}
  .candidate .tool{width:70px;height:30px;background:var(--primary);clip-path:polygon(0 var(--tip,40%),54% 2%,100% 18%,82% 50%,100% 82%,54% 98%,0 62%)}
  .candidate .score{font-family:var(--font-mono);font-size:16px;color:var(--text-strong)}
  .candidate.best{border-color:var(--accent);box-shadow:0 0 0 2px var(--surface-yellow)}
  .candidate.wrong{animation:rebound 220ms ease}
  .candidate:disabled{opacity:.24}
  .feedback{position:absolute;left:18px;bottom:18px;width:122px;font-size:16px;line-height:1.35;color:var(--text-muted)}
  .feedback.error{color:var(--danger)}
  .result{position:absolute;right:12px;bottom:18px;width:102px;text-align:center;font-size:16px;line-height:1.35;color:var(--text-muted)}
  .result strong{display:block;font-family:var(--font-mono);font-size:22px;color:var(--accent)}
  .closing{flex:0 0 66px;display:grid;grid-template-columns:1fr 1.65fr;gap:24px;align-items:center}
  .budget{font-size:16px;line-height:1.45;color:var(--text-muted);border-left:3px solid var(--accent);padding-left:14px}
  .claim{font-size:18px;line-height:1.45;color:var(--text-strong)}
  @keyframes rebound{0%,100%{transform:translateX(0)}35%{transform:translateX(-8px)}70%{transform:translateX(6px)}}
  @media (prefers-reduced-motion:reduce){.candidate{transition:none}.candidate.wrong{animation:none}}
</style>
</head>
<body data-page="22" data-total="52">
<div id="stage">
<main id="main">
  <section class="tool-page min0" aria-label="单人试错与代际继承工具水平比较">
    <div class="k-comparison compare-summary min0" style="--compare-cols:2">
      <div class="hdr">比较维度</div><div class="hdr">单人一生</div><div class="hdr">代际继承</div>
      <div class="dim">起点</div><div class="cell"><span class="runtime-start"></span></div><div class="cell"><span class="runtime-start"></span></div><div class="rowline"></div>
      <div class="dim">试作机会</div><div class="cell"><span id="solo-budget"></span></div><div class="cell"><span id="lineage-budget"></span></div><div class="rowline"></div>
      <div class="dim">已有成果</div><div class="cell">本人保留本轮最高分</div><div class="cell">下一代继承历代最高分</div><div class="rowline"></div>
      <div class="dim">终点</div><div class="cell"><span id="solo-summary">等待试作</span></div><div class="cell"><span id="lineage-summary">等待继承</span></div>
    </div>

    <section class="workshop min0" aria-label="工具代际赛">
      <div class="workshop-top">
        <div class="progress-copy" id="round-status">单人 <strong>1/1</strong> 轮｜代际 <strong>0/4</strong> 代</div>
        <button class="btn icon-only reset" id="reset" type="button" aria-label="用同一种子重置比赛" title="重置">↻</button>
      </div>
      <svg class="genealogy" viewBox="0 0 1408 314" preserveAspectRatio="none" aria-label="上轨在一个工位后结束，下轨经过四个代际工位；每个工位有四条候选分支并汇回主干" role="img">
        <g transform="translate(0 44)">
        <path class="trunk" d="M118 69 H720 M118 159 H1286"/>
        <path class="constraint" d="M720 22 V106 M1286 112 V204"/>
        <g class="branch">
          <path d="M300 69 C330 40 360 40 390 69 M300 69 C330 55 360 55 390 69 M300 69 C330 83 360 83 390 69 M300 69 C330 98 360 98 390 69"/>
          <path d="M190 159 C210 130 235 130 258 159 M190 159 C210 145 235 145 258 159 M190 159 C210 173 235 173 258 159 M190 159 C210 188 235 188 258 159"/>
          <path d="M420 159 C440 130 465 130 488 159 M420 159 C440 145 465 145 488 159 M420 159 C440 173 465 173 488 159 M420 159 C440 188 465 188 488 159"/>
          <path d="M650 159 C670 130 695 130 718 159 M650 159 C670 145 695 145 718 159 M650 159 C670 173 695 173 718 159 M650 159 C670 188 695 188 718 159"/>
          <path d="M880 159 C900 130 925 130 948 159 M880 159 C900 145 925 145 948 159 M880 159 C900 173 925 173 948 159 M880 159 C900 188 925 188 948 159"/>
        </g>
        </g>
      </svg>
      <div class="tracks" aria-hidden="true">
        <div class="shared-start"><div class="start-tool"></div><span id="start-label"></span></div>
        <div class="track solo">
          <div class="track-label">单人一生</div><div class="mainline"></div><div class="finish" id="solo-finish"></div>
          <div class="endpoint" id="solo-end" style="left:52%"></div>
        </div>
        <div class="track lineage">
          <div class="track-label">代际继承</div><div class="mainline"></div><div class="finish" id="lineage-finish"></div>
          <div class="node" style="left:22%"><span class="generation-label"></span></div><div class="node" style="left:44%"><span class="generation-label"></span></div><div class="node" style="left:66%"><span class="generation-label"></span></div><div class="node" style="left:88%"><span class="generation-label"></span></div>
          <div class="endpoint" id="lineage-end" style="left:88%"></div>
        </div>
        <div class="scale"><i style="top:0"></i><span id="scale-max" style="top:0"></span><i style="top:50%"></i><span id="scale-mid" style="top:50%"></span><i style="top:100%"></i><span id="scale-min" style="top:100%"></span></div>
      </div>
      <div class="feedback" id="feedback" aria-live="polite">从本轮四件试作中，存档最高分。</div>
      <div class="candidate-dock" id="candidates"></div>
      <div class="result" id="result">共同标尺<strong>0–100</strong>工具水平</div>
    </section>

    <div class="closing">
      <p class="budget" id="budget-note"></p>
      <p class="claim">个人能学习和改进；文化棘轮的不同，是改进能成为下一代的起点。</p>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
(function(){
  'use strict';
  Lec.mount({index:22,kicker:"CULTURAL RATCHET",title:"一生会结束，改进可以继续",take:"单人反复试错与多人继承改进会产生完全不同的工具水平"});

  const GAME={startLevel:20,soloTrials:4,generations:4,trialsPerGeneration:4,deltaMin:-6,deltaMax:14,scoreMin:0,scoreMax:100,archiveRule:"每轮只保留最高分设计",seed:Lec.K.pageSeed22};
  const els={candidates:document.getElementById('candidates'),feedback:document.getElementById('feedback'),status:document.getElementById('round-status'),result:document.getElementById('result'),soloEnd:document.getElementById('solo-end'),lineageEnd:document.getElementById('lineage-end'),soloFinish:document.getElementById('solo-finish'),lineageFinish:document.getElementById('lineage-finish'),soloSummary:document.getElementById('solo-summary'),lineageSummary:document.getElementById('lineage-summary')};
  let state;

  function shown(n){return Lec.P.roundTo(n,0);}
  function clampScore(n){return Math.max(GAME.scoreMin,Math.min(GAME.scoreMax,n));}
  function makeRound(rng,base){
    const scores=[];
    for(let i=0;i<GAME.trialsPerGeneration;i++){
      const delta=Math.floor(rng()*(GAME.deltaMax-GAME.deltaMin+1))+GAME.deltaMin;
      scores.push(clampScore(base+delta));
    }
    const best=Math.max(base,...scores);
    if(!scores.includes(best)) scores[0]=best;
    return {base,scores,best};
  }
  function fresh(){
    const rng=new Math.seedrandom(GAME.seed);
    const solo=makeRound(rng,GAME.startLevel);
    const lineage=[];
    let base=GAME.startLevel;
    for(let g=0;g<GAME.generations;g++){
      const round=makeRound(rng,base);lineage.push(round);base=round.best;
    }
    return {phase:'solo',generation:0,solo,lineage,soloBest:null,lineageBest:GAME.startLevel,complete:false,trace:[]};
  }
  function currentRound(){return state.phase==='solo'?state.solo:state.lineage[state.generation];}
  function setStaticNumbers(){
    document.querySelectorAll('.runtime-start').forEach(el=>el.textContent='工具水平 '+shown(GAME.startLevel)+'/100');
    document.getElementById('start-label').textContent=shown(GAME.startLevel)+'/100';
    document.getElementById('solo-budget').textContent=shown(GAME.soloTrials)+' 次后结束';
    document.getElementById('lineage-budget').textContent=shown(GAME.generations)+' 代 × 每代 '+shown(GAME.trialsPerGeneration)+' 次';
    document.getElementById('scale-max').textContent=shown(GAME.scoreMax);
    document.getElementById('scale-mid').textContent=shown(Lec.P.difference(GAME.scoreMax,GAME.scoreMin)/2);
    document.getElementById('scale-min').textContent=shown(GAME.scoreMin);
    document.querySelectorAll('.generation-label').forEach((el,i)=>el.textContent='第'+shown(i+1)+'代');
    document.getElementById('budget-note').textContent='两轨尝试预算不同：'+shown(GAME.soloTrials)+' 次对 '+shown(GAME.generations*GAME.trialsPerGeneration)+' 次。比较的是搜索能否跨越个人寿命继续。';
  }
  function renderCandidates(){
    els.candidates.replaceChildren();
    if(state.complete) return;
    const round=currentRound();
    round.scores.forEach((score,i)=>{
      const b=document.createElement('button');
      b.type='button';b.className='candidate choice';
      b.setAttribute('aria-label','候选 '+(i+1)+'，工具水平 '+shown(score));
      b.innerHTML='<span class="tool" style="--tip:'+(28+(score%34))+'%"></span><span class="score">'+shown(score)+'/100</span>';
      b.addEventListener('click',()=>choose(i,b));
      els.candidates.appendChild(b);
    });
  }
  function render(){
    const doneGenerations=state.phase==='solo'?0:state.generation+(state.complete?0:0);
    els.status.innerHTML='单人 <strong>'+(state.soloBest===null?'0':'1')+'/1</strong> 轮｜代际 <strong>'+doneGenerations+'/4</strong> 代';
    els.soloEnd.textContent=state.soloBest===null?'':shown(state.soloBest);
    els.lineageEnd.textContent=state.generation===0&&state.phase==='solo'?'':shown(state.lineageBest);
    els.soloSummary.textContent=state.soloBest===null?'等待试作':'个人最高 '+shown(state.soloBest)+'/100';
    els.lineageSummary.textContent=state.complete?'第4代 '+shown(state.lineageBest)+'/100':'当前 '+shown(state.lineageBest)+'/100';
    document.querySelectorAll('.lineage .node').forEach((n,i)=>n.classList.toggle('done',i<doneGenerations));
    els.soloFinish.classList.toggle('lit',state.complete);els.lineageFinish.classList.toggle('lit',state.complete);
    if(state.complete){
      const lead=Lec.P.difference(state.lineageBest,state.soloBest);
      els.result.innerHTML='代际领先<strong>+'+shown(lead)+'</strong>';
    }
    renderCandidates();
  }
  function choose(index,button){
    const round=currentRound();
    const score=round.scores[index];
    if(score!==round.best){
      button.classList.add('wrong');
      els.feedback.className='feedback error';
      els.feedback.textContent='这一件低于本轮最高分，存档会丢掉已有改进。';
      const buttons=[...els.candidates.querySelectorAll('button')];
      buttons.forEach((b,i)=>b.classList.toggle('best',round.scores[i]===round.best));
      setTimeout(()=>button.classList.remove('wrong'),240);
      return;
    }
    state.trace.push({phase:state.phase,generation:state.generation,score});
    els.feedback.className='feedback';
    if(state.phase==='solo'){
      state.soloBest=score;state.phase='lineage';state.generation=0;
      els.feedback.textContent='个人最高分已存档。现在让下一代从已有成果起步。';
    }else{
      state.lineageBest=score;state.generation++;
      if(state.generation>=GAME.generations){
        state.complete=true;
        els.feedback.textContent='四代结束：保留的成果没有随制作者离场而消失。';
        const lead=Lec.P.difference(state.lineageBest,state.soloBest);
        document.dispatchEvent(new CustomEvent('game-complete',{detail:{score:lead,metrics:{solo:state.soloBest,lineage:state.lineageBest},trace:state.trace}}));
      }else{
        els.feedback.textContent='最高分进入档案，成为第 '+shown(state.generation+1)+' 代的起点。';
      }
    }
    render();
    document.dispatchEvent(new CustomEvent('game-progress',{detail:{state:JSON.parse(JSON.stringify(state)),action:'archive',metrics:{score}}}));
  }
  function reset(){
    state=fresh();
    els.feedback.className='feedback';els.feedback.textContent='从本轮四件试作中，存档最高分。';
    els.result.innerHTML='共同标尺<strong>0–100</strong>工具水平';
    render();
    document.dispatchEvent(new CustomEvent('game-reset'));
  }
  document.getElementById('reset').addEventListener('click',reset);
  setStaticNumbers();reset();
  window.page22={reset,getState:()=>JSON.parse(JSON.stringify(state)),chooseBest:()=>{const r=currentRound();const i=r.scores.indexOf(r.best);els.candidates.children[i].click();}};
}());
</script>
</body>
</html>
