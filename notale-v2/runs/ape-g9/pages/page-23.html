<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main{display:flex;gap:var(--sp-5)}
  .lec-progress{overflow:visible}
  .network-shell{position:relative;flex:0 0 1048px;height:620px;overflow:hidden;border-right:var(--border);background:linear-gradient(90deg,rgba(53,198,180,.04),transparent 70%)}
  .network-shell::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(53,198,180,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(53,198,180,.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
  .network-head{position:absolute;z-index:5;top:0;left:0;right:var(--sp-5);display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-5)}
  .network-head h2{color:var(--text-strong)}
  .network-head p{max-width:570px;color:var(--text-muted);font-size:var(--fs-sec);line-height:var(--lh-copy)}
  .completion-take{min-width:250px;padding:var(--sp-2) var(--sp-4);color:var(--accent);font-size:var(--fs-lead);font-weight:700;line-height:var(--lh-copy);border-left:4px solid var(--accent);background:var(--surface-yellow);opacity:0;transform:translateY(-8px);transition:opacity 180ms ease,transform 180ms ease}
  .completion-take.is-visible{opacity:1;transform:none}
  .network-map{position:absolute;inset:66px 14px 0 0}
  #knowledge-network{display:block;width:100%;height:100%;overflow:visible}
  .route-base{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 9}
  .route-live{fill:none;stroke:var(--primary);stroke-width:3;marker-end:url(#arrow-live);stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(53,198,180,.35))}
  .route-live.is-new{stroke:var(--accent);stroke-width:4}
  .route-flow{fill:none;stroke:var(--accent);stroke-width:4;stroke-dasharray:10 15;stroke-linecap:round;opacity:0}
  .link-label{fill:var(--text-muted);font:600 14px var(--font-sans);paint-order:stroke;stroke:var(--surface-0);stroke-width:7px;stroke-linejoin:round}
  .route-flow.is-running{opacity:1;animation:flow 900ms linear 2}
  .node{opacity:.36;transition:opacity 180ms ease}
  .node.is-ready{opacity:.72}
  .node.is-live{opacity:1}
  .node-body{fill:var(--surface-glass);stroke:var(--line-strong);stroke-width:1.5;rx:8}
  .node.is-ready .node-body{stroke:var(--accent);stroke-dasharray:6 5;filter:drop-shadow(0 0 7px rgba(255,204,77,.28))}
  .node.is-live .node-body{fill:var(--surface-teal);stroke:var(--primary);stroke-width:2}
  .node-index{fill:var(--primary-bright);font:700 15px var(--font-mono)}
  .node-type{fill:var(--text-muted);font:600 15px var(--font-sans)}
  .node-copy{fill:var(--text-strong);font:600 17px var(--font-sans)}
  .node-slot{fill:var(--text-muted);font:600 14px var(--font-mono)}
  .node.is-current .node-body{stroke:var(--accent);stroke-width:3}
  .node.is-error{animation:node-shake 220ms ease}
  .traveler{fill:var(--text-muted);stroke:var(--line-strong);stroke-width:2}
  .traveler.is-live{fill:var(--accent);stroke:var(--accent)}
  .process-key{position:absolute;left:0;bottom:8px;z-index:5;display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-2) var(--sp-3);color:var(--text-muted);font-size:var(--fs-label);line-height:1.35;background:rgba(7,16,21,.8)}
  .key-line{display:inline-block;width:34px;height:3px;background:var(--primary)}
  .key-arrow{color:var(--accent);font-size:var(--fs-h2);line-height:1}
  .tray{flex:1 1 0;height:620px;padding-left:var(--sp-2)}
  .tray-top{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding-bottom:var(--sp-3);border-bottom:2px solid var(--primary-dark)}
  .tray-top h2{color:var(--text-strong)}
  .progress-read{color:var(--primary-bright);font-family:var(--font-mono);font-size:var(--fs-lead);font-weight:700;white-space:nowrap}
  .instruction{margin-top:var(--sp-3);color:var(--text-muted);font-size:var(--fs-sec);line-height:var(--lh-copy)}
  .feedback{min-height:52px;margin:var(--sp-3) 0;padding:var(--sp-3) var(--sp-4);color:var(--text-strong);font-size:var(--fs-sec);line-height:var(--lh-copy);border-left:3px solid var(--primary);background:var(--surface-teal)}
  .feedback.is-error{border-left-color:var(--danger);background:rgba(255,113,104,.09)}
  .card-list{display:flex;flex-direction:column;gap:var(--sp-2);margin:0;padding:0;list-style:none}
  .info-card{position:relative;display:flex;align-items:center;gap:var(--sp-3);min-height:61px;box-sizing:border-box;padding:var(--sp-2) var(--sp-3);color:var(--text-strong);font-size:var(--fs-sec);line-height:1.4;border:var(--border);border-left:3px solid var(--primary-dark);border-radius:var(--radius-2);background:var(--surface-1);cursor:grab;user-select:none;touch-action:none;transition:border-color 140ms ease,background 140ms ease,opacity 140ms ease,transform 140ms ease}
  .info-card:hover,.info-card:focus-visible,.info-card.is-selected{outline:none;border-color:var(--accent);border-left-color:var(--accent);background:var(--surface-yellow)}
  .info-card.is-dragging{z-index:20;cursor:grabbing;box-shadow:var(--shadow-panel);transition:none}
  .info-card.is-connected{opacity:.3;pointer-events:none;text-decoration:line-through}
  .card-code{flex:0 0 28px;color:var(--primary-bright);font:700 15px var(--font-mono)}
  .tray-actions{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin-top:var(--sp-3)}
  .merge-reading{color:var(--text-muted);font-size:var(--fs-label);font-weight:600}
  .merge-reading strong{color:var(--accent);font-family:var(--font-mono);font-size:var(--fs-lead)}
  #reset-btn{visibility:hidden}
  #reset-btn.is-visible{visibility:visible}
  @keyframes flow{to{stroke-dashoffset:-50}}
  @keyframes node-shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  @media (prefers-reduced-motion:reduce){.completion-take,.node,.info-card{transition:none}.route-flow.is-running{animation:none;opacity:1}.node.is-error .node-body{stroke:var(--danger);stroke-width:4}}
</style>
</head>
<body data-page="23" data-total="52">
<div id="stage">
<main id="main">
  <section class="network-shell min0 k-process no-pan" aria-labelledby="network-title">
    <div class="axis" aria-hidden="true"></div>
    <div class="network-head">
      <div>
        <h2 id="network-title">从亲历到远方行动</h2>
        <p>把右侧信息接到黄色开放节点。箭头表示经验每次改变了什么。</p>
      </div>
      <p id="completion-take" class="completion-take" aria-live="polite">未在场，也能据此行动</p>
    </div>
    <div class="network-map">
      <svg id="knowledge-network" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">经验通过语言和符号传播并重组的网络</title>
        <desc id="svg-desc">亲历被说出并记录，桥断记录与浅滩记录汇合成绕行判断，最后改变远方旅行者的路线。</desc>
      </svg>
    </div>
    <div class="process-key" aria-hidden="true"><span class="key-line"></span><span>已接通的因果路径</span><span class="key-arrow">→</span><span>信息发生变化</span></div>
  </section>

  <aside class="tray col min0" aria-labelledby="tray-title">
    <div class="tray-top">
      <h2 id="tray-title">信息托盘</h2>
      <div class="progress-read" id="progress-read">已接通 0/5</div>
    </div>
    <p class="instruction">拖卡到开放节点；键盘可选中卡片，再按 Enter 接入。</p>
    <div id="feedback" class="feedback" aria-live="polite">起点只有一段亲历：我看见北岸木桥被冲断。</div>
    <ol class="card-list" id="card-list">
      <li class="info-card" data-id="E" draggable="true" tabindex="0" role="button" aria-label="接入：桥断加浅滩可通行，改走东侧"><span class="card-code">E</span><span>桥断 + 浅滩可通行 → 改走东侧</span></li>
      <li class="info-card" data-id="C" draggable="true" tabindex="0" role="button" aria-label="接入：地图上标出桥断符号"><span class="card-code">C</span><span>地图上标出“桥断”符号</span></li>
      <li class="info-card" data-id="F" draggable="true" tabindex="0" role="button" aria-label="接入：远处旅行者据此改变路线"><span class="card-code">F</span><span>远处旅行者据此改变路线</span></li>
      <li class="info-card" data-id="D" draggable="true" tabindex="0" role="button" aria-label="接入：另一人记录东侧浅滩可通行"><span class="card-code">D</span><span>另一人记录：“东侧浅滩可通行”</span></li>
      <li class="info-card" data-id="B" draggable="true" tabindex="0" role="button" aria-label="接入：我说北岸桥断了"><span class="card-code">B</span><span>我说：“北岸桥断了”</span></li>
    </ol>
    <div class="tray-actions">
      <div class="merge-reading">重组输入 <strong id="merge-count">0/2</strong></div>
      <button id="reset-btn" class="btn icon-only" type="button" title="重置接龙" aria-label="重置接龙">↻</button>
    </div>
  </aside>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  'use strict';
  Lec.mount({index:23,kicker:'CULTURE · SYMBOLS',title:'经验怎样离开亲历者',take:'语言与符号让经验脱离当事人，在群体中重组并远距离传播。'});

  const nodeSeed=[
    {id:'A',type:'亲历',lines:['我看见：河水冲断','北岸木桥'],x:100,y:248,w:178,h:104},
    {id:'B',type:'语言编码',lines:['我说：“北岸桥断了”'],x:288,y:160,w:192,h:92},
    {id:'C',type:'符号记录',lines:['地图标出“桥断”'],x:490,y:128,w:184,h:92},
    {id:'D',type:'独立经验',lines:['东侧浅滩可通行'],x:480,y:382,w:194,h:92},
    {id:'E',type:'信息重组',lines:['桥断 + 浅滩可通行','→ 改走东侧'],x:690,y:252,w:214,h:112},
    {id:'F',type:'远方行动',lines:['旅行者改变路线'],x:890,y:252,w:172,h:92}
  ];
  const links=[
    {source:'A',target:'B',change:'经验被语言编码'},
    {source:'B',target:'C',change:'信息被符号保存'},
    {source:'C',target:'E',change:'桥断记录进入判断'},
    {source:'D',target:'E',change:'浅滩记录进入判断'},
    {source:'E',target:'F',change:'新判断远距离传播'}
  ];
  const initial=()=>({connected:['A'],selected:null,complete:false,lastLink:null});
  let state=initial();
  let drag={id:null,x:0,y:0};
  const svg=d3.select('#knowledge-network').attr('viewBox','0 0 760 560').attr('preserveAspectRatio','xMidYMid meet');
  const defs=svg.append('defs');
  defs.append('marker').attr('id','arrow-live').attr('viewBox','0 0 10 10').attr('refX',9).attr('refY',5).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto-start-reverse').append('path').attr('d','M 0 0 L 10 5 L 0 10 z').attr('fill','var(--primary)');
  const routeLayer=svg.append('g').attr('aria-hidden','true');
  const flowLayer=svg.append('g').attr('aria-hidden','true');
  const labelLayer=svg.append('g').attr('aria-hidden','true');
  const nodeLayer=svg.append('g');
  const nodes=nodeSeed.map(d=>({...d}));
  const simulation=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(d=>d.id).distance(118).strength(0.8)).force('charge',d3.forceManyBody().strength(-420)).force('x',d3.forceX(d=>d.x).strength(0.35)).force('y',d3.forceY(d=>d.y).strength(0.35)).alphaDecay(0.06);
  nodes.forEach((d,i)=>{d.fx=nodeSeed[i].x;d.fy=nodeSeed[i].y;});

  function pathFor(d){
    const s=typeof d.source==='string'?nodes.find(n=>n.id===d.source):d.source;
    const t=typeof d.target==='string'?nodes.find(n=>n.id===d.target):d.target;
    const x1=s.x+s.w/2, y1=s.y;
    const x2=t.x-t.w/2, y2=t.y;
    const bend=Math.max(36,(x2-x1)*.42);
    return `M${x1},${y1} C${x1+bend},${y1} ${x2-bend},${y2} ${x2},${y2}`;
  }

  const routes=routeLayer.selectAll('path').data(links).join('path').attr('class','route-base').attr('d',pathFor);
  const liveRoutes=routeLayer.selectAll('path.route-live').data(links).join('path').attr('class','route-live').attr('d',pathFor).style('display','none');
  const flows=flowLayer.selectAll('path').data(links).join('path').attr('class','route-flow').attr('d',pathFor);
  const linkLabels=labelLayer.selectAll('text').data(links).join('text').attr('class','link-label').attr('text-anchor','middle').text(d=>d.change);
  const node=nodeLayer.selectAll('g.node').data(nodes,d=>d.id).join('g').attr('class','node').attr('data-node',d=>d.id).attr('transform',d=>`translate(${d.x},${d.y})`);
  node.append('rect').attr('class','node-body').attr('x',d=>-d.w/2).attr('y',d=>-d.h/2).attr('width',d=>d.w).attr('height',d=>d.h);
  node.append('text').attr('class','node-index').attr('x',d=>-d.w/2+14).attr('y',d=>-d.h/2+23).text(d=>d.id);
  node.append('text').attr('class','node-type').attr('x',d=>-d.w/2+42).attr('y',d=>-d.h/2+23).text(d=>d.type);
  node.each(function(d){
    const text=d3.select(this).append('text').attr('class','node-copy').attr('text-anchor','middle').attr('y',d.lines.length>1?6:12);
    d.lines.forEach((line,i)=>text.append('tspan').attr('x',0).attr('dy',i===0?0:25).text(line));
  });
  node.filter(d=>d.id==='E').append('text').attr('id','merge-slot-svg').attr('class','node-slot').attr('text-anchor','middle').attr('y',42).text('输入 0/2');
  const traveler=nodeLayer.append('g').attr('class','traveler').attr('transform','translate(748,252)').attr('aria-hidden','true');
  traveler.append('circle').attr('cy',-13).attr('r',8);
  traveler.append('path').attr('d','M0,-4 L0,18 M-12,5 L12,5 M0,18 L-10,34 M0,18 L10,34').attr('fill','none').attr('stroke','currentColor').attr('stroke-width',4).attr('stroke-linecap','round');

  function isConnected(id){return state.connected.includes(id);}
  function mergeInputs(){return Number(isConnected('C'))+Number(isConnected('D'));}
  function isLegal(id){
    if(isConnected(id)) return false;
    if(id==='B') return isConnected('A');
    if(id==='C') return isConnected('B');
    if(id==='D') return true;
    if(id==='E') return isConnected('C')&&isConnected('D');
    if(id==='F') return isConnected('E');
    return false;
  }
  function expectedMessage(id){
    if(id==='C'&&!isConnected('B')) return '经验要先被说出来，才能成为记录。';
    if(id==='E'&&mergeInputs()<2) return '这里需要“桥断”和“浅滩可通行”两条信息同时到达。';
    if(id==='F'&&!isConnected('E')) return '先把两份记录重组成路线判断。';
    return '请把信息接到当前黄色开放节点。';
  }
  function transition(action){
    if(action.type==='connect'){
      if(!isLegal(action.id)) return {ok:false,message:expectedMessage(action.id)};
      state={...state,connected:[...state.connected,action.id],selected:null,lastLink:action.id,complete:action.id==='F'};
      return {ok:true};
    }
    if(action.type==='reset'){state=initial();return {ok:true};}
    return {ok:false};
  }
  function openIds(){return ['B','C','D','E','F'].filter(isLegal);}
  function linkIsLive(d){return isConnected(typeof d.source==='string'?d.source:d.source.id)&&isConnected(typeof d.target==='string'?d.target:d.target.id);}
  function render(result){
    const open=new Set(openIds());
    node.attr('class',d=>`node${isConnected(d.id)?' is-live':''}${open.has(d.id)?' is-ready is-current':''}`);
    liveRoutes.style('display',d=>linkIsLive(d)?null:'none').classed('is-new',d=>state.lastLink===(typeof d.target==='string'?d.target:d.target.id));
    d3.select('#merge-slot-svg').text(`输入 ${mergeInputs()}/2`);
    document.getElementById('merge-count').textContent=`${mergeInputs()}/2`;
    const done=state.connected.length-1;
    document.getElementById('progress-read').textContent=`已接通 ${done}/5`;
    document.querySelectorAll('.info-card').forEach(card=>{
      const id=card.dataset.id;
      card.classList.toggle('is-connected',isConnected(id));
      card.classList.toggle('is-selected',state.selected===id);
      card.setAttribute('aria-disabled',String(isConnected(id)));
      card.tabIndex=isConnected(id)?-1:0;
    });
    document.getElementById('completion-take').classList.toggle('is-visible',state.complete);
    document.getElementById('reset-btn').classList.toggle('is-visible',state.complete);
    traveler.classed('is-live',state.complete);
    const feedback=document.getElementById('feedback');
    feedback.classList.toggle('is-error',result&&result.ok===false);
    if(result&&result.ok===false) feedback.textContent=result.message;
    else if(state.complete) feedback.textContent='语言不只传给眼前的人；符号还能保存、搬运并重组经验，让未曾在场的人据此行动。';
    else if(state.lastLink==='B') feedback.textContent='亲历被语言编码：事件可以离开看见它的人。';
    else if(state.lastLink==='C') feedback.textContent='信息被符号保存：说话者不在场，记录仍可被搬运。';
    else if(state.lastLink==='D') feedback.textContent='另一条独立经验进入网络，等待与桥断记录汇合。';
    else if(state.lastLink==='E') feedback.textContent='两份信息被重组：任何一位亲历者都没有单独拥有这个路线判断。';
    else feedback.textContent='起点只有一段亲历：我看见北岸木桥被冲断。';
    if(state.complete){
      simulation.stop();
      flows.classed('is-running',true);
    }else flows.classed('is-running',false);
  }
  function showError(id,result){
    const card=document.querySelector(`.info-card[data-id="${id}"]`);
    const target=node.filter(d=>openIds().includes(d.id));
    card.classList.remove('is-dragging');
    card.style.transform='';
    target.classed('is-error',true);
    setTimeout(()=>target.classed('is-error',false),240);
    render(result);
  }
  function attempt(id,targetId){
    const open=openIds();
    if(targetId&&targetId!==id){showError(id,{ok:false,message:'这张信息不能接到该节点；请沿因果箭头寻找开放端口。'});return;}
    if(targetId&&!open.includes(targetId)){showError(id,{ok:false,message:expectedMessage(id)});return;}
    const result=transition({type:'connect',id});
    if(!result.ok){showError(id,result);return;}
    render(result);
  }

  document.querySelectorAll('.info-card').forEach(card=>{
    card.addEventListener('dragstart',e=>{drag.id=card.dataset.id;e.dataTransfer.setData('text/plain',drag.id);e.dataTransfer.effectAllowed='move';card.classList.add('is-dragging');});
    card.addEventListener('dragend',()=>{card.classList.remove('is-dragging');card.style.transform='';});
    card.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();state={...state,selected:card.dataset.id};render();attempt(card.dataset.id);}
    });
    card.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse') return;
      drag={id:card.dataset.id,x:e.clientX,y:e.clientY};card.setPointerCapture(e.pointerId);card.classList.add('is-dragging');
    });
    card.addEventListener('pointermove',e=>{
      if(drag.id!==card.dataset.id||e.pointerType==='mouse') return;
      card.style.transform=`translate(${(e.clientX-drag.x)/Deck.s}px,${(e.clientY-drag.y)/Deck.s}px)`;
    });
    card.addEventListener('pointerup',e=>{
      if(drag.id!==card.dataset.id||e.pointerType==='mouse') return;
      const pt=Deck.pt(document.querySelector('.network-map'),e);
      const target=openIds().find(id=>{const n=nodes.find(d=>d.id===id);return Math.abs(pt.x-n.x)<n.w/2+24&&Math.abs(pt.y-n.y)<n.h/2+24;});
      card.classList.remove('is-dragging');card.style.transform='';
      if(target) attempt(card.dataset.id,target);else showError(card.dataset.id,{ok:false,message:'请把信息接到当前黄色开放节点。'});
      drag.id=null;
    });
  });
  const map=document.querySelector('.network-map');
  map.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';});
  map.addEventListener('drop',e=>{
    e.preventDefault();
    const id=e.dataTransfer.getData('text/plain');
    const pt=Deck.pt(map,e);
    const target=openIds().find(nodeId=>{const n=nodes.find(d=>d.id===nodeId);return Math.abs(pt.x-n.x)<n.w/2+24&&Math.abs(pt.y-n.y)<n.h/2+24;});
    if(target) attempt(id,target);else showError(id,{ok:false,message:'请把信息接到当前黄色开放节点。'});
  });
  document.getElementById('reset-btn').addEventListener('click',()=>{transition({type:'reset'});render();});
  simulation.on('tick',()=>{
    node.attr('transform',d=>`translate(${d.x},${d.y})`);
    routes.attr('d',pathFor);liveRoutes.attr('d',pathFor);flows.attr('d',pathFor);
    linkLabels.attr('x',d=>{const s=typeof d.source==='string'?nodes.find(n=>n.id===d.source):d.source;const t=typeof d.target==='string'?nodes.find(n=>n.id===d.target):d.target;return (s.x+t.x)/2;}).attr('y',d=>{const s=typeof d.source==='string'?nodes.find(n=>n.id===d.source):d.source;const t=typeof d.target==='string'?nodes.find(n=>n.id===d.target):d.target;return (s.y+t.y)/2+(s.y===t.y?-48:(s.y<t.y?-12:18));});
  });
  if(Deck.reduced()) simulation.stop();
  render();
})();
</script>
</body>
