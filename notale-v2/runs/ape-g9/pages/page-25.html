<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  pencil-network-game{display:block;width:100%;height:100%;min-width:0;min-height:0}
  .p25-shell{position:relative;display:flex;flex-direction:column;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden}
  .p25-lead{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-5);height:42px;flex:0 0 42px;color:var(--text-muted);font-size:var(--fs-sec);line-height:var(--lh-copy)}
  .p25-lead strong{color:var(--text-strong);font-size:var(--fs-lead)}
  .p25-board{position:relative;flex:1 1 0;min-height:0;border-top:var(--border);background:rgba(7,16,21,.48)}
  .p25-ledger{--compare-cols:2;position:absolute;inset:0 0 74px;grid-template-columns:150px minmax(0,1.05fr) minmax(0,1fr);grid-template-rows:54px repeat(6,minmax(0,1fr));z-index:2}
  .p25-ledger>.hdr{padding:var(--sp-2) var(--sp-4);font-size:var(--fs-lead)}
  .p25-ledger>.dim{position:relative;justify-content:flex-start;padding:var(--sp-2) var(--sp-4);color:var(--text-strong);font-size:var(--fs-sec);text-align:left}
  .p25-ledger>.dim::after{content:"";position:absolute;right:14px;width:10px;height:10px;border:2px solid var(--primary);border-radius:50%;background:var(--surface-0)}
  .p25-ledger>.cell{position:relative;padding:var(--sp-2) var(--sp-4);line-height:1.35}
  .solo-cell{color:var(--text-muted);transition:opacity 220ms ease}
  .solo-cell::before{content:"一人全包";flex:0 0 auto;margin-right:var(--sp-3);padding:2px 6px;color:var(--accent);font-size:var(--fs-label);font-weight:700;border:1px solid rgba(255,204,77,.45);border-radius:var(--radius-1)}
  .network-cell{justify-content:flex-start;overflow:visible}
  .drop-slot{display:flex;align-items:center;justify-content:center;width:184px;min-height:40px;box-sizing:border-box;padding:var(--sp-1) var(--sp-3);color:var(--text-faint);font-size:var(--fs-label);font-weight:700;line-height:1.35;border:1px dashed var(--line-strong);border-radius:var(--radius-2);background:rgba(13,26,32,.66)}
  .drop-slot.is-target{color:var(--accent);border-color:var(--accent);background:var(--surface-yellow)}
  .drop-slot.is-filled{color:var(--primary-bright);border-style:solid;border-color:var(--primary-dark);background:var(--surface-teal)}
  .role-layer{position:absolute;inset:54px 0 74px;z-index:4;pointer-events:none}
  .role{position:absolute;left:calc(100% - 274px);top:var(--role-y);display:flex;align-items:center;width:238px;min-height:40px;box-sizing:border-box;padding:var(--sp-1) var(--sp-3);color:var(--text-strong);font-size:var(--fs-sec);font-weight:700;line-height:1.35;border:1px solid var(--line-strong);border-left:4px solid var(--primary);border-radius:var(--radius-2);outline:0;background:var(--surface-2);box-shadow:0 8px 18px rgba(0,0,0,.22);cursor:grab;pointer-events:auto;touch-action:none;user-select:none;will-change:transform}
  .role:hover,.role:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,204,77,.22)}
  .role.is-dragging{cursor:grabbing;border-color:var(--accent);z-index:8}
  .role.is-locked{color:var(--primary-bright);border-color:var(--primary);background:var(--surface-teal);cursor:default}
  .role.is-wrong{border-color:var(--danger)}
  .link-layer{position:absolute;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}
  .dep-link{fill:none;stroke:var(--primary);stroke-width:1.5;opacity:.88}
  .dep-link.is-current{stroke:var(--accent);stroke-width:3}
  .pencil-spine{position:absolute;right:12px;bottom:34px;left:12px;height:30px;z-index:5;display:flex;align-items:center;opacity:.42;transition:opacity 220ms ease}
  .pencil-wood{position:relative;flex:1;height:20px;border:2px solid var(--primary-dark);background:var(--surface-teal)}
  .pencil-wood::before{content:"";position:absolute;top:50%;right:0;left:0;height:4px;background:var(--text-faint);transform:translateY(-50%)}
  .pencil-tip{width:0;height:0;border-top:12px solid transparent;border-bottom:12px solid transparent;border-right:0;border-left:42px solid var(--text-muted)}
  .pencil-band{width:34px;height:24px;background:var(--line-strong)}
  .pencil-eraser{width:54px;height:24px;border-radius:0 var(--radius-3) var(--radius-3) 0;background:var(--danger)}
  .pencil-label{position:absolute;left:50%;top:50%;color:var(--text-strong);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;transform:translate(-50%,-50%)}
  .p25-board.is-complete .solo-cell{opacity:.28}
  .p25-board.is-complete .pencil-spine{opacity:1}
  .p25-result{position:absolute;right:0;bottom:0;left:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-5);height:74px;box-sizing:border-box;padding:var(--sp-3) var(--sp-4);border-top:2px solid var(--primary-dark);background:var(--surface-1)}
  .p25-claim{min-width:0;color:var(--text-muted);font-size:var(--fs-sec);line-height:var(--lh-copy)}
  .p25-claim strong{display:block;color:var(--text-strong);font-size:var(--fs-lead);line-height:1.35}
  .progress-wrap{display:flex;align-items:center;gap:var(--sp-3);flex:0 0 auto}
  .progress-cells{display:flex;gap:var(--sp-2)}
  .progress-cell{width:16px;height:16px;box-sizing:border-box;border:2px solid var(--primary-dark);border-radius:var(--radius-1);background:transparent}
  .progress-cell.is-on{border-color:var(--primary);background:var(--primary)}
  .progress-read{min-width:106px;color:var(--primary-bright);font-family:var(--font-mono);font-size:var(--fs-sec);font-weight:700}
  .reset-btn{visibility:hidden;width:40px;height:40px;padding:0;font-size:24px}
  .reset-btn.is-visible{visibility:visible}
  .status-line{position:absolute;right:20px;bottom:82px;z-index:7;max-width:460px;padding:var(--sp-2) var(--sp-3);color:var(--text-strong);font-size:var(--fs-sec);line-height:var(--lh-copy);border-left:3px solid var(--accent);background:var(--surface-1);opacity:0;transform:translateY(4px);transition:opacity 140ms ease,transform 140ms ease;pointer-events:none}
  .status-line.is-visible{opacity:1;transform:none}
  .lec-progress{overflow:visible}
  @keyframes wrong-shake{0%,100%{margin-left:0}25%{margin-left:-10px}75%{margin-left:10px}}
  .role.is-wrong{animation:wrong-shake 180ms linear 2}
  @media (prefers-reduced-motion:reduce){.solo-cell,.pencil-spine,.status-line{transition:none}.role.is-wrong{animation:none}}
</style>
</head>
<body data-page="25" data-total="52">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
Lec.mount({index:25,kicker:'DISTRIBUTED KNOWLEDGE',title:'谁能独自造出一支铅笔？',take:'看似简单的现代物品，也依赖无人能够独自掌握的分布式知识。'});

class PencilNetworkGame extends HTMLElement {
  constructor(){
    super();
    this.state=this.freshState();
    this.roles=[
      {id:'wood',part:'木杆',solo:'识别木材、采伐、锯切、干燥、开槽',network:'林业人员＋锯木厂＋木材加工人员'},
      {id:'core',part:'笔芯',solo:'找到石墨与黏土、控制配比、挤压、烧制',network:'矿业人员＋材料配方人员＋窑炉操作员'},
      {id:'metal',part:'金属套圈',solo:'取得金属、配制合金、轧片、冲压成形',network:'采矿人员＋冶金人员＋金属成形人员'},
      {id:'eraser',part:'橡皮',solo:'取得橡胶原料、调配、硫化、定型',network:'原料供应者＋化工人员＋模具操作员'},
      {id:'coat',part:'涂层与标记',solo:'配制涂料、稳定着色、印刷文字',network:'涂料人员＋色彩配方人员＋印刷人员'},
      {id:'delivery',part:'成品交付',solo:'校准装配、检验规格、包装并送达',network:'装配人员＋质检人员＋物流人员'}
    ];
    this.order=['metal','wood','delivery','core','coat','eraser'];
  }
  freshState(){return {started:false,connected:[],selected:null,complete:false,trace:[]};}
  connectedCount(){return this.state.connected.length;}
  start(){
    if(this.state.started)return;
    this.state.started=true;
    this.dispatchEvent(new CustomEvent('game-start',{bubbles:true,composed:true,detail:{state:this.getState()}}));
  }
  reset(){
    this.state=this.freshState();
    this.render();
    this.start();
    this.dispatchEvent(new CustomEvent('game-reset',{bubbles:true,composed:true,detail:{state:this.getState()}}));
  }
  getState(){return JSON.parse(JSON.stringify(this.state));}
  connectedCallback(){this.render();this.start();}
  render(){
    const rows=this.roles.map((r,i)=>`<div class="dim" data-part="${r.id}">${r.part}</div><div class="cell solo-cell">${r.solo}</div><div class="cell network-cell"><div class="drop-slot" data-slot="${r.id}">接入对应知识节点</div></div>`).join('');
    const roleNodes=this.order.map((id,i)=>{const r=this.roles.find(v=>v.id===id);return `<div class="role" data-role="${r.id}" role="button" tabindex="0" aria-label="${r.network}，拖到对应部件" style="--role-y:calc(${i} * (100% / 6) + 7px)">${r.network}</div>`;}).join('');
    this.innerHTML=`<section class="p25-shell"><div class="p25-lead"><strong>把右侧职业知识接到对应部件。</strong><span>比较同一行：个人要全部会，协作网络只需让知识正确汇合。</span></div><div class="p25-board no-pan"><div class="k-comparison p25-ledger"><div class="hdr">铅笔所需项</div><div class="hdr">一个人从天然原料开始</div><div class="hdr">现代协作网络</div>${rows}</div><svg class="link-layer" viewBox="0 0 1180 560" preserveAspectRatio="none" role="img" aria-label="六组职业知识连接到铅笔部件，再汇合为成品"><g class="links"></g></svg><div class="role-layer">${roleNodes}</div><div class="pencil-spine" aria-hidden="true"><div class="pencil-tip"></div><div class="pencil-wood"><span class="pencil-label">分布式知识汇合成品</span></div><div class="pencil-band"></div><div class="pencil-eraser"></div></div><div class="status-line" role="status" aria-live="polite"></div><div class="p25-result"><p class="p25-claim"><strong>铅笔属于使用者，造出它的能力却不属于任何一个人。</strong><span>能力分布在许多人、工具、规则与已传承的知识之间。</span></p><div class="progress-wrap"><div class="progress-cells" aria-hidden="true">${this.roles.map(()=>'<span class="progress-cell"></span>').join('')}</div><span class="progress-read"></span><button class="reset-btn icon-only" type="button" title="重新挑战" aria-label="重新挑战">↻</button></div></div></div></section>`;
    this.bind();
    this.update();
  }
  bind(){
    this.board=this.querySelector('.p25-board');
    this.status=this.querySelector('.status-line');
    this.querySelector('.reset-btn').addEventListener('click',()=>this.reset());
    const game=this;
    const drag=d3.drag().on('start',function(event){game.dragStarted(event,this);}).on('drag',function(event){game.dragged(event,this);}).on('end',function(event){game.dropped(event,this);});
    d3.select(this).selectAll('.role').call(drag);
    this.querySelectorAll('.role').forEach(el=>el.addEventListener('keydown',e=>this.keyRole(e,el)));
    this.resizeObserver=new ResizeObserver(()=>this.drawLinks());
    this.resizeObserver.observe(this.board);
  }
  keyRole(e,el){
    if(el.classList.contains('is-locked'))return;
    const id=el.dataset.role;
    const idx=this.roles.findIndex(r=>r.id===id);
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){
      e.preventDefault();
      const next=Deck.clamp(idx+(e.key==='ArrowDown'?1:-1),0,this.roles.length-1);
      this.state.selected=this.roles[next].id;
      this.showStatus(`目标行：${this.roles[next].part}。按 Enter 接入。`);
      this.querySelector(`[data-slot="${this.roles[next].id}"]`).classList.add('is-target');
      setTimeout(()=>this.querySelector(`[data-slot="${this.roles[next].id}"]`)?.classList.remove('is-target'),500);
    }
    if(e.key==='Enter'||e.key===' '){e.preventDefault();this.tryConnect(id,this.state.selected||id,el);}
  }
  dragStarted(event,el){
    if(el.classList.contains('is-locked'))return;
    this.start();
    el.classList.add('is-dragging');
    this.state.selected=el.dataset.role;
  }
  dragged(event,el){
    if(el.classList.contains('is-locked'))return;
    const x=(el.__dragX||0)+event.dx;
    const y=(el.__dragY||0)+event.dy;
    el.__dragX=x;el.__dragY=y;
    el.style.transform=`translate(${x}px,${y}px)`;
    const slot=this.hitSlot(el);
    this.querySelectorAll('.drop-slot').forEach(s=>s.classList.toggle('is-target',s===slot));
  }
  dropped(event,el){
    if(el.classList.contains('is-locked'))return;
    el.classList.remove('is-dragging');
    this.querySelectorAll('.drop-slot').forEach(s=>s.classList.remove('is-target'));
    const slot=this.hitSlot(el);
    this.tryConnect(el.dataset.role,slot?slot.dataset.slot:null,el);
  }
  hitSlot(el){
    const r=el.getBoundingClientRect();
    const cx=r.left+r.width/2,cy=r.top+r.height/2;
    return Array.from(this.querySelectorAll('.drop-slot')).find(s=>{const q=s.getBoundingClientRect();return cx>=q.left&&cx<=q.right&&cy>=q.top&&cy<=q.bottom;})||null;
  }
  tryConnect(roleId,targetId,el){
    const role=this.roles.find(r=>r.id===roleId);
    if(roleId===targetId){
      if(!this.state.connected.includes(roleId)){
        this.state.connected.push(roleId);
        this.state.trace.push({action:'connect',role:roleId});
      }
      this.lockRole(el,roleId);
      this.showStatus(`${role.part}已接通：知识由${role.network}共同持有。`);
      this.dispatchEvent(new CustomEvent('game-progress',{bubbles:true,composed:true,detail:{state:this.getState(),action:'connect',metrics:{connected:this.connectedCount(),total:this.roles.length}}}));
      if(this.connectedCount()===this.roles.length)this.complete();
    }else{
      const target=this.roles.find(r=>r.id===targetId);
      el.classList.add('is-wrong');
      el.style.transform='';el.__dragX=0;el.__dragY=0;
      const cue=target?`${role.part}不需要${target.network}：找${role.network}。`:`${role.network}应接到“${role.part}”。`;
      this.showStatus(cue);
      setTimeout(()=>el.classList.remove('is-wrong'),420);
    }
    this.state.selected=null;
    this.update();
  }
  lockRole(el,id){
    const slot=this.querySelector(`[data-slot="${id}"]`);
    const sr=slot.getBoundingClientRect();
    const er=el.getBoundingClientRect();
    const tx=(sr.left-er.left)/Deck.s;
    const ty=(sr.top-er.top)/Deck.s;
    el.__dragX=(el.__dragX||0)+tx;el.__dragY=(el.__dragY||0)+ty;
    el.style.transform=`translate(${el.__dragX}px,${el.__dragY}px)`;
    el.classList.add('is-locked');el.setAttribute('aria-disabled','true');el.tabIndex=-1;
    slot.classList.add('is-filled');slot.textContent='';slot.setAttribute('aria-label','知识已接入');
  }
  complete(){
    this.state.complete=true;
    this.board.classList.add('is-complete');
    this.showStatus('六条知识支流已经汇合。简单成品来自协作系统，而不是一个全知的人。');
    this.dispatchEvent(new CustomEvent('game-complete',{bubbles:true,composed:true,detail:{score:this.connectedCount(),metrics:{connected:this.connectedCount(),total:this.roles.length},trace:[...this.state.trace]}}));
  }
  showStatus(text){
    this.status.textContent=text;
    this.status.classList.add('is-visible');
  }
  update(){
    const count=this.connectedCount(),total=this.roles.length;
    this.querySelectorAll('.progress-cell').forEach((el,i)=>el.classList.toggle('is-on',i<count));
    this.querySelector('.progress-read').textContent=`知识连接 ${count} / ${total}`;
    this.querySelector('.reset-btn').classList.toggle('is-visible',this.state.complete);
    if(this.state.complete)this.board.classList.add('is-complete');
    this.drawLinks();
  }
  drawLinks(){
    if(!this.board)return;
    const svg=this.querySelector('.link-layer');
    const vb={w:1180,h:560};
    const br=this.board.getBoundingClientRect();
    const sx=vb.w/br.width,sy=vb.h/br.height;
    const pencil=this.querySelector('.pencil-wood').getBoundingClientRect();
    const join={x:(pencil.left-br.left+pencil.width*.72)*sx,y:(pencil.top-br.top+pencil.height/2)*sy};
    const data=this.state.connected.map(id=>{
      const role=this.querySelector(`[data-role="${id}"]`).getBoundingClientRect();
      const dim=this.querySelector(`[data-part="${id}"]`).getBoundingClientRect();
      return {id,source:{x:(role.left-br.left)*sx,y:(role.top-br.top+role.height/2)*sy},target:{x:(dim.right-br.left-8)*sx,y:(dim.top-br.top+dim.height/2)*sy}};
    });
    const link=d3.linkHorizontal().x(d=>d.x).y(d=>d.y);
    const g=d3.select(svg).select('.links');
    g.selectAll('path.branch').data(data,d=>d.id).join(enter=>enter.append('path').attr('class','dep-link branch is-current').attr('d',d=>link(d)).each(function(){const len=this.getTotalLength();d3.select(this).attr('stroke-dasharray',len).attr('stroke-dashoffset',Deck.reduced()?0:len).transition().duration(320).attr('stroke-dashoffset',0).on('end',function(){d3.select(this).classed('is-current',false);});}),update=>update.attr('d',d=>link(d)),exit=>exit.remove());
    const mergeData=this.state.complete?data.map(d=>({id:d.id,source:d.target,target:join})):[];
    g.selectAll('path.merge').data(mergeData,d=>d.id).join(enter=>enter.append('path').attr('class','dep-link merge is-current').attr('d',d=>link(d)).each(function(){const len=this.getTotalLength();d3.select(this).attr('stroke-dasharray',len).attr('stroke-dashoffset',Deck.reduced()?0:len).transition().duration(360).attr('stroke-dashoffset',0).on('end',function(){d3.select(this).classed('is-current',false);});}),update=>update.attr('d',d=>link(d)),exit=>exit.remove());
  }
}
customElements.define('pencil-network-game',PencilNetworkGame);
document.getElementById('main').appendChild(document.createElement('pencil-network-game'));
</script>
</body>
</html>
