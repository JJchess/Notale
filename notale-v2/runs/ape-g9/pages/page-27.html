let completed=new Set(),taskIndex=0,home={x:445,y:20},feedbackTimer;function currentLane(){return lanes[taskIndex]||null}function setBeacon(x,y,animate=false){beacon.interrupt().transition().duration(animate&&!Deck.reduced()?240:0).attr("transform",`translate(${x},${y})`)}function render(){const active=currentLane();beacon.select(".beacon-label").text(active?"待追踪："+active.task:"五套系统已接通");beacon.style("display",active?null:"none");d3.selectAll(".lane-band").classed("is-complete",d=>completed.has(d.id));linkPath.classed("is-lit",d=>completed.has(d.lane));sourceNodes.select(".node-frame").classed("is-lit",d=>completed.has(d.lane));provideNodes.select(".node-frame").classed("is-lit",d=>completed.has(d.lane));document.querySelectorAll(".status-track .it").forEach(el=>el.classList.toggle("is-complete",completed.has(el.dataset.lane)));document.getElementById("count").textContent=completed.size+" / "+lanes.length;const ready=completed.size===lanes.length;document.getElementById("system-state").textContent=ready?"系统就绪":"等待接通";mission.select(".mission-state").text(ready?"系统就绪":"等待系统");mission.select(".mission-ring").attr("stroke",ready?"var(--accent)":"var(--primary-bright)").attr("stroke-dasharray",`${completed.size*140} 704`);mission.transition().duration(ready&&!Deck.reduced()?420:0).attr("transform",ready?"translate(1088,204)":"translate(1088,218)");setBeacon(home.x,home.y,false)}
function showError(laneId){const active=currentLane(),actual=lanes.find(l=>l.id===laneId),fb=document.getElementById("feedback");fb.textContent=actual&&active?"这项贡献属于另一套系统：沿“+actual.name+”同色泳道追踪。":"把信标放到上游实例照片节点。";fb.classList.add("is-visible");const band=laneId?svg.select(`.lane[data-lane='${laneId}'] .lane-band`):null;if(band&&!Deck.reduced())band.classed("is-error",true).transition().duration(70).attr("transform","translate(8,0)").transition().attr("transform","translate(-8,0)").transition().attr("transform",null).on("end",()=>band.classed("is-error",false));clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>fb.classList.remove("is-visible"),2000);setBeacon(home.x,home.y,true)}
function connect(laneId){const active=currentLane();if(!active||laneId!==active.id){showError(laneId);return}completed.add(laneId);if(Deck.reduced()){taskIndex++;render();return}linkPath.filter(d=>d.lane===laneId).classed("is-lit",true).attr("stroke-dasharray",function(){return this.getTotalLength()}).attr("stroke-dashoffset",function(){return this.getTotalLength()}).transition().duration(520).delay(d=>d.part*420).attr("stroke-dashoffset",0).on("end",(e,d)=>{if(d.part===1){taskIndex++;render()}})}
sourceNodes.on("click",(event,d)=>connect(d.lane)).on("keydown",(event,d)=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();connect(d.lane)}});beacon.call(d3.drag().on("start",()=>beacon.select(".beacon-ring").style("cursor","grabbing")).on("drag",event=>setBeacon(event.x,event.y,false)).on("end",event=>{beacon.select(".beacon-ring").style("cursor","grab");const nearest=nodes.filter(n=>n.kind==="source").map(n=>({n,dist:Math.hypot(event.x-n.x,event.y-n.y)})).sort((a,b)=>a.dist-b.dist)[0];if(nearest&&nearest.dist<92)connect(nearest.n.lane);else showError(null)}));beacon.on("keydown",event=>{if((event.key==="Enter"||event.key===" ")&&currentLane()){event.preventDefault();connect(currentLane().id)}});document.getElementById("reset").addEventListener("click",()=>{completed.clear();taskIndex=0;clearTimeout(feedbackTimer);document.getElementById("feedback").classList.remove("is-visible");render()});render();
