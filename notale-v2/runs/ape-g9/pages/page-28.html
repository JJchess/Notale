<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .audit-page {
    --owner-individual: #f2f4ef;
    --owner-culture: #35c6b4;
    --owner-system: #ffcc4d;
    display: flex;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
  }

  .audit-game.k-generalization {
    position: relative;
    display: grid;
    grid-template-columns: 172px minmax(0, 1fr);
    grid-template-rows: 52px minmax(0, 1fr) 92px;
    gap: 0 var(--sp-5);
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    border: var(--border);
    border-radius: var(--radius-3);
    background: var(--surface-glass);
    box-shadow: var(--shadow-panel);
  }

  .system-wiring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .system-wiring .wire {
    fill: none;
    stroke: var(--primary-dark);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  .system-wiring .wire-branch {
    fill: none;
    stroke: var(--primary);
    stroke-width: 1;
    stroke-dasharray: 7 8;
    vector-effect: non-scaling-stroke;
  }

  .system-wiring .wire-end {
    fill: var(--surface-1);
    stroke: var(--primary);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  .actor-map,
  .ledger-head,
  .supports,
  .claim,
  .stamp-controls,
  .feedback { z-index: 1; }

  .actor-map {
    grid-column: 1;
    grid-row: 1 / 4;
    position: relative;
    min-width: 0;
    overflow: hidden;
    border-right: var(--border);
    background: var(--surface-teal);
  }

  .actor-label {
    position: absolute;
    top: var(--sp-4);
    left: var(--sp-4);
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 700;
    line-height: 1.35;
  }

  .figure {
    position: absolute;
    top: 92px;
    left: 45px;
    width: 58px;
    height: 180px;
    opacity: .72;
  }

  .figure-head {
    position: absolute;
    top: 0;
    left: 17px;
    width: 24px;
    height: 24px;
    border: 2px solid var(--owner-individual);
    border-radius: 50%;
  }

  .figure-body {
    position: absolute;
    top: 29px;
    left: 13px;
    width: 30px;
    height: 76px;
    border: 2px solid var(--owner-individual);
    border-radius: 48% 48% var(--radius-2) var(--radius-2);
  }

  .figure-limb {
    position: absolute;
    width: 2px;
    height: 78px;
    background: var(--owner-individual);
    transform-origin: top;
  }

  .figure-limb.arm-a { top: 38px; left: 13px; transform: rotate(18deg); }
  .figure-limb.arm-b { top: 38px; right: 13px; transform: rotate(-18deg); }
  .figure-limb.leg-a { top: 102px; left: 25px; transform: rotate(8deg); }
  .figure-limb.leg-b { top: 102px; right: 25px; transform: rotate(-8deg); }

  .layer-ring {
    position: absolute;
    left: 28px;
    border: 1px solid var(--primary-dark);
    border-radius: 50%;
  }

  .layer-ring.one { top: 76px; width: 110px; height: 224px; }
  .layer-ring.two { top: 56px; left: 18px; width: 132px; height: 266px; border-color: var(--primary); }
  .layer-ring.three { top: 36px; left: 8px; width: 154px; height: 308px; border-color: var(--line-strong); }

  .layer-key {
    position: absolute;
    right: var(--sp-3);
    bottom: 86px;
    left: var(--sp-3);
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .layer-key span {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
  }

  .layer-key i {
    width: 14px;
    height: 2px;
    flex: 0 0 14px;
    background: var(--primary);
  }

  .ledger-head {
    grid-column: 2;
    grid-row: 1;
    display: grid;
    grid-template-columns: 1.16fr .8fr 1.42fr 154px 112px;
    align-items: center;
    gap: var(--sp-3);
    min-width: 0;
    padding: 0 var(--sp-4);
    border-bottom: 2px solid var(--line-strong);
    color: var(--text-muted);
    font-size: var(--fs-label);
    font-weight: 700;
    line-height: 1.35;
  }

  .audit-progress {
    justify-self: end;
    color: var(--primary-bright);
    font-family: var(--font-mono);
    white-space: nowrap;
  }

  .audit-progress b { color: var(--accent); }

  .audit-game.k-generalization > .supports {
    grid-column: 2;
    grid-row: 2;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 0;
    min-width: 0;
    min-height: 0;
    padding: 0;
  }

  .audit-game.k-generalization > .supports::before { display: none; }

  .audit-game.k-generalization .support {
    position: relative;
    display: grid;
    grid-template-columns: 1.16fr .8fr 1.42fr 154px 112px;
    align-items: center;
    flex: 1 1 0;
    gap: var(--sp-3);
    min-width: 0;
    min-height: 0;
    padding: var(--sp-2) var(--sp-4);
    margin: var(--sp-1) 0;
    border: var(--border);
    border-left: 3px solid var(--primary-dark);
    border-radius: var(--radius-2);
    background: var(--surface-1);
    transition: background 160ms ease, box-shadow 160ms ease;
  }

  .audit-game.k-generalization .support::before { display: none; }

  .support.is-current {
    background: var(--surface-yellow);
    box-shadow: inset 4px 0 0 var(--accent);
  }

  .support.is-complete { background: rgba(53, 198, 180, .055); }

  .support-cell {
    min-width: 0;
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
  }

  .support-cell.item {
    color: var(--text-strong);
    font-size: var(--fs-body);
    font-weight: 700;
  }

  .owner-slot {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    min-width: 0;
    min-height: 40px;
  }

  .owner-stamp {
    display: inline-flex;
    align-items: center;
    min-height: 32px;
    padding: var(--sp-1) var(--sp-3);
    border: 2px solid currentColor;
    border-radius: var(--radius-2);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 700;
    line-height: 1.35;
    white-space: nowrap;
    transform: rotate(-1deg);
  }

  .owner-stamp[data-owner="culture"] { color: var(--owner-culture); }
  .owner-stamp[data-owner="system"] { color: var(--owner-system); }

  .flow-node {
    position: relative;
    align-self: stretch;
    min-height: 0;
  }

  .flow-node::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 2px;
    background: var(--line-strong);
    transform: translateX(-50%);
  }

  .flow-node::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 9px;
    height: 9px;
    border: 2px solid var(--text-faint);
    border-radius: 50%;
    background: var(--surface-1);
    transform: translate(-50%, -50%);
  }

  .support.is-current .flow-node::before { background: var(--accent); }
  .support.is-current .flow-node::after { border-color: var(--accent); }
  .support.is-complete .flow-node::before { background: var(--primary); }
  .support.is-complete .flow-node::after { border-color: var(--primary-bright); background: var(--primary-dark); }

  .audit-game.k-generalization > .trunk {
    grid-column: 2;
    grid-row: 2 / 4;
    position: absolute;
    top: 0;
    right: 57px;
    bottom: 44px;
    left: auto;
    width: 2px;
    background: var(--primary-dark);
    transform: none;
    pointer-events: none;
  }

  .audit-game.k-generalization > .claim {
    grid-column: 2;
    grid-row: 3;
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: var(--sp-5);
    min-width: 0;
    margin: var(--sp-3) var(--sp-4) var(--sp-4) 0;
    padding: var(--sp-3) var(--sp-4);
    border: 1px solid var(--line-strong);
    border-left: 6px solid var(--accent);
    background: var(--surface-yellow);
    font-size: var(--fs-lead);
  }

  .claim-ledger {
    display: flex;
    align-items: baseline;
    gap: var(--sp-5);
    min-width: 0;
  }

  .claim-ledger span { color: var(--text-muted); font-size: var(--fs-sec); font-weight: 600; }
  .claim-ledger strong { color: var(--text-strong); font-size: var(--fs-lead); }
  .claim-ledger .system-owner { color: var(--accent); }

  .claim-core {
    display: none;
    color: var(--text-strong);
    font-size: var(--fs-lead);
    font-weight: 700;
    line-height: var(--lh-copy);
  }

  .audit-game.is-finished .claim-ledger { display: none; }
  .audit-game.is-finished .claim-core { display: block; }

  .stamp-controls {
    position: absolute;
    right: var(--sp-7);
    bottom: 106px;
    left: 172px;
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    min-width: 0;
    pointer-events: none;
    transform: translateY(100%);
  }

  .stamp-controls > * { pointer-events: auto; }

  .stamp-prompt {
    margin-right: auto;
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
  }

  .owner-choice {
    min-width: 126px;
    background: var(--surface-2);
  }

  .owner-choice[data-owner="individual"] { color: var(--owner-individual); }
  .owner-choice[data-owner="culture"] { color: var(--owner-culture); }
  .owner-choice[data-owner="system"] { color: var(--owner-system); }
  .owner-choice.is-picked { border-color: currentColor; box-shadow: inset 0 -3px 0 currentColor; }

  .reset-btn {
    display: none;
    min-width: 48px;
    color: var(--accent);
    font-size: var(--fs-body);
  }

  .audit-game.is-finished .owner-choice,
  .audit-game.is-finished .stamp-prompt { display: none; }
  .audit-game.is-finished .reset-btn { display: inline-flex; }

  .lec-progress {
    overflow: visible;
  }

  .feedback {
    position: absolute;
    right: var(--sp-5);
    bottom: 0;
    left: 172px;
    min-height: 24px;
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
  }

  .feedback.is-error { color: var(--danger); }
  .feedback.is-success { color: var(--primary-bright); }

  .support.is-error { animation: row-shake 220ms ease-in-out 2; }
  .support.is-error .flow-node::before,
  .support.is-error .flow-node::after { background: var(--danger); border-color: var(--danger); }

  @keyframes row-shake {
    0%, 100% { transform: translateX(0); }
    35% { transform: translateX(-5px); }
    70% { transform: translateX(5px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .audit-game *, .audit-game *::before, .audit-game *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body data-page="28" data-total="52">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Lec.mount({index: 28, kicker: 'CAPABILITY AUDIT', title: '谁在“飞向太空”？', take: '“人类会飞向太空”描述的是协作系统能力，不是裸身个体能力。'});

  const main = document.getElementById('main');
  main.innerHTML = `
    <section class="audit-page min0" aria-label="能力归属审计">
      <div class="audit-game k-generalization min0" id="auditGame">
        <svg class="system-wiring" viewBox="0 0 1408 620" preserveAspectRatio="none" aria-hidden="true">
          <path class="wire" d="M82 302 C180 302 214 78 382 78 H1290 V542 H382 C214 542 180 318 82 318"/>
          <path class="wire-branch" d="M108 248 C260 248 292 154 474 154 H1290"/>
          <path class="wire-branch" d="M116 310 H1290"/>
          <path class="wire-branch" d="M108 372 C260 372 292 466 474 466 H1290"/>
          <circle class="wire-end" cx="1290" cy="154" r="6"/>
          <circle class="wire-end" cx="1290" cy="310" r="6"/>
          <circle class="wire-end" cx="1290" cy="466" r="6"/>
        </svg>
        <aside class="actor-map min0" aria-label="个人外部的三层支撑">
          <div class="actor-label">台前行动者</div>
          <div class="layer-ring one" aria-hidden="true"></div>
          <div class="layer-ring two" aria-hidden="true"></div>
          <div class="layer-ring three" aria-hidden="true"></div>
          <div class="figure" aria-hidden="true">
            <i class="figure-head"></i><i class="figure-body"></i>
            <i class="figure-limb arm-a"></i><i class="figure-limb arm-b"></i>
            <i class="figure-limb leg-a"></i><i class="figure-limb leg-b"></i>
          </div>
          <div class="layer-key" aria-hidden="true">
            <span><i></i>知识</span><span><i></i>器物</span><span><i></i>组织</span>
          </div>
        </aside>

        <div class="ledger-head min0">
          <span>能力账目</span><span>台前行动者</span><span>使能力成立的依赖</span><span>审计归属</span>
          <span class="audit-progress" aria-live="polite">已审计 <b id="doneCount">0</b>/4</span>
        </div>

        <div class="trunk" aria-hidden="true"></div>
        <div class="supports min0" id="supports">
          <article class="support is-current min0" data-answer="culture" aria-current="step">
            <div class="support-cell item">读懂专业符号并按程序操作</div>
            <div class="support-cell">一名受训者</div>
            <div class="support-cell">跨代积累的语言、知识与训练</div>
            <div class="owner-slot" aria-label="尚未归属"></div><div class="flow-node" aria-hidden="true"></div>
          </article>
          <article class="support min0" data-answer="system">
            <div class="support-cell item">形成可执行方案</div>
            <div class="support-cell">专业团队</div>
            <div class="support-cell">前人成果、不同专长与共同校验</div>
            <div class="owner-slot" aria-label="尚未归属"></div><div class="flow-node" aria-hidden="true"></div>
          </article>
          <article class="support min0" data-answer="system">
            <div class="support-cell item">制造并交付复杂设备</div>
            <div class="support-cell">工厂与供应者</div>
            <div class="support-cell">材料、工具、能源和分布式知识</div>
            <div class="owner-slot" aria-label="尚未归属"></div><div class="flow-node" aria-hidden="true"></div>
          </article>
          <article class="support min0" data-answer="system">
            <div class="support-cell item">完成一次载人发射</div>
            <div class="support-cell">乘员与任务团队</div>
            <div class="support-cell">设备、基础设施、规则与多人协调</div>
            <div class="owner-slot" aria-label="尚未归属"></div><div class="flow-node" aria-hidden="true"></div>
          </article>
        </div>

        <div class="claim min0" aria-live="polite">
          <div class="claim-ledger min0">
            <span>可见主语</span><strong>人类</strong>
            <span>能力所有者</span><strong class="system-owner">跨人、跨代的协作系统</strong>
          </div>
          <div class="claim-core">“人类会飞向太空”中的“人类”，是一个能够继承、分工并协调的系统。</div>
        </div>

        <div class="stamp-controls ctl min0" aria-label="归属印章">
          <span class="stamp-prompt">为黄色标出的当前账目选择归属</span>
          <button class="choice owner-choice" type="button" data-owner="individual">个人独有</button>
          <button class="choice owner-choice" type="button" data-owner="culture">文化支撑</button>
          <button class="choice owner-choice" type="button" data-owner="system">协作系统</button>
          <button class="btn icon-only reset-btn" id="resetAudit" type="button" aria-label="重置能力审计" title="重置能力审计">↶</button>
        </div>
        <p class="feedback" id="feedback" aria-live="assertive">个人确实在判断和行动；请审计使第一项行动成为可能的依赖。</p>
      </div>
    </section>`;

  const game = document.getElementById('auditGame');
  const rows = Array.from(game.querySelectorAll('.support'));
  const choices = Array.from(game.querySelectorAll('.owner-choice'));
  const count = document.getElementById('doneCount');
  const feedback = document.getElementById('feedback');
  const labels = { individual: '个人独有', culture: '文化支撑', system: '协作系统' };
  let current = 0;
  let locked = false;

  function setFeedback(text, type) {
    feedback.textContent = text;
    feedback.className = 'feedback' + (type ? ' is-' + type : '');
  }

  function chooseOwner(owner) {
    if (locked || current >= rows.length) return;
    const row = rows[current];
    choices.forEach(button => button.classList.toggle('is-picked', button.dataset.owner === owner));

    if (owner !== row.dataset.answer) {
      row.classList.remove('is-error');
      void row.offsetWidth;
      row.classList.add('is-error');
      const message = current === 0
        ? '会操作不等于独自创造了符号与训练。'
        : '台前有人执行，但缺少多人和跨代支撑，这项能力不能成立。';
      setFeedback(message, 'error');
      window.setTimeout(() => row.classList.remove('is-error'), Deck.reduced() ? 0 : 520);
      return;
    }

    locked = true;
    const slot = row.querySelector('.owner-slot');
    slot.innerHTML = '<span class="owner-stamp" data-owner="' + owner + '">' + labels[owner] + '</span>';
    slot.setAttribute('aria-label', '正确归属：' + labels[owner]);
    row.classList.remove('is-current');
    row.removeAttribute('aria-current');
    row.classList.add('is-complete');
    current += 1;
    count.textContent = String(current);
    choices.forEach(button => button.classList.remove('is-picked'));

    if (current === rows.length) {
      game.classList.add('is-finished');
      setFeedback('个人在行动；知识、器物与组织并不装在一个人身上。', 'success');
      document.getElementById('resetAudit').focus();
    } else {
      rows[current].classList.add('is-current');
      rows[current].setAttribute('aria-current', 'step');
      setFeedback('归属成立。沿青色汇流线继续审计下一项。', 'success');
    }
    locked = false;
  }

  function resetAudit() {
    current = 0;
    locked = false;
    count.textContent = '0';
    game.classList.remove('is-finished');
    rows.forEach((row, index) => {
      row.classList.remove('is-current', 'is-complete', 'is-error');
      row.removeAttribute('aria-current');
      row.querySelector('.owner-slot').innerHTML = '';
      row.querySelector('.owner-slot').setAttribute('aria-label', '尚未归属');
      if (index === 0) {
        row.classList.add('is-current');
        row.setAttribute('aria-current', 'step');
      }
    });
    setFeedback('个人确实在判断和行动；请审计使第一项行动成为可能的依赖.', '');
    choices[0].focus();
  }

  choices.forEach(button => button.addEventListener('click', () => chooseOwner(button.dataset.owner)));
  document.getElementById('resetAudit').addEventListener('click', resetAudit);
</script>
</body>
</html>
