rail.addEventListener('input',()=>{target=Number(rail.value);currentStop=nearestStop(target);if(Deck.reduced()){current=target;renderNow()}});rail.addEventListener('change',snap);rail.addEventListener('pointerup',snap);
function showMisconception(){const msg=document.getElementById('misconception');msg.classList.add('is-visible','shake');setTimeout(()=>msg.classList.remove('shake'),360);setTimeout(()=>msg.classList.remove('is-visible'),2600)}renderer.domElement.addEventListener('click',showMisconception);renderer.domElement.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showMisconception()}});
document.getElementById('resetBtn').addEventListener('click',()=>{seen=new Set([0]);completionQueued=false;currentStop=0;target=0;current=0;rail.value=0;document.getElementById('complete').classList.remove('is-visible');updateStops();renderNow()});
cameraFor(0);updateStops();renderNow();Deck.loop((t,dt)=>{if(!Deck.reduced()){current+=(target-current)*Math.min(1,dt*5.5);earth.rotation.y+=dt*.025;renderNow()}},{still:1});
</script>
</body>
