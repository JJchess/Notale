<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .p31-shell {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    gap: var(--sp-3);
  }

  .mass-control {
    display: grid;
    grid-template-columns: 180px 56px minmax(0, 1fr) 56px 116px 48px;
    align-items: center;
    gap: var(--sp-2) var(--sp-3);
    min-height: 92px;
    box-sizing: border-box;
    padding: var(--sp-3) var(--sp-4);
    border: var(--border);
    border-left: 4px solid var(--primary);
    border-radius: var(--radius-3);
    background: var(--surface-glass);
  }

  .mass-control .control-title {
    color: var(--text-strong);
    font-family: var(--font-narrow);
    font-size: var(--fs-h2);
    font-weight: 700;
    line-height: 1.3;
  }

  .mass-control .mass-value {
    color: var(--primary-bright);
    font-family: var(--font-mono);
    font-size: var(--fs-lead);
    font-weight: 700;
    text-align: right;
    white-space: nowrap;
  }

  .mass-control .btn {
    padding: 0;
    font-size: var(--fs-h2);
  }

  .mass-control input[type="range"] {
    min-width: 0;
  }

  .range-limits {
    grid-column: 3;
    display: flex;
    justify-content: space-between;
    margin-top: -8px;
    color: var(--text-faint);
    font-family: var(--font-mono);
    font-size: var(--fs-tick);
    line-height: 1.35;
  }

  .destinations {
    flex: 1 1 0;
    min-height: 0;
  }

  .destinations > .box {
    display: flex;
    flex: 1 1 0;
    flex-direction: column;
    min-height: 0;
    padding: var(--sp-3);
  }

  .destinations > .box > .bt {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: calc(-1 * var(--sp-3)) calc(-1 * var(--sp-3)) var(--sp-3);
    padding: var(--sp-2) var(--sp-4);
  }

  .class-label {
    color: var(--text-muted);
    font-family: var(--font-sans);
    font-size: var(--fs-label);
    font-weight: 600;
  }

  .branch-row {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    flex: 1 1 0;
    min-height: 0;
    gap: var(--sp-3);
  }

  .branch-map {
    position: absolute;
    top: -48px;
    right: 0;
    bottom: -34px;
    left: 0;
    width: 100%;
    height: calc(100% + 82px);
    pointer-events: none;
    z-index: 0;
  }

  .branch-map .trunk,
  .branch-map .branch {
    fill: none;
    stroke: var(--primary-dark);
    stroke-width: 2;
  }

  .branch-map .load-band {
    fill: var(--surface-yellow);
    stroke: var(--accent);
    stroke-width: 2;
  }

  .branch-row > .lv {
    z-index: 1;
    display: flex;
    min-width: 0;
    min-height: 0;
    margin-left: 0;
    padding-left: var(--sp-3);
  }

  .branch-row > .lv::before {
    top: 19px;
    width: var(--sp-2);
  }

  .destination {
    display: grid;
    grid-template-rows: 42px minmax(104px, 1fr) 48px 48px 48px 42px;
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;
    padding: var(--sp-3);
    border-left-width: 3px;
    background: var(--surface-1);
  }

  .destination > .bt {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: calc(-1 * var(--sp-3)) calc(-1 * var(--sp-3)) 0;
    padding: var(--sp-2) var(--sp-3);
    font-size: var(--fs-h2);
  }

  .world-mark {
    display: inline-flex;
    align-items: center;
    gap: var(--sp-2);
    color: var(--text-muted);
    font-family: var(--font-sans);
    font-size: var(--fs-label);
    font-weight: 600;
  }

  .world-dot,
  .progress-dot {
    width: 12px;
    height: 12px;
    box-sizing: border-box;
    border: 2px solid var(--line-strong);
    border-radius: 50%;
    background: var(--surface-3);
  }

  .destination.is-seen .progress-dot {
    border-color: var(--primary-bright);
    background: var(--primary);
  }

  .body-scale {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    min-height: 0;
    overflow: hidden;
    border-bottom: 2px solid var(--line-strong);
  }

  .human {
    position: relative;
    width: 32px;
    height: 56px;
    margin-bottom: 7px;
    opacity: .72;
  }

  .human::before {
    content: "";
    position: absolute;
    top: 0;
    left: 9px;
    width: 14px;
    height: 14px;
    border: 2px solid var(--primary-bright);
    border-radius: 50%;
    background: var(--surface-teal);
  }

  .human::after {
    content: "";
    position: absolute;
    top: 17px;
    left: 5px;
    width: 22px;
    height: 35px;
    border: 2px solid var(--primary-bright);
    border-radius: var(--radius-3) var(--radius-3) var(--radius-1) var(--radius-1);
    background: var(--surface-teal);
    box-shadow: -9px 11px 0 -7px var(--primary-bright), 9px 11px 0 -7px var(--primary-bright);
  }

  .scale-bed {
    position: absolute;
    right: 18%;
    bottom: 0;
    left: 18%;
    height: calc(8px + var(--compression, 0) * 14px);
    border-top: 4px solid var(--accent);
    background: var(--surface-yellow);
    transition: height 180ms ease;
  }

  .constraint-line {
    position: absolute;
    top: 5px;
    left: 50%;
    width: 3px;
    height: calc(10px + var(--load, 0) * 39px);
    background: var(--accent);
    transform: translateX(-50%);
    transform-origin: top;
    transition: height 180ms ease;
  }

  .constraint-line::after {
    content: "";
    position: absolute;
    bottom: -1px;
    left: 50%;
    width: 8px;
    height: 8px;
    border-right: 3px solid var(--accent);
    border-bottom: 3px solid var(--accent);
    transform: translateX(-50%) rotate(45deg);
  }

  .metric-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    min-width: 0;
    border-bottom: var(--border);
  }

  .metric-label {
    color: var(--text-muted);
    font-size: var(--fs-label);
    font-weight: 600;
    line-height: 1.35;
  }

  .metric-value {
    color: var(--primary-bright);
    font-family: var(--font-mono);
    font-size: var(--fs-sec);
    font-weight: 700;
    line-height: 1.45;
    white-space: nowrap;
  }

  .mass-copy {
    cursor: ew-resize;
  }

  .weight-value {
    color: var(--accent);
    font-size: var(--fs-lead);
  }

  .load-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-2);
    color: var(--text-strong);
    font-size: var(--fs-sec);
    font-weight: 700;
    line-height: 1.45;
  }

  .load-row .relative {
    color: var(--accent);
    font-family: var(--font-mono);
    white-space: nowrap;
  }

  .shared-mass-line {
    position: relative;
    height: 22px;
    margin: 0 var(--sp-4);
  }

  .shared-mass-line::before {
    content: "";
    position: absolute;
    top: 9px;
    right: 0;
    left: 0;
    height: 3px;
    background: var(--primary);
  }

  .shared-mass-line span {
    position: absolute;
    top: 0;
    left: 50%;
    padding: 0 var(--sp-3);
    color: var(--primary-bright);
    font-size: var(--fs-label);
    font-weight: 700;
    line-height: 1.45;
    background: var(--surface-1);
    transform: translateX(-50%);
    white-space: nowrap;
  }

  .closing-row {
    display: grid;
    grid-template-columns: 235px minmax(0, 1fr);
    align-items: center;
    gap: var(--sp-4);
    min-height: 52px;
  }

  .compare-status {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: 1.45;
    white-space: nowrap;
  }

  .progress-dots {
    display: inline-flex;
    gap: var(--sp-1);
  }

  .compare-status.is-complete {
    color: var(--primary-bright);
  }

  .conclusion {
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: 1.45;
  }

  .conclusion strong {
    color: var(--text-strong);
    font-size: var(--fs-lead);
  }

  .feedback {
    grid-column: 1 / -1;
    min-height: 24px;
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: 1.45;
  }

  .feedback.is-visible {
    color: var(--accent);
  }

  .load-meter {
    position: relative;
    height: 8px;
    overflow: hidden;
    border-radius: var(--radius-1);
    background: var(--surface-3);
  }

  .load-meter::before {
    content: "";
    display: block;
    width: calc(var(--load, 0) * 100%);
    height: 100%;
    background: var(--accent);
  }

  .lec-progress {
    overflow: visible;
  }

  .mass-copy.is-error {
    animation: p31-shake 260ms ease;
    color: var(--accent);
  }

  .weight-value.is-flash {
    animation: p31-flash 420ms ease;
  }

  @keyframes p31-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  @keyframes p31-flash {
    0%, 100% { text-shadow: none; }
    45% { text-shadow: 0 0 18px var(--accent); }
  }

  @media (prefers-reduced-motion: reduce) {
    .scale-bed,
    .constraint-line { transition: none; }
    .mass-copy.is-error,
    .weight-value.is-flash { animation: none; }
  }
</style>
</head>
<body data-page="31" data-total="52">
<div id="stage">
<main id="main">
  <section class="p31-shell min0" aria-label="三个目的地的重力秤">
    <div class="mass-control min0">
      <div>
        <div class="control-title">同一个人</div>
        <div class="fs-label muted">质量横跨三个目的地</div>
      </div>
      <button id="massDown" class="btn icon-only" type="button" aria-label="质量减少一千克" title="质量减少一千克">−</button>
      <input id="massRange" type="range" aria-label="同一个人的质量">
      <button id="massUp" class="btn icon-only" type="button" aria-label="质量增加一千克" title="质量增加一千克">＋</button>
      <output id="massOutput" class="mass-value" for="massRange"></output>
      <button id="resetBtn" class="btn icon-only" type="button" aria-label="重置质量与比较进度" title="重置">↺</button>
      <div class="range-limits" aria-hidden="true"><span id="rangeMin"></span><span id="rangeMax"></span></div>
      <div id="feedback" class="feedback" role="status">拖动滑杆或使用步进按钮，三台秤将同步重算。</div>
    </div>

    <div class="k-classification destinations min0">
      <div class="box min0">
        <div class="bt"><span>目的地</span><span class="class-label">同一质量 · 不同当地重力</span></div>
        <div class="branch-row min0">
          <svg class="branch-map" viewBox="0 0 1200 400" preserveAspectRatio="none" aria-hidden="true">
            <path class="trunk" d="M600 0 V62 M190 62 H1010"/>
            <path class="branch" d="M190 62 V400 M600 62 V400 M1010 62 V400"/>
            <rect class="load-band" x="32" y="88" width="356" height="270" rx="8"/>
            <rect class="load-band" x="422" y="88" width="356" height="270" rx="8"/>
            <rect class="load-band" x="812" y="88" width="356" height="270" rx="8"/>
          </svg>
          <div class="lv min0" style="--level:1">
            <section class="box destination min0" data-world="earth">
              <h2 class="bt"><span class="world-mark"><i class="world-dot"></i>地球</span><i class="progress-dot" aria-hidden="true"></i></h2>
              <div class="body-scale" aria-hidden="true"><div class="constraint-line"></div><div class="human"></div><div class="scale-bed"></div></div>
              <div class="metric-row"><span class="metric-label">同一质量</span><span class="metric-value mass-copy"></span></div>
              <div class="metric-row"><span class="metric-label">当地重力</span><span class="metric-value gravity-value"></span></div>
              <div class="metric-row"><span class="metric-label">重量</span><span class="metric-value weight-value"></span></div>
              <div class="load-meter" aria-hidden="true"></div>
              <div class="load-row"><span>基准负荷</span><span class="relative"></span></div>
            </section>
          </div>
          <div class="lv min0" style="--level:1">
            <section class="box destination min0" data-world="moon">
              <h2 class="bt"><span class="world-mark"><i class="world-dot"></i>月球</span><i class="progress-dot" aria-hidden="true"></i></h2>
              <div class="body-scale" aria-hidden="true"><div class="constraint-line"></div><div class="human"></div><div class="scale-bed"></div></div>
              <div class="metric-row"><span class="metric-label">同一质量</span><span class="metric-value mass-copy"></span></div>
              <div class="metric-row"><span class="metric-label">当地重力</span><span class="metric-value gravity-value"></span></div>
              <div class="metric-row"><span class="metric-label">重量</span><span class="metric-value weight-value"></span></div>
              <div class="load-meter" aria-hidden="true"></div>
              <div class="load-row"><span>约六分之一</span><span class="relative"></span></div>
            </section>
          </div>
          <div class="lv min0" style="--level:1">
            <section class="box destination min0" data-world="mars">
              <h2 class="bt"><span class="world-mark"><i class="world-dot"></i>火星</span><i class="progress-dot" aria-hidden="true"></i></h2>
              <div class="body-scale" aria-hidden="true"><div class="constraint-line"></div><div class="human"></div><div class="scale-bed"></div></div>
              <div class="metric-row"><span class="metric-label">同一质量</span><span class="metric-value mass-copy"></span></div>
              <div class="metric-row"><span class="metric-label">当地重力</span><span class="metric-value gravity-value"></span></div>
              <div class="metric-row"><span class="metric-label">重量</span><span class="metric-value weight-value"></span></div>
              <div class="load-meter" aria-hidden="true"></div>
              <div class="load-row"><span>约三分之二以下</span><span class="relative"></span></div>
            </section>
          </div>
        </div>
        <div class="shared-mass-line" aria-hidden="true"><span>质量线：三个 kg 始终相同</span></div>
      </div>
    </div>

    <div class="closing-row min0">
      <div id="compareStatus" class="compare-status" aria-live="polite">
        <span>已比较 <b id="seenCount">0</b> / <b id="worldCount"></b> 个目的地</span>
        <span class="progress-dots" aria-hidden="true"><i class="progress-dot"></i><i class="progress-dot"></i><i class="progress-dot"></i></span>
      </div>
      <p class="conclusion"><strong>换一个世界，人的质量没有改变；</strong>当地重力改变了重量，也改变了身体承受的支撑负荷。</p>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Lec.mount({index:31, kicker:'GRAVITY DESTINATIONS', title:'三个世界，同一副身体', take:'质量不变而重量随当地重力改变，身体负荷也随之改变。'});

  (() => {
    const source = { initialMassKg: 70, minMassKg: 30, maxMassKg: 120, stepMassKg: 1 };
    const range = document.getElementById('massRange');
    const output = document.getElementById('massOutput');
    const destinations = Array.from(document.querySelectorAll('.destination'));
    const status = document.getElementById('compareStatus');
    const statusDots = Array.from(status.querySelectorAll('.progress-dot'));
    const feedback = document.getElementById('feedback');
    let compared = false;
    let feedbackTimer = 0;

    const worlds = {
      earth: { gravity: Lec.K.earthStandardGravityMps2 },
      moon: { gravity: Lec.K.moonSurfaceGravityMps2 },
      mars: { gravity: Lec.K.marsSurfaceGravityMps2 }
    };

    const oneDecimal = value => Lec.P.roundTo(value, 1).toFixed(1);
    const formatMass = value => `${oneDecimal(value)} kg`;

    range.min = String(source.minMassKg);
    range.max = String(source.maxMassKg);
    range.step = String(source.stepMassKg);
    document.getElementById('rangeMin').textContent = `${source.minMassKg} kg`;
    document.getElementById('rangeMax').textContent = `${source.maxMassKg} kg`;
    document.getElementById('worldCount').textContent = String(destinations.length);

    function setProgress(done) {
      compared = done;
      document.getElementById('seenCount').textContent = done ? String(destinations.length) : '0';
      status.classList.toggle('is-complete', done);
      destinations.forEach(destination => destination.classList.toggle('is-seen', done));
      statusDots.forEach(dot => dot.style.background = done ? 'var(--primary)' : '');
    }

    function render(markCompared) {
      const mass = Number(range.value);
      output.value = formatMass(mass);
      output.textContent = formatMass(mass);

      destinations.forEach(destination => {
        const world = worlds[destination.dataset.world];
        const relative = Lec.P.relativeWeight(world.gravity, Lec.K.earthStandardGravityMps2);
        const percentage = Lec.P.percent(relative, 1);
        const weight = Lec.P.weight(mass, world.gravity);
        destination.style.setProperty('--load', String(relative));
        destination.style.setProperty('--compression', String(relative));
        destination.querySelector('.mass-copy').textContent = formatMass(mass);
        destination.querySelector('.gravity-value').textContent = `${oneDecimal(world.gravity)} m/s²`;
        destination.querySelector('.weight-value').textContent = `${oneDecimal(weight)} N`;
        destination.querySelector('.relative').textContent = `${oneDecimal(percentage)}%`;
      });

      if (markCompared) {
        setProgress(true);
        destinations.forEach(destination => {
          const value = destination.querySelector('.weight-value');
          value.classList.remove('is-flash');
          void value.offsetWidth;
          value.classList.add('is-flash');
        });
      }
    }

    function changeMass(delta) {
      const next = Math.max(source.minMassKg, Math.min(source.maxMassKg, Number(range.value) + delta));
      range.value = String(next);
      render(true);
    }

    function showMassHint(target) {
      target.classList.remove('is-error');
      void target.offsetWidth;
      target.classList.add('is-error');
      feedback.textContent = '质量属于这个人；请用上方同一质量控制器。';
      feedback.classList.add('is-visible');
      window.clearTimeout(feedbackTimer);
      feedbackTimer = window.setTimeout(() => {
        feedback.textContent = '拖动滑杆或使用步进按钮，三台秤将同步重算。';
        feedback.classList.remove('is-visible');
      }, 1800);
    }

    range.addEventListener('input', () => render(true));
    document.getElementById('massDown').addEventListener('click', () => changeMass(-source.stepMassKg));
    document.getElementById('massUp').addEventListener('click', () => changeMass(source.stepMassKg));
    document.getElementById('resetBtn').addEventListener('click', () => {
      range.value = String(source.initialMassKg);
      setProgress(false);
      feedback.classList.remove('is-visible');
      render(false);
    });

    document.querySelectorAll('.mass-copy').forEach(copy => {
      copy.addEventListener('pointerdown', event => {
        event.preventDefault();
        showMassHint(copy);
      });
    });

    range.value = String(source.initialMassKg);
    setProgress(false);
    render(false);
  })();
</script>
</body>
</html>
