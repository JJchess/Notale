<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#orbit-scene {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border: var(--border);
  border-radius: var(--radius-3);
  background: var(--surface-0);
  box-shadow: var(--shadow-panel);
}
.orbit-canvas-wrap {
  position: absolute;
  inset: 0;
  overflow: hidden;
}
.orbit-canvas-wrap::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(180deg, transparent 54%, var(--surface-0) 100%);
  opacity: .25;
}
.orbit-readouts {
  position: absolute;
  top: var(--sp-4);
  right: var(--sp-4);
  width: 294px;
  padding: var(--sp-3) var(--sp-4);
}
.orbit-readouts .reading {
  padding: var(--sp-2) 0;
}
.orbit-readouts .reading-value {
  font-size: var(--fs-sec);
}
.orbit-label {
  position: absolute;
  left: var(--sp-5);
  top: var(--sp-5);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  color: var(--text-strong);
  font-size: var(--fs-sec);
  line-height: var(--lh-copy);
  pointer-events: none;
}
.orbit-label::before {
  content: "";
  width: 52px;
  height: 2px;
  background: var(--accent);
}
.gravity-key {
  position: absolute;
  left: var(--sp-5);
  top: 70px;
  color: var(--text-muted);
  font-size: var(--fs-label);
  line-height: 1.35;
}
.gravity-key::before {
  content: "↓";
  display: inline-block;
  margin-right: var(--sp-2);
  color: var(--accent);
  font-size: var(--fs-h2);
  font-weight: 700;
}
.orbit-bottom {
  position: absolute;
  right: var(--sp-4);
  bottom: var(--sp-4);
  left: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}
.orbit-process {
  --process-line-y: 50%;
  height: 78px;
  gap: var(--sp-2);
}
.orbit-process > .step {
  justify-content: flex-start;
  padding: var(--sp-2) var(--sp-3);
  background: rgba(13, 26, 32, .9);
}
.orbit-process > .step strong {
  color: var(--text-strong);
  font-family: var(--font-narrow);
  font-size: var(--fs-sec);
  line-height: 1.35;
}
.orbit-process > .step span {
  color: var(--text-muted);
  font-size: var(--fs-label);
  line-height: 1.35;
}
.orbit-process > .arw {
  flex-basis: 18px;
  font-size: var(--fs-sec);
}
.orbit-controls {
  display: flex;
  align-items: center;
  min-height: 74px;
  padding: var(--sp-3) var(--sp-4);
  border: var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-3);
  background: var(--surface-glass);
  backdrop-filter: blur(10px);
}
.speed-control {
  display: flex;
  flex: 1 1 0;
  align-items: center;
  gap: var(--sp-4);
  min-width: 0;
}
.speed-copy {
  flex: 0 0 214px;
  min-width: 0;
}
.speed-copy strong {
  display: block;
  color: var(--text-strong);
  font-size: var(--fs-sec);
  line-height: 1.4;
}
.speed-copy span {
  display: block;
  color: var(--text-muted);
  font-size: var(--fs-label);
  line-height: 1.35;
}
.speed-range {
  flex: 1 1 0;
  min-width: 0;
}
.speed-range input {
  display: block;
  width: 100%;
}
.range-ends {
  display: flex;
  justify-content: space-between;
  color: var(--text-muted);
  font-size: var(--fs-label);
  line-height: 1.35;
}
.orbit-status {
  flex: 0 0 350px;
  min-width: 0;
  padding-left: var(--sp-4);
  color: var(--text-strong);
  font-size: var(--fs-sec);
  line-height: var(--lh-copy);
  border-left: var(--border);
}
#reset-orbit[hidden] {
  display: none;
}
#reset-orbit {
  flex: 0 0 44px;
  margin-left: var(--sp-3);
  font-size: var(--fs-h2);
}
.orbit-conclusion {
  position: absolute;
  left: var(--sp-4);
  bottom: 188px;
  width: 610px;
  padding: var(--sp-3) var(--sp-4);
  color: var(--text-strong);
  font-size: var(--fs-lead);
  font-weight: 700;
  line-height: var(--lh-copy);
  border-left: 5px solid var(--primary);
  background: var(--surface-glass);
  backdrop-filter: blur(8px);
}
progress.lec-progress {
  appearance: none;
  -webkit-appearance: none;
  overflow: visible;
}
progress.lec-progress::-webkit-progress-bar,
progress.lec-progress::-webkit-progress-value {
  background: transparent;
}
@media (prefers-reduced-motion: reduce) {
  #orbit-scene *, #orbit-scene *::before, #orbit-scene *::after {
    transition: none !important;
    animation: none !important;
  }
}
</style>
</head>
<body data-page="32" data-total="52">
<div id="stage">
<main id="main">
  <section id="orbit-scene" class="no-pan" aria-label="横向抛射轨道台">
    <div class="orbit-canvas-wrap min0" id="orbit-canvas-wrap" role="img" aria-label="固定视角的三维地球。物体从同一高度沿切线抛出，黄色箭头始终指向地心。"></div>
    <div class="orbit-label">同一出发点 · 只改变横向速度</div>
    <div class="gravity-key">重力始终指向地心</div>

    <aside class="panel orbit-readouts" aria-label="轨道模型读数">
      <div class="reading">
        <span class="reading-label">典型高度</span>
        <span class="reading-value" id="altitude-reading"></span>
      </div>
      <div class="reading is-critical">
        <span class="reading-label">横向速度</span>
        <span class="reading-value" id="speed-reading"></span>
      </div>
      <div class="reading">
        <span class="reading-label">当地重力</span>
        <span class="reading-value" id="gravity-reading"></span>
      </div>
      <div class="reading">
        <span class="reading-label">圆轨道周期</span>
        <span class="reading-value" id="period-reading"></span>
      </div>
    </aside>

    <p class="orbit-conclusion">轨道不是没有重力，而是物体持续下落，却因横向速度足够大而不断错过弯曲的地面。</p>

    <div class="orbit-bottom">
      <div class="k-process orbit-process" aria-label="从释放到入轨的过程">
        <div class="axis" aria-hidden="true"></div>
        <div class="step is-current" data-step="0" aria-current="step"><strong>释放</strong><span>径直落向地面</span></div>
        <div class="arw" aria-hidden="true"></div>
        <div class="step" data-step="1"><strong>撞地</strong><span>低速时落得更远</span></div>
        <div class="arw" aria-hidden="true"></div>
        <div class="step" data-step="2"><strong>掠过</strong><span>地面向下弯离</span></div>
        <div class="arw" aria-hidden="true"></div>
        <div class="step" data-step="3"><strong>入轨</strong><span>下落一圈回到起点</span></div>
      </div>

      <div class="orbit-controls">
        <div class="speed-control min0">
          <div class="speed-copy">
            <strong>横向拖动黄色速度手柄</strong>
            <span>释放后观察撞地点向前移动</span>
          </div>
          <div class="speed-range min0">
            <input id="speed-control" type="range" min="0" step="1" value="0" aria-label="横向速度">
            <div class="range-ends"><span>释放</span><span>圆轨道</span></div>
          </div>
        </div>
        <div class="orbit-status" id="orbit-status" role="status" aria-live="polite">重力是否存在？释放手柄，观察箭头与轨迹。</div>
        <button id="reset-orbit" class="btn icon-only" type="button" aria-label="清除轨迹并重置" title="清除轨迹并重置" hidden>↺</button>
      </div>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/three.min.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/lib/ScrollTrigger.min.js"></script>
<script>
(function () {
  'use strict';

  Lec.mount({index:32,kicker:'ORBIT / 持续下落',title:'轨道，是不断错过地面的下落',take:'重力没有消失：足够大的横向速度，让物体下落时地面也不断向下弯离。'});

  const altitudeM = Lec.K.spaceflight.lowEarthOrbitReferenceAltitude;
  const earthRadiusM = Lec.K.earth.meanRadius;
  const earthMassKg = Lec.K.earth.mass;
  const orbitSpeedMps = Lec.P.circularOrbitVelocityAtAltitude(earthMassKg, earthRadiusM, altitudeM);
  const localGravity = Lec.P.gravityAtAltitude(earthMassKg, earthRadiusM, altitudeM);
  const orbitPeriodSeconds = Lec.P.orbitalPeriodAtAltitude(earthMassKg, earthRadiusM, altitudeM);
  const speedKmps = Lec.P.kilometresFromMetres(orbitSpeedMps);
  const altitudeKm = Lec.P.kilometresFromMetres(altitudeM);
  const periodMinutes = orbitPeriodSeconds / 60;

  const altitudeReading = document.getElementById('altitude-reading');
  const speedReading = document.getElementById('speed-reading');
  const gravityReading = document.getElementById('gravity-reading');
  const periodReading = document.getElementById('period-reading');
  const speedControl = document.getElementById('speed-control');
  const status = document.getElementById('orbit-status');
  const reset = document.getElementById('reset-orbit');
  const wrap = document.getElementById('orbit-canvas-wrap');
  const steps = Array.from(document.querySelectorAll('.orbit-process .step'));

  altitudeReading.textContent = Lec.P.roundTo(altitudeKm, 0) + ' km';
  gravityReading.textContent = Lec.P.roundTo(localGravity, 2) + ' m/s²';
  periodReading.textContent = Lec.P.roundTo(periodMinutes, 1) + ' min';
  speedControl.max = String(Math.round(speedKmps * 1000));

  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.domElement.className = 'cv-fill';
  renderer.domElement.setAttribute('aria-hidden', 'true');
  wrap.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,0.1,1000);
  camera.position.set(0, 0.4, 15.4);
  camera.lookAt(0, -1.15, 0);

  const css = name => Deck.token(name).trim();
  const primary = new THREE.Color(css('--primary'));
  const primaryBright = new THREE.Color(css('--primary-bright'));
  const primaryDark = new THREE.Color(css('--primary-dark'));
  const accent = new THREE.Color(css('--accent'));
  const surface = new THREE.Color(css('--surface-1'));
  const faint = new THREE.Color(css('--text-faint'));

  scene.add(new THREE.HemisphereLight(primaryBright, surface, 1.2));
  const key = new THREE.DirectionalLight(css('--text-strong'), 2.1);
  key.position.set(-5, 7, 8);
  scene.add(key);
  const rim = new THREE.DirectionalLight(primaryBright, 1.4);
  rim.position.set(6, 1, -5);
  scene.add(rim);

  const earthRadius = 3.15;
  const center = new THREE.Vector3(0, -1.5, 0);
  const earth = new THREE.Mesh(
    new THREE.SphereGeometry(earthRadius, 64, 48),
    new THREE.MeshStandardMaterial({color: surface, roughness: 0.78, metalness: 0.06})
  );
  earth.position.copy(center);
  scene.add(earth);

  const wire = new THREE.Mesh(
    new THREE.SphereGeometry(earthRadius * 1.002, 32, 20),
    new THREE.MeshBasicMaterial({color: primaryDark, wireframe: true, transparent: true, opacity: 0.24})
  );
  wire.position.copy(center);
  wire.rotation.z = -0.18;
  scene.add(wire);

  const atmosphere = new THREE.Mesh(
    new THREE.SphereGeometry(earthRadius * 1.035, 64, 48),
    new THREE.MeshBasicMaterial({color: primaryBright, transparent: true, opacity: 0.18, side: THREE.BackSide})
  );
  atmosphere.position.copy(center);
  scene.add(atmosphere);

  const launchRadius = earthRadius * (1 + altitudeM / earthRadiusM);
  const launchAngle = Math.PI * 0.68;
  const launchLocal = new THREE.Vector3(Math.cos(launchAngle) * launchRadius, Math.sin(launchAngle) * launchRadius, 0.18);
  const launchPoint = center.clone().add(launchLocal);
  const tangent = new THREE.Vector3(Math.sin(launchAngle), -Math.cos(launchAngle), 0).normalize();

  const marker = new THREE.Mesh(
    new THREE.SphereGeometry(0.105, 24, 16),
    new THREE.MeshStandardMaterial({color: accent, emissive: accent, emissiveIntensity: 0.65})
  );
  marker.position.copy(launchPoint);
  scene.add(marker);

  const launchRing = new THREE.Mesh(
    new THREE.TorusGeometry(0.17, 0.018, 10, 40),
    new THREE.MeshBasicMaterial({color: accent})
  );
  launchRing.position.copy(launchPoint);
  scene.add(launchRing);

  const tangentGeometry = new THREE.BufferGeometry().setFromPoints([
    launchPoint.clone().addScaledVector(tangent, -0.32),
    launchPoint.clone().addScaledVector(tangent, 1.35)
  ]);
  scene.add(new THREE.Line(tangentGeometry, new THREE.LineBasicMaterial({color: accent, transparent: true, opacity: 0.72})));

  const gravityArrow = new THREE.ArrowHelper(center.clone().sub(launchPoint).normalize(), launchPoint, 0.85, accent.getHex(), 0.18, 0.1);
  scene.add(gravityArrow);

  const trajectoryGroup = new THREE.Group();
  scene.add(trajectoryGroup);
  let activeLine = null;
  let trajectory = [];
  let activeIndex = 0;
  let playing = false;
  let currentStep = 0;
  let impactPulse = 0;

  function setStep(index) {
    currentStep = index;
    steps.forEach((el, i) => {
      el.classList.toggle('is-past', i < index);
      el.classList.toggle('is-current', i === index);
      if (i === index) el.setAttribute('aria-current', 'step');
      else el.removeAttribute('aria-current');
    });
  }

  function updateSpeedReading() {
    const value = Number(speedControl.value) / 1000;
    speedReading.textContent = Lec.P.roundTo(value, 2) + ' km/s';
  }

  function buildTrajectory(speedFraction) {
    const points = [];
    let p = launchLocal.clone();
    const circularModelSpeed = Math.sqrt(1 / launchRadius);
    let v = tangent.clone().multiplyScalar(speedFraction * circularModelSpeed);
    const dt = 0.012;
    const maxSteps = 1600;
    let impacted = false;
    for (let i = 0; i < maxSteps; i += 1) {
      points.push(center.clone().add(p));
      const r = p.length();
      if (r <= earthRadius * 1.002) {
        impacted = true;
        break;
      }
      const acceleration = p.clone().multiplyScalar(-1 / (r * r * r));
      v.addScaledVector(acceleration, dt);
      p.addScaledVector(v, dt);
      if (!Number.isFinite(p.x) || !Number.isFinite(p.y) || !Number.isFinite(p.z)) break;
      if (speedFraction >= 0.992 && points.length > 250 && p.distanceTo(launchLocal) < 0.055) break;
    }
    if (speedFraction >= 0.992) points.push(launchPoint.clone());
    return {points, impacted};
  }

  function addTrajectoryLine(points, success) {
    if (activeLine) {
      activeLine.material.opacity = 0.22;
      activeLine.material.color.copy(faint);
      activeLine = null;
    }
    while (trajectoryGroup.children.length >= 4) {
      const old = trajectoryGroup.children[0];
      trajectoryGroup.remove(old);
      old.geometry.dispose();
      old.material.dispose();
    }
    const material = new THREE.LineBasicMaterial({
      color: success ? primaryBright : accent,
      transparent: true,
      opacity: success ? 0.95 : 0.78
    });
    activeLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), material);
    activeLine.geometry.setDrawRange(0, 1);
    trajectoryGroup.add(activeLine);
  }

  function launch() {
    const fraction = Number(speedControl.value) / Number(speedControl.max || 1);
    const result = buildTrajectory(fraction);
    trajectory = result.points;
    activeIndex = 0;
    playing = true;
    impactPulse = 0;
    marker.visible = true;
    reset.hidden = true;
    const success = fraction >= 0.992;
    addTrajectoryLine(trajectory, success);

    if (fraction < 0.06) {
      setStep(0);
      status.textContent = '重力仍在起作用：没有横向速度，物体径直落下。';
    } else if (fraction < 0.78) {
      setStep(1);
      status.textContent = '速度增大，撞地点沿弯曲地面向前移动。';
    } else if (!success) {
      setStep(2);
      status.textContent = '轨迹贴近地表延伸；再增加横向速度。';
    } else {
      setStep(3);
      status.textContent = '持续下落：已绕过地面。重力箭头仍指向地心。';
    }

    if (Deck.reduced()) {
      activeIndex = trajectory.length - 1;
      finishTrajectory(success);
      drawFrame();
    }
  }

  function finishTrajectory(success) {
    playing = false;
    if (activeLine) activeLine.geometry.setDrawRange(0, trajectory.length);
    if (success) {
      marker.position.copy(launchPoint);
      activeLine.material.color.copy(primaryBright);
      activeLine.material.opacity = 1;
      reset.hidden = false;
    } else {
      impactPulse = 1;
      marker.position.copy(launchPoint);
      if (activeLine) activeLine.material.opacity = 0.34;
    }
  }

  function updateArrow() {
    const towardCenter = center.clone().sub(marker.position);
    gravityArrow.position.copy(marker.position);
    gravityArrow.setDirection(towardCenter.normalize());
    gravityArrow.setLength(0.85, 0.18, 0.1);
  }

  function drawFrame() {
    updateArrow();
    renderer.render(scene, camera);
  }

  function resizeRenderer() {
    const width = Math.max(1, wrap.offsetWidth);
    const height = Math.max(1, wrap.offsetHeight);
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    drawFrame();
  }

  speedControl.addEventListener('input', function () {
    updateSpeedReading();
    const fraction = Number(speedControl.value) / Number(speedControl.max || 1);
    if (fraction < 0.06) setStep(0);
    else if (fraction < 0.78) setStep(1);
    else if (fraction < 0.992) setStep(2);
    else setStep(3);
    marker.position.copy(launchPoint).addScaledVector(tangent, fraction * 0.42);
    drawFrame();
  });
  speedControl.addEventListener('change', launch);
  speedControl.addEventListener('pointerup', launch);

  reset.addEventListener('click', function () {
    trajectoryGroup.children.slice().forEach(line => {
      trajectoryGroup.remove(line);
      line.geometry.dispose();
      line.material.dispose();
    });
    activeLine = null;
    speedControl.value = '0';
    updateSpeedReading();
    marker.position.copy(launchPoint);
    marker.scale.setScalar(1);
    setStep(0);
    status.textContent = '重力是否存在？释放手柄，观察箭头与轨迹。';
    reset.hidden = true;
    playing = false;
    drawFrame();
  });

  updateSpeedReading();
  resizeRenderer();
  Deck.onResize(resizeRenderer);

  Deck.loop(function (_time, dt) {
    if (playing && trajectory.length) {
      const advance = Math.max(1, Math.round(dt * 150));
      activeIndex = Math.min(trajectory.length - 1, activeIndex + advance);
      marker.position.copy(trajectory[activeIndex]);
      if (activeLine) activeLine.geometry.setDrawRange(0, activeIndex + 1);
      if (activeIndex >= trajectory.length - 1) {
        finishTrajectory(currentStep === 3);
      }
    } else if (impactPulse > 0) {
      impactPulse = Math.max(0, impactPulse - dt * 2.4);
      marker.scale.setScalar(1 + impactPulse * 0.75);
    } else {
      marker.scale.setScalar(1);
    }
    drawFrame();
  }, {still: 1});

  if (!Deck.reduced()) {
    gsap.registerPlugin(ScrollTrigger);
    gsap.from(earth.position, {y: -3.1, duration: 1.1, ease: 'power2.out'});
    gsap.from(atmosphere.material, {opacity: 0, duration: 0.7, delay: 0.45});
    gsap.from([launchRing.scale, marker.scale], {x: 0, y: 0, z: 0, duration: 0.45, stagger: 0.12, delay: 0.7});
    ScrollTrigger.create({trigger:'#orbit-scene',start:'top top',end:'bottom top',scrub:0.6,onUpdate:function (self) { atmosphere.material.opacity = 0.18 + self.progress * 0.04; }});
  }
}());
</script>
</body>
</html>
