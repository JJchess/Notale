<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main { display:flex; flex-direction:column; gap:16px; }
  .body-clock { display:flex; height:274px; min-height:0; gap:16px; }
  .photo-scene { position:relative; flex:1 1 0; min-width:0; overflow:hidden; border:1px solid var(--line-strong); border-radius:var(--radius-3); background:var(--surface-1); }
  .photo-scene img { width:100%; height:100%; display:block; object-fit:cover; object-position:center 42%; filter:saturate(.76) brightness(.62) contrast(1.06); }
  .photo-scene::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(90deg,rgba(7,16,21,.08),rgba(7,16,21,.02) 55%,rgba(7,16,21,.75)); box-shadow:inset 0 0 0 1px rgba(53,198,180,.18); }
  .scene-label { position:absolute; z-index:3; top:14px; left:16px; padding:6px 10px; color:var(--text-strong); font-size:var(--fs-label); font-weight:700; line-height:1.35; border-left:3px solid var(--accent); background:rgba(7,16,21,.76); }
  .body-zone { position:absolute; z-index:4; width:26px; height:26px; border:2px solid var(--primary-bright); border-radius:50%; background:rgba(53,198,180,.12); opacity:.32; transform:translate(-50%,-50%); transition:opacity 220ms ease, background 220ms ease, box-shadow 220ms ease; }
  .body-zone::after { content:attr(data-short); position:absolute; left:34px; top:50%; width:max-content; max-width:150px; padding:4px 8px; color:var(--text-muted); font-size:var(--fs-label); font-weight:700; line-height:1.35; border-left:2px solid var(--primary-dark); background:rgba(7,16,21,.78); transform:translateY(-50%); }
  .body-zone.is-on { opacity:1; background:rgba(53,198,180,.34); box-shadow:0 0 0 8px rgba(53,198,180,.10),0 0 22px rgba(53,198,180,.48); }
  .body-zone.is-on::after { color:var(--text-strong); }
  .z-fluid { left:48%; top:31%; }
  .z-balance { left:52%; top:19%; }
  .z-muscle { left:52%; top:68%; }
  .z-bone { left:45%; top:81%; }
  .body-zone.pulse { animation:zonePulse 520ms cubic-bezier(.2,.8,.2,1); }
  @keyframes zonePulse { 0%{transform:translate(-50%,-50%) scale(.82)} 55%{transform:translate(-50%,-50%) scale(1.22)} 100%{transform:translate(-50%,-50%) scale(1)} }
  .explain { flex:0 0 456px; min-width:0; display:flex; flex-direction:column; justify-content:space-between; padding:18px 20px; border-left:3px solid var(--primary); background:var(--surface-glass); }
  .explain h2 { color:var(--text-strong); }
  .explain p { font-size:var(--fs-sec); line-height:var(--lh-copy); color:var(--text-muted); }
  .explain strong { color:var(--accent); font-weight:700; }
  .process-mini { --process-line-y:50%; height:68px; gap:8px; }
  .process-mini > .step { padding:9px 10px; font-size:var(--fs-label); line-height:1.35; text-align:center; background:var(--surface-2); }
  .process-mini > .arw { flex-basis:20px; }
  .clock-panel { position:relative; flex:1 1 0; min-height:0; padding:12px 16px 10px; overflow:hidden; border:1px solid var(--line-strong); border-radius:var(--radius-3); background:var(--surface-glass); }
  .time-guide { position:absolute; z-index:0; top:50px; right:16px; bottom:10px; left:132px; width:calc(100% - 148px); height:calc(100% - 60px); pointer-events:none; }
  .time-guide line { stroke:var(--line); stroke-width:1; stroke-dasharray:5 7; }
  .time-guide .flow { stroke:var(--primary-dark); stroke-width:2; stroke-dasharray:none; }
  .clock-head, .timeline-head, .tracks { position:relative; z-index:1; }
  .lec-progress { overflow:visible; }
  .clock-head { display:flex; align-items:center; justify-content:space-between; min-height:40px; gap:16px; }
  .instruction { color:var(--text-muted); font-size:var(--fs-sec); line-height:var(--lh-copy); }
  .clock-status { flex:0 0 auto; color:var(--accent); font-family:var(--font-mono); font-size:var(--fs-sec); font-weight:700; }
  .timeline-head { display:flex; align-items:end; height:38px; margin-left:116px; }
  .time-origin { flex:0 0 134px; color:var(--text-strong); font-size:var(--fs-label); font-weight:700; }
  .time-bands { position:relative; display:flex; flex:1 1 0; min-width:0; height:32px; }
  .time-bands::before { content:""; position:absolute; left:0; right:6px; bottom:4px; height:2px; background:var(--line-strong); }
  .time-bands::after { content:""; position:absolute; right:2px; bottom:0; width:9px; height:9px; border-top:2px solid var(--primary); border-right:2px solid var(--primary); transform:rotate(45deg); }
  .band-label { flex:1 1 0; min-width:0; color:var(--text-muted); font-size:var(--fs-label); line-height:1.35; text-align:center; border-left:1px solid var(--line); }
  .tracks { display:flex; flex-direction:column; gap:5px; }
  .track { position:relative; display:flex; align-items:center; min-height:42px; border-top:1px solid var(--line); }
  .track-name { flex:0 0 116px; color:var(--text-strong); font-size:var(--fs-label); font-weight:700; }
  .track-line { position:relative; flex:1 1 0; min-width:0; height:34px; border-radius:var(--radius-2); background:linear-gradient(90deg,rgba(53,198,180,.04),rgba(53,198,180,.10)); }
  .track-line::before { content:""; position:absolute; left:0; right:0; top:16px; height:2px; background:var(--line-strong); }
  .track-line::after { content:"持续适应 →"; position:absolute; top:5px; right:9px; color:var(--text-faint); font-size:var(--fs-label); font-weight:600; line-height:1.35; opacity:0; transition:opacity 220ms ease; }
  .track.is-done .track-line { background:linear-gradient(90deg,rgba(53,198,180,.10),rgba(53,198,180,.28)); }
  .track.is-done .track-line::before { background:var(--primary); }
  .track.is-done .track-line::after { opacity:1; color:var(--primary-bright); }
  .target { position:absolute; top:2px; left:calc((var(--slot) + .5) * 25%); width:88px; height:30px; border:1px dashed var(--primary-dark); border-radius:var(--radius-2); color:var(--text-faint); font-size:var(--fs-label); line-height:28px; text-align:center; transform:translateX(-50%); }
  .marker { position:absolute; z-index:3; top:1px; left:6px; width:94px; min-width:94px; min-height:32px; height:32px; padding:4px 9px; touch-action:none; cursor:grab; transform:translateX(var(--x,0px)); will-change:transform; }
  .marker:active { cursor:grabbing; }
  .marker.is-set { color:var(--accent-ink); border-color:var(--accent); background:var(--accent); cursor:default; }
  .track.shake { animation:trackShake 360ms ease-out; }
  @keyframes trackShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 50%{transform:translateX(7px)} 75%{transform:translateX(-4px)} }
  .event-copy { position:absolute; z-index:2; left:calc((var(--slot) + .5) * 25%); top:50%; max-width:255px; padding:4px 8px; color:var(--text-strong); font-size:var(--fs-label); font-weight:600; line-height:1.35; background:rgba(7,16,21,.9); opacity:0; transform:translate(60px,-50%); pointer-events:none; }
  .track.is-done .event-copy { opacity:1; }
  .complete-strip { position:absolute; z-index:6; right:16px; bottom:10px; left:132px; display:flex; align-items:center; justify-content:center; min-height:36px; color:var(--accent-ink); font-size:var(--fs-sec); font-weight:800; line-height:1.35; background:var(--accent); opacity:0; pointer-events:none; transform:translateY(8px); }
  .complete-strip.is-on { opacity:1; transform:translateY(0); }
  .scanline { position:absolute; z-index:5; top:48px; bottom:10px; left:132px; width:2px; background:var(--accent); box-shadow:0 0 14px rgba(255,204,77,.7); opacity:0; pointer-events:none; }
  .scanline.run { opacity:1; animation:scan 1500ms cubic-bezier(.2,.8,.2,1) both; }
  @keyframes scan { from{transform:translateX(0)} to{transform:translateX(1218px)} }
  .reset { min-width:44px; padding:0 12px; font-size:var(--fs-sec); }
  .marker { font-size:var(--fs-sec); }
  .reset .ico { font-size:22px; line-height:1; }
  .feedback { position:absolute; right:78px; top:15px; max-width:560px; color:var(--accent); font-size:var(--fs-sec); font-weight:700; line-height:1.35; text-align:right; }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; } }
</style>
</head>

const tracks = [...document.querySelectorAll('.track')];
const statusEl = document.getElementById('clockStatus');
const feedbackEl = document.getElementById('feedback');

function metrics(track) {
  const line = track.querySelector('.track-line');
  const marker = track.querySelector('.marker');
  const travel = Math.max(0, line.clientWidth - marker.offsetWidth - 8);
  return { travel, step: travel / 3 };
}

function positionFor(track, slot) {
  const { travel } = metrics(track);
  return travel * ((slot + 0.5) / 4) - 47;
}

function moveMarker(marker, x, animate) {
  if (animate && !reduced) {
    marker.animate([{transform:`translateX(${getComputedStyle(marker).getPropertyValue('--x') || '0px'})`},{transform:`translateX(${x}px)`}],{duration:420,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'}).onfinish = () => {
      marker.style.setProperty('--x', `${x}px`);
      marker.getAnimations().forEach(a => a.cancel());
    };
  } else {
    marker.style.setProperty('--x', `${x}px`);
  }
}

function highlight(system) {
  const zone = document.querySelector(`[data-zone="${system}"]`);
  zone.classList.add('is-on');
  if (!reduced) {
    zone.classList.remove('pulse');
    void zone.offsetWidth;
    zone.classList.add('pulse');
  }
}

function check(track, slot) {
  if (track.classList.contains('is-done')) return;
  const answer = Number(track.dataset.answer);
  const marker = track.querySelector('.marker');
  if (slot === answer) {
    moveMarker(marker, positionFor(track, answer), true);
    marker.classList.add('is-set');
    marker.disabled = true;
    marker.setAttribute('aria-label', `${marker.textContent}，已归位`);
    track.classList.add('is-done');
    highlight(track.dataset.system);
    completed += 1;
    statusEl.textContent = `身体时钟 ${completed} / 4`;
    feedbackEl.textContent = answer === 0 ? '这个变化在数小时内已经开始。' : answer === 1 ? '这个变化从数天尺度开始。' : '这个变化在数周尺度逐渐显现。';
    if (completed === 4) finish();
  } else {
    moveMarker(marker, 0, true);
    track.classList.remove('shake');
    void track.offsetWidth;
    if (!reduced) track.classList.add('shake');
    feedbackEl.textContent = '再看变化何时开始：这是数小时、数天，还是数周后的反应？';
  }
}

function finish() {
  feedbackEl.textContent = '体液先变，平衡随后校准；肌肉与骨骼继续适应。';
  completeEl.classList.add('is-on');
  if (!reduced) {
    scanline.classList.remove('run');
    void scanline.offsetWidth;
    scanline.classList.add('run');
  }
}

tracks.forEach(track => {
  const marker = track.querySelector('.marker');
  let dragging = false;
  let startX = 0;
  let startValue = 0;
  marker.dataset.keyboardSlot = '0';

  marker.addEventListener('pointerdown', e => {
    if (marker.disabled) return;
    dragging = true;
    startX = Deck.pt(track.querySelector('.track-line'), e).x;
    startValue = parseFloat(getComputedStyle(marker).getPropertyValue('--x')) || 0;
    marker.setPointerCapture(e.pointerId);
  });
  marker.addEventListener('pointermove', e => {
    if (!dragging) return;
    const line = track.querySelector('.track-line');
    const p = Deck.pt(line, e);
    const { travel } = metrics(track);
    const x = Deck.clamp(startValue + p.x - startX, 0, travel);
    marker.style.setProperty('--x', `${x}px`);
    const slot = Deck.clamp(Math.round(((x + 47) / Math.max(1, line.clientWidth)) * 4 - 0.5), 0, 3);
    marker.setAttribute('aria-label', `${marker.textContent}，指向${['数小时','数天','数周','数月'][slot]}`);
  });
  marker.addEventListener('pointerup', e => {
    if (!dragging) return;
    dragging = false;
    const x = parseFloat(getComputedStyle(marker).getPropertyValue('--x')) || 0;
    const line = track.querySelector('.track-line');
    const slot = Deck.clamp(Math.round(((x + 47) / Math.max(1, line.clientWidth)) * 4 - 0.5), 0, 3);
    check(track, slot);
  });
  marker.addEventListener('keydown', e => {
    if (marker.disabled) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      const keyboardSlot = Deck.clamp(Number(marker.dataset.keyboardSlot) + (e.key === 'ArrowRight' ? 1 : -1), 0, 3);
      marker.dataset.keyboardSlot = String(keyboardSlot);
      moveMarker(marker, positionFor(track, keyboardSlot), false);
      marker.setAttribute('aria-label', `${marker.textContent}，指向${['数小时','数天','数周','数月'][keyboardSlot]}`);
    }
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      check(track, Number(marker.dataset.keyboardSlot));
    }
  });
});

document.getElementById('reset').addEventListener('click', () => {
  completed = 0;
  statusEl.textContent = '身体时钟 0 / 4';
  feedbackEl.textContent = '';
  completeEl.classList.remove('is-on');
  scanline.classList.remove('run');
  tracks.forEach(track => {
    track.classList.remove('is-done','shake');
    const marker = track.querySelector('.marker');
    marker.disabled = false;
    marker.classList.remove('is-set');
    marker.dataset.keyboardSlot = '0';
    marker.setAttribute('aria-label', `${marker.textContent}，当前在起点`);
    moveMarker(marker, 0, false);
  });
  document.querySelectorAll('.body-zone').forEach(zone => zone.classList.remove('is-on','pulse'));
  tracks[0].querySelector('.marker').focus();
});
</script>
</body>
</html>
