<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .signal-page {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
  }

  .signal-field {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .signal-field .route-guide {
    fill: none;
    stroke: var(--primary-dark);
    stroke-width: 2;
    opacity: .46;
  }

  .signal-field .constraint-guide {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    stroke-dasharray: 8 8;
    opacity: .58;
  }

  .signal-compare,
  .signal-console,
  .note-line {
    position: relative;
    z-index: 1;
  }

  .signal-compare {
    --compare-cols: 4;
    grid-template-columns: 230px minmax(300px, 1.5fr) repeat(2, minmax(150px, .75fr)) minmax(210px, 1fr);
    flex: 0 0 350px;
    background: var(--surface-1);
  }

  .signal-compare > .hdr,
  .signal-compare > .dim,
  .signal-compare > .cell,
  .signal-compare > .diff {
    padding: var(--sp-2) var(--sp-3);
  }

  .signal-compare > .hdr {
    min-height: 42px;
    align-items: center;
    font-size: var(--fs-sec);
  }

  .signal-compare > .dim {
    justify-content: flex-start;
    color: var(--text-strong);
    font-size: var(--fs-sec);
    text-align: left;
  }

  .signal-compare > .cell,
  .signal-compare > .diff {
    min-height: 78px;
  }

  .route-name {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    width: 100%;
  }

  .route-endpoint {
    width: 14px;
    height: 14px;
    flex: 0 0 14px;
    box-sizing: border-box;
    border: 2px solid var(--text-faint);
    border-radius: 50%;
  }

  .route-endpoint.is-complete {
    border-color: var(--primary-bright);
    box-shadow: 0 0 0 4px var(--surface-teal);
  }

  .route-lane {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: var(--sp-1);
    width: 100%;
    min-width: 0;
  }

  .route-distance {
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    line-height: 1.35;
    font-variant-numeric: tabular-nums;
  }

  .lane-line {
    position: relative;
    width: 100%;
    height: 28px;
    overflow: hidden;
    border: var(--border);
    background: var(--surface-2);
  }

  .lane-line::before,
  .lane-line::after {
    content: "";
    position: absolute;
    right: 8px;
    left: 8px;
    height: 2px;
  }

  .lane-line::before {
    top: 8px;
    background: var(--accent);
  }

  .lane-line::after {
    bottom: 8px;
    background: var(--primary-dark);
  }

  .terminal {
    position: absolute;
    top: 7px;
    width: 10px;
    height: 10px;
    box-sizing: border-box;
    border: 2px solid var(--primary);
    border-radius: 50%;
    background: var(--surface-0);
  }

  .terminal--traveler { left: 3px; }
  .terminal--earth { right: 3px; }

  .signal-pulse {
    position: absolute;
    top: 3px;
    left: 4px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    opacity: 0;
    transform: translateX(0);
  }

  .signal--back { top: 15px; background: var(--primary-bright); box-shadow: 0 0 10px var(--primary); }

  .lane-labels {
    display: flex;
    justify-content: space-between;
    color: var(--text-faint);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .metric {
    display: flex;
    flex-direction: column;
    gap: var(--sp-1);
    min-width: 0;
  }

  .metric-value {
    color: var(--primary-bright);
    font-family: var(--font-mono);
    font-size: var(--fs-lead);
    font-weight: 700;
    line-height: 1.35;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .metric-hint {
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .window-state {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
  }

  .window-mark {
    width: 4px;
    height: 34px;
    flex: 0 0 4px;
    background: var(--accent);
  }

  .signal-console {
    display: grid;
    grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
    gap: var(--sp-4);
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;
  }

  .comm-side,
  .decision-side {
    min-width: 0;
    min-height: 0;
    padding: var(--sp-4) var(--sp-5);
    border: var(--border);
    background: var(--surface-1);
  }

  .comm-side {
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
    border-left: 3px solid var(--primary);
  }

  .decision-side {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: var(--sp-3);
  }

  .console-top {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    min-width: 0;
  }

  .console-top label {
    color: var(--text-muted);
    font-size: var(--fs-label);
    font-weight: 700;
  }

  #routeSelect { width: 245px; }

  .message-line {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    min-width: 0;
  }

  .message {
    flex: 1 1 0;
    min-width: 0;
    color: var(--text-strong);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
  }

  .timer {
    flex: 0 0 164px;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: var(--fs-h2);
    font-weight: 700;
    line-height: 1.3;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .reply {
    min-height: 24px;
    color: var(--primary-bright);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
  }

  .deadline {
    position: relative;
    height: 6px;
    overflow: visible;
    background: var(--surface-3);
  }

  .deadline::after {
    content: attr(data-label);
    position: absolute;
    top: 10px;
    right: 0;
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .deadline-fill {
    width: 100%;
    height: 100%;
    background: var(--accent);
    transform-origin: left center;
  }

  .deadline.is-danger .deadline-fill { background: var(--danger); }

  .decision-buttons {
    display: flex;
    gap: var(--sp-3);
  }

  .decision-buttons .choice { flex: 1 1 0; }

  .feedback {
    min-height: 48px;
    color: var(--text-strong);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
  }

  .progress-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-3);
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: 1.35;
  }

  .synthesis {
    display: none;
    color: var(--text-strong);
    font-size: var(--fs-lead);
    font-weight: 700;
    line-height: var(--lh-copy);
  }

  .synthesis.is-visible { display: block; }

  .earth-arc {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 650px;
    height: 84px;
    border-top: 3px solid var(--primary-bright);
    border-radius: 50% 50% 0 0;
    box-shadow: 0 -2px 18px var(--primary-dark);
    opacity: .32;
    pointer-events: none;
    z-index: -1;
  }

  .lec-progress {
    overflow: visible;
  }

  .lec-progress progress,
  progress.lec-progress {
    height: 4px;
  }

  .note-line {
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
  }

  @media (prefers-reduced-motion: reduce) {
    .signal-pulse { transition: none; }
  }
</style>
</head>
<body data-page="39" data-total="52">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
Lec.mount({index: 39, kicker: 'SIGNAL DELAY', title: '一句“收到”，要等多久？', take: '距离把即时求助变成等待，远行者必须获得更高自主性。'});

const DECISION_WINDOW_SECONDS = 60;
const main = document.getElementById('main');
main.innerHTML = `
  <section class="signal-page min0" aria-label="通信延迟比较与决策">
    <svg class="signal-field" viewBox="0 0 1408 620" role="img" aria-label="三条通信路线的等待时间汇入同一条六十秒决策期限">
      <path class="route-guide" d="M28 118 H1040 L1188 418 H1380" />
      <path class="route-guide" d="M28 212 H1040 L1188 418" />
      <path class="route-guide" d="M28 306 H1040 L1188 418" />
      <path class="constraint-guide" d="M28 418 H1380" />
    </svg>
    <div class="earth-arc" aria-hidden="true"></div>
    <div class="k-comparison signal-compare min0" id="comparison" aria-label="三条通信路线对齐比较">
      <div class="hdr">通信路线</div>
      <div class="hdr">距离与信号通道</div>
      <div class="hdr">单程最短等待</div>
      <div class="hdr">最早往返</div>
      <div class="hdr"><span class="decision-window"></span>内必须决定</div>
    </div>

    <div class="signal-console min0">
      <section class="comm-side min0" aria-labelledby="commTitle">
        <div class="console-top">
          <h2 id="commTitle">任务对话机</h2>
          <label for="routeSelect">路线</label>
          <select id="routeSelect" aria-label="选择通信路线"></select>
          <button class="btn is-primary" id="sendBtn" type="button">发送</button>
        </div>
        <div class="message-line">
          <p class="message">氧气回路告警，<span class="decision-window"></span>内是否切换备用回路？</p>
          <output class="timer" id="timer" aria-live="polite">待发送</output>
        </div>
        <div class="deadline" id="deadline" aria-label="决策期限"><div class="deadline-fill"></div></div>
        <p class="reply" id="reply">先比较最早往返时间，再决定是否等待。</p>
      </section>

      <section class="decision-side min0" aria-label="任务决策">
        <div class="decision-buttons">
          <button class="choice" id="waitBtn" type="button" disabled>等待地面</button>
          <button class="choice" id="actBtn" type="button" disabled>按舱内预案先处置</button>
        </div>
        <p class="feedback" id="feedback" aria-live="polite">距离不会让消息变慢，它让光也必须花时间赶路。</p>
        <p class="synthesis" id="synthesis">距离增加 → 等待增加 → 自主性要求提高</p>
        <div class="progress-line">
          <span id="tested">已测试 0 / 3 条路线</span>
          <button class="btn icon-only" id="resetBtn" type="button" title="清空并重播" aria-label="清空并重播">↻</button>
        </div>
      </section>
    </div>
    <p class="note-line">所有时间都是光速传播的理论下限，不含设备、路由与人员响应时间。</p>
  </section>`;

const sources = [
  { id: 'moon', name: '地球—月球', distance: Lec.K.earthMoonMeanDistanceM },
  { id: 'marsNear', name: '地球—火星（近距演示）', distance: Lec.K.earthMarsDistanceMinM },
  { id: 'marsFar', name: '地球—火星（远距演示）', distance: Lec.K.earthMarsDistanceMaxM }
];

function rounded(value, digits) {
  return Lec.P.roundTo(value, digits);
}

function formatDistance(metres) {
  const km = Lec.P.kilometresFromMetres(metres);
  if (km >= 1000000) return Lec.P.significant(km / 1000000, 3) + ' 百万 km';
  return Lec.P.significant(km, 4) + ' km';
}

function formatTime(seconds) {
  if (seconds < 60) return rounded(seconds, 2) + ' 秒';
  const minutes = Math.floor(seconds / 60);
  const remainder = rounded(seconds - minutes * 60, 0);
  return minutes + ' 分 ' + remainder + ' 秒';
}

const routes = sources.map(function (source) {
  const oneWay = Lec.P.lightTravelTime(source.distance);
  const roundTrip = Lec.P.roundTripSignalDelay(source.distance);
  return Object.assign({}, source, {
    oneWay: oneWay,
    roundTrip: roundTrip,
    canWait: roundTrip <= DECISION_WINDOW_SECONDS
  });
});

const comparison = document.getElementById('comparison');
routes.forEach(function (route, index) {
  const dim = document.createElement('div');
  dim.className = 'dim';
  dim.innerHTML = '<div class="route-name"><span class="route-endpoint" id="done-' + route.id + '" aria-hidden="true"></span><span>' + route.name + '</span></div>';

  const lane = document.createElement('div');
  lane.className = 'cell';
  lane.innerHTML = `
    <div class="route-lane">
      <div class="route-distance">${formatDistance(route.distance)}</div>
      <div class="lane-line" id="lane-${route.id}">
        <span class="terminal terminal--traveler" aria-hidden="true"></span>
        <span class="signal-pulse signal--out" aria-hidden="true"></span>
        <span class="signal-pulse signal--back" aria-hidden="true"></span>
        <span class="terminal terminal--earth" aria-hidden="true"></span>
      </div>
      <div class="lane-labels"><span>远行者</span><span>地面</span></div>
    </div>`;

  const oneWay = document.createElement('div');
  oneWay.className = 'cell';
  oneWay.innerHTML = '<div class="metric"><span class="metric-value">' + formatTime(route.oneWay) + '</span><span class="metric-hint">消息抵达</span></div>';

  const roundTrip = document.createElement('div');
  roundTrip.className = 'cell';
  roundTrip.innerHTML = '<div class="metric"><span class="metric-value">' + formatTime(route.roundTrip) + '</span><span class="metric-hint">最早收到回复</span></div>';

  const decision = document.createElement('div');
  decision.className = route.canWait ? 'cell' : 'diff';
  decision.innerHTML = '<div class="window-state"><span class="window-mark" aria-hidden="true"></span><span>' + (route.canWait ? '回复可在窗口内返回' : '必须先自主处置') + '</span></div>';

  comparison.append(dim, lane, oneWay, roundTrip, decision);
  if (index < routes.length - 1) {
    const line = document.createElement('div');
    line.className = 'rowline';
    comparison.appendChild(line);
  }
});

const routeSelect = document.getElementById('routeSelect');
document.querySelectorAll('.decision-window').forEach(function (el) {
  el.textContent = rounded(DECISION_WINDOW_SECONDS, 0) + ' 秒';
});
routes.forEach(function (route) {
  const option = document.createElement('option');
  option.value = route.id;
  option.textContent = route.name;
  routeSelect.appendChild(option);
});

const sendBtn = document.getElementById('sendBtn');
const waitBtn = document.getElementById('waitBtn');
const actBtn = document.getElementById('actBtn');
const resetBtn = document.getElementById('resetBtn');
const timer = document.getElementById('timer');
const reply = document.getElementById('reply');
const feedback = document.getElementById('feedback');
const deadline = document.getElementById('deadline');
deadline.dataset.label = rounded(DECISION_WINDOW_SECONDS, 0) + ' 秒期限';
deadline.setAttribute('aria-label', rounded(DECISION_WINDOW_SECONDS, 0) + ' 秒决策期限');
const tested = document.getElementById('tested');
const synthesis = document.getElementById('synthesis');
const completed = new Set();
let activeRoute = routes[0];
let tl = null;
let decisionOpen = false;

function selectedRoute() {
  return routes.find(function (route) { return route.id === routeSelect.value; });
}

function clearPulses() {
  gsap.set('.signal-pulse', { xPercent: 0, opacity: 0 });
}

function finishSignal() {
  timer.textContent = formatTime(activeRoute.roundTrip) + ' 往返';
  reply.textContent = '收到，正在回复';
}

function buildTimeline(route) {
  if (tl) tl.kill();
  clearPulses();
  const lane = '#lane-' + route.id;
  const out = lane + ' .signal--out';
  const back = lane + ' .signal--back';
  tl = gsap.timeline({
    paused: true,
    defaults: { ease: 'none' },
    onUpdate: function () {
      timer.textContent = formatTime(route.roundTrip * tl.progress()) + ' / ' + formatTime(route.roundTrip);
    },
    onComplete: finishSignal
  })
    .set(out, { opacity: 1 })
    .to(out, { x: function () { return document.querySelector(lane).clientWidth - 18; }, duration: 3 })
    .addLabel('remote')
    .set('.reply', { textContent: '收到，正在回复' })
    .set(out, { opacity: 0 })
    .set(back, { opacity: 1, x: function () { return document.querySelector(lane).clientWidth - 18; } })
    .to(back, { x: 0, duration: 3 })
    .set(back, { opacity: 0 });
  return tl;
}

function send() {
  activeRoute = selectedRoute();
  decisionOpen = true;
  waitBtn.disabled = false;
  actBtn.disabled = false;
  waitBtn.classList.remove('is-selected');
  actBtn.classList.remove('is-selected');
  deadline.classList.remove('is-danger');
  feedback.textContent = '把 ' + rounded(DECISION_WINDOW_SECONDS, 0) + ' 秒决策期限与最早往返时间比较。';
  reply.textContent = '消息正在前往地面……';
  timer.textContent = '0 秒 / ' + formatTime(activeRoute.roundTrip);

  const timeline = buildTimeline(activeRoute);
  if (Deck.reduced()) {
    timeline.progress(1).pause();
    finishSignal();
  } else {
    timeline.restart();
  }
}

function shakeWrong(button) {
  if (Deck.reduced()) return;
  gsap.timeline({ defaults: { duration: 0.07, ease: 'none' } })
    .to(button, { x: -8 })
    .to(button, { x: 8 })
    .to(button, { x: -5 })
    .to(button, { x: 0 });
}

function decide(choice) {
  if (!decisionOpen) return;
  const correct = activeRoute.canWait ? choice === 'wait' : choice === 'act';
  waitBtn.classList.toggle('is-selected', choice === 'wait' && correct);
  actBtn.classList.toggle('is-selected', choice === 'act' && correct);

  if (!correct) {
    deadline.classList.add('is-danger');
    const button = choice === 'wait' ? waitBtn : actBtn;
    shakeWrong(button);
    feedback.textContent = activeRoute.canWait
      ? '回复赶得上决策窗口；这次可以把地面答复纳入决定。'
      : '最早回复需超过 ' + rounded(DECISION_WINDOW_SECONDS, 0) + ' 秒，不能把地面答复放进这次决策窗口。';
    return;
  }

  deadline.classList.remove('is-danger');
  feedback.textContent = activeRoute.canWait
    ? '回复赶得上决策窗口。'
    : '回复回来前，决定已经必须作出。';
  completed.add(activeRoute.id);
  document.getElementById('done-' + activeRoute.id).classList.add('is-complete');
  tested.textContent = '已测试 ' + completed.size + ' / 3 条路线';
  decisionOpen = false;
  waitBtn.disabled = true;
  actBtn.disabled = true;

  if (completed.size === routes.length) {
    synthesis.classList.add('is-visible');
    feedback.textContent = '去得越远，“问地面再决定”越不可行，自主预案必须成为任务系统的一部分。';
  }
}

function reset() {
  if (tl) tl.kill();
  completed.clear();
  decisionOpen = false;
  routeSelect.value = routes[0].id;
  waitBtn.disabled = true;
  actBtn.disabled = true;
  waitBtn.classList.remove('is-selected');
  actBtn.classList.remove('is-selected');
  deadline.classList.remove('is-danger');
  document.querySelectorAll('.route-endpoint').forEach(function (el) { el.classList.remove('is-complete'); });
  synthesis.classList.remove('is-visible');
  tested.textContent = '已测试 0 / 3 条路线';
  timer.textContent = '待发送';
  reply.textContent = '先比较最早往返时间，再决定是否等待。';
  feedback.textContent = '距离不会让消息变慢，它让光也必须花时间赶路。';
  clearPulses();
}

sendBtn.addEventListener('click', send);
waitBtn.addEventListener('click', function () { decide('wait'); });
actBtn.addEventListener('click', function () { decide('act'); });
resetBtn.addEventListener('click', reset);
routeSelect.addEventListener('change', function () {
  if (tl) tl.kill();
  decisionOpen = false;
  waitBtn.disabled = true;
  actBtn.disabled = true;
  timer.textContent = '待发送';
  reply.textContent = '先比较最早往返时间，再决定是否等待。';
  clearPulses();
});

if (!Deck.reduced()) {
  gsap.timeline({ defaults: { ease: 'power2.out' } })
    .from('.earth-arc', { y: 70, opacity: 0, duration: 0.7 })
    .from('.signal-compare .dim, .signal-compare .cell, .signal-compare .diff', { x: 28, opacity: 0, duration: 0.35, stagger: 0.025 }, '-=0.25')
    .from('.metric-value, .route-distance', { opacity: 0, duration: 0.3, stagger: 0.025 }, '-=0.1');
}
</script>
</body>
</html>
