<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main { position: relative; }
  .lec-progress { overflow: visible; }
  .mars-board { position: relative; width: 100%; height: 100%; overflow: hidden; isolation: isolate; }
  .mars-photo { position: absolute; inset: 0; z-index: -3; opacity: .5; }
  .mars-photo img { filter: saturate(.42) brightness(.48) contrast(1.12); }
  .mars-photo::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(to bottom, var(--surface-0) 0%, transparent 36%, var(--surface-0) 100%); pointer-events: none; }
  .mars-photo::after { opacity: .45; }
  .board-head { height: 48px; padding: 0 var(--sp-3); }
  .instruction { color: var(--text-strong); font-size: var(--fs-sec); line-height: var(--lh-copy); }
  .progress-block { width: 230px; }
  .progress-label { color: var(--text-strong); font-size: var(--fs-sec); line-height: 1.35; }
  .progress-cells { display: flex; gap: var(--sp-2); }
  .progress-cell { width: 34px; height: 6px; border: var(--border); background: var(--surface-2); }
  .progress-cell.is-on { border-color: var(--primary); background: var(--primary); }
  .classes { flex-direction: row; height: 372px; gap: var(--sp-4); }
  .class-node { flex: 1 1 0; min-width: 0; height: 100%; padding-left: var(--sp-3) !important; margin-left: 0 !important; }
  .class-node::before { width: var(--sp-3) !important; }
  .class-node .box { height: 100%; box-sizing: border-box; padding: var(--sp-4); background: rgba(7,16,21,.84); backdrop-filter: blur(7px); transition: border-color 160ms ease, background 160ms ease; }
  .class-node .box > .bt { display: flex; align-items: baseline; justify-content: space-between; margin: calc(-1 * var(--sp-4)) calc(-1 * var(--sp-4)) var(--sp-3); padding: var(--sp-3) var(--sp-4); }
  .class-en { color: var(--primary-bright); font-family: var(--font-mono); font-size: var(--fs-label); }
  .class-zh { color: var(--text-muted); font-size: var(--fs-label); }
  .need { min-height: 42px; color: var(--text-strong); font-size: var(--fs-sec); line-height: var(--lh-copy); }
  .need-label { color: var(--text-muted); font-size: var(--fs-label); font-weight: 700; }
  .drop-slot { position: relative; display: flex; flex-direction: column; gap: var(--sp-2); min-height: 218px; margin-top: var(--sp-3); padding: var(--sp-3); box-sizing: border-box; border: 1px dashed var(--line-strong); background: rgba(13,26,32,.55); }
  .drop-slot::before { content: "投放缺口"; color: var(--text-faint); font-family: var(--font-mono); font-size: var(--fs-label); line-height: 1.35; }
  .drop-slot.has-item::before { display: none; }
  .class-node.is-over .box { border-color: var(--accent); background: rgba(255,204,77,.08); }
  .gap-result { display: none; position: relative; grid-template-columns: 72px minmax(0, 1fr); gap: var(--sp-1) var(--sp-2); padding: var(--sp-2) var(--sp-3) var(--sp-2) 18px; border-left: 2px solid var(--primary); background: var(--surface-teal); }
  .gap-result.is-open { display: grid; animation: result-in 240ms ease both; }
  .gap-result::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; border-left: 1px dashed var(--primary-dark); }
  .result-title { color: var(--primary-bright); font-family: var(--font-mono); font-size: var(--fs-label); font-weight: 700; line-height: 1.35; }
  .result-now, .result-effect { font-size: var(--fs-sec); line-height: var(--lh-copy); }
  .result-now { color: var(--text-strong); }
  .result-effect { color: var(--text-muted); }
  .result-arrow { position: absolute; left: 4px; top: 50%; color: var(--primary-bright); font-size: var(--fs-label); font-weight: 700; transform: translate(-50%, -50%); }
  .tray-zone { position: relative; height: 200px; }
  .body-model { position: absolute; top: -8px; left: 50%; width: 158px; height: 158px; color: var(--primary-bright); transform: translateX(-50%); opacity: .78; pointer-events: none; }
  .body-model svg { width: 100%; height: 100%; overflow: visible; }
  .body-model .ring { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 24 12 29 15; opacity: 0; transition: opacity 220ms ease; }
  .body-model .person { fill: none; stroke: currentColor; stroke-width: 2; }
  .body-model .scan { stroke: var(--primary-dark); stroke-width: 1; stroke-dasharray: 4 5; }
  .mars-board.is-complete .body-model .ring { opacity: 1; }
  .core-claim { position: absolute; top: 12px; left: 50%; width: 620px; padding: var(--sp-3) var(--sp-5); box-sizing: border-box; color: var(--text-strong); font-size: var(--fs-lead); font-weight: 700; line-height: var(--lh-copy); text-align: center; border: 1px solid var(--accent); background: rgba(7,16,21,.94); transform: translateX(-50%); opacity: 0; pointer-events: none; }
  .mars-board.is-complete .core-claim { opacity: 1; }
  .tray { position: absolute; right: 0; bottom: 0; left: 0; display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-3); border-top: var(--border); background: rgba(7,16,21,.8); }
  .gap-card { touch-action: none; width: 220px; min-height: 62px; flex: 0 0 220px; justify-content: flex-start; padding: var(--sp-3) var(--sp-4); text-align: left; border-left: 4px solid var(--accent); background: var(--surface-2); user-select: none; cursor: grab; transition: border-color 140ms ease, background 140ms ease; }
  .gap-card:active { cursor: grabbing; }
  .gap-card.is-dragging { position: relative; z-index: 20; border-color: var(--accent); background: var(--surface-yellow); transition: none; }
  .gap-card.is-placed { width: 100%; min-height: 40px; flex-basis: auto; padding: var(--sp-2) var(--sp-3); border-left-color: var(--primary); cursor: default; }
  .gap-card.is-placed > span { display: flex; align-items: baseline; gap: var(--sp-3); }
  .gap-card.is-correct { animation: correct-flash 460ms ease; }
  .gap-card.is-wrong { animation: wrong-shake 300ms ease; }
  .card-code { display: block; color: var(--text-strong); font-family: var(--font-mono); font-size: var(--fs-sec); font-weight: 700; line-height: 1.35; }
  .card-zh { display: block; color: var(--text-muted); font-size: var(--fs-label); line-height: 1.35; }
  .reset { align-self: center; flex: 0 0 auto; min-width: 150px; font-size: var(--fs-sec); }
  .feedback { position: absolute; left: var(--sp-3); top: 14px; width: 360px; min-height: 48px; color: var(--accent); font-size: var(--fs-sec); line-height: var(--lh-copy); }
  .source-mark { position: absolute; right: var(--sp-3); top: 18px; color: var(--text-faint); font-family: var(--font-mono); font-size: var(--fs-label); }
  @keyframes result-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes correct-flash { 0%,100% { border-color: var(--primary); } 45% { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); } }
  @keyframes wrong-shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 50% { transform: translateX(10px); } 75% { transform: translateX(-6px); } }
  .mars-board:not(.is-ready) .class-node { opacity: 0; transform: translateY(-12px); }
  .mars-board:not(.is-ready) .tray { opacity: 0; transform: translateY(14px); }
  .mars-board.is-ready .class-node, .mars-board.is-ready .tray { opacity: 1; transform: none; transition: opacity 280ms ease, transform 280ms ease; }
  .mars-board.is-ready .class-node:nth-child(2) { transition-delay: 80ms; }
  .mars-board.is-ready .class-node:nth-child(3) { transition-delay: 160ms; }
  @media (prefers-reduced-motion: reduce) {
    .mars-board *, .mars-board *::before, .mars-board *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<script>
  Lec.mount({index: 40, kicker: 'MARS · SURVIVAL GAPS', title: '火星不是一块空地', take: '火星同时缺少合适压力、温度、辐射屏蔽和可直接呼吸的大气。'});

  const sourceMarsPressurePa = Number.isFinite(Lec.K.marsMeanSurfacePressurePa) ? Lec.K.marsMeanSurfacePressurePa : 610;
  const sourceEarthPressurePa = Number.isFinite(Lec.K.earthSeaLevelPressurePa) ? Lec.K.earthSeaLevelPressurePa : 101325;
  const sourceMarsMeanTemperatureK = Number.isFinite(Lec.K.marsMeanSurfaceTemperatureK) ? Lec.K.marsMeanSurfaceTemperatureK : 210.15;
  const pressurePercent = Lec.P.percent(sourceMarsPressurePa, sourceEarthPressurePa);
  const meanTemperatureC = Lec.P.celsiusFromKelvin(sourceMarsMeanTemperatureK);
  const board = document.querySelector('.mars-board');
  const tray = document.getElementById('tray');
  const resetBtn = document.getElementById('resetBtn');
  const feedback = document.getElementById('feedback');
  const cards = [...document.querySelectorAll('.gap-card')];
  const nodes = [...document.querySelectorAll('.class-node')];
  const slots = new Map(nodes.map(node => [node.dataset.category, node.querySelector('.drop-slot')]));
  const categoryNames = { atmosphere: '大气条件', thermal: '热环境', shielding: '天然屏蔽' };
  const keyCategories = { '1': 'atmosphere', '2': 'thermal', '3': 'shielding' };
  const results = {
    pressure: {
      now: () => `${Lec.P.roundTo(sourceMarsPressurePa, 0)} Pa；地球海平面的 ${Lec.P.roundTo(pressurePercent, 2)}%`,
      effect: '无加压时，人体无法正常维持状态'
    },
    breathing: {
      now: () => '大气不可直接呼吸',
      effect: '无法直接取得呼吸所需氧气'
    },
    temperature: {
      now: () => `平均教学值 ${Lec.P.roundTo(meanTemperatureC, 0)} °C，随地点和时间大幅变化`,
      effect: '裸露人体无法维持合适热状态'
    },
    radiation: {
      now: () => '缺少地球式厚大气与全球磁场提供的屏蔽',
      effect: '地表辐射暴露高于地球表面'
    }
  };
  let placed = new Set();
  let drag = null;

  function localOffset(el) {
    let x = 0, y = 0, node = el;
    while (node && node !== board) {
      x += node.offsetLeft;
      y += node.offsetTop;
      node = node.offsetParent;
    }
    return { x, y, w: el.offsetWidth, h: el.offsetHeight };
  }

  function categoryAt(point) {
    for (const node of nodes) {
      const r = localOffset(node);
      if (point.x >= r.x && point.x <= r.x + r.w && point.y >= r.y && point.y <= r.y + r.h) return node.dataset.category;
    }
    return null;
  }

  function resultElement(card) {
    const data = results[card.dataset.id];
    const el = document.createElement('div');
    el.className = 'gap-result is-open';
    el.dataset.resultFor = card.dataset.id;
    el.innerHTML = `<div class="result-title">火星现状</div><div class="result-now">${data.now()}</div><div class="result-arrow">↓</div><div class="result-title">直接后果</div><div class="result-effect">${data.effect}</div>`;
    return el;
  }

  function updateProgress() {
    const count = placed.size;
    document.getElementById('progressText').textContent = `${count} / ${cards.length}`;
    document.querySelectorAll('.progress-cell').forEach((cell, i) => cell.classList.toggle('is-on', i < count));
    const complete = count === cards.length;
    board.classList.toggle('is-complete', complete);
    document.getElementById('coreClaim').setAttribute('aria-hidden', String(!complete));
    if (complete) feedback.textContent = '';
  }

  function place(card, category) {
    if (placed.has(card.dataset.id)) return;
    if (category !== card.dataset.category) {
      const text = `这张卡描述的是${categoryNames[card.dataset.category]}，不是当前这一类。`;
      feedback.textContent = text;
      card.classList.remove('is-wrong');
      void card.offsetWidth;
      card.classList.add('is-wrong');
      card.setAttribute('aria-label', text);
      return;
    }
    const slot = slots.get(category);
    card.style.transform = '';
    card.classList.remove('is-dragging', 'is-wrong');
    card.classList.add('is-placed', 'is-correct');
    card.setAttribute('aria-label', `${card.innerText.replace(/\n/g, ' ')}，已归入${categoryNames[category]}`);
    slot.append(card, resultElement(card));
    slot.classList.add('has-item');
    placed.add(card.dataset.id);
    feedback.textContent = `${card.querySelector('.card-zh').textContent}已归入${categoryNames[category]}。`;
    updateProgress();
  }

  cards.forEach(card => {
    card.addEventListener('pointerdown', event => {
      if (placed.has(card.dataset.id)) return;
      const p = Deck.pt(board, event);
      drag = { card, startX: p.x, startY: p.y };
      card.setPointerCapture(event.pointerId);
      card.classList.add('is-dragging');
      feedback.textContent = '';
    });
    card.addEventListener('pointermove', event => {
      if (!drag || drag.card !== card) return;
      const p = Deck.pt(board, event);
      card.style.transform = `translate(${p.x - drag.startX}px, ${p.y - drag.startY}px)`;
      const over = categoryAt(p);
      nodes.forEach(node => node.classList.toggle('is-over', node.dataset.category === over));
    });
    card.addEventListener('pointerup', event => {
      if (!drag || drag.card !== card) return;
      const p = Deck.pt(board, event);
      const category = categoryAt(p);
      nodes.forEach(node => node.classList.remove('is-over'));
      card.classList.remove('is-dragging');
      card.style.transform = '';
      drag = null;
      if (category) place(card, category);
    });
    card.addEventListener('pointercancel', () => {
      card.classList.remove('is-dragging');
      card.style.transform = '';
      nodes.forEach(node => node.classList.remove('is-over'));
      drag = null;
    });
    card.addEventListener('keydown', event => {
      const category = keyCategories[event.key];
      if (!category || placed.has(card.dataset.id)) return;
      event.preventDefault();
      place(card, category);
    });
  });

  resetBtn.addEventListener('click', () => {
    placed = new Set();
    cards.forEach(card => {
      card.className = 'gap-card';
      card.style.transform = '';
      card.removeAttribute('aria-label');
      tray.insertBefore(card, resetBtn);
    });
    document.querySelectorAll('.gap-result').forEach(el => el.remove());
    document.querySelectorAll('.drop-slot').forEach(el => el.classList.remove('has-item'));
    feedback.textContent = '';
    updateProgress();
    cards[0].focus();
  });

  updateProgress();
  requestAnimationFrame(() => board.classList.add('is-ready'));
</script>
</body>
</html>
