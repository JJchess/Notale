<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .mission-generalization {
    position: relative;
    grid-template-rows: 62px minmax(0, 1fr) 104px;
    gap: var(--sp-3);
    height: 100%;
  }
  .mission-generalization > .claim {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-5);
    min-width: 0;
    border-left-color: var(--line-strong);
    background: var(--surface-1);
    transition: border-color 180ms ease, background 180ms ease;
  }
  .mission-generalization.is-complete > .claim {
    border-left-color: var(--accent);
    background: var(--surface-yellow);
  }
  .claim-copy {
    display: flex;
    align-items: center;
    align-self: stretch;
    min-width: 0;
  }
  .claim-label {
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 600;
  }
  .claim-state {
    flex: 0 0 auto;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-lead);
    white-space: nowrap;
  }
  .is-complete .claim-state { color: var(--primary-bright); }
  .mission-generalization > .trunk {
    top: 52px;
    bottom: 74px;
    background: var(--line-strong);
    transition: background 180ms ease, box-shadow 180ms ease;
  }
  .mission-generalization.is-complete > .trunk {
    background: var(--primary);
    box-shadow: 0 0 14px rgba(53, 198, 180, .55);
  }
  .dispatch-console {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
    min-width: 0;
    min-height: 0;
    padding: var(--sp-4);
    overflow: visible;
    border: var(--border);
    border-radius: var(--radius-3);
    background: var(--surface-glass);
    box-shadow: var(--shadow-panel);
    z-index: 2;
  }
  .event-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-5);
    min-height: 54px;
  }
  .event-copy { min-width: 0; }
  .event-kicker {
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 700;
  }
  .event-title {
    color: var(--text-strong);
    font-family: var(--font-narrow);
    font-size: var(--fs-h2);
    font-weight: 700;
    line-height: 1.3;
  }
  .round-status {
    display: flex;
    align-items: center;
    gap: var(--sp-4);
    flex: 0 0 auto;
  }
  .round-count {
    color: var(--text-strong);
    font-family: var(--font-mono);
    font-size: var(--fs-sec);
  }
  .reset-btn[hidden] { display: none; }
  .reset-icon { font-size: 20px; line-height: 1; }
  .lec-progress { overflow: visible; }
  .event-queue {
    display: flex;
    flex: 0 0 78px;
    gap: var(--sp-3);
    min-height: 78px;
  }
  .event-log {
    display: flex;
    flex: 1 1 0;
    align-items: center;
    gap: var(--sp-3);
    min-width: 0;
    padding: var(--sp-3) var(--sp-4);
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
    border: var(--border);
    border-left: 3px solid var(--line-strong);
    border-radius: var(--radius-2);
    background: var(--surface-1);
  }
  .event-log.is-current {
    color: var(--text-strong);
    border-left-color: var(--accent);
    background: var(--surface-yellow);
  }
  .event-log.is-done {
    border-left-color: var(--primary);
    background: var(--surface-teal);
  }
  .log-state {
    flex: 0 0 auto;
    color: var(--text-faint);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 700;
  }
  .is-current .log-state { color: var(--accent); }
  .is-done .log-state { color: var(--primary-bright); }
  .protocol {
    position: relative;
    display: flex;
    align-items: stretch;
    gap: 42px;
    flex: 1 1 112px;
    min-height: 112px;
  }
  .protocol::before {
    content: "";
    position: absolute;
    top: 53px;
    right: 9%;
    left: 9%;
    height: 2px;
    background: repeating-linear-gradient(90deg, var(--primary-dark) 0 10px, transparent 10px 17px);
  }
  .protocol.is-flowing::before { background: var(--primary); }
  .slot-wrap {
    position: relative;
    display: flex;
    flex: 1 1 0;
    flex-direction: column;
    gap: var(--sp-2);
    min-width: 0;
    z-index: 1;
  }
  .slot-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--text-muted);
    font-size: var(--fs-label);
    font-weight: 700;
  }
  .protocol-word { color: var(--primary-bright); font-weight: 600; }
  .slot {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1 1 auto;
    min-height: 70px;
    box-sizing: border-box;
    padding: var(--sp-3);
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
    text-align: center;
    border: 2px dashed var(--line-strong);
    border-radius: var(--radius-2);
    background: var(--surface-1);
    transition: border-color 140ms ease, background 140ms ease;
  }
  .slot.is-target {
    border-color: var(--accent);
    background: var(--surface-yellow);
  }
  .slot.is-filled {
    color: var(--text-strong);
    border-style: solid;
    border-color: var(--primary);
    background: var(--surface-teal);
  }
  .slot-arrow {
    position: absolute;
    top: 45px;
    right: -30px;
    color: var(--primary-bright);
    font-family: var(--font-mono);
    font-size: var(--fs-h2);
  }
  .conflict-line { color: var(--accent); }
  .feedback {
    min-height: 30px;
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
  }
  .feedback.is-error { color: var(--danger); }
  .feedback.is-ok { color: var(--primary-bright); }
  .crew-dock {
    display: flex;
    align-items: stretch;
    gap: var(--sp-3);
    flex: 0 0 76px;
    min-height: 76px;
  }
  .role-card {
    flex: 1 1 0;
    justify-content: flex-start;
    min-width: 0;
    min-height: 76px;
    padding: var(--sp-3);
    text-align: left;
    border-left: 3px solid var(--primary-dark);
    background: var(--surface-2);
    touch-action: none;
    user-select: none;
  }
  .role-card { color: var(--text-strong); font-size: var(--fs-sec); line-height: var(--lh-copy); }
  .role-card::first-line { font-weight: 700; }
  .role-card br + * { color: var(--text-muted); }
  .role-card.is-used { opacity: .38; }
  .role-card.is-dragging {
    position: relative;
    z-index: 8;
    border-color: var(--accent);
    box-shadow: var(--shadow-panel);
  }
  .role-card.is-wrong { animation: wrong-shake 260ms ease; }
  @keyframes wrong-shake {
    0%,100% { transform: translateX(0); }
    30% { transform: translateX(-9px); }
    65% { transform: translateX(9px); }
  }
  .mission-generalization > .supports {
    --support-cols: 3;
    align-items: stretch;
    gap: var(--sp-4);
    padding-top: var(--sp-4);
    z-index: 1;
  }
  .mission-generalization > .supports::before,
  .mission-generalization .support::before { background: var(--line-strong); }
  .mission-generalization .support {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    min-height: 88px;
    padding: var(--sp-3) var(--sp-4);
    border-top-color: var(--line-strong);
    background: var(--surface-1);
  }
  .mission-generalization .support.is-active {
    border-top-color: var(--accent);
    background: var(--surface-yellow);
  }
  .mission-generalization .support.is-verified {
    border-top-color: var(--primary);
    background: var(--surface-teal);
  }
  .support-light {
    width: 14px;
    height: 14px;
    flex: 0 0 14px;
    border: 2px solid var(--line-strong);
    border-radius: 50%;
    background: var(--surface-3);
  }
  .is-active .support-light { border-color: var(--accent); background: var(--accent); }
  .is-verified .support-light { border-color: var(--primary); background: var(--primary); }
  .support-copy { min-width: 0; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body data-page="41" data-total="52">
<div id="stage">
<main id="main"></main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
Lec.mount({index: 41, kicker: 'MISSION RELIABILITY', title: '可靠性不在某一个人身上', take: '封闭任务的可靠性来自角色互补、沟通协议和冲突处理。'});

(function () {
  const roles = [
    { id: 'commander', name: '指令长', skill: '排序与裁决' },
    { id: 'engineer', name: '系统工程师', skill: '设备诊断与维修' },
    { id: 'doctor', name: '医官', skill: '健康判断与负荷监测' },
    { id: 'specialist', name: '任务专家', skill: '实验、样品与操作程序' }
  ];
  const events = [
    { title: '二氧化碳净化器报警', answer: ['engineer', 'doctor', 'commander'] },
    { title: '舱员胸痛，同时天线离线', answer: ['doctor', 'engineer', 'commander'] },
    { title: '样品冷柜升温，剩余电力受限', answer: ['specialist', 'engineer', 'commander'] }
  ];
  const slotNames = ['主责', '复核', '裁决'];
  const protocolWords = ['报告事实', '提出方案', '复述确认'];
  const rng = new Math.seedrandom(Lec.K.pageSeed41);

  function shuffled(list) {
    const copy = list.slice();
    for (let i = copy.length - 1; i > 0; i -= 1) {
      const j = Math.floor(rng() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  const fixedRoles = shuffled(roles);
  const fixedEvents = shuffled(events);
  const main = document.getElementById('main');
  main.innerHTML = `
    <section class="k-generalization mission-generalization full" aria-label="舱组调度与任务可靠性">
      <div class="claim">
        <div class="claim-copy">可靠性来自互补角色、闭环沟通与明确裁决的组合</div>
        <div class="claim-state" id="missionState">任务待调度</div>
      </div>
      <div class="trunk" aria-hidden="true"></div>
      <section class="dispatch-console min0 no-pan" aria-label="舱组角色调度台">舱组调度台
        <div class="event-line">
          <div class="event-copy min0">
            <div class="event-kicker">封闭任务事件</div>
            <div class="event-title" id="eventTitle"></div>
          </div>
          <div class="round-status">
            <span class="round-count" id="roundCount"></span>
            <button class="btn reset-btn" id="resetBtn" type="button" hidden aria-label="重新调度"><span class="reset-icon" aria-hidden="true">↻</span>重新调度</button>
          </div>
        </div>
        <div class="event-queue" id="eventQueue" aria-label="三轮值班日志"></div>
        <div class="protocol" id="protocol" aria-label="报告事实、提出方案、复述确认的沟通闭环">
          ${slotNames.map((name, i) => `
            <div class="slot-wrap min0">
              <div class="slot-label"><span>${name}</span><span class="protocol-word">${protocolWords[i]}</span></div>
              <div class="slot" data-slot="${i}" aria-label="${name}槽位">拖入角色</div>
              ${i < 2 ? '<span class="slot-arrow" aria-hidden="true">→</span>' : ''}
            </div>`).join('')}
        </div>
        <div class="feedback" id="feedback" aria-live="polite">拖动角色卡；键盘可用左右键选择槽位，按 Enter 放置。</div>
        <div class="crew-dock" id="crewDock" aria-label="舱组人员席"></div>
      </section>
      <div class="supports" aria-label="任务可靠性的三条支撑">
        <div class="support" data-support="0"><span class="support-light" aria-hidden="true"></span>角色互补 · 未验证<br>专长不同，任务才有人主责、有人复核</div>
        <div class="support" data-support="1"><span class="support-light" aria-hidden="true"></span>沟通协议 · 未验证<br>报告事实 → 提出方案 → 复述确认</div>
        <div class="support" data-support="2"><span class="support-light" aria-hidden="true"></span>冲突处理 · 未验证<br>按任务优先级裁决并记录</div>
      </div>
    </section>`;

  const root = main.querySelector('.mission-generalization');
  const titleEl = document.getElementById('eventTitle');
  const roundEl = document.getElementById('roundCount');
  const feedbackEl = document.getElementById('feedback');
  const queueEl = document.getElementById('eventQueue');
  const dockEl = document.getElementById('crewDock');
  const protocolEl = document.getElementById('protocol');
  const missionEl = document.getElementById('missionState');
  const resetBtn = document.getElementById('resetBtn');
  const slots = Array.from(main.querySelectorAll('.slot'));
  const supportEls = Array.from(main.querySelectorAll('.support'));
  let state;
  let drag = null;

  function freshState() {
    return { round: 0, placements: [null, null, null], verified: [false, false, false], completed: false, keyboardSlot: 0 };
  }

  function roleById(id) { return roles.find(role => role.id === id); }

  function setFeedback(text, kind) {
    feedbackEl.textContent = text;
    feedbackEl.className = `feedback${kind ? ` is-${kind}` : ''}`;
  }

  function render() {
    const current = fixedEvents[state.round] || fixedEvents[fixedEvents.length - 1];
    titleEl.textContent = state.completed ? '三轮事件均已闭合' : current.title;
    roundEl.textContent = state.completed ? '3 / 3 轮完成' : `第 ${state.round + 1} / 3 轮`;
    missionEl.textContent = state.completed ? '任务可继续' : '任务待调度';
    root.classList.toggle('is-complete', state.completed);
    protocolEl.classList.toggle('is-flowing', state.placements.every(Boolean));
    resetBtn.hidden = !state.completed;

    queueEl.innerHTML = '';
    fixedEvents.forEach((event, index) => {
      const log = document.createElement('div');
      log.className = 'event-log';
      log.classList.toggle('is-current', !state.completed && index === state.round);
      log.classList.toggle('is-done', state.completed || index < state.round);
      const status = state.completed || index < state.round ? '已闭合' : (index === state.round ? '处理中' : '待处理');
      log.innerHTML = `<span class="log-state">${status}</span><span>${event.title}</span>`;
      queueEl.appendChild(log);
    });

    slots.forEach((slot, index) => {
      const role = roleById(state.placements[index]);
      slot.textContent = role ? `${role.name} · ${role.skill}` : '拖入角色';
      slot.classList.toggle('is-filled', Boolean(role));
      slot.classList.toggle('is-target', !state.completed && index === state.keyboardSlot);
    });

    supportEls.forEach((el, index) => {
      const labels = ['角色互补', '沟通协议', '冲突处理'];
      const details = ['专长不同，任务才有人主责、有人复核', '报告事实 → 提出方案 → 复述确认', '按任务优先级裁决并记录'];
      const status = state.verified[index] ? '已验证' : (index === state.round && !state.completed ? '验证中' : '未验证');
      el.classList.toggle('is-verified', state.verified[index]);
      el.classList.toggle('is-active', !state.verified[index] && index === state.round && !state.completed);
      el.innerHTML = `<span class="support-light" aria-hidden="true"></span>${labels[index]} · ${status}<br>${details[index]}`;
    });

    dockEl.innerHTML = '';
    fixedRoles.forEach(role => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'role-card';
      button.dataset.role = role.id;
      button.disabled = state.completed;
      button.classList.toggle('is-used', state.placements.includes(role.id));
      button.setAttribute('aria-label', `${role.name}，${role.skill}`);
      button.innerHTML = `${role.name}<br>${role.skill}`;
      button.addEventListener('pointerdown', beginDrag);
      button.addEventListener('keydown', handleRoleKey);
      dockEl.appendChild(button);
    });
  }

  function errorFor(slotIndex) {
    if (slotIndex === 0) {
      const expected = roleById(fixedEvents[state.round].answer[0]);
      return `主责需要${expected.skill}专长。`;
    }
    if (slotIndex === 1 && state.placements[0] === drag?.roleId) return '复核不能与主责为同一人。';
    if (slotIndex === 1) return `复核需要${roleById(fixedEvents[state.round].answer[1]).skill}专长。`;
    return '冲突尚无裁决负责人。';
  }

  function place(roleId, slotIndex, sourceEl) {
    if (state.completed || state.placements.includes(roleId)) return;
    const expected = fixedEvents[state.round].answer[slotIndex];
    if (roleId !== expected) {
      drag = { roleId };
      setFeedback(errorFor(slotIndex), 'error');
      drag = null;
      sourceEl.classList.add('is-wrong');
      window.setTimeout(() => sourceEl.classList.remove('is-wrong'), 280);
      return;
    }
    state.placements[slotIndex] = roleId;
    state.keyboardSlot = Math.min(slotIndex + 1, 2);
    setFeedback(`${slotNames[slotIndex]}已确认：${roleById(roleId).name}。`, 'ok');
    render();
    if (state.placements.every(Boolean)) finishRound();
  }

  function finishRound() {
    state.verified[state.round] = true;
    protocolEl.classList.add('is-flowing');
    if (state.round === fixedEvents.length - 1) {
      state.completed = true;
      setFeedback('不同专长完成主责、复核与裁决；三条支撑汇入任务可靠性。', 'ok');
      render();
      return;
    }
    setFeedback('沟通闭环完成，进入下一事件。', 'ok');
    window.setTimeout(() => {
      state.round += 1;
      state.placements = [null, null, null];
      state.keyboardSlot = 0;
      render();
      setFeedback('新事件进入：先确定主责，再安排复核与裁决。', '');
    }, Deck.reduced() ? 0 : 520);
  }

  function beginDrag(event) {
    const button = event.currentTarget;
    if (button.disabled || button.classList.contains('is-used')) return;
    drag = { roleId: button.dataset.role, el: button, x: event.clientX, y: event.clientY };
    button.setPointerCapture(event.pointerId);
    button.classList.add('is-dragging');
    button.addEventListener('pointermove', moveDrag);
    button.addEventListener('pointerup', endDrag, { once: true });
    button.addEventListener('pointercancel', cancelDrag, { once: true });
  }

  function moveDrag(event) {
    if (!drag) return;
    const dx = (event.clientX - drag.x) / Deck.s;
    const dy = (event.clientY - drag.y) / Deck.s;
    drag.el.style.transform = `translate(${dx}px, ${dy}px)`;
    const point = Deck.pt(protocolEl, event);
    slots.forEach((slot, index) => {
      const left = slot.offsetLeft + slot.parentElement.offsetLeft;
      const top = slot.offsetTop;
      const inside = point.x >= left && point.x <= left + slot.offsetWidth && point.y >= top && point.y <= top + slot.offsetHeight;
      slot.classList.toggle('is-target', inside);
      if (inside) state.keyboardSlot = index;
    });
  }

  function endDrag(event) {
    if (!drag) return;
    const current = drag;
    const point = Deck.pt(protocolEl, event);
    let target = -1;
    slots.forEach((slot, index) => {
      const left = slot.offsetLeft + slot.parentElement.offsetLeft;
      const top = slot.offsetTop;
      if (point.x >= left && point.x <= left + slot.offsetWidth && point.y >= top && point.y <= top + slot.offsetHeight) target = index;
    });
    cleanupDrag(current.el);
    if (target >= 0) place(current.roleId, target, current.el);
    else setFeedback('角色卡需放入主责、复核或裁决槽。', 'error');
  }

  function cancelDrag() {
    if (!drag) return;
    cleanupDrag(drag.el);
  }

  function cleanupDrag(el) {
    el.classList.remove('is-dragging');
    el.style.transform = '';
    el.removeEventListener('pointermove', moveDrag);
    drag = null;
    render();
  }

  function handleRoleKey(event) {
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      state.keyboardSlot = Deck.clamp(state.keyboardSlot + (event.key === 'ArrowRight' ? 1 : -1), 0, 2);
      render();
      const same = dockEl.querySelector(`[data-role="${event.currentTarget.dataset.role}"]`);
      if (same) same.focus();
      setFeedback(`当前目标：${slotNames[state.keyboardSlot]}槽。按 Enter 放置。`, '');
    } else if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      place(event.currentTarget.dataset.role, state.keyboardSlot, event.currentTarget);
    }
  }

  function reset() {
    state = freshState();
    setFeedback('拖动角色卡；键盘可用左右键选择槽位，按 Enter 放置。', '');
    render();
  }

  resetBtn.addEventListener('click', reset);
  reset();
})();
</script>
</body>
</html>
