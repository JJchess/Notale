<script src="assets/base.js"></script><script src="assets/lec.js"></script><script>
Lec.mount({index: 42, kicker: 'SUIT SYSTEM / 42', title: '穿在身上的微型环境', take: '宇航服不是衣服，而是随身携带压力、供氧、排热与通信的微型环境。'});
(()=>{const work=document.getElementById('work'),pieces=[...document.querySelectorAll('.pipe')],ports=[...document.querySelectorAll('.port')],lines=[...document.querySelectorAll('.done')],rings=[...document.querySelectorAll('.rings i')],steps=[...document.querySelectorAll('.steps .step')],feedback=document.getElementById('feedback'),count=document.getElementById('count'),take=document.getElementById('take42'),reset=document.getElementById('reset'),pulse=document.getElementById('pulse');let made=new Set(),sel=0,drag=null;function select(i){sel=(i+4)%4;ports.forEach((p,j)=>p.classList.toggle('sel',j===sel))}function update(){const n=made.size;count.textContent=`热控回路 ${n}/4`;rings.forEach((r,i)=>r.classList.toggle('on',i<n));steps.forEach((s,i)=>{s.classList.toggle('is-past',i<n);s.classList.toggle('is-current',i===Math.min(n,4))});if(n===4){feedback.textContent='回路闭合：冷却水持续带走热量并返回冷却服。';take.classList.add('show');reset.classList.add('show');pulse.classList.add('run');document.querySelectorAll('.branch').forEach(x=>x.classList.add('lit'))}}function connect(piece,target){const i=+piece.dataset.i;if(target!==i||made.has(i)){piece.classList.add('bad');feedback.textContent='这里不是冷却水接口：请沿冷却服、水泵、散热单元和回流管闭合回路。';setTimeout(()=>piece.classList.remove('bad'),360);return}made.add(i);piece.classList.add('used');ports[i].classList.add('on');lines[i].classList.add('on');feedback.textContent=['身体产生的热进入贴身冷却层。','管网中的水吸收热量，泵推动它循环。','热量经背包散向舱外环境。','降温后的水返回冷却服。'][i];select(Math.min(i+1,3));update()}function nearest(p){const scale=Math.min(work.offsetWidth/760,work.offsetHeight/680),ox=(work.offsetWidth-760*scale)/2,oy=(work.offsetHeight-680*scale)/2;return ports.reduce((best,port,i)=>{const x=ox+port.cx.baseVal.value*scale,y=oy+port.cy.baseVal.value*scale,d=(p.x-x)**2+(p.y-y)**2;return d<best.d?{i,d}:best},{i:0,d:Infinity})}pieces.forEach(piece=>{piece.addEventListener('pointerdown',e=>{const p=Deck.pt(work,e);drag={piece,id:e.pointerId,x:p.x,y:p.y};piece.setPointerCapture(e.pointerId);piece.classList.add('drag')});piece.addEventListener('pointermove',e=>{if(!drag||drag.piece!==piece)return;const p=Deck.pt(work,e);piece.style.transform=`translate(${p.x-drag.x}px,${p.y-drag.y}px)`;select(nearest(p).i)});piece.addEventListener('pointerup',e=>{if(!drag)return;const p=Deck.pt(work,e),n=nearest(p);piece.classList.remove('drag');piece.style.transform='';drag=null;connect(piece,n.d<6000?n.i:-1)});piece.addEventListener('focus',()=>select(+piece.dataset.i));piece.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();select(sel+1)}if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();select(sel-1)}if(e.key==='Enter'||e.key===' '){e.preventDefault();connect(piece,sel)}})});reset.addEventListener('click',()=>{made=new Set();pieces.forEach(p=>p.classList.remove('used','bad'));ports.forEach(p=>p.classList.remove('on'));lines.forEach(l=>l.classList.remove('on'));take.classList.remove('show');reset.classList.remove('show');pulse.classList.remove('run');document.querySelectorAll('.branch').forEach(x=>x.classList.remove('lit'));feedback.textContent='';select(0);update();pieces[0].focus()});select(0);update()})();
</script></body></html>
