<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  progress.lec-progress {
    display: block;
    overflow: visible;
  }

  .trade-page {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }

  .trade-claim {
    flex: 0 0 auto;
    padding: var(--sp-3) var(--sp-5);
    border-left: 5px solid var(--accent);
    background: var(--surface-yellow);
    color: var(--text-strong);
    font-size: var(--fs-lead);
    font-weight: 700;
    line-height: var(--lh-copy);
  }

  .trade-space {
    position: relative;
    flex: 1 1 0;
    display: flex;
    gap: var(--sp-5);
    min-width: 0;
    min-height: 0;
  }

  .budget-ledger {
    flex: 0 0 650px;
    min-width: 0;
    position: relative;
    z-index: 2;
  }

  .budget-ledger > .box {
    height: 100%;
    box-sizing: border-box;
    padding: var(--sp-4);
  }

  .budget-ledger > .box > .bt {
    margin: calc(-1 * var(--sp-4)) calc(-1 * var(--sp-4)) var(--sp-2);
    padding: var(--sp-2) var(--sp-4);
  }

  .budget-ledger .lv {
    margin-left: 0;
    padding-left: var(--sp-4);
  }

  .ledger-row {
    display: grid;
    grid-template-columns: 112px minmax(0, 1fr) 94px;
    align-items: center;
    gap: var(--sp-3);
    min-height: 52px;
    padding: var(--sp-1) var(--sp-3);
    box-sizing: border-box;
    border-bottom: var(--border);
    background: rgba(7, 16, 21, 0.38);
  }

  .ledger-row:last-child {
    border-bottom: 0;
  }

  .ledger-row.is-warning {
    box-shadow: inset 3px 0 0 var(--danger);
    background: rgba(255, 113, 104, 0.09);
  }

  .row-name {
    color: var(--text-strong);
    font-family: var(--font-narrow);
    font-size: var(--fs-h2);
    font-weight: 700;
    line-height: 1.3;
  }

  .row-question {
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
  }

  .row-value {
    color: var(--primary-bright);
    font-family: var(--font-mono);
    font-size: var(--fs-lead);
    font-weight: 700;
    line-height: 1.35;
    text-align: right;
    white-space: nowrap;
  }

  .risk-box {
    margin-top: var(--sp-2) !important;
    padding: var(--sp-3) var(--sp-4) !important;
    border-left-color: var(--accent) !important;
    background: var(--surface-yellow) !important;
  }

  .risk-box .bt {
    margin: calc(-1 * var(--sp-3)) calc(-1 * var(--sp-4)) var(--sp-2) !important;
    padding: var(--sp-2) var(--sp-4) !important;
    background: rgba(255, 204, 77, 0.09) !important;
    font-size: var(--fs-lead) !important;
  }

  .risk-summary {
    color: var(--text-strong);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
  }

  .risk-summary strong {
    color: var(--accent);
  }

  .balance-zone {
    position: relative;
    z-index: 2;
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dial-wrap {
    position: relative;
    width: 478px;
    height: 478px;
    flex: 0 0 478px;
  }

  #balance-dial {
    display: block;
    width: 478px;
    height: 478px;
    overflow: visible;
    touch-action: none;
  }

  .sector {
    cursor: grab;
    outline: none;
    transition: opacity 140ms ease, stroke-width 140ms ease;
  }

  .sector:active {
    cursor: grabbing;
  }

  .sector:focus-visible {
    stroke: var(--focus);
    stroke-width: 5px;
  }

  .sector.is-warning {
    stroke: var(--danger);
    stroke-width: 5px;
  }

  .dial-track {
    fill: none;
    stroke: var(--line);
  }

  .dial-tick {
    fill: var(--text-faint);
    font-family: var(--font-mono);
    font-size: var(--fs-tick);
  }

  .dial-label {
    fill: var(--text-strong);
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 700;
    pointer-events: none;
  }

  .dial-center-main {
    fill: var(--text-strong);
    font-family: var(--font-narrow);
    font-size: 28px;
    font-weight: 700;
  }

  .dial-center-sub {
    fill: var(--text-muted);
    font-family: var(--font-sans);
    font-size: 14px;
  }

  .handle-dot {
    fill: var(--accent);
    stroke: var(--accent-ink);
    stroke-width: 2px;
    pointer-events: none;
  }

  .saved-outline {
    fill: none;
    stroke: var(--primary-bright);
    stroke-width: 2px;
    opacity: 0.28;
    pointer-events: none;
  }

  .closure-ring {
    fill: none;
    stroke: var(--primary-bright);
    stroke-width: 4px;
    opacity: 0;
  }

  .closure-ring.flash {
    animation: ring-flash 560ms ease-out;
  }

  @keyframes ring-flash {
    0% { opacity: 0; stroke-dasharray: 0 1600; }
    35% { opacity: 1; }
    100% { opacity: 0; stroke-dasharray: 1600 0; }
  }

  .connector-map {
    position: absolute;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }

  .connector-map path {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2px;
    opacity: 0.62;
  }

  .connector-map circle {
    fill: var(--accent);
  }

  .trade-controls {
    flex: 0 0 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-4);
    min-width: 0;
    padding: 0 var(--sp-2);
    border-top: var(--border);
  }

  .progress-group {
    display: flex;
    align-items: center;
    gap: var(--sp-4);
    min-width: 0;
  }

  .scheme-marks {
    display: flex;
    gap: var(--sp-2);
  }

  .scheme-mark {
    width: 34px;
    height: 20px;
    border: 2px solid var(--line-strong);
    border-radius: 50%;
    box-sizing: border-box;
  }

  .scheme-mark.is-filled {
    border-color: var(--primary-bright);
    background: var(--surface-teal);
  }

  .progress-text,
  .feedback {
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
  }

  .progress-text {
    color: var(--text-muted);
  }

  .feedback {
    flex: 1 1 0;
    color: var(--text-strong);
    text-align: center;
  }

  .feedback.is-error {
    color: var(--danger);
  }

  .trade-controls .btn {
    font-size: var(--fs-sec);
  }

  .btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .sector { transition: none; }
    .closure-ring.flash { animation: none; opacity: 1; }
  }
</style>
</head>
<body data-page="43" data-total="52">
<div id="stage">
<main id="main">
  <section class="trade-page" aria-label="任务风险配平盘">
    <p class="trade-claim">工程方案不是把每项都调到最大，而是在固定预算中决定哪些余量必须保留。</p>

    <div class="trade-space min0">
      <section class="budget-ledger k-classification min0" aria-labelledby="inputs-title">
        <div class="box">
          <h2 class="bt" id="inputs-title">可分配条件 <span class="muted fs-sec">共享 <span id="budget-total"></span> 任务点</span></h2>
          <div class="lv" style="--level:1">
            <div class="ledger-row" data-key="payload">
              <span class="row-name">载荷</span>
              <span class="row-question">能带多少任务设备与物资？</span>
              <span class="row-value" id="value-payload"></span>
            </div>
            <div class="ledger-row" data-key="redundancy">
              <span class="row-name">冗余</span>
              <span class="row-question">故障后还有多少替代路径？</span>
              <span class="row-value" id="value-redundancy"></span>
            </div>
            <div class="ledger-row" data-key="time">
              <span class="row-name">时间</span>
              <span class="row-question">延误、检查和修复有多少余地？</span>
              <span class="row-value" id="value-time"></span>
            </div>
            <div class="ledger-row" data-key="crew">
              <span class="row-name">人员</span>
              <span class="row-question">监控、维修与休息能否轮换？</span>
              <span class="row-value" id="value-crew"></span>
            </div>
          </div>
          <div class="box risk-box">
            <h3 class="bt">综合后果：风险暴露</h3>
            <p class="risk-summary" id="risk-summary">当前各项均保留警戒余量。</p>
          </div>
        </div>
      </section>

      <svg class="connector-map" viewBox="0 0 1408 500" preserveAspectRatio="none" aria-hidden="true">
        <path d="M 610 100 C 760 100, 760 250, 1090 250"></path>
        <path d="M 610 158 C 780 158, 780 250, 1090 250"></path>
        <path d="M 610 216 C 800 216, 800 250, 1090 250"></path>
        <path d="M 610 274 C 820 274, 820 250, 1090 250"></path>
        <circle cx="1090" cy="250" r="5"></circle>
      </svg>

      <section class="balance-zone min0" aria-label="径向任务预算配平盘">
        <div class="dial-wrap no-pan">
          <svg id="balance-dial" viewBox="0 0 520 520" role="group" aria-label="四项任务点分配圆盘。拖动扇区改变它与下一项的分配；聚焦后可用方向键调整。">
            <title>任务预算配平盘</title>
            <desc>四个扇区合计为固定任务预算。每个扇区可拖动或用方向键调整。</desc>
          </svg>
        </div>
      </section>
    </div>

    <div class="trade-controls">
      <div class="progress-group">
        <div class="scheme-marks" aria-hidden="true">
          <span class="scheme-mark"></span><span class="scheme-mark"></span><span class="scheme-mark"></span>
        </div>
        <span class="progress-text" id="progress-text"></span>
      </div>
      <p class="feedback" id="feedback" aria-live="polite">拖动任一扇区，观察增加的一项从哪里取得任务点。</p>
      <button class="btn is-primary" id="action-btn" type="button">记录方案</button>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function () {
  'use strict';

  Lec.mount({index:43,kicker:'MISSION TRADE SPACE',title:'每多要一点，都要从别处拿走',take:'载荷、冗余、时间、人员和风险无法同时无限优化。'});

  const cfg = {
    size: 520,
    innerRadius: 88,
    outerRadius: 228,
    total: 100,
    step: 5,
    minimum: 10,
    warning: 20,
    colors: {
      payload: '#35C6B4',
      redundancy: '#78D8CB',
      time: '#FFCC4D',
      crew: '#DCE6E3',
      risk: '#FF6B5E'
    }
  };

  const definitions = [
    { key: 'payload', label: '载荷', initial: 35, risk: '目标风险：关键任务能力不足' },
    { key: 'redundancy', label: '冗余', initial: 25, risk: '故障风险：单点失效增多' },
    { key: 'time', label: '时间', initial: 20, risk: '进度风险：没有恢复窗口' },
    { key: 'crew', label: '人员', initial: 20, risk: '人因风险：工作负荷集中' }
  ];

  const initialValues = () => definitions.map(d => d.initial);
  const state = {
    values: initialValues(),
    saved: [],
    completed: false,
    dragStart: null,
    dragValues: null
  };

  const svg = d3.select('#balance-dial');
  const root = svg.append('g').attr('transform', 'translate(260,260)');
  const outlineLayer = root.append('g').attr('class', 'outline-layer');
  const sectorLayer = root.append('g').attr('class', 'sector-layer');
  const labelLayer = root.append('g').attr('class', 'label-layer');
  const centerLayer = root.append('g').attr('class', 'center-layer');
  const arc = d3.arc().innerRadius(cfg.innerRadius).outerRadius(cfg.outerRadius).cornerRadius(3).padAngle(0.012);
  const outlineArc = d3.arc().innerRadius(cfg.outerRadius + 8).outerRadius(cfg.outerRadius + 13).padAngle(0.014);
  const fullCircle = Math.PI * 2;

  root.append('circle')
    .attr('class', 'dial-track')
    .attr('r', cfg.outerRadius + 1)
    .attr('stroke-width', 2);

  const closure = root.append('circle')
    .attr('class', 'closure-ring')
    .attr('r', cfg.outerRadius + 17);

  const tickValues = d3.range(0, cfg.total, cfg.warning);
  const ticks = root.append('g').selectAll('g')
    .data(tickValues)
    .join('g')
    .attr('transform', d => `rotate(${d / cfg.total * 360 - 90})`);

  ticks.append('line')
    .attr('x1', cfg.outerRadius + 4)
    .attr('x2', cfg.outerRadius + 12)
    .attr('stroke', 'var(--line-strong)')
    .attr('stroke-width', 2);

  root.append('g').selectAll('text')
    .data(tickValues)
    .join('text')
    .attr('class', 'dial-tick')
    .attr('x', d => Math.sin(d / cfg.total * fullCircle) * (cfg.outerRadius + 20))
    .attr('y', d => -Math.cos(d / cfg.total * fullCircle) * (cfg.outerRadius + 20))
    .attr('dy', '0.34em')
    .attr('text-anchor', 'middle')
    .text(d => format(d));

  const centerMain = centerLayer.append('text')
    .attr('class', 'dial-center-main')
    .attr('text-anchor', 'middle')
    .attr('y', -5);

  const centerSub = centerLayer.append('text')
    .attr('class', 'dial-center-sub')
    .attr('text-anchor', 'middle')
    .attr('y', 23)
    .text('风险暴露');

  function format(value) {
    return String(Lec.P.roundTo(value, 0));
  }

  function totalOf(values) {
    return values.reduce((sum, value) => sum + value, 0);
  }

  function pieData(values) {
    const pie = d3.pie().sort(null).value(d => d.value).startAngle(0).endAngle(fullCircle);
    return pie(definitions.map((definition, index) => ({ ...definition, value: values[index], index })));
  }

  function activeRisks() {
    return definitions.filter((definition, index) => state.values[index] < cfg.warning);
  }

  function allocationKey(values) {
    return values.join('-');
  }

  function setFeedback(message, isError) {
    const node = document.getElementById('feedback');
    node.textContent = message;
    node.classList.toggle('is-error', Boolean(isError));
  }

  function attemptShift(index, delta) {
    if (state.completed) return;
    const next = (index + 1) % state.values.length;
    const moved = Math.round(delta / cfg.step) * cfg.step;
    if (!moved) return;

    const candidate = state.values.slice();
    candidate[index] += moved;
    candidate[next] -= moved;

    if (candidate[index] < cfg.minimum || candidate[next] < cfg.minimum) {
      const blocked = candidate[index] < cfg.minimum ? index : next;
      flashWarning(blocked);
      setFeedback('该项已低于任务可执行下限，已回弹到最低任务点。', true);
      return;
    }

    state.values = candidate;
    setFeedback(`增加${definitions[index].label}，任务点从${definitions[next].label}收回。`, false);
    render();
  }

  function angleFromEvent(event) {
    return Math.atan2(event.y, event.x) + Math.PI / 2;
  }

  const drag = d3.drag()
    .on('start', function (event, d) {
      if (state.completed) return;
      state.dragStart = angleFromEvent(event);
      state.dragValues = state.values.slice();
      d3.select(this).raise();
    })
    .on('drag', function (event, d) {
      if (state.completed || state.dragStart === null) return;
      let deltaAngle = angleFromEvent(event) - state.dragStart;
      if (deltaAngle > Math.PI) deltaAngle -= fullCircle;
      if (deltaAngle < -Math.PI) deltaAngle += fullCircle;
      const points = Math.round((deltaAngle / fullCircle * cfg.total) / cfg.step) * cfg.step;
      const next = (d.data.index + 1) % state.values.length;
      const candidate = state.dragValues.slice();
      candidate[d.data.index] += points;
      candidate[next] -= points;

      if (candidate[d.data.index] < cfg.minimum || candidate[next] < cfg.minimum) {
        flashWarning(candidate[d.data.index] < cfg.minimum ? d.data.index : next);
        setFeedback('该项已低于任务可执行下限，已回弹到最低任务点。', true);
        return;
      }

      state.values = candidate;
      setFeedback(`增加${definitions[d.data.index].label}，任务点从${definitions[next].label}收回。`, false);
      render();
    })
    .on('end', function () {
      state.dragStart = null;
      state.dragValues = null;
    });

  function flashWarning(index) {
    const row = document.querySelector(`.ledger-row[data-key="${definitions[index].key}"]`);
    const path = sectorLayer.selectAll('.sector').filter(d => d.data.index === index);
    row.classList.add('is-warning');
    path.classed('is-warning', true);
    window.setTimeout(() => {
      row.classList.remove('is-warning');
      path.classed('is-warning', false);
    }, Deck.reduced() ? 0 : 420);
  }

  function flashClosure() {
    closure.classed('flash', false);
    void closure.node().getBoundingClientRect();
    closure.classed('flash', true);
  }

  function recordScheme() {
    if (state.completed) {
      resetGame();
      return;
    }

    const key = allocationKey(state.values);
    if (state.saved.some(saved => saved.key === key)) {
      setFeedback('这个分配已经记录。请改变至少一项任务点。', true);
      return;
    }

    state.saved.push({ key, values: state.values.slice() });
    flashClosure();

    if (state.saved.length >= 3) {
      state.completed = true;
      setFeedback('降低一项不会让约束消失，只会把代价改名为另一种风险。', false);
    } else {
      setFeedback('方案已记录。继续配出一个不同取舍。', false);
    }
    render();
  }

  function resetGame() {
    state.values = initialValues();
    state.saved = [];
    state.completed = false;
    state.dragStart = null;
    state.dragValues = null;
    setFeedback('拖动任一扇区，观察增加的一项从哪里取得任务点。', false);
    render();
  }

  function renderSavedOutlines() {
    const outlines = state.saved.flatMap((saved, savedIndex) =>
      pieData(saved.values).map(item => ({ ...item, savedIndex }))
    );

    outlineLayer.selectAll('path')
      .data(outlines, d => `${d.savedIndex}-${d.data.key}`)
      .join('path')
      .attr('class', 'saved-outline')
      .attr('d', outlineArc);
  }

  function render() {
    const data = pieData(state.values);
    const sectors = sectorLayer.selectAll('path')
      .data(data, d => d.data.key)
      .join('path')
      .attr('class', 'sector')
      .attr('fill', d => cfg.colors[d.data.key])
      .attr('stroke', 'var(--surface-0)')
      .attr('stroke-width', 3)
      .attr('tabindex', state.completed ? -1 : 0)
      .attr('role', 'slider')
      .attr('aria-valuemin', cfg.minimum)
      .attr('aria-valuemax', cfg.total - cfg.minimum * 3)
      .attr('aria-valuenow', d => format(d.data.value))
      .attr('aria-label', d => `${d.data.label}，${format(d.data.value)}任务点。用方向键调整，任务点与下一项互相转移。`)
      .attr('d', arc)
      .on('keydown', function (event, d) {
        if (event.key === 'ArrowRight' || event.key === 'ArrowUp') {
          event.preventDefault();
          attemptShift(d.data.index, cfg.step);
        } else if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') {
          event.preventDefault();
          attemptShift(d.data.index, -cfg.step);
        }
      })
      .call(drag);

    sectors.classed('is-warning', d => d.data.value < cfg.warning);

    labelLayer.selectAll('text')
      .data(data, d => d.data.key)
      .join('text')
      .attr('class', 'dial-label')
      .attr('text-anchor', 'middle')
      .attr('transform', d => {
        const point = arc.centroid(d);
        return `translate(${point[0]},${point[1]})`;
      })
      .text(d => `${d.data.label} ${format(d.data.value)}`);

    labelLayer.selectAll('circle')
      .data(data, d => d.data.key)
      .join('circle')
      .attr('class', 'handle-dot')
      .attr('r', 7)
      .attr('cx', d => Math.sin(d.endAngle) * (cfg.outerRadius - 3))
      .attr('cy', d => -Math.cos(d.endAngle) * (cfg.outerRadius - 3));

    definitions.forEach((definition, index) => {
      document.getElementById(`value-${definition.key}`).textContent = `${format(state.values[index])} 点`;
      document.querySelector(`.ledger-row[data-key="${definition.key}"]`).classList.toggle('is-warning', state.values[index] < cfg.warning);
    });

    const risks = activeRisks();
    const riskSummary = document.getElementById('risk-summary');
    riskSummary.innerHTML = risks.length
      ? risks.map(item => `<strong>${item.risk}</strong>`).join('；')
      : '当前各项均保留警戒余量。';

    centerMain.text(state.completed ? '只有不同取舍' : `${format(risks.length)} 项暴露`);
    centerSub.text(state.completed ? '没有全项最大' : '风险暴露');

    document.getElementById('budget-total').textContent = format(totalOf(state.values));
    document.getElementById('progress-text').textContent = `已记录 ${format(state.saved.length)}/${format(3)} 个不同方案`;
    document.querySelectorAll('.scheme-mark').forEach((mark, index) => mark.classList.toggle('is-filled', index < state.saved.length));

    const action = document.getElementById('action-btn');
    action.innerHTML = state.completed
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v6h6"></path></svg><span>重新配平</span>'
      : '<span>记录方案</span>';

    renderSavedOutlines();
  }

  document.getElementById('action-btn').addEventListener('click', recordScheme);
  render();
})();
</script>
</body>
