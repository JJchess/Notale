.p44 {

.p44-scene {

}

  left: 100%;

  animation: trunk-in 900ms 1180ms both cubic-bezier(.2,.8,.2,1);
}
.p44-question > .trunk::after {
  content: "";
  position: absolute;
  top: 50%;
  right: -2px;

.claim-kicker {

  line-height: 1.35;
}
.claim-main {

.door-glow {

}
.figure-group {

}
.shell {

  transform-origin: center;

}
.shell.s1 { animation-delay: 820ms; }
.shell.s2 { animation-delay: 950ms; }
.shell.s3 { animation-delay: 1080ms; }

@keyframes figure-in { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }

@keyframes trunk-in { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) {
  .door-glow { stroke-dashoffset: 0; animation: none; }
  .figure-group, .shell { opacity: 1; animation: none; }
  .p44-question > .trunk { animation: none; }
}
</style>
