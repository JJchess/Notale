<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main { --triage-top: 88px; display: flex; flex-direction: column; gap: var(--sp-2); }
  #stage .lec-progress { overflow: visible; }
  .triage-intro { height: 28px; flex: 0 0 28px; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-5); }
  .triage-intro p { font-size: var(--fs-sec); line-height: var(--lh-copy); color: var(--text-muted); }
  .triage-status { flex: 0 0 auto; color: var(--primary-bright); font-family: var(--font-mono); font-size: var(--fs-sec); font-weight: 700; }
  .triage-board { position: relative; height: 440px; flex: 0 0 440px; min-height: 0; }
  .triage-links { position: absolute; inset: 0 0 auto; width: 100%; height: 440px; overflow: visible; pointer-events: none; }
  .triage-links path { fill: none; stroke: var(--line-strong); stroke-width: 18; stroke-linecap: round; opacity: .34; vector-effect: non-scaling-stroke; }
  .triage-links circle { fill: var(--surface-1); stroke: var(--primary-dark); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .triage-links text { fill: var(--text-strong); font-family: var(--font-narrow); font-size: 16px; font-weight: 700; letter-spacing: 0; }
  .triage-links .branch-live { stroke: var(--primary-bright); opacity: .72; }
  .triage-links.is-complete path { stroke: var(--primary-bright); opacity: .72; }
  .triage-root { position: absolute; top: 4px; left: 50%; z-index: 2; min-width: 320px; padding: var(--sp-2) var(--sp-4); color: var(--text-strong); font-size: var(--fs-lead); font-weight: 700; line-height: var(--lh-copy); text-align: center; border: 2px solid var(--accent); border-radius: var(--radius-2); background: var(--surface-yellow); transform: translateX(-50%); }
  .triage-classes { position: absolute; top: var(--triage-top); right: 0; bottom: 0; left: 0; display: flex; gap: var(--sp-4); }
  .triage-class { flex: 1 1 0; min-width: 0; padding: 0; border-left-width: 3px; background: rgba(13, 26, 32, .9); transition: border-color 180ms ease, background 180ms ease; }
  .triage-class.is-target { border-color: var(--accent); background: var(--surface-yellow); }
  .triage-class.is-complete { border-color: var(--primary-bright); }
  .triage-class > .bt { height: 54px; box-sizing: border-box; margin: 0; padding: var(--sp-2) var(--sp-4); display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
  .class-name { font-size: var(--fs-h2); }
  .class-count { color: var(--primary-bright); font-family: var(--font-mono); font-size: var(--fs-sec); }
  .class-def { height: 42px; box-sizing: border-box; padding: var(--sp-2) var(--sp-4); color: var(--text-muted); font-size: var(--fs-sec); line-height: var(--lh-copy); border-bottom: var(--border); }
  .class-criteria { height: 50px; box-sizing: border-box; padding: var(--sp-1) var(--sp-4); display: grid; grid-template-columns: 74px minmax(0, 1fr) 74px minmax(0, 1fr); align-items: center; column-gap: var(--sp-2); color: var(--text-muted); font-size: var(--fs-label); line-height: 1.35; border-bottom: var(--border); }
  .class-criteria b { color: var(--text-strong); font-weight: 700; }
  .class-slots { height: 180px; box-sizing: border-box; padding: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2); }
  .drop-slot { flex: 1 1 0; min-height: 0; display: flex; align-items: stretch; border: 1px dashed var(--line-strong); border-radius: var(--radius-2); }
  .compare-axis { height: 42px; box-sizing: border-box; margin: 0 var(--sp-3); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; color: var(--text-muted); font-size: var(--fs-label); font-weight: 700; line-height: 1.35; text-align: center; border-top: 2px solid var(--accent); }
  .compare-axis span + span { border-left: var(--border); }
  .drop-slot:empty::before { content: "下位方案：待分诊"; margin: auto; color: var(--text-faint); font-size: var(--fs-label); line-height: 1.35; }
  .scheme { position: relative; display: flex; flex-direction: column; justify-content: center; width: 100%; min-width: 0; box-sizing: border-box; padding: var(--sp-2) var(--sp-3); color: var(--text-strong); border: 1px solid var(--line-strong); border-left: 3px solid var(--primary); border-radius: var(--radius-2); background: var(--surface-2); cursor: grab; touch-action: none; user-select: none; z-index: 4; }
  .scheme:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .scheme.is-dragging { cursor: grabbing; opacity: .9; box-shadow: var(--shadow-panel); z-index: 20; }
  .scheme.is-wrong { border-color: var(--danger); animation: reject 320ms ease; }
  .scheme-title { font-size: var(--fs-sec); font-weight: 700; line-height: 1.35; }
  .scheme-change { margin-top: 2px; color: var(--text-muted); font-size: var(--fs-label); line-height: 1.35; }
  .scheme-facts { display: none; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2); margin-top: var(--sp-2); padding-top: var(--sp-2); border-top: var(--border); }
  .scheme.is-placed { cursor: default; background: var(--surface-teal); }
  .scheme.is-placed .scheme-facts { display: grid; }
  .fact { min-width: 0; color: var(--text-strong); font-size: var(--fs-label); font-weight: 700; line-height: 1.35; text-align: center; }
  .triage-tray { height: 70px; flex: 0 0 70px; min-height: 0; box-sizing: border-box; display: flex; align-items: stretch; gap: var(--sp-2); padding: var(--sp-2); border: var(--border); border-radius: var(--radius-3); background: var(--surface-1); }
  .tray-label { flex: 0 0 120px; display: flex; flex-direction: column; justify-content: center; color: var(--text-muted); font-size: var(--fs-label); line-height: 1.35; }
  .tray-label strong { color: var(--text-strong); font-size: var(--fs-sec); }
  .tray-items { flex: 1 1 0; min-width: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); gap: var(--sp-2); }
  .tray-items .scheme { padding: var(--sp-1) var(--sp-3); }
  .tray-items .scheme-change { display: none; }
  .triage-close { height: 58px; flex: 0 0 58px; min-height: 0; box-sizing: border-box; display: flex; align-items: center; gap: var(--sp-4); padding: 0 var(--sp-4); border-left: 4px solid var(--accent); background: var(--surface-yellow); }
  .triage-close p { flex: 1 1 0; min-width: 0; color: var(--text-strong); font-size: var(--fs-sec); line-height: var(--lh-copy); }
  .reset-btn { display: none; flex: 0 0 auto; font-size: var(--fs-sec); }
  .reset-btn.is-visible { display: inline-flex; }
  .constraint-rail { position: absolute; right: var(--sp-4); bottom: var(--sp-3); left: var(--sp-4); height: 2px; background: transparent; pointer-events: none; }
  .triage-board.is-complete .constraint-rail { background: var(--accent); }
  .constraint-rail::before { content: "代价  —  可逆性  —  负担"; position: absolute; right: 0; bottom: 5px; color: var(--accent); font-size: var(--fs-label); font-weight: 700; line-height: 1.35; opacity: 0; }
  .triage-board.is-complete .constraint-rail::before { opacity: 1; }
  @keyframes reject { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 55% { transform: translateX(8px); } }
  @media (prefers-reduced-motion: reduce) { .scheme.is-wrong { animation: none; } .triage-class { transition: none; } }
</style>
</head>
<body data-page="46" data-total="52">
<div id="stage">
<main id="main">
  <div class="triage-intro">
    <p>拖动方案，按它首先改变的对象分诊。键盘可用 1 环境、2 行为、3 身体。</p>
    <div class="triage-status" id="statusTop" aria-live="polite">已分诊 0 / 6</div>
  </div>

  <section class="triage-board k-classification" id="board" aria-label="太空适应方案分类树">
    <div class="triage-root">太空限制：辐射与微重力</div>
    <svg class="triage-links" id="treeSvg" viewBox="0 0 960 210" role="img" aria-label="太空限制分向环境、行为和身体三类干预对象"></svg>
    <div class="triage-classes">
      <section class="triage-class box min0" data-category="environment" aria-label="环境工程分类槽">
        <div class="bt"><span class="class-name">环境工程</span><span class="class-count">0 / 2</span></div>
        <p class="class-def">改变身体周围的条件</p>
        <div class="class-criteria"><span>典型投入</span><b>质量与工程资源</b><span>如何撤回</span><b>停用或更换设施</b></div>
        <div class="class-slots"><div class="drop-slot"></div><div class="drop-slot"></div></div>
        <div class="compare-axis"><span>代价</span><span>可逆性</span><span>负担</span></div>
      </section>
      <section class="triage-class box min0" data-category="behavior" aria-label="行为改变分类槽">
        <div class="bt"><span class="class-name">行为改变</span><span class="class-count">0 / 2</span></div>
        <p class="class-def">改变人在条件中的行动</p>
        <div class="class-criteria"><span>典型投入</span><b>时间与持续执行</b><span>如何撤回</span><b>停止或调整行动</b></div>
        <div class="class-slots"><div class="drop-slot"></div><div class="drop-slot"></div></div>
        <div class="compare-axis"><span>代价</span><span>可逆性</span><span>负担</span></div>
      </section>
      <section class="triage-class box min0" data-category="body" aria-label="身体改造分类槽">
        <div class="bt"><span class="class-name">身体改造</span><span class="class-count">0 / 2</span></div>
        <p class="class-def">直接改变生理或结构</p>
        <div class="class-criteria"><span>典型投入</span><b>医疗与长期监测</b><span>如何撤回</span><b>可能难以完全撤回</b></div>
        <div class="class-slots"><div class="drop-slot"></div><div class="drop-slot"></div></div>
        <div class="compare-axis"><span>代价</span><span>可逆性</span><span>负担</span></div>
      </section>
    </div>
    <div class="constraint-rail" aria-hidden="true"></div>
  </section>

  <section class="triage-tray no-pan" aria-label="待分诊方案">
    <div class="tray-label"><strong>待分方案</strong><span>拖入上方支架</span></div>
    <div class="tray-items min0" id="tray"></div>
  </section>

  <div class="triage-close">
    <p>太空适应不只有改造人体。环境常耗工程资源，行为常占时间，身体改造可能更难撤回；具体优劣取决于任务。</p>
    <button class="btn is-primary reset-btn" id="resetBtn" type="button">重新分诊</button>
  </div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
const pageContent = document.getElementById('main').innerHTML;
Lec.mount({index: 46, kicker: 'ADAPTATION TRIAGE', title: '改变环境、行为，还是身体？', take: '面对太空限制，可以改变环境、行为或身体，但三者的代价与可逆性不同。'});
document.getElementById('main').innerHTML = pageContent;

const schemes = [
  { id: 'shield', title: '加厚辐射屏蔽', category: 'environment', change: '到达身体前的辐射', cost: '高', reversible: '中', burden: '发射质量' },
  { id: 'exercise', title: '每日阻力训练', category: 'behavior', change: '肌肉与骨骼的使用方式', cost: '中', reversible: '高', burden: '时间与依从性' },
  { id: 'medicine', title: '抑制骨量流失的药物', category: 'body', change: '生理反应', cost: '中', reversible: '中', burden: '副作用与监测' },
  { id: 'rotation', title: '旋转舱制造人工重力', category: 'environment', change: '居住区的受力条件', cost: '很高', reversible: '中', burden: '结构与运维' },
  { id: 'shelter', title: '太阳风暴时进入避难区', category: 'behavior', change: '暴露地点与时机', cost: '低', reversible: '高', burden: '活动受限' },
  { id: 'cells', title: '体细胞抗辐射改造（设想）', category: 'body', change: '细胞修复机制', cost: '未知', reversible: '低', burden: '不确定性' }
];
const categoryOrder = ['environment', 'behavior', 'body'];
const categoryHints = { environment: '它先改变的是周围条件。', behavior: '它先改变的是行动方式。', body: '它先改变的是身体本身。' };
const state = { placed: {}, trace: [] };
const tray = document.getElementById('tray');
const board = document.getElementById('board');
const statusTop = document.getElementById('statusTop');
const resetBtn = document.getElementById('resetBtn');
const reduced = Deck.reduced();

function schemeNode(d) {
  const el = document.createElement('div');
  el.className = 'scheme';
  el.dataset.id = d.id;
  el.tabIndex = 0;
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', d.title + '。按数字 1 放入环境，2 放入行为，3 放入身体。');
  el.innerHTML = '<span class="scheme-title"></span><span class="scheme-change"></span><div class="scheme-facts">' +
    '<span class="fact"></span><span class="fact"></span><span class="fact"></span></div>';
  el.querySelector('.scheme-title').textContent = d.title;
  el.querySelector('.scheme-change').textContent = '改变：' + d.change;
  const values = el.querySelectorAll('.fact');
  values[0].textContent = '代价 · ' + d.cost;
  values[1].textContent = '可逆 · ' + d.reversible;
  values[2].textContent = '负担 · ' + d.burden;
  el.addEventListener('pointerdown', startDrag);
  el.addEventListener('keydown', function (event) {
    const n = Number(event.key);
    if (n >= 1 && n <= 3 && !state.placed[d.id]) {
      event.preventDefault();
      attempt(d.id, categoryOrder[n - 1]);
    }
  });
  return el;
}

function renderTree() {
  const data = { name: '太空限制', children: categoryOrder.map(key => ({ name: key })) };
  const root = d3.hierarchy(data);
  const tree = d3.tree().size([960, 210]).separation((a, b) => a.parent === b.parent ? 1.15 : 1.5);
  tree(root);
  root.x = 480;
  root.y = 42;
  root.children.forEach((node, i) => { node.x = 160 + i * 320; node.y = 210; });
  const link = d3.linkVertical().x(d => d.x).y(d => d.y);
  const svg = d3.select('#treeSvg');
  svg.selectAll('*').remove();
  svg.selectAll('path').data(root.links()).join('path')
    .attr('d', link)
    .attr('class', d => countCategory(d.target.data.name) > 0 ? 'branch-live' : '');
  svg.selectAll('circle').data(root.children).join('circle').attr('cx', d => d.x).attr('cy', d => d.y).attr('r', 8);
}

function countCategory(category) {
  return Object.keys(state.placed).filter(id => state.placed[id] === category).length;
}

function update() {
  const done = Object.keys(state.placed).length;
  statusTop.textContent = '已分诊 ' + done + ' / ' + schemes.length;
  const foot = document.querySelector('.lec-foot');
  if (foot) foot.textContent = '已分诊 ' + done + ' / ' + schemes.length + ' · 按“实际改变的对象”分类';
  document.querySelectorAll('.triage-class').forEach(box => {
    const count = countCategory(box.dataset.category);
    box.querySelector('.class-count').textContent = count + ' / 2';
    box.classList.toggle('is-complete', count === 2);
  });
  const complete = done === schemes.length;
  board.classList.toggle('is-complete', complete);
  document.getElementById('treeSvg').classList.toggle('is-complete', complete);
  resetBtn.classList.toggle('is-visible', complete);
  renderTree();
}

function attempt(id, category) {
  const d = schemes.find(item => item.id === id);
  const el = document.querySelector('.scheme[data-id="' + id + '"]');
  if (!d || !el || state.placed[id]) return;
  if (category !== d.category) {
    el.classList.remove('is-wrong');
    void el.offsetWidth;
    el.classList.add('is-wrong');
    statusTop.textContent = categoryHints[d.category];
    window.setTimeout(() => { el.classList.remove('is-wrong'); update(); el.focus(); }, reduced ? 0 : 520);
    return;
  }
  const box = document.querySelector('.triage-class[data-category="' + category + '"]');
  const slot = Array.from(box.querySelectorAll('.drop-slot')).find(node => !node.children.length);
  state.placed[id] = category;
  state.trace.push({ id, category });
  slot.appendChild(el);
  el.classList.add('is-placed');
  el.removeAttribute('role');
  el.setAttribute('aria-label', d.title + '，已归入' + box.querySelector('.class-name').textContent);
  update();
  el.focus();
}

let drag = null;
function startDrag(event) {
  const el = event.currentTarget;
  if (state.placed[el.dataset.id] || event.button !== 0) return;
  const p = Deck.pt(document.getElementById('main'), event);
  drag = { el, x: p.x, y: p.y };
  el.setPointerCapture(event.pointerId);
  el.classList.add('is-dragging');
  el.addEventListener('pointermove', moveDrag);
  el.addEventListener('pointerup', endDrag);
  el.addEventListener('pointercancel', endDrag);
}
function moveDrag(event) {
  if (!drag) return;
  const p = Deck.pt(document.getElementById('main'), event);
  drag.el.style.transform = 'translate(' + (p.x - drag.x) + 'px,' + (p.y - drag.y) + 'px)';
  drag.el.style.pointerEvents = 'none';
  const under = document.elementFromPoint(event.clientX, event.clientY);
  drag.el.style.pointerEvents = '';
  document.querySelectorAll('.triage-class').forEach(box => box.classList.toggle('is-target', !!under && box.contains(under)));
}
function endDrag(event) {
  if (!drag) return;
  const el = drag.el;
  el.style.pointerEvents = 'none';
  const under = document.elementFromPoint(event.clientX, event.clientY);
  el.style.pointerEvents = '';
  const box = under && under.closest ? under.closest('.triage-class') : null;
  el.style.transform = '';
  el.classList.remove('is-dragging');
  el.removeEventListener('pointermove', moveDrag);
  el.removeEventListener('pointerup', endDrag);
  el.removeEventListener('pointercancel', endDrag);
  document.querySelectorAll('.triage-class').forEach(node => node.classList.remove('is-target'));
  const id = el.dataset.id;
  drag = null;
  if (box) attempt(id, box.dataset.category);
}

function reset() {
  state.placed = {};
  state.trace = [];
  schemes.forEach(d => {
    const el = document.querySelector('.scheme[data-id="' + d.id + '"]');
    el.classList.remove('is-placed', 'is-wrong');
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', d.title + '。按数字 1 放入环境，2 放入行为，3 放入身体。');
    tray.appendChild(el);
  });
  update();
  tray.querySelector('.scheme').focus();
}
resetBtn.addEventListener('click', reset);
schemes.forEach(d => tray.appendChild(schemeNode(d)));
update();
</script>
</body>
</html>
