<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#main{position:relative}
progress.lec-progress{display:block;overflow:visible}
.scene-nav-info{display:none!important}
.earth-system{position:relative;height:100%;isolation:isolate}
.earth-system.k-generalization{gap:12px;grid-template-rows:auto minmax(0,1fr)}
.earth-system>.claim{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:10px 16px 10px 20px;z-index:5}
.claim-main{font-size:var(--fs-lead);line-height:var(--lh-copy)}
.progress-status{flex:0 0 auto;margin-left:24px;color:var(--text-muted);font-family:var(--font-mono);font-size:var(--fs-sec);font-weight:600;white-space:nowrap}
.progress-status strong{color:var(--accent)}
.earth-system>.trunk{top:56px;bottom:12px;left:53%;opacity:.62}
.earth-system>.supports{display:block;min-height:0;height:100%;padding:0;overflow:hidden}
.earth-system>.supports::before{display:none}
.system-field{position:absolute;inset:0;overflow:hidden}
.globe-zone{position:absolute;inset:0 430px 0 0;overflow:hidden}
#globe{position:absolute;left:18px;top:-22px;width:820px;height:520px;overflow:hidden;cursor:grab}
#globe>div,#globe .scene-container,#globe canvas{width:820px!important;height:520px!important;max-height:520px}
#globe:active{cursor:grabbing}
#globe canvas{display:block;outline:none}
.globe-zone.habitable-line::after{left:74px;right:210px;bottom:14px;height:108px}
.globe-caption{position:absolute;left:28px;bottom:18px;width:540px;color:var(--text-muted);font-size:var(--fs-sec);line-height:var(--lh-copy);z-index:4}
.globe-caption strong{color:var(--text-strong)}
.atmosphere-label{position:absolute;left:584px;top:36px;color:var(--primary-bright);font-size:var(--fs-label);font-weight:700;z-index:4}
.atmosphere-label::before{content:"";position:absolute;right:calc(100% + 10px);top:50%;width:74px;height:1px;background:var(--primary);transform:rotate(-18deg);transform-origin:right center}
.links-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.link-path{fill:none;stroke:var(--primary-dark);stroke-width:2;stroke-dasharray:5 7;opacity:.42;transition:stroke .25s,opacity .25s,stroke-width .25s}
.link-path.is-on{stroke:var(--accent);stroke-width:3;stroke-dasharray:none;opacity:1}
.system-anchor{position:absolute;left:var(--ax);top:var(--ay);z-index:5;display:flex;align-items:center;gap:8px;min-width:132px;padding:6px 10px;color:var(--text-muted);font-size:var(--fs-label);font-weight:700;line-height:1.35;border:1px solid var(--line-strong);border-radius:var(--radius-2);background:var(--surface-glass);transform:translate(-50%,-50%);transition:border-color .2s,background .2s,color .2s}
.anchor-dot{width:13px;height:13px;flex:0 0 13px;border:2px solid var(--primary);border-radius:50%;background:var(--surface-0)}
.system-anchor.is-on{color:var(--text-strong);border-color:var(--accent);background:var(--surface-yellow)}
.system-anchor.is-on .anchor-dot{border-color:var(--accent);background:var(--accent)}
.support-rail{position:absolute;right:0;top:0;width:404px;height:100%;z-index:7}
.support-rail::before{content:"";position:absolute;inset:18px 10px 18px 82px;border-left:2px solid var(--primary-dark);border-radius:50%;opacity:.55}
.support-card.support{position:absolute;right:8px;top:var(--cy);width:324px;min-height:92px;box-sizing:border-box;padding:12px 14px;text-align:left;touch-action:none;user-select:none;cursor:grab;z-index:8;transition:border-color .2s,background .2s,opacity .2s,transform .24s ease}
.support-card.support::before{height:2px;width:48px;left:auto;right:100%;bottom:50%;transform:none}
.support-card:active{cursor:grabbing}
.support-card .support-title{display:flex;align-items:center;gap:9px;margin-bottom:4px;color:var(--text-strong);font-family:var(--font-narrow);font-size:var(--fs-h2);font-weight:700;line-height:1.3}
.support-card .support-mark{width:14px;height:14px;flex:0 0 14px;border:2px solid var(--primary);border-radius:50%;background:transparent}
.support-card .support-copy{display:block;color:var(--text-muted);font-size:var(--fs-sec);line-height:1.4}
.support-card.is-dragging{transition:none;cursor:grabbing;box-shadow:var(--shadow-panel)}
.support-card.is-done{border-color:var(--accent);border-top-color:var(--accent);background:var(--surface-yellow);cursor:default}
.support-card.is-done .support-mark{border-color:var(--accent);background:var(--accent)}
.support-card.is-done .support-copy{color:var(--text)}
.support-card.is-wrong{border-color:var(--danger);animation:wrong-shake .32s ease}
.keyboard-target{position:absolute;right:350px;top:calc(var(--cy) + 30px);color:var(--accent);font-size:var(--fs-label);font-weight:700;opacity:0;pointer-events:none;transition:opacity .15s}
.support-card:focus-visible~.keyboard-target{opacity:1}
.feedback{position:absolute;left:760px;bottom:14px;width:340px;min-height:46px;box-sizing:border-box;padding:10px 12px;color:var(--text-muted);font-size:var(--fs-sec);line-height:1.4;border-left:3px solid var(--primary-dark);background:var(--surface-glass);z-index:9}
.feedback.is-error{color:var(--text-strong);border-left-color:var(--danger)}
.synthesis{position:absolute;left:188px;top:184px;width:470px;box-sizing:border-box;padding:16px 20px;color:var(--text-strong);font-family:var(--font-narrow);font-size:var(--fs-h2);font-weight:700;line-height:1.35;text-align:center;border:2px solid var(--accent);border-radius:var(--radius-3);background:rgba(7,16,21,.9);box-shadow:var(--shadow-panel);opacity:0;transform:translateY(10px);pointer-events:none;z-index:10;transition:opacity .3s,transform .3s}
.synthesis.is-visible{opacity:1;transform:none}
.reset-btn{position:absolute;right:8px;bottom:12px;z-index:10}
.reset-btn[hidden]{display:none}
@keyframes wrong-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}55%{transform:translateX(9px)}80%{transform:translateX(-5px)}}
@media (prefers-reduced-motion:reduce){.link-path,.system-anchor,.support-card,.keyboard-target,.synthesis{transition:none}.support-card.is-wrong{animation:none}}
</style>
</head>
<body data-page="48" data-total="52">
<div id="stage">
<main id="main">
<section class="earth-system k-generalization full" aria-labelledby="system-claim">
  <div class="claim" id="system-claim">
    <span class="claim-main">可居住环境需要持续维持</span>
    <span class="progress-status" aria-live="polite">四条支撑 · 已接通 <strong id="doneCount">0/4</strong></span>
  </div>
  <div class="trunk" aria-hidden="true"></div>
  <div class="supports min0">
    <div class="system-field no-pan" id="systemField">
      <div class="globe-zone habitable-line" aria-label="显示全球物质循环与能量通道的三维地球">
        <div id="globe"></div>
        <div class="atmosphere-label">可维持的环境边界</div>
        <p class="globe-caption"><strong>地球不是无限仓库：</strong>生命使用的物质，主要在同一个行星系统中反复流转。</p>
      </div>
      <svg class="links-layer" id="linksLayer" aria-hidden="true"></svg>

      <div class="system-anchor" data-kind="energy" style="--ax:49%;--ay:18%"><span class="anchor-dot"></span><span>能量边界</span></div>
      <div class="system-anchor" data-kind="water" style="--ax:46%;--ay:39%"><span class="anchor-dot"></span><span>水循环</span></div>
      <div class="system-anchor" data-kind="carbon" style="--ax:48%;--ay:62%"><span class="anchor-dot"></span><span>物质储库</span></div>
      <div class="system-anchor" data-kind="connected" style="--ax:53%;--ay:82%"><span class="anchor-dot"></span><span>全球连接</span></div>

      <div class="support-rail" aria-label="四条待接通支撑">
        <button class="support support-card" type="button" data-kind="energy" style="--cy:8px" aria-label="能量有通道。拖到能量边界；键盘用上下方向键选择锚点，回车投放。">
          <span class="support-title"><span class="support-mark"></span>能量有通道</span>
          <span class="support-copy">日照进入，热量向外散出。</span>
        </button><span class="keyboard-target" style="--cy:8px" aria-hidden="true">↑↓ 选择 · Enter 投放</span>
        <button class="support support-card" type="button" data-kind="water" style="--cy:116px" aria-label="水反复流转。拖到水循环；键盘用上下方向键选择锚点，回车投放。">
          <span class="support-title"><span class="support-mark"></span>水反复流转</span>
          <span class="support-copy">海洋、云、陆地与河流之间循环。</span>
        </button><span class="keyboard-target" style="--cy:116px" aria-hidden="true">↑↓ 选择 · Enter 投放</span>
        <button class="support support-card" type="button" data-kind="carbon" style="--cy:224px" aria-label="碳与养分转移。拖到物质储库；键盘用上下方向键选择锚点，回车投放。">
          <span class="support-title"><span class="support-mark"></span>碳与养分转移</span>
          <span class="support-copy">可用物质总要来自已有储库。</span>
        </button><span class="keyboard-target" style="--cy:224px" aria-hidden="true">↑↓ 选择 · Enter 投放</span>
        <button class="support support-card" type="button" data-kind="connected" style="--cy:332px" aria-label="过程彼此牵动。拖到全球连接；键盘用上下方向键选择锚点，回车投放。">
          <span class="support-title"><span class="support-mark"></span>过程彼此牵动</span>
          <span class="support-copy">局部变化会沿全球系统传递。</span>
        </button><span class="keyboard-target" style="--cy:332px" aria-hidden="true">↑↓ 选择 · Enter 投放</span>
      </div>

      <p class="feedback" id="feedback" aria-live="polite">拖动支撑卡到对应锚点。键盘可用 ↑↓ 选择，按 Enter 投放。</p>
      <div class="synthesis" id="synthesis" hidden>有限物质 × 持续能量 × 相互连接</div>
      <button class="btn icon-only reset-btn" id="resetBtn" type="button" title="断开全部连线" aria-label="重置：断开全部连线" hidden>↺</button>
    </div>
  </div>
</section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/three.min.js"></script>
<script src="assets/lib/globe.gl.min.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
Lec.mount({index:48,kicker:'SPACESHIP EARTH',title:'地球也有生命保障系统',take:'地球同样依赖有限的物质循环和可维持的环境，只是边界较大且不显眼。'});

(function(){
  const field=document.getElementById('systemField');
  const cards=Array.from(document.querySelectorAll('.support-card'));
  const anchors=Array.from(document.querySelectorAll('.system-anchor'));
  const feedback=document.getElementById('feedback');
  const countEl=document.getElementById('doneCount');
  const synthesis=document.getElementById('synthesis');
  const resetBtn=document.getElementById('resetBtn');
  const reduced=Deck.reduced();
  const completed=new Set();
  const kinds=['energy','water','carbon','connected'];
  const messages={
    energy:'能量穿过边界：日照进入，热量向外散出。',
    water:'水在海洋、云、陆地和河流之间反复流转。',
    carbon:'碳与养分在大气、海洋、土壤和生物间转移。',
    connected:'各地过程经大气、海洋与生物交换相连。'
  };
  const wrongHints={
    energy:'这张卡说的是能量收支，请找穿过边界的通道。',
    water:'这张卡说的是物质流转，请找循环节点。',
    carbon:'这张卡说的是物质储存与转移，请找储库节点。',
    connected:'这张卡说的是过程牵动，请找全球连接节点。'
  };

  const arcSets={
    energy:[
      {startLat:-12,startLng:-150,endLat:18,endLng:-40,kind:'energy'},
      {startLat:8,startLng:30,endLat:30,endLng:140,kind:'energy'}
    ],
    water:[
      {startLat:18,startLng:-65,endLat:48,endLng:-15,kind:'water'},
      {startLat:-25,startLng:85,endLat:22,endLng:120,kind:'water'},
      {startLat:-8,startLng:-20,endLat:-28,endLng:35,kind:'water'}
    ],
    carbon:[
      {startLat:-8,startLng:-62,endLat:12,endLng:-38,kind:'carbon'},
      {startLat:5,startLng:25,endLat:-20,endLng:60,kind:'carbon'},
      {startLat:38,startLng:70,endLat:50,endLng:125,kind:'carbon'}
    ],
    connected:[
      {startLat:35,startLng:-120,endLat:32,endLng:115,kind:'connected'},
      {startLat:-34,startLng:18,endLat:-25,endLng:-70,kind:'connected'},
      {startLat:52,startLng:5,endLat:-12,endLng:130,kind:'connected'}
    ]
  };
  const points=[
    {lat:38,lng:-105},{lat:-8,lng:-62},{lat:-24,lng:-47},{lat:8,lng:-15},
    {lat:48,lng:10},{lat:-22,lng:25},{lat:22,lng:78},{lat:35,lng:115},
    {lat:-25,lng:135},{lat:4,lng:120},{lat:55,lng:80},{lat:-12,lng:-15}
  ];
  const globeEl=document.getElementById('globe');
  const hideGlobeHelp=()=>Array.from(globeEl.querySelectorAll('*')).forEach(el=>{
    if(!el.children.length&&el.textContent&&el.textContent.includes('Left-click: rotate')) el.style.setProperty('display','none','important');
  });
  const globeObserver=new MutationObserver(hideGlobeHelp);
  globeObserver.observe(globeEl,{childList:true,subtree:true});
  const globe=Globe()(globeEl)
    .width(820).height(520)
    .backgroundColor('#071015')
    .showAtmosphere(true)
    .atmosphereColor('#35C6B4')
    .atmosphereAltitude(0.12)
    .showGraticules(true)
    .enablePointerInteraction(false)
    .pointsData(points)
    .pointColor(()=> '#35C6B4')
    .pointAltitude(0.012)
    .pointRadius(0.22)
    .arcsData([])
    .arcColor(d=>d.active?'#FFCC4D':'#35C6B4')
    .arcAltitude(0.16)
    .arcStroke(0.7)
    .arcDashLength(0.35)
    .arcDashGap(0.12)
    .arcDashAnimateTime(reduced?0:2800);
  globe.globeMaterial(new THREE.MeshPhongMaterial({color:'#123b42',emissive:'#061419',shininess:10}));
  globe.pointOfView({lat:14,lng:-18,altitude:2.05},0);
  hideGlobeHelp();
  setTimeout(()=>{hideGlobeHelp();globeObserver.disconnect();},1000);
  const controls=globe.controls();
  controls.enableZoom=false;
  controls.autoRotate=false;
  controls.autoRotateSpeed=0.55;

  const svg=d3.select('#linksLayer');
  const nodes=[{id:'claim',fx:735,fy:12}].concat(kinds.map((id,i)=>({id,fx:675+(i%2)*38,fy:86+i*104})));
  const links=kinds.map(id=>({source:id,target:'claim',id}));
  const simulation=d3.forceSimulation(nodes)
    .force('link',d3.forceLink(links).id(d=>d.id).distance(96))
    .force('charge',d3.forceManyBody().strength(-180))
    .force('center',d3.forceCenter(0,0))
    .stop();
  simulation.tick(12);
  const paths=svg.selectAll('path').data(links,d=>d.id).join('path').attr('class','link-path').attr('data-kind',d=>d.id);

  function fieldPoint(el){
    return {x:el.offsetLeft+el.offsetWidth/2,y:el.offsetTop+el.offsetHeight/2};
  }
  function drawLinks(){
    paths.attr('d',d=>{
      const a=document.querySelector('.system-anchor[data-kind="'+d.id+'"]');
      const p=fieldPoint(a);
      const end={x:760,y:field.clientHeight/2};
      const bend=Math.max(42,(end.x-p.x)*.42);
      return 'M'+p.x+','+p.y+' C'+(p.x+bend)+','+p.y+' '+(end.x-bend)+','+end.y+' '+end.x+','+end.y;
    }).classed('is-on',d=>completed.has(d.id));
  }

  function refreshGlobe(){
    const arcs=[];
    completed.forEach(kind=>arcSets[kind].forEach(a=>arcs.push(Object.assign({active:true},a))));
    globe.arcsData(arcs);
  }

  function place(card,kind){
    if(completed.has(kind)) return;
    completed.add(kind);
    card.classList.add('is-done');
    card.disabled=true;
    card.style.transform='';
    document.querySelector('.system-anchor[data-kind="'+kind+'"]').classList.add('is-on');
    countEl.textContent=completed.size+'/4';
    feedback.classList.remove('is-error');
    feedback.textContent=messages[kind];
    refreshGlobe();
    drawLinks();
    if(completed.size===kinds.length){
      synthesis.hidden=false;
      synthesis.classList.add('is-visible');
      resetBtn.hidden=false;
      feedback.textContent='边界更辽阔、过程更复杂；能量通道与多个物质循环共同维持可居住环境。';
      if(!reduced) controls.autoRotate=true;
    }
  }

  function reject(card){
    card.style.transform='';
    card.classList.remove('is-dragging');
    card.classList.add('is-wrong');
    feedback.classList.add('is-error');
    feedback.textContent=wrongHints[card.dataset.kind];
    setTimeout(()=>card.classList.remove('is-wrong'),340);
  }

  cards.forEach(card=>{
    let start=null;
    let delta={x:0,y:0};
    let keyIndex=kinds.indexOf(card.dataset.kind);
    card.addEventListener('pointerdown',e=>{
      if(card.disabled) return;
      const p=Deck.pt(field,e);
      start=p;
      delta={x:0,y:0};
      card.setPointerCapture(e.pointerId);
      card.classList.add('is-dragging');
    });
    card.addEventListener('pointermove',e=>{
      if(!start||card.disabled) return;
      const p=Deck.pt(field,e);
      delta={x:p.x-start.x,y:p.y-start.y};
      card.style.transform='translate('+delta.x+'px,'+delta.y+'px)';
    });
    card.addEventListener('pointerup',e=>{
      if(!start||card.disabled) return;
      const p=Deck.pt(field,e);
      start=null;
      card.classList.remove('is-dragging');
      let nearest=null;
      let min=Infinity;
      anchors.forEach(anchor=>{
        const q=fieldPoint(anchor);
        const dist=Math.hypot(p.x-q.x,p.y-q.y);
        if(dist<min){min=dist;nearest=anchor;}
      });
      if(nearest&&min<105&&nearest.dataset.kind===card.dataset.kind) place(card,card.dataset.kind);
      else reject(card);
    });
    card.addEventListener('pointercancel',()=>{start=null;reject(card);});
    card.addEventListener('keydown',e=>{
      if(card.disabled) return;
      if(e.key==='ArrowDown'||e.key==='ArrowRight'){
        e.preventDefault();keyIndex=(keyIndex+1)%kinds.length;
        feedback.classList.remove('is-error');feedback.textContent='当前锚点：'+anchors[keyIndex].textContent.trim()+'。按 Enter 投放。';
      }else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){
        e.preventDefault();keyIndex=(keyIndex+kinds.length-1)%kinds.length;
        feedback.classList.remove('is-error');feedback.textContent='当前锚点：'+anchors[keyIndex].textContent.trim()+'。按 Enter 投放。';
      }else if(e.key==='Enter'||e.key===' '){
        e.preventDefault();
        if(kinds[keyIndex]===card.dataset.kind) place(card,card.dataset.kind); else reject(card);
      }
    });
  });

  resetBtn.addEventListener('click',()=>{
    completed.clear();
    controls.autoRotate=false;
    cards.forEach(card=>{card.disabled=false;card.classList.remove('is-done','is-wrong');card.style.transform='';});
    anchors.forEach(a=>a.classList.remove('is-on'));
    countEl.textContent='0/4';
    synthesis.classList.remove('is-visible');
    synthesis.hidden=true;
    resetBtn.hidden=true;
    feedback.classList.remove('is-error');
    feedback.textContent='拖动支撑卡到对应锚点。键盘可用 ↑↓ 选择，按 Enter 投放。';
    refreshGlobe();
    drawLinks();
    cards[0].focus();
  });

  drawLinks();
  Deck.onResize(drawLinks);
})();
</script>
</body>
</html>
