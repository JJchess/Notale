<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lec-progress {
    overflow: visible;
  }

  #main {
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }

  .audit-intro {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-5);
    min-height: 46px;
  }

  .audit-intro p {
    color: var(--text-strong);
    font-size: var(--fs-lead);
    line-height: var(--lh-copy);
  }

  .audit-progress {
    flex: 0 0 auto;
    color: var(--primary-bright);
    font-family: var(--font-mono);
    font-size: var(--fs-sec);
    font-weight: 700;
    line-height: var(--lh-copy);
  }

  .audit-workspace {
    position: relative;
    z-index: 2;
    display: flex;
    flex: 1 1 0;
    gap: var(--sp-4);
    min-height: 0;
  }

  .audit-ledger {
    flex: 1 1 0;
    min-width: 0;
    gap: 0;
  }

  .audit-ledger > .box {
    display: flex;
    flex: 1 1 0;
    flex-direction: column;
    min-height: 0;
    padding: 0;
    overflow: hidden;
    background: rgba(13, 26, 32, 0.9);
  }

  .audit-ledger > .box > .bt {
    display: grid;
    grid-template-columns: minmax(250px, 1fr) repeat(3, 92px) 360px;
    align-items: center;
    gap: var(--sp-3);
    min-height: 42px;
    margin: 0;
    padding: 0 var(--sp-4);
    font-size: var(--fs-label);
  }

  .audit-ledger > .box > .bt span:not(:first-child) {
    color: var(--text-muted);
    font-family: var(--font-sans);
    font-weight: 600;
    text-align: center;
  }

  .audit-ledger > .box > .bt span:last-child {
    text-align: left;
  }

  .rows {
    display: flex;
    flex: 1 1 0;
    flex-direction: column;
    min-height: 0;
  }

  .audit-row.lv {
    --level: 0;
    display: grid;
    flex: 1 1 0;
    grid-template-columns: minmax(250px, 1fr) repeat(3, 92px) 360px;
    align-items: center;
    gap: var(--sp-3);
    min-height: 0;
    margin-left: 0;
    padding: var(--sp-2) var(--sp-4) var(--sp-2) var(--sp-5);
    border-bottom: var(--border);
    border-left-color: var(--primary-dark);
    color: var(--text-strong);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
    background: transparent;
    transition: background 180ms ease, box-shadow 180ms ease, transform 180ms ease;
  }

  .audit-row.lv:last-child {
    border-bottom: 0;
  }

  .audit-row.lv::before {
    top: 50%;
  }

  .audit-row.is-current {
    background: var(--surface-teal);
    box-shadow: inset 0 0 0 1px rgba(53, 198, 180, 0.32);
  }

  .audit-row.is-dragover {
    background: var(--surface-yellow);
    box-shadow: inset 0 0 0 2px var(--accent);
  }

  .audit-row.is-correct {
    background: rgba(53, 198, 180, 0.08);
    box-shadow: inset 3px 0 0 var(--primary);
  }

  .audit-row.is-wrong {
    animation: row-shake 260ms ease;
  }

  .judgment {
    display: flex;
    align-self: stretch;
    align-items: center;
    color: var(--text-strong);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
  }

  .class-slot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    align-self: stretch;
    min-height: 34px;
    color: var(--text-faint);
    font-size: var(--fs-label);
    font-weight: 700;
    line-height: 1.35;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius-2);
  }

  .class-slot.is-marked {
    color: var(--accent-ink);
    border-style: solid;
    border-color: var(--accent);
    background: var(--accent);
  }

  .class-slot.is-marked {
    font-size: 0;
  }

  .class-slot.is-marked::before {
    content: "✓";
    font-size: var(--fs-body);
  }

  .reason {
    display: flex;
    align-self: stretch;
    align-items: center;
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
    opacity: 1;
    transform: translateX(0);
    transition: color 180ms ease, transform 180ms ease;
  }

  .is-correct .reason,
  .reason.is-error {
    opacity: 1;
    transform: translateX(0);
  }

  .reason.is-error {
    color: var(--accent);
  }

  .stamp-console {
    position: relative;
    display: flex;
    flex: 0 0 220px;
    flex-direction: column;
    gap: var(--sp-3);
    min-width: 0;
    padding: var(--sp-4);
    border: var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-3);
    background: var(--surface-glass);
  }

  .stamp-console h2 {
    font-size: var(--fs-h2);
  }

  .stamp-console .instruction {
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
  }

  .stamp {
    width: 100%;
    min-height: 48px;
    color: var(--text-strong);
    border: 2px solid var(--primary-dark);
    background: var(--surface-2);
    cursor: grab;
  }

  .stamp[data-kind="boundary"] {
    border-color: var(--accent);
  }

  .stamp[aria-pressed="true"] {
    color: var(--accent-ink);
    border-color: var(--accent);
    background: var(--accent);
  }

  .stamp.is-wrong {
    animation: stamp-shake 260ms ease;
  }

  .reset-btn {
    margin-top: auto;
  }

  .completion {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-4);
    min-height: 50px;
    padding: var(--sp-2) var(--sp-4);
    color: var(--text-strong);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
    border-left: 4px solid var(--accent);
    background: var(--surface-yellow);
  }

  .completion strong {
    color: var(--accent);
    font-size: var(--fs-lead);
  }

  .is-complete .completion {
    display: flex;
  }

  .audit-principle {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: var(--sp-4);
    min-height: 42px;
    padding: 0 var(--sp-4);
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
    border-left: 4px solid var(--primary);
    background: rgba(7, 16, 21, 0.82);
  }

  .audit-principle strong {
    flex: 0 0 auto;
    color: var(--text-strong);
    font-size: var(--fs-lead);
  }

  .is-complete .audit-principle {
    display: none;
  }

  .earth-arc {
    position: absolute;
    z-index: 0;
    right: 8%;
    bottom: 0;
    left: 8%;
    height: 54px;
    border-top: 3px solid var(--primary-bright);
    border-radius: 50% 50% 0 0;
    background: rgba(22, 139, 125, 0.08);
    box-shadow: 0 -2px 16px rgba(53, 198, 180, 0.32);
    pointer-events: none;
  }

  @keyframes stamp-shake {
    0%, 100% { transform: translateX(0); }
    30% { transform: translateX(-8px); }
    65% { transform: translateX(8px); }
  }

  @keyframes row-shake {
    0%, 100% { transform: translateX(0); }
    35% { transform: translateX(-5px); }
    70% { transform: translateX(5px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .audit-row,
    .reason { transition: none; }
    .stamp.is-wrong,
    .audit-row.is-wrong { animation: none; }
  }
</style>
</head>
<body data-page="49" data-total="52">
<div id="stage">
<main id="main">
  <section class="audit-intro" aria-label="审计目标">
    <p>给每条判断盖章：类比能用到哪里，又从哪里开始失真？</p>
    <div class="audit-progress" aria-live="polite">类比审计 <span id="doneCount"></span> / <span id="totalCount"></span></div>
  </section>

  <div class="audit-workspace min0">
    <section class="k-classification audit-ledger min0" aria-label="地球飞船类比审计账本">
      <div class="box">
        <div class="bt">
          <span>类比判断</span>
          <span>可沿用</span>
          <span>加边界</span>
          <span>不可用</span>
          <span>边界批注</span>
        </div>
        <div class="rows" id="auditRows"></div>
      </div>
    </section>

    <aside class="stamp-console min0" aria-label="分类印章操作台">
      <h2>分类印章</h2>
      <p class="instruction">拖到判断行；或选择印章，用 ↑↓ 定位，按 Enter 盖章。</p>
      <button class="stamp choice" type="button" draggable="true" data-kind="keep" aria-pressed="true">可沿用</button>
      <button class="stamp choice" type="button" draggable="true" data-kind="boundary" aria-pressed="false">须加边界</button>
      <button class="stamp choice" type="button" draggable="true" data-kind="stop" aria-pressed="false">不可沿用</button>
      <button class="btn reset-btn" id="resetAudit" type="button">重置审计</button>
    </aside>
  </div>

  <div class="completion" id="completion" aria-live="polite">
    <span><strong>保留解释力，也标出失效处。</strong></span>
    <span>类比提醒相互依赖与边界；它抹去开放生态、自然演化或权力差异时，就应停止沿用。</span>
  </div>
  <div class="audit-principle" id="auditPrinciple">
    <strong>类比不是等同。</strong>
    <span>“地球飞船”适合提醒：生存条件彼此相连，而且存在边界。</span>
  </div>
  <div class="earth-arc" aria-hidden="true"></div>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Lec.mount({index: 49, kicker: "ANALOGY AUDIT", title: "地球不是一艘更大的飞船", take: "“地球飞船”能凸显相互依赖，但会遮蔽开放生态、权力差异与自然演化。"});

  (() => {
    const source = [
      {
        judgment: "生存依赖彼此连接的环境系统",
        kind: "keep",
        label: "可沿用",
        reason: "改变一环，影响可能沿系统传到其他环。",
        error: "这条保留了系统连接，请检查类比的解释力。"
      },
      {
        judgment: "可用物质与环境承载能力并非无限",
        kind: "keep",
        label: "可沿用",
        reason: "“有限”提醒约束，不等于舱体有固定库存表。",
        error: "这条强调边界，请检查是否仍有解释力。"
      },
      {
        judgment: "地球是完全封闭的系统",
        kind: "boundary",
        label: "须加边界",
        reason: "物质大体循环；能量持续进入，也向外散失。",
        error: "这条忽略了能量交换，请检查“完全封闭”。"
      },
      {
        judgment: "生态循环可像生命保障设备一样被完整设计和控制",
        kind: "boundary",
        label: "须加边界",
        reason: "生态会自组织、迁移和演化，边界也可渗透。",
        error: "这条忽略了自然演化，请检查“完整控制”。"
      },
      {
        judgment: "全人类像同一舱组，拥有相同权限",
        kind: "stop",
        label: "不可沿用",
        reason: "决策权、资源控制与发言能力分布不均。",
        error: "这条忽略了权力差异，请检查“相同权限”。"
      },
      {
        judgment: "环境变化会让所有人承担相同风险",
        kind: "stop",
        label: "不可沿用",
        reason: "收益、暴露、损失与适应能力并不平均。",
        error: "这条忽略了风险差异，请检查“所有人相同”。"
      }
    ];

    const rowsEl = document.getElementById("auditRows");
    const doneEl = document.getElementById("doneCount");
    const totalEl = document.getElementById("totalCount");
    const resetEl = document.getElementById("resetAudit");
    const stamps = Array.from(document.querySelectorAll(".stamp"));
    const main = document.getElementById("main");
    const state = { selected: "keep", current: 0, done: new Set() };

    doneEl.textContent = Lec.P.roundTo(0, 0);
    totalEl.textContent = Lec.P.roundTo(source.length, 0);

    function makeRows() {
      rowsEl.innerHTML = "";
      source.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "audit-row lv";
        row.dataset.index = String(index);
        row.innerHTML = `${item.judgment}
          <div class="class-slot" data-slot="keep" aria-label="可沿用栏">可沿用</div>
          <div class="class-slot" data-slot="boundary" aria-label="须加边界栏">加边界</div>
          <div class="class-slot" data-slot="stop" aria-label="不可沿用栏">不可用</div>
          <div class="reason">归类后展开理由</div>`;
        row.addEventListener("dragover", event => {
          if (state.done.has(index)) return;
          event.preventDefault();
          row.classList.add("is-dragover");
        });
        row.addEventListener("dragleave", () => row.classList.remove("is-dragover"));
        row.addEventListener("drop", event => {
          event.preventDefault();
          row.classList.remove("is-dragover");
          state.current = index;
          setCurrent(index);
          applyStamp(event.dataTransfer.getData("text/plain") || state.selected, index);
        });
        rowsEl.appendChild(row);
      });
      setCurrent(0);
    }

    function setSelected(kind) {
      state.selected = kind;
      stamps.forEach(stamp => stamp.setAttribute("aria-pressed", String(stamp.dataset.kind === kind)));
    }

    function setCurrent(index) {
      const available = source.map((_, i) => i).filter(i => !state.done.has(i));
      if (!available.length) return;
      state.current = available.includes(index) ? index : available[0];
      rowsEl.querySelectorAll(".audit-row").forEach((row, i) => {
        row.classList.toggle("is-current", i === state.current && !state.done.has(i));
      });
    }

    function moveCurrent(delta) {
      const available = source.map((_, i) => i).filter(i => !state.done.has(i));
      if (!available.length) return;
      let position = available.indexOf(state.current);
      if (position < 0) position = 0;
      position = (position + delta + available.length) % available.length;
      setCurrent(available[position]);
    }

    function applyStamp(kind, index) {
      if (state.done.has(index)) return;
      const item = source[index];
      const row = rowsEl.children[index];
      const reason = row.querySelector(".reason");
      const stamp = stamps.find(node => node.dataset.kind === kind);

      row.classList.remove("is-wrong");
      reason.classList.remove("is-error");
      if (kind !== item.kind) {
        void row.offsetWidth;
        row.classList.add("is-wrong");
        stamp.classList.remove("is-wrong");
        void stamp.offsetWidth;
        stamp.classList.add("is-wrong");
        reason.textContent = item.error;
        reason.classList.add("is-error");
        window.setTimeout(() => {
          row.classList.remove("is-wrong");
          stamp.classList.remove("is-wrong");
        }, Deck.reduced() ? 0 : 300);
        return;
      }

      state.done.add(index);
      row.classList.add("is-correct");
      row.classList.remove("is-current");
      row.querySelector(`[data-slot="${item.kind}"]`).classList.add("is-marked");
      reason.textContent = item.reason;
      doneEl.textContent = Lec.P.roundTo(state.done.size, 0);

      const next = source.findIndex((_, i) => !state.done.has(i));
      if (next >= 0) setCurrent(next);
      if (state.done.size === source.length) finish();
    }

    function finish() {
      main.classList.add("is-complete");
      rowsEl.querySelectorAll(".audit-row").forEach((row, index) => {
        row.style.order = source[index].kind === "keep" ? "1" : source[index].kind === "boundary" ? "2" : "3";
        if (index === 2 || index === 4) row.style.borderTop = "2px solid var(--accent)";
      });
    }

    function reset() {
      state.done.clear();
      state.current = 0;
      main.classList.remove("is-complete");
      doneEl.textContent = Lec.P.roundTo(0, 0);
      setSelected("keep");
      makeRows();
      stamps[0].focus();
    }

    stamps.forEach(stamp => {
      stamp.addEventListener("click", () => setSelected(stamp.dataset.kind));
      stamp.addEventListener("dragstart", event => {
        setSelected(stamp.dataset.kind);
        event.dataTransfer.setData("text/plain", stamp.dataset.kind);
        event.dataTransfer.effectAllowed = "copy";
      });
      stamp.addEventListener("keydown", event => {
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          moveCurrent(event.key === "ArrowDown" ? 1 : -1);
        }
        if (event.key === "Enter") {
          event.preventDefault();
          applyStamp(stamp.dataset.kind, state.current);
        }
      });
    });

    resetEl.addEventListener("click", reset);
    makeRows();
  })();
</script>
</body>
</html>
