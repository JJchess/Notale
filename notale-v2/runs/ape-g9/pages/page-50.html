<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main { overflow: visible; }
  .lec-footer .lec-progress { overflow: visible; }
  .relay-game { position: relative; height: 100%; }
  .relay-top { height: 42px; }
  .relay-status { color: var(--text-strong); font-size: var(--fs-sec); font-weight: 700; }
  .relay-status strong { color: var(--accent); font-family: var(--font-mono); font-size: var(--fs-lead); }
  .relay-instruction { color: var(--text-muted); font-size: var(--fs-sec); line-height: var(--lh-copy); }
  .relay-board { position: relative; height: 344px; overflow: visible; }
  #relay { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 0; }
  .relay-link { fill: none; stroke-linecap: round; transition: stroke 180ms ease; }
  .relay-link.is-live { filter: drop-shadow(0 0 5px rgba(53,198,180,.45)); }
  .relay-link.is-current { stroke-dasharray: 8 8; }
  .relay-dot { fill: var(--primary-bright); filter: drop-shadow(0 0 6px var(--primary)); }
  .constraint-path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 7 8; opacity: .74; }
  .constraint-node { fill: var(--surface-yellow); stroke: var(--accent); stroke-width: 2; }
  .relay-axis { position: absolute; inset: 0; z-index: 1; display: flex; align-items: stretch; gap: 16px; padding-top: 74px; box-sizing: border-box; }
  .relay-axis.k-process > .axis { top: 178px; left: 20px; right: 20px; }
  .relay-axis.k-process > .step { height: 202px; padding: 14px 12px; justify-content: flex-start; border-top-color: var(--line-strong); background: rgba(13,26,32,.94); transition: border-color 180ms ease, background 180ms ease, transform 180ms ease; }
  .relay-axis.k-process > .step:nth-of-type(even) { transform: translateY(18px); }
  .relay-axis.k-process > .step.is-current { transform: translateY(-5px); }
  .relay-axis.k-process > .step:nth-of-type(even).is-current { transform: translateY(13px); }
  .relay-axis.k-process > .step.is-done { border-color: var(--primary); border-top-color: var(--primary-bright); background: var(--surface-teal); }
  .relay-axis.k-process > .arw { flex-basis: 18px; color: var(--text-faint); z-index: 4; }
  .relay-axis.k-process > .arw::before { content: "›"; }
  .station-head { display: flex; align-items: center; justify-content: space-between; min-height: 30px; }
  .station-num { display: grid; place-items: center; width: 27px; height: 27px; flex: 0 0 27px; color: var(--text-muted); font-family: var(--font-mono); font-size: var(--fs-label); font-weight: 700; border: 2px solid var(--line-strong); border-radius: 50%; }
  .is-current .station-num { color: var(--accent-ink); border-color: var(--accent); background: var(--accent); }
  .is-done .station-num { color: var(--accent-ink); border-color: var(--primary); background: var(--primary); }
  .station-question { min-height: 48px; margin-top: 8px; color: var(--text-muted); font-size: var(--fs-sec); font-weight: 600; line-height: var(--lh-copy); }
  .station-answer { display: flex; flex: 1 1 auto; flex-direction: column; justify-content: center; min-height: 76px; margin-top: 5px; padding-top: 8px; border-top: 1px solid var(--line); }
  .station-answer strong { color: var(--text-strong); font-family: var(--font-narrow); font-size: var(--fs-sec); line-height: 1.35; }
  .station-answer span { margin-top: 3px; color: var(--text-muted); font-size: var(--fs-sec); line-height: var(--lh-copy); }
  .station-empty { color: var(--text-faint); font-size: var(--fs-label); line-height: 1.35; }
  .system-figure { position: absolute; top: 1px; left: 0; width: 100%; height: 68px; pointer-events: none; z-index: 2; }
  .human-mark { position: absolute; top: 14px; left: 24px; width: 18px; height: 42px; border: 2px solid var(--text-muted); border-radius: 10px 10px 5px 5px; opacity: .82; }
  .human-mark::before { content: ""; position: absolute; top: -13px; left: 3px; width: 8px; height: 8px; border: 2px solid var(--text-muted); border-radius: 50%; background: var(--surface-0); }
  .system-rings { position: absolute; top: 3px; left: 7px; width: 54px; height: 60px; }
  .system-ring { position: absolute; inset: calc(var(--ring) * -5px); border: 2px solid var(--line); border-radius: 50%; opacity: .22; transition: border-color 180ms ease, opacity 180ms ease; }
  .system-ring.is-on { border-color: var(--primary); opacity: .86; }
  .system-caption { position: absolute; left: 82px; top: 15px; color: var(--text-muted); font-size: var(--fs-label); line-height: 1.35; }
  .completion-phrase { position: absolute; top: 14px; left: 50%; color: var(--primary-bright); font-family: var(--font-narrow); font-size: var(--fs-lead); font-weight: 700; transform: translateX(-50%); opacity: 0; transition: opacity 220ms ease; }
  .completion-phrase.is-visible { opacity: 1; }
  .relay-tray { position: relative; height: 198px; padding: 14px 16px 12px; box-sizing: border-box; border-top: 2px solid var(--line-strong); background: linear-gradient(180deg, rgba(19,36,43,.8), rgba(7,16,21,.2)); }
  .tray-head { min-height: 28px; }
  .tray-title { color: var(--text-strong); font-size: var(--fs-sec); font-weight: 700; }
  .relay-feedback { color: var(--accent); font-size: var(--fs-sec); line-height: 1.35; }
  .relay-feedback.is-success { color: var(--primary-bright); }
  .relay-cards { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .relay-card { width: calc((100% - 20px) / 3); min-height: 58px; justify-content: flex-start; flex-direction: column; align-items: flex-start; padding: 7px 12px; text-align: left; touch-action: none; user-select: none; cursor: grab; transition: transform 160ms ease, opacity 160ms ease, border-color 160ms ease; }
  .relay-card strong { color: var(--text-strong); font-family: var(--font-narrow); font-size: var(--fs-sec); line-height: 1.35; }
  .relay-card span { color: var(--text-muted); font-size: var(--fs-sec); font-weight: 500; line-height: var(--lh-copy); }
  .relay-card.is-dragging { position: relative; z-index: 20; border-color: var(--accent); cursor: grabbing; transition: none; }
  .relay-card.is-used { visibility: hidden; pointer-events: none; }
  .relay-card.is-wrong { animation: wrong-shake 280ms ease; }
  .relay-reset { min-width: 132px; font-size: var(--fs-sec); }
  .reset-icon { font-size: 20px; line-height: 1; }
  .relay-game.is-complete .relay-axis { animation: chain-pulse 620ms ease; }
  @keyframes wrong-shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-9px)} 55%{transform:translateX(9px)} 80%{transform:translateX(-5px)} }
  @keyframes chain-pulse { 0%,100%{filter:none} 45%{filter:drop-shadow(0 0 12px rgba(53,198,180,.65))} }
  @media (prefers-reduced-motion: reduce) {
    .relay-link, .relay-card, .relay-axis.k-process > .step, .completion-phrase { transition: none; }
    .relay-card.is-wrong, .relay-game.is-complete .relay-axis { animation: none; }
  }
</style>
</head>
<body data-page="50" data-total="52">
<div id="stage">
<main id="main">
  <relay-game class="relay-game col min0" aria-label="猿人到太空人的因果链接力">
    <div class="relay-top row items-center justify-between min0">
      <p class="relay-instruction">把能回答当前连接问题的卡拖入黄色站点；键盘可选中卡片后按 Enter。</p>
      <p class="relay-status" aria-live="polite">接力已完成 <strong id="doneCount">0 / 6</strong></p>
    </div>

    <section class="relay-board min0" aria-label="六站因果链">
      <svg id="relay" viewBox="0 0 1408 344" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="system-figure" aria-hidden="true">
        <div class="system-rings">
          <span class="system-ring" style="--ring:1"></span><span class="system-ring" style="--ring:2"></span><span class="system-ring" style="--ring:3"></span><span class="system-ring" style="--ring:4"></span><span class="system-ring" style="--ring:5"></span>
        </div>
        <div class="human-mark"></div>
        <span class="system-caption">身体仍在中心；每一环代表新增的系统条件</span>
      </div>
      <p class="completion-phrase" id="completionPhrase">同一副身体，新的系统处境</p>
      <div class="relay-axis k-process min0" id="relayAxis">
        <div class="axis"></div>
        <article class="step min0" data-step="1"><div class="station-head"><span class="station-num">1</span></div><p class="station-question">解释从什么开始？</p><div class="station-answer"><span class="station-empty">等待起点</span></div></article><span class="arw" aria-hidden="true"></span>
        <article class="step min0" data-step="2"><div class="station-head"><span class="station-num">2</span></div><p class="station-question">身体在哪里遇到边界？</p><div class="station-answer"><span class="station-empty">等待回答</span></div></article><span class="arw" aria-hidden="true"></span>
        <article class="step min0" data-step="3"><div class="station-head"><span class="station-num">3</span></div><p class="station-question">边界靠什么产生可继承的应对？</p><div class="station-answer"><span class="station-empty">等待回答</span></div></article><span class="arw" aria-hidden="true"></span>
        <article class="step min0" data-step="4"><div class="station-head"><span class="station-num">4</span></div><p class="station-question">知识怎样成为可运行的能力？</p><div class="station-answer"><span class="station-empty">等待回答</span></div></article><span class="arw" aria-hidden="true"></span>
        <article class="step min0" data-step="5"><div class="station-head"><span class="station-num">5</span></div><p class="station-question">谁决定能力的用途与代价？</p><div class="station-answer"><span class="station-empty">等待回答</span></div></article><span class="arw" aria-hidden="true"></span>
        <article class="step min0" data-step="6"><div class="station-head"><span class="station-num">6</span></div><p class="station-question">这些条件共同形成什么？</p><div class="station-answer"><span class="station-empty">等待终点</span></div></article>
      </div>
    </section>

    <section class="relay-tray min0" aria-label="乱序卡片托盘">
      <div class="tray-head row items-center justify-between gap-4">
        <span class="tray-title">乱序接力卡</span>
        <p class="relay-feedback grow text-center" id="feedback" aria-live="assertive">当前连接：解释从什么开始？</p>
        <button class="btn relay-reset" id="resetBtn" type="button" hidden><span class="reset-icon" aria-hidden="true">↻</span>重新接力</button>
      </div>
      <div class="relay-cards" id="relayCards">
        <button class="relay-card" type="button" data-card="3"><strong>累积文化</strong><span>保留成果，并让后来者继续改进</span></button>
        <button class="relay-card" type="button" data-card="1"><strong>灵长类身体</strong><span>能适应，也有明确边界</span></button>
        <button class="relay-card" type="button" data-card="5"><strong>制度选择</strong><span>在目标、资源、风险与权利之间取舍</span></button>
        <button class="relay-card" type="button" data-card="2"><strong>物理与生物约束</strong><span>环境不会迁就身体</span></button>
        <button class="relay-card" type="button" data-card="6"><strong>太空人</strong><span>被文化、技术与制度共同维持的灵长类身体</span></button>
        <button class="relay-card" type="button" data-card="4"><strong>协作技术系统</strong><span>分布式知识被造出、维护并运行</span></button>
      </div>
    </section>
  </relay-game>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
Lec.mount({index: 50, kicker: 'SYNTHESIS RELAY', title: '猿人到太空人的接力', take: '将身体、文化、物理约束和制度选择排成完整因果链，才能解释太空人。'});

(function () {
  const cardData = [
    { id: 1, title: '灵长类身体', body: '能适应，也有明确边界' },
    { id: 2, title: '物理与生物约束', body: '环境不会迁就身体' },
    { id: 3, title: '累积文化', body: '保留成果，并让后来者继续改进' },
    { id: 4, title: '协作技术系统', body: '分布式知识被造出、维护并运行' },
    { id: 5, title: '制度选择', body: '在目标、资源、风险与权利之间取舍' },
    { id: 6, title: '太空人', body: '被文化、技术与制度共同维持的灵长类身体' }
  ];
  const questions = ['解释从什么开始？', '身体在哪里遇到边界？', '边界靠什么产生可继承的应对？', '知识怎样成为可运行的能力？', '谁决定能力的用途与代价？', '这些条件共同形成什么？'];
  const links = d3.range(1, 6).map(function (i) { return { from: i, to: i + 1 }; });

  class RelayGame extends HTMLElement {
    connectedCallback() {
      if (this.ready) return;
      this.ready = true;
      this.axis = this.querySelector('#relayAxis');
      this.steps = Array.from(this.querySelectorAll('.step'));
      this.cards = Array.from(this.querySelectorAll('.relay-card'));
      this.feedback = this.querySelector('#feedback');
      this.count = this.querySelector('#doneCount');
      this.resetButton = this.querySelector('#resetBtn');
      this.phrase = this.querySelector('#completionPhrase');
      this.svg = d3.select(this.querySelector('#relay'));
      this.drag = null;
      this.bind();
      this.reset(false);
      window.addEventListener('resize', () => this.drawLinks());
    }

    initialState() { return { placed: [], current: 1, complete: false, trace: [] }; }
    getState() { return JSON.parse(JSON.stringify(this.state)); }
    start() { this.dispatchEvent(new CustomEvent('game-start', { bubbles: true, composed: true, detail: { state: this.getState() } })); }

    bind() {
      this.cards.forEach((card) => {
        card.addEventListener('click', () => {
          if (!this.drag) this.attempt(Number(card.dataset.card), this.state.current, card);
        });
        card.addEventListener('pointerdown', (event) => this.beginDrag(event, card));
        card.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            this.attempt(Number(card.dataset.card), this.state.current, card);
          }
        });
      });
      this.resetButton.addEventListener('click', () => this.reset(true));
    }

    beginDrag(event, card) {
      if (card.classList.contains('is-used')) return;
      event.preventDefault();
      card.setPointerCapture(event.pointerId);
      const p = Deck.pt(this, event);
      this.drag = { card: card, id: event.pointerId, start: p };
      card.classList.add('is-dragging');
      const move = (e) => {
        if (!this.drag || e.pointerId !== this.drag.id) return;
        const q = Deck.pt(this, e);
        card.style.transform = 'translate(' + (q.x - this.drag.start.x) + 'px,' + (q.y - this.drag.start.y) + 'px)';
      };
      const end = (e) => {
        if (!this.drag || e.pointerId !== this.drag.id) return;
        const q = Deck.pt(this, e);
        const target = this.stepAt(q);
        card.releasePointerCapture(e.pointerId);
        card.removeEventListener('pointermove', move);
        card.removeEventListener('pointerup', end);
        card.removeEventListener('pointercancel', cancel);
        card.classList.remove('is-dragging');
        card.style.transform = '';
        this.drag = null;
        this.attempt(Number(card.dataset.card), target, card);
      };
      const cancel = (e) => {
        if (!this.drag) return;
        card.classList.remove('is-dragging');
        card.style.transform = '';
        this.drag = null;
        card.removeEventListener('pointermove', move);
        card.removeEventListener('pointerup', end);
        card.removeEventListener('pointercancel', cancel);
      };
      card.addEventListener('pointermove', move);
      card.addEventListener('pointerup', end);
      card.addEventListener('pointercancel', cancel);
    }

    offsetWithin(el, ancestor) {
      let x = 0, y = 0, node = el;
      while (node && node !== ancestor) { x += node.offsetLeft; y += node.offsetTop; node = node.offsetParent; }
      return { x: x, y: y };
    }

    stepAt(point) {
      for (let i = 0; i < this.steps.length; i++) {
        const pos = this.offsetWithin(this.steps[i], this);
        const step = this.steps[i];
        if (point.x >= pos.x && point.x <= pos.x + step.offsetWidth && point.y >= pos.y && point.y <= pos.y + step.offsetHeight) return i + 1;
      }
      return 0;
    }

    attempt(cardId, target, card) {
      if (this.state.complete) return;
      const expected = this.state.current;
      const correct = cardId === expected && target === expected;
      if (!correct) {
        const question = questions[expected - 1];
        this.feedback.textContent = '这张卡回答不了「' + question + '」。';
        card.classList.remove('is-wrong');
        void card.offsetWidth;
        card.classList.add('is-wrong');
        window.setTimeout(() => card.classList.remove('is-wrong'), Deck.reduced() ? 0 : 300);
        return;
      }
      const data = cardData[cardId - 1];
      this.state.placed.push(cardId);
      this.state.trace.push({ card: cardId, station: expected });
      this.state.current += 1;
      this.state.complete = this.state.placed.length === cardData.length;
      card.classList.add('is-used');
      card.disabled = true;
      const answer = this.steps[expected - 1].querySelector('.station-answer');
      answer.innerHTML = '<strong>' + data.title + '</strong><span>' + data.body + '</span>';
      this.update();
      this.flashLink(expected - 1);
      const detail = { state: this.getState(), action: { type: 'place', card: cardId }, metrics: { completed: this.state.placed.length, total: cardData.length } };
      this.dispatchEvent(new CustomEvent('game-progress', { bubbles: true, composed: true, detail: detail }));
      if (this.state.complete) {
        this.dispatchEvent(new CustomEvent('game-complete', { bubbles: true, composed: true, detail: { score: cardData.length, metrics: detail.metrics, trace: this.getState().trace } }));
      }
    }

    update() {
      const n = this.state.placed.length;
      this.count.textContent = n + ' / ' + cardData.length;
      this.steps.forEach((step, i) => {
        step.classList.toggle('is-done', i < n);
        step.classList.toggle('is-current', i === n && !this.state.complete);
        if (i === n && !this.state.complete) step.setAttribute('aria-current', 'step'); else step.removeAttribute('aria-current');
      });
      this.querySelectorAll('.system-ring').forEach((ring, i) => ring.classList.toggle('is-on', i < Math.min(n, 5)));
      this.classList.toggle('is-complete', this.state.complete);
      this.phrase.classList.toggle('is-visible', this.state.complete);
      this.resetButton.hidden = !this.state.complete;
      if (this.state.complete) {
        this.feedback.textContent = '太空人不是身体单独升级，而是完整因果链产生的处境。';
        this.feedback.classList.add('is-success');
      } else {
        this.feedback.textContent = '当前连接：' + questions[n];
        this.feedback.classList.remove('is-success');
      }
      this.drawLinks();
    }

    drawLinks() {
      const board = this.querySelector('.relay-board');
      const size = { w: board.offsetWidth, h: board.offsetHeight };
      this.svg.attr('viewBox', '0 0 ' + size.w + ' ' + size.h);
      const centers = this.steps.map((step) => {
        const p = this.offsetWithin(step, board);
        return { x1: p.x, x2: p.x + step.offsetWidth, y: p.y + step.offsetHeight * 0.52 };
      });
      const n = this.state ? this.state.placed.length : 0;
      d3.select('#relay').selectAll('.relay-link').data(links, d => d.from + '-' + d.to).join('path')
        .attr('class', (d, i) => 'relay-link' + (i < n - 1 ? ' is-live' : '') + (i === Math.max(0, n - 1) && n < 6 ? ' is-current' : ''))
        .attr('d', (d, i) => {
          const a = centers[i], b = centers[i + 1], gap = b.x1 - a.x2;
          return 'M' + a.x2 + ',' + a.y + ' C' + (a.x2 + gap * .46) + ',' + a.y + ' ' + (b.x1 - gap * .46) + ',' + b.y + ' ' + b.x1 + ',' + b.y;
        })
        .attr('stroke', (d, i) => i < n - 1 ? '#35C6B4' : (i === Math.max(0, n - 1) && n < 6 ? '#FFCC4D' : '#506068'))
        .attr('stroke-width', 3);
      const second = centers[1], fifth = centers[4];
      this.svg.selectAll('.constraint-path').data([{ a: second, b: fifth }]).join('path')
        .attr('class', 'constraint-path')
        .attr('d', d => 'M' + d.a.x1 + ',' + (d.a.y - 96) + ' C' + (d.a.x2 + 70) + ',' + (d.a.y - 138) + ' ' + (d.b.x1 - 70) + ',' + (d.b.y - 138) + ' ' + (d.b.x1 + 28) + ',' + (d.b.y - 90));
      this.svg.selectAll('.constraint-node').data([fifth]).join('circle').attr('class', 'constraint-node').attr('cx', d => d.x1 + 28).attr('cy', d => d.y - 90).attr('r', 7);
    }

    flashLink(index) {
      if (index < 1 || index > 5 || Deck.reduced()) return;
      const path = this.svg.selectAll('.relay-link').filter((d) => d.from === index).node();
      if (!path) return;
      const length = path.getTotalLength();
      const dot = this.svg.append('circle').attr('class', 'relay-dot').attr('r', 5);
      dot.transition().duration(430).ease(d3.easeCubicOut).attrTween('transform', function () {
        return function (t) { const p = path.getPointAtLength(length * t); return 'translate(' + p.x + ',' + p.y + ')'; };
      }).remove();
    }

    reset(emit) {
      this.state = this.initialState();
      this.cards.forEach((card) => { card.classList.remove('is-used', 'is-wrong', 'is-dragging'); card.disabled = false; card.style.transform = ''; });
      this.steps.forEach((step, i) => { step.querySelector('.station-answer').innerHTML = '<span class="station-empty">' + (i === 0 ? '等待起点' : i === 5 ? '等待终点' : '等待回答') + '</span>'; });
      this.update();
      if (emit) this.dispatchEvent(new CustomEvent('game-reset', { bubbles: true, composed: true, detail: { state: this.getState() } }));
    }
  }

  customElements.define('relay-game', RelayGame);
})();
</script>
</body>
</html>
