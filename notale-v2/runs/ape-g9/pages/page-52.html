<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main { position: relative; }

  .coda-scene {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    isolation: isolate;
  }

  .trace-photo {
    position: absolute;
    margin: 0;
    overflow: hidden;
    z-index: 0;
  }

  .trace-photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(.72) contrast(1.08) brightness(.72);
  }

  .trace-photo::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .trace-photo--earth {
    left: 0;
    bottom: 0;
    width: 510px;
    height: 360px;
    opacity: 0;
    animation: photo-in 900ms ease-out 80ms forwards;
    -webkit-mask-image: linear-gradient(135deg, #000 25%, rgba(0,0,0,.92) 58%, transparent 96%);
    mask-image: linear-gradient(135deg, #000 25%, rgba(0,0,0,.92) 58%, transparent 96%);
  }

  .trace-photo--earth img { object-position: 48% 50%; }
  .trace-photo--earth::after {
    background: linear-gradient(145deg, transparent 30%, rgba(7,16,21,.3) 68%, var(--surface-0) 100%);
  }

  .trace-photo--moon {
    top: 0;
    right: 0;
    width: 430px;
    height: 390px;
    opacity: 0;
    animation: photo-in 900ms ease-out 1700ms forwards;
    -webkit-mask-image: linear-gradient(315deg, #000 22%, rgba(0,0,0,.9) 60%, transparent 98%);
    mask-image: linear-gradient(315deg, #000 22%, rgba(0,0,0,.9) 60%, transparent 98%);
  }

  .trace-photo--moon img { object-position: 50% 52%; }
  .trace-photo--moon::after {
    background: linear-gradient(315deg, transparent 34%, rgba(7,16,21,.25) 70%, var(--surface-0) 100%);
  }

  .photo-caption {
    position: absolute;
    z-index: 4;
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
  }

  .photo-caption strong {
    display: block;
    color: var(--text-strong);
    font-family: var(--font-narrow);
    font-size: var(--fs-h2);
    line-height: 1.3;
  }

  .photo-caption--earth { left: 28px; bottom: 24px; }
  .photo-caption--moon { top: 22px; right: 26px; text-align: right; }

  .journey-line {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .journey-line .base,
  .journey-line .branch {
    fill: none;
    stroke: var(--primary);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  .journey-line .base {
    stroke-dasharray: 1450;
    stroke-dashoffset: 1450;
    animation: draw-line 1550ms ease-in-out 480ms forwards;
  }

  .journey-line .branch {
    stroke: var(--primary-dark);
    opacity: .78;
    stroke-dasharray: 180;
    stroke-dashoffset: 180;
    animation: draw-line 540ms ease-out forwards;
  }

  .journey-line .b1 { animation-delay: 760ms; }
  .journey-line .b2 { animation-delay: 980ms; }
  .journey-line .b3 { animation-delay: 1200ms; }
  .journey-line .b4 { animation-delay: 1420ms; }

  .journey-line .origin {
    fill: var(--primary);
    opacity: .85;
  }

  .journey-line .convergence {
    fill: var(--accent);
    stroke: var(--surface-0);
    stroke-width: 8;
    transform-box: fill-box;
    transform-origin: center;
    animation: converge 900ms ease-out 1980ms both;
  }

  .coda-generalization {
    position: absolute;
    inset: 20px 244px 18px 258px;
    width: auto;
    z-index: 3;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    gap: var(--sp-5);
  }

  .coda-generalization > .supports {
    grid-row: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: var(--sp-3);
    padding: 52px 36px 10px 70px;
  }

  .coda-generalization > .supports::before,
  .coda-generalization .support::before,
  .coda-generalization > .trunk { display: none; }

  .coda-generalization .support {
    display: grid;
    grid-template-columns: 72px minmax(0, 1fr) 146px;
    align-items: center;
    min-height: 66px;
    box-sizing: border-box;
    padding: var(--sp-3) var(--sp-4);
    border-color: var(--line-strong);
    border-top-color: var(--primary-dark);
    background: rgba(13, 26, 32, .9);
    backdrop-filter: blur(8px);
    opacity: 0;
    transform: translateY(10px);
    animation: support-in 420ms ease-out forwards;
  }

  .coda-generalization .support:nth-child(1) { margin-right: 110px; animation-delay: 760ms; }
  .coda-generalization .support:nth-child(2) { margin-left: 34px; margin-right: 76px; animation-delay: 980ms; }
  .coda-generalization .support:nth-child(3) { margin-left: 68px; margin-right: 42px; animation-delay: 1200ms; }
  .coda-generalization .support:nth-child(4) { margin-left: 102px; animation-delay: 1420ms; }

  .support-key {
    color: var(--primary-bright);
    font-family: var(--font-narrow);
    font-size: var(--fs-h2);
    font-weight: 700;
    line-height: 1.3;
  }

  .support-text {
    color: var(--text-strong);
    font-size: var(--fs-body);
    line-height: var(--lh-copy);
  }

  .merge-word {
    color: var(--text-muted);
    font-size: var(--fs-sec);
    font-weight: 700;
    line-height: var(--lh-copy);
    text-align: right;
  }

  .coda-generalization > .claim {
    grid-row: 2;
    width: 790px;
    justify-self: end;
    box-sizing: border-box;
    padding: var(--sp-4) var(--sp-5);
    border-left-color: var(--accent);
    background: rgba(255, 204, 77, .13);
    opacity: 0;
    animation: claim-in 620ms ease-out 2050ms forwards;
  }

  .claim-main {
    display: block;
    color: var(--text-strong);
    font-family: var(--font-narrow);
    font-size: var(--fs-h2);
    font-weight: 700;
    line-height: 1.3;
  }

  .claim-tag {
    display: inline-block;
    margin-left: var(--sp-3);
    color: var(--accent);
    font-size: var(--fs-sec);
    line-height: var(--lh-copy);
  }

  .closing-line {
    position: absolute;
    right: 26px;
    bottom: 22px;
    z-index: 4;
    width: 820px;
    color: var(--text-muted);
    font-size: var(--fs-lead);
    line-height: var(--lh-copy);
    text-align: right;
    opacity: 0;
    animation: support-in 520ms ease-out 2350ms forwards;
  }

  @keyframes photo-in { to { opacity: .78; } }
  @keyframes draw-line { to { stroke-dashoffset: 0; } }
  @keyframes support-in { to { opacity: 1; transform: translateY(0); } }
  @keyframes claim-in { to { opacity: 1; } }
  @keyframes converge {
    0% { opacity: 0; transform: scale(.45); }
    55% { opacity: 1; transform: scale(1.55); }
    100% { opacity: 1; transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .trace-photo,
    .journey-line .base,
    .journey-line .branch,
    .journey-line .convergence,
    .coda-generalization .support,
    .coda-generalization > .claim,
    .closing-line {
      animation: none;
      opacity: 1;
      transform: none;
      stroke-dashoffset: 0;
    }
  }
</style>
</head>
