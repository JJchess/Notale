<!doctype html>

<style>
  .opening-visual {
    position: relative;
    width: 100%;
    height: min(540px, 72%);
    min-height: 430px;
    margin: 0;
    overflow: hidden;
    border-block: 1px solid var(--line);
    background:
      radial-gradient(circle at 50% 48%, var(--accent-soft), transparent 22%),
      linear-gradient(180deg, transparent, var(--surface-1));
  }

  .opening-visual svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .horizon {
    fill: none;
    stroke: var(--line);
    stroke-width: 2;
  }

  .terrain {
    fill: var(--surface-2);
  }

  .ancestor {
    color: var(--text-muted);
  }

  .astronaut {
    color: var(--text);
  }

  .figure-fill {
    fill: currentColor;
  }

  .figure-cut {
    fill: var(--surface-1);
  }

  .suit-line {
    fill: none;
    stroke: var(--line-strong);
    stroke-width: 5;
  }

  .star {
    fill: var(--accent-strong);
  }

  .opening-question {
    position: absolute;
    left: 50%;
    top: 46%;
    width: min(560px, 44%);
    padding: var(--sp-4) var(--sp-5);
    border-block: 1px solid var(--line-strong);
    color: var(--text);
    background: var(--surface-1);
    font-size: var(--fs-h2);
    font-weight: 730;
    line-height: var(--lh-heading);
    letter-spacing: -0.025em;
    text-align: center;
    transform: translate(-50%, -50%);
  }

  .opening-prompt {
    max-width: 940px;
    color: var(--text-muted);
    font-size: var(--fs-body-lg);
    line-height: var(--lh-copy);
    letter-spacing: 0.015em;
  }
</style>
</head>

<script>
  Deck.init({ index: 1, total: 18 });

  Lec.mount({
    index: 1,
    kicker: `APEMAN / SPACEMAN`,
    title: `从“猿人”到“太空人”，中间真的只有一条路吗？`,
    take: `这堂课研究的不是一条进步阶梯，而是身体、文化与环境如何共同定义“人能去哪里”。`
  });

  const mountedTitle = document.querySelector('.lec-header__title');
  if (mountedTitle && mountedTitle.tagName === 'H1') {
    const compactTitle = document.createElement('div');
    compactTitle.className = mountedTitle.className;
    compactTitle.setAttribute('role', 'heading');
    compactTitle.setAttribute('aria-level', '1');
    compactTitle.textContent = mountedTitle.textContent;
    mountedTitle.replaceWith(compactTitle);
  }
</script>
