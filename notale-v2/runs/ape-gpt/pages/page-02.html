<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-header__inner,
    .lec-footer__inner {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: var(--sp-6);
      align-items: center;
      justify-content: space-between;
    }

    .lec-header__identity,
    .lec-header__heading,
    .lec-footer__take {
      display: flex;
      min-width: 0;
      align-items: center;
    }

    .lec-header__identity {
      gap: var(--sp-4);
    }

    .lec-header__heading,
    .lec-footer__take {
      gap: var(--sp-3);
    }

    .lec-header__index {
      display: flex;
      min-height: var(--sp-5);
      align-items: center;
      color: var(--accent-strong);
      font-family: var(--font-mono);
      font-size: var(--fs-h3);
      font-weight: 720;
      line-height: 1.15;
    }

    .lec-header__kicker,
    .lec-footer__take-label {
      color: var(--accent);
      font-size: var(--fs-label);
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }

    .lec-header__title {
      overflow: hidden;
      font-size: var(--fs-body-lg);
      font-weight: 700;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lec-footer__take-text,
    .lec-footer__index {
      font-size: var(--fs-tick);
      line-height: 1.35;
    }

    .lec-footer__index {
      font-family: var(--font-mono);
    }

    .page-shell {
      display: flex;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      padding-block: var(--sp-5) var(--sp-4);
      flex-direction: column;
      gap: var(--sp-4);
    }

    .opening-prompt {
      display: flex;
      min-width: 0;
      min-height: var(--sp-8);
      padding-inline: var(--sp-4);
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-4);
    }

    .opening-prompt p {
      font-size: var(--fs-body-lg);
      line-height: var(--lh-copy);
    }

    .vote-card {
      display: flex;
      min-width: 0;
      min-height: 0;
      padding: var(--sp-5);
      flex-direction: column;
      gap: var(--sp-4);
      justify-content: space-between;
    }

    .story-head {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
    }

    .story-mark {
      display: grid;
      width: var(--sp-6);
      height: var(--sp-6);
      flex: 0 0 var(--sp-6);
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-pill);
      color: var(--accent-strong);
      font-family: var(--font-mono);
      font-size: var(--fs-label);
      font-weight: 720;
    }

    .causal-story {
      display: flex;
      min-height: 210px;
      padding-block: var(--sp-4);
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: var(--sp-3);
      border-block: 1px solid var(--line);
    }

    .causal-step {
      display: grid;
      min-height: var(--sp-7);
      padding: var(--sp-3);
      place-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      font-size: var(--fs-body-lg);
      font-weight: 650;
      line-height: var(--lh-copy);
      text-align: center;
    }

    .causal-arrow {
      color: var(--accent);
      font-size: var(--fs-h3);
      line-height: var(--lh-tight);
      text-align: center;
    }

    .vote-zone {
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
    }

    .vote-zone button {
      width: 100%;
    }

    .vote-result {
      display: flex;
      min-height: var(--control-h);
      padding-inline: var(--sp-3);
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-3);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface-1);
      color: var(--text-muted);
      font-size: var(--fs-label);
      line-height: 1.4;
    }

    .vote-count {
      color: var(--accent-strong);
      font-family: var(--font-mono);
      font-weight: 720;
      font-variant-numeric: tabular-nums;
    }

    .synthesis {
      display: grid;
      min-height: 92px;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.6fr);
      gap: var(--sp-5);
      align-items: center;
    }

    .synthesis[hidden] {
      display: none;
    }

    .synthesis p {
      font-size: var(--fs-body);
      line-height: var(--lh-copy);
    }

    .three-lines {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: flex-end;
      gap: var(--sp-2);
    }

    .line-name {
      display: inline-flex;
      min-height: var(--control-h);
      padding-inline: var(--sp-3);
      align-items: center;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-pill);
      color: var(--text);
      font-size: var(--fs-label);
      font-weight: 680;
      line-height: 1.4;
      white-space: nowrap;
    }

    .line-join {
      color: var(--text-faint);
      font-size: var(--fs-label);
      line-height: 1.4;
    }
  </style>
</head>
<body data-page="02" data-total="18">
  <div id="stage">
    <main class="page-shell" aria-label="三种因果故事投票">
      <div class="panel panel--quiet opening-prompt">
        <p>先选最接近你直觉的一种解释。</p>
        <span class="badge">不计分 · 每人一票</span>
      </div>

      <section class="triptych grow" aria-label="三个候选解释">
        <article class="card vote-card min0" data-choice="body">
          <div class="story-head">
            <span class="story-mark" aria-hidden="true">A</span>
            <h2 class="h3">身体升级</h2>
          </div>
          <div class="causal-story" aria-label="身体越来越高级，最终离开地球">
            <div class="causal-step">身体越来越高级</div>
            <div class="causal-arrow" aria-hidden="true">↓</div>
            <div class="causal-step">最终有能力离开地球</div>
          </div>
          <div class="vote-zone">
            <button type="button" data-vote="body" aria-pressed="false">选择这条故事</button>
            <div class="vote-result">
              <span data-status>等待你的选择</span>
              <span class="vote-count" data-count hidden>0 票</span>
            </div>
          </div>
        </article>

        <article class="card vote-card min0" data-choice="brain">
          <div class="story-head">
            <span class="story-mark" aria-hidden="true">B</span>
            <h2 class="h3">大脑发明</h2>
          </div>
          <div class="causal-story" aria-label="聪明大脑发明工具，再建造飞船">
            <div class="causal-step">聪明大脑发明工具</div>
            <div class="causal-arrow" aria-hidden="true">↓</div>
            <div class="causal-step">工具升级为飞船</div>
          </div>
          <div class="vote-zone">
            <button type="button" data-vote="brain" aria-pressed="false">选择这条故事</button>
            <div class="vote-result">
              <span data-status>等待你的选择</span>
              <span class="vote-count" data-count hidden>0 票</span>
            </div>
          </div>
        </article>

        <article class="card vote-card min0" data-choice="culture">
          <div class="story-head">
            <span class="story-mark" aria-hidden="true">C</span>
            <h2 class="h3">文化接力</h2>
          </div>
          <div class="causal-story" aria-label="群体学习前人，再合作应对环境">
            <div class="causal-step">群体学习并改进前人的办法</div>
            <div class="causal-arrow" aria-hidden="true">↓</div>
            <div class="causal-step">合作应对陌生环境</div>
          </div>
          <div class="vote-zone">
            <button type="button" data-vote="culture" aria-pressed="false">选择这条故事</button>
            <div class="vote-result">
              <span data-status>等待你的选择</span>
              <span class="vote-count" data-count hidden>0 票</span>
            </div>
          </div>
        </article>
      </section>

      <aside class="callout synthesis" id="synthesis" aria-live="polite">
        <p data-synthesis-text><strong>选定之后：</strong>这条故事遗漏了什么？</p>
        <div class="three-lines" hidden aria-label="接下来重组故事的三条线">
          <span class="line-name">生物演化</span>
          <span class="line-join" aria-hidden="true">×</span>
          <span class="line-name">文化累积</span>
          <span class="line-join" aria-hidden="true">×</span>
          <span class="line-name">环境约束</span>
        </div>
      </aside>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Deck.init({ index: 2, total: 18 });

    Lec.mount({
      index: 2,
      kicker: `THREE STORIES`,
      title: `你脑中的“从猿到太空”是哪一种故事？`,
      take: `同一句“从猿到太空”，可能偷偷携带完全不同的因果解释。`
    });

    (function () {
      var choiceKey = 'apeman-spaceman:opening-choice';
      var countsKey = 'apeman-spaceman:opening-counts';
      var choices = ['body', 'brain', 'culture'];
      var counts = { body: 0, brain: 0, culture: 0 };
      var current = null;

      try {
        var savedCounts = JSON.parse(localStorage.getItem(countsKey) || '{}');
        choices.forEach(function (key) {
          var value = Number(savedCounts[key]);
          counts[key] = Number.isFinite(value) && value >= 0 ? Math.floor(value) : 0;
        });
        current = localStorage.getItem(choiceKey);
        if (choices.indexOf(current) < 0) current = null;
      } catch (error) {
        current = null;
      }

      function render() {
        var hasVotes = choices.some(function (key) { return counts[key] > 0; });
        document.querySelectorAll('[data-choice]').forEach(function (card) {
          var key = card.getAttribute('data-choice');
          var chosen = key === current;
          var button = card.querySelector('[data-vote]');
          var result = card.querySelector('.vote-result');
          card.classList.toggle('card--accent', chosen);
          button.classList.toggle('primary', chosen);
          button.setAttribute('aria-pressed', chosen ? 'true' : 'false');
          button.textContent = chosen ? '你当前的假设' : '选择这条故事';
          result.hidden = false;
          card.querySelector('[data-count]').hidden = !hasVotes;
          card.querySelector('[data-count]').textContent = String(counts[key]) + ' 票';
          card.querySelector('[data-status]').textContent = hasVotes
            ? (chosen ? '你当前的假设 · 本地累计' : '本地课堂累计')
            : '等待你的选择';
        });
        document.getElementById('synthesis').hidden = false;
        document.querySelector('.three-lines').hidden = !current;
        document.querySelector('[data-synthesis-text]').innerHTML = current
          ? '<strong>先不判对错。</strong>你选的故事遗漏了什么？'
          : '<strong>选定之后：</strong>这条故事遗漏了什么？';
      }

      document.querySelectorAll('[data-vote]').forEach(function (button) {
        button.addEventListener('click', function () {
          var selected = button.getAttribute('data-vote');
          counts[selected] += 1;
          current = selected;
          try {
            localStorage.setItem(choiceKey, current);
            localStorage.setItem(countsKey, JSON.stringify(counts));
          } catch (error) {
            /* file:// 隐私模式下仍保留本次页面状态。 */
          }
          render();
        });
      });

      render();
    }());
  </script>
</body>
</html>
