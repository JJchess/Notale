<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-header__inner, .lec-footer__inner { display: flex; width: 100%; min-width: 0; align-items: center; justify-content: space-between; }
    .lec-header__identity, .lec-footer__take { display: flex; min-width: 0; align-items: center; gap: var(--sp-3); }
    .lec-header__heading { display: flex; min-width: 0; align-items: baseline; gap: var(--sp-3); }
    .lec-header__title { font-size: var(--fs-body-lg); line-height: var(--lh-heading); letter-spacing: -0.015em; white-space: nowrap; }
    .lec-header__kicker, .lec-header__index, .lec-footer__take-label, .lec-footer__take-text, .lec-footer__index { white-space: nowrap; }
    .lec-header__kicker { color: var(--accent-strong); font-size: var(--fs-tick); }
    .lec-footer__take { overflow: hidden; }
    .lec-footer__take-label { color: var(--accent-strong); font-weight: 700; }
    .lec-footer__take-text { overflow: hidden; text-overflow: ellipsis; }
    .branch-page { padding-block: var(--sp-4); }
    .tree-stage { display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; padding: var(--sp-3) var(--sp-4); }
    .false-model { display: flex; min-height: 78px; padding: var(--sp-2) var(--sp-3); align-items: center; justify-content: space-between; gap: var(--sp-4); border: 1px solid var(--danger); border-radius: var(--radius-sm); background: var(--surface-2); transition: min-height 240ms ease; }
    .false-model.is-folded { min-height: 48px; border-color: var(--line); }
    .false-copy { min-width: 0; }
    .false-copy strong { display: block; color: var(--danger); font-size: var(--fs-label); }
    .false-copy p { color: var(--text-muted); font-size: var(--fs-body); line-height: var(--lh-body); }
    .false-model.is-folded .false-copy p { display: none; }
    .ladder { display: flex; flex-shrink: 0; align-items: center; gap: var(--sp-2); color: var(--text); font-size: var(--fs-label); font-weight: 700; }
    .false-model.is-folded .ladder { color: var(--text-faint); }
    .ladder-step { padding: var(--sp-1) var(--sp-2); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-3); }
    .ladder-arrow { color: var(--danger); }
    .tree-wrap { position: relative; min-width: 0; min-height: 0; }
    #tree { width: 100%; height: 100%; display: block; touch-action: none; }
    .skeleton-link { fill: none; stroke: var(--line-strong); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .skeleton-link.hominin { stroke-dasharray: 10 8; }
    .slot { fill: var(--surface-1); stroke: var(--line-strong); stroke-width: 2; stroke-dasharray: 7 7; }
    .slot-guide { fill: var(--text-faint); font-size: var(--fs-label); text-anchor: middle; }
    .fork-mark { fill: var(--accent); }
    .node { cursor: grab; outline: none; }
    .node:active { cursor: grabbing; }
    .node rect { fill: var(--surface-raised); stroke: var(--accent); stroke-width: 2; }
    .node text { fill: var(--text); font-size: var(--fs-label); font-weight: 700; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
    .node:focus rect { stroke: var(--focus); stroke-width: 5; }
    .node.is-placed rect { fill: var(--accent-soft); }
    .tree-instruction { position: absolute; left: var(--sp-2); bottom: var(--sp-1); color: var(--text-muted); font-size: var(--fs-label); line-height: 1.4; pointer-events: none; }
    .evidence-card { display: flex; flex-direction: column; justify-content: space-between; gap: var(--sp-3); overflow: hidden; }
    .evidence-card h3 { font-size: var(--fs-body-lg); }
    .evidence-card p { color: var(--text-muted); font-size: var(--fs-body); line-height: var(--lh-copy); }
    .status { padding: var(--sp-2) var(--sp-3); border-inline-start: 5px solid var(--warning); background: var(--surface-2); color: var(--text); font-size: var(--fs-body); line-height: var(--lh-body); }
    .status.ok { border-color: var(--positive); }
    .time-range { color: var(--accent-strong); font-family: var(--font-mono); font-size: var(--fs-h3); font-weight: 720; line-height: var(--lh-heading); }
    .term { color: var(--warning); font-family: var(--font-mono); font-size: var(--fs-body-lg); font-weight: 720; }
    @media (prefers-reduced-motion: reduce) { .false-model { transition: none; } }
  </style>
</head>
<body data-page="03" data-total="18">
  <div id="stage">
    <main class="stage-cards branch-page" aria-label="分支演化重建活动">
      <section class="panel tree-stage min0" aria-labelledby="tree-help">
        <div class="false-model" id="false-model">
          <div class="false-copy">
            <strong>故意错误的阶梯</strong>
            <p>它暗示了哪些并不存在的祖先关系和前进方向？</p>
          </div>
          <div class="ladder" aria-label="猴到猿再到人的错误阶梯">
            <span class="ladder-step">猴</span><span class="ladder-arrow">→</span>
            <span class="ladder-step">猿</span><span class="ladder-arrow">→</span>
            <span class="ladder-step">人</span>
          </div>
        </div>
        <div class="tree-wrap no-pan">
          <svg id="tree" viewBox="0 0 1400 390" role="group" aria-label="把四个节点拖入分支树骨架">
            <title>可拖拽重建的分支树</title>
            <desc>共同祖先位于树根。黑猩猩、人类和已灭绝人族分支位于不同枝端。</desc>
          </svg>
          <p class="tree-instruction" id="tree-help">拖动节点到虚线位置。键盘可用方向键选位置，Escape 撤回。</p>
        </div>
      </section>

      <article class="card card--quiet evidence-card min0">
        <div>
          <h3>只检查拓扑</h3>
          <p>系统只问谁从哪个分叉延伸，不比较外形像不像。</p>
        </div>
        <div class="status" id="status" role="status" aria-live="polite">等待所有节点进入树中。</div>
      </article>

      <article class="card card--quiet evidence-card min0">
        <div>
          <h3>分叉时间是范围</h3>
          <div class="time-range" id="split-range"></div>
          <p>人类与黑猩猩谱系分开的大致区间，不是精确瞬间。</p>
        </div>
        <p id="earth-fraction"></p>
      </article>

      <article class="card card--quiet evidence-card min0">
        <div>
          <h3>用词边界</h3>
          <div class="term">“apeman / 猿人”</div>
        </div>
        <p>这里只把它当作要审视的历史化俗称，不当作严谨分类名称。</p>
      </article>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
    Deck.init({ index: 3, total: 18 });

    Lec.mount({
      index: 3,
      kicker: `BRANCHES, NOT STEPS`,
      title: `人类不是从今天的猿“升级”而来`,
      take: `现代人和其他现生类人猿是共享祖先的分支，不是谁变成了谁。`
    });

    const svg = d3.select('#tree');
    const K = Lec.K;
    const P = Lec.P;
    const slots = [
      { id: 'human', x: 275, y: 82 },
      { id: 'extinct', x: 600, y: 82 },
      { id: 'chimp', x: 1010, y: 82 },
      { id: 'ancestor', x: 750, y: 265 }
    ];
    const nodes = [
      { id: 'chimp', label: '黑猩猩', x: 330, y: 347, homeX: 330 },
      { id: 'ancestor', label: '共同祖先', x: 580, y: 347, homeX: 580 },
      { id: 'human', label: '现代人', x: 820, y: 347, homeX: 820 },
      { id: 'extinct', label: '已灭绝人族分支', x: 1100, y: 347, homeX: 1100 }
    ];

    const links = [
      'M750,265 L750,190 L1010,82',
      'M750,190 L435,155',
      'M435,155 L275,82',
      'M435,155 L600,82'
    ];
    svg.append('g').selectAll('path').data(links).join('path')
      .attr('class', (d, i) => i > 1 ? 'skeleton-link hominin' : 'skeleton-link')
      .attr('d', d => d);
    svg.append('circle').attr('class', 'fork-mark').attr('cx', 750).attr('cy', 190).attr('r', 7);
    svg.append('circle').attr('class', 'fork-mark').attr('cx', 435).attr('cy', 155).attr('r', 7);

    const slotG = svg.append('g').selectAll('g').data(slots).join('g')
      .attr('transform', d => `translate(${d.x},${d.y})`);
    slotG.append('rect').attr('class', 'slot').attr('x', -105).attr('y', -25).attr('width', 210).attr('height', 50).attr('rx', 8);
    slotG.append('text').attr('class', 'slot-guide').attr('y', 5).text('放置节点');

    const nodeG = svg.append('g').selectAll('g').data(nodes).join('g')
      .attr('class', 'node')
      .attr('role', 'button')
      .attr('tabindex', 0)
      .attr('aria-label', d => `${d.label}，可拖动节点`)
      .attr('transform', d => `translate(${d.x},${d.y})`);
    nodeG.append('rect').attr('x', -108).attr('y', -25).attr('width', 216).attr('height', 50).attr('rx', 8);
    nodeG.append('text').attr('y', 1).text(d => d.label);

    function moveNode(selection, d, x, y) {
      d.x = x;
      d.y = y;
      const target = selection.attr('transform', `translate(${x},${y})`);
      if (!Deck.reduced()) target.transition().duration(180).attr('transform', `translate(${x},${y})`);
    }

    function clearSlot(node) {
      if (node.slot) node.slot = null;
    }

    function assign(node, slot) {
      const displaced = nodes.find(n => n !== node && n.slot === slot.id);
      if (displaced) {
        displaced.slot = null;
        moveNode(nodeG.filter(d => d === displaced), displaced, displaced.homeX, 347);
        nodeG.filter(d => d === displaced).classed('is-placed', false);
      }
      node.slot = slot.id;
      moveNode(nodeG.filter(d => d === node), node, slot.x, slot.y);
      nodeG.filter(d => d === node).classed('is-placed', true);
      evaluate();
    }

    function withdraw(node) {
      clearSlot(node);
      moveNode(nodeG.filter(d => d === node), node, node.homeX, 347);
      nodeG.filter(d => d === node).classed('is-placed', false);
      evaluate();
    }

    const drag = d3.drag()
      .on('start', function(event, d) { d3.select(this).raise(); })
      .on('drag', function(event, d) {
        const p = Deck.pt(document.getElementById('tree'), event.sourceEvent);
        d.x = p.x;
        d.y = p.y;
        d3.select(this).attr('transform', `translate(${d.x},${d.y})`);
      })
      .on('end', function(event, d) {
        const nearest = slots.reduce((best, s) => {
          const dist = Math.hypot(d.x - s.x, d.y - s.y);
          return dist < best.dist ? { slot: s, dist: dist } : best;
        }, { slot: null, dist: Infinity });
        if (nearest.dist < 125) assign(d, nearest.slot); else withdraw(d);
      });
    nodeG.call(drag);

    nodeG.on('keydown', function(event, d) {
      const current = d.slot ? slots.find(s => s.id === d.slot) : { x: d.x, y: d.y };
      let candidates = slots.filter(s => s.id !== d.slot);
      if (event.key === 'ArrowLeft') candidates = candidates.filter(s => s.x < current.x).sort((a,b) => b.x-a.x);
      else if (event.key === 'ArrowRight') candidates = candidates.filter(s => s.x > current.x).sort((a,b) => a.x-b.x);
      else if (event.key === 'ArrowUp') candidates = candidates.filter(s => s.y < current.y).sort((a,b) => b.y-a.y);
      else if (event.key === 'ArrowDown') candidates = candidates.filter(s => s.y > current.y).sort((a,b) => a.y-b.y);
      else if (event.key === 'Escape') { event.preventDefault(); withdraw(d); return; }
      else return;
      event.preventDefault();
      if (candidates.length) assign(d, candidates[0]);
    });

    function evaluate() {
      const status = document.getElementById('status');
      const allPlaced = nodes.every(n => n.slot);
      const correct = allPlaced && nodes.every(n => n.slot === n.id);
      status.classList.toggle('ok', correct);
      if (!allPlaced) status.textContent = '等待所有节点进入树中。';
      else if (correct) status.textContent = '拓扑成立：共享祖先后分成多条支系。';
      else status.textContent = '拓扑未成立：检查树根与各个枝端。';
      const falseModel = document.getElementById('false-model');
      falseModel.classList.toggle('is-folded', correct);
      falseModel.querySelector('strong').textContent = correct ? '错误阶梯已折叠为旁证' : '故意错误的阶梯';
    }

    const splitMinYears = P.scaleValue(K.math.five, K.math.one, K.prefixes.mega);
    const splitMaxYears = K.evolution.homininSplitYearsAgo;
    const splitMinMa = P.significant(P.divide(splitMinYears, K.prefixes.mega), K.display.defaultPrecision);
    const splitMaxMa = P.significant(P.divide(splitMaxYears, K.prefixes.mega), K.display.defaultPrecision);
    document.getElementById('split-range').textContent = `${splitMinMa}–${splitMaxMa} 百万年前`;

    const sapiensFraction = P.ageFraction(K.evolution.homoSapiensYearsAgo, K.earth.ageYears);
    const sapiensPercent = P.significant(P.scaleValue(sapiensFraction, K.math.one, K.math.percentScale), K.display.defaultPrecision);
    document.getElementById('earth-fraction').textContent = `智人出现至今，约占地球历史的 ${sapiensPercent}% 。`;
  </script>
</body>
</html>
