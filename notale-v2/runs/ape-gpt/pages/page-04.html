<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lec-header__inner,
  .lec-footer__inner { display:flex; width:100%; min-width:0; align-items:center; justify-content:space-between; }
  .lec-header__identity { display:flex; min-width:0; align-items:center; gap:var(--sp-3); }
  .lec-header__heading { display:flex; min-width:0; align-items:baseline; gap:var(--sp-3); }
  .lec-header__index { color:var(--accent-strong); font-family:var(--font-mono); font-size:var(--fs-h3); font-weight:720; }
  .lec-header__kicker { flex:0 0 auto; color:var(--text-muted); font-size:var(--fs-label); font-weight:700; }
  .lec-header__title { min-width:0; overflow:hidden; color:var(--text); font-size:var(--fs-body-lg); font-weight:720; line-height:var(--lh-heading); text-overflow:ellipsis; white-space:nowrap; }
  .lec-footer__take { display:flex; min-width:0; gap:var(--sp-3); align-items:center; }
  .lec-footer__take-label { color:var(--accent-strong); font-weight:700; }
  .lec-footer__take-text { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lec-footer__index { flex:0 0 auto; font-family:var(--font-mono); }
  population-game { display:block; width:100%; height:100%; min-width:0; min-height:0; }
  .evo-layout { position:relative; }
  .evo-side,
  .evo-main { height:100%; overflow:hidden; }
  .evo-side { display:flex; flex-direction:column; gap:var(--sp-4); }
  .evo-intro { display:flex; flex-direction:column; gap:var(--sp-2); }
  .evo-intro p { color:var(--text-muted); font-size:var(--fs-body); line-height:var(--lh-copy); }
  .evo-loop { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:var(--sp-2); align-items:center; }
  .evo-loop .badge { justify-content:center; text-align:center; white-space:normal; min-height:48px; }
  .evo-arrow { color:var(--accent); text-align:center; font-size:var(--fs-body-lg); }
  .evo-controls { flex:1 1 auto; justify-content:center; }
  .evo-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--sp-3); }
  .evo-result { min-height:108px; display:flex; flex-direction:column; justify-content:center; gap:var(--sp-1); }
  .evo-result strong { font-size:var(--fs-body-lg); line-height:var(--lh-body); }
  .evo-result p { color:var(--text-muted); font-size:var(--fs-body); line-height:var(--lh-copy); }
  .evo-main { display:grid; grid-template-rows:auto minmax(0,1fr) auto auto; gap:var(--sp-3); }
  .evo-chart-head { display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); }
  .evo-chart { position:relative; min-width:0; min-height:0; border-block:1px solid var(--line); background:var(--surface-1); }
  .evo-chart svg { display:block; width:100%; height:100%; }
  .evo-chart .grid line { stroke:var(--line); stroke-dasharray:4 8; }
  .evo-chart .current-bar { fill:var(--accent); opacity:.78; }
  .evo-chart .previous-bar { fill:none; stroke:var(--text-muted); stroke-width:3; stroke-dasharray:7 6; }
  .evo-chart .mean-line { stroke:var(--warning); stroke-width:4; }
  .evo-chart .target-band { fill:var(--positive); opacity:.09; }
  .evo-chart text { fill:var(--text-muted); font-family:var(--font-sans); font-size:17px; }
  .evo-chart .mean-label { fill:var(--warning); font-weight:700; }
  .evo-chart .endpoint { fill:var(--text); font-weight:650; }
  .evo-legend { display:flex; gap:var(--sp-4); color:var(--text-muted); font-size:var(--fs-label); line-height:1.4; }
  .evo-key { display:inline-flex; align-items:center; gap:var(--sp-2); }
  .evo-key::before { content:""; width:28px; height:10px; border:2px solid var(--accent); background:var(--accent-soft); }
  .evo-key.previous::before { border-color:var(--text-muted); border-style:dashed; background:transparent; }
  .evo-metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--sp-3); }
  .evo-metrics .readout { padding:var(--sp-3); box-shadow:none; }
  .evo-metrics .readout-value { font-size:32px; }
  .evo-caption { color:var(--text-muted); font-size:var(--fs-label); line-height:1.4; }
  select:focus-visible, button:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
</style>
</head>
<body data-page="04" data-total="18">
<div id="stage">
  <population-game>
    <div class="split-lr evo-layout full">
      <section class="panel panel--quiet evo-side min0" aria-labelledby="game-heading">
        <div class="evo-intro">
          <h2 id="game-heading" class="h3">先押注趋势，再让群体繁殖</h2>
          <p>选择环境和预测，运行一轮。再换环境，看原有趋势是否反转。</p>
        </div>

        <div class="evo-loop" aria-label="自然选择的最小机制">
          <span class="badge">亲代特征</span><span class="evo-arrow" aria-hidden="true">→</span>
          <span class="badge">随机变异</span><span class="evo-arrow" aria-hidden="true">→</span>
          <span class="badge">环境筛选</span><span class="evo-arrow" aria-hidden="true">→</span>
          <span class="badge">下一代</span><span class="evo-arrow" aria-hidden="true">↺</span>
        </div>

        <div class="controls evo-controls">
          <div class="control">
            <label for="environment">当前环境</label>
            <select id="environment">
              <option value="cold">寒冷</option>
              <option value="hot">炎热</option>
              <option value="scattered">食物分散</option>
            </select>
          </div>
          <div class="control">
            <label for="prediction">你的预测</label>
            <select id="prediction">
              <option value="increase">均值继续增大</option>
              <option value="reverse">原有趋势反转</option>
            </select>
          </div>
          <div class="evo-actions">
            <button id="run" class="primary" type="button">运行一轮</button>
            <button id="reset" type="button">重置群体</button>
          </div>
        </div>

        <div class="callout evo-result" aria-live="polite">
          <strong id="result-title">等待你的预测</strong>
          <p id="result-copy">体型只表示模型特征，不代表高低等级。</p>
        </div>
      </section>

      <figure class="panel evo-main min0" aria-labelledby="chart-heading">
        <div class="evo-chart-head">
          <h2 id="chart-heading" class="h3">群体体型分布</h2>
          <span id="generation" class="badge mono"></span>
        </div>
        <div class="evo-chart">
          <svg id="distribution" viewBox="0 0 700 390" role="img" aria-labelledby="chart-title chart-desc">
            <title id="chart-title">群体体型分布随环境改变</title>
            <desc id="chart-desc">实心柱表示当前群体，虚线轮廓表示运行前群体，竖线表示当前均值。</desc>
          </svg>
        </div>
        <div class="evo-legend" aria-hidden="true">
          <span class="evo-key">当前群体</span>
          <span class="evo-key previous">运行前</span>
        </div>
        <div class="evo-metrics">
          <div class="readout"><span class="readout-label">群体均值</span><span id="mean" class="readout-value"></span></div>
          <div class="readout"><span class="readout-label">存活比例</span><span id="survival" class="readout-value"></span></div>
          <div class="readout"><span class="readout-label">本轮变化</span><span id="change" class="readout-value"></span></div>
        </div>
        <figcaption class="evo-caption">比较实心柱与虚线轮廓；绿色带是当前环境偏好的范围。</figcaption>
      </figure>
    </div>
  </population-game>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
Deck.init({ index: 4, total: 18 });

Lec.mount({
  index: 4,
  kicker: `POPULATIONS CHANGE`,
  title: `演化选择的是“此刻更合适”，不是“最终更高级”`,
  take: `变异会遗传、环境造成繁殖差异，群体特征因而改变；过程没有预设终点。`
});

class PopulationGame extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' }).innerHTML = '<slot></slot>';
    this.els = {};
    this.state = null;
  }

  connectedCallback() {
    this.els.environment = this.querySelector('#environment');
    this.els.prediction = this.querySelector('#prediction');
    this.els.run = this.querySelector('#run');
    this.els.reset = this.querySelector('#reset');
    this.els.svg = this.querySelector('#distribution');
    this.els.generation = this.querySelector('#generation');
    this.els.mean = this.querySelector('#mean');
    this.els.survival = this.querySelector('#survival');
    this.els.change = this.querySelector('#change');
    this.els.resultTitle = this.querySelector('#result-title');
    this.els.resultCopy = this.querySelector('#result-copy');
    this.els.run.addEventListener('click', () => this.start());
    this.els.reset.addEventListener('click', () => this.reset());
    this.reset(false);
  }

  gaussian() {
    let u = 0;
    let v = 0;
    while (u === 0) u = this.rng();
    while (v === 0) v = this.rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  initialState() {
    this.rng = new Math.seedrandom('page-04');
    const population = d3.range(60).map(() => Math.max(4, Math.min(96, 50 + this.gaussian() * 11)));
    return {
      generation: 0,
      population,
      previous: population.slice(),
      previousDelta: 0,
      lastDelta: 0,
      survivors: population.length,
      attempted: population.length,
      environment: 'cold',
      trace: []
    };
  }

  mean(values) {
    return Lec.P.divide(d3.sum(values), values.length);
  }

  fitness(value, target) {
    const distance = value - target;
    return Math.exp(-(distance * distance) / (2 * 19 * 19));
  }

  transition(environment) {
    const targets = { cold: 76, hot: 24, scattered: 42 };
    const target = targets[environment];
    const before = this.state.population.slice();
    let population = before.slice();
    let finalSurvivors = before.length;
    let finalAttempted = before.length;

    for (let generationStep = 0; generationStep < 4; generationStep += 1) {
      let survivors = population.filter(value => this.rng() < this.fitness(value, target));
      if (survivors.length < 3) {
        survivors = population.slice().sort((a, b) => Math.abs(a - target) - Math.abs(b - target)).slice(0, 3);
      }
      finalSurvivors = survivors.length;
      finalAttempted = population.length;
      population = d3.range(before.length).map(() => {
        const parent = survivors[Math.floor(this.rng() * survivors.length)];
        return Math.max(4, Math.min(96, parent + this.gaussian() * 5.5));
      });
    }

    const delta = Lec.P.divide(d3.sum(population) - d3.sum(before), population.length);
    this.state.previous = before;
    this.state.population = population;
    this.state.previousDelta = this.state.lastDelta;
    this.state.lastDelta = delta;
    this.state.survivors = finalSurvivors;
    this.state.attempted = finalAttempted;
    this.state.environment = environment;
    this.state.generation += 4;
    this.state.trace.push({ environment, delta, mean: this.mean(population) });
  }

  start() {
    const prediction = this.els.prediction.value;
    const environment = this.els.environment.value;
    const priorDirection = this.state.lastDelta;
    this.transition(environment);
    const changedDirection = priorDirection !== 0 && Math.sign(priorDirection) !== Math.sign(this.state.lastDelta);
    const matched = prediction === 'reverse' ? changedDirection : !changedDirection && this.state.lastDelta > 0;
    const environmentNames = { cold: '寒冷', hot: '炎热', scattered: '食物分散' };

    this.els.resultTitle.textContent = matched ? '预测与本轮相符' : '本轮没有支持这项预测';
    if (changedDirection) {
      this.els.resultCopy.textContent = `${environmentNames[environment]}让均值改变了方向；先前占优不等于永远占优。`;
    } else {
      this.els.resultCopy.textContent = `${environmentNames[environment]}下，环境只提高当下更合适个体的繁殖机会。`;
    }
    this.render();
    const metrics = this.metrics();
    this.dispatchEvent(new CustomEvent('game-progress', { bubbles:true, composed:true, detail:{ state:this.getState(), action:'run', metrics } }));
    this.dispatchEvent(new CustomEvent('game-complete', { bubbles:true, composed:true, detail:{ score:matched ? 1 : 0, metrics, trace:this.getState().trace } }));
  }

  reset(emit = true) {
    this.state = this.initialState();
    if (this.els.environment) {
      this.els.environment.value = 'cold';
      this.els.prediction.value = 'increase';
      this.els.resultTitle.textContent = '等待你的预测';
      this.els.resultCopy.textContent = '体型只表示模型特征，不代表高低等级。';
      this.render();
    }
    if (emit) this.dispatchEvent(new CustomEvent('game-reset', { bubbles:true, composed:true }));
  }

  metrics() {
    return {
      mean: this.mean(this.state.population),
      survival: Lec.P.ratio(this.state.survivors, this.state.attempted),
      change: this.state.lastDelta
    };
  }

  render() {
    const metrics = this.metrics();
    this.els.generation.textContent = `第 ${Lec.P.padInteger(this.state.generation, 2)} 代`;
    this.els.mean.textContent = Lec.P.significant(metrics.mean, 3);
    this.els.survival.textContent = Lec.P.significant(metrics.survival, 2);
    const changeText = Lec.P.significant(Math.abs(metrics.change), 2);
    this.els.change.textContent = `${metrics.change > 0 ? '+' : metrics.change < 0 ? '−' : '±'}${changeText}`;
    this.drawDistribution();
  }

  drawDistribution() {
    const svg = d3.select(this.els.svg);
    svg.selectAll('g.visual-root').remove();
    const width = 700;
    const height = 390;
    const margin = { top: 34, right: 28, bottom: 54, left: 28 };
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;
    const x = d3.scaleLinear().domain([0, 100]).range([0, innerWidth]);
    const bins = d3.bin().domain(x.domain()).thresholds(12);
    const currentBins = bins(this.state.population);
    const previousBins = bins(this.state.previous);
    const yMax = Math.max(1, d3.max(currentBins.concat(previousBins), d => d.length));
    const y = d3.scaleLinear().domain([0, yMax]).range([innerHeight, 0]);
    const root = svg.append('g').attr('class', 'visual-root').attr('transform', `translate(${margin.left},${margin.top})`);
    const targetMap = { cold: 76, hot: 24, scattered: 42 };
    const target = targetMap[this.state.environment];

    root.append('rect')
      .attr('class', 'target-band')
      .attr('x', x(target - 10))
      .attr('y', 0)
      .attr('width', x(target + 10) - x(target - 10))
      .attr('height', innerHeight);

    root.append('g').attr('class', 'grid')
      .selectAll('line').data(d3.range(1, 4)).join('line')
      .attr('x1', 0).attr('x2', innerWidth)
      .attr('y1', d => innerHeight * d / 4).attr('y2', d => innerHeight * d / 4);

    root.selectAll('rect.previous-bar').data(previousBins).join('rect')
      .attr('class', 'previous-bar')
      .attr('x', d => x(d.x0) + 3)
      .attr('width', d => Math.max(0, x(d.x1) - x(d.x0) - 6))
      .attr('y', d => y(d.length))
      .attr('height', d => innerHeight - y(d.length));

    root.selectAll('rect.current-bar').data(currentBins).join('rect')
      .attr('class', 'current-bar')
      .attr('x', d => x(d.x0) + 7)
      .attr('width', d => Math.max(0, x(d.x1) - x(d.x0) - 14))
      .attr('y', d => y(d.length))
      .attr('height', d => innerHeight - y(d.length));

    const mean = this.mean(this.state.population);
    root.append('line').attr('class', 'mean-line')
      .attr('x1', x(mean)).attr('x2', x(mean)).attr('y1', 0).attr('y2', innerHeight);
    root.append('text').attr('class', 'mean-label')
      .attr('x', Math.min(innerWidth - 76, Math.max(6, x(mean) + 8))).attr('y', 22).text('当前均值');
    root.append('text').attr('class', 'endpoint').attr('x', 0).attr('y', innerHeight + 38).text('较小体型');
    root.append('text').attr('class', 'endpoint').attr('x', innerWidth).attr('y', innerHeight + 38).attr('text-anchor', 'end').text('较大体型');
  }

  getState() {
    return JSON.parse(JSON.stringify(this.state));
  }
}

customElements.define('population-game', PopulationGame);
</script>
</body>
</html>
