<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-header__inner,
    .lec-footer__inner { width: 100%; min-width: 0; }
    .lec-header__identity,
    .lec-header__heading,
    .lec-footer__inner,
    .lec-footer__take {
      display: flex;
      min-width: 0;
      align-items: center;
    }
    .lec-header__identity { gap: var(--sp-3); }
    .lec-header__heading { gap: var(--sp-3); }
    .lec-header__index,
    .lec-header__kicker { flex: 0 0 auto; }
    .lec-header__title {
      overflow: hidden;
      font-size: var(--fs-body-lg);
      line-height: var(--lh-heading);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lec-header__kicker { color: var(--accent-strong); }
    .lec-footer__inner { justify-content: space-between; gap: var(--sp-4); }
    .lec-footer__take { gap: var(--sp-2); }
    .lec-footer__take-label { color: var(--accent-strong); }

    .task-card {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto minmax(112px, auto);
      gap: var(--sp-3);
      height: 100%;
    }
    .task-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-3);
    }
    .task-head h2 { font-size: var(--fs-h3); }
    .scene {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border-block: 1px solid var(--line);
      background: var(--surface-1);
    }
    .scene svg { display: block; width: 100%; height: 100%; }
    .scene text {
      fill: var(--text-muted);
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      font-weight: 650;
    }
    .ground, .support, .leader {
      fill: none;
      stroke: var(--line-strong);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .support { stroke-dasharray: 8 8; }
    .body-line {
      fill: none;
      stroke: var(--text-muted);
      stroke-width: 13;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .joint { fill: var(--text-muted); }
    .load {
      fill: var(--surface-3);
      stroke: var(--line-strong);
      stroke-width: 3;
    }
    .evidence {
      fill: var(--warning);
      stroke: var(--surface-1);
      stroke-width: 3;
    }
    .accent-line { stroke: var(--accent-strong); }
    .accent-fill { fill: var(--accent-strong); }
    .posture { opacity: .42; transition: opacity .18s ease; }
    .task-card[data-choice="upright"] .upright,
    .task-card[data-choice="context"] .posture,
    .task-card[data-choice="quadruped"] .quadruped { opacity: 1; }
    .task-card[data-choice="upright"] .upright .body-line,
    .task-card[data-choice="quadruped"] .quadruped .body-line { stroke: var(--accent-strong); }
    .task-card[data-choice="context"] .posture { opacity: .78; }
    .judge { display: grid; gap: var(--sp-2); }
    .judge select { width: 100%; }
    .result {
      padding: var(--sp-3);
      border-inline-start: 5px solid var(--line-strong);
      background: var(--surface-2);
    }
    .result[data-state="match"] { border-inline-start-color: var(--positive); }
    .result[data-state="rethink"] { border-inline-start-color: var(--warning); }
    .result strong {
      display: block;
      margin-block-end: var(--sp-1);
      color: var(--text);
      font-size: var(--fs-body);
      line-height: var(--lh-body);
    }
    .result p {
      color: var(--text-muted);
      font-size: var(--fs-body);
      line-height: var(--lh-copy);
    }
    select:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .posture { transition: none; } }
  </style>
</head>
<body data-page="05" data-total="18">
  <div id="stage">
    <main class="triptych" aria-label="三种任务中的双足与四足姿态比较">
      <article class="card task-card min0" data-task="travel" data-choice="context">
        <div class="task-head">
          <h2>长距离移动</h2><span class="badge">移动效率</span>
        </div>
        <figure class="scene" aria-label="比较两种姿态的重心与足部受力">
          <svg viewBox="0 0 430 300" role="img" aria-labelledby="travel-svg-title">
            <title id="travel-svg-title">直立与四足移动的重心和受力位置示意</title>
            <path class="ground" d="M28 258 H402"/>
            <g class="posture upright">
              <circle class="joint" cx="126" cy="54" r="20"/>
              <path class="body-line" d="M126 78 L126 154 M126 105 L92 146 M126 105 L159 146 M126 154 L104 244 M126 154 L150 244"/>
              <circle class="evidence" cx="126" cy="138" r="9"/>
              <path class="leader accent-line" d="M126 138 L56 112"/>
              <text x="30" y="101">重心</text>
              <path class="leader accent-line" d="M103 250 L151 250"/>
              <text x="82" y="283">足部受力</text>
            </g>
            <g class="posture quadruped">
              <circle class="joint" cx="322" cy="129" r="18"/>
              <path class="body-line" d="M300 142 L226 154 L190 184 M229 155 L210 244 M253 151 L275 242 M300 143 L322 242 M284 147 L302 242"/>
              <circle class="evidence" cx="252" cy="154" r="9"/>
              <path class="support" d="M208 251 H325"/>
              <text x="230" y="283">四点支撑</text>
            </g>
          </svg>
        </figure>
        <div class="judge">
          <label for="travel-choice">选择判断，再看受力位置</label>
          <select id="travel-choice" data-choice>
            <option value="context" selected>取决于情境</option>
            <option value="upright">直立更有利</option>
            <option value="quadruped">四足更有利</option>
          </select>
        </div>
        <div class="result" aria-live="polite">
          <strong>把路程拉长来比较</strong>
          <p>直立步行可降低长途移动成本，但足部与脊柱持续承重。</p>
        </div>
      </article>

      <article class="card task-card min0" data-task="carry" data-choice="context">
        <div class="task-head">
          <h2>携带物品</h2><span class="badge">手的用途</span>
        </div>
        <figure class="scene" aria-label="比较双手被空出与前肢参与支撑的差别">
          <svg viewBox="0 0 430 300" role="img" aria-labelledby="carry-svg-title">
            <title id="carry-svg-title">直立姿态空出双手，四足姿态前肢参与支撑</title>
            <path class="ground" d="M28 258 H402"/>
            <g class="posture upright">
              <circle class="joint" cx="126" cy="53" r="20"/>
              <path class="body-line" d="M126 77 L126 154 M126 103 L90 152 M126 103 L164 151 M126 154 L104 244 M126 154 L150 244"/>
              <rect class="load" x="72" y="146" width="37" height="34"/>
              <rect class="load" x="147" y="145" width="37" height="34"/>
              <path class="leader accent-line" d="M164 138 L198 108"/>
              <text x="167" y="94">空出的双手</text>
              <circle class="evidence" cx="126" cy="154" r="9"/>
              <text x="82" y="283">骨盆传力</text>
            </g>
            <g class="posture quadruped">
              <circle class="joint" cx="326" cy="132" r="18"/>
              <path class="body-line" d="M303 144 L228 155 L195 180 M232 156 L210 244 M256 152 L276 244 M302 145 L322 243 M283 149 L302 243"/>
              <path class="leader" d="M312 222 L364 190"/>
              <text x="288" y="177">前肢支撑</text>
            </g>
          </svg>
        </figure>
        <div class="judge">
          <label for="carry-choice">选择判断，再看前肢用途</label>
          <select id="carry-choice" data-choice>
            <option value="context" selected>取决于情境</option>
            <option value="upright">直立更有利</option>
            <option value="quadruped">四足更有利</option>
          </select>
        </div>
        <div class="result" aria-live="polite">
          <strong>看前肢是否必须支撑身体</strong>
          <p>直立空出双手；骨盆既传递重量，也受分娩通道约束。</p>
        </div>
      </article>

      <article class="card task-card min0" data-task="climb" data-choice="context">
        <div class="task-head">
          <h2>攀爬与稳定</h2><span class="badge">支撑范围</span>
        </div>
        <figure class="scene" aria-label="比较窄支撑与四点接触形成的宽支撑范围">
          <svg viewBox="0 0 430 300" role="img" aria-labelledby="climb-svg-title">
            <title id="climb-svg-title">直立与四点接触姿态的支撑范围示意</title>
            <path class="ground" d="M28 258 H402"/>
            <g class="posture upright">
              <circle class="joint" cx="113" cy="54" r="20"/>
              <path class="body-line" d="M113 78 L113 154 M113 105 L78 145 M113 105 L150 145 M113 154 L98 244 M113 154 L129 244"/>
              <circle class="evidence" cx="113" cy="139" r="9"/>
              <path class="support" d="M96 251 H132"/>
              <text x="58" y="283">窄支撑范围</text>
            </g>
            <g class="posture quadruped">
              <circle class="joint" cx="330" cy="129" r="18"/>
              <path class="body-line" d="M307 142 L230 154 L194 181 M232 155 L204 244 M257 151 L276 243 M305 143 L334 242 M286 147 L303 243"/>
              <circle class="evidence" cx="267" cy="151" r="9"/>
              <path class="leader accent-line" d="M267 151 L266 104"/>
              <text x="239" y="91">重心</text>
              <path class="support accent-line" d="M202 251 H337"/>
              <text x="228" y="283">宽支撑范围</text>
            </g>
          </svg>
        </figure>
        <div class="judge">
          <label for="climb-choice">选择判断，再看支撑范围</label>
          <select id="climb-choice" data-choice>
            <option value="context" selected>取决于情境</option>
            <option value="upright">直立更有利</option>
            <option value="quadruped">四足更有利</option>
          </select>
        </div>
        <div class="result" aria-live="polite">
          <strong>看接触点怎样围住重心</strong>
          <p>多点接触扩大支撑范围；直立则更依赖地面与平衡。</p>
        </div>
      </article>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Deck.init({ index: 5, total: 18 });

    Lec.mount({
      index: 5,
      kicker: `BODIES TRADE`,
      title: `两条腿解放了手，也没有送来一副完美身体`,
      take: `适应通常是一揽子收益与代价，而不是单向升级。`
    });

    const evidence = {
      travel: {
        upright: ['长途移动的证据支持直立', '直立步行可降低长途移动成本，但足部与脊柱持续承重。'],
        context: ['补上地面与距离条件', '长途通常偏向直立；崎岖地面会提高稳定性的价值。'],
        quadruped: ['再比较移动成本与稳定性', '四点支撑更稳，但这项任务还要比较长途移动成本。']
      },
      carry: {
        upright: ['携带任务的证据支持直立', '直立空出双手；骨盆既传递重量，也受分娩通道约束。'],
        context: ['再看前肢是否被占用', '只要需要持续携带，空出的双手就形成直接优势。'],
        quadruped: ['再看物品由谁携带', '前肢参与支撑时，不能同时自由搬运物品。']
      },
      climb: {
        upright: ['再看支撑范围', '两点支撑较窄，稳定性更依赖地面与主动平衡。'],
        context: ['补上接触点与地形条件', '攀爬可用手抓握；稳定仍取决于接触点怎样围住重心。'],
        quadruped: ['稳定任务的证据支持多点接触', '多点接触扩大支撑范围，也能分散局部受力。']
      }
    };

    const preferred = { travel: 'upright', carry: 'upright', climb: 'quadruped' };

    document.querySelectorAll('[data-choice]').forEach((select) => {
      select.addEventListener('change', () => {
        const card = select.closest('.task-card');
        const task = card.dataset.task;
        const choice = select.value;
        const result = card.querySelector('.result');
        const copy = evidence[task][choice];
        card.dataset.choice = choice;
        result.dataset.state = choice === preferred[task] ? 'match' : 'rethink';
        result.querySelector('strong').textContent = copy[0];
        result.querySelector('p').textContent = copy[1];
      });
    });
  </script>
</body>
</html>
