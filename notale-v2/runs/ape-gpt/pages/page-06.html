<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-header__inner,
    .lec-footer__inner {
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
    }

    .lec-header__identity,
    .lec-header__heading,
    .lec-footer__take {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: var(--sp-3);
    }

    .lec-header__index,
    .lec-header__kicker,
    .lec-footer__take-label,
    .lec-footer__index {
      flex: 0 0 auto;
      font-size: var(--fs-label);
      line-height: 1.2;
    }

    .lec-header__title {
      overflow: hidden;
      font-size: var(--fs-body-lg);
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lec-footer__take-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .network-page {
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: var(--sp-3);
    }

    .network-toolbar {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-4);
    }

    .network-instruction {
      min-width: 0;
      color: var(--text-muted);
      font-size: var(--fs-body);
      line-height: var(--lh-body);
    }

    .network-actions {
      display: flex;
      flex: 0 0 auto;
      gap: var(--sp-2);
    }

    .network-actions button {
      min-width: 132px;
    }

    .network-board {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      padding: 0;
    }

    .network-svg {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: manipulation;
    }

    .network-svg:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: -5px;
    }

    .link-course,
    .link-student {
      fill: none;
      vector-effect: non-scaling-stroke;
      transition: opacity 160ms ease, stroke-width 160ms ease;
    }

    .link-course {
      stroke: var(--accent-strong);
      stroke-width: 3px;
    }

    .link-student {
      stroke: var(--warning);
      stroke-width: 3px;
      stroke-dasharray: 10 8;
    }

    .node-disc {
      fill: var(--surface-2);
      stroke: var(--line-strong);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
      transition: opacity 160ms ease, stroke-width 160ms ease;
    }

    .node-label {
      fill: var(--text);
      font-family: var(--font-sans);
      font-size: 21px;
      font-weight: 720;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      user-select: none;
    }

    .node-step {
      fill: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 650;
      text-anchor: middle;
      pointer-events: none;
    }

    .node.is-cursor .node-disc {
      stroke: var(--focus);
      stroke-width: 4px;
    }

    .node.is-source .node-disc {
      fill: var(--accent-soft);
      stroke: var(--accent-strong);
      stroke-width: 5px;
    }

    .network-key {
      position: absolute;
      left: var(--sp-4);
      bottom: var(--sp-4);
      display: flex;
      gap: var(--sp-4);
      align-items: center;
      color: var(--text-muted);
      font-size: var(--fs-label);
      line-height: 1.4;
      pointer-events: none;
    }

    .key-item {
      display: inline-flex;
      gap: var(--sp-2);
      align-items: center;
    }

    .key-line {
      width: 44px;
      border-top: 3px solid var(--accent-strong);
    }

    .key-line.student {
      border-top-color: var(--warning);
      border-top-style: dashed;
    }

    .network-footer {
      display: grid;
      min-width: 0;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
      gap: var(--sp-4);
      align-items: center;
    }

    .model-note,
    .network-summary {
      min-width: 0;
      font-size: var(--fs-body);
      line-height: var(--lh-copy);
    }

    .model-note {
      color: var(--text-muted);
    }

    .network-summary {
      padding: var(--sp-3) var(--sp-4);
      border-inline-start: 5px solid var(--accent);
      background: var(--accent-soft);
      font-weight: 700;
    }

    .network-summary[hidden] {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .link-course,
      .link-student,
      .node-disc {
        transition: none;
      }
    }
  </style>
</head>
<body data-page="06" data-total="18">
  <div id="stage">
    <main class="canvas-full network-page" aria-label="身体、行为与文化的反馈网络构建器">
      <div class="network-toolbar">
        <p id="instruction" class="network-instruction">依次选择两个节点，添加或移除一条因果箭头。再选择节点，可查看它的一跳与两跳关系。</p>
        <div class="network-actions" aria-label="网络操作">
          <button id="compare" class="primary" type="button" disabled>对照最小模型</button>
          <button id="reset" type="button">重新构建</button>
        </div>
      </div>

      <section class="panel panel--quiet network-board min0" aria-label="因果网络画布">
        <svg id="network" class="network-svg no-pan" viewBox="0 0 1400 560" role="application" tabindex="0" aria-labelledby="network-title network-desc">
          <title id="network-title">五个因素的因果反馈网络</title>
          <desc id="network-desc">左右方向键移动到节点，回车先选起点、再选终点。课程模型展开后，选择节点会突出一跳与两跳关系。</desc>
        </svg>
        <div class="network-key" aria-hidden="true">
          <span class="key-item"><span class="key-line student"></span>你的连接</span>
          <span id="course-key" class="key-item" hidden><span class="key-line"></span>课程最小模型</span>
        </div>
        <p class="sr-only" id="live" aria-live="polite"></p>
      </section>

      <div class="network-footer">
        <p class="model-note">因果箭头表示“可能促进”，不是已经证明的单一起因，也不是确定的历史剧本。</p>
        <p id="summary" class="network-summary" hidden>身体变化创造机会，文化行为又改变选择环境。</p>
      </div>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
    Deck.init({ index: 6, total: 18 });

    Lec.mount({
      index: 6,
      kicker: `A FEEDBACK LOOP`,
      title: `手、脑、食物与群体，谁推动了谁？`,
      take: `人类特征更像相互加强的反馈网络，而不是由一个“超级大脑”单独发动。`
    });

    const nodes = [
      { id: 'fine', label: '精细操作', x: 285, y: 285 },
      { id: 'tool', label: '工具', x: 590, y: 115 },
      { id: 'energy', label: '能量供给', x: 1085, y: 205 },
      { id: 'share', label: '共享食物', x: 980, y: 455 },
      { id: 'learn', label: '社会学习', x: 510, y: 455 }
    ];

    const courseLinks = [
      { source: 'fine', target: 'tool' },
      { source: 'tool', target: 'share' },
      { source: 'share', target: 'energy' },
      { source: 'energy', target: 'learn' },
      { source: 'learn', target: 'tool' },
      { source: 'share', target: 'learn' },
      { source: 'learn', target: 'fine' }
    ];

    const svg = d3.select('#network');
    const compareButton = document.querySelector('#compare');
    const resetButton = document.querySelector('#reset');
    const summary = document.querySelector('#summary');
    const courseKey = document.querySelector('#course-key');
    const live = document.querySelector('#live');
    const instruction = document.querySelector('#instruction');
    let studentLinks = [];
    let sourceId = null;
    let focusId = null;
    let cursorIndex = 0;
    let comparing = false;

    const defs = svg.append('defs');
    defs.append('marker')
      .attr('id', 'arrow-student')
      .attr('viewBox', '0 -5 10 10')
      .attr('refX', 9)
      .attr('refY', 0)
      .attr('markerWidth', 8)
      .attr('markerHeight', 8)
      .attr('orient', 'auto')
      .append('path')
      .attr('d', 'M0,-5L10,0L0,5')
      .attr('fill', 'var(--warning)');

    defs.append('marker')
      .attr('id', 'arrow-course')
      .attr('viewBox', '0 -5 10 10')
      .attr('refX', 9)
      .attr('refY', 0)
      .attr('markerWidth', 8)
      .attr('markerHeight', 8)
      .attr('orient', 'auto')
      .append('path')
      .attr('d', 'M0,-5L10,0L0,5')
      .attr('fill', 'var(--accent-strong)');

    const linkLayer = svg.append('g').attr('aria-hidden', 'true');
    const nodeLayer = svg.append('g').attr('aria-hidden', 'true');

    function nodeById(id) {
      return nodes.find(node => node.id === id);
    }

    function edgePath(link) {
      const a = nodeById(link.source);
      const b = nodeById(link.target);
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const length = Math.hypot(dx, dy);
      const ux = dx / length;
      const uy = dy / length;
      const start = { x: a.x + ux * 78, y: a.y + uy * 78 };
      const end = { x: b.x - ux * 88, y: b.y - uy * 88 };
      const bend = link.source < link.target ? 18 : -18;
      const mx = (start.x + end.x) / 2 - uy * bend;
      const my = (start.y + end.y) / 2 + ux * bend;
      return `M${start.x},${start.y} Q${mx},${my} ${end.x},${end.y}`;
    }

    function activeLinks() {
      return comparing ? courseLinks : studentLinks;
    }

    function distancesFrom(start) {
      const distances = new Map(nodes.map(node => [node.id, Infinity]));
      if (!start) return distances;
      distances.set(start, 0);
      const links = activeLinks();
      let frontier = [start];
      for (let depth = 1; depth <= 2; depth += 1) {
        const next = [];
        frontier.forEach(id => {
          links.forEach(link => {
            let neighbor = null;
            if (link.source === id) neighbor = link.target;
            if (link.target === id) neighbor = link.source;
            if (neighbor && distances.get(neighbor) > depth) {
              distances.set(neighbor, depth);
              next.push(neighbor);
            }
          });
        });
        frontier = next;
      }
      return distances;
    }

    function edgeEmphasis(link, distances) {
      if (!focusId) return { opacity: 0.82, width: 3 };
      const a = distances.get(link.source);
      const b = distances.get(link.target);
      const nearest = Math.min(a, b);
      const farthest = Math.max(a, b);
      if (nearest === 0 && farthest === 1) return { opacity: 1, width: 6 };
      if (farthest <= 2) return { opacity: 0.64, width: 3.5 };
      return { opacity: 0.1, width: 2 };
    }

    function render() {
      const distances = distancesFrom(focusId);
      const shownLinks = comparing
        ? courseLinks.map(link => ({ ...link, kind: 'course' })).concat(studentLinks.map(link => ({ ...link, kind: 'student' })))
        : studentLinks.map(link => ({ ...link, kind: 'student' }));

      linkLayer.selectAll('path')
        .data(shownLinks, link => `${link.kind}-${link.source}-${link.target}`)
        .join('path')
        .attr('class', link => link.kind === 'course' ? 'link-course' : 'link-student')
        .attr('d', edgePath)
        .attr('marker-end', link => `url(#arrow-${link.kind})`)
        .style('opacity', link => {
          const emphasis = edgeEmphasis(link, distances);
          return link.kind === 'student' && comparing ? Math.min(emphasis.opacity, 0.48) : emphasis.opacity;
        })
        .style('stroke-width', link => edgeEmphasis(link, distances).width);

      const node = nodeLayer.selectAll('g.node')
        .data(nodes, item => item.id)
        .join(enter => {
          const group = enter.append('g').attr('class', 'node');
          group.append('circle').attr('class', 'node-disc').attr('r', 70);
          group.append('text').attr('class', 'node-label').text(item => item.label);
          group.append('text').attr('class', 'node-step').attr('y', 101);
          return group;
        })
        .attr('transform', item => `translate(${item.x},${item.y})`)
        .classed('is-source', item => item.id === sourceId)
        .classed('is-cursor', (item, index) => index === cursorIndex)
        .style('cursor', 'pointer')
        .style('opacity', item => !focusId || distances.get(item.id) <= 2 ? 1 : 0.22)
        .on('click', (event, item) => selectNode(item.id));

      node.select('.node-step').text(item => {
        if (!focusId || distances.get(item.id) === Infinity) return '';
        const distance = distances.get(item.id);
        if (distance === 0) return '当前节点';
        return distance === 1 ? '一跳' : '两跳';
      });

      compareButton.disabled = studentLinks.length === 0 || comparing;
      summary.hidden = !comparing;
      courseKey.hidden = !comparing;
    }

    function toggleStudentLink(from, to) {
      const index = studentLinks.findIndex(link => link.source === from && link.target === to);
      const fromLabel = nodeById(from).label;
      const toLabel = nodeById(to).label;
      if (index >= 0) {
        studentLinks.splice(index, 1);
        live.textContent = `已移除从${fromLabel}到${toLabel}的箭头。`;
      } else {
        studentLinks.push({ source: from, target: to });
        live.textContent = `已添加从${fromLabel}到${toLabel}的箭头。`;
      }
    }

    function selectNode(id) {
      focusId = id;
      cursorIndex = nodes.findIndex(node => node.id === id);
      if (comparing) {
        live.textContent = `正在查看${nodeById(id).label}的一跳与两跳关系。`;
        render();
        return;
      }
      if (!sourceId) {
        sourceId = id;
        live.textContent = `已选择${nodeById(id).label}作为箭头起点。`;
      } else if (sourceId === id) {
        sourceId = null;
        live.textContent = '已取消箭头起点。';
      } else {
        toggleStudentLink(sourceId, id);
        sourceId = null;
      }
      render();
    }

    svg.on('keydown', event => {
      if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
        event.preventDefault();
        cursorIndex = (cursorIndex + 1) % nodes.length;
        focusId = nodes[cursorIndex].id;
        render();
      } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
        event.preventDefault();
        cursorIndex = (cursorIndex - 1 + nodes.length) % nodes.length;
        focusId = nodes[cursorIndex].id;
        render();
      } else if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        selectNode(nodes[cursorIndex].id);
      } else if (event.key === 'Escape') {
        sourceId = null;
        live.textContent = '已取消箭头起点。';
        render();
      }
    });

    compareButton.addEventListener('click', () => {
      comparing = true;
      sourceId = null;
      focusId = null;
      instruction.textContent = '选择任一节点，只追踪与它相连的一跳和两跳关系。实线是课程模型，虚线保留你的连接。';
      live.textContent = '课程最小反馈模型已展开。';
      render();
    });

    resetButton.addEventListener('click', () => {
      studentLinks = [];
      sourceId = null;
      focusId = null;
      cursorIndex = 0;
      comparing = false;
      instruction.textContent = '依次选择两个节点，添加或移除一条因果箭头。再选择节点，可查看它的一跳与两跳关系。';
      live.textContent = '网络已重置。';
      render();
      svg.node().focus();
    });

    render();
  </script>
</body>
</html>
