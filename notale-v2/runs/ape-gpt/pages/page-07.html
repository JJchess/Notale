<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lec-header__inner,
  .lec-footer__inner {
    display: flex;
    width: 100%;
    min-width: 0;
    align-items: center;
    justify-content: space-between;
  }

  .lec-header__identity,
  .lec-header__heading,
  .lec-footer__take {
    display: flex;
    min-width: 0;
    align-items: center;
  }

  .lec-header__identity { gap: var(--sp-4); }
  .lec-header__heading { gap: var(--sp-3); }
  .lec-footer__take { gap: var(--sp-2); }

  .lec-header__index {
    color: var(--accent-strong);
    font-family: var(--font-mono);
    font-size: var(--fs-body-lg);
  }

  .lec-header__kicker,
  .lec-footer__take-label {
    color: var(--accent);
    font-size: var(--fs-tick);
    font-weight: 720;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  .lec-header__title {
    overflow: hidden;
    color: var(--text);
    font-size: var(--fs-body-lg);
    font-weight: 720;
    line-height: var(--lh-heading);
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .lec-footer__take-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .lec-footer__index {
    flex: 0 0 auto;
    font-family: var(--font-mono);
  }

  .culture-turn {
    gap: var(--sp-5);
  }

  .relay-figure {
    position: relative;
    width: min(100%, 1260px);
    height: 500px;
    margin: 0;
    overflow: hidden;
    border-block: 1px solid var(--line);
    background:
      radial-gradient(circle at center, var(--accent-soft), transparent 58%),
      linear-gradient(90deg, transparent, var(--surface-1), transparent);
  }

  .relay-figure::before,
  .relay-figure::after {
    position: absolute;
    top: 50%;
    width: 72px;
    height: 1px;
    background: var(--line-strong);
    content: "";
  }

  .relay-figure::before { left: 0; }
  .relay-figure::after { right: 0; }

  .relay-art {
    display: block;
    width: 100%;
    height: 100%;
  }

  .relay-path {
    fill: none;
    stroke: var(--line-strong);
    stroke-width: 3;
    stroke-dasharray: 8 14;
  }

  .handoff-ring {
    fill: var(--surface-1);
    stroke: var(--accent);
    stroke-width: 2;
  }

  .hand {
    fill: var(--surface-raised);
    stroke: var(--line-strong);
    stroke-width: 3;
    stroke-linejoin: round;
  }

  .hand-detail {
    fill: none;
    stroke: var(--text-faint);
    stroke-width: 2;
    stroke-linecap: round;
  }

  .stone {
    fill: var(--text-muted);
    stroke: var(--text);
    stroke-width: 3;
    stroke-linejoin: round;
  }

  .stone-facet {
    fill: none;
    stroke: var(--surface-3);
    stroke-width: 3;
  }

  .binding {
    fill: none;
    stroke: var(--warning);
    stroke-width: 7;
    stroke-linecap: round;
  }

  .shaft {
    fill: var(--surface-3);
    stroke: var(--warning);
    stroke-width: 3;
  }

  .change-mark {
    fill: var(--accent-strong);
  }

  .turn-line {
    max-width: 920px;
    color: var(--text);
    font-size: var(--fs-h3);
    font-weight: 650;
    line-height: var(--lh-heading);
    letter-spacing: -0.012em;
  }

  .turn-line strong {
    color: var(--accent-strong);
    font-weight: 760;
  }
</style>
</head>
