<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lec-header__inner,.lec-footer__inner{display:flex;width:100%;min-width:0;align-items:center;justify-content:space-between}
  .lec-header__identity,.lec-header__heading,.lec-footer__take{display:flex;min-width:0;align-items:center}
  .lec-header__identity{gap:var(--sp-3)}
  .lec-header__heading{gap:var(--sp-4)}
  .lec-header__index,.lec-footer__index{font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700}
  .lec-header__kicker{color:var(--accent);font-size:var(--fs-label);line-height:1.2;white-space:nowrap}
  .lec-header__title{overflow:hidden;color:var(--text);font-size:var(--fs-body);font-weight:700;line-height:1.2;text-overflow:ellipsis;white-space:nowrap}
  .lec-footer__take{gap:var(--sp-2);overflow:hidden;white-space:nowrap}
  .lec-footer__take-label{color:var(--accent);font-weight:700}
  .power-ledger{padding-block:var(--page-pad-y)}
  .channel-index{display:flex;flex-direction:column;gap:var(--sp-4)}
  .channel-index h2{font-size:var(--fs-h3)}
  .channel-index p{font-size:var(--fs-body);line-height:var(--lh-copy)}
  .channel-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2);margin:0;padding:0;list-style:none}
  .channel-list li{display:flex;align-items:center;gap:var(--sp-2);min-height:var(--control-h);padding-inline:var(--sp-3);border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-1);color:var(--text-muted);font-size:var(--fs-label);font-weight:650}
  .channel-list li::before{content:"◇";color:var(--accent)}
  .channel-list li.current{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
  .channel-list li.current::before{content:"◆"}
  .system-side{display:grid;grid-template-rows:minmax(0,1.55fr) minmax(0,.75fr);gap:var(--sp-4)}
  .flow-panel{position:relative;display:flex;flex-direction:column;gap:var(--sp-3);overflow:hidden}
  .flow-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-4)}
  .flow-head h2{font-size:var(--fs-h3)}
  .flow-head p{font-size:var(--fs-body);line-height:var(--lh-body)}
  #flow{display:block;width:100%;min-height:0;flex:1 1 auto}
  .flow-link{fill:none;stroke:var(--line-strong);stroke-width:3;stroke-dasharray:10 8}
  .flow-link.live{stroke:var(--accent)}
  .flow-node{fill:var(--surface-1);stroke:var(--line-strong);stroke-width:2}
  .flow-node.active{stroke:var(--accent);fill:var(--surface-2)}
  .node-kicker{fill:var(--text-faint);font-family:var(--font-mono);font-size:17px;font-weight:700;letter-spacing:.05em}
  .node-value{fill:var(--text);font-size:20px;font-weight:700}
  .flow-caption{font-size:var(--fs-label);line-height:1.4}
  .task-panel{display:grid;grid-template-columns:minmax(0,1.2fr) repeat(4,minmax(0,1fr));gap:var(--sp-3);align-items:stretch}
  .task-brief{display:flex;flex-direction:column;justify-content:center;gap:var(--sp-2);padding:var(--sp-3)}
  .task-brief h3{font-size:var(--fs-body-lg)}
  .task-brief p{font-size:var(--fs-body);line-height:var(--lh-body)}
  .task-metric{display:flex;flex-direction:column;justify-content:center;gap:var(--sp-1);padding:var(--sp-3);border-inline-start:1px solid var(--line)}
  .task-metric dt{color:var(--text-muted);font-size:var(--fs-label);line-height:1.4}
  .task-metric dd{margin:0;color:var(--accent-strong);font-family:var(--font-mono);font-size:26px;font-weight:720;line-height:1.2}
  .task-metric small{color:var(--text-faint);font-size:var(--fs-label);line-height:1.4}
  select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
</style>
</head>
<body data-page="09" data-total="18">
<div id="stage">
  <main class="ledger power-ledger" aria-label="体外能量通道比较">
    <aside class="panel panel--quiet channel-index min0">
      <div class="stack-2">
        <span class="badge">不是年代阶梯</span>
        <h2>替换通道，结构不变</h2>
        <p class="muted">技术把不同能源接入同一种任务。比较时追踪能量，不按“先进”排序。</p>
      </div>
      <div class="control">
        <label for="technology">选择能量通道</label>
        <select id="technology" aria-describedby="flow-instruction"></select>
      </div>
      <ul id="channel-list" class="channel-list" aria-label="七种可替换的能量通道"></ul>
      <div class="callout">
        <p>火箭不是“最先进的肌肉”。它用极高消耗换取极高功率。</p>
      </div>
    </aside>

    <section class="system-side min0" aria-label="能量流与共同任务">
      <figure class="panel flow-panel min0">
        <div class="flow-head">
          <div class="stack-1">
            <span class="label mono accent">COMMON FLOW / 共同结构</span>
            <h2 id="active-title">肌肉通道</h2>
          </div>
          <p id="flow-instruction" class="muted">按选择框切换，观察四个位置怎样改写。</p>
        </div>
        <svg id="flow" viewBox="0 0 1000 330" role="img" aria-labelledby="flow-svg-title flow-svg-desc">
          <title id="flow-svg-title">所选技术的能量转换链</title>
          <desc id="flow-svg-desc">能量从来源进入转换装置，完成输出任务，并产生主要损失。</desc>
        </svg>
        <figcaption class="flow-caption">沿箭头读：谁供能，谁控制，完成什么，代价落在哪里。</figcaption>
      </figure>

      <section class="panel panel--accent task-panel min0" aria-label="统一提升任务的实时读数">
        <div class="task-brief">
          <span class="label mono accent">SAME TASK / 同一把尺</span>
          <h3>同质量，提升到同一高度</h3>
          <p class="muted">任务需求相同；供能、控制和损失不同。</p>
        </div>
        <dl class="task-metric"><dt>载荷质量</dt><dd id="mass-readout"></dd><small>保持相同</small></dl>
        <dl class="task-metric"><dt>提升高度</dt><dd id="height-readout"></dd><small>保持相同</small></dl>
        <dl class="task-metric"><dt>最低提升力</dt><dd id="force-readout"></dd><small>克服地球重力</small></dl>
        <dl class="task-metric"><dt>任务能量比</dt><dd id="ratio-readout"></dd><small>相对共同任务</small></dl>
      </section>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
  Deck.init({ index: 9, total: 18 });

  Lec.mount({
    index: 9,
    kicker: `EXTERNALIZED POWER`,
    title: `从肌肉到机器：人类扩张的是能量通道`,
    take: `技术的关键不只是工具更精巧，而是让身体能够调用体外的能量、材料和计算。`
  });

  const channels = [
    { id:'muscle', name:'肌肉', source:'食物中的化学能', converter:'肌肉 / 神经控制', output:'提升同一载荷', loss:'体热与疲劳' },
    { id:'fire', name:'火', source:'木材或燃料', converter:'炉膛 / 人工调节', output:'加热或驱动', loss:'废热与烟尘' },
    { id:'animal', name:'畜力', source:'饲料中的化学能', converter:'动物肌肉 / 驾驭', output:'牵引或提升', loss:'体热与饲养成本' },
    { id:'flow', name:'风水', source:'流动的空气或水', converter:'帆、轮机 / 闸门', output:'转动或提升', loss:'湍流与环境扰动' },
    { id:'fossil', name:'化石燃料', source:'煤、石油或天然气', converter:'发动机 / 调速器', output:'持续机械功', loss:'废热与碳排放' },
    { id:'electric', name:'电力', source:'电网或电池', converter:'电机 / 控制器', output:'精确机械运动', loss:'电阻热与源端损失' },
    { id:'rocket', name:'火箭发动机', source:'推进剂中的化学能', converter:'燃烧室、喷管 / 制导', output:'高功率推力', loss:'高速尾气与废热' }
  ];

  const selector = d3.select('#technology');
  selector.selectAll('option').data(channels).join('option')
    .attr('value', d => d.id).text(d => d.name);

  const listItems = d3.select('#channel-list').selectAll('li').data(channels).join('li')
    .attr('data-id', d => d.id).text(d => d.name);

  const svg = d3.select('#flow');
  const nodeX = [20, 270, 520, 770];
  const nodeW = 210;
  const nodeY = 82;
  const nodeH = 154;
  const headings = ['01 来源', '02 转换装置', '03 输出任务', '04 主要损失'];

  svg.append('defs').append('marker')
    .attr('id','flow-arrow').attr('viewBox','0 0 10 10')
    .attr('refX',9).attr('refY',5).attr('markerWidth',7).attr('markerHeight',7)
    .attr('orient','auto-start-reverse')
    .append('path').attr('d','M 0 0 L 10 5 L 0 10 z').attr('fill','var(--accent)');

  const links = svg.append('g').selectAll('path').data(d3.range(nodeX.length - 1)).join('path')
    .attr('class','flow-link live')
    .attr('d', d => `M${nodeX[d] + nodeW},${nodeY + nodeH / 2} H${nodeX[d + 1] - 12}`)
    .attr('marker-end','url(#flow-arrow)');

  const nodes = svg.append('g').selectAll('g').data(headings).join('g')
    .attr('transform',(d,i) => `translate(${nodeX[i]},${nodeY})`);
  nodes.append('rect').attr('class','flow-node active').attr('width',nodeW).attr('height',nodeH).attr('rx',14);
  nodes.append('text').attr('class','node-kicker').attr('x',18).attr('y',34).text(d => d);
  nodes.append('line').attr('x1',18).attr('x2',nodeW-18).attr('y1',52).attr('y2',52).attr('stroke','var(--line)');
  nodes.append('text').attr('class','node-value').attr('x',18).attr('y',84);

  function wrapText(selection, value) {
    selection.selectAll('tspan').remove();
    const pieces = value.split(' / ');
    pieces.forEach((piece, index) => {
      selection.append('tspan').attr('x',18).attr('dy', index ? 30 : 0).text(piece);
    });
  }

  function updateChannel(id) {
    const channel = channels.find(d => d.id === id) || channels[0];
    const values = [channel.source, channel.converter, channel.output, channel.loss];
    d3.select('#active-title').text(`${channel.name}通道`);
    listItems.classed('current', d => d.id === channel.id);
    nodes.select('.node-value').each(function(d,i){ wrapText(d3.select(this), values[i]); });
    const duration = Deck.reduced() ? 0 : 260;
    links.interrupt().attr('stroke-dashoffset',18).transition().duration(duration).attr('stroke-dashoffset',0);
  }

  selector.on('change', event => updateChannel(event.target.value));

  const mass = Lec.K.human.representativeMass;
  const gravity = Lec.K.physics.standardGravity;
  const height = Lec.P.ratio(mass, mass);
  const weight = Lec.P.weight(mass, gravity);
  const liftForce = Lec.P.force(mass, gravity);
  const commonTaskRatio = Lec.P.ratio(liftForce * height, weight * height);

  d3.select('#mass-readout').text(`${Lec.P.significant(mass, 3)} kg`);
  d3.select('#height-readout').text(`${Lec.P.significant(height, 3)} m`);
  d3.select('#force-readout').text(`${Lec.P.significant(weight, 3)} N`);
  d3.select('#ratio-readout').text(`${Lec.P.significant(commonTaskRatio, 3)}×`);
  updateChannel(channels[0].id);
</script>
</body>
</html>
