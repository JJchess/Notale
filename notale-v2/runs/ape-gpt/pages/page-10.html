<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lec-header__inner {
    width: 100%;
    height: 100%;
    min-width: 0;
    overflow: visible;
  }

  .lec-header__identity,
  .lec-header__heading {
    display: flex;
    min-width: 0;
    align-items: center;
  }

  .lec-header__identity { gap: var(--sp-4); }
  .lec-header__heading { gap: var(--sp-3); }

  .lec-header__index {
    color: var(--accent-strong);
    font-family: var(--font-mono);
    font-size: var(--fs-h3);
    font-weight: 700;
    line-height: 1;
  }

  .lec-header__kicker {
    color: var(--text-muted);
    font-size: var(--fs-tick);
    font-weight: 700;
    line-height: 1.35;
    white-space: nowrap;
  }

  .lec-header__title {
    overflow: hidden;
    color: var(--text);
    font-size: var(--fs-body-lg);
    font-weight: 730;
    line-height: 1.2;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .scene-alt {
    position: absolute;
    top: var(--lec-header-h);
    left: 0;
    width: 1px;
    height: 1px;
    overflow: visible;
    clip: auto;
    clip-path: none;
    opacity: 0;
    white-space: nowrap;
  }

  .gravity-page {
    display: grid;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: var(--sp-3);
  }

  .experiment-bar {
    display: grid;
    min-width: 0;
    grid-template-columns: minmax(0, 1.15fr) auto minmax(0, 1fr);
    gap: var(--sp-4);
    align-items: end;
    padding: var(--sp-3) var(--sp-4);
  }

  .predict-control {
    display: grid;
    min-width: 0;
    gap: var(--sp-1);
  }

  .predict-control select {
    min-height: var(--control-h);
  }

  .release-button {
    min-width: 164px;
  }

  .box-control {
    display: grid;
    min-width: 0;
    gap: var(--sp-1);
  }

  .box-rail {
    position: relative;
    height: var(--control-h);
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    touch-action: none;
  }

  .box-handle {
    position: absolute;
    top: var(--sp-1);
    left: 50%;
    width: 54px;
    height: 34px;
    border: 2px solid var(--accent);
    border-radius: var(--radius-sm);
    background: var(--surface-raised);
    transform: translateX(-50%);
    cursor: grab;
  }

  .box-handle::before,
  .box-handle::after {
    position: absolute;
    top: 50%;
    width: 8px;
    height: 8px;
    border-top: 2px solid var(--accent-strong);
    border-left: 2px solid var(--accent-strong);
    content: "";
  }

  .box-handle::before {
    left: var(--sp-2);
    transform: translateY(-50%) rotate(-45deg);
  }

  .box-handle::after {
    right: var(--sp-2);
    transform: translateY(-50%) rotate(135deg);
  }

  .box-handle:active { cursor: grabbing; }

  .triptych {
    min-height: 0;
  }

  .world-card {
    display: grid;
    min-width: 0;
    min-height: 0;
    padding: var(--sp-3);
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: var(--sp-2);
  }

  .world-head {
    display: flex;
    min-width: 0;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-2);
  }

  .world-head h2 {
    font-size: var(--fs-h3);
  }

  .scene {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface-1);
  }

  .scene-status {
    position: absolute;
    top: var(--sp-2);
    left: var(--sp-2);
    z-index: 2;
  }

  .world-data {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--sp-2);
  }

  .datum {
    min-width: 0;
    padding: var(--sp-2) var(--sp-3);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
  }

  .datum-label {
    display: block;
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: 1.4;
  }

  .datum-value {
    display: block;
    color: var(--accent-strong);
    font-family: var(--font-mono);
    font-size: var(--fs-body-lg);
    font-weight: 700;
    line-height: 1.35;
    white-space: nowrap;
  }

  .bottom-line {
    display: grid;
    min-width: 0;
    grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
    gap: var(--sp-3);
    align-items: center;
  }

  .feedback,
  .step-note {
    min-width: 0;
    padding: var(--sp-2) var(--sp-3);
    border-inline-start: 4px solid var(--accent);
    background: var(--accent-soft);
    font-size: var(--fs-body);
    line-height: var(--lh-body);
  }

  .step-note {
    border-inline-start-color: var(--positive);
  }
</style>
</head>
<body data-page="10" data-total="18">
<div id="stage">
  <main class="gravity-page" aria-label="三个天体表面重力的同步实验">
    <p class="sr-only scene-alt">三个场景分别用地球、月球和火星重力计算同一次跳跃。</p>
    <section class="experiment-bar controls" aria-label="实验控制">
      <div class="predict-control min0">
        <label for="prediction">先预测落地顺序</label>
        <select id="prediction">
          <option value="">请选择一种顺序</option>
          <option value="earth,mars,moon">地球 → 火星 → 月球</option>
          <option value="earth,moon,mars">地球 → 月球 → 火星</option>
          <option value="moon,mars,earth">月球 → 火星 → 地球</option>
        </select>
      </div>
      <button id="release" class="primary release-button" type="button">同时释放</button>
      <div class="box-control min0">
        <span id="box-label" class="control-label">拖动箱子；松手后观察滑行</span>
        <div id="box-rail" class="box-rail no-pan">
          <div id="box-handle" class="box-handle" role="slider" tabindex="0" aria-labelledby="box-label" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0"></div>
        </div>
      </div>
    </section>

    <section class="triptych" aria-label="地球、月球和火星并排比较">
      <article class="world-card panel panel--quiet min0" data-world="earth">
        <header class="world-head">
          <h2>地球</h2>
          <span class="badge mass-label"></span>
        </header>
        <div class="scene min0">
          <canvas class="cv-fill" role="img" aria-label="人物和箱子位于地面；释放后由物理引擎计算跳跃与碰撞。"></canvas>
          <span class="badge scene-status">等待释放</span>
        </div>
        <div class="world-data">
          <div class="datum"><span class="datum-label">表面重力</span><strong class="datum-value gravity-value"></strong></div>
          <div class="datum"><span class="datum-label">重量</span><strong class="datum-value weight-value"></strong></div>
        </div>
      </article>

      <article class="world-card panel panel--accent min0" data-world="moon">
        <header class="world-head">
          <h2>月球</h2>
          <span class="badge mass-label"></span>
        </header>
        <div class="scene min0">
          <canvas class="cv-fill" role="img" aria-label="人物和箱子位于地面；释放后由物理引擎计算跳跃与碰撞。"></canvas>
          <span class="badge scene-status">等待释放</span>
        </div>
        <div class="world-data">
          <div class="datum"><span class="datum-label">表面重力</span><strong class="datum-value gravity-value"></strong></div>
          <div class="datum"><span class="datum-label">重量</span><strong class="datum-value weight-value"></strong></div>
        </div>
      </article>

      <article class="world-card panel panel--quiet min0" data-world="mars">
        <header class="world-head">
          <h2>火星</h2>
          <span class="badge mass-label"></span>
        </header>
        <div class="scene min0">
          <canvas class="cv-fill" role="img" aria-label="人物和箱子位于地面；释放后由物理引擎计算跳跃与碰撞。"></canvas>
          <span class="badge scene-status">等待释放</span>
        </div>
        <div class="world-data">
          <div class="datum"><span class="datum-label">表面重力</span><strong class="datum-value gravity-value"></strong></div>
          <div class="datum"><span class="datum-label">重量</span><strong class="datum-value weight-value"></strong></div>
        </div>
      </article>
    </section>

    <section class="bottom-line" aria-live="polite">
      <p id="feedback" class="feedback">三处质量相同。选好预测，再同时释放。</p>
      <p class="step-note">每一小段时间，速度都被重力继续改变。</p>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script>
  Deck.init({ index: 10, total: 18 });

  Lec.mount({
    index: 10,
    kicker: `ONE BODY, THREE WORLDS`,
    title: `同一个你，在地球、月球和火星上有多“重”？`,
    take: `质量属于物体，重量取决于所在地的重力；身体动作也会随环境改变。`
  });

  (function () {
    var Engine = Matter.Engine;
    var Bodies = Matter.Bodies;
    var Body = Matter.Body;
    var Composite = Matter.Composite;
    var Events = Matter.Events;
    var mass = Lec.K.human.representativeMass;
    var earthG = Lec.P.gravityAtRadius(Lec.K.earth, Lec.K.earth.meanRadius);
    var configs = [
      { key: 'earth', name: '地球', body: Lec.K.earth },
      { key: 'moon', name: '月球', body: Lec.K.moon },
      { key: 'mars', name: '火星', body: Lec.K.mars }
    ];
    var scenes = [];
    var running = false;
    var done = false;
    var reduced = Deck.reduced();
    var releaseButton = document.getElementById('release');
    var prediction = document.getElementById('prediction');
    var feedback = document.getElementById('feedback');
    var rail = document.getElementById('box-rail');
    var handle = document.getElementById('box-handle');
    var dragging = false;
    var lastPointerX = 0;
    var lastPointerTime = 0;
    var gestureVelocity = 0;

    function fmt(value) {
      return Lec.P.significant(value, Lec.K.math.three);
    }

    function makeScene(cfg) {
      var card = document.querySelector('[data-world="' + cfg.key + '"]');
      var area = card.querySelector('.scene');
      var canvas = card.querySelector('canvas');
      var width = area.offsetWidth;
      var height = area.offsetHeight;
      var groundY = height - 34;
      var engine = Engine.create({ enableSleeping: false });
      var gravity = Lec.P.gravityAtRadius(cfg.body, cfg.body.meanRadius);
      engine.gravity.y = Lec.P.ratio(gravity, earthG);
      engine.gravity.scale = 0.001;

      var ground = Bodies.rectangle(width / 2, groundY + 18, width + 20, 36, {
        isStatic: true,
        friction: 0,
        restitution: 0
      });
      var person = Bodies.rectangle(width * 0.34, groundY - 30, 28, 56, {
        friction: 0,
        frictionAir: 0,
        restitution: 0
      });
      var box = Bodies.rectangle(width * 0.68, groundY - 22, 46, 42, {
        friction: 0,
        frictionAir: 0.012,
        restitution: 0.04,
        mass: mass
      });
      var leftWall = Bodies.rectangle(-8, height / 2, 16, height, { isStatic: true });
      var rightWall = Bodies.rectangle(width + 8, height / 2, 16, height, { isStatic: true });
      Composite.add(engine.world, [ground, person, box, leftWall, rightWall]);

      var scene = {
        cfg: cfg,
        card: card,
        area: area,
        canvas: canvas,
        engine: engine,
        gravity: gravity,
        person: person,
        box: box,
        groundY: groundY,
        startX: width * 0.34,
        boxX: width * 0.68,
        landed: false,
        landedAt: null
      };

      Events.on(engine, 'collisionStart', function (event) {
        if (!running || scene.landed) return;
        event.pairs.forEach(function (pair) {
          if ((pair.bodyA === person && pair.bodyB === ground) ||
              (pair.bodyB === person && pair.bodyA === ground)) {
            if (person.velocity.y >= 0) {
              scene.landed = true;
              scene.landedAt = engine.timing.timestamp;
              card.querySelector('.scene-status').textContent = '已落地';
              checkFinished();
            }
          }
        });
      });

      card.querySelector('.mass-label').textContent = '质量 ' + fmt(mass) + ' kg';
      card.querySelector('.gravity-value').textContent = fmt(gravity) + ' m/s²';
      card.querySelector('.weight-value').textContent = fmt(Lec.P.weight(mass, gravity)) + ' N';
      Deck.autofit(canvas, function () { drawScene(scene); });
      return scene;
    }

    function drawPerson(ctx, body) {
      var x = body.position.x;
      var y = body.position.y;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(body.angle);
      ctx.strokeStyle = Deck.rgba('--text', 0.95);
      ctx.fillStyle = Deck.rgba('--accent', 0.24);
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, -24, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -14);
      ctx.lineTo(0, 12);
      ctx.moveTo(-16, -2);
      ctx.lineTo(16, -2);
      ctx.moveTo(0, 12);
      ctx.lineTo(-12, 28);
      ctx.moveTo(0, 12);
      ctx.lineTo(12, 28);
      ctx.stroke();
      ctx.restore();
    }

    function drawScene(scene) {
      var ctx = Deck.fit(scene.canvas);
      var w = scene.area.offsetWidth;
      var h = scene.area.offsetHeight;
      ctx.clearRect(0, 0, w, h);

      ctx.fillStyle = Deck.rgba('--accent', 0.07);
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = Deck.rgba('--line-strong', 0.7);
      ctx.lineWidth = 1;
      for (var y = 72; y < scene.groundY; y += 72) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      ctx.fillStyle = Deck.rgba('--surface-raised', 1);
      ctx.fillRect(0, scene.groundY, w, h - scene.groundY);
      ctx.strokeStyle = Deck.rgba('--accent', 0.8);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, scene.groundY);
      ctx.lineTo(w, scene.groundY);
      ctx.stroke();

      drawPerson(ctx, scene.person);

      var box = scene.box;
      ctx.save();
      ctx.translate(box.position.x, box.position.y);
      ctx.rotate(box.angle);
      ctx.fillStyle = Deck.rgba('--warning', 0.24);
      ctx.strokeStyle = Deck.rgba('--warning', 0.95);
      ctx.lineWidth = 3;
      ctx.fillRect(-23, -21, 46, 42);
      ctx.strokeRect(-23, -21, 46, 42);
      ctx.beginPath();
      ctx.moveTo(-23, -21);
      ctx.lineTo(23, 21);
      ctx.moveTo(23, -21);
      ctx.lineTo(-23, 21);
      ctx.stroke();
      ctx.restore();
    }

    function resetExperiment() {
      scenes.forEach(function (scene) {
        Body.setPosition(scene.person, { x: scene.startX, y: scene.groundY - 34 });
        Body.setVelocity(scene.person, { x: 0, y: 0 });
        Body.setAngle(scene.person, 0);
        Body.setAngularVelocity(scene.person, 0);
        scene.landed = false;
        scene.landedAt = null;
        scene.card.querySelector('.scene-status').textContent = '等待释放';
      });
      running = false;
      done = false;
      prediction.disabled = false;
      releaseButton.disabled = false;
      releaseButton.textContent = '同时释放';
      feedback.textContent = '三处质量相同。选好预测，再同时释放。';
    }

    function beginExperiment() {
      if (!prediction.value) {
        feedback.textContent = '请先选择一种落地顺序。';
        prediction.focus();
        return;
      }
      if (done) {
        resetExperiment();
        return;
      }

      prediction.disabled = true;
      releaseButton.disabled = true;
      releaseButton.textContent = '运动中';
      feedback.textContent = '同样的起跳速度，重力正在逐步改变运动。';

      if (reduced) {
        var ordered = scenes.slice().sort(function (a, b) { return b.gravity - a.gravity; });
        ordered.forEach(function (scene, index) {
          scene.landed = true;
          scene.landedAt = index;
          Body.setPosition(scene.person, { x: scene.startX, y: scene.groundY - 30 });
          scene.card.querySelector('.scene-status').textContent = '已落地';
        });
        finishExperiment();
        return;
      }

      running = true;
      scenes.forEach(function (scene) {
        Body.setPosition(scene.person, { x: scene.startX, y: scene.groundY - 36 });
        Body.setVelocity(scene.person, { x: 0, y: -10 });
        scene.card.querySelector('.scene-status').textContent = '空中';
      });
    }

    function checkFinished() {
      if (scenes.every(function (scene) { return scene.landed; })) finishExperiment();
    }

    function finishExperiment() {
      running = false;
      done = true;
      releaseButton.disabled = false;
      releaseButton.textContent = '重置实验';
      var actual = scenes.slice().sort(function (a, b) { return a.landedAt - b.landedAt; });
      var actualKey = actual.map(function (scene) { return scene.cfg.key; }).join(',');
      var names = actual.map(function (scene) { return scene.cfg.name; }).join(' → ');
      if (prediction.value === actualKey) {
        feedback.textContent = '预测与模拟一致：' + names + '。';
      } else {
        feedback.textContent = '实际顺序：' + names + '。重力越弱，腾空越久。';
      }
    }

    function setBoxesFromHandle(normalized, velocity) {
      var limit;
      scenes.forEach(function (scene) {
        limit = scene.area.offsetWidth * 0.29;
        Body.setPosition(scene.box, {
          x: scene.boxX + normalized * limit,
          y: scene.box.position.y
        });
        Body.setVelocity(scene.box, { x: velocity, y: scene.box.velocity.y });
      });
      handle.style.left = ((normalized + 1) * 50) + '%';
      handle.setAttribute('aria-valuenow', String(fmt(normalized)));
      feedback.textContent = '三只箱子质量相同，水平方向的速度变化保持一致。';
    }

    function pointerNormalized(event) {
      var point = Deck.pt(rail, event);
      return Deck.clamp((point.x / rail.offsetWidth) * 2 - 1, -1, 1);
    }

    handle.addEventListener('pointerdown', function (event) {
      dragging = true;
      handle.setPointerCapture(event.pointerId);
      lastPointerX = Deck.pt(rail, event).x;
      lastPointerTime = event.timeStamp;
      gestureVelocity = 0;
    });

    handle.addEventListener('pointermove', function (event) {
      if (!dragging) return;
      var point = Deck.pt(rail, event);
      var dt = Math.max(event.timeStamp - lastPointerTime, 1);
      gestureVelocity = (point.x - lastPointerX) / dt * 12;
      lastPointerX = point.x;
      lastPointerTime = event.timeStamp;
      setBoxesFromHandle(pointerNormalized(event), gestureVelocity);
    });

    function endDrag(event) {
      if (!dragging) return;
      dragging = false;
      if (event && handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId);
      scenes.forEach(function (scene) {
        Body.setVelocity(scene.box, { x: gestureVelocity, y: scene.box.velocity.y });
      });
    }

    handle.addEventListener('pointerup', endDrag);
    handle.addEventListener('pointercancel', endDrag);

    handle.addEventListener('keydown', function (event) {
      var impulse = 0;
      if (event.key === 'ArrowLeft') impulse = -2;
      if (event.key === 'ArrowRight') impulse = 2;
      if (event.key === 'Escape') {
        dragging = false;
        scenes.forEach(function (scene) { Body.setVelocity(scene.box, { x: 0, y: scene.box.velocity.y }); });
        return;
      }
      if (!impulse) return;
      event.preventDefault();
      scenes.forEach(function (scene) {
        Body.setVelocity(scene.box, { x: scene.box.velocity.x + impulse, y: scene.box.velocity.y });
      });
      feedback.textContent = '同样的推力改变同样的质量；重量不同，惯性仍相同。';
    });

    releaseButton.addEventListener('click', beginExperiment);
    configs.forEach(function (cfg) { scenes.push(makeScene(cfg)); });

    Deck.loop(function (time, dt) {
      var step = Math.min(dt || 16.67, 34);
      scenes.forEach(function (scene) {
        Engine.update(scene.engine, step);
        drawScene(scene);
      });
    }, { still: 1 });
  })();
</script>
</body>
</html>
