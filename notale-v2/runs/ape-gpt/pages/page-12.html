<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-header__inner {
      width: 100%;
      min-width: 0;
    }

    .lec-header__identity,
    .lec-header__heading {
      display: flex;
      min-width: 0;
      align-items: center;
    }

    .lec-header__identity {
      gap: var(--sp-3);
    }

    .lec-header__heading {
      gap: var(--sp-4);
    }

    .lec-header__index,
    .lec-header__kicker {
      flex: 0 0 auto;
    }

    .lec-header__title {
      overflow: hidden;
      color: var(--text);
      font-size: var(--fs-body-lg);
      font-weight: 730;
      line-height: var(--lh-heading);
      letter-spacing: -0.015em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mismatch-map {
      position: relative;
      width: 1180px;
      height: 610px;
      flex: 0 0 auto;
    }

    .map-lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      color: var(--line-strong);
      pointer-events: none;
    }

    .map-lines .orbit {
      fill: none;
      stroke: var(--line);
      stroke-width: 2;
      stroke-dasharray: 7 12;
    }

    .map-lines .link {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .map-lines .node {
      fill: var(--bg);
      stroke: var(--accent);
      stroke-width: 3;
    }

    .astronaut-wrap {
      position: absolute;
      left: 50%;
      top: 51%;
      width: 252px;
      height: 352px;
      transform: translate(-50%, -50%);
      color: var(--text);
    }

    .astronaut-halo {
      position: absolute;
      inset: 36px 12px 20px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-pill);
      background: var(--accent-soft);
    }

    .astronaut {
      position: relative;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 14px 24px var(--shadow-color));
    }

    .astronaut .suit {
      fill: var(--text);
      stroke: var(--line-strong);
      stroke-width: 3;
      stroke-linejoin: round;
    }

    .astronaut .shade {
      fill: var(--surface-3);
      stroke: var(--accent-strong);
      stroke-width: 4;
    }

    .astronaut .joint {
      fill: var(--surface-raised);
      stroke: var(--line-strong);
      stroke-width: 3;
    }

    .astronaut .detail {
      fill: none;
      stroke: var(--surface-3);
      stroke-width: 4;
      stroke-linecap: round;
    }

    .body-tag {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      padding: var(--sp-2) var(--sp-4);
      border: 1px solid var(--accent);
      border-radius: var(--radius-pill);
      background: var(--surface-1);
      color: var(--accent-strong);
      font-size: var(--fs-body);
      font-weight: 740;
      line-height: 1.35;
      white-space: nowrap;
    }

    .gap-label {
      position: absolute;
      width: 242px;
      min-height: 78px;
      display: flex;
      padding: var(--sp-3) var(--sp-4);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-1);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--surface-1);
      box-shadow: 0 14px 34px var(--shadow-color);
    }

    .gap-label strong {
      color: var(--text);
      font-size: var(--fs-body-lg);
      line-height: 1.35;
    }

    .gap-label span {
      color: var(--text-muted);
      font-size: var(--fs-label);
      line-height: 1.4;
    }

    .gap-gravity { left: 469px; top: 0; }
    .gap-air { left: 44px; top: 130px; }
    .gap-shield { right: 44px; top: 130px; }
    .gap-supplies { left: 112px; bottom: 30px; }
    .gap-contact { right: 112px; bottom: 30px; }

    .map-caption {
      max-width: 880px;
      color: var(--text-muted);
      font-size: var(--fs-body-lg);
      line-height: var(--lh-copy);
      text-align: center;
    }

    .map-caption strong {
      color: var(--accent-strong);
      font-weight: 740;
    }
  </style>
</head>
<body data-page="12" data-total="18">
  <div id="stage">
    <main class="focus" aria-label="地球身体与非地球环境的五项失配">
      <figure class="mismatch-map" aria-label="一名地球身体的宇航员位于中央，重力、空气、水与食物、辐射屏障和即时社会联系五项地球默认条件环绕四周。">
        <svg class="map-lines" viewBox="0 0 1180 610" aria-hidden="true">
          <ellipse class="orbit" cx="590" cy="304" rx="460" ry="226"></ellipse>
          <path class="link" d="M590 104 L590 176"></path>
          <path class="link" d="M278 191 L463 254"></path>
          <path class="link" d="M902 191 L717 254"></path>
          <path class="link" d="M356 500 L473 390"></path>
          <path class="link" d="M824 500 L707 390"></path>
          <circle class="node" cx="590" cy="176" r="7"></circle>
          <circle class="node" cx="463" cy="254" r="7"></circle>
          <circle class="node" cx="717" cy="254" r="7"></circle>
          <circle class="node" cx="473" cy="390" r="7"></circle>
          <circle class="node" cx="707" cy="390" r="7"></circle>
        </svg>

        <div class="astronaut-wrap" aria-hidden="true">
          <div class="astronaut-halo"></div>
          <svg class="astronaut" viewBox="0 0 252 352">
            <path class="joint" d="M79 143 L43 169 L26 231 L49 239 L69 191 L92 181 Z"></path>
            <path class="joint" d="M173 143 L209 169 L226 231 L203 239 L183 191 L160 181 Z"></path>
            <path class="suit" d="M87 126 Q126 109 165 126 L181 221 Q164 246 126 246 Q88 246 71 221 Z"></path>
            <path class="suit" d="M94 232 L80 315 L112 318 L126 249 L140 318 L172 315 L158 232 Z"></path>
            <circle class="joint" cx="47" cy="246" r="18"></circle>
            <circle class="joint" cx="205" cy="246" r="18"></circle>
            <ellipse class="suit" cx="126" cy="89" rx="61" ry="59"></ellipse>
            <path class="shade" d="M82 87 Q87 44 126 39 Q165 44 170 87 Q157 111 126 116 Q95 111 82 87 Z"></path>
            <path class="detail" d="M101 164 H151 M110 184 H142 M92 265 L112 269 M160 265 L140 269"></path>
            <rect class="joint" x="99" y="151" width="54" height="48" rx="8"></rect>
          </svg>
          <div class="body-tag">地球身体</div>
        </div>

        <div class="gap-label gap-gravity">
          <strong>重力</strong>
          <span>持续的身体负荷</span>
        </div>
        <div class="gap-label gap-air">
          <strong>空气</strong>
          <span>可呼吸的气压</span>
        </div>
        <div class="gap-label gap-shield">
          <strong>辐射屏障</strong>
          <span>大气与磁场的遮蔽</span>
        </div>
        <div class="gap-label gap-supplies">
          <strong>水与食物</strong>
          <span>不断补充的物质</span>
        </div>
        <div class="gap-label gap-contact">
          <strong>即时社会联系</strong>
          <span>近距离的反馈与支持</span>
        </div>

      </figure>

      <p class="map-caption">
        离开地球后，这些默认条件不会自动存在，<strong>每一项都要由人工系统接手。</strong>
      </p>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Deck.init({ index: 12, total: 18 });

    Lec.mount({
      index: 12,
      kicker: `THE MISMATCH`,
      title: `太空不是人类的下一处自然栖息地`,
      take: `进入太空不是抵达为我们准备好的环境，而是把地球条件一起带走。`
    });
  </script>
</body>
</html>
