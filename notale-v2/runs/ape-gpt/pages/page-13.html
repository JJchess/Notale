<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lec-header__inner,.lec-footer__inner{display:flex;width:100%;min-width:0;align-items:center;justify-content:space-between;}
  .lec-header__identity{display:flex;min-width:0;align-items:center;gap:var(--sp-3);}
  .lec-header__heading{display:flex;min-width:0;align-items:baseline;gap:var(--sp-3);}
  .lec-header__index{font-family:var(--font-mono);font-size:var(--fs-label);line-height:1;}
  .lec-header__kicker{color:var(--accent-strong);font-size:var(--fs-tick);line-height:1.35;white-space:nowrap;}
  .lec-header__title{overflow:hidden;color:var(--text);font-size:var(--fs-body);font-weight:700;line-height:1.35;text-overflow:ellipsis;white-space:nowrap;}
  .lec-footer__take{display:flex;min-width:0;align-items:center;gap:var(--sp-3);}
  .lec-footer__take-label{color:var(--accent-strong);font-weight:700;}
  .rocket-game{padding-block:var(--sp-5);}
  .rocket-plate{position:relative;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--sp-3);}
  .plate-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);}
  .plate-head .badge{margin-top:var(--sp-1);}
  .rocket-bay{position:relative;display:grid;place-items:center;min-height:0;border-block:1px solid var(--line);background:linear-gradient(90deg,transparent,var(--accent-soft),transparent);}
  .rocket{position:relative;display:flex;width:520px;height:470px;flex-direction:column;align-items:center;justify-content:flex-end;}
  .nose{width:220px;height:64px;border:2px solid var(--line-strong);border-bottom:0;border-radius:var(--radius-pill) var(--radius-pill) 0 0;}
  .payload-stack{display:flex;width:220px;min-height:128px;flex-direction:column-reverse;justify-content:flex-start;border-inline:2px solid var(--line-strong);}
  .payload-segment{display:flex;height:30px;padding-inline:var(--sp-2);align-items:center;justify-content:center;border-top:1px dashed var(--line-strong);background:var(--accent-soft);color:var(--text);font-size:var(--fs-label);font-weight:680;line-height:1.35;opacity:.16;transition:opacity .2s ease,background .2s ease;}
  .payload-segment.loaded{opacity:1;}
  .stage-shell{position:relative;display:flex;width:360px;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--line-strong);background:var(--surface-1);}
  .stage-shell::before,.stage-shell::after{content:"";position:absolute;left:12px;right:12px;border-top:1px dashed var(--line);}
  .stage-shell::before{top:34%;}.stage-shell::after{top:68%;}
  .stage-a{height:122px;}.stage-b{height:0;border-width:0;opacity:0;transition:height .2s ease,opacity .2s ease;}
  .two-stage .stage-b{height:110px;border-width:2px;opacity:1;}
  .engine{width:410px;height:34px;border:2px solid var(--line-strong);clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);background:var(--surface-2);}
  .stage-tag{position:absolute;right:-98px;color:var(--text-muted);font-size:var(--fs-label);line-height:1.4;white-space:nowrap;}
  .stage-tag::before{content:"";position:absolute;right:100%;top:50%;width:70px;margin-right:var(--sp-2);border-top:1px dashed var(--line-strong);}
  .stage-a .stage-tag{top:44%;}.stage-b .stage-tag{top:42%;}
  .bay-note{position:absolute;left:var(--sp-4);top:var(--sp-4);max-width:210px;color:var(--text-muted);font-size:var(--fs-label);line-height:1.4;}
  .bay-note .data{display:block;margin-top:var(--sp-3);color:var(--accent-strong);font-size:var(--fs-label);line-height:1.4;}
  .bay-metric{position:absolute;right:var(--sp-4);top:var(--sp-4);text-align:right;}
  .bay-metric strong{display:block;color:var(--accent-strong);font-family:var(--font-mono);font-size:var(--fs-h3);line-height:var(--lh-heading);}
  .plate-foot{display:flex;gap:var(--sp-3);align-items:center;justify-content:space-between;}
  .plate-foot .hint{max-width:520px;}
  .game-console{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:var(--sp-4);}
  .mission{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);}
  .mission-copy{max-width:430px;}
  .mission-copy p{margin-top:var(--sp-2);}
  .control-stack{display:grid;gap:var(--sp-3);}
  .load-control{display:grid;gap:var(--sp-2);}
  .control-top{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);}
  .payload-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-2);}
  .payload-chip{display:grid;min-height:58px;padding:var(--sp-2);place-items:center;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-1);color:var(--text-faint);font-size:var(--fs-label);line-height:1.35;text-align:center;}
  .payload-chip.loaded{border-color:var(--accent);background:var(--accent-soft);color:var(--text);}
  .mass-ledger{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:110px minmax(0,1fr);gap:var(--sp-3);align-content:stretch;}
  .mass-cell{padding:var(--sp-3);border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-1);}
  .mass-cell span{display:block;color:var(--text-muted);font-size:var(--fs-label);line-height:1.4;}
  .mass-cell strong{display:block;margin-top:var(--sp-1);font-family:var(--font-mono);font-size:var(--fs-body-lg);line-height:1.35;}
  .budget{display:grid;grid-column:1/-1;padding:var(--sp-3);align-content:center;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-1);}
  .budget-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-2);}
  .budget-head span{font-size:var(--fs-label);line-height:1.4;}
  .budget .meter{height:52px;}
  .budget .meter>i{display:block;transition:width .2s ease;}
  .result{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp-3);align-items:center;}
  .result strong{display:block;font-size:var(--fs-body-lg);line-height:1.35;}
  .result p{margin-top:var(--sp-1);font-size:var(--fs-body);line-height:var(--lh-body);}
  @media (prefers-reduced-motion:reduce){.payload-segment,.stage-b,.budget .meter>i{transition:none;}}
</style>
</head>
<body data-page="13" data-total="18">
<div id="stage">
  <main class="split-lr rocket-game" aria-label="火箭质量预算小游戏">
    <figure class="panel panel--quiet rocket-plate min0" aria-labelledby="plate-title">
      <div class="plate-head">
        <div>
          <div class="label muted">MASS STACK / 实时剖面</div>
          <h2 id="plate-title" class="h3">每一级都要托起上方全部质量</h2>
        </div>
        <span id="stageBadge" class="badge">单级构型</span>
      </div>
      <div class="rocket-bay">
        <div class="bay-note">虚线把载荷、结构与推进剂分开；下级接收上方总质量。<span id="inputReadout" class="data">任务输入 —</span></div>
        <div class="bay-metric"><span class="label muted">起飞总质量</span><strong id="totalMassHero">—</strong></div>
        <div id="rocket" class="rocket" aria-hidden="true">
          <div class="nose"></div>
          <div id="payloadStack" class="payload-stack"></div>
          <div class="stage-shell stage-a"><span class="stage-tag">推进级 A</span></div>
          <div class="stage-shell stage-b"><span class="stage-tag">推进级 B</span></div>
          <div class="engine"></div>
        </div>
      </div>
      <div class="plate-foot">
        <figcaption>看下级标注：新增推进剂本身也进入它的负担。</figcaption>
        <span id="ratioReadout" class="badge data">质量比 —</span>
      </div>
    </figure>

    <section class="game-console min0" aria-labelledby="game-title">
      <div class="mission">
        <div class="mission-copy">
          <div class="label muted">LEO LOADOUT CHALLENGE</div>
          <h2 id="game-title" class="h3">把四项任务载荷送入近地轨道</h2>
          <p class="text-sm muted">拖动“已装载项”滑块，再比较单级与两级构型。</p>
        </div>
        <span id="budgetBadge" class="badge">质量预算 —</span>
      </div>

      <div class="controls control-stack">
        <div class="load-control">
          <div class="control-top">
            <label for="loadRange">已装载项</label>
            <output id="loadCount" class="data accent" for="loadRange">—</output>
          </div>
          <input class="no-pan" id="loadRange" type="range" aria-describedby="loadHint">
          <div id="payloadList" class="payload-list" aria-hidden="true"></div>
          <p id="loadHint" class="hint">从左向右加入载荷；方向键可逐项调整。</p>
        </div>
        <div class="control">
          <label for="stageSelect">火箭构型</label>
          <select id="stageSelect">
            <option value="single">单级推进</option>
            <option value="two">两级推进</option>
          </select>
        </div>
      </div>

      <div class="mass-ledger" aria-label="实时质量账本">
        <div class="mass-cell"><span>任务载荷</span><strong id="payloadMass">—</strong></div>
        <div class="mass-cell"><span>火箭结构</span><strong id="structureMass">—</strong></div>
        <div class="mass-cell"><span>推进剂</span><strong id="propMass">—</strong></div>
        <div class="budget">
          <div class="budget-head"><span>起飞质量 / 预算</span><strong id="budgetReadout" class="data">—</strong></div>
          <div class="meter" aria-hidden="true"><i id="budgetBar"></i></div>
        </div>
      </div>

      <div class="callout result" aria-live="polite">
        <div><strong id="resultTitle">准备装载</strong><p id="resultCopy">先加入载荷，观察结构与推进剂如何增长。</p></div>
        <button id="resetButton" type="button">重置任务</button>
      </div>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Deck.init({ index: 13, total: 18 });

  Lec.mount({
    index: 13,
    kicker: `THE TYRANNY OF FUEL`,
    title: `多带一公斤，为什么不只是多加一公斤燃料？`,
    take: `火箭必须同时加速载荷、结构和尚未烧掉的推进剂，因此质量代价会层层放大。`
  });

  (function(){
    var K = Lec.K;
    var P = Lec.P;
    var base = K.human.representativeMass;
    var taskDeltaV = P.scaleValue(K.math.eight + K.human.walkingSpeed, K.math.one, K.prefixes.kilo);
    var specificImpulse = K.spacecraft.chemicalEngineTypicalSpecificImpulse;
    var structuralFraction = P.divide(K.math.one, K.math.ten);
    var budget = P.scaleValue(K.math.two * K.math.ten, K.math.one, K.prefixes.kilo);
    var payloads = [
      { name:'乘员舱', mass:P.scaleValue(base,K.math.one,K.math.eight) },
      { name:'生命保障', mass:P.scaleValue(base,K.math.one,K.math.five) },
      { name:'科学载荷', mass:P.scaleValue(base,K.math.one,K.math.three) },
      { name:'安全余量', mass:P.scaleValue(base,K.math.one,K.math.two) }
    ];
    var state = { loaded:K.math.one, stages:K.math.one };
    var trace = [];
    var range = document.getElementById('loadRange');
    var select = document.getElementById('stageSelect');
    var reset = document.getElementById('resetButton');
    range.min = K.math.zero;
    range.max = payloads.length;
    range.step = K.math.one;
    range.value = state.loaded;

    function fmtKg(value){
      if (!isFinite(value)) return '不可行';
      if (value >= K.prefixes.kilo) return String(P.significant(P.divide(value,K.units.kilogramsPerTonne))) + ' t';
      return String(P.significant(value)) + ' kg';
    }

    function solveStage(upperMass, deltaV){
      var ratio = P.rocketMassRatio(deltaV, specificImpulse);
      var denominator = K.math.one - ratio * structuralFraction;
      if (denominator <= K.math.zero) return { feasible:false, ratio:ratio };
      var wet = upperMass * (ratio - K.math.one) / denominator;
      return {
        feasible:true,
        ratio:ratio,
        structure:wet * structuralFraction,
        propellant:wet * (K.math.one - structuralFraction),
        total:upperMass + wet
      };
    }

    function solve(payloadMass, stages){
      var upper = payloadMass;
      var structure = K.math.zero;
      var propellant = K.math.zero;
      var lastRatio = K.math.one;
      var deltaVPerStage = P.divide(taskDeltaV, stages);
      for(var i=0;i<stages;i+=K.math.one){
        var level = solveStage(upper,deltaVPerStage);
        if(!level.feasible) return { feasible:false,ratio:level.ratio };
        structure += level.structure;
        propellant += level.propellant;
        upper = level.total;
        lastRatio = level.ratio;
      }
      return { feasible:true,payload:payloadMass,structure:structure,propellant:propellant,total:upper,ratio:lastRatio };
    }

    function payloadMass(){
      var total = K.math.zero;
      for(var i=0;i<state.loaded;i+=K.math.one) total += payloads[i].mass;
      return total;
    }

    function buildStatic(){
      var list = document.getElementById('payloadList');
      var stack = document.getElementById('payloadStack');
      payloads.forEach(function(item,index){
        var chip = document.createElement('div');
        chip.className = 'payload-chip';
        chip.textContent = item.name;
        chip.dataset.index = index;
        list.appendChild(chip);
        var segment = document.createElement('div');
        segment.className = 'payload-segment';
        segment.textContent = item.name;
        segment.dataset.index = index;
        stack.appendChild(segment);
      });
      document.getElementById('budgetBadge').textContent = '质量预算 ' + fmtKg(budget);
    }

    function render(action){
      var mass = payloadMass();
      var model = solve(mass,state.stages);
      document.querySelectorAll('[data-index]').forEach(function(el){
        el.classList.toggle('loaded',Number(el.dataset.index)<state.loaded);
      });
      document.getElementById('rocket').classList.toggle('two-stage',state.stages===K.math.two);
      document.getElementById('stageBadge').textContent = state.stages===K.math.two ? '两级构型' : '单级构型';
      document.getElementById('loadCount').textContent = String(P.significant(state.loaded)) + ' / ' + String(P.significant(payloads.length));
      document.getElementById('payloadMass').textContent = fmtKg(mass);
      var exhaustVelocity = P.scaleValue(specificImpulse,K.math.one,K.physics.standardGravity);
      document.getElementById('inputReadout').textContent = '任务 Δv ' + String(P.significant(P.divide(taskDeltaV,K.prefixes.kilo))) + ' km/s · 喷气 ' + String(P.significant(P.divide(exhaustVelocity,K.prefixes.kilo))) + ' km/s';
      document.getElementById('ratioReadout').textContent = '每级质量比 ' + String(P.significant(model.ratio));
      document.getElementById('structureMass').textContent = model.feasible ? fmtKg(model.structure) : '不可行';
      document.getElementById('propMass').textContent = model.feasible ? fmtKg(model.propellant) : '不可行';
      document.getElementById('totalMassHero').textContent = model.feasible ? fmtKg(model.total) : '超出结构极限';
      document.getElementById('budgetReadout').textContent = model.feasible ? fmtKg(model.total) + ' / ' + fmtKg(budget) : '不可行';
      var fraction = model.feasible ? Math.min(K.math.one,P.divide(model.total,budget)) : K.math.one;
      document.getElementById('budgetBar').style.width = String(fraction*K.math.hundred) + '%';
      var allLoaded = state.loaded===payloads.length;
      var success = allLoaded && model.feasible && model.total<=budget;
      var title = document.getElementById('resultTitle');
      var copy = document.getElementById('resultCopy');
      if(success){
        title.textContent = '任务达成：全部载荷进入预算';
        copy.textContent = '分级让每一级只承担一段速度需求。';
      }else if(allLoaded && model.feasible){
        title.textContent = '载荷齐全，但起飞质量超出预算';
        copy.textContent = '推进剂增加后，又要求更多推进剂来加速它。';
      }else if(model.feasible && model.total>budget){
        title.textContent = '预算已超：载荷不是唯一增量';
        copy.textContent = '载荷还连带增加结构与尚未烧掉的推进剂。';
      }else if(!model.feasible){
        title.textContent = '当前级无法托起自己的结构';
        copy.textContent = '质量比要求超过这一级的结构余量。';
      }else{
        title.textContent = '继续装载：总质量并非等量增加';
        copy.textContent = '每项载荷都会连带增加结构与推进剂。';
      }
      document.querySelector('.rocket-bay').setAttribute('aria-label','当前装载' + String(P.significant(state.loaded)) + '项，' + (state.stages===K.math.two?'两级':'单级') + '火箭起飞质量为' + (model.feasible?fmtKg(model.total):'不可行') + '。');
      if(action){
        trace.push({action:action,loaded:state.loaded,stages:state.stages,total:model.total||null});
      }
    }

    function setLoaded(value,action){
      state.loaded = Number(value);
      range.value = state.loaded;
      render(action);
    }

    range.addEventListener('input',function(){ setLoaded(range.value,'load'); });
    select.addEventListener('change',function(){
      state.stages = select.value==='two' ? K.math.two : K.math.one;
      render('stage');
    });
    reset.addEventListener('click',function(){
      state = { loaded:K.math.one, stages:K.math.one };
      trace = [];
      range.value = state.loaded;
      select.value = 'single';
      render('reset');
    });
    document.addEventListener('keydown',function(event){
      if(event.key==='Escape') reset.click();
    });

    buildStatic();
    render();
  }());
</script>
</body>
</html>
