<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lec-header__inner, .lec-footer__inner { display: flex; width: 100%; min-width: 0; align-items: center; justify-content: space-between; }
  .lec-header__identity { display: flex; min-width: 0; align-items: center; gap: var(--sp-3); }
  .lec-header__heading { display: flex; min-width: 0; align-items: baseline; gap: var(--sp-3); }
  .lec-header__index, .lec-header__kicker { flex: 0 0 auto; font-size: var(--fs-label); }
  .lec-header__title { overflow: hidden; font-size: var(--fs-body-lg); line-height: var(--lh-heading); text-overflow: ellipsis; white-space: nowrap; }
  .lec-footer__take { display: flex; min-width: 0; align-items: center; gap: var(--sp-3); }
  .lec-footer__take-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lec-footer__index { flex: 0 0 auto; }
  .resource-page { padding-block: var(--sp-4); }
  .control-rail { display: flex; flex-direction: column; gap: var(--sp-4); }
  .control-rail .controls { flex: 1 1 auto; justify-content: space-between; }
  .rail-intro { color: var(--text-muted); font-size: var(--fs-body); line-height: var(--lh-copy); }
  .slider-block { display: grid; gap: var(--sp-1); }
  .slider-head { display: flex; justify-content: space-between; gap: var(--sp-2); align-items: baseline; }
  .slider-value { color: var(--accent-strong); font-family: var(--font-mono); font-size: var(--fs-label); font-variant-numeric: tabular-nums; }
  .workspace { display: grid; grid-template-rows: minmax(0, 1.05fr) minmax(0, .95fr); gap: var(--sp-4); }
  .flow-panel { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: var(--sp-2); padding: var(--sp-4); }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); }
  .panel-head h2 { font-size: var(--fs-h3); }
  .event-note { color: var(--warning); font-size: var(--fs-label); font-weight: 680; line-height: 1.4; text-align: right; }
  #flow { width: 100%; height: 100%; min-height: 0; }
  #flow text { font-family: var(--font-sans); font-size: var(--fs-label); fill: var(--text); }
  #flow .node-sub { font-family: var(--font-mono); font-size: var(--fs-tick); fill: var(--text-muted); }
  #flow .node { fill: var(--surface-2); stroke: var(--line-strong); stroke-width: 1.5; }
  #flow .crew { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
  #flow .flow { fill: none; stroke-linecap: round; opacity: .9; }
  #flow .water { stroke: var(--accent); }
  #flow .air { stroke: var(--positive); stroke-dasharray: 10 6; }
  #flow .food { stroke: var(--warning); }
  #flow .loss { stroke: var(--danger); stroke-dasharray: 3 7; }
  #flow marker path { fill: var(--text-muted); }
  .flow-caption { display: flex; justify-content: space-between; gap: var(--sp-4); }
  .legend-line { display: inline-flex; gap: var(--sp-3); flex-wrap: wrap; }
  .legend-line span::before { content: ""; display: inline-block; width: 28px; margin-inline-end: var(--sp-1); border-top: 3px solid currentColor; vertical-align: middle; }
  .lg-water { color: var(--accent-strong); }
  .lg-air { color: var(--positive); }
  .lg-food { color: var(--warning); }
  .ledger-panel { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: var(--sp-2); padding: var(--sp-4); }
  .summary { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }
  .summary .badge { font-family: var(--font-mono); }
  .summary .is-danger { color: var(--danger); border-color: var(--danger); }
  .ledger-table { table-layout: fixed; }
  .ledger-table th, .ledger-table td { padding-block: var(--sp-2); padding-inline: var(--sp-3); }
  .ledger-table th:first-child, .ledger-table td:first-child { width: 23%; }
  .ledger-table td:not(:first-child) { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .ledger-table .loss-row td { color: var(--danger); font-weight: 680; }
</style>
</head>
<body data-page="14" data-total="18">
<div id="stage">
  <main class="ledger resource-page">
    <aside class="control-rail min0" aria-label="生命保障调度参数">
      <div class="stack-2">
        <h2 class="h3">任务配置</h2>
        <p class="rail-intro">调节四项配置，比较故障后最先耗尽的资源。</p>
      </div>
      <section class="controls min0">
        <div class="slider-block">
          <div class="slider-head"><label for="water-rate">水回收率</label><output id="water-out" class="slider-value" for="water-rate"></output></div>
          <input id="water-rate" type="range" aria-describedby="water-help">
          <span id="water-help" class="caption muted">废水中可返回水箱的比例</span>
        </div>
        <div class="slider-block">
          <div class="slider-head"><label for="air-rate">空气再生率</label><output id="air-out" class="slider-value" for="air-rate"></output></div>
          <input id="air-rate" type="range" aria-describedby="air-help">
          <span id="air-help" class="caption muted">二氧化碳处理后的氧气当量</span>
        </div>
        <div class="slider-block">
          <div class="slider-head"><label for="food-stock">食物储备</label><output id="food-out" class="slider-value" for="food-stock"></output></div>
          <input id="food-stock" type="range">
        </div>
        <div class="slider-block">
          <div class="slider-head"><label for="spares">备用容量</label><output id="spares-out" class="slider-value" for="spares"></output></div>
          <input id="spares" type="range" aria-describedby="spares-help">
          <span id="spares-help" class="caption muted">并行设备可吸收效率下降</span>
        </div>
      </section>
      <div class="callout"><p id="decision">增加库存只延后耗尽；备用设备才改变故障后的损失率。</p></div>
    </aside>

    <section class="workspace min0">
      <figure class="panel panel--quiet flow-panel min0">
        <div class="panel-head">
          <h2>当日质量流</h2>
          <div id="event-note" class="event-note" aria-live="polite"></div>
        </div>
        <svg id="flow" role="img" aria-labelledby="flow-title flow-desc" viewBox="0 0 940 280" preserveAspectRatio="xMidYMid meet">
          <title id="flow-title">乘员生命保障质量流</title>
          <desc id="flow-desc">水和空气在乘员、废物与再生器之间循环，食物进入乘员，无法回收的部分流向损失。</desc>
        </svg>
        <figcaption class="flow-caption">
          <span>线宽表示每日质量流；空气按氧气当量记账。</span>
          <span class="legend-line"><span class="lg-water">水</span><span class="lg-air">空气</span><span class="lg-food">食物</span></span>
        </figcaption>
      </figure>

      <section class="panel ledger-panel min0" aria-labelledby="ledger-title">
        <div class="panel-head">
          <h2 id="ledger-title">质量账本</h2>
          <div class="summary" aria-live="polite">
            <span id="mission-badge" class="badge"></span>
            <span id="shortage-badge" class="badge"></span>
          </div>
        </div>
        <table class="ledger-table">
          <thead><tr><th>资源</th><th>每日流入</th><th>每日转回</th><th>航程末余额</th></tr></thead>
          <tbody id="ledger-body"></tbody>
        </table>
      </section>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
  Deck.init({ index: 14, total: 18 });

  Lec.mount({
    index: 14,
    kicker: `CLOSE THE LOOPS`,
    title: `空气、水和食物：补给，还是循环？`,
    take: `长期航行的关键不是无限储存，而是减少损失、处理废物并保持系统稳定。`
  });

  (function () {
    var K = Lec.K;
    var P = Lec.P;
    var one = K.math.one;
    var crew = K.math.four;
    var missionDays = P.divide(K.math.hundred, K.math.four);
    var initialWater = K.math.hundred;
    var initialOxygen = P.divide(K.math.hundred, K.math.two);
    var bases = {
      water: K.math.three,
      oxygen: K.math.one,
      food: K.math.one
    };
    var rng = new Math.seedrandom('page-14');
    var eventDay = Math.floor(rng() * K.math.ten) + K.math.ten;
    var eventTarget = rng() < K.math.half ? 'water' : 'air';

    function totalDemand(base) {
      return P.ratio(base, P.divide(one, crew));
    }
    function product(a, b) {
      if (b === K.math.zero) return K.math.zero;
      return P.ratio(a, P.divide(one, b));
    }
    function fmt(value) {
      return P.significant(value, K.math.three);
    }
    function kg(value) {
      return fmt(value) + ' kg';
    }
    function pct(value) {
      return fmt(product(value, K.math.hundred)) + '%';
    }

    var waterLevels = P.range(K.math.half, K.math.one, K.math.six);
    var airLevels = P.range(K.math.half, K.math.one, K.math.six);
    var foodLevels = P.range(P.divide(K.math.hundred, K.math.two), K.math.hundred, K.math.six);
    var spareLevels = P.range(K.math.zero, K.math.two, K.math.three);
    var controls = {
      water: document.getElementById('water-rate'),
      air: document.getElementById('air-rate'),
      food: document.getElementById('food-stock'),
      spares: document.getElementById('spares')
    };

    function setRange(el, values, index) {
      el.min = K.math.zero;
      el.max = values.length - K.math.one;
      el.step = K.math.one;
      el.value = index;
    }
    setRange(controls.water, waterLevels, K.math.three);
    setRange(controls.air, airLevels, K.math.one);
    setRange(controls.food, foodLevels, K.math.three);
    setRange(controls.spares, spareLevels, K.math.one);

    function stateFromControls() {
      return {
        waterRate: waterLevels[Number(controls.water.value)],
        airRate: airLevels[Number(controls.air.value)],
        foodStock: foodLevels[Number(controls.food.value)],
        spares: spareLevels[Number(controls.spares.value)]
      };
    }

    function simulate(s) {
      var waterNeed = totalDemand(bases.water);
      var oxygenNeed = totalDemand(bases.oxygen);
      var foodNeed = totalDemand(bases.food);
      var water = initialWater;
      var oxygen = initialOxygen;
      var food = s.foodStock;
      var cumulativeLoss = K.math.zero;
      var firstShortage = null;
      var remainingDays = K.math.zero;
      var finalRates = { water: s.waterRate, air: s.airRate };
      var days = P.range(K.math.one, missionDays, missionDays);

      days.forEach(function (dayValue) {
        var day = Math.round(dayValue);
        var protection = K.math.half + product(K.math.quarter, s.spares);
        var wr = day >= eventDay && eventTarget === 'water' ? product(s.waterRate, protection) : s.waterRate;
        var ar = day >= eventDay && eventTarget === 'air' ? product(s.airRate, protection) : s.airRate;
        wr = Math.min(one, wr);
        ar = Math.min(one, ar);
        var waterRecovered = product(waterNeed, wr);
        var oxygenRecovered = product(oxygenNeed, ar);
        var waterLoss = waterNeed - waterRecovered;
        var oxygenLoss = oxygenNeed - oxygenRecovered;
        water -= waterLoss;
        oxygen -= oxygenLoss;
        food -= foodNeed;
        cumulativeLoss += waterLoss + oxygenLoss + foodNeed;
        finalRates = { water: wr, air: ar };
        if (day === eventDay) {
          var waterDays = waterLoss > K.math.zero ? P.divide(Math.max(K.math.zero, water), waterLoss) : Infinity;
          var oxygenDays = oxygenLoss > K.math.zero ? P.divide(Math.max(K.math.zero, oxygen), oxygenLoss) : Infinity;
          var foodDays = P.divide(Math.max(K.math.zero, food), foodNeed);
          remainingDays = Math.min(waterDays, oxygenDays, foodDays);
        }
        if (!firstShortage && (water < K.math.zero || oxygen < K.math.zero || food < K.math.zero)) {
          var resource = food < K.math.zero ? '食物' : (oxygen < K.math.zero ? '氧气' : '饮用水');
          firstShortage = { day: day, resource: resource };
        }
      });

      return {
        needs: { water: waterNeed, oxygen: oxygenNeed, food: foodNeed },
        rates: finalRates,
        recovered: {
          water: product(waterNeed, finalRates.water),
          oxygen: product(oxygenNeed, finalRates.air)
        },
        end: { water: water, oxygen: oxygen, food: food },
        cumulativeLoss: cumulativeLoss,
        remainingDays: remainingDays,
        firstShortage: firstShortage
      };
    }

    function drawFlow(model) {
      var svg = d3.select('#flow');
      svg.selectAll('.drawn').remove();
      var maxFlow = Math.max(model.needs.water, model.needs.oxygen, model.needs.food);
      var width = d3.scaleLinear().domain([K.math.zero, maxFlow]).range([K.math.two, K.math.ten]);
      var nodes = [
        { id: 'water', label: '饮用水', sub: kg(model.needs.water) + '/日', x: 90, y: 45, w: 150 },
        { id: 'food', label: '食物储备', sub: kg(model.needs.food) + '/日', x: 90, y: 190, w: 150 },
        { id: 'crew', label: '乘员', sub: fmt(crew) + ' 人', x: 390, y: 105, w: 150, crew: true },
        { id: 'waste', label: '废水', sub: kg(model.needs.water) + '/日', x: 680, y: 25, w: 150 },
        { id: 'co2', label: '二氧化碳', sub: kg(model.needs.oxygen) + '/日', x: 680, y: 105, w: 150 },
        { id: 'regen', label: '再生器', sub: '处理后返回', x: 680, y: 190, w: 150 },
        { id: 'loss', label: '不可回收', sub: kg((model.needs.water - model.recovered.water) + (model.needs.oxygen - model.recovered.oxygen) + model.needs.food) + '/日', x: 865, y: 190, w: 70 }
      ];
      var links = [
        { d: 'M240,74 C310,74 320,120 390,132', v: model.needs.water, cls: 'water' },
        { d: 'M240,219 C315,219 320,170 390,160', v: model.needs.food, cls: 'food' },
        { d: 'M540,132 C600,112 620,54 680,54', v: model.needs.water, cls: 'water' },
        { d: 'M540,150 C600,150 620,134 680,134', v: model.needs.oxygen, cls: 'air' },
        { d: 'M755,83 L755,190', v: model.needs.water, cls: 'water' },
        { d: 'M780,163 L780,190', v: model.needs.oxygen, cls: 'air' },
        { d: 'M680,218 C540,255 315,25 240,52', v: model.recovered.water, cls: 'water' },
        { d: 'M680,232 C560,270 330,90 240,92', v: model.recovered.oxygen, cls: 'air' },
        { d: 'M830,219 L865,219', v: (model.needs.water - model.recovered.water) + (model.needs.oxygen - model.recovered.oxygen) + model.needs.food, cls: 'loss' }
      ];
      var defs = svg.append('defs').attr('class', 'drawn');
      defs.append('marker').attr('id', 'arrow14').attr('viewBox', '0 0 10 10').attr('refX', 9).attr('refY', 5).attr('markerWidth', 5).attr('markerHeight', 5).attr('orient', 'auto-start-reverse').append('path').attr('d', 'M 0 0 L 10 5 L 0 10 z');
      svg.append('g').attr('class', 'drawn').selectAll('path').data(links).join('path')
        .attr('class', function (d) { return 'flow ' + d.cls; })
        .attr('d', function (d) { return d.d; })
        .attr('stroke-width', function (d) { return width(d.v); })
        .attr('marker-end', 'url(#arrow14)');
      var ng = svg.append('g').attr('class', 'drawn').selectAll('g').data(nodes).join('g')
        .attr('transform', function (d) { return 'translate(' + d.x + ',' + d.y + ')'; });
      ng.append('rect').attr('class', function (d) { return d.crew ? 'node crew' : 'node'; })
        .attr('width', function (d) { return d.w; }).attr('height', 58).attr('rx', 8);
      ng.append('text').attr('x', 12).attr('y', 35).text(function (d) { return d.label; });
    }

    function update() {
      var s = stateFromControls();
      var model = simulate(s);
      document.getElementById('water-out').textContent = pct(s.waterRate);
      document.getElementById('air-out').textContent = pct(s.airRate);
      document.getElementById('food-out').textContent = kg(s.foodStock);
      document.getElementById('spares-out').textContent = fmt(s.spares) + ' 组';
      document.getElementById('event-note').textContent = '第 ' + fmt(eventDay) + ' 天：' + (eventTarget === 'water' ? '水回收' : '空气再生') + '效率下降';
      document.getElementById('mission-badge').textContent = '故障后余量 ' + fmt(model.remainingDays) + ' 日';
      var shortage = document.getElementById('shortage-badge');
      shortage.classList.toggle('is-danger', Boolean(model.firstShortage));
      shortage.textContent = model.firstShortage ? ('第 ' + fmt(model.firstShortage.day) + ' 天缺 ' + model.firstShortage.resource) : '资源覆盖全程';

      var dailyLoss = (model.needs.water - model.recovered.water) + (model.needs.oxygen - model.recovered.oxygen) + model.needs.food;
      var rows = [
        ['饮用水', kg(model.needs.water), kg(model.recovered.water), kg(model.end.water)],
        ['氧气', kg(model.needs.oxygen), kg(model.recovered.oxygen), kg(model.end.oxygen)],
        ['食物', kg(model.needs.food), kg(K.math.zero), kg(model.end.food)],
        ['废水', kg(model.needs.water), kg(model.recovered.water), kg(K.math.zero)],
        ['二氧化碳', kg(model.needs.oxygen), kg(model.recovered.oxygen), kg(K.math.zero)],
        ['不可回收损失', kg(dailyLoss), kg(K.math.zero), kg(model.cumulativeLoss)]
      ];
      d3.select('#ledger-body').selectAll('tr').data(rows).join('tr')
        .attr('class', function (d, i) { return i === rows.length - one ? 'loss-row' : null; })
        .selectAll('td').data(function (d) { return d; }).join('td').text(function (d) { return d; });

      document.getElementById('decision').textContent = s.spares < K.math.two
        ? '故障后循环率下降。增加库存只能延后耗尽。'
        : '备用设备接管故障。循环率恢复，但食物仍持续消耗。';
      drawFlow(model);
    }

    Object.keys(controls).forEach(function (key) {
      controls[key].addEventListener('input', update);
      controls[key].addEventListener('change', update);
    });
    update();
    Deck.onResize(update);
  }());
</script>
</body>
</html>
