<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .radiation-lab { position: relative; isolation: isolate; padding: var(--sp-5); }
  .sim-shell { position: relative; overflow: hidden; padding: 0; }
  .lec-header__inner,
  .lec-header__identity,
  .lec-header__heading { display: flex; min-width: 0; align-items: center; }
  .lec-header__inner { width: 100%; height: 100%; }
  .lec-header__identity { gap: var(--sp-3); }
  .lec-header__heading { gap: var(--sp-3); }
  .lec-header__index { font-size: var(--fs-h3); line-height: 1; }
  .lec-header__kicker { flex: 0 0 auto; }
  .lec-header__title { overflow: hidden; font-size: var(--fs-body-lg); line-height: var(--lh-heading); text-overflow: ellipsis; white-space: nowrap; }
  .field-wash { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at center, var(--accent-soft), transparent 62%); }
  .lab-top { position: absolute; z-index: 4; inset: var(--sp-4) var(--sp-4) auto; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(420px, .9fr); gap: var(--sp-4); align-items: start; }
  .layout-box { padding: var(--sp-3) var(--sp-4); }
  .prompt-line { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-2); }
  .choice-rail { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 82px; padding: 0 var(--sp-4); align-items: end; border-top: 1px solid var(--line); }
  .choice-rail::before { content: ""; position: absolute; left: 12%; right: 12%; top: 29px; height: 2px; background: var(--line-strong); }
  .choice { position: relative; height: 30px; text-align: center; color: var(--text-muted); font-size: var(--fs-label); line-height: 1.4; }
  .choice::before { content: ""; position: absolute; top: -18px; left: 50%; width: 10px; height: 10px; border: 2px solid var(--line-strong); border-radius: var(--radius-pill); background: var(--surface-1); transform: translate(-50%, -50%); }
  .shield-token { position: absolute; z-index: 2; top: 8px; left: calc(16.666% - 28px); display: grid; place-items: center; width: 56px; height: 42px; border: 2px solid var(--accent); border-radius: var(--radius-sm); background: var(--surface-raised); color: var(--accent-strong); cursor: grab; user-select: none; transition: left .18s ease; }
  .shield-token:active { cursor: grabbing; }
  .shield-token[data-layout="1"] { left: calc(50% - 28px); }
  .shield-token[data-layout="2"] { left: calc(83.333% - 28px); }
  .shield-token:focus-visible { outline: 4px solid var(--focus); outline-offset: 4px; }
  .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2); }
  .metric { min-height: 104px; padding: var(--sp-3); box-shadow: none; }
  .metric .readout-value { font-size: var(--fs-h3); }
  .metric .readout-unit { font-size: var(--fs-label); }
  .zone-tag { position: absolute; z-index: 3; top: 43%; padding: var(--sp-1) var(--sp-3); border: 1px solid var(--line-strong); border-radius: var(--radius-pill); background: var(--surface-1); color: var(--text); font-size: var(--fs-label); font-weight: 700; pointer-events: none; }
  .zone-tag.sleep { left: 27%; }
  .zone-tag.work { right: 27%; }
  .lab-bottom { position: absolute; z-index: 5; left: var(--sp-4); right: var(--sp-4); bottom: var(--sp-4); display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(440px, .75fr); gap: var(--sp-4); align-items: stretch; }
  .model-note { align-self: end; padding: var(--sp-3) var(--sp-4); background: var(--surface-1); }
  .model-note p { font-size: var(--fs-body); line-height: var(--lh-body); }
  .task-box { padding: var(--sp-3); gap: var(--sp-2); }
  .task-box textarea { min-height: 72px; height: 72px; resize: none; }
  .task-actions { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-2); }
  .status { min-height: 29px; color: var(--text-muted); font-size: var(--fs-body); line-height: var(--lh-body); }
  @media (prefers-reduced-motion: reduce) { .shield-token { transition: none; } }
</style>
</head>
<body data-page="15" data-total="18">
<div id="stage">
  <main class="canvas-full radiation-lab" id="radiationLab">
    <section class="sim-shell panel panel--quiet no-pan" aria-label="屏蔽布局与粒子穿透模拟">
      <canvas id="particleField" class="cv-fill" aria-hidden="true"></canvas>
      <div class="field-wash" aria-hidden="true"></div>

      <div class="lab-top">
        <div class="layout-box panel panel--quiet min0">
          <div class="prompt-line">
            <p>拖动屏蔽块选择布局，再运行同一批粒子。</p>
            <span class="badge">固定质量 <strong id="massValue" class="data accent"></strong></span>
          </div>
          <div class="choice-rail no-pan" id="choiceRail" aria-label="屏蔽布局轨道">
            <div class="choice">全舱薄层</div>
            <div class="choice">睡眠区厚层</div>
            <div class="choice">工作区厚层</div>
            <div class="shield-token" id="shieldToken" role="slider" tabindex="0" aria-label="屏蔽布局" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0" aria-valuetext="全舱薄层" data-layout="0">屏蔽块</div>
          </div>
        </div>

        <div class="metrics min0" aria-label="相对暴露读数">
          <div class="readout metric">
            <span class="readout-label">睡眠区</span>
            <strong class="readout-value" id="sleepValue">—</strong>
            <span class="readout-unit">相对暴露</span>
          </div>
          <div class="readout metric">
            <span class="readout-label">工作区</span>
            <strong class="readout-value" id="workValue">—</strong>
            <span class="readout-unit">相对暴露</span>
          </div>
          <div class="readout metric">
            <span class="readout-label">全舱合计</span>
            <strong class="readout-value" id="totalValue">—</strong>
            <span class="readout-unit">相对暴露</span>
          </div>
        </div>
      </div>

      <span class="zone-tag sleep">睡眠区</span>
      <span class="zone-tag work">工作区</span>

      <div class="lab-bottom">
        <div class="model-note callout min0">
          <p><strong>看穿透与去向：</strong>短线表示被挡下，长线表示穿透。读数只比较本模型中的相对暴露，不是医学剂量。</p>
        </div>
        <form class="controls task-box min0" id="strategyForm">
          <label for="reason">选择理由</label>
          <textarea id="reason" placeholder="例如：优先保护睡眠区，因为……"></textarea>
          <div class="task-actions">
            <button type="submit" class="primary" id="runButton">运行同批粒子</button>
            <button type="button" id="resetButton">重置</button>
          </div>
          <p class="status" id="status" aria-live="polite">先选布局，并写下取舍理由。</p>
        </form>
      </div>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/pixi.min.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
Deck.init({ index: 15, total: 18 });
Lec.mount({
  index: 15,
  kicker: `RADIATION TRADE-OFF`,
  title: `屏蔽越厚越安全吗？答案还要问“多重、放哪里”`,
  take: `辐射防护是暴露、材料、布局和发射质量之间的权衡，不是一个简单开关。`
});

(function () {
  'use strict';
  var lab = document.getElementById('radiationLab');
  var shell = lab.querySelector('.sim-shell');
  var canvas = document.getElementById('particleField');
  var rail = document.getElementById('choiceRail');
  var token = document.getElementById('shieldToken');
  var form = document.getElementById('strategyForm');
  var reason = document.getElementById('reason');
  var status = document.getElementById('status');
  var sleepValue = document.getElementById('sleepValue');
  var workValue = document.getElementById('workValue');
  var totalValue = document.getElementById('totalValue');
  var resetButton = document.getElementById('resetButton');
  var labels = ['全舱薄层', '睡眠区厚层', '工作区厚层'];
  var state;
  var stopLoop = null;

  function cssHex(name) {
    var rgb = Deck.rgb(name);
    return (rgb[0] << 16) | (rgb[1] << 8) | rgb[2];
  }

  var app = new PIXI.Application({
    view: canvas,
    width: shell.clientWidth,
    height: shell.clientHeight,
    backgroundAlpha: 0,
    antialias: true,
    autoStart: false,
    resolution: 1
  });
  app.stop();
  var scene = new PIXI.Graphics();
  var particleLayer = new PIXI.Container();
  app.stage.addChild(scene, particleLayer);

  var radius = Lec.P.divide(Lec.K.human.representativeHeight, Lec.K.math.ten);
  var volume = Lec.P.sphereVolume(radius);
  var materialDensity = Lec.K.units.kilogramsPerTonne;
  var shieldMass = Lec.P.divide(volume, Lec.P.divide(Lec.K.math.one, materialDensity));
  document.getElementById('massValue').textContent = Lec.P.significant(shieldMass, Lec.K.math.three) + ' kg';

  function freshState() {
    var rng = new Math.seedrandom('page-15');
    var particles = [];
    var count = Lec.K.math.hundred;
    for (var i = 0; i < count; i += Lec.K.math.one) {
      var side = Math.floor(rng() * Lec.K.math.four);
      var target = rng() < Lec.K.math.half ? 0 : 1;
      particles.push({
        side: side,
        target: target,
        lane: rng(),
        energy: Lec.P.lerp(Lec.K.math.quarter, Lec.K.math.one, rng()),
        threshold: Lec.P.lerp(Lec.K.math.quarter, Lec.P.divide(Lec.K.math.three, Lec.K.math.four), rng()),
        jitter: rng(),
        penetrated: false,
        endRatio: Lec.K.math.one
      });
    }
    return { layout: 0, phase: 'ready', progress: 0, particles: particles, metrics: null, trace: [] };
  }

  function dimensions() {
    var w = app.renderer.width;
    var h = app.renderer.height;
    return { w: w, h: h, hullX: w * .14, hullY: h * .25, hullW: w * .72, hullH: h * .43 };
  }

  function endpoints(p, d) {
    var tx = d.hullX + d.hullW * (p.target === 0 ? .3 : .7);
    var ty = d.hullY + d.hullH * (.28 + p.lane * .44);
    if (p.side === 0) return { sx: 0, sy: d.hullY + p.lane * d.hullH, tx: tx, ty: ty };
    if (p.side === 1) return { sx: d.w, sy: d.hullY + p.lane * d.hullH, tx: tx, ty: ty };
    if (p.side === 2) return { sx: d.hullX + p.lane * d.hullW, sy: d.hullY - d.h * .2, tx: tx, ty: ty };
    return { sx: d.hullX + p.lane * d.hullW, sy: d.h, tx: tx, ty: ty };
  }

  function compute() {
    var sleepHits = 0;
    var workHits = 0;
    var sleepTotal = 0;
    var workTotal = 0;
    state.particles.forEach(function (p) {
      var loss;
      if (state.layout === 0) loss = Lec.P.divide(Lec.K.math.three, Lec.K.math.eight);
      else if ((state.layout === 1 && p.target === 0) || (state.layout === 2 && p.target === 1)) loss = Lec.P.divide(Lec.K.math.three, Lec.K.math.four);
      else loss = Lec.P.divide(Lec.K.math.one, Lec.K.math.ten);
      var spread = Lec.P.lerp(Lec.P.divide(Lec.K.math.three, Lec.K.math.four), Lec.K.math.one, p.jitter);
      var absorbed = Lec.P.scaleValue(loss, Lec.K.math.one, spread);
      var residual = Lec.P.scaleValue(p.energy, Lec.K.math.one, Lec.K.math.one - absorbed);
      p.penetrated = residual > p.threshold;
      p.endRatio = p.penetrated ? Lec.K.math.one : Lec.P.lerp(Lec.K.math.quarter, Lec.P.divide(Lec.K.math.three, Lec.K.math.four), p.jitter);
      if (p.target === 0) {
        sleepTotal += Lec.K.math.one;
        if (p.penetrated) sleepHits += Lec.K.math.one;
      } else {
        workTotal += Lec.K.math.one;
        if (p.penetrated) workHits += Lec.K.math.one;
      }
    });
    var sleep = Lec.P.ratio(sleepHits, sleepTotal);
    var work = Lec.P.ratio(workHits, workTotal);
    var total = Lec.P.ratio(sleepHits + workHits, sleepTotal + workTotal);
    state.metrics = { sleep: sleep, work: work, total: total };
  }

  function draw(progress) {
    var d = dimensions();
    var line = cssHex('--line');
    var strong = cssHex('--line-strong');
    var surface = cssHex('--surface-2');
    var accent = cssHex('--accent');
    var positive = cssHex('--positive');
    var warning = cssHex('--warning');
    scene.clear();
    scene.lineStyle(2, strong, 1);
    scene.beginFill(surface, .78);
    scene.drawRoundedRect(d.hullX, d.hullY, d.hullW, d.hullH, 22);
    scene.endFill();
    scene.lineStyle(1, line, 1);
    scene.moveTo(d.hullX + d.hullW * .5, d.hullY + 26);
    scene.lineTo(d.hullX + d.hullW * .5, d.hullY + d.hullH - 26);

    scene.lineStyle(state.layout === 0 ? 9 : 2, state.layout === 0 ? accent : strong, state.layout === 0 ? .75 : 1);
    scene.drawRoundedRect(d.hullX, d.hullY, d.hullW, d.hullH, 22);
    if (state.layout > 0) {
      var zx = d.hullX + d.hullW * (state.layout === 1 ? .08 : .55);
      scene.lineStyle(22, accent, .82);
      scene.drawRoundedRect(zx, d.hullY + d.hullH * .18, d.hullW * .37, d.hullH * .64, 18);
    }

    particleLayer.removeChildren().forEach(function (child) { child.destroy(); });
    state.particles.forEach(function (p) {
      var e = endpoints(p, d);
      var activeProgress = Math.min(progress, p.endRatio);
      var x = Lec.P.lerp(e.sx, e.tx, activeProgress);
      var y = Lec.P.lerp(e.sy, e.ty, activeProgress);
      var trailStart = Math.max(0, activeProgress - .035);
      var x0 = Lec.P.lerp(e.sx, e.tx, trailStart);
      var y0 = Lec.P.lerp(e.sy, e.ty, trailStart);
      var g = new PIXI.Graphics();
      g.lineStyle(p.penetrated ? 2 : 3, p.penetrated ? warning : positive, p.penetrated ? .82 : .7);
      g.moveTo(x0, y0);
      g.lineTo(x, y);
      g.beginFill(p.penetrated ? warning : positive, .92);
      g.drawCircle(x, y, p.penetrated ? 2.8 : 3.8);
      g.endFill();
      particleLayer.addChild(g);
    });
    app.renderer.render(app.stage);
  }

  function setLayout(next) {
    state.layout = Deck.clamp(next, 0, 2);
    token.dataset.layout = String(state.layout);
    token.setAttribute('aria-valuenow', String(state.layout));
    token.setAttribute('aria-valuetext', labels[state.layout]);
    state.phase = 'ready';
    state.progress = 0;
    state.metrics = null;
    sleepValue.textContent = '—';
    workValue.textContent = '—';
    totalValue.textContent = '—';
    status.textContent = '已选择“' + labels[state.layout] + '”，请写下理由。';
    compute();
    draw(0);
    lab.dispatchEvent(new CustomEvent('game-progress', { bubbles: true, detail: { state: getState(), action: 'layout', metrics: null } }));
  }

  function pointerLayout(event) {
    var point = Deck.pt(rail, event);
    return Deck.clamp(Math.floor(Lec.P.divide(point.x, rail.clientWidth) * Lec.K.math.three), 0, 2);
  }

  token.addEventListener('pointerdown', function (event) {
    token.setPointerCapture(event.pointerId);
    setLayout(pointerLayout(event));
  });
  token.addEventListener('pointermove', function (event) {
    if (token.hasPointerCapture(event.pointerId)) setLayout(pointerLayout(event));
  });
  token.addEventListener('pointerup', function (event) {
    if (token.hasPointerCapture(event.pointerId)) token.releasePointerCapture(event.pointerId);
  });
  token.addEventListener('keydown', function (event) {
    if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') { event.preventDefault(); setLayout(state.layout - 1); }
    if (event.key === 'ArrowRight' || event.key === 'ArrowUp') { event.preventDefault(); setLayout(state.layout + 1); }
    if (event.key === 'Escape') { event.preventDefault(); reset(); }
  });

  function showMetrics() {
    var scale = Lec.K.math.percentScale;
    sleepValue.textContent = Lec.P.significant(Lec.P.scaleValue(state.metrics.sleep, Lec.K.math.one, scale), Lec.K.math.three) + '%';
    workValue.textContent = Lec.P.significant(Lec.P.scaleValue(state.metrics.work, Lec.K.math.one, scale), Lec.K.math.three) + '%';
    totalValue.textContent = Lec.P.significant(Lec.P.scaleValue(state.metrics.total, Lec.K.math.one, scale), Lec.K.math.three) + '%';
    status.textContent = state.layout === 0 ? '薄层分散风险，但两个区域都仍有穿透。' : '厚层压低一处暴露，另一处承担更多风险。';
  }

  function start() {
    if (!reason.value.trim()) {
      status.textContent = '请先写下选择理由，再运行比较。';
      reason.focus();
      return;
    }
    if (stopLoop) stopLoop();
    compute();
    state.phase = 'running';
    state.progress = 0;
    state.trace.push({ layout: state.layout, reason: reason.value.trim() });
    lab.dispatchEvent(new CustomEvent('game-start', { bubbles: true, detail: { state: getState() } }));
    if (Deck.reduced()) {
      state.progress = Lec.K.math.one;
      state.phase = 'complete';
      draw(state.progress);
      showMetrics();
      complete();
      return;
    }
    var elapsed = 0;
    var duration = Lec.K.math.three;
    stopLoop = Deck.loop(function (t, dt) {
      elapsed += dt;
      state.progress = Deck.clamp(Lec.P.divide(elapsed, duration), 0, 1);
      draw(state.progress);
      if (state.progress >= Lec.K.math.one) {
        stopLoop();
        stopLoop = null;
        state.phase = 'complete';
        showMetrics();
        complete();
      }
    }, { still: Lec.K.math.one });
  }

  function complete() {
    lab.dispatchEvent(new CustomEvent('game-complete', { bubbles: true, detail: { score: state.metrics.total, metrics: state.metrics, trace: state.trace.slice() } }));
  }

  function reset() {
    if (stopLoop) { stopLoop(); stopLoop = null; }
    state = freshState();
    reason.value = '';
    token.dataset.layout = '0';
    token.setAttribute('aria-valuenow', '0');
    token.setAttribute('aria-valuetext', labels[0]);
    sleepValue.textContent = '—';
    workValue.textContent = '—';
    totalValue.textContent = '—';
    status.textContent = '先选布局，并写下取舍理由。';
    compute();
    draw(0);
    lab.dispatchEvent(new CustomEvent('game-reset', { bubbles: true, detail: { state: getState() } }));
  }

  function getState() {
    return JSON.parse(JSON.stringify({ layout: state.layout, phase: state.phase, progress: state.progress, metrics: state.metrics, trace: state.trace }));
  }

  form.addEventListener('submit', function (event) { event.preventDefault(); start(); });
  resetButton.addEventListener('click', reset);
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && document.activeElement !== token) reset();
  });
  Deck.onResize(function () {
    app.renderer.resize(shell.clientWidth, shell.clientHeight);
    draw(state ? state.progress : 0);
  });
  window.radiationGame = { start: start, reset: reset, getState: getState };
  reset();
}());
</script>
</body>
</html>
