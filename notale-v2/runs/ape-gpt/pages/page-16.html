<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  mars-delay-game { display:grid; }
  .lec-header__inner,
  .lec-header__identity,
  .lec-header__heading { display:flex; min-width:0; align-items:center; }
  .lec-header__inner { width:100%; }
  .lec-header__identity { gap:var(--sp-3); }
  .lec-header__heading { gap:var(--sp-3); }
  .lec-header__index { flex:0 0 auto; font-family:var(--font-mono); font-size:var(--fs-label); line-height:1.35; }
  .lec-header__kicker { flex:0 0 auto; color:var(--text-muted); font-size:var(--fs-label); line-height:1.35; }
  .lec-header__title { min-width:0; font-size:var(--fs-h3); line-height:var(--lh-heading); white-space:nowrap; }
</style>
</head>
<body data-page="16" data-total="18">
<div id="stage">
  <mars-delay-game class="split-tb" aria-label="地火延迟协作控制游戏"></mars-delay-game>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function () {
  'use strict';

  class MarsDelayGame extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      this.shadowRoot.innerHTML = '<slot></slot>';
      this.stopLoop = null;
      this.lastTs = null;
      this.trace = [];
    }

    connectedCallback() {
      this.innerHTML = `
        <style>
          :host { width:100%; height:100%; min-width:0; min-height:0; }
          * { box-sizing:border-box; }
          .mission, .decision { min-width:0; min-height:0; border:1px solid var(--line); border-radius:var(--radius-md); background:linear-gradient(145deg, var(--surface-3), var(--surface-1)); box-shadow:0 14px 34px var(--shadow-color); overflow:hidden; }
          .mission { position:relative; display:grid; grid-template-rows:auto minmax(0, 1fr) auto; }
          .mission-head { display:flex; align-items:center; justify-content:space-between; gap:var(--sp-4); padding:var(--sp-3) var(--sp-4); border-bottom:1px solid var(--line); }
          .eyebrow, label, .queue-title, .metric-label { color:var(--text-muted); font-size:var(--fs-label); font-weight:650; line-height:1.4; }
          .delay { color:var(--accent-strong); font-family:var(--font-mono); font-size:var(--fs-h3); font-weight:720; line-height:1.2; white-space:nowrap; }
          .world { position:relative; min-width:0; min-height:0; overflow:hidden; background:var(--surface-1); }
          .transit-band { position:absolute; left:14%; right:12%; top:32%; bottom:22%; border-block:1px solid var(--line); background:var(--accent-soft); }
          canvas { position:absolute; inset:0; width:100%; height:100%; }
          .place { position:absolute; top:var(--sp-3); z-index:2; display:flex; flex-direction:column; gap:var(--sp-1); pointer-events:none; }
          .place.earth { left:var(--sp-4); }
          .place.mars { right:var(--sp-4); align-items:flex-end; }
          .place strong { color:var(--text); font-size:var(--fs-body); line-height:1.35; }
          .place span { color:var(--text-muted); font-size:var(--fs-label); line-height:1.4; }
          .phases { position:absolute; left:14%; right:12%; bottom:var(--sp-3); z-index:2; display:flex; justify-content:space-between; pointer-events:none; }
          .phases span { display:inline-flex; min-height:30px; padding-inline:var(--sp-2); align-items:center; border:1px solid var(--line-strong); border-radius:var(--radius-pill); background:var(--surface-2); color:var(--text-muted); font-size:var(--fs-label); font-weight:680; line-height:1.2; }
          .queue { display:grid; grid-template-columns:auto minmax(0, 1fr); gap:var(--sp-3); align-items:center; min-height:calc(var(--sp-8) + var(--sp-2)); padding:var(--sp-2) var(--sp-4); border-top:1px solid var(--line); background:var(--surface-2); }
          .queue-items { display:flex; gap:var(--sp-2); min-width:0; overflow:hidden; }
          .packet { display:inline-flex; min-width:0; min-height:34px; padding-inline:var(--sp-2); align-items:center; gap:var(--sp-2); border:1px solid var(--line-strong); border-radius:var(--radius-pill); color:var(--text); background:var(--surface-1); font-size:var(--fs-label); line-height:1.35; white-space:nowrap; }
          .packet b { color:var(--accent-strong); font-family:var(--font-mono); font-size:var(--fs-tick); }
          .empty { color:var(--text-faint); font-size:var(--fs-body); line-height:1.5; }
          .decision { display:grid; grid-template-columns:minmax(0, .9fr) minmax(0, 1.1fr); gap:var(--sp-5); padding:var(--sp-4); }
          .control-side, .meaning { min-width:0; min-height:0; }
          .control-side { display:flex; flex-direction:column; gap:var(--sp-3); }
          .select-row { display:grid; grid-template-columns:minmax(160px, .58fr) minmax(0, 1.42fr); gap:var(--sp-3); align-items:center; }
          select, button { min-height:var(--control-h); border:1px solid var(--line-strong); border-radius:var(--radius-sm); background:var(--surface-2); color:var(--text); font:inherit; font-size:var(--fs-label); }
          select { width:100%; padding-inline:var(--sp-3); }
          .commands { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:var(--sp-2); }
          button { display:inline-flex; padding-inline:var(--sp-3); align-items:center; justify-content:center; font-weight:700; line-height:1.35; cursor:pointer; }
          button:hover { border-color:var(--accent); background:var(--surface-raised); }
          button.primary { border-color:var(--accent); background:var(--accent); color:var(--accent-ink); }
          button:disabled { opacity:.48; cursor:not-allowed; }
          select:focus-visible, button:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
          .status { min-height:58px; padding:var(--sp-3); border-inline-start:5px solid var(--accent); border-radius:0 var(--radius-md) var(--radius-md) 0; background:var(--accent-soft); color:var(--text); font-size:var(--fs-body); line-height:var(--lh-copy); }
          .meaning { display:flex; flex-direction:column; justify-content:center; gap:var(--sp-3); padding-inline-start:var(--sp-5); border-inline-start:1px solid var(--line); }
          .mode-name { color:var(--accent-strong); font-size:var(--fs-h2); font-weight:720; line-height:var(--lh-heading); }
          .meaning p { margin:0; color:var(--text); font-size:var(--fs-body); line-height:var(--lh-copy); }
          .rule { display:grid; grid-template-columns:auto minmax(0, 1fr); gap:var(--sp-3); align-items:start; }
          .rule .badge { display:inline-flex; min-height:30px; padding-inline:var(--sp-2); align-items:center; border:1px solid var(--line-strong); border-radius:var(--radius-pill); background:var(--surface-2); color:var(--text-muted); font-size:var(--fs-label); font-weight:680; line-height:1.2; white-space:nowrap; }
          .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
          @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; } }
        </style>
        <section class="mission min0" aria-labelledby="mission-label">
          <div class="mission-head">
            <span class="eyebrow" id="mission-label">地球 → 火星 · 指令按抵达顺序执行</span>
            <span class="delay" id="delay"></span>
          </div>
          <div class="world">
            <div class="transit-band" aria-hidden="true"></div>
            <canvas role="img" aria-label="指令从地球传播到火星，火星车在障碍前按抵达顺序执行。"></canvas>
            <div class="place earth"><strong>地面控制中心</strong><span id="clock"></span></div>
            <div class="place mars"><strong>火星车</strong><span id="rover-state">等待指令</span></div>
            <div class="phases" aria-hidden="true"><span>发送</span><span>传播</span><span>执行</span></div>
          </div>
          <div class="queue" aria-label="传播中的消息队列">
            <span class="queue-title">传播队列</span>
            <div class="queue-items" id="queue"></div>
          </div>
        </section>
        <section class="decision min0">
          <div class="control-side">
            <div class="select-row">
              <label for="scenario">情境与控制方式</label>
              <select id="scenario">
                <option value="near-remote">近距离 · 逐步遥控</option>
                <option value="typical-remote" selected>典型距离 · 逐步遥控</option>
                <option value="far-remote">远距离 · 逐步遥控</option>
                <option value="near-goal">近距离 · 目标授权</option>
                <option value="typical-goal">典型距离 · 目标授权</option>
                <option value="far-goal">远距离 · 目标授权</option>
              </select>
            </div>
            <div class="commands" aria-label="火星车指令">
              <button class="primary" data-command="forward">前进</button>
              <button data-command="stop">停止</button>
              <button data-command="detour">绕行</button>
            </div>
            <div class="status" id="status" role="status" aria-live="polite">依次发送“前进”和“停止”，观察两条指令何时抵达。</div>
          </div>
          <div class="meaning">
            <div>
              <div class="metric-label">当前协作结构</div>
              <div class="mode-name" id="mode-name">逐步遥控</div>
            </div>
            <div class="rule"><span class="badge">地面</span><p id="ground-role">发送每一步动作，但无法即时纠错。</p></div>
            <div class="rule"><span class="badge">火星车</span><p id="rover-role">只服从到达的指令，即使新指令已在路上。</p></div>
            <p class="muted">延迟把协作从即时确认，推向预先约定、自治与信任。</p>
          </div>
        </section>`;

      this.canvas = this.querySelector('canvas');
      this.ctx = Deck.fit(this.canvas);
      this.offResize = Deck.onResize(() => {
        this.ctx = Deck.fit(this.canvas);
        this.draw();
      });
      this.querySelector('#scenario').addEventListener('change', (event) => {
        this.reset(event.target.value);
      });
      this.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => this.handleButton(button.dataset.command));
      });
      this.reset('typical-remote');
      this.stopLoop = Deck.loop((ts, dt) => this.tick(ts, dt), { still: 1 });
    }

    disconnectedCallback() {
      if (this.stopLoop) this.stopLoop();
      if (this.offResize) this.offResize();
    }

    scenarioData(key) {
      const K = Lec.K;
      const nearDelay = K.spacecraft.marsMinimumOneWayDelay;
      const farDelay = K.spacecraft.marsMaximumOneWayDelay;
      const typicalDelay = Lec.P.lerp(nearDelay, farDelay, K.math.half);
      const delaySeed = key === 'near' ? nearDelay : key === 'far' ? farDelay : typicalDelay;
      const distance = Lec.P.scaleValue(delaySeed, K.math.one, K.physics.speedOfLight);
      return { distance, delay: Lec.P.lightTravelTime(distance) };
    }

    freshState(value) {
      const parts = value.split('-');
      const data = this.scenarioData(parts[0]);
      return {
        scenario: parts[0], mode: parts[1], distance: data.distance, delay: data.delay,
        time: Lec.K.math.zero, roverX: 0.16, roverLane: 0, velocity: 0,
        queue: [], executed: [], lastSent: null, conflicts: Lec.K.math.zero,
        activeGoal: false, complete: false, failed: false, started: false
      };
    }

    start() {
      if (!this.state.started) {
        this.state.started = true;
        this.dispatchEvent(new CustomEvent('game-start', { bubbles:true, composed:true }));
      }
    }

    reset(value) {
      const select = this.querySelector('#scenario');
      const selected = value || (select ? select.value : 'typical-remote');
      this.state = this.freshState(selected);
      this.trace = [];
      if (select) select.value = selected;
      this.updateMode();
      this.render();
      this.dispatchEvent(new CustomEvent('game-reset', { bubbles:true, composed:true }));
    }

    getState() {
      return JSON.parse(JSON.stringify(this.state));
    }

    handleButton(command) {
      if (this.state.complete || this.state.failed) {
        this.reset(this.state.scenario + '-' + this.state.mode);
        return;
      }
      this.start();
      if (this.state.mode === 'goal') {
        if (command !== 'forward') return;
        this.send('goal');
      } else {
        this.send(command);
      }
      if (Deck.reduced()) {
        const finalArrival = this.state.queue[this.state.queue.length - Lec.K.math.one].arrival;
        this.state.time = finalArrival + Lec.K.math.one;
        this.processArrivals();
        if (this.state.mode === 'goal') {
          this.state.roverLane = Lec.K.math.one;
          this.state.roverX = 0.92;
          this.finish(true);
        }
      }
      this.render();
    }

    send(command) {
      const s = this.state;
      const conflict = s.lastSent && s.lastSent !== command && (s.lastSent === 'stop' || command === 'stop');
      if (conflict) s.conflicts += Lec.K.math.one;
      const packet = { command, sent: s.time, arrival: s.time + s.delay };
      s.queue.push(packet);
      s.lastSent = command;
      this.trace.push({ type:'sent', command, time:s.time, arrival:packet.arrival });
      this.dispatchEvent(new CustomEvent('game-progress', {
        bubbles:true, composed:true,
        detail:{ state:this.getState(), action:command, metrics:{ conflicts:s.conflicts, delay:s.delay } }
      }));
    }

    tick(ts, dt) {
      if (!this.state || Deck.reduced()) { this.draw(); return; }
      const seconds = dt > 0 ? dt / Lec.K.math.thousand : Lec.K.math.zero;
      if (this.state.started && !this.state.complete && !this.state.failed) {
        this.state.time += seconds * 210;
        this.processArrivals();
        this.moveRover(seconds * 210);
        this.render();
      }
      this.draw();
    }

    processArrivals() {
      const arrived = this.state.queue.filter(packet => packet.arrival <= this.state.time);
      this.state.queue = this.state.queue.filter(packet => packet.arrival > this.state.time);
      arrived.sort((a, b) => a.arrival - b.arrival);
      arrived.forEach(packet => this.execute(packet));
    }

    execute(packet) {
      const s = this.state;
      s.executed.push(packet.command);
      if (s.executed.length > Lec.K.math.three) s.executed.shift();
      if (packet.command === 'forward') { s.velocity = 0.0008; s.roverLane = Lec.K.math.zero; }
      if (packet.command === 'stop') s.velocity = Lec.K.math.zero;
      if (packet.command === 'detour') { s.velocity = 0.0007; s.roverLane = Lec.K.math.one; }
      if (packet.command === 'goal') { s.activeGoal = true; s.velocity = 0.0008; }
      this.trace.push({ type:'executed', command:packet.command, time:s.time });
    }

    moveRover(simSeconds) {
      const s = this.state;
      if (s.activeGoal && (s.roverX > 0.55 || s.roverX + s.velocity * simSeconds > 0.55)) s.roverLane = Lec.K.math.one;
      s.roverX += s.velocity * simSeconds;
      if (s.roverLane === Lec.K.math.zero && s.roverX >= 0.68) {
        s.roverX = 0.68; s.velocity = Lec.K.math.zero; this.finish(false);
      } else if (s.roverX >= 0.9) {
        s.roverX = 0.9; s.velocity = Lec.K.math.zero; this.finish(true);
      }
    }

    finish(success) {
      if (this.state.complete || this.state.failed) return;
      this.state.complete = success;
      this.state.failed = !success;
      this.dispatchEvent(new CustomEvent('game-complete', {
        bubbles:true, composed:true,
        detail:{ score:success ? Lec.K.math.one : Lec.K.math.zero,
          metrics:{ conflicts:this.state.conflicts, delay:this.state.delay }, trace:this.trace.slice() }
      }));
    }

    commandName(command) {
      return { forward:'前进', stop:'停止', detour:'绕行', goal:'抵达目标' }[command];
    }

    updateMode() {
      const goal = this.state.mode === 'goal';
      const buttons = this.querySelectorAll('button');
      buttons[0].textContent = goal ? '发送目标' : '前进';
      buttons[1].textContent = '停止';
      buttons[2].textContent = '绕行';
      buttons[1].disabled = goal;
      buttons[2].disabled = goal;
      this.querySelector('#mode-name').textContent = goal ? '目标授权 · 决策留在现场' : '逐步遥控 · 反馈晚于行动';
      this.querySelector('#ground-role').textContent = goal ? '说明目标和边界，不安排每一步动作。' : '发送每一步动作，但无法即时纠错。';
      this.querySelector('#rover-role').textContent = goal ? '在边界内自行绕障，遇到异常再上报。' : '只服从到达的指令，即使新指令已在路上。';
    }

    render() {
      if (!this.state) return;
      const s = this.state;
      const minutes = Lec.P.divide(s.delay, Lec.K.units.secondsPerMinute);
      const distanceKm = Lec.P.divide(s.distance, Lec.K.units.metresPerKilometre);
      this.querySelector('#delay').textContent = `单程 ${Lec.P.significant(minutes, Lec.K.math.three)} 分钟`;
      this.querySelector('#delay').title = `代表距离 ${Lec.P.significant(distanceKm, Lec.K.math.three)} 千米`;
      const elapsedMinutes = Lec.P.divide(s.time, Lec.K.units.secondsPerMinute);
      this.querySelector('#clock').textContent = `任务时钟 ${Lec.P.significant(elapsedMinutes, Lec.K.math.three)} 分钟`;
      const queue = this.querySelector('#queue');
      const visible = s.queue.slice(-Lec.K.math.three);
      queue.innerHTML = visible.length ? visible.map(packet => {
        const left = Math.max(Lec.K.math.zero, packet.arrival - s.time);
        const leftMin = Lec.P.divide(left, Lec.K.units.secondsPerMinute);
        return `<span class="packet"><span>${this.commandName(packet.command)}</span><b>${Lec.P.significant(leftMin, Lec.K.math.two)} 分</b></span>`;
      }).join('') : '<span class="empty">目前没有传播中的指令</span>';

      const roverState = this.querySelector('#rover-state');
      roverState.textContent = s.failed ? '撞上障碍，任务中止' : s.complete ? '已抵达目标' : s.activeGoal ? '按目标自主绕行' : s.velocity > 0 ? '正在执行' : '等待指令';
      const status = this.querySelector('#status');
      if (s.failed) status.textContent = '停止指令仍在传播时，火星车已经抵达障碍。按任一指令重新开始。';
      else if (s.complete) status.textContent = s.mode === 'goal' ? '目标只发送一次，绕障决策在火星本地完成。' : '任务完成，但每一步仍要等待地面指令抵达。';
      else if (s.queue.length && s.conflicts > 0) status.textContent = `互相冲突的指令都在路上；火星车仍将按抵达顺序执行。`;
      else if (s.queue.length) status.textContent = '指令已经发出，但火星车还不知道。队列中的时间正在减少。';
      else if (s.conflicts > 0 && s.executed.length) status.textContent = `抵达顺序：${s.executed.map(command => this.commandName(command)).join(' → ')}。旧指令不会被后来发送的指令撤回。`;
      else status.textContent = s.mode === 'goal' ? '发送“抵达目标”，观察火星车如何在本地处理障碍。' : '依次发送“前进”和“停止”，观察两条指令何时抵达。';

      const buttons = this.querySelectorAll('button');
      if (s.complete || s.failed) {
        buttons[0].textContent = '重新开始'; buttons[0].disabled = false;
        buttons[1].disabled = true; buttons[2].disabled = true;
      } else {
        this.updateMode();
      }
      this.draw();
    }

    draw() {
      if (!this.ctx || !this.state) return;
      const ctx = this.ctx;
      const w = this.canvas.offsetWidth;
      const h = this.canvas.offsetHeight;
      ctx.clearRect(0, 0, w, h);
      const accent = Deck.rgba('--accent', 0.9);
      const accentSoft = Deck.rgba('--accent', 0.18);
      const line = Deck.rgba('--line-strong', 0.8);
      const text = Deck.rgba('--text', 0.92);
      const mars = Deck.rgba('--warning', 0.9);
      const danger = Deck.rgba('--danger', 0.92);
      const positive = Deck.rgba('--positive', 0.92);

      const y = h * 0.63;
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 12]);
      ctx.strokeStyle = line;
      ctx.beginPath(); ctx.moveTo(w * 0.12, y); ctx.lineTo(w * 0.9, y); ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = accentSoft;
      ctx.beginPath(); ctx.arc(w * 0.08, y, h * 0.18, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = accent; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = mars;
      ctx.beginPath(); ctx.arc(w * 0.93, y, h * 0.14, 0, Math.PI * 2); ctx.fill();

      const obstacleX = w * 0.72;
      ctx.fillStyle = danger;
      ctx.fillRect(obstacleX, y - h * 0.09, 12, h * 0.18);
      ctx.fillStyle = Deck.rgba('--surface-1', 0.78);
      for (let i = 0; i < 4; i += 1) ctx.fillRect(obstacleX, y - h * 0.08 + i * h * 0.045, 12, h * 0.018);

      this.state.queue.forEach(packet => {
        const progress = Deck.clamp((this.state.time - packet.sent) / (packet.arrival - packet.sent), 0, 1);
        const px = w * (0.13 + progress * 0.72);
        ctx.fillStyle = text;
        ctx.save(); ctx.translate(px, y - h * 0.23); ctx.rotate(Math.PI / 4); ctx.fillRect(-7, -7, 14, 14); ctx.restore();
      });

      const rx = w * this.state.roverX;
      const ry = y - this.state.roverLane * h * 0.2;
      ctx.fillStyle = this.state.failed ? danger : this.state.complete ? positive : accent;
      ctx.fillRect(rx - 22, ry - 15, 44, 20);
      ctx.fillRect(rx - 8, ry - 27, 18, 12);
      ctx.strokeStyle = text; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(rx - 14, ry + 9, 8, 0, Math.PI * 2); ctx.arc(rx + 14, ry + 9, 8, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(rx + 8, ry - 27); ctx.lineTo(rx + 22, ry - 39); ctx.stroke();
    }
  }
