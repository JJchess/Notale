<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .lec-header__inner,
    .lec-footer__inner { display: flex; width: 100%; min-width: 0; align-items: center; justify-content: space-between; gap: var(--sp-4); }
    .lec-header__identity,
    .lec-header__heading,
    .lec-footer__take { display: flex; min-width: 0; align-items: center; gap: var(--sp-3); }
    .lec-header__index { color: var(--accent-strong); font-family: var(--font-mono); font-size: var(--fs-label); }
    .lec-header__kicker { flex: 0 0 auto; color: var(--text-muted); font-size: var(--fs-label); line-height: 1.35; }
    .lec-header__title { overflow: hidden; color: var(--text); font-size: var(--fs-body-lg); line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .lec-footer__take { overflow: hidden; }
    .lec-footer__take-label { flex: 0 0 auto; color: var(--accent-strong); }
    .lec-footer__take-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lec-footer__index { flex: 0 0 auto; font-family: var(--font-mono); }

    .page18 { padding-block: var(--sp-4); }
    .page18 > .min0 { height: 100%; }
    .p18-panel { display: flex; flex-direction: column; gap: var(--sp-3); }
    .p18-heading { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
    .p18-heading .badge { flex: 0 0 auto; }
    .p18-field { display: flex; flex-direction: column; gap: var(--sp-2); }
    .p18-compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
    .p18-state { padding: var(--sp-3); border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-1); }
    .p18-state strong { display: block; margin-block-start: var(--sp-1); font-size: var(--fs-body); line-height: var(--lh-body); }
    .p18-model { display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: var(--sp-2); flex: 1 1 auto; min-height: 0; }
    .p18-layer { display: grid; grid-template-columns: minmax(112px, .48fr) minmax(0, 1.52fr); align-items: center; gap: var(--sp-3); padding: var(--sp-3); border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2); }
    .p18-layer strong { color: var(--accent-strong); font-size: var(--fs-body-lg); line-height: var(--lh-heading); }
    .p18-layer span { font-size: var(--fs-body); line-height: var(--lh-body); }
    .p18-prompt { padding: var(--sp-3); border-inline-start: 5px solid var(--accent); background: var(--accent-soft); font-size: var(--fs-body); line-height: var(--lh-copy); }
    .p18-relations { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
    .p18-relation { padding: var(--sp-3); border: 1px solid var(--line); border-radius: var(--radius-sm); color: var(--text-muted); font-size: var(--fs-label); line-height: 1.4; }
    .p18-answer { min-height: 144px; resize: none; }
    .p18-feedback { min-height: 30px; color: var(--text-muted); font-size: var(--fs-body); line-height: var(--lh-body); }
    .p18-feedback[data-ready="true"] { color: var(--positive); }
  </style>
</head>
<body data-page="18" data-total="18">
  <div id="stage">
    <main class="split-lr page18" aria-label="立场复测与迁移出口题">
      <section class="panel p18-panel min0" aria-labelledby="stance-title">
        <div class="p18-heading">
          <h2 class="h3" id="stance-title">立场复测</h2>
          <span class="badge">前后对照</span>
        </div>

        <div class="p18-field">
          <label for="stance">现在更接受哪种解释？</label>
          <select id="stance">
            <option value="">请选择一种解释</option>
            <option value="body">身体越来越高级</option>
            <option value="brain">聪明大脑发明工具</option>
            <option value="culture">群体用文化接力解决问题</option>
          </select>
        </div>

        <div class="p18-compare" aria-live="polite">
          <div class="p18-state min0">
            <span class="label muted">开场记录</span>
            <strong id="before">未找到本机记录</strong>
          </div>
          <div class="p18-state min0">
            <span class="label muted">现在选择</span>
            <strong id="after">等待选择</strong>
          </div>
        </div>

        <div class="callout"><p>不是三选一：任务能力来自三层共同工作。</p></div>

        <div class="p18-model" aria-label="全课三层模型">
          <div class="p18-layer min0"><strong>身体</strong><span>地球演化遗产</span></div>
          <div class="p18-layer min0"><strong>文化</strong><span>跨代积累办法</span></div>
          <div class="p18-layer min0"><strong>航天系统</strong><span>人工补偿环境缺口</span></div>
        </div>
      </section>

      <section class="panel panel--accent p18-panel min0" aria-labelledby="transfer-title">
        <div class="p18-heading">
          <h2 class="h3" id="transfer-title">迁移出口题</h2>
          <span class="badge">没有唯一方案</span>
        </div>

        <div class="p18-field">
          <label for="scenario">选择迁移情境</label>
          <select id="scenario">
            <option value="gravity">低重力殖民地</option>
            <option value="ship">长期世代飞船</option>
            <option value="robot">机器人先行任务</option>
          </select>
        </div>

        <p class="p18-prompt" id="prompt">首先改变身体、环境、工具还是组织方式？为什么？</p>

        <div class="p18-field">
          <label for="answer">理由至少连接两条关系</label>
          <div class="p18-relations" aria-label="可引用的关系">
            <span class="p18-relation">低重力改变重量，不消除惯性</span>
            <span class="p18-relation">通信延迟推动自治</span>
            <span class="p18-relation">循环仍会累积损失</span>
            <span class="p18-relation">屏蔽增加防护，也增加质量</span>
          </div>
          <textarea class="p18-answer" id="answer" placeholder="写下选择与理由"></textarea>
        </div>

        <p class="p18-feedback" id="feedback" data-ready="false" aria-live="polite">提出选择，再连接因果关系。</p>
      </section>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Deck.init({ index: 18, total: 18 });

    Lec.mount({
      index: 18,
      kicker: `APEMAN, SPACEMAN`,
      title: `太空人是“更高级的人”，还是“被系统托住的地球动物”？`,
      take: `太空人不是演化阶梯的顶端，而是地球身体、累积文化和人工环境暂时组成的系统。`
    });

    const labels = {
      body: '身体越来越高级',
      brain: '聪明大脑发明工具',
      culture: '群体用文化接力解决问题'
    };
    const stance = document.querySelector('#stance');
    const scenario = document.querySelector('#scenario');
    const answer = document.querySelector('#answer');
    const before = document.querySelector('#before');
    const after = document.querySelector('#after');
    const prompt = document.querySelector('#prompt');
    const feedback = document.querySelector('#feedback');

    function findOpeningChoice() {
      const aliases = {
        body: ['身体越来越高级', 'body'],
        brain: ['聪明大脑发明工具', 'brain'],
        culture: ['群体用文化接力解决问题', 'culture']
      };
      for (let i = 0; i < localStorage.length; i += 1) {
        const key = localStorage.key(i);
        if (!key || (!key.includes('02') && !key.toLowerCase().includes('story') && !key.toLowerCase().includes('choice'))) continue;
        const value = localStorage.getItem(key) || '';
        for (const name of Object.keys(aliases)) {
          if (aliases[name].some(alias => value.includes(alias))) return name;
        }
      }
      return '';
    }

    const opening = findOpeningChoice();
    if (opening) before.textContent = labels[opening];

    stance.addEventListener('change', () => {
      const current = stance.value;
      after.textContent = current ? labels[current] : '等待选择';
      if (current) localStorage.setItem('page-18-post-choice', current);
      if (opening && current) {
        after.textContent += opening === current ? ' · 立场保持' : ' · 立场改变';
      }
    });

    const prompts = {
      gravity: '首先改变身体、环境、工具还是组织方式？为什么？',
      ship: '跨越多代的航行，首先改变什么？为什么？',
      robot: '让机器人先到达，首先改变什么？为什么？'
    };
    scenario.addEventListener('change', () => {
      prompt.textContent = prompts[scenario.value];
      evaluateAnswer();
    });

    const relationGroups = [
      ['低重力', '重量', '惯性'],
      ['通信', '延迟', '自治'],
      ['循环', '损失', '回收'],
      ['屏蔽', '防护', '质量']
    ];
    const requiredRelations = ['关系甲', '关系乙'].length;

    function evaluateAnswer() {
      const text = answer.value.trim();
      const count = relationGroups.filter(group => group.filter(term => text.includes(term)).length > 1).length;
      const hasPriority = ['身体', '环境', '工具', '组织'].some(term => text.includes(term));
      if (!text) {
        feedback.textContent = '提出选择，再连接因果关系。';
        feedback.dataset.ready = 'false';
      } else if (!hasPriority) {
        feedback.textContent = '请先写明：身体、环境、工具或组织方式。';
        feedback.dataset.ready = 'false';
      } else if (count < requiredRelations) {
        feedback.textContent = '还需再连接一条关系，说明它如何影响选择。';
        feedback.dataset.ready = 'false';
      } else {
        feedback.textContent = '已形成可检验的迁移解释；未来路线仍取决于约束与选择。';
        feedback.dataset.ready = 'true';
      }
    }
    answer.addEventListener('input', evaluateAnswer);
  </script>
</body>
</html>
