<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{overflow:hidden;--fs-h1:96px}
  .hero{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg)}
  .hero::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(7,16,24,.94) 0%,rgba(7,16,24,.45) 48%,transparent 72%)}
  .scene{position:absolute;inset:0;width:100%;height:100%;display:block}
  .illustration-field{position:absolute;z-index:0;right:0;top:0;width:82%;height:82%;object-fit:cover}
  .ground{fill:var(--panel-deep)}
  .ground-line{fill:none;stroke:var(--line);stroke-width:2;opacity:.48}
  .earth{opacity:0;animation:earth-in .7s ease-out forwards}
  .earth-body{fill:var(--panel);stroke:var(--teal-dim);stroke-width:3}
  .atmosphere{fill:none;stroke:var(--teal);stroke-width:7;filter:url(#softGlow)}
  .atmosphere-fine{fill:none;stroke:var(--teal-soft);stroke-width:2}
  .foot{fill:var(--panel-hi);stroke:var(--line-strong);stroke-width:3}
  .toe{fill:var(--panel-hi);stroke:var(--line-strong);stroke-width:2}
  .trace{fill:none;stroke:var(--teal);stroke-width:5;stroke-linecap:round;stroke-dasharray:18 24;opacity:.9}
  .trace-ghost{fill:none;stroke:var(--teal-dim);stroke-width:2;stroke-dasharray:7 18;opacity:.7}
  .sweep{fill:none;stroke:var(--teal-soft);stroke-width:10;stroke-linecap:round;stroke-dasharray:170 1800;stroke-dashoffset:1800;filter:url(#glow);animation:sweep 1.2s .35s ease-out forwards}
  .turn{fill:var(--amber);filter:url(#amberGlow)}
  .hero>.copy{position:absolute;z-index:3;left:clamp(24px,5vw,72px);bottom:clamp(24px,5vw,72px);width:min(760px,52%);padding:0;background:none;border:0;opacity:0;transform:translateY(12px);animation:copy-in .65s .3s ease-out forwards}
  .visual-support{position:absolute;z-index:1;pointer-events:none}
  .ground-mass{left:0;bottom:0;width:58%;height:42%;background:linear-gradient(16deg,rgba(13,27,36,.72),rgba(13,27,36,.08));clip-path:polygon(0 24%,55% 4%,100% 48%,100% 100%,0 100%)}
  .transition-field{left:36%;top:25%;width:32%;height:49%;background:radial-gradient(ellipse at center,rgba(54,214,192,.08),transparent 68%)}
  .orbital-field{right:0;top:0;width:40%;height:72%;background:radial-gradient(circle at 72% 42%,rgba(54,214,192,.1),transparent 67%)}
  .copy .kicker{margin-bottom:18px;color:var(--teal-soft);font-size:16px;font-weight:750;letter-spacing:.14em;line-height:1.4;text-transform:uppercase}
  .copy h1{max-width:12ch;font-size:clamp(44px,7vw,96px);line-height:1.04;letter-spacing:-.045em;text-wrap:balance}
  .copy .question{margin-top:25px;color:var(--text);font-size:27px;font-weight:650;line-height:1.4}
  .copy .question::before{content:"";display:inline-block;width:42px;height:4px;margin:0 14px 7px 0;background:var(--amber)}
  @keyframes earth-in{to{opacity:1}}
  @keyframes sweep{to{stroke-dashoffset:-120}}
  @keyframes copy-in{to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){.earth,.copy{animation:earth-in .01s forwards}.copy{transform:none}.sweep{display:none}}
</style>
</head>
<body data-page="01" data-total="45">
<div id="stage">

    <div class="visual-support orbital-field" aria-hidden="true"></div>

      <g transform="translate(545 592) rotate(-12) scale(.64)" opacity=".78"><path class="foot" d="M0 58C-8 27 3-12 26-27C47-40 67-19 62 8C58 35 39 68 19 80C10 84 3 75 0 58Z"/><circle class="toe" cx="22" cy="-45" r="10"/><circle class="toe" cx="40" cy="-42" r="9"/><circle class="toe" cx="55" cy="-33" r="8"/></g>
      <path class="trace-ghost" d="M595 578C750 535 842 466 928 344C1031 197 1162 130 1320 120C1438 112 1518 70 1590 20"/>

      <circle class="turn" cx="914" cy="363" r="8"/>
      <g class="earth">
        <circle class="earth-body" cx="1300" cy="430" r="300"/>
        <path class="atmosphere" d="M1060 250A300 300 0 0 1 1540 250"/>

      </g>
    </svg>
    <section class="copy claim" aria-label="开场主张">
      <p class="kicker" aria-label="ACT I · APeman 不是起点站"><span aria-hidden="true">ACT</span> <span aria-hidden="true">I</span> <span aria-hidden="true">·</span> <span aria-hidden="true">APeman</span> <span aria-hidden="true">不是</span><span aria-hidden="true">起点站</span></p>
      <h1 id="page-title" aria-label="从脚印到轨道"><span aria-hidden="true">从</span><span aria-hidden="true">脚</span><span aria-hidden="true">印</span><br><span aria-hidden="true">到</span><span aria-hidden="true">轨</span><span aria-hidden="true">道</span></h1>

    </section>
  </main>
</div>
