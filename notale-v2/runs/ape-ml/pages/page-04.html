<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:34px 58px 30px;overflow:hidden}
  .eyebrow{color:var(--teal);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.13em}
  .hero-head{position:relative;z-index:2}
  .hero-head .lead{max-width:860px}
  .viz-shell{position:relative;overflow:hidden;border:var(--stroke) solid var(--line);border-radius:var(--r-lg);background:linear-gradient(180deg,var(--panel),var(--panel-deep));box-shadow:0 20px 50px var(--shadow)}
  #timeline{display:block;width:100%;height:100%}
  #timeline text{font-family:var(--font-sans)}
  #timeline .event-label{font-size:16px;fill:var(--text);font-weight:680}
  #timeline .event-age{font-size:16px;fill:var(--ink-muted)}
  #timeline .axis-label{font-size:14px;fill:var(--ink-muted)}
  #timeline .tick-text{font-size:14px;fill:var(--ink-faint);font-family:var(--font-mono)}
  .process-strip{height:84px;--process-gap:10px}
  .process-strip>.step{padding:10px 14px;display:flex;flex-direction:column;justify-content:center}
  .process-strip>.step strong{font-size:16px;line-height:1.3}
  .process-strip>.step span{font-size:14px;color:var(--ink-muted);line-height:1.35}
  .process-strip>.arw{flex-basis:22px;font-size:18px}
  .control-band{padding:14px 20px;border:var(--stroke) solid var(--line);border-radius:var(--r-md);background:var(--panel)}
  .control-band input[type=range]{width:100%;accent-color:var(--amber);cursor:ew-resize}
  .step-dots{display:flex;justify-content:space-between;color:var(--ink-faint);font-size:14px;line-height:1.2}
  .step-dots span.active{color:var(--amber);font-weight:760}
  .readout.compact{width:270px;padding:12px 18px}
  .readout.compact .value{font-size:24px}
  .claim{min-height:54px;padding:12px 18px;border-left:8px solid var(--teal);border-radius:0 var(--r-md) var(--r-md) 0;background:var(--panel-hi);font-size:18px;font-weight:700;line-height:1.45;transform:translateY(16px);opacity:0;transition:transform 320ms ease-out,opacity 320ms ease-out}
  .claim.show{transform:none;opacity:1}
  .status{min-height:24px;color:var(--ink-muted);font-size:16px;line-height:1.4}
  @media (prefers-reduced-motion:reduce){.claim{transition:none}.intro{animation:none!important}}
</style>
</head>
<body data-page="04" data-total="45">
<div id="stage">
  <header class="hero-head col gap-1" style="height:92px">
    <div class="eyebrow">ACT I · DEEP TIME</div>
    <div class="row items-end justify-between gap-4">
      <h1>把一生放进数百万年</h1>
      <p class="lead">拖动压缩尺，让挤在“很久以前”的事件重新分开</p>
    </div>
  </header>

  <main class="col gap-3 min0" style="flex:1">
    <section class="k-process process-strip shrink0" aria-label="时间映射的四个连续阶段">
      <div class="axis"></div>
      <div class="step current"><strong>线性全景</strong><span>等长距离代表等长年份</span></div><div class="arw"></div>
      <div class="step"><strong>开始展开</strong><span>近现在事件逐渐分开</span></div><div class="arw"></div>
      <div class="step"><strong>数量级分层</strong><span>百年、十万年、百万年可比较</span></div><div class="arw"></div>
      <div class="step"><strong>对数全景</strong><span>距离改为表示数量级</span></div>
    </section>

    <section class="viz-shell grow min0" aria-label="深时间压缩尺">
      <svg id="timeline" viewBox="0 0 1440 810" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">从线性时间尺连续变形为对数时间尺</title>
        <desc id="svgDesc">同一组年代事件沿同一条时间尺移动，展示数量级视角如何拉开深时间。</desc>
      </svg>
    </section>

    <section class="row gap-3 items-stretch shrink0" style="height:108px">
      <div class="control-band grow min0 no-pan">
        <div class="row items-center justify-between">
          <label for="compression" class="body"><strong>压缩程度</strong> <span class="secondary">拖动后比较事件间距</span></label>
          <span id="stepCount" class="mono target" aria-live="polite">1 / 4</span>
        </div>
        <input id="compression" type="range" min="0" max="100" step="1" value="0" aria-label="压缩程度，方向键切换四个阶段">
        <div class="step-dots" aria-hidden="true"><span class="active">线性</span><span>展开</span><span>分层</span><span>对数</span></div>
      </div>
      <div class="readout compact is-target">
        <span class="label">80 年占当前尺宽</span>
        <span id="lifeShare" class="value" aria-live="polite">—</span>
      </div>
      <button id="reset" class="btn" type="button" style="width:168px">重置为线性尺</button>
    </section>
    <div class="row gap-3 items-center shrink0" style="height:62px">
      <p id="claim" class="claim grow">把一生放进数百万年后，“很久以前”会挤成一线；换成数量级视角，事件才重新拉开。</p>
      <p id="status" class="status" style="width:330px" aria-live="polite">事件年代不变，改变的只是时间映射。</p>
    </div>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  Deck.init({index:4,total:45});
  var K=Lec.K, P=Lec.P;
  /* lec.js 当前版把这些量收在 chronology；按规划口径在本页补齐缺少的两个命名项。 */
  var sapiens=K.chronology.homoSapiensYearsAgo;
  var split=[K.chronology.earliestHomininsYearsAgo-K.chronology.controlledFireYearsAgo,K.chronology.earliestHomininsYearsAgo];
  var laetoli=3660000;
  var oldest=split[1];
  var life=80;
  var events=[
    {id:'split',name:'人类与黑猩猩谱系分开',years:split[0],age:function(){return '约 '+fmtWan(split[0])+'–'+fmtWan(split[1])+' 万年前';},y:170},
    {id:'laetoli',name:'莱托利足迹',years:laetoli,age:function(){return '约 '+fmtWan(laetoli)+' 万年前';},y:300},
    {id:'sapiens',name:'现代人出现',years:sapiens,age:function(){return '约 '+fmtWan(sapiens)+' 万年前';},y:430},
    {id:'life',name:'一个人的一生',years:life,age:function(){return life+' 年';},y:560},
    {id:'now',name:'现在',years:0,age:function(){return '时间基准';},y:680}
  ];
  function fmtWan(v){return (v/10000).toLocaleString('zh-CN',{maximumFractionDigits:0});}
  var svg=d3.select('#timeline'), x0=110, x1=1330, axisY=625;
  var teal=Deck.token('--teal'), tealDim=Deck.token('--teal-dim'), amber=Deck.token('--amber'), line=Deck.token('--line'), faint=Deck.token('--ink-faint'), panel=Deck.token('--panel-hi');
  var defs=svg.append('defs');
  defs.append('linearGradient').attr('id','earthGlow').attr('x1','0').attr('y1','0').attr('x2','0').attr('y2','1')
    .selectAll('stop').data([{o:'0%',c:teal,a:.22},{o:'100%',c:teal,a:0}]).join('stop').attr('offset',function(d){return d.o}).attr('stop-color',function(d){return d.c}).attr('stop-opacity',function(d){return d.a});
  svg.append('path').attr('d','M1110,810 Q1230,545 1440,510 L1440,810 Z').attr('fill','url(#earthGlow)').attr('stroke',teal).attr('stroke-width',3).attr('opacity',Deck.reduced()?1:0).attr('class','earth');
  svg.append('text').attr('x',1328).attr('y',760).attr('text-anchor','end').attr('class','axis-label').text('现在 · 地球边缘');
  svg.append('line').attr('x1',x0).attr('x2',x1).attr('y1',axisY).attr('y2',axisY).attr('stroke',teal).attr('stroke-width',4).attr('stroke-dasharray','10 8').attr('class','main-axis');
  svg.append('path').attr('d','M110,625 l22,-10 l22,10 l22,-10 l22,10').attr('fill','none').attr('stroke',tealDim).attr('stroke-width',3);
  var ghost=svg.append('g');
  ghost.append('text').attr('x',x0).attr('y',735).attr('class','axis-label').text('线性参照：左侧为数百万年前，右侧为现在');
  ghost.append('text').attr('x',x1).attr('y',735).attr('text-anchor','end').attr('class','axis-label').text('对数参照：每跨一段代表约一个数量级');
  [100,10000,1000000].forEach(function(v){
    var p=P.timelineLogPosition(v,oldest,1), x=x0+(x1-x0)*p;
    ghost.append('line').attr('x1',x).attr('x2',x).attr('y1',650).attr('y2',672).attr('stroke',line);
    ghost.append('text').attr('x',x).attr('y',700).attr('text-anchor','middle').attr('class','tick-text').text(v>=10000?(v/10000)+' 万年':v+' 年');
  });
  var groups=svg.selectAll('.event').data(events).join('g').attr('class','event');
  groups.append('line').attr('class','needle').attr('y1',function(d){return d.y+42}).attr('y2',axisY).attr('stroke',tealDim).attr('stroke-width',2);
  groups.append('circle').attr('cy',axisY).attr('r',7).attr('fill',panel).attr('stroke',teal).attr('stroke-width',3);
  groups.append('rect').attr('x',-96).attr('y',function(d){return d.y}).attr('width',192).attr('height',64).attr('rx',8).attr('fill',panel).attr('stroke',line).attr('stroke-width',2);
  groups.append('text').attr('text-anchor','middle').attr('y',function(d){return d.y+25}).attr('class','event-label').text(function(d){return d.name});
  groups.append('text').attr('text-anchor','middle').attr('y',function(d){return d.y+49}).attr('class','event-age').text(function(d){return d.age()});
  var bracket=svg.append('g').attr('aria-hidden','true');
  bracket.append('path').attr('fill','none').attr('stroke',amber).attr('stroke-width',4);
  bracket.append('text').attr('class','event-label').attr('fill',amber).attr('text-anchor','middle').attr('y',648).text('一生跨度');
  function linearPos(y){return 1-P.scalePosition(y,0,oldest);}
  function logPos(y){return y===0?1:P.timelineLogPosition(y,oldest,1);}
  function mapped(y,t){return P.lerp(linearPos(y),logPos(y),t);}
  var slider=document.getElementById('compression'), steps=document.querySelectorAll('.process-strip .step'), dots=document.querySelectorAll('.step-dots span');
  function render(t){
    groups.attr('transform',function(d){return 'translate('+(x0+(x1-x0)*mapped(d.years,t))+',0)'});
    var lifeX=x0+(x1-x0)*mapped(life,t), nowX=x1, bw=Math.max(2,nowX-lifeX);
    bracket.attr('transform','translate(0,0)');
    bracket.select('path').attr('d','M'+lifeX+',626 v18 M'+lifeX+',635 H'+nowX+' M'+nowX+',626 v18');
    bracket.select('text').attr('x',(lifeX+nowX)/2);
    var share=(100*bw/(x1-x0));
    document.getElementById('lifeShare').textContent=share<.01?'< 0.01%':share.toFixed(share<1?2:1)+'%';
    var nearest=Math.round(t*3);
    document.getElementById('stepCount').textContent=(nearest+1)+' / 4';
    steps.forEach(function(el,i){el.classList.toggle('current',i===nearest);el.classList.toggle('done',i<nearest)});
    dots.forEach(function(el,i){el.classList.toggle('active',i===nearest)});
    document.getElementById('claim').classList.toggle('show',t>.98);
  }
  function snap(){
    var target=Math.round((+slider.value/100)*3)/3;
    slider.value=Math.round(target*100);
    if(Deck.reduced()){render(target);return;}
    var start=window.currentT||0, begin=performance.now();
    function frame(now){var q=Math.min(1,(now-begin)/420), eased=1-Math.pow(1-q,3), v=P.lerp(start,target,eased);window.currentT=v;render(v);if(q<1)requestAnimationFrame(frame)}
    requestAnimationFrame(frame);
  }
  slider.addEventListener('input',function(){var t=+this.value/100;window.currentT=t;render(t)});
  slider.addEventListener('change',snap);
  slider.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();var n=Math.round((+this.value/100)*3)+(e.key==='ArrowRight'||e.key==='ArrowUp'?1:-1);n=Math.max(0,Math.min(3,n));this.value=Math.round(n*100/3);window.currentT=n/3;render(n/3)}});
  document.getElementById('reset').addEventListener('click',function(){slider.value=0;window.currentT=0;render(0);slider.focus()});
  window.currentT=0;render(0);
  if(!Deck.reduced()){
    svg.select('.earth').transition().duration(650).ease(d3.easeCubicOut).attr('opacity',1);
    svg.select('.main-axis').attr('stroke-dashoffset',180).transition().delay(180).duration(900).ease(d3.easeCubicOut).attr('stroke-dashoffset',0);
    groups.attr('opacity',0).attr('transform',function(d){return 'translate('+(x0+(x1-x0)*linearPos(d.years))+',-16)'}).transition().delay(function(d,i){return 380+i*75}).duration(420).ease(d3.easeCubicOut).attr('opacity',1).attr('transform',function(d){return 'translate('+(x0+(x1-x0)*linearPos(d.years))+',0)'});
  }
})();
</script>
</body>
</html>
