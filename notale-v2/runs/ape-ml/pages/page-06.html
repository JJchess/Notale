<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:28px 38px 26px;gap:16px;overflow:hidden}
  .head{height:92px;display:flex;align-items:flex-start;justify-content:space-between;gap:32px}
  .kicker{font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.13em;color:var(--teal)}
  .take{max-width:760px;padding-top:7px;text-align:right}
  .assembly{position:relative;display:flex;gap:18px;min-height:0}
  .bay{position:relative;flex:1 1 auto;min-width:0;overflow:hidden;border:2px solid var(--line);border-radius:var(--r-lg);background:linear-gradient(90deg,rgba(54,214,192,.035) 1px,transparent 1px),linear-gradient(rgba(54,214,192,.035) 1px,transparent 1px),var(--panel-deep);background-size:40px 40px}
  .bay svg{display:block;width:100%;height:100%;touch-action:none}
  .side{flex:0 0 390px;min-width:0}
  .classbox{height:100%;padding:14px!important}
  .classbox>.bt{margin:-14px -14px 10px!important;padding:8px 14px!important}
  .classbox .lv{padding:8px 0 8px 22px;margin-left:6px}
  .classbox .lv::before{top:23px;width:14px}
  .classbox .lv.active{border-left-color:var(--teal)}
  .class-title{font-size:var(--fs-sec);font-weight:720;color:var(--text)}
  .duty{font-size:var(--fs-sec);line-height:1.35;color:var(--ink-faint);max-height:0;opacity:0;overflow:hidden;transition:max-height 240ms ease,opacity 200ms ease}
  .lv.active .duty{max-height:52px;opacity:1;color:var(--teal-soft)}
  .progress{height:70px;display:flex;align-items:center;gap:18px;padding:10px 16px;border:2px solid var(--teal-dim);border-radius:var(--r-sm);background:var(--panel-deep)}
  .progress strong{font:720 var(--fs-h2)/1.2 var(--font-mono);color:var(--teal)}
  .segments{display:flex;flex:1;gap:7px}
  .seg{height:8px;flex:1;border-radius:9px;background:var(--line)}
  .seg.on{background:var(--teal);box-shadow:0 0 12px rgba(54,214,192,.5)}
  .claim{min-height:76px;padding:12px 15px;border-left:6px solid var(--teal);background:var(--panel-hi);font-size:var(--fs-sec);line-height:1.4}
  .claim.pending{color:var(--ink-muted);border-left-color:var(--line-strong)}
  .tray-label{fill:var(--ink-muted);font:650 15px var(--font-sans);letter-spacing:.06em}
  .svg-label{fill:var(--ink-muted);font:650 15px var(--font-sans)}
  .bone{fill:none;stroke:#D7E4DF;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
  .bone-fine{fill:none;stroke:#D7E4DF;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .module{cursor:grab;outline:none;transition:opacity 180ms ease}
  .module:focus .hit{stroke:var(--focus);stroke-width:3}
  .module.placed{cursor:default;filter:drop-shadow(0 0 8px rgba(54,214,192,.75))}
  .module.wrong{animation:shake 210ms ease-in-out}
  .hit{fill:transparent;stroke:transparent;stroke-width:2}
  .slot{fill:rgba(54,214,192,.035);stroke:var(--line-strong);stroke-width:2;stroke-dasharray:7 7}
  .slot.ready{stroke:var(--amber)}.slot.done{stroke:var(--teal);fill:rgba(54,214,192,.08)}
  .anchor{fill:var(--panel-deep);stroke:var(--amber);stroke-width:3}.anchor.on{stroke:var(--teal);fill:var(--teal)}
  .load{fill:none;stroke:var(--teal);stroke-width:5;stroke-linecap:round;opacity:.14}.load.on{opacity:1}
  .support{fill:rgba(54,214,192,.06);stroke:var(--teal-dim);stroke-width:2}.support.on{fill:rgba(54,214,192,.2);stroke:var(--teal)}
  .plumb{stroke:var(--amber);stroke-width:3;stroke-dasharray:8 7}.plumb.ok{stroke:var(--teal)}
  .ghost{opacity:.26}.ghost line,.ghost path{fill:none;stroke:var(--ink-faint);stroke-width:4}.ghost text{fill:var(--ink-muted);font:650 15px var(--font-sans)}
  .ghost.fade{opacity:.06;transition:opacity 500ms ease}
  .hint{position:absolute;left:20px;bottom:128px;max-width:290px;padding:8px 12px;border:1px solid var(--amber-deep);border-radius:var(--r-sm);background:var(--panel);color:var(--amber-soft);font-size:var(--fs-sec);opacity:0;transform:translateY(5px);transition:180ms;pointer-events:none}
  .hint.show{opacity:1;transform:none}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @media(prefers-reduced-motion:reduce){.duty,.ghost,.hint{transition:none}.module.wrong{animation:none}}
</style>
</head>
<body data-page="06" data-total="45">
<div id="stage">
  <header class="head shrink0">
    <div><div class="kicker">BODY ASSEMBLY · 06</div><h1>不是扶直，是重组</h1></div>
    <p class="lead take">双足行走依靠骨盆、脊柱、股骨和足部共同改变，不是只把猿“扶直”。</p>
  </header>
  <main class="assembly grow min0">
    <section class="bay no-pan min0" aria-label="骨架重组操作区">
      <svg id="board" viewBox="0 0 1080 720" role="img" aria-labelledby="svgtitle svgdesc">
        <title id="svgtitle">双足骨架重组</title><desc id="svgdesc">把托盘中的四类骨骼依次移入中央人体轮廓。也可聚焦部件后用方向键移动，空格确认。</desc>
        <path d="M555 88 C495 104 476 168 486 252 L466 409 C458 490 472 562 510 612 L600 612 C638 562 652 490 644 409 L624 252 C634 168 615 104 555 88Z" fill="rgba(54,214,192,.025)" stroke="var(--line)" stroke-width="2"/>
        <g class="ghost" id="ghost"><text x="95" y="82">只“扶直”</text><line x1="160" y1="110" x2="160" y2="430"/><path d="M120 230 L200 230 M120 430 L200 430 M135 430 L120 555 M185 430 L200 555"/><circle cx="120" cy="560" r="8"/><circle cx="200" cy="560" r="8"/><path d="M102 585 H218" stroke-dasharray="6 6"/><text x="74" y="620">接口无法同时闭合</text></g>
        <rect id="support" class="support" x="473" y="574" width="164" height="48" rx="24"/>
        <line id="plumb" class="plumb" x1="555" y1="116" x2="555" y2="598"/>
        <path id="load0" class="load" d="M555 120 L555 255"/><path id="load1" class="load" d="M555 255 L555 346"/><path id="load2" class="load" d="M555 346 L520 535 M555 346 L590 535"/><path id="load3" class="load" d="M520 535 L500 590 M590 535 L610 590"/>
        <g id="slots">
          <rect class="slot" data-slot="spine" x="500" y="105" width="110" height="155" rx="36"/>
          <rect class="slot" data-slot="pelvis" x="475" y="258" width="160" height="105" rx="30"/>
          <rect class="slot" data-slot="femur" x="465" y="365" width="180" height="180" rx="42"/>
          <rect class="slot" data-slot="feet" x="460" y="540" width="190" height="76" rx="30"/>
          <text class="svg-label" x="662" y="182">躯干承托</text>
          <text class="svg-label" x="662" y="315">骨盆转接</text>
          <text class="svg-label" x="662" y="452">下肢对线</text>
          <text class="svg-label" x="662" y="585">地面支撑</text>
        </g>
        <g id="anchors"><circle class="anchor" cx="555" cy="257" r="7"/><circle class="anchor" cx="502" cy="345" r="7"/><circle class="anchor" cx="608" cy="345" r="7"/><circle class="anchor" cx="520" cy="535" r="7"/><circle class="anchor" cx="590" cy="535" r="7"/></g>
        <text class="tray-label" x="330" y="650">部件托盘 · 拖入对应层级</text><line x1="320" y1="660" x2="790" y2="660" stroke="var(--line-strong)" stroke-width="2"/>
        <g class="module" data-id="spine" tabindex="0" role="button" aria-label="带腰曲的脊柱，拖到躯干承托插槽" transform="translate(330 675)"><rect class="hit" x="-55" y="-42" width="110" height="82" rx="16"/><path class="bone" d="M0 -34 C-18 -17 17 0 -4 15 C-16 24 0 34 0 36"/><circle class="anchor" cx="0" cy="36" r="5"/></g>
        <g class="module" data-id="pelvis" tabindex="0" role="button" aria-label="短而宽的骨盆，拖到骨盆转接插槽" transform="translate(475 675)"><rect class="hit" x="-62" y="-42" width="124" height="82" rx="16"/><path class="bone-fine" d="M-48 -25 Q-65 5 -38 29 Q-9 8 0 32 Q9 8 38 29 Q65 5 48 -25 Q22 -5 0 -16 Q-22 -5 -48 -25Z"/></g>
        <g class="module" data-id="femur" tabindex="0" role="button" aria-label="向膝部内收的一对股骨，拖到下肢对线插槽" transform="translate(625 675)"><rect class="hit" x="-65" y="-43" width="130" height="84" rx="16"/><path class="bone" d="M-42 -31 L-18 31 M42 -31 L18 31"/><circle class="anchor" cx="-18" cy="31" r="5"/><circle class="anchor" cx="18" cy="31" r="5"/></g>
        <g class="module" data-id="feet" tabindex="0" role="button" aria-label="有足弓的一对足，拖到地面支撑插槽" transform="translate(770 675)"><rect class="hit" x="-68" y="-42" width="136" height="82" rx="16"/><path class="bone" d="M-52 -5 Q-36 19 -5 6 M52 -5 Q36 19 5 6"/></g>
        <text class="svg-label" x="742" y="94">琥珀垂线：尚未形成稳定承重链</text>
      </svg>
      <div id="hint" class="hint" aria-live="polite"></div>
    </section>
    <aside class="side col gap-2 min0">
      <div class="progress shrink0"><div><span class="label">承重链</span><br><strong id="count">0/4</strong></div><div class="segments" id="segments"><i class="seg"></i><i class="seg"></i><i class="seg"></i><i class="seg"></i></div></div>
      <div class="k-classification grow min0">
        <div class="box classbox">
          <div class="bt">双足身体：一条协作的承重链</div>
          <div class="lv" data-class="spine"><div class="class-title">躯干承托 · 脊柱</div><div class="duty">调整躯干在骨盆上方的排列</div></div>
          <div class="lv" data-class="pelvis"><div class="class-title">骨盆转接 · 骨盆</div><div class="duty">承接躯干，把负荷传向两侧髋部</div></div>
          <div class="lv" data-class="femur"><div class="class-title">下肢对线 · 股骨</div><div class="duty">让膝与足接近身体中线下方</div></div>
          <div class="lv" data-class="feet"><div class="class-title">地面支撑 · 足部</div><div class="duty">以足弓和同向拇趾承重并推进</div></div>
        </div>
      </div>
      <div id="claim" class="claim pending shrink0">把四类结构放入共同主干，检验关节锚点与足底支撑区。</div>
      <button id="reset" class="btn shrink0" type="button">重新拆开</button>
    </aside>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Deck.init({index:6,total:45});
(() => {
  const ids=['spine','pelvis','femur','feet'];
  const target={spine:[555,182],pelvis:[555,309],femur:[555,452],feet:[555,578]};
  const start={spine:[330,675],pelvis:[475,675],femur:[625,675],feet:[770,675]};
  const messages={spine:'接口未对准骨盆',pelvis:'左右髋部接口尚未对齐',femur:'膝线仍在支撑区外',feet:'垂线落在双足之外'};
  const state={placed:new Set(),drag:null};
  const board=document.querySelector('#board'), hint=document.querySelector('#hint');
  const modules=Object.fromEntries(ids.map(id=>[id,board.querySelector(`[data-id="${id}"]`)]));
  function pos(el,x,y){el.setAttribute('transform',`translate(${x} ${y})`);el.dataset.x=x;el.dataset.y=y}
  ids.forEach(id=>pos(modules[id],...start[id]));
  function refresh(){
    const n=state.placed.size,total=ids.length;
    document.querySelector('#count').textContent=`${n}/${total}`;
    [...document.querySelectorAll('.seg')].forEach((s,i)=>s.classList.toggle('on',i<n));
    ids.forEach((id,i)=>{document.querySelector(`[data-class="${id}"]`).classList.toggle('active',state.placed.has(id));document.querySelector(`[data-slot="${id}"]`).classList.toggle('done',state.placed.has(id));document.querySelector(`#load${i}`).classList.toggle('on',state.placed.has(id));});
    [...document.querySelectorAll('.anchor')].forEach((a,i)=>a.classList.toggle('on',i<Math.min(5,n+1)));
    const done=n===total;
    document.querySelector('#support').classList.toggle('on',done);document.querySelector('#plumb').classList.toggle('ok',done);document.querySelector('#ghost').classList.toggle('fade',done);
    const claim=document.querySelector('#claim');claim.classList.toggle('pending',!done);claim.textContent=done?'直立不是旋转身体：四类结构彼此制约，缺少一环就无法同时连接并稳定站立。':'把四类结构放入共同主干，检验关节锚点与足底支撑区。';
  }
  function boardPoint(e){const p=Deck.pt(board,e);const vb=board.viewBox.baseVal;return {x:p.x*vb.width/board.clientWidth,y:p.y*vb.height/board.clientHeight}}
  function begin(e,id){if(state.placed.has(id))return;const p=boardPoint(e),m=modules[id];state.drag={id,dx:p.x-(+m.dataset.x),dy:p.y-(+m.dataset.y)};m.setPointerCapture?.(e.pointerId)}
  function move(e){if(!state.drag)return;const p=boardPoint(e),m=modules[state.drag.id];pos(m,p.x-state.drag.dx,p.y-state.drag.dy)}
  function finish(e){if(!state.drag)return;const id=state.drag.id,m=modules[id],x=+m.dataset.x,y=+m.dataset.y,[tx,ty]=target[id];state.drag=null;
    if(Math.hypot(x-tx,y-ty)<=85){pos(m,tx,ty);state.placed.add(id);m.classList.add('placed');hint.classList.remove('show');refresh();}
    else{m.classList.add('wrong');hint.textContent=messages[id];hint.classList.add('show');setTimeout(()=>{pos(m,...start[id]);m.classList.remove('wrong')},Deck.reduced()?0:420);setTimeout(()=>hint.classList.remove('show'),1400)}
  }
  ids.forEach(id=>{const m=modules[id];m.addEventListener('pointerdown',e=>begin(e,id));m.addEventListener('keydown',e=>{if(state.placed.has(id))return;let [x,y]=[+m.dataset.x,+m.dataset.y];if(e.key==='ArrowLeft')x-=12;else if(e.key==='ArrowRight')x+=12;else if(e.key==='ArrowUp')y-=12;else if(e.key==='ArrowDown')y+=12;else if(e.key===' '||e.key==='Enter'){e.preventDefault();pos(m,...target[id]);state.placed.add(id);m.classList.add('placed');refresh();return}else return;e.preventDefault();pos(m,x,y)});});
  board.addEventListener('pointermove',move);board.addEventListener('pointerup',finish);board.addEventListener('pointercancel',finish);
  document.querySelector('#reset').addEventListener('click',()=>{state.placed.clear();ids.forEach(id=>{modules[id].classList.remove('placed');pos(modules[id],...start[id])});hint.classList.remove('show');refresh()});
  refresh();
})();
</script>
</body>
</html>
