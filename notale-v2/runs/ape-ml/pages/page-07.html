const M=Lec.K.math, au=[M.FOUR*M.HUNDRED,M.FIVE?M.FIVE*M.HUNDRED:M.HALF*M.THOUSAND+M.HALF*M.HUNDRED], eh=[M.SIX?M.SIX*M.HUNDRED:M.THREE*M.TWO*M.HUNDRED,M.NINE?M.NINE*M.HUNDRED:(M.THREE*M.THREE)*M.HUNDRED], modern=[M.THOUSAND+M.TWO*M.HUNDRED,M.THOUSAND+M.THREE*M.TWO*M.HUNDRED], years=3.66*M.MILLION;
const data=[
['a-brain',`${au[0]}–${au[1]} cm³`],['a-walk',`约 ${(years/M.MILLION).toFixed(2)} 百万年前的足迹：稳定双足`],['a-tool','没有与此头骨直接绑定的工具证据'],
['h-brain',`${eh[0]}–${eh[1]} cm³`],['h-walk','习惯性双足行走已经建立'],['h-tool','同期有简单石器；制造者不能只凭年代锁定'],
['m-brain',`${modern[0]}–${modern[1]} cm³；不作智力排名`],['m-walk','习惯性双足行走延续'],['m-tool','多步骤、用途分化的工具传统']];
let state,selected=null;const cards=document.querySelector('#cards'),slots=[...document.querySelectorAll('.slot')],progress=document.querySelector('#progress'),result=document.querySelector('#result'),line=document.querySelector('.baseline');
function fresh(){return {placed:{}}}function render(){cards.innerHTML='';data.slice().sort((a,b)=>a[0].localeCompare(b[0])).forEach(([id,text])=>{let b=document.createElement('button');b.className='e-card'+(state.placed[id]?' hidden':'');b.textContent=text;b.dataset.id=id;b.draggable=true;b.setAttribute('aria-pressed',selected===id);b.addEventListener('click',()=>select(id));b.addEventListener('dragstart',e=>{selected=id;e.dataTransfer.setData('text/plain',id)});cards.appendChild(b)});slots.forEach(s=>{let id=s.dataset.slot,found=state.placed[id];s.classList.toggle('filled',!!found);s.textContent=found?data.find(x=>x[0]===id)[1]:'放置证据'});document.querySelectorAll('.col-count').forEach(x=>{let n=Object.keys(state.placed).filter(k=>k.startsWith(x.dataset.col+'-')).length;x.textContent=`${n} / 3`});let n=Object.keys(state.placed).length;progress.textContent=`已配对 ${n} / ${data.length}`;if(n===data.length){line.classList.add('show');setTimeout(()=>result.classList.add('show'),Deck.reduced()?0:600)}else{line.classList.remove('show');result.classList.remove('show')}}
function select(id){selected=id;document.querySelectorAll('.e-card').forEach(x=>x.setAttribute('aria-pressed',x.dataset.id===id));slots.forEach(s=>s.classList.toggle('target',!state.placed[s.dataset.slot]))}
function place(slot,id){if(!id||state.placed[slot.dataset.slot])return;if(id===slot.dataset.slot){state.placed[id]=true;selected=null;progress.textContent='证据匹配，已归位';render()}else{let c=document.querySelector(`[data-id="${id}"]`);if(c){c.classList.remove('bad');void c.offsetWidth;c.classList.add('bad')}progress.textContent='年代或证据类型不符：先判断脑、步态或工具。'}}
slots.forEach(s=>{s.addEventListener('click',()=>place(s,selected));s.addEventListener('dragover',e=>e.preventDefault());s.addEventListener('drop',e=>{e.preventDefault();place(s,e.dataTransfer.getData('text/plain'))})});document.querySelector('#reset').onclick=()=>{state=fresh();selected=null;render()};state=fresh();render();
</script></body></html>
