<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:28px 34px 30px;gap:18px}
  .topline{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
  .kicker{color:var(--teal);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.08em}
  .titleblock{display:flex;flex-direction:column;gap:5px}
  .progress{display:flex;align-items:center;gap:14px;padding-top:4px}
  .forks{display:flex;gap:8px}
  .fork{width:24px;height:24px;color:var(--line-strong);transition:color 180ms ease-out,transform 180ms ease-out}
  .fork.on{color:var(--teal);transform:scale(1.08)}
  .main{display:grid;grid-template-columns:minmax(280px,.78fr) minmax(520px,1.42fr);gap:24px;min-height:0}
  .old-model{display:flex;flex-direction:column;gap:16px;transition:opacity 320ms cubic-bezier(.2,.8,.2,1)}
  .old-model.finished{opacity:.2}
  .stair{position:relative;flex:1;min-height:0;padding:24px 18px;overflow:hidden;border:2px solid var(--amber-deep);border-radius:var(--r-md);background:var(--panel-deep)}
  .stair::after{content:"";position:absolute;left:12%;top:49%;width:78%;height:5px;background:var(--amber);transform:rotate(-46deg);transform-origin:center;border-radius:999px;opacity:.82}
  .stair-step{position:absolute;width:128px;padding:10px 12px;border-left:4px solid var(--amber);background:var(--panel-hi);font-size:var(--fs-sec);font-weight:700;text-align:center}
  .s1{left:7%;bottom:9%}.s2{left:35%;bottom:37%}.s3{right:6%;top:12%}
  .step-arrow{position:absolute;color:var(--amber);font-size:28px;font-weight:800}
  .a1{left:28%;bottom:25%}.a2{right:28%;top:32%}
  .tree-panel{position:relative;display:flex;flex-direction:column;min-height:0;padding:18px 18px 12px;border:2px solid var(--line-strong);border-radius:var(--r-md);background:var(--panel);overflow:hidden}
  .tree-head{display:flex;align-items:center;justify-content:space-between;gap:16px;height:46px}
  .tree-wrap{position:relative;flex:1;min-height:0}
  #tree{display:block;width:100%;height:100%}
  .today{position:absolute;right:58px;top:12px;bottom:34px;border-left:2px dashed var(--teal-dim);pointer-events:none}
  .today span{position:absolute;top:-4px;right:10px;color:var(--teal-soft);font-size:var(--fs-label);font-weight:700;white-space:nowrap}
  .tree-link{fill:none;stroke:var(--teal-dim);stroke-width:2;marker-end:url(#arrow)}
  .tree-link.glow{stroke:var(--teal);stroke-width:4}
  .node circle.core{fill:var(--panel);stroke:var(--teal);stroke-width:2}
  .node.internal{cursor:pointer;outline:none}
  .node.internal circle.hit{fill:transparent;stroke:transparent}
  .node.internal.collapsed circle.ring{fill:none;stroke:var(--amber);stroke-width:2}
  .node text{fill:var(--text);font-family:var(--font-sans);font-size:16px;dominant-baseline:middle}
  .node.internal text{fill:var(--ink-muted);font-size:14px}
  .node:focus circle.hit{stroke:var(--focus);stroke-width:3}
  .wrong-line{stroke:var(--amber);stroke-width:4;stroke-dasharray:10 6;fill:none}
  .drag-handle{fill:var(--amber);stroke:var(--amber-soft);stroke-width:3;cursor:grab;outline:none}
  .drag-handle:focus{stroke:var(--text);stroke-width:5}
  .shake{animation:shake 240ms ease-out}
  @keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
  .feedback{min-height:28px;color:var(--ink-muted);font-size:var(--fs-sec);line-height:1.45}
  .feedback.bad{color:var(--amber-soft)}
  .feedback.good{color:var(--teal-soft)}
  .process-strip{height:92px;--process-gap:10px}
  .process-strip>.step{padding:10px 12px;font-size:var(--fs-sec);line-height:1.35}
  .process-strip>.arw{flex-basis:24px}
  .step strong{display:block;color:var(--teal-soft);font-size:var(--fs-label);margin-bottom:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="08" data-total="45">
<div id="stage">
  <header class="topline shrink0" style="height:82px">
    <div class="titleblock">
      <div class="kicker">ACT I · E1</div>
      <h1>现生猿不是人类的过去</h1>
      <p class="lead">人类与现生猿类共享祖先；今天的猿类不是等待变成人的旧版本。</p>
    </div>
    <div class="progress" aria-live="polite">
      <span class="label" id="progressText">谱系修正 0/4</span>
      <div class="forks" aria-hidden="true">
        <svg class="fork" viewBox="0 0 24 24"><path d="M12 21V10M12 14L5 7M12 14l7-7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <svg class="fork" viewBox="0 0 24 24"><path d="M12 21V10M12 14L5 7M12 14l7-7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <svg class="fork" viewBox="0 0 24 24"><path d="M12 21V10M12 14L5 7M12 14l7-7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <svg class="fork" viewBox="0 0 24 24"><path d="M12 21V10M12 14L5 7M12 14l7-7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </div>
    </div>
  </header>

  <main class="main grow min0">
    <section class="old-model min0" id="oldModel" aria-labelledby="oldTitle">
      <div class="row items-center justify-between"><h2 id="oldTitle">错误阶梯</h2><span class="chip is-risk">谁变成谁？</span></div>
      <div class="stair" aria-label="错误的猿到人线性阶梯">
        <div class="stair-step s1">现生猿</div><div class="step-arrow a1">→</div>
        <div class="stair-step s2">过渡形态</div><div class="step-arrow a2">→</div>
        <div class="stair-step s3">现代人</div>
      </div>
      <p class="secondary">这张阶梯把并列分支误画成一条“升级路线”。</p>
    </section>

    <section class="tree-panel min0 no-pan" aria-labelledby="treeTitle">
      <div class="tree-head"><h2 id="treeTitle">把直连修成共同祖先树</h2><button id="reset" class="btn" type="button">重置错误树</button></div>
      <div class="tree-wrap">
        <div class="today"><span>今天 · 并列末端</span></div>
        <svg id="tree" viewBox="0 0 900 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="可展开并修正的人类与现生猿类分支树"></svg>
      </div>
      <div id="feedback" class="feedback" aria-live="polite">先点击带双环的“推定共同祖先”，按分叉顺序展开。</div>
    </section>
  </main>

  <section class="k-process process-strip shrink0" aria-label="谱系修正过程">
    <div class="axis"></div>
    <div class="step current"><strong>1 · 展开</strong>更早共同祖先</div><div class="arw"></div>
    <div class="step"><strong>2 · 展开</strong>非洲猿共同祖先</div><div class="arw"></div>
    <div class="step"><strong>3 · 剪断</strong>黑猩猩 → 人类</div><div class="arw"></div>
    <div class="step"><strong>4 · 接回</strong>人—黑猩猩共同祖先</div>
  </section>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  Deck.init({index:8,total:45});
  const splitUpper = Lec.K.chronology.earliestHomininsYearsAgo;
  const split = [splitUpper * (6/7), splitUpper];
  const fmtMillions = v => (v/1000000).toFixed(0);
  const splitText = `约 ${fmtMillions(split[0])}–${fmtMillions(split[1])} 百万年前分开`;
  const data={id:'root',name:'推定共同祖先',children:[
    {id:'orang',name:'红毛猩猩'},
    {id:'african',name:'推定共同祖先',children:[
      {id:'gorilla',name:'大猩猩'},
      {id:'hc',name:'推定共同祖先',children:[
        {id:'chimpclade',name:'推定共同祖先',children:[{id:'chimp',name:'黑猩猩'},{id:'bonobo',name:'倭黑猩猩'}]},
        {id:'human',name:'人类'}
      ]}
    ]}
  ]};
  let phase=0, cut=false, dragPos=null;
  const svg=d3.select('#tree'), W=900,H=560;
  const g=svg.append('g');
  const defs=svg.append('defs');
  defs.append('marker').attr('id','arrow').attr('viewBox','0 -5 10 10').attr('refX',9).attr('refY',0).attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto').append('path').attr('d','M0,-5L10,0L0,5').attr('fill','var(--teal-dim)');
  const linkGen=d3.linkHorizontal().x(d=>d.y).y(d=>d.x);
  const tree=d3.tree().nodeSize([58,168]);
  function visibleData(){
    const copy=JSON.parse(JSON.stringify(data));
    if(phase<1) copy.children=null;
    else if(phase<2) copy.children[1].children=null;
    return copy;
  }
  function layout(){
    const root=d3.hierarchy(visibleData()); tree(root);
    const nodes=root.descendants();
    const min=d3.min(nodes,d=>d.x), max=d3.max(nodes,d=>d.x);
    nodes.forEach(d=>{d.x=58+(d.x-min)+(H-116-(max-min))/2;d.y=76+d.depth*168;});
    return root;
  }
  function render(animate=true){
    const root=layout(), nodes=root.descendants(), links=root.links();
    const tr=Deck.reduced()||!animate?null:d3.transition().duration(320).ease(d3.easeCubicOut);
    const lp=g.selectAll('path.tree-link').data(links,d=>d.target.data.id).join(
      e=>e.append('path').attr('class','tree-link').attr('d',d=>linkGen({source:{x:d.source.x,y:d.source.y},target:{x:d.source.x,y:d.source.y}})),
      u=>u,
      x=>x.remove());
    (tr?lp.transition(tr):lp).attr('d',linkGen).classed('glow',d=>phase===4&&(d.source.data.id==='hc'||d.target.data.id==='hc'||d.target.data.id==='human'||d.target.data.id==='chimpclade'));
    const n=g.selectAll('g.node').data(nodes,d=>d.data.id).join(e=>{
      const q=e.append('g').attr('class','node').attr('transform',d=>`translate(${d.parent?d.parent.y:d.y},${d.parent?d.parent.x:d.x})`);
      q.append('circle').attr('class','hit').attr('r',18);
      q.append('circle').attr('class','ring').attr('r',15);
      q.append('circle').attr('class','core').attr('r',7);
      q.append('text').attr('x',12).text(d=>d.data.name);
      return q;
    });
    n.attr('class',d=>`node ${d.children||['root','african'].includes(d.data.id)?'internal':'leaf'} ${(d.data.id==='root'&&phase<1)||(d.data.id==='african'&&phase<2)?'collapsed':''}`)
      .attr('tabindex',d=>['root','african'].includes(d.data.id)?0:null).attr('role',d=>['root','african'].includes(d.data.id)?'button':null)
      .attr('aria-label',d=>['root','african'].includes(d.data.id)?`展开${d.data.name}`:null)
      .on('click',(ev,d)=>activateNode(d)).on('keydown',(ev,d)=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();activateNode(d);}});
    (tr?n.transition(tr):n).attr('transform',d=>`translate(${d.y},${d.x})`);
    drawWrong(nodes);
    updateUI();
  }
  function activateNode(d){
    if(d.data.id==='root'&&phase===0){phase=1;message('红毛猩猩支系与其余支系从同一祖先处分开。','good');render();}
    else if(d.data.id==='african'&&phase===1){phase=2;message('大猩猩支系与人—黑猩猩支系并列分开。','good');render();}
  }
  function drawWrong(nodes){
    g.selectAll('.wrong-group').remove(); if(phase<2||phase===4)return;
    const by=id=>nodes.find(d=>d.data.id===id), chimp=by('chimpclade'), human=by('human'), hc=by('hc');
    if(!chimp||!human)return;
    const start={x:chimp.x,y:chimp.y}, natural={x:human.x,y:human.y};
    const end=dragPos||natural;
    const wg=g.append('g').attr('class','wrong-group');
    wg.append('path').attr('class','wrong-line').attr('d',linkGen({source:start,target:end}));
    const handle=wg.append('circle').attr('class','drag-handle').attr('cx',end.y).attr('cy',end.x).attr('r',10).attr('tabindex',0).attr('role','button').attr('aria-label',phase===2?'拖离人类，剪断错误直连':'接到人—黑猩猩共同祖先');
    handle.call(d3.drag().on('drag',ev=>{dragPos={x:ev.y,y:ev.x};drawWrong(layout().descendants());}).on('end',()=>finishDrag(hc,natural)));
    handle.on('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault(); if(phase===2){phase=3;cut=true;dragPos=null;message('直连已剪断：现生黑猩猩不是人类祖先。','good');render();}else if(phase===3){complete();}}});
  }
  function finishDrag(hc,natural){
    if(phase===2){
      const dist=Math.hypot(dragPos.x-natural.x,dragPos.y-natural.y);
      if(dist>28){phase=3;cut=true;dragPos=null;message('直连已剪断：现生黑猩猩不是人类祖先。','good');render();return;}
    } else if(phase===3){
      const dist=Math.hypot(dragPos.x-hc.x,dragPos.y-hc.y);
      if(dist<=28){complete();return;}
    }
    dragPos=null; message('现生物种不能直接接成另一现生物种的祖先；请接到共同祖先节点。','bad');
    const wrap=document.querySelector('.tree-wrap');wrap.classList.remove('shake');void wrap.offsetWidth;wrap.classList.add('shake');render();
  }
  function complete(){phase=4;dragPos=null;message(`${splitText}。黑猩猩、倭黑猩猩与人类是并列的现生分支。`,'good');render();}
  function message(t,kind){const el=document.getElementById('feedback');el.textContent=t;el.className='feedback '+kind;}
  function updateUI(){
    document.getElementById('progressText').textContent=`谱系修正 ${phase}/4`;
    document.querySelectorAll('.fork').forEach((e,i)=>e.classList.toggle('on',i<phase));
    document.querySelectorAll('.process-strip>.step').forEach((e,i)=>{e.classList.toggle('done',i<phase);e.classList.toggle('current',i===phase&&phase<4);});
    document.getElementById('oldModel').classList.toggle('finished',phase===4);
  }
  document.getElementById('reset').addEventListener('click',()=>{phase=0;cut=false;dragPos=null;message('先点击带双环的“推定共同祖先”，按分叉顺序展开。','');render(false);});
  render(false);
})();
</script>
</body>
</html>
