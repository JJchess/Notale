<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:38px 58px 28px;overflow:hidden}
  .kicker{color:var(--amber);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.14em}
  .heading{height:104px;display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-6)}
  .heading-copy{max-width:920px}
  .heading .lead{max-width:520px;padding-top:25px;color:var(--ink-muted)}
  .visual{position:relative;min-height:0;overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:radial-gradient(circle at 50% 48%,rgba(54,214,192,.08),transparent 39%)}
  .visual svg{display:block;width:100%;height:100%}
  .bone{fill:none;stroke:var(--ink-muted);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .bone-faint{fill:none;stroke:var(--line-strong);stroke-width:4;stroke-linecap:round}
  .tool{fill:none;stroke:var(--teal);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .ring{fill:none;stroke:var(--teal-dim);stroke-width:3;stroke-dasharray:14 12}
  .join{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round}
  .foot{fill:var(--teal);opacity:.22}
  .svg-label{font:700 18px/1.35 var(--font-sans);fill:var(--teal-soft);letter-spacing:.08em}
  .svg-sub{font:500 15px/1.35 var(--font-sans);fill:var(--ink-muted)}
  .gapmark{fill:var(--amber)}
  .k-enumeration{height:138px;--enum-cols:3;gap:var(--sp-4);padding-top:18px}
  .k-enumeration>.it{padding:12px 18px;border-color:var(--line);background:rgba(13,27,36,.72)}
  .k-enumeration>.it>.it-title{margin-bottom:4px;font-size:var(--fs-lead)}
  .it p{font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--ink-muted)}
  .it .from{color:var(--text);font-weight:700}
  .footerline{height:54px;display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-5)}
  .claim{font-size:var(--fs-body);line-height:var(--lh-copy);color:var(--text);font-weight:650}
  .note{font-size:var(--fs-sec)}
  .draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.05s ease-out forwards}
  .join.draw{animation-delay:.72s;animation-duration:.5s}
  .tool.draw{animation-delay:1.05s;animation-duration:.6s}
  .ring.draw{animation-delay:1.18s;animation-duration:.62s}
  @keyframes draw{to{stroke-dashoffset:0}}
  @media(prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body data-page="10" data-total="45">
<div id="stage">
  <header class="heading shrink0">
    <div class="heading-copy">
      <div class="kicker">I · HANDOFF</div>
      <h1>身体未完，搭建已开始</h1>
    </div>
    <p class="lead">身体没有等到“完工”才进入下一幕。文化从不完整的身体上继续搭建。</p>
  </header>

  <main class="visual grow min0" aria-label="不完整的直立骨架外，操作、防护、携带三种工具轮廓接续身体能力">
    <svg viewBox="0 0 1484 540" role="img" aria-labelledby="illus-title illus-desc">
      <title id="illus-title">身体能力与外部接续</title>
      <desc id="illus-desc">中央是不完整的直立骨架，外侧开放圆环上并列放置切割器、披覆物和容器，分别连接手、躯干与肩臂。</desc>
      <defs><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <!-- fading footprints -->
      <g>
        <ellipse class="foot" cx="390" cy="475" rx="20" ry="41" transform="rotate(-24 390 475)"/>
        <ellipse class="foot" cx="475" cy="450" rx="18" ry="37" transform="rotate(18 475 450)" style="opacity:.34"/>
        <ellipse class="foot" cx="551" cy="482" rx="18" ry="38" transform="rotate(-17 551 482)" style="opacity:.48"/>
      </g>
      <!-- open outer ring -->
      <path class="ring draw" d="M548 416 C410 274 490 68 690 38 C853 14 1004 101 1035 242 M1035 318 C1002 464 850 521 704 492"/>
      <circle class="gapmark" cx="1036" cy="280" r="6"/>
      <text class="svg-sub" x="1058" y="283">开放的接续</text>
      <!-- skeleton, 72% visual height -->
      <g class="bone draw">
        <circle cx="742" cy="105" r="43"/>
        <path d="M718 106 Q742 126 766 106 M726 127 Q742 137 758 127"/>
        <path d="M742 149 L739 205 M739 224 L742 282 M742 302 L744 347"/>
        <path d="M700 185 Q742 162 784 185 L773 242 Q742 263 711 242 Z"/>
        <path d="M713 197 L656 238 L613 300 M772 197 L833 228 L884 270"/>
        <path d="M724 345 Q742 330 761 345 L779 370 Q742 393 706 370 Z"/>
        <path d="M720 378 L682 444 L657 501 M763 378 L808 435 L846 491"/>
        <path d="M651 501 Q678 511 701 497 M836 491 Q859 504 879 487"/>
        <path d="M718 213 Q742 229 768 213 M716 229 Q742 245 770 229"/>
      </g>
      <!-- intentional missing segments -->
      <path class="bone-faint" d="M739 205 L739 224 M742 282 L742 302"/>
      <text class="svg-sub" x="705" y="325">持续变化的身体</text>
      <!-- flake -->
      <path class="join draw" d="M613 300 L519 248"/>
      <g class="tool draw" filter="url(#glow)"><path d="M448 198 L524 221 L498 292 L438 264 Z"/><path d="M460 220 L502 240 M458 251 L486 262"/></g>
      <text class="svg-label" x="382" y="177">操作</text><text class="svg-sub" x="382" y="200">切割器</text>
      <!-- covering -->
      <path class="join draw" d="M700 210 L582 153"/>
      <g class="tool draw" filter="url(#glow)"><path d="M508 72 Q558 52 610 75 L636 171 L583 151 L548 181 L489 158 Z"/><path d="M548 79 L548 181"/></g>
      <text class="svg-label" x="455" y="48">防护</text><text class="svg-sub" x="455" y="71">披覆物</text>
      <!-- container -->
      <path class="join draw" d="M855 244 L954 179"/>
      <g class="tool draw" filter="url(#glow)"><path d="M953 127 Q1000 95 1044 130 L1029 220 Q995 242 963 216 Z"/><path d="M966 137 Q999 160 1034 137"/></g>
      <text class="svg-label" x="1058" y="122">携带</text><text class="svg-sub" x="1058" y="145">容器</text>
    </svg>
  </main>

  <section class="k-enumeration shrink0" aria-label="三项身体能力与外部接续">
    <article class="it min0"><div class="it-title">操作</div><p><span class="from">手能操作</span>，工具把作用延伸出去。</p></article>
    <article class="it min0"><div class="it-title">防护</div><p><span class="from">身体会暴露</span>，外层可以补上保护。</p></article>
    <article class="it min0"><div class="it-title">携带</div><p><span class="from">身体能拿取</span>，器物扩大可携带范围。</p></article>
  </section>

  <footer class="footerline shrink0">
    <p class="claim">身体演化没有交付一件“最终成品”。</p>
    <p class="note">概念示意；不表示这些工具在同一年代同时出现。</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:10,total:45});</script>
</body>
</html>
