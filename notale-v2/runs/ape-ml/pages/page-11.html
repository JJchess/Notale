<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:28px 42px 24px;gap:14px;overflow:hidden}
  .kicker{font-size:var(--fs-label);font-weight:760;letter-spacing:.13em;color:var(--teal)}
  .topline{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-5)}
  .take{max-width:700px;text-align:right}
  .mission{display:flex;gap:16px;align-items:stretch;min-height:0}
  .weather{width:270px;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:16px 18px;border:2px solid var(--amber-deep);border-radius:var(--r-md);background:var(--panel)}
  .weather select{width:100%;min-height:46px;padding:8px 12px;color:var(--text);font:inherit;font-size:var(--fs-body);border:2px solid var(--line-strong);border-radius:var(--r-sm);background:var(--panel-deep)}
  .scenario-states{display:flex;gap:8px;flex-wrap:wrap}
  .scenario-state{font-size:var(--fs-label);color:var(--ink-muted)}
  .scenario-state.active{color:var(--amber-soft)}
  .pack{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:16px 22px;border:2px solid var(--teal-dim);border-radius:36px 36px var(--r-md) var(--r-md);background:linear-gradient(180deg,var(--panel-hi),var(--panel-deep))}
  .pack::before{content:"";position:absolute;left:18%;right:18%;top:-11px;height:20px;border:3px solid var(--teal-dim);border-bottom:0;border-radius:18px 18px 0 0}
  .pack-head{display:flex;justify-content:space-between;align-items:center}
  .slots{display:flex;gap:12px}
  .slot{flex:1;min-height:78px;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;font-size:var(--fs-sec);line-height:1.35;color:var(--ink-faint);border:2px dashed var(--amber-deep);border-radius:var(--r-sm);background:var(--panel)}
  .slot.filled{color:var(--text);border-style:solid;border-color:var(--teal);background:var(--panel-hi)}
  .chain{display:flex;align-items:center;gap:8px}
  .node{flex:1;min-height:38px;display:grid;place-items:center;padding:5px 8px;text-align:center;font-size:var(--fs-label);border:2px solid var(--line);border-radius:999px;color:var(--ink-faint);background:var(--panel)}
  .node.on{color:var(--text);border-color:var(--teal);background:rgba(54,214,192,.08)}
  .node.missing{color:var(--amber-soft);border-color:var(--amber)}
  .link{width:26px;height:2px;background:var(--line-strong)}
  .link.on{background:var(--teal)}
  .supply-ring{display:block;color:var(--ink-faint);font-size:var(--fs-sec);text-align:center;border-top:1px solid var(--line);padding-top:7px}
  .supply-ring.show{color:var(--teal-soft);border-color:var(--teal)}
  .rack{display:flex;flex-direction:row;gap:12px;min-height:0}
  .rack .box{flex:1;display:flex;flex-direction:column;padding:12px;background:var(--panel-hi)}
  .rack .box>.bt{min-height:32px;margin:-12px -12px 10px;padding:6px 12px;font-size:var(--fs-h2)}
  .rack .lv{display:flex;flex:1;flex-direction:column;justify-content:space-between;gap:8px;margin-left:4px;padding:4px 0 4px 16px}
  .rack .lv::before{top:22px;width:12px}
  .resource{min-width:132px;min-height:82px;padding:10px 12px;text-align:left;color:var(--text);font-family:inherit;font-size:16px;line-height:1.35;border:2px solid var(--line-strong);border-radius:var(--r-sm);background:var(--panel-deep);cursor:pointer;transition:transform 180ms ease-out,border-color 180ms ease-out,background 180ms ease-out}
  .resource:hover{border-color:var(--teal)}
  .resource.selected{border-color:var(--amber);background:var(--panel-hi);transform:translateY(-2px)}
  .resource .cap{display:block;color:var(--teal-soft);font-size:14px;font-weight:700}
  .resource .dep{display:block;color:var(--ink-muted);font-size:14px}
  .actions{display:flex;align-items:center;gap:12px}
  .actions .btn{font-size:16px}
  .feedback{flex:1;min-width:0;font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--ink-muted)}
  .feedback.ok{color:var(--success)}.feedback.bad{color:var(--amber-soft)}
  .shake{animation:shake 240ms ease-out}
  @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
  @keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .weather,.pack,.rack .box{animation:enter 520ms ease-out both}.pack{animation-delay:90ms}.rack .box:nth-child(1){animation-delay:180ms}.rack .box:nth-child(2){animation-delay:230ms}.rack .box:nth-child(3){animation-delay:280ms}.rack .box:nth-child(4){animation-delay:330ms}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="11" data-total="45">
<div id="stage">
  <header class="col gap-1 shrink0" style="height:94px">
    <div class="kicker">CULTURE OUTSIDE THE BODY · 11</div>
    <div class="topline"><h1>荒野里，你只能带走三件</h1><p class="lead take">单个人能带走的能力很少，大多数生存本领来自他人和现成系统。</p></div>
  </header>

  <section class="mission min0" style="height:220px" aria-label="情境与背包">
    <div class="weather min0">
      <label class="label" for="scenario">选择要应对的情境</label>
      <select id="scenario"><option value="浑水">浑水</option><option value="暴雨">暴雨</option><option value="受伤">受伤</option></select>
      <div class="scenario-states" id="scenarioStates" aria-label="情境进度"></div>
    </div>
    <div class="pack min0">
      <div class="pack-head"><h2>荒野背包</h2><span class="chip is-current" id="count" aria-live="polite">背包 0/3</span></div>
      <div class="slots" id="slots" aria-live="polite"></div>
      <div class="chain" id="chain" aria-label="能力链"></div>
      <div class="supply-ring" id="outer">身体外的支持：他人提供的知识 · 加工好的工具 · 可用材料</div>
    </div>
  </section>

  <main class="k-classification rack min0" style="flex:1" aria-label="四类可携带资源">
    <section class="box min0"><div class="bt">工具</div><p class="secondary">加工好的物件，把动作变得可执行。</p><div class="lv" id="工具"></div></section>
    <section class="box min0"><div class="bt">知识</div><p class="secondary">可复用的判断与操作步骤。</p><div class="lv" id="知识"></div></section>
    <section class="box min0"><div class="bt">伙伴</div><p class="secondary">来自他人的经验、复核与协作。</p><div class="lv" id="伙伴"></div></section>
    <section class="box min0"><div class="bt">原料</div><p class="secondary">会消耗、需要预先取得的材料。</p><div class="lv" id="原料"></div></section>
  </main>

  <footer class="actions shrink0" style="height:72px">
    <button class="btn btn-primary" id="check">检验这三件</button>
    <button class="btn" id="clear">一键清空</button>
    <p class="feedback" id="feedback" aria-live="polite">选择三件资源，再检验它们能否接通当前情境的能力链。</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(()=>{
  Deck.init({index:11,total:45});
  const slots=3;
  const scenarios=["浑水","暴雨","受伤"];
  const state={scenario:"浑水",selected:[],completed:[],tested:{}};
  const items=[
    {cat:"工具",name:"金属锅",cap:"容器、加热",dep:"依赖：热源与净水步骤"},
    {cat:"工具",name:"防水布",cap:"遮蔽",dep:"依赖：固定方法与支点"},
    {cat:"工具",name:"小刀",cap:"切割",dep:"依赖：正确处置步骤"},
    {cat:"知识",name:"净水流程",cap:"判断、步骤",dep:"依赖：容器与热源"},
    {cat:"知识",name:"绳结方法",cap:"固定",dep:"依赖：绳材与遮蔽物"},
    {cat:"知识",name:"急救步骤",cap:"判断、处置",dep:"依赖：敷料与工具"},
    {cat:"伙伴",name:"有经验的同伴",cap:"协作、复核",dep:"依赖：共同材料"},
    {cat:"伙伴",name:"急救员",cap:"诊断、操作",dep:"依赖：敷料与工具"},
    {cat:"原料",name:"干燥燃料",cap:"热源",dep:"依赖：可加热的容器"},
    {cat:"原料",name:"绳索纤维",cap:"连接",dep:"依赖：固定方法"},
    {cat:"原料",name:"洁净布料",cap:"敷料",dep:"依赖：正确包扎"}
  ];
  const rules={
    "浑水":{nodes:["盛装并煮沸","判断何时可饮用","持续提供热源"],groups:[["金属锅"],["净水流程"],["干燥燃料"]],hint:"容器、净水步骤和可持续热源缺一不可。"},
    "暴雨":{nodes:["形成干燥空间","把遮蔽物固定","完成快速搭设"],groups:[["防水布"],["绳结方法"],["有经验的同伴","绳索纤维"]],hint:"需要遮蔽物、固定方法，以及协作或连接材料。"},
    "受伤":{nodes:["判断并处置","提供洁净敷料","裁切合适尺寸"],groups:[["急救步骤","急救员"],["洁净布料"],["小刀"]],hint:"需要急救判断、洁净敷料和裁切工具。"}
  };
  const buttons=new Map();
  items.forEach(item=>{
    const b=document.createElement("button"); b.className="resource"; b.type="button"; b.dataset.name=item.name;
    b.setAttribute("aria-pressed","false"); b.innerHTML=`${item.name}<span class="cap">能做：${item.cap}</span><span class="dep">${item.dep}</span>`;
    b.addEventListener("click",()=>toggle(item.name)); document.getElementById(item.cat).appendChild(b); buttons.set(item.name,b);
  });
  function toggle(name){
    const i=state.selected.indexOf(name);
    if(i>=0) state.selected.splice(i,1); else if(state.selected.length<slots) state.selected.push(name); else {feedback("背包已满。先移出一件，再换入新资源。","bad"); return;}
    state.tested[state.scenario]=undefined; render();
  }
  function clear(){state.selected=[];state.tested[state.scenario]=undefined;document.getElementById("outer").classList.remove("show");feedback("背包已清空。为当前情境重新选择三件资源。","");render();}
  function evaluate(){
    if(state.selected.length!==slots){feedback(`还需选择 ${slots-state.selected.length} 件资源。`,"bad");return;}
    const rule=rules[state.scenario]; const hits=rule.groups.map(g=>g.some(x=>state.selected.includes(x))); const pass=hits.every(Boolean);
    state.tested[state.scenario]=pass?"已接通":"有缺口";
    if(pass){if(!state.completed.includes(state.scenario))state.completed.push(state.scenario);feedback(`${state.scenario}能力链已接通：三件资源分别承担不同环节。`,"ok");document.getElementById("outer").classList.add("show");document.getElementById("check").textContent="换个情境";}
    else {const missing=rule.nodes.filter((_,i)=>!hits[i]);feedback(`缺少：${missing.join("、")}。${rule.hint}`,"bad");state.selected.forEach(n=>{const b=buttons.get(n);b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")});}
    renderChain(hits); renderStates();
  }
  function nextScenario(){const i=scenarios.indexOf(state.scenario);state.scenario=scenarios[(i+1)%scenarios.length];document.getElementById("scenario").value=state.scenario;state.selected=[];document.getElementById("outer").classList.remove("show");document.getElementById("check").textContent="检验这三件";feedback("情境已切换。重新组合三类资源，接通新的能力链。","");render();}
  function renderChain(hits){const r=rules[state.scenario],wrap=document.getElementById("chain");wrap.innerHTML="";r.nodes.forEach((n,i)=>{const node=document.createElement("div");node.className="node"+(hits?(hits[i]?" on":" missing"):"");node.textContent=n;wrap.appendChild(node);if(i<2){const l=document.createElement("span");l.className="link"+(hits&&hits[i]&&hits[i+1]?" on":"");wrap.appendChild(l)}})}
  function renderStates(){document.getElementById("scenarioStates").innerHTML=scenarios.map(s=>`<span class="scenario-state ${s===state.scenario?'active':''}">${s} · ${state.tested[s]||'未检验'}</span>`).join("")}
  function render(){buttons.forEach((b,n)=>{const on=state.selected.includes(n);b.classList.toggle("selected",on);b.setAttribute("aria-pressed",String(on))});document.getElementById("count").textContent=`背包 ${state.selected.length}/${slots}`;document.getElementById("slots").innerHTML=Array.from({length:slots},(_,i)=>`<div class="slot ${state.selected[i]?'filled':''}">${state.selected[i]||`空槽 ${i+1}`}</div>`).join("");renderChain();renderStates()}
  function feedback(text,kind){const el=document.getElementById("feedback");el.textContent=text;el.className="feedback "+kind}
  document.getElementById("scenario").addEventListener("change",e=>{state.scenario=e.target.value;state.selected=[];document.getElementById("outer").classList.remove("show");document.getElementById("check").textContent="检验这三件";feedback("情境已切换。选择三件资源。","");render()});
  document.getElementById("check").addEventListener("click",()=>document.getElementById("check").textContent==="换个情境"?nextScenario():evaluate());
  document.getElementById("clear").addEventListener("click",clear);
  render();
})();
</script>
</body>
</html>
