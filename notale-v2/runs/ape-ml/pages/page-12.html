<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:16px 20px;gap:12px;overflow:hidden}
  .eyebrow{color:var(--teal);font:700 var(--fs-label)/1.3 var(--font-mono);letter-spacing:.12em}
  .topline{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
  .take{max-width:660px;text-align:right}
  .workbench{position:relative;display:flex;flex-direction:column;gap:14px;min-height:0}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:20px}
  .original-wrap{padding:14px 16px;border:2px solid var(--line);border-radius:var(--r-md);background:var(--panel);transition:opacity 260ms ease,transform 260ms ease}
  .original-wrap.folded{opacity:.58;transform:translateY(-2px)}
  .steps{height:144px;--process-gap:8px}
  .steps>.step{padding:14px 14px 12px;display:flex;flex-direction:column;justify-content:center;gap:7px}
  .steps>.step::after{content:"";height:14px;margin-top:3px;background:repeating-linear-gradient(180deg,var(--teal-dim) 0 2px,transparent 2px 6px);opacity:.72}
  .steps>.arw{flex-basis:24px}
  .step-no{color:var(--teal);font:700 14px/1.2 var(--font-mono)}
  .step-copy{font-size:16px;line-height:1.45;font-weight:650}
  .step-detail{color:var(--ink-muted);font-size:14px;line-height:1.4}
  .step-mark{align-self:flex-end;color:var(--teal-dim);font:800 54px/1 var(--font-mono)}
  .transmission{display:flex;gap:18px;min-height:0}
  .game-main{flex:1.1;min-width:0;display:flex;flex-direction:column;gap:14px;padding:16px 18px;border:2px solid var(--line);border-radius:var(--r-md);background:var(--panel)}
  .control-panel{flex:1.2;min-width:0;display:flex;flex-direction:column;gap:14px;padding:18px 20px}
  .statusbar{display:flex;align-items:center;justify-content:space-between;gap:18px}
  .statusbar .value{white-space:nowrap}
  .stations{height:142px;align-items:center;--process-gap:10px}
  .stations>.step{height:110px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .station-icon{display:grid;place-items:center;width:52px;height:52px;border:3px solid var(--line-strong);border-radius:50%;font-size:40px;line-height:1;color:var(--ink-muted)}
  .station-name{font-size:16px;font-weight:720}
  .stations>.step.current .station-icon{color:var(--amber)}
  .stations>.step.done .station-icon{color:var(--teal)}
  .rope-band{display:block;width:100%;height:42px;flex:0 0 42px;color:var(--teal-dim)}
  .rope-band path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round}
  .version-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;min-height:96px}
  .version-item{display:flex;flex-direction:column;gap:7px;padding:10px;border:2px solid var(--line);border-radius:var(--r-sm);background:var(--panel-deep);font-size:14px;line-height:1.4}
  .version-item .vnum{display:block;margin-bottom:4px;color:var(--teal);font:700 14px/1.2 var(--font-mono)}
  .version-item.lost{color:var(--ink-faint);border-style:dashed;opacity:.62}
  .version-item.changed{color:var(--amber-soft);border-color:var(--amber-deep)}
  .mode-row{display:flex;flex-direction:column;gap:8px}
  .mode-row .btn{width:100%;min-width:0;height:44px;font-size:16px}
  .mode-row .btn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber-soft);background:var(--panel-hi)}
  .prompt{padding-left:14px;border-left:4px solid var(--amber)}
  .feedback{min-height:74px;padding:12px 14px;border-radius:var(--r-sm);background:var(--panel-deep);font-size:16px;line-height:1.5;color:var(--ink-muted)}
  .feedback.good{color:var(--teal-soft);border:1px solid var(--teal-dim)}
  .feedback.bad{color:var(--amber-soft);border:1px solid var(--amber-deep)}
  .claimline{padding:12px 16px;border-left:6px solid var(--teal);background:var(--panel-hi);font-size:17px;line-height:1.45;font-weight:650}
  .flash{animation:pulse 420ms ease-out}.shake{animation:shake 260ms ease-out}
  @keyframes pulse{0%{transform:scale(.985);opacity:.65}100%{transform:none;opacity:1}}
  @keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-2px)}}
  @media(prefers-reduced-motion:reduce){.original-wrap{transition:none}.flash,.shake{animation:none}}
</style>
</head>
<body data-page="12" data-total="45">
<!-- BUDGET_EXCEEDED: selfcheck 画面占用比 42%，低于 45%；已完整保留规划指定的六步原稿、四站传递链、单一三选一交互、反馈与最终对照。 -->
<div id="stage">
  <header class="col gap-1 shrink0" style="height:102px">
    <div class="eyebrow">CULTURAL TRANSMISSION</div>
    <div class="topline">
      <h1>一根绳，传到第四手还剩什么？</h1>
      <p class="lead take">信息复制会丢失；示范、语言和外部记录能改变丢失速度。</p>
    </div>
  </header>

  <main class="workbench grow min0">
    <section class="original-wrap shrink0" id="originalWrap" style="height:208px" aria-labelledby="originalTitle">
      <div class="section-head" style="height:34px">
        <h2 id="originalTitle">原始制绳流程</h2>
        <span class="chip">原稿 · 可完整复查</span>
      </div>
      <div class="k-process steps" id="originalSteps" aria-label="六步原始制绳流程"><div class="axis"></div></div>
    </section>

    <section class="transmission grow min0" aria-label="四轮传递小游戏">
      <div class="game-main min0">
        <div class="statusbar shrink0" style="height:54px">
          <div class="readout" style="height:54px"><span class="label">传递进度</span><span class="value" id="roundReadout">—</span></div>
          <div class="readout" style="height:54px"><span class="label">当前版本</span><span class="value" id="fidelityReadout" aria-live="polite">—</span></div>
          <span class="note">课堂传递模型，不是实测丢失率</span>
        </div>
        <div class="k-process stations shrink0" id="stations" aria-label="四个传递站"><div class="axis"></div></div>
        <svg class="rope-band" viewBox="0 0 900 42" preserveAspectRatio="none" aria-hidden="true"><path d="M4 9 C120 2 180 18 300 9 S500 2 610 12 S790 20 896 8"/><path d="M4 21 C110 13 205 31 316 20 S500 13 625 23 S780 31 896 20"/><path d="M4 33 C125 25 190 40 305 31 S510 24 620 34 S790 39 896 31"/></svg>
        <div class="legend shrink0" style="height:30px" aria-label="需要保留的信息字段"><span class="chip">动作</span><span class="chip">顺序</span><span class="chip">空间关系</span><span class="chip">可复查</span></div>
        <div class="version-strip grow min0" id="versionStrip" aria-label="当前六步版本"></div>
      </div>

      <aside class="panel control-panel min0" aria-labelledby="taskTitle">
        <div class="col gap-1">
          <span class="label">本轮任务</span>
          <h2 id="taskTitle" class="prompt">—</h2>
        </div>
        <p class="secondary">选择一种编码方式，把当前版本交给下一人。</p>
        <div class="mode-row" id="modeRow" role="group" aria-label="选择传递方式"></div>
        <div class="feedback" id="feedback" aria-live="polite">先判断：什么方式最容易保住本轮目标？</div>
        <div class="claimline" id="claim">丢失会被下一轮继承，不能自动恢复。</div>
        <button class="btn btn-primary" id="resetBtn" type="button" hidden>重置传递</button>
      </aside>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  'use strict';
  Deck.init({index:12,total:45});
  const GAME={seed:'apeman-spaceman-p12',rounds:4,modes:['观察','口述','图示'],targets:['连续动作','先后顺序','左右方向','供下一人复查'],best:['观察','口述','图示','图示']};
  const steps=[
    ['取六束等长纤维','数量 · 等长','≡'],['理齐，分成两股','先理齐 · 再分股','⑵'],
    ['每股分别向右捻紧','两股 · 向右','↻'],['两股交叉向左合捻','交叉 · 向左','↶'],
    ['每捻一段就向下压实','重复节奏 · 用力动作','⇣'],['两端打结，再拉扯检查','收尾顺序 · 检查动作','↔']
  ];
  const reasons=[
    '静态描述漏掉手怎样持续转动。','动作看见了，但“先理齐再分股”不明确。',
    '口述版本没有方向词，左右关系会消失。','示范结束后不能回看，记录才能留下。'
  ];
  const damage={
    '观察':[[4,1],[1,1],[2,1],[5,1]],
    '口述':[[4,1],[1,0],[2,1],[5,1]],
    '图示':[[4,0],[1,1],[2,0],[5,0]]
  };
  const totalInfo=steps.length*steps[0].length+steps.length;
  const initial=()=>({round:0,fidelity:totalInfo,lost:[],changed:[],trace:[],complete:false});
  let state=initial();
  const original=document.getElementById('originalSteps');
  steps.forEach((s,i)=>{
    original.insertAdjacentHTML('beforeend',`<div class="step"><span class="step-no">${String(i+1).padStart(2,'0')}</span><span class="step-copy">${s[0]}</span><span class="step-detail">${s[1]}</span><span class="step-mark" aria-hidden="true">${s[2]}</span></div>${i<steps.length-1?'<div class="arw" aria-hidden="true"></div>':''}`);
  });
  const stationEl=document.getElementById('stations');
  for(let i=0;i<GAME.rounds;i++) stationEl.insertAdjacentHTML('beforeend',`<div class="step"><span class="station-icon" aria-hidden="true">◉</span><span class="station-name">第 ${i+1} 手</span><span class="label">${i===0?'接收原稿':'接收上一版'}</span></div>${i<GAME.rounds-1?'<div class="arw" aria-hidden="true"></div>':''}`);
  const modeRow=document.getElementById('modeRow');
  const modeNotes={'观察':'连续动作可见','口述':'先后关系可说','图示':'方向与记录可查'};
  GAME.modes.forEach(mode=>{const b=document.createElement('button');b.className='btn';b.type='button';b.textContent=`${mode} · ${modeNotes[mode]}`;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>choose(mode,b));modeRow.appendChild(b)});
  function render(){
    const shown=Math.min(state.round+1,GAME.rounds);
    document.getElementById('roundReadout').textContent=`第 ${shown}/${GAME.rounds} 轮`;
    document.getElementById('fidelityReadout').textContent=`保真信息 ${state.fidelity}/${totalInfo}`;
    document.getElementById('taskTitle').textContent=state.complete?'与原稿逐行比较':`保住：${GAME.targets[state.round]}`;
    document.querySelectorAll('#stations>.step').forEach((el,i)=>{el.classList.toggle('done',i<state.round);el.classList.toggle('current',!state.complete&&i===state.round)});
    document.getElementById('originalWrap').classList.toggle('folded',state.round>0&&!state.complete);
    document.getElementById('modeRow').hidden=state.complete;
    document.getElementById('resetBtn').hidden=!state.complete;
    const strip=document.getElementById('versionStrip');strip.innerHTML='';
    steps.forEach((s,i)=>{
      const lost=state.lost.includes(i), changed=state.changed.includes(i);
      const d=document.createElement('div');d.className='version-item'+(lost?' lost':'')+(changed?' changed':'');
      d.innerHTML=`<span class="vnum">${i+1}</span>${lost?'信息缺口':changed?s[0].replace(/向右|向左|先|再/g,'方向／顺序不明'):s[0]}`;strip.appendChild(d);
    });
  }
  function choose(mode,button){
    if(state.complete)return;
    const r=state.round, correct=mode===GAME.best[r];
    document.querySelectorAll('#modeRow .btn').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
    const [idx,severity]=damage[mode][r];
    if(!correct){
      if(severity&&!state.lost.includes(idx)) state.lost.push(idx); else if(!state.changed.includes(idx)) state.changed.push(idx);
      state.fidelity=Math.max(0,state.fidelity-(severity?2:1));
      const fb=document.getElementById('feedback');fb.textContent=reasons[r]+' 可以改选，但这次缺失已进入当前版本。';fb.className='feedback bad shake';
    }else{
      state.fidelity=Math.max(0,state.fidelity-1);
      state.trace.push({round:r+1,mode,correct:true});state.round++;
      const done=state.round>=GAME.rounds;state.complete=done;
      const fb=document.getElementById('feedback');fb.textContent=done?'传递完成：逐行看最终版本中的缺口与变更。':`${mode}保住了本轮目标；当前版本继续传给下一人。`;fb.className='feedback good flash';
    }
    render();
    document.getElementById('versionStrip').classList.remove('flash');void document.getElementById('versionStrip').offsetWidth;document.getElementById('versionStrip').classList.add('flash');
  }
  document.getElementById('resetBtn').addEventListener('click',()=>{state=initial();document.getElementById('feedback').textContent='先判断：什么方式最容易保住本轮目标？';document.getElementById('feedback').className='feedback';render()});
  render();
})();
</script>
</body>
</html>
