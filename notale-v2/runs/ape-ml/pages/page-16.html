<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:32px 42px 26px;gap:16px}
  .page-head{height:94px;display:flex;align-items:flex-start;justify-content:space-between;gap:32px}
  .kicker{color:var(--teal);font:700 var(--fs-label)/1.3 var(--font-mono);letter-spacing:.12em;margin-bottom:5px}
  .take{max-width:760px;color:var(--ink-muted);font-size:var(--fs-sec);line-height:var(--lh-copy);padding-top:26px}
  .network-shell{position:relative;flex:1;min-height:0;overflow:hidden;border:var(--stroke) solid var(--line);border-radius:var(--r-lg);background:linear-gradient(135deg,rgba(54,214,192,.045),transparent 52%),var(--panel-deep)}
  #network{display:block;width:100%;height:100%;touch-action:none}
  .metrics{position:absolute;z-index:3;top:18px;right:18px;display:flex;gap:10px;pointer-events:none}
  .metrics .readout{min-width:138px;padding:10px 14px;background:rgba(9,22,30,.94)}
  .metrics .label{font-size:var(--fs-label)}
  .metrics .value{font-size:var(--fs-h2)}
  .goal{position:absolute;z-index:2;left:50%;top:50%;width:276px;height:112px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:var(--stroke) solid var(--teal-dim);border-radius:56px;background:var(--panel);box-shadow:0 0 42px rgba(54,214,192,.1);pointer-events:none}
  .goal strong{font-size:var(--fs-h2);line-height:1.25;color:var(--teal-soft)}
  .goal span{font-size:var(--fs-label);color:var(--ink-muted)}
  .status{position:absolute;z-index:3;left:18px;top:18px;max-width:390px;padding:10px 14px;border-left:4px solid var(--amber);background:rgba(9,22,30,.9);font-size:var(--fs-sec);line-height:1.4}
  .bottom{height:82px;display:flex;align-items:center;justify-content:space-between;gap:28px}
  .instruction{display:flex;align-items:center;gap:18px;min-width:0}
  .instruction .mark{width:42px;height:42px;flex:none;border:3px solid var(--amber);border-radius:50%;box-shadow:0 0 18px rgba(255,181,71,.18)}
  .instruction p{font-size:var(--fs-sec);line-height:var(--lh-copy)}
  .instruction strong{display:block;color:var(--text);font-size:var(--fs-body)}
  .conclusion{max-width:660px;color:var(--teal-soft);font-size:var(--fs-sec);line-height:var(--lh-copy);text-align:right}
  .bridge{fill:none;stroke:var(--line-strong);stroke-width:3;stroke-linecap:round;stroke-dasharray:10 10;opacity:.45}
  .link{stroke:var(--teal);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(54,214,192,.5))}
  .link-new{stroke-dasharray:12 8;animation:flow .75s linear 2}
  .temp-link{stroke:var(--amber);stroke-width:3;stroke-dasharray:7 7;pointer-events:none}
  .node{cursor:crosshair;outline:none}
  .node:focus .node-ring{stroke:var(--focus);stroke-width:5}
  .node-ring{fill:var(--panel-hi);stroke:var(--line-strong);stroke-width:3;transition:stroke .2s,filter .2s}
  .node .port{fill:var(--amber);stroke:var(--panel-deep);stroke-width:4}
  .node .role{fill:var(--text);font:700 18px var(--font-sans);text-anchor:middle}
  .node .skill-bg{fill:var(--panel-deep);stroke:var(--teal-dim);stroke-width:2}
  .node .skill{fill:var(--teal-soft);font:650 15px var(--font-sans);text-anchor:middle}
  .node .need{fill:var(--ink-muted);font:500 14px var(--font-sans);text-anchor:middle}
  .node.articulation .node-ring{stroke:var(--amber);filter:drop-shadow(0 0 10px rgba(255,181,71,.65));animation:riskPulse 1.6s ease-in-out infinite}
  .node.selected .node-ring{stroke:var(--amber);stroke-width:5}
  .node.failed{opacity:.25}
  .success .goal{border-color:var(--success);box-shadow:0 0 46px rgba(98,216,155,.2)}
  .success .goal strong{color:var(--success)}
  .shake{animation:shake .32s ease-out}
  @keyframes flow{to{stroke-dashoffset:-40}}
  @keyframes riskPulse{50%{stroke-width:7}}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @media(prefers-reduced-motion:reduce){.link-new,.node.articulation .node-ring,.shake{animation:none!important}}
</style>
</head>
<body data-page="16" data-total="45">
<div id="stage">
  <header class="page-head shrink0">
    <div><div class="kicker">DISTRIBUTED ABILITY · 16</div><h1>能力不在任何一个人里</h1></div>
    <p class="take">没有任何一个角色独自拥有全部能力。把分工接成可交换、可复核的信息网络。</p>
  </header>

  <main class="network-shell no-pan min0" id="shell">
    <div class="status" id="status" aria-live="polite">从一个角色端口拖到另一个角色，建立信息连接。</div>
    <div class="metrics" aria-label="网络指标">
      <div class="readout"><span class="label">技能覆盖</span><span class="value" id="coverage">1 / 6</span></div>
      <div class="readout"><span class="label">单点故障</span><span class="value" id="faults">0</span></div>
      <div class="readout"><span class="label">已用线路</span><span class="value" id="lines">0 / 7</span></div>
    </div>
    <div class="goal"><strong id="goalTitle">架设一座跨溪步桥</strong><span>共同成果</span></div>
    <svg id="network" viewBox="0 0 1440 810" role="application" aria-label="六个角色的协作网络。拖动端口连接角色；也可聚焦角色后按回车选择，再选择另一角色。">
      <path class="bridge" d="M475 456 C575 405 646 420 720 458 C796 497 872 493 970 442 M505 473 L520 425 M580 446 L595 493 M666 438 L680 486 M760 470 L776 421 M850 482 L866 433 M935 457 L950 410"/>
      <g class="links"></g><g class="temp"></g><g class="nodes k-enumeration"></g>
    </svg>
  </main>

  <footer class="bottom shrink0">
    <div class="instruction"><span class="mark" aria-hidden="true"></span><p><strong>目标：覆盖全部技能，同时消除唯一中转者</strong>每条线表示双方可交换并复核信息；最多使用 7 条。</p></div>
    <p class="conclusion">分工只有经过可信连接才会成为群体能力；网络若依赖唯一中转者，成果仍然脆弱。</p>
    <button class="btn" id="reset" type="button">重置网络</button>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  Deck.init({index:16,total:45});
  const roles=[
    {id:'survey',role:'踏勘员',skill:'测量',offer:'路线与跨度',need:'风险复核'},
    {id:'wood',role:'木作手',skill:'木作',offer:'横梁与支架',need:'尺寸变更'},
    {id:'rope',role:'绳结手',skill:'结绳',offer:'固定与拉索',need:'载荷要求'},
    {id:'carry',role:'搬运者',skill:'运输',offer:'材料到位',need:'路线与顺序'},
    {id:'build',role:'架设者',skill:'架设',offer:'现场组装',need:'横梁、拉索'},
    {id:'record',role:'记录者',skill:'记录',offer:'共享图样',need:'各角色变更'}
  ];
  const svg=d3.select('#network'), linkLayer=svg.select('.links'), tempLayer=svg.select('.temp'), nodeLayer=svg.select('.nodes');
  const W=1440,H=810,cx=720,cy=420,rx=470,ry=270;
  roles.forEach((d,i)=>{const a=-Math.PI/2+i*Math.PI/3;d.x=cx+Math.cos(a)*rx;d.y=cy+Math.sin(a)*ry;d.fx=d.x;d.fy=d.y;});
  let links=[], selected=null, dragging=null, completed=false;
  const simulation=d3.forceSimulation(roles)
    .force('link',d3.forceLink(links).id(d=>d.id).distance(180))
    .force('charge',d3.forceManyBody().strength(-480))
    .force('collide',d3.forceCollide(68)).alphaDecay(0.08).stop();

  const nodes=nodeLayer.selectAll('g.node').data(roles,d=>d.id).join('g')
    .attr('class','node it').attr('tabindex',0).attr('role','button')
    .attr('aria-label',d=>`${d.role}，持有${d.skill}；按回车选择连接端点`)
    .attr('transform',d=>`translate(${d.x},${d.y})`);
  nodes.append('circle').attr('class','node-ring').attr('r',52);
  nodes.append('circle').attr('class','port').attr('r',10).attr('cy',-52);
  nodes.append('text').attr('class','role').attr('y',-9).text(d=>d.role);
  nodes.append('rect').attr('class','skill-bg').attr('x',-36).attr('y',3).attr('width',72).attr('height',25).attr('rx',8);
  nodes.append('text').attr('class','skill').attr('y',21).text(d=>d.skill);
  nodes.append('text').attr('class','need').attr('y',80).text(d=>`需：${d.need}`);

  function ids(l){return [typeof l.source==='object'?l.source.id:l.source,typeof l.target==='object'?l.target.id:l.target];}
  function adjacency(exclude){const m=new Map(roles.filter(n=>n.id!==exclude).map(n=>[n.id,[]]));links.forEach(l=>{const [a,b]=ids(l);if(a!==exclude&&b!==exclude){m.get(a).push(b);m.get(b).push(a);}});return m;}
  function components(exclude){const m=adjacency(exclude), seen=new Set(), sizes=[];for(const id of m.keys())if(!seen.has(id)){let q=[id],n=0;seen.add(id);while(q.length){const v=q.pop();n++;m.get(v).forEach(x=>{if(!seen.has(x)){seen.add(x);q.push(x);}});}sizes.push(n);}return sizes.sort((a,b)=>b-a);}
  function articulation(){const base=components().length;return new Set(roles.filter(n=>components(n.id).length>base).map(n=>n.id));}
  function setStatus(msg){document.getElementById('status').textContent=msg;}
  function render(newKey){
    const edge=linkLayer.selectAll('line').data(links,l=>ids(l).sort().join('-'));
    edge.exit().remove();
    const entered=edge.enter().append('line').attr('class',l=>ids(l).sort().join('-')===newKey?'link link-new':'link')
      .attr('x1',l=>l.source.x).attr('y1',l=>l.source.y).attr('x2',l=>l.source.x).attr('y2',l=>l.source.y);
    edge.merge(entered).attr('x1',l=>l.source.x).attr('y1',l=>l.source.y);
    if(Deck.reduced()) entered.attr('x2',l=>l.target.x).attr('y2',l=>l.target.y);
    else entered.transition().duration(450).ease(d3.easeCubicOut).attr('x2',l=>l.target.x).attr('y2',l=>l.target.y);
    const cover=Math.max(...components()), cuts=articulation();
    document.getElementById('coverage').textContent=`${cover} / ${roles.length}`;
    document.getElementById('faults').textContent=cuts.size;
    document.getElementById('lines').textContent=`${links.length} / 7`;
    nodes.classed('articulation',d=>cuts.has(d.id)).classed('selected',d=>selected===d);
    const win=cover===roles.length&&cuts.size===0;
    document.getElementById('shell').classList.toggle('success',win);
    if(win&&!completed){completed=true;document.getElementById('goalTitle').textContent='能力已分布到网络';setStatus('完成：逐个移除任一角色，余下网络仍保持连通。');faultScan();}
  }
  function faultScan(){if(Deck.reduced())return;let i=0;const timer=setInterval(()=>{nodes.classed('failed',(d,j)=>j===i);i++;if(i>roles.length){clearInterval(timer);nodes.classed('failed',false);}},420);}
  function reject(msg){setStatus(msg);document.getElementById('shell').classList.remove('shake');void document.getElementById('shell').offsetWidth;document.getElementById('shell').classList.add('shake');}
  function connect(a,b){
    if(!a||!b||a===b){reject('这条线没有连接新的角色。');return;}
    if(links.some(l=>ids(l).includes(a.id)&&ids(l).includes(b.id))){reject('这条线已经存在，没有连接新的角色。');return;}
    if(links.length>=7){reject('线路已用完，请重置后重接关键关系。');return;}
    links.push({source:a,target:b});simulation.force('link').links(links);setStatus(`${a.role}与${b.role}现在可以双向交换并复核信息。`);render([a.id,b.id].sort().join('-'));
  }
  function point(event){const p=d3.pointer(event,svg.node());return {x:p[0],y:p[1]};}
  nodes.on('pointerdown',function(event,d){event.preventDefault();dragging=d;const p=point(event);tempLayer.append('line').attr('class','temp-link').attr('x1',d.x).attr('y1',d.y).attr('x2',p.x).attr('y2',p.y);this.setPointerCapture&&this.setPointerCapture(event.pointerId);})
    .on('pointermove',function(event){if(!dragging)return;const p=point(event);tempLayer.select('line').attr('x2',p.x).attr('y2',p.y);})
    .on('pointerup',function(event){if(!dragging)return;const p=point(event),target=roles.find(n=>Math.hypot(n.x-p.x,n.y-p.y)<68);tempLayer.selectAll('*').remove();connect(dragging,target);dragging=null;})
    .on('keydown',function(event,d){if(event.key==='Enter'||event.key===' '){event.preventDefault();if(!selected){selected=d;setStatus(`已选择${d.role}；再选择另一个角色。`);}else{const a=selected;selected=null;connect(a,d);}render();}if(event.key==='Escape'){selected=null;setStatus('已取消端点选择。');render();}});
  document.getElementById('reset').addEventListener('click',()=>{links=[];selected=null;completed=false;simulation.force('link').links(links);document.getElementById('goalTitle').textContent='架设一座跨溪步桥';setStatus('从一个角色端口拖到另一个角色，建立信息连接。');render();});
  render();
})();
</script>
</body>
</html>
