<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:28px 42px 30px;gap:18px;overflow:hidden}
  .top{height:92px;display:flex;align-items:flex-start;justify-content:space-between;gap:32px}
  .kicker{color:var(--teal);font:700 var(--fs-label)/1.3 var(--font-mono);letter-spacing:.12em;margin-bottom:6px}
  .take{max-width:720px;color:var(--teal-soft);font-size:var(--fs-lead);line-height:var(--lh-copy);text-align:right;padding-top:19px}
  .progress{min-width:180px;text-align:right;color:var(--amber);font:700 var(--fs-body)/1.3 var(--font-mono)}
  .workspace{display:flex;gap:22px;min-height:0}
  .classification-wrap{flex:1.15;position:relative;min-width:0;display:flex;align-items:center;justify-content:center}
  .k-classification.rings{width:100%;height:100%;display:block;position:relative}
  .rings .box{position:absolute;border-radius:50%;padding:0;display:flex;align-items:flex-start;justify-content:center;transition:border-color .25s,box-shadow .25s}
  .rings .box>.bt{position:absolute;z-index:3;margin:0;min-height:34px;padding:5px 14px;border:1px solid var(--line-strong);border-radius:999px;background:var(--panel-hi);font-size:var(--fs-h2)}
  .group{inset:1% 3%;border-color:var(--teal-dim);background:var(--panel-hi)}
  .tool{inset:14% 16%;border-color:var(--line-strong);background:var(--panel)}
  .brain{inset:30% 31%;border-color:var(--amber-deep);background:var(--panel-deep)}
  .group>.bt{top:12px}.tool>.bt{top:18px}.brain>.bt{top:24px}
  .count{margin-left:10px;color:var(--ink-muted);font:650 var(--fs-label)/1 var(--font-mono)}
  .dropzone{outline:none}
  .dropzone:focus-visible,.dropzone.is-aim{border-color:var(--amber);box-shadow:0 0 0 4px rgba(255,181,71,.16)}
  .dropzone.complete{border-color:var(--teal);box-shadow:0 0 26px rgba(54,214,192,.13)}
  .placed{position:absolute;z-index:4;max-width:245px;padding:7px 11px;border:1px solid var(--teal-dim);border-radius:var(--r-sm);background:var(--panel-hi);color:var(--teal-soft);font-size:var(--fs-label);line-height:1.3}
  .group .placed:nth-of-type(2){left:7%;top:29%}.group .placed:nth-of-type(3){right:7%;top:29%}.group .placed:nth-of-type(4){left:9%;bottom:19%}.group .placed:nth-of-type(5){right:9%;bottom:19%}
  .tool .placed:nth-of-type(2){left:9%;top:34%}.tool .placed:nth-of-type(3){right:9%;top:34%}.tool .placed:nth-of-type(4){left:30%;bottom:10%}
  .brain .placed:nth-of-type(2){left:10%;right:10%;top:45%;text-align:center;max-width:none}
  .layer-cue{position:absolute;z-index:2;padding:8px 12px;border:1px dashed var(--line-strong);border-radius:999px;color:var(--ink-muted);background:var(--panel-deep);font-size:var(--fs-sec);line-height:1.35}
  .group>.cue-a{left:7%;top:48%}.group>.cue-b{right:7%;top:48%}.group>.cue-c{left:41%;bottom:7%}
  .tool>.cue-a{left:8%;top:49%}.tool>.cue-b{right:8%;top:49%}.tool>.cue-c{left:39%;bottom:8%}
  .brain>.cue-a{left:15%;top:37%}.brain>.cue-b{right:15%;bottom:18%}
  .body-mark{position:absolute;left:50%;top:43%;width:54px;height:132px;transform:translateX(-50%);border:2px solid var(--line-strong);border-radius:45% 45% 36% 36%;opacity:.52;pointer-events:none}
  .body-mark:before{content:"";position:absolute;width:42px;height:42px;left:4px;top:-45px;border:2px solid var(--amber-deep);border-radius:50%}
  .ring-note{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:86%;text-align:center;color:var(--ink-muted);font-size:var(--fs-sec)}
  .tray{flex:.85;min-width:0;display:flex;flex-direction:column;gap:12px;padding:18px}
  .tray-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .instruction{color:var(--ink-muted);font-size:var(--fs-sec);line-height:var(--lh-copy)}
  .tasks{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden}
  .task-row{display:flex;align-items:center;gap:9px;min-height:0}
  .task-type{flex:0 0 48px;color:var(--ink-faint);font-size:var(--fs-label);font-weight:700;text-align:right}
  .task{flex:1;min-width:0;padding:8px 12px;border:2px solid var(--amber-deep);border-radius:var(--r-sm);background:rgba(255,181,71,.08);color:var(--text);font-size:var(--fs-sec);line-height:1.35;cursor:grab;outline:none;transition:transform .18s,border-color .18s,opacity .18s}
  .task:hover,.task:focus-visible,.task.selected{border-color:var(--amber);background:rgba(255,181,71,.14)}
  .task.done{opacity:0;pointer-events:none;min-height:0;padding-top:0;padding-bottom:0;border-width:0;height:0;overflow:hidden}
  .task.wrong{animation:shake .26s linear}
  @keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
  .feedback{min-height:48px;padding:8px 12px;border-left:4px solid var(--line-strong);color:var(--ink-muted);font-size:var(--fs-sec);line-height:1.4}
  .feedback.good{border-color:var(--teal);color:var(--teal-soft)}
  .finish{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:430px;padding:20px;text-align:center;border:2px solid var(--teal);border-radius:var(--r-md);background:var(--panel-hi);box-shadow:0 18px 60px var(--shadow);display:none}
  .finish.show{display:block}.finish strong{display:block;color:var(--teal);font-size:var(--fs-h2);margin-bottom:7px}
  @media(prefers-reduced-motion:reduce){.task,.rings .box{transition:none}.task.wrong{animation:none}}
</style>
</head>
<body data-page="18" data-total="45">
<div id="stage">
  <header class="top shrink0">
    <div><div class="kicker">BODY-OUTSIDE MEMORY · 18</div><h1>把思考放到身体之外</h1></div>
    <p class="take">文字、清单、仪器和制度把认知工作分散到人脑之外。</p>
  </header>
  <main class="workspace grow min0">
    <section class="classification-wrap panel min0" aria-label="认知工作的三层分类">
      <div class="k-classification rings" id="rings">
        <svg class="diagram" aria-hidden="true" viewBox="0 0 760 610" style="position:absolute;inset:0;width:100%;height:100%;opacity:.55">
          <path d="M74 148 L182 92 L310 128 L438 78 L574 126 L684 214 L654 382 L548 510 L388 548 L232 518 L96 414 Z"/>
          <path d="M74 148 L310 128 L574 126 L654 382 L388 548 L96 414 M182 92 L438 78 L684 214 L548 510 L232 518 Z" stroke-dasharray="7 9"/>
          <circle cx="74" cy="148" r="8"/><circle cx="182" cy="92" r="8"/><circle cx="310" cy="128" r="8"/><circle cx="438" cy="78" r="8"/><circle cx="574" cy="126" r="8"/><circle cx="684" cy="214" r="8"/><circle cx="654" cy="382" r="8"/><circle cx="548" cy="510" r="8"/><circle cx="388" cy="548" r="8"/><circle cx="232" cy="518" r="8"/><circle cx="96" cy="414" r="8"/>
        </svg>
        <div class="box group dropzone" data-layer="群体" tabindex="0" role="button" aria-label="群体层，放置所选任务">
          <div class="bt">群体 <span class="count" data-count="群体">0</span></div>
          <span class="layer-cue cue-a">多人分工</span><span class="layer-cue cue-b">交接延续</span><span class="layer-cue cue-c">相互校验</span>
          <div class="box tool dropzone" data-layer="工具" tabindex="0" role="button" aria-label="工具层，放置所选任务">
            <div class="bt">工具 <span class="count" data-count="工具">0</span></div>
            <span class="layer-cue cue-a">固定方位</span><span class="layer-cue cue-b">装置提醒</span><span class="layer-cue cue-c">纸面保存</span>
            <div class="box brain dropzone" data-layer="脑内" tabindex="0" role="button" aria-label="脑内层，放置所选任务">
              <div class="bt">脑内 <span class="count" data-count="脑内">0</span></div>
              <span class="layer-cue cue-a">个人记忆</span><span class="layer-cue cue-b">主观估计</span>
              <div class="body-mark" aria-hidden="true"></div>
            </div>
          </div>
        </div>
        <div class="ring-note">分类依据：主要认知工作由谁承担，而不是任务发生在哪里。</div>
        <div class="finish" id="finish" aria-live="polite"><strong>一颗大脑之外，还有工具与群体</strong><span class="secondary">能力属于“人—物—制度”的组合。</span></div>
      </div>
    </section>
    <section class="panel tray min0 no-pan" aria-label="待分类任务">
      <div class="tray-head"><div><h2>把任务放入主要承担层</h2><p class="instruction">点击任务再点圆环，或直接拖放。键盘可用方向键选层，按 Enter 放置。</p></div><div class="progress" id="progress">已归位 0/8</div></div>
      <div class="tasks" id="tasks"></div>
      <div class="feedback" id="feedback" aria-live="polite">先看是谁在保存、计时、导航或核对。</div>
      <button class="btn self-end" id="reset" type="button">重新分类</button>
    </section>
  </main>
  <footer style="height:60px" class="row items-center justify-center shrink0">
    <p class="lead">文字、清单、仪器和制度并非只“帮助”大脑；它们实际承担了导航、提醒、保存和校验的一部分认知工作。</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Deck.init({index:18,total:45});
const layers=['脑内','工具','群体'];
const items=[
 ['导航','凭脑中的校园印象找回教室','脑内','路线暂存在个人空间记忆中'],
 ['导航','用地图与指南针确定路线','工具','方位关系被固定在图与仪器上'],
 ['导航','轮班领航并交叉报点','群体','定位与纠错分给多人'],
 ['计时','心里估计一分钟','脑内','时长依赖个人感觉'],
 ['计时','用闹钟提醒下一项任务','工具','提醒被交给计时装置'],
 ['记忆','把待办写成可勾选清单','工具','顺序与遗漏检查留在纸面'],
 ['记忆','用交接制度延续未完成事项','群体','记忆跨越个人与班次'],
 ['计算','两人独立计算后核对结果','群体','计算与查错分布在协作规则中']
];
const tasks=document.getElementById('tasks'), feedback=document.getElementById('feedback'), progress=document.getElementById('progress');
let selected=null, aimed=0, done=0;
function makeTasks(){tasks.innerHTML='';items.forEach((it,i)=>{const row=document.createElement('div');row.className='task-row';row.innerHTML=`<span class="task-type">${it[0]}</span><div class="task" role="button" tabindex="0" draggable="true" data-i="${i}" aria-label="${it[1]}，待分类">${it[1]}</div>`;tasks.appendChild(row)});bindTasks()}
function select(el){document.querySelectorAll('.task').forEach(x=>x.classList.remove('selected'));selected=el;el.classList.add('selected');aimed=0;aim()}
function aim(){document.querySelectorAll('.dropzone').forEach(z=>z.classList.toggle('is-aim',selected&&z.dataset.layer===layers[aimed]))}
function place(el,layer){if(!el||el.classList.contains('done'))return;const it=items[+el.dataset.i];if(it[2]!==layer){el.classList.remove('wrong');void el.offsetWidth;el.classList.add('wrong');feedback.className='feedback';feedback.textContent='这里按主要承担认知工作的对象分类：再看是谁在保存、计时或核对。';return}const zone=document.querySelector(`.dropzone[data-layer="${layer}"]`);const note=document.createElement('div');note.className='placed';note.textContent=it[3];zone.appendChild(note);el.classList.add('done');el.classList.remove('selected');done++;document.querySelector(`[data-count="${layer}"]`).textContent=zone.querySelectorAll(':scope > .placed').length;progress.textContent=`已归位 ${done}/${items.length}`;feedback.className='feedback good';feedback.textContent=it[3];selected=null;aim();if(done===items.length){document.querySelectorAll('.dropzone').forEach(z=>z.classList.add('complete'));document.getElementById('finish').classList.add('show')}}
function bindTasks(){document.querySelectorAll('.task').forEach(el=>{el.addEventListener('click',()=>select(el));el.addEventListener('dragstart',e=>{select(el);e.dataTransfer.setData('text/plain',el.dataset.i)});el.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();select(el);aimed=(aimed+1)%layers.length;aim()}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();select(el);aimed=(aimed+layers.length-1)%layers.length;aim()}if(e.key==='Enter'||e.key===' '){e.preventDefault();if(selected===el)place(el,layers[aimed]);else select(el)}})})}
document.querySelectorAll('.dropzone').forEach(z=>{z.addEventListener('dragover',e=>e.preventDefault());z.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();place(document.querySelector(`.task[data-i="${e.dataTransfer.getData('text/plain')}"]`),z.dataset.layer)});z.addEventListener('click',e=>{e.stopPropagation();place(selected,z.dataset.layer)});z.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&selected){e.preventDefault();place(selected,z.dataset.layer)}})});
document.getElementById('reset').addEventListener('click',()=>{done=0;selected=null;document.querySelectorAll('.placed').forEach(x=>x.remove());document.querySelectorAll('.dropzone').forEach(z=>z.classList.remove('complete','is-aim'));document.querySelectorAll('.count').forEach(x=>x.textContent='0');progress.textContent=`已归位 ${done}/${items.length}`;feedback.className='feedback';feedback.textContent='先看是谁在保存、计时、导航或核对。';document.getElementById('finish').classList.remove('show');makeTasks()});
makeTasks();
</script>
</body>
</html>
