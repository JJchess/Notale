<style>
.hero{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--panel-deep)}
.hero-photo{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);object-fit:cover;object-position:50% 42%;border:1px solid var(--line-strong);filter:saturate(.82) contrast(1.08)}

.heading{position:absolute;z-index:4;top:54px;left:64px;width:600px}
.kicker{margin-bottom:10px;color:var(--teal);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.14em}
.heading h1{font-size:52px}
.heading .lead{margin-top:18px;width:570px;font-size:22px}
.map{position:absolute;z-index:3;inset:0}

.ring-copy strong{display:block;color:var(--amber);font-size:var(--fs-label);letter-spacing:.06em}
.supports{position:absolute!important;left:64px;top:280px;width:610px;display:flex!important;flex-direction:column;gap:20px!important}
.support{position:relative!important;padding:12px 18px 12px 40px!important;border:1px solid var(--line)!important;border-left:3px solid var(--teal-dim)!important;border-radius:0 var(--r-sm) var(--r-sm) 0!important;background:linear-gradient(90deg,rgba(13,27,36,.92),rgba(13,27,36,.42))!important;color:var(--text)!important;min-height:86px}
.support::before{content:""!important;position:absolute!important;left:12px!important;top:20px!important;width:10px!important;height:10px!important;border:2px solid var(--teal)!important;border-radius:50%;background:var(--bg)!important}
.support::after{content:""!important;position:absolute!important;left:24px!important;top:25px!important;width:var(--line-w)!important;height:1px!important;background:var(--teal-dim)!important;transform:rotate(var(--angle))!important;transform-origin:left center!important}
.support b{display:block;color:var(--teal-soft);font-size:var(--fs-body);line-height:1.35}
.support span{display:block;margin-top:3px;color:var(--ink-muted);font-size:var(--fs-sec);line-height:1.45}
.s1{--line-w:690px;--angle:-8deg}.s2{--line-w:660px;--angle:0deg}.s3{--line-w:705px;--angle:8deg}.s4{--line-w:740px;--angle:15deg}
.anchor{position:absolute;width:14px;height:14px;border:3px solid var(--amber);border-radius:50%;box-shadow:0 0 0 6px rgba(255,181,71,.14)}
.a1{left:1010px;top:309px}.a2{left:1008px;top:444px}.a3{left:1064px;top:558px}.a4{left:1132px;top:674px}
.anchor-label{position:absolute;color:var(--amber-soft);font-size:var(--fs-label);font-weight:700;text-shadow:0 2px 8px var(--bg)}
.al1{left:1034px;top:296px}.al2{left:1032px;top:430px}.al3{left:1088px;top:544px}.al4{left:1156px;top:660px}
.claim{position:absolute!important;z-index:5;left:64px;right:64px;bottom:34px;padding:16px 24px!important;background:rgba(13,27,36,.9)!important;border-left:8px solid var(--teal)!important;font-size:var(--fs-lead)!important}
.claim small{display:block;margin-top:4px;color:var(--ink-muted);font-size:var(--fs-sec);font-weight:500;line-height:1.45}
@keyframes photo-in{from{transform:scale(1.02)}to{transform:scale(1)}}
@keyframes ring-in{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.hero-photo,.ring{animation:none}}
</style>
