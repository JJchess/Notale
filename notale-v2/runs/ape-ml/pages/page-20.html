<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page-head{height:116px;padding:26px 44px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:32px}
  .kicker{color:var(--teal);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em;margin-bottom:6px}
  .head-copy{max-width:760px;color:var(--ink-muted);font-size:var(--fs-sec);line-height:var(--lh-copy);margin-top:6px}
  .status{width:220px;align-items:flex-end;gap:8px}
  .status .value{font-size:var(--fs-h2);font-family:var(--font-mono);color:var(--teal)}
  .segments{display:flex;width:220px;gap:6px}
  .segments i{height:7px;flex:1;border:1px solid var(--teal-dim);border-radius:999px;background:var(--panel-deep);transition:background 220ms ease,border-color 220ms ease}
  .segments i.off{background:var(--amber);border-color:var(--amber)}
  .console{position:relative;margin:0 44px 18px;min-height:0;overflow:hidden;border:2px solid var(--line);border-radius:var(--r-lg);background:linear-gradient(180deg,rgba(21,43,54,.42),transparent 24%),var(--panel-deep);box-shadow:inset 0 1px 0 var(--line-strong),0 18px 38px var(--shadow)}
  .console:before{content:"BODY / ENVIRONMENT INTERFACE";position:absolute;left:22px;top:16px;color:var(--ink-faint);font:700 var(--fs-tick)/1.35 var(--font-mono);letter-spacing:.13em}
  .console:after{content:"SYS–20";position:absolute;right:22px;bottom:14px;color:var(--ink-faint);font:700 var(--fs-tick)/1.35 var(--font-mono)}
  .diagram-wrap{position:absolute;inset:0}
  svg{width:100%;height:100%;display:block}
  .ring-base{fill:none;stroke:var(--line-strong);stroke-width:2;stroke-dasharray:7 10}
  .ring-seg{fill:none;stroke:var(--teal-dim);stroke-width:8;stroke-linecap:round;transition:stroke 220ms ease,filter 220ms ease}
  .ring-seg.off{stroke:var(--amber);filter:drop-shadow(0 0 7px var(--amber))}
  .earth{fill:var(--panel-hi);stroke:var(--teal);stroke-width:4}
  .person{fill:rgba(54,214,192,.035);stroke:var(--teal-soft);stroke-width:2.4}
  .inner{fill:none;stroke:var(--teal-dim);stroke-width:2}
  .skeleton{fill:none;stroke:var(--line-strong);stroke-width:3;stroke-linecap:round}
  .organ{fill:var(--panel);stroke:var(--teal-dim);stroke-width:2;transition:stroke 220ms ease,fill 220ms ease,filter 220ms ease}
  .organ.active{fill:rgba(255,181,71,.14);stroke:var(--amber);filter:drop-shadow(0 0 6px var(--amber))}
  .route{fill:none;stroke:var(--amber);stroke-width:2.5;stroke-dasharray:7 8;opacity:0;transition:opacity 200ms ease}
  .route.active{opacity:1;animation:flow 900ms linear infinite}
  @keyframes flow{to{stroke-dashoffset:-30}}
  .switches{position:absolute;inset:0;pointer-events:none}
  .switch{position:absolute;width:208px;min-height:82px;padding:11px 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);color:var(--text);background:linear-gradient(180deg,var(--panel-hi),var(--panel));box-shadow:0 8px 15px var(--shadow),inset 0 1px 0 var(--line-strong),inset 0 -2px 3px var(--shadow);cursor:pointer;pointer-events:auto;text-align:left;transition:transform 180ms ease,border-color 200ms ease,box-shadow 200ms ease}
  .switch:hover{border-color:var(--teal)} .switch:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .switch.off{transform:translateY(2px);border-color:var(--amber);box-shadow:inset 0 5px 10px var(--shadow),0 2px 6px var(--shadow)}
  .switch .top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:var(--fs-sec);font-weight:750;line-height:1.35}
  .lamp{width:13px;height:13px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);flex:none}.off .lamp{background:var(--amber);box-shadow:0 0 10px var(--amber)}
  .state{font:700 var(--fs-label)/1.4 var(--font-mono);color:var(--teal);margin-top:4px}.off .state{color:var(--amber)}
  .impact{display:none;color:var(--amber-soft);font-size:var(--fs-label);line-height:1.35;margin-top:4px}.off .impact{display:block}
  .s-gravity{left:55px;top:116px}.s-pressure{left:87px;bottom:90px}.s-oxygen{left:50%;bottom:28px;transform:translateX(-50%)}.s-oxygen.off{transform:translate(-50%,2px)}.s-magnetic{right:87px;bottom:90px}.s-daynight{right:55px;top:116px}
  .center-message{position:absolute;left:50%;top:43%;width:330px;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
  .center-message strong{display:block;font-size:var(--fs-lead);line-height:1.4;color:var(--amber-soft);opacity:0;transition:opacity 260ms ease}.center-message strong.show{opacity:1}
  .center-message span{display:block;color:var(--ink-muted);font-size:var(--fs-label);line-height:1.4;margin-top:6px}
  .bottom{height:92px;padding:0 44px 24px;display:flex;align-items:center;gap:24px}
  .bottom .claim{flex:1;padding-left:18px;border-left:6px solid var(--teal);font-size:var(--fs-lead);font-weight:650;line-height:1.45}
  .bottom .claim span{color:var(--teal-soft)}
  .reset{min-width:190px}
  .shake{animation:shake 240ms ease}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="20" data-total="45">
<div id="stage">
  <header class="page-head shrink0">
    <div><div class="kicker">III · EARTH DEFAULTS</div><h1>你一直在使用地球</h1><p class="head-copy">关闭任一默认条件，观察它原本接入身体的哪些系统。</p></div>
    <div class="status col" aria-live="polite"><span class="label">地球默认项</span><span class="value" id="count">已关闭 0/5</span><div class="segments" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>
  </header>
  <main class="console grow min0 no-pan" aria-label="人体环境控制台">
    <div class="diagram-wrap">
      <svg viewBox="0 0 1512 650" role="img" aria-label="人体站在地球弧面上，五个地球条件围绕身体并连接受影响系统">
        <path class="earth" d="M382 665 Q756 452 1130 665 Z"/>
        <circle class="ring-base" cx="756" cy="326" r="264"/>
        <path id="seg0" class="ring-seg" d="M520 207 A264 264 0 0 1 610 106"/><path id="seg1" class="ring-seg" d="M498 382 A264 264 0 0 1 501 270"/><path id="seg2" class="ring-seg" d="M650 566 A264 264 0 0 1 862 566"/><path id="seg3" class="ring-seg" d="M1011 270 A264 264 0 0 1 1014 382"/><path id="seg4" class="ring-seg" d="M902 106 A264 264 0 0 1 992 207"/>
        <path id="route-gravity" class="route" d="M275 160 H540 Q600 160 650 275 L718 330"/><path id="route-pressure" class="route" d="M300 515 H515 Q590 515 675 370"/><path id="route-oxygen" class="route" d="M756 590 V440 L800 355"/><path id="route-magnetic" class="route" d="M1212 515 H1000 Q925 515 865 300"/><path id="route-daynight" class="route" d="M1237 160 H970 Q910 160 848 210"/>
        <circle class="person" cx="756" cy="197" r="45"/><path class="person" d="M710 244 Q756 224 802 244 L827 388 800 440 789 592 H750 L744 443 723 592 H684 L696 438 675 388 Z"/>
        <path class="skeleton" d="M756 245 V432 M714 290 L798 290 M756 326 L682 404 M756 326 L830 404 M756 432 L705 580 M756 432 L777 580"/>
        <path class="inner" d="M720 244 Q756 265 792 244 M713 442 Q756 457 799 442"/>
        <circle id="org-brain" class="organ" cx="756" cy="190" r="25"/><circle id="org-eye" class="organ" cx="774" cy="186" r="5"/><circle id="org-ear" class="organ" cx="723" cy="198" r="7"/>
        <path id="org-lung" class="organ" d="M751 280 Q706 270 708 342 Q712 378 751 352 Z M761 280 Q806 270 804 342 Q800 378 761 352 Z"/>
        <path id="org-blood" class="organ" d="M756 246 V423 M731 328 H781"/>
        <path id="org-bone" class="organ" d="M700 440 L688 578 M790 440 L784 578 M690 405 L826 405"/>
        <path id="org-body" class="organ" d="M705 247 Q756 224 807 247 L833 390 803 444 790 594 H682 L696 444 670 390 Z"/>
      </svg>
    </div>
    <div class="switches k-enumeration" style="--enum-cols:5" aria-label="五个并列的地球默认条件">
      <button class="switch it s-gravity" data-id="gravity" aria-pressed="false"><span class="top">重力<span class="lamp"></span></span><span class="state">供给中</span><span class="impact">定向与长期负荷改变</span></button>
      <button class="switch it s-pressure" data-id="pressure" aria-pressed="false"><span class="top">气压<span class="lamp"></span></span><span class="state">供给中</span><span class="impact">无法维持正常压力环境</span></button>
      <button class="switch it s-oxygen" data-id="oxygen" aria-pressed="false"><span class="top">氧气<span class="lamp"></span></span><span class="state">供给中</span><span class="impact">供氧中断</span></button>
      <button class="switch it s-magnetic" data-id="magnetic" aria-pressed="false"><span class="top">磁场屏蔽<span class="lamp"></span></span><span class="state">供给中</span><span class="impact">高能粒子暴露风险上升</span></button>
      <button class="switch it s-daynight" data-id="daynight" aria-pressed="false"><span class="top">昼夜线索<span class="lamp"></span></span><span class="state">供给中</span><span class="impact">生物钟失去熟悉校时信号</span></button>
    </div>
    <div class="center-message"><strong id="complete">人体依赖的是一整套地球条件</strong><span id="hint" aria-live="polite">拨动外环开关，显现一条依赖</span></div>
  </main>
  <footer class="bottom shrink0"><p class="claim">人体不是独立运行的机器。<span>它每一刻都在使用地球提供的条件。</span></p><button id="reset" class="btn reset">恢复地球默认项</button></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  Deck.init({index:20,total:45});
  const ids=['gravity','pressure','oxygen','magnetic','daynight'];
  const organs={gravity:['org-ear','org-bone','org-body'],pressure:['org-lung','org-body','org-blood'],oxygen:['org-lung','org-blood','org-brain','org-body'],magnetic:['org-body'],daynight:['org-eye','org-brain']};
  const off=new Set();
  const buttons=[...document.querySelectorAll('.switch')];
  function render(){
    buttons.forEach((b,i)=>{const active=off.has(b.dataset.id);b.classList.toggle('off',active);b.setAttribute('aria-pressed',String(active));b.querySelector('.state').textContent=active?'已关闭':'供给中';document.getElementById('seg'+i).classList.toggle('off',active);document.getElementById('route-'+b.dataset.id).classList.toggle('active',active)});
    document.querySelectorAll('.organ').forEach(x=>x.classList.remove('active'));
    off.forEach(id=>organs[id].forEach(x=>document.getElementById(x).classList.add('active')));
    document.getElementById('count').textContent=`已关闭 ${off.size}/${ids.length}`;
    document.querySelectorAll('.segments i').forEach((x,i)=>x.classList.toggle('off',i<off.size));
    const done=off.size===ids.length;document.getElementById('complete').classList.toggle('show',done);document.getElementById('hint').textContent=done?'五条并列依赖已全部显现':'拨动外环开关，显现一条依赖';
  }
  buttons.forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.id;if(off.has(id)){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');document.getElementById('hint').textContent='这一默认项已关闭，请观察它连接到哪些系统';return}off.add(id);render()}));
  document.getElementById('reset').addEventListener('click',()=>{off.clear();render();buttons[0].focus()});
  render();
})();
</script>
</body>
</html>
