<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:32px 42px 28px;gap:20px}
  .eyebrow{color:var(--teal);font:700 var(--fs-label)/1.3 var(--font-mono);letter-spacing:.12em}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
  .headcopy{display:flex;flex-direction:column;gap:7px}
  .progress{align-self:center;min-width:190px;text-align:right}
  .main{display:flex;gap:22px;min-height:0}
  .scene{position:relative;flex:1.38;min-width:0;overflow:hidden;padding:0;background:var(--panel-deep)}
  .scene canvas{z-index:1}
  .scene-label{position:absolute;z-index:2;top:18px;left:20px}
  .vector-label{position:absolute;z-index:2;right:22px;top:22px;color:var(--teal-soft);font-size:var(--fs-label);font-weight:700}
  .contact-label{position:absolute;z-index:2;left:22px;bottom:20px;color:var(--amber-soft);font-size:var(--fs-label);font-weight:700}
  .right{flex:.92;min-width:0;display:flex;flex-direction:column;gap:14px}
  .k-process.vertical{gap:5px;flex:1}
  .k-process.vertical>.step{display:flex;align-items:center;gap:14px;padding:10px 14px;min-height:58px;transition:border-color .22s ease,background .22s ease}
  .n{display:grid;place-items:center;flex:0 0 30px;height:30px;border:1px solid var(--teal-dim);border-radius:50%;color:var(--teal);font:700 var(--fs-label)/1 var(--font-mono)}
  .step.current .n{color:var(--bg);background:var(--amber);border-color:var(--amber)}
  .step strong{display:block;font-size:var(--fs-sec);line-height:1.35}
  .step span{display:block;color:var(--ink-muted);font-size:var(--fs-label);line-height:1.35}
  .k-process.vertical>.arw{flex-basis:18px;font-size:18px}
  .readrow{display:flex;gap:12px}
  .readrow>*{flex:1}
  .mass{border-color:var(--line-strong)}
  .mass .value{color:var(--text)}
  .mass.complete{border-color:var(--amber);box-shadow:0 0 22px rgba(255,181,71,.16)}
  .controls{display:flex;align-items:center;gap:20px;padding:14px 18px}
  .controlset{display:flex;align-items:center;gap:12px;min-width:0}
  .controlset.range{flex:1}
  .controlset label{color:var(--ink-muted);font-size:var(--fs-label);font-weight:650;white-space:nowrap}
  input[type=range]{flex:1;min-width:130px;accent-color:var(--teal)}
  select{height:42px;padding:0 10px;color:var(--text);font:650 var(--fs-label) var(--font-sans);border:2px solid var(--line-strong);border-radius:var(--r-sm);background:var(--panel-deep)}
  .val{min-width:66px;color:var(--teal-soft);font:700 var(--fs-body) var(--font-mono)}
  .feedback{min-width:300px;color:var(--ink-muted);font-size:var(--fs-sec);line-height:1.4}
  .feedback.good{color:var(--success)} .feedback.bad{color:var(--amber-soft)}
  .shake{animation:shake .22s linear 2}
  @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="21" data-total="45">
<div id="stage">
  <header class="head" style="height:78px">
    <div class="headcopy"><div class="eyebrow">EARTH DEPENDENCE 02</div><h1>发射时为什么会“变重”？</h1><p class="lead">座椅迫使身体改变速度；增加的是支撑力，不是质量。</p></div>
    <div class="progress"><div class="label">观察点</div><div id="progress" class="h2 mono" aria-live="polite">0 / 3</div></div>
  </header>

  <main class="main min0" style="flex:1">
    <section class="scene panel min0 no-pan" aria-label="加速度座椅侧视物理场">
      <canvas id="sim" class="cv-fill"></canvas>
      <div class="scene-label chip">发射舱侧视</div>
      <div id="vectorLabel" class="vector-label">座椅加速度：向上 1.5 g</div>
      <div id="contactLabel" class="contact-label">等待启动</div>
    </section>

    <aside class="right min0">
      <div id="chain" class="k-process vertical min0" aria-label="从加速度到感觉的四步因果链">
        <div class="axis"></div>
        <div class="step"><b class="n">1</b><div><strong>座椅获得加速度</strong><span>方向与大小由下方控制</span></div></div><div class="arw"></div>
        <div class="step"><b class="n">2</b><div><strong>身体的速度必须随之改变</strong><span>身体先滞后，再被约束带动</span></div></div><div class="arw"></div>
        <div class="step"><b class="n">3</b><div><strong>座椅或安全带对身体施力</strong><span>合负荷所指的约束承受压力</span></div></div><div class="arw"></div>
        <div class="step"><b class="n">4</b><div><strong>支撑力改变，于是感觉“变重”</strong><span id="summary">启动后读取支撑力</span></div></div>
      </div>
      <div class="readrow" style="height:92px">
        <div class="readout is-target"><span class="label">支撑力</span><strong id="support" class="value">— N｜— g</strong></div>
        <div id="mass" class="readout mass"><span class="label">质量没有增加</span><strong class="value">70 kg｜未改变</strong></div>
      </div>
    </aside>
  </main>

  <section class="controls panel" style="height:102px" aria-label="座椅控制台">
    <div class="controlset range"><label for="gCtl">加速度大小</label><input id="gCtl" type="range" min="0" max="3" step="0.1" value="1.5"><output id="gVal" class="val">1.5 g</output></div>
    <div class="controlset range"><label for="dirCtl">方向</label><input id="dirCtl" type="range" min="-180" max="180" step="15" value="-90"><output id="dirVal" class="val">向上</output></div>
    <div class="controlset"><label for="guess">先预测压力最大处</label><select id="guess"><option value="back">椅背</option><option value="belt">安全带</option><option value="sideL">左侧约束</option><option value="sideR">右侧约束</option></select></div>
    <button id="run" class="btn btn-primary">启动座椅</button><button id="reset" class="btn">重置座椅</button>
    <div id="feedback" class="feedback" aria-live="polite">调节大小与方向，先预测接触区，再启动。</div>
  </section>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script>
(function(){
  Deck.init({index:21,total:45});
  var E=Matter.Engine, B=Matter.Bodies, C=Matter.Constraint, Comp=Matter.Composite, Body=Matter.Body;
  var engine=E.create({gravity:{x:0,y:1,scale:0.001},enableSleeping:false});
  engine.positionIterations=8; engine.velocityIterations=6;
  var cv=document.getElementById('sim'), ctx, W=900,H=600;
  var torso=B.rectangle(410,285,72,180,{friction:.15,restitution:.06,density:.002});
  var head=B.circle(408,162,40,{friction:.1,density:.0015});
  var chairBack=B.rectangle(320,300,34,300,{isStatic:true});
  var seat=B.rectangle(435,450,250,34,{isStatic:true});
  var neck=C.create({bodyA:torso,pointA:{x:0,y:-88},bodyB:head,pointB:{x:0,y:34},stiffness:.86,length:8});
  var belt=C.create({bodyA:torso,pointA:{x:-30,y:10},pointB:{x:320,y:330},stiffness:.12,length:70});
  var belt2=C.create({bodyA:torso,pointA:{x:30,y:10},pointB:{x:500,y:330},stiffness:.12,length:70});
  Comp.add(engine.world,[torso,head,chairBack,seat,neck,belt,belt2]);
  var gCtl=document.getElementById('gCtl'),dirCtl=document.getElementById('dirCtl'),guess=document.getElementById('guess');
  var support=document.getElementById('support'), summary=document.getElementById('summary'), feedback=document.getElementById('feedback');
  var steps=[].slice.call(document.querySelectorAll('#chain .step')), running=false, phase=0, active='back', completed={};
  function dirName(d){if(d===-90)return '向上';if(d===90)return '向下';if(d===0)return '向右';if(Math.abs(d)===180)return '向左';return d+'°'}
  function calc(){var gv=+gCtl.value,d=+dirCtl.value,rad=d*Math.PI/180,a=Lec.K.EARTH_SURFACE_GRAVITY*gv;var ge=Math.hypot(-a*Math.cos(rad),Lec.K.EARTH_SURFACE_GRAVITY-a*Math.sin(rad));return {gv:gv,d:d,rad:rad,ge:ge,n:Lec.P.weight(70,ge),mult:Lec.P.accelerationInG(ge)} }
  function actualContact(q){var x=-q.gv*Math.cos(q.rad), y=1-q.gv*Math.sin(q.rad);if(Math.abs(x)>Math.abs(y))return x>0?'sideL':'sideR';return y>=0?'back':'belt'}
  function fmt(v,s){return Number(v).toPrecision(s)}
  function labels(){var q=calc();document.getElementById('gVal').textContent=q.gv.toFixed(1)+' g';document.getElementById('dirVal').textContent=dirName(q.d);document.getElementById('vectorLabel').textContent='座椅加速度：'+dirName(q.d)+' '+q.gv.toFixed(1)+' g'}
  function resize(){ctx=Deck.fit(cv);W=cv.clientWidth;H=cv.clientHeight}
  Deck.onResize(resize);resize();
  function resetBodies(){Body.setPosition(torso,{x:410,y:285});Body.setVelocity(torso,{x:0,y:0});Body.setAngle(torso,0);Body.setAngularVelocity(torso,0);Body.setPosition(head,{x:408,y:162});Body.setVelocity(head,{x:0,y:0});}
  function start(){var q=calc();active=actualContact(q);running=true;phase=0;resetBodies();engine.gravity.x=-q.gv*Math.cos(q.rad);engine.gravity.y=1-q.gv*Math.sin(q.rad);var ok=guess.value===active;feedback.className='feedback '+(ok?'good':'bad');feedback.textContent=ok?'预测正确：实际接触区正在承受压力。':'合负荷箭头指向另一处约束，沿箭头寻找身体被压住的位置。';if(!ok){guess.classList.remove('shake');void guess.offsetWidth;guess.classList.add('shake')}
    support.textContent=fmt(q.n,3)+' N｜'+fmt(q.mult,3)+' g';summary.textContent='支撑力 '+fmt(q.n,3)+' N，约 '+fmt(q.mult,3)+' g';
    if(q.gv===0)completed.zero=1;if(q.gv===1.5&&q.d===-90)completed.up=1;if(q.gv===1.5&&q.d===0)completed.right=1;var n=Object.keys(completed).length;document.getElementById('progress').textContent=n+' / 3';if(n===3){document.getElementById('mass').classList.add('complete');feedback.textContent='加速度↑ → 支撑力↑；质量仍是 70 kg。'}
  }
  function reset(){gCtl.value='1.5';dirCtl.value='-90';guess.value='back';completed={};running=false;phase=0;engine.gravity.x=0;engine.gravity.y=1;resetBodies();support.textContent='— N｜— g';summary.textContent='启动后读取支撑力';feedback.className='feedback';feedback.textContent='调节大小与方向，先预测接触区，再启动。';document.getElementById('progress').textContent='0 / 3';document.getElementById('mass').classList.remove('complete');steps.forEach(function(s){s.classList.remove('current','done')});labels()}
  gCtl.addEventListener('input',labels);dirCtl.addEventListener('input',labels);document.getElementById('run').addEventListener('click',start);document.getElementById('reset').addEventListener('click',reset);
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);var sx=W/900,sy=H/600;ctx.save();ctx.scale(sx,sy);
    ctx.fillStyle=Deck.rgba('--teal',.06);ctx.beginPath();ctx.arc(160,650,470,0,Math.PI*2);ctx.fill();ctx.strokeStyle=Deck.rgba('--teal',.42);ctx.lineWidth=4;ctx.stroke();
    ctx.fillStyle=Deck.rgba('--panel-hi',1);ctx.strokeStyle=Deck.rgba('--line-strong',1);ctx.lineWidth=4;ctx.fillRect(303,150,34,315);ctx.strokeRect(303,150,34,315);ctx.fillRect(303,435,275,34);ctx.strokeRect(303,435,275,34);
    function poly(body,fill,stroke){var v=body.vertices;ctx.beginPath();ctx.moveTo(v[0].x,v[0].y);for(var i=1;i<v.length;i++)ctx.lineTo(v[i].x,v[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}
    poly(torso,Deck.rgba('--teal-dim',.28),Deck.rgba('--teal-soft',.9));ctx.beginPath();ctx.arc(head.position.x,head.position.y,40,0,Math.PI*2);ctx.fillStyle=Deck.rgba('--teal-dim',.28);ctx.fill();ctx.strokeStyle=Deck.rgba('--teal-soft',.9);ctx.lineWidth=3;ctx.stroke();
    ctx.strokeStyle=Deck.rgba('--teal',.5);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(torso.position.x,torso.position.y-70);ctx.lineTo(torso.position.x,torso.position.y+70);ctx.moveTo(torso.position.x-25,torso.position.y-25);ctx.lineTo(torso.position.x+25,torso.position.y-25);ctx.stroke();
    ctx.strokeStyle=Deck.rgba('--amber',running?1:.35);ctx.lineWidth=running?8:5;ctx.beginPath();ctx.moveTo(335,330);ctx.lineTo(torso.position.x+28,torso.position.y+15);ctx.moveTo(500,330);ctx.lineTo(torso.position.x-28,torso.position.y+15);ctx.stroke();
    var q=calc(),len=55+q.gv*42,cx=710,cy=325,dx=Math.cos(q.rad)*len,dy=Math.sin(q.rad)*len;ctx.strokeStyle=Deck.rgba('--teal',1);ctx.fillStyle=Deck.rgba('--teal',1);ctx.lineWidth=7;Deck.arrow(ctx,cx,cy,cx+dx,cy+dy,16);ctx.fill();
    if(running){var spots={back:[340,torso.position.y],belt:[420,330],sideL:[torso.position.x-42,torso.position.y],sideR:[torso.position.x+42,torso.position.y]},p=spots[active];ctx.beginPath();ctx.arc(p[0],p[1],20+10*Math.sin(phase*.01),0,Math.PI*2);ctx.fillStyle=Deck.rgba('--amber',.5);ctx.fill();document.getElementById('contactLabel').textContent='实际接触区：'+({back:'椅背',belt:'安全带',sideL:'左侧约束',sideR:'右侧约束'}[active]);}
    ctx.restore();
  }
  var acc=0;Deck.loop(function(t,dt){if(running){acc+=Math.min(dt,50);while(acc>=1000/60){E.update(engine,1000/60);acc-=1000/60}phase+=dt;var idx=Math.min(3,Math.floor(phase/260));steps.forEach(function(s,i){s.classList.toggle('current',i===idx);s.classList.toggle('done',i<idx)})}draw()},{still:1200});
  labels();
})();
</script>
</body>
</html>
