<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#071018;--text:#E7F2F1;--font-sans:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif}
#stage{padding:30px 42px 28px;gap:16px}
.topline{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;height:76px;flex-shrink:0}
.kicker{color:var(--teal);font:700 var(--fs-label)/1.3 var(--font-mono);letter-spacing:.11em}
.take{max-width:690px;text-align:right}
.predict{height:62px;display:flex;align-items:center;gap:14px;flex-shrink:0;padding:8px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.predict strong{font-size:var(--fs-sec);white-space:nowrap}
.choice{position:relative;display:inline-flex;align-items:center;min-height:40px;padding:7px 16px;border:2px solid var(--line-strong);border-radius:var(--r-sm);color:var(--ink-muted);font-size:var(--fs-label);font-weight:700;cursor:pointer;transition:transform 180ms ease-out,border-color 180ms ease-out,color 180ms ease-out}
.choice input{position:absolute;opacity:0;pointer-events:none}.choice:has(input:checked){border-color:var(--amber);color:var(--amber-soft);background:rgba(255,181,71,.08)}
.choice:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.feedback{margin-left:auto;min-width:420px;color:var(--ink-muted);font-size:var(--fs-sec);text-align:right}.feedback.good{color:var(--teal-soft)}.feedback.bad{color:var(--amber-soft)}
.k-comparison{--cmp-cols:3;grid-template-columns:150px repeat(3,minmax(0,1fr));height:100%;align-content:stretch}
.simrow{grid-column:1/-1;position:relative;min-height:0;border-bottom:1px solid var(--line);background:var(--panel-deep)}
.simrow canvas{display:block}.scale-note{position:absolute;left:14px;top:12px;color:var(--ink-faint);font-size:var(--fs-label)}
.hdr{position:relative}.hdr::after{content:"";position:absolute;left:50%;bottom:-10px;width:1px;height:10px;background:var(--teal-dim)}
.hdr.selected{box-shadow:inset 0 0 0 2px var(--amber)}.hdr.correct{box-shadow:inset 0 0 0 2px var(--teal)}
.cell,.dim{display:flex;align-items:center;justify-content:center}.dim{justify-content:flex-end!important}
.controls{height:104px;flex-shrink:0;display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center;padding:10px 16px;border:2px solid var(--line);border-radius:var(--r-md);background:var(--panel)}
.timebar{display:flex;flex-direction:column;gap:8px}.ctl{min-height:40px}.ctl input{width:100%}.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stage-mark{padding-top:5px;border-top:3px solid var(--line-strong);color:var(--ink-faint);font-size:var(--fs-label);text-align:center}.stage-mark.current{border-color:var(--amber);color:var(--amber-soft)}.stage-mark.done{border-color:var(--teal-dim);color:var(--ink-muted)}
.claim{height:62px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:10px 26px;border-left:7px solid var(--teal);background:var(--panel-hi);font-size:var(--fs-lead);font-weight:720;text-align:center;opacity:0;transform:translateY(8px);transition:opacity 260ms ease-out,transform 260ms ease-out}.claim.show{opacity:1;transform:none}
.shake{animation:shake 300ms ease-out}@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.claim{transform:none}}
</style>
</head>
<body data-page="22" data-total="45">
<div id="stage">
  <header class="topline">
    <div><div class="kicker">EARTH DEFAULTS / 03</div><h1>一起落下，为什么不坠地？</h1></div>
    <p class="lead take">轨道失重不是没有引力，而是飞船与其中的人持续一起下落</p>
  </header>

  <section class="predict" aria-label="预测">
    <strong>先预测：哪一栏能持续共同下落而不撞地？</strong>
    <label class="choice"><input type="radio" name="guess" value="0">地面抛物</label>
    <label class="choice"><input type="radio" name="guess" value="1">失败轨道</label>
    <label class="choice"><input type="radio" name="guess" value="2">稳定近圆轨道</label>
    <span id="feedback" class="feedback" aria-live="polite">选择后，拖动统一时间游标。</span>
  </section>

  <main class="min0" style="flex:1">
    <section class="k-comparison fill" aria-label="三种共同下落对照">
      <div class="hdr">比较维度</div><div class="hdr" data-head="0">地面抛物</div><div class="hdr" data-head="1">失败轨道</div><div class="hdr" data-head="2">稳定近圆轨道</div>
      <div class="simrow no-pan"><canvas id="sim" class="cv-fill" aria-label="三种物体在地心引力下同步运动的轨迹"></canvas><span class="scale-note">左窗为近地局部放大；三窗比例尺不同</span></div>
      <div class="cmp-row"><div class="dim">初始横向速度</div><div class="cell mono" id="v0"></div><div class="cell mono" id="v1"></div><div class="cell mono" id="v2"></div></div>
      <div class="rowline"></div>
      <div class="cmp-row"><div class="dim">引力方向</div><div class="cell">始终指向地心</div><div class="cell">始终指向地心</div><div class="cell">始终指向地心</div></div>
      <div class="rowline"></div>
      <div class="cmp-row"><div class="dim">相对地面结果</div><div class="cell diff">很快落地</div><div class="cell diff">绕过一段后撞地</div><div class="cell">持续错过地面</div></div>
    </section>
  </main>

  <section class="controls">
    <div class="timebar">
      <div class="ctl"><label for="time">统一时间游标</label><input id="time" type="range" min="0" max="100" value="0" step="1" aria-describedby="timeHelp"><output id="timeOut" class="mono">0%</output></div>
      <div id="timeHelp" class="stages"><span class="stage-mark current">预测</span><span class="stage-mark">释放</span><span class="stage-mark">共同下落</span><span class="stage-mark">结果</span></div>
    </div>
    <button id="reset" class="btn" type="button">重新同步</button>
  </section>
  <aside id="claim" class="claim" aria-live="polite">轨道失重不是引力消失：飞船、人与舱内物体一起自由落体，并以足够横向速度持续错过地面。</aside>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:22,total:45});
  var R=Lec.P.radiusFromAltitude(Lec.K.LEO_REFERENCE_ALTITUDE_M,Lec.K.EARTH_MEAN_RADIUS_M);
  var vc=Lec.P.circularOrbitVelocity(Lec.K.EARTH_MASS_KG,R);
  var speeds=[25,.72*vc,vc];
  document.getElementById('v0').textContent=Deck.fmt(speeds[0],0)+' m/s';
  document.getElementById('v1').textContent='0.72 × '+Deck.fmt(vc/1000,2)+' km/s';
  document.getElementById('v2').textContent=Deck.fmt(vc/1000,2)+' km/s';

  var cv=document.getElementById('sim'), slider=document.getElementById('time'), out=document.getElementById('timeOut');
  var feedback=document.getElementById('feedback'), claim=document.getElementById('claim');
  var marks=[].slice.call(document.querySelectorAll('.stage-mark'));
  var heads=[].slice.call(document.querySelectorAll('[data-head]'));
  var guess=null, paths=[[],[],[]], states=[];
  var Engine=Matter.Engine, Bodies=Matter.Bodies, Body=Matter.Body;

  function makeState(i){
    var engine=Engine.create({gravity:{x:0,y:0,scale:0}});
    var ship=Bodies.circle(0,-1,0.018,{frictionAir:0,inertia:Infinity});
    var ball=Bodies.circle(0,-.994,0.008,{frictionAir:0,inertia:Infinity,isSensor:true});
    var ratio=speeds[i]/vc;
    Body.setVelocity(ship,{x:ratio*.0105,y:0}); Body.setVelocity(ball,{x:ratio*.0105,y:0});
    Matter.Composite.add(engine.world,[ship,ball]);
    return {engine:engine,ship:ship,ball:ball,hit:false};
  }
  function resetPhysics(){states=[makeState(0),makeState(1),makeState(2)];paths=[[],[],[]];}
  function advance(target){
    resetPhysics(); var steps=Math.round(target*2.4);
    for(var n=0;n<steps;n++){
      states.forEach(function(s,i){
        if(s.hit)return;
        [s.ship,s.ball].forEach(function(b){
          var d=Math.hypot(b.position.x,b.position.y), strength=.000000055/(d*d);
          Body.applyForce(b,b.position,{x:-b.position.x/d*strength,y:-b.position.y/d*strength});
        });
        Engine.update(s.engine,1000/60);
        var d=Math.hypot(s.ship.position.x,s.ship.position.y);
        if(d<.82)s.hit=true;
        if(paths[i].length<240)paths[i].push({x:s.ship.position.x,y:s.ship.position.y});
      });
    }
  }
  function draw(){
    var ctx=Deck.fit(cv),w=cv.offsetWidth,h=cv.offsetHeight,col=w/3;
    ctx.clearRect(0,0,w,h); ctx.save();
    var teal=Deck.token('--teal'),dim=Deck.token('--teal-dim'),amber=Deck.token('--amber'),muted=Deck.token('--ink-muted'),panel=Deck.token('--panel');
    for(var i=0;i<3;i++){
      var x0=i*col; ctx.save();ctx.beginPath();ctx.rect(x0,0,col,h);ctx.clip();
      ctx.strokeStyle=Deck.rgba('--line-strong',.65);ctx.lineWidth=1;ctx.strokeRect(x0+.5,.5,col-1,h-1);
      var cx=x0+col/2, cy=h+112, radius=i===0?h*.72:h*.80;
      ctx.fillStyle=panel;ctx.strokeStyle=teal;ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,radius,Math.PI,Math.PI*2);ctx.fill();ctx.stroke();
      var sx=cx-radius*.18, sy=cy-radius*.965, scale=i===0?radius*.48:radius*.67;
      function map(p){return{x:sx+p.x*scale,y:sy+(p.y+1)*scale};}
      ctx.strokeStyle=teal;ctx.lineWidth=3;ctx.setLineDash(i===2?[9,8]:[]);ctx.beginPath();
      paths[i].forEach(function(p,j){var q=map(p);j?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);});ctx.stroke();ctx.setLineDash([]);
      var s=states[i],q=map(s.ship.position),b=map(s.ball.position);
      ctx.strokeStyle=amber;ctx.lineWidth=2;Deck.arrow(ctx,q.x,q.y,q.x+(cx-q.x)*.12,q.y+(cy-q.y)*.12,8);
      ctx.fillStyle=teal;ctx.fillRect(q.x-11,q.y-7,22,14);ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fillStyle=Deck.token('--teal-soft');ctx.fill();
      if(s.hit){ctx.strokeStyle=amber;ctx.lineWidth=3;ctx.beginPath();ctx.arc(q.x,q.y,12+Number(slider.value)%12,0,Math.PI*2);ctx.stroke();}
      ctx.restore();
    }
    ctx.restore();
  }
  function update(){
    var t=Number(slider.value);advance(t);draw();out.textContent=t+'%';
    var phase=t<5?0:t<22?1:t<78?2:3;
    marks.forEach(function(m,i){m.classList.toggle('current',i===phase);m.classList.toggle('done',i<phase);});
    claim.classList.toggle('show',t>=92);
  }
  document.querySelectorAll('input[name="guess"]').forEach(function(r){r.addEventListener('change',function(){
    guess=Number(r.value);heads.forEach(function(h,i){h.classList.toggle('selected',i===guess);h.classList.toggle('correct',guess===2&&i===2);});
    feedback.className='feedback '+(guess===2?'good':'bad');
    feedback.textContent=guess===2?'预测正确：仍受引力，但横向速度足以持续错过地面。':'这里也会短暂共同下落，但轨迹最终与地面相交。';
    if(guess!==2){var el=heads[guess];el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
  });});
  slider.addEventListener('input',update);
  document.getElementById('reset').addEventListener('click',function(){slider.value=0;guess=null;document.querySelectorAll('input[name="guess"]').forEach(function(r){r.checked=false;});heads.forEach(function(h){h.classList.remove('selected','correct','shake');});feedback.className='feedback';feedback.textContent='选择后，拖动统一时间游标。';update();});
  Deck.onResize(draw);resetPhysics();update();
})();
</script>
</body>
</html>
