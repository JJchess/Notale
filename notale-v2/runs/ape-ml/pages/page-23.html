<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--motion-fast:180ms;--motion-state:240ms;--motion-turn:650ms}
#stage{padding:32px 46px 28px;gap:18px}
.eyebrow{color:var(--teal);font-size:var(--fs-label);font-weight:760;letter-spacing:.12em}
.head-copy{max-width:1040px}
.game-shell{position:relative;display:flex;gap:24px;min-height:0}
.cabin-zone{position:relative;flex:1 1 auto;min-width:0;min-height:0;overflow:hidden;border:var(--stroke) solid var(--line);border-radius:var(--r-lg);background:radial-gradient(circle at 50% 48%,rgba(54,214,192,.1),transparent 47%),var(--panel-deep)}
.statusbar{position:absolute;z-index:4;top:18px;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between}
.instruction{color:var(--amber);font-size:var(--fs-lead);font-weight:760}
.fixed-up{position:absolute;z-index:3;top:58px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;color:var(--amber-soft);font-size:var(--fs-label);font-weight:700}
.fixed-up .arrow{font-size:30px;line-height:1;color:var(--amber)}
.cabin-svg{position:absolute;inset:78px 70px 24px;width:calc(100% - 140px);height:calc(100% - 102px)}
.rotor{transform-origin:50% 50%;transition:transform var(--motion-turn) cubic-bezier(.2,.75,.25,1),opacity var(--motion-state) ease}
.hatch{cursor:pointer;outline:none}
.hatch .door{fill:var(--panel-hi);stroke:var(--line-strong);stroke-width:3;transition:stroke var(--motion-fast),filter var(--motion-fast)}
.hatch:hover .door,.hatch:focus .door{stroke:var(--teal)}
.hatch.correct .door{stroke:var(--teal);stroke-width:7;filter:drop-shadow(0 0 8px var(--teal))}
.hatch.wrong{animation:shake var(--motion-fast) linear 3}
.hatch.wrong .door{stroke:var(--amber)}
.cabin-ring{fill:var(--panel);stroke:var(--teal-dim);stroke-width:5}
.inner-ring{fill:none;stroke:var(--line-strong);stroke-width:2;stroke-dasharray:8 9}
.seat{fill:var(--panel-hi);stroke:var(--teal-dim);stroke-width:3}
.person{fill:none;stroke:var(--teal-soft);stroke-width:5;stroke-linecap:round}
.dir-label{fill:var(--text);font-family:var(--font-mono);font-size:17px;font-weight:700;text-anchor:middle}
.connect{stroke:var(--teal);stroke-width:5;stroke-dasharray:240;stroke-dashoffset:240;transition:stroke-dashoffset 220ms ease-out}
.connect.on{stroke-dashoffset:0}
.side-panel{flex:0 0 330px;display:flex;flex-direction:column;gap:14px}
.prompt{min-height:64px;color:var(--ink-muted);font-size:var(--fs-sec);line-height:var(--lh-copy)}
.log{flex:1;min-height:0;overflow:hidden}
.log-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:var(--fs-label)}
.log-row .err{color:var(--amber)}
.summary{display:none;flex:1;flex-direction:column;justify-content:center;gap:18px}
.summary.show{display:flex}
.metric{font-family:var(--font-mono);font-size:28px;color:var(--teal)}
.process-strip{height:112px;padding:0}
.k-process.compact{height:100%;--process-gap:6px}
.k-process.compact>.step{display:flex;flex-direction:column;justify-content:center;padding:10px 12px}
.k-process.compact>.arw{flex-basis:22px;font-size:18px}
.step-no{color:var(--teal);font:700 var(--fs-label)/1 var(--font-mono);margin-bottom:7px}
.step-name{font-size:var(--fs-label);font-weight:700;line-height:1.25}.step-desc{color:var(--ink-muted);font-size:var(--fs-label);line-height:1.25;margin-top:5px}
.analogy{color:var(--ink-faint);font-size:var(--fs-sec);line-height:var(--lh-copy)}
@keyframes shake{0%,100%{transform:translateX(0)}33%{transform:translateX(-7px)}66%{transform:translateX(7px)}}
@media(prefers-reduced-motion:reduce){.rotor,.connect,.hatch .door{transition:none}.hatch.wrong{animation:none}}
</style>
</head>
<body data-page="23" data-total="45">
<div id="stage">
  <header class="row items-end justify-between shrink0" style="height:84px">
    <div class="head-copy">
      <div class="eyebrow">EARTH DEFAULTS · ORIENTATION</div>
      <h1>当“上方”不再固定</h1>
    </div>
    <div class="chip" id="progress">定位 0 / 6</div>
  </header>

  <main class="game-shell min0" style="flex:1">
    <section class="cabin-zone min0 no-pan" aria-label="旋转舱内定位任务">
      <div class="statusbar">
        <span class="instruction" id="instruction">记住屏幕上方，再按舱内方位行动</span>
        <span class="mono" id="timer">— ms</span>
      </div>
      <div class="fixed-up"><span class="arrow">↑</span><span>我原先认定的上</span></div>
      <svg class="cabin-svg" viewBox="0 0 700 520" role="img" aria-label="正视圆形舱段，舱体和人体随任务旋转">
        <line id="connect" class="connect" x1="350" y1="260" x2="350" y2="75"/>
        <g id="rotor" class="rotor">
          <circle class="cabin-ring" cx="350" cy="260" r="210"/>
          <circle class="inner-ring" cx="350" cy="260" r="174"/>
          <g class="hatch" data-dir="CEILING" tabindex="0" role="button" aria-label="CEILING 侧检修口" transform="translate(350 72)"><rect class="door" x="-43" y="-25" width="86" height="50" rx="9"/><text class="dir-label" y="6">CEILING</text></g>
          <g class="hatch" data-dir="DECK" tabindex="0" role="button" aria-label="DECK 侧检修口" transform="translate(350 448)"><rect class="door" x="-43" y="-25" width="86" height="50" rx="9"/><text class="dir-label" y="6">DECK</text></g>
          <g class="hatch" data-dir="PORT" tabindex="0" role="button" aria-label="PORT 侧检修口" transform="translate(162 260)"><rect class="door" x="-43" y="-25" width="86" height="50" rx="9"/><text class="dir-label" y="6">PORT</text></g>
          <g class="hatch" data-dir="STARBOARD" tabindex="0" role="button" aria-label="STARBOARD 侧检修口" transform="translate(538 260)"><rect class="door" x="-54" y="-25" width="108" height="50" rx="9"/><text class="dir-label" y="6">STARBOARD</text></g>
          <path class="seat" d="M306 335 Q350 365 394 335 L385 285 Q350 305 315 285Z"/>
          <g class="person"><circle cx="350" cy="205" r="25"/><path d="M350 232v73M350 255l-42 24M350 255l42 24M350 304l-31 42M350 304l31 42"/></g>
        </g>
      </svg>
    </section>

    <aside class="side-panel min0">
      <div class="panel panel-hi col gap-2" style="height:230px">
        <h2>任务仪表</h2>
        <p class="prompt" id="feedback" aria-live="polite">旋转后，先读舱内标签，再选择检修口。</p>
        <button class="btn btn-primary" id="action">开始定位</button>
      </div>
      <div class="panel log" id="logPanel">
        <div class="label">逐轮记录</div>
        <div id="logRows"><div class="log-row muted"><span>尚未开始</span><span>—</span></div></div>
      </div>
      <div class="panel summary" id="summary">
        <div class="label">六轮结果</div>
        <div><span class="metric" id="errorMetric">0</span><span> 次方向错误</span></div>
        <div><span class="metric" id="medianMetric">0</span><span> ms 中位反应时间</span></div>
      </div>
      <p class="analogy">屏幕旋转只是方向判断类比，不是失重体验或医学测试。</p>
    </aside>
  </main>

  <section class="process-strip shrink0" style="height:132px" aria-label="从旧方向到局部约定的六步过程">
    <div class="k-process compact" id="process">
      <div class="axis"></div>
      <div class="step current"><span class="step-no">01</span><span class="step-name">原方向</span><span class="step-desc">记住屏幕上方</span></div><div class="arw"></div>
      <div class="step"><span class="step-no">02</span><span class="step-name">舱体转动</span><span class="step-desc">旧方向分离</span></div><div class="arw"></div>
      <div class="step"><span class="step-no">03</span><span class="step-name">接收指令</span><span class="step-desc">读取舱内名称</span></div><div class="arw"></div>
      <div class="step"><span class="step-no">04</span><span class="step-name">指向目标</span><span class="step-desc">选择检修口</span></div><div class="arw"></div>
      <div class="step"><span class="step-no">05</span><span class="step-name">留下记录</span><span class="step-desc">时间与错误</span></div><div class="arw"></div>
      <div class="step"><span class="step-no">06</span><span class="step-name">建立约定</span><span class="step-desc">局部参照行动</span></div>
    </div>
  </section>
  <p class="lead shrink0" style="height:34px">失去稳定重力方向后，视觉与前庭线索可能冲突，“上方”变成局部约定。</p>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  Deck.init({index:23,total:45});
  const cfg={trials:[{angle:0,target:'CEILING'},{angle:90,target:'PORT'},{angle:180,target:'DECK'},{angle:270,target:'STARBOARD'},{angle:135,target:'CEILING'},{angle:225,target:'DECK'}],trialLimitMs:12000,transitionMs:650,errorFlashMs:500};
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const rotor=$('#rotor'), action=$('#action'), feedback=$('#feedback'), instruction=$('#instruction'), timer=$('#timer');
  let state=fresh(), stopClock=null;
  function fresh(){return {phase:'ready',trial:0,errors:0,startedAt:0,records:[]}}
  function processAt(n){$$('#process .step').forEach((el,i)=>{el.classList.toggle('done',i<n);el.classList.toggle('current',i===n)})}
  function setAngle(a){rotor.style.transform=`rotate(${a}deg)`}
  function start(){state=fresh();$('#logRows').innerHTML='';$('#summary').classList.remove('show');$('#logPanel').style.display='block';action.textContent='下一轮';action.disabled=true;setAngle(-12);processAt(1);setTimeout(()=>beginTrial(),Deck.reduced()?0:cfg.transitionMs);}
  function beginTrial(){const t=cfg.trials[state.trial];state.phase='playing';setAngle(t.angle);instruction.textContent=`找到 ${t.target} 侧检修口`;feedback.textContent='先确定舱内参照系，再行动。';state.startedAt=performance.now();action.disabled=true;processAt(3);clock();}
  function clock(){if(stopClock)stopClock();stopClock=Deck.loop(()=>{if(state.phase!=='playing')return;const elapsed=performance.now()-state.startedAt;timer.textContent=`${Math.min(cfg.trialLimitMs,Math.round(elapsed))} ms`;if(elapsed>=cfg.trialLimitMs)choose(null);},{still:0});}
  function choose(dir){if(state.phase!=='playing')return;const t=cfg.trials[state.trial], chosen=dir&&$(`.hatch[data-dir="${dir}"]`);if(dir!==t.target){state.errors++;if(chosen){chosen.classList.add('wrong');setTimeout(()=>chosen.classList.remove('wrong'),cfg.errorFlashMs)}feedback.textContent=`这是屏幕的方向，不是舱内的 ${t.target}。`;return}
    state.phase='resolved';if(stopClock)stopClock();const ms=Math.min(cfg.trialLimitMs,Math.round(performance.now()-state.startedAt));state.records.push(ms);const target=$(`.hatch[data-dir="${t.target}"]`);target.classList.add('correct');$('#connect').classList.add('on');timer.textContent=`${ms} ms`;feedback.textContent='已按舱内方位定位。局部约定接通了方向与目标。';addLog(ms,t.angle);processAt(4);action.disabled=false;action.textContent=state.trial===cfg.trials.length-1?'查看结果':'下一轮';}
  function addLog(ms,angle){const row=document.createElement('div');row.className='log-row';row.innerHTML=`<span>定位 ${state.trial+1} · ↻ ${angle}°</span><span>${ms} ms</span>`;$('#logRows').append(row);$('#progress').textContent=`定位 ${state.trial+1} / ${cfg.trials.length}`;}
  function next(){if(state.phase==='ready'||state.phase==='complete'){start();return}if(state.phase!=='resolved')return;if(state.trial===cfg.trials.length-1){complete();return}state.trial++;$$('.hatch').forEach(h=>h.classList.remove('correct','wrong'));$('#connect').classList.remove('on');processAt(1);state.phase='turning';action.disabled=true;setTimeout(beginTrial,Deck.reduced()?0:cfg.transitionMs);}
  function complete(){state.phase='complete';rotor.style.opacity='.18';processAt(5);$('#logPanel').style.display='none';$('#summary').classList.add('show');$('#errorMetric').textContent=state.errors;const s=[...state.records].sort((a,b)=>a-b);$('#medianMetric').textContent=Math.round((s[2]+s[3])/2);instruction.textContent='舱内方位框成为行动依据';feedback.textContent='“上方”已由舱内局部参照系定义。';action.textContent='重新挑战';action.disabled=false;timer.textContent='完成';}
  action.addEventListener('click',next);
  $$('.hatch').forEach(h=>{h.addEventListener('click',()=>choose(h.dataset.dir));h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(h.dataset.dir)}})});
  setAngle(0);
})();
</script>
</body>
</html>
