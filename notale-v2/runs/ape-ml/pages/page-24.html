<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:26px 40px 22px;gap:14px;overflow:hidden}
  .kicker{color:var(--teal);font:700 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.12em}
  .topline{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-5)}
  .take{max-width:820px;text-align:right}
  .control-deck{display:grid;grid-template-columns:1.15fr 1fr 280px;gap:var(--sp-3);padding:14px 18px}
  .control-deck>*{min-width:0}
  .calendar{display:grid;grid-template-columns:repeat(13,1fr);gap:5px;margin-top:7px}
  .month-cell{height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--r-sm);color:var(--ink-faint);font:600 var(--fs-tick)/1 var(--font-mono);background:var(--panel-deep);transition:background 180ms ease-out,color 180ms ease-out,border-color 180ms ease-out}
  .month-cell.past{color:var(--teal-soft);background:rgba(54,214,192,.1);border-color:var(--teal-dim)}
  .month-cell.now{color:var(--bg);background:var(--amber);border-color:var(--amber)}
  .progress-pills{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
  .progress-pills .chip.done{color:var(--bg);background:var(--teal);border-color:var(--teal)}
  .chart-panel{position:relative;padding:8px 18px 2px;overflow:hidden}
  #chart{display:block;width:100%;height:100%}
  #chart text{font-family:var(--font-sans)}
  #chart .tick text{font-size:13px;fill:var(--ink-muted)}
  #chart .domain,#chart .tick line{stroke:var(--line-strong)}
  #chart .grid line{stroke:var(--line);stroke-dasharray:3 6}
  .chart-head{position:absolute;top:12px;right:22px;left:92px;display:flex;justify-content:space-between;pointer-events:none}
  .legend .swatch.base{background:var(--ink-faint)}
  .legend .swatch.train{background:var(--teal)}
  .comparison-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--sp-3);height:178px}
  .comparison-wrap>*{min-width:0}
  .k-comparison{height:100%;--cmp-cols:2;grid-template-columns:180px repeat(2,minmax(0,1fr))}
  .k-comparison>.hdr,.k-comparison>.dim,.k-comparison>.cell{padding:6px 14px}
  .k-comparison>.cell,.k-comparison>.dim{font-size:var(--fs-sec);line-height:1.35}
  .insight{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:16px 18px;border-left:6px solid var(--teal)}
  .insight.reveal{border-color:var(--amber);background:var(--panel-hi)}
  .zero-note{min-height:24px;color:var(--amber-soft)}
  .shake{animation:shake 240ms ease-out 2}
  @keyframes shake{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="24" data-total="45">
<div id="stage">
  <header style="height:78px" class="topline shrink0">
    <div><div class="kicker">EARTH DEPENDENCE 04</div><h1>骨骼在算长期账</h1></div>
    <p class="lead take">骨骼会响应长期受力条件；缺少负荷时，维持原结构不再划算。</p>
  </header>

  <section style="height:146px" class="panel control-deck shrink0" aria-label="骨量趋势控制">
    <div>
      <div class="row justify-between items-center"><label class="label" for="months">观察月份</label><strong id="monthRead" class="measure accent" aria-live="polite">—</strong></div>
      <input id="months" class="fill" style="height:28px" type="range" min="0" max="12" step="1" value="6">
      <div id="calendar" class="calendar" aria-hidden="true"></div>
    </div>
    <div id="loadBox">
      <div class="row justify-between items-center"><label class="label" for="load">规律训练负荷</label><strong id="loadRead" class="measure accent" aria-live="polite">—</strong></div>
      <div class="ctl"><input id="load" type="range" min="0" max="100" step="10" value="0" aria-describedby="zeroNote"></div>
      <div id="zeroNote" class="secondary zero-note" aria-live="polite"></div>
    </div>
    <div class="col justify-between items-end">
      <div class="progress-pills"><span id="stepTime" class="chip">观察 1/2：拉长时间</span><span id="stepLoad" class="chip">观察 2/2：改变负荷</span></div>
      <button id="reset" class="btn" type="button">重置月历</button>
    </div>
  </section>

  <section style="flex:1" class="panel chart-panel min0" aria-label="缺少负荷与规律训练负荷的骨量趋势比较">
    <div class="chart-head">
      <span class="label">相对起始骨量</span>
      <div class="legend"><span class="key"><i class="swatch base"></i>缺少负荷</span><span class="key"><i class="swatch train"></i>规律训练负荷</span><span class="key"><i class="swatch risk"></i>当前月份</span></div>
    </div>
    <svg id="chart" viewBox="0 0 1200 430" role="img" aria-labelledby="chartTitle chartDesc">
      <title id="chartTitle">两种受力条件下的骨量变化趋势</title>
      <desc id="chartDesc">同一月份和同一纵轴下，规律训练的骨量区间下降较缓。阴影表示简化平均模型的不确定范围。</desc>
    </svg>
  </section>

  <section style="height:178px" class="comparison-wrap shrink0">
    <div class="k-comparison" aria-label="四个维度的对齐比较">
      <div class="hdr">比较维度</div><div class="hdr">缺少负荷</div><div class="hdr">规律训练负荷</div>
      <div class="cmp-row"><div class="dim">受力条件</div><div class="cell">训练负荷 0%</div><div id="cLoad" class="cell diff">—</div></div><div class="rowline"></div>
      <div class="cmp-row"><div class="dim">有效月损失率</div><div id="cBaseRate" class="cell">—</div><div id="cTrainRate" class="cell diff">—</div></div><div class="rowline"></div>
      <div class="cmp-row"><div class="dim">当前剩余骨量</div><div id="cBaseBone" class="cell">—</div><div id="cTrainBone" class="cell diff">—</div></div><div class="rowline"></div>
      <div class="cmp-row"><div class="dim">图上含义</div><div class="cell">青灰区间持续下移</div><div class="cell diff">青色区间下移较缓</div></div>
    </div>
    <aside id="insight" class="panel insight">
      <p id="core" class="body">骨骼不是固定支架：长期负荷减少时，它会逐月重塑。</p>
      <p class="secondary">训练能改变趋势，但模型只表达群体层面的范围，不用于个人预测。</p>
    </aside>
  </section>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  Deck.init({index:24,total:45});
  var K=Lec.K,P=Lec.P;
  var given=K.MICROGRAVITY_BONE_LOSS_MONTHLY_RANGE;
  var base=K.human.boneLossFractionPerMonthMicrogravity;
  var rates=given || [base,base*K.math.TWO];
  var months=document.getElementById('months'),load=document.getElementById('load');
  var monthRead=document.getElementById('monthRead'),loadRead=document.getElementById('loadRead');
  var calendar=document.getElementById('calendar'),zeroNote=document.getElementById('zeroNote');
  var timeDone=false,loadDone=false,lockTimer=0;
  for(var i=0;i<=12;i++){var s=document.createElement('span');s.className='month-cell';s.textContent=i;s.dataset.month=i;calendar.appendChild(s)}
  var svg=d3.select('#chart'),margin={top:28,right:42,bottom:52,left:72},W=1200,H=430;
  var iw=W-margin.left-margin.right,ih=H-margin.top-margin.bottom;
  var x=d3.scaleLinear().domain([0,12]).range([0,iw]);
  var y=d3.scaleLinear().domain([.75,1.01]).range([ih,0]);
  var g=svg.append('g').attr('transform','translate('+margin.left+','+margin.top+')');
  g.append('g').attr('class','grid').call(d3.axisLeft(y).ticks(6).tickSize(-iw).tickFormat(''));
  g.append('g').attr('transform','translate(0,'+ih+')').call(d3.axisBottom(x).ticks(5).tickFormat(function(d){return d+' 月'}));
  g.append('g').call(d3.axisLeft(y).ticks(6).tickFormat(d3.format('.0%')));
  var line=d3.line().x(function(d){return x(d.m)}).y(function(d){return y(d.mid)}).curve(d3.curveMonotoneX);
  var area=d3.area().x(function(d){return x(d.m)}).y0(function(d){return y(d.low)}).y1(function(d){return y(d.high)}).curve(d3.curveMonotoneX);
  var baseArea=g.append('path').attr('fill','var(--ink-faint)').attr('opacity',.18);
  var trainArea=g.append('path').attr('fill','var(--teal)').attr('opacity',.18);
  var baseLine=g.append('path').attr('fill','none').attr('stroke','var(--ink-muted)').attr('stroke-width',3);
  var trainLine=g.append('path').attr('fill','none').attr('stroke','var(--teal)').attr('stroke-width',3);
  var nowLine=g.append('line').attr('stroke','var(--amber)').attr('stroke-width',3).attr('y1',0).attr('y2',ih);
  var connector=g.append('line').attr('stroke','var(--amber)').attr('stroke-width',4).attr('opacity',0);
  var dots=g.selectAll('.nowdot').data(['base','train']).join('circle').attr('class','nowdot').attr('r',6).attr('stroke','var(--panel-deep)').attr('stroke-width',3);
  var fmt3=function(v){return P.significantFigures(v,3)};
  function pct(v){return fmt3(v*100)+'%'}
  function series(mult){return d3.range(13).map(function(m){var a=P.remainingBoneFraction(m,rates[1]*mult),b=P.remainingBoneFraction(m,rates[0]*mult);return {m:m,low:Math.min(a,b),high:Math.max(a,b),mid:(a+b)/2}})}
  function render(animate){
    var m=+months.value,l=+load.value,mult=d3.scaleLinear().domain([0,100]).range([1,.35]).clamp(true)(l);
    var a=series(1),b=series(mult),tr=animate&&!Deck.reduced()?d3.transition().duration(350).ease(d3.easeCubicOut):null;
    function set(sel,attr,val){tr?sel.transition(tr).attr(attr,val):sel.attr(attr,val)}
    set(baseArea,'d',area(a));set(trainArea,'d',area(b));set(baseLine,'d',line(a));set(trainLine,'d',line(b));
    set(nowLine,'x1',x(m));set(nowLine,'x2',x(m));
    var av=a[m].mid,bv=b[m].mid;
    set(connector,'x1',x(m));set(connector,'x2',x(m));set(connector,'y1',y(av));set(connector,'y2',y(bv));
    connector.attr('opacity',(m===12&&l>=70)?1:0);trainLine.attr('stroke-width',(m===12&&l>=70)?5:3);
    dots.data([{v:av,c:'var(--ink-muted)'},{v:bv,c:'var(--teal)'}]).attr('cx',x(m)).attr('cy',function(d){return y(d.v)}).attr('fill',function(d){return d.c});
    monthRead.textContent=m+' 月';loadRead.textContent=l+'%';
    calendar.querySelectorAll('.month-cell').forEach(function(el){var n=+el.dataset.month;el.className='month-cell'+(n<m?' past':'')+(n===m?' now':'')});
    document.getElementById('cLoad').textContent=l+'%';
    document.getElementById('cBaseRate').textContent=pct(rates[0])+'–'+pct(rates[1]);
    document.getElementById('cTrainRate').textContent=pct(rates[0]*mult)+'–'+pct(rates[1]*mult);
    document.getElementById('cBaseBone').textContent=pct(av);
    document.getElementById('cTrainBone').textContent=pct(bv);
    if(m===0&&l>0){zeroNote.textContent='时间尚未经过：负荷影响后续趋势，不会瞬间增加骨量。';document.getElementById('loadBox').classList.remove('shake');void document.getElementById('loadBox').offsetWidth;document.getElementById('loadBox').classList.add('shake')}else zeroNote.textContent='负荷改变后续损失率，不把骨量“补回去”。';
    if(m===12)timeDone=true;if(l>=70)loadDone=true;
    document.getElementById('stepTime').classList.toggle('done',timeDone);document.getElementById('stepLoad').classList.toggle('done',loadDone);
    if(timeDone&&loadDone){document.getElementById('insight').classList.add('reveal');document.getElementById('core').textContent='时间累积损失；训练改变趋势，而不是立即修复。';clearTimeout(lockTimer);nowLine.attr('stroke-width',6);lockTimer=setTimeout(function(){nowLine.attr('stroke-width',3)},1000)}
  }
  months.addEventListener('input',function(){render(true)});load.addEventListener('input',function(){render(true)});
  document.getElementById('reset').addEventListener('click',function(){months.value=6;load.value=0;timeDone=false;loadDone=false;document.getElementById('insight').classList.remove('reveal');document.getElementById('core').textContent='骨骼不是固定支架：长期负荷减少时，它会逐月重塑。';render(false)});
  render(false);
})();
</script>
</body>
</html>
