<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:28px 34px 24px;gap:16px;overflow:hidden}
  .topline{height:76px;display:flex;align-items:flex-start;justify-content:space-between;gap:28px}
  .kicker{color:var(--teal);font:700 var(--fs-label)/1.3 var(--font-mono);letter-spacing:.12em}
  .take{max-width:840px;color:var(--ink-muted);font-size:var(--fs-sec);line-height:var(--lh-copy);text-align:right}
  .processbar{height:78px;--process-gap:6px}
  .processbar>.step{padding:10px 9px;text-align:center;font-size:var(--fs-label);line-height:1.35;display:flex;flex-direction:column;justify-content:center}
  .processbar>.step b{display:block;color:var(--teal-soft);font-size:var(--fs-sec)}
  .processbar>.arw{flex-basis:22px}
  .workspace{position:relative;display:flex;flex-direction:column;gap:12px;min-height:0}
  .toolbar{height:76px;display:flex;align-items:center;gap:18px;padding:12px 16px}
  .toolbar .ctl{flex:1}.toolbar select{width:100%;font-size:var(--fs-sec)}
  .tested{min-width:152px;text-align:center}
  .sim{position:relative;flex:1;min-height:0;overflow:hidden;border:var(--stroke) solid var(--line-strong);border-radius:var(--r-lg);background:var(--panel-deep)}
  #pixiHost{position:absolute;inset:0}
  #pixiHost canvas{display:block;width:100%;height:100%}
  .earth{position:absolute;left:0;top:34px;width:90px;height:430px;pointer-events:none;border-left-color:transparent}
  .source-label{position:absolute;left:38px;top:20px;width:190px}
  .source-label strong{display:block;color:var(--teal-soft);font-size:var(--fs-sec)}
  .shield{position:absolute;left:33%;top:62px;width:42%;height:250px;display:flex;gap:8px;align-items:stretch}
  .slot{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:8px;border:2px dashed var(--line-strong);border-radius:var(--r-sm);background:rgba(9,22,30,.72);color:var(--ink-faint);font-size:var(--fs-label);text-align:center;line-height:1.35;transition:transform 180ms ease-out,border-color 180ms ease-out,background 180ms ease-out}
  .slot.filled{border-style:solid;border-color:var(--teal);background:rgba(54,214,192,.12);color:var(--teal-soft)}
  .slot.reject{border-color:var(--amber);transform:translateX(-7px)}
  .materials{position:absolute;left:31%;right:22%;bottom:18px;display:flex;align-items:center;gap:10px}
  .material{flex:1;min-height:50px;padding:8px 10px;border:var(--stroke) solid var(--line-strong);border-radius:var(--r-sm);background:var(--panel-hi);color:var(--text);font-size:var(--fs-label);font-weight:700;cursor:grab;text-align:center}
  .material:focus{outline:3px solid var(--focus);outline-offset:2px}.material small{display:block;color:var(--ink-muted);font-size:var(--fs-label);font-weight:500}
  .detector{position:absolute;right:18px;top:42px;width:220px;display:flex;flex-direction:column;gap:9px}
  .detector .readout{padding:10px 14px}.detector .value{font-size:20px}
  .budget{position:absolute;left:33%;top:22px;width:42%}.budgetline{display:flex;justify-content:space-between;color:var(--ink-muted);font-size:var(--fs-label);margin-bottom:5px}
  .status{height:62px;display:flex;align-items:center;gap:18px;padding:10px 16px}
  .status .claim{flex:1;color:var(--teal-soft);font-size:var(--fs-sec);line-height:var(--lh-copy)}
  .notice{min-width:390px;color:var(--ink-muted);font-size:var(--fs-sec);line-height:var(--lh-copy);text-align:right}
  .notice.warn{color:var(--amber-soft)}
  @media(prefers-reduced-motion:reduce){.slot{transition:none}}
</style>
</head>
<body data-page="26" data-total="45">
<div id="stage">
  <header class="topline shrink0">
    <div><div class="kicker">EARTH DEFAULTS · 26</div><h1>屏障不是一堵墙</h1></div>
    <p class="take">太空辐射风险取决于粒子类型、能量、屏蔽材料和暴露时间，不只是“离太阳近”。</p>
  </header>

  <section class="k-process processbar shrink0" aria-label="辐射从来源到累积计数的过程">
    <div class="axis"></div>
    <div class="step"><b>1 来源</b><span>粒子从哪里来？</span></div><div class="arw"></div>
    <div class="step"><b>2 入射能量</b><span>多难被挡住？</span></div><div class="arw"></div>
    <div class="step current"><b>3 材料相互作用</b><span>衰减，也会分叉</span></div><div class="arw"></div>
    <div class="step"><b>4 剩余粒子</b><span>初级＋次级</span></div><div class="arw"></div>
    <div class="step"><b>5 探测计数</b><span>无屏障＝100</span></div><div class="arw"></div>
    <div class="step"><b>6 时间累积</b><span>速率 × 天数</span></div>
  </section>

  <main class="workspace grow min0">
    <div class="toolbar panel shrink0">
      <div class="ctl"><label for="beam">粒子束</label><select id="beam" aria-label="切换粒子束"></select></div>
      <div class="ctl"><label for="days">暴露时间</label><select id="days" aria-label="改变暴露时间"></select></div>
      <div class="chip tested" id="tested">已测试 0/3 种</div>
      <button class="btn" id="reset">重置屏障</button>
    </div>

    <section class="sim no-pan min0" id="sim" aria-label="粒子束穿过六格材料屏障的动态剖面">
      <div id="pixiHost" aria-hidden="true"></div>
      <div class="earth earth-arc"></div>
      <div class="source-label secondary"><strong id="sourceName">太阳事件质子</strong><span id="energy">30 MeV</span></div>
      <div class="budget">
        <div class="budgetline"><span>屏障面密度</span><strong id="budgetText">已用 0/12 g/cm²</strong></div>
        <div class="meter" id="budgetMeter" style="height:18px"><div class="fillbar" style="--value:0%"></div></div>
      </div>
      <div class="shield" id="shield" aria-label="六格屏障槽"></div>
      <div class="materials" aria-label="可拖入屏障的材料">
        <button class="material" draggable="true" data-mat="poly">聚乙烯<small>每块 2 g/cm²</small></button>
        <button class="material" draggable="true" data-mat="water">水<small>每块 2 g/cm²</small></button>
        <button class="material" draggable="true" data-mat="al">铝<small>每块 2 g/cm²</small></button>
      </div>
      <div class="detector">
        <span class="chip">探测器 · 教学计数</span>
        <div class="readout"><span class="label">穿透初级</span><span class="value" id="primary">100</span></div>
        <div class="readout"><span class="label">次级</span><span class="value" id="secondary">0</span></div>
        <div class="readout is-target"><span class="label">累计总计</span><span class="value" id="total">100</span></div>
      </div>
    </section>

    <div class="status panel shrink0">
      <p class="claim">屏障效果由粒子类型、能量、材料和暴露时间共同决定。</p>
      <p class="notice" id="notice" aria-live="polite">拖动材料入槽；键盘聚焦材料后按 Enter 也可加入。</p>
    </div>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/pixi.min.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:26,total:45});
  var N=Lec.K.math, unit=Lec.K.units;
  var TWO=N.TWO, THREE=N.THREE, HUNDRED=N.HUNDRED;
  var density=TWO, slotsMax=THREE*TWO, budgetMax=slotsMax*density;
  var beams=[
    {id:'solar',name:'太阳事件质子',energy:(THREE*10)+' MeV',speed:190,mu:{poly:.19,water:.17,al:.12},sec:{poly:.04,water:.05,al:.16}},
    {id:'galactic',name:'银河高能质子',energy:N.ONE+' GeV',speed:245,mu:{poly:.10,water:.09,al:.065},sec:{poly:.08,water:.09,al:.22}},
    {id:'heavy',name:'重离子',energy:N.ONE+' GeV/核子',speed:215,mu:{poly:.07,water:.065,al:.045},sec:{poly:.16,water:.18,al:.38}}
  ];
  var mats={poly:{name:'聚乙烯'},water:{name:'水'},al:{name:'铝'}};
  var durations=[THREE*10,THREE*60,365];
  var beamEl=document.getElementById('beam'),daysEl=document.getElementById('days');
  beams.forEach(function(b,i){var o=document.createElement('option');o.value=i;o.textContent=b.name+' · '+b.energy;beamEl.appendChild(o)});
  durations.forEach(function(d){var o=document.createElement('option');o.value=d;o.textContent=d+' 天';daysEl.appendChild(o)}); daysEl.value=durations[1];
  var slots=[], tested=new Set(), state={beam:0,days:durations[1]}, target={p:HUNDRED,s:0}, shown={p:HUNDRED,s:0};
  var shield=document.getElementById('shield');
  for(var i=0;i<slotsMax;i++){var s=document.createElement('div');s.className='slot';s.dataset.i=i;s.textContent='空槽';s.addEventListener('dragover',function(e){e.preventDefault()});s.addEventListener('drop',drop);s.addEventListener('click',function(){var j=+this.dataset.i;if(slots[j]){slots.splice(j,1);renderSlots();recalc()}});shield.appendChild(s)}
  function addMaterial(mat){if(slots.length>=slotsMax){reject();return}slots.push(mat);renderSlots();recalc()}
  function drop(e){e.preventDefault();addMaterial(e.dataTransfer.getData('text/plain'))}
  document.querySelectorAll('.material').forEach(function(el){el.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',this.dataset.mat)});el.addEventListener('click',function(){addMaterial(this.dataset.mat)});el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();addMaterial(this.dataset.mat)}})});
  function reject(){document.getElementById('notice').textContent='已达 12 g/cm² 质量预算；替换材料，而不是继续加厚。';document.getElementById('notice').classList.add('warn');var all=shield.children;for(var i=0;i<all.length;i++)all[i].classList.add('reject');setTimeout(function(){for(var j=0;j<all.length;j++)all[j].classList.remove('reject')},220)}
  function renderSlots(){Array.from(shield.children).forEach(function(el,i){el.className='slot'+(slots[i]?' filled':'');el.textContent=slots[i]?mats[slots[i]].name:'空槽'});var used=slots.length*density;document.getElementById('budgetText').textContent='已用 '+used+'/'+budgetMax+' g/cm²';document.querySelector('#budgetMeter .fillbar').style.setProperty('--value',(used/budgetMax*HUNDRED)+'%');document.getElementById('notice').classList.remove('warn')}
  function recalc(){var b=beams[state.beam],p=1,sec=0;slots.forEach(function(m){var pass=Math.exp(-b.mu[m]*density);sec += p*(1-pass)*b.sec[m]*THREE;p*=pass});target.p=HUNDRED*p;target.s=HUNDRED*sec;document.getElementById('sourceName').textContent=b.name;document.getElementById('energy').textContent=b.energy;document.getElementById('tested').textContent='已测试 '+tested.size+'/'+THREE+' 种';document.getElementById('notice').setAttribute('aria-label','穿透初级 '+target.p.toFixed(0)+'，次级 '+target.s.toFixed(0)+'，暴露 '+state.days+' 天');resetParticles()}
  beamEl.addEventListener('change',function(){state.beam=+this.value;tested.add(state.beam);recalc();if(tested.size===THREE)document.getElementById('notice').textContent='同一屏障，没有统一结果：不同粒子束留下不同计数。'});
  daysEl.addEventListener('change',function(){state.days=+this.value;recalc()});
  document.getElementById('reset').addEventListener('click',function(){slots=[];tested.clear();state.beam=0;state.days=durations[1];beamEl.value=0;daysEl.value=state.days;renderSlots();recalc();document.getElementById('notice').textContent='拖动材料入槽；键盘聚焦材料后按 Enter 也可加入。'});

  var host=document.getElementById('pixiHost'),app=new PIXI.Application({backgroundAlpha:0,antialias:true,resolution:Math.min(devicePixelRatio,TWO),autoDensity:true,powerPreference:'high-performance',resizeTo:host});host.appendChild(app.view);
  var layer=new PIXI.Container(), flashes=new PIXI.Container();app.stage.addChild(layer,flashes);var rng=new Math.seedrandom('apeman-spaceman-p26'), particles=[];
  function resetParticles(){layer.removeChildren().forEach(function(x){x.destroy()});particles=[];rng=new Math.seedrandom('apeman-spaceman-p26-'+state.beam+'-'+slots.join('-'));var count=Deck.reduced()?36:110;for(var i=0;i<count;i++){var g=new PIXI.Graphics(),kind=state.beam;if(kind===TWO)g.drawPolygon([-6,-5,6,0,-6,5]);else if(kind===N.ONE)g.drawRect(-5,-5,10,10);else g.drawCircle(0,0,5);g.beginFill(kind===TWO?0xffb547:0x36d6c0,.9);g.endFill();layer.addChild(g);particles.push({g:g,x:-rng()*900,y:115+rng()*210,v:beams[state.beam].speed*(.8+rng()*.4),secondary:false,seed:rng()})}}
  function interaction(p,w){if(!slots.length)return;var idx=Math.min(slots.length-1,Math.floor((p.x-w*.33)/(w*.42/slotsMax)));if(idx<0)return;var b=beams[state.beam],m=slots[idx],pass=Math.exp(-b.mu[m]*density);var q=(Math.sin((p.seed+idx)*999)*.5+.5);if(q>pass){p.g.tint=0xffb547;p.v*=.55;if(q<pass+(1-pass)*b.sec[m]){p.secondary=true;p.y+=(q-.5)*75;p.g.scale.set(.65)}}}
  app.ticker.add(function(delta){var w=app.renderer.width/app.renderer.resolution,h=app.renderer.height/app.renderer.resolution;if(Deck.reduced())delta=0;particles.forEach(function(p){p.x+=p.v*delta/60;if(p.x>w){p.x=-30;p.y=115+rng()*210;p.g.tint=0xffffff;p.g.scale.set(1);p.secondary=false}if(p.x>w*.33&&p.x-p.v*delta/60<=w*.33)interaction(p,w);p.g.position.set(p.x,p.y)});shown.p+=(target.p-shown.p)*.09;shown.s+=(target.s-shown.s)*.09;var factor=state.days/durations[0];document.getElementById('primary').textContent=shown.p.toFixed(0);document.getElementById('secondary').textContent=shown.s.toFixed(0);document.getElementById('total').textContent=((shown.p+shown.s)*factor).toFixed(0)});
  document.addEventListener('visibilitychange',function(){if(document.hidden)app.stop();else app.start()});
  renderSlots();recalc();
})();
</script>
</body>
</html>
