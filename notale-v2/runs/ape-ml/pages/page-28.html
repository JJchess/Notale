<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:28px 46px 24px;overflow:hidden;position:relative}
  .topline{height:98px;display:flex;align-items:flex-start;justify-content:space-between;gap:32px;position:relative;z-index:2}
  .kicker{color:var(--amber);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em;margin-bottom:6px}
  .progress{min-width:248px;text-align:right;padding-top:8px}
  .progress strong{display:block;color:var(--teal);font:720 var(--fs-h2)/1.2 var(--font-mono)}
  .progress span{font-size:var(--fs-label);color:var(--ink-muted)}
  .ledger{position:relative;flex:1;min-height:0;gap:10px}
  .ledger>.claim{padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:60px}
  .claim-main{font-size:var(--fs-lead)}
  .claim-flow{font:700 var(--fs-sec)/1.4 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
  .claim-flow b{color:var(--teal);font-weight:760}
  .ledger>.trunk{min-height:20px;margin:-10px auto;background:var(--teal-dim)}
  .matrix{position:relative;display:flex!important;flex-direction:column;gap:7px!important;padding-top:26px;min-height:0}
  .matrix:before{top:14px!important;bottom:auto!important;left:4%!important;width:92%!important;height:2px!important;background:var(--teal-dim)!important}
  .flow-map{position:absolute;inset:18px 0 0;width:100%;height:calc(100% - 18px);pointer-events:none;z-index:0}
  .flow-map path{fill:none;stroke:var(--teal-dim);stroke-width:2;stroke-dasharray:8 9;opacity:.55}
  .heads,.risk-row{display:grid;grid-template-columns:220px 260px 182px minmax(0,1fr);gap:12px;align-items:center;position:relative;z-index:1}
  .heads{position:absolute;top:-10px;left:0;right:0;padding:0 16px;color:var(--ink-muted);font-size:var(--fs-label);font-weight:720}
  .heads span:nth-child(3){text-align:center;color:var(--amber)}
  .risk-row.support{padding:8px 16px;min-height:82px;display:grid;border-color:var(--line-strong);background:var(--panel-hi);box-shadow:0 10px 24px var(--shadow);transition:border-color 220ms ease,background 220ms ease}
  .risk-row:before{content:"";position:absolute;left:4%;top:-16px;width:2px;height:16px;background:var(--teal-dim)}
  .risk-row.done{border-color:var(--teal-dim);background:linear-gradient(90deg,rgba(54,214,192,.08),transparent 75%),var(--panel)}
  .risk-name{display:flex;align-items:center;gap:10px;color:var(--text);font-size:18px;font-weight:720;line-height:1.25}
  .risk-dot{width:15px;height:15px;flex:0 0 15px;border:3px solid var(--amber);border-radius:50%;background:var(--amber);transition:all 220ms ease}
  .done .risk-dot{background:transparent;border-color:var(--teal)}
  .monitor,.residual{align-self:stretch;display:flex;align-items:center;font-size:16px;line-height:1.35;color:var(--ink-muted)}
  .risk-name>span:last-child{align-self:stretch;display:flex;align-items:center}
  .residual{opacity:.18;transition:opacity 240ms ease;color:var(--amber-soft)}
  .done .residual{opacity:1}
  .drop{height:54px;border:2px dashed var(--amber-deep);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--amber-soft);font-size:var(--fs-label);font-weight:700;background:rgba(255,181,71,.06)}
  .drop.ready{border-color:var(--teal);color:var(--teal-soft);background:rgba(54,214,192,.08)}
  .arrowline{position:absolute;right:10px;left:10px;top:50%;height:3px;z-index:0;background:var(--line-strong)}
  .arrowline:after{content:"→";position:absolute;right:2px;top:-18px;color:var(--ink-muted);font:800 22px/1 var(--font-mono)}
  .risk-row>div:not(.arrowline){position:relative;z-index:1;background:var(--panel-hi)}
  .done .arrowline{background:linear-gradient(90deg,var(--teal-dim),var(--teal))}
  .tray{height:112px;display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:2px dashed var(--line-strong);position:relative;z-index:4}
  .tray-label{width:142px;flex:0 0 142px}
  .tray-label strong{display:block;font-size:var(--fs-sec);color:var(--text)}
  .tray-label span{display:block;font-size:var(--fs-label);color:var(--ink-muted);margin-top:3px}
  .strategy{min-width:112px;height:54px;padding:0 22px;border:2px solid var(--amber);border-radius:var(--r-sm);background:var(--panel-hi);color:var(--amber-soft);font-size:16px;font-weight:760;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;position:relative;z-index:5;user-select:none;transition:border-color 180ms ease,background 180ms ease,color 180ms ease}
  .strategy:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
  .strategy.placed{border-color:var(--teal);color:var(--teal-soft);background:var(--panel-deep);cursor:default}
  .strategy.dragging{cursor:grabbing;box-shadow:0 16px 36px var(--shadow)}
  .btn{margin-left:auto;flex:0 0 auto}
  .status{height:34px;display:flex;align-items:center;color:var(--amber-soft);font-size:16px;padding:0 4px}
  .earth{position:absolute;width:780px;height:72px;left:410px;bottom:0;opacity:.22;pointer-events:none}
  .pulse{animation:pulse 520ms ease-out}
  .shake{animation:shake 260ms ease-out}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(54,214,192,.5)}100%{box-shadow:0 0 0 18px rgba(54,214,192,0)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
  .enter{animation:rise 520ms both cubic-bezier(.2,.8,.2,1);animation-delay:var(--delay,0ms)}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.enter,.pulse,.shake{animation:none!important}.risk-row,.risk-dot,.residual,.strategy{transition:none!important}}
</style>
</head>
<body data-page="28" data-total="45">
<div id="stage">
  <header class="topline shrink0">
    <div><div class="kicker">III · RISK LEDGER</div><h1>风险不会归零</h1></div>
    <div class="progress" aria-live="polite"><strong id="count">风险链已接通 0 / 5</strong><span>完成五条链，检验共同逻辑</span></div>
  </header>

  <main class="k-generalization ledger min0" style="flex:1">
    <section class="claim enter" style="--delay:60ms">
      <span class="claim-main">太空医学不是把太空重新变成地球，而是持续监测、有限补偿。</span>
      <span class="claim-flow">环境差异 → 监测 → <b>补偿</b> → 剩余风险</span>
    </section>
    <div class="trunk" aria-hidden="true"></div>
    <section id="matrix" class="supports matrix min0" aria-label="风险管理账本">
      <svg class="flow-map" viewBox="0 0 1400 500" role="img" aria-label="五条风险链从环境差异依次通向监测、补偿和剩余风险">
        <path d="M30 62 H1370 M30 157 H1370 M30 252 H1370 M30 347 H1370 M30 442 H1370"></path>
      </svg>
      <div class="heads"><span>环境差异 / 风险</span><span>监测信号</span><span>补偿措施</span><span>代价与剩余风险</span></div>
    </section>
  </main>

  <div id="status" class="status shrink0" aria-live="polite">拖动对策卡到对应空位；键盘可用 ↑↓ 选行，Enter 放入。</div>
  <section class="tray shrink0 no-pan" aria-label="待配对的对策卡">
    <div class="tray-label"><strong>舱载对策</strong><span>每项只能回应一种主要风险</span></div>
    <div id="cards" class="row gap-2 items-center"></div>
    <button id="reset" class="btn" type="button">重置账本</button>
  </section>
  <div class="earth earth-arc" aria-hidden="true"></div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  Deck.init({index:28,total:45});
  const rows=[
    {id:'load',risk:'肌肉与骨骼失用',monitor:'训练完成度、力量与骨量趋势',answer:'运动',residual:'占用时间并造成疲劳；不能完全复制持续重力负荷'},
    {id:'radiation',risk:'辐射暴露',monitor:'来源、累计暴露时间与任务告警',answer:'屏蔽',residual:'效果依粒子与能量而变；仍有穿透及次级粒子风险'},
    {id:'vestibular',risk:'视觉—前庭冲突带来的不适',monitor:'症状记录与任务表现',answer:'药物',residual:'可缓解症状但可能嗜睡；不会恢复稳定重力方向'},
    {id:'rhythm',risk:'昼夜线索改变',monitor:'睡眠记录、值班状态与光照时段',answer:'节律',residual:'需要约束照明和排班；个体适应仍有差异'},
    {id:'delay',risk:'通信延迟下的处置失配',monitor:'确认回执、交接状态与错误记录',answer:'程序',residual:'提高一致性但降低临场灵活度；异常仍需授权判断'}
  ];
  const state={placed:{},targets:{}};
  const rowSel=d3.select('#matrix').selectAll('.risk-row').data(rows,d=>d.id).join('div')
    .attr('class','support risk-row enter').style('--delay',(d,i)=>(140+i*65)+'ms').attr('data-id',d=>d.id);
  rowSel.html(d=>'<div class="arrowline"></div><div class="risk-name"><span class="risk-dot"></span><span>'+d.risk+'</span></div><div class="monitor">'+d.monitor+'</div><div class="drop" data-drop="'+d.id+'">等待对策</div><div class="residual">'+d.residual+'</div>');

  const cards=d3.select('#cards').selectAll('.strategy').data(rows.map(d=>d.answer)).join('div')
    .attr('class','strategy enter').style('--delay',(d,i)=>(520+i*55)+'ms').attr('role','button').attr('tabindex',0)
    .attr('aria-label',d=>'对策卡：'+d+'。用上下方向键选风险，按回车配对').text(d=>d);

  function update(){
    const done=Object.keys(state.placed).length;
    d3.select('#count').text('风险链已接通 '+done+' / '+rows.length);
    rowSel.classed('done',d=>!!state.placed[d.id]);
    rowSel.select('.drop').classed('ready',d=>!!state.placed[d.id]).text(d=>state.placed[d.id]||'等待对策');
    cards.classed('placed',d=>Object.values(state.placed).includes(d)).attr('aria-disabled',d=>Object.values(state.placed).includes(d));
    if(done===rows.length){
      d3.select('.claim').classed('pulse',true);
      d3.select('#status').text('五条链共享同一原则：每种对策有代价，也都留下无法归零的风险。');
    }
  }
  function place(card,row){
    if(state.placed[row.id] || Object.values(state.placed).includes(card)) return;
    if(row.answer===card){
      state.placed[row.id]=card; update();
      const el=document.querySelector('[data-id="'+row.id+'"]'); el.classList.add('pulse'); setTimeout(()=>el.classList.remove('pulse'),600);
      d3.select('#status').text('已接通「'+row.risk+'」：继续比较其他风险链。');
    }else{
      const el=[...document.querySelectorAll('.strategy')].find(x=>x.textContent===card); el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),300);
      d3.select('#status').text('这项措施没有直接回应「'+row.risk+'」；先看这一行监测的信号。');
    }
  }
  cards.call(d3.drag()
    .filter(function(event,d){return !Object.values(state.placed).includes(d);})
    .on('start',function(){d3.select(this).classed('dragging',true);})
    .on('drag',function(event){d3.select(this).style('transform','translate('+event.x+'px,'+event.y+'px)');})
    .on('end',function(event,d){
      const source=event.sourceEvent; const hit=document.elementFromPoint(source.clientX,source.clientY); const drop=hit&&hit.closest('[data-drop]');
      d3.select(this).classed('dragging',false).style('transform',null);
      if(drop){const row=rows.find(r=>r.id===drop.dataset.drop);place(d,row);}
    }));
  cards.on('keydown',function(event,d){
    let idx=state.targets[d] == null ? 0 : state.targets[d];
    if(event.key==='ArrowDown'||event.key==='ArrowUp'){
      event.preventDefault(); idx=(idx+(event.key==='ArrowDown'?1:-1)+rows.length)%rows.length; state.targets[d]=idx;
      d3.selectAll('.drop').classed('ready',false); d3.select('[data-drop="'+rows[idx].id+'"]').classed('ready',true);
      d3.select('#status').text('当前目标：'+rows[idx].risk+'。按 Enter 放入「'+d+'」。');
    }else if(event.key==='Enter'||event.key===' '){event.preventDefault();place(d,rows[idx]);}
  });
  d3.select('#reset').on('click',function(){state.placed={};state.targets={};d3.select('.claim').classed('pulse',false);d3.selectAll('.drop').classed('ready',false);d3.select('#status').text('账本已重置。拖动对策卡到对应空位。');update();});
  update();
})();
</script>
</body>
</html>
