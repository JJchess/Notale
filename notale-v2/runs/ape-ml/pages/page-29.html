<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:48px 56px 42px;overflow:hidden;}
  .head{position:relative;z-index:5;width:610px;height:150px;}
  .kicker{margin-bottom:10px;color:var(--teal);font:700 15px/1.4 var(--font-mono);letter-spacing:.16em;}
  .head h1{font-size:48px;line-height:1.08;}
  .scene{position:relative;flex:1;min-height:0;isolation:isolate;}
  .photo{position:absolute;z-index:0;top:-84px;right:0;width:62%;height:650px;overflow:hidden;border-radius:var(--r-lg);background:var(--panel-deep);opacity:0;animation:subject-in .55s .28s ease-out forwards;}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:53% 50%;filter:saturate(.78) contrast(1.09) brightness(.72);}
  .photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0,transparent 30%),linear-gradient(0deg,var(--bg) 0,transparent 24%);}
  .earth{position:absolute;z-index:1;left:0;bottom:0;width:920px;height:250px;border:4px solid var(--teal);border-bottom-color:transparent;border-left-color:transparent;border-right-color:transparent;border-radius:50% 50% 0 0;opacity:0;box-shadow:0 -10px 34px rgba(54,214,192,.18),inset 0 20px 80px rgba(54,214,192,.08);animation:earth-in .5s ease-out forwards;}
  .earth:after{content:"";position:absolute;inset:14px;border:1px solid var(--teal-dim);border-radius:50%;}
  .support-ring{position:absolute;z-index:2;right:150px;top:20px;width:370px;height:430px;border:2px solid rgba(54,214,192,.34);border-radius:48%;box-shadow:0 0 32px rgba(54,214,192,.09);}
  .hub{position:absolute;z-index:4;right:475px;top:244px;width:12px;height:12px;border:3px solid var(--amber);border-radius:50%;background:var(--bg);box-shadow:0 0 14px var(--amber);}
  .wires{position:absolute;z-index:3;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;}
  .wire{fill:none;stroke:var(--teal);stroke-width:1.5;opacity:.82;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw .7s ease-out forwards;}
  .wire:nth-child(2){animation-delay:.52s}.wire:nth-child(3){animation-delay:.64s}.wire:nth-child(4){animation-delay:.76s}.wire:nth-child(5){animation-delay:.88s}.wire:nth-child(6){animation-delay:1s}
  .k-enumeration{position:absolute;z-index:5;inset:0;display:block;}
  .k-enumeration>.it{position:absolute;width:220px;height:86px;padding:13px 16px 12px 58px;border-width:1px;background:rgba(9,22,30,.92);opacity:0;animation:endpoint .3s ease-out forwards;}
  .k-enumeration>.it:before{content:"";position:absolute;left:17px;top:34px;width:8px;height:8px;border:2px solid var(--teal);border-radius:50%;background:var(--bg);box-shadow:0 0 12px rgba(54,214,192,.55);}
  .k-enumeration>.it:after{content:"";position:absolute;left:34px;top:21px;width:1px;height:42px;background:var(--line-strong);}
  .k-enumeration .it-title{margin:0 0 2px;font-size:16px;line-height:1.3;color:var(--text);}
  .k-enumeration .secondary{font-size:16px;line-height:1.35;white-space:nowrap;}
  .i1{left:0;top:38px;animation-delay:1.05s!important}.i2{left:255px;top:158px;animation-delay:1.17s!important}.i3{left:0;top:278px;animation-delay:1.29s!important}.i4{left:280px;top:398px;animation-delay:1.41s!important}.i5{left:570px;top:500px;width:260px!important;animation-delay:1.53s!important;}
  .mini-photo{position:absolute;right:7px;top:7px;width:82px;height:70px;overflow:hidden;border-radius:var(--r-sm);opacity:.55;}
  .mini-photo img{width:100%;height:100%;object-fit:cover;}
  .i5 .it-title,.i5 .secondary{max-width:130px;}
  .footer{position:absolute;z-index:6;right:0;bottom:8px;width:560px;padding-top:14px;border-top:1px solid var(--line-strong);}
  .footer .lead{color:var(--text);font-size:19px;}
  .footer .secondary{margin-top:5px;}
  @keyframes earth-in{from{opacity:0;transform:translate(-18px,18px)}to{opacity:.85;transform:none}}
  @keyframes subject-in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes endpoint{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.earth,.photo,.wire,.k-enumeration>.it{animation:none;opacity:1}.wire{stroke-dashoffset:0}}
</style>
</head>
<body data-page="29" data-total="45">
<div id="stage">
  <header class="head shrink0">
    <div class="kicker">EARTH IN THE LOOP · 第三幕 → 第四幕</div>
    <h1>一名旅者，<br>身后是整颗地球</h1>
  </header>
  <main class="scene min0" aria-label="宇航员与五类地球支持的并列连接图">
    <div class="photo" title="NASA 舱外活动现场照片"><img src="../../ape-ds2/pages/assets/img/p41/iss062e004933.jpg" alt="一名宇航员在黑色太空与地球背景前进行舱外活动"></div>
    <div class="earth" aria-hidden="true"></div>
    <div class="support-ring" aria-hidden="true"></div><div class="hub" aria-hidden="true"></div>
    <svg class="wires" viewBox="0 0 1488 660" preserveAspectRatio="none" aria-hidden="true">
      <polyline class="wire" points="1000,275 830,275 830,81 220,81"/>
      <polyline class="wire" points="1000,275 790,275 790,201 475,201"/>
      <polyline class="wire" points="1000,275 755,275 755,321 220,321"/>
      <polyline class="wire" points="1000,275 720,275 720,441 500,441"/>
      <polyline class="wire" points="1000,275 930,275 930,543 830,543"/>
      <circle cx="1000" cy="275" r="4" fill="var(--amber)" stroke="none"/>
    </svg>
    <div class="k-enumeration" aria-label="五类同级支持">
      <section class="it i1"><h2 class="it-title">能源 <span class="label">在场</span></h2><p class="secondary">太阳翼 · 供电</p></section>
      <section class="it i2"><h2 class="it-title">水 <span class="label">在场</span></h2><p class="secondary">水滴与储罐 · 饮用与卫生</p></section>
      <section class="it i3"><h2 class="it-title">空气 <span class="label">在场</span></h2><p class="secondary">气瓶与循环 · 呼吸与舱压</p></section>
      <section class="it i4"><h2 class="it-title">通信 <span class="label">在场</span></h2><p class="secondary">天线与信号波 · 语音与数据</p></section>
      <section class="it i5"><h2 class="it-title">地面团队 <span class="label">在场</span></h2><p class="secondary">监测、判断、接力</p><span class="mini-photo" title="NASA 航天任务现场"><img src="../../ape-ds2/pages/assets/img/p41/iss007e13293.jpg" alt="航天任务现场缩略图"></span></section>
    </div>
    <footer class="footer">
      <div class="label accent">五类支持 · 同时在场</div>
      <p class="lead">照片里只有一个人在太空，任务里却始终有地球在场。</p>
      <p class="secondary">旅者并未独自离开地球。</p>
    </footer>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:29,total:45});</script>
</body>
</html>
