<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{padding:24px 32px;overflow:hidden}
.hero{height:82px;display:flex;align-items:flex-start;justify-content:space-between}
.kicker{color:var(--amber);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em}
.hero .lead{max-width:820px;margin-top:5px}
.main{position:relative;display:flex;gap:18px;min-height:0}
.sim{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;border:var(--stroke) solid var(--line);border-radius:var(--r-lg);background:var(--panel-deep)}
.sim canvas{z-index:1}.hud{position:absolute;z-index:3;top:18px;right:18px;width:290px;padding:14px 16px}
.hud .value{font-size:var(--fs-body)}
.angle{margin-top:5px;color:var(--ink-muted);font:var(--fs-label)/1.4 var(--font-mono)}
.model-note{position:absolute;z-index:3;right:18px;bottom:14px}
.flow{position:absolute;z-index:3;left:18px;right:326px;top:16px;height:58px;--process-gap:5px}
.flow.k-process>.step{padding:7px 9px;font-size:var(--fs-label);line-height:1.25;text-align:center;background:rgba(13,27,36,.9)}
.flow.k-process>.arw{flex-basis:18px;font-size:18px}
.side{width:360px;display:flex;flex-direction:column;gap:14px;min-height:0}
.controls{padding:18px}.controls h2{margin-bottom:10px}.ctl{display:block;margin-top:10px}.ctl label{display:flex;justify-content:space-between;margin-bottom:2px}.ctl output{color:var(--teal);font-family:var(--font-mono)}
.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.buttons .btn{flex:1 1 72px}
.result{flex:1;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:10px}.result strong{font-size:var(--fs-h2);color:var(--amber)}
.result.orbit strong{color:var(--teal)}.result.impact strong{color:var(--danger)}.result.escape strong{color:#B78CFF}
.footer{height:128px;padding-top:14px}.footer .k-process{height:100%;--process-gap:7px}.footer .step{padding:12px;font-size:var(--fs-sec);line-height:1.35}.footer b{display:block;color:var(--teal-soft);margin-bottom:3px}
@media(prefers-reduced-motion:reduce){.sim,.flow{animation:none!important}}
</style>
</head>
<body data-page="30" data-total="45">
<div id="stage">
  <header class="hero shrink0">
    <div><div class="kicker">IV · ORBIT AS FALLING</div><h1>不断错过地面</h1></div>
    <p class="lead">进入轨道不是一直向上飞，而是获得足够横向速度，在重力拉落你的同时不断错过地面。</p>
  </header>
  <main class="main grow min0" style="flex:1">
    <section class="sim min0 no-pan" aria-label="牛顿炮连续弹道模拟">
      <canvas id="world" class="cv-fill"></canvas>
      <div class="k-process flow" aria-label="弹道因果链">
        <i class="axis"></i><div class="step current">给横向速度</div><span class="arw"></span><div class="step">重力持续弯折</div><span class="arw"></span><div class="step">地表同时弯走</div><span class="arw"></span><div class="step">判定结局</div>
      </div>
      <div class="readout hud"><span class="label">任务状态</span><span id="status" class="value" aria-live="polite">待发</span><span id="angleRead" class="angle">已绕行 0°</span></div>
      <div class="note model-note">理想化：真空、球形地球、关机后滑行</div>
    </section>
    <aside class="side min0">
      <section class="panel controls">
        <h2>设置初速度</h2>
        <div class="ctl"><label for="speed">速度 × 基准值 <output id="speedOut">1.00×</output></label><input id="speed" type="range" min="0.20" max="1.60" step="0.01" value="1.00"></div>
        <div class="ctl"><label for="dir">相对水平切线 <output id="dirOut">0°</output></label><input id="dir" type="range" min="-30" max="30" step="1" value="0"></div>
        <div class="buttons"><button id="launch" class="btn btn-target">发射</button><button id="pause" class="btn">暂停</button><button id="step" class="btn">单步</button><button id="reset" class="btn">重置</button></div>
      </section>
      <section id="result" class="panel result">
        <span class="chip is-current">观察任务</span><strong id="resultTitle">调节后发射</strong>
        <p id="resultText" class="body">比较轨迹：炮弹会先碰地，还是让地面从下方弯走？</p>
      </section>
    </aside>
  </main>
  <footer class="footer shrink0">
    <div class="k-process">
      <i class="axis"></i><div class="step"><b>① 向前</b>初速度有多少指向横向？</div><span class="arw"></span><div class="step"><b>② 拉落</b>它仍向前时，重力为何让轨迹下弯？</div><span class="arw"></span><div class="step"><b>③ 弯走</b>炮弹落下前，地面弯开了多少？</div><span class="arw"></span><div class="step"><b>④ 结局</b>撞击、绕行或离开判定边界</div>
    </div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script>
(function(){
Deck.init({index:30,total:45});
const {Engine,Runner,Bodies,Body,Composite}=Matter;
const engine=Engine.create({gravity:{x:0,y:0}}), runner=Runner.create({delta:1000/60});
const cv=document.getElementById('world'), speed=document.getElementById('speed'), dir=document.getElementById('dir');
const status=document.getElementById('status'), angleRead=document.getElementById('angleRead'), result=document.getElementById('result'), title=document.getElementById('resultTitle'), text=document.getElementById('resultText');
const Rm=Lec.K.EARTH_MEAN_RADIUS_M, alt=Lec.K.LEO_REFERENCE_ALTITUDE_M;
const orbitR=Lec.P.radiusFromAltitude(alt,Rm), baseV=Lec.P.circularOrbitVelocity(Lec.K.EARTH_MASS_KG,orbitR);
const earthR=235, launchR=earthR*(orbitR/Rm), cx=835, cy=430, scale=earthR/Rm;
let body, running=false, paused=false, trail=[], oldTrails=[], frame=0, startA=-Math.PI/2, swept=0, outcome='ready', flash=0;
function fmt(v){return Lec.P.significantFigures(v,3)}
function makeBody(){ if(body) Composite.remove(engine.world,body); body=Bodies.circle(cx,cy-launchR,5,{frictionAir:0,inertia:Infinity}); Composite.add(engine.world,body); trail=[]; swept=0; outcome='ready'; running=false; paused=false; updateUI(); }
function launch(){ if(running)return; if(trail.length) oldTrails.push(trail.slice()); if(oldTrails.length>4)oldTrails.shift(); makeBody(); const mult=+speed.value, a=(+dir.value)*Math.PI/180; const v=.46*mult; Body.setVelocity(body,{x:-v*Math.cos(a),y:-v*Math.sin(a)}); running=true; outcome='flight'; flash=8; updateUI(); }
function physics(){if(!running||paused)return; const dx=body.position.x-cx,dy=body.position.y-cy,r=Math.hypot(dx,dy); const vc=.46, amag=vc*vc*launchR/(r*r); Body.applyForce(body,body.position,{x:-dx/r*amag*body.mass/16.67,y:-dy/r*amag*body.mass/16.67}); Engine.update(engine,runner.delta); frame++; if(frame%2===0)trail.push({x:body.position.x,y:body.position.y}); if(trail.length>1800)trail.shift(); const ang=Math.atan2(dy,dx), delta=((ang-startA)+Math.PI*2)%(Math.PI*2); swept=Math.max(swept,delta); if(r<=earthR){finish('impact')} else if(swept>Math.PI*1.97&&r<launchR*1.25){finish('orbit')} else if(r>610){finish('escape')} }
function finish(kind){running=false;outcome=kind;flash=24;updateUI()}
function updateUI(){
 document.getElementById('speedOut').textContent=fmt(+speed.value)+'×'; document.getElementById('dirOut').textContent=(+dir.value>0?'+':'')+dir.value+'°';
 angleRead.textContent='已绕行 '+Math.min(360,Math.round(swept*180/Math.PI))+'°'; result.className='panel result '+outcome;
 const map={ready:['待发','调节后发射','比较轨迹：炮弹会先碰地，还是让地面从下方弯走？'],flight:['飞行中','重力正在持续弯折轨迹','炮弹仍在向前；引力每一刻都把方向拉向地心。'],impact:['判定 · 撞击','横向分量不足','地面在炮弹落下前没有弯开。'],orbit:['判定 · 轨道','轨道：一直下落，一直错过','轨迹完成一周，发射点与回返点接通。'],escape:['判定 · 逃逸','离开判定边界','这条轨迹越过了本页的观察边界。']};
 const m=map[outcome];status.textContent=m[0];title.textContent=m[1];text.textContent=(outcome==='impact'&&Math.abs(+dir.value)>18)?'你把较多速度花在上下方向，而不是持续错过地面。':m[2];
 document.querySelectorAll('.flow .step').forEach((el,i)=>{el.classList.toggle('current',i===(outcome==='ready'?0:outcome==='flight'?1:3));el.classList.toggle('done',outcome!=='ready'&&i<3)});
}
function draw(){const ctx=Deck.fit(cv),w=cv.offsetWidth,h=cv.offsetHeight;ctx.clearRect(0,0,w,h);ctx.save();
 ctx.strokeStyle=Deck.rgba('--line',.35);ctx.lineWidth=1;ctx.setLineDash([3,12]);for(let x=40;x<w;x+=90){ctx.beginPath();ctx.moveTo(x,82);ctx.lineTo(x,h);ctx.stroke()}for(let y=100;y<h;y+=90){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.setLineDash([]);
 const grd=ctx.createRadialGradient(cx,cy,earthR*.7,cx,cy,earthR);grd.addColorStop(0,Deck.token('--panel-hi'));grd.addColorStop(1,Deck.token('--panel'));ctx.fillStyle=grd;ctx.beginPath();ctx.arc(cx,cy,earthR,0,Math.PI*2);ctx.fill();ctx.strokeStyle=Deck.token('--teal');ctx.lineWidth=4;ctx.stroke();
 oldTrails.forEach(t=>path(ctx,t,Deck.rgba('--ink-faint',.28),2));path(ctx,trail,outcome==='impact'?Deck.token('--danger'):outcome==='orbit'?Deck.token('--teal'):outcome==='escape'?'#B78CFF':Deck.token('--text'),outcome==='orbit'?4:3);
 const bx=body.position.x,by=body.position.y;ctx.fillStyle=outcome==='ready'?Deck.token('--amber'):Deck.token('--text');ctx.beginPath();ctx.arc(bx,by,7,0,Math.PI*2);ctx.fill();
 const dx=cx-bx,dy=cy-by,d=Math.hypot(dx,dy);ctx.strokeStyle=Deck.token('--amber');ctx.lineWidth=2;Deck.arrow(ctx,bx,by,bx+dx/d*54,by+dy/d*54,8);ctx.stroke();
 if(outcome==='ready'){const a=(+dir.value)*Math.PI/180,len=105;ctx.strokeStyle=Deck.token('--teal');ctx.lineWidth=3;Deck.arrow(ctx,bx,by,bx-len*Math.cos(a),by-len*Math.sin(a),10);ctx.stroke()}
 if(flash>0){ctx.strokeStyle=outcome==='impact'?Deck.token('--danger'):Deck.token('--amber');ctx.globalAlpha=flash/24;ctx.lineWidth=3;ctx.beginPath();ctx.arc(bx,by,32-flash,0,Math.PI*2);ctx.stroke();flash--}ctx.restore(); }
function path(ctx,t,color,width){if(t.length<2)return;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(t[0].x,t[0].y);for(let i=1;i<t.length;i++)ctx.lineTo(t[i].x,t[i].y);ctx.stroke()}
[speed,dir].forEach(el=>el.addEventListener('input',()=>{if(!running)makeBody();updateUI()}));
document.getElementById('launch').onclick=launch;document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'继续':'暂停'};document.getElementById('step').onclick=()=>{if(outcome==='ready')launch();paused=true;physics();draw()};document.getElementById('reset').onclick=()=>{oldTrails=[];speed.value='1.00';dir.value='0';makeBody()};
makeBody();Deck.autofit(cv,draw);Deck.loop(()=>{for(let i=0;i<2;i++)physics();draw()},{still:1});
})();
</script>
</body>
</html>
