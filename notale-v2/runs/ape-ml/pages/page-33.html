<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#071018;--text:#E7F2F1;--font-sans:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif}
#stage{padding:30px 38px 28px;gap:18px;overflow:hidden}
.head{height:92px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid var(--line);padding-bottom:14px}
.kicker{font:700 15px/1.4 var(--font-mono);letter-spacing:.13em;color:var(--teal)}
h1{font-size:40px;margin-top:4px}.take{max-width:650px;padding:12px 18px;border-left:6px solid var(--teal);background:var(--panel-hi);font-size:17px;line-height:1.45;font-weight:650}
.main{display:flex;gap:18px;min-height:0}.console{flex:0 0 390px;padding:18px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));overflow:auto}.console h2{margin-bottom:10px}
.ctl{min-height:43px}.ctl output{min-width:76px;text-align:right;color:var(--teal);font:700 16px/1.3 var(--font-mono)}.ctl label{width:94px}.ctl select{flex:1}.buttons{display:flex;gap:10px;margin-top:12px}.buttons .btn{flex:1}
.scene{position:relative;flex:1;min-width:0;overflow:hidden;border:2px solid var(--line);border-radius:var(--r-md);background:linear-gradient(90deg,transparent 49.8%,var(--line) 50%,transparent 50.2%),radial-gradient(circle at 75% 110%,rgba(54,214,192,.15),transparent 40%),var(--panel-deep)}
#world{position:absolute;inset:0}.orbit{position:absolute;left:8%;right:5%;top:44%;height:190px;border-top:2px dashed var(--teal-dim);border-radius:50%;pointer-events:none}.earth{position:absolute;width:650px;height:180px;right:0;bottom:0;opacity:.55}.zone{position:absolute;top:18px;width:28%;min-height:92px;padding:10px 12px;border:2px solid var(--line-strong);border-radius:10px;background:rgba(13,27,36,.88);pointer-events:none}.zone .zt{font-size:15px;font-weight:750;color:var(--teal-soft)}.zone .zs{font-size:14px;color:var(--ink-muted);line-height:1.35}.z1{left:3%}.z2{left:36%}.z3{right:3%;border-color:var(--amber-deep)}
.drag-note{position:absolute;left:20px;bottom:18px;font-size:16px;color:var(--amber-soft);padding:8px 12px;background:var(--panel);border:1px solid var(--amber-deep);border-radius:8px}.status{position:absolute;right:18px;bottom:18px;font:700 16px/1.4 var(--font-mono);color:var(--teal)}
.bottom{height:182px;display:flex;gap:18px;min-height:0}.classify{flex:1;display:flex;flex-direction:row;gap:12px}.classify .box{flex:1;padding:12px}.classify .box>.bt{font-size:18px;min-height:32px;margin:-12px -12px 10px;padding:7px 12px}.classify .lv{padding:7px 0 7px 22px;margin-left:5px;font-size:15px;line-height:1.3}.classify .lv:before{top:18px;width:14px}
.metrics{flex:0 0 470px;display:flex;gap:12px}.readout{flex:1;padding:12px}.readout .value{font-size:18px}.readout .label{font-size:14px}.readout small{font-size:14px;color:var(--ink-muted);line-height:1.35;margin-top:5px}
.msg{margin-top:10px;min-height:46px;color:var(--amber-soft);font-size:16px;line-height:1.4}
canvas{touch-action:none}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body data-page="33" data-total="45">
<div id="stage">
  <header class="head shrink0">
    <div><div class="kicker">SYSTEM / STAGING · 33</div><h1>为什么要抛掉空级？</h1></div>
    <p class="take">分级有效，因为已经无用的结构不必继续被后续推进剂加速。</p>
  </header>
  <main class="main grow min0">
    <section class="panel console min0" aria-label="火箭级配置">
      <h2>配置当前火箭</h2>
      <div class="ctl"><label for="count">级数</label><select id="count"><option value="1">1 级</option><option value="2" selected>2 级</option><option value="3">3 级</option></select></div>
      <div class="ctl"><label for="dry">干质量</label><input id="dry" type="range" min="2" max="12" step="1"><output id="dryV"></output></div>
      <div class="ctl"><label for="fuel">推进剂</label><input id="fuel" type="range" min="10" max="90" step="5"><output id="fuelV"></output></div>
      <div class="ctl"><label for="isp">比冲</label><input id="isp" type="range" min="250" max="450" step="10"><output id="ispV"></output></div>
      <p class="secondary">先点燃。燃尽后，把闪烁的空级拖入“已抛弃”。</p>
      <div class="buttons"><button class="btn btn-primary" id="ignite">点燃本级</button><button class="btn" id="reset">重置配置</button></div>
      <p class="msg" id="msg" aria-live="polite">当前：第 1 / 2 级 · 待点燃</p>
    </section>
    <section class="scene min0 no-pan" id="scene" aria-label="分级火箭侧视物理场景">
      <canvas id="world" class="cv-fill"></canvas><div class="orbit"></div><div class="earth earth-arc"></div>
      <div class="zone z1"><div class="zt">仍须加速</div><div class="zs">载荷、未燃烧的上面级</div></div>
      <div class="zone z2"><div class="zt">正在消耗</div><div class="zs">当前级推进剂 → 速度增量</div></div>
      <div class="zone z3"><div class="zt">已抛弃</div><div class="zs">燃尽后的结构支路</div></div>
      <div class="drag-note">拖走空级，解除琥珀锁扣</div><div class="status" id="phase">第 1 / 2 级</div>
    </section>
  </main>
  <footer class="bottom shrink0">
    <section class="k-classification classify min0" aria-label="质量状态分类">
      <div class="box"><div class="bt">仍须加速</div><div class="lv">载荷 <span id="payload">5 t</span></div><div class="lv" id="remainLabel">上面级：仍在主干</div></div>
      <div class="box"><div class="bt">正在消耗</div><div class="lv" id="burnLabel">第 1 级推进剂</div><div class="lv">转化为本级速度增量</div></div>
      <div class="box"><div class="bt">已无用</div><div class="lv" id="deadLabel">等待本级燃尽</div><div class="lv">只有空结构可进入此支路</div></div>
    </section>
    <section class="metrics min0" aria-label="速度增量读数">
      <div class="readout"><span class="label">本级贡献</span><span class="value" id="stageDv">0 km/s</span><small>由当前质量与比冲计算</small></div>
      <div class="readout is-target"><span class="label">累计速度增量</span><span class="value" id="totalDv">0 km/s</span><small id="compare">抛级后继续累计</small></div>
    </section>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script>
(function(){
Deck.init({index:33,total:45});
const $=id=>document.getElementById(id), payload=5;
const defaults=[{dry:8,fuel:70,isp:300},{dry:3,fuel:20,isp:340},{dry:2,fuel:12,isp:360}];
let stages=defaults.map(x=>({...x})), current=0, burned=false, completed=[], bodies=[];
const engine=Matter.Engine.create({gravity:{x:0,y:0,scale:0}}), world=engine.world;
const canvas=$('world'), scene=$('scene');
const render=Matter.Render.create({canvas,engine,options:{width:scene.clientWidth,height:scene.clientHeight,wireframes:false,background:'transparent',pixelRatio:1}});
render.options.showAngleIndicator=false;
const mouse=Matter.Mouse.create(canvas), mouseConstraint=Matter.MouseConstraint.create(engine,{mouse,constraint:{stiffness:.18,damping:.12,render:{visible:false}}});
Matter.Composite.add(world,mouseConstraint); render.mouse=mouse;
function activeCount(){return +$('count').value}
function effective(){
 const n=activeCount(), out=[];
 for(let i=0;i<n;i++){
   let upper=payload; for(let j=i+1;j<n;j++) upper+=stages[j].dry+stages[j].fuel;
   out.push({specificImpulse:stages[i].isp,wetMass:upper+stages[i].dry+stages[i].fuel,dryMass:upper+stages[i].dry});
 } return out;
}
function sf(v){return Lec.P.significantFigures(v,3)}
function config(){let s=stages[Math.min(current,activeCount()-1)]; $('dry').value=s.dry;$('fuel').value=s.fuel;$('isp').value=s.isp; values();}
function values(){let s=stages[Math.min(current,activeCount()-1)];s.dry=+$('dry').value;s.fuel=+$('fuel').value;s.isp=+$('isp').value;$('dryV').textContent=s.dry+' t';$('fuelV').textContent=s.fuel+' t';$('ispV').textContent=s.isp+' s';build();}
function build(){
 bodies.forEach(b=>Matter.Composite.remove(world,b));bodies=[];
 const n=activeCount(), w=scene.clientWidth, h=scene.clientHeight, baseX=w*.57, baseY=h*.72;
 const pay=Matter.Bodies.trapezoid(baseX,baseY-n*72-42,48,56,.55,{isStatic:true,label:'载荷',render:{fillStyle:'#36D6C0',strokeStyle:'#8DE9DC',lineWidth:2}}); bodies.push(pay);
 for(let i=n-1;i>=0;i--){let y=baseY-i*72;let body=Matter.Bodies.rectangle(baseX,y,88,58,{isStatic:!(burned&&i===current),label:'第'+(i+1)+'级结构',render:{fillStyle:i===current?'#152B36':'#0D1B24',strokeStyle:i===current?'#FFB547':'#36D6C0',lineWidth:3}});body.plugin={index:i};bodies.push(body)}
 Matter.Composite.add(world,bodies);
}
function updateLabels(){let n=activeCount(), ix=Math.min(current,n-1);$('phase').textContent='第 '+(ix+1)+' / '+n+' 级';$('remainLabel').textContent=ix<n-1?'上面级：仍在主干':'载荷：保留在主干';$('burnLabel').textContent=burned?'推进剂已耗尽':'第 '+(ix+1)+' 级推进剂';$('deadLabel').textContent=burned?'第 '+(ix+1)+' 级结构：可抛':'等待本级燃尽';}
function ignite(){if(burned||current>=activeCount())return;burned=true;let e=effective()[current], dv=Lec.P.rocketDeltaV(e.specificImpulse,e.wetMass,e.dryMass);completed.push(dv);$('stageDv').textContent=sf(dv/1000)+' km/s';$('totalDv').textContent=sf(completed.reduce((a,b)=>a+b,0)/1000)+' km/s';$('msg').textContent='第 '+(current+1)+' 级燃尽 · 可抛掉空结构';updateLabels();build();}
Matter.Events.on(mouseConstraint,'enddrag',ev=>{let b=ev.body;if(!b||b.plugin.index!==current)return;let threshold=scene.clientWidth*.68;if(!burned||b.position.x<threshold){Matter.Body.setPosition(b,{x:scene.clientWidth*.57,y:scene.clientHeight*.72-current*72});Matter.Body.setVelocity(b,{x:burned?-2:0,y:0});$('msg').textContent=burned?'请把空级拖入右侧“已抛弃”支路':'这部分仍有任务：只能抛掉已燃尽的结构。';return;}Matter.Body.applyForce(b,b.position,{x:.006,y:-.001});current++;burned=false;if(current>=activeCount()){$('msg').textContent='分级完成 · 空结构没有继续被加速';let all=effective(), staged=Lec.P.stagedRocketDeltaV(all).totalDeltaV;let retained=all.reduce((sum,e,i)=>{let dead=stages.slice(0,i).reduce((a,s)=>a+s.dry,0);return sum+Lec.P.rocketDeltaV(e.specificImpulse,e.wetMass+dead,e.dryMass+dead)},0);$('totalDv').textContent=sf(staged/1000)+' km/s';$('compare').textContent='若保留空级：'+sf(retained/1000)+' km/s';$('ignite').disabled=true;}else{$('msg').textContent='第 '+(current+1)+' / '+activeCount()+' 级 · 待点燃';config();}updateLabels();});
function reset(){current=0;burned=false;completed=[];stages=defaults.map(x=>({...x}));$('count').value='2';$('ignite').disabled=false;$('stageDv').textContent='0 km/s';$('totalDv').textContent='0 km/s';$('compare').textContent='抛级后继续累计';$('msg').textContent='当前：第 1 / 2 级 · 待点燃';config();updateLabels();}
['dry','fuel','isp'].forEach(id=>$(id).addEventListener('input',values));$('count').addEventListener('change',reset);$('ignite').addEventListener('click',ignite);$('reset').addEventListener('click',reset);
function resize(){let w=scene.clientWidth,h=scene.clientHeight;canvas.width=w;canvas.height=h;render.options.width=w;render.options.height=h;render.bounds.max.x=w;render.bounds.max.y=h;Matter.Mouse.setScale(mouse,{x:1,y:1});build();}
Deck.onResize(resize); Matter.Render.run(render); const runner=Matter.Runner.create(); if(!Deck.reduced())Matter.Runner.run(runner,engine); else Matter.Engine.update(engine,16.67);
reset(); requestAnimationFrame(resize);
})();
</script>
</body>
</html>
