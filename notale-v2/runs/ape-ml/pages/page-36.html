<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{padding:24px 30px 22px;gap:14px;overflow:hidden}
.topline{height:88px;display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.kicker{color:var(--teal);font:700 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.12em;margin-bottom:5px}
.progress{display:flex;align-items:center;gap:12px;padding-top:8px}.ring{display:flex;gap:7px}.seg{width:28px;height:8px;border:1px solid var(--line-strong);border-radius:999px;background:var(--panel-deep)}.seg.on{border-color:var(--teal);background:var(--teal)}
.workspace{position:relative;display:flex;gap:14px;min-height:0}.space{position:relative;flex:1.18;min-width:0;overflow:hidden;border:2px solid var(--line);border-radius:var(--r-lg);background:var(--panel-deep)}
#globe{position:absolute;inset:0}.space-ui{position:absolute;inset:0;pointer-events:none}.scale-note{position:absolute;left:16px;bottom:14px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-deep);color:var(--ink-muted);font-size:var(--fs-label)}
.body-label{position:absolute;padding:5px 9px;border:1px solid var(--teal-dim);border-radius:999px;background:var(--panel-deep);font-size:var(--fs-label);font-weight:700}.earth-l{left:16%;bottom:17%}.moon-l{left:55%;top:30%}.mars-l{right:11%;top:15%;border-color:var(--amber-deep);color:var(--amber-soft)}
.controls{position:absolute;left:16px;top:14px;z-index:3;display:flex;gap:8px;pointer-events:auto}.window-btn{min-height:40px;padding:6px 12px}.window-btn.active{border-color:var(--teal);color:var(--teal-soft)}
.side{flex:.82;min-width:0;display:flex;flex-direction:column;gap:12px}.constraint-set{display:flex;gap:8px}.constraint-set .btn{flex:1;padding:7px 8px}.constraint-set .btn.active{color:var(--panel-deep);border-color:var(--amber);background:var(--amber)}
.k-comparison{flex:1;--cmp-cols:2}.k-comparison>.hdr,.k-comparison>.dim,.k-comparison>.cell{padding:9px 12px}.cmp-row.active>.dim,.cmp-row.active>.cell{background:rgba(54,214,192,.1);box-shadow:inset 0 0 0 2px var(--teal)}.cmp-row.checked>.dim::before{content:'✓ ';color:var(--success)}
.distance-bar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel)}.distance-bar .value{color:var(--teal);font:700 var(--fs-h2)/1.2 var(--font-mono)}
.conclusion{height:57px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:10px 16px;border-left:7px solid var(--teal);background:var(--panel-hi);font-size:var(--fs-lead);font-weight:700;opacity:.42;transition:opacity .25s}.conclusion.done{opacity:1}.reset{display:none}.conclusion.done .reset{display:inline-flex}
.pulse{position:absolute;width:15px;height:15px;border-radius:50%;background:var(--amber);box-shadow:0 0 22px var(--amber);opacity:0;pointer-events:none}.pulse.go{animation:travel 1.1s ease-out}@keyframes travel{0%{left:28%;top:67%;opacity:1}100%{left:78%;top:24%;opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.pulse.go{left:78%;top:24%;opacity:1}}
</style>
</head>
<body data-page="36" data-total="45">
<div id="stage">
  <header class="topline shrink0">
    <div><div class="kicker">MISSION DISTANCE · 36</div><h1>月球或火星：距离改写整套任务</h1><p class="lead">距离同时改变航行时间、通信延迟、补给机会和紧急返回能力。</p></div>
    <div class="progress"><span class="label" id="progressText" aria-live="polite">已比较 0/4 项</span><span class="ring" aria-hidden="true"><i class="seg"></i><i class="seg"></i><i class="seg"></i><i class="seg"></i></span></div>
  </header>
  <main class="workspace grow min0">
    <section class="space no-pan min0" aria-label="可旋转的地球、月球与火星任务空间">
      <div id="globe"></div><div class="pulse" id="pulse"></div>
      <div class="controls ctl"><label for="windowSelect">任务窗口</label><select id="windowSelect" aria-label="任务窗口"><option value="moon">月球基准</option><option value="near">火星较近位置</option><option value="far">火星较远位置</option></select></div>
      <div class="space-ui"><span class="body-label earth-l">地球</span><span class="body-label moon-l">月球 · 近侧</span><span class="body-label mars-l">火星 · 远景</span><span class="scale-note">示意图：距离与天体尺寸均已非线性压缩</span></div>
    </section>
    <section class="side min0" aria-label="月球与火星任务比较">
      <div class="distance-bar"><span><span class="label">当前真实距离</span><br><span class="secondary" id="windowName">地月平均距离</span></span><span class="value" id="distanceValue">—</span></div>
      <div class="constraint-set" role="group" aria-label="选择要检查的约束">
        <button class="btn active" data-dim="travel">航行</button><button class="btn" data-dim="signal">通信</button><button class="btn" data-dim="supply">补给</button><button class="btn" data-dim="return">返回</button>
      </div>
      <div class="k-comparison" id="comparison">
        <div class="hdr">任务维度</div><div class="hdr">月球任务</div><div class="hdr">火星任务</div>
        <div class="cmp-row active" data-row="travel"><div class="dim">航行时间</div><div class="cell">约 3 天<br><span class="muted">教学任务情境</span></div><div class="cell diff">约 6–9 个月<br><span class="muted">随窗口与路线改变</span></div></div><div class="rowline"></div>
        <div class="cmp-row" data-row="signal"><div class="dim">往返信号延迟</div><div class="cell mono" id="moonDelay">—</div><div class="cell mono diff" id="marsDelay">—</div></div><div class="rowline"></div>
        <div class="cmp-row" data-row="supply"><div class="dim">补给机会</div><div class="cell">可按数日级航程规划</div><div class="cell diff">途中不能即时补给</div></div><div class="rowline"></div>
        <div class="cmp-row" data-row="return"><div class="dim">紧急返回</div><div class="cell">可能存在数日级方案</div><div class="cell diff">不能把立刻掉头作为常规预案</div></div>
      </div>
    </section>
  </main>
  <footer class="conclusion shrink0" id="conclusion"><span>月球与火星不是同一道任务题换了目的地：距离会同时重写时间、通信、补给和返回条件。</span><button class="btn reset" id="reset">重置比较</button></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/three.min.js"></script>
<script src="assets/lib/globe.gl.min.js"></script>
<script>
(function(){
  Deck.init({index:36,total:45});
  const moonDist=Lec.K.moon.meanDistance;
  const earthOrbit=Lec.K.earth.semimajorAxis;
  const marsOrbit=Lec.K.solarSystem.mars.semimajorAxis;
  const marsNear=Math.abs(marsOrbit-earthOrbit), marsFar=marsOrbit+earthOrbit;
  const state={window:'moon',dim:'travel',done:new Set()};
  const fmt=v=>Lec.P.significantFigures(v,3);
  const delay=d=>Lec.P.roundTripSignalDelay(d);
  const fmtDelay=s=>s<60?fmt(s)+' 秒':fmt(s/60)+' 分钟';
  document.getElementById('moonDelay').textContent=fmtDelay(delay(moonDist));
  const globe=Globe()(document.getElementById('globe'))
    .backgroundColor('#071018').showAtmosphere(true).atmosphereColor('#36D6C0').atmosphereAltitude(0.12)
    .arcColor(()=> '#36D6C0').arcStroke(0.55).arcDashLength(0.45).arcDashGap(0.18).arcDashAnimateTime(Deck.reduced()?0:1800)
    .arcsData([{startLat:18,startLng:-28,endLat:12,endLng:42},{startLat:18,startLng:-28,endLat:38,endLng:118}])
    .pointOfView({lat:18,lng:-28,altitude:2.2},Deck.reduced()?0:900);
  globe.globeMaterial().color.set(Deck.token('--panel-hi')); globe.globeMaterial().emissive.set(Deck.token('--teal-dim')); globe.globeMaterial().emissiveIntensity=.22;
  function resize(){const e=document.getElementById('globe');globe.width(e.clientWidth).height(e.clientHeight)} Deck.onResize(resize);resize();
  function render(){
    const d=state.window==='moon'?moonDist:(state.window==='near'?marsNear:marsFar);
    document.getElementById('windowName').textContent=state.window==='moon'?'地月平均距离':(state.window==='near'?'地火较近位置':'地火较远位置');
    document.getElementById('distanceValue').textContent=fmt(d/1000)+' km';
    document.getElementById('marsDelay').textContent=fmtDelay(delay(state.window==='moon'?marsNear:d));
    document.getElementById('windowSelect').value=state.window;
    document.querySelectorAll('[data-dim]').forEach(b=>b.classList.toggle('active',b.dataset.dim===state.dim));
    document.querySelectorAll('.cmp-row').forEach(r=>{r.classList.toggle('active',r.dataset.row===state.dim);r.classList.toggle('checked',state.done.has(r.dataset.row))});
    const n=state.done.size;document.getElementById('progressText').textContent='已比较 '+n+'/4 项';document.querySelectorAll('.seg').forEach((s,i)=>s.classList.toggle('on',i<n));document.getElementById('conclusion').classList.toggle('done',n===4);
  }
  document.getElementById('windowSelect').addEventListener('change',e=>{state.window=e.target.value;render()});
  document.querySelectorAll('[data-dim]').forEach(b=>b.addEventListener('click',()=>{state.dim=b.dataset.dim;state.done.add(state.dim);const p=document.getElementById('pulse');p.classList.remove('go');void p.offsetWidth;p.classList.add('go');render()}));
  document.getElementById('reset').addEventListener('click',()=>{state.window='moon';state.dim='travel';state.done.clear();render()});
  render();
})();
</script>
</body>
</html>
