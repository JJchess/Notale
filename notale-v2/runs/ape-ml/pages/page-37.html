<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:32px 40px 28px;gap:18px;}
  .eyebrow{color:var(--teal);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em;}
  .head{height:92px;display:flex;align-items:flex-end;justify-content:space-between;gap:32px;}
  .take{max-width:740px;text-align:right;color:var(--teal-soft);font-size:var(--fs-lead);font-weight:600;line-height:var(--lh-copy);}
  .work{display:flex;gap:20px;min-height:0;}
  .network{position:relative;flex:1.85;min-width:0;min-height:0;padding:18px 20px 14px;border:var(--stroke) solid var(--line);border-radius:var(--r-lg);background:var(--panel-deep);overflow:hidden;}
  .network svg{width:100%;height:100%;display:block;}
  .console{flex:.72;min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px;padding:18px;border:var(--stroke) solid var(--line-strong);border-radius:var(--r-lg);background:var(--panel);}
  .console .ctl{display:block;min-height:0;}
  .console label{display:block;margin-bottom:6px;color:var(--ink-muted);font-size:var(--fs-label);font-weight:650;}
  select{width:100%;height:44px;padding:6px 10px;color:var(--text);font-size:var(--fs-sec);border:var(--stroke) solid var(--line-strong);border-radius:var(--r-sm);background:var(--panel-deep);}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .actions .btn{font-size:var(--fs-sec);padding:8px 10px;}
  .status-row{display:flex;gap:8px;flex-wrap:wrap;}
  .lamp{display:flex;align-items:center;gap:7px;padding:5px 9px;color:var(--ink-muted);font-size:var(--fs-label);border:1px solid var(--line);border-radius:999px;}
  .lamp::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--teal);}
  .lamp.off::before{background:var(--amber);}
  .log{flex:1;min-height:92px;padding:10px 12px;color:var(--ink-muted);font-size:var(--fs-sec);line-height:var(--lh-copy);border-left:3px solid var(--teal-dim);background:var(--panel-deep);overflow:hidden;}
  .log strong{color:var(--text);}
  .guide{height:178px;gap:14px!important;}
  .guide .claim{padding:12px 18px;}
  .guide .trunk{min-height:18px;}
  .guide .supports{grid-template-columns:repeat(4,1fr);gap:12px;}
  .guide .supports::before,.guide .support::before,.guide .support::after{display:none;}
  .guide .support{padding:10px 12px;text-align:center;}
  .guide .support b{display:block;color:var(--teal-soft);font-size:var(--fs-sec);}
  .node{cursor:pointer;outline:none;}
  .node rect{fill:var(--panel);stroke:var(--teal-dim);stroke-width:2;transition:stroke-width 180ms ease;}
  .node text{fill:var(--text);font-family:var(--font-sans);font-size:16px;font-weight:650;pointer-events:none;}
  .node.failed rect{stroke:var(--amber);fill:rgba(255,181,71,.10);stroke-width:4;}
  .node.isolated rect{stroke:var(--ink-faint);stroke-dasharray:7 5;}
  .node.selected rect{stroke:var(--amber-soft);stroke-width:5;}
  .node.cabin rect{rx:26;}
  .node.cabin.ok rect{stroke:var(--teal);filter:drop-shadow(0 0 8px rgba(54,214,192,.35));}
  .link{fill:none;stroke:var(--teal);stroke-width:2;opacity:.72;}
  .link.failed{stroke:var(--amber);stroke-width:4;opacity:1;stroke-dasharray:9 6;}
  .link.isolated{stroke:var(--ink-faint);stroke-dasharray:3 8;}
  .breakmark{fill:var(--panel-deep);stroke:var(--ink-muted);stroke-width:2;}
  .shake{animation:shake 160ms ease-in-out;}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="37" data-total="45">
<div id="stage">
  <header class="head shrink0">
    <div><div class="eyebrow">SYSTEM RELIABILITY · 37 / 45</div><h1>别让故障穿过整艘船</h1></div>
    <p class="take">高可靠任务依赖冗余、隔离和恢复，因为一个小故障可能跨系统传播。</p>
  </header>
  <main class="work min0" style="flex:1">
    <section class="network min0 no-pan" aria-label="飞船系统依赖网络">
      <svg id="net" viewBox="0 0 760 500" role="img" aria-label="能源、温控、空气、通信到乘员舱的依赖网络"></svg>
    </section>
    <aside class="console min0" aria-label="故障处置控制台">
      <div class="row justify-between items-center"><h2>任务控制台</h2><span id="phase" class="chip">待命</span></div>
      <div class="ctl"><label for="preset">设备级事件</label><select id="preset"><option>电源 A 短路</option><option>温控 A 停转</option><option>通信节点失联</option></select></div>
      <div class="readout"><span class="label">关键功能在线</span><span id="count" class="value" aria-live="polite">3 / 3</span></div>
      <div id="lamps" class="status-row"><span class="lamp">温控</span><span class="lamp">空气</span><span class="lamp">通信</span></div>
      <div class="actions">
        <button id="inject" class="btn btn-target">注入故障</button>
        <button id="isolate" class="btn">隔离所选节点</button>
        <button id="backup" class="btn btn-primary">接通备用</button>
        <button id="reset" class="btn">重置</button>
      </div>
      <div id="log" class="log" aria-live="polite"><strong>操作：</strong>注入故障，点击橙色链路上游节点，再隔离并接通备用。</div>
      <p class="note">连线表示功能依赖，不是物理管线。节点可用 Tab 选择，Enter 确认。</p>
    </aside>
  </main>
  <section class="k-generalization guide shrink0" aria-label="可靠性原则归纳">
    <div class="claim">高可靠不是保证永不出错，而是让错误不轻易扩散，并让关键功能能够恢复。</div>
    <div class="trunk"></div>
    <div class="supports">
      <div class="support"><b>看见依赖</b>小故障可能不再“小”</div>
      <div class="support"><b>保留冗余</b>备用必须真正独立</div>
      <div class="support"><b>切断传播</b>先阻止继续扩散</div>
      <div class="support"><b>恢复功能</b>恢复不是假装没坏过</div>
    </div>
  </section>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
Deck.init({index:37,total:45});
const nodes=[["电源 A",90,110],["电源 B",90,390],["温控 A",290,110],["温控 B",290,390],["空气循环",490,180],["通信",490,320],["乘员舱",680,250]].map(d=>({name:d[0],x:d[1],y:d[2]}));
const links=[["电源 A","温控 A"],["电源 A","空气循环"],["电源 A","通信"],["电源 B","温控 B"],["电源 B","空气循环"],["电源 B","通信"],["温控 A","乘员舱"],["温控 B","乘员舱"],["空气循环","乘员舱"],["通信","乘员舱"]].map(d=>({source:d[0],target:d[1]}));
const svg=d3.select('#net'), nodeMap=new Map(nodes.map(d=>[d.name,d]));
const edge=svg.append('g').selectAll('line').data(links).join('line').attr('class','link').attr('x1',d=>nodeMap.get(d.source).x+56).attr('y1',d=>nodeMap.get(d.source).y).attr('x2',d=>nodeMap.get(d.target).x-56).attr('y2',d=>nodeMap.get(d.target).y);
const ng=svg.append('g').selectAll('g').data(nodes).join('g').attr('class',d=>'node '+(d.name==='乘员舱'?'cabin ok':'')).attr('transform',d=>`translate(${d.x-56},${d.y-26})`).attr('tabindex',0).attr('role','button').attr('aria-label',d=>'选择 '+d.name);
ng.append('rect').attr('width',112).attr('height',52).attr('rx',10); ng.append('text').attr('x',56).attr('y',32).attr('text-anchor','middle').text(d=>d.name);
const state={failed:new Set(),isolated:new Set(),selected:null,injected:null,backup:false,timers:[]};
const preset=document.querySelector('#preset'), log=document.querySelector('#log'), phase=document.querySelector('#phase');
function source(){return preset.selectedIndex===0?'电源 A':preset.selectedIndex===1?'温控 A':'通信'}
function descendants(start){const out=[],q=[start],seen=new Set([start]);while(q.length){const a=q.shift();links.filter(l=>l.source===a&&!state.isolated.has(a)).forEach(l=>{if(!seen.has(l.target)){seen.add(l.target);out.push(l.target);q.push(l.target)}})}return out}
function critical(){return {温控:!state.failed.has('温控 A')||!state.failed.has('温控 B'),空气:!state.failed.has('空气循环'),通信:!state.failed.has('通信')}}
function render(){const dur=Deck.reduced()?0:320;ng.classed('failed',d=>state.failed.has(d.name)).classed('isolated',d=>state.isolated.has(d.name)).classed('selected',d=>state.selected===d.name).classed('ok',d=>d.name==='乘员舱'&&!state.failed.has('乘员舱'));edge.transition().duration(dur).attr('class',d=>{if(state.isolated.has(d.source))return'link isolated';if(state.failed.has(d.source)&&state.failed.has(d.target))return'link failed';return'link'});const c=critical(),vals=Object.values(c),n=vals.filter(Boolean).length;document.querySelector('#count').textContent=n+' / '+vals.length;document.querySelectorAll('.lamp').forEach((el,i)=>el.classList.toggle('off',!vals[i]));}
function clearTimers(){state.timers.forEach(clearTimeout);state.timers=[]}
function inject(){reset(false);state.injected=source();const chain=[state.injected,...descendants(state.injected)];phase.textContent='故障传播';log.innerHTML='<strong>故障已注入：</strong>'+state.injected+'。沿橙色依赖线寻找上游。';if(Deck.reduced()){chain.forEach(n=>state.failed.add(n));render();return}chain.forEach((n,i)=>state.timers.push(setTimeout(()=>{state.failed.add(n);render()},i*500)));}
function choose(d,el){state.selected=d.name;render();if(state.injected&&!state.failed.has(d.name)){el.classList.remove('shake');void el.getBBox();el.classList.add('shake');log.innerHTML='<strong>未命中：</strong>这里不在当前传播路径上；先找橙色连线的上游。'}else log.innerHTML='<strong>已选择：</strong>'+d.name+'。现在可执行隔离。'}
ng.on('click',function(e,d){choose(d,this)}).on('keydown',function(e,d){if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(d,this)}});
function isolate(){if(!state.selected||!state.failed.has(state.selected)){log.innerHTML='<strong>无法隔离：</strong>先选择当前橙色传播路径上的节点。';document.querySelector('#isolate').classList.add('shake');setTimeout(()=>document.querySelector('#isolate').classList.remove('shake'),180);return}clearTimers();state.isolated.add(state.selected);phase.textContent='传播已切断';log.innerHTML='<strong>隔离成功：</strong>断路标记已出现，故障不再向下游扩散。';render()}
function backup(){if(!state.isolated.size){log.innerHTML='<strong>备用未接通：</strong>先隔离故障源，避免把异常带入备用路径。';return}state.backup=true;const permanent=new Set([...state.isolated]);state.failed=new Set([...state.failed].filter(n=>permanent.has(n)));phase.textContent='备用运行中';log.innerHTML='<strong>故障已隔离｜备用路径运行中</strong><br>关键功能已由独立路径恢复。';render()}
function reset(announce=true){clearTimers();state.failed.clear();state.isolated.clear();state.selected=null;state.injected=null;state.backup=false;phase.textContent='待命';if(announce)log.innerHTML='<strong>已重置：</strong>可更换注入点，再比较故障链。';render()}
document.querySelector('#inject').onclick=inject;document.querySelector('#isolate').onclick=isolate;document.querySelector('#backup').onclick=backup;document.querySelector('#reset').onclick=()=>reset(true);
render();
if(!Deck.reduced()){edge.attr('stroke-dasharray',500).attr('stroke-dashoffset',500).transition().delay((d,i)=>i*90).duration(600).attr('stroke-dashoffset',0).on('end',function(){d3.select(this).attr('stroke-dasharray',null)});ng.attr('opacity',0).transition().delay((d,i)=>d.name==='乘员舱'?0:180+i*70).duration(420).attr('opacity',1)}
</script>
</body>
</html>
