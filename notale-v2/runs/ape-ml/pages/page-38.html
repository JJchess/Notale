<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--fs-h1:48px}
#stage{padding:42px 54px 34px;overflow:hidden}
.page-head{height:112px;display:flex;align-items:flex-start;justify-content:space-between;gap:48px}
.kicker{color:var(--teal);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.16em;margin-bottom:7px}
.take{width:480px;margin-top:12px;color:var(--teal-soft);font-size:var(--fs-lead);line-height:var(--lh-copy);text-align:right}
.system-plate{position:relative;display:grid;grid-template-columns:.9fr 1.1fr 1.2fr;gap:24px;min-height:0}
.k-enumeration{--enum-cols:3;grid-template-columns:.9fr 1.1fr 1.2fr;gap:24px}
.k-enumeration>.it{position:relative;padding:0;overflow:hidden;border-color:var(--line-strong);background:linear-gradient(180deg,var(--panel-hi),var(--panel) 18%,var(--panel-deep));box-shadow:0 16px 36px var(--shadow)}
.layer-head{height:62px;padding:14px 18px;border-bottom:2px solid var(--line-strong);display:flex;align-items:center;justify-content:space-between}
.layer-head .it-title{margin:0;color:var(--text);font-size:22px;font-weight:760}
.scale{color:var(--ink-faint);font:600 var(--fs-label)/1.3 var(--font-mono)}
.visual{position:relative;height:350px;border-bottom:1px solid var(--line);overflow:hidden}
.visual svg{width:100%;height:100%;display:block}
.band-list{display:grid;grid-template-columns:repeat(3,1fr);height:52px;border-bottom:1px solid var(--line)}
.band-list span{display:flex;align-items:center;justify-content:center;color:var(--ink-muted);font-size:var(--fs-label);font-weight:650;border-right:1px solid var(--line)}
.band-list span:last-child{border-right:0}
.role-row{display:flex;gap:10px;padding:16px 18px 11px}
.role{display:inline-flex;align-items:center;gap:8px;color:var(--amber-soft);font-size:var(--fs-label);font-weight:760}
.role::before{content:"";width:10px;height:10px;border:2px solid var(--amber);border-radius:50%;box-shadow:0 0 12px rgba(255,181,71,.34)}
.copy{padding:0 18px 18px;color:var(--ink-muted);font-size:var(--fs-sec);line-height:var(--lh-copy)}
.copy strong{display:block;color:var(--teal-soft);font-weight:680;margin-bottom:4px}
.pipe{position:absolute;left:0;right:0;top:270px;width:100%;height:60px;z-index:4;pointer-events:none}
.pipe path{fill:none;stroke:var(--teal);stroke-width:4;stroke-dasharray:14 8;stroke-dashoffset:0;filter:drop-shadow(0 0 7px rgba(54,214,192,.42));animation:flow 900ms ease-out both}
.pipe circle{fill:var(--bg);stroke:var(--teal);stroke-width:3}
.claim{height:100px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px 70px;color:var(--text);font-size:var(--fs-lead);font-weight:650;line-height:var(--lh-copy)}
.claim strong{color:var(--amber-soft);font-weight:800}
.figure-line{fill:none;stroke:var(--teal-soft);stroke-width:3;vector-effect:non-scaling-stroke}
.figure-dim{fill:none;stroke:var(--teal-dim);stroke-width:2;vector-effect:non-scaling-stroke}
.figure-hot{fill:var(--amber);stroke:var(--amber);stroke-width:2}
.figure-fill{fill:rgba(54,214,192,.08);stroke:var(--teal);stroke-width:2}
.reveal-human{animation:rise 600ms ease-out both}.reveal-ship{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 760ms 180ms ease-out forwards}.reveal-ground{animation:open 650ms 380ms ease-out both;transform-origin:right center}
.role:nth-child(1){animation:glow .35s 1s both}.role:nth-child(2){animation:glow .35s 1.09s both}
@keyframes flow{from{stroke-dashoffset:180}to{stroke-dashoffset:0}}@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes open{from{opacity:0;transform:scaleX(.82)}to{opacity:1;transform:scaleX(1)}}@keyframes glow{from{opacity:.25}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.pipe path,.reveal-human,.reveal-ship,.reveal-ground,.role{animation:none!important;stroke-dashoffset:0!important}}
</style>
</head>
<body data-page="38" data-total="45">

        </svg>
      </div>
      <div class="band-list"><span>感知状态</span><span>维持运行</span><span>作出响应</span></div>
      <div class="role-row"><span class="role">工程师</span><span class="role">软件</span></div>
      <p class="copy"><strong>维持环境、检测并响应异常</strong>若缺席，人体失去可生存外壳。</p>
    </section>

    <section class="it min0">
      <div class="layer-head"><h2 class="it-title">地面网络</h2><span class="scale">GROUND</span></div>
      <div class="visual">
        <svg viewBox="0 0 550 350" role="img" aria-label="控制室、供应链、规则与公众网络">
          <g class="reveal-ground"><path class="figure-line" d="M50 130 H150 L220 75 H330 L405 125 H500 M92 265 L180 190 L275 236 L370 170 L470 252"/><path class="figure-dim" d="M150 130 L180 190 M220 75 L275 236 M330 75 L370 170 M405 125 L470 252"/><g class="figure-fill"><circle cx="50" cy="130" r="22"/><circle cx="150" cy="130" r="27"/><circle cx="220" cy="75" r="25"/><circle cx="330" cy="75" r="25"/><circle cx="405" cy="125" r="28"/><circle cx="500" cy="125" r="22"/><circle cx="92" cy="265" r="25"/><circle cx="180" cy="190" r="31"/><circle cx="275" cy="236" r="29"/><circle cx="370" cy="170" r="31"/><circle cx="470" cy="252" r="27"/></g><circle class="figure-hot" cx="275" cy="236" r="8"/><circle class="figure-hot" cx="405" cy="125" r="8"/><path class="figure-line" d="M-30 365 Q275 245 580 365"/><path class="figure-dim" d="M-20 374 Q275 258 570 374"/></g>
        </svg>
      </div>
      <div class="band-list"><span>感知状态</span><span>维持运行</span><span>作出响应</span></div>
      <div class="role-row"><span class="role">制度</span><span class="role">地面公众</span></div>
      <p class="copy"><strong>资源、授权、知识与风险承担</strong>若缺席，任务失去长期支撑与合法性。</p>
    </section>
  </main>

  <footer class="claim shrink0"><p><strong>“Spaceman”应改写成复数。</strong> 进入太空的从来不只是一个身体，而是六类共同在场者组成的系统。</p></footer>
</div>
