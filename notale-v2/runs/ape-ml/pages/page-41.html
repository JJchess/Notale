<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:28px 42px 26px;gap:16px;overflow:hidden}
  .kicker{color:var(--teal);font:700 var(--fs-label)/1.3 var(--font-mono);letter-spacing:.14em}
  .topline{display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
  .take{max-width:690px;color:var(--ink-muted);font-size:var(--fs-sec);line-height:var(--lh-copy);text-align:right}
  .clock{display:flex;align-items:center;gap:18px;padding:14px 20px;border:var(--stroke) solid var(--teal-dim);border-radius:var(--r-md);background:var(--panel-deep)}
  .clock-track{position:relative;flex:1;height:16px;border-top:var(--stroke) dashed var(--teal-dim)}
  .clock-fill{position:absolute;left:0;top:-2px;height:4px;width:0;background:var(--teal);transition:width 520ms ease-out}
  .clock-fill::after{content:"";position:absolute;right:-7px;top:-5px;width:14px;height:14px;border-radius:50%;background:var(--amber)}
  .clock-reading{min-width:238px;color:var(--teal-soft);font:700 var(--fs-body)/1.3 var(--font-mono)}
  .process-wrap{padding:0 2px}
  .k-process{height:126px}
  .k-process>.step{padding:13px 15px;transition:border-color 220ms ease-out,background 220ms ease-out,transform 220ms ease-out}
  .step-no{color:var(--teal);font:700 var(--fs-label)/1.2 var(--font-mono)}
  .step-title{margin-top:5px;font-size:var(--fs-sec);font-weight:720;line-height:1.35}
  .step-evidence{margin-top:5px;color:var(--ink-muted);font-size:var(--fs-label);line-height:1.35}
  .active-arrow{color:var(--amber)!important;text-shadow:0 0 16px var(--amber)}
  .workspace{display:flex;gap:16px;min-height:0}
  .controls{flex:0 0 390px;display:flex;flex-direction:column;gap:8px;padding:16px 20px}
  .ctl{min-height:42px}
  .ctl output{min-width:72px;color:var(--teal-soft);font:700 var(--fs-label)/1.3 var(--font-mono);text-align:right}
  .actions{display:flex;gap:10px;margin-top:2px}
  .actions .btn-primary{flex:1}
  .check{margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
  .check label{display:block;margin-bottom:6px;color:var(--ink-muted);font-size:var(--fs-label);font-weight:650}
  .check select{width:100%;min-height:42px;padding:7px 10px;color:var(--text);font-size:var(--fs-sec);border:var(--stroke) solid var(--line-strong);border-radius:var(--r-sm);background:var(--panel-deep)}
  .check-status{min-height:44px;margin-top:7px;color:var(--ink-muted);font-size:var(--fs-sec);line-height:1.4}
  .check.shake{animation:shake 320ms ease-out}
  @keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
  .viz{flex:1;display:flex;flex-direction:column;padding:14px 18px 12px;min-width:0}
  .viz-head{display:flex;align-items:center;justify-content:space-between;gap:20px}
  .chart{display:block;width:100%;height:100%;min-height:0}
  .chart text{font-family:var(--font-sans);font-size:14px;fill:var(--ink-muted)}
  .axis path,.axis line{stroke:var(--line-strong)}
  .axis-label{font-size:14px;fill:var(--ink-muted)}
  .curve-initial{fill:none;stroke:var(--ink-faint);stroke-width:3;stroke-dasharray:8 7}
  .curve-a,.curve-b{fill:none;stroke:var(--teal);stroke-width:4}
  .curve-b{stroke:var(--teal-soft);stroke-dasharray:12 6}
  .area-a{fill:var(--teal);opacity:.10}.area-b{fill:var(--teal-soft);opacity:.07}
  .select-arrow{stroke:var(--amber);stroke-width:4;fill:none;opacity:0;transition:opacity 200ms ease-out}
  .select-arrow.on{opacity:1}
  .footer-claim{display:flex;align-items:center;gap:14px;height:54px;padding:10px 18px;border-left:8px solid var(--teal);background:var(--panel-hi);font-size:var(--fs-sec);line-height:1.4}
  .footer-claim strong{color:var(--teal-soft)}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="41" data-total="45">
<div id="stage">
  <header style="height:84px" class="col justify-between">
    <div class="kicker">FUTURE PATHS · 41 / 45</div>
    <div class="topline"><h1>适应一生，不等于演化许多代</h1><p class="take">生物演化需要可遗传差异、差异化繁殖和许多世代；迁移还会持续改写群体分布。</p></div>
  </header>

  <section style="height:64px" class="clock" aria-label="世代钟">
    <div><div class="label">太空世代钟</div><div id="clockRead" class="clock-reading" aria-live="polite">已过 0 年 / 0 代</div></div>
    <div class="clock-track" aria-hidden="true"><div id="clockFill" class="clock-fill"></div></div>
    <span id="conditionChip" class="chip">必要条件待接通</span>
  </section>

  <section style="height:126px" class="process-wrap">
    <div class="k-process" aria-label="演化的四步因果链">
      <div class="axis"></div>
      <div class="step current" data-step="0"><div class="step-no">01 · 差异</div><div class="step-title">群体起初就有差异</div><div class="step-evidence">可遗传的抽象“耐受指标”</div></div>
      <div class="arw" data-arrow="0"></div>
      <div class="step" data-step="1"><div class="step-no">02 · 选择</div><div class="step-title">繁殖贡献出现差异</div><div class="step-evidence">环境偏向较常留下后代的一端</div></div>
      <div class="arw" data-arrow="1"></div>
      <div class="step" data-step="2"><div class="step-no">03 · 累积</div><div class="step-title">世代反复累积</div><div class="step-evidence">个人变化不会直接传给下一代</div></div>
      <div class="arw" data-arrow="2"></div>
      <div class="step" data-step="3"><div class="step-no">04 · 迁移</div><div class="step-title">迁移持续混合群体</div><div class="step-evidence">两条分布因此互相靠近</div></div>
    </div>
  </section>

  <main style="flex:1" class="workspace min0">
    <section class="panel controls min0" aria-label="演化参数">
      <h2>推进条件</h2>
      <div class="ctl"><label for="gen">世代长度</label><input id="gen" type="range" step="5"><output id="genOut"></output></div>
      <div class="ctl is-target"><label for="pressure">选择压力</label><input id="pressure" type="range" min="-1" max="1" step="0.1" value="0.6"><output id="pressureOut"></output></div>
      <div class="ctl"><label for="migration">迁移率</label><input id="migration" type="range" min="0" max="20" step="5" value="5"><output id="migrationOut"></output></div>
      <div class="actions"><button id="advance" class="btn btn-primary">推进 500 年</button><button id="reset" class="btn">重置</button></div>
      <div id="checkBox" class="check">
        <label for="checkpoint">检查点 <span id="score" class="mono">0/3</span></label>
        <select id="checkpoint" aria-label="选择当前判断"><option value="">选择一句判断</option><option value="wrong">同一个人被环境改造成新类型</option><option value="heritable">变化必须能够遗传给后代</option><option value="group">改变的是群体中后代的比例</option><option value="migration">迁移会改写群体分布</option></select>
        <div id="checkStatus" class="check-status" aria-live="polite">依次找出三个必要判断。</div>
      </div>
    </section>

    <figure class="panel viz min0">
      <div class="viz-head"><div><h2>两个群体的性状分布</h2><p class="note">无单位抽象指标，不对应外貌或真实医学测量。</p></div><div class="legend"><span class="key"><i class="swatch" style="background:var(--ink-faint)"></i>初始参照</span><span class="key"><i class="swatch"></i>当前群体 A</span><span class="key"><i class="swatch" style="background:var(--teal-soft)"></i>当前群体 B</span></div></div>
      <svg id="chart" class="chart" viewBox="0 0 960 300" role="img" aria-label="初始分布与两个当前群体的重叠曲线"></svg>
    </figure>
  </main>

  <footer style="height:54px" class="footer-claim"><strong>改变的是跨世代的群体分布。</strong><span>只有可遗传差异影响繁殖贡献，并重复许多世代，群体才可能演化；这不保证进步或物种形成。</span></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
(function(){
  Deck.init({index:41,total:45});
  var defaultGen=Lec.K.HUMAN_GENERATION_YEARS;
  var gen=document.getElementById('gen');
  gen.min=defaultGen-5; gen.max=defaultGen+5; gen.value=defaultGen;
  var elapsed=0, maxYears=5000, increment=500, solved=new Set();
  var rng=new Math.seedrandom('apeman-spaceman-p41');
  var texture=[rng()-.5,rng()-.5,rng()-.5];
  var svg=d3.select('#chart'), x=d3.scaleLinear().domain([-3,3]).range([64,930]), y=d3.scaleLinear().domain([0,.52]).range([246,24]);
  var xs=d3.range(-3,3.001,.06);
  function normal(v,mu,s){return Math.exp(-.5*Math.pow((v-mu)/s,2))/(s*Math.sqrt(2*Math.PI));}
  function distribution(mu,s){return xs.map(function(v){return {x:v,y:normal(v,mu,s)};});}
  var line=d3.line().x(function(d){return x(d.x);}).y(function(d){return y(d.y);}).curve(d3.curveBasis);
  var area=d3.area().x(function(d){return x(d.x);}).y0(y(0)).y1(function(d){return y(d.y);}).curve(d3.curveBasis);
  svg.append('defs').append('marker').attr('id','arrowhead').attr('viewBox','0 0 10 10').attr('refX',9).attr('refY',5).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto-start-reverse').append('path').attr('d','M 0 0 L 10 5 L 0 10 z').attr('fill','var(--amber)');
  svg.append('g').attr('class','axis').attr('transform','translate(0,246)').call(d3.axisBottom(x).tickValues([-3,0,3]).tickFormat(function(d){return d<0?'较低':d>0?'较高':'中间';}).tickSize(7)).selectAll('text').style('font-size','14px');
  svg.append('text').attr('class','axis-label').attr('x',497).attr('y',294).attr('text-anchor','middle').text('抽象耐受指标（无单位）');
  var initial=distribution(0,1);
  svg.append('path').datum(initial).attr('class','curve-initial').attr('d',line);
  var areaA=svg.append('path').attr('class','area-a'), areaB=svg.append('path').attr('class','area-b');
  var pathA=svg.append('path').attr('class','curve-a'), pathB=svg.append('path').attr('class','curve-b');
  var selArrow=svg.append('path').attr('class','select-arrow').attr('marker-end','url(#arrowhead)');
  svg.append('text').attr('x',80).attr('y',38).text('群体 A'); svg.append('text').attr('x',80).attr('y',62).text('群体 B（虚线）');

  function values(){return {g:+gen.value,p:+document.getElementById('pressure').value,m:+document.getElementById('migration').value/100};}
  function update(animate){
    var v=values(), generations=Lec.P.generationsInYears(elapsed,v.g), progress=elapsed/maxYears;
    var selectionShift=v.p*1.15*(1-Math.exp(-generations/85));
    var mix=1-Math.exp(-v.m*generations/25);
    var muA=selectionShift*(1-.35*mix)+texture[0]*.05;
    var muB=-.65*(1-mix)+selectionShift*.75*mix+texture[1]*.05;
    var a=distribution(muA,.88+v.m*.35), b=distribution(muB,.96+v.m*.25);
    if(animate&&!Deck.reduced()){
      areaA.datum(a).transition().duration(520).ease(d3.easeCubicOut).attr('d',area);
      areaB.datum(b).transition().duration(520).ease(d3.easeCubicOut).attr('d',area);
      pathA.datum(a).transition().duration(520).ease(d3.easeCubicOut).attr('d',line);
      pathB.datum(b).transition().duration(520).ease(d3.easeCubicOut).attr('d',line);
    }else{
      areaA.datum(a).attr('d',area); areaB.datum(b).attr('d',area);
      pathA.datum(a).attr('d',line); pathB.datum(b).attr('d',line);
    }
    document.getElementById('genOut').textContent=v.g+' 年';
    document.getElementById('pressureOut').textContent=(v.p>0?'+':'')+v.p.toFixed(1);
    document.getElementById('migrationOut').textContent=Math.round(v.m*100)+'%';
    document.getElementById('clockRead').textContent='已过 '+elapsed+' 年 / '+Math.round(generations)+' 代';
    document.getElementById('clockFill').style.width=(progress*100)+'%';
    selArrow.attr('d','M '+x(selectionShift-v.p*.8)+' 78 L '+x(selectionShift+v.p*.45)+' 78').classed('on',Math.abs(v.p)>.01);
    var stage=elapsed===0?0:(v.m>0?3:2);
    document.querySelectorAll('.step').forEach(function(el,i){el.classList.toggle('current',i===stage);el.classList.toggle('done',i<stage);});
    document.querySelectorAll('.arw').forEach(function(el,i){el.classList.toggle('active-arrow',elapsed>0&&i<stage);});
  }
  [gen,document.getElementById('pressure'),document.getElementById('migration')].forEach(function(el){el.addEventListener('input',function(){update(false);});});
  document.getElementById('advance').addEventListener('click',function(){elapsed=Math.min(maxYears,elapsed+increment);update(true);});
  document.getElementById('reset').addEventListener('click',function(){elapsed=0;gen.value=defaultGen;document.getElementById('pressure').value=.6;document.getElementById('migration').value=5;solved.clear();document.getElementById('score').textContent='0/3';document.getElementById('checkStatus').textContent='依次找出三个必要判断。';document.getElementById('checkpoint').value='';document.getElementById('conditionChip').textContent='必要条件待接通';document.getElementById('conditionChip').classList.remove('is-current');update(false);});
  document.getElementById('checkpoint').addEventListener('change',function(){
    var box=document.getElementById('checkBox'), status=document.getElementById('checkStatus'), val=this.value;
    if(val==='wrong'){status.textContent='这里变化的是后代在群体中的比例，不是个人在一生中变形。';box.classList.remove('shake');void box.offsetWidth;if(!Deck.reduced())box.classList.add('shake');}
    else if(val){solved.add(val);status.textContent='正确：这是一项必要判断。';}
    document.getElementById('score').textContent=Math.min(3,solved.size)+'/3';
    if(solved.size>=3){status.textContent='必要条件齐备，但结果仍取决于参数。';var c=document.getElementById('conditionChip');c.textContent='必要条件齐备';c.classList.add('is-current');}
  });
  update(false);
  if(!Deck.reduced()){
    pathA.attr('stroke-dasharray',pathA.node().getTotalLength()).attr('stroke-dashoffset',pathA.node().getTotalLength()).transition().duration(720).ease(d3.easeCubicOut).attr('stroke-dashoffset',0).on('end',function(){pathA.attr('stroke-dasharray',null);});
    document.querySelectorAll('.step').forEach(function(el,i){el.animate([{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'translateY(0)'}],{duration:420,delay:180+i*70,easing:'ease-out',fill:'both'});});
  }
})();
</script>
</body>
</html>
