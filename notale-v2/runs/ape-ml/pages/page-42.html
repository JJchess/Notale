<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--motion-ui:220ms;--motion-enter:520ms;--ease:cubic-bezier(.2,.8,.2,1)}
#stage{width:1600px;height:900px;padding:24px 42px 18px;overflow:hidden;position:relative}
#stage:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.24;background:repeating-linear-gradient(90deg,transparent 0,transparent 79px,var(--line) 80px),repeating-linear-gradient(0deg,transparent 0,transparent 79px,var(--line) 80px)}
.header{height:96px;border-bottom:1px solid var(--line);padding-bottom:16px}
.kicker{font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.13em;color:var(--teal)}
.take{max-width:920px;margin-top:7px;color:var(--ink-muted);font-size:var(--fs-sec);line-height:var(--lh-copy)}
.terminal{position:relative;display:flex;gap:18px;padding-top:18px;min-height:0;overflow:hidden}
.terminal:after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:76px;border:4px solid var(--teal-dim);border-bottom:0;border-radius:50% 50% 0 0;opacity:.35;pointer-events:none}
.ledger{position:relative;z-index:2;flex:1.7;padding:16px 18px 14px}
.statusbar{height:62px;display:flex;align-items:center;gap:18px;padding-bottom:12px;border-bottom:2px solid var(--teal-dim)}
.big{font:760 24px/1.2 var(--font-mono);color:var(--teal)}
.track{flex:1;height:10px;border:1px solid var(--line-strong);background:var(--panel-deep);overflow:hidden;border-radius:99px}
.track span{display:block;height:100%;width:0;background:var(--teal);transition:width var(--motion-ui) var(--ease)}
.round{font:700 var(--fs-label)/1.4 var(--font-mono);color:var(--amber-soft)}
.box{height:calc(100% - 66px)}
.bt{justify-content:space-between}.bt small{font:650 var(--fs-label)/1.4 var(--font-sans);color:var(--ink-muted)}
.budget-row{display:grid;grid-template-columns:230px 124px 1fr;align-items:center;gap:14px;min-height:86px;padding:6px 6px;border-bottom:1px solid var(--line);transition:transform var(--motion-ui),background var(--motion-ui),border-color var(--motion-ui);background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(5% - 1px),rgba(59,101,112,.42) 5%)}
.budget-row:last-child{border-bottom:0}.proj strong{display:block;font-size:var(--fs-sec);line-height:1.35}.proj small{font-size:var(--fs-label);font-weight:500;color:var(--ink-faint)}
.stepper{display:grid;grid-template-columns:35px 1fr 35px;align-items:center;min-height:45px;border:2px solid var(--line-strong);border-radius:var(--r-sm);background:var(--panel-deep);cursor:pointer;outline:none}
.stepper:focus-visible{border-color:var(--focus);box-shadow:0 0 0 3px rgba(255,181,71,.2)}
.stepper i{text-align:center;font-style:normal;color:var(--ink-muted);font-size:20px}.stepper output{text-align:center;font:720 var(--fs-body)/1 var(--font-mono);color:var(--text);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.tags{display:flex;min-width:0}.tags .tag{width:100%}.tag{display:flex;align-items:center;justify-content:center;min-height:70px;padding:2px 5px;text-align:center;border:1px solid var(--line-strong);border-radius:99px;font-size:var(--fs-label);line-height:1.45;color:var(--ink-muted);background:var(--panel-deep)}
.tag.on{color:var(--teal-soft);border-color:var(--teal-dim);background:rgba(54,214,192,.08)}
.budget-row.ok{border-left:4px solid var(--teal);background:rgba(54,214,192,.045)}.budget-row.bad{border-left:4px solid var(--amber);background:rgba(255,181,71,.07)}
.shake{animation:shake 260ms ease-out}.hearings{position:relative;z-index:2;flex:1;padding:16px;overflow:visible}.hearings h2{margin-bottom:6px}.instruction{font-size:var(--fs-sec);line-height:var(--lh-copy);color:var(--ink-muted);margin-bottom:12px}
.seat{position:relative;margin:9px 0;padding:11px 12px 11px 18px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-deep);opacity:.58;transition:opacity var(--motion-ui),border-color var(--motion-ui),transform var(--motion-ui)}
.seat:before{content:"";position:absolute;left:-36px;top:50%;width:35px;border-top:2px dashed var(--line-strong)}.seat.active{opacity:1;border-color:var(--amber-deep)}.seat.met{opacity:1;border-color:var(--teal-dim)}.seat.met:before{border-color:var(--teal)}
.seat strong{display:block;font-size:var(--fs-sec);line-height:1.35;color:var(--teal-soft)}.seat p{font-size:var(--fs-sec);line-height:1.38;color:var(--ink-muted);margin-top:3px}
.feedback{min-height:44px;padding:8px 11px;border-left:4px solid var(--amber);background:rgba(255,181,71,.07);font-size:var(--fs-sec);line-height:1.4}
.portrait{display:none;margin-top:10px}.portrait.show{display:block}.portrait h2{color:var(--teal)}.bars{margin:8px 0}.barline{display:grid;grid-template-columns:90px 1fr 44px;gap:8px;align-items:center;margin:7px 0;font-size:var(--fs-label)}.barline b{height:8px;background:var(--teal);border-radius:99px}.actions{display:flex;gap:10px;margin-top:10px}
.footer{height:56px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);position:relative;z-index:3}.footer .lead{max-width:1120px}.branch{width:170px;height:34px;border-left:2px solid var(--teal-dim);border-top:2px solid var(--teal-dim);transform:skewX(-35deg)}
@keyframes shake{25%{transform:translateX(-7px)}55%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="42" data-total="45">
<div id="stage">
  <header class="header shrink0">
    <div class="kicker">FUTURES · PUBLIC CHOICE</div>
    <h1>谁为太空买单？</h1>
    <p class="take">目的地与技术方案同时包含公平、风险承担、环境责任和收益分配问题。</p>
  </header>
  <main class="terminal grow min0">
    <svg aria-hidden="true" viewBox="0 0 1516 670" preserveAspectRatio="none" style="position:absolute;inset:18px 0 0;width:100%;height:calc(100% - 18px);pointer-events:none;opacity:.34"><path d="M1030 104H1160V148H1510 M1030 240H1125V280H1510 M1030 376H1160V412H1510 M1030 512H1125V548H1510" fill="none" stroke="var(--teal-dim)" stroke-width="2" stroke-dasharray="8 8"/><path d="M70 620 C360 560 690 650 980 590 S1320 560 1500 620" fill="none" stroke="var(--teal)" stroke-width="3" stroke-dasharray="5 12"/></svg>
    <section class="ledger panel min0" aria-label="公共预算账本">
      <div class="statusbar"><span class="label">公共预算</span><span id="total" class="big">已分配 0 / 100</span><div class="track"><span id="fill"></span></div><span id="round" class="round">第 1 / 2 轮</span></div>
      <div class="k-classification box">
        <div class="box">
          <div class="bt"><span>预算项目 × 公共问题</span><small>公平　／　风险承担　／　环境责任　／　收益分配　 ·　方向键每次调整 5 点</small></div>
          <div id="rows"></div>
        </div>
      </div>
    </section>
    <aside class="hearings panel min0" aria-label="四方公开听证">
      <h2>四方公开听证</h2><p class="instruction" id="instruction">先把 100 点恰好分完。满额后自动开启听证，再修订一次。</p>
      <div id="seats"></div>
      <div id="feedback" class="feedback" aria-live="polite">预算不只购买任务，也在分配风险、责任与收益。</div>
      <div id="portrait" class="portrait"><h2>团队优先级画像</h2><div id="bars" class="bars"></div><p id="dispute" class="secondary"></p><div class="actions"><button class="btn btn-primary" id="export">导出立场</button><button class="btn" id="reset">重置预算</button></div></div>
    </aside>
  </main>
  <footer class="footer shrink0"><p class="lead">满足共同约束不等于唯一正确；不同分配表达不同价值优先级。</p><div class="branch" aria-hidden="true"></div></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Deck.init({index:42,total:45});
const GAME={budget:100,step:5,rounds:2,items:['月球机器人科研','载人火星先导','生命支持与救援','行星保护','开放数据与教育','地球灾害观测'],roles:['乘员代表','行星保护代表','公共财政代表','科学共同体代表']};
const META=[['目的地',['风险承担','收益分配']],['目的地',['公平','风险承担','环境责任']],['技术',['风险承担','公平']],['技术与制度',['环境责任']],['制度',['公平','收益分配']],['公共回馈',['公平','收益分配']]];
const QUOTES=['谁承担不可逆的身体风险？救援是否获得了相称资源？','探索收益不能以不可逆污染为隐形成本。','谁出资、谁受益、谁可能长期被排除？','数据能否公开，并让未参与任务的人继续检验？'];
const fresh=()=>({values:Array(GAME.items.length).fill(0),round:1,heard:false,complete:false}); let state=fresh();
const rows=document.querySelector('#rows'),seats=document.querySelector('#seats');
GAME.items.forEach((name,i)=>{const el=document.createElement('div');el.className='budget-row';el.dataset.i=i;el.innerHTML=`<div class="proj"><strong>${name}</strong></div><div class="stepper" role="slider" tabindex="0" aria-label="${name}预算" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i>−</i><output>0</output><i>＋</i></div><div class="tags"><span class="tag">${META[i][1].join(' · ')}</span></div>`;rows.append(el)});
GAME.roles.forEach((r,i)=>{const el=document.createElement('div');el.className='seat';el.innerHTML=`<strong>○ ${r}</strong><p>${QUOTES[i]}</p>`;seats.append(el)});
function total(){return state.values.reduce((a,b)=>a+b,0)}
function checks(){return [state.values[2]>=15,state.values[3]>=10,state.values[0]+state.values[4]>=20,state.values[4]+state.values[5]>=20]}
function rowOK(i){return i===2?state.values[2]>=15:i===3?state.values[3]>=10:i===0||i===4?state.values[0]+state.values[4]>=20:i===5?state.values[4]+state.values[5]>=20:true}
function render(msg){const sum=total();document.querySelector('#total').textContent=`已分配 ${sum} / ${GAME.budget}`;document.querySelector('#fill').style.width=`${Lec.P.progress(sum,GAME.budget)*100}%`;document.querySelector('#round').textContent=`第 ${state.round} / ${GAME.rounds} 轮`;
 document.querySelectorAll('.budget-row').forEach((r,i)=>{r.querySelector('output').textContent=state.values[i];r.querySelector('.stepper').setAttribute('aria-valuenow',state.values[i]);r.querySelectorAll('.tag').forEach(t=>t.classList.toggle('on',state.values[i]>0));r.classList.toggle('ok',state.heard&&rowOK(i));r.classList.toggle('bad',state.heard&&!rowOK(i))});
 const cs=checks();document.querySelectorAll('.seat').forEach((s,i)=>{s.classList.toggle('active',state.heard);s.classList.toggle('met',state.heard&&cs[i])});if(msg)document.querySelector('#feedback').textContent=msg;
 if(state.complete)showPortrait();}
function adjust(i,delta){if(state.complete)return;const next=state.values[i]+delta;if(next<0)return; if(total()+delta>GAME.budget){flash(i,'预算已超过 100：最后一次增加已回弹。');return}state.values[i]=next;render();if(total()===GAME.budget){if(!state.heard){state.heard=true;state.round=2;render('听证开启：青色为已满足，琥珀色为仍需回应。');}else evaluate();}}
function evaluate(){const cs=checks();if(cs.every(Boolean)){state.complete=true;render('共同约束已满足；这是一种合规取舍，不是标准答案。')}else{const msgs=['救援低于 15：额外风险主要由乘员承担。','行星保护低于 10：污染成本尚未被计入。','月球科研与开放数据合计低于 20。','开放数据与灾害观测合计低于 20。'];const k=cs.indexOf(false);flash(k===0?2:k===1?3:k===2?4:5,msgs[k])}}
function flash(i,msg){const r=document.querySelector(`.budget-row[data-i="${i}"]`);r.classList.remove('shake');void r.offsetWidth;r.classList.add('shake');document.querySelector('#feedback').textContent=msg}
document.querySelectorAll('.stepper').forEach((s,i)=>{s.addEventListener('click',e=>adjust(i,e.offsetX<s.clientWidth/2?-GAME.step:GAME.step));s.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowDown'].includes(e.key)){e.preventDefault();adjust(i,-GAME.step)}if(['ArrowRight','ArrowUp'].includes(e.key)){e.preventDefault();adjust(i,GAME.step)}})});
function showPortrait(){document.querySelector('#portrait').classList.add('show');document.querySelector('#instruction').textContent='方案已完成：查看取舍画像，或重置后比较另一条合规路径。';document.querySelectorAll('.stepper').forEach(x=>{x.tabIndex=-1;x.setAttribute('aria-disabled','true')});const names=['公平','风险承担','环境责任','收益分配'];const weights=names.map(n=>state.values.reduce((a,v,i)=>a+(META[i][1].includes(n)?v:0),0));const all=weights.reduce((a,b)=>a+b,0);document.querySelector('#bars').innerHTML=names.map((n,i)=>{const p=Math.round(weights[i]/all*100);return `<div class="barline"><span>${n}</span><b style="width:${p}%"></b><output>${p}%</output></div>`}).join('');const max=Math.max(...state.values);document.querySelector('#dispute').textContent=`投入最高：${GAME.items[state.values.indexOf(max)]}。火星先导仍牵动三类质询。`}
document.querySelector('#reset').onclick=()=>{state=fresh();document.querySelector('#portrait').classList.remove('show');document.querySelectorAll('.stepper').forEach(x=>{x.tabIndex=0;x.removeAttribute('aria-disabled')});document.querySelector('#instruction').textContent='先把 100 点恰好分完。满额后自动开启听证，再修订一次。';render('预算不只购买任务，也在分配风险、责任与收益。')};
document.querySelector('#export').onclick=()=>{document.querySelector('#feedback').textContent='立场已整理：可据此说明优先级与仍有争议的项目。'};render();
</script>
</body>
</html>
