<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:28px 44px 24px;overflow:hidden}
  .page-head{height:92px;display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-5)}
  .kicker{color:var(--teal);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;letter-spacing:.11em}
  .title-block{display:flex;flex-direction:column;gap:var(--sp-1)}
  .title-block h1{font-size:38px;line-height:1.15}
  .head-key{display:flex;align-items:center;gap:var(--sp-4);padding-top:12px;color:var(--ink-muted);font-size:var(--fs-sec)}
  .head-key span{display:flex;align-items:center;gap:var(--sp-1)}
  .head-key i{display:block;width:30px;height:6px;border-radius:999px;background:var(--teal)}
  .head-key .outer i{background:var(--amber)}
  .figure-wrap{position:relative;display:block;flex:1;min-height:0;overflow:hidden;border:0;background:transparent;border-radius:0}
  #synthesis{display:block;width:100%;height:100%}
  #synthesis text{font-family:var(--font-sans)}
  #synthesis .e-tag{font-family:var(--font-mono);font-size:15px;font-weight:700;letter-spacing:.05em}
  #synthesis .node-copy{font-size:16px;font-weight:620}
  #synthesis .node-take{font-size:14px;fill:var(--ink-muted)}
  #synthesis .ring-label{font-size:20px;font-weight:700}
  #synthesis .center-label{font-size:16px;font-weight:700;letter-spacing:.12em}
  .closing{height:92px;display:flex;align-items:center;justify-content:center;border-top:2px solid var(--line)}
  .closing p{max-width:1180px;text-align:center;font-size:21px;line-height:1.4;font-weight:680;color:var(--text)}
  .closing strong{color:var(--amber-soft)}
  @media (prefers-reduced-motion:reduce){#synthesis *{transition:none!important;animation:none!important}}
</style>
</head>
<body data-page="44" data-total="45">
<div id="stage">
  <header class="page-head shrink0">
    <div class="title-block min0">
      <div class="kicker">SYNTHESIS / 双环总图</div>
      <h1>连续的不是变强，而是重新分工</h1>
    </div>
    <div class="head-key shrink0" aria-label="双环图例">
      <span><i></i>身体内：生理与行动</span>
      <span class="outer"><i></i>身体外：文化、工程与制度</span>
    </div>
  </header>

  <main class="figure-wrap min0 k-comparison" style="flex:1;--cmp-cols:2" aria-label="身体内与身体外的五项对齐比较">
    <svg id="synthesis" viewBox="0 0 1200 650" role="img" aria-label="E1 到 E5 汇入身体内与身体外双环的课程总图"></svg>
  </main>

  <footer class="closing shrink0">
    <p>从猿人到太空人的连续线索，不是身体越来越强，而是<strong>谁来承担适应</strong>不断改变。</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  Deck.init({index:44,total:45});
  var svg=d3.select('#synthesis');
  var css=getComputedStyle(document.documentElement);
  function token(n){return css.getPropertyValue(n).trim()}
  var C={inside:token('--teal'),outside:token('--amber'),line:token('--line-strong'),text:token('--text'),muted:token('--ink-muted'),panel:token('--panel'),deep:token('--panel-deep'),soft:token('--teal-soft'),amberSoft:token('--amber-soft')};
  var center=[600,330], inner=112, outer=205, angles=[-150,-75,0,75,150];
  var data=[
    {id:'E1',inside:'特征先后拼接',outside:'环境持续筛选',take:'不是整套身体同步升级'},
    {id:'E2',inside:'个体学习与行动',outside:'工具、语言、群体记忆',take:'适应开始跨代累积'},
    {id:'E3',inside:'暴露地球依赖',outside:'补回空气、负荷、屏蔽与节律',take:'环境条件被携带'},
    {id:'E4',inside:'乘员感知与执行',outside:'飞船、补给、软件与协作',take:'能力分布在耦合系统中'},
    {id:'E5',inside:'适应与可遗传变化',outside:'工程、制度与是否定居',take:'分工方式仍可选择'}
  ];
  var labelPos=[{x:54,y:92,w:330},{x:735,y:45,w:390},{x:852,y:286,w:330},{x:727,y:505,w:405},{x:40,y:486,w:390}];
  var defs=svg.append('defs');
  defs.append('marker').attr('id','arrow').attr('viewBox','0 0 10 10').attr('refX',8).attr('refY',5).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto-start-reverse').append('path').attr('d','M 0 0 L 10 5 L 0 10 z').attr('fill',C.line);
  var bg=svg.append('g').attr('aria-hidden','true');
  bg.append('rect').attr('x',350).attr('y',18).attr('width',500).attr('height',610).attr('rx',250).attr('fill',C.panel).attr('stroke',C.line).attr('stroke-width',2);
  bg.append('circle').attr('cx',center[0]).attr('cy',center[1]).attr('r',258).attr('fill',C.deep).attr('stroke',C.line).attr('stroke-width',2);
  bg.append('path').attr('d','M52,344 C180,590 410,616 525,585').attr('fill','none').attr('stroke',C.line).attr('stroke-width',2).attr('stroke-dasharray','3 10').attr('opacity',.75);
  bg.append('path').attr('class','exit-orbit').attr('d','M765,173 C920,65 1088,89 1160,204').attr('fill','none').attr('stroke',C.inside).attr('stroke-width',3).attr('stroke-dasharray','10 12').attr('opacity',.8);
  function arcPath(r,start,end){return d3.arc().innerRadius(r-9).outerRadius(r+9).startAngle(start).endAngle(end)()}
  var rings=svg.append('g').attr('transform','translate('+center[0]+','+center[1]+')');
  rings.append('path').attr('class','ring inner-ring').attr('d',arcPath(inner,-Math.PI*.82,Math.PI*.76)).attr('fill',C.inside).attr('opacity',.92);
  rings.append('path').attr('class','ring outer-ring').attr('d',arcPath(outer,-Math.PI*.82,Math.PI*.76)).attr('fill',C.outside).attr('opacity',.9);
  rings.append('text').attr('class','ring-label').attr('x',-34).attr('y',-129).attr('text-anchor','middle').attr('fill',C.inside).text('身体内');
  rings.append('text').attr('class','ring-label').attr('x',122).attr('y',-166).attr('text-anchor','middle').attr('fill',C.outside).text('身体外');

  var human=rings.append('g').attr('class','human').attr('fill','none').attr('stroke',C.text).attr('stroke-width',3).attr('stroke-linecap','round').attr('stroke-linejoin','round');
  human.append('circle').attr('cx',0).attr('cy',-55).attr('r',18);
  human.append('path').attr('d','M0,-36 C-21,-28 -25,2 -20,28 L-13,78 M0,-36 C21,-28 25,2 20,28 L13,78 M-20,-18 L-48,25 M20,-18 L48,25 M-18,22 C-9,29 9,29 18,22');
  rings.append('text').attr('class','center-label').attr('x',0).attr('y',112).attr('text-anchor','middle').attr('fill',C.text).text('身体 × 外部系统');

  function point(r,a){var q=a*Math.PI/180;return [center[0]+r*Math.cos(q),center[1]+r*Math.sin(q)]}
  var links=svg.append('g');
  data.forEach(function(d,i){
    var a=angles[i], p1=point(inner+12,a),p2=point(outer-12,a), p3=point(outer+18,a),lp=labelPos[i];
    links.append('path').attr('class','cross-link link-'+i).attr('d','M'+p1[0]+','+p1[1]+' L'+p2[0]+','+p2[1]).attr('fill','none').attr('stroke',C.line).attr('stroke-width',2).attr('marker-end','url(#arrow)');
    var tx=lp.x>600?lp.x:lp.x+lp.w, ty=lp.y+38;
    links.append('path').attr('class','leader link-'+i).attr('d','M'+p3[0]+','+p3[1]+' Q'+((p3[0]+tx)/2)+','+ty+' '+tx+','+ty).attr('fill','none').attr('stroke',C.line).attr('stroke-width',2);
    links.append('circle').attr('class','link-'+i).attr('cx',p1[0]).attr('cy',p1[1]).attr('r',5).attr('fill',C.inside);
    links.append('circle').attr('class','link-'+i).attr('cx',p2[0]).attr('cy',p2[1]).attr('r',5).attr('fill',C.outside);
  });

  var nodes=svg.append('g').selectAll('g').data(data).join('g').attr('class','cmp-row evidence-node').attr('transform',function(d,i){return 'translate('+labelPos[i].x+','+labelPos[i].y+')'});
  nodes.append('rect').attr('width',function(d,i){return labelPos[i].w}).attr('height',96).attr('rx',8).attr('fill',C.panel).attr('stroke',C.line).attr('stroke-width',2);
  nodes.append('text').attr('class','e-tag dim').attr('x',14).attr('y',23).attr('fill',C.amberSoft).text(function(d){return d.id});
  nodes.append('line').attr('x1',58).attr('x2',58).attr('y1',12).attr('y2',64).attr('stroke',C.line).attr('stroke-width',2);
  nodes.append('text').attr('class','node-copy cell').attr('x',72).attr('y',24).attr('fill',C.inside).text(function(d){return d.inside});
  nodes.append('text').attr('class','node-copy cell diff').attr('x',72).attr('y',52).attr('fill',C.outside).text(function(d){return d.outside});
  nodes.append('text').attr('class','node-take').attr('x',14).attr('y',82).text(function(d){return d.take});
  nodes.append('circle').attr('cx',62).attr('cy',19).attr('r',3).attr('fill',C.inside);
  nodes.append('circle').attr('cx',62).attr('cy',47).attr('r',3).attr('fill',C.outside);

  function pathLength(sel){var n=sel.node();return n&&n.getTotalLength?n.getTotalLength():0}
  if(!Deck.reduced()){
    human.attr('opacity',0).transition().duration(300).attr('opacity',1);
    svg.selectAll('.ring').each(function(){var p=d3.select(this),len=pathLength(p);p.attr('stroke-dasharray',len+' '+len).attr('stroke-dashoffset',len).attr('fill','none').attr('stroke',p.classed('inner-ring')?C.inside:C.outside).attr('stroke-width',18).transition().delay(p.classed('outer-ring')?480:300).duration(650).ease(d3.easeCubicOut).attr('stroke-dashoffset',0)});
    nodes.attr('opacity',0).attr('transform',function(d,i){return 'translate('+labelPos[i].x+','+(labelPos[i].y+10)+')'}).transition().delay(function(d,i){return 850+i*90}).duration(360).ease(d3.easeCubicOut).attr('opacity',1).attr('transform',function(d,i){return 'translate('+labelPos[i].x+','+labelPos[i].y+')'});
    links.selectAll('path,circle').attr('opacity',0).transition().delay(function(){var c=this.getAttribute('class')||'';var m=c.match(/link-(\d)/);return 820+(m?+m[1]:0)*90}).duration(320).attr('opacity',1);
    svg.select('.exit-orbit').attr('opacity',0).transition().delay(1450).duration(450).attr('opacity',.8);
  }
})();
</script>
</body>
</html>
