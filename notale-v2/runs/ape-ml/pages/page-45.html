<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#071018;--text:#E7F2F1;--font-sans:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;--focus:#FFB547}
#stage{position:relative;overflow:hidden;background:var(--bg)}
.scene{position:relative;isolation:isolate;overflow:hidden}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.relation-field{position:absolute;z-index:0;left:44px;right:44px;top:182px;bottom:94px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:radial-gradient(circle at 54% 64%,rgba(54,214,192,.07),transparent 34%),linear-gradient(115deg,rgba(13,27,36,.42),rgba(7,16,24,.08) 62%)}
.field-tag{position:absolute;z-index:2;color:var(--ink-faint);font-size:16px;font-weight:650;letter-spacing:.04em}
.tag-a{left:920px;top:76px}.tag-b{left:1130px;top:76px}.tag-c{left:1360px;top:76px}
.earth-fill{fill:var(--panel-deep);stroke:var(--teal-dim);stroke-width:3}
.atmosphere{fill:none;stroke:var(--teal);stroke-width:3;opacity:.72}
.route{fill:none;stroke:var(--teal);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.orbit{stroke-dasharray:12 16}
.branch{fill:none;stroke:var(--teal);stroke-width:3;stroke-linecap:round}
.branch-node{fill:var(--amber)}
.foot{fill:var(--teal);opacity:.8}
.ghost{fill:none;stroke:var(--teal-soft);stroke-width:2;opacity:.18}
.ghost-dim{fill:none;stroke:var(--teal-dim);stroke-width:2;opacity:.32}
.page-head{position:absolute;z-index:4;top:62px;left:72px;width:760px}
.kicker{margin-bottom:12px;color:var(--teal);font-family:var(--font-mono);font-size:16px;font-weight:700;letter-spacing:.16em}
.page-head h1{font-size:clamp(38px,5vw,72px);line-height:1.06}
.k-generalization{position:absolute;z-index:3;inset:0;display:block}
.k-generalization>.claim{position:absolute;top:218px;left:72px;width:710px;padding:18px 24px;font-size:25px;background:rgba(21,43,54,.82)}
.k-generalization>.trunk{position:absolute;left:794px;top:390px;width:4px;height:150px;min-height:0;margin:0;transform:rotate(-36deg);transform-origin:top;background:var(--teal-dim)}
.k-generalization>.supports{position:absolute;inset:0;display:block}
.k-generalization>.supports::before{display:none}
.k-generalization .support{position:absolute;width:640px;min-height:180px;padding:24px 22px;border-left:3px solid var(--teal-dim);border-top:1px solid var(--line);border-right:0;border-bottom:0;border-radius:0;background:linear-gradient(110deg,var(--panel-hi),var(--panel));font-size:16px;line-height:1.45}
.k-generalization .support::before,.k-generalization .support::after{display:none}
.support strong{display:block;margin-bottom:2px;color:var(--text);font-size:18px}
.s1{left:30px;top:650px}.s2{left:330px;top:480px}.s3{left:630px;top:310px}.s4{left:920px;top:140px}
.closing{position:absolute;z-index:4;top:548px;right:82px;width:500px}
.closing .lead{color:var(--text);font-size:24px;font-weight:700}
.closing .secondary{margin-top:10px;color:var(--amber-soft);font-size:18px}
.rewatch{position:absolute;z-index:5;right:64px;bottom:20px;display:flex;align-items:center;gap:14px;color:var(--ink-faint);font-size:16px}
.rewatch span{font-weight:700;color:var(--ink-muted)}
.rewatch a{color:var(--teal-soft);text-decoration:none;border-bottom:1px solid var(--teal-dim);padding-bottom:2px}
.rewatch a:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
@media (prefers-reduced-motion:reduce){.anim-in{opacity:1!important;transform:none!important}.draw{stroke-dashoffset:0!important}}
</style>
</head>
<body data-page="45" data-total="45">
<div id="stage">
  <main class="scene min0" style="flex:1" aria-labelledby="page-title">
    <div class="relation-field anim-in" aria-hidden="true"></div>
    <div class="field-tag tag-a anim-in">环境 → 身体</div>
    <div class="field-tag tag-b anim-in">身体外适应</div>
    <div class="field-tag tag-c anim-in">开放路径</div>
    <svg viewBox="0 0 1600 900" role="img" aria-labelledby="scene-title scene-desc">

      <g aria-hidden="true">
        <g class="foot"><ellipse cx="190" cy="747" rx="17" ry="32" transform="rotate(48 190 747)"/><circle cx="217" cy="716" r="6"/><circle cx="206" cy="710" r="5"/></g>
        <g class="foot"><ellipse cx="280" cy="700" rx="15" ry="29" transform="rotate(56 280 700)"/><circle cx="307" cy="673" r="5"/><circle cx="296" cy="667" r="4"/></g>
        <g class="foot"><ellipse cx="374" cy="667" rx="13" ry="25" transform="rotate(67 374 667)"/><circle cx="400" cy="649" r="4"/><circle cx="389" cy="642" r="4"/></g>
        <g class="foot"><ellipse cx="468" cy="650" rx="11" ry="21" transform="rotate(79 468 650)"/><circle cx="492" cy="641" r="4"/></g>
      </g>
      <g class="anim-in" aria-hidden="true">
        <circle class="ghost-dim" cx="806" cy="548" r="128"/><circle class="ghost" cx="806" cy="548" r="96"/>
        <circle class="ghost" cx="806" cy="470" r="22"/><path class="ghost" d="M806 494 L806 575 M758 523 L854 523 M806 575 L770 630 M806 575 L842 630"/>
        <path class="ghost-dim" d="M716 548 Q806 458 896 548 Q806 638 716 548Z"/>
        <path class="ghost-dim" d="M698 548 H914 M806 440 V656"/>
      </g>

        <path class="branch draw" d="M1185 250 C1290 201 1381 128 1535 102"/>
        <path class="branch draw" d="M1185 250 C1315 225 1412 223 1560 241"/>

        <path class="branch draw" d="M1185 250 C1268 332 1348 420 1498 468"/>
        <circle class="branch-node anim-in" cx="1185" cy="250" r="9"/>
      </g>
    </svg>

    <header class="page-head anim-in">
      <div class="kicker">OPEN FUTURES</div>
      <h1 id="page-title">选择发生在哪里</h1>
    </header>

    <section class="k-generalization" aria-label="主张与四条支撑">
      <div class="claim anim-in">环境施加选择；人类也在反过来塑造选择发生的环境。</div>
      <div class="trunk" aria-hidden="true"></div>
      <div class="supports">
        <div class="support s1 anim-in"><strong>身体始终处在环境中</strong>选择没有停止</div>
        <div class="support s2 anim-in"><strong>文化改变生存条件</strong>适应部分移到身体之外</div>
        <div class="support s3 anim-in"><strong>工程重新制造环境</strong>选择发生的条件可被设计</div>
        <div class="support s4 anim-in"><strong>共同选择走向哪种环境</strong>能参与塑造，不等于能控制结果</div>
      </div>
    </section>

    <div class="closing anim-in">
      <p class="lead">我们从未离开演化，只是越来越能参与塑造选择发生的环境。</p>
      <p class="secondary">参与塑造不是预知结果；路径仍然开放。</p>
    </div>

    <nav class="rewatch anim-in" aria-label="课后重看入口">
      <span>课后重看</span>
      <a href="page-03.html">重看身体与分支树 · p03</a>
      <a href="page-20.html">重看地球依赖 · p20</a>
      <a href="page-39.html">重看未来路径 · p39</a>
    </nav>
  </main>
</div>

<script src="assets/lib/anime.min.js"></script>
<script>
Deck.init({index:45,total:45});
(function(){
  var paths=Array.prototype.slice.call(document.querySelectorAll('.draw'));
  paths.forEach(function(p){var n=p.getTotalLength();p.style.strokeDasharray=n;p.style.strokeDashoffset=n;});
  if(Deck.reduced()){
    paths.forEach(function(p){p.style.strokeDashoffset=0;});
    document.querySelectorAll('.anim-in').forEach(function(el){el.style.opacity=1;});
    return;
  }
  anime.set('.earth-fill, .atmosphere, .branch-node, .ghost, .ghost-dim',{opacity:0});
  var tl=anime.timeline({easing:'easeOutCubic'});
  tl.add({targets:'.earth-fill, .atmosphere',opacity:[0,1],translateY:[28,0],duration:520})
    .add({targets:'#main-route, .orbit',strokeDashoffset:[anime.setDashoffset,0],duration:1400,easing:'easeInOutSine'},'-=180')
    .add({targets:'#branches .branch',strokeDashoffset:[anime.setDashoffset,0],opacity:[0,1],duration:560,delay:anime.stagger(120)},'-=260')
    .add({targets:'.branch-node, .ghost, .ghost-dim, .foot',opacity:[0,1],duration:380},'-=500')
    .add({targets:'.page-head, .claim, .support, .closing, .rewatch',translateY:[12,0],duration:520,delay:anime.stagger(65)},'-=120');
}());
</script>
