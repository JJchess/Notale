<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage { position: relative; isolation: isolate; }
  .opening {
    position: relative;
    z-index: 2;
    flex: 1;
    min-height: 0;
    padding: 54px 88px 42px;
    overflow: hidden;
  }
  .scene-mark {
    height: 52px;
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .18em;
    line-height: 1.4;
  }
  .scene-mark .slash { color: var(--faint); padding: 0 12px; }
  .k-generalization.cover-argument {
    position: relative;
    z-index: 3;
    display: grid;
    grid-template-rows: 174px minmax(0, 1fr);
    gap: 0;
    height: calc(100% - 52px);
  }
  .cover-argument > .trunk {
    grid-row: 1;
    display: flex;
    align-items: center;
    margin: 8px 58px 0 62px;
    padding-left: 50px;
    border: 1px solid var(--line);
    border-radius: var(--radius-2);
    background: linear-gradient(90deg, var(--panel-deep), transparent);
  }
  .cover-argument > .trunk::before {
    top: 104px;
    bottom: -28px;
    left: -1px;
    width: 2px;
    background: linear-gradient(var(--accent), var(--primary-line));
    transform: none;
  }
  .cover-argument .supports {
    display: block;
    min-height: 0;
    padding: 0;
  }
  .cover-argument .support.old-story {
    position: relative;
    display: inline-flex;
    gap: 18px;
    align-items: baseline;
    width: auto;
    padding: 20px 28px 17px;
    border-color: var(--line);
    background: var(--panel-deep);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 23px;
    letter-spacing: .06em;
    opacity: .55;
    transform: rotate(-2deg);
    animation: old-in 500ms ease-out both;
  }
  .cover-argument .support.old-story::before {
    top: 50%;
    right: auto;
    left: -50px;
    width: 50px;
    background: var(--primary-line);
  }
  .old-story .tag {
    position: absolute;
    top: -30px;
    left: 0;
    color: var(--faint);
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .12em;
  }
  .old-story .arrow { color: var(--accent); }
  .strike {
    position: absolute;
    right: -14px;
    left: -14px;
    top: 51%;
    height: 3px;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent-line);
    transform: rotate(-4deg) scaleX(0);
    transform-origin: left center;
    animation: strike-in 430ms 300ms ease-out forwards;
  }
  .old-note {
    margin-left: 24px;
    color: var(--faint);
    font-family: var(--font-mono);
    font-size: 14px;
    letter-spacing: .1em;
    opacity: .7;
  }
  .cover-argument > .claim {
    grid-row: 2;
    align-self: center;
    width: 1180px;
    min-height: 410px;
    margin: 0 0 28px 62px;
    padding: 46px 54px 42px 48px;
    border: 1px solid var(--primary-line);
    border-left: 7px solid var(--primary);
    border-radius: var(--radius-2);
    background: linear-gradient(90deg, var(--primary-soft), var(--panel-deep));
    animation: claim-in 650ms 560ms ease-out both;
  }
  .claim-label {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .16em;
    line-height: 1.4;
  }
  .claim-label::before {
    width: 28px;
    height: 2px;
    content: "";
    background: var(--primary);
  }
  h1 {
    max-width: 12ch;
    font-size: clamp(44px, 7vw, 96px);
    font-weight: 800;
    letter-spacing: -.035em;
    line-height: .94;
  }
  h1 .line { display: block; white-space: nowrap; }
  h1 .not { display: inline; color: var(--accent); }
  .take {
    margin: 24px 0 0;
    color: var(--muted);
    font-size: 20px;
    line-height: 1.5;
  }
  .path-motif {
    position: absolute;
    z-index: 1;
    left: 110px;
    top: 270px;
    width: 1250px;
    height: 520px;
    pointer-events: none;
  }
  .path-motif .route {
    fill: none;
    stroke: var(--primary);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 1700;
    stroke-dashoffset: 1700;
    filter: drop-shadow(0 0 7px var(--primary-line));
    animation: route-in 900ms 520ms ease-out forwards;
  }
  .path-motif .orbit {
    fill: none;
    stroke: var(--primary-line);
    stroke-width: 2;
  }
  .path-motif .guide {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 7 11;
  }
  .footprint {
    position: absolute;
    z-index: 2;
    left: 103px;
    bottom: 52px;
    width: 68px;
    height: 116px;
    border: 2px solid var(--primary-line);
    border-radius: 54% 46% 46% 54% / 62% 54% 46% 38%;
    background: var(--primary-soft);
    transform: rotate(-18deg);
    box-shadow: inset 0 0 24px var(--primary-soft), 0 0 18px var(--primary-soft);
  }
  .footprint::before,
  .footprint::after {
    position: absolute;
    border: 2px solid var(--primary-line);
    border-radius: 50%;
    content: "";
    background: var(--panel-deep);
  }
  .footprint::before { top: -27px; left: 2px; width: 25px; height: 31px; }
  .footprint::after { top: -20px; right: 2px; width: 20px; height: 25px; }
  .endpoint-label {
    position: absolute;
    z-index: 3;
    color: var(--faint);
    font-family: var(--font-mono);
    font-size: 14px;
    letter-spacing: .16em;
    line-height: 1.4;
  }
  .endpoint-label.start { left: 76px; bottom: 20px; }
  .endpoint-label.end { right: 76px; top: 92px; color: var(--primary); }
  .earth {
    position: absolute;
    z-index: 0;
    right: 0;
    bottom: 0;
    width: 470px;
    height: 360px;
    border: 3px solid var(--primary-line);
    border-right: 0;
    border-bottom: 0;
    border-radius: 100% 0 0 0;
    background: radial-gradient(circle at 32% 24%, var(--primary-soft), transparent 34%), var(--panel-deep);
    box-shadow: 0 -9px 32px var(--primary-soft), inset 0 18px 40px var(--primary-soft);
  }
  .strata-bed {
    position: absolute;
    z-index: 0;
    right: 0;
    bottom: 0;
    left: 0;
    height: 178px;
    border-top: 1px solid var(--line-strong);
    opacity: .82;
  }
  .strata-bed::after {
    position: absolute;
    inset: 24px 0 auto;
    height: 1px;
    content: "";
    background: linear-gradient(90deg, transparent, var(--primary-line), transparent);
  }
  @keyframes old-in { from { opacity: 0; transform: translateY(-10px) rotate(-2deg); } }
  @keyframes strike-in { to { transform: rotate(-4deg) scaleX(1); } }
  @keyframes claim-in { from { opacity: 0; transform: translateY(24px); } }
  @keyframes route-in { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .old-story, .strike, .cover-argument > .claim, .path-motif .route { animation: none; }
    .strike { transform: rotate(-4deg) scaleX(1); }
    .path-motif .route { stroke-dashoffset: 0; }
  }
</style>
</head>
<body data-page="01" data-total="50">
<div id="stage">
  <main class="opening strata">
    <div class="scene-mark" aria-label="第一幕：身体">
      <span>ACT</span><span class="slash">/</span><span>I</span><span class="slash">/</span><span>THE BODY</span>
    </div>

    <section class="k-generalization cover-argument" aria-labelledby="main-title">
      <div class="claim">
        <div class="claim-label"><span>本课主张</span><span>REFRAME</span></div>
        <h1 id="main-title"><span class="line">太空人并<span class="not">不是</span></span><span class="line">猿人的终极升级版</span></h1>
        <p class="take"><span>这不是一条</span><span>从低级到高级的</span><span>进度条。</span></p>
      </div>
      <div class="trunk">
        <div class="supports" style="--support-n:1">
          <div class="support old-story">
            <span class="tag">常见误读</span>
            <span>猿</span><span class="arrow">→</span><span>人</span><span class="arrow">→</span><span>太空人</span>
            <i class="strike" aria-hidden="true"></i>
          </div>
        </div>
        <span class="old-note">OLD LINEAR STORY</span>
      </div>
    </section>

    <svg class="path-motif" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
      <path class="guide" d="M145 820 C310 742 400 716 560 650 S885 470 1050 356 S1300 205 1512 152"/>
      <path class="route" d="M145 820 C310 742 400 716 560 650 S885 470 1050 356 S1300 205 1512 152 C1550 130 1548 98 1500 82"/>
      <ellipse class="orbit" cx="1490" cy="126" rx="84" ry="43" transform="rotate(-18 1490 126)"/>
    </svg>
    <div class="footprint" aria-hidden="true"></div>
    <span class="endpoint-label start">APEMAN</span>
    <span class="endpoint-label end">SPACEMAN</span>
    <div class="earth" aria-hidden="true"></div>
    <div class="strata-bed strata" aria-hidden="true"></div>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
