<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage {
    position: relative;
    padding: 42px 64px 34px;
    isolation: isolate;
  }

  .route-head {
    position: relative;
    z-index: 2;
    display: flex;
    height: 148px;
    flex: 0 0 148px;
    align-items: flex-start;
    justify-content: space-between;
    border-bottom: 1px solid var(--primary-line);
  }

  .route-kicker {
    margin-bottom: 8px;
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 700;
    letter-spacing: .16em;
    line-height: 1.4;
  }

  .route-head h1 {
    font-size: 42px;
    line-height: 1.25;
  }

  .route-take {
    width: 440px;
    margin: 14px 0 0;
    padding-left: 20px;
    border-left: 2px solid var(--accent);
    color: var(--muted);
    font-size: var(--fs-lead);
    line-height: 1.5;
  }

  .route-main {
    position: relative;
    z-index: 2;
    display: flex;
    flex: 1;
    min-height: 0;
    padding: 24px 0 18px;
  }

  .ledger {
    --enum-cols: 1;
    position: relative;
    width: 100%;
    gap: 0;
    overflow: visible;
    border: 1px solid color-mix(in srgb, var(--primary) 28%, transparent);
    background: color-mix(in srgb, var(--panel) 92%, transparent);
  }

  .ledger::before {
    position: absolute;
    z-index: 3;
    top: 54px;
    bottom: 54px;
    left: 42px;
    width: 1px;
    content: "";
    background: var(--primary);
    box-shadow: 0 0 14px var(--primary-line);
    transform: scaleY(0);
    transform-origin: top;
    animation: trunk-in 500ms ease-out forwards;
  }

  .ledger > .it {
    position: relative;
    display: grid;
    grid-template-columns: 56px minmax(150px, .8fr) minmax(260px, 1.4fr) 72px;
    gap: 22px;
    align-items: center;
    min-height: 0;
    padding: 0 28px 0 14px;
    border: 0;
    border-top: 1px solid var(--line);
    border-radius: 0;
    background:
      linear-gradient(90deg, var(--primary-soft), transparent 22%),
      var(--panel);
    opacity: 1;
    transform: none;
    animation: row-in 240ms ease-out forwards;
  }

  .ledger > .it:first-child { border-top: 0; animation-delay: 420ms; }
  .ledger > .it:nth-child(2) { animation-delay: 500ms; }
  .ledger > .it:nth-child(3) { animation-delay: 580ms; }
  .ledger > .it:nth-child(4) { animation-delay: 660ms; }

  .ledger > .it::after {
    position: absolute;
    z-index: 1;
    top: 50%;
    left: 42px;
    width: 34px;
    height: 1px;
    content: "";
    background: linear-gradient(90deg, var(--primary), var(--primary-line));
  }

  .seq {
    position: relative;
    z-index: 4;
    display: grid;
    width: 56px;
    height: 56px;
    place-items: center;
    border: 1px solid var(--accent-line);
    color: var(--accent);
    background: var(--panel-deep);
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    line-height: 1.4;
  }

  .seq::before {
    position: absolute;
    top: 50%;
    left: 22px;
    width: 11px;
    height: 11px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    content: "";
    background: var(--bg);
    box-shadow: 0 0 12px var(--accent-line);
    transform: translate(-50%, -50%);
  }

  .seq span { margin-left: 23px; }

  .chapter,
  .question,
  .pages {
    display: flex;
    height: 100%;
    align-items: center;
  }

  .chapter {
    color: var(--text);
    font-family: var(--font-title);
    font-size: 22px;
    font-weight: 750;
    letter-spacing: .04em;
    line-height: 1.4;
  }

  .question {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.5;
  }

  .pages {
    justify-self: end;
    justify-content: flex-end;
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    line-height: 1.4;
    white-space: nowrap;
  }

  .colheads {
    position: absolute;
    z-index: 4;
    top: -23px;
    right: 28px;
    left: 14px;
    display: grid;
    grid-template-columns: 56px minmax(150px, .8fr) minmax(260px, 1.4fr) 72px;
    gap: 22px;
    color: var(--faint);
    font-family: var(--font-mono);
    font-size: 14px;
    letter-spacing: .08em;
    line-height: 1.4;
  }

  .colheads span:last-child { text-align: right; }

  .route-foot {
    position: relative;
    z-index: 2;
    display: flex;
    height: 82px;
    flex: 0 0 82px;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--line-strong);
  }

  .route-foot p {
    max-width: 1120px;
    margin: 0;
    color: var(--text);
    font-size: var(--fs-body);
    line-height: 1.5;
  }

  .route-foot .status {
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.4;
  }

  .background-orbit {
    position: absolute;
    z-index: 0;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .background-orbit .route {
    fill: none;
    stroke: var(--primary);
    stroke-dasharray: 1600;
    stroke-dashoffset: 1600;
    stroke-width: 1.2;
    opacity: .22;
    animation: route-draw 500ms ease-out forwards;
  }

  .background-orbit .guide {
    fill: none;
    stroke: var(--line-strong);
    stroke-dasharray: 5 9;
    stroke-width: 1;
    opacity: .42;
  }

  .earth-rim {
    fill: var(--panel-deep);
    stroke: var(--primary-line);
    stroke-width: 2;
  }

  .atmosphere-rim {
    fill: none;
    stroke: var(--primary);
    stroke-width: 7;
    opacity: .14;
  }

  @keyframes route-draw { to { stroke-dashoffset: 0; } }
  @keyframes trunk-in { to { transform: scaleY(1); } }
  @keyframes row-in {
    from { filter: brightness(.72); }
    to { filter: brightness(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .background-orbit .route,
    .ledger::before,
    .ledger > .it {
      animation: none;
      opacity: 1;
      transform: none;
      stroke-dashoffset: 0;
    }
  }
</style>
</head>
<body data-page="02" data-total="50">
<div id="stage">
  <svg class="background-orbit" viewBox="0 0 1600 900" aria-hidden="true">
    <path class="atmosphere-rim" d="M1062 900 C1118 728 1314 617 1600 618"/>
    <path class="earth-rim" d="M1076 900 C1132 742 1322 632 1600 632 L1600 900 Z"/>
    <path class="guide" d="M70 792 H240 M1310 112 C1450 48 1552 88 1574 196"/>
    <path class="route" d="M92 792 C178 718 202 610 282 552 S432 450 548 398 S770 310 998 250 S1320 132 1508 178 C1578 195 1580 254 1502 270"/>
    <path class="guide" d="M80 802 c12 -28 28 -40 50 -30 c-10 9 -9 24 2 38 c-21 9 -39 7 -52 -8 M105 764 c0 -9 7 -15 15 -15 M124 758 c1 -8 8 -13 15 -11 M142 758 c2 -7 9 -10 16 -7"/>
  </svg>

  <header class="route-head">
    <div>
      <div class="route-kicker">ROUTE MAP / 02</div>
      <h1>四段路径，一条主线</h1>
    </div>
    <p class="route-take">全课沿身体、文化、物理、环境四段路径推进。</p>
  </header>

  <main class="route-main min0" aria-label="课程四段路线">
    <section class="k-enumeration ledger min0" aria-label="四个同级观察维度">
      <div class="colheads" aria-hidden="true">
        <span>序号</span><span>路径</span><span>这一段只追问</span><span>页</span>
      </div>

      <article class="it min0">
        <div class="seq" aria-label="序号 01"><span>01</span></div>
        <div class="chapter">身体</div>
        <div class="question">人类身体为何不能画成一条升级线？</div>
        <div class="pages">01–11</div>
      </article>
      <article class="it min0">
        <div class="seq" aria-label="序号 02"><span>02</span></div>
        <div class="chapter">文化</div>
        <div class="question">什么让知识能够越过个体寿命？</div>
        <div class="pages">12–27</div>
      </article>
      <article class="it min0">
        <div class="seq" aria-label="序号 03"><span>03</span></div>
        <div class="chapter">物理</div>
        <div class="question">抵达太空必须服从哪些约束？</div>
        <div class="pages">28–39</div>
      </article>
      <article class="it min0">
        <div class="seq" aria-label="序号 04"><span>04</span></div>
        <div class="chapter">环境</div>
        <div class="question">古老身体进入陌生环境会怎样？</div>
        <div class="pages">40–50</div>
      </article>
    </section>
  </main>

  <footer class="route-foot">
    <p>这不是从猿人到太空人的等级表，而是同一支动物逐步扩大行动范围的观察路线。</p>
    <span class="status">4 PATHS / 1 LINE</span>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Deck.init({ index: 2, total: 50 });
</script>
</body>
</html>
