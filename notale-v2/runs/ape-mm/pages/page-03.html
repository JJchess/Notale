<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:30px 44px 28px;position:relative}
  #stage.earth-arc::after{right:16px;bottom:16px;width:250px;height:250px;transform:none;opacity:.32}
  .page-head{height:102px;display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-5)}
  .kicker{color:var(--primary);font-family:var(--font-mono);font-size:14px;font-weight:700;letter-spacing:.16em}
  .page-head h1{font-size:48px;line-height:1.15;margin-top:3px}
  .take{max-width:610px;margin:8px 0 0;color:var(--muted);font-size:18px;line-height:1.5;text-align:right}
  .status{min-width:155px;padding:10px 14px;border:1px solid var(--accent-line);border-radius:var(--radius-1);background:var(--panel-deep);color:var(--accent);font:700 18px/1.3 var(--font-mono);text-align:center}
  .compare-shell{--compare-n:1;grid-template-columns:168px minmax(0,1fr);grid-template-rows:46px minmax(0,1fr);flex:1;min-height:0;box-shadow:var(--shadow-panel)}
  .compare-shell>.hdr{padding:8px 16px;font-size:18px}
  .compare-shell>.visual-cell{position:relative;display:block;padding:0;overflow:hidden;background:var(--panel-deep)}
  .scale-names{display:grid;grid-template-rows:repeat(3,1fr);min-height:0;padding:46px 16px 38px;background:var(--panel-deep)}
  .scale-name{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;border-bottom:1px solid var(--line);text-align:right}
  .scale-name:last-child{border-bottom:0}
  .scale-name strong{font-size:18px}
  .scale-name span{color:var(--muted);font:14px/1.45 var(--font-mono)}
  #timeline{width:100%;height:100%;display:block;touch-action:none}
  #timeline text{font-family:var(--font-sans);fill:var(--muted)}
  #timeline .date-text{font-family:var(--font-mono);font-size:14px}
  #timeline .event-text{font-size:16px;font-weight:700}
  #timeline .tick-text{font-family:var(--font-mono);font-size:14px;fill:var(--faint)}
  #timeline .axis-line{stroke:var(--primary);stroke-width:2;vector-effect:non-scaling-stroke}
  #timeline .guide-line{stroke:var(--line-strong);stroke-width:1;vector-effect:non-scaling-stroke}
  #timeline .window{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
  #timeline .interval{fill:var(--primary-soft);stroke:var(--primary);stroke-width:1.5;vector-effect:non-scaling-stroke}
  #timeline .connector{fill:none;stroke:var(--accent-line);stroke-width:1.5;stroke-dasharray:5 5;vector-effect:non-scaling-stroke}
  #timeline .pending{opacity:.22}
  .evidence{position:absolute;right:22px;top:16px;width:174px;height:106px;margin:0;border:1px solid var(--primary-line);border-radius:var(--radius-1);overflow:hidden;background:var(--panel)}
  .evidence img{width:100%;height:100%;object-fit:cover;filter:saturate(.72) contrast(1.05)}
  .evidence figcaption{position:absolute;left:0;right:0;bottom:0;padding:4px 7px;background:var(--panel);color:var(--text);font-size:14px;line-height:1.35}
  .controls{height:116px;display:grid;grid-template-columns:180px minmax(0,1fr) 178px;gap:var(--sp-4);align-items:center;padding-top:12px}
  .controls .ctl{font-size:16px;line-height:1.4}
  .range-wrap{display:flex;flex-direction:column;gap:8px;min-width:0}
  #zoom{width:100%;height:26px;accent-color:var(--accent);cursor:ew-resize}
  .stops{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;line-height:1.35}
  .stops span{position:relative;padding-top:9px;text-align:center}
  .stops span::before{position:absolute;top:0;left:50%;width:7px;height:7px;border:1px solid var(--primary);border-radius:50%;content:"";background:var(--bg);transform:translateX(-50%)}
  .stops span.on{color:var(--accent)}
  .stops span.on::before{border-color:var(--accent);background:var(--accent);box-shadow:0 0 10px var(--accent)}
  #reset{min-height:42px;font-size:16px}
  .feedback{height:58px;display:flex;align-items:center;padding:10px 18px;border-left:3px solid var(--primary);background:var(--primary-soft);color:var(--text);font-size:17px;line-height:1.45}
  .feedback.done{border-left-color:var(--accent);background:var(--accent-soft);font-weight:700}
  .shake{animation:shake .16s linear}
  @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  @media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>

<script>
(function(){
  'use strict';
  Deck.init({index:3,total:50});
  var K=Lec.K, P=Lec.P;
  var earthAge=K.earth.age_years;
  var splitModel=P.speciesById('sahelanthropus');
  var splitEarly=splitModel.startYearsAgo;
  var splitLate=splitModel.endYearsAgo;
  var sapiens=P.speciesById('homo-sapiens');
  var sapiensAge=sapiens.startYearsAgo;
  var spans=[earthAge,splitEarly,sapiensAge];
  var names=['地球史','谱系窗口','智人窗口'];
  var current=0, completed=0;
  var svg=d3.select('#timeline');
  var zoom=document.getElementById('zoom');
  var feedback=document.getElementById('feedback');
  var rangeWrap=document.getElementById('rangeWrap');
  var status=document.getElementById('status');
  var stops=Array.from(document.querySelectorAll('.stops span'));
  var reduced=Deck.reduced();
  var fmt=function(v){return P.formatYearsAgo(v);};
  var pct=function(duration,span){return P.formatPercent(duration/span,1);};

  document.getElementById('earthSpan').textContent=fmt(earthAge)+' → 现在';
  document.getElementById('lineageSpan').textContent=fmt(splitEarly)+' → 现在';
  document.getElementById('sapiensSpan').textContent=fmt(sapiensAge)+' → 现在';

  function xpos(age,span){return 120+P.timelineLinearPosition(age,span)*(1340-120);}
  function tickValues(span){return [span,span*.75,span*.5,span*.25,0];}
  function interval(g,y,start,end,label,sub,kind){
    var x1=xpos(start,g.datum()), x2=xpos(end,g.datum());
    var w=Math.max(3,x2-x1);
    g.append('rect').attr('class',kind||'interval').attr('x',x1).attr('y',y-17).attr('width',w).attr('height',34).attr('rx',4);
    var tx=Math.max(128,Math.min(1180,(x1+x2)/2));
    g.append('line').attr('class','guide-line').attr('x1',(x1+x2)/2).attr('x2',tx).attr('y1',y-19).attr('y2',y-42);
    g.append('text').attr('class','event-text').attr('x',tx).attr('y',y-48).attr('text-anchor',tx>1100?'end':'middle').text(label);
    g.append('text').attr('class','date-text').attr('x',tx).attr('y',y-27).attr('text-anchor',tx>1100?'end':'middle').text(sub);
  }
  function draw(level,animate){
    svg.selectAll('*:not(title):not(desc)').remove();
    var rows=[{y:150,span:earthAge,name:'整部地球史'},{y:382,span:splitEarly,name:'最近的人猿谱系窗口'},{y:614,span:sapiensAge,name:'智人存在时间'}];
    rows.forEach(function(r,i){
      var g=svg.append('g').datum(r.span).attr('class','ruler row-'+i+(i>level?' pending':''));
      g.append('text').attr('class','event-text').attr('x',120).attr('y',r.y-100).text(r.name);
      g.append('text').attr('class','date-text').attr('x',120).attr('y',r.y-77).text(fmt(r.span)+' → 现在');
      g.append('line').attr('class','axis-line').attr('x1',120).attr('x2',1340).attr('y1',r.y).attr('y2',r.y);
      tickValues(r.span).forEach(function(v){
        var x=xpos(v,r.span);
        g.append('line').attr('class','guide-line').attr('x1',x).attr('x2',x).attr('y1',r.y-9).attr('y2',r.y+10);
        g.append('text').attr('class','tick-text').attr('x',x).attr('y',r.y+31).attr('text-anchor',v===r.span?'start':v===0?'end':'middle').text(v===0?'现在':fmt(v));
      });
      if(i===0){
        interval(g,r.y,splitEarly,splitLate,'人猿谱系分化：估计区间',fmt(splitEarly)+' — '+fmt(splitLate),'window');
        interval(g,r.y+36,sapiensAge,0,'智人存在时段',fmt(sapiensAge)+' — 现在','interval');
        g.append('text').attr('class','date-text').attr('x',120).attr('y',r.y+76).text('智人占本尺 '+pct(sapiensAge,earthAge));
      } else if(i===1){
        interval(g,r.y,splitEarly,splitLate,'人猿谱系分化：估计区间',fmt(splitEarly)+' — '+fmt(splitLate),'window');
        interval(g,r.y+36,sapiensAge,0,'智人存在时段',fmt(sapiensAge)+' — 现在','interval');
        g.append('text').attr('class','date-text').attr('x',120).attr('y',r.y+76).text('智人占本尺 '+pct(sapiensAge,splitEarly));
      } else {
        interval(g,r.y,sapiensAge,0,'智人的全部历史',fmt(sapiensAge)+' — 现在','window');
        g.append('text').attr('class','date-text').attr('x',120).attr('y',r.y+76).text('智人占本尺 '+pct(sapiensAge,sapiensAge));
      }
    });
    if(level>=1){
      var a1=(xpos(splitEarly,earthAge)+xpos(splitLate,earthAge))/2;
      svg.append('path').attr('class','connector').attr('d','M'+a1+',167 C'+a1+',250 120,270 120,330');
    }
    if(level>=2){
      var a2=(xpos(sapiensAge,splitEarly)+xpos(0,splitEarly))/2;
      svg.append('path').attr('class','connector').attr('d','M'+a2+',435 C'+a2+',500 120,510 120,562');
    }
    var handleX=120+(1340-120)*(Number(zoom.value)/2);
    svg.append('line').attr('class','guide-line').attr('x1',handleX).attr('x2',handleX).attr('y1',34).attr('y2',724).attr('stroke-dasharray','3 7');
    svg.append('rect').attr('class','window').attr('x',handleX-18).attr('y',30).attr('width',36).attr('height',18).attr('rx',8);
    svg.append('text').attr('class','date-text').attr('x',handleX).attr('y',24).attr('text-anchor','middle').text('压缩柄');
    if(animate&&!reduced){
      svg.selectAll('.ruler').attr('opacity',0).transition().duration(420).delay(function(d,i){return i*100;}).attr('opacity',1);
    }
  }
  function updateState(level,done){
    current=level; completed=Math.max(completed,level);
    zoom.value=String(level);
    status.textContent='尺度 '+(level+1)+'/3';
    stops.forEach(function(s,i){s.classList.toggle('on',i<=completed);});
    feedback.classList.toggle('done',done);
    if(done){feedback.textContent='智人的全部历史放进地球史，只剩靠放大才能看见的一层；时间长不代表“朝人类前进”。';}
    else if(level===0){feedback.textContent='向右拖动；让发光薄片展开为下一把尺。';}
    else {feedback.textContent='尺度改变了可见性，没有改变事件的先后。继续向右拖动。';}
    draw(level,true);
    if(done&&!reduced){
      svg.select('.row-2 .window').transition().duration(180).style('filter','drop-shadow(0 0 10px var(--accent))').transition().duration(360).style('filter',null);
    }
  }
  function settle(){
    var v=Number(zoom.value), nearest=Math.round(v), distance=Math.abs(v-nearest);
    if(distance>.28){
      rangeWrap.classList.remove('shake'); void rangeWrap.offsetWidth; rangeWrap.classList.add('shake');
      feedback.classList.remove('done');
      feedback.textContent='这里没有稳定尺度；拖到发光刻度，比较同样宽度代表多久。';
      zoom.value=String(current); draw(current,false);
      return;
    }
    updateState(nearest,nearest===2);
  }
  zoom.addEventListener('input',function(){draw(current,false);});
  zoom.addEventListener('change',settle);
  zoom.addEventListener('pointerup',settle);
  document.getElementById('reset').addEventListener('click',function(){completed=0;updateState(0,false);zoom.focus();});
  updateState(0,false);
})();
</script>
</body>
</html>
