<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:28px 42px 26px;gap:16px;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px;}
  .kicker{color:var(--primary);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.14em;}
  .head-take{max-width:650px;color:var(--muted);font-size:var(--fs-sec);line-height:1.5;text-align:right;}
  .model-zone{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-2);background:radial-gradient(circle at 96% 132%,transparent 0 38%,var(--primary-line) 38.3%,transparent 38.8%),linear-gradient(180deg,var(--panel),var(--panel-deep));}
  .half{position:relative;z-index:1;min-width:0;min-height:0;border-right:1px solid var(--line);}
  .half:last-child{border-right:0;}
  .model-title{position:absolute;z-index:3;top:14px;left:18px;display:flex;align-items:center;gap:10px;font:700 var(--fs-h2)/1.4 var(--font-title);}
  .model-title .tag{padding:3px 9px;border:1px solid var(--line-strong);border-radius:999px;color:var(--muted);font:650 var(--fs-label)/1.4 var(--font-sans);}
  #three-host{position:absolute;inset:0;z-index:1;}
  #three-host canvas{display:block;}
  .baseline{position:absolute;z-index:2;right:34px;bottom:62px;left:34px;height:2px;background:var(--primary-line);transform:scaleX(0);transform-origin:left;transition:transform 700ms ease-out;pointer-events:none;}
  .ready .baseline{transform:scaleX(1);}
  .model-disclaimer{position:absolute;z-index:4;right:24px;bottom:126px;color:var(--muted);font-size:14px;line-height:1.4;}
  .control-dock{position:absolute;z-index:4;right:18px;bottom:12px;left:calc(50% + 18px);display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-2);background:color-mix(in srgb,var(--panel-deep) 94%,transparent);box-shadow:var(--shadow-panel);}
  .slider-unit{min-width:0;}
  .slider-line{display:flex;justify-content:space-between;gap:10px;align-items:baseline;color:var(--muted);font-size:var(--fs-label);font-weight:650;line-height:1.4;}
  .slider-line output{color:var(--accent);font-family:var(--font-mono);font-size:var(--fs-sec);}
  input[type="range"]{width:100%;min-height:28px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer;}
  .matched input[type="range"]{accent-color:var(--primary);}
  .target-note{color:var(--faint);font-size:14px;line-height:1.35;}
  .reset{min-height:42px;padding:7px 14px;border:1px solid var(--line-strong);border-radius:var(--radius-1);color:var(--text);background:var(--panel);font-size:16px;cursor:pointer;}
  .reset:hover{border-color:var(--primary);}
  .status-stack{position:absolute;z-index:4;top:14px;right:18px;width:278px;display:flex;flex-direction:column;gap:8px;}
  .status{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-1);background:var(--panel-deep);font-size:var(--fs-sec);line-height:1.4;}
  .status strong{color:var(--primary);font-family:var(--font-mono);}
  .feedback{padding:8px 12px;border-left:3px solid var(--accent);color:var(--text);background:var(--accent-soft);font-size:var(--fs-sec);line-height:1.45;}
  .feedback.good{border-left-color:var(--primary);background:var(--primary-soft);}
  .pulse{animation:nudge 220ms ease-out 2;}
  @keyframes nudge{50%{transform:translateX(6px)}}
  .comparison-wrap{display:flex;min-height:0;}
  .k-comparison{--compare-n:2;grid-template-columns:150px repeat(2,minmax(0,1fr));}
  .k-comparison>.hdr,.k-comparison>.dim,.k-comparison>.cell{padding:8px 16px;}
  .k-comparison>.hdr{font-size:18px;}
  .k-comparison>.cell{font-size:16px;line-height:1.4;}
  .takeaway{display:flex;align-items:center;gap:16px;padding:11px 18px;border:1px solid var(--primary-line);border-left:6px solid var(--primary);border-radius:var(--radius-2);background:linear-gradient(90deg,var(--primary-soft),transparent 72%);font-size:var(--fs-lead);font-weight:750;line-height:1.45;}
  .takeaway .mark{flex:0 0 auto;color:var(--primary);font:800 25px/1 var(--font-title);}
  .done{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary-line),var(--shadow-panel);}
  @media (prefers-reduced-motion:reduce){.baseline{transform:scaleX(1);transition:none}.pulse{animation:none}}
</style>
</head>
<body data-page="06" data-total="50">
<div id="stage">
  <header class="page-head shrink0" style="height:82px">
    <div>
      <div class="kicker">BODY GEOMETRY · 06</div>
      <h1>关节必须一起对齐</h1>
    </div>
    <div class="head-take">两足行走来自多处结构协同，不是单一“直立基因”。</div>
  </header>

  <section class="model-zone min0 no-pan" style="flex:1" aria-label="两具下肢关节几何模型">
    <div class="half min0">
      <div class="model-title"><span>只改一处</span><span class="tag">锁定对照</span></div>
    </div>
    <div class="half min0">
      <div class="model-title"><span>骨盆与股骨协同</span><span class="tag">可调模型</span></div>
    </div>
    <div id="three-host" aria-hidden="true"></div>
    <div class="baseline"></div>
    <div class="status-stack" aria-live="polite">
      <div class="status"><span>协同条件</span><strong id="condition-count">0/2</strong></div>
      <div class="status"><span>负重线偏差</span><strong id="deviation-level">大</strong></div>
      <div class="feedback" id="feedback">先调整骨盆承托，再观察膝的位置。</div>
    </div>
    <div class="model-disclaimer">目标带是教学几何范围，不是物种诊断值。</div>
    <div class="control-dock" id="controls">
      <div class="slider-unit" id="pelvis-unit">
        <div class="slider-line"><label for="pelvis">骨盆宽度</label><output id="pelvis-out"></output></div>
        <input id="pelvis" type="range" aria-label="骨盆宽度">
        <div class="target-note" id="pelvis-target"></div>
      </div>
      <div class="slider-unit" id="angle-unit">
        <div class="slider-line"><label for="angle">股骨内倾角</label><output id="angle-out"></output></div>
        <input id="angle" type="range" aria-label="股骨内倾角">
        <div class="target-note" id="angle-target"></div>
      </div>
      <button class="reset" id="reset" type="button">重置几何</button>
    </div>
  </section>

  <section class="comparison-wrap min0 shrink0" style="height:206px" aria-label="同一维度比较">
    <div class="k-comparison min0">
      <div class="hdr">比较维度</div><div class="hdr">只改一处</div><div class="hdr">骨盆与股骨协同</div>
      <div class="rowline"></div>
      <div class="dim">骨盆</div><div class="cell">狭长，承托面未匹配</div><div class="cell diff">较短宽，左右髋稳定承托</div>
      <div class="rowline"></div>
      <div class="dim">股骨</div><div class="cell">近乎垂直，膝偏离负重线</div><div class="cell diff">向内倾，膝靠近身体中线</div>
      <div class="rowline"></div>
      <div class="dim">负重线</div><div class="cell">髋—膝—踝折离</div><div class="cell diff">三点接近对齐</div>
      <div class="rowline"></div>
      <div class="dim">能推出什么</div><div class="cell">单一变化不足以构成稳定几何</div><div class="cell diff">多处结构需彼此匹配</div>
    </div>
  </section>

  <div class="takeaway shrink0" id="takeaway" style="height:62px"><span class="mark">→</span><span>直立不是打开一个开关：骨盆提供承托，股骨把膝带回负重线，多处结构必须协同。</span></div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/three.min.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:6,total:50});

  var cfg={pelvisMin:.75,pelvisMax:1.25,pelvisStep:.01,pelvisInitial:.82,pelvisBand:[1.05,1.18],angleMin:0,angleMax:14,angleStep:1,angleInitial:0,angleBand:[7,11],deviationLimit:.04};
  var pelvis=document.getElementById('pelvis'), angle=document.getElementById('angle');
  pelvis.min=cfg.pelvisMin; pelvis.max=cfg.pelvisMax; pelvis.step=cfg.pelvisStep;
  angle.min=cfg.angleMin; angle.max=cfg.angleMax; angle.step=cfg.angleStep;
  document.getElementById('pelvis-target').textContent='目标带 '+Lec.P.formatFixed(cfg.pelvisBand[0],2)+'–'+Lec.P.formatFixed(cfg.pelvisBand[1],2);
  document.getElementById('angle-target').textContent='目标带 '+Lec.P.formatFixed(cfg.angleBand[0],0)+'–'+Lec.P.formatFixed(cfg.angleBand[1],0)+'°';

  var host=document.getElementById('three-host');
  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(32,1,.1,100);
  camera.position.set(0,1.4,7);
  camera.lookAt(0,.15,0);
  var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.setClearColor(0x000000,0);
  host.appendChild(renderer.domElement);

  var primary=new THREE.Color(Deck.token('--primary'));
  var accent=new THREE.Color(Deck.token('--accent'));
  var text=new THREE.Color(Deck.token('--text'));
  var muted=new THREE.Color(Deck.token('--muted'));
  scene.add(new THREE.HemisphereLight(text,muted,1.8));
  var key=new THREE.DirectionalLight(text,3.2); key.position.set(2,5,5); scene.add(key);
  var rim=new THREE.DirectionalLight(primary,2.2); rim.position.set(-4,2,-3); scene.add(rim);

  var boneMat=new THREE.MeshStandardMaterial({color:text,roughness:.42,metalness:.08,transparent:true,opacity:.82});
  var pelvisMat=new THREE.MeshStandardMaterial({color:primary,roughness:.35,metalness:.12,transparent:true,opacity:.38,side:THREE.DoubleSide});
  var jointMat=new THREE.MeshStandardMaterial({color:text,emissive:primary,emissiveIntensity:.18,roughness:.28});
  var lineBad=new THREE.LineBasicMaterial({color:accent,transparent:true,opacity:.95});
  var lineGood=new THREE.LineBasicMaterial({color:primary,transparent:true,opacity:.95});
  var cylGeo=new THREE.CylinderGeometry(.09,.115,1,14);
  var jointGeo=new THREE.SphereGeometry(.13,18,14);
  var pelvisGeo=new THREE.BoxGeometry(1,.34,.42,4,1,1);

  function boneBetween(a,b,mat){
    var mesh=new THREE.Mesh(cylGeo,mat); var mid=a.clone().add(b).multiplyScalar(.5);
    mesh.position.copy(mid); mesh.scale.y=a.distanceTo(b); mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize()); return mesh;
  }
  function makeModel(x){
    var group=new THREE.Group(); group.position.x=x; scene.add(group);
    var pelvisMesh=new THREE.Mesh(pelvisGeo,pelvisMat.clone()); group.add(pelvisMesh);
    var parts={group:group,pelvis:pelvisMesh,joints:[],bones:[],lines:[]};
    for(var i=0;i<4;i++){var b=new THREE.Mesh(cylGeo,boneMat.clone());group.add(b);parts.bones.push(b);}
    for(var j=0;j<6;j++){var q=new THREE.Mesh(jointGeo,jointMat.clone());group.add(q);parts.joints.push(q);}
    for(var k=0;k<2;k++){var geom=new THREE.BufferGeometry();var ln=new THREE.Line(geom,lineBad.clone());group.add(ln);parts.lines.push(ln);}
    return parts;
  }
  var left=makeModel(-2.55), right=makeModel(2.55);

  function geometryFor(width,deg){
    var hipX=.78*width, ankleX=.35, kneeX=hipX-Math.sin(Lec.P.degreesToRadians(deg))*1.6;
    var hipY=1.65,kneeY=.05,ankleY=-1.65;
    var t=(hipY-kneeY)/(hipY-ankleY), idealKnee=hipX+(ankleX-hipX)*t;
    return {hipX:hipX,ankleX:ankleX,kneeX:kneeX,hipY:hipY,kneeY:kneeY,ankleY:ankleY,deviation:Math.abs(kneeX-idealKnee)/hipX};
  }
  function updateModel(m,width,deg,good){
    var g=geometryFor(width,deg); m.pelvis.scale.set(width*1.7,1,1);m.pelvis.position.set(0,g.hipY+.12,0);
    [-1,1].forEach(function(side,idx){
      var hip=new THREE.Vector3(side*g.hipX,g.hipY,0), knee=new THREE.Vector3(side*g.kneeX,g.kneeY,0), ankle=new THREE.Vector3(side*g.ankleX,g.ankleY,0);
      var pairs=[[hip,knee],[knee,ankle]];
      pairs.forEach(function(pair,p){var b=m.bones[idx*2+p], fresh=boneBetween(pair[0],pair[1],b.material);b.position.copy(fresh.position);b.scale.copy(fresh.scale);b.quaternion.copy(fresh.quaternion);});
      [hip,knee,ankle].forEach(function(pos,p){m.joints[idx*3+p].position.copy(pos);m.joints[idx*3+p].material.emissiveIntensity=good?1.2:.18;});
      m.lines[idx].geometry.dispose();m.lines[idx].geometry=new THREE.BufferGeometry().setFromPoints([hip,knee,ankle]);m.lines[idx].material.color.copy(good?primary:accent);
    });
    return g;
  }
  updateModel(left,cfg.pelvisInitial,cfg.angleInitial,false);

  var count=document.getElementById('condition-count'), deviationLevel=document.getElementById('deviation-level'), feedback=document.getElementById('feedback');
  function inBand(v,b){return v>=b[0]&&v<=b[1];}
  function renderState(shake){
    var w=Number(pelvis.value), a=Number(angle.value), pOK=inBand(w,cfg.pelvisBand), aOK=inBand(a,cfg.angleBand);
    var geom=geometryFor(w,a), lineOK=geom.deviation<=cfg.deviationLimit, done=pOK&&aOK&&lineOK;
    updateModel(right,w,a,done);
    document.getElementById('pelvis-out').textContent=Lec.P.formatFixed(w,2);
    document.getElementById('angle-out').textContent=Lec.P.formatFixed(a,0)+'°';
    document.getElementById('pelvis-unit').classList.toggle('matched',pOK);
    document.getElementById('angle-unit').classList.toggle('matched',aOK);
    count.textContent=(Number(pOK)+Number(aOK))+'/2';
    var level=geom.deviation<=cfg.deviationLimit?'小':(geom.deviation<=cfg.deviationLimit*2.4?'中':'大');
    deviationLevel.textContent=level;
    feedback.classList.toggle('good',done);
    document.getElementById('takeaway').classList.toggle('done',done);
    if(done) feedback.textContent='不是一处变直，而是多处对齐。';
    else if(pOK&&!aOK) feedback.textContent='骨盆已承托，但膝仍在负重线外。';
    else if(!pOK&&aOK) feedback.textContent='股骨已内倾，但骨盆承托仍不匹配。';
    else feedback.textContent='调整两处结构，让髋、膝、踝接近对齐。';
    if(shake&&!done){feedback.classList.remove('pulse');void feedback.offsetWidth;feedback.classList.add('pulse');}
  }
  function reset(){pelvis.value=cfg.pelvisInitial;angle.value=cfg.angleInitial;renderState(false);}
  pelvis.addEventListener('input',function(){renderState(true)});
  angle.addEventListener('input',function(){renderState(true)});
  document.getElementById('reset').addEventListener('click',reset);
  reset();

  function size(){var w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);renderer.render(scene,camera);}
  Deck.onResize(size); new ResizeObserver(size).observe(host); size();
  var enter=Deck.reduced()?1:0;
  Deck.loop(function(t,dt){
    if(enter<1)enter=Math.min(1,enter+dt/1.15);
    var reveal=1-Math.pow(1-enter,3);
    [left,right].forEach(function(m,idx){m.group.scale.setScalar(.92+.08*reveal);m.group.position.y=-.15*(1-reveal);m.group.rotation.y=Deck.reduced()?0:Math.sin(t*.00035+idx*.8)*.025;});
    renderer.render(scene,camera);
  },{still:1800});
  setTimeout(function(){document.getElementById('stage').classList.add('ready')},30);
})();
</script>
</body>
</html>
