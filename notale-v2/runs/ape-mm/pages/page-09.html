<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:28px 42px 26px;gap:14px}
  .page-head{height:62px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line)}
  .kicker{color:var(--primary);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em}
  .take{max-width:520px;color:var(--muted);font-size:var(--fs-sec);line-height:1.5;text-align:right}
  .lesson{flex:1;min-height:0;gap:14px}
  .lesson>.claim{padding:14px 24px;display:flex;align-items:baseline;justify-content:space-between;gap:30px}
  .claim-main{font-size:var(--fs-lead)}
  .claim-bound{max-width:730px;color:var(--muted);font-size:var(--fs-sec);font-weight:500;line-height:1.5;text-align:right}
  .lesson>.trunk{display:grid;grid-template-columns:minmax(0,1.64fr) minmax(420px,1fr);gap:26px}
  .lesson>.trunk::before{left:62.5%;z-index:0}
  .measure-bay{position:relative;z-index:1;display:flex;flex-direction:column;min-width:0;min-height:0;padding:16px 18px 14px;border:1px solid var(--line-strong);border-radius:var(--radius-2);background:linear-gradient(180deg,var(--primary-soft),transparent 18%),var(--panel-deep);box-shadow:var(--shadow-panel);overflow:hidden}
  .measure-bay::after{position:absolute;right:0;bottom:0;width:420px;height:90px;border-top:2px solid var(--primary-line);border-radius:50% 50% 0 0;content:"";box-shadow:0 -5px 18px var(--primary-soft);pointer-events:none;opacity:.5}
  .bay-top{height:48px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .task-state{min-width:270px;color:var(--text);font-size:var(--fs-sec);line-height:1.45}
  .progress{color:var(--accent);font-family:var(--font-mono);font-size:var(--fs-body);font-weight:750;white-space:nowrap}
  .metric-switch{display:inline-flex;flex-wrap:nowrap;gap:6px}
  .metric-switch button,.reset-btn{min-height:38px;padding:6px 13px;border:1px solid var(--line-strong);border-radius:var(--radius-1);color:var(--muted);background:var(--panel-deep);font-size:16px;line-height:1.4;cursor:pointer}
  .metric-switch button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .chart-wrap{position:relative;flex:1;min-height:0}
  #scatter{display:block;width:100%;height:100%;overflow:visible}
  #scatter .axis text{fill:var(--faint);font:12px var(--font-mono)}
  #scatter .axis path,#scatter .axis line{stroke:var(--line-strong)}
  #scatter .grid line{stroke:var(--line);stroke-opacity:.68;stroke-dasharray:3 7}
  #scatter .grid path{display:none}
  #scatter .axis-label{fill:var(--muted);font:650 14px var(--font-sans)}
  #scatter .point-label{fill:var(--muted);font:650 14px var(--font-sans);pointer-events:none}
  #scatter .dot{fill:var(--primary);stroke:var(--panel-deep);stroke-width:3;cursor:pointer;outline:none}
  #scatter .dot:hover,#scatter .dot:focus{stroke:var(--text);stroke-width:4}
  #scatter .dot.locked{fill:var(--accent);stroke:var(--accent);filter:drop-shadow(0 0 7px var(--accent))}
  #scatter .compare-line{stroke:var(--accent);stroke-width:2;stroke-dasharray:7 5;fill:none;pointer-events:none}
  #tooltip{position:absolute;z-index:5;min-width:218px;padding:10px 12px;border:1px solid var(--accent-line);border-radius:var(--radius-1);background:var(--panel-raised);box-shadow:var(--shadow-panel);color:var(--text);font-size:16px;line-height:1.45;pointer-events:none;opacity:0}
  #tooltip strong{color:var(--accent)}
  .chart-note{height:30px;display:flex;align-items:center;justify-content:space-between;gap:18px;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
  #feedback{color:var(--text);font-size:16px}
  .supports{--support-n:1;z-index:1;grid-template-columns:1fr!important;grid-template-rows:repeat(4,minmax(0,1fr));gap:12px!important;padding:10px 0!important;align-content:stretch!important}
  .supports .support{display:flex;flex-direction:column;justify-content:center;padding:14px 18px 14px 22px;transition:border-color .25s,background .25s,box-shadow .25s}
  .supports .support::before{left:-26px!important;right:auto!important;width:26px!important}
  .supports .support.current{border-color:var(--accent-line);color:var(--text);background:linear-gradient(90deg,var(--accent-soft),transparent),var(--panel);box-shadow:inset 3px 0 0 var(--accent)}
  .support-title{color:var(--primary);font-family:var(--font-title);font-size:var(--fs-h2);font-weight:700;line-height:1.4}
  .support.current .support-title{color:var(--accent)}
  .support-copy{margin-top:4px;font-size:var(--fs-sec);line-height:1.5}
  .reset-btn{display:none;margin-top:8px;align-self:flex-start;color:var(--accent);border-color:var(--accent)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .dot.wrong{animation:shake .24s ease-in-out}
  @media (prefers-reduced-motion:reduce){.supports .support{transition:none}.dot.wrong{animation:none}}
</style>
</head>
<body data-page="09" data-total="50">
<div id="stage">
  <header class="page-head shrink0">
    <div class="row items-end gap-4">
      <div class="kicker">E2 · BRAIN / BODY</div>
      <h1>大脑要放回身体里比较</h1>
    </div>
    <div class="take">同一批物种，换一种比较尺度，位置就会重排。</div>
  </header>

  <main class="k-generalization lesson min0">
    <div class="claim">
      <span class="claim-main">单看脑大，不足以解释一个物种</span>
      <span class="claim-bound">脑大小必须结合体形与物种差异解读；任何单一脑指标都不能直接当作“聪明排行榜”。</span>
    </div>
    <div class="trunk min0">
      <section class="measure-bay strata min0" aria-labelledby="chart-title">
        <div class="bay-top shrink0">
          <div>
            <div id="chart-title" class="h2">脑—体测量台</div>
            <div class="task-state"><span id="taskText">载入物种数据…</span> <span id="progress" class="progress" aria-live="polite"></span></div>
          </div>
          <div class="metric-switch" role="group" aria-label="切换纵轴指标">
            <button type="button" data-metric="brain" aria-pressed="true">绝对脑质量</button>
            <button type="button" data-metric="ratio" aria-pressed="false">脑体比</button>
            <button type="button" data-metric="eq" aria-pressed="false">EQ</button>
          </div>
        </div>
        <div class="chart-wrap min0">
          <svg id="scatter" role="img" aria-labelledby="scatterTitle scatterDesc" viewBox="0 0 900 520" preserveAspectRatio="none">
            <title id="scatterTitle">六种灵长类与古人类的脑质量和体质量散点图</title>
            <desc id="scatterDesc">横轴始终是体质量，纵轴可切换绝对脑质量、脑体比和脑化指数。</desc>
          </svg>
          <div id="tooltip" aria-hidden="true"></div>
        </div>
        <div class="chart-note shrink0">
          <span>点选目标；悬停或聚焦可读三项测量。</span>
          <span id="feedback" aria-live="polite">先找绝对脑质量最大的点。</span>
        </div>
      </section>

      <div class="supports min0" aria-label="支撑结论的四条证据">
        <article class="support" data-support="0">
          <div class="support-title">01 · 绝对量</div>
          <div class="support-copy">脑质量回答“有多大”，不自动回答“能做什么”。</div>
        </article>
        <article class="support" data-support="1">
          <div class="support-title">02 · 体形基线</div>
          <div class="support-copy">更大的身体通常需要更多神经组织参与控制。</div>
        </article>
        <article class="support" data-support="2">
          <div class="support-title">03 · 标准化会重排</div>
          <div class="support-copy">换一种校正方法，物种的相对位置可能改变。</div>
        </article>
        <article class="support" data-support="3">
          <div class="support-title">04 · 解释有边界</div>
          <div class="support-copy">物种差异还包括脑区组织、发育、行为与环境。</div>
          <button id="resetBtn" class="reset-btn" type="button">换指标再看</button>
        </article>
      </div>
    </div>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:9,total:50});

  const ids=['pan-troglodytes','australopithecus-afarensis','homo-habilis','homo-erectus','homo-neanderthalensis','homo-sapiens'];
  const names={
    'pan-troglodytes':'黑猩猩',
    'australopithecus-afarensis':'南方古猿阿法种',
    'homo-habilis':'能人',
    'homo-erectus':'直立人',
    'homo-neanderthalensis':'尼安德特人',
    'homo-sapiens':'智人'
  };
  /* 当前公共数据表对两项别名及脑体质量字段缺项；后备值只在接口缺项时启用。 */
  const fallback={
    'pan-troglodytes':{bodyMass_kg:45,brainMass_kg:0.40},
    'australopithecus-afarensis':{bodyMass_kg:35,brainMass_kg:0.43},
    'homo-habilis':{bodyMass_kg:37,brainMass_kg:0.61},
    'homo-erectus':{bodyMass_kg:55,brainMass_kg:0.90},
    'homo-neanderthalensis':{bodyMass_kg:76,brainMass_kg:1.45},
    'homo-sapiens':{bodyMass_kg:Lec.K.human.referenceMass_kg,brainMass_kg:Lec.K.human.referenceBrainMass_kg}
  };
  const aliases={'homo-neanderthalensis':'neanderthal'};
  const data=ids.map(id=>{
    const direct=Lec.P.speciesById(id);
    const s=direct||Lec.P.speciesById(aliases[id]);
    const body=Number(s&&s.bodyMass_kg)||fallback[id].bodyMass_kg;
    const brain=Number(s&&s.brainMass_kg)||(s&&Number(s.brainVolume_cm3)/1000)||fallback[id].brainMass_kg;
    return {id,name:names[id],body,brain,ratio:Lec.P.brainToBodyRatio(brain,body),eq:Lec.P.encephalizationQuotient(brain,body)};
  }).filter(d=>[d.body,d.brain,d.ratio,d.eq].every(Number.isFinite));

  const svg=d3.select('#scatter');
  const wrap=document.querySelector('.chart-wrap');
  const tooltip=document.getElementById('tooltip');
  const taskText=document.getElementById('taskText');
  const progressEl=document.getElementById('progress');
  const feedback=document.getElementById('feedback');
  const resetBtn=document.getElementById('resetBtn');
  const supports=[...document.querySelectorAll('.support')];
  const buttons=[...document.querySelectorAll('[data-metric]')];
  const margin={top:28,right:24,bottom:54,left:68};
  const width=900,height=520,iw=width-margin.left-margin.right,ih=height-margin.top-margin.bottom;
  const root=svg.append('g').attr('transform',`translate(${margin.left},${margin.top})`);
  const gridX=root.append('g').attr('class','grid').attr('transform',`translate(0,${ih})`);
  const gridY=root.append('g').attr('class','grid');
  const gx=root.append('g').attr('class','axis').attr('transform',`translate(0,${ih})`);
  const gy=root.append('g').attr('class','axis');
  const lineLayer=root.append('g');
  const pointLayer=root.append('g');
  root.append('text').attr('class','axis-label').attr('x',iw/2).attr('y',ih+47).attr('text-anchor','middle').text('体质量（kg）');
  const yLabel=root.append('text').attr('class','axis-label').attr('transform','rotate(-90)').attr('x',-ih/2).attr('y',-50).attr('text-anchor','middle');

  let metric='brain',step=0,pending=[],locked=[],savedLines=[],doneTimer=null;
  const metricInfo={
    brain:{label:'脑质量（kg）',short:'脑质量'},
    ratio:{label:'脑体比',short:'脑体比'},
    eq:{label:'EQ（脑化指数）',short:'EQ'}
  };
  const x=d3.scaleLog().domain(d3.extent(data,d=>d.body)).nice().range([0,iw]);
  let y=d3.scaleLog().range([ih,0]);
  const maxBrain=d3.greatest(data,d=>d.brain);
  const closestPair=(function(){
    let best=null;
    data.forEach((a,i)=>data.slice(i+1).forEach(b=>{
      const gap=Math.abs(a.body-b.body);
      if(!best||gap<best.gap) best={a,b,gap};
    }));
    return best;
  })();

  function ranks(key){
    return new Map([...data].sort((a,b)=>b[key]-a[key]).map((d,i)=>[d.id,i]));
  }
  const brainRanks=ranks('brain');
  function biggestRankChange(key){
    const rk=ranks(key);
    const diffs=data.map(d=>({d,delta:Math.abs(brainRanks.get(d.id)-rk.get(d.id))}));
    const m=d3.max(diffs,e=>e.delta);
    return new Set(diffs.filter(e=>e.delta===m).map(e=>e.d.id));
  }
  function samePair(a,b,p){return (a.id===p.a.id&&b.id===p.b.id)||(a.id===p.b.id&&b.id===p.a.id)}
  function fmtMetric(d,key){
    if(key==='brain') return Lec.P.formatMass(d.brain);
    if(key==='ratio') return Lec.P.formatPercent(d.ratio);
    return d.eq.toFixed(2);
  }
  function updateTask(){
    const tasks=['找出绝对脑质量最大的物种。','点出体质量最接近的一对。','切换到脑体比或 EQ，再找名次变化最大的物种。','三种尺度已完成比较。'];
    taskText.textContent=tasks[step];
    progressEl.textContent='发现 '+Math.min(step,3)+'/3';
    supports.forEach((s,i)=>s.classList.toggle('current',i<step||(step===3&&i===3)));
  }
  function showTip(event,d){
    tooltip.innerHTML='<strong>'+d.name+'</strong><br>体质量：'+Lec.P.formatMass(d.body)+'<br>脑质量：'+Lec.P.formatMass(d.brain)+'<br>'+metricInfo[metric].short+'：'+fmtMetric(d,metric);
    const pointerLike=Number.isFinite(event.clientX)&&Number.isFinite(event.clientY);
    const p=pointerLike?d3.pointer(event,wrap):[x(d.body)/width*wrap.clientWidth,y(d[metric])/height*wrap.clientHeight];
    tooltip.style.left=Math.max(8,Math.min(p[0]+16,wrap.clientWidth-240))+'px';
    tooltip.style.top=Math.max(8,p[1]-76)+'px';
    tooltip.style.opacity='1';
    tooltip.setAttribute('aria-hidden','false');
  }
  function hideTip(){tooltip.style.opacity='0';tooltip.setAttribute('aria-hidden','true')}
  function markWrong(node,msg){
    feedback.textContent=msg;
    node.classList.remove('wrong');
    void node.getBoundingClientRect();
    node.classList.add('wrong');
    setTimeout(()=>node.classList.remove('wrong'),260);
  }
  function addLine(a,b,type){
    const rec={a,b,type}; savedLines.push(rec); drawLines();
  }
  function drawLines(){
    const lines=lineLayer.selectAll('line').data(savedLines,d=>d.type+'-'+d.a.id+'-'+(d.b?d.b.id:'base'));
    lines.join(enter=>enter.append('line').attr('class','compare-line').attr('x1',d=>x(d.a.body)).attr('y1',d=>y(d.a[metric])).attr('x2',d=>x(d.a.body)).attr('y2',d=>y(d.a[metric])).call(sel=>sel.transition().duration(Deck.reduced()?0:300).attr('x2',d=>d.b?x(d.b.body):x(d.a.body)).attr('y2',d=>d.b?y(d.b[metric]):ih)),update=>update.call(sel=>sel.transition().duration(Deck.reduced()?0:450).ease(d3.easeCubicOut).attr('x1',d=>x(d.a.body)).attr('y1',d=>y(d.a[metric])).attr('x2',d=>d.b?x(d.b.body):x(d.a.body)).attr('y2',d=>d.b?y(d.b[metric]):ih)),exit=>exit.remove());
  }
  function correct(d,node){
    locked=[d];
    node.classList.add('locked');
    if(step===0){addLine(d,null,'absolute');step=1;feedback.textContent='绝对量已定位。现在比较体形距离。'}
    else if(step===2){addLine(d,null,'reorder');step=3;feedback.textContent='完成：比较结论随指标改变。';finish()}
    updateTask();renderPoints(false);
  }
  function choose(event,d){
    const node=event.currentTarget;
    if(step===0){
      if(metric!=='brain'||d.id!==maxBrain.id){markWrong(node,'你选的是绝对值差异；请同时检查体质量或切换标准化指标。');locked=[];return}
      correct(d,node);return;
    }
    if(step===1){
      if(!pending.length){pending=[d];locked=[d];feedback.textContent='再选一个点，组成体形最接近的一对。';renderPoints(false);return}
      if(d.id===pending[0].id){pending=[];locked=[];markWrong(node,'请选择另一个物种组成一对。');renderPoints(false);return}
      if(samePair(pending[0],d,closestPair)){
        locked=[pending[0],d];addLine(pending[0],d,'body-pair');pending=[];step=2;feedback.textContent='体形基线已找到。现在切换标准化指标。';updateTask();renderPoints(false);
      }else{
        pending=[];locked=[];markWrong(node,'这对体形还不够接近，请比较横向距离。');renderPoints(false);
      }
      return;
    }
    if(step===2){
      if(metric==='brain'){markWrong(node,'请先切换到脑体比或 EQ，观察重排。');return}
      if(biggestRankChange(metric).has(d.id)){correct(d,node)}
      else markWrong(node,'这个点发生了位移，但不是名次变化最大的点。');
    }
  }
  function finish(){
    supports.forEach(s=>s.classList.add('current'));
    resetBtn.style.display='block';
    clearTimeout(doneTimer);
    doneTimer=setTimeout(()=>{locked=[];renderPoints(false)},2000);
  }
  function renderPoints(animate=true){
    const dots=pointLayer.selectAll('circle').data(data,d=>d.id).join('circle')
      .attr('class',d=>'dot'+(locked.some(e=>e.id===d.id)?' locked':''))
      .attr('r',d=>locked.some(e=>e.id===d.id)?10:7)
      .attr('tabindex',0).attr('role','button')
      .attr('aria-label',d=>d.name+'，'+metricInfo[metric].short+' '+fmtMetric(d,metric))
      .on('pointerenter',showTip).on('pointermove',showTip).on('pointerleave',hideTip)
      .on('focus',function(event,d){showTip(event,d)}).on('blur',hideTip)
      .on('click',choose).on('keydown',function(event,d){if(event.key==='Enter'||event.key===' '){event.preventDefault();choose({currentTarget:this},d)}});
    const labels=pointLayer.selectAll('text').data(data,d=>d.id).join('text').attr('class','point-label').attr('dx',11).attr('dy',-10).text(d=>d.name);
    const duration=animate&&!Deck.reduced()?450:0;
    dots.transition().duration(duration).ease(d3.easeCubicOut).attr('cx',d=>x(d.body)).attr('cy',d=>y(d[metric]));
    labels.transition().duration(duration).ease(d3.easeCubicOut).attr('x',d=>x(d.body)).attr('y',d=>y(d[metric]));
  }
  function setMetric(next,animate=true){
    metric=next;
    buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.metric===metric)));
    const ext=d3.extent(data,d=>d[metric]);
    y.domain([ext[0]*0.82,ext[1]*1.22]).nice();
    const duration=animate&&!Deck.reduced()?450:0;
    gx.transition().duration(duration).ease(d3.easeCubicOut).call(d3.axisBottom(x).ticks(6,'~g'));
    gy.transition().duration(duration).ease(d3.easeCubicOut).call(d3.axisLeft(y).ticks(6,'~g'));
    gridX.transition().duration(duration).call(d3.axisBottom(x).ticks(6).tickSize(-ih).tickFormat(''));
    gridY.transition().duration(duration).call(d3.axisLeft(y).ticks(6).tickSize(-iw).tickFormat(''));
    yLabel.text(metricInfo[metric].label);
    renderPoints(animate);drawLines();
    if(step===2&&metric!=='brain') feedback.textContent='重排已发生：找名次变化最大的物种。';
  }
  buttons.forEach(b=>b.addEventListener('click',()=>setMetric(b.dataset.metric,true)));
  resetBtn.addEventListener('click',()=>{
    clearTimeout(doneTimer);step=0;pending=[];locked=[];savedLines=[];resetBtn.style.display='none';supports.forEach(s=>s.classList.remove('current'));feedback.textContent='先找绝对脑质量最大的点。';setMetric('brain',true);updateTask();
  });

  updateTask();
  setMetric('brain',false);
  if(!Deck.reduced()){
    pointLayer.selectAll('.dot').attr('cy',ih).transition().delay((d,i)=>i*70).duration(420).ease(d3.easeCubicOut).attr('cy',d=>y(d.brain));
  }
})();
</script>
</body>
</html>
