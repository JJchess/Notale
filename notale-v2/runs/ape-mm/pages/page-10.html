<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:28px 42px 26px;gap:14px}
  .kicker{color:var(--primary);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em}
  .round-readout{min-width:180px;text-align:right;color:var(--accent);font:700 var(--fs-lead)/1.4 var(--font-mono)}
  .process-strip{flex:0 0 76px;--process-axis-y:50%;gap:7px}
  .process-strip>.step{justify-content:center;padding:9px 11px;text-align:center;font-size:var(--fs-label);line-height:1.4}
  .process-strip>.arw{flex-basis:18px}
  .ecosystem{position:relative;display:flex;flex:1 1 0;min-height:0;overflow:hidden;border:1px solid var(--line-strong);border-radius:var(--radius-2);background:var(--panel-deep);box-shadow:var(--shadow-panel)}
  .world{position:relative;display:flex;flex:1 1 0;min-width:0;min-height:0;flex-direction:column;overflow:hidden}
  .selection-flow{position:absolute;z-index:1;inset:0;width:100%;height:100%;pointer-events:none}
  .selection-flow .flow{fill:none;stroke:var(--primary-line);stroke-width:2;stroke-dasharray:7 7}
  .selection-flow .favored{fill:none;stroke:var(--accent);stroke-width:4;filter:drop-shadow(0 0 5px var(--accent-line))}
  .selection-flow.light-favored .dark-flow,.selection-flow.dark-favored .light-flow{stroke:var(--line-strong);stroke-width:2;filter:none}
  .generation{position:relative;z-index:2;display:flex;flex:1 1 0;min-height:0;align-items:center;padding:36px 52px 18px 150px;transition:background .35s ease}
  .population{position:relative;z-index:2}
  .generation.top{background:linear-gradient(180deg,var(--surface),var(--panel-deep))}
  .generation.bottom{padding-top:18px;padding-bottom:34px;background:linear-gradient(0deg,var(--surface),var(--panel-deep))}
  .gen-label{position:absolute;left:24px;top:20px;z-index:3;color:var(--muted);font-size:var(--fs-label);font-weight:700;line-height:1.4}
  .gen-label strong{display:block;margin-top:3px;color:var(--text);font:700 var(--fs-lead)/1.35 var(--font-mono)}
  .population{display:grid;width:100%;grid-template-columns:repeat(12,minmax(0,1fr));gap:9px 14px;align-content:center}
  .animal{position:relative;width:25px;height:16px;justify-self:center;border:2px solid var(--line-strong);border-radius:55% 48% 45% 55%;background:var(--animal);box-shadow:0 2px 5px rgba(0,0,0,.35);opacity:1;transform:translateY(0) scale(1);transition:transform .42s cubic-bezier(.2,.75,.25,1),opacity .35s ease,filter .35s ease}
  .animal::before{position:absolute;right:-7px;top:1px;width:9px;height:9px;border:2px solid var(--line-strong);border-radius:50%;background:inherit;content:""}
  .animal::after{position:absolute;left:-8px;top:4px;width:10px;height:6px;border-top:2px solid var(--line-strong);border-radius:50%;content:"";transform:rotate(-18deg)}
  .animal.dark{--animal:var(--panel-raised)}
  .animal.light{--animal:var(--text)}
  .animal.dead{opacity:.16;filter:saturate(0);transform:translateY(42px) scale(.3)}
  .animal.born{animation:birth .5s cubic-bezier(.2,.8,.25,1) both}
  .filter-band{position:relative;z-index:4;display:flex;flex:0 0 58px;align-items:center;justify-content:space-between;padding:0 24px;border-block:1px solid var(--primary-line);background:linear-gradient(90deg,var(--primary-soft),var(--panel),var(--primary-soft))}
  .filter-band::before,.filter-band::after{position:absolute;left:145px;right:30px;height:2px;background:var(--primary);box-shadow:0 0 10px var(--primary);content:"";opacity:.65}
  .filter-band::before{top:-1px}.filter-band::after{bottom:-1px}
  .environment{color:var(--accent);font:750 var(--fs-lead)/1.35 var(--font-title)}
  .probability{color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
  .rounds{position:relative;z-index:5;display:flex;flex:0 0 300px;min-width:0;flex-direction:column;padding:20px;border-left:1px solid var(--line);background:rgba(9,22,32,.94)}
  .rounds h2{margin-bottom:9px}
  .round-node{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;min-height:62px;color:var(--faint)}
  .round-node .dot{display:grid;width:25px;height:25px;place-items:center;border:2px solid var(--line-strong);border-radius:50%;background:var(--panel-deep);font:700 var(--fs-tick)/1 var(--font-mono)}
  .round-node.current .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 13px var(--accent-line)}
  .round-node.past .dot{border-color:var(--primary);color:var(--primary)}
  .round-node .env{font-size:var(--fs-label);font-weight:700;line-height:1.35}
  .round-node .ratio{font:650 var(--fs-sec)/1.4 var(--font-mono);color:var(--muted)}
  .round-rail{position:absolute;top:69px;bottom:194px;left:32px;width:2px;background:var(--primary-line)}
  .trace{width:100%;height:142px;margin-top:auto;overflow:visible;border-top:1px solid var(--line);padding-top:10px}
  .trace text{font-family:var(--font-sans);font-size:14px;fill:var(--muted)}
  .trace .guide{stroke:var(--line-strong);stroke-width:1}.trace .deep{fill:none;stroke:var(--primary);stroke-width:3}.trace .pale{fill:none;stroke:var(--text);stroke-width:3}.trace .turn{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}
  .controls{display:flex;flex:0 0 112px;min-height:0;align-items:center;gap:22px;padding:14px 20px;border:1px solid var(--line);border-radius:var(--radius-2);background:var(--panel)}
  .prompt{flex:0 0 250px}.prompt strong{display:block;font-size:var(--fs-lead);line-height:1.35}.prompt span{color:var(--muted);font-size:var(--fs-sec);line-height:1.5}
  .choice{min-height:44px!important;padding:8px 18px!important;font-size:var(--fs-sec)!important}
  .choice.correct{border-color:var(--accent)!important;color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 16px var(--accent-line)}
  .choice.wrong{animation:shake .28s ease}
  .run{min-width:132px;border-color:var(--primary)!important;color:var(--primary)!important}
  .feedback{flex:1 1 0;min-width:0;color:var(--text);font-size:var(--fs-sec);line-height:1.5}
  .feedback.good{color:var(--accent)}
  .reset{margin-left:auto}
  button:disabled{cursor:not-allowed!important;opacity:.45}
  @keyframes birth{from{opacity:0;transform:translateY(-34px) scale(.35)}to{opacity:1;transform:none}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}70%{transform:translateX(7px)}}
  @media(prefers-reduced-motion:reduce){.animal,.generation{transition:none}.animal.born,.choice.wrong{animation:none}}
</style>
</head>
<body data-page="10" data-total="50">
<div id="stage">
  <header class="row items-end justify-between" style="height:76px">
    <div>
      <div class="kicker">SELECTION / NO GOAL</div>
      <h1>群体变了，不是个体升级</h1>
    </div>
    <div id="roundReadout" class="round-readout" aria-live="polite"></div>
  </header>

  <section id="process" class="k-process process-strip" aria-label="自然选择的六步过程">
    <div class="axis" aria-hidden="true"></div>
    <div class="step current">群体差异</div><div class="arw" aria-hidden="true"></div>
    <div class="step">环境条件</div><div class="arw" aria-hidden="true"></div>
    <div class="step">差异存活</div><div class="arw" aria-hidden="true"></div>
    <div class="step">繁殖</div><div class="arw" aria-hidden="true"></div>
    <div class="step">特征继承</div><div class="arw" aria-hidden="true"></div>
    <div class="step">下一代比例</div>
  </section>

  <main class="ecosystem min0" style="flex:1">
    <section class="world min0" aria-label="明暗毛色群体模拟">
      <svg id="selectionFlow" class="selection-flow dark-favored" viewBox="0 0 900 500" preserveAspectRatio="none" aria-hidden="true">
        <defs><marker id="flowArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/></marker></defs>
        <path class="flow favored dark-flow" d="M180 95 C250 145 300 165 390 250 C480 335 550 350 700 410" marker-end="url(#flowArrow)"/>
        <path class="flow favored light-flow" d="M700 95 C620 145 570 170 500 250 C430 330 350 360 190 410" marker-end="url(#flowArrow)"/>
      </svg>
      <div id="currentGen" class="generation top min0">
        <div class="gen-label">繁殖前群体<strong id="beforeRatio"></strong></div>
        <div id="currentPop" class="population" aria-hidden="true"></div>
      </div>
      <div class="filter-band">
        <div id="environment" class="environment"></div>
        <div id="probability" class="probability"></div>
      </div>
      <div id="nextGen" class="generation bottom min0">
        <div class="gen-label">下一代<strong id="afterRatio"></strong></div>
        <div id="nextPop" class="population" aria-hidden="true"></div>
      </div>
    </section>

    <aside class="rounds" aria-label="四轮比例记录">
      <h2>代际记录</h2>
      <div class="round-rail" aria-hidden="true"></div>
      <div id="roundNodes"></div>
      <svg id="trace" class="trace" viewBox="0 0 250 132" role="img" aria-label="四轮深色与浅色比例轨迹"></svg>
    </aside>
  </main>

  <section class="controls ctl" aria-label="本轮预测与运行" style="height:112px">
    <div class="prompt"><strong>先预测哪种毛色会增加</strong><span>看当前地表，再判断存活与繁殖。</span></div>
    <button id="pickDark" class="choice" type="button" aria-pressed="false">深色增加</button>
    <button id="pickLight" class="choice" type="button" aria-pressed="false">浅色增加</button>
    <button id="run" class="run" type="button" disabled>运行一代</button>
    <div id="feedback" class="feedback" aria-live="polite">自然选择发生在一代代繁殖造成的群体比例变化中。个体不会在一轮内主动改变毛色。</div>
    <button id="reset" class="reset" type="button">以同一种子重置</button>
  </section>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
(() => {
  'use strict';
  Deck.init({index:10,total:50});
  const CFG={population:48,rounds:['dark','dark','light','light'],survival:{dark:{dark:.78,light:.32},light:{dark:.32,light:.78}},mutation:.02,offspring:48,seed:'page-10'};
  const $=id=>document.getElementById(id);
  const els={round:$('roundReadout'),flow:$('selectionFlow'),process:[...document.querySelectorAll('#process .step')],current:$('currentPop'),next:$('nextPop'),currentGen:$('currentGen'),nextGen:$('nextGen'),before:$('beforeRatio'),after:$('afterRatio'),env:$('environment'),prob:$('probability'),nodes:$('roundNodes'),trace:$('trace'),feedback:$('feedback'),dark:$('pickDark'),light:$('pickLight'),run:$('run'),reset:$('reset')};
  const wait=ms=>Deck.reduced()?Promise.resolve():new Promise(resolve=>setTimeout(resolve,ms));
  let state;

  function initialState(){
    Math.seedrandom(CFG.seed);
    const pop=Array.from({length:CFG.population},(_,i)=>i<CFG.population/2?'dark':'light');
    for(let i=pop.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pop[i],pop[j]]=[pop[j],pop[i]];}
    return {round:0,pop,prediction:null,busy:false,correct:0,history:[]};
  }
  function count(pop,color){return pop.reduce((n,c)=>n+(c===color),0);}
  function ratioText(pop){return `深 ${Lec.P.formatPercent(count(pop,'dark')/pop.length,0)} · 浅 ${Lec.P.formatPercent(count(pop,'light')/pop.length,0)}`;}
  function envName(env){return env==='dark'?'暗色地表':'亮色地表';}
  function advantage(env){return env;}
  function animal(color, born=false, i=0){
    const el=document.createElement('span');el.className=`animal ${color}${born?' born':''}`;
    if(born) el.style.animationDelay=`${(i%12)*18}ms`;
    return el;
  }
  function drawPopulation(container,pop,born=false){container.replaceChildren(...pop.map((c,i)=>animal(c,born,i)));}
  function stepOn(index){els.process.forEach((el,i)=>{el.classList.toggle('past',i<index);el.classList.toggle('current',i===index);});}
  function surface(){
    const env=CFG.rounds[Math.min(state.round,CFG.rounds.length-1)];
    const shade=env==='dark'?'var(--panel-deep)':'var(--line-strong)';
    els.currentGen.style.setProperty('--surface',shade);els.nextGen.style.setProperty('--surface',shade);
    els.flow.className.baseVal=`selection-flow ${env}-favored`;
    els.env.textContent=`本轮环境：${envName(env)}`;
    els.prob.textContent=`存活机会　深 ${Lec.P.formatPercent(CFG.survival[env].dark,0)} · 浅 ${Lec.P.formatPercent(CFG.survival[env].light,0)}　后代毛色翻转 ${Lec.P.formatPercent(CFG.mutation,0)}`;
  }
  function drawNodes(){
    els.nodes.replaceChildren(...CFG.rounds.map((env,i)=>{
      const node=document.createElement('div');
      node.className=`round-node ${i<state.round?'past':i===state.round&&state.round<CFG.rounds.length?'current':''}`;
      const rec=state.history[i];
      const dot=document.createElement('span');dot.className='dot';dot.textContent=String(i+1);
      const info=document.createElement('div');
      const e=document.createElement('div');e.className='env';e.textContent=envName(env);
      const r=document.createElement('div');r.className='ratio';r.textContent=rec?ratioText(rec.pop):'等待运行';
      info.append(e,r);node.append(dot,info);return node;
    }));
  }
  function drawTrace(){
    const ns='http://www.w3.org/2000/svg';els.trace.replaceChildren();
    const label=document.createElementNS(ns,'text');label.setAttribute('x','4');label.setAttribute('y','16');label.textContent='深色比例';els.trace.append(label);
    const guide=document.createElementNS(ns,'line');guide.setAttribute('x1','12');guide.setAttribute('x2','238');guide.setAttribute('y1','68');guide.setAttribute('y2','68');guide.setAttribute('class','guide');els.trace.append(guide);
    const turn=document.createElementNS(ns,'line');turn.setAttribute('x1','125');turn.setAttribute('x2','125');turn.setAttribute('y1','24');turn.setAttribute('y2','118');turn.setAttribute('class','turn');els.trace.append(turn);
    const t=document.createElementNS(ns,'text');t.setAttribute('x','132');t.setAttribute('y','116');t.textContent='环境反转';els.trace.append(t);
    if(!state.history.length)return;
    const points=state.history.map((h,i)=>`${26+i*64},${108-80*count(h.pop,'dark')/h.pop.length}`).join(' ');
    const line=document.createElementNS(ns,'polyline');line.setAttribute('points',points);line.setAttribute('class','deep');els.trace.append(line);
    state.history.forEach((h,i)=>{const c=document.createElementNS(ns,'circle');c.setAttribute('cx',String(26+i*64));c.setAttribute('cy',String(108-80*count(h.pop,'dark')/h.pop.length));c.setAttribute('r','4');c.setAttribute('fill','var(--accent)');els.trace.append(c);});
  }
  function render(){
    const done=state.round>=CFG.rounds.length;
    els.round.textContent=done?'四轮完成':`第 ${state.round+1} / ${CFG.rounds.length} 轮`;
    els.before.textContent=ratioText(state.pop);els.after.textContent=done?'见代际记录':'等待繁殖';
    drawPopulation(els.current,state.pop);els.next.replaceChildren();surface();drawNodes();drawTrace();
    [els.dark,els.light].forEach(b=>{b.disabled=done;b.classList.remove('correct','wrong');b.setAttribute('aria-pressed','false');});
    els.run.disabled=true;els.run.textContent=done?'模拟完成':'运行一代';
    if(done){
      els.feedback.className='feedback good';
      els.feedback.textContent=state.correct>=3?'你追踪到了选择方向：有利特征随环境改变。':'再跑一次，先看环境再判断。';
      stepOn(5);
    }else{els.feedback.className='feedback';stepOn(0);}
  }
  function predict(color){
    if(state.busy||state.round>=CFG.rounds.length)return;
    state.prediction=color;
    const target=advantage(CFG.rounds[state.round]);const chosen=color==='dark'?els.dark:els.light;
    [els.dark,els.light].forEach(b=>{b.classList.remove('correct','wrong');b.setAttribute('aria-pressed','false');});
    chosen.setAttribute('aria-pressed','true');
    if(color===target){chosen.classList.add('correct');els.feedback.className='feedback good';els.feedback.textContent='概率判断正确：这种毛色在当前环境中更易存活并繁殖。';}
    else{void chosen.offsetWidth;chosen.classList.add('wrong');els.feedback.className='feedback';els.feedback.textContent='方向反了：比较哪种毛色在当前地表上更显眼。';}
    els.run.disabled=false;stepOn(1);
  }
  async function runRound(){
    if(state.busy||!state.prediction||state.round>=CFG.rounds.length)return;
    state.busy=true;els.run.disabled=true;els.dark.disabled=true;els.light.disabled=true;
    const env=CFG.rounds[state.round], old=state.pop.slice();stepOn(2);
    const survivors=old.map((color,i)=>Math.random()<CFG.survival[env][color]?i:-1).filter(i=>i>=0);
    if(!survivors.length)survivors.push(Math.floor(Math.random()*old.length));
    [...els.current.children].forEach((el,i)=>{if(!survivors.includes(i))el.classList.add('dead');});
    els.feedback.className='feedback';els.feedback.textContent=`本轮有 ${survivors.length} 个体进入繁殖；死亡个体不留下后代。`;
    await wait(520);stepOn(3);
    const offspring=[];
    while(offspring.length<CFG.offspring){
      let color=old[survivors[Math.floor(Math.random()*survivors.length)]];
      if(Math.random()<CFG.mutation)color=color==='dark'?'light':'dark';
      offspring.push(color);
    }
    drawPopulation(els.next,offspring,true);els.after.textContent=ratioText(offspring);stepOn(4);
    await wait(620);stepOn(5);
    if(state.prediction===advantage(env))state.correct++;
    state.history.push({env,pop:offspring.slice()});state.pop=offspring;state.round++;state.prediction=null;state.busy=false;
    drawNodes();drawTrace();
    els.feedback.className='feedback good';
    els.feedback.textContent='个体毛色未被主动改造；改变的是下一代中的比例。';
    await wait(430);render();
  }
  function reset(){state=initialState();render();els.feedback.className='feedback';els.feedback.textContent='自然选择发生在一代代繁殖造成的群体比例变化中。个体不会在一轮内主动改变毛色。';}
  els.dark.addEventListener('click',()=>predict('dark'));els.light.addEventListener('click',()=>predict('light'));els.run.addEventListener('click',runRound);els.reset.addEventListener('click',reset);
  reset();
})();
</script>
</body>
</html>
