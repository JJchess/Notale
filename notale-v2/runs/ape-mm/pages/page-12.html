<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root {
    --container-max: 1120px;
    --container-pad: 56px;
    --corner-size: 6px;
  }

  #stage { position: relative; }

  .scene {
    position: relative;
    isolation: isolate;
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .container-lines::before,
  .container-lines::after {
    position: absolute;
    z-index: -1;
    top: 0;
    bottom: 0;
    width: 1px;
    content: "";
    background: var(--line);
    opacity: .72;
    pointer-events: none;
  }
  .container-lines::before { left: calc(50% - (var(--container-max) / 2)); }
  .container-lines::after { right: calc(50% - (var(--container-max) / 2)); }

  .content-container {
    position: relative;
    width: var(--container-max);
    height: 100%;
    margin-inline: auto;
    padding-inline: var(--container-pad);
  }

  .corner {
    position: absolute;
    z-index: 4;
    width: var(--corner-size);
    height: var(--corner-size);
    background: var(--line-strong);
    pointer-events: none;
  }
  .corner.top-left { top: 54px; left: 0; transform: translate(-50%, -50%); }
  .corner.top-right { top: 54px; right: 0; transform: translate(50%, -50%); }
  .corner.bottom-left { bottom: 62px; left: 0; transform: translate(-50%, 50%); }
  .corner.bottom-right { right: 0; bottom: 62px; transform: translate(50%, 50%); }

  .heading {
    position: relative;
    z-index: 3;
    padding-top: 54px;
  }
  .kicker {
    margin: 0 0 14px;
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .16em;
    line-height: 1.4;
  }
  .heading h1 {
    max-width: 920px;
    font-size: 88px;
    line-height: .92;
    letter-spacing: -.025em;
  }
  .heading .lead {
    max-width: 780px;
    margin: 22px 0 0;
    color: var(--muted);
    font-size: 22px;
    line-height: 1.5;
  }

  .carrier-field {
    position: relative;
    z-index: 2;
    height: 500px;
    margin-top: 18px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background:
      linear-gradient(90deg, var(--primary-soft), transparent 28%, transparent 72%, var(--accent-soft)),
      var(--panel-deep);
  }
  .field-question {
    position: absolute;
    top: 12px;
    left: 0;
    margin: 0;
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    line-height: 1.4;
  }
  .field-note {
    position: absolute;
    top: 14px;
    right: 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.4;
  }
  .carrier-caption {
    position: absolute;
    top: 50px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 650;
    letter-spacing: .08em;
    line-height: 1.4;
  }
  .carrier-caption.old { left: 0; }
  .carrier-caption.new { right: 0; color: var(--accent); }

  .footprint {
    position: absolute;
    top: 95px;
    left: -34px;
    width: 88px;
    height: 146px;
    opacity: .48;
    transform: rotate(-16deg);
    animation: footprint-in 700ms ease-out both;
  }
  .footprint .sole {
    position: absolute;
    right: 8px;
    bottom: 0;
    width: 55px;
    height: 108px;
    border: 2px solid var(--primary-line);
    border-radius: 48% 46% 42% 44%;
    background: var(--primary-soft);
  }
  .footprint .toe {
    position: absolute;
    border: 2px solid var(--primary-line);
    border-radius: 50%;
    background: var(--primary-soft);
  }
  .footprint .t1 { top: 2px; left: 7px; width: 25px; height: 31px; }
  .footprint .t2 { top: 0; left: 35px; width: 20px; height: 25px; }
  .footprint .t3 { top: 7px; left: 58px; width: 17px; height: 21px; }
  .footprint .t4 { top: 19px; left: 75px; width: 14px; height: 17px; }

  .diagram-svg {
    position: absolute;
    inset: 0;
    z-index: 0;
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .diagram-svg .lane {
    fill: var(--panel);
    stroke: var(--line);
    stroke-width: 1;
  }
  .diagram-svg .trunk {
    fill: none;
    stroke: var(--primary);
    stroke-width: 3;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    filter: drop-shadow(0 0 7px var(--primary-line));
    animation: route-draw 900ms 380ms cubic-bezier(.22,.72,.24,1) forwards;
  }
  .diagram-svg .connector {
    fill: none;
    stroke: var(--primary-line);
    stroke-width: 1;
    stroke-dasharray: 5 7;
  }
  .diagram-svg .arrow {
    fill: none;
    stroke: var(--primary);
    stroke-width: 2;
  }

  .k-enumeration.relay {
    --enum-cols: 3;
    position: absolute;
    top: 104px;
    right: 0;
    left: 270px;
    height: 182px;
    gap: clamp(32px, 6vw, 88px);
    overflow: visible;
  }
  .k-enumeration.relay > .it {
    position: relative;
    justify-content: flex-end;
    padding: 0 0 10px;
    border: 0;
    border-radius: 0;
    background: transparent;
  }
  .k-enumeration.relay > .it::before {
    position: absolute;
    top: 66px;
    left: 50%;
    width: 18px;
    height: 18px;
    border: 3px solid var(--accent);
    border-radius: 50%;
    content: "";
    background: var(--bg);
    box-shadow: 0 0 0 7px var(--accent-soft), 0 0 20px var(--accent-line);
    opacity: 0;
    transform: translate(-50%, -50%) scale(.35);
    animation: node-light 420ms cubic-bezier(.2,.8,.3,1.25) forwards;
  }
  .k-enumeration.relay > .it:nth-child(1)::before { animation-delay: 1120ms; }
  .k-enumeration.relay > .it:nth-child(2)::before { animation-delay: 1240ms; }
  .k-enumeration.relay > .it:nth-child(3)::before { animation-delay: 1360ms; }
  .node-code {
    position: absolute;
    top: 14px;
    left: 50%;
    color: var(--faint);
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.4;
    transform: translateX(-50%);
  }
  .k-enumeration.relay > .it > .title {
    color: var(--accent);
    font-size: 22px;
    text-align: center;
  }
  .k-enumeration.relay > .it > .content {
    min-height: 48px;
    color: var(--text);
    font-size: 18px;
    line-height: 1.45;
    text-align: center;
  }

  .claim {
    position: absolute;
    z-index: 3;
    right: 56px;
    bottom: 55px;
    left: 56px;
    display: flex;
    gap: 22px;
    align-items: baseline;
    padding: 20px 24px;
    border-left: 3px solid var(--accent);
    background: linear-gradient(90deg, var(--accent-soft), transparent 78%);
    opacity: 0;
    transform: translateY(12px);
    animation: claim-in 560ms 1580ms ease-out forwards;
  }
  .claim .label {
    flex: 0 0 auto;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 15px;
    letter-spacing: .1em;
  }
  .claim p {
    margin: 0;
    color: var(--text);
    font-size: 20px;
    font-weight: 650;
    line-height: 1.5;
  }

  .strata-band {
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 0;
    height: 118px;
    border-top: 1px solid var(--line);
    opacity: .65;
  }
  .strata-label {
    position: absolute;
    bottom: 16px;
    color: var(--faint);
    font-family: var(--font-mono);
    font-size: 14px;
    letter-spacing: .06em;
    line-height: 1.4;
  }
  .strata-label.left { left: calc(50% - 504px); }
  .strata-label.right { right: calc(50% - 504px); }

  .earth-edge {
    position: absolute;
    z-index: 1;
    right: 0;
    bottom: 0;
    width: 168px;
    height: 520px;
    overflow: hidden;
    pointer-events: none;
  }
  .earth-edge::after {
    position: absolute;
    top: 10px;
    right: 0;
    width: 136px;
    height: 498px;
    border: 2px solid var(--primary-line);
    border-right: 0;
    border-radius: 100% 0 0 100%;
    content: "";
    box-shadow: -8px 0 26px var(--primary-soft), inset 10px 0 28px var(--primary-soft);
  }

  @keyframes footprint-in {
    from { opacity: 0; transform: translateY(22px) rotate(-16deg); }
    to { opacity: .48; transform: translateY(0) rotate(-16deg); }
  }
  @keyframes route-draw { to { stroke-dashoffset: 0; } }
  @keyframes node-light { to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  @keyframes claim-in { to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .footprint, .diagram-svg .trunk, .k-enumeration.relay > .it::before, .claim {
      animation: none;
      opacity: 1;
      transform: none;
    }
    .footprint { opacity: .48; transform: rotate(-16deg); }
    .diagram-svg .trunk { stroke-dashoffset: 0; }
    .k-enumeration.relay > .it::before { transform: translate(-50%, -50%); }
  }
</style>
</head>
<body data-page="12" data-total="50">
<div id="stage">
  <main class="scene container-lines min0">
    <div class="strata-band strata" aria-hidden="true"></div>
    <div class="earth-edge" aria-hidden="true"></div>

    <div class="content-container corner-squares">
      <span class="corner top-left" aria-hidden="true"></span>
      <span class="corner top-right" aria-hidden="true"></span>
      <span class="corner bottom-left" aria-hidden="true"></span>
      <span class="corner bottom-right" aria-hidden="true"></span>

      <header class="heading">
        <p class="kicker">ACT II · CULTURE</p>
        <h1>速度换了载体</h1>
        <p class="lead">身体变化很慢，知识传递开始改变速度。</p>
      </header>

      <section class="carrier-field" aria-label="成果在身体之外保存、传递与接续">
        <p class="field-question">成果为何不必随个体消失？</p>
        <span class="field-note">三个并列条件</span>
        <span class="carrier-caption old">身体留下改变</span>
        <span class="carrier-caption new">可传承知识</span>
        <div class="footprint" aria-hidden="true">
          <span class="sole"></span><span class="toe t1"></span><span class="toe t2"></span><span class="toe t3"></span><span class="toe t4"></span>
        </div>
        <svg class="diagram-svg" viewBox="0 0 1008 350" preserveAspectRatio="none" aria-hidden="true">
          <rect class="lane" x="270" y="70" width="188" height="232" rx="6"></rect>
          <rect class="lane" x="546" y="70" width="188" height="232" rx="6"></rect>
          <rect class="lane" x="820" y="70" width="188" height="232" rx="6"></rect>
          <path class="connector" d="M364 177V286 M640 177V286 M914 177V286"></path>
          <path class="trunk" d="M40 177H996"></path>
          <path class="arrow" d="M986 168L996 177L986 186"></path>
        </svg>

        <div class="k-enumeration relay" aria-label="知识接力的三个并列条件">
          <article class="it min0">
            <span class="node-code">A</span>
            <h2 class="title">保存</h2>
            <p class="content">成果可以留在身体之外</p>
          </article>
          <article class="it min0">
            <span class="node-code">B</span>
            <h2 class="title">传递</h2>
            <p class="content">别人可以重建动作与做法</p>
          </article>
          <article class="it min0">
            <span class="node-code">C</span>
            <h2 class="title">接续</h2>
            <p class="content">后来者可以从已有成果继续</p>
          </article>
        </div>
      </section>

      <aside class="claim" aria-label="本页结论">
        <span class="label">转折</span>
        <p>一旦成果能够保存、传递并被后来者接续，改变速度的就不再只有身体。</p>
      </aside>
    </div>

    <span class="strata-label left">身体尺度</span>
    <span class="strata-label right">个体寿命之外</span>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({ index: 12, total: 50 });</script>
</body>
</html>
