<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage { padding: 34px 52px 30px; }
  .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:var(--sp-5); }
  .kicker { color:var(--primary); font:700 var(--fs-label)/1.4 var(--font-mono); letter-spacing:.14em; }
  .take { max-width:720px; margin:0; color:var(--muted); font-size:var(--fs-lead); line-height:1.5; text-align:right; }
  .game-shell { position:relative; display:flex; flex-direction:column; min-height:0; overflow:hidden; border:1px solid var(--line-strong); border-radius:var(--radius-3); background:radial-gradient(circle at 96% 132%,transparent 0,330px,var(--primary-line) 332px,transparent 335px),var(--panel-deep); box-shadow:var(--shadow-panel); }
  .game-shell::before { position:absolute; inset:0; content:""; pointer-events:none; background:repeating-linear-gradient(0deg,transparent 0,transparent 54px,rgba(89,195,195,.055) 55px,transparent 57px); }
  .viz-wrap { position:relative; z-index:1; flex:1; min-height:0; }
  #budget-viz { display:block; width:100%; height:100%; }
  #budget-viz text { font-family:var(--font-sans); fill:var(--text); }
  #budget-viz .mono { font-family:var(--font-mono); font-size:18px; font-weight:700; }
  #budget-viz .axis-label { fill:var(--muted); font-size:14px; }
  #budget-viz .section-label { font-family:var(--font-title); font-size:20px; font-weight:700; }
  #budget-viz .tick text { fill:var(--faint); font-family:var(--font-mono); font-size:13px; }
  #budget-viz .tick line, #budget-viz .domain { stroke:var(--line-strong); }
  #budget-viz .row-guide { stroke:var(--line); stroke-width:1; }
  #budget-viz .raw-fill { fill:var(--primary); }
  #budget-viz .raw-soft { fill:var(--primary); fill-opacity:.46; }
  #budget-viz .cooked-fill { fill:var(--accent); }
  #budget-viz .cooked-soft { fill:var(--accent); fill-opacity:.54; }
  #budget-viz .stone { fill:var(--panel-raised); stroke:var(--line-strong); stroke-width:2; }
  #budget-viz .plate-raw { fill:var(--primary-soft); stroke:var(--primary); stroke-width:3; }
  #budget-viz .plate-cooked { fill:var(--accent-soft); stroke:var(--accent); stroke-width:3; }
  #budget-viz .token { cursor:grab; outline:none; }
  #budget-viz .token:focus .token-ring { stroke:var(--focus); stroke-width:5; }
  #budget-viz .token:active { cursor:grabbing; }
  #budget-viz .slot { fill:var(--bg); stroke:var(--line-strong); stroke-width:2; }
  #budget-viz .slot.assigned-raw { fill:var(--primary); stroke:var(--primary); }
  #budget-viz .slot.assigned-cooked { fill:var(--accent); stroke:var(--accent); }
  #budget-viz .k-comparison, #budget-viz .k-comparison > .hdr, #budget-viz .k-comparison > .dim, #budget-viz .k-comparison > .cell { display:block; padding:0; border:0; }
  #budget-viz .token-ring { fill:var(--panel-raised); stroke:var(--accent-line); stroke-width:3; }
  #budget-viz .token-mark { fill:none; stroke:var(--accent); stroke-width:3; stroke-linecap:round; }
  #budget-viz .delta { stroke:var(--accent); stroke-width:2; stroke-dasharray:6 5; opacity:0; }
  #budget-viz .delta.on { opacity:1; }
  .game-bar { position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:var(--sp-4); min-height:66px; padding:10px 22px; border-top:1px solid var(--line); background:rgba(9,22,32,.96); }
  .status { margin:0; color:var(--text); font-size:var(--fs-sec); line-height:1.5; }
  .status strong { color:var(--accent); font-family:var(--font-mono); }
  .hint { color:var(--muted); font-size:var(--fs-label); }
  .ctl button { font-size:var(--fs-sec); }
  .completion { display:none; align-items:baseline; gap:var(--sp-3); min-width:0; padding:8px 14px; border:1px solid var(--accent-line); border-radius:var(--radius-1); background:var(--panel-raised); }
  .completion.show { display:flex; }
  .completion strong { color:var(--accent); font-size:var(--fs-sec); white-space:nowrap; }
  .completion span { color:var(--muted); font-size:var(--fs-sec); white-space:nowrap; }
  .boundary { display:flex; align-items:center; justify-content:space-between; gap:var(--sp-5); }
  .boundary p { margin:0; }
  .conclusion { max-width:980px; color:var(--text); font-size:var(--fs-sec); line-height:1.5; }
  .model-note { flex:0 0 auto; color:var(--muted); font-size:var(--fs-sec); }
  @keyframes rimPulse { 50% { filter:drop-shadow(0 0 12px currentColor); } }
  .pulse { animation:rimPulse 300ms ease-out; }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
</style>
</head>
<body data-page="15" data-total="50">
<div id="stage">
  <header class="page-head shrink0" style="height:84px">
    <div>
      <div class="kicker">CULTURAL ENERGY · 15</div>
      <h1>熟，不只是更软</h1>
    </div>
    <p class="take">烹饪改变获得能量所需的咀嚼与消化时间</p>
  </header>

  <main class="game-shell min0 strata" style="flex:1">
    <div class="viz-wrap min0 no-pan">
      <svg id="budget-viz" viewBox="0 0 1200 620" role="img" aria-labelledby="viz-title viz-desc">
        <title id="viz-title">生食与熟食的时间—能量预算分配台</title>
        <desc id="viz-desc">把当前食物筹码拖到生食盘或熟食盘。三行共同量尺同步比较咀嚼负担、消化负担和可利用能量。</desc>
      </svg>
    </div>
    <div class="game-bar">
      <p id="status" class="status" aria-live="polite"></p>
      <div id="complete-card" class="completion" aria-live="polite">
        <strong>处理方式改变时间—能量预算</strong>
        <span>三条量尺来自同一组食物分配。</span>
      </div>
      <span class="hint">拖动筹码；键盘用 ← / → 选择，Enter 放入</span>
      <div class="ctl"><button id="reset" type="button">重新分配</button></div>
    </div>
  </main>

  <footer class="boundary shrink0" style="height:82px">
    <p class="conclusion"><strong>烹饪没有让身体瞬间“升级”</strong>；它通过食物处理，重新分配了获得能量所需的时间与消化负担。</p>
    <p class="model-note">模型指数，不是人体测量值</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function () {
  'use strict';
  Deck.init({ index: 15, total: 50 });

  var MODEL = Object.freeze({
    portions: 8,
    raw: Object.freeze({ chew: 2, digest: 2, energy: 2 }),
    cooked: Object.freeze({ chew: 0.8, digest: 1.2, energy: 3 })
  });
  var rows = [
    { key:'chew', label:'咀嚼时间负担', max:32, note:'更少咀嚼处理' },
    { key:'digest', label:'消化处理负担', max:32, note:'负担随处理改变' },
    { key:'energy', label:'可利用能量指数', max:24, note:'可利用量提高' }
  ];
  var state;
  var svg = d3.select('#budget-viz');
  var reduced = Deck.reduced();
  var duration = reduced ? 0 : 350;
  var plateY = 122, leftPlateX = 190, rightPlateX = 1010;
  var home = { x:600, y:117 };
  var selectedSide = 'raw';
  var fmt = d3.format('.1f');

  function freshState() { return { raw:0, cooked:0, assigned:0, locked:false, trace:[] }; }
  function metrics() {
    var out = {};
    rows.forEach(function (r) {
      out[r.key] = {
        raw: MODEL.raw[r.key] * state.raw,
        cooked: MODEL.cooked[r.key] * state.cooked
      };
    });
    return out;
  }
  function dispatch(name, detail) {
    document.getElementById('stage').dispatchEvent(new CustomEvent(name, { bubbles:true, detail:detail }));
  }

  function build() {
    var g = svg.append('g').attr('class','scene');
    g.append('line').attr('x1',54).attr('x2',1146).attr('y1',42).attr('y2',42).attr('class','row-guide');
    g.append('text').attr('x',54).attr('y',27).attr('class','axis-label').text('同一批食物 · 两种处理状态');

    var plateData = [
      { side:'raw', x:leftPlateX, cls:'plate-raw', label:'生食盘' },
      { side:'cooked', x:rightPlateX, cls:'plate-cooked', label:'熟食盘' }
    ];
    var plates = g.selectAll('.plate-group').data(plateData).join('g').attr('class','plate-group');
    plates.append('ellipse').attr('cx',function(d){return d.x;}).attr('cy',plateY).attr('rx',112).attr('ry',48).attr('class',function(d){return d.cls;});
    plates.append('text').attr('x',function(d){return d.x;}).attr('y',plateY+7).attr('text-anchor','middle').attr('class','section-label').text(function(d){return d.label;});
    plates.append('text').attr('x',function(d){return d.x;}).attr('y',plateY+76).attr('text-anchor','middle').attr('class','axis-label plate-count');

    g.append('rect').attr('x',410).attr('y',63).attr('width',380).attr('height',112).attr('rx',14).attr('class','stone');
    g.append('text').attr('x',600).attr('y',90).attr('text-anchor','middle').attr('class','axis-label').text('当前一份');

    var slotX = d3.scalePoint().domain(d3.range(MODEL.portions)).range([455,745]);
    g.selectAll('.slot').data(d3.range(MODEL.portions)).join('circle')
      .attr('class','slot').attr('cx',function(d){return slotX(d);}).attr('cy',151).attr('r',13);

    var token = g.append('g').attr('class','token').attr('role','button').attr('tabindex',0)
      .attr('aria-label','当前食物筹码，可拖到生食盘或熟食盘')
      .attr('transform','translate('+home.x+','+home.y+')');
    token.append('circle').attr('r',25).attr('class','token-ring');
    token.append('path').attr('d','M-10,-5 Q0,-17 10,-5 M-12,3 Q0,15 12,3').attr('class','token-mark');

    var drag = d3.drag().container(svg.node())
      .on('start', function () { if (!state.locked) d3.select(this).raise().attr('aria-grabbed','true'); })
      .on('drag', function (event) { if (!state.locked) d3.select(this).attr('transform','translate('+event.x+','+event.y+')'); })
      .on('end', function (event) {
        d3.select(this).attr('aria-grabbed','false');
        if (state.locked) return;
        var side = nearestPlate(event.x, event.y);
        if (side) assign(side); else invalidDrop();
      });
    token.call(drag).on('keydown', function (event) {
      if (state.locked) return;
      if (event.key === 'ArrowLeft') { event.preventDefault(); selectedSide='raw'; previewChoice(); }
      if (event.key === 'ArrowRight') { event.preventDefault(); selectedSide='cooked'; previewChoice(); }
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); assign(selectedSide); }
    });

    var matrix = g.append('g').attr('class','k-comparison').attr('transform','translate(54,214)');
    matrix.append('rect').attr('width',1092).attr('height',370).attr('rx',12).attr('fill','var(--panel)').attr('stroke','var(--line)');
    matrix.append('text').attr('x',180).attr('y',40).attr('text-anchor','end').attr('class','hdr axis-label').text('比较维度');
    matrix.append('text').attr('x',482).attr('y',40).attr('text-anchor','middle').attr('class','hdr section-label raw-label').text('生食');
    matrix.append('text').attr('x',870).attr('y',40).attr('text-anchor','middle').attr('class','hdr section-label cooked-label').text('熟食');
    matrix.append('line').attr('x1',205).attr('x2',205).attr('y1',0).attr('y2',370).attr('class','row-guide');
    matrix.append('line').attr('x1',674).attr('x2',674).attr('y1',0).attr('y2',370).attr('class','row-guide');
    matrix.append('line').attr('x1',0).attr('x2',1092).attr('y1',58).attr('y2',58).attr('class','row-guide');

    rows.forEach(function (r, i) {
      var y = 68 + i * 99;
      var scale = d3.scaleLinear().domain([0,r.max]).range([0,260]);
      r.scale = scale;
      matrix.append('text').attr('x',180).attr('y',y+31).attr('text-anchor','end').attr('class','dim axis-label').text(r.label);
      matrix.append('line').attr('x1',0).attr('x2',1092).attr('y1',y+89).attr('y2',y+89).attr('class','rowline row-guide');
      ['raw','cooked'].forEach(function(side){
        var baseX = side === 'raw' ? 250 : 718;
        var rg = matrix.append('g').attr('class','cell meter '+side).attr('transform','translate('+baseX+','+y+')');
        rg.append('g').attr('class','axis').attr('transform','translate(0,55)').call(d3.axisBottom(scale).tickValues([0,r.max/2,r.max]).tickSize(5));
        rg.append('rect').attr('class','bar '+(side==='raw' ? 'raw-fill':'cooked-fill')).attr('x',0).attr('y',16).attr('height',22).attr('rx',4).attr('width',0);
        rg.append('text').attr('class','value mono').attr('x',270).attr('y',34).attr('text-anchor','end').text(fmt(0));
      });
      matrix.append('line').attr('class','delta delta-'+r.key).attr('x1',640).attr('x2',690).attr('y1',y+27).attr('y2',y+27);
    });
    matrix.append('text').attr('x',250).attr('y',356).attr('class','axis-label').text('每份：结构通常更难处理');
    matrix.append('text').attr('x',718).attr('y',356).attr('class','axis-label').text('效果随食物与烹饪方法变化');

    if (!reduced) {
      g.attr('opacity',0).attr('transform','translate(0,14)').transition().duration(520).ease(d3.easeCubicOut).attr('opacity',1).attr('transform','translate(0,0)');
    }
  }

  function nearestPlate(x,y) {
    if (Math.hypot(x-leftPlateX,y-plateY) < 135) return 'raw';
    if (Math.hypot(x-rightPlateX,y-plateY) < 135) return 'cooked';
    return null;
  }
  function previewChoice() {
    var x = selectedSide === 'raw' ? leftPlateX+118 : rightPlateX-118;
    svg.select('.token').transition().duration(reduced?0:180).attr('transform','translate('+x+','+home.y+')');
    document.getElementById('status').innerHTML = '已选择 <strong>'+(selectedSide==='raw'?'生食盘':'熟食盘')+'</strong>；按 Enter 放入';
  }
  function invalidDrop() {
    var t = svg.select('.token');
    if (reduced) t.attr('transform','translate('+home.x+','+home.y+')');
    else t.transition().duration(80).attr('transform','translate('+(home.x-8)+','+home.y+')').transition().duration(80).attr('transform','translate('+(home.x+8)+','+home.y+')').transition().duration(100).attr('transform','translate('+home.x+','+home.y+')');
    document.getElementById('status').textContent='请把这一份放入生食盘或熟食盘';
  }
  function assign(side) {
    if (state.locked || state.assigned >= MODEL.portions) return;
    state[side] += 1; state.assigned += 1; state.trace.push(side);
    selectedSide = side;
    update(side);
    dispatch('game-progress',{state:JSON.parse(JSON.stringify(state)),action:{type:'assign',side:side},metrics:metrics()});
    if (state.assigned === MODEL.portions) complete();
  }
  function update(side) {
    var m = metrics();
    svg.selectAll('.plate-count').text(function(d){ return d.side==='raw' ? state.raw+' 份' : state.cooked+' 份'; });
    svg.selectAll('.slot').attr('class',function(d){ return d < state.trace.length ? 'slot assigned-'+state.trace[d] : 'slot'; });
    rows.forEach(function(r){
      ['raw','cooked'].forEach(function(s){
        var meter = svg.select('.meter.'+s).filter(function(){ return d3.select(this.parentNode).selectAll('.meter.'+s).nodes().indexOf(this) === rows.indexOf(r); });
        meter.select('.bar').interrupt().transition().duration(duration).ease(d3.easeCubicOut).attr('width',r.scale(m[r.key][s]));
        meter.select('.value').interrupt().transition().duration(duration).tween('text',function(){ var n=d3.interpolateNumber(+this.textContent,m[r.key][s]); return function(t){this.textContent=fmt(n(t));}; });
      });
    });
    var slotX = d3.scalePoint().domain(d3.range(MODEL.portions)).range([455,745]);
    var targetX = slotX(state.assigned-1);
    var targetY = 151;
    var token=svg.select('.token');
    token.interrupt().transition().duration(reduced?0:210).ease(d3.easeCubicOut).attr('transform','translate('+targetX+','+targetY+')').transition().duration(reduced?0:120).attr('transform','translate('+targetX+','+targetY+') scale(1.12)').transition().duration(reduced?0:120).attr('transform','translate('+home.x+','+home.y+') scale(1)');
    var plate=svg.select('.plate-'+side); plate.classed('pulse',false); void plate.node().getBBox(); plate.classed('pulse',true);
    document.getElementById('status').innerHTML='已分配 <strong>'+state.assigned+' / '+MODEL.portions+'</strong> 份 · 生食 '+state.raw+' · 熟食 '+state.cooked;
  }
  function complete() {
    state.locked=true;
    svg.selectAll('.delta').classed('on',true);
    document.getElementById('complete-card').classList.add('show');
    document.getElementById('status').innerHTML='分配完成 · <strong>三条量尺已联动</strong>';
    dispatch('game-complete',{score:null,metrics:metrics(),trace:state.trace.slice()});
    if (!reduced) setTimeout(function(){ state.locked=false; },1000);
  }
  function reset() {
    state=freshState(); selectedSide='raw';
    svg.selectAll('.bar').interrupt().attr('width',0);
    svg.selectAll('.value').interrupt().text(fmt(0));
    svg.selectAll('.plate-count').text('0 份');
    svg.selectAll('.slot').attr('class','slot');
    svg.selectAll('.delta').classed('on',false);
    svg.select('.token').interrupt().attr('transform','translate('+home.x+','+home.y+') scale(1)');
    document.getElementById('complete-card').classList.remove('show');
    document.getElementById('status').innerHTML='已分配 <strong>0 / '+MODEL.portions+'</strong> 份 · 拖动当前筹码';
    dispatch('game-reset',{state:JSON.parse(JSON.stringify(state))});
  }

  build();
  document.getElementById('reset').addEventListener('click',reset);
  reset();
  window.page15 = { reset:reset, assign:assign, getState:function(){return JSON.parse(JSON.stringify(state));} };
  dispatch('game-start',{state:JSON.parse(JSON.stringify(state))});
})();
</script>
</body>
</html>
