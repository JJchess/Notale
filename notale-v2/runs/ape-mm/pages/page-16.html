<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root{--motion-fast:180ms;--motion-ui:260ms;--motion-scene:620ms;--motion-ease:cubic-bezier(.22,.78,.28,1)}
  #stage{padding:24px 34px 28px;gap:14px}
  .page-head{height:76px;display:flex;align-items:flex-end;justify-content:space-between;gap:36px;flex:0 0 76px}
  .kicker{color:var(--primary);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em}
  .head-note{max-width:560px;text-align:right;color:var(--muted);font-size:var(--fs-sec);line-height:1.5}
  language-relay-game{display:flex;flex:1 1 0;min-height:0}
  .game-shell{position:relative;display:flex;flex:1 1 0;min-width:0;min-height:0;flex-direction:column;gap:12px;padding:16px 18px 18px;border:1px solid var(--line-strong);border-radius:var(--radius-3);background:linear-gradient(135deg,var(--primary-soft),transparent 27%),var(--panel-deep);box-shadow:var(--shadow-panel);overflow:hidden}
  .progress-line{height:40px;display:flex;align-items:center;gap:18px;flex:0 0 40px}
  .round-readout{min-width:112px;color:var(--accent);font:700 var(--fs-body)/1.4 var(--font-mono)}
  .phase-track{display:flex;align-items:center;flex:1;min-width:0}
  .phase{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:var(--fs-label);font-weight:700;white-space:nowrap}
  .phase::before{width:10px;height:10px;border:2px solid var(--line-strong);border-radius:50%;content:"";background:var(--panel-deep)}
  .phase.on{color:var(--text)}
  .phase.on::before{border-color:var(--accent);background:var(--accent);box-shadow:0 0 12px var(--accent-line)}
  .phase-rule{height:2px;flex:1;margin:0 12px;background:var(--line)}
  .chambers{display:flex;flex:1 1 0;min-height:0;gap:14px;align-items:stretch}
  .room{position:relative;display:flex;flex:1 1 0;min-width:0;min-height:0;flex-direction:column;padding:14px;border:1px solid var(--line-strong);border-radius:var(--radius-2);background:linear-gradient(145deg,var(--primary-soft),transparent 58%),var(--panel-raised);overflow:hidden}
  .room-schematic{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.46}
  .room-schematic path{fill:none;stroke:var(--primary-line);stroke-width:1.5;vector-effect:non-scaling-stroke}
  .room-schematic circle{fill:var(--panel-deep);stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
  .room.sender{animation:sender-in var(--motion-scene) var(--motion-ease) both}
  .room.receiver{animation:receiver-in var(--motion-scene) var(--motion-ease) 80ms both}
  .room-title{height:30px;display:flex;align-items:center;justify-content:space-between;color:var(--text);font:700 var(--fs-sec)/1.4 var(--font-title)}
  .room-title span{color:var(--muted);font:650 var(--fs-label)/1.4 var(--font-sans)}
  .task-line{height:42px;display:flex;align-items:center;color:var(--text);font-size:var(--fs-sec);line-height:1.45}
  .board-wrap{display:flex;flex:1 1 0;min-height:0;align-items:center;justify-content:center}
  .board{position:relative;width:min(100%,330px);aspect-ratio:1.66;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);border:1px solid var(--primary-line);background:var(--panel-deep)}
  .cell{position:relative;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .cell:nth-child(3n){border-right:0}.cell:nth-child(n+7){border-bottom:0}
  .cell.target{background:var(--primary-soft)}
  .piece{position:absolute;z-index:2;left:50%;top:50%;width:38px;height:38px;transform:translate(-50%,-50%);transition:transform var(--motion-ui) var(--motion-ease),left var(--motion-scene) var(--motion-ease),top var(--motion-scene) var(--motion-ease)}
  .piece.circle{border-radius:50%;background:var(--primary);box-shadow:0 0 18px var(--primary-line)}
  .piece.triangle{width:0;height:0;border-right:22px solid transparent;border-bottom:38px solid var(--accent);border-left:22px solid transparent;background:transparent;transform:translate(-50%,-50%) rotate(var(--rot,0deg));filter:drop-shadow(0 0 8px var(--accent-line))}
  .piece.outline.circle{border:2px dashed var(--primary);background:transparent;box-shadow:none}
  .piece.outline.triangle{border-right-color:transparent;border-bottom-color:var(--accent-line);border-left-color:transparent;filter:none;opacity:.75}
  .order-tag{position:absolute;z-index:3;padding:2px 7px;border:1px solid var(--accent-line);border-radius:999px;color:var(--accent);background:var(--panel-deep);font-size:var(--fs-label);font-weight:700}
  .screen{position:relative;display:flex;flex:0 0 120px;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line-strong);border-radius:var(--radius-1);background:repeating-linear-gradient(90deg,var(--panel-deep) 0,var(--panel-deep) 12px,var(--panel) 13px,var(--panel) 14px);box-shadow:0 18px 28px rgba(0,0,0,.28);animation:screen-drop 720ms var(--motion-ease) both}
  .screen::before,.screen::after{position:absolute;width:34px;height:2px;content:"";background:var(--primary)}
  .screen::before{left:-35px}.screen::after{right:-35px}
  .screen-label{writing-mode:vertical-rl;color:var(--muted);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.14em}
  .signal-dot{position:absolute;z-index:4;top:50%;left:-9px;width:16px;height:16px;border:2px solid var(--accent);border-radius:50%;background:var(--bg);opacity:0;box-shadow:0 0 14px var(--accent-line)}
  .signal-dot.go{animation:signal 520ms var(--motion-ease) both}
  .composer{height:176px;display:flex;flex:0 0 176px;gap:14px;align-items:stretch;padding-top:12px;border-top:1px solid var(--line)}
  .slot-bank{display:grid;flex:1 1 0;min-width:0;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .word-slot{display:flex;min-width:0;flex-direction:column;gap:7px;padding:9px 10px;border:1px solid var(--line-strong);border-radius:var(--radius-1);background:linear-gradient(180deg,var(--primary-soft),transparent 72%),var(--panel-raised)}
  .slot-label{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:var(--fs-label);font-weight:700}
  .slot-mark{width:10px;height:10px;border:2px solid var(--line-strong);border-radius:50%}
  .word-slot.filled{border-color:var(--primary-line)}.word-slot.filled .slot-mark{border-color:var(--primary);background:var(--primary)}
  .word-slot.success{animation:slot-glow 440ms var(--motion-ease) both;animation-delay:calc(var(--slot-i) * 70ms)}
  .word-slot.success .slot-mark{border-color:var(--accent);background:var(--accent);box-shadow:0 0 12px var(--accent-line)}
  .word-slot.blocked{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
  .word-slot select{width:100%;min-height:42px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:var(--radius-1);color:var(--text);background:var(--panel-deep);font-size:var(--fs-sec);line-height:1.4}
  .action-well{display:flex;flex:0 0 260px;flex-direction:column;gap:8px;justify-content:center}
  .primary-btn{min-height:46px;padding:9px 16px;border:1px solid var(--accent);border-radius:var(--radius-1);color:var(--bg);background:var(--accent);font-size:var(--fs-body);font-weight:800;cursor:pointer;transition:transform var(--motion-fast) ease-out,opacity var(--motion-fast) ease-out}
  .primary-btn:hover:not(:disabled){transform:translateY(-2px)}.primary-btn:disabled{opacity:.42;cursor:not-allowed}
  .feedback{min-height:48px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
  .feedback.good{color:var(--accent)}.feedback.bad{color:var(--danger)}
  .shake{animation:shake 260ms ease-out}
  .final-view{display:none;flex:1 1 0;min-height:0;flex-direction:column;gap:14px}
  .final-view.show{display:flex;animation:fade-rise var(--motion-scene) var(--motion-ease) both}
  .result-strip{height:72px;display:flex;flex:0 0 72px;align-items:center;gap:14px}
  .result-chip{display:flex;flex:1;min-width:0;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius-1);background:var(--panel)}
  .result-chip .relay-node{width:16px;height:16px}.result-chip.ok{border-color:var(--accent-line)}
  .result-chip strong{font-size:var(--fs-sec)}.result-chip span{color:var(--muted);font-size:var(--fs-label)}
  .final-knowledge{flex:1 1 0;min-height:0}
  .final-knowledge .claim{display:flex;align-items:center;justify-content:space-between;gap:20px}
  .claim-main{font-size:var(--fs-lead)}
  .claim-count{color:var(--accent);font:700 var(--fs-body)/1.4 var(--font-mono);white-space:nowrap}
  .final-knowledge .supports{--support-n:4}
  .final-knowledge .support{display:flex;flex-direction:column;justify-content:center;gap:6px;border-color:var(--primary-line)}
  .support strong{color:var(--primary);font:750 var(--fs-h2)/1.35 var(--font-title)}
  .support span{color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
  .final-actions{height:54px;display:flex;flex:0 0 54px;align-items:center;justify-content:space-between;gap:20px}
  .final-note{color:var(--text);font-size:var(--fs-body);line-height:1.5}
  .reset-btn{min-height:42px;padding:7px 15px;border:1px solid var(--line-strong);border-radius:var(--radius-1);color:var(--text);background:var(--panel);font-size:var(--fs-sec);font-weight:700;cursor:pointer}
  @keyframes screen-drop{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
  @keyframes sender-in{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
  @keyframes receiver-in{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
  @keyframes signal{0%{opacity:0;transform:translateX(0) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translateX(138px) scale(1.15)}}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}55%{transform:translateX(7px)}80%{transform:translateX(-3px)}}
  @keyframes slot-glow{0%{transform:translateY(0)}45%{transform:translateY(-4px)}100%{transform:translateY(0)}}
  @keyframes fade-rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){#stage *{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body data-page="16" data-total="50">
<div id="stage">
  <header class="page-head">
    <div>
      <div class="kicker">LANGUAGE / RECONSTRUCTION</div>
      <h1>隔屏之后，行动仍能抵达</h1>
    </div>
    <div class="head-note">看见目标，再用四类词块发出指令。接收者只能按字面行动。</div>
  </header>

  <language-relay-game aria-label="隔屏指令挑战">
    <section class="game-shell">
      <div id="playView" class="col grow min0 gap-2">
        <div class="progress-line">
          <div id="roundReadout" class="round-readout" aria-live="polite"></div>
          <div class="phase-track" aria-label="挑战阶段">
            <div class="phase on" data-phase="watch">看见任务</div><div class="phase-rule"></div>
            <div class="phase" data-phase="send">发送指令</div><div class="phase-rule"></div>
            <div class="phase" data-phase="check">检查重建</div>
          </div>
        </div>

        <div class="chambers min0">
          <section class="room sender min0" aria-label="发送者目标室">
            <svg class="room-schematic" viewBox="0 0 680 430" preserveAspectRatio="none" aria-hidden="true"><path d="M26 390H112V332H570V76H652"/><path d="M26 52H154V106H620"/><circle cx="112" cy="332" r="7"/><circle cx="570" cy="76" r="7"/></svg>
            <div class="room-title">发送者目标室 <span>可见目标</span></div>
            <div id="taskLine" class="task-line"></div>
            <div class="board-wrap"><div id="targetBoard" class="board" aria-label="目标行动结果"></div></div>
          </section>
          <div class="screen" aria-label="不透明隔屏">
            <div class="signal-dot" id="signalDot"></div>
            <div class="screen-label">视线被切断</div>
          </div>
          <section id="receiverRoom" class="room receiver min0" aria-label="接收者操作室">
            <svg class="room-schematic" viewBox="0 0 680 430" preserveAspectRatio="none" aria-hidden="true"><path d="M28 76H110V188H604V374H652"/><path d="M28 354H170V304H626"/><circle cx="110" cy="188" r="7"/><circle cx="604" cy="374" r="7"/></svg>
            <div class="room-title">接收者操作室 <span>只收到指令</span></div>
            <div class="task-line muted">提交后，接收者按四个词块执行。</div>
            <div class="board-wrap"><div id="receiverBoard" class="board" aria-label="接收者实际结果"></div></div>
          </section>
        </div>

        <div class="composer">
          <div id="slotBank" class="slot-bank min0" aria-label="四类指令词块"></div>
          <div class="action-well">
            <button id="submitBtn" class="primary-btn" type="button" disabled>发送指令</button>
            <div id="feedback" class="feedback" aria-live="polite">依次说明对象、动作、关系与顺序。</div>
          </div>
        </div>
      </div>

      <div id="finalView" class="final-view">
        <div id="resultStrip" class="result-strip" aria-label="三轮重建结果"></div>
        <div class="k-generalization final-knowledge">
          <div class="claim">
            <div class="claim-main">语言把不可见的任务拆成可共享的行动结构。</div>
            <div id="crossCount" class="claim-count"></div>
          </div>
          <div class="trunk">
            <div class="supports">
              <div class="support"><strong>对象</strong><span>指明“动什么”，圆片与三角不再混淆。</span></div>
              <div class="support"><strong>动作</strong><span>指明“怎么动”，移动、旋转、放置各不相同。</span></div>
              <div class="support"><strong>关系</strong><span>指明“到哪里”，格位与相对位置决定结果。</span></div>
              <div class="support"><strong>顺序</strong><span>指明“先后”，两步行动按指定次序发生。</span></div>
            </div>
          </div>
        </div>
        <div class="final-actions">
          <div class="final-note">语言不必让接收者看见原动作；指令足够明确，他就能在自己的空间里重建它。</div>
          <button id="resetBtn" class="reset-btn" type="button">重新隔屏挑战</button>
        </div>
      </div>
    </section>
  </language-relay-game>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:16,total:50});

  const tasks=[
    {text:'把青色圆片放进左上格', expected:['circle','place','top-left','single'], targets:[{shape:'circle',cell:0,rot:0}]},
    {text:'先把琥珀三角旋转一次，再放进右下格', expected:['triangle','rotate-place','bottom-right','rotate-first'], targets:[{shape:'triangle',cell:8,rot:90}]},
    {text:'把青色圆片移到中格，然后将琥珀三角放到它右边', expected:['both','move-place','center-right','circle-first'], targets:[{shape:'circle',cell:4,rot:0},{shape:'triangle',cell:5,rot:0}]}
  ];
  const slotDefs=[
    {name:'对象', options:[['circle','青色圆片'],['triangle','琥珀三角'],['both','圆片 + 三角']]},
    {name:'动作', options:[['place','放进'],['rotate-place','旋转一次并放进'],['move-place','移动并放置']]},
    {name:'位置 / 关系', options:[['top-left','左上格'],['bottom-right','右下格'],['center-right','中格 + 右边']]},
    {name:'顺序', options:[['single','一步完成'],['rotate-first','先旋转，再放置'],['circle-first','先圆片，后放三角']]}
  ];

  class LanguageRelayGame extends HTMLElement{
    constructor(){super();this.state=this.initialState();this.trace=[];this.started=false}
    initialState(){return{round:0,phase:'watch',submitted:false,choices:['','','',''],results:[]}}
    connectedCallback(){
      this.playView=document.getElementById('playView');this.finalView=document.getElementById('finalView');
      this.roundReadout=document.getElementById('roundReadout');this.taskLine=document.getElementById('taskLine');
      this.targetBoard=document.getElementById('targetBoard');this.receiverBoard=document.getElementById('receiverBoard');
      this.slotBank=document.getElementById('slotBank');this.submitBtn=document.getElementById('submitBtn');
      this.feedback=document.getElementById('feedback');this.receiverRoom=document.getElementById('receiverRoom');
      this.signalDot=document.getElementById('signalDot');this.resultStrip=document.getElementById('resultStrip');
      this.crossCount=document.getElementById('crossCount');this.resetBtn=document.getElementById('resetBtn');
      this.submitBtn.addEventListener('click',()=>this.transition(this.state.submitted?'next':'submit'));
      this.resetBtn.addEventListener('click',()=>this.reset());
      this.start();
    }
    start(){if(!this.started){this.started=true;this.dispatchEvent(new CustomEvent('game-start',{bubbles:true,composed:true}))}this.renderRound()}
    reset(){this.state=this.initialState();this.trace=[];this.playView.style.display='flex';this.finalView.classList.remove('show');this.finalView.style.display='none';this.feedback.className='feedback';this.feedback.textContent='依次说明对象、动作、关系与顺序。';this.dispatchEvent(new CustomEvent('game-reset',{bubbles:true,composed:true}));this.renderRound()}
    getState(){return JSON.parse(JSON.stringify(this.state))}
    transition(action){
      if(action==='submit'&&!this.state.submitted){
        const task=tasks[this.state.round];
        const correct=this.state.choices.map((v,i)=>v===task.expected[i]);
        const result={correct:correct.every(Boolean),details:correct.slice(),choices:this.state.choices.slice()};
        this.state.submitted=true;this.state.phase='check';this.state.results.push(result);this.trace.push({round:this.state.round,choices:this.state.choices.slice(),correct:result.correct});
        this.renderExecution(task,result);
        this.dispatchEvent(new CustomEvent('game-progress',{detail:{state:this.getState(),action:'submit',metrics:{correct:result.correct}},bubbles:true,composed:true}));
      }else if(action==='next'&&this.state.submitted){
        if(this.state.round<tasks.length-1){this.state.round+=1;this.state.phase='watch';this.state.submitted=false;this.state.choices=['','','',''];this.renderRound()}
        else this.complete();
      }
    }
    makeBoard(board,targets,outline){
      board.replaceChildren();
      for(let i=0;i<9;i++){const cell=document.createElement('div');cell.className='cell';if(targets.some(t=>t.cell===i))cell.classList.add('target');board.appendChild(cell)}
      targets.forEach((t,idx)=>{
        const piece=document.createElement('div');piece.className='piece '+t.shape+(outline?' outline':'');piece.style.setProperty('--rot',(t.rot||0)+'deg');
        const cell=board.children[t.cell];cell.appendChild(piece);
        if(targets.length>1){const tag=document.createElement('span');tag.className='order-tag';tag.textContent=idx===0?'先':'后';tag.style.left=idx===0?'5px':'auto';tag.style.right=idx===1?'5px':'auto';tag.style.top='5px';cell.appendChild(tag)}
      });
    }
    renderRound(){
      const task=tasks[this.state.round];
      this.roundReadout.textContent=`第 ${this.state.round+1} / ${tasks.length} 轮`;
      this.taskLine.textContent='目标：'+task.text;
      this.makeBoard(this.targetBoard,task.targets,true);this.makeBoard(this.receiverBoard,[],false);
      this.slotBank.replaceChildren();
      slotDefs.forEach((def,index)=>{
        const wrap=document.createElement('label');wrap.className='word-slot';wrap.style.setProperty('--slot-i',index);
        const lab=document.createElement('span');lab.className='slot-label';lab.append(document.createTextNode(def.name));
        const mark=document.createElement('i');mark.className='slot-mark';mark.setAttribute('aria-hidden','true');lab.appendChild(mark);
        const select=document.createElement('select');select.setAttribute('aria-label',def.name+'词块');
        const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='选择词块';select.appendChild(placeholder);
        def.options.forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent=o[1];select.appendChild(op)});
        select.addEventListener('change',()=>{this.state.choices[index]=select.value;wrap.classList.toggle('filled',!!select.value);this.state.phase=this.state.choices.some(Boolean)?'send':'watch';this.submitBtn.disabled=!this.state.choices.every(Boolean);this.renderPhases()});
        wrap.append(lab,select);this.slotBank.appendChild(wrap);
      });
      this.submitBtn.textContent='发送指令';this.submitBtn.disabled=true;this.feedback.className='feedback';this.feedback.textContent='依次说明对象、动作、关系与顺序。';this.renderPhases();
    }
    actualTargets(task,choices){
      const object=choices[0],action=choices[1],relation=choices[2],sequence=choices[3];
      let cells=relation==='top-left'?[0]:relation==='bottom-right'?[8]:[4,5];
      let shapes=object==='circle'?['circle']:object==='triangle'?['triangle']:['circle','triangle'];
      if(cells.length===1&&shapes.length>1)cells=[cells[0],Math.min(8,cells[0]+1)];
      if(cells.length>1&&shapes.length===1)cells=[cells[0]];
      let targets=shapes.map((shape,i)=>({shape,cell:cells[Math.min(i,cells.length-1)],rot:(shape==='triangle'&&action==='rotate-place')?90:0}));
      if(sequence==='circle-first')targets.sort((a,b)=>(a.shape==='circle'?-1:1));
      if(sequence==='rotate-first'&&targets[0]&&targets[0].shape==='triangle')targets[0].rot=90;
      return targets;
    }
    renderExecution(task,result){
      const missing=result.details.findIndex(v=>!v);
      const actual=this.actualTargets(task,this.state.choices);this.makeBoard(this.receiverBoard,actual,false);
      this.signalDot.classList.remove('go');
      const slots=[...this.slotBank.querySelectorAll('.word-slot')];
      if(result.correct){
        void this.signalDot.offsetWidth;this.signalDot.classList.add('go');slots.forEach(el=>el.classList.add('success'));
        this.feedback.className='feedback good';this.feedback.textContent='目标轮廓与接收者结果重合：指令足够明确。';
      }else{
        slots[missing].classList.add('blocked');
        this.feedback.className='feedback bad';this.feedback.textContent=`接收者无法确定【${slotDefs[missing].name}】，实际执行结果保留在右侧。`;this.receiverRoom.classList.remove('shake');void this.receiverRoom.offsetWidth;this.receiverRoom.classList.add('shake');
      }
      this.submitBtn.textContent=this.state.round===tasks.length-1?'查看汇合结果':'进入下一轮';this.submitBtn.disabled=false;this.renderPhases();
    }
    renderPhases(){document.querySelectorAll('.phase').forEach(el=>{const order={watch:0,send:1,check:2};el.classList.toggle('on',order[el.dataset.phase]<=order[this.state.phase])})}
    complete(){
      this.playView.style.display='none';this.finalView.style.display='flex';this.finalView.classList.add('show');this.resultStrip.replaceChildren();
      this.state.results.forEach((r,i)=>{const chip=document.createElement('div');chip.className='result-chip'+(r.correct?' ok':'');const node=document.createElement('i');node.className='relay-node';const text=document.createElement('div');const strong=document.createElement('strong');strong.textContent=`第 ${i+1} 轮：${r.correct?'准确重建':'按字面执行'}`;const span=document.createElement('span');span.textContent=r.correct?'结果与目标重合':'结果保留，可对照缺失项';text.append(strong,document.createElement('br'),span);chip.append(node,text);this.resultStrip.appendChild(chip)});
      const success=this.state.results.filter(r=>r.correct).length;this.crossCount.textContent=`${tasks.length} 次行动已跨过隔屏 · ${success} 次准确重建`;
      this.dispatchEvent(new CustomEvent('game-complete',{detail:{score:success,metrics:{rounds:tasks.length},trace:this.trace.slice()},bubbles:true,composed:true}));
    }
  }
  customElements.define('language-relay-game',LanguageRelayGame);
})();
</script>
</body>
</html>
