<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:30px 42px 28px;gap:18px;position:relative}
  #stage.earth-arc::after{right:0;bottom:0;width:250px;height:250px;border-radius:100% 0 0 0}
  .topline{height:78px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}
  .kicker{color:var(--primary);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em}
  .take{max-width:690px;margin:0;text-align:right;color:var(--muted);font-size:var(--fs-sec);line-height:1.5}
  .main{display:flex;gap:18px;min-height:0}
  .network-field{position:relative;flex:1.62;min-width:0;min-height:0;overflow:hidden;padding:0;border:1px solid var(--line);border-radius:var(--radius-2);background:linear-gradient(0deg,rgba(89,195,195,.025),transparent 55%),var(--panel-deep)}
  .network-field::before{position:absolute;inset:0;content:"";pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 53px,rgba(89,195,195,.035) 54px)}
  .field-head{position:absolute;z-index:3;top:18px;left:22px;right:22px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
  .field-head h2{font-size:var(--fs-h2)}
  .status{padding:8px 12px;border:1px solid var(--primary-line);border-radius:var(--radius-1);background:rgba(9,22,32,.9);color:var(--text);font-size:var(--fs-sec);line-height:1.4;font-family:var(--font-mono)}
  #network{position:absolute;inset:58px 8px 72px;width:calc(100% - 16px);height:calc(100% - 130px)}
  .group-halo{fill:var(--primary-soft);stroke:var(--line);stroke-width:1;stroke-dasharray:5 7}
  .link{stroke:var(--primary);stroke-opacity:.22;stroke-width:1.5}
  .link.bridge{stroke-opacity:.48;stroke-width:2}
  .link.bridge.lit{stroke:var(--accent);stroke-opacity:.8;stroke-width:3}
  .pulse{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-dasharray:7 18;pointer-events:none}
  .person{fill:var(--panel-raised);stroke:var(--primary);stroke-width:2}
  .person.carrier{stroke:var(--accent)}
  .person.removed{fill:var(--bg);stroke:var(--danger);stroke-dasharray:3 3;opacity:.62}
  .glyph{fill:none;stroke:var(--text);stroke-width:1.35;stroke-linecap:round;pointer-events:none}
  .glyph.removed{opacity:.18}
  .remove-mark{stroke:var(--danger);stroke-width:2;opacity:0;pointer-events:none}
  .remove-mark.visible{opacity:1}
  .island-label{fill:var(--muted);font-family:var(--font-sans);font-size:14px;font-weight:650}
  .field-bottom{position:absolute;z-index:4;left:22px;right:22px;bottom:17px;display:flex;align-items:center;gap:18px}
  .field-bottom .legend{flex:1}
  .glyph-key{width:20px;height:20px;display:inline-grid;place-items:center;border:1px solid var(--primary-line);border-radius:50%;color:var(--text);font-size:14px;line-height:1}
  .compare-side{flex:.88;min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px}
  .compare-title{height:46px;display:flex;align-items:center;justify-content:space-between}
  .invariant{color:var(--muted);font-size:var(--fs-label);line-height:1.4}
  .k-comparison{--compare-n:2;grid-template-columns:minmax(152px,.9fr) repeat(2,minmax(0,1fr));flex:1}
  .k-comparison>.hdr,.k-comparison>.dim,.k-comparison>.cell{padding:10px 12px}
  .k-comparison>.hdr{font-size:var(--fs-sec)}
  .k-comparison>.cell{justify-content:center;font-family:var(--font-mono);font-weight:700;text-align:center}
  .k-comparison>.dim{justify-content:flex-start;text-align:left}
  .k-comparison.locked{border-color:var(--accent-line);box-shadow:0 0 20px rgba(255,181,71,.14)}
  .k-comparison.locked .diff{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .feedback{min-height:49px;margin:0;padding:11px 14px;border-left:3px solid var(--primary);background:var(--panel-deep);color:var(--muted);font-size:var(--fs-sec);line-height:1.5}
  .feedback.success{border-left-color:var(--accent);color:var(--accent)}
  .network-field.shake{animation:shake .36s ease-in-out}
  @keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}65%{transform:translateX(5px)}}
  .control-band{height:82px;display:flex;align-items:center;gap:22px;padding:13px 18px;border:1px solid var(--line);border-radius:var(--radius-2);background:var(--panel)}
  .range-wrap{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
  .range-wrap label{color:var(--text);font-size:var(--fs-sec);font-weight:700;white-space:nowrap}
  #density{width:100%;min-width:220px}
  .density-value{min-width:148px;color:var(--primary);font:700 var(--fs-sec)/1.4 var(--font-mono)}
  .ctl button{font-size:var(--fs-sec);min-height:42px}
  .core{height:62px;display:flex;align-items:center;gap:16px;padding:10px 18px;border:1px solid var(--primary-line);border-radius:var(--radius-2);background:linear-gradient(90deg,var(--primary-soft),transparent 72%);font-size:var(--fs-lead);font-weight:700;line-height:1.45;opacity:0;transform:translateY(8px);transition:opacity .28s ease-out,transform .28s ease-out}
  .core.visible{opacity:1;transform:none}
  .core .relay-node{width:16px;height:16px}
  @media (prefers-reduced-motion:reduce){.network-field.shake{animation:none}.core{transition:none}}
</style>
</head>
<body data-page="18" data-total="50">
<div id="stage" class="earth-arc">
  <header class="topline shrink0">
    <div class="col gap-1"><div class="kicker">CULTURE / NETWORK</div><h1>知识存在于连线中</h1></div>
    <p class="take">同样的人数、同样的知识种类，只改变交流连线。</p>
  </header>

  <main class="main min0" style="flex:1">
    <section class="network-field diagram min0" aria-labelledby="network-title">
      <div class="field-head"><h2 id="network-title">四座知识群岛</h2><div id="status" class="status" aria-live="polite"></div></div>
      <svg id="network" viewBox="0 0 760 520" role="img" aria-label="由四个群组、交流连线和六类知识符号构成的动态网络"></svg>
      <div class="field-bottom">
        <div id="knowledgeLegend" class="legend" aria-label="知识符号图例"></div>
      </div>
    </section>

    <aside class="compare-side min0" aria-labelledby="compare-title">
      <div class="compare-title"><h2 id="compare-title">同一把比较尺</h2><span class="invariant">不变量：交流者与知识种类</span></div>
      <div id="comparison" class="k-comparison">
        <div class="hdr">比较维度</div><div class="hdr">稀疏基线</div><div class="hdr">当前网络</div>
        <div class="rowline"></div>
        <div class="dim">交流者</div><div id="basePeople" class="cell"></div><div id="curPeople" class="cell"></div>
        <div class="rowline"></div>
        <div class="dim">每人平均连线</div><div id="baseDegree" class="cell"></div><div id="curDegree" class="cell diff"></div>
        <div class="rowline"></div>
        <div class="dim">移除固定成员后<br>仍可到达的知识</div><div id="baseSaved" class="cell"></div><div id="curSaved" class="cell diff"></div>
        <div class="rowline"></div>
        <div class="dim">同一连通分量内<br>可相遇的知识组合</div><div id="basePairs" class="cell"></div><div id="curPairs" class="cell diff"></div>
      </div>
      <p id="feedback" class="feedback">调节连线，再检验固定成员离开后的网络。</p>
    </aside>
  </main>

  <div class="control-band ctl shrink0">
    <div class="range-wrap">
      <label for="density">连线密度</label>
      <input id="density" type="range" min="1" max="6" step="1" value="2" aria-describedby="densityValue">
      <output id="densityValue" class="density-value"></output>
    </div>
    <button id="testBtn" type="button">检验网络</button>
    <button id="resetBtn" type="button">重置为初始密度</button>
  </div>

  <div id="core" class="core shrink0" aria-live="polite"><span class="relay-node"></span><span>更大的交流网络不会自动创造知识，却提高知识被保存、并与别种知识重新相遇的机会。</span></div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:18,total:50});

  const labels=['石材','刃缘','火候','路线','绳结','语言'];
  const groupTypes=[[0,0,1,1,2,2],[1,1,2,2,3,3],[2,2,3,3,4,4],[3,3,4,4,5,5]];
  const removedIds=new Set([2,8,14,20]);
  const centers=[[172,164],[554,154],[207,385],[570,374]];
  const initialK=2;
  let k=initialK, tested=false, lockTimer=null;
  const nodes=[];
  groupTypes.forEach((types,g)=>types.forEach((type,j)=>{
    const a=(Math.PI*2*j/types.length)-Math.PI/2;
    nodes.push({id:g*types.length+j+1,group:g,type,x:centers[g][0]+Math.cos(a)*66,y:centers[g][1]+Math.sin(a)*55});
  }));

  const svg=d3.select('#network');
  const halos=svg.append('g').selectAll('ellipse').data(centers).join('ellipse')
    .attr('class','group-halo').attr('cx',d=>d[0]).attr('cy',d=>d[1]).attr('rx',126).attr('ry',104);
  svg.append('g').selectAll('text').data(centers).join('text').attr('class','island-label')
    .attr('x',d=>d[0]-105).attr('y',d=>d[1]-78).text((d,i)=>`群组 ${String.fromCharCode(65+i)}`);
  const linksG=svg.append('g');
  const pulseG=svg.append('g');
  const nodeG=svg.append('g');

  function glyphPath(type){
    return [
      'M-5,3 L0,-5 L5,3 M-4,4 L4,4',
      'M-5,4 L5,-4 M-4,-2 L4,5',
      'M-4,5 C-6,0 1,-1 -1,-6 C5,-2 6,2 2,6',
      'M-6,3 C-2,-5 2,5 6,-3 M-5,-3 L5,3',
      'M-6,-3 C-2,-7 2,1 -2,4 C-5,7 -7,1 -3,-1 C1,-4 7,-2 5,4',
      'M-6,-2 Q0,-7 6,-2 M-6,2 Q0,7 6,2'
    ][type];
  }

  const nodeSel=nodeG.selectAll('g').data(nodes,d=>d.id).join('g');
  nodeSel.append('circle').attr('class','person').attr('r',9);
  nodeSel.append('path').attr('class','glyph').attr('d',d=>glyphPath(d.type));
  nodeSel.append('path').attr('class','remove-mark').attr('d','M-7,-7 L7,7 M7,-7 L-7,7');

  const legend=document.getElementById('knowledgeLegend');
  labels.forEach((name,i)=>{
    const item=document.createElement('span'); item.className='key';
    item.innerHTML='<span class="glyph-key" aria-hidden="true">'+['△','╱','⌁','〽','∞','⌒'][i]+'</span><span>'+name+'</span>';
    legend.appendChild(item);
  });

  function buildLinks(level){
    const out=[];
    groupTypes.forEach((types,g)=>{
      const ids=types.map((_,j)=>g*types.length+j+1);
      for(let j=0;j<ids.length;j++) for(let step=1;step<=level;step++) out.push({source:ids[j],target:ids[(j+step)%ids.length],bridge:false,key:`i-${g}-${j}-${step}`});
    });
    const bridges=[[6,7],[12,13],[18,19],[5,14],[11,20]];
    const count=Math.max(0,Math.min(bridges.length,(level-1)*2));
    bridges.slice(0,count).forEach((pair,i)=>out.push({source:pair[0],target:pair[1],bridge:true,key:`b-${i}`}));
    return out;
  }

  function metrics(level){
    const active=nodes.filter(n=>!removedIds.has(n.id));
    const activeSet=new Set(active.map(n=>n.id));
    const links=buildLinks(level).map(l=>({source:+l.source,target:+l.target,bridge:l.bridge,key:l.key})).filter(l=>activeSet.has(l.source)&&activeSet.has(l.target));
    const adj=new Map(active.map(n=>[n.id,new Set()]));
    links.forEach(l=>{adj.get(l.source).add(l.target);adj.get(l.target).add(l.source)});
    const seen=new Set(), comps=[];
    active.forEach(n=>{if(seen.has(n.id))return;const stack=[n.id], ids=[];seen.add(n.id);while(stack.length){const id=stack.pop();ids.push(id);adj.get(id).forEach(v=>{if(!seen.has(v)){seen.add(v);stack.push(v)}})}comps.push(ids)});
    const typeSets=comps.map(ids=>new Set(ids.map(id=>nodes[id-1].type)));
    const largest=typeSets.slice().sort((a,b)=>b.size-a.size)[0]||new Set();
    const pairKeys=new Set();
    typeSets.forEach(set=>{const a=[...set];for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)pairKeys.add(`${Math.min(a[i],a[j])}-${Math.max(a[i],a[j])}`)});
    return {saved:largest.size,pairs:pairKeys.size};
  }

  const base=metrics(1);
  const people=nodes.length;
  const typeCount=labels.length;
  const pairTotal=typeCount*(typeCount-1)/2;
  function txt(id,value){document.getElementById(id).textContent=value}
  txt('basePeople',`${people} 人`); txt('curPeople',`${people} 人`);
  txt('baseDegree',`${2*1} 条`); txt('baseSaved',`${base.saved} / ${typeCount} 类`); txt('basePairs',`${base.pairs} / ${pairTotal} 对`);

  let simulation=null;
  function render(){
    const allLinks=buildLinks(k);
    const activeLinks=tested?allLinks.filter(l=>!removedIds.has(+l.source)&&!removedIds.has(+l.target)):allLinks;
    const linkSel=linksG.selectAll('line').data(activeLinks,d=>d.key).join(
      enter=>enter.append('line').attr('class',d=>'link'+(d.bridge?' bridge':'')).attr('opacity',Deck.reduced()?1:0).call(e=>Deck.reduced()?e:e.transition().duration(260).attr('opacity',1)),
      update=>update,
      exit=>exit.remove()
    ).classed('lit',d=>tested&&currentSuccess()&&d.bridge);

    const bridgeNodes=new Set(); activeLinks.filter(l=>l.bridge).forEach(l=>{bridgeNodes.add(+((l.source.id)||l.source));bridgeNodes.add(+((l.target.id)||l.target))});
    nodeSel.select('circle').attr('r',d=>bridgeNodes.has(d.id)?12:9).classed('carrier',d=>bridgeNodes.has(d.id)).classed('removed',d=>tested&&removedIds.has(d.id));
    nodeSel.select('.glyph').classed('removed',d=>tested&&removedIds.has(d.id));
    nodeSel.select('.remove-mark').classed('visible',d=>tested&&removedIds.has(d.id));

    if(simulation)simulation.stop();
    simulation=d3.forceSimulation(nodes)
      .force('link',d3.forceLink(activeLinks).id(d=>d.id).distance(54).strength(0.45))
      .force('charge',d3.forceManyBody().strength(-75))
      .force('collide',d3.forceCollide(13))
      .force('x',d3.forceX(d=>centers[d.group][0]).strength(.12))
      .force('y',d3.forceY(d=>centers[d.group][1]).strength(.12))
      .alphaDecay(0.08)
      .on('tick',ticked);
    if(Deck.reduced()){simulation.stop();simulation.tick(120);ticked()}

    function ticked(){
      nodes.forEach(n=>{n.x=Deck.clamp(n.x,32,728);n.y=Deck.clamp(n.y,38,486)});
      linkSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      nodeSel.attr('transform',d=>`translate(${d.x},${d.y})`);
    }
    updateReadouts();
  }

  function currentSuccess(){const m=metrics(k);return m.saved===typeCount&&m.pairs>=pairTotal-typeCount/2}
  function updateReadouts(){
    const m=metrics(k), degree=2*k;
    txt('densityValue',`每人平均连线：${degree}`);
    txt('curDegree',`${degree} 条`); txt('curSaved',`${m.saved} / ${typeCount} 类`); txt('curPairs',`${m.pairs} / ${pairTotal} 对`);
    txt('status',`知识保留 ${m.saved}/${typeCount} ｜ 可相遇组合 ${m.pairs}/${pairTotal} ｜ 平均连线 ${degree}`);
  }

  function runPulse(){
    pulseG.selectAll('*').remove();
    if(Deck.reduced())return;
    const lines=linksG.selectAll('line').nodes();
    const pulses=pulseG.selectAll('line').data(lines).join('line').attr('class','pulse')
      .attr('x1',l=>l.x1.baseVal.value).attr('y1',l=>l.y1.baseVal.value).attr('x2',l=>l.x2.baseVal.value).attr('y2',l=>l.y2.baseVal.value).attr('stroke-dashoffset',54).attr('opacity',.9);
    let tr=pulses.transition().duration(420).ease(d3.easeCubicOut).attr('stroke-dashoffset',0);
    for(let i=1;i<3;i++)tr=tr.transition().duration(120).attr('opacity',.35).transition().duration(420).attr('opacity',.9).attr('stroke-dashoffset',-54*i);
    tr.transition().duration(180).attr('opacity',0).remove();
  }

  function testNetwork(){
    tested=true; render(); runPulse();
    const ok=currentSuccess(), feedback=document.getElementById('feedback');
    if(ok){feedback.textContent='知识跨过了群组边界。';feedback.className='feedback success'}
    else{feedback.textContent='人数没有减少；缺的是让知识跨群传播的桥。';feedback.className='feedback';const field=document.querySelector('.network-field');field.classList.remove('shake');void field.offsetWidth;field.classList.add('shake')}
    document.getElementById('core').classList.add('visible');
    const table=document.getElementById('comparison'); table.classList.add('locked');
    const controls=[document.getElementById('density'),document.getElementById('testBtn')];controls.forEach(c=>c.disabled=true);
    clearTimeout(lockTimer);lockTimer=setTimeout(()=>{table.classList.remove('locked');controls.forEach(c=>c.disabled=false)},2000);
  }

  function reset(){
    clearTimeout(lockTimer); k=initialK;tested=false;document.getElementById('density').value=k;
    document.getElementById('comparison').classList.remove('locked');
    document.getElementById('core').classList.remove('visible');
    document.getElementById('feedback').textContent='调节连线，再检验固定成员离开后的网络。';document.getElementById('feedback').className='feedback';
    document.getElementById('density').disabled=false;document.getElementById('testBtn').disabled=false;
    nodes.forEach((n,i)=>{const j=i%groupTypes[0].length,a=Math.PI*2*j/groupTypes[0].length-Math.PI/2;n.x=centers[n.group][0]+Math.cos(a)*66;n.y=centers[n.group][1]+Math.sin(a)*55;n.vx=n.vy=0});
    pulseG.selectAll('*').remove();render();
  }

  document.getElementById('density').addEventListener('input',e=>{k=+e.target.value;tested=false;document.getElementById('core').classList.remove('visible');document.getElementById('feedback').textContent='调节连线，再检验固定成员离开后的网络。';document.getElementById('feedback').className='feedback';render()});
  document.getElementById('testBtn').addEventListener('click',testNetwork);
  document.getElementById('resetBtn').addEventListener('click',reset);

  if(!Deck.reduced()){
    nodeSel.attr('opacity',0).transition().delay(d=>d.group*110).duration(460).ease(d3.easeCubicOut).attr('opacity',1);
    halos.attr('opacity',0).transition().delay((d,i)=>i*110).duration(520).attr('opacity',1);
    d3.selectAll('#comparison > div').attr('opacity',0).transition().delay((d,i)=>420+i*22).duration(280).attr('opacity',1);
  }
  render();
})();
</script>
</body>
</html>
