<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:32px 48px 28px;gap:16px}
  .topline{height:78px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}
  .kicker{color:var(--primary);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.16em}
  .headline{display:flex;align-items:baseline;gap:20px}
  .take{max-width:680px;margin:0;color:var(--muted);font-size:var(--fs-lead);line-height:1.5;text-align:right}
  .process-band{height:94px;flex:none}
  .process-band.k-process{gap:8px}
  .process-band.k-process>.step{justify-content:center;padding:10px 14px;text-align:center}
  .process-band.k-process>.step .label{color:inherit;font-size:16px}
  .process-band.k-process>.step .num{font:700 16px/1.3 var(--font-mono);color:var(--primary)}
  .process-band.k-process>.step.current .num{color:var(--accent)}
  .process-band.k-process>.arw{flex-basis:22px}
  .machine{position:relative;display:flex;flex:1;min-height:0;overflow:hidden;border:1px solid var(--line-strong);border-radius:var(--radius-3);background:linear-gradient(180deg,var(--panel),var(--panel-deep));box-shadow:var(--shadow-panel)}
  .machine::before{position:absolute;inset:0;content:"";pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 37px,var(--primary-soft) 38px,transparent 40px);opacity:.55}
  .machine.earth-arc::after{right:0;bottom:0;width:260px;height:260px;opacity:.45}
  .trace-zone{position:relative;z-index:1;flex:1;min-width:0;min-height:0;padding:18px 20px 14px 22px}
  .trace-head{position:absolute;z-index:2;top:20px;left:28px;right:28px;display:flex;align-items:center;justify-content:space-between}
  .legend{padding:6px 10px;border-radius:var(--radius-1);background:var(--panel-deep)}
  .ghost-key{display:none}
  .ghost-key.show{display:inline-flex}
  #trace{width:100%;height:100%}
  #trace text{font-family:var(--font-sans)}
  .control-bay{position:relative;z-index:2;width:370px;flex:none;border-left:1px solid var(--line-strong);padding:18px 22px;display:flex;flex-direction:column;align-items:stretch;background:linear-gradient(180deg,var(--panel-raised),var(--panel-deep))}
  .readout{padding:10px 14px}
  .readout .value{font-size:18px}
  .model-tag{margin-top:8px;color:var(--faint);font-size:14px;line-height:1.4;text-align:center}
  .pawl-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
  .pawl-label{font-size:16px;color:var(--muted)}
  .pawl-toggle{position:relative;width:156px;height:46px;padding:0;border:1px solid var(--line-strong);border-radius:24px;color:var(--text);background:linear-gradient(180deg,var(--panel-raised),var(--panel-deep));box-shadow:inset 0 5px 10px rgba(0,0,0,.28),inset 0 1px 0 var(--primary-line);cursor:pointer}
  .pawl-toggle .handle{position:absolute;top:5px;left:6px;width:68px;height:34px;border:1px solid var(--accent-line);border-radius:18px;background:linear-gradient(180deg,var(--accent),var(--panel-raised));box-shadow:0 5px 9px rgba(0,0,0,.35),inset 0 1px 0 var(--text);transition:transform 200ms ease-out}
  .pawl-toggle[aria-pressed="true"] .handle{transform:translateX(74px)}
  .pawl-toggle:disabled{cursor:not-allowed;opacity:.75}
  .pawl-ends{display:flex;justify-content:space-between;padding:0 12px;margin-top:3px;color:var(--faint);font-size:14px}
  .wheel-wrap{position:relative;flex:1;min-height:210px;display:grid;place-items:center}
  .pawl{position:absolute;z-index:3;top:8px;left:50%;width:34px;height:72px;border:2px solid var(--accent);clip-path:polygon(0 0,100% 0,78% 100%,50% 78%,22% 100%);background:linear-gradient(90deg,var(--panel-raised),var(--accent),var(--panel-raised));transform:translateX(-50%);filter:drop-shadow(0 5px 6px rgba(0,0,0,.45));transform-origin:50% 0}
  .pawl.pulse{animation:pawl-lock 420ms ease-out}
  .wheel{position:relative;width:190px;height:190px;padding:0;border:0;border-radius:50%;color:var(--text);background:repeating-conic-gradient(var(--line-strong) 0deg 6deg,var(--panel-deep) 6deg 45deg);box-shadow:0 15px 24px rgba(0,0,0,.42),inset 0 0 0 13px var(--line),inset 0 0 0 17px var(--primary-line);cursor:grab;touch-action:none;transition:transform 420ms cubic-bezier(.22,.8,.28,1),filter 180ms ease}
  .wheel::before{position:absolute;inset:34px;content:"";border:1px solid var(--line-strong);border-radius:50%;background:radial-gradient(circle at 42% 35%,var(--panel-raised),var(--panel-deep) 68%);box-shadow:inset 0 4px 4px var(--primary-soft),0 3px 8px rgba(0,0,0,.5)}
  .wheel::after{position:absolute;inset:77px;content:"";border:2px solid var(--primary);border-radius:50%;background:var(--panel-raised);box-shadow:0 0 12px var(--primary-line)}
  .wheel span{position:relative;z-index:2;display:block;font-size:16px;font-weight:750;line-height:1.25;pointer-events:none}
  .wheel small{position:relative;z-index:2;display:block;margin-top:5px;color:var(--muted);font-size:14px;line-height:1.3;pointer-events:none}
  .wheel.bad{animation:reject 300ms ease}
  .wheel:disabled{cursor:not-allowed;filter:saturate(.45)}
  .feedback{min-height:48px;margin:0;color:var(--text);font-size:16px;line-height:1.45;text-align:center}
  .feedback.warn{color:var(--danger)}
  .reset{min-height:40px;border:1px solid var(--line-strong);border-radius:var(--radius-1);color:var(--text);background:linear-gradient(180deg,var(--panel-raised),var(--panel-deep));font-size:16px;cursor:pointer;box-shadow:0 4px 8px rgba(0,0,0,.25),inset 0 1px 0 var(--primary-line)}
  .reset:active{transform:translateY(1px);box-shadow:inset 0 3px 7px rgba(0,0,0,.4)}
  .bottomline{height:62px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 4px}
  .bottomline .lead{margin:0;max-width:1080px}
  .status-chip{flex:none;padding:8px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-size:16px}
  @keyframes reject{25%{transform:rotate(-7deg)}55%{transform:rotate(4deg)}100%{transform:rotate(0)}}
  @keyframes pawl-lock{45%{transform:translateX(-50%) rotate(8deg);filter:drop-shadow(0 0 10px var(--accent))}100%{transform:translateX(-50%) rotate(0)}}
  @media (prefers-reduced-motion:reduce){.wheel,.pawl-toggle .handle{transition:none}.pawl.pulse,.wheel.bad{animation:none}}
</style>
</head>
<body data-page="20" data-total="50">
<div id="stage">
  <header class="topline shrink0">
    <div>
      <div class="kicker">CULTURAL RATCHET · 20</div>
      <div class="headline"><h1>棘轮为什么能累积</h1></div>
    </div>
    <p class="take">转过每个卡点，观察改进能否被下一代接住。</p>
  </header>

  <section class="k-process process-band" aria-label="每一代的因果顺序">
    <div class="axis" aria-hidden="true"></div>
    <div class="step current" data-phase="0"><span class="num">01</span><span class="label">复制上一代</span></div><div class="arw" aria-hidden="true"></div>
    <div class="step" data-phase="1"><span class="num">02</span><span class="label">保留了吗？</span></div><div class="arw" aria-hidden="true"></div>
    <div class="step" data-phase="2"><span class="num">03</span><span class="label">尝试改进</span></div><div class="arw" aria-hidden="true"></div>
    <div class="step" data-phase="3"><span class="num">04</span><span class="label">交给下一代</span></div>
  </section>

  <main class="machine earth-arc min0" aria-label="文化棘轮实验台">
    <section class="trace-zone min0 diagram" aria-label="八代复杂度轨迹">
      <div class="trace-head">
        <h2>代际复杂度阶梯</h2>
        <div class="legend" aria-label="图例">
          <span class="key"><span class="swatch"></span>成功继承</span>
          <span class="key"><span class="swatch current"></span>当代改进</span>
          <span class="key"><span class="swatch" style="background:var(--faint)"></span>丢失</span>
          <span class="key ghost-key"><span class="swatch" style="background:var(--line-strong)"></span>另一保真度</span>
        </div>
      </div>
      <svg id="trace" viewBox="0 0 1200 680" role="img" aria-labelledby="traceTitle traceDesc">
        <title id="traceTitle">文化复杂度的代际阶梯轨迹</title>
        <desc id="traceDesc">横向表示代际，纵向表示复杂度；每次转动棘轮后增加一个节点。</desc>
      </svg>
    </section>

    <aside class="control-bay min0" aria-label="棘轮控制台">
      <div class="readout">
        <span class="key">当前进度</span><span class="value" id="genRead">—</span>
        <span class="key">当前复杂度</span><span class="value current" id="levelRead">—</span>
      </div>
      <div class="model-tag">保真度与创新概率均为课堂模型参数</div>
      <div class="pawl-row"><span class="pawl-label">拨动棘爪</span><button id="fidelity" class="pawl-toggle" type="button" aria-pressed="false" aria-label="当前低保真，按下切换高保真"><span class="handle" aria-hidden="true"></span></button></div>
      <div class="pawl-ends"><span id="lowLabel">低保真</span><span id="highLabel">高保真</span></div>
      <div class="wheel-wrap">
        <div class="pawl" id="pawl" aria-hidden="true"></div>
        <button id="wheel" class="wheel no-pan" type="button" aria-label="顺时针转动棘轮，推进一代"><span>顺时针转动</span><small>或按 → / 空格</small></button>
      </div>
      <p id="feedback" class="feedback" aria-live="polite">先选保真度，再顺时针转过一个卡点。</p>
      <button id="reset" class="reset" type="button">同种子重置</button>
    </aside>
  </main>

  <footer class="bottomline shrink0">
    <p class="lead"><strong>改进只有被可靠继承，才会形成跨世代累积；</strong>创新频繁但传递不稳，棘轮仍会反复打滑。</p>
    <div id="runState" class="status-chip">等待第 1 代</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
(function(){
  'use strict';
  const cfg={generations:8,goal:8,start:2,innovationP:.45,fidelity:{low:.55,high:.90},seed:'page-20'};
  const reduced=Deck.reduced();
  const svg=d3.select('#trace').attr('viewBox','0 0 1200 680').attr('role','img');
  const C={primary:'var(--primary)',accent:'var(--accent)',faint:'var(--faint)',line:'var(--line-strong)',text:'var(--text)',panel:'var(--panel-deep)'};
  const x=d3.scalePoint().domain(d3.range(1,cfg.generations+1)).range([105,1105]);
  const y=d3.scaleLinear().domain([1,cfg.goal]).range([570,105]);
  const line=d3.line().x(d=>x(d.gen)).y(d=>y(d.level)).curve(d3.curveStepAfter);
  const root=svg.append('g');
  const grid=root.append('g');
  d3.range(1,cfg.goal+1).forEach(v=>{
    grid.append('line').attr('x1',80).attr('x2',1132).attr('y1',y(v)).attr('y2',y(v)).attr('stroke',C.line).attr('stroke-width',1).attr('opacity',.55);
    grid.append('text').attr('x',55).attr('y',y(v)+5).attr('text-anchor','middle').attr('fill',C.faint).style('font-size','16px').text(v);
  });
  d3.range(1,cfg.generations+1).forEach(g=>{
    grid.append('line').attr('x1',x(g)).attr('x2',x(g)).attr('y1',88).attr('y2',590).attr('stroke',C.line).attr('stroke-width',1).attr('stroke-dasharray','4 9').attr('opacity',.45);
    grid.append('circle').attr('class','slot').attr('cx',x(g)).attr('cy',620).attr('r',7).attr('fill',C.panel).attr('stroke',C.line).attr('stroke-width',2);
    grid.append('text').attr('x',x(g)).attr('y',655).attr('text-anchor','middle').attr('fill',C.faint).style('font-size','16px').text('第'+g+'代');
  });
  root.append('text').attr('x',22).attr('y',76).attr('fill',C.faint).style('font-size','16px').text('复杂度');
  const ghostLayer=root.append('g').attr('opacity',0);
  const historyLayer=root.append('g');
  const eventLayer=root.append('g');

  const els={fidelity:document.getElementById('fidelity'),wheel:document.getElementById('wheel'),reset:document.getElementById('reset'),feedback:document.getElementById('feedback'),gen:document.getElementById('genRead'),level:document.getElementById('levelRead'),run:document.getElementById('runState'),pawl:document.getElementById('pawl')};
  let state;
  let spin=0;
  let busy=false;
  let drag=null;

  function trials(){
    Math.seedrandom(cfg.seed);
    return d3.range(cfg.generations).map(()=>({keep:Math.random(),innovate:Math.random()}));
  }
  function fresh(){return {mode:'low',gen:0,level:cfg.start,trace:[],rolls:trials(),done:false};}
  function simulate(mode){
    let level=cfg.start;
    return state.rolls.map((r,i)=>{
      const kept=r.keep<cfg.fidelity[mode];
      if(!kept) level=Math.max(1,level-1);
      const improved=r.innovate<cfg.innovationP;
      if(improved) level=Math.min(cfg.goal,level+1);
      return {gen:i+1,level,kept,improved};
    });
  }
  function pct(v){return (v*100).toFixed(0)+'%';}
  document.getElementById('lowLabel').textContent='低保真 '+pct(cfg.fidelity.low);
  document.getElementById('highLabel').textContent='高保真 '+pct(cfg.fidelity.high);

  function setPhase(n){
    document.querySelectorAll('[data-phase]').forEach((el,i)=>{
      el.classList.toggle('current',i===n);
      el.classList.toggle('past',i<n);
    });
  }
  function setFeedback(text,warn){els.feedback.textContent=text;els.feedback.classList.toggle('warn',!!warn);}
  function updateReadout(){
    els.gen.textContent='第 '+state.gen+' / '+cfg.generations+' 代';
    els.level.textContent=state.level+' / '+cfg.goal;
    els.run.textContent=state.done?'全部代际轨迹已锁定':'等待第 '+(state.gen+1)+' 代';
  }
  function drawHistory(animate){
    const data=state.trace;
    const path=historyLayer.selectAll('path.main-path').data(data.length?[data]:[]);
    path.join(enter=>enter.append('path').attr('class','main-path').attr('fill','none').attr('stroke',C.primary).attr('stroke-width',3).attr('d',line).attr('opacity',0).call(e=>animate?e.transition().duration(420).ease(d3.easeCubicOut).attr('opacity',1):e.attr('opacity',1)),update=>update.call(u=>animate?u.transition().duration(420).ease(d3.easeCubicOut).attr('d',line):u.attr('d',line)),exit=>exit.remove());
    const nodes=historyLayer.selectAll('g.node').data(data,d=>d.gen);
    const enter=nodes.enter().append('g').attr('class','node').attr('transform',d=>`translate(${x(d.gen)},${y(d.level)})`).attr('opacity',0);
    enter.append('circle').attr('r',28).attr('fill',C.panel).attr('stroke',d=>d.improved?C.accent:(d.kept?C.primary:C.faint)).attr('stroke-width',3);
    enter.append('text').attr('text-anchor','middle').attr('dy','.36em').attr('fill',C.text).style('font-size','22px').style('font-weight',750).text(d=>d.level);
    enter.append('text').attr('text-anchor','middle').attr('y',-39).attr('fill',d=>d.improved?C.accent:(d.kept?C.primary:C.faint)).style('font-size','16px').text(d=>d.improved?'改进 +1':(d.kept?'已保留':'滑失 −1'));
    if(animate) enter.transition().duration(420).ease(d3.easeCubicOut).attr('opacity',1); else enter.attr('opacity',1);
    grid.selectAll('circle.slot').attr('fill',(d,i)=>i<state.gen?C.primary:C.panel).attr('stroke',(d,i)=>i===state.gen-1?C.accent:C.line);
  }
  function showGhost(){
    const other=state.mode==='low'?'high':'low';
    const data=simulate(other);
    ghostLayer.attr('opacity',1);
    ghostLayer.append('path').datum(data).attr('fill','none').attr('stroke',C.line).attr('stroke-width',3).attr('stroke-dasharray','8 8').attr('d',line);
    ghostLayer.selectAll('circle').data(data).join('circle').attr('cx',d=>x(d.gen)).attr('cy',d=>y(d.level)).attr('r',10).attr('fill',C.panel).attr('stroke',C.line).attr('stroke-width',3);
    document.querySelector('.ghost-key').classList.add('show');
    const own=state.trace[state.trace.length-1].level, alt=data[data.length-1].level;
    setFeedback('相同改进机会，继承可靠度改变了累积结果。',false);
    els.run.textContent=(state.mode==='high'?'高':'低')+'保真结束 '+own+'；另一轨迹 '+alt;
  }
  function wait(ms){return new Promise(r=>setTimeout(r,reduced?0:ms));}
  async function advance(){
    if(busy||state.done)return;
    busy=true;els.wheel.disabled=true;els.fidelity.disabled=true;
    const r=state.rolls[state.gen];
    setPhase(0);setFeedback('复制上一代的复杂度。');
    await wait(230);
    setPhase(1);
    const kept=r.keep<cfg.fidelity[state.mode];
    let level=state.level;
    if(!kept)level=Math.max(1,level-1);
    setFeedback(kept?'复制成功：旧成果被棘爪锁住。':'传递失稳：成果向下滑失一格。');
    await wait(280);
    setPhase(2);
    const improved=r.innovate<cfg.innovationP;
    if(improved)level=Math.min(cfg.goal,level+1);
    setFeedback(improved?'本代出现改进，复杂度上升一格。':'本代未出现新改进。');
    await wait(280);
    setPhase(3);
    state.gen+=1;state.level=level;
    state.trace.push({gen:state.gen,level,kept,improved});
    drawHistory(!reduced);updateReadout();
    els.pawl.classList.remove('pulse');void els.pawl.offsetWidth;els.pawl.classList.add('pulse');
    setFeedback('成果已交给下一代，轨迹锁定。');
    await wait(430);
    if(state.gen>=cfg.generations){state.done=true;updateReadout();showGhost();els.wheel.disabled=true;}
    else{setPhase(0);els.wheel.disabled=false;}
    busy=false;
  }
  function reject(){
    els.wheel.classList.remove('bad');void els.wheel.offsetWidth;els.wheel.classList.add('bad');
    setFeedback('棘轮只能把成果交给下一代：请顺时针转过一个卡点。',true);
  }
  function toggleMode(){
    if(state.gen>0)return;
    state.mode=state.mode==='low'?'high':'low';
    const high=state.mode==='high';
    els.fidelity.setAttribute('aria-pressed',String(high));
    els.fidelity.setAttribute('aria-label','当前'+(high?'高':'低')+'保真，按下切换'+(high?'低':'高')+'保真');
    setFeedback('已选择'+(high?'高':'低')+'保真 '+pct(cfg.fidelity[state.mode])+'。顺时针转动。');
  }
  function angleAt(e){const p=Deck.pt(els.wheel,e);return Math.atan2(p.y-els.wheel.offsetHeight/2,p.x-els.wheel.offsetWidth/2);}
  els.wheel.addEventListener('pointerdown',e=>{if(busy||state.done)return;drag={start:angleAt(e),last:angleAt(e),sum:0};els.wheel.setPointerCapture(e.pointerId);});
  els.wheel.addEventListener('pointermove',e=>{if(!drag)return;const a=angleAt(e);let d=a-drag.last;if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;drag.sum+=d;drag.last=a;els.wheel.style.transform=`rotate(${spin+drag.sum}rad)`;});
  els.wheel.addEventListener('pointerup',e=>{if(!drag)return;const amount=drag.sum;drag=null;if(amount>.65){spin+=Math.PI/4;els.wheel.style.transform=`rotate(${spin}rad)`;advance();}else{els.wheel.style.transform=`rotate(${spin}rad)`;reject();}});
  els.wheel.addEventListener('click',e=>{if(e.detail===0&&!busy&&!state.done){spin+=Math.PI/4;els.wheel.style.transform=`rotate(${spin}rad)`;advance();}});
  els.wheel.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();spin+=Math.PI/4;els.wheel.style.transform=`rotate(${spin}rad)`;advance();}else if(e.key==='ArrowLeft'){e.preventDefault();reject();}});
  els.fidelity.addEventListener('click',toggleMode);
  els.reset.addEventListener('click',reset);
  function reset(){
    Math.seedrandom(cfg.seed);state=fresh();spin=0;busy=false;
    els.wheel.disabled=false;els.fidelity.disabled=false;els.wheel.style.transform='rotate(0rad)';
    els.fidelity.setAttribute('aria-pressed','false');els.fidelity.setAttribute('aria-label','当前低保真，按下切换高保真');
    historyLayer.selectAll('*').remove();ghostLayer.selectAll('*').remove();ghostLayer.attr('opacity',0);document.querySelector('.ghost-key').classList.remove('show');
    setPhase(0);setFeedback('先选保真度，再顺时针转过一个卡点。');updateReadout();drawHistory(false);
  }
  reset();
  Deck.init({index:20,total:50});
})();
</script>
</body>
</html>
