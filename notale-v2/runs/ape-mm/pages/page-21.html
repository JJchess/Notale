<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage { position: relative; }
  .page-head { padding: 24px 52px 12px; }
  .kicker { color: var(--primary); font: 700 var(--fs-label)/1.4 var(--font-mono); letter-spacing: .16em; }
  .round-line { min-width: 520px; text-align: right; }
  .class-legend { margin-top: 6px; color: var(--muted); font-size: var(--fs-label); }
  .round-lights { display: inline-flex; gap: 10px; margin-left: 16px; vertical-align: middle; }
  .round-light { width: 16px; height: 16px; border: 1px solid var(--line-strong); border-radius: 50%; background: var(--panel-deep); }
  .round-light.done { border-color: var(--primary); background: var(--primary); box-shadow: 0 0 12px var(--primary-line); }
  .round-light.now { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-line); }
  .game-scene { position: relative; margin: 0 52px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-3); }
  .game-scene::before { position: absolute; inset: 0; content: ""; background: repeating-linear-gradient(0deg, transparent 0 46px, rgba(89,195,195,.05) 47px, transparent 49px); pointer-events: none; }
  .participant { position: absolute; z-index: 3; width: 276px; height: 214px; gap: 0; opacity: 1; }
  .participant.animate { opacity: 0; transform: translateY(22px); animation: rise .45s ease forwards; }
  .participant .box { height: 100%; padding: 12px; background: rgba(13,27,38,.96); }
  .participant .box > .bt { display: flex; align-items: center; justify-content: space-between; margin: -12px -12px 10px; padding: 8px 12px; font-size: 19px; }
  .participant .action-tag { color: var(--accent); font: 700 var(--fs-label)/1.4 var(--font-sans); }
  .participant .hidden-decision { display: grid; height: 106px; place-items: center; color: var(--muted); font-size: var(--fs-sec); }
  .participant .lv { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 7px; margin: 0; padding: 0 0 0 10px; }
  .participant .lv::before { top: 12px; width: 10px; }
  .participant .account { padding: 7px 5px; text-align: center; box-shadow: none !important; }
  .participant .account .label { display: block; font-size: 14px; }
  .participant .account .value { display: block; margin-top: 3px; color: var(--text); font: 700 17px/1.3 var(--font-mono); }
  .participant .payoff .value { color: var(--primary); }
  .p-a { left: 34px; top: 56px; animation-delay: .12s; }
  .p-b { left: 334px; top: 12px; animation-delay: .2s; }
  .p-c { right: 334px; top: 12px; animation-delay: .28s; }
  .p-d { right: 34px; top: 56px; animation-delay: .36s; }
  .p-you { left: 34px; bottom: 12px; width: 310px; animation-delay: .44s; }
  .pool-zone { position: absolute; z-index: 2; top: 220px; left: 50%; width: 570px; height: 210px; transform: translateX(-50%); }
  .pool-ring { position: absolute; top: 0; left: 50%; display: grid; width: 172px; height: 172px; place-items: center; border: 2px solid var(--primary-line); border-radius: 50%; background: radial-gradient(circle, var(--primary-soft), var(--panel-deep) 68%); box-shadow: 0 0 34px rgba(89,195,195,.18), inset 0 0 24px rgba(89,195,195,.12); transform: translateX(-50%); }
  .pool-ring.ready { border-color: var(--accent); box-shadow: 0 0 38px var(--accent-line), inset 0 0 24px var(--accent-soft); }
  .pool-title { color: var(--muted); font-size: var(--fs-label); }
  .pool-value { color: var(--primary); font: 750 32px/1.2 var(--font-mono); }
  .pool-return { color: var(--muted); font-size: 14px; }
  .allocation { position: absolute; right: 0; bottom: 0; left: 0; display: flex; align-items: center; gap: 14px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--radius-2); background: rgba(9,22,32,.95); }
  .bin { width: 98px; flex: 0 0 98px; text-align: center; }
  .bin .value { color: var(--text); font: 700 20px/1.3 var(--font-mono); }
  .slider-wrap { flex: 1; min-width: 0; }
  #allocation { width: 100%; accent-color: var(--accent); cursor: grab; }
  #allocation:active { cursor: grabbing; }
  .token-row { display: flex; justify-content: center; gap: 5px; height: 18px; margin-top: 5px; }
  .token { width: 13px; height: 13px; border: 1px solid var(--accent); border-radius: 50%; background: var(--accent-soft); box-shadow: 0 0 6px var(--accent-line); }
  .token.private { border-color: var(--line-strong); background: var(--panel-raised); box-shadow: none; }
  .flow-lines { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .flow-lines line { stroke: var(--line-strong); stroke-width: 2; stroke-dasharray: 5 8; }
  .flow-lines.settled line { stroke: var(--primary); stroke-dasharray: none; filter: drop-shadow(0 0 4px var(--primary)); }
  .game-footer { margin: 12px 52px 18px; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--radius-2); background: var(--panel); }
  .feedback { min-width: 0; flex: 1; }
  .feedback .main { color: var(--text); font-size: var(--fs-sec); line-height: 1.5; }
  .feedback .sub { color: var(--muted); font-size: var(--fs-sec); line-height: 1.5; }
  .totals { display: flex; gap: 22px; min-width: 350px; }
  .total .label { display: block; }
  .total .value { color: var(--primary); font: 700 var(--fs-lead)/1.4 var(--font-mono); }
  .actions { display: flex; gap: 10px; }
  .actions button { min-height: 42px; padding: 7px 16px; border: 1px solid var(--line-strong); border-radius: var(--radius-1); color: var(--text); background: var(--panel-deep); font-size: var(--fs-sec); cursor: pointer; }
  .actions button.primary-action:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .actions button:disabled { opacity: .45; cursor: not-allowed; }
  .shake { animation: shake .28s ease; }
  .benchmarks { color: var(--muted); font-size: var(--fs-sec); line-height: 1.4; }
  .benchmarks strong { color: var(--primary); font-family: var(--font-mono); }
  .final-note { display: none; gap: 22px; }
  .final-note.show { display: flex; }
  .final-note .result { padding-left: 12px; border-left: 2px solid var(--primary); color: var(--text); font-size: var(--fs-sec); line-height: 1.5; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @media (prefers-reduced-motion: reduce) { .participant.animate { opacity: 1; animation: none; transform: none; } * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
<body data-page="21" data-total="50">
<div id="stage">
  <header class="page-head row items-end justify-between" style="height:104px">
    <div>
      <div class="kicker">COOPERATION · PUBLIC GOODS</div>
      <h1>公共池里的选择</h1>
    </div>
    <div class="round-line secondary"><div><span id="roundText"></span><span id="roundLights" class="round-lights" aria-label="轮次进度"></span></div><div class="class-legend" id="classLegend"></div></div>
  </header>

  <main class="game-scene strata min0 no-pan" style="flex:1" aria-label="公共物品协作局">
    <svg class="flow-lines" id="flowLines" viewBox="0 0 1494 610" preserveAspectRatio="none" aria-hidden="true">
      <line x1="172" y1="163" x2="747" y2="305"></line><line x1="472" y1="119" x2="747" y2="305"></line>
      <line x1="1022" y1="119" x2="747" y2="305"></line><line x1="1322" y1="163" x2="747" y2="305"></line>
      <line x1="189" y1="510" x2="747" y2="305"></line>
    </svg>
    <section id="players" aria-label="五名参与者"></section>
    <section class="pool-zone" aria-label="公共池与筹码分配">
      <div class="pool-ring" id="poolRing">
        <div style="text-align:center">
          <div class="pool-title">公共池</div>
          <div class="pool-value" id="poolValue"></div>
          <div class="pool-return" id="returnValue"></div>
        </div>
      </div>
      <div class="allocation" id="allocationTray">
        <div class="bin"><span class="label">私人保留</span><div class="value" id="privateValue"></div><div class="token-row" id="privateTokens"></div></div>
        <div class="slider-wrap">
          <label class="label" for="allocation">拖动分配：向右投入公共池</label>
          <input id="allocation" type="range" aria-label="分配筹码，方向键也可调整投入数量">
        </div>
        <div class="bin"><span class="label">投入公共池</span><div class="value" id="contributionValue"></div><div class="token-row" id="publicTokens"></div></div>
      </div>
    </section>
  </main>

  <footer class="game-footer col gap-2" style="height:168px">
    <div class="row items-center gap-4">
      <div class="feedback" aria-live="polite"><div class="main" id="feedbackMain"></div><div class="sub" id="feedbackSub"></div></div>
      <div class="totals">
        <div class="total"><span class="label">累计个人所得</span><span class="value" id="personalTotal"></span></div>
        <div class="total"><span class="label">累计小组所得</span><span class="value" id="groupTotal"></span></div>
      </div>
      <div class="actions">
        <button id="submitBtn" class="primary-action" type="button">提交本轮</button>
        <button id="nextBtn" type="button" hidden>进入下一轮</button>
        <button id="resetBtn" type="button" hidden>用同一种子重置</button>
      </div>
    </div>
    <div class="benchmarks" id="benchmarks"></div>
    <div class="final-note" id="finalNote">
      <div class="result" id="gainResult"></div>
      <div class="result" id="benefitResult"></div>
      <div class="secondary">公共返还人人可得，行动分类只描述本轮，不给人贴固定标签。</div>
    </div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
(function () {
  'use strict';
  Deck.init({ index: 21, total: 50, keys: false });

  var one = Lec.K.units.kilometer_m / Lec.K.units.kilojoule_J;
  var two = Math.round(Lec.K.math.SQRT2);
  var playersN = Math.round(Lec.K.math.E + Lec.K.math.PI - one);
  var roundsN = Math.round(Lec.K.math.PI);
  var endowment = playersN * two;
  var multiplier = (playersN + roundsN) / playersN;
  var agentFixed = playersN + roundsN;
  var randomLow = two;
  var zero = playersN - playersN;
  var names = ['你', '代理甲', '代理乙', '代理丙', '代理丁'];
  var pos = ['p-you', 'p-a', 'p-b', 'p-c', 'p-d'];
  var rng;
  var state;

  var playersEl = document.getElementById('players');
  var slider = document.getElementById('allocation');
  var submitBtn = document.getElementById('submitBtn');
  var nextBtn = document.getElementById('nextBtn');
  var resetBtn = document.getElementById('resetBtn');

  function freshState() {
    rng = new Math.seedrandom('page-21');
    return { round: one, selected: false, contribution: zero, settled: false, trace: [], personal: zero, group: zero, complete: false, intro: true };
  }
  function fmt(n) { return Number(n).toFixed(one); }
  function category(c) {
    if (c === zero) return '搭便车';
    if (c < playersN) return '部分贡献';
    return '贡献';
  }
  function makeTokens(el, count, kind) {
    el.textContent = '';
    for (var i = zero; i < count; i += one) {
      var t = document.createElement('span');
      t.className = 'token ' + kind;
      el.appendChild(t);
    }
  }
  function agentContributions() {
    var adaptive;
    if (state.round === one) adaptive = playersN;
    else {
      var prev = state.trace[state.trace.length - one].contributions;
      adaptive = Math.round(prev.reduce(function(a,b){ return a+b; }, zero) / playersN);
    }
    var random = randomLow + Math.floor(rng() * (agentFixed - randomLow + one));
    return [agentFixed, adaptive, random, zero];
  }
  function accountMarkup(c, share, payoff) {
    return '<div class="lv" aria-label="本轮账目">' +
      '<div class="box account"><span class="label">私人保留</span><span class="value">' + fmt(endowment-c) + '</span></div>' +
      '<div class="box account"><span class="label">公共返还</span><span class="value">' + fmt(share) + '</span></div>' +
      '<div class="box account payoff"><span class="label">本轮所得</span><span class="value">' + fmt(payoff) + '</span></div></div>';
  }
  function renderPlayers(contributions, share, payoffs) {
    playersEl.textContent = '';
    names.forEach(function(name, i) {
      var wrap = document.createElement('article');
      wrap.className = 'participant k-classification ' + pos[i] + (state.intro ? ' animate' : '');
      var action = state.settled ? category(contributions[i]) : (i === zero && state.selected ? category(state.contribution) : '决策隐藏');
      var body = state.settled ? accountMarkup(contributions[i], share, payoffs[i]) : '<div class="hidden-decision">' + (i === zero ? '拖动下方筹码分配尺' : '提交后统一翻牌') + '</div>';
      wrap.innerHTML = '<div class="box"><div class="bt"><span>' + name + '</span><span class="action-tag">' + action + '</span></div>' + body + '</div>';
      playersEl.appendChild(wrap);
    });
    state.intro = false;
  }
  function renderLights() {
    var el = document.getElementById('roundLights');
    el.textContent = '';
    for (var i = one; i <= roundsN; i += one) {
      var light = document.createElement('span');
      light.className = 'round-light' + (i < state.round || state.complete ? ' done' : i === state.round ? ' now' : '');
      light.title = '第 ' + i + ' 轮';
      el.appendChild(light);
    }
    document.getElementById('roundText').textContent = '第 ' + state.round + ' / ' + roundsN + ' 轮';
  }
  function renderAllocation() {
    var c = state.selected ? state.contribution : zero;
    document.getElementById('privateValue').textContent = state.selected ? fmt(endowment-c) : '—';
    document.getElementById('contributionValue').textContent = state.selected ? fmt(c) : '—';
    makeTokens(document.getElementById('privateTokens'), state.selected ? endowment-c : zero, 'private');
    makeTokens(document.getElementById('publicTokens'), state.selected ? c : zero, 'public');
    submitBtn.disabled = state.settled;
    document.getElementById('poolRing').classList.toggle('ready', state.selected && !state.settled);
  }
  function render() {
    renderLights();
    renderAllocation();
    document.getElementById('personalTotal').textContent = fmt(state.personal);
    document.getElementById('groupTotal').textContent = fmt(state.group);
    slider.disabled = state.settled;
    nextBtn.hidden = !(state.settled && !state.complete);
    resetBtn.hidden = !state.complete;
    submitBtn.hidden = state.settled;
    document.getElementById('finalNote').classList.toggle('show', state.complete);
    document.getElementById('flowLines').classList.toggle('settled', state.settled);
    if (!state.settled) {
      renderPlayers([], zero, []);
      document.getElementById('poolValue').textContent = fmt(zero);
      document.getElementById('returnValue').textContent = '总投入 × ' + fmt(multiplier) + ' ÷ ' + playersN;
      document.getElementById('feedbackMain').textContent = '每人拥有 ' + fmt(endowment) + ' 枚筹码；公共池按 ×' + fmt(multiplier) + ' 放大。';
      document.getElementById('feedbackSub').textContent = state.selected ? '已分配完毕，可以提交本轮。' : '先拖动分配尺；未决定前不能结算。';
    }
  }
  function settle() {
    if (!state.selected) {
      var tray = document.getElementById('allocationTray');
      tray.classList.remove('shake');
      void tray.offsetWidth;
      tray.classList.add('shake');
      document.getElementById('feedbackMain').textContent = '还剩 ' + endowment + ' 枚：先决定留给自己还是投入公共池。';
      document.getElementById('feedbackSub').textContent = '拖动分配尺后，全部筹码会同时归入两处。';
      return;
    }
    var contributions = [state.contribution].concat(agentContributions());
    var pool = contributions.reduce(function(a,b){ return a+b; }, zero);
    var publicReturn = pool * multiplier;
    var share = publicReturn / playersN;
    var payoffs = contributions.map(function(c){ return endowment - c + share; });
    var group = payoffs.reduce(function(a,b){ return a+b; }, zero);
    state.personal += payoffs[zero];
    state.group += group;
    state.settled = true;
    state.complete = state.round === roundsN;
    state.trace.push({ round: state.round, contributions: contributions.slice(), pool: pool, share: share, payoffs: payoffs.slice(), group: group });
    render();
    renderPlayers(contributions, share, payoffs);
    document.getElementById('poolValue').textContent = fmt(pool);
    document.getElementById('returnValue').textContent = '公共收益 ' + fmt(publicReturn) + ' · 每人返还 ' + fmt(share);
    document.getElementById('feedbackMain').textContent = '小组投入 ' + fmt(pool) + '，放大后每人获得同额返还。';
    document.getElementById('feedbackSub').textContent = '少投入者保留更多，但公共返还来自全体投入。';
    if (state.complete) finish();
  }
  function finish() {
    var last = state.trace[state.trace.length - one];
    var baseline = playersN * endowment;
    var gain = last.group - baseline;
    var avg = last.contributions.reduce(function(a,b){ return a+b; }, zero) / playersN;
    var below = names.filter(function(_,i){ return last.contributions[i] < avg; });
    document.getElementById('gainResult').textContent = '共同收益比全不投入提高 ' + fmt(gain) + '；合作把分散投入变成额外收益。';
    document.getElementById('benefitResult').textContent = '当轮低于平均投入：' + (below.length ? below.join('、') : '无人') + '。人人都从他人投入中获得返还。';
    document.getElementById('feedbackMain').textContent = '三轮结束：集体总收益可以上升，个人仍可能想少投入。';
    document.getElementById('feedbackSub').textContent = '这就是搭便车诱因，不是某类人的固定本性。';
    document.dispatchEvent(new CustomEvent('game-complete', { detail: { score: state.personal, metrics: { personal: state.personal, group: state.group }, trace: state.trace.slice() } }));
  }
  function nextRound() {
    state.round += one;
    state.selected = false;
    state.contribution = zero;
    state.settled = false;
    slider.value = zero;
    render();
    slider.focus();
  }
  function reset() {
    state = freshState();
    slider.min = zero;
    slider.max = endowment;
    slider.step = one;
    slider.value = zero;
    document.getElementById('classLegend').textContent = '行动分类：贡献 ' + playersN + '–' + endowment + ' · 部分贡献 ' + one + '–' + (playersN-one) + ' · 搭便车 ' + zero;
    document.getElementById('benchmarks').innerHTML = '对照基线：' + playersN + ' 人都不投入，每人 <strong>' + fmt(endowment) + '</strong>；' + playersN + ' 人都投入全部筹码，每人 <strong>' + fmt(endowment * multiplier) + '</strong>。';
    render();
    document.getElementById('gainResult').textContent = '';
    document.getElementById('benefitResult').textContent = '';
    document.dispatchEvent(new CustomEvent('game-reset'));
  }
  slider.addEventListener('input', function () {
    state.selected = true;
    state.contribution = Number(slider.value);
    render();
    document.dispatchEvent(new CustomEvent('game-progress', { detail: { state: JSON.parse(JSON.stringify(state)), action: 'allocate', metrics: { contribution: state.contribution } } }));
  });
  submitBtn.addEventListener('click', settle);
  nextBtn.addEventListener('click', nextRound);
  resetBtn.addEventListener('click', reset);
  reset();
  document.dispatchEvent(new CustomEvent('game-start'));
}());
</script>
</body>
</html>
