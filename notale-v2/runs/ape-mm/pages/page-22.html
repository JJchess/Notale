<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:28px 42px 24px;gap:16px}
  .eyebrow{color:var(--primary);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.13em}
  .topline{display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
  .take{max-width:700px;margin:0;color:var(--muted);font-size:var(--fs-lead);line-height:1.5;text-align:right}
  .workbench{display:flex;gap:18px;min-height:0}
  .compare-wrap{display:flex;flex-direction:column;gap:10px;width:500px;min-width:0}
  .compare-wrap .k-comparison{grid-template-columns:120px repeat(2,minmax(0,1fr));box-shadow:var(--shadow-panel)}
  .compare-wrap .k-comparison>.hdr,.compare-wrap .k-comparison>.dim,.compare-wrap .k-comparison>.cell{padding:10px 12px}
  .compare-wrap .k-comparison>.hdr{font-size:20px}
  .compare-wrap .k-comparison>.cell,.compare-wrap .k-comparison>.dim{font-size:16px;line-height:1.4}
  .compare-wrap .k-comparison>.dim{justify-content:flex-start;text-align:left}
  .bio-head{color:var(--primary)!important}
  .culture-head{color:var(--accent)!important}
  .playfield{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;border:1px solid var(--line-strong);border-radius:var(--radius-2);background:linear-gradient(90deg,var(--primary-soft),transparent 39%,transparent 61%,var(--accent-soft)),var(--panel-deep);box-shadow:var(--shadow-panel)}
  .playbar{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  .playbar strong{font-size:var(--fs-sec)}
  .playbar span{font-size:var(--fs-label);color:var(--muted)}
  #loopSvg{width:100%;height:100%;min-height:0;touch-action:none}
  #loopSvg text{font-family:var(--font-sans);pointer-events:none}
  .lane-title{font-size:19px;font-weight:750;letter-spacing:.03em}
  .slot-label{fill:var(--muted);font-size:16px;font-weight:650}
  .slot circle.visible{fill:var(--panel);stroke:var(--primary);stroke-width:2;stroke-dasharray:5 6}
  .slot.culture circle.visible{stroke:var(--accent)}
  .slot.ready circle.visible{stroke:var(--accent);stroke-dasharray:none;filter:drop-shadow(0 0 7px var(--accent))}
  .link{fill:none;stroke:var(--primary);stroke-width:2;stroke-dasharray:7 7;opacity:.42;marker-end:url(#arrow)}
  .link.cross{stroke:var(--accent)}
  .link.on{stroke:var(--accent);stroke-dasharray:none;opacity:1}
  .piece{cursor:grab;outline:none}
  .piece:focus .hit{stroke:var(--text);stroke-width:2}
  .piece .hit{fill:transparent;stroke:transparent;stroke-width:2}
  .piece .disc{fill:var(--panel-raised);stroke:var(--primary);stroke-width:3}
  .piece.culture .disc{stroke:var(--accent)}
  .piece text{fill:var(--text);font:750 20px/1 var(--font-mono);text-anchor:middle;dominant-baseline:central}
  .piece.placed .disc{stroke:var(--accent);filter:drop-shadow(0 0 8px var(--accent))}
  .piece.wrong .disc{stroke:var(--danger)}
  .preview{fill:none;stroke:var(--text);stroke-width:2;stroke-dasharray:3 4;opacity:0}
  .preview.on{opacity:.8}
  .flow-dot{fill:var(--accent);filter:drop-shadow(0 0 6px var(--accent));opacity:0}
  .legend-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;padding:0 12px 12px;color:var(--muted);font-size:16px;line-height:1.4}
  .legend-list div{display:flex;gap:8px;align-items:flex-start}
  .legend-list b{flex:0 0 24px;color:var(--text);font-family:var(--font-mono)}
  .statusbar{display:flex;align-items:center;gap:18px;height:76px;padding:12px 18px;border:1px solid var(--line);border-radius:var(--radius-2);background:var(--panel)}
  .progress{min-width:270px;color:var(--primary);font:700 var(--fs-body)/1.4 var(--font-mono)}
  #feedback{flex:1;color:var(--muted);font-size:var(--fs-sec);line-height:1.5}
  #feedback.done{color:var(--text);font-size:var(--fs-body);font-weight:700}
  #resetBtn{min-height:40px;padding:7px 16px;border:1px solid var(--accent);border-radius:var(--radius-1);color:var(--accent);background:var(--accent-soft);font-size:16px;cursor:pointer}
  #resetBtn[hidden]{display:none}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
  .piece.wrong{animation:shake 220ms ease-out}
  @media (prefers-reduced-motion:reduce){.piece.wrong{animation:none}}
</style>
</head>
<body data-page="22" data-total="50">
<div id="stage">
  <header style="height:92px" class="col justify-between">
    <div class="eyebrow">GENE × CULTURE</div>
    <div class="topline">
      <h1>两种变化，一条回路</h1>
      <p class="take">生物演化与文化环境可以相互影响，但速度和机制不同。</p>
    </div>
  </header>

  <main style="flex:1" class="workbench min0">
    <section class="compare-wrap min0" aria-labelledby="compareTitle">
      <h2 id="compareTitle">先对齐四把尺子</h2>
      <div class="k-comparison min0" style="--compare-n:2">
        <div class="hdr">比较维度</div><div class="hdr bio-head">生物演化</div><div class="hdr culture-head">文化变化</div>
        <div class="rowline"></div>
        <div class="dim">差异从哪里来</div><div class="cell">可遗传变异</div><div class="cell diff">发明、借用与重新组合</div>
        <div class="rowline"></div>
        <div class="dim">怎样传下去</div><div class="cell">繁殖中的遗传</div><div class="cell diff">模仿、教学、语言与制度</div>
        <div class="rowline"></div>
        <div class="dim">比例怎样改变</div><div class="cell">差异性生存与繁殖，跨多个世代</div><div class="cell diff">一生内可学习，也可迅速扩散或消失</div>
        <div class="rowline"></div>
        <div class="dim">直接改变什么</div><div class="cell">群体中可遗传特征的比例</div><div class="cell diff">行为、工具、规则与选择环境</div>
      </div>
      <p class="note" style="margin:0">两栏不是先后阶段，也不共用一条速度刻度。</p>
    </section>

    <section class="playfield min0 no-pan" style="flex:1" aria-labelledby="gameTitle">
      <div class="playbar">
        <strong id="gameTitle">把编号节点拖入反馈回路</strong>
        <span>键盘：方向键选位置，Enter 放置</span>
      </div>
      <svg id="loopSvg" viewBox="0 0 1040 560" role="group" aria-label="基因与文化反馈回路拼接图">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"></path></marker>
        </defs>
      </svg>
      <div id="nodeLegend" class="legend-list" aria-label="节点编号说明"></div>
    </section>
  </main>

  <footer style="height:76px" class="statusbar">
    <div id="progress" class="progress" aria-live="polite"></div>
    <div id="feedback" aria-live="polite">文化不会按需要直接改写基因；先找出它改变的环境。</div>
    <button id="resetBtn" type="button" hidden>重置回路</button>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:22,total:50});
  const svg=d3.select('#loopSvg');
  const reduced=Deck.reduced();
  const nodes=[
    {id:0,label:'饲养产奶动物成为文化实践',side:'culture'},
    {id:1,label:'成年后饮奶成为新的食物环境',side:'cross'},
    {id:2,label:'成人乳糖消化能力存在可遗传差异',side:'bio'},
    {id:3,label:'特定环境中，相关变异的群体比例改变',side:'bio'},
    {id:4,label:'更多成人能够利用鲜奶',side:'cross'},
    {id:5,label:'乳业实践获得继续扩展的条件之一',side:'culture'}
  ];
  const slots=[
    {x:820,y:100,tx:872,ty:98,anchor:'start',short:'饲养与乳业实践',side:'culture'},
    {x:520,y:170,tx:520,ty:116,anchor:'middle',short:'新的食物环境',side:'cross'},
    {x:220,y:240,tx:168,ty:238,anchor:'end',short:'可遗传差异',side:'bio'},
    {x:220,y:365,tx:168,ty:363,anchor:'end',short:'群体比例改变',side:'bio'},
    {x:520,y:435,tx:520,ty:490,anchor:'middle',short:'利用鲜奶',side:'cross'},
    {x:820,y:365,tx:872,ty:363,anchor:'start',short:'扩展条件之一',side:'culture'}
  ];
  const startX=[90,262,434,606,778,950], startY=515;
  let state;
  const feedback=document.getElementById('feedback');
  const progress=document.getElementById('progress');
  const resetBtn=document.getElementById('resetBtn');

  const defs=svg.select('defs');
  const guide=svg.append('g').attr('aria-hidden','true');
  guide.append('text').attr('class','lane-title').attr('x',220).attr('y',42).attr('text-anchor','middle').attr('fill','var(--primary)').text('跨世代比例变化');
  guide.append('text').attr('class','lane-title').attr('x',820).attr('y',42).attr('text-anchor','middle').attr('fill','var(--accent)').text('可在一生内传播');
  guide.append('line').attr('x1',220).attr('y1',65).attr('x2',220).attr('y2',410).attr('stroke','var(--primary-line)').attr('stroke-width',2);
  guide.append('line').attr('x1',820).attr('y1',65).attr('x2',820).attr('y2',410).attr('stroke','var(--accent-line)').attr('stroke-width',2);

  const pathFor=(a,b)=>{
    const s=slots[a],t=slots[b];
    if((a===0&&b===1)||(a===1&&b===2)) return `M${s.x},${s.y} Q${(s.x+t.x)/2},${Math.min(s.y,t.y)-34} ${t.x},${t.y}`;
    if((a===3&&b===4)||(a===4&&b===5)) return `M${s.x},${s.y} Q${(s.x+t.x)/2},${Math.max(s.y,t.y)+34} ${t.x},${t.y}`;
    if(a===5&&b===0) return `M${s.x},${s.y-44} L${t.x},${t.y+44}`;
    return `M${s.x},${s.y+44} L${t.x},${t.y-44}`;
  };
  const links=d3.range(nodes.length).map(i=>({a:i,b:(i+1)%nodes.length,cross:(i<2)||(i===3||i===4)}));
  const linkSel=guide.selectAll('path.link').data(links).join('path').attr('class',d=>'link'+(d.cross?' cross':'' )).attr('d',d=>pathFor(d.a,d.b));
  const slotSel=guide.selectAll('g.slot').data(slots).join('g').attr('class',d=>'slot '+d.side).attr('transform',d=>`translate(${d.x},${d.y})`);
  slotSel.append('circle').attr('class','visible').attr('r',42);
  slotSel.append('circle').attr('r',58).attr('fill','transparent');
  guide.selectAll('text.slot-label').data(slots).join('text').attr('class','slot-label').attr('x',d=>d.tx).attr('y',d=>d.ty).attr('text-anchor',d=>d.anchor).text(d=>d.short);
  guide.append('path').attr('d','M70 548 Q520 505 970 548').attr('fill','none').attr('stroke','var(--primary-line)').attr('stroke-width',2).attr('opacity',.42);
  const flow=guide.append('circle').attr('class','flow-dot').attr('r',7);

  const piecesLayer=svg.append('g');
  const pieceSel=piecesLayer.selectAll('g.piece').data(nodes).join('g')
    .attr('class',d=>'piece '+(d.side==='culture'?'culture':''))
    .attr('role','button').attr('tabindex',0)
    .attr('aria-label',d=>`${d.id+1}，${d.label}`)
    .each(function(d){d.x=startX[d.id];d.y=startY;d.homeX=d.x;d.homeY=d.y;d.choice=d.id;});
  pieceSel.append('circle').attr('class','hit').attr('r',58);
  pieceSel.append('circle').attr('class','disc').attr('r',42);
  pieceSel.append('text').text(d=>d.id+1);
  pieceSel.call(d3.drag().on('start',dragStart).on('drag',dragged).on('end',dragEnd));

  d3.select('#nodeLegend').selectAll('div').data(nodes).join('div').html(d=>`<b>${d.id+1}</b><span>${d.label}</span>`);

  function fresh(){return {placed:Array(nodes.length).fill(false),positions:nodes.map((d,i)=>({x:startX[i],y:startY})),selected:Array(nodes.length).fill(null)};}
  function setTransform(sel,d){sel.attr('transform',`translate(${d.x},${d.y})`);}
  function dragStart(event,d){if(state.placed[d.id])return;d3.select(this).raise().style('cursor','grabbing');}
  function dragged(event,d){if(state.placed[d.id])return;d.x=Deck.clamp(event.x,58,982);d.y=Deck.clamp(event.y,58,515);setTransform(d3.select(this),d);}
  function dragEnd(event,d){d3.select(this).style('cursor','grab');if(state.placed[d.id])return;attempt(d,nearest(d.x,d.y));}
  function nearest(x,y){let best=0,dist=Infinity;slots.forEach((s,i)=>{const q=Math.hypot(x-s.x,y-s.y);if(q<dist){dist=q;best=i;}});return dist<=48?best:-1;}
  function attempt(d,target){
    if(target===d.id){place(d);return;}
    const el=pieceSel.filter(x=>x.id===d.id);
    el.classed('wrong',true);
    feedback.className='';
    feedback.textContent=target===-1?'把节点拖到虚线圆内，箭头会随因果顺序接通。':(target<2?'箭头方向反了：文化实践先改变食物环境。':'这里混淆了传递机制：遗传靠繁殖，文化靠学习。');
    if(!reduced)setTimeout(()=>el.classed('wrong',false),240);else el.classed('wrong',false);
    returnHome(d);
  }
  function returnHome(d){d.x=d.homeX;d.y=d.homeY;const el=pieceSel.filter(x=>x.id===d.id);if(reduced)setTransform(el,d);else el.transition().duration(240).ease(d3.easeCubicOut).attr('transform',`translate(${d.x},${d.y})`);}
  function place(d){
    const s=slots[d.id];d.x=s.x;d.y=s.y;state.placed[d.id]=true;state.selected[d.id]=d.id;
    const el=pieceSel.filter(x=>x.id===d.id).classed('placed',true).attr('aria-disabled','true');
    if(reduced)setTransform(el,d);else el.transition().duration(240).ease(d3.easeCubicOut).attr('transform',`translate(${d.x},${d.y})`);
    update();pulseFrom(d.id);
  }
  function linkOn(l){return state.placed[l.a]&&state.placed[l.b];}
  function crossDone(){return Number(state.placed[0]&&state.placed[1]&&state.placed[2])+Number(state.placed[3]&&state.placed[4]&&state.placed[5]);}
  function update(){
    const count=state.placed.filter(Boolean).length;
    linkSel.classed('on',linkOn);
    slotSel.classed('ready',(d,i)=>state.placed[i]);
    progress.textContent=`回路节点 ${count}/${nodes.length}｜跨栏连接 ${crossDone()}/2`;
    if(count===nodes.length){
      feedback.className='done';
      feedback.textContent='文化改变选择环境；生物变化又影响文化条件。两者机制不同，也不是必然增强。';
      resetBtn.hidden=false;runFlow();
    }else if(count>0){feedback.className='';feedback.textContent='已吸附的位置持续发光；沿箭头继续补全因果顺序。';}
  }
  function pulseFrom(i){
    const l=links.find(x=>x.a===i&&linkOn(x));if(!l||reduced)return;
    const path=linkSel.filter(x=>x===l).node();const len=path.getTotalLength();flow.attr('opacity',1);
    d3.transition().duration(600).ease(d3.easeCubicInOut).tween('flow',()=>t=>{const p=path.getPointAtLength(t*len);flow.attr('cx',p.x).attr('cy',p.y);}).on('end',()=>flow.attr('opacity',0));
  }
  function runFlow(){
    if(reduced){flow.attr('opacity',0);return;}
    const paths=linkSel.nodes(),lengths=paths.map(p=>p.getTotalLength()),total=d3.sum(lengths);
    flow.attr('opacity',1);
    d3.transition().duration(1800).ease(d3.easeLinear).tween('loop',()=>t=>{let q=t*total,idx=0;while(idx<lengths.length-1&&q>lengths[idx])q-=lengths[idx++];const p=paths[idx].getPointAtLength(q);flow.attr('cx',p.x).attr('cy',p.y);}).on('end',()=>flow.attr('opacity',0));
  }
  pieceSel.on('keydown',function(event,d){
    if(state.placed[d.id])return;
    if(['ArrowRight','ArrowDown'].includes(event.key)){event.preventDefault();d.choice=(d.choice+1)%slots.length;showPreview(d);}
    if(['ArrowLeft','ArrowUp'].includes(event.key)){event.preventDefault();d.choice=(d.choice+slots.length-1)%slots.length;showPreview(d);}
    if(event.key==='Enter'||event.key===' '){event.preventDefault();attempt(d,d.choice);}
  }).on('focus',function(event,d){showPreview(d);}).on('blur',()=>svg.selectAll('.preview').classed('on',false));
  function showPreview(d){
    let p=guide.selectAll('circle.preview').data([slots[d.choice]]).join('circle').attr('class','preview on').attr('r',49);
    p.attr('cx',x=>x.x).attr('cy',x=>x.y);
    feedback.className='';feedback.textContent=`候选位置：${slots[d.choice].short}。按 Enter 放置。`;
  }
  function reset(){
    state=fresh();nodes.forEach((d,i)=>{d.x=startX[i];d.y=startY;d.choice=d.id;});
    pieceSel.interrupt().classed('placed wrong',false).attr('aria-disabled',null).each(function(d){setTransform(d3.select(this),d);});
    linkSel.classed('on',false);slotSel.classed('ready',false);flow.attr('opacity',0);resetBtn.hidden=true;feedback.className='';feedback.textContent='文化不会按需要直接改写基因；先找出它改变的环境。';update();
  }
  resetBtn.addEventListener('click',reset);
  reset();
  if(!reduced){
    pieceSel.attr('opacity',0).attr('transform',d=>`translate(${d.x},${d.y+14})`).transition().delay((d,i)=>i*55).duration(420).ease(d3.easeCubicOut).attr('opacity',1).attr('transform',d=>`translate(${d.x},${d.y})`);
  }
  window.page22={reset,placeAll:function(){nodes.forEach(d=>{if(!state.placed[d.id])place(d);});},placeOne:function(){if(!state.placed[0])place(nodes[0]);}};
})();
</script>
</body>
</html>
