<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root{--evidence-unsupported:#71808C}
  #stage{padding:28px 40px 24px;gap:14px;background:
    linear-gradient(180deg,rgba(89,195,195,.045),transparent 26%),
    repeating-linear-gradient(0deg,transparent 0,transparent 43px,rgba(89,195,195,.045) 44px,transparent 46px),var(--bg)}
  .page-head{height:96px;display:flex;align-items:flex-start;justify-content:space-between;gap:40px}
  .kicker{color:var(--primary);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.16em}
  .take{max-width:600px;margin:24px 0 0;color:var(--muted);font-size:var(--fs-lead);line-height:1.5;text-align:right}
  .progress-strip{height:58px;display:flex;align-items:center;gap:18px;padding:0 18px;border:1px solid var(--line);border-radius:var(--radius-2);background:var(--panel-deep)}
  .progress-label{min-width:118px;color:var(--text);font-size:var(--fs-sec);font-weight:750}
  .progress-nodes{display:flex;flex:1;align-items:center}
  .pnode{position:relative;display:flex;flex:1;align-items:center;gap:10px;color:var(--faint);font-size:var(--fs-label);font-weight:650}
  .pnode:not(:last-child)::after{height:2px;flex:1;margin-right:10px;content:"";background:var(--line-strong)}
  .pnode.current{color:var(--accent)} .pnode.current .relay-node{transform:scale(1.35);background:var(--accent);box-shadow:0 0 18px rgba(255,181,71,.72)}
  .pnode.done{color:var(--primary)} .pnode.done .relay-node{border-color:var(--primary);background:var(--primary)}
  .work-area{position:relative;display:flex;flex:1;min-height:0;gap:14px}
  .evidence-rail{width:300px;flex:0 0 300px;--enum-cols:1;grid-template-columns:1fr;grid-template-rows:repeat(4,minmax(0,1fr));gap:10px}
  .evidence-rail>.it{position:relative;padding:12px 16px;gap:5px;border-top-width:1px;justify-content:center;transition:border-color .2s,background .2s}
  .evidence-rail>.it .title{font-size:var(--fs-sec)}
  .evidence-rail>.it .content{display:flex;align-items:center;gap:7px;font-size:var(--fs-label);line-height:1.4}
  .mini-step{height:6px;flex:1;border-radius:999px;background:var(--line-strong)}
  .it.current .mini-step{background:var(--accent)} .it.done .mini-step{background:var(--primary)}
  .it.done{border-color:var(--primary-line)}
  .bench{position:relative;display:flex;flex:1;min-width:0;gap:12px;padding:14px;border:1px solid var(--line-strong);border-radius:var(--radius-3);background:rgba(9,22,32,.96);box-shadow:var(--shadow-panel);overflow:hidden}
  .bench::before{position:absolute;inset:0;content:"";pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 37px,rgba(89,195,195,.035) 38px)}
  .chamber{position:relative;z-index:1;display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px;border:1px solid var(--line);border-radius:var(--radius-2);background:var(--panel)}
  .photo-chamber{flex:1.02}.claim-chamber{flex:1.18}.slot-chamber{flex:.82}
  .chamber-head{height:36px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);color:var(--text);font-family:var(--font-title);font-size:var(--fs-h2);font-weight:700}
  .step-tag{color:var(--faint);font:650 var(--fs-label)/1.4 var(--font-mono)}
  .photo-wrap{--reveal-x:8%;position:relative;flex:1;min-height:0;margin-top:12px;overflow:hidden;border:1px solid var(--line-strong);border-radius:var(--radius-2);background:var(--panel-deep);touch-action:none}
  .photo-wrap img{width:100%;height:100%;object-fit:cover;filter:saturate(.76) contrast(1.08)}
  .mark-layer{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--reveal-x)) 0 0);background:rgba(7,16,24,.16);pointer-events:none}
  .mark-layer svg{width:100%;height:100%;display:block}
  .mark-layer .mark{fill:none;stroke:var(--accent);stroke-width:3;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 5px rgba(255,181,71,.75))}
  .mark-layer .guide{fill:none;stroke:var(--primary);stroke-width:2;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
  .reveal-line{position:absolute;top:0;bottom:0;left:var(--reveal-x);width:2px;background:var(--accent);box-shadow:0 0 12px rgba(255,181,71,.7);pointer-events:none}
  .reveal-line::after{position:absolute;top:50%;left:50%;width:24px;height:42px;border:2px solid var(--accent);border-radius:999px;content:"↔";display:grid;place-items:center;color:var(--accent);background:var(--panel-deep);font-size:16px;transform:translate(-50%,-50%)}
  .reveal-control{margin-top:10px}.reveal-control input{width:100%;min-height:24px}
  .observation{min-height:50px;margin-top:8px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
  .claim-stack{display:flex;flex:1;flex-direction:column;justify-content:center;gap:12px;padding-top:12px}
  .claim-card{position:relative;min-height:82px;padding:12px 46px 12px 16px;border:1px solid var(--line-strong);border-radius:var(--radius-2);color:var(--text);background:var(--panel-raised);font-size:var(--fs-sec);line-height:1.45;text-align:left;cursor:grab;touch-action:none;transition:transform .18s,border-color .18s,opacity .18s}
  .claim-card::before{position:absolute;right:14px;top:50%;content:"⋮⋮";color:var(--faint);font-size:20px;letter-spacing:-5px;transform:translateY(-50%)}
  .claim-card.selected{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
  .claim-card.correct{border-color:var(--primary);color:var(--primary);cursor:default;opacity:.78}
  .claim-card.dragging{z-index:5;cursor:grabbing;transition:none;box-shadow:0 18px 40px rgba(0,0,0,.4)}
  .claim-card.wrong{animation:shake .34s ease}
  @keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}
  .slot-stack{display:flex;flex:1;flex-direction:column;justify-content:center;gap:12px;padding-top:12px}
  .strength-slot{display:flex;min-height:105px;flex-direction:column;justify-content:center;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:var(--radius-2);background:var(--panel-deep)}
  .strength-slot strong{font-size:var(--fs-sec)} .strength-slot span{color:var(--muted);font-size:var(--fs-label);line-height:1.4}
  .strength-slot[data-kind="direct"]{border-left:5px solid var(--primary)}
  .strength-slot[data-kind="compatible"]{border-left:5px solid var(--accent)}
  .strength-slot[data-kind="unsupported"]{border-left:5px solid var(--evidence-unsupported)}
  .strength-slot.target{outline:2px solid var(--accent);outline-offset:2px}
  .strength-slot.hit{border-style:solid;background:var(--primary-soft)}
  .links{position:absolute;z-index:3;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .links line{stroke:var(--primary);stroke-width:2;filter:drop-shadow(0 0 5px rgba(89,195,195,.8));animation:pulse .55s ease-out}
  @keyframes pulse{0%{stroke-width:7;opacity:.2}100%{stroke-width:2;opacity:1}}
  .feedback{height:86px;display:flex;align-items:center;gap:20px;padding:12px 18px;border:1px solid var(--line);border-radius:var(--radius-2);background:var(--panel-deep)}
  .feedback-text{flex:1;min-width:0}.feedback-main{color:var(--text);font-size:var(--fs-body);font-weight:700;line-height:1.4}.feedback-sub{color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
  .reset{min-height:42px;padding:8px 18px;border:1px solid var(--line-strong);border-radius:var(--radius-1);color:var(--text);background:var(--panel);font-size:var(--fs-sec);cursor:pointer}
  .reset:hover{border-color:var(--primary)}
  .final-frame{display:none;flex:1;min-height:0}.final-frame.show{display:flex}.work-area.hidden{display:none}
  .final-list{--enum-cols:1;width:100%;grid-template-columns:1fr;grid-template-rows:repeat(4,minmax(0,1fr));gap:10px}
  .final-list>.it{display:grid;grid-template-columns:260px 1fr 1.2fr 1.2fr;align-items:center;gap:18px;padding:14px 20px;border-top-width:1px}
  .final-list .ev-name{color:var(--text);font-size:var(--fs-sec);font-weight:750}.final-list .cell{padding-left:14px;border-left:2px solid var(--line-strong);color:var(--muted);font-size:var(--fs-sec);line-height:1.45}.final-list .cell.keep{border-color:var(--primary);color:var(--text)}
  @media (prefers-reduced-motion:reduce){.claim-card,.evidence-rail>.it{transition:none}.claim-card.wrong,.links line{animation:none}}
</style>
</head>
<body data-page="26" data-total="50">
<div id="stage">
  <header class="page-head">
    <div>
      <div class="kicker">EVIDENCE LIMITS · E3</div>
      <h1>证据不会自己讲成故事</h1>
    </div>
    <p class="take">化石、工具、颜料和遗址，只能支持有边界的推断。</p>
  </header>

  <div class="progress-strip" aria-label="检视进度">
    <div class="progress-label" id="progressText">已判定</div>
    <div class="progress-nodes" id="progressNodes"></div>
  </div>

  <main class="work-area min0" id="workArea">
    <section class="k-enumeration evidence-rail min0" id="evidenceRail" aria-label="四类同级证据"></section>
    <section class="bench min0" id="bench">
      <svg class="links" id="links" aria-hidden="true"></svg>
      <section class="chamber photo-chamber min0">
        <div class="chamber-head"><span>照片检视</span><span class="step-tag">可见痕迹</span></div>
        <div class="photo-wrap no-pan" id="photoWrap">
          <img id="evidencePhoto" class="photo" alt="">
          <div class="mark-layer" aria-hidden="true">
            <svg viewBox="0 0 400 260" preserveAspectRatio="none">
              <ellipse class="mark" cx="145" cy="128" rx="88" ry="68"></ellipse>
              <path class="guide" d="M205 80 L318 38 M215 170 L335 214"></path>
              <circle class="mark" cx="327" cy="35" r="9"></circle>
              <circle class="mark" cx="342" cy="217" r="9"></circle>
            </svg>
          </div>
          <div class="reveal-line" aria-hidden="true"></div>
        </div>
        <label class="ctl reveal-control">拖动揭开标注
          <input id="reveal" type="range" min="8" max="92" step="8" value="8" aria-label="照片标注揭示范围">
        </label>
        <div class="observation" id="observation"></div>
      </section>

      <section class="chamber claim-chamber min0">
        <div class="chamber-head"><span>推断选择</span><span class="step-tag">拖到右侧刻度</span></div>
        <div class="claim-stack" id="claimStack"></div>
      </section>

      <section class="chamber slot-chamber min0">
        <div class="chamber-head"><span>边界判定</span><span class="step-tag">推断强度</span></div>
        <div class="slot-stack" id="slotStack">
          <div class="strength-slot" data-kind="direct"><strong>直接支持</strong><span>痕迹本身即可约束这句话</span></div>
          <div class="strength-slot" data-kind="compatible"><strong>相容但不足</strong><span>说得通，还需要独立证据</span></div>
          <div class="strength-slot" data-kind="unsupported"><strong>证据不支持</strong><span>加入了看不见的制度或剧情</span></div>
        </div>
      </section>
    </section>
  </main>

  <section class="final-frame min0" id="finalFrame" aria-label="证据推断总框架">
    <div class="k-enumeration final-list" id="finalList"></div>
  </section>

  <footer class="feedback" aria-live="polite">
    <div class="relay-node" aria-hidden="true"></div>
    <div class="feedback-text">
      <div class="feedback-main" id="feedbackMain">先揭开标注，再判断三句话离证据有多远。</div>
      <div class="feedback-sub" id="feedbackSub">键盘：聚焦主张卡，用左右键选刻度，按 Enter 放置。</div>
    </div>
    <button class="reset" id="reset" type="button">重置工作台</button>
  </footer>
</div>

    document.getElementById('progressText').textContent='已判定 '+completed.length+'/'+evidence.length;
    Array.from(rail.children).forEach(function(el,i){el.classList.toggle('current',i===index&&!completed[i]);el.classList.toggle('done',!!completed[i]);el.querySelector('.state').textContent=completed[i]?'已归位':(i===index?'正在检视':'待检视');});
    Array.from(nodes.children).forEach(function(el,i){el.classList.toggle('current',i===index&&!completed[i]);el.classList.toggle('done',!!completed[i]);});
  }
  function renderEvidence(){
    var e=evidence[index]; placed=0; selectedSlot=0; links.innerHTML='';
    photo.src=e.photo; photo.alt=e.alt; photo.title=e.credit;
    observation.textContent=e.observe;
    reveal.value='8'; setReveal(8);
    stack.innerHTML=e.claims.map(function(c,i){return '<button type="button" class="claim-card" data-kind="'+c[1]+'" data-card="'+i+'" aria-label="主张：'+c[0]+'。可拖动，或用左右键选择推断强度后按回车。">'+c[0]+'</button>';}).join('');
    Array.from(stack.children).forEach(bindCard);
    slots.forEach(function(s){s.classList.remove('hit','target');});
    updateProgress();
    feedbackMain.textContent='先揭开标注，再判断三句话离证据有多远。';
    feedbackSub.textContent='遗物提供受约束的线索，不是带旁白的录像。';
  }
  function setReveal(v){wrap.style.setProperty('--reveal-x',Deck.clamp(Number(v),8,92)+'%');}
  reveal.addEventListener('input',function(){setReveal(reveal.value);});
  function pointerReveal(e){if(e.buttons!==1&&e.type==='pointermove')return;var p=Deck.pt(wrap,e);setReveal(8+84*Deck.clamp(p.x/wrap.offsetWidth,0,1));reveal.value=String(Math.round((8+84*Deck.clamp(p.x/wrap.offsetWidth,0,1))/8)*8);}
  wrap.addEventListener('pointerdown',function(e){wrap.setPointerCapture(e.pointerId);pointerReveal(e);});
  wrap.addEventListener('pointermove',pointerReveal);

  function bindCard(card){
    card.addEventListener('keydown',function(e){
      if(card.classList.contains('correct'))return;
      if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
        e.preventDefault();selectedSlot=(selectedSlot+(e.key==='ArrowRight'?1:-1)+kinds.length)%kinds.length;
        slots.forEach(function(s,i){s.classList.toggle('target',i===selectedSlot);});
        feedbackMain.textContent='已选择“'+labels[kinds[selectedSlot]]+'”';feedbackSub.textContent='按 Enter 放置这张主张卡。';
      }else if(e.key==='Enter'||e.key===' '){e.preventDefault();attempt(card,kinds[selectedSlot]);}
    });
    card.addEventListener('pointerdown',function(e){
      if(card.classList.contains('correct'))return;
      dragging={card:card,id:e.pointerId,x:e.clientX,y:e.clientY};card.setPointerCapture(e.pointerId);card.classList.add('dragging');
    });
    card.addEventListener('pointermove',function(e){if(!dragging||dragging.id!==e.pointerId)return;card.style.transform='translate('+((e.clientX-dragging.x)/Deck.s)+'px,'+((e.clientY-dragging.y)/Deck.s)+'px)';var hit=document.elementFromPoint(e.clientX,e.clientY);slots.forEach(function(s){s.classList.toggle('target',!!hit&&(hit===s||s.contains(hit)));});});
    card.addEventListener('pointerup',function(e){
      if(!dragging||dragging.id!==e.pointerId)return;var hit=document.elementFromPoint(e.clientX,e.clientY);var slot=slots.find(function(s){return hit&&(hit===s||s.contains(hit));});card.classList.remove('dragging');card.style.transform='';slots.forEach(function(s){s.classList.remove('target');});dragging=null;if(slot)attempt(card,slot.dataset.kind);
    });
  }
  function attempt(card,kind){
    if(card.dataset.kind===kind){
      card.classList.add('correct');card.disabled=true;placed++;var slot=slots.find(function(s){return s.dataset.kind===kind;});slot.classList.add('hit');drawLine(card,slot);
      feedbackMain.textContent='这一步没有越过证据。';feedbackSub.textContent='主张与可见痕迹的距离，和推断强度相符。';
      if(placed===evidence[index].claims.length){completed[index]=true;updateProgress();setTimeout(nextEvidence,650);}
    }else{
      card.classList.remove('wrong');void card.offsetWidth;card.classList.add('wrong');
      feedbackMain.textContent='这句话越过了当前证据。';feedbackSub.textContent='删去关于动机、制度或具体剧情的部分，再判断。';
    }
  }
  function drawLine(card,slot){
    var br=bench.getBoundingClientRect(),cr=card.getBoundingClientRect(),sr=slot.getBoundingClientRect();
    var line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',(cr.right-br.left)/Deck.s);line.setAttribute('y1',(cr.top+cr.height/2-br.top)/Deck.s);
    line.setAttribute('x2',(sr.left-br.left)/Deck.s);line.setAttribute('y2',(sr.top+sr.height/2-br.top)/Deck.s);line.dataset.card=card.dataset.card;line.dataset.kind=slot.dataset.kind;links.appendChild(line);
  }
  function redrawLines(){links.innerHTML='';Array.from(stack.querySelectorAll('.claim-card.correct')).forEach(function(c){drawLine(c,slots.find(function(s){return s.dataset.kind===c.dataset.kind;}));});}
  Deck.onResize(redrawLines);
  function nextEvidence(){if(completed.length>=evidence.length&&completed.filter(Boolean).length===evidence.length){finish();return;}index++;renderEvidence();}
  function finish(){
    document.getElementById('workArea').classList.add('hidden');var frame=document.getElementById('finalFrame');frame.classList.add('show');
    var summary=[['愈合损伤、伤后存活','与长期照料相容','医疗制度与特定情感'],['击打面与剥片关系','有步骤的石料处理','现代语言与理论说明'],['重复刻线与颜料痕迹','有意刻画与颜料处理','图案含义与艺术起源日'],['遗物聚集与拼合关系','活动区域与物料移动','确定剧情、住所与等级']];
    document.getElementById('finalList').innerHTML=evidence.map(function(e,i){return '<article class="it"><div class="ev-name">'+e.name+'</div><div class="cell">可观察：'+summary[i][0]+'</div><div class="cell keep">有限推断：'+summary[i][1]+'</div><div class="cell">保留未知：'+summary[i][2]+'</div></article>';}).join('');
    feedbackMain.textContent='可观察 → 有限推断 → 保留未知';feedbackSub.textContent='推断越具体，越需要更多独立证据彼此吻合。';
    index=evidence.length;updateProgress();
  }
  document.getElementById('reset').addEventListener('click',function(){index=0;completed=[];document.getElementById('workArea').classList.remove('hidden');document.getElementById('finalFrame').classList.remove('show');renderEvidence();});
  buildStatic();renderEvidence();Deck.init({index:26,total:50,keys:false});
})();
</script>
