<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:30px 64px 28px;isolation:isolate}
  .scene-head{height:132px;flex:0 0 132px;position:relative;z-index:4}
  .kicker{color:var(--primary);font:700 15px/1.4 var(--font-mono);letter-spacing:.14em}
  .scene-head h1{margin-top:5px;font-size:64px;line-height:1.08;letter-spacing:.015em}
  .scene-head .lead{margin:8px 0 0;max-width:1180px;color:var(--muted)}
  .plate{position:relative;flex:1;min-height:0;width:100%;overflow:hidden}
  .plate::before,.plate::after{position:absolute;z-index:3;width:26px;height:26px;content:"";pointer-events:none}
  .plate::before{left:0;top:0;border-left:1px solid var(--primary-line);border-top:1px solid var(--primary-line)}
  .plate::after{right:0;bottom:0;border-right:1px solid var(--primary-line);border-bottom:1px solid var(--primary-line)}
  .k-generalization{display:block;position:relative;min-height:0}
  .k-generalization>.trunk{position:absolute;inset:0}
  .k-generalization>.trunk::before{display:none}
  .diagram-field{position:absolute;inset:0}
  .diagram-field svg{width:100%;height:100%;display:block}
  .support-layer{position:absolute!important;inset:0;display:block!important;padding:0!important;min-height:0!important}
  .support-layer .support{position:absolute;width:292px;padding:11px 15px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-1);background:rgba(9,22,32,.94);box-shadow:none}
  .support-layer .support::before{display:none}
  .support .tag{display:block;color:var(--primary);font:750 18px/1.35 var(--font-title);letter-spacing:.06em}
  .support .what{display:block;margin-top:2px;color:var(--text);font-size:16px;line-height:1.42}
  .support .why{display:block;color:var(--muted);font-size:16px;line-height:1.42}
  .s-measure{left:2.7%;top:7%}.s-model{right:7.5%;top:5%}.s-feedback{left:9%;bottom:7%}.s-team{right:2.5%;bottom:10%}
  .k-generalization>.claim{position:absolute;z-index:5;left:50%;top:50%;width:520px;padding:16px 22px;border-color:var(--accent-line);border-left-color:var(--accent);background:linear-gradient(90deg,var(--accent-soft),rgba(13,27,38,.96) 62%);box-shadow:0 14px 38px rgba(0,0,0,.28);transform:translate(-50%,-50%)}
  .claim .main{display:block;color:var(--accent);font:800 22px/1.35 var(--font-title);letter-spacing:.025em}
  .claim .sub{display:block;margin-top:3px;color:var(--text);font-size:18px;line-height:1.45}
  .edge-note{position:absolute;z-index:4;color:var(--faint);font:650 14px/1.4 var(--font-mono);letter-spacing:.08em}
  .note-left{left:2.5%;top:51%}.note-mid{left:43%;top:31%}.note-right{right:3%;top:43%}
  .node{opacity:0;transform-box:fill-box;transform-origin:center;animation:node-on 360ms ease-out forwards}
  .n1{animation-delay:720ms}.n2{animation-delay:900ms}.n3{animation-delay:1080ms}.n4{animation-delay:1260ms}
  .motion-path{stroke-dasharray:1900;stroke-dashoffset:1900;animation:draw-path 1800ms ease-out forwards}
  .earth-group{opacity:0;animation:earth-in 520ms ease-out 1280ms forwards}
  @keyframes draw-path{to{stroke-dashoffset:0}}
  @keyframes node-on{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
  @keyframes earth-in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
  @media (prefers-reduced-motion:reduce){.motion-path,.node,.earth-group{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
</head>
<body data-page="28" data-total="50">
<div id="stage">
  <header class="scene-head">
    <div class="kicker">ACT III · CONTROL</div>
    <h1>从扔石头到入轨，改变的是控制能力</h1>
    <p class="lead">身体仍是灵长类的身体；被持续累积、检验并协同执行的控制能力，把运动送进了轨道。</p>
  </header>

  <main class="plate k-generalization min0" aria-labelledby="control-claim">
    <div class="trunk min0">
      <div class="diagram-field diagram" aria-hidden="true">
        <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid meet">
          <defs>
            <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <linearGradient id="earthFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="var(--primary)" stop-opacity=".10"/><stop offset="1" stop-color="var(--panel-deep)" stop-opacity=".72"/>
            </linearGradient>
          </defs>

          <!-- technical frame -->
          <g fill="none" stroke="var(--line)" stroke-width="1">
            <path d="M80 95H290M80 95V170M1360 95H1150M1360 95V170M80 805H290M80 805V730M1360 805H1150M1360 805V730"/>
            <path d="M720 80V104M720 796V820M64 450H88M1352 450H1376" stroke-dasharray="5 8"/>
          </g>

          <!-- hand and thrown stone -->
          <g fill="none" stroke="var(--primary-line)" stroke-width="2">
            <path d="M128 610c28-18 48-12 67 2l40 28 49 9 38 30-25 31-72-20-66 22-54-44z"/>
            <path d="M194 614l28-48 22 4-9 70M236 640l41-52 23 8-25 62M277 659l39-38 20 12-30 47"/>
            <circle cx="352" cy="575" r="16" stroke="var(--accent)"/>
          </g>

          <!-- one continuous controlled-motion path -->
          <path class="motion-path" d="M352 575C470 386 566 375 676 452C790 531 900 531 1010 410C1080 332 1119 230 1240 230C1374 230 1400 420 1345 540C1280 681 1081 684 1010 552C952 444 1014 306 1137 262" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

          <!-- routed annotation lines -->
          <g fill="none" stroke="var(--primary)" stroke-opacity=".42" stroke-width="1">
            <path d="M472 405V192H360"/><path d="M887 488V180h192"/>
            <path d="M645 435V716H422"/><path d="M1088 326V690h198"/>
          </g>
          <g fill="var(--primary)">
            <circle cx="472" cy="405" r="4"/><circle cx="887" cy="488" r="4"/><circle cx="645" cy="435" r="4"/><circle cx="1088" cy="326" r="4"/>
          </g>

          <!-- accumulated relay nodes -->
          <g fill="var(--bg)" stroke="var(--accent)" stroke-width="4" filter="url(#glow)">
            <circle class="node n1" cx="472" cy="405" r="10"/><circle class="node n2" cx="645" cy="435" r="10"/>
            <circle class="node n3" cx="887" cy="488" r="10"/><circle class="node n4" cx="1088" cy="326" r="10"/>
          </g>

          <!-- earth arc and atmosphere -->
          <g class="earth-group">
            <circle cx="1240" cy="516" r="282" fill="url(#earthFill)" stroke="var(--primary-line)" stroke-width="2"/>
            <circle cx="1240" cy="516" r="294" fill="none" stroke="var(--primary)" stroke-opacity=".32" stroke-width="5"/>
            <path d="M1012 586c62-26 91 27 144 5 56-24 74-9 103 23 42 46 94 15 139 42" fill="none" stroke="var(--primary-line)" stroke-width="2"/>
            <path d="M1090 350c41 8 65 42 103 39 45-4 62-38 102-25 30 9 45 42 80 45" fill="none" stroke="var(--primary-line)" stroke-width="2"/>
          </g>
        </svg>
      </div>
    </div>

    <div class="supports support-layer" style="--support-n:2">
      <section class="support s-measure">
        <span class="tag">测量</span>
        <span class="what">把结果变成可比较的记录</span>
        <span class="why">不只凭一次手感</span>
      </section>
      <section class="support s-model">
        <span class="tag">模型</span>
        <span class="what">先预测条件与后果</span>
        <span class="why">在行动前排除部分错误</span>
      </section>
      <section class="support s-feedback">
        <span class="tag">反馈</span>
        <span class="what">依据偏差持续校正</span>
        <span class="why">让成功能够重复</span>
      </section>
      <section class="support s-team">
        <span class="tag">协作</span>
        <span class="what">分散知识按接口汇合</span>
        <span class="why">让复杂运动仍可执行</span>
      </section>
    </div>

    <div class="claim" id="control-claim">
      <span class="main">力量没有跨越物种式升级</span>
      <span class="sub">控制被跨世代累积。</span>
    </div>

    <div class="edge-note note-left">单次动作</div>
    <div class="edge-note note-mid">持续校正</div>
    <div class="edge-note note-right">可重复入轨</div>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:28,total:50});</script>
</body>
</html>
