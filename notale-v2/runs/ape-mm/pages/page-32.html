<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage { padding: 28px 42px 24px; }
  .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:36px; }
  .kicker { color:var(--primary); font:700 15px/1.4 var(--font-mono); letter-spacing:.16em; }
  .take { max-width:780px; margin:0; color:var(--muted); font-size:var(--fs-lead); line-height:1.45; text-align:right; }
  .builder-shell { position:relative; overflow:hidden; border:1px solid var(--line-strong); border-radius:var(--radius-3); background:linear-gradient(90deg,var(--panel) 0 28%,var(--panel-deep) 28% 72%,var(--panel) 72%); box-shadow:var(--shadow-panel); }
  #rocket-builder { position:absolute; inset:0; z-index:1; }
  #rocket-builder .konvajs-content, #rocket-builder canvas { width:100% !important; height:100% !important; }
  .column-title { position:absolute; z-index:3; top:18px; color:var(--muted); font:700 var(--fs-label)/1.4 var(--font-mono); letter-spacing:.08em; pointer-events:none; }
  .tray-title { left:22px; }
  .well-title { left:45%; transform:translateX(-50%); }
  .progress { position:absolute; z-index:4; top:16px; right:24px; min-width:142px; padding:7px 12px; border:1px solid var(--primary-line); border-radius:var(--radius-1); color:var(--primary); background:var(--panel-deep); font:700 16px/1.4 var(--font-mono); text-align:center; }
  .duty-tree { position:absolute; z-index:3; top:62px; right:20px; bottom:18px; width:25%; pointer-events:none; }
  .duty-tree .lv { gap:8px; margin-left:10px; padding-left:12px; }
  .duty-tree .lv::before { top:16px; width:10px; }
  .duty-tree .box { padding:10px 12px; background:rgba(13,27,38,.92); }
  .duty-tree .box > .bt { margin:-10px -12px 7px; padding:5px 10px; font-size:17px; }
  .duty-tree .secondary { font-size:15px; line-height:1.4; }
  .duty-tree .linked { border-color:var(--primary); box-shadow:inset 3px 0 0 var(--primary); }
  .duty-tree .linked .bt { color:var(--text); background:var(--primary-soft); }
  .status-line { position:absolute; z-index:4; left:22px; bottom:18px; width:25%; min-height:54px; padding:10px 12px; border-left:3px solid var(--accent); color:var(--text); background:rgba(9,22,32,.94); font-size:16px; line-height:1.45; }
  .keyboard-bar { position:absolute; z-index:5; left:22px; top:62px; display:flex; gap:8px; align-items:center; }
  .keyboard-bar label { color:var(--muted); font-size:15px; font-weight:650; }
  .keyboard-bar select, .keyboard-bar button, .reset-btn { min-height:38px; border:1px solid var(--line-strong); border-radius:var(--radius-1); color:var(--text); background:var(--panel-deep); font-size:16px; }
  .keyboard-bar select { width:154px; padding:5px 8px; }
  .keyboard-bar button, .reset-btn { padding:5px 12px; cursor:pointer; }
  .keyboard-bar button:hover, .reset-btn:hover { border-color:var(--primary); }
  .bottom-band { display:flex; align-items:center; gap:22px; }
  .conclusion { flex:1; margin:0; padding:12px 16px; border-left:5px solid var(--primary); color:var(--text); background:var(--primary-soft); font-size:var(--fs-lead); font-weight:700; line-height:1.45; }
  .reset-btn { display:none; flex:0 0 auto; border-color:var(--accent); color:var(--accent); }
  .legend-note { flex:0 0 340px; color:var(--muted); font-size:16px; line-height:1.45; text-align:right; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body data-page="32" data-total="50">
<div id="stage">
  <header class="page-head" style="height:92px">
    <div>
      <div class="kicker">SYSTEM ANATOMY · 32</div>
      <h1>火箭不是一整块</h1>
    </div>
    <p class="take">按职责装入剖面：结构负责连接承力，推进产生运动，制导决定控制，载荷才是被送往目标的对象。</p>
  </header>

  <main class="builder-shell min0" style="flex:1" aria-label="两级火箭部件装配台">
    <div id="rocket-builder" class="no-pan" role="application" aria-label="拖动七块部件到两级火箭的虚线槽位"></div>
    <div class="column-title tray-title">01 / 部件托盘</div>
    <div class="column-title well-title">02 / 两级火箭剖面</div>
    <div id="progress" class="progress" aria-live="polite"></div>

    <div class="keyboard-bar" aria-label="键盘装配入口">
      <label for="part-select">选择部件</label>
      <select id="part-select"></select>
      <button id="place-btn" type="button">装入正确槽位</button>
    </div>

    <div class="k-classification duty-tree" aria-label="按职责分类">
      <div class="lv">
        <div class="box">
          <div class="bt">03 / 职责分类</div>
          <div class="lv">
            <div class="box" data-duty="payload"><div class="bt">载荷</div><div class="secondary">被送往目标的对象</div></div>
            <div class="box" data-duty="guidance"><div class="bt">制导</div><div class="secondary">测量姿态，决定控制时机与方向</div></div>
            <div class="box" data-duty="propulsion"><div class="bt">推进</div><div class="secondary">储存并喷出推进剂</div></div>
            <div class="box" data-duty="structure"><div class="bt">结构</div><div class="secondary">级间段负责连接与分离；外壳承力并随所属级段丢弃</div></div>
          </div>
        </div>
      </div>
    </div>
    <div id="status" class="status-line" aria-live="polite">拖动部件；虚线槽位显示空间归属。</div>
  </main>

  <footer class="bottom-band" style="height:92px">
    <p id="conclusion" class="conclusion">每个部件先按职责归类，再嵌入所属级段。</p>
    <div class="legend-note">青色＝归位并接通职责　琥珀色＝当前工作或分离</div>
    <button id="reset-btn" class="reset-btn" type="button">重新组装</button>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/konva.min.js"></script>
<script>
(function () {
  'use strict';
  Deck.init({ index: 32, total: 50 });

  var C = {
    primary: Deck.token('--primary'), accent: Deck.token('--accent'), danger: Deck.token('--danger'),
    text: Deck.token('--text'), muted: Deck.token('--muted'), faint: Deck.token('--faint'),
    panel: Deck.token('--panel'), deep: Deck.token('--panel-deep'), line: Deck.token('--line-strong')
  };
  var stage = new Konva.Stage({ container: 'rocket-builder', width: 960, height: 560 });
  var base = new Konva.Layer();
  var piecesLayer = new Konva.Layer();
  stage.add(base); stage.add(piecesLayer);

  var slotsData = [
    { id:'payload', label:'载荷舱', duty:'payload', x:411, y:55, w:116, h:48, level:'mission', fate:'保留' },
    { id:'guidance', label:'导航与控制', duty:'guidance', x:411, y:104, w:116, h:42, level:'upper', fate:'随任务继续' },
    { id:'upperTank', label:'上级贮箱', duty:'propulsion', x:411, y:147, w:116, h:72, level:'upper', fate:'工作后可丢弃' },
    { id:'upperEngine', label:'上级发动机', duty:'propulsion', x:426, y:220, w:86, h:42, level:'upper', fate:'工作后可丢弃' },
    { id:'interstage', label:'级间段', duty:'structure', x:400, y:264, w:138, h:38, level:'joint', fate:'分离时脱开' },
    { id:'lowerTank', label:'一级贮箱', duty:'propulsion', x:400, y:304, w:138, h:122, level:'lower', fate:'耗尽后丢弃' },
    { id:'lowerEngine', label:'一级发动机', duty:'propulsion', x:416, y:428, w:106, h:54, level:'lower', fate:'随一级丢弃' }
  ];
  var errors = {
    payload:'载荷位于火箭顶端，不负责推进。',
    guidance:'导航与控制单元位于上级段顶部。',
    upperTank:'上级贮箱位于载荷下方、上级发动机上方。',
    upperEngine:'发动机必须在本级贮箱下方，喷口朝下。',
    interstage:'级间段连接两级，并在分离时脱开。',
    lowerTank:'一级贮箱属于最下方的起飞级段。',
    lowerEngine:'一级发动机位于一级贮箱下方。'
  };
  var starts = [
    {x:48,y:142},{x:170,y:142},{x:48,y:207},{x:170,y:207},
    {x:48,y:272},{x:170,y:272},{x:109,y:337}
  ];
  var placed = Object.create(null);
  var pieceMap = Object.create(null);
  var completionTimers = [];
  var progress = document.getElementById('progress');
  var status = document.getElementById('status');
  var conclusion = document.getElementById('conclusion');
  var resetBtn = document.getElementById('reset-btn');
  var select = document.getElementById('part-select');

  function line(points, opts) {
    return new Konva.Line(Object.assign({ points:points, stroke:C.line, strokeWidth:1, listening:false }, opts || {}));
  }

  base.add(new Konva.Rect({x:288,y:0,width:2,height:560,fill:C.line,listening:false}));
  base.add(new Konva.Rect({x:691,y:0,width:2,height:560,fill:C.line,listening:false}));
  for (var t=0; t<9; t++) {
    base.add(line([305,70+t*55,316,70+t*55], {stroke:t<7?C.primary:C.line, opacity:.55}));
  }
  base.add(new Konva.Line({points:[469,48,455,55,483,55],closed:true,fill:C.primary,opacity:.7,listening:false}));
  base.add(new Konva.Line({points:[469,46,560,10,650,18],stroke:C.primary,strokeWidth:2,tension:.35,opacity:.65,listening:false}));

  base.add(new Konva.Rect({x:389,y:96,width:160,height:170,stroke:C.line,strokeWidth:2,cornerRadius:8,listening:false}));
  base.add(new Konva.Rect({x:378,y:296,width:182,height:196,stroke:C.line,strokeWidth:2,cornerRadius:8,listening:false}));
  base.add(line([379,282,559,282], {stroke:C.accent,strokeWidth:2,dash:[8,7],opacity:.75}));
  base.add(line([549,180,584,180], {stroke:C.primary,opacity:.7}));
  base.add(new Konva.Text({x:590,y:167,width:92,text:'外壳与承力框',fontFamily:'Arial, sans-serif',fontSize:16,lineHeight:1.35,fill:C.muted,listening:false}));

  var slotNodes = Object.create(null);
  slotsData.forEach(function (s) {
    var slot = new Konva.Rect({x:s.x,y:s.y,width:s.w,height:s.h,stroke:C.faint,strokeWidth:2,dash:[7,6],cornerRadius:6,fill:'rgba(0,0,0,0)',listening:false});
    slotNodes[s.id] = slot;
    base.add(slot);
  });

  function updateProgress() {
    var n = Object.keys(placed).length;
    progress.textContent = '已装配 ' + n + ' / ' + slotsData.length;
  }

  function updateDuty(duty) {
    var allDone = slotsData.filter(function(s){return s.duty === duty;}).every(function(s){return placed[s.id];});
    var el = document.querySelector('[data-duty="' + duty + '"]');
    el.classList.toggle('linked', allDone);
  }

  function resetPiece(group, animate) {
    var p = group.getAttr('partData');
    group.draggable(true);
    group.opacity(1);
    group.getChildren()[0].stroke(C.line);
    group.getChildren()[0].shadowBlur(0);
    if (animate && !Deck.reduced()) {
      group.to({x:p.startX,y:p.startY,duration:.22,easing:Konva.Easings.EaseOut});
    } else { group.position({x:p.startX,y:p.startY}); }
    group.getChildren()[0].size({width:112,height:44});
    group.getChildren()[1].width(112); group.getChildren()[1].height(44);
  }

  function setPlacedGeometry(group, s) {
    group.position({x:s.x,y:s.y});
    group.getChildren()[0].size({width:s.w,height:s.h});
    group.getChildren()[1].width(s.w); group.getChildren()[1].height(s.h);
  }

  function place(group, fromKeyboard) {
    var p = group.getAttr('partData');
    var s = slotsData.filter(function(d){return d.id === p.id;})[0];
    placed[p.id] = true;
    group.draggable(false);
    group.moveToTop();
    group.getChildren()[0].stroke(C.primary);
    group.getChildren()[0].shadowColor(C.primary);
    group.getChildren()[0].shadowBlur(13);
    if (Deck.reduced() || fromKeyboard) {
      setPlacedGeometry(group,s);
    } else {
      group.to({x:s.x,y:s.y,duration:.16,easing:Konva.Easings.EaseOut,onFinish:function(){setPlacedGeometry(group,s); piecesLayer.draw();}});
    }
    status.textContent = p.label + '已归入“' + dutyName(p.duty) + '”，并装入所属位置。';
    updateDuty(p.duty); updateProgress(); piecesLayer.draw();
    if (Object.keys(placed).length === slotsData.length) complete();
  }

  function dutyName(d) { return {payload:'载荷',guidance:'制导',propulsion:'推进',structure:'结构'}[d]; }

  function wrong(group) {
    var p = group.getAttr('partData');
    status.textContent = errors[p.id];
    var rect = group.getChildren()[0]; rect.stroke(C.danger);
    if (Deck.reduced()) { resetPiece(group,false); piecesLayer.draw(); return; }
    var sx = group.x(), sy = group.y();
    group.to({x:sx-6,duration:.04,onFinish:function(){
      group.to({x:sx+6,duration:.04,onFinish:function(){
        group.to({x:sx-4,duration:.04,onFinish:function(){
          group.to({x:sx+4,duration:.04,onFinish:function(){ resetPiece(group,true); }});
        }});
      }});
    }});
  }

  function dropped(group) {
    var p = group.getAttr('partData');
    var s = slotsData.filter(function(d){return d.id === p.id;})[0];
    var target = slotNodes[p.id].getClientRect();
    var r = group.getClientRect();
    var cx = r.x + r.width/2, cy = r.y + r.height/2;
    var inside = cx >= target.x-28 && cx <= target.x+target.width+28 && cy >= target.y-28 && cy <= target.y+target.height+28;
    if (inside) place(group,false); else wrong(group);
  }

  slotsData.forEach(function (s,i) {
    var option = document.createElement('option'); option.value=s.id; option.textContent=s.label; select.appendChild(option);
    var group = new Konva.Group({x:starts[i].x,y:starts[i].y,draggable:true});
    group.setAttr('partData',{id:s.id,label:s.label,duty:s.duty,startX:starts[i].x,startY:starts[i].y});
    var rect = new Konva.Rect({width:112,height:44,cornerRadius:7,fill:C.deep,stroke:C.line,strokeWidth:2});
    var text = new Konva.Text({text:s.label,width:112,height:44,align:'center',verticalAlign:'middle',fontFamily:'Arial, sans-serif',fontSize:16,fontStyle:'bold',fill:C.text,listening:false});
    group.add(rect); group.add(text); group.on('dragstart',function(){this.moveToTop(); rect.stroke(C.accent); status.textContent='正在放置：'+s.label;});
    group.on('dragend',function(){dropped(this);});
    pieceMap[s.id]=group; piecesLayer.add(group);
  });

  function complete() {
    status.textContent = '一级工作完成：观察哪些部件一起离开。';
    conclusion.textContent = '火箭不是单一机器：各部件职责不同；分级是在某一级完成工作后，不再继续携带它。';
    resetBtn.style.display='block';
    var lower = ['lowerTank','lowerEngine','interstage'];
    var upper = ['payload','guidance','upperTank','upperEngine'];
    lower.forEach(function(id){pieceMap[id].getChildren()[0].stroke(C.accent);});
    if (Deck.reduced()) {
      lower.forEach(function(id){pieceMap[id].y(pieceMap[id].y()+54);pieceMap[id].opacity(.42);});
      upper.forEach(function(id){pieceMap[id].y(pieceMap[id].y()-20);});
      status.textContent='一级耗尽并分离；载荷与上级继续前进。'; piecesLayer.draw(); return;
    }
    completionTimers.push(setTimeout(function(){
      lower.forEach(function(id){pieceMap[id].getChildren()[0].fill(C.panel);}); piecesLayer.draw();
    },500));
    completionTimers.push(setTimeout(function(){
      lower.forEach(function(id){pieceMap[id].to({y:pieceMap[id].y()+54,opacity:.42,duration:.45,easing:Konva.Easings.EaseIn});});
      upper.forEach(function(id){pieceMap[id].to({y:pieceMap[id].y()-20,duration:.45,easing:Konva.Easings.EaseOut});});
      status.textContent='一级耗尽并分离；载荷与上级继续前进。';
    },950));
  }

  function resetAll() {
    completionTimers.forEach(clearTimeout); completionTimers=[]; placed=Object.create(null);
    slotsData.forEach(function(s){resetPiece(pieceMap[s.id],false); updateDuty(s.duty);});
    status.textContent='拖动部件；虚线槽位显示空间归属。';
    conclusion.textContent='每个部件先按职责归类，再嵌入所属级段。';
    resetBtn.style.display='none'; updateProgress(); piecesLayer.draw();
  }

  document.getElementById('place-btn').addEventListener('click',function(){var g=pieceMap[select.value]; if(!placed[select.value]) place(g,true);});
  resetBtn.addEventListener('click',resetAll);
  updateProgress();

  window.__p32 = {
    place:function(id){ if(pieceMap[id] && !placed[id]) place(pieceMap[id],true); },
    complete:function(){ slotsData.forEach(function(s){if(!placed[s.id]) place(pieceMap[s.id],true);}); },
    reset:resetAll
  };
}());
</script>
</body>
</html>
