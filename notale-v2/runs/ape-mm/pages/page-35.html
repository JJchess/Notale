<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage { padding: 28px 38px 30px; }
  .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:var(--sp-5); }
  .kicker { color:var(--primary); font:700 var(--fs-label)/1.4 var(--font-mono); letter-spacing:.16em; }
  .take { max-width:680px; margin:0; color:var(--muted); font-size:var(--fs-sec); line-height:1.5; text-align:right; }
  .workbench { display:flex; min-width:0; min-height:0; gap:var(--sp-4); }
  .orbital-scene { position:relative; flex:1 1 0; overflow:hidden; min-width:0; min-height:0; border:1px solid var(--line); border-radius:var(--radius-3); background:radial-gradient(circle at 44% 48%, var(--primary-soft), transparent 43%), var(--panel-deep); box-shadow:var(--shadow-panel); }
  .orbital-scene::before { position:absolute; inset:0; content:""; pointer-events:none; opacity:.44; background-image:radial-gradient(circle, var(--muted) 0 1px, transparent 1.5px); background-size:83px 79px; z-index:0; }
  #globe { position:absolute; inset:0; z-index:1; }
  #globe canvas { display:block; }
  .scene-label { position:absolute; z-index:4; left:20px; top:18px; padding:8px 12px; border-left:2px solid var(--primary); color:var(--muted); background:rgba(7,16,24,.72); font-size:var(--fs-label); line-height:1.4; pointer-events:none; }
  .scene-legend { position:absolute; z-index:4; left:20px; bottom:18px; display:flex; gap:20px; padding:8px 12px; border:1px solid var(--line); border-radius:var(--radius-1); background:rgba(7,16,24,.82); }
  .scene-legend span { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:var(--fs-label); line-height:1.4; }
  .scene-legend i { width:22px; height:3px; border-radius:9px; background:var(--primary); }
  .scene-legend .amber { background:var(--accent); }
  .alt-rail { position:absolute; z-index:5; right:24px; top:84px; bottom:78px; width:116px; border-right:2px solid var(--primary-line); pointer-events:none; }
  .station { position:absolute; right:-5px; display:flex; align-items:center; gap:8px; color:var(--muted); font-size:var(--fs-label); line-height:1.4; transform:translateY(-50%); white-space:nowrap; }
  .station::after { width:9px; height:9px; order:2; border:2px solid var(--primary); border-radius:50%; background:var(--panel-deep); content:""; }
  .station.seen::after { background:var(--accent); border-color:var(--accent); box-shadow:0 0 12px var(--accent); }
  .alt-handle { position:absolute; z-index:7; right:9px; width:34px; height:34px; border:3px solid var(--accent); border-radius:50%; background:var(--accent-soft); box-shadow:0 0 20px var(--accent); cursor:ns-resize; transform:translateY(-50%); touch-action:none; }
  .alt-handle::after { position:absolute; top:50%; right:31px; width:74px; height:2px; content:""; background:var(--accent); box-shadow:0 0 10px var(--accent); }
  .alt-handle:focus-visible { outline:3px solid var(--focus); outline-offset:5px; }
  .instrument { display:flex; flex-direction:column; width:38%; min-width:0; min-height:0; }
  .progress-row { display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); }
  .progress-dots { display:flex; gap:8px; }
  .progress-dots i { width:10px; height:10px; border:1px solid var(--line-strong); border-radius:50%; background:var(--panel-deep); }
  .progress-dots i.seen { border-color:var(--accent); background:var(--accent); box-shadow:0 0 9px var(--accent); }
  .orbit-general { gap:var(--sp-3); }
  .orbit-general > .claim { padding:16px 20px; border-left-color:var(--accent); background:linear-gradient(90deg,var(--accent-soft),transparent 68%),var(--panel); }
  .orbit-general > .trunk::before { left:20px; background:linear-gradient(var(--accent),var(--primary-line)); transform:none; }
  .orbit-general .supports { display:flex; flex-direction:column; gap:10px; padding:6px 0 6px 44px; }
  .orbit-general .support { flex:1 1 0; display:flex; flex-direction:column; justify-content:center; padding:12px 16px; color:var(--text); }
  .orbit-general .support::before { left:-24px !important; right:auto !important; width:24px; background:var(--primary); }
  .metric-top { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .metric-name { color:var(--muted); font-size:var(--fs-sec); font-weight:700; line-height:1.45; }
  .metric-value { color:var(--primary); font:700 var(--fs-lead)/1.4 var(--font-mono); text-align:right; }
  .claim .metric-value { color:var(--accent); }
  .metric-rule { margin-top:3px; color:var(--muted); font-size:var(--fs-sec); line-height:1.45; }
  .coverage-pair { display:flex; justify-content:space-between; gap:14px; margin-top:4px; color:var(--primary); font:700 var(--fs-sec)/1.45 var(--font-mono); }
  .feedback { min-height:50px; padding:11px 14px; border-left:2px solid var(--primary); color:var(--muted); background:var(--panel-deep); font-size:var(--fs-sec); line-height:1.5; }
  .feedback.warn { border-left-color:var(--danger); color:var(--text); }
  .summary { display:none; padding:11px 14px; border:1px solid var(--accent-line); border-radius:var(--radius-1); color:var(--accent); background:var(--accent-soft); font-size:var(--fs-sec); font-weight:750; line-height:1.45; }
  .summary.show { display:block; }
  .reset { min-height:40px; padding:7px 15px; border:1px solid var(--line-strong); border-radius:var(--radius-1); color:var(--text); background:var(--panel-deep); font-size:var(--fs-sec); cursor:pointer; }
  .reset:hover { border-color:var(--primary); }
  .footer-line { display:flex; align-items:center; justify-content:space-between; gap:var(--sp-5); border-top:1px solid var(--line); padding-top:14px; }
  .footer-line p { margin:0; max-width:1080px; color:var(--text); font-size:var(--fs-sec); line-height:1.5; }
  .footer-line strong { color:var(--accent); }
  .pulse .claim, .pulse .support { animation:pulse-line .72s ease-out; }
  @keyframes pulse-line { 0%{box-shadow:0 0 0 0 var(--accent-line)} 100%{box-shadow:0 0 0 16px transparent} }
  @media (prefers-reduced-motion:reduce) { .pulse .claim,.pulse .support { animation:none; } }
</style>
</head>
<body data-page="35" data-total="50">
<div id="stage">
  <header class="page-head shrink0" style="height:82px">
    <div>
      <div class="kicker">ORBIT RADIUS · 35 / 50</div>
      <h1>半径改写整条轨道</h1>
    </div>
    <p class="take">比较轨道时，从地心半径出发；离地高度只是半径的一部分。</p>
  </header>

  <main class="workbench min0" style="flex:1">
    <section class="orbital-scene min0 no-pan" aria-label="可旋转的地球、圆轨道、覆盖范围与卫星">
      <div id="globe" aria-hidden="true"></div>
      <div class="scene-label">拖动琥珀色球冠改变高度<br>拖动空白处转动地球</div>
      <div class="alt-rail" aria-hidden="true">
        <span class="station" data-station="2">高站</span>
        <span class="station" data-station="1">中站</span>
        <span class="station" data-station="0">低站</span>
      </div>
      <div id="altHandle" class="alt-handle" role="slider" tabindex="0" aria-label="轨道高度" aria-valuemin="0" aria-valuemax="2" aria-valuenow="1" aria-valuetext="中站"></div>
      <div class="scene-legend" aria-hidden="true">
        <span><i class="amber"></i>当前卫星与半径</span>
        <span><i></i>圆轨道与地面投影带</span>
      </div>
    </section>

    <aside class="instrument min0 gap-3">
      <div class="progress-row shrink0">
        <span id="progressText" class="label" aria-live="polite">已检视</span>
        <span class="progress-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>

      <section id="general" class="k-generalization orbit-general min0" style="flex:1">
        <div class="claim">
          <div class="metric-top"><span class="metric-name">轨道半径</span><output id="radiusValue" class="metric-value"></output></div>
          <div class="metric-rule">地心到卫星＝地球半径＋当前高度</div>
        </div>
        <div class="trunk min0">
          <div class="supports min0" style="--support-n:1">
            <div class="support">
              <div class="metric-top"><span class="metric-name">轨道速度</span><output id="speedValue" class="metric-value"></output></div>
              <div class="metric-rule">半径增大 → 圆轨道速度降低</div>
            </div>
            <div class="support">
              <div class="metric-top"><span class="metric-name">绕行周期</span><output id="periodValue" class="metric-value"></output></div>
              <div class="metric-rule">半径增大 → 一圈所需时间增加</div>
            </div>
            <div class="support">
              <div class="metric-top"><span class="metric-name">地表覆盖</span><output id="coverValue" class="metric-value"></output></div>
              <div class="metric-rule">更高时单次可见范围扩大，绕行圈数减少</div>
              <div class="coverage-pair"><span id="heightValue"></span><span id="orbitsValue"></span></div>
            </div>
          </div>
        </div>
      </section>

      <div id="summary" class="summary shrink0">半径↑｜速度↓｜周期↑｜单次可见范围↑</div>
      <div id="feedback" class="feedback shrink0" aria-live="polite">先在三个观测站比较同一条稳定圆轨道。</div>
    </aside>
  </main>

  <footer class="footer-line shrink0" style="height:70px">
    <p><strong>轨道不是只有“高低”一个变化：</strong>半径一改，速度、周期和观察地表的节奏会一起改变。</p>
    <button id="resetBtn" class="reset" type="button">一键重置实验球</button>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/three.min.js"></script>
<script src="assets/lib/globe.gl.min.js"></script>
<script>
(function () {
  'use strict';
  Deck.init({ index: 35, total: 50 });

  var K = Lec.K;
  var P = Lec.P;
  var earthR = K.earth.meanRadius_m;
  var stations = [
    K.earth.karmanLine_m * 2,
    K.earth.lowOrbitReferenceAltitude_m,
    K.earth.lowOrbitReferenceAltitude_m * 5
  ];
  var inclination = 51.6 * K.units.degree_rad;
  var state = { altitude: stations[1], station: 1, visited: [false, true, false], dragging: false };
  var sceneEl = document.querySelector('.orbital-scene');
  var globeEl = document.getElementById('globe');
  var handle = document.getElementById('altHandle');
  var feedback = document.getElementById('feedback');
  var general = document.getElementById('general');
  var prefersReduced = Deck.reduced();
  var theta = 0;
  var lastCoverageUpdate = 0;

  var globe = Globe()(globeEl)
    .globeImageUrl(null)
    .backgroundColor('rgba(0,0,0,0)')
    .showAtmosphere(true)
    .atmosphereColor(Deck.token('--primary'))
    .atmosphereAltitude(0.12)
    .showGraticules(true)
    .pointColor(function () { return Deck.token('--accent'); })
    .pointRadius(0.11)
    .pointAltitude('alt')
    .pointsTransitionDuration(0)
    .pathPoints('coords')
    .pathPointLat(function (p) { return p[0]; })
    .pathPointLng(function (p) { return p[1]; })
    .pathPointAlt(function (p) { return p[2]; })
    .pathColor('color')
    .pathStroke('stroke')
    .pathTransitionDuration(0)
    .polygonCapColor(function () { return Deck.rgba('--primary', 0.18); })
    .polygonSideColor(function () { return Deck.rgba('--primary', 0.05); })
    .polygonStrokeColor(function () { return Deck.rgba('--primary', 0.62); })
    .polygonsTransitionDuration(0);

  globe.camera().fov = 38;
  globe.camera().updateProjectionMatrix();
  globe.pointOfView({ lat: 18, lng: -18, altitude: 2.25 }, 0);
  globe.controls().enableDamping = true;
  globe.controls().dampingFactor = 0.07;
  globe.controls().autoRotate = !prefersReduced;
  globe.controls().autoRotateSpeed = 0.22;
  globe.globeMaterial().color.set(Deck.token('--panel-deep'));
  globe.globeMaterial().emissive.set(Deck.token('--bg'));
  globe.globeMaterial().emissiveIntensity = 0.55;
  globe.globeMaterial().roughness = 0.82;

  function resizeGlobe() {
    globe.width(globeEl.clientWidth).height(globeEl.clientHeight);
  }
  Deck.onResize(resizeGlobe);
  resizeGlobe();

  function orbitCoords(altitude) {
    var a = altitude / earthR;
    var out = [];
    for (var j = 0; j <= 120; j++) {
      var t = K.math.TAU * j / 120;
      var lat = Math.asin(Math.sin(inclination) * Math.sin(t));
      var lng = Math.atan2(Math.cos(inclination) * Math.sin(t), Math.cos(t));
      out.push([lat / K.units.degree_rad, lng / K.units.degree_rad, a]);
    }
    return out;
  }

  function subpoint(t) {
    var lat = Math.asin(Math.sin(inclination) * Math.sin(t));
    var lng = Math.atan2(Math.cos(inclination) * Math.sin(t), Math.cos(t));
    return { lat: lat / K.units.degree_rad, lng: lng / K.units.degree_rad };
  }

  function circlePolygon(latDeg, lngDeg, angularRadius) {
    var lat1 = latDeg * K.units.degree_rad;
    var lon1 = lngDeg * K.units.degree_rad;
    var ring = [];
    for (var j = 0; j <= 72; j++) {
      var bearing = K.math.TAU * j / 72;
      var lat2 = Math.asin(Math.sin(lat1) * Math.cos(angularRadius) + Math.cos(lat1) * Math.sin(angularRadius) * Math.cos(bearing));
      var lon2 = lon1 + Math.atan2(Math.sin(bearing) * Math.sin(angularRadius) * Math.cos(lat1), Math.cos(angularRadius) - Math.sin(lat1) * Math.sin(lat2));
      ring.push([lon2 / K.units.degree_rad, lat2 / K.units.degree_rad]);
    }
    return { type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [ring] } };
  }

  function updateGlobe(full) {
    var p = subpoint(theta);
    var altRatio = state.altitude / earthR;
    globe.pointsData([{ lat: p.lat, lng: p.lng, alt: altRatio }]);
    if (full) {
      var ring = orbitCoords(state.altitude);
      var ground = ring.map(function (d) { return [d[0], d[1], 0.006]; });
      globe.pathsData([
        { coords: ring, color: Deck.token('--primary'), stroke: 1.25 },
        { coords: ground, color: Deck.rgba('--primary', 0.42), stroke: 0.7 }
      ]);
    }
    var horizon = Math.acos(earthR / (earthR + state.altitude));
    globe.polygonsData([circlePolygon(p.lat, p.lng, horizon)]);
  }

  function formatStationProgress() {
    var count = state.visited.filter(Boolean).length;
    document.getElementById('progressText').textContent = '已检视 ' + count + ' / ' + stations.length + ' 个半径';
    document.querySelectorAll('.progress-dots i').forEach(function (dot, i) { dot.classList.toggle('seen', state.visited[i]); });
    document.querySelectorAll('.station').forEach(function (label) {
      var i = Number(label.getAttribute('data-station'));
      label.classList.toggle('seen', state.visited[i]);
      label.textContent = ['低站 ', '中站 ', '高站 '][i] + P.formatDistance(stations[i], 2);
    });
    document.getElementById('summary').classList.toggle('show', count === stations.length);
  }

  function updateHandle() {
    var top = 84;
    var bottom = 78;
    var usable = sceneEl.clientHeight - top - bottom;
    var fraction = (state.altitude - stations[0]) / (stations[2] - stations[0]);
    handle.style.top = (top + (1 - fraction) * usable) + 'px';
    handle.setAttribute('aria-valuenow', String(state.station));
    handle.setAttribute('aria-valuetext', ['低站', '中站', '高站'][state.station]);
    document.querySelectorAll('.station').forEach(function (el) {
      var i = Number(el.getAttribute('data-station'));
      var f = (stations[i] - stations[0]) / (stations[2] - stations[0]);
      el.style.top = ((1 - f) * 100) + '%';
    });
  }

  function updateReadouts(full) {
    var radius = earthR + state.altitude;
    var speed = P.earthOrbitSpeed(state.altitude);
    var period = P.earthOrbitPeriod(state.altitude);
    var horizon = Math.acos(earthR / radius);
    var visibleFraction = (1 - Math.cos(horizon)) / 2;
    document.getElementById('radiusValue').textContent = P.formatDistance(radius, 4);
    document.getElementById('speedValue').textContent = P.formatSpeed(speed, 3);
    document.getElementById('periodValue').textContent = P.formatDuration(period, 3);
    document.getElementById('coverValue').textContent = P.formatPercent(visibleFraction, 1);
    document.getElementById('heightValue').textContent = '高度 ' + P.formatDistance(state.altitude, 3);
    document.getElementById('orbitsValue').textContent = '每日 ' + P.formatNumber(K.units.day_s / period, 3) + ' 圈';
    updateHandle();
    updateGlobe(full);
  }

  function settle(index, valid) {
    state.station = index;
    state.altitude = stations[index];
    state.visited[index] = true;
    updateReadouts(true);
    formatStationProgress();
    if (valid) {
      feedback.classList.remove('warn');
      feedback.textContent = '已接通：同一半径同时改写速度、周期与覆盖。';
      general.classList.remove('pulse');
      void general.offsetWidth;
      general.classList.add('pulse');
      var litPaths = globe.pathsData().map(function (path, pathIndex) {
        return { coords:path.coords, color:pathIndex === 0 ? Deck.token('--accent') : path.color, stroke:pathIndex === 0 ? 2.15 : path.stroke };
      });
      globe.pathsData(litPaths);
      if (!prefersReduced) setTimeout(function () { updateGlobe(true); }, 720);
    } else {
      feedback.classList.add('warn');
      feedback.textContent = '先停在一个观测站，才能比较同一条圆轨道。已回弹到最近站。';
    }
  }

  function nearestStation(value) {
    var best = 0;
    for (var i = 1; i < stations.length; i++) {
      if (Math.abs(stations[i] - value) < Math.abs(stations[best] - value)) best = i;
    }
    return best;
  }

  handle.addEventListener('pointerdown', function (e) {
    state.dragging = true;
    handle.setPointerCapture(e.pointerId);
    globe.controls().enabled = false;
    feedback.classList.remove('warn');
    feedback.textContent = '松手停靠观测站；三项读数正在同步计算。';
    e.preventDefault();
  });
  handle.addEventListener('pointermove', function (e) {
    if (!state.dragging) return;
    var p = Deck.pt(sceneEl, e);
    var top = 84;
    var bottom = 78;
    var usable = sceneEl.clientHeight - top - bottom;
    var fraction = Deck.clamp(1 - (p.y - top) / usable, 0, 1);
    state.altitude = stations[0] + fraction * (stations[2] - stations[0]);
    state.station = nearestStation(state.altitude);
    updateReadouts(true);
  });
  handle.addEventListener('pointerup', function () {
    if (!state.dragging) return;
    state.dragging = false;
    globe.controls().enabled = true;
    var i = nearestStation(state.altitude);
    var tolerance = (stations[2] - stations[0]) / 12;
    settle(i, Math.abs(state.altitude - stations[i]) <= tolerance);
  });
  handle.addEventListener('pointercancel', function () {
    state.dragging = false;
    globe.controls().enabled = true;
    settle(nearestStation(state.altitude), false);
  });
  handle.addEventListener('keydown', function (e) {
    var next = state.station;
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') next = Math.min(stations.length - 1, next + 1);
    else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') next = Math.max(0, next - 1);
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = stations.length - 1;
    else return;
    e.preventDefault();
    settle(next, true);
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    state.altitude = stations[1];
    state.station = 1;
    state.visited = [false, true, false];
    theta = 0;
    feedback.classList.remove('warn');
    feedback.textContent = '先在三个观测站比较同一条稳定圆轨道。';
    general.classList.remove('pulse');
    updateReadouts(true);
    formatStationProgress();
  });

  Deck.onResize(function () { updateHandle(); });
  updateReadouts(true);
  formatStationProgress();

  Deck.loop(function (t, dt) {
    if (!state.dragging) {
      var period = P.earthOrbitPeriod(state.altitude);
      theta = (theta + dt * (K.units.minute_s * 10) * K.math.TAU / period) % K.math.TAU;
      var p = subpoint(theta);
      globe.pointsData([{ lat:p.lat, lng:p.lng, alt:state.altitude / earthR }]);
      if (t - lastCoverageUpdate > 180) {
        lastCoverageUpdate = t;
        updateGlobe(false);
      }
    }
  }, { still: 0 });
}());
</script>
</body>
</html>
