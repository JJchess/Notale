<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:28px 40px 24px;position:relative;background:radial-gradient(circle at 92% 122%,transparent 0 345px,var(--primary-line) 347px,transparent 350px),linear-gradient(180deg,rgba(89,195,195,.035),transparent 28%),repeating-linear-gradient(0deg,transparent 0,transparent 72px,rgba(89,195,195,.025) 73px,transparent 74px),var(--bg)}
  .page-head{height:92px;display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-5);flex:0 0 92px}
  .kicker{color:var(--primary);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.13em}
  .head-copy{display:flex;flex-direction:column;gap:5px;min-width:0}
  .head-side{display:flex;align-items:center;gap:var(--sp-3);padding-top:8px}
  .progress-box{min-width:250px;padding:9px 14px;border:1px solid var(--primary-line);border-radius:var(--radius-1);background:var(--panel-deep)}
  .progress-box .value{color:var(--accent);font:700 var(--fs-lead)/1.35 var(--font-mono)}
  .progress-box .label{display:block}
  .reset{min-height:44px;padding:8px 16px;border:1px solid var(--line-strong);border-radius:var(--radius-1);color:var(--text);background:var(--panel-deep);font-size:var(--fs-sec);cursor:pointer}
  .reset:hover{border-color:var(--primary)}
  .main{display:flex;flex:1;gap:var(--sp-3);min-height:0}
  .tree-panel{display:flex;flex:1;flex-direction:column;min-width:0;min-height:0;padding:14px 16px 12px;overflow:hidden}
  .tree-toolbar{height:55px;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);flex:0 0 55px}
  .branch-key{--enum-cols:2;flex:0 0 430px;height:42px;grid-auto-rows:42px;gap:var(--sp-2)}
  .branch-key>.it{flex-direction:row;align-items:center;justify-content:space-between;gap:var(--sp-2);padding:7px 12px;border-top-width:2px;box-shadow:none}
  .branch-key>.it .title{font-size:var(--fs-sec)}
  .branch-key>.it .content{font-size:var(--fs-label);white-space:nowrap}
  .branch-key>.it.done{border-color:var(--accent-line);border-top-color:var(--accent);background:var(--accent-soft)}
  .tree-wrap{position:relative;flex:1;min-height:0;border-top:1px solid var(--line);border-radius:0 0 var(--radius-1) var(--radius-1);overflow:hidden}
  #tree{width:100%;height:100%;display:block}
  .branch-frame{fill:var(--primary-soft);stroke:var(--primary-line);stroke-width:1;stroke-dasharray:7 7;vector-effect:non-scaling-stroke;transition:stroke .25s,fill .25s}
  .branch-frame.done{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
  .link{fill:none;stroke:var(--primary);stroke-width:2;opacity:.24;vector-effect:non-scaling-stroke;transition:opacity .2s,stroke .2s,stroke-width .2s}
  .link.ready{opacity:.72}
  .link.confirmed{stroke:var(--accent);stroke-width:3;opacity:1}
  .link.pulse{animation:linePulse .55s ease-out}
  .interface-label{fill:var(--faint);font:650 14px/1.3 var(--font-sans);paint-order:stroke;stroke:var(--panel-deep);stroke-width:5;stroke-linejoin:round}
  .interface-label.confirmed{fill:var(--accent)}
  .node{cursor:pointer;outline:none}
  .node rect{fill:var(--panel-deep);stroke:var(--line-strong);stroke-width:1.5;vector-effect:non-scaling-stroke;transition:fill .2s,stroke .2s,filter .2s}
  .node text{fill:var(--muted);font:650 15px/1.2 var(--font-sans);pointer-events:none}
  .node.ready rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5;filter:drop-shadow(0 0 7px var(--accent-line))}
  .node.ready text{fill:var(--text)}
  .node.confirmed rect{fill:var(--accent);stroke:var(--accent)}
  .node.confirmed text{fill:var(--bg);font-weight:800}
  .node:focus-visible rect{stroke:var(--text);stroke-width:4}
  .node.wrong{animation:shake .32s ease-in-out}
  .endpoint{fill:var(--panel-deep);stroke:var(--primary-line);stroke-width:2}
  .endpoint.done{fill:var(--accent);stroke:var(--accent);filter:drop-shadow(0 0 8px var(--accent-line))}
  .ledger{width:400px;flex:0 0 400px;display:flex;flex-direction:column;min-height:0;padding:0;overflow:hidden}
  .ledger-head{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel-raised);flex:0 0 62px}
  .ledger-head .label{font-family:var(--font-mono);letter-spacing:.08em}
  .ledger-cols,.ledger-row{display:grid;grid-template-columns:128px 64px minmax(0,1fr);column-gap:8px;align-items:center}
  .ledger-cols{height:34px;padding:0 14px;border-bottom:1px solid var(--line);color:var(--faint);font-size:14px;font-weight:700;flex:0 0 34px}
  .ledger-body{display:flex;flex:1;flex-direction:column;min-height:0}
  .ledger-row{flex:1;min-height:0;padding:5px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:var(--fs-sec);line-height:1.35;transition:background .2s,color .2s}
  .ledger-row .iface{color:var(--primary);font-weight:700}
  .ledger-row .effect{color:var(--faint)}
  .ledger-row.confirmed{color:var(--text);background:linear-gradient(90deg,var(--accent-soft),transparent)}
  .ledger-row.confirmed .iface,.ledger-row.confirmed .effect{color:var(--accent)}
  .foot{height:82px;display:flex;align-items:center;gap:var(--sp-4);flex:0 0 82px;padding-top:14px}
  .status{flex:1;padding:11px 16px;border-left:3px solid var(--primary);color:var(--muted);font-size:var(--fs-sec);line-height:1.5;background:linear-gradient(90deg,var(--primary-soft),transparent)}
  .status.error{border-left-color:var(--danger);color:var(--text)}
  .status.complete{border-left-color:var(--accent);color:var(--text);background:linear-gradient(90deg,var(--accent-soft),transparent)}
  .take{width:560px;color:var(--text);font-size:var(--fs-sec);line-height:1.5}
  .take strong{color:var(--accent)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}70%{transform:translateX(9px)}}
  @keyframes linePulse{0%{filter:drop-shadow(0 0 0 transparent)}45%{filter:drop-shadow(0 0 8px var(--accent));stroke-width:5}100%{filter:none}}
  @keyframes fullPulse{50%{filter:drop-shadow(0 0 10px var(--accent-line))}}
  .tree-panel.complete{animation:fullPulse .7s ease-out}
  @media (prefers-reduced-motion:reduce){.node.wrong,.link.pulse,.tree-panel.complete{animation:none!important}.node rect,.link,.ledger-row,.branch-frame{transition:none!important}}
</style>
</head>
<body data-page="37" data-total="50">
<div id="stage">
  <header class="page-head">
    <div class="head-copy">
      <div class="kicker">SYSTEMS · E4</div>
      <h1>一处短路，为什么会传到整船？</h1>
      <div class="secondary">沿已接通的接口，确认接下来受影响的部件。</div>
    </div>
    <div class="head-side">
      <div class="progress-box" aria-live="polite">
        <span class="label">传播节点</span>
        <span id="progress" class="value"></span>
      </div>
      <button id="reset" class="reset" type="button">重置传播树</button>
    </div>
  </header>

  <main class="main min0">
    <section id="treePanel" class="tree-panel panel diagram min0" aria-labelledby="treeTitle">
      <div class="tree-toolbar">
        <h2 id="treeTitle">故障传播树</h2>
        <div class="k-enumeration branch-key" aria-label="两条并列传播支路">
          <div id="thermalKey" class="it"><span class="title">热控支路</span><span class="content">电力 → 热控</span></div>
          <div id="attitudeKey" class="it"><span class="title">姿态支路</span><span class="content">电力 → 数据 → 控制 → 通信</span></div>
        </div>
      </div>
      <div class="tree-wrap min0 no-pan">
        <svg id="tree" viewBox="0 0 1180 610" role="group" aria-label="可交互的航天器故障传播树">
          <title>从电源母线短路开始的两条故障传播路径</title>
          <desc>选择存在已确认上游接口的节点，逐步接通故障路径。</desc>
        </svg>
      </div>
    </section>

    <aside class="ledger panel min0" aria-labelledby="ledgerTitle">
      <div class="ledger-head"><h2 id="ledgerTitle">接口账本</h2><span class="label">逐项解锁后果</span></div>
      <div class="ledger-cols"><span>部件状态</span><span>接口</span><span>直接后果</span></div>
      <div id="ledgerBody" class="ledger-body"></div>
    </aside>
  </main>

  <footer class="foot">
    <div id="status" class="status" aria-live="polite">从发光连线的末端继续。只有已确认的上游接口能传播故障。</div>
    <div class="take"><strong>关键不是坏了几个部件，</strong>而是哪些接口把它们连在一起。保护装置能隔离危险，也可能让同一支路同时失去功能。</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(() => {
  Deck.init({index:37,total:50});

  const source = {
    id:'bus', name:'电源母线 A 短路', from:'起点', iface:'—', effect:'过流保护触发',
    children:[{
      id:'breaker', name:'保护器断开', from:'电源母线 A', iface:'电气', effect:'下游支路失电',
      children:[
        {id:'pump', name:'冷却泵停转', from:'保护器', iface:'电力', effect:'冷却液停止循环', branch:'thermal', children:[
          {id:'heat', name:'航电舱温度上升', from:'冷却泵', iface:'热控', effect:'设备越过工作温区', branch:'thermal', children:[
            {id:'safe', name:'飞行计算机进入安全模式', from:'航电舱', iface:'热控', effect:'常规控制指令暂停', branch:'thermal'}
          ]}
        ]},
        {id:'star', name:'星敏感器失电', from:'保护器', iface:'电力', effect:'姿态测量中断', branch:'attitude', children:[
          {id:'solve', name:'姿态解算缺少输入', from:'星敏感器', iface:'数据', effect:'无法确认飞船朝向', branch:'attitude', children:[
            {id:'antenna', name:'天线失去对地指向', from:'姿态解算', iface:'控制', effect:'链路信号迅速减弱', branch:'attitude', children:[
              {id:'telemetry', name:'遥测链路中断', from:'天线', iface:'通信', effect:'地面暂时收不到状态', branch:'attitude'}
            ]}
          ]}
        ]}
      ]
    }]
  };

  const root = d3.hierarchy(source);
  const tree = d3.tree().nodeSize([76,150]).separation((a,b)=>a.parent===b.parent?1:1.25);
  tree(root);
  const nodes = root.descendants();
  const links = root.links();
  const total = nodes.length - 1;
  const byId = new Map(nodes.map(d => [d.data.id,d]));
  const confirmed = new Set(['bus']);
  const state = {trace:[], complete:false};
  const svg = d3.select('#tree');
  const centerX = 590;
  const px = d => centerX + d.x * 4.55;
  const py = d => 35 + d.y * .84;
  const branchNodes = key => nodes.filter(d => d.data.branch === key);
  const branchBounds = key => {
    const ns = branchNodes(key);
    return {
      x:d3.min(ns,px)-100, y:d3.min(ns,py)-36,
      w:d3.max(ns,px)-d3.min(ns,px)+200,
      h:d3.max(ns,py)-d3.min(ns,py)+72
    };
  };

  const frames = svg.append('g').attr('aria-hidden','true')
    .selectAll('rect').data(['thermal','attitude']).join('rect')
    .attr('class','branch-frame').attr('rx',18)
    .attr('x',d=>branchBounds(d).x).attr('y',d=>branchBounds(d).y)
    .attr('width',d=>branchBounds(d).w).attr('height',d=>branchBounds(d).h);

  const linkG = svg.append('g').attr('aria-hidden','true');
  const linkSel = linkG.selectAll('path').data(links,d=>d.target.data.id).join('path')
    .attr('class','link')
    .attr('d',d=>`M${px(d.source)},${py(d.source)+23} C${px(d.source)},${(py(d.source)+py(d.target))/2} ${px(d.target)},${(py(d.source)+py(d.target))/2} ${px(d.target)},${py(d.target)-23}`);

  const labelSel = linkG.selectAll('text').data(links,d=>d.target.data.id).join('text')
    .attr('class','interface-label').attr('text-anchor','middle')
    .attr('x',d=>(px(d.source)+px(d.target))/2 + (px(d.target)>px(d.source)?16:-16))
    .attr('y',d=>(py(d.source)+py(d.target))/2-4)
    .text(d=>d.target.data.iface);

  const nodeSel = svg.append('g').selectAll('g').data(nodes,d=>d.data.id).join('g')
    .attr('class','node').attr('transform',d=>`translate(${px(d)},${py(d)})`)
    .attr('role','button').attr('tabindex',0)
    .attr('aria-label',d=>`确认 ${d.data.name}`)
    .on('click',(event,d)=>choose(d))
    .on('keydown',(event,d)=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();choose(d);}});

  nodeSel.append('rect').attr('x',-78).attr('y',-23).attr('width',156).attr('height',46).attr('rx',8);
  nodeSel.each(function(d){
    const parts = splitLabel(d.data.name);
    const text = d3.select(this).append('text').attr('text-anchor','middle');
    parts.forEach((part,i)=>text.append('tspan').attr('x',0).attr('y',parts.length===1?5:(i===0?-3:14)).text(part));
  });

  const endpoints = svg.append('g').attr('aria-hidden','true').selectAll('circle')
    .data([{key:'thermal',id:'safe'},{key:'attitude',id:'telemetry'}]).join('circle')
    .attr('class','endpoint').attr('r',8)
    .attr('cx',d=>px(byId.get(d.id))).attr('cy',d=>py(byId.get(d.id))+37);

  const ledger = d3.select('#ledgerBody').selectAll('.ledger-row').data(nodes,d=>d.data.id).join('div')
    .attr('class','ledger-row').attr('data-id',d=>d.data.id);
  ledger.append('span').text(d=>d.data.name);
  ledger.append('span').attr('class','iface').text(d=>d.data.iface);
  ledger.append('span').attr('class','effect').text(d=>d.depth===0?d.data.effect:'待确认');

  function splitLabel(name){
    if(name.length<=9) return [name];
    const cut = Math.ceil(name.length/2);
    return [name.slice(0,cut),name.slice(cut)];
  }

  function ready(d){ return d.parent && confirmed.has(d.parent.data.id) && !confirmed.has(d.data.id); }
  function branchDone(key){ return branchNodes(key).every(d=>confirmed.has(d.data.id)); }
  function chineseCount(n){ return ['零','一','二','三','四','五','六','七','八','九'][n] || String(n); }

  function render(newId){
    nodeSel
      .classed('confirmed',d=>confirmed.has(d.data.id))
      .classed('ready',d=>ready(d))
      .attr('aria-disabled',d=>confirmed.has(d.data.id)?'true':'false');
    linkSel
      .classed('confirmed',d=>confirmed.has(d.target.data.id))
      .classed('ready',d=>ready(d.target))
      .classed('pulse',d=>d.target.data.id===newId);
    labelSel.classed('confirmed',d=>confirmed.has(d.target.data.id));
    ledger
      .classed('confirmed',d=>confirmed.has(d.data.id))
      .select('.effect').text(d=>confirmed.has(d.data.id)?d.data.effect:'待确认');
    const doneCount = confirmed.size-1;
    document.getElementById('progress').textContent = `${doneCount} / ${total}`;
    const doneMap = {thermal:branchDone('thermal'),attitude:branchDone('attitude')};
    frames.classed('done',d=>doneMap[d]);
    endpoints.classed('done',d=>doneMap[d.key]);
    document.getElementById('thermalKey').classList.toggle('done',doneMap.thermal);
    document.getElementById('attitudeKey').classList.toggle('done',doneMap.attitude);
    if(newId){setTimeout(()=>linkSel.classed('pulse',false),600);}
  }

  function choose(d){
    if(confirmed.has(d.data.id)) return;
    const status = document.getElementById('status');
    if(!ready(d)){
      const el = nodeSel.filter(x=>x===d);
      el.classed('wrong',false);
      void el.node().getBoundingClientRect();
      el.classed('wrong',true);
      setTimeout(()=>el.classed('wrong',false),360);
      status.className='status error';
      status.textContent='这一步没有已确认的上游接口，请从发光连线的末端继续。';
      return;
    }
    confirmed.add(d.data.id);
    state.trace.push(d.data.id);
    render(d.data.id);
    if(confirmed.size-1===total){
      state.complete=true;
      document.getElementById('treePanel').classList.add('complete');
      status.className='status complete';
      const branches = ['thermal','attitude'].filter(branchDone).length;
      status.textContent=`${chineseCount(1)}个起点，${chineseCount(branches)}条接口链。局部失效已沿相互依赖的接口扩散。`;
      window.dispatchEvent(new CustomEvent('game-complete',{detail:{score:total,metrics:{confirmed:total,branches},trace:[...state.trace]}}));
    }else{
      status.className='status';
      status.textContent=`已接通“${d.data.iface}”接口。现在从新的发光端点继续。`;
      window.dispatchEvent(new CustomEvent('game-progress',{detail:{state:getState(),action:d.data.id,metrics:{confirmed:confirmed.size-1,total}}}));
    }
  }

  function getState(){return {confirmed:[...confirmed],trace:[...state.trace],complete:state.complete};}
  function reset(){
    confirmed.clear(); confirmed.add('bus'); state.trace=[]; state.complete=false;
    document.getElementById('treePanel').classList.remove('complete');
    const status=document.getElementById('status');
    status.className='status';
    status.textContent='从发光连线的末端继续。只有已确认的上游接口能传播故障。';
    render();
    window.dispatchEvent(new CustomEvent('game-reset',{detail:{state:getState()}}));
  }
  document.getElementById('reset').addEventListener('click',reset);
  window.faultGame={start:()=>window.dispatchEvent(new CustomEvent('game-start',{detail:{state:getState()}})),reset,getState,choose:id=>choose(byId.get(id))};
  render();
})();
</script>
</body>
</html>
