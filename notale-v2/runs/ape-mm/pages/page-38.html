<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:28px 44px 30px;position:relative;isolation:isolate}
  .head{height:102px;display:flex;align-items:flex-start;justify-content:space-between;gap:36px;position:relative;z-index:3}
  .kicker{font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.16em;color:var(--primary);margin-bottom:5px}
  .take{margin:6px 0 0;color:var(--muted);font-size:var(--fs-sec);line-height:1.5}
  .statusbox{display:flex;align-items:center;gap:18px;padding-top:5px}
  #progress{min-width:190px;color:var(--accent);font:700 var(--fs-body)/1.4 var(--font-mono);text-align:right}
  #reset{min-height:40px;padding:7px 16px;border:1px solid var(--line-strong);border-radius:var(--radius-1);color:var(--text);background:var(--panel-deep);font-size:var(--fs-sec);cursor:pointer}
  #reset:hover{border-color:var(--primary)}
  .workspace{flex:1;min-height:0;position:relative;z-index:1;border:1px solid var(--line);border-radius:var(--radius-2);overflow:hidden;background:var(--panel-deep);box-shadow:var(--shadow-panel)}
  .mission-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.14;filter:saturate(.55) contrast(1.08);z-index:0}
  .photo-veil{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,var(--panel-deep),transparent 48%,var(--panel-deep)),linear-gradient(180deg,var(--panel-deep),transparent 32%,var(--panel-deep))}
  .comparison-wrap{position:absolute;inset:12px;z-index:2}
  .k-comparison{--compare-n:3;height:100%;grid-template-columns:190px repeat(3,minmax(0,1fr));grid-template-rows:48px repeat(4,1fr) 106px;background:rgba(9,22,32,.78);overflow:visible}
  .k-comparison>.hdr,.k-comparison>.dim,.k-comparison>.cell{padding:8px 14px}
  .k-comparison>.hdr{font-size:var(--fs-h2);background:rgba(18,38,51,.9)}
  .k-comparison>.dim{justify-content:flex-start;gap:9px;text-align:left;font-size:var(--fs-sec)}
  .k-comparison>.cell{align-items:flex-start;color:var(--muted);font-size:var(--fs-sec);line-height:1.4;background:rgba(13,27,38,.54)}
  .k-comparison>.traycell{align-items:center;color:var(--faint);background:rgba(7,16,24,.72)}
  .lamp{width:21px;color:var(--faint);font-size:20px;line-height:1;text-align:center}
  .lamp.done{color:var(--primary)}
  #net{position:absolute;z-index:4;top:12px;right:12px;bottom:12px;left:202px;width:calc(100% - 214px);height:calc(100% - 24px);overflow:visible}
  .dep{stroke:var(--primary);stroke-width:2;opacity:0;fill:none;vector-effect:non-scaling-stroke;transition:opacity .25s}
  .dep.on{opacity:.74}
  .dep.pulse{stroke:var(--accent);stroke-width:3;stroke-dasharray:11 9;animation:dash .75s linear 1}
  .slot-hit{fill:transparent;stroke:transparent;cursor:pointer}
  .slot{fill:rgba(9,22,32,.82);stroke:var(--line-strong);stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}
  .slotgroup:hover .slot,.slotgroup:focus .slot{stroke:var(--accent);outline:none}
  .slot-label{fill:var(--faint);font:650 14px var(--font-sans);text-anchor:middle;pointer-events:none}
  .job{cursor:grab;outline:none}
  .job:active{cursor:grabbing}
  .job .hit{fill:transparent;stroke:transparent;stroke-width:1}
  .job .face{fill:var(--panel-raised);stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
  .job text{fill:var(--text);font:700 15px var(--font-sans);text-anchor:middle;pointer-events:none}
  .job.selected .face{fill:var(--accent-soft);stroke-width:3}
  .job.placed .face{fill:var(--primary-soft);stroke:var(--primary)}
  .job.flash .face{animation:nodeflash .52s ease-out 1}
  .job.wrong{animation:shake .24s ease-in-out 1}
  .job:focus .face{stroke:var(--focus);stroke-width:4}
  .finish{display:none;position:absolute;z-index:6;left:50%;bottom:30px;padding:16px 28px;border:1px solid var(--accent);border-radius:var(--radius-2);color:var(--text);background:var(--panel-deep);box-shadow:0 0 32px var(--accent-soft);font-size:var(--fs-lead);font-weight:750;transform:translateX(-50%);pointer-events:none}
  .finish.show{display:block}
  .footer{height:78px;display:flex;align-items:center;justify-content:space-between;gap:32px;position:relative;z-index:3}
  .instruction{color:var(--muted);font-size:var(--fs-sec);line-height:1.5}
  #feedback{min-width:560px;color:var(--accent);font-size:var(--fs-sec);line-height:1.5;text-align:right}
  @keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
  @keyframes nodeflash{50%{filter:drop-shadow(0 0 12px var(--accent))}}
  @keyframes dash{to{stroke-dashoffset:-40}}
  @media(prefers-reduced-motion:reduce){.dep,.finish{transition:none}.job.flash .face,.job.wrong,.dep.pulse{animation:none}}
</style>
</head>

    <div class="photo-veil" aria-hidden="true"></div>
    <div class="comparison-wrap">
      <div class="k-comparison" aria-hidden="true">
        <div class="hdr">任务能力</div><div class="hdr">舱内机组</div><div class="hdr">任务控制</div><div class="hdr">外部支持</div>
        <div class="dim"><span class="lamp" data-row="trajectory">○</span>飞行状态与轨迹</div><div class="cell">读取仪表、执行程序</div><div class="cell">轨迹与制导分析</div><div class="cell">测控站提供观测</div>
        <div class="dim"><span class="lamp" data-row="systems">○</span>航天器系统</div><div class="cell">处置告警、切换设备</div><div class="cell">电力与生命保障监控</div><div class="cell">解释设计与试验边界</div>
        <div class="dim"><span class="lamp" data-row="health">○</span>乘员健康</div><div class="cell">报告症状、执行对策</div><div class="cell">飞行外科医生评估</div><div class="cell">生物医学团队提供模型</div>
        <div class="dim"><span class="lamp" data-row="decision">○</span>通信与决策</div><div class="cell">指令长确认执行</div><div class="cell">飞行主任协调岗位</div><div class="cell">通信与回收团队衔接</div>
        <div class="dim">待接入岗位</div><div class="cell traycell"></div><div class="cell traycell"></div><div class="cell traycell"></div>
      </div>
    </div>
    <svg id="net" viewBox="0 0 1180 520" role="img" aria-label="把八张岗位卡接入舱内机组、任务控制和外部支持三处知识现场"></svg>
    <div id="finish" class="finish">任务知识 ＞ 个人知识</div>
  </main>

  <footer class="footer">
    <div class="instruction">拖动岗位卡到对应接口。键盘可先选卡，再选择接口。</div>
    <div id="feedback" aria-live="polite">同一任务能力要跨岗位接通，才形成可用的知识链。</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:38,total:50});
  const svg=d3.select('#net');
  const progress=document.getElementById('progress');
  const feedback=document.getElementById('feedback');
  const finish=document.getElementById('finish');
  const reduced=Deck.reduced();
  const rows={trajectory:98,systems:188,health:278,decision:368};
  const cols={crew:190,control:590,support:990};
  const jobs=[
    {id:'trajectory-control',label:'轨迹分析员',row:'trajectory',col:'control',hint:'轨迹分析员在任务控制席工作。'},
    {id:'trajectory-support',label:'地面测控站',row:'trajectory',col:'support',hint:'测控站从外部向任务控制提供观测。'},
    {id:'systems-crew',label:'任务专家',row:'systems',col:'crew',hint:'任务专家在舱内读取告警并执行程序。'},
    {id:'systems-control',label:'系统控制员',row:'systems',col:'control',hint:'系统控制员在任务控制席监看航天器。'},
    {id:'health-control',label:'飞行外科医生',row:'health',col:'control',hint:'这个岗位不在舱内直接工作，它向任务控制提供专业判断。'},
    {id:'health-support',label:'生物医学团队',row:'health',col:'support',hint:'生物医学团队属于外部专业支持。'},
    {id:'decision-crew',label:'指令长',row:'decision',col:'crew',hint:'指令长在舱内确认并执行决策。'},
    {id:'decision-control',label:'飞行主任',row:'decision',col:'control',hint:'飞行主任在任务控制中心协调岗位。'}
  ];
  jobs.forEach((d,i)=>{d.homeX=105+i*138;d.homeY=468;d.x=d.homeX;d.y=d.homeY;d.fx=d.x;d.fy=d.y;d.placed=false;});
  const links=[
    {source:'trajectory-control',target:'trajectory-support',row:'trajectory'},
    {source:'systems-crew',target:'systems-control',row:'systems'},
    {source:'health-control',target:'health-support',row:'health'},
    {source:'decision-crew',target:'decision-control',row:'decision'}
  ];
  const linkSel=svg.append('g').attr('aria-hidden','true').selectAll('line').data(links).join('line').attr('class','dep');
  const slotSel=svg.append('g').selectAll('g').data(jobs).join('g')
    .attr('class','slotgroup').attr('role','button').attr('tabindex',0)
    .attr('aria-label',d=>`${d.label}的${d.col==='crew'?'舱内机组':d.col==='control'?'任务控制':'外部支持'}接口`)
    .attr('transform',d=>`translate(${cols[d.col]},${rows[d.row]})`);
  slotSel.append('circle').attr('class','slot-hit').attr('r',42);
  slotSel.append('circle').attr('class','slot').attr('r',34);

  const nodeSel=svg.append('g').selectAll('g').data(jobs,d=>d.id).join('g')
    .attr('class','job').attr('role','button').attr('tabindex',0).attr('aria-label',d=>`岗位卡：${d.label}`);
  nodeSel.append('circle').attr('class','hit').attr('r',42);
  nodeSel.append('rect').attr('class','face').attr('x',-58).attr('y',-24).attr('width',116).attr('height',48).attr('rx',8);
  nodeSel.append('text').attr('dy','0.35em').text(d=>d.label);

  const simulation=d3.forceSimulation(jobs)
    .force('link',d3.forceLink(links).id(d=>d.id).distance(92).strength(.7))
    .force('charge',d3.forceManyBody().strength(-180))
    .force('collide',d3.forceCollide(40))
    .alphaDecay(.08)
    .on('tick',render);

  let selected=null;
  function render(){
    nodeSel.attr('transform',d=>`translate(${d.x},${d.y})`);
    linkSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  }
  function expected(d){return {x:cols[d.col],y:rows[d.row]};}
  function attempt(card,slot){
    if(!card||card.placed)return;
    if(card.id!==slot.id){
      feedback.textContent=card.hint;
      const n=nodeSel.filter(d=>d.id===card.id).classed('wrong',false);
      void n.node().getBoundingClientRect();n.classed('wrong',true);
      card.fx=card.homeX;card.fy=card.homeY;card.x=card.homeX;card.y=card.homeY;
      simulation.alpha(.25).restart();clearSelection();return;
    }
    place(card);
  }
  function place(d){
    const p=expected(d);d.placed=true;d.fx=p.x;d.fy=p.y;d.x=p.x;d.y=p.y;
    nodeSel.filter(x=>x.id===d.id).classed('placed',true).classed('flash',!reduced);
    feedback.textContent=`${d.label}已接入；查看这一行还需要哪个岗位。`;
    clearSelection();simulation.alpha(.22).restart();update();
  }
  function clearSelection(){selected=null;nodeSel.classed('selected',false)}
  nodeSel.on('click',function(event,d){event.stopPropagation();if(d.placed)return;selected=d;nodeSel.classed('selected',x=>x.id===d.id);feedback.textContent=`已选择${d.label}，请选择它所属的接口。`;})
    .on('keydown',function(event,d){if((event.key==='Enter'||event.key===' ')&&!d.placed){event.preventDefault();selected=d;nodeSel.classed('selected',x=>x.id===d.id);feedback.textContent=`已选择${d.label}，按 Tab 移到接口后确认。`;}})
    .call(d3.drag().on('start',function(event,d){if(d.placed)return;if(!event.active)simulation.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
      .on('drag',function(event,d){if(d.placed)return;d.fx=event.x;d.fy=event.y;})
      .on('end',function(event,d){if(d.placed)return;if(!event.active)simulation.alphaTarget(0);const p=expected(d);if(Math.hypot(event.x-p.x,event.y-p.y)<=42){place(d)}else{feedback.textContent=d.hint;const n=nodeSel.filter(x=>x.id===d.id).classed('wrong',false);void n.node().getBoundingClientRect();n.classed('wrong',true);d.fx=d.homeX;d.fy=d.homeY;d.x=d.homeX;d.y=d.homeY;simulation.alpha(.25).restart();}}));
  slotSel.on('click',function(event,d){attempt(selected,d)}).on('keydown',function(event,d){if(event.key==='Enter'||event.key===' '){event.preventDefault();attempt(selected,d)}});

  function update(){
    const count=jobs.filter(d=>d.placed).length;
    progress.textContent=`岗位网 ${count}/${jobs.length} 已接入`;
    Object.keys(rows).forEach(row=>{
      const done=jobs.filter(d=>d.row===row).every(d=>d.placed);
      const lamp=document.querySelector(`.lamp[data-row="${row}"]`);
      lamp.textContent=done?'●':'○';lamp.classList.toggle('done',done);
    });
    linkSel.classed('on',d=>d.source.placed&&d.target.placed);
    if(count===jobs.length){
      nodeSel.classed('placed',true);linkSel.classed('pulse',!reduced);finish.classList.add('show');
      feedback.textContent='宇航员是关键节点，不是整套载人航天知识的唯一容器。';
    }else{finish.classList.remove('show');linkSel.classed('pulse',false)}
  }
  function reset(){
    jobs.forEach((d,i)=>{d.placed=false;d.homeX=105+i*138;d.homeY=468;d.x=d.homeX;d.y=d.homeY;d.fx=d.homeX;d.fy=d.homeY;});
    nodeSel.classed('placed flash wrong selected',false);clearSelection();finish.classList.remove('show');
    feedback.textContent='同一任务能力要跨岗位接通，才形成可用的知识链。';
    simulation.alpha(.6).restart();update();
  }
  document.getElementById('reset').addEventListener('click',reset);
  update();render();
  window.p38={placeAll:function(){jobs.forEach(d=>{if(!d.placed)place(d)})},reset:reset,place:function(i){if(jobs[i])place(jobs[i])}};
})();
</script>
