<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root {
    --measure-line: color-mix(in srgb, var(--primary) 32%, transparent);
  }

  #stage {
    position: relative;
    isolation: isolate;
  }

  .chapter-head {
    position: relative;
    z-index: 4;
    width: min(100%, 1180px);
    height: 170px;
    margin-inline: auto;
    padding: 42px 48px 18px;
    text-align: center;
  }

  .kicker {
    margin: 0 0 7px;
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 700;
    letter-spacing: .18em;
    line-height: 1.4;
  }

  .chapter-head h1 {
    font-size: 48px;
    letter-spacing: .05em;
  }

  .take {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: var(--fs-lead);
    line-height: 1.5;
  }

  .measured-shell {
    position: relative;
    z-index: 2;
    display: flex;
    width: min(100%, 1180px);
    min-height: 0;
    margin-inline: auto;
    padding-inline: 48px;
  }

  .measured-shell::before,
  .measured-shell::after {
    position: absolute;
    z-index: -1;
    top: -170px;
    bottom: 0;
    width: 1px;
    content: "";
    background: var(--measure-line);
    pointer-events: none;
  }

  .measured-shell::before { left: 0; }
  .measured-shell::after { right: 0; }

  .corner {
    position: absolute;
    z-index: 5;
    color: var(--faint);
    font-family: var(--font-mono);
    font-size: 14px;
    letter-spacing: .08em;
    line-height: 1.4;
    pointer-events: none;
  }

  .corner::before {
    position: absolute;
    top: 7px;
    width: 7px;
    height: 7px;
    border: 1px solid var(--measure-line);
    content: "";
  }

  .corner.left { top: 8px; left: 9px; padding-left: 15px; }
  .corner.left::before { left: -12px; }
  .corner.right { right: 9px; bottom: 12px; padding-right: 15px; }
  .corner.right::before { right: -12px; }

  .concept {
    position: relative;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    gap: 10px;
    min-height: 0;
    padding-bottom: 18px;
  }

  .k-generalization > .claim {
    position: relative;
    z-index: 4;
    justify-self: center;
    width: 78%;
    padding: 12px 28px 14px;
    border-width: 0 0 1px;
    border-radius: 0;
    background: linear-gradient(90deg, transparent, var(--primary-soft), transparent);
    box-shadow: none;
    font-family: var(--font-title);
    font-size: clamp(28px, 3vw, 44px);
    line-height: 1.35;
    text-align: center;
  }

  .k-generalization > .trunk::before { display: none; }

  .scene {
    position: relative;
    min-height: 0;
    overflow: hidden;
  }

  .scene-svg {
    position: absolute;
    z-index: 1;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .route {
    fill: none;
    stroke: var(--primary);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 7px var(--primary-line));
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw-route 900ms ease-out 320ms forwards;
  }

  .boundary {
    stroke: var(--primary-line);
    stroke-width: 1;
    stroke-dasharray: 5 7;
  }

  .branch {
    fill: none;
    stroke: var(--primary-line);
    stroke-width: 1.5;
  }

  .craft,
  .body-outline {
    fill: var(--bg);
    stroke: var(--primary);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  .body-group {
    opacity: 0;
    animation: body-in 420ms ease-out 1120ms forwards;
  }

  .crossing-glow {
    fill: var(--accent);
    filter: drop-shadow(0 0 10px var(--accent));
    opacity: 0;
    animation: cross-flash 500ms ease-out 1010ms forwards;
  }

  .supports {
    position: absolute !important;
    z-index: 3;
    inset: 0;
    display: block !important;
    min-height: 0 !important;
    padding: 0 !important;
  }

  .k-generalization .support {
    position: absolute;
    width: 270px;
    padding: 12px 16px;
    border-color: var(--primary-line);
    border-radius: var(--radius-1);
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    box-shadow: var(--shadow-panel);
  }

  .k-generalization .support::before { display: none; }
  .support.pre { top: 47%; left: 3%; }
  .support.cross { top: 10%; left: 37%; width: 250px; }
  .support.post { top: 53%; right: 3%; }

  .support .tag {
    display: block;
    margin-bottom: 3px;
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 700;
    letter-spacing: .09em;
    line-height: 1.4;
  }

  .support .line {
    display: block;
    color: var(--text);
    font-size: var(--fs-body);
    font-weight: 700;
    line-height: 1.45;
  }

  .support .micro {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: var(--fs-sec);
    line-height: 1.45;
  }

  .scene-label {
    position: absolute;
    z-index: 4;
    color: var(--muted);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: 1.4;
  }

  .label-earth { left: 4%; bottom: 15%; }
  .label-boundary { left: 50%; top: 3%; transform: translateX(-50%); }
  .label-space { right: 4%; top: 20%; }
  .label-craft { left: 53%; top: 30%; color: var(--primary); }
  .label-body { left: 42%; bottom: 18%; color: var(--primary); }

  .accent-word { color: var(--accent); }

  .earth-limb {
    position: absolute;
    z-index: 0;
    right: 0;
    bottom: 0;
    left: 0;
    height: 18%;
    border-top: 2px solid var(--primary-line);
    border-radius: 50% 50% 0 0 / 72% 72% 0 0;
    background:
      radial-gradient(ellipse at 50% 0%, var(--primary-soft), transparent 58%),
      var(--panel-deep);
    box-shadow: 0 -7px 24px var(--primary-soft);
    opacity: 0;
    animation: earth-rise 520ms ease-out forwards;
  }

  .bridge-copy {
    position: absolute;
    z-index: 4;
    right: 10%;
    bottom: 3%;
    left: 10%;
    display: flex;
    gap: 28px;
    justify-content: center;
  }

  .bridge-copy p {
    width: 46%;
    margin: 0;
    color: var(--muted);
    font-size: var(--fs-sec);
    line-height: 1.5;
    text-align: center;
  }

  @keyframes earth-rise {
    from { opacity: 0; transform: translateY(28px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes draw-route { to { stroke-dashoffset: 0; } }
  @keyframes body-in { to { opacity: 1; } }
  @keyframes cross-flash {
    0% { opacity: 0; r: 3px; }
    45% { opacity: 1; r: 9px; }
    100% { opacity: .75; r: 4px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .route { stroke-dashoffset: 0; animation: none; }
    .body-group, .earth-limb, .crossing-glow { opacity: 1; animation: none; }
  }
</style>
</head>
<body data-page="40" data-total="50">
<div id="stage">
  <header class="chapter-head" style="flex:0 0 170px">
    <p class="kicker">ANIMAL IN SPACE · 第四章</p>
    <h1>过界，不等于变种</h1>
    <p class="take">飞船过了边界，身体并没有变成另一种生物</p>
  </header>

  <main class="measured-shell min0" style="flex:1">
    <span class="corner left" aria-hidden="true">EARTH SIDE</span>
    <span class="corner right" aria-hidden="true">SPACE SIDE</span>

    <section class="k-generalization concept min0" aria-labelledby="main-claim">
      <div class="claim" id="main-claim">过界不是物种切换</div>

      <div class="trunk scene min0">
        <div class="earth-limb" aria-hidden="true"></div>

        <svg class="scene-svg" viewBox="0 0 1084 590" role="img" aria-labelledby="scene-title scene-desc" preserveAspectRatio="none">
          <title id="scene-title">身体不变的越界路径</title>
          <desc id="scene-desc">飞船路径穿过空间边界，边界两侧的人体轮廓保持完全相同。</desc>
          <defs>
            <g id="person-shape">
              <circle class="body-outline" cx="0" cy="-22" r="8"></circle>
              <path class="body-outline" d="M0,-14 L0,17 M-15,-2 L0,2 L15,-2 M0,17 L-12,39 M0,17 L12,39"></path>
            </g>
          </defs>

          <line class="boundary" x1="542" y1="20" x2="542" y2="500"></line>
          <path class="route" pathLength="1" d="M128,486 C220,458 274,384 330,302 C392,211 470,205 542,237 C640,280 705,171 790,116 C868,66 946,78 1002,137"></path>
          <path class="branch" d="M193,414 L193,348 M542,237 L542,175 M858,78 L858,267"></path>
          <circle class="crossing-glow" cx="542" cy="237" r="4"></circle>

          <g class="craft" transform="translate(602 250) rotate(-31)">
            <path d="M-24,0 L5,-10 L28,0 L5,10 Z"></path>
            <path d="M-10,-6 L-20,-17 M-10,6 L-20,17"></path>
          </g>

          <g class="body-group">
            <use href="#person-shape" transform="translate(193 338)"></use>
            <use href="#person-shape" transform="translate(542 165)"></use>
            <use href="#person-shape" transform="translate(858 257)"></use>
          </g>
        </svg>

        <div class="supports" style="--support-n:3">
          <div class="support pre">
            <span class="tag">边界前 · 身体</span>
            <span class="line">地球塑造的身体</span>
            <span class="micro">轮廓连续，生物身份未切换</span>
          </div>
          <div class="support cross">
            <span class="tag">穿越时 · 位置</span>
            <span class="line">发生的是<span class="accent-word">位置改变</span></span>
            <span class="micro">飞船迅速跨过空间边界</span>
          </div>
          <div class="support post">
            <span class="tag">边界后 · 身体</span>
            <span class="line"><span class="accent-word">仍是</span>地球塑造的身体</span>
            <span class="micro">同一轮廓不断线，也不变形</span>
          </div>
        </div>

        <span class="scene-label label-earth">熟悉环境 · 地球</span>
        <span class="scene-label label-boundary">空间边界</span>
        <span class="scene-label label-space">陌生环境 · 太空</span>
        <span class="scene-label label-craft">飞船越界</span>
        <span class="scene-label label-body">乘员身体连续</span>

        <div class="bridge-copy">
          <p>飞船可以迅速跨过空间边界，乘员不会因此切换成另一种生物。</p>
          <p>进入太空，是古老身体进入新环境，不是演化进度条跳到下一格。</p>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Deck.init({ index: 40, total: 50 });
</script>
</body>
</html>
