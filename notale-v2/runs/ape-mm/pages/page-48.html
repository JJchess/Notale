<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  constraint-transfer-game{display:flex;flex:1 1 0;min-width:0;min-height:0;flex-direction:column}
  .page-head{height:126px;padding:28px 54px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:36px;border-bottom:1px solid var(--line)}
  .kicker{color:var(--primary);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.16em}
  .head-take{max-width:660px;margin:0;color:var(--muted);font-size:var(--fs-lead);line-height:1.5;text-align:right}
  .workflow{height:86px;padding:12px 54px 14px;--process-axis-y:50%}
  .workflow.k-process{gap:8px}
  .workflow.k-process>.step{justify-content:center;padding:8px 10px;text-align:center;font-size:var(--fs-sec);font-weight:700;line-height:1.4;border-color:var(--line);background:var(--panel-deep)}
  .workflow.k-process>.step:first-of-type,.workflow.k-process>.step:last-of-type{border-color:var(--primary-line)}
  .workflow.k-process>.arw{flex-basis:22px}
  .instruction-strip{height:40px;display:flex;align-items:center;justify-content:center;margin:0 54px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
  .instruction-strip strong{margin-right:8px;color:var(--accent)}
  .game-shell{position:relative;display:flex;flex:1 1 0;min-width:0;min-height:0;gap:20px;padding:0 54px 32px}
  .ledger{display:flex;flex:1 1 0;min-width:0;min-height:0;flex-direction:column;padding:18px 22px;border:1px solid var(--line-strong);border-radius:var(--radius-2);background:linear-gradient(180deg,var(--primary-soft),transparent 18%),var(--panel-deep);box-shadow:var(--shadow-panel)}
  .case-strip{height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 18px;border-bottom:1px solid var(--primary-line)}
  .case-name{font-family:var(--font-title);font-size:var(--fs-h2);font-weight:750;line-height:1.4}
  .status{color:var(--primary);font:700 var(--fs-sec)/1.4 var(--font-mono);white-space:nowrap}
  .sequence-note{padding:7px 12px;border:1px solid var(--primary-line);border-radius:999px;color:var(--primary);background:var(--primary-soft);font-size:var(--fs-label);font-weight:700;line-height:1.4;white-space:nowrap}
  .check-flow{position:relative;display:flex;flex:1 1 0;min-height:0;flex-direction:column;padding:12px 0}
  .ledger-principle{height:48px;display:flex;align-items:center;padding:0 16px;border-top:1px solid var(--primary-line);color:var(--primary);font-size:var(--fs-sec);font-weight:700;line-height:1.4}
  .check-flow::before{position:absolute;top:40px;bottom:40px;left:39px;width:2px;content:"";background:var(--line-strong)}
  .check-row{position:relative;display:grid;flex:1 1 0;grid-template-columns:82px 238px minmax(0,1fr);gap:14px;align-items:center;min-width:0;min-height:0;border-bottom:1px solid var(--line)}
  .check-row:last-child{border-bottom:0}
  .node{z-index:1;display:grid;width:34px;height:34px;margin-left:23px;place-items:center;border:2px solid var(--primary);border-radius:50%;color:var(--muted);background:var(--panel-deep);font:700 var(--fs-sec)/1 var(--font-mono);transition:background 220ms ease-out,box-shadow 220ms ease-out,color 220ms ease-out}
  .dimension{font-family:var(--font-title);font-size:var(--fs-h2);font-weight:750;line-height:1.4}
  .prompt{display:block;color:var(--muted);font-size:var(--fs-sec);font-weight:500;line-height:1.45}
  .dropzone{display:flex;min-width:0;min-height:58px;align-items:center;padding:10px 14px;border:1px dashed var(--line-strong);border-radius:var(--radius-1);color:var(--faint);background:rgba(7,16,24,.48);font-size:var(--fs-sec);line-height:1.45;text-align:left;transition:border-color 180ms ease-out,background 180ms ease-out}
  .check-row.target .dropzone{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
  .check-row.done .node{color:var(--bg);background:var(--primary);box-shadow:0 0 16px var(--primary-line)}
  .check-row.done .dropzone{border-style:solid;border-color:var(--primary);color:var(--text);background:var(--primary-soft)}
  .check-row.done::after{position:absolute;z-index:2;bottom:-7px;left:34px;width:12px;height:12px;border-right:2px solid var(--primary);border-bottom:2px solid var(--primary);content:"";transform:rotate(45deg);filter:drop-shadow(0 0 5px var(--primary))}
  .check-row:last-child::after{display:none}
  .side-tray{display:flex;flex:0 0 404px;min-width:0;min-height:0;flex-direction:column;gap:14px}
  .tray-head{height:74px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--radius-2);background:var(--panel)}
  .tray-head h2{font-size:var(--fs-h2)}
  .tray-head p{margin:2px 0 0;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
  .cards{display:flex;flex:1 1 0;min-height:0;flex-direction:column;gap:10px}
  .statement{display:flex;flex:1 1 0;min-height:0;align-items:center;padding:12px 15px;border:1px solid var(--primary-line);border-left:4px solid var(--primary);border-radius:var(--radius-1);color:var(--text);background:var(--panel-raised);font-size:var(--fs-sec);line-height:1.45;text-align:left;cursor:grab;transition:transform 180ms ease-out,border-color 180ms ease-out,opacity 180ms ease-out}
  .statement:hover,.statement.selected{border-color:var(--accent);transform:translateX(-4px)}
  .statement:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .statement.placed{visibility:hidden;pointer-events:none}
  .statement.wrong{animation:shake 300ms ease-out}
  .result-node{display:flex;min-height:88px;flex-direction:column;justify-content:center;padding:12px 16px;border:1px solid var(--line);border-radius:var(--radius-2);background:var(--panel-deep);opacity:.55}
  .result-node.open{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent);opacity:1}
  .result-label{color:var(--accent);font-size:var(--fs-label);font-weight:750;line-height:1.4}
  .result-text{margin-top:3px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
  .result-node.open .result-text{color:var(--text)}
  .controls{height:46px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .feedback{min-width:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
  .feedback.error{color:var(--danger)}
  .action{min-width:128px;min-height:42px;padding:8px 18px;border:1px solid var(--accent-line);border-radius:var(--radius-1);color:var(--accent);background:var(--accent-soft);font-size:var(--fs-sec);font-weight:750;cursor:pointer}
  .action:disabled{border-color:var(--line);color:var(--faint);background:var(--panel-deep);cursor:not-allowed}
  @keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  @keyframes enterLine{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
  .check-row{animation:enterLine 520ms ease-out both}.check-row:nth-child(2){animation-delay:70ms}.check-row:nth-child(3){animation-delay:140ms}.check-row:nth-child(4){animation-delay:210ms}
  @media(prefers-reduced-motion:reduce){.check-row{animation:none}.statement,.node,.dropzone{transition:none}.statement.wrong{animation:none}}
</style>
</head>
<body data-page="48" data-total="50">
<div id="stage">
  <header class="page-head" style="flex:0 0 126px">
    <div>
      <div class="kicker">TRANSFER CHECK</div>
      <h1>换一个案例，仍然追问四类约束</h1>
    </div>
    <p class="head-take">面对陌生环境，不要先问“人会不会升级”，而要依次检查身体、文化、物理与制度。</p>
  </header>

  <div class="k-process workflow" style="flex:0 0 86px" aria-label="判断流程">
    <div class="axis" aria-hidden="true"></div>
    <div class="step">读取新案例</div><div class="arw" aria-hidden="true"></div>
    <div class="step">身体会怎样</div><div class="arw" aria-hidden="true"></div>
    <div class="step">需要传承什么</div><div class="arw" aria-hidden="true"></div>
    <div class="step">环境允许什么</div><div class="arw" aria-hidden="true"></div>
    <div class="step">谁制定并执行规则</div><div class="arw" aria-hidden="true"></div>
    <div class="step">综合判断</div>
  </div>

  <div class="instruction-strip" style="flex:0 0 40px"><strong>操作</strong>把每张陈述放入对应检查行；完成一行，主干才接通下一行。</div>
  <constraint-transfer-game class="min0" style="flex:1"></constraint-transfer-game>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
class ConstraintTransferGame extends HTMLElement{
  constructor(){
    super();
    this.dimensions=['身体','文化','物理','制度'];
    this.cases=[
      {title:'海底科研舱连续驻留一个月',cards:[
        '昼夜感、活动量与压力环境如何影响人？','操作流程与应急经验怎样可靠交接？','水压、氧气与热量交换设下什么边界？','谁监测资源、批准操作并处理撤离？'],
        result:'能否驻留，取决于四类约束共同被满足。'},
      {title:'南极科考站越冬半年',cards:[
        '隔离、睡眠与低温暴露带来什么负担？','新成员怎样学会维修与野外安全？','极寒、风与补给距离限制哪些行动？','如何分配能源、值班权与风险责任？'],
        result:'装备有效，仍不等于系统可长期维持。'},
      {title:'沙漠城市遭遇长期限水',cards:[
        '热应激与脱水风险由谁承担？','节水知识如何传播并形成日常习惯？','蒸发、储水与输送能力允许多少用量？','配额、价格与优先供水规则如何制定？'],
        result:'环境压力会经技术与规则转化为不同后果。'}
    ];
    this.prompts=['生理反应与负担由谁承受？','知识怎样学习并可靠交接？','环境规律允许哪些行动？','谁定规则、执行并承担责任？'];
    this.state=this.freshState();
  }
  connectedCallback(){this.renderShell();this.start()}
  freshState(){return {round:0,placed:[false,false,false,false],selected:null,checked:false,complete:false,trace:[]}}
  start(){this.state=this.freshState();this.renderRound();this.emit('game-start',{state:this.getState()})}
  reset(){this.start();this.emit('game-reset',{state:this.getState()})}
  getState(){return JSON.parse(JSON.stringify(this.state))}
  emit(name,detail){this.dispatchEvent(new CustomEvent(name,{bubbles:true,composed:true,detail}))}
  renderShell(){
    this.innerHTML=`<main class="game-shell">
      <section class="ledger min0 strata" aria-label="四问判断账本">
        <div class="case-strip"><div><div class="label">当前新案例</div><div class="case-name" id="caseName"></div></div><div class="sequence-note">从身体开始，逐行接通 →</div><div class="status" id="status" aria-live="polite"></div></div>
        <div class="check-flow" id="flow"></div>
        <div class="ledger-principle">同一案例必须依次通过四问，不是从四个标签中选一个。</div>
      </section>
      <aside class="side-tray min0" aria-label="待归位陈述">
        <div class="tray-head"><h2>待审陈述</h2><p>拖入对应行；键盘用方向键选行，回车归位。</p></div>
        <div class="cards" id="cards"></div>
        <div class="result-node" id="result"><div class="result-label">综合判断</div><div class="result-text">四行接通后，结论才会展开。</div></div>
        <div class="controls"><div class="feedback" id="feedback" aria-live="polite">任何一类被遗漏，方案都可能失效。</div><button class="action" id="action" type="button">检查本轮</button></div>
      </aside>
    </main>`;
    this.flow=this.querySelector('#flow');this.cardsEl=this.querySelector('#cards');
    this.statusEl=this.querySelector('#status');this.feedback=this.querySelector('#feedback');
    this.action=this.querySelector('#action');this.result=this.querySelector('#result');
    this.action.addEventListener('click',()=>this.advance());
  }
  renderRound(){
    const c=this.cases[this.state.round];
    this.querySelector('#caseName').textContent=c.title;
    this.flow.innerHTML='';this.cardsEl.innerHTML='';
    this.dimensions.forEach((dim,i)=>{
      const row=document.createElement('div');row.className='check-row';row.dataset.index=i;
      row.innerHTML=`<div class="node">${i+1}</div><div class="dimension">${dim}<span class="prompt">${this.prompts[i]}</span></div><div class="dropzone">放到这里</div>`;
      const zone=row.querySelector('.dropzone');
      zone.addEventListener('dragover',e=>e.preventDefault());zone.addEventListener('drop',e=>{e.preventDefault();this.tryPlace(Number(e.dataTransfer.getData('text/plain')),i)});
      this.flow.appendChild(row);
      const card=document.createElement('button');card.type='button';card.className='statement';card.draggable=true;card.dataset.index=i;card.textContent=c.cards[i];card.setAttribute('aria-label',`${c.cards[i]}。用上下方向键选择检查行，回车归位。`);
      card.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',String(i)));
      card.addEventListener('click',()=>this.selectCard(i));
      card.addEventListener('keydown',e=>this.keyboardPlace(e,i));this.cardsEl.appendChild(card);
    });
    this.state.placed=[false,false,false,false];this.state.selected=null;this.state.checked=false;
    this.result.classList.remove('open');this.result.querySelector('.result-text').textContent='四行接通后，结论才会展开。';
    this.feedback.className='feedback';this.feedback.textContent='任何一类被遗漏，方案都可能失效。';
    this.action.textContent='检查本轮';this.action.disabled=true;this.updateStatus();
  }
  selectCard(i){if(this.state.placed[i])return;this.state.selected=i;this.keyboardTarget=i;this.querySelectorAll('.statement').forEach((el,j)=>el.classList.toggle('selected',j===i));this.flow.querySelectorAll('.check-row').forEach((el,j)=>el.classList.toggle('target',j===this.keyboardTarget));this.feedback.className='feedback';this.feedback.textContent='已选陈述：用方向键选检查行，回车归位。'}
  keyboardPlace(e,i){
    if(!['ArrowUp','ArrowDown','Enter',' '].includes(e.key))return;e.preventDefault();
    if(this.state.selected!==i)this.selectCard(i);
    if(e.key==='ArrowUp')this.keyboardTarget=(this.keyboardTarget+this.dimensions.length-1)%this.dimensions.length;
    if(e.key==='ArrowDown')this.keyboardTarget=(this.keyboardTarget+1)%this.dimensions.length;
    this.flow.querySelectorAll('.check-row').forEach((el,j)=>el.classList.toggle('target',j===this.keyboardTarget));
    if(e.key==='Enter'||e.key===' ')this.tryPlace(i,this.keyboardTarget);
  }
  tryPlace(cardIndex,rowIndex){
    if(!Number.isInteger(cardIndex)||this.state.placed[cardIndex])return;
    const card=this.querySelector(`.statement[data-index="${cardIndex}"]`);
    if(cardIndex!==rowIndex){
      card.classList.remove('wrong');void card.offsetWidth;card.classList.add('wrong');
      this.feedback.className='feedback error';
      this.feedback.textContent=`这张卡谈的是「${this.dimensions[cardIndex]}」，不是「${this.dimensions[rowIndex]}」：请看它约束的是身体反应、知识传递、环境规律还是共同规则。`;
      return;
    }
    this.state.placed[cardIndex]=true;this.state.selected=null;
    card.classList.add('placed');card.classList.remove('selected');this.flow.querySelectorAll('.check-row').forEach(el=>el.classList.remove('target'));
    const row=this.flow.children[rowIndex];row.classList.add('done');row.querySelector('.dropzone').textContent=this.cases[this.state.round].cards[cardIndex];row.querySelector('.dropzone').disabled=true;
    this.feedback.className='feedback';this.feedback.textContent=`「${this.dimensions[rowIndex]}」已接通，继续下一问。`;
    const filled=this.state.placed.filter(Boolean).length;this.action.disabled=filled!==this.dimensions.length;this.updateStatus();
    this.emit('game-progress',{state:this.getState(),action:'place',metrics:{filled,total:this.dimensions.length}});
  }
  updateStatus(){this.statusEl.textContent=`案例 ${this.state.round+1} / ${this.cases.length}｜已归位 ${this.state.placed.filter(Boolean).length} / ${this.dimensions.length}`}
  advance(){
    if(this.state.complete){this.reset();return}
    if(!this.state.placed.every(Boolean))return;
    if(!this.state.checked){
      this.state.checked=true;this.result.classList.add('open');this.state.trace.push({round:this.state.round,complete:true});
      if(this.state.round===this.cases.length-1){
        this.state.complete=true;this.result.querySelector('.result-text').textContent='四问完成：不要用单一解释替代系统判断。';
        this.feedback.textContent='身体、文化、物理与制度必须连续检查。';this.action.textContent='重新开始';
        this.emit('game-complete',{score:this.cases.length,metrics:{rounds:this.cases.length},trace:this.state.trace.slice()});
      }else{
        this.result.querySelector('.result-text').textContent=this.cases[this.state.round].result;
        this.feedback.textContent='四类约束已汇入综合判断。';this.action.textContent='下一案例';
      }
      return;
    }
    this.state.round+=1;this.renderRound();
  }
}
customElements.define('constraint-transfer-game',ConstraintTransferGame);
Deck.init({index:48,total:50});
</script>
</body>
</html>
