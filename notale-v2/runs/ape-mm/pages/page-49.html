<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .plate-head {
    height: 132px;
    padding: 34px 64px 18px;
    border-bottom: 1px solid var(--line);
  }
  .kicker {
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .18em;
    line-height: 1.4;
  }
  .head-take {
    max-width: 650px;
    color: var(--muted);
    font-size: var(--fs-sec);
    line-height: 1.5;
    text-align: right;
  }
  .evidence-plate {
    position: relative;
    flex: 1;
    min-height: 0;
    margin: 0 48px;
    overflow: hidden;
  }
  .evidence-plate::before,
  .evidence-plate::after {
    position: absolute;
    z-index: 3;
    width: 22px;
    height: 22px;
    content: "";
    pointer-events: none;
  }
  .evidence-plate::before {
    top: 12px;
    left: 0;
    border-top: 1px solid var(--primary-line);
    border-left: 1px solid var(--primary-line);
  }
  .evidence-plate::after {
    right: 0;
    bottom: 10px;
    border-right: 1px solid var(--primary-line);
    border-bottom: 1px solid var(--primary-line);
  }
  .evidence-map {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .main-route {
    fill: none;
    stroke: var(--primary);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    filter: drop-shadow(0 0 6px var(--primary-line));
    stroke-dasharray: 1900;
    stroke-dashoffset: 1900;
    animation: route-in 900ms ease-out forwards;
  }
  .orbit-ghost,
  .leader,
  .earth-line,
  .icon-line {
    fill: none;
    vector-effect: non-scaling-stroke;
  }
  .orbit-ghost { stroke: var(--primary-line); stroke-width: 1.5; stroke-dasharray: 7 9; }
  .leader { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 4 5; }
  .earth-line { stroke: var(--primary-line); stroke-width: 2; }
  .atmosphere { fill: none; stroke: var(--primary); stroke-width: 1; opacity: .55; }
  .icon-line { stroke: var(--primary); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-faint { fill: none; stroke: var(--line-strong); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .relay { fill: var(--bg); stroke: var(--accent); stroke-width: 3; vector-effect: non-scaling-stroke; }
  .relay-core { fill: var(--accent); }
  .e-node { opacity: 0; animation: node-in 360ms ease-out forwards; }
  .e-node:nth-of-type(1) { animation-delay: 560ms; }
  .e-node:nth-of-type(2) { animation-delay: 680ms; }
  .e-node:nth-of-type(3) { animation-delay: 800ms; }
  .e-node:nth-of-type(4) { animation-delay: 920ms; }
  .e-node:nth-of-type(5) { animation-delay: 1040ms; }
  .evidence-list {
    --enum-cols: 5;
    position: absolute;
    z-index: 2;
    inset: 0;
    pointer-events: none;
  }
  .evidence-list > .it {
    align-self: start;
    height: max-content;
    margin: 0 12px;
    padding: 10px 12px 12px 16px;
    border: 0;
    border-top: 1px solid var(--line-strong);
    border-radius: 0;
    background: linear-gradient(180deg, var(--panel-deep), transparent);
    opacity: 0;
    transform: translateY(8px);
    animation: label-in 420ms ease-out forwards;
  }
  .evidence-list > .it:nth-child(1) { margin-top: 314px; animation-delay: 980ms; }
  .evidence-list > .it:nth-child(2) { margin-top: 42px; animation-delay: 1100ms; }
  .evidence-list > .it:nth-child(3) { margin-top: 405px; animation-delay: 1220ms; }
  .evidence-list > .it:nth-child(4) { margin-top: 38px; animation-delay: 1340ms; }
  .evidence-list > .it:nth-child(5) { margin-top: 340px; animation-delay: 1460ms; }
  .tagline { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .node-no {
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .08em;
    line-height: 1.4;
  }
  .evidence-id {
    color: var(--faint);
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.4;
  }
  .evidence-list > .it > .title {
    margin-top: 2px;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.4;
  }
  .evidence-list > .it > .content {
    margin-top: 3px;
    color: var(--text);
    font-size: 16px;
    line-height: 1.45;
  }
  .reject {
    margin-top: 5px;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.45;
  }
  .reject::before { color: var(--accent); content: "≠ "; font-weight: 800; }
  .closing {
    height: 108px;
    margin: 0 64px;
    padding: 18px 24px 20px;
    border-top: 1px solid var(--accent-line);
    background: linear-gradient(90deg, var(--accent-soft), transparent 68%);
  }
  .closing-main {
    color: var(--text);
    font-size: var(--fs-lead);
    font-weight: 750;
    line-height: 1.45;
  }
  .closing-sub {
    max-width: 700px;
    color: var(--muted);
    font-size: var(--fs-sec);
    line-height: 1.5;
    text-align: right;
  }
  @keyframes route-in { to { stroke-dashoffset: 0; } }
  @keyframes node-in { from { opacity: 0; transform: scale(.72); } to { opacity: 1; transform: scale(1); } }
  @keyframes label-in { to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .main-route { stroke-dashoffset: 0; animation: none; }
    .e-node, .evidence-list > .it { opacity: 1; transform: none; animation: none; }
  }
</style>
</head>
<body data-page="49" data-total="50">
