<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{position:relative;min-height:100svh;background:var(--bg);isolation:isolate}
  .finale{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden}
  .scene{position:absolute;top:0;right:0;bottom:0;z-index:-2;width:1000px;min-width:0;min-height:0}
  .scene svg{display:block;width:100%;height:100%}
  .veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(7,16,24,.96) 0%,rgba(7,16,24,.78) 35%,rgba(7,16,24,.30) 58%,rgba(7,16,24,.12) 100%);pointer-events:none}
  .copy{position:absolute;z-index:3;top:90px;left:86px;width:660px}
  .kicker{margin:0 0 20px;color:var(--primary);font-family:var(--font-mono);font-size:16px;font-weight:700;letter-spacing:.16em;line-height:1.4}
  h1{max-width:18ch;font-size:clamp(42px,6vw,88px);line-height:1.02;letter-spacing:.01em}
  .k-generalization{position:absolute;inset:0;display:block}
  .k-generalization>.claim{position:absolute;z-index:4;top:280px;left:86px;width:610px;padding:26px 30px;border-radius:var(--radius-2);background:linear-gradient(90deg,rgba(13,27,38,.96),rgba(13,27,38,.62));box-shadow:var(--shadow-panel)}
  .claim-main{margin:0;font-size:clamp(18px,2vw,28px);font-weight:760;line-height:1.45}
  .claim-close{margin:16px 0 0;color:var(--muted);font-size:19px;line-height:1.55}
  .equation{display:flex;align-items:center;gap:10px;margin-top:22px;color:var(--muted);font-size:16px;font-weight:700;line-height:1.4}
  .equation .plus{color:var(--primary)}
  .equation .arrive{color:var(--text)}
  .k-generalization>.trunk{position:absolute;inset:0;z-index:2}
  .k-generalization>.trunk::before{top:188px;bottom:126px;left:768px;width:2px;background:linear-gradient(180deg,transparent,var(--primary-line) 14%,var(--primary) 50%,var(--primary-line) 86%,transparent)}
  .trunk::after{position:absolute;top:452px;left:696px;width:72px;height:2px;content:"";background:linear-gradient(90deg,var(--primary),var(--primary-line))}
  .k-generalization .supports{position:absolute;inset:0;display:block;padding:0;min-height:0}
  .k-generalization .support{position:absolute;width:290px;padding:13px 16px 13px 20px;border-color:var(--primary-line);border-radius:var(--radius-1);background:rgba(9,22,32,.86);box-shadow:0 10px 24px rgba(0,0,0,.22)}
  .k-generalization .support::before{top:50%;right:100%;left:auto;width:54px;background:var(--primary-line)}
  .support b{display:block;color:var(--text);font-family:var(--font-title);font-size:18px;line-height:1.35}
  .support>span{display:block;margin-top:3px;color:var(--muted);font-size:16px;line-height:1.4}
  .support .target{margin-top:6px;color:var(--primary);font-family:var(--font-mono);font-size:14px;letter-spacing:.06em}
  .s-body{top:184px;left:822px}
  .s-save{top:326px;left:804px}
  .s-remix{top:514px;left:820px}
  .s-arrive{top:684px;left:762px}
  .s-save::after,.s-remix::after{position:absolute;top:50%;left:100%;width:105px;height:1px;content:"";background:linear-gradient(90deg,var(--accent-line),transparent)}
  .orbital-path{fill:none;stroke:var(--primary);stroke-width:3;stroke-linecap:round;filter:url(#tealGlow);stroke-dasharray:1700;stroke-dashoffset:1700;animation:drawOrbit 1.05s ease-out .2s forwards}
  .earth-line{opacity:0;animation:earthIn .55s ease-out forwards}
  .node,.network-line{opacity:0;animation:nodeIn .38s ease-out forwards}
  .n1{animation-delay:.62s}.n2{animation-delay:.78s}.n3{animation-delay:.94s}.n4{animation-delay:1.1s}.n5{animation-delay:1.24s}
  .copy,.claim{opacity:0;transform:translateY(10px);animation:titleIn .55s ease-out 1.25s forwards}
  .claim{animation-delay:1.38s}
  @keyframes earthIn{to{opacity:1}}
  @keyframes drawOrbit{to{stroke-dashoffset:0}}
  @keyframes nodeIn{to{opacity:1}}
  @keyframes titleIn{to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.earth-line,.node,.network-line,.copy,.claim{opacity:1;transform:none;animation:none}.orbital-path{stroke-dashoffset:0;animation:none}}
</style>
</head>
<body data-page="50" data-total="50">
<div id="stage">
  <main class="finale min0" aria-labelledby="final-title">
    <div class="scene" aria-hidden="true">
      <svg viewBox="600 0 1000 900" role="img" aria-label="宇航员漂浮在地球弧面上方，身体轮廓仍在宇航服中，知识节点从多方汇入">
        <defs>
          <linearGradient id="earthFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--panel-raised)"/><stop offset="1" stop-color="var(--bg)"/></linearGradient>
          <linearGradient id="suitFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--text)" stop-opacity=".72"/><stop offset=".55" stop-color="var(--muted)" stop-opacity=".28"/><stop offset="1" stop-color="var(--panel)" stop-opacity=".76"/></linearGradient>
          <filter id="tealGlow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="amberGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <g class="earth-line">
          <path d="M600 897 Q1060 560 1595 814 L1595 900 L600 900Z" fill="url(#earthFill)"/>
          <path d="M600 897 Q1060 560 1595 814" fill="none" stroke="var(--primary)" stroke-opacity=".82" stroke-width="3" filter="url(#tealGlow)"/>
          <path d="M600 887 Q1060 548 1595 804" fill="none" stroke="var(--primary)" stroke-opacity=".2" stroke-width="12"/>
          <path d="M705 881 Q1030 711 1370 731" fill="none" stroke="var(--line-strong)" stroke-width="1"/>
          <path d="M840 851 Q1050 754 1270 754" fill="none" stroke="var(--line)" stroke-width="1"/>
        </g>
        <path class="orbital-path" d="M602 898 C650 760 880 665 1110 666 C1370 668 1515 570 1590 402"/>
        <g transform="translate(1262 366) rotate(12)">
          <ellipse cx="0" cy="318" rx="175" ry="30" fill="var(--bg)" opacity=".5"/>
          <rect x="-76" y="30" width="152" height="212" rx="62" fill="url(#suitFill)" stroke="var(--text)" stroke-opacity=".64" stroke-width="3"/>
          <rect x="-98" y="73" width="34" height="130" rx="16" fill="var(--panel-raised)" stroke="var(--line-strong)" stroke-width="2"/>
          <circle cx="0" cy="2" r="73" fill="var(--panel-deep)" stroke="var(--text)" stroke-opacity=".72" stroke-width="4"/>
          <circle cx="0" cy="2" r="55" fill="var(--bg)" stroke="var(--primary-line)" stroke-width="2"/>
          <path d="M-37 12 Q0 39 40 8" fill="none" stroke="var(--primary-line)" stroke-width="2"/>
          <path d="M-57 92 Q-142 145 -169 230" fill="none" stroke="url(#suitFill)" stroke-width="40" stroke-linecap="round"/>
          <path d="M60 94 Q143 126 167 70" fill="none" stroke="var(--muted)" stroke-opacity=".58" stroke-width="40" stroke-linecap="round"/>
          <path d="M-42 225 Q-82 292 -73 360" fill="none" stroke="var(--muted)" stroke-opacity=".62" stroke-width="48" stroke-linecap="round"/>
          <path d="M42 225 Q95 285 126 338" fill="none" stroke="var(--muted)" stroke-opacity=".62" stroke-width="48" stroke-linecap="round"/>
          <g fill="none" stroke="var(--primary)" stroke-opacity=".48" stroke-width="2">
            <circle cx="0" cy="5" r="24"/><path d="M0 30 L0 172 M0 75 L-46 132 M0 75 L52 118 M0 172 L-35 226 M0 172 L52 222"/>
          </g>
          <g fill="var(--primary)"><circle cx="0" cy="75" r="5"/><circle cx="-46" cy="132" r="5"/><circle cx="52" cy="118" r="5"/><circle cx="0" cy="172" r="5"/><circle cx="-35" cy="226" r="5"/><circle cx="52" cy="222" r="5"/></g>
          <rect x="-34" y="112" width="68" height="47" rx="8" fill="var(--panel-deep)" stroke="var(--accent-line)" stroke-width="2"/>
        </g>
        <g fill="none" stroke="var(--accent)" stroke-opacity=".76" stroke-width="2" filter="url(#amberGlow)">
          <path class="network-line n1" d="M1045 134 C1130 174 1160 280 1236 474"/>
          <path class="network-line n2" d="M1540 216 C1430 264 1368 348 1288 474"/>
          <path class="network-line n3" d="M1512 584 C1402 548 1350 510 1288 474"/>
          <path class="network-line n4" d="M1064 606 C1142 560 1190 520 1236 474"/>
        </g>
        <g fill="var(--bg)" stroke="var(--accent)" stroke-width="3" filter="url(#amberGlow)">
          <circle class="node n1" cx="1045" cy="134" r="8"/><circle class="node n2" cx="1540" cy="216" r="8"/><circle class="node n3" cx="1512" cy="584" r="8"/><circle class="node n4" cx="1064" cy="606" r="8"/><circle class="node n5" cx="1262" cy="474" r="10"/>
        </g>
      </svg>
    </div>
    <div class="veil"></div>

    <header class="copy">
      <p class="kicker">FINAL / APEMAN—SPACEMAN</p>
      <h1 id="final-title">动物，抵达太空</h1>
    </header>

    <section class="k-generalization" aria-label="四条支撑汇入收束主张">
      <div class="claim">
        <p class="claim-main">太空人仍是动物，但成为了能共同保存并重组知识的动物。</p>
        <p class="claim-close">抵达太空不是演化进度条的终点，而是古老身体、累积文化与集体技术的一次共同抵达。</p>
        <div class="equation" aria-label="古老身体加外部保存加集体重组，形成太空人">
          <span>古老身体</span><span class="plus">＋</span><span>外部保存与集体重组</span><span class="arrive">→ 太空人</span>
        </div>
      </div>
      <div class="trunk">
        <div class="supports">
          <div class="support s-body"><b>身体</b><span>地球演化留下的身体</span><span class="target">宇航服内 · 仍是动物</span></div>
          <div class="support s-save"><b>保存</b><span>知识可以活得比个体更久</span><span class="target">存储节点 · 跨越世代</span></div>
          <div class="support s-remix"><b>重组</b><span>分散的专长能够重新组合</span><span class="target">汇流连线 · 跨越个体</span></div>
          <div class="support s-arrive"><b>抵达</b><span>共同控制环境，而非脱离动物性</span><span class="target">地球弧面 · 环境仍在</span></div>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:50,total:50});</script>
</body>
</html>
