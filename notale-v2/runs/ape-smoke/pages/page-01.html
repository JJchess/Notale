<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<title>Apeman – Spaceman · Apeman 与 Spaceman</title>
<style>
  /* Lec.mount 会在 body 外层生成一份导航用的 header/footer(品牌/页码/上下页),
     这一页的教学内容已经在 #stage 内部用 page-head/page-foot 完整呈现,
     不需要再显示第二份,隐藏即可(仍然调用 mount 以满足 title/nav 的约定)。 */
  #lec-header, #lec-footer{ display:none; }

  .page-atmo{
    position: relative;
    width: 100%;
    height: 100%;
  }
  .atmo-canvas{
    z-index: 0;
    pointer-events: none;
  }
  .page-content{
    position: relative;
    z-index: 1;
    padding: var(--sp-7) var(--sp-6);
  }
  .page-content > .page-head{
    align-items: center;
    text-align: center;
  }
  .page-content > .page-foot{
    justify-content: center;
    border-top: none;
    padding-top: 0;
  }
  .page-content .take{
    text-align: center;
    max-width: 760px;
  }

  .paradox{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--sp-4);
  }
  .paradox-line{
    margin: 0;
    text-align: center;
    font-weight: 600;
    line-height: var(--lh-body);
    font-size: max(34px, calc(var(--floor-body) / var(--s)));
  }
  .paradox-line-1,
  .paradox-line-2{ color: var(--text); }
  .paradox-divider{
    width: var(--sp-6);
    height: var(--stroke-2);
    background: var(--accent);
    border-radius: var(--radius-pill);
  }
</style>
</head>
<body data-page="01" data-total="24">
<div id="stage">
  <div class="page-atmo">
    <canvas class="atmo-canvas cv-fill no-pan" aria-hidden="true"></canvas>

    <div class="page-content focus">
      <div class="page-head">
        <div class="kicker">OPENING</div>
        <h1 class="title" id="page-title"></h1>
      </div>

      <div class="focus-body">
        <div class="paradox">
          <p class="paradox-line paradox-line-1">从某个角度看，我们只是漂浮在宇宙里的一粒沙。</p>
          <div class="paradox-divider"></div>
          <p class="paradox-line paradox-line-2">从另一个角度看，我们是自然最杰出的产物。</p>
        </div>
      </div>

      <div class="page-foot">
        <p class="take">同一个物种，能用两种完全相反的方式描述自己——这门课要说清楚为什么两者都对。</p>
      </div>
    </div>
  </div>
</div>

<script src="assets/base.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/lec.js"></script>
<script>
  Lec.mount({
    index: 1,
    kicker: `OPENING`,
    title: `Apeman <em>与</em> Spaceman`,
    take: `同一个物种,能用两种完全相反的方式描述自己——这门课要说清楚为什么两者都对。`
  });

  // Lec.mount 只用 createTextNode 写标题,不解析 <em>;这一页把标题渲染在
  // #stage 内部,自己用 innerHTML 还原強调标签。
  document.getElementById('page-title').innerHTML = 'Apeman <em>与</em> Spaceman';

  // ---------------------------------------------------------------------
  // 氛围粒子:缓慢漂浮的尘埃,营造"漂浮在宇宙中"的沉浸感。
  // 纯装饰性背景,不承载任何数据,不设交互 —— 这一页的任务只是立情绪基调。
  // ---------------------------------------------------------------------
  (function () {
    var cv = document.querySelector('.atmo-canvas');
    var ctx = Deck.fit(cv);
    var W = Deck.W, H = Deck.H;

    var rng = new Math.seedrandom('page-01');

    var COUNT = 110;
    var particles = [];
    for (var i = 0; i < COUNT; i++) {
      particles.push({
        x: rng() * W,
        y: rng() * H,
        r: 0.8 + rng() * 2.2,
        alpha: 0.10 + rng() * 0.45,
        vy: 2 + rng() * 5,          // 缓慢向上漂移,px/s
        wind: -1.5 + rng() * 3,      // 缓慢侧向整体漂移,px/s
        swayAmp: 6 + rng() * 16,
        swaySpeed: 0.15 + rng() * 0.35,
        phase: rng() * Math.PI * 2,
        star: rng() < 0.18            // 少量点用强调色,像散落的星光
      });
    }

    var dustColor = Deck.rgba('text-dim', 1);
    var starColor = Deck.rgba('accent', 1);

    function draw(tSec) {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        var x = p.x + Math.sin(tSec * p.swaySpeed + p.phase) * p.swayAmp;
        var y = p.y;
        ctx.beginPath();
        ctx.arc(x, y, p.r, 0, Math.PI * 2);
        var base = p.star ? starColor : dustColor;
        ctx.fillStyle = base.replace(/[\d.]+\)$/, p.alpha + ')');
        ctx.fill();
      }
    }

    function step(t, dtMs) {
      var dt = Math.min(dtMs, 100) / 1000; // 秒,且吞掉后台恢复的大跳变
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.y -= p.vy * dt;
        p.x += p.wind * dt;
        if (p.y < -10) {
          p.y = H + 10;
          p.x = rng() * W;
        } else if (p.y > H + 10) {
          p.y = -10;
          p.x = rng() * W;
        }
        if (p.x < -20) { p.x = W + 20; }
        else if (p.x > W + 20) { p.x = -20; }
      }
      draw(t / 1000);
    }

    Deck.onResize(function () {
      ctx = Deck.fit(cv);
      W = Deck.W; H = Deck.H;
    });

    // reduced-motion 下只画一帧:粒子初始位置已经均匀分布在整幅画面,
    // 直接定格展示即是一个自然的静态尘埃分布。
    Deck.loop(step, { still: 0 });
  })();
</script>
</body>
</html>
