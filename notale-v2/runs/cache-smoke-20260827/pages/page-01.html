<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="01" data-total="21">
<div id="stage">
  <style>
    #stage{
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    .p01-head{
      flex:0 0 112px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      text-align:center;
    }
    .p01-kicker{
      margin:0 0 12px;
      color:var(--muted);
      font-family:var(--font-mono);
      font-size:var(--fs-label);
      letter-spacing:.16em;
    }
    .p01-title{
      margin:0;
      color:var(--text);
      font-family:var(--font-sans);
      font-size:var(--fs-h1);
      line-height:1.2;
      font-weight:700;
    }
    .p01-main{
      position:relative;
      flex:1;
      min-height:0;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .p01-focus{
      position:relative;
      width:min(1280px, 100%);
      height:500px;
      min-height:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:28px;
      padding:34px 54px;
      border:1px solid var(--line-soft);
      border-radius:8px;
      background:var(--panel-bg);
      isolation:isolate;
    }
    .p01-trunk{
      position:absolute;
      z-index:-1;
      top:46px;
      bottom:36px;
      left:50%;
      width:1px;
      background:var(--line-soft);
    }
    .p01-field-label{
      margin:0;
      padding:0 18px;
      background:var(--panel-bg);
      color:var(--muted);
      font-family:var(--font-sans);
      font-size:var(--fs-label);
      letter-spacing:.12em;
    }
    .p01-pair-head{
      display:grid;
      grid-template-columns:126px 54px 126px;
      gap:18px;
      width:100%;
      color:var(--muted);
      font-family:var(--font-sans);
      font-size:var(--fs-label);
      text-align:center;
    }
    .p01-pair-head span:last-child{ color:var(--model); }
    .p01-change{
      width:100%;
      display:flex !important;
      grid-template-columns:none !important;
      align-items:stretch;
      justify-content:center;
      gap:24px;
      white-space:nowrap;
    }
    .p01-change::before,
    .p01-change::after{ content:none !important; }
    .p01-pair{
      position:static !important;
      transform:none !important;
      width:360px;
      min-height:188px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:18px;
      border:1px solid var(--line-soft);
      border-radius:8px;
      background:var(--paper) !important;
      color:var(--text) !important;
      box-shadow:none !important;
      opacity:1 !important;
    }
    .p01-pair::before,
    .p01-pair::after{ content:none !important; }
    .p01-same{
      margin:0;
      color:var(--muted);
      font-family:var(--font-sans);
      font-size:var(--fs-sec);
    }
    .p01-pair-body{
      display:flex;
      align-items:center;
      gap:18px;
    }
    .p01-value{
      min-width:126px;
      padding:18px 22px;
      border:1px solid var(--line-soft);
      border-radius:8px;
      background:var(--panel-bg);
      color:var(--text);
      text-align:center;
      font-family:var(--font-mono);
      font-size:var(--fs-h2);
      font-variant-numeric:tabular-nums;
    }
    .p01-value.now{
      border-color:var(--model);
      color:var(--model);
      font-weight:700;
    }
    .p01-arrow{
      position:relative;
      width:54px;
      height:18px;
      flex:0 0 54px;
    }
    .p01-arrow::before{
      content:"";
      position:absolute;
      left:0;
      right:7px;
      top:8px;
      height:3px;
      background:var(--line);
    }
    .p01-arrow::after{
      content:"";
      position:absolute;
      right:0;
      top:3px;
      width:10px;
      height:10px;
      border-top:3px solid var(--line);
      border-right:3px solid var(--line);
      transform:rotate(45deg);
    }
    .p01-claim{
      position:relative;
      max-width:940px;
      margin:0;
      padding:26px 44px;
      background:var(--panel-bg);
      color:var(--text);
      font-family:var(--font-serif);
      font-size:var(--fs-h2);
      line-height:1.45;
      text-align:center;
    }
    .p01-claim::before,
    .p01-claim::after{
      content:"";
      position:absolute;
      top:50%;
      width:68px;
      height:1px;
      background:var(--line-soft);
    }
    .p01-claim::before{ right:100%; }
    .p01-claim::after{ left:100%; }
    .p01-next{
      flex:0 0 94px;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding-bottom:4px;
    }
    .p01-next p{
      margin:0;
      color:var(--muted);
      font-family:var(--font-sans);
      font-size:var(--fs-lead);
      line-height:1.35;
    }
    .p01-next p::before{
      content:"";
      display:inline-block;
      width:22px;
      height:1px;
      margin:0 12px 6px 0;
      background:var(--line);
    }
  </style>

  <header class="p01-head">
    <p class="p01-kicker">CHAPTER I · 看见学习</p>
    <h1 class="p01-title">神经网络的“学会”，不是魔法</h1>
  </header>

  <main class="p01-main min0 k-generalization" aria-label="模型内部数字的改前与改后">
    <section class="p01-focus focus min0">
      <div class="p01-trunk" aria-hidden="true"></div>
      <p class="p01-field-label">模型内部的数字</p>
      <div class="p01-change change-row" role="group" aria-label="三组数字变化">
        <div class="p01-pair">
          <p class="p01-same">同一位置</p>
          <div class="p01-pair-head" aria-hidden="true"><span>改前</span><span></span><span>改后</span></div>
          <div class="p01-pair-body"><span class="p01-value tag num">0.00</span><span class="p01-arrow" aria-hidden="true"></span><span class="p01-value now tag num">0.18</span></div>
        </div>
        <div class="p01-pair">
          <p class="p01-same">同一位置</p>
          <div class="p01-pair-head" aria-hidden="true"><span>改前</span><span></span><span>改后</span></div>
          <div class="p01-pair-body"><span class="p01-value tag num">0.00</span><span class="p01-arrow" aria-hidden="true"></span><span class="p01-value now tag num">−0.07</span></div>
        </div>
        <div class="p01-pair">
          <p class="p01-same">同一位置</p>
          <div class="p01-pair-head" aria-hidden="true"><span>改前</span><span></span><span>改后</span></div>
          <div class="p01-pair-body"><span class="p01-value tag num">0.00</span><span class="p01-arrow" aria-hidden="true"></span><span class="p01-value now tag num">0.11</span></div>
        </div>
      </div>
      <p class="p01-claim">它可以被看成：模型里一串数字有方向地改变。</p>
    </section>
  </main>

  <footer class="p01-next">
    <p>训练时，究竟是哪些东西会变？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
