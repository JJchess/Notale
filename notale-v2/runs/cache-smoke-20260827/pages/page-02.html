<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="02" data-total="21">
<div id="stage">
  <style>
    #training-classifier{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:14px;
      color:var(--text);
    }
    #training-classifier .tc-head{
      flex:0 0 auto;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:4px;
    }
    #training-classifier .tc-kicker{
      margin:0;
      color:var(--muted);
      font-size:var(--fs-label);
      font-weight:700;
      letter-spacing:.11em;
    }
    #training-classifier h1{
      margin:0;
      font-size:var(--fs-h1);
      line-height:1.16;
      font-weight:750;
      letter-spacing:-.02em;
    }
    #training-classifier .tc-widget{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    #training-classifier .tc-instruction{
      min-height:42px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
      padding:0 4px;
    }
    #training-classifier .tc-instruction strong{
      font-size:var(--fs-lead);
      line-height:1.35;
    }
    #training-classifier .tc-instruction span{
      color:var(--muted);
      font-size:var(--fs-label);
    }
    #training-classifier .tc-cards{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:20px;
      flex:0 0 342px;
    }
    #training-classifier .tc-card{
      appearance:none;
      position:relative;
      min-width:0;
      height:342px;
      padding:24px 20px 18px;
      border:2px solid var(--line-soft);
      border-radius:14px;
      background:transparent;
      color:var(--text);
      font:inherit;
      text-align:left;
      cursor:pointer;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:10px;
      transition:border-color 140ms ease, box-shadow 140ms ease, background-color 140ms ease;
    }
    #training-classifier .tc-card:hover{
      border-color:var(--line);
      background:rgba(233,230,221,.38);
    }
    #training-classifier .tc-card:focus-visible{
      outline:3px solid var(--focus);
      outline-offset:3px;
    }
    #training-classifier .tc-card[aria-pressed="true"]{
      border-color:var(--focus);
      box-shadow:0 0 0 2px var(--focus) inset;
      background:rgba(245,158,11,.07);
    }
    #training-classifier .tc-kind{
      height:44px;
      display:flex;
      align-items:center;
      gap:12px;
    }
    #training-classifier .tc-origin{
      color:var(--muted);
      font-size:var(--fs-label);
      font-weight:650;
    }
    #training-classifier .tc-kind .sample{
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      font-family:var(--font-mono);
      font-size:var(--fs-body);
      font-weight:700;
    }
    #training-classifier .tc-kind .param{
      min-width:60px;
      height:38px;
      display:grid;
      place-items:center;
      font-family:var(--font-mono);
      font-size:var(--fs-body);
      font-weight:700;
    }
    #training-classifier .tc-card-title{
      font-size:var(--fs-h2);
      line-height:1.2;
      font-weight:750;
    }
    #training-classifier .tc-card-title code{
      font:700 1em var(--font-mono);
    }
    #training-classifier .tc-card-desc{
      min-height:48px;
      color:var(--muted);
      font-size:var(--fs-sec);
      line-height:1.45;
    }
    #training-classifier .tc-selected-label{
      position:absolute;
      top:16px;
      right:16px;
      color:var(--text);
      font-size:var(--fs-label);
      font-weight:750;
      opacity:0;
    }
    #training-classifier .tc-card[aria-pressed="true"] .tc-selected-label{opacity:1}
    #training-classifier .tc-card-choice{
      margin-top:14px;
      padding-top:12px;
      width:100%;
      border-top:1px dashed var(--line-soft);
      color:var(--muted);
      font-size:var(--fs-label);
      line-height:1.35;
    }
    #training-classifier .tc-card[aria-pressed="true"] .tc-card-choice{
      color:var(--text);
      font-weight:700;
    }
    #training-classifier .tc-card-feedback{
      margin-top:auto;
      min-height:38px;
      color:var(--text);
      font-size:var(--fs-label);
      line-height:1.35;
      font-weight:650;
      opacity:0;
    }
    #training-classifier[data-mode="checked"] .tc-card-feedback{opacity:1}
    #training-classifier .tc-classification{
      position:relative;
      flex:1 1 108px;
      min-height:102px;
      display:flex;
      align-items:flex-end;
    }
    #training-classifier .tc-placeholder{
      position:absolute;
      inset:8px 0 12px;
      border:1px dashed var(--line-soft);
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      color:var(--muted);
      font-size:var(--fs-sec);
    }
    #training-classifier .tc-placeholder strong{
      color:var(--text);
      font-size:var(--fs-body);
    }
    #training-classifier[data-mode="checked"] .tc-placeholder{display:none}
    #training-classifier .tc-links{
      position:absolute;
      inset:0 0 56px;
      width:100%;
      height:calc(100% - 56px);
      overflow:visible;
      pointer-events:none;
      opacity:0;
    }
    #training-classifier[data-mode="checked"] .tc-links{opacity:1}
    #training-classifier .tc-links path{
      fill:none;
      stroke:var(--line);
      stroke-width:2.5;
      vector-effect:non-scaling-stroke;
    }
    #training-classifier .tc-links circle{
      fill:var(--paper);
      stroke:var(--line);
      stroke-width:2;
      vector-effect:non-scaling-stroke;
    }
    #training-classifier .tc-groups{
      width:100%;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }
    #training-classifier .tc-group{
      min-width:0;
      min-height:82px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--panel-bg);
      padding:12px 18px;
      display:flex;
      align-items:center;
      gap:16px;
      opacity:0;
      transform:translateY(4px);
    }
    #training-classifier[data-mode="checked"] .tc-group{
      opacity:1;
      transform:none;
    }
    #training-classifier .tc-group-mark{
      flex:0 0 auto;
      width:34px;
      height:34px;
      border:2px solid var(--line);
      display:grid;
      place-items:center;
      font-weight:800;
    }
    #training-classifier .tc-group:last-child .tc-group-mark{
      border-radius:8px;
      font-family:var(--font-mono);
    }
    #training-classifier .tc-group strong{
      display:block;
      margin-bottom:3px;
      font-size:var(--fs-body);
    }
    #training-classifier .tc-group span{
      color:var(--muted);
      font-size:var(--fs-sec);
      line-height:1.35;
    }
    #training-classifier .tc-action-row{
      flex:0 0 54px;
      display:flex;
      align-items:center;
      gap:12px;
    }
    #training-classifier .tc-feedback{
      flex:1;
      min-width:0;
      min-height:48px;
      display:flex;
      align-items:center;
      padding:7px 14px;
      border-radius:10px;
      background:var(--panel-bg);
      font-size:var(--fs-sec);
      line-height:1.35;
    }
    #training-classifier .tc-feedback[data-empty="true"]{
      color:var(--muted);
    }
    #training-classifier .tc-footer{
      flex:0 0 auto;
      border-top:1px solid var(--line-soft);
      padding-top:10px;
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:34px;
    }
    #training-classifier .tc-claim{
      margin:0;
      max-width:820px;
      font:700 var(--fs-lead)/1.45 var(--font-serif);
    }
    #training-classifier .tc-next{
      margin:0;
      color:var(--muted);
      font-size:var(--fs-sec);
      line-height:1.4;
      text-align:right;
    }
    #training-classifier .tc-links,
    #training-classifier .tc-group,
    #training-classifier .tc-card-feedback,
    #training-classifier .tc-selected-label{
      transition:opacity 160ms ease, transform 160ms ease;
    }
    @media (prefers-reduced-motion:reduce){
      #training-classifier *,#training-classifier *::before,#training-classifier *::after{transition:none!important}
    }
  </style>

  <main id="training-classifier" class="k-classification min0" data-mode="ready" aria-labelledby="tc-title">
    <header class="tc-head">
      <p class="tc-kicker">CHAPTER I · WHAT CHANGES?</p>
      <h1 id="tc-title">训练不是改题目，而是改模型里的数值</h1>
    </header>

    <section class="tc-widget min0" aria-label="训练对象分类">
      <div class="tc-instruction">
        <strong>点选所有训练时会变化的对象</strong>
        <span>点击卡片，或聚焦后按空格切换</span>
      </div>

      <div class="tc-cards stage-cards" role="group" aria-label="四个待分类对象">
        <button class="tc-card" type="button" data-id="x" aria-pressed="false">
          <span class="tc-selected-label" aria-hidden="true">已选</span>
          <span class="tc-kind"><span class="sample">x</span><span class="tc-origin">外部给定</span></span>
          <span class="tc-card-title">输入样本 <code>x</code></span>
          <span class="tc-card-desc">这次拿给模型看的信息</span>
          <span class="tc-card-choice">当前判断：待选择</span>
          <span class="tc-card-feedback">题目不能被模型偷偷改掉</span>
        </button>
        <button class="tc-card" type="button" data-id="t" aria-pressed="false">
          <span class="tc-selected-label" aria-hidden="true">已选</span>
          <span class="tc-kind"><span class="sample">t</span><span class="tc-origin">外部给定</span></span>
          <span class="tc-card-title">正确答案 <code>t</code></span>
          <span class="tc-card-desc">用来判断预测对不对的参照</span>
          <span class="tc-card-choice">当前判断：待选择</span>
          <span class="tc-card-feedback">答案要留下来充当参照</span>
        </button>
        <button class="tc-card" type="button" data-id="w" aria-pressed="false">
          <span class="tc-selected-label" aria-hidden="true">已选</span>
          <span class="tc-kind"><span class="param">w</span><span class="tc-origin">模型内部</span></span>
          <span class="tc-card-title">权重 <code>w</code></span>
          <span class="tc-card-desc">模型内部的连接影响力</span>
          <span class="tc-card-choice">当前判断：待选择</span>
          <span class="tc-card-feedback">会变：它是模型参数</span>
        </button>
        <button class="tc-card" type="button" data-id="b" aria-pressed="false">
          <span class="tc-selected-label" aria-hidden="true">已选</span>
          <span class="tc-kind"><span class="param">b</span><span class="tc-origin">模型内部</span></span>
          <span class="tc-card-title">偏置 <code>b</code></span>
          <span class="tc-card-desc">模型内部的默认倾向</span>
          <span class="tc-card-choice">当前判断：待选择</span>
          <span class="tc-card-feedback">会变：它也是模型参数</span>
        </button>
      </div>

      <div class="tc-classification min0" aria-hidden="true">
        <div class="tc-placeholder"><strong>归属待检查</strong><span>先做判断，再看四个对象分成哪两类</span></div>
        <svg class="tc-links" viewBox="0 0 1000 100" preserveAspectRatio="none">
          <path d="M125 0 V30 H250 V100 M375 0 V30 H250"/>
          <path d="M625 0 V30 H750 V100 M875 0 V30 H750"/>
          <circle cx="250" cy="30" r="4"/><circle cx="750" cy="30" r="4"/>
        </svg>
        <div class="tc-groups">
          <div class="tc-group">
            <span class="tc-group-mark">定</span>
            <div><strong>训练中保持给定</strong><span>用同一道题和同一个答案检验模型</span></div>
          </div>
          <div class="tc-group">
            <span class="tc-group-mark">w·b</span>
            <div><strong>训练中可以改变</strong><span>这些内部数字合称“参数”</span></div>
          </div>
        </div>
      </div>

      <div class="tc-action-row">
        <button class="btn" type="button" data-check>检查选择</button>
        <button class="btn" type="button" data-reset>重置本页</button>
        <div class="tc-feedback" data-feedback data-empty="true" aria-live="polite">选择后检查，分类归属才会显露。</div>
      </div>
    </section>

    <footer class="tc-footer">
      <p class="tc-claim">训练时改变的是权重和偏置，不是输入样本或正确答案。</p>
      <p class="tc-next">这些参数要经过哪三步，才算完成一次学习？</p>
    </footer>
  </main>

  <script>
  (() => {
    const root = document.getElementById('training-classifier');
    if (!root) return;

    const cards = Array.from(root.querySelectorAll('.tc-card'));
    const checkButton = root.querySelector('[data-check]');
    const resetButton = root.querySelector('[data-reset]');
    const feedback = root.querySelector('[data-feedback]');
    const controller = new AbortController();
    const signal = controller.signal;
    let destroyed = false;
    const initialState = () => ({ selected: new Set(), mode: 'ready', message: '' });
    let state = initialState();

    function transition(current, action) {
      if (action.type === 'toggle') {
        const selected = new Set(current.selected);
        selected.has(action.id) ? selected.delete(action.id) : selected.add(action.id);
        return { selected, mode: 'ready', message: '' };
      }
      if (action.type === 'check') {
        const wrongGiven = ['x','t'].filter(id => current.selected.has(id));
        const missed = ['w','b'].filter(id => !current.selected.has(id));
        let message;
        if (!wrongGiven.length && !missed.length) {
          message = '对：题目和答案留下来作参照，模型改的是 w 和 b。';
        } else {
          const parts = [];
          if (wrongGiven.length) {
            const names = wrongGiven.map(id => id === 'x' ? '输入样本' : '正确答案').join('、');
            parts.push(`${names}必须保持给定`);
          }
          if (missed.length) parts.push('还有模型内部的参数没有选中');
          message = `${parts.join('；')}。`;
        }
        return { selected:new Set(current.selected), mode:'checked', message };
      }
      if (action.type === 'reset') return initialState();
      return current;
    }

    function render(announce) {
      root.dataset.mode = state.mode;
      cards.forEach(card => {
        const selected = state.selected.has(card.dataset.id);
        card.setAttribute('aria-pressed', String(selected));
        card.querySelector('.tc-card-choice').textContent = selected ? '当前判断：会变化' : '当前判断：待选择';
      });
      const checked = state.mode === 'checked';
      root.querySelector('.tc-classification').setAttribute('aria-hidden', String(!checked));
      feedback.dataset.empty = String(!state.message);
      feedback.textContent = state.message || '选择后检查，分类归属才会显露。';
      if (announce && !state.message) feedback.textContent = '已重置，四张卡均未选择。';
    }

    function dispatch(action, announce=false) {
      if (destroyed) return;
      state = transition(state, action);
      render(announce);
    }

    cards.forEach(card => card.addEventListener('click', () => dispatch({type:'toggle', id:card.dataset.id}), {signal}));
    checkButton.addEventListener('click', () => dispatch({type:'check'}, true), {signal});
    resetButton.addEventListener('click', () => dispatch({type:'reset'}, true), {signal});

    function destroy() {
      if (destroyed) return;
      destroyed = true;
      controller.abort();
      delete root.destroyTrainingClassifier;
    }
    root.destroyTrainingClassifier = destroy;
    window.addEventListener('pagehide', destroy, {signal, once:true});
    render(false);
  })();
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
