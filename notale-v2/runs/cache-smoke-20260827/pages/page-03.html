<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="03" data-total="21">
<div id="stage">
  <style>
    .p03-head{height:102px;display:flex;flex-direction:column;justify-content:flex-start;gap:7px}
    .p03-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.14em;color:var(--muted)}
    .p03-title{margin:0;font:700 var(--fs-h1)/1.15 var(--font-sans);color:var(--text)}
    .p03-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:22px}
    .p03-process{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
    .p03-process::before{content:"";position:absolute;left:0;right:0;top:315px;border-top:2px solid var(--line);z-index:0}.p03-map{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
    .p03-step{position:relative;z-index:1;min-width:0;min-height:0;padding:26px 42px 22px;display:flex;flex-direction:column;background:repeating-linear-gradient(to bottom,var(--panel-bg) 0,var(--panel-bg) 66px,rgba(75,74,70,.16) 67px,var(--panel-bg) 68px)}
    .p03-step+.p03-step{border-left:1px solid var(--line-soft)}
    .p03-stephead{display:flex;align-items:baseline;gap:18px}
    .p03-index{font:700 var(--fs-h2)/1 var(--font-mono);color:var(--model)}
    .p03-step h2{margin:0;font:700 var(--fs-h2)/1.15 var(--font-sans)}
    .p03-mainline{margin:12px 0 0;font:400 var(--fs-body)/1.4 var(--font-sans);color:var(--muted)}
    .p03-visual{position:relative;flex:1;min-height:246px;margin-top:10px;display:flex;align-items:center;justify-content:center}
    .p03-bottom{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-soft);font:700 var(--fs-lead)/1.3 var(--font-sans)}
    .p03-sample{width:86px;height:86px;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;font:700 var(--fs-body)/1 var(--font-sans)}
    .p03-neuron{flex:0 0 auto;display:grid;place-items:center;border:3px solid var(--model);background:var(--paper);font:700 var(--fs-body)/1 var(--font-mono);color:var(--model)}
    .p03-pred,.p03-answer{min-width:100px;padding:13px 16px;border:2px solid var(--line);border-radius:8px;background:var(--paper);text-align:center;font:700 var(--fs-body)/1 var(--font-sans)}
    .p03-pred{border-color:var(--model);color:var(--model)}
    .p03-arrow{position:relative;width:48px;height:3px;background:var(--model);margin:0 8px}
    .p03-arrow::after{content:"";position:absolute;right:-1px;top:-6px;border-left:11px solid var(--model);border-top:7px solid transparent;border-bottom:7px solid transparent}
    .p03-compare{width:100%;display:grid;grid-template-columns:112px 92px 112px;align-items:center;justify-content:center;gap:18px}
    .p03-ruler{position:relative;width:92px;height:176px;border-left:3px solid var(--line);border-right:3px solid var(--line);background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(32,32,32,.16) 8px 12px);display:flex;align-items:center;justify-content:center}
    .p03-ruler::before,.p03-ruler::after{content:"";position:absolute;left:-10px;width:106px;border-top:2px solid var(--line)}
    .p03-ruler::before{top:0}.p03-ruler::after{bottom:0}
    .p03-ruler span{padding:6px 8px;background:var(--paper);font:700 var(--fs-label)/1 var(--font-sans);writing-mode:vertical-rl;letter-spacing:.12em}
    .p03-paramset{width:100%;display:flex;flex-direction:column;align-items:center;gap:24px}
    .p03-params{display:flex;gap:18px}
    .p03-param{min-width:78px;padding:12px 20px;border:2px solid var(--line);background:var(--paper);font:700 var(--fs-h2)/1 var(--font-mono);text-align:center}
    .p03-change{width:310px;padding:16px 18px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:center;gap:17px;background:var(--paper);font:700 var(--fs-body)/1.2 var(--font-mono)}
    .p03-change .arr{font-size:var(--fs-h2);color:var(--model)}
    .p03-bridge{position:absolute;z-index:3;top:300px;width:60px;height:31px;background:var(--paper);display:flex;align-items:center;justify-content:center}
    .p03-bridge::before{content:"";width:54px;border-top:3px solid var(--model)}
    .p03-bridge::after{content:"";position:absolute;right:2px;border-left:11px solid var(--model);border-top:7px solid transparent;border-bottom:7px solid transparent}
    .p03-bridge span{position:absolute;bottom:30px;white-space:nowrap;padding:3px 8px;background:var(--paper);font:600 var(--fs-label)/1.2 var(--font-sans);color:var(--muted)}
    .p03-b1{left:calc(33.333% - 30px)}.p03-b2{left:calc(66.666% - 30px)}
    .p03-foot{height:116px;display:grid;grid-template-columns:1.36fr .9fr;gap:42px;align-items:stretch}
    .p03-claim{display:flex;align-items:center;padding:18px 24px;border:1px solid var(--line);background:var(--panel-bg);font:700 var(--fs-h2)/1.35 var(--font-serif)}
    .p03-next{display:flex;flex-direction:column;justify-content:center;padding-left:26px;border-left:1px solid var(--line-soft)}
    .p03-next-label{font:700 var(--fs-label)/1 var(--font-sans);color:var(--muted);letter-spacing:.08em}
    .p03-next p{margin:8px 0 0;font:700 var(--fs-body)/1.4 var(--font-sans)}
  </style>

  <header class="p03-head">
    <div class="p03-kicker">THREE-STEP MAP</div>
    <h1 class="p03-title">把“学习”盯成三个可复查的动作</h1>
  </header>

  <main class="p03-main min0">
    <section class="triptych k-process p03-process min0" aria-label="学习的三步流程">
      <svg class="p03-map" viewBox="0 0 1488 500" preserveAspectRatio="none" aria-hidden="true">
        <path d="M22 18H1466 M22 482H1466" fill="none" stroke="var(--line-soft)" stroke-width="1"/>
        <path d="M22 315H1466" fill="none" stroke="var(--line)" stroke-width="2"/>
        <path d="M496 18V482 M992 18V482" fill="none" stroke="var(--line-soft)" stroke-width="1"/>
      </svg>
      <article class="p03-step min0">
        <div class="p03-stephead"><span class="p03-index">01</span><h2>做预测</h2></div>
        <p class="p03-mainline">模型先给出一个预测</p>
        <div class="p03-visual" aria-label="输入经过神经元得到预测">
          <div class="sample p03-sample">输入</div>
          <span class="p03-arrow" aria-hidden="true"></span>
          <div class="neuron p03-neuron">神经元</div>
          <span class="p03-arrow" aria-hidden="true"></span>
          <div class="p03-pred">预测</div>
        </div>
        <div class="p03-bottom">现在押什么？</div>
      </article>

      <article class="p03-step min0">
        <div class="p03-stephead"><span class="p03-index">02</span><h2>量误差</h2></div>
        <p class="p03-mainline">把预测与正确答案放在一起比较</p>
        <div class="p03-visual">
          <div class="p03-compare" aria-label="预测与答案之间的差距">
            <div class="p03-pred">预测</div>
            <div class="gap-ruler p03-ruler"><span>误差差距</span></div>
            <div class="p03-answer">答案</div>
          </div>
        </div>
        <div class="p03-bottom">离答案多远？</div>
      </article>

      <article class="p03-step min0">
        <div class="p03-stephead"><span class="p03-index">03</span><h2>改参数</h2></div>
        <p class="p03-mainline">根据误差，改动模型内部的数字</p>
        <div class="p03-visual">
          <div class="p03-paramset">
            <div class="p03-params"><span class="param p03-param">w</span><span class="param p03-param">b</span></div>
            <div class="change-row p03-change" aria-label="参数从改前变为改后"><span>改前</span><span class="arr">→</span><span>改后</span></div>
          </div>
        </div>
        <div class="p03-bottom">用新参数再来一轮</div>
      </article>

      <div class="path p03-bridge p03-b1" aria-hidden="true"><span>得到读数</span></div>
      <div class="path p03-bridge p03-b2" aria-hidden="true"><span>留下改动</span></div>
    </section>

    <footer class="p03-foot">
      <div class="p03-claim">全课只追踪三步：做预测、量误差、改参数。</div>
      <div class="p03-next"><span class="p03-next-label">下一问</span><p>第一步里，一个神经元怎样把输入变成预测？</p></div>
    </footer>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
