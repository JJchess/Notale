<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/lib/katex.min.css">
</head>
<body data-page="05" data-total="21">
<div id="stage">
  <style>
    #stage .p05-head{flex:0 0 104px;display:flex;flex-direction:column;justify-content:flex-start;gap:7px}
    #stage .p05-kicker{font-size:var(--fs-label);font-weight:700;letter-spacing:.08em;color:var(--muted)}
    #stage .p05-head h1{margin:0;font-size:var(--fs-h1);line-height:1.16;font-weight:750;color:var(--text)}
    #stage .p05-process{flex:0 0 76px;display:flex;align-items:center;gap:18px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
    #stage .p05-step{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
    #stage .p05-step-label{font-size:var(--fs-label);color:var(--muted)}
    #stage .p05-step-value{font-family:var(--font-mono);font-size:var(--fs-h2);font-variant-numeric:tabular-nums;color:var(--text)}
    #stage .p05-step-value.model{color:var(--model)}
    #stage .p05-arrow{position:relative;width:86px;height:3px;background:var(--line);flex:0 0 86px}
    #stage .p05-arrow::after{content:"";position:absolute;right:-1px;top:-6px;border-left:12px solid var(--line);border-top:7px solid transparent;border-bottom:7px solid transparent}
    #stage .p05-formula{font-size:22px;min-width:210px;text-align:center;color:var(--text)}
    #stage .p05-main{flex:1;display:flex;gap:42px;padding-top:28px;padding-bottom:22px;min-height:0}
    #stage .p05-plotcol{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
    #stage .p05-chartbox{position:relative;flex:1;min-height:0;border:1px solid var(--line-soft);border-radius:12px;background:rgba(255,255,255,.2);overflow:hidden;touch-action:none;cursor:ew-resize;outline:none}
    #stage .p05-chartbox:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    #stage .p05-chart{position:absolute;inset:0}
    #stage .p05-dragcue{position:absolute;right:18px;top:12px;font-size:var(--fs-label);color:var(--muted);background:var(--paper);padding:4px 10px;border-radius:8px;pointer-events:none;white-space:nowrap}
    #stage .p05-hints{display:flex;justify-content:space-between;gap:24px;padding:12px 46px 0;font-size:var(--fs-sec);color:var(--muted)}
    #stage .p05-side{flex:0 0 352px;display:flex;flex-direction:column;gap:18px;min-width:0}
    #stage .p05-readout{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 30px;border:1px solid var(--line-soft);border-radius:12px;background:var(--panel-bg)}
    #stage .p05-readout-label{font-size:var(--fs-label);color:var(--muted)}
    #stage .p05-prob{margin:8px 0 16px;font-family:var(--font-mono);font-size:50px;line-height:1;color:var(--model);font-variant-numeric:tabular-nums}
    #stage .p05-plain{min-height:58px;margin:0;font-size:var(--fs-body);line-height:1.5;color:var(--text)}
    #stage .p05-mid{margin-top:20px;padding-top:16px;border-top:1px solid var(--line-soft);font-size:var(--fs-sec);line-height:1.45;color:var(--muted)}
    #stage .p05-mid strong{color:var(--text)}
    #stage .p05-mid.is-hit{color:var(--text);text-decoration:underline;text-decoration-color:var(--focus);text-decoration-thickness:3px;text-underline-offset:5px}
    #stage .p05-control{display:flex;align-items:center;gap:12px;min-height:50px}
    #stage .p05-control label{font-size:var(--fs-label);color:var(--muted);white-space:nowrap}
    #stage .p05-control input[type="range"]{flex:1;accent-color:var(--focus);min-width:0}
    #stage .p05-zout{width:64px;text-align:right;font-family:var(--font-mono);font-size:var(--fs-body);font-variant-numeric:tabular-nums}
    #stage .p05-reset{flex:0 0 auto}
    #stage .p05-constants{font-family:var(--font-mono);font-size:var(--fs-label);line-height:1.6;color:var(--muted)}
    #stage .p05-status{min-height:24px;font-size:var(--fs-label);line-height:1.5;color:var(--muted)}
    #stage .p05-foot{flex:0 0 92px;display:flex;align-items:flex-start;justify-content:space-between;gap:44px;border-top:1px solid var(--line-soft);padding-top:18px}
    #stage .p05-claim{margin:0;max-width:870px;font-family:var(--font-serif);font-size:var(--fs-lead);line-height:1.42;color:var(--text)}
    #stage .p05-next{margin:0;max-width:460px;font-size:var(--fs-sec);line-height:1.45;color:var(--muted);text-align:right}
    #stage .p05-next b{color:var(--text)}
  </style>

  <header class="p05-head">
    <div class="p05-kicker">ACTIVATION · 激活</div>
    <h1>任意总分，都能被压进 0–1</h1>
  </header>

  <div class="p05-process k-process" aria-label="总分经过激活得到概率">
    <div class="p05-step"><span class="p05-step-label">内部总分</span><span class="p05-step-value" data-flow-z>z = 0.0</span></div>
    <span class="p05-arrow path" aria-hidden="true"></span>
    <div class="p05-formula" data-formula aria-label="p 等于 1 除以 1 加 e 的负 z 次方"></div>
    <span class="p05-arrow path" aria-hidden="true"></span>
    <div class="p05-step"><span class="p05-step-label">输出概率</span><span class="p05-step-value model" data-flow-p>p = 0.500</span></div>
  </div>

  <main class="p05-main min0" data-sigmoid-widget>
    <section class="p05-plotcol min0" aria-label="S 形激活曲线探针">
      <div class="p05-chartbox no-pan" data-surface tabindex="0" role="slider" aria-label="内部总分 z；拖动或用左右方向键调整" aria-valuemin="-8" aria-valuemax="8" aria-valuenow="0" aria-valuetext="总分 0.0，输出概率 0.500">
        <div class="p05-chart" data-chart aria-hidden="true"></div>
        <div class="p05-dragcue">沿横轴拖动探针 · 左右键精调</div>
      </div>
      <div class="p05-hints"><span>总分越负，输出越接近 0</span><span>总分越正，输出越接近 1</span></div>
    </section>

    <aside class="p05-side min0">
      <div class="p05-readout panel">
        <div class="p05-readout-label">曲线交点读数</div>
        <div class="p05-prob" data-prob>p = 0.500</div>
        <p class="p05-plain" data-plain>100 次相似情况中，模型会押“是”约 50 次</p>
        <div class="p05-mid is-hit" data-mid><strong>0 → 0.5</strong><br>0 点最陡：局部变化率 0.25 / 总分</div>
      </div>
      <div class="p05-control">
        <label for="p05-range">内部总分 z</label>
        <input id="p05-range" data-range type="range" min="-8" max="8" step="0.1" value="0" aria-label="内部总分 z">
        <output class="p05-zout" data-zout>0.0</output>
        <button class="btn p05-reset" data-reset type="button">重置本页</button>
      </div>
      <div class="p05-constants">SIGMOID_VALUE_AT_ZERO = <span data-k0>0.5</span><br>SIGMOID_MAX_SLOPE = <span data-ks>0.25</span></div>
      <div class="p05-status" data-status aria-live="polite"></div>
    </aside>
  </main>

  <footer class="p05-foot">
    <p class="p05-claim">S 形激活把任意总分压到 0–1；总分为 0 时，输出正好是 0.5。</p>
    <p class="p05-next"><b>下一问</b><br>同一组参数遇到不同输入，会得到怎样不同的概率？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script src="assets/lib/katex.min.js"></script>
<script>
(() => {
  const root = document.querySelector('[data-sigmoid-widget]');
  if (!root) return;

  const el = {
    chart: root.querySelector('[data-chart]'),
    surface: root.querySelector('[data-surface]'),
    range: root.querySelector('[data-range]'),
    reset: root.querySelector('[data-reset]'),
    prob: root.querySelector('[data-prob]'),
    plain: root.querySelector('[data-plain]'),
    mid: root.querySelector('[data-mid]'),
    zout: root.querySelector('[data-zout]'),
    status: root.querySelector('[data-status]'),
    flowZ: document.querySelector('[data-flow-z]'),
    flowP: document.querySelector('[data-flow-p]'),
    k0: root.querySelector('[data-k0]'),
    ks: root.querySelector('[data-ks]')
  };

  const valueAtZero = Number(Lec.K.SIGMOID_VALUE_AT_ZERO);
  const maxSlope = Number(Lec.K.SIGMOID_MAX_SLOPE);
  const initial = 0;
  let state = { z: initial };
  let activePointer = null;
  let centerTimer = 0;
  let destroyed = false;
  let wasNearZero = true;

  document.querySelector('[data-k0]').textContent = valueAtZero.toFixed(1);
  document.querySelector('[data-ks]').textContent = maxSlope.toFixed(2);
  katex.render('p=\\frac{1}{1+e^{-z}}', document.querySelector('[data-formula]'), {throwOnError:false});

  const curve = [];
  for (let i = 0; i <= 160; i += 1) {
    const z = -8 + i * 0.1;
    curve.push([Number(z.toFixed(1)), sigmoid(z)]);
  }

  const chart = echarts.init(el.chart, null, {renderer:'svg'});
  const colors = {
    text: Deck.token('--text'), muted: Deck.token('--muted'), line: Deck.token('--line'),
    soft: Deck.token('--line-soft'), model: Deck.token('--model'), focus: Deck.token('--focus'), paper: Deck.token('--paper')
  };

  function sigmoid(z) { return 1 / (1 + Math.exp(-z)); }
  function clampZ(z) { return Math.max(-8, Math.min(8, Math.round(z * 10) / 10)); }
  function fmtZ(z) { return `${z < 0 ? '−' : ''}${Math.abs(z).toFixed(1)}`; }

  function optionFor(s) {
    const p = sigmoid(s.z);
    const nearZero = Math.abs(s.z) < 0.051;
    return {
      animation: false,
      textStyle: {fontFamily: Deck.token('--font-sans'), fontSize: 16, color: colors.text},
      grid: {left: 82, right: 36, top: 38, bottom: 70, containLabel: false},
      xAxis: {
        type: 'value', min: -8, max: 8, interval: 4, name: '内部总分 z', nameLocation: 'middle', nameGap: 44,
        nameTextStyle: {fontSize: 16, fontWeight: 600, color: colors.text},
        axisLine: {lineStyle: {color: colors.line, width: 2}}, axisTick: {length: 7, lineStyle:{color:colors.line}},
        axisLabel: {fontSize: 14, color: colors.muted, formatter: v => v < 0 ? `−${Math.abs(v)}` : `${v}`},
        splitLine: {show:true, lineStyle:{color:colors.soft, opacity:.3, type:'dashed'}}
      },
      yAxis: {
        type: 'value', min: 0, max: 1, interval: .5, name: '输出概率 p', nameGap: 52, nameLocation: 'middle',
        nameTextStyle: {fontSize: 16, fontWeight: 600, color: colors.text},
        axisLine: {show:true, lineStyle:{color:colors.line, width:2}}, axisTick:{show:true, length:7},
        axisLabel: {fontSize:14, color:colors.muted, formatter:v => v === .5 ? '0.5' : v.toFixed(0)},
        splitLine: {show:true, lineStyle:{color:colors.soft, opacity:.3, type:'dashed'}}
      },
      series: [
        {type:'line', data:curve, showSymbol:false, silent:true, lineStyle:{color:colors.model, width:4}, z:2},
        {type:'line', data:[[s.z,0],[s.z,p]], showSymbol:false, silent:true, lineStyle:{color:colors.focus, width:2, type:'dashed'}, z:3},
        {type:'line', data:[[-8,p],[s.z,p]], showSymbol:false, silent:true, lineStyle:{color:colors.model, width:2, type:'dashed'}, z:3},
        {type:'scatter', data:[[s.z,0]], silent:true, symbol:'diamond', symbolSize:20, itemStyle:{color:colors.focus, borderColor:colors.text, borderWidth:2}, z:5},
        {type:'scatter', data:[[s.z,p]], silent:true, symbolSize:18, itemStyle:{color:colors.model, borderColor:colors.paper, borderWidth:4}, z:6},
        {type:'scatter', data:[[0,valueAtZero]], silent:true, symbolSize:nearZero ? 22 : 10,
          itemStyle:{color: nearZero ? colors.focus : colors.text},
          label:{show:true, formatter:'0 → 0.5', position:'right', distance:12, fontSize:15, fontWeight:700, color:colors.text}, z:4}
      ]
    };
  }

  function render() {
    const p = sigmoid(state.z);
    const count = Math.round(p * 100);
    chart.setOption(optionFor(state), {notMerge:true, lazyUpdate:false});
    el.range.value = state.z.toFixed(1);
    el.zout.textContent = fmtZ(state.z);
    el.prob.textContent = `p = ${p.toFixed(3)}`;
    el.plain.textContent = `100 次相似情况中，模型会押“是”约 ${count} 次`;
    el.flowZ.textContent = `z = ${fmtZ(state.z)}`;
    el.flowP.textContent = `p = ${p.toFixed(3)}`;
    el.surface.setAttribute('aria-valuenow', state.z.toFixed(1));
    el.surface.setAttribute('aria-valuetext', `总分 ${state.z.toFixed(1)}，输出概率 ${p.toFixed(3)}`);
    const nearZero = Math.abs(state.z) < .051;
    el.mid.classList.toggle('is-hit', nearZero);
    if (nearZero && !wasNearZero) {
      clearTimeout(centerTimer);
      centerTimer = window.setTimeout(() => el.mid.classList.remove('is-hit'), 700);
    }
    wasNearZero = nearZero;
  }

  function setZ(value, announce) {
    if (destroyed) return;
    state = {z: clampZ(Number(value))};
    render();
    if (announce) {
      const p = sigmoid(state.z);
      el.status.textContent = `内部总分 ${state.z.toFixed(1)}，输出概率 ${p.toFixed(3)}`;
    }
  }

  function zFromPointer(event) {
    const pt = Deck.pt(el.surface, event);
    return chart.convertFromPixel({xAxisIndex:0}, pt.x);
  }
  function onPointerDown(event) {
    if (event.button !== undefined && event.button !== 0) return;
    activePointer = event.pointerId;
    try { el.surface.setPointerCapture(event.pointerId); } catch (_) {}
    setZ(zFromPointer(event), false);
  }
  function onPointerMove(event) {
    if (event.pointerId !== activePointer) return;
    setZ(zFromPointer(event), false);
  }
  function endPointer(event) {
    if (event.pointerId !== activePointer) return;
    if (el.surface.hasPointerCapture(event.pointerId)) el.surface.releasePointerCapture(event.pointerId);
    activePointer = null;
    setZ(state.z, true);
  }
  function onKey(event) {
    let next = null;
    if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') next = state.z - .1;
    if (event.key === 'ArrowRight' || event.key === 'ArrowUp') next = state.z + .1;
    if (event.key === 'Home') next = -8;
    if (event.key === 'End') next = 8;
    if (next === null) return;
    event.preventDefault();
    event.stopPropagation();
    setZ(next, true);
  }
  function onRangeInput() { setZ(el.range.value, false); }
  function onRangeChange() { setZ(el.range.value, true); }
  function onReset() {
    clearTimeout(centerTimer);
    activePointer = null;
    wasNearZero = false;
    setZ(initial, true);
  }
  function onResize() { chart.resize(); render(); }

  el.surface.addEventListener('pointerdown', onPointerDown);
  el.surface.addEventListener('pointermove', onPointerMove);
  el.surface.addEventListener('pointerup', endPointer);
  el.surface.addEventListener('pointercancel', endPointer);
  el.surface.addEventListener('keydown', onKey);
  el.range.addEventListener('input', onRangeInput);
  el.range.addEventListener('change', onRangeChange);
  el.reset.addEventListener('click', onReset);
  const offResize = Deck.onResize(onResize);

  render();
  Deck.init({index:5, total:21});

  root.destroySigmoidWidget = () => {
    if (destroyed) return;
    destroyed = true;
    clearTimeout(centerTimer);
    offResize();
    el.surface.removeEventListener('pointerdown', onPointerDown);
    el.surface.removeEventListener('pointermove', onPointerMove);
    el.surface.removeEventListener('pointerup', endPointer);
    el.surface.removeEventListener('pointercancel', endPointer);
    el.surface.removeEventListener('keydown', onKey);
    el.range.removeEventListener('input', onRangeInput);
    el.range.removeEventListener('change', onRangeChange);
    el.reset.removeEventListener('click', onReset);
    chart.dispose();
    delete root.destroySigmoidWidget;
  };
})();
</script>
</body>
</html>
