<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{gap:0;}
  .p06-head{flex:0 0 104px;display:flex;flex-direction:column;justify-content:flex-start;gap:7px;}
  .p06-kicker{margin:0;color:var(--muted);font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.13em;}
  .p06-title{margin:0;color:var(--text);font:700 var(--fs-h1)/1.16 var(--font-sans);}
  .p06-widget{--p06-row-grid:94px 184px 260px 250px 220px 214px;flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;}
  .p06-widget *{box-sizing:border-box;}
  .p06-question{flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 16px 0 0;border-bottom:1px solid var(--line-soft);}
  .p06-question strong{font:700 var(--fs-h2)/1.25 var(--font-sans);}
  .p06-params{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:var(--fs-sec);}
  .p06-params .param{color:var(--text);font-family:var(--font-mono);font-weight:700;}
  .p06-ledger{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;}
  .p06-grid{display:grid;grid-template-columns:var(--p06-row-grid);align-items:center;min-width:0;}
  .p06-columns{flex:0 0 46px;padding:0 14px;color:var(--muted);font:600 var(--fs-label)/1.2 var(--font-sans);text-align:center;}
  .p06-columns span:nth-child(2){text-align:left;padding-left:22px;}
  .p06-rows{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;}
  .p06-row{position:relative;flex:1;min-height:68px;width:100%;padding:0 14px;border:1px solid var(--line-soft);border-radius:12px;background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer;transition:background-color 140ms ease,border-color 140ms ease,box-shadow 140ms ease;}
  .p06-row:hover{background:color-mix(in srgb,var(--panel-bg) 62%,transparent);}
  .p06-row:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
  .p06-row[aria-pressed="true"]{background:var(--panel-bg);border-color:var(--model);box-shadow:inset 0 0 0 4px var(--model);}
  .p06-row.was-seen:not([aria-pressed="true"])::after{content:"已查看";position:absolute;right:14px;top:7px;color:var(--muted);font:600 var(--fs-tick)/1 var(--font-sans);}
  .p06-cell{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;height:100%;padding:10px 12px;font-size:var(--fs-body);line-height:1.25;}
  .p06-cell + .p06-cell::before{content:"";position:absolute;left:-12px;top:50%;width:20px;border-top:3px solid var(--line-soft);transform:translateY(-50%);}
  .p06-cell + .p06-cell::after{content:"";position:absolute;left:5px;top:50%;width:7px;height:7px;border-top:3px solid var(--line-soft);border-right:3px solid var(--line-soft);transform:translateY(-50%) rotate(45deg);}
  .p06-row[aria-pressed="true"] .p06-cell + .p06-cell::before,
  .p06-row[aria-pressed="true"] .p06-cell + .p06-cell::after{border-color:var(--model);}
  .p06-row.is-tracing .p06-cell.pulse::before,
  .p06-row.is-tracing .p06-cell.pulse::after{border-color:var(--focus);}
  .p06-sample{justify-content:flex-start;gap:12px;}
  .p06-sample .sample{flex:0 0 40px;width:40px;height:40px;display:grid;place-items:center;font:700 var(--fs-body)/1 var(--font-mono);}
  .p06-input{display:flex;flex-direction:column;align-items:flex-start;gap:4px;}
  .p06-input .x{font:700 22px/1.1 var(--font-mono);}
  .p06-input .target{color:var(--muted);font:500 var(--fs-label)/1.2 var(--font-sans);}
  .p06-math{font:650 20px/1.2 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .p06-activation{display:flex;flex-direction:column;gap:3px;text-align:center;}
  .p06-activation b{font:700 var(--fs-body)/1.15 var(--font-sans);}
  .p06-activation small{color:var(--muted);font:500 var(--fs-label)/1.15 var(--font-sans);}
  .p06-prediction{color:var(--model);font:800 27px/1 var(--font-mono);font-variant-numeric:tabular-nums;}
  .p06-controls{flex:0 0 50px;display:flex;align-items:center;gap:10px;}
  .p06-progress{margin-left:auto;color:var(--muted);font:600 var(--fs-label)/1.2 var(--font-sans);}
  .p06-progress .num{color:var(--text);}
  .p06-readout{flex:0 0 126px;display:grid;grid-template-columns:260px minmax(0,1fr);align-items:center;gap:28px;padding:16px 22px;border:1px solid var(--line);border-radius:14px;background:var(--panel-bg);}
  .p06-readout-label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:var(--fs-label);}
  .p06-live-number{color:var(--model);font:800 34px/1 var(--font-mono);font-variant-numeric:tabular-nums;}
  .p06-reading{font:650 var(--fs-lead)/1.4 var(--font-sans);}
  .p06-reading .rule{font-family:var(--font-mono);}
  .p06-summary{display:none;font-family:var(--font-serif);font-weight:700;}
  .p06-readout.complete .p06-current{display:none;}
  .p06-readout.complete .p06-summary{display:block;}
  .p06-foot{flex:0 0 69px;display:flex;align-items:flex-end;justify-content:space-between;gap:36px;padding-top:12px;}
  .p06-claim{margin:0;font:700 20px/1.35 var(--font-serif);}
  .p06-next{margin:0;color:var(--muted);font:600 var(--fs-sec)/1.35 var(--font-sans);text-align:right;}
  @media (prefers-reduced-motion:reduce){.p06-row{transition:none;}}
</style>
</head>
<body data-page="06" data-total="21">
<div id="stage">
  <header class="p06-head">
    <p class="p06-kicker">SAME RULE · NEW SAMPLE</p>
    <h1 class="p06-title">四条样本，都走同一条计算路</h1>
  </header>

  <main class="p06-widget ledger min0" data-p06-widget aria-label="四条样本的逐行计算账本">
    <section class="p06-question" aria-label="问题与共享参数">
      <strong>换一条输入，计算步骤会变吗？</strong>
      <div class="p06-params">共享参数：<span class="param">w = 0</span><span class="param">b = 0</span></div>
    </section>

    <section class="p06-ledger min0" aria-label="四条预测记录">
      <div class="p06-columns p06-grid" aria-hidden="true">
        <span>样本</span><span>输入</span><span>乘权重</span><span>加偏置</span><span>激活</span><span>预测</span>
      </div>
      <div class="p06-rows" role="group" aria-label="选择一条样本查看计算">
        <button class="p06-row p06-grid" type="button" data-index="0" aria-pressed="true">
          <span class="p06-cell p06-sample"><span class="sample">1</span></span>
          <span class="p06-cell p06-input"><span class="x">x = −2</span><span class="target">已知答案 t = 0</span></span>
          <span class="p06-cell p06-math">−2 × 0 = 0</span>
          <span class="p06-cell p06-math">0 + 0 = 0</span>
          <span class="p06-cell p06-activation"><b>总分 0</b><small>经激活函数</small></span>
          <span class="p06-cell p06-prediction">0.500</span>
        </button>
        <button class="p06-row p06-grid" type="button" data-index="1" aria-pressed="false">
          <span class="p06-cell p06-sample"><span class="sample">2</span></span>
          <span class="p06-cell p06-input"><span class="x">x = −1</span><span class="target">已知答案 t = 0</span></span>
          <span class="p06-cell p06-math">−1 × 0 = 0</span>
          <span class="p06-cell p06-math">0 + 0 = 0</span>
          <span class="p06-cell p06-activation"><b>总分 0</b><small>经激活函数</small></span>
          <span class="p06-cell p06-prediction">0.500</span>
        </button>
        <button class="p06-row p06-grid" type="button" data-index="2" aria-pressed="false">
          <span class="p06-cell p06-sample"><span class="sample">3</span></span>
          <span class="p06-cell p06-input"><span class="x">x = 1</span><span class="target">已知答案 t = 1</span></span>
          <span class="p06-cell p06-math">1 × 0 = 0</span>
          <span class="p06-cell p06-math">0 + 0 = 0</span>
          <span class="p06-cell p06-activation"><b>总分 0</b><small>经激活函数</small></span>
          <span class="p06-cell p06-prediction">0.500</span>
        </button>
        <button class="p06-row p06-grid" type="button" data-index="3" aria-pressed="false">
          <span class="p06-cell p06-sample"><span class="sample">4</span></span>
          <span class="p06-cell p06-input"><span class="x">x = 2</span><span class="target">已知答案 t = 1</span></span>
          <span class="p06-cell p06-math">2 × 0 = 0</span>
          <span class="p06-cell p06-math">0 + 0 = 0</span>
          <span class="p06-cell p06-activation"><b>总分 0</b><small>经激活函数</small></span>
          <span class="p06-cell p06-prediction">0.500</span>
        </button>
      </div>
    </section>

    <div class="p06-controls" aria-label="切换样本">
      <button class="btn" type="button" data-prev>上一条</button>
      <button class="btn" type="button" data-next>下一条</button>
      <button class="btn" type="button" data-reset>重置本页</button>
      <span class="p06-progress">已查看 <span class="num" data-count>1 / 4</span></span>
    </div>

    <section class="p06-readout" data-readout data-status aria-live="polite" aria-label="当前预测读数">
      <div class="p06-readout-label"><span>当前样本</span><span class="p06-live-number" data-sample>1</span></div>
      <div class="p06-reading">
        <span class="p06-current" data-current><span class="rule">总分 0 → 预测 0.5</span>；显示为 <span class="p06-prediction">0.500</span>。</span>
        <span class="p06-summary">4 条输入不同，4 次规则相同，预测都是 <span class="p06-prediction">0.500</span>。</span>
      </div>
    </section>

    <footer class="p06-foot">
      <p class="p06-claim">换的是输入；<span class="num">w=0</span>、<span class="num">b=0</span> 和计算步骤始终不变。</p>
      <p class="p06-next">四次预测都是 <span class="num">0.5</span>，怎样判断它们做得有多差？</p>
    </footer>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  const root = document.querySelector('[data-p06-widget]');
  if (!root) return;
  const rows = Array.from(root.querySelectorAll('.p06-row'));
  const prev = root.querySelector('[data-prev]');
  const next = root.querySelector('[data-next]');
  const reset = root.querySelector('[data-reset]');
  const count = root.querySelector('[data-count]');
  const sample = root.querySelector('[data-sample]');
  const readout = root.querySelector('[data-readout]');
  const status = root.querySelector('[data-status]');
  const initial = () => ({ active: 0, seen: new Set([0]) });
  let state = initial();
  let timers = [];
  let destroyed = false;

  const sigmoidZero = Number(Lec.K.SIGMOID_VALUE_AT_ZERO);
  const prediction = Number.isFinite(sigmoidZero) ? sigmoidZero.toFixed(3) : '0.500';
  root.querySelectorAll('.p06-prediction').forEach(el => { el.textContent = prediction; });

  function cancelTrace() {
    timers.forEach(window.clearTimeout);
    timers = [];
    rows.forEach(row => {
      row.classList.remove('is-tracing');
      row.querySelectorAll('.pulse').forEach(cell => cell.classList.remove('pulse'));
    });
  }

  function render(announce) {
    if (destroyed) return;
    rows.forEach((row, i) => {
      const active = i === state.active;
      row.setAttribute('aria-pressed', String(active));
      row.classList.toggle('was-seen', state.seen.has(i));
    });
    count.textContent = `${state.seen.size} / 4`;
    sample.textContent = String(state.active + 1);
    readout.classList.toggle('complete', state.seen.size === 4);
    if (announce) {
      status.setAttribute('aria-label', state.seen.size === 4
        ? `样本 ${state.active + 1}，预测 ${prediction}。四条样本已全部查看。`
        : `样本 ${state.active + 1}，预测 ${prediction}。已查看 ${state.seen.size} 条。`);
    }
  }

  function trace(index) {
    cancelTrace();
    if (Deck.reduced()) return;
    const row = rows[index];
    const cells = Array.from(row.querySelectorAll('.p06-cell')).slice(1);
    row.classList.add('is-tracing');
    cells.forEach((cell, i) => {
      timers.push(window.setTimeout(() => cell.classList.add('pulse'), i * 90));
      timers.push(window.setTimeout(() => cell.classList.remove('pulse'), i * 90 + 140));
    });
    timers.push(window.setTimeout(() => row.classList.remove('is-tracing'), (cells.length - 1) * 90 + 140));
  }

  function select(index, options = {}) {
    const bounded = (index + rows.length) % rows.length;
    state = { active: bounded, seen: new Set([...state.seen, bounded]) };
    render(options.announce !== false);
    trace(bounded);
    if (options.focus) rows[bounded].focus();
  }

  function onRowClick(event) { select(Number(event.currentTarget.dataset.index)); }
  function onRowKey(event) {
    if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
      event.preventDefault(); event.stopPropagation(); select(state.active + 1, { focus: true });
    } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
      event.preventDefault(); event.stopPropagation(); select(state.active - 1, { focus: true });
    } else if (event.key === 'Home') {
      event.preventDefault(); event.stopPropagation(); select(0, { focus: true });
    } else if (event.key === 'End') {
      event.preventDefault(); event.stopPropagation(); select(3, { focus: true });
    }
  }
  function onPrev() { select(state.active - 1); }
  function onNext() { select(state.active + 1); }
  function onReset() {
    cancelTrace();
    state = initial();
    render(true);
    rows[0].focus();
  }

  rows.forEach(row => { row.addEventListener('click', onRowClick); row.addEventListener('keydown', onRowKey); });
  prev.addEventListener('click', onPrev);
  next.addEventListener('click', onNext);
  reset.addEventListener('click', onReset);
  render(false);
  Deck.init({ index: 6, total: 21 });

  root.destroyP06Widget = () => {
    if (destroyed) return;
    destroyed = true;
    cancelTrace();
    rows.forEach(row => { row.removeEventListener('click', onRowClick); row.removeEventListener('keydown', onRowKey); });
    prev.removeEventListener('click', onPrev);
    next.removeEventListener('click', onNext);
    reset.removeEventListener('click', onReset);
    delete root.destroyP06Widget;
  };
})();
</script>
</body>
</html>
