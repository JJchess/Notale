<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/lib/katex.min.css">
<style>
  #stage{display:flex;flex-direction:column;gap:0;color:var(--text);}
  .head{height:112px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding-bottom:18px;}
  .titleblock{min-width:0;}
  .kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.14em;color:var(--model);margin:0 0 12px;}
  h1{font:700 var(--fs-h1)/1.18 var(--font-sans);margin:0;letter-spacing:-.02em;}
  .fixed-answer{align-self:flex-end;display:flex;align-items:center;gap:12px;font:600 var(--fs-body)/1.2 var(--font-sans);padding-bottom:3px;}
  .fixed-answer .value{font:700 22px/1 var(--font-mono);padding:9px 13px;border:1px solid var(--line);border-radius:8px;background:var(--panel-bg);}
  .top{height:174px;display:grid;grid-template-columns:1.2fr .9fr;gap:52px;align-items:center;}
  .claim{display:flex;align-items:center;gap:30px;min-width:0;}
  .claim-text{font:700 28px/1.35 var(--font-serif);max-width:500px;}
  .formula{min-width:275px;padding:18px 24px;border:1px solid var(--line);border-radius:12px;background:var(--panel-bg);font-size:25px;text-align:center;}
  .refs{width:100%;border-collapse:collapse;font:var(--fs-label)/1.25 var(--font-sans);font-variant-numeric:tabular-nums;}
  .refs caption{text-align:left;font-weight:700;font-size:var(--fs-sec);margin-bottom:8px;}
  .refs th,.refs td{padding:7px 13px;border-bottom:1px solid var(--line-soft);text-align:right;}
  .refs th:first-child,.refs td:first-child{text-align:left;}
  .refs th{font-weight:600;color:var(--muted);}
  .work{height:442px;display:grid;grid-template-columns:minmax(0,1fr) 312px;gap:38px;min-height:0;}
  .figure{margin:0;display:flex;flex-direction:column;min-height:0;}
  .chart-wrap{position:relative;flex:1;min-height:0;border:1px solid var(--line-soft);border-radius:14px;background:rgba(255,255,255,.22);overflow:hidden;}
  #chart{position:absolute;inset:0;}
  figcaption{height:42px;padding-top:14px;font:var(--fs-label)/1.3 var(--font-sans);color:var(--muted);}
  .instrument{display:flex;flex-direction:column;gap:14px;min-height:0;}
  .readout{padding:16px 18px;border-radius:12px;background:var(--panel-bg);border:1px solid var(--line-soft);}
  .readout .lab{font:600 var(--fs-label)/1.2 var(--font-sans);color:var(--muted);}
  .readout .main{margin-top:7px;font:700 22px/1.2 var(--font-mono);color:var(--model);}
  .readout .loss{margin-top:6px;font:700 27px/1.1 var(--font-mono);}
  .meter-row{display:grid;grid-template-columns:78px 1fr;gap:18px;min-height:132px;align-items:stretch;}
  .ruler{position:relative;width:62px;margin-left:9px;border:1px solid var(--line);background:#fff;border-radius:5px;overflow:hidden;}
  .ruler-fill{position:absolute;left:0;right:0;bottom:0;background:repeating-linear-gradient(135deg,#202020 0,#202020 2px,transparent 2px,transparent 7px);transition:height .08s linear;}
  .ruler-line{position:absolute;left:0;right:0;border-top:3px solid var(--focus);}
  .ruler-labels{position:relative;font:var(--fs-tick)/1 var(--font-mono);color:var(--muted);}
  .ruler-labels span{position:absolute;left:0;transform:translateY(-50%);}
  .ruler-labels .top{top:0;height:auto;display:block;}
  .ruler-labels .mid{top:50%;}
  .ruler-labels .bottom{bottom:-6px;transform:none;}
  .control{display:flex;flex-direction:column;gap:8px;}
  .control label{font:600 var(--fs-label)/1.3 var(--font-sans);}
  input[type="range"]{width:100%;accent-color:var(--focus);height:24px;cursor:pointer;}
  .range-ends{display:flex;justify-content:space-between;font:var(--fs-tick)/1 var(--font-mono);color:var(--muted);}
  .actions{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .hint{font:var(--fs-label)/1.3 var(--font-sans);color:var(--muted);}
  .btn{font-size:var(--fs-label);white-space:nowrap;}
  .foot{height:116px;border-top:1px solid var(--line-soft);padding-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:55px;align-items:start;}
  .takeaway{font:600 21px/1.42 var(--font-serif);}
  .next{font:600 var(--fs-body)/1.45 var(--font-sans);padding-left:24px;border-left:1px solid var(--line-soft);}
  .next span{display:block;font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.08em;color:var(--muted);margin-bottom:7px;}
</style>
</head>
<body data-page="07" data-total="21">
<div id="stage">
  <header class="head">
    <div class="titleblock">
      <div class="kicker">PREDICTION COST</div>
      <h1>给正确答案的概率越低，误差越大</h1>
    </div>
    <div class="fixed-answer"><span>正确答案固定</span><span class="value">t = 1</span></div>
  </header>

  <section class="top k-generalization" aria-label="交叉熵关系概括">
    <div class="claim">
      <div class="claim-text">概率越靠近 0，交叉熵误差上升越快。</div>
      <div id="formula" class="formula" aria-label="交叉熵误差等于负的正确概率自然对数">L = −ln(p正确)</div>
    </div>
    <table class="refs" aria-label="三个固定参照点">
      <caption>同一标尺上的三个参照点</caption>
      <thead><tr><th>给正确答案的概率</th><th>交叉熵误差 L</th></tr></thead>
      <tbody><tr><td>0.90</td><td>0.105</td></tr><tr><td>0.50</td><td>0.693</td></tr><tr><td>0.10</td><td>2.303</td></tr></tbody>
    </table>
  </section>

  <main class="work min0">
    <figure class="figure min0" aria-labelledby="chart-caption">
      <div class="chart-wrap min0">
        <div id="chart" role="img" aria-label="正确答案概率从 0.01 到 1.00 时，交叉熵误差从 4.61 下降到 0 的曲线。可在曲线上移动探针。"></div>
      </div>
      <figcaption id="chart-caption">横轴与三个参照点共用相同精度；空心圆是参照，实心圆是当前探针。</figcaption>
    </figure>

    <aside class="instrument" aria-label="探针控制与当前读数">
      <div class="readout" aria-live="polite" aria-atomic="true">
        <div class="lab">当前探针</div>
        <div class="main" id="probRead">给正确答案：50 次 / 100 次</div>
        <div class="loss" id="lossRead">误差：0.693</div>
      </div>
      <div class="meter-row">
        <div class="ruler gap-ruler" aria-hidden="true">
          <div class="ruler-fill" id="rulerFill"></div>
          <div class="ruler-line" id="rulerLine"></div>
        </div>
        <div class="ruler-labels" aria-hidden="true"><span class="top">4.61</span><span class="mid">2.30</span><span class="bottom">0</span></div>
      </div>
      <div class="control">
        <label for="probability">拖动给正确答案的概率：<span id="sliderValue">0.50</span></label>
        <input id="probability" type="range" min="0.01" max="1" step="0.01" value="0.50">
        <div class="range-ends"><span>0.01</span><span>1.00</span></div>
      </div>
      <div class="actions">
        <div class="hint">拖滑块或在曲线上移动探针</div>
        <button class="btn" id="reset" type="button">重置本页</button>
      </div>
    </aside>
  </main>

  <footer class="foot">
    <div class="takeaway">交叉熵把“有多不相信正确答案”变成一个可比较的误差数字。</div>
    <div class="next"><span>下一问</span>既然误差能量出来，亲手调参数能把它降下去吗？</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script src="assets/lib/katex.min.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:7,total:21});

  var epsilon = Lec.K.BCE_CLIP_EPSILON;
  var canonical = [];
  for(var i=1;i<=100;i+=1){
    var p=i/100;
    canonical.push({id:'p-'+i,p:p,loss:-Math.log(Math.min(1-epsilon,Math.max(epsilon,p)))});
  }
  var references = [0.10,0.50,0.90].map(function(p){
    return {id:'ref-'+p.toFixed(2),p:p,loss:-Math.log(p)};
  });
  var state={p:0.50};
  var host=document.getElementById('chart');
  var chart=echarts.init(host,null,{renderer:'svg'});
  var slider=document.getElementById('probability');
  var probRead=document.getElementById('probRead');
  var lossRead=document.getElementById('lossRead');
  var sliderValue=document.getElementById('sliderValue');
  var fill=document.getElementById('rulerFill');
  var line=document.getElementById('rulerLine');
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function lossAt(p){return -Math.log(Math.min(1-epsilon,Math.max(epsilon,p)));}
  function optionFor(s){
    var loss=lossAt(s.p);
    return {
      animation:!reduced,
      animationDuration:100,
      textStyle:{fontFamily:'Noto Sans SC, system-ui, sans-serif',fontSize:16,color:'#202020'},
      grid:{left:78,right:38,top:30,bottom:70,containLabel:false},
      tooltip:{trigger:'item',confine:true,textStyle:{fontSize:16},formatter:function(params){
        var v=params.value; return '给正确答案的概率：'+Number(v[0]).toFixed(2)+'<br>交叉熵误差：'+Number(v[1]).toFixed(3);
      }},
      xAxis:{type:'value',min:0.01,max:1,interval:0.11,name:'给正确答案的概率  p正确',nameLocation:'middle',nameGap:38,nameTextStyle:{fontSize:15,fontWeight:600},axisLabel:{fontSize:13,formatter:function(v){return Number(v).toFixed(2);}},axisLine:{lineStyle:{color:'#4B4A46',width:1}},axisTick:{lineStyle:{color:'#4B4A46'}},splitLine:{show:false}},
      yAxis:{type:'value',min:0,max:4.61,interval:1.1525,name:'每样本交叉熵误差  L',nameLocation:'middle',nameGap:54,nameTextStyle:{fontSize:15,fontWeight:600},axisLabel:{fontSize:13,formatter:function(v){return Number(v).toFixed(2);}},axisLine:{show:true,lineStyle:{color:'#4B4A46'}},axisTick:{show:true},splitLine:{lineStyle:{color:'#AAA69D',type:'dashed',opacity:.55}}},
      series:[
        {id:'curve',name:'交叉熵关系',type:'line',data:canonical.map(function(d){return [d.p,d.loss];}),showSymbol:false,smooth:false,lineStyle:{color:'#176B87',width:4},emphasis:{disabled:true},silent:false},
        {id:'refs',name:'固定参照',type:'scatter',data:references.map(function(d){return [d.p,d.loss];}),symbolSize:15,itemStyle:{color:'#F4F1E8',borderColor:'#202020',borderWidth:3},z:4},
        {id:'probe',name:'当前探针',type:'scatter',data:[[s.p,loss]],symbolSize:18,itemStyle:{color:'#F59E0B',borderColor:'#202020',borderWidth:2},z:6}
      ]
    };
  }
  function render(s){
    var loss=lossAt(s.p);
    slider.value=s.p.toFixed(2);
    sliderValue.textContent=s.p.toFixed(2);
    probRead.textContent='给正确答案：'+Math.round(s.p*100)+' 次 / 100 次';
    lossRead.textContent='误差：'+loss.toFixed(3);
    var pct=Math.max(0,Math.min(100,loss/4.61*100));
    fill.style.height=pct+'%';
    line.style.bottom='calc('+pct+'% - 1px)';
    chart.setOption(optionFor(s),{notMerge:true,lazyUpdate:false});
  }
  function setState(patch){
    var next=Object.assign({},state,patch);
    next.p=Math.round(Math.max(.01,Math.min(1,next.p))*100)/100;
    state=next; render(state);
  }
  slider.addEventListener('input',function(){setState({p:Number(slider.value)});});
  document.getElementById('reset').addEventListener('click',function(){setState({p:.50});slider.focus();});

  var pending=null;
  chart.getZr().on('mousemove',function(ev){
    var xy=chart.convertFromPixel({gridIndex:0},[ev.offsetX,ev.offsetY]);
    if(!xy || !isFinite(xy[0]) || xy[0]<.01 || xy[0]>1 || xy[1]<0 || xy[1]>4.61) return;
    pending=Math.round(xy[0]*100)/100;
    if(!window.__probeFrame){
      window.__probeFrame=requestAnimationFrame(function(){window.__probeFrame=0;if(pending!==null)setState({p:pending});});
    }
  });
  chart.on('click',function(params){if(params && params.value)setState({p:Number(params.value[0])});});

  var observer=new ResizeObserver(function(){chart.resize();});
  observer.observe(host);
  window.addEventListener('beforeunload',function cleanup(){observer.disconnect();chart.dispose();});
  if(window.katex){katex.render('L=-\\ln(p_{\\text{正确}})',document.getElementById('formula'),{throwOnError:false});}
  render(state);
})();
</script>
</body>
</html>
