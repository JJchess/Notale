<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="09" data-total="21">
<div id="stage">
  <style>
    #stage .p09-head{height:116px;display:flex;flex-direction:column;justify-content:flex-start;gap:8px}
    #stage .p09-kicker{font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.12em;color:var(--muted)}
    #stage .p09-title{margin:0;font:700 var(--fs-h1)/1.18 var(--font-sans);color:var(--text)}
    #stage .p09-widget{flex:1;min-height:0;display:grid;grid-template-columns:510px minmax(0,1fr);gap:42px;padding-top:6px;outline:none}
    #stage .p09-left,#stage .p09-right{min-width:0;min-height:0}
    #stage .p09-left{display:flex;flex-direction:column;gap:18px}
    #stage .p09-question{font:700 var(--fs-h2)/1.25 var(--font-sans);margin:0}
    #stage .p09-instrument{background:var(--panel-bg);border:1px solid var(--line-soft);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:18px}
    #stage .p09-current{display:flex;align-items:center;justify-content:space-between;gap:16px}
    #stage .p09-current-label{font:var(--fs-body)/1.35 var(--font-sans);color:var(--muted)}
    #stage .p09-param{font:700 30px/1 var(--font-mono);border:2px solid var(--line);border-radius:8px;padding:12px 16px;background:var(--paper);font-variant-numeric:tabular-nums;min-width:202px;text-align:center}
    #stage .p09-param.active{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 20%,transparent)}
    #stage .p09-baseline{position:relative;height:62px;margin:2px 8px 0;border-top:2px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr}
    #stage .p09-tick{position:relative;padding-top:16px;text-align:center;font:600 var(--fs-label)/1.2 var(--font-mono);color:var(--muted)}
    #stage .p09-tick:before{content:"";position:absolute;top:-7px;left:50%;height:12px;border-left:2px solid var(--line)}
    #stage .p09-tick.now{color:var(--text)}
    #stage .p09-tick.now:after{content:"";position:absolute;top:-13px;left:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:var(--focus);border:2px solid var(--paper)}
    #stage .p09-controls{display:flex;gap:10px;flex-wrap:wrap}
    #stage .p09-controls .btn{flex:1 1 138px;min-height:44px}
    #stage .p09-controls .btn.current{outline:3px solid var(--focus);outline-offset:2px}
    #stage .p09-meta{display:flex;justify-content:space-between;align-items:center;gap:16px;font:var(--fs-sec)/1.35 var(--font-sans);color:var(--muted)}
    #stage .p09-reset{border:0;background:none;color:var(--text);font:600 var(--fs-label)/1 var(--font-sans);text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:8px}
    #stage .p09-samples{border-top:1px solid var(--line-soft);padding-top:16px}
    #stage .p09-samples-title{display:flex;justify-content:space-between;margin-bottom:10px;font:600 var(--fs-sec)/1.3 var(--font-sans)}
    #stage .p09-samples-title span:last-child{font-family:var(--font-mono);color:var(--model)}
    #stage .p09-sample-row{display:grid;grid-template-columns:54px 72px 1fr;align-items:center;gap:12px;height:37px;font:var(--fs-label)/1.2 var(--font-sans)}
    #stage .p09-sample-row code{font:600 var(--fs-label)/1 var(--font-mono)}
    #stage .p09-pred-track{height:8px;background:var(--paper);border:1px solid var(--line-soft);position:relative}
    #stage .p09-pred-track i{position:absolute;left:50%;top:-4px;width:2px;height:14px;background:var(--model)}
    #stage .p09-right{display:flex;flex-direction:column;gap:12px}
    #stage .p09-chart-wrap{position:relative;flex:1;min-height:300px;border:1px solid var(--line-soft);background:rgba(255,255,255,.18);border-radius:16px;overflow:hidden}
    #stage .p09-chart{position:absolute;inset:0}
    #stage .p09-scale-note{position:absolute;right:18px;top:14px;z-index:2;font:var(--fs-label)/1.25 var(--font-sans);color:var(--muted);background:var(--paper);padding:5px 8px;border:1px solid var(--line-soft);border-radius:6px}
    #stage .p09-rulers{height:128px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    #stage .p09-ruler{position:relative;border-top:1px solid var(--line-soft);padding:15px 12px 0;display:grid;grid-template-columns:28px 1fr;gap:10px;opacity:.4}
    #stage .p09-ruler.seen{opacity:1}
    #stage .p09-gauge{height:86px;width:22px;border:1px solid var(--line);position:relative;background:repeating-linear-gradient(135deg,rgba(32,32,32,.13) 0 4px,transparent 4px 8px)}
    #stage .p09-gauge i{position:absolute;left:-3px;right:-3px;bottom:var(--fill);border-top:3px solid var(--model)}
    #stage .p09-ruler.current .p09-gauge i{border-color:var(--focus)}
    #stage .p09-ruler strong{display:block;font:700 var(--fs-label)/1.25 var(--font-sans);margin-bottom:7px}
    #stage .p09-ruler output{font:700 var(--fs-sec)/1.2 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--model)}
    #stage .p09-ruler small{display:block;margin-top:7px;font:var(--fs-label)/1.25 var(--font-sans);color:var(--muted)}
    #stage .p09-result{min-height:84px;border-top:2px solid var(--line);padding-top:12px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:22px}
    #stage .p09-result-lines{display:flex;flex-direction:column;gap:5px;font:var(--fs-sec)/1.28 var(--font-sans);color:var(--muted)}
    #stage .p09-result-lines code{font:700 var(--fs-sec)/1.2 var(--font-mono);color:var(--text)}
    #stage .p09-direction{display:flex;align-items:center;gap:12px;font:700 var(--fs-lead)/1.2 var(--font-sans);opacity:0;transform:translateX(-10px)}
    #stage .p09-direction.reveal{opacity:1;transform:none}
    #stage .p09-arrow{width:116px;height:0;border-top:5px solid var(--focus);position:relative}
    #stage .p09-arrow:after{content:"";position:absolute;right:-2px;top:-10px;border-left:16px solid var(--focus);border-top:8px solid transparent;border-bottom:8px solid transparent}
    #stage .p09-foot{height:98px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:40px;border-top:1px solid var(--line-soft);margin-top:14px}
    #stage .p09-claim{font:600 var(--fs-lead)/1.42 var(--font-serif);max-width:890px}
    #stage .p09-next{font:var(--fs-sec)/1.4 var(--font-sans);color:var(--muted);text-align:right;max-width:430px}
    #stage .p09-widget:focus-visible{outline:3px solid var(--focus);outline-offset:8px;border-radius:12px}
    #stage button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    @media(prefers-reduced-motion:no-preference){#stage .p09-param,#stage .p09-direction,#stage .p09-ruler{transition:opacity .18s ease,transform .18s ease,border-color .18s ease}}
  </style>

  <header class="p09-head">
    <div class="p09-kicker">STEP 03 · TEST BOTH SIDES</div>
    <h1 class="p09-title">同一个参数，往哪边轻推会让误差下降？</h1>
  </header>

  <main class="p09-widget min0" data-p09 tabindex="0" aria-label="左右轻推参数实验。按左右方向键轻推，按数字 0 回到中心。">
    <section class="p09-left min0" aria-labelledby="p09-op-title">
      <h2 class="p09-question" id="p09-op-title">操作：只移动参数 <code>w</code></h2>
      <div class="p09-instrument">
        <div class="p09-current">
          <span class="p09-current-label">当前位置</span>
          <output class="p09-param active" data-w>w = 0</output>
        </div>
        <div class="p09-baseline" aria-hidden="true">
          <div class="p09-tick" data-tick="left">−0.0001</div>
          <div class="p09-tick now" data-tick="center">0</div>
          <div class="p09-tick" data-tick="right">+0.0001</div>
        </div>
        <div class="p09-controls btns" aria-label="轻推参数">
          <button class="btn" type="button" data-go="left">向左轻推</button>
          <button class="btn current" type="button" data-go="center">回到中心</button>
          <button class="btn" type="button" data-go="right">向右轻推</button>
        </div>
        <div class="p09-meta">
          <span>轻推距离：<code>0.0001</code> 参数单位</span>
          <button class="p09-reset" type="button" data-reset>重置本页</button>
        </div>
        <div class="p09-samples">
          <div class="p09-samples-title"><span>四条固定样本 · <code>b = 0</code></span><span data-mean>平均误差 0.693147</span></div>
          <div data-sample-list></div>
        </div>
      </div>
      <p class="hint">点击两侧各一次；也可聚焦此区后按 ←、→，按 0 回中心。</p>
    </section>

    <section class="p09-right min0" aria-label="三点误差比较">
      <div class="p09-chart-wrap cvbox">
        <div class="p09-scale-note">放大读数，纵轴不从 0 开始</div>
        <div class="p09-chart" data-chart role="img" aria-label="三个参数位置共用同一平均误差尺度"></div>
      </div>
      <div class="p09-rulers" aria-label="误差差距尺">
        <div class="p09-ruler" data-ruler="left"><div class="p09-gauge"><i></i></div><div><strong>左推</strong><output>待测</output><small>左边：误差更高</small></div></div>
        <div class="p09-ruler seen current" data-ruler="center"><div class="p09-gauge"><i></i></div><div><strong>中心</strong><output>0.693147</output><small>出发点</small></div></div>
        <div class="p09-ruler" data-ruler="right"><div class="p09-gauge"><i></i></div><div><strong>右推</strong><output>待测</output><small>右边：误差更低</small></div></div>
      </div>
      <div class="p09-result">
        <div class="p09-result-lines" data-result-lines><span>两侧都测过后，再比较高低。</span></div>
        <div class="p09-direction" data-direction aria-hidden="true"><span>下坡向右</span><i class="p09-arrow"></i></div>
      </div>
    </section>
  </main>

  <footer class="p09-foot">
    <div class="p09-claim">把参数向左右各轻推一点，误差较低的那边就是下坡方向。</div>
    <div class="p09-next">下一问：已经知道下坡方向，参数接下来该迈多大一步？</div>
  </footer>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script>
  (() => {
    const root = document.currentScript.closest('#stage').querySelector('[data-p09]');
    const xs = [-2, -1, 1, 2];
    const targets = [0, 0, 1, 1];
    const step = 0.0001;
    const eps = Number((window.Lec && Lec.K && Lec.K.BCE_CLIP_EPSILON) || 1e-12);
    const initial = () => ({ position:'center', visited:{left:false,right:false} });
    let state = initial();
    let destroyed = false;

    const q = s => root.querySelector(s);
    const qa = s => [...root.querySelectorAll(s)];
    const chartEl = q('[data-chart]');
    const chart = echarts.init(chartEl, null, {renderer:'svg'});
    const wOut = q('[data-w]');
    const meanOut = q('[data-mean]');
    const sampleList = q('[data-sample-list]');
    const resultLines = q('[data-result-lines]');
    const direction = q('[data-direction]');

    function wFor(pos){ return pos === 'left' ? -step : pos === 'right' ? step : 0; }
    function sigmoid(z){ return 1 / (1 + Math.exp(-z)); }
    function bce(p,t){ const pc=Math.max(eps,Math.min(1-eps,p)); return -(t*Math.log(pc)+(1-t)*Math.log(1-pc)); }
    function evaluate(w){
      const predictions=xs.map(x=>sigmoid(w*x));
      const losses=predictions.map((p,i)=>bce(p,targets[i]));
      return {predictions, mean:losses.reduce((a,b)=>a+b,0)/losses.length};
    }
    const values={left:evaluate(-step),center:evaluate(0),right:evaluate(step)};
    const yMin=0.69304, yMax=0.69325;
    function fmtW(w){ return w===0 ? '0' : (w>0?'+':'−')+Math.abs(w).toFixed(4); }
    function transition(s, action){
      if(action.type==='reset') return initial();
      if(action.type==='move' && ['left','center','right'].includes(action.position)){
        const visited={...s.visited};
        if(action.position==='left'||action.position==='right') visited[action.position]=true;
        return {position:action.position,visited};
      }
      return s;
    }
    function dispatch(action, announce=true){
      if(destroyed) return;
      state=transition(state,action);
      render();
      if(announce){
        const both=state.visited.left&&state.visited.right;
        root.setAttribute('aria-label',`左右轻推参数实验。当前位置 w ${fmtW(wFor(state.position))}，平均误差 ${values[state.position].mean.toFixed(6)}。${both?'两侧已比较，增大 w 是下坡方向。':'按左右方向键继续测量。'}`);
      }
    }
    function renderSamples(){
      const e=values[state.position];
      sampleList.innerHTML=xs.map((x,i)=>`<div class="p09-sample-row"><code>x=${x>0?'+':''}${x}</code><span>答案 ${targets[i]}</span><div class="p09-pred-track" aria-label="预测 ${e.predictions[i].toFixed(5)}"><i style="left:${(e.predictions[i]*100).toFixed(4)}%"></i></div></div>`).join('');
    }
    function renderChart(){
      const shown=[state.visited.left, true, state.visited.right];
      const points=['left','center','right'].map((k,i)=>shown[i]?values[k].mean:null);
      chart.setOption({
        animation:false,
        textStyle:{fontFamily:getComputedStyle(document.documentElement).getPropertyValue('--font-sans'),fontSize:16,color:'#202020'},
        grid:{left:92,right:42,top:56,bottom:64},
        xAxis:{type:'category',data:['−0.0001','0','+0.0001'],name:'参数 w',nameLocation:'middle',nameGap:42,axisLine:{lineStyle:{color:'#4B4A46',width:2}},axisTick:{alignWithLabel:true},axisLabel:{fontFamily:'monospace',fontSize:14,color:'#202020'}},
        yAxis:{type:'value',min:yMin,max:yMax,interval:0.00005,name:'四样本平均误差',nameTextStyle:{fontSize:16,padding:[0,0,10,0]},axisLabel:{fontFamily:'monospace',fontSize:12,formatter:v=>v.toFixed(5)},splitLine:{lineStyle:{color:'#AAA69D',type:'dashed'}}},
        series:[{type:'line',connectNulls:true,data:points,symbol:'circle',symbolSize:(v,p)=>p.dataIndex===['left','center','right'].indexOf(state.position)?18:14,lineStyle:{color:'#176B87',width:3},itemStyle:{color:p=>p.dataIndex===['left','center','right'].indexOf(state.position)?'#F59E0B':'#176B87',borderColor:'#F4F1E8',borderWidth:3},label:{show:true,position:'top',distance:11,fontFamily:'monospace',fontSize:15,fontWeight:700,color:'#202020',formatter:p=>p.value==null?'':Number(p.value).toFixed(6)}}]
      },true);
    }
    function render(){
      const w=wFor(state.position), current=values[state.position];
      wOut.textContent=`w = ${fmtW(w)}`;
      meanOut.textContent=`平均误差 ${current.mean.toFixed(6)}`;
      qa('[data-tick]').forEach(el=>el.classList.toggle('now',el.dataset.tick===state.position));
      qa('[data-go]').forEach(el=>el.classList.toggle('current',el.dataset.go===state.position));
      ['left','center','right'].forEach(k=>{
        const el=q(`[data-ruler="${k}"]`), seen=k==='center'||state.visited[k];
        el.classList.toggle('seen',seen); el.classList.toggle('current',k===state.position);
        el.querySelector('output').textContent=seen?values[k].mean.toFixed(6):'待测';
        const fill=((values[k].mean-yMin)/(yMax-yMin))*100;
        el.querySelector('i').style.setProperty('--fill',`${Math.max(0,Math.min(100,fill))}%`);
      });
      const both=state.visited.left&&state.visited.right;
      if(both){
        const diff=values.right.mean-values.left.mean;
        const slope=diff/(2*step);
        resultLines.innerHTML=`<code>右边误差 − 左边误差 = ${diff.toFixed(6)}</code><code>每 1 单位 w 的坡度读数 ≈ ${slope.toFixed(2)}</code><span>负号 → 增大 <code>w</code> 是下坡</span>`;
      }else resultLines.innerHTML='<span>两侧都测过后，再比较高低。</span>';
      direction.classList.toggle('reveal',both); direction.setAttribute('aria-hidden',String(!both));
      renderSamples(); renderChart();
    }
    function onButton(e){ dispatch({type:'move',position:e.currentTarget.dataset.go}); root.focus(); }
    function onReset(){ dispatch({type:'reset'}); root.focus(); }
    function onKey(e){
      let pos=null;
      if(e.key==='ArrowLeft') pos='left';
      else if(e.key==='ArrowRight') pos='right';
      else if(e.key==='0') pos='center';
      if(pos){ e.preventDefault(); e.stopPropagation(); dispatch({type:'move',position:pos}); }
    }
    qa('[data-go]').forEach(el=>el.addEventListener('click',onButton));
    q('[data-reset]').addEventListener('click',onReset);
    root.addEventListener('keydown',onKey);
    const offResize=Deck.onResize(()=>chart.resize());
    render();
    root.destroyP09=()=>{
      if(destroyed)return; destroyed=true;
      qa('[data-go]').forEach(el=>el.removeEventListener('click',onButton));
      q('[data-reset]').removeEventListener('click',onReset);
      root.removeEventListener('keydown',onKey); offResize(); chart.dispose(); delete root.destroyP09;
    };
    Deck.init({index:9,total:21});
  })();
  </script>
</div>
</body>
</html>
