<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/lib/katex.min.css">
<style>
#stage{gap:18px}
.page-head{height:96px;display:flex;flex-direction:column;justify-content:flex-start;gap:7px}
.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.16em;color:var(--muted)}
h1{margin:0;font:700 var(--fs-h1)/1.15 var(--font-sans);color:var(--text)}
#update-widget{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
#update-widget .instrument{flex:1;min-height:0;display:grid;grid-template-rows:108px minmax(0,1fr) 96px;gap:14px}
#update-widget .knowns{display:flex;align-items:stretch;gap:18px;position:relative}
#update-widget .known-band{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#update-widget .known>div,#update-widget .known-value{position:relative;z-index:3}
#update-widget .known{flex:1;min-width:0;border-top:2px solid var(--line);padding:13px 16px 10px;display:flex;align-items:center;justify-content:space-between;background:var(--panel-bg);position:relative;overflow:hidden}
#update-widget .known:after{content:attr(data-symbol);position:absolute;left:48%;top:50%;transform:translate(-50%,-50%);font:700 44px/1 var(--font-serif);color:rgba(75,74,70,.16);pointer-events:none}
#update-widget .known.active{border-top:5px solid var(--accent);padding-top:10px}
#update-widget .known-label{font-size:var(--fs-sec);color:var(--muted)}
#update-widget .known-value{font:700 27px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text)}
#update-widget .known-value.model{color:var(--model)}
#update-widget .unitline{font-size:var(--fs-label);color:var(--muted);margin-top:8px}
#update-widget .process{position:relative;display:grid;grid-template-columns:250px 72px 310px 72px 260px 72px minmax(250px,1fr);align-items:center;min-height:0;border:1px solid var(--line-soft);background:rgba(255,255,255,.2);padding:18px 20px;border-radius:12px;overflow:hidden}
#update-widget .flow-band{position:absolute;inset:18px 20px;width:calc(100% - 40px);height:calc(100% - 36px);z-index:0;pointer-events:none}
#update-widget .node,#update-widget .arrow{z-index:1}
#update-widget .node{min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;gap:13px;background:var(--panel-bg);border-top:3px solid var(--line);padding:18px 12px;border-radius:8px}
#update-widget .node-label{font-size:var(--fs-sec);color:var(--muted);font-weight:600}
#update-widget .node:last-child{background:repeating-linear-gradient(135deg,var(--panel-bg) 0 12px,rgba(255,255,255,.22) 12px 24px)}
#update-widget[data-mode="left"] .node:nth-of-type(3),#update-widget[data-mode="right"] .node:nth-of-type(3),#update-widget[data-mode="right"] .node:last-child{border-top-color:var(--accent)}
#update-widget .mathline{font:700 27px/1.25 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
#update-widget .formula{font-size:22px;min-height:72px;display:flex;align-items:center;justify-content:center}
#update-widget .formula .katex{font-size:1em}
#update-widget .minus{display:inline-block;padding:0 5px;border-bottom:3px solid transparent}
#update-widget[data-mode="right"] .minus{color:var(--accent);border-color:var(--accent)}
#update-widget .arrow{position:relative;height:3px;background:var(--line);align-self:center}
#update-widget .arrow:after{content:"";position:absolute;right:-1px;top:-6px;border-left:12px solid var(--line);border-top:7px solid transparent;border-bottom:7px solid transparent}
#update-widget .arrow:before{content:"→";position:absolute;left:50%;top:-48px;transform:translateX(-50%);font:700 34px/1 var(--font-serif);color:var(--line);background:var(--paper);width:44px;height:44px;border:1px solid var(--line-soft);border-radius:50%;display:grid;place-content:center}
#update-widget .arrow.active{background:var(--accent)}
#update-widget .arrow.active:after{border-left-color:var(--accent)}
#update-widget .knob{width:104px;height:104px;border-radius:50%;border:2px solid var(--line);display:grid;place-content:center;background:var(--paper);gap:5px}
#update-widget .knob strong{font:700 24px/1 var(--font-mono)}
#update-widget .knob span{font-size:var(--fs-label);color:var(--muted)}
#update-widget .choices{display:flex;gap:12px}
#update-widget .choices .btn{min-width:132px;min-height:48px;font-size:var(--fs-sec)}
#update-widget .choices .btn[aria-pressed="true"]{outline:4px solid var(--accent);outline-offset:2px}
#update-widget .choices .btn:disabled{opacity:.62}
#update-widget .param-track{position:relative;width:220px;height:132px;margin-top:4px}
#update-widget .track{position:absolute;left:18px;right:18px;top:66px;border-top:2px solid var(--line)}
#update-widget .tick{position:absolute;top:58px;width:2px;height:18px;background:var(--line)}
#update-widget .tick.left{left:18px}.tick.mid{left:109px}.tick.right{right:18px}
#update-widget .param-tag{position:absolute;left:82px;top:29px;min-width:56px;padding:7px 10px;border-radius:8px;background:var(--model);color:white;font:700 19px/1 var(--font-mono);transition:left 220ms ease;z-index:2}
#update-widget[data-mode="left"] .param-tag{left:0;background:var(--accent);color:var(--text)}
#update-widget[data-mode="right"] .param-tag{left:164px;background:var(--accent);color:var(--text)}
#update-widget .track-labels{position:absolute;left:0;right:0;top:91px;display:flex;justify-content:space-between;font:14px/1 var(--font-mono);color:var(--muted)}
#update-widget .ruler-wrap{width:100%;display:flex;align-items:flex-end;justify-content:center;gap:24px;height:176px}
#update-widget .ruler{height:150px;width:54px;position:relative;border-left:2px solid var(--line);border-bottom:2px solid var(--line);background:repeating-linear-gradient(135deg,rgba(32,32,32,.08) 0 5px,transparent 5px 10px)}
#update-widget .bar{position:absolute;left:9px;right:7px;bottom:0;background:var(--model);height:var(--h);transition:height 260ms ease 160ms}
#update-widget .bar.after{background:transparent;border:3px solid var(--accent)}
#update-widget .bar-label{position:absolute;left:-8px;bottom:calc(var(--h) + 7px);width:70px;font:700 15px/1 var(--font-mono);font-variant-numeric:tabular-nums}
#update-widget .ruler-name{font-size:var(--fs-label);color:var(--muted);text-align:center;margin-top:6px}
#update-widget .feedback{height:48px;display:flex;align-items:center;justify-content:center;font-size:var(--fs-body);font-weight:600;text-align:center}
#update-widget .feedback[data-kind="left"]{border:1px dashed var(--line);background:var(--panel-bg)}
#update-widget .feedback[data-kind="right"]{font-family:var(--font-serif);font-size:var(--fs-lead)}
#update-widget .record{display:grid;grid-template-columns:1fr auto;align-items:center;gap:22px;border-top:1px solid var(--line);padding-top:14px}
#update-widget .change-row{display:flex;align-items:center;gap:24px;min-width:0}
#update-widget .before,#update-widget .after{font:700 20px/1.3 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
#update-widget .after{color:var(--model)}
#update-widget .calc{font:700 21px/1.2 var(--font-mono);font-variant-numeric:tabular-nums;margin-left:auto}
#update-widget .reset{min-width:124px}
.page-foot{height:70px;display:flex;align-items:flex-start;justify-content:space-between;gap:40px;border-top:1px solid var(--line-soft);padding-top:15px}
.claim{font:600 var(--fs-lead)/1.35 var(--font-serif);max-width:970px}
.next{font-size:var(--fs-sec);color:var(--muted);text-align:right;max-width:410px}
@media(prefers-reduced-motion:reduce){#update-widget *{transition:none!important}}
</style>
</head>
<body data-page="10" data-total="21">
<div id="stage">
  <header class="page-head">
    <div class="kicker">ONE UPDATE</div>
    <h1>学习一步：减去坡度指出的改变量</h1>
  </header>

  <main id="update-widget" class="canvas-full k-process" data-mode="ready">
    <div class="instrument">
      <section class="knowns" aria-label="本次更新的已知量">
        <svg class="known-band" viewBox="0 0 1488 108" preserveAspectRatio="none" aria-hidden="true"><path d="M5 102 V70 H1483 V102 Z" fill="rgba(23,107,135,.11)"/><circle cx="248" cy="86" r="17" fill="rgba(23,107,135,.13)"/><circle cx="744" cy="86" r="17" fill="rgba(245,158,11,.16)"/><circle cx="1240" cy="86" r="17" fill="rgba(245,158,11,.16)"/><path d="M265 86 H727 M761 86 H1223" stroke="var(--line)" stroke-width="3"/></svg>
        <div class="known" data-symbol="w₀"><div><div class="known-label">旧参数 <code>w</code></div><div class="unitline">偏置 <code>b = 0.00</code>，固定不调</div></div><div class="known-value model">0.00</div></div>
        <div class="known active" data-symbol="∂L/∂w"><div><div class="known-label">坡度</div><div class="unitline">误差 / 权重单位</div></div><div class="known-value">−0.75</div></div>
        <div class="known active" data-symbol="η"><div><div class="known-label">学习率</div><div class="unitline">本页固定</div></div><div class="known-value">0.40</div></div>
      </section>

      <section class="process" aria-label="从旧参数到新参数和误差的单步更新链">
        <svg class="flow-band" viewBox="0 0 1400 300" preserveAspectRatio="none" aria-hidden="true">
          <path d="M12 20 H1190 V4 L1388 150 1190 296 V280 H12 Z" fill="rgba(75,74,70,.10)" stroke="var(--line-soft)" stroke-width="2" stroke-dasharray="10 8"/>
          <path d="M45 150 H1330" stroke="var(--line-soft)" stroke-width="3"/>
        </svg>
        <div class="node min0">
          <div class="node-label">先选一步的方向</div>
          <div class="choices" role="group" aria-label="候选更新方向">
            <button class="btn" type="button" data-choice="left" aria-pressed="false">向左一步</button>
            <button class="btn" type="button" data-choice="right" aria-pressed="false">向右一步</button>
          </div>
          <div class="mathline">w = <span data-candidate>?</span></div>
        </div>
        <div class="arrow" data-arrow="1" aria-hidden="true"></div>
        <div class="node min0">
          <div class="node-label">按更新式计算</div>
          <div class="formula" data-formula aria-label="新参数等于旧参数减去学习率乘坡度"></div>
          <div class="mathline"><span>0</span> <span class="minus">−</span> <span>0.40 × (−0.75)</span></div>
        </div>
        <div class="arrow" data-arrow="2" aria-hidden="true"></div>
        <div class="node min0">
          <div class="node-label">参数落到候选位置</div>
          <div class="param-track" aria-label="参数位置，从负零点三到正零点三">
            <div class="track"></div><i class="tick left"></i><i class="tick mid"></i><i class="tick right"></i>
            <div class="param-tag" data-param>0.00</div>
            <div class="track-labels"><span>−0.30</span><span>0</span><span>0.30</span></div>
          </div>
        </div>
        <div class="arrow" data-arrow="3" aria-hidden="true"></div>
        <div class="node min0">
          <div class="node-label">同一批 4 条样本 · 平均 BCE</div>
          <div class="ruler-wrap">
            <div><div class="ruler"><div class="bar" style="--h:69.3%"><span class="bar-label">0.693</span></div></div><div class="ruler-name">改前</div></div>
            <div><div class="ruler"><div class="bar after" data-loss-bar style="--h:0%"><span class="bar-label" data-loss>待选择</span></div></div><div class="ruler-name">改后</div></div>
          </div>
        </div>
      </section>

      <section class="record" aria-label="本次更新记录">
        <div class="change-row min0">
          <span class="before">w = 0.00　误差 = 0.693</span>
          <span aria-hidden="true">→</span>
          <span class="after" data-after>选择方向后核算</span>
          <span class="calc" data-calc></span>
        </div>
        <button class="btn reset" type="button" data-reset>重置本页</button>
      </section>
    </div>
    <div class="feedback" data-feedback aria-live="polite">选择向左或向右，比较末端误差尺。</div>
  </main>

  <footer class="page-foot">
    <div class="claim">坡度给方向，学习率定步长；这一步让 <code>w: 0 → 0.3</code>，误差随之下降。</div>
    <div class="next">如果反复做同一个动作，误差会留下怎样的轨迹？</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/katex.min.js"></script>
<script>
(() => {
  const root = document.getElementById('update-widget');
  if (!root) return;
  const q = s => root.querySelector(s);
  const qa = s => [...root.querySelectorAll(s)];
  const xs = [-2,-1,1,2], targets = [0,0,1,1];
  const initial = () => ({mode:'ready', w:0, loss:meanLoss(0), locked:false});
  let state;
  let destroyed = false;
  let timers = [];

  function meanLoss(w){
    const predictions = xs.map(x => Lec.P.activation('sigmoid', w*x));
    return Lec.P.loss('binaryCrossEntropy', predictions, targets);
  }
  function clearWork(){timers.forEach(clearTimeout);timers=[]}
  function transition(action){
    if(action.type==='reset') return initial();
    if(action.type==='choose' && !state.locked){
      const w = action.side==='right' ? 0.3 : -0.3;
      return {mode:action.side,w,loss:meanLoss(w),locked:action.side==='right'};
    }
    return state;
  }
  function dispatch(action){
    if(destroyed) return;
    clearWork();
    state=transition(action);
    render();
  }
  function render(){
    const ready=state.mode==='ready';
    root.dataset.mode=state.mode;
    qa('[data-choice]').forEach(btn=>{
      btn.setAttribute('aria-pressed',String(btn.dataset.choice===state.mode));
      btn.disabled=state.locked;
    });
    q('[data-candidate]').textContent=ready?'?':(state.w<0?'−0.30':'0.30');
    q('[data-param]').textContent=ready?'0.00':(state.w<0?'−0.30':'0.30');
    const bar=q('[data-loss-bar]');
    const loss=q('[data-loss]');
    const pct=ready?0:Math.min(100,state.loss*100);
    bar.style.setProperty('--h',pct.toFixed(1)+'%');
    loss.textContent=ready?'待选择':state.loss.toFixed(3);
    qa('[data-arrow]').forEach((a,i)=>a.classList.toggle('active',!ready && i <= (state.mode==='right'?2:1)));
    const after=q('[data-after]'), calc=q('[data-calc]'), feedback=q('[data-feedback]');
    if(ready){
      after.textContent='选择方向后核算'; calc.textContent='';
      feedback.dataset.kind=''; feedback.textContent='选择向左或向右，比较末端误差尺。';
    }else if(state.mode==='left'){
      after.textContent=`w = −0.30　误差 = ${state.loss.toFixed(3)}`; calc.textContent='';
      feedback.dataset.kind='left'; feedback.textContent='这一步走向上坡：换另一边试试。';
    }else{
      after.textContent=`w = 0.30　误差 = ${state.loss.toFixed(3)}`;
      calc.textContent='0 − 0.40 × (−0.75) = 0.30';
      feedback.dataset.kind='right'; feedback.textContent='负坡度被减去，所以参数向右走。';
    }
  }
  function reset(){dispatch({type:'reset'})}
  qa('[data-choice]').forEach(btn=>btn.addEventListener('click',()=>dispatch({type:'choose',side:btn.dataset.choice})));
  q('[data-reset]').addEventListener('click',reset);
  katex.render('w_{\\text{新}}=w_{\\text{旧}}-\\eta\\times\\text{坡度}',q('[data-formula]'),{throwOnError:false});
  state=initial(); render();
  Deck.init({index:10,total:21});
  root.destroyUpdateWidget=()=>{if(destroyed)return;destroyed=true;clearWork();delete root.destroyUpdateWidget};
})();
</script>
</body>
</html>
