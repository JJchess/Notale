<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{position:relative;}
.p12{position:absolute;inset:0;display:flex;flex-direction:column;}
.p12 .head{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:6px;}
.p12 .kicker{font-family:var(--font-sans);font-size:var(--fs-label);letter-spacing:.14em;color:var(--muted);font-weight:600;}
.p12 h1{margin:0;font-family:var(--font-sans);font-weight:700;font-size:var(--fs-h1);color:var(--text);text-align:center;line-height:1.3;max-width:1100px;}
.p12 main.focus{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;}
.p12 .foot{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:4px;}
.p12 .conclude{margin:0;font-family:var(--font-serif);font-size:var(--fs-h2);color:var(--text);text-align:center;}
.p12 .nextq{margin:0;font-family:var(--font-sans);font-size:var(--fs-body);color:var(--muted);text-align:center;}

.tree{position:relative;width:1488px;height:600px;}

.trunk{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;z-index:2;}
.trunk .neuron{width:72px;height:72px;border-radius:50%;background:var(--panel-bg);border:2px solid var(--text);display:flex;align-items:center;justify-content:center;text-align:center;}
.trunk .neuron span{font-family:var(--font-sans);font-size:14px;font-weight:700;color:var(--text);line-height:1.15;}
.param-row{display:flex;gap:22px;}
.param-cell{display:flex;flex-direction:column;align-items:center;gap:4px;}
.param{font-family:var(--font-mono);font-size:var(--fs-label);color:var(--text);background:var(--panel-bg);border:1px solid var(--line);border-radius:8px;padding:4px 14px;}
.param-mean{font-family:var(--font-sans);font-size:var(--fs-label);color:var(--muted);}

.connector-svg{position:absolute;left:0;top:0;width:1488px;height:600px;z-index:1;pointer-events:none;}

.connect-sentence{position:absolute;left:50%;top:194px;transform:translateX(-50%);width:760px;text-align:center;font-family:var(--font-sans);font-size:var(--fs-sec);color:var(--muted);}

.branches{position:absolute;left:50%;top:232px;transform:translateX(-50%);display:flex;gap:56px;z-index:2;}
.branch{width:270px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.branch .shape-box{width:270px;height:148px;display:flex;align-items:center;justify-content:center;}
.branch .shape-box svg{display:block;}
.branch .branch-label{font-family:var(--font-sans);font-size:var(--fs-label);font-weight:600;color:var(--text);}
.branch .branch-caption{font-family:var(--font-sans);font-size:var(--fs-sec);color:var(--muted);text-align:center;line-height:1.35;}

.convergence{position:absolute;left:50%;top:522px;transform:translateX(-50%);width:940px;text-align:center;}
.convergence p{margin:0;font-family:var(--font-sans);font-size:var(--fs-lead);color:var(--text);line-height:1.4;font-weight:600;}

.legend-note{position:absolute;left:50%;top:566px;transform:translateX(-50%);width:900px;text-align:center;font-family:var(--font-sans);font-size:var(--fs-sec);color:var(--muted);}
</style>
</head>
<body data-page="12" data-total="21">
<div id="stage">
  <div class="p12">
    <div class="head">
      <div class="kicker">LEARNING → CAPACITY</div>
      <h1>一个神经元已经会学；它能学会什么形状？</h1>
    </div>

    <main class="focus">
      <div class="tree k-classification">
        <svg class="connector-svg" viewBox="0 0 1488 600">
          <path d="M 744 150 L 744 216 L 418 216 L 418 232" fill="none" stroke="var(--line)" stroke-width="2"></path>
          <path d="M 744 150 L 744 232" fill="none" stroke="var(--line)" stroke-width="2"></path>
          <path d="M 744 150 L 744 216 L 1070 216 L 1070 232" fill="none" stroke="var(--line)" stroke-width="2"></path>
        </svg>

        <div class="trunk">
          <div class="neuron"><span>会学习</span></div>
          <div class="param-row">
            <div class="param-cell"><div class="param">w</div><div class="param-mean">权重</div></div>
            <div class="param-cell"><div class="param">b</div><div class="param-mean">偏置</div></div>
          </div>
        </div>

        <div class="connect-sentence">同一个神经元、同一组 w、b，分支出三种待检验的形状</div>

        <div class="branches">
          <div class="branch">
            <div class="shape-box">
              <svg width="230" height="120" viewBox="0 0 230 120">
                <line x1="20" y1="100" x2="210" y2="20" stroke="var(--muted)" stroke-width="2.5" stroke-dasharray="6 6"></line>
                <text x="115" y="66" font-family="var(--font-sans)" font-size="26" fill="var(--muted)" text-anchor="middle">?</text>
              </svg>
            </div>
            <div class="branch-label">直线？</div>
            <div class="branch-caption">一条直的分界</div>
          </div>

          <div class="branch">
            <div class="shape-box">
              <svg width="230" height="120" viewBox="0 0 230 120">
                <path d="M 20 95 Q 80 20 115 60 Q 150 100 210 25" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-dasharray="6 6"></path>
                <text x="115" y="66" font-family="var(--font-sans)" font-size="26" fill="var(--muted)" text-anchor="middle">?</text>
              </svg>
            </div>
            <div class="branch-label">弯线？</div>
            <div class="branch-caption">一条弯曲的分界</div>
          </div>

          <div class="branch">
            <div class="shape-box">
              <svg width="230" height="120" viewBox="0 0 230 120">
                <ellipse cx="62" cy="60" rx="42" ry="34" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-dasharray="6 6"></ellipse>
                <ellipse cx="170" cy="60" rx="42" ry="34" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-dasharray="6 6"></ellipse>
                <text x="115" y="66" font-family="var(--font-sans)" font-size="26" fill="var(--muted)" text-anchor="middle">?</text>
              </svg>
            </div>
            <div class="branch-label">分开的区域？</div>
            <div class="branch-caption">两块互不相连的区域</div>
          </div>
        </div>

        <div class="convergence">
          <p>哪些形状，一个神经元真的能做到？</p>
        </div>

        <div class="legend-note">虚线轮廓与问号表示待检验的候选，不代表已经成立的结论</div>
      </div>
    </main>

    <div class="foot">
      <p class="conclude">学习方法已经成立，能力边界还没有回答。</p>
      <p class="nextq">如果输入变成平面上的两个数，它画出的分界会是什么样？</p>
    </div>
  </div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
