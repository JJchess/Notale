<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="15" data-total="21">
<div id="stage">
  <style>
    #stage .p15-page{height:100%;display:flex;flex-direction:column;gap:18px;min-width:0;min-height:0}
    #stage .p15-head{flex:0 0 92px;display:flex;flex-direction:column;justify-content:flex-start;gap:7px}
    #stage .p15-kicker{font-size:var(--fs-label);font-weight:700;letter-spacing:.08em;color:var(--muted)}
    #stage .p15-head h1{margin:0;font-size:var(--fs-h1);line-height:1.14;font-weight:750;color:var(--text)}
    #stage .p15-main{flex:1;display:flex;gap:40px;min-width:0;min-height:0}
    #stage .xor-widget{flex:1 1 72%;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
    #stage .xor-widget .xw-instruction{height:34px;display:flex;align-items:center;justify-content:space-between;gap:20px;color:var(--muted);font-size:var(--fs-sec);line-height:1.35}
    #stage .xor-widget .xw-shortcuts{font-size:var(--fs-label);white-space:nowrap}
    #stage .xor-widget .xw-plot{position:relative;flex:1;min-width:0;min-height:0;border:1px solid var(--line-soft);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.18)}
    #stage .xor-widget .xw-konva{position:absolute;inset:0}
    #stage .xor-widget .xw-region-label{position:absolute;z-index:3;padding:4px 8px;border:1px solid var(--line-soft);border-radius:8px;background:rgba(244,241,232,.9);font-size:var(--fs-label);color:var(--text);pointer-events:none}
    #stage .xor-widget .xw-region-label.zero{left:22px;top:18px}
    #stage .xor-widget .xw-region-label.one{right:22px;top:18px;color:var(--model);font-weight:700}
    #stage .xor-widget .xw-keytarget{position:absolute;z-index:4;display:block;padding:0;border:0;background:transparent;color:transparent;pointer-events:none;transform-origin:center;outline:none}
    #stage .xor-widget .xw-keytarget:focus-visible{outline:4px solid var(--focus);outline-offset:3px;background:rgba(245,158,11,.12)}
    #stage .xor-widget .xw-keytarget.line{width:170px;height:34px;border-radius:8px}
    #stage .xor-widget .xw-keytarget.handle{width:42px;height:42px;border-radius:50%}
    #stage .xor-widget .xw-feedback{min-height:42px;display:flex;align-items:center;padding:0 2px;font-size:var(--fs-body);line-height:1.4;color:var(--text)}
    #stage .xor-widget .xw-feedback.revealed{font-family:var(--font-serif);font-weight:700}
    #stage .p15-results{flex:0 0 388px;display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0}
    #stage .p15-results .score-line{display:flex;gap:10px;align-items:stretch}
    #stage .p15-results .score{flex:1;padding:14px 12px;background:var(--panel-bg);border:1px solid var(--line-soft);border-radius:12px}
    #stage .p15-results .score-label{display:block;font-size:var(--fs-label);color:var(--muted);margin-bottom:4px}
    #stage .p15-results .score-value{font-family:var(--font-mono);font-size:var(--fs-h2);font-weight:750;color:var(--text);font-variant-numeric:tabular-nums}
    #stage .p15-results .score.current .score-value{color:var(--model)}
    #stage .p15-results .rows{flex:1;display:flex;flex-direction:column;border-top:1px solid var(--line);min-height:0}
    #stage .p15-results .row{display:grid;grid-template-columns:52px 1fr 1.2fr 54px;align-items:center;gap:8px;flex:1;border-bottom:1px solid var(--line-soft);font-size:var(--fs-sec);min-height:0}
    #stage .p15-results .row.head{flex:0 0 42px;color:var(--muted);font-size:var(--fs-label)}
    #stage .p15-results .sample-mark{width:34px;height:34px;display:grid;place-items:center;border:2px solid var(--text);border-radius:4px;font-family:var(--font-mono);font-size:var(--fs-label);font-weight:750;background:var(--paper)}
    #stage .p15-results .sample-mark.one{background:var(--text);color:var(--paper)}
    #stage .p15-results .pred{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--model);font-weight:750}
    #stage .p15-results .verdict{font-weight:750;color:var(--text)}
    #stage .p15-results .verdict.wrong{text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--focus);text-underline-offset:5px}
    #stage .p15-results .controls{display:flex;align-items:center;justify-content:space-between;gap:12px}
    #stage .p15-results .control-note{font-size:var(--fs-label);line-height:1.35;color:var(--muted)}
    #stage .p15-results .btn{white-space:nowrap}
    #stage .p15-foot{flex:0 0 74px;display:flex;align-items:center;justify-content:space-between;gap:40px;border-top:1px solid var(--line-soft);padding-top:14px;min-width:0}
    #stage .p15-claim{font-family:var(--font-serif);font-size:var(--fs-lead);font-weight:700;line-height:1.35;color:var(--text);max-width:850px}
    #stage .p15-next{font-size:var(--fs-sec);line-height:1.4;color:var(--muted);text-align:right;max-width:470px}
  </style>

  <div class="p15-page">
    <header class="p15-head">
      <div class="p15-kicker">IV · 能力边界</div>
      <h1>一条直线，分不开对角同类的四个点</h1>
    </header>

    <main class="p15-main min0">
      <section class="xor-widget min0" data-xor-widget aria-label="单条直线分类挑战">
        <div class="xw-instruction">
          <span>拖动直线或两端手柄，试着分对全部四点。</span>
          <span class="xw-shortcuts">Tab 聚焦后，用方向键微调</span>
        </div>
        <div class="xw-plot cvbox no-pan" data-plot>
          <div class="xw-konva" data-konva aria-hidden="true"></div>
          <span class="xw-region-label zero">预测 0</span>
          <span class="xw-region-label one">预测 1</span>
          <button class="xw-keytarget line" data-key-line type="button" aria-label="分类直线，方向键平移"></button>
          <button class="xw-keytarget handle" data-key-a type="button" aria-label="直线端点一，方向键旋转"></button>
          <button class="xw-keytarget handle" data-key-b type="button" aria-label="直线端点二，方向键旋转"></button>
        </div>
        <div class="xw-feedback" data-feedback aria-live="polite">拖动后，右侧四行会同步更新。</div>
      </section>

      <aside class="p15-results k-comparison min0" aria-label="四个样本的分类结果">
        <div class="score-line">
          <div class="score current"><span class="score-label">当前分对</span><span class="score-value" data-current>2 / 4</span></div>
          <div class="score"><span class="score-label">本轮最好</span><span class="score-value" data-best>2 / 4</span></div>
        </div>
        <div class="rows" role="table" aria-label="正确类别、当前预测与对错">
          <div class="row head" role="row"><span>样本</span><span>正确类别</span><span>当前预测</span><span>结果</span></div>
          <div class="row" role="row" data-row="A"><span class="sample-mark one">1</span><span class="num">1</span><span class="pred">预测 0</span><span class="verdict wrong">错</span></div>
          <div class="row" role="row" data-row="B"><span class="sample-mark">0</span><span class="num">0</span><span class="pred">预测 0</span><span class="verdict">对</span></div>
          <div class="row" role="row" data-row="C"><span class="sample-mark">0</span><span class="num">0</span><span class="pred">预测 1</span><span class="verdict wrong">错</span></div>
          <div class="row" role="row" data-row="D"><span class="sample-mark one">1</span><span class="num">1</span><span class="pred">预测 1</span><span class="verdict">对</span></div>
        </div>
        <div class="controls">
          <span class="control-note">线身平移 · 端点旋转</span>
          <button class="btn" type="button" data-reset>重置本页</button>
        </div>
      </aside>
    </main>

    <footer class="p15-foot">
      <div class="p15-claim">无论怎样移动直线，单个神经元最多分对 3 个，至少错 1 个。</div>
      <div class="p15-next">如果让多个神经元先各自判断一部分区域，会发生什么？</div>
    </footer>
  </div>

  <script src="assets/lib/konva.min.js"></script>
  <script>
  window.addEventListener('load', () => {
    const root = document.querySelector('[data-xor-widget]');
    if (!root || !window.Konva) return;

    const plot = root.querySelector('[data-plot]');
    const host = root.querySelector('[data-konva]');
    const keyLine = root.querySelector('[data-key-line]');
    const keyA = root.querySelector('[data-key-a]');
    const keyB = root.querySelector('[data-key-b]');
    const feedback = root.querySelector('[data-feedback]');
    const currentOut = document.querySelector('[data-current]');
    const bestOut = document.querySelector('[data-best]');
    const resetBtn = document.querySelector('[data-reset]');
    const rows = [...document.querySelectorAll('[data-row]')];

    const samples = [
      {id:'A', x:-1, y:-1, truth:1},
      {id:'B', x:-1, y: 1, truth:0},
      {id:'C', x: 1, y:-1, truth:0},
      {id:'D', x: 1, y: 1, truth:1}
    ];
    const range = 1.6;
    const initial = () => ({theta:0, d:0, best:2, reached:false, firstWrong:null, revealed:false, touched:false});
    let state = initial();
    let destroyed = false;
    let drag = null;
    let stage, layer, region, hatch, boundary, hitLine, handles, gridGroup, sampleGroup;

    const css = getComputedStyle(document.documentElement);
    const color = name => css.getPropertyValue(name).trim();
    const C = {paper:color('--paper') || '#F4F1E8', text:color('--text'), model:color('--model'), focus:color('--focus'), line:color('--line'), soft:color('--line-soft')};

    function dims(){
      return {w:Math.max(300, host.offsetWidth), h:Math.max(260, host.offsetHeight), pad:{l:62,r:32,t:34,b:52}};
    }
    function mapPoint(x,y){
      const q=dims(), iw=q.w-q.pad.l-q.pad.r, ih=q.h-q.pad.t-q.pad.b;
      return {x:q.pad.l+(x+range)/(2*range)*iw, y:q.pad.t+(range-y)/(2*range)*ih};
    }
    function unmapPoint(p){
      const q=dims(), iw=q.w-q.pad.l-q.pad.r, ih=q.h-q.pad.t-q.pad.b;
      return {x:(p.x-q.pad.l)/iw*(2*range)-range, y:range-(p.y-q.pad.t)/ih*(2*range)};
    }
    function evalSample(s){ return s.x*Math.cos(state.theta)+s.y*Math.sin(state.theta)-state.d >= 0 ? 1 : 0; }
    function scoreAndWrong(){
      const result=samples.map(s=>({...s,pred:evalSample(s)}));
      return {result, score:result.filter(s=>s.pred===s.truth).length, wrong:result.filter(s=>s.pred!==s.truth).map(s=>s.id).join('')};
    }
    function clipHalfPlane(poly, keepPositive){
      const n={x:Math.cos(state.theta), y:Math.sin(state.theta)};
      const val=p=>(p.x*n.x+p.y*n.y-state.d)*(keepPositive?1:-1);
      const out=[];
      for(let i=0;i<poly.length;i++){
        const a=poly[i], b=poly[(i+1)%poly.length], va=val(a), vb=val(b);
        if(va>=0) out.push(a);
        if((va>=0)!==(vb>=0)){
          const t=va/(va-vb);
          out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
        }
      }
      return out;
    }
    function lineEnds(){
      const n={x:Math.cos(state.theta),y:Math.sin(state.theta)}, t={x:-n.y,y:n.x}, c={x:n.x*state.d,y:n.y*state.d};
      const hits=[];
      if(Math.abs(t.x)>1e-6){
        for(const x of [-range,range]){ const u=(x-c.x)/t.x, y=c.y+u*t.y; if(y>=-range-1e-6&&y<=range+1e-6) hits.push({x,y,u}); }
      }
      if(Math.abs(t.y)>1e-6){
        for(const y of [-range,range]){ const u=(y-c.y)/t.y, x=c.x+u*t.x; if(x>=-range-1e-6&&x<=range+1e-6) hits.push({x,y,u}); }
      }
      hits.sort((a,b)=>a.u-b.u);
      return [hits[0],hits[hits.length-1]];
    }
    function maxD(theta){ return range*(Math.abs(Math.cos(theta))+Math.abs(Math.sin(theta)))-.04; }
    function normalizeAngle(a){
      while(a>Math.PI) a-=Math.PI*2;
      while(a<=-Math.PI) a+=Math.PI*2;
      return a;
    }
    function setModel(theta,d,source,announce){
      if(destroyed) return;
      theta=normalizeAngle(theta);
      d=Math.max(-maxD(theta),Math.min(maxD(theta),d));
      state.theta=theta; state.d=d; state.touched=true;
      const before=scoreAndWrong();
      if(before.score>state.best) state.best=before.score;
      if(before.score===3 && !state.reached){ state.reached=true; state.firstWrong=before.wrong; }
      else if(state.reached && before.score===3 && before.wrong!==state.firstWrong){ state.revealed=true; }
      render();
      if(announce) root.setAttribute('aria-label',`单条直线分类挑战，当前分对 ${before.score} 个，本轮最好 ${state.best} 个`);
    }
    function rebuildStatic(){
      gridGroup.destroyChildren(); sampleGroup.destroyChildren();
      const q=dims();
      for(const v of [-1,0,1]){
        const a=mapPoint(-range,v), b=mapPoint(range,v);
        gridGroup.add(new Konva.Line({points:[a.x,a.y,b.x,b.y],stroke:v===0?C.line:C.soft,strokeWidth:v===0?1.5:1,dash:v===0?[]:[5,6],listening:false}));
        const c=mapPoint(v,-range), d=mapPoint(v,range);
        gridGroup.add(new Konva.Line({points:[c.x,c.y,d.x,d.y],stroke:v===0?C.line:C.soft,strokeWidth:v===0?1.5:1,dash:v===0?[]:[5,6],listening:false}));
        gridGroup.add(new Konva.Text({x:c.x-10,y:q.h-q.pad.b+12,width:20,align:'center',text:String(v),fontSize:13,fontFamily:'monospace',fill:C.line,listening:false}));
        gridGroup.add(new Konva.Text({x:18,y:a.y-8,width:30,align:'right',text:String(v),fontSize:13,fontFamily:'monospace',fill:C.line,listening:false}));
      }
      samples.forEach(s=>{
        const p=mapPoint(s.x,s.y), g=new Konva.Group({x:p.x,y:p.y,listening:false});
        g.add(new Konva.Rect({x:-18,y:-18,width:36,height:36,cornerRadius:4,fill:s.truth?C.text:C.paper,stroke:C.text,strokeWidth:2}));
        g.add(new Konva.Text({x:-18,y:-10,width:36,align:'center',text:String(s.truth),fontSize:16,fontStyle:'bold',fontFamily:'monospace',fill:s.truth?C.paper:C.text}));
        g.add(new Konva.Text({x:-34,y:23,width:68,align:'center',text:s.id,fontSize:15,fontStyle:'bold',fill:C.text}));
        sampleGroup.add(g);
      });
    }
    function render(){
      if(destroyed) return;
      const q=dims();
      if(stage.width()!==q.w || stage.height()!==q.h){stage.size({width:q.w,height:q.h});rebuildStatic();}
      const square=[{x:-range,y:-range},{x:range,y:-range},{x:range,y:range},{x:-range,y:range}];
      const poly=clipHalfPlane(square,true).map(p=>mapPoint(p.x,p.y));
      const flat=poly.flatMap(p=>[p.x,p.y]);
      region.points(flat); hatch.points(flat);
      const ends=lineEnds();
      if(ends[0]&&ends[1]){
        const a=mapPoint(ends[0].x,ends[0].y), b=mapPoint(ends[1].x,ends[1].y);
        boundary.points([a.x,a.y,b.x,b.y]); hitLine.points([a.x,a.y,b.x,b.y]);
        handles[0].position(a); handles[1].position(b);
        keyA.style.left=`${a.x-21}px`; keyA.style.top=`${a.y-21}px`;
        keyB.style.left=`${b.x-21}px`; keyB.style.top=`${b.y-21}px`;
        const c=mapPoint(Math.cos(state.theta)*state.d,Math.sin(state.theta)*state.d);
        keyLine.style.left=`${c.x-85}px`; keyLine.style.top=`${c.y-17}px`;
        keyLine.style.transform=`rotate(${state.theta*180/Math.PI+90}deg)`;
      }
      const {result,score,wrong}=scoreAndWrong();
      result.forEach((s,i)=>{
        const pred=rows[i].querySelector('.pred'), verdict=rows[i].querySelector('.verdict');
        pred.textContent=`预测 ${s.pred}`;
        verdict.textContent=s.pred===s.truth?'对':'错';
        verdict.classList.toggle('wrong',s.pred!==s.truth);
      });
      currentOut.textContent=`${score} / 4`; bestOut.textContent=`${state.best} / 4`;
      if(state.revealed){ feedback.textContent='错点换了，但仍至少有一个。这四点的一条直线分类上限是 3 / 4。'; feedback.classList.add('revealed'); }
      else if(state.reached){ feedback.textContent='3 / 4：只剩一个错点。你能让它也正确吗？'; feedback.classList.remove('revealed'); }
      else { feedback.textContent=state.touched?'继续移动或旋转直线，比较每个点的结果。':'拖动后，右侧四行会同步更新。'; feedback.classList.remove('revealed'); }
      root.setAttribute('data-score',String(score)); root.setAttribute('data-wrong',wrong); root.setAttribute('data-revealed',String(state.revealed));
      layer.batchDraw();
    }
    function pointerLogical(){ return unmapPoint(stage.getPointerPosition()); }
    function beginLine(){
      const p=pointerLogical(); drag={kind:'line',p,d:state.d}; document.body.style.cursor='grabbing';
    }
    function beginHandle(index){ drag={kind:'handle',index}; document.body.style.cursor='grabbing'; }
    function move(){
      if(!drag) return;
      const p=pointerLogical();
      if(drag.kind==='line'){
        const n={x:Math.cos(state.theta),y:Math.sin(state.theta)};
        setModel(state.theta,drag.d+(p.x-drag.p.x)*n.x+(p.y-drag.p.y)*n.y,'pointer',false);
      }else{
        const c={x:Math.cos(state.theta)*state.d,y:Math.sin(state.theta)*state.d};
        let vx=p.x-c.x, vy=p.y-c.y;
        if(drag.index===0){vx=-vx;vy=-vy;}
        const theta=Math.atan2(vy,vx)-Math.PI/2;
        setModel(theta,state.d,'pointer',false);
      }
    }
    function end(){
      if(!drag) return; drag=null; document.body.style.cursor='';
      const r=scoreAndWrong(); root.setAttribute('aria-label',`单条直线分类挑战，当前分对 ${r.score} 个，本轮最好 ${state.best} 个`);
    }
    function onKey(kind,index,e){
      if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) return;
      e.preventDefault(); e.stopPropagation();
      const dir=(e.key==='ArrowRight'||e.key==='ArrowUp')?1:-1;
      if(kind==='line') setModel(state.theta,state.d+dir*.05,'keyboard',true);
      else setModel(state.theta+dir*(index===0?-1:1)*2*Math.PI/180,state.d,'keyboard',true);
    }
    function reset(){ state=initial(); drag=null; document.body.style.cursor=''; render(); root.setAttribute('aria-label','单条直线分类挑战，已重置，当前分对 2 个，本轮最好 2 个'); }

    stage=new Konva.Stage({container:host,width:dims().w,height:dims().h});
    layer=new Konva.Layer(); stage.add(layer);
    region=new Konva.Line({closed:true,fill:C.model,opacity:.12,listening:false});
    hatch=new Konva.Line({closed:true,fillPatternImage:(()=>{const c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d');g.strokeStyle=C.model;g.globalAlpha=.32;g.lineWidth=1;g.beginPath();g.moveTo(-4,16);g.lineTo(16,-4);g.moveTo(4,20);g.lineTo(20,4);g.stroke();return c;})(),listening:false});
    gridGroup=new Konva.Group(); boundary=new Konva.Line({stroke:C.text,strokeWidth:4,lineCap:'round',listening:false});
    hitLine=new Konva.Line({stroke:'rgba(0,0,0,0.01)',strokeWidth:30,lineCap:'round',hitStrokeWidth:30});
    handles=[0,1].map(()=>new Konva.Circle({radius:15,fill:C.paper,stroke:C.focus,strokeWidth:4}));
    sampleGroup=new Konva.Group();
    layer.add(region,hatch,gridGroup,boundary,hitLine,...handles,sampleGroup);
    hitLine.on('pointerdown',beginLine); handles.forEach((h,i)=>h.on('pointerdown',()=>beginHandle(i)));
    stage.on('pointermove',move); stage.on('pointerup pointercancel pointerleave',end);
    host.addEventListener('pointerdown',e=>e.preventDefault());
    keyLine.addEventListener('keydown',e=>onKey('line',0,e));
    keyA.addEventListener('keydown',e=>onKey('handle',0,e));
    keyB.addEventListener('keydown',e=>onKey('handle',1,e));
    resetBtn.addEventListener('click',reset);
    const offResize=Deck.onResize(render);
    const ro=new ResizeObserver(render); ro.observe(host);
    render();

    root.__p15={set(thetaDeg,d){setModel(thetaDeg*Math.PI/180,d,'test',true);},reset,destroy(){
      if(destroyed) return; destroyed=true; offResize(); ro.disconnect(); stage.destroy(); delete root.__p15;
    }};
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
