<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="16" data-total="21">
<div id="stage">
  <style>
    #stage{gap:18px;overflow:hidden}
    .page-head{height:84px;display:flex;flex-direction:column;justify-content:flex-start;border-bottom:1px solid var(--line-soft);padding-bottom:14px}
    .kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--muted);margin:0 0 9px}
    h1{font:700 var(--fs-h1)/1.15 var(--font-sans);margin:0;color:var(--text)}
    .game{flex:none;height:655px;display:flex;align-items:stretch;gap:42px;min-height:0}
    .plot-side{flex:0 0 590px;display:flex;flex-direction:column;gap:12px;min-width:0}
    .network-side{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
    .section-head{display:flex;justify-content:space-between;align-items:baseline;height:31px}
    h2{font:700 var(--fs-h2)/1.2 var(--font-sans);margin:0}
    .section-note{font:400 var(--fs-label)/1.3 var(--font-sans);color:var(--muted)}
    .board,.network-board{position:relative;flex:1 1 0;min-height:0;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg);overflow:hidden}
    .board svg,.network-board>svg{position:absolute;inset:0;width:100%;height:100%}
    .axis{stroke:var(--line);stroke-width:2}
    .gridline{stroke:var(--line-soft);stroke-width:1;stroke-dasharray:4 7}
    .region{fill:var(--model);fill-opacity:0;stroke:var(--model);stroke-width:2;stroke-dasharray:8 7;transition:fill-opacity 220ms ease 80ms,stroke-dasharray 180ms ease}
    .region.on{fill-opacity:.19;stroke-dasharray:none}
    .point{fill:var(--bg);stroke:var(--text);stroke-width:3}
    .point.pred-one{fill:var(--model);stroke-width:4}
    .point-target{font:700 16px var(--font-mono);fill:var(--text)}
    .point-pred{font:700 15px var(--font-mono);fill:var(--model)}
    .axis-label{font:600 16px var(--font-mono);fill:var(--muted)}
    .region-label{font:700 16px var(--font-sans);fill:var(--text)}
    .board-legend{height:42px;display:flex;gap:22px;align-items:center;font:400 var(--fs-label)/1.3 var(--font-sans);color:var(--muted)}
    .legend-dot{display:inline-block;width:14px;height:14px;border:3px solid var(--text);border-radius:50%;vertical-align:-3px;margin-right:7px;background:var(--bg)}
    .legend-dot.pred{background:var(--model);border-color:var(--model)}
    .network-board{background:var(--panel-bg)}
    .net-path{fill:none;stroke:var(--line-soft);stroke-width:2}
    .net-path.active{stroke:var(--model);stroke-width:5;stroke-dasharray:320;stroke-dashoffset:0;transition:stroke-dashoffset 180ms ease}
    .net-path.off{stroke-dasharray:8 8}
    .slot{position:absolute;left:220px;width:236px;height:112px;border:2px dashed var(--line-soft);border-radius:12px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font:600 var(--fs-label)/1 var(--font-sans);color:var(--muted);background:rgba(244,241,232,.52)}
    .slot-a{top:60px}.slot-b{top:218px}
    .slot.filled{border-style:solid;border-color:var(--model);color:var(--text)}
    .gate{position:absolute;left:184px;width:236px;height:112px;border:2px solid var(--line);border-radius:10px;background:var(--bg);padding:15px 18px;text-align:left;color:var(--text);cursor:grab;touch-action:none;user-select:none;transition:transform 220ms ease,border-color 180ms ease,box-shadow 180ms ease;z-index:3}
    .gate-a{top:60px}.gate-b{top:218px}
    .gate.connected{transform:translateX(36px);border-color:var(--model);box-shadow:0 4px 0 rgba(23,107,135,.18)}
    .gate.dragging{transition:none;cursor:grabbing;border-color:var(--focus)}
    .gate:focus-visible,.btn:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
    .gate-name{display:flex;justify-content:space-between;align-items:center;font:700 var(--fs-body)/1.2 var(--font-sans);margin-bottom:11px}
    .gate-state{font:700 var(--fs-label)/1 var(--font-sans);padding:5px 8px;border:1px solid var(--line);border-radius:999px}
    .gate-rule{font:500 var(--fs-sec)/1.35 var(--font-mono)}
    .output-node{position:absolute;right:40px;top:151px;width:132px;height:132px;border:3px solid var(--text);border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
    .output-node strong{font:700 var(--fs-body)/1.2 var(--font-sans)}
    .output-node span{font:600 var(--fs-label)/1.25 var(--font-sans);margin-top:8px}
    .net-instruction{position:absolute;left:24px;bottom:22px;font:600 var(--fs-label)/1.35 var(--font-sans);color:var(--muted)}
    .status-row{height:112px;display:flex;align-items:stretch;gap:18px}
    .score{flex:0 0 282px;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;align-items:center;padding:15px 18px;gap:14px}
    .score-copy{font:600 var(--fs-label)/1.3 var(--font-sans);color:var(--muted);white-space:nowrap}
    .score-value{font:800 36px/1 var(--font-mono);color:var(--model);white-space:nowrap}
    .feedback{flex:1;border:1px solid var(--line-soft);border-radius:10px;padding:13px 18px;background:var(--bg);font:500 var(--fs-sec)/1.4 var(--font-sans);display:flex;flex-direction:column;justify-content:center}
    .feedback strong{font-size:var(--fs-body);margin-bottom:4px}
    .btn{align-self:center;min-height:48px;padding:0 19px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:700 var(--fs-label)/1 var(--font-sans);cursor:pointer}
    .footer-line{height:69px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:34px}
    .claim{flex:1;font:600 var(--fs-lead)/1.35 var(--font-serif)}
    .next{flex:0 0 470px;font:600 var(--fs-sec)/1.35 var(--font-sans);color:var(--muted);text-align:right}
    @media (prefers-reduced-motion:reduce){.region,.net-path.active,.gate{transition:none!important}}
  </style>

  <header class="page-head">
    <p class="kicker">HIDDEN FEATURES</p>
    <h1>两个隐藏神经元，各守一块局部区域</h1>
  </header>

  <main class="game k-process" aria-label="拼接两个隐藏门的分类游戏">
    <section class="plot-side min0" aria-labelledby="plot-title">
      <div class="section-head"><h2 id="plot-title">分类现场</h2><span class="section-note">点内：预测值 · 点旁：目标值</span></div>
      <div class="board">
        <svg viewBox="0 0 590 500" role="img" aria-labelledby="plot-svg-title plot-svg-desc">
          <title id="plot-svg-title">异或四点分类区域</title>
          <desc id="plot-svg-desc">四个样本分布在坐标系四角，接入隐藏门后，左上或右下区域会被模型选中。</desc>
          <line class="gridline" x1="80" y1="85" x2="510" y2="85"/><line class="gridline" x1="80" y1="415" x2="510" y2="415"/>
          <line class="gridline" x1="130" y1="45" x2="130" y2="455"/><line class="gridline" x1="460" y1="45" x2="460" y2="455"/>
          <rect id="regionA" class="region" x="82" y="47" width="205" height="195" rx="8"/>
          <rect id="regionB" class="region" x="303" y="258" width="205" height="195" rx="8"/>
          <line class="axis" x1="56" y1="250" x2="534" y2="250"/><path d="M534 250l-12-7v14z" fill="var(--line)"/>
          <line class="axis" x1="295" y1="470" x2="295" y2="28"/><path d="M295 28l-7 12h14z" fill="var(--line)"/>
          <text class="axis-label" x="526" y="278">x₁</text><text class="axis-label" x="309" y="42">x₂</text>
          <text class="region-label" x="96" y="74">左上门区域</text><text class="region-label" x="318" y="286">右下门区域</text>
          <g transform="translate(130 415)"><circle id="p0" class="point" r="25"/><text id="pred0" class="point-pred" text-anchor="middle" y="6">0</text><text class="point-target" x="-42" y="45">(-1,-1) 目标0</text></g>
          <g transform="translate(130 85)"><circle id="p1" class="point" r="25"/><text id="pred1" class="point-pred" text-anchor="middle" y="6">0</text><text class="point-target" x="-42" y="45">(-1,1) 目标1</text></g>
          <g transform="translate(460 415)"><circle id="p2" class="point" r="25"/><text id="pred2" class="point-pred" text-anchor="middle" y="6">0</text><text class="point-target" x="-60" y="45">(1,-1) 目标1</text></g>
          <g transform="translate(460 85)"><circle id="p3" class="point" r="25"/><text id="pred3" class="point-pred" text-anchor="middle" y="6">0</text><text class="point-target" x="-58" y="45">(1,1) 目标0</text></g>
        </svg>
      </div>
      <div class="board-legend"><span><i class="legend-dot"></i>预测 0</span><span><i class="legend-dot pred"></i>预测 1</span><span>填充区 = 当前决策区域</span></div>
    </section>

    <section class="network-side min0" aria-labelledby="network-title">
      <div class="section-head"><h2 id="network-title">把局部门接入输出</h2><span class="section-note">任意顺序 · 可再次移除</span></div>
      <div class="network-board">
        <svg viewBox="0 0 850 500" aria-hidden="true">
          <path id="pathA" class="net-path off" d="M440 116 C540 116 560 180 678 217"/>
          <path id="pathB" class="net-path off" d="M440 274 C540 274 560 250 678 217"/>
          <path d="M665 210l17 7-14 12z" fill="var(--line)"/>
        </svg>
        <div id="slotA" class="slot slot-a" aria-hidden="true">插槽 A</div>
        <div id="slotB" class="slot slot-b" aria-hidden="true">插槽 B</div>
        <button class="gate gate-a" id="gateA" type="button" aria-pressed="false" aria-describedby="dragHelp">
          <span class="gate-name">左上门 <span class="gate-state">未接入</span></span>
          <span class="gate-rule">x₁ &lt; 0 且 x₂ &gt; 0 → 打开</span>
        </button>
        <button class="gate gate-b" id="gateB" type="button" aria-pressed="false" aria-describedby="dragHelp">
          <span class="gate-name">右下门 <span class="gate-state">未接入</span></span>
          <span class="gate-rule">x₁ &gt; 0 且 x₂ &lt; 0 → 打开</span>
        </button>
        <div class="output-node" aria-label="输出神经元，任一门打开就输出一">
          <strong>输出层</strong><span>任一门打开<br>→ 输出 1</span>
        </div>
        <p class="net-instruction" id="dragHelp">向右拖入插槽；向左拖出。键盘按 Enter 切换。</p>
      </div>
      <div class="status-row">
        <div class="score"><span class="score-copy">当前分类</span><strong class="score-value" id="score">2/4</strong></div>
        <div class="feedback" id="feedback" aria-live="polite"><strong>两道门都未接入</strong><span>四点都预测为 0；先选一块局部区域。</span></div>
        <button class="btn" id="reset" type="button">重置本页</button>
      </div>
    </section>
  </main>

  <footer class="footer-line">
    <div class="claim">输出层把两道门合并，就能得到一条直线无法圈出的分类区域。</div>
    <div class="next">下一问：一条新样本进入后，会怎样一站一站走到最终概率？</div>
  </footer>

  <script>
  window.addEventListener('load', () => {
    const stage = document.getElementById('stage');
    const gates = { A: document.getElementById('gateA'), B: document.getElementById('gateB') };
    const paths = { A: document.getElementById('pathA'), B: document.getElementById('pathB') };
    const regions = { A: document.getElementById('regionA'), B: document.getElementById('regionB') };
    const slots = { A: document.getElementById('slotA'), B: document.getElementById('slotB') };
    const scoreEl = document.getElementById('score');
    const feedbackEl = document.getElementById('feedback');
    const resetBtn = document.getElementById('reset');
    const aborter = new AbortController();
    let drag = null;
    let suppressClick = false;

    function makeInitialState(){
      return { phase:'ready', turn:0, connected:{A:false,B:false}, feedback:'initial', trace:[] };
    }
    let state = makeInitialState();

    function derive(s){
      const predictions = [0, s.connected.A ? 1 : 0, s.connected.B ? 1 : 0, 0];
      const targets = [0,1,1,0];
      const correct = predictions.reduce((n,v,i) => n + (v === targets[i] ? 1 : 0), 0);
      return { predictions, correct, complete:correct === 4 };
    }

    function transition(current, action){
      if(action.type === 'reset') return makeInitialState();
      if(action.type !== 'set' || !Object.prototype.hasOwnProperty.call(current.connected, action.gate)){
        return {...current, feedback:'invalid'};
      }
      if(current.connected[action.gate] === action.value){
        return {...current, feedback:action.value ? 'already-in' : 'already-out'};
      }
      const connected = {...current.connected, [action.gate]:action.value};
      const next = {...current, connected, turn:current.turn+1,
        feedback:(action.value ? 'connect-' : 'remove-') + action.gate,
        trace:[...current.trace, `${action.gate}:${action.value ? 'in':'out'}`].slice(-8)};
      next.phase = derive(next).complete ? 'complete' : 'playing';
      return next;
    }

    function feedbackCopy(s,d){
      if(d.complete) return ['两块局部区域已经合并','两块分开的区域，被“任一门打开就算 1”合在了一起。'];
      if(s.feedback === 'connect-A') return ['左上门已接入','左上样本改判为 1；再接入右下门。'];
      if(s.feedback === 'connect-B') return ['右下门已接入','右下样本改判为 1；再接入左上门。'];
      if(s.feedback === 'remove-A') return ['左上门已移除','左上区域不再输出 1；可以重新接入。'];
      if(s.feedback === 'remove-B') return ['右下门已移除','右下区域不再输出 1；可以重新接入。'];
      if(s.feedback === 'already-in') return ['这道门已经接入','向左拖出，或选择另一道门。'];
      return ['两道门都未接入','四点都预测为 0；先选一块局部区域。'];
    }

    function render(s){
      const d = derive(s);
      ['A','B'].forEach(key => {
        const on = s.connected[key];
        gates[key].classList.toggle('connected',on);
        gates[key].setAttribute('aria-pressed',String(on));
        gates[key].querySelector('.gate-state').textContent = on ? '已接入' : '未接入';
        slots[key].classList.toggle('filled',on);
        paths[key].classList.toggle('active',on);
        paths[key].classList.toggle('off',!on);
        regions[key].classList.toggle('on',on);
      });
      d.predictions.forEach((v,i) => {
        document.getElementById('pred'+i).textContent = v;
        document.getElementById('p'+i).classList.toggle('pred-one',v===1);
      });
      scoreEl.textContent = `已分对 ${d.correct}/4`;
      const copy = feedbackCopy(s,d);
      feedbackEl.innerHTML = `<strong>${copy[0]}</strong><span>${copy[1]}</span>`;
    }

    function act(action, focusKey){
      state = transition(state, action);
      render(state);
      if(focusKey) gates[focusKey].focus();
    }

    Object.entries(gates).forEach(([key,gate]) => {
      gate.addEventListener('click', () => {
        if(suppressClick){ suppressClick=false; return; }
        act({type:'set',gate:key,value:!state.connected[key]});
      }, {signal:aborter.signal});
      gate.addEventListener('pointerdown', e => {
        if(e.button !== undefined && e.button !== 0) return;
        const p = Deck.pt(gate,e);
        drag = {key,id:e.pointerId,startX:p.x,lastX:p.x,moved:false};
        gate.setPointerCapture(e.pointerId);
        gate.classList.add('dragging');
      }, {signal:aborter.signal});
      gate.addEventListener('pointermove', e => {
        if(!drag || drag.id !== e.pointerId || drag.key !== key) return;
        const p = Deck.pt(gate,e);
        drag.lastX=p.x;
        const dx=Math.max(-40,Math.min(40,p.x-drag.startX));
        drag.moved = drag.moved || Math.abs(dx)>6;
        const base=state.connected[key] ? 36 : 0;
        gate.style.transform=`translateX(${base+dx}px)`;
      }, {signal:aborter.signal});
      function finish(e){
        if(!drag || drag.id !== e.pointerId || drag.key !== key) return;
        const dx=drag.lastX-drag.startX;
        const moved=drag.moved;
        drag=null;
        gate.classList.remove('dragging');
        gate.style.transform='';
        suppressClick=moved;
        if(dx>18) act({type:'set',gate:key,value:true},key);
        else if(dx< -18) act({type:'set',gate:key,value:false},key);
      }
      gate.addEventListener('pointerup',finish,{signal:aborter.signal});
      gate.addEventListener('pointercancel', e => {
        if(drag && drag.id===e.pointerId){drag=null;gate.classList.remove('dragging');gate.style.transform='';}
      },{signal:aborter.signal});
    });

    resetBtn.addEventListener('click', () => { drag=null; state=transition(state,{type:'reset'}); render(state); gates.A.focus(); }, {signal:aborter.signal});
    function destroy(){ if(drag){drag=null;} aborter.abort(); }
    window.addEventListener('pagehide',destroy,{once:true});
    render(state);
    Deck.init({index:16,total:21});
  }, {once:true});
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
