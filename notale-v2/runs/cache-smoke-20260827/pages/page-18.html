<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="18" data-total="21">
<div id="stage">
  <style>
    #backprop-widget{display:flex;flex-direction:column;flex:1;min-height:0;gap:16px;color:var(--text)}
    #backprop-widget .page-head{flex:0 0 auto}
    #backprop-widget .kicker{margin:0 0 5px;color:var(--muted);font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em}
    #backprop-widget h1{margin:0;font:700 var(--fs-h1)/1.16 var(--font-sans);max-width:1250px}
    #backprop-widget .snapshot-note{margin:9px 0 0;color:var(--muted);font:var(--fs-sec)/1.35 var(--font-sans)}
    #backprop-widget .workbench{display:grid;grid-template-rows:minmax(0,1.45fr) minmax(0,.9fr);gap:14px;flex:1;min-height:0}
    #backprop-widget .network-wrap{position:relative;min-height:0;border:1px solid var(--line-soft);border-radius:14px;background:rgba(255,255,255,.16);overflow:hidden}
    #backprop-widget svg{display:block;width:100%;height:100%}
    #backprop-widget .forward{stroke:var(--line-soft);stroke-width:3;fill:none;marker-end:url(#bp-forward)}
    #backprop-widget .back{stroke:var(--line);stroke-width:2;fill:none;opacity:0}
    #backprop-widget .back.active{stroke:var(--focus);stroke-width:5;opacity:1;stroke-dasharray:10 7;animation:bp-flow .42s linear both}
    #backprop-widget .back.done{stroke:var(--model);stroke-width:5;opacity:1;stroke-dasharray:none}
    @keyframes bp-flow{from{stroke-dashoffset:-34}to{stroke-dashoffset:0}}
    #backprop-widget .node{fill:var(--paper);stroke:var(--line);stroke-width:2}
    #backprop-widget .node.model{stroke:var(--model);stroke-width:4}
    #backprop-widget .node.current{stroke:var(--focus);stroke-width:5}
    #backprop-widget .node-label{font:700 20px/1 var(--font-sans);fill:var(--text);text-anchor:middle;dominant-baseline:middle}
    #backprop-widget .node-value{font:700 16px/1 var(--font-mono);fill:var(--model);text-anchor:middle}
    #backprop-widget .param-box{fill:var(--panel-bg);stroke:var(--line-soft);stroke-width:1.5;rx:8}
    #backprop-widget .param-box.revealed{stroke:var(--model);stroke-width:2}
    #backprop-widget .param-box.selected{stroke:var(--focus);stroke-width:4}
    #backprop-widget .param-label{font:700 15px/1 var(--font-mono);fill:var(--text);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
    #backprop-widget .receipt-track{fill:rgba(75,74,70,.1)}
    #backprop-widget .receipt-bar{fill:var(--model);transform-box:fill-box;transform-origin:right center;transform:scaleX(0)}
    #backprop-widget .receipt-bar.open{transform:scaleX(1);transition:transform .28s ease-out}
    #backprop-widget .receipt-value{font:700 15px/1 var(--font-mono);fill:var(--text);text-anchor:end;opacity:0}
    #backprop-widget .receipt-value.open{opacity:1}
    #backprop-widget .station-label{font:700 15px/1 var(--font-sans);fill:var(--muted);text-anchor:middle}
    #backprop-widget .direction-label{font:15px/1 var(--font-sans);fill:var(--muted);text-anchor:middle}
    #backprop-widget .error-ruler{fill:url(#bp-hatch);stroke:var(--line);stroke-width:1.5}
    #backprop-widget .error-number{font:700 22px/1 var(--font-mono);fill:var(--model);text-anchor:middle}
    #backprop-widget .lower{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px;min-height:0}
    #backprop-widget .receipt-ledger{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;min-width:0}
    #backprop-widget .receipt-group{border-top:2px solid var(--line);padding:10px 12px 8px;min-width:0;background:rgba(255,255,255,.11)}
    #backprop-widget .receipt-group h2{margin:0 0 8px;font:700 var(--fs-sec)/1.2 var(--font-sans)}
    #backprop-widget .change-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:31px;color:var(--muted);font:var(--fs-label)/1.2 var(--font-sans)}
    #backprop-widget .change-row strong{color:var(--text);font-family:var(--font-mono)}
    #backprop-widget .change-row.is-new{color:var(--focus)}
    #backprop-widget .dash{color:var(--line-soft)}
    #backprop-widget .control-panel{display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:14px 16px;border:1px solid var(--line-soft);border-radius:14px;background:var(--panel-bg);min-width:0}
    #backprop-widget .step-status{margin:0;color:var(--muted);font:var(--fs-label)/1.3 var(--font-sans)}
    #backprop-widget .step-status strong{display:block;margin-top:3px;color:var(--text);font:700 var(--fs-body)/1.3 var(--font-sans)}
    #backprop-widget .selected-readout{min-height:75px;border-top:1px solid var(--line-soft);padding-top:9px}
    #backprop-widget .selected-name{font:700 var(--fs-body)/1.2 var(--font-mono)}
    #backprop-widget .selected-value{margin-top:4px;color:var(--model);font:700 var(--fs-body)/1.25 var(--font-sans)}
    #backprop-widget .explain{margin:5px 0 0;color:var(--muted);font:var(--fs-sec)/1.35 var(--font-sans)}
    #backprop-widget .controls{display:flex;gap:10px;align-items:center}
    #backprop-widget .controls .btn:first-child{flex:1}
    #backprop-widget .conclusion{display:flex;align-items:baseline;justify-content:space-between;gap:26px;flex:0 0 auto;border-top:1px solid var(--line-soft);padding-top:12px}
    #backprop-widget .claim{margin:0;max-width:1040px;font:700 20px/1.4 var(--font-serif)}
    #backprop-widget .next{margin:0;color:var(--muted);font:var(--fs-sec)/1.35 var(--font-sans);text-align:right;max-width:370px}
    #backprop-widget button.param-hit{cursor:pointer;outline:none}
    #backprop-widget button.param-hit:focus-visible + rect{stroke:var(--focus);stroke-width:4}
    @media(prefers-reduced-motion:reduce){#backprop-widget .back.active{animation:none}#backprop-widget .receipt-bar.open{transition:none}}
  </style>

  <main id="backprop-widget" class="k-process min0" aria-labelledby="bp-title">
    <header class="page-head">
      <p class="kicker">BACKWARD PASS</p>
      <h1 id="bp-title">误差从终点出发，把改动责任逐层送回每个参数</h1>
      <p class="snapshot-note">这是同一次预测的回传快照：x₁=1.00，x₂=0.50，h₁=0.80，h₂=0.20，ŷ=0.80，正确答案 t=0。</p>
    </header>

    <section class="workbench min0" aria-label="反向传播责任追踪器">
      <div class="network-wrap min0 no-pan">
        <svg id="bp-svg" viewBox="0 0 1480 382" role="img" aria-labelledby="bp-svg-title bp-svg-desc">
          <title id="bp-svg-title">从误差端逐层回传责任的神经网络</title>
          <desc id="bp-svg-desc">前向计算从左到右。点击回传下一站后，责任沿同一组连接从右向左到达输出层参数、隐藏神经元和输入侧参数。</desc>
          <defs>
            <marker id="bp-forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--line-soft)"></path></marker>
            <pattern id="bp-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="var(--paper)"></rect><line x1="0" y1="0" x2="0" y2="8" stroke="var(--line)" stroke-width="3"></line></pattern>
          </defs>
        </svg>
      </div>

      <div class="lower min0">
        <div class="receipt-ledger min0" aria-label="已收到的责任收据">
          <section class="receipt-group"><h2>输出层参数</h2><div data-list="output"></div></section>
          <section class="receipt-group"><h2>隐藏层节点</h2><div data-list="hidden"></div></section>
          <section class="receipt-group"><h2>输入侧参数</h2><div data-list="input"></div></section>
        </div>
        <aside class="control-panel">
          <p class="step-status">当前站 <strong id="bp-step-label">输出端：误差 1.609</strong></p>
          <div class="selected-readout" aria-live="polite">
            <div class="selected-name" id="bp-selected-name">当前误差</div>
            <div class="selected-value" id="bp-selected-value">责任 1.609 · 开始回传</div>
            <p class="explain" id="bp-explain">沿原连接向左追踪，查看谁更影响这次误差。</p>
          </div>
          <div class="controls btns">
            <button class="btn" id="bp-next" type="button">回传下一站</button>
            <button class="btn" id="bp-reset" type="button">重置本页</button>
          </div>
        </aside>
      </div>
    </section>

    <footer class="conclusion">
      <p class="claim">反向传播不是把答案倒着播放，而是计算每个参数对当前误差影响多大、该增还是该减。</p>
      <p class="next">当所有参数都收到建议并反复更新，分类边界会怎样变化？</p>
    </footer>
  </main>
  <script src="assets/lib/d3.min.js"></script>
  <script>
  (() => {
    const root = document.getElementById('backprop-widget');
    if (!root || !window.d3) return;
    const svg = d3.select(root.querySelector('#bp-svg'));
    const nextBtn = root.querySelector('#bp-next');
    const resetBtn = root.querySelector('#bp-reset');
    const stepLabel = root.querySelector('#bp-step-label');
    const selectedName = root.querySelector('#bp-selected-name');
    const selectedValue = root.querySelector('#bp-selected-value');
    const explain = root.querySelector('#bp-explain');
    const initial = () => ({ step:0, selected:'error', animating:false, replaying:false });
    let state = initial();
    let timers = [];
    let destroyed = false;

    const nodes = [
      {id:'x1',x:115,y:115,label:'x₁',value:'1.00'}, {id:'x2',x:115,y:278,label:'x₂',value:'0.50'},
      {id:'h1',x:600,y:115,label:'h₁',value:'0.80'}, {id:'h2',x:600,y:278,label:'h₂',value:'0.20'},
      {id:'y',x:1045,y:196,label:'ŷ',value:'0.80'}, {id:'error',x:1362,y:196,label:'误差',value:'1.609'}
    ];
    const links = [
      {id:'x1h1',a:'x1',b:'h1',stage:3},{id:'x2h1',a:'x2',b:'h1',stage:3},
      {id:'x1h2',a:'x1',b:'h2',stage:3},{id:'x2h2',a:'x2',b:'h2',stage:3},
      {id:'h1y',a:'h1',b:'y',stage:2},{id:'h2y',a:'h2',b:'y',stage:2},{id:'ye',a:'y',b:'error',stage:1}
    ];
    const receipts = [
      {id:'bout',stage:1,group:'output',label:'b_out',value:0.800,direction:'减小',x:905,y:42},
      {id:'v1',stage:1,group:'output',label:'v₁',value:0.640,direction:'减小',x:815,y:100},
      {id:'v2',stage:1,group:'output',label:'v₂',value:0.160,direction:'减小',x:815,y:274},
      {id:'h1r',stage:2,group:'hidden',label:'h₁',value:0.192,direction:'继续向左分配',x:520,y:42},
      {id:'h2r',stage:2,group:'hidden',label:'h₂',value:0.064,direction:'继续向左分配',x:520,y:332},
      {id:'w11',stage:3,group:'input',label:'w₁₁',value:0.192,direction:'减小',x:300,y:82},
      {id:'w21',stage:3,group:'input',label:'w₂₁',value:0.096,direction:'减小',x:300,y:144},
      {id:'w12',stage:3,group:'input',label:'w₁₂',value:0.064,direction:'减小',x:300,y:240},
      {id:'w22',stage:3,group:'input',label:'w₂₂',value:0.032,direction:'减小',x:300,y:302}
    ];
    const nodeMap = new Map(nodes.map(d => [d.id,d]));
    const stationNames = ['输出端：误差 1.609','输出层：分给 v₁、v₂ 与 b_out','隐藏层：h₁ 与 h₂ 收到责任','输入侧：四个权重都收到建议'];

    const fg = svg.append('g');
    fg.selectAll('line').data(links).join('line').attr('class','forward')
      .attr('x1',d=>nodeMap.get(d.a).x+36).attr('y1',d=>nodeMap.get(d.a).y)
      .attr('x2',d=>nodeMap.get(d.b).x-42).attr('y2',d=>nodeMap.get(d.b).y);

    const bg = svg.append('g');
    bg.selectAll('line').data(links).join('line').attr('class','back').attr('data-stage',d=>d.stage)
      .attr('x1',d=>nodeMap.get(d.b).x-45).attr('y1',d=>nodeMap.get(d.b).y)
      .attr('x2',d=>nodeMap.get(d.a).x+42).attr('y2',d=>nodeMap.get(d.a).y);

    const ng = svg.append('g').selectAll('g').data(nodes).join('g').attr('transform',d=>`translate(${d.x},${d.y})`);
    ng.append('circle').attr('r',36).attr('class',d=>`node ${d.id==='y'?'model':''}`);
    ng.append('text').attr('class','node-label').attr('y',-3).text(d=>d.label);
    ng.append('text').attr('class','node-value').attr('y',58).text(d=>d.value);

    svg.append('text').attr('class','station-label').attr('x',115).attr('y',24).text('输入');
    svg.append('text').attr('class','station-label').attr('x',600).attr('y',24).text('隐藏层');
    svg.append('text').attr('class','station-label').attr('x',1045).attr('y',24).text('输出');
    svg.append('text').attr('class','station-label').attr('x',1362).attr('y',24).text('输出端');
    svg.append('text').attr('class','direction-label').attr('x',740).attr('y',372).text('前向计算 →　　← 责任建议');
    svg.append('rect').attr('class','error-ruler').attr('x',1329).attr('y',247).attr('width',66).attr('height',74).attr('rx',4);
    svg.append('text').attr('class','error-number').attr('x',1362).attr('y',350).text('1.609');

    const rg = svg.append('g').selectAll('g').data(receipts).join('g').attr('transform',d=>`translate(${d.x},${d.y})`).style('opacity',0).attr('data-receipt',d=>d.id);
    rg.append('rect').attr('class','param-box').attr('x',0).attr('y',0).attr('width',78).attr('height',32).attr('rx',8);
    rg.append('text').attr('class','param-label').attr('x',39).attr('y',16).text(d=>d.label);
    rg.append('rect').attr('class','receipt-track').attr('x',84).attr('y',7).attr('width',220).attr('height',18).attr('rx',4);
    rg.append('rect').attr('class','receipt-bar').attr('x',d=>304-(d.value/0.8*220)).attr('y',7).attr('width',d=>d.value/0.8*220).attr('height',18).attr('rx',4);
    rg.append('text').attr('class','receipt-value').attr('x',300).attr('y',-4).text(d=>d.value.toFixed(3));
    rg.append('rect').attr('class','param-hit').attr('x',0).attr('y',0).attr('width',304).attr('height',32).attr('fill','transparent').attr('tabindex',0).attr('role','button').attr('aria-label',d=>`${d.label}，责任 ${d.value.toFixed(3)}，${d.direction}`)
      .on('click',(_,d)=>selectReceipt(d.id,true)).on('keydown',(e,d)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();selectReceipt(d.id,true)}});

    const lists = {output:root.querySelector('[data-list="output"]'),hidden:root.querySelector('[data-list="hidden"]'),input:root.querySelector('[data-list="input"]')};
    receipts.forEach(r=>{
      const row=document.createElement('div'); row.className='change-row'; row.dataset.row=r.id;
      row.innerHTML=`<strong>${r.label}</strong><span class="dash">待回传</span>`;
      lists[r.group].appendChild(row);
    });

    function clearWork(){
      timers.forEach(clearTimeout); timers=[];
      svg.selectAll('*').interrupt();
    }
    function selectReceipt(id,announce=false){
      const r=receipts.find(d=>d.id===id);
      if(!r || r.stage>state.step || state.animating) return;
      state.selected=id;
      render();
      if(announce) selectedValue.setAttribute('aria-label',`${r.label}，责任 ${r.value.toFixed(3)}，建议${r.direction}`);
    }
    function render(){
      const selected=receipts.find(d=>d.id===state.selected);
      stepLabel.textContent=stationNames[state.step];
      nextBtn.textContent=state.step===3?'再看一次':'回传下一站';
      nextBtn.disabled=state.animating;
      bg.selectAll('line').attr('class',d=>`back ${d.stage<state.step?'done':d.stage===state.step&&state.step>0?'active':''}`);
      ng.select('circle').attr('class',d=>`node ${d.id==='y'?'model':''} ${((state.step===0&&d.id==='error')||(state.step===1&&d.id==='y')||(state.step===2&&(d.id==='h1'||d.id==='h2'))||(state.step===3&&(d.id==='x1'||d.id==='x2')))?'current':''}`);
      rg.style('opacity',d=>d.stage<=state.step?1:0).attr('aria-hidden',d=>d.stage<=state.step?null:'true');
      rg.select('.param-box').attr('class',d=>`param-box ${d.stage<=state.step?'revealed':''} ${d.id===state.selected?'selected':''}`);
      rg.select('.receipt-bar').attr('class',d=>`receipt-bar ${d.stage<=state.step?'open':''}`);
      rg.select('.receipt-value').attr('class',d=>`receipt-value ${d.stage<=state.step?'open':''}`);
      receipts.forEach(r=>{
        const row=root.querySelector(`[data-row="${r.id}"]`);
        const open=r.stage<=state.step;
        row.classList.toggle('is-new',open&&r.stage===state.step);
        row.innerHTML=open?`<strong>${r.label}</strong><span>收到 ${r.value.toFixed(3)} → ${r.direction}</span>`:`<strong>${r.label}</strong><span class="dash">待回传</span>`;
      });
      if(selected){
        selectedName.textContent=selected.label;
        selectedValue.textContent=`责任 ${selected.value.toFixed(3)} · 建议${selected.direction}`;
        explain.textContent='责任越大，表示这个旋钮轻转一点，对当前误差的影响越强。';
      }else{
        selectedName.textContent='当前误差';
        selectedValue.textContent='责任 1.609 · 开始回传';
        explain.textContent='沿原连接向左追踪，查看谁更影响这次误差。';
      }
    }
    function advance(announce=true){
      if(destroyed || state.animating || state.step>=3) return;
      state={...state,step:state.step+1,selected:null,animating:true};
      render();
      const arriving=receipts.filter(r=>r.stage===state.step);
      timers.push(setTimeout(()=>{
        if(destroyed)return;
        state={...state,selected:arriving[0].id,animating:false};
        render();
        if(announce) selectedValue.setAttribute('aria-label',`${stationNames[state.step]}。已显示 ${arriving.length} 张责任收据。`);
      },420+Math.max(0,arriving.length-1)*120+280));
    }
    function reset(announce=true){
      clearWork(); state=initial(); render();
      if(announce) selectedValue.setAttribute('aria-label','已重置到输出端误差。');
    }
    function replay(){
      reset(false); state={...state,replaying:true}; render();
      [180,1350,2520].forEach((delay,i)=>timers.push(setTimeout(()=>{advance(i===2);},delay)));
    }
    function onNext(){state.step===3?replay():advance(true)}
    function onReset(){reset(true)}
    nextBtn.addEventListener('click',onNext); resetBtn.addEventListener('click',onReset);
    render();
    root.destroyBackpropWidget=()=>{
      if(destroyed)return; destroyed=true; clearWork();
      nextBtn.removeEventListener('click',onNext); resetBtn.removeEventListener('click',onReset);
      delete root.destroyBackpropWidget;
    };
  })();
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
