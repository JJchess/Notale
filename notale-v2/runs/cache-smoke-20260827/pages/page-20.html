<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="20" data-total="21">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;gap:0;overflow:hidden}
    .page-head{height:100px;flex:0 0 100px;display:flex;flex-direction:column;justify-content:flex-start;border-bottom:1px solid var(--line-soft)}
    .kicker{font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.12em;color:var(--muted);margin:0 0 8px}
    h1{font:700 var(--fs-h1)/1.15 var(--font-sans);margin:0;color:var(--text)}
    .loop-ledger{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:18px}
    .question{height:78px;flex:0 0 78px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 32px;border-radius:8px;position:relative}
    .ledger-label{position:absolute;left:18px;top:50%;transform:translateY(-50%);font:650 var(--fs-label)/1.2 var(--font-sans);letter-spacing:.04em;color:var(--muted)}
    .question p{margin:0;font:650 var(--fs-lead)/1.35 var(--font-sans);color:var(--text)}
    .question .prompt-mark{display:inline-block;width:10px;height:10px;margin-right:14px;background:var(--focus);vertical-align:2px}
    .merge-field{position:relative;flex:1;min-height:0;margin-top:12px;border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
    .flow-lines{position:absolute;inset:0;width:100%;height:100%;z-index:0;overflow:visible}
    .op-label{position:absolute;left:0;top:10px;z-index:2;font:650 var(--fs-label)/1.2 var(--font-sans);color:var(--muted);letter-spacing:.04em}
    .mechanisms{position:absolute;left:0;right:0;top:58px;height:150px;display:grid;grid-template-columns:1fr 1fr 1fr;z-index:1;background:var(--panel-bg);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
    .mechanism{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 34px;text-align:center;background:transparent}
    .mechanism + .mechanism{border-left:1px solid var(--line-soft)}
    .mechanism .role{font:700 var(--fs-h2)/1.2 var(--font-sans);color:var(--text);margin:0 0 12px}
    .mechanism .meaning{font:500 var(--fs-body)/1.35 var(--font-sans);color:var(--muted);margin:0}
    .mechanism .direction{display:flex;align-items:center;gap:10px;margin-bottom:10px;font:650 var(--fs-label)/1.2 var(--font-sans);color:var(--line)}
    .direction svg{width:94px;height:16px;display:block}
    .contribs{position:absolute;left:0;right:0;top:214px;z-index:2;display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;pointer-events:none}
    .contribs span{justify-self:center;padding:3px 10px;background:var(--bg);font:650 var(--fs-label)/1.2 var(--font-sans);color:var(--muted)}
    .merge-label{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:12px;padding:8px 18px;background:var(--bg);font:700 var(--fs-body)/1.25 var(--font-sans);white-space:nowrap;color:var(--text)}
    .merge-label .join{width:12px;height:12px;background:var(--focus);transform:rotate(45deg)}
    .readout{height:132px;flex:0 0 132px;display:grid;grid-template-columns:1.18fr .82fr;align-items:center;gap:38px;padding:20px 28px;border-radius:8px}
    .change-wrap{min-width:0}
    .readout-label{margin:0 0 10px;font:650 var(--fs-label)/1.25 var(--font-sans);color:var(--muted);letter-spacing:.04em}
    .change-row{display:grid;grid-template-columns:auto auto minmax(90px,1fr) auto;align-items:center;gap:14px;min-width:0}
    .every{font:700 var(--fs-h2)/1.2 var(--font-sans);white-space:nowrap;color:var(--text)}
    .state{font:700 var(--fs-lead)/1 var(--font-mono);white-space:nowrap;padding:12px 18px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
    .update-arrow{height:3px;background:var(--model);position:relative;min-width:90px}
    .update-arrow:after{content:"";position:absolute;right:-1px;top:-7px;border-left:13px solid var(--model);border-top:8px solid transparent;border-bottom:8px solid transparent}
    .repeat{min-width:0;border-left:1px solid var(--line-soft);padding-left:34px}
    .repeat p{margin:0;font:650 var(--fs-body)/1.45 var(--font-sans);color:var(--text)}
    .repeat .loop-note{display:block;margin-top:5px;color:var(--muted);font-weight:500}
    .closing{height:88px;flex:0 0 88px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:44px;border-top:1px solid var(--line-soft)}
    .claim{margin:0;font:700 var(--fs-lead)/1.4 var(--font-serif);color:var(--text)}
    .next{margin:0;font:650 var(--fs-sec)/1.35 var(--font-sans);color:var(--muted);white-space:nowrap}
    .next b{color:var(--text);font-weight:700}
  </style>

  <header class="page-head">
    <p class="kicker">FULL TRAINING LOOP</p>
    <h1>一次完整学习，要把三种改动建议合到一起</h1>
  </header>

  <main class="loop-ledger ledger k-generalization min0" aria-label="一次完整学习的三项机制">
    <section class="panel q question" aria-label="问题">
      <span class="ledger-label">问题</span>
      <p><span class="prompt-mark" aria-hidden="true"></span>一次完整学习，怎样决定每个参数怎么改？</p>
    </section>

    <section class="merge-field min0" aria-label="三项建议汇合为一次更新">
      <div class="op-label">操作 · 三项建议同时参与</div>
      <svg class="flow-lines" viewBox="0 0 1488 330" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <marker id="arrow-neutral" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L9,4.5 L0,9 Z" fill="#4B4A46"></path>
          </marker>
        </defs>
        <path d="M744 0 V34 M238 34 H1250" fill="none" stroke="#4B4A46" stroke-width="3"/>
        <path d="M238 34 V67 M744 34 V67 M1250 34 V67" fill="none" stroke="#4B4A46" stroke-width="3" marker-end="url(#arrow-neutral)"/>
        <path d="M238 214 V248 Q238 267 258 267 H724 Q744 267 744 287" fill="none" stroke="#4B4A46" stroke-width="3" marker-end="url(#arrow-neutral)"/>
        <path d="M744 214 V287" fill="none" stroke="#4B4A46" stroke-width="3" marker-end="url(#arrow-neutral)"/>
        <path d="M1250 214 V248 Q1250 267 1230 267 H764 Q744 267 744 287" fill="none" stroke="#4B4A46" stroke-width="3" marker-end="url(#arrow-neutral)"/>
      </svg>

      <div class="mechanisms">
        <article class="mechanism">
          <p class="role">误差给方向</p>
          <p class="meaning">往哪边改</p>
        </article>
        <article class="mechanism">
          <p class="role">学习率定步长</p>
          <p class="meaning">一次改多少</p>
        </article>
        <article class="mechanism">
          <div class="direction">
            <span>各参数</span>
            <svg viewBox="0 0 94 16" aria-hidden="true"><path d="M92 8H8 M8 8l10-6 M8 8l10 6" fill="none" stroke="#4B4A46" stroke-width="3"/></svg>
            <span>输出端</span>
          </div>
          <p class="role">反向传播分责任</p>
          <p class="meaning">每个参数各改多少</p>
        </article>
      </div>
      <div class="contribs" aria-hidden="true"><span>方向</span><span>步长</span><span>责任</span></div>
      <div class="merge-label"><span class="join" aria-hidden="true"></span>三条建议合成一次更新</div>
    </section>

    <section class="panel readout" aria-label="参数更新读数">
      <div class="change-wrap min0">
        <p class="readout-label">读数</p>
        <div class="change-row">
          <span class="every">每个参数：</span>
          <span class="state">改前</span>
          <span class="update-arrow" aria-hidden="true"></span>
          <span class="state">改后</span>
        </div>
      </div>
      <div class="repeat min0">
        <p>用新参数再预测<span class="loop-note">再量误差，再小改一步</span></p>
      </div>
    </section>
  </main>

  <footer class="closing">
    <p class="claim">误差给方向，学习率定步长，反向传播把责任送到每个参数。</p>
    <p class="next"><b>下一问</b>　当别人说“AI 学会了”，你还该追问什么？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
