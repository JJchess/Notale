<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="21" data-total="21">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;gap:0;overflow:hidden}
    .p21-head{height:104px;flex:0 0 104px;display:flex;flex-direction:column;justify-content:flex-start;gap:7px}
    .p21-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--muted)}
    .p21-head h1{margin:0;font:700 var(--fs-h1)/1.18 var(--font-sans);color:var(--text)}
    .p21-main{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
    .p21-map{position:relative;width:100%;height:548px;flex:0 0 548px}
    .p21-root{position:absolute;z-index:2;left:50%;top:8px;transform:translateX(-50%);width:378px;height:104px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line);background:var(--panel-bg);border-radius:12px}
    .p21-root .root-label{font:600 var(--fs-label)/1.2 var(--font-sans);color:var(--muted);position:absolute;top:14px;left:0;right:0}
    .p21-root strong{padding-top:20px;font:700 32px/1.2 var(--font-serif);color:var(--text)}
    .p21-lines{position:absolute;z-index:0;inset:0;width:100%;height:100%;overflow:visible}
    .p21-lines path,.p21-lines line{fill:none;stroke:var(--line);stroke-width:2;vector-effect:non-scaling-stroke}
    .p21-lines circle{fill:var(--paper);stroke:var(--line);stroke-width:2;vector-effect:non-scaling-stroke}
    .p21-branches{position:absolute;z-index:1;left:0;right:0;top:216px;height:294px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:32px}
    .p21-branch{position:relative;min-width:0;padding:34px 18px 18px;border-top:2px solid var(--line);display:flex;flex-direction:column;align-items:flex-start}
    .p21-branch:not(:first-child)::before{content:"";position:absolute;left:-17px;top:42px;bottom:16px;border-left:1px solid var(--line-soft)}
    .p21-dot{position:absolute;top:-8px;left:50%;width:14px;height:14px;transform:translateX(-50%);border-radius:50%;background:var(--paper);border:2px solid var(--line)}
    .p21-branch .tag{margin-bottom:17px;color:var(--text);border-color:var(--line);background:transparent;font-weight:700}
    .p21-question{margin:0 0 17px;font:700 var(--fs-h2)/1.35 var(--font-sans);color:var(--text)}
    .p21-check{margin:0;padding-top:14px;border-top:1px solid var(--line-soft);font:400 var(--fs-body)/1.55 var(--font-sans);color:var(--muted)}
    .p21-check b{display:block;margin-bottom:4px;font:600 var(--fs-label)/1.3 var(--font-sans);letter-spacing:.06em;color:var(--text)}
    .p21-warning{width:1040px;min-height:62px;display:flex;align-items:center;justify-content:center;gap:22px;border-top:2px solid var(--text);border-bottom:2px solid var(--text);font:700 var(--fs-lead)/1.35 var(--font-sans);color:var(--text)}
    .p21-warning .neq{font:700 32px/1 var(--font-serif)}
    .p21-foot{height:132px;flex:0 0 132px;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:center;column-gap:54px;border-top:1px solid var(--line-soft)}
    .p21-conclusion{margin:0;font:600 var(--fs-lead)/1.48 var(--font-serif);color:var(--text)}
    .p21-next{margin:0;padding-left:28px;border-left:1px solid var(--line);font:500 var(--fs-body)/1.45 var(--font-sans);color:var(--text)}
    .p21-next span{display:block;margin-bottom:5px;font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.08em;color:var(--muted)}
  </style>

  <header class="p21-head">
    <div class="p21-kicker">TRANSFER CHECK</div>
    <h1>听到“AI 学会了”，先问四件事</h1>
  </header>

  <main class="p21-main min0">
    <section class="p21-map k-classification" aria-label="检查 AI 是否学会的四类证据">
      <div class="p21-root panel q">
        <span class="root-label">待检查的说法</span>
        <strong>“AI 学会了”</strong>
      </div>

      <svg class="p21-lines" viewBox="0 0 1488 548" aria-hidden="true">
        <path d="M744 112 V160 H174 V216 M744 160 H1314 V216"/>
        <line x1="554" y1="160" x2="554" y2="216"/>
        <line x1="934" y1="160" x2="934" y2="216"/>
        <circle cx="744" cy="160" r="6"/>
      </svg>

      <div class="p21-branches">
        <article class="p21-branch min0">
          <span class="p21-dot" aria-hidden="true"></span>
          <span class="tag">数据</span>
          <h2 class="p21-question">它看过什么数据？</h2>
          <p class="p21-check"><b>检查</b>样本来自哪里，缺了谁或什么情形？</p>
        </article>

        <article class="p21-branch min0">
          <span class="p21-dot" aria-hidden="true"></span>
          <span class="tag">误差</span>
          <h2 class="p21-question">什么算“做错”？</h2>
          <p class="p21-check"><b>检查</b>正确答案与误差标尺怎样规定？</p>
        </article>

        <article class="p21-branch min0">
          <span class="p21-dot" aria-hidden="true"></span>
          <span class="tag">可改参数</span>
          <h2 class="p21-question">学习时哪些数字能改？</h2>
          <p class="p21-check"><b>检查</b>哪些权重、偏置真正接受了改动？</p>
        </article>

        <article class="p21-branch min0">
          <span class="p21-dot" aria-hidden="true"></span>
          <span class="tag">新数据表现</span>
          <h2 class="p21-question">没见过的数据上还有效吗？</h2>
          <p class="p21-check"><b>检查</b>不只看训练误差，还要看新情形中的表现。</p>
        </article>
      </div>
    </section>

    <div class="p21-warning" role="note" aria-label="现实可靠性提醒">
      <span>训练误差下降</span><span class="neq">≠</span><span>面对现实就一定可靠</span>
    </div>
  </main>

  <footer class="p21-foot">
    <p class="p21-conclusion">“学会”不是终点结论，而是一组可检查的证据；训练误差下降不等于现实可靠。</p>
    <p class="p21-next"><span>下一问</span>如果环境、群体或目标变了，它还会做对吗？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
