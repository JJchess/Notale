<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F6F1E7;--text:#2D241F;--font-sans:"Noto Sans SC",system-ui,sans-serif;--coffee:#5A351F;--focus:#F2A900;--ink-soft:#786c63;--line:#cfc4b7}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text)}
#stage{height:900px;padding:28px 56px;display:flex;flex-direction:column;overflow:hidden}
.header{height:132px;flex:0 0 132px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;padding-top:6px}
.kicker{margin:0 0 12px;font:700 var(--fs-label)/1.2 var(--font-sans);letter-spacing:.14em;color:var(--coffee)}
h1{margin:0;font:700 var(--fs-h1)/1.16 var(--font-serif);letter-spacing:.015em}.header-mark{margin-top:12px;width:94px;height:12px;border-top:3px solid var(--coffee);border-bottom:1px solid var(--coffee)}
.hero{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:24px}
.claim{margin:0;max-width:780px;font:var(--fs-lead)/1.52 var(--font-sans);color:#4e433d}
.chain-field{position:relative;flex:1;min-height:0;margin-top:12px;display:flex;align-items:center}
.chain-title{position:absolute;top:24px;left:0;margin:0;font:700 var(--fs-h2)/1.2 var(--font-serif);color:var(--coffee)}
.chain-title span{font:var(--fs-label)/1 var(--font-sans);letter-spacing:.12em;margin-left:14px;color:var(--ink-soft)}
.flow{position:relative;width:100%;height:520px;margin-top:38px;display:grid;grid-template-columns:1fr 1fr 1fr 1.25fr;align-items:center;background:linear-gradient(90deg,transparent 1%,rgba(90,53,31,.14) 8%,rgba(90,53,31,.14) 89%,transparent 97%)}
.flow:before{content:"";position:absolute;left:7%;right:11%;top:145px;height:154px;border-top:1px solid rgba(90,53,31,.25);border-bottom:1px solid rgba(90,53,31,.25)}
.flow-line{position:absolute;left:8%;right:13%;top:221px;width:79%;height:45px;z-index:0;overflow:visible}.flow-line path{stroke:var(--coffee);stroke-width:5;fill:none}.flow-line marker path{fill:var(--coffee)}
.stage-node{z-index:1;position:relative;height:470px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:1;transform:none;animation:reveal .18s ease-out forwards}.stage-node:nth-of-type(2){animation-delay:.12s}.stage-node:nth-of-type(3){animation-delay:.24s}.stage-node:nth-of-type(4){animation-delay:.36s}.stage-node:nth-of-type(5){animation-delay:.48s}
.tag{align-self:center;margin-bottom:21px;padding:5px 10px;border:1px solid var(--coffee);border-radius:0;background:var(--bg);font:700 var(--fs-label)/1 var(--font-sans);letter-spacing:.08em;color:var(--coffee)}
.object{height:290px;width:290px;display:flex;align-items:center;justify-content:center}.seed-shape{width:82px;height:154px;background:var(--coffee);border-radius:55% 45% 48% 52% / 62% 42% 58% 38%;position:relative;transform:rotate(-28deg)}.seed-shape:after{content:"";position:absolute;left:36px;top:14px;width:5px;height:124px;background:#e9d8c4;border-radius:5px;transform:rotate(3deg)}
.cherry{width:202px;height:202px;border-radius:50%;background:var(--coffee);position:relative}.cherry:before{content:"";position:absolute;width:67px;height:39px;left:125px;top:-23px;border-top:4px solid var(--coffee);border-radius:50%;transform:rotate(-30deg)}.cherry:after{content:"";position:absolute;width:48px;height:24px;left:150px;top:-41px;border-radius:100% 0;background:#8c8a65;transform:rotate(15deg)}
.bean-pair{position:relative;width:260px;height:240px}.bean{position:absolute;width:120px;height:198px;border-radius:52% 48% 48% 52% / 62% 45% 55% 38%;background:var(--coffee);transform:rotate(-25deg)}.bean:after{content:"";position:absolute;left:53px;top:15px;width:7px;height:158px;background:#d8b58b;border-radius:50%;transform:rotate(2deg)}.bean.b2{left:110px;top:30px;transform:rotate(27deg)}
.cup-node .tag{border-color:var(--focus);color:#6c4b10}.cup-node .object{width:390px;height:390px;margin-top:-82px}.cup-node img{width:390px;height:390px;object-fit:contain}.cup-node:after{content:"";position:absolute;top:343px;width:252px;height:1px;background:var(--coffee)}
.label{margin:11px 0 0;font:var(--fs-sec)/1.35 var(--font-sans);color:var(--ink-soft)}.label small{font-size:var(--fs-label);line-height:1.4}.cup-node .label{margin-top:-68px;color:var(--coffee);font-weight:700}
.footer{height:100px;flex:0 0 100px;display:flex;align-items:flex-end;justify-content:space-between;border-top:1px solid var(--line);padding:17px 0 1px}.question{margin:0;font:700 var(--fs-body)/1.4 var(--font-sans);max-width:760px}.prompt{margin:0;font:var(--fs-label)/1.4 var(--font-sans);color:var(--ink-soft);text-align:right;max-width:330px}.prompt b{color:var(--coffee)}
@keyframes reveal{from{opacity:1;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}@media(prefers-reduced-motion:reduce){.stage-node{animation:none;opacity:1;transform:none}}
</style>
</head>
<body data-page="01" data-total="22">
<div id="stage">
  <header class="header">
    <div><p class="kicker">CHAPTER I · TRACE THE CUP</p><h1>一杯咖啡，是一条全球链条</h1></div><div class="header-mark" aria-hidden="true"></div>
  </header>
  <main class="hero min0">
    <p class="claim">从种子、果实、豆子到杯子，每一环都参与决定最后的一口。</p>
    <section class="chain-field k-generalization min0" aria-label="从种子到杯子的物料链">
      <h2 class="chain-title">全球链条 <span>ONE TRACEABLE MATERIAL FLOW</span></h2>
      <div class="flow min0">
        <svg class="flow-line" viewBox="0 0 1200 45" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker></defs><path d="M50 22 H330" marker-end="url(#arrow)"/><path d="M400 22 H680" marker-end="url(#arrow)"/><path d="M750 22 H1080" marker-end="url(#arrow)"/></svg>
        <article class="stage-node"><div class="tag">种子</div><div class="object"><div class="seed-shape"></div></div><p class="label">一粒开始<br><small>同一份物料</small></p></article>
        <article class="stage-node"><div class="tag">果实</div><div class="object"><div class="cherry"></div></div><p class="label">一颗成熟<br><small>同一份物料</small></p></article>
        <article class="stage-node"><div class="tag">豆子</div><div class="object"><div class="bean-pair"><i class="bean"></i><i class="bean b2"></i></div></div><p class="label">一份可冲煮的物料<br><small>同一份物料</small></p></article>
        <article class="stage-node cup-node"><div class="tag">杯子</div><div class="object"><img src="assets/img/coffee-cup-topview.png" title="生成插画（非真实照片）" alt="俯视的一杯咖啡"></div><p class="label">日常的一口<br><small>同一份物料</small></p></article>
      </div>
    </section>
  </main>
  <footer class="footer"><p class="question">如果只知道产地国名，能猜出它喝起来像什么吗？</p><p class="prompt"><b>沿着这条线看</b><br>杯子不是链条的终点，而是问题的起点。</p></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:1,total:22});</script>
</body>
</html>
