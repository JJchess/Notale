<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="03" data-total="22">
<div id="stage">
  <style>
    #stage{padding:28px 56px;display:flex;flex-direction:column;gap:0;background:var(--bg);color:var(--text);overflow:hidden}
    .p3-head{height:112px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid rgba(45,36,31,.28);padding-bottom:20px;box-sizing:border-box}
    .p3-kicker{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.13em;color:var(--coffee);margin:5px 0 13px}
    .p3-head h1{font:600 var(--fs-h1)/1.22 var(--font-serif);margin:0;letter-spacing:.01em}
    .batch{margin-top:5px;border:1px solid var(--coffee);padding:9px 13px 8px;font:500 var(--fs-label)/1 var(--font-mono);color:var(--coffee);white-space:nowrap}
    .p3-ledger{flex:1;min-height:0;display:grid;grid-template-columns:258px minmax(0,1fr);padding-top:26px}
    .index-head{height:86px;border-right:1px solid rgba(45,36,31,.28);padding:8px 28px 0 0;box-sizing:border-box}
    .index-head .overline,.record-head .overline{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.08em;color:rgba(45,36,31,.65)}
    .index-head p{margin:13px 0 0;font:var(--fs-sec)/1.35 var(--font-sans)}
    .p3-index{border-right:1px solid rgba(45,36,31,.28);display:grid;grid-template-rows:86px repeat(3,1fr);min-height:0}
    .index-item{display:flex;align-items:center;gap:15px;padding-right:24px;border-top:1px solid rgba(45,36,31,.18)}
    .index-num{font:500 var(--fs-label)/1 var(--font-mono);color:var(--coffee);letter-spacing:.04em}
    .index-name{font:600 var(--fs-h2)/1 var(--font-serif)}
    .record-area{min-width:0;display:grid;grid-template-rows:86px repeat(3,1fr);padding-left:30px;position:relative}
    .record-head{display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding-top:9px}
    .stage-label{font:600 var(--fs-sec)/1.1 var(--font-sans);position:relative;color:var(--text)}
    .stage-label:not(:last-child):after{content:"";position:absolute;top:29px;left:0;width:calc(100% - 13px);height:1px;background:rgba(45,36,31,.28)}
    .stage-label:not(:last-child):before{content:"";position:absolute;z-index:2;top:25px;right:9px;width:7px;height:7px;border-top:1px solid rgba(45,36,31,.5);border-right:1px solid rgba(45,36,31,.5);transform:rotate(45deg)}
    .rec{position:relative;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid rgba(45,36,31,.18);min-height:0}
    .flowline{position:absolute;left:0;right:8px;top:50%;height:0;pointer-events:none}
    .flowline.material{border-top:3px solid var(--coffee)}
    .flowline.material:after{content:"";position:absolute;right:-1px;top:-6px;width:11px;height:11px;border-top:3px solid var(--coffee);border-right:3px solid var(--coffee);transform:rotate(45deg)}
    .flowline.dashed{border-top:2px dashed rgba(45,36,31,.58)}
    .flowline.dashed:after{content:"";position:absolute;right:0;top:-5px;width:9px;height:9px;border-top:2px solid rgba(45,36,31,.58);border-right:2px solid rgba(45,36,31,.58);transform:rotate(45deg)}
    .cell{z-index:1;display:flex;align-items:center;padding:0 18px 0 0;min-width:0}
    .cell span{display:block;background:var(--bg);padding:8px 11px 8px 0;font:var(--fs-label)/1.32 var(--font-sans);max-width:155px}
    .material .cell span{color:var(--coffee);font-weight:600}
    .cell:before{content:"";width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid rgba(45,36,31,.62);margin-right:8px;flex:none}
    .material .cell:before{background:var(--coffee);border-color:var(--coffee)}
    .material .cell:first-child:before{border-radius:50% 50% 47% 47%;transform:rotate(-20deg)}
    .p3-foot{height:122px;border-top:1px solid rgba(45,36,31,.28);display:grid;grid-template-columns:1fr 415px;gap:44px;align-items:center;box-sizing:border-box}
    .teacher-note{border-left:4px solid var(--focus);padding:3px 0 3px 16px;font:var(--fs-lead)/1.42 var(--font-serif);max-width:760px}
    .quiet-right{align-self:stretch;display:flex;flex-direction:column;justify-content:center;border-left:1px solid rgba(45,36,31,.2);padding-left:24px}
    .legend{display:flex;gap:18px;margin-bottom:13px;font:var(--fs-label)/1.2 var(--font-sans)}
    .legend b{display:inline-block;width:31px;vertical-align:middle;margin-right:7px}
    .solid{border-top:3px solid var(--coffee)} .dash{border-top:2px dashed rgba(45,36,31,.65)}
    .next{font:var(--fs-sec)/1.35 var(--font-sans);color:rgba(45,36,31,.78)}
    .next strong{font-weight:600;color:var(--text)}
  </style>
  <header class="p3-head">
    <div><div class="p3-kicker">TRACE ONE CUP</div><h1>同一杯咖啡，有三本同时在记的账</h1></div>
    <div class="batch tag">批次 03 / 同一杯的三条线</div>
  </header>
  <main class="p3-ledger ledger min0" aria-label="一杯咖啡的三本追踪账">
    <aside class="p3-index min0">
      <div class="index-head"><div class="overline">追踪账本</div><p>同一批次，按同一组阶段阅读</p></div>
      <div class="index-item"><span class="index-num">01</span><span class="index-name">物料</span></div>
      <div class="index-item"><span class="index-num">02</span><span class="index-name">金钱</span></div>
      <div class="index-item"><span class="index-num">03</span><span class="index-name">影响</span></div>
    </aside>
    <section class="record-area min0 k-process">
      <div class="record-head" aria-label="共同阶段基线">
        <div class="stage-label">种子</div><div class="stage-label">果实</div><div class="stage-label">生豆</div><div class="stage-label">烘焙豆</div><div class="stage-label">杯中</div>
      </div>
      <div class="rec material">
        <div class="flowline material"></div>
        <div class="cell"><span>种下</span></div><div class="cell"><span>长成</span></div><div class="cell"><span>加工、筛选</span></div><div class="cell"><span>烘焙</span></div><div class="cell"><span>研磨、冲煮</span></div>
      </div>
      <div class="rec">
        <div class="flowline dashed"></div>
        <div class="cell"><span>投入劳动与资源</span></div><div class="cell"><span>采收与加工支出</span></div><div class="cell"><span>采购与贸易</span></div><div class="cell"><span>烘焙与零售成本</span></div><div class="cell"><span>消费者支付杯价</span></div>
      </div>
      <div class="rec">
        <div class="flowline dashed"></div>
        <div class="cell"><span>土地、水与气候条件</span></div><div class="cell"><span>种植管理</span></div><div class="cell"><span>用水、能源与损耗</span></div><div class="cell"><span>能源与失重</span></div><div class="cell"><span>加热用水与废弃物</span></div>
      </div>
    </section>
  </main>
  <footer class="p3-foot">
    <div class="teacher-note">先别问哪一环最好；先看：每一环都不只发生一件事。</div>
    <div class="quiet-right">
      <div class="legend"><span><b class="solid"></b>实线：咖啡物料</span><span><b class="dash"></b>虚线：价格、信息与影响的记录</span></div>
      <div class="next"><strong>下一问</strong>　如果产地不只是国名，它究竟包含哪些生长条件？</div>
    </div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:3,total:22});</script>
</body>
</html>
