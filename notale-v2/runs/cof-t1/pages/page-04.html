<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F6F1E7;--text:#2D241F;--coffee:#5A351F;--focus:#F2A900;--font-sans:"Noto Sans SC",system-ui,sans-serif;--ink-soft:#756960;--line:#cfc4b6;--wash:#eee6d9;--stage-w:1600;--stage-h:900}
*{box-sizing:border-box} #stage{box-sizing:border-box} body{margin:0} button{font:inherit;color:inherit}.stage-shell{width:1488px;height:844px;flex:0 0 auto;min-height:0;display:flex;flex-direction:column;padding:2px 0 0;overflow:hidden}.top{height:108px;display:flex;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:20px}.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.13em;color:var(--coffee);padding-top:8px;width:20%;min-width:150px}.title-wrap{min-width:0;flex:1}.title-wrap h1{margin:0;font:700 var(--fs-h1)/1.2 var(--font-serif);letter-spacing:.02em}.title-wrap p{margin:9px 0 0;font:var(--fs-lead)/1.4 var(--font-sans);color:#51463f}.status{width:21%;min-width:145px;text-align:right;padding-top:9px;font:var(--fs-label)/1.4 var(--font-sans);color:var(--ink-soft)}
.workspace{position:relative;display:flex;flex:1;min-height:0;padding-top:24px}.map-side,.record-side{position:relative;z-index:2;min-width:0}.map-side{width:43%;padding-right:28px}.record-side{width:48%;margin-left:auto;padding-left:20px}.band{width:9%;position:relative;z-index:2;display:flex;align-items:center;justify-content:center}.origin-index{width:100%;border-left:1px solid var(--coffee);padding:10px 0 10px 11px;background:rgba(246,241,231,.82)}.origin-index strong{display:block;font:700 var(--fs-label)/1.25 var(--font-sans)}.origin-index span{display:block;margin-top:6px;font:var(--fs-tick)/1.35 var(--font-sans);color:var(--ink-soft)}.origin-index i{display:block;margin:5px 0;color:var(--coffee);font-style:normal;font:var(--fs-label)/1 var(--font-mono)}.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.section-head h2{margin:0;font:700 var(--fs-h2)/1.2 var(--font-serif)}.section-head .small{font:var(--fs-label)/1.3 var(--font-sans);color:var(--ink-soft)}
.map-frame{height:480px;position:relative;border-top:2px solid var(--coffee);border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(238,230,217,.5),rgba(246,241,231,.1))}.world{position:absolute;inset:18px 0 20px;width:100%;height:calc(100% - 38px)}.continent{fill:none;stroke:#ab9e91;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.graticule{stroke:#d8cec1;stroke-width:1;stroke-dasharray:4 8}.point{position:absolute;width:102px;display:flex;align-items:center;gap:7px;background:transparent;border:0;padding:5px;cursor:pointer;text-align:left;font:var(--fs-label)/1.2 var(--font-sans);border-radius:3px}.point b{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:var(--coffee);color:#fff;font:700 var(--fs-tick)/1 var(--font-mono);letter-spacing:.03em;box-shadow:0 0 0 2px var(--bg)}.point span{white-space:nowrap}.point[aria-pressed="true"] b{background:var(--focus);color:#2D241F}.point:focus-visible,.record-button:focus-visible,.reset:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.p0{left:57%;top:45%}.p1{left:23%;top:41%}.p2{left:26%;top:66%}.p3{left:78%;top:54%}.map-caption{position:absolute;bottom:0;left:0;transform:translateY(28px);font:var(--fs-label)/1.3 var(--font-sans);color:var(--ink-soft)}
.connections{position:absolute;left:0;top:78px;width:100%;height:420px;z-index:1;pointer-events:none;overflow:visible}.connect{fill:none;stroke:#aa9b8c;stroke-width:1.5;stroke-dasharray:4 6}.connect.active{stroke:var(--focus);stroke-width:3;stroke-dasharray:none}.guide{fill:none;stroke:#d4c8bb;stroke-width:1}
.record-panel{min-height:480px;border-top:2px solid var(--coffee);padding-top:12px}.intro{margin:0 0 15px;font:var(--fs-sec)/1.45 var(--font-sans);color:#51463f}.all-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini-card{border-left:4px solid var(--coffee);background:var(--wash);padding:13px 15px;min-height:158px}.mini-card .id{font:700 var(--fs-tick)/1 var(--font-mono);color:var(--coffee);letter-spacing:.08em}.mini-card h3{margin:6px 0 8px;font:700 var(--fs-sec)/1.25 var(--font-serif)}.mini-card p{margin:0;font:var(--fs-label)/1.35 var(--font-sans);color:#5e5149}.detail{display:none}.detail.show{display:block}.record-title{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}.record-title .id{font:700 var(--fs-label)/1 var(--font-mono);color:var(--coffee);letter-spacing:.1em}.record-title h3{margin:5px 0 0;font:700 var(--fs-h2)/1.2 var(--font-serif)}.reset{border:1px solid var(--coffee);background:transparent;padding:8px 11px;cursor:pointer;font:var(--fs-label)/1 var(--font-sans)}.facts{margin-top:12px}.fact{display:flex;align-items:center;min-height:51px;border-bottom:1px solid #d8cec1}.fact .key{width:31%;font:var(--fs-sec)/1.3 var(--font-sans)}.fact .value{font:700 var(--fs-body)/1.3 var(--font-mono);letter-spacing:.01em}.note{margin:14px 0 0;border-left:3px solid var(--focus);padding:9px 0 9px 12px;font:var(--fs-sec)/1.4 var(--font-sans);color:#51463f}.switches{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.record-button{border:1px solid var(--line);background:var(--bg);padding:7px 9px;cursor:pointer;font:var(--fs-label)/1.2 var(--font-sans)}.record-button[aria-pressed="true"]{border-color:var(--coffee);background:var(--wash);font-weight:700}.foot{height:146px;border-top:1px solid var(--line);padding-top:18px;display:flex;gap:30px;align-items:flex-start}.takeaway{width:58%;font:700 var(--fs-lead)/1.45 var(--font-serif);padding-left:18px;border-left:4px solid var(--coffee)}.teacher-space{flex:1;border-left:1px solid var(--line);padding-left:22px;min-height:82px}.teacher-space .label{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.09em;color:var(--ink-soft)}.teacher-space p{margin:11px 0 0;font:var(--fs-sec)/1.4 var(--font-sans);color:#5d5047}.source{position:absolute;right:0;bottom:3px;font:var(--fs-tick)/1.3 var(--font-sans);color:var(--ink-soft)}
@media(prefers-reduced-motion:no-preference){.detail,.all-grid{transition:opacity .16s ease}.point b{transition:background .16s ease}.connect{transition:stroke .16s ease,stroke-width .16s ease}}
</style>
</head>
<body data-page="04" data-total="22">
<div id="stage"><main class="stage-shell" aria-labelledby="page-title">
<header class="top"><div class="kicker">ORIGIN RECORD 01</div><div class="title-wrap"><h1 id="page-title">产地不是国名标签，而是一组生长条件</h1><p>把国名当作记录入口：向下看，才是一个示例农场面对的条件。</p></div><div class="status" id="status" aria-live="polite">当前：全部样本<br>先比较条件，再猜结果</div></header>
<section class="workspace" aria-label="产地记录比较">
<svg class="connections" viewBox="0 0 1488 420" preserveAspectRatio="none" aria-hidden="true"><path class="guide" d="M640 20H720"/><path id="line0" class="connect" d="M350 185 C540 185 690 100 835 100"/><path id="line1" class="connect" d="M145 168 C455 168 640 178 835 178"/><path id="line2" class="connect" d="M165 270 C450 270 645 257 835 257"/><path id="line3" class="connect" d="M490 222 C650 222 710 335 835 335"/></svg>
<div class="map-side min0"><div class="section-head"><h2>点选一个产地记录</h2><span class="small">示意方位 · 非统计地图</span></div><div class="map-frame"><svg class="world" viewBox="0 0 620 360" role="img" aria-label="世界方位示意，含四个产地记录点"><path class="graticule" d="M20 90H600M20 180H600M20 270H600M155 20V340M310 20V340M465 20V340"/><path class="continent" d="M63 72l35-29 64 7 20 30-19 25-38-2-18 25-32-8-22-25zM151 135l33 21 6 45 25 41-13 70-29 16-17-45 4-44-22-45z"/><path class="continent" d="M295 71l42-30 63 7 28 22 55-4 42 31-13 24-49 10-21 23-42-6-34 14-48-23-31-35zM419 161l38 18 22 47-12 77-29 32-20-45 7-46-23-39z"/><path class="continent" d="M510 260l47 10 24 24-28 22-50-16-18-23z"/></svg>
<button class="point p0" data-id="0" aria-pressed="false" aria-label="选择埃塞俄比亚高地示例，记录01"><b>01</b><span>埃塞俄比亚</span></button><button class="point p1" data-id="1" aria-pressed="false" aria-label="选择哥伦比亚山地示例，记录02"><b>02</b><span>哥伦比亚</span></button><button class="point p2" data-id="2" aria-pressed="false" aria-label="选择巴西高原示例，记录03"><b>03</b><span>巴西</span></button><button class="point p3" data-id="3" aria-pressed="false" aria-label="选择印度尼西亚山地示例，记录04"><b>04</b><span>印度尼西亚</span></button><div class="map-caption">点位只指向课堂示例产区，不代表全国。</div></div></div>
<div class="band"><div class="origin-index"><strong>记录层级</strong><span>国家</span><i>↓</i><span>示例产区</span><i>↓</i><span>条件记录</span></div></div>
<div class="record-side min0"><div class="section-head"><h2>这不是风味公式</h2><span class="small">国家／示例产区／条件记录</span></div><section class="record-panel panel" aria-live="polite"><p class="intro" id="record-intro">四张记录按同一顺序列出：温度、降雨、海拔、品种。</p><div class="all-grid" id="all-grid"></div><div class="detail" id="detail"></div><div class="switches" id="switches" aria-label="切换产地记录"></div></section></div>
</section>
<footer class="foot"><div class="takeaway">同一个国名之下可以有不同的温度、降雨、海拔与品种组合。</div><aside class="teacher-space"><div class="label">NEXT QUESTION</div><p>在这些条件中，海拔改变的究竟是什么？</p></aside><div class="source">课堂示例；ICO、World Coffee Research 资料整理</div></footer>
</main></div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script>
<script>
(()=>{
Deck.init({index:4,total:22});
const samples=[
 {country:'埃塞俄比亚',region:'高地示例',temp:'16–22 °C',rain:'1,200–1,800 mm',alt:'1,700–2,100 m',variety:'当地传统品种群',note:'课堂示例产区，不代表全国'},
 {country:'哥伦比亚',region:'山地示例',temp:'17–23 °C',rain:'1,800–2,400 mm',alt:'1,400–1,900 m',variety:'阿拉比卡品种',note:'课堂示例产区，不代表全国'},
 {country:'巴西',region:'高原示例',temp:'18–24 °C',rain:'1,000–1,600 mm',alt:'800–1,200 m',variety:'阿拉比卡品种',note:'课堂示例产区，不代表全国'},
 {country:'印度尼西亚',region:'山地示例',temp:'17–23 °C',rain:'1,500–2,500 mm',alt:'1,100–1,600 m',variety:'阿拉比卡品种',note:'课堂示例产区，不代表全国'}];
let state={selected:null}; const all=document.querySelector('#all-grid'),detail=document.querySelector('#detail'),sw=document.querySelector('#switches'),status=document.querySelector('#status'),intro=document.querySelector('#record-intro');
const fields=[['温度','temp'],['年降雨','rain'],['海拔','alt'],['品种','variety']];
function select(id){state={selected:state.selected===id?null:id};render()}
function render(){const id=state.selected; document.querySelectorAll('.point').forEach((p,i)=>p.setAttribute('aria-pressed',String(i===id)));document.querySelectorAll('.connect').forEach((l,i)=>l.classList.toggle('active',i===id));
 if(id===null){all.style.display='grid';detail.classList.remove('show');intro.textContent='四张记录按同一顺序列出：温度、降雨、海拔、品种。';status.innerHTML='当前：全部样本<br>先比较条件，再猜结果';all.innerHTML=samples.map((s,i)=>`<article class="mini-card"><div class="id">RECORD 0${i+1}</div><h3>${s.country}／${s.region}</h3><p>${s.temp} · ${s.alt}<br>${s.variety}</p></article>`).join('');sw.innerHTML=samples.map((s,i)=>`<button class="record-button" data-id="${i}" aria-pressed="false">0${i+1} ${s.country}</button>`).join('');}
 else {const s=samples[id];all.style.display='none';detail.classList.add('show');intro.textContent='展开一张记录；其余三项缩为可切换的记录标签。';status.innerHTML=`当前：记录 0${id+1} · ${s.country}<br>已高亮地点与所属条件卡`;detail.innerHTML=`<div class="record-title"><div><div class="id">RECORD 0${id+1}</div><h3>${s.country}／${s.region}</h3></div><button class="reset" type="button">查看全部样本</button></div><div class="facts">${fields.map(f=>`<div class="fact"><span class="key">${f[0]}</span><span class="value">${s[f[1]]}</span></div>`).join('')}</div><p class="note">“${s.country}”描述的是地点；这张卡描述的是这个示例农场可能面对的条件。<br><span>${s.note}</span></p>`;sw.innerHTML=samples.map((x,i)=>`<button class="record-button" data-id="${i}" aria-pressed="${i===id}">0${i+1} ${x.country}／${x.region}</button>`).join('');detail.querySelector('.reset').addEventListener('click',()=>{state={selected:null};render();document.querySelector('.point[data-id="0"]').focus()});}
 sw.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>select(+b.dataset.id)));
 }
 document.querySelectorAll('.point').forEach(b=>b.addEventListener('click',()=>select(+b.dataset.id)));render();
 let cleaned=false;function cleanup(){if(cleaned)return;cleaned=true;document.querySelectorAll('.point').forEach(b=>b.replaceWith(b.cloneNode(true)))}window.addEventListener('pagehide',cleanup,{once:true});
})();
</script></body></html>
