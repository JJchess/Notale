<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F6F1E7;--text:#2D241F;--coffee:#5A351F;--focus:#F2A900;--font-sans:"Noto Sans SC",system-ui,sans-serif;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text)}
#stage{padding:28px 56px;display:flex;flex-direction:column;gap:16px;overflow:hidden;font-family:var(--font-sans)}
.page-head{height:105px;display:flex;align-items:flex-start;border-bottom:1px solid rgba(90,53,31,.34);padding-bottom:14px}.head-copy{min-width:0}.kicker{font-size:var(--fs-label);letter-spacing:.16em;font-weight:800;color:var(--coffee);margin-bottom:7px}.page-head h1{font-family:var(--font-serif);font-size:var(--fs-h1);line-height:1.13;margin:0;color:var(--coffee);font-weight:700}.intro{font-size:var(--fs-lead);line-height:1.4;margin:6px 0 0;max-width:1020px}
.generalization{flex:1;min-height:0;display:flex;flex-direction:column}.spine{height:43px;display:flex;align-items:center;gap:14px;font-size:var(--fs-sec);font-weight:700;color:var(--coffee)}.how{font-size:var(--fs-label);font-weight:600;border:1px solid rgba(90,53,31,.4);padding:5px 8px;white-space:nowrap;color:#4f4138}.spine-line{height:1px;background:var(--coffee);flex:1;opacity:.65;position:relative}.spine-line:after{content:"";position:absolute;right:0;top:-4px;border-left:8px solid var(--coffee);border-top:4px solid transparent;border-bottom:4px solid transparent}.spine em{font-style:normal;color:#7a6557;font-weight:500}
.stage-cards{display:flex;gap:14px;align-items:stretch;min-height:0;flex:1;padding:2px 0 8px}.goal-card{flex:1 1 0;min-width:0;border:1px solid rgba(90,53,31,.46);border-radius:12px;background:rgba(255,255,255,.37);display:flex;flex-direction:column;padding:16px 15px 13px;position:relative;box-shadow:inset 0 0 0 2px rgba(90,53,31,.14);transition:transform 160ms ease,border-color 160ms ease,box-shadow 160ms ease;animation:enter .18s both}.goal-card:nth-child(2){animation-delay:.07s}.goal-card:nth-child(3){animation-delay:.14s}.goal-card:nth-child(4){animation-delay:.21s}.goal-card.active{border:3px solid var(--focus);padding:14px 13px 11px;box-shadow:inset 0 0 0 2px rgba(242,169,0,.26),0 4px 0 rgba(242,169,0,.2)}.goal-card.dragging{opacity:.56;transform:scale(.98)}
.card-top{display:flex;align-items:center;gap:8px;min-height:31px}.order{font-family:var(--font-mono);font-size:var(--fs-label);font-weight:800;color:var(--coffee);border:1px solid rgba(90,53,31,.48);padding:2px 6px}.active .order{background:var(--focus);border-color:var(--focus)}.first-tag{font-size:var(--fs-label);font-weight:800;color:var(--coffee);background:var(--focus);padding:3px 6px}.goal-card h2{font-family:var(--font-serif);font-size:var(--fs-h2);line-height:1.18;margin:13px 0 9px;color:var(--coffee)}.trade{font-size:var(--fs-sec);line-height:1.45;margin:0;color:#4f4138}.decision-path{margin:15px 0 10px;border-left:2px solid rgba(90,53,31,.42);padding:6px 0 6px 10px;font-size:var(--fs-label);line-height:1.4;color:var(--coffee)}.decision-path span{display:block;font-size:var(--fs-tick);letter-spacing:.08em;color:#7a6557;margin-bottom:2px}.compare-note{border:1px dashed rgba(90,53,31,.42);padding:7px 9px;margin-bottom:11px;font-size:var(--fs-label);line-height:1.35;color:#4f4138}.compare-note b{display:block;color:var(--coffee);font-size:var(--fs-tick);letter-spacing:.07em;margin-bottom:2px}.constraint-note{background:rgba(90,53,31,.07);border-left:3px solid var(--coffee);padding:7px 9px;margin:-2px 0 11px;font-size:var(--fs-label);line-height:1.35;color:#4f4138}.constraint-note b{color:var(--coffee)}.condition{margin-top:auto;border-top:1px solid rgba(90,53,31,.28);padding-top:11px;font-size:var(--fs-label);line-height:1.4;color:var(--coffee);font-weight:700}.condition b{font-size:var(--fs-label);display:block;margin-bottom:3px;color:#7a6557}.condition:after{content:attr(data-source);display:block;font-size:var(--fs-tick);line-height:1.25;color:#725f52;font-weight:400;margin-top:7px}
.card-actions{display:flex;gap:6px;margin-top:7px}.move-btn,.reset{font:inherit;font-size:var(--fs-label);line-height:1.1;border:1px solid var(--coffee);background:transparent;color:var(--coffee);border-radius:6px;padding:6px 8px;cursor:pointer}.move-btn:disabled{opacity:.32;cursor:not-allowed}.move-btn:hover,.reset:hover{background:#eadfce}.goal-card[aria-grabbed="true"]{outline:3px solid var(--focus);outline-offset:3px}.move-btn:focus-visible,.reset:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.panel{height:140px;border-top:2px solid var(--coffee);border-bottom:1px solid rgba(90,53,31,.38);display:grid;grid-template-columns:220px minmax(0,1fr) 270px 145px;gap:18px;align-items:center;padding:14px 18px;background:rgba(90,53,31,.055)}.panel>*{min-width:0}.panel>div,.panel>.ask,.panel>.caution{min-height:88px;padding:8px 10px;background:rgba(255,255,255,.3);border:2px solid rgba(90,53,31,.32)}.panel-kicker{font-size:var(--fs-label);letter-spacing:.12em;font-weight:800;color:var(--coffee);margin:0 0 5px}.panel h2{font-family:var(--font-serif);font-size:var(--fs-h2);margin:0;color:var(--coffee);line-height:1.2}.ask{font-size:var(--fs-body);line-height:1.43;margin:0}.ask b{color:var(--coffee)}.caution{font-size:var(--fs-sec);line-height:1.4;border-left:4px solid var(--focus);padding-left:13px;margin:0}.reset{justify-self:stretch;align-self:center;padding:10px 8px;font-weight:700;white-space:nowrap}.footer{height:42px;display:flex;align-items:flex-end;justify-content:space-between;gap:28px}.takeaway{font-size:var(--fs-sec);line-height:1.4;margin:0;max-width:920px}.next{font-size:var(--fs-label);line-height:1.35;color:var(--coffee);font-weight:700;text-align:right;max-width:390px;margin:0}.next span{display:block;font-size:var(--fs-tick);letter-spacing:.1em;color:#7a6557;margin-bottom:2px}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:1ms!important;transition-duration:1ms!important}}
</style>
</head>
<body data-page="19" data-total="22">
<div id="stage">
  <header class="page-head"><div class="head-copy"><div class="kicker">TRADE-OFFS</div><h1>没有脱离目标的“最好咖啡”</h1><p class="intro">先排出你最想守住的约束：排在第一位的目标，决定了应该先查什么条件。</p></div></header>
  <main class="generalization k-generalization" aria-label="目标改变，判断改变">
    <div class="spine"><span>目标改变</span><i class="spine-line"></i><span>判断改变</span><span class="how">拖动卡片，或按 ↑ ↓ 排序</span><span class="how">顶置 ≠ 唯一答案</span><em>第一张 = 先查条件</em></div>
    <section id="cards" class="stage-cards" aria-label="优先目标排序器"></section>
  </main>
  <section class="panel" aria-labelledby="panel-title">
    <div><p class="panel-kicker">当前优先约束</p><h2 id="panel-title"></h2></div>
    <p class="ask" id="ask"></p><p class="caution" id="caution"></p>
    <button class="reset" id="reset" type="button">恢复课堂起点</button>
  </section>
  <footer class="footer"><p class="takeaway">稳定收入、低用水、低排放与果香风味，指向的合理选择并不相同。</p><p class="next"><span>下一问</span>这些判断里，哪些来自测量，哪些只是课堂估算？</p></footer>
  
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script>
<script>
(()=>{'use strict';
Deck.init({index:19,total:22});
const goals={
 flavor:{name:'果香风味',condition:'成熟度、日晒处理、干燥稳定性与烘焙度',compare:'同一烘焙度、同一冲煮方式下再比较风味。',trade:'果香可能更突出，也可能伴随更高发酵失败风险。',source:'课堂处理情境',ask:'先问：<b>成熟度、日晒处理、干燥是否稳定，以及烘焙度如何设定？</b>',caution:'不能直接推出：果香更突出，不等于处理风险更低。'},
 income:{name:'稳定收入',condition:'采购价、质量溢价、合同期限与谁承担风险',compare:'把采购价、成本和合同风险放在同一份账里看。',trade:'较高报价不必然等于更稳定；成本与合同条款也要同时看。',source:'课堂合同情境',ask:'先问：<b>采购价之外，质量溢价、合同期限和风险由谁承担？</b>',caution:'不能直接推出：报价较高，不等于收入一定更稳定。'},
 water:{name:'低用水',condition:'农场所在地的降雨、灌溉与处理用水',compare:'比较同一地点、同一季节的实际用水条件。',trade:'全球平均不能替代单一农场；水洗与日晒也没有脱离地点的固定结论。',source:'Mekonnen & Hoekstra，2011',ask:'先问：<b>这个农场的降雨、灌溉条件和处理环节实际用水？</b>',caution:'不能直接推出：处理法名称本身，不能代表单一农场的用水。'},
 carbon:{name:'低排放',condition:'种植与加工条件、运输方式、烘焙和冲煮能耗',compare:'先说清比较范围：从农场到杯子的哪些环节？',trade:'运输距离重要，但不能据此断言运输总是最大来源。',source:'课堂生命周期边界',ask:'先问：<b>种植和加工条件、运输方式，以及烘焙与冲煮能耗？</b>',caution:'不能直接推出：距离更远，不能断言运输总是最大来源。'}
};
const initial=()=>({order:['flavor','income','water','carbon'],drag:null}); let state=initial(); const cards=document.getElementById('cards'),live=document.getElementById('caution');
function setPriorityOrder(order,announce=''){state.order=order.slice(); render(); if(announce)live.textContent=announce}
function move(id,delta){const i=state.order.indexOf(id), n=i+delta;if(n<0||n>=state.order.length)return;const order=state.order.slice();[order[i],order[n]]=[order[n],order[i]];setPriorityOrder(order,`${goals[id].name}现在排在第${n+1}位。${n===0?'这是你的优先目标，不是普遍事实。':''}`)}
function render(){cards.innerHTML='';state.order.forEach((id,i)=>{const g=goals[id],card=document.createElement('article');card.className='goal-card';card.dataset.id=id;card.setAttribute('aria-grabbed','false');card.setAttribute('aria-label',`${g.name}，第${i+1}位。可拖动排序，或使用上下移动按钮。`);if(i===0)card.classList.add('active');card.innerHTML=`<div class="card-top"><span class="order">${String(i+1).padStart(2,'0')}</span>${i===0?'<span class="first-tag">先查</span>':''}</div><h2>${g.name}</h2><p class="trade">${g.trade}</p><div class="decision-path"><span>判断路径</span>目标置顶 → 核对条件 → 接受取舍</div><div class="compare-note"><b>比较口径</b>${g.compare}</div><div class="constraint-note"><b>仍要保留：</b>其余三项是约束，不是被删除的目标。</div><div class="condition" data-source="${g.source}"><b>需要查看</b>${g.condition}</div><div class="card-actions"><button class="move-btn" type="button" data-move="-1" ${i===0?'disabled':''} aria-label="${g.name}上移">↑ 上移</button><button class="move-btn" type="button" data-move="1" ${i===3?'disabled':''} aria-label="${g.name}下移">↓ 下移</button></div>`;cards.appendChild(card)});const g=goals[state.order[0]];document.getElementById('panel-title').textContent=g.name;document.getElementById('ask').innerHTML=g.ask;document.getElementById('caution').textContent=g.caution;document.getElementById('caution').setAttribute('aria-live','polite');
}
function onClick(e){const b=e.target.closest('[data-move]');if(b){const card=b.closest('.goal-card');move(card.dataset.id,+b.dataset.move)}}
function onDown(e){if(e.target.closest('button'))return;const card=e.target.closest('.goal-card');if(!card)return;state.drag={id:card.dataset.id,pointer:e.pointerId};if(card.setPointerCapture){try{card.setPointerCapture(e.pointerId)}catch(_){}}card.setAttribute('aria-grabbed','true');card.classList.add('dragging');live.textContent=`正在移动${goals[state.drag.id].name}；拖到另一张卡上方或下方。`}
function onMove(e){if(!state.drag||e.pointerId!==state.drag.pointer)return;const p=Deck.pt(cards,e);const items=[...cards.children];let target=items.find(c=>{const r=c.getBoundingClientRect(), x=(r.left+r.width/2-cards.getBoundingClientRect().left)/Deck.s;return p.x<x});if(!target)target=items[items.length-1];const from=state.order.indexOf(state.drag.id),to=state.order.indexOf(target.dataset.id);if(from!==to){const order=state.order.slice();order.splice(from,1);order.splice(to,0,state.drag.id);setPriorityOrder(order);}}
function endDrag(e){if(!state.drag||e.pointerId!==state.drag.pointer)return;const id=state.drag.id;state.drag=null;render();live.textContent=`${goals[id].name}已排到第${state.order.indexOf(id)+1}位。${state.order[0]===id?'这是你的优先目标，不是普遍事实。':''}`}
cards.addEventListener('click',onClick);cards.addEventListener('pointerdown',onDown);cards.addEventListener('pointermove',onMove);cards.addEventListener('pointerup',endDrag);cards.addEventListener('pointercancel',endDrag);document.getElementById('reset').addEventListener('click',()=>{state=initial();render();document.getElementById('reset').focus();live.textContent='已恢复课堂起点：果香风味排在第一位。'});render();
window.addEventListener('pagehide',()=>{cards.removeEventListener('click',onClick);cards.removeEventListener('pointerdown',onDown);cards.removeEventListener('pointermove',onMove);cards.removeEventListener('pointerup',endDrag);cards.removeEventListener('pointercancel',endDrag)},{once:true});
})();
</script>
</body>
</html>
