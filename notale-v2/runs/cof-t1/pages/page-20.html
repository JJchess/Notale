<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F6F1E7;--text:#2D241F;--coffee:#5A351F;--focus:#F2A900;--font-sans:"Noto Sans SC",system-ui,sans-serif;--ink-soft:#70645c;--line:#cbbfb1;--wash:#eee5d8;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text)}
#stage{padding:28px 56px;display:flex;flex-direction:column;gap:14px;font-family:var(--font-sans);overflow:hidden}
header{height:112px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;padding-bottom:14px}.kicker{font-size:var(--fs-label);letter-spacing:.16em;font-weight:700;color:var(--coffee);margin:3px 0 7px}h1{font-family:var(--font-serif);font-size:var(--fs-h1);line-height:1.18;margin:0;font-weight:650}.sub{width:360px;font-size:var(--fs-sec);line-height:1.5;color:var(--ink-soft);margin:21px 0 0}
.board{flex:1;min-height:0;display:flex;gap:30px}.source{width:445px;min-width:0;border-right:1px solid var(--line);padding:8px 30px 0 0;display:flex;flex-direction:column}.section-head{font-size:var(--fs-h2);margin:0 0 7px;font-family:var(--font-serif)}.instruction{font-size:var(--fs-sec);line-height:1.45;margin:0 0 17px;color:var(--ink-soft)}.instruction b{color:var(--coffee)}
.claims{display:flex;flex-direction:column;gap:11px}.claim{width:100%;text-align:left;background:#fffaf2;border:1px solid var(--line);border-left:5px solid var(--coffee);padding:12px 14px 11px;min-height:82px;cursor:pointer;border-radius:2px;color:var(--text);font:inherit;transition:background .15s,transform .15s}.claim:hover{background:#fff}.claim:focus-visible,.bucket:focus-visible,.reset:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.claim.selected{background:#fff2c8;border-color:var(--focus);box-shadow:0 2px 0 var(--focus)}.claim.dragging{opacity:.45}.claim[hidden]{display:none}.claim-top{display:flex;align-items:center;gap:10px;margin-bottom:5px}.num{font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;color:var(--coffee)}.tag{font-size:var(--fs-tick);padding:2px 6px;border:1px solid var(--line);color:var(--ink-soft);font-weight:600}.claim-text{font-size:var(--fs-sec);line-height:1.38;display:block}
.evidence{flex:1;min-width:0;padding:8px 0 0;position:relative}.evidence-heading{display:flex;justify-content:space-between;align-items:start;height:48px}.evidence-heading h2{margin:0;font-size:var(--fs-h2);font-family:var(--font-serif)}.status{font-size:var(--fs-label);color:var(--coffee);font-weight:700;padding-top:4px}.buckets{height:calc(100% - 48px);display:flex;gap:14px}.bucket{flex:1;min-width:0;border:1px solid var(--line);border-top:5px solid var(--coffee);background:rgba(255,250,242,.58);padding:13px 14px 12px;display:flex;flex-direction:column;cursor:pointer;position:relative}.bucket.over{background:#fff1c4;border-color:var(--focus)}.bucket-title{font-family:var(--font-serif);font-size:var(--fs-h2);margin:0 0 7px}.definition{font-size:var(--fs-sec);line-height:1.4;margin:0;color:var(--text);min-height:69px}.boundary{margin:9px 0 10px;padding-top:9px;border-top:1px solid var(--line);font-size:var(--fs-label);line-height:1.42;color:var(--ink-soft)}.boundary b{color:var(--coffee)}.placed{display:flex;flex-direction:column;gap:7px;margin-top:auto}.placed .claim{min-height:0;padding:8px 9px;border-left-width:4px;cursor:default;background:#fff}.placed .claim-top{margin-bottom:3px}.placed .claim-text{font-size:var(--fs-label)}.placed .tag{display:none}.feedback{font-size:var(--fs-label);line-height:1.4;color:var(--coffee);border-top:1px dashed var(--coffee);padding-top:8px;margin-top:8px}
footer{height:105px;border-top:1px solid var(--line);display:flex;align-items:center;gap:24px}.live{flex:1;font-size:var(--fs-sec);line-height:1.4;color:var(--ink-soft)}.live strong{color:var(--coffee)}.closing{flex:1.25;font-family:var(--font-serif);font-size:var(--fs-lead);line-height:1.35;border-left:4px solid var(--line);padding-left:17px;color:#8b8178}.closing.ready{border-color:var(--focus);color:var(--text)}.reset{font:inherit;font-size:var(--fs-label);font-weight:700;padding:10px 17px;border:1px solid var(--coffee);background:transparent;color:var(--coffee);cursor:pointer}.reset:hover{background:var(--wash)}
@media(prefers-reduced-motion:no-preference){.claim{transition:background .15s,transform .15s}.claim.selected{transform:translateX(4px)}}
</style>
</head>
<body data-page="20" data-total="22">
<div id="stage">
<header><div><div class="kicker">EVIDENCE LABELS</div><h1>先问：这是测得的，估算的，还是假设的？</h1></div><p class="sub">给结论贴上来源标签，才能同时说清它支持什么、又不能替你断言什么。</p></header>
<main class="board">
<section class="source min0" aria-labelledby="source-title"><h2 class="section-head" id="source-title">待标注的结论</h2><p class="instruction">先点一条结论，再点右侧类别；也可<b>拖入</b>类别。错分会回到这里。</p><div id="claims" class="claims" aria-label="待分类结论"></div></section>
<section class="evidence min0" aria-labelledby="evidence-title"><div class="evidence-heading"><h2 id="evidence-title">它依靠哪一种证据？</h2><div class="status" id="status">0 / 4 已标注</div></div><div class="buckets" id="buckets"></div></section>
</main>
<footer><div class="live" id="live" aria-live="polite"><strong>操作提示：</strong>选择一条结论，判断它是直接记录、由公式推导，还是为比较公开设定的前提。</div><div class="closing" id="closing">结论的可靠范围，取决于它来自测量、模型估算，还是课堂假设。</div><button class="reset" id="reset" type="button">重标</button></footer>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script>
<script>
(()=>{'use strict'; Deck.init({index:20,total:22});
const items=[
{id:'a',n:'01',text:'“这杯使用 18 g 咖啡粉、注入 300 mL 水。”',tag:'课堂设定',answer:'assumption',feedback:'这是课堂统一配方，方便把链条换算到一杯。'},
{id:'b',n:'02',text:'“把 300 mL 水从 20°C 加热到 93°C，按 90% 效率，输入电能约为 0.0283 kWh。”',tag:'由课堂参数计算',answer:'estimate',feedback:'结果来自水量、温差和效率；设备效率不同，结果会变。'},
{id:'c',n:'03',text:'“某批生豆烘焙前后称重，质量减少了 15%。”',tag:'批次称重记录',answer:'measured',feedback:'这是该批次的记录；不同烘焙度与批次会不同。'},
{id:'d',n:'04',text:'“全球平均水足迹为 18,900 L/kg 烘焙咖啡。”',tag:'Organ 等，2011',answer:'estimate',feedback:'这是全球平均估计，不能直接当作单一农场的值。'}];
const types={measured:{title:'测得',def:'对某批次、某次操作或某个地点的直接记录',limit:'能描述这次记录；不能自动代表所有农场或年份。'},estimate:{title:'估算',def:'用测量值和公式推导出的课堂模型结果',limit:'能比较给定条件；输入改变，结果也会改变。'},assumption:{title:'假设',def:'为了让课堂比较可进行而公开设定的前提',limit:'便于计算；不等于真实世界的统一标准。'}};
const state={selected:null,placed:{measured:[],estimate:[],assumption:[]}}; const claims=document.querySelector('#claims'),buckets=document.querySelector('#buckets'),live=document.querySelector('#live'),status=document.querySelector('#status'),closing=document.querySelector('#closing');
function claim(item,placed=false){const b=document.createElement(placed?'div':'button');if(!placed)b.type='button';b.className='claim';b.id='claim-'+item.id;b.draggable=!placed;b.dataset.id=item.id;b.innerHTML=`<span class="claim-top"><span class="num">${item.n}</span><span class="tag">${item.tag}</span></span><span class="claim-text">${item.text}</span>`;if(!placed){b.addEventListener('click',()=>select(item.id));b.addEventListener('dragstart',e=>{state.selected=item.id;b.classList.add('dragging');e.dataTransfer.setData('text/plain',item.id)});b.addEventListener('dragend',()=>b.classList.remove('dragging'));b.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)){e.stopPropagation();e.preventDefault(); const keys=Object.keys(types),i=e.key==='ArrowLeft'||e.key==='ArrowUp'?keys.length-1:0;document.querySelector('[data-type="'+keys[i]+'"]').focus()}})}return b}
function select(id){state.selected=id;render();live.innerHTML='<strong>已选择结论 '+items.find(x=>x.id===id).n+'：</strong>现在选择“测得”“估算”或“假设”。'}
function place(type,id=state.selected){if(!id)return;const item=items.find(x=>x.id===id);if(item.answer!==type){state.selected=null;render();live.innerHTML='<strong>再看一次：</strong>它是直接记录、由公式推导，还是预先设定？条目已回到待标注区。';return}state.placed[type].push(id);state.selected=null;render();live.innerHTML='<strong>标注正确：</strong>'+item.feedback}
function render(){claims.innerHTML='';items.filter(i=>!Object.values(state.placed).flat().includes(i.id)).forEach(i=>{const el=claim(i);if(state.selected===i.id)el.classList.add('selected');claims.append(el)});buckets.innerHTML='';Object.entries(types).forEach(([key,t])=>{const box=document.createElement('button');box.type='button';box.className='bucket';box.dataset.type=key;box.setAttribute('aria-label','投放到'+t.title);box.innerHTML=`<h3 class="bucket-title">${t.title}</h3><p class="definition">${t.def}</p><p class="boundary"><b>边界</b> · ${t.limit}</p><div class="placed"></div>`;box.addEventListener('click',()=>place(key));box.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.stopPropagation();e.preventDefault();const keys=Object.keys(types),n=(keys.indexOf(key)+(e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:1)+3)%3;document.querySelector('[data-type="'+keys[n]+'"]').focus()} if(e.key==='Enter'||e.key===' '){e.preventDefault();place(key)}});box.addEventListener('dragover',e=>{e.preventDefault();box.classList.add('over')});box.addEventListener('dragleave',()=>box.classList.remove('over'));box.addEventListener('drop',e=>{e.preventDefault();box.classList.remove('over');place(key,e.dataTransfer.getData('text/plain'))});state.placed[key].forEach(id=>{const item=items.find(x=>x.id===id),el=claim(item,true);box.querySelector('.placed').append(el);const fb=document.createElement('div');fb.className='feedback';fb.textContent=item.feedback;box.querySelector('.placed').append(fb)});buckets.append(box)});const count=Object.values(state.placed).flat().length;status.textContent=count+' / 4 已标注';closing.classList.toggle('ready',count===4);if(count===4){closing.textContent='四种结论已经各归其位：先标明证据来源，才谈它的可靠范围。'}}
function reset(){state.selected=null;state.placed={measured:[],estimate:[],assumption:[]};render();live.innerHTML='<strong>已重标：</strong>四条结论都回到待标注区。';document.querySelector('#claim-a').focus()}
document.querySelector('#reset').addEventListener('click',reset);render();
})();
</script>
</body></html>
