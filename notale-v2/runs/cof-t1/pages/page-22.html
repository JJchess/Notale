<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{
  --bg:#F6F1E7;
  --text:#2D241F;
  --coffee:#5A351F;
  --focus:#F2A900;
  --font-sans:"Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg)}
#stage{
  display:flex;flex-direction:column; overflow:hidden;
  padding:28px 56px; color:var(--text); background:var(--bg);
  font-family:var(--font-sans);
}
.takeaway{height:42px;display:flex;align-items:flex-start;justify-content:center;flex:0 0 auto}
.tag.end-tag{border:1px solid rgba(90,53,31,.42);color:var(--coffee);background:transparent;border-radius:0;
  padding:6px 12px 5px;letter-spacing:.16em;font-size:var(--fs-label);font-weight:700;line-height:1}
.focus.k-generalization{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.claim{position:relative;z-index:2;max-width:1040px;margin:2px 0 0;font-family:var(--font-serif);font-size:var(--fs-h1);line-height:1.28;font-weight:600;letter-spacing:.01em}
.trunk{flex:1;min-height:0;width:100%;max-width:1160px;display:flex;flex-direction:column;align-items:center;position:relative;padding-top:9px;background:rgba(90,53,31,.045);border-left:1px solid rgba(90,53,31,.18);border-right:1px solid rgba(90,53,31,.18)}
.trunk::before{content:"";position:absolute;top:0;bottom:3px;left:50%;border-left:1px solid rgba(90,53,31,.30);z-index:0}
.steam{width:290px;height:96px;position:relative;z-index:1;flex:0 0 auto;overflow:visible}
.steam path{fill:none;stroke:var(--coffee);stroke-width:2.1;stroke-linecap:round;opacity:.78}
.steam path:nth-child(2){opacity:.58}.steam path:nth-child(3){opacity:.4}
.object-field{height:330px;flex:0 0 330px;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;margin-top:-15px}
.object-field::before{content:"";width:360px;height:360px;border:1px solid rgba(90,53,31,.22);border-radius:50%;position:absolute;background:rgba(246,241,231,.58)}
.object-field::after{content:"";width:460px;height:1px;background:rgba(90,53,31,.30);position:absolute;bottom:8px}
.cup{display:block;position:relative;width:320px;height:320px;object-fit:contain;z-index:2}
.closing{position:relative;z-index:2;max-width:790px;margin:1px 0 0;padding:13px 26px 14px;background:var(--bg);font-size:var(--fs-lead);line-height:1.48;font-weight:500}
.question-band{width:min(1120px,100%);min-height:136px;flex:0 0 136px;position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;margin-top:7px;border-top:1px solid rgba(45,36,31,.45);background:rgba(90,53,31,.075)}
.question-kicker{font-size:var(--fs-label);color:var(--coffee);font-weight:700;letter-spacing:.12em;margin-bottom:8px}
.question{max-width:1040px;font-family:var(--font-serif);font-size:var(--fs-h2);font-weight:600;line-height:1.42}
</style>
</head>
<body data-page="22" data-total="22">
<div id="stage">
  <header class="takeaway"><span class="tag end-tag">TAKE AWAY</span></header>
  <main class="focus k-generalization min0" aria-labelledby="title">
    <h1 id="title" class="claim">下一次点单时，追问这杯咖啡由谁、在什么条件下共同决定</h1>
    <section class="trunk min0" aria-label="一杯咖啡的共同决定因素">
      <svg class="steam" viewBox="0 0 290 96" aria-hidden="true">
        <path d="M82 92 C57 70 104 54 80 28 C68 15 79 7 90 2"/>
        <path d="M145 92 C123 69 169 54 146 30 C134 17 145 8 154 2"/>
        <path d="M208 92 C188 71 232 56 211 31 C199 17 210 8 220 3"/>
      </svg>
      <div class="object-field" aria-label="一杯咖啡">
        <img class="cup" src="assets/img/coffee-cup-topview.png" title="生成插画（非真实照片）" alt="从上方看的一杯咖啡">
      </div>
      <p class="closing">风味、价格与影响都来自一连串条件和取舍，而不是一个产地标签。</p>
    </section>
    <footer class="question-band" aria-label="带走的问题">
      <div class="question-kicker">带着这个问题点单</div>
      <div class="question">这杯咖啡的风味、价格与影响，分别是谁在什么条件下决定的？</div>
    </footer>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:22,total:22});</script>
</body>
</html>
