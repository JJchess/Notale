<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <title>神经网络是怎么学会的</title>
  <style>
    #stage{gap:18px}
    .page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:36px;flex:0 0 auto}
    .page-head .title-stack{max-width:1120px}
    .page-head .lead{max-width:1120px;margin-top:10px;color:var(--muted)}
    .lesson{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:28px;flex:1;min-height:0}
    .cycle{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:16px;min-width:0;min-height:0}
    .loop-stage{position:relative;min-width:0;min-height:0;border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
    .loop-stage svg{width:100%;height:100%;display:block}
    .loop-stage text{font-family:var(--font-sans)}
    .loop-stage .node{fill:#F8FAFA;stroke:#A8B8BE;stroke-width:2}
    .loop-stage .sample-node{stroke:#486B35;stroke-width:4}
    .loop-stage .model-node{stroke:#145C74;stroke-width:4}
    .loop-stage .target-node{stroke:#A53F2B;stroke-width:4}
    .loop-stage .adjust-node{stroke:#D88416;stroke-width:4}
    .loop-stage .label{fill:#17262D;font-size:22px;font-weight:800;text-anchor:middle}
    .loop-stage .sub{fill:#526770;font-size:15px;text-anchor:middle}
    .loop-stage .path-model{fill:none;stroke:var(--model);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    .loop-stage .path-target{fill:none;stroke:var(--target);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    .loop-stage .path-return{fill:none;stroke:var(--attention);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    .loop-stage .sample-mark{fill:var(--sample)}
    .claim{display:flex;align-items:center;justify-content:center;gap:14px;min-height:64px;padding:12px 22px;border:2px solid var(--line);border-radius:8px;background:var(--paper);font-size:var(--fs-lead);font-weight:800;transition:border-color 180ms ease,background 180ms ease}
    .claim::before{content:"";width:15px;height:15px;background:var(--attention);border-radius:2px;flex:0 0 auto}
    .claim.revealed{border-color:var(--attention);background:#FFF1D8;color:#714000}
    .side{display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0}
    .poll{padding:18px 20px}
    .poll h2{margin-bottom:8px}
    .poll .small{margin-bottom:14px}
    .poll-options{display:flex;flex-direction:column;gap:10px}
    .poll-choice{display:grid;grid-template-columns:minmax(0,1fr) 58px;gap:8px;align-items:stretch}
    .poll-choice .btn{text-align:left;min-height:50px}
    .count{display:grid;place-items:center;border:2px solid var(--line);border-radius:6px;background:var(--bg);font-family:var(--font-num);font-size:var(--fs-body);font-weight:800;font-variant-numeric:tabular-nums}
    .poll-choice.active .count{border-color:var(--attention);background:#FFF1D8;color:#714000}
    .poll-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px;min-height:44px}
    .poll-foot .hint{flex:1}
    .poll-foot .btn{min-height:38px;padding:6px 12px}
    .objects{margin-top:auto;padding:18px 20px}
    .objects h2{margin-bottom:13px}
    .object-list{display:flex;flex-direction:column;gap:0}
    .object{display:flex;align-items:center;gap:13px;padding:13px 0;border-top:1px solid var(--line);font-size:var(--fs-body);font-weight:750}
    .object:first-child{border-top:2px solid var(--text)}
    .object .mark{width:18px;height:18px;flex:0 0 18px;border:3px solid var(--text)}
    .object:nth-child(1) .mark{border-radius:50%;border-color:var(--model)}
    .object:nth-child(2) .mark{transform:rotate(45deg);border-color:var(--target)}
    .object:nth-child(3) .mark{border-color:var(--attention)}
    .status{min-height:22px;margin-top:8px;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
  </style>
</head>
<body data-page="01" data-total="20">
  <div id="stage">
    <header class="page-head">
      <div class="title-stack">
        <div class="kicker">全课问题</div>
        <h1>神经网络不是被写进答案，而是一次次把猜测改得更好</h1>
        <p class="lead">它先猜，再拿答案对照；误差告诉它下一次该往哪里改。</p>
      </div>
    </header>

    <main class="lesson min0">
      <section class="cycle min0" aria-label="神经网络学习闭环">
        <div class="loop-stage min0">
          <svg viewBox="0 0 1080 560" role="img" aria-labelledby="loop-title loop-desc">
            <title id="loop-title">神经网络反复改进猜测的闭环</title>
            <desc id="loop-desc">训练样本进入模型，模型作出猜测，与答案对照后根据误差调整参数，再作出新的猜测。</desc>
            <defs>
              <marker id="arr-model" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#145C74"/></marker>
              <marker id="arr-target" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#A53F2B"/></marker>
              <marker id="arr-attn" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#D88416"/></marker>
            </defs>
            <path class="path-model" marker-end="url(#arr-model)" d="M185 180 C245 90 348 80 415 145"/>
            <path class="path-target" marker-end="url(#arr-target)" d="M520 145 C600 70 735 88 790 180"/>
            <path class="path-target" marker-end="url(#arr-target)" d="M830 255 C842 340 760 405 680 410"/>
            <path class="path-return" marker-end="url(#arr-attn)" d="M560 430 C450 505 280 462 230 350"/>
            <path class="path-model" marker-end="url(#arr-model)" d="M180 300 C145 260 145 225 165 210" opacity=".4"/>

            <rect class="sample-node node" x="55" y="135" width="220" height="100" rx="8"/>
            <circle class="sample-mark" cx="82" cy="163" r="7"/>
            <text class="label" x="165" y="177">输入</text><text class="sub" x="165" y="205">训练样本</text>

            <rect class="model-node node" x="370" y="105" width="220" height="100" rx="8"/>
            <text class="label" x="480" y="147">猜测</text><text class="sub" x="480" y="175">当前参数算出的结果</text>

            <rect class="target-node node" x="750" y="155" width="250" height="100" rx="8"/>
            <text class="label" x="875" y="197">对照答案</text><text class="sub" x="875" y="225">找到猜测与答案的差距</text>

            <rect class="adjust-node node" x="520" y="365" width="250" height="100" rx="8"/>
            <text class="label" x="645" y="407">调参数</text><text class="sub" x="645" y="435">沿着误差变小的方向</text>

            <rect class="model-node node" x="70" y="300" width="220" height="100" rx="8"/>
            <text class="label" x="180" y="342">再猜</text><text class="sub" x="180" y="370">用改过的参数重来</text>
          </svg>
        </div>
        <div class="claim" data-claim>寻找能让误差变小的参数</div>
      </section>

      <aside class="side min0">
        <section class="panel poll" data-poll aria-labelledby="poll-title">
          <h2 id="poll-title">你觉得“学习”最像什么？</h2>
          <p class="small">全班举手，教师按一次记一人；这里只记录人数，不判对错。</p>
          <div class="poll-options">
            <div class="poll-choice" data-choice="记住答案"><button class="btn" type="button">记住答案</button><output class="count" aria-label="记住答案人数">0</output></div>
            <div class="poll-choice" data-choice="寻找规律"><button class="btn" type="button">寻找规律</button><output class="count" aria-label="寻找规律人数">0</output></div>
            <div class="poll-choice" data-choice="随机试运气"><button class="btn" type="button">随机试运气</button><output class="count" aria-label="随机试运气人数">0</output></div>
          </div>
          <div class="poll-foot"><span class="hint">每次点击只增加对应人数</span><button class="btn" type="button" data-reset>清零</button></div>
          <div class="status" data-status aria-live="polite">等待全班举手选择</div>
        </section>

        <section class="panel q objects" aria-labelledby="objects-title">
          <h2 id="objects-title">今天追踪三个对象</h2>
          <div class="object-list">
            <div class="object"><span class="mark" aria-hidden="true"></span>一个神经元</div>
            <div class="object"><span class="mark" aria-hidden="true"></span>一个误差</div>
            <div class="object"><span class="mark" aria-hidden="true"></span>一次反向调整</div>
          </div>
        </section>
      </aside>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>
  (() => {
    const root = document.querySelector('[data-poll]');
    if (!root) return;
    const choices = [...root.querySelectorAll('[data-choice]')];
    const reset = root.querySelector('[data-reset]');
    const status = root.querySelector('[data-status]');
    const claim = document.querySelector('[data-claim]');
    const initial = () => ({counts:[0,0,0], last:-1});
    let state = initial();
    let destroyed = false;

    function render(){
      choices.forEach((row,i) => {
        row.querySelector('output').textContent = state.counts[i];
        row.classList.toggle('active', state.last === i);
      });
      const total = state.counts.reduce((a,b)=>a+b,0);
      claim.classList.toggle('revealed', total > 0);
      status.textContent = total ? `已记录 ${total} 人；最近选择“${choices[state.last].dataset.choice}”` : '等待全班举手选择';
    }
    function vote(i){
      if(destroyed) return;
      const counts = state.counts.slice(); counts[i] += 1;
      state = {counts,last:i}; render();
    }
    const handlers = choices.map((row,i) => { const fn=()=>vote(i); row.querySelector('button').addEventListener('click',fn); return fn; });
    function clear(){ state=initial(); render(); }
    reset.addEventListener('click',clear);
    render();
    root.destroyPoll = () => {
      if(destroyed) return; destroyed=true;
      choices.forEach((row,i)=>row.querySelector('button').removeEventListener('click',handlers[i]));
      reset.removeEventListener('click',clear);
      delete root.destroyPoll;
    };
    Deck.init({index:1,total:20});
  })();
  </script>
</body>
</html>
