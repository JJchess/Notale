<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <title>训练与使用</title>
  <style>
    #stage{gap:18px}
    .title-stack{padding-bottom:2px}
    .lead{margin-top:8px;color:var(--muted);font-weight:600}
    .comparison-field{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 96px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;column-gap:22px;row-gap:16px}
    .case{min-width:0;min-height:0;display:flex;flex-direction:column;border-top:3px solid var(--text);border-bottom:1px solid var(--line);padding:18px 22px 16px}
    .case.training{border-top-color:var(--target)}
    .case.using{border-top-color:var(--model)}
    .case-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px}
    .case-head .small{font-size:var(--fs-label)}
    .flow{flex:1;min-height:0;display:grid;grid-template-columns:minmax(145px,.82fr) 42px minmax(190px,1fr);align-items:center;gap:12px}
    .node{min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:2px solid var(--line);border-radius:8px;padding:24px;background:var(--paper)}
    .node.input{border-color:var(--sample)}
    .node.pred{border-color:var(--model)}
    .node .tag{margin-bottom:13px}
    .datum{font-size:var(--fs-h2);font-weight:800;line-height:1.3}
    .arrow{height:3px;background:var(--model);position:relative}
    .arrow:after{content:"";position:absolute;right:-1px;top:-7px;border-left:12px solid var(--model);border-top:8px solid transparent;border-bottom:8px solid transparent}
    .answer-band{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:24px;min-height:86px}
    .answer{display:flex;align-items:baseline;gap:9px;font-size:var(--fs-sec);font-weight:750}
    .error{color:var(--target);font-size:var(--fs-body);font-weight:850}
    .absent{color:var(--muted);font-size:var(--fs-sec);font-weight:750}
    .divider{grid-column:2;grid-row:1;display:flex;align-items:center;justify-content:center}
    .divider:before{content:"";width:1px;height:86%;background:var(--line)}
    .matrix{grid-column:1 / 4;display:grid;grid-template-columns:220px 1fr 1fr;border-top:2px solid var(--text);background:rgba(248,250,250,.55)}
    .matrix>*{padding:13px 18px;border-bottom:1px solid var(--line);font-size:var(--fs-sec);line-height:1.35}
    .matrix .dim{color:var(--muted);font-weight:750}
    .matrix .hdr{font-weight:850}
    .matrix .train{color:var(--target);font-weight:800}
    .matrix .use{color:var(--model);font-weight:800}
    .foot{display:flex;justify-content:space-between;align-items:flex-start;gap:32px;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
    .foot .boundary{text-align:right}
  </style>
</head>
<body data-page="02" data-total="20">
  <div id="stage">
    <header class="title-stack">
      <div class="kicker">先分清两个时刻</div>
      <h1>训练时答案在场；使用时只给预测</h1>
      <p class="lead">同一个模型，面对答案的方式不同，任务也不同。</p>
    </header>

    <main class="comparison-field min0" aria-label="训练与使用的左右对照">
      <section class="case training min0" style="grid-column:1;grid-row:1" aria-labelledby="train-title">
        <div class="case-head"><h2 id="train-title">训练：答案在场</h2><span class="small">用答案检查预测</span></div>
        <div class="flow min0">
          <div class="node input"><span class="tag sample-text">输入</span><div class="datum">学习 <span class="num">3</span> h</div></div>
          <div class="arrow" aria-hidden="true"></div>
          <div class="node pred"><span class="tag model-text">模型预测</span><div class="datum">及格概率 <span class="num model-text">0.62</span></div></div>
        </div>
        <div class="answer-band">
          <div class="answer"><span class="target-text">真实标签</span><span class="num big sm target-text">1</span><span class="unit">及格</span></div>
          <div class="error">猜低了</div>
        </div>
      </section>

      <div class="divider" aria-hidden="true"></div>

      <section class="case using min0" style="grid-column:3;grid-row:1" aria-labelledby="use-title">
        <div class="case-head"><h2 id="use-title">使用：答案不在场</h2><span class="small">直接输出预测</span></div>
        <div class="flow min0">
          <div class="node input"><span class="tag sample-text">输入</span><div class="datum">学习 <span class="num">4</span> h</div></div>
          <div class="arrow" aria-hidden="true"></div>
          <div class="node pred"><span class="tag model-text">模型预测</span><div class="datum">及格概率 <span class="num model-text">0.78</span></div></div>
        </div>
        <div class="answer-band"><div class="absent">没有真实标签可供比较</div></div>
      </section>

      <section class="matrix" aria-label="训练与使用的同行比较">
        <div></div><div class="hdr target-text">训练</div><div class="hdr model-text">使用</div>
        <div class="dim">是否有正确答案</div><div class="train">有</div><div class="use">没有</div>
        <div class="dim">是否改参数</div><div class="train">会</div><div class="use">不会</div>
        <div class="dim">目的</div><div class="train">学参数</div><div class="use">给预测</div>
      </section>
    </main>

    <footer class="foot">
      <span>数值为教学示例，不是真实教育统计；“学习时长”不表示因果关系。</span>
      <span class="boundary">本页不讨论数据偏差或概率校准。</span>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({index:2,total:20});</script>
</body>
</html>
