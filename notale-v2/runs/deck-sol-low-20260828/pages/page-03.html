<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一个神经元：先加权，再过一道门</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/lib/katex.min.css">
  <style>
    #stage{gap:18px}
    .title-stack{height:104px}
    .title-stack h1{max-width:1100px}
    #neuron-workbench{display:grid;grid-template-rows:minmax(0,1fr) 126px;gap:16px;flex:1;min-height:0}
    #neuron-workbench .model-stage{position:relative;min-height:0;background:var(--paper);border:2px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 3px 0 rgba(46,72,82,.12)}
    #neuron-workbench svg{display:block;width:100%;height:100%}
    #neuron-workbench .wire{stroke:var(--line);stroke-width:4;fill:none}
    #neuron-workbench .wire.active{stroke:var(--model)}
    #neuron-workbench svg .node{fill:#E8EEF1;stroke:#A8B8BE;stroke-width:3}
    #neuron-workbench svg .node.cause{fill:#F8FAFA;stroke:#486B35}
    #neuron-workbench svg .node.model{fill:#F8FAFA;stroke:#145C74}
    #neuron-workbench svg .node.gate{fill:#FFF7E8;stroke:#D88416}
    #neuron-workbench svg .node.out{fill:#edf5f7;stroke:#145C74}
    #neuron-workbench .svg-label{font:700 18px var(--font-sans);fill:var(--muted)}
    #neuron-workbench .svg-value{font:800 25px var(--font-sans);fill:var(--text)}
    #neuron-workbench .svg-value.sample{fill:var(--sample)}
    #neuron-workbench .svg-value.model{fill:var(--model)}
    #neuron-workbench .svg-value.attn{fill:#A96008}
    #neuron-workbench .op{font:800 32px var(--font-num);fill:var(--text);text-anchor:middle;dominant-baseline:middle}
    #neuron-workbench .arrowhead{fill:var(--model)}
    #neuron-workbench .formula-band{position:absolute;left:32px;right:32px;bottom:22px;display:flex;align-items:center;justify-content:center;gap:26px;min-height:76px;padding:10px 20px;background:rgba(248,250,250,.94);border-top:2px solid var(--line)}
    #neuron-workbench .formula{font-size:26px;line-height:1.25;white-space:nowrap}
    #neuron-workbench .formula.z{color:var(--model)}
    #neuron-workbench .formula.y{color:#A96008}
    #neuron-workbench .formula-sep{width:1px;height:42px;background:var(--line)}
    #neuron-workbench .control-rail{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center;padding:17px 22px}
    #neuron-workbench .slider-wrap{display:grid;grid-template-columns:185px minmax(300px,1fr) 94px;gap:16px;align-items:center}
    #neuron-workbench .slider-label{font-size:var(--fs-sec);font-weight:800}
    #neuron-workbench output{font-family:var(--font-num);font-size:22px;font-weight:800;color:var(--sample);text-align:right}
    #neuron-workbench .rail-actions{display:flex;align-items:center;gap:18px}
    #neuron-workbench .boundary{font-size:var(--fs-label);line-height:1.35;color:var(--muted);max-width:360px}
    #neuron-workbench .future{position:absolute;right:26px;top:20px;color:var(--muted);font-size:var(--fs-label);line-height:1.35;text-align:right}
    @media (prefers-reduced-motion:no-preference){#neuron-workbench .wire.active{transition:stroke-width 120ms ease}#neuron-workbench .node.out{transition:fill 120ms ease}}
  </style>
</head>
<body data-page="03" data-total="20">
  <div id="stage">
    <header class="title-stack">
      <div class="kicker">前向计算 · 一次猜测</div>
      <h1>一个神经元：先加权，再过一道门</h1>
    </header>

    <main id="neuron-workbench" aria-label="单个神经元前向计算工作台">
      <section class="model-stage min0" aria-label="从输入到输出的计算路径">
        <div class="future">本页只看前向计算<br><span>权重和偏置从哪里来，第 8 页回答</span></div>
        <svg viewBox="0 0 1488 570" role="img" aria-labelledby="diagram-title diagram-desc">
          <title id="diagram-title">单个神经元的前向计算</title>
          <desc id="diagram-desc">学习时间乘以固定权重，再加固定偏置得到 z，随后通过 sigmoid 得到预测值。</desc>
          <defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="arrowhead" d="M0 0L10 5L0 10Z"/></marker></defs>
          <path class="wire active" d="M250 246 H408" marker-end="url(#flow-arrow)"/>
          <path class="wire active" d="M582 246 H700" marker-end="url(#flow-arrow)"/>
          <path class="wire" d="M788 112 V178" marker-end="url(#flow-arrow)"/>
          <path class="wire active" d="M876 246 H1010" marker-end="url(#flow-arrow)"/>
          <path class="wire active" d="M1190 246 H1292" marker-end="url(#flow-arrow)"/>

          <rect class="node cause" x="46" y="183" width="204" height="126" rx="8"/>
          <text class="svg-label" x="148" y="221" text-anchor="middle">输入</text>
          <text id="svg-x" class="svg-value sample" x="148" y="269" text-anchor="middle">学习时间 x = 3.0 h</text>

          <rect class="node model" x="408" y="183" width="174" height="126" rx="8"/>
          <text class="svg-label" x="495" y="221" text-anchor="middle">乘以</text>
          <text class="svg-value model" x="495" y="269" text-anchor="middle">权重 w = 0.8</text>

          <circle class="node model" cx="788" cy="246" r="88"/>
          <text class="op" x="788" y="250">+</text>
          <rect class="node" x="682" y="30" width="212" height="82" rx="8"/>
          <text class="svg-label" x="788" y="61" text-anchor="middle">加上</text>
          <text class="svg-value" x="788" y="91" text-anchor="middle">偏置 b = −1.0</text>

          <rect class="node gate" x="1010" y="177" width="180" height="138" rx="8"/>
          <text class="svg-label" x="1100" y="216" text-anchor="middle">过一道门</text>
          <text class="svg-value attn" x="1100" y="258" text-anchor="middle">sigmoid</text>
          <text id="svg-z" class="svg-label" x="1100" y="289" text-anchor="middle">输入 z = 1.4</text>

          <rect class="node out" x="1292" y="183" width="150" height="126" rx="8"/>
          <text class="svg-label" x="1367" y="221" text-anchor="middle">猜测</text>
          <text id="svg-y" class="svg-value model" x="1367" y="270" text-anchor="middle">ŷ = 0.802</text>
        </svg>
        <div class="formula-band" aria-label="实时计算公式">
          <div id="formula-z" class="formula z">z=wx+b=3\times0.8-1.0=1.4</div>
          <div class="formula-sep" aria-hidden="true"></div>
          <div id="formula-y" class="formula y">\hat y=\sigma(z)=\frac{1}{1+e^{-1.4}}=0.802</div>
        </div>
      </section>

      <section class="panel control-rail" aria-label="输入控制">
        <div class="slider-wrap min0">
          <label class="slider-label" for="x-slider">调整学习时间 x</label>
          <input id="x-slider" type="range" min="0" max="6" step="0.1" value="3" aria-describedby="range-note">
          <output id="x-output" for="x-slider">3.0 h</output>
        </div>
        <div class="rail-actions">
          <div id="range-note" class="boundary">范围 0–6 h，步长 0.1 h。教学模型，不是现实中的及格预测器。</div>
          <button id="reset" class="btn" type="button">复位到 3 h</button>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/lib/katex.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
  (()=>{
    const root=document.getElementById('neuron-workbench');
    const q=s=>root.querySelector(s);
    const slider=q('#x-slider'), reset=q('#reset'), output=q('#x-output');
    output.setAttribute('aria-live','polite');
    const sx=q('#svg-x'), sz=q('#svg-z'), sy=q('#svg-y'), fz=q('#formula-z'), fy=q('#formula-y');
    const initial=3; let state={x:initial}; let destroyed=false;
    const calc=x=>{const z=x*0.8-1;return {z,y:1/(1+Math.exp(-z))}};
    const n1=v=>(Math.abs(v)<0.00001?0:v).toFixed(1);
    function render(){
      const {z,y}=calc(state.x), xs=state.x.toFixed(1), zs=n1(z), ys=y.toFixed(3);
      slider.value=state.x; output.textContent=xs+' h'; sx.textContent='学习时间 x = '+xs+' h'; sz.textContent='输入 z = '+zs; sy.textContent='ŷ = '+ys;
      const xf=Number(xs).toString();
      katex.render(`z=wx+b=${xf}\\times0.8-1.0=${zs}`,fz,{throwOnError:false,displayMode:false});
      katex.render(`\\hat y=\\sigma(z)=\\frac{1}{1+e^{-${zs}}}=${ys}`,fy,{throwOnError:false,displayMode:false});
    }
    function setX(value){if(destroyed)return;state={x:Math.max(0,Math.min(6,Math.round(value*10)/10))};render()}
    const onInput=()=>setX(Number(slider.value));
    const onChange=()=>setX(Number(slider.value),true);
    const onReset=()=>setX(initial,true);
    slider.addEventListener('input',onInput);slider.addEventListener('change',onChange);reset.addEventListener('click',onReset);
    render(); Deck.init({index:3,total:20});
    root.destroyNeuronWorkbench=()=>{if(destroyed)return;destroyed=true;slider.removeEventListener('input',onInput);slider.removeEventListener('change',onChange);reset.removeEventListener('click',onReset);delete root.destroyNeuronWorkbench};
  })();
  </script>
</body>
</html>
