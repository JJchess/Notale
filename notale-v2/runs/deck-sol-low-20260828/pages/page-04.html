<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>权重决定输入有多大影响</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:18px}
    .title-stack{flex:0 0 auto}
    .title-stack .lead{margin-top:8px;color:var(--muted)}
    .lab{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(360px,.55fr);gap:26px;flex:1;min-height:0}
    .chart-panel{display:flex;flex-direction:column;min-height:0;padding:18px 22px 14px}
    .chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex:0 0 auto}
    .formula{font-family:var(--font-num);font-size:var(--fs-lead);font-weight:750;color:var(--model)}
    .chart-wrap{flex:1;min-height:0;margin-top:4px}
    .caption{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-top:2px;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
    .side{display:flex;flex-direction:column;gap:16px;min-height:0}
    .control-panel h2,.question h2{margin-bottom:12px}
    .weight-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
    .weight-buttons .btn{padding-left:8px;padding-right:8px;font-family:var(--font-num)}
    .readout{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
    .readout-line{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-top:7px}
    .direction{font-size:var(--fs-lead);font-weight:800;color:var(--model)}
    .question{flex:1;display:flex;flex-direction:column;justify-content:center}
    .sentence{font-size:var(--fs-lead);line-height:1.65;font-weight:750;margin:5px 0 18px}
    .blank{display:inline-block;min-width:104px;text-align:center;color:var(--target);border-bottom:3px solid var(--target);font-weight:850}
    .feedback{min-height:54px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);color:var(--target);font-size:var(--fs-sec);line-height:1.45;font-weight:750}
    .boundary{padding:12px 16px;border-top:2px solid var(--line);font-size:var(--fs-sec);line-height:1.4;color:var(--muted)}
  </style>
</head>
<body data-page="04" data-total="20">
  <div id="stage">
    <header class="title-stack">
      <div class="kicker">一个神经元 · 加权和</div>
      <h1>权重决定输入有多大影响</h1>
      <p class="lead">固定偏置 <span class="num">b = −1.0</span>，只改变权重，观察直线的方向与陡峭程度。</p>
    </header>

    <main class="lab min0">
      <figure class="panel chart-panel min0" aria-labelledby="chart-title chart-caption">
        <div class="chart-head">
          <div>
            <h2 id="chart-title">学习时间如何改变加权和</h2>
            <p class="small">横轴：学习时间 x（h）　纵轴：加权和 z</p>
          </div>
          <div id="formula" class="formula" aria-live="polite">z = 0.8x − 1.0</div>
        </div>
        <div id="chart" class="chart-wrap min0" role="img" aria-label="坐标图：当前权重为 0.8，加权和随学习时间增加而增大"></div>
        <figcaption id="chart-caption" class="caption">
          <span>直线遵循 <span class="num">z = wx + b</span>；每次只显示一个权重。</span>
          <span id="endpoint">从 z = −1.0 到 z = 3.8</span>
        </figcaption>
      </figure>

      <aside class="side min0">
        <section class="panel control-panel">
          <h2>切换权重 w</h2>
          <div class="weight-buttons" role="group" aria-label="选择权重">
            <button class="btn" type="button" data-w="-0.8" aria-pressed="false">w = −0.8</button>
            <button class="btn" type="button" data-w="0" aria-pressed="false">w = 0</button>
            <button class="btn" type="button" data-w="0.8" aria-pressed="true">w = 0.8</button>
          </div>
          <div class="readout" aria-live="polite">
            <div class="small">当前观察</div>
            <div class="readout-line"><span class="num">x 每增加 1 h</span><span id="delta" class="direction">z 增加 0.8</span></div>
          </div>
        </section>

        <section class="panel q question">
          <h2>补全这句话</h2>
          <p class="sentence">w 为正时，x 增大，z 会 <span id="blank" class="blank">______</span>。</p>
          <div class="btns">
            <button id="reveal" class="btn" type="button">揭示答案</button>
            <button id="reset" class="btn" type="button">恢复初始状态</button>
          </div>
          <div id="feedback" class="feedback" aria-live="polite">先切换三种权重，比较直线方向。</div>
        </section>
      </aside>
    </main>

    <footer class="boundary">这里只看加权和 z 与直线斜率；本页不经过 sigmoid，也不把 z 当作预测概率。</footer>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script>
    Deck.init({index:4,total:20});
    const records = Object.freeze([
      {id:'neg', w:-0.8}, {id:'zero', w:0}, {id:'pos', w:0.8}
    ]);
    const initial = Object.freeze({w:0.8,revealed:false});
    let state = {...initial};
    const host = document.getElementById('chart');
    const chart = echarts.init(host, null, {renderer:'svg'});
    const buttons = [...document.querySelectorAll('[data-w]')];
    const fmt = n => (n < 0 ? '−' : '') + Math.abs(n).toFixed(1);

    function points(w){
      const out=[];
      for(let x=0;x<=6;x+=0.25){
        const z=w*x-1;
        if(z>=-3 && z<=5) out.push([x,z]);
      }
      return out;
    }
    function render(s){
      const w=s.w;
      const end=w*6-1;
      const direction=w>0?'增加 0.8':w<0?'减少 0.8':'保持不变';
      buttons.forEach(b=>b.setAttribute('aria-pressed', String(Number(b.dataset.w)===w)));
      document.getElementById('formula').textContent=`z = ${fmt(w)}x − 1.0`;
      document.getElementById('delta').textContent=`z ${direction}`;
      document.getElementById('endpoint').textContent=`从 z = −1.0 到 z = ${fmt(end)}`;
      host.setAttribute('aria-label',`坐标图：当前权重为 ${fmt(w)}，加权和随学习时间${w>0?'增加而增大':w<0?'增加而减小':'增加但保持不变'}`);
      document.getElementById('blank').textContent=s.revealed?'增大':'______';
      document.getElementById('feedback').textContent=s.revealed?'答案：增大。正权重使直线向右上方倾斜。':'先切换三种权重，比较直线方向。';
      document.getElementById('reveal').setAttribute('aria-pressed',String(s.revealed));
      chart.setOption({
        animationDuration: Deck.reduced()?0:260,
        textStyle:{fontFamily:'Noto Sans CJK SC, Microsoft YaHei, sans-serif',fontSize:16,color:'#17262D'},
        grid:{left:78,right:34,top:34,bottom:62},
        tooltip:{trigger:'axis',textStyle:{fontSize:16},formatter:p=>`x = ${Number(p[0].value[0]).toFixed(1)} h<br>z = ${Number(p[0].value[1]).toFixed(1)}`},
        xAxis:{type:'value',min:0,max:6,interval:1,name:'学习时间 x（h）',nameLocation:'middle',nameGap:38,nameTextStyle:{fontSize:16,fontWeight:700,color:'#17262D'},axisLabel:{fontSize:15,color:'#526770'},axisLine:{lineStyle:{color:'#17262D',width:2}},splitLine:{lineStyle:{color:'#D2DDE1'}}},
        yAxis:{type:'value',min:-3,max:5,interval:1,name:'加权和 z',nameLocation:'middle',nameGap:48,nameTextStyle:{fontSize:16,fontWeight:700,color:'#17262D'},axisLabel:{fontSize:15,color:'#526770'},axisLine:{show:true,lineStyle:{color:'#17262D',width:2}},splitLine:{lineStyle:{color:'#D2DDE1'}}},
        series:[{id:'weight-line',name:`w = ${fmt(w)}`,type:'line',data:points(w),showSymbol:false,clip:true,lineStyle:{color:'#145C74',width:6},markPoint:{silent:true,symbol:'circle',symbolSize:14,label:{show:false},itemStyle:{color:'#D88416'},data:[{coord:[0,-1]}]}}]
      },{notMerge:true});
    }
    function setState(patch){state={...state,...patch};render(state)}
    buttons.forEach(b=>b.addEventListener('click',()=>setState({w:Number(b.dataset.w)})));
    document.getElementById('reveal').addEventListener('click',()=>setState({revealed:true}));
    document.getElementById('reset').addEventListener('click',()=>{state={...initial};render(state)});
    const ro=new ResizeObserver(()=>chart.resize());ro.observe(host);
    window.addEventListener('pagehide',()=>{ro.disconnect();chart.dispose()},{once:true});
    render(state);
  </script>
</body>
</html>
