<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .page{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:18px;flex:1;min-height:0}
    .head{display:flex;align-items:end;justify-content:space-between;gap:28px}
    .head .small{max-width:520px;text-align:right}
    .lab{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px;min-height:0}
    .figure{margin:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px;min-height:0}
    #chart{width:100%;height:100%;min-height:0}
    figcaption{font-size:var(--fs-label);line-height:1.4;color:var(--muted);padding-left:4px}
    .controls{display:flex;flex-direction:column;gap:18px;justify-content:center}
    .readout{border-bottom:1px solid var(--line);padding-bottom:18px}
    .readout .label{font-size:var(--fs-label);color:var(--muted);font-weight:800;margin-bottom:8px}
    .formula{font-family:var(--font-num);font-size:var(--fs-lead);line-height:1.45;font-weight:700}
    .gate{display:flex;align-items:baseline;gap:8px;margin-top:10px}
    .gate .big{color:var(--attention)}
    .slider-block{display:flex;flex-direction:column;gap:8px}
    .slider-top{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--fs-label);font-weight:800}
    .slider-top output{font-family:var(--font-num);font-size:var(--fs-lead);color:var(--target)}
    .range-ends{display:flex;justify-content:space-between;color:var(--muted);font:700 var(--fs-label)/1 var(--font-num)}
    .conclusion{display:flex;align-items:center;justify-content:space-between;gap:24px;border-top:2px solid var(--text);padding-top:15px}
    .conclusion p{font-size:var(--fs-lead);font-weight:800}
    .fallback{margin:0;padding-left:20px;color:var(--muted)}
    .fallback li{font-size:var(--fs-label);line-height:1.45}
  </style>
</head>
<body data-page="05" data-total="20">
  <div id="stage">
    <main class="page">
      <header class="head">
        <div class="title-stack">
          <div class="kicker">单个神经元 · 偏置</div>
          <h1>偏置决定门槛向哪里移</h1>
        </div>
        <p class="small">固定 <span class="num">w = 1.2</span>。拖动图中的门槛线，或调整偏置滑块。</p>
      </header>

      <section class="lab min0" aria-label="偏置与门槛位置实验">
        <figure class="figure panel min0" aria-labelledby="chart-caption">
          <div id="chart" role="img" aria-label="横轴为输入小时，纵轴为 sigmoid 输出。橙色竖线表示输出等于零点五时的观察位置。"></div>
          <figcaption id="chart-caption"><span class="target-text">ŷ = 0.5</span> 只是本例的观察线，不代表普遍正确的分类阈值。</figcaption>
        </figure>

        <aside class="panel controls min0">
          <div class="readout" aria-live="polite">
            <div class="label">当前计算</div>
            <div class="formula">ŷ = σ(1.2x + b)</div>
            <div class="gate"><span class="big" id="gateValue">2.0</span><span class="unit">h</span></div>
            <p class="small">当 ŷ = 0.5，门槛位置 x = −b / w</p>
          </div>

          <label class="slider-block" for="bias">
            <span class="slider-top"><span>调整偏置 b</span><output id="biasValue">−2.4</output></span>
            <input id="bias" type="range" min="-4" max="1" step="0.1" value="-2.4" aria-describedby="dragHint">
            <span class="range-ends"><span>−4.0</span><span>1.0</span></span>
          </label>
          <p id="dragHint" class="hint">门槛线可左右拖动；可见范围外时，读数仍按公式计算。</p>
          <button class="btn" id="reset" type="button">复位到 b = −2.4</button>
          <ul class="fallback" aria-label="当前数值摘要">
            <li>权重固定为 <span class="num">1.2</span></li>
            <li id="summary">偏置 −2.4，门槛位于 2.0 h</li>
          </ul>
        </aside>
      </section>

      <footer class="conclusion">
        <p>权重改变倾斜程度，偏置平移判断门槛</p>
        <span class="tag">本页只讨论单输入</span>
      </footer>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script>
    Deck.init({index:5,total:20});
    const W = 1.2;
    const initial = { b: -2.4 };
    let state = {...initial};
    const host = document.getElementById('chart');
    const slider = document.getElementById('bias');
    const biasValue = document.getElementById('biasValue');
    const gateValue = document.getElementById('gateValue');
    const summary = document.getElementById('summary');
    const chart = echarts.init(host, null, {renderer:'svg'});
    const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const fmtSigned = v => (v < 0 ? '−' : '') + Math.abs(v).toFixed(1);
    const curve = b => Array.from({length:121}, (_,i) => {
      const x=i/20; return [x, 1/(1+Math.exp(-(W*x+b)))];
    });
    function option(s){
      const gate=-s.b/W;
      return {
        animation:false,
        textStyle:{fontFamily:css('--font-sans'),fontSize:16,color:css('--text')},
        grid:{left:72,right:34,top:38,bottom:58},
        tooltip:{show:false},
        xAxis:{type:'value',min:0,max:6,interval:1,name:'输入 x（h）',nameLocation:'middle',nameGap:38,nameTextStyle:{fontSize:15,fontWeight:700},axisLabel:{fontSize:13},axisLine:{show:true,lineStyle:{color:'#17262D',width:2}},axisTick:{show:true,lineStyle:{color:'#17262D'}},splitLine:{show:false}},
        yAxis:{type:'value',min:0,max:1,interval:.25,name:'输出 ŷ',nameGap:18,nameTextStyle:{fontSize:15,fontWeight:700},axisLabel:{fontSize:13,formatter:v=>v.toFixed(2)},axisLine:{show:true,lineStyle:{color:'#17262D',width:2}},axisTick:{show:true,lineStyle:{color:'#17262D'}},splitLine:{show:true,lineStyle:{color:'#A8B8BE',width:1}}},
        series:[
          {id:'curve',name:'sigmoid 输出',type:'line',data:curve(s.b),showSymbol:false,smooth:false,lineStyle:{color:'#145C74',width:6,opacity:1}},
          {id:'observe',name:'0.5 观察线',type:'line',data:[[0,.5],[6,.5]],showSymbol:false,silent:true,lineStyle:{color:'#A53F2B',width:3,type:'dashed',opacity:1},endLabel:{show:true,formatter:'ŷ = 0.5',color:'#A53F2B',fontSize:15,fontWeight:700}},
          {id:'gate',name:'门槛',type:'line',data: gate>=0&&gate<=6 ? [[gate,0],[gate,1]] : [],showSymbol:false,lineStyle:{color:'#D88416',width:6,opacity:1},markPoint: gate>=0&&gate<=6 ? {silent:true,symbol:'circle',symbolSize:14,itemStyle:{color:'#D88416'},label:{show:true,formatter:'拖动门槛',position:'top',fontSize:15,fontWeight:700,color:'#A96008'},data:[{coord:[gate,.5]}]} : undefined}
        ]
      };
    }
    function render(){
      const gate=-state.b/W;
      slider.value=state.b.toFixed(1);
      biasValue.textContent=fmtSigned(state.b);
      gateValue.textContent=gate.toFixed(1);
      summary.textContent=`偏置 ${fmtSigned(state.b)}，门槛位于 ${gate.toFixed(1)} h`;
      chart.setOption(option(state),{notMerge:true});
    }
    function setState(patch){ state={...state,...patch}; render(); }
    slider.addEventListener('input',()=>setState({b:Number(slider.value)}));
    document.getElementById('reset').addEventListener('click',()=>setState(initial));
    let dragging=false;
    const zr=chart.getZr();
    zr.on('mousedown',e=>{ const p=chart.convertFromPixel({xAxisIndex:0},[e.offsetX,e.offsetY]); if(p&&Math.abs(p[0]-(-state.b/W))<.35) dragging=true; });
    zr.on('mousemove',e=>{ if(!dragging)return; const p=chart.convertFromPixel({xAxisIndex:0},[e.offsetX,e.offsetY]); if(!p)return; const b=Math.max(-4,Math.min(1,Math.round((-W*p[0])*10)/10)); setState({b}); });
    zr.on('mouseup',()=>dragging=false); zr.on('globalout',()=>dragging=false);
    const ro=new ResizeObserver(()=>chart.resize()); ro.observe(host);
    window.addEventListener('pagehide',()=>{ro.disconnect();chart.dispose();},{once:true});
    render();
  </script>
</body>
</html>
