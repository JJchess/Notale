<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/lib/katex.min.css">
  <style>
    #stage{gap:22px}
    .page-head{flex:0 0 auto}
    .page-head .lead{margin-top:10px;color:var(--muted)}
    #sigmoid-widget{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.88fr) minmax(0,1.42fr);gap:32px}
    #sigmoid-widget .concept{display:flex;flex-direction:column;gap:18px;min-height:0}
    #sigmoid-widget .formula{font-size:24px;min-height:45px;display:flex;align-items:center;color:var(--model)}
    #sigmoid-widget .nest{flex:1;min-height:0;border:2px solid var(--text);border-radius:8px;padding:22px;display:flex;flex-direction:column;background:transparent}
    #sigmoid-widget .nest-title{font-size:var(--fs-sec);font-weight:800;color:var(--muted)}
    #sigmoid-widget .range-line{position:relative;height:54px;margin:26px 4px 18px;border-top:3px solid var(--text)}
    #sigmoid-widget .range-line:before,#sigmoid-widget .range-line:after{position:absolute;top:-17px;font:700 var(--fs-sec) var(--font-num);color:var(--text)}
    #sigmoid-widget .range-line:before{content:'−∞';left:0}.range-line:after{content:'+∞';right:0}
    #sigmoid-widget .range-line i{position:absolute;right:-1px;top:-9px;border-left:13px solid var(--text);border-top:8px solid transparent;border-bottom:8px solid transparent}
    #sigmoid-widget .inner{margin:auto 18px 8px;border:2px solid var(--model);border-radius:8px;padding:24px 20px;background:var(--paper);text-align:center}
    #sigmoid-widget .inner strong{display:block;font-size:var(--fs-h2);color:var(--model);margin-bottom:10px}
    #sigmoid-widget .bounded{position:relative;height:12px;margin:24px 18px 6px;background:var(--line)}
    #sigmoid-widget .bounded:before,#sigmoid-widget .bounded:after{position:absolute;top:-12px;width:4px;height:36px;background:var(--model);content:''}
    #sigmoid-widget .bounded:before{left:0}#sigmoid-widget .bounded:after{right:0}
    #sigmoid-widget .ends{display:flex;justify-content:space-between;font:700 var(--fs-sec) var(--font-num)}
    #sigmoid-widget .plot-side{display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:14px;min-height:0}
    #sigmoid-widget .plot{background:var(--paper);border:2px solid var(--line);border-radius:8px;min-height:0;width:100%;height:100%}
    #sigmoid-widget .grid{stroke:var(--line);stroke-width:1}.axis{stroke:var(--text);stroke-width:2}.curve{fill:none;stroke:var(--model);stroke-width:5}.guide{stroke:var(--attention);stroke-width:2;stroke-dasharray:7 6}.active-dot{fill:var(--attention);stroke:var(--text);stroke-width:2}
    #sigmoid-widget .svg-label{font:700 15px var(--font-sans);fill:var(--muted)}#sigmoid-widget .svg-num{font:700 15px var(--font-num);fill:var(--text)}
    #sigmoid-widget .values{display:flex;gap:10px;align-items:stretch}
    #sigmoid-widget .z-btn{flex:1;min-width:0;border:2px solid var(--line);border-radius:6px;background:var(--paper);padding:10px 8px;color:var(--text);cursor:pointer;font-size:var(--fs-label);line-height:1.35;font-weight:750}
    #sigmoid-widget .z-btn span{display:block;font-family:var(--font-num);font-weight:700;color:var(--muted);margin-top:3px}
    #sigmoid-widget .z-btn:hover{border-color:var(--attention)}#sigmoid-widget .z-btn[aria-pressed="true"]{border-color:var(--attention);background:#FFF1D8;color:#714000}
    #sigmoid-widget .z-btn:focus-visible,#sigmoid-widget .reset:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
    #sigmoid-widget .readout{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:2px solid var(--line);padding-top:12px}
    #sigmoid-widget .reading{font-size:var(--fs-sec);font-weight:800}.reading .num{color:var(--attention)}
    #sigmoid-widget .message{color:var(--muted);font-size:var(--fs-sec);font-weight:700}
    #sigmoid-widget .reset{border:0;background:transparent;color:var(--model);font-size:var(--fs-label);font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
  </style>
</head>
<body data-page="06" data-total="20">
  <div id="stage">
    <header class="page-head title-stack">
      <div class="kicker">为什么还要 sigmoid</div>
      <h1>把任意实数压到 0 与 1 之间</h1>
      <p class="lead">加权和没有边界；sigmoid 把它变成可解释为 0 到 1 的输出。</p>
    </header>

    <main id="sigmoid-widget" data-sigmoid-widget>
      <section class="concept min0" aria-label="输入与输出的包含关系">
        <div class="formula" data-formula>σ(z)=1/(1+e^-z)</div>
        <div class="nest">
          <div class="nest-title">加权和 z：可从负无穷到正无穷</div>
          <div class="range-line" aria-hidden="true"><i></i></div>
          <div class="inner">
            <strong>输出 ŷ：0 到 1</strong>
            <p class="small">同一个公式，把整条实数轴映射进有限区间。</p>
            <div class="bounded" aria-hidden="true"></div>
            <div class="ends"><span>0</span><span>1</span></div>
          </div>
        </div>
        <p class="note">这里用 sigmoid 解释输出压缩；隐藏层还可以使用其他激活函数。</p>
      </section>

      <section class="plot-side min0" aria-label="sigmoid 曲线交互">
        <svg class="plot" viewBox="0 0 850 455" role="img" aria-labelledby="plot-title plot-desc">
          <title id="plot-title">sigmoid 曲线</title>
          <desc id="plot-desc">选择下方任一 z 值，活动点会移动到相应的 sigmoid 输出。</desc>
          <line class="grid" x1="82" y1="58" x2="802" y2="58"/><line class="grid" x1="82" y1="224" x2="802" y2="224"/><line class="grid" x1="82" y1="390" x2="802" y2="390"/>
          <line class="axis" x1="82" y1="390" x2="810" y2="390"/><line class="axis" x1="82" y1="398" x2="82" y2="48"/>
          <text class="svg-label" x="822" y="425">z</text><text class="svg-label" x="35" y="58">ŷ</text>
          <text class="svg-num" x="52" y="395">0</text><text class="svg-num" x="40" y="229">0.5</text><text class="svg-num" x="52" y="63">1</text>
          <text class="svg-num" x="74" y="425">−5</text><text class="svg-num" x="435" y="425">0</text><text class="svg-num" x="790" y="425">5</text>
          <path class="curve" data-curve d=""/>
          <line class="guide" data-vline x1="0" y1="0" x2="0" y2="390"/><line class="guide" data-hline x1="82" y1="0" x2="0" y2="0"/>
          <circle class="active-dot" data-dot cx="0" cy="0" r="10"/>
        </svg>
        <div class="values" role="group" aria-label="选择加权和 z">
          <button class="z-btn" data-z="-4" type="button">z = −4<span>ŷ = 0.018</span></button>
          <button class="z-btn" data-z="-1" type="button">z = −1<span>ŷ = 0.269</span></button>
          <button class="z-btn" data-z="0" type="button" aria-pressed="true">z = 0<span>ŷ = 0.500</span></button>
          <button class="z-btn" data-z="1" type="button">z = 1<span>ŷ = 0.731</span></button>
          <button class="z-btn" data-z="4" type="button">z = 4<span>ŷ = 0.982</span></button>
        </div>
        <div class="readout" data-status aria-live="polite">
          <div><div class="reading">当前：z = <span class="num" data-zout>0</span>，ŷ = <span class="num" data-yout>0.500</span></div><div class="message" data-message>曲线中央变化最明显。</div></div>
          <button class="reset" data-reset type="button">回到 z = 0</button>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/lib/katex.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
  (()=>{
    Deck.init({index:6,total:20});
    const root=document.querySelector('[data-sigmoid-widget]');
    const q=s=>root.querySelector(s), qa=s=>[...root.querySelectorAll(s)];
    const curve=q('[data-curve]'),dot=q('[data-dot]'),vl=q('[data-vline]'),hl=q('[data-hline]');
    const zout=q('[data-zout]'),yout=q('[data-yout]'),message=q('[data-message]'),status=q('[data-status]');
    const buttons=qa('[data-z]'); let state={z:0}; let destroyed=false;
    const sx=z=>82+(z+5)/10*720, sy=y=>390-y*332, sig=z=>1/(1+Math.exp(-z));
    curve.setAttribute('d',Array.from({length:101},(_,i)=>{const z=-5+i/10;return `${i?'L':'M'}${sx(z).toFixed(1)},${sy(sig(z)).toFixed(1)}`}).join(' '));
    function render(announce=false){const y=sig(state.z),x=sx(state.z),py=sy(y);dot.setAttribute('cx',x);dot.setAttribute('cy',py);vl.setAttribute('x1',x);vl.setAttribute('x2',x);vl.setAttribute('y1',py);hl.setAttribute('y1',py);hl.setAttribute('y2',py);hl.setAttribute('x2',x);zout.textContent=state.z<0?'−'+Math.abs(state.z):String(state.z);yout.textContent=y.toFixed(3);buttons.forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.z)===state.z)));message.textContent=Math.abs(state.z)>=4?'越接近两端，曲线越平。':'曲线中央变化最明显。';if(announce)status.setAttribute('aria-label',`z 等于 ${state.z}，输出为 ${y.toFixed(3)}。${message.textContent}`)}
    function setZ(z,announce=true){if(destroyed)return;state={z};render(announce)}
    const handlers=buttons.map(b=>{const h=()=>setZ(Number(b.dataset.z));b.addEventListener('click',h);return [b,h]});
    const reset=q('[data-reset]'),onReset=()=>setZ(0);reset.addEventListener('click',onReset);
    katex.render('\\sigma(z)=\\frac{1}{1+e^{-z}}',q('[data-formula]'),{throwOnError:false});render();
    root.destroySigmoidWidget=()=>{if(destroyed)return;destroyed=true;handlers.forEach(([b,h])=>b.removeEventListener('click',h));reset.removeEventListener('click',onReset);delete root.destroySigmoidWidget};
  })();
  </script>
</body>
</html>
