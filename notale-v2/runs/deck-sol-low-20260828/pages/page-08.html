<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>学习，就是沿着损失较小的方向改参数</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:18px;box-sizing:border-box}
    #loss-widget,#loss-widget *{box-sizing:border-box}
    .title-stack{gap:0}
    .title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
    .fixed-note{font-size:var(--fs-sec);color:var(--muted);padding-bottom:5px;white-space:nowrap}
    #loss-widget{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;flex:1;min-height:0}
    #loss-widget .terrain{position:relative;min-width:0;min-height:0;background:var(--paper);border:2px solid var(--line);border-radius:8px;box-shadow:0 3px 0 rgba(46,72,82,.12);overflow:hidden}
    #loss-widget svg{display:block;width:100%;height:100%;touch-action:none}
    #loss-widget .axis path,#loss-widget .axis line{stroke:var(--line)}
    #loss-widget .axis text{fill:var(--muted);font:13px var(--font-num)}
    #loss-widget .curve{fill:none;stroke:var(--model);stroke-width:5;stroke-linecap:round}
    #loss-widget .drop{stroke:var(--attention);stroke-width:2;stroke-dasharray:7 6}
    #loss-widget .trail{fill:none;stroke:var(--target);stroke-width:3;stroke-dasharray:4 7;opacity:.75}
    #loss-widget .foot{fill:var(--paper);stroke:var(--target);stroke-width:3}
    #loss-widget .current{fill:var(--attention);stroke:var(--text);stroke-width:3}
    #loss-widget .handle-ring{fill:transparent;stroke:var(--attention);stroke-width:3}
    #loss-widget .hit{fill:transparent;cursor:grab}
    #loss-widget .hit:active{cursor:grabbing}
    #loss-widget .axis-label{fill:var(--text);font:700 17px var(--font-sans)}
    #loss-widget .annotation{fill:var(--muted);font:700 15px var(--font-sans)}
    #loss-widget .side{display:flex;flex-direction:column;gap:16px;min-height:0}
    #loss-widget .readout{display:flex;flex-direction:column;gap:18px}
    #loss-widget .metric{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:12px}
    #loss-widget .metric:last-child{border-bottom:0;padding-bottom:0}
    #loss-widget .metric-label{font-size:var(--fs-sec);font-weight:750;color:var(--muted)}
    #loss-widget .metric-value{font-family:var(--font-num);font-size:38px;line-height:1;font-weight:750;font-variant-numeric:tabular-nums}
    #loss-widget .formula{font-size:var(--fs-sec);line-height:1.5;color:var(--muted)}
    #loss-widget .formula strong{color:var(--text)}
    #loss-widget .controls{margin-top:auto;display:flex;flex-direction:column;gap:12px}
    #loss-widget .controls .btn{width:100%}
    #loss-widget .step-btn{background:var(--model);border-color:var(--model);color:white;min-height:54px;font-size:var(--fs-sec)}
    #loss-widget .step-btn:hover{border-color:var(--attention)}
    #loss-widget .range-wrap{display:grid;gap:7px;min-width:0}
    #loss-widget input[type=range]{width:calc(100% - 4px)}
    #loss-widget .range-head{display:flex;justify-content:space-between;font-size:var(--fs-label);font-weight:750;color:var(--muted)}
    #loss-widget .status{min-height:46px;border-top:2px solid var(--line);padding-top:10px;font-size:var(--fs-sec);line-height:1.4;font-weight:700}
  </style>
</head>
<body data-page="08" data-total="20">
  <div id="stage">
    <header class="title-stack">
      <div class="kicker">一维地形实验</div>
      <div class="title-row">
        <h1>学习，就是沿着损失较小的方向改参数</h1>
        <div class="fixed-note">固定样本：<span class="num">x = 2，y = 1，b = −1</span></div>
      </div>
    </header>

    <main id="loss-widget" aria-label="权重与交叉熵损失实验">
      <section class="terrain min0" aria-label="损失地形">
        <svg data-chart role="img" aria-labelledby="chart-title chart-desc">
          <title id="chart-title">权重 w 对交叉熵损失 L 的影响</title>
          <desc id="chart-desc">拖动曲线上的活动游标改变权重。曲线从左上方向右下方下降，脚印记录走一小步后的路径。</desc>
        </svg>
      </section>
      <aside class="side min0">
        <div class="panel readout">
          <div class="metric"><span class="metric-label">权重 w</span><output class="metric-value attention-text" data-w>−0.500</output></div>
          <div class="metric"><span class="metric-label">预测 ŷ</span><output class="metric-value model-text" data-yhat>0.119</output></div>
          <div class="metric"><span class="metric-label">损失 L</span><output class="metric-value target-text" data-loss>2.127</output></div>
        </div>
        <p class="formula"><strong>L(w) = −ln[σ(2w−1)]</strong><br>拖动游标比较坡高；按钮按当前坡度更新 w。</p>
        <div class="controls">
          <div class="range-wrap">
            <div class="range-head"><label for="w-range">精确调整权重</label><span>−2 到 3</span></div>
            <input id="w-range" data-range type="range" min="-2" max="3" step="0.01" value="-0.5" aria-label="权重 w">
          </div>
          <button class="btn step-btn" type="button" data-step>走一小步</button>
          <button class="btn" type="button" data-reset>复位</button>
          <div class="status" data-feedback aria-live="polite">当前点在陡坡上。试着走一小步，观察脚印向哪边移动。</div>
        </div>
      </aside>
    </main>
  </div>
  <script src="assets/lib/d3.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
  (()=>{
    const root=document.getElementById('loss-widget');
    const svg=d3.select(root.querySelector('[data-chart]'));
    const range=root.querySelector('[data-range]');
    const outW=root.querySelector('[data-w]'),outY=root.querySelector('[data-yhat]'),outL=root.querySelector('[data-loss]');
    const feedback=root.querySelector('[data-feedback]');
    const initial=-0.5;
    let state={w:initial,history:[initial]}, dragging=false, destroyed=false;
    const sigmoid=z=>1/(1+Math.exp(-z));
    const loss=w=>-Math.log(sigmoid(2*w-1));
    const grad=w=>2*(sigmoid(2*w-1)-1);
    const clamp=w=>Math.max(-2,Math.min(3,w));
    const fmt=v=>(v<0?'−':'')+Math.abs(v).toFixed(3);
    let x,y,plot,gCurve,gTrail,gMarks,gAxes,width,height;

    function build(){
      const node=svg.node(), rect=node.getBoundingClientRect();
      width=Math.max(500,node.clientWidth||rect.width); height=Math.max(400,node.clientHeight||rect.height);
      svg.attr('viewBox',`0 0 ${width} ${height}`); svg.selectAll('g.plot-root').remove();
      const m={top:38,right:42,bottom:68,left:78};
      x=d3.scaleLinear().domain([-2,3]).range([m.left,width-m.right]);
      y=d3.scaleLinear().domain([0,5]).range([height-m.bottom,m.top]);
      const rootG=svg.append('g').attr('class','plot-root');
      gAxes=rootG.append('g');
      gAxes.append('g').attr('class','axis').attr('transform',`translate(0,${height-m.bottom})`).call(d3.axisBottom(x).ticks(5));
      gAxes.append('g').attr('class','axis').attr('transform',`translate(${m.left},0)`).call(d3.axisLeft(y).ticks(5));
      gAxes.append('text').attr('class','axis-label').attr('x',width-m.right).attr('y',height-20).attr('text-anchor','end').text('权重 w');
      gAxes.append('text').attr('class','axis-label').attr('x',m.left).attr('y',22).text('损失 L');
      const data=d3.range(-2,3.001,.02).map(w=>({w,L:Math.min(5,loss(w))}));
      gCurve=rootG.append('g');
      gCurve.append('path').datum(data).attr('class','curve').attr('d',d3.line().x(d=>x(d.w)).y(d=>y(d.L)));
      gCurve.append('text').attr('class','annotation').attr('x',x(1.45)).attr('y',y(.23)-16).text('往右，损失更小');
      gTrail=rootG.append('g'); gMarks=rootG.append('g');
      const overlay=rootG.append('rect').attr('class','hit').attr('x',m.left).attr('y',m.top).attr('width',width-m.left-m.right).attr('height',height-m.top-m.bottom)
        .on('pointerdown',e=>{dragging=true;e.currentTarget.setPointerCapture(e.pointerId);setFromPointer(e,false)})
        .on('pointermove',e=>{if(dragging)setFromPointer(e,false)})
        .on('pointerup pointercancel',e=>{dragging=false;commit('已移动游标')});
      render();
    }
    function setFromPointer(e,announce){
      const p=d3.pointer(e,svg.node()); setW(x.invert(p[0]),false,announce);
    }
    function setW(w,keepHistory=false,announce=false){
      state.w=clamp(w); if(!keepHistory) state.history=[state.w]; render(); if(announce)commit('已调整权重');
    }
    function render(){
      const yh=sigmoid(2*state.w-1), L=loss(state.w);
      range.value=state.w; outW.textContent=fmt(state.w); outY.textContent=yh.toFixed(3); outL.textContent=L.toFixed(3);
      if(!x)return;
      const pts=state.history.map(w=>[x(w),y(Math.min(5,loss(w)))]);
      gTrail.selectAll('*').remove();
      if(pts.length>1)gTrail.append('path').attr('class','trail').attr('d',d3.line()(pts));
      gMarks.selectAll('*').remove();
      gMarks.append('line').attr('class','drop').attr('x1',x(state.w)).attr('x2',x(state.w)).attr('y1',y(Math.min(5,L))).attr('y2',y(0));
      gMarks.selectAll('circle.foot').data(state.history.slice(0,-1)).join('circle').attr('class','foot').attr('cx',w=>x(w)).attr('cy',w=>y(Math.min(5,loss(w)))).attr('r',6);
      gMarks.append('circle').attr('class','handle-ring').attr('cx',x(state.w)).attr('cy',y(Math.min(5,L))).attr('r',16);
      gMarks.append('circle').attr('class','current').attr('cx',x(state.w)).attr('cy',y(Math.min(5,L))).attr('r',8);
    }
    function commit(prefix){feedback.setAttribute('aria-label',`${prefix}：w ${fmt(state.w)}，预测 ${sigmoid(2*state.w-1).toFixed(3)}，损失 ${loss(state.w).toFixed(3)}`)}
    range.addEventListener('input',()=>setW(+range.value,false,false));
    range.addEventListener('change',()=>commit('已调整权重'));
    root.querySelector('[data-step]').addEventListener('click',()=>{
      const before=state.w; state.w=clamp(state.w-.2*grad(state.w)); state.history.push(state.w); render();
      feedback.textContent=`w 从 ${fmt(before)} 走到 ${fmt(state.w)}，损失降到 ${loss(state.w).toFixed(3)}。脚印保留了这一步。`; commit('已沿坡下行一步');
    });
    root.querySelector('[data-reset]').addEventListener('click',()=>{state={w:initial,history:[initial]};feedback.textContent='当前点在陡坡上。试着走一小步，观察脚印向哪边移动。';render();commit('已复位')});
    const ro=new ResizeObserver(build);ro.observe(svg.node());build();Deck.init({index:8,total:20});
    root.destroyLossWidget=()=>{if(destroyed)return;destroyed=true;ro.disconnect();svg.on('.drag',null);delete root.destroyLossWidget};
  })();
  </script>
</body>
</html>
