<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>梯度的方向</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root{--bg:#E8EEF1;--paper:#F8FAFA;--text:#17262D;--muted:#526770;--line:#A8B8BE;--model:#145C74;--target:#A53F2B;--attention:#D88416;--focus:#B36A08;--font-sans:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;--font-num:"IBM Plex Mono",Consolas,monospace;--fs-h1:42px;--fs-lead:22px;--fs-sec:17px;--fs-label:15px}
    body{background:var(--bg);color:var(--text);font-family:var(--font-sans)}
    #stage{display:flex;flex-direction:column;padding:28px 56px}
    h1{margin:0;font-size:var(--fs-h1);line-height:1.16;font-weight:800;letter-spacing:-.02em}
    .title-stack{display:flex;flex-direction:column}.kicker{margin-bottom:7px;color:var(--model);font-size:var(--fs-label);font-weight:800;letter-spacing:.11em}.small{color:var(--muted);font-size:var(--fs-sec)}.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}.target-text{color:var(--target)}
    #gradient-choice{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:18px;flex:1;min-height:0;margin-top:22px}
    #gradient-choice .gc-stage{position:relative;min-height:0;background:var(--paper);border:2px solid var(--line);border-radius:8px;overflow:hidden}
    #gradient-choice svg{display:block;width:100%;height:100%}
    #gradient-choice .axis{stroke:var(--line,#A8B8BE);stroke-width:2;vector-effect:non-scaling-stroke}
    #gradient-choice .slope{fill:none;stroke:var(--model,#145C74);stroke-width:7;stroke-linecap:round;vector-effect:non-scaling-stroke}
    #gradient-choice .tangent{stroke:var(--target,#A53F2B);stroke-width:4;stroke-dasharray:10 8;vector-effect:non-scaling-stroke}
    #gradient-choice .point{fill:var(--paper,#F8FAFA);stroke:var(--attention,#D88416);stroke-width:7;vector-effect:non-scaling-stroke}
    #gradient-choice .ghost{fill:var(--model);stroke:var(--paper);stroke-width:4;opacity:0;transition:opacity .2s ease}
    #gradient-choice[data-mode="revealed"] .ghost{opacity:1}
    #gradient-choice .svg-label{font-family:var(--font-sans);font-size:18px;fill:var(--muted)}
    #gradient-choice .svg-value{font-family:var(--font-num);font-size:22px;font-weight:700;fill:var(--text)}
    #gradient-choice .slope-note{position:absolute;left:30px;top:24px;display:flex;gap:28px;align-items:baseline}
    #gradient-choice .choice-row{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:12px;align-items:stretch}
    #gradient-choice .opt{min-height:58px}
    #gradient-choice .opt.correct{border-style:double;border-width:5px;text-decoration:none}
    #gradient-choice .action{min-width:108px}
    #gradient-choice .reveal{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(910px,calc(100% - 60px));display:none;align-items:center;justify-content:space-between;gap:28px;padding:16px 20px;background:var(--paper);border-top:2px solid var(--model)}
    #gradient-choice[data-mode="revealed"] .reveal{display:flex}
    #gradient-choice .formula{font-family:var(--font-num);font-size:25px;font-weight:750;white-space:nowrap;color:var(--model)}
    #gradient-choice .explain{font-size:var(--fs-sec);line-height:1.42;font-weight:700}
    #gradient-choice .prompt{font-size:var(--fs-lead);font-weight:750;margin-bottom:2px}
    @media (prefers-reduced-motion:reduce){#gradient-choice .ghost{transition:none}}
  </style>
</head>
<body data-page="10" data-total="20">
  <div id="stage">
    <header class="title-stack">
      <div class="kicker">看符号，选更新方向</div>
      <h1>梯度说的是：参数增一点，损失怎么变</h1>
    </header>

    <main id="gradient-choice" data-mode="ready" aria-labelledby="gc-question">
      <section class="gc-stage min0" aria-label="损失在当前位置附近向右下降">
        <div class="slope-note">
          <span><span class="small">当前位置</span> <strong class="num">w = 0.0</strong></span>
          <span><span class="small">局部梯度</span> <strong class="num target-text">dL/dw = −1.0</strong></span>
        </div>
        <svg viewBox="0 0 1488 560" role="img" aria-labelledby="slope-title slope-desc">
          <title id="slope-title">损失函数的局部斜坡</title>
          <desc id="slope-desc">曲线在当前位置向右下方倾斜，当前位置参数为零，梯度为负一。</desc>
          <line class="axis" x1="120" y1="475" x2="1370" y2="475"/>
          <line class="axis" x1="160" y1="510" x2="160" y2="95"/>
          <text class="svg-label" x="1378" y="483">w</text>
          <text class="svg-label" x="130" y="78">L</text>
          <path class="slope" d="M250 155 C520 205 700 292 930 365 C1080 413 1210 430 1320 438"/>
          <line class="tangent" x1="540" y1="220" x2="920" y2="370"/>
          <circle class="point" cx="730" cy="295" r="13"/>
          <text class="svg-value" x="685" y="274">w = 0.0</text>
          <circle class="ghost" cx="802" cy="326" r="11"/>
          <path class="ghost" d="M750 309 L790 326 L775 296 Z"/>
          <text class="svg-label" x="810" y="357" style="opacity:0" data-new-label>更新到 w = 0.1</text>
        </svg>
        <div class="reveal" data-reveal>
          <div class="formula">w<sub>new</sub> = w − η dL/dw = 0.1</div>
          <div class="explain">负梯度表示 w 增加会让损失下降，所以减去负数就是增加。这里 η = 0.1。</div>
        </div>
      </section>

      <section aria-label="方向选择">
        <div class="prompt" id="gc-question">为了让损失下降，w 应该怎样更新？</div>
        <div class="choice-row" role="radiogroup" aria-labelledby="gc-question">
          <button class="opt" type="button" role="radio" aria-checked="false" data-choice="up">w 应增加</button>
          <button class="opt" type="button" role="radio" aria-checked="false" data-choice="down">w 应减小</button>
          <button class="opt" type="button" role="radio" aria-checked="false" data-choice="same">w 不变</button>
          <button class="btn action" type="button" data-submit disabled>提交</button>
          <button class="btn action" type="button" data-reset>重置</button>
        </div>
        <div class="fb" data-feedback aria-live="polite">先选一个方向，再提交。</div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>
  (()=>{
    const root=document.querySelector('#gradient-choice');
    const options=[...root.querySelectorAll('[data-choice]')];
    const submit=root.querySelector('[data-submit]');
    const reset=root.querySelector('[data-reset]');
    const feedback=root.querySelector('[data-feedback]');
    const newLabel=root.querySelector('[data-new-label]');
    let state={choice:null,revealed:false};
    let destroyed=false;
    function render(){
      root.dataset.mode=state.revealed?'revealed':'ready';
      options.forEach(btn=>{
        const selected=btn.dataset.choice===state.choice;
        btn.setAttribute('aria-checked',String(selected));
        btn.classList.toggle('selected',selected&&!state.revealed);
        btn.classList.toggle('correct',state.revealed&&btn.dataset.choice==='up');
        btn.classList.toggle('incorrect',state.revealed&&selected&&btn.dataset.choice!=='up');
        btn.disabled=state.revealed;
      });
      submit.disabled=!state.choice||state.revealed;
      newLabel.style.opacity=state.revealed?'1':'0';
      if(!state.choice) feedback.textContent='先选一个方向，再提交。';
      else if(!state.revealed) feedback.textContent='已选方向。提交后查看更新式。';
      else if(state.choice==='up') feedback.textContent='判断正确：负梯度对应向右下坡，w 应增加。';
      else feedback.textContent='这个方向会让损失升高或停在原处。负梯度时应增加 w。';
    }
    function choose(e){if(state.revealed)return;state={...state,choice:e.currentTarget.dataset.choice};render()}
    function reveal(){if(!state.choice||state.revealed)return;state={...state,revealed:true};render()}
    function restart(){state={choice:null,revealed:false};render();options[0].focus()}
    options.forEach(btn=>btn.addEventListener('click',choose));
    submit.addEventListener('click',reveal); reset.addEventListener('click',restart);
    render();
    root.destroyGradientChoice=()=>{if(destroyed)return;destroyed=true;options.forEach(btn=>btn.removeEventListener('click',choose));submit.removeEventListener('click',reveal);reset.removeEventListener('click',restart);delete root.destroyGradientChoice};
    Deck.init({index:10,total:20});
  })();
  </script>
</body>
</html>
