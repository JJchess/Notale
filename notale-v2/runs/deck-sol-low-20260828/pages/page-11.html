<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:16px}
    .lr-page{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:16px;flex:1;min-height:0}
    .lr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:28px}
    .lr-head .small{max-width:620px;text-align:right;padding-bottom:3px}
    .lr-widget{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:14px;min-height:0}
    .lr-plots{display:grid;grid-template-columns:1fr 1fr;gap:24px;min-height:0}
    .lr-run{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:9px;min-width:0;min-height:0;background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:15px 17px 13px;box-shadow:0 3px 0 rgba(46,72,82,.12)}
    .lr-runhead{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
    .lr-rate{font-size:var(--fs-h2);font-weight:800}.lr-state{font-size:var(--fs-label);font-weight:800;color:var(--muted)}
    .lr-svg{display:block;width:100%;height:100%;min-height:0}
    .lr-svg text{font-family:var(--font-sans);fill:var(--muted);font-size:13px}
    .lr-svg .axis{stroke:var(--line);stroke-width:1.5}.lr-svg .curve{fill:none;stroke:var(--text);stroke-width:2.5}.lr-svg .trail{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.lr-svg .slow{stroke:var(--model)}.lr-svg .fast{stroke:var(--target)}
    .lr-svg .ghost{fill:var(--paper);stroke:var(--line);stroke-width:2}.lr-svg .done-slow{fill:var(--model);stroke:var(--paper);stroke-width:2}.lr-svg .done-fast{fill:var(--target);stroke:var(--paper);stroke-width:2}.lr-svg .current{fill:var(--attention);stroke:var(--text);stroke-width:2.5}.lr-svg .target-line{stroke:var(--sample);stroke-width:2;stroke-dasharray:6 5}.lr-svg .off{fill:var(--target);font-weight:800;font-size:15px}
    .lr-read{display:flex;align-items:baseline;justify-content:space-between;gap:14px;border-top:1px solid var(--line);padding-top:9px}.lr-read .value{font-size:var(--fs-sec);font-weight:750}.lr-read .loss{font-family:var(--font-num);font-size:var(--fs-lead);font-weight:800;font-variant-numeric:tabular-nums}
    .lr-controls{display:flex;align-items:center;gap:12px}.lr-controls .btn:first-child{min-width:156px;background:#FFF1D8;border-color:var(--attention)}.lr-progress{flex:1;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;color:var(--muted);font-size:var(--fs-label);font-weight:750}.lr-track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.lr-fill{height:100%;width:0;background:var(--attention)}
    .lr-foot{display:flex;justify-content:space-between;align-items:flex-start;gap:30px;padding-top:12px;border-top:2px solid var(--line)}.lr-foot .lead{max-width:760px}.lr-boundary{max-width:650px;text-align:right}
    @media(prefers-reduced-motion:no-preference){.lr-fill{transition:width 180ms ease}.lr-svg .current{transition:cx 180ms ease,cy 180ms ease}}
  </style>
</head>
<body data-page="11" data-total="20">
  <div id="stage">
    <main class="lr-page">
      <header class="lr-head">
        <div class="title-stack">
          <div class="kicker">学习率 · 同步对照</div>
          <h1>步子太小走得慢，太大可能来回跳</h1>
        </div>
        <p class="small">两边固定同一起点、同一损失和同一 0–10 步时间轴，只改变学习率。</p>
      </header>

      <section class="lr-widget min0" data-lr-widget aria-label="学习率同步对照实验">
        <div class="lr-plots min0">
          <article class="lr-run min0">
            <div class="lr-runhead"><span class="lr-rate model-text">η = 0.1</span><span class="lr-state">小步稳定靠近</span></div>
            <svg class="lr-svg" data-plot="slow" viewBox="0 0 700 410" role="img" aria-label="学习率零点一的损失轨迹"></svg>
            <div class="lr-read"><span class="value">当前 w = <b class="num" data-w="slow">−2.000</b></span><span class="loss model-text">L = <span data-loss="slow">16.000</span></span></div>
          </article>
          <article class="lr-run min0">
            <div class="lr-runhead"><span class="lr-rate target-text">η = 1.1</span><span class="lr-state">跨过最低点，振幅扩大</span></div>
            <svg class="lr-svg" data-plot="fast" viewBox="0 0 700 410" role="img" aria-label="学习率一点一的发散轨迹"></svg>
            <div class="lr-read"><span class="value">当前 w = <b class="num" data-w="fast">−2.000</b></span><span class="loss target-text">L = <span data-loss="fast">16.000</span></span></div>
          </article>
        </div>
        <div class="lr-controls">
          <button class="btn" type="button" data-step>同步走一步</button>
          <button class="btn" type="button" data-reset>复位到第 0 步</button>
          <div class="lr-progress"><span>共同时间轴</span><div class="lr-track"><div class="lr-fill" data-fill></div></div><strong class="num" data-step-read aria-live="polite">第 0 / 10 步</strong></div>
        </div>
      </section>

      <footer class="lr-foot">
        <p class="lead">更新规则相同：<span class="num">w ← w − η·2(w−2)</span>。小学习率慢慢贴近最低点；<span class="target-text">η = 1.1</span> 每次跨得更远。</p>
        <p class="small lr-boundary">这里用 <span class="num">L(w)=(w−2)²</span> 只展示步长，不是上一页神经元的真实损失；本页不介绍 Adam、动量等优化器。</p>
      </footer>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>
  (()=>{
    Deck.init({index:11,total:20});
    const root=document.querySelector('[data-lr-widget]'); if(!root)return;
    const qs=s=>root.querySelector(s), plots={slow:qs('[data-plot="slow"]'),fast:qs('[data-plot="fast"]')};
    const series=eta=>{let w=-2,a=[];for(let i=0;i<=10;i++){a.push(w);w=w-eta*2*(w-2)}return a};
    const data={slow:series(.1),fast:series(1.1)}; let state={step:0},destroyed=false;
    const fmt=v=>(v<0?'−':'')+Math.abs(v).toFixed(3);
    const X=w=>54+(w+26)/56*608, Y=l=>348-Math.min(l,1024)/1024*276;
    function svgMarkup(kind){
      let curve='';for(let i=0;i<=140;i++){const w=-26+i*.4,l=(w-2)**2;curve+=(i?'L':'M')+X(w).toFixed(1)+' '+Y(l).toFixed(1)+' '}
      const vals=data[kind], trail=vals.slice(0,state.step+1).map((w,i)=>(i?'L':'M')+X(w).toFixed(1)+' '+Y((w-2)**2).toFixed(1)).join(' ');
      const dots=vals.map((w,i)=>{const active=i===state.step,done=i<state.step,c=active?'current':done?(kind==='slow'?'done-slow':'done-fast'):'ghost';return `<circle class="${c}" cx="${X(w)}" cy="${Y((w-2)**2)}" r="${active?8:5.5}"/>`}).join('');
      const ticks=[-20,-10,0,10,20,30].map(v=>`<line class="axis" x1="${X(v)}" y1="348" x2="${X(v)}" y2="354"/><text x="${X(v)}" y="374" text-anchor="middle">${v}</text>`).join('');
      return `<line class="axis" x1="54" y1="348" x2="662" y2="348"/><line class="axis" x1="54" y1="72" x2="54" y2="348"/><line class="target-line" x1="${X(2)}" y1="72" x2="${X(2)}" y2="348"/><text x="${X(2)+8}" y="92">最低点 w=2</text><text x="18" y="82">L</text><text x="650" y="399">w</text><text x="43" y="353" text-anchor="end">0</text><text x="43" y="215" text-anchor="end">512</text><text x="43" y="77" text-anchor="end">1024</text>${ticks}<path class="curve" d="${curve}"/><path class="trail ${kind}" d="${trail}"/>${dots}`
    }
    function render(announce){
      for(const kind of ['slow','fast']){plots[kind].innerHTML=svgMarkup(kind);const w=data[kind][state.step];qs(`[data-w="${kind}"]`).textContent=fmt(w);qs(`[data-loss="${kind}"]`).textContent=((w-2)**2).toFixed(3)}
      qs('[data-step-read]').textContent=`第 ${state.step} / 10 步`;qs('[data-fill]').style.width=state.step*10+'%';qs('[data-step]').disabled=state.step>=10;
    }
    function step(){if(destroyed||state.step>=10)return;state={step:state.step+1};render(true)}
    function reset(){if(destroyed)return;state={step:0};render(true)}
    qs('[data-step]').addEventListener('click',step);qs('[data-reset]').addEventListener('click',reset);render(false);
    root.destroyLRWidget=()=>{if(destroyed)return;destroyed=true;qs('[data-step]').removeEventListener('click',step);qs('[data-reset]').removeEventListener('click',reset);delete root.destroyLRWidget};
  })();
  </script>
</body>
</html>
