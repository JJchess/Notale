<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root{--bg:#E8EEF1;--paper:#F8FAFA;--text:#17262D;--muted:#526770;--line:#A8B8BE;--model:#145C74;--focus:#B36A08;--font-sans:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;--font-num:"IBM Plex Mono",Consolas,monospace;--fs-h1:42px;--fs-h2:26px;--fs-body:19px;--fs-sec:17px;--fs-label:15px}
    body{background:var(--bg);color:var(--text);font-family:var(--font-sans)}
    #stage{display:flex;flex-direction:column;padding:28px 56px;gap:20px}
    h1,p{margin:0} h1{font-size:var(--fs-h1);line-height:1.16;font-weight:800;letter-spacing:-.02em}
    .title-stack{display:flex;flex-direction:column;flex:0 0 auto}
    .kicker{color:var(--model);font-size:var(--fs-label);line-height:1.3;font-weight:800;letter-spacing:.11em;margin-bottom:7px}
    .hint{color:var(--muted);font-size:var(--fs-label);line-height:1.4}
    .min0{min-width:0;min-height:0}
    #stage{gap:20px}
    .title-stack{padding-bottom:18px;border-bottom:2px solid var(--line)}
    .page-main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(380px,.75fr);gap:34px;flex:1;min-height:0}
    .network-widget{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:12px;min-width:0;min-height:0}
    .network-stage{position:relative;min-height:0;background:var(--paper);border:2px solid var(--line);border-radius:8px;overflow:hidden}
    .network-stage svg{display:block;width:100%;height:100%}
    .network-stage .edge{stroke:var(--line);stroke-width:2.2;fill:none;transition:opacity .16s ease,stroke .16s ease,stroke-width .16s ease}
    .network-stage .edge.active{stroke:var(--model);stroke-width:4;opacity:1}
    .network-stage .edge.dim{opacity:.12}
    .network-stage .node{fill:var(--paper);stroke:var(--text);stroke-width:3}
    .network-stage .hidden{cursor:pointer;outline:none}
    .network-stage .hidden .node{fill:#EDF5F7;stroke:var(--model);transition:fill .16s ease,stroke-width .16s ease}
    .network-stage .hidden:hover .node,.network-stage .hidden:focus-visible .node{stroke-width:6}
    .network-stage .hidden.active .node{fill:#DCEEF3;stroke-width:6}
    .network-stage .hidden.dim{opacity:.35}
    .network-stage text{font-family:var(--font-sans);font-size:18px;fill:var(--text)}
    .network-stage .layer-label{font-size:16px;font-weight:800;fill:var(--muted);letter-spacing:.06em}
    .network-stage .node-label{font-family:var(--font-num);font-size:17px;font-weight:700;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
    .network-stage .flow-label{font-size:15px;font-weight:800;fill:var(--model)}
    .widget-foot{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:50px}
    .widget-foot .hint{font-size:var(--fs-sec)}
    .selection-readout{color:var(--model);font-size:var(--fs-sec);font-weight:800;white-space:nowrap}
    .claim-side{display:flex;flex-direction:column;justify-content:center;min-width:0}
    .claim-side .k-generalization{grid-template-columns:1fr;gap:16px}
    .claim-side .claim{font-size:var(--fs-h2);padding-bottom:18px;border-bottom:4px solid var(--model)}
    .claim-side .trunk{display:none}
    .claim-side .supports{gap:10px}
    .claim-side .support{padding:12px 4px 13px 30px;border-bottom:1px solid var(--line);font-size:var(--fs-body)}
    .claim-side .support::before{left:4px;width:14px;border-top:4px solid var(--model)}
    .scope-note{margin-top:18px;padding-top:14px;border-top:2px solid var(--line);color:var(--muted);font-size:var(--fs-label);line-height:1.45}
  </style>
</head>
<body data-page="12" data-total="20">
  <div id="stage">
    <header class="title-stack">
      <div class="kicker">从单个神经元到网络</div>
      <h1>一个神经元画一条边界，多个神经元可以拼出弯曲边界</h1>
    </header>

    <main class="page-main min0">
      <section class="network-widget min0" data-network-widget aria-label="神经网络连接检查器">
        <div class="network-stage min0">
          <svg viewBox="0 0 980 610" role="img" aria-labelledby="net-title net-desc">
            <title id="net-title">两输入、四个隐藏神经元和一个输出组成的网络</title>
            <desc id="net-desc">连接从左向右。点击隐藏神经元，只查看它接收和发出的连接。</desc>
            <defs>
              <marker id="p12-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker>
            </defs>
            <text class="layer-label" x="120" y="58">输入</text>
            <text class="layer-label" x="458" y="58">隐藏层</text>
            <text class="layer-label" x="810" y="58">输出</text>
            <text class="flow-label" x="400" y="588">连接方向：从左到右</text>

            <g data-edges></g>

            <g aria-hidden="true">
              <circle class="node" cx="145" cy="225" r="39"/><text class="node-label" x="145" y="225">x₁</text>
              <circle class="node" cx="145" cy="405" r="39"/><text class="node-label" x="145" y="405">x₂</text>
              <text x="70" y="500">特征 x₁, x₂</text>
            </g>

            <g class="hidden" data-node="0" tabindex="0" role="button" aria-label="查看隐藏神经元 h1 的连接" aria-pressed="false"><circle class="node" cx="490" cy="145" r="38"/><text class="node-label" x="490" y="145">h₁</text></g>
            <g class="hidden active" data-node="1" tabindex="0" role="button" aria-label="查看隐藏神经元 h2 的连接" aria-pressed="true"><circle class="node" cx="490" cy="255" r="38"/><text class="node-label" x="490" y="255">h₂</text></g>
            <g class="hidden" data-node="2" tabindex="0" role="button" aria-label="查看隐藏神经元 h3 的连接" aria-pressed="false"><circle class="node" cx="490" cy="365" r="38"/><text class="node-label" x="490" y="365">h₃</text></g>
            <g class="hidden" data-node="3" tabindex="0" role="button" aria-label="查看隐藏神经元 h4 的连接" aria-pressed="false"><circle class="node" cx="490" cy="475" r="38"/><text class="node-label" x="490" y="475">h₄</text></g>

            <g aria-hidden="true">
              <circle class="node" cx="830" cy="310" r="48"/><text class="node-label" x="830" y="310">ŷ</text>
              <text x="748" y="400">类别 1 的概率</text>
            </g>
          </svg>
        </div>
        <div class="widget-foot">
          <p class="hint">点击或用键盘选择一个隐藏神经元，只追踪与它相连的路径。</p>
          <div class="selection-readout" data-readout aria-live="polite">正在查看 h₂：2 条入边，1 条出边</div>
        </div>
      </section>

      <aside class="claim-side min0">
        <div class="k-generalization">
          <div class="claim">层的作用不是神秘化计算，而是把许多简单变换接起来</div>
          <div class="trunk"></div>
          <div class="supports">
            <div class="support">每个连接仍只有<strong>权重</strong></div>
            <div class="support">每个神经元仍做<strong>加权和与激活</strong></div>
            <div class="support">输出仍与目标比较产生<strong>损失</strong></div>
          </div>
        </div>
        <p class="scope-note">这里只观察网络结构与连接。本页不训练网络；后续页面再解释隐藏层与实时训练。</p>
      </aside>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>
  (() => {
    const root = document.querySelector('[data-network-widget]');
    if (!root) return;
    const edgeLayer = root.querySelector('[data-edges]');
    const nodes = [...root.querySelectorAll('[data-node]')];
    const readout = root.querySelector('[data-readout]');
    const input = [{x:145,y:225},{x:145,y:405}];
    const hidden = [{x:490,y:145},{x:490,y:255},{x:490,y:365},{x:490,y:475}];
    const output = {x:830,y:310};
    let state = { selected: 1 };
    let destroyed = false;

    function makeLine(x1,y1,x2,y2,owner,kind){
      const line=document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',x1); line.setAttribute('y1',y1); line.setAttribute('x2',x2); line.setAttribute('y2',y2);
      line.setAttribute('marker-end','url(#p12-arrow)'); line.setAttribute('class','edge');
      line.dataset.owner=owner; line.dataset.kind=kind; edgeLayer.appendChild(line);
    }
    hidden.forEach((h,i)=>{
      input.forEach(p=>makeLine(p.x+43,p.y,h.x-45,h.y,i,'in'));
      makeLine(h.x+43,h.y,output.x-55,output.y,i,'out');
    });
    const edges=[...edgeLayer.querySelectorAll('.edge')];

    function render(){
      edges.forEach(edge=>{
        const on=Number(edge.dataset.owner)===state.selected;
        edge.classList.toggle('active',on); edge.classList.toggle('dim',!on);
      });
      nodes.forEach((node,i)=>{
        const on=i===state.selected;
        node.classList.toggle('active',on); node.classList.toggle('dim',!on);
        node.setAttribute('aria-pressed',String(on));
      });
      readout.textContent=`正在查看 h${state.selected+1}：2 条入边，1 条出边`;
    }
    function select(i){ if(destroyed)return; state={selected:i}; render(); }
    function click(e){ select(Number(e.currentTarget.dataset.node)); }
    function key(e){
      const i=Number(e.currentTarget.dataset.node);
      if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();select(i);}
      else if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();e.stopPropagation();const n=(i+1)%4;select(n);nodes[n].focus();}
      else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();e.stopPropagation();const n=(i+3)%4;select(n);nodes[n].focus();}
    }
    nodes.forEach(n=>{n.addEventListener('click',click);n.addEventListener('keydown',key)});
    render();
    root.destroyNetworkWidget=()=>{if(destroyed)return;destroyed=true;nodes.forEach(n=>{n.removeEventListener('click',click);n.removeEventListener('keydown',key)});delete root.destroyNetworkWidget};
    Deck.init({index:12,total:20});
  })();
  </script>
</body>
</html>
