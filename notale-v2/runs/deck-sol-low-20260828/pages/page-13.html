<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:18px}
    .title-stack .lead{margin-top:8px;color:var(--muted);font-weight:550}
    #feature-widget{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) 72px;gap:14px}
    #feature-widget .model-row{display:grid;grid-template-columns:minmax(0,.92fr) 110px minmax(0,1.08fr);gap:18px;min-height:0;align-items:stretch}
    #feature-widget .space{position:relative;min-width:0;min-height:0;background:var(--paper);border:2px solid var(--line);border-radius:8px;overflow:hidden}
    #feature-widget .space-head{position:absolute;z-index:4;left:20px;top:16px;right:20px;display:flex;justify-content:space-between;align-items:baseline;pointer-events:none}
    #feature-widget .space-title{font-size:var(--fs-h2);font-weight:800}
    #feature-widget .space-note{font-size:var(--fs-label);color:var(--muted)}
    #feature-widget .konva-host{position:absolute;inset:58px 16px 16px}
    #feature-widget .dom-overlay{position:absolute;inset:58px 16px 16px;z-index:3;pointer-events:none}
    #feature-widget .axis-label{position:absolute;color:var(--muted);font-size:var(--fs-label);line-height:1}
    #feature-widget .axis-x{right:10px;top:50%;transform:translateY(10px)}
    #feature-widget .axis-y{left:50%;top:4px;transform:translateX(10px)}
    #feature-widget .bridge{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;color:var(--model)}
    #feature-widget .bridge-line{width:78px;height:4px;background:var(--model);position:relative}
    #feature-widget .bridge-line:after{content:"";position:absolute;right:-1px;top:-7px;border-left:13px solid var(--model);border-top:9px solid transparent;border-bottom:9px solid transparent}
    #feature-widget .bridge-copy{text-align:center;font-size:var(--fs-label);font-weight:800;line-height:1.4}
    #feature-widget .unit-buttons{position:absolute;z-index:5;left:18px;right:18px;bottom:18px;display:flex;justify-content:center;gap:10px}
    #feature-widget .hbtn{min-width:66px;background:rgba(248,250,250,.94)}
    #feature-widget .feedback{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:12px 18px;border-top:2px solid var(--line)}
    #feature-widget .feedback strong{font-size:var(--fs-sec);color:var(--model)}
    #feature-widget .feedback p{font-size:var(--fs-sec)}
    #feature-widget .class-key{display:flex;gap:20px;align-items:center;color:var(--muted);font-size:var(--fs-label)}
    #feature-widget .mark{display:inline-block;width:14px;height:14px;margin-right:7px;vertical-align:-2px;border:3px solid var(--text)}
    #feature-widget .mark.outer{border-radius:50%;background:var(--paper)}
    #feature-widget .mark.inner{transform:rotate(45deg);background:var(--sample);border-color:var(--sample)}
  </style>
</head>
<body data-page="13" data-total="20">
  <div id="stage">
    <header class="title-stack">
      <div class="kicker">隐藏层 · 特征探测器</div>
      <h1>隐藏层先把输入改写成更有用的表示</h1>
      <p class="lead">四条简单边界分别响应一侧；合在一起，就能标出中央区域。</p>
    </header>

    <section id="feature-widget" aria-label="隐藏神经元边界交互">
      <div class="model-row min0">
        <div class="space min0">
          <div class="space-head"><span class="space-title">输入平面</span><span class="space-note">同一组 8 个点</span></div>
          <div id="input-canvas" class="konva-host" role="img" aria-label="输入平面：四个外角点属于类别零，四个中央点属于类别一"></div>
          <div class="dom-overlay"><span class="axis-label axis-x">x₁</span><span class="axis-label axis-y">x₂</span></div>
        </div>

        <div class="bridge" aria-hidden="true"><div class="bridge-line"></div><div class="bridge-copy">隐藏层<br>重新表示</div></div>

        <div class="space min0">
          <div class="space-head"><span class="space-title">四个隐藏单元</span><span class="space-note">选择一个，查看它响应的半平面</span></div>
          <div id="hidden-canvas" class="konva-host" role="img" aria-label="四条直线边界围出中央区域"></div>
          <div class="dom-overlay"><span class="axis-label axis-x">x₁</span><span class="axis-label axis-y">x₂</span></div>
          <div class="unit-buttons" role="group" aria-label="选择隐藏神经元">
            <button class="btn hbtn" type="button" data-unit="0" aria-pressed="false">H1 左</button>
            <button class="btn hbtn" type="button" data-unit="1" aria-pressed="false">H2 右</button>
            <button class="btn hbtn" type="button" data-unit="2" aria-pressed="false">H3 下</button>
            <button class="btn hbtn" type="button" data-unit="3" aria-pressed="false">H4 上</button>
          </div>
        </div>
      </div>
      <div class="feedback">
        <div class="class-key"><span><i class="mark outer"></i>类别 0</span><span><i class="mark inner"></i>类别 1</span></div>
        <p id="unit-explain" aria-live="polite"><strong>四个单元共同作用：</strong> 每个单元只提供一条简单边界，交叠后中央区域被单独表示。</p>
        <button id="show-all" class="btn" type="button">显示组合</button>
      </div>
    </section>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lib/konva.min.js"></script>
  <script>
  (()=>{
    Deck.init({index:13,total:20});
    const root=document.getElementById('feature-widget');
    const inputHost=root.querySelector('#input-canvas');
    const hiddenHost=root.querySelector('#hidden-canvas');
    const buttons=[...root.querySelectorAll('[data-unit]')];
    const allBtn=root.querySelector('#show-all');
    const explain=root.querySelector('#unit-explain');
    const state={selected:null};
    const colors={text:'#17262D',muted:'#526770',line:'#A8B8BE',paper:'#F8FAFA',model:'#145C74',attention:'#D88416',sample:'#486B35'};
    const points=[[-.8,-.8,0],[-.8,.8,0],[.8,-.8,0],[.8,.8,0],[-.25,-.25,1],[-.25,.25,1],[.25,-.25,1],[.25,.25,1]];
    const stages=[];
    function makeStage(host){return new Konva.Stage({container:host,width:host.clientWidth,height:host.clientHeight})}
    const inputStage=makeStage(inputHost), hiddenStage=makeStage(hiddenHost); stages.push(inputStage,hiddenStage);
    function geom(stage){const w=stage.width(),h=stage.height();const side=Math.min(w-52,h-48);return {w,h,s:side,cx:w/2,cy:(h-12)/2,map(x,y){return [this.cx+x*this.s*.46,this.cy-y*this.s*.46]}}}
    function baseLayer(stage){const g=geom(stage),l=new Konva.Layer();
      l.add(new Konva.Line({points:[24,g.cy,g.w-24,g.cy],stroke:colors.line,strokeWidth:2}));
      l.add(new Konva.Line({points:[g.cx,16,g.cx,g.h-20],stroke:colors.line,strokeWidth:2}));
      [-.5,.5].forEach(v=>{let [x]=g.map(v,0);l.add(new Konva.Line({points:[x,g.cy-5,x,g.cy+5],stroke:colors.line,strokeWidth:2}));let [,y]=g.map(0,v);l.add(new Konva.Line({points:[g.cx-5,y,g.cx+5,y],stroke:colors.line,strokeWidth:2}))});
      stage.add(l);return g}
    function drawPoints(stage,g,opacity=1){const l=new Konva.Layer();points.forEach(([x,y,c])=>{const [px,py]=g.map(x,y);if(c===0)l.add(new Konva.Circle({x:px,y:py,radius:10,fill:colors.paper,stroke:colors.text,strokeWidth:3,opacity}));else l.add(new Konva.Rect({x:px-8,y:py-8,width:16,height:16,rotation:45,offsetX:-3,offsetY:3,fill:colors.sample,stroke:colors.sample,opacity}))});stage.add(l)}
    function drawInput(){inputStage.destroyChildren();const g=baseLayer(inputStage);drawPoints(inputStage,g)}
    function drawHidden(){hiddenStage.destroyChildren();const g=baseLayer(hiddenStage),shade=new Konva.Layer(),lines=new Konva.Layer();const xL=g.map(-.48,0)[0],xR=g.map(.48,0)[0],yT=g.map(0,.48)[1],yB=g.map(0,-.48)[1];
      if(state.selected===null){shade.add(new Konva.Rect({x:xL,y:yT,width:xR-xL,height:yB-yT,fill:colors.model,opacity:.16}))}
      else {const rects=[{x:xL,y:16,width:g.w-xL-24,height:g.h-36},{x:24,y:16,width:xR-24,height:g.h-36},{x:24,y:16,width:g.w-48,height:yB-16},{x:24,y:yT,width:g.w-48,height:g.h-yT-20}];shade.add(new Konva.Rect({...rects[state.selected],fill:colors.attention,opacity:.22}))}
      hiddenStage.add(shade);
      [[xL,18,xL,g.h-22],[xR,18,xR,g.h-22],[24,yB,g.w-24,yB],[24,yT,g.w-24,yT]].forEach((p,i)=>lines.add(new Konva.Line({points:p,stroke:state.selected===i?colors.attention:colors.model,strokeWidth:state.selected===i?6:3,dash:state.selected!==null&&state.selected!==i?[7,7]:undefined,opacity:state.selected!==null&&state.selected!==i?.38:1})));
      hiddenStage.add(lines);drawPoints(hiddenStage,g,.82)
    }
    function render(){buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(state.selected===i)));if(state.selected===null){explain.innerHTML='<strong>四个单元共同作用：</strong> 每个单元只提供一条简单边界，交叠后中央区域被单独表示。';allBtn.disabled=true}else{explain.innerHTML='<strong>'+buttons[state.selected].textContent+'：</strong> 这一单元对边界某一侧响应更强。';allBtn.disabled=false}drawHidden()}
    buttons.forEach((b,i)=>b.addEventListener('click',()=>{state.selected=i;render()}));allBtn.addEventListener('click',()=>{state.selected=null;render()});
    function resize(){[inputStage,hiddenStage].forEach((s,i)=>{const h=i?hiddenHost:inputHost;s.size({width:h.clientWidth,height:h.clientHeight})});drawInput();drawHidden()}
    const off=Deck.onResize(resize);drawInput();render();
    root.destroyWidget=()=>{off();stages.forEach(s=>s.destroy());delete root.destroyWidget};
  })();
  </script>
</body>
</html>
