<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:18px}
    .title-stack{height:92px;justify-content:flex-start}
    .title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
    .scope{font-size:var(--fs-label);color:var(--muted);padding-bottom:5px;white-space:nowrap}
    .network-wrap{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) 116px;gap:16px}
    .network{position:relative;min-height:0;background:rgba(248,250,250,.58);border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
    .network svg{width:100%;height:100%;display:block}
    .wire{fill:none;stroke:var(--line);stroke-width:3;transition:stroke .22s ease-out,opacity .22s ease-out;opacity:.55}
    .wire.model{stroke:var(--model)}
    .network svg .node{fill:#F8FAFA;stroke:var(--line);stroke-width:3;transition:stroke .22s ease-out,fill .22s ease-out}
    .node-label{font:800 18px var(--font-sans);fill:var(--text);text-anchor:middle}
    .value{font:700 20px var(--font-num);fill:var(--muted);text-anchor:middle;opacity:.38;transition:opacity .22s ease-out,fill .22s ease-out}
    .stage-label{font:800 16px var(--font-sans);fill:var(--muted);text-anchor:middle;letter-spacing:.08em}
    .formula{font:650 16px var(--font-sans);fill:var(--muted);text-anchor:middle}
    .arrow{fill:var(--line);transition:fill .22s ease-out}
    [data-step="1"] .s1 .node,[data-step="2"] .s1 .node,[data-step="3"] .s1 .node,[data-step="4"] .s1 .node,
    [data-step="2"] .s2 .node,[data-step="3"] .s2 .node,[data-step="4"] .s2 .node,
    [data-step="3"] .s3 .node,[data-step="4"] .s3 .node,
    [data-step="4"] .s4 .node{stroke:var(--attention);fill:#FFF1D8}
    [data-step="1"] .s1 .value,[data-step="2"] .s1 .value,[data-step="3"] .s1 .value,[data-step="4"] .s1 .value,
    [data-step="2"] .s2 .value,[data-step="3"] .s2 .value,[data-step="4"] .s2 .value,
    [data-step="3"] .s3 .value,[data-step="4"] .s3 .value,
    [data-step="4"] .s4 .value{opacity:1;fill:var(--text)}
    [data-step="2"] .w12,[data-step="3"] .w12,[data-step="4"] .w12,
    [data-step="3"] .w23,[data-step="4"] .w23,[data-step="4"] .w34{stroke:var(--model);opacity:1}
    [data-step="2"] .a12,[data-step="3"] .a12,[data-step="4"] .a12,
    [data-step="3"] .a23,[data-step="4"] .a23,[data-step="4"] .a34{fill:var(--model)}
    .bottom{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:stretch}
    .claim{display:flex;align-items:center;gap:18px;border-top:3px solid var(--text);padding:14px 4px 0}
    .claim-mark{width:14px;height:48px;background:var(--model);flex:0 0 14px}
    .claim p{font-size:var(--fs-lead);font-weight:800}
    .control{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:18px;align-items:center;padding:10px 18px}
    .control .status{font-size:var(--fs-sec);font-weight:800}
    .control .hint{align-self:start}
    .control .btn{grid-row:1/3;grid-column:2;min-width:108px}
    @media(prefers-reduced-motion:reduce){.wire,.node,.value,.arrow{transition-duration:.001ms}}
  </style>
</head>
<body data-page="14" data-total="20">
  <div id="stage" data-step="0">
    <header class="title-stack">
      <div class="kicker">两层网络 · 前向过程</div>
      <div class="title-row"><h1>前向传播：数值从输入流向输出</h1><div class="scope">本页只计算预测，不计算损失与梯度</div></div>
    </header>

    <main class="network-wrap min0">
      <section class="network min0" aria-label="2 到 3 到 1 神经网络前向传播图">
        <svg viewBox="0 0 1488 602" role="img" aria-labelledby="netTitle netDesc">
          <title id="netTitle">两层神经网络的前向传播</title>
          <desc id="netDesc">输入零点六和负零点四，经过三个隐藏单元的加权和与 tanh 激活，最后得到 sigmoid 输出零点七六九。</desc>
          <text class="stage-label" x="120" y="38">输入</text>
          <text class="stage-label" x="500" y="38">隐藏层加权和</text>
          <text class="stage-label" x="882" y="38">TANH 激活</text>
          <text class="stage-label" x="1320" y="38">输出</text>

          <g class="w12 wire"><path d="M190 210 L430 135 M190 210 L430 301 M190 210 L430 467 M190 398 L430 135 M190 398 L430 301 M190 398 L430 467"/></g>
          <g class="w23 wire"><path d="M570 135 L812 135 M570 301 L812 301 M570 467 L812 467"/></g>
          <g class="w34 wire"><path d="M952 135 L1248 301 M952 301 L1248 301 M952 467 L1248 301"/></g>
          <path class="arrow a12" d="M420 294 l18 7 -18 7z"/><path class="arrow a23" d="M802 294 l18 7 -18 7z"/><path class="arrow a34" d="M1238 294 l18 7 -18 7z"/>

          <g class="s1"><circle class="node" cx="120" cy="210" r="68"/><text class="node-label" x="120" y="202">x₁</text><text class="value" x="120" y="232">0.6</text>
          <circle class="node" cx="120" cy="398" r="68"/><text class="node-label" x="120" y="390">x₂</text><text class="value" x="120" y="420">−0.4</text></g>

          <g class="s2"><circle class="node" cx="500" cy="135" r="68"/><text class="node-label" x="500" y="127">z₁</text><text class="value" x="500" y="157">0.8</text>
          <circle class="node" cx="500" cy="301" r="68"/><text class="node-label" x="500" y="293">z₂</text><text class="value" x="500" y="323">−0.3</text>
          <circle class="node" cx="500" cy="467" r="68"/><text class="node-label" x="500" y="459">z₃</text><text class="value" x="500" y="489">0.1</text></g>

          <g class="s3"><circle class="node" cx="882" cy="135" r="68"/><text class="node-label" x="882" y="127">h₁</text><text class="value" x="882" y="157">0.664</text>
          <circle class="node" cx="882" cy="301" r="68"/><text class="node-label" x="882" y="293">h₂</text><text class="value" x="882" y="323">−0.291</text>
          <circle class="node" cx="882" cy="467" r="68"/><text class="node-label" x="882" y="459">h₃</text><text class="value" x="882" y="489">0.100</text>
          <text class="formula" x="882" y="573">h = tanh(z)</text></g>

          <g class="s4"><circle class="node" cx="1320" cy="301" r="82"/><text class="node-label" x="1320" y="278">输出加权和</text><text class="value" x="1320" y="311">1.2</text><text class="value" x="1320" y="346">ŷ = 0.769</text><text class="formula" x="1320" y="410">ŷ = sigmoid(1.2)</text></g>
        </svg>
      </section>

      <div class="bottom min0">
        <div class="claim"><span class="claim-mark" aria-hidden="true"></span><p>前向传播只回答：按当前参数会猜什么</p></div>
        <div class="panel control">
          <div class="status" id="status" aria-live="polite">准备：沿箭头查看数值</div>
          <div class="hint">中间量为教学演示预先规定值</div>
          <button class="btn" id="advance" type="button">推进</button>
        </div>
      </div>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>
    Deck.init({index:14,total:20});
    (()=>{
      const stage=document.getElementById('stage'), button=document.getElementById('advance'), status=document.getElementById('status');
      const labels=['准备：沿箭头查看数值','输入已就位：x₁ = 0.6，x₂ = −0.4','加权和已得到：0.8、−0.3、0.1','tanh 已激活：0.664、−0.291、0.100','输出已得到：ŷ = 0.769'];
      let step=0;
      function render(){stage.dataset.step=String(step);status.textContent=labels[step];button.textContent=step===4?'重播':'推进';}
      button.addEventListener('click',()=>{step=step===4?0:step+1;render();});
      render();
    })();
  </script>
</body>
</html>
