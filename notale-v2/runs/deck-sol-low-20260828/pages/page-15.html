<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/lib/katex.min.css">
<style>
#stage{gap:18px}
.bp-page{display:flex;flex:1;min-height:0;flex-direction:column;gap:18px}
.bp-head{display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
.bp-head .lead{max-width:570px;text-align:right;color:var(--muted)}
.bp-widget{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:28px;flex:1;min-height:0}
.bp-stage{position:relative;min-width:0;min-height:0;background:var(--paper);border:2px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 3px 0 rgba(46,72,82,.12)}
.bp-stage svg{display:block;width:100%;height:100%}
.bp-edge{stroke:#81969E;stroke-width:3.5;fill:none;vector-effect:non-scaling-stroke}
.bp-edge.active{stroke:var(--target);stroke-width:5;marker-end:url(#bpBack)}
.bp-node{fill:var(--paper);stroke:var(--text);stroke-width:3;vector-effect:non-scaling-stroke}
.bp-node.output{stroke:var(--model);stroke-width:4}
.bp-node.current{stroke:var(--target);stroke-width:6}
.bp-label{font:700 17px var(--font-sans);fill:var(--muted)}
.bp-value{font:800 19px var(--font-sans);fill:var(--text)}
.bp-error{font:800 21px var(--font-num);fill:var(--target)}
.bp-rule{opacity:0;transition:opacity 240ms ease}
.bp-rule.show{opacity:1}
.bp-rule rect{fill:#FFF4F0;stroke:var(--target);stroke-width:2}
.bp-rule text{font:800 17px var(--font-sans);fill:var(--target)}
.bp-frontier{fill:var(--target)}
.bp-side{display:flex;flex-direction:column;gap:16px;min-height:0}
.bp-side .panel{display:flex;flex-direction:column;gap:15px}
.bp-status{min-height:146px}
.bp-status h2{color:var(--target)}
.bp-formula{min-height:224px;justify-content:center}
.bp-formula .formula-wrap{min-height:74px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.bp-formula .formula-wrap .katex{font-size:24px}
.bp-formula[data-visible="false"] .formula-wrap{color:var(--muted);font-size:var(--fs-sec)}
.bp-controls{margin-top:auto}
.bp-controls .btns{margin-top:12px}
.bp-progress{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:var(--fs-label);font-weight:800}
.bp-dot{width:12px;height:12px;border:2px solid var(--line);border-radius:50%;background:var(--paper)}
.bp-dot.on{background:var(--target);border-color:var(--target)}
.bp-guard{padding-top:14px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.bp-rule{transition:none}}
</style>
</head>
<body data-page="15" data-total="20">
<div id="stage">
  <main class="bp-page">
    <header class="bp-head">
      <div class="title-stack">
        <div class="kicker">误差如何返回</div>
        <h1>反向传播：把最终误差逐层分摊回去</h1>
      </div>
      <p class="lead">网络轮廓不动，误差信号沿连接反向追溯。</p>
    </header>

    <section class="bp-widget min0" data-bp-widget aria-label="反向传播逐层追踪器">
      <div class="bp-stage min0">
        <svg viewBox="0 0 1040 610" role="img" aria-labelledby="bpTitle bpDesc">
          <title id="bpTitle">二输入、三隐藏单元、一个输出的神经网络</title>
          <desc id="bpDesc">目标为一，预测为零点七六九。点击退一层，误差信号依次从输出层传向隐藏层和输入侧连接。</desc>
          <defs>
            <marker id="bpBack" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M11,6 L1,1 L1,11 Z" fill="#A53F2B"/></marker>
          </defs>
          <g aria-hidden="true">
            <text class="bp-label" x="110" y="72">输入</text><text class="bp-label" x="475" y="72">隐藏层</text><text class="bp-label" x="860" y="72">输出</text>
            <g data-early-edges>
              <path class="bp-edge" d="M450 150 L175 210"/><path class="bp-edge" d="M450 305 L175 210"/><path class="bp-edge" d="M450 460 L175 210"/>
              <path class="bp-edge" d="M450 150 L175 400"/><path class="bp-edge" d="M450 305 L175 400"/><path class="bp-edge" d="M450 460 L175 400"/>
            </g>
            <g data-late-edges>
              <path class="bp-edge" d="M835 305 L515 150"/><path class="bp-edge" d="M835 305 L515 305"/><path class="bp-edge" d="M835 305 L515 460"/>
            </g>
            <g data-early-rules class="bp-rule">
              <rect x="210" y="270" width="210" height="42" rx="5"/><text x="315" y="297" text-anchor="middle">上游误差 × 本地斜率 × 输入</text>
            </g>
            <g data-late-rules class="bp-rule">
              <rect x="565" y="270" width="220" height="42" rx="5"/><text x="675" y="297" text-anchor="middle">上游误差 × 本地斜率 × 输入</text>
            </g>
            <circle class="bp-node" cx="145" cy="210" r="31"/><circle class="bp-node" cx="145" cy="400" r="31"/>
            <circle class="bp-node" cx="480" cy="150" r="31"/><circle class="bp-node" cx="480" cy="305" r="31"/><circle class="bp-node" cx="480" cy="460" r="31"/>
            <circle class="bp-node output current" data-output cx="865" cy="305" r="39"/>
            <text class="bp-value" x="145" y="217" text-anchor="middle">x₁</text><text class="bp-value" x="145" y="407" text-anchor="middle">x₂</text>
            <text class="bp-value" x="480" y="157" text-anchor="middle">h₁</text><text class="bp-value" x="480" y="312" text-anchor="middle">h₂</text><text class="bp-value" x="480" y="467" text-anchor="middle">h₃</text>
            <text class="bp-value" x="865" y="312" text-anchor="middle">ŷ</text>
            <text class="bp-label" x="865" y="383" text-anchor="middle">目标 y = 1 · 预测 ŷ = 0.769</text>
            <text class="bp-error" x="865" y="425" text-anchor="middle">ŷ − y = −0.231</text>
          </g>
        </svg>
      </div>

      <aside class="bp-side min0">
        <section class="panel bp-status" aria-live="polite">
          <h2 data-state-title>误差从输出端出发</h2>
          <p data-state-copy>先保留输出层的误差信号 −0.231。网络连接与前向传播时完全对应，只是追溯方向相反。</p>
          <div class="bp-progress" aria-label="追溯进度"><span class="bp-dot on"></span><span class="bp-dot"></span><span class="bp-dot"></span><span data-progress-text>输出端</span></div>
        </section>
        <section class="panel q bp-formula" data-visible="false">
          <div class="kicker">当前连接的局部规则</div>
          <div class="formula-wrap" data-formula>退一层后显示链式法则</div>
          <p class="small">每条连接只需组合收到的误差、本地斜率与该连接的输入。</p>
        </section>
        <section class="panel bp-controls">
          <p class="hint">每次只退过一组连接，当前层保持目标色。</p>
          <div class="btns">
            <button class="btn" type="button" data-step>退一层</button>
            <button class="btn" type="button" data-reset disabled>回到输出端</button>
          </div>
        </section>
        <p class="small bp-guard"><strong>边界：</strong>这里追踪的是梯度如何分摊，不执行参数更新；参数更新仍属于第 9 页第四步。</p>
      </aside>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lib/katex.min.js"></script>
<script>
(() => {
  const root = document.querySelector('[data-bp-widget]');
  if (!root) return;
  const q = s => root.querySelector(s);
  const qa = s => [...root.querySelectorAll(s)];
  const state = { step: 0 };
  const views = {
    early: qa('[data-early-edges] .bp-edge'), late: qa('[data-late-edges] .bp-edge'),
    earlyRule:q('[data-early-rules]'), lateRule:q('[data-late-rules]'), output:q('[data-output]'),
    title:q('[data-state-title]'), copy:q('[data-state-copy]'), dots:qa('.bp-dot'), progress:q('[data-progress-text]'),
    formulaBox:q('.bp-formula'), formula:q('[data-formula]'), step:q('[data-step]'), reset:q('[data-reset]')
  };
  const formula = String.raw`\frac{\partial L}{\partial w}=\left(\frac{\partial L}{\partial a}\right)\left(\frac{\partial a}{\partial z}\right)\left(\frac{\partial z}{\partial w}\right)`;
  const copy = [
    ['误差从输出端出发','先保留输出层的误差信号 −0.231。网络连接与前向传播时完全对应，只是追溯方向相反。','输出端'],
    ['把误差分给三条入边','输出单元收到的误差沿三条连接退到隐藏层。每条连接使用同一个局部规则。','输出 → 隐藏'],
    ['继续追到更早连接','隐藏层收到的上游误差继续沿更早的连接向输入侧追溯。','隐藏 → 输入']
  ];
  function render(){
    const s=state.step;
    views.late.forEach(e=>e.classList.toggle('active',s===1));
    views.early.forEach(e=>e.classList.toggle('active',s===2));
    views.lateRule.classList.toggle('show',s===1);
    views.earlyRule.classList.toggle('show',s===2);
    views.output.classList.toggle('current',s===0);
    views.title.textContent=copy[s][0]; views.copy.textContent=copy[s][1]; views.progress.textContent=copy[s][2];
    views.dots.forEach((d,i)=>d.classList.toggle('on',i<=s));
    views.formulaBox.dataset.visible=String(s>0);
    if(s>0 && !views.formula.dataset.rendered){ katex.render(formula,views.formula,{throwOnError:false,displayMode:true}); views.formula.dataset.rendered='true'; }
    if(s===0){views.formula.textContent='退一层后显示链式法则'; delete views.formula.dataset.rendered;}
    views.step.disabled=s===2; views.step.textContent=s===2?'已追到最早连接':'退一层'; views.reset.disabled=s===0;
  }
  function advance(){state.step=Math.min(2,state.step+1);render();}
  function reset(){state.step=0;render();}
  views.step.addEventListener('click',advance); views.reset.addEventListener('click',reset);
  root.destroyBackwardTracer=()=>{views.step.removeEventListener('click',advance);views.reset.removeEventListener('click',reset);delete root.destroyBackwardTracer;};
  render(); Deck.init({index:15,total:20});
})();
</script>
</body>
</html>
