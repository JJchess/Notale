<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>现在，让一个小网络真的学</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:18px}
    .title-stack{padding-bottom:2px}
    .lesson-lead{margin-top:8px;color:var(--muted);font-size:var(--fs-sec);line-height:1.42}
    #xor-lab{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:24px;flex:1;min-height:0}
    #xor-lab .field-wrap{position:relative;min-width:0;min-height:0;background:var(--paper);border:2px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 3px 0 rgba(46,72,82,.12)}
    #xor-lab canvas{display:block;width:100%;height:100%}
    #xor-lab .field-label{position:absolute;left:18px;top:15px;padding:4px 8px;background:rgba(248,250,250,.9);color:var(--text);font-size:var(--fs-label);font-weight:800;border-radius:4px}
    #xor-lab .field-note{position:absolute;right:18px;bottom:14px;padding:4px 8px;background:rgba(248,250,250,.9);color:var(--muted);font-size:var(--fs-label);line-height:1.35;border-radius:4px}
    #xor-lab .rail{display:flex;flex-direction:column;gap:16px;min-height:0}
    #xor-lab .architecture{padding:17px 18px}
    #xor-lab .arch-title{font-size:var(--fs-label);color:var(--muted);font-weight:800;margin-bottom:14px}
    #xor-lab .layers{display:flex;align-items:center;justify-content:space-between;gap:8px}
    #xor-lab .layer{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--model);font-size:var(--fs-label);font-weight:800}
    #xor-lab .nodes{display:flex;gap:4px;align-items:center}
    #xor-lab .node{width:11px;height:11px;border:2px solid currentColor;border-radius:50%;background:var(--paper)}
    #xor-lab .connector{height:2px;background:var(--line);flex:1;min-width:16px}
    #xor-lab .metrics{display:grid;gap:0;padding:0;overflow:hidden}
    #xor-lab .metric{padding:16px 18px;border-bottom:1px solid var(--line)}
    #xor-lab .metric:last-child{border-bottom:0}
    #xor-lab .metric-label{color:var(--muted);font-size:var(--fs-label);font-weight:800;margin-bottom:5px}
    #xor-lab .metric-value{font-family:var(--font-num);font-size:34px;line-height:1.08;font-weight:750;font-variant-numeric:tabular-nums;color:var(--text)}
    #xor-lab .metric-value.loss{color:var(--target)}
    #xor-lab .metric-value.acc{color:var(--model)}
    #xor-lab .controls{display:flex;flex-wrap:wrap;gap:10px}
    #xor-lab .controls .primary{background:var(--model);border-color:var(--model);color:white;min-width:112px}
    #xor-lab .status{min-height:48px;color:var(--muted);font-size:var(--fs-sec);line-height:1.42;padding-top:2px}
    #xor-lab .legend{margin-top:auto;padding-top:2px}
    #xor-lab .legend-dot{width:15px;height:15px;border:3px solid currentColor;border-radius:50%;background:var(--paper)}
    #xor-lab .class0{color:var(--model)}
    #xor-lab .class1{color:var(--target)}
  </style>
</head>
<body data-page="16" data-total="20">
  <div id="stage">
    <header class="title-stack">
      <div class="kicker">实时训练实验</div>
      <h1>现在，让一个小网络真的学</h1>
      <p class="lesson-lead">同一批 XOR 样本保持不变。运行训练，观察决策区域怎样从乱猜逐渐贴合四簇数据。</p>
    </header>

    <main id="xor-lab" aria-label="XOR 神经网络实时训练实验">
      <section class="field-wrap min0" aria-label="XOR 决策场">
        <canvas id="field" class="cv-fill" role="img" aria-label="当前网络在二维平面上的决策热力场与二百个训练样本"></canvas>
        <div class="field-label">决策场 · 输出概率</div>
        <div class="field-note">深蓝偏向类别 0　砖红偏向类别 1</div>
      </section>

      <aside class="rail min0">
        <section class="panel architecture" aria-label="网络结构">
          <div class="arch-title">固定网络结构</div>
          <div class="layers" aria-label="2 输入，10 神经元，10 神经元，1 输出">
            <div class="layer"><div class="nodes"><i class="node"></i><i class="node"></i></div><span>输入 2</span></div>
            <i class="connector"></i>
            <div class="layer"><div class="nodes"><i class="node"></i><i class="node"></i><i class="node"></i><i class="node"></i><i class="node"></i></div><span>隐藏 10</span></div>
            <i class="connector"></i>
            <div class="layer"><div class="nodes"><i class="node"></i><i class="node"></i><i class="node"></i><i class="node"></i><i class="node"></i></div><span>隐藏 10</span></div>
            <i class="connector"></i>
            <div class="layer"><div class="nodes"><i class="node"></i></div><span>输出 1</span></div>
          </div>
        </section>

        <section class="panel metrics" aria-label="训练读数">
          <div class="metric"><div class="metric-label">已处理 mini-batch</div><output id="batches" class="metric-value">0</output></div>
          <div class="metric"><div class="metric-label">训练损失</div><output id="loss" class="metric-value loss">—</output></div>
          <div class="metric"><div class="metric-label">准确率（训练集）</div><output id="acc" class="metric-value acc">—</output></div>
        </section>

        <div class="controls" aria-label="训练控制">
          <button id="toggle" class="btn primary" type="button" aria-pressed="false">开始</button>
          <button id="step" class="btn" type="button">单步 12 批</button>
          <button id="reset" class="btn" type="button">重置</button>
        </div>
        <p id="status" class="status" aria-live="polite">网络尚未训练；背景来自随机初始化的现场预测。</p>
        <div class="legend" aria-label="样本图例">
          <span class="li class0"><i class="legend-dot"></i>类别 0</span>
          <span class="li class1"><i class="legend-dot"></i>类别 1</span>
        </div>
      </aside>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/lib/mlp.js"></script>
  <script>
  (() => {
    const root = document.getElementById('xor-lab');
    const canvas = root.querySelector('#field');
    const toggle = root.querySelector('#toggle');
    const stepBtn = root.querySelector('#step');
    const resetBtn = root.querySelector('#reset');
    const batchOut = root.querySelector('#batches');
    const lossOut = root.querySelector('#loss');
    const accOut = root.querySelector('#acc');
    const status = root.querySelector('#status');
    const trainSet = [];
    const rng = new Math.seedrandom('page-16-xor');
    const centers = [[-.7,-.7,0],[.7,.7,0],[-.7,.7,1],[.7,-.7,1]];
    centers.forEach(c => { for(let i=0;i<50;i++) trainSet.push({x:[c[0]+(rng()*.44-.22),c[1]+(rng()*.44-.22)],t:c[2]}); });

    let net, field, running=false, batches=0, frames=0, stopLoop=null, fitStop=null;
    function fresh(){
      net = MLP.create({sizes:[2,10,10,1],act:'tanh',lr:0.3,seed:16});
      field = net.field(-1.3,-1.3,1.3,1.3,80,80);
      batches=0;frames=0;
    }
    function metric(){
      const m=net.evaluate(trainSet);
      batchOut.textContent=String(batches);
      lossOut.textContent=Number.isFinite(m.loss)?m.loss.toFixed(4):'数值异常';
      accOut.textContent=Number.isFinite(m.acc)?(m.acc*100).toFixed(1)+'%':'数值异常';
      return m;
    }
    function draw(ctx){
      const w=canvas.offsetWidth,h=canvas.offsetHeight;
      ctx.clearRect(0,0,w,h);
      const pad={l:58,r:28,t:52,b:48}, pw=w-pad.l-pad.r, ph=h-pad.t-pad.b;
      const sx=x=>pad.l+(x+1.3)/2.6*pw, sy=y=>pad.t+(1.3-y)/2.6*ph;
      const model=getComputedStyle(document.documentElement).getPropertyValue('--model').trim();
      const target=getComputedStyle(document.documentElement).getPropertyValue('--target').trim();
      for(let gy=0;gy<80;gy++) for(let gx=0;gx<80;gx++){
        const p=field[gy*80+gx], x=pad.l+gx*pw/80, y=pad.t+(79-gy)*ph/80;
        ctx.fillStyle=p>=.5?`rgba(165,63,43,${.08+Math.abs(p-.5)*.48})`:`rgba(20,92,116,${.08+Math.abs(p-.5)*.48})`;
        ctx.fillRect(x,y,pw/80+1,ph/80+1);
      }
      ctx.strokeStyle='#A8B8BE';ctx.lineWidth=1;
      for(let v=-1;v<=1;v+=.5){ctx.beginPath();ctx.moveTo(sx(v),pad.t);ctx.lineTo(sx(v),pad.t+ph);ctx.stroke();ctx.beginPath();ctx.moveTo(pad.l,sy(v));ctx.lineTo(pad.l+pw,sy(v));ctx.stroke();}
      ctx.strokeStyle='#17262D';ctx.lineWidth=2;ctx.strokeRect(pad.l,pad.t,pw,ph);
      trainSet.forEach(d=>{ctx.beginPath();ctx.arc(sx(d.x[0]),sy(d.x[1]),5.5,0,Math.PI*2);ctx.fillStyle='#F8FAFA';ctx.fill();ctx.strokeStyle=d.t?target:model;ctx.lineWidth=3;ctx.stroke();});
      ctx.fillStyle='#526770';ctx.font='15px '+getComputedStyle(document.body).fontFamily;ctx.textAlign='center';ctx.textBaseline='top';[-1,-.5,0,.5,1].forEach(v=>ctx.fillText(String(v),sx(v),pad.t+ph+10));
      ctx.textAlign='right';ctx.textBaseline='middle';[-1,-.5,0,.5,1].forEach(v=>ctx.fillText(String(v),pad.l-12,sy(v)));
      ctx.save();ctx.translate(17,pad.t+ph/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText('输入 x₂',0,0);ctx.restore();
      ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText('输入 x₁',pad.l+pw/2,h-5);
    }
    function redraw(){ const ctx=Deck.fit(canvas); draw(ctx); }
    function trainTwelve(){
      for(let i=0;i<12;i++) net.step(trainSet,16);
      batches+=12;frames++;
      if(frames%8===0 || !running) field=net.field(-1.3,-1.3,1.3,1.3,80,80);
      const m=metric(); redraw();
      if(net.diverged || !Number.isFinite(m.loss)){ pause(); status.textContent='训练出现数值异常；请重置后再试。'; }
    }
    function pause(){ running=false;toggle.textContent='开始';toggle.setAttribute('aria-pressed','false');if(stopLoop){stopLoop();stopLoop=null;} }
    function start(){
      if(running)return;running=true;toggle.textContent='暂停';toggle.setAttribute('aria-pressed','true');status.textContent='正在训练；热力场每 8 帧按当前网络更新。';
      stopLoop=Deck.loop(()=>{ if(running) trainTwelve(); });
    }
    toggle.addEventListener('click',()=>{if(running){pause();field=net.field(-1.3,-1.3,1.3,1.3,80,80);metric();redraw();status.textContent='已暂停，可比较当前边界与训练读数。';}else start();});
    stepBtn.addEventListener('click',()=>{pause();trainTwelve();status.textContent='已推进 12 个 mini-batch。';});
    resetBtn.addEventListener('click',()=>{pause();fresh();metric();redraw();status.textContent='已重置：样本与网络初始权重恢复到同一状态。';});
    fresh();metric();fitStop=Deck.autofit(canvas,draw);Deck.init({index:16,total:20});
    root.destroyXorLab=()=>{pause();if(fitStop)fitStop();};
  })();
  </script>
</body>
</html>
