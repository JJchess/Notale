<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:18px}
    .p17-title{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;flex:0 0 auto}
    .p17-title .lead{max-width:520px;color:var(--muted);padding-bottom:4px;text-align:right}
    .p17-widget{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:16px;flex:1;min-height:0}
    .p17-rail{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:2px solid var(--text);border-bottom:1px solid var(--line)}
    .p17-rail .status{margin-left:auto;color:var(--muted);font-size:var(--fs-label);font-weight:750}
    .p17-compare{display:grid;grid-template-columns:1fr 1fr;gap:30px;min-height:0}
    .p17-view{display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;min-width:0;min-height:0}
    .p17-viewhead{display:grid;grid-template-columns:1fr auto auto;gap:22px;align-items:end;padding:0 4px}
    .p17-viewhead h2{font-size:var(--fs-h2)}
    .p17-metric{display:flex;align-items:baseline;gap:7px;color:var(--muted);font-size:var(--fs-label);font-weight:750}
    .p17-metric output{color:var(--text);font-family:var(--font-num);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
    .p17-canvas{position:relative;min-height:0;background:var(--paper);border:2px solid var(--line);border-radius:8px;overflow:hidden}
    .p17-canvas canvas{position:absolute;inset:0;width:100%;height:100%}
    .p17-axisnote{position:absolute;left:16px;bottom:12px;color:var(--muted);font-size:var(--fs-label);pointer-events:none}
    .p17-foot{display:flex;align-items:center;justify-content:space-between;gap:28px;border-top:1px solid var(--line);padding-top:12px}
    .p17-foot p{font-size:var(--fs-sec)}
    .p17-foot .invariant{color:var(--muted);text-align:right;font-size:var(--fs-label)}
  </style>
</head>
<body data-page="17" data-total="20">
  <div id="stage">
    <header class="p17-title">
      <div class="title-stack">
        <div class="kicker">训练与验证</div>
        <h1>真正关心的是：没见过的样本能否预测</h1>
      </div>
      <p class="lead">同一个网络、同一轮训练，分别看见过与没见过的数据。</p>
    </header>

    <section class="p17-widget min0" data-widget aria-label="训练集与验证集同步比较">
      <div class="p17-rail">
        <button class="btn" type="button" data-start>开始训练</button>
        <button class="btn" type="button" data-pause disabled>暂停</button>
        <button class="btn" type="button" data-reset>重置</button>
        <span class="status">训练更新 <span class="num" data-steps>0</span> 次 · 每次仅用训练集</span>
      </div>

      <div class="p17-compare min0">
        <section class="p17-view min0" aria-labelledby="train-title">
          <div class="p17-viewhead">
            <h2 id="train-title" class="sample-text">训练集 n=160</h2>
            <div class="p17-metric">loss <output data-train-loss>—</output></div>
            <div class="p17-metric">acc <output data-train-acc>—</output></div>
          </div>
          <div class="p17-canvas min0">
            <canvas data-train aria-label="训练集样本和当前网络预测区域"></canvas>
            <span class="p17-axisnote">相同坐标范围 −1.2 至 1.2</span>
          </div>
        </section>

        <section class="p17-view min0" aria-labelledby="val-title">
          <div class="p17-viewhead">
            <h2 id="val-title" class="target-text">验证集 n=80</h2>
            <div class="p17-metric">loss <output data-val-loss>—</output></div>
            <div class="p17-metric">acc <output data-val-acc>—</output></div>
          </div>
          <div class="p17-canvas min0">
            <canvas data-val aria-label="验证集样本和当前网络预测区域"></canvas>
            <span class="p17-axisnote">相同坐标范围 −1.2 至 1.2</span>
          </div>
        </section>
      </div>

      <div class="p17-foot">
        <p><strong>观察：</strong>两边的 loss 与 acc 会不会同步变化？</p>
        <p class="invariant">网络配置固定为 2–10–10–1；验证集只评估，不参与参数更新。</p>
      </div>
    </section>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/lib/mlp.js"></script>
  <script>
  (() => {
    const root=document.querySelector('[data-widget]');
    const q=s=>root.querySelector(s);
    const trainCanvas=q('[data-train]'), valCanvas=q('[data-val]');
    const startBtn=q('[data-start]'), pauseBtn=q('[data-pause]'), resetBtn=q('[data-reset]');
    const out={tl:q('[data-train-loss]'),ta:q('[data-train-acc]'),vl:q('[data-val-loss]'),va:q('[data-val-acc]'),steps:q('[data-steps]')};
    let net, all, trainSet, valSet, running=false, raf=0, frames=0, updates=0, destroyed=false;

    function makeData(){
      const rng=new Math.seedrandom('page-17-split');
      return Array.from({length:240},()=>{
        const x=rng()*2-1, y=rng()*2-1;
        return {x:[x,y],t:(x>=0)!==(y>=0)?1:0};
      });
    }
    function makeNet(){ return MLP.create({sizes:[2,10,10,1],act:'tanh',lr:0.3,seed:17}); }
    function metrics(){
      const a=net.evaluate(trainSet), b=net.evaluate(valSet);
      out.tl.textContent=a.loss.toFixed(3); out.ta.textContent=(a.acc*100).toFixed(1)+'%';
      out.vl.textContent=b.loss.toFixed(3); out.va.textContent=(b.acc*100).toFixed(1)+'%';
      out.steps.textContent=updates;
    }
    function draw(canvas,set){
      const ctx=Deck.fit(canvas), w=canvas.offsetWidth, h=canvas.offsetHeight;
      ctx.clearRect(0,0,w,h);
      const pad=26, x0=pad, y0=pad, pw=w-pad*2, ph=h-pad*2;
      const field=net.field(-1.2,-1.2,1.2,1.2,52,52), cw=pw/52, ch=ph/52;
      for(let j=0;j<52;j++) for(let i=0;i<52;i++){
        const p=field[j*52+i], a=.08+Math.abs(p-.5)*.25;
        ctx.fillStyle=p>=.5?`rgba(20,92,116,${a})`:`rgba(165,63,43,${a})`;
        ctx.fillRect(x0+i*cw,y0+(51-j)*ch,cw+1,ch+1);
      }
      ctx.strokeStyle='#A8B8BE';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x0+pw/2,y0);ctx.lineTo(x0+pw/2,y0+ph);ctx.moveTo(x0,y0+ph/2);ctx.lineTo(x0+pw,y0+ph/2);ctx.stroke();
      set.forEach(d=>{
        const x=x0+(d.x[0]+1.2)/2.4*pw, y=y0+ph-(d.x[1]+1.2)/2.4*ph;
        ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle=d.t?'#145C74':'#A53F2B';ctx.fill();
        ctx.strokeStyle='#F8FAFA';ctx.lineWidth=2;ctx.stroke();
      });
      ctx.strokeStyle='#526770';ctx.lineWidth=1.5;ctx.strokeRect(x0,y0,pw,ph);
    }
    function drawBoth(){draw(trainCanvas,trainSet);draw(valCanvas,valSet)}
    function render(){
      startBtn.disabled=running; pauseBtn.disabled=!running;
      startBtn.textContent=updates?'继续训练':'开始训练';
      metrics();drawBoth();
    }
    function loop(){
      if(!running||destroyed)return;
      net.step(trainSet,16); updates++; frames++;
      if(frames%10===0) render();
      raf=requestAnimationFrame(loop);
    }
    function start(){if(running)return;running=true;render();raf=requestAnimationFrame(loop)}
    function pause(){if(!running)return;running=false;cancelAnimationFrame(raf);render()}
    function reset(){pause();net=makeNet();updates=0;frames=0;render()}
    function init(){all=makeData();trainSet=all.slice(0,160);valSet=all.slice(160);net=makeNet();render()}
    startBtn.addEventListener('click',start);pauseBtn.addEventListener('click',pause);resetBtn.addEventListener('click',reset);
    const offResize=Deck.onResize(drawBoth);
    root.destroyWidget=()=>{if(destroyed)return;destroyed=true;running=false;cancelAnimationFrame(raf);offResize();startBtn.removeEventListener('click',start);pauseBtn.removeEventListener('click',pause);resetBtn.removeEventListener('click',reset)};
    Deck.init({index:17,total:20});init();
  })();
  </script>
</body>
</html>
