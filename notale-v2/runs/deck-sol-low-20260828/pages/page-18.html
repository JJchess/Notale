<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root{--bg:#E8EEF1;--paper:#F8FAFA;--text:#17262D;--muted:#526770;--line:#A8B8BE;--model:#145C74;--target:#A53F2B;--attention:#D88416;--focus:#B36A08;--font-sans:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;--font-num:"IBM Plex Mono",Consolas,monospace;--fs-h1:42px;--fs-body:19px;--fs-sec:17px;--fs-label:15px}
    body{background:var(--bg);color:var(--text);font-family:var(--font-sans)}
    #stage{display:flex;flex-direction:column;padding:28px 56px;gap:18px}
    h1,p{margin:0} h1{font-size:var(--fs-h1);line-height:1.16;font-weight:800;letter-spacing:-.02em}
    button{font:inherit}.title-stack{display:flex;flex-direction:column}.kicker{color:var(--model);font-size:var(--fs-label);line-height:1.3;font-weight:800;letter-spacing:.11em;margin-bottom:7px}
    .btn{min-height:44px;padding:9px 17px;border:2px solid var(--text);border-radius:6px;background:var(--paper);color:var(--text);font-size:var(--fs-label);font-weight:800;cursor:pointer}.btn[aria-pressed="true"]{border-color:var(--attention);background:#FFF1D8;color:#714000}
    #stage{gap:18px}
    .title-stack{height:104px}
    .title-stack h1{max-width:1120px}
    #lab{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px}
    #lab .rail{display:flex;align-items:center;gap:18px;padding:12px 16px;border-top:2px solid var(--text);border-bottom:1px solid var(--line)}
    #lab .choice{display:flex;align-items:center;gap:8px}
    #lab .choice-label{font-size:var(--fs-label);font-weight:800;color:var(--muted);margin-right:3px}
    #lab .spacer{flex:1}
    #lab .run{background:var(--model);border-color:var(--model);color:white;min-width:90px}
    #lab .run[aria-pressed="true"]{background:var(--target);border-color:var(--target);color:white}
    #lab .stage-grid{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(360px,.8fr);gap:18px;min-height:0}
    #lab .field-wrap{position:relative;min-height:0;background:var(--paper);border:2px solid var(--line);border-radius:8px;overflow:hidden}
    #lab canvas{position:absolute;inset:0;width:100%;height:100%}
    #lab .field-label{position:absolute;left:16px;top:13px;font-size:var(--fs-label);font-weight:800;color:var(--muted);background:rgba(248,250,250,.9);padding:3px 7px}
    #lab .field-note{position:absolute;right:14px;bottom:11px;font-size:var(--fs-label);color:var(--muted);background:rgba(248,250,250,.9);padding:3px 7px}
    #lab .side{display:grid;grid-template-rows:auto minmax(0,1fr);gap:14px;min-height:0}
    #lab .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--paper);border:2px solid var(--line);border-radius:8px}
    #lab .metric{padding:14px 15px;border-right:1px solid var(--line)}
    #lab .metric:last-child{border-right:0}
    #lab .ml{font-size:var(--fs-label);color:var(--muted);font-weight:800;margin-bottom:7px}
    #lab .mv{font:750 30px/1 var(--font-num);font-variant-numeric:tabular-nums}
    #lab .history{position:relative;min-height:0;background:var(--paper);border:2px solid var(--line);border-radius:8px;overflow:hidden}
    #lab .history-head{position:absolute;z-index:2;left:16px;right:16px;top:13px;display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-label);font-weight:800;color:var(--muted)}
    #lab .legend-mini{display:flex;gap:16px;font-weight:700}
    #lab .legend-mini span::before{content:"";display:inline-block;width:18px;border-top:3px solid var(--model);margin-right:6px;vertical-align:4px}
    #lab .legend-mini .prev::before{border-color:var(--target);border-top-style:dashed}
    #lab .bottom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;min-height:56px;padding-top:2px}
    #lab .feedback{font-size:var(--fs-sec);line-height:1.4;font-weight:700}
    #lab .invariant{color:var(--muted);font-size:var(--fs-label);margin-top:4px}
    #lab .compare-actions{display:flex;gap:10px}
    #lab button:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
  </style>
</head>
<body data-page="18" data-total="20">
  <div id="stage">
    <header class="title-stack">
      <div class="kicker">参数控制实验</div>
      <h1>不是网络越大、步子越大就一定越好</h1>
    </header>

    <section id="lab" aria-label="网络结构与学习率实验">
      <div class="rail">
        <div class="choice" role="group" aria-label="网络结构">
          <span class="choice-label">网络结构</span>
          <button class="btn arch" type="button" data-sizes="2,2,1" aria-pressed="true">2→2→1</button>
          <button class="btn arch" type="button" data-sizes="2,6,1" aria-pressed="false">2→6→1</button>
          <button class="btn arch" type="button" data-sizes="2,10,10,1" aria-pressed="false">2→10→10→1</button>
        </div>
        <div class="choice" role="group" aria-label="学习率">
          <span class="choice-label">学习率</span>
          <button class="btn lr" type="button" data-lr="0.03" aria-pressed="false">0.03</button>
          <button class="btn lr" type="button" data-lr="0.3" aria-pressed="true">0.3</button>
          <button class="btn lr" type="button" data-lr="3" aria-pressed="false">3.0</button>
        </div>
        <span class="spacer"></span>
        <button class="btn run" type="button" aria-pressed="false">开始</button>
        <button class="btn reset" type="button">重置本次</button>
      </div>

      <div class="stage-grid">
        <div class="field-wrap min0">
          <canvas class="field cv-fill" aria-label="XOR 样本与当前网络的预测区域"></canvas>
          <div class="field-label">同一组 XOR 样本 · 预测区域</div>
          <div class="field-note">颜色越深，预测越确定</div>
        </div>
        <div class="side min0">
          <div class="metrics">
            <div class="metric"><div class="ml">loss</div><div class="mv loss">—</div></div>
            <div class="metric"><div class="ml">acc</div><div class="mv acc">—</div></div>
            <div class="metric"><div class="ml">数值崩溃</div><div class="mv div">否</div></div>
          </div>
          <div class="history min0">
            <div class="history-head"><span>训练轨迹 · loss</span><span class="legend-mini"><span>本次</span><span class="prev">对照</span></span></div>
            <canvas class="trace cv-fill" aria-label="当前与对照实验的损失曲线"></canvas>
          </div>
        </div>
      </div>

      <div class="bottom">
        <div>
          <div class="feedback" aria-live="polite">先选参数，再按“开始”。改变参数会重新初始化并把训练计数清零。</div>
          <div class="invariant">保持不变：XOR 200 点、样本顺序、初始化种子 18。比较两组即可，不必穷举。</div>
        </div>
        <div class="compare-actions">
          <button class="btn save" type="button">留作对照</button>
          <button class="btn clear" type="button">清除对照</button>
        </div>
      </div>
    </section>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/lib/mlp.js"></script>
  <script>
  (()=>{
    Deck.init({index:18,total:20});
    const root=document.getElementById('lab');
    const q=s=>root.querySelector(s), qa=s=>[...root.querySelectorAll(s)];
    const rng=new Math.seedrandom('xor-page-16');
    const data=Array.from({length:200},()=>{const x=[rng()*2-1,rng()*2-1];return {x,t:(x[0]>0)!==(x[1]>0)?1:0};});
    let state={sizes:[2,2,1],lr:.3,net:null,steps:0,running:false,history:[],comparison:null,lastEval:null};
    let loopStop=null,destroyed=false,fieldCtx,traceCtx,fw=1,fh=1,tw=1,th=1;
    const fieldFit=Deck.autofit(q('.field'),ctx=>{fieldCtx=ctx;fw=q('.field').offsetWidth||1;fh=q('.field').offsetHeight||1;drawField();});
    const traceFit=Deck.autofit(q('.trace'),ctx=>{traceCtx=ctx;tw=q('.trace').offsetWidth||1;th=q('.trace').offsetHeight||1;drawTrace();});
    function fresh(){stop();state.net=MLP.create({sizes:state.sizes,act:'tanh',lr:state.lr,seed:18});state.steps=0;state.history=[];state.lastEval=state.net.evaluate(data);render();}
    function stop(){if(loopStop){loopStop();loopStop=null;}state.running=false;}
    function start(){if(state.running){stop();render();return;}state.running=true;loopStop=Deck.loop(()=>{for(let i=0;i<12;i++)state.net.step(data,16);state.steps+=12;state.lastEval=state.net.evaluate(data);if(state.steps%48===0)state.history.push({n:state.steps,loss:state.lastEval.loss});if(state.history.length>150)state.history.shift();if(state.net.diverged)stop();render();},{still:1});render();}
    function render(){
      qa('.arch').forEach(b=>b.setAttribute('aria-pressed',b.dataset.sizes===state.sizes.join(',')));
      qa('.lr').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.lr)===state.lr));
      q('.run').textContent=state.running?'暂停':'开始';q('.run').setAttribute('aria-pressed',state.running);
      const e=state.lastEval;q('.loss').textContent=e&&Number.isFinite(e.loss)?e.loss.toFixed(3):'—';q('.acc').textContent=e?(e.acc*100).toFixed(1)+'%':'—';q('.div').textContent=state.net&&state.net.diverged?'是':'否';
      let msg=state.steps===0?'参数已就绪；必须按“开始”才会训练。':`已训练 ${state.steps} 个 mini-batch。`;
      if(state.net&&state.net.diverged)msg='权重出现非有限值或越界，训练已停止。';
      else if(state.steps>=1200&&e&&e.acc<.6)msg='数值没有崩溃，也可能没学会。';
      else if(state.comparison&&state.steps>0)msg+=' 对照曲线保留在图中；请比较过程，而不是寻找“最佳”。';
      q('.feedback').textContent=msg;drawField();drawTrace();
    }
    function drawField(){if(!fieldCtx||!state.net)return;const c=fieldCtx,w=fw,h=fh;c.clearRect(0,0,w,h);const nx=48,ny=32,vals=state.net.field(-1,-1,1,1,nx,ny);for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const p=vals[j*nx+i],a=.08+Math.abs(p-.5)*.46;c.fillStyle=p>=.5?`rgba(165,63,43,${a})`:`rgba(20,92,116,${a})`;c.fillRect(i*w/nx,j*h/ny,w/nx+1,h/ny+1);}c.strokeStyle='rgba(23,38,45,.18)';c.lineWidth=1;c.beginPath();c.moveTo(w/2,0);c.lineTo(w/2,h);c.moveTo(0,h/2);c.lineTo(w,h/2);c.stroke();for(const d of data){const x=(d.x[0]+1)*w/2,y=(1-(d.x[1]+1)/2)*h;c.beginPath();d.t?c.rect(x-4,y-4,8,8):c.arc(x,y,4,0,Math.PI*2);c.fillStyle=d.t?'#A53F2B':'#145C74';c.fill();c.strokeStyle='#F8FAFA';c.lineWidth=1.5;c.stroke();}}
    function drawTrace(){if(!traceCtx)return;const c=traceCtx,w=tw,h=th;c.clearRect(0,0,w,h);const L=54,R=18,T=52,B=36;c.strokeStyle='#A8B8BE';c.lineWidth=1;c.beginPath();c.moveTo(L,T);c.lineTo(L,h-B);c.lineTo(w-R,h-B);c.stroke();c.fillStyle='#526770';c.font='15px sans-serif';c.fillText('1.0',14,T+5);c.fillText('0',35,h-B+5);c.fillText('训练步数',w-80,h-10);const all=[state.history,state.comparison?state.comparison.history:[]];const maxN=Math.max(1200,...all.flat().map(d=>d.n));function line(arr,color,dash){if(!arr.length)return;c.strokeStyle=color;c.lineWidth=3;c.setLineDash(dash);c.beginPath();arr.forEach((d,i)=>{const x=L+d.n/maxN*(w-L-R),y=T+Math.min(1,d.loss)*(h-T-B);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.setLineDash([]);}line(state.comparison?state.comparison.history:[],'#A53F2B',[8,6]);line(state.history,'#145C74',[]);}
    qa('.arch').forEach(b=>b.addEventListener('click',()=>{state.sizes=b.dataset.sizes.split(',').map(Number);fresh();}));
    qa('.lr').forEach(b=>b.addEventListener('click',()=>{state.lr=Number(b.dataset.lr);fresh();}));
    q('.run').addEventListener('click',start);q('.reset').addEventListener('click',fresh);
    q('.save').addEventListener('click',()=>{state.comparison={history:state.history.slice(),sizes:state.sizes.slice(),lr:state.lr};q('.feedback').textContent='本次轨迹已留作对照。现在改变结构或学习率，再按“开始”。';drawTrace();});
    q('.clear').addEventListener('click',()=>{state.comparison=null;render();});
    fresh();
    root.destroy=()=>{if(destroyed)return;destroyed=true;stop();fieldFit();traceFit();};
  })();
  </script>
</body>
</html>
