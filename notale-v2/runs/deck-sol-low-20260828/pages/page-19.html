<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:18px}
    .title-stack{gap:0}
    .page-lead{margin-top:8px;color:var(--muted);font-size:var(--fs-sec)}
    #order-widget{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;flex:1;min-height:0}
    #order-widget .side{display:flex;flex-direction:column;gap:12px;min-height:0}
    #order-widget .side-title{font-size:var(--fs-h2);font-weight:800}
    #order-widget .keys{display:flex;flex-direction:column;gap:10px}
    #order-widget .key-row{display:grid;grid-template-columns:minmax(0,1fr) 56px 56px;gap:7px;align-items:center}
    #order-widget .pick{min-height:50px;border:2px solid var(--line);border-radius:7px;background:var(--paper);color:var(--text);text-align:left;padding:8px 12px;font-size:var(--fs-label);font-weight:800;cursor:pointer}
    #order-widget .pick[aria-pressed="true"]{border-color:var(--attention);outline:3px solid rgba(216,132,22,.2)}
    #order-widget .move{min-height:44px;padding:6px;border:2px solid var(--line);border-radius:6px;background:var(--paper);font-size:var(--fs-label);font-weight:800;cursor:pointer}
    #order-widget button:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
    #order-widget .side-note{margin-top:auto;color:var(--muted);font-size:var(--fs-label);line-height:1.45}
    #order-widget .work{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:14px;min-width:0;min-height:0}
    #order-widget .board-wrap{position:relative;min-height:0;border:2px solid var(--line);border-radius:8px;background:var(--paper);overflow:hidden}
    #order-widget #konva-stage{position:absolute;inset:0}
    #order-widget .dom-labels{position:absolute;inset:0;pointer-events:none}
    #order-widget .card-label{position:absolute;display:grid;place-items:center;width:230px;height:64px;padding:0 12px;text-align:center;font-size:var(--fs-sec);font-weight:800;line-height:1.3;color:var(--text);transform:translate(-50%,-50%)}
    #order-widget .slot-label{position:absolute;color:var(--muted);font-size:var(--fs-label);font-weight:800;transform:translate(-50%,-50%)}
    #order-widget .rail{display:flex;align-items:center;gap:12px;min-height:58px}
    #order-widget .feedback{flex:1;min-height:48px;display:flex;align-items:center;border-top:2px solid var(--line);font-size:var(--fs-sec);font-weight:750;line-height:1.4;padding:8px 4px}
    #order-widget .feedback.bad{color:var(--target)}
    #order-widget .feedback.good{color:var(--sample)}
    #order-widget .result-chain{position:absolute;left:42px;right:42px;bottom:22px;display:none;align-items:center;justify-content:center;gap:10px;color:var(--text);font-size:var(--fs-sec);font-weight:800}
    #order-widget .result-chain.show{display:flex}
    #order-widget .result-chain b{color:var(--model)}
  </style>
</head>
<body data-page="19" data-total="20">
  <div id="stage">
    <header class="title-stack">
      <div class="kicker">概念检查</div>
      <h1>把一次学习过程排对顺序</h1>
      <p class="page-lead">拖动条目调整因果顺序；也可以先选中条目，再用上移、下移。</p>
    </header>

    <main id="order-widget" aria-label="学习过程排序练习">
      <aside class="side min0">
        <h2 class="side-title">四项作答</h2>
        <div class="keys" data-key-list></div>
        <p class="side-note">判断标准：后一项是否能使用前一项产生的结果。提交后只检查第一个断裂关系。</p>
      </aside>
      <section class="work min0">
        <div class="board-wrap no-pan" aria-label="可拖动排序区">
          <div id="konva-stage" aria-hidden="true"></div>
          <div class="dom-labels" data-labels></div>
          <div class="result-chain" data-chain><span>输入</span><b>→</b><span>前向传播</span><b>→</b><span>损失</span><b>→</b><span>反向传播</span><b>→</b><span>更新参数</span></div>
        </div>
        <div class="rail">
          <div class="feedback" data-feedback aria-live="polite">当前顺序尚未提交。</div>
          <div class="btns"><button class="btn" type="button" data-reset>重置</button><button class="btn" type="button" data-submit>提交顺序</button></div>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lib/konva.min.js"></script>
  <script>
  (()=>{
    Deck.init({index:19,total:20});
    const root=document.getElementById('order-widget');
    const host=root.querySelector('#konva-stage'), labels=root.querySelector('[data-labels]');
    const keyList=root.querySelector('[data-key-list]'), feedback=root.querySelector('[data-feedback]'), chain=root.querySelector('[data-chain]');
    const ITEMS={update:'按学习率更新参数',predict:'计算预测',back:'反向求各参数影响',compare:'与真实标签比较'};
    const correct=['predict','compare','back','update'];
    const initial=['update','predict','back','compare'];
    let state={order:[...initial],selected:'update',submitted:false};
    let stage,layer,nodes={},labelNodes={},offResize=()=>{};
    function geometry(){const w=host.offsetWidth||1080,h=host.offsetHeight||590;return {w,h,x:Math.max(145,w*.14),gap:Math.min(270,(w-300)/3),y:Math.max(210,h*.43)};}
    function makeStage(){
      stage=new Konva.Stage({container:host,width:host.offsetWidth,height:host.offsetHeight});layer=new Konva.Layer();stage.add(layer);
      correct.forEach(id=>{
        const g=new Konva.Group({draggable:true,name:id});
        const rect=new Konva.Rect({x:-115,y:-32,width:230,height:64,cornerRadius:8,fill:'#F8FAFA',stroke:'#A8B8BE',strokeWidth:2,shadowColor:'rgba(46,72,82,.16)',shadowBlur:0,shadowOffsetY:3});
        g.add(rect); layer.add(g); nodes[id]=g;
        const lab=document.createElement('div');lab.className='card-label';lab.textContent=ITEMS[id];labels.appendChild(lab);labelNodes[id]=lab;
        g.on('dragstart',()=>{state.selected=id;state.submitted=false;render();g.moveToTop();});
        g.on('dragmove',()=>positionLabel(id));
        g.on('dragend',()=>{const geo=geometry();let idx=Math.round((g.x()-geo.x)/geo.gap);idx=Math.max(0,Math.min(3,idx));const next=state.order.filter(x=>x!==id);next.splice(idx,0,id);state.order=next;state.submitted=false;render();});
      });
      offResize=Deck.onResize(resize);resize();
    }
    function drawBase(){const g=geometry();layer.find('.base').forEach(n=>n.destroy());for(let i=0;i<4;i++){
      layer.add(new Konva.Rect({name:'base',x:g.x+i*g.gap-123,y:g.y-40,width:246,height:80,cornerRadius:8,stroke:'#A8B8BE',strokeWidth:2,dash:[8,7]}));
      layer.add(new Konva.Text({name:'base',x:g.x+i*g.gap-18,y:g.y-78,width:36,align:'center',text:String(i+1),fontSize:15,fontStyle:'bold',fill:'#526770'}));
      if(i<3){layer.add(new Konva.Arrow({name:'base',points:[g.x+i*g.gap+125,g.y,g.x+(i+1)*g.gap-125,g.y],stroke:'#145C74',fill:'#145C74',strokeWidth:3,pointerLength:10,pointerWidth:10}));}
    }}
    function positionLabel(id){const p=nodes[id].position();labelNodes[id].style.left=p.x+'px';labelNodes[id].style.top=p.y+'px';}
    function resize(){const g=geometry();stage.size({width:g.w,height:g.h});drawBase();render();}
    function move(id,delta){const i=state.order.indexOf(id),j=Math.max(0,Math.min(3,i+delta));if(i===j)return;const next=[...state.order];next.splice(i,1);next.splice(j,0,id);state.order=next;state.selected=id;state.submitted=false;render();}
    function renderKeys(){keyList.innerHTML='';state.order.forEach((id,i)=>{const row=document.createElement('div');row.className='key-row';row.innerHTML=`<button type="button" class="pick" aria-pressed="${state.selected===id}" data-pick="${id}">${ITEMS[id]}</button><button type="button" class="move" data-move="-1" data-id="${id}" aria-label="上移${ITEMS[id]}" ${i===0?'disabled':''}>上移</button><button type="button" class="move" data-move="1" data-id="${id}" aria-label="下移${ITEMS[id]}" ${i===3?'disabled':''}>下移</button>`;keyList.appendChild(row);});}
    function render(){const g=geometry();state.order.forEach((id,i)=>{nodes[id].position({x:g.x+i*g.gap,y:g.y});nodes[id].findOne('Rect').stroke(state.selected===id?'#D88416':'#A8B8BE');positionLabel(id);});renderKeys();chain.classList.remove('show');feedback.className='feedback';if(!state.submitted)feedback.textContent='当前顺序尚未提交。';layer.draw();}
    function submit(){state.submitted=true;let bad=-1;for(let i=0;i<4;i++)if(state.order[i]!==correct[i]){bad=i;break;}feedback.className='feedback '+(bad<0?'good':'bad');if(bad<0){feedback.textContent='顺序正确：每一步都拿到了下一步需要的结果。';chain.classList.add('show');}else{const msgs=['没有预测，就无法计算这次预测的损失','没有先与真实标签比较，就没有误差信号可反向传播','没有反向求出各参数的影响，就不知道该怎样更新参数','参数更新必须放在误差反传之后'];feedback.textContent=msgs[bad];chain.classList.remove('show');}}
    keyList.addEventListener('click',e=>{const p=e.target.closest('[data-pick]');if(p){state.selected=p.dataset.pick;render();return;}const m=e.target.closest('[data-move]');if(m)move(m.dataset.id,Number(m.dataset.move));});
    root.querySelector('[data-submit]').addEventListener('click',submit);
    root.querySelector('[data-reset]').addEventListener('click',()=>{state={order:[...initial],selected:'update',submitted:false};render();feedback.textContent='已恢复固定乱序：更新、预测、反向、比较。';});
    makeStage();
    root.destroyOrderWidget=()=>{offResize();stage.destroy();delete root.destroyOrderWidget;};
  })();
  </script>
</body>
</html>
