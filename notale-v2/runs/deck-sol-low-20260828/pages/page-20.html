<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>神经网络学会的参数</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root{--bg:#E8EEF1;--paper:#F8FAFA;--text:#17262D;--muted:#526770;--line:#A8B8BE;--model:#145C74;--target:#A53F2B;--attention:#D88416;--focus:#B36A08;--font-sans:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;--fs-h1:42px;--fs-h2:26px;--fs-lead:22px;--fs-body:19px;--fs-sec:17px;--fs-label:15px}
    body{background:var(--bg);color:var(--text);font-family:var(--font-sans)}
    #stage{display:flex;flex-direction:column;padding:28px 56px;gap:18px}
    h1,h2,p{margin:0} h1{font-size:var(--fs-h1);line-height:1.16;font-weight:800;letter-spacing:-.02em} h2{font-size:var(--fs-h2);line-height:1.25;font-weight:750} p{font-size:var(--fs-body);line-height:1.48} button{font:inherit}
    .title-stack{display:flex;flex-direction:column}.kicker{color:var(--model);font-size:var(--fs-label);line-height:1.3;font-weight:800;letter-spacing:.11em;margin-bottom:7px}.small{color:var(--muted);font-size:var(--fs-sec);line-height:1.42}
    .panel{background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:20px 22px;box-shadow:0 3px 0 rgba(46,72,82,.12)}.panel.q{background:transparent;box-shadow:none}
    .k-generalization{display:grid;grid-template-columns:minmax(280px,.8fr) 4px minmax(0,1.3fr);gap:24px;align-items:stretch}.k-generalization .claim{align-self:center;font-size:var(--fs-h2);line-height:1.35;font-weight:850}.k-generalization .trunk{background:var(--model)}.k-generalization .supports{display:flex;flex-direction:column;justify-content:center;gap:15px}.k-generalization .support{position:relative;border-bottom:2px solid var(--line);padding:10px 12px 12px 20px;font-size:var(--fs-sec);line-height:1.42}.k-generalization .support:before{content:"";position:absolute;left:-24px;top:50%;width:24px;border-top:2px solid var(--model)}
    .quiz{display:grid;gap:12px}.opt{width:100%;min-height:52px;padding:12px 16px;border:2px solid var(--line);border-radius:7px;background:var(--paper);color:var(--text);text-align:left;font-size:var(--fs-sec);line-height:1.4;font-weight:700;cursor:pointer}.opt[aria-checked="true"]{border-color:var(--attention);background:#FFF1D8}.opt.correct{border-style:double;border-width:4px}.opt.incorrect{text-decoration:line-through;text-decoration-thickness:2px}.opt:focus-visible{outline:4px solid var(--focus);outline-offset:3px}.fb{font-size:var(--fs-sec);line-height:1.42;font-weight:700}
    .min0{min-width:0;min-height:0}
    .title-stack{height:94px;justify-content:flex-start}
    .content{display:grid;grid-template-columns:minmax(0,1.58fr) minmax(380px,.72fr);gap:32px;flex:1;min-height:0}
    .lesson{display:grid;grid-template-rows:minmax(0,1fr) 108px 72px;gap:16px;min-height:0}
    .summary{padding:20px 22px 16px;min-height:0}
    .summary.k-generalization{grid-template-columns:minmax(245px,.72fr) 4px minmax(0,1.35fr);gap:22px}
    .summary .claim{font-size:var(--fs-h2);line-height:1.42;color:var(--model)}
    .summary .supports{gap:9px}
    .summary .support{font-size:var(--fs-sec);padding:9px 10px 10px 18px}
    .support strong{color:var(--text)}
    .loop{display:flex;align-items:center;justify-content:center;gap:10px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:14px 8px}
    .loop-step{font-size:var(--fs-body);font-weight:800;white-space:nowrap}
    .loop-step.forward{color:var(--model)}
    .loop-step.backward{color:var(--target)}
    .loop-step.update{color:#A96008}
    .arrow{position:relative;width:34px;height:2px;background:var(--line);flex:0 0 34px}
    .arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:9px solid var(--line);border-top:6px solid transparent;border-bottom:6px solid transparent}
    .takeaway{display:flex;align-items:center;gap:15px;padding:0 4px;font-size:var(--fs-lead);line-height:1.35;font-weight:750}
    .takeaway:before{content:"";width:18px;height:18px;border:4px solid var(--target);border-radius:50%;flex:0 0 auto}
    .quiz-panel{display:flex;flex-direction:column;min-height:0;padding:22px}
    .quiz-panel h2{margin-bottom:12px}
    .quiz-panel .small{margin-bottom:18px}
    .quiz{gap:11px}
    .fb{margin-top:18px;min-height:112px;padding:15px 4px;border-top:2px solid var(--line);color:var(--muted)}
    .fb.revealed{color:var(--text)}
    .answer{font-weight:800;color:var(--target)}
    .boundary{display:block;margin-top:10px;color:var(--muted);font-size:var(--fs-label);font-weight:650}
    .exit-label{margin-top:auto;padding-top:16px;color:var(--muted);font-size:var(--fs-label);border-top:1px solid var(--line)}
  </style>
</head>
<body data-page="20" data-total="20">
  <div id="stage">
    <header class="title-stack">
      <div class="kicker">全课收束</div>
      <h1>神经网络学会的，是一组让误差变小的参数</h1>
    </header>

    <main class="content min0">
      <section class="lesson min0" aria-label="全课概括">
        <div class="summary k-generalization panel q min0">
          <div class="claim">学习发生在参数上：每轮训练都把误差转成一次可执行的调整。</div>
          <div class="trunk" aria-hidden="true"></div>
          <div class="supports">
            <div class="support"><strong>神经元</strong>用权重和偏置产生一次猜测</div>
            <div class="support"><strong>损失</strong>把猜测与目标变成一个可比较的数</div>
            <div class="support"><strong>梯度</strong>指出每个参数该往哪边改</div>
            <div class="support"><strong>反向传播</strong>让多层网络也能高效得到这些梯度</div>
          </div>
        </div>

        <div class="loop" aria-label="训练闭环：前向，损失，反向，更新，再前向">
          <span class="loop-step forward">前向</span><span class="arrow"></span>
          <span class="loop-step backward">损失</span><span class="arrow"></span>
          <span class="loop-step backward">反向</span><span class="arrow"></span>
          <span class="loop-step update">更新</span><span class="arrow"></span>
          <span class="loop-step forward">再前向</span>
        </div>

        <p class="takeaway">反向传播不是答案本身；它是把误差变成参数调整方向的方法。</p>
      </section>

      <aside class="quiz-panel panel min0" aria-labelledby="exit-q">
        <div class="kicker">离场题</div>
        <h2 id="exit-q">若预测已经算出，但没有真实标签，这一步能训练吗？</h2>
        <p class="small">按本课的监督学习设定作答。</p>
        <div class="quiz" role="radiogroup" aria-labelledby="exit-q">
          <button class="opt" type="button" role="radio" aria-checked="false" data-choice="能">能</button>
          <button class="opt" type="button" role="radio" aria-checked="false" data-choice="不能">不能</button>
          <button class="opt" type="button" role="radio" aria-checked="false" data-choice="要看情况">要看情况</button>
        </div>
        <div class="fb" id="feedback" role="status" aria-live="polite">选择后查看判断依据。</div>
        <div class="exit-label">先确认能否计算损失，再判断能否更新参数。</div>
      </aside>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>
    Deck.init({index:20,total:20});
    const options=[...document.querySelectorAll('.opt')];
    const feedback=document.getElementById('feedback');
    options.forEach(btn=>btn.addEventListener('click',()=>{
      options.forEach(o=>{
        const selected=o===btn;
        o.setAttribute('aria-checked',String(selected));
        o.classList.toggle('selected',selected);
        o.classList.remove('correct','incorrect');
      });
      btn.classList.add(btn.dataset.choice==='不能'?'correct':'incorrect');
      feedback.classList.add('revealed');
      feedback.innerHTML='<span class="answer">在本课的监督学习设定中不能：</span>没有标签就无法计算这里使用的监督损失。<span class="boundary">其他学习方式存在，但不在本课范围。</span>';
    }));
  </script>
</body>
</html>
