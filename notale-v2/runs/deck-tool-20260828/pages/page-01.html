<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .page-head{flex:0 0 118px;display:flex;align-items:flex-end}
    .title-stack{min-width:0}
    .subtitle{margin-top:10px;color:var(--muted);font-size:var(--fs-lead);font-weight:650}
    .focus{margin-top:10px;justify-content:stretch}
    .process-field{position:relative;flex:1;min-height:0;display:flex;align-items:center}
    .process-svg{width:100%;height:100%;display:block}
    .step-label{font:700 26px/1 var(--font-sans);fill:var(--text);text-anchor:middle}
    .step-note{font:600 16px/1 var(--font-sans);fill:var(--muted);text-anchor:middle}
    .process-line{fill:none;stroke:var(--line);stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
    .node-ring{fill:var(--bg);stroke-width:7}
    .icon-line{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    .footer-claim{flex:0 0 86px;border-top:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:var(--fs-lead);font-weight:750;color:var(--text)}
    .footer-claim strong{color:var(--model)}
  </style>
</head>
<body data-page="01" data-total="20">
  <div id="stage">
    <header class="page-head">
      <div class="title-stack">
        <div class="kicker">学习 = 反复调小错误</div>
        <h1>神经网络是怎么学会的？</h1>
        <p class="subtitle">从一个神经元到反向传播</p>
      </div>
    </header>

    <main class="focus min0" aria-label="神经网络学习的四步循环">
      <div class="process-field min0">
        <svg class="process-svg" viewBox="0 0 1488 590" role="img" aria-labelledby="flowTitle flowDesc">
          <title id="flowTitle">猜一次、看差多少、调一点、再猜的循环</title>
          <desc id="flowDesc">神经网络先根据样本做预测，再比较误差，调节参数，然后重新预测。</desc>
          <defs>
            <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#A8B7BB"/>
            </marker>
            <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#D45528"/>
            </marker>
          </defs>

          <path class="process-line" d="M220 286 H1240" marker-end="url(#arrowGray)"/>

          <g transform="translate(220 286)">
            <circle r="82" class="node-ring" stroke="var(--model)"/>
            <g class="icon-line" stroke="var(--model)">
              <circle cx="8" cy="0" r="30"/>
              <path d="M-60 -38 L-22 -14 M-60 0 H-22 M-60 38 L-22 14 M38 0 H66"/>
              <circle cx="-60" cy="-38" r="5" fill="var(--data)" stroke="var(--data)"/>
              <circle cx="-60" cy="0" r="5" fill="var(--data)" stroke="var(--data)"/>
              <circle cx="-60" cy="38" r="5" fill="var(--data)" stroke="var(--data)"/>
            </g>
            <text class="step-label" y="130">猜一次</text>
            <text class="step-note" y="162">用当前参数做预测</text>
          </g>

          <g transform="translate(565 286)">
            <circle r="82" class="node-ring" stroke="var(--attention)"/>
            <g class="icon-line" stroke="var(--attention)">
              <circle r="48"/><circle r="29"/><circle r="10" fill="var(--data)" stroke="var(--data)"/>
              <path d="M-56 56 L-10 10" marker-end="url(#arrowOrange)"/>
            </g>
            <text class="step-label" y="130">看差多少</text>
            <text class="step-note" y="162">预测和目标的距离</text>
          </g>

          <g transform="translate(910 286)">
            <circle r="82" class="node-ring" stroke="var(--attention)"/>
            <g class="icon-line" stroke="var(--attention)">
              <circle r="45"/>
              <path d="M0 -45 V-64 M32 -32 L46 -46 M45 0 H64 M-32 -32 L-46 -46 M-45 0 H-64"/>
              <path d="M0 0 L29 -25"/>
              <circle r="8" fill="var(--attention)"/>
            </g>
            <text class="step-label" y="130">调一点</text>
            <text class="step-note" y="162">沿着误差变小的方向</text>
          </g>

          <g transform="translate(1255 286)">
            <circle r="82" class="node-ring" stroke="var(--model)"/>
            <g class="icon-line" stroke="var(--model)">
              <path d="M24 -44 A50 50 0 1 0 48 16"/>
              <path d="M24 -44 H55 V-13"/>
              <circle cx="0" cy="8" r="14" fill="var(--data)" stroke="var(--data)"/>
            </g>
            <text class="step-label" y="130">再猜</text>
            <text class="step-note" y="162">带着新参数重来</text>
          </g>

          <path d="M1255 186 C1255 75 220 75 220 186" fill="none" stroke="var(--attention)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowOrange)"/>
          <text x="738" y="72" text-anchor="middle" style="font:700 17px var(--font-sans);fill:var(--attention)">错误还没够小，就继续</text>
        </svg>
      </div>
    </main>

    <footer class="footer-claim">30 分钟后，你能亲手让一个小网络<strong>学会分类</strong></footer>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({index:1,total:20});</script>
</body>
</html>
