<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{ background:var(--bg); }
  .plotwrap{ display:flex; flex-direction:column; gap:10px; height:100%; }
  .plotwrap svg{ flex:1; min-height:0; width:100%; display:block; }
  .eqline{ font-family:var(--font-num); font-size:var(--fs-lead); font-weight:750; color:var(--text); text-align:center; }
  .eqline .b-val{ color:var(--attention); }
  .ctrlwrap{ display:flex; flex-direction:column; gap:22px; height:100%; }
  .genrow{ font-family:var(--font-num); font-size:var(--fs-body); color:var(--muted); }
  .bigrow{ display:flex; align-items:baseline; gap:10px; }
  .footer-note{ margin-top:16px; padding-top:14px; border-top:var(--rule) solid var(--line); text-align:center; }
</style>
</head>
<body data-page="06" data-total="20">
<div id="stage">
  <div class="kicker">分类边界 · 偏置的作用</div>
  <h1>偏置像一只整体平移旋钮</h1>

  <div class="split" style="flex:1;min-height:0;">
    <div class="panel min0 plotwrap">
      <svg id="plot" viewBox="0 0 460 480" role="img" aria-label="二维坐标中的分类直线与三个样本点">
        <!-- grid -->
        <g id="grid" stroke="var(--line)" stroke-width="1"></g>
        <!-- axes -->
        <line x1="40" y1="440" x2="420" y2="440" stroke="var(--text)" stroke-width="2"/>
        <line x1="40" y1="440" x2="40" y2="60" stroke="var(--text)" stroke-width="2"/>
        <text x="424" y="446" font-size="15" fill="var(--muted)">x₁</text>
        <text x="18" y="58" font-size="15" fill="var(--muted)">x₂</text>

        <!-- region labels, fixed corners: stable for all b in range -->
        <text x="70" y="110" font-size="15" fill="var(--muted)">输出偏 0</text>
        <text x="300" y="410" font-size="15" fill="var(--muted)">输出偏 1</text>

        <!-- boundary line -->
        <line id="boundary" x1="0" y1="0" x2="0" y2="0" stroke="var(--model)" stroke-width="4"/>

        <!-- data points -->
        <g id="points" fill="var(--data)">
          <circle cx="130" cy="215" r="8"></circle>
          <circle cx="220" cy="305" r="8"></circle>
          <circle cx="310" cy="215" r="8"></circle>
        </g>
      </svg>
      <div class="eqline" id="eqline">x₁ − x₂ + <span class="b-val">0.0</span> = 0</div>
    </div>

    <div class="panel min0 ctrlwrap">
      <div>
        <div class="genrow">通用式：w₁x₁ + w₂x₂ + b = 0</div>
        <div class="genrow" style="margin-top:4px;">固定权重：w₁ = 1，w₂ = −1</div>
      </div>

      <div class="ctl">
        <label for="bRange">偏置 b（−4 到 4，步长 0.1）</label>
        <div class="bigrow">
          <span class="big" id="bBig">0.0</span>
          <span class="unit">当前 b</span>
        </div>
        <input type="range" id="bRange" min="-4" max="4" step="0.1" value="0"
               aria-label="偏置 b 的滑杆，范围负四到四">
      </div>

      <div class="btns">
        <button class="btn" id="resetBtn" type="button">复位 b = 0</button>
      </div>

      <div class="legend">
        <div class="li"><span class="sw" style="color:var(--data)"></span>样本点（2,5）（4,3）（6,5）</div>
        <div class="li"><span class="sw line" style="color:var(--model)"></span>分类边界（斜率不变）</div>
      </div>

      <p class="small">拖动滑杆只改变边界与坐标原点的距离，直线始终保持同一斜率、只做平行移动。</p>
    </div>
  </div>

  <div class="footer-note">
    <p class="lead">权重转方向，偏置挪位置。</p>
  </div>
</div>
<script src="assets/base.js"></script>
<script>
(function(){
  // coordinate mapping: data range x1,x2 in [0,8]
  var MARGIN = 40, SCALE = 45, MAXU = 8;
  function svgX(x1){ return MARGIN + x1*SCALE; }
  function svgY(x2){ return (MARGIN+MAXU*SCALE) - x2*SCALE; }

  // grid lines
  var grid = document.getElementById('grid');
  var g = '';
  for(var i=0;i<=MAXU;i++){
    var gx = svgX(i);
    g += '<line x1="'+gx+'" y1="'+svgY(0)+'" x2="'+gx+'" y2="'+svgY(MAXU)+'"></line>';
    var gy = svgY(i);
    g += '<line x1="'+svgX(0)+'" y1="'+gy+'" x2="'+svgX(MAXU)+'" y2="'+gy+'"></line>';
  }
  grid.innerHTML = g;

  var boundary = document.getElementById('boundary');
  var range = document.getElementById('bRange');
  var bBig = document.getElementById('bBig');
  var eqSpan = document.querySelector('#eqline .b-val');
  var resetBtn = document.getElementById('resetBtn');

  function fmtEq(b){
    if(b >= 0) return '+ ' + b.toFixed(1);
    return '− ' + Math.abs(b).toFixed(1);
  }

  function update(b){
    // line: x2 = x1 + b, clip x1 in [max(0,-b), min(8,8-b)]
    var x1a = Math.max(0, -b);
    var x1b = Math.min(MAXU, MAXU - b);
    var x2a = x1a + b;
    var x2b = x1b + b;
    boundary.setAttribute('x1', svgX(x1a));
    boundary.setAttribute('y1', svgY(x2a));
    boundary.setAttribute('x2', svgX(x1b));
    boundary.setAttribute('y2', svgY(x2b));

    bBig.textContent = b.toFixed(1);
    eqSpan.textContent = fmtEq(b);
  }

  range.addEventListener('input', function(){
    update(parseFloat(range.value));
  });
  resetBtn.addEventListener('click', function(){
    range.value = 0;
    update(0);
  });

  update(0);

  if(window.Deck && Deck.init){
    Deck.init({
      index: parseInt(document.body.dataset.page,10) - 1,
      total: parseInt(document.body.dataset.total,10)
    });
  }
})();
</script>
</body>
</html>
