<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/lib/katex.min.css">
<style>
  .rowbtn{transition:background .15s}
  .rowbtn:hover{background:rgba(23,38,43,.05)}
  .rowbtn:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  .rowbtn.selected{background:rgba(23,92,120,.10)}
  .rowbtn .dim{font-weight:700;color:var(--model)}
  .scale-track{position:relative;height:44px;margin-top:10px}
  .scale-line{position:absolute;left:2px;right:2px;top:50%;border-top:var(--rule) solid var(--line)}
  .tick{position:absolute;top:62%;font-size:var(--fs-tick);color:var(--muted);font-family:var(--font-num)}
  .marker{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--paper)}
</style>
</head>
<body data-page="09" data-total="20">
<div id="stage">

  <div class="kicker">从单个样本到一批样本</div>
  <h1>训练目标：让一批样本的平均损失下降</h1>
  <p class="lead" style="margin-top:10px;max-width:1150px;">训练不是保证每题都对，而是寻找让平均损失更小的参数。</p>

  <div class="lab">
    <div class="min0" style="display:flex;flex-direction:column;gap:20px;">

      <div class="panel k-comparison" style="display:flex;flex-direction:column;flex:1;">
        <div style="display:flex;width:100%;">
          <span class="dim" style="flex:0 0 90px;color:var(--muted)">样本</span>
          <span class="hdr" style="flex:1">目标 t</span>
          <span class="hdr" style="flex:1">预测 p</span>
          <span class="hdr" style="flex:1">损失 L</span>
        </div>

        <button class="rowbtn" data-row="A" aria-pressed="false" style="display:flex;width:100%;background:none;border:none;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit;">
          <span class="dim" style="flex:0 0 90px">A</span>
          <span class="rowline" style="flex:1">t = 1</span>
          <span class="rowline" style="flex:1">p = 0.8</span>
          <span class="rowline" style="flex:1">L = 0.223</span>
        </button>

        <button class="rowbtn" data-row="B" aria-pressed="false" style="display:flex;width:100%;background:none;border:none;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit;">
          <span class="dim" style="flex:0 0 90px">B</span>
          <span class="rowline" style="flex:1">t = 1</span>
          <span class="rowline" style="flex:1">p = 0.6</span>
          <span class="rowline" style="flex:1">L = 0.511</span>
        </button>

        <button class="rowbtn" data-row="C" aria-pressed="false" style="display:flex;width:100%;background:none;border:none;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit;">
          <span class="dim" style="flex:0 0 90px">C</span>
          <span class="rowline" style="flex:1">t = 0</span>
          <span class="rowline" style="flex:1">p = 0.3</span>
          <span class="rowline" style="flex:1">L = 0.357</span>
        </button>

        <button class="rowbtn" data-row="D" aria-pressed="false" style="display:flex;width:100%;background:none;border:none;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit;">
          <span class="dim" style="flex:0 0 90px">D</span>
          <span class="rowline" style="flex:1">t = 0</span>
          <span class="rowline" style="flex:1">p = 0.7</span>
          <span class="diff" style="flex:1;display:flex;align-items:center;"><span style="display:inline-flex;align-items:center;justify-content:center;border:3px solid var(--attention);border-radius:999px;padding:2px 12px;">L = 1.204</span></span>
        </button>
      </div>

      <div class="panel" style="display:flex;align-items:center;gap:28px;">
        <div style="flex:1;min-width:0;">
          <h2>四例的平均损失</h2>
          <div id="avgFormula" style="margin-top:8px;font-size:var(--fs-body)"></div>
        </div>
        <div style="text-align:center;min-width:140px;">
          <div class="note">平均损失 L̄</div>
          <div class="big">0.574</div>
        </div>
      </div>

    </div>

    <div class="panel" style="display:flex;flex-direction:column;">
      <h2>概率尺：当前样本</h2>
      <p class="small" style="margin-top:6px;">点击左侧任意一行，在这条尺子上看该样本的目标与预测各落在哪里。</p>

      <div class="scale-track">
        <div class="scale-line"></div>
        <span class="tick" style="left:0">0</span>
        <span class="tick" style="left:50%;transform:translateX(-50%)">0.5</span>
        <span class="tick" style="right:0">1</span>
        <div id="markTarget" class="marker" style="background:var(--data);left:0%"></div>
        <div id="markPred" class="marker" style="background:var(--model);left:0%"></div>
      </div>

      <div class="legend" style="margin-top:20px;">
        <span class="li"><span class="sw" style="background:var(--data)"></span>目标 t</span>
        <span class="li"><span class="sw" style="background:var(--model)"></span>预测 p</span>
      </div>

      <p class="small" id="rowExplain" style="margin-top:18px;flex:1;">样本 A：目标 t=1，预测 p=0.8，接近目标，损失较低（L=0.223）。</p>
    </div>
  </div>

</div>
<script src="assets/base.js"></script>
<script src="assets/lib/katex.min.js"></script>
<script>
  Deck.init({ index: 9, total: 20 });

  var samples = {
    A: { t:1, p:0.8, L:0.223, text:"样本 A：目标 t=1，预测 p=0.8，接近目标，损失较低（L=0.223）。" },
    B: { t:1, p:0.6, L:0.511, text:"样本 B：目标 t=1，预测 p=0.6，比 A 偏离目标更多，损失上升到 L=0.511。" },
    C: { t:0, p:0.3, L:0.357, text:"样本 C：目标 t=0，预测 p=0.3，已经偏向错误方向，损失 L=0.357。" },
    D: { t:0, p:0.7, L:1.204, text:"样本 D：目标 t=0，预测 p=0.7，明显偏向错误方向，损失是四例中最高的，L=1.204。" }
  };

  var rowBtns = Array.prototype.slice.call(document.querySelectorAll('.rowbtn'));
  var markTarget = document.getElementById('markTarget');
  var markPred = document.getElementById('markPred');
  var explain = document.getElementById('rowExplain');

  function selectRow(id){
    var s = samples[id];
    rowBtns.forEach(function(b){
      var on = b.dataset.row === id;
      b.classList.toggle('selected', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    markTarget.style.left = (s.t * 100) + '%';
    markPred.style.left = (s.p * 100) + '%';
    explain.textContent = s.text;
  }

  rowBtns.forEach(function(b){
    b.addEventListener('click', function(){ selectRow(b.dataset.row); });
  });

  selectRow('A');

  katex.render(
    "\\bar L=\\dfrac{0.223+0.511+0.357+1.204}{4}\\approx 0.574",
    document.getElementById('avgFormula'),
    { throwOnError:false }
  );
</script>
</body>
</html>
