<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{overflow:hidden}
    .page-head{flex:0 0 auto}
    .page-head .lead{margin-top:8px;color:var(--muted);font-weight:500}
    #train-order{flex:1;min-height:0;margin-top:18px;display:grid;grid-template-columns:minmax(0,1.42fr) minmax(390px,.78fr);gap:34px}
    #train-order .sort-zone{min-height:0;display:flex;flex-direction:column;gap:12px}
    #train-order .instruction{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:32px;color:var(--muted);font-size:var(--fs-sec)}
    #train-order .pick-count{font:700 var(--fs-label)/1.3 var(--font-sans);color:var(--attention)}
    #train-order .steps{display:grid;grid-template-rows:repeat(4,1fr);gap:12px;flex:1;min-height:0;counter-reset:order}
    #train-order .step-btn{counter-increment:order;appearance:none;width:100%;min-height:0;display:grid;grid-template-columns:74px minmax(0,1fr) 150px;align-items:center;text-align:left;padding:13px 20px;background:var(--paper);color:var(--text);border:var(--rule) solid var(--line);border-radius:var(--r);font:700 var(--fs-h2)/1.25 var(--font-sans);cursor:pointer;transition:border-color .14s ease,box-shadow .14s ease}
    #train-order .step-btn::before{content:counter(order);font:750 34px/1 var(--font-num);color:var(--line)}
    #train-order .step-btn::after{content:"点击选择";justify-self:end;font:650 var(--fs-label)/1.2 var(--font-sans);color:var(--muted)}
    #train-order .step-btn:hover{border-color:var(--model)}
    #train-order .step-btn.selected{border-color:var(--attention);box-shadow:inset 0 0 0 2px var(--attention)}
    #train-order .step-btn.selected::after{content:"已选，等待交换";color:var(--attention)}
    #train-order .step-btn.checked.correct{border-style:double;border-width:5px}
    #train-order .step-btn.checked.wrong{border-style:dashed;border-width:3px}
    #train-order .step-btn:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
    #train-order .actions{display:flex;align-items:center;gap:12px;min-height:48px}
    #train-order .actions .hint{margin-left:auto;max-width:350px;text-align:right}
    #train-order .explain{min-height:0;display:flex;flex-direction:column;padding:20px 22px}
    #train-order .explain h2{margin-bottom:12px}
    #train-order .feedback{font-size:var(--fs-sec);color:var(--muted);min-height:48px;padding-bottom:14px;border-bottom:var(--rule) solid var(--line)}
    #train-order .io-list{display:grid;grid-template-rows:repeat(4,1fr);gap:0;flex:1;min-height:0;margin-top:8px}
    #train-order .io{display:grid;grid-template-columns:28px 1fr;gap:10px;align-content:center;border-bottom:1px solid var(--line);font-size:var(--fs-sec);line-height:1.4}
    #train-order .io:last-child{border-bottom:0}
    #train-order .io .n{font:750 var(--fs-body)/1 var(--font-num);color:var(--model)}
    #train-order .io b{color:var(--text)}
    #train-order .io span{color:var(--muted)}
    #train-order .loop{display:none;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:var(--rule) solid var(--model);color:var(--model);font-weight:750}
    #train-order .loop svg{width:58px;height:34px;overflow:visible;flex:0 0 auto}
    #train-order.complete .loop{display:flex}
    #train-order.complete .feedback{color:var(--text);font-weight:650}
  </style>
</head>
<body data-page="17" data-total="20">
  <div id="stage">
    <header class="page-head">
      <div class="kicker">训练循环 · 排序练习</div>
      <h1>把整轮学习拼起来</h1>
      <p class="lead">每一步的输出，都是下一步需要的输入。</p>
    </header>
    <main id="train-order" class="k-classification min0" aria-label="训练循环排序组件">
      <section class="sort-zone min0">
        <div class="instruction"><span>依次点击两张步骤条交换位置；排好后再检查。</span><span class="pick-count" data-pick>尚未选择</span></div>
        <div class="steps" data-steps></div>
        <div class="actions">
          <button class="btn" type="button" data-check>检查顺序</button>
          <button class="btn" type="button" data-reset>恢复打乱顺序</button>
          <span class="hint">检查后：虚线表示位置需调整，双线表示位置正确。</span>
        </div>
      </section>
      <aside class="panel explain min0" aria-live="polite">
        <h2>这一轮传递了什么</h2>
        <p class="feedback" data-feedback>反馈会在点击“检查顺序”后出现。</p>
        <div class="io-list" data-io></div>
        <div class="loop" data-loop>
          <svg viewBox="0 0 64 36" aria-hidden="true"><path d="M55 27C48 7 17 5 8 20" fill="none" stroke="currentColor" stroke-width="3"/><path d="M7 12L7 22L17 21" fill="none" stroke="currentColor" stroke-width="3"/></svg>
          <span>重复许多轮：更新后的参数回到下一轮前向计算。</span>
        </div>
      </aside>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>
  (() => {
    Deck.init({index:17,total:20});
    const root=document.querySelector('#train-order');
    const initial=['update','loss','forward','backward'];
    const correct=['forward','loss','backward','update'];
    const info={
      forward:{title:'输入样本并前向',io:'输入：样本与当前参数　输出：模型预测'},
      loss:{title:'计算损失',io:'输入：模型预测与目标答案　输出：误差大小'},
      backward:{title:'反向计算梯度',io:'输入：损失与中间计算　输出：各参数该往哪边调'},
      update:{title:'更新参数',io:'输入：梯度与学习率　输出：一组更新后的参数'}
    };
    const makeInitial=()=>({order:[...initial],selected:null,checked:false});
    let state=makeInitial();
    const steps=root.querySelector('[data-steps]');
    const feedback=root.querySelector('[data-feedback]');
    const io=root.querySelector('[data-io]');
    const pick=root.querySelector('[data-pick]');
    const isCorrect=()=>state.order.every((id,i)=>id===correct[i]);
    function select(i){
      if(state.selected===null) state={...state,selected:i,checked:false};
      else if(state.selected===i) state={...state,selected:null,checked:false};
      else {const order=[...state.order];[order[state.selected],order[i]]=[order[i],order[state.selected]];state={order,selected:null,checked:false};}
      render();
    }
    function render(){
      steps.replaceChildren(...state.order.map((id,i)=>{
        const b=document.createElement('button');
        b.type='button';b.className='step-btn';b.dataset.id=id;b.textContent=info[id].title;
        b.setAttribute('aria-pressed',String(state.selected===i));
        b.setAttribute('aria-label',`位置 ${i+1}，${info[id].title}。点击选择并与下一项交换`);
        if(state.selected===i)b.classList.add('selected');
        if(state.checked)b.classList.add('checked',id===correct[i]?'correct':'wrong');
        b.addEventListener('click',()=>select(i));
        return b;
      }));
      const done=state.checked&&isCorrect();
      root.classList.toggle('complete',done);
      pick.textContent=state.selected===null?'尚未选择':`已选：${info[state.order[state.selected]].title}`;
      if(!state.checked){feedback.textContent='反馈会在点击“检查顺序”后出现。';io.replaceChildren();}
      else{
        feedback.textContent=done?'顺序正确。四步首尾相接，更新后的参数会进入下一轮。':'顺序还没接通。找到虚线步骤：它的输入必须由前一步输出提供。';
        io.innerHTML=correct.map((id,i)=>`<div class="io"><span class="n">${i+1}</span><div><b>${info[id].title}</b><br><span>${info[id].io}</span></div></div>`).join('');
      }
    }
    root.querySelector('[data-check]').addEventListener('click',()=>{state={...state,selected:null,checked:true};render();});
    root.querySelector('[data-reset]').addEventListener('click',()=>{state=makeInitial();render();});
    render();
  })();
  </script>
</body>
</html>
