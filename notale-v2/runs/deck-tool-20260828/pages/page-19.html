<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #generalize{flex:1;min-height:0;margin-top:18px;display:flex;flex-direction:column;gap:14px}
    #generalize .topline{display:flex;align-items:center;justify-content:space-between;gap:24px}
    #generalize .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    #generalize .progress{display:flex;align-items:baseline;gap:10px;color:var(--muted);font-size:var(--fs-label)}
    #generalize .comparison{flex:1;min-height:0;display:grid;grid-template-columns:150px 1fr 1fr;grid-template-rows:auto minmax(0,1fr) auto;border-top:var(--rule) solid var(--line)}
    #generalize .comparison>*{min-width:0}
    #generalize .dim,#generalize .hdr{padding:11px 16px;border-bottom:var(--rule) solid var(--line)}
    #generalize .hdr{font-weight:750;color:var(--model);font-size:var(--fs-sec)}
    #generalize .dim{font-size:var(--fs-label);font-weight:700;color:var(--muted)}
    #generalize .plotcell{padding:12px 16px;border-bottom:var(--rule) solid var(--line);position:relative;min-height:0}
    #generalize .plotcell+.plotcell,#generalize .hdr+.hdr{border-left:var(--rule) solid var(--line)}
    #generalize .cvbox{height:100%;background:var(--paper)}
    #generalize canvas{display:block}
    #generalize .plotnote{position:absolute;left:28px;bottom:22px;font-size:var(--fs-label);color:var(--muted);background:rgba(248,250,250,.86);padding:3px 7px;border-radius:3px}
    #generalize .read{padding:12px 16px;display:flex;align-items:baseline;gap:10px}
    #generalize .read+.read{border-left:var(--rule) solid var(--line)}
    #generalize .read .big{font-size:42px}
    #generalize .conclusion{display:flex;align-items:center;justify-content:space-between;gap:30px;padding:13px 18px;border:var(--rule) solid var(--line);border-radius:var(--r);background:var(--paper)}
    #generalize .conclusion strong{font-size:var(--fs-lead);line-height:1.35;color:var(--text)}
    #generalize .status{font-size:var(--fs-label);color:var(--attention);font-weight:700;min-width:230px;text-align:right}
  </style>
</head>
<body data-page="19" data-total="20">
  <div id="stage">
    <header>
      <div class="kicker">训练结果的边界</div>
      <h1>网络“学会了”到底能说明什么？</h1>
    </header>
    <main id="generalize" aria-label="训练集与验证集同步比较">
      <div class="topline">
        <p class="lead">同一条决策边界，同时检查看过的数据和没看过的数据。</p>
        <div class="controls" aria-label="验证数据分布">
          <button class="btn selected" id="normal" aria-pressed="true">正常数据</button>
          <button class="btn" id="shift" aria-pressed="false">验证集整体右移 0.6</button>
          <button class="btn" id="reset">重新训练</button>
          <span class="progress">训练步数 <span class="num" id="steps">0</span></span>
        </div>
      </div>

      <section class="k-comparison comparison" aria-label="同尺度数据比较">
        <div class="dim">数据身份</div>
        <div class="hdr">训练集：网络反复看过</div>
        <div class="hdr">验证集：训练时没看过</div>

        <div class="dim">相同坐标与边界</div>
        <div class="plotcell min0"><div class="cvbox"><canvas id="trainPlot" class="cv-fill" aria-label="训练集散点和当前决策边界"></canvas></div><span class="plotnote">100 个训练点</span></div>
        <div class="plotcell min0"><div class="cvbox"><canvas id="valPlot" class="cv-fill" aria-label="验证集散点和同一条决策边界"></canvas></div><span class="plotnote" id="valNote">100 个新数据点</span></div>

        <div class="dim">实时准确率</div>
        <div class="read"><span class="big" id="trainAcc">—</span><span class="unit">train acc</span></div>
        <div class="read"><span class="big" id="valAcc">—</span><span class="unit">val acc</span></div>
      </section>

      <div class="conclusion">
        <strong>损失下降说明适应了训练数据；对新数据仍好，才叫泛化。</strong>
        <span class="status" id="status" role="status" aria-live="polite">网络正在从同一种子开始训练</span>
      </div>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/lib/mlp.js"></script>
  <script>
  (()=>{
    const root=document.getElementById('generalize');
    const q=s=>root.querySelector(s);
    const els={normal:q('#normal'),shift:q('#shift'),reset:q('#reset'),steps:q('#steps'),ta:q('#trainAcc'),va:q('#valAcc'),status:q('#status'),note:q('#valNote')};
    const rng=new Math.seedrandom('page-19-generalize');
    function makeSet(){
      const a=[];
      for(let i=0;i<100;i++){
        const x=-1+2*rng(), y=-1+2*rng();
        a.push({x:[x,y],t:(x>0)!==(y>0)?1:0});
      }
      return a;
    }
    const train=makeSet(), valBase=makeSet();
    let state={shifted:false,steps:0,running:true,destroyed:false};
    let net;
    function validation(){return valBase.map(p=>({x:[p.x[0]+(state.shifted?.6:0),p.x[1]],t:p.t}));}
    function fresh(){net=MLP.create({sizes:[2,10,10,1],act:'tanh',lr:.3,seed:'page-19-generalize'});state.steps=0;state.running=true;render();}
    function pct(v){return (v*100).toFixed(1)+'%';}
    function draw(canvas,set){
      const ctx=Deck.fit(canvas),w=canvas.offsetWidth,h=canvas.offsetHeight,pad=22;
      ctx.clearRect(0,0,w,h);ctx.fillStyle=Deck.token('--paper');ctx.fillRect(0,0,w,h);
      const xmin=-1.35,xmax=1.95,ymin=-1.25,ymax=1.25;
      const field=net.field(xmin,ymin,xmax,ymax,56,42),cw=(w-2*pad)/56,ch=(h-2*pad)/42;
      for(let j=0;j<42;j++)for(let i=0;i<56;i++){
        const v=field[j*56+i];ctx.fillStyle=v>.5?`rgba(23,92,120,${.05+Math.abs(v-.5)*.26})`:`rgba(90,112,69,${.05+Math.abs(v-.5)*.26})`;
        ctx.fillRect(pad+i*cw,pad+(41-j)*ch,cw+1,ch+1);
      }
      const X=x=>pad+(x-xmin)/(xmax-xmin)*(w-2*pad),Y=y=>h-pad-(y-ymin)/(ymax-ymin)*(h-2*pad);
      ctx.strokeStyle=Deck.token('--line');ctx.lineWidth=1.5;ctx.strokeRect(pad,pad,w-2*pad,h-2*pad);
      ctx.beginPath();ctx.moveTo(X(0),pad);ctx.lineTo(X(0),h-pad);ctx.moveTo(pad,Y(0));ctx.lineTo(w-pad,Y(0));ctx.stroke();
      for(const p of set){ctx.beginPath();ctx.arc(X(p.x[0]),Y(p.x[1]),4.2,0,Math.PI*2);ctx.fillStyle=p.t?Deck.token('--model'):Deck.token('--data');ctx.fill();ctx.strokeStyle=Deck.token('--paper');ctx.lineWidth=1.3;ctx.stroke();}
    }
    function render(){
      const ve=validation(),te=net.evaluate(train),vv=net.evaluate(ve);
      els.steps.textContent=state.steps;els.ta.textContent=pct(te.acc);els.va.textContent=pct(vv.acc);
      els.note.textContent=state.shifted?'100 个右移后的新数据点':'100 个新数据点';
      els.normal.classList.toggle('selected',!state.shifted);els.shift.classList.toggle('selected',state.shifted);
      els.normal.setAttribute('aria-pressed',String(!state.shifted));els.shift.setAttribute('aria-pressed',String(state.shifted));
      draw(q('#trainPlot'),train);draw(q('#valPlot'),ve);
      if(state.steps===0) els.status.textContent='网络正在从同一种子开始训练';
      else if(state.shifted) els.status.textContent='输入分布变了；决策边界没有重新训练';
      else els.status.textContent='两列使用同一模型、同一坐标尺度';
    }
    let frame=0;
    function tick(){
      if(state.destroyed)return;
      if(state.running){for(let i=0;i<8;i++)net.step(train,16);state.steps+=8;if(state.steps>=1600)state.running=false;if(state.steps%32===0)render();}
      frame=requestAnimationFrame(tick);
    }
    function setShift(v){state.shifted=v;render();els.status.textContent=v?'验证输入整体右移 0.6；模型参数保持不变':'验证输入恢复正常分布';}
    els.normal.addEventListener('click',()=>setShift(false));els.shift.addEventListener('click',()=>setShift(true));els.reset.addEventListener('click',fresh);
    Deck.onResize(()=>render());fresh();frame=requestAnimationFrame(tick);
    window.addEventListener('pagehide',()=>{state.destroyed=true;cancelAnimationFrame(frame);},{once:true});
    Deck.init({index:19,total:20});
  })();
  </script>
</body>
</html>
