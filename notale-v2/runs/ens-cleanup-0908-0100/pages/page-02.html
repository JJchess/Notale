<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      position: relative;
    }

    .cover-header {
      position: absolute;
      left: var(--pad-x);
      top: 120px;
      z-index: 10;
      max-width: 620px;
    }

    .chapter-tag {
      display: inline-block;
      font-size: var(--fs-sec);
      font-weight: 500;
      letter-spacing: 0.14em;
      color: var(--text);
      opacity: 0.75;
      margin-bottom: 24px;
    }

    .cover-title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      font-weight: 700;
      color: var(--text);
      margin: 0 0 24px 0;
      letter-spacing: -0.01em;
    }

    .cover-sub {
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
      max-width: 540px;
    }

    .blueprint-field {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .math-anchor {
      position: absolute;
      left: var(--pad-x);
      bottom: var(--pad-y);
      z-index: 10;
      font-family: var(--font-sans);
      font-size: var(--fs-sec);
      color: var(--muted);
      display: flex;
      gap: 36px;
      align-items: baseline;
    }

    .math-anchor strong {
      color: var(--text);
      font-weight: 600;
    }

    .math-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .math-tag::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--model);
    }
  </style>
</head>
<body data-page="02" data-total="25">
  <div id="stage">
    <header class="cover-header">
      <span class="chapter-tag">第 02 章 · 理论基石</span>
      <h1 class="cover-title">集成学习核心直觉<br>与理论基石</h1>
      <p class="cover-sub">从群体独立表决到强分类器跃迁：为什么弱假设的协同能够收敛并压缩泛化误差？</p>
    </header>

    <svg class="blueprint-field" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
          <circle cx="80" cy="80" r="1.2" fill="#71828B" opacity="0.35"/>
        </pattern>
      </defs>
      
      <!-- 背景参考点阵 -->
      <rect x="680" y="70" width="860" height="760" fill="url(#grid)" />

      <!-- 弱假设轨迹流：蓝色线条（符合 theme_css 中多路径收束至粗线的视觉签名） -->
      <g stroke="var(--model)" fill="none" opacity="0.5" stroke-width="var(--stroke)" stroke-linecap="round">
        <path d="M 720 170 C 860 190, 970 290, 1120 450" />
        <path d="M 720 260 C 850 280, 980 350, 1120 450" />
        <path d="M 720 355 C 870 380, 1000 420, 1120 450" />
        <path d="M 720 450 L 1120 450" />
        <path d="M 720 545 C 870 520, 1000 480, 1120 450" />
        <path d="M 720 640 C 850 620, 980 550, 1120 450" />
        <path d="M 720 730 C 860 710, 970 610, 1120 450" />
      </g>

      <!-- 弱分类器基节点 -->
      <g fill="var(--model)">
        <circle cx="720" cy="170" r="5" />
        <circle cx="720" cy="260" r="5" />
        <circle cx="720" cy="355" r="5" />
        <circle cx="720" cy="450" r="5" />
        <circle cx="720" cy="545" r="5" />
        <circle cx="720" cy="640" r="5" />
        <circle cx="720" cy="730" r="5" />
      </g>

      <!-- 弱假设符号标注 -->
      <g font-family="var(--font-sans)" font-size="var(--fs-tick)" fill="var(--muted)">
        <text x="702" y="174" text-anchor="end">h₁(x)</text>
        <text x="702" y="264" text-anchor="end">h₂(x)</text>
        <text x="702" y="359" text-anchor="end">h₃(x)</text>
        <text x="702" y="454" text-anchor="end">h₄(x)</text>
        <text x="702" y="549" text-anchor="end">h₅(x)</text>
        <text x="702" y="644" text-anchor="end">h₆(x)</text>
        <text x="702" y="734" text-anchor="end">h₇(x)</text>
      </g>

      <!-- 结合面参考轴 -->
      <line x1="1120" y1="360" x2="1120" y2="540" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="3 3" />
      <text x="1120" y="338" font-family="var(--font-sans)" font-size="var(--fs-tick)" fill="var(--muted)" text-anchor="middle">表决与加权汇聚</text>

      <!-- 强分类器汇聚输出干线（规范签名：多条等重线收束为 4px 粗线） -->
      <path d="M 1120 450 L 1440 450" stroke="var(--model)" stroke-width="var(--stroke-strong)" fill="none" stroke-linecap="round" />

      <!-- 汇聚点：橙色聚焦标记（单页面积严格控制在 5% 以内） -->
      <circle cx="1120" cy="450" r="6" fill="var(--focus)" />
      <circle cx="1120" cy="450" r="14" fill="none" stroke="var(--focus)" stroke-width="1.5" opacity="0.6" />

      <!-- 强模型输出端 -->
      <circle cx="1440" cy="450" r="5" fill="var(--model)" />
      <text x="1456" y="445" font-family="var(--font-display)" font-size="var(--fs-label)" font-weight="700" fill="var(--model)">H(x) 强学习器</text>
      <text x="1456" y="468" font-family="var(--font-sans)" font-size="var(--fs-tick)" fill="var(--muted)">方差与偏差共同压缩</text>

      <!-- 理论渐近上界与下界参考虚线 -->
      <path d="M 1120 410 Q 1260 445 1440 448" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="2 4" />
      <path d="M 1120 490 Q 1260 455 1440 452" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="2 4" />
    </svg>

    <footer class="math-anchor">
      <div class="math-tag">基学习器多样性 <strong>p &gt; 0.5</strong></div>
      <div class="math-tag">大数定律 <strong>P(多数表决错误) → 0</strong></div>
      <div class="math-tag">误差分解 <strong>Bias² + Variance + Noise</strong></div>
    </footer>
  </div>

  <aside class="notes" hidden>
    这一讲我们进入第二章：集成学习的核心直觉与理论基石。
    为什么将多个表现平平的弱学习器组合起来，能够创造出远超单模型的强大预测能力？
    我们将从高尔顿猜牛重的群体直觉出发，严格剖析孔多塞陪审团定理的数学条件，
    并借助偏差-方差分解揭开集成学习降低泛化误差的两条根本路径。
  </aside>
  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 2, total: 25, keys: false });
  </script>
</body>
</html>
