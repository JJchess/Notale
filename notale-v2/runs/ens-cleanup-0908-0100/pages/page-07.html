<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      display: grid;
      grid-template-columns: 560px 1fr;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      gap: 40px;
      position: relative;
    }

    .cover-left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
      padding-top: 56px;
      padding-bottom: 32px;
    }

    .chapter-tag {
      font-size: var(--fs-sec);
      color: var(--text);
      font-weight: 500;
      letter-spacing: 0.04em;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chapter-tag::before {
      content: "";
      width: 24px;
      height: 2px;
      background: var(--rule);
    }

    h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      margin: 0 0 20px 0;
      color: var(--text);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
      max-width: 480px;
    }

    .core-thesis {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .thesis-metric {
      font-size: var(--fs-body);
      color: var(--text);
      font-family: var(--font-display);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .thesis-metric span.badge {
      background: var(--model);
      color: #fff;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: var(--fs-label);
      font-weight: 600;
    }

    .cover-graphic {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .svg-scene {
      width: 100%;
      height: 100%;
      max-height: 840px;
    }

    /* SVG 树与汇聚动画与样式 */
    .tree-branch {
      stroke: var(--model);
      stroke-width: var(--stroke);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.85;
      transition: opacity var(--motion-fast);
    }

    .tree-node {
      fill: var(--bg);
      stroke: var(--model);
      stroke-width: var(--stroke);
    }

    .sample-dot {
      fill: var(--model);
    }

    .ensemble-path {
      stroke: var(--model);
      stroke-width: var(--stroke);
      fill: none;
      opacity: 0.4;
      stroke-dasharray: 4 4;
    }

    .focus-marker {
      stroke: var(--focus);
      fill: var(--focus);
    }

    .converge-line {
      stroke: var(--model);
      stroke-width: var(--stroke-strong);
      fill: none;
      stroke-linecap: round;
    }

    .scene-label {
      font-family: var(--font-sans);
      font-size: var(--fs-sec);
      fill: var(--muted);
    }

    .scene-label.accent {
      fill: var(--model);
      font-weight: 600;
      font-size: var(--fs-label);
    }

    .scene-label.focus {
      fill: var(--focus);
      font-weight: 600;
      font-size: var(--fs-label);
    }
  </style>
</head>
<body data-page="07" data-total="25">
  <div id="stage">
    <div class="cover-left">
      <div>
        <div class="chapter-tag">第 02 部分 · 并行集成范式</div>
        <h1>Bagging 与<br>随机森林</h1>
        <p class="subtitle">通过样本有放回抽样与特征子空间解耦，将高方差决策树平滑为低方差强模型。</p>
      </div>

      <div class="core-thesis">
        <div class="thesis-metric">
          <span class="badge">机制核心</span>
          <span>独立重采样 · 属性随机裂分 · 投票降方差</span>
        </div>
      </div>
    </div>

    <div class="cover-graphic">
      <svg class="svg-scene" viewBox="0 0 880 780" preserveAspectRatio="xMidYMid meet">
        <defs>
          <!-- 箭头定义 -->
          <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--model)" />
          </marker>
          <marker id="arrow-focus" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--focus)" />
          </marker>
          <marker id="arrow-strong" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--model)" />
          </marker>
        </defs>

        <!-- 背景刻度与坐标参考轻微辅助 -->
        <line x1="80" y1="120" x2="800" y2="120" stroke="var(--rule)" stroke-width="1" stroke-dasharray="2 4" opacity="0.3" />
        <line x1="80" y1="640" x2="800" y2="640" stroke="var(--rule)" stroke-width="1" stroke-dasharray="2 4" opacity="0.3" />

        <!-- 阶段阶段标签 -->
        <text x="130" y="80" class="scene-label accent" text-anchor="middle">Bootstrap 样本集</text>
        <text x="440" y="80" class="scene-label accent" text-anchor="middle">去相关随机决策树</text>
        <text x="750" y="80" class="scene-label accent" text-anchor="middle">投票汇聚预测</text>

        <!-- 3组数据抽样 -> 3棵决策树 -> 汇聚到单一结果 -->
        
        <!-- ================= 第 1 棵树路线 (上) ================= -->
        <!-- 抽样包 1 -->
        <g transform="translate(130, 200)">
          <rect x="-45" y="-45" width="90" height="90" rx="8" fill="none" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="3 3"/>
          <circle cx="-20" cy="-20" r="5" class="sample-dot" />
          <circle cx="0" cy="-10" r="5" class="sample-dot" />
          <circle cx="20" cy="-20" r="5" class="sample-dot" />
          <circle cx="-15" cy="15" r="5" class="sample-dot" />
          <circle cx="15" cy="15" r="5" class="sample-dot" />
          <text x="0" y="62" class="scene-label" text-anchor="middle">子集 D₁ (约 63.2%)</text>
        </g>
        <!-- 连线到树 1 -->
        <line x1="185" y1="200" x2="350" y2="200" stroke="var(--model)" stroke-width="2" marker-end="url(#arrow)" />

        <!-- 树 1 结构 (x=440, y=200) -->
        <g transform="translate(440, 200)">
          <!-- 枝干 -->
          <line x1="0" y1="-32" x2="-40" y2="0" class="tree-branch" />
          <line x1="0" y1="-32" x2="40" y2="0" class="tree-branch" />
          <line x1="-40" y1="0" x2="-60" y2="32" class="tree-branch" />
          <line x1="-40" y1="0" x2="-20" y2="32" class="tree-branch" />
          <line x1="40" y1="0" x2="20" y2="32" class="tree-branch" />
          <line x1="40" y1="0" x2="60" y2="32" class="tree-branch" />
          <!-- 节点 -->
          <circle cx="0" cy="-32" r="7" class="tree-node" />
          <circle cx="-40" cy="0" r="6" class="tree-node" />
          <circle cx="40" cy="0" r="6" class="tree-node" />
          <circle cx="-60" cy="32" r="5" fill="var(--model)" stroke="none" />
          <circle cx="-20" cy="32" r="5" fill="var(--model)" stroke="none" />
          <circle cx="20" cy="32" r="5" fill="var(--model)" stroke="none" />
          <circle cx="60" cy="32" r="5" fill="var(--model)" stroke="none" />
          <text x="0" y="58" class="scene-label" text-anchor="middle">基学习器 T₁</text>
        </g>
        
        <!-- 树 1 输出汇入通道 -->
        <path d="M 515 200 C 620 200, 640 380, 715 380" class="ensemble-path" />

        <!-- ================= 第 2 棵树路线 (中 · 教学焦点/特征扰动) ================= -->
        <!-- 抽样包 2 -->
        <g transform="translate(130, 380)">
          <rect x="-45" y="-45" width="90" height="90" rx="8" fill="none" stroke="var(--focus)" stroke-width="1.5" stroke-dasharray="3 3"/>
          <circle cx="-20" cy="-15" r="5" class="focus-marker" />
          <circle cx="5" cy="-25" r="5" class="focus-marker" />
          <circle cx="20" cy="5" r="5" class="focus-marker" />
          <circle cx="-10" cy="20" r="5" class="focus-marker" />
          <circle cx="15" cy="20" r="5" class="focus-marker" />
          <text x="0" y="62" class="scene-label focus" text-anchor="middle">子集 D₂ + 随机特征</text>
        </g>
        <!-- 连线到树 2 -->
        <line x1="185" y1="380" x2="350" y2="380" stroke="var(--focus)" stroke-width="2" marker-end="url(#arrow-focus)" />

        <!-- 树 2 结构 (x=440, y=380, 具有不同的拓扑分裂) -->
        <g transform="translate(440, 380)">
          <!-- 枝干 -->
          <line x1="0" y1="-32" x2="-35" y2="0" stroke="var(--focus)" stroke-width="2" stroke-linecap="round" />
          <line x1="0" y1="-32" x2="45" y2="0" stroke="var(--focus)" stroke-width="2" stroke-linecap="round" />
          <line x1="-35" y1="0" x2="-50" y2="32" stroke="var(--focus)" stroke-width="2" stroke-linecap="round" />
          <line x1="-35" y1="0" x2="-20" y2="32" stroke="var(--focus)" stroke-width="2" stroke-linecap="round" />
          <line x1="45" y1="0" x2="30" y2="32" stroke="var(--focus)" stroke-width="2" stroke-linecap="round" />
          <line x1="45" y1="0" x2="60" y2="32" stroke="var(--focus)" stroke-width="2" stroke-linecap="round" />
          <!-- 节点 -->
          <circle cx="0" cy="-32" r="7" fill="var(--bg)" stroke="var(--focus)" stroke-width="2" />
          <circle cx="-35" cy="0" r="6" fill="var(--bg)" stroke="var(--focus)" stroke-width="2" />
          <circle cx="45" cy="0" r="6" fill="var(--bg)" stroke="var(--focus)" stroke-width="2" />
          <circle cx="-50" cy="32" r="5" fill="var(--focus)" />
          <circle cx="-20" cy="32" r="5" fill="var(--focus)" />
          <circle cx="30" cy="32" r="5" fill="var(--focus)" />
          <circle cx="60" cy="32" r="5" fill="var(--focus)" />
          <text x="0" y="58" class="scene-label focus" text-anchor="middle">基学习器 T₂ (裂分扰动)</text>
        </g>
        
        <!-- 树 2 输出汇入通道 -->
        <line x1="515" y1="380" x2="715" y2="380" stroke="var(--focus)" stroke-width="2" stroke-dasharray="4 4" opacity="0.8" />

        <!-- ================= 第 3 棵树路线 (下) ================= -->
        <!-- 抽样包 3 -->
        <g transform="translate(130, 560)">
          <rect x="-45" y="-45" width="90" height="90" rx="8" fill="none" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="3 3"/>
          <circle cx="-25" cy="-10" r="5" class="sample-dot" />
          <circle cx="-5" cy="-20" r="5" class="sample-dot" />
          <circle cx="20" cy="-15" r="5" class="sample-dot" />
          <circle cx="-5" cy="15" r="5" class="sample-dot" />
          <circle cx="25" cy="20" r="5" class="sample-dot" />
          <text x="0" y="62" class="scene-label" text-anchor="middle">子集 D_B (重抽样)</text>
        </g>
        <!-- 连线到树 3 -->
        <line x1="185" y1="560" x2="350" y2="560" stroke="var(--model)" stroke-width="2" marker-end="url(#arrow)" />

        <!-- 树 3 结构 (x=440, y=560) -->
        <g transform="translate(440, 560)">
          <!-- 枝干 -->
          <line x1="0" y1="-32" x2="-45" y2="0" class="tree-branch" />
          <line x1="0" y1="-32" x2="35" y2="0" class="tree-branch" />
          <line x1="-45" y1="0" x2="-60" y2="32" class="tree-branch" />
          <line x1="-45" y1="0" x2="-25" y2="32" class="tree-branch" />
          <line x1="35" y1="0" x2="15" y2="32" class="tree-branch" />
          <line x1="35" y1="0" x2="55" y2="32" class="tree-branch" />
          <!-- 节点 -->
          <circle cx="0" cy="-32" r="7" class="tree-node" />
          <circle cx="-45" cy="0" r="6" class="tree-node" />
          <circle cx="35" cy="0" r="6" class="tree-node" />
          <circle cx="-60" cy="32" r="5" fill="var(--model)" stroke="none" />
          <circle cx="-25" cy="32" r="5" fill="var(--model)" stroke="none" />
          <circle cx="15" cy="32" r="5" fill="var(--model)" stroke="none" />
          <circle cx="55" cy="32" r="5" fill="var(--model)" stroke="none" />
          <text x="0" y="58" class="scene-label" text-anchor="middle">基学习器 T_B</text>
        </g>

        <!-- 树 3 输出汇入通道 -->
        <path d="M 515 560 C 620 560, 640 380, 715 380" class="ensemble-path" />

        <!-- ================= 终点汇聚 (多路收束为一条粗线) ================= -->
        <!-- 汇聚中枢节点 -->
        <circle cx="725" cy="380" r="14" fill="var(--bg)" stroke="var(--model)" stroke-width="3" />
        <path d="M 720 375 L 730 385 M 730 375 L 720 385" stroke="var(--model)" stroke-width="2" stroke-linecap="round" />
        
        <!-- 收束出的强模型粗线 (4px 粗线签名) -->
        <line x1="739" y1="380" x2="840" y2="380" class="converge-line" marker-end="url(#arrow-strong)" />

        <text x="750" y="420" class="scene-label accent" text-anchor="middle">H(x) = 多数投票 / 均值</text>
        <text x="750" y="442" class="scene-label" text-anchor="middle">方差大幅降低</text>
      </svg>
    </div>
  </div>

  <aside class="notes" hidden>
    欢迎来到本讲的第二部分：Bagging 与随机森林。
    在前面我们看到，单个决策树往往具有极高的方差，对训练数据的扰动非常敏感。
    Bagging 通过自助重采样生成多个相互独立的训练子集，并行训练多棵决策树；
    而随机森林更进一步，在树节点每次分裂时只在随机抽取的特征子集里挑选最优切分点，彻底打破树与树之间的相关性。
    最终，多条基预测路径汇聚为一条强鲁棒的决策输出，达成高精度低方差的预测。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 7, total: 25 });
  </script>
</body>
</html>
