<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Stacking 与多模型融合架构</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      isolation: isolate;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
    }

    /* 顶部标题区：在纯净负空间中自然展开 */
    .title-field {
      position: absolute;
      top: 64px;
      left: 72px;
      z-index: 10;
      max-width: 520px;
    }

    .chapter-tag {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      opacity: 0.8;
    }

    h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      font-weight: 700;
      color: var(--text);
      margin: 0 0 16px 0;
      letter-spacing: -0.02em;
    }

    .lead-text {
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
    }

    /* 架构图 SVG 容器 */
    .arch-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* 层次说明文字 */
    .layer-label {
      font-family: var(--font-display);
      font-size: var(--fs-label);
      font-weight: 600;
      fill: var(--text);
      text-anchor: middle;
      letter-spacing: 0.03em;
    }

    .layer-sub {
      font-family: var(--font-sans);
      font-size: var(--fs-tick);
      fill: var(--muted);
      text-anchor: middle;
    }

    .node-text {
      font-family: var(--font-display);
      font-size: var(--fs-sec);
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .node-sub {
      font-family: var(--font-sans);
      font-size: var(--fs-tick);
      fill: var(--muted);
      text-anchor: middle;
    }

    /* 汇聚签名连线流动动画 */
    .flow-line {
      stroke-dasharray: 8 6;
      animation: flow-dash 18s linear infinite;
    }

    .meta-flow {
      stroke-dasharray: 10 6;
      animation: flow-dash 14s linear infinite;
    }

    @keyframes flow-dash {
      to {
        stroke-dashoffset: -140;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .flow-line, .meta-flow {
        animation: none !important;
        stroke-dasharray: none !important;
      }
    }
  </style>
</head>
<body data-page="19" data-total="25">
  <div id="stage">
    <header class="title-field">
      <div class="chapter-tag">PART 04 · STACKING</div>
      <h1>Stacking 融合架构</h1>
      <p class="lead-text">异质基学习器并行预测，元学习器拟合高阶组合权重</p>
    </header>

    <svg class="arch-svg" viewBox="0 0 1600 900" aria-label="Stacking 分层多模型融合架构图">
      <defs>
        <marker id="arr-model" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#17628E" />
        </marker>
        <marker id="arr-focus" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#B83D0B" />
        </marker>
      </defs>

      <!-- 导轨与层级界线 -->
      <line x1="740" y1="120" x2="740" y2="800" stroke="#71828B" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4" />
      <line x1="1120" y1="120" x2="1120" y2="800" stroke="#71828B" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4" />

      <!-- 层级题注（严格对齐各层列中心） -->
      <g transform="translate(620, 105)">
        <text class="layer-label" x="0" y="0">原始特征空间</text>
        <text class="layer-sub" x="0" y="20">样本矩阵 X</text>
      </g>

      <g transform="translate(930, 105)">
        <text class="layer-label" x="0" y="0">基学习器 (Level-0)</text>
        <text class="layer-sub" x="0" y="20">预测元特征</text>
      </g>

      <g transform="translate(1310, 105)">
        <text class="layer-label" x="0" y="0">元学习器 (Level-1)</text>
        <text class="layer-sub" x="0" y="20">收束生成最终决策</text>
      </g>

      <!-- 数据输入节点 -->
      <rect x="555" y="415" width="130" height="70" fill="none" stroke="#71828B" stroke-width="2" rx="4" />
      <text class="node-text" x="620" y="445" fill="#142630">输入数据 X</text>
      <text class="node-sub" x="620" y="468">[N × D]</text>

      <!-- 连线：输入 -> 基模型 -->
      <path d="M 685 435 C 750 435, 780 230, 840 230" fill="none" stroke="#17628E" stroke-width="2" marker-end="url(#arr-model)" />
      <path d="M 685 445 C 750 445, 780 375, 840 375" fill="none" stroke="#17628E" stroke-width="2" marker-end="url(#arr-model)" />
      <path d="M 685 455 C 750 455, 780 525, 840 525" fill="none" stroke="#17628E" stroke-width="2" marker-end="url(#arr-model)" />
      <path d="M 685 465 C 750 465, 780 670, 840 670" fill="none" stroke="#17628E" stroke-width="2" marker-end="url(#arr-model)" />

      <!-- 基学习器 4 个模型节点 -->
      <!-- 模型 1 -->
      <rect x="850" y="195" width="160" height="70" fill="none" stroke="#17628E" stroke-width="2" rx="4" />
      <text class="node-text" x="930" y="225" fill="#17628E">随机森林</text>
      <text class="node-sub" x="930" y="248">降低方差</text>

      <!-- 模型 2 -->
      <rect x="850" y="340" width="160" height="70" fill="none" stroke="#17628E" stroke-width="2" rx="4" />
      <text class="node-text" x="930" y="370" fill="#17628E">GBDT / XGB</text>
      <text class="node-sub" x="930" y="393">残差拟合</text>

      <!-- 模型 3 -->
      <rect x="850" y="490" width="160" height="70" fill="none" stroke="#17628E" stroke-width="2" rx="4" />
      <text class="node-text" x="930" y="520" fill="#17628E">支持向量机</text>
      <text class="node-sub" x="930" y="543">最大化间隔</text>

      <!-- 模型 4 -->
      <rect x="850" y="635" width="160" height="70" fill="none" stroke="#17628E" stroke-width="2" rx="4" />
      <text class="node-text" x="930" y="665" fill="#17628E">神经网络</text>
      <text class="node-sub" x="930" y="688">非线性表征</text>

      <!-- 连线：基学习器输出汇入元特征空间 -->
      <path class="flow-line" d="M 1010 230 C 1080 230, 1140 380, 1205 425" fill="none" stroke="#17628E" stroke-width="2" />
      <path class="flow-line" d="M 1010 375 C 1080 375, 1140 420, 1205 440" fill="none" stroke="#17628E" stroke-width="2" />
      <path class="flow-line" d="M 1010 525 C 1080 525, 1140 470, 1205 455" fill="none" stroke="#17628E" stroke-width="2" />
      <path class="flow-line" d="M 1010 670 C 1080 670, 1140 510, 1205 470" fill="none" stroke="#17628E" stroke-width="2" />

      <!-- 元学习器节点 (焦点强调色 --focus，面积严格控制在 3% 内) -->
      <rect x="1215" y="395" width="190" height="105" fill="none" stroke="#B83D0B" stroke-width="3" rx="6" />
      <text class="node-text" x="1310" y="432" fill="#B83D0B" style="font-size: 19px;">元学习器</text>
      <text class="node-sub" x="1310" y="458" fill="#50616B">Logistic / 岭回归</text>
      <text class="node-sub" x="1310" y="478" fill="#B83D0B" style="font-weight: 600;">拟合次级权重</text>

      <!-- 最终强汇聚收束连线 (主题 4px 签名粗线) -->
      <path class="meta-flow" d="M 1405 448 L 1485 448" fill="none" stroke="#B83D0B" stroke-width="4" marker-end="url(#arr-focus)" />

      <!-- 最终输出节点 -->
      <rect x="1495" y="415" width="85" height="66" fill="none" stroke="#142630" stroke-width="2" rx="4" />
      <text class="node-text" x="1537" y="443" fill="#142630" style="font-size: 16px;">最终预测</text>
      <text class="node-sub" x="1537" y="465">y_final</text>
    </svg>
  </div>

  <aside class="notes" hidden>
    这一讲我们进入集成学习的第三种范式：Stacking。
    不同于 Bagging 的并行重采样和 Boosting 的串行残差迭代，Stacking 的核心是用模型教模型。
    我们将多个表现差异显著的异质模型并行拟合，以它们的预测值构成全新的特征空间，
    再训练一个元学习器自动寻找各模型的最佳组合权重，实现多模型优势互补。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 19, total: 25 });
  </script>
</body>
</html>
