<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #E8EEF1;
      --text: #142630;
      --muted: #50616B;
      --model: #17628E;
      --focus: #B83D0B;
      --rule: #71828B;
      --font-sans: "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
      --font-display: "Noto Sans CJK SC Medium", "Noto Sans CJK SC", sans-serif;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow: hidden;
    }

    /* 构图主体：左侧标题与提问，右侧三大架构收束至决策线 */
    .header-block {
      position: absolute;
      left: 104px;
      top: 280px;
      width: 480px;
      z-index: 10;
      pointer-events: none;
    }

    .cover-title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      font-weight: 700;
      color: var(--text);
      margin: 0 0 24px 0;
      letter-spacing: -0.01em;
    }

    .cover-lead {
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
    }

    .scene-svg {
      position: absolute;
      inset: 0;
      width: 1600px;
      height: 900px;
      z-index: 2;
    }

    /* 文本层级严格使用 token 档位：13/15/16/18/19/22/34px */
    .arch-tag {
      font-family: var(--font-display);
      font-size: var(--fs-body);
      font-weight: 700;
      fill: var(--text);
    }

    .arch-sub {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      fill: var(--muted);
    }

    .badge-label {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      font-weight: 700;
      fill: var(--model);
    }

    .eval-legend {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      fill: var(--rule);
    }

    .meta-dest {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: 700;
      fill: var(--text);
    }

    .focus-dest {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      font-weight: 700;
      fill: var(--focus);
    }
  </style>
</head>
<body data-page="23" data-total="25">
  <div id="stage">
    <header class="header-block">
      <h1 class="cover-title">实战对比与总结</h1>
      <p class="cover-lead">方差、偏差与计算开销：工业场景下的横向选型与工程权衡</p>
    </header>

    <svg class="scene-svg" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 坐标参考网格与阶段轴 -->
      <g stroke="#71828B" stroke-width="1" opacity="0.3">
        <line x1="620" y1="130" x2="620" y2="780" stroke-dasharray="2 4" />
        <line x1="980" y1="130" x2="980" y2="780" stroke-dasharray="2 4" />
        <line x1="1340" y1="130" x2="1340" y2="780" stroke-dasharray="2 4" />

        <line x1="620" y1="210" x2="1480" y2="210" stroke-dasharray="4 6" />
        <line x1="620" y1="450" x2="1480" y2="450" stroke-dasharray="4 6" />
        <line x1="620" y1="690" x2="1480" y2="690" stroke-dasharray="4 6" />
      </g>

      <!-- 顶部拓扑阶段标头 -->
      <text x="620" y="116" class="eval-legend" text-anchor="start">架构范式</text>
      <text x="980" y="116" class="eval-legend" text-anchor="middle">学习器拓扑</text>
      <text x="1340" y="116" class="eval-legend" text-anchor="middle">集成汇聚</text>

      <!-- 流派一：Bagging -->
      <g id="track-bagging">
        <text x="620" y="196" class="arch-tag">Bagging</text>
        <text x="620" y="240" class="arch-sub">并行重采样 · 降方差</text>

        <!-- 3路并行展开 -->
        <path d="M 720 210 C 800 210, 830 160, 910 160" stroke="#17628E" stroke-width="2" />
        <path d="M 720 210 L 910 210" stroke="#17628E" stroke-width="2" />
        <path d="M 720 210 C 800 210, 830 260, 910 260" stroke="#17628E" stroke-width="2" />

        <circle cx="910" cy="160" r="6" fill="#E8EEF1" stroke="#17628E" stroke-width="2" />
        <circle cx="910" cy="210" r="6" fill="#E8EEF1" stroke="#17628E" stroke-width="2" />
        <circle cx="910" cy="260" r="6" fill="#E8EEF1" stroke="#17628E" stroke-width="2" />

        <!-- 汇聚到投票 -->
        <path d="M 916 160 C 970 160, 1000 210, 1050 210" stroke="#17628E" stroke-width="2" />
        <path d="M 916 210 L 1050 210" stroke="#17628E" stroke-width="2" />
        <path d="M 916 260 C 970 260, 1000 210, 1050 210" stroke="#17628E" stroke-width="2" />

        <circle cx="1050" cy="210" r="9" fill="#17628E" />
        <text x="1050" y="240" class="arch-sub" text-anchor="middle">平权平均</text>

        <!-- 汇向中枢的主干蓝线 -->
        <path d="M 1059 210 C 1170 210, 1220 440, 1340 448" stroke="#17628E" stroke-width="4" fill="none" />
      </g>

      <!-- 流派二：Boosting -->
      <g id="track-boosting">
        <text x="620" y="436" class="arch-tag">Boosting</text>
        <text x="620" y="480" class="arch-sub">串行残差 · 降偏差</text>

        <!-- 串行残差递进 -->
        <path d="M 720 450 L 800 450" stroke="#17628E" stroke-width="2" />
        <circle cx="800" cy="450" r="6" fill="#E8EEF1" stroke="#17628E" stroke-width="2" />

        <path d="M 806 450 L 880 450" stroke="#B83D0B" stroke-width="2" marker-end="url(#arrow)" />
        <circle cx="880" cy="450" r="6" fill="#E8EEF1" stroke="#17628E" stroke-width="2" />

        <path d="M 886 450 L 960 450" stroke="#B83D0B" stroke-width="2" marker-end="url(#arrow)" />
        <circle cx="960" cy="450" r="6" fill="#E8EEF1" stroke="#17628E" stroke-width="2" />

        <path d="M 966 450 L 1050 450" stroke="#17628E" stroke-width="2" />
        <circle cx="1050" cy="450" r="9" fill="#17628E" />
        <text x="1050" y="480" class="arch-sub" text-anchor="middle">加权累加</text>

        <!-- 汇向中枢的主干蓝线 -->
        <path d="M 1059 450 L 1340 450" stroke="#17628E" stroke-width="4" fill="none" />
      </g>

      <!-- 流派三：Stacking -->
      <g id="track-stacking">
        <text x="620" y="676" class="arch-tag">Stacking</text>
        <text x="620" y="720" class="arch-sub">分层元学习 · 泛化融合</text>

        <!-- 异构模型 -->
        <path d="M 720 690 C 800 690, 830 640, 910 640" stroke="#17628E" stroke-width="2" />
        <path d="M 720 690 L 910 690" stroke="#17628E" stroke-width="2" />
        <path d="M 720 690 C 800 690, 830 740, 910 740" stroke="#17628E" stroke-width="2" />

        <rect x="904" y="634" width="12" height="12" fill="#E8EEF1" stroke="#17628E" stroke-width="2" />
        <circle cx="910" cy="690" r="6" fill="#E8EEF1" stroke="#17628E" stroke-width="2" />
        <polygon points="910,734 917,746 903,746" fill="#E8EEF1" stroke="#17628E" stroke-width="2" />

        <!-- 汇入元学习器 -->
        <path d="M 916 640 C 970 640, 1000 690, 1050 690" stroke="#17628E" stroke-width="2" />
        <path d="M 916 690 L 1050 690" stroke="#17628E" stroke-width="2" />
        <path d="M 916 740 C 970 740, 1000 690, 1050 690" stroke="#17628E" stroke-width="2" />

        <circle cx="1050" cy="690" r="9" fill="#17628E" />
        <text x="1050" y="720" class="arch-sub" text-anchor="middle">元学习器</text>

        <!-- 汇向中枢的主干蓝线 -->
        <path d="M 1059 690 C 1170 690, 1220 460, 1340 452" stroke="#17628E" stroke-width="4" fill="none" />
      </g>

      <!-- 三线汇聚核心：签名粗蓝线收束并标记橙色决策点 -->
      <g id="final-decision">
        <path d="M 1340 450 L 1450 450" stroke="#17628E" stroke-width="4" stroke-linecap="round" />

        <circle cx="1450" cy="450" r="12" fill="#B83D0B" />
        <circle cx="1450" cy="450" r="20" fill="none" stroke="#B83D0B" stroke-width="2" stroke-dasharray="3 3" />

        <text x="1450" y="495" class="meta-dest" text-anchor="middle">场景选型</text>
        <text x="1450" y="522" class="focus-dest" text-anchor="middle">精度 · 稳定性 · 延迟</text>
      </g>

      <!-- 箭头定义 -->
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#B83D0B" />
        </marker>
      </defs>
    </svg>
  </div>

  <aside class="notes" hidden>
    各位同学，欢迎来到第五模块——实战对比与总结。
    在前面的学习中，我们逐一掌握了 Bagging、Boosting 和 Stacking 的核心机理。
    本章我们将把三大流派置于同一坐标系中进行全方位横向审视：从偏差与方差的数学平衡，到训练并发度、预测延迟与过拟合风险，系统梳理面对不同工业场景时应如何权衡选型。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 23, total: 25 });
  </script>
</body>
</html>
