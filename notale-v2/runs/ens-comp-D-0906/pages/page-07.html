<!doctype html>
<html lang="zh">
<!--
构图意图：
1. 主对象：左侧多个并行采样的基学习器预测流，右侧收束为一个强聚合节点。
2. 对象关系：Bootstrap 样本驱动各基学习器独立并行输出预测（分类票数或回归值），多条细冷蓝轨迹向右水平汇入深蓝聚合节点。
3. 说明依附：分类（多数表决）与回归（简单平均）的双机制切换挂在聚合端点正下方，参数与算式直接贴在汇聚处。
-->
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #DCE2DE;
      --text: #17221F;
      --muted: #46534F;
      --line: #74817C;
      --model: #2E5F78;
      --aggregate: #173E50;
      --focus: #C64B2E;
      --uncertain: #8B6941;
      --font-sans: "Noto Sans CJK SC", "Noto Sans SC", system-ui, sans-serif;
    }

    #stage {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      padding: 56px 64px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    /* 标题区 */
    .header {
      position: absolute;
      top: 52px;
      left: 64px;
      width: 1472px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.18;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .lead {
      margin: 8px 0 0 0;
      font-size: 19px;
      color: var(--muted);
      line-height: 1.45;
    }

    .task-switch {
      display: inline-flex;
      gap: 12px;
    }

    .task-btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      padding: 6px 16px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 2px;
      transition: all 160ms var(--ease-join);
    }

    .task-btn.active {
      background: var(--aggregate);
      color: #fff;
      border-color: var(--aggregate);
    }

    /* 主可视化区 */
    .viz-canvas {
      position: absolute;
      top: 156px;
      left: 64px;
      width: 1472px;
      height: 670px;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* 阶段列标注 */
    .col-title {
      font-size: 15px;
      font-weight: 700;
      fill: var(--muted);
      letter-spacing: 0.04em;
    }

    .col-sub {
      font-size: 13px;
      fill: var(--line);
    }

    /* 样本与学习器节点 */
    .data-node {
      fill: #C9D2CD;
      stroke: var(--line);
      stroke-width: 1.2;
    }

    .tree-node {
      fill: #fff;
      stroke: var(--model);
      stroke-width: 1.8;
    }

    .tree-label {
      font-size: 16px;
      font-weight: 700;
      fill: var(--model);
      text-anchor: middle;
      dominant-baseline: central;
      font-family: var(--font-numeric), var(--font-sans);
    }

    .pred-pill {
      fill: #fff;
      stroke: var(--model);
      stroke-width: 1.4;
    }

    .pred-text {
      font-size: 15px;
      font-weight: 700;
      font-family: var(--font-numeric), var(--font-sans);
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* 聚合枢纽 */
    .agg-hub {
      fill: var(--aggregate);
      stroke: #fff;
      stroke-width: 3;
    }

    .agg-title {
      font-size: 19px;
      font-weight: 700;
      fill: #fff;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .formula-tag {
      font-size: 16px;
      font-weight: 700;
      fill: var(--aggregate);
      font-family: var(--font-numeric), var(--font-sans);
    }

    .final-box {
      fill: #E3E9E5;
      stroke: var(--aggregate);
      stroke-width: 2.2;
    }

    .final-val {
      font-size: 22px;
      font-weight: 700;
      fill: var(--aggregate);
      font-family: var(--font-numeric), var(--font-sans);
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* 流动轨迹线 */
    .stream-line {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.4;
      stroke-dasharray: 4 4;
    }

    .conv-line {
      fill: none;
      stroke: var(--model);
      stroke-width: 2.4;
      stroke-linecap: round;
      opacity: 0.85;
      transition: stroke 200ms;
    }

    .out-line {
      fill: none;
      stroke: var(--aggregate);
      stroke-width: 4;
      stroke-linecap: round;
    }

    .pill-note {
      font-size: 15px;
      fill: var(--muted);
    }

    .dot-lead {
      fill: var(--line);
    }
  </style>
</head>
<body data-page="07" data-total="26">
  <div id="stage">
    <header class="header">
      <div>
        <h1>并行训练与聚合预测</h1>
        <p class="lead">基学习器互不依赖独立拟合，推断时通过表决或平均汇聚为单一判断。</p>
      </div>
      <div class="task-switch" role="group" aria-label="学习任务切换">
        <button id="btn-clf" class="task-btn active" type="button">分类任务（投票）</button>
        <button id="btn-reg" class="task-btn" type="button">回归任务（平均）</button>
      </div>
    </header>

    <div class="viz-canvas">
      <svg viewBox="0 0 1472 670">
          <!-- 阶段列标题 -->
        <g transform="translate(60, 30)">
          <text class="col-title" x="0" y="0">1. 自助采样</text>
          <text class="col-sub" x="0" y="18">D₁~D₅ 独立抽样</text>
        </g>
        <g transform="translate(360, 30)">
          <text class="col-title" x="0" y="0">2. 并行拟合</text>
          <text class="col-sub" x="0" y="18">h₁~h₅ 同步训练</text>
        </g>
        <g transform="translate(680, 30)">
          <text class="col-title" x="0" y="0">3. 个体推断</text>
          <text class="col-sub" x="0" y="18">单一测试样本 x</text>
        </g>
        <g transform="translate(1010, 30)">
          <text class="col-title" x="0" y="0">4. 汇聚规则</text>
          <text id="agg-rule-sub" class="col-sub" x="0" y="18">多数表决：argmax Σ 𝕀(h_b=y)</text>
        </g>
        <g transform="translate(1310, 30)">
          <text class="col-title" x="0" y="0">5. 最终预测</text>
          <text class="col-sub" x="0" y="18">H(x)</text>
        </g>

        <!-- 5 条并行轨道的连线与节点 (y = 110, 205, 300, 395, 490) -->
        <g id="tracks-group"></g>

        <!-- 汇聚收束路径 -->
        <g id="converge-paths"></g>

        <!-- 聚合枢纽与输出 -->
        <g id="agg-hub-group" transform="translate(1080, 300)">
          <!-- 汇聚中心 -->
          <circle class="agg-hub" cx="0" cy="0" r="54"></circle>
          <text id="hub-label" class="agg-title" x="0" y="0">多数表决</text>

          <!-- 延伸至最终输出 -->
          <line class="out-line" x1="54" y1="0" x2="220" y2="0"></line>
          <polygon points="226,0 214,-6 214,6" fill="var(--aggregate)"></polygon>

          <!-- 最终输出框 -->
          <g transform="translate(240, -42)">
            <rect class="final-box" x="0" y="0" width="130" height="84" rx="4"></rect>
            <text class="pill-note" x="65" y="24" text-anchor="middle">集成预测 H(x)</text>
            <text id="final-pred" class="final-val" x="65" y="58">正类 (+1)</text>
          </g>

          <g transform="translate(0, 110)">
            <text id="formula-text" class="formula-tag" x="0" y="0" text-anchor="middle">H(x) = mode { +1, -1, +1, +1, -1 } = +1</text>
            <text id="formula-desc" class="pill-note" x="0" y="26" text-anchor="middle">3 票赞成抵消 2 票失误</text>
          </g>
        </g>
      </svg>
    </div>
  </div>

  <aside class="notes" hidden>
    在 Bagging 的流程中，第一步是通过 Bootstrap 抽样得到彼此略有差异的子数据集。
    因为各个子数据集彼此独立，所有基学习器可以完全并行化训练，大幅节约计算耗时。
    当一个新样本输入时，所有基学习器独立给出各自的预测结果。
    对于分类任务，采用多数表决法，通过少数服从多数消除个别分类器的误判；
    对于回归任务，直接对所有基学习器的预测值取算术平均，有效平滑掉单个模型的方差扰动。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (function () {
      "use strict";

      Deck.init({ index: 7, total: 26 });

      const tracksGroup = document.getElementById("tracks-group");
      const convergePaths = document.getElementById("converge-paths");
      const hubLabel = document.getElementById("hub-label");
      const finalPred = document.getElementById("final-pred");
      const formulaText = document.getElementById("formula-text");
      const formulaDesc = document.getElementById("formula-desc");
      const aggRuleSub = document.getElementById("agg-rule-sub");
      const btnClf = document.getElementById("btn-clf");
      const btnReg = document.getElementById("btn-reg");

      const yCoords = [110, 205, 300, 395, 490];

      // 两套任务数据
      const clfData = {
        ruleSub: "多数表决：argmax Σ 𝕀(h_b=y)",
        hub: "多数表决",
        preds: ["+1 (正)", "-1 (负)", "+1 (正)", "+1 (正)", "-1 (负)"],
        colors: ["#173E50", "#8B6941", "#173E50", "#173E50", "#8B6941"],
        finalVal: "+1 (正类)",
        formula: "H(x) = mode { +1, -1, +1, +1, -1 } = +1",
        desc: "3 票赞成抵消 2 票失误"
      };

      const regData = {
        ruleSub: "算术平均：1/B · Σ h_b(x)",
        hub: "简单平均",
        preds: ["24.2", "27.8", "25.1", "23.9", "26.5"],
        colors: ["#2E5F78", "#2E5F78", "#2E5F78", "#2E5F78", "#2E5F78"],
        finalVal: "25.50",
        formula: "H(x) = (24.2 + 27.8 + 25.1 + 23.9 + 26.5) / 5",
        desc: "均值 25.50 抵消个体最大偏差 +2.3"
      };

      let currentMode = "clf";

      function renderTracks() {
        const data = currentMode === "clf" ? clfData : regData;

        // 渲染 5 轨道的各节点
        let htmlTracks = "";
        let htmlPaths = "";

        yCoords.forEach((y, i) => {
          const pred = data.preds[i];
          const color = data.colors[i];

          // 样本集节点 (x=110)
          htmlTracks += `
            <g transform="translate(110, ${y})">
              <rect class="data-node" x="-46" y="-20" width="92" height="40" rx="3"></rect>
              <text class="tree-label" fill="var(--text)" x="0" y="0">D<tspan baseline-shift="sub" font-size="13"> ${i+1}</tspan></text>
            </g>
          `;

          // 训练流线: 样本 -> 学习器
          htmlTracks += `<line class="stream-line" x1="156" y1="${y}" x2="364" y2="${y}"></line>`;
          htmlTracks += `<polygon points="368,${y} 358,${y-4} 358,${y+4}" fill="var(--line)"></polygon>`;

          // 学习器节点 (x=410)
          htmlTracks += `
            <g transform="translate(410, ${y})">
              <circle class="tree-node" cx="0" cy="0" r="24"></circle>
              <text class="tree-label" x="0" y="0">h<tspan baseline-shift="sub" font-size="13"> ${i+1}</tspan></text>
            </g>
          `;

          // 推断流线: 学习器 -> 输出预测值
          htmlTracks += `<line class="stream-line" x1="434" y1="${y}" x2="682" y2="${y}"></line>`;
          htmlTracks += `<polygon points="686,${y} 676,${y-4} 676,${y+4}" fill="var(--line)"></polygon>`;

          // 预测输出标签 (x=740)
          htmlTracks += `
            <g transform="translate(740, ${y})">
              <rect class="pred-pill" x="-56" y="-18" width="112" height="36" rx="3" stroke="${color}"></rect>
              <text class="pred-text" fill="${color}" x="0" y="0">${pred}</text>
            </g>
          `;

          // 汇聚连线: 预测标签 (x=796) -> 聚合枢纽 (x=1080, y=300)
          const startX = 796;
          const endX = 1080;
          const endY = 300;
          const cpx1 = startX + (endX - startX) * 0.45;
          const cpx2 = startX + (endX - startX) * 0.8;
          htmlPaths += `
            <path class="conv-line" d="M ${startX} ${y} C ${cpx1} ${y}, ${cpx2} ${endY}, ${endX} ${endY}" stroke="${color}"></path>
          `;
        });

        tracksGroup.innerHTML = htmlTracks;
        convergePaths.innerHTML = htmlPaths;

        // 更新聚合与结果说明
        hubLabel.textContent = data.hub;
        finalPred.textContent = data.finalVal;
        formulaText.textContent = data.formula;
        formulaDesc.textContent = data.desc;
        aggRuleSub.textContent = data.ruleSub;
      }

      function setMode(mode) {
        currentMode = mode;
        if (mode === "clf") {
          btnClf.classList.add("active");
          btnReg.classList.remove("active");
        } else {
          btnReg.classList.add("active");
          btnClf.classList.remove("active");
        }
        renderTracks();
      }

      btnClf.addEventListener("click", () => setMode("clf"));
      btnReg.addEventListener("click", () => setMode("reg"));

      renderTracks();
    })();
  </script>
</body>
</html>
