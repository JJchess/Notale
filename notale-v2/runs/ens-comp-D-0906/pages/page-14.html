<!--
  主对象：逐轮迭代的样本权重点阵与串行弱分类器切割线，在流场与加权投票中收束为一条强决策分界。
  关系展现：弱分类器（--model 冷蓝）依次切过二维样本空间，被错分的高权重点随迭代在空间中被强化放大；多个弱决策在右侧收束为深色强集成边界（--aggregate 深蓝），当前焦点线以焦橙（--focus）提示单轮关注转移。
  说明依附：大标题“Boosting 与 AdaBoost”稳居左侧安全留白区，副题紧扣“错分加权 · 串行补足”，右下角附简要轮次演进指标标签。
-->
<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Boosting 与 AdaBoost</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --stage-w: 1600px;
      --stage-h: 900px;
      --bg: #DCE2DE;
      --text: #17221F;
      --font-sans: "Noto Sans CJK SC", "Noto Sans SC", system-ui, sans-serif;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      padding: var(--pad-y) var(--pad-x);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      contain: layout paint;
      box-sizing: border-box;
    }

    #field-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .cover-content {
      position: absolute;
      top: 260px;
      left: 110px;
      width: 580px;
      z-index: 5;
      pointer-events: none;
    }

    .chapter-tag {
      font-size: var(--fs-label);
      font-weight: var(--weight-medium);
      color: var(--model);
      letter-spacing: 0.16em;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 20px 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: var(--weight-bold);
      line-height: var(--lh-tight);
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .subtitle {
      margin: 0;
      font-size: var(--fs-lead);
      font-weight: var(--weight-regular);
      color: var(--muted);
      line-height: var(--lh-copy);
      letter-spacing: 0.02em;
    }

    .status-capsule {
      position: absolute;
      bottom: 80px;
      left: 110px;
      z-index: 5;
      display: flex;
      gap: 40px;
      align-items: baseline;
      pointer-events: none;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-label {
      font-size: var(--fs-label);
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .stat-val {
      font-family: var(--font-numeric);
      font-size: var(--fs-lead);
      font-weight: var(--weight-medium);
      color: var(--aggregate);
    }

    .legend-box {
      position: absolute;
      top: 60px;
      right: 90px;
      z-index: 5;
      display: flex;
      gap: 32px;
      pointer-events: none;
      font-size: var(--fs-label);
      color: var(--muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .leg-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .leg-dot.w { background: var(--focus); }
    .leg-dot.m { background: var(--model); }
    .leg-dot.a { background: var(--aggregate); }
  </style>
</head>
<body data-page="14" data-total="26">
  <div id="stage" aria-labelledby="cover-title">
    <canvas id="field-canvas" class="cv-fill no-pan" aria-hidden="true"></canvas>

    <div class="cover-content">
      <div class="chapter-tag">Chapter 03 · Boosting</div>
      <h1 id="cover-title">Boosting 与<br>AdaBoost</h1>
      <p class="subtitle">错分加权 · 串行补足 · 组合强判决</p>
    </div>

    <div class="status-capsule">
      <div class="stat-item">
        <span class="stat-label">基学习器形态</span>
        <span class="stat-val">弱决策树桩</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">串行迭代机制</span>
        <span class="stat-val">错分样本自适应重赋权</span>
      </div>
    </div>

    <div class="legend-box">
      <div class="legend-item"><span class="leg-dot w"></span>难分高权样本</div>
      <div class="legend-item"><span class="leg-dot m"></span>各轮弱切割边界</div>
      <div class="legend-item"><span class="leg-dot a"></span>加权集成决策域</div>
    </div>
  </div>

  <aside class="notes" hidden>
    欢迎来到第三单元：Boosting 与 AdaBoost。
    与上一章并行独立的 Bagging 不同，Boosting 采用串行迭代思路：每一轮训练都重点针对前一轮被错分的困难样本，不断修正不足，最后通过加权投票把一系列弱分类器组合成强分类器。
  </aside>

  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      Deck.init({ index: 14, total: 26, keys: false });

      const canvas = document.getElementById("field-canvas");
      const ctx = Deck.fit(canvas);
      if (!ctx) return;

      const W = 1600;
      const H = 900;
      const SEED = "adaboost-cover-seed-2026";
      const rng = new Math.seedrandom(SEED);

      // 颜色提取
      const colText = Deck.token("--text") || "#17221F";
      const colMuted = Deck.token("--muted") || "#46534F";
      const colLine = Deck.token("--line") || "#74817C";
      const colModel = Deck.token("--model") || "#2E5F78";
      const colAggregate = Deck.token("--aggregate") || "#173E50";
      const colFocus = Deck.token("--focus") || "#C64B2E";
      const colUncertain = Deck.token("--uncertain") || "#8B6941";

      // 标题避让区 (左侧 0~680, 180~640)
      const TITLE_SAFE = { x1: 60, y1: 180, x2: 660, y2: 660 };

      // 生成二维分类数据集 (主要分布在右侧 660~1520, 100~820)
      const samples = [];
      const N_POINTS = 110;
      for (let i = 0; i < N_POINTS; i++) {
        // 双月/嵌套分布形态
        const cls = rng() > 0.5 ? 1 : -1;
        let x, y;
        if (cls === 1) {
          const angle = rng() * Math.PI * 0.9 + 0.1;
          const r = 260 + (rng() - 0.5) * 140;
          x = 1120 + Math.cos(angle) * r;
          y = 480 - Math.sin(angle) * r;
        } else {
          const angle = rng() * Math.PI * 0.9 + 1.2;
          const r = 240 + (rng() - 0.5) * 140;
          x = 1180 + Math.cos(angle) * r;
          y = 440 - Math.sin(angle) * r;
        }

        // 越靠近边界，越易成为难分样本，初始赋予不同权重
        const distToCenter = Math.hypot(x - 1150, y - 460);
        const isHard = distToCenter < 180 && (x > 960 && x < 1320);
        const weight = isHard ? (1.8 + rng() * 1.5) : (0.6 + rng() * 0.5);

        samples.push({
          x, y, cls,
          weight,
          baseRadius: isHard ? 6.5 : 3.8,
          isHard
        });
      }

      // 生成弱分类器切线（决策桩决策边界决策面集合）
      const stumps = [
        { type: 'v', x: 880, y1: 120, y2: 780, sign: 1, alpha: 0.78, active: false },
        { type: 'h', y: 380, x1: 760, x2: 1520, sign: -1, alpha: 0.65, active: false },
        { type: 'v', x: 1240, y1: 160, y2: 800, sign: -1, alpha: 0.92, active: false },
        { type: 'diag', p1: {x: 820, y: 640}, p2: {x: 1440, y: 220}, alpha: 1.15, active: true },
        { type: 'v', x: 1040, y1: 200, y2: 740, sign: 1, alpha: 0.84, active: false },
        { type: 'h', y: 560, x1: 820, x2: 1480, sign: 1, alpha: 0.72, active: false }
      ];

      // 离屏渲染底图网格与集成轮廓
      const bgCanvas = document.createElement("canvas");
      bgCanvas.width = W;
      bgCanvas.height = H;
      const bctx = bgCanvas.getContext("2d");

      function drawStaticField() {
        bctx.clearRect(0, 0, W, H);

        // 弱网格刻度线与坐标指示
        bctx.strokeStyle = "rgba(116, 129, 124, 0.18)";
        bctx.lineWidth = 1;
        for (let gx = 700; gx <= 1520; gx += 80) {
          bctx.beginPath();
          bctx.moveTo(gx, 100);
          bctx.lineTo(gx, 800);
          bctx.stroke();
        }
        for (let gy = 120; gy <= 800; gy += 80) {
          bctx.beginPath();
          bctx.moveTo(700, gy);
          bctx.lineTo(1520, gy);
          bctx.stroke();
        }

        // 聚合强分类器等高线/平滑非线性决策域
        bctx.save();
        bctx.strokeStyle = colAggregate;
        bctx.lineWidth = 3.5;
        bctx.setLineDash([8, 6]);
        bctx.beginPath();
        // 平滑S型决策分割主轴
        bctx.moveTo(780, 720);
        bctx.bezierCurveTo(940, 680, 1010, 480, 1140, 450);
        bctx.bezierCurveTo(1260, 420, 1340, 260, 1500, 210);
        bctx.stroke();
        bctx.restore();

        // 聚合边界置信带
        bctx.save();
        bctx.fillStyle = "rgba(23, 62, 80, 0.04)";
        bctx.beginPath();
        bctx.moveTo(780, 750);
        bctx.bezierCurveTo(940, 710, 1010, 510, 1140, 480);
        bctx.bezierCurveTo(1260, 450, 1340, 290, 1500, 240);
        bctx.lineTo(1500, 180);
        bctx.bezierCurveTo(1340, 230, 1260, 390, 1140, 420);
        bctx.bezierCurveTo(1010, 450, 940, 650, 780, 690);
        bctx.closePath();
        bctx.fill();
        bctx.restore();

        // 弱学习器决策桩切割线
        stumps.forEach((s) => {
          bctx.save();
          if (s.active) {
            // 当前轮次聚焦割线
            bctx.strokeStyle = "rgba(198, 75, 46, 0.55)";
            bctx.lineWidth = 2;
          } else {
            bctx.strokeStyle = "rgba(46, 95, 120, 0.32)";
            bctx.lineWidth = 1.2;
            bctx.setLineDash([4, 4]);
          }

          bctx.beginPath();
          if (s.type === 'v') {
            bctx.moveTo(s.x, s.y1);
            bctx.lineTo(s.x, s.y2);
          } else if (s.type === 'h') {
            bctx.moveTo(s.x1, s.y);
            bctx.lineTo(s.x2, s.y);
          } else if (s.type === 'diag') {
            bctx.moveTo(s.p1.x, s.p1.y);
            bctx.lineTo(s.p2.x, s.p2.y);
          }
          bctx.stroke();
          bctx.restore();
        });
      }

      drawStaticField();

      // 粒子流线模拟加权迭代过程中的梯度与信息汇聚流
      const FLOW_LINES = 38;
      const flowPaths = [];
      for (let i = 0; i < FLOW_LINES; i++) {
        const startX = 720 + rng() * 760;
        const startY = 120 + rng() * 680;
        const pts = [{ x: startX, y: startY }];
        let cx = startX;
        let cy = startY;
        for (let step = 0; step < 18; step++) {
          // 受主聚合边界吸引流向中央
          const targetY = 460 - (cx - 1140) * 0.38;
          const dy = (targetY - cy) * 0.08 + (rng() - 0.5) * 8;
          const dx = (1140 - cx) * 0.04 + (rng() - 0.5) * 10;
          cx += dx;
          cy += dy;
          pts.push({ x: cx, y: cy });
        }
        flowPaths.push({
          pts,
          speed: 0.0004 + rng() * 0.0006,
          phase: rng(),
          alpha: 0.15 + rng() * 0.2
        });
      }

      // 动画与主循环
      function render(time) {
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(bgCanvas, 0, 0);

        // 绘制微流动汇聚光痕
        ctx.save();
        ctx.lineWidth = 1.2;
        flowPaths.forEach(fp => {
          const t = (fp.phase + time * fp.speed) % 1;
          const idx = Math.floor(t * (fp.pts.length - 1));
          const p = fp.pts[idx];
          if (!p) return;
          ctx.strokeStyle = `rgba(46, 95, 120, ${fp.alpha * 0.8})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 1.8, 0, Math.PI * 2);
          ctx.stroke();
        });
        ctx.restore();

        // 绘制样本点
        samples.forEach(pt => {
          // 脉冲效果在难分高权样本上呼吸，表示错分自适应权重放大
          let r = pt.baseRadius;
          if (pt.isHard) {
            const pulse = Math.sin(time * 0.0025 + pt.x * 0.02) * 1.5;
            r = pt.baseRadius + pulse;
          }

          ctx.save();
          if (pt.cls === 1) {
            // 正类样本（聚合深色调）
            ctx.fillStyle = pt.isHard ? colFocus : colAggregate;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, Math.max(2, r), 0, Math.PI * 2);
            ctx.fill();

            if (pt.isHard) {
              // 高权光晕圈
              ctx.strokeStyle = "rgba(198, 75, 46, 0.4)";
              ctx.lineWidth = 1.4;
              ctx.beginPath();
              ctx.arc(pt.x, pt.y, r + 4, 0, Math.PI * 2);
              ctx.stroke();
            }
          } else {
            // 负类样本（个体冷蓝空心/十字）
            ctx.strokeStyle = pt.isHard ? colFocus : colModel;
            ctx.lineWidth = pt.isHard ? 2.2 : 1.5;
            ctx.beginPath();
            const arm = Math.max(3, r);
            ctx.moveTo(pt.x - arm, pt.y - arm);
            ctx.lineTo(pt.x + arm, pt.y + arm);
            ctx.moveTo(pt.x + arm, pt.y - arm);
            ctx.lineTo(pt.x - arm, pt.y + arm);
            ctx.stroke();

            if (pt.isHard) {
              ctx.strokeStyle = "rgba(198, 75, 46, 0.35)";
              ctx.lineWidth = 1.2;
              ctx.strokeRect(pt.x - arm - 3, pt.y - arm - 3, (arm + 3) * 2, (arm + 3) * 2);
            }
          }
          ctx.restore();
        });
      }

      // 缩放适配与循环
      Deck.onResize(() => {
        Deck.fit(canvas);
        drawStaticField();
        render(0);
      });

      Deck.loop((time) => {
        render(time);
      }, { still: 1600 });

    })();
  </script>
</body>
</html>
