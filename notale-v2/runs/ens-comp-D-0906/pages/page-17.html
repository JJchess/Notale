<!--
构图意图：
1. 主对象是 AdaBoost 从三个弱分类器（h₁, h₂, h₃）经过可信度权重（α₁, α₂, α₃）加权求和并经过符号函数 sign(·) 收束为最终强分类器 H(x) 的判定流向。
2. 对象之间的关系通过“三个弱分类器的带权预测分量”汇流进入“加权加和轴与阈值线”，由分立的冷蓝个体轨迹最终凝练为更深更重的集成决策输出。
3. 说明文字与公式严格依附于汇流的各节点：左侧是基分类器与其权重 α，中间是加权求和与符号截断，右侧是合成的判别边界与最终公式。
-->
<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/lib/katex.min.css">
  <script src="assets/lib/katex.min.js"></script>
  <style>
    #stage {
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      color: var(--text);
      font-family: var(--font-sans);
      background-color: var(--bg);
      display: grid;
      grid-template-rows: auto 1fr;
      row-gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: var(--weight-bold);
      line-height: var(--lh-tight);
      color: var(--text);
    }

    .lead {
      margin: 0;
      font-size: var(--fs-lead);
      color: var(--muted);
      font-weight: var(--weight-medium);
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    svg.diagram {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* 文本与标签样式 */
    .txt-title {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: var(--weight-medium);
      fill: var(--text);
    }

    .txt-body {
      font-size: var(--fs-body);
      fill: var(--text);
      font-family: var(--font-sans);
    }

    .txt-sec {
      font-size: var(--fs-sec);
      fill: var(--muted);
      font-family: var(--font-sans);
    }

    .txt-num {
      font-family: var(--font-numeric);
      font-variant-numeric: tabular-nums;
    }

    .txt-model {
      fill: var(--model);
      font-weight: var(--weight-medium);
    }

    .txt-agg {
      fill: var(--aggregate);
      font-weight: var(--weight-bold);
    }
  </style>
</head>
<body data-page="17" data-total="26">
  <div id="stage">
    <header>
      <h1>AdaBoost 最终决策</h1>
      <p class="lead">按可信度加权表决，弱分类器组合为强分类器</p>
    </header>

    <div class="canvas-container min0">
      <svg class="diagram" viewBox="0 0 1488 740" preserveAspectRatio="none">
        <defs>
          <marker id="arrow-model" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M1,1 L7,4 L1,7 Z" fill="#2E5F78" />
          </marker>
          <marker id="arrow-agg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M1,1 L7,4 L1,7 Z" fill="#173E50" />
          </marker>
        </defs>

        <!-- 左区：基分类器与其投票贡献 -->
        <!-- 基学习器 1 -->
        <g transform="translate(40, 50)">
          <text x="0" y="24" class="txt-title txt-model">基分类器 h₁(x)</text>
          <text x="0" y="52" class="txt-sec">权重 <tspan class="txt-num" font-weight="700">α₁ = 1.10</tspan></text>
          <rect x="0" y="66" width="165" height="10" rx="2" fill="#2E5F78" />
          <text x="0" y="102" class="txt-body">投票：<tspan class="txt-num txt-model" font-weight="700">+1.10</tspan></text>
        </g>

        <!-- 连线 1 汇向中心 -->
        <path d="M 230, 140 C 390, 140, 440, 275, 520, 275" fill="none" stroke="#2E5F78" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-model)" />

        <!-- 基学习器 2 -->
        <g transform="translate(40, 260)">
          <text x="0" y="24" class="txt-title txt-model">基分类器 h₂(x)</text>
          <text x="0" y="52" class="txt-sec">权重 <tspan class="txt-num" font-weight="700">α₂ = 0.69</tspan></text>
          <rect x="0" y="66" width="104" height="10" rx="2" fill="#2E5F78" />
          <text x="0" y="102" class="txt-body">投票：<tspan class="txt-num" fill="#8B6941" font-weight="700">-0.69</tspan></text>
        </g>

        <!-- 连线 2 汇向中心 -->
        <path d="M 230, 345 C 380, 345, 440, 310, 520, 310" fill="none" stroke="#2E5F78" stroke-width="2.2" marker-end="url(#arrow-model)" />

        <!-- 基学习器 3 -->
        <g transform="translate(40, 470)">
          <text x="0" y="24" class="txt-title txt-model">基分类器 h₃(x)</text>
          <text x="0" y="52" class="txt-sec">权重 <tspan class="txt-num" font-weight="700">α₃ = 0.31</tspan></text>
          <rect x="0" y="66" width="46" height="10" rx="2" fill="#2E5F78" />
          <text x="0" y="102" class="txt-body">投票：<tspan class="txt-num txt-model" font-weight="700">+0.31</tspan></text>
        </g>

        <!-- 连线 3 汇向中心 -->
        <path d="M 230, 550 C 390, 550, 440, 345, 520, 345" fill="none" stroke="#2E5F78" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-model)" />

        <!-- 中区：加权线性组合与阈值线 -->
        <g transform="translate(540, 150)">
          <line x1="0" y1="0" x2="0" y2="340" stroke="#74817C" stroke-width="1.5" />
          
          <text x="36" y="46" class="txt-title">线性组合值 f(x)</text>
          <text x="36" y="90" class="txt-body">f(x) = ∑ αₘ hₘ(x)</text>
          
          <!-- 代入具体数值算式 -->
          <g transform="translate(36, 120)">
            <text x="0" y="24" class="txt-sec">代入样本 x 计算：</text>
            <text x="0" y="60" class="txt-body txt-num" font-size="22">
              1.10 - 0.69 + 0.31 = <tspan fill="#173E50" font-weight="700">+0.72</tspan>
            </text>
            
            <!-- 标尺与分界线 -->
            <line x1="0" y1="120" x2="320" y2="120" stroke="#74817C" stroke-width="2" />
            <!-- 零点分界 -->
            <line x1="160" y1="104" x2="160" y2="136" stroke="#C64B2E" stroke-width="3" />
            <text x="160" y="158" text-anchor="middle" class="txt-sec" fill="#C64B2E">0 (决策阈值)</text>

            <text x="24" y="112" class="txt-sec">-1 区间</text>
            <text x="290" y="112" class="txt-sec">+1 区间</text>

            <!-- 结果点标记 -->
            <circle cx="236" cy="120" r="7" fill="#173E50" />
            <text x="236" y="98" text-anchor="middle" class="txt-num txt-agg" font-size="18">+0.72</text>
          </g>
        </g>

        <!-- 聚合输出主连线：粗实线 -->
        <path d="M 960, 310 L 1030, 310" fill="none" stroke="#173E50" stroke-width="5" marker-end="url(#arrow-agg)" />

        <!-- 右区：最终强分类器 H(x) -->
        <g transform="translate(1050, 180)">
          <text x="0" y="36" class="txt-title txt-agg" font-size="22">最终强分类器 H(x)</text>
          
          <text x="0" y="86" class="txt-body" font-size="22">
            H(x) = sign( f(x) )
          </text>
          
          <g transform="translate(0, 130)">
            <text x="0" y="26" class="txt-body">
              sign(+0.72) = <tspan class="txt-num txt-agg" font-size="34" font-weight="700">+1</tspan>
            </text>
          </g>
        </g>
      </svg>
    </div>
  </div>

  <aside class="notes" hidden>
    在完成了各轮弱分类器的训练后，AdaBoost 的最终决策并非简单的多数表决，而是按各弱分类器的可信度进行加权表决。
    每个分类器的权重 α 取决于其在训练集上的错误率，分类错误率越低，所获权重越大。
    最终决策将各分类器的输出加权求和，通过符号函数映射为强分类器的预测类别。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 17, total: 26 });
  </script>
</body>
</html>
