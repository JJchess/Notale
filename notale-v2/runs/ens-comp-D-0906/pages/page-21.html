<!--
  构图意图：
  1. 主对象：横向展开的“选择与评估坐标推演系统”——由左侧三种集成范式轨迹（Bagging方差收束、Boosting偏差纠正、Stacking分层汇聚）汇入右侧严密的折外验证与选择基准。
  2. 关系表现：左侧基学习器以半透明浅蓝细线簇并行穿行，经由严格的无泄漏分折边界，在右侧收束为一根深蓝、厚实的集成终态共识实线，辅以焦橙色指示当前的决策选择焦点。
  3. 说明文字依附：标题与章节导言严整锚定在左上静止天光负空间，图例与评判准则紧贴在右侧收束轴末端，不设多余包装板。
-->
<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #DCE2DE;
      --text: #17221F;
      --font-sans: "Noto Sans CJK SC", "Noto Sans SC", system-ui, sans-serif;
      --font-display: "Noto Sans CJK SC Medium", "Noto Sans SC", system-ui, sans-serif;
      --font-numeric: "Lato", "Noto Sans SC", sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* 依赖 base.css 对 #stage 的定位与缩放，不在页面内重写绝对定位 */
    #stage {
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      background: var(--bg);
      overflow: hidden;
    }

    .cover-canvas {
      position: absolute;
      inset: 0;
      width: 1600px;
      height: 900px;
      pointer-events: none;
      z-index: 1;
    }

    .header-group {
      position: absolute;
      top: 88px;
      left: 88px;
      z-index: 2;
      pointer-events: none;
    }

    .kicker-label {
      font-family: var(--font-numeric);
      font-size: var(--fs-label);
      font-weight: var(--weight-medium);
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .main-title {
      margin: 0 0 16px 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: var(--weight-bold);
      line-height: var(--lh-tight);
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .lead-text {
      margin: 0;
      font-family: var(--font-sans);
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      max-width: 520px;
    }

    .legend-panel {
      position: absolute;
      right: 88px;
      bottom: 80px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 14px;
      pointer-events: none;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-sans);
      font-size: var(--fs-sec);
      color: var(--muted);
    }

    .legend-bar {
      width: 32px;
      height: 3px;
      border-radius: 1px;
    }

    .legend-bar.member {
      background: var(--model);
      opacity: 0.7;
    }

    .legend-bar.ensemble {
      background: var(--aggregate);
      height: 4px;
    }

    .legend-bar.focus-pt {
      background: var(--focus);
      height: 4px;
    }

    .axis-mark {
      position: absolute;
      bottom: 80px;
      left: 88px;
      z-index: 2;
      font-family: var(--font-numeric);
      font-size: var(--fs-tick);
      color: var(--line);
      letter-spacing: 0.08em;
      pointer-events: none;
    }
  </style>
</head>
<body data-page="21" data-total="26">
  <div id="stage">
    <canvas id="coverCv" class="cover-canvas" width="1600" height="900"></canvas>

    <header class="header-group">
      <h1 class="main-title">选择、评估与拓展</h1>
      <p class="lead-text">严守训练边界，在方差与偏差的权衡中确立集成架构。</p>
    </header>

    <div class="legend-panel">
      <div class="legend-item">
        <span class="legend-bar member"></span>
        <span>基学习器轨迹群</span>
      </div>
      <div class="legend-item">
        <span class="legend-bar ensemble"></span>
        <span>折外聚合共识输出</span>
      </div>
      <div class="legend-item">
        <span class="legend-bar focus-pt"></span>
        <span>泛化边界评估基准</span>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    各位同学，我们进入本讲的第四部分：选择、评估与拓展。
    前面我们分别深入剖析了 Bagging 的方差削减机制和 Boosting 的前向误差纠偏过程。
    但面对现实问题，究竟何时选用哪种策略？如何设计严格无泄漏的交叉验证与 Stacking 架构？
    本节我们将建立清晰的评估坐标系，从原理到场景落地，完成全景式的策略抉择。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (function () {
      "use strict";
      Deck.init({ index: 21, total: 26 });

      const cv = document.getElementById("coverCv");
      const ctx = Deck.fit(cv);

      const W = 1600;
      const H = 900;

      // 颜色提取
      const colMuted = Deck.token("--muted") || "#46534F";
      const colLine = Deck.token("--line") || "#74817C";
      const colModel = Deck.token("--model") || "#2E5F78";
      const colAgg = Deck.token("--aggregate") || "#173E50";
      const colFocus = Deck.token("--focus") || "#C64B2E";

      // 轨迹生成逻辑（确定性多重基模型汇入聚合共识线）
      const NUM_TRAJECTORIES = 22;
      const trajectories = [];
      const startX = 520;
      const midX1 = 820;
      const midX2 = 1140;
      const endX = 1480;

      const targetY = 460;

      // 种子化随机数
      let seed = 42;
      function rnd() {
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
      }

      for (let i = 0; i < NUM_TRAJECTORIES; i++) {
        const spread = (i - (NUM_TRAJECTORIES - 1) / 2) * 28;
        const initY = targetY + spread * 1.8 + (rnd() - 0.5) * 40;
        const foldY = targetY + spread * 0.9 + (rnd() - 0.5) * 30;
        const outFoldY = targetY + spread * 0.25 + (rnd() - 0.5) * 15;
        const finalY = targetY + (rnd() - 0.5) * 4;

        trajectories.push({
          x0: startX,
          y0: initY,
          x1: midX1,
          y1: foldY,
          x2: midX2,
          y2: outFoldY,
          x3: endX,
          y3: finalY,
          opacity: 0.18 + (1 - Math.abs(spread) / 320) * 0.45,
          width: 1.2 + rnd() * 0.8
        });
      }

      function drawCover(progress) {
        ctx.clearRect(0, 0, W, H);

        // 1. 结构辅助标线与阶段分界
        ctx.save();
        ctx.strokeStyle = colLine;
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 6]);

        // 分界垂线
        [midX1, midX2].forEach((x, idx) => {
          ctx.beginPath();
          ctx.moveTo(x, 180);
          ctx.lineTo(x, 740);
          ctx.stroke();

          // 刻度标签
          ctx.save();
          ctx.setLineDash([]);
          ctx.fillStyle = colMuted;
          ctx.font = "12px Lato, 'Noto Sans SC', sans-serif";
          ctx.letterSpacing = "1px";
          const label = idx === 0 ? "PARTITION / CV" : "OUT-OF-FOLD / AGG";
          ctx.fillText(label, x + 12, 200);
          ctx.restore();
        });
        ctx.restore();

        // 2. 基学习器细轨迹簇
        trajectories.forEach((t) => {
          ctx.save();
          ctx.strokeStyle = colModel;
          ctx.lineWidth = t.width;
          ctx.globalAlpha = t.opacity * Math.min(1, progress * 1.2);

          ctx.beginPath();
          ctx.moveTo(t.x0, t.y0);
          // 三次贝塞尔拟合自然流动与收束
          ctx.bezierCurveTo(
            t.x0 + 160, t.y0,
            t.x1 - 120, t.y1,
            t.x1, t.y1
          );
          ctx.bezierCurveTo(
            t.x1 + 140, t.y1,
            t.x2 - 120, t.y2,
            t.x2, t.y2
          );
          ctx.bezierCurveTo(
            t.x2 + 150, t.y2,
            t.x3 - 100, t.y3,
            t.x3, t.y3
          );
          ctx.stroke();
          ctx.restore();
        });

        // 3. 聚合深蓝共识主轨迹
        ctx.save();
        ctx.strokeStyle = colAgg;
        ctx.lineWidth = 4.5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(startX + 80, targetY);
        ctx.bezierCurveTo(
          midX1 - 80, targetY + 6,
          midX1 + 100, targetY - 4,
          midX2, targetY
        );
        ctx.bezierCurveTo(
          midX2 + 120, targetY + 2,
          endX - 80, targetY,
          endX, targetY
        );
        ctx.stroke();
        ctx.restore();

        // 4. 关键转折点（焦橙与深蓝节点）
        const evalPoints = [
          { x: midX1, y: targetY - 4, label: "Leak-Free CV", col: colModel },
          { x: midX2, y: targetY, label: "Meta Learner", col: colModel },
          { x: endX, y: targetY, label: "Ensemble Consensus", col: colFocus }
        ];

        evalPoints.forEach((pt) => {
          ctx.save();
          // 外环
          ctx.fillStyle = Deck.token("--bg") || "#DCE2DE";
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 7, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = pt.col;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 7, 0, Math.PI * 2);
          ctx.stroke();

          // 实心内芯
          ctx.fillStyle = pt.col;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 3.5, 0, Math.PI * 2);
          ctx.fill();

          // 节点说明
          ctx.font = "500 13px Lato, 'Noto Sans SC', sans-serif";
          ctx.fillStyle = pt.col === colFocus ? colFocus : colMuted;
          ctx.fillText(pt.label, pt.x - 30, pt.y - 18);
          ctx.restore();
        });
      }

      // 静止初始帧与微幅进场支持
      if (Deck.reduced()) {
        drawCover(1);
      } else {
        let startTime = performance.now();
        const anim = Deck.loop((now) => {
          const elapsed = (now - startTime) / 1000;
          const progress = Math.min(1, elapsed / 0.8);
          drawCover(progress);
          if (progress >= 1) anim();
        });
      }

      Deck.onResize(() => {
        Deck.fit(cv);
        drawCover(1);
      });
    })();
  </script>
</body>
</html>
