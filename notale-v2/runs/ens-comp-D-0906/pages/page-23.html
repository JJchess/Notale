<!--
构图意图：
1. 主对象是两组鲜明的交叉验证数据流结构：上层「全量预处理（信息泄漏）」与下层「折内管线隔离（严格边界）」。
2. 对象之间的关系通过 K 折数据块切分与箭头传递直观显示：全量流中，验证折样本被一同吸入标准化与特征选择；隔离流中，验证折完全被阻隔在 fit 外。
3. 说明文字直接附着在每个关键动作与落差柱状对比旁，字数控制在极简预算（≤200 字），无容器框和装饰条。
-->
<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #DCE2DE;
      --text: #17221F;
      --muted: #46534F;
      --line: #74817C;
      --model: #2E5F78;
      --aggregate: #173E50;
      --focus: #C64B2E;
      --uncertain: #8B6941;
      --font-sans: "Noto Sans CJK SC", "Noto Sans SC", system-ui, sans-serif;
      --font-display: "Noto Sans CJK SC Medium", "Noto Sans SC", system-ui, sans-serif;
      --font-numeric: "Lato", "Noto Sans SC", sans-serif;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      background: var(--bg);
      color: var(--text);
      padding: 56px 64px;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* 标题 */
    .title-wrap {
      position: absolute;
      top: 56px;
      left: 64px;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 34px;
      font-weight: 700;
      line-height: 1.18;
      color: var(--text);
    }

    .lead {
      margin-top: 10px;
      font-size: 19px;
      color: var(--muted);
      line-height: 1.45;
    }

    /* 主视觉绘图区 (纯矢量 SVG + 紧贴的对齐排版) */
    .evidence-svg {
      position: absolute;
      top: 156px;
      left: 64px;
      width: 1472px;
      height: 670px;
    }

    /* 文本与标签样式 (SVG 外部或内部字体规范) */
    text {
      font-family: var(--font-sans);
    }
    .t-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
    }
    .t-label {
      font-size: 16px;
      font-weight: 500;
      fill: var(--text);
    }
    .t-sub {
      font-size: 15px;
      fill: var(--muted);
    }
    .t-num {
      font-family: var(--font-numeric);
      font-size: 16px;
      font-weight: 700;
    }
    .t-big-num {
      font-family: var(--font-numeric);
      font-size: 22px;
      font-weight: 700;
    }
  </style>
</head>
<body data-page="23" data-total="26">
  <div id="stage">
    <div class="title-wrap">
      <h1>避免集成中的数据泄漏：严格服从训练集边界</h1>
      <p class="lead">预处理统计量与特征筛选若触碰验证折，将制造虚假高分并在实测崩溃</p>
    </div>

    <svg class="evidence-svg" viewBox="0 0 1472 670">
      <defs>
        <!-- 箭头标记 -->
        <marker id="arr-leak" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C64B2E"/>
        </marker>
        <marker id="arr-safe" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#173E50"/>
        </marker>
        <marker id="arr-line" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#74817C"/>
        </marker>
      </defs>

      <!-- ================= 模式 1：全量泄漏 ================= -->
      <g transform="translate(0, 20)">
        <text x="0" y="24" class="t-title" fill="#C64B2E">全量处理：验证集信息被提前吸入</text>

        <!-- 数据块划分 -->
        <g transform="translate(0, 50)">
          <!-- 训练折 1-4 -->
          <rect x="0" y="0" width="220" height="54" fill="#2E5F78" opacity="0.85" rx="3"/>
          <text x="110" y="33" text-anchor="middle" fill="#FFFFFF" class="t-label">训练折 (80%)</text>

          <!-- 验证折 -->
          <rect x="232" y="0" width="68" height="54" fill="#C64B2E" rx="3"/>
          <text x="266" y="33" text-anchor="middle" fill="#FFFFFF" class="t-label">验证折</text>

          <!-- 全量统揽大虚线包围框 -->
          <rect x="-6" y="-6" width="312" height="66" fill="none" stroke="#C64B2E" stroke-width="2" stroke-dasharray="6,4" rx="6"/>
          <text x="150" y="82" text-anchor="middle" fill="#C64B2E" class="t-sub">μ、σ 与特征相关度由全量 N 条一次算毕</text>

          <!-- 连线到处理节点 -->
          <path d="M 312 27 L 390 27" fill="none" stroke="#C64B2E" stroke-width="2.5" marker-end="url(#arr-leak)"/>

          <!-- 步骤：全量特征工程与基模型拟合 -->
          <g transform="translate(400, 0)">
            <rect x="0" y="0" width="250" height="54" fill="#FFFFFF" stroke="#C64B2E" stroke-width="2" rx="3"/>
            <text x="125" y="24" text-anchor="middle" class="t-label" fill="#17221F">全量标准化 + Top-20 筛选</text>
            <text x="125" y="44" text-anchor="middle" class="t-sub">验证折标签与分布提前泄露</text>
          </g>

          <path d="M 654 27 L 730 27" fill="none" stroke="#C64B2E" stroke-width="2.5" marker-end="url(#arr-leak)"/>

          <!-- 步骤：基模型集成 -->
          <g transform="translate(740, 0)">
            <rect x="0" y="0" width="240" height="54" fill="#FFFFFF" stroke="#74817C" stroke-width="1.5" rx="3"/>
            <text x="120" y="24" text-anchor="middle" class="t-label" fill="#17221F">集成基学习器拟合</text>
            <text x="120" y="44" text-anchor="middle" class="t-sub">在虚假关联上充分拟合</text>
          </g>
        </g>
      </g>

      <!-- 分隔细基线 -->
      <line x1="0" y1="230" x2="1000" y2="230" stroke="#74817C" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- ================= 模式 2：严格边界隔离 ================= -->
      <g transform="translate(0, 260)">
        <text x="0" y="24" class="t-title" fill="#173E50">按折隔离：预处理仅服从训练折</text>

        <!-- 数据块划分 -->
        <g transform="translate(0, 50)">
          <!-- 训练折 1-4（严格独立 fit） -->
          <rect x="0" y="0" width="220" height="54" fill="#2E5F78" rx="3"/>
          <text x="110" y="25" text-anchor="middle" fill="#FFFFFF" class="t-label">训练折 (80%)</text>
          <text x="110" y="45" text-anchor="middle" fill="#FFFFFF" class="t-sub" opacity="0.85">仅在此折拟合统计量</text>

          <!-- 严格边界阻隔线 -->
          <line x1="226" y1="-12" x2="226" y2="120" stroke="#173E50" stroke-width="3"/>
          <text x="226" y="140" text-anchor="middle" fill="#173E50" class="t-sub" font-weight="700">严格数据墙</text>

          <!-- 验证折 (仅 transform / 盲测) -->
          <rect x="232" y="0" width="68" height="54" fill="#74817C" rx="3"/>
          <text x="266" y="25" text-anchor="middle" fill="#FFFFFF" class="t-label">验证折</text>
          <text x="266" y="45" text-anchor="middle" fill="#FFFFFF" class="t-sub" opacity="0.85">盲测</text>

          <!-- 训练折流线 -->
          <path d="M 220 27 L 390 27" fill="none" stroke="#173E50" stroke-width="2.5" marker-end="url(#arr-safe)"/>

          <!-- 步骤：折内独立特征工程 -->
          <g transform="translate(400, 0)">
            <rect x="0" y="0" width="250" height="54" fill="#FFFFFF" stroke="#173E50" stroke-width="2" rx="3"/>
            <text x="125" y="24" text-anchor="middle" class="t-label" fill="#17221F">Pipeline.fit(训练折)</text>
            <text x="125" y="44" text-anchor="middle" class="t-sub">参数与列掩码完全封闭</text>
          </g>

          <path d="M 654 27 L 730 27" fill="none" stroke="#173E50" stroke-width="2.5" marker-end="url(#arr-safe)"/>

          <!-- 步骤：集成基模型拟合与折外评估 -->
          <g transform="translate(740, 0)">
            <rect x="0" y="0" width="240" height="54" fill="#FFFFFF" stroke="#173E50" stroke-width="1.5" rx="3"/>
            <text x="120" y="24" text-anchor="middle" class="t-label" fill="#17221F">集成基学习器拟合</text>
            <text x="120" y="44" text-anchor="middle" class="t-sub">验证折 transform 后预测</text>
          </g>

          <!-- 验证折专用绕行只读路径 -->
          <path d="M 266 54 L 266 90 L 860 90 L 860 62" fill="none" stroke="#74817C" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-line)"/>
          <text x="560" y="110" text-anchor="middle" fill="#74817C" class="t-sub">验证折仅执行 transform()，零参数外溢</text>
        </g>
      </g>

      <!-- 纵向分割线 -->
      <line x1="960" y1="20" x2="960" y2="560" stroke="#74817C" stroke-width="1"/>

      <!-- ================= 右侧数据度量对照 (纯数据几何对比) ================= -->
      <g transform="translate(1010, 20)">
        <text x="0" y="24" class="t-title" fill="#17221F">泛化落差对比</text>
        <text x="0" y="52" class="t-sub">验证得分 vs 真实测试集</text>

        <!-- 全量泄漏组 -->
        <g transform="translate(0, 90)">
          <text x="0" y="0" class="t-label" fill="#C64B2E">全量泄漏路径</text>
          
          <!-- 验证得分 -->
          <text x="0" y="32" class="t-sub">验证得分 (虚高)</text>
          <rect x="0" y="42" width="340" height="24" fill="#ECEFEF" rx="2"/>
          <rect x="0" y="42" width="319" height="24" fill="#C64B2E" rx="2"/>
          <text x="310" y="59" text-anchor="end" fill="#FFFFFF" class="t-num">0.94</text>

          <!-- 真实测试集 -->
          <text x="0" y="94" class="t-sub">真实测试表现 (暴跌)</text>
          <rect x="0" y="104" width="340" height="24" fill="#ECEFEF" rx="2"/>
          <rect x="0" y="104" width="241" height="24" fill="#C64B2E" opacity="0.55" rx="2"/>
          <text x="233" y="121" text-anchor="end" fill="#FFFFFF" class="t-num">0.71</text>
          <text x="250" y="122" class="t-num" fill="#C64B2E">-0.23</text>
        </g>

        <!-- 折内隔离组 -->
        <g transform="translate(0, 280)">
          <text x="0" y="0" class="t-label" fill="#173E50">折内隔离路径 (Pipeline)</text>
          
          <!-- 验证得分 -->
          <text x="0" y="32" class="t-sub">验证得分 (客观真实)</text>
          <rect x="0" y="42" width="340" height="24" fill="#ECEFEF" rx="2"/>
          <rect x="0" y="42" width="275" height="24" fill="#173E50" rx="2"/>
          <text x="267" y="59" text-anchor="end" fill="#FFFFFF" class="t-num">0.81</text>

          <!-- 真实测试集 -->
          <text x="0" y="94" class="t-sub">真实测试表现 (高度吻合)</text>
          <rect x="0" y="104" width="340" height="24" fill="#ECEFEF" rx="2"/>
          <rect x="0" y="104" width="272" height="24" fill="#173E50" opacity="0.75" rx="2"/>
          <text x="264" y="121" text-anchor="end" fill="#FFFFFF" class="t-num">0.80</text>
          <text x="282" y="122" class="t-num" fill="#173E50">-0.01</text>
        </g>

        <!-- 铁律提示 -->
        <g transform="translate(0, 480)">
          <text x="0" y="0" class="t-label" fill="#17221F">工程准则</text>
          <text x="0" y="28" class="t-sub">测试折绝不参与 fit()</text>
          <text x="0" y="52" class="t-sub">所有变换在折内封闭拟合</text>
        </g>
      </g>
    </svg>

    <!-- 讲稿 -->
    <aside class="notes" hidden>
      在集成学习中，数据泄漏是最致命的陷阱。
      如果我们在划分交叉验证之前就执行了全量标准化或全量特征筛选，验证折的均值、方差甚至目标标签相关性就会提前泄露进基学习器中。
      这会在验证集上产生高达 0.94 的虚假繁荣，但在真实未知测试集上会暴跌到 0.71。
      唯一的正确工程做法是建立严格的流水线边界：特征工程和参数估计只在每个训练折内部进行 fit，验证折仅接受 transform 映射，确保实测性能与验证评估高度一致。
    </aside>
  </div>

    Deck.init({ index: 23, total: 26 });
  </script>
</body>
</html>
