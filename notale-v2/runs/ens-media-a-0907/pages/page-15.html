<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow: hidden;
      user-select: none;
    }

    /* 顶部标题区 */
    .title-block {
      position: absolute;
      left: var(--pad-x);
      top: 60px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .topic-tag {
      font-size: var(--fs-sec);
      color: var(--text);
      letter-spacing: 0.08em;
    }
    .main-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .lead-sentence {
      margin: 0;
      font-size: var(--fs-lead);
      color: var(--muted);
      line-height: var(--lh-copy);
    }

    /* 主画幅：全宽纯净的梯度提升加法流视觉场 */
    .field-svg {
      position: absolute;
      inset: 0;
      width: 1600px;
      height: 900px;
      pointer-events: none;
    }

    .axis { stroke: var(--rule); stroke-width: 1.5px; }
    .grid { stroke: var(--rule); stroke-width: 1px; stroke-dasharray: 4 6; stroke-opacity: 0.3; }
    
    .target-f {
      stroke: var(--rule);
      stroke-width: 2px;
      stroke-dasharray: 6 6;
      fill: none;
    }

    .weak-step {
      stroke: var(--model);
      stroke-width: var(--stroke);
      fill: none;
      opacity: 0.28;
    }
    .accum-strong {
      stroke: var(--model);
      stroke-width: var(--stroke-strong);
      fill: none;
    }

    .residual-vec {
      stroke: var(--focus);
      stroke-width: var(--stroke-strong);
    }

    .tick-text {
      font-size: var(--fs-tick);
      fill: var(--muted);
      font-family: var(--font-sans);
      text-anchor: middle;
    }
    .annotation {
      font-size: var(--fs-sec);
      font-family: var(--font-sans);
      fill: var(--muted);
    }
    .brand-title {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: 600;
      fill: var(--text);
    }
    .brand-sub {
      font-size: var(--fs-sec);
      fill: var(--model);
    }
    .brand-focus-sub {
      font-size: var(--fs-sec);
      fill: var(--focus);
      font-weight: 600;
    }
  </style>
</head>
<body data-page="15" data-total="25">
  <div id="stage">
    <!-- 标题场区 -->
    <div class="title-block">
      <span class="topic-tag">第八讲 · 集成学习</span>
      <h1 class="main-title">梯度提升与现代 GBDT 生态</h1>
      <p class="lead-sentence">沿负梯度逐轮拟合残差，以加法弱树收敛目标连续函数。</p>
    </div>

    <!-- 主视觉系统：梯度提升收敛函数图解 + 三大工业架构名片 -->
    <svg class="field-svg" viewBox="0 0 1600 900" aria-hidden="true">
      <defs>
        <marker id="arr-focus" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--focus)" />
        </marker>
      </defs>

      <!-- 左侧：数学收敛坐标空间 -->
      <g transform="translate(56, 310)">
        <!-- 坐标轴 -->
        <line x1="0" y1="360" x2="940" y2="360" class="axis" />
        <line x1="0" y1="360" x2="0" y2="0" class="axis" />

        <!-- 参考横虚线 -->
        <line x1="0" y1="180" x2="940" y2="180" class="grid" />
        <line x1="0" y1="70" x2="940" y2="70" class="grid" />

        <!-- 真实目标函数曲线 f*(x) -->
        <path d="M 0 310 Q 240 40 480 220 T 940 70" class="target-f" />
        <text x="920" y="55" class="annotation" text-anchor="end">目标函数 f*(x)</text>

        <!-- 第 1 轮弱基学习器累积 -->
        <path d="M 0 270 H 280 V 170 H 600 V 230 H 940" class="weak-step" />

        <!-- 第 2 轮弱基学习器累积 -->
        <path d="M 0 300 H 210 V 140 H 430 V 195 H 680 V 130 H 940" class="weak-step" style="opacity: 0.5;" />

        <!-- 第 M 轮最终收敛强模型 F_M(x)：主题粗线签名 -->
        <path d="M 0 310 H 140 V 260 H 240 V 125 H 340 V 170 H 460 V 215 H 580 V 165 H 720 V 105 H 830 V 75 H 940" class="accum-strong" />
        <text x="955" y="78" class="brand-sub" dominant-baseline="middle" style="font-weight:600;">强集成模型 F_M(x)</text>

        <!-- 焦点：某处残差步进向量 -->
        <line x1="340" y1="125" x2="340" y2="170" class="residual-vec" marker-end="url(#arr-focus)" />
        <circle cx="340" cy="125" r="4" fill="var(--focus)" />
        <circle cx="340" cy="170" r="4" fill="var(--model)" />
        <text x="356" y="152" class="brand-focus-sub">残差步进 -g_m</text>

        <!-- 横坐标轴刻度 -->
        <text x="0" y="385" class="tick-text">0</text>
        <text x="470" y="385" class="tick-text">样本特征 x</text>
        <text x="940" y="385" class="tick-text">x_max</text>
      </g>

      <!-- 右侧：现代三大工业引擎生态谱系 (XGBoost, LightGBM, CatBoost) -->
      <g transform="translate(1120, 240)">
        <!-- 引擎 1: XGBoost -->
        <g transform="translate(0, 0)">
          <line x1="0" y1="0" x2="0" y2="100" stroke="var(--model)" stroke-width="3" />
          <text x="24" y="30" class="brand-title">XGBoost</text>
          <text x="24" y="62" class="brand-sub">二阶泰勒展开与精确树打分</text>
          <text x="24" y="90" class="annotation">目标函数引入 Hessian 与正则剪枝。</text>
        </g>

        <!-- 引擎 2: LightGBM (视觉聚焦点) -->
        <g transform="translate(0, 160)">
          <line x1="0" y1="0" x2="0" y2="100" stroke="var(--focus)" stroke-width="4" />
          <text x="24" y="30" class="brand-title">LightGBM</text>
          <text x="24" y="62" class="brand-focus-sub">直方图分箱与 Leaf-wise 生长</text>
          <text x="24" y="90" class="annotation">GOSS 单边采样与互斥特征捆绑极速计算。</text>
        </g>

        <!-- 引擎 3: CatBoost -->
        <g transform="translate(0, 320)">
          <line x1="0" y1="0" x2="0" y2="100" stroke="var(--model)" stroke-width="3" />
          <text x="24" y="30" class="brand-title">CatBoost</text>
          <text x="24" y="62" class="brand-sub">排序提升与对称决策树</text>
          <text x="24" y="90" class="annotation">原生类别特征转化，消除目标泄露偏移。</text>
        </g>
      </g>
    </svg>
  </div>

  <aside class="notes" hidden>
    同学们好，今天我们进入第八讲的第四个模块：梯度提升机（GBDT）与现代工业级生态。
    GBDT 的核心思想是加法模型与前向分步算法。每一轮训练，基学习器拟合的都是前一轮模型在损失函数下的负梯度——在均方误差下，它正是未被解释的残差。
    左侧展示了弱树如何逐步收拢、最终贴合复杂的连续曲线；
    右侧则是支撑起今天工业界海量结构化数据的三座里程碑：XGBoost、LightGBM 与 CatBoost。
    在接下来的四讲中，我们将从数学推导、可视化交互、工程异同一直走到代码实战。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 15, total: 25 });
  </script>
</body>
</html>
