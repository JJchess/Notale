<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      position: relative;
      background: var(--bg);
      overflow: hidden;
      color: var(--text);
      font-family: var(--font-sans);
    }

    /* 标题区：按 composition 设计安静负空间，折行严格对齐词义 */
    .title-area {
      position: absolute;
      top: 260px;
      left: 112px;
      width: 520px;
      z-index: 10;
    }

    .main-title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      color: var(--text);
      letter-spacing: -0.01em;
      margin: 0 0 20px 0;
      font-weight: 600;
    }

    .main-title .keyword {
      color: var(--model);
    }

    .desc {
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
      max-width: 460px;
    }

    /* 视觉主体：Stacking 多层级汇聚图解 */
    .stacking-diagram {
      position: absolute;
      right: 90px;
      top: 130px;
      width: 820px;
      height: 640px;
      z-index: 5;
    }

    /* 层级流动呼吸动画 */
    @keyframes flowPulse {
      0% { stroke-dashoffset: 48; }
      100% { stroke-dashoffset: 0; }
    }

    .flow-line {
      stroke-dasharray: 6 6;
      animation: flowPulse 2.4s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .flow-line {
        animation: none;
      }
    }
  </style>
</head>
<body data-page="20" data-total="25">
  <div id="stage">
    <!-- 主标题区 -->
    <div class="title-area">
      <h1 class="main-title">Stacking 与<br><span class="keyword">多模型融合</span>实战</h1>
      <p class="desc">异构基模型分层堆叠，由元学习器完成二次决策。</p>
    </div>

    <!-- 视觉主角：Stacking 严密架构图解 -->
    <svg class="stacking-diagram" viewBox="0 0 820 640" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 坐标基准与工程分割刻度线 -->
      <g stroke="var(--rule)" stroke-width="1" opacity="0.35">
        <line x1="210" y1="50" x2="210" y2="580" stroke-dasharray="2 4" />
        <line x1="470" y1="50" x2="470" y2="580" stroke-dasharray="2 4" />
        <line x1="660" y1="50" x2="660" y2="580" stroke-dasharray="2 4" />
      </g>

      <!-- 阶段指示文本 -->
      <g fill="var(--muted)" font-size="15" font-family="var(--font-sans)">
        <text x="210" y="38" text-anchor="middle">Layer 0: 异构基模型</text>
        <text x="470" y="38" text-anchor="middle">Meta-Features (OOF)</text>
        <text x="660" y="38" text-anchor="middle">Layer 1: 元学习器</text>
      </g>

      <!-- 流向连接线 (基模型到中间特征列) -->
      <path d="M 290 140 C 360 140, 390 280, 448 280" stroke="var(--model)" stroke-width="2" opacity="0.7" />
      <path d="M 290 320 C 370 320, 390 320, 448 320" stroke="var(--model)" stroke-width="2" opacity="0.7" />
      <path d="M 290 500 C 360 500, 390 360, 448 360" stroke="var(--model)" stroke-width="2" opacity="0.7" />

      <!-- 动态流线 -->
      <path d="M 290 140 C 360 140, 390 280, 448 280" stroke="var(--model)" stroke-width="2" class="flow-line" opacity="0.35" />
      <path d="M 290 320 C 370 320, 390 320, 448 320" stroke="var(--model)" stroke-width="2" class="flow-line" opacity="0.35" />
      <path d="M 290 500 C 360 500, 390 360, 448 360" stroke="var(--model)" stroke-width="2" class="flow-line" opacity="0.35" />

      <!-- 从中间特征矩阵汇聚到 Layer 1 元学习器 (粗线汇束签名) -->
      <path d="M 492 320 L 600 320" stroke="var(--model)" stroke-width="4" stroke-linecap="round" />

      <!-- 元学习器向最终预测的决策线 -->
      <path d="M 720 320 L 780 320" stroke="var(--focus)" stroke-width="4" stroke-linecap="round" />
      <polygon points="780,314 792,320 780,326" fill="var(--focus)" />

      <!-- === Layer 0: 基模型卡片 (简洁工程节点) === -->
      <!-- 基模型 1: 随机森林 -->
      <g transform="translate(100, 90)">
        <rect x="0" y="0" width="190" height="98" rx="2" fill="#ffffff" stroke="var(--model)" stroke-width="2" />
        <rect x="0" y="0" width="6" height="98" fill="var(--model)" />
        <text x="22" y="40" fill="var(--text)" font-size="16" font-weight="bold" font-family="var(--font-sans)">Random Forest</text>
        <text x="22" y="68" fill="var(--muted)" font-size="13" font-family="var(--font-sans)">树模型族 · 非线性切分</text>
      </g>

      <!-- 基模型 2: 支持向量机 -->
      <g transform="translate(100, 270)">
        <rect x="0" y="0" width="190" height="98" rx="2" fill="#ffffff" stroke="var(--model)" stroke-width="2" />
        <rect x="0" y="0" width="6" height="98" fill="var(--model)" />
        <text x="22" y="40" fill="var(--text)" font-size="16" font-weight="bold" font-family="var(--font-sans)">Support Vector</text>
        <text x="22" y="68" fill="var(--muted)" font-size="13" font-family="var(--font-sans)">核方法 · 最大间隔超平面</text>
      </g>

      <!-- 基模型 3: 神经网络 -->
      <g transform="translate(100, 450)">
        <rect x="0" y="0" width="190" height="98" rx="2" fill="#ffffff" stroke="var(--model)" stroke-width="2" />
        <rect x="0" y="0" width="6" height="98" fill="var(--model)" />
        <text x="22" y="40" fill="var(--text)" font-size="16" font-weight="bold" font-family="var(--font-sans)">Neural Net</text>
        <text x="22" y="68" fill="var(--muted)" font-size="13" font-family="var(--font-sans)">多层感知机 · 表征学习</text>
      </g>

      <!-- === 中间层: Meta-Features 数据流枢纽 === -->
      <g transform="translate(448, 250)">
        <rect x="0" y="0" width="44" height="140" rx="2" fill="#DFE7EC" stroke="var(--rule)" stroke-width="1.5" />
        <!-- 矩阵网格小线条表示预测列向量 -->
        <line x1="14" y1="14" x2="14" y2="126" stroke="var(--model)" stroke-width="1.5" stroke-dasharray="3 3" />
        <line x1="30" y1="14" x2="30" y2="126" stroke="var(--model)" stroke-width="1.5" stroke-dasharray="3 3" />
        <text x="22" y="160" fill="var(--muted)" font-size="13" text-anchor="middle" font-family="var(--font-sans)">[P₁ P₂ P₃]</text>
      </g>

      <!-- === Layer 1: 元学习器 (Meta Learner) 核心焦点节点 === -->
      <g transform="translate(600, 260)">
        <rect x="0" y="0" width="120" height="120" rx="4" fill="#ffffff" stroke="var(--focus)" stroke-width="2.5" />
        <text x="60" y="46" fill="var(--focus)" font-size="16" font-weight="bold" text-anchor="middle" font-family="var(--font-sans)">Logistic</text>
        <text x="60" y="72" fill="var(--text)" font-size="15" text-anchor="middle" font-family="var(--font-sans)">元学习器</text>
        <text x="60" y="98" fill="var(--muted)" font-size="13" text-anchor="middle" font-family="var(--font-sans)">权重自适应</text>
      </g>

      <!-- 最终输出标签 -->
      <text x="782" y="296" fill="var(--focus)" font-size="15" font-weight="bold" text-anchor="middle" font-family="var(--font-sans)">最终预测</text>
    </svg>
  </div>

  <aside class="notes" hidden>
    同学们好，今天我们进入第八讲的第五模块：Stacking 与多模型融合实战。
    前面我们学习了 Bagging 的并行平均与 Boosting 的串行纠错，而 Stacking 代表了集成的另一种强大思路——分层堆叠。
    它打破了单一模型家族的限制，把随机森林、支持向量机和神经网络等异构模型的预测结果作为新的特征，再由元学习器进行二次综合决策。
    接下来几节课，我们将深入拆解它的架构分层、防止数据泄露的 Out-of-Fold 机制，并动手编写融合代码。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 20, total: 25, keys: false });
  </script>
</body>
</html>
