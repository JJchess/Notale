<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: var(--pad-y) var(--pad-x);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      position: relative;
    }

    header {
      margin-bottom: 20px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      color: var(--text);
      margin: 0 0 6px 0;
      font-weight: 600;
    }

    .lead {
      font-size: var(--fs-lead);
      color: var(--muted);
      margin: 0;
      line-height: var(--lh-copy);
    }

    .diagram-area {
      position: relative;
      width: 100%;
      height: 660px;
    }

    svg.stacking-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .col-title {
      font-family: var(--font-sans);
      font-size: var(--fs-sec);
      fill: var(--muted);
      font-weight: 500;
    }

    .node-title {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: 600;
      fill: var(--text);
    }

    .node-sub {
      font-family: var(--font-sans);
      font-size: var(--fs-sec);
      fill: var(--muted);
    }

    .node-badge {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      fill: var(--model);
      font-weight: 500;
    }

    .node-meta {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      fill: var(--focus);
      font-weight: 600;
    }


  </style>
</head>
<body data-page="21" data-total="25">
  <div id="stage">
    <header>
      <h1>堆叠泛化：异构基模型与元学习器的分层架构</h1>
      <p class="lead">多族系模型输出初级预测构造元特征，元学习器在上层学习最优仲裁组合。</p>
    </header>

    <!-- 连线与标记定义放在 stage 最外层或 svg 首部保证光栅化完全幂等 -->
    <div class="diagram-area">
      <svg class="stacking-svg" viewBox="0 0 1488 660">
        <defs>
          <marker id="arr-model" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--model)" />
          </marker>
          <marker id="arr-rule" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--rule)" />
          </marker>
          <marker id="arr-focus" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="var(--focus)" />
          </marker>
        </defs>

        <!-- 导轨指示线 -->
        <g stroke="var(--rule)" stroke-width="1" stroke-dasharray="4 4" opacity="0.35">
          <line x1="160" y1="35" x2="160" y2="590" />
          <line x1="480" y1="35" x2="480" y2="590" />
          <line x1="820" y1="35" x2="820" y2="590" />
          <line x1="1170" y1="35" x2="1170" y2="590" />
        </g>
        <text x="160" y="24" text-anchor="middle" class="col-title">原始特征输入</text>
        <text x="480" y="24" text-anchor="middle" class="col-title">第一层：初级学习器（异构）</text>
        <text x="820" y="24" text-anchor="middle" class="col-title">元特征空间（初级预测组合）</text>
        <text x="1170" y="24" text-anchor="middle" class="col-title">第二层：元学习器</text>

        <!-- 第 0 步：输入数据与初级基学习器 -->
        <g id="base-layer">
          <rect x="60" y="200" width="200" height="190" rx="4" fill="none" stroke="var(--rule)" stroke-width="2" />
          <text x="160" y="250" text-anchor="middle" class="node-title">原始训练集</text>
          <text x="160" y="288" text-anchor="middle" class="node-sub">特征矩阵 X ∈ ℝⁿˣᵈ</text>
          <text x="160" y="322" text-anchor="middle" class="node-sub">目标真实标签 y</text>

          <path d="M 260 250 C 340 250, 340 120, 390 120" fill="none" stroke="var(--rule)" stroke-width="2" marker-end="url(#arr-rule)" />
          <path d="M 260 295 L 390 295" fill="none" stroke="var(--rule)" stroke-width="2" marker-end="url(#arr-rule)" />
          <path d="M 260 340 C 340 340, 340 470, 390 470" fill="none" stroke="var(--rule)" stroke-width="2" marker-end="url(#arr-rule)" />

          <rect x="390" y="70" width="180" height="100" rx="4" fill="none" stroke="var(--model)" stroke-width="2" />
          <text x="480" y="112" text-anchor="middle" class="node-title">Random Forest</text>
          <text x="480" y="142" text-anchor="middle" class="node-badge">Bagging 决策树系</text>

          <rect x="390" y="245" width="180" height="100" rx="4" fill="none" stroke="var(--model)" stroke-width="2" />
          <text x="480" y="287" text-anchor="middle" class="node-title">SVM</text>
          <text x="480" y="317" text-anchor="middle" class="node-badge">核方法流形切分</text>

          <rect x="390" y="420" width="180" height="100" rx="4" fill="none" stroke="var(--model)" stroke-width="2" />
          <text x="480" y="462" text-anchor="middle" class="node-title">GBDT / XGBoost</text>
          <text x="480" y="492" text-anchor="middle" class="node-badge">Boosting 梯度残差</text>
        </g>

        <!-- 第 1 步：元特征空间 S -->
        <g id="meta-feature-layer">
          <path d="M 570 120 C 640 120, 660 210, 720 210" fill="none" stroke="var(--model)" stroke-width="2" marker-end="url(#arr-model)" />
          <path d="M 570 295 L 720 295" fill="none" stroke="var(--model)" stroke-width="2" marker-end="url(#arr-model)" />
          <path d="M 570 470 C 640 470, 660 380, 720 380" fill="none" stroke="var(--model)" stroke-width="2" marker-end="url(#arr-model)" />

          <rect x="720" y="160" width="200" height="270" rx="4" fill="none" stroke="var(--model)" stroke-width="2" />
          <text x="820" y="202" text-anchor="middle" class="node-title">元特征矩阵 S</text>

          <rect x="745" y="230" width="44" height="115" fill="none" stroke="var(--model)" stroke-width="1.5" />
          <text x="767" y="275" text-anchor="middle" class="node-badge">ŷ₁</text>
          <text x="767" y="300" text-anchor="middle" class="node-sub">RF</text>

          <rect x="798" y="230" width="44" height="115" fill="none" stroke="var(--model)" stroke-width="1.5" />
          <text x="820" y="275" text-anchor="middle" class="node-badge">ŷ₂</text>
          <text x="820" y="300" text-anchor="middle" class="node-sub">SVM</text>

          <rect x="851" y="230" width="44" height="115" fill="none" stroke="var(--model)" stroke-width="1.5" />
          <text x="873" y="275" text-anchor="middle" class="node-badge">ŷ₃</text>
          <text x="873" y="300" text-anchor="middle" class="node-sub">GBDT</text>

          <text x="820" y="380" text-anchor="middle" class="node-sub">S = [ŷ₁ ŷ₂ ŷ₃] ∈ ℝⁿˣ³</text>
          <text x="820" y="405" text-anchor="middle" class="node-sub">保留原真实标签 y</text>
        </g>

        <!-- 第 2 步：元学习器与最终输出 -->
        <g id="meta-learner-layer">
          <path d="M 920 295 L 1060 295" fill="none" stroke="var(--focus)" stroke-width="4" marker-end="url(#arr-focus)" />

          <rect x="1060" y="230" width="220" height="130" rx="4" fill="none" stroke="var(--focus)" stroke-width="3" />
          <text x="1170" y="275" text-anchor="middle" class="node-title">元学习器</text>
          <text x="1170" y="305" text-anchor="middle" class="node-meta">逻辑回归 / 线性加权</text>
          <text x="1170" y="335" text-anchor="middle" class="node-sub">学习最优仲裁权值</text>

          <path d="M 1280 295 L 1400 295" fill="none" stroke="var(--focus)" stroke-width="4" marker-end="url(#arr-focus)" />
          <text x="1350" y="270" text-anchor="middle" class="node-meta">ŷ_final</text>
          <text x="1350" y="330" text-anchor="middle" class="node-sub">集成预测</text>
        </g>
      </svg>
    </div>

    <aside class="notes" hidden>
      Stacking 堆叠泛化采用两层架构：第一层并行训练若干异构基学习器，如随机森林、SVM 与 GBDT，它们从各自的假设空间提取互补信息。
      基模型在训练集上的预测输出拼接成元特征矩阵 S，保留原始样本标签 y。
      第二层元学习器（通常为简单的逻辑回归或岭回归）在上层拟合元特征矩阵，自动学习最优的仲裁与组合权重，收束输出最终决策。
    </aside>
  </div>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 21, total: 25 });
  </script>
</body>
</html>
