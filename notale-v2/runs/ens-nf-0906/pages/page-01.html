<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
    }

    .cover-layout {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }

    .header-block {
      max-width: 820px;
      margin-top: 50px;
    }

    .eyebrow {
      font-size: var(--fs-sec);
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .main-title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      font-weight: 700;
      color: var(--text);
      margin: 0 0 16px 0;
      letter-spacing: -0.01em;
    }

    .subtitle {
      font-size: var(--fs-h2);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
    }

    .footer-block {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      border-top: 1px solid var(--rule);
      padding-top: 18px;
      margin-bottom: 28px;
    }

    .mechanism-note {
      font-size: var(--fs-sec);
      color: var(--muted);
      max-width: 720px;
      line-height: var(--lh-copy);
    }

    .mechanism-note strong {
      color: var(--text);
      font-weight: 600;
    }

    .convergence-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: var(--fs-sec);
      color: var(--model);
      font-weight: 500;
    }

    .convergence-indicator::before {
      content: "";
      display: inline-block;
      width: 28px;
      height: var(--stroke-strong);
      background: var(--model);
    }
  </style>
</head>
<body data-page="01" data-total="32">
  <div id="stage">
    <canvas id="stream-canvas" class="cv-fill"></canvas>

    <div class="cover-layout">
      <div class="header-block">
        <div class="eyebrow">机器学习概论 · 第八讲</div>
        <h1 class="main-title">集成学习</h1>
        <p class="subtitle">弱学习器的多样性汇聚与方差偏差权衡</p>
      </div>

      <div class="footer-block">
        <div class="mechanism-note">
          <strong>核心思想：</strong>单模型易受方差或偏差制约；组合具有多样性的弱学习器，可获得更低泛化误差。
        </div>
        <div class="convergence-indicator">
          决策收束
        </div>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    各位同学好，今天我们进入机器学习概论的第八讲：集成学习。
    在之前的课程里，我们学习了决策树、支持向量机、线性模型等单一分类器。
    实际应用中，单模型的表现常常受限于高方差（过拟合）或高偏差（欠拟合）。
    集成学习的核心哲学在于：组合多个基学习器，使群体的预测能力显著优于任意单个成员。
    在接下来的两小时里，我们将系统剖析 Bagging、随机森林、Boosting 以及 Stacking 的构造机制与数学本质。
  </aside>

  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      Deck.init({ index: 1, total: 32, keys: false });

      const canvas = document.getElementById("stream-canvas");
      let ctx;
      const SEED = "ensemble-learning-cover-01";
      const STREAM_COUNT = 42;
      let streams = [];
      let stopLoop = () => {};

      // 汇聚目标：从左侧不同高度分散出发，向右侧中下部汇聚为一个强力输出通道
      // 视觉签名：多条等重蓝色预测路径在结论前收束为一条粗线，贯穿全套并直接解释“集成”
      const TARGET_X = 1450;
      const TARGET_Y = 560;

      // 标题排斥区：在标题左上角不穿透粒子和主连线
      const TITLE_ZONE = { x: 0, y: 0, w: 480, h: 260 };

      function initStreams() {
        const rng = new Math.seedrandom(SEED);
        streams = [];

        for (let i = 0; i < STREAM_COUNT; i++) {
          // 左侧分散起始，避开标题左上角密集区
          const startY = 240 + rng() * 580;
          const startX = -20 - rng() * 120;
          
          // 控制点 1: 在左侧中段展开，展现多样性 (diversity)
          const cp1X = 320 + rng() * 280;
          const cp1Y = startY + (rng() - 0.5) * 180;

          // 控制点 2: 开始向右侧收拢 (combination)
          const cp2X = 880 + rng() * 260;
          const cp2Y = 520 + (rng() - 0.5) * 160;

          // 收束点：略微有紧密汇集的小抖动
          const endX = TARGET_X;
          const endY = TARGET_Y + (rng() - 0.5) * 14;

          // 粒子速度与相位
          const speed = 0.00035 + rng() * 0.00045;
          const phase = rng();
          const lineWidth = 1.2 + rng() * 1.6;
          const alpha = 0.18 + rng() * 0.28;

          streams.push({
            startX, startY,
            cp1X, cp1Y,
            cp2X, cp2Y,
            endX, endY,
            speed,
            phase,
            lineWidth,
            alpha,
            nodeCount: 3 + Math.floor(rng() * 4)
          });
        }
      }

      function getBezierPoint(t, p0, p1, p2, p3) {
        const u = 1 - t;
        const tt = t * t;
        const uu = u * u;
        const uuu = uu * u;
        const ttt = tt * t;

        return {
          x: uuu * p0.x + 3 * uu * t * p1.x + 3 * u * tt * p2.x + ttt * p3.x,
          y: uuu * p0.y + 3 * uu * t * p1.y + 3 * u * tt * p2.y + ttt * p3.y
        };
      }

      function drawStaticSystem(context) {
        const modelRgb = Deck.rgb("model") || [23, 98, 142];
        const focusRgb = Deck.rgb("focus") || [184, 61, 11];

        // 绘制基学习器的流动路径（多条细蓝线）
        streams.forEach(s => {
          context.beginPath();
          context.moveTo(s.startX, s.startY);
          context.bezierCurveTo(s.cp1X, s.cp1Y, s.cp2X, s.cp2Y, s.endX, s.endY);
          context.strokeStyle = `rgba(${modelRgb[0]}, ${modelRgb[1]}, ${modelRgb[2]}, ${s.alpha})`;
          context.lineWidth = s.lineWidth;
          context.lineCap = "round";
          context.stroke();
        });

        // 汇聚后的强大输出线（粗线收束延伸）
        context.beginPath();
        context.moveTo(TARGET_X - 60, TARGET_Y);
        context.lineTo(1620, TARGET_Y);
        context.strokeStyle = `rgba(${modelRgb[0]}, ${modelRgb[1]}, ${modelRgb[2]}, 0.85)`;
        context.lineWidth = 5;
        context.stroke();

        // 汇聚中心外圈与内核心
        context.beginPath();
        context.arc(TARGET_X, TARGET_Y, 7, 0, Math.PI * 2);
        context.fillStyle = `rgba(${focusRgb[0]}, ${focusRgb[1]}, ${focusRgb[2]}, 0.95)`;
        context.fill();

        context.beginPath();
        context.arc(TARGET_X, TARGET_Y, 18, 0, Math.PI * 2);
        context.strokeStyle = `rgba(${modelRgb[0]}, ${modelRgb[1]}, ${modelRgb[2]}, 0.45)`;
        context.lineWidth = 1.5;
        context.stroke();
      }

      function drawPulse(context, time) {
        const modelRgb = Deck.rgb("model") || [23, 98, 142];
        const focusRgb = Deck.rgb("focus") || [184, 61, 11];

        streams.forEach((s, idx) => {
          const t = (s.phase + time * s.speed) % 1;
          const p0 = { x: s.startX, y: s.startY };
          const p1 = { x: s.cp1X, y: s.cp1Y };
          const p2 = { x: s.cp2X, y: s.cp2Y };
          const p3 = { x: s.endX, y: s.endY };

          const pt = getBezierPoint(t, p0, p1, p2, p3);

          context.beginPath();
          // 挑选前两条使用 focus 强调色模拟关键反例/高权重样本
          if (idx === 0 || idx === 1) {
            context.arc(pt.x, pt.y, 3.2, 0, Math.PI * 2);
            context.fillStyle = `rgba(${focusRgb[0]}, ${focusRgb[1]}, ${focusRgb[2]}, 0.9)`;
          } else {
            context.arc(pt.x, pt.y, 2.2, 0, Math.PI * 2);
            context.fillStyle = `rgba(${modelRgb[0]}, ${modelRgb[1]}, ${modelRgb[2]}, 0.75)`;
          }
          context.fill();
        });
      }

      function render(time) {
        if (!ctx) return;
        ctx.clearRect(0, 0, 1600, 900);
        drawStaticSystem(ctx);
        drawPulse(ctx, time);
      }

      function setup() {
        ctx = Deck.fit(canvas);
        initStreams();
        stopLoop();
        stopLoop = Deck.loop(render, { still: 2000 });
      }

      setup();
      Deck.onResize(setup);
    })();
  </script>
</body>
</html>
