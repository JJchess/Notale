<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #E8EEF1;
      --text: #142630;
      --font-sans: "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
    }

    #stage {
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      position: relative;
    }

    .cover-copy {
      position: absolute;
      left: 104px;
      top: 220px;
      z-index: 10;
      max-width: 500px;
      pointer-events: none;
    }

    .section-kicker {
      font-size: var(--fs-label);
      font-weight: 700;
      color: var(--model);
      letter-spacing: 0.14em;
      margin-bottom: 24px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 54px;
      font-weight: 700;
      line-height: var(--lh-tight);
      letter-spacing: -0.02em;
      color: var(--text);
      margin: 0 0 24px 0;
    }

    .cover-lead {
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
      max-width: 520px;
    }

    .scene-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* SVG 标注与样式 */
    .axis-line { stroke: var(--rule); stroke-width: 1.5px; }
    .tick-label {
      font-family: var(--font-sans);
      font-size: var(--fs-tick);
      fill: var(--rule);
      text-anchor: middle;
    }
    .comp-label {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      fill: var(--muted);
      font-weight: 500;
    }
    .comp-label.model-hl {
      fill: var(--model);
      font-weight: 700;
    }
    .comp-label.focus-hl {
      fill: var(--focus);
      font-weight: 700;
    }

    /* 路径动画与层级 */
    .base-path {
      stroke: var(--model);
      stroke-width: var(--stroke);
      fill: none;
      opacity: 0.45;
    }
    .ensemble-path {
      stroke: var(--model);
      stroke-width: var(--stroke-strong);
      fill: none;
    }

    /* 讲稿 */
    aside.notes { display: none; }
  </style>
</head>
<body data-page="03" data-total="32">
  <div id="stage">
    <header class="cover-copy">
      <h1>从单模型<br>到集成模型</h1>
      <p class="cover-lead">以个体模型的局限为出发点，探究多个弱预测器如何通过差异与协同汇聚为高精度判决。</p>
    </header>

    <svg class="scene-svg" viewBox="0 0 1600 900" aria-hidden="true">
      <defs>
        <!-- 决策汇聚区标记微光 -->
        <linearGradient id="converge-grad" x1="1100" y1="0" x2="1480" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#17628E" stop-opacity="0.05" />
          <stop offset="100%" stop-color="#17628E" stop-opacity="0.16" />
        </linearGradient>
      </defs>

      <!-- 背景架构：左右两栏教学结构网格参考线 -->
      <g opacity="0.6">
        <line x1="680" y1="120" x2="680" y2="780" stroke="var(--rule)" stroke-width="1" stroke-dasharray="4 6" />
        <line x1="680" y1="450" x2="1500" y2="450" stroke="var(--rule)" stroke-width="1" stroke-dasharray="2 4" />
      </g>

      <!-- 汇聚区背景衬底（微弱几何） -->
      <rect x="1140" y="240" width="340" height="420" rx="12" fill="url(#converge-grad)" />

      <!-- 左侧起点：单一输入特征点 x -->
      <circle cx="750" cy="450" r="6" fill="var(--text)" />
      <text x="750" y="485" class="comp-label" text-anchor="middle">输入样本 x</text>

      <!-- 单模型分界线与波动路径对比 -->
      <!-- 单模型路径：一条波动大且在某处偏离的细线 -->
      <g>
        <!-- 单模型分支标签 -->
        <text x="820" y="210" class="comp-label">基学习器阵列（差异性假设）</text>
        <text x="1260" y="210" class="comp-label focus-hl">集成决策 h(x)</text>

        <!-- 5条分散的基学习器曲线 (贝塞尔连接)，到达中间点，带有各自误差波动 -->
        <!-- Model 1 (偏高) -->
        <path d="M 750 450 C 850 450, 890 280, 1020 280 C 1090 280, 1140 430, 1260 450" class="base-path" />
        <circle cx="1020" cy="280" r="4" fill="var(--model)" />
        <text x="1035" y="285" class="comp-label" font-size="13">h₁(x)</text>

        <!-- Model 2 (偏低) -->
        <path d="M 750 450 C 850 450, 900 620, 1020 620 C 1100 620, 1140 470, 1260 450" class="base-path" />
        <circle cx="1020" cy="620" r="4" fill="var(--model)" />
        <text x="1035" y="625" class="comp-label" font-size="13">h₂(x)</text>

        <!-- Model 3 (中偏上) -->
        <path d="M 750 450 C 860 450, 910 350, 1020 350 C 1110 350, 1150 440, 1260 450" class="base-path" />
        <circle cx="1020" cy="350" r="4" fill="var(--model)" />
        <text x="1035" y="355" class="comp-label" font-size="13">h₃(x)</text>

        <!-- Model 4 (中偏下) -->
        <path d="M 750 450 C 860 450, 910 550, 1020 550 C 1110 550, 1150 460, 1260 450" class="base-path" />
        <circle cx="1020" cy="550" r="4" fill="var(--model)" />
        <text x="1035" y="555" class="comp-label" font-size="13">h₄(x)</text>

        <!-- Model 5 (微偏) -->
        <path d="M 750 450 C 880 450, 930 420, 1020 420 C 1100 420, 1160 448, 1260 450" class="base-path" />
        <circle cx="1020" cy="420" r="4" fill="var(--model)" />
        <text x="1035" y="425" class="comp-label" font-size="13">h₅(x)</text>

        <!-- 关键概念标注：多样性与误差互补 -->
        <path d="M 980 290 L 980 610" stroke="var(--focus)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
        <text x="965" y="455" class="comp-label focus-hl" text-anchor="end" font-size="13">单模型误差分散</text>

        <!-- 汇聚点核心：加粗汇聚实线，象征主题签名 -->
        <circle cx="1260" cy="450" r="7" fill="var(--focus)" />
        <path d="M 1260 450 L 1440 450" class="ensemble-path" />
        <polygon points="1440,444 1455,450 1440,456" fill="var(--model)" />

        <text x="1350" y="430" class="comp-label model-hl" text-anchor="middle">方差抵消 · 精度提升</text>
        <text x="1260" y="485" class="comp-label" text-anchor="middle">组合策略聚合</text>
      </g>

      <!-- 底部对比标注：单模型困境 vs 集成解法 -->
      <g transform="translate(720, 720)">
        <circle cx="10" cy="0" r="4" fill="var(--rule)" />
        <text x="24" y="5" class="comp-label" font-size="13">单个弱学习器：泛化边界脆弱，受噪声干扰严重</text>
        <circle cx="430" cy="0" r="4" fill="var(--model)" />
        <text x="444" y="5" class="comp-label model-hl" font-size="13">集成决策：通过多样性互补获得更稳定的全局判决</text>
      </g>
    </svg>
  </div>

  <aside class="notes" hidden>
    同学们好，今天我们正式进入第二单元：集成学习的核心范式。
    回顾此前学过的单一分类器或回归器，无论决策树还是线性模型，单独使用时都容易面临欠拟合或过拟合的困境。
    从这一讲开始，我们的视角将从“训练一个完美模型”转向“组织一组各有所长的模型”。
    请看右侧图解：五个基学习器各自产生偏差，但只要它们彼此存在差异，通过合理投票或平均机制汇聚后，单一误差就会相互抵消，从而输出更具鲁棒性的最终决策。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 3, total: 32, keys: false });
  </script>
</body>
</html>
