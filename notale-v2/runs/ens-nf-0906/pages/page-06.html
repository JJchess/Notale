<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #E8EEF1;
      --text: #142630;
      --muted: #50616B;
      --model: #17628E;
      --focus: #B83D0B;
      --rule: #71828B;
      --font-sans: "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
      --font-display: "Noto Sans CJK SC Medium", "Noto Sans CJK SC", sans-serif;
    }

    #stage {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    /* 顶部标题区 */
    .header-zone {
      position: absolute;
      top: 36px;
      left: 56px;
      right: 56px;
      height: 72px;
    }
    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .subtitle {
      margin-top: 8px;
      font-size: var(--fs-sec);
      color: var(--muted);
      line-height: var(--lh-copy);
    }

    /* 主对比三列画布网格 */
    .compare-grid {
      position: absolute;
      top: 132px;
      left: 56px;
      right: 56px;
      bottom: 40px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 24px;
    }

    .column-panel {
      position: relative;
      background: transparent;
      border-top: 2px solid var(--rule);
      padding: 16px 8px 14px;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .panel-title {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: 600;
      color: var(--text);
    }
    .panel-badge {
      font-size: var(--fs-label);
      color: var(--muted);
    }

    .panel-svg {
      width: 100%;
      height: 100%;
      flex: 1;
    }

    /* 交互切换栏与底部指示 */
    .interactive-dock {
      position: absolute;
      bottom: 34px;
      left: 56px;
      right: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
  </style>
</head>
<body data-page="06" data-total="32">
  <div id="stage">
    <header class="header-zone">
      <h1>组合机制决定如何汇总基模型的独立判断</h1>
      <div class="subtitle">分类看类别标签或概率分布，回归看连续值收敛</div>
    </header>

    <main class="compare-grid">
      <!-- 列 1：多数投票 -->
      <section class="column-panel min0" id="panel-hard">
        <div class="panel-header">
          <span class="panel-title">多数投票</span>
          <span class="panel-badge">硬分类</span>
        </div>
        <svg class="panel-svg" viewBox="0 0 440 580" preserveAspectRatio="xMidYMid meet">
          <!-- 3 个基学习器预测 -->
          <g transform="translate(10, 30)">
            <!-- h1 -->
            <g transform="translate(0, 0)">
              <rect x="0" y="0" width="136" height="66" rx="4" fill="#ffffff" stroke="var(--model)" stroke-width="2"/>
              <text x="68" y="28" text-anchor="middle" font-size="15" fill="var(--muted)">基模型 h₁</text>
              <text x="68" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--model)">类别 A</text>
            </g>
            <!-- h2 -->
            <g transform="translate(0, 115)">
              <rect x="0" y="0" width="136" height="66" rx="4" fill="#ffffff" stroke="var(--model)" stroke-width="2"/>
              <text x="68" y="28" text-anchor="middle" font-size="15" fill="var(--muted)">基模型 h₂</text>
              <text x="68" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--model)">类别 A</text>
            </g>
            <!-- h3 -->
            <g transform="translate(0, 230)">
              <rect x="0" y="0" width="136" height="66" rx="4" fill="#ffffff" stroke="var(--rule)" stroke-width="2"/>
              <text x="68" y="28" text-anchor="middle" font-size="15" fill="var(--muted)">基模型 h₃</text>
              <text x="68" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--muted)">类别 B</text>
            </g>

            <!-- 汇聚连线 -->
            <path d="M 136 33 C 195 33, 215 135, 275 135" fill="none" stroke="var(--model)" stroke-width="2"/>
            <path d="M 136 148 C 195 148, 215 148, 275 148" fill="none" stroke="var(--model)" stroke-width="2"/>
            <path d="M 136 263 C 195 263, 215 160, 275 160" fill="none" stroke="var(--rule)" stroke-width="2" stroke-dasharray="4 3"/>

            <!-- 票数统计盒 -->
            <g transform="translate(275, 102)">
              <rect x="0" y="0" width="145" height="96" rx="4" fill="#ffffff" stroke="var(--rule)" stroke-width="2"/>
              <text x="72" y="28" text-anchor="middle" font-size="15" fill="var(--muted)">各类别得票</text>
              <text x="72" y="56" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--model)">A : 2 票</text>
              <text x="72" y="80" text-anchor="middle" font-size="15" fill="var(--muted)">B : 1 票</text>
            </g>

            <!-- 粗收束箭头向下汇总 (主题签名：粗汇聚线) -->
            <path d="M 347 198 L 347 305" fill="none" stroke="var(--model)" stroke-width="4"/>
            <polygon points="347,314 340,302 354,302" fill="var(--model)"/>

            <!-- 最终输出节点 -->
            <g transform="translate(262, 318)">
              <rect x="0" y="0" width="170" height="78" rx="4" fill="#ffffff" stroke="var(--focus)" stroke-width="2"/>
              <text x="85" y="28" text-anchor="middle" font-size="15" fill="var(--focus)">多数决</text>
              <text x="85" y="58" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)">类别 A</text>
            </g>
          </g>
          <!-- 底部说明 -->
          <text x="220" y="475" text-anchor="middle" font-size="16" fill="var(--muted)">少数服从多数：仅依据类别计数</text>
        </svg>
      </section>

      <!-- 列 2：软投票 -->
      <section class="column-panel min0" id="panel-soft">
        <div class="panel-header">
          <span class="panel-title">软投票</span>
          <span class="panel-badge">概率均值</span>
        </div>
        <svg class="panel-svg" viewBox="0 0 440 580" preserveAspectRatio="xMidYMid meet">
          <g transform="translate(10, 30)">
            <!-- h1 -->
            <g transform="translate(0, 0)">
              <rect x="0" y="0" width="136" height="66" rx="4" fill="#ffffff" stroke="var(--model)" stroke-width="2"/>
              <text x="68" y="28" text-anchor="middle" font-size="15" fill="var(--muted)">基模型 h₁</text>
              <text x="68" y="52" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--model)">P(A)=0.90</text>
            </g>
            <!-- h2 -->
            <g transform="translate(0, 115)">
              <rect x="0" y="0" width="136" height="66" rx="4" fill="#ffffff" stroke="var(--model)" stroke-width="2"/>
              <text x="68" y="28" text-anchor="middle" font-size="15" fill="var(--muted)">基模型 h₂</text>
              <text x="68" y="52" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--model)">P(A)=0.55</text>
            </g>
            <!-- h3 -->
            <g transform="translate(0, 230)">
              <rect x="0" y="0" width="136" height="66" rx="4" fill="#ffffff" stroke="var(--rule)" stroke-width="2"/>
              <text x="68" y="28" text-anchor="middle" font-size="15" fill="var(--muted)">基模型 h₃</text>
              <text x="68" y="52" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--muted)">P(A)=0.20</text>
            </g>

            <!-- 汇聚连线 -->
            <path d="M 136 33 C 195 33, 215 135, 275 135" fill="none" stroke="var(--model)" stroke-width="2"/>
            <path d="M 136 148 C 195 148, 215 148, 275 148" fill="none" stroke="var(--model)" stroke-width="2"/>
            <path d="M 136 263 C 195 263, 215 160, 275 160" fill="none" stroke="var(--model)" stroke-width="2"/>

            <!-- 概率均值计算盒 -->
            <g transform="translate(275, 102)">
              <rect x="0" y="0" width="145" height="96" rx="4" fill="#ffffff" stroke="var(--rule)" stroke-width="2"/>
              <text x="72" y="28" text-anchor="middle" font-size="15" fill="var(--muted)">均值计算</text>
              <text x="72" y="56" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--model)">P(A) = 0.55</text>
              <text x="72" y="80" text-anchor="middle" font-size="13" fill="var(--muted)">(0.9+0.55+0.2)/3</text>
            </g>

            <!-- 粗收束箭头向下汇总 -->
            <path d="M 347 198 L 347 305" fill="none" stroke="var(--model)" stroke-width="4"/>
            <polygon points="347,314 340,302 354,302" fill="var(--model)"/>

            <!-- 最终输出节点 -->
            <g transform="translate(262, 318)">
              <rect x="0" y="0" width="170" height="78" rx="4" fill="#ffffff" stroke="var(--focus)" stroke-width="2"/>
              <text x="85" y="28" text-anchor="middle" font-size="15" fill="var(--focus)">高置信保留</text>
              <text x="85" y="58" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)">类别 A</text>
            </g>
          </g>
          <!-- 底部说明 -->
          <text x="220" y="475" text-anchor="middle" font-size="16" fill="var(--muted)">置信度加权：避免弱分类平分权重</text>
        </svg>
      </section>

      <!-- 列 3：简单与加权平均 -->
      <section class="column-panel min0" id="panel-avg">
        <div class="panel-header">
          <span class="panel-title">平均预测</span>
          <span class="panel-badge">连续回归</span>
        </div>
        <svg class="panel-svg" viewBox="0 0 440 580" preserveAspectRatio="xMidYMid meet">
          <g transform="translate(10, 30)">
            <!-- h1 -->
            <g transform="translate(0, 0)">
              <rect x="0" y="0" width="136" height="66" rx="4" fill="#ffffff" stroke="var(--model)" stroke-width="2"/>
              <text x="68" y="28" text-anchor="middle" font-size="15" fill="var(--muted)">基模型 h₁</text>
              <text x="68" y="52" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--model)">ŷ₁ = 28.5</text>
            </g>
            <!-- h2 -->
            <g transform="translate(0, 115)">
              <rect x="0" y="0" width="136" height="66" rx="4" fill="#ffffff" stroke="var(--model)" stroke-width="2"/>
              <text x="68" y="28" text-anchor="middle" font-size="15" fill="var(--muted)">基模型 h₂</text>
              <text x="68" y="52" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--model)">ŷ₂ = 31.0</text>
            </g>
            <!-- h3 -->
            <g transform="translate(0, 230)">
              <rect x="0" y="0" width="136" height="66" rx="4" fill="#ffffff" stroke="var(--model)" stroke-width="2"/>
              <text x="68" y="28" text-anchor="middle" font-size="15" fill="var(--muted)">基模型 h₃</text>
              <text x="68" y="52" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--model)">ŷ₃ = 29.3</text>
            </g>

            <!-- 汇聚连线 -->
            <path d="M 136 33 C 195 33, 215 135, 275 135" fill="none" stroke="var(--model)" stroke-width="2"/>
            <path d="M 136 148 C 195 148, 215 148, 275 148" fill="none" stroke="var(--model)" stroke-width="2"/>
            <path d="M 136 263 C 195 263, 215 160, 275 160" fill="none" stroke="var(--model)" stroke-width="2"/>

            <!-- 均值计算盒 -->
            <g transform="translate(275, 102)">
              <rect x="0" y="0" width="145" height="96" rx="4" fill="#ffffff" stroke="var(--rule)" stroke-width="2"/>
              <text x="72" y="28" text-anchor="middle" font-size="15" fill="var(--muted)">连续输出求均值</text>
              <text x="72" y="56" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--model)">ŷ = Σ wᵢ · ŷᵢ</text>
              <text x="72" y="80" text-anchor="middle" font-size="13" fill="var(--muted)">等权或依表现加权</text>
            </g>

            <!-- 粗收束箭头向下汇总 -->
            <path d="M 347 198 L 347 305" fill="none" stroke="var(--model)" stroke-width="4"/>
            <polygon points="347,314 340,302 354,302" fill="var(--model)"/>

            <!-- 最终输出节点 -->
            <g transform="translate(262, 318)">
              <rect x="0" y="0" width="170" height="78" rx="4" fill="#ffffff" stroke="var(--focus)" stroke-width="2"/>
              <text x="85" y="28" text-anchor="middle" font-size="15" fill="var(--focus)">方差平滑</text>
              <text x="85" y="58" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)">ŷ = 29.6</text>
            </g>
          </g>
          <!-- 底部说明 -->
          <text x="220" y="475" text-anchor="middle" font-size="16" fill="var(--muted)">抵消随机误差：多点输出降低方差</text>
        </svg>
      </section>
    </main>
  </div>

  <aside class="notes" hidden>
    在集成学习中，训练好多个基学习器之后，怎样把它们的输出汇总为一个最终决策？这取决于任务类型和基学习器提供的信息。
    对于分类任务，最直接的是多数投票，即每个模型给出一个确定的类别标签，得票多者胜出。但这会丢失模型对预测结果的置信度。
    软投票则利用每个模型输出的后验概率进行加权平均，让高确信度的判断有更大话语权，通常比硬投票表现更优。
    对于回归任务，我们通常采用简单平均或加权平均，利用多个独立误差的相互抵消来降低预测方差。
  </aside>

  </script>
</body>
</html>
