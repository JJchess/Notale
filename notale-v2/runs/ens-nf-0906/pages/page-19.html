<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #E8EEF1;
      --text: #142630;
      --font-sans: "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--pad-y) var(--pad-x);
    }

    #field-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .cover-content {
      position: absolute;
      left: 110px;
      top: 180px;
      width: 620px;
      z-index: 3;
      pointer-events: none;
    }

    .chapter-tag {
      font-size: var(--fs-sec);
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--focus);
      margin: 0 0 20px 0;
      text-transform: uppercase;
    }

    .cover-title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin: 0 0 24px 0;
    }

    .cover-desc {
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
      max-width: 520px;
    }

    .stage-legend {
      position: absolute;
      left: 110px;
      bottom: 76px;
      z-index: 3;
      display: flex;
      gap: 36px;
      align-items: center;
      font-size: var(--fs-sec);
      color: var(--muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .legend-line {
      width: 28px;
      height: 2px;
      background: var(--model);
      opacity: 0.45;
    }

    .legend-line.focus {
      background: var(--focus);
      height: 3px;
      opacity: 1;
    }

    .legend-line.final {
      background: var(--model);
      height: 4px;
      opacity: 1;
    }
  </style>
</head>
<body data-page="19" data-total="32">
  <div id="stage">
    <canvas id="field-canvas" class="cv-fill"></canvas>

    <header class="cover-content">
      <p class="chapter-tag">第 04 单元 · 串行提升</p>
      <h1 class="cover-title">Boosting<br>串行纠错降低误差</h1>
      <p class="cover-desc">每一轮弱学习器专门拟合上一轮留下的残差，将弱预测逐步校正为强预测。</p>
    </header>

    <div class="stage-legend">
      <div class="legend-item">
        <span class="legend-line"></span>
        <span>阶段基学习器</span>
      </div>
      <div class="legend-item">
        <span class="legend-line focus"></span>
        <span>当前重点纠错样本</span>
      </div>
      <div class="legend-item">
        <span class="legend-line final"></span>
        <span>收束强学习器</span>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    第四单元我们探讨 Boosting 提升方法。与 Bagging 的独立并行不同，Boosting 采用严格的串行机制。
    前一轮模型犯错的样本会被赋予更高的关注或直接作为残差目标，后续学习器专攻这些未解难点，
    最终多轮弱学习器累加收束为高精度的强学习器。
  </aside>

  <script src="assets/base.js"></script>
  <script src="assets/lib/seedrandom.min.js"></script>
  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("field-canvas");
      const ctx = Deck.fit(canvas);
      if (!ctx) return;

      const W = 1600;
      const H = 900;
      const rng = new Math.seedrandom("boosting-flow-seed-88");

      // 样本点生成：模拟在右半部空间的分类边界纠错点
      // 右侧主要区域：x: 780 ~ 1480, y: 140 ~ 760
      const STAGES = 4; // t=1, 2, 3, 4 阶段
      const STAGE_X = [840, 1020, 1200, 1380];
      const SAMPLE_COUNT = 32;

      // 预先生成一组样本的初始难易度和目标
      const samples = [];
      for (let i = 0; i < SAMPLE_COUNT; i++) {
        const baseY = 200 + rng() * 500;
        const difficulty = rng(); // 越难，前几轮越容易被误判
        const isErrorFocus = difficulty > 0.68;
        samples.push({
          id: i,
          baseY,
          difficulty,
          isErrorFocus
        });
      }

      // 计算每个样本在各个阶段的残差与轨迹
      // 随着 stage 推进，轨迹从松散振荡逐渐纠偏收敛到右侧汇聚线
      const paths = samples.map(s => {
        const pts = [];
        // 起点在 stage 1 左侧一点 (x = 740)
        let curY = s.baseY + (s.difficulty - 0.5) * 160;
        pts.push({ x: 740, y: curY });

        for (let st = 0; st < STAGES; st++) {
          const sx = STAGE_X[st];
          // 逐轮纠偏：向真实中心收束，但是难样本在前两轮有明显的纠错拐折
          const targetY = s.baseY;
          const correctionRate = 0.35 + st * 0.22;
          // 加点确定性扰动
          const noise = (rng() - 0.5) * (60 / (st + 1));
          curY = Deck.lerp(curY, targetY, correctionRate) + noise;
          pts.push({ x: sx, y: curY });
        }

        // 最终收束到右侧汇聚点 (x = 1500)
        const finalY = s.baseY;
        pts.push({ x: 1500, y: finalY });
        return {
          sample: s,
          points: pts
        };
      });

      // 主题颜色
      const colBg = Deck.rgb("bg") || [232, 238, 241];
      const colModel = Deck.rgb("model") || [23, 98, 142];
      const colFocus = Deck.rgb("focus") || [184, 61, 11];
      const colRule = Deck.rgb("rule") || [113, 130, 139];
      const colMuted = Deck.rgb("muted") || [80, 97, 107];

      function render(time) {
        ctx.clearRect(0, 0, W, H);

        // 1. 绘制阶段竖直基线与阶段标尺
        STAGE_X.forEach((sx, idx) => {
          ctx.beginPath();
          ctx.setLineDash([4, 6]);
          ctx.moveTo(sx, 130);
          ctx.lineTo(sx, 770);
          ctx.strokeStyle = `rgba(${colRule.join(",")}, 0.35)`;
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.setLineDash([]);

          // 阶段标签
          ctx.font = "600 15px var(--font-sans)";
          ctx.fillStyle = `rgba(${colRule.join(",")}, 0.95)`;
          ctx.textAlign = "center";
          ctx.fillText(`Round ${idx + 1}`, sx, 108);
          ctx.font = "14px var(--font-sans)";
          ctx.fillStyle = `rgba(${colMuted.join(",")}, 0.85)`;
          ctx.fillText(idx === 3 ? "加权强组合" : "拟合残差", sx, 804);
        });

        // 2. 绘制从松散到收束的提升轨迹
        paths.forEach(p => {
          const isFocus = p.sample.isErrorFocus;
          const pts = p.points;

          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) {
            const prev = pts[i - 1];
            const curr = pts[i];
            const cpx = (prev.x + curr.x) / 2;
            ctx.bezierCurveTo(cpx, prev.y, cpx, curr.y, curr.x, curr.y);
          }

          if (isFocus) {
            ctx.strokeStyle = `rgba(${colFocus.join(",")}, 0.65)`;
            ctx.lineWidth = 2.4;
          } else {
            ctx.strokeStyle = `rgba(${colModel.join(",")}, 0.28)`;
            ctx.lineWidth = 1.4;
          }
          ctx.stroke();

          // 在各轮节点上画点
          for (let i = 1; i <= STAGES; i++) {
            const pt = pts[i];
            ctx.beginPath();
            if (isFocus && (i === 1 || i === 2)) {
              // 被聚焦的误差样本，前两轮高亮
              ctx.arc(pt.x, pt.y, 4.2, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(${colFocus.join(",")}, 0.9)`;
            } else {
              ctx.arc(pt.x, pt.y, 2.2, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(${colModel.join(",")}, 0.5)`;
            }
            ctx.fill();
          }
        });

        // 3. 最终在右端（x: 1500）收束的加粗强学习器线
        ctx.beginPath();
        ctx.moveTo(1500, 220);
        ctx.lineTo(1500, 700);
        ctx.strokeStyle = `rgba(${colModel.join(",")}, 0.85)`;
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.font = "700 15px var(--font-sans)";
        ctx.fillStyle = `rgba(${colModel.join(",")}, 0.95)`;
        ctx.textAlign = "center";
        ctx.fillText("强分类器 H(x)", 1500, 734);

        // 4. 微妙的动态光点流动（沿几条典型纠错路径滑动）
        const sampleTracer = paths.filter(p => p.sample.isErrorFocus).slice(0, 3);
        sampleTracer.forEach((p, tIdx) => {
          const period = 5000 + tIdx * 1200;
          const progress = ((time || 0) % period) / period;
          // 取进度对应的位置
          const totalSegments = p.points.length - 1;
          const segFloat = progress * totalSegments;
          const segIdx = Math.floor(segFloat);
          const segT = segFloat - segIdx;
          if (segIdx < totalSegments) {
            const p0 = p.points[segIdx];
            const p1 = p.points[segIdx + 1];
            const px = Deck.lerp(p0.x, p1.x, segT);
            const py = Deck.lerp(p0.y, p1.y, segT);

            ctx.beginPath();
            ctx.arc(px, py, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${colFocus.join(",")}, 0.95)`;
            ctx.fill();
          }
        });
      }

      render(0);

      Deck.loop(time => {
        render(time);
      }, { still: 1600 });
    })();
  </script>
</body>
</html>
