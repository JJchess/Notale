<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #E8EEF1;
      --text: #142630;
      --font-sans: "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
    }

    #stage {
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      background-color: var(--bg);
      overflow: hidden;
      position: relative;
    }

    .cover-copy {
      position: absolute;
      left: var(--pad-x);
      top: 130px;
      z-index: 10;
      pointer-events: none;
      max-width: 580px;
    }

    .chapter-tag {
      font-size: var(--fs-label);
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--focus);
      margin-bottom: 20px;
      display: block;
    }

    .cover-title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      color: var(--text);
      letter-spacing: -0.02em;
      margin: 0 0 20px 0;
      font-weight: 700;
    }

    .cover-lead {
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
      max-width: 540px;
    }

    .scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* 蓝图网格与坐标参考 */
    .grid-line {
      stroke: var(--rule);
      stroke-width: 1px;
      stroke-dasharray: 3 6;
      opacity: 0.45;
    }

    /* 异质路径 */
    .stream-path {
      fill: none;
      stroke: var(--model);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .meta-path {
      fill: none;
      stroke: var(--focus);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .node-base {
      fill: var(--bg);
      stroke: var(--model);
      stroke-width: var(--stroke);
    }

    .node-meta {
      fill: var(--focus);
      stroke: var(--bg);
      stroke-width: 3px;
    }

    .node-text {
      font-size: var(--fs-label);
      font-family: var(--font-sans);
      font-weight: 500;
      fill: var(--text);
      text-anchor: start;
      dominant-baseline: central;
    }

    .node-sub {
      font-size: var(--fs-tick);
      fill: var(--muted);
      text-anchor: start;
      dominant-baseline: central;
    }

    .meta-text {
      font-size: var(--fs-label);
      font-family: var(--font-display);
      font-weight: 700;
      fill: var(--focus);
      text-anchor: start;
      dominant-baseline: central;
    }

    .settled .pulse-ring {
      animation: pulse 4s ease-out infinite;
    }

    @keyframes pulse {
      0% { r: 12px; opacity: 0.8; }
      50% { r: 24px; opacity: 0; }
      100% { r: 24px; opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse-ring { animation: none !important; opacity: 0; }
    }
  </style>
</head>
<body data-page="26" data-total="32">
  <main id="stage" class="settled" role="main" aria-labelledby="cover-title">
    <header class="cover-copy">
      <span class="chapter-tag">第六部分 · 拓展与总结</span>
      <h1 id="cover-title" class="cover-title">异质集成与<br>方法选择</h1>
      <p class="cover-lead">打破同质假设：将机理互补的基模型输出转化为新特征，交由元学习器做出最终决策。</p>
    </header>

    <svg class="scene" viewBox="0 0 1600 900" aria-hidden="true">
      <!-- 极弱参考基线与标尺 -->
      <line class="grid-line" x1="720" y1="120" x2="720" y2="780" />
      <line class="grid-line" x1="1120" y1="120" x2="1120" y2="780" />
      <line class="grid-line" x1="680" y1="450" x2="1480" y2="450" />

      <!-- 数据源分流引导线 -->
      <g opacity="0.85">
        <!-- 训练数据输入汇聚点 -->
        <circle cx="680" cy="450" r="4" fill="var(--rule)" />
        <text x="635" y="450" font-size="13px" fill="var(--rule)" text-anchor="end" dominant-baseline="central">原始训练集 D</text>

        <!-- 数据分发到三类基模型 -->
        <path class="stream-path" d="M 680 450 C 740 450, 750 240, 810 240" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
        <path class="stream-path" d="M 680 450 C 750 450, 760 450, 810 450" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
        <path class="stream-path" d="M 680 450 C 740 450, 750 660, 810 660" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
      </g>

      <!-- 三个异质基学习器（树模型、核方法、线性/概率） -->
      <g transform="translate(0, 0)">
        <!-- 模型 1: 树模型 (阶梯特征，高方差拟合强) -->
        <rect class="node-base" x="810" y="212" width="130" height="56" rx="4" />
        <text class="node-text" x="828" y="233">决策树系</text>
        <text class="node-sub" x="828" y="253">非线性阶梯划分</text>

        <!-- 模型 2: 支撑向量 / 神经网络 (光滑边界，空间投影) -->
        <rect class="node-base" x="810" y="422" width="130" height="56" rx="4" />
        <text class="node-text" x="828" y="443">核方法 / SVM</text>
        <text class="node-sub" x="828" y="463">最大间隔与超平面</text>

        <!-- 模型 3: 线性与广义加性模型 (平滑全局趋势) -->
        <rect class="node-base" x="810" y="632" width="130" height="56" rx="4" />
        <text class="node-text" x="828" y="653">广义线性模型</text>
        <text class="node-sub" x="828" y="673">全局线性先验</text>
      </g>

      <!-- 异质模型路径汇聚（体现签名：多条等重蓝色预测收束为一条强路径） -->
      <g>
        <!-- 树模型的预测流折线 -->
        <path class="stream-path" d="M 940 240 L 1020 240 L 1100 390 L 1190 440" stroke-width="2.5" opacity="0.85" />
        <!-- SVM 的预测流曲线 -->
        <path class="stream-path" d="M 940 450 L 1050 450 L 1190 450" stroke-width="2.5" opacity="0.85" />
        <!-- 线性模型的预测流斜线 -->
        <path class="stream-path" d="M 940 660 L 1020 660 L 1100 510 L 1190 460" stroke-width="2.5" opacity="0.85" />

        <!-- 次级特征空间标注 -->
        <text x="1070" y="340" font-size="13px" fill="var(--model)" text-anchor="middle">预测特征 z₁</text>
        <text x="1070" y="435" font-size="13px" fill="var(--model)" text-anchor="middle">预测特征 z₂</text>
        <text x="1070" y="565" font-size="13px" fill="var(--model)" text-anchor="middle">预测特征 z₃</text>
      </g>

      <!-- 元学习器收束节点 (Stacking Meta-Learner) -->
      <g transform="translate(1190, 415)">
        <!-- 脉冲圈与焦点 -->
        <circle class="pulse-ring" cx="35" cy="35" r="16" fill="none" stroke="var(--focus)" stroke-width="2" />
        <rect x="0" y="0" width="150" height="70" rx="6" fill="var(--bg)" stroke="var(--focus)" stroke-width="2.5" />
        <circle class="node-meta" cx="24" cy="35" r="7" />
        <text class="meta-text" x="42" y="27">元学习器</text>
        <text class="node-sub" x="42" y="49">组合最优权重</text>
      </g>

      <!-- 最终输出强路径 -->
      <g>
        <path class="meta-path" d="M 1340 450 L 1460 450" stroke-width="4" />
        <polygon points="1460,443 1476,450 1460,457" fill="var(--focus)" />
        <text x="1410" y="426" font-size="var(--fs-label)" font-family="var(--font-sans)" font-weight="700" fill="var(--focus)" text-anchor="middle">最终决策 ŷ</text>
      </g>
    </svg>
  </main>

  <aside class="notes" hidden>
    各位同学好，进入第六部分，我们要打破前面一直默许的“同质基学习器”假设。
    在真实业务和前沿竞赛中，单一算法往往有其结构性盲区。异质集成（如 Stacking）能够将树模型的高阶交互能力、支持向量机的最大间隔分类能力，以及线性模型的全局稳健性融为一体。
    本章我们将剖析双层学习机制、重点拆解数据泄漏风险，并系统建立集成算法的选型方法论。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 26, total: 32 });
  </script>
</body>
</html>
