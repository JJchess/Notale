<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      background: var(--bg);
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      position: relative;
    }

    /* 标题区域：遵循构图层次与字阶 */
    .title-group {
      position: absolute;
      left: var(--pad-x);
      top: 180px;
      z-index: 10;
      max-width: 580px;
      pointer-events: none;
    }
    .main-title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      color: var(--text);
      letter-spacing: -0.01em;
      margin: 0 0 24px 0;
    }
    .subtitle {
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
      max-width: 500px;
    }

    /* 右侧蓝图式图解 */
    .visual-stage {
      position: absolute;
      right: 56px;
      top: 90px;
      width: 900px;
      height: 720px;
      pointer-events: none;
    }

    /* 阶段指引标签与刻度 */
    .col-title {
      font-size: var(--fs-label);
      font-family: var(--font-display);
      fill: var(--text);
      font-weight: 500;
    }
    .col-sub {
      font-size: var(--fs-tick);
      fill: var(--muted);
    }
    .node-label {
      font-size: var(--fs-label);
      fill: var(--model);
      font-weight: 500;
    }
    .out-label {
      font-size: var(--fs-label);
      font-family: var(--font-display);
      font-weight: 700;
      fill: var(--text);
    }
  </style>
</head>
<body data-page="04" data-total="22">
  <div id="stage">
    <header class="title-group">
      <h1 class="main-title">Bagging 与随机森林</h1>
      <p class="subtitle">通过样本自主重采样与特征随机选择，让多棵高方差决策树在投票中抵消扰动，获得稳健的泛化决策。</p>
    </header>

    <!-- 蓝图式集成签名矢量图 -->
    <svg class="visual-stage" viewBox="0 0 900 720" role="img" aria-label="Bagging 与随机森林架构图解">
      <defs>
        <marker id="arr-m" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#17628E"/>
        </marker>
        <marker id="arr-f" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#17628E"/>
        </marker>
      </defs>

      <!-- 坐标基准虚线 -->
      <g stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 4" opacity="0.45">
        <line x1="75" y1="40" x2="75" y2="680"/>
        <line x1="315" y1="40" x2="315" y2="680"/>
        <line x1="565" y1="40" x2="565" y2="680"/>
        <line x1="815" y1="40" x2="815" y2="680"/>
      </g>

      <!-- 列标题与阶段说明 -->
      <g>
        <text class="col-title" x="75" y="45" text-anchor="middle">原始数据集 D</text>
        <text class="col-sub" x="75" y="66" text-anchor="middle">N 样本 × d 特征</text>

        <text class="col-title" x="315" y="45" text-anchor="middle">Bootstrap 采样</text>
        <text class="col-sub" x="315" y="66" text-anchor="middle">有放回采样与特征扰动</text>

        <text class="col-title" x="565" y="45" text-anchor="middle">基学习器 {T_b}</text>
        <text class="col-sub" x="565" y="66" text-anchor="middle">完全生长决策树</text>

        <text class="col-title" x="815" y="45" text-anchor="middle">多数投票 / 平均</text>
        <text class="col-sub" x="815" y="66" text-anchor="middle">方差缩减与稳健输出</text>
      </g>

      <!-- 原始数据集容器 -->
      <g transform="translate(40, 290)">
        <rect x="0" y="0" width="70" height="140" fill="none" stroke="var(--model)" stroke-width="2" rx="4"/>
        <circle cx="20" cy="25" r="4" fill="var(--model)"/>
        <circle cx="50" cy="30" r="4" fill="var(--focus)"/>
        <circle cx="25" cy="60" r="4" fill="var(--model)"/>
        <circle cx="48" cy="70" r="4" fill="var(--model)"/>
        <circle cx="22" cy="98" r="4" fill="var(--focus)"/>
        <circle cx="50" cy="112" r="4" fill="var(--model)"/>
        <text x="35" y="162" text-anchor="middle" class="col-sub">样本容量 N</text>
      </g>

      <!-- 采样连线：Bootstrap 分流 -->
      <g fill="none" stroke="var(--model)" stroke-width="2" opacity="0.85">
        <path d="M 110 320 C 180 320, 215 170, 275 170" marker-end="url(#arr-m)"/>
        <path d="M 110 360 C 180 360, 215 360, 275 360" marker-end="url(#arr-m)"/>
        <path d="M 110 400 C 180 400, 215 550, 275 550" marker-end="url(#arr-m)"/>
      </g>

      <!-- 3 个采样子集卡片 -->
      <g transform="translate(280, 125)">
        <rect x="0" y="0" width="70" height="90" fill="none" stroke="var(--model)" stroke-width="2" rx="3"/>
        <circle cx="20" cy="24" r="3.5" fill="var(--model)"/>
        <circle cx="50" cy="24" r="3.5" fill="var(--focus)"/>
        <circle cx="20" cy="50" r="3.5" fill="var(--focus)"/>
        <circle cx="50" cy="50" r="3.5" fill="var(--model)"/>
        <circle cx="35" cy="72" r="3.5" fill="var(--model)"/>
        <text x="35" y="108" text-anchor="middle" class="node-label">子集 D₁</text>
      </g>

      <g transform="translate(280, 315)">
        <rect x="0" y="0" width="70" height="90" fill="none" stroke="var(--model)" stroke-width="2" rx="3"/>
        <circle cx="22" cy="24" r="3.5" fill="var(--model)"/>
        <circle cx="48" cy="28" r="3.5" fill="var(--model)"/>
        <circle cx="24" cy="52" r="3.5" fill="var(--focus)"/>
        <circle cx="46" cy="70" r="3.5" fill="var(--focus)"/>
        <text x="35" y="108" text-anchor="middle" class="node-label">子集 D₂</text>
      </g>

      <g transform="translate(280, 505)">
        <rect x="0" y="0" width="70" height="90" fill="none" stroke="var(--model)" stroke-width="2" rx="3"/>
        <circle cx="25" cy="24" r="3.5" fill="var(--focus)"/>
        <circle cx="48" cy="46" r="3.5" fill="var(--model)"/>
        <circle cx="24" cy="68" r="3.5" fill="var(--model)"/>
        <circle cx="48" cy="68" r="3.5" fill="var(--model)"/>
        <text x="35" y="108" text-anchor="middle" class="node-label">子集 D_B</text>
      </g>

      <!-- 子集到树的输入连线 -->
      <g fill="none" stroke="var(--model)" stroke-width="2" opacity="0.85">
        <line x1="350" y1="170" x2="505" y2="170" marker-end="url(#arr-m)"/>
        <line x1="350" y1="360" x2="505" y2="360" marker-end="url(#arr-m)"/>
        <line x1="350" y1="550" x2="505" y2="550" marker-end="url(#arr-m)"/>
      </g>

      <!-- 决策树 1 -->
      <g transform="translate(515, 110)" stroke="var(--model)" stroke-width="2" stroke-linecap="round">
        <line x1="45" y1="15" x2="22" y2="45"/>
        <line x1="45" y1="15" x2="68" y2="45"/>
        <line x1="22" y1="45" x2="10" y2="80"/>
        <line x1="22" y1="45" x2="32" y2="80"/>
        <line x1="68" y1="45" x2="56" y2="80"/>
        <line x1="68" y1="45" x2="80" y2="80"/>
        <circle cx="45" cy="15" r="5" fill="var(--bg)"/>
        <circle cx="22" cy="45" r="4.5" fill="var(--bg)"/>
        <circle cx="68" cy="45" r="4.5" fill="var(--bg)"/>
        <circle cx="10" cy="80" r="3.5" fill="var(--model)"/>
        <circle cx="32" cy="80" r="3.5" fill="var(--model)"/>
        <circle cx="56" cy="80" r="3.5" fill="var(--focus)"/>
        <circle cx="80" cy="80" r="3.5" fill="var(--model)"/>
        <text x="45" y="112" text-anchor="middle" class="node-label" stroke="none">Tree 1</text>
      </g>

      <!-- 决策树 2 -->
      <g transform="translate(515, 300)" stroke="var(--model)" stroke-width="2" stroke-linecap="round">
        <line x1="45" y1="15" x2="22" y2="45"/>
        <line x1="45" y1="15" x2="68" y2="45"/>
        <line x1="22" y1="45" x2="10" y2="80"/>
        <line x1="22" y1="45" x2="34" y2="80"/>
        <line x1="68" y1="45" x2="80" y2="80"/>
        <circle cx="45" cy="15" r="5" fill="var(--bg)"/>
        <circle cx="22" cy="45" r="4.5" fill="var(--bg)"/>
        <circle cx="68" cy="45" r="4.5" fill="var(--bg)"/>
        <circle cx="10" cy="80" r="3.5" fill="var(--focus)"/>
        <circle cx="34" cy="80" r="3.5" fill="var(--model)"/>
        <circle cx="80" cy="80" r="3.5" fill="var(--model)"/>
        <text x="45" y="112" text-anchor="middle" class="node-label" stroke="none">Tree 2</text>
      </g>

      <!-- 省略号 -->
      <circle cx="560" cy="445" r="2.5" fill="var(--muted)"/>
      <circle cx="560" cy="460" r="2.5" fill="var(--muted)"/>
      <circle cx="560" cy="475" r="2.5" fill="var(--muted)"/>

      <!-- 决策树 B -->
      <g transform="translate(515, 490)" stroke="var(--model)" stroke-width="2" stroke-linecap="round">
        <line x1="45" y1="15" x2="22" y2="45"/>
        <line x1="45" y1="15" x2="68" y2="45"/>
        <line x1="22" y1="45" x2="12" y2="80"/>
        <line x1="68" y1="45" x2="56" y2="80"/>
        <line x1="68" y1="45" x2="78" y2="80"/>
        <circle cx="45" cy="15" r="5" fill="var(--bg)"/>
        <circle cx="22" cy="45" r="4.5" fill="var(--bg)"/>
        <circle cx="68" cy="45" r="4.5" fill="var(--bg)"/>
        <circle cx="12" cy="80" r="3.5" fill="var(--model)"/>
        <circle cx="56" cy="80" r="3.5" fill="var(--model)"/>
        <circle cx="78" cy="80" r="3.5" fill="var(--focus)"/>
        <text x="45" y="112" text-anchor="middle" class="node-label" stroke="none">Tree B</text>
      </g>

      <!-- 汇聚阶段：多条 2px 预测连线汇聚到聚合点 -->
      <g fill="none" stroke="var(--model)" stroke-width="2">
        <path d="M 610 170 C 685 170, 715 360, 770 360"/>
        <path d="M 610 360 L 770 360"/>
        <path d="M 610 550 C 685 550, 715 360, 770 360"/>
      </g>

      <!-- 汇聚节点 -->
      <circle cx="770" cy="360" r="7" fill="var(--model)"/>

      <!-- 签名汇聚粗线 4px -->
      <line x1="770" y1="360" x2="860" y2="360" stroke="var(--model)" stroke-width="4" marker-end="url(#arr-f)"/>

      <!-- 最终输出标识 -->
      <g transform="translate(815, 395)">
        <text x="0" y="0" text-anchor="middle" class="out-label">H(x)</text>
        <text x="0" y="18" text-anchor="middle" class="col-sub">集成强预测器</text>
      </g>
    </svg>
  </div>

  <aside class="notes" hidden>
    同学们好，今天我们进入第八讲的第二章：Bagging 与随机森林。
    在前面的偏差-方差分解中我们知道，单棵深度决策树往往具有很低的偏差，但对样本微小变动非常敏感，方差极高。
    Bagging 的核心智慧在于：通过 Bootstrap 有放回采样和特征子集随机扰动，构造出成百上千棵既强大又互有差异的树，最后通过多数投票将随机扰动相互抵消，在保持低偏差的同时大幅削减预测方差。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 4, total: 22, keys: true });
  </script>
</body>
</html>
