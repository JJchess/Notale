<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --c-pos: #17628E;
      --c-neg: #D96528;
    }
    #stage {
      padding: var(--pad-y) var(--pad-x);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--text);
      box-sizing: border-box;
      user-select: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    h1 {
      font-size: var(--fs-h1);
      font-family: var(--font-display);
      margin: 0;
      letter-spacing: -0.01em;
    }
    .kicker {
      font-size: var(--fs-label);
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .workspace {
      display: grid;
      grid-template-columns: 880px 1fr;
      gap: 56px;
      align-items: center;
      margin: 12px 0;
    }

    .view-area {
      position: relative;
      width: 880px;
      height: 640px;
    }
    .canvas-card {
      position: relative;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 4px;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .control-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: var(--fs-body);
      font-family: var(--font-display);
    }
    .control-val {
      font-size: var(--fs-h2);
      color: var(--model);
      font-variant-numeric: tabular-nums;
    }

    .seg-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .btn-seg {
      appearance: none;
      border: 1px solid var(--rule);
      background: transparent;
      padding: 10px 0;
      font-family: var(--font-sans);
      font-size: var(--fs-sec);
      color: var(--text);
      cursor: pointer;
      text-align: center;
      transition: all var(--motion-fast) var(--ease-out);
    }
    .btn-seg:hover {
      border-color: var(--model);
      color: var(--model);
    }
    .btn-seg.active {
      border-color: var(--model);
      background: var(--model);
      color: #fff;
      font-weight: 500;
    }

    .range-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    input[type=range] {
      flex: 1;
      accent-color: var(--model);
      cursor: pointer;
      height: 6px;
    }

    .metrics-card {
      padding-top: 20px;
      border-top: 1px solid var(--rule);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .metric-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .metric-label {
      font-size: var(--fs-sec);
      color: var(--muted);
    }
    .metric-value {
      font-size: var(--fs-h1);
      font-family: var(--font-display);
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .metric-value.highlight {
      color: var(--focus);
    }

    .insight {
      font-size: var(--fs-sec);
      line-height: var(--lh-copy);
      color: var(--muted);
      border-left: 3px solid var(--model);
      padding-left: 14px;
      margin-top: 4px;
    }

    .legend {
      display: flex;
      gap: 24px;
      font-size: var(--fs-sec);
      color: var(--text);
      align-items: center;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
  </style>
</head>
<body data-page="08" data-total="22">
  <div id="stage">
    <header>
      <h1>森林规模与特征扰动抑制过拟合</h1>
      <div class="legend">
        <div class="legend-item">
          <span class="legend-dot" style="background: var(--c-pos)"></span>
          <span>类别 A 样本</span>
        </div>
        <div class="legend-item">
          <span class="legend-dot" style="background: var(--c-neg)"></span>
          <span>类别 B 样本（含噪点）</span>
        </div>
      </div>
    </header>

    <div class="workspace">
      <div class="view-area">
        <div class="canvas-card">
          <canvas id="cvStage"></canvas>
        </div>
      </div>

      <div class="side-panel">
        <div class="control-block">
          <div class="control-header">
            <span>基决策树数量 (n_estimators)</span>
            <span class="control-val" id="treesVal">1</span>
          </div>
          <div class="range-wrap">
            <input type="range" id="treeRange" min="1" max="40" value="1" step="1">
          </div>
        </div>

        <div class="control-block">
          <div class="control-header">
            <span>分裂候选特征数 (max_features)</span>
          </div>
          <div class="seg-group" id="featureSeg">
            <button class="btn-seg active" data-feat="all">全部特征 (2/2)</button>
            <button class="btn-seg" data-feat="rnd">随机单个 (1/2)</button>
            <button class="btn-seg" data-feat="none">极端单维 (1/2)</button>
          </div>
        </div>

        <div class="metrics-card">
          <div class="metric-item">
            <span class="metric-label">决策边界粗糙度</span>
            <span class="metric-value" id="roughnessVal">84</span>
          </div>
          <div class="metric-item">
            <span class="metric-label">估算泛化袋外误差</span>
            <span class="metric-value" id="oobVal">24.2%</span>
          </div>
        </div>

        <div class="insight" id="insightText">
          单棵完全生长决策树严格包围噪点，边界破碎且高方差。
        </div>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    单棵树对每个噪声样本进行硬划分，产生刀刻般的方块边界。
    增大森林树木数量时，多棵树的投票平滑了离群岛屿。
    引入特征子集随机扰动后，各树相关性进一步下降，方差收缩最显著。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (function() {
      // 1. 固定合成数据（包含互锁双月或高斯簇 + 5个噪声样本）
      var rngSeed = 42;
      function pseudoRandom() {
        var x = Math.sin(rngSeed++) * 10000;
        return x - Math.floor(x);
      }

      // 生成二维分类点（0: Class A, 1: Class B）
      var points = [];
      // 簇 A 中心 (-0.35, 0.25)
      for (var i = 0; i < 40; i++) {
        var ang = pseudoRandom() * Math.PI * 2;
        var r = Math.sqrt(pseudoRandom()) * 0.45;
        points.push({ x: -0.3 + Math.cos(ang) * r * 1.2, y: 0.15 + Math.sin(ang) * r * 0.9, yCls: 0 });
      }
      // 簇 B 中心 (0.35, -0.2)
      for (var j = 0; j < 40; j++) {
        var ang2 = pseudoRandom() * Math.PI * 2;
        var r2 = Math.sqrt(pseudoRandom()) * 0.48;
        points.push({ x: 0.32 + Math.cos(ang2) * r2 * 1.1, y: -0.15 + Math.sin(ang2) * r2 * 0.85, yCls: 1 });
      }
      // 注入 6 个噪声样本（孤岛过拟合标记物）
      var noise = [
        { x: -0.25, y: 0.52, yCls: 1 },
        { x: -0.5, y: 0.05, yCls: 1 },
        { x: -0.15, y: -0.25, yCls: 1 },
        { x: 0.28, y: -0.55, yCls: 0 },
        { x: 0.45, y: 0.22, yCls: 0 },
        { x: 0.08, y: 0.35, yCls: 1 }
      ];
      points = points.concat(noise);

      // 预构建森林（最多 40 棵完全生长树）
      // 针对三种特征扰动策略分别预置树的分裂逻辑
      function buildTree(subsampleSeed, featMode) {
        var sRng = subsampleSeed * 1000 + 17;
        function rnd() {
          var x = Math.sin(sRng++) * 10000;
          return x - Math.floor(x);
        }
        // bootstrap 抽样 60 个点
        var sample = [];
        for (var k = 0; k < 60; k++) {
          sample.push(points[Math.floor(rnd() * points.length)]);
        }

        // 简易贪心二叉树构建
        function makeNode(data, depth) {
          var count0 = 0, count1 = 0;
          for (var i = 0; i < data.length; i++) {
            if (data[i].yCls === 0) count0++; else count1++;
          }
          if (count0 === 0 || count1 === 0 || depth >= 7 || data.length <= 2) {
            return { isLeaf: true, pred: count1 >= count0 ? 1 : 0 };
          }

          var feats = [0, 1];
          if (featMode === 'rnd') {
            feats = [rnd() < 0.5 ? 0 : 1];
          } else if (featMode === 'none') {
            feats = [0]; // 极端单特征
          }

          var bestScore = -1;
          var bestSplit = null;

          for (var fIdx = 0; fIdx < feats.length; fIdx++) {
            var f = feats[fIdx];
            for (var t = 0; t < 6; t++) {
              var splitVal = (rnd() - 0.5) * 1.8;
              var left = [], right = [];
              for (var d = 0; d < data.length; d++) {
                var v = f === 0 ? data[d].x : data[d].y;
                if (v < splitVal) left.push(data[d]); else right.push(data[d]);
              }
              if (left.length === 0 || right.length === 0) continue;
              // 简化的基尼增益估算
              var pL = left.filter(function(p){return p.yCls===1;}).length / left.length;
              var pR = right.filter(function(p){return p.yCls===1;}).length / right.length;
              var giniL = 1 - (pL*pL + (1-pL)*(1-pL));
              var giniR = 1 - (pR*pR + (1-pR)*(1-pR));
              var totalGini = (left.length * giniL + right.length * giniR) / data.length;
              var gain = 1 - totalGini;
              if (gain > bestScore) {
                bestScore = gain;
                bestSplit = { feat: f, val: splitVal, left: left, right: right };
              }
            }
          }

          if (!bestSplit) {
            return { isLeaf: true, pred: count1 >= count0 ? 1 : 0 };
          }

          return {
            isLeaf: false,
            feat: bestSplit.feat,
            val: bestSplit.val,
            left: makeNode(bestSplit.left, depth + 1),
            right: makeNode(bestSplit.right, depth + 1)
          };
        }

        var root = makeNode(sample, 0);

        function predict(p, node) {
          if (node.isLeaf) return node.pred;
          var v = node.feat === 0 ? p.x : p.y;
          if (v < node.val) return predict(p, node.left);
          return predict(p, node.right);
        }

        return {
          predict: function(p) {
            return predict(p, root);
          }
        };
      }

      var forestPool = {
        all: [],
        rnd: [],
        none: []
      };
      for (var f = 0; f < 40; f++) {
        forestPool.all.push(buildTree(f + 1, 'all'));
        forestPool.rnd.push(buildTree(f + 50, 'rnd'));
        forestPool.none.push(buildTree(f + 100, 'none'));
      }

      // 状态
      var state = {
        treeCount: 1,
        featMode: 'all'
      };

      var cv = document.getElementById('cvStage');
      var ctx;

      var GRID_RES = 50; // 网格分辨率 50x50
      var gridPreds = new Float32Array(GRID_RES * GRID_RES);

      function computeGrid() {
        var trees = forestPool[state.featMode];
        var n = state.treeCount;
        var idx = 0;
        var roughness = 0;
        for (var gy = 0; gy < GRID_RES; gy++) {
          var y = 0.9 - (gy / (GRID_RES - 1)) * 1.8;
          for (var gx = 0; gx < GRID_RES; gx++) {
            var x = -0.9 + (gx / (GRID_RES - 1)) * 1.8;
            var sum = 0;
            for (var t = 0; t < n; t++) {
              sum += trees[t].predict({ x: x, y: y });
            }
            gridPreds[idx++] = sum / n;
          }
        }

        // 粗糙度：相邻网格预测梯度变化总量
        var diffSum = 0;
        for (var r = 0; r < GRID_RES - 1; r++) {
          for (var c = 0; c < GRID_RES - 1; c++) {
            var i1 = r * GRID_RES + c;
            var i2 = i1 + 1;
            var i3 = i1 + GRID_RES;
            diffSum += Math.abs(gridPreds[i2] - gridPreds[i1]) + Math.abs(gridPreds[i3] - gridPreds[i1]);
          }
        }
        var normRoughness = Math.round(Math.min(99, Math.max(8, diffSum * 0.65)));
        
        // OOB 误差模拟公式
        // 随树增多方差减小：oob = 基础误差 + 方差项/sqrt(n)
        var baseErr = state.featMode === 'none' ? 26.5 : (state.featMode === 'rnd' ? 12.4 : 15.8);
        var varErr = state.featMode === 'rnd' ? 18.0 : 25.0;
        var oob = (baseErr + varErr / Math.sqrt(n)).toFixed(1) + '%';

        document.getElementById('roughnessVal').textContent = normRoughness;
        document.getElementById('oobVal').textContent = oob;
        
        var insightEl = document.getElementById('insightText');
        if (n === 1) {
          insightEl.textContent = '单棵树边界呈折线直角，噪声点被单独圈成孤岛，属于高方差过拟合。';
        } else if (n < 10) {
          insightEl.textContent = '多树集成开始投票抵消孤立切分，噪声岛屿逐渐被主流概率吞没。';
        } else if (state.featMode === 'rnd') {
          insightEl.textContent = '结合属性随机扰动与 ' + n + ' 棵树集成，树间去相关彻底，边界高度平滑且泛化能力最佳。';
        } else if (state.featMode === 'none') {
          insightEl.textContent = '仅选单一固定特征导致树结构退化，偏差急剧上升，无法有效捕获二维分类边界。';
        } else {
          insightEl.textContent = '使用全部特征分裂时各树结构相似，继续增多树木对降低方差的边际收益递减。';
        }
      }

      function draw() {
        if (!ctx) return;
        var w = cv.width;
        var h = cv.height;

        ctx.clearRect(0, 0, w, h);

        // 1. 绘制网格背景概率分布
        var cellW = w / GRID_RES;
        var cellH = h / GRID_RES;
        var idx = 0;
        for (var gy = 0; gy < GRID_RES; gy++) {
          for (var gx = 0; gx < GRID_RES; gx++) {
            var prob = gridPreds[idx++]; // 0 为类别A，1 为类别B
            // 在冷色调背景上微调混和底色
            if (prob > 0.5) {
              var alpha = (prob - 0.5) * 1.5;
              ctx.fillStyle = 'rgba(217, 101, 40, ' + Math.min(0.7, alpha * 0.6 + 0.08) + ')';
            } else {
              var alphaA = (0.5 - prob) * 1.5;
              ctx.fillStyle = 'rgba(23, 98, 142, ' + Math.min(0.7, alphaA * 0.6 + 0.08) + ')';
            }
            ctx.fillRect(gx * cellW, gy * cellH, cellW + 0.5, cellH + 0.5);
          }
        }

        // 2. 绘制平滑决策边界轮廓线 (p = 0.5 截面)，采用平滑直线段连结
        ctx.strokeStyle = '#142630';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (var r = 0; r < GRID_RES - 1; r++) {
          for (var c = 0; c < GRID_RES - 1; c++) {
            var p00 = gridPreds[r * GRID_RES + c];
            var p01 = gridPreds[r * GRID_RES + c + 1];
            var p10 = gridPreds[(r + 1) * GRID_RES + c];

            if ((p00 - 0.5) * (p01 - 0.5) < 0) {
              var fracX = (0.5 - p00) / (p01 - p00);
              var px = (c + fracX) * cellW;
              var py = (r + 0.5) * cellH;
              ctx.moveTo(px, py - cellH * 0.5);
              ctx.lineTo(px, py + cellH * 0.5);
            }
            if ((p00 - 0.5) * (p10 - 0.5) < 0) {
              var fracY = (0.5 - p00) / (p10 - p00);
              var qx = (c + 0.5) * cellW;
              var qy = (r + fracY) * cellH;
              ctx.moveTo(qx - cellW * 0.5, qy);
              ctx.lineTo(qx + cellW * 0.5, qy);
            }
          }
        }
        ctx.stroke();

        // 3. 绘制样本散点
        for (var i = 0; i < points.length; i++) {
          var pt = points[i];
          var sx = ((pt.x + 0.9) / 1.8) * w;
          var sy = ((0.9 - pt.y) / 1.8) * h;

          ctx.beginPath();
          ctx.arc(sx, sy, 5, 0, Math.PI * 2);
          if (pt.yCls === 0) {
            ctx.fillStyle = '#17628E';
            ctx.strokeStyle = '#FFFFFF';
          } else {
            ctx.fillStyle = '#D96528';
            ctx.strokeStyle = '#FFFFFF';
          }
          ctx.lineWidth = 1.5;
          ctx.fill();
          ctx.stroke();
        }
      }

      function update() {
        computeGrid();
        draw();
      }

      // 绑定交互控件
      var treeSlider = document.getElementById('treeRange');
      var treesVal = document.getElementById('treesVal');
      treeSlider.addEventListener('input', function(e) {
        state.treeCount = parseInt(e.target.value, 10);
        treesVal.textContent = state.treeCount;
        update();
      });

      var segButtons = document.querySelectorAll('#featureSeg .btn-seg');
      segButtons.forEach(function(btn) {
        btn.addEventListener('click', function() {
          segButtons.forEach(function(b){ b.classList.remove('active'); });
          btn.classList.add('active');
          state.featMode = btn.dataset.feat;
          update();
        });
      });

      // 初始化 Canvas 高分屏
      ctx = Deck.fit(cv);
      Deck.onResize(function() {
        ctx = Deck.fit(cv);
        draw();
      });

      Deck.init({ index: 8, total: 22 });
      update();
    })();
  </script>
</body>
</html>
