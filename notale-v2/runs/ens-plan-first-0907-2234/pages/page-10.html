<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      position: relative;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
    }

    .cover-header {
      position: absolute;
      top: 140px;
      left: 104px;
      z-index: 10;
      max-width: 540px;
      pointer-events: none;
    }

    .chapter-tag {
      font-size: var(--fs-label);
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chapter-tag::before {
      content: "";
      width: 24px;
      height: 2px;
      background: var(--rule);
    }

    h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
    }

    .meta-metrics {
      position: absolute;
      bottom: 120px;
      left: 104px;
      z-index: 10;
      display: flex;
      gap: 56px;
      pointer-events: none;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric-val {
      font-size: var(--fs-h2);
      font-weight: 600;
      color: var(--text);
    }

    .metric-label {
      font-size: var(--fs-label);
      color: var(--muted);
    }

    .blueprint-stage {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body data-page="10" data-total="22">
  <div id="stage">
    <header class="cover-header">
      <div class="chapter-tag">第三模块 · 串行迭代</div>
      <h1>Boosting 与 AdaBoost</h1>
      <p class="subtitle">通过重赋权聚焦错分样本，串行加权聚合成强分类器。</p>
    </header>

    <div class="meta-metrics">
      <div class="metric-item">
        <span class="metric-val">串行强化</span>
        <span class="metric-label">误差驱动样本分布</span>
      </div>
      <div class="metric-item">
        <span class="metric-val">加权表决</span>
        <span class="metric-label">按误差率分配权重</span>
      </div>
    </div>

    <!-- Blueprint SVG Visual Carrier -->
    <svg class="blueprint-stage cv-fill" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <marker id="arr-m" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#17628E" />
        </marker>
        <marker id="arr-f" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B83D0B" />
        </marker>
      </defs>

      <!-- Base Learner 1 (t=1): Uniform weights -->
      <g transform="translate(680, 160)">
        <text x="10" y="24" fill="#142630" font-size="15" font-weight="600" font-family="var(--font-sans)">基分类器 h₁</text>
        <rect x="0" y="38" width="180" height="260" fill="none" stroke="#71828B" stroke-width="1.5" stroke-dasharray="4 4" />
        
        <!-- Decision boundary line -->
        <line x1="90" y1="48" x2="90" y2="288" stroke="#17628E" stroke-width="2" />
        
        <!-- Sample points: uniform size -->
        <circle cx="45" cy="90" r="7" fill="#17628E" />
        <circle cx="40" cy="160" r="7" fill="#17628E" />
        <circle cx="60" cy="225" r="7" fill="#17628E" />
        <!-- Misclassified samples marked for attention -->
        <circle cx="135" cy="85" r="7" fill="#B83D0B" />
        <circle cx="130" cy="155" r="7" fill="#B83D0B" />
        <circle cx="140" cy="225" r="7" fill="#17628E" />

        <text x="90" y="280" fill="#50616B" font-size="13" text-anchor="middle" font-family="var(--font-sans)">均匀分布 D₁</text>
      </g>

      <!-- Weight update flow 1 -> 2 -->
      <path d="M 860 290 L 950 290" fill="none" stroke="#B83D0B" stroke-width="2" marker-end="url(#arr-f)" />
      <text x="905" y="272" fill="#B83D0B" font-size="13" text-anchor="middle" font-weight="600" font-family="var(--font-sans)">错分重赋权</text>

      <!-- Base Learner 2 (t=2): Misclassified weights magnified -->
      <g transform="translate(960, 160)">
        <text x="10" y="24" fill="#142630" font-size="15" font-weight="600" font-family="var(--font-sans)">基分类器 h₂</text>
        <rect x="0" y="38" width="180" height="260" fill="none" stroke="#71828B" stroke-width="1.5" stroke-dasharray="4 4" />
        
        <!-- Decision line adjusted horizontally -->
        <line x1="10" y1="130" x2="170" y2="130" stroke="#17628E" stroke-width="2" />
        
        <!-- Sample points: former misclassified now magnified -->
        <circle cx="45" cy="90" r="5" fill="#17628E" opacity="0.65" />
        <circle cx="40" cy="160" r="5" fill="#17628E" opacity="0.65" />
        <circle cx="60" cy="225" r="5" fill="#17628E" opacity="0.65" />
        
        <!-- Enlarged weights -->
        <circle cx="130" cy="85" r="14" fill="none" stroke="#B83D0B" stroke-width="2" />
        <circle cx="130" cy="85" r="5" fill="#B83D0B" />
        <circle cx="130" cy="155" r="14" fill="none" stroke="#B83D0B" stroke-width="2" />
        <circle cx="130" cy="155" r="5" fill="#B83D0B" />
        <circle cx="140" cy="225" r="5" fill="#17628E" opacity="0.65" />

        <text x="90" y="280" fill="#50616B" font-size="13" text-anchor="middle" font-family="var(--font-sans)">聚焦分布 D₂</text>
      </g>

      <!-- Weight update flow 2 -> 3 -->
      <path d="M 1140 290 L 1230 290" fill="none" stroke="#17628E" stroke-width="2" marker-end="url(#arr-m)" />
      <text x="1185" y="272" fill="#50616B" font-size="13" text-anchor="middle" font-family="var(--font-sans)">继续迭代</text>

      <!-- Base Learner 3 (t=3) -->
      <g transform="translate(1240, 160)">
        <text x="10" y="24" fill="#142630" font-size="15" font-weight="600" font-family="var(--font-sans)">基分类器 h₃</text>
        <rect x="0" y="38" width="180" height="260" fill="none" stroke="#71828B" stroke-width="1.5" stroke-dasharray="4 4" />
        
        <!-- Diagonal split -->
        <line x1="20" y1="240" x2="160" y2="70" stroke="#17628E" stroke-width="2" />
        
        <circle cx="45" cy="90" r="6" fill="#17628E" />
        <circle cx="40" cy="160" r="6" fill="#17628E" />
        <circle cx="60" cy="225" r="11" fill="none" stroke="#17628E" stroke-width="1.5" />
        <circle cx="60" cy="225" r="5" fill="#17628E" />
        
        <circle cx="130" cy="85" r="6" fill="#17628E" />
        <circle cx="130" cy="155" r="6" fill="#17628E" />
        <circle cx="140" cy="225" r="6" fill="#17628E" />

        <text x="90" y="280" fill="#50616B" font-size="13" text-anchor="middle" font-family="var(--font-sans)">修正分布 D₃</text>
      </g>

      <!-- Convergence Paths: 3 models funnel into 1 strong model (Theme Signature) -->
      <!-- α1 * h1 -->
      <path d="M 770 458 L 770 560 Q 770 630, 1070 630" fill="none" stroke="#17628E" stroke-width="2" stroke-dasharray="6 4" />
      <text x="780" y="500" fill="#50616B" font-size="15" font-family="var(--font-sans)">α₁ = 0.42</text>

      <!-- α2 * h2 -->
      <path d="M 1050 458 L 1050 560 Q 1050 630, 1070 630" fill="none" stroke="#17628E" stroke-width="2" stroke-dasharray="6 4" />
      <text x="1060" y="500" fill="#50616B" font-size="15" font-family="var(--font-sans)">α₂ = 0.65</text>

      <!-- α3 * h3 -->
      <path d="M 1330 458 L 1330 560 Q 1330 630, 1110 630" fill="none" stroke="#17628E" stroke-width="2" stroke-dasharray="6 4" />
      <text x="1340" y="500" fill="#50616B" font-size="15" font-family="var(--font-sans)">α₃ = 0.92</text>

      <!-- Converged path: theme signature 4px bold line -->
      <path d="M 1090 630 L 1480 630" fill="none" stroke="#17628E" stroke-width="4" marker-end="url(#arr-m)" />

      <!-- Convergence summation node -->
      <circle cx="1080" cy="630" r="22" fill="#E8EEF1" stroke="#17628E" stroke-width="2" />
      <text x="1080" y="637" fill="#17628E" font-size="22" font-weight="700" text-anchor="middle" font-family="var(--font-sans)">∑</text>

      <!-- Strong Classifier Final Block -->
      <g transform="translate(1190, 675)">
        <text x="0" y="0" fill="#142630" font-size="22" font-weight="700" font-family="var(--font-display)">H(x) = sign( ∑ αₜ hₜ(x) )</text>
        <text x="0" y="28" fill="#50616B" font-size="16" font-family="var(--font-sans)">弱分类器线性加权聚合 · 强分类器</text>
      </g>
    </svg>
  </div>

  <aside class="notes" hidden>
    欢迎来到第八讲第三模块。上一节我们学习了 Bagging 和随机森林，它们采用独立并行采样来降低方差。从这一节开始，我们将转向集成学习的另一大主流范式：Boosting。
    与并行构建不同，Boosting 采用串行强化机制。本章的核心代表 AdaBoost 通过动态调整样本权重分布，迫使后续基学习器专注于此前被错分的疑难样本，最后根据各基学习器的预测表现进行加权表决，将弱分类器逐步打磨成强分类器。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 10, total: 22, keys: false });
  </script>
</body>
</html>
