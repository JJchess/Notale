<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>梯度提升机（GBDT）</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      contain: layout paint;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
    }

    .cover-copy {
      position: absolute;
      top: 140px;
      left: 110px;
      z-index: 5;
      pointer-events: none;
      max-width: 540px;
    }

    .chapter-tag {
      font-size: var(--fs-sec);
      color: var(--muted);
      letter-spacing: 0.06em;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chapter-tag::before {
      content: "";
      display: inline-block;
      width: 28px;
      height: 2px;
      background: var(--model);
    }

    h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      color: var(--text);
      letter-spacing: -0.01em;
      margin: 0;
      font-weight: 700;
      white-space: nowrap;
    }

    .sub-lead {
      margin-top: 24px;
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
    }

    .sub-lead strong {
      color: var(--text);
      font-weight: 600;
    }

    .visual-stage {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .legend-panel {
      position: absolute;
      left: 110px;
      bottom: 84px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 36px;
      font-size: var(--fs-sec);
      color: var(--muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .legend-line {
      width: 28px;
      height: 2px;
      background: var(--rule);
    }

    .legend-line.model {
      height: 4px;
      background: var(--model);
    }

    .legend-line.focus {
      height: 3px;
      background: var(--focus);
    }
  </style>
</head>
<body data-page="15" data-total="22">
  <div id="stage">
    <header class="cover-copy">
      <div class="chapter-tag">第 04 单元 · 集成算法深化</div>
      <h1>梯度提升机 GBDT</h1>
      <p class="sub-lead">
        从加权样本到函数空间最速下降：每一棵弱回归树都在拟合当前集成的<strong>负梯度方向</strong>。
      </p>
    </header>

    <svg class="visual-stage cv-fill" viewBox="0 0 1600 900" aria-hidden="true">
      <defs>
        <marker id="arrow-grad" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 1 2 L 6 5 L 1 8 z" fill="#B83D0B"/>
        </marker>
        <marker id="axis-arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M 2 2 L 7 5 L 2 8 z" fill="#71828B"/>
        </marker>
      </defs>

      <!-- 坐标系与轴线 -->
      <g stroke="#71828B" stroke-width="2" opacity="0.65">
        <line x1="680" y1="740" x2="1500" y2="740" marker-end="url(#axis-arr)"/>
        <line x1="680" y1="740" x2="680" y2="160" marker-end="url(#axis-arr)"/>
      </g>
      <text x="696" y="175" fill="#50616B" font-size="16" font-family="var(--font-sans)">目标损失 L(y, F)</text>
      <text x="1380" y="775" fill="#50616B" font-size="16" font-family="var(--font-sans)">迭代轮数 m</text>

      <!-- 损失等高线（严格约束在画布右侧区域，不越界）
           极值中心 (1280, 560)，最外层 rx=240, ry=140，范围 [1040..1520] 严格在 1600 内 -->
      <g fill="none" stroke="#71828B" stroke-width="1.2" opacity="0.35">
        <ellipse cx="1280" cy="560" rx="240" ry="145" stroke-dasharray="6,6"/>
        <ellipse cx="1280" cy="560" rx="170" ry="105"/>
        <ellipse cx="1280" cy="560" rx="105" ry="65" stroke-dasharray="4,4"/>
        <ellipse cx="1280" cy="560" rx="45" ry="28"/>
      </g>
      <circle cx="1280" cy="560" r="5" fill="#142630"/>
      <text x="1295" y="565" fill="#50616B" font-size="15" font-family="var(--font-sans)">极小值 y*</text>

      <!-- 梯度提升路径：
           主题签名：多条蓝色预测路径在结论前收束为一条 4px 粗线 -->
      <!-- 弱树各分量拟合台阶（浅蓝细线 2px） -->
      <g stroke="#17628E" stroke-width="2" fill="none" opacity="0.4">
        <polyline points="740,240 850,240 850,330"/>
        <polyline points="850,330 960,330 960,405"/>
        <polyline points="960,405 1070,405 1070,470"/>
        <polyline points="1070,470 1170,470 1170,520"/>
      </g>

      <!-- 强模型汇聚主线（粗线 4px） -->
      <polyline points="740,240 850,330 960,405 1070,470 1170,520 1270,555"
                fill="none" stroke="#17628E" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 负梯度最速下降单步方向（焦点橙色） -->
      <g stroke="#B83D0B" stroke-width="2">
        <line x1="740" y1="240" x2="844" y2="325" marker-end="url(#arrow-grad)"/>
        <line x1="850" y1="330" x2="954" y2="401" marker-end="url(#arrow-grad)"/>
        <line x1="960" y1="405" x2="1064" y2="466" marker-end="url(#arrow-grad)"/>
        <line x1="1070" y1="470" x2="1164" y2="517" marker-end="url(#arrow-grad)"/>
        <line x1="1170" y1="520" x2="1264" y2="553" marker-end="url(#arrow-grad)"/>
      </g>

      <!-- 状态节点与标记 -->
      <circle cx="740" cy="240" r="6" fill="#17628E"/>
      <text x="715" y="222" fill="#142630" font-size="16" font-family="var(--font-sans)" font-weight="bold">F₀(x)</text>

      <circle cx="850" cy="330" r="5" fill="#17628E"/>
      <text x="860" y="322" fill="#50616B" font-size="15" font-family="var(--font-sans)">F₁(x)</text>
      <text x="778" y="295" fill="#B83D0B" font-size="15" font-family="var(--font-sans)">-g₁(x)</text>

      <circle cx="960" cy="405" r="5" fill="#17628E"/>
      <text x="970" y="398" fill="#50616B" font-size="15" font-family="var(--font-sans)">F₂(x)</text>

      <circle cx="1070" cy="470" r="5" fill="#17628E"/>
      <circle cx="1170" cy="520" r="5" fill="#17628E"/>

      <!-- 最终收敛点 -->
      <circle cx="1270" cy="555" r="7" fill="#B83D0B"/>
      <text x="1275" y="535" fill="#B83D0B" font-size="16" font-family="var(--font-sans)" font-weight="bold">F_M(x)</text>

      <!-- 拟合负梯度的弱树示意 -->
      <g transform="translate(1040, 150)">
        <line x1="140" y1="20" x2="90" y2="70" stroke="#71828B" stroke-width="2"/>
        <line x1="140" y1="20" x2="190" y2="70" stroke="#71828B" stroke-width="2"/>
        <line x1="90" y1="70" x2="60" y2="120" stroke="#71828B" stroke-width="2"/>
        <line x1="90" y1="70" x2="120" y2="120" stroke="#71828B" stroke-width="2"/>

        <circle cx="140" cy="20" r="5" fill="#17628E"/>
        <circle cx="90" cy="70" r="4" fill="#17628E"/>
        <circle cx="190" cy="70" r="4" fill="#17628E"/>

        <rect x="44" y="120" width="32" height="20" rx="2" fill="#E8EEF1" stroke="#B83D0B" stroke-width="1.5"/>
        <text x="60" y="135" text-anchor="middle" fill="#B83D0B" font-size="13" font-family="var(--font-sans)">γ₁</text>

        <rect x="104" y="120" width="32" height="20" rx="2" fill="#E8EEF1" stroke="#B83D0B" stroke-width="1.5"/>
        <text x="120" y="135" text-anchor="middle" fill="#B83D0B" font-size="13" font-family="var(--font-sans)">γ₂</text>

        <rect x="174" y="70" width="32" height="20" rx="2" fill="#E8EEF1" stroke="#17628E" stroke-width="1.5"/>
        <text x="190" y="85" text-anchor="middle" fill="#17628E" font-size="13" font-family="var(--font-sans)">γ₃</text>

        <text x="140" y="0" text-anchor="middle" fill="#50616B" font-size="15" font-family="var(--font-sans)">基学习器 h_m(x) 拟合负梯度</text>
      </g>
    </svg>

    <footer class="legend-panel">
      <div class="legend-item">
        <span class="legend-line model"></span>
        <span>加法模型路径 F_m(x) = F_{m-1}(x) + ν·h_m(x)</span>
      </div>
      <div class="legend-item">
        <span class="legend-line focus"></span>
        <span>负梯度方向与步长（残差拟合）</span>
      </div>
    </footer>
  </div>

  <aside class="notes" hidden>
    欢迎来到第四单元：梯度提升机（GBDT）。在前两节中，我们学习了通过重采样和样本赋权的 Bagging 与 AdaBoost。从本节开始，提升方法进入全新范式：将加法模型的构造直接映射为函数空间中的最速下降。每一棵新加入的弱回归树，不再是调整样本权重，而是拟合当前模型对真实目标的负梯度残差。后续三节课我们将拆解其数学原理、逐步逼近过程与工业级实现。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 15, total: 22, keys: false });
  </script>
</body>
</html>
