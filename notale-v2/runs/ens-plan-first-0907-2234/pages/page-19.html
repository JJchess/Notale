<body data-page="19" data-total="22">
  <div id="stage">
    <header class="header">
      <div class="chapter-tag">第 05 模块 · 融合架构</div>
      <h1 class="title">Stacking 与多模型<br>融合策略</h1>
      <p class="subtitle">让模型学习如何组合模型：异构基学习器输出构成元特征，由次学习器完成最终判决。</p>
    </header>

    <svg class="scene-svg" viewBox="0 0 1600 900" aria-label="Stacking分层汇聚图解">
      <!-- 坐标基准刻度线 -->
      <g stroke="#71828B" stroke-width="1" stroke-dasharray="3 4" opacity="0.3">
        <line x1="840" y1="120" x2="840" y2="780" />
        <line x1="1100" y1="120" x2="1100" y2="780" />
        <line x1="1350" y1="120" x2="1350" y2="780" />
      </g>

      <!-- 列标题，严格使用 var(--fs-label) 即 15px -->
      <text class="col-header" x="840" y="115">初级基学习器 (Level 0)</text>
      <text class="col-header" x="1100" y="340">元特征</text>
      <text class="col-header" x="1310" y="340">次学习器 (Level 1)</text>

      <!-- 原始输入样本 X -->
      <text x="670" y="457" fill="#50616B" font-size="15px" text-anchor="middle" font-weight="500">样本 X</text>

      <!-- 输入特征到基学习器的分流浅线 -->
      <path d="M 700 457 C 740 457, 750 207, 780 207" fill="none" stroke="#71828B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
      <path d="M 700 457 C 740 457, 750 332, 780 332" fill="none" stroke="#71828B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
      <path d="M 700 457 L 780 457" fill="none" stroke="#71828B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
      <path d="M 700 457 C 740 457, 750 582, 780 582" fill="none" stroke="#71828B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
      <path d="M 700 457 C 740 457, 750 707, 780 707" fill="none" stroke="#71828B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

      <!-- 第一层：基学习器 (Level 0) -->
      <!-- 基学习器 1: 随机森林 -->
      <g>
        <rect x="780" y="175" width="120" height="64" rx="4" fill="#DDE6EC" stroke="#17628E" stroke-width="2"/>
        <text class="node-text" x="840" y="207" fill="#142630" font-size="16px" font-weight="600">随机森林</text>
      </g>

      <!-- 基学习器 2: GBDT -->
      <g>
        <rect x="780" y="300" width="120" height="64" rx="4" fill="#DDE6EC" stroke="#17628E" stroke-width="2"/>
        <text class="node-text" x="840" y="332" fill="#142630" font-size="16px" font-weight="600">GBDT</text>
      </g>

      <!-- 基学习器 3: SVM -->
      <g>
        <rect x="780" y="425" width="120" height="64" rx="4" fill="#DDE6EC" stroke="#17628E" stroke-width="2"/>
        <text class="node-text" x="840" y="457" fill="#142630" font-size="16px" font-weight="600">SVM</text>
      </g>

      <!-- 基学习器 4: 神经网络 -->
      <g>
        <rect x="780" y="550" width="120" height="64" rx="4" fill="#DDE6EC" stroke="#17628E" stroke-width="2"/>
        <text class="node-text" x="840" y="582" fill="#142630" font-size="16px" font-weight="600">神经网络</text>
      </g>

      <!-- 基学习器 5: 逻辑回归 -->
      <g>
        <rect x="780" y="675" width="120" height="64" rx="4" fill="#DDE6EC" stroke="#17628E" stroke-width="2"/>
        <text class="node-text" x="840" y="707" fill="#142630" font-size="16px" font-weight="600">逻辑回归</text>
      </g>

      <!-- 5 条等重蓝色基学习器预测路径汇聚到元特征矩阵 -->
      <path d="M 900 207 C 980 207, 1020 375, 1060 405" fill="none" stroke="#17628E" stroke-width="2"/>
      <path d="M 900 332 C 970 332, 1010 425, 1060 435" fill="none" stroke="#17628E" stroke-width="2"/>
      <path d="M 900 457 L 1060 457" fill="none" stroke="#17628E" stroke-width="2"/>
      <path d="M 900 582 C 970 582, 1010 489, 1060 479" fill="none" stroke="#17628E" stroke-width="2"/>
      <path d="M 900 707 C 980 707, 1020 539, 1060 509" fill="none" stroke="#17628E" stroke-width="2"/>

      <!-- 元特征矩阵节点 -->
      <g>
        <rect x="1060" y="380" width="80" height="154" rx="4" fill="#DDE6EC" stroke="#17628E" stroke-width="2"/>
        <text class="node-text" x="1100" y="445" fill="#142630" font-size="16px" font-weight="600">元特征</text>
        <text class="node-text" x="1100" y="472" fill="#50616B" font-size="13px">ŷ₁ ~ ŷ₅</text>
      </g>

      <!-- 从元特征到次学习器 -->
      <path d="M 1140 457 L 1240 457" fill="none" stroke="#17628E" stroke-width="3"/>

      <!-- 第二层：次学习器 -->
      <g>
        <rect x="1240" y="407" width="140" height="100" rx="4" fill="#17628E" stroke="#17628E" stroke-width="2"/>
        <text class="node-text" x="1310" y="445" fill="#E8EEF1" font-size="18px" font-weight="600">次学习器</text>
        <text class="node-text" x="1310" y="473" fill="#E8EEF1" font-size="13px" opacity="0.8">Meta-Learner</text>
      </g>

      <!-- 最终汇聚路径：4px 强调线重 (橙色单一聚焦点) -->
      <path d="M 1380 457 L 1480 457" fill="none" stroke="#B83D0B" stroke-width="4"/>

      <!-- 最终预测输出点 -->
      <g>
        <circle cx="1495" cy="457" r="14" fill="#B83D0B"/>
        <text class="node-text" x="1495" y="457" fill="#E8EEF1" font-size="13px" font-weight="600">Ŷ</text>
        <text x="1495" y="495" fill="#142630" font-size="15px" text-anchor="middle" font-weight="600">终判决</text>
      </g>
    </svg>
  </div>

  <aside class="notes" hidden>
    各位同学，我们进入集成学习的第五个模块——Stacking 与多模型融合策略。
    前面我们学过的 Bagging 和 Boosting，基模型大多是同质的，比如全是决策树。
    但在实际高水平竞赛和复杂工程中，我们往往会遇到不同的算法：随机森林、GBDT、SVM 以及神经网络。
    如何把这些异构模型的优势真正融合起来？Stacking 给出的答案是：不要人为武断地设定权重，而是再训练一个“次学习器”，让模型去学习如何组合这群模型。
  </aside>
