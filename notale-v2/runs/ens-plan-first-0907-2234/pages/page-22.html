<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>总结与课程收束</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
    }

    .cover-copy {
      position: absolute;
      left: 100px;
      top: 130px;
      z-index: 10;
      pointer-events: none;
    }

    .series-tag {
      font-size: var(--fs-label);
      font-weight: 500;
      color: var(--text);
      opacity: 0.72;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: 600;
      line-height: var(--lh-tight);
      letter-spacing: -0.02em;
      color: var(--text);
      margin: 0 0 20px 0;
    }

    .summary-lead {
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--text);
      opacity: 0.72;
      max-width: 480px;
      margin: 0;
    }

    .convergence-scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* 构图流线与微动 */
    .stream-path {
      fill: none;
      stroke: var(--model);
      stroke-width: 2px;
      opacity: 0.35;
      transition: stroke-dashoffset 1s var(--ease-out);
    }

    .stream-core {
      fill: none;
      stroke: var(--model);
      stroke-width: 4.5px;
      opacity: 0.95;
    }

    .stream-highlight {
      fill: none;
      stroke: var(--focus);
      stroke-width: 4px;
      opacity: 0.95;
    }

    .node-base {
      fill: var(--bg);
      stroke: var(--model);
      stroke-width: 2px;
    }

    .node-focus {
      fill: var(--bg);
      stroke: var(--focus);
      stroke-width: 3px;
    }

    .diagram-text {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      fill: var(--muted);
      letter-spacing: 0.04em;
    }

    .diagram-text.strong {
      fill: var(--text);
      font-weight: 600;
    }

    .diagram-text.accent {
      fill: var(--focus);
      font-weight: 600;
    }

    .legend-panel {
      position: absolute;
      left: 100px;
      bottom: 80px;
      z-index: 10;
      display: flex;
      gap: 36px;
      font-size: var(--fs-sec);
      color: var(--text);
      opacity: 0.72;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .legend-line {
      width: 28px;
      height: 2px;
      background: var(--model);
    }

    .legend-line.strong {
      height: 4px;
      background: var(--model);
    }

    .legend-line.accent {
      height: 3px;
      background: var(--focus);
    }
  </style>
</head>
<body data-page="22" data-total="22">
  <div id="stage">
    <header class="cover-copy">
      <div class="series-tag">机器学习概论 · 第八讲</div>
      <h1>总结与课程收束</h1>
      <p class="summary-lead">从独立基学习器到协同决策，多条预测路径最终汇聚为泛化性能的本质提升。</p>
    </header>

    <svg class="convergence-scene" viewBox="0 0 1600 900" aria-hidden="true">
      <defs>
        <!-- 渐变底流 -->
        <linearGradient id="stream-grad" x1="600" y1="450" x2="1480" y2="450" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#17628E" stop-opacity="0.15" />
          <stop offset="70%" stop-color="#17628E" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#17628E" stop-opacity="1" />
        </linearGradient>
      </defs>

      <!-- 左侧分散基学习器分流与路径 (Bagging, Boosting, Stacking) -->
      <!-- 组 1: Bagging 分支群 (上部) -->
      <g class="branch-group">
        <circle cx="780" cy="180" r="16" class="node-base" />
        <text x="740" y="185" text-anchor="end" class="diagram-text">并联重采样 (Bagging)</text>
        <path d="M 796 180 C 920 180, 1000 340, 1140 430" class="stream-path" />
        
        <circle cx="810" cy="240" r="12" class="node-base" />
        <path d="M 822 240 C 930 240, 1010 360, 1140 436" class="stream-path" />
        
        <circle cx="760" cy="290" r="14" class="node-base" />
        <path d="M 774 290 C 900 290, 990 380, 1140 442" class="stream-path" />
      </g>

      <!-- 组 2: Boosting 串联加权群 (中部) -->
      <g class="branch-group">
        <circle cx="720" cy="450" r="14" class="node-base" />
        <text x="690" y="455" text-anchor="end" class="diagram-text">残差迭代 (Boosting)</text>
        <path d="M 734 450 L 810 450" class="stream-path" />
        
        <circle cx="826" cy="450" r="16" class="node-focus" />
        <path d="M 842 450 L 930 450" class="stream-highlight" />
        
        <circle cx="948" cy="450" r="18" class="node-base" />
        <path d="M 966 450 C 1040 450, 1090 450, 1140 450" class="stream-core" />
      </g>

      <!-- 组 3: Stacking 次级学习器群 (下部) -->
      <g class="branch-group">
        <circle cx="760" cy="610" r="14" class="node-base" />
        <text x="730" y="615" text-anchor="end" class="diagram-text">多模融合 (Stacking)</text>
        <path d="M 774 610 C 900 610, 990 520, 1140 458" class="stream-path" />

        <circle cx="810" cy="660" r="12" class="node-base" />
        <path d="M 822 660 C 930 660, 1010 540, 1140 464" class="stream-path" />

        <circle cx="770" cy="720" r="16" class="node-base" />
        <path d="M 786 720 C 910 720, 1000 560, 1140 470" class="stream-path" />
      </g>

      <!-- 汇聚枢纽与终局决策强收束 (4px 粗墨签名) -->
      <g class="convergence-hub">
        <!-- 汇聚漏斗引导线 -->
        <path d="M 1140 420 L 1140 480" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
        <text x="1140" y="405" text-anchor="middle" class="diagram-text">多源集成</text>

        <!-- 最终统一决策粗线 -->
        <path d="M 1140 450 L 1380 450" class="stream-core" />
        <polygon points="1380,442 1400,450 1380,458" fill="var(--model)" />

        <!-- 强决策终端节点 -->
        <circle cx="1430" cy="450" r="24" fill="var(--model)" />
        <circle cx="1430" cy="450" r="10" fill="var(--bg)" />
        <text x="1430" y="505" text-anchor="middle" class="diagram-text strong">最强泛化决策</text>
        <text x="1430" y="528" text-anchor="middle" class="diagram-text accent">方差与偏差的最优平衡</text>
      </g>

      <!-- 坐标轴/刻度辅助参考，凸显蓝图墨色质感 -->
      <line x1="720" y1="810" x2="1480" y2="810" stroke="var(--rule)" stroke-width="1" opacity="0.3" />
      <line x1="720" y1="805" x2="720" y2="815" stroke="var(--rule)" stroke-width="1" opacity="0.4" />
      <line x1="1140" y1="805" x2="1140" y2="815" stroke="var(--rule)" stroke-width="1" opacity="0.4" />
      <line x1="1430" y1="805" x2="1430" y2="815" stroke="var(--rule)" stroke-width="1" opacity="0.4" />
      <text x="720" y="832" text-anchor="middle" class="diagram-text" style="font-size: var(--fs-tick)">基学习器</text>
      <text x="1140" y="832" text-anchor="middle" class="diagram-text" style="font-size: var(--fs-tick)">融合准则</text>
      <text x="1430" y="832" text-anchor="middle" class="diagram-text" style="font-size: var(--fs-tick)">强集成体</text>
    </svg>

    <footer class="legend-panel">
      <div class="legend-item">
        <span class="legend-line"></span>
        <span>基模型路径 (2px)</span>
      </div>
      <div class="legend-item">
        <span class="legend-line strong"></span>
        <span>集成收束路径 (4px)</span>
      </div>
      <div class="legend-item">
        <span class="legend-line accent"></span>
        <span>焦点推进</span>
      </div>
    </footer>
  </div>

  <aside class="notes" hidden>
    同学们，第八讲集成学习到这里就全部结束了。
    回顾这一讲，无论是并行的 Bagging、串行迭代的 Boosting，还是分层堆叠的 Stacking，本质都在做同一件事：
    将弱小且可能带有偏差或方差的独立基学习器，通过严密的数学与统计策略，汇成一条坚不可摧的强收束决策路径。
    下一讲我们将进入无监督学习的世界，期待大家继续探索。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 22, total: 22, keys: false });
  </script>
</body>
</html>
