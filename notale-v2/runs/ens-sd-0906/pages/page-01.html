<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>集成学习——机器学习概论第八讲</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #E3E8E6;
      --text: #142A2D;
      --font-sans: "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .cover-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .cover-header {
      position: absolute;
      top: 180px;
      left: 120px;
      z-index: 4;
      pointer-events: none;
      max-width: 620px;
    }

    .chapter-tag {
      font-family: var(--font-display);
      font-size: var(--fs-sec);
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chapter-tag::before {
      content: "";
      display: inline-block;
      width: 28px;
      height: 2px;
      background: var(--focus);
    }

    .cover-title {
      font-family: var(--font-display);
      font-size: 72px;
      font-weight: 700;
      line-height: var(--lh-tight);
      letter-spacing: -0.02em;
      color: var(--text);
      margin: 0 0 24px 0;
    }

    .cover-lead {
      font-family: var(--font-sans);
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      max-width: 480px;
      margin: 0;
    }

    .legend-panel {
      position: absolute;
      bottom: var(--pad-y);
      left: 120px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 36px;
      font-size: var(--fs-label);
      color: var(--muted);
      font-family: var(--font-sans);
      pointer-events: none;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-line {
      width: 28px;
      height: 2px;
    }

    .legend-line.member {
      background: var(--member);
      opacity: 0.85;
    }

    .legend-line.ensemble {
      background: var(--model);
      height: 3px;
    }

    .legend-dot.focus {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--focus);
    }
  </style>
</head>
<body data-page="01" data-total="24">
  <div id="stage">
    <canvas id="cv" class="cover-canvas" aria-hidden="true"></canvas>

    <header class="cover-header">
      <div class="chapter-tag">机器学习概论 · 第八讲</div>
      <h1 class="cover-title">集成学习</h1>
      <p class="cover-lead">汇聚差异化的基学习器，将分散的弱预测收束为稳健强判断。</p>
    </header>

    <div class="legend-panel">
      <div class="legend-item">
        <span class="legend-line member"></span>
        <span>基学习器轨迹</span>
      </div>
      <div class="legend-item">
        <span class="legend-line ensemble"></span>
        <span>聚合决策主线</span>
      </div>
      <div class="legend-item">
        <span class="legend-dot focus"></span>
        <span>聚合决定点</span>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    各位同学好，今天我们进入机器学习概论第八讲：集成学习。
    在前面的章节中，我们大多关注如何训练单个模型，比如单棵决策树或单个线性分类器。
    但单个学习器往往受限于方差过大或偏差过高。
    集成学习的核心思想，就是通过构建并结合多个基学习器，利用成员之间的差异性与协同，把多个弱判断汇聚成一条稳健而精准的主干决策。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      const cv = document.getElementById("cv");
      const W = 1600;
      const H = 900;
      const SEED = 80182;

      function seededRandom(s) {
        let x = s;
        return () => {
          x = (x * 9301 + 49297) % 233280;
          return x / 233280;
        };
      }

      // Title exclusion zone in canvas logic coordinates
      const TITLE_BOX = { x1: 90, y1: 140, x2: 660, y2: 460 };

      function insideTitle(x, y, pad = 20) {
        return x >= TITLE_BOX.x1 - pad && x <= TITLE_BOX.x2 + pad &&
               y >= TITLE_BOX.y1 - pad && y <= TITLE_BOX.y2 + pad;
      }

      const rng = seededRandom(SEED);

      // Convergence hub
      const HUB_X = 1140;
      const HUB_Y = 480;

      // Generate member trajectories
      const MEMBER_COUNT = 42;
      const members = [];

      for (let i = 0; i < MEMBER_COUNT; i++) {
        // Diverse origins from left-bottom, top-mid, and mid-left spreads
        const side = rng();
        let startX, startY;
        if (side < 0.45) {
          startX = 160 + rng() * 560;
          startY = 520 + rng() * 320;
        } else if (side < 0.75) {
          startX = 640 + rng() * 380;
          startY = 100 + rng() * 340;
        } else {
          startX = 740 + rng() * 300;
          startY = 540 + rng() * 300;
        }

        const control1X = startX + (HUB_X - startX) * (0.35 + rng() * 0.15) + (rng() - 0.5) * 80;
        const control1Y = startY + (HUB_Y - startY) * 0.15 + (rng() - 0.5) * 160;

        const control2X = HUB_X - (0.2 + rng() * 0.25) * (HUB_X - startX);
        const control2Y = HUB_Y + (rng() - 0.5) * 50;

        // Trace points along bezier
        const points = [];
        const steps = 40;
        for (let t = 0; t <= 1; t += 1 / steps) {
          const u = 1 - t;
          const px = u*u*u * startX + 3*u*u*t * control1X + 3*u*t*t * control2X + t*t*t * HUB_X;
          const py = u*u*u * startY + 3*u*u*t * control1Y + 3*u*t*t * control2Y + t*t*t * HUB_Y;
          points.push({ x: px, y: py });
        }

        members.push({
          points,
          startX,
          startY,
          alpha: 0.18 + rng() * 0.22,
          speed: 0.00035 + rng() * 0.0003,
          offset: rng(),
          pulseSize: 2.2 + rng() * 1.5
        });
      }

      // Unified ensemble trunk points extending from HUB_X, HUB_Y towards the right
      const trunkPoints = [];
      const trunkEnd = { x: 1540, y: 470 };
      const trunkCtrl1 = { x: 1260, y: 480 };
      const trunkCtrl2 = { x: 1400, y: 472 };
      for (let t = 0; t <= 1; t += 0.02) {
        const u = 1 - t;
        const tx = u*u*u * HUB_X + 3*u*u*t * trunkCtrl1.x + 3*u*t*t * trunkCtrl2.x + t*t*t * trunkEnd.x;
        const ty = u*u*u * HUB_Y + 3*u*u*t * trunkCtrl1.y + 3*u*t*t * trunkCtrl2.y + t*t*t * trunkEnd.y;
        trunkPoints.push({ x: tx, y: ty });
      }

      function drawBackgroundField(ctx) {
        // Delicate statistical coordinate grid in right/bottom half
        ctx.strokeStyle = Deck.rgba("rule", 0.18);
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 6]);

        for (let x = 600; x <= 1500; x += 150) {
          ctx.beginPath();
          ctx.moveTo(x, 100);
          ctx.lineTo(x, 820);
          ctx.stroke();
        }

        for (let y = 180; y <= 800; y += 120) {
          ctx.beginPath();
          ctx.moveTo(560, y);
          ctx.lineTo(1540, y);
          ctx.stroke();
        }
        ctx.setLineDash([]);
      }

      function draw(ctx, time) {
        ctx.clearRect(0, 0, W, H);
        drawBackgroundField(ctx);

        // 1. Draw individual member trajectories
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        members.forEach(m => {
          ctx.beginPath();
          let started = false;
          for (let pt of m.points) {
            if (insideTitle(pt.x, pt.y)) continue;
            if (!started) {
              ctx.moveTo(pt.x, pt.y);
              started = true;
            } else {
              ctx.lineTo(pt.x, pt.y);
            }
          }
          ctx.strokeStyle = Deck.rgba("member", m.alpha);
          ctx.lineWidth = 1.4;
          ctx.stroke();

          // Member origin dot
          if (!insideTitle(m.startX, m.startY)) {
            ctx.fillStyle = Deck.rgba("member", 0.55);
            ctx.beginPath();
            ctx.arc(m.startX, m.startY, 2.8, 0, Math.PI * 2);
            ctx.fill();
          }

          // Moving signal pulse towards hub
          const progress = ((time * m.speed) + m.offset) % 1;
          const idx = Math.floor(progress * (m.points.length - 1));
          const p1 = m.points[idx];
          const p2 = m.points[Math.min(idx + 1, m.points.length - 1)];
          const frac = (progress * (m.points.length - 1)) - idx;
          const currX = p1.x + (p2.x - p1.x) * frac;
          const currY = p1.y + (p2.y - p1.y) * frac;

          if (!insideTitle(currX, currY)) {
            ctx.fillStyle = Deck.rgba("member", 0.85);
            ctx.beginPath();
            ctx.arc(currX, currY, m.pulseSize, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        // 2. Hub Convergence Zone
        // Diffused convergence rings
        const ringPulse = (Math.sin(time * 0.0018) + 1) * 0.5;
        ctx.strokeStyle = Deck.rgba("model", 0.25 + ringPulse * 0.15);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(HUB_X, HUB_Y, 26 + ringPulse * 8, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = Deck.rgba("model", 0.08);
        ctx.beginPath();
        ctx.arc(HUB_X, HUB_Y, 48, 0, Math.PI * 2);
        ctx.fill();

        // 3. Draw ensemble main decision line (thick authoritative trunk)
        ctx.beginPath();
        ctx.moveTo(trunkPoints[0].x, trunkPoints[0].y);
        for (let i = 1; i < trunkPoints.length; i++) {
          ctx.lineTo(trunkPoints[i].x, trunkPoints[i].y);
        }
        ctx.strokeStyle = Deck.rgba("model", 0.95);
        ctx.lineWidth = 4.2;
        ctx.stroke();

        // Secondary glow/confidence envelope along trunk
        ctx.beginPath();
        ctx.moveTo(trunkPoints[0].x, trunkPoints[0].y);
        for (let i = 1; i < trunkPoints.length; i++) {
          ctx.lineTo(trunkPoints[i].x, trunkPoints[i].y);
        }
        ctx.strokeStyle = Deck.rgba("model", 0.2);
        ctx.lineWidth = 12;
        ctx.stroke();

        // 4. Focus anchor mark at convergence hub
        ctx.fillStyle = Deck.rgba("focus", 1);
        ctx.beginPath();
        ctx.arc(HUB_X, HUB_Y, 5.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = Deck.rgba("focus", 0.45);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(HUB_X, HUB_Y, 11, 0, Math.PI * 2);
        ctx.stroke();

        // Leading tip pulse along the trunk
        const trunkProg = ((time * 0.00045)) % 1;
        const tIdx = Math.floor(trunkProg * (trunkPoints.length - 1));
        const tp1 = trunkPoints[tIdx];
        const tp2 = trunkPoints[Math.min(tIdx + 1, trunkPoints.length - 1)];
        const tFrac = (trunkProg * (trunkPoints.length - 1)) - tIdx;
        const tx = tp1.x + (tp2.x - tp1.x) * tFrac;
        const ty = tp1.y + (tp2.y - tp1.y) * tFrac;

        ctx.fillStyle = Deck.rgba("focus", 0.9);
        ctx.beginPath();
        ctx.arc(tx, ty, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }

      let ctx;
      function init() {
        ctx = Deck.fit(cv);
        Deck.loop(t => {
          draw(ctx, t);
        }, { still: 2400 });
      }

      Deck.onResize(() => {
        ctx = Deck.fit(cv);
        draw(ctx, 2400);
      });

      init();
    })();
  </script>
</body>
</html>
