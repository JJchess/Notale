<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #E3E8E6;
      --text: #142A2D;
      --font-sans: "Noto Sans CJK SC", "WenQuanYi Zen Hei", "Droid Sans Fallback", sans-serif;
    }

    #stage {
      background: var(--bg);
      color: var(--text);
    }

    #field-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* 标题区域：保留安静空间，按主题规范控制字阶与层级 */
    .title-group {
      position: absolute;
      left: 88px;
      top: 240px;
      width: 580px;
      pointer-events: none;
      z-index: 5;
    }

    .main-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: 700;
      line-height: var(--lh-tight);
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .sub-claim {
      margin: 20px 0 0 0;
      font-family: var(--font-sans);
      font-size: var(--fs-body);
      line-height: var(--lh-copy);
      color: var(--muted);
    }

    /* 残差递减序列标注，主题规范字号 */
    .stage-metric {
      position: absolute;
      left: 88px;
      bottom: 76px;
      display: flex;
      gap: 48px;
      pointer-events: none;
      z-index: 5;
      font-family: var(--font-numeric);
      font-size: var(--fs-tick);
      color: var(--muted);
    }

    .metric-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .metric-col .val {
      font-size: var(--fs-lead);
      color: var(--model);
      font-weight: 700;
      line-height: 1.2;
    }

    .metric-col.focus-col .val {
      color: var(--focus);
    }

    .metric-col .lbl {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      color: var(--muted);
      line-height: 1.3;
    }
  </style>
</head>
<body data-page="13" data-total="24">
  <div id="stage">
    <canvas id="field-canvas" class="cv-fill" aria-hidden="true"></canvas>

    <div class="title-group">
      <h1 class="main-title">Boosting：让模型接力纠错</h1>
      <p class="sub-claim">序列化前向累加与残差逐轮逼近</p>
    </div>

    <div class="stage-metric">
      <div class="metric-col">
        <span class="val">m = 1</span>
        <span class="lbl">初始基学习器</span>
      </div>
      <div class="metric-col">
        <span class="val">r<sub>m</sub> = y - F<sub>m-1</sub></span>
        <span class="lbl">接力拟合目标</span>
      </div>
      <div class="metric-col focus-col">
        <span class="val">F<sub>M</sub>(x)</span>
        <span class="lbl">收束强学习器</span>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    欢迎来到第三单元：Boosting。与 Bagging 中基学习器相互独立的并行投票截然不同，Boosting 采用串行接力机制。每一个新的基学习器，都在全力弥补前面所有学习器留下的残差或错分样本。多轮纠错逐层累加，最终将一系列弱学习器凝聚成强大的集成预测器。
  </aside>

  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
  (() => {
    "use strict";

    const canvas = document.querySelector("#field-canvas");
    const SEED = "boosting-relay-seed-2025";
    const W = 1600;
    const H = 900;

    let ctx;
    let stopLoop = () => {};

    // 概念对应：
    // Boosting 的核心机制是“接力收敛”：
    // 一组波动的轨迹（弱学习器/残差曲线），从左向右推进，
    // 经过逐轮纠错节点（加法模型更新），波幅逐段削减，
    // 最终在右侧收敛、压实为一条笔直且坚定的高对比主模型线。
    // 主题语义色：
    // 基学习器：--member (#688C91)
    // 焦点纠错节点：--focus (#C54620)
    // 最终强模型主线：--model (#245B67)

    const STAGES = [
      { x: 780, label: "m=1" },
      { x: 1010, label: "m=2" },
      { x: 1240, label: "m=3" },
      { x: 1470, label: "F(x)" }
    ];

    function buildModel() {
      const rng = new Math.seedrandom(SEED);
      const paths = [];
      const numLines = 32;

      for (let i = 0; i < numLines; i++) {
        // 每条弱学习器曲线的初始高频大振幅扰动
        const freq1 = 0.007 + rng() * 0.006;
        const freq2 = 0.018 + rng() * 0.015;
        const phase1 = rng() * Math.PI * 2;
        const phase2 = rng() * Math.PI * 2;
        const baseY = 160 + rng() * 560; // 展开更饱满的纵向分布
        const initialAmp = 60 + rng() * 80;

        paths.push({
          freq1, freq2, phase1, phase2, baseY, initialAmp,
          id: i
        });
      }

      return { paths };
    }

    let model;

    function render(time) {
      if (!ctx) return;
      ctx.clearRect(0, 0, W, H);

      const colorMember = Deck.rgb("member");
      const colorModel = Deck.rgb("model");
      const colorFocus = Deck.rgb("focus");
      const colorRule = Deck.rgb("rule");
      const colorSurface = Deck.rgb("surface");

      // 1. 绘制温和的背景阶段虚线分界与阶梯轴
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 6]);
      ctx.strokeStyle = `rgba(${colorRule.join(",")}, 0.35)`;
      STAGES.forEach((st) => {
        ctx.beginPath();
        ctx.moveTo(st.x, 80);
        ctx.lineTo(st.x, 820);
        ctx.stroke();
      });
      ctx.setLineDash([]);

      // 2. 逐轮学习器残差轨迹计算与绘制
      const startX = 680;
      const endX = 1470;
      const targetY = 450; // 居中收敛的平稳强学习器基线

      model.paths.forEach((p) => {
        ctx.beginPath();
        let started = false;

        for (let x = startX; x <= endX; x += 8) {
          const prog = (x - startX) / (endX - startX);
          const decay = Math.pow(1 - prog * 0.95, 2.3);
          const tOffset = time * 0.0006;
          const wave = Math.sin(x * p.freq1 + p.phase1 + tOffset) * p.initialAmp * 0.7 +
                       Math.cos(x * p.freq2 + p.phase2 - tOffset * 0.5) * p.initialAmp * 0.3;

          const currentCenter = Deck.lerp(p.baseY, targetY, Math.pow(prog, 1.35));
          const y = currentCenter + wave * decay;

          if (!started) {
            ctx.moveTo(x, y);
            started = true;
          } else {
            ctx.lineTo(x, y);
          }
        }

        ctx.lineWidth = 1.4;
        ctx.strokeStyle = `rgba(${colorMember.join(",")}, 0.32)`;
        ctx.stroke();
      });

      // 3. 聚合的主预测加法模型线 (深青粗线)
      ctx.beginPath();
      let mStarted = false;
      for (let x = startX; x <= endX; x += 6) {
        const prog = (x - startX) / (endX - startX);
        const tOffset = time * 0.0006;
        const wave = Math.sin(x * 0.01 + tOffset) * 32 * Math.pow(1 - prog, 1.8);
        const y = targetY + wave;
        if (!mStarted) {
          ctx.moveTo(x, y);
          mStarted = true;
        } else {
          ctx.lineTo(x, y);
        }
      }
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = Deck.token("--model");
      ctx.stroke();

      // 4. 在各接力节点绘制加法纠错标靶点与指示
      STAGES.forEach((st, idx) => {
        const ptY = targetY;

        ctx.fillStyle = Deck.token("--surface");
        ctx.beginPath();
        ctx.arc(st.x, ptY, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.lineWidth = 2.5;
        if (idx === STAGES.length - 1) {
          ctx.strokeStyle = Deck.token("--focus");
          ctx.fillStyle = Deck.token("--focus");
        } else {
          ctx.strokeStyle = Deck.token("--model");
          ctx.fillStyle = Deck.token("--model");
        }
        ctx.beginPath();
        ctx.arc(st.x, ptY, 8, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(st.x, ptY, 3, 0, Math.PI * 2);
        ctx.fill();

        // 轮数与累加符号标注
        ctx.font = "15px 'Latin Modern Mono', monospace";
        ctx.fillStyle = idx === STAGES.length - 1 ? Deck.token("--focus") : Deck.token("--muted");
        ctx.textAlign = "center";
        ctx.fillText(st.label, st.x, ptY - 22);

        if (idx < STAGES.length - 1) {
          const nextX = STAGES[idx + 1].x;
          const midX = (st.x + nextX) / 2;
          ctx.font = "15px 'Latin Modern Mono', monospace";
          ctx.fillStyle = Deck.token("--member");
          ctx.fillText("+ α h(x)", midX, ptY + 36);
        }
      });
    }

    function init() {
      ctx = Deck.fit(canvas);
      model = buildModel();

      Deck.init({ index: 13, total: 24, keys: false });

      if (Deck.reduced()) {
        render(3000);
      } else {
        stopLoop = Deck.loop(time => {
          render(time);
        }, { still: 3200 });
      }

      Deck.onResize(() => {
        ctx = Deck.fit(canvas);
        render(3200);
      });
    }

    init();
  })();
  </script>
</body>
</html>
