<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #E3E8E6;
      --text: #142A2D;
      --font-sans: "Noto Sans CJK SC", "WenQuanYi Zen Hei", "Droid Sans Fallback", sans-serif;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      contain: layout paint;
    }

    #field-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .cover-copy {
      position: absolute;
      z-index: 4;
      left: 112px;
      top: 320px;
      width: 580px;
      pointer-events: none;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: 600;
      line-height: var(--lh-tight);
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .lead-rule {
      width: 56px;
      height: var(--line-data);
      background: var(--model);
      margin-top: 28px;
      margin-bottom: 20px;
    }

    .lead-text {
      margin: 0;
      font-family: var(--font-sans);
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      max-width: 480px;
    }

    .strategy-nodes {
      position: absolute;
      z-index: 3;
      left: 1320px;
      top: 190px;
      width: 240px;
      height: 520px;
      pointer-events: none;
    }

    .node-label {
      position: absolute;
      font-family: var(--font-display);
      font-size: var(--fs-sec);
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .node-label.focus {
      color: var(--text);
      font-size: var(--fs-body);
      font-weight: 700;
    }

    .node-label.focus::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--focus);
      margin-right: 8px;
      vertical-align: middle;
    }
  </style>
</head>
<body data-page="20" data-total="24">
  <main id="stage" aria-labelledby="cover-title">
    <canvas id="field-canvas" class="cv-fill" aria-hidden="true"></canvas>

    <section class="cover-copy" aria-label="章节标题">
      <h1 id="cover-title">组合策略与方法选择</h1>
      <div class="lead-rule"></div>
      <p class="lead-text">从简单多数到元学习层，依数据特性裁定组合架构。</p>
    </section>

    <div class="strategy-nodes" aria-hidden="true">
      <div class="node-label" style="left: 0; top: 60px;">硬投票 / 软投票</div>
      <div class="node-label" style="left: 0; top: 240px;">加权平均</div>
      <div class="node-label focus" style="left: 0; top: 420px;">Stacking 堆叠</div>
    </div>
  </main>

  <aside class="notes" hidden>
    这一部分我们探讨集成的最终收尾与决策逻辑：在拥有了不同的基学习器后，如何将它们的预测结果合并为全局决策？我们将对比投票、加权平均与以 Stacking 为代表的元学习方案，并根据方差、偏差与数据规模选择适宜的集成路径。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      const WIDTH = 1600;
      const HEIGHT = 900;
      const SEED = 20240906;

      const canvas = document.getElementById("field-canvas");
      let ctx;

      function seededRandom(seed) {
        let s = seed >>> 0;
        return () => {
          s = (s * 1664525 + 1013904223) >>> 0;
          return s / 4294967296;
        };
      }

      // Title bounding box exclusion
      function insideTitle(x, y) {
        return x >= 80 && x <= 720 && y >= 280 && y <= 540;
      }

      // 3 Destination hubs on the right
      const HUBS = [
        { id: "voting", x: 1260, y: 260, focus: false },
        { id: "averaging", x: 1260, y: 440, focus: false },
        { id: "stacking", x: 1260, y: 620, focus: true }
      ];

      function buildTrajectories() {
        const rng = seededRandom(SEED);
        const trajectories = [];

        // 38 member learner paths starting from diverse locations on left/top/bottom
        const numPaths = 38;
        for (let i = 0; i < numPaths; i++) {
          const startY = 100 + rng() * 700;
          const startX = 60 + rng() * 160;
          
          // assign to one of the three hubs, with higher density converging into stacking
          const hubIdx = rng() < 0.45 ? 2 : (rng() < 0.5 ? 0 : 1);
          const hub = HUBS[hubIdx];

          // control points for bezier curve routed cleanly away from title area
          let cp1x, cp1y, cp2x, cp2y;

          if (startY < 400) {
            // route clearly above the title box
            cp1x = 380 + (rng() - 0.5) * 120;
            cp1y = 90 + rng() * 140;
          } else {
            // route clearly below the title box
            cp1x = 420 + (rng() - 0.5) * 140;
            cp1y = 600 + rng() * 180;
          }

          cp2x = 940 + (rng() - 0.5) * 180;
          cp2y = hub.y + (rng() - 0.5) * 110;

          trajectories.push({
            sx: startX,
            sy: startY,
            cp1x,
            cp1y,
            cp2x,
            cp2y,
            ex: hub.x,
            ey: hub.y,
            hubIdx,
            width: hub.focus ? 1.8 + rng() * 1.0 : 0.9 + rng() * 0.8,
            alpha: hub.focus ? 0.45 + rng() * 0.35 : 0.22 + rng() * 0.25,
            phase: rng() * Math.PI * 2,
            speed: 0.0004 + rng() * 0.0006
          });
        }

        return trajectories;
      }

      let model;

      function drawStaticGrid(context) {
        // Subtle blueprint/record lines consistent with the theme "冷色统计绘图膜配实墨线"
        const gridColor = Deck.rgba("rule", 0.18);
        context.strokeStyle = gridColor;
        context.lineWidth = 1;

        // Subtle coordinate tick markers
        for (let x = 200; x < WIDTH; x += 200) {
          context.beginPath();
          context.moveTo(x, 40);
          context.lineTo(x, 48);
          context.stroke();
          context.beginPath();
          context.moveTo(x, HEIGHT - 48);
          context.lineTo(x, HEIGHT - 40);
          context.stroke();
        }

        for (let y = 150; y < HEIGHT; y += 150) {
          context.beginPath();
          context.moveTo(60, y);
          context.lineTo(68, y);
          context.stroke();
          context.beginPath();
          context.moveTo(WIDTH - 68, y);
          context.lineTo(WIDTH - 60, y);
          context.stroke();
        }
      }

      function drawTrajectories(context, time) {
        const memberColor = Deck.rgb("member");
        const modelColor = Deck.rgb("model");
        const focusColor = Deck.rgb("focus");

        // 1. Draw subtle background flow lines
        for (const tr of model) {
          context.beginPath();
          context.moveTo(tr.sx, tr.sy);
          context.bezierCurveTo(tr.cp1x, tr.cp1y, tr.cp2x, tr.cp2y, tr.ex, tr.ey);

          const col = tr.hubIdx === 2 ? modelColor : memberColor;
          context.strokeStyle = `rgba(${col[0]}, ${col[1]}, ${col[2]}, ${tr.alpha})`;
          context.lineWidth = tr.width;
          context.stroke();
        }

        // 2. Draw converging packets along curves
        for (const tr of model) {
          const t = (tr.phase + time * tr.speed) % 1;
          // cubic bezier evaluation
          const mt = 1 - t;
          const mt2 = mt * mt;
          const mt3 = mt2 * mt;
          const t2 = t * t;
          const t3 = t2 * t;

          const px = mt3 * tr.sx + 3 * mt2 * t * tr.cp1x + 3 * mt * t2 * tr.cp2x + t3 * tr.ex;
          const py = mt3 * tr.sy + 3 * mt2 * t * tr.cp1y + 3 * mt * t2 * tr.cp2y + t3 * tr.ey;

          if (!insideTitle(px, py)) {
            const dotCol = tr.hubIdx === 2 ? Deck.rgb("focus") : memberColor;
            context.fillStyle = `rgba(${dotCol[0]}, ${dotCol[1]}, ${dotCol[2]}, ${0.6 + 0.4 * t})`;
            context.beginPath();
            context.arc(px, py, tr.hubIdx === 2 ? 3 : 2, 0, Math.PI * 2);
            context.fill();
          }
        }

        // 3. Draw Hub targets and convergence anchors
        HUBS.forEach((hub, idx) => {
          // outer ring
          context.strokeStyle = hub.focus ? Deck.rgba("focus", 0.8) : Deck.rgba("rule", 0.4);
          context.lineWidth = hub.focus ? 2.5 : 1.5;
          context.beginPath();
          context.arc(hub.x, hub.y, 14, 0, Math.PI * 2);
          context.stroke();

          // center dot
          context.fillStyle = hub.focus ? Deck.rgba("focus", 0.9) : Deck.rgba("member", 0.7);
          context.beginPath();
          context.arc(hub.x, hub.y, hub.focus ? 5 : 3.5, 0, Math.PI * 2);
          context.fill();

          // lead-in indicator line
          context.strokeStyle = hub.focus ? Deck.rgba("focus", 0.5) : Deck.rgba("rule", 0.3);
          context.beginPath();
          context.moveTo(hub.x + 18, hub.y);
          context.lineTo(hub.x + 36, hub.y);
          context.stroke();
        });
      }

      function draw(time) {
        if (!ctx) return;
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        drawStaticGrid(ctx);
        drawTrajectories(ctx, time);
      }

      function init() {
        ctx = Deck.fit(canvas);
        model = buildTrajectories();
        Deck.loop(draw, { still: 1500 });
      }

      Deck.init({ title: "组合策略与方法选择", keys: false });
      init();
      Deck.onResize(() => {
        ctx = Deck.fit(canvas);
      });
    })();
  </script>
</body>
</html>
