<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .cv-fill {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .cover-copy {
      position: absolute;
      left: var(--pad-x);
      top: 180px;
      width: 660px;
      z-index: 3;
      pointer-events: none;
    }

    .cover-title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: var(--weight-bold);
      line-height: var(--lh-tight);
      letter-spacing: -0.02em;
      color: var(--text);
      margin: 0;
    }

    .cover-lead {
      margin: 24px 0 0 0;
      font-family: var(--font-sans);
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      max-width: 540px;
    }

    .metric-rail {
      position: absolute;
      left: var(--pad-x);
      bottom: 56px;
      display: flex;
      gap: 40px;
      z-index: 3;
      font-family: var(--font-sans);
    }

    .metric-unit {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .metric-value {
      font-family: var(--font-numeric);
      font-size: var(--fs-h2);
      font-weight: var(--weight-bold);
      color: var(--aggregate);
      line-height: 1;
    }

    .metric-label {
      font-size: var(--fs-label);
      color: var(--text);
      line-height: 1.2;
    }
  </style>
</head>
<body data-page="05" data-total="26">
  <div id="stage">
    <canvas id="tree-field" class="cv-fill"></canvas>

    <header class="cover-copy">
      <h1 class="cover-title">Bagging 与随机森林</h1>
      <p class="cover-lead">通过自助采样与特征扰动并行构建基学习器，最终聚合为高稳定度的集成决策。</p>
    </header>

    <div class="metric-rail">
      <div class="metric-unit">
        <span class="metric-value">Bootstrap</span>
        <span class="metric-label">样本有放回重抽样</span>
      </div>
      <div class="metric-unit">
        <span class="metric-value">Random Subspace</span>
        <span class="metric-label">节点特征随机子集</span>
      </div>
      <div class="metric-unit">
        <span class="metric-value">Majority / Mean</span>
        <span class="metric-label">并行聚合抵消单树方差</span>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    这一章我们将进入集成学习中最实用、最广泛落地的第一大支柱：Bagging 与随机森林。
    前面的导引中我们看到，单棵决策树容易在局部过拟合，产生很大的方差。
    而这一章的核心逻辑，就是用自助抽样生成多样化的训练集，再进一步引入特征划分的随机性，
    并行生长出一整座由相互弱相关的决策树构成的森林，最终用简单平均或多数投票收敛为稳健的判断。
  </aside>

  <script src="assets/base.js"></script>
  <script src="assets/lib/seedrandom.min.js"></script>
  <script>
    (() => {
      "use strict";

      Deck.init({ index: 5, total: 26, keys: false });

      const canvas = document.getElementById("tree-field");
      if (!canvas) return;

      const SEED = "bagging-rf-cover-seed-2025";
      const rng = new Math.seedrandom(SEED);

      // Title exclusion zone in 1600x900 coordinates
      function inTitleZone(x, y) {
        return (x < 690 && y > 150 && y < 540);
      }

      function inMetricZone(x, y) {
        return (x < 720 && y > 760);
      }

      function buildForest() {
        const trees = [];
        // Several decision trees fanning out on the right side of the canvas
        // (x from 760 to 1500, roots at bottom y ≈ 780, growing upwards towards y ≈ 260)
        const roots = [
          { x: 810, y: 780, angle: -Math.PI / 2 - 0.16, depth: 5, spread: 0.38, len: 96, alpha: 0.45 },
          { x: 970, y: 780, angle: -Math.PI / 2 - 0.05, depth: 5, spread: 0.40, len: 104, alpha: 0.55 },
          { x: 1130, y: 780, angle: -Math.PI / 2 + 0.06, depth: 5, spread: 0.38, len: 100, alpha: 0.6 },
          { x: 1290, y: 780, angle: -Math.PI / 2 + 0.18, depth: 5, spread: 0.42, len: 94, alpha: 0.5 },
          { x: 1440, y: 780, angle: -Math.PI / 2 + 0.30, depth: 5, spread: 0.44, len: 88, alpha: 0.4 }
        ];

        const branches = [];
        const leaves = [];
        const aggregationPaths = [];

        roots.forEach((root, treeIdx) => {
          function grow(x, y, angle, length, depth, width) {
            if (depth <= 0) {
              leaves.push({ x, y, treeIdx });
              return;
            }

            const nx = x + Math.cos(angle) * length;
            const ny = y + Math.sin(angle) * length;

            branches.push({
              x1: x, y1: y,
              x2: nx, y2: ny,
              width: width,
              treeIdx: treeIdx,
              depth: depth
            });

            // Feature split branching: 2 children
            const spread = root.spread * (0.85 + rng() * 0.3);
            const lScale = 0.74 + rng() * 0.12;

            grow(nx, ny, angle - spread, length * lScale, depth - 1, Math.max(1, width * 0.7));
            grow(nx, ny, angle + spread, length * lScale, depth - 1, Math.max(1, width * 0.7));
          }

          grow(root.x, root.y, root.angle, root.len, root.depth, 4.5);
        });

        // Representative convergence lines: gathering leaves into the top-right consensus stream
        const focusHub = { x: 1360, y: 150 };
        leaves.forEach((lf, idx) => {
          if (idx % 2 === 0) {
            aggregationPaths.push({
              x1: lf.x, y1: lf.y,
              cx: (lf.x + focusHub.x) / 2 + (rng() - 0.5) * 40,
              cy: Math.min(lf.y, focusHub.y) - 20,
              x2: focusHub.x,
              y2: focusHub.y,
              treeIdx: lf.treeIdx
            });
          }
        });

        return { branches, leaves, aggregationPaths, focusHub };
      }

      const forest = buildForest();

      function draw(ctx) {
        ctx.clearRect(0, 0, Deck.W, Deck.H);

        const modelColor = Deck.rgb("model");
        const aggColor = Deck.rgb("aggregate");
        const focusColor = Deck.rgb("focus");
        const lineColor = Deck.rgb("line");

        // 1. Draw coordinate / calibration grid ticks (very faint)
        ctx.strokeStyle = `rgba(${lineColor.join(",")}, 0.12)`;
        ctx.lineWidth = 1;
        for (let x = 750; x < 1550; x += 120) {
          ctx.beginPath();
          ctx.moveTo(x, 80);
          ctx.lineTo(x, 820);
          ctx.stroke();
        }
        for (let y = 140; y < 820; y += 120) {
          ctx.beginPath();
          ctx.moveTo(750, y);
          ctx.lineTo(1550, y);
          ctx.stroke();
        }

        // 2. Draw tree branches
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        forest.branches.forEach(b => {
          ctx.beginPath();
          ctx.moveTo(b.x1, b.y1);
          ctx.lineTo(b.x2, b.y2);
          const alpha = 0.22 + (b.depth / 6) * 0.45;
          ctx.strokeStyle = `rgba(${modelColor.join(",")}, ${alpha})`;
          ctx.lineWidth = b.width;
          ctx.stroke();
        });

        // 3. Draw leaves (leaf nodes of individual estimators)
        forest.leaves.forEach(lf => {
          ctx.beginPath();
          ctx.arc(lf.x, lf.y, 2.8, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${modelColor.join(",")}, 0.75)`;
          ctx.fill();
        });

        // 4. Draw consensus / aggregation curved streams flowing into aggregate hub
        ctx.lineWidth = 1.2;
        forest.aggregationPaths.forEach(p => {
          ctx.beginPath();
          ctx.moveTo(p.x1, p.y1);
          ctx.quadraticCurveTo(p.cx, p.cy, p.x2, p.y2);
          ctx.strokeStyle = `rgba(${aggColor.join(",")}, 0.3)`;
          ctx.stroke();
        });

        // 5. Aggregate hub (ensemble consensus)
        const hub = forest.focusHub;
        // Strong convergence pulse
        ctx.beginPath();
        ctx.arc(hub.x, hub.y, 16, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${aggColor.join(",")}, 0.18)`;
        ctx.fill();
        ctx.strokeStyle = `rgba(${aggColor.join(",")}, 0.65)`;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(hub.x, hub.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${focusColor.join(",")}, 0.9)`;
        ctx.fill();

        // Label for Aggregate Consensus
        ctx.font = "500 15px Noto Sans CJK SC, sans-serif";
        ctx.fillStyle = `rgba(${aggColor.join(",")}, 0.95)`;
        ctx.textAlign = "right";
        ctx.fillText("集成收束 / 集体共识", hub.x - 30, hub.y + 5);
        ctx.textAlign = "left";

        // Calibration badge / baseline
        ctx.font = "400 13px Lato, sans-serif";
        ctx.fillStyle = `rgba(${lineColor.join(",")}, 0.8)`;
        ctx.fillText("B = 5 TREES · SUBSPACE m ≈ √p", 810, 805);
      }

      Deck.autofit(canvas, draw);
    })();
  </script>
</body>
</html>
