  <style>
    :root {

      background: var(--bg);

      box-sizing: border-box;
      padding: var(--pad-y) var(--pad-x);
    }

    #flow-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .cover-content {
      position: relative;
      z-index: 3;
      width: 580px;
      margin-top: 180px;
      pointer-events: none;
    }

    .chapter-tag {
      display: inline-block;
      font-family: var(--font-numeric);
      font-size: var(--fs-label);
      font-weight: var(--weight-medium);
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1.cover-title {
      margin: 0 0 24px 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      font-weight: var(--weight-bold);
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .cover-lead {
      margin: 0;
      font-family: var(--font-sans);
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);

    }

    .metrics-anchor {
      position: absolute;
      right: var(--pad-x);

      gap: 36px;

    }

    .metric-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .metric-label {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      color: var(--muted);
      font-weight: var(--weight-regular);
    }

    .metric-val {
      font-family: var(--font-numeric);
      font-size: var(--fs-h2);
      color: var(--aggregate);
      font-weight: var(--weight-bold);
    }
  </style>
</head>
<body data-page="21" data-total="26">
  <div id="stage">
    <canvas id="flow-canvas" class="cv-fill no-pan" aria-hidden="true"></canvas>

    <div class="cover-content">
      <span class="chapter-tag">PART 04 · ENSEMBLE LEARNING</span>
      <h1 class="cover-title">选择、评估与拓展</h1>
      <p class="cover-lead">多样分支汇流为稳定共识：在方差、偏差与计算开销之间建立系统权衡。</p>
    </div>

    <div class="metrics-anchor">
      <div class="metric-item">
        <span class="metric-label">分支路径</span>
        <span class="metric-val">64</span>
      </div>
      <div class="metric-item">
        <span class="metric-label">收束层级</span>
        <span class="metric-val">Stacking</span>
      </div>
      <div class="metric-item">
        <span class="metric-label">评估准则</span>
        <span class="metric-val">Out-of-Fold</span>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    欢迎来到第四部分：选择、评估与拓展。
    在前两部分，我们分别剖析了以降低方差为主的 Bagging 与随机森林，以及以降低偏差为主的 Boosting 家族。
    现在，我们要从更宏观的视角审视整个集成学习体系：面对具体任务时，究竟该如何选择算法？
    如何设计严格防止数据泄漏的交叉验证与评估方案？
    以及如何通过 Stacking 将异构模型结合起来，构建更强大的元学习架构。
  </aside>

  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";
      Deck.init({ index: 21, total: 26, keys: false });

      const canvas = document.getElementById("flow-canvas");
      const SEED = "ensemble-eval-part4";
      const W = 1600;
      const H = 900;
      const TITLE_ZONE = { x: 0, y: 0, w: 720, h: 560 };

      let ctx = null;
      let staticBuffer = null;
      let staticCtx = null;
      let streams = [];
      let stopLoop = null;

      // Token colors from theme
      const colModel = Deck.rgb("model") || [46, 95, 120];
      const colAggregate = Deck.rgb("aggregate") || [23, 62, 80];
      const colLine = Deck.rgb("line") || [116, 129, 124];
      const colFocus = Deck.rgb("focus") || [198, 75, 46];

      function buildPaths() {
        const rng = new Math.seedrandom(SEED);
        streams = [];

        // Focus convergence hub
        const targetX = 1380;
        const targetY = 460;

        const count = 64;
        for (let i = 0; i < count; i++) {
          // Origins: disperse from left/middle rightwards
          const startX = 520 + rng() * 420;
          const startY = 60 + rng() * 780;

          // Check title exclusion: keep away from deep title zone
          if (startX < TITLE_ZONE.w && startY < TITLE_ZONE.h) {
            continue;
          }

          const midX1 = startX + 180 + rng() * 120;
          const midY1 = startY + (rng() - 0.5) * 160;

          const midX2 = 1050 + rng() * 120;
          const midY2 = targetY + (startY - targetY) * 0.28 + (rng() - 0.5) * 60;

          const endX = targetX + (rng() - 0.5) * 30;
          const endY = targetY + (rng() - 0.5) * 40;

          // Points sampled along cubic Bezier
          const pts = [];
          const steps = 48;
          for (let s = 0; s <= steps; s++) {
            const t = s / steps;
            const it = 1 - t;
            const px = it * it * it * startX + 3 * it * it * t * midX1 + 3 * it * t * t * midX2 + t * t * t * endX;
            const py = it * it * it * startY + 3 * it * it * t * midY1 + 3 * it * t * t * midY2 + t * t * t * endY;
            pts.push({ x: px, y: py });
          }

          const isFocus = (i === 18 || i === 42);
          const isDeep = rng() > 0.6;

          streams.push({
            pts,
            isFocus,
            isDeep,
            alpha: 0.12 + rng() * 0.22,
            width: isFocus ? 2.2 : (0.7 + rng() * 1.4),
            offset: rng(),
            speed: 0.00018 + rng() * 0.00015
          });
        }
      }

      function renderStatic() {
        if (!staticBuffer) {
          staticBuffer = document.createElement("canvas");
          staticBuffer.width = W;
          staticBuffer.height = H;
          staticCtx = staticBuffer.getContext("2d");
        }

        staticCtx.clearRect(0, 0, W, H);

        // Draw convergent spine
        staticCtx.lineCap = "round";
        staticCtx.lineJoin = "round";

        // Background subtle grid/lines for blueprint feel
        staticCtx.strokeStyle = `rgba(${colLine.join(",")}, 0.12)`;
        staticCtx.lineWidth = 1;
        for (let y = 140; y < H; y += 160) {
          staticCtx.beginPath();
          staticCtx.moveTo(480, y);
          staticCtx.lineTo(W - 40, y);
          staticCtx.stroke();
        }

        // Draw all individual stream lines
        for (const st of streams) {
          staticCtx.beginPath();
          const p0 = st.pts[0];
          staticCtx.moveTo(p0.x, p0.y);
          for (let i = 1; i < st.pts.length; i++) {
            staticCtx.lineTo(st.pts[i].x, st.pts[i].y);
          }

          if (st.isFocus) {
            staticCtx.strokeStyle = `rgba(${colFocus.join(",")}, 0.45)`;
            staticCtx.lineWidth = st.width;
          } else if (st.isDeep) {
            staticCtx.strokeStyle = `rgba(${colAggregate.join(",")}, ${st.alpha * 1.2})`;
            staticCtx.lineWidth = st.width;
          } else {
            staticCtx.strokeStyle = `rgba(${colModel.join(",")}, ${st.alpha})`;
            staticCtx.lineWidth = st.width;
          }
          staticCtx.stroke();
        }

        // Target convergence trunk (deep aggregate consensus line)
        staticCtx.beginPath();
        staticCtx.moveTo(1360, 460);
        staticCtx.lineTo(1540, 460);
        staticCtx.strokeStyle = `rgba(${colAggregate.join(",")}, 0.85)`;
        staticCtx.lineWidth = 6;
        staticCtx.stroke();

        // Node circle at aggregation
        staticCtx.beginPath();
        staticCtx.arc(1380, 460, 7, 0, Math.PI * 2);
        staticCtx.fillStyle = `rgb(${colAggregate.join(",")})`;
        staticCtx.fill();

        staticCtx.beginPath();
        staticCtx.arc(1380, 460, 16, 0, Math.PI * 2);
        staticCtx.strokeStyle = `rgba(${colFocus.join(",")}, 0.5)`;
        staticCtx.lineWidth = 1.5;
        staticCtx.stroke();
      }

      function drawFrame(time) {
        if (!ctx) return;
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(staticBuffer, 0, 0, W, H);

        // Animated light particles traveling along convergent paths
        for (let i = 0; i < streams.length; i++) {
          const st = streams[i];
          const progress = (st.offset + time * st.speed) % 1;
          const idx = Math.min(st.pts.length - 1, Math.floor(progress * (st.pts.length - 1)));
          const pt = st.pts[idx];

          if (pt) {
            ctx.beginPath();
            const radius = st.isFocus ? 3.5 : 2;
            ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
            if (st.isFocus) {
              ctx.fillStyle = `rgba(${colFocus.join(",")}, 0.85)`;
            } else {
              ctx.fillStyle = `rgba(${colModel.join(",")}, 0.65)`;
            }
            ctx.fill();
          }
        }
      }

      function init() {
        ctx = Deck.fit(canvas);
        buildPaths();
        renderStatic();
        drawFrame(1200);

        if (!Deck.reduced()) {
          stopLoop = Deck.loop(time => {
            drawFrame(time);
          }, { still: 1500 });
        }
      }

      Deck.onResize(() => {
        ctx = Deck.fit(canvas);
        drawFrame(1200);
      });

      init();
    })();
  </script>
</body>
</html>
