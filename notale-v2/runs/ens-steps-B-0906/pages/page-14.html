<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* 不覆盖 #stage 默认 padding，维持版心规范 */
    .field-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    .cover-copy {
      position: absolute;
      left: 108px;
      top: 260px;
      width: 580px;
      z-index: 5;
      pointer-events: none;
    }
    .kicker {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      font-weight: var(--weight-medium);
      color: var(--focus);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 72px;
      font-weight: var(--weight-bold);
      line-height: var(--lh-tight);
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .lead {
      margin: 36px 0 0 0;
      font-family: var(--font-sans);
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      max-width: 480px;
    }
    .meta-metrics {
      position: absolute;
      left: 108px;
      bottom: 84px;
      z-index: 5;
      display: flex;
      gap: 56px;
      pointer-events: none;
    }
    .metric-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .metric-val {
      font-family: var(--font-numeric);
      font-size: var(--fs-h2);
      font-weight: var(--weight-bold);
      color: var(--aggregate);
    }
    .metric-label {
      font-family: var(--font-sans);
      font-size: var(--fs-tick);
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .field-legend {
      position: absolute;
      right: 96px;
      bottom: 84px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 32px;
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      color: var(--muted);
      pointer-events: none;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .legend-line {
      width: 26px;
      height: 2px;
    }
  </style>
</head>
<body data-page="14" data-total="26">
  <div id="stage">
    <canvas id="field" class="field-canvas" aria-hidden="true"></canvas>

    <header class="cover-copy">
      <div class="kicker">Boosting · 串行提升</div>
      <h1>Boosting<br>与 AdaBoost</h1>
      <p class="lead">通过错分赋权与加权表决，将弱学习器串行提升为强分类器。</p>
    </header>

    <div class="meta-metrics">
      <div class="metric-col">
        <span class="metric-val">串行迭代</span>
        <span class="metric-label">聚焦高权错分样本</span>
      </div>
      <div class="metric-col">
        <span class="metric-val">加权表决</span>
        <span class="metric-label">依准确率分配权重</span>
      </div>
    </div>

    <div class="field-legend">
      <div class="legend-item">
        <span class="legend-dot" style="background: var(--focus);"></span>
        <span>高权焦点样本</span>
      </div>
      <div class="legend-item">
        <span class="legend-line" style="background: var(--model); opacity: 0.45;"></span>
        <span>基学习器轨迹</span>
      </div>
      <div class="legend-item">
        <span class="legend-line" style="background: var(--aggregate); height: 3px;"></span>
        <span>集成收敛轴</span>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    这一章我们进入集成学习的第二个重要流派：Boosting，并以经典的 AdaBoost 为例展开剖析。
    前面学过的 Bagging 是并行独立的，而 Boosting 则是串行迭代的：每一轮新基学习器都会根据上一轮的误差表现，重点关注那些被错分的样本。
    最后，各分类器再依照可信度进行加权表决，汇聚成更准确的强分类器。
  </aside>

  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      const SEED = "adaboost-chapter-14";
      const canvas = document.getElementById("field");
      let ctx;

      Deck.init({ index: 14, total: 26, keys: false });

      // Title exclusion zone in logical coordinates
      const TITLE_ZONE = {
        x1: 70,
        y1: 200,
        x2: 680,
        y2: 560
      };

      function insideTitle(x, y, pad = 20) {
        return x >= TITLE_ZONE.x1 - pad &&
               x <= TITLE_ZONE.x2 + pad &&
               y >= TITLE_ZONE.y1 - pad &&
               y <= TITLE_ZONE.y2 + pad;
      }

      function drawCover(context) {
        const rng = new Math.seedrandom(SEED);
        const w = 1600;
        const h = 900;

        context.clearRect(0, 0, w, h);

        // Grid paper texture ticks
        context.strokeStyle = Deck.rgba("line", 0.12);
        context.lineWidth = 1;
        for (let x = 60; x < w; x += 80) {
          context.beginPath();
          context.moveTo(x, 40);
          context.lineTo(x, h - 40);
          context.stroke();
        }
        for (let y = 60; y < h; y += 80) {
          context.beginPath();
          context.moveTo(40, y);
          context.lineTo(w - 40, y);
          context.stroke();
        }

        // Boosting targets (attractors): high-weight error nodes
        const highWeightNodes = [
          { x: 920, y: 310, r: 24, w: 3.2, label: "x₃" },
          { x: 1220, y: 260, r: 18, w: 2.4, label: "x₇" },
          { x: 1380, y: 520, r: 28, w: 4.1, label: "x₁₂" },
          { x: 1080, y: 640, r: 22, w: 2.8, label: "x₁₅" },
          { x: 790, y: 520, r: 16, w: 1.9, label: "x₂" }
        ];

        // Ordinary background sample points (low weight)
        const lowWeightNodes = [];
        for (let i = 0; i < 48; i++) {
          const px = 720 + rng() * 820;
          const py = 100 + rng() * 700;
          if (!insideTitle(px, py, 30)) {
            lowWeightNodes.push({ x: px, y: py, r: 3 + rng() * 2 });
          }
        }

        // Draw low-weight nodes
        context.fillStyle = Deck.rgba("model", 0.28);
        for (const pt of lowWeightNodes) {
          context.beginPath();
          context.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
          context.fill();
        }

        // Draw sequential boosting paths:
        // Individual weak learners (thin blue paths) exploring, bending towards high-weight nodes
        const stages = [
          { originX: 740, originY: 220, targetIdx: 0, alpha: 0.42, lw: 1.8 },
          { originX: 840, originY: 160, targetIdx: 1, alpha: 0.38, lw: 1.6 },
          { originX: 720, originY: 420, targetIdx: 4, alpha: 0.45, lw: 2.0 },
          { originX: 860, originY: 720, targetIdx: 3, alpha: 0.40, lw: 1.8 },
          { originX: 1120, originY: 750, targetIdx: 2, alpha: 0.44, lw: 2.2 }
        ];

        // Draw multiple sequential traces weaving through nodes
        for (let i = 0; i < 18; i++) {
          const startX = 720 + rng() * 100;
          const startY = 220 + (i / 18) * 460 + (rng() - 0.5) * 40;

          context.beginPath();
          context.moveTo(startX, startY);

          // Route sequentially: pick two targets along the flow
          const pick1 = highWeightNodes[i % 3];
          const pick2 = highWeightNodes[2 + (i % 3)];
          const endX = 1460 + rng() * 60;
          const endY = 260 + (i / 18) * 380 + (rng() - 0.5) * 40;

          const cp1x = startX + (pick1.x - startX) * 0.5;
          const cp1y = startY + (pick1.y - startY) * 0.3;
          const cp2x = pick1.x + (pick2.x - pick1.x) * 0.5;
          const cp2y = pick1.y + (pick2.y - pick1.y) * 0.4;

          const midX = (pick1.x + pick2.x) / 2;
          const midY = (pick1.y + pick2.y) / 2;

          context.bezierCurveTo(cp1x, cp1y, pick1.x, pick1.y, midX, midY);
          context.bezierCurveTo(cp2x, cp2y, pick2.x, pick2.y, endX, endY);

          context.strokeStyle = Deck.rgba("model", 0.18 + (i % 4) * 0.07);
          context.lineWidth = 1.2 + (i % 3) * 0.4;
          context.stroke();
        }

        // Draw thick Aggregate Consensus Trajectory (Theme signature)
        // A bold deep-blue spine aggregating from multiple stages into final decision bound
        context.beginPath();
        const mainWaypoints = [
          { x: 740, y: 460 },
          { x: 920, y: 310 },
          { x: 1080, y: 480 },
          { x: 1220, y: 260 },
          { x: 1380, y: 520 },
          { x: 1510, y: 450 }
        ];

        context.moveTo(mainWaypoints[0].x, mainWaypoints[0].y);
        for (let j = 1; j < mainWaypoints.length - 1; j++) {
          const xc = (mainWaypoints[j].x + mainWaypoints[j+1].x) / 2;
          const yc = (mainWaypoints[j].y + mainWaypoints[j+1].y) / 2;
          context.quadraticCurveTo(mainWaypoints[j].x, mainWaypoints[j].y, xc, yc);
        }
        context.lineTo(mainWaypoints[mainWaypoints.length - 1].x, mainWaypoints[mainWaypoints.length - 1].y);

        // Core aggregate path with halo
        context.strokeStyle = Deck.rgba("aggregate", 0.18);
        context.lineWidth = 10;
        context.lineCap = "round";
        context.lineJoin = "round";
        context.stroke();

        context.strokeStyle = Deck.rgba("aggregate", 0.88);
        context.lineWidth = 3.6;
        context.stroke();

        // Draw focal high-weight nodes (AdaBoost error-boosted samples)
        for (const node of highWeightNodes) {
          // Weight halo (uncertain / focus aura)
          const grad = context.createRadialGradient(node.x, node.y, 4, node.x, node.y, node.r * 1.8);
          grad.addColorStop(0, Deck.rgba("focus", 0.32));
          grad.addColorStop(1, Deck.rgba("focus", 0));
          context.fillStyle = grad;
          context.beginPath();
          context.arc(node.x, node.y, node.r * 1.8, 0, Math.PI * 2);
          context.fill();

          // Outer ring
          context.strokeStyle = Deck.rgba("focus", 0.85);
          context.lineWidth = 2.2;
          context.beginPath();
          context.arc(node.x, node.y, node.r, 0, Math.PI * 2);
          context.stroke();

          // Solid center
          context.fillStyle = Deck.rgba("focus", 0.95);
          context.beginPath();
          context.arc(node.x, node.y, 5, 0, Math.PI * 2);
          context.fill();

          // Label
          context.font = "500 13px " + Deck.token("font-numeric");
          context.fillStyle = Deck.token("text");
          context.fillText(`w = ${node.w}`, node.x + node.r + 6, node.y + 4);
        }

        // Step arrow indicator on consensus path
        const arrowX = 1460;
        const arrowY = 465;
        context.fillStyle = Deck.token("aggregate");
        context.beginPath();
        context.moveTo(arrowX, arrowY - 7);
        context.lineTo(arrowX + 16, arrowY);
        context.lineTo(arrowX, arrowY + 7);
        context.closePath();
        context.fill();
      }

      function rebuild() {
        ctx = Deck.fit(canvas);
        if (ctx) drawCover(ctx);
      }

      window.addEventListener("pagehide", () => {}, { once: true });
      Deck.onResize(rebuild);
      rebuild();
    })();
  </script>
</body>
</html>
