<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      position: relative;
      width: var(--stage-w, 1600px);
      height: var(--stage-h, 900px);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    #flow-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .cover-content {
      position: absolute;
      left: 112px;
      top: 280px;
      width: 620px;
      z-index: 5;
      pointer-events: none;
    }

    .section-tag {
      font-family: var(--font-numeric);
      font-size: var(--fs-sec);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--focus);
      margin-bottom: 22px;
      font-weight: var(--weight-bold);
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      font-weight: var(--weight-bold);
      color: var(--aggregate);
      letter-spacing: 0.02em;
    }

    .lead-copy {
      margin: 28px 0 0 0;
      font-family: var(--font-sans);
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      max-width: 520px;
    }

    .legend-panel {
      position: absolute;
      left: 112px;
      bottom: 84px;
      z-index: 5;
      display: flex;
      gap: 36px;
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      color: var(--muted);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .legend-line {
      width: 28px;
      height: 2px;
      background: var(--model);
      opacity: 0.75;
    }

    .legend-line.aggregate {
      height: 4px;
      background: var(--aggregate);
      opacity: 1;
    }

    .legend-line.focus {
      height: 2px;
      background: var(--focus);
      opacity: 1;
    }
  </style>
</head>
<body data-page="21" data-total="26">
  <div id="stage">
    <canvas id="flow-canvas" class="cv-fill" aria-hidden="true"></canvas>

    <div class="cover-content">
      <div class="section-tag">Part IV</div>
      <h1>选择、评估与拓展</h1>
      <p class="lead-copy">面对具体问题、噪声与算力约束，在方差、偏差与组合机制之间完成定夺。</p>
    </div>

    <div class="legend-panel">
      <span class="legend-item">
        <span class="legend-line"></span>基策略路径
      </span>
      <span class="legend-item">
        <span class="legend-line aggregate"></span>聚合决策中轴
      </span>
      <span class="legend-item">
        <span class="legend-line focus"></span>验证与评估探针
      </span>
    </div>
  </div>

  <aside class="notes" hidden>
    进入第四部分：选择、评估与拓展。
    在前两节中，我们分别掌握了以降低方差见长的 Bagging 与逐轮纠偏的 Boosting。
    但在实际工程应用中，我们不仅要在这两类机制间权衡取舍，还需要严格防范数据泄漏、
    理解 Stacking 的多层泛化思想，并在异构数据与算力约束下做出最优工程选型。
  </aside>

  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      const SEED = "ensemble-part4-selection-2025";
      const canvas = document.getElementById("flow-canvas");
      let ctx = null;
      let stopLoop = () => {};

      // 标题排除保护区（逻辑坐标）
      const TITLE_ZONE = {
        left: 60,
        right: 760,
        top: 200,
        bottom: 640
      };

      function inTitleZone(x, y) {
        return x >= TITLE_ZONE.left && x <= TITLE_ZONE.right && y >= TITLE_ZONE.top && y <= TITLE_ZONE.bottom;
      }

      // 模拟多策略汇流生成系统
      function buildTrajectories() {
        const rng = new Math.seedrandom(SEED);
        const branches = [];
        const numBranches = 42;

        // 源起右侧分散的基模型决策，向中左汇聚，收束至集成中轴
        for (let i = 0; i < numBranches; i++) {
          const startX = 1640;
          const startY = 40 + (i / numBranches) * 820 + (rng() - 0.5) * 30;
          
          const points = [];
          const targetX = 1120 + (rng() - 0.5) * 80;
          const targetY = 450 + (rng() - 0.5) * 160;

          const steps = 140;
          for (let s = 0; s <= steps; s++) {
            const t = s / steps;
            
            // 贝塞尔式汇聚曲线
            const cx = (1 - t) * startX + t * (targetX - (1 - t) * 180);
            const cy = (1 - t) * startY + t * targetY + Math.sin(t * Math.PI * 1.8 + i * 0.4) * 24 * (1 - t);

            let px = cx;
            let py = cy;
            if (t > 0.6) {
              const post = (t - 0.6) / 0.4;
              px = cx - post * 360;
              py = cy + post * (240 - (startY - 450) * 0.45);
            }

            points.push({ x: px, y: py });
          }

          branches.push({
            points,
            width: 0.9 + rng() * 1.3,
            alpha: 0.2 + rng() * 0.28,
            isCore: i >= 18 && i <= 24,
            speed: 0.0004 + rng() * 0.00025,
            phase: rng()
          });
        }

        // 主干聚合轨迹
        const spinePoints = [];
        for (let s = 0; s <= 120; s++) {
          const t = s / 120;
          const x = 1620 - t * 860;
          const y = 490 + Math.sin(t * Math.PI * 1.4) * 60 + (t * 60);
          spinePoints.push({ x, y });
        }

        return { branches, spinePoints };
      }

      let model = null;

      function render(time) {
        if (!ctx) return;
        const w = 1600;
        const h = 900;

        ctx.clearRect(0, 0, w, h);

        const modelColor = Deck.rgb("model") || [46, 95, 120];
        const aggColor = Deck.rgb("aggregate") || [23, 62, 80];
        const focusColor = Deck.rgb("focus") || [198, 75, 46];
        const mutedColor = Deck.rgb("muted") || [70, 83, 79];

        // 1. 绘制个体模型分散流动线
        for (const b of model.branches) {
          ctx.beginPath();
          let drawing = false;
          for (let p of b.points) {
            if (inTitleZone(p.x, p.y)) {
              drawing = false;
              continue;
            }
            if (!drawing) {
              ctx.moveTo(p.x, p.y);
              drawing = true;
            } else {
              ctx.lineTo(p.x, p.y);
            }
          }
          ctx.strokeStyle = `rgba(${modelColor.join(",")}, ${b.alpha})`;
          ctx.lineWidth = b.width;
          ctx.stroke();
        }

        // 2. 绘制聚合主干（粗中轴带）
        ctx.beginPath();
        let spineDrawing = false;
        for (let p of model.spinePoints) {
          if (inTitleZone(p.x, p.y)) {
            spineDrawing = false;
            continue;
          }
          if (!spineDrawing) {
            ctx.moveTo(p.x, p.y);
            spineDrawing = true;
          } else {
            ctx.lineTo(p.x, p.y);
          }
        }
        ctx.strokeStyle = `rgba(${aggColor.join(",")}, 0.85)`;
        ctx.lineWidth = 4.5;
        ctx.stroke();

        // 3. 绘制汇聚决策节点（验证与决策门限结构）
        const evalNodes = [
          { x: 1260, y: 390, label: "泛化评估" },
          { x: 1060, y: 485, label: "折外堆叠" },
          { x: 880, y: 580, label: "策略定夺" }
        ];

        for (let node of evalNodes) {
          // 外环
          ctx.beginPath();
          ctx.arc(node.x, node.y, 6, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${focusColor.join(",")}, 0.9)`;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(node.x, node.y, 14, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(${focusColor.join(",")}, 0.35)`;
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // 标注背景与文字
          ctx.font = "500 15px 'Noto Sans SC', sans-serif";
          const textWidth = ctx.measureText(node.label).width;
          ctx.fillStyle = "rgba(220, 226, 222, 0.85)";
          ctx.fillRect(node.x + 14, node.y - 12, textWidth + 10, 22);

          ctx.fillStyle = `rgba(${aggColor.join(",")}, 0.95)`;
          ctx.fillText(node.label, node.x + 18, node.y + 4);
        }

        // 4. 沿分支游动的评估脉冲探针（动态微光点）
        const tNow = time || 0;
        for (let i = 0; i < model.branches.length; i += 3) {
          const b = model.branches[i];
          const prog = (b.phase + tNow * b.speed) % 1;
          const idx = Math.floor(prog * (b.points.length - 1));
          const pt = b.points[idx];

          if (pt && !inTitleZone(pt.x, pt.y)) {
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, b.isCore ? 3 : 2, 0, Math.PI * 2);
            ctx.fillStyle = b.isCore 
              ? `rgba(${focusColor.join(",")}, 0.85)`
              : `rgba(${aggColor.join(",")}, 0.75)`;
            ctx.fill();
          }
        }
      }

      function init() {
        ctx = Deck.fit(canvas);
        model = buildTrajectories();

        Deck.init({ index: 21, total: 26, keys: false });

        stopLoop = Deck.loop((t) => {
          render(t);
        }, { still: 4200 });

        Deck.onResize(() => {
          ctx = Deck.fit(canvas);
          render(4200);
        });
      }

      window.addEventListener("DOMContentLoaded", init);
    })();
  </script>
</body>
</html>
