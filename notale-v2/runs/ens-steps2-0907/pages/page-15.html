<!doctype html>
<!--
主对象：一棵决策树在森林中的生成过程，展示“样本重采样（Bootstrap）”与“节点特征子采样（Feature Subsampling）”两层随机机制。
关系：左侧全局样本经有放回抽样选出每棵树的训练集；树向下分裂时，每个节点从全特征池中随机抽取子集 $k \ll d$ 进行最优划分。
说明依附：各阶段标签紧贴对应阶段的几何流线与节点分支，底部给出两层随机性的联合作用对比。
-->
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #E8EEF1;
      --text: #142630;
      --muted: #50616B;
      --model: #17628E;
      --focus: #B83D0B;
      --rule: #71828B;
      --font-sans: "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
      --font-display: "Noto Sans CJK SC Medium", "Noto Sans CJK SC", sans-serif;
    }

    #stage {
      padding: var(--pad-y) var(--pad-x);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      color: var(--text);
      font-family: var(--font-sans);
    }

    /* 顶部标题区 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      margin: 0;
      font-size: var(--fs-h1);
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: var(--lh-tight);
    }

    .subtitle {
      font-size: var(--fs-lead);
      color: var(--muted);
      margin: 0;
    }

    /* 主可视化画板 */
    .canvas-container {
      position: relative;
      flex: 1;
      width: 100%;
      margin: 10px 0 0 0;
      display: flex;
    }

    svg.diag {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* 底部收束结论 */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--rule);
      padding-top: 14px;
      margin-top: 4px;
    }

    .verdict {
      font-size: var(--fs-lead);
      font-weight: 500;
      color: var(--text);
    }

    .verdict em {
      font-style: normal;
      color: var(--focus);
      font-weight: 600;
    }

    .step-hint {
      font-size: var(--fs-sec);
      color: var(--muted);
    }

    /* SVG 文本与图元样式 */
    .lbl-stage {
      font-size: var(--fs-h2);
      font-family: var(--font-display);
      font-weight: 600;
      fill: var(--text);
    }

    .lbl-sub {
      font-size: var(--fs-sec);
      fill: var(--muted);
    }

    .lbl-node {
      font-size: var(--fs-label);
      font-weight: 600;
      fill: #FFFFFF;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .lbl-tag {
      font-size: var(--fs-tick);
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* 分步显隐控制 */
    [data-step="1"] {
      transition: opacity var(--motion-step) var(--ease-out);
    }
  </style>
</head>
<body data-page="15" data-total="32">
  <div id="stage">
    <header>
      <h1>随机森林的双重随机性</h1>
      <p class="subtitle">外层样本扰动 · 内层特征扰动</p>
    </header>

    <div class="canvas-container min0">
      <svg class="diag" viewBox="0 0 1488 640" preserveAspectRatio="xMidYMid meet">
        <!-- 阶段一：样本级（Bootstrap 抽样） -->
        <g id="layer-sample" transform="translate(40, 20)">
          <text class="lbl-stage" x="0" y="30">第一层：样本重采样</text>
          <text class="lbl-sub" x="0" y="60">有放回采样 N 个样本</text>

          <!-- 全局数据集池 D -->
          <g transform="translate(0, 90)">
            <text x="0" y="24" font-size="16px" font-weight="600" fill="var(--text)">全量样本集 D</text>
            <text x="0" y="46" font-size="13px" fill="var(--muted)">容量 N · 覆盖率 63.2%</text>

            <!-- 样本小球点阵 -->
            <g id="sample-dots">
              <circle cx="20" cy="80" r="11" fill="var(--model)" />
              <circle cx="65" cy="80" r="11" fill="var(--model)" />
              <circle cx="110" cy="80" r="11" fill="var(--model)" />
              <circle cx="155" cy="80" r="11" fill="var(--model)" />
              <circle cx="20" cy="125" r="11" fill="var(--model)" />
              <circle cx="65" cy="125" r="11" fill="var(--model)" />
              <circle cx="110" cy="125" r="11" fill="var(--model)" />
              <circle cx="155" cy="125" r="11" fill="var(--model)" />
              <circle cx="20" cy="170" r="11" fill="var(--model)" />
              <circle cx="65" cy="170" r="11" fill="var(--model)" />
              <circle cx="110" cy="170" r="11" fill="var(--model)" />
              <circle cx="155" cy="170" r="11" fill="var(--model)" />
              <circle cx="20" cy="215" r="11" fill="var(--model)" />
              <circle cx="65" cy="215" r="11" fill="var(--model)" />
              <circle cx="110" cy="215" r="11" fill="var(--model)" />
              <circle cx="155" cy="215" r="11" fill="var(--model)" />
            </g>
          </g>

          <!-- 抽样流向连线 -->
          <path d="M 195 190 C 235 190, 240 150, 280 150" fill="none" stroke="var(--model)" stroke-width="var(--stroke)" />
          <polygon points="280,146 288,150 280,154" fill="var(--model)" />
          <path d="M 195 210 C 235 210, 240 260, 280 260" fill="none" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="3 3" />

          <!-- 抽出的子集 D_t -->
          <g transform="translate(295, 90)">
            <text x="0" y="24" font-size="16px" font-weight="600" fill="var(--model)">基树训练集 D_t</text>
            <!-- 带有重复与高亮的球 -->
            <circle cx="20" cy="60" r="11" fill="var(--model)" />
            <circle cx="60" cy="60" r="11" fill="var(--model)" />
            <circle cx="100" cy="60" r="11" fill="var(--model)" />
            <circle cx="20" cy="98" r="11" fill="var(--model)" />
            <circle cx="60" cy="98" r="11" fill="var(--model)" />
            <circle cx="100" cy="98" r="11" fill="var(--focus)" />
            <text x="0" y="132" font-size="13px" fill="var(--muted)">含重复重抽样本</text>
          </g>

          <!-- OOB 袋外样本 -->
          <g transform="translate(295, 240)">
            <text x="0" y="22" font-size="15px" font-weight="500" fill="var(--muted)">袋外样本 (OOB)</text>
            <text x="0" y="44" font-size="13px" fill="var(--rule)">36.8% 未入选样本</text>
          </g>
        </g>

        <!-- 连线：树的输入流 -->
        <path d="M 450 170 L 515 170" fill="none" stroke="var(--model)" stroke-width="var(--stroke-strong)" />
        <polygon points="515,165 525,170 515,175" fill="var(--model)" />

        <!-- 阶段二：节点级（特征子集抽样） -->
        <g id="layer-feature" transform="translate(525, 20)">
          <text class="lbl-stage" x="0" y="30">第二层：节点特征子采样</text>
          <text class="lbl-sub" x="0" y="60">每次分裂从 k 个随机特征中择优</text>

          <!-- 特征全集池 (d 个特征) -->
          <g transform="translate(0, 90)">
            <text x="0" y="24" font-size="16px" font-weight="600" fill="var(--text)">全特征集 (d 个候选)</text>

            <!-- 特征色条列表 -->
            <g transform="translate(0, 42)">
              <!-- 特征 1 (强特征) -->
              <g transform="translate(0, 0)">
                <rect x="0" y="0" width="170" height="28" rx="2" fill="var(--bg)" stroke="var(--focus)" stroke-width="1.5" />
                <rect x="0" y="0" width="34" height="28" fill="var(--focus)" rx="2" />
                <text x="17" y="15" fill="#FFF" font-size="13px" font-weight="600" text-anchor="middle" dominant-baseline="central">x₁</text>
                <text x="44" y="15" font-size="13px" fill="var(--text)" font-weight="600" dominant-baseline="central">强判别特征</text>
              </g>

              <!-- 特征 2 -->
              <g transform="translate(0, 36)">
                <rect x="0" y="0" width="170" height="28" rx="2" fill="var(--bg)" stroke="var(--rule)" stroke-width="1" />
                <rect x="0" y="0" width="34" height="28" fill="var(--model)" rx="2" opacity="0.6" />
                <text x="17" y="15" fill="#FFF" font-size="13px" font-weight="600" text-anchor="middle" dominant-baseline="central">x₂</text>
                <text x="44" y="15" font-size="13px" fill="var(--text)" dominant-baseline="central">普通候选特征</text>
              </g>

              <!-- 特征 3 -->
              <g transform="translate(0, 72)">
                <rect x="0" y="0" width="170" height="28" rx="2" fill="var(--bg)" stroke="var(--rule)" stroke-width="1" />
                <rect x="0" y="0" width="34" height="28" fill="var(--model)" rx="2" opacity="0.6" />
                <text x="17" y="15" fill="#FFF" font-size="13px" font-weight="600" text-anchor="middle" dominant-baseline="central">x₃</text>
                <text x="44" y="15" font-size="13px" fill="var(--text)" dominant-baseline="central">普通候选特征</text>
              </g>

              <!-- 特征 4 -->
              <g transform="translate(0, 108)">
                <rect x="0" y="0" width="170" height="28" rx="2" fill="var(--bg)" stroke="var(--rule)" stroke-width="1" />
                <rect x="0" y="0" width="34" height="28" fill="var(--model)" rx="2" opacity="0.6" />
                <text x="17" y="15" fill="#FFF" font-size="13px" font-weight="600" text-anchor="middle" dominant-baseline="central">x₄</text>
                <text x="44" y="15" font-size="13px" fill="var(--text)" dominant-baseline="central">普通候选特征</text>
              </g>

              <!-- 特征 5 -->
              <g transform="translate(0, 144)">
                <rect x="0" y="0" width="170" height="28" rx="2" fill="var(--bg)" stroke="var(--rule)" stroke-width="1" />
                <rect x="0" y="0" width="34" height="28" fill="var(--model)" rx="2" opacity="0.6" />
                <text x="17" y="15" fill="#FFF" font-size="13px" font-weight="600" text-anchor="middle" dominant-baseline="central">x₅</text>
                <text x="44" y="15" font-size="13px" fill="var(--text)" dominant-baseline="central">普通候选特征</text>
              </g>

              <text x="0" y="196" font-size="13px" fill="var(--muted)">通常取 k ≈ √d</text>
            </g>
          </g>

          <!-- 树形结构 -->
          <g transform="translate(230, 80)">
            <!-- 根节点分裂 -->
            <circle cx="160" cy="50" r="24" fill="var(--model)" />
            <text class="lbl-node" x="160" y="50">根</text>
            <text x="160" y="88" text-anchor="middle" font-size="13px" font-weight="600" fill="var(--text)">节点分裂 1</text>

            <!-- 抽样指示虚线 -->
            <path d="M -40 75 C 20 75, 70 50, 134 50" fill="none" stroke="var(--focus)" stroke-width="1.5" stroke-dasharray="3 3" />
            <rect x="25" y="48" width="94" height="22" rx="2" fill="var(--bg)" stroke="var(--focus)" stroke-width="1" />
            <text x="72" y="60" text-anchor="middle" dominant-baseline="central" font-size="13px" fill="var(--focus)" font-weight="600">随机子集 {x₂, x₄}</text>

            <!-- 第一层连线 -->
            <line x1="145" y1="70" x2="85" y2="160" stroke="var(--model)" stroke-width="var(--stroke)" />
            <line x1="175" y1="70" x2="235" y2="160" stroke="var(--model)" stroke-width="var(--stroke)" />

            <!-- 阶段分步显示：后续分裂节点 (Step 1) -->
            <g data-step="1">
              <!-- 左子节点 -->
              <circle cx="85" cy="175" r="20" fill="var(--model)" />
              <text class="lbl-node" x="85" y="175">左</text>
              <text x="85" y="208" text-anchor="middle" font-size="13px" fill="var(--text)">节点分裂 2</text>

              <!-- 右子节点 -->
              <circle cx="235" cy="175" r="20" fill="var(--model)" />
              <text class="lbl-node" x="235" y="175">右</text>
              <text x="235" y="208" text-anchor="middle" font-size="13px" fill="var(--text)">节点分裂 3</text>

              <!-- 独立重新抽样标注 -->
              <path d="M -40 135 C 0 135, 20 175, 63 175" fill="none" stroke="var(--model)" stroke-width="1.5" stroke-dasharray="3 3" />
              <rect x="-8" y="146" width="76" height="20" rx="2" fill="var(--bg)" stroke="var(--model)" stroke-width="1" />
              <text x="30" y="157" text-anchor="middle" dominant-baseline="central" font-size="13px" fill="var(--model)">子集 {x₁, x₃}</text>

              <path d="M -40 170 C 40 170, 140 175, 213 175" fill="none" stroke="var(--model)" stroke-width="1.5" stroke-dasharray="3 3" />
              <rect x="135" y="146" width="76" height="20" rx="2" fill="var(--bg)" stroke="var(--model)" stroke-width="1" />
              <text x="173" y="157" text-anchor="middle" dominant-baseline="central" font-size="13px" fill="var(--model)">子集 {x₂, x₅}</text>

              <!-- 第二层连线到叶子 -->
              <line x1="75" y1="193" x2="40" y2="255" stroke="var(--model)" stroke-width="1.5" />
              <line x1="95" y1="193" x2="130" y2="255" stroke="var(--model)" stroke-width="1.5" />
              <line x1="225" y1="193" x2="190" y2="255" stroke="var(--model)" stroke-width="1.5" />
              <line x1="245" y1="193" x2="280" y2="255" stroke="var(--model)" stroke-width="1.5" />

              <!-- 叶子节点 -->
              <rect x="25" y="255" width="30" height="18" rx="2" fill="var(--model)" opacity="0.8" />
              <rect x="115" y="255" width="30" height="18" rx="2" fill="var(--model)" opacity="0.8" />
              <rect x="175" y="255" width="30" height="18" rx="2" fill="var(--model)" opacity="0.8" />
              <rect x="265" y="255" width="30" height="18" rx="2" fill="var(--model)" opacity="0.8" />

              <text x="160" y="305" text-anchor="middle" font-size="13px" font-weight="600" fill="var(--focus)">
                强特征被概率屏蔽，弱特征获得分裂机会
              </text>
            </g>
          </g>
        </g>

        <!-- 右侧汇总对比栏：双重随机性的机制对比 -->
        <g id="summary-panel" transform="translate(1140, 20)">
          <text class="lbl-stage" x="0" y="30">差异化来源</text>
          <text class="lbl-sub" x="0" y="60">两层扰动降低树间相关性</text>

          <g transform="translate(0, 90)">
            <!-- 层次 1 -->
            <text x="0" y="24" font-size="16px" font-weight="600" fill="var(--model)">1. 样本级扰动</text>
            <text x="0" y="50" font-size="15px" fill="var(--text)">· 改变每棵树的输入分布</text>
            <text x="0" y="74" font-size="13px" fill="var(--muted)">· 制造基础多样性</text>

            <line x1="0" y1="105" x2="260" y2="105" stroke="var(--rule)" stroke-width="1" />

            <!-- 层次 2 (Step 1 显现强调) -->
            <g data-step="1" transform="translate(0, 125)">
              <text x="0" y="24" font-size="16px" font-weight="600" fill="var(--focus)">2. 节点特征扰动</text>
              <text x="0" y="50" font-size="15px" fill="var(--text)">· 打破强特征对根节点垄断</text>
              <text x="0" y="74" font-size="13px" fill="var(--text)">· 分裂拓扑产生显著差异</text>
            </g>
          </g>
        </g>
      </svg>
    </div>

    <footer>
      <div class="verdict">
        样本重采样构建<em>独立样本视角</em>，节点特征采样消除<em>强特征主导</em>。
      </div>
    </footer>
  </div>

  <aside class="notes" hidden>
    在这一页中，我们正式剖析随机森林之所以被称为“随机”的根本原因。
    它并不只靠 Bagging 的样本重采样。
    如果只重采样样本，当数据中存在一个或几个特别强的预测特征时，几乎每棵树在树根和主要节点都会优先选择这个强特征，导致生成的树高度相关，集成的方差降低效果大打折扣。
    随机森林在每一个节点分裂时，都独立抽取一个随机特征子集，只在子集中挑最优特征。这样强特征被概率性遮蔽，其他潜在特征得以展现，真正大幅降低了树与树之间的相关性。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 15, total: 32 });
  </script>
</body>
</html>
