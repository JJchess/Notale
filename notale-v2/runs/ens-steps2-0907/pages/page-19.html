<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* 构图意图：
       1. 主对象：Boosting 的串行级联几何链条——每一级弱学习器纠偏前序残差，误差包络沿水平轴逐级收敛。
       2. 关系表现：从左到右通过级联阶梯与收敛包络线连接三代弱学习器，橙色焦点只落在当前传递的“残差修正”阶跃上。
       3. 说明与标题：标题置于左上宁静区，串行阶段与残差收束说明贴靠几何阶梯与收束轴线展开。 */
    :root {
      --bg: #E8EEF1;
      --text: #142630;
      --muted: #50616B;
      --model: #17628E;
      --focus: #B83D0B;
      --rule: #71828B;
      --font-sans: "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
      --font-display: "Noto Sans CJK SC Medium", "Noto Sans CJK SC", sans-serif;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      padding: var(--pad-y) var(--pad-x);
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow: hidden;
      box-sizing: border-box;
    }

    .cover-header {
      position: absolute;
      top: 108px;
      left: 104px;
      z-index: 10;
      max-width: 620px;
      pointer-events: none;
    }

    .topic-tag {
      font-family: var(--font-sans);
      font-size: var(--fs-sec);
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }

    .cover-title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: 700;
      line-height: var(--lh-tight);
      color: var(--text);
      letter-spacing: -0.02em;
      margin: 0 0 24px 0;
    }

    .cover-thesis {
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
      max-width: 500px;
    }

    .cascade-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .cascade-svg text {
      font-family: var(--font-sans);
      user-select: none;
    }

    .stage-seq {
      position: absolute;
      right: 104px;
      bottom: 64px;
      display: flex;
      gap: 36px;
      z-index: 10;
      pointer-events: none;
    }

    .seq-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 170px;
    }

    .seq-label {
      font-size: var(--fs-body);
      font-weight: 700;
      color: var(--model);
      letter-spacing: 0.02em;
    }

    .seq-item.active .seq-label {
      color: var(--focus);
    }

    .seq-desc {
      font-size: var(--fs-sec);
      color: var(--muted);
      line-height: var(--lh-copy);
    }
  </style>
</head>
<body data-page="19" data-total="32">
  <div id="stage">
    <header class="cover-header">
      <div class="topic-tag">第五部分 · BOOSTING</div>
      <h1 class="cover-title">Boosting：<br>串行纠错降低误差</h1>
      <p class="cover-thesis">基学习器按次序生成，每一轮专门拟合前序组合尚未解决的残差，将高偏差逐步压减。</p>
    </header>

    <svg class="cascade-svg" viewBox="0 0 1600 900" aria-hidden="true">
      <defs>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 1 2 L 8 5 L 1 8 z" fill="#17628E" />
        </marker>
        <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 1 2 L 8 5 L 1 8 z" fill="#B83D0B" />
        </marker>
      </defs>

      <!-- 坐标参考与背景基准线 -->
      <line x1="680" y1="580" x2="1520" y2="580" stroke="#71828B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
      <text x="1520" y="568" fill="#50616B" font-size="13" text-anchor="end">目标真实值 y</text>

      <!-- 误差收敛包络区域 -->
      <polygon points="680,180 960,340 1240,470 1480,555 1480,605 1240,670 960,720 680,780"
               fill="#17628E" fill-opacity="0.05" />
      
      <!-- 包络边界线 -->
      <path d="M 680 180 Q 1060 380 1480 555" fill="none" stroke="#71828B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.45" />
      <path d="M 680 780 Q 1060 690 1480 605" fill="none" stroke="#71828B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.45" />

      <!-- 阶段 1: 初始弱模型 h_1 -->
      <g class="step-1">
        <!-- 垂直偏差跨度条 -->
        <line x1="740" y1="220" x2="740" y2="740" stroke="#71828B" stroke-width="1.5" opacity="0.35" />
        <line x1="732" y1="220" x2="748" y2="220" stroke="#71828B" stroke-width="1.5" opacity="0.35" />
        <line x1="732" y1="740" x2="748" y2="740" stroke="#71828B" stroke-width="1.5" opacity="0.35" />
        
        <!-- 模型拟合粗线 -->
        <line x1="720" y1="460" x2="840" y2="460" stroke="#17628E" stroke-width="4" stroke-linecap="round" />
        <!-- 残差箭头指向基准 -->
        <line x1="840" y1="460" x2="840" y2="574" stroke="#17628E" stroke-width="2" marker-end="url(#arrow-blue)" />

        <text x="780" y="440" fill="#17628E" font-size="16" font-weight="700" text-anchor="middle">h₁(x)</text>
        <text x="852" y="520" fill="#50616B" font-size="15">残差 r₁</text>
      </g>

      <!-- 串行传递脉络 1 -> 2 (橙色传递：聚焦错题残差) -->
      <path d="M 840 580 C 890 580 910 390 980 390" fill="none" stroke="#B83D0B" stroke-width="2.5" marker-end="url(#arrow-orange)" />
      <text x="948" y="440" fill="#B83D0B" font-size="15" font-weight="700">聚焦残差</text>

      <!-- 阶段 2: 修正弱模型 h_2 -->
      <g class="step-2">
        <line x1="1020" y1="350" x2="1020" y2="680" stroke="#71828B" stroke-width="1.5" opacity="0.35" />
        <line x1="1012" y1="350" x2="1028" y2="350" stroke="#71828B" stroke-width="1.5" opacity="0.35" />
        <line x1="1012" y1="680" x2="1028" y2="680" stroke="#71828B" stroke-width="1.5" opacity="0.35" />

        <!-- 拟合线 -->
        <line x1="1000" y1="525" x2="1120" y2="525" stroke="#17628E" stroke-width="4" stroke-linecap="round" />
        <line x1="1120" y1="525" x2="1120" y2="574" stroke="#17628E" stroke-width="2" marker-end="url(#arrow-blue)" />

        <text x="1060" y="505" fill="#17628E" font-size="16" font-weight="700" text-anchor="middle">h₂(x)</text>
        <text x="1132" y="565" fill="#50616B" font-size="15">残差 r₂</text>
      </g>

      <!-- 串行传递脉络 2 -> 3 -->
      <path d="M 1120 580 C 1170 580 1200 470 1260 470" fill="none" stroke="#17628E" stroke-width="2" marker-end="url(#arrow-blue)" />

      <!-- 阶段 3: 进一步收敛模型 h_m -->
      <g class="step-3">
        <line x1="1280" y1="460" x2="1280" y2="640" stroke="#71828B" stroke-width="1.5" opacity="0.35" />
        <line x1="1273" y1="460" x2="1287" y2="460" stroke="#71828B" stroke-width="1.5" opacity="0.35" />
        <line x1="1273" y1="640" x2="1287" y2="640" stroke="#71828B" stroke-width="1.5" opacity="0.35" />

        <line x1="1260" y1="565" x2="1370" y2="565" stroke="#17628E" stroke-width="4" stroke-linecap="round" />
        <line x1="1370" y1="565" x2="1370" y2="576" stroke="#17628E" stroke-width="2" marker-end="url(#arrow-blue)" />

        <text x="1315" y="545" fill="#17628E" font-size="16" font-weight="700" text-anchor="middle">hₘ(x)</text>
      </g>

      <!-- 终态集成收束线：强学习器 F(x) = Σ αₘ hₘ -->
      <path d="M 720 460 L 1000 525 L 1260 565 L 1460 578" fill="none" stroke="#17628E" stroke-width="4" stroke-linecap="round" opacity="0.9" />
      <circle cx="1460" cy="578" r="5" fill="#17628E" />
      <text x="1460" y="620" fill="#17628E" font-size="16" font-weight="700" text-anchor="middle">F(x) = Σ αₘhₘ(x)</text>
    </svg>

    <div class="stage-seq">
      <div class="seq-item">
        <span class="seq-label">串行依赖</span>
        <span class="seq-desc">后一轮依赖前一轮输出</span>
      </div>
      <div class="seq-item active">
        <span class="seq-label">残差加权</span>
        <span class="seq-desc">动态重分样本难度</span>
      </div>
      <div class="seq-item">
        <span class="seq-label">减小偏差</span>
        <span class="seq-desc">弱模型组合逼近真实分布</span>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    各位同学，今天我们进入集成学习的第二个核心家族：Boosting。
    与上一章 Bagging 并行独立训练不同，Boosting 采用严格的串行机制。
    上一轮模型哪里做错了，下一轮弱学习器就专门去攻克那部分残差或加大那些错题的样本权重。
    每一轮都在纠偏，从而逐步将整个强模型的偏差大幅压缩至收敛。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 19, total: 32 });
  </script>
</body>
</html>
