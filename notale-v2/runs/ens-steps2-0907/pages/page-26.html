<!doctype html>
<!-- 构图意图：
     1. 主对象：异质多模型向元学习器分层汇聚的“几何拓扑”——树、核支持向量机、多层感知机三类本质不同的异质基模型以蓝图线条展开，并最终收束至元学习器节点。
     2. 关系表现：左侧开阔区为章节标题与核心设问，中右侧是多条不同形态的蓝图路径在经过第一层后聚合成单条加粗的汇聚线，切合主题“多模型收束为粗线”。
     3. 说明依附：核心副题贴于大标题下方，右侧结构标注（异质基模型与元学习器）紧随图形节点，无任何外包面板或多余修饰。 -->
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>异质集成与方法选择</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #E8EEF1;
      --text: #142630;
      --muted: #50616B;
      --model: #17628E;
      --focus: #B83D0B;
      --rule: #71828B;
      --font-sans: "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
      --font-display: "Noto Sans CJK SC Medium", "Noto Sans CJK SC", sans-serif;
    }

    #stage {
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      position: relative;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
    }

    /* 标题区域 */
    .title-group {
      position: absolute;
      left: 120px;
      top: 250px;
      width: 520px;
      z-index: 10;
    }

    .main-title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      margin: 0 0 24px 0;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
      max-width: 480px;
    }

    /* 右侧异质汇聚矢量图解 */
    .scene-svg {
      position: absolute;
      top: 0;
      right: 0;
      width: 1600px;
      height: 900px;
      pointer-events: none;
      z-index: 2;
    }

    /* 文字标签规范 */
    .node-text {
      font-family: var(--font-display);
      font-size: var(--fs-label);
      fill: var(--text);
      font-weight: 700;
    }

    .node-sub {
      font-family: var(--font-sans);
      font-size: var(--fs-tick);
      fill: var(--muted);
    }

    .focus-text {
      font-family: var(--font-display);
      font-size: var(--fs-label);
      fill: var(--focus);
      font-weight: 700;
    }
  </style>
</head>
<body data-page="26" data-total="32">
  <div id="stage">
    <div class="title-group">
      <h1 class="main-title">异质集成与<br>方法选择</h1>
      <p class="subtitle">打破同质假设：由不同归纳偏置的模型相互纠偏，并在具体约束下决定架构走向。</p>
    </div>

    <svg class="scene-svg" viewBox="0 0 1600 900" fill="none" aria-hidden="true">
      <!-- 引导对齐辅助底网与轴线 -->
      <g stroke="var(--rule)" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 5">
        <line x1="720" y1="140" x2="720" y2="760" />
        <line x1="1020" y1="140" x2="1020" y2="760" />
        <line x1="1340" y1="140" x2="1340" y2="760" />
      </g>

      <!-- 异质模型输入流向 -->
      <g stroke="var(--model)" stroke-linecap="round" stroke-linejoin="round">
        <!-- 基础数据分支进入三类模型 -->
        <path d="M 720 450 C 760 450, 780 240, 840 240" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.6" />
        <path d="M 720 450 L 840 450" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.6" />
        <path d="M 720 450 C 760 450, 780 660, 840 660" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.6" />

        <!-- 模型内部特征/结构线图 (展现异质性) -->
        <!-- 模型 1: 决策树/分段阶梯 (上) -->
        <g transform="translate(840, 190)">
          <!-- 树形分叉架构 -->
          <line x1="0" y1="50" x2="40" y2="50" stroke-width="2" />
          <line x1="40" y1="50" x2="70" y2="25" stroke-width="2" />
          <line x1="40" y1="50" x2="70" y2="75" stroke-width="2" />
          <line x1="70" y1="25" x2="100" y2="10" stroke-width="2" />
          <line x1="70" y1="25" x2="100" y2="40" stroke-width="2" />
          <line x1="70" y1="75" x2="100" y2="90" stroke-width="2" />
          <!-- 节点标记 -->
          <circle cx="40" cy="50" r="3" fill="var(--model)" />
          <circle cx="70" cy="25" r="3" fill="var(--model)" />
          <circle cx="70" cy="75" r="3" fill="var(--model)" />
          <circle cx="100" cy="10" r="2.5" fill="var(--model)" />
          <circle cx="100" cy="40" r="2.5" fill="var(--model)" />
          <circle cx="100" cy="90" r="2.5" fill="var(--model)" />
        </g>

        <!-- 模型 2: 线性/核超平面 (中) -->
        <g transform="translate(840, 400)">
          <line x1="0" y1="50" x2="30" y2="50" stroke-width="2" />
          <path d="M 30 75 Q 65 50 100 25" stroke-width="2" />
          <circle cx="50" cy="35" r="3" fill="var(--model)" />
          <circle cx="80" cy="65" r="3" fill="var(--model)" />
          <line x1="30" y1="75" x2="100" y2="25" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.5" />
          <line x1="100" y1="25" x2="110" y2="50" stroke-width="2" />
        </g>

        <!-- 模型 3: 神经网络非线性层 (下) -->
        <g transform="translate(840, 610)">
          <line x1="0" y1="50" x2="30" y2="50" stroke-width="2" />
          <!-- 多层全连接线段 -->
          <line x1="35" y1="30" x2="70" y2="20" stroke-width="1.2" stroke-opacity="0.5" />
          <line x1="35" y1="30" x2="70" y2="50" stroke-width="1.2" stroke-opacity="0.5" />
          <line x1="35" y1="30" x2="70" y2="80" stroke-width="1.2" stroke-opacity="0.5" />
          <line x1="35" y1="70" x2="70" y2="20" stroke-width="1.2" stroke-opacity="0.5" />
          <line x1="35" y1="70" x2="70" y2="50" stroke-width="1.2" stroke-opacity="0.5" />
          <line x1="35" y1="70" x2="70" y2="80" stroke-width="1.2" stroke-opacity="0.5" />
          <line x1="70" y1="20" x2="105" y2="50" stroke-width="1.5" />
          <line x1="70" y1="50" x2="105" y2="50" stroke-width="1.5" />
          <line x1="70" y1="80" x2="105" y2="50" stroke-width="1.5" />
          <!-- 节点 -->
          <circle cx="35" cy="30" r="3.5" fill="var(--model)" />
          <circle cx="35" cy="70" r="3.5" fill="var(--model)" />
          <circle cx="70" cy="20" r="3.5" fill="var(--model)" />
          <circle cx="70" cy="50" r="3.5" fill="var(--model)" />
          <circle cx="70" cy="80" r="3.5" fill="var(--model)" />
          <circle cx="105" cy="50" r="3.5" fill="var(--model)" />
        </g>

        <!-- 异质基模型预测汇聚路径（规范签名：多条蓝色等重路径汇聚为一条粗线） -->
        <path d="M 950 240 C 1040 240, 1080 450, 1160 450" stroke-width="2" />
        <path d="M 950 450 L 1160 450" stroke-width="2" />
        <path d="M 950 660 C 1040 660, 1080 450, 1160 450" stroke-width="2" />
      </g>

      <!-- 元学习器核心节点与最终收束粗线（4px 强调线重） -->
      <g stroke-linecap="round" stroke-linejoin="round">
        <line x1="1160" y1="450" x2="1360" y2="450" stroke="var(--model)" stroke-width="4" />
        <!-- 汇聚点元学习器定位环 -->
        <circle cx="1160" cy="450" r="8" fill="var(--bg)" stroke="var(--focus)" stroke-width="3" />
        <circle cx="1360" cy="450" r="5" fill="var(--model)" />
      </g>

      <!-- 节点概念文字标注 -->
      <g>
        <!-- 输入端 -->
        <text x="705" y="455" text-anchor="end" class="node-text">训练样本集</text>
        
        <!-- 基学习器层级标签 -->
        <text x="965" y="215" class="node-text">树模型</text>
        <text x="965" y="240" class="node-sub">轴对齐非线性划分</text>

        <text x="965" y="425" class="node-text">线性 / SVM</text>
        <text x="965" y="450" class="node-sub">最大间隔超平面</text>

        <text x="965" y="635" class="node-text">神经网络</text>
        <text x="965" y="660" class="node-sub">平滑连续表征</text>

        <!-- 元学习器汇聚端 -->
        <text x="1160" y="405" text-anchor="middle" class="focus-text">元学习器 Stacking</text>
        <text x="1160" y="500" text-anchor="middle" class="node-sub">学习最优融合权重</text>

        <!-- 最终决策输出 -->
        <text x="1375" y="455" class="node-text">集成输出</text>
      </g>
    </svg>
  </div>

  <aside class="notes" hidden>
    同学们好，我们正式进入本讲第六部分：异质集成与方法选择。
    在前几节中，我们讨论的 Bagging 和 Boosting 主要是基于同一种弱学习器（例如同质的决策树）通过不同采样或加权方式进行组合。
    然而，同质模型受限于相同的归纳偏置。异质集成（如 Stacking）直接引入树模型、线性分类器、神经网络等结构完全不同的学习器，由元学习器学习各自的信任权重，以此形成互补。
    在这一部分，我们将深入探讨 Stacking 的两层原理、关键的防止数据泄漏机制，并系统总结四类主流集成算法的选择决策框架。
  </aside>

</body>
</html>
