<!doctype html>
<html lang="zh">
<head>
  <!--
    主对象：Stacking 中数据泄漏（同集自测）与 K 折外预测（OOF）生成元特征的数据流对比。
    关系显现：左侧单一流程直指同集自测的“虚假记忆”；右侧作为主体三折轮转，通过严格未见折的橙色路径汇聚为完整无泄漏元特征列。
    说明依附：标签与数学标注紧贴各折数据块、预测动作与生成列。
  -->
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #E8EEF1;
      --text: #142630;
      --muted: #50616B;
      --model: #17628E;
      --focus: #B83D0B;
      --rule: #71828B;
      --font-sans: "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
      --font-display: "Noto Sans CJK SC Medium", "Noto Sans CJK SC", sans-serif;
    }

    #stage {
      padding: var(--pad-y) var(--pad-x);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 16px;
      color: var(--text);
      font-family: var(--font-sans);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: var(--fs-lead);
    }

    .comparison {
      display: grid;
      grid-template-columns: 380px 1050px;
      gap: 58px;
      height: 100%;
      align-items: stretch;
    }

    .panel {
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      margin: 0 0 12px 0;
    }

    .svg-canvas {
      width: 100%;
      height: 650px;
    }

    text {
      font-family: var(--font-sans);
      user-select: none;
    }
  </style>
</head>
<body data-page="28" data-total="32">
  <div id="stage">
    <header>
      <h1>元学习器必须基于折外预测（OOF）训练</h1>
      <p class="subtitle">同集自测导致虚假高置信度与泛化崩塌</p>
    </header>

    <div class="comparison">
      <!-- 错误对照组：同集自测 -->
      <section class="panel min0">
        <h2 class="panel-title" style="color: var(--focus);">数据泄漏：训练集自测</h2>

        <svg class="svg-canvas" viewBox="0 0 380 650">
          <defs>
            <marker id="leak-arr-model" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--model)" />
            </marker>
            <marker id="leak-arr-focus" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--focus)" />
            </marker>
          </defs>

          <!-- 原始训练集 -->
          <rect x="20" y="40" width="110" height="280" fill="none" stroke="var(--rule)" stroke-width="2" />
          <text x="75" y="170" fill="var(--text)" font-size="16" text-anchor="middle">训练集 D</text>
          <text x="75" y="196" fill="var(--muted)" font-size="13" text-anchor="middle">100% 样本</text>

          <!-- 训练路径 -->
          <path d="M 130 110 L 220 110" fill="none" stroke="var(--model)" stroke-width="2" marker-end="url(#leak-arr-model)" />
          <text x="175" y="98" fill="var(--muted)" font-size="13" text-anchor="middle">拟合</text>

          <!-- 基模型 -->
          <rect x="220" y="80" width="120" height="60" fill="none" stroke="var(--model)" stroke-width="2" />
          <text x="280" y="116" fill="var(--model)" font-size="16" text-anchor="middle">基模型</text>

          <!-- 自测回环 -->
          <path d="M 130 240 L 280 240 L 280 148" fill="none" stroke="var(--focus)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#leak-arr-focus)" />
          <text x="205" y="230" fill="var(--focus)" font-size="13" text-anchor="middle">复用原样本自测</text>

          <!-- 自测后向下输出到泄漏特征列 -->
          <path d="M 280 240 L 280 352" fill="none" stroke="var(--focus)" stroke-width="2" marker-end="url(#leak-arr-focus)" />

          <rect x="220" y="360" width="120" height="150" fill="none" stroke="var(--focus)" stroke-width="2" />
          <text x="280" y="425" fill="var(--focus)" font-size="15" text-anchor="middle">自测元特征</text>
          <text x="280" y="455" fill="var(--focus)" font-size="13" text-anchor="middle">虚假高准确率</text>
          <text x="280" y="480" fill="var(--muted)" font-size="13" text-anchor="middle">（记住了训练噪声）</text>

          <text x="20" y="580" fill="var(--focus)" font-size="15">后果：元模型过度偏信高容量基模型，</text>
          <text x="20" y="606" fill="var(--focus)" font-size="15">测试集泛化崩溃。</text>
        </svg>
      </section>

      <!-- 主体结构：K折外预测（OOF） -->
      <section class="panel min0">
        <h2 class="panel-title" style="color: var(--model);">规范机制：K 折外预测（OOF）生成纯净特征</h2>

        <svg class="svg-canvas" viewBox="0 0 1050 650">
          <defs>
            <marker id="oof-arr-model" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--model)" />
            </marker>
            <marker id="oof-arr-focus" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--focus)" />
            </marker>
          </defs>

          <!-- 表头 -->
          <text x="80" y="24" fill="var(--muted)" font-size="15" text-anchor="middle">K折划分</text>
          <text x="290" y="24" fill="var(--muted)" font-size="15" text-anchor="middle">训练子模型 (K-1折)</text>
          <text x="560" y="24" fill="var(--focus)" font-size="15" text-anchor="middle">折外验证预测 (OOF)</text>
          <text x="860" y="24" fill="var(--model)" font-size="15" text-anchor="middle">纯净元特征拼接</text>

          <!-- 轮次 1 -->
          <g transform="translate(0, 48)">
            <!-- 3折数据条 -->
            <rect x="20" y="0" width="120" height="34" fill="none" stroke="var(--focus)" stroke-width="2" />
            <text x="80" y="22" fill="var(--focus)" font-size="13" text-anchor="middle">Fold 1 验证</text>

            <rect x="20" y="38" width="120" height="34" fill="none" stroke="var(--rule)" stroke-width="1.5" />
            <text x="80" y="60" fill="var(--muted)" font-size="13" text-anchor="middle">Fold 2 训练</text>

            <rect x="20" y="76" width="120" height="34" fill="none" stroke="var(--rule)" stroke-width="1.5" />
            <text x="80" y="98" fill="var(--muted)" font-size="13" text-anchor="middle">Fold 3 训练</text>

            <!-- 训练箭头与子模型 -->
            <path d="M 140 74 L 220 74" fill="none" stroke="var(--model)" stroke-width="2" marker-end="url(#oof-arr-model)" />
            <rect x="220" y="46" width="140" height="56" fill="none" stroke="var(--model)" stroke-width="2" />
            <text x="290" y="79" fill="var(--model)" font-size="16" text-anchor="middle">子模型 M₁</text>

            <!-- 预测Fold 1 (OOF) 路径 -->
            <path d="M 140 17 L 460 17" fill="none" stroke="var(--focus)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#oof-arr-focus)" />
            <path d="M 360 74 L 410 74 L 410 27 L 460 27" fill="none" stroke="var(--model)" stroke-width="2" />

            <!-- OOF1 块 -->
            <rect x="470" y="2" width="180" height="34" fill="none" stroke="var(--focus)" stroke-width="2" />
            <text x="560" y="24" fill="var(--focus)" font-size="15" text-anchor="middle">oof₁ 预测</text>

            <path d="M 650 19 L 770 19" fill="none" stroke="var(--model)" stroke-width="2" marker-end="url(#oof-arr-model)" />
          </g>

          <!-- 轮次 2 -->
          <g transform="translate(0, 186)">
            <rect x="20" y="0" width="120" height="34" fill="none" stroke="var(--rule)" stroke-width="1.5" />
            <text x="80" y="22" fill="var(--muted)" font-size="13" text-anchor="middle">Fold 1 训练</text>

            <rect x="20" y="38" width="120" height="34" fill="none" stroke="var(--focus)" stroke-width="2" />
            <text x="80" y="60" fill="var(--focus)" font-size="13" text-anchor="middle">Fold 2 验证</text>

            <rect x="20" y="76" width="120" height="34" fill="none" stroke="var(--rule)" stroke-width="1.5" />
            <text x="80" y="98" fill="var(--muted)" font-size="13" text-anchor="middle">Fold 3 训练</text>

            <path d="M 140 74 L 220 74" fill="none" stroke="var(--model)" stroke-width="2" marker-end="url(#oof-arr-model)" />
            <rect x="220" y="46" width="140" height="56" fill="none" stroke="var(--model)" stroke-width="2" />
            <text x="290" y="79" fill="var(--model)" font-size="16" text-anchor="middle">子模型 M₂</text>

            <path d="M 140 55 L 460 55" fill="none" stroke="var(--focus)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#oof-arr-focus)" />
            <path d="M 360 74 L 460 74" fill="none" stroke="var(--model)" stroke-width="2" />

            <rect x="470" y="40" width="180" height="34" fill="none" stroke="var(--focus)" stroke-width="2" />
            <text x="560" y="62" fill="var(--focus)" font-size="15" text-anchor="middle">oof₂ 预测</text>

            <path d="M 650 57 L 770 57" fill="none" stroke="var(--model)" stroke-width="2" marker-end="url(#oof-arr-model)" />
          </g>

          <!-- 轮次 3 -->
          <g transform="translate(0, 324)">
            <rect x="20" y="0" width="120" height="34" fill="none" stroke="var(--rule)" stroke-width="1.5" />
            <text x="80" y="22" fill="var(--muted)" font-size="13" text-anchor="middle">Fold 1 训练</text>

            <rect x="20" y="38" width="120" height="34" fill="none" stroke="var(--rule)" stroke-width="1.5" />
            <text x="80" y="60" fill="var(--muted)" font-size="13" text-anchor="middle">Fold 2 训练</text>

            <rect x="20" y="76" width="120" height="34" fill="none" stroke="var(--focus)" stroke-width="2" />
            <text x="80" y="98" fill="var(--focus)" font-size="13" text-anchor="middle">Fold 3 验证</text>

            <path d="M 140 74 L 220 74" fill="none" stroke="var(--model)" stroke-width="2" marker-end="url(#oof-arr-model)" />
            <rect x="220" y="46" width="140" height="56" fill="none" stroke="var(--model)" stroke-width="2" />
            <text x="290" y="79" fill="var(--model)" font-size="16" text-anchor="middle">子模型 M₃</text>

            <path d="M 140 93 L 460 93" fill="none" stroke="var(--focus)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#oof-arr-focus)" />
            <path d="M 360 74 L 410 74 L 410 85 L 460 85" fill="none" stroke="var(--model)" stroke-width="2" />

            <rect x="470" y="78" width="180" height="34" fill="none" stroke="var(--focus)" stroke-width="2" />
            <text x="560" y="100" fill="var(--focus)" font-size="15" text-anchor="middle">oof₃ 预测</text>

            <path d="M 650 95 L 770 95" fill="none" stroke="var(--model)" stroke-width="2" marker-end="url(#oof-arr-model)" />
          </g>

          <!-- 拼接生成完整纯净元特征列 -->
          <g transform="translate(780, 50)">
            <rect x="0" y="0" width="150" height="380" fill="none" stroke="var(--model)" stroke-width="3" />

            <line x1="0" y1="126" x2="150" y2="126" stroke="var(--rule)" stroke-width="1.5" />
            <text x="75" y="68" fill="var(--model)" font-size="16" text-anchor="middle">oof₁</text>

            <line x1="0" y1="253" x2="150" y2="253" stroke="var(--rule)" stroke-width="1.5" />
            <text x="75" y="195" fill="var(--model)" font-size="16" text-anchor="middle">oof₂</text>

            <text x="75" y="322" fill="var(--model)" font-size="16" text-anchor="middle">oof₃</text>

            <path d="M 155 190 L 220 190" fill="none" stroke="var(--model)" stroke-width="4" marker-end="url(#oof-arr-model)" />
          </g>

          <!-- 右下角收束指向元学习器 -->
          <text x="855" y="470" fill="var(--text)" font-size="16" text-anchor="middle">输入第二层元学习器</text>

          <!-- 底部结论 -->
          <text x="30" y="580" fill="var(--model)" font-size="18">核心保证：元特征的每个元素均由未见过该样本的子模型产出，绝无泄漏。</text>
        </svg>
      </section>
    </div>
  </div>

  <aside class="notes" hidden>
    本页解析 Stacking 集成中最核心的高频陷阱：数据泄漏。
    如果让基学习器直接在原训练集上拟合后自测生成元特征，模型早已“记住”了样本和噪声，元学习器接收到虚假的超高精度特征，就会严重过拟合甚至彻底偏信高容量模型，最终导致上线测试时性能崩塌。
    标准方案是采用 K 折外预测（OOF）：轮流用 K-1 折训练基模型，仅对留出的未见折做预测，拼接成一个无泄漏的完整元特征列。这样让元学习器学到的是各基学习器在面对未知数据时的真实能力与误差分布。
  </aside>
