<!doctype html>
<!--
构图意图：
1. 主对象：集成的汇聚焦点——左侧多条来自不同基学习器（Bagging/Boosting/Stacking）的预测路径与误差波浪，在中央经由组合机制强烈汇束为右侧一道纯净、笃定的加粗决定线。
2. 关系表现：左侧轻量分散的模型蓝线（多样性）收束进垂直轴心（组合机制），右侧化为加粗的整体决策强线（准确性），并以唯一的焦点橙色微粒锁定汇聚之点，呼应主题签名。
3. 说明依附：标题区安静悬于左上方留白中，三个核心支柱词（准确性、多样性、组合机制）贴近对应的汇聚阶段作为结构标注，讲稿承担全部收束讲解。
-->
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #E8EEF1;
      --text: #142630;
      --muted: #50616B;
      --model: #17628E;
      --focus: #B83D0B;
      --rule: #71828B;
      --font-sans: "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
      --font-display: "Noto Sans CJK SC Medium", "Noto Sans CJK SC", sans-serif;
    }

    #stage {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow: hidden;
      padding: var(--pad-y) var(--pad-x);
    }

    /* 标题区域：安静纯净的排版 */
    .title-area {
      position: absolute;
      top: 104px;
      left: 104px;
      z-index: 10;
      max-width: 1100px;
    }

    .title-h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      margin: 0 0 20px 0;
      white-space: nowrap;
    }

    .title-sub {
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
      max-width: 820px;
    }

    /* 背景视觉图解 */
    .visual-frame {
      position: absolute;
      inset: 0;
      width: 1600px;
      height: 900px;
      pointer-events: none;
      z-index: 1;
    }

    /* 支柱标注与指示 */
    .pillar-note {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      font-weight: 600;
      fill: var(--muted);
      letter-spacing: 0.08em;
    }

    .pillar-val {
      font-size: var(--fs-sec);
      font-weight: 700;
      fill: var(--text);
    }

    /* 组合轴线与重点标 */
    .focus-point {
      fill: var(--focus);
    }
  </style>
</head>
<body data-page="32" data-total="32">
  <main id="stage" role="region" aria-label="本讲收束：集成的收益">
    <header class="title-area">
      <h1 class="title-h1">集成的收益来自准确性、多样性与正确的组合机制</h1>
      <p class="title-sub">弱学习器互补偏差，重采样与特征扰动抑制方差，汇于一致判决。</p>
    </header>

    <svg class="visual-frame" viewBox="0 0 1600 900" fill="none" aria-hidden="true">
      <defs>
        <!-- 弱模型路径渐变 -->
        <linearGradient id="grad-path-1" x1="140" y1="480" x2="1080" y2="620" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#17628E" stop-opacity="0.15"/>
          <stop offset="0.6" stop-color="#17628E" stop-opacity="0.5"/>
          <stop offset="1" stop-color="#17628E" stop-opacity="0.9"/>
        </linearGradient>
        <linearGradient id="grad-path-2" x1="140" y1="780" x2="1080" y2="620" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#17628E" stop-opacity="0.15"/>
          <stop offset="0.6" stop-color="#17628E" stop-opacity="0.5"/>
          <stop offset="1" stop-color="#17628E" stop-opacity="0.9"/>
        </linearGradient>
        <!-- 汇聚强线渐变 -->
        <linearGradient id="grad-final" x1="1080" y1="620" x2="1480" y2="620" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#17628E"/>
          <stop offset="1" stop-color="#17628E" stop-opacity="0.85"/>
        </linearGradient>
      </defs>

      <!-- 坐标参考网格与刻度线：蓝图墨线风 -->
      <g stroke="var(--rule)" stroke-width="1" opacity="0.3">
        <line x1="104" y1="820" x2="1496" y2="820" />
        <line x1="1080" y1="420" x2="1080" y2="820" stroke-dasharray="4 4" />
      </g>

      <!-- 汇聚之前的多条基学习器轨迹：体现“多样性与准确性” -->
      <!-- 轨迹 1 (高方差模型) -->
      <path d="M 140 460 C 400 420, 680 570, 1080 620" 
            stroke="url(#grad-path-1)" stroke-width="2" stroke-linecap="round"/>
      <!-- 轨迹 2 (欠拟合平缓模型) -->
      <path d="M 140 520 C 420 560, 720 590, 1080 620" 
            stroke="url(#grad-path-1)" stroke-width="2" stroke-linecap="round"/>
      <!-- 轨迹 3 (序列纠错微调轨迹) -->
      <path d="M 140 600 C 460 640, 780 630, 1080 620" 
            stroke="var(--model)" stroke-width="2" opacity="0.65" stroke-linecap="round"/>
      <!-- 轨迹 4 (随机子空间分支) -->
      <path d="M 140 680 C 440 690, 740 650, 1080 620" 
            stroke="url(#grad-path-2)" stroke-width="2" stroke-linecap="round"/>
      <!-- 轨迹 5 (边界扰动模型) -->
      <path d="M 140 760 C 420 760, 700 680, 1080 620" 
            stroke="url(#grad-path-2)" stroke-width="2" stroke-linecap="round"/>

      <!-- 多样性样本基点标记 -->
      <g fill="var(--model)" opacity="0.45">
        <circle cx="140" cy="460" r="3.5" />
        <circle cx="140" cy="520" r="3.5" />
        <circle cx="140" cy="600" r="3.5" />
        <circle cx="140" cy="680" r="3.5" />
        <circle cx="140" cy="760" r="3.5" />
      </g>

      <!-- 汇聚点：唯一的锐利橙色强调点（单页面积 < 5%） -->
      <g>
        <circle cx="1080" cy="620" r="7" fill="var(--focus)"/>
        <circle cx="1080" cy="620" r="14" stroke="var(--focus)" stroke-width="1.5" opacity="0.4"/>
      </g>

      <!-- 汇聚后的一致决策粗线：主题签名“多条路径在结论前收束为一条粗线” -->
      <path d="M 1080 620 L 1480 620" stroke="url(#grad-final)" stroke-width="4.5" stroke-linecap="round"/>

      <!-- 结构注解（蓝图标注风格） -->
      <!-- 阶段 1：多样性基学习器 -->
      <text x="140" y="425" class="pillar-note">基模型集</text>
      <text x="140" y="445" class="pillar-val">多样性 Diversity</text>

      <!-- 阶段 2：组合机制节点 -->
      <text x="1080" y="565" text-anchor="middle" class="pillar-note">组合决策</text>
      <text x="1080" y="588" text-anchor="middle" class="pillar-val">投票 / 加权 / Stacking</text>

      <!-- 阶段 3：最终收益 -->
      <text x="1360" y="585" class="pillar-note">最终判决</text>
      <text x="1360" y="607" class="pillar-val">泛化增益</text>

      <!-- 底部坐标参考文字 -->
      <text x="104" y="845" fill="var(--muted)" font-size="var(--fs-tick)" letter-spacing="0.05em">T = 1..M 学习器空间</text>
      <text x="1080" y="845" fill="var(--muted)" font-size="var(--fs-tick)" text-anchor="middle" letter-spacing="0.05em">聚合边界</text>
      <text x="1496" y="845" fill="var(--muted)" font-size="var(--fs-tick)" text-anchor="end" letter-spacing="0.05em">集成泛化输出</text>
    </svg>
  </main>

  <aside class="notes" hidden>
各位同学，第八讲到这里收束。
回顾整讲，集成学习并不是简单地把多个模型堆在一起。
它的根本收益源于三件事的结合：
第一，单个基学习器要有基础的准确性，也就是不能比随机猜测更差；
第二，基学习器之间必须具备充分的多样性，不管是通过有放回抽样、随机子空间，还是迭代聚焦错误样本，差异才是误差互相抵消的前提；
第三，需要选择与任务相匹配的组合机制，无论是平均、加权投票还是元学习器。
只有当这三者同时满足时，多条预测路径才能真正收束为稳定而强健的最终决策。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 32, total: 32 });
  </script>
</body>
</html>
