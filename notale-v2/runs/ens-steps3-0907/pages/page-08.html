<!--
  构图意图：
  1. 主对象为右侧并行的 Bootstrap 抽样流与基学习器预测束，最终在右下收束为单一加粗聚合线。
  2. 左侧为开阔宁静的章节标题区，右侧精密蓝图式路径通过由散入聚的几何收束，让“并行训练降低方差”在首屏一目了然。
  3. 说明文字贴附在路径汇聚口与标题导语区，画面字数严格控制在极精简范围。
-->
<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #E8EEF1;
      --text: #142630;
      --muted: #50616B;
      --model: #17628E;
      --focus: #B83D0B;
      --rule: #71828B;
      --font-sans: "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
      --font-display: "Noto Sans CJK SC Medium", "Noto Sans CJK SC", sans-serif;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      font-family: var(--font-sans);
    }

    /* 章节标题区 */
    .cover-header {
      position: absolute;
      left: 104px;
      top: 140px;
      width: 520px;
      z-index: 5;
    }

    .chapter-tag {
      font-size: var(--fs-sec);
      color: var(--muted);
      letter-spacing: 0.06em;
      margin-bottom: 24px;
      font-weight: 500;
    }

    .cover-title {
      font-family: var(--font-display);
      font-size: 54px;
      line-height: 1.15;
      color: var(--text);
      letter-spacing: -0.02em;
      margin: 0 0 28px 0;
      font-weight: 700;
    }

    .cover-title span {
      display: block;
    }

    .cover-lead {
      font-size: var(--fs-lead);
      line-height: 1.5;
      color: var(--muted);
      margin: 0;
      max-width: 460px;
    }

    /* 架构图形 */
    .schematic {
      position: absolute;
      inset: 0;
      width: 1600px;
      height: 900px;
      pointer-events: none;
      z-index: 2;
    }

    .data-source {
      fill: none;
      stroke: var(--rule);
      stroke-width: 1.5px;
      stroke-dasharray: 4 4;
    }

    .parallel-line {
      fill: none;
      stroke: var(--model);
      stroke-width: 2px;
      opacity: 0.85;
    }

    .var-band {
      fill: var(--model);
      fill-opacity: 0.08;
    }

    .var-converged {
      fill: var(--model);
      fill-opacity: 0.22;
    }

    .converged-line {
      fill: none;
      stroke: var(--model);
      stroke-width: 4.5px;
      stroke-linecap: round;
    }

    .focus-marker {
      fill: var(--focus);
    }

    .diag-text {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      fill: var(--text);
      font-weight: 500;
    }

    .diag-muted {
      font-family: var(--font-sans);
      font-size: var(--fs-sec);
      fill: var(--muted);
    }
  </style>
</head>

  <aside class="notes" hidden>
    各位同学，我们正式进入第三章：Bagging 体系。
    上一章我们看到，单棵决策树容易过拟合，对数据微小扰动极度敏感，也就是方差很大。
    Bagging 的核心思路非常质朴而强健：用 Bootstrap 重采样构建多套互相独立的数据集，在上面并行训练各自不稳定的基模型，最后以简单的投票或求平均聚合结果。
    本章我们将逐步剖析：重采样如何发生、并行架构如何组装、方差为何在数学上会被多倍平摊，以及伴随而来的袋外评估机制。
  </aside>
