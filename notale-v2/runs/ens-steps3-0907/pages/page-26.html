<!doctype html>
<!--
  构图意图：
  1. 主对象：异质基学习器（树模型、核SVM、线性模型、最近邻）的异构预测特征，经多条等重蓝色几何束收束至元学习器（Meta-Learner）的单一点，完成决策分流与方法选择。
  2. 关系表达：左侧树状/核函数/流形三种异质基模型几何符号，经水平流线汇聚至中央的垂直决策分层线，右侧延伸出方法选择准则的矩阵对齐结构。
  3. 说明文字：大标题与核心提问置于左上方空域，与右下方的特征收束图景形成对角张力，无多余包装盒。
-->
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
    }

    .cover-copy {
      position: absolute;
      top: 110px;
      left: 100px;
      width: 620px;
      z-index: 10;
    }

    .cover-tag {
      font-size: var(--fs-label);
      color: var(--focus);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 24px;
      font-weight: 600;
    }

    h1 {
      margin: 0 0 24px 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      letter-spacing: -0.02em;
      color: var(--text);
    }

    h1 span {
      display: block;
      color: var(--model);
    }

    .lead-text {
      margin: 0;
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      max-width: 520px;
    }

    .blueprint-svg {
      position: absolute;
      top: 0;
      right: 0;
      width: 1600px;
      height: 900px;
      pointer-events: none;
      z-index: 2;
    }

    /* 蓝图式标注风格 */
    .model-path {
      stroke: var(--model);
      stroke-width: var(--stroke);
      fill: none;
    }

    .focus-path {
      stroke: var(--focus);
      stroke-width: var(--stroke-strong);
      fill: none;
    }

    .rule-line {
      stroke: var(--rule);
      stroke-width: 1px;
      stroke-dasharray: 4 4;
      fill: none;
    }

    .node-label {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      fill: var(--text);
      font-weight: 500;
    }

    .node-sub {
      font-family: var(--font-sans);
      font-size: var(--fs-tick);
      fill: var(--muted);
    }

    .node-focus {
      fill: var(--focus);
      font-weight: 600;
    }
  </style>
</head>
<body data-page="26" data-total="32">
  <main id="stage">
    <header class="cover-copy">
      <h1>
        异质集成
        <span>与方法选择</span>
      </h1>
      <p class="lead-text">
        组织不同归纳偏置的模型，并建立工程决策法则。
      </p>
    </header>

    <svg class="blueprint-svg cv-fill" viewBox="0 0 1600 900" aria-hidden="true">
      <!-- 顶部与底部坐标标尺基准线 -->
      <line x1="720" y1="80" x2="1520" y2="80" class="rule-line" />
      <line x1="720" y1="820" x2="1520" y2="820" class="rule-line" />

      <!-- 基模型来源：4个异质算法几何原型 (x ≈ 760) -->
      <!-- 1. 决策树模型 -->
      <g transform="translate(740, 160)">
        <rect x="0" y="0" width="130" height="54" fill="none" stroke="var(--rule)" stroke-width="1.5" />
        <text x="65" y="26" text-anchor="middle" class="node-label">决策树群</text>
        <text x="65" y="44" text-anchor="middle" class="node-sub">轴平行切分</text>
      </g>

      <!-- 2. 支持向量机 -->
      <g transform="translate(740, 290)">
        <rect x="0" y="0" width="130" height="54" fill="none" stroke="var(--rule)" stroke-width="1.5" />
        <text x="65" y="26" text-anchor="middle" class="node-label">支持向量机</text>
        <text x="65" y="44" text-anchor="middle" class="node-sub">最大间隔超平面</text>
      </g>

      <!-- 3. 神经网络 -->
      <g transform="translate(740, 420)">
        <rect x="0" y="0" width="130" height="54" fill="none" stroke="var(--rule)" stroke-width="1.5" />
        <text x="65" y="26" text-anchor="middle" class="node-label">多层感知机</text>
        <text x="65" y="44" text-anchor="middle" class="node-sub">非线性多层表征</text>
      </g>

      <!-- 4. 线性/正则化模型 -->
      <g transform="translate(740, 550)">
        <rect x="0" y="0" width="130" height="54" fill="none" stroke="var(--rule)" stroke-width="1.5" />
        <text x="65" y="26" text-anchor="middle" class="node-label">正则线性模型</text>
        <text x="65" y="44" text-anchor="middle" class="node-sub">高维稀疏基准</text>
      </g>

      <!-- 层级 1 标注 -->
      <text x="805" y="130" text-anchor="middle" class="node-sub">第 1 层：异质基学习器</text>

      <!-- 汇聚连线：收束至元学习器节点 (1160, 380) -->
      <!-- 连线 1 -->
      <path d="M 870 187 C 980 187, 1040 370, 1140 378" class="model-path" />
      <!-- 连线 2 -->
      <path d="M 870 317 C 970 317, 1040 375, 1140 380" class="model-path" />
      <!-- 连线 3 -->
      <path d="M 870 447 C 970 447, 1040 385, 1140 382" class="model-path" />
      <!-- 连线 4 -->
      <path d="M 870 577 C 980 577, 1040 390, 1140 384" class="model-path" />

      <!-- 中间收束主干（汇聚点与元学习器） -->
      <g transform="translate(1140, 340)">
        <!-- 元学习器主体框 -->
        <rect x="0" y="0" width="150" height="82" fill="none" stroke="var(--model)" stroke-width="2" />
        <text x="75" y="32" text-anchor="middle" class="node-label" fill="var(--model)">元学习器</text>
        <text x="75" y="52" text-anchor="middle" class="node-sub">Stacking / Blending</text>
        <text x="75" y="70" text-anchor="middle" class="node-focus">学习最佳组合权重</text>
      </g>

      <text x="1215" y="315" text-anchor="middle" class="node-sub">第 2 层：元特征重构</text>

      <!-- 汇聚收束路径并流向最终决策 (1290, 381) -> (1480, 381) -->
      <path d="M 1290 381 L 1420 381" class="focus-path" />
      <polygon points="1420,375 1435,381 1420,387" fill="var(--focus)" />

      <!-- 最终输出节点 -->
      <g transform="translate(1380, 420)">
        <text x="50" y="0" text-anchor="middle" class="node-label">组合决策输出</text>
      </g>

      <!-- 底部方法权衡准则：三维决策轴 -->
      <g transform="translate(740, 680)">
        <line x1="0" y1="0" x2="680" y2="0" stroke="var(--rule)" stroke-width="1" />
        
        <circle cx="80" cy="38" r="3" fill="var(--model)" />
        <text x="95" y="42" class="node-label">偏差-方差结构</text>

        <circle cx="280" cy="38" r="3" fill="var(--model)" />
        <text x="295" y="42" class="node-label">计算与推理预算</text>

        <circle cx="480" cy="38" r="3" fill="var(--model)" />
        <text x="495" y="42" class="node-label">可解释性需求</text>
      </g>
    </svg>
  </main>

  <aside class="notes" hidden>
    各位同学，今天我们进入第八讲的第六部分：异质集成与方法选择。
    在前面的章节中，无论是 Bagging 还是 Boosting，我们使用的基模型通常都是同质的——大多基于决策树。
    而在实际复杂的机器学习工程中，单一种类的模型往往存在固有的归纳偏置局限。
    本章我们将探讨如何通过 Stacking 架构融合树模型、支持向量机与神经网络等异质算法，
    并系统梳理在实际工业场景中，面对不同的数据规模、延迟限制与解释要求时，应当如何选择最合适的集成方案。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 26, total: 32 });
  </script>
</body>
</html>
