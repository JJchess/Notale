<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      color-scheme: light;
    }
    #stage {
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      isolation: isolate;
      background: var(--bg);
      overflow: hidden;
    }

    .title-block {
      position: absolute;
      left: var(--pad-x);
      top: 180px;
      z-index: 5;
      max-width: 520px;
      pointer-events: none;
    }

    h1.title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      color: var(--text);
      letter-spacing: -0.02em;
      margin: 0 0 20px 0;
      font-weight: 700;
    }

    .lead-text {
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
    }

    .blueprint {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .single-path {
      stroke: var(--rule);
      stroke-width: var(--stroke);
      fill: none;
      stroke-dasharray: 5 4;
    }

    .ensemble-path {
      stroke: var(--model);
      stroke-width: var(--stroke);
      fill: none;
      opacity: 0.85;
    }

    .converged-path {
      stroke: var(--model);
      stroke-width: var(--stroke-strong);
      fill: none;
    }

    .node-base {
      fill: #ffffff;
      stroke: var(--model);
      stroke-width: 2px;
    }

    .node-focus {
      fill: #ffffff;
      stroke: var(--focus);
      stroke-width: 2px;
    }

    .label-text {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      fill: var(--text);
      dominant-baseline: middle;
    }

    .sec-label {
      font-family: var(--font-sans);
      font-size: var(--fs-sec);
      fill: var(--muted);
      dominant-baseline: middle;
    }

    .tick-text {
      font-family: var(--font-sans);
      font-size: var(--fs-tick);
      fill: var(--muted);
    }

    .flowing-trace {
      stroke-dasharray: 8 6;
      animation: trace-flow 20s linear infinite;
    }

    @keyframes trace-flow {
      to { stroke-dashoffset: -280; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flowing-trace {
        animation: none;
      }
    }
  </style>
</head>
<body data-page="03" data-total="32">
  <div id="stage">
    <header class="title-block">
      <h1 class="title">从单模型<br>到集成模型</h1>
      <p class="lead-text">单模型受限于假设空间与样本扰动。集成方法组合多个有差异的基学习器，系统性抑制方差与偏差。</p>
    </header>

    <svg class="blueprint" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="单模型与集成模型的决策架构对比">
      <defs>
        <marker id="arr-rule" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1.5 L 6 4 L 0 6.5 z" fill="#71828B"/>
        </marker>
        <marker id="arr-model" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1.5 L 6 4 L 0 6.5 z" fill="#17628E"/>
        </marker>
      </defs>

      <!-- 结构中线分隔 -->
      <line x1="640" y1="140" x2="640" y2="760" stroke="#71828B" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/>

      <!-- 单学习器路径 -->
      <g transform="translate(700, 0)">
        <text x="0" y="180" class="sec-label" font-weight="600" fill="#142630">单学习器</text>
        <circle cx="20" cy="245" r="4" fill="#71828B"/>
        <text x="35" y="246" class="tick-text">样本数据</text>

        <line x1="105" y1="245" x2="225" y2="245" class="single-path" marker-end="url(#arr-rule)"/>
        <rect x="230" y="223" width="112" height="44" rx="4" class="node-base" stroke="#71828B"/>
        <text x="286" y="246" class="label-text" text-anchor="middle" fill="#50616B">单决策树</text>

        <line x1="346" y1="245" x2="475" y2="245" class="single-path" marker-end="url(#arr-rule)"/>
        <circle cx="485" cy="245" r="4.5" fill="#B83D0B"/>
        <text x="502" y="246" class="label-text" fill="#B83D0B">单点过拟合风险</text>
      </g>

      <!-- 集成模型路径 -->
      <g transform="translate(700, 210)">
        <text x="0" y="170" class="sec-label" font-weight="600" fill="#17628E">集成架构</text>
        <circle cx="20" cy="380" r="5" fill="#17628E"/>
        <text x="35" y="381" class="tick-text">重采样与扰动</text>

        <!-- 5 条分支 -->
        <path d="M 125 380 C 165 380, 185 270, 230 270" class="ensemble-path flowing-trace"/>
        <path d="M 125 380 C 165 380, 185 325, 230 325" class="ensemble-path flowing-trace"/>
        <path d="M 125 380 L 230 380" class="ensemble-path flowing-trace"/>
        <path d="M 125 380 C 165 380, 185 435, 230 435" class="ensemble-path flowing-trace"/>
        <path d="M 125 380 C 165 380, 185 490, 230 490" class="ensemble-path flowing-trace"/>

        <!-- 基学习器 -->
        <g transform="translate(235, 252)">
          <rect width="104" height="36" rx="3" class="node-base"/>
          <text x="52" y="19" class="label-text" text-anchor="middle" fill="#17628E">基模型 h₁</text>
        </g>
        <g transform="translate(235, 307)">
          <rect width="104" height="36" rx="3" class="node-base"/>
          <text x="52" y="19" class="label-text" text-anchor="middle" fill="#17628E">基模型 h₂</text>
        </g>
        <g transform="translate(235, 362)">
          <rect width="104" height="36" rx="3" class="node-focus"/>
          <text x="52" y="19" class="label-text" text-anchor="middle" fill="#B83D0B" font-weight="600">差异模型 h₃</text>
        </g>
        <g transform="translate(235, 417)">
          <rect width="104" height="36" rx="3" class="node-base"/>
          <text x="52" y="19" class="label-text" text-anchor="middle" fill="#17628E">基模型 h₄</text>
        </g>
        <g transform="translate(235, 472)">
          <rect width="104" height="36" rx="3" class="node-base"/>
          <text x="52" y="19" class="label-text" text-anchor="middle" fill="#17628E">基模型 h₅</text>
        </g>

        <!-- 汇聚收束 -->
        <path d="M 342 270 C 400 270, 440 380, 485 380" class="ensemble-path"/>
        <path d="M 342 325 C 400 325, 440 380, 485 380" class="ensemble-path"/>
        <path d="M 342 380 L 485 380" class="ensemble-path"/>
        <path d="M 342 435 C 400 435, 440 380, 485 380" class="ensemble-path"/>
        <path d="M 342 490 C 400 490, 440 380, 485 380" class="ensemble-path"/>

        <!-- 聚合节点 -->
        <g transform="translate(488, 350)">
          <circle cx="30" cy="30" r="30" fill="#17628E"/>
          <text x="30" y="24" class="label-text" text-anchor="middle" fill="#ffffff" font-weight="600">聚合</text>
          <text x="30" y="42" class="tick-text" text-anchor="middle" fill="#E8EEF1">投票 / 平均</text>
        </g>

        <!-- 收束粗线 -->
        <line x1="552" y1="380" x2="655" y2="380" class="converged-path" marker-end="url(#arr-model)"/>
        
        <!-- 强学习器输出 -->
        <g transform="translate(668, 362)">
          <text x="0" y="16" class="label-text" font-weight="700" fill="#17628E">强学习器 H(x)</text>
          <text x="0" y="34" class="tick-text">泛化误差与方差降低</text>
        </g>
      </g>

      <!-- 底部刻度基线与结论 -->
      <line x1="56" y1="840" x2="1544" y2="840" stroke="#71828B" stroke-width="1" opacity="0.3"/>
      <text x="56" y="865" class="tick-text">核心原则：基学习器保持准确性且彼此具备多样性</text>
    </svg>
  </div>

  <aside class="notes" hidden>
    欢迎进入第一部分：从单模型到集成模型。
    以往训练单个复杂模型时，很容易受到样本局部波动的干扰，造成预测方差偏大。
    集成学习的核心直觉，是通过重采样或特征扰动生成多个有差异的基学习器，再通过表决或平均聚合共识。这种群体决策能够显著平滑个体错误，获得更稳健的泛化表现。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 3, total: 32, keys: false });
  </script>
</body>
</html>
