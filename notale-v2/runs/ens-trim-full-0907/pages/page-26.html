<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--pad-y) var(--pad-x);
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
    }

    /* 顶部与左侧标题区 */
    .title-area {
      position: absolute;
      left: var(--pad-x);
      top: 108px;
      z-index: 10;
      pointer-events: none;
    }

    .chapter-tag {
      font-size: var(--fs-label);
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    h1.page-title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      color: var(--text);
      letter-spacing: -0.02em;
      margin: 0 0 16px 0;
      font-weight: 600;
    }

    .subtitle {
      font-size: var(--fs-lead);
      color: var(--muted);
      line-height: var(--lh-copy);
      max-width: 480px;
    }

    /* 构图：将右侧异质集成图解适度向左平移居中 */
    .blueprint {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .node-title {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      fill: var(--text);
      font-weight: 500;
    }

    .node-sub {
      font-family: var(--font-sans);
      font-size: var(--fs-tick);
      fill: var(--muted);
    }

    /* 底部三元分析 */
    .callout-pill {
      position: absolute;
      left: var(--pad-x);
      bottom: var(--pad-y);
      display: flex;
      gap: 36px;
      align-items: baseline;
      z-index: 10;
    }

    .pill-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .pill-kicker {
      font-size: var(--fs-tick);
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .pill-val {
      font-size: var(--fs-sec);
      color: var(--text);
      font-weight: 500;
    }

    .trace-line {
      stroke-dasharray: 600;
      stroke-dashoffset: 0;
      animation: trace-in 1.2s var(--ease-out) both;
    }

    @keyframes trace-in {
      from { stroke-dashoffset: 600; }
      to { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .trace-line {
        animation: none !important;
      }
    }
  </style>
</head>
<body data-page="26" data-total="32">
  <div id="stage">
    <header class="title-area">
      <div class="chapter-tag">第六单元 · 模型融合与选型</div>
      <h1 class="page-title">异质集成与方法选择</h1>
      <p class="subtitle">打破同质基模型假设，融合互补的归纳偏置；在性能瓶颈处寻求最优组合。</p>
    </header>

    <!-- 异质模型分流与 Stacking 组合流程图（坐标全部收拢在 1480 以内，避免越界） -->
    <svg class="blueprint" viewBox="0 0 1600 900" fill="none">
      <defs>
        <filter id="focus-glow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#B83D0B" flood-opacity="0.25"/>
        </filter>
      </defs>

      <!-- 结构网格标尺 -->
      <g stroke="var(--rule)" stroke-width="1" opacity="0.3" stroke-dasharray="3 4">
        <line x1="640" y1="120" x2="640" y2="780" />
        <line x1="920" y1="120" x2="920" y2="780" />
        <line x1="1200" y1="120" x2="1200" y2="780" />
      </g>

      <!-- 输入层 -->
      <g id="input-source">
        <circle cx="640" cy="450" r="5" fill="var(--muted)" />
        <text x="620" y="455" text-anchor="end" class="node-title">训练集 D</text>
        <text x="620" y="475" text-anchor="end" class="node-sub">同一特征空间</text>
      </g>

      <!-- 分流至异质基模型路径 -->
      <g stroke="var(--model)" stroke-width="var(--stroke)">
        <path d="M640 450 C 720 450, 750 250, 830 250" class="trace-line" />
        <path d="M640 450 L 830 450" class="trace-line" />
        <path d="M640 450 C 720 450, 750 650, 830 650" class="trace-line" />
      </g>

      <!-- Level-0 异质基学习器 -->
      <g id="base-1" transform="translate(830, 250)">
        <rect x="0" y="-36" width="136" height="72" fill="var(--bg)" stroke="var(--model)" stroke-width="2" />
        <text x="16" y="-6" class="node-title">决策树 / RF</text>
        <text x="16" y="18" class="node-sub">正交切分偏置</text>
      </g>

      <g id="base-2" transform="translate(830, 450)">
        <rect x="0" y="-36" width="136" height="72" fill="var(--bg)" stroke="var(--model)" stroke-width="2" />
        <text x="16" y="-6" class="node-title">支持向量机</text>
        <text x="16" y="18" class="node-sub">超平面边界偏置</text>
      </g>

      <g id="base-3" transform="translate(830, 650)">
        <rect x="0" y="-36" width="136" height="72" fill="var(--bg)" stroke="var(--model)" stroke-width="2" />
        <text x="16" y="-6" class="node-title">多层感知机</text>
        <text x="16" y="18" class="node-sub">连续流形偏置</text>
      </g>

      <!-- 元特征预测流动线 -->
      <g stroke="var(--model)" stroke-width="var(--stroke)" opacity="0.8">
        <path d="M966 250 C 1050 250, 1080 420, 1150 435" />
        <path d="M966 450 L 1150 450" />
        <path d="M966 650 C 1050 650, 1080 480, 1150 465" />
      </g>

      <!-- Level-1 元学习器：强调用色与加粗收束 -->
      <g id="meta-learner" transform="translate(1150, 450)">
        <rect x="0" y="-46" width="144" height="92" fill="var(--bg)" stroke="var(--focus)" stroke-width="var(--stroke-strong)" filter="url(#focus-glow)" />
        <text x="16" y="-12" class="node-title" fill="var(--focus)">元学习器</text>
        <text x="16" y="12" class="node-sub" fill="var(--focus)">学习最优组合权重</text>
        <text x="16" y="28" class="node-sub">Stacking / 投票</text>

        <!-- 汇聚收束路径：多路径收为一条强粗线（签名动作） -->
        <line x1="144" y1="0" x2="224" y2="0" stroke="var(--focus)" stroke-width="var(--stroke-strong)" />
        <polygon points="224,-5 236,0 224,5" fill="var(--focus)" />
        <text x="246" y="5" class="node-title">汇聚预测</text>
      </g>

      <!-- 阶段层级说明 -->
      <g transform="translate(898, 140)">
        <text x="0" y="0" class="node-sub" text-anchor="middle">Level-0 异质基学习器</text>
      </g>
      <g transform="translate(1222, 360)">
        <text x="0" y="0" class="node-sub" text-anchor="middle">Level-1 元特征空间</text>
      </g>
    </svg>

    <!-- 底部结论与关键原则 -->
    <footer class="callout-pill">
      <div class="pill-item">
        <span class="pill-kicker">多样性来源</span>
        <span class="pill-val">异质模型结构互补</span>
      </div>
      <div class="pill-item">
        <span class="pill-kicker">融合机制</span>
        <span class="pill-val">元特征训练拟合</span>
      </div>
      <div class="pill-item">
        <span class="pill-kicker">工程核心</span>
        <span class="pill-val">防泄漏与计算预算</span>
      </div>
    </footer>
  </div>

  <aside class="notes" hidden>
    本单元进入异质集成与方法选择。
    前面介绍的 Bagging、随机森林和 Boosting，基模型大多采用同一种算法——通常是决策树。
    但同质模型的归纳偏置是单一的。异质集成（如 Stacking）打破了这种限制，将决策树的正交切割、SVM 的最大间隔和神经网络的连续流形结合起来，由元学习器自主学习最佳组合策略。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 26, total: 32 });
  </script>
</body>
</html>
