<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: var(--pad-y) var(--pad-x);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      position: relative;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      color: var(--text);
      margin: 0 0 6px 0;
      letter-spacing: -0.02em;
    }

    .lead {
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
    }

    .matrix-wrap {
      flex: 1;
      width: 100%;
      min-height: 0;
      position: relative;
    }

    svg.comparison-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .axis-label {
      font-family: var(--font-sans);
      font-size: var(--fs-sec);
      fill: var(--muted);
      font-weight: 500;
    }

    .col-title {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: 600;
      fill: var(--text);
    }

    .cell-val {
      font-family: var(--font-sans);
      font-size: var(--fs-body);
      fill: var(--text);
    }

    .cell-highlight {
      font-weight: 600;
      fill: var(--model);
    }

    .cell-focus {
      font-weight: 600;
      fill: var(--focus);
    }

    .dim-rule {
      stroke: var(--rule);
      stroke-width: 1px;
      stroke-dasharray: 4 4;
      opacity: 0.35;
    }

    .col-rule {
      stroke: var(--rule);
      stroke-width: 1px;
      opacity: 0.3;
    }

    .main-rule {
      stroke: var(--rule);
      stroke-width: var(--stroke);
    }

    .mech-line {
      stroke: var(--model);
      stroke-width: 2px;
      fill: none;
    }

    .mech-focus {
      stroke: var(--focus);
      stroke-width: 2px;
      fill: none;
    }

    .tag-text {
      font-family: var(--font-sans);
      font-size: var(--fs-tick);
      fill: var(--muted);
    }
  </style>
</head>
<body data-page="29" data-total="32">
  <div id="stage">
    <header>
      <h1>四大集成范式对照</h1>
      <p class="lead">拓扑结构决定依赖流向，误差侧重界定适用边界。</p>
    </header>

    <div class="matrix-wrap min0">
      <svg class="comparison-svg" viewBox="0 0 1488 640">
        <!-- 表格对齐骨架线 -->
        <g class="grid-lines">
          <line x1="180" y1="80" x2="1480" y2="80" class="main-rule" />
          <line x1="180" y1="215" x2="1480" y2="215" class="dim-rule" />
          <line x1="180" y1="355" x2="1480" y2="355" class="dim-rule" />
          <line x1="180" y1="495" x2="1480" y2="495" class="dim-rule" />
          <line x1="180" y1="625" x2="1480" y2="625" class="main-rule" />

          <line x1="180" y1="20" x2="180" y2="625" class="main-rule" />
          <line x1="505" y1="20" x2="505" y2="625" class="col-rule" />
          <line x1="830" y1="20" x2="830" y2="625" class="col-rule" />
          <line x1="1155" y1="20" x2="1155" y2="625" class="col-rule" />
        </g>

        <!-- 维度标签（左列） -->
        <g class="dimensions">
          <text class="axis-label" x="40" y="155">执行拓扑</text>
          <text class="axis-label" x="40" y="295">多样性来源</text>
          <text class="axis-label" x="40" y="435">误差优化</text>
          <text class="axis-label" x="40" y="570">基学习器</text>
        </g>

        <!-- 第一列：Bagging -->
        <g class="col col-bagging" transform="translate(215, 0)">
          <text class="col-title" x="0" y="52">Bagging</text>

          <!-- 拓扑机制图解 -->
          <g transform="translate(0, 105)">
            <rect x="0" y="8" width="56" height="24" rx="4" fill="none" stroke="var(--model)" stroke-width="1.5" />
            <rect x="0" y="40" width="56" height="24" rx="4" fill="none" stroke="var(--model)" stroke-width="1.5" />
            <rect x="0" y="72" width="56" height="24" rx="4" fill="none" stroke="var(--model)" stroke-width="1.5" />
            <path d="M 62 20 L 100 44" class="mech-line" />
            <path d="M 62 52 L 100 52" class="mech-line" />
            <path d="M 62 84 L 100 60" class="mech-line" />
            <circle cx="112" cy="52" r="11" fill="none" stroke="var(--model)" stroke-width="2" />
            <text class="tag-text" x="112" y="56" text-anchor="middle">均</text>
            <text class="cell-val cell-highlight" x="136" y="57">完全并行</text>
          </g>

          <text class="cell-val" x="0" y="295">样本自主采样</text>
          <text class="cell-val cell-highlight" x="0" y="435">降方差</text>
          <text class="cell-val" x="0" y="570">强模型（决策树）</text>
        </g>

        <!-- 第二列：随机森林 -->
        <g class="col col-rf" transform="translate(540, 0)">
          <text class="col-title" x="0" y="52">随机森林</text>

          <!-- 拓扑机制图解 -->
          <g transform="translate(0, 105)">
            <g stroke="var(--model)" stroke-width="1.5" fill="none">
              <path d="M 22 14 L 12 30 M 22 14 L 32 30" />
              <path d="M 22 46 L 12 62 M 22 46 L 32 62" />
              <path d="M 22 78 L 12 94 M 22 78 L 32 94" />
            </g>
            <path d="M 40 22 L 85 46" class="mech-line" />
            <path d="M 40 54 L 85 54" class="mech-line" />
            <path d="M 40 86 L 85 62" class="mech-line" />
            <circle cx="97" cy="54" r="11" fill="none" stroke="var(--model)" stroke-width="2" />
            <text class="tag-text" x="97" y="58" text-anchor="middle">票</text>
            <text class="cell-val cell-highlight" x="122" y="59">并行随机树</text>
          </g>

          <text class="cell-val cell-highlight" x="0" y="295">样本 + 特征双重扰动</text>
          <text class="cell-val cell-highlight" x="0" y="435">强降方差</text>
          <text class="cell-val" x="0" y="570">未剪枝深树</text>
        </g>

        <!-- 第三列：Boosting -->
        <g class="col col-boosting" transform="translate(865, 0)">
          <text class="col-title" x="0" y="52">Boosting</text>

          <!-- 拓扑机制图解 -->
          <g transform="translate(0, 105)">
            <rect x="0" y="38" width="44" height="28" rx="4" fill="none" stroke="var(--model)" stroke-width="1.5" />
            <text class="tag-text" x="22" y="56" text-anchor="middle">M₁</text>
            <path d="M 48 52 L 68 52" class="mech-focus" />
            <rect x="72" y="38" width="44" height="28" rx="4" fill="none" stroke="var(--model)" stroke-width="1.5" />
            <text class="tag-text" x="94" y="56" text-anchor="middle">M₂</text>
            <path d="M 120 52 L 140 52" class="mech-focus" />
            <rect x="144" y="38" width="44" height="28" rx="4" fill="none" stroke="var(--focus)" stroke-width="2" />
            <text class="tag-text" x="166" y="56" text-anchor="middle" fill="var(--focus)">M₃</text>
            <text class="cell-val cell-focus" x="0" y="96">串行纠错</text>
          </g>

          <text class="cell-val" x="0" y="295">残差拟合 / 重赋权</text>
          <text class="cell-val cell-focus" x="0" y="435">降偏差</text>
          <text class="cell-val" x="0" y="570">弱模型（浅层树）</text>
        </g>

        <!-- 第四列：Stacking -->
        <g class="col col-stacking" transform="translate(1190, 0)">
          <text class="col-title" x="0" y="52">Stacking</text>

          <!-- 拓扑机制图解 -->
          <g transform="translate(0, 105)">
            <rect x="0" y="8" width="48" height="20" rx="3" fill="none" stroke="var(--model)" stroke-width="1.5" />
            <text class="tag-text" x="24" y="22" text-anchor="middle">SVM</text>
            <rect x="0" y="38" width="48" height="20" rx="3" fill="none" stroke="var(--model)" stroke-width="1.5" />
            <text class="tag-text" x="24" y="52" text-anchor="middle">RF</text>
            <rect x="0" y="68" width="48" height="20" rx="3" fill="none" stroke="var(--model)" stroke-width="1.5" />
            <text class="tag-text" x="24" y="82" text-anchor="middle">XGB</text>

            <path d="M 52 18 L 96 46" class="mech-line" stroke-dasharray="3 3" />
            <path d="M 52 48 L 96 48" class="mech-line" stroke-dasharray="3 3" />
            <path d="M 52 78 L 96 54" class="mech-line" stroke-dasharray="3 3" />

            <rect x="100" y="32" width="60" height="32" rx="4" fill="none" stroke="var(--focus)" stroke-width="2" />
            <text class="tag-text" x="130" y="52" text-anchor="middle" fill="var(--focus)">元模型</text>
            <text class="cell-val cell-highlight" x="0" y="118">分层学习</text>
          </g>

          <text class="cell-val cell-highlight" x="0" y="295">异质算法归纳偏置</text>
          <text class="cell-val" x="0" y="435">兼顾偏差与方差</text>
          <text class="cell-val" x="0" y="570">异质且折外交叉</text>
        </g>
      </svg>
    </div>
  </div>

  <aside class="notes" hidden>
    本页将四大集成范式并置对比。
    第一看执行拓扑：Bagging 与随机森林是完全并行的分支；Boosting 是顺次纠错的严格串行；Stacking 则是两层纵向传递。
    第二看多样性：前两者靠抽样与随机子空间；Boosting 靠自适应样本分布；Stacking 靠不同算法偏置。
    第三看误差分解：并行同质集成主要降低方差；串行集成主要拟合残差降低偏差；Stacking 则由基模型多样性与元学习器共同决定。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 29, total: 32 });
  </script>
</body>
</html>
