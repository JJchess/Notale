<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      position: relative;
      width: var(--stage-w);
      height: var(--stage-h);
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow: hidden;
    }

    header {
      position: absolute;
      top: 40px;
      left: 56px;
      right: 56px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      margin: 0;
      letter-spacing: -0.02em;
    }
    .header-note {
      font-size: var(--fs-lead);
      color: var(--muted);
      margin: 0;
    }

    #tree-stage {
      position: absolute;
      top: 110px;
      left: 56px;
      width: 1488px;
      height: 730px;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* 树枝 */
    .branch {
      stroke: var(--rule);
      stroke-width: var(--stroke);
      fill: none;
      transition: stroke var(--motion-fast), stroke-width var(--motion-fast);
    }
    .branch.highlight {
      stroke: var(--model);
      stroke-width: var(--stroke-strong);
    }

    /* 决策条件节点 */
    .cond-title {
      font-size: var(--fs-sec);
      font-weight: 700;
      fill: var(--text);
      text-anchor: middle;
    }

    /* 路径条件标注 */
    .edge-tag {
      font-size: var(--fs-label);
      fill: var(--muted);
      text-anchor: middle;
      transition: fill var(--motion-fast);
    }
    .edge-tag.highlight {
      fill: var(--model);
      font-weight: 700;
    }

    /* 决策结论卡片：无多余容器阴影，由直切线划分 */
    .leaf-group {
      cursor: pointer;
    }
    .leaf-box {
      fill: var(--bg);
      stroke: var(--rule);
      stroke-width: var(--stroke);
      transition: stroke var(--motion-fast), stroke-width var(--motion-fast);
    }
    .leaf-group:hover .leaf-box,
    .leaf-group.active .leaf-box {
      stroke: var(--focus);
      stroke-width: var(--stroke-strong);
    }
    .leaf-title {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      fill: var(--text);
      transition: fill var(--motion-fast);
    }
    .leaf-group:hover .leaf-title,
    .leaf-group.active .leaf-title {
      fill: var(--focus);
    }
    .leaf-tag {
      font-size: var(--fs-label);
      fill: var(--model);
      font-weight: 500;
    }
    .leaf-val {
      font-size: var(--fs-label);
      fill: var(--muted);
    }
    .leaf-target {
      font-size: var(--fs-label);
      fill: var(--focus);
      font-weight: 600;
    }
  </style>
</head>
<body data-page="30" data-total="32">
  <div id="stage">
    <header>
      <h1>依据约束选择集成策略</h1>
      <p class="header-note">基模型状态与业务预算决定集成范式</p>
    </header>

    <main id="tree-stage">
      <svg id="decision-tree" viewBox="0 0 1488 730">
        <!-- 决策树路径 -->
        <g id="branches">
          <!-- 根向左右分流 (0, 1) -->
          <path class="branch" d="M 744,50 L 744,88 L 372,126 L 372,154" />
          <path class="branch" d="M 744,50 L 744,88 L 1116,126 L 1116,154" />

          <!-- 左侧同质：方差与偏差 (2, 3) -->
          <path class="branch" d="M 372,192 L 372,236 L 186,274 L 186,306" />
          <path class="branch" d="M 372,192 L 372,236 L 558,274 L 558,306" />

          <!-- 高方差直达 RF (4) -->
          <path class="branch" d="M 186,342 L 186,450" />

          <!-- 高偏差下按延迟约束分支 (5, 6) -->
          <path class="branch" d="M 558,342 L 558,390 L 465,420 L 465,450" />
          <path class="branch" d="M 558,342 L 558,390 L 651,420 L 651,450" />

          <!-- 右侧异质：按工程与吞吐分流 (7, 8) -->
          <path class="branch" d="M 1116,192 L 1116,252 L 930,296 L 930,344" />
          <path class="branch" d="M 1116,192 L 1116,252 L 1302,296 L 1302,344" />

          <!-- 异质分流直达叶子 (9, 10) -->
          <path class="branch" d="M 930,378 L 930,450" />
          <path class="branch" d="M 1302,378 L 1302,450" />
        </g>

        <!-- 路径条件标注 -->
        <g id="edge-labels">
          <text class="edge-tag" x="520" y="96">单模型受限</text>
          <text class="edge-tag" x="968" y="96">已有异质成熟模型</text>

          <text class="edge-tag" x="240" y="250">高方差</text>
          <text class="edge-tag" x="495" y="250">高偏差</text>

          <text class="edge-tag" x="440" y="408">毫秒级白盒</text>
          <text class="edge-tag" x="680" y="408">算力充裕求极值</text>

          <text class="edge-tag" x="900" y="316">离线竞赛冲榜</text>
          <text class="edge-tag" x="1330" y="316">在线服务高吞吐</text>
        </g>

        <!-- 节点名称 -->
        <g class="node-group" transform="translate(744, 36)">
          <text class="cond-title">基模型现状</text>
        </g>
        <g class="node-group" transform="translate(372, 178)">
          <text class="cond-title">主要误差来源</text>
        </g>
        <g class="node-group" transform="translate(1116, 178)">
          <text class="cond-title">系统工程约束</text>
        </g>
        <g class="node-group" transform="translate(186, 330)">
          <text class="cond-title">数据扰动敏感</text>
        </g>
        <g class="node-group" transform="translate(558, 330)">
          <text class="cond-title">推理预算要求</text>
        </g>
        <g class="node-group" transform="translate(930, 366)">
          <text class="cond-title">允许多折重算</text>
        </g>
        <g class="node-group" transform="translate(1302, 366)">
          <text class="cond-title">需轻量零维护</text>
        </g>

        <!-- 5 个集成方案叶子卡片：文字极简提炼 -->
        <!-- 1. 随机森林 -->
        <g class="leaf-group" data-target="rf" transform="translate(66, 450)">
          <rect class="leaf-box" width="240" height="230" rx="4" />
          <text class="leaf-title" x="24" y="42">随机森林</text>
          <text class="leaf-tag" x="24" y="70">Bagging 体系</text>
          <text class="leaf-val" x="24" y="112">机制：并行独立重采样</text>
          <text class="leaf-val" x="24" y="142">基模：深决策树</text>
          <text class="leaf-val" x="24" y="172">作用：平滑扰动、降方差</text>
          <text class="leaf-target" x="24" y="206">选它：特征多、易过拟合</text>
        </g>

        <!-- 2. 加权线性/规则 -->
        <g class="leaf-group" data-target="linear" transform="translate(345, 450)">
          <rect class="leaf-box" width="240" height="230" rx="4" />
          <text class="leaf-title" x="24" y="42">加权线性 / 规则</text>
          <text class="leaf-tag" x="24" y="70">极简低复杂度</text>
          <text class="leaf-val" x="24" y="112">机制：投票或正则线性</text>
          <text class="leaf-val" x="24" y="142">基模：浅规则 / 线性模型</text>
          <text class="leaf-val" x="24" y="172">作用：亚毫秒级、强解释性</text>
          <text class="leaf-target" x="24" y="206">选它：硬合规、实时网关</text>
        </g>

        <!-- 3. GBDT / XGBoost -->
        <g class="leaf-group" data-target="gbdt" transform="translate(624, 450)">
          <rect class="leaf-box" width="240" height="230" rx="4" />
          <text class="leaf-title" x="24" y="42">梯度提升树</text>
          <text class="leaf-tag" x="24" y="70">Boosting 体系</text>
          <text class="leaf-val" x="24" y="112">机制：串行残差纠错</text>
          <text class="leaf-val" x="24" y="142">基模：浅层弱树 (Depth 3-6)</text>
          <text class="leaf-val" x="24" y="172">作用：压榨拟合天花板</text>
          <text class="leaf-target" x="24" y="206">选它：表格结构化数据</text>
        </g>

        <!-- 4. Stacking -->
        <g class="leaf-group" data-target="stacking" transform="translate(903, 450)">
          <rect class="leaf-box" width="240" height="230" rx="4" />
          <text class="leaf-title" x="24" y="42">分层 Stacking</text>
          <text class="leaf-tag" x="24" y="70">异质集成体系</text>
          <text class="leaf-val" x="24" y="112">机制：元学习器拟合预测</text>
          <text class="leaf-val" x="24" y="142">基模：树 + 神经网络 + 线性</text>
          <text class="leaf-val" x="24" y="172">作用：融汇不同假设空间</text>
          <text class="leaf-target" x="24" y="206">选它：竞赛冲榜、离线精筛</text>
        </g>

        <!-- 5. 简单加权 / 排名融合 -->
        <g class="leaf-group" data-target="blending" transform="translate(1182, 450)">
          <rect class="leaf-box" width="240" height="230" rx="4" />
          <text class="leaf-title" x="24" y="42">加权与排名融合</text>
          <text class="leaf-tag" x="24" y="70">轻量异质集成</text>
          <text class="leaf-val" x="24" y="112">机制：验证集固定权重</text>
          <text class="leaf-val" x="24" y="142">基模：2-3 个成熟强模型</text>
          <text class="leaf-val" x="24" y="172">作用：稳健提升、零工程负担</text>
          <text class="leaf-target" x="24" y="206">选它：线上推荐搜索服务</text>
        </g>
      </svg>
    </main>

    <aside class="notes" hidden>
      在实际工程中选择集成策略，核心依据是基模型现状与系统约束。
      若单模型处于未剪枝的高方差状态，采用随机森林等 Bagging 方法能最大程度平滑扰动；
      若单模型欠拟合，应通过 Boosting 串行纠错，梯度提升树是结构化数据的首选；
      若系统有极端延迟约束，需放弃深度集成，退回加权线性；
      对于异质强模型融合，离线冲榜优先 Stacking，而高吞吐在线场景首选简单加权或排名融合。
    </aside>
  </div>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 30, total: 32 });

    const leafGroups = document.querySelectorAll('.leaf-group');
    const branches = document.querySelectorAll('.branch');
    const edgeTags = document.querySelectorAll('.edge-tag');

    const routes = {
      'rf': { branches: [0, 2, 4], tags: [0, 2] },
      'linear': { branches: [0, 3, 5], tags: [0, 3, 4] },
      'gbdt': { branches: [0, 3, 6], tags: [0, 3, 5] },
      'stacking': { branches: [1, 7, 9], tags: [1, 6] },
      'blending': { branches: [1, 8, 10], tags: [1, 7] }
    };

    function highlightRoute(key) {
      branches.forEach(b => b.classList.remove('highlight'));
      edgeTags.forEach(t => t.classList.remove('highlight'));
      leafGroups.forEach(g => g.classList.remove('active'));

      if (!key || !routes[key]) return;

      const r = routes[key];
      r.branches.forEach(idx => {
        if (branches[idx]) branches[idx].classList.add('highlight');
      });
      r.tags.forEach(idx => {
        if (edgeTags[idx]) edgeTags[idx].classList.add('highlight');
      });
      const activeLeaf = document.querySelector(`.leaf-group[data-target="${key}"]`);
      if (activeLeaf) activeLeaf.classList.add('active');
    }

    leafGroups.forEach(card => {
      card.addEventListener('mouseenter', () => highlightRoute(card.dataset.target));
      card.addEventListener('mouseleave', () => highlightRoute(null));
      card.addEventListener('click', () => {
        const isCurrent = card.classList.contains('active');
        highlightRoute(isCurrent ? null : card.dataset.target);
      });
    });
  </script>
</body>
</html>
