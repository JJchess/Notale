<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      position: relative;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: var(--pad-y) var(--pad-x);
    }

    #field {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .cover-header {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 12px;
    }

    .chapter-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: var(--fs-label);
      font-family: var(--font-num);
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .chapter-tag .tag-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--aggregate);
    }

    .chapter-core-metric {
      display: flex;
      gap: 28px;
      background: rgba(247, 250, 252, 0.82);
      backdrop-filter: blur(8px);
      border: var(--line) solid var(--surface-strong);
      border-radius: var(--radius);
      padding: 14px 24px;
      box-shadow: 0 4px 16px rgba(20, 37, 51, 0.05);
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .metric-lbl {
      font-size: var(--fs-tick);
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .metric-val {
      font-family: var(--font-num);
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
    }

    .metric-val.agg {
      color: var(--aggregate);
    }

    .cover-body {
      position: relative;
      z-index: 5;
      margin-top: auto;
      margin-bottom: 28px;
      max-width: 680px;
      pointer-events: none;
    }

    .title-h1 {
      margin: 0;
      font-size: var(--fs-h1);
      line-height: 1.2;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .title-h1 .boost-keyword {
      color: var(--aggregate);
      display: inline-block;
      position: relative;
    }

    .title-sub {
      margin: 20px 0 0 0;
      font-size: var(--fs-h2);
      line-height: 1.45;
      color: var(--muted);
      max-width: 720px;
      font-weight: 500;
    }

    .cover-footer {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: var(--line) solid rgba(83, 103, 119, 0.2);
      padding-top: 18px;
      margin-bottom: 8px;
    }

    .serial-stages {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stage-pill {
      background: var(--surface);
      border: var(--line) solid var(--surface-strong);
      border-radius: var(--radius);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: var(--fs-sec);
      cursor: pointer;
      user-select: none;
      transition: all var(--dur) var(--ease);
      box-shadow: 0 2px 6px rgba(20, 37, 51, 0.04);
    }

    .stage-pill:hover {
      border-color: var(--learner);
      transform: translateY(-1px);
    }

    .stage-pill[aria-pressed="true"] {
      background: var(--surface);
      border-color: var(--aggregate);
      box-shadow: 0 0 0 1px var(--aggregate);
    }

    .stage-pill[aria-pressed="true"] .stage-num {
      background: var(--aggregate);
      color: #ffffff;
    }

    .stage-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--surface-strong);
      color: var(--text);
      font-family: var(--font-num);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
    }

    .stage-desc {
      font-size: var(--fs-label);
      color: var(--text);
      font-weight: 500;
    }

    .stage-weight {
      font-family: var(--font-num);
      font-size: var(--fs-tick);
      color: var(--muted);
    }

    .serial-arrow {
      color: var(--muted);
      font-size: var(--fs-sec);
      font-family: var(--font-num);
    }

    .legend-box {
      display: flex;
      align-items: center;
      gap: 22px;
      font-size: var(--fs-label);
      color: var(--muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-glyph {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
    }

    .glyph-learner {
      background: var(--learner);
      opacity: 0.85;
    }

    .glyph-error {
      background: var(--aggregate);
      box-shadow: 0 0 0 3px rgba(182, 59, 36, 0.22);
    }

    .glyph-aggregate {
      border: 2px dashed var(--aggregate);
      width: 18px;
      height: 0;
      border-radius: 0;
    }
  </style>
</head>
<body data-page="14" data-total="27">
  <div id="stage">
    <canvas id="field" class="cv-fill" aria-hidden="true"></canvas>

    <header class="cover-header">
      <div class="chapter-tag">
        <span class="tag-dot"></span>
        <span>第三部分 · Boosting 范式</span>
      </div>
      <div class="chapter-core-metric">
        <div class="metric-item">
          <span class="metric-lbl">组织范式</span>
          <span class="metric-val">串行迭代 (Serial)</span>
        </div>
        <div class="metric-item">
          <span class="metric-lbl">基分类器要求</span>
          <span class="metric-val">弱学习器 (Weak)</span>
        </div>
        <div class="metric-item">
          <span class="metric-lbl">目标误差导向</span>
          <span class="metric-val agg">残差 / 难分权重</span>
        </div>
      </div>
    </header>

    <div class="cover-body">
      <h1 class="title-h1">
        <span class="boost-keyword">Boosting</span>：让后续模型修正前序不足
      </h1>
      <p class="title-sub">
        弱学习器按轮次串行加入：前序模型错分的样本获得更高权重，后续模型聚焦未解残差，加权组合实现强集成。
      </p>
    </div>

    <footer class="cover-footer">
      <div class="serial-stages" role="group" aria-label="演进轮次">
        <button class="stage-pill" id="btn-stage-1" aria-pressed="false" data-stage="1">
          <span class="stage-num">1</span>
          <span class="stage-desc">基分类器 h₁ 初判</span>
          <span class="stage-weight">均匀权重</span>
        </button>
        <span class="serial-arrow">+</span>
        <button class="stage-pill" id="btn-stage-2" aria-pressed="false" data-stage="2">
          <span class="stage-num">2</span>
          <span class="stage-desc">h₂ 聚焦错分点</span>
          <span class="stage-weight">加权关注</span>
        </button>
        <span class="serial-arrow">+</span>
        <button class="stage-pill" id="btn-stage-3" aria-pressed="false" data-stage="3">
          <span class="stage-num">3</span>
          <span class="stage-desc">h₃ 修正剩余盲区</span>
          <span class="stage-weight">高阶拟合</span>
        </button>
        <span class="serial-arrow">=</span>
        <button class="stage-pill" id="btn-stage-all" aria-pressed="true" data-stage="all">
          <span class="stage-num">H</span>
          <span class="stage-desc">强集成组合 H(x)</span>
          <span class="stage-weight">加权投票</span>
        </button>
      </div>

      <div class="legend-box">
        <div class="legend-item">
          <span class="legend-glyph glyph-learner"></span>
          <span>弱分类器边界</span>
        </div>
        <div class="legend-item">
          <span class="legend-glyph glyph-error"></span>
          <span>加权放大样本</span>
        </div>
        <div class="legend-item">
          <span class="legend-glyph glyph-aggregate"></span>
          <span>集成强边界</span>
        </div>
      </div>
    </footer>
  </div>

  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      const WIDTH = 1600;
      const HEIGHT = 900;
      const SEED = "boosting-cover-seed-2026";
      const canvas = document.querySelector("#field");
      let ctx;
      let activeStage = "all";
      let animTime = 0;
      let stopLoop = () => {};

      Deck.init({ index: 14, total: 27, keys: false });

      // Title exclusion zone to protect typography
      const TITLE_ZONE = {
        x1: 40,
        y1: 420,
        x2: 900,
        y2: 780
      };

      function inTitleZone(x, y, margin = 20) {
        return (
          x >= TITLE_ZONE.x1 - margin &&
          x <= TITLE_ZONE.x2 + margin &&
          y >= TITLE_ZONE.y1 - margin &&
          y <= TITLE_ZONE.y2 + margin
        );
      }

      // Generate deterministic 2D training samples across the space
      function buildDataset() {
        const rng = new Math.seedrandom(SEED);
        const points = [];
        const count = 130;

        // Class 0: concentrated upper right & right
        // Class 1: interlocked crescent / center-lower
        for (let i = 0; i < count; i++) {
          const x = 740 + (rng() - 0.5) * 820;
          const y = 140 + rng() * 640;

          // Safe zone: never place sample dots in the title text quadrant
          if (x < 720 && y > 380) continue;

          // Non-linear boundary: y = 460 + 130 * sin((x - 850) * 0.011)
          const targetY = 460 + 140 * Math.sin((x - 850) * 0.011) + (x - 1150) * 0.16;
          const label = y < targetY ? 1 : -1;

          // Base weight
          const dist = Math.abs(y - targetY);
          const isHard = dist < 68;

          // Weights evolve through stages
          const w1 = 1.0;
          const w2 = isHard ? 2.6 : 0.6;
          const w3 = (isHard && x > 1150) ? 4.2 : (isHard ? 2.0 : 0.4);

          points.push({
            x,
            y,
            label,
            isHard,
            w1,
            w2,
            w3,
            phase: rng() * Math.PI * 2
          });
        }
        return points;
      }

      // Sequential weak learners:
      // h1: horizontal split at y = 460
      // h2: vertical split at x = 1200
      // h3: diagonal split
      const dataset = buildDataset();

      function drawWeakBoundary(context, stageNum, alpha, time) {
        const colLearner = Deck.rgba("learner", alpha);
        context.save();
        context.strokeStyle = colLearner;
        context.lineWidth = 2.4;
        context.setLineDash([8, 8]);
        context.lineDashOffset = -time * 0.02;

        if (stageNum === 1) {
          // Horizontal partition with gentle sine drift
          context.beginPath();
          context.moveTo(760, 470);
          for (let x = 760; x <= 1560; x += 20) {
            const y = 470 + Math.sin(x * 0.008 + time * 0.001) * 6;
            context.lineTo(x, y);
          }
          context.stroke();

          // Region label
          context.fillStyle = Deck.rgba("learner", alpha * 0.8);
          context.font = "14px " + Deck.token("--font-num");
          context.fillText("h₁(x) 简单横切", 780, 455);
        } else if (stageNum === 2) {
          // Vertical partition focused on previous error cluster
          context.beginPath();
          context.moveTo(1190, 120);
          for (let y = 120; y <= 760; y += 20) {
            const x = 1190 + Math.cos(y * 0.008 + time * 0.0012) * 6;
            context.lineTo(x, y);
          }
          context.stroke();

          context.fillStyle = Deck.rgba("learner", alpha * 0.8);
          context.font = "14px " + Deck.token("--font-num");
          context.fillText("h₂(x) 纵切聚焦", 1205, 160);
        } else if (stageNum === 3) {
          // Diagonal partition addressing remaining tricky region
          context.beginPath();
          context.moveTo(820, 720);
          for (let p = 0; p <= 740; p += 25) {
            const x = 820 + p;
            const y = 720 - p * 0.72 + Math.sin(p * 0.015 + time * 0.0015) * 8;
            context.lineTo(x, y);
          }
          context.stroke();

          context.fillStyle = Deck.rgba("learner", alpha * 0.8);
          context.font = "14px " + Deck.token("--font-num");
          context.fillText("h₃(x) 斜向补正", 1360, 410);
        }
        context.restore();
      }

      function drawAggregateBoundary(context, alpha, time) {
        // H(x) = sign(a1*h1 + a2*h2 + a3*h3) resulting in smooth non-linear curve
        context.save();
        context.strokeStyle = Deck.rgba("aggregate", alpha);
        context.lineWidth = 3.5;
        context.setLineDash([]);
        context.shadowColor = "rgba(182, 59, 36, 0.28)";
        context.shadowBlur = 12;

        context.beginPath();
        let started = false;
        for (let x = 760; x <= 1560; x += 12) {
          const wave = Math.sin((x - 850) * 0.011 + time * 0.0008) * 140;
          const linear = (x - 1150) * 0.16;
          const y = 460 + wave + linear;

          if (!started) {
            context.moveTo(x, y);
            started = true;
          } else {
            context.lineTo(x, y);
          }
        }
        context.stroke();

        // Enclosing confidence ribbons (margin)
        context.shadowBlur = 0;
        context.strokeStyle = Deck.rgba("aggregate", alpha * 0.25);
        context.lineWidth = 1.2;
        context.beginPath();
        for (let x = 760; x <= 1560; x += 15) {
          const wave = Math.sin((x - 850) * 0.011 + time * 0.0008) * 140;
          const linear = (x - 1150) * 0.16;
          const y = 460 + wave + linear + 36;
          if (x === 760) context.moveTo(x, y);
          else context.lineTo(x, y);
        }
        context.stroke();

        context.beginPath();
        for (let x = 760; x <= 1560; x += 15) {
          const wave = Math.sin((x - 850) * 0.011 + time * 0.0008) * 140;
          const linear = (x - 1150) * 0.16;
          const y = 460 + wave + linear - 36;
          if (x === 760) context.moveTo(x, y);
          else context.lineTo(x, y);
        }
        context.stroke();

        context.fillStyle = Deck.rgba("aggregate", alpha);
        context.font = "bold 15px " + Deck.token("--font-num");
        context.fillText("H(x) = sign( ∑ αₘ hₘ(x) )", 820, 240);
        context.restore();
      }

      function drawVectorCorrectionStream(context, time) {
        // Serial flow field: directional field vectors streaming from left to right
        context.save();
        const colMuted = Deck.rgb("muted");

        const cols = 7;
        const rows = 5;
        const startX = 890;
        const startY = 160;
        const stepX = 95;
        const stepY = 120;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const bx = startX + c * stepX;
            const by = startY + r * stepY;

            // Stream target: toward closest aggregate boundary point
            const wave = Math.sin((bx - 900) * 0.011) * 140;
            const linear = (bx - 1200) * 0.18;
            const boundaryY = 460 + wave + linear;
            const diffY = boundaryY - by;

            const angle = Math.atan2(diffY * 0.35, 80) + Math.sin(time * 0.0015 + c * 0.4) * 0.08;
            const length = 18;

            const ex = bx + Math.cos(angle) * length;
            const ey = by + Math.sin(angle) * length;

            context.strokeStyle = `rgba(${colMuted.join(",")}, 0.15)`;
            context.lineWidth = 1.0;
            context.beginPath();
            context.moveTo(bx, by);
            context.lineTo(ex, ey);
            context.stroke();

            // Arrow head
            const arrowAngle1 = angle + Math.PI * 0.82;
            const arrowAngle2 = angle - Math.PI * 0.82;
            context.beginPath();
            context.moveTo(ex + Math.cos(arrowAngle1) * 4, ey + Math.sin(arrowAngle1) * 4);
            context.lineTo(ex, ey);
            context.lineTo(ex + Math.cos(arrowAngle2) * 4, ey + Math.sin(arrowAngle2) * 4);
            context.stroke();
          }
        }
        context.restore();
      }

      function render(time) {
        if (!ctx) return;
        animTime = time;

        ctx.clearRect(0, 0, WIDTH, HEIGHT);

        // Ambient subtle grid dots in data quadrant
        ctx.fillStyle = Deck.rgba("surface-strong", 0.6);
        for (let gx = 740; gx < 1560; gx += 48) {
          for (let gy = 120; gy < 780; gy += 48) {
            ctx.fillRect(gx, gy, 1.5, 1.5);
          }
        }

        // Serial flow guide vectors
        drawVectorCorrectionStream(ctx, time);

        // Weak learners & Aggregate boundary depending on active stage
        if (activeStage === "1") {
          drawWeakBoundary(ctx, 1, 0.95, time);
        } else if (activeStage === "2") {
          drawWeakBoundary(ctx, 1, 0.35, time);
          drawWeakBoundary(ctx, 2, 0.95, time);
        } else if (activeStage === "3") {
          drawWeakBoundary(ctx, 1, 0.25, time);
          drawWeakBoundary(ctx, 2, 0.35, time);
          drawWeakBoundary(ctx, 3, 0.95, time);
        } else {
          // "all"
          drawWeakBoundary(ctx, 1, 0.32, time);
          drawWeakBoundary(ctx, 2, 0.32, time);
          drawWeakBoundary(ctx, 3, 0.32, time);
          drawAggregateBoundary(ctx, 0.96, time);
        }

        // Draw points with active stage weighting
        dataset.forEach(pt => {
          let w = 1.0;
          if (activeStage === "1") w = pt.w1;
          else if (activeStage === "2") w = pt.w2;
          else if (activeStage === "3") w = pt.w3;
          else {
            w = pt.isHard ? 2.4 : 1.0;
          }

          const radius = Math.min(14, 3.8 + w * 2.1);
          const isPos = pt.label === 1;

          ctx.save();
          if (pt.isHard && (activeStage === "2" || activeStage === "3" || activeStage === "all")) {
            // Pulse effect on hard/misclassified points
            const pulse = Math.sin(time * 0.003 + pt.phase) * 3;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, radius + 4 + pulse, 0, Math.PI * 2);
            ctx.fillStyle = Deck.rgba("aggregate", 0.12);
            ctx.fill();
          }

          ctx.beginPath();
          ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);

          if (isPos) {
            ctx.fillStyle = Deck.rgba("learner", pt.isHard ? 0.9 : 0.65);
            ctx.strokeStyle = Deck.rgba("learner", 0.9);
          } else {
            ctx.fillStyle = Deck.rgba("aggregate", pt.isHard ? 0.92 : 0.65);
            ctx.strokeStyle = Deck.rgba("aggregate", 0.9);
          }
          ctx.lineWidth = 1.6;
          ctx.fill();
          ctx.stroke();

          // Symbol inside points
          if (radius > 6) {
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            if (isPos) {
              // Plus
              ctx.moveTo(pt.x - 3, pt.y);
              ctx.lineTo(pt.x + 3, pt.y);
              ctx.moveTo(pt.x, pt.y - 3);
              ctx.lineTo(pt.x, pt.y + 3);
            } else {
              // Minus
              ctx.moveTo(pt.x - 3, pt.y);
              ctx.lineTo(pt.x + 3, pt.y);
            }
            ctx.stroke();
          }

          ctx.restore();
        });
      }

      function setupInteraction() {
        const buttons = document.querySelectorAll(".stage-pill");
        buttons.forEach(btn => {
          btn.addEventListener("click", () => {
            buttons.forEach(b => b.setAttribute("aria-pressed", "false"));
            btn.setAttribute("aria-pressed", "true");
            activeStage = btn.dataset.stage;
          });
        });
      }

      function init() {
        ctx = Deck.fit(canvas);
        setupInteraction();

        stopLoop = Deck.loop(t => {
          render(t);
        }, { still: 1200 });

        Deck.onResize(() => {
          ctx = Deck.fit(canvas);
          render(animTime);
        });
      }

      init();
    })();
  </script>
</body>
</html>
