<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>集成学习——机器学习概论第八讲</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #E8EEF2;
      --text: #142533;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
    }

    #stage {
      position: relative;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      padding: var(--pad-y) var(--pad-x);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
    }

    #field {
      z-index: 1;
      pointer-events: none;
    }

    /* 标题区域：严守左侧独立文本区，避开右侧主生成流 */
    .title-block {
      position: relative;
      z-index: 5;
      max-width: 680px;
      margin-top: 48px;
    }

    .course-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-sec);
      font-weight: 600;
      color: var(--learner);
      letter-spacing: 0.04em;
      margin-bottom: 16px;
    }

    .course-tag .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--aggregate);
    }

    h1.main-title {
      font-size: var(--fs-h1);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text);
      margin: 0 0 20px 0;
    }

    .subtitle {
      font-size: var(--fs-h2);
      line-height: 1.45;
      color: var(--learner);
      font-weight: 600;
      margin: 0 0 16px 0;
    }

    .core-statement {
      font-size: var(--fs-lead);
      line-height: 1.6;
      color: var(--muted);
      max-width: 580px;
      margin: 0;
    }

    /* 底部结构图解标签：冷调实验记录风格 */
    .bottom-bar {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .concept-pillars {
      display: flex;
      gap: 16px;
    }

    .pillar-card {
      background: var(--surface);
      border: 1px solid var(--surface-strong);
      border-radius: var(--radius);
      padding: 16px 20px;
      min-width: 240px;
      box-shadow: 0 4px 12px rgba(20, 37, 51, 0.04);
    }

    .pillar-card .tag-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .pillar-card .category {
      font-size: var(--fs-tick);
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.05em;
    }

    .pillar-card .symbol {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }

    .pillar-card.bagging .symbol { background: var(--learner); }
    .pillar-card.boosting .symbol { background: var(--focus); }
    .pillar-card.stacking .symbol { background: var(--aggregate); }

    .pillar-card .name {
      font-size: var(--fs-body);
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .pillar-card .desc {
      font-size: var(--fs-sec);
      color: var(--text);
      opacity: 0.88;
      line-height: 1.4;
      margin: 0;
    }

    .canvas-legend {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(247, 250, 252, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--surface-strong);
      border-radius: var(--radius);
      padding: 14px 20px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: var(--fs-label);
      color: var(--text);
    }

    .legend-swatch {
      width: 22px;
      height: 3px;
      border-radius: 2px;
    }

    .swatch-learner {
      background: var(--learner);
      opacity: 0.65;
    }

    .swatch-consensus {
      background: var(--aggregate);
      height: 4px;
    }
  </style>
</head>
<body data-page="01" data-total="27">
  <div id="stage">
    <canvas id="field" class="cv-fill no-pan" aria-hidden="true"></canvas>

    <div class="title-block">
      <div class="course-tag">
        <span class="dot"></span>
        <span>机器学习概论 · 第八讲</span>
      </div>
      <h1 class="main-title">集成学习</h1>
      <p class="subtitle">Ensemble Learning：群体智慧与误差结构重塑</p>
      <p class="core-statement">
        将多个弱学习器以严密的数学规则组合为强学习器。集成不是简单的数量叠加，而是通过多样性构造、方差消减与偏差修正，突破单模型能力上界的系统性工程。
      </p>
    </div>

    <div class="bottom-bar">
      <div class="concept-pillars">
        <div class="pillar-card bagging">
          <div class="tag-row">
            <span class="category">PARALLEL</span>
            <span class="symbol"></span>
          </div>
          <div class="name">Bagging / 随机森林</div>
          <p class="desc">样本与特征扰动 · 并行降方差</p>
        </div>
        <div class="pillar-card boosting">
          <div class="tag-row">
            <span class="category">SEQUENTIAL</span>
            <span class="symbol"></span>
          </div>
          <div class="name">Boosting 机制</div>
          <p class="desc">前序残差接力 · 串行减偏差</p>
        </div>
        <div class="pillar-card stacking">
          <div class="tag-row">
            <span class="category">HIERARCHICAL</span>
            <span class="symbol"></span>
          </div>
          <div class="name">Stacking 堆叠</div>
          <p class="desc">次学习器仲裁 · 异构多层融合</p>
        </div>
      </div>

      <div class="canvas-legend">
        <div class="legend-row">
          <span class="legend-swatch swatch-learner"></span>
          <span>基学习器预测轨线（差异性个体）</span>
        </div>
        <div class="legend-row">
          <span class="legend-swatch swatch-consensus"></span>
          <span>集成强决策中枢（共识合流）</span>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      Deck.init({ index: 1, total: 27 });

      const W = 1600;
      const H = 900;
      const canvas = document.getElementById("field");
      let ctx = Deck.fit(canvas);

      // 概念规则驱动的生成系统：
      // 模拟多条不同特征/权重基学习器（基线有方差与扰动），
      // 穿过样本空间并在右侧最终收敛/加权合流为坚实、低方差的集成红线（Consensus）。
      // 标题安全区（左上方）施加斥力，确保文本绝对清晰可读。

      const SEED = "ensemble-learning-core-v1";
      const NUM_LEARNERS = 48;
      const TITLE_EXCLUSION = { left: 40, top: 40, right: 730, bottom: 480 };

      let learners = [];
      let stopLoop = null;

      function createSystem() {
        const rng = new Math.seedrandom(SEED);
        learners = [];

        // 目标聚焦点（集成共识汇合点）
        const targetX = 1420;
        const targetY = 460;

        for (let i = 0; i < NUM_LEARNERS; i++) {
          // 左侧分散发射点：个体学习器的不同初始状态
          const startX = 640 + rng() * 220;
          const startY = 80 + rng() * 740;

          // 关键路径锚点：带有不同方向的方差偏置
          const cp1X = 900 + rng() * 120;
          const cp1Y = startY + (rng() - 0.5) * 220;

          const cp2X = 1180 + rng() * 100;
          const cp2Y = targetY + (startY - targetY) * 0.4 + (rng() - 0.5) * 90;

          const endX = targetX + (rng() - 0.5) * 30;
          const endY = targetY + (rng() - 0.5) * 30;

          // 粒子沿轨道流动参数
          const speed = 0.00035 + rng() * 0.0003;
          const phase = rng();
          const baseAlpha = 0.15 + rng() * 0.25;
          const lineWidth = 1.0 + rng() * 1.2;

          learners.push({
            p0: { x: startX, y: startY },
            p1: { x: cp1X, y: cp1Y },
            p2: { x: cp2X, y: cp2Y },
            p3: { x: endX, y: endY },
            speed,
            phase,
            baseAlpha,
            lineWidth
          });
        }
      }

      function bezierPt(p0, p1, p2, p3, t) {
        const mt = 1 - t;
        const mt2 = mt * mt;
        const mt3 = mt2 * mt;
        const t2 = t * t;
        const t3 = t2 * t;

        return {
          x: mt3 * p0.x + 3 * mt2 * t * p1.x + 3 * mt * t2 * p2.x + t3 * p3.x,
          y: mt3 * p0.y + 3 * mt2 * t * p1.y + 3 * mt * t2 * p2.y + t3 * p3.y
        };
      }

      function drawScene(time) {
        if (!ctx) return;
        ctx.clearRect(0, 0, W, H);

        const learnerRgb = Deck.rgb("learner") || [39, 93, 145];
        const aggregateRgb = Deck.rgb("aggregate") || [182, 59, 36];
        const focusRgb = Deck.rgb("focus") || [0, 107, 114];

        // 1. 绘制背景精细几何标尺网格（体现冷调实验记录属性）
        ctx.save();
        ctx.strokeStyle = "rgba(215, 225, 232, 0.45)";
        ctx.lineWidth = 1;
        const step = 80;
        for (let x = 600; x < W; x += step) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }
        for (let y = 0; y < H; y += step) {
          ctx.beginPath();
          ctx.moveTo(600, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }
        ctx.restore();

        // 2. 绘制各个基学习器的决策流向曲线
        for (let i = 0; i < learners.length; i++) {
          const l = learners[i];
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(l.p0.x, l.p0.y);
          ctx.bezierCurveTo(l.p1.x, l.p1.y, l.p2.x, l.p2.y, l.p3.x, l.p3.y);
          ctx.strokeStyle = `rgba(${learnerRgb[0]}, ${learnerRgb[1]}, ${learnerRgb[2]}, ${l.baseAlpha})`;
          ctx.lineWidth = l.lineWidth;
          ctx.stroke();

          // 在曲线上流动的信息包/预测粒子
          const t = (l.phase + time * l.speed) % 1.0;
          const pos = bezierPt(l.p0, l.p1, l.p2, l.p3, t);

          ctx.fillStyle = `rgba(${learnerRgb[0]}, ${learnerRgb[1]}, ${learnerRgb[2]}, ${Math.min(1, l.baseAlpha * 2.8)})`;
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, 2.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 3. 绘制最终的集成收敛中枢：Consensus 决策主干
        // 汇集了所有模型的预测加权流
        ctx.save();
        // 发光与主干线
        ctx.beginPath();
        ctx.moveTo(1120, 460);
        ctx.bezierCurveTo(1260, 460, 1340, 460, 1450, 460);
        ctx.strokeStyle = `rgba(${aggregateRgb[0]}, ${aggregateRgb[1]}, ${aggregateRgb[2]}, 0.2)`;
        ctx.lineWidth = 14;
        ctx.lineCap = "round";
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(1080, 460);
        ctx.bezierCurveTo(1240, 460, 1330, 460, 1460, 460);
        ctx.strokeStyle = `rgba(${aggregateRgb[0]}, ${aggregateRgb[1]}, ${aggregateRgb[2]}, 0.95)`;
        ctx.lineWidth = 4.5;
        ctx.lineCap = "round";
        ctx.stroke();

        // 最终汇聚中心点外环脉冲
        const pulse = 1 + 0.15 * Math.sin(time * 0.003);
        ctx.beginPath();
        ctx.arc(1460, 460, 18 * pulse, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(${aggregateRgb[0]}, ${aggregateRgb[1]}, ${aggregateRgb[2]}, 0.35)`;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(1460, 460, 7, 0, Math.PI * 2);
        ctx.fillStyle = `rgb(${aggregateRgb[0]}, ${aggregateRgb[1]}, ${aggregateRgb[2]})`;
        ctx.fill();

        // 标签：集成共识 F(x)
        ctx.font = "700 16px var(--font-sans)";
        ctx.fillStyle = `rgb(${aggregateRgb[0]}, ${aggregateRgb[1]}, ${aggregateRgb[2]})`;
        ctx.fillText("F(x) 集成决策共识", 1370, 420);

        ctx.restore();
      }

      function init() {
        createSystem();
        Deck.onResize(() => {
          ctx = Deck.fit(canvas);
          drawScene(2400);
        });

        stopLoop = Deck.loop((time) => {
          drawScene(time);
        }, { still: 2400 });
      }

      init();
    })();
  </script>
</body>
</html>
