<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F6F8;
      --text: #122634;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: radial-gradient(circle at 72% 48%, #FFFFFF 0%, #F2F6F8 70%);
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 顶部标题区：保证绝对静止与极高层级、不与几何视觉冲突 */
    .title-area {
      position: relative;
      z-index: 10;
      max-width: 580px;
      margin-top: 36px;
    }

    .chapter-tag {
      font-size: var(--fs-label);
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chapter-tag::before {
      content: "";
      display: inline-block;
      width: 28px;
      height: 3px;
      background: var(--aggregate);
      border-radius: 2px;
    }

    .main-title {
      font-size: 64px;
      line-height: 1.12;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.03em;
      margin: 0 0 22px 0;
    }

    .main-title span.accent {
      color: var(--aggregate);
    }

    .subtitle {
      font-size: 20px;
      line-height: 1.55;
      color: var(--muted);
      margin: 0 0 28px 0;
      max-width: 540px;
    }

    .thesis-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: rgba(195, 75, 34, 0.08);
      border: 1px solid rgba(195, 75, 34, 0.25);
      border-radius: 6px;
      font-size: 15px;
      color: var(--text);
      font-weight: 600;
    }

    /* 底部三条前瞻线索（静止高对比排版） */
    .roadmap {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(3, 440px);
      gap: 36px;
      margin-bottom: 24px;
    }

    .road-card {
      border-top: 2px solid var(--surface-strong);
      padding-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .road-num {
      font-family: var(--font-num);
      font-size: var(--fs-tick);
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .road-head {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .road-desc {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* 视觉主体：SVG 架构图（两层结构：多基模型层 -> 元特征汇聚流 -> 元学习器 -> 强判断） */
    .arch-scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .flow-line {
      stroke-dasharray: 8 6;
      animation: flow-dash 18s linear infinite;
    }

    .flow-line-fast {
      stroke-dasharray: 6 4;
      animation: flow-dash 12s linear infinite;
    }

    @keyframes flow-dash {
      to {
        stroke-dashoffset: -280;
      }
    }

    /* 模型外壳与文本标注 */
    .base-node {
      transition: transform var(--duration) var(--ease);
    }

    .model-badge {
      font-family: var(--font-num);
      font-size: 13px;
      font-weight: 700;
      fill: #FFFFFF;
    }

    .node-title {
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 700;
      fill: var(--text);
    }

    .node-sub {
      font-family: var(--font-sans);
      font-size: 13px;
      fill: var(--muted);
    }

    .meta-node-title {
      font-family: var(--font-sans);
      font-size: 20px;
      font-weight: 700;
      fill: var(--text);
    }

    .meta-node-sub {
      font-family: var(--font-sans);
      font-size: 13px;
      fill: var(--muted);
    }

    .meta-formula {
      font-family: var(--font-num);
      font-size: 15px;
      fill: var(--aggregate);
      font-weight: 700;
    }

    .layer-label {
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      fill: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .flow-line, .flow-line-fast {
        animation: none !important;
      }
    }
  </style>
</head>
<body data-page="20" data-total="27">
  <main id="stage">
    <!-- 主标题与导语 -->
    <header class="title-area">
      <div class="chapter-tag">第 4 章 · 堆叠集成</div>
      <h1 class="main-title">Stacking<br><span class="accent">学习</span>如何组合模型</h1>
      <p class="subtitle">
        不靠多数表决，也不靠固定加权。Stacking 将多个异构基学习器的预测作为新特征，由第二层元学习器自主学习出最优组合规则。
      </p>
      <div class="thesis-pill">
        <span>核心转向：把“如何组合基模型”本身变成一个监督学习任务</span>
      </div>
    </header>

    <!-- 视觉构图：两层堆叠架构几何系统 -->
    <svg class="arch-scene" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 柔和阴影 -->
        <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
          <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#122634" flood-opacity="0.08" />
        </filter>
        <filter id="meta-shadow" x="-12%" y="-12%" width="135%" height="135%">
          <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#C34B22" flood-opacity="0.16" />
        </filter>
        
        <!-- 汇聚渐变连线 -->
        <linearGradient id="grad-model-1" x1="910" y1="180" x2="1140" y2="430" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#27648F" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#C34B22" stop-opacity="0.9" />
        </linearGradient>
        <linearGradient id="grad-model-2" x1="910" y1="330" x2="1140" y2="450" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#2F7568" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#C34B22" stop-opacity="0.9" />
        </linearGradient>
        <linearGradient id="grad-model-3" x1="910" y1="480" x2="1140" y2="470" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#536A78" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#C34B22" stop-opacity="0.9" />
        </linearGradient>
        <linearGradient id="grad-model-4" x1="910" y1="630" x2="1140" y2="490" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#27648F" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#C34B22" stop-opacity="0.9" />
        </linearGradient>

        <linearGradient id="grad-final-out" x1="1380" y1="460" x2="1510" y2="460" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#C34B22" />
          <stop offset="100%" stop-color="#237052" />
        </linearGradient>
      </defs>

      <!-- 层次引导线与背景结构槽 -->
      <g opacity="0.65">
        <!-- 第0层：原始输入特征 -->
        <line x1="580" y1="105" x2="580" y2="700" stroke="#CBD8DF" stroke-width="1.5" stroke-dasharray="4 4" />
        <text x="580" y="88" text-anchor="middle" class="layer-label">INPUT X (输入特征)</text>

        <!-- 第1层：基模型层 -->
        <line x1="795" y1="105" x2="795" y2="700" stroke="#CBD8DF" stroke-width="1.5" stroke-dasharray="4 4" />
        <text x="795" y="88" text-anchor="middle" class="layer-label">LAYER 1 · 异构基学习器</text>

        <!-- 第2层：元特征流 -->
        <line x1="1040" y1="105" x2="1040" y2="700" stroke="#CBD8DF" stroke-width="1.5" stroke-dasharray="4 4" />
        <text x="1040" y="88" text-anchor="middle" class="layer-label">META FEATURES ŷ (元特征)</text>

        <!-- 第3层：元模型层 -->
        <line x1="1265" y1="105" x2="1265" y2="700" stroke="#CBD8DF" stroke-width="1.5" stroke-dasharray="4 4" />
        <text x="1265" y="88" text-anchor="middle" class="layer-label">LAYER 2 · 元学习器</text>
      </g>

      <!-- 原始特征流向各基模型的输入线 -->
      <g stroke="#CBD8DF" stroke-width="1.5">
        <path d="M 580 405 C 620 405, 640 165, 685 165" />
        <path d="M 580 405 C 620 405, 640 325, 685 325" />
        <path d="M 580 405 C 620 405, 640 485, 685 485" />
        <path d="M 580 405 C 620 405, 640 645, 685 645" />
        <circle cx="580" cy="405" r="5" fill="#536A78" />
        <text x="566" y="410" text-anchor="end" font-family="var(--font-num)" font-size="14" font-weight="700" fill="#536A78">X</text>
      </g>

      <!-- 4个异构基学习器 (Random Forest, GBDT, SVM, Logistic) -->
      <!-- 基模型 1: 随机森林 RF -->
      <g class="base-node" filter="url(#soft-shadow)">
        <rect x="685" y="125" width="220" height="80" rx="8" fill="#FFFFFF" stroke="#CBD8DF" stroke-width="1.5" />
        <rect x="685" y="125" width="48" height="80" rx="8" fill="#27648F" />
        <rect x="713" y="125" width="20" height="80" fill="#27648F" />
        <text x="709" y="172" text-anchor="middle" class="model-badge">M₁</text>
        <text x="748" y="159" class="node-title">随机森林</text>
        <text x="748" y="183" class="node-sub">Random Forest (Bagging)</text>
      </g>

      <!-- 基模型 2: 梯度提升 GBDT -->
      <g class="base-node" filter="url(#soft-shadow)">
        <rect x="685" y="285" width="220" height="80" rx="8" fill="#FFFFFF" stroke="#CBD8DF" stroke-width="1.5" />
        <rect x="685" y="285" width="48" height="80" rx="8" fill="#2F7568" />
        <rect x="713" y="285" width="20" height="80" fill="#2F7568" />
        <text x="709" y="332" text-anchor="middle" class="model-badge">M₂</text>
        <text x="748" y="319" class="node-title">梯度提升树</text>
        <text x="748" y="343" class="node-sub">LightGBM / GBDT (Boosting)</text>
      </g>

      <!-- 基模型 3: 支持向量机 SVM -->
      <g class="base-node" filter="url(#soft-shadow)">
        <rect x="685" y="445" width="220" height="80" rx="8" fill="#FFFFFF" stroke="#CBD8DF" stroke-width="1.5" />
        <rect x="685" y="445" width="48" height="80" rx="8" fill="#536A78" />
        <rect x="713" y="445" width="20" height="80" fill="#536A78" />
        <text x="709" y="492" text-anchor="middle" class="model-badge">M₃</text>
        <text x="748" y="479" class="node-title">支持向量机</text>
        <text x="748" y="503" class="node-sub">SVM (RBF Kernel)</text>
      </g>

      <!-- 基模型 4: 前馈神经网络 MLP -->
      <g class="base-node" filter="url(#soft-shadow)">
        <rect x="685" y="605" width="220" height="80" rx="8" fill="#FFFFFF" stroke="#CBD8DF" stroke-width="1.5" />
        <rect x="685" y="605" width="48" height="80" rx="8" fill="#27648F" />
        <rect x="713" y="605" width="20" height="80" fill="#27648F" />
        <text x="709" y="652" text-anchor="middle" class="model-badge">M₄</text>
        <text x="748" y="639" class="node-title">前馈神经网络</text>
        <text x="748" y="663" class="node-sub">MLP Classifier</text>
      </g>

      <!-- 汇聚束（动态流线向中间汇聚） -->
      <g fill="none">
        <!-- 静态引导轨道 -->
        <path d="M 905 165 C 1010 165, 1040 420, 1130 420" stroke="#E2EBF0" stroke-width="3" />
        <path d="M 905 325 C 1000 325, 1040 445, 1130 445" stroke="#E2EBF0" stroke-width="3" />
        <path d="M 905 485 C 1000 485, 1040 470, 1130 470" stroke="#E2EBF0" stroke-width="3" />
        <path d="M 905 645 C 1010 645, 1040 495, 1130 495" stroke="#E2EBF0" stroke-width="3" />

        <!-- 动画特征流 -->
        <path d="M 905 165 C 1010 165, 1040 420, 1130 420" stroke="url(#grad-model-1)" stroke-width="2.5" class="flow-line" />
        <path d="M 905 325 C 1000 325, 1040 445, 1130 445" stroke="url(#grad-model-2)" stroke-width="2.5" class="flow-line-fast" />
        <path d="M 905 485 C 1000 485, 1040 470, 1130 470" stroke="url(#grad-model-3)" stroke-width="2.5" class="flow-line" />
        <path d="M 905 645 C 1010 645, 1040 495, 1130 495" stroke="url(#grad-model-4)" stroke-width="2.5" class="flow-line-fast" />

        <!-- 元特征输入汇聚插槽 -->
        <circle cx="1130" cy="420" r="5" fill="#27648F" />
        <circle cx="1130" cy="445" r="5" fill="#2F7568" />
        <circle cx="1130" cy="470" r="5" fill="#536A78" />
        <circle cx="1130" cy="495" r="5" fill="#27648F" />
      </g>

      <!-- 中间指示标记：元特征矩阵向量 -->
      <g>
        <rect x="975" y="375" width="130" height="38" rx="6" fill="#FFFFFF" stroke="#CBD8DF" stroke-width="1.5" filter="url(#soft-shadow)" />
        <text x="1040" y="399" text-anchor="middle" font-family="var(--font-num)" font-size="14" font-weight="700" fill="#C34B22">Z = [ŷ₁  ŷ₂  ŷ₃  ŷ₄]</text>
      </g>

      <!-- 第二层：元学习器（Meta-Learner）核心容器卡片 -->
      <g filter="url(#meta-shadow)">
        <rect x="1130" y="355" width="270" height="200" rx="14" fill="#FFFFFF" stroke="#C34B22" stroke-width="2.5" />
        
        <!-- 内部装饰顶条 -->
        <path d="M 1130 369 A 14 14 0 0 1 1144 355 L 1386 355 A 14 14 0 0 1 1400 369 L 1400 398 L 1130 398 Z" fill="#FFF3EE" />
        <text x="1265" y="386" text-anchor="middle" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#C34B22" letter-spacing="0.1em">META-LEARNER (LAYER 2)</text>
        
        <!-- 元模型主体文字 -->
        <text x="1265" y="435" text-anchor="middle" class="meta-node-title">元学习器</text>
        <text x="1265" y="462" text-anchor="middle" class="meta-node-sub">Logistic 回归 / Lasso / 浅层回归器</text>
        <line x1="1165" y1="482" x2="1365" y2="482" stroke="#F0D5C9" stroke-width="1.2" />
        
        <text x="1265" y="512" text-anchor="middle" class="meta-formula">ŷ_final = g( ŷ₁, ŷ₂, ŷ₃, ŷ₄ )</text>
        <text x="1265" y="534" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#536A78">从折外预测样本自主学习组合权值</text>
      </g>

      <!-- 最终集成输出预测流 -->
      <g fill="none">
        <path d="M 1400 455 L 1480 455" stroke="url(#grad-final-out)" stroke-width="4.5" stroke-linecap="round" />
        <polygon points="1490,455 1475,447 1475,463" fill="#237052" />
        
        <!-- 最终输出节点徽章 -->
        <g filter="url(#soft-shadow)">
          <circle cx="1525" cy="455" r="30" fill="#237052" />
          <text x="1525" y="462" text-anchor="middle" font-family="var(--font-sans)" font-size="16" font-weight="800" fill="#FFFFFF">Ŷ</text>
        </g>
        <text x="1525" y="506" text-anchor="middle" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#237052">最终稳健预测</text>
      </g>
    </svg>

    <!-- 底部前瞻线索（与后续 page-21, 22, 23 内容紧密呼应） -->
    <footer class="roadmap">
      <div class="road-card">
        <span class="road-num">01 / ARCHITECTURE</span>
        <span class="road-head">两层结构解耦</span>
        <span class="road-desc">基学习器输出成为输入，元学习器自主学习组合权值</span>
      </div>
      <div class="road-card">
        <span class="road-num">02 / LEAKAGE GUARD</span>
        <span class="road-head">折外预测机制</span>
        <span class="road-desc">用 K-Fold 切分未见样本，杜绝元学习器在训练集上过拟合</span>
      </div>
      <div class="road-card">
        <span class="road-num">03 / MATRIX SYNTHESIS</span>
        <span class="road-head">元特征矩阵</span>
        <span class="road-desc">基模型异构预测汇聚成 N×M 矩阵，驱动第二层精准决策</span>
      </div>
    </footer>
  </main>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 20, total: 27, keys: false });
  </script>
</body>
</html>
