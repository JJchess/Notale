<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --stage-w: 1600;
      --stage-h: 900;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: #0d151c;
      color: var(--text);
      padding: 0;
      contain: layout paint;
    }

    #cover-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* 标题区域与排版布局 */
    .title-region {
      position: absolute;
      z-index: 10;
      left: 72px;
      top: 68px;
      width: 540px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chapter-tag {
      font-size: var(--fs-label, 15px);
      font-weight: 600;
      letter-spacing: 0.16em;
      color: #7997a8;
      text-transform: uppercase;
    }

    .main-title {
      margin: 0;
      font-size: 64px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: #f0f6fa;
    }

    .subtitle {
      margin: 0;
      font-size: var(--fs-h2, 22px);
      font-weight: 500;
      line-height: 1.35;
      color: #9db2c1;
    }

    .lead-desc {
      margin-top: 12px;
      font-size: var(--fs-sec, 16px);
      line-height: 1.6;
      color: #7f99a8;
      max-width: 500px;
    }

    .lead-desc strong {
      color: #d1e2ec;
      font-weight: 600;
    }

    /* 底部特征注记与阶段指示 */
    .stage-footnotes {
      position: absolute;
      z-index: 10;
      left: 72px;
      bottom: 56px;
      display: flex;
      gap: 36px;
      pointer-events: none;
    }

    .fn-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
      border-left: 2px solid rgba(121, 151, 168, 0.35);
      padding-left: 14px;
    }

    .fn-title {
      font-size: var(--fs-label, 15px);
      font-weight: 600;
      color: #e2ebf0;
      letter-spacing: 0.04em;
    }

    .fn-desc {
      font-size: var(--fs-tick, 13px);
      color: #7f99a8;
      line-height: 1.45;
    }

    /* 右上角序列图例指示 */
    .sequence-legend {
      position: absolute;
      z-index: 10;
      right: 64px;
      top: 56px;
      display: flex;
      align-items: center;
      gap: 22px;
      background: rgba(18, 38, 52, 0.72);
      border: 1px solid rgba(83, 106, 120, 0.35);
      border-radius: 8px;
      padding: 10px 18px;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .legend-cell {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-tick, 13px);
      color: #c5d7e2;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .legend-line {
      width: 20px;
      height: 2px;
    }
  </style>
</head>
<body data-page="13" data-total="27">
  <div id="stage">
    <canvas id="cover-canvas" class="cv-fill"></canvas>

    <header class="title-region">
      <span class="chapter-tag">Part III · 序列集成机制</span>
      <h1 class="main-title">Boosting</h1>
      <p class="subtitle">按顺序纠正错误：从残差累积出高精度</p>
      <div class="lead-desc">
        基学习器不再并行独立投票，而是<strong>排成接力序列</strong>。每一个后继弱模型聚焦于前轮未能正确拟合的遗留误差，沿着未修正方向层层补偿，将粗糙的弱决策累积为稳健强判断。
      </div>
    </header>

    <div class="sequence-legend">
      <div class="legend-cell">
        <span class="legend-dot" style="background: #27648f;"></span>
        <span>弱学习器 hₘ(x) 决策面</span>
      </div>
      <div class="legend-cell">
        <span class="legend-dot" style="background: #e85d30; box-shadow: 0 0 6px rgba(232,93,48,0.7);"></span>
        <span>焦点残差 / 加权样本</span>
      </div>
      <div class="legend-cell">
        <span class="legend-line" style="background: #c34b22;"></span>
        <span>累积集成强边界 F(x)</span>
      </div>
    </div>

    <div class="stage-footnotes">
      <div class="fn-item">
        <span class="fn-title">序列接力机制</span>
        <span class="fn-desc">每一轮评估全局损失，精准锁定上一轮失误区域</span>
      </div>
      <div class="fn-item">
        <span class="fn-title">误差梯队传递</span>
        <span class="fn-desc">遗留残差递减，加权累积边界逐渐向最优分界面逼近</span>
      </div>
      <div class="fn-item">
        <span class="fn-title">弱到强的跃迁</span>
        <span class="fn-desc">各阶段简单截面组合，构造出适应复杂曲面的非线性解</span>
      </div>
    </div>
  </div>

  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("cover-canvas");
      let ctx;
      let stopLoop = () => {};

      // 阶段与弱学习器配置：4 个阶段的接力弱学习器，自左向右排列在右侧证据场 (x: 630 -> 1530)
      const STAGES = [
        { id: 1, title: "Step 1: 粗分类器 h₁(x)", cx: 720, cy: 360, w: 180, h: 260, cutAngle: 0.15, cutVal: -12, weight: 0.42 },
        { id: 2, title: "Step 2: 修正遗留残差 h₂(x)", cx: 960, cy: 360, w: 180, h: 260, cutAngle: 1.62, cutVal: 8, weight: 0.58 },
        { id: 3, title: "Step 3: 补偿边缘畸变 h₃(x)", cx: 1200, cy: 360, w: 180, h: 260, cutAngle: -0.75, cutVal: 2, weight: 0.72 },
        { id: 4, title: "Step 4: 集成收敛 F(x)", cx: 1440, cy: 360, w: 180, h: 260, isFinal: true, weight: 1.0 }
      ];

      // 固定伪随机数据点（两类点，一类环形，一类中心，或双月形）
      function seededRandom(seed) {
        let s = seed % 2147483647;
        if (s <= 0) s += 2147483646;
        return () => {
          s = (s * 16807) % 2147483647;
          return (s - 1) / 2147483646;
        };
      }

      const rng = seededRandom(1024);
      const NUM_POINTS = 36;
      const samplePoints = [];
      for (let i = 0; i < NUM_POINTS; i++) {
        // 在局部坐标 [-65, 65] x [-95, 95] 内分布
        const cls = i < NUM_POINTS / 2 ? 1 : -1;
        let px, py;
        if (cls === 1) {
          const r = 20 + rng() * 32;
          const theta = rng() * Math.PI * 2;
          px = r * Math.cos(theta);
          py = r * Math.sin(theta) * 1.3 - 10;
        } else {
          const r = 48 + rng() * 24;
          const theta = rng() * Math.PI * 2;
          px = r * Math.cos(theta);
          py = r * Math.sin(theta) * 1.3 + 12;
        }
        samplePoints.push({ x: px, y: py, cls });
      }

      // 计算真实判别：
      // Step 1: 桩 h1
      // Step 2: 关注 h1 的错分点，桩 h2 修正下半部错分
      // Step 3: 桩 h3 修正侧向残留
      // Step 4: 汇聚各桩，几乎全部分对
      const stageEvaluations = STAGES.map((st, idx) => {
        return samplePoints.map((pt) => {
          let isError = false;
          if (idx === 0) {
            // 切分线
            const proj = pt.x * Math.cos(st.cutAngle) + pt.y * Math.sin(st.cutAngle);
            const pred = proj > st.cutVal ? 1 : -1;
            isError = pred !== pt.cls;
          } else if (idx === 1) {
            // 只有约 6-7 个焦点残差点保持高权重关注
            const proj1 = pt.x * Math.cos(STAGES[0].cutAngle) + pt.y * Math.sin(STAGES[0].cutAngle);
            const prevErr = (proj1 > STAGES[0].cutVal ? 1 : -1) !== pt.cls;
            const proj2 = pt.x * Math.cos(st.cutAngle) + pt.y * Math.sin(st.cutAngle);
            const pred = proj2 > st.cutVal ? 1 : -1;
            isError = prevErr && (pred !== pt.cls);
          } else if (idx === 2) {
            // 只有少数几个残留边界难分点
            const proj2 = pt.x * Math.cos(STAGES[1].cutAngle) + pt.y * Math.sin(STAGES[1].cutAngle);
            const prevErr = (proj2 > STAGES[1].cutVal ? 1 : -1) !== pt.cls;
            const proj3 = pt.x * Math.cos(st.cutAngle) + pt.y * Math.sin(st.cutAngle);
            const pred = proj3 > st.cutVal ? 1 : -1;
            isError = prevErr && (pred !== pt.cls);
          } else {
            isError = false; // 集成完全收敛
          }

          return {
            x: pt.x,
            y: pt.y,
            cls: pt.cls,
            isError: isError,
            weight: isError ? 1.4 : 1.0
          };
        });
      });

      function drawBackground() {
        // 精致网格与渐变深蓝灰背景
        const grad = ctx.createRadialGradient(900, 300, 100, 900, 450, 900);
        grad.addColorStop(0, "#132330");
        grad.addColorStop(0.65, "#0d151c");
        grad.addColorStop(1, "#080c10");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1600, 900);

        // 柔和微网格
        ctx.strokeStyle = "rgba(43, 76, 98, 0.14)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 40; x < 1600; x += 40) {
          ctx.moveTo(x, 0);
          ctx.lineTo(x, 900);
        }
        for (let y = 40; y < 900; y += 40) {
          ctx.moveTo(0, y);
          ctx.lineTo(1600, y);
        }
        ctx.stroke();

        // 标题区避让氛围光晕（左侧较静，右侧有计算力场）
        const glow = ctx.createRadialGradient(1100, 380, 50, 1100, 380, 550);
        glow.addColorStop(0, "rgba(39, 100, 143, 0.18)");
        glow.addColorStop(0.5, "rgba(195, 75, 34, 0.08)");
        glow.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(600, 100, 950, 650);
      }

      function drawStageBox(st, idx, time) {
        const { cx, cy, w, h, isFinal } = st;
        const left = cx - w / 2;
        const top = cy - h / 2;

        // 面板卡片背景
        ctx.save();
        ctx.fillStyle = isFinal ? "rgba(22, 38, 50, 0.88)" : "rgba(16, 29, 39, 0.75)";
        ctx.strokeStyle = isFinal ? "rgba(195, 75, 34, 0.65)" : "rgba(66, 104, 130, 0.4)";
        ctx.lineWidth = isFinal ? 2 : 1.2;

        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(left, top, w, h, 8);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.fillRect(left, top, w, h);
          ctx.strokeRect(left, top, w, h);
        }

        // 面板标题条
        ctx.fillStyle = isFinal ? "rgba(195, 75, 34, 0.2)" : "rgba(39, 100, 143, 0.25)";
        ctx.fillRect(left, top, w, 28);
        ctx.strokeStyle = isFinal ? "rgba(195, 75, 34, 0.4)" : "rgba(66, 104, 130, 0.3)";
        ctx.beginPath();
        ctx.moveTo(left, top + 28);
        ctx.lineTo(left + w, top + 28);
        ctx.stroke();

        ctx.fillStyle = isFinal ? "#f59e72" : "#98c4df";
        ctx.font = "600 12px 'Noto Sans SC', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(st.title, cx, top + 19);

        // 弱分类器切分线 / 集成分界线
        const sampleSet = stageEvaluations[idx];
        ctx.save();
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(left, top + 28, w, h - 28, [0, 0, 8, 8]);
        } else {
          ctx.rect(left, top + 28, w, h - 28);
        }
        ctx.clip();

        if (!isFinal) {
          // 线性桩决策面
          const angle = st.cutAngle;
          const normalX = Math.cos(angle);
          const normalY = Math.sin(angle);
          const lineDirX = -normalY;
          const lineDirY = normalX;

          const midX = cx + normalX * st.cutVal;
          const midY = cy + normalY * st.cutVal;

          ctx.strokeStyle = "rgba(78, 161, 211, 0.85)";
          ctx.lineWidth = 2.5;
          ctx.setLineDash([4, 3]);
          ctx.beginPath();
          ctx.moveTo(midX - lineDirX * 160, midY - lineDirY * 160);
          ctx.lineTo(midX + lineDirX * 160, midY + lineDirY * 160);
          ctx.stroke();
          ctx.setLineDash([]);

          // 决策方向微箭头
          ctx.fillStyle = "rgba(78, 161, 211, 0.85)";
          ctx.beginPath();
          const arrowX = midX + normalX * 14;
          const arrowY = midY + normalY * 14;
          ctx.arc(arrowX, arrowY, 3, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // 最终非线性分界面：由前面各个基分类器组合而成的平滑封闭非线性环
          ctx.strokeStyle = "#e85d30";
          ctx.lineWidth = 3;
          ctx.fillStyle = "rgba(195, 75, 34, 0.12)";
          ctx.beginPath();
          const steps = 40;
          for (let s = 0; s <= steps; s++) {
            const th = (s / steps) * Math.PI * 2;
            const rBase = 38 + Math.sin(th * 2 + 0.4) * 8 + Math.cos(th * 3) * 5;
            const px = cx + rBase * Math.cos(th);
            const py = cy + rBase * Math.sin(th) * 1.25;
            if (s === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.stroke();
          ctx.fill();
        }

        // 绘制散点
        for (let i = 0; i < sampleSet.length; i++) {
          const pt = sampleSet[i];
          const px = cx + pt.x;
          const py = cy + pt.y;

          if (pt.isError && !isFinal) {
            // 误分类样本（残差焦点）：橙红色高亮并有呼吸光晕
            const pulse = 1 + 0.15 * Math.sin(time * 0.004 + i);
            const radius = 5.5 * pulse;

            ctx.fillStyle = "rgba(232, 93, 48, 0.35)";
            ctx.beginPath();
            ctx.arc(px, py, radius * 2.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ff6230";
            ctx.beginPath();
            ctx.arc(px, py, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.5;
            ctx.stroke();
          } else {
            // 正确分类点：清晰区分类别
            const r = isFinal ? 4 : 3.2;
            ctx.fillStyle = pt.cls === 1 ? "rgba(47, 117, 104, 0.9)" : "rgba(39, 100, 143, 0.9)";
            ctx.beginPath();
            ctx.arc(px, py, r, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();

        // 阶段权重标注
        ctx.fillStyle = "#7f99a8";
        ctx.font = "12px 'Noto Sans SC', sans-serif";
        ctx.textAlign = "center";
        const wLabel = isFinal ? "最终判决: F(x)=sign(∑αₘhₘ)" : `基分类器权重 α = ${(st.weight).toFixed(2)}`;
        ctx.fillText(wLabel, cx, top + h + 22);

        ctx.restore();
      }

      function drawConnectingArrows(time) {
        // 阶梯之间的序列残差接力箭头与数据流转微粒
        for (let i = 0; i < STAGES.length - 1; i++) {
          const curr = STAGES[i];
          const next = STAGES[i + 1];
          const startX = curr.cx + curr.w / 2 + 6;
          const endX = next.cx - next.w / 2 - 8;
          const midY = curr.cy;

          // 主干流线
          ctx.strokeStyle = "rgba(121, 151, 168, 0.35)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(startX, midY);
          ctx.lineTo(endX, midY);
          ctx.stroke();

          // 箭头头
          ctx.fillStyle = "rgba(121, 151, 168, 0.6)";
          ctx.beginPath();
          ctx.moveTo(endX, midY);
          ctx.lineTo(endX - 7, midY - 4);
          ctx.lineTo(endX - 7, midY + 4);
          ctx.closePath();
          ctx.fill();

          // 残差流向文字说明
          ctx.fillStyle = i === 2 ? "#e85d30" : "#8ca7b8";
          ctx.font = "11px 'Noto Sans SC', sans-serif";
          ctx.textAlign = "center";
          const label = i === 0 ? "提取残差" : (i === 1 ? "放大误差权重" : "加权线性汇聚");
          ctx.fillText(label, (startX + endX) / 2, midY - 14);

          // 动态光点表示“误差沿序列梯队向后接力传递”
          const progress = ((time * 0.0012 + i * 0.33) % 1);
          const px = startX + (endX - startX) * progress;
          const py = midY;

          ctx.fillStyle = i === 2 ? "#ff865a" : "#4ea1d3";
          ctx.shadowColor = i === 2 ? "#ff865a" : "#4ea1d3";
          ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.arc(px, py, 3.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }

      function drawResidualCurve(time) {
        // 在 4 个模型卡片下方绘制“序列误差随轮数阶梯下降”的趋势线
        const originX = 640;
        const originY = 635;
        const curveW = 870;
        const curveH = 75;

        ctx.save();
        // 底层刻度轴
        ctx.strokeStyle = "rgba(83, 106, 120, 0.35)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(originX, originY + curveH);
        ctx.lineTo(originX + curveW, originY + curveH);
        ctx.stroke();

        ctx.fillStyle = "#658294";
        ctx.font = "11px 'Noto Sans SC', sans-serif";
        ctx.textAlign = "left";
        ctx.fillText("序列集成轮数 m →", originX + curveW - 100, originY + curveH + 16);
        ctx.fillText("集成训练误差 L(y, F_m(x)) ↓", originX, originY - 8);

        // 误差下降曲线 (阶梯式下降)
        const lossValues = [0.82, 0.44, 0.22, 0.06];
        const stepXs = STAGES.map(s => s.cx);

        ctx.strokeStyle = "rgba(195, 75, 34, 0.85)";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (let i = 0; i < stepXs.length; i++) {
          const x = stepXs[i];
          const y = originY + (1 - lossValues[i]) * (curveH - 12);
          if (i === 0) {
            ctx.moveTo(originX, y);
            ctx.lineTo(x, y);
          } else {
            const prevX = stepXs[i - 1];
            ctx.lineTo(x, y);
          }
        }
        ctx.lineTo(originX + curveW, originY + (1 - lossValues[3]) * (curveH - 12));
        ctx.stroke();

        // 关键点圆点与读数
        for (let i = 0; i < stepXs.length; i++) {
          const x = stepXs[i];
          const y = originY + (1 - lossValues[i]) * (curveH - 12);

          ctx.fillStyle = "#0d151c";
          ctx.beginPath();
          ctx.arc(x, y, 5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#e85d30";
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = "#d1e2ec";
          ctx.font = "bold 11px var(--font-num, sans-serif)";
          ctx.textAlign = "center";
          ctx.fillText(`ε=${lossValues[i].toFixed(2)}`, x, y - 8);
        }

        ctx.restore();
      }

      function render(time = 0) {
        if (!ctx) return;
        ctx.clearRect(0, 0, 1600, 900);
        drawBackground();
        drawConnectingArrows(time);
        STAGES.forEach((st, idx) => drawStageBox(st, idx, time));
        drawResidualCurve(time);
      }

      function init() {
        ctx = Deck.fit(canvas);
        render(0);

        if (!Deck.reduced()) {
          stopLoop = Deck.loop(render, { still: 1600 });
        }
      }

      Deck.init({ index: 13, total: 27, keys: false });
      init();

      Deck.onResize(() => {
        ctx = Deck.fit(canvas);
        render(0);
      });
    })();
  </script>
</body>
</html>
