<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F6F8;
      --text: #122634;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
    }

    #converge-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* 顶部课程信息与标题 */
    .header {
      position: relative;
      z-index: 2;
      max-width: 960px;
      margin-top: 24px;
    }

    .series-tag {
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .series-tag::before {
      content: "";
      display: inline-block;
      width: 24px;
      height: 2px;
      background: var(--model);
    }

    h1.title {
      font-size: var(--fs-h1);
      line-height: 1.2;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      margin: 0 0 16px 0;
    }

    .subtitle {
      font-size: var(--fs-lead);
      line-height: 1.5;
      color: var(--muted);
      max-width: 740px;
      margin: 0;
    }

    /* 视觉聚合中心卡片说明与图例 */
    .focal-region {
      position: absolute;
      right: 90px;
      top: 500px;
      width: 360px;
      z-index: 2;
      pointer-events: none;
    }

    .focal-card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(195, 75, 34, 0.25);
      border-radius: 8px;
      padding: 20px 22px;
      box-shadow: 0 8px 24px rgba(18, 38, 52, 0.08);
    }

    .focal-title {
      font-size: var(--fs-h2);
      color: var(--aggregate);
      font-weight: 700;
      margin: 0 0 8px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .focal-desc {
      font-size: var(--fs-sec);
      color: var(--muted);
      line-height: 1.48;
      margin: 0;
    }

    /* 底部三向机制线索 */
    .footer-bar {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(83, 106, 120, 0.15);
      border-radius: 8px;
      padding: 18px 28px;
      margin-bottom: 8px;
    }

    .footer-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .item-label {
      font-size: var(--fs-label);
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .item-label .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .item-sub {
      font-size: var(--fs-sec);
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body data-page="01" data-total="27">
  <div id="stage">
    <canvas id="converge-canvas" class="cv-fill" aria-hidden="true"></canvas>

    <header class="header">
      <div class="series-tag">机器学习概论 · 第八讲</div>
      <h1 class="title">集成学习：让一组模型<br>共同作出更稳健的判断</h1>
      <p class="subtitle">单模型易受样本扰动与局部偏差困扰；通过多样化的基学习器协同决策与概率融合，群体智慧平抑方差、纠正孤立失误。</p>
    </header>

    <aside class="focal-region" aria-hidden="true">
      <div class="focal-card">
        <div class="focal-title">
          <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--aggregate);"></span>
          聚合中心 · 最终判断
        </div>
        <p class="focal-desc">基学习器的多元航道在此汇入，局部波动相互抵消，输出高置信度共识。</p>
      </div>
    </aside>

    <footer class="footer-bar" role="list">
      <div class="footer-item" role="listitem">
        <div class="item-label">
          <span class="dot" style="background:var(--sample);"></span>
          多样性注入 · 样本与特征重构
        </div>
        <div class="item-sub">Bootstrap 采样、随机子空间与多源折外划分</div>
      </div>
      <div class="footer-item" role="listitem">
        <div class="item-label">
          <span class="dot" style="background:var(--model);"></span>
          并行与序列 · 基学习器协同
        </div>
        <div class="item-sub">Bagging 降低方差，Boosting 专注残差修正</div>
      </div>
      <div class="footer-item" role="listitem">
        <div class="item-label">
          <span class="dot" style="background:var(--aggregate);"></span>
          聚合抉择 · 终局判决
        </div>
        <div class="item-sub">多数表决、加权软投票与次级元学习器映射</div>
      </div>
    </footer>
  </div>

  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("converge-canvas");
      const ctx = Deck.fit(canvas);
      Deck.init({ index: 1, total: 27, keys: true });

      const SEED = "ensemble-learning-cover-v1";
      const rng = new Math.seedrandom(SEED);

      // 聚合终点（汇聚枢纽）
      const SINK = { x: 1240, y: 400 };

      // 避开标题区的判定
      const TITLE_ZONE = { x1: 56, y1: 40, x2: 980, y2: 320 };
      const CARD_ZONE = { x1: 1040, y1: 340, x2: 1460, y2: 480 };

      // 4组基学习器源泉（分散在左侧与下侧不同区域）
      const SOURCES = [
        { x: -40, y: 380, count: 18, color: "model", angle: 0.1 },
        { x: -40, y: 560, count: 20, color: "model", angle: -0.15 },
        { x: 120, y: 880, count: 22, color: "sample", angle: -0.7 },
        { x: 480, y: 920, count: 22, color: "sample", angle: -0.95 }
      ];

      // 生成流线
      const paths = [];
      const tracers = [];

      SOURCES.forEach((src, sIdx) => {
        for (let i = 0; i < src.count; i++) {
          const spreadY = (rng() - 0.5) * 120;
          const spreadX = (rng() - 0.5) * 60;
          const startX = src.x + spreadX;
          const startY = src.y + spreadY;

          // 贝塞尔控制点，模拟受引力汇聚到 SINK
          // 控制点1：源头切向延伸
          const cp1x = startX + Math.cos(src.angle) * 350 + (rng() - 0.5) * 100;
          const cp1y = startY + Math.sin(src.angle) * 350 + (rng() - 0.5) * 100;
          // 控制点2：接近终点时的平滑收拢
          const cp2x = SINK.x - 220 + (rng() - 0.5) * 80;
          const cp2y = SINK.y + (rng() - 0.5) * 140;

          // 采样生成点序列
          const steps = 70;
          const points = [];
          for (let step = 0; step <= steps; step++) {
            const t = step / steps;
            const it = 1 - t;
            // 三次贝塞尔曲线公式
            const px = it * it * it * startX + 3 * it * it * t * cp1x + 3 * it * t * t * cp2x + t * t * t * SINK.x;
            const py = it * it * it * startY + 3 * it * it * t * cp1y + 3 * it * t * t * cp2y + t * t * t * SINK.y;
            points.push({ x: px, y: py });
          }

          const pathObj = {
            points,
            colorKey: src.color,
            alpha: 0.12 + rng() * 0.16,
            width: 1.0 + rng() * 1.2
          };
          paths.push(pathObj);

          // 每个流线配置一个动态粒子(tracer)
          tracers.push({
            path: pathObj,
            progress: rng(),
            speed: 0.00012 + rng() * 0.00018,
            colorKey: src.color,
            size: 2.2 + rng() * 2.0
          });
        }
      });

      // 汇聚点向外散发的稳健预测流束（向右延伸）
      const OUT_SOURCES = [];
      for (let j = 0; j < 14; j++) {
        const angle = -0.3 + (j / 13) * 0.6 + (rng() - 0.5) * 0.08;
        const targetX = 1680;
        const targetY = SINK.y + Math.tan(angle) * 480 + (rng() - 0.5) * 40;
        const cpX = SINK.x + 180 + rng() * 80;
        const cpY = SINK.y + (targetY - SINK.y) * 0.3;

        const steps = 50;
        const points = [];
        for (let s = 0; s <= steps; s++) {
          const t = s / steps;
          const it = 1 - t;
          const px = it * it * SINK.x + 2 * it * t * cpX + t * t * targetX;
          const py = it * it * SINK.y + 2 * it * t * cpY + t * t * targetY;
          points.push({ x: px, y: py });
        }

        const outPath = {
          points,
          colorKey: "aggregate",
          alpha: 0.18 + rng() * 0.22,
          width: 1.4 + rng() * 1.6
        };
        paths.push(outPath);

        tracers.push({
          path: outPath,
          progress: rng(),
          speed: 0.00022 + rng() * 0.00016,
          colorKey: "aggregate",
          size: 3.2 + rng() * 1.8
        });
      }

      // 离线缓存静态流线底图
      const staticCanvas = document.createElement("canvas");
      let staticDrawn = false;

      function drawStaticLines() {
        staticCanvas.width = canvas.width;
        staticCanvas.height = canvas.height;
        const sCtx = staticCanvas.getContext("2d");
        const ratio = canvas.__r || 1;
        sCtx.setTransform(ratio, 0, 0, ratio, 0, 0);

        const modelRgb = Deck.rgb("model");
        const sampleRgb = Deck.rgb("sample");
        const aggregateRgb = Deck.rgb("aggregate");

        paths.forEach(p => {
          let baseRgb = modelRgb;
          if (p.colorKey === "sample") baseRgb = sampleRgb;
          if (p.colorKey === "aggregate") baseRgb = aggregateRgb;

          sCtx.beginPath();
          sCtx.lineWidth = p.width;
          sCtx.strokeStyle = `rgba(${baseRgb[0]}, ${baseRgb[1]}, ${baseRgb[2]}, ${p.alpha})`;
          p.points.forEach((pt, idx) => {
            if (idx === 0) sCtx.moveTo(pt.x, pt.y);
            else sCtx.lineTo(pt.x, pt.y);
          });
          sCtx.stroke();
        });
        staticDrawn = true;
      }

      function getPointOnPath(points, progress) {
        const clamped = Math.max(0, Math.min(1, progress));
        const total = points.length - 1;
        const pos = clamped * total;
        const idx = Math.min(Math.floor(pos), total - 1);
        const frac = pos - idx;
        const p1 = points[idx];
        const p2 = points[idx + 1];
        return {
          x: p1.x + (p2.x - p1.x) * frac,
          y: p1.y + (p2.y - p1.y) * frac
        };
      }

      function render(time, dt) {
        const ratio = canvas.__r || 1;
        ctx.save();
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        ctx.clearRect(0, 0, Deck.W, Deck.H);

        // 绘制静态流线
        if (staticDrawn) {
          ctx.drawImage(staticCanvas, 0, 0, Deck.W, Deck.H);
        }

        // 绘制汇聚中心光晕与环圈
        const aggRgb = Deck.rgb("aggregate");
        const pulse = Math.sin(time * 0.0022) * 0.15 + 0.85;

        // 汇聚中心柔和晕圈
        const grad = ctx.createRadialGradient(SINK.x, SINK.y, 4, SINK.x, SINK.y, 110);
        grad.addColorStop(0, `rgba(${aggRgb[0]}, ${aggRgb[1]}, ${aggRgb[2]}, ${0.28 * pulse})`);
        grad.addColorStop(0.5, `rgba(${aggRgb[0]}, ${aggRgb[1]}, ${aggRgb[2]}, ${0.08 * pulse})`);
        grad.addColorStop(1, `rgba(${aggRgb[0]}, ${aggRgb[1]}, ${aggRgb[2]}, 0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(SINK.x, SINK.y, 110, 0, Math.PI * 2);
        ctx.fill();

        // 聚合同心微环
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = `rgba(${aggRgb[0]}, ${aggRgb[1]}, ${aggRgb[2]}, ${0.45 * pulse})`;
        ctx.beginPath();
        ctx.arc(SINK.x, SINK.y, 18 * pulse, 0, Math.PI * 2);
        ctx.stroke();

        ctx.lineWidth = 0.8;
        ctx.strokeStyle = `rgba(${aggRgb[0]}, ${aggRgb[1]}, ${aggRgb[2]}, ${0.22 * pulse})`;
        ctx.beginPath();
        ctx.arc(SINK.x, SINK.y, 36 * pulse, 0, Math.PI * 2);
        ctx.stroke();

        // 汇聚核心实心点
        ctx.fillStyle = `rgba(${aggRgb[0]}, ${aggRgb[1]}, ${aggRgb[2]}, 0.9)`;
        ctx.beginPath();
        ctx.arc(SINK.x, SINK.y, 4.5, 0, Math.PI * 2);
        ctx.fill();

        // 绘制动态流转粒子
        const modelRgb = Deck.rgb("model");
        const sampleRgb = Deck.rgb("sample");

        tracers.forEach(t => {
          t.progress += t.speed * dt;
          if (t.progress > 1) t.progress -= 1;

          const pt = getPointOnPath(t.path.points, t.progress);

          let rgb = modelRgb;
          if (t.colorKey === "sample") rgb = sampleRgb;
          if (t.colorKey === "aggregate") rgb = aggRgb;

          // 粒子渐隐：靠近边缘渐淡
          const distFade = Math.sin(t.progress * Math.PI);
          const alpha = 0.35 + 0.6 * distFade;

          ctx.fillStyle = `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${alpha})`;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, t.size, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.restore();
      }

      function setup() {
        Deck.fit(canvas);
        drawStaticLines();
        Deck.loop((time, dt) => {
          render(time, dt);
        }, { still: 2400 });
      }

      Deck.onResize(() => {
        Deck.fit(canvas);
        drawStaticLines();
        render(0, 16);
      });

      setup();
    })();
  </script>
</body>
</html>
