<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Boosting：按顺序纠正错误</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F6F8;
      --text: #122634;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
    }
    #stage {
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 75% 45%, #EAF2F6 0%, #F2F6F8 70%);
      padding: 0;
    }

    /* 标题区域：左侧留白与稳定文本 */
    .title-region {
      position: absolute;
      top: 130px;
      left: 104px;
      width: 580px;
      z-index: 10;
      pointer-events: none;
    }

    .chapter-mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: var(--fs-label);
      font-family: var(--font-num);
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .chapter-mark::before {
      content: "";
      display: inline-block;
      width: 28px;
      height: 2px;
      background: var(--aggregate);
    }

    .main-title {
      /* 标题字阶使用主题 token 档位与规范 */
      font-size: 56px;
      font-weight: 700;
      line-height: 1.15;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }
    .main-title .keyword {
      color: var(--aggregate);
      display: block;
      font-size: 72px;
      line-height: 1.05;
      margin-bottom: 6px;
    }

    .lead-text {
      font-size: var(--fs-lead);
      line-height: 1.6;
      color: var(--muted);
      max-width: 520px;
      margin-bottom: 44px;
    }

    /* 章节线索标签群 */
    .chapter-cues {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 520px;
    }
    .cue-item {
      display: flex;
      align-items: baseline;
      gap: 14px;
      font-size: var(--fs-sec);
      color: var(--text);
      background: rgba(255, 255, 255, 0.7);
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid rgba(226, 235, 240, 0.8);
    }
    .cue-num {
      font-family: var(--font-num);
      font-size: var(--fs-tick);
      font-weight: 700;
      color: var(--muted);
      padding: 2px 6px;
      background: rgba(83, 106, 120, 0.1);
      border-radius: 4px;
    }
    .cue-desc {
      color: var(--muted);
      font-size: var(--fs-sec);
    }
    .cue-desc strong {
      color: var(--text);
      font-weight: 600;
    }

    /* 右侧主角：序列级联修正系统 (SVG) */
    .cascade-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 1600px;
      height: 900px;
      pointer-events: none;
      z-index: 5;
    }

    /* 树形卡片与投影 */
    .stage-card {
      filter: drop-shadow(0 14px 28px rgba(18, 38, 52, 0.08)) drop-shadow(0 2px 6px rgba(18, 38, 52, 0.04));
      transition: transform var(--duration) var(--ease);
    }

    /* 残差流动画 */
    .flow-line {
      stroke-dasharray: 8 6;
      animation: flowDash 30s linear infinite;
    }
    @keyframes flowDash {
      to {
        stroke-dashoffset: -280;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .flow-line {
        animation: none;
      }
    }
  </style>
</head>
<body data-page="13" data-total="27">
  <div id="stage">
    <!-- 标题与章节主旨叙事区 -->
    <header class="title-region">
      <div class="chapter-mark">Module 03 · Ensemble Learning</div>
      <h1 class="main-title">
        <span class="keyword">Boosting</span>
        按顺序纠正错误
      </h1>
      <p class="lead-text">
        与基学习器独立并行的 Bagging 不同，Boosting 让每一轮新模型专门盯住前序集成仍未处理好的残差或错题，小步迭代、加权收敛。
      </p>

      <div class="chapter-cues">
        <div class="cue-item">
          <span class="cue-num">01</span>
          <div class="cue-desc"><strong>序列递进</strong>：后一棵树学习前序模型的预测偏差与残差</div>
        </div>
        <div class="cue-item">
          <span class="cue-num">02</span>
          <div class="cue-desc"><strong>重构权重</strong>：难分样本权值放大，高精弱分类器权重大</div>
        </div>
        <div class="cue-item">
          <span class="cue-num">03</span>
          <div class="cue-desc"><strong>步长制约</strong>：用小学习率防止单轮树过深导致的过拟合风险</div>
        </div>
      </div>
    </header>

    <!-- 右侧序列式残差纠错视觉主体 (1600x900 空间精确定位) -->
    <svg class="cascade-scene" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 渐变定义 -->
        <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="100%" stop-color="#F5F9FA" />
        </linearGradient>
        <linearGradient id="focusCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="100%" stop-color="#EDF4F8" />
        </linearGradient>
        <linearGradient id="aggCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="100%" stop-color="#FFF5F2" />
        </linearGradient>
        <linearGradient id="residualBeam" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#C34B22" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#C34B22" stop-opacity="0.3" />
        </linearGradient>
        
        <!-- 箭头标号 -->
        <marker id="arrow-agg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#C34B22" />
        </marker>
        <marker id="arrow-seq" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#536A78" />
        </marker>
      </defs>

      <!-- 背景柔和导引脉络（从 Stage 1 贯穿到集成） -->
      <path d="M 750 360 C 860 360, 890 280, 970 280" stroke="#CBDCE4" stroke-width="2" stroke-dasharray="6 6" />

      <!-- ================= 阶段 1：初次拟合模型 F_1(x) ================= -->
      <g class="stage-card" transform="translate(680, 130)">
        <!-- 卡片底板 -->
        <rect width="255" height="295" rx="16" fill="url(#cardGrad1)" stroke="#CBDCE4" stroke-width="1.5" />
        <!-- 卡头 -->
        <rect width="255" height="42" rx="16" fill="#F0F5F8" />
        <path d="M 0 32 L 0 42 L 255 42 L 255 32 Z" fill="#F0F5F8" />
        <text x="20" y="27" fill="#536A78" font-size="13" font-family="'Noto Sans SC', sans-serif" font-weight="700" letter-spacing="0.5">轮次 01 · 初次拟合</text>
        <text x="235" y="27" fill="#27648F" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="end">h₁(x)</text>

        <!-- 内部微图解：简单决策面与残差样本 -->
        <!-- 坐标系与决策桩 -->
        <line x1="28" y1="210" x2="226" y2="210" stroke="#D1DEE5" stroke-width="1" />
        <line x1="28" y1="70" x2="28" y2="210" stroke="#D1DEE5" stroke-width="1" />
        
        <!-- 真实目标分布（淡淡的曲线） -->
        <path d="M 35 185 Q 85 180, 125 125 T 215 90" stroke="#8CAAB9" stroke-width="2" stroke-dasharray="4 3" />

        <!-- 弱树 1 的台阶预测 -->
        <path d="M 35 175 L 120 175 L 120 110 L 215 110" stroke="#27648F" stroke-width="3.5" stroke-linecap="round" />

        <!-- 样本点分布与残差高亮（红色小残差棒） -->
        <circle cx="65" cy="180" r="4.5" fill="#2F7568" />
        
        <!-- 明显偏差样本 -->
        <circle cx="105" cy="145" r="5.5" fill="#C34B22" />
        <line x1="105" y1="145" x2="105" y2="175" stroke="#C34B22" stroke-width="2" />

        <!-- 大残差样本 -->
        <circle cx="145" cy="150" r="6.5" fill="#C34B22" />
        <line x1="145" y1="150" x2="145" y2="110" stroke="#C34B22" stroke-width="2.5" />
        <text x="156" y="136" fill="#C34B22" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700">r₁ = y - h₁</text>

        <!-- 吻合尚可 -->
        <circle cx="195" cy="98" r="4.5" fill="#2F7568" />

        <!-- 底部说明标签 -->
        <rect x="22" y="242" width="211" height="34" rx="6" fill="#FFFFFF" stroke="#E2EBF0" />
        <text x="127" y="264" fill="#536A78" font-size="13" font-family="'Noto Sans SC', sans-serif" text-anchor="middle">单一弱学习器遗留大残差</text>
      </g>

      <!-- 序列残差传递标注线 (Stage 1 -> Stage 2) -->
      <g>
        <path d="M 935 255 C 990 255, 985 305, 1032 315" fill="none" stroke="#C34B22" stroke-width="2.5" marker-end="url(#arrow-agg)" class="flow-line" />
        <rect x="955" y="260" width="82" height="26" rx="4" fill="#FFFFFF" stroke="#F1D1C7" filter="drop-shadow(0 2px 4px rgba(195,75,34,0.1))" />
        <text x="996" y="278" fill="#C34B22" font-size="13" font-family="'Noto Sans SC', sans-serif" font-weight="600" text-anchor="middle">传递残差 r₁</text>
      </g>

      <!-- ================= 阶段 2：针对残差拟合 h_2(x) ================= -->
      <g class="stage-card" transform="translate(1040, 210)">
        <!-- 卡片底板 -->
        <rect width="255" height="295" rx="16" fill="url(#focusCardGrad)" stroke="#27648F" stroke-width="2" />
        <!-- 卡头 -->
        <rect width="255" height="42" rx="16" fill="#E2EBF0" />
        <path d="M 0 32 L 0 42 L 255 42 L 255 32 Z" fill="#E2EBF0" />
        <text x="20" y="27" fill="#122634" font-size="13" font-family="'Noto Sans SC', sans-serif" font-weight="700" letter-spacing="0.5">轮次 02 · 纠偏拟合</text>
        <text x="235" y="27" fill="#27648F" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="end">h₂(x)</text>

        <!-- 坐标系 -->
        <line x1="28" y1="210" x2="226" y2="210" stroke="#CBDCE4" stroke-width="1" />
        <line x1="28" y1="70" x2="28" y2="210" stroke="#CBDCE4" stroke-width="1" />

        <!-- 零基线 -->
        <line x1="28" y1="140" x2="226" y2="140" stroke="#A6BDCB" stroke-width="1.5" stroke-dasharray="3 3" />
        <text x="34" y="134" fill="#8CAAB9" font-size="11" font-family="'JetBrains Mono', monospace">r = 0</text>

        <!-- h_2 拟合残差的台阶函数 -->
        <path d="M 35 140 L 95 140 L 95 168 L 165 168 L 165 125 L 215 125" stroke="#C34B22" stroke-width="3" stroke-linecap="round" />

        <!-- 放大关注权重的关键残差样本点 -->
        <circle cx="105" cy="168" r="6" fill="#C34B22" stroke="#FFFFFF" stroke-width="2" />
        <circle cx="145" cy="168" r="7.5" fill="#C34B22" stroke="#FFFFFF" stroke-width="2" />
        <circle cx="65" cy="140" r="3.5" fill="#2F7568" opacity="0.6" />
        <circle cx="195" cy="132" r="3.5" fill="#2F7568" opacity="0.6" />

        <text x="156" y="196" fill="#C34B22" font-size="13" font-family="'Noto Sans SC', sans-serif" font-weight="600">重点补偿错漏</text>

        <!-- 底部说明标签 -->
        <rect x="22" y="242" width="211" height="34" rx="6" fill="#FFFFFF" stroke="#CBDCE4" />
        <text x="127" y="264" fill="#122634" font-size="13" font-family="'Noto Sans SC', sans-serif" font-weight="600" text-anchor="middle">针对前序残差做定向学习</text>
      </g>

      <!-- 累加汇聚流：从 Stage 1 & Stage 2 指向最终集成 -->
      <path d="M 807 425 C 807 550, 930 635, 968 635" fill="none" stroke="#27648F" stroke-width="2" stroke-dasharray="5 5" opacity="0.7" />
      <path d="M 1167 505 C 1167 560, 1070 635, 1032 635" fill="none" stroke="#C34B22" stroke-width="2" stroke-dasharray="5 5" opacity="0.8" />

      <!-- 加权相加运算节点符号 -->
      <g transform="translate(970, 605)">
        <circle cx="30" cy="30" r="26" fill="#FFFFFF" stroke="#C34B22" stroke-width="2.5" filter="drop-shadow(0 4px 12px rgba(195,75,34,0.18))" />
        <line x1="18" y1="30" x2="42" y2="30" stroke="#C34B22" stroke-width="3.5" stroke-linecap="round" />
        <line x1="30" y1="18" x2="30" y2="42" stroke="#C34B22" stroke-width="3.5" stroke-linecap="round" />
        <text x="30" y="74" fill="#C34B22" font-size="13" font-family="'Noto Sans SC', sans-serif" font-weight="700" text-anchor="middle">加权累加 ∑</text>
      </g>

      <!-- ================= 阶段 3 / 最终形态：强学习器 F(x) ================= -->
      <g class="stage-card" transform="translate(1040, 520)">
        <!-- 卡片底板 -->
        <rect width="460" height="300" rx="18" fill="url(#aggCardGrad)" stroke="#C34B22" stroke-width="2" />
        <!-- 卡头：左右排布，避免重叠 -->
        <rect width="460" height="48" rx="18" fill="#FCECE6" />
        <path d="M 0 34 L 0 48 L 460 48 L 460 34 Z" fill="#FCECE6" />
        <text x="24" y="30" fill="#C34B22" font-size="15" font-family="'Noto Sans SC', sans-serif" font-weight="700" letter-spacing="0.5">最终强学习器</text>
        <text x="436" y="31" fill="#C34B22" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="end">F(x) = ∑ αₘ hₘ(x)</text>

        <!-- 坐标系与组合后的精确拟合曲线 -->
        <line x1="36" y1="210" x2="424" y2="210" stroke="#E5C7BE" stroke-width="1.2" />
        <line x1="36" y1="70" x2="36" y2="210" stroke="#E5C7BE" stroke-width="1.2" />

        <!-- 真实分布 (参考虚线) -->
        <path d="M 45 185 Q 120 180, 190 125 T 410 85" stroke="#A98F87" stroke-width="2" stroke-dasharray="4 3" />

        <!-- 累加后平滑收敛的细致台阶响应 -->
        <path d="M 45 180 L 100 180 L 100 156 L 160 156 L 160 120 L 260 120 L 260 90 L 410 90" stroke="#C34B22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

        <!-- 全部样本点：均紧贴集成台阶 -->
        <circle cx="75" cy="180" r="5" fill="#2F7568" />
        <circle cx="130" cy="156" r="5" fill="#2F7568" />
        <circle cx="190" cy="120" r="5" fill="#2F7568" />
        <circle cx="270" cy="116" r="5" fill="#2F7568" />
        <circle cx="365" cy="90" r="5" fill="#2F7568" />

        <!-- 状态标注徽标 -->
        <rect x="36" y="235" width="388" height="44" rx="8" fill="#FFFFFF" stroke="#F1D1C7" />
        <circle cx="58" cy="257" r="6" fill="#237052" />
        <text x="76" y="262" fill="#122634" font-size="14" font-family="'Noto Sans SC', sans-serif" font-weight="600">
          逐轮纠偏收敛：多轮弱分类器线性加权形成高精度强分类器
        </text>
      </g>

      <!-- 顶部序列方向指标 -->
      <g transform="translate(680, 85)">
        <text x="0" y="20" fill="#536A78" font-size="13" font-family="'Noto Sans SC', sans-serif" font-weight="600">序列迭代方向</text>
        <line x1="95" y1="16" x2="300" y2="16" stroke="#536A78" stroke-width="1.5" marker-end="url(#arrow-seq)" />
        <text x="320" y="20" fill="#C34B22" font-size="14" font-family="'JetBrains Mono', monospace" font-weight="700">m = 1, 2, ..., M</text>
      </g>
    </svg>
  </div>
