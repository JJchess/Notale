<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F6F8;
      --text: #122634;
      --font-sans: "Noto Sans SC", system-ui, -apple-system, sans-serif;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* 视觉背景：精细构建的 Stacking 双层折外特征堆叠与汇聚图 */
    .stack-stage-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* 封面排版区域：左侧安静文本区，纯正无边框设计 */
    .cover-header {
      position: relative;
      z-index: 3;
      margin-top: 48px;
      margin-left: 28px;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .chapter-tag {
      font-size: var(--fs-label);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chapter-tag::before {
      content: "";
      display: inline-block;
      width: 24px;
      height: 2px;
      background: var(--model);
    }

    .cover-title {
      font-size: 56px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      margin: 0;
    }

    .cover-title .en-word {
      font-family: var(--font-num), var(--font-sans);
      color: var(--model);
      font-weight: 850;
      letter-spacing: -0.01em;
      display: block;
      margin-bottom: 8px;
    }

    .cover-subtitle {
      font-size: var(--fs-lead);
      line-height: 1.5;
      color: var(--muted);
      margin: 0;
      font-weight: 400;
      max-width: 540px;
    }

    /* 底部三条清晰的学习线索（同行基线排布） */
    .cover-foot {
      position: relative;
      z-index: 3;
      margin-left: 28px;
      margin-bottom: 44px;
      display: flex;
      gap: 48px;
      align-items: flex-end;
    }

    .foot-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 320px;
    }

    .foot-num {
      font-family: var(--font-num);
      font-size: var(--fs-label);
      font-weight: 700;
      color: var(--model);
      letter-spacing: 0.08em;
    }

    .foot-desc {
      font-size: var(--fs-sec);
      line-height: 1.45;
      color: var(--text);
      font-weight: 600;
    }

    .foot-desc span {
      color: var(--muted);
      font-weight: 400;
      display: block;
      font-size: var(--fs-label);
      margin-top: 2px;
    }

    /* 动画与微动 */
    .stream-line {
      stroke-dasharray: 8 6;
      animation: dashMove 24s linear infinite;
    }

    @keyframes dashMove {
      to {
        stroke-dashoffset: -280;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .stream-line {
        animation: none;
      }
    }
  </style>
</head>
<body data-page="20" data-total="27">
  <div id="stage">
    <!-- 视觉构图：Stacking 核心机制图（两层学习器、折外预测特征矩阵与元决策曲面） -->
    <svg class="stack-stage-art" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 渐变与滤镜定义 -->
        <linearGradient id="layerGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#27648F" stop-opacity="0.12" />
          <stop offset="100%" stop-color="#27648F" stop-opacity="0.03" />
        </linearGradient>
        
        <linearGradient id="oofFlow" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#27648F" stop-opacity="0.75" />
          <stop offset="50%" stop-color="#2F7568" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#C34B22" stop-opacity="0.9" />
        </linearGradient>

        <linearGradient id="metaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#C34B22" stop-opacity="0.15" />
          <stop offset="100%" stop-color="#C34B22" stop-opacity="0.02" />
        </linearGradient>

        <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
          <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#122634" flood-opacity="0.06" />
        </filter>
        <filter id="focusGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#C34B22" flood-opacity="0.18" />
        </filter>
      </defs>

      <!-- 底层微弱参考网格（标定机器学习空间） -->
      <g stroke="#536A78" stroke-opacity="0.08" stroke-width="1">
        <line x1="620" y1="90" x2="1540" y2="90" />
        <line x1="620" y1="270" x2="1540" y2="270" />
        <line x1="620" y1="450" x2="1540" y2="450" />
        <line x1="620" y1="630" x2="1540" y2="630" />
        <line x1="620" y1="810" x2="1540" y2="810" />
        <line x1="660" y1="60" x2="660" y2="840" />
        <line x1="970" y1="60" x2="970" y2="840" />
        <line x1="1260" y1="60" x2="1260" y2="840" />
      </g>

      <!-- ================= 第一层：多样性基学习器 (Base Models) ================= -->
      <!-- 基模型 1：决策树森林 / 结构树 -->
      <g transform="translate(660, 110)" filter="url(#cardShadow)">
        <rect width="250" height="190" rx="12" fill="#FFFFFF" stroke="#27648F" stroke-width="1.5" />
        <rect x="0" y="0" width="250" height="42" rx="12" fill="#27648F" fill-opacity="0.06" />
        <text x="18" y="27" fill="#27648F" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="700">基学习器 1 · Random Forest</text>
        
        <!-- 树形示意图 -->
        <g stroke="#27648F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(35, 58)">
          <circle cx="85" cy="18" r="6" fill="#FFFFFF" />
          <line x1="81" y1="23" x2="48" y2="48" />
          <line x1="89" y1="23" x2="122" y2="48" />
          <circle cx="48" cy="52" r="5.5" fill="#27648F" />
          <circle cx="122" cy="52" r="5.5" fill="#FFFFFF" />
          <line x1="118" y1="57" x2="98" y2="84" />
          <line x1="126" y1="57" x2="146" y2="84" />
          <circle cx="98" cy="88" r="5" fill="#27648F" />
          <circle cx="146" cy="88" r="5" fill="#2F7568" />
        </g>
        <text x="16" y="168" fill="#536A78" font-family="'Noto Sans SC', sans-serif" font-size="13">非线性局部规则分割</text>
      </g>

      <!-- 基模型 2：梯度提升机 / 递进残差 -->
      <g transform="translate(660, 335)" filter="url(#cardShadow)">
        <rect width="250" height="190" rx="12" fill="#FFFFFF" stroke="#27648F" stroke-width="1.5" />
        <rect x="0" y="0" width="250" height="42" rx="12" fill="#27648F" fill-opacity="0.06" />
        <text x="18" y="27" fill="#27648F" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="700">基学习器 2 · Gradient Boost</text>
        
        <!-- 梯度递减序列阶梯 -->
        <g stroke="#27648F" stroke-width="1.5" transform="translate(30, 60)">
          <line x1="10" y1="78" x2="175" y2="78" stroke="#536A78" stroke-opacity="0.3" stroke-width="1" />
          <rect x="20" y="14" width="30" height="64" fill="#27648F" fill-opacity="0.85" rx="3" />
          <rect x="62" y="32" width="30" height="46" fill="#27648F" fill-opacity="0.65" rx="3" />
          <rect x="104" y="48" width="30" height="30" fill="#27648F" fill-opacity="0.45" rx="3" />
          <rect x="146" y="58" width="30" height="20" fill="#2F7568" fill-opacity="0.75" rx="3" />
        </g>
        <text x="16" y="168" fill="#536A78" font-family="'Noto Sans SC', sans-serif" font-size="13">加法模型与残差逐步修正</text>
      </g>

      <!-- 基模型 3：线性 / 正则化神经网络 / 支持向量 -->
      <g transform="translate(660, 560)" filter="url(#cardShadow)">
        <rect width="250" height="190" rx="12" fill="#FFFFFF" stroke="#27648F" stroke-width="1.5" />
        <rect x="0" y="0" width="250" height="42" rx="12" fill="#27648F" fill-opacity="0.06" />
        <text x="18" y="27" fill="#27648F" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="700">基学习器 3 · Neural / Linear</text>
        
        <!-- 连续超平面与激活曲线 -->
        <g transform="translate(30, 60)">
          <path d="M 15 76 Q 60 72 95 44 T 175 14" fill="none" stroke="#27648F" stroke-width="2.8" />
          <circle cx="175" cy="14" r="5" fill="#2F7568" />
          <circle cx="95" cy="44" r="4.5" fill="#27648F" />
          <circle cx="45" cy="73" r="4.5" fill="#27648F" />
          <line x1="15" y1="78" x2="175" y2="78" stroke="#536A78" stroke-opacity="0.3" stroke-width="1" />
        </g>
        <text x="16" y="168" fill="#536A78" font-family="'Noto Sans SC', sans-serif" font-size="13">全局平滑超平面投影</text>
      </g>

      <!-- ================= 中间转换区：K-Fold 折外预测 (Out-of-Fold Matrix) ================= -->
      <!-- 连线：从基模型到折外预测矩阵 -->
      <path d="M 910 205 C 960 205, 960 320, 1000 320" fill="none" stroke="url(#oofFlow)" stroke-width="2.5" class="stream-line" />
      <path d="M 910 430 C 960 430, 960 430, 1000 430" fill="none" stroke="url(#oofFlow)" stroke-width="2.5" class="stream-line" />
      <path d="M 910 655 C 960 655, 960 540, 1000 540" fill="none" stroke="url(#oofFlow)" stroke-width="2.5" class="stream-line" />

      <!-- 折外预测矩阵展示板 (Meta-Features) -->
      <g transform="translate(1000, 210)" filter="url(#cardShadow)">
        <rect width="210" height="430" rx="12" fill="#FFFFFF" stroke="#2F7568" stroke-width="2" />
        <rect x="0" y="0" width="210" height="46" rx="12" fill="#2F7568" fill-opacity="0.08" />
        <text x="18" y="29" fill="#2F7568" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="700">元特征矩阵 (OOF)</text>
        
        <!-- 列头说明 -->
        <g transform="translate(20, 62)">
          <text x="14" y="10" fill="#536A78" font-family="var(--font-num)" font-size="13" font-weight="700">M₁</text>
          <text x="64" y="10" fill="#536A78" font-family="var(--font-num)" font-size="13" font-weight="700">M₂</text>
          <text x="114" y="10" fill="#536A78" font-family="var(--font-num)" font-size="13" font-weight="700">M₃</text>
          <text x="156" y="10" fill="#C34B22" font-family="var(--font-num)" font-size="13" font-weight="800">y</text>
          <line x1="0" y1="20" x2="170" y2="20" stroke="#536A78" stroke-opacity="0.2" stroke-width="1" />
        </g>

        <!-- 矩阵热力与数据条目 (5折无泄漏结构) -->
        <g transform="translate(20, 100)">
          <!-- Fold 1 -->
          <rect x="6" y="0" width="36" height="46" rx="4" fill="#27648F" fill-opacity="0.25" />
          <rect x="56" y="0" width="36" height="46" rx="4" fill="#27648F" fill-opacity="0.4" />
          <rect x="106" y="0" width="36" height="46" rx="4" fill="#27648F" fill-opacity="0.15" />
          <rect x="154" y="0" width="12" height="46" rx="3" fill="#2F7568" fill-opacity="0.75" />

          <!-- Fold 2 -->
          <rect x="6" y="56" width="36" height="46" rx="4" fill="#27648F" fill-opacity="0.5" />
          <rect x="56" y="56" width="36" height="46" rx="4" fill="#27648F" fill-opacity="0.3" />
          <rect x="106" y="56" width="36" height="46" rx="4" fill="#27648F" fill-opacity="0.6" />
          <rect x="154" y="56" width="12" height="46" rx="3" fill="#2F7568" fill-opacity="0.75" />

          <!-- Fold 3 -->
          <rect x="6" y="112" width="36" height="46" rx="4" fill="#27648F" fill-opacity="0.15" />
          <rect x="56" y="112" width="36" height="46" rx="4" fill="#27648F" fill-opacity="0.65" />
          <rect x="106" y="112" width="36" height="46" rx="4" fill="#27648F" fill-opacity="0.35" />
          <rect x="154" y="112" width="12" height="46" rx="3" fill="#2F7568" fill-opacity="0.75" />

          <!-- Fold 4 -->
          <rect x="6" y="168" width="36" height="46" rx="4" fill="#27648F" fill-opacity="0.7" />
          <rect x="56" y="168" width="36" height="46" rx="4" fill="#27648F" fill-opacity="0.2" />
          <rect x="106" y="168" width="36" height="46" rx="4" fill="#27648F" fill-opacity="0.5" />
          <rect x="154" y="168" width="12" height="46" rx="3" fill="#2F7568" fill-opacity="0.75" />

          <!-- Fold 5 -->
          <rect x="6" y="224" width="36" height="46" rx="4" fill="#27648F" fill-opacity="0.35" />
          <rect x="56" y="224" width="36" height="46" rx="4" fill="#27648F" fill-opacity="0.5" />
          <rect x="106" y="224" width="36" height="46" rx="4" fill="#27648F" fill-opacity="0.2" />
          <rect x="154" y="224" width="12" height="46" rx="3" fill="#2F7568" fill-opacity="0.75" />
        </g>

        <!-- 矩阵底部标注 -->
        <text x="18" y="405" fill="#2F7568" font-family="'Noto Sans SC', sans-serif" font-size="13" font-weight="600">严格无泄漏跨折预测</text>
      </g>

      <!-- ================= 第二层：元学习器汇聚 (Meta-Learner) ================= -->
      <!-- 汇聚导向连线 -->
      <path d="M 1210 425 L 1290 425" stroke="#C34B22" stroke-width="3.5" stroke-linecap="round" />
      <polygon points="1295,425 1281,418 1281,432" fill="#C34B22" />

      <!-- 元学习器卡片 -->
      <g transform="translate(1300, 260)" filter="url(#focusGlow)">
        <rect width="240" height="310" rx="14" fill="#FFFFFF" stroke="#C34B22" stroke-width="2.5" />
        <rect x="0" y="0" width="240" height="48" rx="14" fill="#C34B22" fill-opacity="0.08" />
        <text x="20" y="31" fill="#C34B22" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="700">元学习器 · Meta Model</text>
        
        <!-- 组合逻辑示意图：学习各基模型的信任权重 -->
        <g transform="translate(26, 75)">
          <!-- 权重参数条 -->
          <text x="0" y="16" fill="#122634" font-family="var(--font-num)" font-size="14" font-weight="600">w₁·M₁</text>
          <rect x="58" y="4" width="85" height="15" rx="3" fill="#27648F" fill-opacity="0.85" />
          <text x="152" y="17" fill="#536A78" font-family="var(--font-num)" font-size="13">0.45</text>

          <text x="0" y="52" fill="#122634" font-family="var(--font-num)" font-size="14" font-weight="600">w₂·M₂</text>
          <rect x="58" y="40" width="66" height="15" rx="3" fill="#27648F" fill-opacity="0.65" />
          <text x="133" y="53" fill="#536A78" font-family="var(--font-num)" font-size="13">0.35</text>

          <text x="0" y="88" fill="#122634" font-family="var(--font-num)" font-size="14" font-weight="600">w₃·M₃</text>
          <rect x="58" y="76" width="38" height="15" rx="3" fill="#27648F" fill-opacity="0.4" />
          <text x="105" y="89" fill="#536A78" font-family="var(--font-num)" font-size="13">0.20</text>

          <line x1="0" y1="118" x2="188" y2="118" stroke="#C34B22" stroke-opacity="0.3" stroke-width="1" />
          
          <text x="0" y="146" fill="#C34B22" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="700">最终集成输出 ŷ</text>
          <text x="0" y="170" fill="#536A78" font-family="'Noto Sans SC', sans-serif" font-size="13">数据驱动的自适应最优权重</text>
          <text x="0" y="192" fill="#536A78" font-family="'Noto Sans SC', sans-serif" font-size="13">用验证真实标签反向拟合</text>
        </g>
      </g>

      <!-- 导引注记 -->
      <g transform="translate(1105, 160)">
        <text x="0" y="0" fill="#536A78" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Level-0 预测堆叠为 Level-1 输入</text>
        <path d="M 0 10 L 0 42" stroke="#536A78" stroke-width="1.2" stroke-dasharray="3 3" />
      </g>
    </svg>

    <!-- 顶栏/左侧核心讲义标题区 -->
    <header class="cover-header">
      <div class="chapter-tag">Chapter 04 · Stacking</div>
      <h1 class="cover-title">
        <span class="en-word">Stacking</span>
        学习如何组合模型
      </h1>
      <p class="cover-subtitle">
        不再依赖人工预设的简单平均或固定权重规则，将不同基学习器的预测结果作为全新特征，训练元学习器自动发现模型间的互补优势。
      </p>
    </header>

    <!-- 底部纵深知识点线索 -->
    <footer class="cover-foot">
      <div class="foot-col">
        <div class="foot-num">01 / TWO-LEVEL</div>
        <div class="foot-desc">
          两层层级架构
          <span>基模型输出升格为元特征</span>
        </div>
      </div>
      <div class="foot-col">
        <div class="foot-num">02 / OUT-OF-FOLD</div>
        <div class="foot-desc">
          严格折外预测
          <span>切断数据泄露与过度自负</span>
        </div>
      </div>
      <div class="foot-col">
        <div class="foot-num">03 / META LEARNING</div>
        <div class="foot-desc">
          自适应组合规则
          <span>由真实目标驱动的最优决策</span>
        </div>
      </div>
    </footer>
  </div>

  <script src="assets/base.js"></script>

    Deck.init({ index: 20, total: 27 });
  </script>
</body>
</html>
