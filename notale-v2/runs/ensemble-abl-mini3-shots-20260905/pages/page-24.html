<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F6F8;
      --text: #122634;
      --font-sans: "Noto Sans SC", system-ui, -apple-system, sans-serif;
    }

    #stage {
      position: relative;
      overflow: hidden;
      background: #F2F6F8;
      padding: 56px 80px;
      box-sizing: border-box;
    }

    /* 背景细微工程网格，极度淡雅 */
    .bg-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* 视觉主角系统：三路集成流收束与权衡焦点 */
    .convergence-scene {
      position: absolute;
      inset: 0;
      width: 1600px;
      height: 900px;
      z-index: 2;
      pointer-events: none;
    }

    /* 左侧主标题区：占据独立安静的留白场 */
    .title-field {
      position: absolute;
      top: 96px;
      left: 72px;
      width: 490px;
      z-index: 5;
      pointer-events: none;
    }

    .chapter-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: var(--fs-label);
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .chapter-eyebrow::before {
      content: "";
      display: inline-block;
      width: 24px;
      height: 2px;
      background: var(--aggregate);
    }

    .main-title {
      font-size: 48px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 18px;
    }

    .lead-text {
      font-size: var(--fs-sec);
      line-height: 1.55;
      color: var(--muted);
      max-width: 480px;
      margin-bottom: 24px;
    }

    .summary-rails {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 480px;
    }

    .rail-item {
      display: grid;
      grid-template-columns: 80px 1fr;
      align-items: baseline;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(83, 106, 120, 0.18);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(18, 38, 52, 0.04);
    }

    .rail-tag {
      font-size: var(--fs-label);
      font-weight: 700;
    }

    .rail-tag.bagging { color: var(--model); }
    .rail-tag.boosting { color: var(--aggregate); }
    .rail-tag.stacking { color: var(--sample); }

    .rail-desc {
      font-size: 13px;
      color: var(--text);
      line-height: 1.4;
    }

    /* 决策权衡象限卡 */
    .tradeoff-card {
      margin-top: 16px;
      padding: 12px 14px;
      background: #E2EBF0;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 480px;
    }

    .tradeoff-title {
      font-size: var(--fs-label);
      font-weight: 700;
      color: var(--text);
    }

    .tradeoff-note {
      font-size: var(--fs-tick);
      color: var(--muted);
      line-height: 1.4;
    }

    /* 右侧图解结构文字标签 */
    .stream-label {
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .stream-sub {
      font-family: var(--font-sans);
      font-size: 13px;
      fill: var(--muted);
    }

    .node-title {
      font-family: var(--font-sans);
      font-size: 18px;
      font-weight: 800;
      fill: var(--text);
    }

    .node-sub {
      font-family: var(--font-sans);
      font-size: 12px;
      fill: var(--muted);
    }

    /* 动画与交互过渡 */
    .flow-stream {
      stroke-dasharray: 8 6;
      animation: flow-dash 35s linear infinite;
    }

    .stream-bagging { stroke: var(--model); }
    .stream-boosting { stroke: var(--aggregate); }
    .stream-stacking { stroke: var(--sample); }

    @keyframes flow-dash {
      to { stroke-dashoffset: -280; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flow-stream { animation: none !important; }
    }
  </style>
</head>
<body data-page="24" data-total="27">
  <div id="stage" tabindex="0" aria-label="方法选择与收束标题页">
    <!-- 极淡工程坐标背景网格 -->
    <svg class="bg-grid cv-fill" viewBox="0 0 1600 900">
      <defs>
        <pattern id="grid-pattern" width="80" height="80" patternUnits="userSpaceOnUse">
          <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#536A78" stroke-width="0.75" stroke-opacity="0.06" />
        </pattern>
      </defs>
      <rect width="1600" height="900" fill="url(#grid-pattern)" />
    </svg>

    <!-- 左侧标题与收束导言 -->
    <div class="title-field">
      <div class="chapter-eyebrow">集成学习 · 第五节</div>
      <h1 class="main-title">方法选择<br>与实践收束</h1>
      <p class="lead-text">
        没有普适最优的集成算法。从降低方差、纠正偏差到异质融合，各范式在收益与成本间权衡；真正的工程优势建立在对任务特性的清晰裁决上。
      </p>

      <div class="summary-rails">
        <div class="rail-item">
          <span class="rail-tag bagging">Bagging</span>
          <span class="rail-desc">针对高方差强模型，通过自助重采样与并行平权投票消解波动</span>
        </div>
        <div class="rail-item">
          <span class="rail-tag boosting">Boosting</span>
          <span class="rail-desc">针对高偏差弱学习器，通过串行迭代自适应聚焦残差与高损样本</span>
        </div>
        <div class="rail-item">
          <span class="rail-tag stacking">Stacking</span>
          <span class="rail-desc">面向异质模型互补，通过两阶段元学习与交叉验证汇聚异构表征</span>
        </div>
      </div>

      <div class="tradeoff-card">
        <div class="tradeoff-title">收束准则：工程收益与计算代价的权衡</div>
        <div class="tradeoff-note">集成不是自动免费增益。多样性不足、推理延迟预算、概率校准偏差与数据泄漏将直接决定落地边界。</div>
      </div>
    </div>

    <!-- 右侧具象收束系统：三主流汇入决策收束核心，显式体现“集成增益与工程成本”的收束天平 -->
    <svg class="convergence-scene" viewBox="0 0 1600 900" role="img" aria-label="三类集成范式汇聚至工程决策收束核心">
      <defs>
        <!-- 渐变与阴影 -->
        <filter id="core-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#122634" flood-opacity="0.08" />
        </filter>
        <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#122634" flood-opacity="0.06" />
        </filter>
        
        <!-- 汇聚流渐变 -->
        <linearGradient id="grad-bagging" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#27648F" stop-opacity="0.2" />
          <stop offset="60%" stop-color="#27648F" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#27648F" stop-opacity="1" />
        </linearGradient>
        <linearGradient id="grad-boosting" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#C34B22" stop-opacity="0.2" />
          <stop offset="60%" stop-color="#C34B22" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#C34B22" stop-opacity="1" />
        </linearGradient>
        <linearGradient id="grad-stacking" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#2F7568" stop-opacity="0.2" />
          <stop offset="60%" stop-color="#2F7568" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#2F7568" stop-opacity="1" />
        </linearGradient>

        <linearGradient id="core-fill" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="100%" stop-color="#F2F6F8" />
        </linearGradient>
      </defs>

      <!-- 视觉主角背景：收束引力场与同心结构环 -->
      <g transform="translate(1160, 450)">
        <circle r="360" fill="none" stroke="#536A78" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="4 6" />
        <circle r="270" fill="none" stroke="#536A78" stroke-width="1.2" stroke-opacity="0.15" />
        <circle r="180" fill="none" stroke="#122634" stroke-width="1.5" stroke-opacity="0.08" />
      </g>

      <!-- 三路汇入通道曲线与粒子流线 -->
      <!-- 1. Bagging 路径 (上路): 并行多树平抑方差 -->
      <g>
        <path d="M 830 180 C 970 180, 1010 380, 1100 420" fill="none" stroke="#27648F" stroke-width="3.5" stroke-opacity="0.4" />
        <path class="flow-stream stream-bagging" d="M 830 180 C 970 180, 1010 380, 1100 420" fill="none" stroke-width="2.5" />
        <!-- 源头微型结构插元 -->
        <g transform="translate(810, 180)">
          <rect x="-170" y="-40" width="170" height="80" rx="10" fill="#FFFFFF" stroke="#27648F" stroke-width="1.8" filter="url(#badge-shadow)" />
          <text x="-85" y="-8" text-anchor="middle" class="stream-label" fill="#27648F">并行抽样 · 降方差</text>
          <text x="-85" y="16" text-anchor="middle" class="stream-sub">Bagging / 随机森林</text>
          <circle cx="10" cy="0" r="5" fill="#27648F" />
        </g>
      </g>

      <!-- 2. Boosting 路径 (中路): 串行聚焦残差 -->
      <g>
        <path d="M 830 450 C 940 450, 1000 450, 1090 450" fill="none" stroke="#C34B22" stroke-width="3.5" stroke-opacity="0.4" />
        <path class="flow-stream stream-boosting" d="M 830 450 C 940 450, 1000 450, 1090 450" fill="none" stroke-width="2.5" />
        <!-- 源头微型结构插元 -->
        <g transform="translate(810, 450)">
          <rect x="-170" y="-40" width="170" height="80" rx="10" fill="#FFFFFF" stroke="#C34B22" stroke-width="1.8" filter="url(#badge-shadow)" />
          <text x="-85" y="-8" text-anchor="middle" class="stream-label" fill="#C34B22">串行迭代 · 降偏差</text>
          <text x="-85" y="16" text-anchor="middle" class="stream-sub">GBDT / XGBoost</text>
          <circle cx="10" cy="0" r="5" fill="#C34B22" />
        </g>
      </g>

      <!-- 3. Stacking 路径 (下路): 异质模型分层融合 -->
      <g>
        <path d="M 830 720 C 970 720, 1010 520, 1100 480" fill="none" stroke="#2F7568" stroke-width="3.5" stroke-opacity="0.4" />
        <path class="flow-stream stream-stacking" d="M 830 720 C 970 720, 1010 520, 1100 480" fill="none" stroke-width="2.5" />
        <!-- 源头微型结构插元 -->
        <g transform="translate(810, 720)">
          <rect x="-170" y="-40" width="170" height="80" rx="10" fill="#FFFFFF" stroke="#2F7568" stroke-width="1.8" filter="url(#badge-shadow)" />
          <text x="-85" y="-8" text-anchor="middle" class="stream-label" fill="#2F7568">异质互补 · 元学习</text>
          <text x="-85" y="16" text-anchor="middle" class="stream-sub">Stacking / 交叉验证</text>
          <circle cx="10" cy="0" r="5" fill="#2F7568" />
        </g>
      </g>

      <!-- 汇聚枢纽中心 (Protagonist): 收束裁决核心 -->
      <g transform="translate(1210, 450)" filter="url(#core-shadow)">
        <!-- 枢纽外层多角精密结构 -->
        <rect x="-135" y="-135" width="270" height="270" rx="28" fill="url(#core-fill)" stroke="#122634" stroke-width="2" />
        <rect x="-124" y="-124" width="248" height="248" rx="20" fill="none" stroke="#536A78" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.35" />

        <!-- 内部收束决策天平与汇聚图解 -->
        <circle cx="0" cy="-12" r="74" fill="#FFFFFF" stroke="#E2EBF0" stroke-width="2" />

        <!-- 汇聚签名标志: ensemble-mark 具象表达 -->
        <path d="M -40 -38 L -10 -12 L -40 14" fill="none" stroke="#27648F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M -46 -12 L -10 -12" fill="none" stroke="#C34B22" stroke-width="3" stroke-linecap="round"/>
        <path d="M -40 14 L -10 -12 L -40 -38" fill="none" stroke="#2F7568" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
        
        <!-- 收束至单一精炼判断 -->
        <circle cx="28" cy="-12" r="15" fill="#122634" />
        <path d="M 22 -12 L 34 -12 M 28 -18 L 28 -6" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" />

        <!-- 状态标定 -->
        <text x="0" y="84" text-anchor="middle" class="node-title">方法裁决与收束</text>
        <text x="0" y="110" text-anchor="middle" font-size="13px" font-weight="600" fill="#536A78" letter-spacing="0.04em">方差 · 偏差 · 异质性 · 推理开销</text>
      </g>

      <!-- 延伸向后的最终工程落地指向 (Payoff output) -->
      <g transform="translate(1350, 450)">
        <line x1="0" y1="0" x2="160" y2="0" stroke="#122634" stroke-width="3.5" stroke-linecap="round" />
        <polygon points="160,0 144,-7 144,7" fill="#122634" />
        
        <rect x="36" y="-50" width="150" height="36" rx="8" fill="#FFFFFF" stroke="#122634" stroke-width="1.6" filter="url(#badge-shadow)" />
        <text x="111" y="-27" text-anchor="middle" font-size="15px" font-weight="700" fill="#122634">生产环境稳健落地</text>
      </g>
    </svg>
  </div>

  <script src="assets/base.js"></script>
  <script>
    "use strict";
    Deck.init({ index: 24, total: 27, keys: false });
  </script>
</body>
</html>
