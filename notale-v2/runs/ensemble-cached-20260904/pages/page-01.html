<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      position: relative;
      overflow: hidden;
      contain: layout paint;
      background: radial-gradient(1200px 700px at 75% 52%, #e5eef3 0%, var(--bg) 68%, #ebf1f4 100%);
      padding: var(--pad-y) var(--pad-x);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 背景细网格/底纹增强仪器质感，使用主题极淡边界色 */
    .field-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(to right, rgba(83, 106, 120, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(83, 106, 120, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(circle at 60% 50%, #000 35%, transparent 75%);
      mask-image: radial-gradient(circle at 60% 50%, #000 35%, transparent 75%);
    }

    /* 左侧题干与陈述区 */
    .title-field {
      position: relative;
      z-index: 5;
      width: 480px;
      margin-top: 56px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .kicker-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .kicker-text {
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.12em;
    }

    .kicker-rule {
      height: 1px;
      width: 44px;
      background: var(--muted);
      opacity: 0.45;
    }

    .hero-h1 {
      font-size: 58px;
      font-weight: 800;
      line-height: 1.14;
      letter-spacing: -0.035em;
      color: var(--text);
      margin: 0;
    }

    .hero-h1 span.hl {
      color: var(--aggregate);
      display: inline-block;
    }

    .hero-lead {
      font-size: var(--fs-lead);
      line-height: 1.56;
      color: var(--muted);
      max-width: 450px;
      margin: 0;
    }

    /* 左下角章节目录引导 */
    .bottom-meta {
      position: relative;
      z-index: 5;
      display: flex;
      gap: 36px;
      margin-bottom: 24px;
      font-size: var(--fs-sec);
      color: var(--muted);
    }

    .meta-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meta-col strong {
      color: var(--text);
      font-size: var(--fs-body);
      font-weight: 700;
    }

    /* 右侧主构图矢量场景 */
    .scene-svg {
      position: absolute;
      right: 0;
      top: 0;
      width: 1040px;
      height: 900px;
      z-index: 2;
      pointer-events: none;
    }

    /* 构图进场动效与稳定状态 */
    .is-entering .title-field {
      animation: copy-settle 900ms cubic-bezier(.16, 1, .3, 1) both;
    }
    .is-entering .stream-path {
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: draw-stream 1100ms 150ms cubic-bezier(.16, 1, .3, 1) forwards;
    }
    .is-entering .prism-core {
      animation: prism-settle 1200ms 280ms cubic-bezier(.16, 1, .3, 1) both;
    }
    .is-entering .out-beam {
      animation: out-beam-settle 1000ms 500ms cubic-bezier(.16, 1, .3, 1) both;
    }

    @keyframes copy-settle {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes draw-stream {
      to { stroke-dashoffset: 0; }
    }
    @keyframes prism-settle {
      from { opacity: 0.6; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes out-beam-settle {
      from { opacity: 0; transform: translateX(-16px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .is-entering .title-field,
      .is-entering .stream-path,
      .is-entering .prism-core,
      .is-entering .out-beam {
        animation: none !important;
        opacity: 1;
        transform: none;
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>
<body data-page="01" data-total="27">
  <div id="stage" tabindex="0">
    <div class="field-bg"></div>

    <div class="title-field">
      <div class="kicker-row">
        <span class="kicker-text">机器学习概论 · 第八讲</span>
        <div class="kicker-rule"></div>
      </div>
      <h1 class="hero-h1">集成学习<br><span class="hl">弱者协同，汇为至坚</span></h1>
      <p class="hero-lead">通过组合多个具备差异的基学习器，抵御单模型的偏见与随机扰动，共同作出更稳健的群体判断。</p>
    </div>

    <div class="bottom-meta">
      <div class="meta-col">
        <span>本讲核心路线</span>
        <strong>Bagging 降低方差 · Boosting 降低偏差 · Stacking 异构组合</strong>
      </div>
    </div>

    <!-- 右侧集成汇聚矢量舞台 -->
    <svg class="scene-svg" viewBox="0 0 1080 900" fill="none">
      <defs>
        <!-- 弱模型分流渐变 -->
        <linearGradient id="gradModel1" x1="60" y1="180" x2="520" y2="440" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="var(--model)" stop-opacity="0.1"/>
          <stop offset="40%" stop-color="var(--model)" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="var(--model)" stop-opacity="0.95"/>
        </linearGradient>
        <linearGradient id="gradModel2" x1="60" y1="310" x2="520" y2="445" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="var(--model)" stop-opacity="0.15"/>
          <stop offset="50%" stop-color="var(--model)" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="var(--model)" stop-opacity="0.95"/>
        </linearGradient>
        <linearGradient id="gradModel3" x1="60" y1="440" x2="520" y2="450" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="var(--model)" stop-opacity="0.2"/>
          <stop offset="50%" stop-color="var(--model)" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="var(--model)" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="gradModel4" x1="60" y1="570" x2="520" y2="455" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="var(--model)" stop-opacity="0.15"/>
          <stop offset="50%" stop-color="var(--model)" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="var(--model)" stop-opacity="0.95"/>
        </linearGradient>
        <linearGradient id="gradModel5" x1="60" y1="700" x2="520" y2="460" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="var(--model)" stop-opacity="0.1"/>
          <stop offset="40%" stop-color="var(--model)" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="var(--model)" stop-opacity="0.95"/>
        </linearGradient>

        <!-- 汇聚输出光柱渐变 -->
        <linearGradient id="gradAggregate" x1="560" y1="450" x2="1040" y2="450" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="var(--aggregate)" stop-opacity="0.95"/>
          <stop offset="65%" stop-color="var(--aggregate)" stop-opacity="0.75"/>
          <stop offset="100%" stop-color="var(--aggregate)" stop-opacity="0"/>
        </linearGradient>

        <!-- 聚合透镜阴影与发光 -->
        <filter id="prismGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="4" dy="10" stdDeviation="16" flood-color="#122634" flood-opacity="0.12"/>
        </filter>
        <filter id="beamHalo" x="-10%" y="-50%" width="120%" height="200%">
          <feGaussianBlur stdDeviation="12" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- 聚合背部柔和光晕 -->
      <circle cx="540" cy="450" r="180" fill="var(--surface-strong)" opacity="0.45" />

      <!-- 左侧：弱学习器输入分支光束 -->
      <g class="streams" fill="none" stroke-linecap="round">
        <!-- 枝条 1 -->
        <path class="stream-path" d="M 120,180 C 260,180 390,410 520,440" stroke="url(#gradModel1)" stroke-width="4.5"/>
        <path class="stream-path" d="M 120,180 C 260,180 390,410 520,440" stroke="#fff" stroke-width="1.2" opacity="0.65"/>
        
        <!-- 枝条 2 -->
        <path class="stream-path" d="M 120,310 C 270,310 400,430 520,445" stroke="url(#gradModel2)" stroke-width="5"/>
        <path class="stream-path" d="M 120,310 C 270,310 400,430 520,445" stroke="#fff" stroke-width="1.2" opacity="0.75"/>

        <!-- 枝条 3 (中心主轴) -->
        <path class="stream-path" d="M 120,450 L 520,450" stroke="url(#gradModel3)" stroke-width="6.5"/>
        <path class="stream-path" d="M 120,450 L 520,450" stroke="#fff" stroke-width="1.6" opacity="0.9"/>

        <!-- 枝条 4 -->
        <path class="stream-path" d="M 120,590 C 270,590 400,470 520,455" stroke="url(#gradModel4)" stroke-width="5"/>
        <path class="stream-path" d="M 120,590 C 270,590 400,470 520,455" stroke="#fff" stroke-width="1.2" opacity="0.75"/>

        <!-- 枝条 5 -->
        <path class="stream-path" d="M 120,720 C 260,720 390,490 520,460" stroke="url(#gradModel5)" stroke-width="4.5"/>
        <path class="stream-path" d="M 120,720 C 260,720 390,490 520,460" stroke="#fff" stroke-width="1.2" opacity="0.65"/>
      </g>

      <!-- 左侧基模型端点指示与概念微注 -->
      <g fill="var(--surface)" stroke="var(--model)" stroke-width="2.5">
        <circle cx="120" cy="180" r="10" />
        <circle cx="120" cy="310" r="10" />
        <circle cx="120" cy="450" r="11" fill="var(--model)" />
        <circle cx="120" cy="590" r="10" />
        <circle cx="120" cy="720" r="10" />
      </g>
      <g font-family="var(--font-num)" font-size="14" font-weight="700" fill="var(--muted)">
        <text x="142" y="185">h₁(x)</text>
        <text x="142" y="315">h₂(x)</text>
        <text x="144" y="455" fill="var(--text)">h₃(x)</text>
        <text x="142" y="595">h₄(x)</text>
        <text x="142" y="725">h₅(x)</text>
      </g>
      <text x="120" y="145" font-family="var(--font-sans)" font-size="14" font-weight="600" fill="var(--muted)" letter-spacing="0.06em">基学习器预测集合 (Base Estimators)</text>

      <!-- 右侧：汇聚后的稳健预测光束 -->
      <g class="out-beam">
        <!-- 强光晕底 -->
        <path d="M 550,450 L 1020,450" stroke="url(#gradAggregate)" stroke-width="32" opacity="0.22" filter="url(#beamHalo)"/>
        <!-- 主光束 -->
        <path d="M 550,450 L 1020,450" stroke="url(#gradAggregate)" stroke-width="12" stroke-linecap="round"/>
        <!-- 核心白炽光芯 -->
        <path d="M 550,450 L 980,450" stroke="#fff" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>

        <!-- 最终决策标注 -->
        <text x="760" y="420" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="var(--aggregate)" letter-spacing="0.05em">群体集成判断 H(x)</text>
        <text x="760" y="482" font-family="var(--font-sans)" font-size="14" fill="var(--muted)">更低泛化误差 · 更高稳定性</text>
      </g>

      <!-- 中枢：集成聚合核心棱镜透镜 (Ensemble Combiner) -->
      <g class="prism-core" filter="url(#prismGlow)" style="transform-origin: 540px 450px;">
        <!-- 透镜主体结构 -->
        <path d="M 520,330 Q 560,450 520,570 L 560,540 Q 590,450 560,360 Z" fill="var(--surface)" stroke="var(--surface-strong)" stroke-width="2"/>
        <!-- 高光前切面 -->
        <path d="M 520,330 Q 560,450 520,570" fill="none" stroke="var(--model)" stroke-width="3.5" opacity="0.8"/>
        <!-- 汇聚后缘 -->
        <path d="M 560,360 Q 590,450 560,540" fill="none" stroke="var(--aggregate)" stroke-width="3.5" opacity="0.9"/>
        
        <!-- 核心结合焦点 -->
        <circle cx="546" cy="450" r="14" fill="var(--surface)" stroke="var(--aggregate)" stroke-width="3.5"/>
        <circle cx="546" cy="450" r="5" fill="var(--aggregate)"/>

        <!-- 聚合规则标签 -->
        <rect x="480" y="605" width="132" height="28" rx="6" fill="var(--surface)" stroke="var(--muted)" stroke-opacity="0.25"/>
        <text x="546" y="624" font-family="var(--font-sans)" font-size="13" font-weight="600" fill="var(--text)" text-anchor="middle">投票 / 加权平均</text>
      </g>
    </svg>
  </div>

  <script src="assets/base.js"></script>
  <script>
    (function () {
      'use strict';
      Deck.init({ index: 1, total: 27, keys: false });

      var stage = document.getElementById('stage');
      var motionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
      var settleTimer = 0;

      function isReduced() {
        return motionQuery ? motionQuery.matches : Deck.reduced();
      }

      function settle() {
        stage.classList.remove('is-entering');
        stage.classList.add('is-settled');
      }

      function replay() {
        clearTimeout(settleTimer);
        stage.classList.remove('is-entering', 'is-settled');
        void stage.offsetWidth;

        if (isReduced()) {
          stage.classList.add('is-settled');
          return;
        }

        stage.classList.add('is-entering');
        settleTimer = setTimeout(settle, 1400);
      }

      if (motionQuery) {
        if (motionQuery.addEventListener) motionQuery.addEventListener('change', replay);
        else if (motionQuery.addListener) motionQuery.addListener(replay);
      }

      replay();
    })();
  </script>
</body>
</html>
