<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Stacking：学习如何组合模型</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F6F8;
      --surface: #FFFFFF;
      --surface-strong: #E2EBF0;
      --text: #122634;
      --muted: #536A78;
      --model: #27648F;
      --sample: #2F7568;
      --aggregate: #C34B22;
      --answer: #237052;
      --focus: #9B3F11;
      --ease-out: cubic-bezier(.16, 1, .3, 1);
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: radial-gradient(1200px 750px at 78% 54%, #E7EFF3 0%, #F2F6F8 72%, #ECF3F6 100%);
      contain: layout paint;
      user-select: none;
    }

    /* 左侧题头与主导语留白区 */
    .cover-copy {
      position: absolute;
      left: 104px;
      top: 170px;
      width: 580px;
      z-index: 10;
      pointer-events: none;
    }

    .meta-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-label);
      font-weight: 600;
      letter-spacing: .08em;
      color: var(--model);
      margin-bottom: 24px;
    }

    .meta-tag::before {
      content: "";
      width: 24px;
      height: 2px;
      background: var(--model);
      border-radius: 1px;
    }

    .cover-title {
      margin: 0;
      font-size: 64px;
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .cover-title .title-sub {
      display: block;
      margin-top: 16px;
      font-size: 40px;
      font-weight: 600;
      color: var(--model);
      letter-spacing: -0.01em;
    }

    .cover-subtitle {
      margin: 36px 0 0 0;
      font-size: var(--fs-lead);
      line-height: 1.6;
      color: var(--muted);
      max-width: 500px;
    }

    .cover-subtitle strong {
      color: var(--text);
      font-weight: 600;
    }

    /* 主视觉区域：双层学习器聚合结构 */
    .stage-canvas-wrap {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    /* 架构图层卡片与流线（矢量 SVG） */
    .stack-graphic {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    /* 入场动画与动效约束 */
    .is-entering .cover-copy {
      animation: copy-settle 1000ms var(--ease-out) both;
    }

    .is-entering .data-flow-group {
      animation: base-settle 1100ms 40ms var(--ease-out) both;
    }

    .is-entering .base-tier {
      animation: base-settle 1150ms 80ms var(--ease-out) both;
    }

    .is-entering .bridge-paths {
      animation: path-fade 1200ms 220ms var(--ease-out) both;
    }

    .is-entering .meta-card-group {
      animation: meta-settle 1250ms 360ms var(--ease-out) both;
    }

    .is-entering .final-tier {
      animation: final-settle 1300ms 480ms var(--ease-out) both;
    }

    @keyframes copy-settle {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes base-settle {
      from { opacity: 0; transform: translateX(-24px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes path-fade {
      from { opacity: 0; stroke-dashoffset: 80; }
      to { opacity: 1; stroke-dashoffset: 0; }
    }

    @keyframes meta-settle {
      from { opacity: 0; transform: scale(.94) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes final-settle {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cover-copy,
      .data-flow-group,
      .base-tier,
      .bridge-paths,
      .meta-card-group,
      .final-tier {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body data-page="20" data-total="27">
  <div id="stage" tabindex="0" role="region" aria-label="Stacking：学习如何组合模型">
    <!-- 左侧内容区：标题与核心主旨 -->
    <header class="cover-copy">
      <div class="meta-tag">第 4 模块 · 堆叠集成</div>
      <h1 class="cover-title">
        Stacking
        <span class="title-sub">学习如何组合模型</span>
      </h1>
      <p class="cover-subtitle">
        不再依赖人工设定的平均或多数表决。以各基模型的预测作为新特征，由<strong>元学习器</strong>从数据中习得最优融合权重与决策边界。
      </p>
    </header>

    <!-- 主构图：双层堆叠与折外预测特征流转示意 -->
    <svg class="stack-graphic cv-fill" viewBox="0 0 1600 900" fill="none">
      <defs>
        <!-- 投影滤镜 -->
        <filter id="softCardShadow" x="-10%" y="-15%" width="125%" height="140%" color-interpolation-filters="sRGB">
          <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#122634" flood-opacity="0.06"/>
          <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#122634" flood-opacity="0.04"/>
        </filter>

        <filter id="metaGlow" x="-20%" y="-20%" width="145%" height="150%" color-interpolation-filters="sRGB">
          <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#C34B22" flood-opacity="0.14"/>
        </filter>

        <!-- 渐变定义 -->
        <linearGradient id="flowGrad1" x1="970" y1="230" x2="1140" y2="450" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#27648F" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#C34B22" stop-opacity="0.8"/>
        </linearGradient>

        <linearGradient id="flowGrad2" x1="970" y1="380" x2="1140" y2="450" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#27648F" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#C34B22" stop-opacity="0.8"/>
        </linearGradient>

        <linearGradient id="flowGrad3" x1="970" y1="530" x2="1140" y2="450" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#27648F" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#C34B22" stop-opacity="0.8"/>
        </linearGradient>

        <linearGradient id="flowGrad4" x1="970" y1="680" x2="1140" y2="450" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#27648F" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#C34B22" stop-opacity="0.8"/>
        </linearGradient>

        <linearGradient id="metaOutputGrad" x1="1350" y1="450" x2="1470" y2="450" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#C34B22" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#C34B22" stop-opacity="0.3"/>
        </linearGradient>

        <!-- 箭头标记 -->
        <marker id="arrowHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C34B22"/>
        </marker>
      </defs>

      <!-- 整体背景底板定位标注区 -->
      <g class="data-flow-group" opacity="0.6">
        <!-- 训练数据源卡片指示 -->
        <rect x="660" y="380" width="64" height="140" rx="8" fill="#FFFFFF" stroke="#D3E0E8" stroke-width="1.5"/>
        <text x="692" y="440" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="#536A78" text-anchor="middle">原始特征</text>
        <text x="692" y="464" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#122634" text-anchor="middle">X</text>

        <!-- 连线：原始特征分发至基模型 -->
        <path d="M 724 450 L 750 450 L 750 230 L 770 230" stroke="#536A78" stroke-width="1.5" stroke-dasharray="3 3"/>
        <path d="M 724 450 L 770 380" stroke="#536A78" stroke-width="1.5" stroke-dasharray="3 3"/>
        <path d="M 724 450 L 770 530" stroke="#536A78" stroke-width="1.5" stroke-dasharray="3 3"/>
        <path d="M 724 450 L 750 450 L 750 680 L 770 680" stroke="#536A78" stroke-width="1.5" stroke-dasharray="3 3"/>
      </g>

      <!-- 连接管道与特征流（中间层汇聚至元学习器入口 x=1120） -->
      <g class="bridge-paths">
        <!-- 从基模型引出的数据流向元学习器 -->
        <path d="M 960 230 C 1030 230, 1060 410, 1120 410" stroke="url(#flowGrad1)" stroke-width="3" fill="none"/>
        <path d="M 960 380 C 1020 380, 1060 430, 1120 430" stroke="url(#flowGrad2)" stroke-width="3" fill="none"/>
        <path d="M 960 530 C 1020 530, 1060 470, 1120 470" stroke="url(#flowGrad3)" stroke-width="3" fill="none"/>
        <path d="M 960 680 C 1030 680, 1060 490, 1120 490" stroke="url(#flowGrad4)" stroke-width="3" fill="none"/>

        <!-- 交叉预测点脉冲标记 -->
        <circle cx="960" cy="230" r="5" fill="#27648F"/>
        <circle cx="960" cy="380" r="5" fill="#27648F"/>
        <circle cx="960" cy="530" r="5" fill="#27648F"/>
        <circle cx="960" cy="680" r="5" fill="#27648F"/>

        <!-- 元特征矩阵微缩示意标签 -->
        <g transform="translate(995, 308)">
          <rect x="0" y="0" width="108" height="34" rx="6" fill="#FFFFFF" stroke="#E2EBF0" stroke-width="1" filter="url(#softCardShadow)"/>
          <text x="54" y="22" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="600" fill="#536A78" text-anchor="middle">折外预测特征矩阵</text>
        </g>
      </g>

      <!-- 第一层（Layer 1）：异构基模型集群 (Base Models) -->
      <g class="base-tier">
        <!-- 栏目标签 -->
        <text x="770" y="156" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#536A78" letter-spacing="1.5px">第一层：多样化基学习器</text>

        <!-- 模型 1: 梯度提升树 GBDT -->
        <g transform="translate(770, 185)">
          <rect width="190" height="90" rx="10" fill="#FFFFFF" stroke="#E2EBF0" stroke-width="1.5" filter="url(#softCardShadow)"/>
          <rect x="12" y="14" width="6" height="62" rx="3" fill="#27648F"/>
          <text x="28" y="40" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#122634">GBDT 树模型</text>
          <text x="28" y="64" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#536A78">擅长捕获非线性边界</text>
          <circle cx="190" cy="45" r="4" fill="#27648F"/>
        </g>

        <!-- 模型 2: 随机森林 RF -->
        <g transform="translate(770, 335)">
          <rect width="190" height="90" rx="10" fill="#FFFFFF" stroke="#E2EBF0" stroke-width="1.5" filter="url(#softCardShadow)"/>
          <rect x="12" y="14" width="6" height="62" rx="3" fill="#27648F"/>
          <text x="28" y="40" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#122634">随机森林 RF</text>
          <text x="28" y="64" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#536A78">抗噪降方差稳定性好</text>
          <circle cx="190" cy="45" r="4" fill="#27648F"/>
        </g>

        <!-- 模型 3: 支持向量机 SVM -->
        <g transform="translate(770, 485)">
          <rect width="190" height="90" rx="10" fill="#FFFFFF" stroke="#E2EBF0" stroke-width="1.5" filter="url(#softCardShadow)"/>
          <rect x="12" y="14" width="6" height="62" rx="3" fill="#27648F"/>
          <text x="28" y="40" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#122634">SVM 分类器</text>
          <text x="28" y="64" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#536A78">寻找最大间隔超平面</text>
          <circle cx="190" cy="45" r="4" fill="#27648F"/>
        </g>

        <!-- 模型 4: 逻辑回归 / 线性模型 -->
        <g transform="translate(770, 635)">
          <rect width="190" height="90" rx="10" fill="#FFFFFF" stroke="#E2EBF0" stroke-width="1.5" filter="url(#softCardShadow)"/>
          <rect x="12" y="14" width="6" height="62" rx="3" fill="#27648F"/>
          <text x="28" y="40" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#122634">逻辑回归 / MLP</text>
          <text x="28" y="64" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#536A78">高维全局平滑概率先验</text>
          <circle cx="190" cy="45" r="4" fill="#27648F"/>
        </g>
      </g>

      <!-- 第二层（Layer 2）：元学习器 (Meta-Learner) -->
      <g class="meta-tier">
        <!-- 栏目标签 -->
        <text x="1120" y="305" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#C34B22" letter-spacing="1.5px">第二层：元学习器</text>

        <!-- 核心实体卡片，放置在 x=1120, y=330，宽 220，高 240 -->
        <g class="meta-card-group">
          <rect x="1120" y="330" width="220" height="240" rx="16" fill="#FFFFFF" stroke="#C34B22" stroke-width="2" filter="url(#metaGlow)"/>

          <!-- 顶部装饰栏与身份标识 -->
          <rect x="1120" y="330" width="220" height="42" rx="14" fill="#FDF3E9"/>
          <text x="1230" y="357" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#C34B22" text-anchor="middle">META-LEARNER</text>

          <!-- 标题与架构机制描述 -->
          <text x="1230" y="416" font-family="Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#122634" text-anchor="middle">元学习器</text>
          <text x="1230" y="442" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="600" fill="#C34B22" text-anchor="middle">(例如 Ridge / Lasso)</text>

          <path d="M 1144 464 L 1316 464" stroke="#E2EBF0" stroke-width="1"/>

          <text x="1230" y="494" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#536A78" text-anchor="middle">输入：各基模型输出 ŷ₁…ŷ₄</text>
          <text x="1230" y="522" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="#122634" text-anchor="middle">习得协同组合决策函数</text>

          <!-- 汇聚点指示器 -->
          <circle cx="1120" cy="450" r="6" fill="#C34B22"/>
          <circle cx="1340" cy="450" r="6" fill="#C34B22"/>
        </g>
      </g>

      <!-- 最终输出端（Payoff Tier） -->
      <g class="final-tier">
        <!-- 连接箭头线 -->
        <path d="M 1340 450 L 1420 450" stroke="#C34B22" stroke-width="3.5" marker-end="url(#arrowHead)"/>

        <!-- 最终输出标签卡 -->
        <g transform="translate(1425, 405)">
          <rect width="90" height="90" rx="14" fill="#122634" filter="url(#softCardShadow)"/>
          <text x="45" y="38" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="500" fill="#E2EBF0" text-anchor="middle">最终综合判断</text>
          <text x="45" y="66" font-family="Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">ŷ<tspan font-size="14" dy="4">final</tspan></text>
        </g>
      </g>

      <!-- 最终输出端（Payoff Tier） -->
      <g class="final-tier">
        <!-- 连接箭头线 -->
        <path d="M 1350 450 L 1420 450" stroke="#C34B22" stroke-width="3.5" marker-end="url(#arrowHead)"/>

        <!-- 最终输出标签卡 -->
        <g transform="translate(1425, 405)">
          <rect width="90" height="90" rx="14" fill="#122634" filter="url(#softCardShadow)"/>
          <text x="45" y="38" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="500" fill="#E2EBF0" text-anchor="middle">最终综合判断</text>
          <text x="45" y="66" font-family="Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">ŷ<tspan font-size="14" dy="4">final</tspan></text>
        </g>
      </g>
    </svg>
  </div>

  <script src="assets/base.js"></script>
  <script>
    (function () {
      'use strict';
      var stage = document.getElementById('stage');
      var motionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
      var settleTimer = 0;
      var disposed = false;

      function reduced() {
        return motionQuery ? motionQuery.matches : Deck.reduced();
      }

      function settle() {
        if (disposed) return;
        stage.classList.remove('is-entering');
        stage.classList.add('is-settled');
      }

      function syncMotion() {
        stage.classList.toggle('is-reduced', reduced());
        if (!reduced()) return;
        clearTimeout(settleTimer);
        settle();
      }

      function replay() {
        if (disposed) return;
        clearTimeout(settleTimer);
        stage.classList.remove('is-entering', 'is-settled');
        void stage.offsetWidth;

        if (reduced()) {
          stage.classList.add('is-settled');
          return;
        }

        stage.classList.add('is-entering');
        settleTimer = setTimeout(settle, 1800);
      }

      function onKeydown(event) {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        var key = event.key;
        if (key === 'r' || key === 'R' || key === 'Home' || ((key === 'Enter' || key === ' ') && event.target === stage)) {
          event.preventDefault();
          replay();
        }
      }

      function onVisibility() {
        stage.classList.toggle('is-paused', document.hidden);
      }

      function dispose() {
        if (disposed) return;
        disposed = true;
        clearTimeout(settleTimer);
        document.removeEventListener('keydown', onKeydown);
        document.removeEventListener('visibilitychange', onVisibility);
        if (motionQuery) {
          if (motionQuery.removeEventListener) motionQuery.removeEventListener('change', syncMotion);
          else if (motionQuery.removeListener) motionQuery.removeListener(syncMotion);
        }
      }

      document.addEventListener('keydown', onKeydown);
      document.addEventListener('visibilitychange', onVisibility);
      if (motionQuery) {
        if (motionQuery.addEventListener) motionQuery.addEventListener('change', syncMotion);
        else if (motionQuery.addListener) motionQuery.addListener(syncMotion);
      }
      window.addEventListener('pagehide', dispose, { once: true });
      syncMotion();
      replay();
      Deck.init({ index: 20, total: 27 });
    })();
  </script>
</body>
</html>
