<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --stage-w: 1600px;
      --stage-h: 900px;
    }

    #stage {
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: var(--pad-y) var(--pad-x);
      width: var(--stage-w);
      height: var(--stage-h);
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
    }

    /* 顶部标题区 */
    .header-block {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 32px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--surface-strong);
    }

    .title-group h1 {
      margin: 0;
      font-size: var(--fs-h1);
      line-height: 1.15;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .title-group p {
      margin: 8px 0 0 0;
      font-size: var(--fs-lead);
      color: var(--muted);
      line-height: 1.4;
    }

    .contrast-badge {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 18px;
      background: var(--surface);
      border: 1px solid var(--surface-strong);
      border-radius: 8px;
      font-size: var(--fs-sec);
    }

    .contrast-badge .rule-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .contrast-badge .rule-tag.fixed {
      color: var(--muted);
      text-decoration: line-through;
    }

    .contrast-badge .rule-tag.learned {
      color: var(--aggregate);
    }

    /* 主架构可视化区 */
    .arch-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--surface);
      border: 1px solid var(--surface-strong);
      border-radius: 12px;
      padding: 20px 28px 16px;
      box-sizing: border-box;
      min-height: 0;
    }

    .stage-canvas-wrap {
      flex: 1;
      position: relative;
      width: 100%;
      min-height: 0;
    }

    #arch-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 底部交互控制与解读区 */
    .controls-strip {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--surface-strong);
      display: grid;
      grid-template-columns: 360px 1fr auto;
      align-items: center;
      gap: 28px;
    }

    .explain-pane {
      min-width: 0;
    }

    .explain-title {
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--model);
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.2;
    }

    .explain-title .stage-index {
      font-family: var(--font-num);
      background: var(--surface-strong);
      color: var(--text);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: var(--fs-label);
    }

    .explain-text {
      margin-top: 6px;
      font-size: var(--fs-sec);
      color: var(--muted);
      line-height: 1.45;
    }

    .stepper-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .step-btn {
      flex: 1;
      padding: 10px 14px;
      background: var(--surface-strong);
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--muted);
      font-size: var(--fs-label);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--duration) var(--ease);
      text-align: center;
      white-space: nowrap;
    }

    .step-btn:hover {
      color: var(--text);
      background: #d8e4eb;
    }

    .step-btn.active {
      background: var(--model);
      color: #ffffff;
      border-color: var(--model);
    }

    .step-btn.active.meta {
      background: var(--aggregate);
      border-color: var(--aggregate);
    }

    .toggle-sample {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-left: 20px;
      border-left: 1px solid var(--surface-strong);
    }

    .toggle-btn {
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--muted);
      border-radius: 6px;
      color: var(--text);
      font-size: var(--fs-label);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--duration) var(--ease);
    }

    .toggle-btn:hover {
      border-color: var(--focus);
      color: var(--focus);
    }

    .toggle-btn.active {
      background: var(--surface-strong);
      border-color: var(--text);
    }

    /* 辅助微标注 */
    .legend-row {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: var(--fs-label);
      color: var(--muted);
      margin-top: 6px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
  </style>
</head>
<body data-page="21" data-total="27">
  <div id="stage">
    <header class="header-block">
      <div class="title-group">
        <h1>Stacking 两层架构：基模型输出成为元特征</h1>
        <p>基模型并非直接投票平均，而是将原始样本映射为新特征空间，由元学习器从数据中训练最优组合权重。</p>
      </div>
      <div class="contrast-badge">
        <span class="rule-tag fixed">Voting / Bagging: 固定硬规则(投票/均值)</span>
        <span style="color:var(--muted)">→</span>
        <span class="rule-tag learned">Stacking: 可学习决策规则(数据驱动)</span>
      </div>
    </header>

    <main class="arch-stage">
      <div class="stage-canvas-wrap">
        <canvas id="arch-canvas"></canvas>
      </div>

      <footer class="controls-strip">
        <div class="explain-pane">
          <div class="explain-title" id="stage-title">
            <span class="stage-index" id="stage-idx">01</span>
            <span id="stage-header-text">基模型并行预测</span>
          </div>
          <div class="explain-text" id="stage-desc">
            3 个异质基学习器接收原始特征向量 x，各自给出独立的预测概率或回归预测值。
          </div>
        </div>

        <nav class="stepper-nav" aria-label="架构层级流转步骤">
          <button class="step-btn active" data-step="0" id="btn-step-0">1. 基模型并行输出</button>
          <button class="step-btn" data-step="1" id="btn-step-1">2. 组装为元特征向量</button>
          <button class="step-btn" data-step="2" id="btn-step-2">3. 元学习器拟合决策</button>
          <button class="step-btn" data-step="3" id="btn-step-3">4. 整体前向推断流</button>
        </nav>

        <div class="toggle-sample">
          <span style="font-size:var(--fs-label); color:var(--muted)">推断样本：</span>
          <button class="toggle-btn active" id="btn-sample-a">样本 A (边界易混)</button>
          <button class="toggle-btn" id="btn-sample-b">样本 B (树模型优势)</button>
        </div>
      </footer>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('arch-canvas');
      const stageTitle = document.getElementById('stage-title');
      const stageIdx = document.getElementById('stage-idx');
      const stageHeaderText = document.getElementById('stage-header-text');
      const stageDesc = document.getElementById('stage-desc');

      const stepBtns = [
        document.getElementById('btn-step-0'),
        document.getElementById('btn-step-1'),
        document.getElementById('btn-step-2'),
        document.getElementById('btn-step-3')
      ];

      const sampleBtns = {
        A: document.getElementById('btn-sample-a'),
        B: document.getElementById('btn-sample-b')
      };

      // 样本数据：展示基模型各自判断与元学习器的集成决策
      const SAMPLES = {
        A: {
          name: '样本 A（非线性边界模糊样本）',
          rawFeatures: ['x₁ = 2.45', 'x₂ = -1.18', 'x₃ = 0.89', 'x₄ = 3.02'],
          baseOutputs: [
            { model: '基学习器 1 (RF)', val: 0.72, confidence: '高信度倾向类 1', note: '随机森林捕捉局部细分' },
            { model: '基学习器 2 (GBDT)', val: 0.68, confidence: '中高倾向类 1', note: '梯度提升关注残差梯度' },
            { model: '基学习器 3 (LR)', val: 0.41, confidence: '线性欠拟合偏向类 0', note: '逻辑回归无法切分弯曲边界' }
          ],
          metaFeatures: ['z₁ = 0.72', 'z₂ = 0.68', 'z₃ = 0.41'],
          metaLearner: {
            name: '元学习器 (Logistic Regression)',
            weights: 'w₁=1.42, w₂=1.85, w₃=0.18, b=-1.20',
            formula: 'z = 1.42·z₁ + 1.85·z₂ + 0.18·z₃ - 1.20 = 1.15',
            prob: 0.76,
            pred: '类别 1 (P = 0.76)',
            analysis: '元学习器自主学到：在该类样本上，GBDT 与 RF 可靠度远高于 LR，赋予极高权重并抑止欠拟合误差。'
          }
        },
        B: {
          name: '样本 B（具有明显轴对齐规则样本）',
          rawFeatures: ['x₁ = -0.32', 'x₂ = 4.10', 'x₃ = -2.05', 'x₄ = 0.15'],
          baseOutputs: [
            { model: '基学习器 1 (RF)', val: 0.15, confidence: '强判定为类 0', note: '树结构直接匹配规则' },
            { model: '基学习器 2 (GBDT)', val: 0.12, confidence: '强判定为类 0', note: '强收敛判定' },
            { model: '基学习器 3 (LR)', val: 0.48, confidence: '近判定边界徘徊', note: '特征未做归一化产生扰动' }
          ],
          metaFeatures: ['z₁ = 0.15', 'z₂ = 0.12', 'z₃ = 0.48'],
          metaLearner: {
            name: '元学习器 (Logistic Regression)',
            weights: 'w₁=1.42, w₂=1.85, w₃=0.18, b=-1.20',
            formula: 'z = 1.42·z₁ + 1.85·z₂ + 0.18·z₃ - 1.20 = -0.68',
            prob: 0.34,
            pred: '类别 0 (P = 0.34)',
            analysis: '元学习器降低 LR 的干扰票，以树模型的判定主导最终集成输出。'
          }
        }
      };

      const STEPS = [
        {
          idx: '01',
          title: '基模型并行预测 (Level-0)',
          desc: '初级阶段：将原始特征输入一组具有异质性（不同归纳偏置）的基学习器，各模型输出其预测标量或概率向量。',
          color: 'var(--model)'
        },
        {
          idx: '02',
          title: '组装元特征向量 (Meta-Features)',
          desc: '维度转换：将所有基模型的输出 [f₁(x), f₂(x), ..., f_K(x)] 拼装为长度为 K 的元特征向量 z，完成特征空间重构。',
          color: 'var(--sample)'
        },
        {
          idx: '03',
          title: '元学习器训练与拟合 (Level-1)',
          desc: '数据驱动：元学习器（通常为简洁稳健的模型如带正则化的逻辑回归）以 z 为输入，训练出最优判别超平面与结合权重。',
          color: 'var(--aggregate)'
        },
        {
          idx: '04',
          title: '端到端两层推断全貌 (Inference Flow)',
          desc: '整体流水线：原始输入经过基学习器阵列提炼出高阶置信特征，元学习器自动权衡不同基模型的长短板完成最终决策。',
          color: 'var(--aggregate)'
        }
      ];

      let currentStep = 0;
      let currentSampleKey = 'A';

      // 切换逻辑
      function setStep(step) {
        currentStep = step;
        stepBtns.forEach((btn, idx) => {
          btn.classList.toggle('active', idx === step);
          if (idx === step && (step === 2 || step === 3)) {
            btn.classList.add('meta');
          } else {
            btn.classList.remove('meta');
          }
        });

        const info = STEPS[step];
        stageIdx.textContent = info.idx;
        stageHeaderText.textContent = info.title;
        stageDesc.textContent = info.desc;
        stageTitle.style.color = info.color;

        draw();
      }

      function setSample(sampleKey) {
        currentSampleKey = sampleKey;
        sampleBtns.A.classList.toggle('active', sampleKey === 'A');
        sampleBtns.B.classList.toggle('active', sampleKey === 'B');
        draw();
      }

      stepBtns.forEach((btn, idx) => {
        btn.addEventListener('click', () => setStep(idx));
      });

      sampleBtns.A.addEventListener('click', () => setSample('A'));
      sampleBtns.B.addEventListener('click', () => setSample('B'));

      // 键盘快捷
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ') {
          setStep((currentStep + 1) % 4);
        } else if (e.key === 'ArrowLeft') {
          setStep((currentStep + 3) % 4);
        } else if (e.key === '1') setStep(0);
        else if (e.key === '2') setStep(1);
        else if (e.key === '3') setStep(2);
        else if (e.key === '4') setStep(3);
        else if (e.key.toLowerCase() === 'a') setSample('A');
        else if (e.key.toLowerCase() === 'b') setSample('B');
      });

      // Canvas 绘制
      function draw() {
        const ctx = Deck.fit(canvas);
        const w = canvas.width / (window.devicePixelRatio || 1);
        const h = canvas.height / (window.devicePixelRatio || 1);

        ctx.clearRect(0, 0, w, h);

        const sample = SAMPLES[currentSampleKey];

        // 颜色定义
        const colText = Deck.token('--text') || '#122634';
        const colMuted = Deck.token('--muted') || '#536A78';
        const colModel = Deck.token('--model') || '#27648F';
        const colSample = Deck.token('--sample') || '#2F7568';
        const colAgg = Deck.token('--aggregate') || '#C34B22';
        const colSurfaceStrong = Deck.token('--surface-strong') || '#E2EBF0';
        const colSurface = '#FFFFFF';

        // 架构布局四列基准 X 坐标
        // 1: 原始输入样本 (x=70, w=200)
        // 2: Level-0 基模型 (x=360, w=250)
        // 3: Level-1 元特征矩阵/向量 (x=710, w=220)
        // 4: Level-1 元学习器与最终输出 (x=1030, w=380)

        const col1X = 50;
        const col1W = 210;

        const col2X = 350;
        const col2W = 270;

        const col3X = 715;
        const col3W = 230;

        const col4X = 1030;
        const col4W = 410;

        // 辅助绘制圆角矩形卡片
        function drawCard(x, y, cw, ch, bg, stroke, radius = 8) {
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(x, y, cw, ch, radius);
          } else {
            Deck.rr(ctx, x, y, cw, ch, radius);
          }
          ctx.fillStyle = bg;
          ctx.fill();
          if (stroke) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
        }

        // 辅助绘制平滑连接弯线
        function drawCurveLine(x1, y1, x2, y2, color, active, dash = false) {
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          const cpX1 = x1 + (x2 - x1) * 0.45;
          const cpX2 = x1 + (x2 - x1) * 0.55;
          ctx.bezierCurveTo(cpX1, y1, cpX2, y2, x2, y2);
          ctx.strokeStyle = color;
          ctx.lineWidth = active ? 2.4 : 1.2;
          if (dash) {
            ctx.setLineDash([4, 4]);
          } else {
            ctx.setLineDash([]);
          }
          ctx.stroke();
          ctx.setLineDash([]);

          // 终点箭头
          if (active) {
            const angle = Math.atan2(y2 - y1, x2 - cpX2);
            ctx.save();
            ctx.translate(x2, y2);
            ctx.rotate(angle);
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-7, -4);
            ctx.lineTo(-7, 4);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
        }

        // 辅助绘制段落标题标签
        function drawColumnHeader(x, title, subtitle, color) {
          ctx.fillStyle = color;
          ctx.font = '700 17px "Noto Sans SC", sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(title, x, 34);

          ctx.fillStyle = colMuted;
          ctx.font = '13.5px "Noto Sans SC", sans-serif';
          ctx.fillText(subtitle, x, 56);
        }

        // 1. 列标题
        drawColumnHeader(col1X, '原始输入数据 (D)', '维度 d=4 的特征空间', colSample);
        drawColumnHeader(col2X, 'Level-0 基学习器集合', '多样化异质模型并行推断', colModel);
        drawColumnHeader(col3X, '元特征向量 (Meta-Features)', '预测结果重构成新输入', colSample);
        drawColumnHeader(col4X, 'Level-1 元学习器与集成预测', '数据驱动学习最优组合规则', colAgg);

        // 2. 第一列：原始输入样本卡片
        const inputY = 90;
        const inputH = 340;
        drawCard(col1X, inputY, col1W, inputH, colSurface, colSurfaceStrong);

        ctx.fillStyle = colSample;
        ctx.font = '700 15px "Noto Sans SC", sans-serif';
        ctx.fillText('输入样本 x', col1X + 16, inputY + 30);

        ctx.fillStyle = colMuted;
        ctx.font = '13px "Noto Sans SC", sans-serif';
        ctx.fillText(currentSampleKey === 'A' ? '【样本 A：模糊边界】' : '【样本 B：规则清晰】', col1X + 16, inputY + 54);

        // 特征条目
        sample.rawFeatures.forEach((feat, idx) => {
          const fy = inputY + 84 + idx * 48;
          drawCard(col1X + 14, fy, col1W - 28, 38, colSurfaceStrong, null, 6);
          ctx.fillStyle = colText;
          ctx.font = '600 15px monospace';
          ctx.fillText(feat, col1X + 26, fy + 24);
        });

        ctx.fillStyle = colMuted;
        ctx.font = '13px "Noto Sans SC", sans-serif';
        ctx.fillText('直接输入基模型', col1X + 16, inputY + 296);
        ctx.fillText('无需人工设计权重', col1X + 16, inputY + 316);

        // 3. 第二列：Level-0 三个基模型卡片
        const modelYStart = 90;
        const modelH = 100;
        const modelGap = 20;
        const modelCenters = [];

        sample.baseOutputs.forEach((item, idx) => {
          const my = modelYStart + idx * (modelH + modelGap);
          modelCenters.push({ x: col2X + col2W, y: my + modelH / 2, inX: col2X, inY: my + modelH / 2 });

          const isHighlight = (currentStep === 0 || currentStep === 3);
          const borderCol = isHighlight ? colModel : colSurfaceStrong;
          const bgCol = isHighlight ? '#F5F9FC' : colSurface;

          drawCard(col2X, my, col2W, modelH, bgCol, borderCol);

          // 连线：输入样本 -> 基模型输入
          const lineCol = isHighlight ? colModel : '#C4D6E0';
          drawCurveLine(col1X + col1W, inputY + 95 + idx * 75, col2X, my + modelH / 2, lineCol, isHighlight);

          // 基模型标题
          ctx.fillStyle = isHighlight ? colModel : colText;
          ctx.font = '700 15px "Noto Sans SC", sans-serif';
          ctx.fillText(item.model, col2X + 16, my + 28);

          // 预测输出值
          ctx.fillStyle = isHighlight ? colAgg : colMuted;
          ctx.font = '700 16px monospace';
          ctx.fillText(`预测概率: ${item.val.toFixed(2)}`, col2X + 16, my + 54);

          // 模型说明
          ctx.fillStyle = colMuted;
          ctx.font = '12px "Noto Sans SC", sans-serif';
          ctx.fillText(item.note, col2X + 16, my + 78);
        });

        // 4. 第三列：元特征空间 (Meta-Feature Space)
        const metaY = 90;
        const metaH = 340;
        const isMetaStep = (currentStep === 1 || currentStep === 3);
        const metaBg = isMetaStep ? '#F2F8F6' : colSurface;
        const metaBorder = isMetaStep ? colSample : colSurfaceStrong;

        drawCard(col3X, metaY, col3W, metaH, metaBg, metaBorder);

        ctx.fillStyle = colSample;
        ctx.font = '700 15px "Noto Sans SC", sans-serif';
        ctx.fillText('元特征向量 z = [z₁, z₂, z₃]', col3X + 16, metaY + 30);

        ctx.fillStyle = colMuted;
        ctx.font = '13px "Noto Sans SC", sans-serif';
        ctx.fillText('各模型预测值成为新特征', col3X + 16, metaY + 52);

        // 各分量卡片与连线
        sample.metaFeatures.forEach((mf, idx) => {
          const mfy = metaY + 76 + idx * 62;
          const valHl = (currentStep >= 1);
          drawCard(col3X + 14, mfy, col3W - 28, 48, colSurface, valHl ? colSample : colSurfaceStrong, 6);

          ctx.fillStyle = colText;
          ctx.font = '700 15px monospace';
          ctx.fillText(mf, col3X + 26, mfy + 24);

          ctx.fillStyle = colMuted;
          ctx.font = '12px "Noto Sans SC", sans-serif';
          ctx.fillText(`← 来自 ${sample.baseOutputs[idx].model.split(' ')[0]} 输出`, col3X + 26, mfy + 40);

          // 连线：基模型输出 -> 元特征槽位
          const connCol = valHl ? colSample : '#D0DFD9';
          drawCurveLine(modelCenters[idx].x, modelCenters[idx].y, col3X + 14, mfy + 24, connCol, valHl);
        });

        // 底部公式小注
        ctx.fillStyle = colMuted;
        ctx.font = '13px monospace';
        ctx.fillText('z = [f₁(x), f₂(x), f₃(x)]', col3X + 16, metaY + 288);
        ctx.font = '12px "Noto Sans SC", sans-serif';
        ctx.fillText('原始 d 维空间被压缩至 K 维', col3X + 16, metaY + 312);

        // 5. 第四列：Level-1 元学习器与决策输出
        const isLearnStep = (currentStep === 2 || currentStep === 3);
        const l1Bg = isLearnStep ? '#FFF8F4' : colSurface;
        const l1Border = isLearnStep ? colAgg : colSurfaceStrong;

        drawCard(col4X, metaY, col4W, metaH, l1Bg, l1Border);

        // 连线：元特征向量 -> Level-1 元学习器
        sample.metaFeatures.forEach((_, idx) => {
          const mfy = metaY + 76 + idx * 62 + 24;
          const connCol = isLearnStep ? colAgg : '#ECD6CE';
          drawCurveLine(col3X + col3W, mfy, col4X, metaY + 80 + idx * 40, connCol, isLearnStep);
        });

        ctx.fillStyle = colAgg;
        ctx.font = '700 16px "Noto Sans SC", sans-serif';
        ctx.fillText('Level-1 元学习器 (Meta-Learner)', col4X + 18, metaY + 30);

        ctx.fillStyle = colMuted;
        ctx.font = '13px "Noto Sans SC", sans-serif';
        ctx.fillText(sample.metaLearner.name, col4X + 18, metaY + 52);

        // 训练学得的权重分布
        drawCard(col4X + 14, metaY + 70, col4W - 28, 54, colSurface, isLearnStep ? colAgg : colSurfaceStrong, 6);
        ctx.fillStyle = colMuted;
        ctx.font = '12px "Noto Sans SC", sans-serif';
        ctx.fillText('数据拟合得到的最优线性组合参数：', col4X + 24, metaY + 88);
        ctx.fillStyle = colText;
        ctx.font = '700 14px monospace';
        ctx.fillText(sample.metaLearner.weights, col4X + 24, metaY + 110);

        // 实际计算式
        drawCard(col4X + 14, metaY + 134, col4W - 28, 52, colSurface, isLearnStep ? colAgg : colSurfaceStrong, 6);
        ctx.fillStyle = colMuted;
        ctx.font = '12px "Noto Sans SC", sans-serif';
        ctx.fillText('对元特征的加权线性决策流：', col4X + 24, metaY + 152);
        ctx.fillStyle = colAgg;
        ctx.font = '600 13px monospace';
        ctx.fillText(sample.metaLearner.formula, col4X + 24, metaY + 172);

        // 最终综合决策结果
        drawCard(col4X + 14, metaY + 196, col4W - 28, 58, isLearnStep ? '#FAF0EB' : colSurfaceStrong, colAgg, 6);
        ctx.fillStyle = colMuted;
        ctx.font = '12px "Noto Sans SC", sans-serif';
        ctx.fillText('终极集成判决结果 ŷ = σ(z)：', col4X + 24, metaY + 214);
        ctx.fillStyle = colAgg;
        ctx.font = '800 18px "Noto Sans SC", sans-serif';
        ctx.fillText(sample.metaLearner.pred, col4X + 24, metaY + 240);

        // 教学对比分析条
        ctx.fillStyle = colText;
        ctx.font = '700 13.5px "Noto Sans SC", sans-serif';
        const analysisLines = currentSampleKey === 'A'
          ? ['在该类样本上，GBDT 与 RF 可靠度远高于 LR，', '元学习器赋予其高权重并抑止欠拟合误差。']
          : ['元学习器降低 LR 的干扰权重，', '以两颗树模型的强置信度主导最终集成判定。'];
        ctx.fillText('机制洞察：', col4X + 18, metaY + 278);
        ctx.fillStyle = colMuted;
        ctx.font = '12.5px "Noto Sans SC", sans-serif';
        ctx.fillText(analysisLines[0], col4X + 18, metaY + 300);
        ctx.fillText(analysisLines[1], col4X + 18, metaY + 320);

        // 6. 底部流程状态总结带
        ctx.fillStyle = colMuted;
        ctx.font = '13px "Noto Sans SC", sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('当前状态：' + STEPS[currentStep].title, w - 24, h - 8);
      }

      // 初始化与自适应重绘
      Deck.init({ title: 'Stacking 的两层结构', keys: false });
      Deck.autofit(canvas, draw);

      setStep(0);
    })();
  </script>
</body>
</html>
