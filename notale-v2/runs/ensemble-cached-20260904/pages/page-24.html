<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
      --font-display: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, serif;
    }

    #stage {
      isolation: isolate;
      position: relative;
      width: 1600px;
      height: 900px;
      padding: var(--pad-y) var(--pad-x);
      overflow: hidden;
      background: radial-gradient(1100px 700px at 75% 52%, #e6f0f5 0%, var(--bg) 68%, #e4ecf1 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
    }

    /* 纸张与坐标系网格背景质感 */
    .field-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .45;
      background-image:
        linear-gradient(to right, rgba(83, 106, 120, .08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(83, 106, 120, .08) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 950px 650px at 70% 50%, #000 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 950px 650px at 70% 50%, #000 30%, transparent 80%);
    }

    /* 左侧排版区 */
    .cover-copy {
      position: relative;
      z-index: 5;
      max-width: 460px;
      margin-top: 80px;
      margin-left: 36px;
      pointer-events: none;
    }

    .chapter-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: var(--fs-label);
      font-weight: 600;
      letter-spacing: .18em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .chapter-mark::before {
      content: "";
      width: 32px;
      height: 2px;
      background: var(--aggregate);
    }

    .cover-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 72px;
      line-height: 1.15;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -.03em;
    }

    .cover-title .title-accent {
      color: var(--aggregate);
      display: inline-block;
    }

    .cover-desc {
      margin-top: 32px;
      font-size: var(--fs-lead);
      line-height: 1.68;
      color: var(--muted);
      max-width: 440px;
    }

    .cover-desc strong {
      color: var(--text);
      font-weight: 600;
    }

    /* 底部收束线索 */
    .cover-footer {
      position: relative;
      z-index: 5;
      margin-left: 24px;
      margin-bottom: 36px;
      display: flex;
      align-items: center;
      gap: 32px;
      font-size: var(--fs-sec);
      color: var(--muted);
    }

    .footer-stream {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-stream .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot.bagging { background: var(--model); }
    .dot.boosting { background: var(--sample); }
    .dot.stacking { background: var(--aggregate); }

    /* 右侧主视觉图 SVG 容器 */
    .convergence-scene {
      position: absolute;
      top: 0;
      right: 0;
      width: 1600px;
      height: 900px;
      z-index: 2;
      pointer-events: none;
    }

    /* 运动与动画 */
    .stream-line {
      stroke-dasharray: 8 6;
      animation: flow-dash 24s linear infinite;
    }

    .stream-line.fast {
      animation-duration: 18s;
    }

    @keyframes flow-dash {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -280; }
    }

    /* 入场动画 */
    .is-entering .cover-copy {
      animation: enter-up 900ms cubic-bezier(.16, 1, .3, 1) both;
    }
    .is-entering .convergence-scene {
      animation: enter-fade 1200ms cubic-bezier(.16, 1, .3, 1) both;
    }

    @keyframes enter-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes enter-fade {
      from { opacity: 0; transform: scale(.98); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .stream-line { animation: none !important; }
      .is-entering .cover-copy,
      .is-entering .convergence-scene {
        animation: none !important;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body data-page="24" data-total="27">
  <div id="stage">
    <div class="field-grid" aria-hidden="true"></div>

    <header class="cover-copy">
      <div class="chapter-mark">第五部分 · 决策体系评估</div>
      <h1 class="cover-title">
        方法选择<br>与<span class="title-accent">收束</span>
      </h1>
      <p class="cover-desc">
        从<strong>降低方差</strong>的 Bagging、<strong>纠正偏差</strong>的 Boosting 到<strong>异质融合</strong>的 Stacking：洞悉三大架构的适用边界与成本权衡，完成稳健判断的最终闭环。
      </p>
    </header>

    <div class="cover-footer" aria-hidden="true">
      <div class="footer-stream"><span class="dot bagging"></span>并行扰动 (Bagging)</div>
      <div class="footer-stream"><span class="dot boosting"></span>时序迭代 (Boosting)</div>
      <div class="footer-stream"><span class="dot stacking"></span>多层学习 (Stacking)</div>
    </div>

    <!-- 右侧汇聚图解矢量 -->
    <svg class="convergence-scene" viewBox="0 0 1600 900" role="img" aria-label="三大集成范式汇聚于最终决策边界的结构几何图">
      <defs>
        <!-- 渐变定义 -->
        <linearGradient id="grad-bagging" x1="680" y1="170" x2="1140" y2="450" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#27648F" stop-opacity=".15" />
          <stop offset="70%" stop-color="#27648F" stop-opacity=".85" />
          <stop offset="100%" stop-color="#27648F" />
        </linearGradient>

        <linearGradient id="grad-boosting" x1="660" y1="450" x2="1140" y2="450" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#2F7568" stop-opacity=".15" />
          <stop offset="70%" stop-color="#2F7568" stop-opacity=".85" />
          <stop offset="100%" stop-color="#2F7568" />
        </linearGradient>

        <linearGradient id="grad-stacking" x1="680" y1="730" x2="1140" y2="450" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#C34B22" stop-opacity=".15" />
          <stop offset="70%" stop-color="#C34B22" stop-opacity=".85" />
          <stop offset="100%" stop-color="#C34B22" />
        </linearGradient>

        <linearGradient id="core-glow" x1="1100" y1="450" x2="1480" y2="450" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#C34B22" stop-opacity=".95" />
          <stop offset="35%" stop-color="#27648F" stop-opacity=".85" />
          <stop offset="100%" stop-color="#122634" stop-opacity=".9" />
        </linearGradient>

        <!-- 聚合焦点光晕 -->
        <radialGradient id="focus-radial" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
          <stop offset="30%" stop-color="#E2EBF0" stop-opacity=".8" />
          <stop offset="65%" stop-color="#C34B22" stop-opacity=".2" />
          <stop offset="100%" stop-color="#C34B22" stop-opacity="0" />
        </radialGradient>

        <!-- 最终决策面微网格 -->
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="8" stdDeviation="12" flood-color="#122634" flood-opacity=".08" />
        </filter>
      </defs>

      <!-- 导向与基准线 -->
      <g stroke="#536A78" stroke-opacity=".16" stroke-width="1" fill="none">
        <circle cx="1140" cy="450" r="120" stroke-dasharray="4 4" />
        <circle cx="1140" cy="450" r="220" stroke-dasharray="4 4" />
        <circle cx="1140" cy="450" r="320" stroke-dasharray="4 4" />
        <line x1="620" y1="450" x2="1520" y2="450" stroke-dasharray="2 6" />
        <line x1="1140" y1="120" x2="1140" y2="780" stroke-dasharray="2 6" />
      </g>

      <!-- ====== 支流 1: Bagging (并行平滑多样性) ====== -->
      <g class="stream-group bagging-stream">
        <!-- 3条并行分流线汇入 -->
        <path d="M 690 140 C 850 140, 970 280, 1140 450" fill="none" stroke="#27648F" stroke-opacity=".2" stroke-width="2" />
        <path d="M 690 190 C 860 190, 980 320, 1140 450" fill="none" stroke="url(#grad-bagging)" stroke-width="4.5" />
        <path class="stream-line" d="M 690 190 C 860 190, 980 320, 1140 450" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="2" />
        <path d="M 690 240 C 870 240, 1000 360, 1140 450" fill="none" stroke="#27648F" stroke-opacity=".3" stroke-width="2.5" />

        <!-- 来源节点 (Bootstrap 树采样) -->
        <g transform="translate(690, 190)">
          <rect x="-130" y="-34" width="130" height="68" rx="8" fill="#FFFFFF" stroke="#27648F" stroke-width="1.5" filter="url(#soft-shadow)" />
          <text x="-65" y="-6" text-anchor="middle" font-size="14" font-weight="700" fill="#27648F" letter-spacing="1">BAGGING</text>
          <text x="-65" y="16" text-anchor="middle" font-size="12" fill="#536A78">重采样平滑方差</text>
          <circle cx="0" cy="0" r="5" fill="#27648F" />
        </g>
      </g>

      <!-- ====== 支流 2: Boosting (时序渐进纠错) ====== -->
      <g class="stream-group boosting-stream">
        <!-- 主时序修正轴线 -->
        <path d="M 690 450 L 1140 450" fill="none" stroke="url(#grad-boosting)" stroke-width="5" />
        <path class="stream-line fast" d="M 690 450 L 1140 450" fill="none" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="2.2" />

        <!-- 逐步迭代的残差修正阶梯点 -->
        <circle cx="790" cy="450" r="4" fill="#2F7568" />
        <circle cx="890" cy="450" r="5" fill="#2F7568" />
        <circle cx="990" cy="450" r="6" fill="#2F7568" />

        <g transform="translate(690, 450)">
          <rect x="-130" y="-34" width="130" height="68" rx="8" fill="#FFFFFF" stroke="#2F7568" stroke-width="1.5" filter="url(#soft-shadow)" />
          <text x="-65" y="-6" text-anchor="middle" font-size="14" font-weight="700" fill="#2F7568" letter-spacing="1">BOOSTING</text>
          <text x="-65" y="16" text-anchor="middle" font-size="12" fill="#536A78">前向序列纠偏</text>
          <circle cx="0" cy="0" r="5" fill="#2F7568" />
        </g>
      </g>

      <!-- ====== 支流 3: Stacking (元学习分层融合) ====== -->
      <g class="stream-group stacking-stream">
        <!-- 分层网状路径汇入 -->
        <path d="M 690 660 C 870 660, 1000 540, 1140 450" fill="none" stroke="#C34B22" stroke-opacity=".3" stroke-width="2.5" />
        <path d="M 690 710 C 860 710, 980 580, 1140 450" fill="none" stroke="url(#grad-stacking)" stroke-width="4.5" />
        <path class="stream-line" d="M 690 710 C 860 710, 980 580, 1140 450" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="2" />
        <path d="M 690 760 C 850 760, 970 620, 1140 450" fill="none" stroke="#C34B22" stroke-opacity=".2" stroke-width="2" />

        <g transform="translate(690, 710)">
          <rect x="-130" y="-34" width="130" height="68" rx="8" fill="#FFFFFF" stroke="#C34B22" stroke-width="1.5" filter="url(#soft-shadow)" />
          <text x="-65" y="-6" text-anchor="middle" font-size="14" font-weight="700" fill="#C34B22" letter-spacing="1">STACKING</text>
          <text x="-65" y="16" text-anchor="middle" font-size="12" fill="#536A78">元学习异质互补</text>
          <circle cx="0" cy="0" r="5" fill="#C34B22" />
        </g>
      </g>

      <!-- ====== 核心汇聚节点 (Ensemble Synthesis Lens) ====== -->
      <g transform="translate(1140, 450)">
        <!-- 汇聚焦点光环 -->
        <circle cx="0" cy="0" r="48" fill="url(#focus-radial)" />
        <circle cx="0" cy="0" r="32" fill="#FFFFFF" stroke="#122634" stroke-width="2.5" filter="url(#soft-shadow)" />

        <!-- 聚合标志图标 (三线汇聚一核) -->
        <path d="M -16 -12 L 0 0 M -18 0 L 0 0 M -16 12 L 0 0 M 0 0 L 16 0" stroke="#C34B22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="0" cy="0" r="4" fill="#C34B22" />

        <!-- 聚合度量标签 -->
        <rect x="-56" y="44" width="112" height="24" rx="12" fill="#FFFFFF" stroke="#536A78" stroke-width="1" stroke-opacity=".3" />
        <text x="0" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#122634" letter-spacing=".5">OPTIMAL BOUNDARY</text>
      </g>

      <!-- ====== 汇聚后的统一决策投射区 (Payoff: 稳健最终预测) ====== -->
      <g class="payoff-structure">
        <!-- 强聚束光束伸向右侧并展开为精确决策几何 -->
        <path d="M 1172 450 L 1460 450" stroke="url(#core-glow)" stroke-width="6" stroke-linecap="round" />
        <path class="stream-line fast" d="M 1172 450 L 1460 450" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

        <!-- 最终裁决面板/决策界面示意 -->
        <g transform="translate(1360, 450)">
          <!-- 象征分类边界与极高泛化性的正交图景 -->
          <rect x="-10" y="-120" width="150" height="240" rx="12" fill="#FFFFFF" fill-opacity=".88" stroke="#122634" stroke-width="1.8" filter="url(#soft-shadow)" />

          <!-- 面板内部精细图表结构 -->
          <line x1="8" y1="-100" x2="122" y2="-100" stroke="#E2EBF0" stroke-width="2" />
          <text x="65" y="-78" text-anchor="middle" font-size="12" font-weight="700" fill="#122634">泛化稳健解</text>
          
          <!-- 模拟精准收敛的ROC / 边界曲线 -->
          <path d="M 12 50 C 30 50, 45 -20, 75 -40 C 95 -52, 110 -58, 128 -60" fill="none" stroke="#237052" stroke-width="2.5" stroke-linecap="round" />
          <path d="M 12 50 L 128 -60" fill="none" stroke="#536A78" stroke-width="1" stroke-dasharray="3 3" stroke-opacity=".4" />

          <!-- 评价指标读数 -->
          <g transform="translate(20, 80)">
            <text x="0" y="0" font-size="11" fill="#536A78">方差控制</text>
            <text x="75" y="0" font-size="12" font-weight="700" fill="#27648F">Low</text>
            <text x="0" y="20" font-size="11" fill="#536A78">偏差削减</text>
            <text x="75" y="20" font-size="12" font-weight="700" fill="#2F7568">High</text>
          </g>
        </g>
      </g>
    </svg>
  </div>

  <script src="assets/base.js"></script>
  <script>
    (function () {
      'use strict';
      var stage = document.getElementById('stage');
      Deck.init({ index: 24, total: 27, keys: false });

      function initAnimation() {
        if (Deck.reduced()) {
          stage.classList.add('is-settled');
        } else {
          stage.classList.add('is-entering');
          setTimeout(function() {
            stage.classList.remove('is-entering');
            stage.classList.add('is-settled');
          }, 1400);
        }
      }

      window.addEventListener('DOMContentLoaded', initAnimation);
    })();
  </script>
</body>
</html>
