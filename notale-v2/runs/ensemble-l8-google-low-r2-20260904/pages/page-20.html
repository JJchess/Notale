<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --font-display: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, serif;
      --ease-out: cubic-bezier(.16, 1, .3, 1);
    }

    body {
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      background: radial-gradient(circle at 74% 52%, rgba(226, 235, 240, 0.72) 0%, rgba(242, 246, 248, 0.95) 58%, var(--bg) 100%);
      isolation: isolate;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 装饰与空间场 */
    .bg-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.35;
      background-image:
        linear-gradient(to right, rgba(83, 106, 120, 0.1) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(83, 106, 120, 0.1) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(circle at 65% 50%, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(circle at 65% 50%, black 30%, transparent 75%);
    }

    /* 文本排版区 */
    .cover-header {
      position: relative;
      z-index: 10;
      max-width: 520px;
      margin-top: 140px;
      margin-left: 56px;
      pointer-events: none;
    }

    .chapter-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-label);
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .chapter-tag::before {
      content: "";
      display: inline-block;
      width: 24px;
      height: 2px;
      background: var(--aggregate);
    }

    .cover-title {
      font-size: 82px;
      line-height: 1.05;
      font-family: var(--font-sans);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
      margin: 0 0 24px 0;
    }

    .cover-title .highlight {
      color: var(--model);
    }

    .cover-subtitle {
      font-size: 24px;
      line-height: 1.5;
      font-weight: 500;
      color: var(--muted);
      margin: 0;
      max-width: 460px;
    }

    .cover-footnote {
      position: relative;
      z-index: 10;
      margin-left: 56px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 36px;
      color: var(--muted);
      font-size: var(--fs-sec);
      font-variant-numeric: tabular-nums;
    }

    .footnote-item {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .footnote-item .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--model);
    }
    .footnote-item .dot.agg {
      background: var(--aggregate);
    }

    /* 主视觉 SVG 区域 */
    .scene-svg {
      position: absolute;
      inset: 0;
      width: 1600px;
      height: 900px;
      z-index: 5;
      pointer-events: none;
    }

    /* 棱镜折射与汇聚光束动画 */
    .ray-in-1, .ray-in-2, .ray-in-3, .ray-out {
      stroke-dasharray: 600;
      stroke-dashoffset: 0;
    }

    .is-entering .ray-in-1 { animation: ray-draw 1.1s var(--ease-out) both; }
    .is-entering .ray-in-2 { animation: ray-draw 1.25s 0.1s var(--ease-out) both; }
    .is-entering .ray-in-3 { animation: ray-draw 1.4s 0.2s var(--ease-out) both; }
    .is-entering .ray-out  { animation: ray-draw 1.3s 0.4s var(--ease-out) both; }

    .is-entering .prism-core {
      animation: prism-scale 1.3s var(--ease-out) both;
      transform-origin: 1040px 450px;
    }

    .is-entering .cover-header {
      animation: header-fade 1.1s var(--ease-out) both;
    }

    @keyframes ray-draw {
      from { stroke-dashoffset: 600; opacity: 0.2; }
      to { stroke-dashoffset: 0; opacity: 1; }
    }

    @keyframes prism-scale {
      from { transform: scale(0.92) rotate(-2deg); opacity: 0.6; }
      to { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes header-fade {
      from { transform: translateY(18px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .is-entering .ray-in-1,
      .is-entering .ray-in-2,
      .is-entering .ray-in-3,
      .is-entering .ray-out,
      .is-entering .prism-core,
      .is-entering .cover-header {
        animation: none !important;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body data-page="20" data-total="27">
  <div id="stage" class="is-entering" tabindex="0" aria-label="Stacking：学习如何组合模型">
    <div class="bg-grid" aria-hidden="true"></div>

    <header class="cover-header">
      <div class="chapter-tag">第 4 模块 · 堆叠集成</div>
      <h1 class="cover-title">Stacking<br><span class="highlight">学习如何组合</span></h1>
      <p class="cover-subtitle">打破固定规则权重，让元学习器自主学会如何裁决多元基模型的异质输出</p>
    </header>

    <footer class="cover-footnote" aria-hidden="true">
      <div class="footnote-item">
        <span class="dot"></span>
        <span>初层基学习器预测流</span>
      </div>
      <div class="footnote-item">
        <span class="dot agg"></span>
        <span>元学习器重构输出</span>
      </div>
    </footer>

    <!-- 构图载体：异质模型输出汇聚至元学习器“透镜/棱镜”进行学习重构 -->
    <svg class="scene-svg" viewBox="0 0 1600 900" aria-hidden="true">
      <defs>
        <!-- 渐变光流 -->
        <linearGradient id="grad-ray1" x1="680" y1="230" x2="1040" y2="450" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="var(--model)" stop-opacity="0.1"/>
          <stop offset="60%" stop-color="var(--model)" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="var(--model)" stop-opacity="0.95"/>
        </linearGradient>
        <linearGradient id="grad-ray2" x1="640" y1="450" x2="1040" y2="450" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="var(--sample)" stop-opacity="0.1"/>
          <stop offset="60%" stop-color="var(--sample)" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="var(--sample)" stop-opacity="0.95"/>
        </linearGradient>
        <linearGradient id="grad-ray3" x1="680" y1="670" x2="1040" y2="450" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="var(--model)" stop-opacity="0.1"/>
          <stop offset="60%" stop-color="var(--model)" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="var(--model)" stop-opacity="0.95"/>
        </linearGradient>
        <linearGradient id="grad-out" x1="1040" y1="450" x2="1520" y2="450" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="var(--aggregate)" stop-opacity="0.95"/>
          <stop offset="50%" stop-color="var(--aggregate)" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="var(--aggregate)" stop-opacity="0.1"/>
        </linearGradient>

        <!-- 元学习器棱镜微光与渐变填充 -->
        <linearGradient id="prism-surface" x1="940" y1="280" x2="1140" y2="620" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
          <stop offset="45%" stop-color="#f8fafb" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="var(--surface-strong)" stop-opacity="0.9"/>
        </linearGradient>

        <linearGradient id="prism-facet-right" x1="1040" y1="280" x2="1160" y2="520" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#d4e2ea" stop-opacity="0.4"/>
        </linearGradient>

        <!-- 阴影与柔焦滤镜 -->
        <filter id="prism-shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="12" dy="24" stdDeviation="28" flood-color="#122634" flood-opacity="0.12"/>
          <feDropShadow dx="2" dy="6" stdDeviation="8" flood-color="#122634" flood-opacity="0.06"/>
        </filter>

        <filter id="beam-glow" x="-20%" y="-100%" width="140%" height="300%">
          <feGaussianBlur stdDeviation="7" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- 坐标参考辅助线 -->
      <g stroke="var(--muted)" stroke-opacity="0.15" stroke-dasharray="3 4">
        <line x1="720" y1="120" x2="720" y2="780"/>
        <line x1="1060" y1="140" x2="1060" y2="760"/>
        <line x1="1380" y1="200" x2="1380" y2="700"/>
      </g>

      <!-- 阶段 0: 基模型节点 (Layer 0: Base Learners) -->
      <!-- 节点 1: Random Forest / Tree -->
      <g transform="translate(720, 230)">
        <circle r="36" fill="var(--surface)" stroke="var(--model)" stroke-width="2"/>
        <circle r="6" fill="var(--model)"/>
        <!-- 刻画技术形态小符号 -->
        <path d="M-14 10 L0 -12 L14 10 Z" fill="none" stroke="var(--model)" stroke-width="2" stroke-linejoin="round"/>
        <text x="52" y="-6" font-size="15" font-family="var(--font-sans)" font-weight="700" fill="var(--text)">Tree / RF</text>
        <text x="52" y="16" font-size="13" font-family="var(--font-num)" fill="var(--muted)">ŷ₁ = 0.82</text>
      </g>

      <!-- 节点 2: GBDT / Boost -->
      <g transform="translate(680, 450)">
        <circle r="36" fill="var(--surface)" stroke="var(--sample)" stroke-width="2"/>
        <circle r="6" fill="var(--sample)"/>
        <!-- 阶梯符号 -->
        <path d="M-12 10 L-2 2 L6 2 L14 -8" fill="none" stroke="var(--sample)" stroke-width="2.2" stroke-linecap="round"/>
        <text x="52" y="-6" font-size="15" font-family="var(--font-sans)" font-weight="700" fill="var(--text)">Gradient Boost</text>
        <text x="52" y="16" font-size="13" font-family="var(--font-num)" fill="var(--muted)">ŷ₂ = 0.74</text>
      </g>

      <!-- 节点 3: Linear / Neural -->
      <g transform="translate(720, 670)">
        <circle r="36" fill="var(--surface)" stroke="var(--model)" stroke-width="2"/>
        <circle r="6" fill="var(--model)"/>
        <!-- Sigmoid 曲线 -->
        <path d="M-12 10 Q0 10 0 0 Q0 -10 12 -10" fill="none" stroke="var(--model)" stroke-width="2" stroke-linecap="round"/>
        <text x="52" y="-6" font-size="15" font-family="var(--font-sans)" font-weight="700" fill="var(--text)">Linear / SVM</text>
        <text x="52" y="16" font-size="13" font-family="var(--font-num)" fill="var(--muted)">ŷ₃ = 0.69</text>
      </g>

      <!-- 汇聚光束通道 -->
      <g fill="none" stroke-linecap="round">
        <!-- 光晕厚线 -->
        <path class="ray-in-1" d="M756 230 C860 230 940 380 1030 436" stroke="url(#grad-ray1)" stroke-width="14" opacity="0.3" filter="url(#beam-glow)"/>
        <path class="ray-in-1" d="M756 230 C860 230 940 380 1030 436" stroke="url(#grad-ray1)" stroke-width="3.5"/>

        <path class="ray-in-2" d="M716 450 L1020 450" stroke="url(#grad-ray2)" stroke-width="14" opacity="0.3" filter="url(#beam-glow)"/>
        <path class="ray-in-2" d="M716 450 L1020 450" stroke="url(#grad-ray2)" stroke-width="3.5"/>

        <path class="ray-in-3" d="M756 670 C860 670 940 520 1030 464" stroke="url(#grad-ray3)" stroke-width="14" opacity="0.3" filter="url(#beam-glow)"/>
        <path class="ray-in-3" d="M756 670 C860 670 940 520 1030 464" stroke="url(#grad-ray3)" stroke-width="3.5"/>
      </g>

      <!-- 主角：元学习器菱形棱镜 (Layer 1: Meta-Learner) -->
      <g class="prism-core" filter="url(#prism-shadow)">
        <!-- 棱镜背面深度 -->
        <polygon points="1060,260 1170,440 1060,640 950,460" fill="url(#prism-surface)" stroke="#b8cbd8" stroke-width="2"/>
        <polygon points="1060,260 1170,440 1060,640 1060,450" fill="url(#prism-facet-right)"/>

        <!-- 内部折射特征汇聚核 -->
        <ellipse cx="1060" cy="450" rx="32" ry="46" fill="none" stroke="var(--aggregate)" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.7"/>
        <circle cx="1060" cy="450" r="14" fill="var(--surface)" stroke="var(--aggregate)" stroke-width="3"/>
        <circle cx="1060" cy="450" r="5" fill="var(--aggregate)"/>

        <!-- 棱镜轮廓锐边高光 -->
        <line x1="1060" y1="260" x2="1060" y2="640" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
        <line x1="950" y1="460" x2="1060" y2="450" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
        <line x1="1060" y1="450" x2="1170" y2="440" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>

        <!-- 标注元学习器身份 -->
        <text x="1060" y="226" font-size="18" font-family="var(--font-sans)" font-weight="700" fill="var(--text)" text-anchor="middle" letter-spacing="0.05em">Meta-Learner</text>
        <text x="1060" y="246" font-size="13" font-family="var(--font-sans)" font-weight="500" fill="var(--muted)" text-anchor="middle">第二层元学习器</text>
      </g>

      <!-- 阶段 2: 出射聚合判断 (Payoff) -->
      <g fill="none" stroke-linecap="round">
        <path class="ray-out" d="M1090 450 L1440 450" stroke="url(#grad-out)" stroke-width="24" opacity="0.25" filter="url(#beam-glow)"/>
        <path class="ray-out" d="M1090 450 L1440 450" stroke="url(#grad-out)" stroke-width="4.5"/>
      </g>

      <!-- 终点预测汇聚点与指示 -->
      <g transform="translate(1420, 450)">
        <circle r="42" fill="var(--surface)" stroke="var(--aggregate)" stroke-width="2.5"/>
        <circle r="8" fill="var(--aggregate)"/>
        <text x="64" y="-12" font-size="20" font-family="var(--font-sans)" font-weight="700" fill="var(--aggregate)">ŷ_stack</text>
        <text x="64" y="14" font-size="14" font-family="var(--font-sans)" font-weight="600" fill="var(--text)">最终集成预测</text>
        <text x="64" y="34" font-size="13" font-family="var(--font-num)" fill="var(--muted)">g(ŷ₁, ŷ₂, ŷ₃) = 0.88</text>
      </g>

      <!-- 特征空间与学习注解条 (微型刻度与几何标注，强化仪器精密感) -->
      <g transform="translate(900, 520)" fill="var(--muted)" opacity="0.85">
        <text x="0" y="0" font-size="12" font-family="var(--font-sans)" font-weight="500">元特征映射输入 S_meta</text>
        <path d="M-8 -4 L-1 0 L-8 4" fill="none" stroke="var(--muted)" stroke-width="1.2"/>
      </g>

      <g transform="translate(1220, 420)" fill="var(--muted)" opacity="0.85">
        <text x="0" y="0" font-size="12" font-family="var(--font-sans)" font-weight="500">自适应参数权重 θ</text>
        <path d="M-8 -4 L-1 0 L-8 4" fill="none" stroke="var(--muted)" stroke-width="1.2"/>
      </g>
    </svg>
  </div>

  <script src="assets/base.js"></script>
  <script>
    (function () {
      'use strict';
      Deck.init({ index: 20, total: 27 });

      var stage = document.getElementById('stage');
      var settleTimer = 0;

      function settle() {
        stage.classList.remove('is-entering');
      }

      function replay() {
        clearTimeout(settleTimer);
        stage.classList.remove('is-entering');
        void stage.offsetWidth;
        if (!Deck.reduced()) {
          stage.classList.add('is-entering');
          settleTimer = setTimeout(settle, 1600);
        }
      }

      // 键盘 R 键可重放动势
      document.addEventListener('keydown', function (e) {
        if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey) {
          replay();
        }
      });

      if (!Deck.reduced()) {
        settleTimer = setTimeout(settle, 1600);
      }
    })();
  </script>
</body>
</html>
