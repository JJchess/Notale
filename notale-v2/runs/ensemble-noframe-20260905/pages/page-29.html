<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F4F7FB;
      --text: #13243A;
      --font-sans: "Noto Sans CJK SC", system-ui, sans-serif;
    }

    #stage {
      padding: var(--pad-y) var(--pad-x);
      justify-content: space-between;
      overflow: hidden;
    }

    /* 顶部标题区 */
    .title-block {
      max-width: 1200px;
      z-index: 2;
    }

    .kicker {
      font-size: var(--fs-label);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .main-title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: 1.25;
      color: var(--text);
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* 主视觉舞台 */
    .main-visual {
      flex: 1;
      min-height: 0;
      position: relative;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vector-stage {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 底部收束陈述 */
    .conclusion-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: var(--line) solid var(--surface);
      padding-top: 18px;
      z-index: 2;
    }

    .core-principle {
      font-size: var(--fs-lead);
      color: var(--text);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .tag-diff {
      color: var(--model);
      font-family: var(--font-display);
    }

    .tag-agg {
      color: var(--aggregate);
      font-family: var(--font-display);
    }

    .math-anchor {
      font-family: var(--font-numeric);
      font-size: var(--fs-sec);
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    /* 动效：多路径汇合入聚合粗线 */
    .stream-line {
      stroke-dasharray: 8 6;
      animation: flow-dash 18s linear infinite;
    }

    @keyframes flow-dash {
      to {
        stroke-dashoffset: -280;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .stream-line {
        animation: none;
      }
    }
  </style>
</head>
<body data-page="29" data-total="29">
  <div id="stage" tabindex="0">
    <header class="title-block">
      <div class="kicker">全讲收束 · 核心洞察</div>
      <h1 class="main-title">集成的收益来自“有能力且有差异”的成员，而不是模型数量本身</h1>
    </header>

    <main class="main-visual min0">
      <svg class="vector-stage" viewBox="0 0 1488 560" fill="none" role="img" aria-label="多样性基学习器汇入强集成决策流">
        <defs>
          <filter id="shadow-node" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#13243A" flood-opacity="0.08"/>
          </filter>
        </defs>

        <!-- 背景支撑：三层逻辑场域 -->
        <!-- 左侧输入场域 -->
        <rect x="20" y="30" width="370" height="500" rx="8" fill="var(--surface)" fill-opacity="0.6" stroke="var(--surface)" stroke-width="2"/>
        <text x="48" y="74" fill="var(--text)" font-size="18" font-weight="700">基学习器群 ｛h_m｝</text>
        <text x="48" y="100" fill="var(--muted)" font-size="15">独立多样性采样与训练路径</text>

        <!-- 条件一卡片 (放置在上方不遮挡流线) -->
        <g filter="url(#shadow-node)">
          <rect x="425" y="60" width="310" height="88" rx="8" fill="#FFF" stroke="var(--model)" stroke-width="2"/>
          <text x="445" y="94" fill="var(--model)" font-size="16" font-weight="700">条件一：多样性 (ρ &lt; 1)</text>
          <text x="445" y="124" fill="var(--text)" font-size="15">错误相互独立，避免同质共犯</text>
        </g>

        <!-- 条件二卡片 (放置在下方不遮挡流线) -->
        <g filter="url(#shadow-node)">
          <rect x="425" y="420" width="310" height="88" rx="8" fill="#FFF" stroke="var(--focus)" stroke-width="2"/>
          <text x="445" y="454" fill="var(--focus)" font-size="16" font-weight="700">条件二：有效性 (ε &lt; 0.5)</text>
          <text x="445" y="484" fill="var(--text)" font-size="15">个体优于随机猜测，具备真信号</text>
        </g>

        <!-- 右侧输出场域 -->
        <rect x="780" y="30" width="688" height="500" rx="8" fill="var(--surface)" fill-opacity="0.6" stroke="var(--aggregate)" stroke-width="2"/>
        <text x="815" y="74" fill="var(--aggregate)" font-size="18" font-weight="700">集成聚合 H(x)</text>
        <text x="815" y="100" fill="var(--muted)" font-size="15">方差压缩 · 泛化边界平滑</text>

        <!-- 5条基学习器连线：从左侧节点横穿中场，汇入汇聚圆 -->
        <path class="stream-line" d="M 350 152 C 520 152, 700 285, 940 285" stroke="var(--model)" stroke-width="2" stroke-linecap="round"/>
        <path class="stream-line" d="M 350 222 C 540 222, 720 285, 940 285" stroke="var(--model)" stroke-width="2" stroke-linecap="round"/>
        <path class="stream-line" d="M 350 292 L 940 285" stroke="var(--model)" stroke-width="2.5" stroke-linecap="round"/>
        <path class="stream-line" d="M 350 362 C 540 362, 720 285, 940 285" stroke="var(--model)" stroke-width="2" stroke-linecap="round"/>
        <path class="stream-line" d="M 350 432 C 520 432, 700 285, 940 285" stroke="var(--model)" stroke-width="2" stroke-linecap="round"/>

        <!-- 左侧 5 个基学习器实体卡片 -->
        <g filter="url(#shadow-node)">
          <rect x="48" y="128" width="302" height="48" rx="6" fill="#FFF" stroke="var(--model)" stroke-width="2"/>
          <text x="68" y="158" fill="var(--text)" font-size="16" font-weight="700">h₁(x)</text>
          <text x="125" y="158" fill="var(--muted)" font-size="15">随机子空间特征扰动</text>
        </g>

        <g filter="url(#shadow-node)">
          <rect x="48" y="198" width="302" height="48" rx="6" fill="#FFF" stroke="var(--model)" stroke-width="2"/>
          <text x="68" y="228" fill="var(--text)" font-size="16" font-weight="700">h₂(x)</text>
          <text x="125" y="228" fill="var(--muted)" font-size="15">Bootstrap 自助重采样</text>
        </g>

        <g filter="url(#shadow-node)">
          <rect x="48" y="268" width="302" height="48" rx="6" fill="#FFF" stroke="var(--model)" stroke-width="2"/>
          <text x="68" y="298" fill="var(--text)" font-size="16" font-weight="700">h₃(x)</text>
          <text x="125" y="298" fill="var(--muted)" font-size="15">伪残差梯度拟合</text>
        </g>

        <g filter="url(#shadow-node)">
          <rect x="48" y="338" width="302" height="48" rx="6" fill="#FFF" stroke="var(--model)" stroke-width="2"/>
          <text x="68" y="368" fill="var(--text)" font-size="16" font-weight="700">h₄(x)</text>
          <text x="125" y="368" fill="var(--muted)" font-size="15">树深度与正则扰动</text>
        </g>

        <g filter="url(#shadow-node)">
          <rect x="48" y="408" width="302" height="48" rx="6" fill="#FFF" stroke="var(--model)" stroke-width="2"/>
          <text x="68" y="438" fill="var(--text)" font-size="16" font-weight="700">h₅(x)</text>
          <text x="125" y="438" fill="var(--muted)" font-size="15">异质基学习器架构</text>
        </g>

        <!-- 聚合运算枢纽 -->
        <g filter="url(#shadow-node)">
          <circle cx="960" cy="285" r="54" fill="#FFF" stroke="var(--aggregate)" stroke-width="4"/>
          <path d="M 942 285 L 978 285 M 960 267 L 960 303" stroke="var(--aggregate)" stroke-width="4" stroke-linecap="round"/>
          <text x="960" y="362" text-anchor="middle" fill="var(--text)" font-size="16" font-weight="700">投票 / 加权聚合</text>
          <text x="960" y="386" text-anchor="middle" fill="var(--muted)" font-size="13">非共线性互抵</text>
        </g>

        <!-- 主题签名：加粗汇合线流向最终强输出 (4px --aggregate) -->
        <path d="M 1014 285 L 1110 285" stroke="var(--aggregate)" stroke-width="5" stroke-linecap="round"/>
        <polygon points="1110,277 1126,285 1110,293" fill="var(--aggregate)"/>

        <!-- 右侧最终结果卡片 -->
        <g filter="url(#shadow-node)">
          <rect x="1130" y="200" width="310" height="170" rx="8" fill="#FFF" stroke="var(--aggregate)" stroke-width="3"/>
          <text x="1160" y="248" fill="var(--aggregate)" font-size="22" font-weight="700">稳健强学习器</text>
          <text x="1160" y="286" fill="var(--text)" font-size="18" font-weight="700">H(x) = sign(∑ α_m h_m)</text>
          <text x="1160" y="324" fill="var(--muted)" font-size="15">误差渐近压低至理论下界</text>
        </g>
      </svg>
    </main>

    <footer class="conclusion-bar">
      <div class="core-principle">
        <span>多模型独立探索</span>
        <span class="tag-diff">→ 保持多样性</span>
        <span>· 协同裁决</span>
        <span class="tag-agg">→ 消除个体偏误</span>
      </div>
      <div class="math-anchor">
        Var(H) = ρσ² + (1 - ρ)σ² / M
      </div>
    </footer>
  </div>

  <aside class="notes" hidden>
    本讲我们完整学习了 Bagging、随机森林、Boosting 等经典集成范式。在全讲结束时，请牢记集成的根本公理：单纯堆砌同质模型的数量不会带来任何质的提升。集成的收益本质上来自“好而不同”——每个个体模型必须具备基本的预测能力，同时它们必须在不同的样本分布、特征空间或优化路径上产生有差异的决策边界，使得误差在汇聚时相互抵消。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 29, total: 29 });
  </script>
</body>
</html>
