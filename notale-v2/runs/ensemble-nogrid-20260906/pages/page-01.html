<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F6F9;
      --text: #172A3A;
      --muted: #536575;
      --paper: #FFFFFF;
      --model: #245FA6;
      --aggregate: #C94F2D;
      --diversity: #28785E;
      --focus: #A63D21;
      --font-sans: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-num: "DIN Alternate", "Avenir Next Condensed", "PingFang SC", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      background: var(--bg);
      padding: 56px;
      isolation: isolate;
    }

    #flow-canvas {
      z-index: 1;
      pointer-events: none;
    }

    .cover-content {
      position: absolute;
      top: 140px;
      left: 110px;
      width: 580px;
      z-index: 5;
      pointer-events: none;
    }

    .series-label {
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 24px;
    }

    h1 {
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
      margin-bottom: 24px;
    }

    .lead-statement {
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      max-width: 520px;
    }

    .legend-panel {
      position: absolute;
      left: 110px;
      bottom: 70px;
      z-index: 5;
      display: flex;
      gap: 32px;
      align-items: center;
      pointer-events: none;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: var(--fs-label);
      color: var(--muted);
    }

    .legend-line {
      width: 24px;
      height: 2px;
      border-radius: 1px;
    }

    .legend-line.model {
      background: var(--model);
      opacity: 0.7;
    }

    .legend-line.aggregate {
      background: var(--aggregate);
      height: 4px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--diversity);
    }
  </style>
</head>
<body data-page="01" data-total="26">
  <div id="stage">
    <canvas id="flow-canvas" class="cv-fill" aria-hidden="true"></canvas>

    <div class="cover-content">
      <div class="series-label">机器学习概论 · 第八讲</div>
      <h1>集成学习</h1>
      <p class="lead-statement">让一组不完美模型形成更可靠的判断</p>
    </div>

    <div class="legend-panel">
      <div class="legend-item">
        <span class="legend-line model"></span>
        <span>弱学习器路径</span>
      </div>
      <div class="legend-item">
        <span class="legend-dot"></span>
        <span>多样性扰动点</span>
      </div>
      <div class="legend-item">
        <span class="legend-line aggregate"></span>
        <span>集成收敛轴</span>
      </div>
    </div>
  </div>

  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      Deck.init({ index: 1, total: 26, keys: false });

      const canvas = document.getElementById("flow-canvas");
      if (!canvas) return;

      const W = 1600;
      const H = 900;
      const SEED = 20260906;

      function seededRandom(s) {
        let state = s >>> 0;
        return () => {
          state = (state + 0x6d2b79f5) >>> 0;
          let n = state;
          n = Math.imul(n ^ (n >>> 15), n | 1);
          n ^= n + Math.imul(n ^ (n >>> 7), n | 61);
          return ((n ^ (n >>> 14)) >>> 0) / 4294967296;
        };
      }

      // Title exclusion boundary
      function titleExclusion(x, y) {
        return x >= 80 && x <= 720 && y >= 100 && y <= 560;
      }

      // Generative ensemble river model
      const NUM_TRAJECTORIES = 54;
      const rng = seededRandom(SEED);

      // We generate trajectories from left/middle-right converging to right focal region
      // Focal aggregate target: (1440, 480)
      const TARGET_X = 1460;
      const TARGET_Y = 480;

      const trajectories = [];
      for (let i = 0; i < NUM_TRAJECTORIES; i++) {
        // Staggered start positions along top, bottom, and middle bands on right of title
        const startX = 640 + rng() * 320;
        const startY = 80 + rng() * 740;
        
        // Each weak learner has individual variance/bias
        const points = [{ x: startX, y: startY }];
        let currX = startX;
        let currY = startY;
        const steps = 38;
        const phase = rng() * Math.PI * 2;
        const freq = 0.08 + rng() * 0.06;
        const drift = (rng() - 0.5) * 45;

        for (let s = 1; s <= steps; s++) {
          const t = s / steps;
          // Interpolate toward target X
          currX = startX + (TARGET_X - startX) * Math.pow(t, 0.88);
          
          // Target Y smoothly pulls toward TARGET_Y
          const idealY = startY + (TARGET_Y - startY) * Math.pow(t, 1.25);
          
          // Individual fluctuation damping smoothly as models converge
          const damp = Math.pow(1 - t, 0.95);
          const wave = Math.sin(s * freq + phase) * (42 * damp) + drift * damp;
          currY = idealY + wave;

          points.push({ x: currX, y: currY });
        }

        // Diversity sampling nodes
        const nodes = [];
        const numNodes = 2 + Math.floor(rng() * 3);
        for (let n = 0; n < numNodes; n++) {
          const idx = Math.floor(4 + rng() * (steps - 8));
          nodes.push(points[idx]);
        }

        trajectories.push({
          points,
          nodes,
          alpha: 0.16 + rng() * 0.28,
          weight: 1.2 + rng() * 1.6
        });
      }

      function draw(ctx) {
        ctx.clearRect(0, 0, W, H);

        // Subtle background coordinates / ensemble lattice
        ctx.strokeStyle = Deck.rgba("--muted", 0.04);
        ctx.lineWidth = 1;
        const stepGrid = 64;
        for (let x = 600; x <= 1536; x += stepGrid) {
          ctx.beginPath();
          ctx.moveTo(x, 70);
          ctx.lineTo(x, 830);
          ctx.stroke();
        }
        for (let y = 130; y <= 830; y += stepGrid) {
          ctx.beginPath();
          ctx.moveTo(600, y);
          ctx.lineTo(1536, y);
          ctx.stroke();
        }

        // 1. Draw individual weak learner trajectories (tree branches / model paths)
        for (const tr of trajectories) {
          ctx.beginPath();
          ctx.strokeStyle = Deck.rgba("--model", tr.alpha);
          ctx.lineWidth = tr.weight;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";

          const pts = tr.points;
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length - 1; i++) {
            const xc = (pts[i].x + pts[i + 1].x) / 2;
            const yc = (pts[i].y + pts[i + 1].y) / 2;
            ctx.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc);
          }
          ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
          ctx.stroke();

          // Draw diversity perturbation points (resampling/split markers)
          for (const node of tr.nodes) {
            ctx.beginPath();
            ctx.fillStyle = Deck.rgba("--diversity", 0.55);
            ctx.arc(node.x, node.y, 3, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // 2. Converged robust ensemble spine (加权和 / 多数投票核心脊线)
        ctx.beginPath();
        ctx.strokeStyle = Deck.rgba("--aggregate", 0.95);
        ctx.lineWidth = 4;
        ctx.lineCap = "round";

        const spinePoints = [];
        const spineSteps = 30;
        const startSpineX = 740;
        const startSpineY = 480;
        for (let s = 0; s <= spineSteps; s++) {
          const t = s / spineSteps;
          const sx = startSpineX + (TARGET_X - startSpineX) * t;
          const sy = TARGET_Y + Math.sin(t * Math.PI * 2) * (18 * (1 - t));
          spinePoints.push({ x: sx, y: sy });
        }

        ctx.moveTo(spinePoints[0].x, spinePoints[0].y);
        for (let i = 1; i < spinePoints.length - 1; i++) {
          const xc = (spinePoints[i].x + spinePoints[i + 1].x) / 2;
          const yc = (spinePoints[i].y + spinePoints[i + 1].y) / 2;
          ctx.quadraticCurveTo(spinePoints[i].x, spinePoints[i].y, xc, yc);
        }
        ctx.lineTo(spinePoints[spinePoints.length - 1].x, spinePoints[spinePoints.length - 1].y);
        ctx.stroke();

        // 3. Focal Convergence Target Core Node
        ctx.beginPath();
        ctx.fillStyle = Deck.rgba("--aggregate", 0.14);
        ctx.arc(TARGET_X, TARGET_Y, 26, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = Deck.rgba("--aggregate", 0.28);
        ctx.arc(TARGET_X, TARGET_Y, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = Deck.token("--aggregate");
        ctx.arc(TARGET_X, TARGET_Y, 6, 0, Math.PI * 2);
        ctx.fill();

        // Output vector arrow extending rightward from target
        ctx.beginPath();
        ctx.strokeStyle = Deck.token("--aggregate");
        ctx.lineWidth = 3;
        ctx.moveTo(TARGET_X + 12, TARGET_Y);
        ctx.lineTo(TARGET_X + 54, TARGET_Y);
        ctx.stroke();

        ctx.beginPath();
        ctx.fillStyle = Deck.token("--aggregate");
        ctx.moveTo(TARGET_X + 54, TARGET_Y);
        ctx.lineTo(TARGET_X + 44, TARGET_Y - 5);
        ctx.lineTo(TARGET_X + 44, TARGET_Y + 5);
        ctx.closePath();
        ctx.fill();
      }

      Deck.autofit(canvas, draw);
    })();
  </script>
  <aside class="notes" hidden>
    各位同学好，欢迎来到《机器学习概论》第八讲。这一讲我们的核心主题是集成学习。在实际建模中，我们几乎很难直接训练出一个处处完美、在任何分布下都无懈可击的单一模型。集成学习的核心哲学，就是不寄希望于单个超级模型，而是通过重采样、特征扰动或残差迭代等机制，制造出一组具备有用性又互补的基学习器，并通过投票或加权平均将其汇聚成一个方差更低、泛化能力更可靠的强预测系统。今天我们将从模型委员会的直觉出发，层层剖析误差分解、Bagging、随机森林以及Boosting的深层原理。
  </aside>
</body>
</html>
