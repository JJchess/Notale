<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Bagging：用重采样制造多样性</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F6F9;
      --text: #172A3A;
      --font-sans: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
    }

    #canvas-cover {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .cover-header {
      position: absolute;
      left: 104px;
      top: 156px;
      z-index: 5;
      max-width: 680px;
      pointer-events: none;
    }

    .chapter-tag {
      display: inline-block;
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--diversity);
      letter-spacing: 0.16em;
      margin-bottom: 24px;
    }

    .cover-title {
      font-size: 48px;
      font-weight: 700;
      line-height: 1.22;
      letter-spacing: -0.015em;
      color: var(--text);
      margin: 0 0 20px 0;
      white-space: nowrap;
    }

    .cover-lead {
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
      max-width: 520px;
    }

    .metrics-anchor {
      position: absolute;
      left: 104px;
      bottom: 120px;
      z-index: 5;
      display: flex;
      gap: 36px;
      pointer-events: none;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric-value {
      font-family: var(--font-num);
      font-size: var(--fs-h1);
      font-weight: 700;
      line-height: 1.1;
      color: var(--text);
    }

    .metric-value.highlight-green {
      color: var(--diversity);
    }

    .metric-value.highlight-blue {
      color: var(--model);
    }

    .metric-label {
      font-size: var(--fs-sec);
      color: var(--muted);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body data-page="05" data-total="26">
  <div id="stage">
    <canvas id="canvas-cover" class="cv-fill"></canvas>

    <header class="cover-header">
      <div class="chapter-tag">第 02 节 · 样本扰动</div>
      <h1 class="cover-title">Bagging：用重采样制造多样性</h1>
      <p class="cover-lead">从单一训练集抽取不同样本子集，让各个基学习器在差异化经验中独立生长。</p>
    </header>

    <div class="metrics-anchor">
      <div class="metric-item">
        <span class="metric-value highlight-green">63.2%</span>
        <span class="metric-label">单次抽样覆盖率</span>
      </div>
      <div class="metric-item">
        <span class="metric-value highlight-blue">独立并行</span>
        <span class="metric-label">基学习器训练机制</span>
      </div>
      <div class="metric-item">
        <span class="metric-value">抵消方差</span>
        <span class="metric-label">聚合输出核心收益</span>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    这一节我们正式进入 Bagging。它的核心思想是通过 Bootstrap 有放回重采样，在完全相同的初始训练集上制造出多个互有重叠但各不相同的样本分布。
    每个基模型独立且并行地在各自的抽样集上训练，由于看到的样本扰动不同，各个模型犯错的位置也相互错开。最后把它们的预测通过平均或投票整合在一起，就能在不损失偏差的前提下显著压低预测方差。
  </aside>

  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      const cv = document.getElementById("canvas-cover");
      const SEED = "bagging-cover-seed-2026";
      const W = 1600;
      const H = 900;

      // 视觉载体：左侧中心样本源库，分化出多个 Bootstrap 轨迹分枝，右侧汇聚为预测基学习器群
      function buildModel() {
        const rng = new Math.seedrandom(SEED);
        
        // 原始样本母池（右中偏上定位）
        const poolCenter = { x: 840, y: 450 };
        const originalDots = [];
        const poolCount = 42;
        for (let i = 0; i < poolCount; i++) {
          const r = Math.pow(rng(), 0.7) * 95;
          const th = rng() * Math.PI * 2;
          originalDots.push({
            x: poolCenter.x + Math.cos(th) * r,
            y: poolCenter.y + Math.sin(th) * r,
            radius: 3.2 + rng() * 2.2,
            type: rng() > 0.48 ? 1 : 0 // 两类样本
          });
        }

        // 基学习器分流分支（4组主要 bootstrap 树流）
        const learners = [
          { id: 1, targetY: 195, label: "Tree 1", weight: 0.9 },
          { id: 2, targetY: 360, label: "Tree 2", weight: 1.0 },
          { id: 3, targetY: 530, label: "Tree 3", weight: 1.0 },
          { id: 4, targetY: 695, label: "Tree 4", weight: 0.95 }
        ];

        const branches = [];
        learners.forEach((lrn, lIndex) => {
          const targetX = 1260;
          const targetY = lrn.targetY;
          // 生成数条流线从母池抽样通往基学习器
          const streamCount = 10;
          for (let s = 0; s < streamCount; s++) {
            const startDot = originalDots[Math.floor(rng() * originalDots.length)];
            const midX1 = poolCenter.x + 110 + (rng() - 0.5) * 40;
            const midY1 = poolCenter.y + (targetY - poolCenter.y) * 0.38 + (rng() - 0.5) * 60;
            const midX2 = 1060 + (rng() - 0.5) * 50;
            const midY2 = targetY + (rng() - 0.5) * 40;
            
            branches.push({
              start: { x: startDot.x, y: startDot.y },
              cp1: { x: midX1, y: midY1 },
              cp2: { x: midX2, y: midY2 },
              end: { x: targetX, y: targetY + (s - 4.5) * 3.5 },
              alpha: 0.2 + rng() * 0.26,
              width: 1.3 + rng() * 1.6,
              learnerId: lrn.id,
              colorType: startDot.type
            });
          }
        });

        return { poolCenter, originalDots, learners, branches };
      }

      let model = buildModel();

      function drawCover(ctx) {
        ctx.clearRect(0, 0, W, H);

        const colDiversity = Deck.rgba("diversity", 1);
        const colModel = Deck.rgba("model", 1);
        const colMuted = Deck.rgba("muted", 0.4);
        const colPaper = Deck.rgba("paper", 1);

        // 1. 绘制母池底晕
        const gradPool = ctx.createRadialGradient(
          model.poolCenter.x, model.poolCenter.y, 10,
          model.poolCenter.x, model.poolCenter.y, 140
        );
        gradPool.addColorStop(0, "rgba(40, 120, 94, 0.09)");
        gradPool.addColorStop(1, "rgba(40, 120, 94, 0)");
        ctx.fillStyle = gradPool;
        ctx.beginPath();
        ctx.arc(model.poolCenter.x, model.poolCenter.y, 140, 0, Math.PI * 2);
        ctx.fill();

        // 母池环形约束虚线
        ctx.save();
        ctx.setLineDash([4, 6]);
        ctx.strokeStyle = "rgba(83, 101, 117, 0.25)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(model.poolCenter.x, model.poolCenter.y, 108, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // 标注母池
        ctx.font = "600 13px " + Deck.token("--font-sans");
        ctx.fillStyle = Deck.rgba("muted", 0.85);
        ctx.textAlign = "center";
        ctx.fillText("原始训练集 D", model.poolCenter.x, model.poolCenter.y + 130);
        ctx.font = "500 12px " + Deck.token("--font-num");
        ctx.fillStyle = Deck.rgba("muted", 0.6);
        ctx.fillText("N 个初始样本", model.poolCenter.x, model.poolCenter.y + 148);

        // 2. 绘制采样分支流线 (Cubic Beziers)
        model.branches.forEach(b => {
          ctx.beginPath();
          ctx.moveTo(b.start.x, b.start.y);
          ctx.bezierCurveTo(b.cp1.x, b.cp1.y, b.cp2.x, b.cp2.y, b.end.x, b.end.y);
          
          if (b.colorType === 1) {
            ctx.strokeStyle = Deck.rgba("diversity", b.alpha);
          } else {
            ctx.strokeStyle = Deck.rgba("model", b.alpha);
          }
          ctx.lineWidth = b.width;
          ctx.stroke();
        });

        // 3. 绘制原始样本点 (点阵分布)
        model.originalDots.forEach(d => {
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
          if (d.type === 1) {
            ctx.fillStyle = Deck.rgba("diversity", 0.88);
          } else {
            ctx.fillStyle = Deck.rgba("model", 0.82);
          }
          ctx.fill();
          ctx.strokeStyle = "#FFFFFF";
          ctx.lineWidth = 1.5;
          ctx.stroke();
        });

        // 4. 绘制右侧学习器节点及集成聚集柱
        model.learners.forEach(lrn => {
          const x = 1260;
          const y = lrn.targetY;

          // 树节点外发光/阴影
          ctx.fillStyle = "rgba(36, 95, 166, 0.08)";
          ctx.beginPath();
          ctx.arc(x, y, 30, 0, Math.PI * 2);
          ctx.fill();

          // 实体节点圆
          ctx.fillStyle = colPaper;
          ctx.beginPath();
          ctx.arc(x, y, 20, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = Deck.rgba("model", 0.85);
          ctx.lineWidth = 2.5;
          ctx.stroke();

          // 核心点
          ctx.fillStyle = Deck.rgba("model", 0.95);
          ctx.beginPath();
          ctx.arc(x, y, 6.5, 0, Math.PI * 2);
          ctx.fill();

          // 学习器标注
          ctx.font = "600 16px " + Deck.token("--font-sans");
          ctx.fillStyle = Deck.rgba("text", 0.95);
          ctx.textAlign = "left";
          ctx.fillText("基学习器 h_" + lrn.id, x + 34, y - 4);

          ctx.font = "500 13px " + Deck.token("--font-num");
          ctx.fillStyle = Deck.rgba("diversity", 0.95);
          ctx.fillText("Bootstrap 子集 D_" + lrn.id, x + 34, y + 16);

          // 引向右侧最后集成的聚拢导线
          ctx.strokeStyle = "rgba(201, 79, 45, 0.35)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x + 158, y);
          ctx.lineTo(1460, y);
          ctx.stroke();
        });

        // 汇集到最右侧的垂直汇总线，象征集成输出
        const ensembleX = 1460;
        ctx.strokeStyle = Deck.rgba("aggregate", 0.75);
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(ensembleX, 195);
        ctx.lineTo(ensembleX, 695);
        ctx.stroke();

        ctx.fillStyle = Deck.rgba("aggregate", 1);
        ctx.beginPath();
        ctx.arc(ensembleX, 445, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(ensembleX - 14, 445);
        ctx.rotate(-Math.PI / 2);
        ctx.font = "700 14px " + Deck.token("--font-sans");
        ctx.fillStyle = Deck.rgba("aggregate", 0.95);
        ctx.textAlign = "center";
        ctx.fillText("集成平均 / 多数投票", 0, 0);
        ctx.restore();
      }

      Deck.init({ index: 5, total: 26, keys: false });
      Deck.autofit(cv, drawCover);
    })();
  </script>
</body>
</html>
