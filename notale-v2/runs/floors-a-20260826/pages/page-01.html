<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="01" data-total="21">
<div id="stage">
  <style>
    #stage{
      position:relative; overflow:hidden; display:flex; flex-direction:column;
      padding:28px 56px; color:#F3F1EA; background:#263033;
    }
    .page-backdrop{
      position:absolute; left:56px; top:28px; width:1488px; height:844px; object-fit:cover;
      object-position:62% center; z-index:0; border-radius:6px;
    }
    .veil{position:absolute; inset:28px 56px; z-index:1; border-radius:6px; background:linear-gradient(90deg,rgba(17,26,29,.42) 0%,rgba(17,26,29,.15) 46%,rgba(17,26,29,.03) 75%);}
    .focus.hero-focus{
      position:relative; z-index:2; width:900px; margin:126px 0 0 54px;
      padding:34px 38px 30px; background:rgba(38,48,51,.82); border-left:3px solid rgba(243,241,234,.75);
      box-shadow:0 1px 0 rgba(243,241,234,.18); flex:none;
    }
    .kicker{font:600 var(--fs-label)/1.2 var(--font-mono); letter-spacing:.14em; color:rgba(243,241,234,.83);}
    .claim{margin:14px 0 0; max-width:760px; font:600 var(--fs-h1)/1.35 var(--font-serif); letter-spacing:.01em; color:#fff;}
    .takeaway{margin:14px 0 0; font:400 var(--fs-lead)/1.4 var(--font-sans); color:rgba(255,255,255,.92);}
    #stage .hero-focus{height:auto !important; min-height:0 !important; align-self:flex-start; display:block !important;}
    #stage .k-generalization{position:relative; margin-top:25px; padding-top:30px; display:block !important;}
    #stage .trunk{position:absolute; top:0; left:50%; width:2px; height:20px; background:rgba(243,241,234,.85);}
    #stage .trunk::after{content:""; position:absolute; left:-339px; bottom:0; width:680px; height:2px; background:rgba(243,241,234,.85);}
    #stage .supports{display:flex !important; flex-direction:row !important; gap:24px; align-items:stretch; width:100%;}
    #stage .support{width:calc(50% - 12px) !important; min-width:0; min-height:98px; padding:16px 18px; border:2px solid rgba(243,241,234,.78); border-radius:6px; background:rgba(20,29,31,.26); display:flex !important; flex-direction:row !important; align-items:center; box-sizing:border-box; writing-mode:horizontal-tb !important;}
    #stage .support p{margin:0; font:500 var(--fs-sec)/1.4 var(--font-sans); color:#fff; writing-mode:horizontal-tb !important;}
    .support b{font-weight:700;}
    .support.path{border-color:rgba(23,107,120,.95); background:rgba(13,52,59,.30);}
    .env-arrow{display:inline-block; width:48px; height:2px; vertical-align:middle; margin:0 9px 4px 8px; background:var(--env); position:relative;}
    .env-arrow::after{content:""; position:absolute; right:-1px; top:-4px; width:8px; height:8px; border-top:2px solid var(--env); border-right:2px solid var(--env); transform:rotate(45deg);}
    .question{position:relative; z-index:2; margin:22px 0 0 54px; width:830px; padding-left:18px; border-left:2px solid rgba(243,241,234,.76); font:400 var(--fs-sec)/1.42 var(--font-sans); color:rgba(255,255,255,.92);}
    .question strong{font-weight:650; color:#fff;}
    .credit{position:absolute; z-index:2; bottom:12px; font:400 var(--fs-tick)/1.3 var(--font-sans); color:rgba(255,255,255,.82); white-space:nowrap; text-shadow:0 1px 3px rgba(0,0,0,.8);}
    .credit-a{right:410px}.credit-b{right:310px}.credit-c{right:105px}.credit-d{right:16px}
  </style>
  <img class="page-backdrop backdrop" src="assets/img/typhoon-himawari-satellite.jpg" alt="向右侧海面延展的台风螺旋云系卫星图，台风眼清晰可辨" title="Himawari-9 2026-07-05 0230z RGB.png · This image was produced by the Japan Meteorological Agency. The legal notice stated, unless otherwise noted, images publ · CC BY 4.0">
  <div class="veil" aria-hidden="true"></div>
  <main class="focus hero-focus min0" aria-labelledby="page-title">
    <div class="kicker"><span>OPENING</span> <span>QUESTION</span></div>
    <h1 class="claim" id="page-title"><span>暖海面</span><span>给台风能量，</span><span>变化的气流</span><span>让它转弯</span></h1>
    <p class="takeaway"><span>强弱看能量条件，</span><span>路径看大尺度气流。</span></p>
    <section class="k-generalization" aria-label="同一主张的两条支撑">
      <div class="trunk" aria-hidden="true"></div>
      <div class="supports min0">
        <article class="support min0"><p>暖海面 <b>→ 提供能量条件</b></p></article>
        <article class="support path min0"><p>大尺度气流变化 <span class="env-arrow" aria-hidden="true"></span><b>改变路径</b></p></article>
      </div>
    </section>
  </main>
  <p class="question"><strong>下一问</strong>　<span>如果只知道</span><span>台风的出发点，</span><span>你会把未来路径画向哪里？</span></p>
  <div class="credit credit-a">Himawari-9</div><div class="credit credit-b">satellite image</div><div class="credit credit-c">· Japan Meteorological Agency</div><div class="credit credit-d">· CC BY 4.0</div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
