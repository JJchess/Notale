<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F3F1EA;--text:#263033;--font-sans:"Noto Sans SC",system-ui,sans-serif}
*{box-sizing:border-box}
#stage{padding:28px 56px;display:flex;flex-direction:column;gap:0;overflow:hidden;position:relative}
.p2-page{position:absolute;inset:28px 56px;display:flex;flex-direction:column;min-height:0}
.p2-head{height:126px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid var(--line);padding:8px 0 20px}
.p2-kicker{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.13em;color:var(--env);margin:4px 0 14px}
.p2-head h1{margin:0;font:600 var(--fs-h1)/1.2 var(--font-serif);letter-spacing:.01em;color:var(--text)}
.p2-side{width:310px;padding-top:12px;font:var(--fs-sec)/1.45 var(--font-sans);color:var(--muted);border-left:2px solid var(--env);padding-left:16px}
.path-widget{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:22px}
.widget-top{height:48px;display:flex;align-items:center;justify-content:space-between;gap:22px}
.hint{margin:0;font:var(--fs-label)/1.4 var(--font-sans);color:var(--muted)}
.hint b{color:var(--accent);font-weight:650}
.btn{font-size:var(--fs-label);min-height:36px;padding:5px 14px;white-space:nowrap}
.compare-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr);align-items:stretch;align-content:stretch;gap:18px;padding:10px 0 18px}
.path-cell{height:100%;display:flex;min-width:0;min-height:0;flex-direction:column;border-top:2px solid var(--line);position:relative}
.path-cell.user{border-top-color:var(--accent)}
.hdr{height:41px;display:flex;align-items:center;justify-content:space-between;font:600 var(--fs-h2)/1 var(--font-sans);color:var(--text)}
.hdr .num{font:var(--fs-tick)/1 var(--font-mono);color:var(--muted)}
.cvbox{flex:1;min-height:0;position:relative;overflow:hidden;border:1.5px solid var(--line);border-radius:6px;background:var(--panel)}
.kstage{position:absolute;inset:0;touch-action:none}
.north{position:absolute;z-index:2;left:16px;top:14px;color:var(--muted);font:600 var(--fs-label)/1 var(--font-sans);pointer-events:none}
.north .arr{font-size:20px;vertical-align:-1px;color:var(--env)}
.start-note{position:absolute;z-index:2;left:50%;top:79%;width:150px;transform:translate(-50%,-50%);text-align:center;color:var(--muted);font:var(--fs-label)/1.35 var(--font-sans);pointer-events:none}
.start-key{position:absolute;z-index:3;left:50%;top:82%;width:28px;height:28px;transform:translate(-50%,-50%);border:0;border-radius:50%;background:transparent;color:transparent;cursor:crosshair;padding:0}
.start-key:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.path-cell:not(.user) .start-key{display:none}
.path-caption{height:45px;padding-top:11px;font:var(--fs-sec)/1.35 var(--font-sans);color:var(--muted)}
.path-caption.blank{color:transparent}
.p2-foot{height:104px;border-top:2px solid var(--line);display:flex;align-items:center;gap:26px;padding-top:17px}
.conclusion{flex:1;margin:0;min-height:50px;font:600 var(--fs-lead)/1.4 var(--font-serif);color:var(--text)}
.conclusion[hidden]{display:block;visibility:hidden}
.next-q{width:370px;margin:0;padding-left:20px;border-left:2px solid var(--env);font:var(--fs-sec)/1.45 var(--font-sans);color:var(--text)}
.next-q span{display:block;color:var(--env);font:600 var(--fs-label)/1.15 var(--font-mono);letter-spacing:.08em;margin-bottom:5px}

@media (prefers-reduced-motion:reduce){.path-cell{transition:none}}
</style>
</head>
<body data-page="02" data-total="21">
<div id="stage">
  <main class="p2-page" aria-labelledby="p2-title">
    <header class="p2-head">
      <div>
        <p class="p2-kicker">PREDICT FIRST</p>
        <h1 id="p2-title">从同一点出发，你会把台风画向哪里？</h1>
      </div>
      <p class="p2-side">先留下你的预判。<br>不用猜对，只比较方向。</p>
    </header>

    <section class="path-widget" data-path-widget aria-label="四联台风路径草图">
      <div class="widget-top">
        <p class="hint"><b>从橙色台风中心起笔</b>，一笔画出你预想的移动路径；也可聚焦中心后用方向键延长。</p>
        <button type="button" class="btn" data-reset disabled>撤销重画</button>
      </div>
      <div class="compare-grid k-comparison" aria-label="同一起点、同一尺度的四条路径比较">
        <section class="path-cell user min0">
          <div class="hdr"><span>你的预判</span><span class="num">01</span></div>
          <div class="cvbox" data-box="user">
            <div class="kstage" data-stage="user" aria-label="在台风中心开始手绘路径"></div>
            <div class="north">北 <span class="arr">↑</span></div>
            <div class="start-note" data-start-note>从台风中心<br>开始画</div>
            <button class="start-key" type="button" data-key-start aria-label="台风中心：按方向键逐段画出路径"></button>
          </div>
          <p class="path-caption blank" data-caption="user">你的预判路径</p>
        </section>
        <section class="path-cell min0" data-preset-cell>
          <div class="hdr"><span>直行</span><span class="num">02</span></div>
          <div class="cvbox" data-box="straight"><div class="kstage" data-stage="straight" aria-label="直行路径"></div><div class="north">北 <span class="arr">↑</span></div></div>
          <p class="path-caption">方向基本不变</p>
        </section>
        <section class="path-cell min0" data-preset-cell>
          <div class="hdr"><span>西偏</span><span class="num">03</span></div>
          <div class="cvbox" data-box="west"><div class="kstage" data-stage="west" aria-label="西偏路径"></div><div class="north">北 <span class="arr">↑</span></div></div>
          <p class="path-caption">持续偏向西侧</p>
        </section>
        <section class="path-cell min0" data-preset-cell>
          <div class="hdr"><span>转弯</span><span class="num">04</span></div>
          <div class="cvbox" data-box="turn"><div class="kstage" data-stage="turn" aria-label="转弯路径"></div><div class="north">北 <span class="arr">↑</span></div></div>
          <p class="path-caption">先偏西，随后转向</p>
        </section>
      </div>
    </section>

    <footer class="p2-foot">
      <p class="conclusion" data-conclusion aria-live="polite" hidden>同一个起点可以画出完全不同的路径——我们还没有说明“谁在掌舵”。</p>
      <p class="next-q"><span>NEXT QUESTION</span>要解释一条台风路径，哪些问题必须先分开？</p>
    </footer>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/konva.min.js"></script>
<script>
(() => {
  const root = document.querySelector('[data-path-widget]');
  if (!root || !window.Konva) return;
  const initial = [50,82];
  const presets = {
    straight:[50,82,50,68,50,54,50,40,50,26],
    west:[50,82,45,69,39,57,32,46,24,37],
    turn:[50,82,45,69,43,56,47,44,57,34,70,28]
  };
  const state = {points:[...initial], revealed:false, active:null, destroyed:false};
  const page = root.closest('.p2-page');
  const nodes = {reset:root.querySelector('[data-reset]'), note:root.querySelector('[data-start-note]'), conclusion:page.querySelector('[data-conclusion]'), key:root.querySelector('[data-key-start]')};
  const scenes = {};
  const env = getComputedStyle(document.documentElement).getPropertyValue('--env').trim() || '#176B78';
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#E4572E';

  function spiralPoints(cx,cy,r){
    const pts=[];
    for(let i=0;i<=34;i++){const a=i*.54, q=r*(1-i/48);pts.push(cx+Math.cos(a)*q,cy+Math.sin(a)*q)}
    return pts;
  }
  function makeScene(name){
    const host=root.querySelector(`[data-stage="${name}"]`);
    const stage=new Konva.Stage({container:host,width:Math.max(1,host.clientWidth),height:Math.max(1,host.clientHeight)});
    const layer=new Konva.Layer(); stage.add(layer);
    const guide=new Konva.Line({stroke:'rgba(38,48,51,.18)',strokeWidth:1,dash:[4,5],points:[]});
    const path=new Konva.Line({stroke:name==='user'?accent:env,strokeWidth:5,lineCap:'round',lineJoin:'round',points:[]});
    const start=new Konva.Circle({radius:8,fill:name==='user'?accent:env});
    const swirl=new Konva.Line({stroke:'#F3F1EA',strokeWidth:1.6,lineCap:'round',lineJoin:'round',points:[]});
    layer.add(guide,path,start,swirl); scenes[name]={host,stage,layer,guide,path,start,swirl};
  }
  ['user','straight','west','turn'].forEach(makeScene);
  function xy(scene, points){const w=scene.stage.width(),h=scene.stage.height(),out=[];for(let i=0;i<points.length;i+=2)out.push(points[i]*w/100,points[i+1]*h/100);return out}
  function drawScene(name){
    const s=scenes[name], startPx=xy(s,initial), pts=name==='user'?state.points:presets[name];
    s.start.position({x:startPx[0],y:startPx[1]});
    s.swirl.points(spiralPoints(startPx[0],startPx[1],5));
    const isVisible=name==='user'||state.revealed;
    s.path.points(isVisible?xy(s,pts):[]);
    s.guide.points(name==='user'&&state.points.length>2?xy(s,[50,82,state.points[state.points.length-2],state.points[state.points.length-1]]):[]);
    s.layer.batchDraw();
  }
  function drawAll(){Object.keys(scenes).forEach(drawScene)}
  function announce(text){}
  function reveal(){
    if(state.revealed) return;
    state.revealed=true;nodes.reset.disabled=false;nodes.note.hidden=true;nodes.conclusion.hidden=false;
    root.querySelectorAll('[data-preset-cell]').forEach(el=>el.classList.add('revealed'));
    drawAll();
  }
  function localPoint(scene,event){
    const r=scene.host.getBoundingClientRect();
    return {x:Math.max(6,Math.min(94,(event.clientX-r.left)/r.width*100)),y:Math.max(6,Math.min(94,(event.clientY-r.top)/r.height*100))};
  }
  function addPoint(p){
    const last={x:state.points[state.points.length-2],y:state.points[state.points.length-1]};
    if(Math.hypot(p.x-last.x,p.y-last.y)<(4/Math.min(scenes.user.stage.width(),scenes.user.stage.height())*100))return;
    if(state.points.length>=240)return;
    state.points.push(p.x,p.y);reveal();drawScene('user');
  }
  function startPointer(event){
    if(state.active!==null) return;
    const p=localPoint(scenes.user,event);
    if(Math.hypot(p.x-50,p.y-82)>24) return;
    state.active=event.pointerId;
    try{scenes.user.host.setPointerCapture?.(event.pointerId)}catch(e){}
    event.preventDefault();
  }
  function movePointer(event){if(event.pointerId!==state.active)return;addPoint(localPoint(scenes.user,event));event.preventDefault()}
  function endPointer(event){if(event.pointerId!==state.active)return;state.active=null;try{scenes.user.host.releasePointerCapture(event.pointerId)}catch(e){};if(state.revealed)announce('你的路径已保留；可与三条对照路径比较。')}
  const userHost=scenes.user.host;
  userHost.addEventListener('pointerdown',startPointer);
  userHost.addEventListener('pointermove',movePointer);
  userHost.addEventListener('pointerup',endPointer);
  userHost.addEventListener('pointercancel',endPointer);
  userHost.addEventListener('pointerleave',endPointer);
  function keyDraw(event){
    const steps={ArrowUp:[0,-6],ArrowDown:[0,6],ArrowLeft:[-6,0],ArrowRight:[6,0],Home:[-4,-4],End:[4,-4]};
    if(event.key==='Backspace'){
      event.preventDefault();event.stopPropagation();
      if(state.points.length>2){state.points.splice(-2);drawScene('user');if(state.points.length===2)announce('已撤销到台风中心。');}
      return;
    }
    if(event.key==='Enter') {event.preventDefault();event.stopPropagation();if(state.points.length>2)reveal();return}
    if(!steps[event.key])return;
    event.preventDefault();event.stopPropagation();
    const last={x:state.points[state.points.length-2],y:state.points[state.points.length-1]}; const d=steps[event.key];
    addPoint({x:Math.max(6,Math.min(94,last.x+d[0])),y:Math.max(6,Math.min(94,last.y+d[1]))});
  }
  nodes.key.addEventListener('keydown',keyDraw);
  function reset(){
    state.active=null;state.points=[...initial];state.revealed=false;nodes.reset.disabled=true;nodes.note.hidden=false;nodes.conclusion.hidden=true;drawAll();nodes.key.focus();
  }
  nodes.reset.addEventListener('click',reset);
  const observer=new ResizeObserver(()=>{Object.values(scenes).forEach(s=>{const w=Math.max(1,s.host.clientWidth),h=Math.max(1,s.host.clientHeight);if(s.stage.width()!==w||s.stage.height()!==h)s.stage.size({width:w,height:h});});drawAll();});
  Object.values(scenes).forEach(s=>observer.observe(s.host));
  drawAll();
  root.destroyTyphoonSketch=()=>{
    if(state.destroyed)return;state.destroyed=true;observer.disconnect();
    userHost.removeEventListener('pointerdown',startPointer);userHost.removeEventListener('pointermove',movePointer);userHost.removeEventListener('pointerup',endPointer);userHost.removeEventListener('pointercancel',endPointer);userHost.removeEventListener('pointerleave',endPointer);
    nodes.key.removeEventListener('keydown',keyDraw);nodes.reset.removeEventListener('click',reset);Object.values(scenes).forEach(s=>s.stage.destroy());delete root.destroyTyphoonSketch;
  };
})();
</script>
</body>
</html>
