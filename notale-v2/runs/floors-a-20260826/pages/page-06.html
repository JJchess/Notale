<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F3F1EA;--text:#263033;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E4572E}
*{box-sizing:border-box} body{margin:0;overflow:hidden} #stage{height:900px;padding:28px 56px;display:flex;flex-direction:column;color:var(--text);font-family:var(--font-sans);background:var(--bg)}
.p06{height:100%;display:flex;flex-direction:column;min-height:0}.p06-header{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid var(--text);padding:4px 0 16px;gap:32px}.kicker{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--env);margin:3px 0 10px}.p06 h1{font:500 var(--fs-h1)/1.2 var(--font-serif);margin:0;letter-spacing:.01em}.invariant{margin-top:8px;color:var(--muted);font-size:var(--fs-sec);line-height:1.4;text-align:right;max-width:370px}.invariant strong{color:var(--text);font-family:var(--font-mono);font-weight:600}
.warm-widget{flex:1;min-height:0;padding-top:18px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px}.instrument-rail{display:grid;grid-template-columns:290px minmax(390px,1fr) 410px;align-items:center;gap:22px;min-width:0}.rail-title{font-size:var(--fs-body);line-height:1.4}.rail-title b{color:var(--accent);font-family:var(--font-mono);font-size:22px}.depth-control{display:grid;grid-template-columns:auto minmax(150px,1fr) 64px;gap:12px;align-items:center}.depth-control label{font-size:var(--fs-label);white-space:nowrap}.depth-control output{font:600 20px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--accent);text-align:right}.readouts{display:flex;justify-content:flex-end;gap:12px}.reading{border-left:2px solid var(--line);padding-left:12px;min-width:126px}.reading.active{border-color:var(--accent)}.reading .r-label{font-size:var(--fs-label);color:var(--muted);line-height:1.2}.reading .r-value{font:600 23px/1.2 var(--font-mono);font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap}.reading .r-value span{font:500 var(--fs-label)/1 var(--font-sans);margin-left:3px}
.compare-zone{min-height:0;display:grid;grid-template-columns:126px minmax(0,1fr);grid-template-rows:30px minmax(420px,1fr) 30px;column-gap:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0 6px}.compare-hdr{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:46px;padding:0 48px;font-size:var(--fs-h2);line-height:1.2}.compare-hdr div:last-child{color:var(--accent)}.shared-dim{grid-row:2;grid-column:1;position:relative;border-right:1px solid var(--line);margin:15px 0 20px}.shared-dim .dim-title{position:absolute;top:50%;left:-2px;transform:rotate(-90deg) translateX(-50%);transform-origin:left top;white-space:nowrap;font-size:var(--fs-label);color:var(--muted)}.shared-dim .dim-note{position:absolute;bottom:6px;left:0;font:var(--fs-tick) var(--font-mono);color:var(--muted)}.chart-wrap{grid-column:2;grid-row:2;position:relative;min-height:0;height:100%;align-self:stretch}.chart{position:absolute;inset:0}.profile-shade{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.profile-shade path{fill:url(#warm-hatch);stroke:rgba(122,130,128,.48);stroke-width:1}.drag-guide{position:absolute;right:7.6%;width:31%;height:36px;display:flex;justify-content:flex-end;align-items:center;pointer-events:none;transform:translateY(-50%)}.drag-label{background:var(--bg);border:2px solid var(--accent);border-radius:6px;padding:4px 8px;font:600 var(--fs-label)/1 var(--font-sans);color:var(--accent);white-space:nowrap}.drag-hit{position:absolute;right:5.7%;width:19px;height:19px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--accent);cursor:ns-resize;pointer-events:auto;touch-action:none}.drag-hit:focus-visible{outline:3px solid var(--text);outline-offset:4px}.mix-alert{position:absolute;right:3%;width:39%;display:flex;justify-content:center;pointer-events:none;transform:translateY(-50%);font-size:var(--fs-label);color:var(--accent);font-weight:600}.mix-alert span{background:var(--bg);padding:2px 6px;border-bottom:2px solid var(--accent)}.compare-foot{grid-column:2;display:flex;justify-content:space-between;align-items:end;padding:0 48px;font-size:var(--fs-label);color:var(--muted)}.legend-hatch{display:inline-block;width:26px;height:14px;margin-right:6px;vertical-align:-2px;background:repeating-linear-gradient(135deg,transparent 0 4px,#7A8280 4px 5px);border:1px solid var(--line)}
.widget-footer{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.claim{font-size:var(--fs-lead);line-height:1.4}.claim strong{color:var(--accent);font-weight:600}.btns{display:flex;gap:9px}.btn{font-size:var(--fs-label);min-height:38px;padding:0 14px}.btn.active{background:var(--accent);color:white;border-color:var(--accent)}.source{font-size:var(--fs-label);color:var(--muted);white-space:nowrap}.status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(prefers-reduced-motion:no-preference){.drag-guide,.mix-alert{transition:top 180ms ease}.reading .r-value{transition:color 180ms ease}}
</style>
</head>
<body data-page="06" data-total="21">
<div id="stage">
  <main class="p06" aria-labelledby="page-title">
    <header class="p06-header">
      <div><div class="kicker">WARM-LAYER DEPTH</div><h1 id="page-title">同是 29°C，暖水层越深越经得起搅拌</h1></div>
      <div class="invariant">共同条件：海面 <strong>29°C</strong>　阈值 <strong>26°C</strong><br>虚线为 <strong>40 m</strong> 搅拌深度</div>
    </header>
    <section class="warm-widget" data-warm-widget aria-label="暖水层深度比较仪器">
      <div class="instrument-rail">
        <div class="rail-title">拖动右图 <b>26°C</b> 暖层底界<br><span class="hint">看剖面、斜线面积与热含量同步变化</span></div>
        <div class="depth-control ctl"><label for="depth-range">暖层底界</label><input id="depth-range" data-depth type="range" min="30" max="100" step="1" value="100" aria-label="可调暖层的26摄氏度底界深度"><output data-depth-out>100 m</output></div>
        <div class="readouts" aria-label="热含量读数"><div class="reading"><div class="r-label">浅暖层</div><div class="r-value" data-shallow>— <span>kJ/cm²</span></div></div><div class="reading active"><div class="r-label">可调暖层</div><div class="r-value" data-deep>— <span>kJ/cm²</span></div></div></div>
      </div>
      <div class="compare-zone k-comparison">
        <div class="compare-hdr"><div class="hdr">浅暖层参照</div><div class="hdr">可调暖层 <span data-multiple></span></div></div>
        <div class="shared-dim dim"><span class="dim-title">深度（m）</span><span class="dim-note">0 — 150</span></div>
        <div class="chart-wrap min0" data-chart-wrap>
          <div class="chart" data-chart role="img" aria-label="浅暖层和可调暖层的温度深度剖面，共用20至30摄氏度温度轴和0至150米深度轴"></div>
          <svg class="profile-shade" data-shade aria-hidden="true"><defs><pattern id="warm-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="8" stroke="#7A8280" stroke-width="2" opacity=".5"/></pattern></defs><path data-shade-left></path><path data-shade-right></path></svg>
          <div class="drag-guide" data-drag-guide><span class="drag-label">拖动 26°C 底界</span><button class="drag-hit" data-handle type="button" aria-label="拖动可调暖层的26摄氏度底界" aria-valuemin="30" aria-valuemax="100" aria-valuenow="100" role="slider"></button></div>
          <div class="mix-alert" data-alert hidden><span>40 m 搅拌线下可能混入较冷水</span></div>
        </div>
        <div class="compare-foot diff"><span><i class="legend-hatch"></i>26°C 以上的热含量积分区</span><span>NOAA/AOML 口径</span></div>
      </div>
      <footer class="widget-footer"><div class="claim" data-claim aria-live="polite">相同 29°C 海面下，暖水层越深，风浪搅拌后越不容易迅速抽出冷水。</div><div class="btns"><button class="btn" data-shallow-btn type="button">浅层 · 30 m</button><button class="btn active" data-deep-btn type="button">深层 · 100 m</button></div><div class="source">有了充足海洋能量，台风就一定能把结构组织好吗？</div></footer>

    </section>
  </main>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script><script src="assets/lib/echarts.min.js"></script>
<script>
(()=>{const root=document.querySelector('[data-warm-widget]'); if(!root||!window.echarts)return;
const $=s=>root.querySelector(s), range=$('[data-depth]'),out=$('[data-depth-out]'),handle=$('[data-handle]'),guide=$('[data-drag-guide]'),alert=$('[data-alert]'),claim=$('[data-claim]'),chartEl=$('[data-chart]'),wrap=$('[data-chart-wrap]'),shade=$('[data-shade]');
const shallow=[{depthM:0,temperatureC:29},{depthM:20,temperatureC:27},{depthM:50,temperatureC:24},{depthM:150,temperatureC:20}]; const threshold=Lec.K.oceanHeatContentReferenceC; let state={depth:100}; let active=null, pending=false, destroyed=false;
const chart=echarts.init(chartEl,null,{renderer:'svg'}); const ink=Deck.token('--text'),line=Deck.token('--line'),env=Deck.token('--env'),accent=Deck.token('--accent'),panel=Deck.token('--panel'),muted=Deck.token('--muted');
function profile(d){const t=(d-30)/70;return [{depthM:0,temperatureC:29},{depthM:20+30*t,temperatureC:27+t},{depthM:d,temperatureC:26},{depthM:50+100*t,temperatureC:24-4*t}];}
function heat(p){return Lec.P.oceanHeatContent(p,threshold).heatContentJPerM2/10000000}
function option(p){const poly=q=>[[26,0],...q.filter(v=>v.depthM<=state.depth).map(v=>[v.temperatureC,v.depthM]),[26,state.depth]];const axes=(i)=>({xAxisIndex:i,yAxisIndex:i,coordinateSystem:'cartesian2d',renderItem:(params,api)=>({type:'polygon',shape:{points:poly(i? p:shallow).map(v=>api.coord(v))},style:{fill:'rgba(122,130,128,.15)',stroke:'none'}}),data:[0],silent:true,z:1});return {animation:!Deck.reduced(),animationDurationUpdate:180,textStyle:{fontFamily:Deck.token('--font-sans'),fontSize:16,color:ink},grid:[{left:'7%',top:16,width:'35%',bottom:38},{right:'7%',top:16,width:'35%',bottom:38}],xAxis:[0,1].map(i=>({type:'value',min:20,max:30,interval:2,gridIndex:i,axisLine:{lineStyle:{color:line,width:2}},axisTick:{show:false},axisLabel:{fontSize:13,fontFamily:Deck.token('--font-mono'),color:muted,formatter:'{value}°'},splitLine:{show:true,lineStyle:{color:'rgba(122,130,128,.16)'}}})),yAxis:[0,1].map(i=>({type:'value',min:0,max:150,inverse:true,interval:50,gridIndex:i,axisLine:{lineStyle:{color:line,width:2}},axisTick:{show:false},axisLabel:{fontSize:13,fontFamily:Deck.token('--font-mono'),color:muted,formatter:'{value}'},splitLine:{show:true,lineStyle:{color:'rgba(122,130,128,.16)'}}})),series:[...[[shallow,0,env],[p,1,accent]].map(([data,i,color])=>({type:'line',xAxisIndex:i,yAxisIndex:i,showSymbol:true,symbol:'circle',symbolSize:8,smooth:false,data:data.map(v=>[v.temperatureC,v.depthM]),lineStyle:{width:4,color},itemStyle:{color, borderColor:Deck.token('--bg'),borderWidth:2},z:4,markLine:{silent:true,symbol:'none',lineStyle:{color:line,type:'dashed',width:2},label:{show:false},data:[{yAxis:40}]}}))]};}
function schedule(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;render()})} function setDepth(v){state.depth=Math.max(30,Math.min(100,Math.round(v)));schedule();}
function drawShade(a,p){const w=wrap.clientWidth,h=wrap.clientHeight;shade.setAttribute('viewBox',`0 0 ${w} ${h}`);const shape=(data,index)=>{const pts=[[26,0],...data.filter(v=>v.depthM<=state.depth).map(v=>[v.temperatureC,v.depthM]),[26,state.depth]].map(v=>chart.convertToPixel({xAxisIndex:index,yAxisIndex:index},v));return 'M '+pts.map(v=>v.join(',')).join(' L ')+' Z'};$('[data-shade-left]').setAttribute('d',shape(a,0));$('[data-shade-right]').setAttribute('d',shape(p,1));}
function render(){const p=profile(state.depth), hs=heat(shallow), hd=heat(p), ratio=hd/hs;chart.setOption(option(p),true);drawShade(shallow,p);range.value=state.depth;out.textContent=state.depth+' m';handle.setAttribute('aria-valuenow',state.depth);handle.setAttribute('aria-valuetext',state.depth+' 米');$('[data-shallow]').innerHTML=hs.toFixed(0)+' <span>kJ/cm²</span>';$('[data-deep]').innerHTML=hd.toFixed(0)+' <span>kJ/cm²</span>';$('[data-multiple]').textContent='· 约 '+ratio.toFixed(1)+' 倍';const y=16+(state.depth/150)*(wrap.clientHeight-54);guide.style.top=y+'px';alert.style.top=(16+(40/150)*(wrap.clientHeight-54))+'px';alert.hidden=state.depth>40;claim.innerHTML=state.depth<=40?'暖层底界已进入 <strong>40 m</strong> 搅拌深度：搅拌更可能迅速带入低于 26°C 的水。':'相同 29°C 海面下，暖水层越深，风浪搅拌后越不容易迅速抽出冷水。';$('[data-shallow-btn]').classList.toggle('active',state.depth===30);$('[data-deep-btn]').classList.toggle('active',state.depth===100);}
function fromPointer(e){const r=wrap.getBoundingClientRect(),p=Deck.pt(wrap,e);return ((p.y-16)/Math.max(1,wrap.offsetHeight-54))*150}function down(e){active=e.pointerId;try{handle.setPointerCapture(active)}catch(_){/* synthetic pointer events have no capture target */}setDepth(fromPointer(e))}function move(e){if(e.pointerId===active)setDepth(fromPointer(e))}function end(e){if(e.pointerId!==active)return;active=null;if(handle.hasPointerCapture(e.pointerId))handle.releasePointerCapture(e.pointerId);setDepth(state.depth,true)}
handle.addEventListener('pointerdown',down);handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end);handle.addEventListener('keydown',e=>{let d=e.shiftKey?10:1;if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();e.stopPropagation();setDepth(state.depth-d,true)}if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();e.stopPropagation();setDepth(state.depth+d,true)}if(e.key==='Home'){e.preventDefault();setDepth(30,true)}if(e.key==='End'){e.preventDefault();setDepth(100,true)}});range.addEventListener('input',()=>setDepth(+range.value));range.addEventListener('change',()=>setDepth(+range.value,true));$('[data-shallow-btn]').addEventListener('click',()=>setDepth(30,true));$('[data-deep-btn]').addEventListener('click',()=>setDepth(100,true));const off=Deck.onResize(()=>chart.resize()); const resizeObserver=new ResizeObserver(()=>{chart.resize();render()});resizeObserver.observe(chartEl);render();requestAnimationFrame(()=>{chart.resize();render()});root.destroyWarmWidget=()=>{if(destroyed)return;destroyed=true;resizeObserver.disconnect();off();chart.dispose();delete root.destroyWarmWidget};
})();
Deck.init({index:6,total:21});
</script>
</body></html>
