<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="08" data-total="21">
<div id="stage">
  <style>
    #stage{--bg:#F3F1EA;--text:#263033;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E4572E;}
    .p08{height:100%;display:flex;flex-direction:column;color:var(--text);min-height:0;}
    .p08-head{display:flex;align-items:end;justify-content:space-between;gap:32px;border-bottom:2px solid var(--text);padding:3px 0 17px;}
    .p08-kicker{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.14em;color:var(--env);white-space:nowrap;}
    .p08 h1{margin:0;max-width:980px;font:600 var(--fs-h1)/1.2 var(--font-serif);letter-spacing:.02em;}
    .p08-widget{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:18px;gap:14px;}
    .p08-topline{display:flex;align-items:center;gap:20px;min-height:37px;}
    .p08-hint{margin:0;flex:1;font:var(--fs-sec)/1.4 var(--font-sans);color:var(--muted);}
    .p08-hint b{color:var(--text);font-weight:650;}
    .p08-status{min-width:370px;text-align:right;font:var(--fs-label)/1.35 var(--font-sans);color:var(--muted);}
    .p08-status strong{color:var(--accent);font-family:var(--font-mono);font-weight:700;}
    .p08-pool{display:flex;align-items:stretch;gap:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0;min-height:111px;}
    .p08-pool-label{width:112px;flex:0 0 112px;padding:8px 12px 0 0;border-right:2px solid var(--text);font:650 var(--fs-label)/1.3 var(--font-sans);}
    .p08-pool-label small{display:block;margin-top:7px;color:var(--muted);font:var(--fs-tick)/1.35 var(--font-sans);}
    .p08-card-area{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-content:center;gap:10px;}
    .p08-drop-pool.is-over{outline:2px dashed var(--accent);outline-offset:3px;}
    .p08-card{appearance:none;position:relative;min-height:70px;flex:1 1 210px;max-width:280px;padding:10px 13px;border:2px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);text-align:left;cursor:grab;font:650 var(--fs-sec)/1.28 var(--font-sans);transition:border-color 160ms ease,transform 160ms ease,background 160ms ease;}
    .p08-card:hover,.p08-card:focus-visible,.p08-card.is-selected{border-color:var(--accent);outline:none;box-shadow:inset 0 0 0 1px var(--accent);}
    .p08-card.is-selected::after{content:"已选";position:absolute;right:9px;top:8px;color:var(--accent);font:600 var(--fs-tick)/1 var(--font-mono);}
    .p08-card.is-dragging{opacity:.42;cursor:grabbing;}
    .p08-card.is-placed{flex:0 0 auto;max-width:none;width:100%;min-height:0;padding:9px 11px 8px;border-color:var(--text);cursor:grab;}
    .p08-card .cause{display:block;margin-top:5px;color:var(--muted);font:var(--fs-label)/1.35 var(--font-sans);font-weight:400;}
    .p08-card.is-error{border-color:var(--accent);animation:p08-shake 220ms linear;}
    @keyframes p08-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
    .p08-columns{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;}
    .p08-col{display:flex;flex-direction:column;min-width:0;border-top:4px solid var(--text);padding-top:10px;}
    .p08-col.direction{border-top-style:dashed;}
    .p08-col.is-complete{border-color:var(--accent);}
    .p08-col-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
    .p08-lv{color:var(--muted);font:600 var(--fs-tick)/1 var(--font-mono);letter-spacing:.09em;}
    .p08-col h2{margin:0;font:650 var(--fs-h2)/1.2 var(--font-sans);}
    .p08-box{flex:1;min-height:136px;margin-top:10px;padding:10px;border:2px solid var(--line);border-radius:6px;background:var(--panel);display:flex;flex-direction:column;gap:9px;transition:border-color 160ms ease,background 160ms ease;}
    .p08-box.is-over{border:3px dashed var(--accent);padding:9px;background:#ddd9ce;}
    .p08-box .empty{margin:10px 2px auto;color:var(--muted);font:var(--fs-sec)/1.4 var(--font-sans);}
    .p08-guide{padding:10px;border-left:4px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font:var(--fs-label)/1.38 var(--font-sans);}
    .p08-guide b{display:block;margin-bottom:7px;color:var(--text);font-weight:650;}
    .p08-tests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
    .p08-test{min-height:53px;padding:7px 6px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:600 var(--fs-label)/1.25 var(--font-sans);}
    .p08-test small{display:block;margin-top:4px;color:var(--muted);font:var(--fs-tick)/1.2 var(--font-sans);}
    .p08-slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:9px;}
    .p08-slot{min-height:48px;padding:8px;border:1px dashed var(--line);color:var(--muted);font:var(--fs-label)/1.25 var(--font-sans);}
    .p08-slot{font-weight:650;}
    .p08-slot b{margin:0 0 3px;color:var(--text);font:650 var(--fs-label)/1.2 var(--font-sans);}
    .p08-field{display:flex;align-items:center;justify-content:space-around;gap:8px;min-height:110px;margin-top:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
    .p08-mark{flex:1;min-height:82px;padding:10px 6px;border-left:2px solid var(--line);text-align:center;color:var(--muted);font:var(--fs-label)/1.3 var(--font-sans);}
    .p08-mark:first-child{border-left:0;}
    .p08-mark{color:var(--text);font:650 var(--fs-sec)/1.35 var(--font-sans);}
    .p08-guide.is-compact .p08-field{min-height:48px;margin-top:6px;}
    .p08-guide.is-compact .p08-mark{min-height:0;padding:5px 3px;font-size:var(--fs-label);}
    .p08-guide.is-compact .p08-slots{margin-top:5px;}
    .p08-guide.is-compact .p08-slot{min-height:25px;padding:4px;font-size:var(--fs-tick);}
    .p08-guide.is-compact .p08-slot b{margin:0;font-size:var(--fs-tick);}
    .p08-guide.is-compact .p08-slot br{display:none;}
    .p08-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:54px;padding-top:10px;}
    .p08-count{margin:0;color:var(--muted);font:var(--fs-label)/1.35 var(--font-sans);}
    .p08-count strong{color:var(--text);font-family:var(--font-mono);}
    .p08-controls{display:flex;align-items:center;gap:8px;}
    .p08-controls .ctl{margin-right:2px;color:var(--muted);font:var(--fs-label)/1 var(--font-sans);}
    .p08 .btn{min-height:36px;padding:6px 13px;border:2px solid var(--text);border-radius:6px;background:transparent;color:var(--text);font:600 var(--fs-label)/1.1 var(--font-sans);cursor:pointer;}
    .p08 .btn:hover,.p08 .btn:focus-visible{border-color:var(--accent);color:var(--accent);outline:none;}
    .p08 .btn[disabled]{opacity:.42;cursor:not-allowed;}
    .p08 .btn.return{border-style:dashed;}
    .p08-feedback{margin:0;min-height:25px;text-align:right;color:var(--accent);font:var(--fs-label)/1.35 var(--font-sans);}
    .p08-feedback:empty{visibility:hidden;}
    .p08-reveal{display:none;margin-top:2px;padding:12px 0 0;border-top:2px solid var(--accent);align-items:baseline;gap:18px;}
    .p08-reveal.show{display:flex;}
    .p08-reveal b{flex:0 0 auto;color:var(--accent);font:650 var(--fs-label)/1.3 var(--font-mono);}
    .p08-reveal p{margin:0;font:var(--fs-lead)/1.4 var(--font-sans);}
    .p08-next{margin-left:auto;color:var(--muted);font:var(--fs-sec)/1.35 var(--font-sans);}
    @media (prefers-reduced-motion:reduce){.p08 *{transition:none!important;animation:none!important}}
  </style>
  <main class="p08" data-sorter>
    <header class="p08-head">
      <div class="p08-kicker">CAUSE SORT</div>
      <h1>暖海能供能，却不能替台风决定方向</h1>
    </header>
    <section class="p08-widget k-classification" aria-label="条件归类互动">
      <div class="p08-topline">
        <p class="p08-hint hint"><b>拖动卡片</b>到归属区；或先点选卡片，再按下方类别按钮。已放入的卡可拖回卡池重选。</p>
        <div class="p08-status" data-status-text>先判断：这些条件在影响什么？</div>
      </div>
      <div class="p08-pool p08-drop-pool" data-drop="pool" aria-label="待分类卡池">
        <div class="p08-pool-label">条件卡池<small>4 张，固定顺序</small></div>
        <div class="p08-card-area" data-card-area="pool" role="list" aria-label="待分类条件"></div>
      </div>
      <div class="p08-columns triptych">
        <article class="p08-col" data-col="energy">
          <div class="p08-col-head"><span class="p08-lv">归属区 A</span><h2>能量条件</h2></div>
          <div class="p08-box box" data-drop="energy" role="list" aria-label="能量条件归属区"></div>
          <p class="p08-count" data-count="energy">帮助维持或增强</p>
        </article>
        <article class="p08-col" data-col="limit">
          <div class="p08-col-head"><span class="p08-lv">归属区 B</span><h2>限制条件</h2></div>
          <div class="p08-box box" data-drop="limit" role="list" aria-label="限制条件归属区"></div>
          <p class="p08-count" data-count="limit">妨碍能量组织成台风结构</p>
        </article>
        <article class="p08-col direction" data-col="direction">
          <div class="p08-col-head"><span class="p08-lv">归属区 C</span><h2>路径方向</h2></div>
          <div class="p08-box box" data-drop="direction" role="list" aria-label="路径方向归属区"></div>
          <p class="p08-count" data-count="direction">直接决定往哪里走？</p>
        </article>
      </div>
      <div class="p08-footer">
        <div>
          <div class="p08-controls" aria-label="键盘放置控制">
            <span class="ctl">选中后放入</span>
            <button class="btn" type="button" data-place="energy">能量条件</button>
            <button class="btn" type="button" data-place="limit">限制条件</button>
            <button class="btn" type="button" data-place="direction">路径方向</button>
            <button class="btn return" type="button" data-return>移回卡池</button>
            <button class="btn" type="button" data-reset hidden>重新分类</button>
          </div>
          <p class="p08-feedback" data-feedback aria-live="polite"></p>
        </div>
        <p class="p08-count"><strong data-progress>0 / 4</strong> 已正确归类</p>
      </div>
      <div class="p08-reveal" data-reveal>
        <b>这里故意是空的</b>
        <p>暖海、深暖层是能量条件；强风切变、登陆是限制条件；它们都不直接等于路径方向。</p>
        <span class="p08-next">那么，真正推动台风中心移动的量是什么？</span>
      </div>
    </section>
  </main>
  <script>
  (()=>{
    const script=document.currentScript, root=script.previousElementSibling;
    if(!root || !root.matches('[data-sorter]')) return;
    const cards=[
      {id:'warm',label:'较暖海面',correct:'energy',cause:'可增大海气能量与水汽交换潜力'},
      {id:'deep',label:'较深暖水层',correct:'energy',cause:'搅拌后较不易迅速抽出冷水'},
      {id:'shear',label:'较强垂直风切变',correct:'limit',cause:'使台风上下结构较难保持对齐'},
      {id:'land',label:'台风中心进入陆地',correct:'limit',cause:'海洋供能中断，地表摩擦增大'}
    ];
    const initial=()=>({placed:{},selected:null,feedback:'',error:null,complete:false});
    let state=initial(), dragId=null, timer=0, destroyed=false;
    const pool=root.querySelector('[data-card-area="pool"]');
    const boxes=Object.fromEntries(['energy','limit','direction'].map(k=>[k,root.querySelector(`[data-drop="${k}"]`)]));
    const feedback=root.querySelector('[data-feedback]'), live=feedback, progress=root.querySelector('[data-progress]'), status=root.querySelector('[data-status-text]'), reveal=root.querySelector('[data-reveal]'), reset=root.querySelector('[data-reset]');
    function card(id){return cards.find(c=>c.id===id)}
    function selectedCard(){return state.selected&&card(state.selected)}
    function dispatch(action){
      if(destroyed)return;
      if(action.type==='select') state={...state,selected:state.selected===action.id?null:action.id,feedback:'',error:null};
      if(action.type==='attempt') attempt(action.id,action.target);
      if(action.type==='return'){const placed={...state.placed};delete placed[action.id];state={...state,placed,selected:null,feedback:'',error:null,complete:false};}
      if(action.type==='reset'){clearTimeout(timer);state=initial();}
      render();
    }
    function attempt(id,target){
      const c=card(id); if(!c || state.placed[id])return;
      if(c.correct!==target){
        clearTimeout(timer); state={...state,feedback:'它影响的是供能或结构，不是这一类。',error:id};
        live.textContent=`${c.label}没有放入这里：它影响的是供能或结构，不是这一类。`;
        timer=setTimeout(()=>{if(!destroyed){state={...state,feedback:'',error:null};render()}},500); return;
      }
      const placed={...state.placed,[id]:target};
      const complete=cards.every(x=>placed[x.id]);
      state={...state,placed,selected:null,feedback:complete?'四张条件都已归类。看右栏：没有一张属于路径方向。':'归类成功：'+c.cause,error:null,complete};
      live.textContent=complete?'四张条件已正确归类。路径方向区为空：本页四项都不是方向盘。':`${c.label}已归入${target==='energy'?'能量条件':'限制条件'}。${c.cause}`;
    }
    function makeCard(c,placed){
      const b=document.createElement('button'); b.type='button';b.className='p08-card bt'+(state.selected===c.id?' is-selected':'')+(state.error===c.id?' is-error':'')+(placed?' is-placed':'');
      b.draggable=true;b.dataset.card=c.id;b.setAttribute('role','listitem');b.setAttribute('aria-pressed',state.selected===c.id?'true':'false');
      b.innerHTML=`<span>${c.label}</span>${placed?`<span class="cause">${c.cause}</span>`:''}`; return b;
    }
    function guide(kind,hasCard){
      const el=document.createElement('div');el.className='p08-guide'+(hasCard?' is-compact':'');
      const text={
        energy:['判别线',[['海气交换','能量与水汽'],['暖水保存','不易抽冷水'],['结果','维持或增强']]],
        limit:['判别线',[['供能','可能中断'],['结构','可能错位'],['结果','难以维持']]],
        direction:['判别线',[['直接去向？','需要检验'],['本页卡池','逐张检查'],['完成后','应为 0 张']]]
      }[kind];
      const slots=`<div class="p08-slots"><div class="p08-slot"><b>${kind==='direction'?'方向卡？':'卡槽 1'}</b><br>${kind==='direction'?'逐张检验':'等待归属'}</div><div class="p08-slot"><b>${kind==='direction'?'仍为空？':'卡槽 2'}</b><br>${kind==='direction'?'保留证据':'等待归属'}</div></div>`;
      const field={energy:[['海面','↑','交换'],['暖水','≈','保存'],['强度','＋','维持']],limit:[['供能','×','削弱'],['上下','≠','错位'],['结构','−','难维持']],direction:[['去向','？','待检验'],['本页','0','已预留'],['空置','□','作证据']]}[kind].map(x=>`<div class="p08-mark">${x.join(' ')}</div>`).join('');
      el.innerHTML=`<b>${text[0]}</b><div class="p08-tests">${text[1].map(x=>`<div class="p08-test">${x.join(' · ')}</div>`).join('')}</div>${slots}${field?`<div class="p08-field">${field}</div>`:''}`;return el;
    }
    function render(){
      pool.replaceChildren(); Object.entries(boxes).forEach(([k,b])=>{b.replaceChildren();b.appendChild(guide(k,Object.values(state.placed).includes(k)))});
      cards.forEach(c=>{const where=state.placed[c.id];(where?boxes[where]:pool).appendChild(makeCard(c,where));});
      ['energy','limit','direction'].forEach(k=>{
        if(boxes[k].children.length===1){const e=document.createElement('p');e.className='empty';e.textContent=k==='direction'&&state.complete?'这里故意是空的':'将条件卡放到这里';boxes[k].appendChild(e)}
      });
      const n={energy:0,limit:0,direction:0};Object.values(state.placed).forEach(v=>{if(v)n[v]++});
      root.querySelector('[data-count="energy"]').textContent=n.energy===2?'2 张：提供或保存海洋能量':'帮助维持或增强';
      root.querySelector('[data-count="limit"]').textContent=n.limit===2?'2 张：削弱供能或破坏结构':'妨碍能量组织成台风结构';
      root.querySelector('[data-count="direction"]').textContent=state.complete?'0 张：本页四项都不是方向盘':'直接决定往哪里走？';
      progress.textContent=`${Object.keys(state.placed).length} / 4`; feedback.textContent=state.feedback;
      status.innerHTML=state.complete?'<strong>发现：</strong> 路径方向区保持空置。':'先判断：这些条件在影响什么？';
      root.querySelector('[data-col="direction"]').classList.toggle('is-complete',state.complete);reveal.classList.toggle('show',state.complete);reset.hidden=!state.complete;
      const s=selectedCard(); root.querySelectorAll('[data-place]').forEach(b=>b.disabled=!s||!!state.placed[s.id]); root.querySelector('[data-return]').disabled=!s||!state.placed[s.id];
    }
    function targetFrom(e){const z=e.target.closest('[data-drop]');return z&&z.dataset.drop}
    root.addEventListener('click',e=>{
      const c=e.target.closest('[data-card]');if(c){dispatch({type:'select',id:c.dataset.card});return}
      const p=e.target.closest('[data-place]');if(p&&state.selected)dispatch({type:'attempt',id:state.selected,target:p.dataset.place});
      if(e.target.closest('[data-return]')&&state.selected)dispatch({type:'return',id:state.selected});
      if(e.target.closest('[data-reset]'))dispatch({type:'reset'});
    });
    root.addEventListener('keydown',e=>{if(e.target.matches('[data-card]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopPropagation();dispatch({type:'select',id:e.target.dataset.card})}});
    root.addEventListener('dragstart',e=>{const c=e.target.closest('[data-card]');if(!c)return;dragId=c.dataset.card;e.dataTransfer.effectAllowed='move';requestAnimationFrame(()=>c.classList.add('is-dragging'))});
    root.addEventListener('dragend',e=>{dragId=null;root.querySelectorAll('.is-dragging,.is-over').forEach(x=>x.classList.remove('is-dragging','is-over'))});
    root.addEventListener('dragover',e=>{const t=targetFrom(e);if(!t)return;e.preventDefault();root.querySelectorAll('.is-over').forEach(x=>x.classList.remove('is-over'));e.target.closest('[data-drop]').classList.add('is-over')});
    root.addEventListener('dragleave',e=>{const z=e.target.closest('[data-drop]');if(z)z.classList.remove('is-over')});
    root.addEventListener('drop',e=>{const t=targetFrom(e);if(!t||!dragId)return;e.preventDefault();if(t==='pool')dispatch({type:'return',id:dragId});else dispatch({type:'attempt',id:dragId,target:t});});
    render();
    root.destroySorter=()=>{if(destroyed)return;destroyed=true;clearTimeout(timer);dragId=null;delete root.destroySorter};
  })();
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
