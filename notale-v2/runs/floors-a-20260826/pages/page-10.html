<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="10" data-total="21">
<div id="stage">
  <style>
    #stage{padding:28px 56px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;overflow:hidden}
    .p10-head{display:flex;align-items:end;justify-content:space-between;gap:40px;border-bottom:2px solid var(--line);padding-bottom:15px;flex:0 0 auto}
    .p10-kicker{font:600 var(--fs-label) var(--font-mono);letter-spacing:.12em;color:var(--env);margin-bottom:7px}
    .p10-head h1{font:600 var(--fs-h1) / 1.22 var(--font-serif);letter-spacing:.01em;margin:0;max-width:1050px}
    .p10-headnote{font:var(--fs-sec)/1.4 var(--font-sans);color:var(--muted);max-width:240px;margin-bottom:2px}
    .steering-widget{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;color:var(--text)}
    .sw-rail{display:flex;align-items:center;gap:16px;min-height:47px;flex:0 0 auto}
    .sw-rail .hint{font:var(--fs-sec)/1.4 var(--font-sans);color:var(--muted);min-width:0}
    .sw-choices{display:flex;gap:10px;align-items:center;margin-left:auto}
    .sw-choice{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1.5px solid var(--line);border-radius:6px;background:transparent;font:var(--fs-label) var(--font-sans);white-space:nowrap;cursor:pointer}
    .sw-choice:has(input:checked){border-color:var(--env);background:color-mix(in srgb,var(--env) 9%,transparent)}
    .sw-choice input{accent-color:var(--env);width:17px;height:17px;margin:0}
    .sw-choice:focus-within{outline:3px solid var(--focus);outline-offset:2px}
    .sw-reset{font-size:var(--fs-label);white-space:nowrap}
    .sw-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:stretch}
    .sw-model{position:relative;min-width:0;min-height:0;border:2px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden}
    .sw-model svg{width:100%;height:100%;display:block}
    .sw-side{min-width:0;display:flex;flex-direction:column;gap:15px}
    .sw-result{padding:18px 20px;border:2px solid var(--env);border-radius:6px;background:var(--panel)}
    .sw-result .tag{display:inline-block;margin-bottom:12px;color:var(--env);font:600 var(--fs-label) var(--font-mono)}
    .sw-equation{font:600 var(--fs-h2)/1.45 var(--font-sans);letter-spacing:.01em}
    .sw-num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--env);white-space:nowrap}
    .sw-sub{padding:15px 18px;border-left:3px solid var(--line);font:var(--fs-sec)/1.5 var(--font-sans);color:var(--muted)}
    .sw-key{margin-top:auto;padding-top:13px;border-top:1px solid var(--line);display:grid;gap:10px;font:var(--fs-label)/1.35 var(--font-sans)}
    .sw-key .li{display:flex;align-items:center;gap:10px}.sw-key .sw{display:inline-block;width:34px;border-top:3px solid var(--env)}.sw-key .sw.dash{border-top-style:dashed;border-color:var(--line)}
    .sw-foot{flex:0 0 auto;display:flex;align-items:start;justify-content:space-between;gap:50px;border-top:2px solid var(--line);padding-top:13px}
    .sw-take{font:var(--fs-lead)/1.4 var(--font-serif);max-width:960px}.sw-next{font:var(--fs-sec)/1.4 var(--font-sans);color:var(--muted);max-width:370px;text-align:right}
    .sw-status{min-height:20px;flex:0 0 164px;font:var(--fs-label) var(--font-sans);color:var(--accent)}
    .svg-label{font:15px var(--font-sans);fill:var(--text)}.svg-small{font:13px var(--font-mono);fill:var(--muted)}.svg-layer{font:600 17px var(--font-sans);fill:var(--text)}.svg-pressure{font:14px var(--font-mono);fill:var(--muted)}
    .wind-line{stroke:var(--env);stroke-width:4;stroke-linecap:round;marker-end:url(#sw-arrow)}.wind-line.off{stroke:var(--line);stroke-dasharray:8 7;marker-end:url(#sw-arrow-off);opacity:.8}.wind-line.flash{stroke:var(--accent);stroke-width:6}
    .layer-box{fill:var(--bg);fill-opacity:.38;stroke:var(--line);stroke-width:2}.layer-box.off{stroke-dasharray:8 6}.layer-divider{stroke:var(--line);stroke-width:2}.route{stroke:var(--line);stroke-width:2;fill:none}.route.active{stroke:var(--env);stroke-width:3}.sum-line{stroke:var(--env);stroke-width:6;stroke-linecap:round;marker-end:url(#sw-arrow-sum)}.sum-dot{fill:var(--env);stroke:var(--bg);stroke-width:3}.origin-dot{fill:var(--text)}
    .storm{fill:none;stroke:var(--text);stroke-width:2.4;stroke-linecap:round}.storm-note{font:14px var(--font-sans);fill:var(--muted)}
    @media (prefers-reduced-motion:no-preference){.wind-line,.layer-box,.route,.sum-line,.sum-dot{transition:all 260ms ease}.wind-line.flash{transition:stroke 100ms ease}}
  </style>
  <header class="p10-head">
    <div><div class="p10-kicker">E2 · STEERING WIND</div><h1>台风不是听从某一层风，而是随多层环境风的加权结果移动</h1></div>
    <div class="p10-headnote">同一原点 · 同一尺度<br>1 m/s = 24 px</div>
  </header>
  <section class="steering-widget" data-steering-widget aria-label="三层环境风合成仪">
    <div class="sw-rail">
      <div class="hint">勾选或取消气层，比较单层风与综合引导风。</div>
      <div class="sw-status" data-status aria-live="polite"></div>
      <div class="sw-choices" role="group" aria-label="选择参与合成的气层">
        <label class="sw-choice"><input type="checkbox" data-layer="low" checked>低层环境风</label>
        <label class="sw-choice"><input type="checkbox" data-layer="mid" checked>中层环境风</label>
        <label class="sw-choice"><input type="checkbox" data-layer="high" checked>高层环境风</label>
      </div>
      <button type="button" class="btn sw-reset" data-reset>恢复三层</button>
    </div>
    <div class="sw-main">
      <div class="sw-model min0">
        <svg viewBox="0 0 980 600" role="img" aria-labelledby="sw-title sw-desc" data-svg>
          <title id="sw-title">三层环境风汇合为综合引导风</title><desc id="sw-desc">高层、中层、低层环境风共享每秒二十四像素的尺度。勾选气层后，连接线汇入综合引导风。</desc>
          <defs><marker id="sw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#176B78"/></marker><marker id="sw-arrow-off" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7A8280"/></marker><marker id="sw-arrow-sum" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#176B78"/></marker></defs>
          <text x="43" y="35" class="svg-small">大气柱（向上为北，向右为东）</text>
          <g data-row="high"><rect class="layer-box" x="36" y="52" width="560" height="132" rx="6"/><text x="58" y="87" class="svg-layer">高层环境风</text><text x="58" y="110" class="svg-pressure">200 hPa · 权重 0.25</text><line class="wind-line" data-vector="high" x1="326" y1="140" x2="422" y2="0"/><circle class="origin-dot" cx="326" cy="140" r="5"/><text data-vlabel="high" class="svg-small" x="0" y="0"></text></g>
          <g data-row="mid"><rect class="layer-box" x="36" y="184" width="560" height="132" rx="0"/><text x="58" y="219" class="svg-layer">中层环境风</text><text x="58" y="242" class="svg-pressure">500 hPa · 权重 0.50</text><line class="wind-line" data-vector="mid" x1="326" y1="272" x2="446" y2="224"/><circle class="origin-dot" cx="326" cy="272" r="5"/><text data-vlabel="mid" class="svg-small" x="0" y="0"></text></g>
          <g data-row="low"><rect class="layer-box" x="36" y="316" width="560" height="132" rx="0"/><text x="58" y="351" class="svg-layer">低层环境风</text><text x="58" y="374" class="svg-pressure">850 hPa · 权重 0.25</text><line class="wind-line" data-vector="low" x1="326" y1="404" x2="374" y2="380"/><circle class="origin-dot" cx="326" cy="404" r="5"/><text data-vlabel="low" class="svg-small" x="0" y="0"></text></g>
          <path class="route" data-route="high" d="M570 140 H650 V485"/><path class="route" data-route="mid" d="M570 272 H675 V485"/><path class="route" data-route="low" d="M570 404 H700 V485"/>
          <line class="layer-divider" x1="36" y1="184" x2="596" y2="184"/><line class="layer-divider" x1="36" y1="316" x2="596" y2="316"/>
          <g><rect x="735" y="66" width="205" height="152" rx="6" fill="var(--bg)" fill-opacity=".35" stroke="var(--line)" stroke-width="2"/><path class="storm" d="M842 106c-34-7-42 39-13 49 28 10 48-29 24-49-26-22-58 10-41 41 17 31 71 4 55-38"/><circle cx="842" cy="132" r="4" fill="var(--accent)"/><text x="767" y="184" class="storm-note">自身环流 ≠ 平移箭头</text></g>
          <g><rect x="636" y="485" width="304" height="84" rx="6" fill="var(--bg)" fill-opacity=".45" stroke="var(--env)" stroke-width="2"/><text x="658" y="514" class="svg-label">综合引导风（加权后）</text><line class="sum-line" data-sum x1="704" y1="548" x2="800" y2="476"/><circle class="sum-dot" data-sumdot cx="704" cy="548" r="6"/><text class="svg-small" data-sumlabel x="812" y="480"></text></g>
        </svg>
      </div>
      <aside class="sw-side min0">
        <div class="sw-result"><div class="tag">计算结果</div><div class="sw-equation">综合引导风 =<br>东向 <span class="sw-num" data-east>4.0</span> m/s，<br>北向 <span class="sw-num" data-north>3.0</span> m/s</div></div>
        <div class="sw-sub">这是用于理解“多层加权”的教学风场；真实权重会随台风结构和环境改变。</div>
        <div class="sw-key"><div class="li"><i class="sw"></i>参与合成的环境风</div><div class="li"><i class="sw dash"></i>未参与的层（权重置零）</div></div>
      </aside>
    </div>
    <footer class="sw-foot"><div class="sw-take">低、中、高层风共同形成综合引导；台风自身的旋转不等于中心的平移。</div><div class="sw-next">如果这支综合箭头保持 24 小时，路径点会落到多远之外？</div></footer>
  </section>
  <script>
  window.addEventListener('DOMContentLoaded',()=>{
    const root=document.querySelector('[data-steering-widget]');
    const layers={high:{name:'高层',east:4,north:7,weight:.25},mid:{name:'中层',east:5,north:2,weight:.5},low:{name:'低层',east:2,north:1,weight:.25}};
    const initial={high:true,mid:true,low:true}; let state={selected:{...initial},flash:null}; let timer=0,destroyed=false;
    const q=s=>root.querySelector(s), qa=s=>[...root.querySelectorAll(s)]; const inputs=qa('input[data-layer]');
    const view={east:q('[data-east]'),north:q('[data-north]'),status:q('[data-status]'),sum:q('[data-sum]'),sumdot:q('[data-sumdot]'),sumlabel:q('[data-sumlabel]')};
    function active(){return Object.keys(layers).filter(k=>state.selected[k])}
    function calc(){const on=active(), total=on.reduce((n,k)=>n+layers[k].weight,0); const arr=Object.entries(layers).map(([key,v])=>({eastMps:v.east,northMps:v.north,weight:state.selected[key]?v.weight/total:0})); const r=Lec.P.steeringWind(arr); return {east:Number(r.eastMps),north:Number(r.northMps)} }
    function render(){const r=calc(); view.east.textContent=r.east.toFixed(1);view.north.textContent=r.north.toFixed(1); const x=704+r.east*24,y=548-r.north*24; view.sum.setAttribute('x2',x);view.sum.setAttribute('y2',y);view.sumdot.setAttribute('cx',704);view.sumdot.setAttribute('cy',548);view.sumlabel.setAttribute('x',x+12);view.sumlabel.setAttribute('y',y-8);view.sumlabel.textContent=`东 ${r.east.toFixed(1)} · 北 ${r.north.toFixed(1)} m/s`;
      Object.entries(layers).forEach(([key,v])=>{const selected=state.selected[key], line=q(`[data-vector="${key}"]`), row=q(`[data-row="${key}"]`), route=q(`[data-route="${key}"]`); const origin={high:[326,140],mid:[326,272],low:[326,404]}[key], ex=origin[0]+v.east*24,ey=origin[1]-v.north*24; line.setAttribute('x2',ex);line.setAttribute('y2',ey);line.classList.toggle('off',!selected);line.classList.toggle('flash',state.flash===key);row.querySelector('.layer-box').classList.toggle('off',!selected);route.classList.toggle('active',selected);const lab=q(`[data-vlabel="${key}"]`);lab.setAttribute('x',ex+9);lab.setAttribute('y',ey-7);lab.textContent=`东 ${v.east} · 北 ${v.north} m/s`;});
      inputs.forEach(i=>i.checked=state.selected[i.dataset.layer]);
    }
    function dispatch(key,checked){if(destroyed)return;if(!checked&&active().length===1){view.status.textContent='至少选择一个气层';render();return} state.selected[key]=checked;view.status.textContent=`${layers[key].name}环境风${checked?'加入':'移出'}合成`;clearTimeout(timer);state.flash=Deck.reduced()?null:key;if(!Deck.reduced())timer=setTimeout(()=>{state.flash=null;render()},400);render()}
    function onChange(e){dispatch(e.target.dataset.layer,e.target.checked)} function reset(){clearTimeout(timer);state={selected:{...initial},flash:null};view.status.textContent='已恢复三层环境风';render()}
    inputs.forEach(i=>i.addEventListener('change',onChange));q('[data-reset]').addEventListener('click',reset);render();
    root.destroySteeringWidget=()=>{if(destroyed)return;destroyed=true;clearTimeout(timer);inputs.forEach(i=>i.removeEventListener('change',onChange));q('[data-reset]').removeEventListener('click',reset);delete root.destroySteeringWidget};
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
