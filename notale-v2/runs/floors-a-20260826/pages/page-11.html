<style>

.p11-head{display:flex;align-items:end;justify-content:space-between;gap:32px;flex:0 0 116px;border-bottom:2px solid var(--line);padding-bottom:14px}

.p11-rail strong{font-family:var(--font-mono);color:var(--env);font-size:18px}.p11-rail .hint{margin-left:auto;color:var(--muted);font-size:var(--fs-label)}

.p11-side{min-width:0;display:flex;flex-direction:column;gap:12px}.p11-side .panel{border-radius:6px;padding:17px 18px}.p11-now{flex:0 0 auto}.p11-eyebrow{margin:0 0 7px;color:var(--muted);font-size:var(--fs-label)}.p11-time{font:600 42px/1 var(--font-mono);color:var(--text);letter-spacing:-.04em}.p11-time span{font-size:20px;letter-spacing:0}.p11-distance{margin-top:8px;color:var(--env);font:600 24px/1.1 var(--font-mono)}
.p11-readings{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:15px}.p11-reading{padding-bottom:12px;border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent)}.p11-reading:last-child{border:0;padding-bottom:0}.p11-reading label{display:block;color:var(--muted);font-size:var(--fs-label);margin-bottom:4px}.p11-reading output{display:block;color:var(--text);font:600 21px/1.15 var(--font-mono);font-variant-numeric:tabular-nums}.p11-reading output em{font-style:normal;color:var(--env)}
.p11-controls{flex:0 0 auto;padding:15px 18px 16px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}.p11-controls label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;color:var(--text);font-size:var(--fs-label)}.p11-controls output{font:600 18px/1 var(--font-mono);color:var(--accent)}.p11-controls input{width:100%;accent-color:var(--accent)}.p11-buttons{display:flex;gap:9px;align-items:center;margin-top:14px}.p11-buttons .btn{font-size:var(--fs-label);padding:7px 11px}.p11-buttons .hint{font-size:var(--fs-tick);color:var(--muted);line-height:1.3}
.p11-foot{flex:0 0 76px;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:36px;border-top:2px solid var(--line);padding-top:12px}.p11-take{margin:0;font:var(--fs-lead)/1.4 var(--font-serif)}.p11-next{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}.p11-next b{color:var(--text)}

</style>
