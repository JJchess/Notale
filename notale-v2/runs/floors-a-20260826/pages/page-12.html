<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F3F1EA;--text:#263033;--font-sans:"Noto Sans SC",system-ui,sans-serif;--paper:#F3F1EA}
*{box-sizing:border-box}
#stage{display:flex;flex-direction:column;gap:0;padding:28px 56px;background:var(--bg);overflow:hidden}
.page-head{height:106px;flex:0 0 106px;display:flex;align-items:flex-start;border-bottom:2px solid var(--text);padding:4px 0 18px}
.kicker{font-size:var(--fs-label);line-height:1.35;letter-spacing:.11em;color:var(--env);font-weight:700;margin:0 0 7px}
h1{font-family:var(--font-serif);font-size:var(--fs-h1);line-height:1.16;letter-spacing:.01em;margin:0;font-weight:700}
.main.split-lr{flex:1;min-height:0;display:flex;padding-top:24px}
.left,.right{min-width:0;min-height:0;position:relative}
.left{width:39%;padding:0 40px 0 4px;border-right:2px solid var(--line)}
.right{width:61%;padding:0 0 0 44px;display:flex;flex-direction:column}
.section-label{font-size:var(--fs-label);line-height:1.35;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 12px}
.claim{font-family:var(--font-serif);font-size:var(--fs-h2);line-height:1.28;font-weight:700;margin:0;color:var(--text)}
.claim-rule{height:4px;background:var(--env);width:100%;margin-top:16px}
.airfield{height:400px;margin-top:18px;position:relative}
.airfield svg{width:100%;height:100%;display:block;overflow:visible}
.airfield text,.chain svg text{font-family:var(--font-sans);fill:var(--text)}
.note-pair{margin:3px 0 0 16px;padding-left:17px;border-left:3px solid var(--accent);font-size:var(--fs-sec);line-height:1.55;color:var(--text)}
.note-pair strong{font-weight:700;color:var(--accent)}
.left-foot{position:absolute;left:4px;right:40px;bottom:2px;border-top:2px solid var(--line);padding-top:13px;font-size:var(--fs-sec);line-height:1.42;color:var(--muted)}
.right .claim{max-width:850px}.right .claim-rule{margin-top:16px}
.chain{flex:1;min-height:0;position:relative;padding-top:22px}
.chain svg{width:100%;height:100%;display:block;overflow:visible}
.chain .node{position:absolute;background:var(--bg);font-size:var(--fs-label);line-height:1.35;font-weight:700;padding:5px 9px;white-space:nowrap}
.n-earth{left:1%;top:9%;border-left:4px solid var(--env)}
.n-coriolis{left:23%;top:9%;border-left:4px solid var(--env)}
.n-gradient{left:23%;top:35%;border-left:4px solid var(--line)}
.n-wind{left:52%;top:22%;border-left:4px solid var(--env)}
.n-steer{left:69%;top:22%;border-left:4px solid var(--env)}
.n-path{left:83%;top:22%;border-left:4px solid var(--env)}
.boundary{position:absolute;left:21%;top:66%;width:68%;padding:13px 16px 12px 20px;border-top:2px solid var(--accent);font-size:var(--fs-sec);line-height:1.4;color:var(--text)}
.boundary b{color:var(--accent)}
.bottom-note{flex:0 0 auto;margin:0 0 2px;padding:14px 0 3px;border-top:2px solid var(--text);font-family:var(--font-serif);font-size:var(--fs-lead);line-height:1.35;font-weight:700}
.next{flex:0 0 auto;display:flex;align-items:baseline;gap:13px;padding-top:13px;font-size:var(--fs-sec);line-height:1.35;color:var(--muted)}
.next b{font-size:var(--fs-label);letter-spacing:.08em;color:var(--env)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body data-page="12" data-total="21">
<div id="stage">
  <header class="page-head">
    <div><p class="kicker">方向机制 · 作用边界</p><h1>地球自转塑造风场，却不替每次转弯下命令</h1></div>
  </header>
  <main class="main split-lr min0" aria-label="科里奥利效应的作用边界">
    <section class="left min0" aria-labelledby="rule-title">
      <p class="section-label">作用规则</p>
      <h2 class="claim" id="rule-title">科里奥利效应作用于<br>运动空气</h2>
      <div class="claim-rule" aria-hidden="true"></div>
      <div class="airfield" aria-label="空气原有运动与侧向偏转作用示意">
        <svg viewBox="0 0 500 400" role="img" aria-label="运动空气向前，侧向受到科里奥利偏转作用">
          <defs><marker id="arrow-env" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#176B78"/></marker><marker id="arrow-accent" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#E4572E"/></marker></defs>
          <line x1="48" y1="210" x2="412" y2="210" stroke="#176B78" stroke-width="6" vector-effect="non-scaling-stroke" marker-end="url(#arrow-env)"/>
          <circle cx="226" cy="210" r="11" fill="#F3F1EA" stroke="#263033" stroke-width="3" vector-effect="non-scaling-stroke"/>
          <line x1="226" y1="205" x2="226" y2="96" stroke="#E4572E" stroke-width="5" vector-effect="non-scaling-stroke" marker-end="url(#arrow-accent)"/>
          <line x1="226" y1="214" x2="226" y2="323" stroke="#E4572E" stroke-width="5" vector-effect="non-scaling-stroke" marker-end="url(#arrow-accent)"/>
          <text x="48" y="184" font-size="17" font-weight="700" fill="#176B78">空气原有运动</text>
          <text x="251" y="112" font-size="16" font-weight="700" fill="#E4572E">科里奥利偏转作用</text>
          <text x="251" y="337" font-size="16" font-weight="700" fill="#E4572E">科里奥利偏转作用</text>
          <text x="84" y="254" font-size="14" fill="#626967">运动方向</text>
        </svg>
        <div class="note-pair"><strong>北半球：</strong>偏向运动方向的右侧<br><strong>南半球：</strong>偏向运动方向的左侧</div>
      </div>
      <p class="left-foot">这里画的是对<strong>运动空气</strong>的侧向作用，不是台风路径本身。</p>
    </section>
    <section class="right min0 k-generalization" aria-labelledby="chain-title">
      <p class="section-label">解释边界</p>
      <h2 class="claim" id="chain-title">具体路径，要经过大尺度风场这一层</h2>
      <div class="claim-rule" aria-hidden="true"></div>
      <div class="chain min0" aria-label="从地球自转到台风路径的因果链">
        <svg viewBox="0 0 900 370" role="img" aria-label="地球自转和气压梯度等共同组织大尺度风场，综合引导台风路径">
          <defs><marker id="chainarrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#176B78"/></marker></defs>
          <text x="16" y="42" font-size="16" font-weight="700">地球自转</text>
          <text x="164" y="42" font-size="16" font-weight="700">科里奥利效应</text>
          <text x="178" y="189" font-size="16" font-weight="700">气压梯度等</text>
          <text x="465" y="107" font-size="16" font-weight="700">大尺度风场</text>
          <text x="622" y="107" font-size="16" font-weight="700">综合引导</text>
          <text x="757" y="107" font-size="16" font-weight="700">台风路径</text>
          <path d="M124 67 H214" fill="none" stroke="#176B78" stroke-width="4" vector-effect="non-scaling-stroke" marker-end="url(#chainarrow)"/>
          <path d="M326 68 H405 V136 H474" fill="none" stroke="#176B78" stroke-width="4" vector-effect="non-scaling-stroke" marker-end="url(#chainarrow)"/>
          <path d="M322 164 H405 V136 H474" fill="none" stroke="#7A8280" stroke-width="4" vector-effect="non-scaling-stroke" marker-end="url(#chainarrow)"/>
          <path d="M592 136 H626" fill="none" stroke="#176B78" stroke-width="4" vector-effect="non-scaling-stroke" marker-end="url(#chainarrow)"/>
          <path d="M736 136 H760" fill="none" stroke="#176B78" stroke-width="4" vector-effect="non-scaling-stroke" marker-end="url(#chainarrow)"/>
          <path d="M277 89 C360 245 699 255 815 171" fill="none" stroke="#E4572E" stroke-width="3" stroke-dasharray="10 10" vector-effect="non-scaling-stroke"/>
          <path d="M492 208 l18 18 M510 208 l-18 18" stroke="#E4572E" stroke-width="6" vector-effect="non-scaling-stroke"/>
          <path d="M805 117 c-14 -10 -24 8 -11 16 c16 10 3 27 -12 16 c-14 -10 0 -28 13 -16" fill="none" stroke="#263033" stroke-width="3" vector-effect="non-scaling-stroke"/>
          <line x1="816" y1="136" x2="863" y2="136" stroke="#176B78" stroke-width="4" vector-effect="non-scaling-stroke" marker-end="url(#chainarrow)"/>
        </svg>
        <div class="boundary"><b>不能跳过风场</b>，直接推出某一次转弯。<span class="small">橙红斜杠标出这条被禁止的“直连”。</span></div>
      </div>
      <p class="bottom-note">它是方向机制的一部分，不是单独的路径预报器。</p>
      <p class="next"><b>下一问</b><span>纬度改变时，这种偏转作用会相差多少？</span></p>
    </section>
  </main>
</div>

</body>
</html>
