<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="14" data-total="21">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;gap:0;overflow:hidden}
    .p14-head{height:108px;flex:0 0 108px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid var(--line);padding:8px 0 17px;box-sizing:border-box}
    .p14-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.14em;color:var(--env);margin:3px 0 10px}
    .p14-head h1{font:600 var(--fs-h1)/1.16 var(--font-serif);margin:0;color:var(--text);letter-spacing:.015em}
    .p14-index{font:600 var(--fs-label)/1.25 var(--font-mono);color:var(--muted);text-align:right;padding-top:6px;letter-spacing:.08em}
    .p14-main{flex:1;min-height:0;padding:20px 0 13px;display:flex}
    .p14-map{flex:1;min-width:0;min-height:0;position:relative;border:2px solid var(--text);border-radius:6px;background:rgba(232,230,222,.34);overflow:hidden}
    .p14-map::before,.p14-map::after{content:"";position:absolute;width:22px;height:22px;border-color:var(--env);pointer-events:none;z-index:2}
    .p14-map::before{left:0;top:0;border-left:4px solid var(--env);border-top:4px solid var(--env);border-radius:5px 0 0 0}
    .p14-map::after{right:0;bottom:0;border-right:4px solid var(--env);border-bottom:4px solid var(--env);border-radius:0 0 5px 0}
    .p14-map svg{display:block;width:calc(100% - 2px);height:calc(100% - 2px);box-sizing:border-box}
    .p14-foot{height:86px;flex:0 0 86px;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:34px;align-items:center;border-top:2px solid var(--line);box-sizing:border-box}
    .p14-claim{font:500 var(--fs-lead)/1.42 var(--font-serif);color:var(--text);padding-right:16px}
    .p14-next{font:500 var(--fs-sec)/1.4 var(--font-sans);color:var(--muted);border-left:4px solid var(--env);padding-left:17px}
    .p14-next b{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.1em;color:var(--env);display:block;margin-bottom:5px}
    .p14-map text{font-family:var(--font-sans);fill:var(--text)}
    .p14-map .svg-label{font-size:16px;font-weight:600}
    .p14-map .svg-note{font-size:15px;fill:var(--muted)}
    .p14-map .svg-system{font-size:20px;font-family:var(--font-serif);font-weight:600}
    .p14-map .svg-tag{font-size:15px;font-weight:700;letter-spacing:.06em}
    .p14-map .svg-tiny{font-size:14px;fill:var(--muted)}
  </style>

  <header class="p14-head">
    <div>
      <div class="p14-kicker">STEERING FLOW</div>
      <h1>转弯发生在引导气流换向的地方</h1>
    </div>
  </header>

  <main class="p14-main min0" aria-label="台风路径转向示意天气图">
    <section class="p14-map focus min0">
      <svg viewBox="0 0 1480 580" role="img" aria-labelledby="map-title map-desc" preserveAspectRatio="xMidYMid meet">
        <title id="map-title">副热带高压边缘到中纬度西风的连续转弯路径</title>
        <desc id="map-desc">同一张天气图中，台风中心沿副热带高压边缘从偏西北移动，随后转向北，最后接入中纬度西风并偏东北移动。</desc>
        <defs>
          <marker id="arrow-env" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176B78"/></marker>
          <marker id="arrow-active" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E4572E"/></marker>
          <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7A8280"/></marker>
          <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="9" stroke="#7A8280" stroke-width="2" opacity=".28"/></pattern>
        </defs>

        <!-- latitude band: a physical lane, not a separate panel -->
        <path d="M62 111H1418" stroke="#7A8280" stroke-width="2"/>
        <path d="M62 111H1418V190H62Z" fill="url(#hatch)" opacity=".48"/>
        <text x="78" y="93" class="svg-label" fill="#626967">中纬度西风</text>
        <g fill="none" stroke="#176B78" stroke-width="4" marker-end="url(#arrow-env)">
          <path d="M330 171L455 127"/><path d="M560 171L685 127"/><path d="M790 171L915 127"/>
        </g>
        <text x="1014" y="154" class="svg-note">由西南吹向东北</text>

        <!-- north reference -->
        <g transform="translate(1370 68)">
          <path d="M0 48V5" stroke="#263033" stroke-width="2.5" marker-end="url(#arrow-muted)"/>
          <text x="-7" y="0" class="svg-tag">北</text>
        </g>

        <!-- subtropical high: three aligned closed isobars -->
        <g fill="none" stroke="#626967" stroke-width="2.5">
          <path d="M530 466C440 433 426 323 501 251C585 171 760 193 875 259C984 321 1019 433 919 495C815 559 629 526 530 466Z"/>
          <path d="M568 437C504 407 499 330 554 281C626 216 752 234 838 283C919 329 946 411 871 456C790 506 641 486 568 437Z"/>
          <path d="M608 411C563 386 566 335 610 302C665 262 748 275 809 310C866 344 882 399 830 428C765 466 656 452 608 411Z"/>
        </g>
        <text x="677" y="365" text-anchor="middle" class="svg-system">副热带高压 H</text>
        <text x="677" y="389" text-anchor="middle" class="svg-note">闭合等压线</text>

        <!-- continuous computed/steering path -->
        <path d="M243 478 C360 433 425 364 465 299 C503 238 539 205 612 190 C702 171 797 178 875 151" fill="none" stroke="#176B78" stroke-width="7" stroke-linecap="round"/>
        <path d="M243 478 C360 433 425 364 465 299 C503 238 539 205 612 190 C702 171 797 178 875 151" fill="none" stroke="#F3F1EA" stroke-width="2" stroke-dasharray="5 8" opacity=".7"/>

        <!-- stage 1: spiral is closed; translation arrow kept separate -->
        <g transform="translate(306 426)">
          <circle r="12" fill="#176B78" stroke="#F3F1EA" stroke-width="4"/>
          <path d="M-28 8C-36-28 20-42 32-10C42 20 10 41-17 28C-39 18-29-18-4-21C17-24 27-3 15 11C5 22-13 17-12 3C-10-7 3-8 7-1" fill="none" stroke="#263033" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M-4 -18L55 -57" stroke="#176B78" stroke-width="4" marker-end="url(#arrow-env)"/>
        </g>
        <g transform="translate(133 455)">
          <rect width="151" height="34" rx="6" fill="#F3F1EA" stroke="#176B78" stroke-width="2"/>
          <text x="14" y="22" class="svg-tag" fill="#176B78">① 沿边缘</text>
          <path d="M151 17H183" stroke="#176B78" stroke-width="2"/>
        </g>
        <text x="183" y="516" class="svg-label">沿高压边缘</text>
        <text x="183" y="540" class="svg-note">环境风：偏西北</text>

        <!-- stage 2: active turning point -->
        <g transform="translate(465 299)">
          <circle r="14" fill="#E4572E" stroke="#F3F1EA" stroke-width="4"/>
          <path d="M-28 8C-36-28 20-42 32-10C42 20 10 41-17 28C-39 18-29-18-4-21C17-24 27-3 15 11C5 22-13 17-12 3C-10-7 3-8 7-1" fill="none" stroke="#263033" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M-1 -19L-1 -83" stroke="#E4572E" stroke-width="4.5" marker-end="url(#arrow-active)"/>
        </g>
        <g transform="translate(352 239)">
          <rect width="162" height="36" rx="6" fill="#F3F1EA" stroke="#E4572E" stroke-width="3"/>
          <text x="14" y="23" class="svg-tag" fill="#E4572E">② 到西侧</text>
        </g>
        <path d="M432 276L458 287" stroke="#E4572E" stroke-width="2"/>
        <text x="299" y="190" class="svg-label" fill="#E4572E">引导风转向</text>
        <text x="299" y="215" class="svg-note">环境风：偏北</text>

        <!-- stage 3 -->
        <g transform="translate(814 166)">
          <circle r="12" fill="#176B78" stroke="#F3F1EA" stroke-width="4"/>
          <path d="M-28 8C-36-28 20-42 32-10C42 20 10 41-17 28C-39 18-29-18-4-21C17-24 27-3 15 11C5 22-13 17-12 3C-10-7 3-8 7-1" fill="none" stroke="#263033" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M14 -15L69 -54" stroke="#176B78" stroke-width="4" marker-end="url(#arrow-env)"/>
        </g>
        <g transform="translate(897 191)">
          <rect width="173" height="34" rx="6" fill="#F3F1EA" stroke="#176B78" stroke-width="2"/>
          <text x="14" y="22" class="svg-tag" fill="#176B78">③ 接入西风</text>
        </g>
        <path d="M897 208L838 177" stroke="#176B78" stroke-width="2"/>
        <text x="1094" y="213" class="svg-label">转入西风带</text>
        <text x="1094" y="237" class="svg-note">环境风：偏东北</text>

        <!-- legend and diagram note occupy quiet lower-right edge -->
        <g transform="translate(1046 416)">
          <line x1="0" y1="0" x2="48" y2="0" stroke="#176B78" stroke-width="5"/>
          <circle cx="23" cy="0" r="6" fill="#176B78"/>
          <text x="64" y="6" class="svg-tiny">连续路径 / 台风中心</text>
          <path d="M4 34C-4 12 18 5 28 21C36 35 15 48 3 36C-5 28 1 17 10 18" fill="none" stroke="#263033" stroke-width="2.2"/>
          <text x="64" y="39" class="svg-tiny">闭合螺旋：自身环流</text>
        </g>
        <text x="740" y="552" text-anchor="middle" class="svg-note">示意图：实际转弯位置随大尺度环流配置而变</text>
      </svg>
    </section>
  </main>

  <footer class="p14-foot">
    <div class="p14-claim">台风沿副热带高压边缘移动，接近中纬度西风后，路径常由偏西北转向偏北或东北。</div>
    <div class="p14-next"><b>下一问</b>如果高压和西风带换个位置，转弯点会跟着移动吗？</div>
  </footer>
  <script>window.addEventListener('load',function(){Deck.init({index:14,total:21});});</script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
