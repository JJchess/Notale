<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="16" data-total="21">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;gap:0}
    .p16-head{height:112px;flex:0 0 112px;border-bottom:2px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;padding:0 6px 20px}
    .p16-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.13em;color:var(--env);margin-bottom:8px}
    .p16-title{font:600 var(--fs-h1)/1.25 var(--font-serif);letter-spacing:.01em;color:var(--text)}
    .p16-num{font:500 var(--fs-tick)/1 var(--font-mono);color:var(--muted);padding-bottom:6px}
    .p16-main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:28px 0 18px}
    .p16-focus{width:1328px;height:560px;position:relative;display:flex;flex-direction:column;color:var(--text)}
    .p16-parent{height:108px;flex:0 0 108px;border:2px solid var(--text);border-radius:6px 6px 0 0;display:flex;align-items:center;position:relative;padding:0 32px;background:color-mix(in srgb,var(--panel) 68%,var(--line))}
    .p16-parent:after{content:"";position:absolute;left:50%;bottom:-22px;height:20px;border-left:2px solid var(--line)}
    .p16-parent-title{font:600 var(--fs-h2)/1.2 var(--font-serif)}
    .p16-parent-sub{font:400 var(--fs-sec)/1.4 var(--font-sans);color:var(--muted);margin-left:26px;padding-left:26px;border-left:1px solid var(--line)}
    .p16-branches{height:380px;flex:0 0 380px;margin-top:22px;display:grid;grid-template-columns:1fr 1fr;position:relative;border:2px solid var(--text);border-radius:0 0 6px 6px;background:color-mix(in srgb,var(--panel) 68%,var(--line))}
    .p16-branches:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--line)}
    .p16-time-guide{position:absolute;top:44px;bottom:22px;border-left:1px dashed var(--line);opacity:.55;z-index:0}
    .p16-g1{left:16.66%}.p16-g2{left:33.33%}.p16-g3{left:66.66%}.p16-g4{left:83.33%}
    .p16-box{z-index:1}
    .p16-box{position:relative;padding:48px 38px 28px;min-width:0;overflow:hidden;background:color-mix(in srgb,var(--bg) 62%,var(--panel))}
    .p16-box-right{border:2px dashed var(--env);border-top:0;border-bottom:0;margin:-2px -2px -2px 0;background:color-mix(in srgb,var(--panel) 68%,var(--line))}
    .p16-bt{position:absolute;top:0;left:0;padding:12px 22px 11px;border-right:2px solid var(--text);border-bottom:2px solid var(--text);border-radius:0 0 6px 0;background:var(--panel);font:700 var(--fs-label)/1 var(--font-sans);letter-spacing:.08em}
    .p16-box-right .p16-bt{color:var(--accent)}
    .p16-known{height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px}
    .p16-micro{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.08em;color:var(--env);margin:0}
    .p16-sentence{font:600 var(--fs-lead)/1.35 var(--font-sans);margin:0;white-space:nowrap}
    .p16-small{font:400 var(--fs-sec)/1.45 var(--font-sans);color:var(--muted);margin:0}
    .p16-axis{height:50px;flex:0 0 50px;display:flex;align-items:flex-end;position:relative;margin:0 8px}
    .p16-axis svg{width:100%;height:40px;overflow:visible}
    .p16-axis-label{position:absolute;left:50%;transform:translateX(-50%);bottom:0;background:var(--bg);padding:0 16px;font:500 var(--fs-label)/1.2 var(--font-mono);color:var(--muted)}
    .p16-foot{height:88px;flex:0 0 88px;border-top:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 6px;gap:42px}
    .p16-take{font:500 var(--fs-body)/1.4 var(--font-sans);margin:0}
    .p16-next{font:500 var(--fs-sec)/1.4 var(--font-sans);color:var(--env);margin:0;text-align:right;white-space:nowrap}
  </style>
  <header class="p16-head">
    <div class="min0"><div class="p16-kicker">ACT IV · FORECAST</div><div class="p16-title">知道方向盘是谁，还不等于能画出唯一正确的未来路径</div></div>
    <div class="p16-num">16 / 21</div>
  </header>
  <main class="p16-main min0" aria-label="路径预报的分类图">
    <section class="focus k-classification p16-focus min0" aria-label="路径预报：已经知道与仍需表达">
      <div class="p16-parent lv">
        <div class="p16-parent-title">路径预报</div>
        <div class="p16-parent-sub">从现在，推向未来</div>
      </div>
      <div class="p16-branches min0">
        <i class="p16-time-guide p16-g1" aria-hidden="true"></i><i class="p16-time-guide p16-g2" aria-hidden="true"></i><i class="p16-time-guide p16-g3" aria-hidden="true"></i><i class="p16-time-guide p16-g4" aria-hidden="true"></i>
        <section class="box p16-box min0" aria-label="已经知道">
          <div class="bt p16-bt">已经知道</div>
          <div class="p16-known">
            <p class="p16-micro">机制</p><p class="p16-sentence">大尺度气流掌舵</p>
            <svg viewBox="0 0 550 160" width="100%" height="160" role="img" aria-label="台风环流旁有一支表示环境气流的直线箭头">
              <circle cx="119" cy="82" r="74" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/><g fill="none" stroke="var(--text)" stroke-width="6" stroke-linecap="round">
                <path d="M118 121 C45 108 48 28 118 30 C186 31 194 111 133 125 C81 138 61 78 92 55 C121 34 153 58 145 86 C138 110 103 108 101 82 C100 66 120 62 127 74"/>
              </g>
              <circle cx="119" cy="82" r="5" fill="var(--text)"/>
              <line x1="232" y1="82" x2="486" y2="82" stroke="var(--env)" stroke-width="15" stroke-linecap="round"/>
              <path d="M486 82 L455 63 M486 82 L455 101" fill="none" stroke="var(--env)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
              <text x="232" y="53" fill="var(--env)" font-family="var(--font-sans)" font-size="16">环境气流</text>
              <text x="80" y="152" fill="var(--muted)" font-family="var(--font-sans)" font-size="16">台风自身环流</text>
            </svg>
            <p class="p16-small">它给出移动的大方向。</p>
          </div>
        </section>
        <section class="box p16-box p16-box-right min0" aria-label="仍需表达">
          <div class="bt p16-bt">仍需表达</div>
          <div class="p16-known">
            <p class="p16-micro">同一现在</p><p class="p16-sentence">未来不只一条可能路径</p>
            <svg viewBox="0 0 550 160" width="100%" height="160" role="img" aria-label="三条从同一现在位置向未来发散的虚线路径">
              <line x1="62" y1="132" x2="488" y2="132" stroke="var(--line)" stroke-width="2"/>
              <text x="54" y="155" fill="var(--muted)" font-family="var(--font-mono)" font-size="14">现在</text>
              <text x="442" y="155" fill="var(--muted)" font-family="var(--font-mono)" font-size="14">未来</text>
              <path d="M92 126 C180 120 270 90 350 46 C398 20 438 17 492 17" fill="none" stroke="var(--env)" stroke-width="9" stroke-dasharray="14 10"/>
              <path d="M92 126 C190 122 300 112 412 94 C447 88 470 84 494 80" fill="none" stroke="var(--env)" stroke-width="9" stroke-dasharray="14 10"/>
              <path d="M92 126 C182 118 260 75 331 28 C387 -9 444 0 497 2" fill="none" stroke="var(--env)" stroke-width="9" stroke-dasharray="14 10"/>
              <circle cx="92" cy="126" r="12" fill="var(--accent)" stroke="var(--bg)" stroke-width="4"/>
            </svg>
            <p class="p16-small">它们从同一现在出发，向尚未封闭的未来展开。</p>
          </div>
        </section>
      </div>
      <div class="p16-axis" aria-label="时间方向：现在到未来">
        <svg viewBox="0 0 1312 40" aria-hidden="true"><line x1="4" y1="18" x2="1290" y2="18" stroke="var(--text)" stroke-width="2"/><path d="M1290 18 L1274 10 M1290 18 L1274 26" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/></svg>
        <div class="p16-axis-label">现在 → 未来</div>
      </div>
    </section>
  </main>
  <footer class="p16-foot">
    <p class="p16-take">机制告诉我们路径受什么控制；预报还必须面对不止一种可能。</p>
    <p class="p16-next">为什么几乎相同的起点，几天后会走出不同路径？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
