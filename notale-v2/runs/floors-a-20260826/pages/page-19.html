<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F3F1EA;--text:#263033;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E4572E}
*{box-sizing:border-box} body{margin:0;overflow:hidden} button{font:inherit}
#stage{height:900px;padding:28px 56px;display:flex;flex-direction:column;gap:16px;background:var(--bg);color:var(--text)}
.topline{height:112px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid var(--text);padding-bottom:14px;gap:28px}.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.13em;color:var(--env);margin:3px 0 10px}.topline h1{font:700 var(--fs-h1)/1.15 var(--font-serif);margin:0;letter-spacing:.01em}.rule{width:426px;padding:10px 14px;border-left:6px solid var(--env);background:rgba(23,107,120,.07);font-size:var(--fs-sec);line-height:1.45}.rule strong{font-family:var(--font-mono);font-size:var(--fs-body)}
.scenario-strip{height:97px;display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);padding-bottom:14px}.scenario-label{width:132px;font-size:var(--fs-label);font-weight:700;line-height:1.35}.scenario-btns{display:flex;gap:9px}.scenario{min-width:150px;min-height:48px;padding:7px 14px;border:2px solid var(--line);border-radius:6px;background:transparent;color:var(--text);font-size:var(--fs-label);font-weight:700;cursor:pointer}.scenario[aria-pressed="true"]{border-color:var(--focus);box-shadow:inset 0 -4px 0 var(--focus);background:#fff7f1}.scenario:focus-visible,.choice:focus-visible,.reset:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.game{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}.comparison-head{height:44px;display:grid;grid-template-columns:250px repeat(3,1fr);gap:14px;align-items:end;border-bottom:2px solid var(--text)}.comparison-head div{padding:0 12px 8px;font-size:var(--fs-label);font-weight:700}.comparison-head .hdr{font-family:var(--font-mono);font-size:var(--fs-h2);color:var(--env);border-left:2px solid var(--env)}
.stage-cards{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.decision-card{min-width:0;display:grid;grid-template-rows:54px 80px 56px 66px 66px minmax(0,1fr);border:2px solid var(--line);border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden;transition:border-color 120ms ease,background 160ms ease}.decision-card.chosen{border-color:var(--focus);background:#fffdf8}.prob{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);font:700 30px/1 var(--font-mono);color:var(--env)}.row{padding:10px 16px;border-bottom:1px solid var(--line);min-width:0}.question{font-size:var(--fs-sec);line-height:1.35;padding-top:15px}.choices{display:flex;gap:8px;align-items:center}.choice{flex:1;min-height:37px;border:2px solid var(--text);border-radius:5px;background:transparent;color:var(--text);font-size:var(--fs-label);font-weight:700;cursor:pointer}.choice.selected{border-color:var(--focus);background:#fff1e9}.choice[disabled]{opacity:.58;cursor:default}.cost{display:flex;flex-direction:column;justify-content:center;gap:4px;transition:opacity 180ms ease,transform 180ms ease}.cost-label{font-size:var(--fs-label);color:var(--muted)}.formula{font-family:var(--font-mono);font-size:var(--fs-sec);white-space:nowrap}.cost.low{outline:2px solid var(--focus);outline-offset:-5px;background:rgba(228,87,46,.06)}.feedback{display:flex;align-items:center;font-size:var(--fs-sec);line-height:1.4;color:var(--muted)}.feedback strong{color:var(--text)}.pending{font-size:var(--fs-label);color:var(--muted)}
.resultbar{height:85px;display:flex;align-items:center;gap:22px;padding:12px 18px;border:2px solid var(--text);border-radius:6px;background:var(--panel)}.result-copy{flex:1;min-width:0;font-size:var(--fs-sec);line-height:1.45}.result-copy strong{font-family:var(--font-mono);font-size:var(--fs-body)}.reset{min-width:112px;min-height:42px;border:2px solid var(--text);border-radius:5px;background:transparent;font-size:var(--fs-label);font-weight:700;cursor:pointer}.takeaway{height:51px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-top:1px solid var(--line);padding-top:10px}.takeaway p{margin:0;font-size:var(--fs-sec);line-height:1.4}.next{font-size:var(--fs-label);color:var(--env);font-weight:700;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
<body data-page="19" data-total="21">
<div id="stage">
  <header class="topline">
    <div><div class="kicker">RISK DECISION</div><h1>概率不是行动命令：代价不同，阈值就不同</h1></div>
    <div class="rule"><strong>行动阈值 = C ÷ (L − R)</strong><br>行动成本 C；未行动且受影响的损失 L；行动后的残余损失 R。</div>
  </header>
  <section class="scenario-strip" aria-label="选择风险情境">
    <div class="scenario-label">全局风险情境<br><span class="small">切换后重新比较</span></div>
    <div class="scenario-btns" role="group" aria-label="风险情境">
      <button class="scenario" data-scenario="base" aria-pressed="true">基准局<br><span class="small">阈值 37.5%</span></button>
      <button class="scenario" data-scenario="consequence" aria-pressed="false">高后果局<br><span class="small">阈值 10.7%</span></button>
      <button class="scenario" data-scenario="cost" aria-pressed="false">高成本局<br><span class="small">阈值 100%</span></button>
    </div>
    <div id="scenario-detail" class="rule" aria-live="polite"></div>
  </section>
  <main class="game min0" aria-label="阈值决策局">
    <div class="comparison-head k-comparison" aria-hidden="true"><div>概率 → 你的选择 → 两种期望代价</div><div class="hdr">20%</div><div class="hdr">50%</div><div class="hdr">80%</div></div>
    <div id="cards" class="stage-cards"></div>
    <div class="resultbar panel" aria-live="polite">
      <div id="result" class="result-copy"><strong>本轮尚未完成</strong>　依次在 20%、50%、80% 下选择；这里比较的是本局代价点，不是现实中的统一行动标准。</div>
      <button id="reset" class="reset">重开本局</button>
    </div>
  </main>
  <footer class="takeaway"><p>面对 20%、50% 和 80% 的影响概率，是否行动取决于潜在损失与行动成本，而不是等待一条确定路径。</p><div class="next">能否用三句话，把供能、掌舵和预报不确定性连起来？</div></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  const scenarios={
    base:{name:'基准局',C:3,L:10,R:2,threshold:'37.5%'},
    consequence:{name:'高后果局',C:3,L:30,R:2,threshold:'10.7%'},
    cost:{name:'高成本局',C:8,L:10,R:2,threshold:'100%'}
  }, probabilities=[.2,.5,.8];
  const cards=document.getElementById('cards'), result=document.getElementById('result'), detail=document.getElementById('scenario-detail');
  let state=makeInitialState();
  function makeInitialState(){return {scenario:'base',choices:[null,null,null],phase:'playing',turn:0,trace:[]};}
  function costs(p){const s=scenarios[state.scenario];return {act:s.C+p*s.R,wait:p*s.L};}
  function lower(p){const c=costs(p);return c.act<c.wait?'act':'wait';}
  function transition(action){
    if(action.type==='scenario'){state={...state,scenario:action.id,choices:[null,null,null],phase:'playing',turn:0,trace:[]};}
    if(action.type==='choose'){
      if(state.phase==='complete') return;
      const choices=state.choices.slice(); choices[action.index]=action.choice;
      const complete=choices.every(Boolean);
      state={...state,choices,turn:state.turn+1,phase:complete?'complete':'playing',trace:[...state.trace,{p:probabilities[action.index],choice:action.choice}].slice(-3)};
    }
    if(action.type==='reset'){const current=state.scenario;state={...makeInitialState(),scenario:current};}
    render();
  }
  function money(n){return n.toFixed(1)+' 点';}
  function render(){
    const s=scenarios[state.scenario];
    detail.innerHTML='<strong>'+s.name+'</strong>　C = '+s.C+' 点，L = '+s.L+' 点，R = '+s.R+' 点；行动阈值 <strong>'+s.threshold+'</strong>。';
    document.querySelectorAll('.scenario').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scenario===state.scenario)));
    cards.innerHTML=probabilities.map((p,i)=>{
      const c=costs(p), best=lower(p), selected=state.choices[i], done=!!selected;
      const feedback=done ? '你选<strong>'+(selected==='act'?'现在行动':'继续等待')+'</strong>。按本局规则，<strong>'+(best==='act'?'现在行动':'继续等待')+'</strong>的期望代价较低。' : '<span class="pending">先作出一次选择，展开代价比较。</span>';
      return '<article class="decision-card '+(done?'chosen':'')+'" aria-label="影响概率 '+Math.round(p*100)+'% 的决策">'+
        '<div class="prob">影响概率 '+Math.round(p*100)+'%</div>'+
        '<div class="row question">现在行动，还是继续等待？</div>'+
        '<div class="row choices" role="group" aria-label="'+Math.round(p*100)+'% 下的选择">'+
          '<button class="choice '+(selected==='act'?'selected':'')+'" data-index="'+i+'" data-choice="act" aria-pressed="'+(selected==='act')+'">现在行动</button>'+
          '<button class="choice '+(selected==='wait'?'selected':'')+'" data-index="'+i+'" data-choice="wait" aria-pressed="'+(selected==='wait')+'">继续等待</button></div>'+
        '<div class="row cost '+(done&&best==='act'?'low':'')+'"><span class="cost-label">行动期望代价</span><span class="formula">'+s.C+' + '+p.toFixed(1)+' × '+s.R+' = '+money(c.act)+'</span></div>'+
        '<div class="row cost '+(done&&best==='wait'?'low':'')+'"><span class="cost-label">等待期望代价</span><span class="formula">'+p.toFixed(1)+' × '+s.L+' = '+money(c.wait)+'</span></div>'+
        '<div class="row feedback">'+feedback+'</div></article>';
    }).join('');
    if(state.phase==='complete'){
      const extra=state.choices.reduce((sum,choice,i)=>{const c=costs(probabilities[i]);return sum+(choice==='act'?c.act:c.wait)-Math.min(c.act,c.wait);},0);
      result.innerHTML='<strong>本轮完成｜额外代价 '+money(extra)+'</strong>　这来自你的三次选择相对每卡较低期望代价的差额之和。切换情境后，概率不变，但阈值会移动。';
    }else result.innerHTML='<strong>本轮尚未完成</strong>　已作出 '+state.choices.filter(Boolean).length+' / 3 次选择；这里比较的是本局代价点，不是现实中的统一行动标准。';
    stage.dispatchEvent(new CustomEvent('notale:learning-state',{bubbles:true,composed:true,detail:{action:'render',phase:state.phase,turn:state.turn,complete:state.phase==='complete'}}));
  }
  document.querySelector('.scenario-btns').addEventListener('click',e=>{const b=e.target.closest('.scenario');if(b)transition({type:'scenario',id:b.dataset.scenario});});
  cards.addEventListener('click',e=>{const b=e.target.closest('.choice');if(b)transition({type:'choose',index:+b.dataset.index,choice:b.dataset.choice});});
  cards.addEventListener('keydown',e=>{const b=e.target.closest('.choice');if(!b)return;const all=[...cards.querySelectorAll('.choice')], pos=all.indexOf(b);let next=null;if(e.key==='ArrowRight')next=all[Math.min(pos+2,all.length-1)];if(e.key==='ArrowLeft')next=all[Math.max(pos-2,0)];if(e.key==='ArrowDown')next=all[Math.min(pos+1,all.length-1)];if(e.key==='ArrowUp')next=all[Math.max(pos-1,0)];if(next){e.preventDefault();next.focus();}});
  document.getElementById('reset').addEventListener('click',()=>{transition({type:'reset'});document.querySelector('.choice').focus();});
  Deck.init({index:19,total:21}); render();
  window.addEventListener('pagehide',()=>{cards.replaceChildren();},{once:true});
})();
</script>
</body>
</html>
