<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="01" data-total="21">
<div id="stage">
  <style>
    #stage{position:relative;display:flex;flex-direction:column;overflow:hidden;padding:28px 56px;color:var(--text);}
    .page-field{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:6px;background:#263033;isolation:isolate;}
    .backdrop{position:absolute;inset:0;z-index:-2;margin:0;}
    .backdrop img{width:100%;height:100%;display:block;object-fit:cover;object-position:58% center;}
    .backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(23,32,34,.18) 0%,rgba(23,32,34,.04) 44%,rgba(23,32,34,.02) 100%);}
    section.focus{position:absolute;left:54px;top:54px;width:770px;padding:30px 34px 28px;background:rgba(38,48,51,.88);border:1px solid rgba(243,241,234,.42);border-radius:6px;color:var(--bg);display:block !important;writing-mode:horizontal-tb;}
    .kicker{margin:0 0 12px;font:600 var(--fs-label)/1.2 var(--font-sans);letter-spacing:.15em;color:rgba(243,241,234,.78);}
    section.focus .claim{display:block !important;width:auto !important;min-width:0;margin:0;color:#F3F1EA;font:600 var(--fs-h1)/1.2 var(--font-serif);letter-spacing:.01em;writing-mode:horizontal-tb;}
    .trunk{width:2px;height:34px;margin:25px auto 0;background:rgba(243,241,234,.78);position:relative;}
    .trunk::after{content:"";position:absolute;left:-235px;bottom:0;width:472px;border-top:2px solid rgba(243,241,234,.78);}
    section.focus .supports{display:flex !important;flex-direction:row !important;align-items:stretch;gap:34px;position:relative;margin-top:0;width:auto !important;writing-mode:horizontal-tb;}
    section.focus .support{display:block !important;box-sizing:border-box;width:calc(50% - 17px) !important;min-width:0;min-height:103px;padding:20px 19px 17px;border:2px solid rgba(243,241,234,.86);border-radius:6px;background:rgba(38,48,51,.25);font:500 var(--fs-lead)/1.4 var(--font-sans);color:#F3F1EA;writing-mode:horizontal-tb;}
    .support.energy{border-color:rgba(243,241,234,.86);}
    .support.path{border-color:var(--env);}
    .path-line{display:flex;align-items:center;gap:10px;white-space:nowrap;}
    .wind-arrow{position:relative;display:inline-block;width:48px;height:2px;background:var(--env);flex:0 0 48px;}
    .wind-arrow::after{content:"";position:absolute;right:0;top:-5px;width:10px;height:10px;border-top:2px solid var(--env);border-right:2px solid var(--env);transform:rotate(45deg);}
    .turn{color:#B9E0E4;font-weight:700;}
    .takeaway{margin:19px 0 0;color:#F3F1EA;font:500 var(--fs-sec)/1.45 var(--font-sans);}
    .next{position:absolute;left:58px;bottom:44px;max-width:630px;margin:0;padding-left:17px;border-left:3px solid rgba(243,241,234,.76);color:#F3F1EA;font:500 var(--fs-body)/1.45 var(--font-sans);text-shadow:0 1px 2px rgba(0,0,0,.45);}
    .backdrop-note{position:absolute;right:18px;bottom:16px;margin:0;color:rgba(243,241,234,.78);font:400 var(--fs-tick)/1.25 var(--font-sans);text-shadow:0 1px 2px rgba(0,0,0,.75);}
  </style>
  <main class="page-field min0" aria-labelledby="page-title">
    <figure class="backdrop" aria-label="卫星云图中的台风眼、螺旋云带与右侧海面">
      <img src="assets/img/typhoon-himawari-satellite.jpg" title="Himawari-9 2026-07-05 0230z RGB.png · This image was produced by the Japan Meteorological Agency. The legal notice stated, unless otherwise noted, images publ · CC BY 4.0" alt="向西北移动的台风卫星云图，中央可见完整台风眼和螺旋云带">
    </figure>
    <section class="focus k-generalization" aria-label="台风强弱和路径的两条不同条件">
      <p class="kicker">OPENING QUESTION</p>
      <h1 class="claim" id="page-title">暖海面给台风能量，变化的气流让它转弯</h1>
      <div class="trunk" aria-hidden="true"></div>
      <div class="supports min0">
        <div class="support energy">暖海面 → 提供能量条件</div>
        <div class="support path"><span class="path-line"><i class="wind-arrow" aria-hidden="true"></i><span>大尺度气流变化 → 改变路径<br><span class="turn">转弯</span></span></span></div>
      </div>
      <p class="takeaway">强弱看能量条件，路径看大尺度气流。</p>
    </section>
    <p class="next">如果只知道台风的出发点，你会把未来路径画向哪里？</p>
    <p class="backdrop-note">Himawari-9 · JMA · CC BY 4.0</p>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
