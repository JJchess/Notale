<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="02" data-total="21">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;gap:0;padding:28px 56px;color:var(--text);background:var(--bg);box-sizing:border-box;overflow:hidden}
    .p02-head{flex:0 0 148px;border-bottom:2px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:36px;padding:8px 0 20px;box-sizing:border-box}
    .p02-kicker{margin:0 0 10px;font:600 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.16em;color:var(--env)}
    .p02-head h1{margin:0;font:500 var(--fs-h1)/1.2 var(--font-serif);letter-spacing:.01em}
    .p02-head-note{width:264px;margin:33px 0 0;color:var(--muted);font:var(--fs-sec)/1.45 var(--font-sans)}
    .path-widget{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:22px}
    .path-widget .pw-intro{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:28px;margin-bottom:16px}
    .path-widget .hint{margin:0;color:var(--muted);font:var(--fs-label)/1.35 var(--font-sans)}
    .path-widget .hint strong{color:var(--accent);font-weight:650}
    .path-widget .pw-invariant{margin:0;color:var(--muted);font:var(--fs-label)/1.35 var(--font-sans);white-space:nowrap}
    .path-widget .k-comparison{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:22px}
    .path-widget .pw-cell{height:100%;box-sizing:border-box;min-width:0;min-height:0;display:flex;flex-direction:column;border-top:5px solid var(--line);padding-top:10px}
    .path-widget .pw-cell:first-child{border-top-color:var(--accent)}
    .path-widget .hdr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;height:28px;font:600 var(--fs-h2)/1.2 var(--font-sans)}
    .path-widget .north{font:var(--fs-label)/1 var(--font-mono);color:var(--muted);white-space:nowrap}
    .path-widget .cvbox{position:relative;flex:1;min-height:0;margin-top:10px;border:2px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
    .path-widget .cvbox:before{content:"";position:absolute;inset:6%;border:1px solid color-mix(in srgb,var(--line) 40%,transparent);border-radius:3px;pointer-events:none;z-index:2}
    .path-widget .konva-host{position:absolute;inset:0}
    .path-widget .plot-north{position:absolute;top:17px;left:18px;z-index:3;color:var(--muted);font:var(--fs-label)/1 var(--font-mono);pointer-events:none}
    .path-widget .start-focus{position:absolute;left:calc(50% - 24px);top:calc(82% - 24px);width:48px;height:48px;border:0;border-radius:50%;background:transparent;z-index:4;cursor:crosshair;color:transparent}
    .path-widget .start-focus:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    .path-widget .caption{flex:0 0 52px;margin:11px 2px 0;color:var(--muted);font:var(--fs-sec)/1.38 var(--font-sans)}
    .path-widget .pw-cell:not(.is-ready) .caption{color:var(--text)}
    .path-widget .pw-cell[data-path="user"] .caption{color:var(--accent)}
    .p02-foot{flex:0 0 100px;display:flex;align-items:flex-end;justify-content:space-between;gap:38px;padding-top:18px;border-top:2px solid var(--line)}
    .p02-conclusion{max-width:900px;margin:0;font:500 var(--fs-lead)/1.42 var(--font-serif)}
    .p02-next{max-width:360px;margin:0;color:var(--env);font:var(--fs-sec)/1.42 var(--font-sans);text-align:right}
    .p02-next b{font-weight:650}
    .p02-actions{width:180px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-left:auto}
    .p02-actions .btn{min-height:40px;white-space:nowrap}
    .p02-status{margin:0;color:var(--muted);font:var(--fs-label)/1.35 var(--font-sans)}
  </style>

  <header class="p02-head">
    <div>
      <p class="p02-kicker">PREDICT FIRST</p>
      <h1>从同一点出发，你会把台风画向哪里？</h1>
    </div>
    <p class="p02-head-note">先留下你的预判。四格始终使用同一北向与同一坐标尺度。</p>
  </header>

  <section class="path-widget min0" data-path-widget aria-label="台风路径预判与比较">
    <div class="pw-intro">
      <p class="hint"><strong>从橙色台风中心开始画一笔连续路径。</strong> 可拖动；也可聚焦中心后用方向键逐段延长。</p>
      <p class="pw-invariant">同一起点 · 北向朝上 · 同一尺度</p>
    </div>
    <div class="k-comparison min0" aria-label="四条同尺度路径的比较">
      <article class="pw-cell is-ready min0" data-path="user">
        <div class="hdr"><span>你的预判</span><span class="north">北 ↑</span></div>
        <div class="cvbox no-pan" data-box="user">
          <div class="konva-host" data-konva="user"></div><span class="plot-north">北 ↑</span>
          <button class="start-focus" type="button" data-start aria-label="台风中心：使用方向键绘制路径"></button>
        </div>
        <p class="caption" data-user-caption>从台风中心开始画</p>
      </article>
      <article class="pw-cell is-ready min0" data-path="straight">
        <div class="hdr"><span>直行</span><span class="north">北 ↑</span></div>
        <div class="cvbox" data-box="straight"><div class="konva-host" data-konva="straight"></div><span class="plot-north">北 ↑</span></div>
        <p class="caption">方向基本不变</p>
      </article>
      <article class="pw-cell is-ready min0" data-path="west">
        <div class="hdr"><span>西偏</span><span class="north">北 ↑</span></div>
        <div class="cvbox" data-box="west"><div class="konva-host" data-konva="west"></div><span class="plot-north">北 ↑</span></div>
        <p class="caption">持续偏向西侧</p>
      </article>
      <article class="pw-cell is-ready min0" data-path="turn">
        <div class="hdr"><span>转弯</span><span class="north">北 ↑</span></div>
        <div class="cvbox" data-box="turn"><div class="konva-host" data-konva="turn"></div><span class="plot-north">北 ↑</span></div>
        <p class="caption">先偏西，随后转向</p>
      </article>
    </div>
  </section>

  <footer class="p02-foot">
    <p class="p02-conclusion" data-conclusion hidden>同一个起点可以画出完全不同的路径——我们还没有说明“谁在掌舵”。</p>
    <div class="p02-actions"><button type="button" class="btn" data-reset>撤销重画</button><p class="p02-status" aria-live="polite" data-status>尚未显示对照路径</p></div>
    <p class="p02-next"><b>下一问</b>　要解释一条台风路径，哪些问题必须先分开？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/konva.min.js"></script>
<script>
(() => {
  const root = document.querySelector('[data-path-widget]');
  if (!root || !window.Konva) return;
  const K = window.Lec && Lec.K ? Lec.K : {};
  const START = K.pathStart || {x:50,y:82};
  const PRESETS = {
    straight:[[50,82],[50,68],[50,54],[50,40],[50,26]],
    west:[[50,82],[45,69],[39,57],[32,46],[24,37]],
    turn:[[50,82],[45,69],[43,56],[47,44],[57,34],[70,28]]
  };
  const env = getComputedStyle(document.documentElement).getPropertyValue('--env').trim();
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const line = getComputedStyle(document.documentElement).getPropertyValue('--line').trim();
  const status = document.querySelector('[data-status]');
  const conclusion = document.querySelector('[data-conclusion]');
  const resetButton = document.querySelector('[data-reset]');
  const userCaption = root.querySelector('[data-user-caption]');
  let state = {points:[], revealed:false};
  let activePointer = null, destroyed = false;
  const scenes = {};

  function px(p, scene){ return {x:p[0] / 100 * scene.w, y:p[1] / 100 * scene.h}; }
  function flat(points, scene){ return points.flatMap(p => {const q=px(p,scene); return [q.x,q.y];}); }
  function spiralPoints(scene){
    const c=px([START.x,START.y],scene), r=Math.max(11,Math.min(scene.w,scene.h)*.042), out=[];
    for(let t=0;t<Math.PI*4.2;t+=.15){ const rr=r*(1-t/(Math.PI*5.2)); out.push(c.x+Math.cos(t)*rr,c.y+Math.sin(t)*rr); }
    return out;
  }
  function makeScene(key){
    const host=root.querySelector(`[data-konva="${key}"]`), box=host.parentElement;
    const scene={key,host,box,w:1,h:1,stage:null,layer:null,path:null,spiral:null,origin:null};
    scene.stage=new Konva.Stage({container:host,width:1,height:1}); scene.layer=new Konva.Layer(); scene.stage.add(scene.layer);
    scene.path=new Konva.Line({points:[],stroke:key==='user'?accent:env,strokeWidth:5,lineCap:'round',lineJoin:'round',tension:.24,visible:false,listening:false});
    scene.origin=new Konva.Circle({x:0,y:0,radius:8,fill:key==='user'?accent:line,listening:false});
    scene.spiral=new Konva.Line({points:[],stroke:'#F3F1EA',strokeWidth:1.8,lineCap:'round',lineJoin:'round',listening:false});
    scene.layer.add(scene.path,scene.origin,scene.spiral); scenes[key]=scene;
    if(key==='user'){
      scene.stage.on('pointerdown', e => beginPointer(e));
      scene.stage.on('pointermove', e => movePointer(e));
      scene.stage.on('pointerup pointercancel', e => endPointer(e));
      scene.stage.content.addEventListener('pointerleave', e => { if(activePointer===e.pointerId) endDrawing(true); });
    }
    return scene;
  }
  ['user','straight','west','turn'].forEach(makeScene);

  function resizeScene(scene){
    scene.w=Math.max(1,scene.host.clientWidth); scene.h=Math.max(1,scene.host.clientHeight);
    scene.stage.size({width:scene.w,height:scene.h}); renderScene(scene);
  }
  function renderScene(scene){
    const o=px([START.x,START.y],scene);
    scene.origin.position(o); scene.spiral.points(spiralPoints(scene));
    const points=scene.key==='user'?state.points:PRESETS[scene.key];
    scene.path.points(flat(points,scene));
    scene.path.visible(scene.key==='user' ? points.length>1 : state.revealed);
    scene.layer.batchDraw();
  }
  function render(){
    Object.values(scenes).forEach(renderScene);
    root.querySelectorAll('.pw-cell').forEach(cell => cell.classList.toggle('is-ready', !state.revealed && cell.dataset.path!=='user'));
    conclusion.hidden=!state.revealed;
    userCaption.textContent=state.points.length>1 ? '你的路径保留在这里' : '从台风中心开始画';
  }
  function toLogical(scene, point){ return [Math.max(0,Math.min(100,point.x/scene.w*100)),Math.max(0,Math.min(100,point.y/scene.h*100))]; }
  function canStart(p, scene){ const o=px([START.x,START.y],scene); return Math.hypot(p.x-o.x,p.y-o.y)<=24; }
  function append(p){
    const last=state.points[state.points.length-1];
    if(last && Math.hypot(p[0]-last[0],p[1]-last[1]) < 1.15) return;
    state={points:[...state.points,p].slice(0,120),revealed:true}; render();
  }
  function beginPointer(e){
    if(destroyed || activePointer!==null) return;
    const scene=scenes.user, pos=scene.stage.getPointerPosition();
    if(!pos || !canStart(pos,scene)) return;
    activePointer=e.evt.pointerId;
    try{scene.stage.content.setPointerCapture(activePointer);}catch(_){ }
    state={points:[[START.x,START.y]],revealed:true}; render();
    e.evt.preventDefault();
  }
  function movePointer(e){
    if(e.evt.pointerId!==activePointer) return;
    const pos=scenes.user.stage.getPointerPosition(); if(pos) append(toLogical(scenes.user,pos));
  }
  function endDrawing(announce){
    if(activePointer===null) return;
    try{scenes.user.stage.content.releasePointerCapture(activePointer);}catch(_){ }
    activePointer=null;
    if(announce) status.textContent='路径已保留；三条同起点的对照路径已显示。';
  }
  function endPointer(e){ if(e.evt.pointerId===activePointer) endDrawing(true); }
  function reset(){
    endDrawing(false); state={points:[],revealed:false}; render(); status.textContent='已清除你的路径，对照已隐藏。';
  }
  root.querySelector('[data-start]').addEventListener('keydown', e => {
    const step=e.shiftKey?5:3; let dx=0,dy=0;
    const map={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],Home:[-1,-1],End:[1,1]};
    if(e.key==='Backspace'){
      e.preventDefault(); e.stopPropagation();
      if(state.points.length>1){state={points:state.points.slice(0,-1),revealed:state.points.length>2};render();}
      return;
    }
    if(e.key==='Enter') { e.preventDefault();e.stopPropagation(); if(state.points.length<2){state={points:[[START.x,START.y],[START.x,START.y-step]],revealed:true};render();} status.textContent='路径已完成；三条同起点的对照路径已显示。';return; }
    if(!map[e.key]) return;
    [dx,dy]=map[e.key]; e.preventDefault();e.stopPropagation();
    const last=state.points[state.points.length-1] || [START.x,START.y];
    append([Math.max(0,Math.min(100,last[0]+dx*step)),Math.max(0,Math.min(100,last[1]+dy*step))]);
  });
  resetButton.addEventListener('click',reset);
  const ro=new ResizeObserver(()=>Object.values(scenes).forEach(resizeScene)); ro.observe(root);
  Object.values(scenes).forEach(resizeScene); render();
  root.destroyPathWidget=()=>{if(destroyed)return;destroyed=true;endDrawing(false);ro.disconnect();Object.values(scenes).forEach(s=>s.stage.destroy());};
})();
</script>
</body>
</html>
