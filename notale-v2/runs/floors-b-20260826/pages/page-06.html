<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F3F1EA;--text:#263033;--font-sans:"Noto Sans SC",system-ui,sans-serif}
#stage{display:flex;flex-direction:column;padding:28px 56px;gap:16px;background:var(--bg);color:var(--text);overflow:hidden}
.p06-head{display:flex;align-items:end;justify-content:space-between;gap:30px;border-bottom:2px solid var(--text);padding-bottom:14px;flex:0 0 auto}
.p06-kicker{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.13em;color:var(--env)}
h1{font:700 var(--fs-h1)/1.18 var(--font-serif);margin:7px 0 0}.p06-claim{max-width:440px;margin:0;font:var(--fs-sec)/1.48 var(--font-sans);color:var(--muted)}
.warm-widget{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:13px}
.instrument{display:flex;align-items:center;gap:18px;padding:12px 16px;border:1px solid var(--line);border-radius:6px;background:var(--panel);min-width:0}
.instrument strong{font:600 var(--fs-body)/1.3 var(--font-sans)}.instrument .ctl{display:flex;align-items:center;gap:12px;flex:1;min-width:0;font:var(--fs-label)/1.35 var(--font-sans)}.instrument input{flex:1;min-width:240px}.depth-read{min-width:105px;font:600 var(--fs-body)/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--accent);text-align:right}.btns{margin-left:auto;display:flex;gap:8px}.btn{font-size:var(--fs-label);white-space:nowrap}
.compare-wrap{min-height:0;display:grid;grid-template-columns:156px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;column-gap:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.dim{grid-row:1 / 4;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);font:var(--fs-label)/1.3 var(--font-sans);color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.08em}.hdrs{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:0 42px 3px}.hdr{font:600 var(--fs-h2)/1.2 var(--font-sans)}.hdr span{margin-left:10px;color:var(--muted);font:var(--fs-label)/1.2 var(--font-sans)}.chart{grid-column:2;min-height:0;width:100%;height:100%}.diff{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:5px 42px 0}.reading{border-left:4px solid var(--env);padding-left:10px;font:var(--fs-sec)/1.42 var(--font-sans)}.reading b{font:600 var(--fs-body)/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text)}.reading.right{border-color:var(--accent)}.source{color:var(--muted);font:var(--fs-label)/1.35 var(--font-sans);margin:0}.p06-next{display:flex;justify-content:space-between;align-items:baseline;gap:30px;flex:0 0 auto}.p06-next strong{font:600 var(--fs-lead)/1.35 var(--font-serif)}.p06-next span{font:var(--fs-label)/1.35 var(--font-sans);color:var(--muted)}
.warn{color:var(--accent)!important}.inst-status{font:var(--fs-label)/1.3 var(--font-sans);color:var(--muted);white-space:nowrap} 
</style>
</head>
<body data-page="06" data-total="21">
<div id="stage">
  <header class="p06-head"><div><div class="p06-kicker">WARM-LAYER DEPTH</div><h1>同是 29°C，暖水层越深越经得起搅拌</h1></div><p class="p06-claim">海面温度相同，不代表可调用的暖水一样多。把 26°C 暖层底界往上拖，看看 40 m 的搅拌会遇到什么。</p></header>
  <main class="warm-widget min0" data-warm-widget>
    <section class="instrument" aria-label="暖层深度控制"><strong>调节右侧暖层底界</strong><label class="ctl" for="depthControl">26°C 底界 <input id="depthControl" type="range" min="30" max="100" step="1" value="100" aria-label="26 摄氏度暖层底界，单位米"></label><output class="depth-read" data-depth>100 m</output><div class="btns"><button class="btn" type="button" data-shallow>浅层 30 m</button><button class="btn" type="button" data-deep>深层 100 m</button></div><span class="inst-status" aria-live="polite" data-status>右图橙点可拖动；方向键每次 1 m</span></section>
    <section class="compare-wrap k-comparison min0" aria-label="共享尺度的海温剖面对照">
      <div class="dim">共享深度尺度　0–150 m</div>
      <div class="hdrs"><div class="hdr">浅暖层<span>参照，不变</span></div><div class="hdr">可调暖层<span>拖动 26°C 交点</span></div></div>
      <div class="chart min0" data-chart role="img" aria-label="浅暖层与可调暖层的温度深度剖面；共用二十到三十摄氏度温度轴、零到一百五十米深度轴和四十米搅拌线"></div>
      <div class="diff"><div class="reading" data-left-read>26°C 底界 <b>30 m</b>　海洋热含量 <b data-left-ohc>—</b></div><div class="reading right" data-right-read>26°C 底界 <b data-right-depth>100 m</b>　海洋热含量 <b data-right-ohc>—</b><span data-mix-note></span></div></div>
    </section>
    <div class="p06-next"><strong>相同 29°C 海面下，暖水层越深，风浪搅拌后越不容易迅速抽出冷水。</strong><span>NOAA/AOML 口径 · 有了充足海洋能量，台风就一定能把结构组织好吗？</span></div>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(()=>{
 const root=document.querySelector('[data-warm-widget]'); if(!root) return;
 const K=Lec.K, threshold=K.oceanHeatContentReferenceC, chartEl=root.querySelector('[data-chart]'), range=root.querySelector('#depthControl');
 const depthOut=root.querySelector('[data-depth]'), rightDepth=root.querySelector('[data-right-depth]'), leftO=root.querySelector('[data-left-ohc]'), rightO=root.querySelector('[data-right-ohc]'), status=root.querySelector('[data-status]');
 const shallow=[{depthM:0,temperatureC:29},{depthM:20,temperatureC:27},{depthM:50,temperatureC:24}];
 const deep=[{depthM:0,temperatureC:29},{depthM:50,temperatureC:28},{depthM:100,temperatureC:26},{depthM:150,temperatureC:20}];
 const initial=100; let state={depth:initial}, dragging=false, raf=0, destroyed=false;
 const chart=echarts.init(chartEl,null,{renderer:'svg'});
 function profile(d){
   if(d===30) return shallow.map(x=>({...x})); if(d===100) return deep.map(x=>({...x}));
   const t=(d-30)/70;
   // matched landmarks continuously interpolate between the two supplied teaching profiles
   return [{depthM:0,temperatureC:29},{depthM:20+30*t,temperatureC:27+t},{depthM:d,temperatureC:26},{depthM:50+100*t,temperatureC:24-4*t}];
 }
 function ohc(p){return Lec.P.oceanHeatContent(p,threshold).heatContentKjPerCm2}
 function fmt(v){return `${Math.round(v)} kJ/cm²`}
 const leftHeat=ohc(shallow); leftO.textContent=fmt(leftHeat);
 function polyRender(points,gridIndex,color){return {type:'custom',coordinateSystem:'cartesian2d',xAxisIndex:gridIndex,yAxisIndex:gridIndex,silent:true,data:[0],renderItem:(params,api)=>{const p=points.filter(q=>q.temperatureC>=threshold).map(q=>api.coord([q.temperatureC,q.depthM])); const bottom=points.find(q=>q.temperatureC===threshold); if(!bottom||p.length<2)return; p.push(api.coord([threshold,bottom.depthM]),api.coord([threshold,0])); return {type:'polygon',shape:{points:p},style:{fill:color,stroke:'none',decal:{symbol:'rect',symbolSize:1,rotation:-Math.PI/4,dashArrayX:[1,2],dashArrayY:[4,0],color:'rgba(38,48,51,.22)'}}};}}}
 function lineSeries(p,idx,color){return {type:'line',xAxisIndex:idx,yAxisIndex:idx,data:p.map(q=>[q.temperatureC,q.depthM]),showSymbol:true,symbolSize:8,lineStyle:{width:4,color},itemStyle:{color:'#F3F1EA',borderColor:color,borderWidth:3},silent:true,z:4}}
 function axis(idx){return {type:'value',gridIndex:idx,min:20,max:30,interval:2,name:'温度 °C',nameLocation:'middle',nameGap:30,nameTextStyle:{fontSize:14,color:'#626967'},axisLabel:{fontSize:13,color:'#626967'},axisLine:{lineStyle:{color:'#7A8280'}},splitLine:{lineStyle:{color:'rgba(122,130,128,.25)'}}}}
 function yaxis(idx,show){return {type:'value',gridIndex:idx,min:0,max:150,inverse:true,interval:25,name:show?'深度 m':'',nameTextStyle:{fontSize:14,color:'#626967'},axisLabel:{show,fontSize:13,color:'#626967'},axisLine:{lineStyle:{color:'#7A8280'}},splitLine:{lineStyle:{color:'rgba(122,130,128,.25)'}}}}
 function render(){
  raf=0; const p=profile(state.depth), heat=ohc(p), cold=state.depth<40;
  depthOut.textContent=`${state.depth} m`; rightDepth.textContent=`${state.depth} m`; rightO.textContent=fmt(heat);
  root.querySelector('[data-right-read]').classList.toggle('warn',cold);
  const mixLabel=cold?' · 40 m 搅拌可能混入较冷水':' · 40 m 搅拌仍在 26°C 暖水内'; root.querySelector('[data-mix-note]').textContent=mixLabel;
  chart.setOption({animation:!Deck.reduced(),animationDurationUpdate:180,animationEasingUpdate:'cubicOut',textStyle:{fontFamily:'var(--font-sans)',fontSize:16,color:'#263033'},grid:[{left:'7%',width:'36%',top:35,bottom:55},{right:'7%',width:'36%',top:35,bottom:55}],xAxis:[axis(0),axis(1)],yAxis:[yaxis(0,true),yaxis(1,false)],series:[polyRender(shallow,0,'rgba(23,107,120,.12)'),lineSeries(shallow,0,'#176B78'),polyRender(p,1,'rgba(228,87,46,.14)'),lineSeries(p,1,'#E4572E'),{type:'line',xAxisIndex:0,yAxisIndex:0,data:[[20,40],[30,40]],symbol:'none',silent:true,lineStyle:{type:'dashed',width:2,color:'#7A8280'},z:2},{type:'line',xAxisIndex:1,yAxisIndex:1,data:[[20,40],[30,40]],symbol:'none',silent:true,lineStyle:{type:'dashed',width:2,color:'#7A8280'},z:2}],graphic:[{type:'text',left:'8%',top:'43%',style:{text:'40 m 搅拌',font:'14px var(--font-sans)',fill:'#626967'}},{type:'group',position:[chartEl.clientWidth*(.57+.36*.6),35+(chartEl.clientHeight-90)*state.depth/150],draggable:true,z:20,ondrag:(e)=>{const y=e.offsetY==null?0:e.offsetY; const d=(y-35)/(chartEl.clientHeight-90)*150; if(y) setDepth(d,false)},children:[{type:'circle',shape:{cx:0,cy:0,r:12},style:{fill:'#E4572E',stroke:'#F3F1EA',lineWidth:3}},{type:'text',style:{x:17,y:5,text:'拖动 26°C 底界',font:'14px var(--font-sans)',fill:'#E4572E'}}]}]},{notMerge:true,lazyUpdate:false});
 }
 function setDepth(v,announce){state={depth:Math.max(30,Math.min(100,Math.round(v)))}; range.value=state.depth; if(!raf) raf=requestAnimationFrame(render); if(announce) status.textContent=`26 摄氏度暖层底界 ${state.depth} 米，海洋热含量 ${fmt(ohc(profile(state.depth)))}`}
 range.addEventListener('input',()=>setDepth(+range.value,false)); range.addEventListener('change',()=>setDepth(+range.value,true));
 root.querySelector('[data-shallow]').addEventListener('click',()=>setDepth(30,true)); root.querySelector('[data-deep]').addEventListener('click',()=>setDepth(100,true));
 const offResize=Deck.onResize(()=>chart.resize()); render();
 root.destroyWarmLayer=()=>{if(destroyed)return;destroyed=true;cancelAnimationFrame(raf);offResize();chart.dispose();delete root.destroyWarmLayer};
})();
</script>
</body>
</html>
