<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="10" data-total="21">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;padding:28px 56px;gap:16px;overflow:hidden}
    .p10-head{flex:0 0 auto;border-bottom:2px solid var(--line);padding:0 0 14px;display:flex;align-items:end;justify-content:space-between;gap:36px}
    .p10-kicker{font:600 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.12em;color:var(--env)}
    .p10-head h1{margin:8px 0 0;font:600 var(--fs-h1)/1.25 var(--font-serif);color:var(--text);max-width:1080px}
    .p10-step{font:var(--fs-label)/1.35 var(--font-mono);color:var(--muted);white-space:nowrap;padding-bottom:3px}
    .p10-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px}
    .p10-widget{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:12px}
    .p10-visual{min-width:0;min-height:0;position:relative;border:2px solid var(--line);border-radius:6px;background:rgba(232,230,222,.45);overflow:hidden}
    .p10-svg{display:block;width:100%;height:100%}
    .p10-svg text{font-family:var(--font-sans);fill:var(--text)}
    .p10-svg .muted{fill:var(--muted);font-size:15px}
    .p10-svg .small{fill:var(--muted);font-size:13px;font-family:var(--font-mono)}
    .p10-svg .layer-name{font-size:18px;font-weight:650}
    .p10-svg .layer-p{font-size:14px;fill:var(--muted);font-family:var(--font-mono)}
    .p10-svg .atm-outline{fill:none;stroke:var(--line);stroke-width:2}
    .p10-svg .band{fill:rgba(255,255,255,.24);stroke:var(--line);stroke-width:2}
    .p10-svg .vector{stroke:var(--env);stroke-width:5;stroke-linecap:round;transition:stroke 160ms ease,stroke-dasharray 160ms ease,opacity 160ms ease}
    .p10-svg .vector.off{stroke-dasharray:7 7;opacity:.35}
    .p10-svg .vector.hot{stroke:var(--accent)}
    .p10-svg .merge{fill:none;stroke:var(--line);stroke-width:2}
    .p10-svg .merge.off{stroke-dasharray:5 5;opacity:.34}
    .p10-svg .result-box{fill:var(--panel);stroke:var(--env);stroke-width:2}
    .p10-svg .result-arrow{stroke:var(--env);stroke-width:6;stroke-linecap:round}
    .p10-svg .origin{fill:var(--text)}
    .p10-svg .spiral{fill:none;stroke:var(--line);stroke-width:2}
    .p10-note{font:var(--fs-label)/1.4 var(--font-sans);color:var(--muted);padding-left:2px}
    .p10-side{min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px}
    .p10-side .panel{padding:18px}
    .p10-side h2{font:650 var(--fs-h2)/1.25 var(--font-sans);margin:0 0 12px}
    .p10-choices{display:grid;gap:8px}
    .p10-choice{display:flex;align-items:center;gap:10px;min-height:38px;border-bottom:1px solid rgba(122,130,128,.35);font:var(--fs-body)/1.35 var(--font-sans)}
    .p10-choice:last-child{border-bottom:0}
    .p10-choice input{width:19px;height:19px;accent-color:var(--env);flex:0 0 auto}
    .p10-choice small{margin-left:auto;font:var(--fs-tick)/1.2 var(--font-mono);color:var(--muted)}
    .p10-result{margin-top:auto;border-left:5px solid var(--env);padding:14px 14px 12px;background:var(--panel)}
    .p10-result .label{font:var(--fs-label)/1.35 var(--font-sans);color:var(--muted)}
    .p10-result .value{display:block;margin-top:7px;font:600 var(--fs-body)/1.45 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text)}
    .p10-status{min-height:22px;margin:0;font:var(--fs-label)/1.35 var(--font-sans);color:var(--accent)}
    .p10-btn{align-self:flex-start;margin-top:2px}
    .p10-foot{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:32px;border-top:2px solid var(--line);padding-top:12px}
    .p10-conclusion{margin:0;max-width:950px;font:var(--fs-sec)/1.45 var(--font-sans);color:var(--text)}
    .p10-next{margin:0;font:var(--fs-label)/1.4 var(--font-sans);color:var(--env);text-align:right;max-width:390px}
    @media (prefers-reduced-motion:reduce){.p10-svg .vector{transition:none}}
  </style>
  <header class="p10-head">
    <div><div class="p10-kicker">E2 · STEERING WIND</div><h1>台风不是听从某一层风，而是随多层环境风的加权结果移动</h1></div>
    <div class="p10-step">三层 → 一支箭头</div>
  </header>
  <main class="p10-main min0">
    <section class="p10-widget min0" data-steering-widget aria-label="三层环境风合成仪器">
      <div class="p10-visual min0 no-pan">
        <svg class="p10-svg" viewBox="0 0 980 500" role="img" aria-labelledby="p10-svg-title p10-svg-desc">
          <title id="p10-svg-title">三层环境风合成为综合引导风</title><desc id="p10-svg-desc">高、中、低三层位于同一大气柱。勾选层级后，各层风按权重汇合为右侧的综合引导风。</desc>
          <defs><marker id="p10-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
          <text x="48" y="42" class="muted">同一长度尺度：1 m/s = 24 px　　东 →　北 ↑</text>
          <rect class="atm-outline" x="42" y="70" width="510" height="360" rx="6"/>
          <text x="62" y="96" class="small">同一大气柱</text>
          <g data-layer="high"><rect class="band" x="62" y="112" width="470" height="88" rx="4"/><text class="layer-name" x="82" y="151">高层环境风</text><text class="layer-p" x="82" y="176">200 hPa</text><circle class="origin" cx="270" cy="158" r="4"/><line class="vector" data-v="high" x1="270" y1="158" x2="366" y2="-10" marker-end="url(#p10-arrow)"/><text data-vlabel="high" class="small" x="382" y="130"></text><path class="merge" data-m="high" d="M532 158 L620 225"/></g>
          <g data-layer="mid"><rect class="band" x="62" y="210" width="470" height="88" rx="4"/><text class="layer-name" x="82" y="249">中层环境风</text><text class="layer-p" x="82" y="274">500 hPa</text><circle class="origin" cx="270" cy="256" r="4"/><line class="vector" data-v="mid" x1="270" y1="256" x2="390" y2="208" marker-end="url(#p10-arrow)"/><text data-vlabel="mid" class="small" x="402" y="225"></text><path class="merge" data-m="mid" d="M532 256 L620 250"/></g>
          <g data-layer="low"><rect class="band" x="62" y="308" width="470" height="88" rx="4"/><text class="layer-name" x="82" y="347">低层环境风</text><text class="layer-p" x="82" y="372">850 hPa</text><circle class="origin" cx="270" cy="354" r="4"/><line class="vector" data-v="low" x1="270" y1="354" x2="318" y2="330" marker-end="url(#p10-arrow)"/><text data-vlabel="low" class="small" x="333" y="337"></text><path class="merge" data-m="low" d="M532 354 L620 275"/></g>
          <rect class="result-box" x="620" y="135" width="310" height="210" rx="6"/><text x="646" y="168" class="muted">综合引导风</text><line x1="670" y1="292" x2="858" y2="292" stroke="var(--line)" stroke-width="1.5"/><line x1="670" y1="292" x2="670" y2="198" stroke="var(--line)" stroke-width="1.5"/><circle class="origin" cx="670" cy="292" r="5"/><line class="result-arrow" data-result-arrow x1="670" y1="292" x2="766" y2="220" marker-end="url(#p10-arrow)"/><text data-result-svg class="small" x="690" y="326"></text>
          <path class="spiral" d="M850 250c18-20 43 5 26 24-16 19-43 1-30-20 13-21 44-1 31 23-11 20-40 8-35-12 5-20 35-17 38 2"/><text x="811" y="311" class="small">自身环流 ≠ 平移箭头</text>
        </svg>
      </div>
      <div class="p10-note">这是用于理解“多层加权”的教学风场；真实权重会随台风结构和环境改变。</div>
    </section>
    <aside class="p10-side min0">
      <section class="panel p10-controls" aria-label="选择参与合成的气层"><h2>选择参与合成的气层</h2><p class="hint">勾选或取消一层，观察综合箭头。</p><div class="p10-choices">
        <label class="p10-choice"><input type="checkbox" data-toggle="low" checked><span>低层环境风</span><small>850 hPa</small></label>
        <label class="p10-choice"><input type="checkbox" data-toggle="mid" checked><span>中层环境风</span><small>500 hPa</small></label>
        <label class="p10-choice"><input type="checkbox" data-toggle="high" checked><span>高层环境风</span><small>200 hPa</small></label>
      </div></section>
      <div class="p10-result" aria-live="polite"><div class="label">综合引导风 =</div><output class="value" data-result>东向 4.0 m/s，北向 3.0 m/s</output></div>
      <p class="p10-status" data-status aria-live="polite"></p>
      <button type="button" class="btn p10-btn" data-reset>恢复三层</button>
    </aside>
  </main>
  <footer class="p10-foot"><p class="p10-conclusion">低、中、高层风共同形成综合引导；台风自身的旋转不等于中心的平移。</p><p class="p10-next">如果这支综合箭头保持 24 小时，路径点会落到多远之外？</p></footer>
  <script>
  window.addEventListener('load',()=>{(()=>{
    const root=document.getElementById('stage');
    const q=s=>root.querySelector(s), qa=s=>[...root.querySelectorAll(s)];
    const order=['low','mid','high'];
    // 本页给定的教学风场；合成结果始终由 Lec.P 当场计算。
    const fields={low:{key:'low',east:2,north:1,weight:.25},mid:{key:'mid',east:5,north:2,weight:.50},high:{key:'high',east:4,north:7,weight:.25}};
    let state={selected:{low:true,mid:true,high:true},hot:null,from:null,to:null,start:0,out:null}; let raf=0, hotTimer=0, destroyed=false;
    const result=q('[data-result]'), status=q('[data-status]'), arrow=q('[data-result-arrow]'), svgResult=q('[data-result-svg]');
    const compute=()=>{const active=order.filter(k=>state.selected[k]); const sum=active.reduce((n,k)=>n+fields[k].weight,0); const layers=order.map(k=>({eastMps:fields[k].east,northMps:fields[k].north,weight:state.selected[k]?fields[k].weight/sum:0})); return Lec.P.steeringWind(layers)};
    const component=(r,names)=>{for(const n of names)if(Number.isFinite(r[n]))return r[n]; throw new Error('Lec.P.steeringWind 返回字段不完整')};
    function endpoint(e,n){return {x:670+e*24,y:292-n*24}}
    function draw(now=performance.now()){
      const out=state.out||compute(), east=component(out,['eastVelocityMps','eastMps','east']), north=component(out,['northVelocityMps','northMps','north']);
      const target=endpoint(east,north); let pt=target;
      if(state.from&&state.start&&!Deck.reduced()){const t=Math.min(1,(now-state.start)/260);pt={x:state.from.x+(target.x-state.from.x)*t,y:state.from.y+(target.y-state.from.y)*t}; if(t<1){raf=requestAnimationFrame(draw)}else state.from=null}
      arrow.setAttribute('x2',pt.x);arrow.setAttribute('y2',pt.y);
      svgResult.textContent=`东向 ${east.toFixed(1)} m/s　北向 ${north.toFixed(1)} m/s`;
      result.textContent=`东向 ${east.toFixed(1)} m/s，北向 ${north.toFixed(1)} m/s`;
      order.forEach(k=>{const f=fields[k], line=q(`[data-v="${k}"]`), merge=q(`[data-m="${k}"]`);const y={high:158,mid:256,low:354}[k], x=270+f.east*24, ty=y-f.north*24;line.setAttribute('x2',x);line.setAttribute('y2',ty);q(`[data-vlabel="${k}"]`).textContent=`东 ${f.east.toFixed(0)} · 北 ${f.north.toFixed(0)} m/s`;line.classList.toggle('off',!state.selected[k]);merge.classList.toggle('off',!state.selected[k]);line.classList.toggle('hot',state.hot===k);});
    }
    function update(key){if(state.selected[key]&&order.filter(k=>state.selected[k]).length===1){q(`[data-toggle="${key}"]`).checked=true;status.textContent='至少选择一个气层';return} const old=compute(), oe=component(old,['eastVelocityMps','eastMps','east']), on=component(old,['northVelocityMps','northMps','north']); state.selected[key]=!state.selected[key]; state.out=compute(); state.hot=key;status.textContent='';clearTimeout(hotTimer);hotTimer=setTimeout(()=>{state.hot=null; order.forEach(k=>q(`[data-v="${k}"]`).classList.remove('hot'))},400);cancelAnimationFrame(raf);state.from=endpoint(oe,on);state.start=performance.now();draw();}
    qa('[data-toggle]').forEach(el=>el.addEventListener('change',()=>update(el.dataset.toggle)));
    root.querySelector('[data-reset]').addEventListener('click',()=>{clearTimeout(hotTimer);cancelAnimationFrame(raf);state={selected:{low:true,mid:true,high:true},hot:null,from:null,to:null,start:0,out:null};qa('[data-toggle]').forEach(el=>el.checked=true);status.textContent='已恢复三层环境风';draw()});
    draw();
    root.destroySteeringWidget=()=>{if(destroyed)return;destroyed=true;cancelAnimationFrame(raf);clearTimeout(hotTimer);delete root.destroySteeringWidget};
  })();});
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
