<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="14" data-total="21">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;gap:0;color:var(--text);background:var(--bg);}
    .p14-head{height:112px;flex:0 0 112px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--text);padding:0 4px 18px;}
    .p14-kicker{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.13em;color:var(--env);}
    .p14-title{margin:8px 0 0;font:700 var(--fs-h1)/1.14 var(--font-serif);letter-spacing:.01em;}
    .p14-key{display:flex;gap:22px;align-items:center;padding-bottom:3px;color:var(--muted);font:var(--fs-label)/1.35 var(--font-sans);}
    .p14-key span{display:flex;align-items:center;gap:8px;white-space:nowrap;}
    .p14-key i{display:inline-block;width:31px;border-top:3px solid var(--env);}
    .p14-key i.dot{width:11px;height:11px;border:0;border-radius:50%;background:var(--env);}
    .p14-main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:20px 0 14px;}
    .p14-map{width:100%;height:100%;max-height:570px;min-height:0;position:relative;}
    .p14-map svg{width:100%;height:100%;display:block;}
    .p14-foot{height:130px;flex:0 0 130px;display:flex;align-items:stretch;border-top:2px solid var(--line);}
    .p14-claim{flex:1;display:flex;align-items:center;padding:14px 34px 12px 4px;font:var(--fs-lead)/1.45 var(--font-sans);}
    .p14-claim strong{color:var(--env);font-weight:700;}
    .p14-next{width:375px;flex:0 0 375px;border-left:2px solid var(--line);padding:14px 0 10px 27px;display:flex;flex-direction:column;justify-content:center;}
    .p14-next .lab{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.1em;color:var(--accent);margin-bottom:8px;}
    .p14-next p{margin:0;font:var(--fs-sec)/1.4 var(--font-sans);}
    .svg-label{font:600 17px var(--font-sans);fill:var(--text);paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round;}
    .svg-small{font:15px var(--font-sans);fill:var(--muted);}
    .svg-tag{font:600 15px var(--font-sans);fill:var(--text);}
    .svg-num{font:700 20px var(--font-mono);fill:var(--env);}
  </style>

  <header class="p14-head">
    <div><div class="p14-kicker">STEERING FLOW</div><h1 class="p14-title">转弯发生在引导气流换向的地方</h1></div>
    <div class="p14-key" aria-label="图例"><span><i></i>环境气流与路径</span><span><i class="dot"></i>台风中心</span></div>
  </header>

  <main class="p14-main min0">
    <section class="p14-map focus k-process min0" aria-label="副热带高压边缘与西风带中的台风转弯示意">
      <svg viewBox="0 0 1488 570" role="img" aria-labelledby="maptitle mapdesc" preserveAspectRatio="xMidYMid meet">
        <title id="maptitle">台风沿副热带高压边缘转向并接入中纬度西风</title>
        <desc id="mapdesc">同一张天气图上，一条连续的深青蓝路径从西北转向北，再转向东北。三处台风中心旁的环境风箭头与路径同向；中间转向处以橙红标出。</desc>
        <defs>
          <marker id="arrowEnv" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#176B78"/></marker>
          <marker id="arrowFocus" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#E4572E"/></marker>
        </defs>
        <!-- quiet bounds and latitude bands -->
        <path d="M84 79H1404 M84 302H1404 M84 507H1404" stroke="#7A8280" stroke-width="2" opacity=".55"/>
        <text x="90" y="70" class="svg-small">中纬度</text><text x="90" y="294" class="svg-small">副热带</text><text x="90" y="499" class="svg-small">低纬度</text>
        <!-- westerlies: parallel straight environmental flow -->
        <g stroke="#176B78" stroke-width="4" fill="none" marker-end="url(#arrowEnv)">
          <path d="M175 151 L396 85"/><path d="M455 151 L676 85"/><path d="M735 151 L956 85"/>
        </g>
        <text x="990" y="92" class="svg-label" fill="#176B78">中纬度西风</text>
        <!-- subtropical high, three closed isobars -->
        <g fill="none" stroke="#7A8280" stroke-width="2.5">
          <path d="M770 205 C1025 174 1283 262 1274 410 C1266 526 1032 542 839 484 C666 432 627 281 770 205Z"/>
          <path d="M806 242 C1017 218 1227 284 1222 402 C1218 490 1027 502 866 456 C742 420 717 306 806 242Z"/>
          <path d="M848 278 C1014 261 1163 309 1162 396 C1161 457 1027 467 909 434 C817 408 797 325 848 278Z"/>
        </g>
        <rect x="914" y="335" width="174" height="34" rx="6" fill="#E8E6DE" stroke="#7A8280" stroke-width="2"/>
        <text x="931" y="358" class="svg-tag">副热带高压 H</text>
        <!-- north arrow -->
        <g transform="translate(1372 144)" stroke="#263033" fill="none" stroke-width="2.5"><path d="M0 51V8" marker-end="url(#arrowEnv)"/><text x="-7" y="-3" class="svg-tag">北</text></g>
        <!-- continuous process path -->
        <path d="M328 466 C470 390 603 350 703 285 C783 233 782 175 844 137 C910 86 974 122 1024 85 C1062 57 1080 47 1111 40" fill="none" stroke="#176B78" stroke-width="8" stroke-linecap="round"/>
        <!-- direction segments along same path -->
        <g fill="none" stroke="#176B78" stroke-width="4" marker-end="url(#arrowEnv)">
          <path d="M413 416 L475 380"/><path d="M850 134 L916 106"/><path d="M1036 78 L1094 45"/>
        </g>
        <!-- 1 center and its separate spiral -->
        <g transform="translate(463 393)">
          <circle r="13" fill="#176B78" stroke="#F3F1EA" stroke-width="4"/>
          <path d="M-36 3 C-29-31 22-33 29-4 C35 23 0 35-19 20 C-36 5-16-19 4-13 C19-8 13 13-1 13" fill="none" stroke="#263033" stroke-width="2.5"/>
        </g>
        <rect x="262" y="431" width="174" height="34" rx="6" fill="#E8E6DE" stroke="#176B78" stroke-width="2"/>
        <text x="277" y="454" class="svg-tag">① 沿高压边缘</text>
        <path d="M474 358 L526 314" stroke="#176B78" stroke-width="5" marker-end="url(#arrowEnv)"/>
        <text x="500" y="298" class="svg-label">偏西北</text>
        <!-- 2 center and highlighted steering arrow -->
        <g transform="translate(751 244)">
          <circle r="15" fill="#E4572E" stroke="#F3F1EA" stroke-width="4"/>
          <path d="M-36 3 C-29-31 22-33 29-4 C35 23 0 35-19 20 C-36 5-16-19 4-13 C19-8 13 13-1 13" fill="none" stroke="#263033" stroke-width="2.5"/>
        </g>
        <rect x="566" y="284" width="176" height="34" rx="6" fill="#F3F1EA" stroke="#E4572E" stroke-width="3"/>
        <text x="581" y="307" class="svg-tag" fill="#E4572E">② 引导风转向</text>
        <path d="M722 224 L722 145" stroke="#E4572E" stroke-width="5" marker-end="url(#arrowFocus)"/>
        <text x="739" y="168" class="svg-label" fill="#E4572E">偏北</text>
        <!-- 3 center -->
        <g transform="translate(1024 85)">
          <circle r="13" fill="#176B78" stroke="#F3F1EA" stroke-width="4"/>
          <path d="M-36 3 C-29-31 22-33 29-4 C35 23 0 35-19 20 C-36 5-16-19 4-13 C19-8 13 13-1 13" fill="none" stroke="#263033" stroke-width="2.5"/>
        </g>
        <rect x="1053" y="150" width="160" height="34" rx="6" fill="#E8E6DE" stroke="#176B78" stroke-width="2"/>
        <text x="1068" y="173" class="svg-tag">③ 转入西风带</text>
        <path d="M1050 104 L1112 67" stroke="#176B78" stroke-width="5" marker-end="url(#arrowEnv)"/>
        <text x="1123" y="72" class="svg-label">偏东北</text>
        <text x="744" y="548" text-anchor="middle" class="svg-small">示意图：实际转弯位置随大尺度环流配置而变</text>
      </svg>
    </section>
  </main>

  <footer class="p14-foot">
    <div class="p14-claim"><strong>台风沿副热带高压边缘移动，</strong>接近中纬度西风后，路径常由偏西北转向偏北或东北。</div>
    <div class="p14-next"><div class="lab">NEXT QUESTION</div><p>如果高压和西风带换个位置，转弯点会跟着移动吗？</p></div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:14,total:21});</script>
</body>
</html>
