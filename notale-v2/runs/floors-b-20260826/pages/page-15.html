<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F3F1EA;--text:#263033;--font-sans:"Noto Sans SC",system-ui,sans-serif;--flow:#176B78;--accent:#E4572E;--line:#7A8280;--muted:#626967;--panel:#E8E6DE}
*{box-sizing:border-box} body{margin:0} #stage{height:900px;padding:28px 56px;display:flex;flex-direction:column;gap:14px;overflow:hidden;background:var(--bg);color:var(--text)}
.header{height:110px;display:flex;align-items:flex-start;border-bottom:2px solid var(--text);padding-bottom:13px}.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:2px;color:var(--env);margin:3px 0 11px}.claim{font:600 var(--fs-h1)/1.18 var(--font-serif);letter-spacing:.2px}.trunk{width:2px;height:18px;background:var(--text);margin:7px 0 0 20px;position:relative}.trunk:after{content:"";position:absolute;left:-5px;bottom:-1px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--text)}
.main{flex:1;min-height:0;display:flex;gap:20px}.supports{width:272px;min-width:272px;display:flex;flex-direction:column;justify-content:center;gap:18px;border-right:2px solid var(--line);padding-right:18px}.support{position:relative;padding:13px 14px 13px 18px;border-left:5px solid var(--env);background:rgba(232,230,222,.75)}.support:after{content:"";position:absolute;right:-39px;top:50%;width:38px;border-top:2px solid var(--line)}.support h2{font:700 var(--fs-h2)/1.15 var(--font-sans);margin:0 0 7px}.support p,.note,.status{font:var(--fs-sec)/1.42 var(--font-sans);margin:0}.figure{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}.topline{height:38px;display:flex;justify-content:space-between;align-items:center;gap:12px}.instruction{font:var(--fs-label)/1.3 var(--font-sans);color:var(--muted)}.tag{font:700 var(--fs-label)/1 var(--font-mono);color:var(--accent);border:1px solid var(--accent);padding:5px 8px;background:var(--bg);white-space:nowrap}.mapbox{flex:1;min-height:0;border:2px solid var(--text);background:#f8f7f2;position:relative;overflow:hidden}.mapbox svg{display:block;width:100%;height:100%}.wind{stroke:var(--env);stroke-width:2.1;fill:none;opacity:.82}.grid{stroke:#b9bdb9;stroke-width:1}.grid.major{stroke:#969e9c;stroke-width:1.3}.contour{fill:none;stroke:#5d6665;stroke-width:2}.west{fill:rgba(23,107,120,.10);stroke:var(--env);stroke-width:2;stroke-dasharray:7 5}.path-new{fill:none;stroke:var(--env);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.path-old{fill:none;stroke:var(--line);stroke-width:2.5;stroke-dasharray:7 6}.point{fill:var(--env);stroke:var(--bg);stroke-width:2}.labelbg{fill:var(--bg);stroke:#737b78;stroke-width:1}.svglabel{font:600 15px var(--font-sans);fill:var(--text)}.tick{font:13px var(--font-mono);fill:var(--muted)}.handleH{fill:var(--accent);stroke:var(--bg);stroke-width:3;cursor:grab}.handleH:active{cursor:grabbing}.handleBand{fill:var(--env);stroke:var(--bg);stroke-width:3;cursor:ns-resize}.bandlabel{font:700 15px var(--font-sans);fill:var(--env)}.hlabel{font:800 22px var(--font-serif);fill:var(--accent)}.spiral{fill:none;stroke:var(--accent);stroke-width:2.2}.readout{height:68px;display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-top:0;padding:8px 12px;background:var(--panel)}.readout .status{flex:1}.ctl{display:flex;align-items:center;gap:9px;font:var(--fs-label)/1.2 var(--font-sans);white-space:nowrap}.btn{font:700 var(--fs-label)/1 var(--font-sans);border:1px solid var(--text);border-radius:6px;background:var(--bg);padding:9px 12px;color:var(--text);cursor:pointer}.btn:hover,.btn:focus{outline:3px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:2px}.footer{height:72px;display:flex;align-items:center;justify-content:space-between;gap:25px;border-top:2px solid var(--text);padding-top:12px}.conclusion{font:var(--fs-body)/1.38 var(--font-sans);max-width:1040px}.next{font:600 var(--fs-sec)/1.35 var(--font-serif);max-width:340px;color:var(--env);text-align:right}
</style>
</head>
<body data-page="15" data-total="21">
<div id="stage">
  <header class="header"><div><div class="kicker">STEERING FIELD</div><div class="claim">台风转弯，是因为沿途的引导风变了方向</div><div class="trunk" aria-hidden="true"></div></div></header>
  <main class="main min0">
    <aside class="supports min0" aria-label="两项共同支撑">
      <section class="support"><h2>副热带高压边缘</h2><p>高压周围的切向环境风，会把中心推向边缘方向。</p></section>
      <section class="support"><h2>中纬度西风带</h2><p>越接近带中心，向东的引导分量越强。</p></section>
      <p class="note">两项都落在同一张经纬网：移动到哪里，就读取哪里的箭头。</p>
    </aside>
    <section class="figure min0" aria-label="可拖动的台风引导风场模型">
      <div class="topline"><div class="instruction">拖动 <b>H</b> 或西风带；键盘聚焦后用 ↑↓←→ 移动，Shift 每次 2°</div><span class="tag">时标 0 / 24 / 48 / 72 / 96 / 120 h</span></div>
      <div class="mapbox no-pan" id="mapbox"><svg id="field" role="img" aria-label="10到42度北纬、115到150度东经的高压、西风带、环境风与台风中心路径"></svg></div>
      <div class="readout"><div class="status" id="status" aria-live="polite"></div><div class="ctl">H <output id="hval"></output></div><div class="ctl">西风带 <output id="wval"></output></div><button class="btn" id="reset" type="button">恢复默认</button></div>
    </section>
  </main>
  <footer class="footer"><div class="conclusion">高压位置与西风带配置改变，台风经过的环境风便可能从偏西北转为偏北、再转向东北。</div><div class="next">即使知道“方向盘”在哪里，为什么未来路径仍不只有一条？</div></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(()=>{
  Deck.init({index:15,total:21,keys:false});
  // Model contract: H and band latitude are the only mutable inputs; every path step is the local high-pressure tangent plus westerly component.
  const K=Lec.K||{};
  const init={hLat:25,hLon:140,band:30};
  let state={...init,old:null,anim:1,dragging:false};
  const svg=d3.select('#field'), box=document.getElementById('mapbox');
  const x=d3.scaleLinear().domain([115,150]), y=d3.scaleLinear().domain([10,42]);
  function size(){const r=box.getBoundingClientRect(); x.range([58,r.width-25]);y.range([r.height-34,25]);return r}
  function wind(lat,lon){const dx=lon-state.hLon,dy=lat-state.hLat, r=Math.hypot(dx,dy);const high=r<.01?{e:0,n:0}:{e:5*dy/r,n:-5*dx/r};const west=Math.max(0,Math.min(8,(lat-(state.band-4))));return {e:high.e+west,n:high.n,west};}
  function integrate(){let p={lat:15,lon:125}, a=[{...p,h:0}];for(let h=6;h<=120;h+=6){let v=wind(p.lat,p.lon);let q=Lec.P.advancePosition(p.lat,p.lon,v.e,v.n,6);p={lat:q.latitudeDeg,lon:q.longitudeDeg};a.push({...p,h});}return a}
  function direction(a,b){const dx=b.lon-a.lon,dy=b.lat-a.lat; if(dx>0.08&&dy>0.035)return '偏东北'; if(dx<-.04&&dy>.035)return '偏西北'; if(dy>.02)return '偏北'; return '转向段'}
  function segments(path){return [[0,4],[7,12],[15,20]].map(([a,b],i)=>{const dir=direction(path[Math.min(a,path.length-1)],path[Math.min(b,path.length-1)]);return {a:path[Math.min(a,path.length-1)],b:path[Math.min(b,path.length-1)],t:i===0?dir:i===1?'转向段':'进入西风后'+dir};});}
  function arrow(g,x1,y1,x2,y2){g.append('line').attr('class','wind').attr('x1',x1).attr('y1',y1).attr('x2',x2).attr('y2',y2).attr('marker-end','url(#arr)')}
  function render(){size();const r=box.getBoundingClientRect(), W=r.width,H=r.height;svg.attr('viewBox',`0 0 ${W} ${H}`).selectAll('*').remove();
    const defs=svg.append('defs');defs.append('marker').attr('id','arr').attr('viewBox','0 0 10 10').attr('refX',8).attr('refY',5).attr('markerWidth',5).attr('markerHeight',5).attr('orient','auto-start-reverse').append('path').attr('d','M0,0 L10,5 L0,10 z').attr('fill','#176B78');
    const g=svg.append('g');
    d3.range(115,151,5).forEach(v=>{g.append('line').attr('class',v%10===0?'grid major':'grid').attr('x1',x(v)).attr('x2',x(v)).attr('y1',y(10)).attr('y2',y(42));g.append('text').attr('class','tick').attr('x',x(v)-11).attr('y',H-12).text(v+'°E')});
    d3.range(10,43,4).forEach(v=>{g.append('line').attr('class',v%8===2?'grid major':'grid').attr('x1',x(115)).attr('x2',x(150)).attr('y1',y(v)).attr('y2',y(v));g.append('text').attr('class','tick').attr('x',7).attr('y',y(v)+4).text(v+'°N')});
    const bandTop=state.band+4,bandBottom=state.band-4;g.append('rect').attr('class','west').attr('x',x(115)).attr('y',y(bandTop)).attr('width',x(150)-x(115)).attr('height',y(bandBottom)-y(bandTop));
    g.append('text').attr('class','bandlabel').attr('x',x(116)).attr('y',y(bandTop)+20).text('西风带 · 向东分量 0–8 m/s');
    const contour=[];for(let i=0;i<=64;i++){let a=Math.PI*2*i/64;contour.push([x(state.hLon+7*Math.cos(a)),y(state.hLat+5*Math.sin(a))])}g.append('path').attr('class','contour').attr('d',d3.line().curve(d3.curveCatmullRomClosed)(contour));
    const arrows=g.append('g');d3.range(13,42,4).forEach(lat=>d3.range(118,150,4).forEach(lon=>{const v=wind(lat,lon),mag=Math.hypot(v.e,v.n);if(mag>.2){const len=5+mag*2.6, px=x(lon),py=y(lat), ex=px+len*v.e/mag,ey=py-len*v.n/mag;arrow(arrows,px,py,ex,ey)}}));
    const path=integrate(); if(state.old){g.append('path').attr('class','path-old').attr('d',d3.line().x(d=>x(d.lon)).y(d=>y(d.lat))(state.old));}
    const pg=g.append('g').attr('class','newgroup');pg.append('path').attr('class','path-new').attr('d',d3.line().x(d=>x(d.lon)).y(d=>y(d.lat))(path));pg.selectAll('circle').data(path).enter().append('circle').attr('class','point').attr('cx',d=>x(d.lon)).attr('cy',d=>y(d.lat)).attr('r',d=>d.h%24===0?5:3.4);
    // Time marks are the evenly spaced center dots; the full 24-hour scale is kept in the panel header to avoid covering local wind arrows.
    segments(path).forEach((s,i)=>{const offsets=[[11,-12],[-92,30],[-112,30]][i], px=Math.max(65,Math.min(W-128,x(s.b.lon)+offsets[0])),py=Math.max(28,Math.min(H-42,y(s.b.lat)+offsets[1]));const wid=s.t.length*15+12;g.append('rect').attr('class','labelbg').attr('x',px-5).attr('y',py-16).attr('width',wid).attr('height',23).attr('rx',4);g.append('text').attr('class','svglabel').attr('x',px).attr('y',py).text(s.t)});
    const start=path[0], sx=x(start.lon),sy=y(start.lat);g.append('path').attr('class','spiral').attr('d',`M${sx-9},${sy}c0,-11 16,-11 16,0c0,9 -13,10 -13,2c0,-6 8,-6 8,0`);g.append('text').attr('class','svglabel').attr('x',sx+12).attr('y',sy+20).text('0 h · 台风中心');
    const hg=g.append('g').attr('tabindex',0).attr('role','slider').attr('aria-label','拖动高压位置').attr('aria-valuetext',`${state.hLat}度北纬，${state.hLon}度东经`);hg.append('circle').attr('class','handleH').attr('cx',x(state.hLon)).attr('cy',y(state.hLat)).attr('r',15);hg.append('text').attr('class','hlabel').attr('x',x(state.hLon)-8).attr('y',y(state.hLat)+8).text('H');
    const bg=g.append('g').attr('tabindex',0).attr('role','slider').attr('aria-label','上下拖动西风带').attr('aria-valuetext',`${state.band}度北纬`);bg.append('line').attr('class','handleBand').attr('x1',x(148)).attr('x2',x(148)).attr('y1',y(state.band)-12).attr('y2',y(state.band)+12).attr('stroke-width',8);bg.append('path').attr('fill','var(--env)').attr('d',`M${x(148)-7},${y(state.band)}l14,-8v16z`);
    function moveH(e){const p=d3.pointer(e,svg.node()), lon=Math.max(132,Math.min(148,x.invert(p[0]))),lat=Math.max(22,Math.min(30,y.invert(p[1])));applyAction({type:'h',lat,lon});}function moveB(e){const p=d3.pointer(e,svg.node());applyAction({type:'band',band:Math.max(28,Math.min(38,y.invert(p[1])))});}
    hg.call(d3.drag().on('start',()=>state.dragging=true).on('drag',moveH).on('end',()=>{state.dragging=false;announce()}));bg.call(d3.drag().on('start',()=>state.dragging=true).on('drag',moveB).on('end',()=>{state.dragging=false;announce()}));
    hg.on('keydown',e=>keyMove(e,'h'));bg.on('keydown',e=>keyMove(e,'band')); updateReadout(path); animate();
  }
  function keyMove(e,what){const step=e.shiftKey?2:1;let d=0;if(e.key==='ArrowUp')d=step;if(e.key==='ArrowDown')d=-step;if(!d&&e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();if(what==='band')applyAction({type:'band',band:state.band+d});else applyAction({type:e.key==='ArrowLeft'||e.key==='ArrowRight'?'h':'h',lat:state.hLat+d,lon:state.hLon+(e.key==='ArrowRight'?step:e.key==='ArrowLeft'?-step:0)});announce();}
  function applyAction(a){state.old=integrate();if(a.type==='h'){state.hLat=Math.max(22,Math.min(30,a.lat));state.hLon=Math.max(132,Math.min(148,a.lon));}else if(a.type==='band')state.band=Math.max(28,Math.min(38,a.band));state.anim=0;render();}
  function updateReadout(path){document.getElementById('hval').textContent=`${state.hLat.toFixed(1)}°N, ${state.hLon.toFixed(1)}°E`;document.getElementById('wval').textContent=`${state.band.toFixed(1)}°N`;const end=path.at(-1);document.getElementById('status').textContent=`当前位置风场：终点 ${end.lat.toFixed(1)}°N, ${end.lon.toFixed(1)}°E；每一步都取所在位置的环境风。`;}
  function announce(){document.getElementById('status').textContent=`已重算：H ${state.hLat.toFixed(1)}°N、${state.hLon.toFixed(1)}°E；西风带中心 ${state.band.toFixed(1)}°N。比较路径何时接入西风带。`;}
  function animate(){if(Deck.reduced())return;const pg=svg.select('.newgroup'),path=pg.select('path').node();if(!path)return;const L=path.getTotalLength();pg.select('path').attr('stroke-dasharray',L).attr('stroke-dashoffset',L);pg.selectAll('circle').style('opacity',0);const stop=Deck.loop((t)=>{const q=Math.min(1,t/700);pg.select('path').attr('stroke-dashoffset',L*(1-q));pg.selectAll('circle').style('opacity',d=>Math.max(0,Math.min(1,(t-d.h/6*35)/180)));if(q===1)stop();},{still:700});}
  function reset(){state={...init,old:null,anim:1,dragging:false};render();announce();}
  document.getElementById('reset').addEventListener('click',reset);Deck.onResize(render);render();
})();
</script>
</body>
</html>
