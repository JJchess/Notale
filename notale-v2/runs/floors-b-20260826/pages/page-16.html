<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="16" data-total="21">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;gap:0;overflow:hidden;background:var(--bg);color:var(--text)}
    .p16-head{height:112px;flex:0 0 112px;border-bottom:2px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;padding:12px 0 14px;box-sizing:border-box}
    .p16-kicker{font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.13em;color:var(--env);margin:0 0 9px}
    .p16-title{font:600 var(--fs-h1)/1.2 var(--font-serif);letter-spacing:.01em;margin:0;max-width:1110px}
    .p16-index{font:400 var(--fs-tick)/1 var(--font-mono);color:var(--muted);padding-top:8px;letter-spacing:.08em}
    .p16-main{flex:1;min-height:0;display:flex;flex-direction:column;padding:28px 0 17px;box-sizing:border-box}
    .p16-focus{flex:1;min-height:0;position:relative;display:flex;align-items:stretch;justify-content:center}
    .p16-caption{height:56px;flex:0 0 56px;border-top:2px solid var(--line);padding-top:14px;box-sizing:border-box;display:flex;align-items:flex-start;justify-content:space-between;gap:48px}
    .p16-caption .lead{margin:0;font:500 var(--fs-lead)/1.35 var(--font-sans);max-width:790px}
    .p16-next{margin:2px 0 0;font:400 var(--fs-sec)/1.35 var(--font-sans);color:var(--muted);text-align:right;max-width:500px}
    .p16-next b{color:var(--text);font-weight:600}
    .p16-diagram{width:100%;height:100%;display:block;overflow:visible}
    .p16-diagram text{font-family:var(--font-sans);fill:var(--text)}
    .p16-diagram .toplabel{font-size:15px;font-family:var(--font-mono);font-weight:700;letter-spacing:2px;fill:var(--muted)}
    .p16-diagram .parent{font-size:28px;font-family:var(--font-serif);font-weight:600}
    .p16-diagram .sub{font-size:16px;fill:var(--muted)}
    .p16-diagram .tagtext{font-size:16px;font-weight:700}
    .p16-diagram .info{font-size:20px;font-weight:600}
    .p16-diagram .small{font-size:15px;fill:var(--muted)}
    .p16-diagram .axislabel{font-size:15px;font-family:var(--font-mono);fill:var(--muted);letter-spacing:1px}
    .p16-diagram .frame{fill:none;stroke:var(--line);stroke-width:2}
    .p16-diagram .predict{stroke-dasharray:10 7}
    .p16-diagram .divider{stroke:var(--line);stroke-width:2}
    .p16-diagram .envline{fill:none;stroke:var(--env);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .p16-diagram .pathline{fill:none;stroke:var(--env);stroke-width:4;stroke-linecap:round;stroke-dasharray:9 8}
    .p16-diagram .storm{fill:none;stroke:var(--text);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .p16-diagram .accent{fill:var(--accent)}
    .p16-diagram .tagbox{fill:var(--panel);stroke:var(--line);stroke-width:2}
    .p16-diagram .tagbox-right{fill:var(--panel);stroke:var(--line);stroke-width:2;stroke-dasharray:8 5}
    .p16-diagram .quiet{stroke:var(--line);stroke-width:2;stroke-dasharray:3 8;opacity:.75}
  </style>

  <header class="p16-head">
    <div class="min0">
      <p class="p16-kicker">ACT IV · FORECAST</p>
      <h1 class="p16-title">知道方向盘是谁，还不等于能画出唯一正确的未来路径</h1>
    </div>
    <div class="p16-index" aria-hidden="true">16 / 21</div>
  </header>

  <main class="p16-main min0">
    <section class="p16-focus focus k-classification min0" aria-labelledby="forecast-title">
      <svg class="p16-diagram" viewBox="0 0 1488 610" role="img" aria-labelledby="forecast-title forecast-desc" preserveAspectRatio="xMidYMid meet">
        <title id="forecast-title">路径预报的分类图</title>
        <desc id="forecast-desc">路径预报包含已经知道的大尺度气流掌舵，以及仍需表达的多条未来可能路径。三条路径从同一现在位置出发并共同指向未来。</desc>
        <defs>
          <marker id="p16-arrow-env" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="var(--env)"/></marker>
          <marker id="p16-arrow-gray" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="var(--line)"/></marker>
        </defs>

        <text x="74" y="36" class="toplabel">CLASSIFICATION · ONE FORECAST, TWO KINDS OF INFORMATION</text>
        <rect x="74" y="58" width="1340" height="444" rx="6" class="frame"/>
        <text x="112" y="104" class="parent">路径预报</text>
        <text x="290" y="103" class="sub">从现在，推向未来</text>
        <line x1="112" y1="126" x2="1376" y2="126" class="divider"/>
        <line x1="744" y1="126" x2="744" y2="502" class="divider"/>

        <rect x="105" y="159" width="598" height="286" rx="6" class="frame"/>
        <rect x="105" y="159" width="150" height="40" rx="6" class="tagbox"/>
        <text x="126" y="185" class="tagtext">已经知道</text>
        <text x="145" y="239" class="info">大尺度气流掌舵</text>
        <text x="145" y="267" class="small">台风整体会随周围的引导气流平移</text>
        <path d="M274 360 C238 319 276 277 328 294 C376 310 374 375 326 395 C282 412 237 383 256 340 C277 294 351 298 361 351 C370 402 300 427 266 381" class="storm"/>
        <circle cx="307" cy="352" r="8" fill="var(--text)"/>
        <text x="230" y="432" class="small">台风环流</text>
        <path d="M438 352 L605 352" class="envline" marker-end="url(#p16-arrow-env)"/>
        <text x="428" y="323" class="small" style="fill:var(--env)">环境风</text>

        <rect x="785" y="159" width="592" height="286" rx="6" class="frame predict"/>
        <rect x="785" y="159" width="150" height="40" rx="6" class="tagbox-right"/>
        <text x="807" y="185" class="tagtext">仍需表达</text>
        <text x="825" y="239" class="info">未来不只一条可能路径</text>
        <text x="825" y="267" class="small">同一现在，向尚未封闭的未来展开</text>
        <circle cx="862" cy="367" r="10" class="accent"/>
        <text x="826" y="402" class="small">共同起点</text>
        <path d="M873 367 C948 360 1002 338 1062 302 S1195 237 1284 239" class="pathline"/>
        <path d="M873 367 C955 367 1022 363 1094 350 S1208 336 1305 342" class="pathline"/>
        <path d="M873 367 C941 374 1004 385 1071 408 S1190 454 1309 426" class="pathline"/>
        <line x1="1336" y1="208" x2="1336" y2="425" class="quiet"/>
        <text x="1254" y="295" class="small" style="fill:var(--env)">尚未封闭</text>

        <line x1="145" y1="548" x2="1337" y2="548" class="divider" marker-end="url(#p16-arrow-gray)"/>
        <text x="145" y="579" class="axislabel">现在</text>
        <text x="1235" y="579" class="axislabel">未来</text>
      </svg>
    </section>
    <footer class="p16-caption">
      <p class="lead">机制告诉我们路径受什么控制；预报还必须面对不止一种可能。</p>
      <p class="p16-next"><b>下一问</b>　为什么几乎相同的起点，几天后会走出不同路径？</p>
    </footer>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
