<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --demand-color: #0d5c75;
      --supply-color: #b33927;
      --eq-color: #2b3035;
      --surplus-color: #d97706;
      --shortage-color: #dc2626;
      --grid-line: #e2ded4;
    }

    #stage {
      padding: 56px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--text);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .nt-title {
      font-size: 40px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin: 0;
    }

    .subtitle-note {
      font-size: 15px;
      color: #63686e;
      margin: 0;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 880px 480px;
      gap: 80px;
      align-items: center;
      flex: 1;
      margin: 20px 0;
    }

    /* Chart SVG Area */
    .chart-panel {
      position: relative;
      width: 880px;
      height: 520px;
    }

    .chart-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Interactive controls & readout */
    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 4px;
      width: fit-content;
    }

    .status-badge.surplus {
      background: #fef3c7;
      color: #92400e;
    }

    .status-badge.shortage {
      background: #fee2e2;
      color: #991b1b;
    }

    .status-badge.clearing {
      background: #dcfce7;
      color: #166534;
    }

    .metric-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      border-top: 1px solid var(--grid-line);
      border-bottom: 1px solid var(--grid-line);
      padding: 16px 0;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric-item .label {
      font-size: 13px;
      color: #71767b;
      letter-spacing: 0.02em;
    }

    .metric-item .val {
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
    }

    .slider-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 600;
    }

    .slider-header span {
      font-family: var(--font-mono);
      color: #1a1c1e;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      background: #ded9cd;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--text);
      border: 3px solid #f6f4ee;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      cursor: grab;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .preset-btn {
      flex: 1;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid #c9c5b9;
      background: #fbf9f4;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text);
    }

    .preset-btn:hover {
      background: #ede9de;
    }

    .action-btn {
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      background: var(--text);
      color: #f6f4ee;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .action-btn:hover {
      background: #33373b;
    }

    .gap-evidence {
      font-size: 14px;
      line-height: 1.5;
      color: #4b5157;
    }
  </style>
</head>
<body data-page="07" data-total="16">
  <div id="stage">
    <div class="header-row">
      <div>
        <h1 class="nt-title">市场出清：价格信号与供求自发均衡</h1>
      </div>
      <p class="subtitle-note">拖动报价或点击自发出清观察缺口消除</p>
    </div>

    <div class="main-grid">
      <!-- 坐标与曲线区域 -->
      <div class="chart-panel">
        <svg id="chart" class="chart-svg" viewBox="0 0 880 520">
          <!-- 坐标系背景网格 -->
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#8c9298" />
            </marker>
          </defs>

          <!-- 坐标轴 -->
          <line x1="80" y1="460" x2="840" y2="460" stroke="#8c9298" stroke-width="2" marker-end="url(#arrow)" />
          <line x1="80" y1="460" x2="80" y2="40" stroke="#8c9298" stroke-width="2" marker-end="url(#arrow)" />

          <text x="840" y="490" font-size="14" fill="#63686e" text-anchor="end" font-weight="600">数量 Q (件)</text>
          <text x="70" y="35" font-size="14" fill="#63686e" text-anchor="start" font-weight="600">价格 P (元)</text>

          <!-- 刻度线与网格辅助线 -->
          <g id="grid-lines" stroke="#ebe7dc" stroke-dasharray="3 3"></g>

          <!-- 供求曲线：
               需求: P = 100 - Q => 当 P=20, Q=80; 当 P=80, Q=20
               供给: P = 20 + Q  => 当 P=20, Q=0; 当 P=80, Q=60
               均衡: 100 - Q = 20 + Q => 2Q = 80 => Q*=40, P*=60
               坐标映射: 
               Q 范围 0 到 100 => X 范围 80 到 780 (宽 700, 7px/单位)
               P 范围 0 到 100 => Y 范围 460 到 60 (高 400, 4px/单位, Y = 460 - P * 4)
          -->
          <!-- 需求曲线 D -->
          <line x1="150" y1="100" x2="710" y2="420" stroke="#0d5c75" stroke-width="4" stroke-linecap="round" />
          <text x="720" y="430" font-size="16" font-weight="700" fill="#0d5c75">D (需求)</text>

          <!-- 供给曲线 S -->
          <line x1="150" y1="380" x2="710" y2="100" stroke="#b33927" stroke-width="4" stroke-linecap="round" />
          <text x="720" y="105" font-size="16" font-weight="700" fill="#b33927">S (供给)</text>

          <!-- 均衡参考虚线与点 E (Q*=40, P*=60) -> X=80+40*7=360, Y=460-60*4=220 -->
          <line x1="80" y1="220" x2="360" y2="220" stroke="#8c9298" stroke-width="1.5" stroke-dasharray="4 4" />
          <line x1="360" y1="220" x2="360" y2="460" stroke="#8c9298" stroke-width="1.5" stroke-dasharray="4 4" />
          <circle cx="360" cy="220" r="5" fill="#2b3035" />
          <text x="372" y="215" font-size="14" font-weight="700" fill="#2b3035">均衡点 E (40, 60)</text>

          <!-- 动态区域：差额矩形 / 线段 -->
          <rect id="gap-area" x="0" y="0" width="0" height="0" fill="none" opacity="0.15" />
          <!-- 动态价格线 -->
          <line id="p-line" x1="80" y1="220" x2="780" y2="220" stroke="#2b3035" stroke-width="2" stroke-dasharray="5 5" />
          <!-- 需求量点与垂线 -->
          <line id="qd-line" x1="0" y1="0" x2="0" y2="460" stroke="#0d5c75" stroke-width="1.5" stroke-dasharray="3 3" />
          <circle id="qd-dot" cx="0" cy="0" r="6" fill="#0d5c75" />
          <!-- 供给量点与垂线 -->
          <line id="qs-line" x1="0" y1="0" x2="0" y2="460" stroke="#b33927" stroke-width="1.5" stroke-dasharray="3 3" />
          <circle id="qs-dot" cx="0" cy="0" r="6" fill="#b33927" />

          <!-- 短缺/过剩指示连线与箭头 -->
          <line id="gap-bar" x1="0" y1="0" x2="0" y2="0" stroke="#d97706" stroke-width="6" stroke-linecap="round" />
          <text id="gap-text" x="0" y="0" font-size="14" font-weight="700" text-anchor="middle" fill="#d97706"></text>

          <!-- 轴上动态数值标签 -->
          <text id="axis-p-label" x="70" y="225" font-size="13" font-weight="600" text-anchor="end" fill="#1a1c1e"></text>
          <text id="axis-qd-label" x="0" y="480" font-size="13" font-weight="600" text-anchor="middle" fill="#0d5c75"></text>
          <text id="axis-qs-label" x="0" y="480" font-size="13" font-weight="600" text-anchor="middle" fill="#b33927"></text>
        </svg>
      </div>

      <!-- 右侧控制面板 -->
      <div class="control-panel">
        <div id="status-badge" class="status-badge clearing">
          <span id="badge-title">市场已出清</span>
        </div>

        <div class="metric-row">
          <div class="metric-item">
            <span class="label">价格 P</span>
            <span id="val-p" class="val">60</span>
          </div>
          <div class="metric-item">
            <span class="label">需求 Qd</span>
            <span id="val-qd" class="val" style="color:var(--demand-color)">40</span>
          </div>
          <div class="metric-item">
            <span class="label">供给 Qs</span>
            <span id="val-qs" class="val" style="color:var(--supply-color)">40</span>
          </div>
        </div>

        <div class="slider-box">
          <div class="slider-header">
            <span>调节市场报价</span>
            <span id="slider-readout">P = 60 元</span>
          </div>
          <input type="range" id="price-slider" min="30" max="90" step="1" value="60">
        </div>

        <div class="btn-group">
          <button class="preset-btn" id="btn-high">过剩 (P=80)</button>
          <button class="preset-btn" id="btn-low">短缺 (P=40)</button>
          <button class="preset-btn" id="btn-eq">均衡 (P=60)</button>
        </div>

        <button class="action-btn" id="btn-adjust">
          自发调价出清
        </button>

        <div class="gap-evidence" id="gap-desc">
          在均衡价 60 元处，买方愿购数量与卖方愿售数量完全匹配，市场无供求缺口。
        </div>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    本页呈现市场机制的核心驱动力：价格既是信息也是激励。
    当价格偏离均衡点时，自发的短缺或过剩会推动价格反向修正：
    若价格过高，供大于求形成库存积压，竞争迫使卖方降价出清；
    若价格过低，供不应求引发抢购与排队，买方加价竞争促使价格回升。
    这种无需中央指令的自发协调，即是亚当·斯密所说的“看不见的手”。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 7, total: 16 });

    // 状态与数学模型:
    // P 范围 [30, 90]
    // 需求: Q_d = 100 - P
    // 供给: Q_s = P - 20
    // 均衡: P* = 60, Q* = 40
    let currentP = 60;
    let animId = null;

    const slider = document.getElementById('price-slider');
    const valP = document.getElementById('val-p');
    const valQd = document.getElementById('val-qd');
    const valQs = document.getElementById('val-qs');
    const sliderReadout = document.getElementById('slider-readout');
    const badge = document.getElementById('status-badge');
    const badgeTitle = document.getElementById('badge-title');
    const gapDesc = document.getElementById('gap-desc');

    // SVG 元素
    const pLine = document.getElementById('p-line');
    const qdLine = document.getElementById('qd-line');
    const qdDot = document.getElementById('qd-dot');
    const qsLine = document.getElementById('qs-line');
    const qsDot = document.getElementById('qs-dot');
    const gapBar = document.getElementById('gap-bar');
    const gapText = document.getElementById('gap-text');
    const gapArea = document.getElementById('gap-area');
    const axisPLabel = document.getElementById('axis-p-label');
    const axisQdLabel = document.getElementById('axis-qd-label');
    const axisQsLabel = document.getElementById('axis-qs-label');

    // 坐标换算函数:
    // X: Q in [0, 100] => 80 + Q * 7
    // Y: P in [0, 100] => 460 - P * 4
    function qToX(q) {
      return 80 + q * 7;
    }
    function pToY(p) {
      return 460 - p * 4;
    }

    function updateView(p) {
      currentP = p;
      slider.value = p;
      const qd = 100 - p;
      const qs = p - 20;
      const gap = qs - qd; // >0 为过剩，<0 为短缺

      // 更新数值显示
      valP.textContent = p;
      valQd.textContent = qd;
      valQs.textContent = qs;
      sliderReadout.textContent = `P = ${p} 元`;

      const y = pToY(p);
      const xQd = qToX(qd);
      const xQs = qToX(qs);

      // 价格横线
      pLine.setAttribute('y1', y);
      pLine.setAttribute('y2', y);

      // 需求点与虚线
      qdLine.setAttribute('x1', xQd);
      qdLine.setAttribute('y1', y);
      qdLine.setAttribute('x2', xQd);
      qdDot.setAttribute('cx', xQd);
      qdDot.setAttribute('cy', y);

      // 供给点与虚线
      qsLine.setAttribute('x1', xQs);
      qsLine.setAttribute('y1', y);
      qsLine.setAttribute('x2', xQs);
      qsDot.setAttribute('cx', xQs);
      qsDot.setAttribute('cy', y);

      // 轴刻度文字
      axisPLabel.setAttribute('y', y + 5);
      axisPLabel.textContent = `${p}`;

      if (Math.abs(gap) <= 0.5) {
        axisQdLabel.setAttribute('x', xQd);
        axisQdLabel.textContent = `Q*=${qd}`;
        axisQsLabel.textContent = '';
      } else {
        axisQdLabel.setAttribute('x', xQd);
        axisQdLabel.textContent = `Qd=${qd}`;

        axisQsLabel.setAttribute('x', xQs);
        axisQsLabel.textContent = `Qs=${qs}`;
      }

      // 差额状态
      if (Math.abs(gap) <= 0.5) {
        badge.className = 'status-badge clearing';
        badgeTitle.textContent = '供求平衡 · 市场出清';
        gapBar.setAttribute('stroke', 'transparent');
        gapText.textContent = '';
        gapArea.setAttribute('width', '0');
        gapDesc.textContent = '在均衡价格 60 元处，买卖双方意愿完全一致，既无库存积压亦无排队抢购。';
      } else if (gap > 0) {
        badge.className = 'status-badge surplus';
        badgeTitle.textContent = `供过于求 · 过剩 ${gap} 件`;
        gapBar.setAttribute('stroke', '#d97706');
        gapBar.setAttribute('x1', xQd);
        gapBar.setAttribute('y1', y);
        gapBar.setAttribute('x2', xQs);
        gapBar.setAttribute('y2', y);

        gapText.setAttribute('x', (xQd + xQs) / 2);
        gapText.setAttribute('y', y - 10);
        gapText.setAttribute('fill', '#d97706');
        gapText.textContent = `过剩: ${gap}`;

        gapArea.setAttribute('x', xQd);
        gapArea.setAttribute('y', y);
        gapArea.setAttribute('width', xQs - xQd);
        gapArea.setAttribute('height', 460 - y);
        gapArea.setAttribute('fill', '#d97706');

        gapDesc.textContent = `价格高于均衡点，卖方产 ${qs} 件但买方仅需 ${qd} 件，积压 ${gap} 件库存，迫使价格下行。`;
      } else {
        const shortage = -gap;
        badge.className = 'status-badge shortage';
        badgeTitle.textContent = `供不应求 · 短缺 ${shortage} 件`;
        gapBar.setAttribute('stroke', '#dc2626');
        gapBar.setAttribute('x1', xQs);
        gapBar.setAttribute('y1', y);
        gapBar.setAttribute('x2', xQd);
        gapBar.setAttribute('y2', y);

        gapText.setAttribute('x', (xQd + xQs) / 2);
        gapText.setAttribute('y', y - 10);
        gapText.setAttribute('fill', '#dc2626');
        gapText.textContent = `短缺: ${shortage}`;

        gapArea.setAttribute('x', xQs);
        gapArea.setAttribute('y', y);
        gapArea.setAttribute('width', xQd - xQs);
        gapArea.setAttribute('height', 460 - y);
        gapArea.setAttribute('fill', '#dc2626');

        gapDesc.textContent = `价格低于均衡点，买方需 ${qd} 件而卖方仅供 ${qs} 件，短缺 ${shortage} 件，买方竞争推高报价。`;
      }
    }

    slider.addEventListener('input', (e) => {
      if (animId) cancelAnimationFrame(animId);
      updateView(Number(e.target.value));
    });

    document.getElementById('btn-high').addEventListener('click', () => {
      if (animId) cancelAnimationFrame(animId);
      updateView(80);
    });

    document.getElementById('btn-low').addEventListener('click', () => {
      if (animId) cancelAnimationFrame(animId);
      updateView(40);
    });

    document.getElementById('btn-eq').addEventListener('click', () => {
      if (animId) cancelAnimationFrame(animId);
      updateView(60);
    });

    // 动态调价出清模拟
    document.getElementById('btn-adjust').addEventListener('click', () => {
      if (animId) cancelAnimationFrame(animId);
      const targetP = 60;
      function step() {
        const diff = targetP - currentP;
        if (Math.abs(diff) < 0.5) {
          updateView(targetP);
          return;
        }
        const nextP = currentP + diff * 0.08;
        updateView(Math.round(nextP * 10) / 10);
        animId = requestAnimationFrame(step);
      }
      step();
    });

    // 初始化
    updateView(80);
  </script>
</body>
</html>
