<!doctype html>
<html lang="zh" data-variant="opening">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      overflow: hidden;
      contain: layout paint;
    }

    /* 标题区域：安全净空 96px */
    .cover-header {
      position: absolute;
      top: 110px;
      left: 96px;
      width: 760px;
      z-index: 10;
    }

    .cover-title {
      font-family: var(--font-display);
      font-size: 68px;
      line-height: 1.08;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
      margin: 0 0 24px 0;
    }

    .cover-lead {
      font-family: var(--font-sans);
      font-size: 22px;
      line-height: 1.45;
      color: #383c40;
      max-width: 640px;
      margin: 0;
    }

    /* 底部三轴直觉判断：严格保留 100px 底边净空 */
    .tradeoff-triad {
      position: absolute;
      bottom: 104px;
      left: 96px;
      width: 720px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 36px;
      z-index: 10;
    }

    .triad-col {
      border-top: 2px solid rgba(26, 28, 30, 0.2);
      padding-top: 14px;
    }

    .triad-col:nth-child(1) { border-top-color: #0d4a52; }
    .triad-col:nth-child(2) { border-top-color: #b33927; }
    .triad-col:nth-child(3) { border-top-color: #73787e; }

    .triad-title {
      font-family: var(--font-sans);
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .triad-desc {
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.4;
      color: #555b62;
      margin: 0;
    }

    /* 右侧几何分析主角：供求剪刀、税收楔子与净损失三角形 */
    .market-apparatus {
      position: absolute;
      top: 96px;
      right: 80px;
      width: 620px;
      height: 700px;
      z-index: 5;
    }

    .scene-svg {
      width: 100%;
      height: 100%;
    }

    .grid-axis {
      stroke: rgba(26, 28, 30, 0.25);
      stroke-width: 1.5;
    }

    .grid-sub {
      stroke: rgba(26, 28, 30, 0.08);
      stroke-dasharray: 4 4;
      stroke-width: 1;
    }

    .curve-d {
      stroke: #0d4a52;
      stroke-width: 3.5;
      stroke-linecap: round;
    }

    .curve-s {
      stroke: #b33927;
      stroke-width: 3.5;
      stroke-linecap: round;
    }

    .curve-st {
      stroke: #b33927;
      stroke-width: 2;
      stroke-dasharray: 6 5;
      opacity: 0.6;
    }

    .dwl-area {
      fill: rgba(179, 57, 39, 0.16);
      stroke: #b33927;
      stroke-width: 1.5;
      stroke-dasharray: 3 3;
    }

    .wedge-line {
      stroke: #1a1c1e;
      stroke-width: 2.5;
    }

    .price-ceiling-line {
      stroke: #73787e;
      stroke-width: 2;
      stroke-dasharray: 5 4;
    }

    .pt-dot {
      fill: #f6f4ee;
      stroke-width: 2.5;
    }
    .pt-eq { stroke: #1a1c1e; }
    .pt-d { stroke: #0d4a52; }
    .pt-s { stroke: #b33927; }

    .graph-label {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 600;
      fill: var(--text);
    }

    .graph-sublabel {
      font-family: var(--font-sans);
      font-size: 13px;
      fill: #555b62;
    }
  </style>
</head>
<body data-page="16" data-total="16">
  <div id="stage">
    <!-- 标题与核心命题 -->
    <section class="cover-header">
      <h1 class="cover-title">思维收束：<br>价格机制与政策权衡</h1>
      <p class="cover-lead">
        价格是传递稀缺性的信号机。政策干预无法取消边际权衡。
      </p>
    </section>

    <!-- 底部三轴直觉判断 -->
    <div class="tradeoff-triad">
      <div class="triad-col">
        <div class="triad-title">供求传递信息</div>
        <p class="triad-desc">协调分散行动与机会成本。</p>
      </div>
      <div class="triad-col">
        <div class="triad-title">弹性决定转嫁</div>
        <p class="triad-desc">缺乏替代者承担更多冲击。</p>
      </div>
      <div class="triad-col">
        <div class="triad-title">干预必有代价</div>
        <p class="triad-desc">效率损失要求审慎权衡。</p>
      </div>
    </div>

    <!-- 右侧严谨的分析图形主角：供求剪刀、税收楔子与净损失三角形 -->
    <div class="market-apparatus">
      <svg class="scene-svg" viewBox="0 0 620 700" fill="none" role="img" aria-label="供求均衡与税收楔子结构图解">
        <!-- 坐标轴，确保在 96px 留白范围内 (y: 100~540) -->
        <line x1="80" y1="530" x2="550" y2="530" class="grid-axis" />
        <line x1="80" y1="530" x2="80" y2="105" class="grid-axis" />
        
        <!-- 轴标签 -->
        <text x="555" y="534" class="graph-label" dominant-baseline="middle">Q</text>
        <text x="80" y="90" class="graph-label" text-anchor="middle">P</text>

        <!-- 水平/垂直辅助线网格 -->
        <line x1="80" y1="420" x2="520" y2="420" class="grid-sub" />
        <line x1="80" y1="315" x2="520" y2="315" class="grid-sub" />
        <line x1="80" y1="210" x2="520" y2="210" class="grid-sub" />
        <line x1="225" y1="530" x2="225" y2="120" class="grid-sub" />
        <line x1="340" y1="530" x2="340" y2="120" class="grid-sub" />

        <!-- 无谓损失 (Deadweight Loss) 阴影区域 -->
        <polygon points="340,315 225,210 225,420" class="dwl-area" />
        <text x="270" y="320" class="graph-sublabel" fill="#b33927" font-weight="600">DWL</text>

        <!-- 需求曲线 D (斜率向右下) -->
        <line x1="120" y1="115" x2="500" y2="465" class="curve-d" />
        <text x="508" y="478" class="graph-label" fill="#0d4a52">D (MB)</text>

        <!-- 供给曲线 S (斜率向右上) -->
        <line x1="120" y1="515" x2="500" y2="165" class="curve-s" />
        <text x="508" y="160" class="graph-label" fill="#b33927">S (MC)</text>

        <!-- 税收平移曲线 S + Tax (示意) -->
        <line x1="120" y1="410" x2="420" y2="135" class="curve-st" />
        <text x="426" y="130" class="graph-sublabel" fill="#b33927">S + Tax</text>

        <!-- 税收楔子 (Tax Wedge) 竖线 -->
        <line x1="225" y1="210" x2="225" y2="420" class="wedge-line" />
        <circle cx="225" cy="210" r="5" class="pt-dot pt-d" />
        <circle cx="225" cy="420" r="5" class="pt-dot pt-s" />
        <text x="175" y="318" class="graph-label" text-anchor="middle">Tax</text>
        <text x="175" y="338" class="graph-sublabel" text-anchor="middle">楔子</text>

        <!-- 市场均衡点 E* -->
        <circle cx="340" cy="315" r="6" class="pt-dot pt-eq" />
        <text x="358" y="310" class="graph-label">E*</text>

        <!-- 坐标投影标签 -->
        <text x="225" y="550" class="graph-label" text-anchor="middle">Q<tspan dy="3" font-size="11">t</tspan></text>
        <text x="340" y="550" class="graph-label" text-anchor="middle">Q*</text>

        <text x="68" y="214" class="graph-label" text-anchor="end">P<tspan dy="3" font-size="11">b</tspan></text>
        <text x="68" y="319" class="graph-label" text-anchor="end">P*</text>
        <text x="68" y="424" class="graph-label" text-anchor="end">P<tspan dy="3" font-size="11">s</tspan></text>

        <!-- 管制上限 Price Ceiling 示意虚线 -->
        <line x1="80" y1="375" x2="500" y2="375" class="price-ceiling-line" />
        <text x="430" y="365" class="graph-sublabel" fill="#73787e">价格上限</text>
      </svg>
    </div>
  </div>

  <aside class="notes" hidden>
    同学们好，来到全课程的最后一讲：思维收束。
    前面我们系统学习了机会成本、边际分析、供求均衡、弹性测算，以及政府税收与价格管制的实际作用。
    这节课我们不再推导新公式，而是提炼出经济学最根本的思维直觉：
    在稀缺的世界里，价格机制是不可或缺的信息信号；
    而任何公共政策的干预，不论初衷多么良好，都在改变边际激励并引发权衡取舍。
    理解这种权衡，就是经济学直觉带给我们的最大价值。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 16, total: 16 });
  </script>
</body>
</html>
