<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>选择性亲和而非线性因果</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .page-header {
      position: absolute;
      top: 64px;
      left: 100px;
      right: 100px;
    }

    .page-header .nt-title {
      margin-top: 6px;
      font-size: 42px;
      letter-spacing: 0.02em;
    }

    .compare-stage {
      position: absolute;
      top: 180px;
      left: 100px;
      right: 100px;
      height: 520px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
    }

    .model-box {
      position: relative;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.45);
      padding: 24px 28px 16px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .model-box--aff {
      border-color: rgba(150, 79, 36, 0.4);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: var(--shadow-sm);
    }

    .model-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .model-name {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 600;
      color: var(--text-pure);
      margin: 0;
    }

    .model-tag {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .model-summary {
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted-dark);
      margin: 0 0 16px 0;
    }

    .model-viz {
      flex: 1;
      position: relative;
      border-top: 1px solid var(--border);
    }

    .model-viz svg {
      width: 100%;
      height: 100%;
    }

    .quote-strip {
      position: absolute;
      bottom: 50px;
      left: 100px;
      right: 100px;
    }

    .quote-strip .nt-quote {
      font-size: 15px;
      line-height: 1.6;
      padding: 4px 0 4px 18px;
    }
  </style>
</head>
<body data-page="09" data-total="11">
  <div id="stage">
    <header class="page-header">
      <div class="nt-subtitle">论证边界</div>
      <h1 class="nt-title">选择性亲和而非线性因果</h1>
    </header>

    <main class="compare-stage">
      <!-- 决定论误区 -->
      <section class="model-box min0">
        <div class="model-head">
          <h2 class="model-name">机械决定论</h2>
          <span class="model-tag" style="color: var(--accent-crimson);">教条设定</span>
        </div>
        <p class="model-summary">误将宗教改革视作资本主义的始因。</p>
        <div class="model-viz">
          <svg viewBox="0 0 620 340">
            <defs>
              <marker id="m-crimson" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                <path d="M1,1 L7,4 L1,7 Z" fill="#8C2D2B" />
              </marker>
            </defs>

            <!-- 节点 A -->
            <rect x="24" y="66" width="168" height="74" rx="2" fill="#FFFFFF" stroke="#DDD6C8" stroke-width="1.5" />
            <text x="108" y="102" text-anchor="middle" font-family="var(--font-serif)" font-size="18" font-weight="600" fill="#110F0D">新教伦理</text>
            <text x="108" y="124" text-anchor="middle" font-family="var(--font-sans)" font-size="13" fill="#736E65">天职与苦修</text>

            <!-- 单向箭头 -->
            <path d="M194 103 L424 103" stroke="#8C2D2B" stroke-width="2.5" marker-end="url(#m-crimson)" />
            <text x="310" y="88" text-anchor="middle" font-family="var(--font-sans)" font-size="14" font-weight="600" fill="#8C2D2B">决定造就</text>

            <!-- 节点 B -->
            <rect x="428" y="66" width="168" height="74" rx="2" fill="#FFFFFF" stroke="#DDD6C8" stroke-width="1.5" />
            <text x="512" y="102" text-anchor="middle" font-family="var(--font-serif)" font-size="18" font-weight="600" fill="#110F0D">资本主义精神</text>
            <text x="512" y="124" text-anchor="middle" font-family="var(--font-sans)" font-size="13" fill="#736E65">理性核算积累</text>

            <!-- 驳斥注记 -->
            <g transform="translate(24, 204)">
              <rect x="0" y="0" width="572" height="92" rx="2" fill="rgba(140, 45, 43, 0.05)" stroke="rgba(140, 45, 43, 0.2)" stroke-dasharray="4 4" />
              <circle cx="38" cy="46" r="14" fill="#8C2D2B" />
              <path d="M30 46 L46 46" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
              <text x="68" y="38" font-family="var(--font-sans)" font-size="14" font-weight="600" fill="#8C2D2B">反驳单向因果</text>
              <text x="68" y="64" font-family="var(--font-sans)" font-size="13" fill="#4A463F">现代经济形式早于加尔文派，非神学单向催生。</text>
            </g>
          </svg>
        </div>
      </section>

      <!-- 韦伯选择性亲和 -->
      <section class="model-box model-box--aff min0">
        <div class="model-head">
          <h2 class="model-name">选择性亲和</h2>
          <span class="model-tag nt-badge nt-badge--ochre">Wahlverwandtschaft</span>
        </div>
        <p class="model-summary">信仰焦虑与理性制度相遇，彼此赋能锁定。</p>
        <div class="model-viz">
          <svg viewBox="0 0 620 340">
            <defs>
              <marker id="m-ochre" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                <path d="M1,1 L7,4 L1,7 Z" fill="#964F24" />
              </marker>
              <marker id="m-slate" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                <path d="M1,1 L7,4 L1,7 Z" fill="#3B5360" />
              </marker>
            </defs>

            <!-- 观念流 -->
            <rect x="24" y="34" width="166" height="66" rx="2" fill="#FFFFFF" stroke="#DDD6C8" stroke-width="1.5" />
            <text x="107" y="62" text-anchor="middle" font-family="var(--font-serif)" font-size="16" font-weight="600" fill="#110F0D">救赎焦虑</text>
            <text x="107" y="83" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#964F24">精神驱动力</text>

            <!-- 物质制度流 -->
            <rect x="24" y="146" width="166" height="66" rx="2" fill="#FFFFFF" stroke="#DDD6C8" stroke-width="1.5" />
            <text x="107" y="174" text-anchor="middle" font-family="var(--font-serif)" font-size="16" font-weight="600" fill="#110F0D">法权与簿记</text>
            <text x="107" y="195" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#3B5360">物质与制度基底</text>

            <!-- 交汇路径 -->
            <path d="M192 67 C245 67, 268 98, 308 108" fill="none" stroke="#964F24" stroke-width="2" marker-end="url(#m-ochre)" />
            <path d="M192 179 C245 179, 268 148, 308 138" fill="none" stroke="#3B5360" stroke-width="2" marker-end="url(#m-slate)" />

            <!-- 交汇共鸣核心 -->
            <rect x="318" y="86" width="280" height="74" rx="3" fill="#FFFFFF" stroke="#964F24" stroke-width="2" />
            <text x="458" y="118" text-anchor="middle" font-family="var(--font-serif)" font-size="18" font-weight="700" fill="#964F24">契合共振：赋能倍增</text>
            <text x="458" y="142" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" fill="#4A463F">精神注入灵魂 · 制度支撑运转</text>

            <!-- 扳道工注记条 -->
            <g transform="translate(24, 252)">
              <rect x="0" y="0" width="574" height="44" rx="2" fill="rgba(150, 79, 36, 0.08)" stroke="rgba(150, 79, 36, 0.2)" />
              <text x="18" y="27" font-family="var(--font-sans)" font-size="13" font-weight="600" fill="#964F24">扳道工：</text>
              <text x="76" y="27" font-family="var(--font-sans)" font-size="13" fill="#1E1B18">思想不造铁轨，但决定行驶方向；二者互为因果。</text>
            </g>
          </svg>
        </div>
      </section>
    </main>

    <!-- 底部引语 -->
    <footer class="quote-strip">
      <blockquote class="nt-quote">
        “用片面的唯心主义历史观取代唯物主义历史观，同样行不通。二者若作为最终结论，都于真理毫无助益。”
        <cite class="nt-quote-cite">—— 马克斯·韦伯《新教伦理与资本主义精神》</cite>
      </blockquote>
    </footer>
  </div>

  <aside class="notes" hidden>
    本页解析韦伯论证的核心边界。韦伯并非用唯心主义对抗唯物主义，而是引入歌德的“选择性亲和”（Wahlverwandtschaft）概念：宗教观念与近代市场理性是两条独立的历史线索，它们在特定历史时期彼此契合、强化，形成了独特的现代资本主义精神。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 9, total: 11 });
  </script>
</body>
</html>
