<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: 56px 80px 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--text);
      font-family: var(--font-sans);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid #E2E8F0;
      padding-bottom: 24px;
    }

    .title-group {
      max-width: 900px;
    }

    .nt-title {
      margin: 0;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: #0F172A;
    }

    .nt-lead {
      margin: 10px 0 0;
      font-size: 20px;
      line-height: 1.4;
      color: var(--muted);
    }

    .header-tag {
      font-size: 14px;
      color: var(--primary);
      background: rgba(37, 99, 235, 0.08);
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 500;
      white-space: nowrap;
      border: 1px solid rgba(37, 99, 235, 0.2);
    }

    /* Bento Main Grid */
    .bento-field {
      display: grid;
      grid-template-columns: 460px 1fr;
      grid-template-rows: 580px;
      gap: 28px;
      margin-top: 32px;
    }

    .panel {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 28px 32px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Decision Panel (Left) */
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .panel-title {
      font-size: 18px;
      font-weight: 700;
      color: #0F172A;
      margin: 0;
    }

    .option-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .opt-card {
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      padding: 16px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #F8FAFC;
    }

    .opt-card:hover {
      border-color: #94A3B8;
    }

    .opt-card.active {
      border-color: var(--primary);
      background: #EFF6FF;
    }

    .opt-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .opt-name {
      font-size: 16px;
      font-weight: 600;
      color: #1E293B;
    }

    .opt-val {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
    }

    .opt-card.active .opt-name {
      color: var(--primary);
    }

    .opt-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }

    .opt-tag {
      font-size: 12px;
      color: #0284C7;
      margin-top: 2px;
    }

    /* Mechanism View (Right) */
    .comparison-area {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
      height: 100%;
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 250px;
    }

    svg.monoline {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .summary-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      background: #F8FAFC;
      border-radius: 12px;
      padding: 16px 20px;
      border: 1px solid #E2E8F0;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-lbl {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .stat-num {
      font-size: 22px;
      font-weight: 700;
      font-family: var(--font-mono);
    }

    .stat-num.opp {
      color: var(--accent);
    }

    .stat-num.gain {
      color: #059669;
    }

    .rule-note {
      font-size: 14px;
      color: #475569;
      line-height: 1.5;
      background: rgba(217, 119, 6, 0.08);
      border-left: 3px solid var(--accent);
      padding: 8px 14px;
      border-radius: 0 8px 8px 0;
    }
  </style>
</head>
<body data-page="03" data-total="16">
  <div id="stage">
    <header>
      <div class="title-group">
        <h1 class="nt-title">机会成本：放弃项中的最高价值</h1>
        <p class="nt-lead">做出选择时必须放弃的替代方案中，价值最高的一项。</p>
      </div>
      <span class="header-tag">资源约束与不可兼得</span>
    </header>

    <div class="bento-field">
      <!-- Left: Option Picker -->
      <section class="panel">
        <div class="panel-header">
          <h2 class="panel-title">投入资源：周六下午 4 小时</h2>
          <span style="font-size:13px;color:var(--muted)">点击切换方案</span>
        </div>
        <div class="option-list" id="optList">
          <!-- Rendered by JS -->
        </div>
      </section>

      <!-- Right: Opportunity Cost Anatomy -->
      <section class="panel">
        <div class="comparison-area">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <h2 class="panel-title" id="chosenTitle">当前决策：自修编程与经管</h2>
            <span style="font-size:14px;color:var(--muted)" id="abandonedCount">放弃 3 项</span>
          </div>

          <div class="chart-container">
            <svg class="monoline" id="costChart" viewBox="0 0 860 260"></svg>
          </div>

          <div class="summary-bar">
            <div class="stat-item">
              <span class="stat-lbl">所选收益</span>
              <span class="stat-num gain" id="gainDisplay">92 分</span>
            </div>
            <div class="stat-item">
              <span class="stat-lbl">机会成本（放弃项最大值）</span>
              <span class="stat-num opp" id="oppDisplay">84 分</span>
            </div>
          </div>

          <div class="rule-note" id="ruleText">
            机会成本仅按放弃项中最高一项计算，不累加其余选项。
          </div>
        </div>
      </section>
    </div>
  </div>

  <aside class="notes" hidden>
    经济学中机会成本的核心概念是“不可兼得”。当学生面对时间或资金约束时，选择了一个方案，就意味着放弃了其他方案。关键认知误区：机会成本不是把所有没做的事情收益加起来，而仅仅是放弃项中“最有价值的那一个”。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    const OPTIONS = [
      { id: 'study', name: '自修编程与经管', val: 92, tag: '提升人力资本' },
      { id: 'tutor', name: '兼职家教授课', val: 84, tag: '获得现金报酬' },
      { id: 'concert', name: '草地音乐节', val: 75, tag: '短期情绪愉悦' },
      { id: 'sleep', name: '补觉休息', val: 50, tag: '体能精力恢复' }
    ];

    let currentChoice = 'study';

    function renderOptions() {
      const list = document.getElementById('optList');
      list.innerHTML = '';
      OPTIONS.forEach(opt => {
        const div = document.createElement('div');
        div.className = `opt-card ${opt.id === currentChoice ? 'active' : ''}`;
        div.innerHTML = `
          <div class="opt-top">
            <span class="opt-name">${opt.name}</span>
            <span class="opt-val">${opt.val} 分</span>
          </div>
          <div class="opt-tag">${opt.tag}</div>
        `;
        div.onclick = () => selectOption(opt.id);
        list.appendChild(div);
      });
    }

    function selectOption(id) {
      currentChoice = id;
      renderOptions();
      updateAnalysis();
    }

    function updateAnalysis() {
      const chosen = OPTIONS.find(o => o.id === currentChoice);
      const abandoned = OPTIONS.filter(o => o.id !== currentChoice);
      
      abandoned.sort((a, b) => b.val - a.val);
      const oppCostItem = abandoned[0];

      document.getElementById('chosenTitle').textContent = `当前决策：${chosen.name}`;
      document.getElementById('gainDisplay').textContent = `${chosen.val} 分`;
      document.getElementById('oppDisplay').textContent = `${oppCostItem.val} 分`;
      
      document.getElementById('ruleText').innerHTML = 
        `放弃项中价值最高者为<strong>${oppCostItem.name}（${oppCostItem.val} 分）</strong>，即为此时的机会成本。`;

      drawChart(chosen, abandoned, oppCostItem);
    }

    function drawChart(chosen, abandoned, oppCostItem) {
      const svg = document.getElementById('costChart');
      svg.innerHTML = '';

      const barH = 30;
      const startX = 180;
      const maxW = 440;
      const maxVal = 100;

      // Group 1: Chosen
      const chosenY = 20;
      const wChosen = (chosen.val / maxVal) * maxW;

      // Chosen Label
      const txtChosen = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txtChosen.setAttribute('x', '0');
      txtChosen.setAttribute('y', chosenY + 20);
      txtChosen.setAttribute('font-size', '15');
      txtChosen.setAttribute('font-weight', '600');
      txtChosen.setAttribute('fill', '#059669');
      txtChosen.textContent = '【所选】' + chosen.name;
      svg.appendChild(txtChosen);

      // Chosen Bar
      const rectChosen = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rectChosen.setAttribute('x', startX);
      rectChosen.setAttribute('y', chosenY);
      rectChosen.setAttribute('width', wChosen);
      rectChosen.setAttribute('height', barH);
      rectChosen.setAttribute('rx', '6');
      rectChosen.setAttribute('fill', 'rgba(16, 185, 129, 0.18)');
      rectChosen.setAttribute('stroke', '#059669');
      rectChosen.setAttribute('stroke-width', '1.5');
      svg.appendChild(rectChosen);

      // Chosen Value
      const valChosen = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      valChosen.setAttribute('x', startX + wChosen + 16);
      valChosen.setAttribute('y', chosenY + 20);
      valChosen.setAttribute('font-size', '15');
      valChosen.setAttribute('font-family', 'var(--font-mono)');
      valChosen.setAttribute('font-weight', '700');
      valChosen.setAttribute('fill', '#059669');
      valChosen.textContent = `${chosen.val} 分`;
      svg.appendChild(valChosen);

      // Divider line
      const divLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      divLine.setAttribute('x1', '0');
      divLine.setAttribute('y1', '68');
      divLine.setAttribute('x2', '840');
      divLine.setAttribute('y2', '68');
      divLine.setAttribute('stroke', '#E2E8F0');
      divLine.setAttribute('stroke-dasharray', '4 4');
      svg.appendChild(divLine);

      // Abandoned items
      abandoned.forEach((item, idx) => {
        const itemY = 86 + idx * 52;
        const w = (item.val / maxVal) * maxW;
        const isMax = item.id === oppCostItem.id;

        // Label
        const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        txt.setAttribute('x', '0');
        txt.setAttribute('y', itemY + 20);
        txt.setAttribute('font-size', '15');
        txt.setAttribute('font-weight', isMax ? '700' : '500');
        txt.setAttribute('fill', isMax ? 'var(--accent)' : '#64748B');
        txt.textContent = (isMax ? '★ 放弃：' : '放弃：') + item.name;
        svg.appendChild(txt);

        // Bar
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', startX);
        rect.setAttribute('y', itemY);
        rect.setAttribute('width', w);
        rect.setAttribute('height', barH);
        rect.setAttribute('rx', '6');
        rect.setAttribute('fill', isMax ? 'rgba(217, 119, 6, 0.15)' : '#F1F5F9');
        rect.setAttribute('stroke', isMax ? 'var(--accent)' : '#CBD5E1');
        rect.setAttribute('stroke-width', isMax ? '2' : '1');
        svg.appendChild(rect);

        // Value text
        const valTxt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        valTxt.setAttribute('x', startX + w + 16);
        valTxt.setAttribute('y', itemY + 20);
        valTxt.setAttribute('font-size', '15');
        valTxt.setAttribute('font-family', 'var(--font-mono)');
        valTxt.setAttribute('font-weight', isMax ? '700' : '500');
        valTxt.setAttribute('fill', isMax ? 'var(--accent)' : '#94A3B8');
        valTxt.textContent = `${item.val} 分` + (isMax ? '  ← 机会成本' : ' (不叠加)');
        svg.appendChild(valTxt);
      });
    }

    // Init
    Deck.init({ index: 3, total: 16 });
    renderOptions();
    updateAnalysis();
  </script>
</body>
</html>
