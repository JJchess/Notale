<!doctype html>
<html lang="zh" data-variant="opening">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: var(--font-sans);
    }

    /* 顶部章序徽标与定位 */
    .hero-layout {
      position: absolute;
      inset: 80px 100px 80px 100px;
      display: grid;
      grid-template-columns: 560px 1fr;
      gap: 56px;
      align-items: center;
    }

    .title-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 10;
    }

    .chapter-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: var(--fs-sec);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 24px;
    }

    .chapter-badge::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: var(--primary);
    }

    .hero-title {
      font-size: var(--fs-hero);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin: 0 0 20px 0;
    }

    .hero-lead {
      font-size: var(--fs-lead);
      line-height: 1.5;
      color: var(--muted);
      margin: 0 0 36px 0;
      max-width: 480px;
    }

    .key-metrics {
      display: flex;
      gap: 32px;
      padding-top: 24px;
      border-top: 1px solid #E2E8F0;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric-val {
      font-family: var(--font-mono);
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
    }

    .metric-lbl {
      font-size: var(--fs-sec);
      color: var(--muted);
    }

    /* 右侧图解舞台 */
    .diagram-panel {
      position: relative;
      height: 640px;
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      border-radius: 20px;
      box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.05);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .diagram-svg {
      width: 100%;
      height: 100%;
    }

    .diagram-svg text {
      user-select: none;
      font-family: var(--font-mono);
    }
  </style>
</head>
<body data-page="05" data-total="16">
  <div id="stage">
    <main class="hero-layout">
      <div class="title-col">
        <div class="chapter-badge">Chapter 02 · 核心模型</div>
        <h1 class="hero-title">市场机制<br>需求、供给与价格发现</h1>
        <p class="hero-lead">买卖意愿的相交点决定了出清价格。没有任何中央计划者，价格本身即是最灵敏的信号。</p>
        <div class="key-metrics">
          <div class="metric-item">
            <span class="metric-val">P* = 50</span>
            <span class="metric-lbl">均衡出清价格</span>
          </div>
          <div class="metric-item">
            <span class="metric-val">Q* = 100</span>
            <span class="metric-lbl">均衡出清交易量</span>
          </div>
          <div class="metric-item">
            <span class="metric-val">CS + PS</span>
            <span class="metric-lbl">总社会剩余最大化</span>
          </div>
        </div>
      </div>

      <div class="diagram-panel">
        <svg class="diagram-svg" viewBox="0 0 760 640" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- 浅网格背景 -->
          <g stroke="#F1F5F9" stroke-width="1.5">
            <line x1="120" y1="120" x2="680" y2="120" />
            <line x1="120" y1="200" x2="680" y2="200" />
            <line x1="120" y1="280" x2="680" y2="280" />
            <line x1="120" y1="360" x2="680" y2="360" />
            <line x1="120" y1="440" x2="680" y2="440" />
            <line x1="200" y1="80" x2="200" y2="520" />
            <line x1="300" y1="80" x2="300" y2="520" />
            <line x1="400" y1="80" x2="400" y2="520" />
            <line x1="500" y1="80" x2="500" y2="520" />
            <line x1="600" y1="80" x2="600" y2="520" />
          </g>

          <!-- 剩余面平涂 -->
          <!-- 消费者剩余 CS: 顶点 (120, 110), (400, 300), (120, 300) -->
          <polygon points="120,110 400,300 120,300" fill="rgba(37, 99, 235, 0.12)" />
          <!-- 生产者剩余 PS: 顶点 (120, 490), (400, 300), (120, 300) -->
          <polygon points="120,490 400,300 120,300" fill="rgba(2, 132, 199, 0.10)" />

          <!-- 坐标轴 -->
          <line x1="120" y1="520" x2="680" y2="520" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
          <line x1="120" y1="520" x2="120" y2="80" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
          <path d="M 672 515 L 682 520 L 672 525" fill="none" stroke="#1E293B" stroke-width="2" stroke-linejoin="round" />
          <path d="M 115 88 L 120 78 L 125 88" fill="none" stroke="#1E293B" stroke-width="2" stroke-linejoin="round" />

          <text x="686" y="525" font-size="14" font-weight="600" fill="#1E293B">Q</text>
          <text x="120" y="64" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">P</text>

          <!-- 均衡虚线引导 -->
          <line x1="120" y1="300" x2="400" y2="300" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 4" />
          <line x1="400" y1="300" x2="400" y2="520" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 4" />

          <!-- 需求曲线 Demand: (70, 76) -> (600, 436) 直线，经过 (120, 110) 和 (400, 300) -->
          <line x1="70" y1="76" x2="600" y2="436" stroke="#DC2626" stroke-width="3" stroke-linecap="round" />
          <!-- 供给曲线 Supply: (70, 524) -> (600, 164) 直线，经过 (120, 490) 和 (400, 300) -->
          <line x1="70" y1="524" x2="600" y2="164" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />

          <!-- 曲线端点标签 -->
          <text x="615" y="445" font-size="16" font-weight="700" fill="#DC2626">D</text>
          <text x="615" y="170" font-size="16" font-weight="700" fill="#0284C7">S</text>

          <!-- 剩余文本微标注 -->
          <text x="180" y="240" font-size="13" font-weight="600" fill="#2563EB" opacity="0.85">消费者剩余 (CS)</text>
          <text x="180" y="375" font-size="13" font-weight="600" fill="#0284C7" opacity="0.85">生产者剩余 (PS)</text>

          <!-- 均衡点高亮 -->
          <circle cx="400" cy="300" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="3" />
          <circle cx="400" cy="300" r="14" fill="none" stroke="#2563EB" stroke-width="1.5" opacity="0.4" />

          <text x="424" y="295" font-size="15" font-weight="700" fill="#1E293B">E (均衡点)</text>

          <!-- 轴上刻度与标注 -->
          <text x="108" y="305" font-size="14" font-weight="600" fill="#2563EB" text-anchor="end">P* = 50</text>
          <text x="400" y="546" font-size="14" font-weight="600" fill="#2563EB" text-anchor="middle">Q* = 100</text>
        </svg>
      </div>
    </main>
  </div>

  <aside class="notes" hidden>
    本章我们将正式进入微观经济学最核心的分析工具——市场供求机制。
    我们将探讨需求定理与供给定理背后的理性选择，分析价格如何作为自发的无形之手协调成千上万买卖者的行为，并证明在完全竞争市场下，供需均衡点如何实现社会福利与资源配置效率的最大化。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 5, total: 16 });
  </script>
</body>
</html>
