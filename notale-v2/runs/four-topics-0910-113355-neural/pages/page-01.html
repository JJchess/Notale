<!doctype html>
<html lang="zh" data-variant="opening">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      position: relative;
      overflow: hidden;
      color: var(--text);
      font-family: var(--font-sans);
    }
    #nn-canvas {
      z-index: 1;
      pointer-events: none;
    }
    .cover-layout {
      position: absolute;
      inset: 0;
      z-index: 5;
      padding: 72px 80px 76px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
    }
    .module-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-label);
      color: var(--primary);
      background: var(--primary-soft);
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .dot-pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
    }
    .core-title-group {
      max-width: 860px;
      margin-top: 40px;
    }
    .main-title {
      font-family: var(--font-display);
      font-size: 52px;
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: -0.02em;
      color: var(--text);
      margin: 0 0 16px 0;
    }
    .sub-lead {
      font-size: var(--fs-lead);
      line-height: 1.45;
      color: var(--muted);
      margin: 0;
      max-width: 720px;
    }
    .bottom-bar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 32px;
      margin-bottom: 24px;
    }
    .bento-strip {
      display: flex;
      gap: 16px;
    }
    .bento-pill {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }
    .bento-pill .pill-k {
      font-size: var(--fs-label);
      color: var(--muted);
      font-weight: 500;
    }
    .bento-pill .pill-v {
      font-size: var(--fs-sec);
      color: var(--text);
      font-weight: 600;
      font-family: var(--font-display);
    }
    .flow-indicator {
      font-size: var(--fs-label);
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body data-page="NN" data-total="17">
  <div id="stage">
    <canvas id="nn-canvas" class="cv-fill"></canvas>
    <div class="cover-layout">
      <header class="top-bar">
        <div class="module-tag">
          <span class="dot-pulse"></span>
          深度学习基石 · 核心讲义
        </div>
      </header>
      <div class="core-title-group">
        <h1 class="main-title">神经网络：从单神经元到多层感知机</h1>
        <p class="sub-lead">参数化坐标映射、非线性折叠与反向梯度驱动的核心机制</p>
      </div>
      <footer class="bottom-bar">
        <div class="bento-strip">
          <div class="bento-pill">
            <span class="pill-k">映射本质</span>
            <span class="pill-v">f(x) = σ(W₂ · σ(W₁x + b₁) + b₂)</span>
          </div>
          <div class="bento-pill">
            <span class="pill-k">参数优化</span>
            <span class="pill-v">W ← W - η ∇_W L</span>
          </div>
        </div>
        <div class="flow-indicator">
          <span>前向传播与反向求导</span>
        </div>
      </footer>
    </div>
  </div>
  <aside class="notes" hidden>
    同学们好，今天我们进入现代深度学习最核心的基础篇章：神经网络。
    我们将从最基础的单个生物神经元感知机抽象出发，推导它在二维空间中划分超平面的几何本质；
    接着理解异或问题与线性不可分瓶颈，剖析隐藏层如何利用非线性激活函数折叠空间；
    最后完整推导损失函数、负梯度下降与反向传播链式法则，用双螺旋二维分类案例搞清训练与过拟合。
  </aside>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      const cv = document.getElementById("nn-canvas");
      const ctx = Deck.fit(cv);

      // 固定种子与神经元层级拓扑定义
      const layers = [
        { count: 4, x: 920, label: "输入层 X" },
        { count: 6, x: 1120, label: "隐藏层 H₁" },
        { count: 5, x: 1300, label: "隐藏层 H₂" },
        { count: 2, x: 1470, label: "输出层 Y" }
      ];

      // 计算每个节点逻辑坐标
      const nodes = [];
      const nodeMap = [];
      const yCenter = 415;
      const layerSpan = 480;

      layers.forEach((layer, lIdx) => {
        const layerNodes = [];
        const spacing = layerSpan / (layer.count + 1);
        const startY = yCenter - layerSpan / 2 + spacing;
        for (let i = 0; i < layer.count; i++) {
          const node = {
            lIdx,
            iIdx: i,
            x: layer.x,
            y: startY + i * spacing,
            val: 0.5 + 0.4 * Math.sin(lIdx * 1.7 + i * 2.1)
          };
          nodes.push(node);
          layerNodes.push(node);
        }
        nodeMap.push(layerNodes);
      });

      // 构建全连接前向边
      const synEdges = [];
      for (let l = 0; l < nodeMap.length - 1; l++) {
        const fromLayer = nodeMap[l];
        const toLayer = nodeMap[l + 1];
        fromLayer.forEach(fn => {
          toLayer.forEach(tn => {
            const weight = Math.sin(fn.iIdx * 3.7 + tn.iIdx * 5.3 + l * 2.1);
            synEdges.push({
              from: fn,
              to: tn,
              weight,
              speed: 0.0006 + Math.abs(weight) * 0.0006,
              offset: (Math.abs(fn.x * 13 + tn.y * 17)) % 1
            });
          });
        });
      }

      function drawNetwork(time) {
        ctx.clearRect(0, 0, Deck.W, Deck.H);

        // 绘制突触连接线（弱背景）
        synEdges.forEach(e => {
          ctx.beginPath();
          ctx.moveTo(e.from.x, e.from.y);
          ctx.lineTo(e.to.x, e.to.y);
          const isPos = e.weight > 0;
          ctx.strokeStyle = isPos ? "rgba(37, 99, 235, 0.11)" : "rgba(234, 88, 12, 0.09)";
          ctx.lineWidth = Math.abs(e.weight) * 1.5 + 0.6;
          ctx.stroke();

          // 信号脉冲前向传递光点
          const prog = (e.offset + time * e.speed) % 1;
          const px = e.from.x + (e.to.x - e.from.x) * prog;
          const py = e.from.y + (e.to.y - e.from.y) * prog;
          ctx.beginPath();
          ctx.arc(px, py, 1.8, 0, Math.PI * 2);
          ctx.fillStyle = isPos ? "rgba(37, 99, 235, 0.65)" : "rgba(234, 88, 12, 0.55)";
          ctx.fill();
        });

        // 绘制神经元节点（便当盒柔和高亮）
        nodes.forEach(n => {
          // 外晕圈
          ctx.beginPath();
          ctx.arc(n.x, n.y, 14, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
          ctx.fill();
          ctx.strokeStyle = n.lIdx === 0 ? "rgba(100, 116, 139, 0.3)" :
                            n.lIdx === nodeMap.length - 1 ? "rgba(234, 88, 12, 0.5)" : "rgba(37, 99, 235, 0.4)";
          ctx.lineWidth = 2;
          ctx.stroke();

          // 核心激活态
          const act = 0.5 + 0.5 * Math.sin(time * 0.002 + n.lIdx * 1.5 + n.iIdx);
          ctx.beginPath();
          ctx.arc(n.x, n.y, 6.5, 0, Math.PI * 2);
          ctx.fillStyle = n.lIdx === nodeMap.length - 1 ?
                          `rgba(234, 88, 12, ${0.4 + 0.5 * act})` :
                          `rgba(37, 99, 235, ${0.4 + 0.5 * act})`;
          ctx.fill();
        });

        // 层级文本标记
        ctx.fillStyle = "rgba(100, 116, 139, 0.6)";
        ctx.font = "600 13px 'NTF-inter', 'NTF-noto-sans-sc', sans-serif";
        ctx.textAlign = "center";
        layers.forEach(l => {
          ctx.fillText(l.label, l.x, yCenter + layerSpan / 2 + 32);
        });
      }

      Deck.init({ index: 1, total: 17, keys: false });

      if (Deck.reduced()) {
        drawNetwork(3200);
      } else {
        Deck.loop(time => {
          drawNetwork(time);
        }, { still: 3200 });
      }
    })();
  </script>
</body>
</html>
