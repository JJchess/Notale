<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: 48px 68px 36px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      color: var(--text);
      user-select: none;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid rgba(34, 32, 30, 0.2);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .nt-title {
      margin: 0;
      font-size: 32px;
      line-height: 1.25;
      font-weight: 600;
    }

    .nt-kicker {
      font-size: 13px;
      letter-spacing: 0.12em;
      color: #6d675e;
      font-weight: 700;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 36px;
      flex: 1;
      min-height: 0;
    }

    /* Left Control & Theory Panel */
    .theory-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .model-selector {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .model-btn {
      appearance: none;
      background: #f1ede4;
      border: 1px solid rgba(34, 32, 30, 0.22);
      border-radius: 2px;
      padding: 10px 14px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s, border-color 0.15s;
      color: var(--text);
    }

    .model-btn:hover {
      background: #e8e2d5;
    }

    .model-btn.active {
      background: #22201e;
      color: #f8f6f1;
      border-color: #22201e;
    }

    .model-btn-name {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
    }

    .model-btn-tag {
      font-size: 12px;
      opacity: 0.8;
    }

    .summary-card {
      border-top: 1px solid rgba(34, 32, 30, 0.2);
      padding-top: 12px;
      font-size: 14px;
      line-height: 1.5;
      color: #44413d;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .diag-box {
      background: rgba(184, 75, 41, 0.08);
      border-left: 3px solid #b84b29;
      padding: 10px 12px;
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.45;
    }

    /* Right Canvas / Visual World */
    .canvas-panel {
      position: relative;
      background: #fffdfa;
      border: 1px solid rgba(34, 32, 30, 0.15);
      box-shadow: 0 4px 18px rgba(34, 32, 30, 0.04);
      display: flex;
      flex-direction: column;
      border-radius: 2px;
      overflow: hidden;
    }

    .canvas-top {
      padding: 12px 20px;
      border-bottom: 1px solid rgba(34, 32, 30, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fbf9f4;
    }

    .canvas-title {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 600;
    }

    .legend-row {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: #666;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-line {
      width: 18px;
      height: 2px;
    }

    .legend-line.direct {
      background: #22201e;
    }

    .legend-line.affinity {
      border-top: 2px dashed #b84b29;
      height: 0;
    }

    .legend-line.context {
      border-top: 1px dotted #888;
      height: 0;
    }

    .stage-svg {
      width: 100%;
      height: 100%;
      flex: 1;
    }

    .node-rect {
      stroke-width: 1.5px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .node-text-title {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .node-text-sub {
      font-family: var(--font-sans);
      font-size: 12px;
      fill: #777;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .edge-label {
      font-family: var(--font-sans);
      font-size: 12px;
      text-anchor: middle;
      dominant-baseline: middle;
      fill: #444;
    }

    .status-strip {
      padding: 10px 20px;
      background: #fbf9f4;
      border-top: 1px solid rgba(34, 32, 30, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #555;
    }

    .status-verdict {
      font-weight: 600;
      color: #22201e;
    }
  </style>
</head>
<body data-page="11" data-total="12">
  <div id="stage">
    <div class="header-bar">
      <div>
        <div class="nt-kicker">方法论澄清</div>
        <h1 class="nt-title">关联不等于单一因果：选修亲和性</h1>
      </div>
      <div style="font-size: 13px; color: #777;">
        第 11 / 12 页
      </div>
    </div>

    <div class="main-grid">
      <!-- Theory & Selector -->
      <div class="theory-panel">
        <div class="model-selector" id="model-btns">
          <button class="model-btn active" data-model="affinity">
            <span class="model-btn-name">选修亲和性</span>
            <span class="model-btn-tag">互构选择</span>
          </button>

          <button class="model-btn" data-model="materialism">
            <span class="model-btn-name">经济决定论</span>
            <span class="model-btn-tag">单向决定</span>
          </button>

          <button class="model-btn" data-model="idealism">
            <span class="model-btn-name">唯心单因论</span>
            <span class="model-btn-tag">单因创造</span>
          </button>
        </div>

        <div class="summary-card">
          <div class="diag-box" id="card-diag" style="margin-top: 0;">
            警示：统计相关不等于必然因果律。
          </div>
        </div>
      </div>

      <!-- Graph Stage -->
      <div class="canvas-panel">
        <div class="canvas-top">
          <div class="canvas-title" id="canvas-heading">结构推演：选修亲和性</div>
          <div class="legend-row">
            <div class="legend-item"><div class="legend-line direct"></div> 强因果驱动</div>
            <div class="legend-item"><div class="legend-line affinity"></div> 亲和匹配 / 催化</div>
            <div class="legend-item"><div class="legend-line context"></div> 物质制度背景</div>
          </div>
        </div>

        <svg class="stage-svg" id="graph-svg" viewBox="0 0 1020 540"></svg>

        <div class="status-strip">
          <div>
            <span>假说特征：</span>
            <span class="status-verdict" id="status-verdict">双向共鸣与制度选择</span>
          </div>
          <div style="font-size: 12px; color: #888;">
            点击左侧模式对比不同结构
          </div>
        </div>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    韦伯在《新教伦理》结尾明确警告：用片面的唯心主义历史观取代唯物主义历史观同样毫无学术价值。
    “选修亲和性”借用了歌德小说的概念，意指两种在逻辑与心理上有内在契合度的力量在特定历史时空相遇，相互加强并共生发展。
    不能将韦伯的“理想型”分析误读为单因因果论，这正是历史社会学研究的方法论边界。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 11, total: 12 });

    const models = {
      affinity: {
        title: "选修亲和性 (Wahlverwandtschaft)",
        desc: "宗教伦理与经济生活存在内在契合。信徒心理确证与企业系统核算历史相遇，相互选择与催化，并非单向派生。",
        diag: "韦伯原著申明：片面的唯心论与唯物论解释同样具有局限性。",
        verdict: "多重约束下的相互选择与加速催化",
        nodes: [
          { id: 'rel', x: 120, y: 140, w: 200, h: 76, title: "宗教伦理 (加尔文)", sub: "世俗天职 · 救赎焦虑", active: true },
          { id: 'psy', x: 440, y: 140, w: 200, h: 76, title: "理性化生活态度", sub: "禁绝享乐 · 系统积累", active: true },
          { id: 'mat', x: 120, y: 350, w: 200, h: 76, title: "物质与法权制度", sub: "簿记 · 自由劳动 · 市场", active: true },
          { id: 'cap', x: 440, y: 350, w: 200, h: 76, title: "近代理性资本主义", sub: "企业核算秩序", active: true },
          { id: 'res', x: 740, y: 245, w: 130, h: 86, title: "现代生活秩序", sub: "客观铁笼", active: true }
        ],
        edges: [
          { from: 'rel', to: 'psy', type: 'direct', label: '内驱' },
          { from: 'mat', to: 'cap', type: 'direct', label: '前提' },
          { from: 'psy', to: 'cap', type: 'affinity', label: '契合' },
          { from: 'cap', to: 'psy', type: 'affinity', label: '强化' },
          { from: 'mat', to: 'rel', type: 'context', label: '土壤' },
          { from: 'cap', to: 'res', type: 'direct', label: '运转' }
        ]
      },
      materialism: {
        title: "庸俗经济决定论",
        desc: "观念与宗教仅是经济基础与阶级利益的被动派生物，否认观念拥有独立的因果推动力与行动意义。",
        diag: "谬误诊断：无法解释为何商业极发达的佛罗伦萨未孕育出责任伦理，而贫瘠的宾夕法尼亚却催生了资本主义精神。",
        verdict: "单向机械决定，遮蔽了主体行动意义",
        nodes: [
          { id: 'rel', x: 120, y: 140, w: 200, h: 76, title: "宗教伦理 (上层建筑)", sub: "意识形态虚假意识", active: false },
          { id: 'psy', x: 440, y: 140, w: 200, h: 76, title: "职业精神 (被动产物)", sub: "无独立自发动能", active: false },
          { id: 'mat', x: 120, y: 350, w: 200, h: 76, title: "生产力与经济基础", sub: "唯一动力来源", active: true },
          { id: 'cap', x: 440, y: 350, w: 200, h: 76, title: "资本主义经济关系", sub: "衍生形态", active: true },
          { id: 'res', x: 740, y: 245, w: 130, h: 86, title: "社会制度形态", sub: "物质产物", active: true }
        ],
        edges: [
          { from: 'mat', to: 'cap', type: 'direct', label: '决定' },
          { from: 'mat', to: 'rel', type: 'direct', label: '投影' },
          { from: 'cap', to: 'psy', type: 'direct', label: '派生' },
          { from: 'cap', to: 'res', type: 'direct', label: '硬化' }
        ]
      },
      idealism: {
        title: "唯心主义单因论",
        desc: "将宗教教义视作单向创造现代工业文明的唯一源泉，忽视技术、地理、罗马法与资本积累的基础作用。",
        diag: "谬误诊断：韦伯明确警示：企图用宗教解释整个近代文明是荒谬的夸张。",
        verdict: "倒果为因，将催化剂夸大为唯一造物主",
        nodes: [
          { id: 'rel', x: 120, y: 140, w: 200, h: 76, title: "宗教教义 (绝对起点)", sub: "神学观念生发历史", active: true },
          { id: 'psy', x: 440, y: 140, w: 200, h: 76, title: "资本主义精神", sub: "纯理念演绎", active: true },
          { id: 'mat', x: 120, y: 350, w: 200, h: 76, title: "制度与物质背景", sub: "[次要背景]", active: false },
          { id: 'cap', x: 440, y: 350, w: 200, h: 76, title: "近代资本主义", sub: "理念派生", active: true },
          { id: 'res', x: 740, y: 245, w: 130, h: 86, title: "现代工业文明", sub: "单一产物", active: true }
        ],
        edges: [
          { from: 'rel', to: 'psy', type: 'direct', label: '创造' },
          { from: 'psy', to: 'cap', type: 'direct', label: '派生' },
          { from: 'cap', to: 'res', type: 'direct', label: '推演' }
        ]
      }
    };

    let currentModel = 'affinity';

    function renderGraph() {
      const data = models[currentModel];
      const svg = document.getElementById('graph-svg');
      
      document.getElementById('card-diag').innerHTML = data.diag;
      document.getElementById('canvas-heading').textContent = '因果假说结构：' + data.title;
      document.getElementById('status-verdict').textContent = data.verdict;

      let svgHtml = `
        <defs>
          <marker id="arrow-direct" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M 0 0 L 8 4 L 0 8 Z" fill="#22201e"/>
          </marker>
          <marker id="arrow-affinity" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M 0 0 L 8 4 L 0 8 Z" fill="#b84b29"/>
          </marker>
          <marker id="arrow-context" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M 0 0 L 8 4 L 0 8 Z" fill="#888"/>
          </marker>
        </defs>
      `;

      // Draw Edges
      data.edges.forEach(e => {
        const fromNode = data.nodes.find(n => n.id === e.from);
        const toNode = data.nodes.find(n => n.id === e.to);
        if (!fromNode || !toNode) return;

        let stroke = '#22201e';
        let strokeDash = 'none';
        let marker = 'url(#arrow-direct)';
        let strokeWidth = 2;

        if (e.type === 'affinity') {
          stroke = '#b84b29';
          strokeDash = '6,4';
          marker = 'url(#arrow-affinity)';
          strokeWidth = 2.2;
        } else if (e.type === 'context') {
          stroke = '#888';
          strokeDash = '3,3';
          marker = 'url(#arrow-context)';
          strokeWidth = 1.5;
        }

        let pathD = '';
        let midX = 0;
        let midY = 0;

        // Specific routing for clean non-overlapping lines
        if (e.from === 'rel' && e.to === 'psy') {
          // Horizontal top
          const x1 = fromNode.x + fromNode.w;
          const y1 = fromNode.y + fromNode.h / 2;
          const x2 = toNode.x;
          const y2 = toNode.y + toNode.h / 2;
          pathD = `M ${x1} ${y1} L ${x2} ${y2}`;
          midX = (x1 + x2) / 2;
          midY = y1;
        } else if (e.from === 'mat' && e.to === 'cap') {
          // Horizontal bottom
          const x1 = fromNode.x + fromNode.w;
          const y1 = fromNode.y + fromNode.h / 2;
          const x2 = toNode.x;
          const y2 = toNode.y + toNode.h / 2;
          pathD = `M ${x1} ${y1} L ${x2} ${y2}`;
          midX = (x1 + x2) / 2;
          midY = y1;
        } else if (e.from === 'mat' && e.to === 'rel') {
          // Vertical left
          const x1 = fromNode.x + fromNode.w / 2;
          const y1 = fromNode.y;
          const x2 = toNode.x + toNode.w / 2;
          const y2 = toNode.y + toNode.h;
          pathD = `M ${x1} ${y1} L ${x2} ${y2}`;
          midX = x1;
          midY = (y1 + y2) / 2;
        } else if (e.from === 'psy' && e.to === 'cap') {
          // Vertical right: downward curve or shift right
          const x1 = fromNode.x + fromNode.w / 2 + 35;
          const y1 = fromNode.y + fromNode.h;
          const x2 = toNode.x + toNode.w / 2 + 35;
          const y2 = toNode.y;
          pathD = `M ${x1} ${y1} L ${x2} ${y2}`;
          midX = x1 + 38;
          midY = (y1 + y2) / 2;
        } else if (e.from === 'cap' && e.to === 'psy') {
          // Vertical right: upward shift left
          const x1 = fromNode.x + fromNode.w / 2 - 35;
          const y1 = fromNode.y;
          const x2 = toNode.x + toNode.w / 2 - 35;
          const y2 = toNode.y + toNode.h;
          pathD = `M ${x1} ${y1} L ${x2} ${y2}`;
          midX = x1 - 38;
          midY = (y1 + y2) / 2;
        } else if (e.from === 'cap' && e.to === 'res') {
          const x1 = fromNode.x + fromNode.w;
          const y1 = fromNode.y + fromNode.h / 2;
          const x2 = toNode.x;
          const y2 = toNode.y + toNode.h / 2;
          pathD = `M ${x1} ${y1} L ${x2} ${y2}`;
          midX = (x1 + x2) / 2;
          midY = (y1 + y2) / 2 - 12;
        }

        const labelW = e.label.length * 15 + 16;
        svgHtml += `
          <g>
            <path d="${pathD}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-dasharray="${strokeDash}" fill="none" marker-end="${marker}"/>
            <rect x="${midX - labelW / 2}" y="${midY - 11}" width="${labelW}" height="22" fill="#fffdfa" rx="3" opacity="0.95"/>
            <text x="${midX}" y="${midY + 4}" class="edge-label" fill="${stroke}">${e.label}</text>
          </g>
        `;
      });

      // Draw Nodes
      data.nodes.forEach(n => {
        const fill = n.active ? '#ffffff' : '#f5f4f0';
        const stroke = n.active ? '#22201e' : '#ccc';
        const titleFill = n.active ? '#22201e' : '#999';
        const subFill = n.active ? '#666' : '#bbb';
        const strokeWidth = n.active ? 1.8 : 1;

        svgHtml += `
          <g class="graph-node" data-id="${n.id}">
            <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="3" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}" class="node-rect"/>
            <text x="${n.x + n.w / 2}" y="${n.y + 32}" class="node-text-title" fill="${titleFill}">${n.title}</text>
            <text x="${n.x + n.w / 2}" y="${n.y + 54}" class="node-text-sub" fill="${subFill}">${n.sub}</text>
          </g>
        `;
      });

      svg.innerHTML = svgHtml;
    }

    // Bind selector buttons
    const btns = document.querySelectorAll('.model-btn');
    btns.forEach(btn => {
      btn.addEventListener('click', () => {
        btns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentModel = btn.dataset.model;
        renderGraph();
      });
    });

    renderGraph();
  </script>
</body>
</html>
