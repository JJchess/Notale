<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>02 · 为什么投票有用</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
  .chart{ position:absolute; left:64px; top:196px; width:900px; height:580px; }
  .chart svg{ width:100%; height:100%; overflow:visible; }
  .side{ position:absolute; left:1000px; top:196px; width:536px; height:580px; display:grid; grid-template-rows:auto 1fr; gap:16px; }
  .ctlbox{ padding:22px 24px 18px; display:grid; gap:16px; }
  .voters{ padding:20px 24px; display:grid; grid-template-rows:auto 1fr auto; gap:12px; }
  .voters .head{ display:flex; justify-content:space-between; align-items:center; }
  .voters .head h2{ font-size:18px; }
  .grid{ display:grid; grid-template-columns:repeat(17, 1fr); gap:5px; align-content:center; }
  .grid i{ display:block; aspect-ratio:1; border-radius:3px; background:var(--rule-2); transition:background .25s; }
  .grid i.ok{ background:var(--bag); } .grid i.no{ background:var(--boost); } .grid i.copy{ outline:2px solid var(--gold); outline-offset:-2px; }
  .verdict{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:end; border-top:1px solid var(--rule-2); padding-top:12px; }
  .verdict .big{ font-size:26px; font-weight:700; letter-spacing:-.02em; }
  .verdict .big.ok{ color:var(--bag); } .verdict .big.no{ color:var(--boost); }
  .verdict .k{ font-size:13px; color:var(--muted); }
  .verdict .v{ font-family:var(--font-num); font-variant-numeric:tabular-nums; font-size:26px; font-weight:600; }
  .verdict .v small{ font-size:14px; color:var(--muted); font-weight:500; }
  .check{ display:flex; align-items:center; gap:10px; font-size:15px; font-weight:600; cursor:pointer; user-select:none; }
  .check input{ width:18px; height:18px; accent-color:var(--gold); margin:0; }
  .check .hint{ font-size:13px; color:var(--quiet); font-weight:400; }
  .row{ display:flex; gap:10px; align-items:center; }
  .curve{ fill:none; stroke-width:3; }
  .fine{ fill:none; stroke:var(--rule); stroke-width:1.5; stroke-dasharray:3 4; }
</style>
</head>
<body>
<main id="stage">
  <header class="hd">
    <div class="kicker"><b>01 · 投票</b>CONDORCET · 1785</div>
    <h1>每个人只有 <em class="single">六成</em> 把握，一群人投票能有多准？</h1>
    <p class="lede">每位投票者独立答对的概率是 <b>p</b>，<b>n</b> 个人多数决。只要 p 高于一半、彼此独立，人越多就越准——<b>「独立」这两个字是本讲全部的伏笔。</b></p>
  </header>

  <figure class="chart" aria-label="多数决正确率随人数变化的曲线">
    <svg id="svg" viewBox="0 0 900 580"></svg>
  </figure>

  <aside class="side">
    <div class="panel ctlbox">
      <div class="ctl" style="--acc:var(--single)">
        <label for="p">每个人的正确率 p</label><output for="p">0.60</output>
        <input id="p" type="range" min="0.50" max="0.95" step="0.01" value="0.60">
      </div>
      <div class="ctl" style="--acc:var(--text)">
        <label for="n">投票人数 n（奇数）</label><output for="n">25</output>
        <input id="n" type="range" min="1" max="101" step="2" value="25">
      </div>
      <label class="check"><input id="rho" type="checkbox"> 让他们互相抄答案 <span class="hint">（60% 的人直接照抄同一个「学霸」）</span></label>
    </div>
    <div class="panel voters">
      <div class="head"><h2>投一次看看</h2>
        <div class="row"><button class="btn sm" id="once">投一次</button><button class="btn sm ghost" id="many">连投 500 次</button></div></div>
      <div class="grid" id="grid" aria-label="投票者格子"></div>
      <div class="verdict">
        <div><div class="k">这一次多数决</div><div class="big" id="res">—</div></div>
        <div><div class="k">累计多数决正确率 <span id="tot"></span></div><div class="v" id="acc">—</div></div>
      </div>
    </div>
  </aside>
</main>
<script src="assets/base.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/ens.js"></script>
<script>
Ens.footer(2);
var r = Ens.rng('vote-02');
var P = document.getElementById('p'), Nn = document.getElementById('n'), RHO = document.getElementById('rho');
function majority(n, p) { // P(至少 (n+1)/2 个正确)，n 为奇数
  var q = 1 - p, pmf = Math.pow(q, n), s = 0;
  for (var k = 0; k <= n; k++) { if (k > n / 2) s += pmf; pmf = pmf * (n - k) / (k + 1) * p / q; }
  return Math.min(1, s);
}
// ---- 图 ----
var svg = d3.select('#svg'), M = { l: 64, r: 30, t: 30, b: 56 }, W = 900, H = 580;
var x = d3.scaleLinear().domain([1, 101]).range([M.l, W - M.r]), y = d3.scaleLinear().domain([0.4, 1]).range([H - M.b, M.t]);
svg.append('g').attr('class', 'axis').attr('transform', 'translate(0,' + (H - M.b) + ')').call(d3.axisBottom(x).ticks(10).tickSize(-(H - M.t - M.b)).tickPadding(10)).select('.domain').remove();
svg.append('g').attr('class', 'axis').attr('transform', 'translate(' + M.l + ',0)').call(d3.axisLeft(y).ticks(6, '.0%').tickSize(-(W - M.l - M.r)).tickPadding(10)).select('.domain').remove();
svg.append('text').attr('class', 'axis-title').attr('x', W - M.r).attr('y', H - 14).attr('text-anchor', 'end').text('投票人数 n');
svg.append('text').attr('class', 'axis-title').attr('x', M.l).attr('y', 16).text('多数决答对的概率');
svg.append('line').attr('class', 'fine').attr('x1', M.l).attr('x2', W - M.r).attr('y1', y(0.5)).attr('y2', y(0.5));
svg.append('text').attr('class', 'note').attr('x', W - M.r).attr('y', y(0.5) - 8).attr('text-anchor', 'end').text('掷硬币 · 50%');
var ghosts = svg.append('g');
[0.55, 0.7, 0.85].forEach(function (pp) {
  var pts = d3.range(1, 102, 2).map(function (n) { return [n, majority(n, pp)]; });
  ghosts.append('path').attr('class', 'curve').attr('d', d3.line().x(function (d) { return x(d[0]); }).y(function (d) { return y(d[1]); })(pts)).attr('stroke', Deck.token('--rule')).attr('stroke-width', 1.5);
  ghosts.append('text').attr('class', 'note').attr('x', x(101) + 6).attr('y', y(majority(101, pp)) + 4).text('p=' + pp).attr('fill', Deck.token('--quiet'));
});
var pLine = svg.append('line').attr('class', 'fine').attr('stroke', Deck.token('--single'));
var pTxt = svg.append('text').attr('class', 'note').attr('x', M.l + 8).attr('fill', Deck.token('--single'));
var curve = svg.append('path').attr('class', 'curve').attr('stroke', Deck.token('--single'));
var simDots = svg.append('g');
var dot = svg.append('circle').attr('r', 8).attr('fill', Deck.token('--paper')).attr('stroke', Deck.token('--text')).attr('stroke-width', 3);
var lab = svg.append('g'); lab.append('rect').attr('rx', 8).attr('fill', Deck.token('--text'));
var labT = lab.append('text').attr('fill', Deck.token('--paper')).attr('font-size', 15).attr('font-weight', 600).attr('dy', 5).attr('text-anchor', 'middle');
function drawChart() {
  var p = +P.value, n = +Nn.value;
  curve.attr('d', d3.line().x(function (d) { return x(d[0]); }).y(function (d) { return y(d[1]); })(d3.range(1, 102, 2).map(function (k) { return [k, majority(k, p)]; })));
  pLine.attr('x1', M.l).attr('x2', W - M.r).attr('y1', y(p)).attr('y2', y(p));
  pTxt.attr('y', y(p) - 8).text('单个人 · ' + Math.round(p * 100) + '%');
  var v = majority(n, p);
  dot.attr('cx', x(n)).attr('cy', y(v));
  var s = n + ' 人 → ' + (v * 100).toFixed(1) + '%';
  labT.text(s); labT.attr("x", (s.length * 9.5 + 26) / 2);
  var w = s.length * 9.5 + 26, lx = Math.min(x(n) + 16, W - M.r - w), ly = y(v) - 44;
  lab.attr('transform', 'translate(' + lx + ',' + ly + ')'); lab.select('rect').attr('width', w).attr('height', 30).attr('y', -15);
}
// ---- 模拟 ----
var grid = document.getElementById('grid'), res = document.getElementById('res'), acc = document.getElementById('acc'), tot = document.getElementById('tot');
var hits = 0, runs = 0, timer = null;
function buildGrid() {
  var n = +Nn.value; grid.innerHTML = '';
  var cols = n <= 25 ? 9 : n <= 49 ? 12 : 17;
  grid.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)';
  for (var i = 0; i < n; i++) grid.appendChild(document.createElement('i'));
}
function vote(animate) {
  var n = +Nn.value, p = +P.value, corr = RHO.checked, leader = r() < p, ok = 0, cells = grid.children;
  for (var i = 0; i < n; i++) {
    var copy = corr && r() < 0.6, c = copy ? leader : (r() < p);
    if (c) ok++;
    var el = cells[i]; el.className = '';
    if (animate) (function (el, c, copy, i) { setTimeout(function () { el.className = (c ? 'ok' : 'no') + (copy ? ' copy' : ''); }, i * 12); })(el, c, copy, i);
    else el.className = (c ? 'ok' : 'no') + (copy ? ' copy' : '');
  }
  var win = ok > n / 2; runs++; if (win) hits++;
  res.textContent = win ? '答对 · ' + ok + ' 票对 ' + (n - ok) : '答错 · ' + ok + ' 票对 ' + (n - ok);
  res.className = 'big ' + (win ? 'ok' : 'no');
  acc.innerHTML = (hits / runs * 100).toFixed(1) + '<small>%</small>'; tot.textContent = '（' + runs + ' 次）';
  simDots.selectAll('circle').data([[n, hits / runs]]).join('circle').attr('r', 6).attr('fill', corr ? Deck.token('--gold') : Deck.token('--bag')).attr('cx', function (d) { return x(d[0]); }).attr('cy', function (d) { return y(d[1]); });
}
function resetSim() { hits = 0; runs = 0; res.textContent = '—'; res.className = 'big'; acc.textContent = '—'; tot.textContent = ''; simDots.selectAll('*').remove(); buildGrid(); }
document.getElementById('once').addEventListener('click', function () { vote(true); });
document.getElementById('many').addEventListener('click', function () {
  if (timer) return; var k = 0; timer = setInterval(function () { vote(false); if (++k >= 500) { clearInterval(timer); timer = null; } }, 4);
});
Ens.slider(P, function (v) { return v.toFixed(2); }, function () { drawChart(); resetSim(); });
Ens.slider(Nn, null, function () { drawChart(); resetSim(); });
RHO.addEventListener('change', resetSim);
drawChart(); resetSim();
</script>
</body>
</html>
