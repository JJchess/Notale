<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>03 · 两条路</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
  .lab{ position:absolute; left:64px; top:196px; width:960px; height:580px; }
  .lab .top{ display:flex; justify-content:space-between; align-items:center; height:40px; }
  .lab canvas{ position:absolute; left:0; top:48px; width:960px; height:492px; }
  .lab .foot-note{ position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:space-between; font-size:14px; color:var(--muted); }
  .lab .foot-note b{ color:var(--text); font-family:var(--font-num); font-weight:600; }
  .paths{ position:absolute; left:1064px; top:196px; width:472px; height:580px; display:grid; grid-template-rows:1fr 1fr; gap:16px; }
  .path{ padding:22px 24px; position:relative; overflow:hidden; cursor:pointer; transition:transform .2s, box-shadow .2s; border-width:1.5px; }
  .path:hover{ transform:translateY(-2px); }
  .path[aria-pressed=true]{ box-shadow:0 0 0 3px var(--c) inset, 0 10px 30px -18px rgba(29,35,39,.35); }
  .path .who{ font-size:13px; letter-spacing:.1em; color:var(--muted); font-family:var(--font-num); text-transform:uppercase; }
  .path h2{ margin-top:6px; font-size:26px; color:var(--c); }
  .path h2 small{ font-size:16px; color:var(--muted); font-weight:500; margin-left:8px; }
  .path p{ margin-top:10px; font-size:15px; line-height:1.6; }
  .path .diag{ position:absolute; right:22px; top:22px; width:120px; height:60px; }
  .path .stat{ position:absolute; left:24px; right:24px; bottom:18px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; border-top:1px solid var(--rule-2); padding-top:12px; }
  .path .stat .k{ font-size:12px; color:var(--muted); } .path .stat .v{ font-family:var(--font-num); font-size:22px; font-weight:600; margin-top:2px; }
  .path .stat .v.hi{ color:var(--boost); } .path .stat .v.lo{ color:var(--bag); }
</style>
</head>
<body>
<main id="stage">
  <header class="hd">
    <div class="kicker"><b>回顾 · 偏差与方差</b>WHERE ENSEMBLES COME FROM</div>
    <h1>同一份任务，换 20 份训练数据再拟合——模型会怎么抖？</h1>
    <p class="lede">误差 = 偏差² + 方差 + 噪声。<b>深树</b>各拟各的、抖得厉害；<b>浅树</b>齐刷刷地一起错。集成方法就是分别对付这两种毛病的两条路。</p>
  </header>

  <figure class="lab" aria-label="二十份重采样数据上分别拟合的树，与它们的平均">
    <div class="top">
      <div class="seg" id="seg" role="group" aria-label="选择基学习器">
        <button aria-pressed="true" data-k="deep">深树（深度 8）</button>
        <button aria-pressed="false" data-k="shallow">浅树（深度 1，一次切分）</button>
      </div>
      <div class="legend"><span><i style="--c:var(--single-lt)"></i>20 次拟合</span><span><i style="--c:var(--text)"></i>20 次的平均</span><span><i class="dash" style="--c:var(--quiet)"></i>真实函数</span></div>
    </div>
    <canvas id="cv"></canvas>
    <figcaption class="foot-note"><span>每次拟合用的是同一分布下重新抽的 60 个点</span><span>平均预测与真实函数的均方差 <b id="bias2">–</b> · 20 次拟合围绕平均的方差 <b id="vari">–</b></span></figcaption>
  </figure>

  <aside class="paths" aria-label="两条路">
    <button class="panel path" id="pathBag" style="--c:var(--bag)" aria-pressed="true">
      <div class="who">PATH A · 减方差</div>
      <h2>Bagging<small>随机森林</small></h2>
      <p>深树会抖，那就多训几棵、<b>并行地</b>训，最后取平均。抖动互相抵消，偏差基本不动。</p>
      <svg class="diag" viewBox="0 0 120 60" aria-hidden="true"><g fill="none" stroke="var(--bag)" stroke-width="2.5"><rect x="4" y="18" width="22" height="24" rx="4"/><rect x="34" y="18" width="22" height="24" rx="4"/><rect x="64" y="18" width="22" height="24" rx="4"/></g><path d="M15 42v10h70V42M50 52v6" fill="none" stroke="var(--bag)" stroke-width="2"/><circle cx="105" cy="30" r="9" fill="var(--bag)"/><path d="M86 30h10" stroke="var(--bag)" stroke-width="2"/></svg>
      <div class="stat"><div><div class="k">基学习器偏差</div><div class="v lo">低</div></div><div><div class="k">基学习器方差</div><div class="v hi">高</div></div><div><div class="k">合成方式</div><div class="v">平均</div></div></div>
    </button>
    <button class="panel path" id="pathBoost" style="--c:var(--boost)" aria-pressed="false">
      <div class="who">PATH B · 减偏差</div>
      <h2>Boosting<small>AdaBoost · GBDT</small></h2>
      <p>浅树太钝，一棵不够，那就<b>一棵接一棵</b>地补：后一棵专门学前面没学会的地方。偏差逐轮下降。</p>
      <svg class="diag" viewBox="0 0 120 60" aria-hidden="true"><g fill="none" stroke="var(--boost)" stroke-width="2.5"><rect x="4" y="18" width="20" height="24" rx="4"/><rect x="40" y="18" width="20" height="24" rx="4"/><rect x="76" y="18" width="20" height="24" rx="4"/></g><g stroke="var(--boost)" stroke-width="2" fill="none"><path d="M24 30h14M60 30h14"/><path d="M34 26l4 4-4 4M70 26l4 4-4 4"/></g><circle cx="110" cy="30" r="7" fill="var(--boost)"/><path d="M96 30h7" stroke="var(--boost)" stroke-width="2"/></svg>
      <div class="stat"><div><div class="k">基学习器偏差</div><div class="v hi">高</div></div><div><div class="k">基学习器方差</div><div class="v lo">低</div></div><div><div class="k">合成方式</div><div class="v">加权相加</div></div></div>
    </button>
  </aside>
</main>
<script src="assets/base.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/ens.js"></script>
<script>
Ens.footer(3);
var r = Ens.rng('bv-03'), sets = [];
for (var k = 0; k < 20; k++) sets.push(Ens.sine1d(60, 0.15, r));
var fits = { deep: [], shallow: [] };
sets.forEach(function (d) {
  fits.deep.push(Ens.regTree(d.x, d.y, { maxDepth: 8, minLeaf: 1 }));
  fits.shallow.push(Ens.regTree(d.x, d.y, { maxDepth: 1, minLeaf: 2 }));
});
var cv = document.getElementById('cv'), W = 960, H = 492, PAD = { l: 16, r: 16, t: 16, b: 16 }, N = 320;
function X(x) { return PAD.l + x * (W - PAD.l - PAD.r); }
function Y(y) { return PAD.t + (0.95 - y) / 1.9 * (H - PAD.t - PAD.b); }
var mode = 'deep', ctx;
function draw() {
  var F = fits[mode]; ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(29,35,39,.06)'; ctx.fillRect(0, 0, W, H);
  ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(106,113,119,.75)'; ctx.lineWidth = 2; ctx.beginPath();
  for (var k = 0; k <= N; k++) ctx[k ? 'lineTo' : 'moveTo'](X(k / N), Y(sets[0].f(k / N)));
  ctx.stroke(); ctx.setLineDash([]);
  var avg = new Float64Array(N + 1), preds = [];
  F.forEach(function (fn) {
    var p = new Float64Array(N + 1); ctx.strokeStyle = 'rgba(92,110,130,.28)'; ctx.lineWidth = 1.4; ctx.beginPath();
    for (var k = 0; k <= N; k++) { var v = fn(k / N); p[k] = v; avg[k] += v / F.length; ctx[k ? 'lineTo' : 'moveTo'](X(k / N), Y(v)); }
    ctx.stroke(); preds.push(p);
  });
  ctx.strokeStyle = Deck.token('--text'); ctx.lineWidth = 3.5; ctx.beginPath();
  for (var k2 = 0; k2 <= N; k2++) ctx[k2 ? 'lineTo' : 'moveTo'](X(k2 / N), Y(avg[k2]));
  ctx.stroke();
  var b2 = 0, va = 0;
  for (var k3 = 0; k3 <= N; k3++) { var d = avg[k3] - sets[0].f(k3 / N); b2 += d * d / (N + 1); for (var j = 0; j < preds.length; j++) { var e = preds[j][k3] - avg[k3]; va += e * e / (N + 1) / preds.length; } }
  document.getElementById('bias2').textContent = b2.toFixed(3); document.getElementById('vari').textContent = va.toFixed(3);
}
ctx = Deck.fit(cv); draw();
Deck.onResize(function () { ctx = Deck.fit(cv); draw(); });
var seg = document.getElementById('seg'), pb = document.getElementById('pathBag'), pB = document.getElementById('pathBoost');
function setMode(m) {
  mode = m; draw();
  seg.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.k === m); });
  pb.setAttribute('aria-pressed', m === 'deep'); pB.setAttribute('aria-pressed', m === 'shallow');
}
seg.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setMode(b.dataset.k); });
pb.addEventListener('click', function () { setMode('deep'); });
pB.addEventListener('click', function () { setMode('shallow'); });
</script>
</body>
</html>
