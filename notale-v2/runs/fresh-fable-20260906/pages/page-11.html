<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>11 · Bagging vs Boosting</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
  .cmp{ position:absolute; left:64px; top:190px; width:1472px; height:586px; display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .col{ padding:0; display:grid; grid-template-rows:150px 1fr; overflow:hidden; }
  .col .head{ position:relative; padding:20px 26px 0; border-bottom:1px solid var(--rule-2); }
  .col .head .who{ font-size:13px; letter-spacing:.1em; font-family:var(--font-num); color:var(--muted); text-transform:uppercase; }
  .col .head h2{ font-size:30px; color:var(--c); margin-top:4px; }
  .col .head h2 small{ font-size:15px; font-weight:500; color:var(--muted); margin-left:10px; }
  .col .head svg{ position:absolute; right:18px; top:16px; width:270px; height:108px; }
  .rows{ display:grid; grid-auto-rows:1fr; }
  .row{ display:grid; grid-template-columns:120px 1fr; gap:14px; align-items:center; padding:0 26px; border-bottom:1px solid var(--rule-2); transition:background .15s; cursor:default; }
  .row:last-child{ border-bottom:0; }
  .row .k{ font-size:13px; color:var(--muted); letter-spacing:.02em; }
  .row .v{ font-size:16px; line-height:1.45; color:var(--text); }
  .row .v b{ color:var(--c); font-weight:700; }
  .row .v .tag{ margin-left:6px; height:22px; font-size:12px; }
  .row[data-hl=true]{ background:color-mix(in srgb, var(--c) 8%, transparent); }
  .foot-hint{ position:absolute; left:64px; right:64px; bottom:62px; text-align:center; font-size:13px; color:var(--quiet); }
  /* 头部小动画 */
  .tree{ fill:none; stroke:var(--c); stroke-width:2.5; }
  .tree.done{ fill:color-mix(in srgb, var(--c) 18%, transparent); }
  .tree.wait{ opacity:.25; }
  .sum{ fill:var(--c); }
  .lbl{ font-size:12px; fill:var(--muted); font-family:var(--font-num); }
</style>
</head>
<body>
<main id="stage">
  <header class="hd">
    <div class="kicker"><b>对照</b>BAGGING vs BOOSTING</div>
    <h1>两条路并排放：<em class="bag">并行地抵消抖动</em>，还是<em class="boost">串行地补上短板</em></h1>
    <p class="lede">鼠标移到任意一行，另一边对应的那行会一起亮——每一条都是同一个问题的两种回答。</p>
  </header>

  <section class="cmp">
    <div class="panel col" id="colBag" style="--c:var(--bag)">
      <div class="head">
        <div class="who">PATH A · VARIANCE</div>
        <h2>Bagging<small>随机森林</small></h2>
        <svg id="svgBag" viewBox="0 0 300 120" aria-hidden="true"></svg>
      </div>
      <div class="rows" id="rowsBag"></div>
    </div>
    <div class="panel col" id="colBoost" style="--c:var(--boost)">
      <div class="head">
        <div class="who">PATH B · BIAS</div>
        <h2>Boosting<small>AdaBoost · GBDT</small></h2>
        <svg id="svgBoost" viewBox="0 0 300 120" aria-hidden="true"></svg>
      </div>
      <div class="rows" id="rowsBoost"></div>
    </div>
  </section>
  <p class="foot-hint">上方的小图在循环播放：左边所有树同时长出来再合并；右边一棵长完才长下一棵，每棵都站在前面的肩膀上。</p>
</main>
<script src="assets/base.js"></script>
<script src="assets/ens.js"></script>
<script>
Ens.footer(11);
var rows = [
  ['训练方式', '<b>并行</b>：B 棵树互不依赖，可以同时训', '<b>串行</b>：第 m 棵依赖前 m−1 棵的结果'],
  ['主要对付', '<b>方差</b>：把各自的抖动平均掉', '<b>偏差</b>：把没学会的地方一步步补上'],
  ['基学习器', '<b>深、强、不剪枝</b>的树——越抖越好平均', '<b>浅、弱</b>的树或桩——够弱才能一点点加'],
  ['样本怎么用', '每棵树一份<b>自助样本</b>，样本等权', '全部样本，按<b>权重</b>（AdaBoost）或<b>残差</b>（GBDT）改目标'],
  ['合成方式', '<b>平均</b> / <b>多数投票</b>，每棵一票', '<b>加权相加</b>：α<sub>m</sub> 或学习率 ν 决定每棵说多少'],
  ['对噪声、离群点', '<b>稳</b>：一个坏点只进约 63% 的树，被平均稀释', '<b>敏感</b>：分错的点权重越滚越大，会被死盯'],
  ['棵数加多了', '<b>不会过拟合</b>，只是变慢；看 OOB 曲线平了就停', '<b>会过拟合</b>：用验证集<b>早停</b>，配小学习率'],
  ['典型场景', '特征多、噪声大、想少调参就有好结果', '追求精度上限、愿意调参；XGBoost / LightGBM 是表格数据的常胜将军']
];
var rb = document.getElementById('rowsBag'), rB = document.getElementById('rowsBoost');
rows.forEach(function (r, i) {
  var a = document.createElement('div'), b = document.createElement('div'); a.className = b.className = 'row'; a.dataset.i = b.dataset.i = i;
  a.innerHTML = '<div class="k">' + r[0] + '</div><div class="v">' + r[1] + '</div>'; b.innerHTML = '<div class="k">' + r[0] + '</div><div class="v">' + r[2] + '</div>';
  rb.appendChild(a); rB.appendChild(b);
});
document.querySelectorAll('.row').forEach(function (el) {
  el.addEventListener('mouseenter', function () { document.querySelectorAll('.row[data-i="' + el.dataset.i + '"]').forEach(function (x) { x.dataset.hl = true; }); });
  el.addEventListener('mouseleave', function () { document.querySelectorAll('.row').forEach(function (x) { x.dataset.hl = false; }); });
});
// 头部小动画：左并行、右串行
function treePath(x, y, s) { return 'M' + x + ' ' + (y + s) + ' l' + (s * 0.55) + ' -' + s + ' l' + (s * 0.55) + ' ' + s + ' z'; }
var sb = document.getElementById('svgBag'), sB = document.getElementById('svgBoost'), NT = 5;
function build(svg, chain) {
  var h = '';
  for (var i = 0; i < NT; i++) { var x = 14 + i * 46; h += '<path class="tree wait" data-i="' + i + '" d="' + treePath(x, 30, 36) + '"/>'; if (chain && i < NT - 1) h += '<path class="tree" d="M' + (x + 42) + ' 50 h8" opacity=".5"/>'; }
  h += chain ? '<path class="tree" d="M14 86 H 240" stroke-dasharray="3 4" opacity=".5"/><text class="lbl" x="14" y="106">第 1 棵 → 第 2 棵 → … 每棵学前面剩下的</text>' : '<path class="tree" d="M32 72 V 84 H 218 V 72 M125 84 V 96" opacity=".6"/><circle class="sum" cx="125" cy="104" r="7"/><text class="lbl" x="140" y="108">平均</text>';
  svg.innerHTML = h;
}
build(sb, false); build(sB, true);
var still = Deck.reduced();
Deck.loop(function (t) {
  var T = (t / 1000) % 6; // 6 秒一循环
  sb.querySelectorAll('.tree[data-i]').forEach(function (p) { p.className.baseVal = 'tree ' + (still || T > 0.6 ? 'done' : 'wait'); p.style.transform = ''; });
  sB.queryAll = null;
  sB.querySelectorAll('.tree[data-i]').forEach(function (p, i) { var on = still || T > 0.6 + i * 0.9; p.className.baseVal = 'tree ' + (on ? 'done' : 'wait'); });
}, { still: 6000 });
</script>
</body>
</html>
