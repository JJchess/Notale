<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>12 · 回顾与自测</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
  .map{ position:absolute; left:64px; top:190px; width:560px; height:586px; padding:24px 26px; display:grid; grid-template-rows:auto 1fr auto; gap:16px; }
  .map h2{ font-size:20px; }
  .map svg{ width:100%; height:100%; overflow:visible; }
  .map .take{ border-top:1px solid var(--rule-2); padding-top:14px; display:grid; gap:8px; }
  .map .take p{ font-size:15px; line-height:1.5; color:var(--muted); padding-left:12px; border-left:3px solid var(--rule); }
  .map .take p b{ color:var(--text); }
  .quiz{ position:absolute; left:648px; top:190px; width:888px; height:586px; display:grid; grid-template-rows:repeat(4,1fr); gap:12px; }
  .q{ padding:14px 20px; display:grid; grid-template-columns:34px 1fr; gap:14px; align-items:start; }
  .q .n{ width:30px; height:30px; border-radius:8px; background:var(--text); color:var(--paper); display:grid; place-items:center; font-family:var(--font-num); font-weight:700; font-size:14px; margin-top:2px; }
  .q .stem{ font-size:17px; font-weight:600; line-height:1.4; }
  .q .opts{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .q .opts button{ height:34px; padding:0 14px; border-radius:8px; border:1px solid var(--rule); background:var(--paper); font-size:14px; cursor:pointer; color:var(--text); }
  .q .opts button:hover{ border-color:var(--text); }
  .q .opts button[data-r=ok]{ background:var(--bag-bg); border-color:var(--bag); color:var(--bag); font-weight:700; }
  .q .opts button[data-r=no]{ background:var(--boost-bg); border-color:var(--boost-lt); color:var(--boost); text-decoration:line-through; }
  .q .why{ font-size:14px; line-height:1.5; color:var(--muted); margin-top:8px; min-height:20px; }
  .q .why b{ color:var(--text); }
  .q[data-done=true] .stem{ color:var(--muted); }
  .n.ok{ background:var(--bag) !important; } .n.no{ background:var(--boost) !important; }
  .score{ position:absolute; right:64px; top:150px; font-size:14px; color:var(--muted); font-family:var(--font-num); }
  .score b{ color:var(--text); font-size:18px; }
  .node text{ font-size:15px; font-weight:700; }
  .node .sub{ font-size:12px; font-weight:400; fill:var(--muted); }
  .edge{ fill:none; stroke:var(--rule); stroke-width:2; }
  .edge.hl{ stroke:var(--c); }
  .elbl{ font-size:12px; fill:var(--muted); }
</style>
</head>
<body>
<main id="stage">
  <header class="hd">
    <div class="kicker"><b>回顾 · 自测</b>LECTURE 08 · WRAP-UP</div>
    <h1>带走一张图、三句话，再答四道题</h1>
    <p class="lede">点选项即刻判分，答错会给出解释。课后重看时，先做题再回头翻对应的页。</p>
  </header>
  <div class="score">答对 <b id="sc">0</b> / 4</div>

  <section class="panel map">
    <h2>这一讲的地图</h2>
    <svg viewBox="0 0 508 300" aria-label="从偏差方差到三类集成方法的关系图">
      <g class="edge-g">
        <path class="edge hl" style="--c:var(--bag)" d="M120 60 C 180 60, 200 110, 250 110"/>
        <path class="edge hl" style="--c:var(--boost)" d="M120 150 C 180 150, 200 190, 250 190"/>
        <path class="edge hl" style="--c:var(--gold)" d="M120 240 C 180 240, 200 270, 250 270"/>
        <path class="edge" d="M330 110 H 390"/><path class="edge" d="M330 190 H 390"/><path class="edge" d="M330 270 H 390"/>
      </g>
      <g class="node">
        <rect x="8" y="36" width="112" height="48" rx="10" fill="var(--paper)" stroke="var(--single)" stroke-width="1.5"/><text x="64" y="56" text-anchor="middle" fill="var(--single)">方差高</text><text class="sub" x="64" y="74" text-anchor="middle">深树各拟各的</text>
        <rect x="8" y="126" width="112" height="48" rx="10" fill="var(--paper)" stroke="var(--single)" stroke-width="1.5"/><text x="64" y="146" text-anchor="middle" fill="var(--single)">偏差高</text><text class="sub" x="64" y="164" text-anchor="middle">浅树一起错</text>
        <rect x="8" y="216" width="112" height="48" rx="10" fill="var(--paper)" stroke="var(--single)" stroke-width="1.5"/><text x="64" y="236" text-anchor="middle" fill="var(--single)">模型异构</text><text class="sub" x="64" y="254" text-anchor="middle">各家错法不同</text>
        <rect x="250" y="86" width="80" height="48" rx="10" fill="var(--bag-bg)" stroke="var(--bag)" stroke-width="1.5"/><text x="290" y="106" text-anchor="middle" fill="var(--bag)">Bagging</text><text class="sub" x="290" y="124" text-anchor="middle">并行 · 平均</text>
        <rect x="250" y="166" width="80" height="48" rx="10" fill="var(--boost-bg)" stroke="var(--boost)" stroke-width="1.5"/><text x="290" y="186" text-anchor="middle" fill="var(--boost)">Boosting</text><text class="sub" x="290" y="204" text-anchor="middle">串行 · 加权和</text>
        <rect x="250" y="246" width="80" height="48" rx="10" fill="#f7efd9" stroke="var(--gold)" stroke-width="1.5"/><text x="290" y="266" text-anchor="middle" fill="var(--gold)">Stacking</text><text class="sub" x="290" y="284" text-anchor="middle">元模型学权重</text>
        <text x="392" y="102" fill="var(--text)">随机森林</text><text class="sub" x="392" y="120">+ 特征随机 → 压 ρ</text>
        <text x="392" y="182" fill="var(--text)">AdaBoost · GBDT</text><text class="sub" x="392" y="200">权重 / 残差 · 学习率</text>
        <text x="392" y="262" fill="var(--text)">异构混搭</text><text class="sub" x="392" y="280">只能用袋外 / 交叉验证预测</text>
      </g>
      <text class="elbl" x="185" y="70">要它们不一样</text>
      <text class="elbl" x="185" y="164">要它们一棵接一棵</text>
    </svg>
    <div class="take">
      <p><b>集成有效的前提是差异。</b>错得一模一样的模型，再多也是一个模型。ρσ² 那一项 B 消不掉。</p>
      <p><b>Bagging 平均掉方差，Boosting 逐步补偏差。</b>选哪条路，先看基学习器的病在哪。</p>
      <p><b>凡是「用预测再去学」，那份预测必须来自没见过它的模型。</b>袋外、交叉验证，都是这句话。</p>
    </div>
  </section>

  <section class="quiz" id="quiz"></section>
</main>
<script src="assets/base.js"></script>
<script src="assets/ens.js"></script>
<script>
Ens.footer(12);
var Q = [
  { s: '随机森林的树从 100 棵加到 1000 棵，最可能看到什么？', o: ['测试误差明显下降', '过拟合加重，测试误差上升', '测试误差几乎不变，训练时间变长'], a: 2, w: '平均的东西越多越稳，不会过拟合；但 ρσ² 那一项已经到底，再加树只是<b>更慢</b>。看 OOB 曲线平了就该停。（第 6、7 页）' },
  { s: 'AdaBoost 某一轮的加权错误率 ε<sub>m</sub> = 0.5，这一刀的 α<sub>m</sub> 是多少？', o: ['很大，因为它最难', '0，等于瞎猜，没有话语权', '负数，要反着用'], a: 1, w: 'α = ½ ln((1−ε)/ε)，ε = 0.5 时 ln 1 = <b>0</b>。恰好和抛硬币一样的分类器对投票没有贡献。（第 8 页）' },
  { s: '基学习器是深度 1 的决策桩：偏差大、方差小。该用哪条路？', o: ['Bagging，多训几棵取平均', 'Boosting，一棵接一棵补', '都不行，桩太弱'], a: 1, w: '平均只能消方差，一群一起错的桩平均后还是错；Boosting 让后一棵专学前面没学会的，<b>偏差逐轮下降</b>。（第 3、9 页）' },
  { s: 'Stacking 里，用基模型在训练集上的预测去拟合元模型，会发生什么？', o: ['没问题，数据用得更充分', '元模型把权重全押给过拟合最重的那个基模型', '元模型学不出任何权重'], a: 1, w: '深树在训练集上几乎零误差，元模型只看到「它最准」，于是<b>原样继承它的过拟合</b>。必须用交叉验证或袋外预测。（第 10 页）' }
];
var quiz = document.getElementById('quiz'), score = 0;
Q.forEach(function (q, i) {
  var el = document.createElement('div'); el.className = 'panel q';
  el.innerHTML = '<div class="n">' + (i + 1) + '</div><div><div class="stem">' + q.s + '</div><div class="opts">' + q.o.map(function (o, j) { return '<button data-j="' + j + '">' + o + '</button>'; }).join('') + '</div><div class="why"></div></div>';
  el.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || el.dataset.done) return;
    el.dataset.done = true; var j = +b.dataset.j, ok = j === q.a;
    el.querySelectorAll('button').forEach(function (x, k) { x.dataset.r = k === q.a ? 'ok' : (k === j ? 'no' : ''); x.disabled = true; });
    el.querySelector('.n').classList.add(ok ? 'ok' : 'no');
    el.querySelector('.why').innerHTML = (ok ? '<b style="color:var(--bag)">答对。</b>' : '<b style="color:var(--boost)">不对。</b>') + q.w;
    if (ok) score++; document.getElementById('sc').textContent = score;
  });
  quiz.appendChild(el);
});
</script>
</body>
</html>
