<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="01" data-total="20">
<div id="stage">
  <style>
    .p01{
      flex:1;
      min-height:0;
      width:100%;
      display:flex;
      flex-direction:column;
    }
    .p01-head{
      flex:0 0 128px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      text-align:center;
    }
    .p01-head .kicker{
      margin:0 0 8px;
      color:var(--muted);
      letter-spacing:.12em;
    }
    .p01-head h1{
      margin:0;
      max-width:1320px;
      font-family:var(--font-sans);
      font-size:var(--fs-h1);
      line-height:1.12;
      font-weight:700;
      color:var(--text);
    }
    .p01-main{
      position:relative;
      flex:1;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px 0 24px;
    }
    .p01-generalization{
      position:relative;
      width:1280px;
      height:540px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    .p01-map{
      position:absolute;
      inset:0;
      z-index:0;
      width:100%;
      height:100%;
      overflow:visible;
      color:var(--rule-strong);
      pointer-events:none;
    }
    .p01-map .branch{stroke:var(--rule);}
    .p01-root{
      position:relative;
      z-index:2;
      flex:0 0 auto;
      padding:16px 40px 24px;
      background:var(--bg);
      color:var(--text);
      font-size:var(--fs-lead);
      line-height:1.35;
      font-weight:700;
      text-align:center;
    }
    .p01-root::after{
      content:"";
      position:absolute;
      left:50%;
      bottom:0;
      width:72px;
      height:2px;
      transform:translateX(-50%);
      background:var(--rule-strong);
    }
    .p01-spine{
      position:absolute;
      z-index:0;
      top:76px;
      bottom:78px;
      left:50%;
      width:2px;
      transform:translateX(-50%);
      background:var(--rule-strong);
    }
    .p01-supports{
      position:relative;
      z-index:1;
      flex:1;
      width:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:0;
      padding:16px 0;
    }
    .p01-support{
      min-height:96px;
      flex:1;
      display:grid;
      border-top:1px solid var(--rule);
      grid-template-columns:1fr 96px 1fr;
      align-items:center;
      color:var(--text);
    }
    .p01-support:last-child{
      border-bottom:1px solid var(--rule);
    }
    .p01-support::before{
      content:"";
      grid-column:2;
      justify-self:center;
      width:14px;
      height:14px;
      border:2px solid var(--rule-strong);
      border-radius:50%;
      background:var(--bg);
    }
    .p01-support > span{
      position:relative;
      display:block;
      width:100%;
      grid-column:1 / 4;
      grid-row:1;
      justify-self:stretch;
      font-size:var(--fs-h2);
      line-height:1.2;
      font-weight:700;
      white-space:nowrap;
    }
    .p01-support.left > span{
      padding-right:760px;
      text-align:right;
    }
    .p01-support.right > span{
      padding-left:760px;
      text-align:left;
    }
    .p01-support > span::after{
      content:"";
      position:absolute;
      top:50%;
      width:280px;
      height:1px;
      background:var(--rule);
    }
    .p01-support.left > span::after{left:calc(50% - 280px);}
    .p01-support.right > span::after{left:50%;}
    .p01-close{
      position:relative;
      z-index:2;
      flex:0 0 auto;
      max-width:940px;
      padding:24px 40px 8px;
      background:var(--bg);
      font-size:var(--fs-lead);
      line-height:1.35;
      font-weight:600;
      text-align:center;
      color:var(--text);
    }
    .p01-next{
      flex:0 0 64px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-top:1px solid var(--rule);
      color:var(--muted);
      font-size:var(--fs-body);
      line-height:1.35;
      text-align:center;
    }
  </style>

  <main class="p01 focus min0" aria-labelledby="p01-title">
    <header class="p01-head">
      <div class="kicker"><span>ACT I</span><span> · OPEN</span></div>
      <h1 id="p01-title" class="claim"><span>神经网络的“学会”</span><span>，是一串</span><span>看得见的数值动作</span></h1>
    </header>

    <section class="p01-main min0" aria-label="可检查的学习过程">
      <div class="k-generalization p01-generalization">
        <svg class="p01-map" viewBox="0 0 1280 540" preserveAspectRatio="none" aria-hidden="true">
          <path d="M640 72V470" fill="none" stroke="currentColor" stroke-width="2"/>
          <path class="branch" d="M270 190H640 M640 292H1010 M270 394H640" fill="none" stroke-width="2"/>
          <circle cx="640" cy="190" r="7" fill="var(--bg)" stroke="currentColor" stroke-width="2"/>
          <circle cx="640" cy="292" r="7" fill="var(--bg)" stroke="currentColor" stroke-width="2"/>
          <circle cx="640" cy="394" r="7" fill="var(--bg)" stroke="currentColor" stroke-width="2"/>
        </svg>
        <div class="p01-root"><span>“学会”</span><span>可以</span><span>被检查</span></div>
        <div class="p01-spine" aria-hidden="true"></div>
        <div class="supports p01-supports">
          <div class="support p01-support left" data-anim="enter" data-delay="0"><span><b>数值</b><b>可读</b></span></div>
          <div class="support p01-support right" data-anim="enter" data-delay="1"><span><b>步骤</b><b>可追</b></span></div>
          <div class="support p01-support left" data-anim="enter" data-delay="2"><span><b>改动</b><b>可见</b></span></div>
        </div>
        <div class="p01-close"><span>接下来不猜它在想什么，</span><span>只检查数字怎样产生、</span><span>怎样改变。</span></div>
      </div>
    </section>

    <div class="p01-next"><span>要把“学会”看清，</span><span>我们全课只追踪</span><span>哪四件事？</span></div>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
