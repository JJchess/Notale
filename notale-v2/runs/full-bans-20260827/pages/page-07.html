<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:var(--pad-y) var(--pad-x);display:flex;flex-direction:column;gap:24px;overflow:hidden}
  .p07-head{height:126px;flex:0 0 126px;display:flex;flex-direction:column;justify-content:flex-start;gap:8px}
  .p07-head .kicker{margin:0;color:var(--muted);font-size:var(--fs-label);font-weight:700;letter-spacing:.12em}
  .p07-head h1{margin:0;color:var(--text);font:700 var(--fs-h1)/1.12 var(--font-sans);letter-spacing:-.02em}
  .p07-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
  .p07-widget{flex:1;min-height:0;display:grid;grid-template-rows:64px minmax(0,1fr) 52px;gap:16px}
  .p07-rail{display:flex;align-items:center;gap:16px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:8px 0}
  .p07-fixed{font-size:var(--fs-sec);color:var(--muted);margin-right:auto;white-space:nowrap}
  .p07-fixed .num{color:var(--text)}
  .p07-rail .btns{display:flex;gap:8px}
  .p07-rail .btn{min-width:124px}
  .p07-stage{position:relative;min-height:0;overflow:hidden;border:1px solid var(--rule);border-radius:4px;background:transparent}
  .p07-stage svg{display:block;width:100%;height:100%}
  .p07-stage text{font-family:var(--font-sans);fill:var(--text)}
  .p07-stage .tick{font-family:var(--font-num);font-size:12px;fill:var(--muted)}
  .p07-stage .label{font-size:14px;fill:var(--muted)}
  .p07-stage .value{font-family:var(--font-num);font-size:20px;font-weight:700}
  .p07-stage .caption{font-size:17px;font-weight:700}
  .p07-stage .axis-line,.p07-stage .tick-line,.p07-stage .guide{stroke:var(--rule);vector-effect:non-scaling-stroke}
  .p07-stage .axis-line{stroke-width:2}
  .p07-stage .tick-line{stroke-width:1}
  .p07-stage .guide{stroke-width:1;stroke-dasharray:5 5}
  .p07-stage .knob-ring{fill:var(--bg);stroke:var(--rule-strong);stroke-width:2;vector-effect:non-scaling-stroke}
  .p07-stage .knob-mark{stroke:var(--rule-strong);stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .p07-stage .current .knob-ring{fill:var(--paper);stroke:var(--text)}
  .p07-stage .probe{opacity:.18;transition:opacity 160ms ease}
  .p07-stage .probe.is-seen{opacity:1}
  .p07-stage .probe.is-busy{opacity:.45}
  .p07-stage .probe.is-focus .knob-ring{stroke:var(--focus);stroke-width:3}
  .p07-stage .pred-shape{fill:var(--paper);stroke:var(--prediction);stroke-width:2;vector-effect:non-scaling-stroke}
  .p07-stage .pred-text{fill:var(--prediction)}
  .p07-stage .loss-line{stroke:var(--loss);stroke-width:3;vector-effect:non-scaling-stroke}
  .p07-stage .loss-dot{fill:var(--paper);stroke:var(--loss);stroke-width:3;vector-effect:non-scaling-stroke}
  .p07-stage .loss-text{fill:var(--loss)}
  .p07-stage .probe-path{fill:none;stroke:var(--rule-strong);stroke-width:3;stroke-dasharray:8 7;vector-effect:non-scaling-stroke;opacity:0}
  .p07-stage .probe-path.is-drawing{opacity:1;stroke-dasharray:160;stroke-dashoffset:160;animation:p07draw 360ms ease-out forwards}
  .p07-stage .decision{opacity:0;transition:opacity 180ms ease}
  .p07-stage .decision.is-shown{opacity:1}
  .p07-stage .decision-line{stroke:var(--update);stroke-width:3;vector-effect:non-scaling-stroke}
  .p07-stage .decision-text{fill:var(--update);font-size:17px;font-weight:700}
  .p07-feedback{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:52px}
  .p07-status{font-size:var(--fs-body);color:var(--muted);line-height:1.35}
  .p07-status strong{color:var(--update);font-weight:700}
  .p07-legend{display:flex;gap:24px;font-size:var(--fs-label);color:var(--muted);white-space:nowrap}
  .p07-legend span{display:flex;align-items:center;gap:8px}
  .p07-legend i{display:block;width:28px;height:0;border-top:2px solid var(--rule-strong)}
  .p07-legend .lg-loss{border-color:var(--loss);border-width:3px}
  .p07-foot{height:78px;flex:0 0 78px;border-top:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:40px}
  .p07-claim{margin:0;font-size:var(--fs-lead);line-height:1.35;color:var(--text);font-weight:650}
  .p07-next{margin:0;color:var(--muted);font-size:var(--fs-sec);white-space:nowrap}
  @keyframes p07draw{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){.p07-stage .probe-path.is-drawing{animation:none;stroke-dashoffset:0}.p07-stage .probe,.p07-stage .decision{transition:none}}
</style>
</head>
<body data-page="07" data-total="20">
<div id="stage">
  <header class="p07-head">
    <p class="kicker">LOCAL TEST · 左右试探</p>
    <h1>在当前权重两侧试一点，就知道往哪边走</h1>
  </header>

  <main class="p07-main canvas-full min0">
    <section class="p07-widget min0" data-p07-widget aria-label="单参数左右试探台">
      <div class="p07-rail">
        <div class="p07-fixed">固定条件　输入 <span class="num">x = 1</span>｜偏置 <span class="num">b = 0</span>｜正确答案 <span class="num">y = 1</span></div>
        <div class="btns" role="group" aria-label="试探操作">
          <button class="btn" type="button" data-probe="left">试左边</button>
          <button class="btn" type="button" data-probe="right">试右边</button>
          <button class="btn" type="button" data-reset>重新试探</button>
        </div>
      </div>

      <div class="p07-stage no-pan min0">
        <svg viewBox="0 0 1488 430" role="img" aria-labelledby="p07-svg-title p07-svg-desc">
          <title id="p07-svg-title">权重左右试探的预测与损失</title>
          <desc id="p07-svg-desc">三个等距权重位置分别是负零点五、零和正零点五。当前点始终显示，点击按钮后显示两侧试点的预测与损失。</desc>
          <defs>
            <marker id="p07-update-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--update)"/></marker>
          </defs>

          <text x="76" y="44" class="caption">同一条权重轴，三个位置不因损失高低而移动</text>
          <text x="76" y="76" class="label">试探间距固定为 0.5；这里只测方向，不改变当前权重</text>

          <line x1="278" y1="286" x2="1210" y2="286" class="axis-line"/>
          <line x1="364" y1="275" x2="364" y2="299" class="tick-line"/>
          <line x1="744" y1="275" x2="744" y2="299" class="tick-line"/>
          <line x1="1124" y1="275" x2="1124" y2="299" class="tick-line"/>
          <text x="364" y="330" text-anchor="middle" class="tick">−0.5</text>
          <text x="744" y="330" text-anchor="middle" class="tick">0</text>
          <text x="1124" y="330" text-anchor="middle" class="tick">+0.5</text>
          <text x="1240" y="292" class="label">权重 w</text>

          <path d="M744 286 H364" class="probe-path" data-path="left"/>
          <path d="M744 286 H1124" class="probe-path" data-path="right"/>

          <g class="probe" data-side="left" aria-label="左边试点">
            <line x1="364" y1="110" x2="364" y2="258" class="guide"/>
            <text x="364" y="105" text-anchor="middle" class="caption">左边试点</text>
            <g transform="translate(364 148)"><rect x="-44" y="-20" width="88" height="40" transform="rotate(45)" class="pred-shape"/><text x="0" y="7" text-anchor="middle" class="value pred-text" data-pred="left">37.8%</text></g>
            <text x="364" y="205" text-anchor="middle" class="label">预测 p</text>
            <line x1="304" y1="236" x2="424" y2="236" class="loss-line"/><circle cx="364" cy="236" r="8" class="loss-dot"/>
            <text x="364" y="265" text-anchor="middle" class="value loss-text" data-loss="left">0.974</text>
            <circle cx="364" cy="286" r="24" class="knob-ring"/><line x1="364" y1="286" x2="353" y2="269" class="knob-mark"/>
          </g>

          <g class="current">
            <line x1="744" y1="110" x2="744" y2="258" class="guide"/>
            <text x="744" y="105" text-anchor="middle" class="caption">当前点</text>
            <g transform="translate(744 148)"><rect x="-44" y="-20" width="88" height="40" transform="rotate(45)" class="pred-shape"/><text x="0" y="7" text-anchor="middle" class="value pred-text" data-pred="current">50.0%</text></g>
            <text x="744" y="205" text-anchor="middle" class="label">预测 p</text>
            <line x1="684" y1="236" x2="804" y2="236" class="loss-line"/><circle cx="744" cy="236" r="8" class="loss-dot"/>
            <text x="744" y="265" text-anchor="middle" class="value loss-text" data-loss="current">0.693</text>
            <circle cx="744" cy="286" r="27" class="knob-ring"/><line x1="744" y1="286" x2="744" y2="266" class="knob-mark"/>
            <text x="744" y="365" text-anchor="middle" class="label">当前权重保持为 0</text>
          </g>

          <g class="probe" data-side="right" aria-label="右边试点">
            <line x1="1124" y1="110" x2="1124" y2="258" class="guide"/>
            <text x="1124" y="105" text-anchor="middle" class="caption">右边试点</text>
            <g transform="translate(1124 148)"><rect x="-44" y="-20" width="88" height="40" transform="rotate(45)" class="pred-shape"/><text x="0" y="7" text-anchor="middle" class="value pred-text" data-pred="right">62.2%</text></g>
            <text x="1124" y="205" text-anchor="middle" class="label">预测 p</text>
            <line x1="1064" y1="236" x2="1184" y2="236" class="loss-line"/><circle cx="1124" cy="236" r="8" class="loss-dot"/>
            <text x="1124" y="265" text-anchor="middle" class="value loss-text" data-loss="right">0.474</text>
            <circle cx="1124" cy="286" r="24" class="knob-ring"/><line x1="1124" y1="286" x2="1135" y2="269" class="knob-mark"/>
          </g>

          <g class="decision" data-decision>
            <line x1="776" y1="388" x2="1088" y2="388" class="decision-line" marker-end="url(#p07-update-arrow)" data-anim="trace"/>
            <text x="932" y="420" text-anchor="middle" class="decision-text">向右更可能降低损失</text>
          </g>
        </svg>
      </div>

      <div class="p07-feedback">
        <div class="p07-status" data-status aria-live="polite">先任选一侧试探；当前点的预测与损失已作为比较基准。</div>
        <div class="p07-legend" aria-label="图例"><span><i></i>参数位置</span><span><i class="lg-loss"></i>损失读数</span></div>
      </div>
    </section>
  </main>

  <footer class="p07-foot">
    <p class="p07-claim">左右各试一次，损失较低的一侧就是当前附近更可能变好的方向。</p>
    <p class="p07-next">方向有了，一步究竟该走多远？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  const root = document.querySelector('[data-p07-widget]');
  if (!root) return;
  const initial = () => ({ left:false, right:false, active:null, timers:[] });
  let state = initial();
  let destroyed = false;
  const buttons = {
    left:root.querySelector('[data-probe="left"]'),
    right:root.querySelector('[data-probe="right"]'),
    reset:root.querySelector('[data-reset]')
  };
  const status = root.querySelector('[data-status]');
  const decision = root.querySelector('[data-decision]');

  function compute(w) {
    const forward = Lec.P.neuronForward([1], [w], 0, 'sigmoid');
    const p = Number(forward.output);
    const loss = Number(Lec.P.lossAndGradient([p], [1], 'binaryCrossEntropy').value);
    if (!Number.isFinite(p) || !Number.isFinite(loss)) throw new Error('Lec.P 计算结果无效');
    return {p, loss};
  }

  const results = { left:compute(-0.5), current:compute(0), right:compute(0.5) };
  function setReadout(side, result) {
    root.querySelector(`[data-pred="${side}"]`).textContent = `${(result.p*100).toFixed(1)}%`;
    root.querySelector(`[data-loss="${side}"]`).textContent = result.loss.toFixed(3);
  }
  Object.entries(results).forEach(([side,result]) => setReadout(side,result));

  function clearTimers() {
    state.timers.forEach(id => clearTimeout(id));
    state.timers = [];
  }
  function render() {
    for (const side of ['left','right']) {
      const group = root.querySelector(`[data-side="${side}"]`);
      group.classList.toggle('is-seen', state[side]);
      group.classList.toggle('is-focus', state.active === side);
      group.classList.toggle('is-busy', state.active === side && !state[side]);
      buttons[side].classList.toggle('on', state[side]);
      buttons[side].setAttribute('aria-pressed', String(state[side]));
    }
    const complete = state.left && state.right;
    decision.classList.toggle('is-shown', complete);
    if (complete) {
      const direction = results.right.loss < results.left.loss ? '右' : '左';
      status.innerHTML = `<strong>两侧都已检查：${direction}侧损失更低，在当前位置附近向${direction}更可能降低损失。</strong>`;
    } else if (state.left || state.right) {
      const side = state.left ? '左边' : '右边';
      const r = state.left ? results.left : results.right;
      status.textContent = `${side}试点：预测 ${(r.p*100).toFixed(1)}%，损失 ${r.loss.toFixed(3)}。还缺另一边，暂不能判断。`;
    } else {
      status.textContent = '先任选一侧试探；当前点的预测与损失已作为比较基准。';
    }
  }
  function probe(side) {
    if (destroyed) return;
    clearTimers();
    state.active = side;
    const path = root.querySelector(`[data-path="${side}"]`);
    path.classList.remove('is-drawing');
    void path.getBoundingClientRect();
    path.classList.add('is-drawing');
    render();
    const reveal = () => {
      state[side] = true;
      state.active = side;
      render();
      const settle = setTimeout(() => { state.active = null; path.classList.remove('is-drawing'); render(); }, 180);
      state.timers.push(settle);
    };
    if (Deck.reduced()) reveal();
    else state.timers.push(setTimeout(reveal, 360));
  }
  function reset() {
    clearTimers();
    for (const path of root.querySelectorAll('[data-path]')) path.classList.remove('is-drawing');
    state = initial();
    render();
    status.textContent = '试探已清除；当前权重仍为 0。任选一侧重新开始。';
  }
  buttons.left.addEventListener('click', () => probe('left'));
  buttons.right.addEventListener('click', () => probe('right'));
  buttons.reset.addEventListener('click', reset);
  render();
  root.destroyP07 = () => {
    if (destroyed) return;
    destroyed = true;
    clearTimers();
    buttons.left.replaceWith(buttons.left.cloneNode(true));
    buttons.right.replaceWith(buttons.right.cloneNode(true));
    buttons.reset.replaceWith(buttons.reset.cloneNode(true));
    delete root.destroyP07;
  };
})();
Deck.init({index:7,total:20});
</script>
</body>
</html>
