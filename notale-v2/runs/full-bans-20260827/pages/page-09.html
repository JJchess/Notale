<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>page-09</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{
    display:flex;
    flex-direction:column;
    padding: var(--pad-y) var(--pad-x);
    box-sizing:border-box;
  }
  .p9-head{ flex:0 0 auto; }
  .p9-head h1{
    margin:8px 0 0;
    max-width:1300px;
  }
  .p9-main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .p9-foot{ flex:0 0 auto; display:flex; flex-direction:column; gap:12px; max-width:1320px; }

  .genwrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:1300px;
  }
  .arrow-zone{
    position:relative;
    width:100%;
    height:170px;
  }
  .arrow-zone svg{ position:absolute; inset:0; width:100%; height:100%; }
  .arrow-end{
    position:absolute;
    top:34px;
    font-family:var(--font-sans);
    font-size:var(--fs-sec);
    color:var(--muted);
    line-height:1.35;
  }
  .arrow-end.r{ right:20px; text-align:right; }
  .arrow-end.l{ left:12px; text-align:left; }
  .claim{
    position:absolute;
    left:50%;
    top:40px;
    transform:translateX(-50%);
    width:380px;
    height:90px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-family:var(--font-sans);
    font-weight:700;
    font-size:var(--fs-h2);
    color:var(--text);
    line-height:1.35;
  }
  .trunk{
    width:2px;
    height:40px;
    background:var(--rule-strong);
    margin:0 auto;
  }
  .supports{
    display:flex;
    gap:24px;
    justify-content:center;
    width:max-content;
    margin:0 auto;
    border-top:2px solid var(--rule-strong);
    padding-top:16px;
  }
  .support{
    color:var(--muted);
    font-family:var(--font-sans);
    font-size:var(--fs-lead);
    white-space:nowrap;
    padding:0 8px;
  }
</style>
</head>
<body data-page="09" data-total="20">
<div id="stage">

  <div class="p9-head">
    <div class="kicker" data-anim="enter" data-delay="0">ACT III &middot; TURN</div>
    <h1 data-anim="enter" data-delay="0">多层网络把最终错误沿连接倒着传回去</h1>
  </div>

  <div class="p9-main">
    <div class="focus">
      <div class="genwrap k-generalization" role="img" aria-label="示意图:一条虚线箭头从右侧最终错误穿过中央主张沿原有连接向左返回前层参数,主张下方引出三条支撑——最终错误、原有连接、参数责任。">
        <div class="arrow-zone" data-anim="trace" data-delay="1">
          <svg viewBox="0 0 1300 170" aria-hidden="true">
            <line x1="1250" y1="85" x2="58" y2="85"
                  stroke="var(--rule-strong)" stroke-width="3"
                  stroke-dasharray="4 10" stroke-linecap="round"/>
            <path d="M 58 85 L 82 71 L 82 99 Z" fill="var(--rule-strong)"/>
          </svg>
          <div class="arrow-end r">最终错误</div>
          <div class="arrow-end l">前层参数</div>
          <div class="claim panel" data-anim="enter" data-delay="2">沿连接倒着分责</div>
        </div>

        <div class="trunk"></div>

        <div class="supports" data-anim="enter" data-delay="3">
          <div class="support">最终错误</div>
          <div class="support">原有连接</div>
          <div class="support">参数责任</div>
        </div>
      </div>
    </div>
  </div>

  <div class="p9-foot">
    <div class="lead" data-anim="enter" data-delay="3">这叫反向传播：沿原有连接反向计算各参数对最终误差应承担的责任。</div>
    <div class="small">在倒着分责之前，预测怎样穿过多层网络？</div>
  </div>

</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
