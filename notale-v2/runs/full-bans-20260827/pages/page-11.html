<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="11" data-total="20">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;padding:var(--pad-y) var(--pad-x);gap:24px;overflow:hidden}
    #stage .p11-head{flex:0 0 112px;display:flex;flex-direction:column;justify-content:flex-start;gap:8px}
    #stage .p11-head .kicker{margin:0;color:var(--muted);font-size:var(--fs-label);font-weight:700;letter-spacing:.16em}
    #stage .p11-head h1{margin:0;font-size:var(--fs-h1);line-height:1.1;font-weight:700;color:var(--text)}
    #stage .responsibility-widget{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:16px;color:var(--text)}
    #stage .responsibility-widget .rw-toolbar{flex:0 0 48px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--rule);padding-bottom:8px}
    #stage .responsibility-widget .rw-toolbar-label{font-size:var(--fs-label);color:var(--muted);font-weight:700;letter-spacing:.06em}
    #stage .responsibility-widget .rw-output-choices{display:flex;gap:8px}
    #stage .responsibility-widget .btn{min-height:40px;padding:8px 16px;font-size:var(--fs-label);white-space:nowrap}
    #stage .responsibility-widget .btn[aria-pressed="true"]{border:2px solid var(--rule-strong);font-weight:700}
    #stage .responsibility-widget .rw-clear{margin-left:auto}
    #stage .responsibility-widget .rw-reset{background:transparent}
    #stage .responsibility-widget .rw-body{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,2.15fr) minmax(390px,.85fr);gap:40px}
    #stage .responsibility-widget .rw-network{position:relative;min-width:0;min-height:0;border:1px solid var(--rule);border-radius:4px;background:transparent;overflow:hidden}
    #stage .responsibility-widget svg{display:block;width:100%;height:100%}
    #stage .responsibility-widget .rw-layer-label{fill:var(--muted);font-family:var(--font-sans);font-size:14px;font-weight:700;letter-spacing:.08em}
    #stage .responsibility-widget .rw-node-label{fill:var(--text);font-family:var(--font-sans);font-size:20px;font-weight:700;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
    #stage .responsibility-widget .rw-output-label{fill:var(--prediction)}
    #stage .responsibility-widget .rw-connection{fill:none;stroke:var(--rule);stroke-width:2;vector-effect:non-scaling-stroke}
    #stage .responsibility-widget .rw-forward-tip{fill:none;stroke:var(--rule-strong);stroke-width:1.5;opacity:.72;vector-effect:non-scaling-stroke}
    #stage .responsibility-widget .rw-back{fill:none;stroke:var(--text);stroke-width:3;stroke-dasharray:10 8;stroke-linecap:butt;vector-effect:non-scaling-stroke;opacity:0;pointer-events:none}
    #stage .responsibility-widget .rw-back.is-active{opacity:1;animation:p11-trace 400ms ease-out both}
    #stage .responsibility-widget .rw-back.is-active[data-leg="2"]{animation-delay:160ms}
    #stage .responsibility-widget .rw-neuron{fill:var(--bg);stroke:var(--text);stroke-width:2;vector-effect:non-scaling-stroke}
    #stage .responsibility-widget .rw-input{fill:var(--bg);stroke:var(--rule-strong);stroke-width:2;vector-effect:non-scaling-stroke}
    #stage .responsibility-widget .rw-output-shape{fill:var(--bg);stroke:var(--prediction);stroke-width:3;vector-effect:non-scaling-stroke}
    #stage .responsibility-widget .rw-output-hit{fill:transparent;cursor:pointer;outline:none}
    #stage .responsibility-widget .rw-output-choice:hover .rw-output-shape,
    #stage .responsibility-widget .rw-output-choice:focus .rw-output-shape{stroke-width:5}
    #stage .responsibility-widget .rw-output-choice[aria-pressed="true"] .rw-output-select{opacity:1}
    #stage .responsibility-widget .rw-output-select{fill:none;stroke:var(--rule-strong);stroke-width:2;stroke-dasharray:5 4;opacity:0;vector-effect:non-scaling-stroke;pointer-events:none}
    #stage .responsibility-widget .rw-side{min-width:0;display:flex;flex-direction:column;gap:24px;padding:8px 0}
    #stage .responsibility-widget .rw-state{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:2px solid var(--rule-strong)}
    #stage .responsibility-widget .rw-state .tag{font-size:var(--fs-label);color:var(--muted)}
    #stage .responsibility-widget .rw-state strong{font-size:var(--fs-body);font-weight:700}
    #stage .responsibility-widget .k-classification{display:flex;flex-direction:column;gap:24px;min-height:0}
    #stage .responsibility-widget .box{padding:0 0 0 24px;border-left:1px solid var(--rule);background:transparent}
    #stage .responsibility-widget .box h2{margin:0 0 12px;font-size:var(--fs-body);line-height:1.35}
    #stage .responsibility-widget .box.active h2{color:var(--text)}
    #stage .responsibility-widget .box.quiet h2{color:var(--muted)}
    #stage .responsibility-widget .rw-paths{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px 16px;font-family:var(--font-num);font-size:var(--fs-sec);line-height:1.5}
    #stage .responsibility-widget .rw-paths li{white-space:nowrap}
    #stage .responsibility-widget .rw-paths li::before{content:"";display:inline-block;width:16px;margin-right:8px;border-top:2px dashed var(--text);vertical-align:middle}
    #stage .responsibility-widget .rw-excluded{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.55}
    #stage .responsibility-widget .rw-note{margin-top:auto;padding-top:16px;border-top:1px solid var(--rule);font-size:var(--fs-sec);line-height:1.5;color:var(--muted)}
    #stage .responsibility-widget .rw-note strong{color:var(--text)}
    #stage .p11-foot{flex:0 0 86px;display:flex;align-items:flex-start;justify-content:space-between;gap:40px;border-top:2px solid var(--text);padding-top:16px}
    #stage .p11-foot .lead{margin:0;max-width:990px;font-size:var(--fs-lead);line-height:1.35}
    #stage .p11-foot .next{margin:0;max-width:420px;font-size:var(--fs-sec);line-height:1.45;color:var(--muted);text-align:right}
    @keyframes p11-trace{from{stroke-dashoffset:54;opacity:.18}to{stroke-dashoffset:0;opacity:1}}
    @media (prefers-reduced-motion:reduce){#stage .responsibility-widget .rw-back.is-active{animation:none}}
  </style>

  <header class="p11-head">
    <p class="kicker">RESPONSIBILITY MAP</p>
    <h1>责任只沿实际影响过输出的路径返回</h1>
  </header>

          </defs>

          <text class="rw-layer-label" x="472" y="42">隐藏节点</text>

            <path class="rw-connection" d="M160 115 L450 380" marker-end="url(#p11-forward-arrow)"/>

            <path class="rw-connection" d="M160 385 L450 250" marker-end="url(#p11-forward-arrow)"/>
            <path class="rw-connection" d="M160 385 L450 380" marker-end="url(#p11-forward-arrow)"/>
            <path class="rw-connection" d="M510 120 L815 165" marker-end="url(#p11-forward-arrow)"/>
            <path class="rw-connection" d="M510 250 L815 165" marker-end="url(#p11-forward-arrow)"/>
            <path class="rw-connection" d="M510 250 L815 335" marker-end="url(#p11-forward-arrow)"/>
            <path class="rw-connection" d="M510 380 L815 335" marker-end="url(#p11-forward-arrow)"/>
          </g>

      </div>

      <aside class="rw-side min0" aria-label="路径归属">
        <div class="rw-state"><span class="tag">当前状态</span><strong data-state-label aria-live="polite">输出 A 错了</strong></div>
        <div class="k-classification">
          <section class="box active">
            <h2>收到责任信号</h2>
            <ul class="rw-paths" data-included></ul>
          </section>
          <section class="box quiet">
            <h2>本次不收到</h2>
            <p class="rw-excluded" data-excluded></p>
          </section>
        </div>
        <p class="rw-note" data-observation><strong>观察：</strong>h₂ 同时连到两个输出；本次只追溯通向 A 的那一侧。</p>
      </aside>
    </div>
  </section>

  <footer class="p11-foot">
    <p class="lead">反向传播不会把责任平均撒给所有节点，而是沿着通向这个错误输出的原连接追溯。</p>
    <p class="next">下一问：同一路径上，每一段的影响怎样合成？</p>
  </footer>

  <script>
  (() => {
    const boot = () => {
      const root = document.querySelector('[data-responsibility-widget]');
      if (!root || root.dataset.ready) return;
      root.dataset.ready = 'true';

      const choices = Array.from(root.querySelectorAll('[data-select]'));
      const svgChoices = Array.from(root.querySelectorAll('[data-svg-select]'));
      const backPaths = Array.from(root.querySelectorAll('[data-path]'));
      const clearButton = root.querySelector('[data-clear]');
      const resetButton = root.querySelector('[data-reset]');
      const stateLabel = root.querySelector('[data-state-label]');
      const included = root.querySelector('[data-included]');
      const excluded = root.querySelector('[data-excluded]');
      const observation = root.querySelector('[data-observation]');

      const maps = {
        A: {
          paths: ['A-h1','A-h2','h1-x1','h1-x2','h2-x2','h2-x3'],
          labels: ['A←h₁','A←h₂','h₁←x₁','h₁←x₂','h₂←x₂','h₂←x₃'],
          excluded: '只通向输出 B 的连接，以及孤立于 A 的隐藏分支。',
          note: 'h₂ 同时连到两个输出；本次只追溯通向 A 的那一侧。'
        },
        B: {
          paths: ['B-h2','B-h3','h2-x2','h2-x3','h3-x1','h3-x3'],
          labels: ['B←h₂','B←h₃','h₂←x₂','h₂←x₃','h₃←x₁','h₃←x₃'],
          excluded: '只通向输出 A 的连接，以及孤立于 B 的隐藏分支。',
          note: 'h₂ 也能把 B 的责任继续传向 x₂、x₃；h₁ 因为没有通向 B 的连接而不亮。'
        }
      };

      let state = { selected: 'A' };
      let destroyed = false;
      const listeners = [];

      function on(el, type, handler) {
        el.addEventListener(type, handler);
        listeners.push(() => el.removeEventListener(type, handler));
      }

      function transition(current, action) {
        if (action.type === 'select' && maps[action.output]) {
          if (current.selected === action.output) return current;
          return { selected: action.output };
        }
        if (action.type === 'clear') return { selected: null };
        if (action.type === 'reset') return { selected: 'A' };
        return current;
      }

      function render(announce) {
        const selected = state.selected;
        const active = selected ? new Set(maps[selected].paths) : new Set();
        backPaths.forEach(path => {
          const shouldShow = active.has(path.dataset.path);
          path.classList.remove('is-active');
          if (shouldShow) {
            void path.getBoundingClientRect();
            path.classList.add('is-active');
          }
        });
        choices.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.select === selected)));
        svgChoices.forEach(node => node.setAttribute('aria-pressed', String(node.dataset.svgSelect === selected)));

        if (selected) {
          const item = maps[selected];
          stateLabel.textContent = `输出 ${selected} 错了`;
          included.innerHTML = item.labels.map(label => `<li>${label}</li>`).join('');
          excluded.textContent = item.excluded;
          observation.innerHTML = `<strong>观察：</strong>${item.note}`;
        } else {
          stateLabel.textContent = '尚未选择输出';
          included.innerHTML = '<li>没有路径被追溯</li>';
          excluded.textContent = '全部连接只显示前向结构；请选择一个出错输出。';
          observation.innerHTML = '<strong>观察：</strong>清除后，网络拓扑与节点位置都没有改变。';
        }

      }

      function dispatch(action, announce = true) {
        if (destroyed) return;
        const next = transition(state, action);
        if (next === state) return;
        state = next;
        render(announce);
      }

      choices.forEach(button => on(button, 'click', () => dispatch({ type:'select', output:button.dataset.select })));
      svgChoices.forEach(node => {
        on(node, 'click', () => dispatch({ type:'select', output:node.dataset.svgSelect }));
        on(node, 'keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            event.stopPropagation();
            dispatch({ type:'select', output:node.dataset.svgSelect });
          }
        });
      });
      on(clearButton, 'click', () => dispatch({ type:'clear' }));
      on(resetButton, 'click', () => dispatch({ type:'reset' }));

      render(false);

      root.destroyResponsibilityWidget = () => {
        if (destroyed) return;
        destroyed = true;
        listeners.splice(0).forEach(off => off());
        delete root.destroyResponsibilityWidget;
      };
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once:true });
    else boot();
  })();
  </script>
</div>
