<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多层会把简单判断组合起来</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{
    display:flex;
    flex-direction:column;
    padding:var(--pad-y) var(--pad-x);
    overflow:hidden;
  }
  .page-head{flex:0 0 96px;display:flex;flex-direction:column;justify-content:flex-start;gap:8px}
  .page-head .kicker{margin:0;color:var(--muted);font-size:var(--fs-label);font-weight:700;letter-spacing:.16em;line-height:1.2}
  .page-head h1{margin:0;color:var(--text);font-family:var(--font-sans);font-size:var(--fs-h1);line-height:1.08;font-weight:760;letter-spacing:-.025em}
  .lesson{flex:1;min-height:0;display:flex;flex-direction:column;gap:24px}
  .focus-map{flex:1;min-height:0;display:flex;align-items:stretch;justify-content:center}
  .composition{
    width:1400px;height:100%;min-height:0;
    display:grid;grid-template-rows:244px 48px minmax(0,1fr);
    position:relative;
  }
  .siblings{display:grid;grid-template-columns:1fr 1fr;gap:40px;min-height:0}
  .decision{
    min-width:0;display:grid;grid-template-columns:180px 1fr;gap:24px;align-items:center;
    border:1px solid var(--rule);border-radius:4px;padding:24px 32px;background:transparent;
  }
  .decision-copy{min-width:0}
  .decision h2{margin:0 0 16px;font-size:var(--fs-lead);line-height:1.15;color:var(--text);font-weight:720}
  .decision p{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
  .mini-plot{width:100%;height:172px;display:block}
  .merge{position:relative;display:flex;justify-content:center;align-items:center;color:var(--rule-strong)}
  .merge svg{width:650px;height:48px;display:block;overflow:visible}
  .combined{
    min-height:0;position:relative;border:2px solid var(--rule-strong);border-radius:4px;
    display:grid;grid-template-columns:310px 1fr;gap:40px;align-items:center;padding:24px 40px;
  }
  .combined>.bt{position:absolute;top:-12px;left:40px;background:var(--bg);padding:0 8px;color:var(--muted);font-size:var(--fs-label);font-weight:700;letter-spacing:.1em}
  .combined-copy{min-width:0}
  .combined-copy h2{margin:0 0 16px;font-size:var(--fs-h2);line-height:1.12;color:var(--text);font-weight:760}
  .combined-copy p{margin:0;color:var(--muted);font-size:var(--fs-body);line-height:1.45}
  .combo-plot{width:100%;height:235px;display:block}
  .plot-frame{fill:var(--paper);stroke:var(--rule);stroke-width:1.5}
  .axis-line{stroke:var(--rule);stroke-width:1}
  .grid-line{stroke:var(--rule);stroke-width:1;opacity:.42}
  .boundary{fill:none;stroke:var(--text);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .selected{fill:var(--text);opacity:.16}
  .label-box{fill:var(--paper);stroke:none}
  .plot-label{fill:var(--text);font:700 17px var(--font-sans)}
  .plot-note{fill:var(--muted);font:14px var(--font-sans)}
  .merge-line{fill:none;stroke:var(--rule-strong);stroke-width:2}
  .merge-tip{fill:var(--rule-strong)}
  .bottom-line{flex:0 0 80px;border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:64px;align-items:center}
  .takeaway{margin:0;max-width:1010px;color:var(--text);font-size:var(--fs-lead);line-height:1.35;font-weight:620}
  .next{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.35;white-space:nowrap;text-align:right}
  .next strong{display:block;color:var(--text);font-size:var(--fs-label);letter-spacing:.08em;margin-bottom:8px}
</style>
</head>
<body data-page="14" data-total="20">
<div id="stage">
  <header class="page-head">
    <p class="kicker">ACT IV · COMBINE</p>
    <h1>多层会把简单判断组合起来</h1>
  </header>

  <main class="lesson min0">
    <section class="focus focus-map min0" aria-label="简单判断组合示意图">
      <div class="k-classification composition min0">
        <div class="siblings min0">
          <article class="box decision min0">
            <div class="decision-copy">
              <h2>简单判断 A</h2>
              <p>一条直线切出一个简单区域</p>
            </div>
            <svg class="mini-plot" viewBox="0 0 300 190" role="img" aria-label="直线向右上倾斜，选中直线上方区域">
              <rect class="plot-frame" x="10" y="10" width="280" height="170" rx="4"/>
              <path class="selected" d="M10 10H290V50L10 154Z"/>
              <path class="grid-line" d="M42 138H272M42 116H272M42 94H272M42 72H272M42 50H272M70 28V160M99 28V160M128 28V160M157 28V160M186 28V160M214 28V160M243 28V160"/>
              <line class="axis-line" x1="42" y1="160" x2="272" y2="160"/>
              <line class="axis-line" x1="42" y1="160" x2="42" y2="28"/>
              <path class="boundary" d="M24 154L281 50"/>
              <rect class="label-box" x="166" y="22" width="96" height="28" rx="4"/>
              <text class="plot-label" x="214" y="42" text-anchor="middle">A 选中</text>
              <text class="plot-note" x="94" y="131" text-anchor="middle">直线 A</text>
              <text class="plot-note" x="224" y="148" text-anchor="middle">未选中</text>
            </svg>
          </article>

          <article class="box decision min0">
            <div class="decision-copy">
              <h2>简单判断 B</h2>
              <p>另一条直线切出另一个区域</p>
            </div>
            <svg class="mini-plot" viewBox="0 0 300 190" role="img" aria-label="直线向右下倾斜，选中直线上方区域">
              <rect class="plot-frame" x="10" y="10" width="280" height="170" rx="4"/>
              <path class="selected" d="M10 10H290V151L10 54Z"/>
              <path class="grid-line" d="M42 138H272M42 116H272M42 94H272M42 72H272M42 50H272M70 28V160M99 28V160M128 28V160M157 28V160M186 28V160M214 28V160M243 28V160"/>
              <line class="axis-line" x1="42" y1="160" x2="272" y2="160"/>
              <line class="axis-line" x1="42" y1="160" x2="42" y2="28"/>
              <path class="boundary" d="M20 54L282 151"/>
              <rect class="label-box" x="38" y="22" width="96" height="28" rx="4"/>
              <text class="plot-label" x="86" y="42" text-anchor="middle">B 选中</text>
              <text class="plot-note" x="211" y="132" text-anchor="middle">直线 B</text>
              <text class="plot-note" x="82" y="148" text-anchor="middle">未选中</text>
            </svg>
          </article>
        </div>

        <div class="merge" aria-hidden="true">
          <svg viewBox="0 0 650 48">
            <path class="merge-line" d="M72 0V17H325M578 0V17H325V37"/>
            <path class="merge-tip" d="M317 34L325 46L333 34Z"/>
            <rect x="284" y="7" width="82" height="20" fill="var(--bg)"/>
            <text x="325" y="22" text-anchor="middle" fill="var(--muted)" style="font:14px var(--font-sans)">共同指向</text>
          </svg>
        </div>

        <section class="lv combined min0">
          <span class="bt">组合后</span>
          <div class="combined-copy">
            <h2>组合判断</h2>
            <p>把 A 与 B 的区域放在一起，判断边界就有了多个线段。</p>
            <p class="small" style="margin:16px 0 0;color:var(--text)">各自切分，组合保留。</p>
          </div>
          <svg class="combo-plot" viewBox="0 0 700 250" role="img" aria-label="两条直线共同围出一个由多段边界组成的区域">
            <rect class="plot-frame" x="12" y="12" width="676" height="226" rx="4"/>
            <path class="grid-line" d="M58 180H654M58 151H654M58 123H654M58 94H654M58 66H654M132 38V208M207 38V208M281 38V208M356 38V208M430 38V208M505 38V208M579 38V208"/>
            <line class="axis-line" x1="58" y1="208" x2="654" y2="208"/>
            <line class="axis-line" x1="58" y1="208" x2="58" y2="38"/>
            <path class="selected" d="M185 154L350 74L520 154L520 208H185Z"/>
            <path class="boundary" d="M185 154L350 74L520 154"/>
            <line x1="185" y1="154" x2="185" y2="208" stroke="var(--rule-strong)" stroke-width="2" stroke-dasharray="7 7"/>
            <line x1="520" y1="154" x2="520" y2="208" stroke="var(--rule-strong)" stroke-width="2" stroke-dasharray="7 7"/>
            <text class="plot-label" x="350" y="174" text-anchor="middle">A 与 B 共同选中</text>
            <text class="plot-note" x="350" y="198" text-anchor="middle">多个简单区域拼成一个组合区域</text>
            <text class="plot-note" x="233" y="92" text-anchor="middle">来自 A</text>
            <text class="plot-note" x="469" y="92" text-anchor="middle">来自 B</text>
            <text class="plot-note" x="112" y="190" text-anchor="middle">未共同选中</text>
            <text class="plot-note" x="590" y="190" text-anchor="middle">未共同选中</text>
          </svg>
        </section>
      </div>
    </section>

    <footer class="bottom-line">
      <p class="takeaway">更深的网络不只是重复计算；它能把多个简单区域拼成更复杂的判断。</p>
      <p class="next"><strong>下一问</strong>单个简单判断，究竟哪里不够？</p>
    </footer>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:14,total:20});</script>
</body>
</html>
