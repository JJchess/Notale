<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>隐藏层把简单区域组合成非直线边界</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{display:flex;flex-direction:column;padding:var(--pad-y) var(--pad-x);gap:24px;overflow:hidden}
    #stage .page-head{flex:0 0 auto;max-width:1240px}
    #stage .kicker{margin:0 0 8px;color:var(--muted);font-size:var(--fs-label);font-weight:700;letter-spacing:.14em}
    #stage h1{margin:0;font:700 var(--fs-h1)/1.12 var(--font-sans);color:var(--text)}
    #region-widget{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:16px;color:var(--text)}
    #region-widget .control-rail{display:flex;align-items:center;gap:16px;min-width:0}
    #region-widget .control-label{font-size:var(--fs-sec);color:var(--muted);white-space:nowrap}
    #region-widget .btns{display:flex;align-items:center;gap:8px}
    #region-widget .btn{min-width:120px}
    #region-widget .btn[aria-pressed="true"]{border-color:var(--focus);outline:2px solid var(--focus);outline-offset:1px;font-weight:700}
    #region-widget .reset{margin-left:auto;min-width:104px}
    #region-widget .triptych{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;min-height:0}
    #region-widget .box{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;min-width:0;min-height:0;padding:16px;border:1px solid var(--rule);border-radius:4px;background:transparent}
    #region-widget .box.combo{border-width:2px;border-color:var(--rule-strong)}
    #region-widget .plot-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;min-height:32px}
    #region-widget .plot-title{margin:0;font-size:var(--fs-body);font-weight:700}
    #region-widget .plot-formula{font:var(--fs-label)/1.35 var(--font-num);color:var(--muted);white-space:nowrap}
    #region-widget .sample-plane{position:relative;min-height:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--paper)}
    #region-widget canvas{display:block;width:100%;height:100%}
    #region-widget .point-readouts{position:absolute;inset:0;pointer-events:none}
    #region-widget .point-readout{position:absolute;transform:translate(-50%,-50%);padding:2px 4px;background:var(--paper);border:1px solid var(--rule-strong);border-radius:4px;font:700 var(--fs-label)/1 var(--font-num);color:var(--prediction);font-variant-numeric:tabular-nums;white-space:nowrap}
    #region-widget .point-readout.bad{color:var(--loss);border-style:dashed}
    #region-widget .plane-note{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:28px;font-size:var(--fs-label);color:var(--muted)}
    #region-widget .score{font:700 var(--fs-sec)/1.2 var(--font-num);color:var(--text);font-variant-numeric:tabular-nums}
    #region-widget .score.all{color:var(--update)}
    #region-widget .foot{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:40px;border-top:1px solid var(--rule);padding-top:16px}
    #region-widget .closing{margin:0;font-size:var(--fs-lead);line-height:1.35;font-weight:600}
    #region-widget .reveal{min-height:24px;margin-top:8px;font-size:var(--fs-sec);line-height:1.35;color:var(--update);font-weight:700}
    #region-widget .next{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.35;white-space:nowrap}
  </style>
</head>
<body data-page="16" data-total="20">
  <div id="stage">
    <header class="page-head">
      <p class="kicker">REGION COMBINATION</p>
      <h1>隐藏层把简单区域组合成非直线边界</h1>
    </header>

    <section id="region-widget" class="k-classification min0" aria-label="隐藏区域组合实验">
      <div class="control-rail">
        <span class="control-label">第三幅采用</span>
        <div class="btns" role="group" aria-label="选择组合方式">
          <button class="btn" type="button" data-mode="a" aria-pressed="true">只用 A</button>
          <button class="btn" type="button" data-mode="b" aria-pressed="false">只用 B</button>
          <button class="btn" type="button" data-mode="ab" aria-pressed="false">合并 A+B</button>
        </div>
        <span class="hint">三幅图的坐标、样本和色阶保持不变</span>
        <button class="btn reset" type="button" data-reset>重新开始</button>
      </div>

      <div class="triptych min0">
        <article class="box min0" data-plane-card="a">
          <div class="plot-head">
            <h2 class="plot-title">隐藏区域 A：排除左下</h2>
            <span class="plot-formula">hA = sigmoid(8 × (x+y+0.8))</span>
          </div>
          <div class="sample-plane cvbox min0">
            <canvas data-plane="a" aria-hidden="true"></canvas>
          </div>
          <div class="plane-note"><span>深蓝处输出更接近 1</span><span>50% 等值线</span></div>
        </article>

        <article class="box min0" data-plane-card="b">
          <div class="plot-head">
            <h2 class="plot-title">隐藏区域 B：排除右上</h2>
            <span class="plot-formula">hB = sigmoid(8 × (0.8−x−y))</span>
          </div>
          <div class="sample-plane cvbox min0">
            <canvas data-plane="b" aria-hidden="true"></canvas>
          </div>
          <div class="plane-note"><span>同一批四个样本</span><span>同一预测色阶</span></div>
        </article>

        <article class="box combo min0" data-plane-card="out">
          <div class="plot-head">
            <h2 class="plot-title">组合输出</h2>
            <span class="plot-formula" data-output-formula>p = hA</span>
          </div>
          <div class="sample-plane cvbox min0" data-output-wrap>
            <canvas data-plane="out" aria-hidden="true"></canvas>
            <div class="point-readouts" aria-hidden="true"></div>
          </div>
          <div class="plane-note"><span data-mode-label>当前：只用 A</span><span class="score" data-score>分类 3 / 4</span></div>
        </article>
      </div>

      <div class="foot">
        <div>
          <p class="closing">每个隐藏神经元只画出简单区域，下一层却能把它们组合成一条直线做不到的判断。</p>
          <div class="reveal" data-reveal aria-live="polite"></div>
        </div>
        <p class="next">这些边界能由训练自己长出来吗？</p>
      </div>
    </section>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
  (() => {
    const root = document.getElementById('region-widget');
    if (!root) return;

    const canvases = {
      a: root.querySelector('[data-plane="a"]'),
      b: root.querySelector('[data-plane="b"]'),
      out: root.querySelector('[data-plane="out"]')
    };
    const buttons = [...root.querySelectorAll('[data-mode]')];
    const resetButton = root.querySelector('[data-reset]');
    const formulaEl = root.querySelector('[data-output-formula]');
    const modeLabel = root.querySelector('[data-mode-label]');
    const scoreEl = root.querySelector('[data-score]');
    const revealEl = root.querySelector('[data-reveal]');
    const readoutLayer = root.querySelector('.point-readouts');

    const points = [
      {x:-0.8,y:-0.8,t:0,label:'左下'},
      {x:-0.8,y: 0.8,t:1,label:'左上'},
      {x: 0.8,y:-0.8,t:1,label:'右下'},
      {x: 0.8,y: 0.8,t:0,label:'右上'}
    ];
    const range = 1.3;
    const cells = 80;
    const initialState = () => ({mode:'a', from:'a', progress:1});
    let state = initialState();
    let stopAnimation = null;
    let destroyed = false;

    const sigmoid = value => 1 / (1 + Math.exp(-value));
    const hA = (x,y) => sigmoid(8 * (x + y + 0.8));
    const hB = (x,y) => sigmoid(8 * (0.8 - x - y));
    const valueFor = (mode,x,y) => mode === 'a' ? hA(x,y) : mode === 'b' ? hB(x,y) : sigmoid(12 * (hA(x,y) + hB(x,y) - 1.5));
    const clamp01 = v => Math.max(0, Math.min(1, v));

    function geometry(canvas){
      const w = canvas.offsetWidth || 440;
      const h = canvas.offsetHeight || 380;
      return {w,h,left:40,right:16,top:16,bottom:32,pw:w-56,ph:h-48};
    }
    function sx(g,x){ return g.left + (x + range) / (range * 2) * g.pw; }
    function sy(g,y){ return g.top + (range - y) / (range * 2) * g.ph; }

    function fieldColor(v){
      const base = [246,249,249];
      const blue = Deck.rgb('--prediction');
      const a = 0.08 + 0.72 * v;
      return `rgb(${Math.round(base[0]*(1-a)+blue[0]*a)},${Math.round(base[1]*(1-a)+blue[1]*a)},${Math.round(base[2]*(1-a)+blue[2]*a)})`;
    }

    function interpolatedValue(x,y,cellX,cellY){
      const oldV = valueFor(state.from,x,y);
      const newV = valueFor(state.mode,x,y);
      if (state.progress >= 1) return newV;
      const diagonal = (cellX + cellY) / ((cells - 1) * 2);
      const local = clamp01((state.progress * 1.4 - diagonal * 0.4));
      const eased = local * local * (3 - 2 * local);
      return oldV + (newV - oldV) * eased;
    }

    function drawPlane(key){
      const canvas = canvases[key];
      const ctx = canvas.getContext('2d');
      const g = geometry(canvas);
      ctx.clearRect(0,0,g.w,g.h);
      const cw = g.pw / cells;
      const ch = g.ph / cells;
      const values = Array.from({length:cells}, () => new Float32Array(cells));
      for(let iy=0; iy<cells; iy++){
        const y = range - (iy + 0.5) / cells * range * 2;
        for(let ix=0; ix<cells; ix++){
          const x = -range + (ix + 0.5) / cells * range * 2;
          const v = key === 'out' ? interpolatedValue(x,y,ix,iy) : valueFor(key,x,y);
          values[iy][ix] = v;
          ctx.fillStyle = fieldColor(v);
          ctx.fillRect(g.left + ix*cw, g.top + iy*ch, cw+0.6, ch+0.6);
        }
      }

      ctx.strokeStyle = Deck.token('--rule');
      ctx.lineWidth = 1;
      for(const tick of [-1,0,1]){
        const x = sx(g,tick), y = sy(g,tick);
        ctx.beginPath();ctx.moveTo(x,g.top);ctx.lineTo(x,g.top+g.ph);ctx.stroke();
        ctx.beginPath();ctx.moveTo(g.left,y);ctx.lineTo(g.left+g.pw,y);ctx.stroke();
      }

      ctx.strokeStyle = Deck.token('--rule-strong');
      ctx.lineWidth = 2;
      ctx.beginPath();
      for(let iy=0; iy<cells; iy++){
        for(let ix=0; ix<cells-1; ix++){
          if ((values[iy][ix] >= .5) !== (values[iy][ix+1] >= .5)){
            const x = g.left + (ix+1)*cw;
            const y = g.top + iy*ch;
            ctx.moveTo(x,y);ctx.lineTo(x,y+ch);
          }
        }
      }
      for(let iy=0; iy<cells-1; iy++){
        for(let ix=0; ix<cells; ix++){
          if ((values[iy][ix] >= .5) !== (values[iy+1][ix] >= .5)){
            const x = g.left + ix*cw;
            const y = g.top + (iy+1)*ch;
            ctx.moveTo(x,y);ctx.lineTo(x+cw,y);
          }
        }
      }
      ctx.stroke();

      ctx.strokeStyle = Deck.token('--text');
      ctx.lineWidth = 1;
      ctx.strokeRect(g.left,g.top,g.pw,g.ph);
      ctx.fillStyle = Deck.token('--muted');
      ctx.font = `${getComputedStyle(document.documentElement).getPropertyValue('--fs-tick').trim()} ${Deck.token('--font-num')}`;
      ctx.textAlign = 'center';ctx.textBaseline = 'top';
      for(const tick of [-1,0,1]) ctx.fillText(String(tick),sx(g,tick),g.top+g.ph+8);
      ctx.textAlign = 'right';ctx.textBaseline = 'middle';
      for(const tick of [-1,0,1]) ctx.fillText(String(tick),g.left-8,sy(g,tick));
      ctx.textAlign = 'right';ctx.textBaseline = 'bottom';ctx.fillText('x',g.left+g.pw,g.top+g.ph-8);
      ctx.textAlign = 'left';ctx.textBaseline = 'top';ctx.fillText('y',g.left+8,g.top);

      for(const p of points){
        const px=sx(g,p.x), py=sy(g,p.y);
        ctx.fillStyle = Deck.token('--paper');
        ctx.strokeStyle = Deck.token('--target');
        ctx.lineWidth = 2;
        ctx.fillRect(px-8,py-8,16,16);ctx.strokeRect(px-8,py-8,16,16);ctx.strokeRect(px-5,py-5,10,10);
        ctx.fillStyle = Deck.token('--target');
        ctx.font = `700 ${getComputedStyle(document.documentElement).getPropertyValue('--fs-label').trim()} ${Deck.token('--font-num')}`;
        ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(p.t),px,py);
      }
    }

    function updateReadouts(){
      const g = geometry(canvases.out);
      const elapsed = state.progress * 240;
      const values = points.map((p,i) => {
        const oldV = valueFor(state.from,p.x,p.y);
        const newV = valueFor(state.mode,p.x,p.y);
        const local = state.progress >= 1 ? 1 : clamp01((elapsed - i*40) / 120);
        const eased = local*local*(3-2*local);
        return oldV + (newV-oldV)*eased;
      });
      if (readoutLayer.children.length !== points.length){
        readoutLayer.replaceChildren(...points.map(() => Object.assign(document.createElement('span'),{className:'point-readout'})));
      }
      [...readoutLayer.children].forEach((el,i) => {
        const p=points[i], v=values[i];
        el.style.left = `${sx(g,p.x)}px`;
        el.style.top = `${sy(g,p.y) + (p.y > 0 ? -28 : 28)}px`;
        el.textContent = `${Math.round(v*100)}%`;
        el.classList.toggle('bad',(v>=.5?1:0)!==p.t);
      });
    }

    function committedResults(){
      return points.map(p => valueFor(state.mode,p.x,p.y));
    }

    function render(){
      if (destroyed) return;
      drawPlane('a');drawPlane('b');drawPlane('out');
      buttons.forEach(btn => btn.setAttribute('aria-pressed',String(btn.dataset.mode===state.mode)));
      const labels = {a:'当前：只用 A',b:'当前：只用 B',ab:'当前：合并 A+B'};
      const formulas = {a:'p = hA',b:'p = hB',ab:'p = sigmoid(12 × (hA+hB−1.5))'};
      modeLabel.textContent=labels[state.mode];formulaEl.textContent=formulas[state.mode];
      const values=committedResults();
      const correct=values.filter((v,i)=>(v>=.5?1:0)===points[i].t).length;
      scoreEl.textContent=`分类 ${correct} / 4`;
      scoreEl.classList.toggle('all',correct===4);
      revealEl.textContent=state.mode==='ab' && correct===4 ? '不是一条新直线，而是两个简单区域的共同部分。' : '';
      updateReadouts();
    }

    function cancelAnimation(){
      if(stopAnimation){stopAnimation();stopAnimation=null;}
    }

    function setMode(mode,announce=true){
      if (destroyed || !['a','b','ab'].includes(mode)) return;
      cancelAnimation();
      const previous=state.mode;
      state={mode,from:previous,progress:Deck.reduced()?1:0};
      render();
      if(state.progress<1){
        const started=performance.now();
        stopAnimation=Deck.loop(() => {
          state.progress=clamp01((performance.now()-started)/240);
          render();
          if(state.progress>=1) cancelAnimation();
        },{still:1});
      }
    }

    function onModeClick(event){setMode(event.currentTarget.dataset.mode);}
    function onReset(){cancelAnimation();state=initialState();render();}
    buttons.forEach(btn=>btn.addEventListener('click',onModeClick));
    resetButton.addEventListener('click',onReset);

    const fitStops = Object.values(canvases).map(canvas => Deck.autofit(canvas,render));
    render();

    root.destroyRegionWidget=()=>{
      if(destroyed)return;
      destroyed=true;cancelAnimation();
      fitStops.forEach(stop=>{if(typeof stop==='function')stop();});
      buttons.forEach(btn=>btn.removeEventListener('click',onModeClick));
      resetButton.removeEventListener('click',onReset);
      delete root.destroyRegionWidget;
    };
    Deck.init({index:16,total:20});
  })();
  </script>
</body>
</html>
