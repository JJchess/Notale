<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>反复更新会让边界逐步贴合训练样本</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{display:flex;flex-direction:column;padding:var(--pad-y) var(--pad-x);gap:16px;overflow:hidden}
    #train-widget{flex:1;min-height:0;display:grid;grid-template-rows:64px minmax(0,1fr) 190px;gap:16px;color:var(--text)}
    #train-widget *{box-sizing:border-box}
    #train-widget .tw-head{display:flex;align-items:flex-start;justify-content:space-between;gap:40px;flex:0 0 auto}
    #train-widget .tw-title{min-width:0}
    #train-widget .kicker{margin:0 0 8px;color:var(--muted);font-size:var(--fs-label);font-weight:700;letter-spacing:.12em}
    #train-widget h1{margin:0;font-size:var(--fs-h1);line-height:1.08;font-weight:700}
    #train-widget .tw-readouts{display:flex;align-items:flex-end;gap:24px;padding-top:8px;white-space:nowrap}
    #train-widget .tw-readout{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
    #train-widget .tw-readout .tag{font-size:var(--fs-label);color:var(--muted)}
    #train-widget .big{line-height:1}
    #train-widget .tw-loss .num{color:var(--loss)}
    #train-widget .tw-main{display:grid;grid-template-columns:minmax(0,1fr) 312px;gap:24px;min-height:0}
    #train-widget .tw-field-wrap{position:relative;min-width:0;min-height:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--paper)}
    #train-widget .tw-field{position:absolute;inset:0;width:100%;height:100%}
    #train-widget .tw-y{position:absolute;left:12px;top:10px;color:var(--muted);font:14px var(--font-num)}
    #train-widget .tw-x{position:absolute;right:12px;bottom:8px;color:var(--muted);font:14px var(--font-num)}
    #train-widget .tw-field-note{position:absolute;left:16px;bottom:14px;display:flex;align-items:center;gap:16px;padding:8px 12px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;font-size:var(--fs-label);color:var(--muted)}
    #train-widget .tw-field-note b{color:var(--text)}
    #train-widget .tw-swatch{display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-2px;border-radius:50%;background:var(--text)}
    #train-widget .tw-swatch.one{background:var(--target)}
    #train-widget .tw-side{display:flex;flex-direction:column;gap:16px;min-height:0}
    #train-widget .tw-controls{padding:16px;display:flex;flex-direction:column;gap:16px}
    #train-widget .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    #train-widget .btn{min-height:44px;font-size:var(--fs-label);white-space:nowrap}
    #train-widget [data-run]{grid-column:1/-1;font-size:var(--fs-body);font-weight:700}
    #train-widget .tw-fixed{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;padding-top:16px;border-top:1px solid var(--rule)}
    #train-widget .tw-fixed div{display:flex;flex-direction:column;gap:3px}
    #train-widget .tw-fixed .tag{color:var(--muted);font-size:var(--fs-label)}
    #train-widget .tw-fixed strong{font:17px var(--font-num);font-weight:700}
    #train-widget .tw-status{min-height:46px;font-size:var(--fs-sec);line-height:1.35;color:var(--muted)}
    #train-widget .tw-status strong{color:var(--text)}
    #train-widget .tw-process{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:8px 0 0;min-height:0}
    #train-widget .tw-process::before{content:"";position:absolute;left:34px;right:34px;top:30px;border-top:2px solid var(--rule-strong)}
    #train-widget .tw-process .step{position:relative;padding:38px 8px 0;border:0;text-align:center;font-size:var(--fs-label);color:var(--muted)}
    #train-widget .tw-process .step::before{content:"";position:absolute;top:14px;left:50%;width:13px;height:13px;transform:translateX(-50%);border:2px solid var(--rule-strong);border-radius:50%;background:var(--bg)}
    #train-widget .tw-process .step.active{color:var(--text);font-weight:700}
    #train-widget .tw-process .step.active::before{background:var(--update);border-color:var(--update)}
    #train-widget .tw-bottom{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:40px;min-height:0;padding-top:16px;border-top:1px solid var(--rule)}
    #train-widget .tw-chart-block{display:grid;grid-template-rows:24px minmax(0,1fr);min-width:0;min-height:0}
    #train-widget .tw-chart-title{display:flex;align-items:center;justify-content:space-between;font-size:var(--fs-label);color:var(--muted)}
    #train-widget .tw-chart-title strong{color:var(--loss);font-weight:700}
    #train-widget .tw-chart{width:100%;height:100%;min-height:0}
    #train-widget .tw-copy{display:flex;flex-direction:column;justify-content:center;gap:16px;min-width:0}
    #train-widget .lead{margin:0;font-size:var(--fs-lead);line-height:1.35}
    #train-widget .tw-next{margin:0;padding-top:16px;border-top:1px solid var(--rule);font-size:var(--fs-body);font-weight:700;color:var(--text)}
    #train-widget [data-anim="trace"]{animation:tw-trace 120ms ease-out}
    @keyframes tw-trace{from{opacity:.55}to{opacity:1}}
    @media (prefers-reduced-motion:reduce){#train-widget [data-anim="trace"]{animation:none}}
  </style>
</head>
<body data-page="17" data-total="20">
  <div id="stage">
    <section id="train-widget" aria-labelledby="page-title">
      <header class="tw-head">
        <div class="tw-title min0">
          <p class="kicker">LIVE TRAINING</p>
          <h1 id="page-title">反复更新会让边界逐步贴合训练样本</h1>
        </div>
        <div class="tw-readouts" aria-label="当前训练读数">
          <div class="tw-readout"><span class="tag">参数更新</span><div class="big sm"><span class="num" data-step>0</span><span class="unit"> / 600</span></div></div>
          <div class="tw-readout tw-loss"><span class="tag">平均训练损失</span><div class="big sm"><span class="num" data-loss>0.00</span></div></div>
        </div>
      </header>

      <div class="tw-main min0">
        <div class="tw-field-wrap cvbox min0" role="img" aria-label="坐标范围负 1.3 到 1.3。画面显示 160 个训练样本和网络当前的预测热力场；每次更新后两者与损失记录保持同一步。">
          <canvas class="tw-field cv-fill" data-field></canvas>
          <span class="tw-y">y</span><span class="tw-x">x</span>
          <div class="tw-field-note" aria-hidden="true">
            <span><i class="tw-swatch"></i>目标 0</span>
            <span><i class="tw-swatch one"></i>目标 1</span>
            <b>背景：预测 0%–100%</b>
          </div>
        </div>

        <aside class="tw-side min0">
          <div class="panel tw-controls">
            <div class="btns" aria-label="训练控制">
              <button class="btn" type="button" data-run aria-pressed="false">开始</button>
              <button class="btn" type="button" data-once>单步 1 批</button>
              <button class="btn" type="button" data-reset>从头复位</button>
            </div>
            <div class="tw-fixed" aria-label="固定实验设置">
              <div><span class="tag">随机数</span><strong>seed 1</strong></div>
              <div><span class="tag">网络</span><strong>2→10→10→1</strong></div>
              <div><span class="tag">小批量</span><strong>16</strong></div>
              <div><span class="tag">学习率</span><strong>0.3</strong></div>
              <div><span class="tag">训练样本</span><strong>160 / 200</strong></div>
              <div><span class="tag">决策场</span><strong>80×80</strong></div>
            </div>
            <div class="tw-status" data-status aria-live="polite"><strong>已暂停。</strong> 单步观察同一次更新怎样同时改变边界和损失点。</div>
          </div>
          <div class="k-process tw-process" aria-label="每次训练更新的过程">
            <div class="step active">取一批样本</div>
            <div class="step">更新参数</div>
            <div class="step">重画边界</div>
            <div class="step">记录损失</div>
          </div>
        </aside>
      </div>

      <div class="tw-bottom min0">
        <div class="tw-chart-block min0">
          <div class="tw-chart-title"><span>160 个训练样本的平均二元交叉熵</span><strong>当前位置附近的训练记录</strong></div>
          <div class="tw-chart" data-chart role="img" aria-label="平均训练损失随参数更新次数变化的折线图"></div>
        </div>
        <div class="tw-copy">
          <p class="lead">每批样本都会推动参数一点；重复之后，训练损失总体下降，边界也随之改变。</p>
          <p class="tw-next">训练集上贴合了，就算真的学会了吗？</p>
        </div>
      </div>
    </section>
  </div>

  <script src="assets/lib/mlp.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
  (() => {
    const root = document.getElementById('train-widget');
    if (!root || !window.MLP || !window.echarts) return;

    const q = s => root.querySelector(s);
    const canvas = q('[data-field]');
    const stepEl = q('[data-step]');
    const lossEl = q('[data-loss]');
    const runBtn = q('[data-run]');
    const onceBtn = q('[data-once]');
    const resetBtn = q('[data-reset]');
    const statusEl = q('[data-status]');
    const processEls = Array.from(root.querySelectorAll('.tw-process .step'));
    const chartEl = q('[data-chart]');
    const chart = echarts.init(chartEl, null, { renderer:'svg' });
    const LIMIT = 600, GRID = 80, TRAIN_N = 160;
    let destroyed = false, stopLoop = null, reducedTimer = 0, chartResizeOff = null;
    let ctx = null, cw = 1, ch = 1;

    function mulberry32(seed){
      return function(){
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    function makeSamples(){
      const rng = mulberry32(1), out = [];
      for(let i=0;i<200;i++){
        const x = rng()*2.2-1.1, y = rng()*2.2-1.1;
        out.push({x:[x,y], t:x*y<0?1:0});
      }
      return out;
    }
    function initialState(){
      const samples = makeSamples();
      const net = MLP.create({sizes:[2,10,10,1],act:'tanh',lr:0.3,seed:1});
      const train = samples.slice(0,TRAIN_N);
      const loss = net.evaluate(train).loss;
      const field = net.field(-1.3,-1.3,1.3,1.3,GRID,GRID);
      return {samples,train,net,step:0,running:false,losses:[loss],field,fromField:field,fieldAt:performance.now(),phase:0};
    }
    let state = initialState();

    function lossColor(){ return Deck.token('--loss') || '#B9482A'; }
    function fontSans(){ return Deck.token('--font-sans') || 'sans-serif'; }
    function setChart(){
      chart.setOption({
        animation:false,
        textStyle:{fontFamily:fontSans(),fontSize:16,color:Deck.token('--text')},
        grid:{left:52,right:18,top:12,bottom:34},
        xAxis:{type:'value',min:0,max:LIMIT,interval:100,axisLine:{lineStyle:{color:Deck.token('--rule-strong')}},axisTick:{lineStyle:{color:Deck.token('--rule')}},splitLine:{show:false},axisLabel:{fontFamily:Deck.token('--font-num'),fontSize:12,color:Deck.token('--muted')}},
        yAxis:{type:'value',min:0,max:1,interval:.25,axisLine:{show:true,lineStyle:{color:Deck.token('--rule-strong')}},axisTick:{show:false},splitLine:{lineStyle:{color:Deck.rgba('--rule',.55)}},axisLabel:{fontFamily:Deck.token('--font-num'),fontSize:12,color:Deck.token('--muted'),formatter:v=>v.toFixed(2)}},
        tooltip:{trigger:'axis',textStyle:{fontSize:16},formatter:p=>`更新 ${p[0].value[0]}<br>平均训练损失 ${p[0].value[1].toFixed(3)}`},
        series:[{type:'line',symbol:'none',data:state.losses.map((v,i)=>[i,v]),lineStyle:{width:3,color:lossColor()},itemStyle:{color:lossColor()},markPoint:{symbol:'circle',symbolSize:10,label:{show:false},data:[{coord:[state.step,state.losses[state.losses.length-1]],itemStyle:{color:lossColor()}}]}}]
      },true);
    }

    function draw(now=performance.now()){
      if(!ctx) return;
      ctx.clearRect(0,0,cw,ch);
      const pad={l:48,r:24,t:20,b:38}, w=cw-pad.l-pad.r, h=ch-pad.t-pad.b;
      const progress = Deck.reduced()?1:Math.min(1,(now-state.fieldAt)/120);
      const oldF=state.fromField, newF=state.field;
      const paper=Deck.rgb('--paper'), blue=Deck.rgb('--prediction');
      const cellW=w/GRID, cellH=h/GRID;
      for(let gy=0;gy<GRID;gy++) for(let gx=0;gx<GRID;gx++){
        const i=gy*GRID+gx, p=oldF[i]+(newF[i]-oldF[i])*progress;
        const mix=.08+.68*p;
        const r=Math.round(paper[0]*(1-mix)+blue[0]*mix), g=Math.round(paper[1]*(1-mix)+blue[1]*mix), b=Math.round(paper[2]*(1-mix)+blue[2]*mix);
        ctx.fillStyle=`rgb(${r},${g},${b})`;
        ctx.fillRect(pad.l+gx*cellW,pad.t+(GRID-1-gy)*cellH,cellW+1,cellH+1);
      }
      ctx.strokeStyle=Deck.token('--rule-strong');ctx.lineWidth=1;
      ctx.strokeRect(pad.l+.5,pad.t+.5,w-1,h-1);
      ctx.setLineDash([5,5]);ctx.lineWidth=2;ctx.strokeStyle=Deck.rgba('--text',.7);
      ctx.beginPath();
      for(let gy=0;gy<GRID;gy++) for(let gx=0;gx<GRID-1;gx++){
        const a=newF[gy*GRID+gx]-.5,b=newF[gy*GRID+gx+1]-.5;
        if(a===0 || a*b<0){const x=pad.l+(gx+.5)*cellW,y=pad.t+(GRID-gy-.5)*cellH;ctx.moveTo(x-1,y);ctx.lineTo(x+1,y);}
      }
      ctx.stroke();ctx.setLineDash([]);
      const sx=x=>pad.l+(x+1.3)/2.6*w, sy=y=>pad.t+(1.3-y)/2.6*h;
      for(const d of state.train){
        ctx.beginPath();ctx.arc(sx(d.x[0]),sy(d.x[1]),4.3,0,Math.PI*2);
        ctx.fillStyle=d.t?Deck.token('--target'):Deck.token('--text');ctx.fill();
        ctx.strokeStyle=Deck.token('--paper');ctx.lineWidth=1.2;ctx.stroke();
      }
      ctx.fillStyle=Deck.token('--muted');ctx.font=`12px ${Deck.token('--font-num')}`;ctx.textAlign='center';ctx.textBaseline='top';
      [-1.3,0,1.3].forEach(v=>ctx.fillText(v.toFixed(1),sx(v),pad.t+h+8));
      ctx.textAlign='right';ctx.textBaseline='middle';[-1.3,0,1.3].forEach(v=>ctx.fillText(v.toFixed(1),pad.l-9,sy(v)));
      if(progress<1 && state.running) requestAnimationFrame(draw);
    }
    const stopFit = Deck.autofit(canvas,(next,w,h)=>{ctx=next;cw=w;ch=h;draw();});

    function save(){
      try{
        localStorage.setItem('notale:p17-training',JSON.stringify({seed:1,step:state.step,samples:state.samples,losses:state.losses,layers:state.net.layers,network:[2,10,10,1],lr:.3,batch:16}));
      }catch(_e){}
    }
    function updateProcess(){
      processEls.forEach((el,i)=>el.classList.toggle('active',i===state.phase));
    }
    function render(announce=false){
      stepEl.textContent=String(state.step);
      lossEl.textContent=state.losses[state.losses.length-1].toFixed(3);
      runBtn.textContent=state.running?'暂停':'开始';
      runBtn.setAttribute('aria-pressed',String(state.running));
      runBtn.classList.toggle('on',state.running);
      onceBtn.disabled=state.step>=LIMIT;
      if(state.step>=LIMIT) statusEl.innerHTML='<strong>已到 600 次更新。</strong> 边界和损失记录停在同一步。';
      else if(state.running) statusEl.innerHTML='<strong>训练中。</strong> 当前边界、参数和损失点共用同一次更新。';
      else if(state.step===0) statusEl.innerHTML='<strong>已暂停。</strong> 单步观察同一次更新怎样同时改变边界和损失点。';
      else statusEl.innerHTML=`<strong>停在更新 ${state.step}。</strong> 三区都不会继续变化。`;
      updateProcess();setChart();draw();
      if(announce) statusEl.setAttribute('aria-label',`更新 ${state.step}，平均训练损失 ${state.losses[state.losses.length-1].toFixed(3)}，${state.running?'训练中':'已暂停'}`);
      save();
    }
    function advance(){
      if(destroyed || state.step>=LIMIT){pause(false);return;}
      const oldDisplayed=state.field;
      state.phase=0; updateProcess();
      state.net.step(state.train,16); state.phase=1;
      state.step++;
      const evalNow=state.net.evaluate(state.train);
      const nextField=state.net.field(-1.3,-1.3,1.3,1.3,GRID,GRID);
      state.fromField=oldDisplayed;state.field=nextField;state.fieldAt=performance.now();state.phase=2;
      state.losses.push(evalNow.loss);state.phase=3;
      root.querySelector('.tw-chart-block').setAttribute('data-anim','trace');
      requestAnimationFrame(()=>root.querySelector('.tw-chart-block').removeAttribute('data-anim'));
      render(false);
      if(state.step>=LIMIT) pause(true);
    }
    function start(){
      if(state.running || state.step>=LIMIT) return;
      state.running=true;render(true);
      if(Deck.reduced()){
        reducedTimer=window.setInterval(()=>advance(),120);
      }else{
        stopLoop=Deck.loop(()=>{if(state.running) advance();},{still:1});
      }
    }
    function pause(announce=true){
      if(stopLoop){stopLoop();stopLoop=null;}
      if(reducedTimer){clearInterval(reducedTimer);reducedTimer=0;}
      const changed=state.running;state.running=false;
      if(changed || announce) render(announce);
    }
    function reset(){
      pause(false);state=initialState();render(true);
    }
    function onRun(){state.running?pause(true):start();}
    function onOnce(){pause(false);advance();render(true);}
    function onVisibility(){if(document.hidden) pause(false);}
    function onPageHide(){pause(false);save();}

    runBtn.addEventListener('click',onRun);
    onceBtn.addEventListener('click',onOnce);
    resetBtn.addEventListener('click',reset);
    document.addEventListener('visibilitychange',onVisibility);
    window.addEventListener('pagehide',onPageHide);
    chartResizeOff=Deck.onResize(()=>chart.resize());
    render(false);

    root.destroyTrainWidget=()=>{
      if(destroyed)return;destroyed=true;pause(false);
      runBtn.removeEventListener('click',onRun);onceBtn.removeEventListener('click',onOnce);resetBtn.removeEventListener('click',reset);
      document.removeEventListener('visibilitychange',onVisibility);window.removeEventListener('pagehide',onPageHide);
      if(stopFit)stopFit();if(chartResizeOff)chartResizeOff();chart.dispose();delete root.destroyTrainWidget;
    };
    Deck.init({index:17,total:20});
  })();
  </script>
</body>
</html>
