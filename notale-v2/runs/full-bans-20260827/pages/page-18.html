<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>未见样本才检验边界能否迁移</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{display:flex;flex-direction:column;padding:var(--pad-y) var(--pad-x);gap:8px;overflow:hidden}
  .p18-head{flex:0 0 104px;display:flex;flex-direction:column;justify-content:flex-start;gap:8px}
  .p18-head .kicker{margin:0;color:var(--muted);font-size:var(--fs-label);font-weight:700;letter-spacing:.14em}
  .p18-head h1{margin:0;font:700 var(--fs-h1)/1.08 var(--font-sans);color:var(--text)}
  .unseen-widget{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;color:var(--text)}
  .unseen-widget .uw-toolbar{height:48px;display:flex;align-items:center;gap:16px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .unseen-widget .uw-invariant{font-size:var(--fs-sec);color:var(--muted);flex:1;min-width:0}
  .unseen-widget .uw-freeze{display:flex;align-items:center;gap:8px;font-size:var(--fs-label);font-weight:700;color:var(--text);white-space:nowrap}
  .unseen-widget .uw-lock{width:14px;height:12px;border:2px solid var(--rule-strong);border-radius:2px;position:relative}
  .unseen-widget .uw-lock:before{content:"";position:absolute;width:8px;height:7px;border:2px solid var(--rule-strong);border-bottom:0;border-radius:7px 7px 0 0;left:1px;top:-8px}
  .unseen-widget .uw-main{flex:1 1 420px;min-height:390px;display:grid;grid-template-columns:1fr 1fr;gap:40px}
  .unseen-widget .uw-col{min-width:0;min-height:420px;height:100%;display:grid;grid-template-rows:40px minmax(290px,1fr) 88px;gap:8px}
  .unseen-widget .uw-colhead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--rule-strong)}
  .unseen-widget .uw-colhead h2{margin:0;font:700 28px/1.2 var(--font-sans)}
  .unseen-widget .uw-role{font-size:var(--fs-label);color:var(--muted)}
  .unseen-widget .uw-plane-wrap{position:relative;min-height:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--paper)}
  .unseen-widget canvas{display:block;width:100%;height:100%}
  .unseen-widget .uw-cover{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;z-index:3;transition:opacity 180ms linear}
  .unseen-widget .uw-cover>*{transition:transform 180ms ease}
  .unseen-widget .uw-cover[aria-hidden="true"]{opacity:0;pointer-events:none}
  .unseen-widget .uw-cover[aria-hidden="true"]>*{transform:translateX(24px)}
  .unseen-widget .uw-cover-mark{width:56px;height:56px;border:2px dashed var(--rule-strong);border-radius:50%;display:grid;place-items:center;font:700 20px var(--font-num);color:var(--muted)}
  .unseen-widget .uw-cover strong{font-size:var(--fs-lead);font-weight:700}
  .unseen-widget .uw-cover p{margin:0;font-size:var(--fs-sec);color:var(--muted)}
  .unseen-widget .uw-stats{display:grid;grid-template-columns:132px 1fr 1fr;align-items:stretch;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .unseen-widget .uw-stat{display:flex;flex-direction:column;justify-content:center;gap:5px;padding:8px 16px;border-left:1px solid var(--rule)}
  .unseen-widget .uw-stat:first-child{border-left:0;padding-left:0}
  .unseen-widget .uw-stat .tag{font-size:var(--fs-label);color:var(--muted)}
  .unseen-widget .uw-stat .num{font:700 24px/1 var(--font-num);color:var(--text)}
  .unseen-widget .uw-stat.loss .num{color:var(--loss)}
  .unseen-widget .uw-hidden-value{color:var(--muted)!important}
  .unseen-widget .uw-actions{height:48px;display:flex;align-items:center;justify-content:center;gap:16px}
  .unseen-widget .btn{min-width:190px}
  .unseen-widget .uw-action-note{font-size:var(--fs-label);color:var(--muted)}
  .p18-foot{flex:0 0 76px;display:grid;grid-template-columns:1fr auto;gap:40px;align-items:start;border-top:2px solid var(--rule-strong);padding-top:8px}
  .p18-foot .lead{margin:0;max-width:1080px;font-size:var(--fs-lead);line-height:1.35}
  .p18-foot .next{margin:4px 0 0;font-size:var(--fs-sec);color:var(--muted);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){.unseen-widget .uw-cover{transition:none}}
</style>
</head>
<body data-page="18" data-total="20">
<div id="stage">
  <header class="p18-head">
    <p class="kicker">UNSEEN CHECK</p>
    <h1>未见样本才检验边界能否迁移</h1>
  </header>

  <section class="unseen-widget min0" data-unseen-widget aria-label="同一模型的训练样本与未见样本检验">
    <div class="uw-toolbar">
      <div class="uw-invariant">同一模型快照 · 同一坐标范围 · 同一 80×80 决策场 · 同一指标定义</div>
      <div class="uw-freeze"><span class="uw-lock" aria-hidden="true"></span><span>参数已冻结</span></div>
    </div>

    <div class="uw-main k-comparison min0">
      <section class="uw-col min0" aria-labelledby="train-title">
        <div class="uw-colhead"><h2 id="train-title">训练样本</h2><span class="uw-role">参与过参数更新</span></div>
        <div class="uw-plane-wrap sample-plane min0">
          <canvas class="cv-fill" data-train-canvas role="img" aria-label="160 个训练样本叠加在模型决策场上"></canvas>
        </div>
        <div class="uw-stats" aria-label="训练样本指标">
          <div class="uw-stat"><span class="tag">样本数量</span><span class="num">160</span></div>
          <div class="uw-stat loss"><span class="tag">平均损失</span><span class="num" data-train-loss>—</span></div>
          <div class="uw-stat"><span class="tag">正确率</span><span class="num" data-train-acc>—</span></div>
        </div>
      </section>

      <section class="uw-col min0" aria-labelledby="unseen-title">
        <div class="uw-colhead"><h2 id="unseen-title">未见样本</h2><span class="uw-role">从未参与参数更新</span></div>
        <div class="uw-plane-wrap sample-plane min0">
          <canvas class="cv-fill" data-unseen-canvas role="img" aria-label="同一模型决策场，未见样本尚未显示"></canvas>
          <div class="uw-cover" data-cover aria-hidden="false">
            <div class="uw-cover-mark" aria-hidden="true">40</div>
            <strong>尚未翻面</strong>
            <p>40 个未见样本从未参与更新</p>
          </div>
        </div>
        <div class="uw-stats" aria-label="未见样本指标">
          <div class="uw-stat"><span class="tag">样本数量</span><span class="num">40</span></div>
          <div class="uw-stat loss"><span class="tag">平均损失</span><span class="num uw-hidden-value" data-unseen-loss>—</span></div>
          <div class="uw-stat"><span class="tag">正确率</span><span class="num uw-hidden-value" data-unseen-acc>—</span></div>
        </div>
      </section>
    </div>

    <div class="uw-actions">
      <button class="btn" type="button" data-toggle aria-pressed="false">翻到未见样本</button>
      <span class="uw-action-note" data-status aria-live="polite">只更换检验数据，不改变模型</span>
    </div>
  </section>

  <footer class="p18-foot">
    <p class="lead">训练误差低只说明记分册上的题做得好；同一边界面对未见样本仍有效，才提供了迁移证据。</p>
    <p class="next">换成更大的网络，我们还能用哪四步追踪它？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  const root = document.querySelector('[data-unseen-widget]');
  if (!root) return;

  const trainCanvas = root.querySelector('[data-train-canvas]');
  const unseenCanvas = root.querySelector('[data-unseen-canvas]');
  const cover = root.querySelector('[data-cover]');
  const toggle = root.querySelector('[data-toggle]');
  const status = root.querySelector('[data-status]');
  const trainLoss = root.querySelector('[data-train-loss]');
  const trainAcc = root.querySelector('[data-train-acc]');
  const unseenLoss = root.querySelector('[data-unseen-loss]');
  const unseenAcc = root.querySelector('[data-unseen-acc]');
  let state = { revealed:false };
  let destroyed = false;
  let revealTimer = 0;

  function rng(seed){
    return function(){
      let t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function normal(random){
    const u = Math.max(1e-9, random());
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * random());
  }
  function makeData(){
    const random = rng(1);
    const pts = [];
    for(let i=0;i<200;i++){
      const cls = i % 2;
      const quadrant = Math.floor(i / 2) % 2;
      const sx = quadrant ? 1 : -1;
      const sy = cls ? sx : -sx;
      pts.push({x:Math.max(-1,Math.min(1,sx*.53 + normal(random)*.22)),y:Math.max(-1,Math.min(1,sy*.53 + normal(random)*.22)),t:cls,i});
    }
    return pts;
  }

  const fallback = {
    updates:600,
    w1:[[4.7,4.4],[-4.5,-4.8],[4.4,-4.7],[-4.6,4.5]],
    b1:[-2.0,-2.0,-2.0,-2.0],
    w2:[5.2,5.1,-5.0,-5.1],
    b2:-4.6
  };
  function validCheckpoint(v){
    return v && Array.isArray(v.w1) && v.w1.length===4 && Array.isArray(v.w2) && v.w2.length===4 && Array.isArray(v.b1) && v.b1.length===4;
  }
  function loadCheckpoint(){
    const preferred = ['notale:p17:checkpoint','p17-checkpoint','page-17-checkpoint'];
    for(const key of preferred){
      try{const value=JSON.parse(localStorage.getItem(key));if(validCheckpoint(value)) return value;}catch(_e){}
    }
    return fallback;
  }
  const model = loadCheckpoint();
  const data = makeData();
  const train = data.slice(0,160);
  const unseen = data.slice(160,200);
  const sigmoid = z => 1/(1+Math.exp(-z));
  function predict(x,y){
    const h = model.w1.map((w,i)=>sigmoid(w[0]*x+w[1]*y+model.b1[i]));
    return sigmoid(h.reduce((sum,v,i)=>sum+v*model.w2[i],model.b2));
  }
  function metrics(items){
    let loss=0,correct=0;
    for(const d of items){
      const p=Math.max(1e-7,Math.min(1-1e-7,predict(d.x,d.y)));
      loss += -(d.t*Math.log(p)+(1-d.t)*Math.log(1-p));
      correct += (p>=.5?1:0)===d.t ? 1:0;
    }
    return {loss:loss/items.length,acc:correct/items.length};
  }
  const trainMetrics = metrics(train);
  let unseenMetrics = null;

  function color(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function drawPlane(ctx,w,h,items,showPoints){
    const paper=color('--paper'), rule=color('--rule'), pred=color('--prediction'), target=color('--target'), text=color('--text');
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle=paper;ctx.fillRect(0,0,w,h);
    const size=80, cw=w/size, ch=h/size;
    for(let gy=0;gy<size;gy++) for(let gx=0;gx<size;gx++){
      const x=(gx+.5)/size*2-1, y=1-(gy+.5)/size*2;
      const p=predict(x,y);
      ctx.fillStyle = p>=.5 ? `rgba(23,105,166,${.055+.12*(p-.5)*2})` : `rgba(139,47,114,${.045+.09*(.5-p)*2})`;
      ctx.fillRect(gx*cw,gy*ch,Math.ceil(cw)+.2,Math.ceil(ch)+.2);
    }
    ctx.strokeStyle=rule;ctx.lineWidth=1;
    for(let i=1;i<4;i++){
      ctx.beginPath();ctx.moveTo(w*i/4,0);ctx.lineTo(w*i/4,h);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,h*i/4);ctx.lineTo(w,h*i/4);ctx.stroke();
    }
    ctx.strokeStyle=text;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
    if(!showPoints) return;
    for(const d of items){
      const px=(d.x+1)*.5*w, py=(1-d.y)*.5*h;
      ctx.beginPath();ctx.arc(px,py,5.2,0,Math.PI*2);
      ctx.strokeStyle=d.t?pred:target;
      ctx.fillStyle=d.t?pred:target;
      ctx.lineWidth=2;
      if(items===unseen){ctx.setLineDash([3,2]);ctx.fillStyle=paper;ctx.fill();ctx.stroke();ctx.setLineDash([]);}else{ctx.fill();ctx.strokeStyle=paper;ctx.lineWidth=1;ctx.stroke();}
    }
  }
  function render(){
    if(destroyed) return;
    cover.setAttribute('aria-hidden',String(state.revealed));
    toggle.setAttribute('aria-pressed',String(state.revealed));
    toggle.textContent=state.revealed?'收起未见样本':'翻到未见样本';
    trainLoss.textContent=trainMetrics.loss.toFixed(2);
    trainAcc.textContent=Math.round(trainMetrics.acc*100)+'%';
    if(state.revealed){
      unseenMetrics = unseenMetrics || metrics(unseen);
      unseenLoss.textContent=unseenMetrics.loss.toFixed(2);
      unseenAcc.textContent=Math.round(unseenMetrics.acc*100)+'%';
      unseenLoss.classList.remove('uw-hidden-value');
      unseenAcc.classList.remove('uw-hidden-value');
    }else{
      unseenLoss.textContent='—';unseenAcc.textContent='—';
      unseenLoss.classList.add('uw-hidden-value');unseenAcc.classList.add('uw-hidden-value');
    }
    if(!status.textContent) status.textContent='只更换检验数据，不改变模型';
  }
  function redraw(){
    drawPlane(trainCtx,trainCanvas.offsetWidth,trainCanvas.offsetHeight,train,true);
    drawPlane(unseenCtx,unseenCanvas.offsetWidth,unseenCanvas.offsetHeight,unseen,state.revealed);
  }
  function dispatch(revealed){
    if(destroyed) return;
    window.clearTimeout(revealTimer);
    state={revealed};
    render();
    redraw();
    status.textContent = revealed ? `已显示 40 个未见样本，平均损失 ${unseenMetrics.loss.toFixed(2)}，正确率 ${Math.round(unseenMetrics.acc*100)}%，参数未改变。` : '未见样本已收起，模型和训练样本保持不变。';
  }

  let trainCtx=trainCanvas.getContext('2d'), unseenCtx=unseenCanvas.getContext('2d');
  const trainFit=Deck.autofit(trainCanvas,()=>{trainCtx=trainCanvas.getContext('2d');drawPlane(trainCtx,trainCanvas.offsetWidth,trainCanvas.offsetHeight,train,true);});
  const unseenFit=Deck.autofit(unseenCanvas,()=>{unseenCtx=unseenCanvas.getContext('2d');drawPlane(unseenCtx,unseenCanvas.offsetWidth,unseenCanvas.offsetHeight,unseen,state.revealed);});
  function onToggle(){dispatch(!state.revealed);}
  toggle.addEventListener('click',onToggle);
  render();
  Deck.init({index:18,total:20});

  root.destroyUnseenWidget=()=>{
    if(destroyed)return;
    destroyed=true;
    window.clearTimeout(revealTimer);
    toggle.removeEventListener('click',onToggle);
    if(typeof trainFit==='function')trainFit(); else if(trainFit&&trainFit.stop)trainFit.stop();
    if(typeof unseenFit==='function')unseenFit(); else if(unseenFit&&unseenFit.stop)unseenFit.stop();
    delete root.destroyUnseenWidget;
  };
})();
</script>
</body>
</html>
