<body data-page="01" data-total="22">
<div id="stage">
  <style>
    .page01{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      width:100%;
    }
    .page01-head{
      width:1120px;
      flex:0 0 108px;
      text-align:center;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      align-items:center;
    }
    .page01 .kicker{
      margin:0 0 13px;
      color:var(--muted);
      font-size:var(--fs-label);
      font-weight:700;
      letter-spacing:.14em;
    }
    .page01 h1{
      margin:0;
      color:var(--text);
      font-size:var(--fs-h1);
      line-height:1.22;
      font-weight:760;
      letter-spacing:.015em;
    }
    .page01-main{
      flex:1;
      min-height:0;
      width:1120px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    .page01 .k-generalization{
      flex:1;
      min-height:0;
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      background:rgba(255,255,255,.34);
      border:1px solid var(--line);
      border-radius:12px;
      padding:28px 38px 22px;
      position:relative;
      overflow:visible;
      box-sizing:border-box;
    }
    .page01 .ledger-field{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      color:var(--line);
      pointer-events:none;
    }
    .page01 .claim,
    .page01 .trunk,
    .page01 .supports,
    .page01 .conclusion{
      z-index:1;
    }
    .page01 .claim{
      flex:0 0 58px;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      width:100%;
    }
    .page01 .claim-mark{
      width:11px;
      height:11px;
      margin-top:3px;
      background:var(--text);
      transform:rotate(45deg);
    }
    .page01 .k-generalization .trunk{
      position:relative;
      flex:0 0 150px;
      width:100%;
      border:0 !important;
      background:none !important;
      box-shadow:none !important;
    }
    .page01 .k-generalization .trunk::before{
      content:"";
      position:absolute;
      left:50%;
      right:auto !important;
      top:0;
      bottom:0;
      width:1px;
      background:var(--line);
    }
    .page01 .k-generalization .trunk::after{
      content:"";
      position:absolute;
      left:calc(50% - 5px);
      right:auto !important;
      bottom:-1px;
      width:11px;
      height:11px;
      border-right:1px solid var(--line);
      border-bottom:1px solid var(--line);
      transform:rotate(45deg);
      background:#fbfaf6;
    }
    .page01 .supports{
      position:relative;
      width:940px;
      flex:0 0 202px;
      display:flex;
      flex-direction:row !important;
      align-items:flex-start;
      justify-content:space-between;
      padding-top:22px;
    }
    .page01 .supports::before{
      content:"";
      position:absolute;
      left:50px;
      right:50px;
      top:0;
      height:1px;
      background:var(--line);
    }
    .page01 .support{
      position:relative;
      flex:0 0 174px !important;
      width:174px;
      height:158px;
      min-height:0 !important;
      border:1px solid var(--line);
      border-radius:6px 6px 14px 6px;
      background:rgba(255,255,255,.18);
    }
    .page01 .support::before{
      content:"";
      position:absolute;
      left:50%;
      top:-22px;
      width:1px;
      height:22px;
      background:var(--line);
    }
    .page01 .support::after{
      content:"";
      position:absolute;
      right:-1px;
      bottom:-1px;
      width:31px;
      height:31px;
      border-left:1px solid var(--line);
      border-top:1px solid var(--line);
      background:#fbfaf6;
      clip-path:polygon(100% 0,100% 100%,0 100%);
    }
    .page01 .rule{
      position:absolute;
      left:24px;
      color:var(--line);
      font-size:var(--fs-label);
      line-height:1;
      font-style:normal;
      letter-spacing:.06em;
      opacity:.82;
    }
    .page01 .rule-a{top:28px}
    .page01 .rule-b{top:61px}
    .page01 .rule-c{top:94px}
    .page01 .rule-d{top:127px}
    .page01 .conclusion{
      margin:8px 0 0;
      max-width:900px;
      color:var(--text);
      font-size:var(--fs-h2);
      line-height:1.45;
      text-align:center;
    }
    .page01 .next{
      flex:0 0 92px;
      width:100%;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding-bottom:4px;
      color:var(--muted);
      font-size:var(--fs-lead);
      line-height:1.4;
    }
    .page01 .next span{
      display:inline-flex;
      align-items:center;
      gap:14px;
    }
    .page01 .next span::before{
      content:"";
      width:42px;
      height:1px;
      background:var(--line);
    }
  </style>

  <section class="page01 focus min0" aria-labelledby="page-title">

          <div class="support" aria-hidden="true"><i class="rule rule-a">━━━━</i><i class="rule rule-b">━━━━━━</i><i class="rule rule-c">━━━━━</i><i class="rule rule-d">━━━</i></div>

          <div class="support" aria-hidden="true"><i class="rule rule-a">━━━━</i><i class="rule rule-b">━━━━━━</i><i class="rule rule-c">━━━━━</i><i class="rule rule-d">━━━</i></div>
          <div class="support" aria-hidden="true"><i class="rule rule-a">━━━━</i><i class="rule rule-b">━━━━━━</i><i class="rule rule-c">━━━━━</i><i class="rule rule-d">━━━</i></div>
