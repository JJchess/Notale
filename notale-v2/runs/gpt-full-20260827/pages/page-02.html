<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>答对不等于学会：哪台机器会因错误而改变？</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:14px;}
.page-head{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;}
.page-head .kicker{margin:0;color:var(--accent);font-size:var(--fs-label);font-weight:700;letter-spacing:.08em;}
.page-head h1{margin:0;color:var(--text);font-size:var(--fs-h1);line-height:1.18;font-weight:750;}
.behavior-widget{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;color:var(--text);}
.behavior-widget .comparison{display:grid;grid-template-columns:minmax(0,1fr) 176px minmax(0,1fr);grid-template-rows:56px repeat(4,78px);column-gap:18px;min-height:0;}
.behavior-widget .machine{grid-row:1/6;display:grid;grid-template-rows:56px repeat(4,78px);padding:0;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.38);color:var(--text);font:inherit;text-align:left;overflow:hidden;cursor:pointer;position:relative;transition:border-color 140ms ease,box-shadow 140ms ease;}
.behavior-widget .machine-a{grid-column:1;}
.behavior-widget .machine-b{grid-column:3;}
.behavior-widget .machine:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));}
.behavior-widget .machine:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
.behavior-widget .machine.selected-a{border-color:var(--error);box-shadow:0 0 0 2px color-mix(in srgb,var(--error) 18%,transparent);}
.behavior-widget .machine.selected-b{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent);}
.behavior-widget .machine-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);font-size:var(--fs-h2);font-weight:720;}
.behavior-widget .status-mark{font-size:var(--fs-label);font-weight:650;color:var(--muted);padding:4px 9px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;}
.behavior-widget .record{display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center;gap:14px;padding:9px 18px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);font-size:var(--fs-sec);line-height:1.35;position:relative;}
.behavior-widget .record:last-child{border-bottom:0;}
.behavior-widget .record p{margin:0;}
.behavior-widget .row-labels{grid-column:2;grid-row:1/6;display:grid;grid-template-rows:56px repeat(4,78px);align-items:stretch;color:var(--muted);}
.behavior-widget .row-labels .rail-head{display:flex;align-items:center;justify-content:center;font-size:var(--fs-label);font-weight:700;letter-spacing:.06em;}
.behavior-widget .row-label{display:flex;align-items:center;justify-content:center;text-align:center;font-size:var(--fs-label);font-weight:650;position:relative;}
.behavior-widget .row-label:not(:last-child)::after{content:"";position:absolute;bottom:0;left:15px;right:15px;height:1px;background:var(--line);}
.behavior-widget .row-label span{background:var(--bg);padding:3px 8px;position:relative;z-index:1;}
.behavior-widget .icon{width:62px;height:46px;display:flex;align-items:center;justify-content:center;position:relative;color:var(--text);}
.behavior-widget .prediction{border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:var(--fs-label);font-weight:700;}
.behavior-widget .prediction::after{content:"×";color:var(--error);font-size:26px;line-height:1;}
.behavior-widget .book{width:50px;height:38px;border:1px solid var(--line);border-radius:4px;background:var(--bg);position:relative;}
.behavior-widget .book::before{content:"";position:absolute;left:9px;right:9px;top:10px;height:1px;background:var(--muted);box-shadow:0 8px 0 var(--muted),0 16px 0 var(--muted);opacity:.55;}
.behavior-widget .book::after{content:"";position:absolute;left:24px;top:0;bottom:0;border-left:1px solid var(--line);}
.behavior-widget .penalty{width:58px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid var(--error);border-radius:8px;color:var(--error);font-size:var(--fs-label);font-weight:700;background:color-mix(in srgb,var(--error) 7%,var(--bg));}
.behavior-widget .rule-lock{width:54px;height:34px;border:2px dashed var(--line);border-radius:7px;position:relative;}
.behavior-widget .rule-lock::after{content:"不变";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:var(--fs-tick);color:var(--muted);}
.behavior-widget .knob{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:repeating-conic-gradient(from -4deg,var(--line) 0 1deg,transparent 1deg 24deg);display:grid;place-items:center;}
.behavior-widget .knob-face{width:42px;height:42px;border-radius:50%;background:var(--bg);border:2px solid var(--signal);position:relative;transition:transform 320ms ease;}
.behavior-widget .knob-face::after{content:"";position:absolute;width:3px;height:14px;background:var(--signal);left:18px;top:3px;border-radius:2px;}
.behavior-widget .new-card{width:42px;height:50px;border:1px solid var(--text);border-radius:5px;background:var(--bg);transform:rotate(-3deg);}
.behavior-widget .new-card::after{content:"新";display:flex;height:100%;align-items:center;justify-content:center;font-size:var(--fs-label);font-weight:700;}
.behavior-widget .outcome-b{color:var(--error);font-weight:650;transition:color 220ms ease 120ms;}
.behavior-widget .selected-b .outcome-b{color:var(--signal);}
.behavior-widget .selected-b .knob-face{transform:rotate(18deg);}
.behavior-widget .selected-a .rule-row{background:color-mix(in srgb,var(--error) 8%,transparent);}
.behavior-widget .selected-a .rule-lock{border-color:var(--error);}
.behavior-widget .selected-a .rule-lock::after{color:var(--error);}
.behavior-widget .back-arrow{position:absolute;left:24px;top:120px;width:190px;height:135px;pointer-events:none;opacity:0;overflow:visible;}
.behavior-widget .back-arrow path{fill:none;stroke:var(--error);stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#bw-arrowhead);}
.behavior-widget .selected-b .back-arrow{opacity:1;}
.behavior-widget .selected-b .back-arrow path{animation:bw-trace 320ms ease both;}
@keyframes bw-trace{from{stroke-dashoffset:-70;opacity:.2}to{stroke-dashoffset:0;opacity:1}}
.behavior-widget .quiz{flex:1;min-height:132px;display:grid;grid-template-columns:430px minmax(0,1fr) auto;grid-template-rows:auto 58px;align-items:center;gap:8px 22px;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.28);}
.behavior-widget .question{margin:0;font-size:var(--fs-lead);font-weight:720;line-height:1.3;}
.behavior-widget .choices{display:flex;gap:10px;}
.behavior-widget .choice{min-width:142px;min-height:44px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font:650 var(--fs-body) var(--font-sans);cursor:pointer;}
.behavior-widget .choice:hover{border-color:var(--accent);}
.behavior-widget .choice:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
.behavior-widget .choice[aria-pressed="true"][data-choice="a"]{border-color:var(--error);color:var(--error);}
.behavior-widget .choice[aria-pressed="true"][data-choice="b"]{border-color:var(--accent);color:var(--accent);}
.behavior-widget .reset{min-height:42px;white-space:nowrap;}
.behavior-widget .feedback{grid-column:1/4;min-height:48px;display:flex;align-items:center;padding:8px 12px;border-radius:8px;font-size:var(--fs-sec);line-height:1.35;color:var(--muted);background:color-mix(in srgb,var(--line) 15%,transparent);}
.behavior-widget .feedback.bad{color:var(--error);background:color-mix(in srgb,var(--error) 8%,transparent);}
.behavior-widget .feedback.good{color:var(--text);background:color-mix(in srgb,var(--accent) 10%,transparent);}
.behavior-widget .feedback.good strong{color:var(--accent);}
.page-tail{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:center;border-top:1px solid var(--line);padding-top:10px;}
.page-tail p{margin:0;line-height:1.35;}
.page-tail .conclusion{font-size:var(--fs-lead);}
.page-tail .next{font-size:var(--fs-sec);color:var(--muted);white-space:nowrap;}
@media (prefers-reduced-motion:reduce){.behavior-widget *{animation-duration:.001ms!important;transition-duration:.001ms!important;transition-delay:0ms!important;}}
</style>
</head>
<body data-page="02" data-total="22">
<div id="stage">
  <header class="page-head">
    <p class="kicker">先看行为证据</p>
    <h1>答对不等于学会：哪台机器会因错误而改变？</h1>
  </header>

  <main class="behavior-widget min0" data-behavior-widget>
    <section class="comparison k-comparison" aria-label="两台机器的四步行为对照">
      <button class="machine machine-a" type="button" data-machine="a" aria-label="选择机器甲：答案册">
        <span class="machine-head"><span>机器甲 · 答案册</span><span class="status-mark">记住旧答案</span></span>
        <span class="record"><span class="icon prediction" aria-hidden="true"></span><p>猜错了</p></span>
        <span class="record"><span class="icon"><span class="book" aria-hidden="true"></span></span><p>把“这张卡—正确答案”抄进答案册</p></span>
        <span class="record rule-row"><span class="icon"><span class="rule-lock" aria-hidden="true"></span></span><p>预测规则不变；只记住这张旧卡</p></span>
        <span class="record"><span class="icon"><span class="new-card" aria-hidden="true"></span></span><p>答案册没有这张卡，再次照旧猜</p></span>
      </button>

      <div class="row-labels" aria-hidden="true">
        <div class="rail-head">同一时间线</div>
        <div class="row-label"><span>第一次预测</span></div>
        <div class="row-label"><span>收到反馈</span></div>
        <div class="row-label"><span>内部变化</span></div>
        <div class="row-label"><span>同类新卡</span></div>
      </div>

      <button class="machine machine-b" type="button" data-machine="b" aria-label="选择机器乙：调旋钮">
        <span class="machine-head"><span>机器乙 · 调旋钮</span><span class="status-mark">根据错误改参数</span></span>
        <span class="record"><span class="icon prediction" aria-hidden="true"></span><p>猜错了</p></span>
        <span class="record"><span class="icon"><span class="penalty" aria-hidden="true">罚分高</span></span><p>看见罚分很高</p></span>
        <span class="record"><span class="icon"><span class="knob" aria-hidden="true"><span class="knob-face"></span></span></span><p>内部旋钮转动一小格</p></span>
        <span class="record"><span class="icon"><span class="new-card" aria-hidden="true"></span></span><p class="outcome-b">预测更接近答案，罚分降低</p></span>
        <svg class="back-arrow" viewBox="0 0 190 135" aria-hidden="true">
          <defs><marker id="bw-arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M7,4 L1,1 L1,7 Z" fill="none" stroke="var(--error)" stroke-width="1.5"/></marker></defs>
          <path d="M170 18 C145 18 132 45 112 69 C92 92 66 103 34 108"/>
        </svg>
      </button>
    </section>

    <section class="quiz" aria-labelledby="bw-question">
      <p class="question" id="bw-question">哪台机器表现出了这里所说的学习？</p>
      <div class="choices" role="group" aria-label="选择机器">
        <button class="choice" type="button" data-choice="a" aria-pressed="false">机器甲</button>
        <button class="choice" type="button" data-choice="b" aria-pressed="false">机器乙</button>
      </div>
      <button class="btn reset" type="button" data-reset disabled>再判断一次</button>
      <div class="feedback" data-feedback aria-live="polite">先比较“内部变化”和“同类新卡”，再作判断。</div>
    </section>
  </main>

  <footer class="page-tail">
    <p class="conclusion">只有会根据错误修改内部参数的机器，才是在这里所说的“学习”。</p>
    <p class="next">下一问：如果把一次学习拆开，它会依次经过哪四站？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  Deck.init({index:2,total:22});
  const root = document.querySelector('[data-behavior-widget]');
  if (!root) return;
  const machines = [...root.querySelectorAll('[data-machine]')];
  const choices = [...root.querySelectorAll('[data-choice]')];
  const feedback = root.querySelector('[data-feedback]');
  const reset = root.querySelector('[data-reset]');
  let state = { selected: null };
  let destroyed = false;
  let timers = [];

  function cancelActiveWork(){
    timers.forEach(window.clearTimeout);
    timers = [];
  }

  function transition(current, action){
    if(action.type === 'choose' && (action.value === 'a' || action.value === 'b')) return {selected:action.value};
    if(action.type === 'reset') return {selected:null};
    return current;
  }

  function render(){
    machines.forEach(machine => {
      const id = machine.dataset.machine;
      machine.classList.toggle('selected-a', state.selected === 'a' && id === 'a');
      machine.classList.toggle('selected-b', state.selected === 'b' && id === 'b');
      machine.setAttribute('aria-pressed', String(state.selected === id));
    });
    choices.forEach(choice => choice.setAttribute('aria-pressed', String(choice.dataset.choice === state.selected)));
    reset.disabled = state.selected === null;
    feedback.className = 'feedback';
    if(state.selected === 'a'){
      feedback.classList.add('bad');
      feedback.textContent = '还不是：它只保存了旧卡答案，预测规则没有因错误改变。';
    }else if(state.selected === 'b'){
      feedback.classList.add('good');
      feedback.innerHTML = '<strong>是：</strong>它收到错误后改了内部旋钮，并在同类新卡上降低了罚分。';
    }else{
      feedback.textContent = '先比较“内部变化”和“同类新卡”，再作判断。';
    }
  }

  function dispatch(action, announce){
    if(destroyed) return;
    cancelActiveWork();
    state = transition(state, action);
    render();
    if(announce && state.selected === null){
      feedback.textContent = '选择已清除，可以再次判断。';
    }
  }

  function choose(event){ dispatch({type:'choose',value:event.currentTarget.dataset.machine || event.currentTarget.dataset.choice}, true); }
  function doReset(){ dispatch({type:'reset'}, true); }
  machines.forEach(machine => machine.addEventListener('click', choose));
  choices.forEach(choice => choice.addEventListener('click', choose));
  reset.addEventListener('click', doReset);
  render();

  root.destroyBehaviorWidget = () => {
    if(destroyed) return;
    destroyed = true;
    cancelActiveWork();
    machines.forEach(machine => machine.removeEventListener('click', choose));
    choices.forEach(choice => choice.removeEventListener('click', choose));
    reset.removeEventListener('click', doReset);
    delete root.destroyBehaviorWidget;
  };
  window.addEventListener('pagehide', () => root.destroyBehaviorWidget?.(), {once:true});
})();
</script>
</body>
</html>
