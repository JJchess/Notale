<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>“学会”只反复做四个动作</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{display:flex;flex-direction:column;gap:0;overflow:hidden}
  .page-head{height:104px;flex:0 0 104px;display:flex;flex-direction:column;justify-content:flex-start}
  .kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.14em;color:var(--muted);margin:2px 0 12px}
  h1{font:700 var(--fs-h1)/1.16 var(--font-sans);margin:0;color:var(--text);letter-spacing:-.02em}
  .loop-field{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;padding:22px 26px 18px;background:rgba(255,255,255,.22)}
  .loop-label{height:36px;display:flex;align-items:flex-start;gap:12px;color:var(--text);font:700 var(--fs-h2)/1.2 var(--font-sans)}
  .loop-label .mark{width:18px;height:18px;margin-top:3px;border:2px solid var(--text);border-radius:4px;position:relative;flex:none}
  .loop-label .mark:after{content:"";position:absolute;width:7px;height:7px;right:-5px;bottom:-4px;border-right:2px solid var(--text);border-bottom:2px solid var(--text)}
  .stage-cards{flex:1;min-height:0;display:grid!important;grid-template-columns:minmax(0,1fr) 38px minmax(0,1fr) 38px minmax(0,1fr) 38px minmax(0,1fr)!important;align-items:center;gap:0!important}
  .stage-card{height:440px;width:auto;max-width:none;min-width:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:22px 22px 20px;position:relative}
  .stage-card .idx{font:700 var(--fs-label)/1 var(--font-mono);color:var(--muted);letter-spacing:.08em}
  .stage-card h2{font:700 var(--fs-h2)/1.2 var(--font-sans);color:var(--text);margin:10px 0 0}
  .stage-card p{font:400 var(--fs-body)/1.45 var(--font-sans);color:var(--text);margin:8px 0 0}
  .iconbox{flex:1;min-height:0;margin-top:16px;display:flex;align-items:center;justify-content:center;border-top:1px solid color-mix(in srgb,var(--line) 75%,transparent)}
  .iconbox svg{width:100%;height:235px;overflow:visible}
  .flow-arrow{display:flex;align-items:center;justify-content:center;color:var(--line)}
  .flow-arrow svg{width:34px;height:34px;overflow:visible}
  .loop-return{height:94px;flex:0 0 94px;position:relative;margin:0 8px}
  .loop-return svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .loop-note{position:absolute;left:50%;top:42px;transform:translateX(-50%);padding:0 14px;background:var(--bg);font:600 var(--fs-label)/1.3 var(--font-sans);color:var(--text);white-space:nowrap}
  .loop-note span{font-weight:400;color:var(--muted);margin-left:8px}
  .foot{height:112px;flex:0 0 112px;display:flex;align-items:center;justify-content:space-between;gap:44px}
  .conclusion{font:600 var(--fs-lead)/1.42 var(--font-serif);color:var(--text);margin:0;max-width:790px}
  .next{max-width:590px;padding-left:22px;border-left:1px solid var(--line);font:500 var(--fs-sec)/1.45 var(--font-sans);color:var(--muted)}
  .next b{display:block;color:var(--text);font-size:var(--fs-label);letter-spacing:.08em;margin-bottom:4px}
  .sig{stroke:var(--signal)} .err{stroke:var(--error)} .ink{stroke:var(--text)} .mute{stroke:var(--line)}
  .sigfill{fill:var(--signal)} .errfill{fill:var(--error)} .paperfill{fill:var(--bg)} .inkfill{fill:var(--text)}
  svg text{font-family:var(--font-sans);fill:var(--text);font-size:15px}
  svg .smalltxt{font-size:14px;fill:var(--muted)}
</style>
</head>
<body data-page="03" data-total="22">
<div id="stage">
  <header class="page-head">
    <div class="kicker">LEARNING LOOP</div>
    <h1>“学会”只反复做四个动作</h1>
  </header>

  <main class="loop-field k-classification min0" aria-label="一次学习循环包含四个连续动作">
    <div class="loop-label lv"><span class="mark" aria-hidden="true"></span><span>一次学习循环</span></div>

    <div class="stage-cards min0">
      <section class="stage-card box min0" aria-labelledby="s1-title">
        <div class="idx">01</div>
        <h2 id="s1-title">预测</h2>
        <p>先给出一个答案</p>
        <div class="iconbox" aria-hidden="true">
          <svg viewBox="0 0 260 180" role="img">
            <defs><marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="var(--signal)" stroke-width="1.8"/></marker></defs>
            <circle cx="26" cy="90" r="10" class="inkfill"/>
            <path d="M42 90 H91" class="sig" fill="none" stroke-width="3" marker-end="url(#a1)"/>
            <rect x="102" y="55" width="68" height="70" rx="12" class="paperfill" stroke="var(--text)" stroke-width="2"/>
            <circle cx="136" cy="90" r="15" fill="none" class="sig" stroke-width="3"/>
            <path d="M171 90 H198" class="sig" fill="none" stroke-width="3" marker-end="url(#a1)"/>
            <rect x="207" y="67" width="49" height="46" rx="7" fill="none" class="sig" stroke-width="2"/>
            <text x="231.5" y="95" text-anchor="middle" class="sigfill">预测</text>
          </svg>
        </div>
      </section>

      <div class="flow-arrow" aria-hidden="true"><svg viewBox="0 0 34 34"><path d="M3 17 H28 M21 10 L29 17 L21 24" fill="none" class="mute" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

      <section class="stage-card box min0" aria-labelledby="s2-title">
        <div class="idx">02</div>
        <h2 id="s2-title">罚分</h2>
        <p>看这次错了多少</p>
        <div class="iconbox" aria-hidden="true">
          <svg viewBox="0 0 260 180" role="img">
            <text x="18" y="55" class="smalltxt">目标答案</text>
            <text x="18" y="124" class="smalltxt">预测</text>
            <rect x="91" y="30" width="52" height="40" rx="7" fill="none" class="ink" stroke-width="2"/>
            <rect x="91" y="99" width="52" height="40" rx="7" fill="none" class="sig" stroke-width="2"/>
            <path d="M148 50 C176 50 171 84 194 88 M148 119 C176 119 171 94 194 90" fill="none" class="mute" stroke-width="2"/>
            <rect x="196" y="64" width="60" height="52" rx="8" fill="none" class="err" stroke-width="2.5"/>
            <text x="226" y="96" text-anchor="middle" class="errfill">罚分</text>
          </svg>
        </div>
      </section>

      <div class="flow-arrow" aria-hidden="true"><svg viewBox="0 0 34 34"><path d="M3 17 H28 M21 10 L29 17 L21 24" fill="none" class="mute" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

      <section class="stage-card box min0" aria-labelledby="s3-title">
        <div class="idx">03</div>
        <h2 id="s3-title">反向找责任</h2>
        <p>哪些旋钮影响了错误？</p>
        <div class="iconbox" aria-hidden="true">
          <svg viewBox="0 0 260 180" role="img">
            <defs><marker id="a3" markerWidth="9" markerHeight="9" refX="1.5" refY="4.5" orient="auto"><path d="M8,1 L1,4.5 L8,8" fill="var(--bg)" stroke="var(--error)" stroke-width="1.6"/></marker></defs>
            <rect x="188" y="65" width="64" height="50" rx="8" fill="none" class="err" stroke-width="2.5"/>
            <text x="220" y="96" text-anchor="middle" class="errfill">罚分</text>
            <path d="M185 90 H82" fill="none" class="err" stroke-width="2.5" marker-end="url(#a3)"/>
            <g transform="translate(45 42)"><circle r="18" fill="none" class="ink" stroke-width="2"/><path d="M0 -14 V-21 M-12 -8 L-18 -12 M12 -8 L18 -12" class="mute" stroke-width="1.5"/><path d="M0 0 L10 -11" class="ink" stroke-width="2"/><text y="38" text-anchor="middle" class="smalltxt">参数</text></g>
            <g transform="translate(45 91)"><circle r="18" fill="none" class="ink" stroke-width="2"/><path d="M0 -14 V-21 M-12 -8 L-18 -12 M12 -8 L18 -12" class="mute" stroke-width="1.5"/><path d="M0 0 L-8 -12" class="ink" stroke-width="2"/><text y="38" text-anchor="middle" class="smalltxt">参数</text></g>
            <g transform="translate(45 140)"><circle r="18" fill="none" class="ink" stroke-width="2"/><path d="M0 -14 V-21 M-12 -8 L-18 -12 M12 -8 L18 -12" class="mute" stroke-width="1.5"/><path d="M0 0 L12 -7" class="ink" stroke-width="2"/><text y="37" text-anchor="middle" class="smalltxt">参数</text></g>
          </svg>
        </div>
      </section>

      <div class="flow-arrow" aria-hidden="true"><svg viewBox="0 0 34 34"><path d="M3 17 H28 M21 10 L29 17 L21 24" fill="none" class="mute" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

      <section class="stage-card box min0" aria-labelledby="s4-title">
        <div class="idx">04</div>
        <h2 id="s4-title">更新</h2>
        <p>把旋钮小改一点</p>
        <div class="iconbox" aria-hidden="true">
          <svg viewBox="0 0 260 180" role="img">
            <defs><marker id="a4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="var(--accent)" stroke-width="1.8"/></marker></defs>
            <g transform="translate(110 92)">
              <circle r="45" fill="none" class="ink" stroke-width="2.5"/>
              <path d="M0 -43 V-57 M-25 -34 L-33 -45 M25 -34 L33 -45 M-41 -13 L-54 -17 M41 -13 L54 -17" class="mute" fill="none" stroke-width="2"/>
              <circle r="8" class="inkfill"/>
              <path d="M0 0 L24 -29" class="ink" stroke-width="4" stroke-linecap="round"/>
              <path d="M-54 35 A67 67 0 0 0 50 43" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#a4)"/>
            </g>
            <text x="190" y="99" fill="var(--accent)">小改一点</text>
          </svg>
        </div>
      </section>
    </div>

    <div class="loop-return" aria-label="从更新回到预测，再来一次">
      <svg viewBox="0 0 1400 94" preserveAspectRatio="none" aria-hidden="true">
        <defs><marker id="loopA" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="var(--signal)" stroke-width="1.6"/></marker></defs>
        <path d="M1340 8 V54 Q1340 72 1322 72 H78 Q60 72 60 54 V15" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#loopA)"/>
      </svg>
      <div class="loop-note">再来一次 <span>用改过的旋钮重新预测</span></div>
    </div>
  </main>

  <footer class="foot">
    <p class="conclusion">全课只追踪四步：预测、罚分、反向找责任、更新。</p>
    <div class="next"><b>下一问</b>一个神经元拿到两路输入时，先怎样合成一个总分？</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:3,total:22});</script>
</body>
</html>
