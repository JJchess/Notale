<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一个神经元先分别衡量两路输入，再把贡献相加</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:20px}
    .p04-head{height:106px;display:flex;flex-direction:column;justify-content:flex-start;gap:8px}
    .p04-head .kicker{font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.08em;color:var(--accent)}
    .p04-head h1{margin:0;max-width:1180px;font:700 var(--fs-h1)/1.2 var(--font-sans);color:var(--text)}
    .p04-widget{flex:1;min-height:0;display:grid;grid-template-rows:218px minmax(0,1fr);gap:18px}
    .p04-widget .control-zone{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
    .p04-widget .channel-control{display:grid;box-shadow:inset 0 0 0 12px rgba(49,54,59,.035);grid-template-columns:170px 1fr 150px;align-items:center;gap:24px;padding:22px 28px;border:1px solid var(--line);border-radius:16px;background:#DCD6C8}
    .p04-widget .switch-wrap{display:flex;flex-direction:column;gap:9px}
    .p04-widget .switch-label{font:700 var(--fs-body)/1.25 var(--font-sans);color:var(--text)}
    .p04-widget .input-switch{position:relative;width:150px;height:64px;padding:0 14px;border:2px solid var(--line);border-radius:32px;background:transparent;color:var(--muted);font:700 var(--fs-body)/1 var(--font-sans);cursor:pointer;transition:border-color 140ms ease,background 140ms ease,color 140ms ease}
    .p04-widget .input-switch::before{content:"";position:absolute;top:8px;left:9px;width:44px;height:44px;border-radius:50%;background:var(--muted);transition:transform 160ms ease,background 160ms ease}
    .p04-widget .input-switch .state-text{display:block;margin-left:48px;white-space:nowrap}
    .p04-widget .input-switch[aria-pressed="true"]{border-color:var(--signal);color:var(--signal);background:rgba(31,90,122,.08)}
    .p04-widget .input-switch[aria-pressed="true"]::before{transform:translateX(84px);background:var(--signal)}
    .p04-widget .input-switch.just-used{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,119,6,.14)}
    .p04-widget .input-switch:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
    .p04-widget .control-copy{font:400 var(--fs-sec)/1.45 var(--font-sans);color:var(--muted)}
    .p04-widget .control-copy strong{display:block;margin-bottom:6px;font:700 var(--fs-lead)/1.25 var(--font-sans);color:var(--text)}
    .p04-widget .fixed-weight{display:flex;align-items:center;justify-content:flex-end;gap:14px}
    .p04-widget .weight-meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
    .p04-widget .weight-name{font:700 var(--fs-body)/1.2 var(--font-mono);color:var(--text)}
    .p04-widget .fixed-note{font:600 var(--fs-label)/1.2 var(--font-sans);color:var(--muted)}
    .p04-widget .knob{position:relative;width:70px;height:70px;border:2px solid var(--text);border-radius:50%;background:var(--bg);display:grid;place-items:center;font:700 var(--fs-h2)/1 var(--font-mono);color:var(--text)}
    .p04-widget .knob::before{content:"";position:absolute;left:33px;top:-10px;width:3px;height:16px;border-radius:2px;background:var(--text)}
    .p04-widget .process-zone{position:relative;display:grid;grid-template-columns:190px 46px 190px 46px minmax(250px,1fr) 76px 270px;grid-template-rows:1fr 1fr;align-items:center;column-gap:0;row-gap:14px;padding:24px 26px;border:1px solid var(--line);border-radius:18px;background:#DED8CB;overflow:hidden}
    .p04-widget .flow-field{position:absolute;inset:16px;width:calc(100% - 32px);height:calc(100% - 32px);pointer-events:none;z-index:0}
    .p04-widget .proc-node{height:104px;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;z-index:2}
    .p04-widget .proc-node .node-label{font:600 var(--fs-label)/1.2 var(--font-sans);color:var(--muted)}
    .p04-widget .proc-node .node-value{font:700 30px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text)}
    .p04-widget .proc-node.input.on .node-value,.p04-widget .proc-node.contrib.on .node-value{color:var(--signal)}
    .p04-widget .weight-node{height:104px;display:flex;align-items:center;justify-content:center;gap:12px}
    .p04-widget .weight-node .mini-knob{width:58px;height:58px;border:2px solid var(--text);border-radius:50%;display:grid;place-items:center;font:700 var(--fs-h2)/1 var(--font-mono);position:relative;background:var(--bg)}
    .p04-widget .weight-node .mini-knob::before{content:"";position:absolute;top:-8px;left:27px;width:3px;height:13px;background:var(--text)}
    .p04-widget .weight-node .times{font:700 var(--fs-h2)/1 var(--font-mono);color:var(--muted)}
    .p04-widget .arrow{height:3px;margin:0 7px;background:repeating-linear-gradient(90deg,var(--line) 0 7px,transparent 7px 13px);position:relative;z-index:1}
    .p04-widget .arrow::after{content:"";position:absolute;right:-1px;top:-6px;border-left:10px solid var(--line);border-top:7px solid transparent;border-bottom:7px solid transparent}
    .p04-widget .arrow.on{background:var(--signal)}
    .p04-widget .arrow.on::after{border-left-color:var(--signal)}
    .p04-widget .sum-node{grid-column:7;grid-row:1/3;align-self:stretch;margin:28px 0;border:2px solid var(--signal);border-radius:12px;background:rgba(31,90,122,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;z-index:2}
    .p04-widget .sum-node .sum-label{font:700 var(--fs-body)/1.2 var(--font-sans);color:var(--signal)}
    .p04-widget .sum-node .sum-formula{font:700 var(--fs-h2)/1.2 var(--font-mono);color:var(--text);font-variant-numeric:tabular-nums}
    .p04-widget .sum-node .sum-value{font:800 54px/1 var(--font-mono);color:var(--signal);font-variant-numeric:tabular-nums}
    .p04-widget .merge{grid-column:6;grid-row:1/3;align-self:stretch;position:relative}
    .p04-widget .merge::before{content:"";position:absolute;left:12px;top:25%;bottom:25%;width:34px;border-top:3px solid var(--line);border-bottom:3px solid var(--line);border-right:3px solid var(--line)}
    .p04-widget .merge::after{content:"";position:absolute;left:46px;top:50%;width:26px;height:3px;background:var(--signal);transform:translateY(-1px)}
    .p04-widget .merge-tip{position:absolute;right:0;top:calc(50% - 7px);border-left:10px solid var(--signal);border-top:7px solid transparent;border-bottom:7px solid transparent}
    .p04-widget .pulse{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--accent);opacity:0;z-index:4;pointer-events:none}
    .p04-widget .pulse.first{top:calc(50% - 7px);left:8px}
    .p04-widget .arrow.pulsing .pulse.first{animation:p04-first 180ms linear both}
    .p04-widget .merge.pulsing .pulse.second{top:calc(50% - 7px);left:0;animation:p04-second 180ms linear 120ms both}
    @keyframes p04-first{0%{opacity:1;transform:translateX(0)}100%{opacity:1;transform:translateX(31px)}}
    @keyframes p04-second{0%{opacity:1;transform:translateX(0)}100%{opacity:1;transform:translateX(63px)}}
    .p04-widget [data-status]{position:absolute;left:0;top:0;opacity:0;pointer-events:none;white-space:nowrap}
    .p04-foot{height:82px;display:flex;align-items:flex-end;justify-content:space-between;gap:40px;border-top:1px solid var(--line);padding-top:16px}
    .p04-foot .conclusion{margin:0;font:600 var(--fs-lead)/1.4 var(--font-serif);color:var(--text)}
    .p04-foot .next{margin:0;max-width:600px;text-align:right;font:600 var(--fs-body)/1.35 var(--font-sans);color:var(--accent)}
    @media (prefers-reduced-motion:reduce){.p04-widget *{animation:none!important;transition:none!important}}
  </style>
</head>
<body data-page="04" data-total="22">
  <div id="stage">
    <header class="p04-head">
      <div class="kicker">ONE NEURON · WEIGH &amp; ADD</div>
      <h1>一个神经元先分别衡量两路输入，再把贡献相加</h1>
    </header>

    <main class="p04-widget split-tb min0" data-p04-widget>
      <section class="control-zone min0" aria-label="两路输入开关">
        <div class="channel-control min0">
          <div class="switch-wrap">
            <span class="switch-label">输入 1</span>
            <button class="input-switch" type="button" data-switch="x1" aria-pressed="true" aria-label="输入 1，当前值 1，开">
              <span class="state-text" data-switch-text="x1">1（开）</span>
            </button>
          </div>
          <div class="control-copy"><strong>x₁ 送入第一路</strong>点击切换 0 与 1</div>
          <div class="fixed-weight" aria-label="第一路重要程度固定为 2">
            <div class="weight-meta"><span class="weight-name">w₁ = 2</span><span class="fixed-note">固定</span></div>
            <span class="knob" aria-hidden="true">2</span>
          </div>
        </div>
        <div class="channel-control min0">
          <div class="switch-wrap">
            <span class="switch-label">输入 2</span>
            <button class="input-switch" type="button" data-switch="x2" aria-pressed="false" aria-label="输入 2，当前值 0，关">
              <span class="state-text" data-switch-text="x2">0（关）</span>
            </button>
          </div>
          <div class="control-copy"><strong>x₂ 送入第二路</strong>点击切换 0 与 1</div>
          <div class="fixed-weight" aria-label="第二路重要程度固定为 1">
            <div class="weight-meta"><span class="weight-name">w₂ = 1</span><span class="fixed-note">固定</span></div>
            <span class="knob" aria-hidden="true">1</span>
          </div>
        </div>
      </section>

      <section class="process-zone k-process min0" aria-label="两路输入先乘后加的同步计算">
        <svg class="flow-field" viewBox="0 0 1400 320" preserveAspectRatio="none" aria-hidden="true">
          <rect x="0" y="0" width="1400" height="145" rx="14" fill="rgba(31,90,122,.10)" stroke="rgba(31,90,122,.22)" stroke-width="2"/>
          <rect x="0" y="175" width="1400" height="145" rx="14" fill="rgba(31,90,122,.10)" stroke="rgba(31,90,122,.22)" stroke-width="2"/>
          <path d="M70 72 H1180 Q1240 72 1240 160 H1380" fill="none" stroke="rgba(31,90,122,.13)" stroke-width="34"/>
          <path d="M70 248 H1180 Q1240 248 1240 160" fill="none" stroke="rgba(31,90,122,.13)" stroke-width="34"/>
        </svg>
        <div class="proc-node input on" data-input-node="x1" style="grid-column:1;grid-row:1">
          <span class="node-label">输入值 x₁</span><strong class="node-value" data-x="x1">1</strong>
        </div>
        <div class="arrow on" data-arrow="x1" style="grid-column:2;grid-row:1"><i class="pulse first"></i></div>
        <div class="weight-node" style="grid-column:3;grid-row:1"><span class="times">×</span><span class="mini-knob">2</span></div>
        <div class="arrow on" data-arrow="x1" style="grid-column:4;grid-row:1"><i class="pulse first"></i></div>
        <div class="proc-node contrib on" data-contrib-node="x1" style="grid-column:5;grid-row:1">
          <span class="node-label">第一路贡献</span><strong class="node-value" data-formula="x1">1 × 2 = 2</strong>
        </div>

        <div class="proc-node input" data-input-node="x2" style="grid-column:1;grid-row:2">
          <span class="node-label">输入值 x₂</span><strong class="node-value" data-x="x2">0</strong>
        </div>
        <div class="arrow" data-arrow="x2" style="grid-column:2;grid-row:2"><i class="pulse first"></i></div>
        <div class="weight-node" style="grid-column:3;grid-row:2"><span class="times">×</span><span class="mini-knob">1</span></div>
        <div class="arrow" data-arrow="x2" style="grid-column:4;grid-row:2"><i class="pulse first"></i></div>
        <div class="proc-node contrib" data-contrib-node="x2" style="grid-column:5;grid-row:2">
          <span class="node-label">第二路贡献</span><strong class="node-value" data-formula="x2">0 × 1 = 0</strong>
        </div>

        <div class="merge" data-merge><i class="pulse second"></i><span class="merge-tip"></span></div>
        <div class="sum-node">
          <span class="sum-label">汇合后相加</span>
          <span class="sum-formula" data-sum-formula>2 + 0 =</span>
          <strong class="sum-value" data-sum>2</strong>
        </div>
      </section>
      <div data-status aria-live="polite">输入 1 为 1，输入 2 为 0，合计 2。</div>
    </main>

    <footer class="p04-foot">
      <p class="conclusion">神经元先做两次乘法，再做一次加法。</p>
      <p class="next">加出的总分，要达到什么程度才回答“是”？</p>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
  (() => {
    const root = document.querySelector('[data-p04-widget]');
    if (!root) return;
    const initial = Object.freeze({x1:1,x2:0});
    let state = {...initial};
    let cleanupTimer = 0;
    let destroyed = false;
    const switches = [...root.querySelectorAll('[data-switch]')];
    const status = root.querySelector('[data-status]');
    const merge = root.querySelector('[data-merge]');

    function render(changed, announce){
      const c1 = state.x1 * 2;
      const c2 = state.x2 * 1;
      switches.forEach(btn => {
        const key = btn.dataset.switch;
        const value = state[key];
        btn.setAttribute('aria-pressed', String(Boolean(value)));
        btn.setAttribute('aria-label', `输入 ${key === 'x1' ? '1' : '2'}，当前值 ${value}，${value ? '开' : '关'}`);
        root.querySelector(`[data-switch-text="${key}"]`).textContent = `${value}（${value ? '开' : '关'}）`;
        root.querySelector(`[data-x="${key}"]`).textContent = value;
        root.querySelector(`[data-input-node="${key}"]`).classList.toggle('on', Boolean(value));
        root.querySelector(`[data-contrib-node="${key}"]`).classList.toggle('on', Boolean(value));
        root.querySelectorAll(`[data-arrow="${key}"]`).forEach(a => a.classList.toggle('on', Boolean(value)));
      });
      root.querySelector('[data-formula="x1"]').textContent = `${state.x1} × 2 = ${c1}`;
      root.querySelector('[data-formula="x2"]').textContent = `${state.x2} × 1 = ${c2}`;
      root.querySelector('[data-sum-formula]').textContent = `${c1} + ${c2} =`;
      root.querySelector('[data-sum]').textContent = c1 + c2;
      if (announce) status.textContent = `输入 1 为 ${state.x1}，输入 2 为 ${state.x2}，第一路贡献 ${c1}，第二路贡献 ${c2}，合计 ${c1+c2}。`;
      if (changed) pulse(changed);
    }

    function pulse(key){
      window.clearTimeout(cleanupTimer);
      root.querySelectorAll('.pulsing,.just-used').forEach(el => el.classList.remove('pulsing','just-used'));
      void root.offsetWidth;
      root.querySelectorAll(`[data-arrow="${key}"]`).forEach(a => a.classList.add('pulsing'));
      merge.classList.add('pulsing');
      root.querySelector(`[data-switch="${key}"]`).classList.add('just-used');
      cleanupTimer = window.setTimeout(() => {
        root.querySelectorAll('.pulsing,.just-used').forEach(el => el.classList.remove('pulsing','just-used'));
      }, 340);
    }

    function toggle(key){
      if (destroyed) return;
      state = {...state,[key]:state[key] ? 0 : 1};
      render(key,true);
    }
    function onClick(event){ toggle(event.currentTarget.dataset.switch); }
    switches.forEach(btn => btn.addEventListener('click',onClick));
    render(null,false);

    root.destroyP04Widget = () => {
      if (destroyed) return;
      destroyed = true;
      window.clearTimeout(cleanupTimer);
      switches.forEach(btn => btn.removeEventListener('click',onClick));
      delete root.destroyP04Widget;
    };
    Deck.init({index:4,total:22});
  })();
  </script>
</body>
</html>
