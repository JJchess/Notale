<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:16px}
.p07-head{height:92px;display:flex;flex-direction:column;justify-content:center;gap:7px}
.p07-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--accent)}
.p07-head h1{margin:0;font:700 var(--fs-h1)/1.18 var(--font-sans);color:var(--text)}
.p07-main{flex:1;min-height:0}
#boundary-widget{height:100%;display:grid;grid-template-rows:minmax(0,1fr) 76px;gap:12px;min-width:0;min-height:0}
#boundary-widget .field-shell{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.28);overflow:hidden}
#boundary-widget .konva-host{position:absolute;inset:0;touch-action:none}
#boundary-widget .field-shell:focus-visible{outline:3px solid var(--focus);outline-offset:-4px}
#boundary-widget .overlay{position:absolute;inset:0;pointer-events:none}
#boundary-widget .ov{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:600 var(--fs-label)/1.2 var(--font-sans);color:var(--text)}
#boundary-widget .axis-name{font-size:var(--fs-body);font-weight:700}
#boundary-widget .tick{font:500 var(--fs-tick)/1 var(--font-mono);color:var(--muted)}
#boundary-widget .side-label{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(244,241,232,.88);color:var(--signal)}
#boundary-widget .line-label{padding:5px 9px;background:rgba(244,241,232,.94);color:var(--text);border-radius:6px}
#boundary-widget .point-label{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;background:rgba(244,241,232,.91);box-shadow:0 1px 0 rgba(49,54,59,.08)}
#boundary-widget .point-label b{font:700 var(--fs-label)/1 var(--font-sans)}
#boundary-widget .point-label span{font:700 var(--fs-label)/1 var(--font-sans)}
#boundary-widget .point-label .ok{color:var(--signal)}
#boundary-widget .point-label .bad{color:var(--error)}
#boundary-widget .score-block{position:absolute;left:48px;top:42px;width:220px;color:var(--text)}
#boundary-widget .score-title{font:600 var(--fs-label)/1.2 var(--font-sans);color:var(--muted)}
#boundary-widget .score-now{margin-top:9px;font:700 42px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--signal)}
#boundary-widget .score-best{margin-top:12px;font:600 var(--fs-body)/1.25 var(--font-sans);color:var(--text)}
#boundary-widget .score-best .num{color:var(--signal)}
#boundary-widget .trial-note{position:absolute;left:48px;bottom:42px;width:242px;font:500 var(--fs-sec)/1.45 var(--font-sans);color:var(--muted)}
#boundary-widget .reveal{position:absolute;right:38px;top:42px;width:250px;padding:16px 17px;border:1px solid var(--error);border-radius:10px;background:rgba(163,58,58,.06);font:600 var(--fs-sec)/1.45 var(--font-sans);color:var(--error);opacity:0;transition:opacity .16s ease}
#boundary-widget[data-max="3"] .reveal{opacity:1}
#boundary-widget .angle-read{position:absolute;right:46px;bottom:44px;text-align:right}
#boundary-widget .angle-read span{display:block;font:600 var(--fs-label)/1.2 var(--font-sans);color:var(--muted)}
#boundary-widget .angle-read strong{display:block;margin-top:6px;font:700 28px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--accent)}
#boundary-widget .rail{display:flex;align-items:center;gap:14px;padding:0 14px;border-top:1px solid var(--line);min-width:0}
#boundary-widget .hint{margin-right:auto;max-width:760px}
#boundary-widget .btn{min-width:128px}
#boundary-widget .btn.swap{border-color:var(--accent);color:var(--accent)}
.p07-foot{height:82px;display:flex;align-items:center;justify-content:space-between;gap:34px;border-top:1px solid var(--line)}
.p07-conclusion{margin:0;max-width:900px;font:600 var(--fs-lead)/1.45 var(--font-serif);color:var(--text)}
.p07-next{margin:0;text-align:right;font:600 var(--fs-sec)/1.4 var(--font-sans);color:var(--muted)}
@media (prefers-reduced-motion:reduce){#boundary-widget .reveal{transition:none}}
</style>
</head>
<body data-page="07" data-total="22">
<div id="stage">
  <header class="p07-head">
    <div class="p07-kicker">LIMIT · ONE NEURON</div>
    <h1>无论怎样摆，一个神经元都只能画一条直线</h1>
  </header>

  <main class="p07-main canvas-full min0">
    <section id="boundary-widget" class="k-classification" aria-label="单神经元直线分类实验" data-max="2">
      <div class="field-shell box no-pan" tabindex="0" role="application" aria-label="分类线。方向键平移，左方括号和右方括号旋转，空格交换两侧。">
        <div class="konva-host" aria-hidden="true"></div>
        <div class="overlay" aria-hidden="true">
          <div class="score-block">
            <div class="score-title">当前分类结果</div>
            <div class="score-now" aria-live="polite">分对 <span data-correct>2</span> / 4</div>
            <div class="score-best">本次最高 <span class="num" data-best>2 / 4</span></div>
          </div>
          <div class="trial-note">四个答案固定不动。你只能移动、旋转这一条线，或交换线两侧的预测。</div>
          <div class="reveal">已经只错 1 个；继续摆，只会把错误换到别的点。</div>
          <div class="angle-read"><span>分类线角度</span><strong data-angle>90°</strong></div>
          <div class="ov side-label" data-side="neg">预测 0</div>
          <div class="ov side-label" data-side="pos">预测 1</div>
          <div class="ov line-label" data-line-label>这个神经元的分类线</div>
          <div class="ov axis-name" data-axis="x">x₁</div>
          <div class="ov axis-name" data-axis="y">x₂</div>
          <div class="ov tick" data-tick="x0">0</div><div class="ov tick" data-tick="x1">1</div>
          <div class="ov tick" data-tick="y0">0</div><div class="ov tick" data-tick="y1">1</div>
          <div class="ov point-label" data-point="0"><b>答案 0</b><span></span></div>
          <div class="ov point-label" data-point="1"><b>答案 1</b><span></span></div>
          <div class="ov point-label" data-point="2"><b>答案 1</b><span></span></div>
          <div class="ov point-label" data-point="3"><b>答案 0</b><span></span></div>
        </div>
      </div>
      <div class="rail">
        <div class="hint">拖动线身平移 · 拖动琥珀色端柄旋转 · 聚焦场景后可用方向键、[ ] 与空格</div>
        <button class="btn swap" type="button" data-swap>交换两侧</button>
        <button class="btn" type="button" data-reset>复位</button>
      </div>
    </section>
  </main>

  <footer class="p07-foot">
    <p class="p07-conclusion conclusion">两类点彼此交错时，单条直线最多分对 3 个，不能把 4 个全部分开。</p>
    <p class="p07-next">边界摆不好时，模型怎样知道自己错了多少？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/konva.min.js"></script>
<script>
(() => {
  const root = document.getElementById('boundary-widget');
  if (!root || !window.Konva) return;
  const shell = root.querySelector('.field-shell');
  const host = root.querySelector('.konva-host');
  const samples = [
    {x:0,y:0,t:0},{x:1,y:0,t:1},{x:0,y:1,t:1},{x:1,y:1,t:0}
  ];
  const initial = () => ({cx:.5, cy:.5, angle:90, positiveIsOne:true, best:2});
  let state = initial();
  let geom = null;
  let destroyed = false;
  let dragKind = null;

  const stage = new Konva.Stage({container:host,width:1,height:1});
  const layer = new Konva.Layer();
  stage.add(layer);
  const region0 = new Konva.Line({closed:true,fill:'rgba(49,54,59,.045)',listening:false});
  const region1 = new Konva.Line({closed:true,fill:'rgba(31,90,122,.12)',listening:false});
  const grid = new Konva.Group({listening:false});
  const plotBorder = new Konva.Rect({stroke:'#A9A59B',strokeWidth:1.5,cornerRadius:4,listening:false});
  const line = new Konva.Line({stroke:'#1F5A7A',strokeWidth:4,lineCap:'round',hitStrokeWidth:30,draggable:true});
  const handle = new Konva.Circle({radius:11,fill:'#F4F1E8',stroke:'#D97706',strokeWidth:5,hitStrokeWidth:24,draggable:false});
  const points = samples.map((s,i) => new Konva.Circle({radius:10,fill:'#31363B',stroke:'#F4F1E8',strokeWidth:3,listening:false,name:'sample-'+i}));
  layer.add(region0,region1,grid,plotBorder,line,...points,handle);

  function color(name, fallback){
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function normalizeAngle(a){
    while(a < 0) a += 180;
    while(a > 180) a -= 180;
    return clamp(a,0,180);
  }
  function modelToPx(x,y){
    return {x:geom.left+x*geom.size,y:geom.top+(1-y)*geom.size};
  }
  function pxToModel(x,y){
    return {x:(x-geom.left)/geom.size,y:1-(y-geom.top)/geom.size};
  }
  function signed(s,x,y){
    const r=s.angle*Math.PI/180;
    const nx=Math.sin(r), ny=-Math.cos(r);
    return nx*(x-s.cx)+ny*(y-s.cy);
  }
  function predicted(s,p){
    const positive = signed(s,p.x,p.y) >= -1e-9;
    return (positive === s.positiveIsOne) ? 1 : 0;
  }
  function results(s){
    const preds=samples.map(p=>predicted(s,p));
    return {preds,correct:preds.reduce((n,v,i)=>n+(v===samples[i].t?1:0),0)};
  }
  function clipHalf(keepPositive){
    let poly=[{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:0,y:1}];
    const inside=p => keepPositive ? signed(state,p.x,p.y)>=0 : signed(state,p.x,p.y)<=0;
    const out=[];
    for(let i=0;i<poly.length;i++){
      const a=poly[i], b=poly[(i+1)%poly.length], ia=inside(a), ib=inside(b);
      if(ia) out.push(a);
      if(ia!==ib){
        const da=signed(state,a.x,a.y), db=signed(state,b.x,b.y);
        const t=da/(da-db);
        out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
      }
    }
    return out.map(p=>modelToPx(p.x,p.y)).flatMap(p=>[p.x,p.y]);
  }
  function place(el,x,y){ el.style.left=x+'px'; el.style.top=y+'px'; }

  function render(announce){
    if(!geom || destroyed) return;
    const res=results(state);
    state.best=Math.max(state.best,res.correct);
    root.dataset.max=String(state.best);
    root.querySelector('[data-correct]').textContent=String(res.correct);
    root.querySelector('[data-best]').textContent=state.best+' / 4';
    root.querySelector('[data-angle]').textContent=Math.round(state.angle)+'°';

    const posIsOne=state.positiveIsOne;
    region1.points(clipHalf(posIsOne));
    region0.points(clipHalf(!posIsOne));
    const c=modelToPx(state.cx,state.cy);
    const r=state.angle*Math.PI/180;
    const tx=Math.cos(r), ty=-Math.sin(r);
    line.points([c.x-tx*1200,c.y-ty*1200,c.x+tx*1200,c.y+ty*1200]);
    line.position({x:0,y:0});
    const hp={x:c.x+tx*geom.size*.38,y:c.y+ty*geom.size*.38};
    handle.position(hp);

    samples.forEach((p,i)=>{
      const q=modelToPx(p.x,p.y);
      points[i].position(q);
      const el=root.querySelector('[data-point="'+i+'"]');
      const dx=p.x===0?-68:68, dy=p.y===0?-34:34;
      place(el,q.x+dx,q.y+dy);
      const mark=el.querySelector('span');
      const ok=res.preds[i]===p.t;
      mark.textContent=ok?'分对':'分错';
      mark.className=ok?'ok':'bad';
    });

    const n={x:Math.sin(r),y:-Math.cos(r)};
    const pPos=modelToPx(state.cx+n.x*.31,state.cy+n.y*.31);
    const pNeg=modelToPx(state.cx-n.x*.31,state.cy-n.y*.31);
    const oneLabel=root.querySelector('[data-side="pos"]');
    const zeroLabel=root.querySelector('[data-side="neg"]');
    const positiveLabel=posIsOne?oneLabel:zeroLabel;
    const negativeLabel=posIsOne?zeroLabel:oneLabel;
    place(positiveLabel,pPos.x,pPos.y); place(negativeLabel,pNeg.x,pNeg.y);
    place(root.querySelector('[data-line-label]'),c.x-tx*geom.size*.2,c.y-ty*geom.size*.2-24);

    const x0=modelToPx(0,0), x1=modelToPx(1,0), y1=modelToPx(0,1);
    place(root.querySelector('[data-axis="x"]'),x1.x+38,x1.y+2);
    place(root.querySelector('[data-axis="y"]'),y1.x-4,y1.y-30);
    place(root.querySelector('[data-tick="x0"]'),x0.x,x0.y+26);
    place(root.querySelector('[data-tick="x1"]'),x1.x,x1.y+26);
    place(root.querySelector('[data-tick="y0"]'),x0.x-25,x0.y);
    place(root.querySelector('[data-tick="y1"]'),y1.x-25,y1.y);
    layer.batchDraw();
    shell.setAttribute('aria-label','分类线角度 '+Math.round(state.angle)+' 度，当前分对 '+res.correct+' 个，本次最高 '+state.best+' 个。方向键平移，左方括号和右方括号旋转，空格交换两侧。');
  }

  function layout(){
    const w=host.clientWidth, h=host.clientHeight;
    if(!w||!h) return;
    stage.size({width:w,height:h});
    const size=Math.min(500,h-76,w-660);
    geom={size,left:(w-size)/2,top:(h-size)/2};
    grid.destroyChildren();
    [0,1].forEach(v=>{
      const a=modelToPx(v,0), b=modelToPx(v,1);
      grid.add(new Konva.Line({points:[a.x,a.y,b.x,b.y],stroke:color('--line','#B9B5AB'),strokeWidth:1,listening:false}));
      const c=modelToPx(0,v), d=modelToPx(1,v);
      grid.add(new Konva.Line({points:[c.x,c.y,d.x,d.y],stroke:color('--line','#B9B5AB'),strokeWidth:1,listening:false}));
    });
    plotBorder.position({x:geom.left,y:geom.top}); plotBorder.size({width:size,height:size});
    render(false);
  }

  function commit(next,announce){
    state={...state,...next};
    state.cx=clamp(state.cx,-.18,1.18); state.cy=clamp(state.cy,-.18,1.18);
    state.angle=normalizeAngle(state.angle);
    render(announce);
  }
  line.on('mouseenter',()=>{document.body.style.cursor='grab'});
  line.on('mouseleave',()=>{document.body.style.cursor='default'});
  line.on('dragstart',()=>{dragKind='line';document.body.style.cursor='grabbing';shell.focus()});
  line.on('dragmove',()=>{
    const dx=line.x()/geom.size, dy=-line.y()/geom.size;
    line.position({x:0,y:0});
    commit({cx:state.cx+dx,cy:state.cy+dy},false);
  });
  line.on('dragend',()=>{dragKind=null;document.body.style.cursor='grab';render(true)});
  line.on('pointerdown',()=>shell.focus());
  handle.on('mouseenter',()=>{document.body.style.cursor='grab'});
  handle.on('mouseleave',()=>{document.body.style.cursor='default'});
  handle.on('pointerdown',e=>{dragKind='handle';shell.focus();stage.setPointersPositions(e.evt);e.evt.preventDefault()});
  stage.on('pointermove',()=>{
    if(dragKind!=='handle') return;
    const p=stage.getPointerPosition(), c=modelToPx(state.cx,state.cy);
    if(!p) return;
    commit({angle:Math.atan2(c.y-p.y,p.x-c.x)*180/Math.PI},false);
  });
  stage.on('pointerup pointercancel',()=>{
    if(dragKind==='handle'){dragKind=null;render(true)}
  });

  function swap(announce=true){ commit({positiveIsOne:!state.positiveIsOne},announce); }
  function reset(){ state=initial(); dragKind=null; render(true); }
  root.querySelector('[data-swap]').addEventListener('click',()=>swap(true));
  root.querySelector('[data-reset]').addEventListener('click',reset);
  shell.addEventListener('keydown',e=>{
    let next=null;
    const step=.025;
    if(e.key==='ArrowLeft') next={cx:state.cx-step};
    else if(e.key==='ArrowRight') next={cx:state.cx+step};
    else if(e.key==='ArrowUp') next={cy:state.cy+step};
    else if(e.key==='ArrowDown') next={cy:state.cy-step};
    else if(e.key==='[') next={angle:state.angle-2};
    else if(e.key===']') next={angle:state.angle+2};
    else if(e.key===' '){ swap(true); next={}; }
    if(next){e.preventDefault();e.stopPropagation();if(Object.keys(next).length)commit(next,true)}
  });

  const ro=new ResizeObserver(layout); ro.observe(host);
  const offResize=Deck.onResize(layout);
  layout();
  Deck.init({index:7,total:22});

  root.__p07={
    set(s){commit(s,true)},
    reset,
    destroy(){
      if(destroyed)return; destroyed=true; ro.disconnect(); offResize(); stage.destroy(); delete root.__p07;
    }
  };
  window.addEventListener('pagehide',()=>root.__p07&&root.__p07.destroy(),{once:true});
})();
</script>
</body>
</html>
