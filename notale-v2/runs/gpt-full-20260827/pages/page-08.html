<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{display:flex;flex-direction:column;overflow:hidden;}
  .page-head{width:1120px;margin:0 auto;height:84px;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;text-align:center;}
  .kicker{font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.12em;color:var(--muted);margin:2px 0 10px;}
  h1{margin:0;font:700 var(--fs-h1)/1.18 var(--font-sans);color:var(--text);letter-spacing:.01em;}
  .focus{width:1180px;max-width:100%;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;}
  .checkpoint{position:relative;width:100%;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;}
  .checkpoint .claim{width:1000px;min-height:84px;display:flex;align-items:center;justify-content:center;font:600 var(--fs-lead)/1.45 var(--font-sans);color:var(--text);text-align:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(255,255,255,.28);}
  .checkpoint .trunk{position:relative;width:3px;height:24px;background:var(--text);opacity:.72;flex:none;}
  .checkpoint .trunk::after{content:"";position:absolute;left:50%;bottom:-1px;width:980px;height:1px;background:var(--line);transform:translateX(-50%);}
  .checkpoint .supports{width:1180px;height:500px;display:grid;grid-template-columns:minmax(0,1fr) 170px minmax(0,1fr);align-items:stretch;gap:0;position:relative;flex:none;}
  .checkpoint .support{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;margin:6px 8px;padding:12px 18px 10px;min-width:0;border:1px solid var(--line);background:#EAE7DE;}
  .checkpoint .support:first-child{border-color:rgba(31,90,122,.48);background:#DDE8EC;}
  .checkpoint .support:last-child{border-style:dashed;background:#E7E4DB;}
  .support-label{display:flex;align-items:center;gap:12px;font:700 var(--fs-h2)/1.2 var(--font-sans);color:var(--text);margin-bottom:22px;}
  .state-mark{width:12px;height:12px;border-radius:50%;background:var(--signal);}
  .state-mark.open{background:transparent;border:2px dashed var(--muted);}
  .diagram{width:100%;height:300px;display:flex;align-items:center;justify-content:center;}
  .support:first-child .diagram svg{background:#C9DCE4;}
  .support:last-child .diagram svg{background:#DDD9CF;}
  .diagram svg{width:100%;height:100%;overflow:visible;}
  .side-note{font:400 var(--fs-sec)/1.4 var(--font-sans);color:var(--muted);margin-top:10px;}
  .facts{width:100%;display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:4px;}
  .fact{min-height:32px;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px 10px;font:500 var(--fs-sec)/1.35 var(--font-sans);color:var(--text);}
  .fact + .fact{border-top:1px solid var(--line);}
  .facts{background:#D3E0E5;}
  .pending-facts{background:#D8D4CA;}
  .pending-facts .fact{color:var(--muted);}
  .annotation-strip{width:100%;display:flex;justify-content:space-between;gap:8px;margin-top:8px;}
  .annotation-strip span{flex:1;text-align:center;padding:7px 5px;border-bottom:2px solid var(--line);background:#D7D4CB;font:600 var(--fs-label)/1.25 var(--font-sans);color:var(--muted);}
  .done-strip span{border-color:var(--signal);color:var(--signal);}
  .checkpoint .gap{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:82px;margin:6px 0;background:#E9D7B8;border-top:1px dashed var(--accent);border-bottom:1px dashed var(--accent);}
  .missing-line{width:62px;height:4px;background:var(--accent);border-radius:3px;margin-top:26px;}
  .missing-label{margin-top:12px;font:700 var(--fs-label)/1.2 var(--font-sans);color:var(--accent);letter-spacing:.08em;}
  .gap::before,.gap::after{content:"";position:absolute;top:169px;width:42px;border-top:2px dashed var(--line);}
  .gap::before{left:3px}.gap::after{right:3px}
  .checkpoint .bottom-axis{width:3px;height:8px;background:var(--line);flex:none;}
  .checkpoint .ending{width:1100px;min-height:100px;text-align:center;padding:14px 48px 12px;border:1px solid var(--line);background:#DCD8CE;}
  .conclusion{margin:0;font:600 24px/1.45 var(--font-serif);color:var(--text);}
  .next{display:inline-flex;align-items:center;gap:12px;margin-top:16px;font:600 var(--fs-lead)/1.35 var(--font-sans);color:var(--signal);}
  .next::before{content:"";width:34px;border-top:3px solid var(--signal);}
  .next::after{content:"›";font:700 28px/1 var(--font-sans);}
  .neuron-box{fill:rgba(31,90,122,.06);stroke:var(--signal);stroke-width:2.5;}
  .given-node{fill:var(--text);}
  .signal-line{fill:none;stroke:var(--signal);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
  .signal-node{fill:var(--signal);}
  .svg-label{font:600 16px/1 var(--font-sans);fill:var(--text);}
  .svg-muted{font:400 15px/1 var(--font-sans);fill:var(--muted);}
  .knob-shell{fill:rgba(49,54,59,.03);stroke:var(--muted);stroke-width:2;stroke-dasharray:6 6;}
  .knob-core{fill:var(--bg);stroke:var(--text);stroke-width:2.5;}
  .knob-tick{stroke:var(--muted);stroke-width:2;stroke-linecap:round;}
  .knob-pointer{stroke:var(--text);stroke-width:3;stroke-linecap:round;}
  .knob-label{font:600 16px/1 var(--font-mono);fill:var(--text);text-anchor:middle;}
  .pending{font:500 15px/1 var(--font-sans);fill:var(--muted);text-anchor:middle;}
</style>
</head>
<body data-page="08" data-total="22">
<div id="stage">
  <header class="page-head">
    <div class="kicker">CHAPTER II · CHECKPOINT</div>
    <h1>会预测，还不等于会学习</h1>
  </header>

  <main class="focus min0" aria-labelledby="page-claim">
    <section class="k-generalization checkpoint min0">
      <div class="claim" id="page-claim">神经元已经能把输入变成预测，但参数还停在原处。</div>
      <div class="trunk" aria-hidden="true"></div>

      <div class="supports min0">
        <article class="support min0" aria-label="已经成立：会预测">
          <div class="support-label"><span class="state-mark" aria-hidden="true"></span>会预测</div>
          <div class="tag">当前状态 · 已连通</div>
          <div class="annotation-strip done-strip" aria-label="已经参与预测的部分"><span>给定输入</span><span>权重连接</span><span>汇总信号</span><span>加入偏置</span><span>输出预测</span></div>
          <div class="diagram">
            <svg viewBox="0 0 440 196" role="img" aria-label="输入沿前向箭头经过神经元，得到预测">
              <defs>
                <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--signal)"></path>
                </marker>
              </defs>
              <circle class="given-node" cx="38" cy="63" r="10"></circle>
              <circle class="given-node" cx="38" cy="132" r="10"></circle>
              <text class="svg-label" x="20" y="28">输入</text>
              <path class="signal-line" d="M52 63 C92 63 102 84 138 91" marker-end="url(#arrow-blue)"></path>
              <path class="signal-line" d="M52 132 C92 132 102 112 138 105" marker-end="url(#arrow-blue)"></path>
              <rect class="neuron-box" x="151" y="58" width="128" height="82" rx="12"></rect>
              <text class="svg-label" x="215" y="93" text-anchor="middle">神经元</text>
              <text class="svg-muted" x="215" y="119" text-anchor="middle">汇总 · 输出</text>
              <path class="signal-line" d="M279 99 H372" marker-end="url(#arrow-blue)"></path>
              <circle class="signal-node" cx="405" cy="99" r="14"></circle>
              <text class="svg-label" x="405" y="143" text-anchor="middle">预测</text>
            </svg>
          </div>
          <div class="facts" aria-label="预测已完成的三个动作">
            <div class="fact">输入沿权重连接进入神经元</div>
            <div class="fact">神经元把输入与偏置汇总</div>
            <div class="fact">输出端给出一个预测</div>
          </div>
        </article>

        <div class="gap" aria-label="预测和学习之间还缺罚分">
          <div class="missing-line" aria-hidden="true"></div>
          <div class="missing-label">缺：罚分</div>
          <div class="side-note">还没有比较依据</div>
        </div>

        <article class="support min0" aria-label="尚未成立：会学习">
          <div class="support-label"><span class="state-mark open" aria-hidden="true"></span>会学习</div>
          <div class="tag">当前状态 · 未启动</div>
          <div class="annotation-strip" aria-label="尚未发生的学习动作"><span>权重甲</span><span>权重乙</span><span>偏置</span><span>均未转动</span><span>参数不变</span></div>
          <div class="diagram">
            <svg viewBox="0 0 440 196" role="img" aria-label="权重与偏置三个参数旋钮尚未转动">
              <g transform="translate(78 93)">
                <circle class="knob-shell" r="55"></circle>
                <path class="knob-tick" d="M-39 -39 L-33 -33 M0 -55 L0 -46 M39 -39 L33 -33"></path>
                <circle class="knob-core" r="31"></circle>
                <path class="knob-pointer" d="M0 0 L0 -22"></path>
                <text class="knob-label" x="0" y="77">权重</text>
              </g>
              <g transform="translate(220 93)">
                <circle class="knob-shell" r="55"></circle>
                <path class="knob-tick" d="M-39 -39 L-33 -33 M0 -55 L0 -46 M39 -39 L33 -33"></path>
                <circle class="knob-core" r="31"></circle>
                <path class="knob-pointer" d="M0 0 L0 -22"></path>
                <text class="knob-label" x="0" y="77">权重</text>
              </g>
              <g transform="translate(362 93)">
                <circle class="knob-shell" r="55"></circle>
                <path class="knob-tick" d="M-39 -39 L-33 -33 M0 -55 L0 -46 M39 -39 L33 -33"></path>
                <circle class="knob-core" r="31"></circle>
                <path class="knob-pointer" d="M0 0 L0 -22"></path>
                <text class="knob-label" x="0" y="77">偏置</text>
              </g>
            </svg>
          </div>
          <div class="facts pending-facts" aria-label="参数仍然没有改变">
            <div class="fact">权重旋钮仍停在原来的位置</div>
            <div class="fact">偏置旋钮也没有发生变化</div>
            <div class="fact">预测之后还缺少一项比较依据</div>
          </div>
        </article>
      </div>

      <div class="bottom-axis" aria-hidden="true"></div>
      <div class="ending">
        <p class="conclusion">要让参数开始改变，下一步必须给预测一个可比较的罚分。</p>
        <div class="next">怎样把预测的好坏，变成一个能比较的数？</div>
      </div>
    </section>
  </main>
</div>
