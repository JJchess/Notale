<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{gap:14px}
  .p10-head{height:82px;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;position:relative}.p10-start{position:absolute;right:0;top:5px;margin:0;color:var(--muted);font:500 var(--fs-label)/1 var(--font-mono)}
  .p10-kicker{margin:0;color:var(--accent);font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.14em}
  .p10-head h1{margin:0;color:var(--text);font:700 var(--fs-h1)/1.16 var(--font-sans)}
  .tuning-ledger{flex:1;display:grid;grid-template-rows:220px 300px 115px;gap:12px;min-height:0}
  .tuning-ledger .panel{box-shadow:none}
  .tuning-ledger .knob-panel{display:grid;grid-template-columns:240px 1fr;align-items:center;padding:16px 22px;border:1px solid var(--line);border-radius:16px;background:transparent}
  .tuning-ledger .rail-intro{align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding-right:22px;border-right:1px solid var(--line)}
  .tuning-ledger .rail-intro strong{font:700 var(--fs-h2)/1.2 var(--font-sans);color:var(--text)}
  .tuning-ledger .rail-intro p{margin:9px 0 0;color:var(--muted);font:400 var(--fs-sec)/1.45 var(--font-sans)}.tuning-ledger .process-strip{display:grid;grid-template-columns:1fr 44px 1fr 44px 1fr;align-items:center;padding:0 26px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.tuning-ledger .process-step{display:flex;align-items:baseline;justify-content:center;gap:12px;color:var(--text)}.tuning-ledger .process-step b{color:var(--accent);font:700 var(--fs-label)/1 var(--font-mono)}.tuning-ledger .process-step span{font:600 var(--fs-body)/1.2 var(--font-mono)}.tuning-ledger .process-arrow{height:2px;background:var(--line);position:relative}.tuning-ledger .process-arrow::after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid var(--line);border-top:6px solid transparent;border-bottom:6px solid transparent}
  .tuning-ledger .knob-row{display:flex;align-items:center;justify-content:space-evenly;gap:36px;padding-left:24px}
  .tuning-ledger .param{width:304px;display:grid;grid-template-columns:196px 94px;grid-template-rows:122px 50px;align-items:center;column-gap:14px}
  .tuning-ledger .dial{position:relative;width:190px;height:190px;grid-row:1/3;border:1px solid var(--line);border-radius:50%;background:var(--bg);touch-action:none;cursor:ew-resize;outline:none}
  .tuning-ledger .dial:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
  .tuning-ledger .dial::before{content:"";position:absolute;inset:12px;border-radius:50%;border:2px solid var(--text);background:var(--bg)}
  .tuning-ledger .ticks{position:absolute;inset:3px;border-radius:50%;background:repeating-conic-gradient(from -135deg,var(--line) 0 1deg,transparent 1deg 14deg);clip-path:polygon(0 0,100% 0,100% 82%,50% 50%,0 82%)}
  .tuning-ledger .needle{position:absolute;z-index:2;left:92px;top:26px;width:6px;height:76px;border-radius:3px;background:var(--accent);transform-origin:3px 71px;transform:rotate(var(--angle))}
  .tuning-ledger .dial-dot{position:absolute;z-index:3;left:85px;top:87px;width:20px;height:20px;border-radius:50%;background:var(--text)}
  .tuning-ledger .param-name{align-self:end;font:700 var(--fs-body)/1 var(--font-mono);color:var(--text)}
  .tuning-ledger .param-value{align-self:start;padding-top:8px;color:var(--accent);font:700 28px/1 var(--font-mono);font-variant-numeric:tabular-nums}
  .tuning-ledger .param input[type="range"]{grid-column:2;grid-row:2;width:82px;margin:0;accent-color:var(--accent)}
  .tuning-ledger .ledger-panel{padding:0 18px 12px;border:1px solid var(--line);border-radius:16px;background:transparent;overflow:hidden}
  .tuning-ledger table{width:100%;height:100%;border-collapse:collapse;table-layout:fixed;font:400 var(--fs-body)/1.25 var(--font-sans);font-variant-numeric:tabular-nums}
  .tuning-ledger th{height:48px;color:var(--muted);font-size:var(--fs-label);font-weight:600;text-align:center;border-bottom:1px solid var(--line)}
  .tuning-ledger td{height:56px;text-align:center;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
  .tuning-ledger tbody tr:last-child td{border-bottom:0}
  .tuning-ledger .sample-name{font-weight:700;color:var(--text)}
  .tuning-ledger .given{color:var(--text)}
  .tuning-ledger .signal{color:var(--signal);font-family:var(--font-mono);font-weight:650}
  .tuning-ledger .loss{color:var(--error);font-family:var(--font-mono);font-weight:650}
  .tuning-ledger .decision{display:inline-flex;align-items:center;justify-content:center;width:34px;height:28px;border:1px solid currentColor;border-radius:7px;color:var(--signal);font-family:var(--font-mono);font-weight:700}
  .tuning-ledger .summary{display:grid;grid-template-columns:1fr auto;align-items:center;padding:14px 20px 14px 24px;border:1px solid var(--line);border-radius:16px;background:transparent}
  .tuning-ledger .score-line{display:flex;align-items:baseline;gap:18px}
  .tuning-ledger .score-label{font:700 var(--fs-h2)/1 var(--font-sans);color:var(--text)}
  .tuning-ledger .score{min-width:6ch;color:var(--error);font:750 42px/1 var(--font-mono);font-variant-numeric:tabular-nums}
  .tuning-ledger .delta{min-width:215px;font:650 var(--fs-body)/1.2 var(--font-sans);font-variant-numeric:tabular-nums}
  .tuning-ledger .delta.lower{color:var(--signal)}
  .tuning-ledger .delta.higher{color:var(--error)}
  .tuning-ledger .delta.same{color:var(--muted)}
  .tuning-ledger .summary-actions{display:flex;align-items:center;gap:18px}
  .tuning-ledger .hint{margin:0;color:var(--muted);font:400 var(--fs-sec)/1.35 var(--font-sans)}
  .tuning-ledger .btn{min-width:126px;min-height:42px}
  .p10-foot{height:52px;display:grid;grid-template-columns:1fr 500px;align-items:start;gap:32px}
  .p10-conclusion{margin:0;font:600 var(--fs-body)/1.45 var(--font-serif);color:var(--text)}
  .p10-next{margin:0;text-align:right;color:var(--muted);font:500 var(--fs-sec)/1.45 var(--font-sans)}
  @media (prefers-reduced-motion:no-preference){.tuning-ledger .needle{transition:transform 120ms ease}.tuning-ledger td{transition:color 120ms ease}}
</style>
</head>
<body data-page="10" data-total="22">
<div id="stage">
  <header class="p10-head">
    <p class="p10-kicker">MANUAL TUNING</p>
    <p class="p10-start">起点参数　w₁ = −0.8　w₂ = +0.4　b = −0.2</p>
    <h1>转动三枚参数旋钮，4 道题的平均罚分真的会变</h1>
  </header>

  <main class="tuning-ledger ledger min0" data-tuning-widget>
    <section class="panel knob-panel min0" aria-label="参数旋钮">
      <div class="rail-intro">
        <strong>参数改动 → 四次重算</strong>
        <p>自由试调：先让平均罚分低于起点 0.887。</p>
      </div>
      <div class="knob-row min0">
        <div class="param" data-param="w1">
          <div class="dial knob" data-dial tabindex="0" role="slider" aria-label="权重 w₁" aria-valuemin="-4" aria-valuemax="4" aria-valuenow="-0.8">
            <span class="ticks" aria-hidden="true"></span><span class="needle" aria-hidden="true"></span><span class="dial-dot" aria-hidden="true"></span>
          </div>
          <span class="param-name">w₁</span><output class="param-value" data-value>−0.8</output>
          <input data-range type="range" min="-4" max="4" step="0.1" value="-0.8" aria-label="精确调整权重 w₁">
        </div>
        <div class="param" data-param="w2">
          <div class="dial knob" data-dial tabindex="0" role="slider" aria-label="权重 w₂" aria-valuemin="-4" aria-valuemax="4" aria-valuenow="0.4">
            <span class="ticks" aria-hidden="true"></span><span class="needle" aria-hidden="true"></span><span class="dial-dot" aria-hidden="true"></span>
          </div>
          <span class="param-name">w₂</span><output class="param-value" data-value>+0.4</output>
          <input data-range type="range" min="-4" max="4" step="0.1" value="0.4" aria-label="精确调整权重 w₂">
        </div>
        <div class="param" data-param="b">
          <div class="dial knob" data-dial tabindex="0" role="slider" aria-label="偏置 b" aria-valuemin="-4" aria-valuemax="4" aria-valuenow="-0.2">
            <span class="ticks" aria-hidden="true"></span><span class="needle" aria-hidden="true"></span><span class="dial-dot" aria-hidden="true"></span>
          </div>
          <span class="param-name">b</span><output class="param-value" data-value>−0.2</output>
          <input data-range type="range" min="-4" max="4" step="0.1" value="-0.2" aria-label="精确调整偏置 b">
        </div>
      </div>
    </section>

    <section class="panel ledger-panel min0" aria-label="四行实验账本">
      <table>
        <colgroup><col style="width:10%"><col style="width:17%"><col style="width:11%"><col style="width:16%"><col style="width:16%"><col style="width:13%"><col style="width:17%"></colgroup>
        <thead><tr><th>样本</th><th>输入</th><th>目标</th><th>总分</th><th>预测</th><th>判定</th><th>罚分</th></tr></thead>
        <tbody data-rows></tbody>
      </table>
    </section>

    <section class="panel summary" aria-label="平均罚分汇总">
      <div class="score-line">
        <span class="score-label">平均罚分</span>
        <output class="score" data-average>0.887</output>
        <span class="delta same" data-delta>起点</span>
      </div>
      <div class="summary-actions">
        <p class="hint">z = w₁x₁ + w₂x₂ + b　·　4 行罚分取平均</p>
        <button class="btn" type="button" data-reset>恢复起点</button>
      </div>
      <div class="sr-only" data-status aria-live="polite"></div>
    </section>
  </main>

  <footer class="p10-foot">
    <p class="p10-conclusion">学习在数学上首先是一个具体动作：改变参数，再检查平均罚分有没有下降。</p>
    <p class="p10-next">如果不靠猜，怎样知道某一枚旋钮该往哪边转？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  const root = document.querySelector('[data-tuning-widget]');
  if (!root) return;
  const initial = Object.freeze({w1:-0.8,w2:0.4,b:-0.2});
  const samples = Object.freeze([
    {id:'A',x1:0,x2:0,t:0},{id:'B',x1:1,x2:0,t:1},
    {id:'C',x1:0,x2:1,t:1},{id:'D',x1:1,x2:1,t:1}
  ]);
  let state = {...initial};
  let active = null;
  let destroyed = false;
  const rows = root.querySelector('[data-rows]');
  const average = root.querySelector('[data-average]');
  const delta = root.querySelector('[data-delta]');
  const status = root.querySelector('[data-status]');
  const controls = [...root.querySelectorAll('[data-param]')].map(el => ({
    key:el.dataset.param, el, dial:el.querySelector('[data-dial]'), range:el.querySelector('[data-range]'), value:el.querySelector('[data-value]')
  }));

  const clamp = v => Math.max(-4, Math.min(4, Math.round(v * 10) / 10));
  const fmtSigned = v => `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(1)}`;
  const sigmoid = z => 1 / (1 + Math.exp(-z));
  function compute(){
    const result = samples.map(s => {
      const z = state.w1*s.x1 + state.w2*s.x2 + state.b;
      const p = sigmoid(z);
      const loss = -(s.t*Math.log(p) + (1-s.t)*Math.log(1-p));
      return {...s,z,p,decision:p>=0.5?1:0,loss};
    });
    return {result,mean:result.reduce((sum,r)=>sum+r.loss,0)/result.length};
  }
  const baseMean = (() => {
    const old = state; state={...initial}; const m=compute().mean; state=old; return m;
  })();

  function transition(action){
    if (action.type === 'set') state = {...state,[action.key]:clamp(action.value)};
    if (action.type === 'reset') state = {...initial};
    render();
  }
  function render(){
    const out = compute();
    controls.forEach(c => {
      const v = state[c.key];
      c.dial.style.setProperty('--angle', `${-135 + ((v+4)/8)*270}deg`);
      c.dial.setAttribute('aria-valuenow', v.toFixed(1));
      c.dial.setAttribute('aria-valuetext', fmtSigned(v));
      c.range.value = v.toFixed(1);
      c.value.textContent = fmtSigned(v);
    });
    rows.innerHTML = out.result.map(r => `<tr>
      <td class="sample-name">${r.id}</td><td class="given">(${r.x1}, ${r.x2})</td><td class="given">${r.t}</td>
      <td class="signal">${r.z.toFixed(3)}</td><td class="signal">${r.p.toFixed(3)}</td>
      <td><span class="decision">${r.decision}</span></td><td class="loss">${r.loss.toFixed(3)}</td>
    </tr>`).join('');
    average.textContent = out.mean.toFixed(3);
    const d = out.mean - baseMean;
    delta.className = 'delta ' + (d < -0.0005 ? 'lower' : d > 0.0005 ? 'higher' : 'same');
    delta.textContent = d < -0.0005 ? `比起点低 ${Math.abs(d).toFixed(3)}` : d > 0.0005 ? `比起点高 ${d.toFixed(3)}` : '起点';
  }
  function announce(){
    const out=compute();
    status.textContent=`平均罚分 ${out.mean.toFixed(3)}，${delta.textContent}`;
  }
  function setFromPointer(control,e){
    const p=Deck.pt(control.dial,e);
    transition({type:'set',key:control.key,value:-4 + (p.x/control.dial.offsetWidth)*8});
  }
  function pointerDown(control,e){
    if(e.button!==undefined && e.button!==0) return;
    active={control,id:e.pointerId};
    control.dial.setPointerCapture(e.pointerId);
    setFromPointer(control,e);
  }
  function pointerMove(control,e){if(active && active.id===e.pointerId && active.control===control)setFromPointer(control,e)}
  function pointerEnd(control,e){
    if(!active || active.id!==e.pointerId) return;
    if(control.dial.hasPointerCapture(e.pointerId)) control.dial.releasePointerCapture(e.pointerId);
    active=null; announce();
  }
  function keyAdjust(control,e){
    let value=state[control.key];
    if(e.key==='ArrowLeft'||e.key==='ArrowDown') value-=e.shiftKey?0.5:0.1;
    else if(e.key==='ArrowRight'||e.key==='ArrowUp') value+=e.shiftKey?0.5:0.1;
    else if(e.key==='Home') value=-4;
    else if(e.key==='End') value=4;
    else return;
    e.preventDefault(); e.stopPropagation(); transition({type:'set',key:control.key,value}); announce();
  }
  const listeners=[];
  function on(el,type,fn){el.addEventListener(type,fn);listeners.push(()=>el.removeEventListener(type,fn))}
  controls.forEach(c => {
    on(c.dial,'pointerdown',e=>pointerDown(c,e)); on(c.dial,'pointermove',e=>pointerMove(c,e));
    on(c.dial,'pointerup',e=>pointerEnd(c,e)); on(c.dial,'pointercancel',e=>pointerEnd(c,e));
    on(c.dial,'keydown',e=>keyAdjust(c,e));
    on(c.range,'input',()=>transition({type:'set',key:c.key,value:Number(c.range.value)}));
    on(c.range,'change',announce);
  });
  const reset=root.querySelector('[data-reset]');
  on(reset,'click',()=>{active=null;transition({type:'reset'});announce()});
  render();
  root.destroyTuningWidget=()=>{if(destroyed)return;destroyed=true;active=null;listeners.splice(0).forEach(off=>off());delete root.destroyTuningWidget};
  Deck.init({index:10,total:22});
})();
</script>
</body>
</html>
