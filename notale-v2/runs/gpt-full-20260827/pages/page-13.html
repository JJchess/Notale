<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{display:flex;flex-direction:column;gap:0;}
  .page-head{height:104px;flex:0 0 104px;display:flex;flex-direction:column;justify-content:flex-start;}
  .kicker{margin:0 0 7px;color:var(--accent);font-size:var(--fs-label);font-weight:700;letter-spacing:.12em;}
  h1{margin:0;color:var(--text);font-size:var(--fs-h1);line-height:1.2;font-weight:750;letter-spacing:-.02em;}
  .lesson{flex:1;min-height:0;display:flex;flex-direction:column;}
  .k-generalization{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;}
  .claim{position:relative;z-index:2;width:1080px;min-height:78px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-size:var(--fs-lead);font-weight:700;line-height:1.35;box-shadow:0 3px 0 rgba(49,54,59,.06);}
  .claim .formula{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text);margin:0 12px;white-space:nowrap;}
  .claim strong{color:var(--error);font-size:26px;}
  .trunk{position:relative;width:100%;height:48px;flex:0 0 48px;}
  .trunk::before{content:"";position:absolute;left:50%;top:0;height:22px;border-left:2px solid var(--line);}
  .trunk::after{content:"";position:absolute;left:16.66%;right:16.66%;top:22px;border-top:2px solid var(--line);}
  .branch{position:absolute;top:22px;height:26px;border-left:2px solid var(--line);}
  .branch.left{left:16.66%;}.branch.mid{left:50%;}.branch.right{left:83.33%;}
  .k-generalization > .supports{position:relative;width:100%;flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;gap:20px;}
  .scale-axis{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;}
  .scale-axis path{fill:none;stroke:var(--line);stroke-width:2;}
  .scale-axis .arrowhead{fill:var(--line);stroke:none;}
  .support{z-index:1;}
  .k-generalization > .supports > .support{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;position:relative;padding:10px 22px 0;background:#C9C1B2;border-top:1px solid var(--line);}
  .support:nth-child(1){background-color:#C9C1B2;background-image:repeating-linear-gradient(135deg,rgba(49,54,59,.13) 0 2px,transparent 2px 30px);}
  .support:nth-child(2){background-color:#C9C1B2;background-image:repeating-linear-gradient(135deg,rgba(49,54,59,.13) 0 2px,transparent 2px 15px);}
  .support:nth-child(3){background-color:#C9C1B2;background-image:repeating-linear-gradient(135deg,rgba(49,54,59,.13) 0 2px,transparent 2px 8px);}
  .case-label{display:flex;align-items:baseline;gap:10px;height:43px;color:var(--muted);font-size:var(--fs-label);font-weight:700;}
  .case-label .count{font-family:var(--font-mono);font-size:27px;line-height:1;color:var(--text);font-variant-numeric:tabular-nums;}
  .object-field{height:270px;width:100%;display:flex;align-items:center;justify-content:center;position:relative;}
  .single-wrap{width:330px;height:250px;position:relative;display:flex;align-items:center;justify-content:center;}
  .knob{position:relative;border:2px solid var(--text);border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 8px rgba(49,54,59,.06),0 3px 0 rgba(49,54,59,.12);}
  .knob::before{content:"";position:absolute;width:3px;height:35%;left:calc(50% - 1.5px);top:10%;border-radius:2px;background:var(--text);transform-origin:50% 100%;transform:rotate(28deg);}
  .knob.big-knob{width:154px;height:154px;}
  .tick-ring{position:absolute;width:212px;height:212px;border-radius:50%;background:repeating-conic-gradient(from -65deg,var(--line) 0 1deg,transparent 1deg 13deg);-webkit-mask:radial-gradient(circle,transparent 0 96px,#000 97px 105px,transparent 106px);mask:radial-gradient(circle,transparent 0 96px,#000 97px 105px,transparent 106px);}
  .probe{position:absolute;top:104px;width:60px;height:40px;color:var(--accent);}
  .probe.left{left:0;transform:scaleX(-1)}.probe.right{right:0;}
  .probe svg{width:100%;height:100%;overflow:visible;}
  .probe line,.probe polyline{stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .probe-label{position:absolute;top:158px;color:var(--accent);font-size:var(--fs-label);font-weight:700;white-space:nowrap;}
  .probe-label.left{left:0}.probe-label.right{right:0}
  .array-wrap{width:420px;height:254px;display:grid;grid-template-columns:repeat(5,58px) 70px;grid-template-rows:repeat(4,52px);gap:9px 9px;align-content:center;justify-content:center;position:relative;}
  .mini-knob{width:49px;height:49px;border-width:1.5px;box-shadow:inset 0 0 0 4px rgba(49,54,59,.05);}
  .mini-knob::before{width:2px;left:calc(50% - 1px);transform:rotate(28deg);}
  .ellipsis{position:absolute;right:4px;top:80px;font-family:var(--font-mono);font-size:30px;color:var(--muted);letter-spacing:4px;writing-mode:vertical-rl;}
  .times-two{position:absolute;right:2px;top:202px;display:flex;align-items:center;gap:4px;color:var(--accent);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;}
  .times-two svg{width:48px;height:50px;overflow:visible;}
  .times-two path{stroke:var(--accent);stroke-width:2.5;fill:none;}
  .result{width:88%;min-height:88px;border-top:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px;}
  .result .question{font-size:var(--fs-body);line-height:1.35;color:var(--text);}
  .side-tests{width:88%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .side-test{padding:10px 8px;border:1px solid var(--line);background:var(--paper);text-align:center;font-family:var(--font-mono);font-size:var(--fs-sec);line-height:1.3;color:var(--text);}
  .side-test b{display:block;margin-top:3px;color:var(--error);font-size:var(--fs-body);}
  .result .tries{display:flex;align-items:baseline;gap:8px;white-space:nowrap;color:var(--error);font-weight:700;}
  .tries .num{font-family:var(--font-mono);font-size:38px;line-height:1;font-variant-numeric:tabular-nums;}
  .tries .unit{font-size:var(--fs-body);}
  .hundred-grid{width:380px;height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
  .knob-row{height:23px;white-space:pre;color:var(--text);font-family:var(--font-mono);font-size:23px;line-height:1;letter-spacing:3px;}
  .mini-knob{display:flex;align-items:center;justify-content:center;color:var(--paper);background:var(--text);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:800;line-height:1;}
  .bottom-band{height:112px;flex:0 0 112px;display:grid;grid-template-columns:1fr 480px;align-items:center;border-top:1px solid var(--line);margin-top:10px;}
  .conclusion{margin:0;padding-right:42px;font-family:var(--font-serif);font-size:var(--fs-lead);line-height:1.45;color:var(--text);}
  .conclusion strong{color:var(--error);font-weight:700;}
  .next{border-left:1px solid var(--line);padding-left:34px;}
  .next-label{display:block;margin-bottom:6px;color:var(--accent);font-size:var(--fs-label);font-weight:700;letter-spacing:.08em;}
  .next p{margin:0;font-size:var(--fs-body);line-height:1.4;color:var(--text);font-weight:650;}
</style>
</head>
<body data-page="13" data-total="22">
<div id="stage">
  <header class="page-head">
    <p class="kicker">从下坡到分工</p>
    <h1>一个旋钮能试两边，一千个旋钮就要试两千次</h1>
  </header>

  <main class="lesson min0 focus" aria-labelledby="scale-claim">
    <section class="k-generalization min0" aria-label="逐个试探的规模代价">
      <div class="claim" id="scale-claim">
        <span>逐个试两边：</span><span class="formula">2 × 参数数 = 试探次数</span>
      </div>
      <div class="trunk" aria-hidden="true"><i class="branch left"></i><i class="branch mid"></i><i class="branch right"></i></div>

      <div class="supports min0">
        <svg class="scale-axis" viewBox="0 0 1488 430" preserveAspectRatio="none" aria-hidden="true"><path d="M22 414 H1450"/><path d="M496 8 V414 M992 8 V414"/><path d="M60 402 V426 M744 402 V426 M1428 402 V426"/><path d="M65 390 C370 350 1120 350 1420 390"/><path class="arrowhead" d="M1420 390 l-16 -8 l5 16 z"/></svg>
        <article class="support min0" aria-label="一枚旋钮需要试探两次">
          <div class="case-label"><span class="count">1</span><span>枚旋钮</span></div>
          <div class="object-field">
            <div class="single-wrap" aria-hidden="true">
              <div class="tick-ring"></div>
              <div class="knob big-knob"></div>
              <span class="probe left"><svg viewBox="0 0 48 40"><line x1="4" y1="20" x2="40" y2="20"/><polyline points="31,11 40,20 31,29"/></svg></span>
              <span class="probe right"><svg viewBox="0 0 48 40"><line x1="4" y1="20" x2="40" y2="20"/><polyline points="31,11 40,20 31,29"/></svg></span>
              <span class="probe-label left">左边</span><span class="probe-label right">右边</span>
            </div>
          </div>
          <div class="result">
            <div class="question">左边还是右边？<br>试两次就知道</div>
            <div class="tries"><span class="num">2</span><span class="unit">次</span></div>
          </div>
          <div class="side-tests" aria-label="左右各试一次"><div class="side-test">← 左边<b>1 次</b></div><div class="side-test">右边 →<b>1 次</b></div></div>
        </article>

        <article class="support min0" aria-label="一百枚旋钮需要试探二百次">
          <div class="case-label"><span class="count">100</span><span>枚旋钮</span></div>
          <div class="object-field">
            <div class="hundred-grid" id="hundred-grid" aria-hidden="true"></div>
          </div>
          <div class="result">
            <div class="question">每枚都试，<br>次数开始堆积</div>
            <div class="tries"><span class="num">200</span><span class="unit">次</span></div>
          </div>
          <div class="side-tests" aria-label="左右各试一百次"><div class="side-test">← 左边<b>100 次</b></div><div class="side-test">右边 →<b>100 次</b></div></div>
        </article>

        <article class="support min0" aria-label="一千枚旋钮需要试探两千次">
          <div class="case-label"><span class="count">1,000</span><span>枚旋钮</span></div>
          <div class="object-field">
            <div class="array-wrap" aria-hidden="true">
              <i class="knob mini-knob"></i><i class="knob mini-knob"></i><i class="knob mini-knob"></i><i class="knob mini-knob"></i><i class="knob mini-knob"></i>
              <i class="knob mini-knob"></i><i class="knob mini-knob"></i><i class="knob mini-knob"></i><i class="knob mini-knob"></i><i class="knob mini-knob"></i>
              <i class="knob mini-knob"></i><i class="knob mini-knob"></i><i class="knob mini-knob"></i><i class="knob mini-knob"></i><i class="knob mini-knob"></i>
              <i class="knob mini-knob"></i><i class="knob mini-knob"></i><i class="knob mini-knob"></i><i class="knob mini-knob"></i><i class="knob mini-knob"></i>
              <span class="ellipsis">…</span>
              <span class="times-two"><svg viewBox="0 0 48 50"><path d="M9 4 C37 8 37 19 18 24 C37 29 37 41 9 46"/></svg>每枚 × 2</span>
            </div>
          </div>
          <div class="result">
            <div class="question">大网络不能只靠<br>逐枚探路</div>
            <div class="tries"><span class="num">2,000</span><span class="unit">次</span></div>
          </div>
          <div class="side-tests" aria-label="左右各试一千次"><div class="side-test">← 左边<b>1,000 次</b></div><div class="side-test">右边 →<b>1,000 次</b></div></div>
        </article>
      </div>
    </section>

    <footer class="bottom-band">
      <p class="conclusion">网络越大，越需要一种更高效的方法，把<strong>最终错误分配到每个参数</strong>。</p>
      <div class="next"><span class="next-label">下一问</span><p>把多个神经元叠成隐藏层，会得到什么新能力？</p></div>
    </footer>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  const hundred = document.getElementById('hundred-grid');
  for(let i=0;i<10;i+=1){const row=document.createElement('div');row.className='knob-row';row.textContent='◉ ◉ ◉ ◉ ◉ ◉ ◉ ◉ ◉ ◉';hundred.appendChild(row);}
  document.querySelectorAll('.mini-knob').forEach(k=>{k.textContent='／';});
  Deck.init({index:13,total:22});
</script>
</body>
</html>
