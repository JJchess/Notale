<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:0;}
#stage .p14-head{height:116px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--line);}
#stage .p14-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.14em;color:var(--accent);margin-bottom:12px;}
#stage h1{margin:0;max-width:1280px;font:700 var(--fs-h1)/1.22 var(--font-sans);color:var(--text);}
#stage .p14-widget{flex:1;min-height:0;display:grid;grid-template-rows:76px minmax(0,1fr) 78px;gap:12px;padding-top:14px;}
#stage .p14-controls{display:flex;align-items:center;gap:12px;min-width:0;}
#stage .p14-controls .hint{margin-right:auto;white-space:nowrap;}
#stage .p14-toggle{min-width:168px;height:48px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);font:600 var(--fs-label)/1 var(--font-sans);cursor:pointer;position:relative;}
#stage .p14-toggle[aria-pressed="true"]{border-color:var(--signal);background:color-mix(in srgb,var(--signal) 9%,transparent);}
#stage .p14-toggle.is-current{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px;}
#stage .p14-toggle:focus-visible,#stage .p14-reset:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
#stage .p14-toggle .state{font:500 var(--fs-tick)/1 var(--font-mono);margin-left:7px;color:var(--muted);}
#stage .p14-toggle[aria-pressed="true"] .state{color:var(--signal);}
#stage .p14-reset{height:48px;padding:0 20px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);font:600 var(--fs-label)/1 var(--font-sans);cursor:pointer;}
#stage .p14-triptych{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;min-height:0;}
#stage .p14-pane{display:grid;grid-template-rows:48px minmax(0,1fr);min-width:0;min-height:0;border-top:2px solid var(--line);}
#stage .p14-pane.is-focus{border-top-color:var(--accent);}
#stage .p14-pane-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 8px;}
#stage .p14-pane h2{margin:0;font:700 var(--fs-h2)/1 var(--font-sans);}
#stage .p14-pane-note{font:500 var(--fs-label)/1.2 var(--font-sans);color:var(--muted);white-space:nowrap;}
#stage .p14-pane.is-focus .p14-pane-note{color:var(--accent);}
#stage .p14-box{min-width:0;min-height:0;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.22);overflow:hidden;}
#stage .p14-svg{display:block;width:100%;height:100%;}
#stage .p14-svg .grid{stroke:var(--line);stroke-width:1;opacity:.42;vector-effect:non-scaling-stroke;}
#stage .p14-svg .axis{stroke:var(--text);stroke-width:1.4;opacity:.7;vector-effect:non-scaling-stroke;}
#stage .p14-svg .tick{fill:var(--muted);font:13px var(--font-mono);}
#stage .p14-svg .axisname{fill:var(--text);font:600 15px var(--font-sans);}
#stage .p14-svg .region{fill:var(--signal);opacity:.13;}
#stage .p14-svg .half{fill:var(--accent);opacity:.12;}
#stage .p14-svg .bline{stroke:var(--signal);stroke-width:4;vector-effect:non-scaling-stroke;}
#stage .p14-svg .bline.current{stroke:var(--accent);stroke-width:5;}
#stage .p14-svg .bline.off{stroke:var(--muted);stroke-width:2.5;stroke-dasharray:6 6;opacity:.7;}
#stage .p14-svg .blabel{fill:var(--text);font:700 14px var(--font-mono);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round;}
#stage .p14-svg .sample1{fill:var(--signal);stroke:var(--bg);stroke-width:2;}
#stage .p14-svg .sample0{fill:var(--text);stroke:var(--bg);stroke-width:2;}
#stage .p14-svg .sample-label{fill:var(--text);font:700 13px var(--font-mono);paint-order:stroke;stroke:var(--bg);stroke-width:4px;}
#stage .p14-svg .empty{fill:var(--muted);font:600 18px var(--font-sans);text-anchor:middle;}
#stage .p14-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:28px;border-top:1px solid var(--line);}
#stage .p14-conclusion{font:600 var(--fs-lead)/1.42 var(--font-serif);color:var(--text);}
#stage .p14-next{max-width:470px;text-align:right;font:600 var(--fs-sec)/1.4 var(--font-sans);color:var(--signal);}
</style>
</head>
<body data-page="14" data-total="22">
<div id="stage">
  <header class="p14-head">
    <div class="p14-kicker">HIDDEN LAYER</div>
    <h1>隐藏层不是画一条更聪明的线，而是组合多条简单边界</h1>
  </header>

  <section class="p14-widget" data-p14-widget aria-label="隐藏边界组合实验">
    <div class="p14-controls">
      <p class="hint">试着关掉一条：组合区域会从哪一边打开？</p>
      <button class="p14-toggle is-current" type="button" data-id="H1" aria-pressed="true">H1 左边挡板 <span class="state">已开启</span></button>
      <button class="p14-toggle" type="button" data-id="H2" aria-pressed="true">H2 右边挡板 <span class="state">已开启</span></button>
      <button class="p14-toggle" type="button" data-id="H3" aria-pressed="true">H3 下边挡板 <span class="state">已开启</span></button>
      <button class="p14-toggle" type="button" data-id="H4" aria-pressed="true">H4 上边挡板 <span class="state">已开启</span></button>
      <button class="p14-reset" type="button" data-reset>恢复四条</button>
    </div>

    <div class="triptych k-classification p14-triptych min0">
      <article class="p14-pane is-focus min0">
        <div class="p14-pane-head"><h2 data-single-title>H1 左边挡板</h2><span class="p14-pane-note" data-single-state>已开启 · 保留右侧</span></div>
        <div class="box p14-box min0"><svg class="p14-svg" data-view="single" viewBox="0 0 440 430" role="img" aria-label="最近操作的单条隐藏边界"></svg></div>
      </article>
      <article class="p14-pane min0">
        <div class="p14-pane-head"><h2>已开启的简单边界</h2><span class="p14-pane-note">每条线只切一次</span></div>
        <div class="box p14-box min0"><svg class="p14-svg" data-view="stack" viewBox="0 0 440 430" role="img" aria-label="四条简单边界的叠放"></svg></div>
      </article>
      <article class="p14-pane min0">
        <div class="p14-pane-head"><h2>下一层组合</h2><span class="p14-pane-note" data-combo-note>四条都满足 → 预测 1</span></div>
        <div class="box p14-box min0"><svg class="p14-svg" data-view="combo" viewBox="0 0 440 430" role="img" aria-label="开启边界半平面的交集"></svg></div>
      </article>
    </div>

    <footer class="p14-foot">
      <div class="p14-conclusion">每个隐藏神经元只负责一次直线切分；下一层把这些切分合起来，就能围出分区边界。</div>
      <div class="p14-next">放入一个样本后，它怎样依次经过这些层并得到预测？</div>
    </footer>
  </section>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  const root = document.querySelector('[data-p14-widget]');
  if (!root) return;
  const buttons = [...root.querySelectorAll('[data-id]')];
  const views = Object.fromEntries([...root.querySelectorAll('[data-view]')].map(v => [v.dataset.view, v]));
  const reset = root.querySelector('[data-reset]');
  const title = root.querySelector('[data-single-title]');
  const singleState = root.querySelector('[data-single-state]');
  const comboNote = root.querySelector('[data-combo-note]');
  const defs = {
    H1:{name:'左边挡板',side:'保留右侧',axis:'x',value:-.5},
    H2:{name:'右边挡板',side:'保留左侧',axis:'x',value:.5},
    H3:{name:'下边挡板',side:'保留上侧',axis:'y',value:-.5},
    H4:{name:'上边挡板',side:'保留下侧',axis:'y',value:.5}
  };
  const initial = () => ({on:{H1:true,H2:true,H3:true,H4:true}, selected:'H1'});
  let state = initial();
  let destroyed = false;
  const plot = {x:58,y:26,w:344,h:344};
  const ticks = [-1,-.5,0,.5,1];
  const samples = [
    [-.2,-.2,1],[.2,-.2,1],[-.2,.2,1],[.2,.2,1],
    [-.8,0,0],[.8,0,0],[0,-.8,0],[0,.8,0],
    [-.75,-.75,0],[-.75,.75,0],[.75,-.75,0],[.75,.75,0]
  ];
  const sx = x => plot.x + (x+1)*plot.w/2;
  const sy = y => plot.y + (1-y)*plot.h/2;
  const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const lineGeom = id => {
    const d=defs[id];
    return d.axis==='x'
      ? {x1:sx(d.value),y1:plot.y,x2:sx(d.value),y2:plot.y+plot.h,lx:sx(d.value)+7,ly:plot.y+18}
      : {x1:plot.x,y1:sy(d.value),x2:plot.x+plot.w,y2:sy(d.value),lx:plot.x+8,ly:sy(d.value)-8};
  };
  function baseMarkup(prefix){
    let s='<defs>';
    ticks.forEach((t,i)=>{s+=`<text id="${prefix}t${i}" class="tick">${t}</text>`;});
    s+=`<text id="${prefix}s0" class="sample-label">0</text><text id="${prefix}s1" class="sample-label">1</text></defs>`;
    s+=`<rect x="${plot.x}" y="${plot.y}" width="${plot.w}" height="${plot.h}" fill="none" stroke="var(--line)"/>`;
    ticks.forEach((t,i)=>{
      s+=`<line class="grid" x1="${sx(t)}" y1="${plot.y}" x2="${sx(t)}" y2="${plot.y+plot.h}"/>`;
      s+=`<line class="grid" x1="${plot.x}" y1="${sy(t)}" x2="${plot.x+plot.w}" y2="${sy(t)}"/>`;
      s+=`<use href="#${prefix}t${i}" x="${sx(t)}" y="${plot.y+plot.h+23}" text-anchor="middle"/><use href="#${prefix}t${i}" x="${plot.x-10}" y="${sy(t)+4}" text-anchor="end"/>`;
    });
    s+=`<line class="axis" x1="${plot.x}" y1="${sy(0)}" x2="${plot.x+plot.w}" y2="${sy(0)}"/><line class="axis" x1="${sx(0)}" y1="${plot.y}" x2="${sx(0)}" y2="${plot.y+plot.h}"/>`;
    s+=`<text class="axisname" x="${plot.x+plot.w+13}" y="${sy(0)+5}">x₁</text><text class="axisname" x="${sx(0)+8}" y="${plot.y-8}">x₂</text>`;
    return s;
  }
  function sampleMarkup(prefix){
    return samples.map(([x,y,c])=>{
      const px=sx(x),py=sy(y); const dx=x>.6?-22:12; const dy=y>.65?18:-10;
      return `<circle class="sample${c}" cx="${px}" cy="${py}" r="9"/><use href="#${prefix}s${c}" x="${px+dx}" y="${py+dy}"/>`;
    }).join('');
  }
  function boundaryMarkup(id, mode){
    const g=lineGeom(id); const on=state.on[id];
    const cls=`bline ${id===state.selected?'current ':''}${on?'':'off'}`;
    return `<line class="${cls}" x1="${g.x1}" y1="${g.y1}" x2="${g.x2}" y2="${g.y2}"/><text class="blabel" x="${g.lx}" y="${g.ly}">${id}</text>`;
  }
  function halfRect(id){
    if(!state.on[id]) return '';
    if(id==='H1') return `<rect class="half" x="${sx(-.5)}" y="${plot.y}" width="${sx(1)-sx(-.5)}" height="${plot.h}"/>`;
    if(id==='H2') return `<rect class="half" x="${plot.x}" y="${plot.y}" width="${sx(.5)-plot.x}" height="${plot.h}"/>`;
    if(id==='H3') return `<rect class="half" x="${plot.x}" y="${sy(1)}" width="${plot.w}" height="${sy(-.5)-sy(1)}"/>`;
    return `<rect class="half" x="${plot.x}" y="${sy(.5)}" width="${plot.w}" height="${sy(-1)-sy(.5)}"/>`;
  }
  function intersection(){
    const ids=Object.keys(defs).filter(id=>state.on[id]);
    if(!ids.length) return '';
    const xmin=state.on.H1?-.5:-1, xmax=state.on.H2?.5:1;
    const ymin=state.on.H3?-.5:-1, ymax=state.on.H4?.5:1;
    return `<rect class="region" x="${sx(xmin)}" y="${sy(ymax)}" width="${sx(xmax)-sx(xmin)}" height="${sy(ymin)-sy(ymax)}"/>`;
  }
  function render(){
    if(destroyed) return;
    const sel=state.selected, d=defs[sel], active=state.on[sel];
    title.textContent=`${sel} ${d.name}`;
    singleState.textContent=`${active?'已开启':'已关闭'} · ${d.side}`;
    buttons.forEach(btn=>{
      const on=state.on[btn.dataset.id];
      btn.setAttribute('aria-pressed',String(on));
      btn.classList.toggle('is-current',btn.dataset.id===sel);
      btn.querySelector('.state').textContent=on?'已开启':'已关闭';
    });
    views.single.innerHTML=baseMarkup('a')+halfRect(sel)+boundaryMarkup(sel,'single')+sampleMarkup('a');
    views.stack.innerHTML=baseMarkup('b')+Object.keys(defs).map(id=>boundaryMarkup(id,'stack')).join('')+sampleMarkup('b');
    const enabled=Object.keys(defs).filter(id=>state.on[id]);
    views.combo.innerHTML=baseMarkup('c')+intersection()+enabled.map(id=>boundaryMarkup(id,'combo')).join('')+sampleMarkup('c')+(enabled.length?'':`<text class="empty" x="230" y="208">还没有可组合的边界</text>`);
    comboNote.textContent=enabled.length===4?'四条都满足 → 预测 1':enabled.length?`${enabled.length} 条条件的交集`:'没有交集条件';
  }
  function toggle(id){
    state={on:{...state.on,[id]:!state.on[id]},selected:id};
    render();
  }
  const listeners=[];
  buttons.forEach(btn=>{const fn=()=>toggle(btn.dataset.id);btn.addEventListener('click',fn);listeners.push([btn,'click',fn]);});
  const onReset=()=>{state=initial();render();};
  reset.addEventListener('click',onReset);listeners.push([reset,'click',onReset]);
  render();
  root.destroyP14=()=>{if(destroyed)return;destroyed=true;listeners.forEach(([el,type,fn])=>el.removeEventListener(type,fn));delete root.destroyP14;};
  Deck.init({index:14,total:22});
})();
</script>
</body>
</html>
