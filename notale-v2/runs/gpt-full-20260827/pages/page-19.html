<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:14px}
    .p19-head{flex:0 0 76px;display:flex;flex-direction:column;justify-content:center;gap:4px}
    .p19-head .kicker{font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.12em;color:var(--accent)}
    .p19-head h1{margin:0;font:700 var(--fs-h1)/1.2 var(--font-sans);color:var(--text)}
    #train-console{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
    #train-console .loop-band{height:70px;display:flex;align-items:stretch;gap:10px}
    #train-console .step{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.28);font:650 var(--fs-body)/1.2 var(--font-sans);transition:border-color 120ms,box-shadow 120ms,background 120ms}
    #train-console .step .n{font:700 var(--fs-label)/1 var(--font-mono);color:var(--muted)}
    #train-console .step.active{border:3px solid var(--accent);background:rgba(217,119,6,.08);box-shadow:0 0 0 2px rgba(217,119,6,.10) inset}
    #train-console .step.active .n{color:var(--accent)}
    #train-console .arw{width:28px;display:flex;align-items:center;justify-content:center;color:var(--signal);font-size:28px;font-weight:700}
    #train-console .workbench{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:122px}
    #train-console .field-side{display:flex;flex-direction:column;min-width:0;min-height:0}
    #train-console .field-top,#train-console .chart-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:8px}
    #train-console h2{margin:0;font:700 var(--fs-h2)/1.2 var(--font-sans)}
    #train-console .network{font:600 var(--fs-label)/1.3 var(--font-mono);color:var(--signal);white-space:nowrap}
    #train-console .field-wrap{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#ebe6da}
    #train-console canvas{display:block;image-rendering:auto}
    #train-console .field-axis{position:absolute;font:600 var(--fs-label)/1 var(--font-mono);color:var(--text);pointer-events:none;background:rgba(244,241,232,.82);padding:3px 6px;border-radius:5px}
    #train-console .axis-x{right:12px;bottom:10px}.axis-y{left:12px;top:10px}
    #train-console .legend{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:8px;color:var(--muted);font:500 var(--fs-label)/1.3 var(--font-sans)}
    #train-console .legend i{display:inline-block;vertical-align:-3px;margin-right:6px}
    #train-console .dot-key{width:18px;height:18px;border-radius:50%;background:var(--text);border:2px solid var(--bg)}
    #train-console .bg-key{width:22px;height:14px;background:rgba(31,90,122,.35);border:1px solid var(--signal)}
    #train-console .right-side{display:flex;flex-direction:column;min-width:0;min-height:0}
    #train-console .readouts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
    #train-console .readout{min-width:0;padding:9px 10px;border-bottom:2px solid var(--line);background:rgba(255,255,255,.24)}
    #train-console .readout span{display:block;color:var(--muted);font:500 var(--fs-label)/1.2 var(--font-sans)}
    #train-console .readout output{display:block;margin-top:3px;font:700 22px/1.1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap}
    #train-console .readout.loss output{color:var(--error)}
    #train-console .chart-panel{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.28);padding:12px 14px 8px}
    #train-console #loss-chart{flex:1;min-height:210px;width:100%}
    #train-console .control-rail{display:flex;align-items:center;gap:12px;margin-top:10px;min-height:48px}
    #train-console .btns{display:flex;gap:8px}
    #train-console .btn{min-width:74px}
    #train-console .lr-group{display:flex;align-items:center;gap:7px;margin-left:auto;border:0;padding:0}
    #train-console .lr-group legend{float:left;margin-right:4px;color:var(--muted);font:600 var(--fs-label)/1.2 var(--font-sans)}
    #train-console .lr{position:relative}
    #train-console .lr input{position:absolute;opacity:0;pointer-events:none}
    #train-console .lr label{display:block;min-width:58px;padding:8px 10px;text-align:center;border:1px solid var(--line);border-radius:9px;background:transparent;font:650 var(--fs-label)/1 var(--font-mono);cursor:pointer}
    #train-console .lr input:checked+label{border:2px solid var(--accent);background:rgba(217,119,6,.09);color:var(--text)}
    #train-console .lr input:focus-visible+label{outline:3px solid var(--focus);outline-offset:2px}
    #train-console .status-line{height:27px;margin-top:7px;color:var(--muted);font:500 var(--fs-sec)/1.35 var(--font-sans)}
    #train-console .status-line.unstable{color:var(--error);font-weight:700}
    .p19-foot{flex:0 0 63px;display:flex;align-items:flex-start;justify-content:space-between;gap:70px;border-top:1px solid var(--line);padding-top:10px}
    .p19-foot .conclusion{margin:0;max-width:820px;font-size:var(--fs-body)}
    .p19-foot .next{margin:0;max-width:500px;text-align:right;color:var(--signal);font:650 var(--fs-sec)/1.4 var(--font-sans)}
    @media (prefers-reduced-motion:reduce){#train-console .step{transition:none}}
  </style>
</head>
<body data-page="19" data-total="22">
  <div id="stage">
    <header class="p19-head">
      <div class="kicker">FULL TRAINING LOOP</div>
      <h1>每轮都走完四步，边界才会在误差下降中成形</h1>
    </header>

    <main id="train-console" class="canvas-full k-process" aria-label="完整训练循环控制台">
      <div class="loop-band" aria-label="每轮训练的四个步骤">
        <div class="step active" data-step="0"><span class="n">①</span><span>前向预测</span></div><div class="arw" aria-hidden="true">→</div>
        <div class="step" data-step="1"><span class="n">②</span><span>计算损失</span></div><div class="arw" aria-hidden="true">→</div>
        <div class="step" data-step="2"><span class="n">③</span><span>反向传播</span></div><div class="arw" aria-hidden="true">→</div>
        <div class="step" data-step="3"><span class="n">④</span><span>更新参数</span></div>
      </div>

      <div class="workbench min0">
        <section class="field-side min0" aria-labelledby="field-title">
          <div class="field-top">
            <h2 id="field-title">模型此刻怎样划分训练点</h2>
            <div class="network">2 → 10 → 10 → 1　隐藏层：tanh</div>
          </div>
          <div class="field-wrap cvbox min0">
            <canvas class="cv-fill" data-field aria-label="200 个训练样本与模型当前预测背景"></canvas>
            <span class="field-axis axis-y">x₂</span><span class="field-axis axis-x">x₁</span>
          </div>
          <div class="legend" aria-label="决策场图例">
            <span><i class="dot-key"></i>实心圆：训练样本</span>
            <span><i class="bg-key"></i>背景：模型预测</span>
            <span>p ≥ 0.5 判为 1</span>
          </div>
        </section>

        <section class="right-side min0" aria-labelledby="loss-title">
          <div class="readouts" aria-label="训练实时读数">
            <div class="readout"><span>更新</span><output data-updates>0</output></div>
            <div class="readout loss"><span>平均罚分</span><output data-loss>—</output></div>
            <div class="readout"><span>训练准确率</span><output data-acc>—</output></div>
          </div>
          <div class="chart-panel panel min0">
            <div class="chart-top"><h2 id="loss-title">训练平均罚分</h2><span class="small">同一训练时刻</span></div>
            <div id="loss-chart" role="img" aria-label="横轴为更新次数、纵轴为平均罚分的实时曲线"></div>
          </div>
          <div class="control-rail">
            <div class="btns" aria-label="训练控制">
              <button class="btn" type="button" data-start>开始</button>
              <button class="btn" type="button" data-pause disabled>暂停</button>
              <button class="btn" type="button" data-reset>重置</button>
            </div>
            <fieldset class="lr-group" aria-label="学习率">
              <legend>学习率</legend>
              <span class="lr"><input type="radio" name="p19-lr" id="lr003" value="0.03"><label for="lr003">0.03</label></span>
              <span class="lr"><input type="radio" name="p19-lr" id="lr03" value="0.3" checked><label for="lr03">0.3</label></span>
              <span class="lr"><input type="radio" name="p19-lr" id="lr30" value="30"><label for="lr30">30</label></span>
            </fieldset>
          </div>
          <div class="status-line" data-feedback data-live aria-live="polite">先用 0.3 开始，再比较脚步过小或过大。</div>
        </section>
      </div>
    </main>

    <footer class="p19-foot">
      <p class="conclusion">学习不是一次算对，而是反复预测、计罚、反传责任，再小幅更新参数。</p>
      <p class="next">旧题上的罚分降了，遇到从未参加训练的新点还有效吗？</p>
    </footer>
  </div>

  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/lib/mlp.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
  (() => {
    const root = document.getElementById('train-console');
    if (!root || !window.MLP || !window.echarts || !Math.seedrandom) return;

    const q = s => root.querySelector(s);
    const canvas = q('[data-field]');
    const steps = [...root.querySelectorAll('[data-step]')];
    const startBtn = q('[data-start]');
    const pauseBtn = q('[data-pause]');
    const resetBtn = q('[data-reset]');
    const lrInputs = [...root.querySelectorAll('input[name="p19-lr"]')];
    const updateOut = q('[data-updates]');
    const lossOut = q('[data-loss]');
    const accOut = q('[data-acc]');
    const feedback = q('[data-feedback]');
    const live = q('[data-live]');
    const chartEl = q('#loss-chart');
    const chart = echarts.init(chartEl, null, {renderer:'svg'});
    const FIELD_N = 80;
    const initialLR = 0.3;
    let stopLoop = null;
    let stopFit = null;
    let stopResize = null;
    let destroyed = false;
    let fieldCanvas = document.createElement('canvas');
    let previousFieldCanvas = document.createElement('canvas');
    fieldCanvas.width = previousFieldCanvas.width = FIELD_N;
    fieldCanvas.height = previousFieldCanvas.height = FIELD_N;

    function makeExperiment(){
      const rng = new Math.seedrandom('nn-lesson-xor-01');
      const data = [];
      for(let i=0;i<200;i++){
        const x1 = rng()*2-1, x2 = rng()*2-1;
        data.push({x:[x1,x2], t:x1*x2<0 ? 1 : 0});
      }
      const netSeed = Math.floor(rng()*2147483647);
      return {data, net:MLP.create({sizes:[2,10,10,1],act:'tanh',lr:initialLR,seed:netSeed})};
    }

    function initialState(){
      const experiment = makeExperiment();
      return {data:experiment.data,net:experiment.net,lr:initialLR,running:false,updates:0,loss:null,acc:null,history:[],frame:0,activeStep:0,diverged:false,fadeStart:0};
    }
    let state = initialState();

    function colorField(target, values){
      const c = target.getContext('2d');
      const img = c.createImageData(FIELD_N,FIELD_N);
      for(let i=0;i<values.length;i++){
        const p = Math.max(0,Math.min(1,values[i]));
        const isOne = p>=0.5;
        const strength = Math.abs(p-.5)*2;
        const base = isOne ? [31,90,122] : [210,202,184];
        const paper = [244,241,232];
        const mix = .20 + strength*.55;
        const k=i*4;
        img.data[k]=Math.round(paper[0]*(1-mix)+base[0]*mix);
        img.data[k+1]=Math.round(paper[1]*(1-mix)+base[1]*mix);
        img.data[k+2]=Math.round(paper[2]*(1-mix)+base[2]*mix);
        img.data[k+3]=255;
      }
      c.putImageData(img,0,0);
    }

    function refreshField(first=false){
      if(!first){
        const swap=previousFieldCanvas; previousFieldCanvas=fieldCanvas; fieldCanvas=swap;
      }
      colorField(fieldCanvas,state.net.field(-1,-1,1,1,FIELD_N,FIELD_N));
      if(first) previousFieldCanvas.getContext('2d').drawImage(fieldCanvas,0,0);
      state.fadeStart=performance.now();
    }

    let ctx=null,cw=1,ch=1;
    function drawField(now=performance.now()){
      if(!ctx) return;
      ctx.clearRect(0,0,cw,ch);
      ctx.imageSmoothingEnabled=true;
      if(state.running && !Deck.reduced() && now-state.fadeStart<180){
        ctx.globalAlpha=1;
        ctx.drawImage(previousFieldCanvas,0,0,cw,ch);
        ctx.globalAlpha=Math.max(0,Math.min(1,(now-state.fadeStart)/180));
        ctx.drawImage(fieldCanvas,0,0,cw,ch);
      }else{
        ctx.globalAlpha=1;ctx.drawImage(fieldCanvas,0,0,cw,ch);
      }
      ctx.globalAlpha=1;
      const sx=cw/2,sy=ch/2;
      ctx.lineWidth=1;
      ctx.strokeStyle='rgba(49,54,59,.22)';
      ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,ch);ctx.moveTo(0,sy);ctx.lineTo(cw,sy);ctx.stroke();
      const r=Math.max(5,Math.min(8,Math.min(cw,ch)/72));
      for(const d of state.data){
        const x=(d.x[0]+1)*.5*cw, y=(1-(d.x[1]+1)*.5)*ch;
        ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
        if(d.t===1){ctx.fillStyle='#31363B';ctx.fill();ctx.strokeStyle='#F4F1E8';ctx.lineWidth=1.5;ctx.stroke();}
        else{ctx.fillStyle='#F4F1E8';ctx.fill();ctx.strokeStyle='#31363B';ctx.lineWidth=2;ctx.stroke();}
      }
    }

    function chartOption(){
      return {
        animation:false,
        textStyle:{fontFamily:'var(--font-sans)',fontSize:16,color:'#31363B'},
        grid:{left:68,right:18,top:16,bottom:50},
        xAxis:{type:'value',name:'更新次数',nameLocation:'middle',nameGap:32,nameTextStyle:{fontSize:14,color:'#5f666c'},axisLabel:{fontSize:12,color:'#5f666c'},axisLine:{lineStyle:{color:'#8f928e'}},splitLine:{show:false},min:0},
        yAxis:{type:'value',name:'平均罚分',nameGap:42,nameLocation:'middle',nameTextStyle:{fontSize:14,color:'#5f666c'},axisLabel:{fontSize:12,color:'#5f666c'},axisLine:{show:true,lineStyle:{color:'#8f928e'}},splitLine:{lineStyle:{color:'rgba(49,54,59,.12)'}},min:0},
        tooltip:{trigger:'axis',textStyle:{fontSize:16},formatter:p=>p.length?`更新 ${p[0].value[0]}<br>平均罚分 ${Number(p[0].value[1]).toFixed(3)}`:''},
        series:[{type:'line',showSymbol:false,symbol:'none',lineStyle:{width:3,color:'#A33A3A'},data:state.history}]
      };
    }

    function render(now=performance.now(),updateChart=true){
      steps.forEach((el,i)=>el.classList.toggle('active',i===state.activeStep));
      updateOut.textContent=String(state.updates);
      lossOut.textContent=state.loss==null?'—':state.loss.toFixed(3);
      accOut.textContent=state.acc==null?'—':`${(state.acc*100).toFixed(1)}%`;
      startBtn.disabled=state.running;
      pauseBtn.disabled=!state.running;
      if(state.diverged){feedback.textContent='数值失稳：请暂停、换小学习率或重置。';feedback.classList.add('unstable');}
      else{feedback.textContent='先用 0.3 开始，再比较脚步过小或过大。';feedback.classList.remove('unstable');}
      drawField(now);
      if(updateChart) chart.setOption(chartOption(),true);
    }

    function trainFrame(now){
      if(!state.running || destroyed) return;
      state.net.lr=state.lr;
      for(let i=0;i<12;i++) state.net.step(state.data,16);
      state.updates+=12;
      state.frame+=1;
      const ev=state.net.evaluate(state.data);
      state.loss=ev.loss;state.acc=ev.acc;
      state.diverged=!!state.net.diverged || !Number.isFinite(ev.loss);
      if(Number.isFinite(ev.loss)){
        state.history.push([state.updates,ev.loss]);
        if(state.history.length>240) state.history.shift();
      }
      state.activeStep=Math.floor(now/160)%4;
      if(state.frame%8===0) refreshField(false);
      if(state.diverged) pause(false);
      render(now,true);
      if(Deck.reduced()) pause(false);
    }

    function start(){
      if(state.running||destroyed) return;
      state.running=true;
      stopLoop=Deck.loop(trainFrame,{still:640});
      render();
      live.textContent=`训练开始，学习率 ${state.lr}`;
    }
    function pause(announce=true){
      if(stopLoop){stopLoop();stopLoop=null;}
      state.running=false;state.activeStep=0;
      render(performance.now(),true);
      if(announce) live.textContent=`已暂停，更新 ${state.updates}，训练准确率 ${state.acc==null?'尚无读数':(state.acc*100).toFixed(1)+'%'}`;
    }
    function reset(){
      if(stopLoop){stopLoop();stopLoop=null;}
      state=initialState();
      lrInputs.forEach(i=>i.checked=Number(i.value)===initialLR);
      refreshField(true);
      render(performance.now(),true);
      live.textContent='已重置：训练样本、初始参数和学习率恢复。';
    }
    function setLR(e){
      if(!e.target.checked) return;
      state.lr=Number(e.target.value);
      state.net.lr=state.lr;
      live.textContent=`学习率改为 ${state.lr}，从下一次更新生效`;
    }

    function onPause(){ pause(true); }
    startBtn.addEventListener('click',start);
    pauseBtn.addEventListener('click',onPause);
    resetBtn.addEventListener('click',reset);
    lrInputs.forEach(i=>i.addEventListener('change',setLR));
    stopFit=Deck.autofit(canvas,(next,w,h)=>{ctx=next;cw=w;ch=h;drawField();});
    stopResize=Deck.onResize(()=>chart.resize());
    refreshField(true);
    chart.setOption(chartOption());
    render();
    Deck.init({index:19,total:22});

    root.destroyTrainConsole=()=>{
      if(destroyed) return;destroyed=true;
      if(stopLoop) stopLoop();
      if(stopFit) stopFit();
      if(stopResize) stopResize();
      startBtn.removeEventListener('click',start);
      pauseBtn.removeEventListener('click',onPause);
      resetBtn.removeEventListener('click',reset);
      lrInputs.forEach(i=>i.removeEventListener('change',setLR));
      chart.dispose();
      delete root.destroyTrainConsole;
    };
  })();
  </script>
</body>
</html>
