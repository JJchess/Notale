<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="02" data-total="24">
  <div id="stage">
    <style>
      #stage #page-content {
        --focus-w: 1340px;
        --focus-pad: var(--sp-6);
      }

      #stage .logic-console {
        display: flex;
        flex-direction: column;
        gap: var(--sp-4);
        inline-size: 100%;
        padding: var(--sp-5);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-xl);
        background: linear-gradient(180deg, var(--surface-raised), var(--surface-1));
        box-shadow: var(--shadow-md), inset 0 1px 0 var(--line-strong);
      }

      #stage .console-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--sp-5);
        min-inline-size: 0;
      }

      #stage .console-title {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        min-inline-size: 0;
      }

      #stage .lamp {
        inline-size: 18px;
        block-size: 18px;
        flex: 0 0 auto;
        border: 2px solid var(--line-strong);
        border-radius: var(--radius-pill);
        background: var(--text-faint);
        box-shadow: inset 0 2px 4px var(--bg);
      }

      #stage .lamp.is-on {
        background: var(--success);
        box-shadow: var(--shadow-glow), inset 0 1px 0 var(--text-strong);
      }

      #stage .history-note {
        color: var(--text-muted);
        font-size: var(--fs-label);
        line-height: var(--lh-label);
        white-space: nowrap;
      }

      #stage .workbench {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(360px, 0.9fr);
        gap: var(--sp-5);
        min-inline-size: 0;
        min-block-size: 0;
      }

      #stage .machine,
      #stage .table-well {
        min-inline-size: 0;
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: var(--surface-control);
        box-shadow: inset 0 6px 18px var(--bg), inset 0 -1px 0 var(--line-strong);
      }

      #stage .machine {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) 220px minmax(170px, 0.65fr);
        align-items: center;
        gap: var(--sp-5);
        padding: var(--sp-5);
      }

      #stage .wire-bank {
        display: flex;
        min-inline-size: 0;
        flex-direction: column;
        gap: var(--sp-5);
      }

      #stage .wire-control {
        display: grid;
        grid-template-columns: 54px minmax(0, 1fr) 58px;
        align-items: center;
        gap: var(--sp-3);
      }

      #stage .wire-control label {
        color: var(--text-strong);
        font-size: var(--fs-body);
        font-weight: var(--weight-bold);
      }

      #stage .wire-control output {
        color: var(--accent-strong);
        font-size: var(--fs-body);
        font-weight: var(--weight-bold);
        font-variant-numeric: tabular-nums;
        text-align: end;
      }

      #stage .wire-control input[type="range"] {
        filter: drop-shadow(0 3px 3px var(--bg));
      }

      #stage .neuron-shell {
        position: relative;
        display: grid;
        place-items: center;
        aspect-ratio: 1;
        border: 1px solid var(--line-strong);
        border-radius: 50%;
        background: linear-gradient(180deg, var(--surface-3), var(--surface-1));
        box-shadow: var(--shadow-sm), inset 0 2px 0 var(--line-strong), inset 0 -8px 18px var(--bg);
      }

      #stage .neuron-shell::before,
      #stage .neuron-shell::after {
        content: "";
        position: absolute;
        inset-block-start: 50%;
        inline-size: var(--sp-5);
        block-size: 6px;
        translate: 0 -50%;
        border-block: 1px solid var(--line-strong);
        background: var(--accent);
      }

      #stage .neuron-shell::before { inset-inline-end: 100%; }
      #stage .neuron-shell::after { inset-inline-start: 100%; }

      #stage .formula {
        color: var(--text-strong);
        font-size: var(--fs-body-lg);
        font-weight: var(--weight-bold);
        line-height: var(--lh-tight);
        text-align: center;
      }

      #stage .formula small {
        display: block;
        margin-block-start: var(--sp-2);
        color: var(--text-muted);
        font-size: var(--fs-label);
        font-weight: var(--weight-medium);
      }

      #stage .output-bank {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--sp-3);
      }

      #stage .output-bit {
        display: grid;
        place-items: center;
        inline-size: 86px;
        block-size: 86px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-lg);
        background: linear-gradient(180deg, var(--surface-3), var(--surface-1));
        color: var(--text-strong);
        font-size: var(--fs-display);
        font-weight: var(--weight-bold);
        line-height: 1;
        box-shadow: var(--shadow-sm), inset 0 2px 0 var(--line-strong), inset 0 -6px 12px var(--bg);
      }

      #stage .output-caption {
        color: var(--text-muted);
        font-size: var(--fs-label);
      }

      #stage .table-well {
        padding: var(--sp-4);
      }

      #stage .truth-table {
        inline-size: 100%;
        border-collapse: separate;
        border-spacing: 0 var(--sp-2);
        font-size: var(--fs-label);
        font-variant-numeric: tabular-nums;
        text-align: center;
      }

      #stage .truth-table caption {
        padding-block-end: var(--sp-2);
        color: var(--text-strong);
        font-size: var(--fs-body);
        font-weight: var(--weight-bold);
        text-align: start;
      }

      #stage .truth-table th {
        color: var(--text-muted);
        font-weight: var(--weight-semibold);
      }

      #stage .truth-table td {
        padding: var(--sp-2) var(--sp-3);
        border-block: 1px solid var(--line);
        background: var(--surface-2);
      }

      #stage .truth-table td:first-child {
        border-inline-start: 1px solid var(--line);
        border-radius: var(--radius-sm) 0 0 var(--radius-sm);
      }

      #stage .truth-table td:last-child {
        border-inline-end: 1px solid var(--line);
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      }

      #stage .truth-table tr.is-pass td:last-child {
        color: var(--success);
        font-weight: var(--weight-bold);
      }

      #stage .truth-table tr.is-fail td:last-child {
        color: var(--danger);
        font-weight: var(--weight-bold);
      }

      #stage .control-deck {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: var(--sp-5);
        min-inline-size: 0;
        padding: var(--sp-4);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: linear-gradient(180deg, var(--surface-2), var(--surface-control));
        box-shadow: inset 0 1px 0 var(--line-strong), var(--shadow-sm);
      }

      #stage .mission {
        display: flex;
        min-inline-size: 0;
        flex-direction: column;
        gap: var(--sp-1);
      }

      #stage .mission-line {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        min-inline-size: 0;
      }

      #stage .mission-name {
        color: var(--accent-strong);
        font-size: var(--fs-h3);
        font-weight: var(--weight-bold);
        line-height: var(--lh-tight);
      }

      #stage .feedback {
        color: var(--text-muted);
        font-size: var(--fs-body-sm);
        line-height: var(--lh-body);
      }

      #stage .console-actions {
        display: flex;
        gap: var(--sp-3);
      }

      #stage .console-actions button {
        background: linear-gradient(180deg, var(--surface-3), var(--surface-control));
        box-shadow: var(--shadow-sm), inset 0 1px 0 var(--line-strong);
      }

      #stage .console-actions button:active {
        box-shadow: inset 0 4px 10px var(--bg);
      }

      #stage .console-actions .button--primary {
        background: linear-gradient(180deg, var(--accent-strong), var(--accent));
        color: var(--text-inverse);
      }

      @media (prefers-reduced-motion: reduce) {
        #stage .logic-console,
        #stage .console-actions button { transition: none; }
      }
    </style>

    <main id="page-content" class="focus min0" aria-label="阈值神经元逻辑门挑战">
      <section class="focus__content logic-console min0" aria-labelledby="game-heading">
        <div class="console-head">
          <div class="console-title">
            <span id="status-lamp" class="lamp" aria-hidden="true"></span>
            <h2 id="game-heading" class="card-title">逻辑神经元接线台</h2>
            <span id="score-badge" class="badge">匹配</span>
          </div>
          <p id="history-note" class="history-note"></p>
        </div>

        <div class="workbench min0">
          <div class="machine min0" aria-label="加权和阈值单元">
            <div class="wire-bank min0">
              <div class="wire-control">
                <label for="weight-one">w₁</label>
                <input id="weight-one" type="range" aria-label="输入一的权重">
                <output id="weight-one-value" for="weight-one"></output>
              </div>
              <div class="wire-control">
                <label for="weight-two">w₂</label>
                <input id="weight-two" type="range" aria-label="输入二的权重">
                <output id="weight-two-value" for="weight-two"></output>
              </div>
              <div class="wire-control">
                <label for="bias">b</label>
                <input id="bias" type="range" aria-label="偏置">
                <output id="bias-value" for="bias"></output>
              </div>
            </div>

            <div class="neuron-shell" aria-hidden="true">
              <div class="formula">Σ → step<small id="formula-readout"></small></div>
            </div>

            <div class="output-bank">
              <span class="output-caption">当前行输出 y</span>
              <output id="output-bit" class="output-bit" aria-live="polite"></output>
              <span id="active-input" class="badge badge--accent"></span>
            </div>
          </div>

          <div class="table-well min0">
            <table class="truth-table">
              <caption>逐项验证真值表</caption>
              <thead>
                <tr><th scope="col">x₁</th><th scope="col">x₂</th><th scope="col">目标</th><th scope="col">本机</th></tr>
              </thead>
              <tbody id="truth-body"></tbody>
            </table>
          </div>
        </div>

        <div class="control-deck min0">
          <div class="mission min0">
            <div class="mission-line">
              <span class="label">当前目标</span>
              <strong id="mission-name" class="mission-name"></strong>
              <span id="feasible-badge" class="badge"></span>
            </div>
            <output id="feedback" class="feedback" aria-live="polite"></output>
          </div>
          <div class="console-actions">
            <button id="challenge" class="button--primary" type="button">换一道挑战</button>
            <button id="reset" type="button">重置接线</button>
          </div>
        </div>
      </section>
    </main>

    <script>
      (function () {
        'use strict';

        function boot() {
          Lec.mount({
            index: 2,
            kicker: `LOGIC IN A CELL`,
            title: `McCulloch–Pitts：一个神经元可以执行<em>逻辑</em>`,
            take: `最早的人工神经元首先是一种阈值计算单元，而不是会自行学习的大脑模型。`
          });

          var P = Lec.P;
          var controls = [
            document.getElementById('weight-one'),
            document.getElementById('weight-two'),
            document.getElementById('bias')
          ];
          var values = [
            document.getElementById('weight-one-value'),
            document.getElementById('weight-two-value'),
            document.getElementById('bias-value')
          ];
          var tasks = [
            { id: 'and', name: 'AND', target: [0, 0, 0, 1] },
            { id: 'or', name: 'OR', target: [0, 1, 1, 1] },
            { id: 'nand', name: 'NAND', target: [1, 1, 1, 0] },
            { id: 'xor', name: 'XOR', target: [0, 1, 1, 0] },
            { id: 'xnor', name: 'XNOR', target: [1, 0, 0, 1] }
          ];
          var state = { task: tasks[0], weights: [1, 1], bias: -2, row: 3 };
          var defaults = { weights: state.weights.slice(), bias: state.bias };
          var truthBody = document.getElementById('truth-body');
          var feedback = document.getElementById('feedback');
          var scoreBadge = document.getElementById('score-badge');
          var feasibleBadge = document.getElementById('feasible-badge');
          var lamp = document.getElementById('status-lamp');
          var outputBit = document.getElementById('output-bit');
          var activeInput = document.getElementById('active-input');
          var formulaReadout = document.getElementById('formula-readout');
          var missionName = document.getElementById('mission-name');
          var rangeMin = -3;
          var rangeMax = 3;
          var rangeStep = 1;
          var i;

          function thresholdNeuron(inputs, weights, bias) {
            var result;
            if (typeof P.thresholdNeuron === 'function') {
              result = P.thresholdNeuron(inputs, weights, bias);
              return typeof result === 'object' ? result.output : result;
            }
            return P.step(P.weightedSum(inputs, weights, bias), 0);
          }

          function truthTable(task) {
            if (typeof P.truthTable === 'function') {
              return P.truthTable(task);
            }
            return [
              { inputs: [0, 0], target: task.target[0] },
              { inputs: [0, 1], target: task.target[1] },
              { inputs: [1, 0], target: task.target[2] },
              { inputs: [1, 1], target: task.target[3] }
            ];
          }

          function thresholdFeasibility(task) {
            var a;
            var b;
            var c;
            var rows;
            var good;
            if (typeof P.thresholdFeasibility === 'function') {
              return P.thresholdFeasibility(task);
            }
            rows = truthTable(task);
            for (a = rangeMin; a <= rangeMax; a += rangeStep) {
              for (b = rangeMin; b <= rangeMax; b += rangeStep) {
                for (c = rangeMin; c <= rangeMax; c += rangeStep) {
                  good = rows.every(function (row) {
                    return thresholdNeuron(row.inputs, [a, b], c) === row.target;
                  });
                  if (good) return { feasible: true, weights: [a, b], bias: c };
                }
              }
            }
            return { feasible: false };
          }

          function eventLabel(id) {
            var event;
            if (typeof P.eventLabel === 'function') return P.eventLabel(id);
            event = P.eventById(id);
            return event ? event.year + ' · ' + event.title : '';
          }

          function format(value) {
            return P.formatNumber(value, 0);
          }

          function render() {
            var rows = truthTable(state.task);
            var predictions = [];
            var matches;
            var feasible = thresholdFeasibility(state.task);
            var active = rows[state.row];
            var score;
            var sum;

            truthBody.textContent = '';
            rows.forEach(function (row, index) {
              var prediction = thresholdNeuron(row.inputs, state.weights, state.bias);
              var tr = document.createElement('tr');
              predictions.push(prediction);
              tr.className = prediction === row.target ? 'is-pass' : 'is-fail';
              [row.inputs[0], row.inputs[1], row.target, prediction].forEach(function (value) {
                var td = document.createElement('td');
                td.textContent = format(value);
                tr.appendChild(td);
              });
              tr.addEventListener('click', function () {
                state.row = index;
                render();
              });
              truthBody.appendChild(tr);
            });

            matches = predictions.filter(function (value, index) {
              return value === rows[index].target;
            }).length;
            score = matches + ' / ' + rows.length;
            sum = P.weightedSum(active.inputs, state.weights, state.bias);

            values.forEach(function (output, index) {
              output.value = format(index < 2 ? state.weights[index] : state.bias);
            });
            controls[0].value = state.weights[0];
            controls[1].value = state.weights[1];
            controls[2].value = state.bias;
            missionName.textContent = state.task.name;
            scoreBadge.textContent = '匹配 ' + score;
            activeInput.textContent = 'x = (' + active.inputs.map(format).join(', ') + ')';
            outputBit.value = format(thresholdNeuron(active.inputs, state.weights, state.bias));
            formulaReadout.textContent = 'Σ = ' + format(sum) + '，阈值 = ' + format(0);
            lamp.classList.toggle('is-on', matches === rows.length);

            feasibleBadge.textContent = feasible.feasible ? '单单元可实现' : '单单元不可实现';
            feasibleBadge.className = 'badge ' + (feasible.feasible ? 'badge--success' : 'badge--danger');
            if (matches === rows.length) {
              feedback.value = '接线成功：权重决定证据方向，偏置决定何时触发。';
            } else if (!feasible.feasible) {
              feedback.value = '这不是调得不够准：两组对角输入要求互相矛盾，单个线性阈值无法同时满足。';
            } else {
              feedback.value = '拖动三条接线，让本机输出逐行匹配目标；红色项仍需调整。';
            }
          }

          for (i = 0; i < controls.length; i += 1) {
            controls[i].min = rangeMin;
            controls[i].max = rangeMax;
            controls[i].step = rangeStep;
            controls[i].addEventListener('input', function () {
              state.weights[0] = Number(controls[0].value);
              state.weights[1] = Number(controls[1].value);
              state.bias = Number(controls[2].value);
              render();
            });
          }

          document.getElementById('challenge').addEventListener('click', function () {
            var next = state.task;
            while (next === state.task) {
              next = tasks[Math.floor(Math.random() * tasks.length)];
            }
            state.task = next;
            state.row = 0;
            render();
          });

          document.getElementById('reset').addEventListener('click', function () {
            state.weights = defaults.weights.slice();
            state.bias = defaults.bias;
            state.row = 3;
            render();
          });

          document.getElementById('history-note').textContent = eventLabel('mcculloch-pitts');
          render();
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', boot, { once: true });
        } else {
          boot();
        }
      }());
    </script>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
</body>
</html>
