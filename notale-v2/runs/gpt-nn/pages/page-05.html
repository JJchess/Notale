<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="05" data-total="24">
  <div id="stage">
    <style>
      #stage #page-content { inline-size: 100%; block-size: 100%; }
      #stage .geometry-page { --top: 2.1fr; --bottom: 0.9fr; gap: var(--sp-4); }
      #stage .scene-shell { position: relative; overflow: clip; border: 1px solid var(--line-strong); border-radius: var(--radius-lg); background: var(--surface-control); box-shadow: var(--shadow-md); }
      #stage .scene-shell canvas { display: block; inline-size: 100%; block-size: 100%; cursor: grab; touch-action: none; }
      #stage .scene-shell canvas:active { cursor: grabbing; }
      #stage .scene-shell canvas:focus-visible { outline: 3px solid var(--focus); outline-offset: -5px; }
      #stage .scene-overlay { position: absolute; inset: var(--sp-4); display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-4); pointer-events: none; }
      #stage .scene-overlay > * { pointer-events: auto; }
      #stage .mode-group { display: inline-flex; gap: var(--sp-2); padding: var(--sp-2); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-1); box-shadow: var(--shadow-sm); }
      #stage .mode-group button { min-block-size: 42px; padding: var(--sp-2) var(--sp-4); }
      #stage .mode-group button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
      #stage .scene-note { max-inline-size: 410px; padding: var(--sp-3) var(--sp-4); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-1); color: var(--text-muted); font-size: var(--fs-label); line-height: var(--lh-label); }
      #stage .scene-note strong { color: var(--accent-strong); }
      #stage .axis-key { position: absolute; inset-inline-start: var(--sp-4); inset-block-end: var(--sp-3); display: flex; gap: var(--sp-4); color: var(--text-muted); font-size: var(--fs-label); pointer-events: none; }
      #stage .axis-key span { display: inline-flex; align-items: center; gap: var(--sp-2); }
      #stage .axis-key i { inline-size: 18px; block-size: 3px; border-radius: var(--radius-pill); background: var(--accent); }
      #stage .axis-key span:nth-child(2) i { background: var(--secondary); }
      #stage .axis-key span:nth-child(3) i { background: var(--warm); }
      #stage .workbench { display: grid; grid-template-columns: minmax(360px, 0.9fr) minmax(0, 1.55fr); gap: var(--sp-4); padding: var(--sp-4); }
      #stage .controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: var(--sp-3); }
      #stage .controls .control { min-inline-size: 0; }
      #stage .bias-row { display: flex; align-items: center; gap: var(--sp-3); }
      #stage .bias-row input { flex: 1 1 auto; }
      #stage .bias-value { min-inline-size: 64px; color: var(--text-strong); font-size: var(--fs-body); font-variant-numeric: tabular-nums; text-align: end; }
      #stage .readouts { --readout-cols: 3; align-self: stretch; }
      #stage .readout { padding: var(--sp-3) var(--sp-4); }
      #stage .readout__value { font-size: var(--fs-h3); }
      #stage .readout__value.is-good { color: var(--success); }
      #stage .readout__value.is-bad { color: var(--danger); }
      #stage .formula { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-5); color: var(--text-muted); font-size: var(--fs-body-sm); line-height: var(--lh-body); }
      #stage .formula code { color: var(--accent-strong); font-size: var(--fs-body); font-weight: var(--weight-semibold); }
      @media (prefers-reduced-motion: reduce) {
        #stage button, #stage input { transition: none; }
      }
    </style>

    <main id="page-content" class="min0" aria-label="本页正文">
      <section class="split-tb geometry-page min0" aria-label="线性分类器三维几何实验">
        <div class="split-tb__top scene-shell min0" id="scene-shell">
          <div class="scene-overlay">
            <div class="mode-group" role="group" aria-label="输入表示">
              <button id="mode-raw" type="button" aria-pressed="true">二维输入</button>
              <button id="mode-feature" type="button" aria-pressed="false">增加派生特征</button>
            </div>
            <p class="scene-note"><strong>拖动亮色平面</strong>改变偏置；拖动空处绕行观察。法向箭头就是权重方向。</p>
          </div>
          <div class="axis-key" aria-hidden="true"><span><i></i>A 类圆点</span><span><i></i>B 类方点</span><span><i></i>权重法向量</span></div>
        </div>

        <div class="split-tb__bottom panel workbench min0">
          <div class="controls min0">
            <label class="control" for="bias-range">
              <span class="control-label">偏置：沿法向移动平面</span>
              <span class="bias-row"><input id="bias-range" type="range" aria-describedby="bias-help"><output id="bias-value" class="bias-value"></output></span>
              <span id="bias-help" class="control-hint">画布聚焦后：←→ 移平面，Shift + 方向键旋转视角</span>
            </label>
            <button id="reset" type="button" class="button--ghost">复位视角</button>
          </div>

          <div class="readout-grid readouts min0" aria-live="polite">
            <div class="readout"><span class="readout__label">当前表示</span><output id="representation" class="readout__value"></output></div>
            <div class="readout"><span class="readout__label">最近间隔</span><output id="margin" class="readout__value"></output></div>
            <div class="readout"><span class="readout__label">误分类</span><output id="errors" class="readout__value"></output></div>
          </div>

          <p class="formula"><span><code>w · x + b = 0</code> 定义分类平面；符号决定点在平面的哪一侧，绝对值对应距离。</span><strong id="separable"></strong></p>
        </div>
      </section>
    </main>

    <script defer src="assets/lib/three.min.js"></script>
    <script>
      (function () {
        'use strict';

        function boot() {
          Lec.mount({
            index: 5,
            kicker: `GEOMETRY OF DECISIONS`,
            title: `分类为什么变成一条<em>直线</em>`,
            take: `单个感知机的能力边界，本质上就是线性可分性的几何边界。`
          });

          var mountedTitle = document.querySelector('.lec-header__title');
          if (mountedTitle) mountedTitle.innerHTML = '分类为什么变成一条<em>直线</em>';

          var shell = document.getElementById('scene-shell');
          var rawButton = document.getElementById('mode-raw');
          var featureButton = document.getElementById('mode-feature');
          var biasRange = document.getElementById('bias-range');
          var biasValue = document.getElementById('bias-value');
          var representation = document.getElementById('representation');
          var marginOutput = document.getElementById('margin');
          var errorsOutput = document.getElementById('errors');
          var separableOutput = document.getElementById('separable');
          var resetButton = document.getElementById('reset');

          var rawPoints = [[-1.7,-1.5],[-1.4,1.4],[1.5,-1.4],[1.6,1.5],[-0.35,-0.2],[0.35,-0.25],[-0.2,0.4],[0.3,0.35]];
          var labels = [1,1,1,1,0,0,0,0];
          var mode = 'raw';
          var bias = 0;
          var yaw = 0.68;
          var pitch = 0.48;
          var dragging = null;
          var lastPoint = null;
          var dirty = true;

          var scene = new THREE.Scene();
          scene.background = new THREE.Color(Deck.token('--surface-control'));
          scene.fog = new THREE.Fog(new THREE.Color(Deck.token('--surface-control')), 8, 15);
          var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 30);
          var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
          renderer.outputColorSpace = THREE.SRGBColorSpace;
          renderer.shadowMap.enabled = true;
          renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          renderer.domElement.className = 'cv-fill no-pan';
          renderer.domElement.tabIndex = 0;
          renderer.domElement.setAttribute('role', 'application');
          renderer.domElement.setAttribute('aria-label', '三维分类平面。拖动平面改变偏置，拖动空处旋转；方向键移动平面，按住 Shift 再按方向键旋转视角。');
          shell.insertBefore(renderer.domElement, shell.firstChild);

          var ambient = new THREE.HemisphereLight(new THREE.Color(Deck.token('--text')), new THREE.Color(Deck.token('--bg')), 1.35);
          scene.add(ambient);
          var key = new THREE.DirectionalLight(new THREE.Color(Deck.token('--text-strong')), 2.1);
          key.position.set(4, 7, 5);
          key.castShadow = true;
          key.shadow.mapSize.set(1024, 1024);
          scene.add(key);

          var grid = new THREE.GridHelper(7, 14, new THREE.Color(Deck.token('--line-strong')), new THREE.Color(Deck.token('--line')));
          grid.position.y = -2.05;
          scene.add(grid);

          var world = new THREE.Group();
          scene.add(world);
          var planeMaterial = new THREE.MeshStandardMaterial({ color: new THREE.Color(Deck.token('--warm')), transparent: true, opacity: 0.34, side: THREE.DoubleSide, roughness: 0.42, metalness: 0.15, depthWrite: false });
          var plane = new THREE.Mesh(new THREE.PlaneGeometry(6.2, 5.2), planeMaterial);
          plane.name = 'classification-plane';
          world.add(plane);
          var planeEdges = new THREE.LineSegments(new THREE.EdgesGeometry(plane.geometry), new THREE.LineBasicMaterial({ color: new THREE.Color(Deck.token('--warm')) }));
          plane.add(planeEdges);
          var handle = new THREE.Mesh(new THREE.SphereGeometry(0.18, 20, 12), new THREE.MeshStandardMaterial({ color: new THREE.Color(Deck.token('--text-strong')), emissive: new THREE.Color(Deck.token('--warm')), emissiveIntensity: 0.75 }));
          world.add(handle);
          var arrow = new THREE.ArrowHelper(new THREE.Vector3(0,1,0), new THREE.Vector3(), 2.0, new THREE.Color(Deck.token('--warm')), 0.34, 0.2);
          world.add(arrow);

          var pointGroup = new THREE.Group();
          world.add(pointGroup);
          var scoreLines = new THREE.Group();
          world.add(scoreLines);
          var raycaster = new THREE.Raycaster();
          var ndc = new THREE.Vector2();

          var sphereGeometry = new THREE.SphereGeometry(0.16, 20, 12);
          var boxGeometry = new THREE.BoxGeometry(0.28, 0.28, 0.28);
          var classMaterials = [
            new THREE.MeshStandardMaterial({ color: new THREE.Color(Deck.token('--accent')), roughness: 0.3, metalness: 0.15 }),
            new THREE.MeshStandardMaterial({ color: new THREE.Color(Deck.token('--secondary')), roughness: 0.3, metalness: 0.15 })
          ];

          function featurePoint(p) { return [p[0], p[0] * p[0] + p[1] * p[1], p[1]]; }
          function activePoints() { return mode === 'raw' ? rawPoints.slice() : rawPoints.map(featurePoint); }
          function worldPoint(p) { return mode === 'raw' ? new THREE.Vector3(p[0], 0, p[1]) : new THREE.Vector3(p[0], p[1] - 2, p[2]); }
          function weights() { return mode === 'raw' ? [0.9, 0.35] : [0, 1, 0]; }
          function worldNormal() { var w = weights(); return mode === 'raw' ? new THREE.Vector3(w[0], 0, w[1]).normalize() : new THREE.Vector3(w[0], w[1], w[2]).normalize(); }

          function localScores(points, w, b) {
            var norm = Math.sqrt(w.reduce(function (s, v) { return s + v * v; }, 0)) || 1;
            return points.map(function (p) { return (p.reduce(function (s, v, i) { return s + v * w[i]; }, b)) / norm; });
          }
          function getScores(points, w, b) {
            if (typeof Lec.P.hyperplaneScores === 'function') return Lec.P.hyperplaneScores(points, w, b);
            return localScores(points, w, b);
          }
          function getMargin(scores) {
            if (typeof Lec.P.marginSummary === 'function') return Lec.P.marginSummary(scores, labels);
            var signed = scores.map(function (s, i) { return (labels[i] ? 1 : -1) * s; });
            return { margin: Math.min.apply(Math, signed.map(Math.abs)), errors: signed.filter(function (v) { return v <= 0; }).length };
          }
          function perceptronSeparable(points) {
            var w = points[0].map(function () { return 0; });
            var b = 0;
            for (var epoch = 0; epoch < 240; epoch += 1) {
              var misses = 0;
              points.forEach(function (p, i) {
                var y = labels[i] ? 1 : -1;
                var score = p.reduce(function (s, v, j) { return s + v * w[j]; }, b);
                if (y * score <= 0) { w = w.map(function (v, j) { return v + y * p[j]; }); b += y; misses += 1; }
              });
              if (!misses) return true;
            }
            return false;
          }
          function getSeparability(points) {
            if (typeof Lec.P.linearSeparability === 'function') return Lec.P.linearSeparability(points, labels);
            return { separable: perceptronSeparable(points) };
          }
          function resultBool(result) { return typeof result === 'boolean' ? result : !!(result.separable || result.isSeparable); }

          function clearGroup(group) {
            while (group.children.length) group.remove(group.children[0]);
          }

          function updateGeometry() {
            var points = activePoints();
            var w = weights();
            var normal = worldNormal();
            var scores = getScores(points, w, bias);
            if (!Array.isArray(scores)) scores = scores.scores || scores.distances || localScores(points, w, bias);
            var summary = getMargin(scores);
            var errors = Number.isFinite(summary.errors) ? summary.errors : (Number.isFinite(summary.misclassified) ? summary.misclassified : scores.filter(function (s, i) { return (labels[i] ? s <= 0 : s > 0); }).length);
            var margin = Number.isFinite(summary.margin) ? summary.margin : (Number.isFinite(summary.minMargin) ? summary.minMargin : Math.min.apply(Math, scores.map(Math.abs)));
            var separability = getSeparability(points);

            clearGroup(pointGroup);
            clearGroup(scoreLines);
            points.forEach(function (p, i) {
              var mesh = new THREE.Mesh(labels[i] ? boxGeometry : sphereGeometry, classMaterials[labels[i]]);
              mesh.position.copy(worldPoint(p));
              mesh.castShadow = true;
              pointGroup.add(mesh);

              var dist = scores[i];
              var end = mesh.position.clone().addScaledVector(normal, -dist);
              var geometry = new THREE.BufferGeometry().setFromPoints([mesh.position.clone(), end]);
              var line = new THREE.Line(geometry, new THREE.LineDashedMaterial({ color: new THREE.Color(Deck.token(i === errors ? '--danger' : '--text-faint')), dashSize: 0.08, gapSize: 0.06, transparent: true, opacity: 0.6 }));
              line.computeLineDistances();
              scoreLines.add(line);
            });

            var offset = -bias / (mode === 'raw' ? Math.sqrt(w[0] * w[0] + w[1] * w[1]) : 1);
            var center = normal.clone().multiplyScalar(offset);
            if (mode === 'feature') center.y -= 2;
            plane.position.copy(center);
            plane.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), normal);
            handle.position.copy(center);
            arrow.position.copy(center);
            arrow.setDirection(normal);

            biasRange.value = String(bias);
            biasValue.value = Lec.P.formatNumber(bias, 2);
            representation.value = resultBool(separability) ? '线性可分' : '不可线性分开';
            representation.className = 'readout__value ' + (resultBool(separability) ? 'is-good' : 'is-bad');
            marginOutput.value = Lec.P.formatNumber(margin, 2);
            errorsOutput.value = Lec.P.formatNumber(errors, 0);
            errorsOutput.className = 'readout__value ' + (errors === 0 ? 'is-good' : 'is-bad');
            separableOutput.textContent = resultBool(separability) ? '换了表示，一张平面就够。' : '无论怎样移动，当前表示仍有交错。';
            dirty = true;
          }

          function setMode(next) {
            mode = next;
            bias = mode === 'raw' ? 0 : -1.25;
            rawButton.setAttribute('aria-pressed', String(mode === 'raw'));
            featureButton.setAttribute('aria-pressed', String(mode === 'feature'));
            biasRange.min = mode === 'raw' ? '-2.5' : '-3.5';
            biasRange.max = mode === 'raw' ? '2.5' : '0.5';
            biasRange.step = '0.05';
            updateGeometry();
          }

          function updateCamera() {
            var radius = 8.1;
            camera.position.set(radius * Math.sin(yaw) * Math.cos(pitch), radius * Math.sin(pitch) + 0.3, radius * Math.cos(yaw) * Math.cos(pitch));
            camera.lookAt(0, -0.25, 0);
            dirty = true;
          }

          function resize() {
            var width = shell.clientWidth;
            var height = shell.clientHeight;
            if (!width || !height) return;
            renderer.setSize(width, height, false);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            dirty = true;
          }

          function hitPlane(e) {
            var p = Deck.pt(renderer.domElement, e);
            ndc.x = p.x / renderer.domElement.clientWidth * 2 - 1;
            ndc.y = -(p.y / renderer.domElement.clientHeight) * 2 + 1;
            raycaster.setFromCamera(ndc, camera);
            return raycaster.intersectObjects([handle, plane], false).length > 0;
          }

          renderer.domElement.addEventListener('pointerdown', function (e) {
            dragging = hitPlane(e) ? 'plane' : 'orbit';
            lastPoint = Deck.pt(renderer.domElement, e);
            renderer.domElement.setPointerCapture(e.pointerId);
          });
          renderer.domElement.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var p = Deck.pt(renderer.domElement, e);
            var dx = p.x - lastPoint.x;
            var dy = p.y - lastPoint.y;
            if (dragging === 'plane') {
              bias = Deck.clamp(bias - dy * 0.012, Number(biasRange.min), Number(biasRange.max));
              updateGeometry();
            } else {
              yaw -= dx * 0.008;
              pitch = Deck.clamp(pitch + dy * 0.006, -0.05, 1.15);
              updateCamera();
            }
            lastPoint = p;
          });
          function endDrag(e) {
            if (renderer.domElement.hasPointerCapture(e.pointerId)) renderer.domElement.releasePointerCapture(e.pointerId);
            dragging = null;
          }
          renderer.domElement.addEventListener('pointerup', endDrag);
          renderer.domElement.addEventListener('pointercancel', endDrag);
          renderer.domElement.addEventListener('keydown', function (e) {
            if (e.key.indexOf('Arrow') !== 0) return;
            e.preventDefault();
            if (e.shiftKey) {
              if (e.key === 'ArrowLeft') yaw -= 0.08;
              if (e.key === 'ArrowRight') yaw += 0.08;
              if (e.key === 'ArrowUp') pitch = Deck.clamp(pitch + 0.06, -0.05, 1.15);
              if (e.key === 'ArrowDown') pitch = Deck.clamp(pitch - 0.06, -0.05, 1.15);
              updateCamera();
            } else {
              bias = Deck.clamp(bias + (e.key === 'ArrowRight' || e.key === 'ArrowUp' ? 0.05 : -0.05), Number(biasRange.min), Number(biasRange.max));
              updateGeometry();
            }
          });

          rawButton.addEventListener('click', function () { setMode('raw'); });
          featureButton.addEventListener('click', function () { setMode('feature'); });
          biasRange.addEventListener('input', function () { bias = Number(biasRange.value); updateGeometry(); });
          resetButton.addEventListener('click', function () { yaw = 0.68; pitch = 0.48; updateCamera(); });

          Deck.onResize(resize);
          resize();
          updateCamera();
          setMode('raw');
          Deck.loop(function () {
            if (dirty) { renderer.render(scene, camera); dirty = false; }
          }, { still: 0 });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', boot, { once: true });
        } else {
          boot();
        }
      }());
    </script>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
</body>
</html>
