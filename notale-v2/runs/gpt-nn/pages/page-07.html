<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="07" data-total="24">
  <div id="stage">
    <style>
      #stage #page-content {
        block-size: 100%;
      }

      #stage .winter-ledger {
        --ledger-index: 0.66fr;
        --ledger-body: 1.34fr;
      }

      #stage .ledger__index,
      #stage .ledger__body {
        display: flex;
        flex-direction: column;
        gap: var(--sp-4);
      }

      #stage .briefing,
      #stage .archive {
        block-size: 100%;
      }

      #stage .briefing {
        display: flex;
        flex-direction: column;
        gap: var(--sp-4);
        padding: var(--sp-5);
      }

      #stage .briefing h2,
      #stage .archive h2 {
        font-size: var(--fs-h3);
      }

      #stage .briefing-copy {
        color: var(--text-muted);
        font-size: var(--fs-body-sm);
        line-height: var(--lh-body);
      }

      #stage .category-key {
        display: grid;
        gap: var(--sp-2);
      }

      #stage .key-row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: var(--sp-3);
        padding: var(--sp-2) var(--sp-3);
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--surface-control);
        color: var(--text-muted);
        font-size: var(--fs-label);
        line-height: var(--lh-label);
      }

      #stage .key-mark {
        inline-size: var(--sp-4);
        block-size: var(--sp-4);
        border-radius: var(--radius-sm);
        background: var(--secondary);
      }

      #stage .key-row:nth-child(2) .key-mark {
        background: var(--warm);
      }

      #stage .key-row:nth-child(3) .key-mark {
        background: var(--danger);
      }

      #stage .control-cluster {
        display: grid;
        gap: var(--sp-3);
        margin-block-start: auto;
      }

      #stage .assign-row,
      #stage .claim-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: var(--sp-2);
      }

      #stage .assign-row select,
      #stage .claim-row select {
        inline-size: 100%;
        min-inline-size: 0;
      }

      #stage .reset-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: var(--sp-3);
      }

      #stage .status {
        min-block-size: 2.8em;
        color: var(--text-muted);
        font-size: var(--fs-label);
        line-height: var(--lh-label);
      }

      #stage .archive {
        display: flex;
        min-inline-size: 0;
        flex-direction: column;
        padding: var(--sp-4);
      }

      #stage .archive-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: var(--sp-4);
        margin-block-end: var(--sp-3);
      }

      #stage .archive-board {
        display: grid;
        min-block-size: 0;
        flex: 1 1 auto;
        grid-template-rows: repeat(6, minmax(0, 1fr));
        gap: var(--sp-2);
        padding: var(--sp-2);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-lg);
        background: var(--surface-control);
      }

      #stage .archive-board:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: var(--sp-1);
      }

      #stage .evidence-row {
        display: grid;
        grid-template-columns: minmax(132px, 0.54fr) minmax(0, 1.46fr) auto;
        align-items: center;
        gap: var(--sp-3);
        min-block-size: 0;
        padding: var(--sp-2) var(--sp-3);
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--surface-1);
        cursor: pointer;
      }

      #stage .evidence-row[aria-selected="true"] {
        border-color: var(--accent);
        background: var(--accent-soft);
        box-shadow: var(--shadow-glow);
      }

      #stage .evidence-row.is-uncovered {
        border-color: var(--danger);
        background: var(--danger-soft);
      }

      #stage .evidence-row.is-covered {
        border-color: var(--success);
      }

      #stage .record-id {
        display: flex;
        min-inline-size: 0;
        flex-direction: column;
        gap: var(--sp-1);
      }

      #stage .record-date {
        color: var(--accent-strong);
        font-size: var(--fs-label);
        font-weight: var(--weight-bold);
        line-height: var(--lh-label);
      }

      #stage .record-source {
        overflow: hidden;
        color: var(--text-faint);
        font-size: var(--fs-label);
        line-height: var(--lh-label);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #stage .record-text {
        color: var(--text);
        font-size: var(--fs-body-sm);
        line-height: var(--lh-body);
      }

      #stage .record-class {
        min-inline-size: 124px;
        justify-content: center;
      }

      #stage .record-class.is-direct {
        border-color: var(--secondary);
        color: var(--secondary);
      }

      #stage .record-class.is-context {
        border-color: var(--warm);
        color: var(--warm);
      }

      #stage .record-class.is-myth {
        border-color: var(--danger);
        color: var(--danger);
      }

      #stage .record-class.is-wrong {
        border-color: var(--danger);
        background: var(--danger-soft);
        color: var(--danger);
      }

      #stage .coverage-strip {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: var(--sp-3);
        margin-block-start: var(--sp-3);
      }

      #stage .coverage-value {
        color: var(--text-strong);
        font-size: var(--fs-body-lg);
        font-weight: var(--weight-bold);
        line-height: var(--lh-tight);
        white-space: nowrap;
      }

      @media (prefers-reduced-motion: reduce) {
        #stage button {
          transition: none;
        }
      }
    </style>

    <main id="page-content" class="min0" aria-label="本页正文">
      <section class="ledger winter-ledger" aria-label="寒冬史料分类账本">
        <aside class="ledger__index panel briefing min0">
          <div>
            <span class="badge badge--accent">档案任务</span>
            <h2>先归档，再检验单因解释</h2>
          </div>
          <p class="briefing-copy">选中记录，把事实归入三类；全部归档后，再测试一种“唯一原因”能否覆盖整本账。</p>

          <div class="category-key" aria-label="归档类别图例">
            <div class="key-row"><span class="key-mark"></span><span>直接限制单层感知机</span></div>
            <div class="key-row"><span class="key-mark"></span><span>更广泛的 AI 环境</span></div>
            <div class="key-row"><span class="key-mark"></span><span>后人常见误读</span></div>
          </div>

          <div class="control-cluster">
            <div class="assign-row">
              <select id="category-choice" aria-label="所选记录的归档类别">
                <option value="direct">直接限制单层感知机</option>
                <option value="context">更广泛的 AI 环境</option>
                <option value="myth">后人常见误读</option>
              </select>
              <button id="assign" class="button--primary" type="button">归档所选</button>
            </div>

            <div class="claim-row">
              <select id="claim-choice" aria-label="要检验的唯一原因">
                <option value="theory">只保留理论限制</option>
                <option value="environment">只保留外部环境</option>
                <option value="book">只保留一本书</option>
              </select>
              <button id="test-claim" type="button">检验覆盖</button>
            </div>

            <div class="reset-row">
              <output id="status" class="status" aria-live="polite">选一条记录开始归档。</output>
              <button id="reset" class="button--ghost" type="button">重置</button>
            </div>
          </div>
        </aside>

        <section class="ledger__body panel panel--raised archive min0" aria-label="史料记录">
          <div class="archive-head">
            <h2>降温原因档案</h2>
            <span id="progress" class="badge">待归档</span>
          </div>

          <div id="archive-board" class="archive-board" tabindex="0" role="listbox" aria-label="史料卡。上下方向键切换记录，回车归档。"></div>

          <div class="coverage-strip" aria-label="解释覆盖结果">
            <output id="coverage-value" class="coverage-value">尚未检验</output>
            <div class="meter" aria-hidden="true"><div id="coverage-fill" class="meter__fill"></div></div>
          </div>
        </section>
      </section>
    </main>

    <script>
      (function () {
        'use strict';

        function boot() {
          Lec.mount({
            index: 7,
            kicker: `MYTHS OF THE WINTER`,
            title: `感知机受挫之后：别把复杂历史压成一个<em>传说</em>`,
            take: `神经网络降温与理论限制有关，但还受到承诺落差、算力、数据和资助环境共同影响。`
          });

          var board = document.getElementById('archive-board');
          var categoryChoice = document.getElementById('category-choice');
          var claimChoice = document.getElementById('claim-choice');
          var assignButton = document.getElementById('assign');
          var testButton = document.getElementById('test-claim');
          var resetButton = document.getElementById('reset');
          var status = document.getElementById('status');
          var progress = document.getElementById('progress');
          var coverageValue = document.getElementById('coverage-value');
          var coverageFill = document.getElementById('coverage-fill');

          var categories = {
            direct: { short: '单层限制', className: 'is-direct' },
            context: { short: 'AI 环境', className: 'is-context' },
            myth: { short: '常见误读', className: 'is-myth' }
          };

          function safeEventLabel(id, fallback) {
            var value;
            if (typeof Lec.P.eventLabel === 'function') {
              try {
                value = Lec.P.eventLabel(id);
                if (typeof value === 'string') return value;
                if (value && typeof value.label === 'string') return value.label;
              } catch (ignore) {}
            }
            return fallback;
          }

          var evidence = [
            {
              id: 'analysis',
              label: safeEventLabel('perceptrons-book', '《Perceptrons》'),
              source: 'Minsky 与 Papert',
              text: '系统分析单层感知机的表达限制；结论针对特定结构，不等于否定一切多层网络。',
              category: 'direct',
              claims: ['theory', 'book']
            },
            {
              id: 'promise',
              label: '公开叙事',
              source: '媒体与项目承诺',
              text: '早期宣传把有限演示外推为广泛智能，实际进展未能兑现高预期。',
              category: 'context',
              claims: ['environment']
            },
            {
              id: 'hardware',
              label: '计算条件',
              source: '硬件与运行成本',
              text: '可用算力与存储限制了更大模型、更多试验和更复杂训练。',
              category: 'context',
              claims: ['environment']
            },
            {
              id: 'data',
              label: '数据条件',
              source: '采集与数字化',
              text: '大规模、可复用的数字训练数据尚不充足，统一评测也不成熟。',
              category: 'context',
              claims: ['environment']
            },
            {
              id: 'funding',
              label: '制度环境',
              source: '资助方向变化',
              text: '承诺落差与项目评估改变了资助取向，影响不只落在神经网络一条路线。',
              category: 'context',
              claims: ['environment']
            },
            {
              id: 'myth',
              label: '后见叙事',
              source: '单一归因故事',
              text: '把整段低潮说成“一本书、两个人造成”，混淆了理论边界与历史因果。',
              category: 'myth',
              claims: []
            }
          ];

          var state;

          function freshState() {
            return { selected: 0, assignments: {}, testedClaim: null };
          }

          function scoreAssignments() {
            if (typeof Lec.P.evidenceMatchScore === 'function') {
              try {
                return Lec.P.evidenceMatchScore(evidence, state.assignments);
              } catch (ignore) {}
            }
            return evidence.reduce(function (total, item) {
              return total + (state.assignments[item.id] === item.category ? 1 : 0);
            }, 0);
          }

          function coveredIds(claim) {
            var result;
            if (typeof Lec.P.claimCoverage === 'function') {
              try {
                result = Lec.P.claimCoverage(claim, evidence);
                if (result && Array.isArray(result.coveredIds)) return result.coveredIds;
                if (Array.isArray(result)) return result;
              } catch (ignore) {}
            }
            return evidence.filter(function (item) {
              return item.claims.indexOf(claim) !== -1;
            }).map(function (item) { return item.id; });
          }

          function render() {
            var assignedCount = Object.keys(state.assignments).length;
            var covered = state.testedClaim ? coveredIds(state.testedClaim) : [];
            board.innerHTML = '';

            evidence.forEach(function (item, index) {
              var row = document.createElement('div');
              var idBlock = document.createElement('span');
              var date = document.createElement('span');
              var source = document.createElement('span');
              var text = document.createElement('span');
              var badge = document.createElement('span');
              var assigned = state.assignments[item.id];

              row.className = 'evidence-row';
              row.setAttribute('role', 'option');
              row.setAttribute('aria-selected', index === state.selected ? 'true' : 'false');
              row.dataset.index = String(index);
              if (state.testedClaim) {
                row.classList.add(covered.indexOf(item.id) !== -1 ? 'is-covered' : 'is-uncovered');
              }

              idBlock.className = 'record-id';
              date.className = 'record-date';
              date.textContent = item.label;
              source.className = 'record-source';
              source.textContent = item.source;
              idBlock.appendChild(date);
              idBlock.appendChild(source);

              text.className = 'record-text';
              text.textContent = item.text;
              badge.className = 'badge record-class';
              if (assigned) {
                badge.textContent = categories[assigned].short;
                badge.classList.add(categories[assigned].className);
                if (assigned !== item.category) badge.classList.add('is-wrong');
              } else {
                badge.textContent = '未归档';
              }

              row.appendChild(idBlock);
              row.appendChild(text);
              row.appendChild(badge);
              board.appendChild(row);
            });

            progress.textContent = assignedCount === evidence.length ?
              '归档完成 · ' + scoreAssignments() + ' / ' + evidence.length :
              '已归档 ' + assignedCount + ' / ' + evidence.length;

            if (state.testedClaim) {
              var ratio = covered.length / evidence.length;
              coverageValue.textContent = '覆盖 ' + Lec.P.formatPercent(ratio, 0, false);
              coverageFill.style.setProperty('--value', Lec.P.formatPercent(ratio, 0, false));
            } else {
              coverageValue.textContent = '尚未检验';
              coverageFill.style.setProperty('--value', Lec.P.formatPercent(0, 0, false));
            }
          }

          function select(index) {
            state.selected = (index + evidence.length) % evidence.length;
            state.testedClaim = null;
            status.textContent = '已选：' + evidence[state.selected].source + '。请选择类别。';
            render();
          }

          function assign() {
            var item = evidence[state.selected];
            state.assignments[item.id] = categoryChoice.value;
            state.testedClaim = null;
            if (categoryChoice.value === item.category) {
              status.textContent = '匹配：这条记录应归入“' + categories[item.category].short + '”。';
            } else {
              status.textContent = '需复核：这是事实、外部条件，还是后来的叙事？';
            }
            render();
            board.dispatchEvent(new CustomEvent('game-progress', { bubbles: true, detail: { action: 'assign' } }));
            if (Object.keys(state.assignments).length === evidence.length) {
              board.dispatchEvent(new CustomEvent('game-complete', { bubbles: true, detail: { score: scoreAssignments() } }));
            }
          }

          function testClaim() {
            var covered;
            state.testedClaim = claimChoice.value;
            covered = coveredIds(state.testedClaim);
            status.textContent = covered.length === evidence.length ?
              '这项解释覆盖了全部记录。' :
              '红框记录无法由这一种解释说明；单因故事失效。';
            render();
          }

          board.addEventListener('click', function (event) {
            var row = event.target.closest('.evidence-row');
            if (row) {
              select(Number(row.dataset.index));
              board.focus();
            }
          });

          board.addEventListener('keydown', function (event) {
            if (event.key === 'ArrowDown' || event.key === 'ArrowRight') {
              event.preventDefault();
              select(state.selected + 1);
            } else if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') {
              event.preventDefault();
              select(state.selected - 1);
            } else if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              assign();
            }
          });

          assignButton.addEventListener('click', assign);
          testButton.addEventListener('click', testClaim);
          resetButton.addEventListener('click', function () {
            state = freshState();
            status.textContent = '账本已重置。选一条记录重新归档。';
            render();
            board.dispatchEvent(new CustomEvent('game-reset', { bubbles: true }));
          });

          state = freshState();
          render();
          board.dispatchEvent(new CustomEvent('game-start', { bubbles: true }));
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', boot, { once: true });
        } else {
          boot();
        }
      }());
    </script>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
</body>
</html>
