<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="10" data-total="24">
  <div id="stage">
    <style>
      #stage #page-content {
        box-sizing: border-box;
        inline-size: 100%;
        block-size: 100%;
        padding: 190px var(--page-x) 76px;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: var(--sp-4);
      }
      #stage .lab-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--sp-5);
        min-inline-size: 0;
        padding: var(--sp-3) var(--sp-4);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: var(--surface-1);
        box-shadow: var(--shadow-sm);
      }
      #stage .lab-note {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        min-inline-size: 0;
        color: var(--text-muted);
        font-size: var(--fs-body-sm);
        line-height: var(--lh-body);
      }
      #stage .lab-note strong { color: var(--accent-strong); }
      #stage .control-cluster {
        display: flex;
        flex: 0 0 auto;
        gap: var(--sp-2);
      }
      #stage .control-cluster button {
        min-block-size: 46px;
        padding: var(--sp-2) var(--sp-4);
      }
      #stage .triptych { gap: var(--sp-4); }
      #stage .trainer {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        gap: var(--sp-3);
        min-inline-size: 0;
        min-block-size: 0;
        padding: var(--sp-4);
      }
      #stage .trainer[data-slot="1"] {
        border-color: var(--accent);
        box-shadow: var(--shadow-glow);
      }
      #stage .trainer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--sp-3);
      }
      #stage .trainer-title {
        margin: 0;
        color: var(--text-strong);
        font-size: var(--fs-body-lg);
        line-height: var(--lh-tight);
      }
      #stage .rate {
        color: var(--text-muted);
        font-size: var(--fs-label);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      #stage .rate output { color: var(--accent-strong); font-weight: var(--weight-bold); }
      #stage .metric-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--sp-2);
      }
      #stage .mini-readout {
        min-inline-size: 0;
        padding: var(--sp-2) var(--sp-3);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface-control);
      }
      #stage .mini-readout span {
        display: block;
        color: var(--text-faint);
        font-size: var(--fs-label);
        line-height: var(--lh-label);
        white-space: nowrap;
      }
      #stage .mini-readout output {
        display: block;
        overflow: hidden;
        color: var(--text-strong);
        font-size: var(--fs-body);
        font-weight: var(--weight-bold);
        font-variant-numeric: tabular-nums;
        line-height: var(--lh-tight);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #stage .viz {
        inline-size: 100%;
        block-size: 100%;
        min-block-size: 250px;
        overflow: visible;
      }
      #stage .viz text {
        fill: var(--text-faint);
        font-size: var(--fs-tick);
      }
      #stage .viz .plot-label {
        fill: var(--text-muted);
        font-size: var(--fs-label);
        font-weight: var(--weight-semibold);
      }
      #stage .viz .grid-line { stroke: var(--line); stroke-width: 1; }
      #stage .viz .boundary { fill: none; stroke: var(--text-strong); stroke-width: 2.5; }
      #stage .viz .loss-line { fill: none; stroke: var(--warm); stroke-width: 3; }
      #stage .viz .sample-a { fill: var(--secondary); stroke: var(--text-strong); stroke-width: 1.5; }
      #stage .viz .sample-b { fill: var(--accent); stroke: var(--text-inverse); stroke-width: 1.5; }
      #stage .outcome-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--sp-3);
        color: var(--text-muted);
        font-size: var(--fs-label);
        line-height: var(--lh-label);
      }
      #stage .status-mark {
        display: inline-flex;
        align-items: center;
        gap: var(--sp-2);
        font-weight: var(--weight-semibold);
      }
      #stage .status-mark::before {
        content: "";
        inline-size: 10px;
        block-size: 10px;
        flex: 0 0 auto;
        border-radius: var(--radius-pill);
        background: var(--text-faint);
      }
      #stage .status-mark[data-state="learned"] { color: var(--success); }
      #stage .status-mark[data-state="learned"]::before { background: var(--success); }
      #stage .status-mark[data-state="diverged"] { color: var(--danger); }
      #stage .status-mark[data-state="diverged"]::before { background: var(--danger); }
      #stage .iter { font-variant-numeric: tabular-nums; white-space: nowrap; }
    </style>

    <main id="page-content" class="min0" aria-label="学习率三联实时训练台">
      <section class="lab-toolbar min0" aria-label="训练控制">
        <p class="lab-note min0"><strong>控制变量：</strong>数据、初始化与结构完全相同；只交换学习率。</p>
        <div class="control-cluster" role="group" aria-label="训练操作">
          <button id="toggle" class="button--primary" type="button">暂停</button>
          <button id="step" type="button">单步</button>
          <button id="reset" type="button">重置</button>
          <button id="swap" class="button--secondary" type="button">交换学习率</button>
        </div>
      </section>

      <section class="triptych min0" aria-label="三个独立网络的并行训练结果">
        <article class="triptych__pane trainer panel min0" data-slot="0">
          <header class="trainer-head">
            <h2 class="trainer-title">训练台 A</h2>
            <span class="rate">学习率 η = <output data-rate></output></span>
          </header>
          <div class="metric-strip">
            <div class="mini-readout"><span>评估损失</span><output data-loss></output></div>
            <div class="mini-readout"><span>准确率</span><output data-acc></output></div>
            <div class="mini-readout"><span>权重范数</span><output data-norm></output></div>
          </div>
          <svg class="viz" data-viz viewBox="0 0 420 286" role="img" aria-label="训练台 A 的决策边界、样本与实时损失轨迹"></svg>
          <div class="outcome-row"><output class="status-mark" data-outcome aria-live="polite"></output><span class="iter">更新 <output data-iter></output></span></div>
        </article>

        <article class="triptych__pane trainer panel panel--raised min0" data-slot="1">
          <header class="trainer-head">
            <h2 class="trainer-title">训练台 B</h2>
            <span class="rate">学习率 η = <output data-rate></output></span>
          </header>
          <div class="metric-strip">
            <div class="mini-readout"><span>评估损失</span><output data-loss></output></div>
            <div class="mini-readout"><span>准确率</span><output data-acc></output></div>
            <div class="mini-readout"><span>权重范数</span><output data-norm></output></div>
          </div>
          <svg class="viz" data-viz viewBox="0 0 420 286" role="img" aria-label="训练台 B 的决策边界、样本与实时损失轨迹"></svg>
          <div class="outcome-row"><output class="status-mark" data-outcome aria-live="polite"></output><span class="iter">更新 <output data-iter></output></span></div>
        </article>

        <article class="triptych__pane trainer panel min0" data-slot="2">
          <header class="trainer-head">
            <h2 class="trainer-title">训练台 C</h2>
            <span class="rate">学习率 η = <output data-rate></output></span>
          </header>
          <div class="metric-strip">
            <div class="mini-readout"><span>评估损失</span><output data-loss></output></div>
            <div class="mini-readout"><span>准确率</span><output data-acc></output></div>
            <div class="mini-readout"><span>权重范数</span><output data-norm></output></div>
          </div>
          <svg class="viz" data-viz viewBox="0 0 420 286" role="img" aria-label="训练台 C 的决策边界、样本与实时损失轨迹"></svg>
          <div class="outcome-row"><output class="status-mark" data-outcome aria-live="polite"></output><span class="iter">更新 <output data-iter></output></span></div>
        </article>
      </section>
    </main>

    <script defer src="assets/lib/d3.min.js"></script>
    <script defer src="assets/lib/mlp.js"></script>
    <script>
      (function () {
        'use strict';

        function boot() {
          Lec.mount({
            index: 10,
            kicker: `OPTIMIZATION MATTERS`,
            title: `学得太慢、刚刚好，还是<em>来回震荡</em>`,
            take: `能表达答案不等于能顺利学到答案，优化设置决定训练轨迹。`
          });

          var train = [];
          var evaluation = [];
          var rates = [0.002, 0.3, 8];
          var paused = Deck.reduced();
          var frame = 0;
          var panels = Array.prototype.slice.call(document.querySelectorAll('#stage .trainer'));
          var runs = [];

          function makeData(target, offset) {
            var side = 9;
            for (var iy = 0; iy < side; iy += 1) {
              for (var ix = 0; ix < side; ix += 1) {
                var x = -1 + (ix + offset) / 4;
                var y = -1 + (iy + offset) / 4;
                target.push({ x: [x, y], t: x * y > 0 ? 1 : 0 });
              }
            }
          }
          makeData(train, 0);
          makeData(evaluation, 0.14);

          function weightNorm(net) {
            var values = [];
            net.layers.forEach(function (layer) {
              Array.prototype.forEach.call(layer.W, function (v) { values.push(v); });
              Array.prototype.forEach.call(layer.b, function (v) { values.push(v); });
            });
            return Lec.P.vectorNorm(values);
          }

          function metrics(net) {
            var raw = net.evaluate(evaluation);
            if (typeof Lec.P.binaryMetrics === 'function') {
              var predicted = evaluation.map(function (d) { return net.predict(d.x) >= 0.5 ? 1 : 0; });
              var actual = evaluation.map(function (d) { return d.t; });
              var publicMetrics = Lec.P.binaryMetrics(predicted, actual);
              if (publicMetrics && typeof publicMetrics.acc === 'number') raw.acc = publicMetrics.acc;
              if (publicMetrics && typeof publicMetrics.accuracy === 'number') raw.acc = publicMetrics.accuracy;
            }
            if (typeof Lec.P.trainingSnapshot === 'function') {
              var snap = Lec.P.trainingSnapshot(net, evaluation);
              if (snap && typeof snap.loss === 'number') raw.loss = snap.loss;
              if (snap && typeof snap.weightNorm === 'number') raw.norm = snap.weightNorm;
            }
            raw.norm = typeof raw.norm === 'number' ? raw.norm : weightNorm(net);
            return raw;
          }

          function outcome(net, m) {
            if (net.diverged) return { key: 'diverged', label: '数值崩溃' };
            if (typeof Lec.P.learningOutcome === 'function') {
              var answer = Lec.P.learningOutcome(m, net.diverged);
              if (answer && typeof answer === 'object') {
                return { key: answer.learned ? 'learned' : 'waiting', label: answer.label || (answer.learned ? '已学会' : '尚未学会') };
              }
            }
            return m.acc >= 0.9 && m.loss <= 0.35 ?
              { key: 'learned', label: '已学会 · 数值稳定' } :
              { key: 'waiting', label: '尚未学会 · 数值稳定' };
          }

          function fmt(value, digits) {
            return Lec.P.formatNumber(value, digits);
          }

          function setupChart(run) {
            var svg = d3.select(run.svg);
            var plot = svg.append('g').attr('transform', 'translate(12,34)');
            plot.append('text').attr('class', 'plot-label').attr('x', 0).attr('y', -12).text('实时决策边界');
            plot.append('rect').attr('width', 224).attr('height', 224).attr('rx', 8).attr('fill', Deck.token('--surface-control')).attr('stroke', Deck.token('--line'));
            run.cells = plot.append('g').selectAll('rect').data(d3.range(400)).join('rect')
              .attr('x', function (d) { return (d % 20) * 11.2; })
              .attr('y', function (d) { return (19 - Math.floor(d / 20)) * 11.2; })
              .attr('width', 11.35).attr('height', 11.35);
            run.contour = plot.append('path').attr('class', 'boundary');
            plot.selectAll('circle').data(evaluation).join('circle')
              .attr('class', function (d) { return d.t ? 'sample-b' : 'sample-a'; })
              .attr('cx', function (d) { return (d.x[0] + 1.1) / 2.2 * 224; })
              .attr('cy', function (d) { return 224 - (d.x[1] + 1.1) / 2.2 * 224; })
              .attr('r', 3.7);

            var loss = svg.append('g').attr('transform', 'translate(260,34)');
            loss.append('text').attr('class', 'plot-label').attr('x', 0).attr('y', -12).text('损失轨迹');
            d3.range(5).forEach(function (i) {
              loss.append('line').attr('class', 'grid-line').attr('x1', 0).attr('x2', 146).attr('y1', i * 56).attr('y2', i * 56);
            });
            loss.append('line').attr('class', 'grid-line').attr('x1', 0).attr('x2', 0).attr('y1', 0).attr('y2', 224);
            run.lossPath = loss.append('path').attr('class', 'loss-line');
            run.lossDot = loss.append('circle').attr('r', 5).attr('fill', Deck.token('--warm'));
          }

          function createRuns() {
            runs = panels.map(function (panel, i) {
              var net = MLP.create({ sizes: [2, 8, 8, 1], act: 'tanh', lr: rates[i], seed: 42, wmax: 10000 });
              var run = { panel: panel, net: net, history: [], field: new Float64Array(400), svg: panel.querySelector('[data-viz]') };
              setupChart(run);
              return run;
            });
          }

          function draw(run, forceField) {
            var m = metrics(run.net);
            var panel = run.panel;
            panel.querySelector('[data-rate]').textContent = fmt(run.net.lr, run.net.lr < 0.01 ? 3 : 1);
            panel.querySelector('[data-loss]').textContent = fmt(m.loss, 3);
            panel.querySelector('[data-acc]').textContent = Lec.P.formatPercent(m.acc, 0, false);
            panel.querySelector('[data-norm]').textContent = fmt(m.norm, 2);
            panel.querySelector('[data-iter]').textContent = fmt(run.net.iter, 0);
            var state = outcome(run.net, m);
            var status = panel.querySelector('[data-outcome]');
            status.textContent = state.label;
            status.setAttribute('data-state', state.key);

            if (forceField) {
              run.net.field(-1.1, -1.1, 1.1, 1.1, 20, 20, run.field);
              run.cells
                .attr('fill', function (d) { return run.field[d] >= 0.5 ? Deck.token('--accent') : Deck.token('--secondary'); })
                .attr('fill-opacity', function (d) { return 0.16 + Math.abs(run.field[d] - 0.5) * 1.25; });
              var contours = d3.contours().size([20, 20]).thresholds([0.5])(run.field);
              run.contour.attr('d', contours.length ? d3.geoPath(d3.geoIdentity().reflectY(true).scale(11.2).translate([0, 224]))(contours[0]) : null);
            }

            var shown = run.history.slice(-80);
            var yMax = Math.max(1, d3.max(shown, function (d) { return d.loss; }) || 1);
            var x = d3.scaleLinear().domain([0, Math.max(1, shown.length - 1)]).range([0, 146]);
            var y = d3.scaleLinear().domain([0, yMax]).range([224, 0]);
            var line = d3.line().x(function (d, i) { return x(i); }).y(function (d) { return y(d.loss); });
            run.lossPath.datum(shown).attr('d', line);
            if (shown.length) {
              run.lossDot.attr('cx', x(shown.length - 1)).attr('cy', y(shown[shown.length - 1].loss));
            }
          }

          function record(run) {
            var m = metrics(run.net);
            run.history.push({ loss: m.loss, acc: m.acc });
          }

          function resetAll() {
            runs.forEach(function (run, i) {
              run.net.lr = rates[i];
              run.net.reset();
              run.history = [];
              record(run);
              draw(run, true);
            });
          }

          function advance(count) {
            runs.forEach(function (run) {
              for (var i = 0; i < count; i += 1) run.net.step(train, 16);
              record(run);
            });
            frame += 1;
            runs.forEach(function (run) { draw(run, frame % 4 === 0); });
          }

          createRuns();
          resetAll();

          var toggle = document.getElementById('toggle');
          toggle.textContent = paused ? '继续' : '暂停';
          toggle.addEventListener('click', function () {
            paused = !paused;
            toggle.textContent = paused ? '继续' : '暂停';
          });
          document.getElementById('step').addEventListener('click', function () {
            paused = true;
            toggle.textContent = '继续';
            advance(1);
          });
          document.getElementById('reset').addEventListener('click', function () {
            resetAll();
          });
          document.getElementById('swap').addEventListener('click', function () {
            rates.push(rates.shift());
            resetAll();
          });

          Deck.loop(function () {
            if (!paused) advance(2);
          }, { still: 0 });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', boot, { once: true });
        } else {
          boot();
        }
      }());
    </script>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
</body>
</html>
