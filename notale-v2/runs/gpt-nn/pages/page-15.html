<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="15" data-total="24">
  <div id="stage">
    <style>
      #stage #page-content { block-size: 100%; }
      #stage .factor-grid { gap: var(--sp-5); }
      #stage .factor-pane {
        display: flex;
        flex-direction: column;
        min-inline-size: 0;
        min-block-size: 0;
        padding: var(--sp-5);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: linear-gradient(145deg, var(--surface-2), var(--surface-1));
        box-shadow: var(--shadow-sm);
      }
      #stage .factor-pane[data-factor="data"] { --factor: var(--secondary); }
      #stage .factor-pane[data-factor="compute"] { --factor: var(--warm); }
      #stage .factor-pane[data-factor="activation"] { --factor: var(--accent); }
      #stage .factor-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--sp-3);
        margin-block-end: var(--sp-3);
      }
      #stage .factor-index {
        display: grid;
        inline-size: var(--control-h);
        block-size: var(--control-h);
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid var(--factor);
        border-radius: var(--radius-md);
        color: var(--factor);
        font-size: var(--fs-body-lg);
        font-weight: var(--weight-bold);
      }
      #stage .factor-title { font-size: var(--fs-h3); }
      #stage .factor-subtitle {
        margin-block-start: var(--sp-1);
        color: var(--text-muted);
        font-size: var(--fs-label);
        line-height: var(--lh-label);
      }
      #stage .history-tag {
        display: inline-flex;
        align-items: center;
        max-inline-size: 100%;
        min-block-size: 34px;
        margin-block-end: var(--sp-3);
        padding: var(--sp-1) var(--sp-3);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-pill);
        color: var(--text-muted);
        font-size: var(--fs-label);
        line-height: var(--lh-label);
        white-space: nowrap;
      }
      #stage .control-block {
        padding: var(--sp-3) var(--sp-4);
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--surface-control);
      }
      #stage .control-top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--sp-3);
      }
      #stage .control-top label {
        color: var(--text-muted);
        font-size: var(--fs-label);
        font-weight: var(--weight-semibold);
      }
      #stage .setting-value {
        color: var(--factor);
        font-size: var(--fs-body-sm);
        font-weight: var(--weight-bold);
      }
      #stage input[type="range"] { accent-color: var(--factor); }
      #stage .experiment-plot {
        position: relative;
        min-block-size: 138px;
        margin-block: var(--sp-3);
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--surface-control);
      }
      #stage .experiment-plot svg { display: block; inline-size: 100%; block-size: 100%; }
      #stage .chart-grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 6; }
      #stage .chart-area { fill: var(--factor); opacity: .12; }
      #stage .chart-line { fill: none; stroke: var(--factor); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      #stage .chart-dot { fill: var(--surface-control); stroke: var(--factor); stroke-width: 3; }
      #stage .chart-label { fill: var(--text-faint); font-size: var(--fs-tick); }
      #stage .metric-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--sp-2);
        margin-block-start: auto;
      }
      #stage .metric {
        min-inline-size: 0;
        padding: var(--sp-2) var(--sp-3);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface-control);
      }
      #stage .metric-label {
        display: block;
        color: var(--text-faint);
        font-size: var(--fs-label);
        line-height: var(--lh-label);
      }
      #stage .metric-value {
        display: block;
        color: var(--text-strong);
        font-size: var(--fs-body-sm);
        font-weight: var(--weight-bold);
        line-height: var(--lh-tight);
      }
      #stage .factor-note {
        margin-block-start: var(--sp-3);
        padding-block-start: var(--sp-3);
        border-block-start: 1px solid var(--line);
        color: var(--text-muted);
        font-size: var(--fs-body-sm);
        line-height: var(--lh-body);
      }
      #stage .synergy {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: var(--sp-4);
        padding: var(--sp-3) var(--sp-5);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-lg);
        background: var(--surface-2);
      }
      #stage .synergy-copy { min-inline-size: 0; }
      #stage .synergy-title {
        color: var(--text-strong);
        font-size: var(--fs-body-sm);
        font-weight: var(--weight-bold);
      }
      #stage .synergy-hint {
        color: var(--text-muted);
        font-size: var(--fs-label);
        line-height: var(--lh-label);
      }
      #stage .synergy-track {
        block-size: var(--sp-3);
        overflow: clip;
        border: 1px solid var(--line);
        border-radius: var(--radius-pill);
        background: var(--surface-control);
      }
      #stage .synergy-fill {
        block-size: 100%;
        inline-size: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--secondary), var(--warm), var(--accent));
        transition: inline-size 180ms ease;
      }
      #stage .synergy-state {
        min-inline-size: 5em;
        color: var(--accent-strong);
        font-size: var(--fs-body-sm);
        font-weight: var(--weight-bold);
        text-align: end;
      }
      #stage input:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) {
        #stage .synergy-fill { transition: none; }
      }
    </style>

    <main id="page-content" class="min0" aria-label="数据、算力与激活函数控制变量实验">
      <section class="triptych factor-grid min0" aria-label="三座并行控制变量实验台">
        <article class="triptych__pane factor-pane min0" data-factor="data">
          <header class="factor-head">
            <div class="min0">
              <h2 class="factor-title">数据</h2>
              <p class="factor-subtitle">只改变训练样本覆盖</p>
            </div>
            <span class="factor-index" aria-hidden="true">D</span>
          </header>
          <div class="history-tag" id="data-history">加载历史标签</div>
          <div class="control-block">
            <div class="control-top">
              <label for="data-control">样本规模</label>
              <output class="setting-value" id="data-setting" for="data-control">—</output>
            </div>
            <input id="data-control" type="range" aria-describedby="data-note">
          </div>
          <div class="experiment-plot min0"><svg id="data-chart" role="img" aria-label="数据条件下的训练表现轨迹"></svg></div>
          <div class="metric-grid" id="data-metrics" aria-live="polite"></div>
          <p class="factor-note" id="data-note">样本不足时，训练集表现可能不错，未见样本却更容易失手。</p>
        </article>

        <article class="triptych__pane factor-pane min0" data-factor="compute">
          <header class="factor-head">
            <div class="min0">
              <h2 class="factor-title">算力</h2>
              <p class="factor-subtitle">只改变单位时间更新预算</p>
            </div>
            <span class="factor-index" aria-hidden="true">G</span>
          </header>
          <div class="history-tag" id="compute-history">加载历史标签</div>
          <div class="control-block">
            <div class="control-top">
              <label for="compute-control">更新预算</label>
              <output class="setting-value" id="compute-setting" for="compute-control">—</output>
            </div>
            <input id="compute-control" type="range" aria-describedby="compute-note">
          </div>
          <div class="experiment-plot min0"><svg id="compute-chart" role="img" aria-label="算力条件下的训练表现轨迹"></svg></div>
          <div class="metric-grid" id="compute-metrics" aria-live="polite"></div>
          <p class="factor-note" id="compute-note">更高吞吐让同样墙钟时间容纳更多更新，但不会凭空补足数据。</p>
        </article>

        <article class="triptych__pane factor-pane min0" data-factor="activation">
          <header class="factor-head">
            <div class="min0">
              <h2 class="factor-title">训练技巧</h2>
              <p class="factor-subtitle">只改变隐藏层激活函数</p>
            </div>
            <span class="factor-index" aria-hidden="true">ƒ</span>
          </header>
          <div class="history-tag" id="activation-history">加载历史标签</div>
          <div class="control-block">
            <div class="control-top">
              <label for="activation-control">激活函数</label>
              <output class="setting-value" id="activation-setting" for="activation-control">—</output>
            </div>
            <input id="activation-control" type="range" aria-describedby="activation-note">
          </div>
          <div class="experiment-plot min0"><svg id="activation-chart" role="img" aria-label="激活函数条件下的训练表现轨迹"></svg></div>
          <div class="metric-grid" id="activation-metrics" aria-live="polite"></div>
          <p class="factor-note" id="activation-note">梯度更活跃，更新才更容易穿过多层；技巧仍需数据与预算配合。</p>
        </article>

        <aside class="synergy" aria-label="组合条件结论">
          <div class="synergy-copy">
            <div class="synergy-title">组合效应</div>
            <div class="synergy-hint">拖动任一实验台；另两项保持不变，便于控制变量。</div>
          </div>
          <div class="synergy-track" aria-hidden="true"><div class="synergy-fill" id="synergy-fill"></div></div>
          <output class="synergy-state" id="synergy-state" aria-live="polite">—</output>
        </aside>
      </section>
    </main>

    <script defer src="assets/lib/d3.min.js"></script>
    <script>
      (function () {
        'use strict';

        function boot() {
          Lec.mount({
            index: 15,
            kicker: `WHY THE MOMENT ARRIVED`,
            title: `数据、算力与训练技巧：少一块都不是同一场<em>突破</em>`,
            take: `深度学习的跃迁来自条件组合，而不是某个早已存在的公式突然开始生效。`
          });
          var mountedTitle = document.querySelector('.lec-header__title');
          if (mountedTitle) {
            mountedTitle.innerHTML = mountedTitle.textContent;
          }

          var P = Lec.P;
          var K = Lec.K;
          var factors = ['data', 'compute', 'activation'];
          var names = {
            data: ['小规模', '扩大', '充分'],
            compute: ['受限', '加速', '充足'],
            activation: ['Sigmoid', 'Tanh', 'ReLU']
          };
          var state = { data: 1, compute: 1, activation: 1 };
          var metricNames = ['表现', '耗时', '梯度活跃', '泛化差距'];
          var levels = ['低', '中', '高'];

          function eventText(id) {
            if (typeof P.eventLabel === 'function') {
              return P.eventLabel(id);
            }
            var event = P.eventById(id);
            return event ? event.title + ' · ' + P.formatNumber(event.year) : '';
          }

          function setupHistory() {
            document.getElementById('data-history').textContent = eventText('imagenet');
            document.getElementById('compute-history').textContent = 'GPU · ' + eventText('alexnet');
            document.getElementById('activation-history').textContent = 'ReLU · ' + eventText('alexnet');
          }

          function configureControls() {
            factors.forEach(function (factor) {
              var input = document.getElementById(factor + '-control');
              input.min = P.formatNumber(0);
              input.max = P.formatNumber(names[factor].length - 1);
              input.step = P.formatNumber(1);
              input.value = P.formatNumber(state[factor]);
              input.addEventListener('input', function () {
                state[factor] = P.clamp(Number(input.value), 0, names[factor].length - 1);
                render();
              });
            });
          }

          function fallbackMetrics(changedFactor) {
            var d = state.data;
            var c = state.compute;
            var a = state.activation;
            var sum = d + c + a;
            var active = P.round(P.safeDivide(a + c, K.ARCHITECTURE.LSTM_GATES), 2);
            var coverage = P.round(P.safeDivide(d + a, K.ARCHITECTURE.LSTM_GATES), 2);
            var speed = P.round(P.safeDivide(c + 1, K.ARCHITECTURE.GRU_GATES), 2);
            var performance = P.round(P.safeDivide(sum, (names.data.length - 1) * factors.length), 2);
            return {
              performance: performance,
              time: 1 - speed,
              gradient: active,
              gap: 1 - coverage,
              trace: d3.range(K.ARCHITECTURE.LSTM_GATES + 1).map(function (i) {
                var progress = P.safeDivide(i, K.ARCHITECTURE.LSTM_GATES);
                var factorLift = changedFactor === 'compute' ? speed : changedFactor === 'activation' ? active : coverage;
                return P.clamp(progress * performance + progress * (1 - progress) * factorLift, 0, 1);
              })
            };
          }

          function metricsFor(factor) {
            if (typeof P.stratifiedSubset === 'function' && typeof P.stepBudget === 'function' && typeof P.experimentMetrics === 'function' && K.breakthroughFactors) {
              var subset = P.stratifiedSubset(K.breakthroughFactors.data, state.data);
              var budget = P.stepBudget(K.breakthroughFactors, state.compute);
              return P.experimentMetrics({ subset: subset, budget: budget, activation: names.activation[state.activation], seed: K.breakthroughFactors.seed });
            }
            return fallbackMetrics(factor);
          }

          function qualitative(value, inverse) {
            var v = inverse ? 1 - value : value;
            var index = P.clamp(Math.round(v * (levels.length - 1)), 0, levels.length - 1);
            return levels[index];
          }

          function drawChart(factor, trace) {
            var svg = d3.select('#' + factor + '-chart');
            var node = svg.node();
            var width = node.clientWidth || 400;
            var height = node.clientHeight || 138;
            var pad = { top: 18, right: 18, bottom: 30, left: 18 };
            var x = d3.scaleLinear().domain([0, trace.length - 1]).range([pad.left, width - pad.right]);
            var y = d3.scaleLinear().domain([0, 1]).range([height - pad.bottom, pad.top]);
            var line = d3.line().x(function (d, i) { return x(i); }).y(function (d) { return y(d); }).curve(d3.curveMonotoneX);
            var area = d3.area().x(function (d, i) { return x(i); }).y0(height - pad.bottom).y1(function (d) { return y(d); }).curve(d3.curveMonotoneX);
            svg.attr('viewBox', '0 0 ' + width + ' ' + height);
            svg.selectAll('*').remove();
            svg.append('line').attr('class', 'chart-grid').attr('x1', pad.left).attr('x2', width - pad.right).attr('y1', y(.5)).attr('y2', y(.5));
            svg.append('path').datum(trace).attr('class', 'chart-area').attr('d', area);
            svg.append('path').datum(trace).attr('class', 'chart-line').attr('d', line);
            svg.selectAll('circle').data(trace).join('circle').attr('class', 'chart-dot').attr('cx', function (d, i) { return x(i); }).attr('cy', function (d) { return y(d); }).attr('r', 4);
            svg.append('text').attr('class', 'chart-label').attr('x', pad.left).attr('y', height - 9).text('开始');
            svg.append('text').attr('class', 'chart-label').attr('text-anchor', 'end').attr('x', width - pad.right).attr('y', height - 9).text('同等墙钟时间');
          }

          function renderMetrics(factor, metrics) {
            var values = [
              qualitative(metrics.performance, false),
              qualitative(metrics.time, true),
              qualitative(metrics.gradient, false),
              qualitative(metrics.gap, true)
            ];
            d3.select('#' + factor + '-metrics').selectAll('.metric').data(metricNames.map(function (name, i) {
              return { name: name, value: values[i] };
            })).join('div').attr('class', 'metric').html(function (d) {
              return '<span class="metric-label">' + d.name + '</span><span class="metric-value">' + d.value + '</span>';
            });
          }

          function render() {
            var combined = 1;
            factors.forEach(function (factor) {
              var metrics = metricsFor(factor);
              document.getElementById(factor + '-setting').textContent = names[factor][state[factor]];
              drawChart(factor, metrics.trace);
              renderMetrics(factor, metrics);
              combined *= P.safeDivide(state[factor] + 1, names[factor].length);
            });
            document.getElementById('synergy-fill').style.inlineSize = P.formatPercent(combined, 0, false);
            document.getElementById('synergy-state').textContent = qualitative(combined, false) + '协同';
          }

          setupHistory();
          configureControls();
          render();
          Deck.onResize(render);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', boot, { once: true });
        } else {
          boot();
        }
      }());
    </script>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
</body>
</html>
