<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="16" data-total="24">
  <div id="stage">
    <style>
      #stage #page-content { block-size: 100%; }
      #stage .split-lr { --left: 1.48fr; --right: .82fr; }
      #stage .race-bay,
      #stage .score-rail { block-size: 100%; }
      #stage .race-bay { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: var(--sp-4); }
      #stage .machine { position: relative; display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); gap: var(--sp-5); overflow: clip; }
      #stage .machine::before { content: ""; position: absolute; inset: var(--sp-4); border: 1px dashed var(--line); border-radius: var(--radius-md); pointer-events: none; }
      #stage .image-well { position: relative; z-index: 1; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: var(--sp-3); min-block-size: 0; }
      #stage .preview-grid { display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-3); min-block-size: 0; }
      #stage .frame { position: relative; min-block-size: 0; overflow: clip; border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface-control); }
      #stage .frame canvas { display: block; inline-size: 100%; block-size: 100%; }
      #stage .frame-tag { position: absolute; inset-block-start: var(--sp-2); inset-inline-start: var(--sp-2); padding: var(--sp-1) var(--sp-3); border-radius: var(--radius-pill); background: var(--surface-2); color: var(--text-muted); font-size: var(--fs-label); line-height: var(--lh-label); }
      #stage .assembly { position: relative; z-index: 1; display: flex; flex-direction: column; gap: var(--sp-3); min-block-size: 0; }
      #stage .assembly-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
      #stage .module-list { display: grid; gap: var(--sp-2); }
      #stage .module { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--sp-3); min-block-size: var(--control-h); padding: var(--sp-2) var(--sp-3); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-control); cursor: pointer; }
      #stage .module:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
      #stage .module strong { font-size: var(--fs-body-sm); }
      #stage .module .caption { white-space: nowrap; }
      #stage .run-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-3); align-items: center; }
      #stage .run-row button { inline-size: 100%; }
      #stage .status-strip { min-block-size: calc(var(--control-h) + var(--sp-4)); padding: var(--sp-3) var(--sp-4); border-inline-start: 6px solid var(--secondary); border-radius: var(--radius-md); background: var(--secondary-soft); color: var(--text); font-size: var(--fs-body-sm); line-height: var(--lh-body); }
      #stage .status-strip[data-tone="success"] { border-inline-start-color: var(--success); background: var(--success-soft); }
      #stage .status-strip[data-tone="danger"] { border-inline-start-color: var(--danger); background: var(--danger-soft); }
      #stage .score-rail { display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: var(--sp-4); }
      #stage .history-card { display: grid; gap: var(--sp-3); }
      #stage .history-event { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding-block-end: var(--sp-2); border-block-end: 1px solid var(--line); }
      #stage .history-event:last-child { padding-block-end: 0; border-block-end: 0; }
      #stage .metric-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
      #stage .compact-readout { padding: var(--sp-3); }
      #stage .compact-readout .readout__value { font-size: var(--fs-h3); }
      #stage .local-card { display: flex; flex-direction: column; gap: var(--sp-3); min-block-size: 0; }
      #stage .telemetry { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
      #stage .telemetry-line { padding: var(--sp-3); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-control); }
      #stage .telemetry-line output { display: block; margin-block-start: var(--sp-1); color: var(--accent-strong); font-size: var(--fs-body-lg); font-weight: var(--weight-bold); line-height: var(--lh-tight); font-variant-numeric: tabular-nums; }
      #stage .result-box { flex: 1 1 auto; min-block-size: 0; padding: var(--sp-4); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-control); }
      #stage .result-box strong { display: block; margin-block-end: var(--sp-2); font-size: var(--fs-body-lg); }
      #stage input:focus-visible,
      #stage button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) {
        #stage * { transition-duration: 0s !important; }
      }
    </style>

    <main id="page-content" class="min0" aria-label="本页正文">
      <section class="split-lr" aria-label="AlexNet 比赛日工程挑战">
        <div class="split-lr__left race-bay min0">
          <section class="panel panel--raised machine min0" aria-labelledby="bench-title">
            <div class="image-well min0">
              <div class="assembly-head">
                <h2 id="bench-title" class="card-title">本机微型赛道</h2>
                <span class="badge badge--accent">真实卷积</span>
              </div>
              <div class="preview-grid min0">
                <div class="frame min0"><canvas id="source" class="cv-fill" aria-label="本地测试图片"></canvas><span class="frame-tag">本地图片</span></div>
                <div class="frame min0"><canvas id="feature" class="cv-fill" aria-label="卷积前向后的特征图"></canvas><span class="frame-tag">当前特征</span></div>
              </div>
            </div>

            <div class="assembly min0">
              <div class="assembly-head"><h3 class="card-title">装配流水线</h3><span id="module-count" class="badge">待装配</span></div>
              <div class="module-list" role="group" aria-label="选择前向模块">
                <label class="module"><input type="checkbox" data-module="augment" checked><strong>数据增强</strong><span class="caption">输入</span></label>
                <label class="module"><input type="checkbox" data-module="conv" checked><strong>卷积</strong><span class="caption">提取</span></label>
                <label class="module"><input type="checkbox" data-module="relu" checked><strong>ReLU</strong><span class="caption">激活</span></label>
                <label class="module"><input type="checkbox" data-module="pool" checked><strong>池化</strong><span class="caption">压缩</span></label>
                <label class="module"><input type="checkbox" data-module="head" checked><strong>分类头</strong><span class="caption">读出</span></label>
              </div>
              <button id="run" class="button--primary" type="button">启动比赛日推理</button>
            </div>
          </section>
          <div id="status" class="status-strip" role="status" aria-live="polite">目标：装齐工程链后运行；也可拆掉任一模块，观察消融后果。</div>
        </div>

        <aside class="split-lr__right score-rail min0" aria-label="历史成绩与本机遥测">
          <section class="card history-card" aria-labelledby="history-title">
            <div class="card-header"><h2 id="history-title" class="card-title">历史赛场</h2><span class="badge">公开基准</span></div>
            <div class="history-event"><strong id="imagenet-event">ImageNet</strong><span class="caption">统一评测</span></div>
            <div class="history-event"><strong id="alexnet-event">AlexNet</strong><span class="caption">工程组合</span></div>
            <div class="metric-pair">
              <div class="readout compact-readout"><span class="readout__label">AlexNet Top-5 误差</span><output id="alex-error" class="readout__value">—</output></div>
              <div class="readout compact-readout"><span class="readout__label">同届次名误差</span><output id="runner-error" class="readout__value">—</output></div>
            </div>
          </section>

          <section class="card local-card" aria-labelledby="local-title">
            <div class="card-header"><h2 id="local-title" class="card-title">本机遥测</h2><span class="badge badge--accent">微型实验</span></div>
            <div class="telemetry">
              <div class="telemetry-line"><span class="caption">卷积耗时中位数</span><output id="latency">待运行</output></div>
              <div class="telemetry-line"><span class="caption">推理后张量数</span><output id="memory">待运行</output></div>
            </div>
            <div class="result-box"><strong id="prediction">尚未发车</strong><p id="consequence" class="body-sm">这里执行的是当前浏览器上的小图前向，不是复刻完整训练。</p></div>
          </section>
        </aside>
      </section>
    </main>

    <script defer src="assets/lib/tf.min.js"></script>
    <script>
      (function () {
        'use strict';

        function boot() {
          Lec.mount({
            index: 16,
            kicker: `THE IMAGENET SHOCK`,
            title: `AlexNet：一次把研究共同体方向推歪的<em>胜差</em>`,
            take: `AlexNet 的影响来自公开基准上的显著结果，以及卷积、GPU、ReLU、正则化和数据增强的工程组合。`
          });

          var mountedTitle = document.querySelector('.lec-header__title');
          if (mountedTitle) mountedTitle.innerHTML = mountedTitle.textContent;

          var source = document.getElementById('source');
          var feature = document.getElementById('feature');
          var checks = Array.prototype.slice.call(document.querySelectorAll('[data-module]'));
          var runButton = document.getElementById('run');
          var status = document.getElementById('status');
          var state = { runs: 0, dirty: true, last: null };
          var lastFeature = null;

          function drawSource() {
            var ctx = Deck.fit(source);
            var w = source.clientWidth;
            var h = source.clientHeight;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = Deck.rgba('--surface-control', 1);
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = Deck.rgba('--secondary', .34);
            ctx.fillRect(w * .08, h * .12, w * .84, h * .76);
            ctx.fillStyle = Deck.rgba('--warm', .92);
            ctx.beginPath(); ctx.arc(w * .36, h * .54, Math.min(w, h) * .2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = Deck.rgba('--accent', .88);
            ctx.fillRect(w * .54, h * .3, w * .24, h * .45);
            ctx.strokeStyle = Deck.rgba('--text-strong', .82);
            ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(w * .12, h * .78); ctx.lineTo(w * .86, h * .22); ctx.stroke();
          }

          function drawFeature(values) {
            var ctx = Deck.fit(feature);
            var w = feature.clientWidth;
            var h = feature.clientHeight;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = Deck.rgba('--surface-control', 1);
            ctx.fillRect(0, 0, w, h);
            if (!values || !values.data.length) return;
            var rows = values.shape[0];
            var cols = values.shape[1];
            var cw = w / cols;
            var ch = h / rows;
            var max = Lec.P.maximum(values.data);
            var min = Lec.P.minimum(values.data);
            var span = max - min || 1;
            for (var y = 0; y < rows; y += 1) {
              for (var x = 0; x < cols; x += 1) {
                var v = (values.data[y * cols + x] - min) / span;
                ctx.fillStyle = Deck.rgba(v > .5 ? '--accent' : '--secondary', .18 + v * .82);
                ctx.fillRect(x * cw, y * ch, Math.ceil(cw), Math.ceil(ch));
              }
            }
          }

          function modules() {
            var result = {};
            checks.forEach(function (input) { result[input.dataset.module] = input.checked; });
            return result;
          }

          function infer(config) {
            return tf.tidy(function () {
              var x = tf.browser.fromPixels(source).toFloat().div(255).expandDims(0);
              x = tf.image.resizeBilinear(x, [64, 64]);
              if (config.augment) x = x.reverse([2]);
              if (config.conv) {
                var kernel = tf.eye(3).reshape([1,1,3,3]).tile([3,3,1,1]).div(9);
                x = tf.conv2d(x, kernel, 1, 'same');
              }
              if (config.relu) x = tf.relu(x);
              if (config.pool) x = tf.maxPool(x, [2,2], [2,2], 'same');
              var map = x.mean(3).squeeze();
              var mapData = Array.prototype.slice.call(map.dataSync());
              var scores = null;
              if (config.head) {
                var pooled = x.mean([1,2]);
                var weights = tf.tensor2d([.8,-.3,.2, -.2,.7,.3, .1,.2,.9], [3,3]);
                scores = Array.prototype.slice.call(tf.softmax(pooled.matMul(weights)).dataSync());
              }
              return { feature: { data: mapData, shape: map.shape.slice() }, scores: scores };
            });
          }

          function benchmark() {
            var samples = [];
            var sampleConfig = { augment: false, conv: true, relu: true, pool: false, head: false };
            for (var i = 0; i < 5; i += 1) {
              var start = performance.now();
              infer(sampleConfig);
              samples.push(performance.now() - start);
            }
            return { median: Lec.P.median(samples), samples: samples };
          }

          function updateAssembly() {
            var active = checks.filter(function (input) { return input.checked; }).length;
            document.getElementById('module-count').textContent = Lec.P.formatNumber(active) + ' / ' + Lec.P.formatNumber(checks.length);
            if (state.runs && state.dirty) runButton.textContent = '运行当前消融';
          }

          function reset() {
            checks.forEach(function (input) { input.checked = true; });
            state = { runs: 0, dirty: true, last: null };
            lastFeature = null;
            drawFeature(null);
            status.dataset.tone = '';
            status.textContent = '目标：装齐工程链后运行；也可拆掉任一模块，观察消融后果。';
            document.getElementById('latency').textContent = '待运行';
            document.getElementById('memory').textContent = '待运行';
            document.getElementById('prediction').textContent = '尚未发车';
            document.getElementById('consequence').textContent = '这里执行的是当前浏览器上的小图前向，不是复刻完整训练。';
            runButton.textContent = '启动比赛日推理';
            updateAssembly();
          }

          function run() {
            if (state.runs && !state.dirty) { reset(); return; }
            var config = modules();
            var result = infer(config);
            var bench = benchmark();
            var memory = tf.memory();
            var missing = checks.filter(function (input) { return !input.checked; }).map(function (input) { return input.parentNode.querySelector('strong').textContent; });
            var labels = ['边缘型', '纹理型', '色块型'];
            lastFeature = result.feature;
            drawFeature(lastFeature);
            document.getElementById('latency').textContent = Lec.P.formatDuration(bench.median / 1000, 3);
            document.getElementById('memory').textContent = Lec.P.formatNumber(memory.numTensors) + ' 个';
            if (result.scores) {
              var winner = Lec.P.argmax(result.scores);
              document.getElementById('prediction').textContent = labels[winner] + ' · ' + Lec.P.formatPercent(result.scores[winner], 1, false);
            } else {
              document.getElementById('prediction').textContent = '无分类输出';
            }
            if (!missing.length) {
              status.dataset.tone = 'success';
              status.textContent = '挑战完成：整条工程链成功执行。现在拆掉模块，可继续做消融。';
              document.getElementById('consequence').textContent = '卷积、激活、压缩、增强与读出共同构成可运行系统；单项名称并不等于完整突破。';
            } else {
              status.dataset.tone = 'danger';
              status.textContent = '仍可运行，但工程链不完整：缺少' + missing.join('、') + '。';
              document.getElementById('consequence').textContent = config.head ? '输出仍存在，却来自不同的特征路径，不能当作同一模型比较。' : '没有分类头，特征被计算出来，却无法形成比赛提交。';
            }
            state.runs += 1;
            state.dirty = false;
            state.last = { modules: config, missing: missing.slice() };
            runButton.textContent = '重置挑战';
          }

          checks.forEach(function (input) {
            input.addEventListener('change', function () { state.dirty = true; updateAssembly(); });
          });
          runButton.addEventListener('click', run);

          var history = Lec.P.alexNetBreakthrough();
          var imageNetEvent = Lec.P.eventById('imagenet');
          var alexNetEvent = Lec.P.eventById('alexnet');
          document.getElementById('imagenet-event').textContent = imageNetEvent.title;
          document.getElementById('alexnet-event').textContent = alexNetEvent.title;
          document.getElementById('alex-error').textContent = Lec.P.formatPercent(history.alexNetError, 1, true);
          document.getElementById('runner-error').textContent = Lec.P.formatPercent(history.runnerUpError, 1, true);

          Deck.autofit(source, drawSource);
          Deck.onResize(function () { drawSource(); drawFeature(lastFeature); });
          reset();
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', boot, { once: true });
        } else {
          boot();
        }
      }());
    </script>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
</body>
</html>
