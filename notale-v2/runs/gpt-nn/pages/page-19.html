<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="19" data-total="24">
<div id="stage">
  <style>
    #stage #page-content { block-size: 100%; }
    #stage .attention-page { --top: 1.08fr; --bottom: 0.92fr; gap: var(--sp-4); }
    #stage .sequence-stage,
    #stage .workbench { min-inline-size: 0; min-block-size: 0; }
    #stage .sequence-stage { position: relative; padding: var(--sp-4) var(--sp-5); }
    #stage .stage-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); margin-block-end: var(--sp-2); }
    #stage .stage-head h2 { font-size: var(--fs-body-lg); }
    #stage .stage-head .caption { white-space: nowrap; }
    #stage #attention-viz { display: block; inline-size: 100%; block-size: calc(100% - 42px); min-block-size: 0; }
    #stage #attention-viz text { font-family: var(--font-sans); }
    #stage #attention-viz .svg-label { fill: var(--text-muted); font-size: var(--fs-label); font-weight: var(--weight-semibold); }
    #stage #attention-viz .svg-token { fill: var(--text-strong); font-size: var(--fs-body); font-weight: var(--weight-bold); }
    #stage #attention-viz .svg-weight { fill: var(--text); font-size: var(--fs-label); font-variant-numeric: tabular-nums; }
    #stage #attention-viz .token-box { fill: var(--surface-2); stroke: var(--line-strong); stroke-width: 1.5; }
    #stage #attention-viz .token-box.selected { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 3; }
    #stage #attention-viz .attention-link { fill: none; stroke: var(--accent); }
    #stage #attention-viz .attention-link.masked { stroke: var(--line); stroke-dasharray: 7 7; }
    #stage .workbench { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(440px, 0.75fr); gap: var(--sp-4); }
    #stage .pipeline { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-3); padding: var(--sp-4); }
    #stage .step-card { display: flex; min-inline-size: 0; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-control); }
    #stage .step-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
    #stage .step-name { color: var(--accent-strong); font-size: var(--fs-label); font-weight: var(--weight-bold); }
    #stage .shape { color: var(--text-faint); font-size: var(--fs-tick); font-variant-numeric: tabular-nums; }
    #stage .vector { color: var(--text-strong); font-size: var(--fs-body-sm); font-weight: var(--weight-semibold); line-height: var(--lh-body); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    #stage .step-note { margin-block-start: auto; color: var(--text-muted); font-size: var(--fs-label); line-height: var(--lh-label); }
    #stage .controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3); padding: var(--sp-4); }
    #stage .compact-field { min-inline-size: 0; }
    #stage .compact-field label { display: block; margin-block-end: var(--sp-1); color: var(--text-muted); font-size: var(--fs-label); font-weight: var(--weight-semibold); }
    #stage .compact-field select,
    #stage .compact-field input { inline-size: 100%; min-block-size: 42px; }
    #stage .compact-field input[type="text"] { padding: var(--sp-2) var(--sp-3); font-variant-numeric: tabular-nums; }
    #stage #keys,
    #stage #values { min-inline-size: 0; }
    #stage .matrix-field { grid-column: span 2; }
    #stage .temperature { grid-column: span 1; }
    #stage .temperature-line { display: flex; align-items: center; gap: var(--sp-3); }
    #stage .temperature-line output { min-inline-size: 58px; color: var(--accent-strong); font-size: var(--fs-body-sm); font-weight: var(--weight-bold); text-align: end; font-variant-numeric: tabular-nums; }
    #stage .summary { display: flex; min-inline-size: 0; align-items: center; justify-content: space-between; gap: var(--sp-3); grid-column: span 1; padding: var(--sp-2) var(--sp-3); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-2); }
    #stage .summary span { color: var(--text-muted); font-size: var(--fs-label); }
    #stage .summary output { color: var(--warm); font-size: var(--fs-body-lg); font-weight: var(--weight-bold); font-variant-numeric: tabular-nums; }
    #stage input:focus-visible,
    #stage select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      #stage * { transition-duration: 0s !important; }
    }
  </style>

  <main id="page-content" class="min0" aria-label="本页正文">
    <section class="split-tb attention-page min0" aria-label="序列注意力实验">
      <div class="split-tb__top sequence-stage panel panel--raised min0">
        <div class="stage-head">
          <h2>一个查询，回看全部输入位置</h2>
          <span class="caption">线宽与标注共同表示连续权重；虚线表示遮罩</span>
        </div>
        <svg id="attention-viz" role="img" aria-label="所选输出位置对输入序列的注意力权重"></svg>
      </div>

      <div class="split-tb__bottom workbench min0">
        <section class="pipeline panel min0" aria-label="注意力计算步骤">
          <div class="step-card">
            <div class="step-top"><span class="step-name">点积</span><span class="shape" id="shape-qk"></span></div>
            <output class="vector" id="raw-scores"></output>
            <span class="step-note">查询与每个键比较</span>
          </div>
          <div class="step-card">
            <div class="step-top"><span class="step-name">缩放</span><span class="shape" id="shape-score"></span></div>
            <output class="vector" id="scaled-scores"></output>
            <span class="step-note">除以维度平方根与温度</span>
          </div>
          <div class="step-card">
            <div class="step-top"><span class="step-name">softmax</span><span class="shape" id="shape-weight"></span></div>
            <output class="vector" id="weights"></output>
            <span class="step-note">不是硬选一个位置</span>
          </div>
          <div class="step-card">
            <div class="step-top"><span class="step-name">加权和</span><span class="shape" id="shape-output"></span></div>
            <output class="vector" id="attn-output"></output>
            <span class="step-note">按需组合值向量</span>
          </div>
        </section>

        <form class="controls panel min0" aria-label="编辑注意力输入" onsubmit="return false">
          <div class="compact-field">
            <label for="query-position">输出位置</label>
            <select id="query-position"></select>
          </div>
          <div class="compact-field">
            <label for="query-vector">查询 q</label>
            <input id="query-vector" type="text" inputmode="decimal" aria-describedby="vector-help">
          </div>
          <div class="compact-field">
            <label for="mask">遮罩</label>
            <select id="mask"></select>
          </div>
          <div class="compact-field matrix-field">
            <label for="keys">键 K（分号分行）</label>
            <input id="keys" type="text" inputmode="decimal">
          </div>
          <div class="compact-field temperature">
            <label for="temperature">温度</label>
            <div class="temperature-line"><input id="temperature" type="range"><output id="temperature-value"></output></div>
          </div>
          <div class="compact-field matrix-field">
            <label for="values">值 V（分号分行）</label>
            <input id="values" type="text" inputmode="decimal">
          </div>
          <div class="summary" aria-live="polite"><span id="vector-help">分布熵</span><output id="entropy"></output></div>
        </form>
      </div>
    </section>
  </main>

  <script defer src="assets/lib/d3.min.js"></script>
  <script>
    (function () {
      'use strict';

      function boot() {
        Lec.mount({
          index: 19,
          kicker: `ATTEND TO WHAT MATTERS`,
          title: `注意力：需要哪个位置，就直接回头看<em>哪个位置</em>`,
          take: `注意力把固定长度记忆瓶颈改造成可按当前需求读取的加权检索。`
        });

        var mountedTitle = document.querySelector('.lec-header__title');
        if (mountedTitle) mountedTitle.innerHTML = '注意力：需要哪个位置，就直接回头看<em>哪个位置</em>';

        var P = Lec.P;
        var C = Lec.K.MATH;
        var tokenCount = Lec.K.ARCHITECTURE.LSTM_GATES;
        var dimension = Lec.K.NUMERIC_FORMATS.FP16_BYTES;
        var sourceWords = ['我', '把', '书', '递出'];
        var targetWords = ['I', 'hand', 'the book', 'over'];
        var unit = C.SQRT_2_OVER_PI;
        var queries = [
          [unit, C.SQRT_2],
          [C.SQRT_2, -unit],
          [-C.SQRT_2, C.E],
          [C.E, unit]
        ];
        var keys = [
          [unit, -unit],
          [C.SQRT_2, unit],
          [-unit, C.SQRT_2],
          [C.E, -C.SQRT_2]
        ];
        var values = [
          [C.SQRT_2, unit],
          [-unit, C.E],
          [C.E, C.SQRT_2],
          [unit, -C.SQRT_2]
        ];
        var current = 0;
        var result = null;
        var raw = [];
        var mask = [];

        var position = document.getElementById('query-position');
        var qInput = document.getElementById('query-vector');
        var kInput = document.getElementById('keys');
        var vInput = document.getElementById('values');
        var maskInput = document.getElementById('mask');
        var tempInput = document.getElementById('temperature');

        function fmt(value, digits) {
          return P.formatNumber(value, digits);
        }
        function vectorText(vector) {
          return vector.map(function (v) { return fmt(v, 2); }).join(', ');
        }
        function matrixText(matrix) {
          return matrix.map(function (row) {
            return row.map(function (v) { return fmt(v, 1); }).join(',');
          }).join(';');
        }
        function parseVector(text, expected) {
          var list = text.split(',').map(function (v) { return Number(v.trim()); });
          return list.length === expected && list.every(P.isNumber) ? list : null;
        }
        function parseMatrix(text, rows, cols) {
          var matrix = text.split(';').map(function (row) { return parseVector(row, cols); });
          return matrix.length === rows && matrix.every(function (row) { return row !== null; }) ? matrix : null;
        }
        function shapeOf(value) {
          if (typeof P.tensorShape === 'function') return P.tensorShape(value);
          return Array.isArray(value[0]) ? [value.length, value[0].length] : [value.length];
        }
        function shapeText(value) {
          var shape = shapeOf(value);
          if (Array.isArray(shape)) return shape.join(' × ');
          return String(shape);
        }
        function entropyOf(weights) {
          if (typeof P.attentionSummary === 'function') {
            var summary = P.attentionSummary(weights);
            if (P.isNumber(summary.entropy)) return summary.entropy;
          }
          return -P.sum(weights.map(function (w) {
            return w > C.EPSILON ? w * Math.log(w) : 0;
          }));
        }
        function selectedMask() {
          var mode = maskInput.value;
          return sourceWords.map(function (_, i) {
            if (mode === 'last') return i < tokenCount - 1;
            if (mode === 'first') return i > 0;
            return true;
          });
        }
        function setValidity(input, valid) {
          input.setAttribute('aria-invalid', valid ? 'false' : 'true');
        }

        sourceWords.slice(0, tokenCount).forEach(function (_, i) {
          var option = document.createElement('option');
          option.value = String(i);
          option.textContent = targetWords[i];
          position.appendChild(option);
        });
        [['all', '全部可见'], ['first', '遮住首位'], ['last', '遮住末位']].forEach(function (item) {
          var option = document.createElement('option');
          option.value = item[0];
          option.textContent = item[1];
          maskInput.appendChild(option);
        });

        tempInput.min = String(unit / dimension);
        tempInput.max = String(C.E);
        tempInput.step = String(C.EPSILON * Math.pow(10, 10));
        tempInput.value = String(unit);
        qInput.value = vectorText(queries[current]);
        kInput.value = matrixText(keys);
        vInput.value = matrixText(values);

        function draw() {
          var svg = d3.select('#attention-viz');
          var node = svg.node();
          var width = node.clientWidth || 1200;
          var height = node.clientHeight || 250;
          var left = 135;
          var right = 72;
          var usable = width - left - right;
          var x = d3.scalePoint().domain(d3.range(tokenCount)).range([left, left + usable]).padding(0.4);
          var sourceY = 58;
          var targetY = height - 54;
          var boxW = Math.min(158, usable / tokenCount - 22);
          var boxH = 48;
          var data = d3.range(tokenCount).map(function (i) {
            return { index: i, source: sourceWords[i], target: targetWords[i], weight: result.weights[i], open: mask[i] };
          });
          svg.attr('viewBox', '0 0 ' + width + ' ' + height);
          svg.selectAll('*').remove();
          svg.append('text').attr('class', 'svg-label').attr('x', 8).attr('y', sourceY + 6).text('输入 / K,V');
          svg.append('text').attr('class', 'svg-label').attr('x', 8).attr('y', targetY + 6).text('输出 / Q');

          svg.append('g').selectAll('path').data(data).join('path')
            .attr('class', function (d) { return 'attention-link' + (d.open ? '' : ' masked'); })
            .attr('d', function (d) {
              var sx = x(d.index);
              var tx = x(current);
              var mid = (sourceY + targetY) / 2;
              return 'M' + sx + ',' + (sourceY + boxH / 2) + ' C' + sx + ',' + mid + ' ' + tx + ',' + mid + ' ' + tx + ',' + (targetY - boxH / 2);
            })
            .attr('stroke-width', function (d) { return d.open ? 2 + d.weight * 16 : 2; })
            .attr('opacity', function (d) { return d.open ? 0.32 + d.weight * 0.68 : 0.7; });

          var sources = svg.append('g').selectAll('g').data(data).join('g').attr('transform', function (d) { return 'translate(' + x(d.index) + ',' + sourceY + ')'; });
          sources.append('rect').attr('class', 'token-box').attr('x', -boxW / 2).attr('y', -boxH / 2).attr('width', boxW).attr('height', boxH).attr('rx', 10);
          sources.append('text').attr('class', 'svg-token').attr('text-anchor', 'middle').attr('dominant-baseline', 'middle').text(function (d) { return d.source; });
          sources.append('text').attr('class', 'svg-weight').attr('text-anchor', 'middle').attr('y', boxH / 2 + 25).text(function (d) { return d.open ? fmt(d.weight, 3) : 'MASK'; });

          var targets = svg.append('g').selectAll('g').data(data).join('g').attr('transform', function (d) { return 'translate(' + x(d.index) + ',' + targetY + ')'; });
          targets.append('rect').attr('class', function (d) { return 'token-box' + (d.index === current ? ' selected' : ''); }).attr('x', -boxW / 2).attr('y', -boxH / 2).attr('width', boxW).attr('height', boxH).attr('rx', 10);
          targets.append('text').attr('class', 'svg-token').attr('text-anchor', 'middle').attr('dominant-baseline', 'middle').text(function (d) { return d.target; });
        }

        function update() {
          var q = parseVector(qInput.value, dimension);
          var nextKeys = parseMatrix(kInput.value, tokenCount, dimension);
          var nextValues = parseMatrix(vInput.value, tokenCount, dimension);
          var temperature = Number(tempInput.value);
          setValidity(qInput, !!q);
          setValidity(kInput, !!nextKeys);
          setValidity(vInput, !!nextValues);
          if (!q || !nextKeys || !nextValues || !P.isNumber(temperature)) return;
          queries[current] = q;
          keys = nextKeys;
          values = nextValues;
          mask = selectedMask();
          raw = keys.map(function (key) { return P.dot(q, key); });
          result = P.scaledDotProductAttention(P.vectorScale(q, 1 / temperature), keys, values, mask);

          document.getElementById('raw-scores').textContent = '[' + vectorText(raw) + ']';
          document.getElementById('scaled-scores').textContent = '[' + vectorText(result.scores) + ']';
          document.getElementById('weights').textContent = '[' + vectorText(result.weights) + ']';
          document.getElementById('attn-output').textContent = '[' + vectorText(result.output) + ']';
          document.getElementById('shape-qk').textContent = shapeText([q]) + ' · ' + shapeText(keys);
          document.getElementById('shape-score').textContent = shapeText(result.scores);
          document.getElementById('shape-weight').textContent = shapeText(result.weights);
          document.getElementById('shape-output').textContent = shapeText(result.output);
          document.getElementById('temperature-value').textContent = fmt(temperature, 2);
          document.getElementById('entropy').textContent = fmt(entropyOf(result.weights), 3);
          draw();
        }

        position.addEventListener('change', function () {
          current = Number(position.value);
          qInput.value = vectorText(queries[current]);
          update();
        });
        [qInput, kInput, vInput, tempInput].forEach(function (input) { input.addEventListener('input', update); });
        maskInput.addEventListener('change', update);
        Deck.onResize(draw);
        update();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot, { once: true });
      } else {
        boot();
      }
    }());
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
