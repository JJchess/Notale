<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="20" data-total="24">
<div id="stage">
  <style>
    #stage #page-content { position: relative; }
    #stage .station { position: relative; overflow: clip; border: 1px solid var(--line); border-radius: var(--radius-lg); background: linear-gradient(90deg, var(--surface-control), var(--bg)); box-shadow: inset 0 0 0 1px var(--surface-2); }
    #stage .station::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .38; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: var(--sp-7) var(--sp-7); mask-image: linear-gradient(to bottom, transparent, var(--text) 28%, var(--text) 78%, transparent); }
    #stage #station-canvas { display: block; inline-size: 100%; block-size: 100%; cursor: grab; }
    #stage #station-canvas:active { cursor: grabbing; }
    #stage #station-canvas:focus-visible { outline: 3px solid var(--focus); outline-offset: -4px; }
    #stage .hud { display: grid; grid-template-columns: minmax(0, 27%) minmax(0, 1fr) minmax(0, 29%); grid-template-rows: auto 1fr auto; gap: var(--sp-4); padding: var(--sp-4); }
    #stage .hud__controls { grid-area: 1 / 1 / 3 / 2; align-self: start; }
    #stage .hud__inspect { grid-area: 1 / 3 / 3 / 4; align-self: start; }
    #stage .hud__legend { grid-area: 3 / 2 / 4 / 3; justify-self: center; align-self: end; }
    #stage .tech-panel { padding: var(--sp-4); border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface-1); box-shadow: var(--shadow-md); }
    #stage .tech-panel__eyebrow { margin-block-end: var(--sp-3); color: var(--accent-strong); font-size: var(--fs-label); font-weight: var(--weight-bold); letter-spacing: .1em; line-height: var(--lh-label); }
    #stage .control-stack { display: flex; flex-direction: column; gap: var(--sp-3); }
    #stage .token-field { display: flex; flex-direction: column; gap: var(--sp-2); }
    #stage .token-field select { inline-size: 100%; }
    #stage .switch-list { display: grid; gap: var(--sp-2); padding-block: var(--sp-2); border-block: 1px solid var(--line); }
    #stage .switch-list .switch { justify-content: space-between; }
    #stage .inspect-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
    #stage .metric { min-inline-size: 0; padding: var(--sp-3); border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-control); }
    #stage .metric__label { color: var(--text-muted); font-size: var(--fs-label); line-height: var(--lh-label); }
    #stage .metric__value { display: block; margin-block-start: var(--sp-1); overflow-wrap: anywhere; color: var(--text-strong); font-size: var(--fs-body); font-weight: var(--weight-bold); font-variant-numeric: tabular-nums; line-height: var(--lh-tight); }
    #stage .vector { margin-block-start: var(--sp-3); color: var(--text-muted); font-size: var(--fs-body-sm); line-height: var(--lh-body); }
    #stage .vector output { color: var(--accent-strong); font-variant-numeric: tabular-nums; }
    #stage .result { margin-block-start: var(--sp-3); padding-block-start: var(--sp-3); border-block-start: 1px solid var(--line); color: var(--text); font-size: var(--fs-body-sm); line-height: var(--lh-body); }
    #stage .result strong { color: var(--warm); font-variant-numeric: tabular-nums; }
    #stage .shape-row { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-block-start: var(--sp-3); }
    #stage .shape-chip { padding: var(--sp-1) var(--sp-2); border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); color: var(--text-muted); font-size: var(--fs-label); line-height: var(--lh-label); }
    #stage .plate-legend { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) var(--sp-4); border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--surface-1); color: var(--text-muted); font-size: var(--fs-label); line-height: var(--lh-label); }
    #stage .plate-legend span { display: inline-flex; align-items: center; gap: var(--sp-2); }
    #stage .mark { inline-size: var(--sp-3); block-size: 3px; background: var(--accent); }
    #stage .mark--head { background: var(--secondary); }
    #stage .mark--residual { border-block-start: 2px dashed var(--warm); background: transparent; }
    #stage .history-tag { display: inline-flex; margin-block-start: var(--sp-3); padding: var(--sp-1) var(--sp-3); border-inline-start: 3px solid var(--accent); background: var(--surface-2); color: var(--text-muted); font-size: var(--fs-label); line-height: var(--lh-label); }
    #stage .interaction-hint { margin-block-start: var(--sp-2); color: var(--text-faint); font-size: var(--fs-body-sm); line-height: var(--lh-body); }
    #stage .sr-status { position: absolute; }
    @media (prefers-reduced-motion: reduce) {
      #stage * { scroll-behavior: auto !important; transition-duration: 0s !important; animation-duration: 0s !important; }
    }
  </style>

  <main id="page-content" class="canvas-full min0" aria-label="可拆解的三维 Transformer 块">
    <div class="canvas-full__surface station min0">
      <canvas id="station-canvas" class="no-pan" tabindex="0" role="application" aria-label="Transformer 三维信息交换站。拖动可绕行，方向键可旋转，回车可依次选择注意力光束。"></canvas>
    </div>

    <div class="canvas-full__overlay hud min0">
      <section class="tech-panel hud__controls min0" aria-label="结构控制台">
        <div class="tech-panel__eyebrow">BLOCK / LIVE INPUT</div>
        <div class="control-stack">
          <label class="token-field control-label" for="token-mode">修改 token C
            <select id="token-mode">
              <option value="base">保持原向量</option>
              <option value="boost">增强其特征</option>
              <option value="invert">反转其特征</option>
            </select>
          </label>
          <div class="switch-list" aria-label="结构消融">
            <label class="switch"><span>注意力头 A</span><input id="head-a" type="checkbox" checked></label>
            <label class="switch"><span>注意力头 B</span><input id="head-b" type="checkbox" checked></label>
            <label class="switch"><span>残差旁路</span><input id="residual" type="checkbox" checked></label>
          </div>
          <button id="reset" class="button--primary" type="button">恢复完整结构</button>
        </div>
        <p class="interaction-hint">拖动绕行；点选光束检查一次位置间通信。</p>
        <div id="history" class="history-tag"></div>
      </section>

      <section class="tech-panel hud__inspect min0" aria-label="光束与输出诊断">
        <div class="tech-panel__eyebrow" id="beam-title">BEAM / HEAD A</div>
        <div class="inspect-grid">
          <div class="metric"><span class="metric__label">查询 → 键</span><output id="pair" class="metric__value">—</output></div>
          <div class="metric"><span class="metric__label">缩放点积分数</span><output id="score" class="metric__value">—</output></div>
        </div>
        <p class="vector">传递向量摘要：<output id="vector">—</output></p>
        <div class="shape-row" aria-label="张量形状">
          <span id="shape-q" class="shape-chip"></span>
          <span id="shape-head" class="shape-chip"></span>
          <span id="shape-out" class="shape-chip"></span>
        </div>
        <p class="result">当前结构相对完整块的输出差异：<strong id="delta">—</strong><br><span id="meaning">所有位置并行通信，再逐位置加工。</span></p>
      </section>

      <div class="hud__legend plate-legend" aria-label="三维场景图例">
        <span><i class="mark"></i>token</span>
        <span><i class="mark mark--head"></i>多头通信</span>
        <span><i class="mark mark--residual"></i>残差直通</span>
      </div>
      <output id="live-status" class="sr-only sr-status" aria-live="polite"></output>
    </div>
  </main>

  <script defer src="assets/lib/three.min.js"></script>
  <script>
    (function () {
      'use strict';

      function boot() {
        Lec.mount({
          index: 20,
          kicker: `THE TRANSFORMER BLOCK`,
          title: `Transformer：让所有位置并行交换<em>上下文</em>`,
          take: `Transformer 用自注意力完成位置间通信，再用逐位置网络加工结果，并通过残差维持信息通路。`
        });

        var P = Lec.P;
        var K = Lec.K;
        var THREE = window.THREE;
        var canvas = document.getElementById('station-canvas');
        var mode = document.getElementById('token-mode');
        var headChecks = [document.getElementById('head-a'), document.getElementById('head-b')];
        var residualCheck = document.getElementById('residual');
        var tokenCount = Math.min(K.ARCHITECTURE.TRANSFORMER_PROJECTIONS, K.TRANSFORMER_BASE.ATTENTION_HEADS);
        var headCount = Math.min(K.ARCHITECTURE.LAYER_NORM_VECTORS, K.TRANSFORMER_BASE.ATTENTION_HEADS);
        var vectorSize = K.ARCHITECTURE.TRANSFORMER_PROJECTIONS;
        var selected = { head: 0, query: 0, key: 1 };
        var current;
        var baseline;
        var beams = [];
        var headFrames = [];
        var tokenMeshes = [];
        var outputMeshes = [];
        var dragging = false;
        var previous = null;
        var yaw = -0.38;
        var pitch = 0.2;
        var raycaster = new THREE.Raycaster();
        var pointer = new THREE.Vector2();

        function color(name) {
          var c = Deck.rgb(name);
          return new THREE.Color(c[0] / 255, c[1] / 255, c[2] / 255);
        }

        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(44, 1, 0.1, 100);
        camera.position.set(0, 1.4, 12.8);
        var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.setClearColor(color('--bg'), 0);
        var station = new THREE.Group();
        scene.add(station);
        scene.add(new THREE.AmbientLight(color('--text-muted'), 1.3));
        var keyLight = new THREE.DirectionalLight(color('--text-strong'), 2.4);
        keyLight.position.set(5, 8, 7);
        scene.add(keyLight);
        var rimLight = new THREE.PointLight(color('--accent'), 18, 25);
        rimLight.position.set(-5, 1, 5);
        scene.add(rimLight);

        function edgeBox(w, h, d, edgeColor) {
          var group = new THREE.Group();
          var geom = new THREE.BoxGeometry(w, h, d);
          var fill = new THREE.Mesh(geom, new THREE.MeshPhongMaterial({ color: color('--surface-2'), transparent: true, opacity: 0.34, shininess: 80 }));
          var edges = new THREE.LineSegments(new THREE.EdgesGeometry(geom), new THREE.LineBasicMaterial({ color: edgeColor, transparent: true, opacity: 0.9 }));
          group.add(fill, edges);
          return group;
        }

        var platform = new THREE.GridHelper(11, 12, color('--line-strong'), color('--line'));
        platform.position.y = -2.65;
        station.add(platform);

        var tokenGeom = new THREE.BoxGeometry(1.05, 0.72, 1.05);
        for (var i = 0; i < tokenCount; i += 1) {
          var token = new THREE.Mesh(tokenGeom, new THREE.MeshPhongMaterial({ color: color('--accent'), transparent: true, opacity: 0.72, shininess: 100 }));
          token.position.set((i - (tokenCount - 1) / 2) * 1.75, -2.05, 0);
          token.userData.token = i;
          tokenMeshes.push(token);
          station.add(token);
        }

        for (var h = 0; h < headCount; h += 1) {
          var frame = edgeBox(7.4, 0.68, 1.05, h ? color('--secondary') : color('--accent-strong'));
          frame.position.set(0, -0.15 + h * 1.05, h ? -1.35 : 1.35);
          headFrames.push(frame);
          station.add(frame);
        }

        var ffn = edgeBox(7.4, 0.78, 1.5, color('--warm'));
        ffn.position.set(0, 2.18, 0);
        station.add(ffn);

        for (i = 0; i < tokenCount; i += 1) {
          var out = new THREE.Mesh(new THREE.OctahedronGeometry(0.48), new THREE.MeshPhongMaterial({ color: color('--warm'), transparent: true, opacity: 0.82, shininess: 100 }));
          out.position.set((i - (tokenCount - 1) / 2) * 1.75, 3.25, 0);
          outputMeshes.push(out);
          station.add(out);
        }

        var residualCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(-4.4, -2.05, 0), new THREE.Vector3(-5.15, -0.2, 0),
          new THREE.Vector3(-5.15, 2.2, 0), new THREE.Vector3(-4.4, 3.25, 0)
        ]);
        var residualTube = new THREE.Mesh(new THREE.TubeGeometry(residualCurve, 36, 0.055, 8, false), new THREE.MeshBasicMaterial({ color: color('--warm'), transparent: true, opacity: 0.9 }));
        station.add(residualTube);

        function makeBeam(head, query, key) {
          var x1 = (query - (tokenCount - 1) / 2) * 1.75;
          var x2 = (key - (tokenCount - 1) / 2) * 1.75;
          var z = head ? -1.35 : 1.35;
          var curve = new THREE.QuadraticBezierCurve3(
            new THREE.Vector3(x1, -1.62, 0),
            new THREE.Vector3((x1 + x2) / 2, -0.2 + head * 1.05, z),
            new THREE.Vector3(x2, 1.38, 0)
          );
          var geometry = new THREE.TubeGeometry(curve, 20, 0.035, 6, false);
          var material = new THREE.MeshBasicMaterial({ color: head ? color('--secondary') : color('--accent'), transparent: true, opacity: 0.35 });
          var mesh = new THREE.Mesh(geometry, material);
          mesh.userData = { beam: true, head: head, query: query, key: key };
          beams.push(mesh);
          station.add(mesh);
        }
        for (h = 0; h < headCount; h += 1) {
          for (var q = 0; q < tokenCount; q += 1) {
            for (var k = 0; k < tokenCount; k += 1) makeBeam(h, q, k);
          }
        }

        function baseTokens(tokenMode) {
          var factors = { base: K.MATH.SQRT_2_OVER_PI, boost: K.MATH.SQRT_2, invert: -K.MATH.SQRT_2_OVER_PI };
          var data = [];
          for (var row = 0; row < tokenCount; row += 1) {
            var v = [];
            for (var d = 0; d < vectorSize; d += 1) {
              var value = P.positionalEncoding(row + 1, d, K.TRANSFORMER_BASE.MODEL_DIMENSION);
              if (row === tokenCount - 2) value *= factors[tokenMode];
              v.push(value);
            }
            data.push(v);
          }
          return data;
        }

        function project(vector, head, kind) {
          var out = [];
          for (var a = 0; a < vectorSize; a += 1) {
            var value = 0;
            for (var b = 0; b < vectorSize; b += 1) {
              var weight = P.positionalEncoding((head + 1) * (kind + 1) + b, a, K.TRANSFORMER_BASE.MODEL_DIMENSION);
              value += vector[b] * weight / vectorSize;
            }
            out.push(value);
          }
          return out;
        }

        function compute(tokenMode, enabledHeads, withResidual) {
          var inputs = baseTokens(tokenMode);
          var heads = [];
          var merged = [];
          for (h = 0; h < headCount; h += 1) {
            var keys = inputs.map(function (v) { return project(v, h, 1); });
            var values = inputs.map(function (v) { return project(v, h, 2); });
            var perQuery = [];
            for (q = 0; q < tokenCount; q += 1) {
              var query = project(inputs[q], h, 0);
              perQuery.push(P.scaledDotProductAttention(query, keys, values));
            }
            heads.push(perQuery);
          }
          for (q = 0; q < tokenCount; q += 1) {
            var combined = inputs[q].map(function () { return 0; });
            for (h = 0; h < headCount; h += 1) {
              if (enabledHeads[h]) combined = P.vectorAdd(combined, heads[h][q].output);
            }
            if (withResidual) combined = P.vectorAdd(combined, inputs[q]);
            merged.push(combined.map(function (x, idx) {
              return P.gelu(x + project(combined, idx % headCount, 2)[idx]);
            }));
          }
          return { inputs: inputs, heads: heads, output: merged };
        }

        function outputDifference(left, right) {
          var values = [];
          for (var r = 0; r < left.length; r += 1) values = values.concat(P.vectorSubtract(left[r], right[r]));
          return P.vectorNorm(values);
        }

        function fmt(value) { return P.formatNumber(value, K.ARCHITECTURE.LAYER_NORM_VECTORS); }
        function shape(matrix) { return matrix.length + ' × ' + matrix[0].length; }
        function tokenName(index) { return String.fromCharCode(65 + index); }

        function updateReadout() {
          var info = current.heads[selected.head][selected.query];
          var score = info.scores[selected.key];
          var transmitted = P.vectorScale(project(current.inputs[selected.key], selected.head, 2), info.weights[selected.key]);
          document.getElementById('beam-title').textContent = 'BEAM / HEAD ' + tokenName(selected.head);
          document.getElementById('pair').textContent = tokenName(selected.query) + ' → ' + tokenName(selected.key);
          document.getElementById('score').textContent = fmt(score);
          document.getElementById('vector').textContent = '‖v‖ ' + fmt(P.vectorNorm(transmitted)) + '，权重 ' + P.formatPercent(info.weights[selected.key], K.ARCHITECTURE.LAYER_NORM_VECTORS, false);
          document.getElementById('shape-q').textContent = 'Q  ' + shape(current.inputs);
          document.getElementById('shape-head').textContent = 'HEAD  ' + shape(current.heads[selected.head].map(function (x) { return x.output; }));
          document.getElementById('shape-out').textContent = 'OUT  ' + shape(current.output);
        }

        function recompute(announce) {
          var enabled = headChecks.map(function (box) { return box.checked; });
          baseline = compute(mode.value, [true, true], true);
          current = compute(mode.value, enabled, residualCheck.checked);
          var difference = outputDifference(current.output, baseline.output);
          document.getElementById('delta').textContent = fmt(difference);
          document.getElementById('meaning').textContent = difference === 0 ? '完整多头通信与残差通路均在工作。' : '切断通路后，前馈层接收到的上下文已经改变。';
          beams.forEach(function (beam) {
            var active = enabled[beam.userData.head];
            var weight = current.heads[beam.userData.head][beam.userData.query].weights[beam.userData.key];
            var chosen = beam.userData.head === selected.head && beam.userData.query === selected.query && beam.userData.key === selected.key;
            beam.visible = true;
            beam.material.opacity = active ? (chosen ? 0.95 : 0.08 + weight * 0.58) : 0.025;
            beam.scale.setScalar(chosen ? 1.38 : 1);
          });
          headFrames.forEach(function (frame, index) { frame.visible = true; frame.traverse(function (obj) { if (obj.material) obj.material.opacity = enabled[index] ? 0.75 : 0.1; }); });
          residualTube.material.opacity = residualCheck.checked ? 0.9 : 0.08;
          tokenMeshes.forEach(function (mesh, index) { mesh.rotation.y = current.inputs[index][0] * 0.3; });
          outputMeshes.forEach(function (mesh, index) { mesh.scale.setScalar(0.72 + Math.min(0.65, P.vectorNorm(current.output[index]) * 0.13)); });
          updateReadout();
          if (announce) document.getElementById('live-status').textContent = 'Transformer 已重新计算，输出差异 ' + fmt(difference);
        }

        var event = P.eventById('transformer');
        document.getElementById('history').textContent = event ? event.year + ' · ' + event.title + '：' + event.significance : '';

        function resize() {
          var width = canvas.clientWidth;
          var height = canvas.clientHeight;
          if (!width || !height) return;
          renderer.setSize(width, height, false);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          renderer.render(scene, camera);
        }
        Deck.onResize(resize);
        resize();

        function orient() {
          station.rotation.y = yaw;
          station.rotation.x = pitch;
        }
        orient();

        function selectBeam(object, announce) {
          selected = { head: object.userData.head, query: object.userData.query, key: object.userData.key };
          recompute(announce);
        }

        canvas.addEventListener('pointerdown', function (e) {
          dragging = true;
          previous = Deck.pt(canvas, e);
          canvas.setPointerCapture(e.pointerId);
        });
        canvas.addEventListener('pointermove', function (e) {
          if (!dragging) return;
          var pt = Deck.pt(canvas, e);
          yaw += (pt.x - previous.x) * 0.006;
          pitch = P.clamp(pitch + (pt.y - previous.y) * 0.004, -0.5, 0.6);
          previous = pt;
          orient();
        });
        function endPointer(e) {
          if (!dragging) return;
          dragging = false;
          if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
        }
        canvas.addEventListener('pointerup', function (e) {
          var start = previous;
          endPointer(e);
          var pt = Deck.pt(canvas, e);
          if (start && Math.abs(pt.x - start.x) + Math.abs(pt.y - start.y) < 8) {
            pointer.x = pt.x / canvas.clientWidth * 2 - 1;
            pointer.y = -(pt.y / canvas.clientHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            var hit = raycaster.intersectObjects(beams, false)[0];
            if (hit) selectBeam(hit.object, true);
          }
        });
        canvas.addEventListener('pointercancel', endPointer);
        canvas.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { yaw += e.key === 'ArrowLeft' ? -0.12 : 0.12; orient(); e.preventDefault(); }
          if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { pitch = P.clamp(pitch + (e.key === 'ArrowUp' ? -0.1 : 0.1), -0.5, 0.6); orient(); e.preventDefault(); }
          if (e.key === 'Enter' || e.key === ' ') {
            var index = beams.findIndex(function (beam) { return beam.userData.head === selected.head && beam.userData.query === selected.query && beam.userData.key === selected.key; });
            selectBeam(beams[(index + 1) % beams.length], true);
            e.preventDefault();
          }
        });

        mode.addEventListener('change', function () { recompute(true); });
        headChecks.forEach(function (box) { box.addEventListener('change', function () { recompute(true); }); });
        residualCheck.addEventListener('change', function () { recompute(true); });
        document.getElementById('reset').addEventListener('click', function () {
          mode.value = 'base'; headChecks[0].checked = true; headChecks[1].checked = true; residualCheck.checked = true;
          selected = { head: 0, query: 0, key: 1 }; yaw = -0.38; pitch = 0.2; orient(); recompute(true);
        });

        recompute(false);
        Deck.loop(function (time) {
          if (!Deck.reduced()) {
            outputMeshes.forEach(function (mesh, index) { mesh.rotation.y = time * 0.00022 + index * 0.3; });
          }
          renderer.render(scene, camera);
        }, { still: 0 });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot, { once: true });
      } else {
        boot();
      }
    }());
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
