<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="21" data-total="24">
  <div id="stage">
    <style>
      #stage #page-content { inline-size:100%; block-size:100%; }
      #stage .scale-ledger { --ledger-index:.62fr; --ledger-body:1.38fr; }
      #stage .ledger__index, #stage .ledger__body { display:flex; flex-direction:column; gap:var(--sp-4); }
      #stage .history-panel { flex:1 1 auto; display:flex; flex-direction:column; }
      #stage .history-list { display:flex; flex-direction:column; gap:var(--sp-3); flex:1 1 auto; justify-content:space-evenly; }
      #stage .history-row { display:grid; grid-template-columns:96px minmax(0,1fr); gap:var(--sp-3); align-items:center; padding-block:var(--sp-3); border-block-end:1px solid var(--line); }
      #stage .history-row:last-child { border-block-end:0; }
      #stage .history-date { color:var(--accent-strong); font-size:var(--fs-label); font-weight:var(--weight-bold); }
      #stage .history-name { color:var(--text-strong); font-size:var(--fs-body-sm); font-weight:var(--weight-semibold); }
      #stage .history-note { color:var(--text-muted); font-size:var(--fs-label); line-height:var(--lh-label); }
      #stage .principle { padding:var(--sp-4); border:1px solid var(--line-strong); border-radius:var(--radius-md); background:var(--surface-2); color:var(--text-muted); font-size:var(--fs-body-sm); line-height:var(--lh-body); }
      #stage .principle strong { color:var(--warm); }
      #stage .workbook { flex:1 1 auto; display:grid; grid-template-rows:auto minmax(0,1fr); gap:var(--sp-4); }
      #stage .budget-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--sp-4); }
      #stage .budget-cell { padding:var(--sp-4); border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface-control); }
      #stage .budget-cell output { display:block; margin-block-start:var(--sp-1); color:var(--text-strong); font-size:var(--fs-body-lg); font-weight:var(--weight-bold); font-variant-numeric:tabular-nums; }
      #stage .allocation { inline-size:100%; block-size:74px; margin-block-start:var(--sp-2); }
      #stage .allocation text { font-size:var(--fs-label); fill:var(--text-muted); }
      #stage .result-line { display:flex; align-items:center; justify-content:space-between; gap:var(--sp-4); padding-block-start:var(--sp-3); border-block-start:1px solid var(--line); }
      #stage .result-copy { color:var(--text-muted); font-size:var(--fs-body-sm); line-height:var(--lh-body); }
      #stage .lower-ledger { display:grid; grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr); gap:var(--sp-4); min-block-size:0; }
      #stage .token-panel, #stage .cost-panel { display:flex; flex-direction:column; min-block-size:0; padding:var(--sp-4); border:1px solid var(--line); border-radius:var(--radius-lg); background:var(--surface-1); }
      #stage .compact-head { display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); margin-block-end:var(--sp-3); }
      #stage .compact-title { color:var(--text-strong); font-size:var(--fs-body-lg); font-weight:var(--weight-bold); }
      #stage textarea { min-block-size:70px; block-size:70px; }
      #stage .tokens { display:flex; flex-wrap:wrap; align-content:flex-start; gap:var(--sp-2); min-block-size:54px; margin-block-start:var(--sp-3); }
      #stage .token { padding:var(--sp-1) var(--sp-2); border:1px solid var(--line-strong); border-radius:var(--radius-sm); background:var(--secondary-soft); color:var(--text-strong); font-size:var(--fs-label); }
      #stage .mini-readouts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--sp-3); flex:1 1 auto; }
      #stage .mini-stat { padding:var(--sp-3); border-block-end:1px solid var(--line); }
      #stage .mini-stat span { display:block; color:var(--text-muted); font-size:var(--fs-label); }
      #stage .mini-stat output { color:var(--text-strong); font-size:var(--fs-body-lg); font-weight:var(--weight-bold); font-variant-numeric:tabular-nums; }
      #stage .law-note { margin-block-start:var(--sp-3); color:var(--warm); font-size:var(--fs-body-sm); line-height:var(--lh-body); }
      #stage input[type="range"]:focus-visible, #stage textarea:focus-visible, #stage button:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
      @media (prefers-reduced-motion:reduce) { #stage * { transition:none !important; } }
    </style>

    <main id="page-content" class="min0" aria-label="规模化训练账本">
      <section class="ledger scale-ledger min0">
        <aside class="ledger__index min0" aria-label="历史索引">
          <section class="panel history-panel min0">
            <div class="panel-header"><h2 class="compact-title">范式变迁</h2><span class="badge badge--accent">历史账</span></div>
            <div id="history-list" class="history-list"></div>
          </section>
          <p class="principle"><strong>预训练 ≠ 逐层初始化。</strong>这里是在广泛数据上学习可迁移能力，再适配多种任务；“基础”指复用起点，不代表万能。</p>
        </aside>

        <section class="ledger__body min0" aria-label="规模预算主账">
          <section class="panel panel--raised workbook min0">
            <div>
              <div class="panel-header"><h2 class="compact-title">训练预算分录</h2><span id="feasible" class="badge" role="status" aria-live="polite">核算中</span></div>
              <div class="budget-grid">
                <label class="budget-cell control-label" for="model-range">模型规模
                  <input id="model-range" type="range" aria-describedby="model-out">
                  <output id="model-out">—</output>
                </label>
                <label class="budget-cell control-label" for="data-range">训练数据
                  <input id="data-range" type="range" aria-describedby="data-out">
                  <output id="data-out">—</output>
                </label>
                <label class="budget-cell control-label" for="compute-range">计算预算
                  <input id="compute-range" type="range" aria-describedby="compute-out">
                  <output id="compute-out">—</output>
                </label>
              </div>
              <svg id="allocation" class="allocation" role="img" aria-label="模型、数据与计算预算配比图"></svg>
              <div class="result-line"><p id="estimate" class="result-copy">改变任一分录，账本会重新核算。</p><button id="reset" class="button button--ghost" type="button">恢复配比</button></div>
            </div>
            <div class="lower-ledger min0">
              <section class="token-panel min0">
                <div class="compact-head"><h3 class="compact-title">文本怎样变成训练成本</h3><span class="badge">BPE</span></div>
                <label class="control-label" for="sample-text">输入文本</label>
                <textarea id="sample-text">神经网络把文本切成词元，序列越长，计算账单越大。</textarea>
                <div id="tokens" class="tokens" aria-label="分词结果"></div>
              </section>
              <section class="cost-panel min0" aria-label="成本核对">
                <div class="compact-head"><h3 class="compact-title">成本核对</h3><span class="badge badge--accent">现算</span></div>
                <div class="mini-readouts">
                  <div class="mini-stat"><span>词元数</span><output id="token-count">—</output></div>
                  <div class="mini-stat"><span>序列长度</span><output id="sequence-length">—</output></div>
                  <div class="mini-stat"><span>单序列训练量</span><output id="sequence-cost">—</output></div>
                  <div class="mini-stat"><span>结构参数量</span><output id="structure-params">—</output></div>
                </div>
                <p class="law-note">经验缩放关系是对既有实验的描述性近似，不是保证收益的自然定律。</p>
              </section>
            </div>
          </section>
        </section>
      </section>
    </main>

    <script defer src="assets/lib/d3.min.js"></script>
    <script>
      (function () {
        'use strict';

        function boot() {
          Lec.mount({
            index: 21,
            kicker: `SCALE AS A STRATEGY`,
            title: `从预训练模型到基础模型：把参数、数据与计算一起<em>放大</em>`,
            take: `规模化不是单纯堆参数，而是数据、模型、计算预算和训练目标之间的配比问题。`
          });

          var titleNode = document.querySelector('.lec-header__title');
          if (titleNode) titleNode.innerHTML = `从预训练模型到基础模型：把参数、数据与计算一起<em>放大</em>`;

          var P = Lec.P;
          var K = Lec.K;
          var models = [K.MODELS.BERT_BASE, K.MODELS.BERT_LARGE, K.MODELS.GPT2_XL, K.MODELS.GPT3];
          var dataChoices = [K.UNITS.MILLION, K.UNITS.BILLION, K.UNITS.TRILLION];
          var computeChoices = [];
          models.forEach(function (m) {
            dataChoices.forEach(function (n) { computeChoices.push(P.trainingFlops(m.parameters, n)); });
          });
          computeChoices.sort(function (a,b) { return a-b; });

          var mr = document.getElementById('model-range');
          var dr = document.getElementById('data-range');
          var cr = document.getElementById('compute-range');
          [mr,dr,cr].forEach(function (el) { el.min = String(0); el.step = String(1); });
          mr.max = String(models.length - 1); dr.max = String(dataChoices.length - 1); cr.max = String(computeChoices.length - 1);
          mr.value = String(1); dr.value = String(1); cr.value = String(Math.floor(computeChoices.length / 2));

          function eventText(id) {
            var e = P.eventById(id);
            return { date:P.formatNumber(e.year,0), name:e.title, note:e.significance };
          }
          var history = [eventText('transformer'), eventText('bert'), eventText('gpt3')];
          d3.select('#history-list').selectAll('div').data(history).join('div').attr('class','history-row')
            .html(function(d){ return '<div class="history-date">'+d.date+'</div><div><div class="history-name">'+d.name+'</div><div class="history-note">'+d.note+'</div></div>'; });

          function simpleBpe(text) {
            var units = Array.from(text.trim()).filter(function (c) { return c.trim(); });
            if (!units.length) return [];
            var limit = Math.max(1, Math.floor(Math.sqrt(units.length)));
            for (var round = 0; round < limit; round += 1) {
              var counts = {}, best = '', bestN = 1;
              for (var i=0; i<units.length-1; i+=1) { var pair=units[i]+'\u0000'+units[i+1]; counts[pair]=(counts[pair]||0)+1; }
              Object.keys(counts).forEach(function(k){ if(counts[k]>bestN){best=k;bestN=counts[k];} });
              if (!best) break;
              var parts=best.split('\u0000'), next=[];
              for (var j=0;j<units.length;j+=1) { if(j<units.length-1&&units[j]===parts[0]&&units[j+1]===parts[1]){next.push(units[j]+units[j+1]);j+=1;}else next.push(units[j]); }
              units=next;
            }
            return units;
          }

          function drawAllocation(values) {
            var svg=d3.select('#allocation').attr('viewBox','0 0 900 74');
            var labels=['模型','数据','计算'];
            var colors=['var(--secondary)','var(--accent)','var(--warm)'];
            var sum=d3.sum(values), x=0;
            var segments=values.map(function(v,i){var w=900*v/sum, o={x:x,w:w,label:labels[i],color:colors[i]};x+=w;return o;});
            svg.selectAll('rect').data(segments).join('rect').attr('x',function(d){return d.x;}).attr('y',8).attr('width',function(d){return Math.max(2,d.w-4);}).attr('height',30).attr('rx',8).attr('fill',function(d){return d.color;});
            svg.selectAll('text').data(segments).join('text').attr('x',function(d){return d.x+d.w/2;}).attr('y',64).attr('text-anchor','middle').text(function(d){return d.label;});
          }

          function updateTokens() {
            var text=document.getElementById('sample-text').value;
            var tokens = typeof P.bpeEncode === 'function' ? P.bpeEncode(text) : simpleBpe(text);
            if (tokens && tokens.tokens) tokens=tokens.tokens;
            tokens = Array.isArray(tokens) ? tokens : [];
            d3.select('#tokens').selectAll('span').data(tokens.slice(0,24)).join('span').attr('class','token').text(function(d){return typeof d==='string'?d:(d.token||d.text||'');});
            var model=models[Number(mr.value)];
            var cost=P.trainingFlops(model.parameters, tokens.length);
            document.getElementById('token-count').textContent=P.formatNumber(tokens.length,0);
            document.getElementById('sequence-length').textContent=P.formatNumber(tokens.length,0);
            document.getElementById('sequence-cost').textContent=P.formatCompact(cost,1)+' FLOPs';
          }

          function update() {
            var model=models[Number(mr.value)], data=dataChoices[Number(dr.value)], budget=computeChoices[Number(cr.value)];
            var required=P.trainingFlops(model.parameters,data);
            var ok=budget>=required;
            document.getElementById('model-out').textContent=model.name+' · '+P.formatCompact(model.parameters,1);
            document.getElementById('data-out').textContent=P.formatCompact(data,1)+' tokens';
            document.getElementById('compute-out').textContent=P.formatCompact(budget,1)+' FLOPs';
            var status=document.getElementById('feasible');
            status.textContent=ok?'预算可完成':'预算有缺口'; status.className='badge '+(ok?'badge--success':'badge--danger');
            var ratio=P.safeDivide(budget,required,0);
            document.getElementById('estimate').textContent=ok?'预算覆盖需求；继续放大前仍要检查数据是否匹配。':'当前计算只覆盖需求的 '+P.formatPercent(Math.min(1,ratio),0,false)+'，模型与数据不能同时兑现。';
            drawAllocation([Math.log(model.parameters),Math.log(data),Math.log(Math.max(1,budget))]);
            var t=K.TRANSFORMER_BASE;
            var structure=P.transformerLayerParameters(t.MODEL_DIMENSION,t.FEED_FORWARD_DIMENSION,true);
            document.getElementById('structure-params').textContent=P.formatCompact(structure,1);
            updateTokens();
          }

          [mr,dr,cr].forEach(function(el){el.addEventListener('input',update);});
          document.getElementById('sample-text').addEventListener('input',updateTokens);
          document.getElementById('reset').addEventListener('click',function(){mr.value=String(1);dr.value=String(1);cr.value=String(Math.floor(computeChoices.length/2));update();});
          update();
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once:true });
        else boot();
      }());
    </script>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
</body>
</html>
