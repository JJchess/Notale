<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="22" data-total="24">
<div id="stage">
<style>
#stage #page-content { block-size: 100%; }
#stage .audit-layout { --left: 1.16fr; --right: .84fr; }
#stage .audit-lab { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: var(--sp-4); block-size: 100%; }
#stage .audit-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); }
#stage .audit-head h2 { font-size: var(--fs-h3); }
#stage .audit-legend { display: flex; flex-wrap: wrap; gap: var(--sp-3); color: var(--text-muted); font-size: var(--fs-label); }
#stage .audit-key { display: inline-flex; align-items: center; gap: var(--sp-2); white-space: nowrap; }
#stage .audit-dot { inline-size: 13px; block-size: 13px; border-radius: 50%; background: var(--accent); }
#stage .audit-dot--b { border-radius: var(--radius-sm); background: var(--secondary); }
#stage .audit-plot { min-block-size: 0; padding: var(--sp-3); }
#stage .audit-plot svg, #stage .calibration svg { display: block; inline-size: 100%; block-size: 100%; }
#stage .audit-controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) auto; gap: var(--sp-3) var(--sp-4); align-items: end; padding: var(--sp-4); }
#stage .audit-control { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-1) var(--sp-3); min-inline-size: 0; }
#stage .audit-control label { color: var(--text-muted); font-size: var(--fs-label); font-weight: var(--weight-semibold); }
#stage .audit-control output { color: var(--text-strong); font-size: var(--fs-label); font-variant-numeric: tabular-nums; }
#stage .audit-control input { grid-column: 1 / -1; }
#stage .audit-reset { grid-row: span 2; align-self: center; }
#stage .audit-dashboard { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: var(--sp-4); block-size: 100%; }
#stage .metric-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-2); }
#stage .metric-chip { min-inline-size: 0; padding: var(--sp-3); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-control); }
#stage .metric-chip span { display: block; overflow: hidden; color: var(--text-muted); font-size: var(--fs-label); line-height: var(--lh-label); text-overflow: ellipsis; white-space: nowrap; }
#stage .metric-chip strong { display: block; margin-block-start: var(--sp-1); font-size: var(--fs-body-lg); line-height: var(--lh-tight); font-variant-numeric: tabular-nums; }
#stage .matrix-zone { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3); }
#stage .mini-matrix { padding: var(--sp-3); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-1); }
#stage .mini-matrix h3 { margin-block-end: var(--sp-2); font-size: var(--fs-body-sm); }
#stage .matrix-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-1); }
#stage .matrix-cell { display: grid; place-items: center; min-block-size: 48px; border: 1px solid var(--line); border-radius: var(--radius-sm); color: var(--text-strong); font-size: var(--fs-body-sm); font-weight: var(--weight-bold); font-variant-numeric: tabular-nums; }
#stage .matrix-cell--ok { background: var(--success-soft); }
#stage .matrix-cell--bad { background: var(--danger-soft); }
#stage .matrix-axis { margin-block-start: var(--sp-1); color: var(--text-faint); font-size: var(--fs-label); text-align: center; }
#stage .calibration { display: grid; grid-template-rows: auto minmax(0, 1fr); min-block-size: 0; padding: var(--sp-3); }
#stage .calibration h3 { font-size: var(--fs-body-sm); }
#stage .audit-verdict { padding: var(--sp-3) var(--sp-4); border-inline-start: 5px solid var(--danger); border-radius: var(--radius-md); background: var(--danger-soft); color: var(--text); font-size: var(--fs-body-sm); line-height: var(--lh-body); }
#stage .audit-verdict strong { color: var(--danger); }
#stage svg text { fill: var(--text-muted); font-size: var(--fs-tick); font-family: var(--font-sans); }
#stage svg .domain, #stage svg .tick line { stroke: var(--line-strong); }
#stage svg .grid-line { stroke: var(--line); stroke-dasharray: 4 6; }
#stage svg .decision { fill: none; stroke: var(--warm); stroke-width: 3; stroke-dasharray: 8 6; }
#stage svg .ideal { fill: none; stroke: var(--text-faint); stroke-width: 2; stroke-dasharray: 6 6; }
#stage svg .cal-line { fill: none; stroke: var(--danger); stroke-width: 4; }
#stage svg .dist { fill: none; stroke-width: 3; }
#stage svg .dist-a { stroke: var(--accent); }
#stage svg .dist-b { stroke: var(--secondary); }
#stage button:focus-visible, #stage input:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { #stage * { transition: none !important; } }
</style>

<main id="page-content" class="min0" aria-label="模型审计实验室">
  <section class="split-lr audit-layout min0">
    <div class="split-lr__left audit-lab min0">
      <div class="audit-head">
        <h2>污染训练池，移动部署现场</h2>
        <div class="audit-legend" aria-label="群体图例">
          <span class="audit-key"><i class="audit-dot"></i>A 组</span>
          <span class="audit-key"><i class="audit-dot audit-dot--b"></i>B 组</span>
          <span class="badge badge--accent" id="train-state" aria-live="polite">准备训练</span>
        </div>
      </div>
      <div class="plot audit-plot min0">
        <svg id="distribution-chart" viewBox="0 0 760 390" role="img" aria-label="训练分布与测试分布对照图"></svg>
      </div>
      <div class="panel audit-controls min0" aria-label="审计实验控制台">
        <div class="audit-control"><label for="keep-b">B 组训练保留率</label><output id="keep-b-value"></output><input id="keep-b" type="range"></div>
        <div class="audit-control"><label for="label-noise">B 组标签污染</label><output id="label-noise-value"></output><input id="label-noise" type="range"></div>
        <div class="audit-control"><label for="test-shift">B 组测试位移</label><output id="test-shift-value"></output><input id="test-shift" type="range"></div>
        <div class="audit-control"><label for="test-noise">测试测量噪声</label><output id="test-noise-value"></output><input id="test-noise" type="range"></div>
        <button id="reset" class="button--ghost audit-reset" type="button">恢复干净现场</button>
      </div>
    </div>

    <div class="split-lr__right audit-dashboard min0">
      <div class="audit-head"><h2>不能只看一格分数</h2><span class="badge badge--danger">部署审计</span></div>
      <div class="metric-strip" aria-label="审计关键读数">
        <div class="metric-chip"><span>总体准确率</span><strong id="m-overall">—</strong></div>
        <div class="metric-chip"><span>最弱群体</span><strong id="m-worst">—</strong></div>
        <div class="metric-chip"><span>漂移量</span><strong id="m-shift">—</strong></div>
        <div class="metric-chip"><span>置信误差</span><strong id="m-ece">—</strong></div>
      </div>
      <div class="matrix-zone" id="matrix-zone" aria-label="总体与分组混淆矩阵"></div>
      <div class="plot calibration min0">
        <h3>概率校准：说有多确定，实际就该有多常正确</h3>
        <svg id="calibration-chart" viewBox="0 0 600 245" role="img" aria-label="模型置信度校准曲线"></svg>
      </div>
      <div class="audit-verdict" id="verdict" aria-live="polite"><strong>审计提示：</strong>拖动控制项，寻找“总体尚可、局部失效”的现场。</div>
    </div>
  </section>
</main>

<script defer src="assets/lib/d3.min.js"></script>
<script defer src="assets/lib/mlp.js"></script>
<script>
(function () {
  'use strict';

  function boot() {
    Lec.mount({
      index: 22,
      kicker: `AUDIT THE MODEL`,
      title: `同一个高准确率，可能藏着完全不同的<em>失败</em>`,
      take: `评价神经网络不能只看总体分数，还要检查分布变化、群体差异与置信度。`
    });

    var P = Lec.P;
    var K = Lec.K;
    var ZERO = K.MATH.EPSILON - K.MATH.EPSILON;
    var ONE = K.NUMERIC_FORMATS.INT8_BYTES;
    var TWO = K.NUMERIC_FORMATS.FP16_BYTES;
    var cfg = {
      count: Math.floor(K.TRANSFORMER_BASE.MODEL_DIMENSION / TWO),
      hidden: K.TRANSFORMER_BASE.ATTENTION_HEADS,
      lr: Math.sqrt(K.TRAINING.DEFAULT_LEARNING_RATE),
      steps: Math.floor(K.TRANSFORMER_BASE.FEED_FORWARD_DIMENSION / K.TRANSFORMER_BASE.HEAD_DIMENSION),
      batch: K.TRANSFORMER_BASE.ATTENTION_HEADS * TWO,
      bins: K.ARCHITECTURE.LSTM_GATES + ONE,
      seed: K.HISTORY.LAST_YEAR,
      sliderStep: Math.sqrt(K.TRAINING.DEFAULT_LEARNING_RATE),
      shiftMax: K.MATH.SQRT_2
    };

    var controls = {
      keep: document.getElementById('keep-b'),
      poison: document.getElementById('label-noise'),
      shift: document.getElementById('test-shift'),
      noise: document.getElementById('test-noise')
    };
    var outputs = {
      keep: document.getElementById('keep-b-value'),
      poison: document.getElementById('label-noise-value'),
      shift: document.getElementById('test-shift-value'),
      noise: document.getElementById('test-noise-value')
    };
    var net, train, test, cleanReference, pending = true;

    function setRange(el, min, max, step, value) {
      el.min = String(min); el.max = String(max); el.step = String(step); el.value = String(value);
    }
    setRange(controls.keep, ZERO, ONE, cfg.sliderStep, ONE / K.ARCHITECTURE.LSTM_GATES);
    setRange(controls.poison, ZERO, ONE / TWO, cfg.sliderStep, ZERO);
    setRange(controls.shift, ZERO, cfg.shiftMax, cfg.sliderStep, ZERO);
    setRange(controls.noise, ZERO, ONE / TWO, cfg.sliderStep, ONE / K.TRANSFORMER_BASE.ATTENTION_HEADS);

    function rng(seed) {
      var s = seed >>> ZERO || ONE;
      return function () { s ^= s << 13; s >>>= ZERO; s ^= s >> 17; s ^= s << 5; s >>>= ZERO; return s / 4294967296; };
    }
    function normal(rand) {
      var u = Math.max(K.MATH.EPSILON, rand());
      var v = rand();
      return Math.sqrt(-TWO * Math.log(u)) * Math.cos(TWO * Math.PI * v);
    }
    function truth(x, y) { return x + K.TRAINING.DEFAULT_MOMENTUM * (y * y - ONE / K.ARCHITECTURE.LSTM_GATES) >= ZERO ? ONE : ZERO; }
    function makeData() {
      var rand = rng(cfg.seed), i, g, x, y, t, observedX, observedY;
      var keep = +controls.keep.value, poison = +controls.poison.value;
      var shift = +controls.shift.value, noise = +controls.noise.value;
      train = []; test = []; cleanReference = [];
      for (g = ZERO; g < TWO; g += ONE) {
        for (i = ZERO; i < cfg.count / TWO; i += ONE) {
          x = normal(rand) / TWO;
          y = (g === ZERO ? ONE : -ONE) * K.TRAINING.DEFAULT_MOMENTUM / K.MATH.SQRT_2 + normal(rand) / K.ARCHITECTURE.LSTM_GATES;
          t = truth(x, y);
          if (g === ZERO || rand() < keep) {
            if (g === ONE && rand() < poison) t = ONE - t;
            train.push({ x: [x, y], t: t, group: g });
          }
        }
      }
      for (g = ZERO; g < TWO; g += ONE) {
        for (i = ZERO; i < cfg.count / TWO; i += ONE) {
          x = normal(rand) / TWO;
          y = (g === ZERO ? ONE : -ONE) * K.TRAINING.DEFAULT_MOMENTUM / K.MATH.SQRT_2 + normal(rand) / K.ARCHITECTURE.LSTM_GATES;
          cleanReference.push({ x: [x, y], group: g });
          t = truth(x, y);
          observedX = x + normal(rand) * noise;
          observedY = y - (g === ONE ? shift : ZERO) + normal(rand) * noise;
          test.push({ x: [observedX, observedY], t: t, group: g });
        }
      }
    }

    function fallbackGroupMetrics(rows) {
      function oneSet(items) {
        var cm = [[ZERO, ZERO], [ZERO, ZERO]], correct = ZERO;
        items.forEach(function (d) { var pred = d.p >= ONE / TWO ? ONE : ZERO; cm[d.t][pred] += ONE; if (pred === d.t) correct += ONE; });
        return { confusion: cm, accuracy: correct / Math.max(ONE, items.length) };
      }
      return { overall: oneSet(rows), groups: [oneSet(rows.filter(function(d){ return d.group === ZERO; })), oneSet(rows.filter(function(d){ return d.group === ONE; }))] };
    }
    function fallbackCalibrationBins(rows, count) {
      var bins = d3.range(count).map(function () { return { n: ZERO, conf: ZERO, acc: ZERO }; });
      rows.forEach(function (d) { var conf = Math.max(d.p, ONE - d.p), ok = (d.p >= ONE / TWO ? ONE : ZERO) === d.t ? ONE : ZERO; var ix = Math.min(count - ONE, Math.floor(conf * count)); bins[ix].n += ONE; bins[ix].conf += conf; bins[ix].acc += ok; });
      return bins.filter(function(d){ return d.n; }).map(function(d){ return { confidence: d.conf / d.n, accuracy: d.acc / d.n, count: d.n }; });
    }
    function fallbackCalibrationError(bins) { var n = P.sum(bins.map(function(d){ return d.count; })); return P.sum(bins.map(function(d){ return Math.abs(d.accuracy - d.conf) * d.count; })) / Math.max(ONE, n); }
    function fallbackShiftSummary(reference, current) {
      function center(rows, group) { var set = rows.filter(function(d){ return d.group === group; }); return [P.mean(set.map(function(d){ return d.x[ZERO]; })), P.mean(set.map(function(d){ return d.x[ONE]; }))]; }
      var a = center(reference, ONE), b = center(current, ONE);
      return { distance: Math.sqrt(Math.pow(a[ZERO] - b[ZERO], TWO) + Math.pow(a[ONE] - b[ONE], TWO)) };
    }
    var groupMetrics = P.groupMetrics || fallbackGroupMetrics;
    var calibrationBins = P.calibrationBins || fallbackCalibrationBins;
    var calibrationError = P.calibrationError || fallbackCalibrationError;
    var shiftSummary = P.shiftSummary || fallbackShiftSummary;

    function restart() {
      makeData();
      net = MLP.create({ sizes: [TWO, cfg.hidden, cfg.hidden, ONE], act: 'tanh', lr: cfg.lr, seed: cfg.seed });
      pending = true;
      document.getElementById('train-state').textContent = '实时训练中';
      updateOutputs();
      renderDistribution();
    }
    function predictions() { return test.map(function (d) { return { x: d.x, t: d.t, group: d.group, p: net.predict(d.x) }; }); }
    function fmtPct(v) { return P.formatPercent(v, ONE, false); }
    function updateOutputs() {
      outputs.keep.textContent = fmtPct(+controls.keep.value);
      outputs.poison.textContent = fmtPct(+controls.poison.value);
      outputs.shift.textContent = Deck.fmt(+controls.shift.value, TWO) + 'σ';
      outputs.noise.textContent = Deck.fmt(+controls.noise.value, TWO) + 'σ';
    }

    function renderDistribution() {
      var svg = d3.select('#distribution-chart'); svg.selectAll('*').remove();
      var W = 760, H = 390, top = 42, bottom = 32, gap = 54, paneW = (W - gap - 70) / TWO, paneH = H - top - bottom;
      var ext = cfg.shiftMax + ONE;
      var x = d3.scaleLinear().domain([-ext, ext]).range([ZERO, paneW]).clamp(true);
      var y = d3.scaleLinear().domain([-ext, ext]).range([paneH, ZERO]).clamp(true);
      function pane(data, ox, title, current) {
        var g = svg.append('g').attr('transform', 'translate(' + ox + ',' + top + ')');
        g.append('text').attr('x', paneW / TWO).attr('y', -16).attr('text-anchor', 'middle').text(title);
        g.append('rect').attr('width', paneW).attr('height', paneH).attr('rx', 12).attr('fill', 'var(--surface-control)').attr('stroke', 'var(--line)');
        g.append('line').attr('class','grid-line').attr('x1',x(ZERO)).attr('x2',x(ZERO)).attr('y1',ZERO).attr('y2',paneH);
        g.append('line').attr('class','grid-line').attr('y1',y(ZERO)).attr('y2',y(ZERO)).attr('x1',ZERO).attr('x2',paneW);
        var lineData = d3.range(80).map(function(i){ var yy = -ext + (TWO * ext * i / 79); return [-(K.TRAINING.DEFAULT_MOMENTUM * (yy * yy - ONE / K.ARCHITECTURE.LSTM_GATES)), yy]; });
        g.append('path').datum(lineData).attr('class','decision').attr('d',d3.line().x(function(d){return x(d[ZERO]);}).y(function(d){return y(d[ONE]);}));
        g.selectAll('path.point').data(data).join('path').attr('d',function(d){ return d3.symbol().type(d.group === ZERO ? d3.symbolCircle : d3.symbolSquare).size(current ? 26 : 34)(); }).attr('transform',function(d){return 'translate('+x(d.x[ZERO])+','+y(d.x[ONE])+')';}).attr('fill',function(d){return d.group === ZERO ? 'var(--accent)' : 'var(--secondary)';}).attr('opacity', current ? .58 : .72).attr('stroke',function(d){ return d.t === ONE ? 'var(--text-strong)' : 'var(--surface-control)'; }).attr('stroke-width',current ? ONE:TWO);
      }
      pane(train, 30, '训练池 · 边框表示标签', false);
      pane(test, 30 + paneW + gap, '部署流 · 位置与噪声可变', true);
    }

    function renderMatrix(metrics) {
      var zone = document.getElementById('matrix-zone'); zone.textContent = '';
      var sets = [{name:'总体', value:metrics.overall},{name:'A 组',value:metrics.groups[ZERO]},{name:'B 组',value:metrics.groups[ONE]}];
      sets.forEach(function(s){
        var card=document.createElement('section'); card.className='mini-matrix';
        var h=document.createElement('h3'); h.textContent=s.name+' · '+fmtPct(s.value.accuracy); card.appendChild(h);
        var grid=document.createElement('div'); grid.className='matrix-grid';
        [[ZERO,ZERO],[ZERO,ONE],[ONE,ZERO],[ONE,ONE]].forEach(function(ix){ var c=document.createElement('div'); c.className='matrix-cell '+(ix[ZERO]===ix[ONE]?'matrix-cell--ok':'matrix-cell--bad'); c.textContent=String(s.value.confusion[ix[ZERO]][ix[ONE]]); grid.appendChild(c); });
        card.appendChild(grid); var axis=document.createElement('div'); axis.className='matrix-axis'; axis.textContent='行：实际　列：预测'; card.appendChild(axis); zone.appendChild(card);
      });
    }

    function renderCalibration(bins) {
      var svg=d3.select('#calibration-chart'); svg.selectAll('*').remove();
      var W=600,H=245,m={t:18,r:24,b:48,l:56},iw=W-m.l-m.r,ih=H-m.t-m.b;
      var x=d3.scaleLinear().domain([ZERO,ONE]).range([ZERO,iw]); var y=d3.scaleLinear().domain([ZERO,ONE]).range([ih,ZERO]);
      var g=svg.append('g').attr('transform','translate('+m.l+','+m.t+')');
      g.append('path').datum([[ZERO,ZERO],[ONE,ONE]]).attr('class','ideal').attr('d',d3.line().x(function(d){return x(d[ZERO]);}).y(function(d){return y(d[ONE]);}));
      g.append('path').datum(bins).attr('class','cal-line').attr('d',d3.line().x(function(d){return x(d.confidence);}).y(function(d){return y(d.accuracy);}));
      g.selectAll('circle').data(bins).join('circle').attr('cx',function(d){return x(d.confidence);}).attr('cy',function(d){return y(d.accuracy);}).attr('r',6).attr('fill','var(--danger)').attr('stroke','var(--text-strong)').attr('stroke-width',TWO);
      var tickFmt=function(d){return P.formatPercent(d,ZERO,false);};
      g.append('g').attr('transform','translate(0,'+ih+')').call(d3.axisBottom(x).ticks(TWO).tickFormat(tickFmt));
      g.append('g').call(d3.axisLeft(y).ticks(TWO).tickFormat(tickFmt));
      svg.append('text').attr('x',m.l+iw/TWO).attr('y',H-8).attr('text-anchor','middle').text('平均置信度');
      svg.append('text').attr('transform','translate(16,'+(m.t+ih/TWO)+') rotate(-90)').attr('text-anchor','middle').text('实际正确率');
    }

    function renderAudit() {
      var rows=predictions();
      var metrics=groupMetrics(rows);
      var bins=calibrationBins(rows,cfg.bins);
      var ece=calibrationError(bins);
      var shift=shiftSummary(cleanReference,test);
      var worst=Math.min(metrics.groups[ZERO].accuracy,metrics.groups[ONE].accuracy);
      document.getElementById('m-overall').textContent=fmtPct(metrics.overall.accuracy);
      document.getElementById('m-worst').textContent=fmtPct(worst);
      document.getElementById('m-shift').textContent=Deck.fmt(shift.distance,TWO)+'σ';
      document.getElementById('m-ece').textContent=fmtPct(ece);
      renderMatrix(metrics); renderCalibration(bins); renderDistribution();
      var gap=metrics.overall.accuracy-worst;
      var verdict=document.getElementById('verdict');
      if (gap > ONE / K.ARCHITECTURE.LSTM_GATES || ece > ONE / K.TRANSFORMER_BASE.ATTENTION_HEADS) verdict.innerHTML='<strong>审计报警：</strong>总体分数掩盖了群体落差或过度自信；部署前必须分组检查。';
      else if (shift.distance > ONE / K.ARCHITECTURE.LSTM_GATES) verdict.innerHTML='<strong>漂移预警：</strong>现场已经离开训练分布，当前高分不能自动外推。';
      else verdict.innerHTML='<strong>当前较稳：</strong>继续污染或移动分布，观察总体分数何时开始“说谎”。';
    }

    Object.keys(controls).forEach(function(key){ controls[key].addEventListener('input', restart); });
    document.getElementById('reset').addEventListener('click',function(){
      controls.keep.value=String(ONE); controls.poison.value=String(ZERO); controls.shift.value=String(ZERO); controls.noise.value=String(ZERO); restart();
    });

    restart();
    Deck.loop(function(){
      if (!pending) return;
      for (var i=ZERO;i<K.ARCHITECTURE.LSTM_GATES;i+=ONE) net.step(train,cfg.batch);
      renderAudit();
      if (net.iter >= cfg.steps || net.diverged) { pending=false; document.getElementById('train-state').textContent=net.diverged?'训练异常':'训练完成'; }
    }, { still: ZERO });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });
  else boot();
}());
</script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
