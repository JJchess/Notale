<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="23" data-total="24">
  <div id="stage">
    <style>
      #stage #page-content { block-size: 100%; min-block-size: 0; }
      #stage history-path-game { --stage-share: 1.9fr; --cards-share: .68fr; }
      #stage .puzzle-panel { display: flex; min-block-size: 0; flex-direction: column; padding: var(--sp-4); }
      #stage .puzzle-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); margin-block-end: var(--sp-3); }
      #stage .puzzle-head strong { font-size: var(--fs-body); }
      #stage .board {
        position: relative; display: grid; min-block-size: 0; flex: 1 1 auto;
        grid-template-columns: 112px repeat(7, minmax(0, 1fr));
        grid-template-rows: 34px repeat(6, minmax(0, 1fr));
        gap: var(--sp-1); padding: var(--sp-2); border: 1px solid var(--line);
        border-radius: var(--radius-md); background: var(--surface-control);
      }
      #stage .board:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
      #stage .step-label { display: grid; place-items: center; color: var(--text-faint); font-size: var(--fs-tick); line-height: var(--lh-tight); }
      #stage .track-label {
        display: flex; align-items: center; gap: var(--sp-2); padding-inline: var(--sp-3);
        border-inline-start: 4px solid var(--line-strong); color: var(--text-muted);
        font-size: var(--fs-label); font-weight: var(--weight-semibold); line-height: var(--lh-label);
      }
      #stage .track-label::before { content: ""; inline-size: 8px; block-size: 8px; flex: 0 0 auto; border-radius: 50%; background: var(--secondary); }
      #stage .cell {
        position: relative; min-inline-size: 0; min-block-size: 0; border: 1px dashed var(--line);
        border-radius: var(--radius-sm); background: var(--surface-1);
      }
      #stage .cell:hover, #stage .cell.is-target { border-color: var(--accent); background: var(--accent-soft); }
      #stage .event-card {
        position: absolute; z-index: 2; inset: var(--sp-1); display: flex; min-inline-size: 0; min-block-size: 0;
        align-items: center; justify-content: center; padding: var(--sp-1) var(--sp-2);
        border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-raised);
        color: var(--text); font-size: var(--fs-label); font-weight: var(--weight-semibold); line-height: var(--lh-tight);
        text-align: center; cursor: grab; user-select: none; box-shadow: var(--shadow-sm);
      }
      #stage .event-card.is-selected { border-color: var(--focus); box-shadow: 0 0 0 2px var(--focus); }
      #stage .event-card.is-conflict { border-color: var(--danger); background: var(--danger-soft); }
      #stage .event-card.is-reachable { border-color: var(--success); background: var(--success-soft); }
      #stage .event-card .date { display: block; color: var(--warm); font-size: var(--fs-tick); font-weight: var(--weight-bold); }
      #stage .event-card .kind { position: absolute; inset-block-start: var(--sp-1); inset-inline-end: var(--sp-1); color: var(--text-faint); font-size: var(--fs-tick); }
      #stage .side-card { display: flex; min-block-size: 0; flex-direction: column; gap: var(--sp-4); }
      #stage .side-card h2 { font-size: var(--fs-h3); }
      #stage .instructions { color: var(--text-muted); font-size: var(--fs-body-sm); line-height: var(--lh-body); }
      #stage .status-box { min-block-size: 108px; padding: var(--sp-4); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-control); }
      #stage .status-box strong { display: block; margin-block-end: var(--sp-1); color: var(--accent-strong); font-size: var(--fs-body); }
      #stage .status-box p { color: var(--text-muted); font-size: var(--fs-body-sm); line-height: var(--lh-body); }
      #stage .path-list { display: grid; gap: var(--sp-2); }
      #stage .path-chip { padding: var(--sp-2) var(--sp-3); border-inline-start: 4px solid var(--success); border-radius: var(--radius-sm); background: var(--success-soft); color: var(--text); font-size: var(--fs-label); line-height: var(--lh-label); }
      #stage .actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); margin-block-start: auto; }
      #stage .keyboard-hint { color: var(--text-faint); font-size: var(--fs-label); line-height: var(--lh-label); }
      #stage .drag-ghost { opacity: .45; }
      @media (prefers-reduced-motion: reduce) {
        #stage .event-card, #stage button { transition: none; }
      }
    </style>

    <main id="page-content" class="min0" aria-label="本页正文">
      <history-path-game id="history-game" class="stage-cards min0" aria-label="历史依赖拼图">
        <section class="stage-cards__stage panel puzzle-panel min0" aria-labelledby="board-title">
          <div class="puzzle-head">
            <strong id="board-title">六条轨道 · 多条合法路线</strong>
            <span class="badge badge--accent" id="phase-badge">日期已隐藏</span>
          </div>
          <div id="board" class="board no-pan" tabindex="0" role="application" aria-label="依赖拼图。方向键移动选中卡片，回车提交。" aria-describedby="keyboard-hint"></div>
        </section>

        <aside class="stage-cards__cards min0">
          <section class="card card--raised side-card grow min0">
            <div>
              <h2>重建突破条件</h2>
              <p class="instructions">选中一张卡，再点目标格；也可直接拖放。轨道说明“解决哪类瓶颈”，横向位置只需满足依赖，不必拼成唯一年表。</p>
            </div>
            <div class="status-box" aria-live="polite" aria-atomic="true">
              <strong id="status-title">等待你的因果判断</strong>
              <p id="status-text">先修复轨道，再检查哪些工作必须先出现。</p>
            </div>
            <div id="paths" class="path-list" aria-label="重建出的突破路径"></div>
            <p id="keyboard-hint" class="keyboard-hint">键盘：方向键改轨道或顺序，Enter 提交。</p>
            <div class="actions">
              <button id="submit" class="button--primary" type="button">提交因果链</button>
              <button id="reset" class="button--ghost" type="button">重新打乱</button>
            </div>
          </section>
        </aside>
      </history-path-game>
    </main>

    <script>
      (function () {
        'use strict';

        var TRACKS = ['表示', '学习', '架构', '数据', '算力', '系统'];
        var EDGE_IDS = [
          ['mcculloch-pitts', 'perceptron'],
          ['perceptron', 'backprop'],
          ['backprop', 'alexnet'],
          ['neocognitron', 'alexnet'],
          ['imagenet', 'alexnet'],
          ['gpu-condition', 'alexnet']
        ];
        var CARD_SPEC = [
          { id: 'mcculloch-pitts', track: '表示', short: '阈值神经元' },
          { id: 'perceptron', track: '学习', short: '感知机学习' },
          { id: 'backprop', track: '学习', short: '反向传播' },
          { id: 'neocognitron', track: '架构', short: '局部感受野' },
          { id: 'imagenet', track: '数据', short: 'ImageNet' },
          { id: 'gpu-condition', track: '算力', short: 'GPU 并行训练', condition: true },
          { id: 'alexnet', track: '系统', short: 'AlexNet 工程组合' }
        ];

        function copy(value) { return JSON.parse(JSON.stringify(value)); }
        function eventFor(id) { return id === 'gpu-condition' ? null : Lec.P.eventById(id); }
        function labelFor(card) {
          var event = eventFor(card.id);
          if (typeof Lec.P.eventLabel === 'function') {
            try { return Lec.P.eventLabel(card.id); } catch (ignore) {}
          }
          return event ? event.title + ' · ' + String(event.year) : card.short;
        }
        function shuffledSpecs() {
          var list = CARD_SPEC.map(function (item) { return copy(item); });
          if (typeof Lec.P.seededShuffle === 'function' && Lec.K.seeds) {
            try { return Lec.P.seededShuffle(list, Lec.K.seeds[23] || Lec.K.seeds.page23); } catch (ignore) {}
          }
          return list.sort(function (a, b) {
            var ah = a.id.split('').reduce(function (sum, ch) { return sum + ch.charCodeAt(0); }, 0);
            var bh = b.id.split('').reduce(function (sum, ch) { return sum + ch.charCodeAt(0); }, 0);
            return (ah % CARD_SPEC.length) - (bh % CARD_SPEC.length);
          });
        }
        function initialState() {
          return {
            cards: shuffledSpecs().map(function (card, index) {
              card.column = index;
              card.trackNow = TRACKS[(index * 2 + 3) % TRACKS.length];
              return card;
            }),
            selected: null,
            submitted: false,
            complete: false,
            conflict: []
          };
        }
        function ordered(state) { return state.cards.slice().sort(function (a, b) { return a.column - b.column; }); }
        function localConstraint(state) {
          var byId = {};
          var conflicts = [];
          state.cards.forEach(function (card) { byId[card.id] = card; if (card.trackNow !== card.track) { conflicts.push(card.id); } });
          EDGE_IDS.forEach(function (edge) {
            if (byId[edge[0]].column >= byId[edge[1]].column) { conflicts.push(edge[0], edge[1]); }
          });
          return { valid: conflicts.length === 0, conflicts: conflicts.filter(function (id, i, a) { return a.indexOf(id) === i; }) };
        }
        function constraintScore(state) {
          if (typeof Lec.P.timelineConstraintScore === 'function') {
            try {
              var result = Lec.P.timelineConstraintScore(ordered(state).map(function (c) { return c.id; }), EDGE_IDS, state.cards);
              if (result && typeof result.valid === 'boolean') { return result; }
            } catch (ignore) {}
          }
          return localConstraint(state);
        }
        function isTopological(state) {
          if (typeof Lec.P.topologicalOrders === 'function') {
            try {
              var orders = Lec.P.topologicalOrders(CARD_SPEC.map(function (c) { return c.id; }), EDGE_IDS);
              var key = ordered(state).map(function (c) { return c.id; }).join('|');
              if (Array.isArray(orders)) { return orders.some(function (order) { return order.join('|') === key; }); }
            } catch (ignore) {}
          }
          return EDGE_IDS.every(function (edge) {
            var list = ordered(state).map(function (c) { return c.id; });
            return list.indexOf(edge[0]) < list.indexOf(edge[1]);
          });
        }
        function reachableTo(target) {
          if (typeof Lec.P.dependencyReachability === 'function') {
            try { return Lec.P.dependencyReachability(EDGE_IDS, target); } catch (ignore) {}
          }
          var found = [target];
          var changed = true;
          while (changed) {
            changed = false;
            EDGE_IDS.forEach(function (edge) {
              if (found.indexOf(edge[1]) >= 0 && found.indexOf(edge[0]) < 0) { found.push(edge[0]); changed = true; }
            });
          }
          return found;
        }
        function transition(state, action) {
          var next = copy(state);
          var card;
          var occupant;
          if (action.type === 'select') { next.selected = action.id; next.submitted = false; next.conflict = []; }
          if (action.type === 'move') {
            card = next.cards.find(function (item) { return item.id === action.id; });
            occupant = next.cards.find(function (item) { return item.column === action.column && item.id !== action.id; });
            if (occupant) { occupant.column = card.column; }
            card.column = action.column;
            card.trackNow = TRACKS[action.track];
            next.selected = card.id;
            next.submitted = false;
            next.complete = false;
            next.conflict = [];
          }
          if (action.type === 'submit') {
            var score = constraintScore(next);
            next.submitted = true;
            next.complete = score.valid && isTopological(next);
            next.conflict = next.complete ? [] : (score.conflicts || []);
          }
          return next;
        }

        class HistoryPathGame extends HTMLElement {
          connectedCallback() {
            if (this.ready) { return; }
            this.ready = true;
            this.board = this.querySelector('#board');
            this.statusTitle = this.querySelector('#status-title');
            this.statusText = this.querySelector('#status-text');
            this.paths = this.querySelector('#paths');
            this.badge = this.querySelector('#phase-badge');
            this.state = initialState();
            this.dragId = null;
            this.bind();
            this.start();
          }
          bind() {
            var self = this;
            this.board.addEventListener('click', function (event) {
              var card = event.target.closest('.event-card');
              var cell = event.target.closest('.cell');
              if (card) { self.act({ type: 'select', id: card.dataset.id }); return; }
              if (cell && self.state.selected) { self.act({ type: 'move', id: self.state.selected, track: Number(cell.dataset.track), column: Number(cell.dataset.column) }); }
            });
            this.board.addEventListener('dragstart', function (event) {
              var card = event.target.closest('.event-card');
              if (!card) { return; }
              self.dragId = card.dataset.id;
              card.classList.add('drag-ghost');
              event.dataTransfer.setData('text/plain', self.dragId);
            });
            this.board.addEventListener('dragend', function (event) { var card = event.target.closest('.event-card'); if (card) { card.classList.remove('drag-ghost'); } self.dragId = null; });
            this.board.addEventListener('dragover', function (event) { if (event.target.closest('.cell')) { event.preventDefault(); } });
            this.board.addEventListener('drop', function (event) {
              var cell = event.target.closest('.cell');
              if (!cell) { return; }
              event.preventDefault();
              self.act({ type: 'move', id: self.dragId || event.dataTransfer.getData('text/plain'), track: Number(cell.dataset.track), column: Number(cell.dataset.column) });
            });
            this.board.addEventListener('keydown', function (event) {
              var card = self.state.cards.find(function (item) { return item.id === self.state.selected; }) || ordered(self.state)[0];
              var trackIndex = TRACKS.indexOf(card.trackNow);
              if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); self.submit(); return; }
              if (event.key === 'ArrowLeft') { event.preventDefault(); self.act({ type: 'move', id: card.id, track: trackIndex, column: Math.max(0, card.column - 1) }); }
              if (event.key === 'ArrowRight') { event.preventDefault(); self.act({ type: 'move', id: card.id, track: trackIndex, column: Math.min(CARD_SPEC.length - 1, card.column + 1) }); }
              if (event.key === 'ArrowUp') { event.preventDefault(); self.act({ type: 'move', id: card.id, track: Math.max(0, trackIndex - 1), column: card.column }); }
              if (event.key === 'ArrowDown') { event.preventDefault(); self.act({ type: 'move', id: card.id, track: Math.min(TRACKS.length - 1, trackIndex + 1), column: card.column }); }
            });
            this.querySelector('#submit').addEventListener('click', function () { self.submit(); });
            this.querySelector('#reset').addEventListener('click', function () { self.reset(); });
          }
          act(action) {
            this.state = transition(this.state, action);
            this.render();
            this.dispatchEvent(new CustomEvent('game-progress', { bubbles: true, composed: true, detail: { state: this.getState(), action: action, metrics: constraintScore(this.state) } }));
          }
          start() {
            this.render();
            this.dispatchEvent(new CustomEvent('game-start', { bubbles: true, composed: true }));
          }
          submit() {
            this.state = transition(this.state, { type: 'submit' });
            this.render();
            if (this.state.complete) {
              this.dispatchEvent(new CustomEvent('game-complete', { bubbles: true, composed: true, detail: { score: 'complete', metrics: constraintScore(this.state), trace: ordered(this.state).map(function (c) { return c.id; }) } }));
            }
          }
          reset() {
            this.state = initialState();
            this.render();
            this.dispatchEvent(new CustomEvent('game-reset', { bubbles: true, composed: true }));
          }
          getState() { return copy(this.state); }
          render() {
            var self = this;
            this.board.innerHTML = '';
            var corner = document.createElement('span'); corner.className = 'step-label'; corner.textContent = '轨道 / 顺序'; this.board.appendChild(corner);
            CARD_SPEC.forEach(function (_, index) { var label = document.createElement('span'); label.className = 'step-label'; label.textContent = '→'; label.setAttribute('aria-hidden', 'true'); self.board.appendChild(label); });
            TRACKS.forEach(function (track, trackIndex) {
              var label = document.createElement('span'); label.className = 'track-label'; label.textContent = track; self.board.appendChild(label);
              CARD_SPEC.forEach(function (_, column) {
                var cell = document.createElement('div'); cell.className = 'cell'; cell.dataset.track = String(trackIndex); cell.dataset.column = String(column);
                cell.setAttribute('aria-label', track + '轨道的顺序位置');
                var card = self.state.cards.find(function (item) { return item.trackNow === track && item.column === column; });
                if (card) {
                  var node = document.createElement('div'); node.className = 'event-card'; node.draggable = true; node.dataset.id = card.id;
                  if (card.id === self.state.selected) { node.classList.add('is-selected'); }
                  if (self.state.conflict.indexOf(card.id) >= 0) { node.classList.add('is-conflict'); }
                  if (self.state.complete && reachableTo('alexnet').indexOf(card.id) >= 0) { node.classList.add('is-reachable'); }
                  var text = document.createElement('span'); text.textContent = card.short; node.appendChild(text);
                  if (card.condition) { var kind = document.createElement('span'); kind.className = 'kind'; kind.textContent = '条件'; node.appendChild(kind); }
                  if (self.state.submitted && !card.condition) { var date = document.createElement('span'); date.className = 'date'; date.textContent = labelFor(card).replace(/^.*?·\s*/, ''); text.appendChild(date); }
                  cell.appendChild(node);
                }
                self.board.appendChild(cell);
              });
            });
            if (!this.state.submitted) {
              this.badge.textContent = '日期已隐藏';
              this.badge.className = 'badge badge--accent';
              this.statusTitle.textContent = '等待你的因果判断';
              this.statusText.textContent = this.state.selected ? '已选中卡片：移动它，或继续调整顺序。' : '先修复轨道，再检查哪些工作必须先出现。';
              this.paths.innerHTML = '';
            } else if (this.state.complete) {
              this.badge.textContent = '依赖成立'; this.badge.className = 'badge badge--success';
              this.statusTitle.textContent = '因果链重建完成';
              this.statusText.textContent = '日期现在只用于校验；高亮显示多条条件如何汇入同一突破。';
              this.paths.innerHTML = '<div class="path-chip">表示 → 学习 → 系统</div><div class="path-chip">架构 → 系统</div><div class="path-chip">数据 ＋ 算力 → 系统</div>';
            } else {
              this.badge.textContent = '存在冲突'; this.badge.className = 'badge badge--danger';
              this.statusTitle.textContent = '还不能提交';
              this.statusText.textContent = this.state.conflict.length ? '冲突类型：轨道归类或先修依赖不成立。日期不是判定依据。' : '冲突类型：先修依赖不成立。尝试交换横向位置。';
              this.paths.innerHTML = '';
            }
          }
        }

        function boot() {
          if (!customElements.get('history-path-game')) { customElements.define('history-path-game', HistoryPathGame); }
          Lec.mount({
            index: 23,
            kicker: `REBUILD THE PATH`,
            title: `如果打乱所有事件，你能重新拼出<em>因果链</em>吗？`,
            take: `掌握历史不是背年份，而是知道每项工作解决了什么瓶颈、又依赖哪些条件。`
          });
        }

        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', boot, { once: true }); }
        else { boot(); }
      }());
    </script>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
</body>
</html>
