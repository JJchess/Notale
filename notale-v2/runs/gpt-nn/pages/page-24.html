<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="24" data-total="24">
  <div id="stage">
    <style>
      #stage #page-content {
        inline-size: 100%;
        block-size: 100%;
        padding: var(--sp-4) var(--page-x);
      }
      #stage .challenge-board { gap: var(--sp-5); }
      #stage .task-pane {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: var(--sp-4);
        block-size: 100%;
        padding: var(--sp-5);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: linear-gradient(145deg, var(--surface-2), var(--surface-1));
        box-shadow: var(--shadow-sm);
      }
      #stage .task-pane::before {
        content: "";
        position: absolute;
        inset-block-start: 0;
        inset-inline: var(--sp-5);
        block-size: 3px;
        border-radius: var(--radius-pill);
        background: linear-gradient(90deg, var(--secondary), var(--accent));
      }
      #stage .task-top {
        display: flex;
        min-inline-size: 0;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--sp-3);
      }
      #stage .task-heading { min-inline-size: 0; }
      #stage .task-kind {
        color: var(--accent-strong);
        font-size: var(--fs-label);
        font-weight: var(--weight-bold);
        line-height: var(--lh-label);
      }
      #stage .task-name {
        margin-block-start: var(--sp-1);
        color: var(--text-strong);
        font-size: var(--fs-body-lg);
        font-weight: var(--weight-bold);
        line-height: var(--lh-tight);
      }
      #stage .task-brief {
        min-block-size: 3.1em;
        color: var(--text-muted);
        font-size: var(--fs-body-sm);
        line-height: var(--lh-body);
      }
      #stage .task-controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--sp-3);
      }
      #stage .task-controls select { inline-size: 100%; }
      #stage .budget-line {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--sp-3);
      }
      #stage .budget-value {
        color: var(--accent-strong);
        font-size: var(--fs-label);
        font-weight: var(--weight-semibold);
      }
      #stage .metric-plot {
        flex: 1 1 auto;
        min-block-size: 128px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--surface-control);
      }
      #stage .metric-plot svg { display: block; inline-size: 100%; block-size: 100%; }
      #stage .metric-label { fill: var(--text-muted); font-size: var(--fs-label); }
      #stage .metric-value { fill: var(--text-strong); font-size: var(--fs-tick); font-weight: var(--weight-semibold); }
      #stage .metric-track { fill: var(--surface-3); }
      #stage .metric-bar { fill: var(--accent); }
      #stage .result-strip {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: var(--sp-3);
        min-block-size: 58px;
        padding: var(--sp-3) var(--sp-4);
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--surface-control);
      }
      #stage .fit-state {
        color: var(--text);
        font-size: var(--fs-body-sm);
        font-weight: var(--weight-semibold);
        line-height: var(--lh-label);
      }
      #stage .source-chip {
        max-inline-size: 190px;
        color: var(--text-muted);
        font-size: var(--fs-label);
        line-height: var(--lh-label);
        text-align: end;
      }
      #stage .task-pane[data-done="true"] {
        border-color: var(--accent);
        box-shadow: var(--shadow-glow);
      }
      #stage .task-pane[data-done="true"] .source-chip { color: var(--accent-strong); }
      #stage select:focus-visible,
      #stage input:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        #stage * { transition: none !important; }
      }
    </style>

    <main id="page-content" class="min0" aria-label="结课工具箱挑战">
      <section class="triptych challenge-board" aria-label="三个未知任务">
        <article class="triptych__pane task-pane min0" data-task-index="0" data-done="false">
          <div class="task-top">
            <div class="task-heading min0"><div class="task-kind">线性分类</div><div class="task-name">未知边界</div></div>
            <span class="badge">任务 A</span>
          </div>
          <p class="task-brief">从样本结构判断：简单边界是否已经足够？</p>
          <div class="task-controls">
            <label class="control"><span class="control-label">选择历史方法</span><select aria-label="为线性分类选择方法"><option value="">选择方法</option></select></label>
            <label class="control"><span class="budget-line"><span class="control-label">分配预算</span><output class="budget-value">—</output></span><input type="range" aria-label="线性分类预算" disabled></label>
          </div>
          <div class="metric-plot" aria-label="方案指标图"></div>
          <div class="result-strip"><output class="fit-state" aria-live="polite">等待方案</output><span class="source-chip">历史来源待回亮</span></div>
        </article>

        <article class="triptych__pane task-pane min0" data-task-index="1" data-done="false">
          <div class="task-top">
            <div class="task-heading min0"><div class="task-kind">局部图案识别</div><div class="task-name">移动的纹样</div></div>
            <span class="badge">任务 B</span>
          </div>
          <p class="task-brief">图案会换位置；方法能否复用同一局部检测器？</p>
          <div class="task-controls">
            <label class="control"><span class="control-label">选择历史方法</span><select aria-label="为局部图案识别选择方法"><option value="">选择方法</option></select></label>
            <label class="control"><span class="budget-line"><span class="control-label">分配预算</span><output class="budget-value">—</output></span><input type="range" aria-label="局部图案识别预算" disabled></label>
          </div>
          <div class="metric-plot" aria-label="方案指标图"></div>
          <div class="result-strip"><output class="fit-state" aria-live="polite">等待方案</output><span class="source-chip">历史来源待回亮</span></div>
        </article>

        <article class="triptych__pane task-pane min0" data-task-index="2" data-done="false">
          <div class="task-top">
            <div class="task-heading min0"><div class="task-kind">跨位置检索</div><div class="task-name">寻找远处线索</div></div>
            <span class="badge">任务 C</span>
          </div>
          <p class="task-brief">答案依赖远处位置；方法怎样把相关信息取回来？</p>
          <div class="task-controls">
            <label class="control"><span class="control-label">选择历史方法</span><select aria-label="为跨位置检索选择方法"><option value="">选择方法</option></select></label>
            <label class="control"><span class="budget-line"><span class="control-label">分配预算</span><output class="budget-value">—</output></span><input type="range" aria-label="跨位置检索预算" disabled></label>
          </div>
          <div class="metric-plot" aria-label="方案指标图"></div>
          <div class="result-strip"><output class="fit-state" aria-live="polite">等待方案</output><span class="source-chip">历史来源待回亮</span></div>
        </article>
      </section>
    </main>

    <script defer src="assets/lib/d3.min.js"></script>
    <script>
      (function () {
        'use strict';

        function boot() {
          Lec.mount({
            index: 24,
            kicker: `A TOOLBOX, NOT A LADDER`,
            title: `最后一关：为问题选择正确的<em>历史遗产</em>`,
            take: `神经网络的发展留下的不是一条淘汰链，而是一套可按数据结构与任务约束组合的工具箱。`
          });

          var P = Lec.P;
          var panes = Array.prototype.slice.call(document.querySelectorAll('#stage .task-pane'));
          var methodFallback = [
            { id: 'threshold', label: '阈值单元' },
            { id: 'mlp', label: '多层网络' },
            { id: 'convolution', label: '卷积' },
            { id: 'recurrent', label: '循环记忆' },
            { id: 'attention', label: '注意力' },
            { id: 'search', label: '搜索模块' }
          ];
          var sourceMap = {
            threshold: 'perceptron', perceptron: 'perceptron', mlp: 'backprop',
            convolution: 'neocognitron', cnn: 'neocognitron', recurrent: 'lstm',
            rnn: 'lstm', attention: 'transformer', search: 'alphago'
          };
          var challenge = typeof P.finalChallengeSet === 'function' ? P.finalChallengeSet() : null;
          var tasks = challenge && Array.isArray(challenge.tasks) ? challenge.tasks : (Array.isArray(challenge) ? challenge : []);
          var methods = challenge && Array.isArray(challenge.methods) ? challenge.methods : methodFallback;
          var results = [];

          function textOf(value, fallback) {
            return value === undefined || value === null || value === '' ? fallback : String(value);
          }

          function methodId(method) {
            return typeof method === 'string' ? method : textOf(method.id || method.key || method.method, '');
          }

          function methodLabel(method) {
            return typeof method === 'string' ? method : textOf(method.label || method.name || method.title, methodId(method));
          }

          function taskBudgets(task) {
            if (Array.isArray(task && task.budgets)) return task.budgets;
            if (Array.isArray(task && task.budgetOptions)) return task.budgetOptions;
            if (challenge && Array.isArray(challenge.budgets)) return challenge.budgets;
            return [];
          }

          function metricValue(result, keys) {
            var i;
            for (i = 0; i < keys.length; i += 1) {
              if (result && typeof result[keys[i]] === 'number' && isFinite(result[keys[i]])) return result[keys[i]];
              if (result && result.metrics && typeof result.metrics[keys[i]] === 'number' && isFinite(result.metrics[keys[i]])) return result.metrics[keys[i]];
            }
            return null;
          }

          function formatMetric(key, value) {
            if (value === null) return '—';
            if (typeof P.formatMetric === 'function') return P.formatMetric(key, value);
            if (key === '表现' && typeof P.formatPercent === 'function') return P.formatPercent(value, 1, false);
            if (typeof P.formatCompact === 'function') return P.formatCompact(value, 1);
            return String(value);
          }

          function drawMetrics(container, result) {
            var rows = [
              { label: '表现', value: metricValue(result, ['accuracy', 'performance', 'score']) },
              { label: '参数', value: metricValue(result, ['parameters', 'parameterCount', 'params']) },
              { label: '更新', value: metricValue(result, ['updates', 'updateCount', 'steps']) },
              { label: '推理', value: metricValue(result, ['inferenceCost', 'inference', 'cost']) }
            ];
            var width = 400;
            var height = 150;
            var left = 62;
            var right = 64;
            var barWidth = width - left - right;
            var valid = rows.filter(function (d) { return d.value !== null; });
            var maximum = valid.length ? d3.max(valid, function (d) { return Math.abs(d.value); }) : 1;
            var scale = d3.scaleLinear().domain([0, maximum || 1]).range([0, barWidth]);
            var svg = d3.select(container).selectAll('svg').data([rows]).join('svg')
              .attr('viewBox', '0 0 ' + width + ' ' + height)
              .attr('role', 'img')
              .attr('aria-label', '表现、参数、更新与推理成本');
            var group = svg.selectAll('g.metric-row').data(rows).join('g')
              .attr('class', 'metric-row')
              .attr('transform', function (d, i) { return 'translate(0,' + (16 + i * 34) + ')'; });
            group.selectAll('text.metric-label').data(function (d) { return [d]; }).join('text')
              .attr('class', 'metric-label').attr('x', 10).attr('y', 14).text(function (d) { return d.label; });
            group.selectAll('rect.metric-track').data(function (d) { return [d]; }).join('rect')
              .attr('class', 'metric-track').attr('x', left).attr('y', 2).attr('width', barWidth).attr('height', 14).attr('rx', 7);
            group.selectAll('rect.metric-bar').data(function (d) { return [d]; }).join('rect')
              .attr('class', 'metric-bar').attr('x', left).attr('y', 2)
              .attr('width', function (d) { return d.value === null ? 0 : scale(Math.abs(d.value)); })
              .attr('height', 14).attr('rx', 7);
            group.selectAll('text.metric-value').data(function (d) { return [d]; }).join('text')
              .attr('class', 'metric-value').attr('x', width - 10).attr('y', 14).attr('text-anchor', 'end')
              .text(function (d) { return formatMetric(d.label, d.value); });
          }

          function eventSource(id) {
            var key = String(id || '').toLowerCase();
            var sourceId = sourceMap[key] || sourceMap[Object.keys(sourceMap).find(function (part) { return key.indexOf(part) >= 0; })];
            var event;
            if (!sourceId) return '历史来源已回亮';
            if (typeof P.eventLabel === 'function') return textOf(P.eventLabel(sourceId), '历史来源已回亮');
            event = typeof P.eventById === 'function' ? P.eventById(sourceId) : null;
            return event ? event.title + ' · ' + event.year : '历史来源已回亮';
          }

          function fitText(fit, comparison) {
            var value = fit && typeof fit === 'object' ? (fit.label || fit.verdict || fit.summary || fit.score) : fit;
            if (value !== undefined && value !== null) return '结构—成本匹配：' + value;
            if (comparison && comparison.summary) return textOf(comparison.summary, '方案已运行');
            return '方案已运行';
          }

          function run(index) {
            var pane = panes[index];
            var select = pane.querySelector('select');
            var range = pane.querySelector('input[type="range"]');
            var budgets = taskBudgets(tasks[index]);
            var method = select.value;
            var budget = budgets.length ? budgets[Number(range.value)] : null;
            var output = pane.querySelector('.fit-state');
            var result;
            var comparison;
            var fit;
            if (!method) {
              pane.dataset.done = 'false';
              output.textContent = '等待方案';
              pane.querySelector('.source-chip').textContent = '历史来源待回亮';
              drawMetrics(pane.querySelector('.metric-plot'), null);
              return;
            }
            if (typeof P.runMethodOnTask !== 'function' || typeof P.compareMethods !== 'function' || typeof P.methodFitScore !== 'function' || !tasks[index]) {
              output.textContent = '挑战数据接口未就绪';
              drawMetrics(pane.querySelector('.metric-plot'), null);
              return;
            }
            try {
              result = P.runMethodOnTask(tasks[index], method, budget);
              results[index] = result;
              comparison = P.compareMethods(results.filter(Boolean));
              fit = P.methodFitScore(tasks[index], method, result, budget);
              pane.dataset.done = 'true';
              output.textContent = fitText(fit, comparison);
              pane.querySelector('.source-chip').textContent = eventSource(method);
              drawMetrics(pane.querySelector('.metric-plot'), result);
            } catch (error) {
              pane.dataset.done = 'false';
              output.textContent = '此配置无法运行，请换一种组合';
              drawMetrics(pane.querySelector('.metric-plot'), null);
            }
          }

          panes.forEach(function (pane, index) {
            var task = tasks[index] || {};
            var select = pane.querySelector('select');
            var range = pane.querySelector('input[type="range"]');
            var budgetOutput = pane.querySelector('.budget-value');
            var budgets = taskBudgets(task);
            if (task.title || task.name) pane.querySelector('.task-name').textContent = textOf(task.title || task.name, '未知任务');
            if (task.description || task.brief || task.prompt) pane.querySelector('.task-brief').textContent = textOf(task.description || task.brief || task.prompt, '观察任务结构再选择方法。');
            methods.forEach(function (method) {
              var option = document.createElement('option');
              option.value = methodId(method);
              option.textContent = methodLabel(method);
              select.appendChild(option);
            });
            if (budgets.length) {
              range.disabled = false;
              range.min = 0;
              range.max = budgets.length - 1;
              range.step = 1;
              range.value = Math.floor((budgets.length - 1) / 2);
              budgetOutput.textContent = textOf(budgets[Number(range.value)].label || budgets[Number(range.value)].name || budgets[Number(range.value)].value || budgets[Number(range.value)], '—');
            }
            select.addEventListener('change', function () { run(index); });
            range.addEventListener('input', function () {
              var item = budgets[Number(range.value)];
              budgetOutput.textContent = textOf(item && (item.label || item.name || item.value || item), '—');
              run(index);
            });
            drawMetrics(pane.querySelector('.metric-plot'), null);
          });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', boot, { once: true });
        } else {
          boot();
        }
      }());
    </script>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
</body>
</html>
