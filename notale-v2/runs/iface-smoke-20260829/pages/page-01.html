<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>神经网络是怎么学会的</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root{
      --bg:#EAF0F5;
      --paper:#FFFFFF;
      --text:#17222D;
      --muted:#526170;
      --rule:#AAB8C5;
      --rule-strong:#728496;
      --forward:#1557B0;
      --forward-soft:#D9E8FA;
      --target:#B55A00;
      --error:#B4235A;
      --update:#087A68;
      --focus:#6B4CC2;
      --font-sans:"IBM Plex Sans","Noto Sans SC","Source Han Sans SC",sans-serif;
      --font-mono:"IBM Plex Mono","Noto Sans Mono CJK SC",monospace;
    }
    #stage{
      position:relative;
      display:flex;
      flex-direction:column;
      box-sizing:border-box;
      padding:28px 56px;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:var(--font-sans);
    }
    .topline{
      height:56px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--rule);
      color:var(--muted);
      font-size:15px;
      letter-spacing:.08em;
    }
    .series{font-weight:650;color:var(--text)}
    .scope{font-family:var(--font-mono);letter-spacing:.04em}
    .hero{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding:38px 72px 22px;
    }
    .kicker{
      margin:0 0 18px;
      color:var(--forward);
      font-size:17px;
      font-weight:700;
      letter-spacing:.12em;
    }
    h1{
      margin:0;
      max-width:1260px;
      font-size:72px;
      line-height:1.13;
      letter-spacing:-.035em;
      font-weight:720;
    }
    h1 .accent{color:var(--forward)}
    .lead{
      margin:26px 0 0;
      max-width:930px;
      font-size:22px;
      line-height:1.55;
      color:var(--muted);
    }
    .trace-field{
      height:244px;
      margin-top:42px;
      position:relative;
    }
    .trace-field svg{display:block;width:100%;height:100%;overflow:visible}
    .forward-path{fill:none;stroke:var(--forward);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .back-path{fill:none;stroke:var(--update);stroke-width:4;stroke-dasharray:12 10;stroke-linecap:round;stroke-linejoin:round}
    .node{fill:var(--paper);stroke:var(--rule-strong);stroke-width:2}
    .node.start{stroke:var(--forward);stroke-width:4}
    .node.loss{stroke:var(--error);stroke-width:4}
    .node.update{stroke:var(--update);stroke-width:4}
    .inner{fill:var(--forward-soft)}
    .svg-label{font-family:var(--font-sans);font-size:20px;font-weight:700;fill:var(--text)}
    .svg-note{font-family:var(--font-sans);font-size:15px;fill:var(--muted)}
    .trace-caption{
      position:absolute;
      right:20px;
      bottom:0;
      margin:0;
      font-size:15px;
      color:var(--muted);
    }
    .trace-caption .f{color:var(--forward);font-weight:700}
    .trace-caption .b{color:var(--update);font-weight:700}
  </style>
</head>
<body data-page="01" data-total="26">
  <div id="stage">
    <div class="topline" aria-label="课程信息">
      <span class="series">互动讲义 · 神经网络基础</span>
      <span class="scope">NEURON → NETWORK</span>
    </div>

    <main class="hero min0">
      <p class="kicker">从一个神经元到反向传播</p>
      <h1>神经网络是<br>怎么<span class="accent">学会</span>的？</h1>
      <p class="lead">把“学习”还原成一条可追踪的计算与更新闭环。</p>

      <div class="trace-field" role="img" aria-label="输入经神经元算出预测，预测与目标形成损失，损失的影响沿原路径反向传回并更新参数。">
        <svg viewBox="0 0 1344 244" aria-hidden="true">
          <defs>
            <marker id="arrow-f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
              <path d="M0 0L10 5L0 10Z" fill="#1557B0"/>
            </marker>
            <marker id="arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
              <path d="M0 0L10 5L0 10Z" fill="#087A68"/>
            </marker>
          </defs>

          <path class="forward-path" marker-end="url(#arrow-f)" d="M104 92 H1150"/>
          <path class="back-path" marker-end="url(#arrow-b)" d="M1150 154 C970 214 475 214 220 154"/>

          <g transform="translate(112 92)">
            <circle class="node start" r="38"/>
            <circle class="inner" r="15"/>
            <text class="svg-label" text-anchor="middle" x="0" y="72">一个神经元</text>
            <text class="svg-note" text-anchor="middle" x="0" y="96">接收输入与参数</text>
          </g>

          <g transform="translate(474 92)">
            <circle class="node" r="31"/>
            <path d="M-13 5L-3 15L16-14" fill="none" stroke="#1557B0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <text class="svg-label" text-anchor="middle" x="0" y="72">算出预测</text>
          </g>

          <g transform="translate(824 92)">
            <circle class="node loss" r="31"/>
            <path d="M-12-12L12 12M12-12L-12 12" stroke="#B4235A" stroke-width="4" stroke-linecap="round"/>
            <text class="svg-label" text-anchor="middle" x="0" y="72">量化误差</text>
          </g>

          <g transform="translate(1190 92)">
            <circle class="node update" r="38"/>
            <path d="M-15 0H15M0-15V15" stroke="#087A68" stroke-width="4" stroke-linecap="round"/>
            <text class="svg-label" text-anchor="middle" x="0" y="72">更新参数</text>
            <text class="svg-note" text-anchor="middle" x="0" y="96">影响沿链路传回</text>
          </g>
        </svg>
        <p class="trace-caption"><span class="f">实线</span> 前向计算　<span class="b">虚线</span> 反向更新</p>
      </div>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({index:1,total:26});</script>
</body>
</html>
