<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root{
      --bg:#EAF0F5; --paper:#FFFFFF; --text:#17222D; --muted:#526170;
      --rule:#AAB8C5; --rule-strong:#728496; --forward:#1557B0;
      --forward-soft:#D9E8FA; --target:#B55A00; --error:#B4235A;
      --update:#087A68; --focus:#6B4CC2;
      --font-sans:"IBM Plex Sans","Noto Sans SC","Source Han Sans SC",sans-serif;
      --font-mono:"IBM Plex Mono","Noto Sans Mono CJK SC",monospace;
      --fs-h1:42px; --fs-h2:26px; --fs-lead:22px; --fs-body:19px;
      --fs-sec:17px; --fs-label:15px; --fs-tick:13px;
    }
    *{box-sizing:border-box}
    #stage{padding:28px 56px;background:var(--bg);color:var(--text);font-family:var(--font-sans);display:flex;flex-direction:column;gap:22px;overflow:hidden}
    .head{height:112px;display:flex;flex-direction:column;justify-content:flex-start}
    .kicker{margin:0 0 7px;color:var(--forward);font-size:var(--fs-label);font-weight:700;letter-spacing:.12em}
    h1{margin:0;font-size:var(--fs-h1);line-height:1.12;letter-spacing:-.025em;font-weight:720}
    .lead{margin:10px 0 0;color:var(--muted);font-size:var(--fs-lead);line-height:1.4}
    .focus{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
    .equation{height:62px;display:flex;align-items:center;justify-content:center;gap:18px;font-family:var(--font-mono);font-size:24px;color:var(--muted)}
    .equation strong{font-size:30px;color:var(--text);font-weight:650}
    .eq-weight{color:var(--forward);font-weight:700}
    .eq-bias{color:var(--target);font-weight:700}
    .brace{height:1px;width:38px;background:var(--rule)}
    .panel{flex:1;min-height:0;background:var(--paper);border:1px solid var(--rule);border-radius:18px;overflow:hidden;box-shadow:0 8px 22px rgba(23,34,45,.06)}
    .diagram{width:100%;height:100%;display:block}
    .diagram text{font-family:var(--font-sans);fill:var(--text)}
    .diagram .mono{font-family:var(--font-mono)}
    .diagram .muted{fill:var(--muted)}
    .diagram .label{font-size:15px;font-weight:650;letter-spacing:.03em}
    .diagram .body{font-size:18px}
    .diagram .small{font-size:15px}
    .diagram .big{font-size:25px;font-weight:700}
    .diagram .weight{fill:var(--forward)}
    .diagram .bias{fill:var(--target)}
    .diagram .rule{stroke:var(--rule);stroke-width:1.5}
    .diagram .strong{stroke:var(--rule-strong);stroke-width:2}
    .diagram .flow{stroke:var(--forward);stroke-width:3;fill:none}
    .diagram .flow-neg{stroke:var(--forward);stroke-width:2;fill:none}
    .diagram .biasline{stroke:var(--target);stroke-width:3;fill:none}
    .diagram .soft{fill:var(--forward-soft)}
    .diagram .paper{fill:var(--paper)}
    .diagram .neutral{fill:#F4F7F9}
    .diagram .barpos{fill:var(--forward)}
    .diagram .barneg{fill:#6F91BD}
    .diagram .sum{fill:#F8FAFC;stroke:var(--rule-strong);stroke-width:2}
    .takeaway{height:58px;display:flex;align-items:center;justify-content:center;gap:34px;font-size:var(--fs-body);line-height:1.35}
    .takeaway span{display:flex;align-items:center;gap:10px}
    .key{width:13px;height:13px;display:inline-block}
    .key.w{background:var(--forward)}
    .key.b{background:var(--target)}
  </style>
</head>
<body data-page="04" data-total="26">
  <div id="stage">
    <header class="head">
      <p class="kicker">第一章 · 神经元的参数分工</p>
      <h1>权重管每条输入，偏置移动整道门槛</h1>
      <p class="lead">先看各输入怎样推高或压低加权和，再看同一笔偏置怎样整体平移结果。</p>
    </header>

    <main class="focus min0">
      <div class="equation" aria-label="神经元加权和公式">
        <strong>z</strong><span>=</span><span>Σ <span class="eq-weight">wᵢxᵢ</span></span><span class="brace"></span><span>+</span><span class="eq-bias">b</span>
      </div>

      <section class="panel min0" aria-label="权重与偏置作用示意图">
        <svg class="diagram" viewBox="0 0 1486 544" role="img" aria-labelledby="diagTitle diagDesc">
          <title id="diagTitle">三个输入的加权贡献汇入加权和，偏置再整体平移结果</title>
          <desc id="diagDesc">正权重保持输入方向，负权重翻转输入方向，权重绝对值决定影响强弱。三个贡献相加得到一点八，偏置负一点二把结果整体移到零点六。</desc>
          <defs>
            <marker id="arrowF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1557B0"/></marker>
            <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B55A00"/></marker>
          </defs>

          <text x="54" y="43" class="label muted">输入</text>
          <text x="202" y="43" class="label weight">逐条乘权重</text>
          <text x="512" y="43" class="label muted">对 z 的贡献</text>
          <text x="940" y="43" class="label muted">汇总</text>
          <line x1="54" y1="61" x2="1040" y2="61" class="rule"/>

          <g transform="translate(0,0)">
            <text x="54" y="113" class="big mono">x₁ = +2</text>
            <rect x="196" y="80" width="162" height="48" rx="8" class="soft"/>
            <text x="219" y="112" class="big mono weight">w₁ = +1.5</text>
            <path d="M374 104H488" class="flow" marker-end="url(#arrowF)"/>
            <line x1="650" y1="81" x2="650" y2="127" class="strong"/>
            <rect x="650" y="91" width="270" height="27" rx="4" class="barpos"/>
            <text x="936" y="112" class="big mono weight">+3.0</text>
          </g>

          <g transform="translate(0,100)">
            <text x="54" y="113" class="big mono">x₂ = +1</text>
            <rect x="196" y="80" width="162" height="48" rx="8" class="soft"/>
            <text x="219" y="112" class="big mono weight">w₂ = −0.8</text>
            <path d="M374 104H488" class="flow-neg" marker-end="url(#arrowF)"/>
            <line x1="650" y1="81" x2="650" y2="127" class="strong"/>
            <rect x="578" y="91" width="72" height="27" rx="4" class="barneg"/>
            <text x="494" y="112" class="big mono weight">−0.8</text>
          </g>

          <g transform="translate(0,200)">
            <text x="54" y="113" class="big mono">x₃ = −1</text>
            <rect x="196" y="80" width="162" height="48" rx="8" class="soft"/>
            <text x="219" y="112" class="big mono weight">w₃ = +0.4</text>
            <path d="M374 104H488" class="flow-neg" marker-end="url(#arrowF)"/>
            <line x1="650" y1="81" x2="650" y2="127" class="strong"/>
            <rect x="614" y="91" width="36" height="27" rx="4" class="barneg"/>
            <text x="530" y="112" class="big mono weight">−0.4</text>
          </g>

          <path d="M1015 102 C1075 102 1061 180 1118 180 M1015 202 H1118 M1015 302 C1075 302 1061 224 1118 224" class="flow" marker-end="url(#arrowF)"/>
          <circle cx="1170" cy="202" r="57" class="sum"/>
          <text x="1170" y="193" text-anchor="middle" class="small muted">贡献之和</text>
          <text x="1170" y="226" text-anchor="middle" class="big mono">+1.8</text>

          <line x1="54" y1="363" x2="1432" y2="363" class="rule"/>
          <text x="54" y="403" class="label bias">偏置不挑某条输入，而是平移总结果</text>

          <text x="54" y="464" class="body">未加偏置</text>
          <line x1="200" y1="456" x2="1335" y2="456" class="strong"/>
          <line x1="742" y1="443" x2="742" y2="470" class="strong"/>
          <text x="742" y="493" text-anchor="middle" class="small mono muted">判断门槛 0</text>
          <circle cx="1067" cy="456" r="9" fill="#1557B0"/>
          <text x="1067" y="430" text-anchor="middle" class="big mono weight">+1.8</text>

          <path d="M1067 510H851" class="biasline" marker-end="url(#arrowB)"/>
          <text x="959" y="536" text-anchor="middle" class="big mono bias">b = −1.2</text>
          <circle cx="851" cy="456" r="11" fill="#B55A00"/>
          <text x="851" y="430" text-anchor="middle" class="big mono bias">z = +0.6</text>
          <text x="1372" y="463" class="small mono muted">更易越过门槛</text>
        </svg>
      </section>

      <div class="takeaway" aria-label="结论">
        <span><i class="key w"></i><strong>权重：</strong>符号定方向，绝对值定强弱</span>
        <span><i class="key b"></i><strong>偏置：</strong>给所有输入组合加上同一平移量</span>
      </div>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({index:4,total:26});</script>
</body>
</html>
