<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{padding:28px 56px;background:var(--bg);color:var(--text);font-family:var(--font-sans);display:flex;flex-direction:column;gap:22px;overflow:hidden}
.head{flex:0 0 auto;max-width:1180px}.kicker{font-size:var(--fs-label);font-weight:700;letter-spacing:.12em;color:var(--forward);margin-bottom:8px}.head h1{font-size:var(--fs-h1);line-height:1.12;margin:0 0 8px;font-weight:720;letter-spacing:-.02em}.lead{font-size:var(--fs-lead);line-height:1.4;color:var(--muted);margin:0}
#neuronLab{flex:1;min-height:0;display:grid;grid-template-columns:430px minmax(0,1fr);gap:22px;border-top:1px solid var(--rule);padding-top:20px}
#neuronLab .controls{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;min-height:0}
#neuronLab .controls-head{display:flex;align-items:baseline;justify-content:space-between;gap:18px;margin-bottom:10px}#neuronLab h2{font-size:var(--fs-h2);margin:0;line-height:1.2}#neuronLab .hint{font-size:var(--fs-label);color:var(--muted);margin:0}
#neuronLab .group-title{font-size:var(--fs-label);font-weight:700;color:var(--muted);letter-spacing:.06em;margin:14px 0 4px;padding-top:12px;border-top:1px solid #dce3e9}
#neuronLab .ctl{display:grid;grid-template-columns:88px minmax(0,1fr) 64px;gap:12px;align-items:center;margin:7px 0}#neuronLab .ctl label{font-size:var(--fs-sec);font-weight:650}#neuronLab .ctl output{font-family:var(--font-mono);font-size:var(--fs-sec);font-variant-numeric:tabular-nums;text-align:right;color:var(--forward)}
#neuronLab input[type=range]{width:100%;accent-color:var(--forward)}
#neuronLab .bias input[type=range]{accent-color:var(--target)}#neuronLab .bias output{color:var(--target)}
#neuronLab .actions{margin-top:auto;padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.btn{font:650 var(--fs-label) var(--font-sans);border:1px solid var(--rule-strong);border-radius:7px;padding:9px 15px;background:var(--paper);color:var(--text);cursor:pointer}.btn:hover{background:#f2f6f9}.btn:active{transform:translateY(1px)}.btn:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#neuronLab .stage{background:var(--paper);border:1px solid var(--rule);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#neuronLab .formula{height:84px;flex:0 0 84px;display:flex;align-items:center;justify-content:center;gap:10px;border-bottom:1px solid var(--rule);font-family:var(--font-mono);font-size:var(--fs-lead);font-variant-numeric:tabular-nums;white-space:nowrap}
#neuronLab .term{padding:7px 10px;border-radius:6px;background:var(--forward-soft);color:var(--forward);font-weight:700}#neuronLab .term.bias-term{background:#f8eadc;color:var(--target)}#neuronLab .eq{color:var(--muted)}#neuronLab .z-term{font-weight:800;color:var(--text)}
#neuronLab .diagram{position:relative;flex:1;min-height:0}#neuronLab svg{display:block;width:100%;height:100%}
#neuronLab .axis{stroke:var(--rule);stroke-width:1.5}.guide{stroke:#dce3e9;stroke-width:1}.ticktext{font:13px var(--font-mono);fill:var(--muted)}.label{font:600 17px var(--font-sans);fill:var(--text)}.small-label{font:15px var(--font-sans);fill:var(--muted)}
#neuronLab .forward-line{stroke:var(--forward);stroke-width:4;fill:none}.sum-line{stroke:var(--text);stroke-width:3;fill:none}.bias-line{stroke:var(--target);stroke-width:4;fill:none}.node{fill:var(--paper);stroke:var(--rule-strong);stroke-width:2}.node.active{stroke:var(--forward);stroke-width:4}.product{fill:var(--forward-soft);stroke:var(--forward);stroke-width:2}.bias-node{fill:#fff5e9;stroke:var(--target);stroke-width:2}.readout{font:700 19px var(--font-mono);fill:var(--text)}.fwd-text{fill:var(--forward)}.target-text{fill:var(--target)}
#neuronLab .accum{flex:0 0 112px;border-top:1px solid var(--rule);padding:14px 24px 12px}.accum-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}.accum-head strong{font-size:var(--fs-sec)}.accum-head span{font:var(--fs-label) var(--font-sans);color:var(--muted)}.steps{height:42px;display:flex;align-items:center}.step{height:34px;min-width:36px;display:flex;align-items:center;justify-content:center;font:700 var(--fs-label) var(--font-mono);color:#fff;padding:0 10px}.s1{background:var(--forward)}.s2{background:#4e7fc0}.sb{background:var(--target)}.zero-step{height:34px;width:2px;background:var(--text);position:relative}.zero-step:after{content:'0';position:absolute;top:36px;left:-4px;font:13px var(--font-mono);color:var(--muted)}
#neuronLab .status{position:absolute;right:22px;bottom:18px;font:600 var(--fs-label) var(--font-sans);color:var(--update);background:rgba(255,255,255,.9);padding:5px 8px}
@media (prefers-reduced-motion:no-preference){#neuronLab .product,#neuronLab .node.active,#neuronLab .step{transition:width .18s ease,transform .18s ease,fill .18s ease}}
</style>
</head>
<body data-page="05" data-total="26">
<div id="stage">
  <header class="head">
    <div class="kicker">第一章 · 前向计算实验</div>
    <h1>每一项先贡献，再汇成神经元的输出</h1>
    <p class="lead">改变输入、权重或偏置；沿蓝色路径核对两次乘法，再看偏置怎样把总和整体推移。</p>
  </header>
  <main id="neuronLab" aria-label="加权和交互实验">
    <section class="controls min0" aria-labelledby="controlTitle">
      <div class="controls-head"><h2 id="controlTitle">调节五个量</h2><p class="hint">方向键可微调</p></div>
      <div class="group-title">输入与对应权重</div>
      <div class="ctl"><label for="x1">输入 x₁</label><input id="x1" data-key="x1" type="range" min="-2" max="2" step="0.1" value="1.2"><output id="x1v">1.2</output></div>
      <div class="ctl"><label for="w1">权重 w₁</label><input id="w1" data-key="w1" type="range" min="-2" max="2" step="0.1" value="1.5"><output id="w1v">1.5</output></div>
      <div class="ctl"><label for="x2">输入 x₂</label><input id="x2" data-key="x2" type="range" min="-2" max="2" step="0.1" value="-0.8"><output id="x2v">−0.8</output></div>
      <div class="ctl"><label for="w2">权重 w₂</label><input id="w2" data-key="w2" type="range" min="-2" max="2" step="0.1" value="0.7"><output id="w2v">0.7</output></div>
      <div class="group-title">整体平移</div>
      <div class="ctl bias"><label for="b">偏置 b</label><input id="b" data-key="b" type="range" min="-2" max="2" step="0.1" value="-0.4"><output id="bv">−0.4</output></div>
      <div class="actions"><span class="hint">试试把 w₂ 拖到负数</span><button class="btn" id="reset" type="button">恢复初始值</button></div>
    </section>
    <section class="stage min0" aria-label="加权和形成过程">
      <div class="formula" aria-live="off"><span class="term" id="t1">1.2 × 1.5</span><span>+</span><span class="term" id="t2">−0.8 × 0.7</span><span>+</span><span class="term bias-term" id="tb">−0.4</span><span class="eq">=</span><span class="z-term" id="zf">z = 0.84</span></div>
      <div class="diagram min0">
        <svg viewBox="0 0 960 390" role="img" aria-labelledby="svgTitle svgDesc">
          <title id="svgTitle">两个输入的加权贡献与偏置汇入神经元</title><desc id="svgDesc">两次输入乘权重得到贡献，贡献与偏置相加形成加权和，再转换为零到一之间的输出。</desc>
          <defs><marker id="arrow05" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1557B0"/></marker><marker id="arrowInk05" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17222D"/></marker><marker id="arrowTarget05" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#B55A00"/></marker></defs>
          <g class="construction"><line x1="70" y1="118" x2="855" y2="118" class="guide"/><line x1="70" y1="272" x2="855" y2="272" class="guide"/></g>
          <g><circle cx="100" cy="118" r="34" class="node"/><text x="100" y="112" text-anchor="middle" class="label">x₁</text><text id="sx1" x="100" y="137" text-anchor="middle" class="readout fwd-text">1.2</text><circle cx="100" cy="272" r="34" class="node"/><text x="100" y="266" text-anchor="middle" class="label">x₂</text><text id="sx2" x="100" y="291" text-anchor="middle" class="readout fwd-text">−0.8</text></g>
          <g><path d="M136 118 H250" class="forward-line" marker-end="url(#arrow05)"/><text id="sw1" x="194" y="99" text-anchor="middle" class="small-label">× w₁ 1.5</text><path d="M136 272 H250" class="forward-line" marker-end="url(#arrow05)"/><text id="sw2" x="194" y="253" text-anchor="middle" class="small-label">× w₂ 0.7</text></g>
          <g><rect x="270" y="86" width="150" height="64" rx="8" class="product"/><text x="345" y="110" text-anchor="middle" class="small-label">贡献 x₁w₁</text><text id="sc1" x="345" y="137" text-anchor="middle" class="readout fwd-text">1.80</text><rect x="270" y="240" width="150" height="64" rx="8" class="product"/><text x="345" y="264" text-anchor="middle" class="small-label">贡献 x₂w₂</text><text id="sc2" x="345" y="291" text-anchor="middle" class="readout fwd-text">−0.56</text></g>
          <g><path d="M420 118 C490 118 495 171 540 180" class="sum-line" marker-end="url(#arrowInk05)"/><path d="M420 272 C490 272 495 219 540 210" class="sum-line" marker-end="url(#arrowInk05)"/><circle cx="582" cy="195" r="45" class="node active"/><text x="582" y="188" text-anchor="middle" class="label">加权和 z</text><text id="sz" x="582" y="216" text-anchor="middle" class="readout">0.84</text></g>
          <g><circle cx="582" cy="330" r="29" class="bias-node"/><text id="sbt" x="582" y="337" text-anchor="middle" class="readout target-text">b −0.4</text><path d="M582 300 V245" class="bias-line" marker-end="url(#arrowTarget05)"/></g>
          <g><path d="M627 195 H753" class="forward-line" marker-end="url(#arrow05)"/><text x="690" y="176" text-anchor="middle" class="small-label">压到 0–1</text><circle cx="814" cy="195" r="52" class="node active"/><text x="814" y="185" text-anchor="middle" class="label">输出 ŷ</text><text id="sy" x="814" y="218" text-anchor="middle" class="readout fwd-text">0.698</text></g>
        </svg>
        <div class="status" id="status" aria-live="polite">当前两项一正一负，第二项抵消部分第一项。</div>
      </div>
      <div class="accum">
        <div class="accum-head"><strong>总和逐项累计</strong><span id="trailText">0 → 1.80 → 1.24 → 0.84</span></div>
        <div class="steps" id="steps" aria-hidden="true"><div class="zero-step"></div><div class="step s1" id="bar1">+1.80</div><div class="step s2" id="bar2">−0.56</div><div class="step sb" id="barb">−0.40</div></div>
      </div>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script>
Deck.init({index:5,total:26});
(function(){
  const root=document.getElementById('neuronLab');
  const initial={x1:1.2,w1:1.5,x2:-0.8,w2:0.7,b:-0.4};
  let state={...initial}, destroyed=false;
  const q=s=>root.querySelector(s), qa=s=>[...root.querySelectorAll(s)];
  const els={x1:q('#x1'),w1:q('#w1'),x2:q('#x2'),w2:q('#w2'),b:q('#b')};
  const fmt=(v,d=1)=>{const n=Math.abs(v)<.0001?0:v;return (n<0?'−':'')+Math.abs(n).toFixed(d)};
  function render(announce){
    if(destroyed)return;
    const c1=state.x1*state.w1,c2=state.x2*state.w2,z=c1+c2+state.b,y=1/(1+Math.exp(-z));
    Object.keys(els).forEach(k=>{els[k].value=state[k];q('#'+k+'v').textContent=fmt(state[k])});
    q('#t1').textContent=`${fmt(state.x1)} × ${fmt(state.w1)}`;q('#t2').textContent=`${fmt(state.x2)} × ${fmt(state.w2)}`;q('#tb').textContent=fmt(state.b);q('#zf').textContent=`z = ${fmt(z,2)}`;
    q('#sx1').textContent=fmt(state.x1);q('#sx2').textContent=fmt(state.x2);q('#sw1').textContent=`× w₁ ${fmt(state.w1)}`;q('#sw2').textContent=`× w₂ ${fmt(state.w2)}`;q('#sc1').textContent=fmt(c1,2);q('#sc2').textContent=fmt(c2,2);q('#sbt').textContent=`b ${fmt(state.b)}`;q('#sz').textContent=fmt(z,2);q('#sy').textContent=y.toFixed(3);
    const p1=c1,p2=c1+c2;q('#trailText').textContent=`0 → ${fmt(p1,2)} → ${fmt(p2,2)} → ${fmt(z,2)}`;
    [['#bar1',c1],['#bar2',c2],['#barb',state.b]].forEach(([id,v])=>{const e=q(id);e.textContent=(v>=0?'+':'−')+Math.abs(v).toFixed(2);e.style.width=(44+Math.min(150,Math.abs(v)*42))+'px';});
    let msg='两项贡献方向相同，总和继续增大。';if(c1*c2<0)msg='两项一正一负，后一项抵消前一项。';if(Math.abs(c1)<.005||Math.abs(c2)<.005)msg='有一项贡献为 0：输入或权重为 0。';if(Math.abs(z)<.05)msg='正负贡献几乎抵消，加权和接近 0。';q('#status').textContent=msg;
    if(announce)q('#status').setAttribute('aria-label',`加权和 ${fmt(z,2)}，输出 ${y.toFixed(3)}。${msg}`);
  }
  function onInput(e){const k=e.currentTarget.dataset.key;state={...state,[k]:Number(e.currentTarget.value)};render(false)}
  function onChange(){render(true)}
  Object.values(els).forEach(el=>{el.addEventListener('input',onInput);el.addEventListener('change',onChange)});
  q('#reset').addEventListener('click',()=>{state={...initial};render(true)});
  render(false);
  window.addEventListener('pagehide',()=>{destroyed=true},{once:true});
})();
</script>
</body>
</html>
