<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一个神经元先汇合输入，再给出 0–1 的预测</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{box-sizing:border-box;display:flex;flex-direction:column;gap:24px;overflow:hidden}
  .p04-head{flex:0 0 118px;display:flex;flex-direction:column;justify-content:flex-start;gap:8px;border-bottom:1px solid var(--rule-soft);padding-bottom:16px}
  .p04-head .kicker{margin:0;color:var(--muted);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;letter-spacing:.12em}
  .p04-head h1{margin:0;max-width:1320px;color:var(--text);font:700 var(--fs-h1)/1.12 var(--font-sans)}
  .p04-widget{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) 144px;gap:24px}
  .p04-widget *{box-sizing:border-box}
  .p04-model{position:relative;min-height:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);overflow:hidden}
  .p04-model svg{display:block;width:100%;height:100%}
  .p04-model text{font-family:var(--font-sans);fill:var(--text)}
  .p04-model .label{font-size:18px;font-weight:700}
  .p04-model .sub{font-size:15px;fill:var(--muted)}
  .p04-model .value{font-family:var(--font-mono);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
  .p04-model .out-value{font-family:var(--font-mono);font-size:48px;font-weight:700;fill:var(--prediction);font-variant-numeric:tabular-nums}
  .p04-model .structure{stroke:var(--rule);stroke-width:1;fill:none;vector-effect:non-scaling-stroke}
  .p04-model .forward-line{stroke:var(--prediction);stroke-width:2;fill:none;vector-effect:non-scaling-stroke;marker-end:url(#p04-arrow)}
  .p04-model .input-line{stroke:var(--text);stroke-width:2;fill:none;vector-effect:non-scaling-stroke;marker-end:url(#p04-arrow-ink);transition:stroke-width 120ms linear,stroke 120ms linear}
  .p04-model .input-line.active{stroke:var(--attention);stroke-width:3}
  .p04-model .signal{stroke:var(--attention);stroke-width:3;fill:none;vector-effect:non-scaling-stroke;stroke-dasharray:1 500;opacity:0}
  .p04-model .signal.run-in{animation:p04In 240ms linear both}
  .p04-model .signal.run-out{animation:p04Out 240ms linear 120ms both}
  .p04-model .node{fill:var(--bg);stroke:var(--text);stroke-width:2;vector-effect:non-scaling-stroke}
  .p04-model .readbox{fill:var(--surface);stroke:var(--rule);stroke-width:1;vector-effect:non-scaling-stroke}
  .p04-model .readbox.output{fill:var(--bg);stroke:var(--prediction);stroke-width:2}
  .p04-model .junction{fill:var(--bg);stroke:var(--text);stroke-width:2;vector-effect:non-scaling-stroke}
  .p04-model .distance{stroke:var(--rule-soft);stroke-width:8;vector-effect:non-scaling-stroke}
  .p04-model .distance-fill{stroke:var(--attention);stroke-width:8;vector-effect:non-scaling-stroke;transition:x2 140ms linear}
  .p04-model .read-flash{animation:p04Read 240ms ease-out}
  @keyframes p04In{0%{opacity:1;stroke-dasharray:0 500}100%{opacity:1;stroke-dasharray:500 0}}
  @keyframes p04Out{0%{opacity:1;stroke-dasharray:0 500}100%{opacity:0;stroke-dasharray:500 0}}
  @keyframes p04Read{0%{fill:var(--attention)}100%{fill:currentColor}}
  .p04-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 176px;gap:40px;align-items:start}
  .p04-ctl{min-width:0;display:grid;grid-template-columns:136px minmax(0,1fr) 72px;grid-template-rows:30px 38px 22px;column-gap:16px;align-items:center}
  .p04-ctl.active{outline:3px solid var(--attention);outline-offset:8px}
  .p04-ctl label{font-size:var(--fs-body);font-weight:700;grid-column:1;grid-row:1/3;align-self:center}
  .p04-ctl .ctl-value{grid-column:3;grid-row:1/3;text-align:right;font:700 21px/1 var(--font-mono);font-variant-numeric:tabular-nums}
  .p04-ctl input[type=range]{grid-column:2;grid-row:1/3;width:100%;accent-color:var(--attention);cursor:ew-resize}
  .p04-ctl .range-ends{grid-column:2;grid-row:3;display:flex;justify-content:space-between;color:var(--muted);font:12px/1 var(--font-mono)}
  .p04-ctl .unit{grid-column:3;grid-row:3;text-align:right;color:var(--muted);font-size:var(--fs-label)}
  .p04-reset{align-self:center;justify-self:stretch;min-height:48px}
  .p04-foot{flex:0 0 84px;display:grid;grid-template-columns:minmax(0,1.28fr) minmax(0,1fr);gap:64px;align-items:start}
  .p04-claim{margin:0;font:400 var(--fs-lead)/1.35 var(--font-serif)}
  .p04-next{margin:0;padding-top:8px;border-top:2px solid var(--text);font-size:var(--fs-sec);line-height:1.45;color:var(--muted)}
  .p04-next strong{display:block;margin-bottom:4px;color:var(--text);font-size:var(--fs-label);letter-spacing:.08em}
  @media (prefers-reduced-motion:reduce){.p04-model .signal.run-in,.p04-model .signal.run-out,.p04-model .read-flash{animation:none}.p04-model .distance-fill{transition:none}}
</style>
</head>
<body data-page="04" data-total="21">
<div id="stage">
  <header class="p04-head">
    <p class="kicker">ACT II · FIRST RUN</p>
    <h1>一个神经元先汇合输入，再给出 0–1 的预测</h1>
  </header>

  <main class="p04-widget min0 k-process canvas-full" data-neuron-widget>
    <section class="p04-model min0" aria-label="输入汇入单个神经元并产生预测的流程图">
      <svg viewBox="0 0 1488 430" role="img" aria-labelledby="p04-svg-title p04-svg-desc">
        <title id="p04-svg-title">单个神经元的前向过程</title>
        <desc id="p04-svg-desc">日照时数与寒冷夜晚两项输入从左侧汇入一个神经元，形成内部得分，再产生零到一之间的开花预测。</desc>
        <defs>
          <marker id="p04-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2457A6"/></marker>
          <marker id="p04-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E252B"/></marker>
        </defs>

        <text x="24" y="34" class="sub">输入</text>
        <text x="560" y="34" class="sub">汇合</text>
        <text x="871" y="34" class="sub">内部得分</text>
        <text x="1236" y="34" class="sub">0–1 输出</text>
        <line x1="24" y1="50" x2="1456" y2="50" class="structure"/>

        <g aria-label="日照时数输入">
          <text x="24" y="132" class="label">日照时数</text>
          <text x="24" y="168" class="value" data-svg-sun>4.0</text>
          <text x="105" y="168" class="sub">小时</text>
          <line x1="24" y1="198" x2="384" y2="198" class="distance"/>
          <line x1="24" y1="198" x2="204" y2="198" class="distance-fill" data-sun-fill/>
          <line x1="402" y1="170" x2="554" y2="213" class="input-line" data-sun-path/>
        </g>
        <g aria-label="寒冷夜晚输入">
          <text x="24" y="294" class="label">寒冷夜晚</text>
          <text x="24" y="330" class="value" data-svg-cold>1.0</text>
          <text x="105" y="330" class="sub">晚</text>
          <line x1="24" y1="360" x2="384" y2="360" class="distance"/>
          <line x1="24" y1="360" x2="114" y2="360" class="distance-fill" data-cold-fill/>
          <line x1="402" y1="332" x2="554" y2="257" class="input-line" data-cold-path/>
        </g>

        <path class="node neuron" d="M560 160 Q560 146 574 146 H716 Q730 146 738 158 L782 224 Q788 235 782 246 L738 312 Q730 324 716 324 H574 Q560 324 560 310 Z"/>
        <circle cx="560" cy="235" r="8" class="junction"/>
        <text x="671" y="224" text-anchor="middle" class="label">神经元</text>
        <text x="671" y="258" text-anchor="middle" class="sub">汇合两项输入</text>

        <line x1="788" y1="235" x2="870" y2="235" class="forward-line axis forward"/>
        <line x1="788" y1="235" x2="870" y2="235" class="signal" data-signal-in/>
        <rect x="884" y="154" width="250" height="162" class="readbox"/>
        <text x="1009" y="200" text-anchor="middle" class="sub">内部得分 z</text>
        <text x="1009" y="264" text-anchor="middle" class="value" data-score>1.000</text>

        <line x1="1134" y1="235" x2="1222" y2="235" class="forward-line axis forward"/>
        <line x1="1134" y1="235" x2="1222" y2="235" class="signal" data-signal-out/>
        <rect x="1236" y="130" width="228" height="210" class="readbox output"/>
        <text x="1350" y="180" text-anchor="middle" class="label">开花预测 ŷ</text>
        <text x="1350" y="251" text-anchor="middle" class="out-value" data-output>0.731</text>
        <text x="1350" y="294" text-anchor="middle" class="sub" data-frequency aria-live="polite">约 100 次相似情况中有 73 次</text>
      </svg>
    </section>

    <section class="p04-controls" aria-label="输入控制">
      <div class="p04-ctl" data-ctl="sun">
        <label for="p04-sun">日照时数</label>
        <input id="p04-sun" type="range" min="0" max="8" step="0.1" value="4">
        <output class="ctl-value" for="p04-sun" data-sun-value>4.0</output>
        <span class="range-ends"><span>0</span><span>4</span><span>8</span></span><span class="unit">小时</span>
      </div>
      <div class="p04-ctl" data-ctl="cold">
        <label for="p04-cold">寒冷夜晚</label>
        <input id="p04-cold" type="range" min="0" max="4" step="0.1" value="1">
        <output class="ctl-value" for="p04-cold" data-cold-value>1.0</output>
        <span class="range-ends"><span>0</span><span>2</span><span>4</span></span><span class="unit">晚</span>
      </div>
      <button type="button" class="btn p04-reset" data-reset>恢复初始输入</button>
    </section>
  </main>

  <footer class="p04-foot">
    <p class="p04-claim">输入一变，内部得分随之改变；神经元把这个得分变成可读的预测。</p>
    <p class="p04-next"><strong>下一问</strong>两项输入为什么会把内部得分推向不同方向，而且力度不同？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  const root = document.querySelector('[data-neuron-widget]');
  if (!root || !window.Lec || !Lec.P) return;
  const q = sel => root.querySelector(sel);
  const view = {
    sun:q('#p04-sun'), cold:q('#p04-cold'), reset:q('[data-reset]'),
    sunCtl:q('[data-ctl="sun"]'), coldCtl:q('[data-ctl="cold"]'),
    sunValue:q('[data-sun-value]'), coldValue:q('[data-cold-value]'),
    svgSun:q('[data-svg-sun]'), svgCold:q('[data-svg-cold]'), sunFill:q('[data-sun-fill]'), coldFill:q('[data-cold-fill]'),
    sunPath:q('[data-sun-path]'), coldPath:q('[data-cold-path]'), score:q('[data-score]'), output:q('[data-output]'), frequency:q('[data-frequency]'),
    signalIn:q('[data-signal-in]'), signalOut:q('[data-signal-out]')
  };
  const initial = () => ({sun:4, cold:1, active:null});
  let state = initial();
  let destroyed = false;
  let timers = [];

  function clearMotion(){
    timers.forEach(clearTimeout); timers=[];
    [view.signalIn,view.signalOut].forEach(el=>{el.classList.remove('run-in','run-out'); void el.getBoundingClientRect();});
    [view.score,view.output].forEach(el=>el.classList.remove('read-flash'));
  }
  function transition(s,a){
    if(a.type==='set') return {...s,[a.key]:Math.max(a.key==='sun'?0:0,Math.min(a.key==='sun'?8:4,Math.round(a.value*10)/10)),active:a.key};
    if(a.type==='commit') return {...s,active:null};
    if(a.type==='reset') return initial();
    return s;
  }
  function compute(){ return Lec.P.neuronForward([state.sun,state.cold],[0.8,-1.2],-1.0,'sigmoid'); }
  function render(animate=false){
    const result=compute();
    const sun=state.sun.toFixed(1), cold=state.cold.toFixed(1);
    view.sun.value=state.sun; view.cold.value=state.cold;
    view.sunValue.textContent=sun; view.coldValue.textContent=cold; view.svgSun.textContent=sun; view.svgCold.textContent=cold;
    view.sunFill.setAttribute('x2',24+360*(state.sun/8));
    view.coldFill.setAttribute('x2',24+360*(state.cold/4));
    view.score.textContent=result.preActivation.toFixed(3);
    view.output.textContent=result.output.toFixed(3);
    view.frequency.textContent=`约 100 次相似情况中有 ${Math.round(result.output*100)} 次`;
    view.sunCtl.classList.toggle('active',state.active==='sun'); view.coldCtl.classList.toggle('active',state.active==='cold');
    view.sunPath.classList.toggle('active',state.active==='sun'); view.coldPath.classList.toggle('active',state.active==='cold');
    if(animate && !Deck.reduced()){
      clearMotion();
      view.signalIn.classList.add('run-in');
      timers.push(setTimeout(()=>{view.signalOut.classList.add('run-out');view.score.classList.add('read-flash');},120));
      timers.push(setTimeout(()=>view.output.classList.add('read-flash'),240));
    }
  }
  function dispatch(action,animate=false,announce=false){
    if(destroyed)return; state=transition(state,action); render(animate);
    if(announce){const r=compute();view.frequency.setAttribute('aria-label',`日照 ${state.sun.toFixed(1)} 小时，寒冷夜晚 ${state.cold.toFixed(1)} 晚，内部得分 ${r.preActivation.toFixed(3)}，开花预测 ${r.output.toFixed(3)}`);}
  }
  function onInput(key,e){dispatch({type:'set',key,value:Number(e.currentTarget.value)},true,false)}
  function onChange(key,e){dispatch({type:'set',key,value:Number(e.currentTarget.value)},false,true);dispatch({type:'commit'},false,false)}
  const sunInput=e=>onInput('sun',e), coldInput=e=>onInput('cold',e), sunChange=e=>onChange('sun',e), coldChange=e=>onChange('cold',e);
  const sunFocus=()=>dispatch({type:'set',key:'sun',value:state.sun}), coldFocus=()=>dispatch({type:'set',key:'cold',value:state.cold});
  const blur=()=>dispatch({type:'commit'});
  const reset=()=>{clearMotion();dispatch({type:'reset'},false,true)};
  view.sun.addEventListener('input',sunInput);view.cold.addEventListener('input',coldInput);
  view.sun.addEventListener('change',sunChange);view.cold.addEventListener('change',coldChange);
  view.sun.addEventListener('focus',sunFocus);view.cold.addEventListener('focus',coldFocus);
  view.sun.addEventListener('blur',blur);view.cold.addEventListener('blur',blur);view.reset.addEventListener('click',reset);
  render(false);
  root.destroyNeuronWidget=()=>{
    if(destroyed)return;destroyed=true;clearMotion();
    view.sun.removeEventListener('input',sunInput);view.cold.removeEventListener('input',coldInput);
    view.sun.removeEventListener('change',sunChange);view.cold.removeEventListener('change',coldChange);
    view.sun.removeEventListener('focus',sunFocus);view.cold.removeEventListener('focus',coldFocus);
    view.sun.removeEventListener('blur',blur);view.cold.removeEventListener('blur',blur);view.reset.removeEventListener('click',reset);
    delete root.destroyNeuronWidget;
  };
  Deck.init({index:4,total:21});
})();
</script>
</body>
</html>
