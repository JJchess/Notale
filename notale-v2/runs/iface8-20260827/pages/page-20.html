<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="20" data-total="21">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;gap:24px;overflow:hidden}
    .p20-head{flex:0 0 104px;display:flex;flex-direction:column;justify-content:flex-start;border-bottom:1px solid var(--rule);padding-bottom:16px}
    .p20-head .kicker{margin:0 0 8px;color:var(--muted);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;letter-spacing:.08em}
    .p20-head h1{margin:0;font-family:var(--font-sans);font-size:var(--fs-h1);line-height:1.08;font-weight:700;color:var(--text)}

    .p20-main{flex:1;min-height:0;display:flex;flex-direction:column}
    .p20-table{flex:1;min-height:0;display:grid;grid-template-columns:160px minmax(0,1fr) minmax(0,1fr);grid-template-rows:72px repeat(4,minmax(0,1fr));border-top:2px solid var(--text);border-bottom:2px solid var(--text)}
    .p20-table > *{min-width:0;min-height:0}
    .p20-corner,.p20-colhead{display:flex;align-items:center;border-bottom:1px solid var(--rule);padding:16px 24px}
    .p20-corner{font-family:var(--font-mono);font-size:var(--fs-label);color:var(--muted);padding-left:8px}
    .p20-colhead{font-family:var(--font-sans);font-size:var(--fs-lead);font-weight:700;color:var(--text)}
    .p20-colhead.no{border-left:3px solid var(--attention);padding-left:37px}
    .p20-dim,.p20-cell{display:flex;align-items:center;border-bottom:1px solid var(--rule-soft)}
    .p20-dim{padding:16px 8px;font-family:var(--font-mono);font-size:var(--fs-body);font-weight:700;color:var(--text)}
    .p20-cell{padding:16px 24px;font-family:var(--font-sans);font-size:var(--fs-body);line-height:1.42;color:var(--text)}
    .p20-cell.can{padding-right:40px}
    .p20-cell.no{position:relative;border-left:3px solid var(--attention);padding-left:37px;color:var(--muted)}
    .p20-cell.no::before{content:"";position:absolute;left:13px;top:50%;width:10px;height:2px;background:var(--attention);transform:translateY(-50%)}
    .p20-table > :nth-last-child(-n+3){border-bottom:0}

    .p20-bottom{flex:0 0 152px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:64px;align-items:stretch}
    .p20-summary{display:flex;flex-direction:column;justify-content:center;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px 0}
    .p20-summary .lead{margin:0;font-size:var(--fs-lead);line-height:1.38}
    .p20-check{margin:8px 0 0;font-family:var(--font-sans);font-size:var(--fs-sec);line-height:1.4;color:var(--attention);font-weight:700}
    .p20-next{display:flex;flex-direction:column;justify-content:center;border:1px solid var(--rule);padding:16px 24px;background:var(--surface)}
    .p20-next .label{font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
    .p20-next p{margin:0;font-size:var(--fs-body);line-height:1.4;font-weight:700;color:var(--text)}
  </style>

  <header class="p20-head">
    <p class="kicker">V-02 · CLAIM LIMIT</p>
    <h1>误差下降，不等于模型理解了</h1>
  </header>

  <main class="p20-main min0" aria-label="误差下降能够与不能支持的结论比较">
    <section class="p20-table k-comparison" aria-label="四项判断的证据边界">
      <div class="p20-corner">判断维度</div>
      <div class="p20-colhead hdr">这一步可以推出</div>
      <div class="p20-colhead hdr no">这一步不能跳过去</div>

      <div class="p20-dim dim">拟合</div>
      <div class="p20-cell can rowline">模型更贴合给定的训练数据与目标。</div>
      <div class="p20-cell no rowline diff">它在所有现实情境中都会同样有效。</div>

      <div class="p20-dim dim">理解</div>
      <div class="p20-cell can rowline">模型找到了能降低错误的参数。</div>
      <div class="p20-cell no rowline diff">模型拥有与人相同的理解。</div>

      <div class="p20-dim dim">因果</div>
      <div class="p20-cell can rowline">模型利用了数据中有助预测的关系。</div>
      <div class="p20-cell no rowline diff">它识别出了事件之间的因果关系。</div>

      <div class="p20-dim dim">公平</div>
      <div class="p20-cell can rowline">可以按既定指标测量不同样本上的表现。</div>
      <div class="p20-cell no rowline diff">数据覆盖充分、目标合理，或结果对所有人公平。</div>
    </section>
  </main>

  <footer class="p20-bottom min0">
    <section class="p20-summary" aria-label="结论">
      <p class="lead">误差下降只证明：在给定数据和目标下，这个模型拟合得更好了。</p>
      <p class="p20-check">先问：给定的是什么数据？优化的是什么目标？</p>
    </section>
    <aside class="p20-next" aria-label="下一问">
      <span class="label">下一问</span>
      <p>那么，神经网络的学习最短可以怎样说？</p>
    </aside>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
