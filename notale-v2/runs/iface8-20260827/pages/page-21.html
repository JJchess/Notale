<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{
    display:flex;
    flex-direction:column;
    padding:var(--pad-y) var(--pad-x);
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
  }
  .page-head{
    flex:0 0 112px;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    border-bottom:1px solid var(--rule-soft);
  }
  .page-head .kicker{
    margin:0 0 8px;
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:var(--fs-label);
    font-weight:700;
    letter-spacing:.12em;
  }
  .page-head h1{
    margin:0;
    font-family:var(--font-sans);
    font-size:var(--fs-h1);
    line-height:1.08;
    font-weight:700;
    letter-spacing:-.025em;
  }
  .takeaway{
    flex:1;
    min-height:0;
    display:flex;
    align-items:stretch;
    justify-content:center;
    padding:40px 0 24px;
  }
  .k-generalization{
    width:100%;
    min-height:0;
    display:grid;
    grid-template-rows:240px 64px 1fr;
    align-items:start;
    position:relative;
  }
  .relation-map{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:0;
  }
  .claim-wrap,
  .trunk,
  .supports{
    z-index:1;
  }
  .claim-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:24px;
  }
  .claim{
    width:1240px;
    min-height:176px;
    margin:0;
    padding:24px 64px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid var(--text);
    background:var(--text);
    color:var(--bg);
    text-align:center;
    font-family:var(--font-serif);
    font-size:var(--fs-h2);
    line-height:1.35;
    font-weight:700;
    letter-spacing:-.01em;
  }
  .claim .plain{
    color:var(--bg);
  }
  .claim .action{
    text-decoration:underline;
    text-decoration-color:var(--rule-soft);
    text-decoration-thickness:2px;
    text-underline-offset:10px;
  }
  .claim-note{
    margin:0;
    color:var(--muted);
    font-family:var(--font-sans);
    font-size:var(--fs-body);
    line-height:1.45;
  }
  .trunk{
    width:1px;
    height:64px;
    background:var(--rule);
    justify-self:center;
    position:relative;
  }
  .trunk::before{
    content:"";
    position:absolute;
    left:-5px;
    top:0;
    width:11px;
    height:1px;
    background:var(--rule);
  }
  .trunk::after{
    content:"";
    position:absolute;
    left:-5px;
    bottom:0;
    width:11px;
    height:1px;
    background:var(--rule);
  }
  .supports{
    width:1400px;
    margin:0 auto;
    display:grid;
    grid-template-columns:1fr 56px 1fr 56px 1fr 56px 1fr;
    align-items:start;
    position:relative;
    padding-top:16px;
  }
  .supports::before{
    content:"";
    position:absolute;
    top:0;
    left:153px;
    right:153px;
    height:1px;
    background:var(--rule);
  }
  .support{
    min-width:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:16px;
    min-height:188px;
    position:relative;
    padding:32px 20px 24px;
    border:1px solid var(--text);
    background:var(--text);
    color:var(--bg);
    justify-content:center;
  }
  .support::before{
    content:"";
    position:absolute;
    top:-17px;
    left:50%;
    width:1px;
    height:17px;
    background:var(--rule);
  }
  .support-no{
    font-family:var(--font-mono);
    font-size:var(--fs-label);
    color:var(--rule-soft);
    letter-spacing:.08em;
  }
  .support-text{
    font-family:var(--font-sans);
    font-size:var(--fs-lead);
    line-height:1.25;
    font-weight:700;
    white-space:nowrap;
  }
  .support-sub{
    font-family:var(--font-sans);
    font-size:var(--fs-sec);
    line-height:1.4;
    color:var(--rule-soft);
  }
  .link{
    height:188px;
    position:relative;
    margin-top:0;
  }
  .link::before{
    content:"";
    position:absolute;
    left:12px;
    right:16px;
    top:93px;
    height:1px;
    background:var(--rule);
  }
  .link::after{
    content:"";
    position:absolute;
    right:12px;
    top:88px;
    width:9px;
    height:9px;
    border-top:1px solid var(--rule);
    border-right:1px solid var(--rule);
    transform:rotate(45deg);
  }
  .link.forward::before{
    height:2px;
    background:var(--prediction);
  }
  .link.forward::after{
    border-color:var(--prediction);
    border-width:2px 2px 0 0;
  }
  .link.update::after{
    border-color:var(--rule);
  }
  .update-tick{
    position:absolute;
    right:40px;
    top:83px;
    width:3px;
    height:22px;
    background:var(--attention);
  }
  .exit-check{
    flex:0 0 112px;
    border-top:1px solid var(--rule);
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    column-gap:64px;
  }
  .exit-main{
    min-width:0;
  }
  .exit-label{
    display:block;
    margin-bottom:8px;
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:var(--fs-label);
    font-weight:700;
    letter-spacing:.1em;
  }
  .exit-text{
    margin:0;
    font-family:var(--font-sans);
    font-size:var(--fs-body);
    line-height:1.35;
    font-weight:700;
  }
  .next-question{
    max-width:660px;
    margin:0;
    color:var(--muted);
    font-family:var(--font-sans);
    font-size:var(--fs-sec);
    line-height:1.4;
    text-align:right;
  }
</style>
</head>
<body data-page="21" data-total="21">
<div id="stage">
  <header class="page-head">
    <p class="kicker">V-03 · TAKEAWAY</p>
    <h1>用错误指方向，再反复迈小步</h1>
  </header>

  <main class="takeaway focus min0" aria-labelledby="takeaway-claim">
    <section class="k-generalization panel min0" aria-label="学习过程的最终归纳">
      <svg class="relation-map" viewBox="0 0 1488 560" preserveAspectRatio="none" aria-hidden="true">
        <path d="M744 188 V304 M156 304 H1332 M156 304 V352 M548 304 V352 M940 304 V352 M1332 304 V352" fill="none" stroke="var(--rule)" stroke-width="2" vector-effect="non-scaling-stroke"/>
        <path d="M110 500 H1378" fill="none" stroke="var(--rule-soft)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="claim-wrap">
        <p class="claim" id="takeaway-claim">
          <span class="plain">学习 = </span><span class="action">用错误指导参数修改</span><span class="plain">，并重复这个动作</span>
        </p>
        <p class="claim-note">神经网络学习，就是用错误为每个参数指出方向，再反复迈小步。</p>
      </div>

      <div class="trunk" aria-hidden="true"></div>

      <div class="supports" aria-label="训练循环的四个动作">
        <div class="support">
          <span class="support-no">01</span>
          <strong class="support-text">做出预测</strong>
          <span class="support-sub">输入向前得到 ŷ</span>
        </div>
        <div class="link forward" aria-hidden="true"></div>
        <div class="support">
          <span class="support-no">02</span>
          <strong class="support-text">把错误变成数</strong>
          <span class="support-sub">用损失 L 比较</span>
        </div>
        <div class="link" aria-hidden="true"></div>
        <div class="support">
          <span class="support-no">03</span>
          <strong class="support-text">为参数指出方向</strong>
          <span class="support-sub">从输出错误反向计算</span>
        </div>
        <div class="link update" aria-hidden="true"><span class="update-tick"></span></div>
        <div class="support">
          <span class="support-no">04</span>
          <strong class="support-text">迈小步，再重复</strong>
          <span class="support-sub">更新参数，开始下一轮</span>
        </div>
      </div>
    </section>
  </main>

  <footer class="exit-check">
    <div class="exit-main">
      <span class="exit-label">离场自检</span>
      <p class="exit-text">看到“学会了”，先找：目标、错误、参数更新。</p>
    </div>
    <p class="next-question">下次听到“模型学会了”，你会先问它依据什么数据、目标和误差吗？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:21,total:21});</script>
</body>
</html>
