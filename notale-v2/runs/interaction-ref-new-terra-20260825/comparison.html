<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>交互组件 Reference 盲评 · 6 页</title>
<style>
  :root {
    --paper: #e8eceb;
    --surface: #f8faf9;
    --ink: #182321;
    --muted: #66736f;
    --line: #aeb9b5;
    --a: #365ca8;
    --b: #087f72;
    --tie: #9a672c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    background: var(--paper);
    font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  button, a { font: inherit; }
  button:focus-visible, a:focus-visible { outline: 3px solid #e9943e; outline-offset: 3px; }
  .shell { width: min(1900px, 100%); margin: auto; padding: 18px 24px 28px; }
  .topbar {
    display: grid;
    grid-template-columns: minmax(260px, 1fr) auto minmax(260px, 1fr);
    align-items: center;
    gap: 18px;
    min-height: 58px;
    border-block: 1px solid var(--line);
  }
  .identity strong { display: block; font: 750 20px/1.15 Georgia, "Noto Serif SC", serif; }
  .identity span, .status, .foot { color: var(--muted); font-size: 12px; }
  .nav, .utility { display: flex; align-items: center; gap: 8px; }
  .utility { justify-content: flex-end; }
  .nav button, .utility button, .open {
    min-height: 34px;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 11px;
    color: var(--ink);
    background: rgba(255,255,255,.62);
    text-decoration: none;
    cursor: pointer;
  }
  .nav button:hover, .utility button:hover, .open:hover { border-color: #788983; background: #fff; }
  .readout { min-width: 96px; text-align: center; font: 700 14px/1 ui-monospace, monospace; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 18px; }
  .pane { min-width: 0; border: 1px solid var(--line); background: var(--surface); box-shadow: 0 15px 40px rgba(30,45,40,.12); }
  .pane-head { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 15px; border-bottom: 1px solid var(--line); }
  .pane-id { display: flex; align-items: center; gap: 10px; font-weight: 750; }
  .badge { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 50%; color: #fff; font: 800 13px/1 ui-monospace, monospace; }
  [data-arm="A"] .badge { background: var(--a); }
  [data-arm="B"] .badge { background: var(--b); }
  .open { min-height: 29px; padding: 4px 9px; font-size: 12px; }
  .viewport { aspect-ratio: 16/9; overflow: hidden; background: #111; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  .review { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; margin-top: 18px; padding: 14px 18px; border-block: 1px solid var(--line); }
  .vote { min-height: 45px; border: 1px solid currentColor; border-radius: 4px; background: transparent; font-weight: 750; cursor: pointer; }
  .vote[data-vote="A"] { color: var(--a); }
  .vote[data-vote="B"] { color: var(--b); }
  .vote[data-vote="tie"] { color: var(--tie); padding-inline: 24px; }
  .vote:hover, .vote.active { color: #fff; }
  .vote[data-vote="A"]:hover, .vote[data-vote="A"].active { background: var(--a); }
  .vote[data-vote="B"]:hover, .vote[data-vote="B"].active { background: var(--b); }
  .vote[data-vote="tie"]:hover, .vote[data-vote="tie"].active { background: var(--tie); }
  .rail { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 15px; }
  .tick { height: 34px; border: 0; border-bottom: 4px solid #a5b0ac; color: var(--muted); background: transparent; cursor: pointer; font: 700 12px/1 ui-monospace, monospace; }
  .tick:hover, .tick[aria-current="page"] { color: var(--ink); background: rgba(255,255,255,.62); }
  .tick[data-choice="A"] { border-color: var(--a); }
  .tick[data-choice="B"] { border-color: var(--b); }
  .tick[data-choice="tie"] { border-color: var(--tie); }
  .foot { display: flex; justify-content: space-between; gap: 20px; margin-top: 13px; }
  .counts { white-space: nowrap; font-family: ui-monospace, monospace; }
  @media (max-width: 980px) {
    .shell { padding-inline: 12px; }
    .topbar { grid-template-columns: 1fr; padding-block: 12px; }
    .identity, .nav, .utility { justify-self: center; }
    .grid, .review { grid-template-columns: 1fr; }
    .vote[data-vote="tie"] { order: 3; }
    .foot { flex-direction: column; }
  }
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="identity">
      <strong>交互组件 Reference 盲评</strong>
      <span>同规格 · Terra medium · 6 种交互</span>
    </div>
    <nav class="nav" aria-label="案例导航">
      <button id="prev" type="button" aria-label="上一个案例">←</button>
      <span class="readout"><span id="now">03</span> · <span id="position">1 / 6</span></span>
      <button id="next" type="button" aria-label="下一个案例">→</button>
    </nav>
    <div class="utility">
      <span id="status" class="status" aria-live="polite">尚未评价</span>
      <button id="reload" type="button">重置本页</button>
      <button id="copy" type="button">复制投票</button>
    </div>
  </header>

  <section class="grid" aria-label="匿名页面对比">
    <article class="pane" data-arm="A">
      <header class="pane-head"><span class="pane-id"><span class="badge">A</span>方案 A</span><a class="open" data-open="A" target="_blank" rel="noopener">单独打开</a></header>
      <div class="viewport"><iframe data-frame="A" title="方案 A 页面"></iframe></div>
    </article>
    <article class="pane" data-arm="B">
      <header class="pane-head"><span class="pane-id"><span class="badge">B</span>方案 B</span><a class="open" data-open="B" target="_blank" rel="noopener">单独打开</a></header>
      <div class="viewport"><iframe data-frame="B" title="方案 B 页面"></iframe></div>
    </article>
  </section>

  <section class="review" aria-label="案例评价">
    <button class="vote" data-vote="A" type="button">A 更好 · 1</button>
    <button class="vote" data-vote="tie" type="button">质量相当 · 2</button>
    <button class="vote" data-vote="B" type="button">B 更好 · 3</button>
  </section>
  <nav id="rail" class="rail" aria-label="案例进度"></nav>
  <footer class="foot">
    <span>请实际操作两边后再投票。方向键切换；1 / 2 / 3 记录 A / 相当 / B。A/B 在 6 页中均衡随机。</span>
    <span id="counts" class="counts"></span>
  </footer>
</main>
<script>
(() => {
  'use strict';
  const pages = [3, 4, 8, 11, 14, 20];
  const assignment = {
    3: {A: 'new', B: 'old'},
    4: {A: 'old', B: 'new'},
    8: {A: 'new', B: 'old'},
    11: {A: 'old', B: 'new'},
    14: {A: 'old', B: 'new'},
    20: {A: 'new', B: 'old'}
  };
  const roots = {
    old: '../interaction-ref-old-terra-20260825/pages',
    new: 'pages'
  };
  const storageKey = 'notale-interaction-reference-ab-v1';
  const votes = JSON.parse(localStorage.getItem(storageKey) || '{}');
  let index = Math.max(0, pages.indexOf(Number(location.hash.slice(1))));
  const two = n => String(n).padStart(2, '0');
  const frame = arm => document.querySelector(`[data-frame="${arm}"]`);
  const open = arm => document.querySelector(`[data-open="${arm}"]`);
  const src = arm => `${roots[assignment[pages[index]][arm]]}/page-${two(pages[index])}.html`;

  function renderRail() {
    const rail = document.getElementById('rail');
    rail.replaceChildren(...pages.map((page, i) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'tick';
      button.textContent = `P${two(page)}`;
      if (votes[page]) button.dataset.choice = votes[page];
      if (i === index) button.setAttribute('aria-current', 'page');
      button.addEventListener('click', () => go(i));
      return button;
    }));
  }

  function renderCounts() {
    const values = Object.values(votes);
    const count = value => values.filter(item => item === value).length;
    document.getElementById('counts').textContent =
      `A ${count('A')} · 相当 ${count('tie')} · B ${count('B')} · 未评 ${pages.length - values.length}`;
  }

  function render() {
    const page = pages[index];
    document.getElementById('now').textContent = two(page);
    document.getElementById('position').textContent = `${index + 1} / ${pages.length}`;
    document.getElementById('prev').disabled = index === 0;
    document.getElementById('next').disabled = index === pages.length - 1;
    for (const arm of ['A', 'B']) {
      frame(arm).src = src(arm);
      open(arm).href = src(arm);
    }
    document.querySelectorAll('.vote').forEach(button => {
      const active = button.dataset.vote === votes[page];
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', String(active));
    });
    document.getElementById('status').textContent = votes[page]
      ? `本页已记：${votes[page] === 'tie' ? '相当' : votes[page]}`
      : '本页尚未评价';
    location.hash = two(page);
    renderRail();
    renderCounts();
  }

  function go(nextIndex) {
    index = Math.max(0, Math.min(pages.length - 1, nextIndex));
    render();
  }

  function vote(choice) {
    const page = pages[index];
    votes[page] = choice;
    localStorage.setItem(storageKey, JSON.stringify(votes));
    render();
    if (index < pages.length - 1) setTimeout(() => go(index + 1), 160);
  }

  function voteJson() {
    const ordered = {};
    for (const page of pages) if (votes[page]) ordered[page] = votes[page];
    return JSON.stringify(ordered, null, 2);
  }

  document.getElementById('prev').addEventListener('click', () => go(index - 1));
  document.getElementById('next').addEventListener('click', () => go(index + 1));
  document.getElementById('reload').addEventListener('click', () => {
    for (const arm of ['A', 'B']) frame(arm).src = src(arm);
  });
  document.getElementById('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(voteJson());
      document.getElementById('status').textContent = '投票 JSON 已复制';
    } catch (_) {
      document.getElementById('status').textContent = voteJson();
    }
  });
  document.querySelectorAll('.vote').forEach(button => button.addEventListener('click', () => vote(button.dataset.vote)));
  window.addEventListener('keydown', event => {
    if (event.target.closest('input, textarea, select, button, a')) return;
    if (event.key === 'ArrowLeft') go(index - 1);
    if (event.key === 'ArrowRight') go(index + 1);
    if (event.key === '1') vote('A');
    if (event.key === '2') vote('tie');
    if (event.key === '3') vote('B');
  });
  window.addEventListener('hashchange', () => {
    const next = pages.indexOf(Number(location.hash.slice(1)));
    if (next >= 0 && next !== index) { index = next; render(); }
  });
  render();
})();
</script>
</body>
</html>
