<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="03" data-total="22">
<div id="stage">
  <style>
    #stage{padding:28px 56px;gap:0;}
    .p03-page{height:100%;display:flex;flex-direction:column;min-height:0;}
    .p03-head{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid var(--text);padding:5px 0 19px;flex:0 0 auto;}
    .p03-kicker{font:600 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.08em;color:var(--model);margin:0 0 7px;}
    .p03-head h1{font:700 var(--fs-h1)/1.2 var(--font-sans);margin:0;letter-spacing:.01em;}
    .p03-rule{font:400 var(--fs-sec)/1.45 var(--font-serif);max-width:425px;margin:11px 0 0;text-align:right;}
    .p03-widget{--ink:var(--text);--muted:rgba(31,39,45,.62);--line:rgba(31,39,45,.34);flex:1;min-height:0;display:flex;flex-direction:column;padding-top:23px;}
    .p03-prompt{display:flex;align-items:center;justify-content:space-between;gap:28px;flex:0 0 auto;}
    .p03-prompt .lead{margin:0;max-width:780px;font:400 var(--fs-lead)/1.45 var(--font-sans);}
    .p03-prompt strong{color:var(--attention);font-weight:700;}
    .p03-choices{display:flex;gap:10px;align-items:center;}
    .p03-choices button,.p03-reset{font:600 var(--fs-label)/1.2 var(--font-sans);padding:11px 16px;border:2px solid var(--text);border-radius:8px;background:transparent;color:var(--text);cursor:pointer;min-height:45px;}
    .p03-choices button:hover,.p03-choices button:focus-visible{border-color:var(--attention);color:var(--attention);outline:none;}
    .p03-choices button[aria-pressed="true"]{background:var(--attention);border-color:var(--attention);color:#fff;}
    .p03-compare{flex:1;min-height:0;display:grid;grid-template-columns:1fr 104px 1fr;gap:24px;align-items:stretch;padding:18px 0 14px;}
    .p03-case{height:100%;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;padding:28px 30px;background:#E2E1DC;border:2px dashed rgba(31,39,45,.38);border-radius:8px;}
    .p03-case.left{border-right:2px dashed rgba(31,39,45,.38);}
    .p03-case-title{font:600 var(--fs-h2)/1.25 var(--font-sans);margin:0 0 26px;display:flex;align-items:center;gap:11px;}
    .p03-case-title span{font:500 var(--fs-label)/1 var(--font-mono);color:var(--muted);}
    .p03-flow{display:grid;grid-template-columns:146px minmax(190px,1fr) 166px;align-items:center;gap:12px;}
    .p03-readout{border:2px solid var(--model);border-radius:8px;background:var(--model);padding:34px 12px;text-align:center;}
    .p03-readout .label{display:block;font:600 var(--fs-label)/1.25 var(--font-sans);color:#fff;margin-bottom:8px;}
    .p03-readout .value{font:700 32px/1 var(--font-mono);color:#fff;font-variant-numeric:tabular-nums;}
    .p03-signal{height:190px;position:relative;display:flex;align-items:center;justify-content:center;}
    .p03-signal .line{height:var(--signal,10px);background:var(--model);width:100%;border-radius:99px;position:relative;transition:height .25s ease;}
    .p03-signal .line:after{content:"";position:absolute;right:-1px;top:50%;transform:translateY(-50%);border-left:18px solid var(--model);border-top:13px solid transparent;border-bottom:13px solid transparent;}
    .p03-weight{position:absolute;top:5px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;}
    .p03-knob{display:block;width:58px;height:58px;border:2px solid var(--text);border-radius:50%;margin:0 auto 7px;position:relative;background:var(--bg);}
    .p03-knob:before{content:"";width:3px;height:19px;background:var(--attention);position:absolute;left:26px;top:7px;border-radius:3px;transform:rotate(var(--needle,0deg));transform-origin:50% 22px;}
    .p03-weight b{font:700 var(--fs-body)/1 var(--font-mono);font-variant-numeric:tabular-nums;}
    .p03-weight small{display:block;font:500 var(--fs-label)/1.2 var(--font-sans);margin-top:3px;}
    .p03-output{border:2px solid var(--text);border-radius:8px;padding:21px 10px;text-align:center;background:rgba(244,241,232,.74);transition:background .2s,border-color .2s;}
    .p03-output .label{display:block;font:600 var(--fs-label)/1.25 var(--font-sans);margin-bottom:8px;}
    .p03-output .value{font:700 32px/1 var(--font-mono);font-variant-numeric:tabular-nums;}
    .p03-output.revealed{border-color:var(--attention);background:rgba(231,111,46,.08);}
    .p03-output.revealed .value{color:var(--attention);}
    .p03-meter{margin-top:42px;border-top:1px solid var(--line);padding-top:15px;}
    .p03-meter-head{display:flex;justify-content:space-between;font:600 var(--fs-label)/1.2 var(--font-sans);margin-bottom:9px;}
    .p03-meter-track{height:112px;border:2px solid var(--text);border-radius:8px;background:rgba(244,241,232,.6);position:relative;overflow:hidden;}
    .p03-meter-fill{height:100%;width:0;background:var(--attention);transition:width .25s ease;}
    .p03-meter-fill.revealed{width:var(--amount);}
    .p03-meter-value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 var(--fs-body)/1 var(--font-mono);color:var(--text);font-variant-numeric:tabular-nums;}
    .p03-meter-fill.revealed + .p03-meter-value{color:#fff;}
    .p03-equals{height:60%;border-left:2px dashed var(--line);position:relative;}
    .p03-equals:before,.p03-equals:after{content:"";width:38px;height:2px;background:var(--text);position:absolute;left:32px;}
    .p03-equals:before{top:calc(50% - 7px)}.p03-equals:after{top:calc(50% + 7px)}
    .p03-formula{border-top:1px solid var(--line);padding:17px 0 0;display:flex;align-items:center;justify-content:space-between;gap:25px;flex:0 0 auto;}
    .p03-equation{font:600 var(--fs-body)/1.5 var(--font-mono);font-variant-numeric:tabular-nums;}
    .p03-equation .term{color:var(--model);}.p03-equation .hidden{color:var(--muted);}
    .p03-feedback{min-height:51px;max-width:690px;font:400 var(--fs-body)/1.4 var(--font-serif);margin:0;text-align:right;}
    .p03-feedback strong{color:var(--attention);}
    .p03-reset{border-color:var(--line);padding:9px 14px;min-height:40px;}
    .p03-reset:hover,.p03-reset:focus-visible{border-color:var(--attention);color:var(--attention);outline:none;}
    @media (prefers-reduced-motion:reduce){.p03-signal .line,.p03-output,.p03-meter-fill{transition:none;}}
  </style>
  <main class="p03-page">
    <header class="p03-head">
      <div><p class="p03-kicker">实验记录 01 · 加权</p><h1>同一输入，不同分量</h1></div>
      <p class="p03-rule">输入相同，只比较权重：哪一条连接送出的加权信号更大？</p>
    </header>
    <section class="p03-widget" aria-label="加权信号对照实验">
      <div class="p03-prompt">
        <p class="lead">两边都输入 <strong>0.8</strong>。先猜一猜：权重更大的那一边，加权信号会怎样？</p>
        <div class="p03-choices" role="group" aria-label="选择你的判断">
          <button type="button" data-choice="left" aria-pressed="false">左边更大</button>
          <button type="button" data-choice="right" aria-pressed="false">右边更大</button>
        </div>
      </div>
      <div class="p03-compare k-comparison">
        <article class="p03-case left min0" style="--signal:42px">
          <h2 class="p03-case-title">左侧连接 <span>同样输入 · 一条加权路径</span></h2>
          <div class="p03-flow">
            <div class="p03-readout"><span class="label">输入</span><span class="value">0.8</span></div>
            <div class="p03-signal" aria-hidden="true"><span class="p03-scale">加权强度</span><div class="p03-weight"><span class="p03-knob" style="--needle:-24deg"></span><b>0.5</b><small>权重</small></div><div class="line"></div></div>
            <div class="p03-output" data-output="left"><span class="label">加权信号</span><span class="value">？</span></div>
          </div>
          <div class="p03-meter" aria-label="左侧加权信号的同尺度刻度"><div class="p03-meter-head"><span>同一刻度：加权信号</span><span>最大 1.20</span></div><div class="p03-meter-track"><div class="p03-meter-fill" data-meter="left" style="--amount:33.333%"></div><span class="p03-meter-value" data-meter-value="left">等待计算</span></div></div>
        </article>
        <div class="p03-equals" aria-hidden="true"></div>
        <article class="p03-case min0" style="--signal:82px">
          <h2 class="p03-case-title">右侧连接 <span>同样输入 · 一条加权路径</span></h2>
          <div class="p03-flow">
            <div class="p03-readout"><span class="label">输入</span><span class="value">0.8</span></div>
            <div class="p03-signal" aria-hidden="true"><span class="p03-scale">加权强度</span><div class="p03-weight"><span class="p03-knob" style="--needle:24deg"></span><b>1.5</b><small>权重</small></div><div class="line"></div></div>
            <div class="p03-output" data-output="right"><span class="label">加权信号</span><span class="value">？</span></div>
          </div>
          <div class="p03-meter" aria-label="右侧加权信号的同尺度刻度"><div class="p03-meter-head"><span>同一刻度：加权信号</span><span>最大 1.20</span></div><div class="p03-meter-track"><div class="p03-meter-fill" data-meter="right" style="--amount:100%"></div><span class="p03-meter-value" data-meter-value="right">等待计算</span></div></div>
        </article>
      </div>
      <div class="p03-formula">
        <div class="p03-equation">加权信号 = <span class="term">输入 × 权重</span> <span class="hidden" data-formula>＝ ？</span></div>
        <p class="p03-feedback" data-feedback aria-live="polite">选择一边，再把两个乘积放在同一条基线上比较。</p>
        <button class="p03-reset" type="button" data-reset>重新猜</button>
      </div>
    </section>
  </main>
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    const root = document.querySelector('.p03-widget');
    if (!root) return;
    const input = 0.8;
    const weights = { left: 0.5, right: 1.5 };
    const initial = () => ({ choice: null, revealed: false });
    let state = initial(), destroyed = false;
    const buttons = Array.from(root.querySelectorAll('[data-choice]'));
    const outputs = { left: root.querySelector('[data-output="left"]'), right: root.querySelector('[data-output="right"]') };
    const feedback = root.querySelector('[data-feedback]');
    const meters = { left: root.querySelector('[data-meter="left"]'), right: root.querySelector('[data-meter="right"]') };
    const meterValues = { left: root.querySelector('[data-meter-value="left"]'), right: root.querySelector('[data-meter-value="right"]') };
    const formula = root.querySelector('[data-formula]');
    function calculate(weight) {
      return Lec.P.weightedSum([input], [weight], 0);
    }
    function render() {
      const left = calculate(weights.left), right = calculate(weights.right);
      buttons.forEach(btn => btn.setAttribute('aria-pressed', String(state.choice === btn.dataset.choice)));
      Object.entries(outputs).forEach(([side, el]) => {
        el.classList.toggle('revealed', state.revealed);
        el.querySelector('.value').textContent = state.revealed ? calculate(weights[side]).toFixed(2) : '？';
        meters[side].classList.toggle('revealed', state.revealed);
        meterValues[side].textContent = state.revealed ? calculate(weights[side]).toFixed(2) : '等待计算';
      });
      if (state.revealed) {
        formula.innerHTML = '＝ <span class="term">0.8 × 0.5 = ' + left.toFixed(2) + '</span>　｜　<span class="term">0.8 × 1.5 = ' + right.toFixed(2) + '</span>';
        feedback.innerHTML = state.choice === 'right' ? '<strong>判断对了。</strong> 同样的输入，权重从 0.5 变为 1.5，加权信号从 0.40 变为 1.20。' : '<strong>看读数修正判断。</strong> 同样的输入，权重 1.5 产生的加权信号 1.20，比 0.40 更大。';
      } else {
        formula.textContent = '＝ ？';
        feedback.textContent = '选择一边，再把两个乘积放在同一条基线上比较。';
      }
    }
    function dispatch(choice) { if (!destroyed && (choice === 'left' || choice === 'right')) { state = { choice, revealed: true }; render(); } }
    function reset() { state = initial(); render(); }
    buttons.forEach(btn => btn.addEventListener('click', () => dispatch(btn.dataset.choice)));
    root.querySelector('[data-reset]').addEventListener('click', reset);
    root.addEventListener('keydown', function(e) { if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && document.activeElement.matches('[data-choice]')) { e.preventDefault(); e.stopPropagation(); dispatch(e.key === 'ArrowLeft' ? 'left' : 'right'); } });
    root._p03Destroy = function () { if (destroyed) return; destroyed = true; };
    render();
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
