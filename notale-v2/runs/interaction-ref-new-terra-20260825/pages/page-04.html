<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F4F1E8;--text:#27313a;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E76F2E}
#stage{box-sizing:border-box;display:flex;flex-direction:column;gap:16px;padding:28px 56px;color:var(--text);overflow:hidden}
.p04-head{display:flex;align-items:end;justify-content:space-between;gap:30px;flex:0 0 auto;border-bottom:1px solid rgba(39,49,58,.34);padding-bottom:14px}
.p04-head h1{font-size:var(--fs-h1);line-height:1.15;margin:0;letter-spacing:.02em}
.p04-head .lead{font-size:var(--fs-lead);line-height:1.4;margin:0;max-width:720px;color:#43515b}
.p04-widget{flex:1;min-height:0;display:flex;flex-direction:column;gap:13px;position:relative}
.p04-instruction{display:flex;align-items:center;gap:14px;flex:0 0 auto;font-size:var(--fs-body);line-height:1.4}
.p04-instruction .tag{color:var(--attention);border:1px solid var(--attention);padding:3px 10px;border-radius:999px;font-size:var(--fs-label);font-weight:700;white-space:nowrap}
.p04-instrument{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:stretch}
.p04-stage{min-width:0;min-height:0;border:1px solid rgba(39,49,58,.55);border-radius:8px;background:rgba(255,255,255,.20);position:relative;overflow:hidden}
.p04-stage svg{width:100%;height:100%;display:block}
.p04-controls{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:8px 0}
.p04-control-title{font-size:var(--fs-h2);line-height:1.2;margin:0;font-weight:700}
.p04-ctlbox{border-left:3px solid var(--attention);padding-left:16px}
.p04-ctlbox label{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--fs-body);font-weight:700;margin-bottom:12px}
.p04-value{font-family:var(--font-mono);font-size:28px;color:var(--attention);font-variant-numeric:tabular-nums}
.p04-range{width:100%;accent-color:var(--attention);height:28px;cursor:pointer}
.p04-scale{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:var(--fs-tick);color:#53606a;margin-top:4px}
.p04-readout{padding-top:17px;border-top:1px solid rgba(39,49,58,.35)}
.p04-readout .small{font-size:var(--fs-label);display:block;margin-bottom:5px;color:#53606a}
.p04-product{font-family:var(--font-mono);font-size:36px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--model);letter-spacing:-.03em}
.p04-status{font-size:var(--fs-sec);line-height:1.42;margin:8px 0 0;color:#3c4851;min-height:46px}
.p04-reset{align-self:flex-start;background:transparent;color:var(--text);border:2px solid var(--text);border-radius:8px;font:600 var(--fs-label) var(--font-sans);padding:9px 18px;cursor:pointer}
.p04-reset:hover{background:rgba(39,49,58,.08)}.p04-reset:focus-visible,.p04-range:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.p04-caption{flex:0 0 auto;display:flex;align-items:center;gap:14px;border-top:1px solid rgba(39,49,58,.34);padding-top:12px;font-family:var(--font-serif);font-size:var(--fs-lead);line-height:1.38}
.p04-caption strong{color:var(--model)}
.p04-svg-label{font-family:var(--font-sans);fill:#27313a}.p04-svg-mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}.p04-faint{stroke:#7a858b;stroke-width:2;fill:none}.p04-forward{stroke:var(--model);stroke-width:6;fill:none}.p04-zero{stroke:#68747a;stroke-width:4;stroke-dasharray:8 7;fill:none}.p04-node{fill:#F4F1E8;stroke:#27313a;stroke-width:3}.p04-node-blue{fill:rgba(36,87,166,.10);stroke:var(--model);stroke-width:3}.p04-inputbox{fill:rgba(255,255,255,.36);stroke:#27313a;stroke-width:2}.p04-pulse{fill:var(--attention);stroke:#27313a;stroke-width:2}
</style>
</head>
<body data-page="04" data-total="22">
<div id="stage">
  <header class="p04-head">
    <h1>转动影响旋钮</h1>
    <p class="lead">同一个输入，乘上不同权重，就会把影响的方向和大小一起改掉。</p>
  </header>
  <main class="p04-widget" aria-label="权重影响观察仪">
    <div class="p04-instruction"><span class="tag">观察仪</span><span>拖动权重 <strong>w</strong>，观察输入 <strong>0.80</strong> 送向下一处的影响如何变化。</span></div>
    <div class="p04-instrument">
      <section class="p04-stage min0" aria-label="输入乘以权重的可视化">
        <svg viewBox="0 0 1040 530" role="img" aria-labelledby="p04-svg-title p04-svg-desc">
          <title id="p04-svg-title">输入乘以权重后的影响方向与大小</title><desc id="p04-svg-desc">左侧固定输入零点八，中间为权重，右侧显示相乘结果。权重为正时箭头向右，为负时箭头反向，零时没有前进影响。</desc>
          <defs><marker id="p04-arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#2457A6"/></marker><marker id="p04-arrow-dark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#68747a"/></marker></defs>
          <line x1="90" y1="300" x2="945" y2="300" class="p04-faint"/>
          <line x1="90" y1="291" x2="90" y2="309" class="p04-faint"/><line x1="945" y1="291" x2="945" y2="309" class="p04-faint"/>
          <text x="90" y="342" class="p04-svg-label" font-size="16">影响路径</text>
          <rect x="86" y="150" width="202" height="106" rx="14" class="p04-inputbox"/>
          <text x="187" y="182" text-anchor="middle" class="p04-svg-label" font-size="19">固定输入 x</text>
          <text x="187" y="226" text-anchor="middle" class="p04-svg-mono" font-size="38" fill="#2457A6">0.80</text>
          <line x1="288" y1="203" x2="420" y2="203" class="p04-faint" marker-end="url(#p04-arrow-dark)"/>
          <text x="354" y="176" text-anchor="middle" class="p04-svg-label" font-size="16">乘上权重</text>
          <g transform="translate(483 203)"><circle r="62" class="p04-node"/><path d="M-28 0H28M0-28V28" class="p04-faint"/><text y="8" text-anchor="middle" class="p04-svg-mono" font-size="28">w</text></g>
          <text id="p04-weight-near" x="483" y="294" text-anchor="middle" class="p04-svg-mono" font-size="20" fill="#E76F2E">w = +0.50</text>
          <path id="p04-effect-line" d="M545 300 L765 300" class="p04-forward" marker-end="url(#p04-arrow-blue)"/>
          <circle id="p04-effect-dot" cx="765" cy="300" r="12" class="p04-pulse"/>
          <rect x="783" y="151" width="184" height="105" rx="14" class="p04-node-blue"/>
          <text x="875" y="182" text-anchor="middle" class="p04-svg-label" font-size="19">送出的影响</text>
          <text id="p04-svg-product" x="875" y="226" text-anchor="middle" class="p04-svg-mono" font-size="34" fill="#2457A6">+0.40</text>
          <text id="p04-direction-label" x="650" y="395" text-anchor="middle" class="p04-svg-label" font-size="21" fill="#2457A6">正权重：沿原方向传递</text>
          <g aria-hidden="true"><text x="112" y="455" class="p04-svg-label" font-size="16">小提示</text><text x="112" y="487" class="p04-svg-label" font-size="18">权重的绝对值越大，箭头越长；符号决定方向。</text></g>
        </svg>
      </section>
      <aside class="p04-controls min0" aria-label="权重控制与读数">
        <h2 class="p04-control-title">权重旋钮 <span style="font-family:var(--font-mono)">w</span></h2>
        <div class="p04-ctlbox">
          <label for="p04-weight">当前设定 <output id="p04-weight-output" class="p04-value">+0.50</output></label>
          <input id="p04-weight" class="p04-range" type="range" min="-1" max="1" step="0.05" value="0.5" aria-describedby="p04-status">
          <div class="p04-scale"><span>−1.00</span><span>0</span><span>+1.00</span></div>
        </div>
        <div class="p04-readout" aria-live="polite">
          <span class="small">即时相乘结果</span>
          <div class="p04-product" id="p04-product">0.80 × +0.50 = +0.40</div>
          <p id="p04-status" class="p04-status">正权重保留输入方向，并把影响缩小到一半。</p>
        </div>
        <button class="p04-reset" id="p04-reset" type="button">复位到 +0.50</button>
      </aside>
    </div>
    <footer class="p04-caption"><span aria-hidden="true">→</span><span><strong>权重不是开关。</strong>它是一只可调旋钮：决定输入影响的方向，也决定影响有多大。</span></footer>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  const root = document.querySelector('.p04-widget');
  const slider = root.querySelector('#p04-weight');
  const reset = root.querySelector('#p04-reset');
  const output = root.querySelector('#p04-weight-output');
  const product = root.querySelector('#p04-product');
  const status = root.querySelector('#p04-status');
  const svgWeight = root.querySelector('#p04-weight-near');
  const svgProduct = root.querySelector('#p04-svg-product');
  const line = root.querySelector('#p04-effect-line');
  const dot = root.querySelector('#p04-effect-dot');
  const direction = root.querySelector('#p04-direction-label');
  const INPUT = 0.80, INITIAL = 0.50;
  let state = { weight: INITIAL };
  const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(2);
  function multiply(w){ return Lec.P.weightedSum([INPUT], [w], 0); }
  function render(){
    const w = state.weight, result = multiply(w), magnitude = Math.abs(result);
    const positive = w > 0.0001, negative = w < -0.0001;
    output.textContent = signed(w); svgWeight.textContent = 'w = ' + signed(w);
    product.textContent = '0.80 × ' + signed(w) + ' = ' + signed(result);
    svgProduct.textContent = signed(result);
    const len = 58 + magnitude * 420;
    if (positive) {
      line.setAttribute('d', 'M545 300 L' + (545 + len) + ' 300'); line.setAttribute('class','p04-forward'); line.setAttribute('marker-end','url(#p04-arrow-blue)');
      dot.setAttribute('cx', 545 + len); dot.style.display='block'; direction.textContent='正权重：沿原方向传递'; direction.setAttribute('fill','#2457A6');
      status.textContent = '正权重保留输入方向；绝对值越大，送出的影响越强。';
    } else if (negative) {
      line.setAttribute('d', 'M545 300 L' + (545 - len) + ' 300'); line.setAttribute('class','p04-forward'); line.setAttribute('marker-end','url(#p04-arrow-blue)');
      dot.setAttribute('cx', 545 - len); dot.style.display='block'; direction.textContent='负权重：方向反过来'; direction.setAttribute('fill','#E76F2E');
      status.textContent = '负权重把影响方向翻转；绝对值越大，反向影响越强。';
    } else {
      line.setAttribute('d','M545 300 L605 300'); line.setAttribute('class','p04-zero'); line.setAttribute('marker-end',''); dot.style.display='none';
      direction.textContent='零权重：这条输入暂时没有影响'; direction.setAttribute('fill','#53606a');
      status.textContent = '权重为零：0.80 乘以 0，送出的影响也为 0。';
    }
  }
  function setWeight(value){ state = {weight: Math.max(-1, Math.min(1, Math.round(Number(value)*20)/20))}; slider.value=state.weight; render(); }
  slider.addEventListener('input', e => setWeight(e.target.value));
  reset.addEventListener('click', () => setWeight(INITIAL));
  render();
  Deck.init({index:4,total:22});
})();
</script>
</body>
</html>
