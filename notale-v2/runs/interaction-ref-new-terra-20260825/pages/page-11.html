<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F4F1E8;--text:#20252c;--font-sans:"Noto Sans SC",system-ui,sans-serif;--ink:#20252c;--line:#bcb6aa;--paper:#fbf9f3}
#stage{padding:28px 56px;box-sizing:border-box}
.p11{height:100%;display:flex;flex-direction:column;gap:16px;color:var(--text)}
.p11 *{box-sizing:border-box}.p11-head{display:flex;align-items:end;justify-content:space-between;border-bottom:2px solid var(--text);padding-bottom:13px;flex:0 0 auto}.p11-kicker{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--attention);margin-bottom:8px}.p11 h1{font:700 var(--fs-h1)/1.12 var(--font-sans);margin:0;letter-spacing:.02em}.p11-lead{font:400 var(--fs-lead)/1.45 var(--font-serif);margin:0 0 2px;max-width:545px}
.p11-widget{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}.p11-meta{display:flex;align-items:center;justify-content:space-between;gap:28px;flex:0 0 auto}.p11-instruction{font:400 var(--fs-body)/1.4 var(--font-sans);margin:0}.p11-instruction b{color:var(--attention)}.p11-start{font:500 var(--fs-label)/1.2 var(--font-mono);white-space:nowrap;border-left:2px solid var(--attention);padding-left:12px}
.p11-charts{display:flex;gap:20px;min-height:0;flex:1}.p11-chart{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;border-top:2px solid var(--ink);padding-top:11px}.p11-chart:not(:last-child)::after{content:"";position:absolute;right:-11px;top:0;height:100%;border-right:1px dashed #aaa397}.p11-chart-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 8px 8px}.p11-rate{font:700 var(--fs-h2)/1 var(--font-sans)}.p11-rate .unit{font:400 var(--fs-label)/1 var(--font-sans);margin-left:4px}.p11-mode{font:600 var(--fs-label)/1 var(--font-mono);color:var(--model)}.p11-plot{position:relative;flex:1;min-height:260px;background:linear-gradient(#d9d4c9 1px,transparent 1px),linear-gradient(90deg,#d9d4c9 1px,transparent 1px);background-size:28px 28px;border-bottom:1px solid var(--ink);border-left:1px solid var(--ink);overflow:hidden}.p11-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.p11-axis-y{position:absolute;left:7px;top:7px;font:var(--fs-tick)/1 var(--font-mono);white-space:nowrap;background:var(--bg);padding:2px 3px}.p11-axis-x{position:absolute;right:6px;bottom:6px;font:var(--fs-tick)/1 var(--font-mono);background:var(--bg);padding:2px 3px}.p11-read{display:flex;justify-content:space-between;align-items:baseline;padding:24px 8px 0}.p11-read span{font:var(--fs-label)/1 var(--font-sans)}.p11-read strong{font:600 24px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--model)}
.p11-controls{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding-top:2px}.p11-controls .btn{font-size:var(--fs-label);min-width:116px;height:42px}.p11-controls .btn.primary{background:var(--attention);border-color:var(--attention);color:#fff}.p11-step{font:600 var(--fs-label)/1 var(--font-mono);margin-left:9px}.p11-status{font:400 var(--fs-sec)/1.35 var(--font-serif);margin-left:auto;text-align:right;max-width:620px}.p11-conclusion{flex:0 0 auto;display:flex;align-items:center;border-top:1px solid var(--line);padding-top:12px;min-height:54px}.p11-conclusion .mark{font:700 23px/1 var(--font-serif);color:var(--attention);margin-right:12px}.p11-conclusion p{font:400 var(--fs-lead)/1.35 var(--font-serif);margin:0}.p11-conclusion b{font-weight:700}
.p11 button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
</style>
</head>
<body data-page="11" data-total="22">
<div id="stage">
  <main class="p11" aria-labelledby="p11-title">
    <header class="p11-head"><div><div class="p11-kicker">误差如何推动参数移动 · 03</div><h1 id="p11-title">同一条下坡路，三种步长</h1></div><p class="p11-lead">每次都朝同一方向移动；区别只在于，一步迈多远。</p></header>
    <section class="p11-widget" id="step-lab" aria-label="三种学习率同步比较">
      <div class="p11-meta"><p class="p11-instruction"><b>操作：</b>按“走一步”或“连续走”，比较三条记录在同一刻度上的位置。</p><div class="p11-start">同起点　w = 0.5　·　损失 0.1013</div></div>
      <div class="p11-charts min0" id="charts"></div>
      <div class="p11-controls"><button class="btn primary" type="button" data-act="run">连续走</button><button class="btn" type="button" data-act="step">走一步</button><button class="btn" type="button" data-act="reset">重来</button><span class="p11-step" id="stepcount">第 0 / 8 步</span><div class="p11-status" id="status" aria-live="polite">三条记录从完全相同的起点出发。</div></div>
      <div class="p11-conclusion"><span class="mark">↳</span><p id="conclusion">先让三种步长同步走几步，再读出各自的损失变化。</p></div>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function(){
  const root=document.getElementById('step-lab');
  const rates=[0.1,1,20], labels=['下降慢','稳定接近','跨过低点'];
  // Fixed teaching sample: use Lec.P to obtain the shared initial loss, then compare one local loss landscape.
  const sample={input:(Lec.K&&Lec.K.input)||0.8,weight:(Lec.K&&Lec.K.initialWeight)||0.5,bias:(Lec.K&&Lec.K.initialBias)||-0.2,target:(Lec.K&&Lec.K.target)||1};
  function initialLoss(){const f=Lec.P.neuronForward([sample.input],[sample.weight],sample.bias,'sigmoid');const p=Array.isArray(f)?f[0]:(f.output??f);return 0.5*Math.pow(p-sample.target,2)}
  const baseLoss=initialLoss(); const low=.95, curvature=baseLoss/Math.pow(sample.weight-low,2);
  const initial=()=>({step:0,running:false,weights:rates.map(()=>sample.weight),timer:0}); let state=initial(); let destroyed=false;
  const charts=root.querySelector('#charts'), status=root.querySelector('#status'), conclusion=root.querySelector('#conclusion'), stepcount=root.querySelector('#stepcount');
  function loss(w){return curvature*Math.pow(w-low,2)} function grad(w){return 2*curvature*(w-low)}
  function series(rate,w,steps){let a=[w];for(let i=0;i<steps;i++)a.push(a[a.length-1]-rate*grad(a[a.length-1]));return a}
  function path(points,W,H){return points.map((p,i)=>`${i?'L':'M'}${(i/8)*W} ${H-Math.min(p,0.13)/0.13*H}`).join(' ')}
  function render(){
    const maxLoss=.13;
    charts.innerHTML=rates.map((rate,i)=>{const values=series(rate,sample.weight,state.step).map(loss);const current=values[values.length-1];const points=values.map((v,j)=>({x:j,y:v})); const point=points[points.length-1];
      return `<article class="p11-chart min0" aria-label="学习率 ${rate}"><div class="p11-chart-head"><div class="p11-rate">${rate}<span class="unit">学习率</span></div><span class="p11-mode">${labels[i]}</span></div><div class="p11-plot"><span class="p11-axis-y">损失 0.13</span><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M0 22 C23 55,45 78,60 85 S88 91,100 92" fill="none" stroke="#8c887e" stroke-width="1.1" vector-effect="non-scaling-stroke"/><path d="${path(values,100,100)}" fill="none" stroke="var(--model)" stroke-width="2.8" vector-effect="non-scaling-stroke"/><circle cx="${point.x/8*100}" cy="${100-Math.min(point.y,maxLoss)/maxLoss*100}" r="3.7" fill="var(--attention)" stroke="#20252c" stroke-width="1.2" vector-effect="non-scaling-stroke"/>${current>maxLoss?`<path d="M94 8h6v6" fill="none" stroke="var(--attention)" stroke-width="2" vector-effect="non-scaling-stroke"/>`:''}</svg><span class="p11-axis-x">步数 →</span></div><div class="p11-read"><span>当前损失</span><strong>${current>9.999?'＞9.999':current.toFixed(4)}</strong></div></article>`}).join('');
    stepcount.textContent=`第 ${state.step} / 8 步`;
    const final=state.step===8;
    status.textContent=final?'8 步记录完成：三条线的横轴、纵轴完全相同。':state.step?'保持同一时刻，读三种步长的损失。':'三条记录从完全相同的起点出发。';
    conclusion.innerHTML=final?'<b>步长太小</b>下降慢；<b>适中</b>能稳定接近低点；<b>过大</b>会跨过低点而来回震荡。':'先让三种步长同步走几步，再读出各自的损失变化。';
    root.querySelector('[data-act="run"]').textContent=state.running?'暂停':'连续走';
  }
  function stop(){if(state.timer){clearInterval(state.timer);state.timer=0}state.running=false}
  function dispatch(action){if(destroyed)return;if(action==='step'){stop();if(state.step<8)state.step++}if(action==='run'){if(state.running){stop()}else if(state.step<8){state.running=true;state.timer=setInterval(()=>{if(state.step>=8){stop();render();return}state.step++;render()},520)}}if(action==='reset'){stop();state=initial()}render()}
  root.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(b)dispatch(b.dataset.act)});
  render();
  window.addEventListener('pagehide',()=>{destroyed=true;stop()},{once:true});
})();
Deck.init({index:11,total:22});
</script>
</body>
</html>
