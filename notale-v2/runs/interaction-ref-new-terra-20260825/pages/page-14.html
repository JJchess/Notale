<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F4F1E8;--text:#202522;--font-sans:"Noto Sans SC",system-ui,sans-serif;--font-serif:Georgia,"Noto Serif SC",serif;--font-mono:"SFMono-Regular",Consolas,monospace;--focus:#E76F2E;--model:#2457A6;--attention:#E76F2E}
#stage{box-sizing:border-box;padding:28px 56px;display:flex;flex-direction:column;gap:16px;background:var(--bg);color:var(--text)}
.p14-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid rgba(32,37,34,.42);padding-bottom:13px;flex:none}.p14-head h1{margin:0;font-size:var(--fs-h1);line-height:1.15;letter-spacing:.02em}.p14-head p{margin:0;font-family:var(--font-serif);font-size:var(--fs-lead);line-height:1.35;color:#4c514d}.p14-head strong{color:var(--model)}
.trace-widget{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;position:relative}.trace-top{display:flex;align-items:center;gap:18px;flex:none}.trace-top .prompt{margin:0;font-size:var(--fs-body);line-height:1.4}.trace-top .prompt b{color:var(--attention)}.stepper{display:flex;align-items:center;gap:0;margin-left:auto}.step-dot{font-family:var(--font-mono);font-size:var(--fs-tick);width:27px;height:27px;border:1px solid #72766e;border-radius:50%;display:grid;place-items:center;position:relative;background:var(--bg)}.step-dot:not(:last-child)::after{content:"";position:absolute;left:26px;width:16px;border-top:1px solid #858980}.step-dot.done{background:#dce5f2;border-color:var(--model);color:var(--model)}.step-dot.now{background:var(--attention);border-color:var(--attention);color:white;font-weight:700}
.trace-main{flex:1;min-height:0;display:flex;gap:22px;align-items:stretch}.trace-stage{flex:1 1 auto;min-width:0;position:relative;border-top:2px solid var(--text);border-bottom:1px solid rgba(32,37,34,.45);overflow:hidden}.trace-stage svg{width:100%;height:100%;display:block}.trace-stage .zone{fill:rgba(36,87,166,.025);stroke:#8f938b;stroke-dasharray:5 5;stroke-width:1}.trace-stage .zone-label{font:15px var(--font-sans);fill:#555b54;letter-spacing:.08em}.trace-stage .forward{stroke:var(--model);stroke-width:3;fill:none;marker-end:url(#forwardArrow)}.trace-stage .back{stroke:var(--attention);stroke-width:2;fill:none;marker-end:url(#backArrow);opacity:.13}.trace-stage .back.active{opacity:1}.trace-stage .node rect{fill:var(--bg);stroke:#3e4640;stroke-width:2}.trace-stage .node .n-title{font:700 17px var(--font-sans);fill:var(--text)}.trace-stage .node .n-value{font:16px var(--font-mono);fill:var(--model)}.trace-stage .node.active rect{fill:#fff4e8;stroke:var(--attention);stroke-width:3}.trace-stage .node.active .n-value{fill:var(--attention);font-weight:700}.trace-stage .node.dim{opacity:.44}.edge-label{font:15px var(--font-mono);fill:#626760}.trace-stage .impact-box{fill:#fff4e8;stroke:var(--attention);stroke-width:1.5}.trace-stage .impact-k{font:15px var(--font-sans);fill:#663812}.trace-stage .impact-v{font:700 21px var(--font-mono);fill:var(--attention)}
.trace-side{width:330px;flex:none;display:flex;flex-direction:column;justify-content:space-between;padding:18px 0 8px 20px;border-left:1px solid rgba(32,37,34,.42)}.trace-side h2{font-size:var(--fs-h2);line-height:1.25;margin:0 0 9px}.rule{font-family:var(--font-mono);font-size:var(--fs-sec);line-height:1.55;border-left:3px solid var(--attention);padding:7px 0 7px 12px;margin:0;color:#3e443f}.received{margin-top:18px;min-height:92px}.received .label{font-size:var(--fs-label);color:#5a605a;display:block;margin-bottom:5px}.received output{font:700 29px var(--font-mono);color:var(--attention);font-variant-numeric:tabular-nums}.received .meaning{font-size:var(--fs-sec);line-height:1.42;margin:5px 0 0}.impact-list{border-top:1px solid #9c9f97;padding-top:12px;margin-top:14px}.impact-row{display:flex;align-items:center;justify-content:space-between;min-height:30px;font-family:var(--font-mono);font-size:var(--fs-label);color:#747972}.impact-row strong{font-size:var(--fs-body);color:#747972}.impact-row.visible{color:var(--text)}.impact-row.visible strong{color:var(--attention)}
.trace-bottom{display:flex;align-items:center;gap:12px;flex:none}.trace-bottom .caption{font-size:var(--fs-sec);line-height:1.4;margin:0;flex:1}.trace-bottom .caption strong{font-family:var(--font-serif);font-size:var(--fs-lead);color:var(--text)}.btns{display:flex;gap:8px;align-items:center}.trace-widget .btn{font:600 var(--fs-label) var(--font-sans);padding:9px 15px;border-radius:8px;border:2px solid #4d554e;background:transparent;color:var(--text);cursor:pointer;min-height:40px}.trace-widget .btn.primary{background:var(--attention);border-color:var(--attention);color:#fff}.trace-widget .btn:disabled{opacity:.4;cursor:not-allowed}.trace-widget .btn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
</style>
</head>
<body data-page="14" data-total="22">
<div id="stage">
  <header class="p14-head"><h1>误差逐层回传</h1><p>反向传播只是在问：<strong>这条连接对损失有多少影响？</strong></p></header>
  <section class="trace-widget" aria-label="反向传播可逆追踪器">
    <div class="trace-top">
      <p class="prompt"><b>操作：</b>按“回传一步”，从损失沿着刚才的计算路径倒着追踪。</p>
      <div class="stepper" aria-label="追踪进度"><span class="step-dot now">0</span><span class="step-dot">1</span><span class="step-dot">2</span><span class="step-dot">3</span><span class="step-dot">4</span></div>
    </div>
    <div class="trace-main min0">
      <div class="trace-stage min0" aria-label="一个神经元的前向与反向路径图">
        <svg viewBox="0 0 1050 480" role="img" aria-labelledby="graph-title graph-desc">
          <title id="graph-title">从损失回传到权重和偏置的计算图</title><desc id="graph-desc">蓝色实线是前向计算；橙色双线空心箭头按步骤显示反向影响。</desc>
          <defs><marker id="forwardArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#2457A6"/></marker><marker id="backArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M9,1 L1,5 L9,9" fill="none" stroke="#E76F2E" stroke-width="1.6"/></marker></defs>
          <rect class="zone" x="28" y="42" width="285" height="372" rx="8"/><text class="zone-label" x="47" y="72">输入与参数</text>
          <rect class="zone" x="365" y="42" width="215" height="372" rx="8"/><text class="zone-label" x="385" y="72">加权求和</text>
          <rect class="zone" x="635" y="42" width="160" height="372" rx="8"/><text class="zone-label" x="654" y="72">激活</text>
          <rect class="zone" x="850" y="42" width="170" height="372" rx="8"/><text class="zone-label" x="869" y="72">损失</text>
          <path class="forward" d="M208 174 C275 174 296 227 392 227"/><path class="forward" d="M208 320 C280 320 307 250 392 250"/><path class="forward" d="M548 238 L657 238"/><path class="forward" d="M773 238 L874 238"/>
          <text class="edge-label" x="270" y="160">x · w</text><text class="edge-label" x="287" y="323">+ b</text><text class="edge-label" x="585" y="221">σ(z)</text>
          <path data-back="1" class="back" d="M870 229 L778 229"/><path data-back="1" class="back" d="M870 237 L778 237"/>
          <path data-back="2" class="back" d="M653 229 L552 229"/><path data-back="2" class="back" d="M653 237 L552 237"/>
          <path data-back="3" class="back" d="M390 220 C303 220 285 179 211 179"/><path data-back="3" class="back" d="M390 228 C301 228 282 187 211 187"/>
          <path data-back="4" class="back" d="M390 258 C303 258 280 311 211 311"/><path data-back="4" class="back" d="M390 266 C306 266 282 319 211 319"/>
          <g class="node" data-node="w"><rect x="70" y="133" width="138" height="75" rx="8"/><text class="n-title" x="88" y="161">权重 w</text><text class="n-value" x="88" y="188">0.5000</text></g>
          <g class="node" data-node="b"><rect x="70" y="283" width="138" height="75" rx="8"/><text class="n-title" x="88" y="311">偏置 b</text><text class="n-value" x="88" y="338">−0.2000</text></g>
          <g class="node" data-node="x"><rect x="70" y="220" width="138" height="48" rx="8"/><text class="n-title" x="88" y="249">输入 x = 0.8</text></g>
          <g class="node" data-node="z"><rect x="392" y="195" width="156" height="85" rx="8"/><text class="n-title" x="412" y="225">加权和 z</text><text class="n-value" x="412" y="253">0.2000</text></g>
          <g class="node" data-node="y"><rect x="657" y="195" width="116" height="85" rx="8"/><text class="n-title" x="675" y="225">预测 ŷ</text><text class="n-value" x="675" y="253">0.5498</text></g>
          <g class="node active" data-node="loss"><rect x="874" y="195" width="125" height="85" rx="8"/><text class="n-title" x="892" y="225">损失 L</text><text class="n-value" x="892" y="253">0.1013</text></g>
          <g class="impact-annotation" visibility="hidden"><rect class="impact-box" x="620" y="330" width="300" height="60" rx="7"/><text class="impact-k" x="637" y="353"></text><text class="impact-v" x="637" y="377"></text></g>
        </svg>
      </div>
      <aside class="trace-side min0" aria-live="polite">
        <div><h2 data-head>第 0 步 · 从损失出发</h2><p class="rule" data-rule>先固定目标 y = 1，损失记录预测差了多少。</p><div class="received"><span class="label" data-label>当前读数</span><output data-value>0.1013</output><p class="meaning" data-meaning>这是本次预测的平方损失。</p></div></div>
        <div class="impact-list" aria-label="已分配的参数影响"><div class="impact-row" data-row="w"><span>权重 w 的影响</span><strong>—</strong></div><div class="impact-row" data-row="b"><span>偏置 b 的影响</span><strong>—</strong></div></div>
      </aside>
    </div>
    <div class="trace-bottom"><p class="caption" data-caption><strong>先看损失。</strong> 它是反向追踪的起点，不是参数更新命令。</p><div class="btns"><button class="btn" type="button" data-prev disabled>← 上一步</button><button class="btn primary" type="button" data-next>回传一步 →</button><button class="btn" type="button" data-reset>重置</button></div></div>
  </section>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script>
<script>
(() => {
  const root=document.querySelector('.trace-widget');
  const q=s=>root.querySelector(s), qa=s=>[...root.querySelectorAll(s)];
  // 组件契约：追踪损失沿计算图逐段分配的影响；主操作是可逆步进，证据是稳定图上的双线回传与本地读数；完成后才显示两个参数影响。无定时任务，reset 精确回到第 0 步。
  const x=0.8,w=0.5,b=-0.2,target=1;
  const z=Lec.P.weightedSum([x],[w],b);
  const y=Lec.P.activation('sigmoid',z);
  const loss=.5*(y-target)*(y-target);
  const dY=y-target, dZ=dY*Lec.P.activationDerivative('sigmoid',z,y), dW=dZ*x, dB=dZ;
  const F=n=>Number(n).toFixed(4).replace('-', '−');
  const entries=[
    {head:'第 0 步 · 从损失出发',rule:'先固定目标 y = 1，损失记录预测差了多少。',label:'当前读数',value:F(loss),meaning:'这是本次预测的平方损失。',node:'loss',caption:'先看损失。它是反向追踪的起点，不是参数更新命令。'},
    {head:'第 1 步 · 回到预测',rule:'预测 ŷ 每增加一点，损失减少 0.4502。',label:'传给预测 ŷ 的影响',value:F(dY),meaning:'负号表示：要让损失变小，预测应增大。',node:'y',back:1,caption:'损失先把“预测该往哪边动”传给 ŷ。'},
    {head:'第 2 步 · 穿过激活',rule:'sigmoid 在 z = 0.2 处只传递一部分影响。',label:'传给加权和 z 的影响',value:F(dZ),meaning:'这是 z 对最终损失的局部影响。',node:'z',back:2,caption:'激活函数把影响从预测传回加权和。'},
    {head:'第 3 步 · 分给权重',rule:'z 中的 w 前面乘着输入 x = 0.8。',label:'权重 w 的影响',value:F(dW),meaning:'输入越大，权重承担的影响越大。',node:'w',back:3,w:true,caption:'沿连接回去：w 对损失的影响 = −0.1114 × 0.8 = −0.0891。'},
    {head:'第 4 步 · 分给偏置',rule:'偏置 b 以 1 倍直接进入 z。',label:'偏置 b 的影响',value:F(dB),meaning:'它收到与 z 相同的影响量。',node:'b',back:4,w:true,b:true,caption:'完成：w 影响 −0.0891，b 影响 −0.1114。这里只分配影响，尚未更新参数。'}
  ];
  let state={step:0,destroyed:false};
  function render(){const e=entries[state.step];q('[data-head]').textContent=e.head;q('[data-rule]').textContent=e.rule;q('[data-label]').textContent=e.label;q('[data-value]').textContent=e.value;q('[data-meaning]').textContent=e.meaning;q('[data-caption]').innerHTML='<strong>'+e.caption.split('。')[0]+'。</strong>'+e.caption.slice(e.caption.indexOf('。')+1);
    qa('.step-dot').forEach((el,i)=>el.className='step-dot '+(i<state.step?'done':i===state.step?'now':''));qa('.node').forEach(el=>el.classList.toggle('active',el.dataset.node===e.node));qa('[data-back]').forEach(el=>el.classList.toggle('active',Number(el.dataset.back)<=state.step));
    const wr=q('[data-row="w"]'),br=q('[data-row="b"]');wr.classList.toggle('visible',!!e.w);br.classList.toggle('visible',!!e.b);wr.querySelector('strong').textContent=e.w?F(dW):'—';br.querySelector('strong').textContent=e.b?F(dB):'—';
    q('[data-prev]').disabled=state.step===0;q('[data-next]').disabled=state.step===4;q('[data-next]').textContent=state.step===4?'已完成':'回传一步 →';
  }
  function dispatch(action){if(state.destroyed)return;if(action==='next')state.step=Math.min(4,state.step+1);if(action==='prev')state.step=Math.max(0,state.step-1);if(action==='reset')state.step=0;render()}
  const abort=new AbortController();q('[data-next]').addEventListener('click',()=>dispatch('next'),{signal:abort.signal});q('[data-prev]').addEventListener('click',()=>dispatch('prev'),{signal:abort.signal});q('[data-reset]').addEventListener('click',()=>dispatch('reset'),{signal:abort.signal});
  root.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home'].includes(e.key)){e.stopPropagation();e.preventDefault();dispatch(e.key==='ArrowLeft'?'prev':e.key==='ArrowRight'?'next':'reset')}},{signal:abort.signal});
  function destroy(){if(state.destroyed)return;state.destroyed=true;abort.abort()} window.addEventListener('pagehide',destroy,{once:true});render();
})();
</script>
</body></html>
