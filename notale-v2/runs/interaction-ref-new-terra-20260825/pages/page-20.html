<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F4F1E8;--text:#20231f;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E76F2E}
#stage{box-sizing:border-box;padding:28px 56px;display:flex;flex-direction:column;gap:18px;overflow:hidden}
.p20-head{display:flex;align-items:end;justify-content:space-between;gap:32px;flex:0 0 auto;border-bottom:2px solid var(--text);padding-bottom:14px}
.p20-head h1{margin:0;font-size:var(--fs-h1);line-height:1.15;letter-spacing:.02em}
.p20-head .lead{margin:0;max-width:680px;font-size:var(--fs-lead);line-height:1.42}
.p20-widget{flex:1;min-height:0;display:flex;flex-direction:column;padding:23px 28px 20px;border-radius:8px;background:rgba(255,255,255,.3);box-shadow:inset 0 0 0 1px rgba(32,35,31,.22);position:relative}
.p20-widget *{box-sizing:border-box}.p20-widget button{font:inherit}.p20-widget .instruction{margin:0 0 12px;font-size:var(--fs-body);line-height:1.4}.p20-widget .instruction strong{color:var(--attention)}
.p20-widget .sortline{display:flex;align-items:stretch;flex:1;min-height:394px;gap:0;padding:28px 8px 18px;border-top:1px solid rgba(32,35,31,.27);border-bottom:1px solid rgba(32,35,31,.27)}
.p20-widget .slot{width:25%;min-width:0;display:flex;align-items:stretch;position:relative;padding:0 16px;border-right:1px dashed rgba(32,35,31,.38)}
.p20-widget .slot:last-child{border-right:0}.p20-widget .slot::before{content:attr(data-order);position:absolute;top:-20px;left:17px;color:rgba(32,35,31,.62);font-family:var(--font-mono);font-size:var(--fs-tick);letter-spacing:.08em}
.p20-widget .slot.drop-target{background:rgba(231,111,46,.1)}
.p20-widget .process-arrow{position:absolute;right:-13px;z-index:2;width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--text);font-size:18px;line-height:1}
.p20-widget .slot:last-child .process-arrow{display:none}
.p20-widget .step{width:100%;height:100%;min-height:0;text-align:left;cursor:grab;border:2px solid var(--text);border-radius:8px;background:#d5cdbd;padding:18px 17px 15px;display:flex;flex-direction:column;gap:8px;box-shadow:4px 4px 0 rgba(32,35,31,.12);transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
.p20-widget .step:hover{transform:translateY(-3px);box-shadow:6px 7px 0 rgba(32,35,31,.15)}.p20-widget .step:active{cursor:grabbing}.p20-widget .step:focus-visible{outline:3px solid var(--focus);outline-offset:4px}.p20-widget .step.selected{border-color:var(--attention);box-shadow:5px 5px 0 rgba(231,111,46,.23)}
.p20-widget .step .letter{font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;color:var(--attention);letter-spacing:.14em}.p20-widget .step .name{font-size:var(--fs-h2);font-weight:700;line-height:1.25}.p20-widget .step .desc{font-size:var(--fs-sec);line-height:1.42;color:rgba(32,35,31,.78)}.p20-widget .io{margin-top:auto;padding-top:11px;border-top:1px solid rgba(32,35,31,.24);font-size:var(--fs-label);line-height:1.42}.p20-widget .io span{display:block}.p20-widget .io b{display:inline-block;min-width:39px;color:var(--model);font-family:var(--font-mono);font-size:var(--fs-tick);letter-spacing:.06em}.p20-widget .why{margin-top:4px;padding:8px 9px;border-left:3px solid var(--attention);background:rgba(231,111,46,.07);font-size:var(--fs-label);line-height:1.4}.p20-widget .why b{font-family:var(--font-mono);font-size:var(--fs-tick);letter-spacing:.06em}
.p20-widget .controlbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:17px;flex:0 0 auto}.p20-widget .hint{margin:0;max-width:770px;font-size:var(--fs-label);line-height:1.4}.p20-widget .hint kbd{font-family:var(--font-mono);font-size:var(--fs-tick);padding:2px 6px;border:1px solid rgba(32,35,31,.5);border-radius:4px;background:#fffdf6}.p20-widget .btns{display:flex;gap:10px;flex:none}.p20-widget .btn{min-width:116px;min-height:43px;padding:7px 16px;border:2px solid var(--text);border-radius:8px;background:transparent;color:var(--text);font-size:var(--fs-label);font-weight:700;cursor:pointer}.p20-widget .btn.primary{background:var(--model);border-color:var(--model);color:#fff}.p20-widget .btn:hover{transform:translateY(-1px)}.p20-widget .btn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.p20-widget .feedback{margin-top:13px;min-height:57px;padding:12px 15px 10px;border-left:4px solid var(--attention);background:rgba(231,111,46,.09);font-size:var(--fs-sec);line-height:1.42}.p20-widget .feedback[data-state="ready"]{border-left-color:var(--model);background:rgba(36,87,166,.08)}.p20-widget .feedback strong{font-weight:800}.p20-widget .basis{display:none;margin-top:13px;padding:14px 16px;border-top:1px solid rgba(32,35,31,.3);font-size:var(--fs-sec);line-height:1.42}.p20-widget .basis.show{display:flex;gap:0}.p20-widget .basis span{flex:1;min-width:0;padding:0 15px;border-right:1px solid rgba(32,35,31,.25)}.p20-widget .basis span:first-child{padding-left:0}.p20-widget .basis span:last-child{border-right:0}.p20-widget .basis b{display:block;color:var(--model);font-family:var(--font-mono);font-size:var(--fs-label);margin-bottom:3px}
@media (prefers-reduced-motion:reduce){.p20-widget .step,.p20-widget .btn{transition:none}.p20-widget .step:hover,.p20-widget .btn:hover{transform:none}}
</style>
</head>
<body data-page="20" data-total="22">
<div id="stage">
  <header class="p20-head">
    <h1>排好一次学习</h1>
    <p class="lead">一次训练不是四件并列的事。把它们排成一条因果链：后一步必须拿到前一步留下的结果。</p>
  </header>
  <main class="p20-widget min0" aria-labelledby="sort-title">
    <p class="instruction" id="sort-title"><strong>拖动</strong>卡片来排序；或聚焦一张卡片后按 <kbd>←</kbd> <kbd>→</kbd> 移动。再检查这条学习链。</p>
    <div class="sortline no-pan" aria-label="训练步骤排序区">
      <div class="slot min0" data-order="位置 1"><span class="process-arrow" aria-hidden="true">→</span></div>
      <div class="slot min0" data-order="位置 2"><span class="process-arrow" aria-hidden="true">→</span></div>
      <div class="slot min0" data-order="位置 3"><span class="process-arrow" aria-hidden="true">→</span></div>
      <div class="slot min0" data-order="位置 4"><span class="process-arrow" aria-hidden="true">→</span></div>
    </div>
    <div class="controlbar">
      <p class="hint">卡片可用鼠标、触摸拖放；键盘操作时，左右箭头会与相邻步骤交换位置。</p>
      <div class="btns"><button class="btn primary" type="button" data-action="check">检查顺序</button><button class="btn" type="button" data-action="reset">重置</button></div>
    </div>
    <div class="feedback" data-state="ready" role="status" aria-live="polite">现在的第一步是“反向传播”。先试着找出：没有预测，能先知道误差吗？</div>
    <div class="basis" aria-label="正确顺序的依据">
      <span><b>A 前向预测</b>用当前参数算出预测值。</span><span><b>B 计算损失</b>把预测与目标的差压成一个数。</span><span><b>C 反向传播</b>把这份误差沿连接分给参数。</span><span><b>D 更新参数</b>按分到的方向移动参数。</span>
    </div>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  const root=document.querySelector('.p20-widget');
  const slots=[...root.querySelectorAll('.slot')];
  const feedback=root.querySelector('.feedback');
  const basis=root.querySelector('.basis');
  const signal=new AbortController();
  const initial=['C','A','D','B'];
  const steps={
    A:{name:'前向预测',desc:'用当前参数算出预测',needs:'训练样本 + 当前参数',gives:'预测值',why:'没有预测，就无从比较。'},
    B:{name:'计算损失',desc:'比较预测与目标的差',needs:'预测值 + 目标',gives:'损失（误差大小）',why:'损失把“差多少”变成一把尺。'},
    C:{name:'反向传播',desc:'把误差分给各个参数',needs:'损失 + 前向记录',gives:'每个参数的方向',why:'它说明每个参数该往哪边改。'},
    D:{name:'更新参数',desc:'把参数朝下降方向移动',needs:'参数方向',gives:'下一轮的新参数',why:'新参数会送回下一次预测。'}
  };
  let state={order:[...initial],drag:null,selected:null,checked:false};
  let destroyed=false;
  function message(){
    const o=state.order;
    if(!state.checked) return {kind:'ready',html:`现在的第一步是“${steps[o[0]].name}”。先试着找出：没有预测，能先知道误差吗？`};
    if(o.join('')==='ABCD') return {kind:'success',html:'<strong>顺序成立。</strong>预测先产生可比较的输出；损失才有对象；反向传播才有要分配的误差；最后才能更新参数。'};
    const first=o[0];
    if(first!=='A') return {kind:'error',html:`<strong>第一处断裂在位置 1：</strong>“${steps[first].name}”缺少前面的预测结果。先把“前向预测”放到开头。`};
    const expected=['A','B','C','D']; const i=o.findIndex((x,n)=>x!==expected[n]);
    const previous=expected[i-1];
    return {kind:'error',html:`<strong>第一处断裂在位置 ${i+1}：</strong>“${steps[o[i]].name}”不能紧接“${steps[previous].name}”。${previous==='A'?'预测结果要先被拿来计算损失。':previous==='B'?'只有得到损失，才有误差可反向分配。':'反向分配出的方向，才用于更新参数。'}`};
  }
  function render(){
    if(destroyed)return;
    slots.forEach((slot,i)=>{
      const key=state.order[i], info=steps[key];
      slot.innerHTML=`<span class="process-arrow" aria-hidden="true">→</span><button type="button" class="step ${state.selected===key?'selected':''}" draggable="true" data-key="${key}" aria-label="${key} ${info.name}，位置 ${i+1}，可拖动；键盘左右箭头可移动"><span class="letter">${key}</span><span class="name">${info.name}</span><span class="desc">${info.desc}</span><span class="io"><span><b>需要</b>${info.needs}</span><span><b>产生</b>${info.gives}</span></span><span class="why"><b>因此</b>${info.why}</span></button>`;
    });
    const m=message(); feedback.dataset.state=m.kind; feedback.innerHTML=m.html;
    basis.classList.toggle('show',m.kind==='success');
  }
  function move(from,to){
    if(from===to||from<0||to<0||from>3||to>3)return;
    const next=[...state.order]; const [item]=next.splice(from,1); next.splice(to,0,item);
    state={...state,order:next,checked:false}; render();
    const btn=root.querySelector(`[data-key="${item}"]`); if(btn)btn.focus();
  }
  root.addEventListener('dragstart',e=>{const b=e.target.closest('.step');if(!b)return;state.drag=b.dataset.key;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',state.drag);},{signal:signal.signal});
  root.addEventListener('dragover',e=>{const slot=e.target.closest('.slot');if(!slot||!state.drag)return;e.preventDefault();slots.forEach(s=>s.classList.toggle('drop-target',s===slot));},{signal:signal.signal});
  root.addEventListener('dragleave',e=>{const slot=e.target.closest('.slot');if(slot)slot.classList.remove('drop-target');},{signal:signal.signal});
  root.addEventListener('drop',e=>{const slot=e.target.closest('.slot');if(!slot)return;e.preventDefault();const from=state.order.indexOf(state.drag||e.dataTransfer.getData('text/plain'));const to=slots.indexOf(slot);state.drag=null;slots.forEach(s=>s.classList.remove('drop-target'));move(from,to);},{signal:signal.signal});
  root.addEventListener('dragend',()=>{state.drag=null;slots.forEach(s=>s.classList.remove('drop-target'));},{signal:signal.signal});
  root.addEventListener('click',e=>{const b=e.target.closest('.step');if(b){state={...state,selected:b.dataset.key};render();return;}const action=e.target.dataset.action;if(action==='check'){state={...state,checked:true};render();}if(action==='reset'){state={order:[...initial],drag:null,selected:null,checked:false};render();root.querySelector('.step')?.focus();}},{signal:signal.signal});
  root.addEventListener('keydown',e=>{const b=e.target.closest('.step');if(!b)return;const from=state.order.indexOf(b.dataset.key);if(e.key==='ArrowLeft'){e.preventDefault();e.stopPropagation();move(from,from-1);}if(e.key==='ArrowRight'){e.preventDefault();e.stopPropagation();move(from,from+1);}}, {signal:signal.signal});
  function destroy(){if(destroyed)return;destroyed=true;signal.abort();state.drag=null;}
  window.addEventListener('pagehide',destroy,{once:true});
  render();
  Deck.init({index:20,total:22});
})();
</script>
</body>
</html>
