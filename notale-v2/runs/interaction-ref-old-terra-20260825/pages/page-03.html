<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F4F1E8;--text:#252a31;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E76F2E}
*{box-sizing:border-box}
body{margin:0}
#stage{height:900px;padding:28px 56px;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--text)}
header{height:116px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid #252a31;padding:5px 0 20px;flex:none}
.kicker{margin:0 0 10px;font:600 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.09em;color:#5d6268}
h1{margin:0;font:700 var(--fs-h1)/1.15 var(--font-sans);letter-spacing:.01em}.header-note{width:370px;margin:20px 0 0;font:var(--fs-sec)/1.45 var(--font-sans);color:#50555b}
main{min-height:0;flex:1;display:flex;flex-direction:column;padding-top:24px}.prompt-row{height:100px;display:flex;align-items:center;justify-content:space-between;gap:30px;flex:none}.lead{max-width:960px;margin:0;font:var(--fs-lead)/1.45 var(--font-sans)}.lead strong{color:var(--attention);font-weight:750}.status{min-width:250px;padding:13px 16px;border-left:4px solid var(--attention);background:#f7e3d4;font:600 var(--fs-label)/1.4 var(--font-sans)}
.comparison{min-height:0;flex:1;display:flex;align-items:stretch;gap:28px;padding:15px 0 18px}.lane{min-width:0;flex:1;position:relative;display:flex;align-items:center;gap:16px;padding:50px 20px 35px;border:2px dashed #8b8e8f;border-radius:8px;background:#e8e5dc}.lane-title{position:absolute;top:14px;left:20px;margin:0;font:700 var(--fs-h2)/1 var(--font-sans)}.machine{min-width:0;flex:1;display:flex;align-items:center;justify-content:center;gap:18px}.readout{flex:none;width:184px;min-height:218px;padding:18px 12px;border:2px solid #343a40;border-radius:8px;background:#fffdf8;text-align:center;display:flex;flex-direction:column;justify-content:center}.readout.blue{border-color:var(--model);background:#e5edf9}.readout .label{font:700 var(--fs-h2)/1.25 var(--font-sans)}.readout .value{margin-top:14px;font:700 var(--fs-h1)/1 var(--font-mono);color:var(--model)}.readout .value.unknown{color:#777;font-family:var(--font-sans);font-size:var(--fs-h1)}.weight{width:126px;flex:none;text-align:center}.weight .knob{width:108px;height:108px;margin:0 auto 14px;border:2px solid #343a40;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fffdf8;font:700 var(--fs-h2)/1 var(--font-mono);position:relative}.weight .knob:before,.weight .knob:after{content:"";position:absolute;background:#343a40}.weight .knob:before{width:2px;height:12px;top:-11px}.weight .knob:after{width:2px;height:12px;bottom:-11px}.weight .weight-label{font:700 var(--fs-h2)/1.25 var(--font-sans)}.arrow{width:38px;height:28px;flex:none;position:relative;border-top:3px solid var(--model)}.arrow:after{content:"";position:absolute;right:-1px;top:-7px;width:13px;height:13px;border-top:3px solid var(--model);border-right:3px solid var(--model);transform:rotate(45deg)}.formula{position:absolute;bottom:12px;left:20px;right:20px;margin:0;display:flex;align-items:center;justify-content:center;gap:12px;font:700 var(--fs-h2)/1.25 var(--font-mono);color:#3d4349}.formula span{display:inline-flex;align-items:center;gap:5px}.formula em{font:600 var(--fs-label)/1.2 var(--font-sans);font-style:normal;color:#5a6066}.formula b{color:var(--model)}
.controls{height:124px;flex:none;display:flex;align-items:center;justify-content:space-between;border-top:2px solid #252a31;padding-top:18px}.control-copy{max-width:760px}.control-copy p{margin:0}.hint{font:var(--fs-body)/1.4 var(--font-sans)}.small{margin-top:9px!important;font:var(--fs-sec)/1.4 var(--font-sans);color:#585d63}.btns{display:flex;align-items:center;gap:12px}.btn{min-height:54px;padding:0 23px;border:2px solid #252a31;border-radius:8px;background:#fffdf8;color:var(--text);font:700 var(--fs-body)/1 var(--font-sans);cursor:pointer}.btn:hover{background:#f2ece0}.btn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.btn.primary{border-color:var(--attention);background:var(--attention);color:#fff}.btn[aria-pressed="true"]{box-shadow:inset 0 0 0 3px #252a31}.btn.reset{font-size:var(--fs-label);min-height:46px}.result-strip{position:absolute;right:20px;bottom:10px;display:none;padding:8px 11px;border-radius:6px;background:#e5edf9;color:#17477f;font:700 var(--fs-label)/1.3 var(--font-sans)}.revealed .result-strip{display:block}.revealed{border-style:solid}.revealed .readout{border-width:3px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body data-page="03" data-total="22">
<div id="stage">
  <header>
    <div><p class="kicker">从旋钮到神经元 · 加权</p><h1>同一输入，不同分量</h1></div>
    <p class="header-note">权重像一个可调旋钮：它决定同一个输入被放大多少。</p>
  </header>
  <main>
    <section class="prompt-row" aria-labelledby="question">
      <p class="lead" id="question">两边的输入都是 <strong>0.8</strong>。只看权重，哪一边的<strong>加权信号</strong>会更大？</p>
      <div class="status" id="status" aria-live="polite">先作出判断，再揭晓读数。</div>
    </section>
    <section class="comparison" aria-label="相同输入的加权信号对照">
      <article class="lane" id="left-lane" aria-label="左边：输入零点八，权重零点五">
        <h2 class="lane-title">左边</h2>
        <div class="machine min0">
          <div class="readout blue"><span class="label">输入</span><span class="value">0.8</span><span class="small">两边相同</span></div>
          <span class="arrow" aria-hidden="true"></span>
          <div class="weight"><div class="knob" aria-label="权重零点五">0.5</div><div class="weight-label">权重</div><div class="small">放大倍数</div></div>
          <span class="arrow" aria-hidden="true"></span>
          <div class="readout" id="left-output"><span class="label">加权信号</span><span class="value unknown">？</span><span class="small">输入 × 权重</span></div>
        </div>
        <p class="formula"><span><em>输入</em>0.8</span><span>×</span><span><em>权重</em>0.5</span><span>=</span><span><em>信号</em><b id="left-formula">？</b></span></p><div class="result-strip" id="left-result">0.40</div>
      </article>
      <article class="lane" id="right-lane" aria-label="右边：输入零点八，权重一点五">
        <h2 class="lane-title">右边</h2>
        <div class="machine min0">
          <div class="readout blue"><span class="label">输入</span><span class="value">0.8</span><span class="small">两边相同</span></div>
          <span class="arrow" aria-hidden="true"></span>
          <div class="weight"><div class="knob" aria-label="权重一点五">1.5</div><div class="weight-label">权重</div><div class="small">放大倍数</div></div>
          <span class="arrow" aria-hidden="true"></span>
          <div class="readout" id="right-output"><span class="label">加权信号</span><span class="value unknown">？</span><span class="small">输入 × 权重</span></div>
        </div>
        <p class="formula"><span><em>输入</em>0.8</span><span>×</span><span><em>权重</em>1.5</span><span>=</span><span><em>信号</em><b id="right-formula">？</b></span></p><div class="result-strip" id="right-result">1.20</div>
      </article>
    </section>
    <section class="controls" aria-label="判断控件">
      <div class="control-copy"><p class="hint">选择你认为更大的加权信号。</p><p class="small">加权信号 = 输入 × 权重。作答后，两边的现场计算结果会同时显示。</p></div>
      <div class="btns" role="group" aria-label="选择较大的加权信号">
        <button class="btn primary" type="button" data-choice="left" aria-pressed="false">左边更大</button>
        <button class="btn primary" type="button" data-choice="right" aria-pressed="false">右边更大</button>
        <button class="btn reset" type="button" id="reset">重新判断</button>
      </div>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  Deck.init({index:3,total:22});
  const input = 0.8;
  const weights = {left:0.5,right:1.5};
  function initialState(){ return {choice:null, revealed:false}; }
  let state = initialState();
  const buttons = [...document.querySelectorAll('[data-choice]')];
  const resetButton = document.getElementById('reset');
  const status = document.getElementById('status');
  const events = new AbortController();
  let destroyed = false;
  function signal(weight){ return Lec.P.weightedSum([input],[weight],0); }
  function transition(current, action){
    if(action.type === 'choose' && (action.choice === 'left' || action.choice === 'right')) return {choice:action.choice,revealed:true};
    if(action.type === 'reset') return initialState();
    return current;
  }
  function render(next){
    const left = signal(weights.left);
    const right = signal(weights.right);
    const revealed = next.revealed;
    document.getElementById('left-lane').classList.toggle('revealed',revealed);
    document.getElementById('right-lane').classList.toggle('revealed',revealed);
    for(const [side,value] of [['left',left],['right',right]]){
      document.querySelector('#'+side+'-output .value').textContent = revealed ? value.toFixed(2) : '？';
      document.querySelector('#'+side+'-output .value').classList.toggle('unknown',!revealed);
      document.getElementById(side+'-formula').textContent = revealed ? value.toFixed(2) : '？';
      document.getElementById(side+'-result').textContent = value.toFixed(2);
    }
    buttons.forEach(button => button.setAttribute('aria-pressed',String(revealed && button.dataset.choice === next.choice)));
    if(!revealed){ status.textContent='先作出判断，再揭晓读数。'; return; }
    status.textContent = next.choice === 'right' ? '右边更大：1.20 比 0.40 大。' : '读数揭晓：右边的 1.20 比左边的 0.40 大。';
  }
  function dispatch(action){ const next=transition(state,action); if(next===state)return; state=next; render(state); }
  buttons.forEach(button => button.addEventListener('click',()=>dispatch({type:'choose',choice:button.dataset.choice}),{signal:events.signal}));
  resetButton.addEventListener('click',()=>{ dispatch({type:'reset'}); buttons[0].focus(); },{signal:events.signal});
  function destroy(){ if(destroyed)return; destroyed=true; events.abort(); }
  window.addEventListener('pagehide',destroy,{once:true});
  render(state);
})();
</script>
</body>
</html>
