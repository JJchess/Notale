<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F4F1E8;--text:#202522;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E76F2E;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
#stage{height:900px;padding:28px 56px;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(90deg,transparent 0,transparent 55px,rgba(36,87,166,.12) 56px,transparent 57px),var(--bg)}
header{height:116px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid var(--text);padding:4px 0 18px;flex:none}
.kicker{font:600 var(--fs-label) var(--font-mono);letter-spacing:.11em;color:var(--model);margin-bottom:10px}
h1{font:700 var(--fs-h1) var(--font-sans);letter-spacing:.02em;margin:0}.sub{margin:9px 0 0;font:var(--fs-lead)/1.4 var(--font-sans)}
.target{width:260px;padding:13px 16px;border:2px solid var(--model);border-radius:8px;background:rgba(255,255,255,.38);text-align:center}.target .label{font:600 var(--fs-label) var(--font-sans)}.target strong{display:block;font:700 29px var(--font-mono);color:var(--model);margin-top:3px}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:23px 0 15px}.instruction{display:flex;align-items:center;gap:15px;min-height:44px;font:var(--fs-body)/1.4 var(--font-sans)}.step{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;flex:none;border-radius:50%;background:var(--attention);color:#fff;font:700 var(--fs-label) var(--font-mono)}
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:1fr 170px 1fr;gap:22px;align-items:stretch;margin-top:10px}.column{min-width:0;display:flex;flex-direction:column}.col-head{display:flex;align-items:center;gap:10px;height:39px;border-bottom:1px solid rgba(32,37,34,.55);font:700 var(--fs-h2) var(--font-sans)}.col-head small{font:var(--fs-label) var(--font-sans);font-weight:400}.choices{display:flex;flex-direction:column;gap:12px;padding-top:14px}
.choice{height:82px;width:100%;border:2px solid var(--text);border-radius:8px;background:rgba(255,255,255,.25);padding:0 18px;display:flex;align-items:center;justify-content:space-between;text-align:left;color:var(--text);font-family:var(--font-sans);cursor:pointer;transition:border-color .16s,background .16s,transform .16s}.choice:hover{background:rgba(231,111,46,.08)}.choice:focus-visible,.reset:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.choice .word{font:600 var(--fs-body) var(--font-sans)}.choice .value{font:700 22px var(--font-mono)}.choice.pred .value{color:var(--model)}.choice.loss .value{color:var(--text)}.choice.selected{border-color:var(--attention);background:rgba(231,111,46,.14);box-shadow:inset 6px 0 var(--attention)}.choice.matched{border-color:var(--model);background:rgba(36,87,166,.10);cursor:default}.pair-tag{margin-left:10px;padding:3px 7px;border:1px solid var(--model);border-radius:4px;color:var(--model);font:600 var(--fs-label) var(--font-mono)}.choice.wrong{border-color:var(--attention);animation:nudge .22s linear 2}
.connector{position:relative;display:flex;flex-direction:column;padding-top:53px;gap:12px}.link{height:82px;display:flex;align-items:center;justify-content:center;font:600 var(--fs-label) var(--font-mono);color:var(--text)}.link.active{color:var(--model)}.link .line{height:0;width:128px;border-top:2px dashed rgba(32,37,34,.45);position:relative}.link.active .line{border-top:3px double var(--model)}.link .line:after{content:"";position:absolute;right:-1px;top:-5px;width:9px;height:9px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(45deg)}
.evidence{height:124px;flex:none;border-top:2px solid var(--text);padding-top:15px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start}.formula{font:var(--fs-body)/1.45 var(--font-sans)}.formula b{font-family:var(--font-mono);color:var(--model)}.feedback{max-width:630px;min-height:50px;padding:9px 14px;border-left:5px solid var(--attention);background:rgba(231,111,46,.09);font:var(--fs-sec)/1.38 var(--font-sans)}.feedback.done{border-left-color:var(--model);background:rgba(36,87,166,.09)}
footer{height:53px;border-top:1px solid rgba(32,37,34,.6);display:flex;align-items:center;justify-content:space-between;flex:none}.count{font:var(--fs-label) var(--font-mono)}.count b{color:var(--model);font-size:20px}.reset{border:2px solid var(--text);border-radius:8px;background:transparent;padding:7px 16px;color:var(--text);font:600 var(--fs-label) var(--font-sans);cursor:pointer}.reset:hover{border-color:var(--attention);color:var(--attention)}
@keyframes nudge{50%{transform:translateX(5px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body data-page="08" data-total="22">
<div id="stage">
  <header>
    <div><div class="kicker">误差如何推动参数移动 · 01</div><h1>给误差一个分数</h1><p class="sub">同一个目标下，预测离得越远，损失就越大。</p></div>
    <div class="target"><div class="label">固定目标 y</div><strong>1.0000</strong></div>
  </header>
  <main>
    <div class="instruction"><span class="step">1</span><span>先点一个<span style="color:var(--model);font-weight:700">预测值</span>，再点它对应的<span style="color:var(--attention);font-weight:700">半平方损失</span>。每次配对都当场验算。</span></div>
    <div class="workspace" aria-label="预测值与损失配对区">
      <section class="column min0" aria-labelledby="pred-title"><div class="col-head" id="pred-title">预测值 <small>模型给出的 ŷ</small></div><div class="choices" id="predictions"></div></section>
      <div class="connector" id="connectors" aria-hidden="true"></div>
      <section class="column min0" aria-labelledby="loss-title"><div class="col-head" id="loss-title">半平方损失 <small>L = ½(预测 − 目标)²</small></div><div class="choices" id="losses"></div></section>
    </div>
    <div class="evidence"><div class="formula">损失把“差多少”压成一个数。<br><b>½ × (预测 − 1.0000)²</b>；数字越小，当前预测越靠近目标。</div><div id="feedback" class="feedback" aria-live="polite">从任意一个蓝色预测值开始。</div></div>
  </main>
  <footer><div class="count">已验证 <b id="count">0</b> / 4 组</div><button class="reset" id="reset" type="button">重置配对</button></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  Deck.init({index:8,total:22});
  const target = Number(Lec.K.lossTarget ?? Lec.K.target ?? 1);
  const predictions = [0.2,0.5498,0.8,0.95];
  const offeredLosses = [0.0200,0.3200,0.0013,0.1013];
  const predBox = document.getElementById('predictions');
  const lossBox = document.getElementById('losses');
  const connectorBox = document.getElementById('connectors');
  const feedback = document.getElementById('feedback');
  const count = document.getElementById('count');
  const resetButton = document.getElementById('reset');
  const events = new AbortController();
  let destroyed = false;
  function initialState(){ return {selected:null, matches:{}, wrong:null}; }
  let state = initialState();
  function lossAt(prediction){
    const difference = Lec.P.weightedSum([prediction],[1],-target);
    return 0.5 * difference * difference;
  }
  function expectedLoss(index){ return lossAt(predictions[index]); }
  function sameLoss(a,b){ return Math.abs(a-b) < 0.00006; }
  function transition(current, action){
    if(action.type === 'select'){
      if(Object.prototype.hasOwnProperty.call(current.matches,action.index)) return current;
      return {...current,selected:action.index,wrong:null};
    }
    if(action.type === 'pair'){
      if(current.selected === null || Object.values(current.matches).includes(action.index)) return current;
      const actual = expectedLoss(current.selected);
      if(!sameLoss(actual,offeredLosses[action.index])) return {...current,wrong:action.index};
      return {...current,selected:null,wrong:null,matches:{...current.matches,[current.selected]:action.index}};
    }
    return current;
  }
  function dispatch(action){ const next=transition(state,action); if(next===state)return; state=next; render(); }
  function render(){
    const matchedPreds=Object.keys(state.matches).map(Number); const matchedLosses=Object.values(state.matches);
    predBox.innerHTML=predictions.map((p,i)=>{const matched=matchedPreds.includes(i); const tag=matched?`<span class="pair-tag">配对 ${String.fromCharCode(65+i)}</span>`:''; return `<button type="button" class="choice pred ${state.selected===i?'selected':''} ${matched?'matched':''}" data-pred="${i}" ${matched?'disabled':''}><span class="word">预测 ŷ${tag}</span><span class="value">${p.toFixed(4)}</span></button>`}).join('');
    lossBox.innerHTML=offeredLosses.map((l,i)=>{const pairedPred=matchedPreds.find(p=>state.matches[p]===i); const matched=pairedPred!==undefined; const tag=matched?`<span class="pair-tag">配对 ${String.fromCharCode(65+pairedPred)}</span>`:''; return `<button type="button" class="choice loss ${matched?'matched':''} ${state.wrong===i?'wrong':''}" data-loss="${i}" ${matched?'disabled':''}><span class="word">损失 L${tag}</span><span class="value">${l.toFixed(4)}</span></button>`}).join('');
    connectorBox.innerHTML=predictions.map((p,i)=>{const matched=Object.prototype.hasOwnProperty.call(state.matches,i);return `<div class="link ${matched?'active':''}">${matched?'<span class="line"></span>':'<span>···</span>'}</div>`}).join('');
    count.textContent=matchedPreds.length;
    let message='先选择一个预测值；损失会把它与目标 1.0000 的距离变成可比较的数。';
    let done=false;
    if(state.selected!==null){ const p=predictions[state.selected]; const actual=expectedLoss(state.selected); message=`正在比较：½ × (${p.toFixed(4)} − 1.0000)² = ${actual.toFixed(4)}。现在点对应的损失。`; }
    if(state.wrong!==null){ message=`这组不相等。请看选中的预测值：把它代入公式，再比较算出的四位小数。`; }
    if(matchedPreds.length===4){ done=true; message='四组都验证了：预测越接近 1.0000，损失越小。学习会把参数朝着让损失下降的方向移动。'; }
    feedback.textContent=message; feedback.classList.toggle('done',done);
  }
  function clickHandler(event){ const p=event.target.closest('[data-pred]'); const l=event.target.closest('[data-loss]'); if(p) dispatch({type:'select',index:Number(p.dataset.pred)}); if(l) dispatch({type:'pair',index:Number(l.dataset.loss)}); }
  predBox.addEventListener('click',clickHandler,{signal:events.signal}); lossBox.addEventListener('click',clickHandler,{signal:events.signal});
  resetButton.addEventListener('click',()=>{ state=initialState(); render(); resetButton.focus(); feedback.textContent='已重置为四组未配对的预测值和损失。'; },{signal:events.signal});
  function destroy(){ if(destroyed)return; destroyed=true;events.abort(); }
  window.addEventListener('pagehide',destroy,{once:true});
  render();
})();
</script>
</body>
</html>
