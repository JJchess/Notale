<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pNN 单变量盲评 · 22 页</title>
<style>
  :root {
    --paper: #e7ecef;
    --surface: #f7f9fa;
    --ink: #16232c;
    --muted: #61707a;
    --line: #aebbc2;
    --a: #4357ad;
    --b: #087e78;
    --tie: #9b6a2f;
    --shadow: 0 18px 48px rgba(30, 50, 61, .13);
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      linear-gradient(90deg, transparent calc(50% - .5px), rgba(50,70,80,.14) 50%, transparent calc(50% + .5px)),
      var(--paper);
    font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  button, input, a { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 3px solid #e4973f;
    outline-offset: 3px;
  }
  .shell { width: min(1880px, 100%); margin: 0 auto; padding: 18px 24px 26px; }
  .topbar {
    display: grid;
    grid-template-columns: minmax(280px, 1fr) auto minmax(280px, 1fr);
    align-items: center;
    gap: 18px;
    min-height: 58px;
    border-block: 1px solid var(--line);
  }
  .identity { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
  .identity strong { font: 750 20px/1.1 Georgia, "Noto Serif SC", serif; letter-spacing: -.02em; }
  .identity span { color: var(--muted); font: 600 12px/1.2 ui-monospace, monospace; letter-spacing: .08em; }
  .nav { display: flex; align-items: center; gap: 8px; }
  .nav button, .utility button, .open-link {
    min-height: 36px;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--ink);
    background: rgba(255,255,255,.58);
    padding: 7px 12px;
    cursor: pointer;
    text-decoration: none;
  }
  .nav button:hover, .utility button:hover, .open-link:hover { background: #fff; border-color: #7e8f98; }
  .page-readout { min-width: 100px; text-align: center; font: 700 14px/1 ui-monospace, monospace; }
  .utility { display: flex; justify-content: flex-end; gap: 8px; }
  .status { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 18px; }
  .pane {
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
  .pane-head {
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px 0 16px;
    border-bottom: 1px solid var(--line);
  }
  .pane-id { display: flex; align-items: center; gap: 10px; }
  .badge {
    display: grid;
    width: 28px;
    height: 28px;
    place-items: center;
    color: #fff;
    border-radius: 50%;
    font: 800 13px/1 ui-monospace, monospace;
  }
  [data-arm="A"] .badge { background: var(--a); }
  [data-arm="B"] .badge { background: var(--b); }
  .pane-title { font-weight: 700; font-size: 14px; }
  .open-link { min-height: 30px; padding: 5px 9px; font-size: 12px; }
  .viewport { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #111; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  .review {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 18px;
    margin-top: 18px;
    padding: 14px 18px;
    border-block: 1px solid var(--line);
  }
  .vote { min-height: 46px; border: 1px solid currentColor; border-radius: 4px; background: transparent; font-weight: 750; cursor: pointer; }
  .vote[data-vote="A"] { color: var(--a); }
  .vote[data-vote="B"] { color: var(--b); }
  .vote[data-vote="tie"] { color: var(--tie); padding-inline: 22px; }
  .vote:hover, .vote.is-active { color: #fff; }
  .vote[data-vote="A"]:hover, .vote[data-vote="A"].is-active { background: var(--a); }
  .vote[data-vote="B"]:hover, .vote[data-vote="B"].is-active { background: var(--b); }
  .vote[data-vote="tie"]:hover, .vote[data-vote="tie"].is-active { background: var(--tie); }
  .rail-wrap { display: grid; grid-template-columns: auto 1fr auto; gap: 13px; align-items: center; margin-top: 16px; }
  .rail-label { color: var(--muted); font: 600 12px/1 ui-monospace, monospace; }
  .rail { display: grid; grid-template-columns: repeat(22, 1fr); gap: 4px; }
  .tick {
    position: relative;
    height: 28px;
    border: 0;
    border-bottom: 3px solid #a6b2b8;
    background: transparent;
    color: var(--muted);
    font: 600 10px/1 ui-monospace, monospace;
    cursor: pointer;
  }
  .tick:hover, .tick[aria-current="page"] { color: var(--ink); background: rgba(255,255,255,.55); }
  .tick[data-choice="A"] { border-color: var(--a); }
  .tick[data-choice="B"] { border-color: var(--b); }
  .tick[data-choice="tie"] { border-color: var(--tie); }
  .foot {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-top: 14px;
    color: var(--muted);
    font-size: 12px;
  }
  .counts { font-family: ui-monospace, monospace; white-space: nowrap; }
  @media (max-width: 980px) {
    .shell { padding-inline: 12px; }
    .topbar { grid-template-columns: 1fr; padding-block: 12px; }
    .nav, .utility { justify-content: center; }
    .identity { justify-content: center; }
    .compare-grid { grid-template-columns: 1fr; }
    .review { grid-template-columns: 1fr; }
    .vote[data-vote="tie"] { order: 3; }
    .rail { grid-template-columns: repeat(11, 1fr); row-gap: 8px; }
    .rail-wrap { grid-template-columns: 1fr; }
    .rail-label { display: none; }
    .foot { flex-direction: column; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="identity">
      <strong>pNN 单变量盲评</strong>
      <span>22 PAGES · LIVE</span>
    </div>
    <nav class="nav" aria-label="页面导航">
      <button id="prev" type="button" aria-label="上一页">←</button>
      <span class="page-readout"><span id="pageNow">01</span> / 22</span>
      <button id="next" type="button" aria-label="下一页">→</button>
    </nav>
    <div class="utility">
      <span id="saved" class="status" aria-live="polite">尚未评价</span>
      <button id="reload" type="button">重置本页</button>
      <button id="swap" type="button">交换左右</button>
    </div>
  </header>

  <section id="grid" class="compare-grid" aria-label="匿名页面对比">
    <article class="pane" data-arm="A">
      <header class="pane-head">
        <div class="pane-id"><span class="badge">A</span><span class="pane-title">方案 A</span></div>
        <a class="open-link" data-open="A" target="_blank" rel="noopener">单独打开</a>
      </header>
      <div class="viewport"><iframe data-frame="A" title="方案 A 页面"></iframe></div>
    </article>
    <article class="pane" data-arm="B">
      <header class="pane-head">
        <div class="pane-id"><span class="badge">B</span><span class="pane-title">方案 B</span></div>
        <a class="open-link" data-open="B" target="_blank" rel="noopener">单独打开</a>
      </header>
      <div class="viewport"><iframe data-frame="B" title="方案 B 页面"></iframe></div>
    </article>
  </section>

  <section class="review" aria-label="本页评价">
    <button class="vote" data-vote="A" type="button">A 更好 <small>按 1</small></button>
    <button class="vote" data-vote="tie" type="button">质量相当 <small>按 2</small></button>
    <button class="vote" data-vote="B" type="button">B 更好 <small>按 3</small></button>
  </section>

  <div class="rail-wrap">
    <span class="rail-label">PAGE 01</span>
    <nav id="rail" class="rail" aria-label="22 页评价进度"></nav>
    <span class="rail-label">PAGE 22</span>
  </div>
  <footer class="foot">
    <span>逐页操作两个页面后再投票。方向键切页；1 / 2 / 3 记录 A / 相当 / B。结果只保存在本机浏览器。</span>
    <span id="counts" class="counts">A 0 · 相当 0 · B 0 · 未评 22</span>
  </footer>
</main>
<script>
(() => {
  'use strict';
  const total = 22;
  const key = 'notale-blind-net-g2-pnnlean-v1';
  const state = JSON.parse(localStorage.getItem(key) || '{}');
  let page = Math.max(1, Math.min(total, Number(location.hash.slice(1)) || 1));
  let swapped = false;
  const two = n => String(n).padStart(2, '0');
  const path = arm => `blind/${arm}/page-${two(page)}.html`;
  const frames = arm => document.querySelector(`[data-frame="${arm}"]`);
  const opens = arm => document.querySelector(`[data-open="${arm}"]`);

  function renderRail() {
    const rail = document.getElementById('rail');
    rail.replaceChildren(...Array.from({length: total}, (_, i) => {
      const n = i + 1;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tick';
      b.textContent = two(n);
      b.title = `第 ${n} 页${state[n] ? ` · ${state[n]}` : ''}`;
      if (state[n]) b.dataset.choice = state[n];
      if (n === page) b.setAttribute('aria-current', 'page');
      b.addEventListener('click', () => go(n));
      return b;
    }));
  }

  function renderCounts() {
    const values = Object.values(state);
    const count = x => values.filter(v => v === x).length;
    document.getElementById('counts').textContent =
      `A ${count('A')} · 相当 ${count('tie')} · B ${count('B')} · 未评 ${total - values.length}`;
  }

  function render() {
    document.getElementById('pageNow').textContent = two(page);
    document.getElementById('prev').disabled = page === 1;
    document.getElementById('next').disabled = page === total;
    for (const arm of ['A', 'B']) {
      frames(arm).src = path(arm);
      opens(arm).href = path(arm);
    }
    document.querySelectorAll('.vote').forEach(b => {
      b.classList.toggle('is-active', b.dataset.vote === state[page]);
      b.setAttribute('aria-pressed', String(b.dataset.vote === state[page]));
    });
    document.getElementById('saved').textContent = state[page] ? `本页已记：${state[page] === 'tie' ? '相当' : state[page]}` : '本页尚未评价';
    renderRail();
    renderCounts();
    location.hash = two(page);
  }

  function go(n) {
    page = Math.max(1, Math.min(total, n));
    render();
  }

  function vote(choice) {
    state[page] = choice;
    localStorage.setItem(key, JSON.stringify(state));
    render();
    if (page < total) setTimeout(() => go(page + 1), 180);
  }

  document.getElementById('prev').addEventListener('click', () => go(page - 1));
  document.getElementById('next').addEventListener('click', () => go(page + 1));
  document.getElementById('reload').addEventListener('click', () => {
    for (const arm of ['A', 'B']) frames(arm).src = path(arm);
  });
  document.getElementById('swap').addEventListener('click', () => {
    const grid = document.getElementById('grid');
    const panes = [...grid.children];
    grid.replaceChildren(...panes.reverse());
    swapped = !swapped;
    document.getElementById('swap').textContent = swapped ? '恢复左右' : '交换左右';
  });
  document.querySelectorAll('.vote').forEach(b => b.addEventListener('click', () => vote(b.dataset.vote)));
  window.addEventListener('keydown', e => {
    if (e.target.closest('iframe, input, textarea, select, button, a')) return;
    if (e.key === 'ArrowLeft') go(page - 1);
    if (e.key === 'ArrowRight') go(page + 1);
    if (e.key === '1') vote('A');
    if (e.key === '2') vote('tie');
    if (e.key === '3') vote('B');
  });
  window.addEventListener('hashchange', () => {
    const n = Number(location.hash.slice(1));
    if (n && n !== page) { page = Math.max(1, Math.min(total, n)); render(); }
  });
  render();
})();
</script>
</body>
</html>
