<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习就是调参</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{display:flex;flex-direction:column;}
  .top{height:104px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid color-mix(in srgb,var(--text) 18%,transparent);}
  h1{margin:0;font-size:var(--fs-h1);line-height:1.18;font-weight:760;letter-spacing:.02em;}
  .eyebrow{font-size:var(--fs-label);line-height:1.4;color:color-mix(in srgb,var(--text) 62%,transparent);padding-top:10px;letter-spacing:.12em;}
  main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:34px;padding:34px 0 20px;}
  .claim{font-family:var(--font-serif);font-size:42px;line-height:1.28;text-align:center;margin:0;font-weight:650;}
  .claim strong{color:var(--model);font-weight:760;}
  .process{position:relative;flex:1;min-height:0;display:flex;align-items:center;padding:28px 86px 24px;background:color-mix(in srgb,var(--model) 5%,var(--bg));border-top:1px solid color-mix(in srgb,var(--model) 22%,transparent);border-bottom:1px solid color-mix(in srgb,var(--model) 22%,transparent);}
  .process-band{position:absolute;left:70px;width:1400px;top:50%;height:520px;transform:translateY(-50%);z-index:0;}
  .route{position:absolute;left:166px;right:166px;top:50%;height:4px;background:color-mix(in srgb,var(--text) 30%,transparent);transform:translateY(-2px);}
  .route::after{content:"";position:absolute;right:-2px;top:50%;width:18px;height:18px;border-top:4px solid var(--text);border-right:4px solid var(--text);transform:translateY(-50%) rotate(45deg);}
  .steps{position:relative;z-index:1;width:100%;display:flex;justify-content:space-between;align-items:center;}
  .step{width:400px;height:330px;box-sizing:border-box;padding:30px 42px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;text-align:center;background:color-mix(in srgb,var(--model) 10%,var(--bg));clip-path:polygon(0 0,calc(100% - 38px) 0,100% 50%,calc(100% - 38px) 100%,0 100%,38px 50%);}
  .step:first-child{clip-path:polygon(0 0,calc(100% - 38px) 0,100% 50%,calc(100% - 38px) 100%,0 100%);background:color-mix(in srgb,var(--text) 8%,var(--bg));}
  .step:last-child{background:color-mix(in srgb,var(--attention) 9%,var(--bg));}
  .mark{width:158px;height:158px;border-radius:50%;background:var(--bg);border:3px solid color-mix(in srgb,var(--text) 48%,transparent);display:flex;align-items:center;justify-content:center;position:relative;}
  .step:nth-child(2) .mark{border-color:var(--model);}
  .step:nth-child(3) .mark{border-color:var(--attention);}
  .icon{width:88px;height:88px;position:relative;}
  .try .sheet{position:absolute;left:17px;top:11px;width:54px;height:66px;border:4px solid var(--text);border-radius:5px;transform:rotate(-6deg);}
  .try .sheet::before,.try .sheet::after{content:"";position:absolute;left:10px;width:31px;height:4px;background:var(--model);}
  .try .sheet::before{top:17px}.try .sheet::after{top:34px;width:23px}
  .see .target{position:absolute;inset:4px;border:4px solid var(--model);border-radius:50%;box-shadow:inset 0 0 0 13px var(--bg),inset 0 0 0 17px var(--model),inset 0 0 0 30px var(--bg),inset 0 0 0 34px var(--model);}
  .see .dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--attention);right:12px;top:16px;}
  .fix::before{content:"";position:absolute;left:8px;top:44px;width:61px;height:4px;background:var(--text);transform:rotate(-25deg);transform-origin:left center;}
  .fix::after{content:"";position:absolute;right:7px;top:21px;width:23px;height:23px;border-top:5px solid var(--attention);border-right:5px solid var(--attention);transform:rotate(20deg);}
  .fix .end{position:absolute;right:7px;top:58px;width:22px;height:22px;border-radius:50%;background:var(--model);}
  .word{font-size:30px;line-height:1.15;font-weight:760;}
  .micro{font-size:var(--fs-sec);line-height:1.35;color:color-mix(in srgb,var(--text) 68%,transparent);}
  .takeaway{align-self:center;margin:0;padding:16px 30px;border-left:5px solid var(--model);font-size:var(--fs-lead);line-height:1.45;background:color-mix(in srgb,var(--model) 7%,transparent);}
</style>
</head>
<body data-page="01" data-total="22">
<div id="stage">
  <header class="top">
    <h1>神经网络是怎么学会的？</h1>
    <div class="eyebrow">先拆掉一个误解</div>
  </header>
  <main class="min0">
    <p class="claim"><span>它不是突然“懂了”，</span><span>而是把</span><strong>可调的部分</strong><span>一点点移到更好的位置。</span></p>
    <section class="process k-process min0" aria-label="尝试、看结果、修正的连续过程">
      <svg class="process-band" viewBox="0 0 1348 390" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 20H405L455 195 405 370H0L50 195Z" fill="#E7E4DC"/>
        <path d="M446 20H851L901 195 851 370H446L496 195Z" fill="#DDE5EF"/>
        <path d="M892 20H1298L1348 195 1298 370H892L942 195Z" fill="#F3DED2"/>
      </svg>
      <div class="route" aria-hidden="true"></div>
      <div class="steps">
        <div class="step">
          <div class="mark"><div class="icon try" aria-hidden="true"><span class="sheet"></span></div></div>
          <div class="word">尝试</div><div class="micro"><span>先</span><span>给出</span><span>一个结果</span></div>
        </div>
        <div class="step">
          <div class="mark"><div class="icon see" aria-hidden="true"><span class="target"></span><span class="dot"></span></div></div>
          <div class="word">看结果</div><div class="micro"><span>观察</span><span>离理想</span><span>还有多远</span></div>
        </div>
        <div class="step">
          <div class="mark"><div class="icon fix" aria-hidden="true"><span class="end"></span></div></div>
          <div class="word">修正</div><div class="micro"><span>让</span><span>下一次</span><span>更接近</span></div>
        </div>
      </div>
    </section>
    <p class="takeaway"><span>所谓“学习”，</span><span>首先是一连串</span><span>看得见的调整。</span></p>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:1,total:22});</script>
</body>
</html>
