<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习的四步</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{display:flex;flex-direction:column;gap:18px;}
  .head{height:88px;flex:0 0 88px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid color-mix(in srgb,var(--text) 22%,transparent);}
  h1{margin:0;font-size:var(--fs-h1);line-height:1.18;font-weight:760;letter-spacing:.01em;}
  .leadline{margin:8px 0 0;font-size:var(--fs-lead);line-height:1.4;color:color-mix(in srgb,var(--text) 76%,transparent);}
  .cycle-tag{font-family:var(--font-mono);font-size:var(--fs-label);line-height:1;border:1px solid color-mix(in srgb,var(--text) 28%,transparent);border-radius:999px;padding:10px 15px;margin-top:4px;white-space:nowrap;}
  .map{position:relative;flex:1;min-height:0;overflow:hidden;}
  .route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .steps{position:absolute;inset:54px 74px 128px;display:grid;grid-template-columns:repeat(4,1fr);gap:64px;align-items:center;}
  .step{position:relative;min-width:0;height:270px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-top:3px solid var(--model);border-bottom:1px solid color-mix(in srgb,var(--text) 28%,transparent);background:color-mix(in srgb,var(--bg) 90%,white);padding:24px 22px;}
  .badge{position:absolute;top:-25px;left:50%;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:2px solid var(--model);font:700 var(--fs-body)/1 var(--font-mono);color:var(--model);}
  .glyph{width:76px;height:76px;margin:2px 0 18px;color:var(--model);}
  .step h2{margin:0 0 12px;font-size:28px;line-height:1.15;font-weight:740;}
  .step p{margin:0;max-width:240px;font-size:var(--fs-body);line-height:1.5;}
  .link-label{position:absolute;top:191px;transform:translateX(-50%);padding:3px 9px;background:var(--bg);font-size:var(--fs-label);line-height:1.2;color:color-mix(in srgb,var(--text) 66%,transparent);white-space:nowrap;}
  .l1{left:25%;}.l2{left:50%;}.l3{left:75%;}
  .return-note{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--bg);font-size:var(--fs-body);line-height:1.4;white-space:nowrap;}
  .return-note strong{color:var(--attention);font-weight:750;}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--attention);box-shadow:0 0 0 5px color-mix(in srgb,var(--attention) 14%,transparent);}
  .takeaway{height:66px;flex:0 0 66px;display:flex;align-items:center;justify-content:center;border-top:1px solid color-mix(in srgb,var(--text) 24%,transparent);font-family:var(--font-serif);font-size:22px;line-height:1.4;font-weight:650;letter-spacing:.01em;}
</style>
</head>
<body data-page="02" data-total="22">
<div id="stage">
  <header class="head">
    <div>
      <h1>学习，是反复走完四步</h1>
      <p class="leadline">从一次预测出发，让下一次预测用上更合适的参数。</p>
    </div>
    <div class="cycle-tag" aria-label="循环过程">一轮学习</div>
  </header>

  <main class="map min0 k-process" aria-label="神经网络学习的四步循环">
    <svg class="route" viewBox="0 0 1488 654" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
          <path d="M1,1 L11,6 L1,11 Z" fill="#2457A6"/>
        </marker>
        <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
          <path d="M1,1 L11,6 L1,11 Z" fill="#E76F2E"/>
        </marker>
      </defs>
      <path d="M305 238 H452 M672 238 H819 M1039 238 H1186" fill="none" stroke="#2457A6" stroke-width="4" marker-end="url(#arrow-blue)"/>
      <path d="M1307 378 V490 Q1307 542 1255 542 H232 Q180 542 180 490 V378" fill="none" stroke="#E76F2E" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#arrow-orange)"/>
    </svg>

    <div class="steps">
      <section class="step min0">
        <span class="badge">1</span>
        <svg class="glyph" viewBox="0 0 80 80" aria-hidden="true"><rect x="8" y="20" width="42" height="40" rx="8" fill="none" stroke="currentColor" stroke-width="3"/><path d="M20 32h18M20 42h18M20 52h12M51 40h20M63 32l8 8-8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h2>预测</h2>
        <p>用当前参数<br>算出结果</p>
      </section>
      <section class="step min0">
        <span class="badge">2</span>
        <svg class="glyph" viewBox="0 0 80 80" aria-hidden="true"><circle cx="31" cy="39" r="20" fill="none" stroke="currentColor" stroke-width="3"/><path d="M45 53l17 17M22 39h18M31 30v18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        <h2>量误差</h2>
        <p>把预测与目标比较，<br>得到“差多远”</p>
      </section>
      <section class="step min0">
        <span class="badge">3</span>
        <svg class="glyph" viewBox="0 0 80 80" aria-hidden="true"><path d="M12 60c14-2 18-30 31-30 10 0 10 17 24 17" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M57 38l10 9-11 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="49" r="5" fill="currentColor"/></svg>
        <h2>找方向</h2>
        <p>判断参数往哪边动，<br>误差会更小</p>
      </section>
      <section class="step min0">
        <span class="badge">4</span>
        <svg class="glyph" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="24" fill="none" stroke="currentColor" stroke-width="3"/><path d="M40 16v11M40 53v11M16 40h11M53 40h11M29 29l22 22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="47" cy="47" r="7" fill="currentColor"/></svg>
        <h2>改参数</h2>
        <p>沿这个方向<br>移动一步</p>
      </section>
    </div>

    <span class="link-label l1">算完，再比较</span>
    <span class="link-label l2">看清差距</span>
    <span class="link-label l3">决定这一步</span>
    <div class="return-note"><span class="dot"></span><strong>新参数</strong><span>回到第 1 步，再来一轮</span></div>
  </main>

  <footer class="takeaway">先预测，再量误差；找到让误差变小的方向，然后改动参数。</footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:2,total:22});</script>
</body>
</html>
