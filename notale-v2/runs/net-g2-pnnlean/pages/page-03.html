<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>同一输入，不同分量</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid color-mix(in srgb,var(--text) 20%,transparent);padding-bottom:14px}
h1{font-size:var(--fs-h1);line-height:1.2;margin:0}.head p{font-size:var(--fs-sec);margin:0 0 3px;color:color-mix(in srgb,var(--text) 68%,transparent)}
.main{flex:1;display:flex;flex-direction:column;gap:18px}
.prompt{font-size:var(--fs-lead);line-height:1.4;margin:0;text-align:center}.prompt strong{font-weight:700}
.compare{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:74px;position:relative;align-items:stretch}
.compare:after{content:"只有权重不同";position:absolute;left:50%;top:17px;transform:translateX(-50%);font:var(--fs-label)/1.2 var(--font-sans);background:var(--bg);padding:4px 12px;color:color-mix(in srgb,var(--text) 65%,transparent);white-space:nowrap}
.case{display:flex;flex-direction:column;justify-content:center;gap:28px;padding:30px 42px;border:1px solid color-mix(in srgb,var(--text) 18%,transparent);border-top:3px solid color-mix(in srgb,var(--text) 36%,transparent);border-radius:8px;background:color-mix(in srgb,var(--model) 18%,var(--bg));box-shadow:inset 0 0 0 10px color-mix(in srgb,var(--bg) 55%,transparent)}
.case-title{display:flex;align-items:center;justify-content:space-between}.case-title h2{font-size:var(--fs-h2);margin:0}.same{font-size:var(--fs-label);color:color-mix(in srgb,var(--text) 65%,transparent)}
.flow{display:grid;grid-template-columns:170px 58px 190px 58px 1fr;align-items:center;gap:8px;min-height:250px}
.readout{border:1px solid color-mix(in srgb,var(--text) 30%,transparent);border-radius:8px;padding:18px 10px;text-align:center;background:color-mix(in srgb,var(--bg) 82%,white);min-height:190px;display:flex;flex-direction:column;justify-content:center}
.readout .lab,.knobbox .lab{display:block;font-size:var(--fs-label);margin-bottom:7px;color:color-mix(in srgb,var(--text) 68%,transparent)}
.readout .val{font:700 30px/1 var(--font-mono)}.arrow{height:2px;background:var(--model);position:relative}.arrow:after{content:"";position:absolute;right:-1px;top:-6px;border-left:12px solid var(--model);border-top:7px solid transparent;border-bottom:7px solid transparent}
.knobbox{text-align:center}.knob-face{width:130px;height:130px;margin:0 auto 12px;border:2px solid var(--text);border-radius:50%;position:relative;background:var(--bg);box-shadow:inset 0 0 0 12px color-mix(in srgb,var(--text) 4%,transparent)}.knob-face:after{content:"";position:absolute;width:4px;height:48px;background:var(--attention);left:62px;top:12px;transform-origin:2px 53px}.case-a .knob-face:after{transform:rotate(-45deg)}.case-b .knob-face:after{transform:rotate(45deg)}.knob-num{font:700 24px/1 var(--font-mono)}
.result{border:2px solid var(--model);border-radius:8px;padding:18px 12px;text-align:center;min-height:190px;display:flex;flex-direction:column;justify-content:center;background:color-mix(in srgb,var(--model) 24%,var(--bg))}.result .lab{font-size:var(--fs-label);margin-bottom:8px}.result .out{font:700 34px/1 var(--font-mono);color:var(--model)}.formula{font:var(--fs-sec)/1.3 var(--font-mono);text-align:center;min-height:22px;color:color-mix(in srgb,var(--text) 75%,transparent)}
.answer{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:16px 20px}.answer fieldset{border:0;padding:0;margin:0;display:flex;align-items:center;gap:12px}.answer legend{font-size:var(--fs-body);font-weight:700;float:left;margin-right:18px;padding:11px 0}.choice{position:relative}.choice input{position:absolute;opacity:0}.choice label{display:block;border:2px solid color-mix(in srgb,var(--text) 35%,transparent);border-radius:8px;padding:10px 25px;font-size:var(--fs-body);cursor:pointer;background:var(--bg)}.choice input:focus-visible+label{outline:3px solid var(--focus);outline-offset:3px}.choice input:checked+label{border-color:var(--attention);box-shadow:inset 0 -4px 0 var(--attention);font-weight:700}.feedback{font-size:var(--fs-sec);line-height:1.35;min-width:410px}.feedback strong{color:var(--attention)}
.reset{font-size:var(--fs-label);padding:10px 18px;white-space:nowrap}
</style>
</head>
<body data-page="03" data-total="22">
<div id="stage">
  <header class="head"><h1>同一输入，不同分量</h1><p>权重像输入旁边的倍率旋钮</p></header>
  <main class="main min0">
    <p class="prompt">输入都为 <strong>0.8</strong>。先猜：哪一种情况送出的<strong>加权信号</strong>更大？</p>
    <section class="compare min0" aria-label="情况 A 与情况 B 对照">
      <article class="case case-a min0">
        <div class="case-title"><h2>情况 A</h2><span class="same">输入相同</span></div>
        <div class="flow">
          <div class="readout"><span class="lab">输入</span><span class="val">0.8</span></div><span class="arrow" aria-hidden="true"></span>
          <div class="knobbox"><span class="lab">权重</span><div class="knob-face" aria-hidden="true"></div><span class="knob-num">× 0.5</span></div><span class="arrow" aria-hidden="true"></span>
          <div class="result"><span class="lab">加权信号</span><span class="out" id="out-a">？</span></div>
        </div><div class="formula" id="formula-a">0.8 × 0.5 = ？</div>
      </article>
      <article class="case case-b min0">
        <div class="case-title"><h2>情况 B</h2><span class="same">输入相同</span></div>
        <div class="flow">
          <div class="readout"><span class="lab">输入</span><span class="val">0.8</span></div><span class="arrow" aria-hidden="true"></span>
          <div class="knobbox"><span class="lab">权重</span><div class="knob-face" aria-hidden="true"></div><span class="knob-num">× 1.5</span></div><span class="arrow" aria-hidden="true"></span>
          <div class="result"><span class="lab">加权信号</span><span class="out" id="out-b">？</span></div>
        </div><div class="formula" id="formula-b">0.8 × 1.5 = ？</div>
      </article>
    </section>
    <section class="answer panel" aria-label="选择答案">
      <fieldset><legend>我的判断</legend>
        <span class="choice"><input type="radio" name="guess" id="guess-a" value="A"><label for="guess-a">A 更大</label></span>
        <span class="choice"><input type="radio" name="guess" id="guess-same" value="same"><label for="guess-same">一样大</label></span>
        <span class="choice"><input type="radio" name="guess" id="guess-b" value="B"><label for="guess-b">B 更大</label></span>
      </fieldset>
      <div class="feedback" id="feedback" aria-live="polite">选择后，同时揭晓两边的计算结果。</div>
      <button class="btn reset" id="reset" type="button">恢复未选择</button>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(()=>{
  Deck.init({index:3,total:22});
  const input=0.8, weights={A:0.5,B:1.5};
  const results={A:Lec.P.weightedSum([input],[weights.A],0),B:Lec.P.weightedSum([input],[weights.B],0)};
  const $=id=>document.getElementById(id), radios=[...document.querySelectorAll('input[name="guess"]')];
  const initialState=()=>({guess:null,revealed:false}); let state=initialState();
  function transition(s,a){if(a.type==='choose')return {guess:a.value,revealed:true};if(a.type==='reset')return initialState();return s}
  function render(){
    $('out-a').textContent=state.revealed?results.A.toFixed(2):'？'; $('out-b').textContent=state.revealed?results.B.toFixed(2):'？';
    $('formula-a').textContent=state.revealed?`0.8 × 0.5 = ${results.A.toFixed(2)}`:'0.8 × 0.5 = ？';
    $('formula-b').textContent=state.revealed?`0.8 × 1.5 = ${results.B.toFixed(2)}`:'0.8 × 1.5 = ？';
    radios.forEach(r=>r.checked=r.value===state.guess);
    $('feedback').innerHTML=!state.revealed?'选择后，同时揭晓两边的计算结果。':state.guess==='B'?'<strong>B 更大。</strong>输入相同，1.5 倍送出的加权信号更大。':'再看唯一变化的量：输入相同，权重从 0.5 变成了 1.5。';
  }
  function dispatch(a){state=transition(state,a);render()}
  const events=new AbortController(), opt={signal:events.signal};
  radios.forEach(r=>r.addEventListener('change',()=>dispatch({type:'choose',value:r.value}),opt));
  $('reset').addEventListener('click',()=>{dispatch({type:'reset'});$('guess-a').focus()},opt);
  let dead=false;function destroy(){if(dead)return;dead=true;events.abort()}window.addEventListener('pagehide',destroy,{once:true});
  render();
})();
</script>
</body>
</html>
