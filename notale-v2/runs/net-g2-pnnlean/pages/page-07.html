<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会算还不等于会学</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{display:flex;flex-direction:column;gap:18px}
  .head{height:88px;display:flex;align-items:flex-start;justify-content:space-between;gap:40px}
  h1{font-size:var(--fs-h1);line-height:1.18;margin:0 0 8px;font-weight:750;letter-spacing:.01em}
  .lead{margin:0;color:color-mix(in srgb,var(--text) 74%,transparent);max-width:930px}
  .chapter{font:600 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.08em;padding-top:9px;white-space:nowrap;color:color-mix(in srgb,var(--text) 60%,transparent)}
  .main{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
  .model{flex:1;min-height:0;position:relative;border-top:1px solid color-mix(in srgb,var(--text) 22%,transparent);border-bottom:1px solid color-mix(in srgb,var(--text) 22%,transparent);background:linear-gradient(90deg,transparent 0 69%,color-mix(in srgb,var(--attention) 5%,transparent) 69% 100%)}
  .model svg{display:block;width:100%;height:100%}
  .bottom{height:150px;display:grid;grid-template-columns:1.35fr .95fr;gap:34px}
  .verdict{display:flex;align-items:center;gap:25px;padding:20px 28px;border-left:6px solid var(--model);background:color-mix(in srgb,var(--model) 7%,transparent)}
  .mark{font:750 28px/1 var(--font-sans);color:var(--model);white-space:nowrap}
  .verdict p{font:600 var(--fs-lead)/1.45 var(--font-serif);margin:0}
  .missing{display:flex;align-items:center;gap:20px;padding:18px 24px;border:2px dashed color-mix(in srgb,var(--attention) 75%,transparent);border-radius:8px}
  .qmark{width:62px;height:62px;display:grid;place-items:center;border-radius:50%;background:var(--attention);color:#fff;font:750 34px/1 var(--font-sans);flex:none}
  .missing strong{display:block;font-size:var(--fs-h2);line-height:1.25;margin-bottom:5px}
  .missing span{font-size:var(--fs-sec);line-height:1.4;color:color-mix(in srgb,var(--text) 72%,transparent)}
  .svg-label{font:600 16px var(--font-sans);fill:var(--text)}
  .svg-small{font:500 15px var(--font-sans);fill:color-mix(in srgb,var(--text) 68%,transparent)}
  .svg-num{font:700 24px var(--font-mono);fill:var(--model)}
  .svg-title{font:700 22px var(--font-sans);fill:var(--text)}
  .svg-note{font:700 18px var(--font-sans);fill:var(--attention)}
</style>
</head>
<body data-page="07" data-total="22">
<div id="stage">
  <header class="head">
    <div><h1>会算，还不等于会学</h1><p class="lead">同一个神经元完成了一次预测。沿着计算路径看：哪些变了，哪些没有变？</p></div>
    <div class="chapter">第一章 · 从旋钮到神经元</div>
  </header>

  <main class="main min0">
    <section class="model min0" aria-label="神经元完成计算但参数保持不变的流程图">
      <svg viewBox="0 0 1488 548" role="img" aria-labelledby="flowTitle flowDesc">
        <title id="flowTitle">一次前向计算与未改变的参数</title>
        <desc id="flowDesc">输入零点八与权重零点五、偏置负零点二进入同一个神经元，经过加权和激活得到预测零点五四九八。计算后权重和偏置仍为原值，尚缺衡量结果好坏的数字和推动参数改变的过程。</desc>
        <defs>
          <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2457A6"/></marker>
          <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4d5156"/></marker>
        </defs>

        <text x="34" y="48" class="svg-title">给定参数，完成一次计算</text>
        <line x1="34" y1="68" x2="1012" y2="68" stroke="#4d5156" stroke-opacity=".3"/>

        <text x="80" y="145" class="svg-label">输入</text>
        <rect x="58" y="166" width="138" height="78" rx="8" fill="#fff" stroke="#2457A6" stroke-width="2"/>
        <text x="127" y="215" text-anchor="middle" class="svg-num">0.8</text>

        <text x="305" y="126" class="svg-label">可调参数</text>
        <g transform="translate(322 190)"><circle r="54" fill="#f8f6f0" stroke="#4d5156" stroke-width="2"/><line x1="0" y1="0" x2="35" y2="-28" stroke="#2457A6" stroke-width="5" stroke-linecap="round"/><circle r="8" fill="#2457A6"/></g>
        <text x="322" y="275" text-anchor="middle" class="svg-num">w = 0.5</text>
        <g transform="translate(492 190)"><circle r="54" fill="#f8f6f0" stroke="#4d5156" stroke-width="2"/><line x1="0" y1="0" x2="-16" y2="-42" stroke="#2457A6" stroke-width="5" stroke-linecap="round"/><circle r="8" fill="#2457A6"/></g>
        <text x="492" y="275" text-anchor="middle" class="svg-num">b = −0.2</text>

        <path d="M196 205H250" fill="none" stroke="#2457A6" stroke-width="4" marker-end="url(#arrowBlue)"/>
        <path d="M548 205H628" fill="none" stroke="#2457A6" stroke-width="4" marker-end="url(#arrowBlue)"/>
        <rect x="646" y="142" width="218" height="126" rx="8" fill="#fff" stroke="#2457A6" stroke-width="3"/>
        <text x="755" y="191" text-anchor="middle" class="svg-title">同一个神经元</text>
        <text x="755" y="229" text-anchor="middle" class="svg-label">加权 → 激活</text>
        <path d="M864 205H939" fill="none" stroke="#2457A6" stroke-width="4" marker-end="url(#arrowBlue)"/>

        <text x="975" y="145" class="svg-label">预测</text>
        <rect x="952" y="166" width="174" height="78" rx="8" fill="#fff" stroke="#2457A6" stroke-width="2"/>
        <text id="pred" x="1039" y="215" text-anchor="middle" class="svg-num">0.5498</text>

        <line x1="1166" y1="28" x2="1166" y2="520" stroke="#E76F2E" stroke-opacity=".28" stroke-dasharray="7 8"/>
        <text x="1210" y="48" class="svg-title">算完以后</text>
        <text x="1210" y="84" class="svg-small">检查参数旋钮</text>
        <path d="M1126 205C1170 205 1178 166 1212 166" fill="none" stroke="#4d5156" stroke-width="2.5" marker-end="url(#arrowGray)"/>
        <rect x="1212" y="128" width="222" height="114" rx="8" fill="#fff" stroke="#4d5156" stroke-width="2"/>
        <text x="1323" y="175" text-anchor="middle" class="svg-num">w = 0.5</text>
        <text x="1323" y="213" text-anchor="middle" class="svg-num">b = −0.2</text>
        <text x="1323" y="278" text-anchor="middle" class="svg-note">仍是原值</text>

        <path d="M1323 300V385H1020" fill="none" stroke="#E76F2E" stroke-width="3" stroke-dasharray="10 9"/>
        <circle cx="1000" cy="385" r="19" fill="#E76F2E"/><text x="1000" y="392" text-anchor="middle" style="font:700 22px var(--font-sans);fill:white">?</text>
        <text x="1210" y="424" class="svg-label">没有信号推动旋钮改变</text>

        <path d="M80 354H902" stroke="#4d5156" stroke-opacity=".24" stroke-width="2"/>
        <text x="80" y="397" class="svg-small">这条前向路径回答：</text>
        <text x="80" y="434" class="svg-title">“按现在的参数，预测是多少？”</text>
        <text x="80" y="486" class="svg-small">它还没有回答：</text>
        <text x="80" y="523" class="svg-title">“这个结果够不够好，参数该不该变？”</text>
      </svg>
    </section>

    <section class="bottom min0">
      <div class="verdict min0"><div class="mark">会算 ✓</div><p>给定输入、权重和偏置，神经元已经能得到预测。</p></div>
      <div class="missing min0"><div class="qmark">?</div><div><strong>离“会学”还差一步</strong><span>先要有一个数字，衡量结果的好坏。</span></div></div>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Deck.init({index:7,total:22});
  const result = Lec.P.neuronForward([0.8],[0.5],-0.2,'sigmoid');
  const value = typeof result === 'number' ? result : (result.output ?? result.y ?? result.activation);
  if (Number.isFinite(value)) document.getElementById('pred').textContent = value.toFixed(4);
</script>
</body>
</html>
