<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>扫描误差曲线</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:28px}
h1{font-size:var(--fs-h1);margin:0 0 7px;line-height:1.15}
.lead{margin:0;max-width:920px}.fixed{font-size:var(--fs-sec);line-height:1.5;text-align:right;color:color-mix(in srgb,var(--text) 72%,transparent);white-space:nowrap}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;min-height:0}
.figure-panel{display:flex;flex-direction:column;min-height:0;border-top:2px solid color-mix(in srgb,var(--text) 24%,transparent);padding-top:14px}
.figure-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:6px}.figure-head h2{font-size:var(--fs-h2);margin:0}.legend-note{font-size:var(--fs-label);display:flex;align-items:center;gap:9px}.linekey{width:34px;border-top:3px solid var(--model)}
#chart{flex:1;min-height:410px;width:100%}
figcaption{font-size:var(--fs-label);line-height:1.45;margin-top:4px;color:color-mix(in srgb,var(--text) 72%,transparent)}
aside{display:flex;flex-direction:column;gap:15px;min-height:0}.panel{padding:18px 20px}.panel h2{font-size:var(--fs-h2);margin:0 0 13px}
.instruction{font-size:var(--fs-body);line-height:1.45;margin:0 0 15px}.orange{color:var(--attention);font-weight:700}
input[type=range]{width:100%;margin:8px 0 5px}.range-ends{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:var(--fs-tick)}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.readout{border-left:3px solid color-mix(in srgb,var(--text) 24%,transparent);padding-left:11px}.readout.primary{border-color:var(--attention);grid-column:1/-1}.readout span{display:block;font-size:var(--fs-label);margin-bottom:3px}.readout strong{font-family:var(--font-mono);font-size:26px;color:var(--model)}.readout.primary strong{font-size:34px;color:var(--attention)}
.btnrow{display:flex;gap:10px;align-items:center}.btn{font-size:var(--fs-label)}
.trail-panel{flex:1;display:flex;flex-direction:column;min-height:0}.trail-head{display:flex;justify-content:space-between;align-items:baseline}.trail-head h2{margin:0}.count{font-family:var(--font-mono);font-size:var(--fs-label)}
.trace-list{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;overflow:hidden}.trace-list li{display:grid;grid-template-columns:58px 1fr 1fr;gap:8px;font-family:var(--font-mono);font-size:var(--fs-label);padding-bottom:6px;border-bottom:1px solid color-mix(in srgb,var(--text) 14%,transparent)}.trace-list li span:first-child{color:var(--attention);font-weight:700}.empty{font-family:var(--font-sans)!important;color:color-mix(in srgb,var(--text) 62%,transparent);line-height:1.45;display:block!important}
.note{font-size:var(--fs-sec);line-height:1.45;margin:0;padding:12px 15px;border-left:4px solid var(--attention);background:color-mix(in srgb,var(--attention) 7%,transparent)}
</style>
</head>
<body data-page="09" data-total="22">
<div id="stage">
<header>
  <div><h1>扫描误差曲线</h1><p class="lead">同一个样本下，每个权重位置都对应一个确定的预测与损失。</p></div>
  <div class="fixed">固定条件　x = 0.8　·　目标 y = 1<br>b = −0.2　·　sigmoid　·　半平方损失</div>
</header>
<main>
  <figure class="figure-panel min0" aria-labelledby="curve-title curve-caption">
    <div class="figure-head"><h2 id="curve-title">参数—损失地形</h2><div class="legend-note"><i class="linekey"></i>固定规则下的完整曲线</div></div>
    <div id="chart" role="img" aria-label="权重从负二到四时，半平方损失随权重变化的曲线；橙色探针表示当前选择"></div>
    <figcaption id="curve-caption">横轴是权重位置，不是训练时间。曲线由每隔 0.02 的现场计算连接而成；纵轴固定为 0～0.50。</figcaption>
  </figure>
  <aside class="min0">
    <section class="panel">
      <h2>移动探针</h2>
      <p class="instruction">拖动横尺，观察<span class="orange">橙色落点</span>和三个读数同步变化。</p>
      <input id="weight" type="range" min="-2" max="4" step="0.1" value="0.5" aria-label="权重 w" aria-describedby="keyhint">
      <div class="range-ends"><span>−2.0</span><span>4.0</span></div>
      <p id="keyhint" class="hint">方向键每次 0.1；Shift＋方向键每次 0.5</p>
      <div class="readouts" aria-live="polite">
        <div class="readout primary"><span>当前权重 w</span><strong id="wout">0.5</strong></div>
        <div class="readout"><span>预测</span><strong id="pout">0.5498</strong></div>
        <div class="readout"><span>损失</span><strong id="lout">0.1013</strong></div>
      </div>
    </section>
    <p class="note"><strong>这里只观察，不更新权重。</strong><br>移动的是探针；样本、规则和曲线都不变。</p>
    <section class="panel trail-panel">
      <div class="trail-head"><h2>已测位置</h2><span class="count" id="count">0 / 24</span></div>
      <ul class="trace-list" id="trace"><li class="empty">拖动后会保留“权重—预测—损失”配对。</li></ul>
      <div class="btnrow"><button class="btn" id="reset" type="button">清除并回到 0.5</button></div>
    </section>
  </aside>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:9,total:22});
  var pageK=(Lec.K&&Lec.K.p09)||{};
  var C={x:pageK.x==null?0.8:pageK.x,y:pageK.y==null?1:pageK.y,b:pageK.b==null?-0.2:pageK.b,min:pageK.wMin==null?-2:pageK.wMin,max:pageK.wMax==null?4:pageK.wMax,initial:pageK.initialW==null?0.5:pageK.initialW};
  function calc(w){
    var f=Lec.P.neuronForward([C.x],[w],C.b,'sigmoid');
    var prediction=typeof f==='number'?f:(f.output!=null?f.output:(Array.isArray(f.outputs)?f.outputs[0]:f));
    var lv,loss;
    try{lv=Lec.P.lossValueAndGradient([prediction],[C.y],'halfSquaredError');loss=typeof lv==='number'?lv:(lv.loss!=null?lv.loss:lv.value);}
    catch(e){loss=0.5*(prediction-C.y)*(prediction-C.y);} /* 兼容旧版 lec 的损失命名表 */
    return {w:+w,prediction:+prediction,loss:+loss};
  }
  var curve=[]; for(var i=0;i<=300;i++){curve.push(calc(+(C.min+i*0.02).toFixed(2)));}
  var state={w:C.initial,traces:[]};
  var chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
  var input=document.getElementById('weight'),wout=document.getElementById('wout'),pout=document.getElementById('pout'),lout=document.getElementById('lout'),trace=document.getElementById('trace'),count=document.getElementById('count');
  function render(){
    var current=calc(state.w);
    wout.textContent=current.w.toFixed(1); pout.textContent=current.prediction.toFixed(4); lout.textContent=current.loss.toFixed(4); input.value=current.w;
    trace.innerHTML=state.traces.length?state.traces.slice(-6).reverse().map(function(d){return '<li><span>w '+d.w.toFixed(1)+'</span><span>预测 '+d.prediction.toFixed(4)+'</span><span>损失 '+d.loss.toFixed(4)+'</span></li>';}).join(''):'<li class="empty">拖动后会保留“权重—预测—损失”配对。</li>';
    count.textContent=state.traces.length+' / 24';
    chart.setOption({animation:false,textStyle:{fontSize:16,fontFamily:'sans-serif',color:'#26313b'},grid:{left:78,right:34,top:38,bottom:66},tooltip:{trigger:'axis',confine:true,textStyle:{fontSize:16},formatter:function(ps){var d=calc(ps[0].axisValue);return 'w = '+d.w.toFixed(2)+'<br>预测 = '+d.prediction.toFixed(4)+'<br>损失 = '+d.loss.toFixed(4);}},xAxis:{type:'value',min:C.min,max:C.max,interval:1,name:'权重 w',nameLocation:'middle',nameGap:42,nameTextStyle:{fontSize:16,fontWeight:600},axisLabel:{fontSize:13,formatter:function(v){return v.toFixed(1);}},axisLine:{lineStyle:{color:'#657078'}},splitLine:{show:false}},yAxis:{type:'value',min:0,max:0.5,interval:0.1,name:'半平方损失',nameGap:52,nameLocation:'middle',nameTextStyle:{fontSize:16,fontWeight:600},axisLabel:{fontSize:13,formatter:function(v){return v.toFixed(2);}},axisLine:{show:true,lineStyle:{color:'#657078'}},splitLine:{lineStyle:{color:'rgba(38,49,59,.13)'}}},series:[{id:'curve',name:'损失曲线',type:'line',data:curve.map(function(d){return [d.w,d.loss];}),showSymbol:false,silent:false,lineStyle:{color:'#2457A6',width:4}},{id:'traces',name:'已测位置',type:'scatter',data:state.traces.map(function(d){return [d.w,d.loss];}),symbolSize:9,itemStyle:{color:'#2457A6',opacity:.45}},{id:'probe',name:'当前探针',type:'scatter',data:[[current.w,current.loss]],symbolSize:18,itemStyle:{color:'#E76F2E',borderColor:'#fff',borderWidth:3},markLine:{silent:true,symbol:'none',label:{show:false},lineStyle:{color:'#E76F2E',width:2,type:'dashed'},data:[{xAxis:current.w}]}}]},{notMerge:true});
  }
  function setState(patch,record){state={w:patch.w==null?state.w:Math.max(C.min,Math.min(C.max,+patch.w.toFixed(1))),traces:patch.traces||state.traces};if(record){var d=calc(state.w),next=state.traces.filter(function(t){return t.w!==d.w;});next.push(d);state.traces=next.slice(-24);}render();}
  input.addEventListener('input',function(){setState({w:+this.value},true);});
  input.addEventListener('keydown',function(e){if(e.shiftKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();setState({w:state.w+(e.key==='ArrowRight'?0.5:-0.5)},true);}});
  document.getElementById('reset').addEventListener('click',function(){state={w:C.initial,traces:[]};render();input.focus();});
  var ro=new ResizeObserver(function(){chart.resize();});ro.observe(document.getElementById('chart'));
  window.addEventListener('pagehide',function cleanup(){ro.disconnect();chart.dispose();},{once:true});
  render();
})();
</script>
</body>
</html>
