<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三种步长</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{gap:18px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex:0 0 auto}
  h1{font-size:var(--fs-h1);line-height:1.15;margin:0 0 8px;font-weight:800;letter-spacing:.02em}
  .lead{margin:0;max-width:920px}
  .formula{font-family:var(--font-mono);font-size:var(--fs-sec);padding:10px 16px;border-left:4px solid var(--model);background:rgba(36,87,166,.06);white-space:nowrap}
  .workspace{flex:1;display:flex;gap:22px;min-height:0}
  .chart-panel{flex:1;min-width:0;display:flex;flex-direction:column;padding:18px 22px 14px;background:rgba(255,255,255,.38);border:1px solid rgba(35,45,55,.22);border-radius:8px}
  .chart-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:6px}
  .chart-top h2,.side h2{font-size:var(--fs-h2);margin:0}
  .legend{display:flex;gap:20px;font-size:var(--fs-label);align-items:center}
  .legend span{display:flex;align-items:center;gap:7px}.swline{width:26px;height:0;border-top:4px solid}
  #plot{width:100%;flex:1;min-height:0;display:block;overflow:visible}
  .side{width:410px;display:flex;flex-direction:column;gap:14px;min-width:0}
  .panel{padding:16px 18px}
  .focus-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .focus-tabs .btn{padding:10px 8px;font-family:var(--font-mono);font-size:var(--fs-label)}
  .focus-tabs .btn[aria-pressed="true"]{background:var(--attention);color:white;border-color:var(--attention)}
  .readout{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .metric{padding:10px 12px;background:rgba(36,87,166,.07);border-radius:8px}
  .metric .lab{font-size:var(--fs-label);display:block;margin-bottom:3px;color:rgba(30,38,45,.72)}
  .metric strong{font-family:var(--font-mono);font-size:24px;font-variant-numeric:tabular-nums}
  .stepmetric{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between}
  .stepmetric strong{font-size:30px;color:var(--model)}
  .controls{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}.controls .btn{flex:1;min-width:105px}
  .btn.attn{border-color:var(--attention);color:var(--attention)}
  .interpret{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 20px;border-left:4px solid var(--attention)}
  .interpret strong{font-size:var(--fs-lead);margin-bottom:8px}.interpret p{font-size:var(--fs-sec);line-height:1.5;margin:0}
  .hint{margin:0}.status{min-height:24px;font-size:var(--fs-label);line-height:1.4;margin-top:10px}
  svg text{font-family:var(--font-sans);fill:var(--text)}
  .axis{stroke:rgba(35,45,55,.55);stroke-width:1.5}.grid{stroke:rgba(35,45,55,.13);stroke-width:1}
  .tick{font-size:13px}.axis-label{font-size:15px;font-weight:700}
  .trace{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;transition:opacity .15s,stroke-width .15s}
  .trace.muted{opacity:.28;stroke-width:3}.point{stroke:#F4F1E8;stroke-width:3}
  .cursor{stroke:var(--attention);stroke-width:2;stroke-dasharray:7 6}.badge{font-size:14px;font-weight:700}
  @media (prefers-reduced-motion:reduce){.trace{transition:none}}
</style>
</head>
<body data-page="11" data-total="22">
<div id="stage">
  <header class="head">
    <div><h1>同一起点，三种步长</h1><p class="lead">选择一条轨迹作为关注对象，再让三种学习率同步走 1 步或 8 步。比较它们在同一损失刻度上的变化。</p></div>
    <div class="formula">新权重 = 旧权重 − 学习率 × 当前影响量</div>
  </header>
  <main class="workspace min0">
    <section class="chart-panel min0" aria-labelledby="chart-title">
      <div class="chart-top"><h2 id="chart-title">半平方损失 · 共同尺度 0–0.12</h2><div class="legend" aria-label="轨迹图例"><span><i class="swline" style="border-color:#64748B"></i>α = 0.1</span><span><i class="swline" style="border-color:#2457A6"></i>α = 1.0</span><span><i class="swline" style="border-color:#E76F2E"></i>α = 20</span></div></div>
      <svg id="plot" viewBox="0 0 970 570" role="img" aria-labelledby="chart-title chart-desc"><desc id="chart-desc">三种学习率从同一损失开始，按相同更新步数同步绘制。</desc></svg>
    </section>
    <aside class="side min0">
      <section class="panel"><h2>关注哪一种步长？</h2><div class="focus-tabs" role="group" aria-label="选择关注的学习率"><button class="btn" data-alpha="0.1" aria-pressed="false">α = 0.1</button><button class="btn" data-alpha="1" aria-pressed="true">α = 1.0</button><button class="btn" data-alpha="20" aria-pressed="false">α = 20</button></div>
        <div class="readout"><div class="metric stepmetric"><span class="lab">共同更新步数</span><strong id="stepValue">0 / 8</strong></div><div class="metric"><span class="lab">当前权重 w</span><strong id="weightValue">0.500</strong></div><div class="metric"><span class="lab">当前损失</span><strong id="lossValue">0.1013</strong></div></div>
        <div class="controls"><button class="btn attn" id="one">走 1 步</button><button class="btn" id="run">运行 8 步</button><button class="btn" id="reset">恢复起点</button></div>
        <p class="status" id="status" aria-live="polite">起点相同：x = 0.8，b = −0.2，目标 = 1，预测 = 0.5498。</p>
      </section>
      <section class="panel q interpret"><strong id="verdict">先观察：哪条线下降得慢，哪条线会回升？</strong><p id="explain">三条轨迹只改变学习率；起点、步数和损失刻度完全相同。</p></section>
      <p class="hint">可随时切换关注对象；读数会对应该轨迹的当前一步。</p>
    </aside>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(()=>{
  Deck.init({index:11,total:22});
  const C = Object.freeze({x:0.8,b:-0.2,target:1,startW:0.5,maxStep:8,alphas:[0.1,1,20]});
  const colors={"0.1":"#64748B","1":"#2457A6","20":"#E76F2E"};
  const svg=document.getElementById('plot'), stepEl=document.getElementById('stepValue'), weightEl=document.getElementById('weightValue'), lossEl=document.getElementById('lossValue'), statusEl=document.getElementById('status'), verdict=document.getElementById('verdict'), explain=document.getElementById('explain'), runBtn=document.getElementById('run'), oneBtn=document.getElementById('one'), resetBtn=document.getElementById('reset');
  const tabs=[...document.querySelectorAll('[data-alpha]')];
  const events=new AbortController(); let timer=0, destroyed=false;
  function measure(w){
    const f=Lec.P.neuronForward([C.x],[w],C.b,'sigmoid');
    const prediction=typeof f==='number'?f:(f.output??f.value??f.outputs?.[0]);
    let li=null;
    try{li=Lec.P.lossValueAndGradient([prediction],[C.target],'halfSquaredError')}catch(_e){/* shared runtime predates this public loss alias */}
    const loss=li?(typeof li==='number'?li:(li.loss??li.value)):.5*(prediction-C.target)*(prediction-C.target);
    return {w,prediction,loss};
  }
  function makeTrack(alpha){const a=[measure(C.startW)];let w=C.startW;for(let i=0;i<C.maxStep;i++){const influence=.2*(w-2);w=w-alpha*influence;a.push(measure(w));}return a}
  const tracks={};C.alphas.forEach(a=>tracks[a]=makeTrack(a));
  function initialState(){return {step:0,focus:1,running:false}}
  let state=initialState();
  function stop(){if(timer){clearInterval(timer);timer=0}}
  function dispatch(action){
    if(action.type==='focus') state={...state,focus:action.value};
    if(action.type==='step'&&state.step<C.maxStep) state={...state,step:state.step+1};
    if(action.type==='running') state={...state,running:action.value};
    render();
  }
  function pathFor(arr,n,x,y){return arr.slice(0,n+1).map((d,i)=>(i?'L':'M')+x(i)+' '+y(Math.min(.12,d.loss))).join(' ')}
  function render(){
    const W=970,H=570,m={l:72,r:30,t:26,b:56}, iw=W-m.l-m.r,ih=H-m.t-m.b;
    const x=i=>m.l+iw*i/8,y=v=>m.t+ih*(1-v/.12);
    let s=''; for(let j=0;j<=6;j++){const v=j*.02;s+=`<line class="grid" x1="${m.l}" y1="${y(v)}" x2="${W-m.r}" y2="${y(v)}"/><text class="tick" x="${m.l-13}" y="${y(v)+5}" text-anchor="end">${v.toFixed(2)}</text>`}
    for(let i=0;i<=8;i++){s+=`<line class="grid" x1="${x(i)}" y1="${m.t}" x2="${x(i)}" y2="${H-m.b}"/><text class="tick" x="${x(i)}" y="${H-m.b+28}" text-anchor="middle">${i}</text>`}
    s+=`<line class="axis" x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${H-m.b}"/><line class="axis" x1="${m.l}" y1="${H-m.b}" x2="${W-m.r}" y2="${H-m.b}"/><text class="axis-label" x="${m.l-48}" y="${m.t-6}">损失</text><text class="axis-label" x="${W-m.r}" y="${H-12}" text-anchor="end">共同更新步数</text><line class="cursor" x1="${x(state.step)}" y1="${m.t}" x2="${x(state.step)}" y2="${H-m.b}"/>`;
    C.alphas.forEach(a=>{const key=String(a),arr=tracks[a],muted=a!==state.focus?' muted':'';s+=`<path class="trace${muted}" stroke="${colors[key]}" d="${pathFor(arr,state.step,x,y)}"/>`;arr.slice(0,state.step+1).forEach((d,i)=>{const cy=y(Math.min(.12,d.loss));s+=`<circle class="point" cx="${x(i)}" cy="${cy}" r="${i===state.step&&a===state.focus?8:5}" fill="${colors[key]}">${d.loss>.12?'<title>损失超过图表上限</title>':''}</circle>`});if(arr[state.step].loss>.12)s+=`<text class="badge" x="${x(state.step)-8}" y="${m.t+18}" text-anchor="end" fill="${colors[key]}">↑ 超过 0.12</text>`});
    svg.innerHTML=s;
    tabs.forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.alpha)===state.focus?'true':'false'));
    const d=tracks[state.focus][state.step];stepEl.textContent=`${state.step} / 8`;weightEl.textContent=Math.abs(d.w)>999?d.w.toExponential(2):d.w.toFixed(3);lossEl.textContent=d.loss.toFixed(4);
    oneBtn.disabled=state.step>=8||state.running;runBtn.textContent=state.running?'暂停':'运行 8 步';
    if(state.step===0){verdict.textContent='先观察：哪条线下降得慢，哪条线会回升？';explain.textContent='三条轨迹只改变学习率；起点、步数和损失刻度完全相同。'}
    else {const messages={"0.1":['步长太小：损失在降，但很慢。','8 步后仍只移动了一小段，需要更多次更新。'],"1":['步长适中：连续接近低损失区。','每一步都朝较低损失推进，过程相对稳定。'],"20":['步长过大：反复跨过低点。','损失回升甚至冲出图表上限；更大的步不等于更快学好。']};verdict.textContent=messages[String(state.focus)][0];explain.textContent=messages[String(state.focus)][1]}
  }
  tabs.forEach(b=>b.addEventListener('click',()=>dispatch({type:'focus',value:Number(b.dataset.alpha)}),{signal:events.signal}));
  oneBtn.addEventListener('click',()=>{stop();dispatch({type:'running',value:false});dispatch({type:'step'});statusEl.textContent=`三条轨迹已同步走到第 ${state.step} 步。`;},{signal:events.signal});
  runBtn.addEventListener('click',()=>{if(state.running){stop();dispatch({type:'running',value:false});statusEl.textContent=`已暂停在第 ${state.step} 步。`;return}if(state.step>=8)state={...state,step:0};dispatch({type:'running',value:true});statusEl.textContent='三条轨迹正在同步更新。';timer=setInterval(()=>{if(state.step>=8){stop();dispatch({type:'running',value:false});statusEl.textContent='8 步完成。切换关注对象，比较同一步的读数。';return}dispatch({type:'step'});if(state.step>=8){stop();dispatch({type:'running',value:false});statusEl.textContent='8 步完成。切换关注对象，比较同一步的读数。'}},Deck.reduced()?80:520)},{signal:events.signal});
  resetBtn.addEventListener('click',()=>{stop();state=initialState();render();statusEl.textContent='已恢复共同起点。';oneBtn.focus()},{signal:events.signal});
  function destroy(){if(destroyed)return;destroyed=true;stop();events.abort()}
  window.addEventListener('pagehide',destroy,{once:true});
  render();
})();
</script>
</body>
</html>
