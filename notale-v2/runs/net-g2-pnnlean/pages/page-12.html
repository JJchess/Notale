<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>从试探到一次算全</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{display:flex;flex-direction:column;gap:18px;}
  .head{height:92px;display:flex;align-items:flex-start;justify-content:space-between;gap:36px;}
  .head h1{margin:0 0 8px;font-size:var(--fs-h1);line-height:1.15;}
  .head .lead{margin:0;max-width:960px;line-height:1.45;}
  .task{align-self:center;display:flex;align-items:center;gap:12px;margin-top:5px;color:var(--model);font-size:var(--fs-label);font-weight:700;white-space:nowrap;}
  .task::before{content:"";width:34px;border-top:2px solid var(--model);}
  .compare{flex:1;min-height:0;display:grid;grid-template-columns:1fr 90px 1.22fr;align-items:stretch;position:relative;}
  .scale-guide{position:absolute;left:32px;right:32px;bottom:26px;width:calc(100% - 64px);height:360px;pointer-events:none;z-index:0;}
  .side,.bridge{z-index:1;}
  .side{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;padding:24px 30px 20px;}
  .side.small{background:rgba(36,87,166,.055);border-radius:8px 0 0 8px;}
  .side.large{background:rgba(231,111,46,.045);border-radius:0 8px 8px 0;}
  .eyebrow{font-size:var(--fs-label);font-weight:700;letter-spacing:.06em;color:var(--model);}
  .large .eyebrow{color:var(--attention);}
  .side h2{font-size:var(--fs-h2);margin:7px 0 4px;}
  .method{font-size:var(--fs-body);margin:0;color:var(--text);}
  .one-field{flex:1;display:flex;align-items:center;justify-content:center;gap:34px;}
  .knob-wrap{text-align:center;}
  .dial{width:210px;height:210px;border:3px solid var(--text);border-radius:50%;position:relative;background:#faf8f1;box-shadow:inset 0 0 0 10px rgba(36,87,166,.07);}
  .dial::before{content:"";position:absolute;width:4px;height:58px;background:var(--model);left:101px;top:24px;height:78px;transform-origin:2px 78px;transform:rotate(34deg);border-radius:3px;}
  .dial::after{content:"w";position:absolute;inset:0;display:grid;place-items:center;font:700 26px var(--font-mono);}
  .lr{display:flex;align-items:center;gap:14px;font-size:var(--fs-label);font-weight:700;margin-top:14px;}
  .arr{font-size:28px;color:var(--model);}
  .losses{display:flex;flex-direction:column;gap:18px;}
  .read{min-width:220px;padding:18px 20px;border:1px solid rgba(31,42,55,.25);border-radius:8px;background:#fffdfa;}
  .read span{display:block;font-size:var(--fs-label);margin-bottom:4px;}
  .read b{font:700 24px var(--font-mono);color:var(--model);}
  .verdict{font-size:var(--fs-lead);font-family:var(--font-serif);font-weight:700;margin:0;text-align:center;}
  .bridge{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:rgba(31,42,55,.65);font-size:var(--fs-label);font-weight:700;}
  .bridge .line{height:250px;border-left:2px dashed rgba(31,42,55,.28);}
  .bridge .chev{font-size:30px;color:var(--attention);}
  .many-field{flex:1;display:flex;align-items:center;gap:28px;min-height:0;}
  .params{width:455px;display:grid;grid-template-columns:repeat(6,1fr);gap:16px;align-content:center;position:relative;}
  .p{aspect-ratio:1;border:2px solid rgba(31,42,55,.5);border-radius:50%;background:#fffdfa;position:relative;}
  .p::after{content:"";position:absolute;width:3px;height:20px;background:var(--text);left:50%;top:8px;transform-origin:1px 20px;transform:rotate(var(--r));}
  .p.hot{border-color:var(--attention);box-shadow:0 0 0 4px rgba(231,111,46,.11);}
  .growth{width:245px;display:flex;flex-direction:column;justify-content:center;gap:16px;}
  .count{font:700 26px var(--font-mono);color:var(--attention);}
  .calc{font-size:var(--fs-body);line-height:1.45;margin:0;}
  .calc strong{font-family:var(--font-mono);font-size:22px;}
  .fail{margin:0;font-family:var(--font-serif);font-size:var(--fs-lead);font-weight:700;color:var(--attention);}
  .turn{height:126px;display:grid;grid-template-columns:290px 1fr;align-items:center;gap:34px;border-top:2px solid var(--text);padding:18px 24px 0;}
  .turn-label{font-size:var(--fs-label);font-weight:700;color:var(--attention);}
  .turn-label strong{display:block;margin-top:5px;font-size:var(--fs-h2);color:var(--text);}
  .answer{display:flex;align-items:center;gap:26px;}
  .once{font:700 30px var(--font-mono);color:var(--model);white-space:nowrap;}
  .all-arrows{display:flex;gap:7px;color:var(--model);font-size:24px;letter-spacing:-3px;}
  .claim{font-family:var(--font-serif);font-size:var(--fs-lead);line-height:1.4;font-weight:700;}
</style>
</head>
<body data-page="12" data-total="22">
<div id="stage">
  <header class="head">
    <div>
      <h1>从试探到一次算全</h1>
      <p class="lead">参数变多时，任务没有变：仍要判断每个旋钮往哪边转，才能让损失下降。</p>
    </div>
    <div class="task">同一个任务：找下降方向</div>
  </header>

  <main class="compare k-comparison min0" aria-label="一个参数与成百上千个参数的试探方法比较">
    <svg class="scale-guide" viewBox="0 0 1400 360" aria-hidden="true">
      <path d="M25 330 H1375" fill="none" stroke="rgba(31,42,55,.28)" stroke-width="2"/>
      <path d="M25 318 V342 M1375 318 V342" fill="none" stroke="rgba(31,42,55,.45)" stroke-width="3"/>
      <path d="M440 308 C520 238 585 142 665 54" fill="none" stroke="rgba(231,111,46,.55)" stroke-width="3" stroke-dasharray="9 9"/>
      <path d="M652 58 L667 52 L664 68" fill="none" stroke="#E76F2E" stroke-width="3"/>
    </svg>
    <section class="side small min0">
      <div class="eyebrow">小规模</div>
      <h2>1 个参数</h2>
      <p class="method">左右各试一次</p>
      <div class="one-field">
        <div class="knob-wrap">
          <div class="dial" aria-hidden="true"></div>
          <div class="lr"><span class="arr">←</span> 左右试探 <span class="arr">→</span></div>
        </div>
        <div class="losses">
          <div class="read"><span>往左后的损失</span><b>0.46</b></div>
          <div class="read"><span>往右后的损失</span><b>0.31</b></div>
        </div>
      </div>
      <p class="verdict">两次比较，就能选出更低的一边。</p>
    </section>

    <div class="bridge" aria-hidden="true"><span>参数变多</span><div class="line"></div><span class="chev">›</span></div>

    <section class="side large min0">
      <div class="eyebrow">大规模</div>
      <h2>成百上千个参数</h2>
      <p class="method">仍然逐个左右试探？</p>
      <div class="many-field">
        <div class="params" aria-hidden="true">
          <i class="p hot" style="--r:-38deg"></i><i class="p" style="--r:26deg"></i><i class="p" style="--r:-12deg"></i><i class="p" style="--r:42deg"></i><i class="p" style="--r:-27deg"></i><i class="p" style="--r:15deg"></i><i class="p" style="--r:35deg"></i><i class="p" style="--r:-18deg"></i>
          <i class="p" style="--r:18deg"></i><i class="p hot" style="--r:-32deg"></i><i class="p" style="--r:8deg"></i><i class="p" style="--r:-44deg"></i><i class="p" style="--r:29deg"></i><i class="p" style="--r:-8deg"></i><i class="p" style="--r:40deg"></i><i class="p" style="--r:-24deg"></i>
          <i class="p" style="--r:-16deg"></i><i class="p" style="--r:36deg"></i><i class="p" style="--r:-40deg"></i><i class="p" style="--r:12deg"></i><i class="p hot" style="--r:31deg"></i><i class="p" style="--r:-21deg"></i><i class="p" style="--r:5deg"></i><i class="p" style="--r:44deg"></i>
          <i class="p" style="--r:27deg"></i><i class="p" style="--r:-35deg"></i><i class="p" style="--r:17deg"></i><i class="p" style="--r:-6deg"></i><i class="p" style="--r:39deg"></i><i class="p" style="--r:-29deg"></i><i class="p" style="--r:22deg"></i><i class="p hot" style="--r:-42deg"></i>
        </div>
        <div class="growth">
          <div class="count">× 成百上千</div>
          <p class="calc">每个参数都要比较两边，<br>试探次数随参数数量<strong>迅速增长</strong>。</p>
          <p class="fail">旧办法在规模面前失效。</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="turn">
    <div class="turn-label">方法转折<strong>不是更用力地猜</strong></div>
    <div class="answer">
      <span class="once">一次计算</span>
      <span class="all-arrows" aria-hidden="true">← → ← ← → → ← →</span>
      <span class="claim">得到每个参数各自的移动方向。</span>
    </div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:12,total:22});</script>
</body>
</html>
