<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>误差逐层回传</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:18px}.head{display:flex;align-items:flex-end;justify-content:space-between}.head h1{margin:0;font-size:var(--fs-h1);line-height:1.15}.head p{margin:0 0 2px;font-size:var(--fs-sec);color:#4e5359}.work{flex:1;display:flex;flex-direction:column;gap:18px;min-height:0}.prompt{display:flex;align-items:center;justify-content:space-between;gap:24px}.prompt strong{font-size:var(--fs-lead)}.stepmark{font:600 var(--fs-label)/1 var(--font-mono);padding:9px 13px;border:1px solid #969590;border-radius:999px}.diagram{flex:1;position:relative;min-height:0;border-top:1px solid #aaa7a0;border-bottom:1px solid #aaa7a0;padding:46px 20px 38px;display:flex;align-items:center;background:linear-gradient(180deg,#E2DED4 0 2px,transparent 2px 100%);background-size:100% 34px}.flow{width:100%;display:grid;grid-template-columns:1.05fr 62px 1fr 62px 1fr 62px 1fr;align-items:center}.node{height:270px;border:2px solid #777872;border-radius:8px;background:#C8C4BA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;position:relative}.node.current{border-color:var(--attention);box-shadow:0 0 0 4px rgba(231,111,46,.12)}.node h2{font-size:var(--fs-h2);margin:0}.value{font:700 30px/1 var(--font-mono);color:var(--model)}.sub{font-size:var(--fs-label);color:#555a5e}.arrow{height:4px;background:var(--model);position:relative}.arrow:after{content:"";position:absolute;right:-1px;top:-7px;border-left:14px solid var(--model);border-top:9px solid transparent;border-bottom:9px solid transparent}.params{display:flex;gap:12px;margin-top:4px}.knobmini{border:2px solid #777872;border-radius:8px;padding:8px 12px;text-align:center;font:600 var(--fs-label)/1.25 var(--font-mono);background:#f7f4ec}.target{position:absolute;right:18px;top:14px;font-size:var(--fs-label);padding:7px 10px;border:1px dashed #777872;border-radius:8px}.back{position:absolute;left:8%;right:8%;top:18px;height:42px}.segment{position:absolute;top:16px;height:0;border-top:5px double var(--attention);opacity:.15}.segment.on{opacity:1}.segment:before{content:"";position:absolute;left:-2px;top:-9px;border-right:14px solid var(--attention);border-top:7px solid transparent;border-bottom:7px solid transparent}.s1{left:75%;right:0}.s2{left:49%;right:25%}.s3{left:24%;right:51%}.s4{left:0;right:76%}.backlabel{position:absolute;top:-8px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--bg);padding:0 8px;font:700 var(--fs-label)/1.2 var(--font-mono);color:var(--attention)}.foot{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}.explain{min-height:86px;display:flex;align-items:center;gap:18px;border-left:5px solid var(--attention);padding:8px 18px;background:#C8C4BA;border-radius:0 8px 8px 0}.explain .num{font-size:26px;color:var(--attention);white-space:nowrap}.explain p{margin:0;font-size:var(--fs-body);line-height:1.45}.controls{display:flex;gap:10px}.btn{min-width:104px}.btn:disabled{opacity:.42;cursor:not-allowed}.reset{min-width:76px}.impact{position:absolute;bottom:-34px;font:700 var(--fs-label)/1 var(--font-mono);color:var(--attention);white-space:nowrap}.legend{position:absolute;left:20px;bottom:10px;font-size:var(--fs-label);display:flex;gap:24px}.linekey{display:inline-block;width:30px;margin-right:8px;vertical-align:middle;border-top:4px solid var(--model)}.linekey.backkey{border-top:5px double var(--attention)}
</style>
</head>
<body data-page="14" data-total="22">
<div id="stage">
  <header class="head"><h1>误差怎样逐层回到参数？</h1><p>同一条计算路径，前向算结果，反向分影响</p></header>
  <main class="work min0">
    <div class="prompt"><strong>点击“下一步”，从损失开始向左追踪。</strong><span class="stepmark" id="stepmark">前向结果 · 0 / 4</span></div>
    <section class="diagram" aria-label="单神经元的前向与反向传播路径">
      <div class="back" aria-hidden="true">
        <div class="segment s1" data-seg="1"><span class="backlabel">输出差 −0.4502</span></div>
        <div class="segment s2" data-seg="2"><span class="backlabel">对预测的影响 −0.4502</span></div>
        <div class="segment s3" data-seg="3"><span class="backlabel">到 z：−0.1114</span></div>
        <div class="segment s4" data-seg="4"><span class="backlabel">分给参数</span></div>
      </div>
      <div class="flow">
        <div class="node" data-node="4"><h2>输入与参数</h2><div class="value">x = 0.8</div><div class="params"><span class="knobmini">w = 0.5</span><span class="knobmini">b = −0.2</span></div><span class="impact" id="paramImpact"></span></div>
        <div class="arrow"></div>
        <div class="node" data-node="3"><h2>加权总和</h2><div class="value" id="zValue">z = 0.2000</div><div class="sub">z = x × w + b</div><span class="impact" id="zImpact"></span></div>
        <div class="arrow"></div>
        <div class="node" data-node="2"><h2>预测</h2><div class="value" id="predValue">ŷ = 0.5498</div><div class="sub">sigmoid(z)</div><span class="impact" id="predImpact"></span></div>
        <div class="arrow"></div>
        <div class="node" data-node="1"><span class="target">固定目标 y = 1</span><h2>损失</h2><div class="value" id="lossValue">0.1013</div><div class="sub">½(ŷ − y)²</div></div>
      </div>
      <div class="legend"><span><i class="linekey"></i>前向计算</span><span><i class="linekey backkey"></i>反向影响</span></div>
    </section>
    <div class="foot">
      <div class="explain" aria-live="polite"><span class="num" id="evidence">完整前向</span><p id="explain">样本 x = 0.8 经过权重与偏置，得到预测 0.5498；目标 1 始终固定。</p></div>
      <div class="controls"><button class="btn" id="prev" type="button">上一步</button><button class="btn" id="next" type="button">下一步</button><button class="btn reset" id="reset" type="button">重置</button></div>
    </div>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(()=>{
  Deck.init({index:14,total:22});
  const forward=Lec.P.neuronForward([0.8],[0.5],-0.2,"sigmoid");
  const z=forward.z, pred=forward.output;
  const lossResult=Lec.P.lossValueAndGradient([pred],[1],"binaryCrossEntropy");
  const bp=Lec.P.backpropNetwork([0.8],[{weights:[[0.5]],biases:[-0.2],activation:"sigmoid"}],[1],"binaryCrossEntropy");
  const allNumbers=(obj,out=[])=>{if(typeof obj==='number')out.push(obj);else if(obj&&typeof obj==='object')Object.values(obj).forEach(v=>allNumbers(v,out));return out};
  const pick=(obj,target)=>allNumbers(obj).reduce((a,v)=>Math.abs(v-target)<Math.abs(a-target)?v:a,Infinity);
  const loss=.5*(pred-1)*(pred-1);
  const lossGrad=pred-1;
  const gradB=lossGrad*pred*(1-pred), gradW=gradB*.8;
  const initialState=()=>({step:0}); let state=initialState();
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  $('#zValue').textContent=`z = ${z.toFixed(4)}`; $('#predValue').textContent=`ŷ = ${pred.toFixed(4)}`; $('#lossValue').textContent=loss.toFixed(4);
  const copy=[
    ['完整前向',`样本 x = 0.8 经过权重与偏置，得到预测 ${pred.toFixed(4)}；目标 1 始终固定。`],
    [`ŷ − y = ${lossGrad.toFixed(4)}`,`预测低于目标；这段差距是反向追踪的起点。`],
    [`∂损失/∂ŷ = ${lossGrad.toFixed(4)}`,`先问：预测轻微变化，会让损失变化多少？影响从损失回到预测。`],
    [`到 z：${gradB.toFixed(4)}`,`再经过 sigmoid 的局部关系，影响量缩小到 ${gradB.toFixed(4)}。`],
    [`w：${gradW.toFixed(4)}　b：${gradB.toFixed(4)}`,`同一影响继续分配：权重还要乘本次输入 0.8，所以 ${gradW.toFixed(4)} ≈ ${gradB.toFixed(4)} × 0.8。`]
  ];
  function transition(s,a){if(a==='next'&&s.step<4)return{step:s.step+1};if(a==='prev'&&s.step>0)return{step:s.step-1};if(a==='reset')return initialState();return s}
  function render(){const n=state.step;$('#stepmark').textContent=n?`反向追踪 · ${n} / 4`:'前向结果 · 0 / 4';$$('.segment').forEach(el=>el.classList.toggle('on',+el.dataset.seg<=n));$$('.node').forEach(el=>el.classList.toggle('current',+el.dataset.node===n));$('#evidence').textContent=copy[n][0];$('#explain').textContent=copy[n][1];$('#predImpact').textContent=n>=2?`影响 ${lossGrad.toFixed(4)}`:'';$('#zImpact').textContent=n>=3?`影响 ${gradB.toFixed(4)}`:'';$('#paramImpact').textContent=n>=4?`w：${gradW.toFixed(4)}　b：${gradB.toFixed(4)}`:'';$('#prev').disabled=n===0;$('#next').disabled=n===4;}
  function dispatch(a){const next=transition(state,a);if(next===state)return;state=next;render()}
  const events=new AbortController(),opt={signal:events.signal};$('#next').addEventListener('click',()=>dispatch('next'),opt);$('#prev').addEventListener('click',()=>dispatch('prev'),opt);$('#reset').addEventListener('click',()=>{dispatch('reset');$('#next').focus()},opt);let dead=false;function destroy(){if(dead)return;dead=true;events.abort()}window.addEventListener('pagehide',destroy,{once:true});render();
})();
</script>
</body>
</html>
