<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>倒着分责任</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:36px;flex:0 0 82px;border-bottom:1px solid color-mix(in srgb,var(--text) 24%,transparent);padding-bottom:14px}
h1{margin:0;font-size:var(--fs-h1);line-height:1.15;font-weight:750;letter-spacing:.01em}
.head .lead{margin:0;max-width:760px;text-align:right;color:color-mix(in srgb,var(--text) 76%,transparent)}
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
.field{position:relative;flex:1;min-height:0;border-radius:8px;background:color-mix(in srgb,#fff 30%,transparent);overflow:hidden}
.field svg{width:100%;height:100%;display:block}
.band-title{font:700 22px var(--font-sans);fill:var(--text)}
.band-question{font:500 18px var(--font-sans);fill:var(--text)}
.node-text{font:700 18px var(--font-sans);fill:var(--text);text-anchor:middle;dominant-baseline:middle}
.layer-label{font:500 15px var(--font-sans);fill:color-mix(in srgb,var(--text) 70%,transparent);text-anchor:middle}
.flow-label{font:700 19px var(--font-sans);fill:var(--model);text-anchor:middle}
.back-label{font:700 19px var(--font-sans);fill:var(--attention);text-anchor:middle}
.flow-note{font:500 16px var(--font-sans);fill:var(--text);text-anchor:middle}
.badge-text{font:750 19px var(--font-sans);fill:var(--attention);text-anchor:middle;dominant-baseline:middle}
.conclusion{flex:0 0 94px;display:flex;align-items:center;justify-content:center;gap:26px;border-top:1px solid color-mix(in srgb,var(--text) 22%,transparent);font-family:var(--font-serif);font-size:var(--fs-h2);line-height:1.4;text-align:center}
.conclusion strong{font-family:var(--font-sans);font-size:var(--fs-lead);color:var(--attention);border:2px solid var(--attention);border-radius:999px;padding:8px 18px;white-space:nowrap}
</style>
</head>
<body data-page="16" data-total="22">
<div id="stage">
  <header class="head">
    <h1>倒着分责任，不是倒着预测</h1>
    <p class="lead">同一张网络，两种方向回答两个不同的问题。</p>
  </header>

  <main class="main min0">
    <section class="field min0" aria-labelledby="diagram-title">
      <svg viewBox="0 0 1488 620" role="img" aria-labelledby="diagram-title">
        <title id="diagram-title">上方蓝色实线从输入经过参数到预测，表示前向传播；下方橙色双线空心箭头从误差返回各参数，表示分配调整责任。</title>
        <defs>
          <marker id="forwardHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M1,1 L11,6 L1,11 Z" fill="#2457A6"/>
          </marker>
          <marker id="backHead" markerWidth="13" markerHeight="13" refX="2" refY="6.5" orient="auto" markerUnits="strokeWidth">
            <path d="M12,1 L2,6.5 L12,12 Z" fill="#F4F1E8" stroke="#E76F2E" stroke-width="1.8"/>
          </marker>
        </defs>

        <text x="54" y="48" class="band-title">① 前向传播</text>
        <text x="242" y="48" class="band-question">用当前参数，结果是多少？</text>
        <path d="M160 144 H1320" fill="none" stroke="#2457A6" stroke-width="7" stroke-linecap="round" marker-end="url(#forwardHead)"/>
        <text x="744" y="88" class="flow-label">输入 → 预测</text>

        <g fill="#F4F1E8" stroke="#59616c" stroke-width="2">
          <rect x="78" y="118" width="164" height="74" rx="8"/>
          <rect x="390" y="108" width="184" height="94" rx="8"/>
          <rect x="674" y="108" width="184" height="94" rx="8"/>
          <rect x="958" y="108" width="184" height="94" rx="8"/>
          <rect x="1250" y="118" width="164" height="74" rx="8"/>
        </g>
        <text x="160" y="155" class="node-text">输入</text>
        <text x="482" y="155" class="node-text">参数 w₁</text>
        <text x="766" y="155" class="node-text">参数 w₂</text>
        <text x="1050" y="155" class="node-text">参数 w₃</text>
        <text x="1332" y="155" class="node-text">预测</text>
        <text x="482" y="226" class="layer-label">当前参数参与计算</text>
        <text x="766" y="226" class="layer-label">当前参数参与计算</text>
        <text x="1050" y="226" class="layer-label">当前参数参与计算</text>

        <line x1="54" y1="276" x2="1434" y2="276" stroke="#59616c" stroke-opacity=".28" stroke-width="2"/>

        <text x="54" y="326" class="band-title">② 反向传播</text>
        <text x="242" y="326" class="band-question">每个参数该往哪边、改多少？</text>

        <rect x="1248" y="356" width="168" height="76" rx="8" fill="#F4F1E8" stroke="#59616c" stroke-width="2"/>
        <text x="1332" y="394" class="node-text">误差</text>

        <path d="M1248 394 H1052 V468" fill="none" stroke="#E76F2E" stroke-width="3" marker-end="url(#backHead)"/>
        <path d="M1248 404 H768 V468" fill="none" stroke="#E76F2E" stroke-width="3" marker-end="url(#backHead)"/>
        <path d="M1248 414 H484 V468" fill="none" stroke="#E76F2E" stroke-width="3" marker-end="url(#backHead)"/>

        <g fill="#F4F1E8" stroke="#E76F2E" stroke-width="2">
          <rect x="390" y="468" width="184" height="76" rx="8"/>
          <rect x="674" y="468" width="184" height="76" rx="8"/>
          <rect x="958" y="468" width="184" height="76" rx="8"/>
        </g>
        <text x="482" y="506" class="node-text">参数 w₁</text>
        <text x="766" y="506" class="node-text">参数 w₂</text>
        <text x="1050" y="506" class="node-text">参数 w₃</text>
        <text x="766" y="580" class="back-label">误差 → 各参数：分配调整方向和大小</text>
        <text x="1332" y="462" class="flow-note">从误差出发</text>

        <rect x="70" y="368" width="252" height="66" rx="33" fill="none" stroke="#E76F2E" stroke-width="2"/>
        <text x="196" y="401" class="badge-text">不是倒着预测</text>
      </svg>
    </section>

    <footer class="conclusion">
      <span>预测值沿网络向前算；误差的影响沿同一网络向后算。</span>
      <strong>反向传播 = 分配调整责任</strong>
    </footer>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:16,total:22});</script>
</body>
</html>
