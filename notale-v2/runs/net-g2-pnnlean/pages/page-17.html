<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>隐藏神经元看见什么</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:18px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px}.head h1{margin:0;font-size:var(--fs-h1);line-height:1.15}.head p{margin:0;max-width:760px;font-size:var(--fs-lead);line-height:1.45}.main{flex:1;display:grid;grid-template-columns:770px 1fr;gap:34px;min-height:0}.map-side,.read-side{display:flex;flex-direction:column;min-height:0}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.section-head h2{font-size:var(--fs-h2);margin:0}.coord{font:700 var(--fs-body)/1 var(--font-mono);color:var(--model)}.map-wrap{position:relative;flex:1;min-height:0;border:2px solid var(--text);border-radius:8px;background:#fff}.map-wrap canvas{border-radius:6px}.map-wrap:focus-visible{outline:4px solid var(--focus);outline-offset:3px}.axis{position:absolute;font:700 var(--fs-label)/1 var(--font-mono);pointer-events:none}.ax-x{right:14px;bottom:12px}.ax-y{left:14px;top:12px}.scale{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:var(--fs-label)}.ramp{height:14px;flex:1;border:1px solid var(--text);background:linear-gradient(90deg,#f4f1e8,#2457a6)}.read-side{gap:12px}.selector{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.hbtn{font:700 var(--fs-label)/1 var(--font-mono);padding:11px 8px;border:2px solid var(--text);border-radius:8px;background:transparent;color:var(--text);cursor:pointer}.hbtn[aria-pressed=true]{background:var(--attention);color:white;border-color:var(--attention)}.bars{display:grid;grid-template-columns:1fr 1fr;gap:9px 18px;padding:16px;border-top:2px solid var(--text);border-bottom:2px solid var(--text)}.barrow{display:grid;grid-template-columns:34px 1fr 50px;align-items:center;gap:8px;font-size:var(--fs-label)}.barrow strong{font-family:var(--font-mono)}.track{height:16px;background:rgba(36,87,166,.12);border:1px solid var(--text);border-radius:8px;overflow:hidden}.fill{height:100%;background:var(--model)}.barrow.sel .track{outline:3px solid var(--attention);outline-offset:2px}.barrow.sel strong:first-child{color:var(--attention)}.explain{margin-top:auto;padding:16px 0 0;border-top:1px dashed var(--text)}.explain p{font-size:var(--fs-body);line-height:1.45;margin:0 0 12px}.flow{display:flex;align-items:center;gap:12px;font-size:var(--fs-lead);font-weight:700}.flow .box{padding:10px 14px;border:2px solid var(--text);border-radius:8px}.arrow{font-size:28px}.output{border-style:dashed!important}.hint{margin-top:9px}.reset{align-self:flex-end}.btn{font-size:var(--fs-label)}
</style>
</head>
<body data-page="17" data-total="22">
<div id="stage">
  <header class="head"><div><h1>隐藏神经元看见什么？</h1></div><p>在共享输入平面上移动探针，再切换 H1–H10：同一个位置，会让不同神经元产生不同强度的响应。</p></header>
  <main class="main">
    <section class="map-side min0" aria-labelledby="map-title">
      <div class="section-head"><h2 id="map-title"><span id="chosen">H1</span> 的整片响应场</h2><output class="coord" id="coord">(0.25, 0.75) · 0.00</output></div>
      <div id="surface" class="map-wrap no-pan" tabindex="0" role="slider" aria-label="二维输入探针；方向键移动，步长 0.05" aria-valuetext="x1 0.25，x2 0.75"><canvas id="field" class="cv-fill"></canvas><span class="axis ax-y">x₂ ↑</span><span class="axis ax-x">x₁ →</span></div>
      <div class="scale"><span>响应 0</span><span class="ramp" aria-hidden="true"></span><span>响应 1</span></div>
      <p class="hint">拖动探针，或聚焦平面后按方向键。网格四角对应输入 0 与 1。</p>
    </section>
    <section class="read-side min0" aria-labelledby="read-title">
      <div class="section-head"><h2 id="read-title">此刻的 10 个激活值</h2><button class="btn reset" id="reset" type="button">复位</button></div>
      <div class="selector" id="selector" aria-label="选择隐藏神经元"></div>
      <div class="bars" id="bars"></div>
      <div class="explain"><p id="observation" aria-live="polite">选择一个神经元，比较它的单点激活与左侧整片响应。</p><div class="flow" aria-label="隐藏层响应会被下一层重新组合"><span class="box">H1–H10 局部响应</span><span class="arrow">→</span><span class="box output">重新组合</span></div><p class="hint">这里不直接给最终答案：隐藏层先提供一组可组合的局部响应。</p></div>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(()=>{
Deck.init({index:17,total:22});
const events=new AbortController(), cleanups=[];
const surface=document.getElementById('surface'), canvas=document.getElementById('field');
const selector=document.getElementById('selector'), bars=document.getElementById('bars');
let seed=1; const rand=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);
const weights=Array.from({length:10},()=>[(rand()*8-4),(rand()*8-4)]);
const biases=Array.from({length:10},()=>rand()*4-2);
function initialState(){return{x:.25,y:.75,selected:0};} let state=initialState(), active=null;
function values(x=state.x,y=state.y){return Lec.P.denseForward([x,y],weights,biases,'sigmoid').outputs;}
for(let i=0;i<10;i++){const b=document.createElement('button');b.className='hbtn';b.type='button';b.textContent='H'+(i+1);b.dataset.i=i;b.setAttribute('aria-pressed','false');selector.appendChild(b);const r=document.createElement('div');r.className='barrow';r.innerHTML=`<strong>H${i+1}</strong><span class="track"><span class="fill"></span></span><strong class="val">0.00</strong>`;bars.appendChild(r);}
function transition(s,a){if(a.type==='select')return{...s,selected:(a.i+10)%10};if(a.type==='move')return{...s,x:Deck.clamp(Math.round(a.x*20)/20,0,1),y:Deck.clamp(Math.round(a.y*20)/20,0,1)};return s;}
function dispatch(a){state=transition(state,a);render();}
function draw(){const ctx=Deck.fit(canvas),w=canvas.offsetWidth,h=canvas.offsetHeight,n=21,vals=[];for(let iy=0;iy<n;iy++)for(let ix=0;ix<n;ix++)vals.push(values(ix/(n-1),1-iy/(n-1))[state.selected]);const cw=w/n,ch=h/n;vals.forEach((v,k)=>{const ix=k%n,iy=Math.floor(k/n);ctx.fillStyle=`rgb(${Math.round(244+(36-244)*v)},${Math.round(241+(87-241)*v)},${Math.round(232+(166-232)*v)})`;ctx.fillRect(ix*cw,iy*ch,cw+1,ch+1)});ctx.strokeStyle='rgba(20,28,38,.18)';ctx.lineWidth=1;for(let i=0;i<n;i+=5){ctx.beginPath();ctx.moveTo((i+.5)*cw,0);ctx.lineTo((i+.5)*cw,h);ctx.stroke();ctx.beginPath();ctx.moveTo(0,(i+.5)*ch);ctx.lineTo(w,(i+.5)*ch);ctx.stroke()}const px=state.x*w,py=(1-state.y)*h;ctx.beginPath();ctx.arc(px,py,13,0,Math.PI*2);ctx.fillStyle='#F4F1E8';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#E76F2E';ctx.stroke();ctx.beginPath();ctx.moveTo(px-20,py);ctx.lineTo(px+20,py);ctx.moveTo(px,py-20);ctx.lineTo(px,py+20);ctx.lineWidth=2;ctx.stroke();}
function render(){const vs=values();document.getElementById('chosen').textContent='H'+(state.selected+1);document.getElementById('coord').textContent=`(${state.x.toFixed(2)}, ${state.y.toFixed(2)}) · ${vs[state.selected].toFixed(2)}`;surface.setAttribute('aria-valuetext',`x1 ${state.x.toFixed(2)}，x2 ${state.y.toFixed(2)}`);[...selector.children].forEach((b,i)=>b.setAttribute('aria-pressed',i===state.selected));[...bars.children].forEach((r,i)=>{r.classList.toggle('sel',i===state.selected);r.querySelector('.fill').style.width=(vs[i]*100).toFixed(1)+'%';r.querySelector('.val').textContent=vs[i].toFixed(2)});document.getElementById('observation').textContent=`当前位置，H${state.selected+1} 的激活为 ${vs[state.selected].toFixed(2)}；切换神经元不会移动探针。`;draw();}
selector.addEventListener('click',e=>{const b=e.target.closest('button');if(b)dispatch({type:'select',i:+b.dataset.i})},{signal:events.signal});
selector.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();e.stopPropagation();const i=(state.selected+(e.key==='ArrowRight'?1:-1)+10)%10;dispatch({type:'select',i});selector.children[i].focus()},{signal:events.signal});
function movePointer(e){const p=Deck.pt(surface,e);dispatch({type:'move',x:p.x/surface.offsetWidth,y:1-p.y/surface.offsetHeight});}
surface.addEventListener('pointerdown',e=>{if(active!==null)return;active=e.pointerId;surface.setPointerCapture(active);movePointer(e)},{signal:events.signal});surface.addEventListener('pointermove',e=>{if(e.pointerId===active)movePointer(e)},{signal:events.signal});function end(e){if(e.pointerId===active)active=null}surface.addEventListener('pointerup',end,{signal:events.signal});surface.addEventListener('pointercancel',end,{signal:events.signal});
surface.addEventListener('keydown',e=>{let dx=0,dy=0;if(e.key==='ArrowLeft')dx=-.05;if(e.key==='ArrowRight')dx=.05;if(e.key==='ArrowDown')dy=-.05;if(e.key==='ArrowUp')dy=.05;if(!dx&&!dy)return;e.preventDefault();e.stopPropagation();dispatch({type:'move',x:state.x+dx,y:state.y+dy})},{signal:events.signal});
document.getElementById('reset').addEventListener('click',()=>{state=initialState();render();surface.focus();document.getElementById('observation').textContent='已复位：H1 的激活为 '+values()[0].toFixed(2)+'，探针回到 (0.25, 0.75)。'},{signal:events.signal});
cleanups.push(Deck.onResize(render));function destroy(){events.abort();while(cleanups.length)cleanups.pop()();active=null}window.addEventListener('pagehide',destroy,{once:true});render();
})();
</script>
</body>
</html>
