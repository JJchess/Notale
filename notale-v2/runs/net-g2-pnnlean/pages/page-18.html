<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>看网络连续学习</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F4F1E8;--text:#202832;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E76F2E}
#stage{gap:16px}.head{display:flex;align-items:flex-end;justify-content:space-between}.head h1{font-size:var(--fs-h1);margin:0 0 4px}.head p{font-size:var(--fs-lead);margin:0;color:#46515d}.toolbar{display:flex;align-items:center;gap:12px}.btn{min-width:116px}.btn.primary{background:var(--attention);border-color:var(--attention);color:white}.dashboard{display:grid;grid-template-columns:245px 1fr;gap:20px;flex:1;min-height:0}.rail{display:flex;flex-direction:column;gap:14px;border-right:1px solid #b8b5ac;padding-right:20px}.readouts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:13px 12px;background:#fffaf0;border-radius:8px}.metric .lab{font-size:var(--fs-label);color:#59636d}.metric .val{display:block;font:700 28px/1.2 var(--font-mono);color:var(--model);margin-top:5px}.cycle{margin-top:2px}.cycle h2,.evidence h2{font-size:var(--fs-h2);margin:0 0 10px}.steps{display:flex;flex-direction:column;gap:7px}.step{display:flex;align-items:center;gap:9px;font-size:var(--fs-sec);padding:8px 10px;border-left:3px solid #c7c4bb}.step.on{border-color:var(--attention);background:#fff3e9;font-weight:700}.step i{width:24px;height:24px;border-radius:50%;border:1px solid #8c949b;display:grid;place-items:center;font-style:normal;font:13px var(--font-mono)}.step.on i{background:var(--attention);border-color:var(--attention);color:white}.hint{margin-top:auto}.evidence{padding-top:12px;border-top:1px solid #b8b5ac}.evidence ul{padding-left:20px;margin:0;font-size:var(--fs-label);line-height:1.55}.viz{display:flex;flex-direction:column;min-height:0}.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}.chart-head h2{font-size:var(--fs-h2);margin:0}.legend{font-size:var(--fs-label)}.chart{flex:1;min-height:0;background:rgba(255,255,255,.38);border-radius:8px}.caption{display:flex;justify-content:space-between;gap:24px;font-size:var(--fs-label);line-height:1.4;margin-top:7px}.caption strong{font-family:var(--font-serif);font-size:var(--fs-sec)}.status{color:#55616c}.sr-table{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body data-page="18" data-total="22">
<div id="stage">
  <header class="head">
    <div><h1>看网络连续学习</h1><p>同一轮参数更新后，损失记录与分类边界一起刷新。</p></div>
    <div class="toolbar"><button id="toggle" class="btn primary" aria-keyshortcuts="Space">开始训练</button><button id="reset" class="btn">重新开始</button></div>
  </header>
  <main class="dashboard min0">
    <aside class="rail min0" aria-label="训练仪表">
      <div class="readouts">
        <div class="metric"><span class="lab">当前轮次</span><span class="val" id="epoch">0</span></div>
        <div class="metric"><span class="lab">平均损失</span><span class="val" id="loss">—</span></div>
      </div>
      <section class="cycle"><h2>一批样本的四步</h2><div class="steps" id="steps">
        <div class="step on" data-step="0"><i>1</i>前向预测</div><div class="step" data-step="1"><i>2</i>计算损失</div><div class="step" data-step="2"><i>3</i>反向传播</div><div class="step" data-step="3"><i>4</i>更新参数</div>
      </div></section>
      <p class="hint">按“开始训练”或空格启停。暂停后，参数、轮次、曲线和边界都留在原处。</p>
      <section class="evidence"><h2>固定实验条件</h2><ul><li>种子 1；两类各 100 个点</li><li>网络 2–10–10–1</li><li>每批 16；学习率 0.3</li><li>隐藏层 tanh；输出 sigmoid</li></ul></section>
    </aside>
    <figure class="viz min0" aria-labelledby="fig-title">
      <div class="chart-head"><h2 id="fig-title">分类场与训练损失，同步到同一轮</h2><div class="legend"><span style="color:#2457A6">● 类别 0</span>　<span style="color:#E76F2E">▲ 类别 1</span>　━━ 预测 0.5 边界</div></div>
      <div id="chart" class="chart" role="img" aria-label="左侧为二维样本与预测概率场，右侧为各轮平均训练损失折线"></div>
      <figcaption class="caption"><strong>学习不是一次跳到答案，而是反复用误差修正参数。</strong><span class="status" id="status" aria-live="polite">等待启动；轮次 0，尚未计算平均损失。</span></figcaption>
      <table class="sr-table" aria-label="训练记录"><thead><tr><th>轮次</th><th>平均损失</th></tr></thead><tbody id="fallback"><tr><td>0</td><td>尚未计算</td></tr></tbody></table>
    </figure>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/lib/mlp.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(function(){
  Deck.init({index:18,total:22,keys:false});
  const rng=new Math.seedrandom('1'), data=[];
  function noise(){return (rng()-0.5)*0.17}
  for(let i=0;i<100;i++){let a=Math.PI*i/99;data.push({id:'c0-'+i,x:[Math.cos(a)+noise(),Math.sin(a)+noise()-.24],t:0})}
  for(let i=0;i<100;i++){let a=Math.PI*i/99;data.push({id:'c1-'+i,x:[1-Math.cos(a)+noise(),-.52-Math.sin(a)+noise()],t:1})}
  const state={running:false,epoch:0,step:0,losses:[],field:null};
  let net, timer=null, batch=0;
  const chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
  const toggle=document.getElementById('toggle'),reset=document.getElementById('reset');
  function makeNet(){return MLP.create({sizes:[2,10,10,1],act:'tanh',lr:.3,seed:1})}
  function fieldData(){const f=net.field(-1.35,-1.2,2.35,1.15,80,80),out=[];for(let y=0;y<80;y++)for(let x=0;x<80;x++)out.push([-1.35+x*(3.7/79),-1.2+y*(2.35/79),f[y*80+x]]);return out}
  function boundaryData(){if(!state.field)return[];return state.field.filter(p=>Math.abs(p[2]-.5)<.018).map(p=>[p[0],p[1]])}
  function render(){
    document.getElementById('epoch').textContent=state.epoch;
    document.getElementById('loss').textContent=state.losses.length?state.losses.at(-1).toFixed(3):'—';
    document.querySelectorAll('.step').forEach((el,i)=>el.classList.toggle('on',i===state.step));
    toggle.textContent=state.running?'暂停训练':(state.epoch?'继续训练':'开始训练');
    const last=state.losses.at(-1);
    document.getElementById('status').textContent=state.running?`训练中：第 ${state.epoch} 轮，正在${['前向预测','计算损失','反向传播','更新参数'][state.step]}。`:(state.epoch?`已暂停在第 ${state.epoch} 轮，平均损失 ${last.toFixed(3)}。`:'等待启动；轮次 0，尚未计算平均损失。');
    chart.setOption({animation:false,textStyle:{fontFamily:'Noto Sans SC, sans-serif',fontSize:16,color:'#202832'},tooltip:{textStyle:{fontSize:16},formatter:p=>Array.isArray(p)?'':`${p.seriesName}<br>${p.value}`},grid:[{left:58,top:48,width:'57%',bottom:58},{right:45,top:48,width:'29%',bottom:58}],xAxis:[{type:'value',min:-1.35,max:2.35,name:'输入 x₁',nameLocation:'middle',nameGap:30,nameTextStyle:{fontSize:14},axisLabel:{fontSize:12}},{type:'value',gridIndex:1,min:0,name:'轮次',nameLocation:'middle',nameGap:30,nameTextStyle:{fontSize:14},axisLabel:{fontSize:12}}],yAxis:[{type:'value',min:-1.2,max:1.15,name:'输入 x₂',nameLocation:'middle',nameGap:42,nameTextStyle:{fontSize:14},axisLabel:{fontSize:12}},{type:'value',gridIndex:1,min:0,name:'平均损失',nameLocation:'middle',nameGap:42,nameTextStyle:{fontSize:14},axisLabel:{fontSize:12}}],visualMap:{show:false,min:0,max:1,seriesIndex:0,inRange:{color:['#dce7f5','#f8f4e9','#f7d9c8']}},series:[{id:'field',name:'预测概率',type:'heatmap',data:state.field||[],progressive:4000,itemStyle:{opacity:.75,borderWidth:0}},{id:'c0',name:'类别 0',type:'scatter',data:data.filter(d=>!d.t).map(d=>d.x),symbol:'circle',symbolSize:7,itemStyle:{color:'#2457A6',borderColor:'#fff',borderWidth:1}},{id:'c1',name:'类别 1',type:'scatter',data:data.filter(d=>d.t).map(d=>d.x),symbol:'triangle',symbolSize:9,itemStyle:{color:'#E76F2E',borderColor:'#fff',borderWidth:1}},{id:'boundary',name:'预测 0.5 边界',type:'scatter',data:boundaryData(),symbol:'rect',symbolSize:4,silent:true,itemStyle:{color:'#202832',opacity:.9}},{id:'loss',name:'平均训练损失',type:'line',xAxisIndex:1,yAxisIndex:1,data:state.losses.map((v,i)=>[i+1,v]),showSymbol:true,symbolSize:6,lineStyle:{width:3,color:'#2457A6'},itemStyle:{color:'#2457A6'}}]},{notMerge:true});
  }
  function finishEpoch(){const ev=net.evaluate(data);state.epoch++;state.losses.push(ev.loss);state.field=fieldData();batch=0;document.getElementById('fallback').innerHTML=state.losses.map((v,i)=>`<tr><td>${i+1}</td><td>${v.toFixed(4)}</td></tr>`).join('');render()}
  function tick(){if(!state.running)return;state.step=(state.step+1)%4;if(state.step===3){net.step(data,16);batch++;if(batch===13)finishEpoch()}render();timer=setTimeout(tick,110)}
  function setRunning(v){state.running=v;clearTimeout(timer);render();if(v)timer=setTimeout(tick,60)}
  function doReset(){setRunning(false);net=makeNet();state.epoch=0;state.step=0;state.losses=[];state.field=null;batch=0;document.getElementById('fallback').innerHTML='<tr><td>0</td><td>尚未计算</td></tr>';render()}
  toggle.addEventListener('click',()=>setRunning(!state.running));reset.addEventListener('click',doReset);document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|BUTTON/.test(e.target.tagName)){e.preventDefault();setRunning(!state.running)}});window.addEventListener('blur',()=>setRunning(false));
  const ro=new ResizeObserver(()=>chart.resize());ro.observe(document.getElementById('chart'));window.addEventListener('beforeunload',()=>{clearTimeout(timer);ro.disconnect();chart.dispose()});
  doReset();
})();
</script>
</body>
</html>
