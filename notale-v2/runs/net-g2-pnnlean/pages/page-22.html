<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习，就是修正参数</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{display:flex;flex-direction:column;gap:18px;}
  .head{height:96px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid color-mix(in srgb,var(--text) 18%,transparent);}
  .head h1{margin:0;font-size:var(--fs-h1);line-height:1.2;letter-spacing:.01em;}
  .head .lead{margin:9px 0 0;max-width:920px;color:color-mix(in srgb,var(--text) 78%,transparent);}
  .cycle{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;}
  .cycle svg{display:block;width:100%;height:100%;overflow:visible;}
  .route{fill:none;stroke:color-mix(in srgb,var(--text) 32%,transparent);stroke-width:4;}
  .arrow{fill:var(--text);opacity:.66;}
  .step rect{fill:var(--bg);stroke:color-mix(in srgb,var(--text) 55%,transparent);stroke-width:2;rx:8;}
  .step text{font-family:var(--font-sans);font-size:20px;font-weight:650;fill:var(--text);text-anchor:middle;dominant-baseline:middle;}
  .step .sub{font-size:15px;font-weight:400;fill:color-mix(in srgb,var(--text) 65%,transparent);}
  .step.forward rect{stroke:var(--model);stroke-width:3;}
  .step.forward .main{fill:var(--model);}
  .step.attn rect{stroke:var(--attention);stroke-width:3;}
  .step.attn .main{fill:var(--attention);}
  .core-ring{fill:var(--bg);stroke:color-mix(in srgb,var(--text) 20%,transparent);stroke-width:2;}
  .core-title{font-family:var(--font-serif);font-size:39px;font-weight:700;fill:var(--text);text-anchor:middle;}
  .core-copy{font-family:var(--font-sans);font-size:18px;fill:color-mix(in srgb,var(--text) 72%,transparent);text-anchor:middle;}
  .goal{fill:var(--bg);stroke:var(--attention);stroke-width:2;rx:18;}
  .goal-text{font-family:var(--font-sans);font-size:17px;font-weight:650;fill:var(--attention);text-anchor:middle;dominant-baseline:middle;}
  .foot{height:116px;display:flex;align-items:center;gap:30px;border-top:1px solid color-mix(in srgb,var(--text) 20%,transparent);}
  .takeaway{flex:1;font-family:var(--font-serif);font-size:24px;line-height:1.45;font-weight:650;}
  .question{width:560px;padding-left:28px;border-left:3px solid var(--attention);font-size:var(--fs-body);line-height:1.45;}
  .question b{display:block;margin-bottom:4px;color:var(--attention);font-size:var(--fs-label);letter-spacing:.08em;}
</style>
</head>
<body data-page="22" data-total="22">
<div id="stage">
  <header class="head">
    <div>
      <h1>学习，就是修正参数</h1>
      <p class="lead">网络不是一次“想对”，而是沿着同一个闭环，反复把误差压低。</p>
    </div>
    <span class="tag">全课收束</span>
  </header>

  <main class="cycle min0" aria-label="神经网络学习的五步闭环">
    <svg viewBox="0 0 1488 594" role="img" aria-labelledby="cycleTitle cycleDesc">
      <title id="cycleTitle">学习是反复修正参数的闭环</title>
      <desc id="cycleDesc">做出预测，量出误差，传回影响，修正参数，再做预测，循环目标是让误差更小。</desc>
      <defs>
        <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
          <path d="M1,1 L11,6 L1,11 Z" fill="var(--text)" opacity=".7"/>
        </marker>
      </defs>
      <path class="route" marker-end="url(#arr)" d="M463 104 C620 28 865 28 1025 103"/>
      <path class="route" marker-end="url(#arr)" d="M1160 166 C1257 222 1267 350 1184 420"/>
      <path class="route" marker-end="url(#arr)" d="M1078 473 C880 558 607 557 414 471"/>
      <path class="route" marker-end="url(#arr)" d="M298 414 C219 342 226 221 322 163"/>

      <g class="step forward" transform="translate(280 72)">
        <rect width="252" height="92"/>
        <text class="main" x="126" y="36">做出预测</text>
        <text class="sub" x="126" y="66">输入沿网络向前计算</text>
      </g>
      <g class="step attn" transform="translate(956 72)">
        <rect width="252" height="92"/>
        <text class="main" x="126" y="36">量出误差</text>
        <text class="sub" x="126" y="66">比较预测与目标</text>
      </g>
      <g class="step" transform="translate(1044 406)">
        <rect width="252" height="92"/>
        <text class="main" x="126" y="36">传回影响</text>
        <text class="sub" x="126" y="66">分清各参数的作用</text>
      </g>
      <g class="step attn" transform="translate(192 406)">
        <rect width="252" height="92"/>
        <text class="main" x="126" y="36">修正参数</text>
        <text class="sub" x="126" y="66">朝误差更小的方向更新</text>
      </g>

      <circle class="core-ring" cx="744" cy="292" r="137"/>
      <text class="core-title" x="744" y="277">反复修正</text>
      <text class="core-copy" x="744" y="315">重复这个动作，就是学习</text>
      <rect class="goal" x="659" y="348" width="170" height="36"/>
      <text class="goal-text" x="744" y="367">目标：误差更小</text>

      <path d="M315 405 C265 323 269 239 323 165" fill="none" stroke="var(--model)" stroke-width="8" opacity=".12"/>
      <text x="213" y="291" transform="rotate(-90 213 291)" font-family="var(--font-sans)" font-size="15" fill="var(--model)" text-anchor="middle">再做预测</text>
      <text x="282" y="348" font-family="var(--font-sans)" font-size="15" fill="var(--attention)" text-anchor="middle">参数改变</text>
      <text x="282" y="224" font-family="var(--font-sans)" font-size="15" fill="var(--model)" text-anchor="middle">检验这次修正</text>
    </svg>
  </main>

  <footer class="foot">
    <div class="takeaway">神经网络的“学会”，是用误差反复修正参数，使误差趋向更小。</div>
    <div class="question"><b>带走的问题</b>当再次听到“模型学会了”，应该先检查什么证据？</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:22,total:22});</script>
</body>
</html>
