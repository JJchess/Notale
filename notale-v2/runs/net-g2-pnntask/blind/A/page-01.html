<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="01" data-total="22">
<div id="stage">
  <style>
    .p01-focus{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 42px 4px}
    .p01-kicker{font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.16em;color:var(--attention);margin:0 0 18px}
    .p01-field{width:min(1380px,100%);min-height:590px;padding:64px 72px 52px;background:color-mix(in srgb,var(--model) 6%,var(--bg));border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .p01-title{font:700 var(--fs-h1)/1.35 var(--font-sans);max-width:1050px;margin:0;color:var(--text)}
    .p01-trunk{width:min(1210px,100%);margin:66px auto 0;display:flex;align-items:center;justify-content:center}
    .p01-action{flex:0 0 280px;min-height:146px;display:flex;align-items:center;justify-content:center;font:700 var(--fs-h2)/1.2 var(--font-sans);border:2px solid currentColor;border-radius:8px;background:var(--bg);position:relative;z-index:1}
    .p01-action.model{color:var(--model)}
    .p01-action.attention{color:var(--attention)}
    .p01-arrow{flex:1;height:2px;min-width:92px;max-width:170px;background:var(--text);position:relative;margin:0 18px}
    .p01-arrow::after{content:"";position:absolute;right:-1px;top:50%;width:12px;height:12px;border-top:2px solid var(--text);border-right:2px solid var(--text);transform:translateY(-50%) rotate(45deg)}
    .p01-conclusion{max-width:1050px;margin:58px auto 0;font:600 var(--fs-lead)/1.6 var(--font-serif);color:var(--text)}
    .p01-question{width:min(1380px,100%);margin-top:18px;padding-top:16px;border-top:1px solid color-mix(in srgb,var(--text) 28%,transparent);font:500 var(--fs-body)/1.4 var(--font-sans);color:var(--text)}
  </style>
  <main class="focus k-generalization p01-focus min0" aria-labelledby="p01-title">
    <p class="p01-kicker">FROM MYSTERY TO MOVES</p>
    <section class="p01-field" aria-label="学习可以拆成连续动作">
      <h1 id="p01-title" class="p01-title">神经网络的“学习”，可以拆成一连串看得见的调参动作</h1>
      <div class="p01-trunk" aria-label="学习包含三个连续动作：尝试、看结果、修正">
      <div class="tag p01-action">尝试</div>
      <span class="p01-arrow" aria-hidden="true"></span>
      <div class="tag p01-action model">看结果</div>
      <span class="p01-arrow" aria-hidden="true"></span>
      <div class="tag p01-action attention">修正</div>
      </div>
      <p class="p01-conclusion">它不是突然懂了，而是在一次次尝试后，把可调旋钮移向更好的位置。</p>
    </section>
    <p class="p01-question">这一连串动作，究竟按什么顺序发生？</p>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
