<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="02" data-total="22">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;gap:18px;}
    .p02-head{height:92px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid rgba(38,43,51,.22);}
    .p02-head h1{margin:0;font-size:var(--fs-h1);line-height:1.2;letter-spacing:.02em;}
    .p02-head .lead{margin:10px 0 0;max-width:780px;}
    .p02-kicker{font-family:var(--font-mono);font-size:var(--fs-label);color:var(--model);padding-top:9px;letter-spacing:.08em;}
    .p02-main{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;}
    .p02-cycle{position:relative;width:1400px;height:610px;}
    .p02-flow{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
    .p02-step{position:absolute;width:290px;height:188px;box-sizing:border-box;padding:24px 25px 20px;background:#F4F1E8;border-top:4px solid var(--model);box-shadow:0 2px 0 rgba(38,43,51,.16);}
    .p02-step.s1{left:38px;top:78px}.p02-step.s2{left:380px;top:78px}.p02-step.s3{left:722px;top:78px}.p02-step.s4{left:1064px;top:78px;border-top-color:var(--attention)}
    .p02-n{font-family:var(--font-mono);font-size:var(--fs-label);color:var(--model);letter-spacing:.08em;}
    .p02-step.s4 .p02-n{color:var(--attention)}
    .p02-step h2{margin:12px 0 8px;font-size:var(--fs-h2);line-height:1.25;}
    .p02-step p{margin:0;font-size:var(--fs-sec);line-height:1.45;color:rgba(38,43,51,.78);}
    .p02-token{display:inline-flex;align-items:center;justify-content:center;min-width:68px;height:38px;padding:0 12px;border:2px solid var(--model);border-radius:8px;font-family:var(--font-mono);font-size:var(--fs-body);color:var(--model);background:#fffdf7;}
    .p02-step.s4 .p02-token{border-color:var(--attention);color:var(--attention)}
    .p02-result{position:absolute;left:272px;right:272px;bottom:30px;height:158px;display:flex;align-items:center;justify-content:center;gap:28px;border-top:1px solid rgba(38,43,51,.24);}
    .p02-result strong{font-family:var(--font-serif);font-size:28px;line-height:1.35;font-weight:600;}
    .p02-result .again{font-family:var(--font-mono);font-size:var(--fs-label);color:var(--attention);border:2px solid var(--attention);border-radius:999px;padding:10px 16px;}
    .p02-note{position:absolute;right:40px;bottom:42px;width:205px;font-size:var(--fs-sec);line-height:1.45;color:rgba(38,43,51,.72);}
    .p02-note b{color:var(--text);}
  </style>
  <header class="p02-head">
    <div>
      <h1>学习，是一圈反复发生的四步</h1>
      <p class="lead">模型先给出预测，再根据误差调整自己；新参数会立刻进入下一轮。</p>
    </div>
    <div class="p02-kicker">LEARNING LOOP</div>
  </header>
  <main class="p02-main min0" aria-label="学习的四步循环">
    <section class="p02-cycle" aria-label="预测、量误差、找方向、改参数，然后再次预测">
      <svg class="p02-flow" viewBox="0 0 1400 610" role="img" aria-label="四步从左到右推进，并从改参数回到预测">
        <defs>
          <marker id="p02-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 Z" fill="#2457A6"/></marker>
          <marker id="p02-arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 Z" fill="#E76F2E"/></marker>
        </defs>
        <path d="M328 172 H372 M670 172 H714 M1012 172 H1056" fill="none" stroke="#2457A6" stroke-width="5" marker-end="url(#p02-arrow)"/>
        <path d="M1210 274 V353 Q1210 390 1173 390 H210 Q172 390 172 352 V278" fill="none" stroke="#E76F2E" stroke-width="5" marker-end="url(#p02-arrow-orange)"/>
        <text x="690" y="378" text-anchor="middle" font-size="15" font-family="monospace" fill="#E76F2E">新参数进入下一轮</text>
      </svg>
      <article class="p02-step s1">
        <div class="p02-n">01 / PREDICT</div><h2>做出预测</h2>
        <p>把当前输入交给模型，得到一个当前答案。</p>
        <div style="margin-top:14px"><span class="p02-token">预测</span></div>
      </article>
      <article class="p02-step s2">
        <div class="p02-n">02 / MEASURE</div><h2>量出误差</h2>
        <p>比较预测与目标，把偏差变成可比较的量。</p>
        <div style="margin-top:14px"><span class="p02-token">误差</span></div>
      </article>
      <article class="p02-step s3">
        <div class="p02-n">03 / DIRECTION</div><h2>找到方向</h2>
        <p>判断参数往哪边改，能让误差变小。</p>
        <div style="margin-top:14px"><span class="p02-token">方向</span></div>
      </article>
      <article class="p02-step s4">
        <div class="p02-n">04 / UPDATE</div><h2>改动参数</h2>
        <p>沿这个方向迈一步，得到一组新参数。</p>
        <div style="margin-top:14px"><span class="p02-token">新参数</span></div>
      </article>
      <div class="p02-result">
        <span class="again">再预测</span>
        <strong>学习不是一次答对，<br>而是让下一轮有机会少错一点。</strong>
      </div>
      <aside class="p02-note"><b>这一页只看顺序：</b><br>每一轮都沿同一条路径前进，再回到起点。</aside>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
