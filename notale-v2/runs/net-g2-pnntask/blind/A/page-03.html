<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:22px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;border-bottom:1px solid color-mix(in srgb,var(--text) 22%,transparent);padding-bottom:18px}
h1{font-size:var(--fs-h1);line-height:1.15;margin:0}.lead{margin:9px 0 0;max-width:850px}
.step{font:600 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.08em;color:var(--attention)}
.lab{flex:1;display:flex;flex-direction:column;min-height:0;gap:18px}
.prompt{display:flex;align-items:center;justify-content:space-between;gap:28px;padding:18px 24px;background:color-mix(in srgb,var(--attention) 7%,transparent);border-left:5px solid var(--attention)}
.prompt strong{font-size:var(--fs-h2)}.prompt p{font-size:var(--fs-sec);line-height:1.4;margin:5px 0 0}
.compare{flex:1;display:grid;grid-template-columns:1fr 116px 1fr;align-items:stretch;min-height:0}
.case{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 34px;border:2px solid color-mix(in srgb,var(--text) 20%,transparent);border-radius:8px;background:color-mix(in srgb,var(--model) 18%,var(--bg))}
.case.chosen{border-color:var(--attention)}.case.revealed{border-color:var(--model)}
.case h2{font-size:var(--fs-h2);margin:0}.flow{display:flex;align-items:center;justify-content:center;width:100%;gap:15px}
.readout{min-width:104px;padding:14px 18px;text-align:center;border:1px solid color-mix(in srgb,var(--text) 30%,transparent);border-radius:8px;background:var(--bg)}
.readout .k{display:block;font-size:var(--fs-label);margin-bottom:7px}.readout .v{font:700 30px/1 var(--font-mono);color:var(--model)}
.times{font:700 28px/1 var(--font-mono)}.arrow{font-size:32px;color:var(--model)}
.result{width:min(300px,90%);min-height:82px;padding:14px 20px;text-align:center;border:2px dashed color-mix(in srgb,var(--text) 25%,transparent);border-radius:8px;background:var(--bg)}
.result .k{font-size:var(--fs-label)}.result .v{display:block;margin-top:8px;font:700 34px/1 var(--font-mono);color:var(--model)}
.result.wait .v{color:var(--text);opacity:.45}.versus{display:flex;align-items:center;justify-content:center;font:700 var(--fs-h2)/1 var(--font-mono);color:color-mix(in srgb,var(--text) 55%,transparent)}
.actions{display:flex;justify-content:center;gap:16px}.btn{min-width:194px}.btn[aria-pressed="true"]{border-color:var(--attention);box-shadow:inset 0 -4px 0 var(--attention)}
.conclusion{min-height:48px;text-align:center;font:600 var(--fs-lead)/1.45 var(--font-serif);margin:0}.conclusion b{color:var(--model)}
.footer{display:flex;justify-content:center;align-items:center;min-height:48px}.reset{min-width:132px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body data-page="03" data-total="22">
<div id="stage">
  <header class="head">
    <div><div class="step">实验 03 · 加权信号</div><h1>同一输入，不同分量</h1><p class="lead">输入相同，只改变权重。先判断，再揭晓两边的加权信号。</p></div>
    <span class="tag">输入固定为 0.8</span>
  </header>
  <main class="lab min0" aria-labelledby="question">
    <section class="prompt">
      <div><strong id="question">哪一边的加权信号更大？</strong><p>选择你的判断。两边会同时显示计算结果，便于直接比较。</p></div>
      <span class="hint">点击左边或右边</span>
    </section>
    <div class="compare k-comparison">
      <section class="case" id="case-left" aria-label="左边：输入0.8，权重0.5">
        <h2>左边</h2><div class="flow"><div class="readout"><span class="k">输入</span><span class="v input-a">—</span></div><span class="times">×</span><div class="readout"><span class="k">权重</span><span class="v weight-a">—</span></div><span class="arrow">→</span></div>
        <div class="result wait"><span class="k">加权信号</span><span class="v result-a">？</span></div>
      </section>
      <div class="versus">VS</div>
      <section class="case" id="case-right" aria-label="右边：输入0.8，权重1.5">
        <h2>右边</h2><div class="flow"><div class="readout"><span class="k">输入</span><span class="v input-b">—</span></div><span class="times">×</span><div class="readout"><span class="k">权重</span><span class="v weight-b">—</span></div><span class="arrow">→</span></div>
        <div class="result wait"><span class="k">加权信号</span><span class="v result-b">？</span></div>
      </section>
    </div>
    <div class="actions" role="group" aria-label="选择哪边更大">
      <button class="btn" id="pick-left" type="button">左边更大</button><button class="btn" id="pick-right" type="button">右边更大</button>
    </div>
    <p class="conclusion" id="feedback" aria-live="polite">先作出判断，计算结果暂时隐藏。</p>
    <div class="footer"><button class="btn reset" id="reset" type="button" hidden>重置比较</button></div>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  Deck.init({index:3,total:22});
  const data={input:0.8,weights:[0.5,1.5]};
  const results=data.weights.map(w=>Lec.P.weightedSum([data.input],[w],0));
  const initialState=()=>({mode:'ready',choice:null}); let state=initialState();
  const $=s=>document.querySelector(s), left=$('#case-left'),right=$('#case-right'), buttons=[$('#pick-left'),$('#pick-right')], reset=$('#reset'), feedback=$('#feedback');
  $('.input-a').textContent=$('.input-b').textContent=data.input.toFixed(1); $('.weight-a').textContent=data.weights[0].toFixed(1); $('.weight-b').textContent=data.weights[1].toFixed(1);
  function transition(s,a){if(a.type==='choose'&&s.mode==='ready')return{mode:'revealed',choice:a.choice};if(a.type==='reset')return initialState();return s}
  function render(){const shown=state.mode==='revealed';[$('.result-a'),$('.result-b')].forEach((el,i)=>el.textContent=shown?results[i].toFixed(2):'？');document.querySelectorAll('.result').forEach(el=>el.classList.toggle('wait',!shown));left.className='case'+(shown?' revealed':'')+(state.choice===0?' chosen':'');right.className='case'+(shown?' revealed':'')+(state.choice===1?' chosen':'');buttons.forEach((b,i)=>{b.setAttribute('aria-pressed',String(state.choice===i));b.disabled=shown});reset.hidden=!shown;feedback.innerHTML=shown?(state.choice===1?'你的判断与计算一致。':'计算给出了不同结果。')+' 同样是 <b>'+data.input.toFixed(1)+'</b>，权重较大的一边得到更大的加权信号：<b>'+results[1].toFixed(2)+' ＞ '+results[0].toFixed(2)+'</b>。':'先作出判断，计算结果暂时隐藏。'}
  function dispatch(a){const n=transition(state,a);if(n===state)return;state=n;render()}
  const events=new AbortController(),opt={signal:events.signal};buttons.forEach((b,i)=>b.addEventListener('click',()=>dispatch({type:'choose',choice:i}),opt));reset.addEventListener('click',()=>{dispatch({type:'reset'});buttons[0].focus()},opt);
  let dead=false;function cleanup(){if(dead)return;dead=true;events.abort()}window.addEventListener('pagehide',cleanup,{once:true});render();
})();
</script>
</body>
</html>
