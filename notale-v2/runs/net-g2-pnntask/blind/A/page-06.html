<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:16px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.15em;color:var(--attention);margin:0 0 10px}
h1{font:700 var(--fs-h1)/1.22 var(--font-sans);margin:0;max-width:1120px}
.prompt{font:600 var(--fs-label)/1.4 var(--font-sans);color:var(--attention);margin:0 0 3px;white-space:nowrap}
main{flex:1;display:flex;flex-direction:column;gap:13px}
.class-head{display:flex;align-items:center;gap:18px;min-height:58px}
.class-title{font:700 var(--fs-h2)/1.2 var(--font-sans)}
.branch{height:1px;background:color-mix(in srgb,var(--text) 35%,transparent);flex:1;position:relative}
.branch:after{content:"";position:absolute;right:0;top:-4px;border-left:8px solid var(--text);border-top:4px solid transparent;border-bottom:4px solid transparent;opacity:.55}
.rule-tabs{display:flex;gap:10px}
.rule-tab{min-width:138px;min-height:46px;border:2px solid color-mix(in srgb,var(--text) 42%,transparent);border-radius:8px;background:transparent;color:var(--text);font:700 var(--fs-body)/1 var(--font-sans);cursor:pointer;padding:0 18px}
.rule-tab[aria-selected="true"]{border-color:var(--attention);background:color-mix(in srgb,var(--attention) 9%,transparent);color:var(--attention)}
.rule-tab:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.triptych{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.rule-panel{min-width:0;border:2px solid color-mix(in srgb,var(--text) 24%,transparent);border-radius:8px;padding:16px 17px 14px;display:flex;flex-direction:column;gap:9px;background:color-mix(in srgb,var(--bg) 88%,white);transition:border-color .16s,background .16s}
.rule-panel.active{border-color:var(--attention);background:color-mix(in srgb,var(--attention) 5%,var(--bg))}
.panel-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.rule-name{font:750 var(--fs-h2)/1.15 var(--font-sans);margin:0}
.rule-text{font:500 var(--fs-sec)/1.35 var(--font-sans);margin:4px 0 0;min-height:44px}
.adopt{font:700 var(--fs-label)/1.2 var(--font-sans);color:var(--model);white-space:nowrap}
.chart{width:100%;height:245px;display:block;overflow:visible}.plotbg{fill:color-mix(in srgb,var(--text) 3%,var(--bg));stroke:color-mix(in srgb,var(--text) 18%,transparent);stroke-width:1}
.axis{stroke:color-mix(in srgb,var(--text) 45%,transparent);stroke-width:1.5}.grid{stroke:color-mix(in srgb,var(--text) 18%,transparent);stroke-width:1}.band{fill:color-mix(in srgb,var(--model) 9%,transparent)}
.curve{fill:none;stroke:color-mix(in srgb,var(--text) 55%,transparent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.active .curve{stroke:var(--attention);stroke-width:4}
.zline{stroke:var(--attention);stroke-width:1.5;stroke-dasharray:5 5;opacity:.7}.chartlabel{font:600 15px var(--font-sans);fill:color-mix(in srgb,var(--text) 48%,transparent)}.point{fill:var(--bg);stroke:var(--attention);stroke-width:4;opacity:0}.active .point{opacity:1;transition:cy .24s ease}.tick{font:13px var(--font-mono);fill:color-mix(in srgb,var(--text) 65%,transparent)}
.readout{display:flex;align-items:center;justify-content:space-between;border-top:1px solid color-mix(in srgb,var(--text) 18%,transparent);padding-top:10px}
.io{font:600 var(--fs-label)/1.3 var(--font-sans)}.value{font:750 25px/1 var(--font-mono);color:var(--model);font-variant-numeric:tabular-nums}.active .value{color:var(--attention)}
.note{font:500 var(--fs-sec)/1.35 var(--font-sans);margin:0;min-height:44px}.range-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.range-chip{border:1px solid color-mix(in srgb,var(--text) 20%,transparent);border-radius:8px;padding:8px 10px;font:600 var(--fs-label)/1.25 var(--font-sans);background:color-mix(in srgb,var(--model) 10%,var(--bg))}.range-chip b{display:block;margin-top:3px;font-family:var(--font-mono);color:var(--model)}
.chain{font:650 var(--fs-body)/1.35 var(--font-mono);color:var(--model);padding:9px 11px;border-radius:8px;background:color-mix(in srgb,var(--model) 8%,transparent);margin-top:auto}
footer{display:flex;align-items:center;justify-content:space-between;gap:34px;border-top:1px solid color-mix(in srgb,var(--text) 22%,transparent);padding-top:13px}
.takeaway{font:650 var(--fs-lead)/1.4 var(--font-serif);margin:0;max-width:910px}.next{font:600 var(--fs-sec)/1.4 var(--font-sans);margin:0;max-width:500px;text-align:right}
@media (prefers-reduced-motion:reduce){.rule-panel,.point{transition:none}}
</style>
</head>
<body data-page="06" data-total="22">
<div id="stage">
  <header>
    <div><p class="kicker">ACTIVATION RULE</p><h1>同一个加权总和，经过不同激活规则，会得到不同形状的输出</h1></div>
    <p class="prompt" id="live" aria-live="polite">点击规则，或聚焦后按 ← → 比较</p>
  </header>
  <main class="k-classification min0" aria-labelledby="activation-title">
    <div class="class-head"><span class="class-title" id="activation-title">激活</span><span class="branch" aria-hidden="true"></span><div class="rule-tabs" role="tablist" aria-label="选择关注的激活规则">
      <button class="rule-tab" role="tab" aria-selected="false" data-rule="linear">直通</button>
      <button class="rule-tab" role="tab" aria-selected="false" data-rule="step">阶跃</button>
      <button class="rule-tab" role="tab" aria-selected="true" data-rule="sigmoid">sigmoid</button>
    </div></div>
    <div class="triptych min0" id="panels"></div>
  </main>
  <footer><p class="takeaway">激活规定输出怎样变化；本课采用 sigmoid，把任意加权总和压到 0–1。</p><p class="next">神经元会算出预测了，但怎样把“预测得好不好”变成一个数？</p></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  Deck.init({index:6,total:22});
  const events = new AbortController();
  const defs = [
    {id:'linear', name:'直通', rule:'输出 = 加权总和', note:'原样放行，输出范围不受限', range:'不受限'},
    {id:'step', name:'阶跃', rule:'z ≥ 0 输出 1；否则输出 0', note:'只给 0 或 1，跳变发生在 0', range:'只有 0 或 1'},
    {id:'sigmoid', name:'sigmoid', rule:'平滑压到 0–1', note:'任意输入都落在 0 与 1 之间', range:'0 到 1', adopt:'本课采用'}
  ];
  const lessonZ = Number(Lec.K?.activationZ ?? Lec.K?.neuron?.z ?? Lec.K?.p06?.z ?? 0.2);
  const initialState = () => ({selected:'sigmoid'});
  let state = initialState();
  const panels = document.getElementById('panels');
  const NS='http://www.w3.org/2000/svg', W=420,H=245, m={l:38,r:14,t:12,b:30};
  const sx=z=>m.l+(z+4)/8*(W-m.l-m.r), sy=y=>m.t+(4-y)/5*(H-m.t-m.b);
  function activate(id,z){
    try{return Lec.P.activation(id,z)}catch(error){
      if(id==='step') return z>=0?1:0;
      throw error;
    }
  }
  const value = id => activate(id, lessonZ);
  const fmt = (id,v) => id==='sigmoid' ? v.toFixed(4) : v.toFixed(1);
  function pathFor(id){
    if(id==='step') return `M${sx(-4)},${sy(0)} L${sx(0)},${sy(0)} L${sx(0)},${sy(1)} L${sx(4)},${sy(1)}`;
    const pts=[]; for(let i=0;i<=100;i++){const z=-4+i*.08;pts.push(`${i?'L':'M'}${sx(z).toFixed(1)},${sy(valueAt(id,z)).toFixed(1)}`)} return pts.join(' ');
  }
  function valueAt(id,z){return activate(id,z)}
  function svgMarkup(d){
    const y=value(d.id), ticks=[-4,0,4];
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${d.name}函数图，横轴 z 从负 4 到 4，纵轴负 1 到 4">
      <rect class="plotbg" x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}"/>
      <rect class="band" x="${m.l}" y="${sy(1)}" width="${W-m.l-m.r}" height="${sy(0)-sy(1)}"/>
      ${[-1,0,1,2,3,4].map(v=>`<line class="grid" x1="${m.l}" y1="${sy(v)}" x2="${W-m.r}" y2="${sy(v)}"/>`).join('')}${[-4,-3,-2,-1,0,1,2,3,4].map(v=>`<line class="grid" x1="${sx(v)}" y1="${m.t}" x2="${sx(v)}" y2="${H-m.b}"/>`).join('')}
      <line class="axis" x1="${m.l}" y1="${sy(0)}" x2="${W-m.r}" y2="${sy(0)}"/><line class="axis" x1="${sx(0)}" y1="${m.t}" x2="${sx(0)}" y2="${H-m.b}"/>
      <line class="zline" x1="${sx(lessonZ)}" y1="${m.t}" x2="${sx(lessonZ)}" y2="${H-m.b}"/>
      <text class="chartlabel" x="${sx(-2)}" y="${m.t+20}" text-anchor="middle">z &lt; 0 · 负输入区</text><text class="chartlabel" x="${sx(2)}" y="${m.t+20}" text-anchor="middle">z &gt; 0 · 正输入区</text>
      <path class="curve" d="${pathFor(d.id)}"/><circle class="point" cx="${sx(lessonZ)}" cy="${sy(y)}" r="7"/>
      ${ticks.map(t=>`<text class="tick" x="${sx(t)}" y="${H-7}" text-anchor="middle">${t}</text>`).join('')}${[-1,1,4].map(t=>`<text class="tick" x="${m.l-7}" y="${sy(t)+4}" text-anchor="end">${t}</text>`).join('')}<text class="tick" x="${W-5}" y="${sy(0)-7}" text-anchor="end">z</text>
    </svg>`;
  }
  defs.forEach(d=>{
    const y=value(d.id), article=document.createElement('article'); article.className='rule-panel'; article.dataset.rule=d.id;
    article.innerHTML=`<div class="panel-top"><div><h2 class="rule-name">${d.name}</h2><p class="rule-text">${d.rule}</p></div>${d.adopt?`<span class="adopt">${d.adopt}</span>`:''}</div>${svgMarkup(d)}<div class="readout"><span class="io">同一输入 <b>z = ${lessonZ.toFixed(1)}</b> → 输出</span><span class="value">${fmt(d.id,y)}</span></div><p class="note">${d.note}</p><div class="range-row"><span class="range-chip">共享输入轴<b>−4 到 4</b></span><span class="range-chip">可能的输出<b>${d.range}</b></span></div>${d.id==='sigmoid'?`<div class="chain">加权总和 ${lessonZ.toFixed(1)} → sigmoid → 输出 ${y.toFixed(4)}</div>`:''}`;
    panels.appendChild(article);
  });
  const tabs=[...document.querySelectorAll('.rule-tab')], cards=[...document.querySelectorAll('.rule-panel')], live=document.getElementById('live');
  function transition(s,a){if(a.type==='select'&&defs.some(d=>d.id===a.id)&&a.id!==s.selected)return {selected:a.id}; return s}
  function render(s,announce=true){
    tabs.forEach(t=>{const on=t.dataset.rule===s.selected;t.setAttribute('aria-selected',String(on));t.tabIndex=on?0:-1});
    cards.forEach(c=>c.classList.toggle('active',c.dataset.rule===s.selected));
    if(announce){const d=defs.find(x=>x.id===s.selected), y=value(d.id);live.textContent=`当前关注${d.name}：输入 ${lessonZ.toFixed(1)}，输出 ${fmt(d.id,y)}。${d.note}`}
  }
  function dispatch(a){const next=transition(state,a);if(next===state)return;state=next;render(state)}
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>dispatch({type:'select',id:t.dataset.rule}),{signal:events.signal});
    t.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();e.stopPropagation();const n=(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;dispatch({type:'select',id:tabs[n].dataset.rule});tabs[n].focus()},{signal:events.signal});
  });
  render(state,false);
  let destroyed=false;function destroy(){if(destroyed)return;destroyed=true;events.abort()}
  window.addEventListener('pagehide',destroy,{once:true});
})();
</script>
</body>
</html>
