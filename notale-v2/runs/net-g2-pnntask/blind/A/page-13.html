<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid color-mix(in srgb,var(--text) 18%,transparent);padding-bottom:14px}
h1{font-size:var(--fs-h1);line-height:1.15;margin:0}.lead{margin:8px 0 0}.fixed{display:flex;gap:12px;align-items:center}.fixed span{padding:8px 13px;border:1px solid color-mix(in srgb,var(--text) 25%,transparent);border-radius:8px;font:var(--fs-label)/1.2 var(--font-mono)}
.main{flex:1;display:grid;grid-template-columns:330px 1fr;gap:34px}.controls{display:flex;flex-direction:column;gap:18px;padding:22px;background:color-mix(in srgb,var(--text) 10%,var(--bg));border-radius:8px}.controls h2,.model h2{font-size:var(--fs-h2);margin:0}.step-buttons{display:flex;gap:10px}.wbtn{flex:1;min-height:58px;background:transparent;border:2px solid color-mix(in srgb,var(--text) 35%,transparent);border-radius:8px;font:700 var(--fs-body) var(--font-mono);color:var(--text)}.wbtn[aria-pressed="true"]{border-color:var(--attention);background:color-mix(in srgb,var(--attention) 10%,transparent);box-shadow:inset 0 -5px 0 var(--attention)}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:12px}.read{padding:14px;border-left:4px solid var(--model);background:color-mix(in srgb,var(--model) 7%,transparent)}.read.loss{border-left-color:var(--attention)}.read .lab{font-size:var(--fs-label);display:block}.read strong{display:block;font:700 27px/1.2 var(--font-mono);margin-top:6px}
.hint{margin:0}.reset{align-self:flex-start}.model{position:relative;display:flex;flex-direction:column;gap:13px;padding:8px 0}.track{position:relative;flex:1;min-height:390px;border:1px solid color-mix(in srgb,var(--text) 24%,transparent);border-radius:8px;background:linear-gradient(to right,color-mix(in srgb,var(--model) 12%,var(--bg)) 49.8%,color-mix(in srgb,var(--text) 20%,var(--bg)) 50%,color-mix(in srgb,var(--model) 12%,var(--bg)) 50.2%)}
.axis{position:absolute;left:75px;right:75px;top:94px;height:4px;background:var(--text)}.axis:after{content:"";position:absolute;right:-2px;top:-8px;border-left:16px solid var(--text);border-top:10px solid transparent;border-bottom:10px solid transparent}.tick{position:absolute;top:-16px;width:2px;height:36px;background:var(--text)}.tick span{position:absolute;top:43px;transform:translateX(-50%);font:var(--fs-tick) var(--font-mono)}
.point{position:absolute;top:62px;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;border:3px solid var(--model);background:var(--bg);display:grid;place-items:center;font:700 var(--fs-body) var(--font-mono);transition:left .18s ease}.point:after{content:"当前 w";position:absolute;top:-31px;white-space:nowrap;font:var(--fs-label) var(--font-sans);color:var(--attention)}
.flow{position:absolute;left:70px;right:70px;top:205px;display:flex;align-items:center;justify-content:space-between}.node{width:165px;min-height:90px;border:2px solid var(--text);border-radius:8px;display:grid;place-items:center;text-align:center;font-size:var(--fs-body);line-height:1.4}.node.value{border-color:var(--model)}.arrow{flex:1;height:3px;background:var(--model);position:relative;margin:0 14px}.arrow:after{content:"";position:absolute;right:-1px;top:-7px;border-left:13px solid var(--model);border-top:8px solid transparent;border-bottom:8px solid transparent}.lossbar{position:absolute;left:70px;right:70px;bottom:30px}.lossbar .labelrow{display:flex;justify-content:space-between;font-size:var(--fs-label);margin-bottom:8px}.barbg{height:26px;background:color-mix(in srgb,var(--text) 9%,transparent);border-radius:8px;overflow:hidden}.barfill{height:100%;background:var(--attention);transition:width .18s ease}.conclusion{font:var(--fs-lead)/1.45 var(--font-serif);margin:0;padding:11px 18px;border-left:5px solid var(--attention);min-height:52px}
@media(prefers-reduced-motion:reduce){.point,.barfill{transition:none}}
</style>
</head>
<body data-page="13" data-total="22">
<div id="stage">
  <header class="head">
    <div><h1>轻推一下，看误差往哪边走</h1><p class="lead">只改变权重 <b>w</b>，比较它附近三处的预测与损失。</p></div>
    <div class="fixed" aria-label="固定条件"><span>x = 0.8</span><span>b = −0.2</span><span>目标 = 1</span></div>
  </header>
  <main class="main min0">
    <section class="controls min0" aria-labelledby="act-title">
      <h2 id="act-title">把 w 轻推一格</h2>
      <p class="hint">依次选择 0.4、0.5、0.6，观察橙色损失条怎样变化。</p>
      <div class="step-buttons" role="group" aria-label="选择权重">
        <button class="wbtn" data-i="0" aria-pressed="false">0.4</button>
        <button class="wbtn" data-i="1" aria-pressed="true">0.5</button>
        <button class="wbtn" data-i="2" aria-pressed="false">0.6</button>
      </div>
      <div class="readout">
        <div class="read"><span class="lab">当前预测</span><strong id="pred">0.5498</strong></div>
        <div class="read loss"><span class="lab">当前损失</span><strong id="loss">0.1013</strong></div>
      </div>
      <p class="note">损失越小，说明预测离目标 1 越近。</p>
      <button class="btn reset" id="reset">复位到 w = 0.5</button>
    </section>
    <section class="model min0" aria-labelledby="obs-title">
      <h2 id="obs-title">同一条线上比较，不换输入</h2>
      <div class="track">
        <div class="axis" aria-hidden="true"><i class="tick" style="left:12%"><span>0.4</span></i><i class="tick" style="left:50%"><span>0.5</span></i><i class="tick" style="left:88%"><span>0.6</span></i></div>
        <div class="point" id="point" style="left:50%">0.5</div>
        <div class="flow">
          <div class="node">输入 x<br><b>0.8</b></div><div class="arrow"></div><div class="node">权重 w<br><b id="flowW">0.5</b></div><div class="arrow"></div><div class="node value">预测<br><b id="flowP">0.5498</b></div><div class="arrow"></div><div class="node">目标<br><b>1</b></div>
        </div>
        <div class="lossbar"><div class="labelrow"><span>与目标的距离压成一个数</span><b id="lossLabel">损失 0.1013</b></div><div class="barbg"><div class="barfill" id="bar" style="width:91.7%"></div></div></div>
      </div>
      <p class="conclusion" id="conclusion" aria-live="polite">先向左、向右各看一步，再判断该往哪边调。</p>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(()=>{
  Deck.init({index:13,total:22});
  const weights=[0.4,0.5,0.6], positions=[12,50,88];
  const initialState=()=>({index:1,visited:[false,true,false]});
  let state=initialState();
  const events=new AbortController(), q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];
  function measure(w){
    const r=Lec.P.neuronForward([0.8],[w],-0.2,'sigmoid');
    const raw=typeof r==='number'?r:(r.output ?? r.value ?? r.outputs?.[0]);
    const prediction=Math.floor(raw*10000)/10000;
    return {prediction,loss:0.5*(prediction-1)*(prediction-1)};
  }
  function transition(s,a){
    if(a.type==='select'&&a.index>=0&&a.index<3){const v=s.visited.slice();v[a.index]=true;return {index:a.index,visited:v}}
    if(a.type==='reset')return initialState(); return s;
  }
  function render(){
    const w=weights[state.index], m=measure(w), all=state.visited.every(Boolean);
    qa('.wbtn').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===state.index)));
    q('#pred').textContent=q('#flowP').textContent=m.prediction.toFixed(4);
    q('#loss').textContent=m.loss.toFixed(4); q('#flowW').textContent=w.toFixed(1);
    q('#point').style.left=positions[state.index]+'%';q('#point').textContent=w.toFixed(1);qa('.tick span').forEach((el,i)=>el.style.visibility=i===state.index?'hidden':'visible');
    q('#lossLabel').textContent='损失 '+m.loss.toFixed(4);q('#bar').style.width=(m.loss/0.1105*100).toFixed(1)+'%';
    const text=all?'附近三次比较显示：w 增大时，预测更接近 1，损失从 0.1105 降到 0.0927。此处应增大 w。':'再比较其余位置：方向要由附近的损失高低决定。';
    q('#conclusion').textContent=text;
  }
  function dispatch(a){const n=transition(state,a);if(n===state)return;state=n;render()}
  qa('.wbtn').forEach(b=>b.addEventListener('click',()=>dispatch({type:'select',index:+b.dataset.i}),{signal:events.signal}));
  q('#reset').addEventListener('click',()=>{dispatch({type:'reset'});qa('.wbtn')[1].focus();q('#conclusion').textContent='已复位到 w = 0.5。再向两边各看一步。'},{signal:events.signal});
  let dead=false;function destroy(){if(dead)return;dead=true;events.abort()}window.addEventListener('pagehide',destroy,{once:true});
  render();
})();
</script>
</body>
</html>
