<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="20" data-total="22">
<div id="stage">
  <style>
    #stage{gap:20px}
    .head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;flex:0 0 auto}
    .kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.16em;color:var(--attention);margin-bottom:10px}
    h1{font:700 var(--fs-h1)/1.15 var(--font-sans);margin:0;color:var(--text)}
    .prompt{font:500 var(--fs-lead)/1.4 var(--font-sans);max-width:520px;margin:0;text-align:right}
    .work{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:42px;flex:1;min-height:0}
    .quiz.ledger{position:relative;padding:20px 24px 18px 20px;display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.28)}
    .ledger-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-left:2px}
    .ledger-top h2,.side h2{font:700 var(--fs-h2)/1.2 var(--font-sans);margin:0}
    .hint{margin:0;font-size:var(--fs-label)}
    #list{list-style:none;margin:0;padding:0;display:flex;flex:1;flex-direction:column;justify-content:space-between;gap:12px;position:relative}
    #list::before{content:"";position:absolute;left:39px;top:46px;bottom:46px;border-left:2px solid rgba(36,87,166,.28);z-index:0}
    .row{display:grid;grid-template-columns:58px minmax(0,1fr) 172px;align-items:stretch;gap:14px;position:relative;min-height:126px}
    .slot{font:700 var(--fs-body)/1 var(--font-mono);color:var(--model);text-align:center;z-index:2;background:var(--bg);border:2px solid var(--model);border-radius:50%;width:48px;height:48px;display:grid;place-items:center}
    .opt{position:relative;display:flex;align-items:center;gap:16px;min-height:104px;padding:12px 18px;border:2px solid rgba(35,42,50,.42);background:rgba(36,87,166,.075);border-radius:8px;cursor:grab;touch-action:none;transition:border-color .16s,transform .16s,background .16s}
    .opt:active{cursor:grabbing}.opt:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    .handle{font:700 22px/1 var(--font-mono);color:var(--attention);letter-spacing:-3px;white-space:nowrap}
    .item-title{font:700 var(--fs-body)/1.25 var(--font-sans)}
    .io{display:grid;grid-template-columns:1fr 1.35fr;gap:18px;margin-top:10px;font:500 var(--fs-sec)/1.35 var(--font-sans)}.io span{padding-top:7px;border-top:1px solid rgba(35,42,50,.2)}.io b{font:700 var(--fs-label)/1 var(--font-mono);color:var(--attention);margin-right:6px}
    .basis{font:400 var(--fs-sec)/1.35 var(--font-sans);margin-top:5px;display:none;color:var(--text)}
    .moves{display:flex;align-items:center;gap:8px}.moves button{min-width:76px;padding:10px 8px}
    .placeholder .opt{border-style:dashed;background:transparent;color:transparent}.placeholder .handle{visibility:hidden}
    .dragging .opt{opacity:.34}.row.correct-link .opt{border-color:var(--model)}
    .is-complete .opt{border-color:var(--model);background:rgba(36,87,166,.06)}
    .is-complete .basis{display:block}.is-complete .handle{color:var(--model)}
    .flow-arrow{position:absolute;left:31px;bottom:-14px;width:17px;height:18px;z-index:3;opacity:0}
    .flow-arrow::before{content:"";position:absolute;left:8px;top:0;height:11px;border-left:2px solid var(--model)}
    .flow-arrow::after{content:"";position:absolute;left:3px;top:7px;width:8px;height:8px;border-right:2px solid var(--model);border-bottom:2px solid var(--model);transform:rotate(45deg)}
    .is-complete .row:not(:last-child) .flow-arrow{animation:showLine .18s ease forwards;animation-delay:calc(var(--i)*90ms)}
    @keyframes showLine{to{opacity:1}}
    .side{display:flex;flex-direction:column;gap:16px;min-height:0}
    .panel{padding:22px}.panel.q{padding:18px;background:rgba(36,87,166,.055);border-radius:8px}
    .dependency{display:grid;grid-template-columns:1fr;gap:8px;margin-top:18px}
    .dep{display:flex;align-items:center;gap:12px;font:600 var(--fs-sec)/1.3 var(--font-sans)}
    .dep b{display:grid;place-items:center;width:31px;height:31px;border:2px solid rgba(35,42,50,.35);border-radius:50%;font:700 var(--fs-tick)/1 var(--font-mono)}
    .dep span{flex:1;border:1px solid rgba(35,42,50,.18);background:rgba(255,255,255,.48);border-radius:8px;padding:10px 12px}
    .actions{display:flex;flex-wrap:wrap;gap:10px}.actions .btn{flex:1;min-width:118px}
    #hintBtn{display:none}.has-error #hintBtn{display:inline-flex}
    .fb{min-height:92px;padding:16px 18px;border-radius:8px;font:600 var(--fs-sec)/1.45 var(--font-sans);border-left:4px solid rgba(35,42,50,.28);background:rgba(255,255,255,.24)}
    .fb strong{display:block;font-size:var(--fs-body);margin-bottom:4px}.fb.ok{border-left-color:var(--model)}
    .stamp{display:none;text-align:center;border:3px double var(--model);color:var(--model);padding:15px 10px;transform:rotate(-1.5deg);font:700 var(--fs-h2)/1.25 var(--font-serif)}
    .stamp small{display:block;font:700 var(--fs-label)/1.3 var(--font-mono);margin-top:6px}
    .is-complete .stamp{display:block;animation:stamp .16s ease-out both}
    @keyframes stamp{from{transform:translateY(-8px) rotate(-1.5deg);opacity:0}to{transform:translateY(0) rotate(-1.5deg);opacity:1}}
    .closing{margin-top:auto;padding:16px 18px;background:rgba(231,111,46,.07);border-radius:8px;font:600 var(--fs-lead)/1.4 var(--font-serif)}
    .next{font:500 var(--fs-sec)/1.4 var(--font-sans);padding:14px 18px;border:1px solid rgba(35,42,50,.18);border-radius:8px;background:rgba(255,255,255,.42)}
    @media(prefers-reduced-motion:reduce){.opt{transition:none}.is-complete .row:not(:last-child) .flow-arrow{animation:none;opacity:1}.is-complete .stamp{animation:none}}
  </style>
  <header class="head">
    <div><div class="kicker">PUT LEARNING IN ORDER</div><h1>网络“学一次”，四步缺一不可</h1></div>
    <p class="prompt">重新排列账目，观察：后一步必须拿到前一步产生的结果。</p>
  </header>
  <main class="work min0">
    <section class="quiz ledger k-process min0" id="quiz" aria-labelledby="ledgerTitle">
      <div class="ledger-top"><h2 id="ledgerTitle">一次学习的纵向账页</h2><p class="hint">拖动整行，或聚焦后按 ↑ ↓</p></div>
      <ol id="list" aria-label="待排序的学习步骤"></ol>
    </section>
    <aside class="side min0">
      <section class="panel q"><h2>检查依赖</h2><div class="dependency" aria-hidden="true"><div class="dep"><b>01</b><span>先得到预测</span></div><div class="dep"><b>02</b><span>才能量出好坏</span></div><div class="dep"><b>03</b><span>才能分配影响</span></div><div class="dep"><b>04</b><span>才能更新参数</span></div></div></section>
      <div class="actions"><button class="btn" id="checkBtn" type="button">检查顺序</button><button class="btn" id="hintBtn" type="button">给我第一步</button><button class="btn" id="resetBtn" type="button">重新排列</button></div>
      <div class="fb" id="feedback" role="status" aria-live="polite"><strong>还未检查</strong>先排出你认为合理的先后，再检查依赖是否接得上。</div>
      <div class="stamp" id="stamp">完成一轮<small>预测 → 损失 → 反向 → 更新</small></div>
      <p class="closing">学习不是得到答案，而是用误差决定参数下一步怎样移动。</p>
      <p class="next">下一问：训练损失降下来了，遇到没参与调参的新样本也可靠吗？</p>
    </aside>
  </main>
  <script>
  window.addEventListener('DOMContentLoaded',()=>{
    const DATA={A:{title:'前向预测',take:'输入与当前参数',doit:'依次计算，得到预测',basis:'输入依次经过权重、偏置与激活，得到预测'},B:{title:'计算损失',take:'预测与目标',doit:'把差距压成一个数',basis:'把预测与目标的差距压成一个可比较的数'},C:{title:'反向分配影响',take:'刚算出的损失',doit:'分配各参数的影响',basis:'从损失出发，算出各参数应增大还是减小'},D:{title:'按学习率更新参数',take:'各参数的影响量',doit:'移动参数一小步',basis:'参数新值＝参数旧值－学习率×影响量'}};
    const correct=['A','B','C','D'];
    const makeState=()=>({order:['C','A','D','B'],checked:false,error:false,complete:false,drag:null});
    let state=makeState(), activePointer=null, destroyed=false;
    const list=document.getElementById('list'),quiz=document.getElementById('quiz'),feedback=document.getElementById('feedback'),checkBtn=document.getElementById('checkBtn'),hintBtn=document.getElementById('hintBtn'),resetBtn=document.getElementById('resetBtn');
    const events=new AbortController(), sig={signal:events.signal};
    function firstBreak(order){for(let i=0;i<3;i++)if(order[i]===correct[i]&&order[i+1]!==correct[i+1])return i;return 0}
    function render(){
      quiz.classList.toggle('is-complete',state.complete);quiz.classList.toggle('has-error',state.error);
      list.innerHTML='';
      state.order.forEach((id,i)=>{const row=document.createElement('li');row.className='row'+(state.drag===id?' dragging':'')+(state.error&&i<3&&id===correct[i]&&state.order[i+1]===correct[i+1]?' correct-link':'');row.style.setProperty('--i',i);row.dataset.id=id;
        row.innerHTML=`<span class="slot" aria-hidden="true">${String(i+1).padStart(2,'0')}</span><div class="opt" tabindex="0" role="listitem" aria-label="${DATA[id].title}，当前位置 ${i+1}，共 4 项" aria-posinset="${i+1}" aria-setsize="4"><span class="handle" aria-hidden="true">⠿</span><div><div class="item-title">${DATA[id].title}</div><div class="io"><span><b>拿到</b>${DATA[id].take}</span><span><b>做什么</b>${DATA[id].doit}</span></div><div class="basis">${DATA[id].basis}</div></div></div><div class="moves"><button class="btn up" type="button" ${i===0?'disabled':''} aria-label="上移 ${DATA[id].title}">上移</button><button class="btn down" type="button" ${i===3?'disabled':''} aria-label="下移 ${DATA[id].title}">下移</button></div><span class="flow-arrow" aria-hidden="true"></span>`;list.appendChild(row)});
      if(state.complete) feedback.innerHTML='<strong>顺序正确</strong>新的参数会进入下一轮前向预测。';
      else if(state.error){const n=firstBreak(state.order);const msgs=['预测之后还没有量出好坏，暂时不能分配影响。','有了损失，才能反向算出各参数的影响。','影响量算出后，才可以按学习率更新参数。'];feedback.innerHTML='<strong>这里有一处断裂</strong>'+msgs[n]}
      else feedback.innerHTML='<strong>'+(state.checked?'顺序已改变':'还未检查')+'</strong>先排出你认为合理的先后，再检查依赖是否接得上。';
      feedback.classList.toggle('ok',state.complete);checkBtn.disabled=state.complete;
    }
    function move(id,to,focus=true){const from=state.order.indexOf(id);to=Math.max(0,Math.min(3,to));if(from===to)return;const order=state.order.slice();order.splice(from,1);order.splice(to,0,id);state={...state,order,checked:false,error:false,complete:false,drag:null};render();if(focus)requestAnimationFrame(()=>list.querySelector(`[data-id="${id}"] .opt`).focus())}
    list.addEventListener('click',e=>{const row=e.target.closest('.row');if(!row)return;const i=state.order.indexOf(row.dataset.id);if(e.target.closest('.up'))move(row.dataset.id,i-1);if(e.target.closest('.down'))move(row.dataset.id,i+1)},sig);
    list.addEventListener('keydown',e=>{const opt=e.target.closest('.opt');if(!opt)return;const id=opt.closest('.row').dataset.id,i=state.order.indexOf(id);if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();e.stopPropagation();move(id,i+(e.key==='ArrowUp'?-1:1))}},sig);
    list.addEventListener('pointerdown',e=>{const opt=e.target.closest('.opt');if(!opt||activePointer!==null)return;activePointer=e.pointerId;opt.setPointerCapture(e.pointerId);state={...state,drag:opt.closest('.row').dataset.id};render()},sig);
    list.addEventListener('pointermove',e=>{if(e.pointerId!==activePointer||!state.drag)return;const p=Deck.pt(list,e),rows=[...list.querySelectorAll('.row')];let target=rows.findIndex(r=>p.y<r.offsetTop+r.offsetHeight/2);if(target<0)target=3;move(state.drag,target,false);state={...state,drag:state.order[target]};},sig);
    function endDrag(e){if(e.pointerId!==activePointer)return;activePointer=null;state={...state,drag:null};render()}
    list.addEventListener('pointerup',endDrag,sig);list.addEventListener('pointercancel',endDrag,sig);
    checkBtn.addEventListener('click',()=>{const complete=state.order.every((x,i)=>x===correct[i]);state={...state,checked:true,error:!complete,complete,drag:null};render()},sig);
    hintBtn.addEventListener('click',()=>move('A',0),sig);
    resetBtn.addEventListener('click',()=>{activePointer=null;state=makeState();render();checkBtn.focus();feedback.innerHTML='<strong>已重新排列</strong>已恢复最初的 C、A、D、B 顺序。'},sig);
    function destroy(){if(destroyed)return;destroyed=true;activePointer=null;events.abort()}
    window.addEventListener('pagehide',destroy,{once:true});
    render();Deck.init({index:20,total:22});
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
