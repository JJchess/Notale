<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="01" data-total="22">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;gap:18px}
    .p01-head{height:104px;display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
    .p01-head h1{margin:0;font-size:var(--fs-h1);line-height:1.15;font-weight:760;letter-spacing:.01em}
    .p01-kicker{font-size:var(--fs-label);color:var(--attention);font-weight:700;letter-spacing:.12em;margin-bottom:7px}
    .p01-lead{margin:0 0 5px;max-width:610px;font-size:var(--fs-lead);line-height:1.45;color:color-mix(in srgb,var(--text) 74%,transparent)}
    .p01-main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:center}
    .p01-route{position:relative;height:500px;min-height:0;border-top:1px solid color-mix(in srgb,var(--text) 16%,transparent);border-bottom:1px solid color-mix(in srgb,var(--text) 16%,transparent)}
    .p01-route svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
    .p01-step{position:absolute;top:54px;width:320px;text-align:center}
    .p01-s1{left:62px}.p01-s2{left:584px}.p01-s3{right:62px}
    .p01-index{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:2px solid var(--text);border-radius:50%;font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;background:var(--bg)}
    .p01-step h2{margin:15px 0 5px;font-size:28px;line-height:1.2}
    .p01-step p{margin:0;font-size:var(--fs-sec);line-height:1.4;color:color-mix(in srgb,var(--text) 68%,transparent)}
    .p01-mark{position:absolute;top:270px;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg)}
    .p01-m1{left:164px;border:3px solid var(--text)}
    .p01-m2{left:686px;border:3px solid var(--model)}
    .p01-m3{right:164px;border:3px solid var(--attention)}
    .p01-dot{width:24px;height:24px;border-radius:50%;background:var(--model)}
    .p01-m1 .p01-dot{transform:translate(-25px,19px);background:var(--text)}
    .p01-m2 .p01-dot{transform:translate(20px,-13px)}
    .p01-target{position:absolute;width:38px;height:38px;border:3px dashed var(--attention);border-radius:50%}
    .p01-m3 .p01-dot{background:var(--model);transform:translate(-8px,6px)}
    .p01-caption{position:absolute;top:410px;width:320px;text-align:center;font-size:var(--fs-label);line-height:1.4}
    .p01-c1{left:62px}.p01-c2{left:584px}.p01-c3{right:62px;color:var(--attention);font-weight:700}
    .p01-mini{position:absolute;top:368px;font-size:var(--fs-label);font-weight:700;background:var(--bg);padding:2px 7px}
    .p01-a{left:116px}.p01-b{left:750px;color:var(--attention)}.p01-d{right:112px;color:var(--model)}
    .p01-close{height:128px;display:flex;align-items:center;justify-content:center;text-align:center}
    .p01-close p{margin:0;font-family:var(--font-serif);font-size:28px;line-height:1.45;font-weight:650}
    .p01-close strong{color:var(--attention);font-weight:750}
  </style>

  <header class="p01-head">
    <div>
      <div class="p01-kicker">学习的第一直觉</div>
      <h1>神经网络是怎么“学会”的？</h1>
    </div>
    <p class="p01-lead">不是突然理解，而是在一次次反馈中改变下一次尝试。</p>
  </header>

  <main class="p01-main min0" aria-label="尝试、看结果、修正的连续过程">
    <section class="p01-route k-process" aria-label="学习的连续动作">
      <svg viewBox="0 0 1488 500" aria-hidden="true">
        <defs>
          <marker id="p01-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
            <path d="M1 1 L11 6 L1 11" fill="none" stroke="#2457A6" stroke-width="2"/>
          </marker>
        </defs>
        <path d="M280 329 C390 329 486 329 686 329" fill="none" stroke="#2457A6" stroke-width="5" marker-end="url(#p01-arrow)"/>
        <path d="M802 329 C930 329 1020 329 1208 329" fill="none" stroke="#2457A6" stroke-width="5" marker-end="url(#p01-arrow)"/>
        <path d="M1266 388 C1266 468 230 476 222 392" fill="none" stroke="currentColor" stroke-opacity=".34" stroke-width="3" stroke-dasharray="10 10" marker-end="url(#p01-arrow)"/>
      </svg>

      <div class="p01-step p01-s1"><span class="p01-index">01</span><h2>尝试</h2><p>先给出一个结果</p></div>
      <div class="p01-step p01-s2"><span class="p01-index">02</span><h2>看结果</h2><p>观察它离目标还有多远</p></div>
      <div class="p01-step p01-s3"><span class="p01-index">03</span><h2>修正</h2><p>让下一次更接近目标</p></div>

      <div class="p01-mark p01-m1"><span class="p01-dot"></span></div>
      <div class="p01-mark p01-m2"><span class="p01-target"></span><span class="p01-dot"></span></div>
      <div class="p01-mark p01-m3"><span class="p01-target"></span><span class="p01-dot"></span></div>
      <span class="p01-mini p01-a">这一次</span>
      <span class="p01-mini p01-b">目标</span>
      <span class="p01-mini p01-d">更接近</span>

      <div class="p01-caption p01-c1">第一次不必准确</div>
      <div class="p01-caption p01-c2">目标提供反馈</div>
      <div class="p01-caption p01-c3">然后，再试一次 ↺</div>
    </section>
  </main>

  <footer class="p01-close">
    <p>学习，就是把“尝试 → 看结果 → 修正”<strong>重复很多次</strong>。</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
