<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="03" data-total="22">
<div id="stage">
  <style>
    #stage{gap:18px}
    .p03-head{display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
    .p03-kicker{margin:0 0 7px;color:var(--attention);font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.12em}
    .p03-head h1{margin:0;max-width:1160px;font:700 var(--fs-h1)/1.25 var(--font-sans);color:var(--text)}
    .p03-main{flex:1;display:flex;flex-direction:column;gap:18px;min-height:0}
    .p03-compare{flex:1;display:grid;grid-template-columns:1fr 1fr;position:relative;border-top:2px solid color-mix(in srgb,var(--text) 28%,transparent);border-bottom:2px solid color-mix(in srgb,var(--text) 28%,transparent);min-height:0}
    .p03-compare:after{content:"同一个输入 0.8";position:absolute;left:50%;top:-15px;transform:translateX(-50%);padding:3px 18px;background:var(--bg);color:var(--text);font:700 var(--fs-label)/1 var(--font-sans);white-space:nowrap}
    .case{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px;padding:34px 24px 24px;background:#B9C8DF}
    .case:first-child{border-right:1px dashed color-mix(in srgb,var(--text) 35%,transparent)}
    .case-title{font:700 var(--fs-h2)/1.2 var(--font-sans);margin:0;color:var(--text)}
    .chain{width:100%;display:grid;grid-template-columns:150px 108px 150px 108px 178px;align-items:center;justify-content:center;padding:24px 10px;border-radius:8px;background:#CFDBEC;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--model) 18%,transparent)}
    .readbox{height:104px;border:2px solid color-mix(in srgb,var(--text) 42%,transparent);border-radius:8px;background:color-mix(in srgb,var(--bg) 92%,white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
    .readbox.output{border-color:var(--model)}
    .readbox .lab{font:600 var(--fs-label)/1.2 var(--font-sans);color:color-mix(in srgb,var(--text) 70%,transparent)}
    .readbox .val{font:700 30px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--model)}
    .arrowbox{height:38px;overflow:visible}
    .arrowline{stroke:var(--model);stroke-width:4;fill:none;stroke-linecap:round}
    .arrowhead{fill:var(--model)}
    .revealed .arrowline,.revealed .arrowhead{animation:sweep .28s ease-out both}
    @keyframes sweep{from{stroke-dasharray:90;stroke-dashoffset:90;opacity:.2}to{stroke-dasharray:90;stroke-dashoffset:0;opacity:1}}
    .weight-wrap{display:flex;flex-direction:column;align-items:center;gap:7px}
    .weight-wrap .lab{font:600 var(--fs-label)/1.2 var(--font-sans)}
    .knob.static{width:80px;height:80px;position:relative;border:2px solid var(--text);border-radius:50%;background:var(--bg)}
    .knob.static:before{content:"";position:absolute;left:37px;top:7px;width:4px;height:31px;border-radius:2px;background:var(--attention);transform-origin:2px 33px;transform:rotate(var(--angle))}
    .knob.static:after{content:"×";position:absolute;left:50%;top:50%;transform:translate(-50%,-48%);font:700 24px/1 var(--font-sans);color:var(--text)}
    .weight-num{font:700 var(--fs-body)/1 var(--font-mono);color:var(--attention)}
    .formula{height:26px;margin:0;font:600 var(--fs-body)/1.35 var(--font-mono);color:var(--text);font-variant-numeric:tabular-nums}
    .formula .answer{color:var(--model)}
    .unanswered .formula{visibility:hidden}
    .revealed .case.right .output{animation:emphasize .18s .28s ease-out}
    @keyframes emphasize{50%{transform:scale(1.06)}}
    .quizline{display:flex;align-items:center;justify-content:center;gap:24px;min-height:84px;border-radius:8px;background:#F5DFD2}
    .question{font:700 var(--fs-lead)/1.35 var(--font-sans)}
    .choices{display:flex;gap:10px}
    .choice{min-width:116px;padding:12px 18px;border:2px solid color-mix(in srgb,var(--text) 45%,transparent);border-radius:8px;background:transparent;color:var(--text);font:700 var(--fs-body)/1.2 var(--font-sans);cursor:pointer}
    .choice[aria-checked="true"]{border-color:var(--attention);box-shadow:inset 0 -4px 0 var(--attention)}
    .choice.correct{border-color:var(--model);box-shadow:inset 0 -4px 0 var(--model)}
    .reset{padding:11px 16px}
    .feedback{min-height:31px;margin:0;text-align:center;font:600 var(--fs-sec)/1.4 var(--font-sans);color:var(--text)}
    .feedback.good{color:var(--model)}
    .p03-foot{display:flex;justify-content:space-between;align-items:center;gap:36px;border-top:1px solid color-mix(in srgb,var(--text) 22%,transparent);padding:14px 18px 0;border-radius:8px;background:#E6E1D7}
    .takeaway{margin:0;max-width:900px;font:600 var(--fs-lead)/1.45 var(--font-serif)}
    .next{margin:0;max-width:440px;text-align:right;font:600 var(--fs-sec)/1.4 var(--font-sans);color:color-mix(in srgb,var(--text) 72%,transparent)}
    @media (prefers-reduced-motion:reduce){.revealed .arrowline,.revealed .arrowhead,.revealed .case.right .output{animation:none}}
  </style>
  <header class="p03-head">
    <div><p class="p03-kicker">先猜，再计算</p><h1>同一个输入，乘上不同权重，会变成不同的加权信号</h1></div>
  </header>
  <main class="p03-main min0">
    <section id="experiment" class="p03-compare k-comparison unanswered" aria-label="两个权重的同尺度比较">
      <article class="case left min0">
        <h2 class="case-title">情况 A</h2>
        <div class="chain">
          <div class="readbox panel"><span class="lab">输入</span><span class="val">0.8</span></div>
          <svg class="arrowbox" viewBox="0 0 108 38" aria-hidden="true"><path class="arrowline" d="M8 19H88"/><path class="arrowhead" d="M88 11L102 19 88 27Z"/></svg>
          <div class="weight-wrap"><span class="lab">乘以权重</span><div class="knob static" style="--angle:-38deg" aria-label="固定权重 0.5"></div><span class="weight-num">0.5</span></div>
          <svg class="arrowbox" viewBox="0 0 108 38" aria-hidden="true"><path class="arrowline" d="M8 19H88"/><path class="arrowhead" d="M88 11L102 19 88 27Z"/></svg>
          <div class="readbox panel output"><span class="lab">加权信号</span><span class="val result">？</span></div>
        </div>
        <p class="formula">0.8 × 0.5 = <span class="answer">0.40</span></p>
      </article>
      <article class="case right min0">
        <h2 class="case-title">情况 B</h2>
        <div class="chain">
          <div class="readbox panel"><span class="lab">输入</span><span class="val">0.8</span></div>
          <svg class="arrowbox" viewBox="0 0 108 38" aria-hidden="true"><path class="arrowline" d="M8 19H88"/><path class="arrowhead" d="M88 11L102 19 88 27Z"/></svg>
          <div class="weight-wrap"><span class="lab">乘以权重</span><div class="knob static" style="--angle:38deg" aria-label="固定权重 1.5"></div><span class="weight-num">1.5</span></div>
          <svg class="arrowbox" viewBox="0 0 108 38" aria-hidden="true"><path class="arrowline" d="M8 19H88"/><path class="arrowhead" d="M88 11L102 19 88 27Z"/></svg>
          <div class="readbox panel output"><span class="lab">加权信号</span><span class="val result">？</span></div>
        </div>
        <p class="formula">0.8 × 1.5 = <span class="answer">1.20</span></p>
      </article>
    </section>
    <section class="quizline" aria-labelledby="prompt">
      <span id="prompt" class="question">哪一边送出的加权信号更大？</span>
      <div id="choices" class="choices" role="radiogroup" aria-label="选择加权信号更大的一边；可用左右方向键移动，按回车确认">
        <button class="choice" role="radio" aria-checked="false" data-choice="left" tabindex="0">左边</button>
        <button class="choice" role="radio" aria-checked="false" data-choice="same" tabindex="-1">一样大</button>
        <button class="choice" role="radio" aria-checked="false" data-choice="right" tabindex="-1">右边</button>
      </div>
      <button id="reset" class="btn reset" type="button" hidden>重新猜</button>
    </section>
    <p id="feedback" class="feedback" aria-live="polite">先猜一边，再同时揭晓两次计算。</p>
  </main>
  <footer class="p03-foot">
    <p class="takeaway">权重像输入旁边的倍率旋钮：数值不同，这个输入送出的信号大小也不同。</p>
    <p class="next">如果权重可以连续转动，它究竟怎样控制输入的影响？</p>
  </footer>
  <script>
  document.addEventListener('DOMContentLoaded',function(){
    Deck.init({index:3,total:22});
    const experiment=document.getElementById('experiment');
    const buttons=[...document.querySelectorAll('.choice')];
    const reset=document.getElementById('reset');
    const feedback=document.getElementById('feedback');
    const results=[...document.querySelectorAll('.result')];
    const events=new AbortController();
    const initialState=()=>({choice:null,revealed:false,focusIndex:0});
    let state=initialState(),destroyed=false;
    const values=[Lec.P.weightedSum([0.8],[0.5],0),Lec.P.weightedSum([0.8],[1.5],0)];
    function render(){
      experiment.classList.toggle('unanswered',!state.revealed);
      experiment.classList.toggle('revealed',state.revealed);
      results.forEach((el,i)=>el.textContent=state.revealed?Number(values[i]).toFixed(2):'？');
      buttons.forEach((b,i)=>{const chosen=b.dataset.choice===state.choice;b.setAttribute('aria-checked',String(chosen));b.tabIndex=i===state.focusIndex?0:-1;b.classList.toggle('correct',state.revealed&&chosen&&state.choice==='right');});
      reset.hidden=!state.revealed;
      feedback.className='feedback'+(state.choice==='right'?' good':'');
      feedback.textContent=!state.revealed?'先猜一边，再同时揭晓两次计算。':state.choice==='right'?'对。输入相同，1.5 倍得到的信号比 0.5 倍更大。':'再看唯一变化的量：两边输入都是 0.8，权重分别是 0.5 和 1.5。';
    }
    function choose(index){state={choice:buttons[index].dataset.choice,revealed:true,focusIndex:index};render();}
    buttons.forEach((button,index)=>{
      button.addEventListener('click',()=>choose(index),{signal:events.signal});
      button.addEventListener('keydown',e=>{let next=index;if(e.key==='ArrowRight'||e.key==='ArrowDown')next=(index+1)%buttons.length;else if(e.key==='ArrowLeft'||e.key==='ArrowUp')next=(index+buttons.length-1)%buttons.length;else if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();choose(index);return}else return;e.preventDefault();e.stopPropagation();state={...state,focusIndex:next};render();buttons[next].focus();},{signal:events.signal});
    });
    reset.addEventListener('click',()=>{state=initialState();render();buttons[0].focus();feedback.textContent='已重置。先猜一边，再同时揭晓两次计算。';},{signal:events.signal});
    function destroy(){if(destroyed)return;destroyed=true;events.abort();}
    window.addEventListener('pagehide',destroy,{once:true});
    render();
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
