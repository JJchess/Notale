<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>转动权重，就在改变这个输入的影响</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
.kicker{font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.13em;color:var(--model);margin-bottom:9px}
h1{font-size:var(--fs-h1);line-height:1.2;margin:0;font-weight:750}
.instruction{font-size:var(--fs-label);line-height:1.45;margin:0 0 3px;max-width:470px;text-align:right;color:color-mix(in srgb,var(--text) 72%,transparent)}
.main{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.flow{flex:1;min-height:0;display:grid;grid-template-columns:240px 78px 360px 96px 300px;align-items:center;justify-content:center;position:relative;padding:34px 32px 24px;border:2px solid color-mix(in srgb,var(--text) 28%,transparent);border-radius:8px;background:linear-gradient(90deg,transparent 0 18%,color-mix(in srgb,var(--text) 5%,transparent) 18% 18.15%,transparent 18.15% 47%,color-mix(in srgb,var(--text) 5%,transparent) 47% 47.15%,transparent 47.15% 78%,color-mix(in srgb,var(--text) 5%,transparent) 78% 78.15%,transparent 78.15%)}
.node{position:relative;z-index:2}.node .panel{min-height:150px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}
.node-label{font-size:var(--fs-label);font-weight:700}.readout{font:750 48px/1 var(--font-mono);color:var(--model);font-variant-numeric:tabular-nums}.sub{font-size:var(--fs-sec)}
.op{font:500 54px/1 var(--font-serif);text-align:center}.arrow{height:3px;background:var(--model);position:relative;margin:0 16px}.arrow:after{content:"";position:absolute;right:-1px;top:-7px;border-left:13px solid var(--model);border-top:8px solid transparent;border-bottom:8px solid transparent}.arrow.reverse:after{right:auto;left:-1px;border-left:0;border-right:13px solid var(--model)}.arrow.zero{background:repeating-linear-gradient(90deg,var(--model) 0 8px,transparent 8px 13px)}
.weight{display:flex;flex-direction:column;align-items:center;gap:10px}.weight .knob{width:142px;height:142px;position:relative;display:grid;place-items:center}.dial{width:108px;height:108px;border:2px solid var(--attention);border-radius:50%;background:var(--bg);position:relative;box-shadow:inset 0 0 0 8px color-mix(in srgb,var(--attention) 10%,transparent)}.needle{position:absolute;width:4px;height:40px;background:var(--attention);border-radius:2px;left:50%;top:10px;transform-origin:2px 44px}.hub{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--attention);left:calc(50% - 7px);top:calc(50% - 7px)}.wval{font:750 28px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.control-row{width:100%;display:flex;align-items:center;gap:12px}.control-row span{font:var(--fs-tick)/1 var(--font-mono)}input[type=range]{flex:1;accent-color:var(--attention)}
.formula{font:700 25px/1.3 var(--font-mono);padding:13px 20px;background:color-mix(in srgb,var(--model) 8%,transparent);border:2px solid color-mix(in srgb,var(--model) 24%,transparent);border-radius:8px;color:var(--model);font-variant-numeric:tabular-nums}
.scale-wrap{display:grid;grid-template-columns:205px 1fr 205px;align-items:center;gap:18px}.scale-label{font-size:var(--fs-label);line-height:1.35}.scale-label:last-child{text-align:right}.scale{height:96px;position:relative;border:2px solid color-mix(in srgb,var(--text) 24%,transparent);border-radius:8px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--text) 5%,transparent) 0 7px,transparent 7px 15px)}.scale:before,.scale:after{position:absolute;top:10px;font:700 var(--fs-label)/1 var(--font-sans);color:color-mix(in srgb,var(--text) 56%,transparent)}.scale:before{content:'← 反方向';left:18px}.scale:after{content:'同方向 →';right:18px}.axis{position:absolute;left:0;right:0;top:48px;height:3px;background:color-mix(in srgb,var(--text) 55%,transparent)}.axis:before,.axis:after{content:"";position:absolute;top:-5px;width:2px;height:12px;background:var(--text)}.axis:before{left:0}.axis:after{right:0}.zero-tick{position:absolute;left:50%;top:37px;height:24px;border-left:2px solid var(--text)}.marker{position:absolute;top:36px;width:24px;height:24px;border:3px solid var(--attention);background:var(--bg);transform:translateX(-50%) rotate(45deg);transition:left .08s linear}.scale-caption{position:absolute;top:68px;transform:translateX(-50%);font:var(--fs-tick)/1 var(--font-mono)}
.footer{display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px}.takeaway{font:600 var(--fs-lead)/1.45 var(--font-serif);margin:0}.next{font-size:var(--fs-sec);margin-top:5px}.btn{white-space:nowrap}
@media(prefers-reduced-motion:reduce){.marker{transition:none}}
</style>
</head>
<body data-page="04" data-total="22">
<div id="stage">
  <header class="head">
    <div><div class="kicker">WEIGHT · 权重</div><h1>转动权重，就在改变这个输入的影响</h1></div>
    <p class="instruction" id="help">拖动旋钮下方的滑杆：只改变权重，观察加权信号。方向键每次 0.05，PageUp / PageDown 每次 0.10。</p>
  </header>
  <main class="main canvas-full k-process min0">
    <section class="flow" aria-label="输入乘以权重得到加权信号的计算流水线">
      <div class="node"><div class="panel"><span class="node-label">输入 · 固定</span><strong class="readout">0.80</strong><span class="sub">其余条件不变</span></div></div>
      <div class="op" aria-hidden="true">×</div>
      <div class="weight">
        <span class="node-label">权重 w · 可调</span>
        <div class="knob" aria-hidden="true"><div class="dial"><span class="needle" id="needle"></span><span class="hub"></span></div></div>
        <output class="wval" id="wval" for="weight">0.50</output>
        <div class="control-row"><span>−1.00</span><input id="weight" type="range" min="-1" max="1" step="0.05" value="0.5" aria-describedby="help status"><span>1.00</span></div>
      </div>
      <div class="arrow" id="flowArrow" aria-hidden="true"></div>
      <div class="node"><div class="panel"><span class="node-label">加权信号</span><output class="readout" id="result">0.40</output><span class="sub" id="direction" aria-live="polite">同方向影响</span></div></div>
    </section>
    <div class="formula" id="formula">0.80 × 0.50 = 0.40</div>
    <section class="scale-wrap" aria-label="以零为中心的影响方向尺">
      <div class="scale-label"><strong>反方向影响</strong><br>权重 &lt; 0</div>
      <div class="scale"><div class="axis"></div><div class="zero-tick"></div><div class="marker" id="marker"></div><span class="scale-caption" id="scaleCaption">w = 0.50</span></div>
      <div class="scale-label"><strong>同方向影响</strong><br>权重 &gt; 0</div>
    </section>
  </main>
  <footer class="footer">
    <div><p class="takeaway">权重的大小决定影响有多强，正负决定影响朝哪个方向。</p><div class="next">如果不改变输入，怎样让整体结果再挪一点？</div></div>
    <button class="btn" id="reset" type="button">复位到 0.50</button>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  Deck.init({index:4,total:22});
  const INPUT = Number(Lec.K?.p04?.input ?? 0.8);
  const INITIAL = Number(Lec.K?.p04?.weight ?? 0.5);
  const range=document.getElementById('weight'), reset=document.getElementById('reset');
  const els={needle:document.getElementById('needle'),w:document.getElementById('wval'),result:document.getElementById('result'),direction:document.getElementById('direction'),formula:document.getElementById('formula'),marker:document.getElementById('marker'),caption:document.getElementById('scaleCaption'),arrow:document.getElementById('flowArrow')};
  const initialState=()=>({weight:INITIAL, changed:false}); let state=initialState();
  const clean=new AbortController();
  const tidy=n=>Math.abs(n)<1e-9?0:n;
  const fmt=n=>tidy(n).toFixed(2).replace('-', '−');
  function transition(s,a){if(a.type==='set')return {weight:Math.max(-1,Math.min(1,Math.round(a.value*20)/20)),changed:true};if(a.type==='reset')return initialState();return s}
  function render(s){
    const value=tidy(Lec.P.weightedSum([INPUT],[s.weight],0)); const sign=s.weight>0?'同方向影响':s.weight<0?'反方向影响':'暂不影响';
    range.value=String(s.weight); els.w.value=fmt(s.weight); els.result.value=fmt(value); els.direction.textContent=sign;
    els.formula.textContent=`${fmt(INPUT)} × ${fmt(s.weight)} = ${fmt(value)}`;
    els.needle.style.transform=`rotate(${s.weight*135}deg)`; const p=(s.weight+1)*50; els.marker.style.left=p+'%';els.caption.style.left=p+'%';els.caption.textContent=`w = ${fmt(s.weight)}`;
    els.arrow.className='arrow'+(s.weight<0?' reverse':s.weight===0?' zero':'');
  }
  const dispatch=a=>{state=transition(state,a);render(state)};
  range.addEventListener('input',()=>dispatch({type:'set',value:Number(range.value)}),{signal:clean.signal});
  range.addEventListener('keydown',e=>{if(e.key==='PageUp'||e.key==='PageDown'){e.preventDefault();e.stopPropagation();dispatch({type:'set',value:state.weight+(e.key==='PageUp'?.10:-.10)})}},{signal:clean.signal});
  reset.addEventListener('click',()=>{dispatch({type:'reset'});range.focus()},{signal:clean.signal});
  let dead=false;function destroy(){if(dead)return;dead=true;clean.abort()} window.addEventListener('pagehide',destroy,{once:true});
  render(state);
})();
</script>
</body>
</html>
