<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:20px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:48px}
h1{margin:0;font-size:var(--fs-h1);line-height:1.15}.lead{margin:8px 0 0;max-width:900px}
.input-note{display:flex;align-items:center;gap:14px;padding:12px 18px;border:1px solid color-mix(in srgb,var(--text) 30%,transparent);border-radius:8px;font-size:var(--fs-label);white-space:nowrap}.input-note strong{font:700 27px var(--font-mono);color:var(--model)}
.rule-set{border:0;padding:0;margin:0}.rule-set legend{font-size:var(--fs-label);font-weight:700;margin-bottom:10px}.rules{display:flex;gap:12px}.rule{position:relative}.rule input{position:absolute;opacity:0;pointer-events:none}.rule label{display:block;border:2px solid color-mix(in srgb,var(--text) 38%,transparent);border-radius:8px;padding:11px 22px;font-size:var(--fs-body);font-weight:700;background:color-mix(in srgb,var(--bg) 90%,white);cursor:pointer}.rule input:checked+label{border-color:var(--attention);box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--attention) 25%,transparent)}.rule input:focus-visible+label{outline:3px solid var(--focus);outline-offset:3px}
.main{flex:1;display:flex;flex-direction:column;gap:16px;min-height:0}.triptych{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:stretch}.act{position:relative;display:flex;flex-direction:column;padding:22px;border:2px solid color-mix(in srgb,var(--text) 28%,transparent);border-radius:8px;background:color-mix(in srgb,var(--bg) 92%,white);transition:border-color .15s,transform .15s}.act.active{border-color:var(--attention);transform:translateY(-3px)}.act.active:before{content:'正在观察';position:absolute;right:16px;top:15px;padding:5px 9px;border-radius:999px;background:var(--attention);color:white;font-size:var(--fs-label);font-weight:700}.act h2{margin:0;font-size:var(--fs-h2)}.desc{min-height:52px;margin:8px 0 10px;font-size:var(--fs-sec);line-height:1.45}.plot{flex:1;min-height:220px;width:100%;overflow:visible}.axis{fill:none;stroke:color-mix(in srgb,var(--text) 38%,transparent);stroke-width:2}.curve{fill:none;stroke:var(--text);stroke-width:4}.guide{fill:none;stroke:var(--attention);stroke-width:2;stroke-dasharray:7 7}.dot{fill:var(--model);stroke:var(--bg);stroke-width:5}.out{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid color-mix(in srgb,var(--text) 25%,transparent);padding-top:13px;font-size:var(--fs-label)}.out strong{font:700 29px var(--font-mono);color:var(--model)}
.summary{display:grid;grid-template-columns:1.35fr 1fr auto;align-items:center;gap:24px;padding:20px 20px;border-left:5px solid var(--model);background:color-mix(in srgb,var(--model) 7%,var(--bg));border-radius:0 8px 8px 0}.summary p{margin:0;font-size:var(--fs-body);line-height:1.4}.summary .choice{font-family:var(--font-serif);font-weight:700}.btn{white-space:nowrap}@media(prefers-reduced-motion:reduce){.act{transition:none}}
</style>
</head>
<body data-page="06" data-total="22">
<div id="stage">
<header>
 <div><h1>激活规则，决定神经元的出口</h1><p class="lead">同一个加权总和，可以被不同规则变成不同输出。切换规则，比较三种出口。</p></div>
 <div class="input-note" aria-label="固定输入，加权总和 z 等于 0.2"><span>固定加权总和</span><strong>z = 0.2</strong></div>
</header>
<fieldset class="rule-set"><legend>切换激活规则（方向键也可选择）</legend><div class="rules">
 <div class="rule"><input type="radio" name="rule" id="linear" value="linear" checked><label for="linear">直通</label></div>
 <div class="rule"><input type="radio" name="rule" id="step" value="step"><label for="step">阶跃</label></div>
 <div class="rule"><input type="radio" name="rule" id="sigmoid" value="sigmoid"><label for="sigmoid">sigmoid</label></div>
</div></fieldset>
<main class="main min0">
 <section class="triptych k-classification" aria-label="三种激活规则的同尺度比较">
  <article class="act active" data-rule="linear"><h2>直通</h2><p class="desc">输入是多少，输出就是多少。</p><svg class="plot" viewBox="0 0 400 230" role="img" aria-label="直通函数曲线，z 等于 0.2 时输出 0.2"><path class="axis" d="M38 196H380M76 215V18"/><path class="curve" d="M76 196L360 34"/><path class="guide" d="M218 215V115H38"/><circle class="dot" cx="218" cy="115" r="9"/></svg><div class="out"><span>当前输出</span><strong data-output="linear">—</strong></div></article>
  <article class="act" data-rule="step"><h2>阶跃</h2><p class="desc">只要超过门槛 0，输出就跳到 1。</p><svg class="plot" viewBox="0 0 400 230" role="img" aria-label="阶跃函数曲线，z 等于 0.2 时输出 1"><path class="axis" d="M38 196H380M76 215V18"/><path class="curve" d="M38 196H204V42H380"/><path class="guide" d="M218 215V42H38"/><circle class="dot" cx="218" cy="42" r="9"/></svg><div class="out"><span>当前输出</span><strong data-output="step">—</strong></div></article>
  <article class="act" data-rule="sigmoid"><h2>sigmoid</h2><p class="desc">把任意加权总和平滑压到 0–1。</p><svg class="plot" viewBox="0 0 400 230" role="img" aria-label="sigmoid 函数曲线，z 等于 0.2 时输出约 0.5498"><path class="axis" d="M38 196H380M76 215V18"/><path class="curve" d="M38 188C96 186 125 172 160 139C199 102 224 84 266 64C309 43 345 38 380 37"/><path class="guide" d="M218 215V97H38"/><circle class="dot" cx="218" cy="97" r="9"/></svg><div class="out"><span>当前输出</span><strong data-output="sigmoid">—</strong></div></article>
 </section>
 <section class="summary"><p id="feedback" aria-live="polite">直通保留原值：0.2 仍然是 0.2。</p><p class="choice">本课后续采用 sigmoid：输出稳定落在 0–1。</p><button class="btn" id="reset" type="button">重置为直通</button></section>
</main>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script>
<script>
(()=>{
 const Z=.2;
 const outputs={linear:Lec.P.activation('linear',Z),step:Z>=0?1:0,sigmoid:Lec.P.activation('sigmoid',Z)};
 const names={linear:'直通',step:'阶跃',sigmoid:'sigmoid'};
 const messages={linear:'直通保留原值：0.2 仍然是 0.2。',step:'阶跃跨过门槛：0.2 被改写成 1。',sigmoid:'sigmoid 平滑压缩：0.2 变成约 0.5498。'};
 const controls=[...document.querySelectorAll('input[name=rule]')], cards=[...document.querySelectorAll('.act')], feedback=document.getElementById('feedback'), reset=document.getElementById('reset');
 const initialState=()=>({rule:'linear'}); let state=initialState();
 function transition(s,a){if(a.type==='choose'&&outputs[a.rule]!==undefined)return {rule:a.rule};if(a.type==='reset')return initialState();return s}
 function render(){controls.forEach(c=>c.checked=c.value===state.rule);cards.forEach(c=>{const active=c.dataset.rule===state.rule;c.classList.toggle('active',active);c.setAttribute('aria-current',active?'true':'false')});document.querySelector('[data-output=linear]').textContent=outputs.linear.toFixed(1);document.querySelector('[data-output=step]').textContent=outputs.step.toFixed(0);document.querySelector('[data-output=sigmoid]').textContent='≈ '+outputs.sigmoid.toFixed(4);feedback.textContent=messages[state.rule]}
 function dispatch(a){const next=transition(state,a);if(next===state)return;state=next;render()}
 const events=new AbortController();controls.forEach(c=>c.addEventListener('change',()=>dispatch({type:'choose',rule:c.value}),{signal:events.signal}));reset.addEventListener('click',()=>{dispatch({type:'reset'});controls[0].focus();feedback.textContent='已重置。直通保留原值：0.2 仍然是 0.2。'},{signal:events.signal});
 let destroyed=false;function destroy(){if(destroyed)return;destroyed=true;events.abort()}window.addEventListener('pagehide',destroy,{once:true});
 render();Deck.init({index:6,total:22});
})();
</script>
</body></html>
