<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
h1{margin:0;font-size:var(--fs-h1);line-height:1.2}
.lead{margin:8px 0 0;max-width:960px}
.rule{font-family:var(--font-mono);font-size:var(--fs-label);padding:10px 14px;border-left:3px solid var(--model);white-space:nowrap}
.main{flex:1;display:flex;gap:28px;min-height:0}
.figure-panel{flex:1;min-width:0;display:flex;flex-direction:column;padding:20px 22px 16px;background:rgba(255,255,255,.32);border:1px solid rgba(35,43,52,.2);border-radius:8px}
.figure-head{display:flex;align-items:center;justify-content:space-between;gap:18px}
.figure-head h2,.side h2{margin:0;font-size:var(--fs-h2)}
.legend{display:flex;gap:18px;align-items:center}.legend span{display:flex;align-items:center;gap:7px;font-size:var(--fs-label)}
.key{width:24px;height:0;border-top:3px solid var(--model)}.key.dot{width:10px;height:10px;border:2px solid var(--attention);border-radius:50%;background:var(--bg)}
#chart{flex:1;min-height:360px;margin-top:5px}
.scan{display:grid;grid-template-columns:95px 1fr 90px;align-items:center;gap:14px;padding:8px 38px 0 58px}
.scan label{font-size:var(--fs-label);font-weight:700}.scan output{font-family:var(--font-mono);font-size:var(--fs-body);color:var(--attention);text-align:right}
input[type=range]{width:100%}
figcaption{margin-top:10px;font-size:var(--fs-label);line-height:1.4;color:rgba(25,31,38,.78)}
.side{width:390px;display:flex;flex-direction:column;gap:16px;min-width:0}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.readout{padding:14px;background:rgba(255,255,255,.42);border-radius:8px;border:1px solid rgba(35,43,52,.18)}
.readout.wide{grid-column:1/-1;border:2px solid var(--attention)}
.readout .lab{font-size:var(--fs-label);display:block;margin-bottom:5px}.readout strong{font-family:var(--font-mono);font-size:28px;color:var(--model)}.readout.wide strong{color:var(--attention)}
.hint{margin:0}.btn{align-self:flex-start}
.trail{flex:1;min-height:0;padding-top:14px;border-top:1px solid rgba(35,43,52,.25)}
.trail-head{display:flex;align-items:baseline;justify-content:space-between}.trail-head span{font-size:var(--fs-label)}
#trailList{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;max-height:168px;overflow:hidden;font-family:var(--font-mono);font-size:var(--fs-label)}
#trailList li{display:flex;justify-content:space-between;border-bottom:1px dotted rgba(35,43,52,.25);padding:3px 0}
.conclusion{margin:0;padding:14px 16px;border-left:4px solid var(--model);font-family:var(--font-serif);font-size:var(--fs-lead);line-height:1.4}
</style>
</head>
<body data-page="09" data-total="22">
<div id="stage">
  <header>
    <div><h1>扫描误差曲线</h1><p class="lead">固定输入、偏置和目标，只转动一个权重旋钮：每个位置都会产生一个预测和一个损失。</p></div>
    <div class="rule">x = 0.8　b = −0.2　目标 = 1<br>sigmoid　·　半平方损失</div>
  </header>
  <main class="main min0">
    <figure class="figure-panel min0" aria-labelledby="figtitle">
      <div class="figure-head"><h2 id="figtitle">权重 w 改变时，损失怎样变化？</h2><div class="legend" aria-label="图例"><span><i class="key"></i>损失曲线</span><span><i class="key dot"></i>当前测点</span></div></div>
      <div id="chart" role="img" aria-label="权重从负二到四时的半平方损失曲线"></div>
      <div class="scan"><label for="weight">扫描权重 w</label><input id="weight" type="range" min="-2" max="4" step="0.05" value="0.5" aria-describedby="hint"><output id="wOut" for="weight">0.50</output></div>
      <figcaption>横轴是权重 w，纵轴是当前样本的半平方损失。曲线由现场计算的等距扫描点连接；橙色圆点是当前读数。</figcaption>
    </figure>
    <aside class="side min0" aria-label="扫描读数与测点记录">
      <h2>当前测量</h2>
      <div class="readouts" aria-live="polite">
        <div class="readout"><span class="lab">加权和 z</span><strong id="zVal">—</strong></div>
        <div class="readout"><span class="lab">预测 ŷ</span><strong id="predVal">—</strong></div>
        <div class="readout wide"><span class="lab">半平方损失 L</span><strong id="lossVal">—</strong></div>
      </div>
      <p class="hint" id="hint">拖动滑块，比较曲线上不同位置的损失。这里只观察，不更新权重。</p>
      <button class="btn" id="reset" type="button">复位到 w = 0.50</button>
      <section class="trail"><div class="trail-head"><h2>测点记录</h2><span id="count">1 / 24</span></div><ol id="trailList" aria-label="最近测点"></ol></section>
      <p class="conclusion">同一个样本上，权重不同，预测误差也不同；误差曲线把“往哪边转更小”变成可比较的形状。</p>
    </aside>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:9,total:22});
  var C=Object.freeze({x:0.8,b:-0.2,target:1,min:-2,max:4,initial:0.5});
  function calc(w){
    var z=Lec.P.weightedSum([C.x],[w],C.b);
    var y=Lec.P.activation('sigmoid',z);
    /* 本页指定半平方损失；前向值由 Lec.P 现场计算。 */
    var error=y-C.target;
    var loss=0.5*error*error;
    return Object.freeze({w:w,z:z,y:y,loss:loss});
  }
  var curve=[]; for(var i=0;i<=120;i++) curve.push(calc(C.min+i*0.05));
  Object.freeze(curve);
  var state={w:C.initial,points:[calc(C.initial)]};
  var el=document.getElementById('chart');
  var chart=echarts.init(el,null,{renderer:'svg'});
  var range=document.getElementById('weight'), list=document.getElementById('trailList');
  function render(){
    var cur=calc(state.w);
    document.getElementById('wOut').textContent=cur.w.toFixed(2);
    document.getElementById('zVal').textContent=cur.z.toFixed(3);
    document.getElementById('predVal').textContent=cur.y.toFixed(3);
    document.getElementById('lossVal').textContent=cur.loss.toFixed(4);
    document.getElementById('count').textContent=state.points.length+' / 24';
    list.innerHTML=state.points.slice(-12).reverse().map(function(p){return '<li><span>w '+p.w.toFixed(2)+'</span><span>L '+p.loss.toFixed(4)+'</span></li>';}).join('');
    chart.setOption({
      animation:false,textStyle:{fontSize:16,fontFamily:'sans-serif'},
      grid:{left:70,right:28,top:28,bottom:62,containLabel:true},
      tooltip:{trigger:'axis',confine:true,textStyle:{fontSize:16},formatter:function(ps){var w=Number(ps[0].axisValue);var p=calc(w);return 'w = '+w.toFixed(2)+'<br>预测 = '+p.y.toFixed(3)+'<br>损失 = '+p.loss.toFixed(4);}},
      xAxis:{type:'value',min:C.min,max:C.max,interval:1,name:'权重 w',nameLocation:'middle',nameGap:38,nameTextStyle:{fontSize:15,fontWeight:700},axisLabel:{fontSize:13},axisLine:{lineStyle:{color:'#343B43'}},splitLine:{show:false}},
      yAxis:{type:'value',min:0,max:0.45,interval:0.1,name:'半平方损失 L',nameTextStyle:{fontSize:15,fontWeight:700},axisLabel:{fontSize:13,formatter:function(v){return v.toFixed(1);}},axisLine:{show:true,lineStyle:{color:'#343B43'}},splitLine:{lineStyle:{color:'rgba(52,59,67,.16)',type:'dashed'}}},
      series:[
        {id:'curve',name:'损失曲线',type:'line',showSymbol:false,silent:true,data:curve.map(function(p){return [p.w,p.loss];}),lineStyle:{width:4,color:'#2457A6'}},
        {id:'history',name:'测点',type:'scatter',silent:true,symbolSize:8,data:state.points.map(function(p){return [p.w,p.loss];}),itemStyle:{color:'rgba(231,111,46,.35)'}},
        {id:'current',name:'当前测点',type:'scatter',symbolSize:18,data:[[cur.w,cur.loss]],itemStyle:{color:'#F4F1E8',borderColor:'#E76F2E',borderWidth:4},markLine:{silent:true,symbol:'none',label:{show:false},lineStyle:{color:'#E76F2E',width:2,type:'dashed'},data:[{xAxis:cur.w}]}}
      ]
    },{notMerge:true});
  }
  function setState(patch,record){
    var w=Math.max(C.min,Math.min(C.max,Number(patch.w)));
    var pts=state.points.slice();
    if(record && (!pts.length || Math.abs(pts[pts.length-1].w-w)>0.0001)){pts.push(calc(w));if(pts.length>24)pts.shift();}
    state={w:w,points:pts}; range.value=String(w); render();
  }
  range.addEventListener('input',function(){setState({w:this.value},true);});
  document.getElementById('reset').addEventListener('click',function(){state={w:C.initial,points:[calc(C.initial)]};range.value=String(C.initial);render();});
  var ro=new ResizeObserver(function(){chart.resize();});ro.observe(el);
  window.addEventListener('beforeunload',function cleanup(){ro.disconnect();chart.dispose();},{once:true});
  render();
})();
</script>
</body>
</html>
