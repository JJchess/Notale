<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;border-bottom:1px solid rgba(32,43,56,.22);padding-bottom:14px}
.kicker{font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.12em;color:var(--attention);margin-bottom:8px}
h1{font:700 var(--fs-h1)/1.2 var(--font-sans);margin:0;max-width:1040px}
.fixed{font:var(--fs-sec)/1.5 var(--font-sans);color:rgba(32,43,56,.72);text-align:right}.fixed b{color:var(--text);font-weight:650}
.lab{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px}
.prompt{font:var(--fs-body)/1.4 var(--font-sans);margin:0}.prompt strong{color:var(--attention)}
.btns{display:flex;gap:10px;align-items:center}.btn{min-height:46px;padding:8px 18px}.btn[aria-pressed="true"]{background:var(--attention);border-color:var(--attention);color:white}.reset{margin-left:8px;background:transparent}
.stage-cards{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;position:relative;min-height:0}
.probe{position:relative;display:flex;flex-direction:column;gap:14px;padding:20px 22px 18px;border:2px solid rgba(32,43,56,.22);border-radius:8px;background-color:rgba(36,87,166,.075);background-image:linear-gradient(rgba(36,87,166,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(36,87,166,.10) 1px,transparent 1px);background-size:24px 24px;min-width:0;transition:border-color 180ms,background 180ms}
.probe.active{border-color:var(--attention);background:rgba(231,111,46,.11)}
.probe h2{font:700 var(--fs-h2)/1.2 var(--font-sans);margin:0;display:flex;justify-content:space-between;align-items:center}.probe h2 span{font:600 var(--fs-label)/1 var(--font-mono);color:rgba(32,43,56,.58)}
.knob-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:2px 8px}
.knob{width:118px;height:118px;border:2px solid var(--model);border-radius:50%;position:relative;display:grid;place-items:center;background:var(--bg);transition:transform 180ms ease}.active .knob{border-color:var(--attention)}
.knob:before{content:"";position:absolute;width:3px;height:40px;background:var(--model);top:9px;left:56px;border-radius:2px}.active .knob:before{background:var(--attention)}
.knob strong{font:700 22px/1 var(--font-mono)}
.weight-copy{font:var(--fs-sec)/1.45 var(--font-sans);max-width:190px}.weight-copy b{display:block;font:700 var(--fs-body)/1.3 var(--font-sans);margin-bottom:4px}
.causal{height:46px;width:100%;overflow:visible}.causal path{fill:none;stroke:rgba(32,43,56,.38);stroke-width:2}.active .causal path{stroke:var(--attention)}
.readouts{display:grid;grid-template-columns:.82fr 1.18fr;gap:12px}.panel{padding:13px 14px;min-width:0}.readouts label{display:block;font:var(--fs-label)/1.2 var(--font-sans);color:rgba(32,43,56,.66);margin-bottom:7px}.value{font:700 25px/1.1 var(--font-mono);color:var(--model)}.active .value.loss{color:var(--attention)}
.track{height:32px;background:rgba(32,43,56,.1);border-radius:7px;margin-top:14px;overflow:hidden}.bar{height:100%;background:var(--model);border-radius:7px;transition:width 220ms ease}.active .bar{background:var(--attention)}
.scale{display:flex;justify-content:space-between;font:var(--fs-tick)/1.2 var(--font-mono);color:rgba(32,43,56,.58);margin-top:5px}
.delta{margin-top:8px;border-top:1px solid rgba(32,43,56,.18);padding-top:12px;font:650 var(--fs-sec)/1.35 var(--font-sans)}.delta strong{font-family:var(--font-mono);color:var(--model)}.active .delta strong{color:var(--attention)}
.conclusion{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:15px 20px;border-top:2px solid var(--text);border-bottom:1px solid rgba(32,43,56,.24)}
.compare{font:var(--fs-sec)/1.4 var(--font-sans)}.compare:last-child{text-align:right}.compare b{font:700 var(--fs-body)/1.3 var(--font-mono);color:var(--attention)}
.verdict{text-align:center}.verdict .tag{margin-bottom:6px}.verdict strong{display:block;font:700 var(--fs-lead)/1.3 var(--font-serif)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:30px}.takeaway{font:700 var(--fs-lead)/1.4 var(--font-serif);margin:0}.next{font:var(--fs-sec)/1.4 var(--font-sans);color:rgba(32,43,56,.72);text-align:right;max-width:520px}
@media(prefers-reduced-motion:reduce){.probe,.knob,.bar{transition:none}}
</style>
</head>
<body data-page="13" data-total="22">
<div id="stage">
  <header class="head">
    <div><div class="kicker">LOCAL PROBE　局部探测</div><h1>轻推一个参数，最终损失会告诉我们该往哪边调</h1></div>
    <div class="fixed">三次实验保持相同条件<br><b>x = 0.8　b = −0.2　目标 = 1　sigmoid</b></div>
  </header>
  <main class="lab min0" aria-labelledby="instruction">
    <div class="toolbar">
      <p class="prompt" id="instruction"><strong>选择一个位置</strong>，比较同一尺度上的最终损失。聚焦按钮后也可按 ← →。</p>
      <div class="btns" role="group" aria-label="权重局部探测">
        <button class="btn" data-i="0">向下轻推 −0.1</button><button class="btn" data-i="1">回到 0.5</button><button class="btn" data-i="2">向上轻推 +0.1</button><button class="btn reset" id="reset">复位</button>
      </div>
    </div>
    <section class="stage-cards k-process" aria-label="三个权重位置的同尺度比较"></section>
    <section class="conclusion" aria-live="polite">
      <div class="compare" id="downCompare">向下：损失 <b>+0.0092</b></div>
      <div class="verdict"><span class="tag">这一点附近：增大 w</span><strong id="interpretation">当前位置是比较基准；向两边轻推再观察。</strong></div>
      <div class="compare" id="upCompare">向上：损失 <b>−0.0086</b></div>
    </section>
  </main>
  <footer class="foot"><p class="takeaway">在当前位置，权重增大让损失下降，所以这个权重应该增大。</p><div class="next">参数很多时，怎样不逐个试探，也能一次找到各自的方向？</div></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(()=>{
  Deck.init({index:13,total:22});
  const events=new AbortController(), signal=events.signal;
  const W=[0.4,0.5,0.6], names=['向下轻推','当前位置','向上轻推'];
  const conditions=Object.freeze({input:0.8,bias:-0.2,target:1,activation:'sigmoid'});
  const initialState=()=>({index:1}); let state=initialState();
  const cards=document.querySelector('.stage-cards'), buttons=[...document.querySelectorAll('[data-i]')], status=document.getElementById('interpretation');
  const compute=w=>{const result=Lec.P.neuronForward([conditions.input],[w],conditions.bias,conditions.activation);const p=Number(result.output ?? result.value ?? result);const loss=.5*(p-conditions.target)**2;return {p,loss}};
  const values=W.map(compute), base=values[1].loss;
  cards.innerHTML=W.map((w,i)=>`<article class="probe" data-card="${i}"><h2>${names[i]} <span>阶段 ${i+1}/3</span></h2><div class="knob-row"><div class="knob" aria-hidden="true"><strong>w=${w.toFixed(1)}</strong></div><div class="weight-copy"><b>参数轻推</b>${i===1?'以这里为基准':`从 0.5 ${i===0?'减小':'增大'} 0.1`}</div></div><svg class="causal" viewBox="0 0 360 46" aria-hidden="true"><defs><marker id="m${i}" markerWidth="11" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="currentColor" stroke-width="1.5"/></marker></defs><path d="M70 12 C145 12 210 34 292 34"/><path d="M70 18 C145 18 210 40 292 40" marker-end="url(#m${i})"/></svg><div class="readouts"><div class="panel"><label>预测</label><div class="value">${values[i].p.toFixed(4)}</div></div><div class="panel"><label>半平方损失</label><div class="value loss">${values[i].loss.toFixed(4)}</div><div class="track"><div class="bar" style="width:${((values[i].loss-.09)/(.112-.09)*100).toFixed(1)}%"></div></div><div class="scale"><span>0.090</span><span>0.112</span></div></div></div><div class="delta">${i===1?'比较基准：损失 ':i===0?'向下：损失 ':'向上：损失 '}<strong>${i===1?values[i].loss.toFixed(4):(values[i].loss-base>=0?'+':'−')+Math.abs(values[i].loss-base).toFixed(4)}</strong></div></article>`).join('');
  const render=s=>{
    document.querySelectorAll('[data-card]').forEach((el,i)=>{el.classList.toggle('active',i===s.index);el.querySelector('.knob').style.transform=`rotate(${(i-1)*12}deg)`});
    buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===s.index)));
    status.textContent=s.index===1?'当前位置是比较基准；向两边轻推再观察。':s.index===0?'w 减小后，损失比基准更大。': 'w 增大后，损失比基准更小。';
  };
  const dispatch=action=>{let i=state.index;if(action.type==='select')i=action.index;if(action.type==='step')i=Math.max(0,Math.min(2,i+action.delta));if(i===state.index)return;state={index:i};render(state)};
  buttons.forEach((b,i)=>{b.addEventListener('click',()=>dispatch({type:'select',index:i}),{signal});b.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;e.preventDefault();e.stopPropagation();dispatch({type:'step',delta:d});buttons[state.index].focus()},{signal})});
  document.getElementById('reset').addEventListener('click',()=>{state=initialState();render(state);buttons[1].focus();status.textContent='已复位到 w = 0.5。'}, {signal});
  let destroyed=false;function destroy(){if(destroyed)return;destroyed=true;events.abort()}window.addEventListener('pagehide',destroy,{once:true});
  render(state);
})();
</script>
</body>
</html>
