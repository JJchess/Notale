<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="17" data-total="22">
<div id="stage">
<style>
  .p17-head{display:flex;align-items:flex-end;justify-content:space-between;gap:36px;padding-bottom:14px;border-bottom:1px solid rgba(29,39,56,.24)}
  .p17-kicker{font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.12em;color:var(--attention);margin-bottom:7px}
  .p17-head h1{font:700 var(--fs-h1)/1.18 var(--font-sans);margin:0;color:var(--text)}
  .p17-hint{font:600 var(--fs-label)/1.4 var(--font-sans);max-width:510px;text-align:right;margin:0;color:var(--text)}
  .p17-main{position:relative;flex:1;min-height:0;margin-top:16px;display:grid;grid-template-columns:360px 1fr 208px;gap:26px}
  .p17-input,.p17-hidden,.p17-output{position:relative;min-width:0;min-height:0}
  .p17-section-title{font:700 var(--fs-h2)/1.2 var(--font-sans);margin:0 0 8px}
  .p17-input{display:flex;flex-direction:column;align-items:center;padding-top:30px}
  #inputPlane{width:326px;height:326px;display:block;background:#fffdf6;border:2px solid rgba(29,39,56,.65);border-radius:8px;touch-action:none;cursor:crosshair}
  #inputPlane:focus-visible,.hbtn:focus-visible,.p17-actions button:focus-visible{outline:4px solid color-mix(in srgb,var(--focus) 45%,transparent);outline-offset:3px}
  .p17-read{font:700 var(--fs-body)/1.3 var(--font-mono);margin-top:12px;color:var(--model)}
  .p17-nudge{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,38px);gap:5px;margin-top:8px}
  .p17-nudge button,.p17-actions button{font:700 var(--fs-label)/1 var(--font-sans);border:2px solid rgba(29,39,56,.5);border-radius:8px;background:#fffdf6;color:var(--text);cursor:pointer}
  .p17-nudge .up{grid-column:2}.p17-nudge .left{grid-column:1}.p17-nudge .down{grid-column:2}.p17-nudge .right{grid-column:3}
  .p17-hidden{border:2px dashed rgba(36,87,166,.42);border-radius:8px;padding:42px 16px 14px}
  .p17-hidden>.p17-section-title{position:absolute;top:11px;left:18px}
  .p17-grid{height:100%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:12px}
  .hbtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:2px solid rgba(29,39,56,.36);border-radius:8px;background:#fffdf6;padding:7px;cursor:pointer;color:var(--text)}
  .hbtn[aria-pressed="true"]{border-color:var(--attention);box-shadow:inset 0 0 0 2px rgba(231,111,46,.16)}
  .hname{font:800 var(--fs-label)/1 var(--font-mono)}
  .hvalue{font:800 var(--fs-body)/1 var(--font-mono);color:var(--model);font-variant-numeric:tabular-nums}
  .heat{width:100%;aspect-ratio:1;max-height:118px;display:block;border:1px solid rgba(29,39,56,.3);background:var(--bg)}
  .p17-output{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px}
  .out-node{width:148px;height:94px;border:3px solid var(--model);border-radius:8px;background:#fffdf6;display:grid;place-items:center;text-align:center;font:800 var(--fs-body)/1.25 var(--font-sans);position:relative;z-index:2}
  .p17-note{font:400 var(--fs-sec)/1.45 var(--font-serif);text-align:center;margin:0;max-width:195px}
  .p17-actions{display:flex;gap:8px}.p17-actions button{padding:10px 12px}
  .p17-actions .next{border-color:var(--attention);color:var(--attention)}
  .p17-links{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:visible}
  .p17-foot{display:grid;grid-template-columns:1.25fr .9fr;gap:46px;align-items:center;padding-top:14px}
  .p17-take{font:600 var(--fs-lead)/1.45 var(--font-serif);margin:0;padding-left:18px;border-left:4px solid var(--model)}
  .p17-next{font:600 var(--fs-sec)/1.4 var(--font-sans);margin:0;text-align:right}
  .legend{display:flex;align-items:center;gap:8px;font:500 var(--fs-label)/1.2 var(--font-sans);margin-top:8px}.legend-bar{width:130px;height:12px;background:linear-gradient(90deg,#f4f1e8,#2457a6);border:1px solid rgba(29,39,56,.3)}
  #live{position:absolute}
</style>
<header class="p17-head">
  <div><div class="p17-kicker">HIDDEN RESPONSES · 局部响应</div><h1>每个隐藏神经元只点亮输入空间的一部分</h1></div>
  <p class="p17-hint">点一个隐藏神经元，再点输入平面，比较它在这里亮多少。</p>
</header>
<main class="p17-main canvas-full k-classification min0" aria-label="输入空间、隐藏层局部响应和输出组合关系图">
  <svg class="p17-links" viewBox="0 0 1488 650" preserveAspectRatio="none" aria-hidden="true"><g id="links"></g></svg>
  <section class="p17-input min0"><h2 class="p17-section-title">共享输入空间</h2>
    <svg id="inputPlane" class="no-pan" viewBox="0 0 326 326" tabindex="0" role="slider" aria-label="输入位置，方向键每次移动 0.05" aria-valuetext="输入1 0.25，输入2 0.75"></svg>
    <div class="p17-read" id="probeRead" aria-live="polite">探针 (0.25, 0.75) · H1 响应</div>
    <div class="p17-nudge" aria-label="移动输入探针"><button class="up" data-move="0,0.05" aria-label="输入2增加">↑</button><button class="left" data-move="-0.05,0" aria-label="输入1减少">←</button><button class="down" data-move="0,-0.05" aria-label="输入2减少">↓</button><button class="right" data-move="0.05,0" aria-label="输入1增加">→</button></div>
  </section>
  <section class="p17-hidden min0"><h2 class="p17-section-title">隐藏层 · 10 个成员</h2><div class="p17-grid" id="hiddenGrid"></div></section>
  <aside class="p17-output"><h2 class="p17-section-title">输出层</h2><div class="out-node">重新组合<br>局部响应</div><p class="p17-note">每条实线都把一个局部响应送到输出神经元。</p><div class="legend"><span>低 0</span><span class="legend-bar"></span><span>高 1</span></div><div class="p17-actions"><button class="next" id="nextH">换一个神经元</button><button id="reset">重置</button></div></aside>
</main>
<footer class="p17-foot"><p class="p17-take">隐藏层不是直接给答案：它先把不同区域变成一组可重新组合的响应。</p><p class="p17-next">如果反复按误差调整参数，这些局部响应会怎样拼成分类边界？</p></footer>
<script>
window.addEventListener('DOMContentLoaded',()=>{
  'use strict';
  Deck.init({index:17,total:22});
  const events=new AbortController(), sig=events.signal;
  const NS='http://www.w3.org/2000/svg';
  const plane=document.getElementById('inputPlane'), grid=document.getElementById('hiddenGrid'), live=document.getElementById('probeRead');
  let seed=1; const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
  const weights=Array.from({length:10},(_,i)=>{const a=i*Math.PI*2/10+(rnd()-.5)*.35;const m=7.2+rnd()*3.4;return [Math.cos(a)*m,Math.sin(a)*m]});
  const biases=weights.map((w,i)=>-(w[0]*(.25+.5*rnd())+w[1]*(.25+.5*rnd()))+(i%2?-.4:.4));
  const fresh=()=>({selected:0,x:.25,y:.75}); let state=fresh();
  function forward(x,y){const r=Lec.P.denseForward([x,y],weights,biases,'sigmoid');return r.outputs}
  const maps=weights.map((_,n)=>{const a=[];for(let iy=0;iy<21;iy++)for(let ix=0;ix<21;ix++)a.push(forward(ix/20,1-iy/20)[n]);return a});
  function mix(v){const lo=[244,241,232],hi=[36,87,166];return `rgb(${lo.map((x,i)=>Math.round(x+(hi[i]-x)*v)).join(',')})`}
  for(let n=0;n<10;n++){
    const b=document.createElement('button');b.className='hbtn';b.dataset.n=n;b.setAttribute('aria-label',`选择 H${n+1}`);
    const cells=maps[n].map((v,k)=>`<rect x="${(k%21)*5}" y="${Math.floor(k/21)*5}" width="5.2" height="5.2" fill="${mix(v)}"/>`).join('');
    b.innerHTML=`<span class="hname">H${n+1}</span><svg class="heat" viewBox="0 0 105 105" aria-hidden="true">${cells}<circle class="mapProbe" r="4" fill="none" stroke="#E76F2E" stroke-width="2.5"/></svg><span class="hvalue">0.00</span>`;grid.appendChild(b);
  }
  function drawPlane(){let s='<rect width="326" height="326" fill="#fffdf6"/>';
    for(let i=1;i<4;i++)s+=`<path d="M ${i*81.5} 0V326 M0 ${i*81.5}H326" stroke="rgba(29,39,56,.13)"/>`;
    s+=`<path d="M24 294H310M24 294V16" stroke="#1d2738" stroke-width="2"/><text x="255" y="318" font-size="15">输入 1</text><text x="7" y="25" font-size="15">输入 2</text>`;
    s+=`<circle cx="${24+state.x*286}" cy="${294-state.y*278}" r="9" fill="#fffdf6" stroke="#E76F2E" stroke-width="4"/><path d="M${19+state.x*286} ${294-state.y*278}h10M${24+state.x*286} ${289-state.y*278}v10" stroke="#E76F2E" stroke-width="2"/>`;plane.innerHTML=s;
  }
  function render(announce){const vals=forward(state.x,state.y);drawPlane();
    [...grid.children].forEach((b,n)=>{b.setAttribute('aria-pressed',n===state.selected?'true':'false');b.querySelector('.hvalue').textContent=vals[n].toFixed(2);const c=b.querySelector('.mapProbe');c.setAttribute('cx',state.x*105);c.setAttribute('cy',(1-state.y)*105);c.style.display=n===state.selected?'block':'none'});
    live.textContent=`探针 (${state.x.toFixed(2)}, ${state.y.toFixed(2)}) · H${state.selected+1} 响应 ${vals[state.selected].toFixed(2)}`;
    plane.setAttribute('aria-valuetext',`输入1 ${state.x.toFixed(2)}，输入2 ${state.y.toFixed(2)}；H${state.selected+1} 响应 ${vals[state.selected].toFixed(2)}`);
  }
  function dispatch(a){if(a.type==='select')state={...state,selected:a.n};if(a.type==='move')state={...state,x:Math.max(0,Math.min(1,Math.round((state.x+a.dx)*20)/20)),y:Math.max(0,Math.min(1,Math.round((state.y+a.dy)*20)/20))};if(a.type==='point')state={...state,x:Math.round(a.x*20)/20,y:Math.round(a.y*20)/20};render(true)}
  grid.addEventListener('click',e=>{const b=e.target.closest('.hbtn');if(b)dispatch({type:'select',n:+b.dataset.n})},{signal:sig});
  grid.addEventListener('keydown',e=>{const b=e.target.closest('.hbtn');if(!b||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();e.stopPropagation();let n=+b.dataset.n+(e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:e.key==='ArrowUp'?-5:5);n=(n+10)%10;dispatch({type:'select',n});grid.children[n].focus()},{signal:sig});
  plane.addEventListener('pointerdown',e=>{plane.setPointerCapture(e.pointerId);const p=Deck.pt(plane,e);dispatch({type:'point',x:Math.max(0,Math.min(1,(p.x-24)/286)),y:Math.max(0,Math.min(1,(294-p.y)/278))})},{signal:sig});
  plane.addEventListener('keydown',e=>{const d={ArrowLeft:[-.05,0],ArrowRight:[.05,0],ArrowUp:[0,.05],ArrowDown:[0,-.05]}[e.key];if(!d)return;e.preventDefault();e.stopPropagation();dispatch({type:'move',dx:d[0],dy:d[1]})},{signal:sig});
  document.querySelector('.p17-nudge').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset.move.split(',').map(Number);dispatch({type:'move',dx:d[0],dy:d[1]})},{signal:sig});
  document.getElementById('nextH').addEventListener('click',()=>dispatch({type:'select',n:(state.selected+1)%10}),{signal:sig});
  document.getElementById('reset').addEventListener('click',()=>{state=fresh();render(false);grid.children[0].focus();live.textContent='探针 (0.25, 0.75) · H1 响应 '+forward(.25,.75)[0].toFixed(2)},{signal:sig});
  function links(){const g=document.getElementById('links');let s='';for(let i=0;i<10;i++){const row=i<5?0:1,col=i%5;const y=150+row*300;const x=390+col*160;s+=`<path d="M330 315 C365 315,365 ${y},${x} ${y}" fill="none" stroke="#2457A6" stroke-width="2" opacity=".22"/><path d="M${x+125} ${y} C1320 ${y},1320 315,1370 315" fill="none" stroke="#2457A6" stroke-width="2" opacity=".3"/>`;}g.innerHTML=s}
  links();render(false);
  let dead=false;function destroy(){if(dead)return;dead=true;events.abort()}window.addEventListener('pagehide',destroy,{once:true});
});
</script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
