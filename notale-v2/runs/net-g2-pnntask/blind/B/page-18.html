<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:14px}.head{display:flex;justify-content:space-between;align-items:flex-end}.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.16em;color:var(--attention)}h1{font:700 var(--fs-h1)/1.2 var(--font-sans);margin:7px 0 0}.nettag{font:700 var(--fs-body)/1 var(--font-mono);color:var(--model);padding:10px 15px;border:1px solid currentColor;border-radius:8px}.process{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;position:relative;padding:0 18px}.process:before{content:"";position:absolute;left:8%;right:8%;top:24px;border-top:2px solid #9d9a90}.step{z-index:1;background:var(--bg);border:2px solid #aaa69b;border-radius:8px;padding:11px;text-align:center;font:600 var(--fs-sec)/1.2 var(--font-sans)}.step.on{border-color:var(--attention);color:var(--attention);box-shadow:0 0 0 3px rgba(231,111,46,.13)}.main{height:470px;flex:none;display:grid;grid-template-columns:1.08fr .92fr;gap:20px;min-height:0}.viz{display:flex;flex-direction:column;min-height:0}.viz h2{font:700 var(--fs-h2)/1.2 var(--font-sans);margin:0 0 8px}.cvbox{position:relative;flex:1;min-height:0;border:1px solid #aaa69b;border-radius:8px;overflow:hidden;background:#fff}.field{width:100%;height:100%;display:block}.chart{width:100%;height:100%}.legend{display:flex;gap:22px;align-items:center;margin-top:8px;font-size:var(--fs-label)}.dot,.linekey{display:inline-block;margin-right:7px;vertical-align:middle}.dot{width:12px;height:12px;border-radius:50%;border:2px solid #30343b}.dot.c0{background:#fff}.dot.c1{background:var(--model)}.linekey{width:25px;border-top:3px solid var(--attention)}.bottom{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:center}.panel.train{display:flex;align-items:center;gap:14px;padding:12px 16px}.read{min-width:125px}.read b{display:block;font:700 23px/1.1 var(--font-mono);color:var(--model)}.read span,.settings{font-size:var(--fs-label)}.settings{white-space:nowrap}.status b{color:var(--attention)}.controls{display:flex;gap:10px}.btn{min-width:118px}.hint{margin:0;font-size:var(--fs-label)}.close{display:flex;justify-content:space-between;align-items:center;gap:30px}.claim{font:600 var(--fs-lead)/1.35 var(--font-serif);margin:0}.next{font-size:var(--fs-sec);margin:0;color:#555}.alt{display:none}
</style>
</head>
<body data-page="18" data-total="22">
<div id="stage">
  <header class="head"><div><div class="kicker">LIVE TRAINING</div><h1>启动训练：误差下降时，分类边界也在改写</h1></div><div class="nettag">网络 2–10–10–1</div></header>
  <div class="process k-process" aria-label="每批训练的四个步骤">
    <div class="step" data-step="1">1　前向预测</div><div class="step" data-step="2">2　计算损失</div><div class="step" data-step="3">3　反向分配影响</div><div class="step" data-step="4">4　更新参数</div>
  </div>
  <main class="main split-lr min0">
    <figure class="viz min0" aria-labelledby="field-title"><h2 id="field-title">分类边界正在改变</h2><div class="cvbox"><canvas id="field" class="field cv-fill" aria-label="200 个二维训练样本、预测概率场和预测等于 0.5 的决策边界"></canvas></div><figcaption class="legend"><span><i class="dot c0"></i>类别 0</span><span><i class="dot c1"></i>类别 1</span><span><i class="linekey"></i>预测 = 0.5 的边界</span></figcaption></figure>
    <figure class="viz min0" aria-labelledby="loss-title"><h2 id="loss-title">训练损失随轮次下降</h2><div class="cvbox"><div id="lossChart" class="chart" role="img" aria-label="平均训练损失随训练轮次变化的折线图"></div></div><figcaption class="hint">每轮结束，两区才在同一时刻刷新。</figcaption></figure>
  </main>
  <section class="bottom"><div class="panel train"><div class="read"><span>当前轮次</span><b id="epoch">轮次 0</b></div><div class="read"><span>平均训练损失</span><b id="loss">损失 —</b></div><div class="read status"><span>正在执行</span><b id="status" aria-live="polite">等待启动</b></div><div class="settings">样本 200　·　每批 16　·　学习率 0.3</div><div class="controls"><button class="btn" id="toggle">启动训练</button><button class="btn" id="reset">重新开始</button></div></div><p class="hint">同时看：右边的误差往下，左边的分界在移动。</p></section>
  <footer class="close"><p class="claim">“学习”不是一次猜对，而是反复用误差修正参数。</p><p class="next">如果分界必须弯曲，隐藏层究竟帮了什么忙？</p></footer>
  <table class="alt sr-only" hidden><caption>训练记录的数据替代</caption><thead><tr><th>轮次</th><th>平均损失</th></tr></thead><tbody id="altRows"><tr><td>0</td><td>尚未计算</td></tr></tbody></table>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(function(){
'use strict';
Deck.init({index:18,total:22});
const C={N:200,batch:16,lr:.3,grid:80,seed:'1'}, state={running:false,started:false,epoch:0,step:0,losses:[],timer:0};
let samples=[],layers=[],order=[],batchAt=0,field=null,oldField=null,blend=1,raf=0;
const canvas=document.getElementById('field'), chart=echarts.init(document.getElementById('lossChart'),null,{renderer:'svg'});
function makeData(){const r=new Math.seedrandom(C.seed);const a=[];for(let k=0;k<2;k++)for(let i=0;i<100;i++){const ang=2*Math.PI*(i/100)+(r()-.5)*.13;const rad=(k?0.84:.36)+(r()-.5)*(k?.20:.18);a.push({id:'c'+k+'-'+i,x:[rad*Math.cos(ang),rad*Math.sin(ang)],t:k});}return a;}
function makeLayers(){const r=new Math.seedrandom(C.seed+'-net');function layer(nIn,nOut,activation){return {weights:Array.from({length:nOut},()=>Array.from({length:nIn},()=>(r()*2-1)*.55)),biases:Array(nOut).fill(0),activation:activation};}return [layer(2,10,'tanh'),layer(10,10,'tanh'),layer(10,1,'sigmoid')];}
function scalar(v){if(typeof v==='number')return v;if(Array.isArray(v)){const q=v[v.length-1];return Array.isArray(q)?Number(q[0]):Number(q);}if(v&&Array.isArray(v.output))return Number(v.output[0]);if(v&&Array.isArray(v.outputs))return Number(v.outputs[0]);return Number(v)||0;}
function predict(x){return scalar(Lec.P.forwardNetwork(x,layers));}
function computeField(){const a=new Float32Array(C.grid*C.grid);for(let j=0;j<C.grid;j++)for(let i=0;i<C.grid;i++)a[j*C.grid+i]=predict([-1.15+i*2.3/(C.grid-1),1.15-j*2.3/(C.grid-1)]);return a;}
function avgLoss(){let s=0;for(const d of samples){const p=Math.max(1e-7,Math.min(1-1e-7,predict(d.x)));s+=-(d.t*Math.log(p)+(1-d.t)*Math.log(1-p));}return s/samples.length;}
function drawField(){const ctx=Deck.fit(canvas),w=canvas.offsetWidth,h=canvas.offsetHeight,g=C.grid,cw=w/g,ch=h/g;if(!field)return;ctx.clearRect(0,0,w,h);for(let j=0;j<g;j++)for(let i=0;i<g;i++){let p=field[j*g+i];if(oldField&&blend<1)p=oldField[j*g+i]*(1-blend)+p*blend;ctx.fillStyle=`rgba(36,87,166,${.06+.34*p})`;ctx.fillRect(i*cw,j*ch,cw+1,ch+1);}ctx.strokeStyle='#E76F2E';ctx.lineWidth=3;ctx.beginPath();for(let j=0;j<g-1;j++)for(let i=0;i<g-1;i++){const q=(x,y)=>{let p=field[y*g+x];if(oldField&&blend<1)p=oldField[y*g+x]*(1-blend)+p*blend;return p>=.5;};const m=q(i,j)+q(i+1,j)+q(i+1,j+1)+q(i,j+1);if(m>0&&m<4){ctx.moveTo((i+.5)*cw,j*ch);ctx.lineTo((i+.5)*cw,(j+1)*ch);}}ctx.stroke();for(const d of samples){const x=(d.x[0]+1.15)/2.3*w,y=(1.15-d.x[1])/2.3*h;ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);ctx.fillStyle=d.t?'#2457A6':'#fff';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#252a30';ctx.stroke();}}
function chartRender(){chart.setOption({animation:!Deck.reduced(),animationDuration:240,textStyle:{fontSize:16,fontFamily:'sans-serif'},grid:{left:72,right:25,top:24,bottom:58},tooltip:{trigger:'axis',textStyle:{fontSize:16},formatter:p=>`轮次 ${p[0].value[0]}<br>平均损失 ${p[0].value[1].toFixed(3)}`},xAxis:{type:'value',min:0,name:'训练轮次',nameLocation:'middle',nameGap:34,nameTextStyle:{fontSize:14},axisLabel:{fontSize:12}},yAxis:{type:'value',min:0,name:'平均损失',nameTextStyle:{fontSize:14},axisLabel:{fontSize:12}},series:[{id:'loss',type:'line',data:state.losses.map((v,i)=>[i+1,v]),showSymbol:true,symbolSize:7,lineStyle:{width:3,color:'#2457A6'},itemStyle:{color:'#E76F2E'},areaStyle:{color:'rgba(36,87,166,.09)'}}]},{notMerge:true});}
function render(){document.querySelectorAll('.step').forEach((e,i)=>e.classList.toggle('on',i+1===state.step));document.getElementById('epoch').textContent='轮次 '+state.epoch;document.getElementById('loss').textContent=state.losses.length?'损失 '+state.losses.at(-1).toFixed(3):'损失 —';document.getElementById('status').textContent=!state.started?'等待启动':state.running?['','前向预测','计算损失','反向分配影响','更新参数'][state.step]:'已暂停';document.getElementById('toggle').textContent=!state.started?'启动训练':state.running?'暂停':'继续';document.getElementById('altRows').innerHTML=state.losses.length?state.losses.map((v,i)=>`<tr><td>${i+1}</td><td>${v.toFixed(3)}</td></tr>`).join(''):'<tr><td>0</td><td>尚未计算</td></tr>';drawField();chartRender();}
function animateBoundary(){if(Deck.reduced()){blend=1;drawField();return;}const t0=performance.now();cancelAnimationFrame(raf);function f(t){blend=Math.min(1,(t-t0)/240);drawField();if(blend<1)raf=requestAnimationFrame(f);}raf=requestAnimationFrame(f);}
function runStep(){if(!state.running)return;state.step=state.step%4+1;if(state.step===1){const ids=order.slice(batchAt,batchAt+C.batch);state.current=ids;}else if(state.step===2){state.current.forEach(i=>Lec.P.forwardNetwork(samples[i].x,layers));}else if(state.step===3){const grads=state.current.map(i=>{const g=Lec.P.backpropNetwork(samples[i].x,layers,[samples[i].t],'binaryCrossEntropy');return g.gradients||g.grads||g;});function mean(xs){const v=xs[0];if(typeof v==='number')return xs.reduce((a,b)=>a+b,0)/xs.length;if(Array.isArray(v))return v.map((_,i)=>mean(xs.map(x=>x[i])));if(v===null||typeof v!=='object')return v;const o={};Object.keys(v).forEach(k=>o[k]=mean(xs.map(x=>x[k])));return o;}state.grad=mean(grads);}else{layers=Lec.P.sgdStep(layers,state.grad,C.lr)||layers;batchAt+=C.batch;if(batchAt>=C.N){batchAt=0;state.epoch++;state.losses.push(avgLoss());oldField=field;field=computeField();blend=0;animateBoundary();} }render();state.timer=setTimeout(runStep,Deck.reduced()?0:120);}
function setRunning(v){state.running=v;state.started=true;clearTimeout(state.timer);render();if(v)runStep();}
function reset(){clearTimeout(state.timer);cancelAnimationFrame(raf);Object.assign(state,{running:false,started:false,epoch:0,step:0,losses:[],timer:0});samples=makeData();layers=makeLayers();order=Array.from({length:C.N},(_,i)=>i);batchAt=0;oldField=null;field=computeField();blend=1;render();}
document.getElementById('toggle').addEventListener('click',()=>setRunning(!state.running));document.getElementById('reset').addEventListener('click',reset);const ro=new ResizeObserver(()=>{chart.resize();drawField();});ro.observe(document.querySelector('.main'));window.addEventListener('blur',()=>{if(state.running)setRunning(false)});window.addEventListener('beforeunload',()=>{clearTimeout(state.timer);cancelAnimationFrame(raf);ro.disconnect();chart.dispose();});reset();
})();
</script>
</body>
</html>
