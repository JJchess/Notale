<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="07" data-total="22">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;gap:22px}
    .p7-head{flex:0 0 92px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid color-mix(in srgb,var(--text) 18%,transparent);padding-bottom:18px}
    .p7-head h1{margin:0;font-size:var(--fs-h1);line-height:1.15;font-weight:750;letter-spacing:.01em}
    .p7-kicker{font:600 var(--fs-label)/1.3 var(--font-mono);color:color-mix(in srgb,var(--text) 65%,transparent)}
    .p7-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:22px}
    .p7-route{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:190px 86px 230px 86px 260px 86px 220px;align-items:center;justify-content:center;border:1px dashed color-mix(in srgb,var(--model) 42%,transparent);border-radius:8px;background:color-mix(in srgb,var(--model) 5%,var(--bg));padding:30px 24px 12px}
    .p7-route:before{content:"";position:absolute;left:92px;right:92px;top:52%;height:2px;background:color-mix(in srgb,var(--model) 35%,transparent);z-index:0}
    .p7-route:after{content:"前向计算：参数决定预测";position:absolute;left:28px;top:20px;font:700 var(--fs-label)/1.3 var(--font-sans);color:var(--model);letter-spacing:.03em}
    .p7-node,.p7-arrow{position:relative;z-index:1}
    .p7-node{min-height:176px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg)}
    .p7-box{width:100%;box-sizing:border-box;border:2px solid color-mix(in srgb,var(--text) 48%,transparent);border-radius:8px;padding:22px 18px;text-align:center;background:var(--bg)}
    .p7-box.model{border-color:var(--model);color:var(--model)}
    .p7-lab{font-size:var(--fs-label);line-height:1.35;color:color-mix(in srgb,var(--text) 70%,transparent)}
    .p7-val{font:700 var(--fs-h1)/1.15 var(--font-mono);font-variant-numeric:tabular-nums}
    .p7-formula{font:650 var(--fs-h2)/1.25 var(--font-mono);white-space:nowrap}
    .p7-arrow{height:52px;display:flex;align-items:flex-start;justify-content:center;color:var(--model);font-size:var(--fs-h1);line-height:1}
    .p7-arrow span{position:absolute;top:40px;width:120px;text-align:center;font-size:var(--fs-label);line-height:1.3;color:color-mix(in srgb,var(--text) 68%,transparent)}
    .p7-turn{position:relative;flex:0 0 202px;display:grid;grid-template-columns:1fr 72px 1fr;align-items:stretch;border-top:2px solid color-mix(in srgb,var(--text) 22%,transparent);padding-top:22px}
    .p7-turn>div{position:relative;z-index:1}
    .p7-observe,.p7-learn{display:flex;align-items:center;gap:24px;padding:0 34px;border-radius:8px}
    .p7-observe{background:color-mix(in srgb,var(--text) 5%,var(--bg))}
    .p7-observe{justify-content:flex-end}
    .p7-learn{justify-content:flex-start;background:color-mix(in srgb,var(--attention) 9%,var(--bg))}
    .p7-state{display:flex;gap:12px}
    .p7-chip{min-width:112px;border:1px solid color-mix(in srgb,var(--text) 28%,transparent);border-radius:8px;padding:13px 16px;background:transparent}
    .p7-chip b{display:block;font:700 var(--fs-lead)/1.2 var(--font-mono);margin-top:5px}
    .p7-caption{max-width:330px;font-size:var(--fs-body);line-height:1.45}
    .p7-caption strong{display:block;font-size:var(--fs-h2);margin-bottom:7px}
    .p7-barrier{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--attention)}
    .p7-stop{width:50px;height:50px;border:4px solid currentColor;border-radius:50%;display:grid;place-items:center;font:800 var(--fs-h1)/1 var(--font-sans)}
    .p7-barrier span{font-size:var(--fs-label);font-weight:700;white-space:nowrap}
    .p7-learn{border:2px dashed var(--attention);border-radius:8px}
    .p7-learn .p7-caption strong{color:var(--attention)}
    .p7-question{font-family:var(--font-serif);font-size:var(--fs-h2);line-height:1.4;margin:0;color:var(--text)}
  </style>

  <header class="p7-head">
    <h1>会算，还不等于会学</h1>
    <div class="p7-kicker">一次前向计算 · 参数保持不动</div>
  </header>

  <main class="p7-main min0">
    <section class="p7-route k-process" aria-label="神经元从输入到预测的前向计算过程">
      <svg aria-hidden="true" viewBox="0 0 1400 430" preserveAspectRatio="none" style="position:absolute;inset:66px 34px 34px;width:calc(100% - 68px);height:calc(100% - 100px);z-index:0">
        <path d="M55 220 H1345" fill="none" stroke="var(--model)" stroke-opacity=".16" stroke-width="136" stroke-linecap="round"/>
        <path d="M1260 170 L1345 220 L1260 270" fill="none" stroke="var(--model)" stroke-opacity=".24" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="p7-node min0">
        <div class="p7-box"><div class="p7-lab">输入</div><div class="p7-val">x = 0.8</div></div>
      </div>
      <div class="p7-arrow" aria-hidden="true">→<span>乘权重</span></div>
      <div class="p7-node min0">
        <div class="p7-box"><div class="p7-lab">加权，再加偏置</div><div class="p7-formula">0.8 × 0.5 − 0.2</div></div>
      </div>
      <div class="p7-arrow" aria-hidden="true">→<span>得到总输入</span></div>
      <div class="p7-node min0">
        <div class="p7-box model"><div class="p7-lab">总输入</div><div class="p7-val">z = <span id="zRead">0.2000</span></div></div>
      </div>
      <div class="p7-arrow" aria-hidden="true">→<span>经过 Sigmoid</span></div>
      <div class="p7-node min0">
        <div class="p7-box model"><div class="p7-lab">预测</div><div class="p7-val">ŷ = <span id="yRead">0.5498</span></div></div>
      </div>
    </section>

    <section class="p7-turn" aria-label="计算与学习的区别">
      <svg aria-hidden="true" viewBox="0 0 1488 202" preserveAspectRatio="none" style="position:absolute;inset:22px 0 0;width:100%;height:180px;z-index:0">
        <path d="M1390 90 H98" fill="none" stroke="var(--attention)" stroke-opacity=".13" stroke-width="66" stroke-dasharray="80 28" stroke-linecap="round"/>
      </svg>
      <div class="p7-observe min0">
        <div class="p7-state" aria-label="计算前后的参数">
          <div class="p7-chip"><span class="p7-lab">权重</span><b>w = 0.5</b></div>
          <div class="p7-chip"><span class="p7-lab">偏置</span><b>b = −0.2</b></div>
        </div>
        <div class="p7-caption"><strong>算完以后</strong>预测变成了 0.5498，参数却还是原值。</div>
      </div>
      <div class="p7-barrier" aria-label="尚未发生参数改变"><div class="p7-stop">!</div><span>还没学</span></div>
      <div class="p7-learn min0">
        <div class="p7-caption"><strong>学习必须多一步</strong><p class="p7-question">怎样让“结果”反过来推动 w 和 b 改变？</p></div>
      </div>
    </section>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const x = 0.8, w = 0.5, b = -0.2;
      const z = Lec.P.weightedSum([x], [w], b);
      const y = Lec.P.activation('sigmoid', z);
      document.getElementById('zRead').textContent = Number(z).toFixed(4);
      document.getElementById('yRead').textContent = Number(y).toFixed(4);
      Deck.init({index:7,total:22});
    });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
