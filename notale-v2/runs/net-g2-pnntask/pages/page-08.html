<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid color-mix(in srgb,var(--text) 22%,transparent);padding-bottom:14px}
h1{font-size:var(--fs-h1);margin:0;line-height:1.15}.eyebrow{font-size:var(--fs-label);letter-spacing:.12em;color:var(--attention);font-weight:700;margin-bottom:7px}.lead{margin:0;max-width:720px}
main{flex:1;display:flex;flex-direction:column;gap:16px;min-height:0}.prompt{display:flex;align-items:center;justify-content:space-between;gap:24px}.prompt strong{font-size:var(--fs-lead)}
.target{display:flex;align-items:center;gap:10px;font-size:var(--fs-body)}.target .num{font-size:28px;color:var(--model);padding:7px 14px;border:2px solid var(--model);border-radius:8px;background:#fff}
.match-area{flex:1;display:grid;grid-template-columns:1fr 120px 1fr;align-items:stretch;min-height:0}.bank{display:flex;flex-direction:column;gap:12px;padding:18px 22px;background:color-mix(in srgb,#fff 58%,transparent);border-radius:8px}.bank h2{font-size:var(--fs-h2);margin:0 0 2px}.bank .small{margin:0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1}.choice{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:112px;border:2px solid color-mix(in srgb,var(--text) 35%,transparent);border-radius:8px;background:#fff;color:var(--text);font:700 28px/1 var(--font-mono);cursor:pointer}.choice .sub{font:400 var(--fs-label)/1.25 var(--font-sans);color:color-mix(in srgb,var(--text) 68%,transparent)}.choice:hover,.choice:focus-visible{border-color:var(--attention)}.choice.selected{border-color:var(--attention);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--attention) 16%,transparent)}.choice.matched{border-color:var(--model);background:color-mix(in srgb,var(--model) 9%,#fff)}.choice.matched::after{content:'已配对 ✓';font:700 var(--fs-label)/1 var(--font-sans);color:var(--model)}.choice:disabled{opacity:1;cursor:default}
.bridge{display:flex;align-items:center;justify-content:center;position:relative}.bridge::before{content:'';width:70px;border-top:2px dashed color-mix(in srgb,var(--text) 35%,transparent)}.bridge::after{content:'选择一对';position:absolute;padding:6px 8px;background:var(--bg);font-size:var(--fs-label);color:color-mix(in srgb,var(--text) 65%,transparent)}
.evidence{min-height:92px;display:grid;grid-template-columns:1.4fr 1fr auto;gap:18px;align-items:center;padding:14px 18px;border-left:5px solid var(--attention);background:color-mix(in srgb,var(--attention) 8%,#fff);border-radius:0 8px 8px 0}.formula{font:700 24px/1.35 var(--font-mono)}.formula .calc{color:var(--model)}.feedback{font-size:var(--fs-body);line-height:1.4}.feedback strong{display:block}.btn{min-width:104px}.actions{display:flex;gap:10px}
.status-dots{display:flex;gap:8px;align-items:center}.dot{width:14px;height:14px;border:2px solid color-mix(in srgb,var(--text) 38%,transparent);border-radius:50%}.dot.on{background:var(--model);border-color:var(--model)}
@media (prefers-reduced-motion:no-preference){.choice{transition:border-color .15s,background .15s,box-shadow .15s}}
</style>
</head>
<body data-page="08" data-total="22">
<div id="stage">
<header>
  <div><div class="eyebrow">误差如何推动参数移动 · 01</div><h1>给误差一个分数</h1></div>
  <p class="lead">预测离目标多远？把每个预测与它的<strong>半平方损失</strong>配成一对。</p>
</header>
<main>
  <div class="prompt"><strong>先点一个预测，再点一个损失；比较即时计算结果。</strong><div class="target">固定目标 <span class="num" id="targetRead">1.0000</span></div></div>
  <section class="match-area" aria-label="损失配对任务">
    <div class="bank min0"><h2>预测值 ŷ</h2><p class="small">模型当前给出的答案</p><div class="choices" id="predictions"></div></div>
    <div class="bridge" aria-hidden="true"></div>
    <div class="bank min0"><h2>半平方损失 L</h2><p class="small">越接近 0，预测越接近目标</p><div class="choices" id="losses"></div></div>
  </section>
  <section class="evidence" aria-live="polite">
    <div class="formula" id="formula">L = ½ × (目标 − 预测)²</div>
    <div class="feedback" id="feedback"><strong>等待选择</strong>损失把“差多少”压成一个可比较的数。</div>
    <div><div class="status-dots" id="dots" aria-label="已完成 0 组"></div><div class="actions"><button class="btn" id="reset" type="button">重新配对</button></div></div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:8,total:22});
  const events=new AbortController();
  const P=[0.2000,0.5498,0.8000,0.9500];
  const target=1;
  function lossFor(p){
    /* 本页定义的半平方损失：单个预测与固定目标的即时计算。 */
    return .5*(target-p)*(target-p);
  }
  const losses=P.map(lossFor);
  const shownLosses=[losses[2],losses[0],losses[3],losses[1]];
  const predBox=document.getElementById('predictions'),lossBox=document.getElementById('losses');
  const formula=document.getElementById('formula'),feedback=document.getElementById('feedback'),dots=document.getElementById('dots'),reset=document.getElementById('reset');
  function initialState(){return {pred:null,loss:null,matched:[],attempted:false};}
  let state=initialState();
  function key(v){return Number(v).toFixed(4);}
  function build(){
    predBox.innerHTML=P.map(v=>`<button type="button" class="choice" data-kind="pred" data-value="${v}" aria-pressed="false"><span>${key(v)}</span><span class="sub">预测</span></button>`).join('');
    lossBox.innerHTML=shownLosses.map(v=>`<button type="button" class="choice" data-kind="loss" data-value="${v}" aria-pressed="false"><span>${key(v)}</span><span class="sub">损失</span></button>`).join('');
    dots.innerHTML=P.map(()=>'<span class="dot"></span>').join('');
  }
  function dispatch(action){
    if(action.type==='reset'){state=initialState();render();predBox.querySelector('button').focus();return;}
    const v=action.value;
    if(state.matched.some(m=>key(action.kind==='pred'?m.p:m.l)===key(v))) return;
    state={...state,[action.kind]:v,attempted:false};
    if(state.pred!==null&&state.loss!==null){
      const actual=lossFor(state.pred),ok=Math.abs(actual-state.loss)<0.00006;
      if(ok) state={pred:null,loss:null,matched:[...state.matched,{p:state.pred,l:state.loss}],attempted:true,last:{p:state.pred,l:actual,ok:true}};
      else state={...state,attempted:true,last:{p:state.pred,l:actual,chosen:state.loss,ok:false},loss:null};
    }
    render();
  }
  function render(){
    document.querySelectorAll('.choice').forEach(btn=>{
      const kind=btn.dataset.kind,v=Number(btn.dataset.value);
      const selected=state[kind]!==null&&key(state[kind])===key(v);
      const matched=state.matched.some(m=>key(kind==='pred'?m.p:m.l)===key(v));
      btn.classList.toggle('selected',selected);btn.classList.toggle('matched',matched);btn.disabled=matched;btn.setAttribute('aria-pressed',String(selected));
    });
    [...dots.children].forEach((d,i)=>d.classList.toggle('on',i<state.matched.length));
    dots.setAttribute('aria-label',`已完成 ${state.matched.length} 组，共 4 组`);
    if(state.last&&state.attempted){
      const a=state.last;
      formula.innerHTML=`L = ½ × (1.0000 − ${key(a.p)})² = <span class="calc">${key(a.l)}</span>`;
      feedback.innerHTML=a.ok?(state.matched.length===4?'<strong>四组全部完成</strong>预测越接近目标，损失越接近 0。':'<strong>配对成立</strong>这个分数由当前差值现场算出。'):`<strong>这两个数不配对</strong>该预测算得 ${key(a.l)}，请换一个损失。`;
    }else if(state.pred!==null){formula.innerHTML=`L = ½ × (1.0000 − ${key(state.pred)})² = <span class="calc">?</span>`;feedback.innerHTML='<strong>已选预测</strong>现在选择它对应的损失。';}
    else{formula.textContent='L = ½ × (目标 − 预测)²';feedback.innerHTML='<strong>等待选择</strong>损失把“差多少”压成一个可比较的数。';}
  }
  build();render();
  document.querySelector('.match-area').addEventListener('click',e=>{const b=e.target.closest('.choice');if(b)dispatch({type:b.dataset.kind,value:Number(b.dataset.value)});},{signal:events.signal});
  reset.addEventListener('click',()=>dispatch({type:'reset'}),{signal:events.signal});
  let destroyed=false;function destroy(){if(destroyed)return;destroyed=true;events.abort();}
  window.addEventListener('pagehide',destroy,{once:true});
})();
</script>
</body>
</html>
