<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="16" data-total="22">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;gap:18px;}
    .p16-head{flex:0 0 84px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid color-mix(in srgb,var(--text) 20%,transparent);padding-bottom:15px;}
    .p16-head h1{margin:0;font-size:var(--fs-h1);line-height:1.15;font-weight:750;letter-spacing:.01em;}
    .p16-head .lead{margin:0 0 2px;max-width:670px;text-align:right;color:color-mix(in srgb,var(--text) 72%,transparent);}
    .compare{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;padding:8px 34px 0;}
    .lane{display:grid;grid-template-columns:235px 1fr 235px;align-items:center;min-height:100px;gap:24px;}
    .lane-label{font-size:var(--fs-h2);font-weight:750;line-height:1.25;}
    .lane-label small{display:block;font-size:var(--fs-label);font-weight:500;margin-top:6px;color:color-mix(in srgb,var(--text) 62%,transparent);}
    .lane-end{font-size:var(--fs-lead);line-height:1.4;font-weight:650;}
    .lane-end.right{text-align:right;}
    .direction{height:52px;position:relative;display:flex;align-items:center;}
    .forward-line{width:100%;height:4px;background:var(--model);position:relative;border-radius:3px;}
    .forward-line:after{content:"";position:absolute;right:-1px;top:-8px;border-left:18px solid var(--model);border-top:10px solid transparent;border-bottom:10px solid transparent;}
    .back-line{width:100%;height:16px;position:relative;border-top:3px solid var(--attention);border-bottom:3px solid var(--attention);}
    .back-line:before{content:"";position:absolute;left:-2px;top:-10px;width:18px;height:18px;border-left:3px solid var(--attention);border-bottom:3px solid var(--attention);transform:rotate(45deg);background:var(--bg);}
    .network{flex:1;min-height:0;position:relative;margin:0 36px;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--model) 3%,transparent) 18%,color-mix(in srgb,var(--model) 3%,transparent) 82%,transparent);}
    .network svg{width:100%;height:100%;overflow:visible;}
    .bottom{flex:0 0 150px;display:grid;grid-template-columns:1fr 1.18fr;gap:34px;align-items:stretch;margin-top:8px;}
    .explain{display:flex;align-items:center;gap:18px;padding:18px 22px;border-left:5px solid var(--attention);background:color-mix(in srgb,var(--attention) 8%,transparent);border-radius:0 8px 8px 0;}
    .explain strong{font-size:var(--fs-h2);white-space:nowrap;}
    .explain span{font-size:var(--fs-body);line-height:1.45;}
    .takeaway{display:flex;align-items:center;padding:18px 26px;border-top:2px solid var(--text);border-bottom:2px solid var(--text);font-family:var(--font-serif);font-size:var(--fs-lead);line-height:1.45;}
    .node-title{font:700 19px var(--font-sans);fill:var(--text);}
    .node-value{font:600 16px var(--font-mono);fill:var(--model);}
    .layer-label{font:500 15px var(--font-sans);fill:color-mix(in srgb,var(--text) 64%,transparent);}
    .weight{font:600 15px var(--font-mono);fill:var(--text);}
  </style>

  <header class="p16-head">
    <h1>同一张网络，两种方向</h1>
    <p class="lead">前向计算结果；反向分配调整责任。</p>
  </header>

  <main class="compare min0" aria-label="前向传播与反向传播对照">
    <section class="lane" aria-label="前向过程">
      <div class="lane-label" style="color:var(--model)">前向传播<small>算：预测是多少</small></div>
      <div class="direction" aria-hidden="true"><div class="forward-line"></div></div>
      <div class="lane-end right">输入 → <span style="color:var(--model)">预测</span></div>
    </section>

    <figure class="network min0" aria-label="一个三层神经网络；前向信息从左到右，反向调整信息从右到左">
      <svg viewBox="0 0 1120 420" role="img" aria-labelledby="netTitle netDesc">
        <title id="netTitle">同一网络上的两个方向</title>
        <desc id="netDesc">蓝色实线表示输入到预测的前向计算，橙色双线空心箭头表示误差返回各参数的调整信息。</desc>
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="9 8" opacity=".34">
          <rect x="28" y="46" width="220" height="328" rx="12"/><rect x="450" y="46" width="220" height="328" rx="12"/><rect x="872" y="46" width="220" height="328" rx="12"/>
        </g>
        <text class="layer-label" x="138" y="28" text-anchor="middle">输入层</text><text class="layer-label" x="560" y="28" text-anchor="middle">隐藏层</text><text class="layer-label" x="982" y="28" text-anchor="middle">输出层</text>
        <text class="node-title" x="560" y="402" text-anchor="middle">同一组连接与参数</text>
        <g stroke="var(--model)" stroke-width="5" fill="none" opacity=".88">
          <path d="M208 142 C330 142 340 134 480 134"/><path d="M208 278 C330 278 340 286 480 286"/>
          <path d="M640 134 C770 134 780 210 902 210"/><path d="M640 286 C770 286 780 210 902 210"/>
        </g>
        <g fill="var(--bg)" stroke="var(--text)" stroke-width="3">
          <rect x="68" y="101" width="140" height="82" rx="14"/><rect x="68" y="237" width="140" height="82" rx="14"/>
          <rect x="480" y="93" width="160" height="82" rx="14"/><rect x="480" y="245" width="160" height="82" rx="14"/>
          <rect x="902" y="169" width="160" height="82" rx="14"/>
        </g>
        <text class="node-title" x="138" y="136" text-anchor="middle">输入 x₁</text><text class="node-value" x="138" y="163" text-anchor="middle">0.8</text>
        <text class="node-title" x="138" y="272" text-anchor="middle">输入 x₂</text><text class="node-value" x="138" y="299" text-anchor="middle">0.3</text>
        <text class="node-title" x="560" y="129" text-anchor="middle">神经元 h₁</text><text class="node-value" x="560" y="156" text-anchor="middle">激活 0.62</text>
        <text class="node-title" x="560" y="281" text-anchor="middle">神经元 h₂</text><text class="node-value" x="560" y="308" text-anchor="middle">激活 0.41</text>
        <text class="node-title" x="982" y="205" text-anchor="middle">预测 ŷ</text><text class="node-value" x="982" y="232" text-anchor="middle">0.71</text>
        <g class="weight"><text x="326" y="125">w₁</text><text x="326" y="303">w₂</text><text x="756" y="133">w₃</text><text x="756" y="307">w₄</text></g>
      </svg>
    </figure>

    <section class="lane" aria-label="反向过程">
      <div class="lane-end">参数 ← <span style="color:var(--attention)">调整信息</span></div>
      <div class="direction" aria-hidden="true"><div class="back-line"></div></div>
      <div class="lane-label" style="color:var(--attention);text-align:right">反向传播<small>分：该往哪边、改多少</small></div>
    </section>
  </main>

  <footer class="bottom min0">
    <div class="explain"><strong>返回的不是输入</strong><span>它携带的是每个参数对误差负了多少责任，以及下一步应怎样调整。</span></div>
    <div class="takeaway">反向传播不是把预测倒放，而是沿连接把误差的影响逐层分给参数。</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:16,total:22});</script>
</body>
</html>
