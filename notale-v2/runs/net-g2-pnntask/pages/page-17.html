<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:18px}.head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid color-mix(in srgb,var(--text) 22%,transparent);padding-bottom:14px}.head h1{font-size:var(--fs-h1);margin:0 0 6px}.head p{font-size:var(--fs-lead);margin:0;max-width:950px}.seed{font:var(--fs-label) var(--font-mono);padding:8px 12px;border:1px solid color-mix(in srgb,var(--text) 32%,transparent);border-radius:8px}.main{flex:1;display:grid;grid-template-columns:640px 1fr;gap:28px}.left,.right{display:flex;flex-direction:column;gap:14px}.section-title{font-size:var(--fs-h2);margin:0;display:flex;align-items:center;justify-content:space-between}.small{font-size:var(--fs-sec)}.plane{position:relative;flex:1;min-height:0;border:2px solid color-mix(in srgb,var(--text) 45%,transparent);border-radius:8px;background:linear-gradient(to right,transparent 19.8%,rgba(36,87,166,.12) 20%,transparent 20.2%),linear-gradient(to bottom,transparent 19.8%,rgba(36,87,166,.12) 20%,transparent 20.2%);background-size:20% 20%;overflow:hidden;touch-action:none}.plane canvas{position:absolute;inset:0;width:100%;height:100%}.axis{position:absolute;font-size:var(--fs-label);font-weight:700;pointer-events:none}.axis.x{right:14px;bottom:10px}.axis.y{left:12px;top:10px}.probe-read{display:flex;gap:18px;align-items:center;font:var(--fs-body) var(--font-mono)}.probe-read strong{color:var(--model)}.ranges{display:grid;grid-template-columns:28px 1fr 80px;gap:8px;align-items:center}.ranges label{font-size:var(--fs-label);font-weight:700}.ranges output{font:var(--fs-label) var(--font-mono)}.neurons{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.neuron{background:transparent;border:2px solid color-mix(in srgb,var(--text) 28%,transparent);border-radius:8px;padding:10px 8px;text-align:left;color:var(--text);font:700 var(--fs-label) var(--font-sans)}.neuron .bar{height:10px;margin-top:8px;background:color-mix(in srgb,var(--text) 12%,transparent);border-radius:5px;overflow:hidden}.neuron .fill{height:100%;background:var(--model)}.neuron[aria-pressed="true"]{border-color:var(--attention);box-shadow:inset 0 0 0 1px var(--attention)}.neuron .val{float:right;font-family:var(--font-mono);color:var(--model)}.map-wrap{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:16px;flex:1;min-height:0}.heat{position:relative;border:2px solid color-mix(in srgb,var(--text) 45%,transparent);border-radius:8px;overflow:hidden}.heat canvas{width:100%;height:100%;position:absolute;inset:0}.side-note{display:flex;flex-direction:column;gap:12px}.readbox{padding:14px;border-left:5px solid var(--model);background:color-mix(in srgb,var(--model) 8%,transparent);border-radius:0 8px 8px 0}.readbox .big{color:var(--model);display:block;margin-top:5px}.hint{margin:0}.conclusion{font:20px/1.45 var(--font-serif);margin:0;padding:13px 16px;border-top:1px solid color-mix(in srgb,var(--text) 25%,transparent)}.btn{margin-top:auto}.legend-line{display:flex;align-items:center;gap:8px;font-size:var(--fs-label)}.live-status{min-height:22px;font-size:var(--fs-label);color:var(--attention)}.swatch{width:28px;height:14px;background:linear-gradient(90deg,#f4f1e8,var(--model));border:1px solid var(--text)}
</style>
</head>
<body data-page="17" data-total="22">
<div id="stage">
  <header class="head"><div><h1>隐藏神经元看见什么？</h1><p>移动输入探针，观察同一个位置如何同时触发 10 个不同的隐藏响应。</p></div><span class="seed">2 → 10 → 1　固定种子 1</span></header>
  <main class="main min0">
    <section class="left min0" aria-labelledby="input-title">
      <h2 class="section-title" id="input-title">① 移动输入探针 <span class="small">拖动圆点，或用下方滑块</span></h2>
      <div id="plane" class="plane no-pan" role="application" tabindex="0" aria-label="输入平面，方向键移动探针"><canvas id="inputCv"></canvas><span class="axis y">输入 x₂ ↑</span><span class="axis x">输入 x₁ →</span></div>
      <div class="probe-read">当前位置 <strong id="xy">(0.25, 0.75)</strong><span>范围均为 0–1</span></div>
      <div class="ranges"><label for="rx">x₁</label><input id="rx" type="range" min="0" max="1" step="0.01" value="0.25"><output id="ox">0.25</output><label for="ry">x₂</label><input id="ry" type="range" min="0" max="1" step="0.01" value="0.75"><output id="oy">0.75</output></div>
    </section>
    <section class="right min0" aria-labelledby="response-title">
      <h2 class="section-title" id="response-title">② 比较隐藏层响应 <span class="small">选择 H1–H10 查看它的完整响应区域</span></h2>
      <div id="neurons" class="neurons" role="group" aria-label="选择隐藏神经元"></div>
      <div class="map-wrap min0">
        <div class="heat"><canvas id="heatCv" aria-label="所选神经元的 21 乘 21 响应区域"></canvas></div>
        <aside class="side-note">
          <div class="readbox"><span id="chosen">H1 当前激活</span><strong class="big" id="activation">0.00</strong><span class="small">0 表示弱响应，1 表示强响应</span></div>
          <div class="legend-line"><span class="swatch"></span><span>浅 → 深：激活 0 → 1</span></div>
          <p class="hint">蓝色十字对应左侧探针位置。响应区域按 21×21 个位置现场计算。</p>
          <p class="conclusion" id="conclusion">先移动探针：同一输入会被 10 个神经元以不同方式编码。</p>
          <button class="btn" id="reset" type="button">复位探针与选择</button>
        </aside>
      </div>
      <div id="live" class="live-status" aria-live="polite"></div>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
Deck.init({index:17,total:22});
(function(){
  const SPEC=Object.freeze({x:.25,y:.75,selected:0,grid:21,count:10,seed:'1'});
  const rng=new Math.seedrandom(SPEC.seed), weights=[], biases=[];
  for(let i=0;i<SPEC.count;i++){weights.push([(rng()*2-1)*6,(rng()*2-1)*6]);biases.push((rng()*2-1)*3)}
  const outW=Array.from({length:SPEC.count},()=>rng()*2-1), outB=rng()*2-1;
  function initialState(){return{x:SPEC.x,y:SPEC.y,selected:SPEC.selected,moved:false}}
  let state=initialState(), active=null, destroyed=false;
  const $=id=>document.getElementById(id), plane=$('plane'), inputCv=$('inputCv'), heatCv=$('heatCv');
  const events=new AbortController(), cleanups=[];
  function act(i,x,y){return Lec.P.neuronForward([x,y],weights[i],biases[i],'sigmoid').output}
  function transition(s,a){if(a.type==='move')return{...s,x:Deck.clamp(a.x,0,1),y:Deck.clamp(a.y,0,1),moved:true};if(a.type==='select')return{...s,selected:a.i};if(a.type==='reset')return initialState();return s}
  function dispatch(a){state=transition(state,a);render()}
  for(let i=0;i<SPEC.count;i++){const b=document.createElement('button');b.type='button';b.className='neuron';b.dataset.i=i;b.innerHTML=`H${i+1}<span class="val">0.00</span><div class="bar"><div class="fill"></div></div>`;$('neurons').appendChild(b);b.addEventListener('click',()=>dispatch({type:'select',i}),{signal:events.signal})}
  function drawInput(){const c=Deck.fit(inputCv),w=inputCv.offsetWidth,h=inputCv.offsetHeight;c.clearRect(0,0,w,h);const px=state.x*w,py=(1-state.y)*h;c.strokeStyle=Deck.token('--attention');c.lineWidth=3;c.beginPath();c.moveTo(px-18,py);c.lineTo(px+18,py);c.moveTo(px,py-18);c.lineTo(px,py+18);c.stroke();c.fillStyle=Deck.token('--attention');c.beginPath();c.arc(px,py,9,0,Math.PI*2);c.fill();c.strokeStyle=Deck.token('--text');c.lineWidth=2;c.stroke()}
  function drawHeat(){const c=Deck.fit(heatCv),w=heatCv.offsetWidth,h=heatCv.offsetHeight,n=SPEC.grid,cellW=w/n,cellH=h/n,base=Deck.rgb('--bg'),blue=Deck.rgb('--model');for(let iy=0;iy<n;iy++)for(let ix=0;ix<n;ix++){const v=act(state.selected,ix/(n-1),1-iy/(n-1));c.fillStyle=`rgb(${base.map((q,k)=>Math.round(q+(blue[k]-q)*v)).join(',')})`;c.fillRect(ix*cellW,iy*cellH,cellW+1,cellH+1)}const px=state.x*w,py=(1-state.y)*h;c.strokeStyle=Deck.token('--attention');c.lineWidth=4;c.beginPath();c.moveTo(px-13,py);c.lineTo(px+13,py);c.moveTo(px,py-13);c.lineTo(px,py+13);c.stroke();c.strokeStyle=Deck.token('--text');c.lineWidth=1;c.strokeRect(.5,.5,w-1,h-1)}
  function render(){const vals=weights.map((_,i)=>act(i,state.x,state.y));document.querySelectorAll('.neuron').forEach((b,i)=>{b.setAttribute('aria-pressed',i===state.selected);b.querySelector('.val').textContent=vals[i].toFixed(2);b.querySelector('.fill').style.width=(vals[i]*100).toFixed(1)+'%'});$('xy').textContent=`(${state.x.toFixed(2)}, ${state.y.toFixed(2)})`;$('rx').value=state.x;$('ry').value=state.y;$('ox').textContent=state.x.toFixed(2);$('oy').textContent=state.y.toFixed(2);$('chosen').textContent=`H${state.selected+1} 当前激活`;$('activation').textContent=vals[state.selected].toFixed(2);const output=Lec.P.neuronForward(vals,outW,outB,'sigmoid').output;$('conclusion').textContent=state.moved?`这个位置让 H${state.selected+1} 的响应为 ${vals[state.selected].toFixed(2)}；10 个响应再共同形成输出 ${output.toFixed(2)}。`:'先移动探针：同一输入会被 10 个神经元以不同方式编码。';drawInput();drawHeat()}
  function point(e){const p=Deck.pt(plane,e);return{x:p.x/plane.offsetWidth,y:1-p.y/plane.offsetHeight}}
  plane.addEventListener('pointerdown',e=>{if(active!==null)return;active=e.pointerId;plane.setPointerCapture(active);dispatch({type:'move',...point(e)})},{signal:events.signal});
  plane.addEventListener('pointermove',e=>{if(e.pointerId===active)dispatch({type:'move',...point(e)})},{signal:events.signal});
  const end=e=>{if(e.pointerId===active)active=null};plane.addEventListener('pointerup',end,{signal:events.signal});plane.addEventListener('pointercancel',end,{signal:events.signal});
  plane.addEventListener('keydown',e=>{let dx=0,dy=0;if(e.key==='ArrowRight')dx=.02;if(e.key==='ArrowLeft')dx=-.02;if(e.key==='ArrowUp')dy=.02;if(e.key==='ArrowDown')dy=-.02;if(!dx&&!dy)return;e.preventDefault();e.stopPropagation();dispatch({type:'move',x:state.x+dx,y:state.y+dy})},{signal:events.signal});
  $('rx').addEventListener('input',e=>dispatch({type:'move',x:+e.target.value,y:state.y}),{signal:events.signal});$('ry').addEventListener('input',e=>dispatch({type:'move',x:state.x,y:+e.target.value}),{signal:events.signal});
  $('reset').addEventListener('click',()=>{active=null;dispatch({type:'reset'});$('rx').focus();$('live').textContent='已复位到探针 0.25，0.75，并选择 H1。'},{signal:events.signal});
  cleanups.push(Deck.onResize(render));render();
  function destroy(){if(destroyed)return;destroyed=true;events.abort();active=null;while(cleanups.length)cleanups.pop()()}
  window.addEventListener('pagehide',destroy,{once:true});
})();
</script>
</body></html>
