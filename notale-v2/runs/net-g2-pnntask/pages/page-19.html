<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
h1{font-size:var(--fs-h1);margin:0 0 6px;line-height:1.15}
.lead{margin:0;max-width:980px}.setup{font-family:var(--font-mono);font-size:var(--fs-label);white-space:nowrap;color:color-mix(in srgb,var(--text) 72%,transparent)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:12px 16px;border-block:1px solid color-mix(in srgb,var(--text) 22%,transparent)}
.controls{display:flex;align-items:center;gap:10px}.btn{min-height:44px}.btn[aria-pressed="true"]{border-color:var(--attention);box-shadow:inset 0 -3px 0 var(--attention)}
.status{display:flex;align-items:baseline;gap:12px}.epoch{font-family:var(--font-mono);font-size:26px;font-weight:700;color:var(--model)}
.compare{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;flex:1;min-height:0}
.model{display:flex;flex-direction:column;min-width:0;min-height:0;border:2px solid color-mix(in srgb,var(--text) 23%,transparent);border-radius:8px;background:color-mix(in srgb,#fff 48%,transparent);transition:opacity .18s,border-color .18s}
.model.focused{border-color:var(--attention)}.compare.has-focus .model:not(.focused){opacity:.38}
.model-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 9px}.model h2{margin:0;font-size:var(--fs-h2)}
.arch{font-family:var(--font-mono);font-size:var(--fs-label);color:var(--model)}
.plot{position:relative;flex:1;min-height:0;margin:0 14px;border:1px solid color-mix(in srgb,var(--text) 28%,transparent);border-radius:6px;overflow:hidden;background:#f8f6ef}
.plot canvas{position:absolute;inset:0;width:100%;height:100%}
.axis-note{position:absolute;right:8px;bottom:6px;padding:2px 5px;background:rgba(244,241,232,.82);font-size:var(--fs-tick);pointer-events:none}
.metrics{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 12px;font-size:var(--fs-label)}
.metric strong{font-family:var(--font-mono);font-size:20px;color:var(--model)}
.focus-btn{min-height:38px;padding:5px 11px;background:transparent;border:2px solid color-mix(in srgb,var(--text) 28%,transparent);border-radius:8px;font:inherit;font-size:var(--fs-label);cursor:pointer}.focus-btn[aria-pressed="true"]{border-color:var(--attention);color:var(--attention);font-weight:700}
.takeaway{display:flex;align-items:center;gap:14px;margin:0;padding:13px 16px;border-left:5px solid var(--attention);font-family:var(--font-serif);font-size:var(--fs-lead);line-height:1.4;background:color-mix(in srgb,var(--attention) 8%,transparent)}
.takeaway .tag{font-family:var(--font-sans);flex:none}
@media (prefers-reduced-motion:reduce){.model{transition:none}}
</style>
</head>
<body data-page="19" data-total="22">
<div id="stage">
  <header>
    <div><h1>三种深度，同场对照</h1><p class="lead">启动同步训练，比较三张图里的边界如何弯曲，以及验证准确率怎样变化。</p></div>
    <div class="setup">200 样本 · 种子 1 · η 0.3 · 批量 16 · 阈值 0.5</div>
  </header>
  <section class="toolbar" aria-label="训练控制">
    <div class="controls">
      <button class="btn" id="run" type="button" aria-pressed="false">▶ 开始同步训练</button>
      <button class="btn" id="step" type="button">训练 1 轮</button>
      <button class="btn" id="reset" type="button">↺ 复位</button>
    </div>
    <div class="status"><span class="tag" id="mode">已暂停</span><span class="epoch">轮次 <span id="epoch">0</span></span><span class="hint" id="live" aria-live="polite">三组网络使用同一批样本。</span></div>
  </section>
  <main class="compare min0" id="compare">
    <article class="model" data-i="0"><div class="model-head"><h2>无隐藏层</h2><span class="arch">2–1</span></div><div class="plot"><canvas aria-label="2–1 网络的分类边界"></canvas><span class="axis-note">同尺度 x₁ × x₂</span></div><div class="metrics"><span class="metric">验证准确率 <strong>—</strong></span><button class="focus-btn" type="button" aria-pressed="false">突出此列</button></div></article>
    <article class="model" data-i="1"><div class="model-head"><h2>一层组合</h2><span class="arch">2–10–1</span></div><div class="plot"><canvas aria-label="2–10–1 网络的分类边界"></canvas><span class="axis-note">同尺度 x₁ × x₂</span></div><div class="metrics"><span class="metric">验证准确率 <strong>—</strong></span><button class="focus-btn" type="button" aria-pressed="false">突出此列</button></div></article>
    <article class="model" data-i="2"><div class="model-head"><h2>两层组合</h2><span class="arch">2–10–10–1</span></div><div class="plot"><canvas aria-label="2–10–10–1 网络的分类边界"></canvas><span class="axis-note">同尺度 x₁ × x₂</span></div><div class="metrics"><span class="metric">验证准确率 <strong>—</strong></span><button class="focus-btn" type="button" aria-pressed="false">突出此列</button></div></article>
  </main>
  <p class="takeaway"><span class="tag">观察结论</span><span id="conclusion">先看初始边界：三种网络都还没有从样本中学到分类规律。</span></p>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/lib/mlp.js"></script>
<script>
(function(){
'use strict';
Deck.init({index:19,total:22});
const cards=[...document.querySelectorAll('.model')], canvases=cards.map(c=>c.querySelector('canvas'));
const sizes=[[2,1],[2,10,1],[2,10,10,1]], runBtn=document.getElementById('run'), stepBtn=document.getElementById('step'), resetBtn=document.getElementById('reset');
const events=new AbortController(), cleanups=[]; let raf=0,last=0,destroyed=false;
function samples(){
  const rng=new Math.seedrandom('1'), out=[];
  for(let i=0;i<100;i++){
    const a=Math.PI*rng(), n=()=> (rng()-.5)*.17;
    out.push({x:[-.15+.82*Math.cos(a)+n(), .20+.82*Math.sin(a)+n()],t:0});
    out.push({x:[.15-.82*Math.cos(a)+n(),-.20-.82*Math.sin(a)+n()],t:1});
  }
  return out;
}
const data=samples(), trainSet=data.filter((_,i)=>i%5!==0), valid=data.filter((_,i)=>i%5===0);
function initialState(){return {running:false,epoch:0,focus:-1,nets:sizes.map(s=>MLP.create({sizes:s,act:'tanh',lr:.3,seed:1}))};}
let state=initialState();
function fitCanvas(cv){const r=cv.getBoundingClientRect(),w=Math.max(1,cv.clientWidth),h=Math.max(1,cv.clientHeight),d=window.devicePixelRatio||1;cv.width=Math.round(w*d);cv.height=Math.round(h*d);const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);return {x,w,h};}
function drawOne(i){
  const {x:ctx,w,h}=fitCanvas(canvases[i]), net=state.nets[i], cols=42,rows=42, field=net.field(-1.25,-1.25,1.25,1.25,cols,rows);
  ctx.clearRect(0,0,w,h); const cw=w/cols,ch=h/rows;
  for(let y=0;y<rows;y++)for(let xx=0;xx<cols;xx++){const p=field[y*cols+xx];ctx.fillStyle=p>=.5?'rgba(36,87,166,'+(0.08+Math.abs(p-.5)*.38)+')':'rgba(231,111,46,'+(0.08+Math.abs(p-.5)*.30)+')';ctx.fillRect(xx*cw,y*ch,cw+1,ch+1)}
  ctx.strokeStyle='rgba(39,43,52,.19)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
  data.forEach(p=>{const px=(p.x[0]+1.25)/2.5*w,py=h-(p.x[1]+1.25)/2.5*h;ctx.beginPath();ctx.arc(px,py,3.6,0,Math.PI*2);ctx.fillStyle=p.t?'#2457A6':'#F4F1E8';ctx.fill();ctx.strokeStyle=p.t?'#173b73':'#9b451e';ctx.lineWidth=1.4;ctx.stroke()});
}
function render(announce){
  document.getElementById('epoch').textContent=state.epoch; document.getElementById('mode').textContent=state.running?'训练中':'已暂停';
  runBtn.textContent=state.running?'❚❚ 暂停训练':'▶ 开始同步训练';runBtn.setAttribute('aria-pressed',String(state.running));
  document.getElementById('compare').classList.toggle('has-focus',state.focus>=0);
  state.nets.forEach((n,i)=>{drawOne(i);const ev=n.evaluate(valid);cards[i].querySelector('strong').textContent=(ev.acc*100).toFixed(1)+'%';cards[i].classList.toggle('focused',state.focus===i);const b=cards[i].querySelector('.focus-btn');b.setAttribute('aria-pressed',String(state.focus===i));b.textContent=state.focus===i?'显示全部':'突出此列'});
  const c=document.getElementById('conclusion');
  c.textContent=state.epoch===0?'先看初始边界：三种网络都还没有从样本中学到分类规律。':state.epoch<40?'边界正在变化：隐藏层可以把多个简单切分组合成弯曲边界。':'隐藏层让弯曲边界成为可能；但这一次的准确率不能证明“越深越好”。';
  if(announce)document.getElementById('live').textContent=announce;
}
function trainRounds(rounds){for(let r=0;r<rounds;r++){state.nets.forEach(n=>n.step(trainSet,16));state.epoch++;}}
function tick(t){if(!state.running||destroyed)return;if(t-last>70){trainRounds(2);render();last=t;if(state.epoch>=160){state.running=false;render('已训练 160 轮并自动暂停。');return}}raf=requestAnimationFrame(tick)}
function setRunning(v){cancelAnimationFrame(raf);state.running=v;render(v?'同步训练已开始。':'训练已暂停，可比较三列。');if(v){last=0;raf=requestAnimationFrame(tick)}}
runBtn.addEventListener('click',()=>setRunning(!state.running),{signal:events.signal});
stepBtn.addEventListener('click',()=>{setRunning(false);trainRounds(1);render('已同步训练 1 轮。');},{signal:events.signal});
resetBtn.addEventListener('click',()=>{cancelAnimationFrame(raf);state=initialState();render('已复位到种子 1 的初始状态。');runBtn.focus();},{signal:events.signal});
cards.forEach((c,i)=>c.querySelector('.focus-btn').addEventListener('click',()=>{state.focus=state.focus===i?-1:i;render(state.focus<0?'已恢复三列对照。':'已突出'+c.querySelector('h2').textContent+'。');},{signal:events.signal}));
cleanups.push(Deck.onResize(()=>render()));
function destroy(){if(destroyed)return;destroyed=true;cancelAnimationFrame(raf);events.abort();while(cleanups.length)cleanups.pop()();}
window.addEventListener('pagehide',destroy,{once:true});render();
})();
</script>
</body>
</html>
