<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="22" data-total="22">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;gap:18px;overflow:hidden}
    .p22-head{height:92px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid color-mix(in srgb,var(--text) 22%,transparent);padding-bottom:16px}
    .p22-head h1{margin:0;font-size:var(--fs-h1);line-height:1.2;font-weight:750;letter-spacing:.01em}
    .p22-head .eyebrow{font-size:var(--fs-label);font-family:var(--font-mono);letter-spacing:.12em;color:color-mix(in srgb,var(--text) 62%,transparent);margin-bottom:7px}
    .p22-main{position:relative;flex:1;min-height:0;overflow:hidden}
    .cycle{position:absolute;inset:8px 20px 0;}
    .cycle svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
    .route{fill:none;stroke:color-mix(in srgb,var(--text) 34%,transparent);stroke-width:3}
    .arrow{fill:color-mix(in srgb,var(--text) 72%,transparent)}
    .step{position:absolute;width:252px;min-height:126px;box-sizing:border-box;padding:19px 20px 17px;background:var(--bg);border-top:3px solid color-mix(in srgb,var(--text) 54%,transparent)}
    .step .n{font:600 var(--fs-label)/1 var(--font-mono);color:color-mix(in srgb,var(--text) 58%,transparent);margin-bottom:10px}
    .step h2{font-size:var(--fs-h2);line-height:1.2;margin:0 0 7px;font-weight:720}
    .step p{font-size:var(--fs-sec);line-height:1.42;margin:0;color:color-mix(in srgb,var(--text) 74%,transparent)}
    .s1{left:56px;top:54px}.s2{left:586px;top:16px}.s3{right:56px;top:54px}.s4{right:224px;bottom:34px}.s5{left:224px;bottom:34px}
    .s1 h2,.s5 h2{color:var(--model)}
    .center-claim{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:590px;text-align:center;padding:28px 38px;border-left:4px solid var(--attention);border-right:4px solid var(--attention);background:color-mix(in srgb,var(--bg) 94%,var(--attention));box-sizing:border-box}
    .center-claim strong{display:block;font-family:var(--font-serif);font-size:32px;line-height:1.35;font-weight:700}
    .center-claim span{display:block;margin-top:13px;font-size:var(--fs-body);line-height:1.45;color:color-mix(in srgb,var(--text) 76%,transparent)}
    .goal{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;font-size:var(--fs-lead);font-weight:700;white-space:nowrap}
    .goal:before,.goal:after{content:"";width:74px;height:2px;background:var(--attention)}
    .goal b{color:var(--attention)}
  </style>
  <header class="p22-head">
    <div>
      <div class="eyebrow">全课收束 · 一个闭环</div>
      <h1>学习，就是修正参数</h1>
    </div>
  </header>
  <main class="p22-main min0" aria-label="神经网络学习闭环">
    <section class="cycle" aria-describedby="cycle-summary">
      <svg viewBox="0 0 1448 710" aria-hidden="true">
        <path class="route" d="M290 112 C470 30 910 18 1160 112"/>
        <polygon class="arrow" points="1128,94 1168,109 1136,134"/>
        <path class="route" d="M1262 168 C1375 260 1350 470 1168 566"/>
        <polygon class="arrow" points="1181,533 1157,572 1202,567"/>
        <path class="route" d="M1030 631 C820 694 612 694 405 631"/>
        <polygon class="arrow" points="438,614 396,628 430,655"/>
        <path class="route" d="M276 566 C98 466 75 258 186 168"/>
        <polygon class="arrow" points="173,203 194,160 150,170"/>
      </svg>
      <article class="step s1"><div class="n">01</div><h2>预测</h2><p>输入经过当前参数，得到一次输出。</p></article>
      <article class="step s2"><div class="n">02</div><h2>量误差</h2><p>把预测与目标的差距压成一个数。</p></article>
      <article class="step s3"><div class="n">03</div><h2>传回影响</h2><p>逐层算清各个参数对误差的影响。</p></article>
      <article class="step s4"><div class="n">04</div><h2>修正参数</h2><p>让参数朝误差更小的方向移动一步。</p></article>
      <article class="step s5"><div class="n">05</div><h2>再预测</h2><p>用更新后的参数重新计算，再比较。</p></article>
      <div class="center-claim" id="cycle-summary">
        <strong>神经网络的“学习”，<br>就是反复用误差修正参数。</strong>
        <span>不是获得意识，而是在同一个闭环里一次次调整。</span>
      </div>
      <div class="goal">每转一圈，都以<b>误差更小</b>为目标</div>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
