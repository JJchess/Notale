<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="02" data-total="22">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;gap:0}
    .p02-head{height:108px;flex:none;display:flex;flex-direction:column;justify-content:flex-start}
    .p02-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.16em;color:var(--model);margin-bottom:14px}
    .p02-head h1{font:700 var(--fs-h1)/1.18 var(--font-sans);margin:0;color:var(--text)}
    .p02-main{flex:1;min-height:0;display:flex;flex-direction:column}
    .p02-process{position:relative;flex:1;min-height:0;padding:34px 0 76px}
    .p02-axis{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible}
    .p02-cards{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;height:100%;align-items:stretch}
    .p02-card{display:flex;flex-direction:column;min-width:0;padding:22px 22px 20px;background:var(--bg);box-sizing:border-box}
    .p02-card.panel.q{border-top:3px solid color-mix(in srgb,var(--text) 28%,transparent)}
    .p02-cardhead{display:flex;align-items:center;gap:13px;margin-bottom:12px}
    .p02-card .tag{flex:none}
    .p02-card h2{font:700 var(--fs-h2)/1.2 var(--font-sans);margin:0;color:var(--text)}
    .p02-card p{font:400 var(--fs-body)/1.45 var(--font-sans);margin:0;color:var(--text)}
    .p02-symbol{flex:1;min-height:150px;margin-top:18px;display:flex;align-items:center;justify-content:center}
    .p02-symbol svg{width:100%;height:100%;max-height:210px;overflow:visible}
    .p02-svgtext{font:600 16px var(--font-sans);fill:var(--text)}
    .p02-small{font:500 14px var(--font-sans);fill:var(--text)}
    .p02-num{font:700 18px var(--font-mono);fill:var(--model)}
    .p02-readout{fill:var(--bg);stroke:var(--model);stroke-width:2}
    .p02-structure{fill:none;stroke:var(--text);stroke-width:2}
    .p02-forward{fill:none;stroke:var(--model);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .p02-attn{fill:var(--attention);stroke:var(--attention)}
    .p02-loopnote{position:absolute;z-index:2;left:50%;bottom:24px;transform:translateX(-50%);font:600 var(--fs-label)/1.2 var(--font-sans);background:var(--bg);padding:0 14px;color:var(--text)}
    .p02-close{height:126px;flex:none;border-top:1px solid color-mix(in srgb,var(--text) 25%,transparent);display:flex;align-items:center;justify-content:space-between;gap:44px}
    .p02-claim{font:600 var(--fs-lead)/1.45 var(--font-serif);margin:0;max-width:900px;color:var(--text)}
    .p02-next{font:600 var(--fs-sec)/1.4 var(--font-sans);margin:0;max-width:450px;padding-left:22px;border-left:3px solid var(--attention);color:var(--text)}
  </style>

  <header class="p02-head">
    <div class="p02-kicker">LEARNING LOOP</div>
    <h1>神经网络的“学习”，只追踪四个动作</h1>
  </header>

  <main class="p02-main min0">
    <section class="p02-process k-process min0" aria-label="神经网络学习的四步循环">
      <svg class="p02-axis" viewBox="0 0 1488 610" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <marker id="p02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2457A6"/></marker>
          <marker id="p02-looparrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="currentColor"/></marker>
        </defs>
        <path d="M340 280 H405" stroke="#2457A6" stroke-width="4" fill="none" marker-end="url(#p02-arrow)"/>
        <path d="M712 280 H777" stroke="#2457A6" stroke-width="4" fill="none" marker-end="url(#p02-arrow)"/>
        <path d="M1084 280 H1149" stroke="#2457A6" stroke-width="4" fill="none" marker-end="url(#p02-arrow)"/>
        <path d="M1320 456 V544 H168 V456" stroke="currentColor" stroke-width="2" fill="none" marker-end="url(#p02-looparrow)"/>
        <text x="1160" y="532" text-anchor="middle" font-size="16" font-family="sans-serif" fill="currentColor">重复</text>
      </svg>

      <div class="stage-cards p02-cards">
        <article class="panel q p02-card min0">
          <div class="p02-cardhead"><span class="tag">1</span><h2>预测</h2></div>
          <p>用当前参数算出一个结果</p>
          <div class="p02-symbol">
            <svg viewBox="0 0 280 180" role="img" aria-label="输入读数经过计算得到输出读数">
              <rect class="p02-readout" x="8" y="62" width="82" height="56" rx="8"/><text class="p02-small" x="49" y="53" text-anchor="middle">输入</text><text class="p02-num" x="49" y="97" text-anchor="middle">x</text>
              <path class="p02-forward" d="M98 90H176"/><path d="M176 90l-12-8v16z" fill="var(--model)"/>
              <rect class="p02-readout" x="186" y="62" width="86" height="56" rx="8"/><text class="p02-small" x="229" y="53" text-anchor="middle">输出</text><text class="p02-num" x="229" y="97" text-anchor="middle">ŷ</text>
            </svg>
          </div>
        </article>

        <article class="panel q p02-card min0">
          <div class="p02-cardhead"><span class="tag">2</span><h2>量误差</h2></div>
          <p>把预测和目标比较，得到“差多远”</p>
          <div class="p02-symbol">
            <svg viewBox="0 0 280 180" role="img" aria-label="预测值与目标之间有一段可测量的距离">
              <line class="p02-structure" x1="38" y1="100" x2="246" y2="100"/>
              <g stroke="var(--text)"><line x1="48" y1="91" x2="48" y2="109"/><line x1="88" y1="95" x2="88" y2="105"/><line x1="128" y1="95" x2="128" y2="105"/><line x1="168" y1="95" x2="168" y2="105"/><line x1="208" y1="95" x2="208" y2="105"/><line x1="238" y1="91" x2="238" y2="109"/></g>
              <circle cx="76" cy="100" r="10" fill="var(--model)"/><text class="p02-small" x="76" y="72" text-anchor="middle">预测</text>
              <circle cx="210" cy="100" r="14" fill="none" stroke="var(--text)" stroke-width="2"/><circle cx="210" cy="100" r="4" fill="var(--text)"/><text class="p02-small" x="210" y="72" text-anchor="middle">目标</text>
              <path d="M88 132H198M88 126v12M198 126v12" stroke="var(--attention)" stroke-width="3" fill="none"/><text x="143" y="159" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="700" fill="var(--attention)">误差距离</text>
            </svg>
          </div>
        </article>

        <article class="panel q p02-card min0">
          <div class="p02-cardhead"><span class="tag">3</span><h2>找方向</h2></div>
          <p>判断参数往哪边动，误差会更小</p>
          <div class="p02-symbol">
            <svg viewBox="0 0 280 180" role="img" aria-label="旋钮向右转时误差更小">
              <path class="p02-structure" d="M46 128A100 100 0 0 1 234 128"/>
              <g stroke="var(--text)" stroke-width="2"><line x1="55" y1="123" x2="45" y2="119"/><line x1="82" y1="73" x2="74" y2="65"/><line x1="140" y1="52" x2="140" y2="40"/><line x1="198" y1="73" x2="206" y2="65"/><line x1="225" y1="123" x2="235" y2="119"/></g>
              <circle cx="140" cy="116" r="47" fill="var(--bg)" stroke="var(--text)" stroke-width="2"/><line x1="140" y1="116" x2="177" y2="91" stroke="var(--attention)" stroke-width="5" stroke-linecap="round"/>
              <path d="M180 47Q215 59 229 88" fill="none" stroke="var(--attention)" stroke-width="3"/><path d="M229 88l-2-12-10 7z" fill="var(--attention)"/>
              <text class="p02-small" x="43" y="153">误差大</text><text x="188" y="153" font-size="14" font-family="sans-serif" font-weight="700" fill="var(--attention)">误差小</text>
            </svg>
          </div>
        </article>

        <article class="panel q p02-card min0">
          <div class="p02-cardhead"><span class="tag">4</span><h2>改参数</h2></div>
          <p>让参数沿这个方向移动一步</p>
          <div class="p02-symbol">
            <svg viewBox="0 0 280 180" role="img" aria-label="参数旋钮从旧刻度移动到相邻新刻度">
              <path class="p02-structure" d="M46 128A100 100 0 0 1 234 128"/>
              <g stroke="var(--text)" stroke-width="2"><line x1="55" y1="123" x2="45" y2="119"/><line x1="82" y1="73" x2="74" y2="65"/><line x1="140" y1="52" x2="140" y2="40"/><line x1="198" y1="73" x2="206" y2="65"/><line x1="225" y1="123" x2="235" y2="119"/></g>
              <circle cx="140" cy="116" r="47" fill="var(--bg)" stroke="var(--text)" stroke-width="2"/><line x1="140" y1="116" x2="140" y2="76" stroke="var(--text)" stroke-width="3" stroke-dasharray="5 5"/><line x1="140" y1="116" x2="177" y2="91" stroke="var(--attention)" stroke-width="5" stroke-linecap="round"/>
              <path d="M148 68Q166 67 180 80" fill="none" stroke="var(--attention)" stroke-width="3"/><path d="M180 80l-4-11-9 9z" fill="var(--attention)"/>
              <text class="p02-small" x="82" y="62">旧位置</text><text x="194" y="72" font-size="14" font-family="sans-serif" font-weight="700" fill="var(--attention)">新</text>
            </svg>
          </div>
        </article>
      </div>
      <div class="p02-loopnote">用新参数再来一轮</div>
    </section>
  </main>

  <footer class="p02-close">
    <p class="p02-claim">先预测，再量误差；找到让误差变小的方向，然后改动参数。</p>
    <p class="p02-next">第一步“预测”，一个神经元究竟拿什么来算？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
