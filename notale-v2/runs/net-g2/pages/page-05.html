<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{gap:20px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
  .kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--attention);margin-bottom:10px}
  h1{font:700 var(--fs-h1)/1.2 var(--font-sans);margin:0;max-width:1040px}
  .fixed-tag{white-space:nowrap;margin-bottom:5px}
  .work{flex:1;display:flex;flex-direction:column;gap:18px;min-height:0}
  .setup{display:grid;grid-template-columns:1.05fr 1.55fr;gap:28px;align-items:stretch}
  .given{display:flex;align-items:center;gap:24px;padding:20px 26px}
  .fact{display:flex;align-items:baseline;gap:10px}
  .fact .sym{font:600 var(--fs-label)/1.2 var(--font-sans);color:#565b62}
  .fact strong{font:700 30px/1 var(--font-mono);color:var(--model)}
  .lock{font:600 var(--fs-label)/1 var(--font-sans);padding:6px 10px;border:1px solid #9a9a91;border-radius:999px}
  .control{padding:16px 22px;display:grid;grid-template-columns:1fr auto;gap:8px 22px;align-items:center}
  .control label{font:700 var(--fs-body)/1.2 var(--font-sans)}
  .bias-read{font:700 28px/1 var(--font-mono);color:var(--attention);min-width:92px;text-align:right}
  .control input{grid-column:1/-1;width:100%;accent-color:var(--attention)}
  .ends{grid-column:1/-1;display:flex;justify-content:space-between;font:500 var(--fs-tick)/1 var(--font-mono);color:#64666b}
  .ctl-foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px}
  .hint{margin:0}
  .compare{flex:1;min-height:0;padding:18px 26px 14px;display:flex;flex-direction:column}
  .compare-top{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:8px}
  .equation{font:600 var(--fs-h2)/1.2 var(--font-mono)}
  .equation .b,.equation .z{color:var(--attention)}
  .readout{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
  .readout span{font:600 var(--fs-label)/1.2 var(--font-sans)}
  .readout strong{font:700 32px/1 var(--font-mono);color:var(--model)}
  svg{width:100%;flex:1;min-height:300px;display:block;overflow:visible}
  .axis{stroke:#45494f;stroke-width:2}.guide{stroke:#aaa89e;stroke-width:1;stroke-dasharray:5 7}.sample-line{stroke:var(--model);stroke-width:2}.threshold{stroke:var(--attention);stroke-width:4}.base-threshold{stroke:#5e6268;stroke-width:3}.move-link{stroke:var(--attention);stroke-width:2;stroke-dasharray:7 6;fill:none}
  .svg-label{font:600 16px var(--font-sans);fill:var(--text)}.svg-small{font:500 15px var(--font-sans);fill:#555960}.svg-num{font:600 13px var(--font-mono);fill:#555960}.svg-blue{fill:var(--model)}.svg-orange{fill:var(--attention)}
  .live-status{min-height:22px;margin-top:4px;font:500 var(--fs-sec)/1.35 var(--font-sans);color:#555960}
  .conclusion{display:flex;justify-content:space-between;align-items:center;gap:40px;padding:0 4px}
  .conclusion p{margin:0}.take{font:600 var(--fs-lead)/1.4 var(--font-serif);max-width:970px}.next{font:600 var(--fs-sec)/1.4 var(--font-sans);max-width:430px;text-align:right;color:#4d525a}
  @media (prefers-reduced-motion:reduce){.threshold{transition:none!important}}
</style>
</head>
<body data-page="05" data-total="22">
<div id="stage">
  <header class="head">
    <div><div class="kicker">BIAS · 偏置</div><h1>输入没变，偏置把响应门槛整体平移</h1></div>
    <span class="tag fixed-tag">输入未变</span>
  </header>

  <main class="work split-tb min0">
    <section class="setup">
      <div class="panel given min0" aria-label="固定条件">
        <div class="fact"><span class="sym">输入 x</span><strong>0.8</strong></div>
        <div class="fact"><span class="sym">权重 w</span><strong>0.5</strong></div>
        <span class="lock">锁定</span>
      </div>
      <div class="panel control min0">
        <label for="bias">拖动偏置尺，观察门槛往哪边移</label>
        <output id="biasVal" class="bias-read" for="bias">−0.2</output>
        <input id="bias" type="range" min="-0.4" max="0.4" step="0.1" value="-0.2" aria-describedby="biasHint">
        <div class="ends"><span>−0.4</span><span>0</span><span>+0.4</span></div>
        <div class="ctl-foot"><p id="biasHint" class="hint">方向键每次移动 0.1；输入标记始终停在 0.8。</p><button id="reset" class="btn" type="button">回到 −0.2</button></div>
      </div>
    </section>

    <section class="compare panel k-comparison min0" aria-labelledby="compareTitle">
      <div class="compare-top">
        <div><div id="compareTitle" class="kicker">同一条 0–1 输入刻度</div><div class="equation">0.8 × 0.5 + <span class="b">b</span> = <span class="z">z</span></div></div>
        <div class="readout"><span>当前加权总和 z</span><strong id="zVal">0.2</strong></div>
      </div>
      <svg id="scale" viewBox="0 0 1360 330" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">偏置为零与当前偏置的门槛位置比较</title>
        <desc id="svgDesc">两行共用零到一输入尺度，输入都固定在零点八。当前偏置改变时，第二行门槛移动。</desc>
        <line class="guide" x1="300" y1="62" x2="300" y2="280"/><line class="guide" x1="1260" y1="62" x2="1260" y2="280"/>
        <text class="svg-num" x="300" y="315" text-anchor="middle">0</text><text class="svg-num" x="780" y="315" text-anchor="middle">0.5</text><text class="svg-num" x="1260" y="315" text-anchor="middle">1.0</text>
        <text class="svg-label" x="24" y="105">偏置为 0</text><text class="svg-small" x="24" y="130">b = 0.0</text>
        <line class="axis" x1="300" y1="112" x2="1260" y2="112"/><line class="base-threshold" x1="300" y1="79" x2="300" y2="145"/><text class="svg-small" x="310" y="75">门槛 x = 0.0</text>
        <line class="sample-line" x1="1068" y1="88" x2="1068" y2="136"/><circle cx="1068" cy="112" r="8" fill="var(--model)"/><text class="svg-small svg-blue" x="1068" y="158" text-anchor="middle">输入仍是 0.8</text>
        <text class="svg-label" x="24" y="235">当前偏置</text><text id="rowBias" class="svg-small svg-orange" x="24" y="260">b = −0.2</text>
        <line class="axis" x1="300" y1="242" x2="1260" y2="242"/><line id="threshold" class="threshold" x1="684" y1="209" x2="684" y2="275"/><text id="thresholdText" class="svg-small svg-orange" x="684" y="202" text-anchor="middle">门槛 x = 0.4</text>
        <line class="sample-line" x1="1068" y1="218" x2="1068" y2="266"/><circle cx="1068" cy="242" r="8" fill="var(--model)"/><text class="svg-small svg-blue" x="1068" y="288" text-anchor="middle">输入仍是 0.8</text>
        <path id="moveLink" class="move-link" d="M300 160 C400 180 580 178 684 205"/><text id="moveText" class="svg-small svg-orange" x="492" y="177" text-anchor="middle">门槛向右移 0.4</text>
      </svg>
      <p class="note">门槛：加权总和刚好为 0 的输入位置。超出 0–1 时，游标会贴边并标出真实数值。</p>
      <div id="status" class="live-status" aria-live="polite">拖动后，这里会同时报告偏置、加权总和与门槛位置。</div>
    </section>
  </main>
  <footer class="conclusion"><p class="take">偏置是另一只可调旋钮：它不改输入，只给加权结果整体加上或减去一个数。</p><p class="next">得到加权总和之后，神经元怎样把它变成 0–1 的输出？</p></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  Deck.init({index:5,total:22});
  const pageK = (Lec.K && (Lec.K.p05 || Lec.K.bias)) || {};
  const X = pageK.x ?? 0.8, W = pageK.w ?? 0.5, INITIAL = pageK.initialBias ?? -0.2;
  const $ = id => document.getElementById(id);
  const els = {range:$('bias'), bias:$('biasVal'), z:$('zVal'), rowBias:$('rowBias'), line:$('threshold'), text:$('thresholdText'), link:$('moveLink'), move:$('moveText'), status:$('status'), reset:$('reset')};
  const events = new AbortController();
  let raf = 0, destroyed = false;
  const initialState = () => ({bias:INITIAL, shownThreshold:-INITIAL/W, acted:false});
  let state = initialState();
  const signed = v => (v < 0 ? '−' : v > 0 ? '+' : '') + Math.abs(v).toFixed(1);
  const axisX = v => 300 + Math.max(0, Math.min(1, v)) * 960;
  function weightedSum(b){ return Lec.P.weightedSum([X],[W],b); }
  function render(s, announce=true){
    const threshold = -s.bias/W;
    const z = weightedSum(s.bias);
    els.range.value = s.bias.toFixed(1);
    els.bias.textContent = signed(s.bias);
    els.z.textContent = Number(z).toFixed(1);
    els.rowBias.textContent = `b = ${signed(s.bias)}`;
    const target = axisX(threshold), start = axisX(s.shownThreshold);
    cancelAnimationFrame(raf);
    const duration = (Deck.reduced() || !s.acted) ? 0 : 160;
    const begin = performance.now();
    const draw = now => {
      const t = duration ? Math.min(1,(now-begin)/duration) : 1;
      const ease = 1-Math.pow(1-t,3), px = start+(target-start)*ease;
      els.line.setAttribute('x1',px); els.line.setAttribute('x2',px);
      els.text.setAttribute('x',px);
      els.link.setAttribute('d',`M300 160 C${300+(px-300)*.3} 180 ${300+(px-300)*.72} 178 ${px} 205`);
      if(t<1) raf=requestAnimationFrame(draw);
    };
    draw(begin+duration);
    const edge = threshold < 0 ? ' ←' : threshold > 1 ? ' →' : '';
    els.text.textContent = `门槛 x = ${threshold.toFixed(1)}${edge}`;
    els.text.setAttribute('text-anchor',threshold<0?'start':threshold>1?'end':'middle');
    const delta = threshold;
    els.move.textContent = Math.abs(delta)<.001 ? '两道门槛重合' : `门槛向${delta>0?'右':'左'}移 ${Math.abs(delta).toFixed(1)}`;
    els.move.setAttribute('x',(300+target)/2);
    if(announce) els.status.textContent = `偏置 ${signed(s.bias)}，加权总和 ${Number(z).toFixed(1)}，门槛在输入 ${threshold.toFixed(1)}。输入仍为 0.8。`;
    state = {...s, shownThreshold:threshold};
  }
  function setBias(value){
    const b = Math.max(-0.4,Math.min(0.4,Math.round(value*10)/10));
    render({...state,bias:b,acted:true});
  }
  els.range.addEventListener('input',e=>setBias(Number(e.target.value)),{signal:events.signal});
  els.reset.addEventListener('click',()=>{ cancelAnimationFrame(raf); state=initialState(); render(state); els.range.focus(); els.status.textContent='已回到偏置负零点二。'; },{signal:events.signal});
  function destroy(){ if(destroyed)return; destroyed=true; cancelAnimationFrame(raf); events.abort(); }
  window.addEventListener('pagehide',destroy,{once:true});
  render(state,false);
})();
</script>
</body>
</html>
