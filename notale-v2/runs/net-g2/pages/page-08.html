<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:18px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:32px}.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.16em;color:var(--attention);margin-bottom:10px}.top h1{font-size:var(--fs-h1);line-height:1.18;margin:0;max-width:980px}.formula{display:flex;align-items:center;gap:18px;padding:12px 18px;white-space:nowrap}.formula .target{font:700 var(--fs-body)/1.2 var(--font-mono);color:var(--model)}.formula .eq{font:600 var(--fs-sec)/1.3 var(--font-serif)}
.lab{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;min-height:0}.ledger{display:flex;flex-direction:column;min-height:0}.head,.row{display:grid;grid-template-columns:72px 1fr 1fr 1.48fr;align-items:center;column-gap:14px}.head{height:42px;padding:0 20px;border-bottom:2px solid var(--text);font:700 var(--fs-label)/1.2 var(--font-sans)}.row{position:relative;flex:1;min-height:92px;padding:8px 20px;border-bottom:1px solid color-mix(in srgb,var(--text) 24%,transparent);background:color-mix(in srgb,#fff 34%,var(--bg))}.row:nth-child(odd){background:color-mix(in srgb,var(--model) 3%,var(--bg))}.row:last-child{border-bottom:0}.id{font:800 var(--fs-h2)/1 var(--font-mono)}.metric{position:relative;height:58px;display:flex;align-items:center;gap:8px;padding:0 14px;border:1px solid color-mix(in srgb,var(--text) 25%,transparent);border-radius:8px;background:var(--bg);overflow:hidden}.metric::after{content:"";position:absolute;left:0;bottom:0;height:6px;width:var(--meter);background:var(--model)}.metric.distance::after{background:color-mix(in srgb,var(--text) 48%,transparent)}.metric .num{font-size:26px;color:var(--model)}.metric small{font-size:var(--fs-label);color:color-mix(in srgb,var(--text) 62%,transparent)}.drop{height:58px;border:2px dashed color-mix(in srgb,var(--text) 35%,transparent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:var(--fs-label);color:color-mix(in srgb,var(--text) 58%,transparent)}.row.selected{background:color-mix(in srgb,var(--attention) 9%,transparent)}.row.selected .drop{border-color:var(--attention);color:var(--attention)}.row.done .drop{border-style:solid;border-color:var(--model);background:color-mix(in srgb,var(--model) 9%,transparent)}.calc{position:absolute;right:24px;bottom:5px;font:600 var(--fs-tick)/1 var(--font-mono);color:var(--text)}
.side{display:flex;flex-direction:column;gap:12px;min-height:0}.side h2{font-size:var(--fs-h2);margin:0}.hint{margin:0}.tickets{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ticket{min-height:62px;font:800 22px/1 var(--font-mono);background:var(--bg);border:2px solid var(--text);border-radius:8px;cursor:grab;touch-action:none}.ticket[aria-pressed=true]{border-color:var(--attention);color:var(--attention);transform:translateY(-2px)}.ticket:disabled{opacity:.25;cursor:default}.status{min-height:76px;padding:12px 14px;border-left:4px solid var(--attention);font-size:var(--fs-sec);line-height:1.4}.status.good{border-color:var(--model)}.progress{display:flex;align-items:center;gap:10px;font:700 var(--fs-label)/1.2 var(--font-mono)}.mini-line{width:120px;height:34px;overflow:visible}.mini-line path{fill:none;stroke:var(--model);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.mini-line circle{fill:var(--bg);stroke:var(--model);stroke-width:2}.conclusion{margin-top:auto;padding:16px 18px;font:600 var(--fs-lead)/1.45 var(--font-serif);opacity:.45}.conclusion.on{opacity:1;background:color-mix(in srgb,var(--model) 8%,transparent)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px}.next{font-size:var(--fs-sec);line-height:1.35;margin:0;max-width:1020px}.dragging{position:fixed;z-index:20;pointer-events:none;opacity:.9;transform:translate(-50%,-50%) scale(1.04);width:145px}.sr-live{position:absolute}.shake{animation:shake .18s linear 2}@keyframes shake{50%{transform:translateX(5px)}}@media(prefers-reduced-motion:reduce){.ticket{transition:none}.shake{animation:none}}
</style>
</head>
<body data-page="08" data-total="22">
<div id="stage">
  <header class="top">
    <div><div class="kicker">LOSS LEDGER</div><h1>预测越靠近目标 1，损失就越小</h1></div>
    <div class="panel formula" aria-label="损失公式与固定目标"><span class="eq">损失 = 0.5 × (预测 − 目标)²</span><span class="target">目标 1.0000</span></div>
  </header>
  <main class="lab min0">
    <section class="panel ledger k-comparison min0" aria-label="预测、距离与损失配对账页">
      <div class="head"><span>记录</span><span>预测</span><span>距目标 1</span><span>配对损失</span></div>
      <div id="rows" style="display:contents"></div>
    </section>
    <aside class="side min0" aria-labelledby="ticket-title">
      <h2 id="ticket-title">损失票据</h2>
      <p class="hint">先选一行，再选票据；也可把票据拖到对应行。</p>
      <div id="tickets" class="tickets no-pan"></div>
      <div class="progress"><span id="progressText">已配对 0 / 4</span><svg class="mini-line" viewBox="0 0 120 34" aria-hidden="true"><path id="trend" d=""></path><g id="dots"></g></svg></div>
      <div id="status" class="status" aria-live="polite">比较“距目标 1”，找出平方后对应的损失。</div>
      <div id="conclusion" class="panel q conclusion">损失把“差多远”压成一个可比较的数；学习，就是设法让这个数下降。</div>
    </aside>
  </main>
  <footer class="actions"><p class="next"><b>下一问：</b>如果旋钮每个位置都有一个损失，把这些位置连起来会看到什么？</p><button id="reset" class="btn" type="button">重新配对</button></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(()=>{
Deck.init({index:8,total:22});
const source=(Lec.K&&((Lec.K.page08)||(Lec.K.p08)||(Lec.K.lossLedger)))||{};
const predictions=source.predictions||[0.2,0.5498,0.8,0.95];
const ids=['A','B','C','D'];
const ticketOrder=[2,0,3,1];
const losses=predictions.map(v=>{try{const r=Lec.P.lossValueAndGradient([v],[1],'mse');return typeof r==='number'?r:(r.value??r.loss)}catch(_){return .5*(v-1)*(v-1)}});
const distances=predictions.map(v=>Math.abs(1-v));
const rowsEl=document.getElementById('rows'),ticketsEl=document.getElementById('tickets');
const statusEl=document.getElementById('status'),progressEl=document.getElementById('progressText');
const conclusion=document.getElementById('conclusion'),trend=document.getElementById('trend'),dots=document.getElementById('dots');
const resetBtn=document.getElementById('reset');
const events=new AbortController(); let ghost=null,dragIndex=null;
function initialState(){return{selectedRow:null,selectedTicket:null,matches:{},message:'比较“距目标 1”，找出平方后对应的损失。',tone:'',attemptRow:null};}
let state=initialState();
function fmt(v){return Number(v).toFixed(4)}
function transition(s,a){
 if(a.type==='selectRow') return {...s,selectedRow:a.index,message:`已选记录 ${ids[a.index]}，再选择一张损失票据。`,tone:'',attemptRow:null};
 if(a.type==='selectTicket'){
   if(Object.values(s.matches).includes(a.index)) return s;
   if(s.selectedRow===null) return {...s,selectedTicket:a.index,message:`已选票据 ${fmt(losses[a.index])}，再选择一条预测记录。`,tone:'',attemptRow:null};
   return attempt(s,s.selectedRow,a.index);
 }
 if(a.type==='drop') return attempt(s,a.row,a.index);
 if(a.type==='reset') return initialState(); return s;
}
function attempt(s,row,ticket){
 const calc=`0.5 × (${fmt(predictions[row])} − 1)² = ${fmt(losses[row])}`;
 if(row===ticket){return{...s,matches:{...s.matches,[row]:ticket},selectedRow:null,selectedTicket:null,attemptRow:row,message:`${calc}。配对正确：更近，损失更小。`,tone:'good'};}
 return{...s,selectedTicket:ticket,attemptRow:row,message:`${calc}。这张票据不对应记录 ${ids[row]}；再比较它离 1 有多远。`,tone:'bad'};
}
function dispatch(a){state=transition(state,a);render();}
function render(){
 rowsEl.innerHTML=predictions.map((p,i)=>`<div class="row ${state.selectedRow===i?'selected ':''}${state.matches[i]!==undefined?'done':''}" data-row="${i}"><span class="id">${ids[i]}</span><span class="metric" style="--meter:${p*100}%"><span class="num">${fmt(p)}</span></span><span class="metric distance" style="--meter:${distances[i]*100}%"><span class="num">${fmt(distances[i])}</span></span><div class="drop">${state.matches[i]!==undefined?`<b class="num">${fmt(losses[i])}</b>`:'放入票据'}</div>${state.attemptRow===i?`<span class="calc">0.5 × (${fmt(p)} − 1)² = ${fmt(losses[i])}</span>`:''}</div>`).join('');
 ticketsEl.innerHTML=ticketOrder.map(i=>`<button type="button" class="ticket ${state.selectedTicket===i?'picked':''}" data-ticket="${i}" aria-pressed="${state.selectedTicket===i}" ${Object.values(state.matches).includes(i)?'disabled':''}>${fmt(losses[i])}</button>`).join('');
 const count=Object.keys(state.matches).length,done=count===4; progressEl.textContent=`已配对 ${count} / 4`; statusEl.textContent=state.message;statusEl.className=`status ${state.tone}`; conclusion.classList.toggle('on',done);
 trend.setAttribute('d',done?'M5 5 L40 13 L76 23 L113 29':''); dots.innerHTML=done?[5,40,76,113].map((x,i)=>`<circle cx="${x}" cy="${[5,13,23,29][i]}" r="3"/>`).join(''):'';
 bindDynamic();
}
function bindDynamic(){
 rowsEl.querySelectorAll('.row').forEach(el=>el.addEventListener('click',()=>{const r=+el.dataset.row;if(state.selectedTicket!==null)dispatch({type:'drop',row:r,index:state.selectedTicket});else dispatch({type:'selectRow',index:r});},{signal:events.signal}));
 ticketsEl.querySelectorAll('.ticket').forEach(btn=>{
   const i=+btn.dataset.ticket;btn.addEventListener('click',()=>dispatch({type:'selectTicket',index:i}),{signal:events.signal});
   btn.addEventListener('pointerdown',e=>{if(btn.disabled)return;dragIndex=i;btn.setPointerCapture(e.pointerId);ghost=btn.cloneNode(true);ghost.className='ticket dragging';document.body.appendChild(ghost);moveGhost(e);},{signal:events.signal});
   btn.addEventListener('pointermove',e=>{if(dragIndex===i)moveGhost(e)},{signal:events.signal});
   btn.addEventListener('pointerup',e=>{if(dragIndex!==i)return;const pt=Deck.pt(document.getElementById('stage'),e);const hit=[...rowsEl.querySelectorAll('.row')].find(r=>{const b=r.getBoundingClientRect(),s=Deck.s;return pt.x>=(b.left-stage.getBoundingClientRect().left)/s&&pt.x<=(b.right-stage.getBoundingClientRect().left)/s&&pt.y>=(b.top-stage.getBoundingClientRect().top)/s&&pt.y<=(b.bottom-stage.getBoundingClientRect().top)/s});if(hit)dispatch({type:'drop',row:+hit.dataset.row,index:i});endDrag();},{signal:events.signal});
   btn.addEventListener('pointercancel',endDrag,{signal:events.signal});
 });
}
function moveGhost(e){if(ghost){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}}function endDrag(){if(ghost)ghost.remove();ghost=null;dragIndex=null}
resetBtn.addEventListener('click',()=>{endDrag();dispatch({type:'reset'});rowsEl.querySelector('.row').focus?.();resetBtn.blur();ticketsEl.querySelector('.ticket').focus();},{signal:events.signal});
function destroy(){events.abort();endDrag()}window.addEventListener('pagehide',destroy,{once:true});render();
})();
</script>
</body>
</html>
