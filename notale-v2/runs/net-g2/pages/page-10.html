<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid color-mix(in srgb,var(--text) 22%,transparent);padding-bottom:14px}
.kicker{font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.13em;color:var(--attention)}
h1{font:700 var(--fs-h1)/1.18 var(--font-sans);margin:7px 0 0;max-width:1050px}.head .lead{max-width:330px;margin:0;text-align:right}
.main{flex:1;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.9fr);gap:24px}.lab,.action{min-height:0}
.lab{display:flex;flex-direction:column;gap:12px}.labtop{display:flex;justify-content:space-between;align-items:center}.labtop h2,.action h2{font:700 var(--fs-h2)/1.2 var(--font-sans);margin:0}.hint{margin:0}
.chartwrap{position:relative;flex:1;min-height:0;border:1px solid color-mix(in srgb,var(--text) 26%,transparent);border-radius:8px;background:color-mix(in srgb,var(--bg) 86%,white);overflow:hidden}.chart{position:absolute;inset:0}
.probes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.probe{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;text-align:left;align-items:center;padding:12px 16px;min-height:78px}.probe strong{font-size:var(--fs-body)}.probe .reading{font:600 var(--fs-label)/1.35 var(--font-mono);color:color-mix(in srgb,var(--text) 72%,transparent)}.probe.seen{border-color:var(--attention);background:color-mix(in srgb,var(--attention) 7%,var(--bg))}.probe.seen .reading{color:var(--text)}
.action{display:flex;flex-direction:column;gap:14px}.panel.process{flex:1;padding:18px 20px;display:flex;flex-direction:column;gap:12px}.step{position:relative;padding-left:54px;min-height:94px}.step:not(:last-of-type):after{content:'↓';position:absolute;left:17px;bottom:-7px;font:700 24px/1 var(--font-mono);color:var(--attention)}.n{position:absolute;left:0;top:0;width:36px;height:36px;border:2px solid var(--text);border-radius:50%;display:grid;place-items:center;font:700 var(--fs-label)/1 var(--font-mono)}.step h3{font:700 var(--fs-body)/1.2 var(--font-sans);margin:0 0 7px}.compare{display:flex;gap:10px}.metric{flex:1;background:color-mix(in srgb,var(--text) 5%,transparent);border-radius:8px;padding:8px 10px}.metric span{display:block;font-size:var(--fs-label)}.metric b{display:block;margin-top:3px;font:700 var(--fs-body)/1.2 var(--font-mono)}
.choices{display:flex;gap:9px}.choices .btn{flex:1}.choices .btn.recommended{border-color:var(--attention);box-shadow:inset 0 -4px 0 var(--attention)}
.update-row{display:flex;align-items:center;gap:16px}.knob{width:84px;height:84px;flex:0 0 auto;display:grid;place-items:center;position:relative}.needle{position:absolute;width:3px;height:27px;background:var(--attention);left:40px;top:12px;transform-origin:50% 30px;transform:rotate(var(--ang))}.knob strong{display:none}.record{font:600 var(--fs-sec)/1.55 var(--font-mono)}
.feedback{min-height:52px;margin:0;padding:10px 12px;border-left:4px solid var(--attention);background:color-mix(in srgb,var(--attention) 7%,transparent);font:600 var(--fs-sec)/1.45 var(--font-sans)}.resetrow{display:flex;gap:10px;margin-top:auto}.resetrow .btn{flex:1}
.foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid color-mix(in srgb,var(--text) 22%,transparent);padding-top:13px}.takeaway{font:600 var(--fs-lead)/1.35 var(--font-serif);margin:0}.next{font-size:var(--fs-sec);margin:0;color:color-mix(in srgb,var(--text) 72%,transparent)}
button:disabled{opacity:.42;cursor:not-allowed}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-page="10" data-total="22">
<div id="stage">
  <header class="head"><div><div class="kicker">MANUAL DESCENT · 手动下坡</div><h1>左右各试一步，朝损失更低的一边移动</h1></div><p class="lead">同一个起点、同一个尺度。先取得证据，再决定方向。</p></header>
  <main class="main split-lr min0">
    <section class="lab min0" aria-labelledby="probe-title"><div class="labtop"><h2 id="probe-title">① 探测附近的损失</h2><p class="hint">先后点击两侧探针，比较即时读数</p></div><div class="chartwrap"><div id="chart" class="chart" role="img" aria-label="权重与损失曲线；探测后显示左右两个邻近位置"></div></div><div class="probes"><button id="tryLeft" class="btn probe"><strong>← 向左试</strong><span class="reading">w = 0.4 · 等待探测</span></button><button id="tryRight" class="btn probe"><strong>向右试 →</strong><span class="reading">w = 0.6 · 等待探测</span></button></div></section>
    <section class="action min0" aria-labelledby="act-title"><h2 id="act-title">② 比较 → 选择 → 更新</h2><div class="panel process k-process">
      <div class="step"><span class="n">1</span><h3>比较｜左边损失 与 右边损失</h3><div class="compare"><div class="metric"><span>左边损失</span><b id="leftLoss">—</b></div><div class="metric"><span>右边损失</span><b id="rightLoss">—</b></div></div></div>
      <div class="step"><span class="n">2</span><h3>选择｜哪一边更低？</h3><div class="choices"><button id="moveLeft" class="btn" disabled>向左移动</button><button id="moveRight" class="btn" disabled>向右移动</button></div></div>
      <div class="step"><span class="n">3</span><h3>更新｜把权重朝更低处移动 0.1</h3><div class="update-row"><div class="knob" aria-hidden="true"><i id="needle" class="needle"></i><strong id="knobValue">0.5</strong></div><div id="record" class="record">当前 w = 0.5<br>损失 = 0.1013</div></div></div>
      <p id="feedback" class="feedback" aria-live="polite">先探测左右两边。两次读数都出现后，方向按钮才会启用。</p><div class="resetrow"><button id="back" class="btn" hidden>退回 0.5</button><button id="reset" class="btn">重新开始</button></div>
    </div></section>
  </main>
  <footer class="foot"><p class="takeaway">最小版本的“学习”：比较附近的损失，再把参数移向更低处。</p><p class="next">下一问：方向选对以后，每次应该走多远？</p></footer>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script><script src="assets/lib/echarts.min.js"></script>
<script>
(function(){
'use strict';
Deck.init({index:10,total:22});
const K=Object.freeze({x:Lec.K.page10Input??0.8,b:Lec.K.page10Bias??-0.2,target:Lec.K.page10Target??1,start:Lec.K.page10Weight??0.5,step:Lec.K.page10ProbeStep??0.1});
const $=id=>document.getElementById(id); const events=new AbortController(); let timer=0, destroyed=false;
function calc(w){const p=Lec.P.neuronForward([K.x],[w],K.b,'sigmoid');const y=typeof p==='number'?p:(p.output??p.outputs?.[0]??p[0]);let loss;try{const r=Lec.P.lossValueAndGradient([y],[K.target],'halfSquaredError');loss=typeof r==='number'?r:(r.loss??r.value??r[0]);}catch(_){loss=.5*(y-K.target)*(y-K.target);}return {w,p:y,loss};}
const points={left:calc(K.start-K.step),center:calc(K.start),right:calc(K.start+K.step)};
function initialState(){return {seenLeft:false,seenRight:false,current:K.start,moved:null,active:null};} let state=initialState();
const chart=echarts.init($('chart'),null,{renderer:'svg'}); const curve=[];for(let w=-.1;w<=1.11;w+=.025)curve.push([+w.toFixed(3),calc(w).loss]);
function option(){const shown=[];if(state.seenLeft)shown.push([points.left.w,points.left.loss,'向左试']);if(state.seenRight)shown.push([points.right.w,points.right.loss,'向右试']);const c=calc(state.current);return {animationDuration:Deck.reduced()?0:240,textStyle:{fontFamily:'sans-serif',fontSize:16,color:'#252b32'},grid:{left:70,right:28,top:32,bottom:58},xAxis:{type:'value',name:'权重 w',min:-.1,max:1.1,interval:.2,nameTextStyle:{fontSize:14,padding:[12,0,0,0]},axisLabel:{fontSize:12}},yAxis:{type:'value',name:'半平方损失',min:.055,max:.17,nameTextStyle:{fontSize:14,padding:[0,0,8,0]},axisLabel:{fontSize:12,formatter:v=>v.toFixed(2)}},tooltip:{trigger:'item',textStyle:{fontSize:16},formatter:p=>`${p.data[2]||'当前位置'}<br>w = ${p.data[0].toFixed(1)}<br>损失 = ${p.data[1].toFixed(4)}`},series:[{type:'line',data:curve,showSymbol:false,lineStyle:{color:'#2457A6',width:3},silent:true},{type:'line',data:shown.map(d=>[K.start,points.center.loss]).concat(shown.map(d=>[d[0],d[1]])),lineStyle:{color:'#E76F2E',type:'dashed',width:2},symbol:'none',silent:true},{type:'scatter',data:shown,symbolSize:18,itemStyle:{color:'#E76F2E',borderColor:'#fff',borderWidth:3}},{type:'scatter',data:[[c.w,c.loss,'当前位置']],symbolSize:22,itemStyle:{color:'#2457A6',borderColor:'#fff',borderWidth:4},label:{show:true,position:'top',formatter:'当前位置',fontSize:14,color:'#2457A6'}}]};}
function render(){chart.setOption(option(),true);const ready=state.seenLeft&&state.seenRight; $('tryLeft').classList.toggle('seen',state.seenLeft);$('tryRight').classList.toggle('seen',state.seenRight);$('tryLeft').querySelector('.reading').textContent=state.seenLeft?`预测 ${points.left.p.toFixed(4)} · 损失 ${points.left.loss.toFixed(4)}`:'w = 0.4 · 等待探测';$('tryRight').querySelector('.reading').textContent=state.seenRight?`预测 ${points.right.p.toFixed(4)} · 损失 ${points.right.loss.toFixed(4)}`:'w = 0.6 · 等待探测';$('leftLoss').textContent=state.seenLeft?points.left.loss.toFixed(4):'—';$('rightLoss').textContent=state.seenRight?points.right.loss.toFixed(4):'—';$('moveLeft').disabled=!ready||!!state.moved;$('moveRight').disabled=!ready||!!state.moved;$('moveRight').classList.toggle('recommended',ready&&!state.moved);$('back').hidden=state.moved!=='left';const c=calc(state.current);$('knobValue').textContent=state.current.toFixed(1);$('needle').style.setProperty('--ang',`${(state.current-K.start)*110}deg`);$('record').innerHTML=state.moved?`w：0.5 → ${state.current.toFixed(1)}<br>损失：${points.center.loss.toFixed(4)} → ${c.loss.toFixed(4)}`:`当前 w = 0.5<br>损失 = ${points.center.loss.toFixed(4)}`;
let msg='先探测左右两边。两次读数都出现后，方向按钮才会启用。';if(state.seenLeft&&!state.seenRight)msg='已取得左侧读数。现在向右试，才能在同一尺度上比较。';if(!state.seenLeft&&state.seenRight)msg='已取得右侧读数。现在向左试，补齐比较。';if(ready&&!state.moved)msg=`右边 ${points.right.loss.toFixed(4)} 低于左边 ${points.left.loss.toFixed(4)}。选择一次移动。`;if(state.moved==='right')msg=`这一步让损失减少了 ${(points.center.loss-points.right.loss).toFixed(4)}。比较后的移动使损失下降。`;if(state.moved==='left')msg=`这一步让损失增加了 ${(points.left.loss-points.center.loss).toFixed(4)}；退回起点，再比较一次。`;$('feedback').textContent=msg;}
function dispatch(type){clearTimeout(timer);if(type==='left')state={...state,seenLeft:true,active:'left'};if(type==='right')state={...state,seenRight:true,active:'right'};if(type==='moveLeft'&&state.seenLeft&&state.seenRight&&!state.moved)state={...state,current:points.left.w,moved:'left'};if(type==='moveRight'&&state.seenLeft&&state.seenRight&&!state.moved)state={...state,current:points.right.w,moved:'right'};if(type==='back')state={...state,current:K.start,moved:null};render();}
$('tryLeft').addEventListener('click',()=>dispatch('left'),{signal:events.signal});$('tryRight').addEventListener('click',()=>dispatch('right'),{signal:events.signal});$('moveLeft').addEventListener('click',()=>dispatch('moveLeft'),{signal:events.signal});$('moveRight').addEventListener('click',()=>dispatch('moveRight'),{signal:events.signal});$('back').addEventListener('click',()=>dispatch('back'),{signal:events.signal});$('reset').addEventListener('click',()=>{clearTimeout(timer);state=initialState();render();$('tryLeft').focus();$('feedback').textContent='已恢复起点 0.5，并清除两次探测。';},{signal:events.signal});const off=Deck.onResize(()=>chart.resize());function destroy(){if(destroyed)return;destroyed=true;events.abort();off();clearTimeout(timer);chart.dispose();}window.addEventListener('pagehide',destroy,{once:true});render();
})();
</script>
</body></html>
