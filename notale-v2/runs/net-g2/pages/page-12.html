<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="12" data-total="22">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;gap:0}
    .p12-head{flex:0 0 104px;border-bottom:1px solid rgba(35,45,58,.18);padding-bottom:18px}
    .p12-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.14em;color:var(--attention);margin-bottom:12px}
    .p12-head h1{font:700 var(--fs-h1)/1.22 var(--font-sans);margin:0;max-width:1340px;color:var(--text)}
    .p12-main{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:20px}
    .p12-focus{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
    .p12-scale{position:relative;height:474px;display:grid;grid-template-columns:360px 1fr 550px;align-items:center;background:linear-gradient(90deg,rgba(36,87,166,.035),rgba(36,87,166,.075));border-top:1px solid rgba(36,87,166,.18);border-bottom:1px solid rgba(36,87,166,.18);border-radius:8px;padding:0 34px}
    .p12-scale>section{position:relative;z-index:2}
    .p12-taskline{position:absolute;z-index:3;left:34px;right:34px;top:16px;display:flex;justify-content:space-between;align-items:center;font:600 var(--fs-label)/1.2 var(--font-sans)}
    .p12-taskline .task{color:rgba(35,45,58,.68);letter-spacing:.04em}
    .p12-taskline .ok{color:var(--model)}
    .p12-taskline .limit{color:var(--attention)}
    .p12-map{position:absolute;z-index:0;inset:0;width:100%;height:100%}
    .p12-left{height:400px;display:flex;flex-direction:column;align-items:center;padding-top:22px}
    .p12-count{font:700 var(--fs-h2)/1.2 var(--font-sans);color:var(--model);margin-bottom:22px}
    .p12-knob{width:132px;height:132px;border-radius:50%;position:relative;background:repeating-conic-gradient(from -120deg,rgba(35,45,58,.55) 0 1.5deg,transparent 1.5deg 15deg);display:grid;place-items:center}
    .p12-knob:before{content:"";width:92px;height:92px;border:2px solid var(--text);border-radius:50%;background:#f8f5ed;box-shadow:0 4px 0 rgba(35,45,58,.1)}
    .p12-knob:after{content:"";position:absolute;width:4px;height:38px;border-radius:3px;background:var(--model);left:64px;top:29px;transform-origin:2px 37px;transform:rotate(34deg)}
    .p12-probe{display:flex;align-items:center;gap:12px;margin-top:26px;font:600 var(--fs-label)/1.25 var(--font-sans);color:var(--attention)}
    .p12-probe b{font:700 28px/1 var(--font-sans)}
    .p12-caption{margin:14px 0 0;text-align:center;font:400 var(--fs-sec)/1.45 var(--font-sans);max-width:330px}
    .p12-turn{align-self:center;text-align:center;margin-top:-28px;padding:18px 28px;background:var(--bg);border-top:2px solid var(--attention);border-bottom:2px solid var(--attention)}
    .p12-turn strong{display:block;font:700 var(--fs-lead)/1.35 var(--font-sans);max-width:370px}
    .p12-turn span{display:block;margin-top:10px;font:700 30px/1 var(--font-mono);letter-spacing:.18em;color:var(--attention)}
    .p12-right{height:430px;display:flex;flex-direction:column;align-items:center;padding-top:6px}
    .p12-grid{display:grid;grid-template-columns:repeat(6,66px);gap:10px 12px;margin:0 auto 12px}
    .p12-mini{width:66px;height:66px;border-radius:50%;border:2px solid rgba(35,45,58,.65);background:rgba(36,87,166,.12);position:relative}
    .p12-mini:before{content:"";position:absolute;width:3px;height:21px;background:var(--model);left:30px;top:12px;transform-origin:1px 20px;transform:rotate(var(--a))}
    .p12-mini:after{content:"";position:absolute;inset:-7px;border-radius:50%;background:repeating-conic-gradient(rgba(35,45,58,.35) 0 1deg,transparent 1deg 30deg);z-index:-1}
    .p12-bracket{width:456px;height:25px;border-left:2px solid var(--text);border-right:2px solid var(--text);border-bottom:2px solid var(--text);position:relative;margin-top:0}
    .p12-bracket:after{content:"";position:absolute;width:2px;height:13px;background:var(--text);left:50%;bottom:-13px}
    .p12-need{margin-top:18px;font:600 var(--fs-sec)/1.35 var(--font-sans);text-align:center}
    .p12-need strong{color:var(--model);font-size:var(--fs-lead)}
    .p12-close{flex:0 0 146px;border-top:1px solid rgba(35,45,58,.2);display:flex;align-items:center;justify-content:space-between;gap:54px}
    .p12-close blockquote{margin:0;font:600 27px/1.35 var(--font-serif);color:var(--text)}
    .p12-close .wrap{max-width:610px;border-left:4px solid var(--attention);padding-left:20px}
    .p12-summary{font:600 var(--fs-lead)/1.42 var(--font-sans);margin-bottom:8px}
    .p12-next{font:400 var(--fs-sec)/1.35 var(--font-sans);color:rgba(35,45,58,.72)}
  </style>
  <header class="p12-head">
    <div class="p12-kicker">FROM ONE TO MANY</div>
    <h1>一个旋钮可以左右试探；成百上千个参数，不能逐个猜</h1>
  </header>
  <main class="p12-main min0">
    <div class="p12-focus focus k-generalization min0">
      <div class="p12-scale">
        <div class="p12-taskline"><span class="ok">小规模：可试探</span><span class="task">同一任务：找到让损失下降的方向</span><span class="limit">大规模：不可逐个试探</span></div>
        <svg class="p12-map" viewBox="0 0 1400 406" aria-hidden="true" preserveAspectRatio="none">
          <defs><linearGradient id="scaleFill" x1="0" x2="1"><stop offset="0" stop-color="#2457A6" stop-opacity=".08"/><stop offset="1" stop-color="#2457A6" stop-opacity=".22"/></linearGradient></defs>
          <path d="M120 205 L1190 145 L1190 118 L1370 203 L1190 288 L1190 261 L120 213 Z" fill="url(#scaleFill)"/>
          <line x1="120" y1="209" x2="1325" y2="209" stroke="#2457A6" stroke-width="4" opacity=".55"/>
          <circle cx="120" cy="209" r="9" fill="#2457A6"/><path d="M1325 209l-22-13v26z" fill="#2457A6"/>
          <text x="700" y="390" text-anchor="middle" fill="#4c5561" font-size="15" font-family="sans-serif">参数数量增加 →</text>
        </svg>
        <section class="p12-left min0" aria-label="一个参数时可以左右试探">
          <div class="p12-count">1 个参数</div>
          <div class="p12-knob knob" aria-hidden="true"></div>
          <div class="p12-probe"><b>←</b><span>左右各试一次</span><b>→</b></div>
          <p class="p12-caption">就能选损失更低的一边</p>
        </section>
        <section class="p12-turn min0" aria-label="规模转折">
          <strong>参数一多，逐个试探会迅速变慢</strong>
          <span>•••</span>
        </section>
        <section class="p12-right min0" aria-label="成百上千个参数需要一次得到全部方向">
          <div class="p12-count">成百上千个参数</div>
          <div class="p12-grid" aria-hidden="true">
            <i class="p12-mini" style="--a:-48deg"></i><i class="p12-mini" style="--a:32deg"></i><i class="p12-mini" style="--a:-12deg"></i><i class="p12-mini" style="--a:56deg"></i><i class="p12-mini" style="--a:-35deg"></i><i class="p12-mini" style="--a:14deg"></i>
            <i class="p12-mini" style="--a:42deg"></i><i class="p12-mini" style="--a:-28deg"></i><i class="p12-mini" style="--a:8deg"></i><i class="p12-mini" style="--a:-52deg"></i><i class="p12-mini" style="--a:25deg"></i><i class="p12-mini" style="--a:-5deg"></i>
            <i class="p12-mini" style="--a:-18deg"></i><i class="p12-mini" style="--a:50deg"></i><i class="p12-mini" style="--a:-40deg"></i><i class="p12-mini" style="--a:20deg"></i><i class="p12-mini" style="--a:4deg"></i><i class="p12-mini" style="--a:-30deg"></i>
            <i class="p12-mini" style="--a:34deg"></i><i class="p12-mini" style="--a:-8deg"></i><i class="p12-mini" style="--a:46deg"></i><i class="p12-mini" style="--a:-24deg"></i><i class="p12-mini" style="--a:12deg"></i><i class="p12-mini" style="--a:-45deg"></i>
          </div>
          <div class="p12-bracket" aria-hidden="true"></div>
          <div class="p12-need"><span>24 个旋钮仅作规模示意</span><br>需要一次得到：<strong>每个参数的方向</strong></div>
        </section>
      </div>
    </div>
    <footer class="p12-close">
      <blockquote>不是更用力地猜，而是换一种计算办法。</blockquote>
      <div class="wrap">
        <div class="p12-summary">规模变大后，学习需要一次算出所有参数各自该往哪边移动。</div>
        <div class="p12-next">怎样从同一个误差出发，把调整方向分给每个参数？</div>
      </div>
    </footer>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
