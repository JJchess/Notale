<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="22" data-total="22">
<div id="stage">
  <style>
    .p22{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;text-align:center}
    .p22-head{height:196px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
    .p22-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.18em;color:var(--attention)}
    .p22 h1{margin:0;max-width:1260px;font:700 var(--fs-h1)/1.25 var(--font-sans);color:var(--text)}
    .p22-loop{position:relative;flex:1;min-height:0;width:1320px;max-height:430px}
    .p22-loop svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
    .p22-track{fill:none;stroke:var(--text);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .p22-guide{fill:none;stroke:var(--text);stroke-opacity:.16;stroke-width:2;stroke-dasharray:7 10}
    .p22-node{position:absolute;top:66px;width:190px;height:70px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;font:650 var(--fs-body)/1.35 var(--font-sans);background:var(--bg);border:2px solid var(--text);border-radius:999px;box-shadow:0 4px 0 rgba(30,35,40,.08)}
    .p22-node::before{content:attr(data-step);position:absolute;top:-30px;font:700 var(--fs-tick)/1 var(--font-mono);color:var(--text);opacity:.55}
    .p22-node small{position:absolute;top:78px;width:180px;font:500 var(--fs-label)/1.3 var(--font-sans);color:var(--text);opacity:.68}
    .p22-route-label{position:absolute;font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.08em;color:var(--text);background:var(--bg);padding:0 10px}
    .p22-route-label.cycle{left:598px;top:377px}.p22-route-label.repeat{left:944px;top:377px}.p22-route-label.goal{left:613px;top:184px}
    .n1{left:20px}.n2{left:292px}.n3{left:564px}.n4{left:836px}.n5{left:1108px}
    .p22-center{position:absolute;left:477px;top:235px;width:366px;height:114px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--attention);border-radius:999px;background:var(--bg);color:var(--attention)}
    .p22-center strong{font:750 28px/1.2 var(--font-sans)}
    .p22-center span{margin-top:8px;font:500 var(--fs-label)/1.35 var(--font-sans);color:var(--text)}
    .p22-lead{width:1180px;margin:18px auto 0;font:500 var(--fs-lead)/1.55 var(--font-serif);color:var(--text)}
    .p22-question{width:1180px;margin-top:auto;padding:20px 0 8px;border-top:2px solid rgba(30,35,40,.22);font:650 var(--fs-h2)/1.4 var(--font-sans);color:var(--text)}
    .p22-question b{margin-right:12px;font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--attention)}
  </style>
  <main class="p22 focus k-generalization min0" aria-labelledby="p22-title">
    <header class="p22-head">
      <div class="p22-kicker">TAKEAWAY</div>
      <h1 id="p22-title">神经网络的“学会”，就是用误差反复修正参数</h1>
    </header>

    <section class="p22-loop min0" aria-label="学习的循环：做出预测、量出误差、传回影响、修正参数、再做预测，目标是让误差更小">
      <svg viewBox="0 0 1320 430" aria-hidden="true">
        <defs>
          <marker id="p22-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L10,5 L0,10 Z" fill="var(--text)"></path>
          </marker>
        </defs>
        <path class="p22-guide" d="M105 101 H1203"></path>
        <path class="p22-track" marker-end="url(#p22-arrow)" d="M210 101 H282"></path>
        <path class="p22-track" marker-end="url(#p22-arrow)" d="M482 101 H554"></path>
        <path class="p22-track" marker-end="url(#p22-arrow)" d="M754 101 H826"></path>
        <path class="p22-track" marker-end="url(#p22-arrow)" d="M1026 101 H1098"></path>
        <path class="p22-track" marker-end="url(#p22-arrow)" d="M1203 138 V386 H387 V146"></path>
        <path class="p22-track" marker-end="url(#p22-arrow)" d="M660 225 V202"></path>
      </svg>
      <div class="p22-node tag n1" data-step="01">做出预测<small>得到当前输出</small></div>
      <div class="p22-node tag n2" data-step="02">量出误差<small>与目标比较</small></div>
      <div class="p22-node tag n3" data-step="03">传回影响<small>分给各个参数</small></div>
      <div class="p22-node tag n4" data-step="04">修正参数<small>朝更小方向</small></div>
      <div class="p22-node tag n5" data-step="05">再做预测<small>进入下一轮</small></div>
      <div class="p22-route-label goal">共同目标</div>
      <div class="p22-route-label cycle">学习循环</div>
      <div class="p22-route-label repeat">重复</div>
      <div class="p22-center"><strong>误差更小</strong><span>整个循环共同指向的目标</span></div>
    </section>

    <p class="p22-lead">它先做出预测，再量出误差，把误差的影响传回各个参数，并朝误差更小的方向更新；重复这个动作，就是学习。</p>
    <footer class="p22-question"><b>带走一问</b>当你再次听到“模型学会了”，你会先检查哪一种证据？</footer>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
