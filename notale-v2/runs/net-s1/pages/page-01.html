<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage.focus{
    justify-content:center;
    gap:0;
  }
  #stage.focus .fig{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:44px;
    text-align:center;
  }
  #stage .p1-kicker{
    font-family:var(--font-sans);
    font-size:20px;
    font-weight:700;
    letter-spacing:.38em;
    color:var(--text-dim);
    text-transform:uppercase;
  }
  #stage .p1-kicker .u{
    display:block;
    width:70px;
    height:2px;
    background:var(--orange);
    margin:20px auto 0;
  }
  #stage .k-generalization{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:36px;
    max-width:1380px;
  }
  #stage .k-generalization .claim{
    display:block;
    font-size:92px;
    line-height:1.65;
    font-weight:800;
    color:var(--text);
    letter-spacing:.01em;
    border-bottom:3px solid var(--blue);
    padding-bottom:30px;
  }
  #stage .k-generalization .claim .em{
    color:var(--orange);
  }
  #stage .k-generalization .trunk{
    display:block;
    border-left:3px solid var(--blue);
    padding-left:32px;
    text-align:left;
    font-size:38px;
    line-height:1.62;
    color:var(--text);
    font-weight:400;
    max-width:1180px;
  }
  #stage .k-generalization .trunk .em2{
    color:var(--blue);
    font-weight:700;
  }
  #stage .k-generalization .trunk .dash{
    color:var(--text-dim);
  }
  #stage .cap-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0;
  }
  #stage .cap-wrap .link{
    width:1px;
    height:38px;
    background:var(--rule);
    margin:0 auto 16px;
  }
  #stage .cap{
    display:block;
    font-size:26px;
    color:var(--text-dim);
    font-weight:400;
    letter-spacing:.02em;
  }
  #stage .cap .qm{
    color:var(--orange);
  }
</style>
</head>
<body data-page="01" data-total="22">
<div id="stage" class="focus">
  <div class="fig">
    <div class="p1-kicker">HOW MACHINES LEARN<span class="u"></span></div>
    <div class="k-generalization">
      <div class="claim">
        神经网络是怎么学会的：<br>
        <span class="em">从一个神经元</span>到<span class="em">反向传播</span>
      </div>
      <div class="trunk">
        "学习"不是黑箱魔法——它是一个<span class="em2">能看见</span>、<span class="em2">能亲手拨动</span>的<span class="em2">数值下坡过程</span>
      </div>
    </div>
  </div>
  <div class="cap-wrap">
    <div class="link"></div>
    <div class="cap">
      一个神经元，到底是怎么算出一个数<span class="qm">的？</span>
    </div>
  </div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
