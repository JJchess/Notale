<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{ display:flex; flex-direction:column; }

  /* ---- header ---- */
  .p10-hdr{ flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; height:50px; }
  .p10-kicker{
    font-family:var(--font-sans); font-size:var(--fs-label); font-weight:700;
    letter-spacing:.06em; color:var(--orange);
    padding:4px 12px; border:1px solid var(--orange); border-radius:999px;
  }
  .p10-hdr .p10-subcap{
    font-family:var(--font-sans); font-size:var(--fs-label); color:var(--text-dim);
  }

  /* ---- main split: fig left, cap right ---- */
  .p10-main{
    flex:1; min-height:0; display:flex; flex-direction:row; gap:36px;
  }
  .p10-figwrap{
    flex:1.35 1 0%; min-width:0; min-height:0; display:flex; align-items:center; justify-content:center;
  }
  .p10-figwrap svg{ width:100%; height:100%; display:block; }

  .p10-capwrap{
    flex:1 1 0%; min-width:0; min-height:0; display:flex; flex-direction:column;
    justify-content:center; gap:20px; border-left:1px solid var(--rule); padding-left:36px;
  }
  .p10-claimtext{
    font-family:var(--font-sans); font-weight:700; color:var(--text);
    font-size:30px; line-height:1.45;
  }
  .p10-supports{
    display:flex; flex-direction:column; gap:12px;
  }
  .p10-support{
    font-family:var(--font-sans); font-size:var(--fs-sec); color:var(--text-dim);
    line-height:1.5; display:flex; align-items:flex-start; gap:10px;
  }
  .p10-support::before{
    content:""; width:8px; height:8px; border-radius:50%;
    background:var(--blue); flex:0 0 auto; margin-top:6px;
  }
  .p10-support b{ color:var(--text); font-weight:700; }

  .p10-analogy{
    font-family:var(--font-sans); font-size:var(--fs-label); color:var(--text-dim);
    line-height:1.5; border-left:3px solid var(--orange); padding-left:12px;
  }

  .p10-legend{
    display:flex; flex-direction:column; gap:7px;
  }
  .p10-legend .li{
    font-family:var(--font-sans); font-size:var(--fs-label); color:var(--text-dim);
    display:flex; align-items:center; gap:8px;
  }
  .p10-legend .sw{ width:16px; height:3px; border-radius:2px; flex:0 0 auto; }
  .p10-legend .sw.dot{ width:9px; height:9px; border-radius:50%; }

  /* ---- footer ---- */
  .p10-ftr{
    flex:0 0 auto; padding-top:14px; border-top:1px solid var(--rule);
    display:flex; flex-direction:column; gap:6px; align-items:center;
  }
  .p10-ftr .p10-lead{
    font-family:var(--font-sans); font-size:var(--fs-lead); font-weight:700;
    color:var(--text); line-height:1.4; text-align:center; margin:0;
  }
  .p10-ftr .p10-nextq{
    font-family:var(--font-sans); font-size:var(--fs-body); color:var(--text-dim);
    line-height:1.4; text-align:center; margin:0;
  }
  .p10-ftr .p10-nextq b{ color:var(--orange); font-weight:700; }
</style>
</head>
<body data-page="10" data-total="22">
<div id="stage">

  <div class="p10-hdr">
    <span class="p10-kicker">IV · 梯度下降</span>
    <span class="p10-subcap">误差如何随着权重变化——<b>曲面切开一小段</b>，就是这样一条坡</span>
  </div>

  <div class="p10-main">
    <div class="p10-figwrap">
      <svg id="slopeSvg" viewBox="0 0 700 460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="p10svgdesc">
        <desc id="p10svgdesc">一条从左上到右下倾斜下降的坡道曲线，一个简笔线条小人沿坡道从高处走向低处，脚下用橙色圆点标出当前所在位置；纵轴代表误差，横轴代表权重，起点误差大，终点误差小。</desc>

        <!-- background grid -->
        <g stroke="#DDD3BE" stroke-width="1">
          <line x1="70" y1="60" x2="70" y2="380"/>
          <line x1="70" y1="380" x2="660" y2="380"/>
          <line x1="70" y1="140" x2="660" y2="140" stroke-dasharray="3,6"/>
          <line x1="70" y1="220" x2="660" y2="220" stroke-dasharray="3,6"/>
          <line x1="70" y1="300" x2="660" y2="300" stroke-dasharray="3,6"/>
        </g>

        <!-- axis labels -->
        <text x="70" y="42" font-size="17" fill="#6B6558" font-family="system-ui" text-anchor="middle">误差</text>
        <text x="660" y="405" font-size="17" fill="#6B6558" font-family="system-ui" text-anchor="end">权重（可调的旋钮）</text>

        <!-- filled area under slope: distance already walked -->
        <path d="M 90,80 C 290,80 330,325 620,345 L 620,380 L 90,380 Z"
              fill="#2B5FA6" opacity="0.08"/>

        <!-- slope path -->
        <path id="slopePath" d="M 90,80 C 290,80 330,325 620,345"
              fill="none" stroke="#2B5FA6" stroke-width="6" stroke-linecap="round"/>

        <!-- start / end markers -->
        <circle cx="90" cy="80" r="6.5" fill="#2B5FA6"/>
        <text x="90" y="60" font-size="16" fill="#26241F" font-family="system-ui" text-anchor="start" font-weight="700">误差大：还没学会</text>
        <text x="340" y="210" font-size="14" fill="#6B6558" font-family="system-ui" text-anchor="middle">沿坡一步步往下走</text>

        <circle cx="620" cy="345" r="6.5" fill="#27AE60"/>
        <text x="620" y="370" font-size="16" fill="#26241F" font-family="system-ui" text-anchor="end" font-weight="700">误差小：学得不错了</text>

        <!-- walker -->
        <g id="walker" transform="translate(90,80)">
          <g id="walkerBounce">
            <circle cx="0" cy="-32" r="10" fill="none" stroke="#26241F" stroke-width="3"/>
            <line x1="0" y1="-22" x2="0" y2="-3" stroke="#26241F" stroke-width="3" stroke-linecap="round"/>
            <line x1="0" y1="-18" x2="-14" y2="-9" stroke="#26241F" stroke-width="3" stroke-linecap="round"/>
            <line x1="0" y1="-18" x2="14" y2="-9" stroke="#26241F" stroke-width="3" stroke-linecap="round"/>
            <line x1="0" y1="-3" x2="-11" y2="12" stroke="#26241F" stroke-width="3" stroke-linecap="round"/>
            <line x1="0" y1="-3" x2="11" y2="12" stroke="#26241F" stroke-width="3" stroke-linecap="round"/>
            <circle cx="0" cy="14" r="6" fill="#E8650A"/>
          </g>
        </g>
      </svg>
    </div>

    <div class="p10-capwrap">
      <div class="p10-claimtext">曲面有坡度，沿坡下走，误差就变小</div>

      <div class="p10-supports">
        <div class="p10-support"><b>方向</b>：往哪边挪，坡道自己会指出来</div>
        <div class="p10-support"><b>步幅</b>：每步挪多大，由"学习率"说了算</div>
      </div>

      <div class="p10-analogy">就像蒙着眼站在山坡上，脚一试探就知道哪边更低。<br>不用先看清整座山的形状，一步一步走也能到坡底。</div>

      <div class="p10-legend">
        <span class="li"><span class="sw" style="background:#2B5FA6"></span>坡道 = 误差随权重变化的一小段切面</span>
        <span class="li"><span class="sw dot" style="background:#E8650A"></span>橙点 = 当前所在的位置</span>
        <span class="li"><span class="sw dot" style="background:#27AE60"></span>绿点 = 坡底，误差已经很小</span>
        <span class="li">小人每次只挪一小步，方向永远朝着更低处</span>
      </div>
    </div>
  </div>

  <div class="p10-ftr">
    <p class="p10-lead">学习，就是每次都往误差变小的方向挪一小步</p>
    <p class="p10-nextq">下一个问题：<b>怎么知道哪个方向是"下"？</b></p>
  </div>

</div>
<script src="assets/base.js"></script>
<script src="assets/lib/anime.min.js"></script>
<script src="assets/lec.js"></script>
<script>
(function(){
  var path = anime.path('#slopePath');
  var walker = document.getElementById('walker');
  var bounce = document.getElementById('walkerBounce');

  if (Deck.reduced()){
    walker.setAttribute('transform', 'translate(620,345)');
    return;
  }

  anime({
    targets: walker,
    translateX: path('x'),
    translateY: path('y'),
    easing: 'easeInOutSine',
    duration: 1200,
    complete: function(){
      walker.setAttribute('transform', 'translate(620,345)');
    }
  });

  anime({
    targets: bounce,
    translateY: [0, -6, 0, -6, 0],
    easing: 'easeInOutSine',
    duration: 1200
  });
})();
</script>
</body>
</html>
