<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{ gap:14px; }

  .hd{ flex:0 0 auto; display:flex; flex-direction:column; gap:4px; }
  .kicker{
    font-family:var(--font-mono);
    font-size:15px; letter-spacing:.14em; font-weight:600;
    color:var(--orange); text-transform:uppercase;
  }
  .title{
    margin:0; font-size:var(--fs-h1); line-height:1.3; font-weight:700;
    color:var(--text); max-width:1300px;
  }

  main.split-lr{ flex:1; min-height:0; gap:0; }
  .pane-l, .pane-r{ min-height:0; }
  .pane-l{
    flex:1.52 1 0; display:flex; flex-direction:column;
    padding:8px 22px 4px 4px;
  }
  .pane-r{
    flex:1 1 0; border-left:1px solid var(--rule);
    padding:6px 4px 4px 26px; position:relative;
    display:flex; flex-direction:column; gap:10px;
  }
  .plot-box{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  .plot-box svg{ width:100%; height:100%; display:block; }
  .legend{ flex:0 0 auto; display:flex; gap:22px; padding-top:6px; font-size:var(--fs-label); color:var(--text-dim); }
  .legend .li{ display:flex; align-items:center; gap:7px; }
  .legend .sw{ width:16px; height:3px; border-radius:2px; display:inline-block; }

  .err-badge{ position:absolute; top:0; right:4px; }

  .panel{ flex:0 0 auto; background:var(--panel-bg); border-radius:10px;
    padding:14px 18px 12px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-top:34px; }
  .row{ display:flex; align-items:baseline; justify-content:space-between;
    padding:6px 0; border-bottom:1px solid var(--rule); }
  .row:last-child{ border-bottom:none; }
  .row .k{ font-size:var(--fs-body); color:var(--text-dim); }
  .row .v{ font-family:var(--font-mono); font-size:24px; font-weight:700; color:var(--text); }
  .row.hi .v{ color:var(--orange); }
  .row .v.small{ font-size:20px; }

  .delta-wrap{ min-height:26px; display:flex; align-items:center; }
  .tag{ font-size:var(--fs-label); color:#fff; background:var(--green);
    padding:3px 10px; border-radius:12px; font-weight:600; visibility:hidden; }

  .ctl{ flex:0 0 auto; display:flex; flex-direction:column; gap:6px; }
  .ctl .hint{ font-size:var(--fs-label); color:var(--text-dim); }
  .ctl input[type=range]{ width:100%; }

  .btns{ flex:0 0 auto; display:flex; align-items:center; gap:12px; }
  .btns .hint{ font-size:var(--fs-label); color:var(--text-dim); flex:1; }

  .ft{ flex:0 0 auto; display:flex; flex-direction:column; gap:2px; padding-top:2px; border-top:1px solid var(--rule); }
  .ft .lead{ margin:0; font-size:var(--fs-lead); font-weight:600; color:var(--text); }
  .ft .note{ margin:0; font-size:var(--fs-sec); color:var(--text-dim); }

  .tick-lbl{ font-family:var(--font-mono); font-size:13px; fill:var(--text-dim); }
  .axis-lbl{ font-family:var(--font-sans); font-size:var(--fs-label); fill:var(--text-dim); }
  .ghost{ opacity:0; }
  .stepArrowGrp{ opacity:0; }
</style>
</head>
<body data-page="11" data-total="22">
<div id="stage">

  <div class="hd">
    <div class="kicker">GRADIENT DESCENT</div>
    <h1 class="title">斜率告诉你往哪边走，反着走一步，误差就低一点</h1>
  </div>

  <main class="split-lr">
    <section class="pane-l min0">
      <div class="plot-box">
        <svg id="plot" viewBox="0 0 860 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="loss 随 w 变化的曲线，橙点为当前点">
          <defs>
            <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
              <path d="M0,0 L7,3 L0,6 Z" fill="#C0392B"></path>
            </marker>
            <marker id="arrOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
              <path d="M0,0 L7,3 L0,6 Z" fill="#E8650A"></path>
            </marker>
            <marker id="arrOrangeBig" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
              <path d="M0,0 L9,4 L0,8 Z" fill="#E8650A"></path>
            </marker>
          </defs>

          <g id="gridGrp"></g>
          <path id="curvePath" fill="none" stroke="#2B5FA6" stroke-width="3"></path>

          <g id="stepArrowGrp" class="stepArrowGrp">
            <line id="stepArrowLine" stroke="#E8650A" stroke-width="3" marker-end="url(#arrOrangeBig)"></line>
          </g>

          <circle id="ghostPt" class="ghost" r="6" fill="none" stroke="#6B6558" stroke-width="2" stroke-dasharray="3,2"></circle>

          <line id="tangLine" stroke="#E8650A" stroke-width="2" stroke-dasharray="6,4" opacity="0.85"></line>
          <line id="arrUp" stroke="#C0392B" stroke-width="2.5" marker-end="url(#arrRed)"></line>
          <line id="arrDown" stroke="#E8650A" stroke-width="2.5" marker-end="url(#arrOrange)"></line>

          <circle id="pt" r="8" fill="#E8650A" stroke="#F5F0E8" stroke-width="2"></circle>

          <g id="axisLabels"></g>
        </svg>
      </div>
      <div class="legend">
        <span class="li"><span class="sw" style="background:#C0392B"></span>误差上升方向</span>
        <span class="li"><span class="sw" style="background:#E8650A"></span>反着走（下降方向）</span>
        <span class="li"><span class="sw" style="background:#2B5FA6"></span>loss 曲线（w∈[−3,3]）</span>
      </div>
    </section>

    <section class="pane-r min0">
      <div class="err-badge">loss <b id="badgeLoss">2.13</b></div>

      <div class="panel">
        <div class="row"><span class="k">w（当前）</span><span class="v" id="numW">−2.00</span></div>
        <div class="row"><span class="k">a（预测值）</span><span class="v" id="numA">0.119</span></div>
        <div class="row hi"><span class="k">loss（离答案还有多远）</span><span class="v" id="numLoss">2.127</span></div>
        <div class="row"><span class="k">dw（这一点的斜率）</span><span class="v" id="numDw">−0.881</span></div>
        <div class="row"><span class="k">学习率（步子大小）</span><span class="v small" id="numLr">0.1</span></div>
        <div class="row"><span class="k">新 w = w − 学习率×dw</span><span class="v small" id="numNewW">−1.912</span></div>
      </div>

      <div class="delta-wrap"><span class="tag" id="deltaTag">loss 降了 0.076</span></div>

      <div class="ctl">
        <label class="hint" for="wSlider">拖动滑块选起点 w（−3 ~ 3）：橙点沿曲线实时移动，右侧读数同步刷新，此时还没有下降</label>
        <input type="range" id="wSlider" min="-3" max="3" step="0.1" value="-2" class="no-pan">
      </div>

      <div class="btns">
        <button class="btn" id="stepBtn">走一步 →</button>
        <span class="hint">按当前点的斜率反方向挪一步 w，看 loss 怎么降；可反复点击继续下降</span>
      </div>
    </section>
  </main>

  <div class="ft">
    <p class="lead">每一步的方向和大小，都来自这一点的斜率——不是猜的，是算出来的</p>
    <p class="note">步子该多大？下一页看学习率太大、太小会发生什么</p>
  </div>

</div>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
(function(){
  var svg = document.getElementById('plot');
  var VBW = 860, VBH = 600;
  var marL = 78, marR = 26, marT = 22, marB = 66;
  var plotW = VBW - marL - marR;
  var plotH = VBH - marT - marB;
  var WMIN = -3.4, WMAX = 3.4;

  function computeAt(w){
    var r = Lec.P.neuronBackward([1], [w], 0, 1, 'sigmoid', 'bce');
    return { a: r.a, loss: r.loss, dw: r.dw[0] };
  }

  // sample curve across full domain to find loss range + build path
  var samples = [];
  for (var w = WMIN; w <= WMAX + 1e-6; w += 0.04){
    var r = computeAt(w);
    samples.push({ w: w, loss: r.loss });
  }
  var lossMin = Infinity, lossMax = -Infinity;
  samples.forEach(function(s){ if (s.loss < lossMin) lossMin = s.loss; if (s.loss > lossMax) lossMax = s.loss; });
  var padL = (lossMax - lossMin) * 0.06;
  lossMin = Math.max(0, lossMin - padL);
  lossMax = lossMax + padL;

  function xOf(w){ return marL + (w - WMIN) / (WMAX - WMIN) * plotW; }
  function yOf(loss){ return marT + (1 - (loss - lossMin) / (lossMax - lossMin)) * plotH; }

  // curve path
  var d = samples.map(function(s, i){
    return (i === 0 ? 'M' : 'L') + xOf(s.w).toFixed(2) + ',' + yOf(s.loss).toFixed(2);
  }).join(' ');
  document.getElementById('curvePath').setAttribute('d', d);

  // grid + ticks
  var gridGrp = document.getElementById('gridGrp');
  var axisLabels = document.getElementById('axisLabels');
  var NS = 'http://www.w3.org/2000/svg';
  function mk(tag, attrs){
    var el = document.createElementNS(NS, tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  var axisY = marT + plotH;
  // baseline (w axis)
  gridGrp.appendChild(mk('line', { x1: marL, y1: axisY, x2: marL + plotW, y2: axisY, stroke: '#DDD3BE', 'stroke-width': 1.5 }));
  // y axis
  gridGrp.appendChild(mk('line', { x1: marL, y1: marT, x2: marL, y2: axisY, stroke: '#DDD3BE', 'stroke-width': 1.5 }));

  for (var wt = -3; wt <= 3; wt += 1){
    var gx = xOf(wt);
    gridGrp.appendChild(mk('line', { x1: gx, y1: marT, x2: gx, y2: axisY, stroke: '#E6DFCE', 'stroke-width': 1 }));
    var lbl = mk('text', { x: gx, y: axisY + 22, 'text-anchor': 'middle', class: 'tick-lbl' });
    lbl.textContent = wt.toFixed(0);
    axisLabels.appendChild(lbl);
  }
  var wAxisTitle = mk('text', { x: marL + plotW / 2, y: axisY + 46, 'text-anchor': 'middle', class: 'axis-lbl' });
  wAxisTitle.textContent = 'w（权重）';
  axisLabels.appendChild(wAxisTitle);

  var lossTicksN = 4;
  for (var i = 0; i <= lossTicksN; i++){
    var lv = lossMin + (lossMax - lossMin) * i / lossTicksN;
    var gy = yOf(lv);
    gridGrp.appendChild(mk('line', { x1: marL, y1: gy, x2: marL + plotW, y2: gy, stroke: '#EFE9DA', 'stroke-width': 1 }));
    var tl = mk('text', { x: marL - 10, y: gy + 4, 'text-anchor': 'end', class: 'tick-lbl' });
    tl.textContent = lv.toFixed(2);
    axisLabels.appendChild(tl);
  }
  var lossAxisTitle = mk('text', { x: 20, y: marT - 4, 'text-anchor': 'start', class: 'axis-lbl' });
  lossAxisTitle.textContent = 'loss';
  axisLabels.appendChild(lossAxisTitle);

  // interactive elements
  var pt = document.getElementById('pt');
  var tangLine = document.getElementById('tangLine');
  var arrUp = document.getElementById('arrUp');
  var arrDown = document.getElementById('arrDown');
  var ghostPt = document.getElementById('ghostPt');
  var stepArrowGrp = document.getElementById('stepArrowGrp');
  var stepArrowLine = document.getElementById('stepArrowLine');

  var numW = document.getElementById('numW');
  var numA = document.getElementById('numA');
  var numLoss = document.getElementById('numLoss');
  var numDw = document.getElementById('numDw');
  var numLr = document.getElementById('numLr');
  var numNewW = document.getElementById('numNewW');
  var badgeLoss = document.getElementById('badgeLoss');
  var deltaTag = document.getElementById('deltaTag');
  var slider = document.getElementById('wSlider');
  var stepBtn = document.getElementById('stepBtn');

  var LR = Lec.K.DEFAULT_LR;
  numLr.textContent = LR.toFixed(2);

  var pxPerW = plotW / (WMAX - WMIN);
  var pxPerLoss = plotH / (lossMax - lossMin);

  function fmtSigned(v, d){
    var s = v.toFixed(d);
    return (v > 0 ? '+' : '') + s.replace('-', '−');
  }
  function fmtPlain(v, d){
    var s = v.toFixed(d);
    return s.replace('-', '−');
  }

  var curTween = null;

  function refresh(w){
    var r = computeAt(w);
    var px = xOf(w), py = yOf(r.loss);
    pt.setAttribute('cx', px); pt.setAttribute('cy', py);

    var slopePixel = -r.dw * pxPerLoss / pxPerW;
    var halfTan = 58, halfArr = 30;
    var dxT = halfTan, dyT = slopePixel * halfTan;
    tangLine.setAttribute('x1', px - dxT); tangLine.setAttribute('y1', py - dyT);
    tangLine.setAttribute('x2', px + dxT); tangLine.setAttribute('y2', py + dyT);

    var upSign = r.dw > 0 ? 1 : -1; // +w direction that increases loss
    var ux = upSign * halfArr, uy = upSign * slopePixel * halfArr;
    arrUp.setAttribute('x1', px); arrUp.setAttribute('y1', py);
    arrUp.setAttribute('x2', px + ux); arrUp.setAttribute('y2', py + uy);
    arrDown.setAttribute('x1', px); arrDown.setAttribute('y1', py);
    arrDown.setAttribute('x2', px - ux); arrDown.setAttribute('y2', py - uy);

    var newW = w - LR * r.dw;
    numW.textContent = fmtPlain(w, 2);
    numA.textContent = r.a.toFixed(3);
    numLoss.textContent = r.loss.toFixed(3);
    numDw.textContent = fmtPlain(r.dw, 3);
    numNewW.textContent = fmtPlain(newW, 3);
    badgeLoss.textContent = r.loss.toFixed(2);
    return { a: r.a, loss: r.loss, dw: r.dw, newW: newW, px: px, py: py };
  }

  var state = { w: parseFloat(slider.value) };
  refresh(state.w);

  slider.addEventListener('input', function(){
    if (curTween) { curTween.kill(); curTween = null; stepBtn.disabled = false; }
    stepArrowGrp.style.opacity = 0;
    ghostPt.style.opacity = 0;
    deltaTag.style.visibility = 'hidden';
    state.w = parseFloat(slider.value);
    refresh(state.w);
  });

  stepBtn.addEventListener('click', function(){
    if (curTween) return;
    var oldW = state.w;
    var rOld = computeAt(oldW);
    var oldLoss = rOld.loss;
    var newW = oldW - LR * rOld.dw;
    newW = Math.max(WMIN, Math.min(WMAX, newW));

    var oldPx = xOf(oldW), oldPy = yOf(oldLoss);
    ghostPt.setAttribute('cx', oldPx); ghostPt.setAttribute('cy', oldPy);
    ghostPt.style.opacity = 1;

    var baseY = marT + plotH + 8;
    stepArrowLine.setAttribute('x1', xOf(oldW));
    stepArrowLine.setAttribute('y1', baseY);
    stepArrowLine.setAttribute('x2', xOf(oldW));
    stepArrowLine.setAttribute('y2', baseY);
    stepArrowGrp.style.opacity = 1;

    deltaTag.style.visibility = 'hidden';
    stepBtn.disabled = true;

    var proxy = { w: oldW };
    curTween = gsap.to(proxy, {
      w: newW,
      duration: 0.55,
      ease: 'power2.inOut',
      onUpdate: function(){
        var r = refresh(proxy.w);
        stepArrowLine.setAttribute('x2', r.px);
      },
      onComplete: function(){
        state.w = newW;
        slider.value = newW.toFixed(1);
        var rNew = refresh(newW);
        stepArrowLine.setAttribute('x1', xOf(oldW));
        stepArrowLine.setAttribute('x2', xOf(newW));
        var delta = oldLoss - rNew.loss;
        deltaTag.textContent = 'loss 降了 ' + delta.toFixed(3);
        deltaTag.style.visibility = 'visible';
        curTween = null;
        stepBtn.disabled = false;
      }
    });
  });

  Deck.init({ index: 11, total: 22 });
})();
</script>
</body>
</html>
