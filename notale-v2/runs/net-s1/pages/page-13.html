<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{ display:flex; flex-direction:column; }
  .p13-wrap{
    display:flex; flex-direction:column;
    width:100%; height:100%;
  }
  .p13-kicker{
    flex:0 0 auto;
    font-size:15px; font-weight:700; letter-spacing:.12em;
    color:var(--orange); text-transform:uppercase;
    font-family:var(--font-sans);
    margin:0 0 8px;
  }
  .p13-claim{
    flex:0 0 auto;
    font-size:var(--fs-h1); font-weight:800; color:var(--text);
    margin:0 0 14px; line-height:1.3;
  }
  .p13-fig{
    flex:1 1 auto; min-width:0; min-height:0;
    width:100%; display:flex; align-items:stretch; justify-content:center;
  }
  .p13-fig svg{ width:100%; height:100%; display:block; }
  .p13-supports{
    flex:0 0 auto; display:flex; justify-content:center; margin-top:8px;
  }
  .p13-support{
    font-size:var(--fs-label); color:var(--text-dim); font-family:var(--font-sans);
    border:1px solid var(--rule); border-radius:999px; padding:6px 20px;
    background:var(--panel-bg);
  }
  .p13-support b{ color:var(--orange); font-weight:700; }
  .p13-cap{
    flex:0 0 auto; margin-top:14px;
    font-size:var(--fs-lead); color:var(--text); line-height:1.5;
    font-family:var(--font-sans);
  }
  .p13-next{
    flex:0 0 auto; margin-top:8px;
    font-size:var(--fs-body); color:var(--blue); font-weight:600;
    font-family:var(--font-sans);
  }
  .svg-lbl{ font-family:var(--font-sans); }
</style>
</head>
<body data-page="13" data-total="22">
<div id="stage">
  <div class="p13-wrap">
    <div class="p13-kicker">TRANSITION · 第 V 章</div>
    <h1 class="p13-claim">单层会调了，那前面的层呢？</h1>

    <div class="p13-fig">
      <svg viewBox="0 0 1488 600" preserveAspectRatio="xMidYMid meet" role="img"
           aria-label="左边一个已经学会调整权重的单层神经元，向右延伸生长出一个两层网络：输入层两个节点连到隐藏层三个节点再连到输出层一个节点。隐藏层到输出层的连线是实线，代表这一步的误差责任是已知的；输入层到隐藏层的连线是虚线并标了问号，代表责任还没被算出来。输出节点旁标注 loss 等于 0.31。">
        <defs>
          <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" style="fill:var(--blue)"></path>
          </marker>
          <marker id="arrBlue2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" style="fill:var(--blue)"></path>
          </marker>
        </defs>

        <!-- ================= 左：单层神经元（已学会） ================= -->
        <g>
          <text x="210" y="120" text-anchor="middle" class="svg-lbl" font-size="16" font-weight="600" style="fill:var(--text-dim)">单层：p11–p12 已解决</text>

          <!-- 输入 -->
          <circle cx="70" cy="250" r="16" style="fill:var(--panel-bg);stroke:var(--blue);stroke-width:2.5"></circle>
          <circle cx="70" cy="390" r="16" style="fill:var(--panel-bg);stroke:var(--blue);stroke-width:2.5"></circle>
          <text x="70" y="220" text-anchor="middle" class="svg-lbl" font-size="15" style="fill:var(--text-dim)">x1</text>
          <text x="70" y="420" text-anchor="middle" class="svg-lbl" font-size="15" style="fill:var(--text-dim)">x2</text>

          <line x1="86" y1="255" x2="158" y2="305" style="stroke:var(--blue);stroke-width:2.5" marker-end="url(#arrBlue)"></line>
          <line x1="86" y1="385" x2="158" y2="335" style="stroke:var(--blue);stroke-width:2.5" marker-end="url(#arrBlue)"></line>

          <!-- 神经元 -->
          <circle cx="210" cy="320" r="54" style="fill:var(--panel-bg);stroke:var(--blue);stroke-width:4"></circle>
          <text x="210" y="328" text-anchor="middle" class="svg-lbl" font-size="20" font-weight="700" style="fill:var(--blue)">f</text>

          <!-- 已学会 标签 -->
          <rect x="112" y="168" width="196" height="42" rx="21" style="fill:#EAF6EE;stroke:var(--green);stroke-width:2"></rect>
          <text x="210" y="195" text-anchor="middle" class="svg-lbl" font-size="17" font-weight="700" style="fill:var(--green)">✓ 已学会怎么调</text>

          <!-- 输出 -->
          <line x1="264" y1="320" x2="336" y2="320" style="stroke:var(--blue);stroke-width:2.5" marker-end="url(#arrBlue)"></line>
          <circle cx="352" cy="320" r="15" style="fill:var(--panel-bg);stroke:var(--blue);stroke-width:2.5"></circle>
          <text x="352" y="360" text-anchor="middle" class="svg-lbl" font-size="15" style="fill:var(--text-dim)">ŷ</text>
        </g>

        <!-- ================= 生长桥接：同一水平基线延伸 ================= -->
        <line x1="368" y1="320" x2="770" y2="320" style="stroke:var(--blue);stroke-width:3" stroke-dasharray="1 0" marker-end="url(#arrBlue2)"></line>
        <text x="565" y="300" text-anchor="middle" class="svg-lbl" font-size="15" font-weight="600" style="fill:var(--text-dim)">同一件事，层数变多了</text>

        <!-- ================= 右：多层网络 ================= -->
        <g>
          <text x="560" y="120" text-anchor="middle" class="svg-lbl" font-size="16" font-weight="600" style="fill:var(--text-dim)">输入层</text>
          <text x="800" y="80" text-anchor="middle" class="svg-lbl" font-size="16" font-weight="600" style="fill:var(--text-dim)">隐藏层：本章要解决</text>
          <text x="1090" y="120" text-anchor="middle" class="svg-lbl" font-size="16" font-weight="600" style="fill:var(--text-dim)">输出层</text>

          <!-- 输入节点 -->
          <circle cx="560" cy="210" r="16" style="fill:var(--panel-bg);stroke:var(--blue);stroke-width:2.5"></circle>
          <circle cx="560" cy="430" r="16" style="fill:var(--panel-bg);stroke:var(--blue);stroke-width:2.5"></circle>
          <text x="560" y="180" text-anchor="middle" class="svg-lbl" font-size="15" style="fill:var(--text-dim)">x1</text>
          <text x="560" y="460" text-anchor="middle" class="svg-lbl" font-size="15" style="fill:var(--text-dim)">x2</text>

          <!-- 输入 -> 隐藏：虚线，责任未知 -->
          <line x1="576" y1="212" x2="778" y2="150" style="stroke:var(--orange);stroke-width:2" stroke-dasharray="7 7"></line>
          <line x1="576" y1="216" x2="778" y2="320" style="stroke:var(--orange);stroke-width:2" stroke-dasharray="7 7"></line>
          <line x1="576" y1="224" x2="778" y2="490" style="stroke:var(--orange);stroke-width:2" stroke-dasharray="7 7"></line>
          <line x1="576" y1="424" x2="778" y2="150" style="stroke:var(--orange);stroke-width:2" stroke-dasharray="7 7"></line>
          <line x1="576" y1="428" x2="778" y2="320" style="stroke:var(--orange);stroke-width:2" stroke-dasharray="7 7"></line>
          <line x1="576" y1="436" x2="778" y2="490" style="stroke:var(--orange);stroke-width:2" stroke-dasharray="7 7"></line>

          <!-- 问号标记 -->
          <circle cx="672" cy="205" r="27" style="fill:var(--panel-bg);stroke:var(--orange);stroke-width:2.5" stroke-dasharray="4 4"></circle>
          <text x="672" y="215" text-anchor="middle" class="svg-lbl" font-size="26" font-weight="800" style="fill:var(--orange)">?</text>

          <!-- 隐藏节点 -->
          <circle cx="800" cy="150" r="24" style="fill:var(--panel-bg);stroke:var(--blue);stroke-width:3"></circle>
          <circle cx="800" cy="320" r="24" style="fill:var(--panel-bg);stroke:var(--blue);stroke-width:3"></circle>
          <circle cx="800" cy="490" r="24" style="fill:var(--panel-bg);stroke:var(--blue);stroke-width:3"></circle>

          <!-- 隐藏 -> 输出：实线，责任已知 -->
          <line x1="822" y1="158" x2="1062" y2="304" style="stroke:var(--blue);stroke-width:2.5" marker-end="url(#arrBlue)"></line>
          <line x1="824" y1="320" x2="1062" y2="320" style="stroke:var(--blue);stroke-width:2.5" marker-end="url(#arrBlue)"></line>
          <line x1="822" y1="482" x2="1062" y2="336" style="stroke:var(--blue);stroke-width:2.5" marker-end="url(#arrBlue)"></line>

          <!-- 输出节点 -->
          <circle cx="1090" cy="320" r="32" style="fill:#FDEEE3;stroke:var(--orange);stroke-width:4"></circle>
          <text x="1090" y="329" text-anchor="middle" class="svg-lbl" font-size="19" font-weight="700" style="fill:var(--orange)">ŷ</text>

          <!-- err-badge -->
          <rect x="1150" y="278" width="200" height="46" rx="8" style="fill:var(--panel-bg);stroke:var(--orange);stroke-width:2"></rect>
          <text x="1250" y="308" text-anchor="middle" class="svg-lbl" font-size="18" font-weight="700" style="fill:var(--orange)">loss = 0.31</text>
        </g>
      </svg>
    </div>

    <div class="p13-supports">
      <div class="p13-support">输出层：误差 <b>已知</b>　　隐藏层：<b>？</b></div>
    </div>

    <p class="p13-cap">输出层的误差看得见，但更前面那些层的权重，也在为这个误差负责——只是责任还没被算出来。</p>
    <p class="p13-next">下一问：一层一层往回传，责任怎么分？</p>
  </div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Deck.init({ index: 13, total: 22 });
</script>
</body>
</html>
