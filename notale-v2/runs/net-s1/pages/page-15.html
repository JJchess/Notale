<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/lib/katex.min.css">
<style>
:root {
  --bg: #F5F0E8;
  --text: #26241F;
  --font-sans: system-ui, "Noto Sans SC", sans-serif;
}

#stage {
  display: flex;
  flex-direction: column;
  height: 900px;
  padding: 28px 56px;
  box-sizing: border-box;
  background: var(--bg);
}

/* Header */
.pg-header {
  flex: 0 0 auto;
  display: flex;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 18px;
}
.kicker {
  font-size: var(--fs-label, 15px);
  font-weight: 700;
  letter-spacing: .08em;
  color: var(--orange);
  text-transform: uppercase;
}
.pg-title {
  font-size: var(--fs-h1, 34px);
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
  flex: 1;
}

/* Main layout: SVG left + panel right */
.main-area {
  flex: 1;
  display: flex;
  gap: 0;
  min-height: 0;
}

.net-col {
  flex: 0 0 780px;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.net-svg-wrap {
  flex: 1;
  min-height: 0;
  position: relative;
}

.readout-bar {
  flex: 0 0 auto;
  display: flex;
  justify-content: space-around;
  align-items: center;
  margin-top: 14px;
  padding: 14px 18px;
  background: var(--panel-bg);
  border: 1px solid var(--rule);
  border-radius: 8px;
}
.readout-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.readout-key {
  font-size: var(--fs-label, 15px);
  color: var(--text-dim);
}
.readout-val {
  font-family: var(--font-mono, ui-monospace, monospace);
  font-size: 22px;
  font-weight: 700;
  color: var(--blue);
}
.readout-val.orange { color: var(--orange); }
.readout-sep {
  width: 1px;
  height: 34px;
  background: var(--rule);
}

#net-svg {
  width: 100%;
  height: 100%;
  display: block;
}

.divider-v {
  width: 1px;
  background: var(--rule);
  margin: 0 32px;
  flex: 0 0 auto;
}

.info-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  gap: 0;
}

/* Step indicator */
.step-indicator {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}
.step-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--rule);
  transition: background .2s;
}
.step-dot.active { background: var(--orange); }
.step-dot.done { background: var(--blue); }

/* Info card */
.info-card {
  background: var(--panel-bg);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 20px 22px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
  overflow: hidden;
}

.layer-label {
  font-size: var(--fs-label, 15px);
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--orange);
}

.info-desc {
  font-size: var(--fs-body, 18px);
  color: var(--text);
  line-height: 1.5;
}

.grad-table {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 4px;
}

.grad-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.grad-key {
  font-family: var(--font-mono, ui-monospace, monospace);
  font-size: var(--fs-label, 15px);
  color: var(--text-dim);
  min-width: 56px;
}

.grad-val {
  font-family: var(--font-mono, ui-monospace, monospace);
  font-size: var(--fs-lead, 19px);
  font-weight: 600;
  color: var(--orange);
}

.grad-explain {
  font-size: 14px;
  color: var(--text-dim);
  line-height: 1.35;
}

.formula-box {
  background: #FBF8F2;
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
}

.history-wrap {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 6px;
}
.history-title {
  font-size: var(--fs-label, 15px);
  color: var(--text-dim);
  font-weight: 600;
  border-top: 1px solid var(--rule);
  padding-top: 10px;
  margin-top: 4px;
}
.history-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.history-item {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 14px;
  color: var(--text-dim);
  padding: 5px 0;
  border-bottom: 1px dashed var(--rule);
}
.history-item .h-layer {
  font-weight: 700;
  color: var(--blue);
  min-width: 78px;
}
.history-item .h-vals {
  font-family: var(--font-mono, ui-monospace, monospace);
  color: var(--text);
}

/* Buttons */
.btns-row {
  display: flex;
  gap: 12px;
  margin-top: 16px;
  flex: 0 0 auto;
}

.btn {
  padding: 10px 24px;
  font-size: var(--fs-label, 15px);
  font-weight: 600;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  transition: background .15s, opacity .15s;
}
.btn-primary {
  background: var(--blue);
  color: #fff;
}
.btn-primary:hover:not(:disabled) { background: #234e8a; }
.btn-primary:active:not(:disabled) { background: #1c3f70; }
.btn-primary:disabled { background: var(--rule); color: var(--text-dim); cursor: not-allowed; }
.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1.5px solid var(--blue);
}
.btn-secondary:hover { background: #eef2fa; }
.btn-secondary:active { background: #dce5f5; }

/* Hint */
.hint-row {
  font-size: var(--fs-label, 15px);
  color: var(--text-dim);
  margin-top: 8px;
  line-height: 1.4;
}

/* Closing line */
.closing {
  flex: 0 0 auto;
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--rule);
  font-size: var(--fs-sec, 16px);
  color: var(--text-dim);
  line-height: 1.45;
}
.closing strong { color: var(--text); font-weight: 600; }

/* SVG elements */
.node-circle {
  stroke-width: 2.5;
  transition: stroke .2s, fill .2s;
}
.wire-line {
  stroke-width: 1.8;
  stroke: #a0b0cc;
  fill: none;
  transition: stroke .15s;
}
.wire-line.highlight {
  stroke: var(--orange);
  stroke-width: 2.5;
}
.node-label {
  font-size: 13px;
  fill: var(--text-dim);
  text-anchor: middle;
  dominant-baseline: central;
}
.layer-title {
  font-size: 14px;
  font-weight: 600;
  fill: var(--text-dim);
  text-anchor: middle;
}
.focus-ring-svg {
  fill: none;
  stroke: var(--orange);
  stroke-width: 3;
  stroke-dasharray: 6 4;
  opacity: 0;
  transition: opacity .2s;
}
.focus-ring-svg.visible { opacity: 1; }

/* Animated pulse on output node */
@keyframes pulse-ring {
  0% { r: 22px; opacity: .8; }
  100% { r: 34px; opacity: 0; }
}
.pulse-circle {
  fill: none;
  stroke: var(--orange);
  stroke-width: 2;
  transform-origin: center;
}

/* Wire flow animation */
@keyframes wire-flow {
  0% { stroke-dashoffset: 100; }
  100% { stroke-dashoffset: 0; }
}
.wire-flow-anim {
  stroke-dasharray: 8 5;
  animation: wire-flow .5s linear forwards;
}
</style>
</head>
<body data-page="15" data-total="22">
<div id="stage">

  <!-- Header -->
  <div class="pg-header">
    <span class="kicker">BACKWARD · 逐层回传</span>
    <h1 class="pg-title">误差信号一层一层地往回高亮，不是一次性传完</h1>
  </div>

  <!-- Main -->
  <div class="main-area">
    <!-- SVG network -->
    <div class="net-col min0">
      <div class="net-svg-wrap">
        <svg id="net-svg" viewBox="0 0 760 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="四层神经网络示意图，展示反向传播">
          <!-- Layer titles -->
          <text x="80"  y="30" class="layer-title">输入层</text>
          <text x="280" y="30" class="layer-title">隐藏层 1</text>
          <text x="480" y="30" class="layer-title">隐藏层 2</text>
          <text x="680" y="30" class="layer-title">输出层</text>

          <!-- Wires (drawn before nodes so nodes appear on top) -->
          <!-- L0->L1 wires -->
          <g id="wires-01"></g>
          <!-- L1->L2 wires -->
          <g id="wires-12"></g>
          <!-- L2->L3 wires -->
          <g id="wires-23"></g>

          <!-- Focus rings (behind nodes) -->
          <g id="focus-rings"></g>

          <!-- Nodes -->
          <g id="nodes-0"></g>
          <g id="nodes-1"></g>
          <g id="nodes-2"></g>
          <g id="nodes-3"></g>

          <!-- Backprop arrows -->
          <g id="bp-arrows"></g>
        </svg>
      </div>
      <div class="readout-bar">
        <div class="readout-item">
          <span class="readout-key">输入 x</span>
          <span class="readout-val" id="readout-x">—</span>
        </div>
        <div class="readout-sep"></div>
        <div class="readout-item">
          <span class="readout-key">预测 ŷ</span>
          <span class="readout-val" id="readout-yhat">—</span>
        </div>
        <div class="readout-sep"></div>
        <div class="readout-item">
          <span class="readout-key">真实 y</span>
          <span class="readout-val" id="readout-ytrue">—</span>
        </div>
        <div class="readout-sep"></div>
        <div class="readout-item">
          <span class="readout-key">BCE loss</span>
          <span class="readout-val orange" id="readout-loss">—</span>
        </div>
      </div>
    </div>

    <div class="divider-v"></div>

    <!-- Info panel -->
    <div class="info-col min0">
      <div class="step-indicator" id="step-dots"></div>

      <div class="info-card">
        <div class="layer-label" id="info-layer-label">输出层（step 0）</div>
        <div class="info-desc" id="info-desc">
          前向传播结束，已得到预测值 <em>ŷ</em>。<br>
          现在从这里开始：用 BCE 损失对输出激活求导，得到第一个误差梯度 <em>dA</em>。<br>
          它衡量"预测偏了多少，方向是哪边"。
        </div>
        <div class="formula-box" id="formula-box"></div>
        <div class="grad-table" id="grad-table"></div>
        <div class="history-wrap">
          <div class="history-title">已完成的层（逐层累积）</div>
          <div class="history-list" id="history-list"></div>
        </div>
      </div>

      <div class="btns-row">
        <button class="btn btn-primary" id="btn-step">反传一步 →</button>
        <button class="btn btn-secondary" id="btn-reset">重来</button>
      </div>
      <div class="hint-row" id="hint-text">
        点击「反传一步」，看误差信号如何从输出层一层层向左传回。
      </div>
    </div>
  </div>

  <!-- Closing -->
  <div class="closing">
    <strong>每一层只需要下一层传来的斜率，就能算出自己该负多少责任</strong>——不必看到全局。
  </div>

</div>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/lib/anime.min.js"></script>
<script src="assets/lib/katex.min.js"></script>
<script>
(function(){
  'use strict';

  Deck.init({ index: 15, total: 22 });

  // ---- Network config ----
  var SIZES = [2, 4, 4, 1];
  var ACT = 'sigmoid';

  // Fixed seed for reproducible weights
  Math.seedrandom('p15-backprop');
  function rand(lo, hi) { return lo + Math.random() * (hi - lo); }

  // Initialize weights & biases randomly
  var W = [], B = [];
  for (var l = 1; l < SIZES.length; l++) {
    var nIn = SIZES[l-1], nOut = SIZES[l];
    var wl = [], bl = [];
    for (var i = 0; i < nOut; i++) {
      var row = [];
      for (var j = 0; j < nIn; j++) row.push(rand(-1, 1));
      wl.push(row);
      bl.push(rand(-0.5, 0.5));
    }
    W.push(wl); B.push(bl);
  }

  // Fixed input & label
  var X0 = [0.6, 0.3];
  var Y_TRUE = 1;

  // Forward pass — store all activations & pre-activations
  var fwdAs = [X0];
  var fwdZs = [null]; // no Z for input layer
  for (var li = 0; li < W.length; li++) {
    var res = Lec.P.layerForward(fwdAs[li], W[li], B[li], ACT);
    fwdZs.push(res.Z);
    fwdAs.push(res.A);
  }

  // yPred is last activation (scalar)
  var yPred = fwdAs[fwdAs.length - 1][0];

  // Backward pass — pre-compute all layer gradients
  // bpGrads[i] corresponds to layer (SIZES.length-1 - i) going backward
  // We'll store per-layer results indexed by layer index (1-based from output)
  // layerIdx 3 = output, 2 = hidden2, 1 = hidden1, 0 = input
  var layerResults = []; // layerResults[0] = output layer result (step0), etc.

  // Step 0: output layer — just bceGrad
  var dA_out = [Lec.P.bceGrad(Y_TRUE, yPred)];
  layerResults.push({
    layerIdx: 3,   // which column (0=input, 1=h1, 2=h2, 3=output)
    dA: dA_out,
    dZ: null, dW: null, dB: null, dX: null
  });

  // Step 1: hidden layer 2 (W[1], B[1] — layer index 2 in 0-based W)
  // W[1] is 4x4 (h2->out layer weights? No: W[0]=input->h1, W[1]=h1->h2, W[2]=h2->out)
  // Actually: W[0]: SIZES[0]->SIZES[1] = 2->4 (input->h1)
  //           W[1]: SIZES[1]->SIZES[2] = 4->4 (h1->h2)
  //           W[2]: SIZES[2]->SIZES[3] = 4->1 (h2->out)
  // backprop step 1: through h2->out layer (W[2])
  var bp2 = Lec.P.layerBackward(fwdAs[2], W[2], fwdZs[3], dA_out, ACT);
  layerResults.push({
    layerIdx: 2, // highlight hidden layer 2
    dA: bp2.dX, // dX becomes dA for previous layer
    dZ: bp2.dZ, dW: bp2.dW, dB: bp2.dB, dX: bp2.dX
  });

  // Step 2: hidden layer 1 (through h1->h2 layer W[1])
  var bp1 = Lec.P.layerBackward(fwdAs[1], W[1], fwdZs[2], bp2.dX, ACT);
  layerResults.push({
    layerIdx: 1, // highlight hidden layer 1
    dA: bp1.dX,
    dZ: bp1.dZ, dW: bp1.dW, dB: bp1.dB, dX: bp1.dX
  });

  // Step 3: input layer (through input->h1 layer W[0])
  var bp0 = Lec.P.layerBackward(fwdAs[0], W[0], fwdZs[1], bp1.dX, ACT);
  layerResults.push({
    layerIdx: 0,
    dA: bp0.dX,
    dZ: bp0.dZ, dW: bp0.dW, dB: bp0.dB, dX: bp0.dX
  });

  // ---- Layout ----
  var VW = 760, VH = 560;
  var layerXs = [80, 280, 480, 680];
  var layerColors = ['#2B5FA6', '#2B5FA6', '#2B5FA6', '#E8650A'];

  function nodeY(layerIdx, nodeIdx) {
    var n = SIZES[layerIdx];
    var spacing = Math.min(110, (VH - 80) / (n + 1));
    var totalH = (n - 1) * spacing;
    var startY = (VH - totalH) / 2 + 20;
    return startY + nodeIdx * spacing;
  }

  // Draw wires
  function drawWires(gid, fromLayer, toLayer) {
    var g = document.getElementById(gid);
    g.innerHTML = '';
    for (var i = 0; i < SIZES[fromLayer]; i++) {
      for (var j = 0; j < SIZES[toLayer]; j++) {
        var x1 = layerXs[fromLayer], y1 = nodeY(fromLayer, i);
        var x2 = layerXs[toLayer], y2 = nodeY(toLayer, j);
        var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1); line.setAttribute('y1', y1);
        line.setAttribute('x2', x2); line.setAttribute('y2', y2);
        line.setAttribute('class', 'wire-line');
        line.setAttribute('data-from', fromLayer + '-' + i);
        line.setAttribute('data-to', toLayer + '-' + j);
        g.appendChild(line);
      }
    }
  }

  drawWires('wires-01', 0, 1);
  drawWires('wires-12', 1, 2);
  drawWires('wires-23', 2, 3);

  // Draw focus rings (one per layer)
  var focusRingEls = [];
  var frG = document.getElementById('focus-rings');
  for (var li2 = 0; li2 < SIZES.length; li2++) {
    var n2 = SIZES[li2];
    var ys = [];
    for (var ni = 0; ni < n2; ni++) ys.push(nodeY(li2, ni));
    var minY = Math.min.apply(null, ys) - 28;
    var maxY = Math.max.apply(null, ys) + 28;
    var cx = layerXs[li2];
    var h = maxY - minY;
    var rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', cx - 32);
    rect.setAttribute('y', minY);
    rect.setAttribute('width', 64);
    rect.setAttribute('height', h);
    rect.setAttribute('rx', 14);
    rect.setAttribute('class', 'focus-ring-svg');
    rect.setAttribute('id', 'focus-ring-' + li2);
    frG.appendChild(rect);
    focusRingEls.push(rect);
  }

  // Draw nodes
  var nodeEls = [];
  for (var li3 = 0; li3 < SIZES.length; li3++) {
    var g3 = document.getElementById('nodes-' + li3);
    var layerNodes = [];
    for (var ni3 = 0; ni3 < SIZES[li3]; ni3++) {
      var cx3 = layerXs[li3], cy3 = nodeY(li3, ni3);
      var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', cx3);
      circle.setAttribute('cy', cy3);
      circle.setAttribute('r', 20);
      circle.setAttribute('class', 'node-circle');
      circle.setAttribute('fill', '#fff');
      circle.setAttribute('stroke', '#2B5FA6');
      circle.setAttribute('id', 'node-' + li3 + '-' + ni3);
      g3.appendChild(circle);

      // activation value text inside node
      var actVal = fwdAs[li3][ni3];
      var txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', cx3);
      txt.setAttribute('y', cy3);
      txt.setAttribute('class', 'node-label');
      txt.textContent = typeof actVal === 'number' ? actVal.toFixed(2) : '?';
      g3.appendChild(txt);

      layerNodes.push(circle);
    }
    nodeEls.push(layerNodes);
  }

  // Pulse animation on output node
  var pulseEl = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  pulseEl.setAttribute('cx', layerXs[3]);
  pulseEl.setAttribute('cy', nodeY(3, 0));
  pulseEl.setAttribute('r', 20);
  pulseEl.setAttribute('class', 'pulse-circle');
  pulseEl.setAttribute('id', 'pulse-out');
  document.getElementById('nodes-3').appendChild(pulseEl);

  function animatePulse() {
    if (currentStep !== 0) return;
    var el = document.getElementById('pulse-out');
    if (!el) return;
    anime({
      targets: el,
      r: [22, 36],
      opacity: [0.8, 0],
      easing: 'easeOutQuad',
      duration: 900,
      complete: function() {
        el.setAttribute('r', 20);
        el.setAttribute('opacity', 0.8);
        if (currentStep === 0) setTimeout(animatePulse, 400);
      }
    });
  }
  setTimeout(animatePulse, 600);

  // ---- State machine ----
  var currentStep = 0;
  var MAX_STEP = 3;

  var stepDescriptions = [
    {
      label: '输出层（step 0 / 3）',
      desc: '前向传播已结束，得到预测值 <em>ŷ</em>。<br>用 BCE 损失对输出激活求导，得到第一个误差梯度 <em>dA</em>。<br>它回答：预测偏离真实标签的"方向和程度"。',
      formula: '\\dfrac{\\partial L}{\\partial \\hat y} = dA',
      keys: ['dA（损失对输出的导数）'],
      vals: function() {
        return [layerResults[0].dA[0].toFixed(4)];
      },
      explains: ['负值 = 预测偏低，应该往上调']
    },
    {
      label: '隐藏层 2（step 1 / 3）',
      desc: '用上一步的 <em>dA</em> 反传进隐藏层 2。<br>链式法则：先乘激活函数导数得 <em>dZ</em>，再分别对权重 <em>W</em>、偏置 <em>b</em> 求导，并把梯度继续往前传（<em>dX</em>）。',
      formula: 'dZ = dA \\cdot \\sigma\'(Z)',
      keys: ['dZ（均值）', 'dW（均值）', 'dB（均值）', 'dX→前层'],
      vals: function() {
        var r = layerResults[1];
        return [
          mean(r.dZ).toFixed(4),
          meanMat(r.dW).toFixed(4),
          mean(r.dB).toFixed(4),
          mean(r.dX).toFixed(4)
        ];
      },
      explains: ['乘激活导数后的梯度', '权重该往哪里更新', '偏置该往哪里更新', '传给隐藏层1的信号']
    },
    {
      label: '隐藏层 1（step 2 / 3）',
      desc: '隐藏层 2 把 <em>dX</em> 传过来，作为这层的 <em>dA</em>。<br>同样的链式法则：算出本层的 <em>dZ、dW、dB</em>，再把梯度继续往前传。',
      formula: 'dA_{h1} = dX_{h2}',
      keys: ['dZ（均值）', 'dW（均值）', 'dB（均值）', 'dX→输入层'],
      vals: function() {
        var r = layerResults[2];
        return [
          mean(r.dZ).toFixed(4),
          meanMat(r.dW).toFixed(4),
          mean(r.dB).toFixed(4),
          mean(r.dX).toFixed(4)
        ];
      },
      explains: ['乘激活导数后的梯度', '权重该往哪里更新', '偏置该往哪里更新', '传给输入层的信号']
    },
    {
      label: '输入层（step 3 / 3）',
      desc: '误差信号到达输入层，反向传播完成。<br>输入层没有可学习的权重，但 <em>dX</em> 的到达说明：每个输入特征对这次误差的贡献，已经算清楚了。',
      formula: 'dA_{in} = dX_{h1}',
      keys: ['dZ（均值）', 'dW（均值）', 'dB（均值）', 'dX（到达输入）'],
      vals: function() {
        var r = layerResults[3];
        return [
          mean(r.dZ).toFixed(4),
          meanMat(r.dW).toFixed(4),
          mean(r.dB).toFixed(4),
          mean(r.dX).toFixed(4)
        ];
      },
      explains: ['本层激活后的梯度', '权重梯度（连接输入与隐藏层1）', '偏置梯度', '到达输入，反传结束']
    }
  ];

  function mean(arr) {
    if (!arr || !arr.length) return 0;
    var s = 0;
    for (var i = 0; i < arr.length; i++) s += arr[i];
    return s / arr.length;
  }
  function meanMat(mat) {
    if (!mat || !mat.length) return 0;
    var s = 0, count = 0;
    for (var i = 0; i < mat.length; i++) {
      for (var j = 0; j < mat[i].length; j++) { s += mat[i][j]; count++; }
    }
    return count ? s / count : 0;
  }

  // Build step dots
  var dotsEl = document.getElementById('step-dots');
  for (var si = 0; si <= MAX_STEP; si++) {
    var dot = document.createElement('div');
    dot.className = 'step-dot';
    dot.id = 'dot-' + si;
    dotsEl.appendChild(dot);
  }

  function getWireGroup(from, to) {
    if (from === 0 && to === 1) return 'wires-01';
    if (from === 1 && to === 2) return 'wires-12';
    if (from === 2 && to === 3) return 'wires-23';
    return null;
  }

  function render() {
    var desc = stepDescriptions[currentStep];
    var focusLayer = layerResults[currentStep].layerIdx;

    // Focus rings
    for (var li4 = 0; li4 < SIZES.length; li4++) {
      var ring = document.getElementById('focus-ring-' + li4);
      if (li4 === focusLayer) {
        ring.classList.add('visible');
      } else {
        ring.classList.remove('visible');
      }
    }

    // Dimmed/bright nodes
    for (var li5 = 0; li5 < SIZES.length; li5++) {
      for (var ni5 = 0; ni5 < SIZES[li5]; ni5++) {
        var circle5 = document.getElementById('node-' + li5 + '-' + ni5);
        if (li5 === focusLayer) {
          circle5.setAttribute('stroke', '#E8650A');
          circle5.setAttribute('fill', '#fff8f2');
          circle5.setAttribute('stroke-width', '3');
          circle5.setAttribute('opacity', '1');
        } else if (li5 > focusLayer) {
          circle5.setAttribute('stroke', '#2B5FA6');
          circle5.setAttribute('fill', '#fff');
          circle5.setAttribute('stroke-width', '2.5');
          circle5.setAttribute('opacity', '0.4');
        } else {
          circle5.setAttribute('stroke', '#2B5FA6');
          circle5.setAttribute('fill', '#fff');
          circle5.setAttribute('stroke-width', '2.5');
          circle5.setAttribute('opacity', '0.6');
        }
      }
    }

    // Highlight wires: the connection between focusLayer and focusLayer+1
    // (the wires we just backpropagated through)
    var allWireGroups = ['wires-01', 'wires-12', 'wires-23'];
    for (var wgi = 0; wgi < allWireGroups.length; wgi++) {
      var grpEl = document.getElementById(allWireGroups[wgi]);
      var lines = grpEl.querySelectorAll('line');
      for (var li6 = 0; li6 < lines.length; li6++) {
        // wgi 0 = layers 0-1, wgi 1 = layers 1-2, wgi 2 = layers 2-3
        var isActiveWireGroup = (currentStep === 1 && wgi === 2) ||
                                (currentStep === 2 && wgi === 1) ||
                                (currentStep === 3 && wgi === 0);
        lines[li6].setAttribute('stroke', isActiveWireGroup ? '#E8650A' : '#a0b0cc');
        lines[li6].setAttribute('stroke-width', isActiveWireGroup ? '2' : '1.5');
        lines[li6].setAttribute('opacity', isActiveWireGroup ? '1' :
          (wgi >= focusLayer ? '0.25' : '0.55'));
        lines[li6].classList.remove('wire-flow-anim');
      }
    }

    // Info panel
    document.getElementById('info-layer-label').textContent = desc.label;
    document.getElementById('info-desc').innerHTML = desc.desc;

    var fbox = document.getElementById('formula-box');
    try {
      katex.render(desc.formula, fbox, { throwOnError: false });
    } catch (e) { fbox.textContent = desc.formula; }

    var gradTable = document.getElementById('grad-table');
    gradTable.innerHTML = '';
    var vals = desc.vals();
    for (var ki = 0; ki < desc.keys.length; ki++) {
      var row = document.createElement('div');
      row.className = 'grad-row';
      row.innerHTML = '<span class="grad-key">' + desc.keys[ki] + '</span>' +
        '<span class="grad-val">' + vals[ki] + '</span>' +
        '<span class="grad-explain">' + desc.explains[ki] + '</span>';
      gradTable.appendChild(row);
    }

    // Step dots
    for (var si2 = 0; si2 <= MAX_STEP; si2++) {
      var dotEl = document.getElementById('dot-' + si2);
      dotEl.classList.remove('active', 'done');
      if (si2 === currentStep) dotEl.classList.add('active');
      else if (si2 < currentStep) dotEl.classList.add('done');
    }

    // Buttons
    var btnStep = document.getElementById('btn-step');
    btnStep.disabled = currentStep >= MAX_STEP;

    // History list: show all completed steps up to currentStep
    var histList = document.getElementById('history-list');
    histList.innerHTML = '';
    for (var hi = 0; hi <= currentStep; hi++) {
      var hDesc = stepDescriptions[hi];
      var hVals = hDesc.vals();
      var item = document.createElement('div');
      item.className = 'history-item';
      var layerName = ['输入层', '隐藏层1', '隐藏层2', '输出层'][layerResults[hi].layerIdx];
      var valsStr = hDesc.keys.map(function(k, ki2) { return k.split('（')[0] + '=' + hVals[ki2]; }).join('  ');
      item.innerHTML = '<span class="h-layer">' + layerName + '</span><span class="h-vals">' + valsStr + '</span>';
      histList.appendChild(item);
    }

    // Hint
    var hintEl = document.getElementById('hint-text');
    if (currentStep === 0) {
      hintEl.textContent = '点击「反传一步」，看误差信号如何从输出层一层层向左传回。';
    } else if (currentStep === MAX_STEP) {
      hintEl.textContent = '反传完成。每层只用了"右侧层传来的斜率"，从未看到全局误差。点「重来」再看一遍。';
    } else {
      hintEl.textContent = '继续点「反传一步」，看梯度如何传到更左侧的层。';
    }
  }

  function animateStep(fromLayer, toLayer) {
    // Animate wire flow from toLayer -> fromLayer direction (right to left)
    var gid = getWireGroup(fromLayer, toLayer);
    if (!gid) return;
    var grpEl = document.getElementById(gid);
    var lines = grpEl.querySelectorAll('line');

    // Focus ring fade in on new layer
    var newRing = document.getElementById('focus-ring-' + fromLayer);
    if (newRing) {
      anime({
        targets: newRing,
        opacity: [0, 1],
        duration: 200,
        easing: 'easeOutQuad'
      });
    }

    // Wire highlight + flash
    for (var li7 = 0; li7 < lines.length; li7++) {
      lines[li7].setAttribute('stroke', '#E8650A');
      lines[li7].setAttribute('stroke-width', '2');
      (function(line) {
        line.classList.add('wire-flow-anim');
        setTimeout(function() { line.classList.remove('wire-flow-anim'); }, 550);
      })(lines[li7]);
    }
  }

  // Event listeners
  document.getElementById('btn-step').addEventListener('click', function() {
    if (currentStep >= MAX_STEP) return;
    var prevFocusLayer = layerResults[currentStep].layerIdx;
    currentStep++;
    var newFocusLayer = layerResults[currentStep].layerIdx;
    animateStep(newFocusLayer, prevFocusLayer);
    setTimeout(render, 160);
  });

  document.getElementById('btn-reset').addEventListener('click', function() {
    currentStep = 0;
    render();
    setTimeout(animatePulse, 400);
  });

  // Fill readout bar with real computed values (never change, forward pass is fixed)
  document.getElementById('readout-x').textContent = '[' + X0[0].toFixed(2) + ', ' + X0[1].toFixed(2) + ']';
  document.getElementById('readout-yhat').textContent = yPred.toFixed(4);
  document.getElementById('readout-ytrue').textContent = Y_TRUE.toFixed(0);
  document.getElementById('readout-loss').textContent = Lec.P.bce(Y_TRUE, yPred).toFixed(4);

  // Initial render
  render();

})();
</script>
</body>
</html>
