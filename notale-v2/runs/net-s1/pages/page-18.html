<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ── Layout ────────────────────────────────────────────────── */
  #stage {
    display: flex;
    flex-direction: column;
    height: 900px;
    overflow: hidden;
  }

  /* Header bar */
  .pg-header {
    flex: 0 0 auto;
    padding: 18px 56px 0;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .pg-kicker {
    font-size: var(--fs-label);
    font-family: var(--font-mono);
    color: var(--orange);
    letter-spacing: 0.08em;
    font-weight: 600;
  }
  .pg-title {
    font-size: var(--fs-h1);
    font-family: var(--font-sans);
    color: var(--text);
    font-weight: 700;
    line-height: 1.2;
    margin: 0;
  }

  /* Status bar below header */
  .status-bar {
    flex: 0 0 auto;
    padding: 10px 56px 0;
    display: flex;
    align-items: center;
    gap: 32px;
  }
  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .stat-label {
    font-size: var(--fs-label);
    color: var(--text-dim);
    font-family: var(--font-sans);
    line-height: 1;
    margin-bottom: 2px;
  }
  .stat-value {
    font-size: 26px;
    font-family: var(--font-mono);
    color: var(--text);
    font-weight: 700;
    line-height: 1;
  }
  .stat-value.highlight { color: var(--orange); }
  .stat-value.good { color: var(--green); }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-left: auto;
  }
  .ctrl-hint {
    font-size: var(--fs-label);
    color: var(--text-dim);
    font-family: var(--font-sans);
  }

  /* Main content area */
  .main-area {
    flex: 1;
    display: flex;
    gap: 0;
    padding: 16px 56px 0;
    min-height: 0;
  }

  /* Left canvas panel */
  .left-panel {
    flex: 0 0 auto;
    width: 530px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .panel-label {
    font-size: var(--fs-label);
    color: var(--text-dim);
    font-family: var(--font-sans);
    font-weight: 600;
  }
  .canvas-wrap {
    position: relative;
    width: 520px;
    height: 520px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: #fff;
    overflow: hidden;
  }
  #boundary-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* Legend */
  .legend-row {
    display: flex;
    gap: 20px;
    padding: 2px 0;
  }

  /* Right panel */
  .right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-left: 24px;
    min-height: 0;
  }
  .divider-v {
    width: 1px;
    background: var(--rule);
    align-self: stretch;
    margin: 0 4px;
  }
  #loss-chart {
    flex: 1;
    min-height: 0;
    width: 100%;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: #fff;
  }

  /* Process axis line */
  .process-axis {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 6px 0 4px;
    font-size: var(--fs-label);
    color: var(--text-dim);
    font-family: var(--font-sans);
  }
  .axis-step {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 4px;
    background: #f5f0e8;
    border: 1px solid var(--rule);
    font-size: var(--fs-label);
    color: var(--text);
    white-space: nowrap;
  }
  .axis-step .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--blue);
    display: inline-block;
  }
  .axis-step.active .dot { background: var(--orange); }
  .axis-arw {
    font-size: 18px;
    color: var(--rule);
    margin: 0 4px;
    line-height: 1;
  }

  /* Bottom */
  .bottom-area {
    flex: 0 0 auto;
    padding: 10px 56px 16px;
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .conclusion {
    font-size: var(--fs-body);
    color: var(--text);
    line-height: 1.45;
    max-width: 860px;
  }
  .conclusion strong { color: var(--orange); }
  .next-q {
    font-size: var(--fs-sec);
    color: var(--text-dim);
    text-align: right;
    max-width: 300px;
    line-height: 1.4;
  }
  .next-q em { font-style: normal; color: var(--text); }

  /* Error badge */
  .err-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--orange);
    color: #fff;
    border-radius: 4px;
    padding: 4px 10px;
    font-size: var(--fs-label);
    font-family: var(--font-mono);
    font-weight: 700;
    z-index: 10;
    line-height: 1.3;
    pointer-events: none;
  }

  /* Diverged notice */
  .diverged-badge {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--red);
    color: #fff;
    border-radius: 6px;
    padding: 12px 24px;
    font-size: var(--fs-lead);
    font-family: var(--font-sans);
    font-weight: 700;
    z-index: 20;
    pointer-events: none;
  }
</style>
</head>
<body data-page="18" data-total="22">
<div id="stage">

  <!-- Header -->
  <div class="pg-header">
    <span class="pg-kicker">LIVE TRAINING</span>
    <h1 class="pg-title">按下开始，看误差往下掉、边界慢慢长出来</h1>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="stat-item">
      <span class="stat-label">训练步数</span>
      <span class="stat-value" id="epoch-val">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">准确率</span>
      <span class="stat-value" id="acc-val">—</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">BCE Loss</span>
      <span class="stat-value highlight" id="loss-val">—</span>
    </div>
    <div class="controls">
      <span class="ctrl-hint">拖动训练，随时暂停查看</span>
      <div class="btns">
        <button class="btn" id="btn-start">▶ 开始</button>
        <button class="btn" id="btn-reset" style="opacity:0.7">↺ 重置</button>
      </div>
    </div>
  </div>

  <!-- Main area -->
  <div class="main-area">
    <!-- Left: boundary canvas -->
    <div class="left-panel">
      <span class="panel-label">决策边界（热力 = 预测概率，点 = 数据样本）</span>
      <div class="canvas-wrap">
        <canvas id="boundary-canvas" class="no-pan"></canvas>
        <div class="err-badge" id="live-loss">Loss: —</div>
        <div class="diverged-badge" id="diverged-notice">数值发散</div>
      </div>
      <!-- legend -->
      <div class="legend-row">
        <div class="legend">
          <div class="li"><span class="sw" style="background:rgba(43,95,166,0.65);border-radius:50%;width:12px;height:12px;display:inline-block;vertical-align:middle;margin-right:4px;"></span><span style="font-size:var(--fs-label);color:var(--text);">高概率区（蓝深 = P→1）</span></div>
          <div class="li"><span class="sw" style="background:rgba(39,174,96,0.9);border-radius:50%;width:12px;height:12px;display:inline-block;vertical-align:middle;margin-right:4px;"></span><span style="font-size:var(--fs-label);color:var(--text);">预测正确</span></div>
          <div class="li"><span class="sw" style="background:rgba(192,57,43,0.9);border-radius:50%;width:12px;height:12px;display:inline-block;vertical-align:middle;margin-right:4px;"></span><span style="font-size:var(--fs-label);color:var(--text);">预测错误</span></div>
        </div>
      </div>
    </div>

    <div class="divider-v"></div>

    <!-- Right: loss chart -->
    <div class="right-panel">
      <span class="panel-label">BCE Loss 曲线（x = 训练步，y = 误差）</span>
      <div id="loss-chart"></div>
      <!-- process axis -->
      <div class="process-axis">
        <span class="axis-step active"><span class="dot"></span>猜（前向）</span>
        <span class="axis-arw">→</span>
        <span class="axis-step active"><span class="dot"></span>算误差</span>
        <span class="axis-arw">→</span>
        <span class="axis-step active"><span class="dot"></span>反传</span>
        <span class="axis-arw">→</span>
        <span class="axis-step active"><span class="dot"></span>改权重</span>
        <span class="axis-arw">→</span>
        <span class="axis-step" style="color:var(--text-dim);">重复…</span>
      </div>
    </div>
  </div>

  <!-- Bottom -->
  <div class="bottom-area">
    <p class="conclusion">
      反复执行"猜→算误差→反传→改权重"，循环几百次，网络就从乱猜变成能分开两片月牙——这就是<strong>"学会"</strong>。
    </p>
    <p class="next-q">下一问：<em>同样的循环，走得太大或太小会怎样？</em></p>
  </div>

</div><!-- #stage -->

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/lib/mlp.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(function(){
  'use strict';

  Deck.init({ index: 18, total: 22 });

  /* ── 1. Generate moon dataset ──────────────────────────────── */
  var rng = new Math.seedrandom('42');
  function randNorm() {
    var u = 1 - rng(), v = 1 - rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  var trainSet = [];
  var N = 100;
  var NOISE = 0.09;
  // Upper moon (class 1): half circle top
  for (var i = 0; i < N; i++) {
    var t = Math.PI * i / N;
    var x = Math.cos(t) + randNorm() * NOISE;
    var y = Math.sin(t) + randNorm() * NOISE;
    trainSet.push({ x: [x, y], t: 1 });
  }
  // Lower moon (class 0): half circle bottom-right offset
  for (var i = 0; i < N; i++) {
    var t = Math.PI * i / N;
    var x = 1 - Math.cos(t) + randNorm() * NOISE;
    var y = 0.5 - Math.sin(t) + randNorm() * NOISE;
    trainSet.push({ x: [x, y], t: 0 });
  }

  // Bounding box with padding, derived from actual data (no guessing)
  var xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;
  trainSet.forEach(function(p){
    xMin = Math.min(xMin, p.x[0]); xMax = Math.max(xMax, p.x[0]);
    yMin = Math.min(yMin, p.x[1]); yMax = Math.max(yMax, p.x[1]);
  });
  var padX = (xMax - xMin) * 0.12, padY = (yMax - yMin) * 0.12;
  xMin -= padX; xMax += padX; yMin -= padY; yMax += padY;

  /* ── 2. Build network ──────────────────────────────────────── */
  var net = MLP.create({ sizes: [2, 4, 4, 1], act: 'tanh', lr: 0.3, seed: 42 });

  /* ── 3. ECharts loss chart ─────────────────────────────────── */
  var chartEl = document.getElementById('loss-chart');
  var chart = echarts.init(chartEl, null, { renderer: 'svg' });
  var lossData = [];

  function getChartOpt(data) {
    return {
      animation: false,
      grid: { left: 52, right: 20, top: 28, bottom: 40 },
      textStyle: { fontSize: 14, fontFamily: 'system-ui, sans-serif', color: '#6B6558' },
      xAxis: {
        type: 'value',
        min: 0,
        name: '训练步',
        nameLocation: 'middle',
        nameGap: 28,
        nameTextStyle: { fontSize: 14, color: '#6B6558' },
        axisLabel: { fontSize: 13, color: '#6B6558' },
        splitLine: { lineStyle: { color: '#DDD3BE' } }
      },
      yAxis: {
        type: 'value',
        min: 0,
        max: 0.75,
        name: 'BCE Loss',
        nameLocation: 'middle',
        nameGap: 36,
        nameTextStyle: { fontSize: 14, color: '#6B6558' },
        axisLabel: { fontSize: 13, color: '#6B6558' },
        splitLine: { lineStyle: { color: '#DDD3BE' } }
      },
      series: [{
        type: 'line',
        data: data,
        showSymbol: false,
        lineStyle: { color: '#E8650A', width: 2 },
        areaStyle: { color: 'rgba(232,101,10,0.08)' },
        smooth: true
      }]
    };
  }

  chart.setOption(getChartOpt([]));

  /* ── 4. Boundary canvas ────────────────────────────────────── */
  var cv = document.getElementById('boundary-canvas');
  var CV_SIZE = 520;
  var GRID = 80;

  function toCanvas(nx, ny) {
    return [
      (nx - xMin) / (xMax - xMin) * CV_SIZE,
      CV_SIZE - (ny - yMin) / (yMax - yMin) * CV_SIZE
    ];
  }

  var fieldBuf = null;
  var fieldAge = 0;

  function drawBoundary(ctx, field) {
    var step = CV_SIZE / GRID;
    for (var r = 0; r < GRID; r++) {
      for (var c = 0; c < GRID; c++) {
        var p = field[r * GRID + c];
        // Blue for high probability, light for low
        var alpha = 0.12 + p * 0.62;
        ctx.fillStyle = 'rgba(43,95,166,' + alpha.toFixed(2) + ')';
        ctx.fillRect(c * step, r * step, step + 0.5, step + 0.5);
      }
    }
  }

  function drawPoints(ctx, evalResult) {
    var R = 5.5;
    for (var i = 0; i < trainSet.length; i++) {
      var pt = trainSet[i];
      var pos = toCanvas(pt.x[0], pt.x[1]);
      var pred = net.predict(pt.x);
      var correct = (pred >= 0.5 && pt.t === 1) || (pred < 0.5 && pt.t === 0);
      ctx.beginPath();
      ctx.arc(pos[0], pos[1], R, 0, Math.PI * 2);
      if (correct) {
        ctx.fillStyle = 'rgba(39,174,96,0.85)';
        ctx.strokeStyle = 'rgba(20,100,50,0.6)';
      } else {
        ctx.fillStyle = 'rgba(192,57,43,0.85)';
        ctx.strokeStyle = 'rgba(120,20,10,0.6)';
      }
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function renderCanvas() {
    var ctx = Deck.fit(cv);
    ctx.clearRect(0, 0, CV_SIZE, CV_SIZE);
    // Background
    ctx.fillStyle = '#faf9f6';
    ctx.fillRect(0, 0, CV_SIZE, CV_SIZE);

    if (fieldBuf) {
      drawBoundary(ctx, fieldBuf);
    }
    drawPoints(ctx);
  }

  function updateField() {
    fieldBuf = net.field(xMin, yMin, xMax, yMax, GRID, GRID);
  }

  /* ── 5. Training loop ──────────────────────────────────────── */
  var running = false;
  var step = 0;
  var loopStop = null;
  var frameCount = 0;

  var btnStart = document.getElementById('btn-start');
  var btnReset = document.getElementById('btn-reset');
  var epochEl = document.getElementById('epoch-val');
  var accEl = document.getElementById('acc-val');
  var lossEl = document.getElementById('loss-val');
  var liveLossEl = document.getElementById('live-loss');
  var divergedEl = document.getElementById('diverged-notice');

  function updateStats() {
    var ev = net.evaluate(trainSet);
    var lossStr = ev.loss.toFixed(4);
    var accStr = (ev.acc * 100).toFixed(1) + '%';
    epochEl.textContent = step;
    accEl.textContent = accStr;
    accEl.className = 'stat-value' + (ev.acc > 0.9 ? ' good' : '');
    lossEl.textContent = lossStr;
    liveLossEl.textContent = 'Loss: ' + lossStr;
    // Chart append
    lossData.push([step, parseFloat(ev.loss.toFixed(4))]);
    chart.setOption({ series: [{ data: lossData }] });
  }

  function trainFrame(ts, dt) {
    if (!running) return;
    if (net.diverged) {
      divergedEl.style.display = 'block';
      running = false;
      btnStart.textContent = '▶ 开始';
      return;
    }

    // 12 mini-batch steps per frame
    for (var k = 0; k < 12; k++) {
      net.step(trainSet, 16);
    }
    step += 12;
    frameCount++;

    // Update field every 8 frames
    if (frameCount % 8 === 0) {
      updateField();
    }

    renderCanvas();
    updateStats();
  }

  function startLoop() {
    if (loopStop) loopStop();
    loopStop = Deck.loop(trainFrame, { still: 0 });
  }

  btnStart.addEventListener('click', function() {
    if (running) {
      running = false;
      btnStart.textContent = '▶ 开始';
      if (loopStop) { loopStop(); loopStop = null; }
    } else {
      running = true;
      btnStart.textContent = '⏸ 暂停';
      startLoop();
    }
  });

  btnReset.addEventListener('click', function() {
    running = false;
    btnStart.textContent = '▶ 开始';
    if (loopStop) { loopStop(); loopStop = null; }
    net.reset();
    step = 0;
    frameCount = 0;
    fieldBuf = null;
    lossData = [];
    divergedEl.style.display = 'none';
    chart.setOption(getChartOpt([]));
    epochEl.textContent = '0';
    accEl.textContent = '—';
    accEl.className = 'stat-value';
    lossEl.textContent = '—';
    liveLossEl.textContent = 'Loss: —';
    renderCanvas();
  });

  /* ── 6. Initial render ─────────────────────────────────────── */
  updateField();
  renderCanvas();
  updateStats();

  /* ── 7. Resize handling ────────────────────────────────────── */
  Deck.onResize(function() {
    chart.resize();
    renderCanvas();
  });

})();
</script>
</body>
</html>
