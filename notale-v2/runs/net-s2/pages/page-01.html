<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{
    display:flex;
    flex-direction:column;
  }

  .p01-main{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:0;
    text-align:center;
    padding:0;
    overflow:hidden;
  }
  .p01-kicker{ margin-bottom:22px; }
  .p01-claim-box{ margin-bottom:26px; }

  .p01-kicker{
    display:flex;
    justify-content:center;
    gap:16px;
    font-size:20px;
    color:var(--muted);
    letter-spacing:6px;
    font-weight:700;
    text-transform:uppercase;
    font-family:var(--font-sans);
  }
  .p01-kicker::after{
    content:'';
    display:block;
    width:220px;
    height:3px;
    background:var(--primary);
    margin:12px auto 0;
  }

  .p01-claim-box{
    border:4px solid var(--primary);
    border-radius:28px;
    background:var(--primary-08);
    padding:52px 60px;
    width:100%;
    box-shadow:0 0 0 14px var(--primary-08);
  }

  .p01-claim{
    font-size:94px;
    font-weight:700;
    line-height:1.42;
    color:var(--primary);
    font-family:var(--font-sans);
    margin:0;
  }
  .p01-claim .line{ display:block; }

  .p01-lead{
    font-size:30px;
    line-height:1.6;
    color:var(--text);
    width:100%;
    margin:0 0 16px;
  }
  .p01-lead .accent{ color:var(--primary); font-weight:600; }

  .p01-tags{
    display:flex;
    justify-content:center;
    gap:40px;
    width:100%;
  }
  .p01-tags .tag{
    flex:1 1 0;
    flex-direction:column;
    justify-content:center;
    gap:26px;
    font-size:33px;
    font-weight:700;
    padding:74px 24px;
    border-radius:20px;
    border-width:2.5px;
    letter-spacing:1px;
    background:var(--primary-16);
  }
  .p01-tags .tag .idx{
    font-family:var(--font-mono);
    font-size:16px;
    font-weight:700;
    color:var(--primary);
    letter-spacing:2px;
  }
  .p01-tags .tag .sub{
    font-size:24px;
    font-weight:500;
    color:var(--muted);
    letter-spacing:0;
  }

  .p01-hint{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    padding:14px 0;
    border-top:1px solid var(--line);
  }
  .p01-hint .arrow{
    color:var(--primary);
    font-size:26px;
    font-weight:700;
  }
  .p01-hint .txt{
    font-size:26px;
    color:var(--muted);
    line-height:1.5;
  }
  .p01-hint .txt .seg + .seg{ margin-left:8px; }
</style>
</head>
<body data-page="01" data-total="19">
<div id="stage">
  <div class="p01-main">
    <div class="p01-kicker"><span>HOW</span><span>LEARNING</span><span>WORKS</span></div>
    <div class="p01-claim-box">
      <h1 class="p01-claim"><span class="line">神经网络怎么学会的？</span><span class="line">拆成能亲手操作的几步</span></h1>
    </div>
    <p class="p01-lead"><span class="seg">接下来30分钟</span><span class="seg">你会亲手拖滑块、看误差往下走</span>——<span class="seg accent">"学习"从头到尾就是这几步动作的反复</span></p>
    <div class="p01-tags">
      <span class="tag"><span class="idx">01</span><span class="main">拖动一个滑块</span><span class="sub">改变一个参数的取值</span></span>
      <span class="tag"><span class="idx">02</span><span class="main">看误差往下走</span><span class="sub">判断对错换算成一个数</span></span>
      <span class="tag"><span class="idx">03</span><span class="main">把动作重复多次</span><span class="sub">同一步骤反复执行到收敛</span></span>
    </div>
  </div>
  <div class="p01-hint">
    <span class="arrow">→</span>
    <span class="txt"><span class="seg">这几步动作要从哪里开始拆？</span><span class="seg">先看看你自己每天都在做的一个判断</span></span>
  </div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
