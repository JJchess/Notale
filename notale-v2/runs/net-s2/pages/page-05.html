<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{ display:flex; flex-direction:column; }

  .p5-head{ flex:0 0 auto; display:flex; flex-direction:column; gap:6px; padding-top:2px; }
  .p5-kicker{
    font-family:var(--font-mono);
    font-size:15px; letter-spacing:.14em; font-weight:600;
    color:var(--accent); text-transform:uppercase;
  }
  .p5-title{ font-size:var(--fs-h1); font-weight:700; color:var(--text); margin:0; line-height:1.3; }

  .p5-main{ flex:1; min-height:0; display:flex; flex-direction:column; gap:16px; padding-top:8px; }

  /* level 1 : shared count box, full width */
  .p5-count{
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:stretch; gap:10px;
    padding:14px 36px 16px;
    border:2px solid var(--line-strong);
    border-radius:10px;
    background:var(--panel-bg);
  }
  .p5-count-head{ display:flex; align-items:baseline; justify-content:center; gap:16px; }
  .p5-count-head .h{ font-size:var(--fs-h2); font-weight:700; color:var(--text); font-family:var(--font-mono); letter-spacing:.01em; }
  .p5-count-head .s{ font-size:var(--fs-label); color:var(--muted); }

  .p5-gridrow{ display:flex; align-items:center; gap:14px; }
  .p5-gridrow .rowlabel{ flex:0 0 46px; font-size:var(--fs-label); font-weight:700; text-align:right; }
  .p5-gridrow.a .rowlabel{ color:var(--primary); }
  .p5-gridrow.b .rowlabel{ color:var(--accent); }
  .p5-gridcells{ display:flex; gap:8px; flex:1; justify-content:space-between; }
  .p5-cell{ width:16px; height:16px; border-radius:50%; background:var(--line-strong); flex:0 0 auto; }
  .p5-gridrow.a .p5-cell.err{ background:var(--panel-bg); border:3px solid var(--primary); box-sizing:border-box; }
  .p5-gridrow.b .p5-cell.err{ background:var(--panel-bg); border:3px solid var(--accent); box-sizing:border-box; }
  .p5-gridnote{ text-align:center; font-size:var(--fs-label); color:var(--muted); }

  /* connector between level1 and level2 */
  .p5-connector{ position:relative; height:40px; flex:0 0 40px; }
  .p5-connector svg{ position:absolute; inset:0; width:100%; height:100%; }

  /* level 2+3 : two branches, full width */
  .p5-branches{ flex:1; min-height:0; display:flex; gap:40px; align-items:stretch; }
  .p5-branch{
    flex:1; min-width:0;
    display:flex; flex-direction:column; gap:8px;
    padding:16px 30px 18px;
    border:2px solid var(--line);
    border-radius:12px;
    background:var(--panel-bg);
  }
  .p5-branch.lineA{ border-color:var(--primary); }
  .p5-branch.lineB{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }

  .p5-branch-head{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
  .p5-dot{ width:14px; height:14px; border-radius:50%; flex:0 0 auto; }
  .p5-dot.a{ background:var(--primary); }
  .p5-dot.b{ background:var(--accent); }
  .p5-branch-name{ font-size:var(--fs-sec); font-weight:700; color:var(--text); }
  .p5-badge{
    margin-left:auto; font-size:var(--fs-label); font-weight:700;
    color:#fff; background:var(--accent); border-radius:5px; padding:2px 10px;
  }

  .p5-line{ position:relative; flex:1; min-height:0; }
  .p5-line svg{ position:absolute; inset:0; width:100%; height:100%; }

  .p5-lossrow{ display:flex; align-items:baseline; gap:14px; flex:0 0 auto; padding-top:8px; border-top:1px dashed var(--line); }
  .p5-losslabel{ font-size:var(--fs-label); color:var(--muted); }
  .p5-lossval{ font-family:var(--font-mono); font-weight:700; font-size:var(--fs-big-sm); }
  .p5-branch.lineB .p5-lossval{ color:var(--accent); }
  .p5-branch.lineA .p5-lossval{ color:var(--primary); }
  .p5-losssub{ font-size:var(--fs-label); color:var(--muted); }

  .p5-foot{ flex:0 0 auto; display:flex; flex-direction:column; gap:8px; padding-top:10px; border-top:1px solid var(--line); }
  .p5-lead{ font-size:var(--fs-lead); color:var(--text); line-height:1.5; }
  .p5-lead b{ color:var(--accent); font-weight:700; }
  .p5-next{ font-size:var(--fs-body); color:var(--muted); line-height:1.4; }
  .p5-next b{ color:var(--text); font-weight:700; }
</style>
</head>
<body data-page="05" data-total="19">
<div id="stage">

  <div class="p5-head">
    <div class="p5-kicker">COUNT ≠ LOSS</div>
    <h1 class="p5-title">都分对30个，谁更接近正确？</h1>
  </div>

  <div class="p5-main">

    <div class="p5-count">
      <div class="p5-count-head">
        <span class="h">40 个样本 · 30 对 10 错（75%）</span>
        <span class="s">两条线数出来的"对错个数"完全一样</span>
      </div>
      <div class="p5-gridrow a">
        <span class="rowlabel">线A</span>
        <span class="p5-gridcells" id="rowA"></span>
      </div>
      <div class="p5-gridrow b">
        <span class="rowlabel">线B</span>
        <span class="p5-gridcells" id="rowB"></span>
      </div>
      <div class="p5-gridnote">空心 = 判断错的那10个 —— 位置、个数完全一样，数量层面打平</div>
    </div>

    <div class="p5-connector">
      <svg viewBox="0 0 100 40" preserveAspectRatio="none">
        <path d="M 50 0 L 50 13" fill="none" stroke="var(--line-strong)" stroke-width="1.6"/>
        <path d="M 50 13 L 25 13 L 25 40" fill="none" stroke="var(--primary)" stroke-width="1.6"/>
        <path d="M 50 13 L 75 13 L 75 40" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
      </svg>
    </div>

    <div class="p5-branches">
      <div class="p5-branch lineA">
        <div class="p5-branch-head">
          <span class="p5-dot a"></span>
          <span class="p5-branch-name">线A：40个预测值，实际落在哪</span>
        </div>
        <div class="p5-line">
          <svg viewBox="0 0 700 210" preserveAspectRatio="none" id="lineA-svg"></svg>
        </div>
        <div class="p5-lossrow">
          <span class="p5-losslabel">平均 loss</span>
          <span class="p5-lossval" id="lossA">–</span>
          <span class="p5-losssub">10个错误点只是刚过界，误差不大</span>
        </div>
      </div>

      <div class="p5-branch lineB">
        <div class="p5-branch-head">
          <span class="p5-dot b"></span>
          <span class="p5-branch-name">线B：40个预测值，实际落在哪</span>
          <span class="p5-badge">更差</span>
        </div>
        <div class="p5-line">
          <svg viewBox="0 0 700 210" preserveAspectRatio="none" id="lineB-svg"></svg>
        </div>
        <div class="p5-lossrow">
          <span class="p5-losslabel">平均 loss</span>
          <span class="p5-lossval" id="lossB">–</span>
          <span class="p5-losssub">10个错误点完全反了，误差很大</span>
        </div>
      </div>
    </div>

  </div>

  <div class="p5-foot">
    <div class="p5-lead">数对错个数会把好坏不同的两条线判成"一样"；换成连续的 <b>loss</b> 数值，才能看出谁离正确答案更近。</div>
    <div class="p5-next">下一问：<b>loss 能分出好坏，那它该怎么告诉参数往哪边挪？</b></div>
  </div>

</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function(){
  var ERR = new Set([3,7,11,15,19,23,27,31,35,39]); // 10 of 40, shared error positions for both rows
  function buildRow(id){
    var host = document.getElementById(id);
    for (var i=0;i<40;i++){
      var d = document.createElement('span');
      d.className = 'p5-cell' + (ERR.has(i) ? ' err' : '');
      host.appendChild(d);
    }
  }
  buildRow('rowA');
  buildRow('rowB');

  // ---- build 40 (pred, trueLabel) samples per line, deterministic (no randomness) ----
  // 15 correct true=1, 15 correct true=0, 5 error true=1, 5 error true=0  => 40 total, 10 errors
  function buildSamples(errPredTrue1, errPredTrue0){
    var out = [];
    for (var i=0;i<15;i++) out.push({ pred: Math.min(0.99, 0.80 + i*0.012), t:1, ok:true });
    for (var i=0;i<15;i++) out.push({ pred: Math.max(0.01, 0.20 - i*0.012), t:0, ok:true });
    for (var i=0;i<5;i++)  out.push({ pred: errPredTrue1 + (i-2)*0.014, t:1, ok:false });
    for (var i=0;i<5;i++)  out.push({ pred: errPredTrue0 + (i-2)*0.014, t:0, ok:false });
    return out;
  }
  var samplesA = buildSamples(0.45, 0.55);
  var samplesB = buildSamples(0.05, 0.95);

  function avgLoss(samples){
    var sum = 0;
    for (var i=0;i<samples.length;i++) sum += Lec.P.mse([samples[i].pred], [samples[i].t]);
    return sum / samples.length;
  }
  var lossA = avgLoss(samplesA);
  var lossB = avgLoss(samplesB);
  document.getElementById('lossA').textContent = '≈' + lossA.toFixed(2);
  document.getElementById('lossB').textContent = '≈' + lossB.toFixed(2);

  // ---- draw scatter: x = pred position on 0..1 axis, two rows (true=1 upper, true=0 lower) ----
  var W = 700, PAD = 34;
  function xOf(v){ return PAD + v*(W-2*PAD); }
  function axisSvg(color, samples){
    var rowsY = { 1: 62, 0: 168 };
    var truthX = { 1: xOf(1), 0: xOf(0) };
    var html = '';
    // main axis
    html += '<line x1="'+PAD+'" y1="115" x2="'+(W-PAD)+'" y2="115" stroke="var(--line-strong)" stroke-width="1.6"/>';
    html += '<line x1="'+PAD+'" y1="108" x2="'+PAD+'" y2="122" stroke="var(--line-strong)" stroke-width="1.6"/>';
    html += '<line x1="'+xOf(0.5)+'" y1="108" x2="'+xOf(0.5)+'" y2="122" stroke="var(--line)" stroke-width="1.6" stroke-dasharray="3,3"/>';
    html += '<line x1="'+(W-PAD)+'" y1="108" x2="'+(W-PAD)+'" y2="122" stroke="var(--line-strong)" stroke-width="1.6"/>';
    html += '<text x="'+PAD+'" y="138" font-size="13" fill="var(--muted)" text-anchor="middle" font-family="var(--font-mono)">0</text>';
    html += '<text x="'+xOf(0.5)+'" y="138" font-size="13" fill="var(--muted)" text-anchor="middle">阈值0.5</text>';
    html += '<text x="'+(W-PAD)+'" y="138" font-size="13" fill="var(--muted)" text-anchor="middle" font-family="var(--font-mono)">1</text>';
    html += '<text x="'+PAD+'" y="40" font-size="14" fill="var(--muted)">真实标签=1 的 20 个点 → 应落在最右</text>';
    html += '<text x="'+(W-PAD)+'" y="148" font-size="14" fill="var(--muted)" text-anchor="end">真实标签=0 的 20 个点 → 应落在最左</text>';

    // count per true-group for spreading dots vertically to avoid full overlap
    var counters = {1:0, 0:0};
    for (var i=0;i<samples.length;i++){
      var s = samples[i];
      var cx = xOf(s.pred);
      var cy = rowsY[s.t] + (counters[s.t]%2===0 ? -9 : 9);
      counters[s.t]++;
      if (s.ok){
        html += '<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="var(--line-strong)"/>';
      } else {
        html += '<circle cx="'+cx+'" cy="'+cy+'" r="7.5" fill="var(--panel-bg)" stroke="'+color+'" stroke-width="2.5"/>';
      }
    }
    // dashed link from truth marker to the error cluster midpoint, per group
    [1,0].forEach(function(t){
      var errs = samples.filter(function(s){ return s.t===t && !s.ok; });
      if (!errs.length) return;
      var midPred = errs.reduce(function(a,s){return a+s.pred;},0)/errs.length;
      html += '<line x1="'+truthX[t]+'" y1="'+rowsY[t]+'" x2="'+xOf(midPred)+'" y2="'+rowsY[t]+'" stroke="'+color+'" stroke-width="1.6" stroke-dasharray="2,4" opacity="0.55"/>';
      html += '<circle cx="'+truthX[t]+'" cy="'+rowsY[t]+'" r="4" fill="none" stroke="var(--muted)" stroke-width="1.4"/>';
    });
    return html;
  }
  document.getElementById('lineA-svg').innerHTML = axisSvg('var(--primary)', samplesA);
  document.getElementById('lineB-svg').innerHTML = axisSvg('var(--accent)', samplesB);
})();
</script>
</body>
</html>
