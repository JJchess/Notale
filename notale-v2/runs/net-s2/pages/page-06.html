<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{ gap:0; }

  .p6-head{ flex:0 0 auto; display:flex; flex-direction:column; gap:6px; margin-bottom:18px; }
  .p6-kicker{
    font-size: var(--fs-label);
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
  }
  .p6-h1{ font-size:var(--fs-h1); font-weight:700; line-height:1.28; max-width:1200px; }

  .p6-main{ flex:1; min-height:0; display:flex; flex-direction:row; gap:36px; }
  .p6-left{ flex:0 0 400px; min-width:0; min-height:0; display:flex; flex-direction:column; }
  .p6-right{ flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; }

  /* 左栏：三步过程 */
  .p6-left .k-process.vert{ flex:1; gap:0; justify-content:space-between; }
  .p6-left .k-process.vert .step{
    width:100%;
    box-sizing:border-box;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:16px 20px;
    border-radius:12px;
  }
  .p6-badge{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%;
    border:2px solid var(--primary); color:var(--primary);
    font-size:var(--fs-label); font-weight:700; flex:0 0 auto;
  }
  .p6-step-hd{ display:flex; align-items:center; gap:10px; }
  .p6-step-title{ font-size:var(--fs-sec); font-weight:700; color:var(--text); }
  .p6-step-body{ font-size:var(--fs-body); line-height:1.4; color:var(--text); }

  .p6-readouts{ display:flex; gap:28px; align-items:baseline; }
  .p6-readout .lbl{ font-size:var(--fs-label); color:var(--muted); margin-right:6px; }

  .p6-grad-line{ font-size:var(--fs-body); line-height:1.45; color:var(--text); }
  .p6-grad-line strong{ color:var(--primary); }

  input[type="range"]{ margin-top:2px; }

  /* 右栏：图表面板 */
  .p6-panel{ flex:1; min-height:0; display:flex; flex-direction:column; gap:12px; }
  .p6-chartwrap{ flex:1; min-height:0; position:relative; }
  #p6chart{ position:absolute; inset:0; width:100%; height:100%; }

  .p6-foot{ flex:0 0 auto; margin-top:16px; display:flex; flex-direction:column; gap:6px; }
  .p6-lead{ font-size:var(--fs-lead); line-height:1.5; color:var(--text); }
  .p6-next{ font-size:var(--fs-sec); color:var(--muted); }

</style>
</head>
<body data-page="06" data-total="19">
<div id="stage">

  <div class="p6-head">
    <div class="p6-kicker">SLOPE READS DIRECTION</div>
    <h1 class="p6-h1">这条曲线在你脚下的坡度，就是这个权重该往哪边挪的答案</h1>
  </div>

  <div class="p6-main">

    <div class="p6-left">
      <div class="k-process vert no-pan" id="p6proc">
        <div class="axis"></div>

        <div class="step" id="p6step1">
          <div class="p6-step-hd"><span class="p6-badge">1</span><span class="p6-step-title">挪滑块</span></div>
          <div class="p6-step-body">这是网络里唯一能调的权重 w。输入 x=2、目标 y=1、偏置固定为 0，都不能改。</div>
          <div class="ctl">
            <label for="p6w" style="flex:0 0 auto;">w</label>
            <input id="p6w" type="range" min="-1.5" max="2.5" step="0.01" value="-0.3"
                   aria-label="权重 w，范围 -1.5 到 2.5" style="flex:1;">
          </div>
        </div>

        <div class="step" id="p6step2">
          <div class="p6-step-hd"><span class="p6-badge">2</span><span class="p6-step-title">看当前点</span></div>
          <div class="p6-step-body">橙色圆点是这次判断的位置，它的高度就是当前的误差。</div>
          <div class="p6-readouts">
            <div class="p6-readout"><span class="lbl">w</span><span class="big sm num" id="p6wval">-0.30</span></div>
            <div class="p6-readout"><span class="lbl">loss</span><span class="big sm accent num" id="p6lval">2.56</span></div>
          </div>
        </div>

        <div class="step" id="p6step3">
          <div class="p6-step-hd"><span class="p6-badge">3</span><span class="p6-step-title">读坡度</span></div>
          <div class="p6-grad-line" id="p6gradtext" aria-live="polite">坡度为<strong>负</strong>，脚下往右是下坡——该增大 w。</div>
        </div>
      </div>
    </div>

    <div class="p6-right">
      <div class="p6-panel panel">
        <div class="legend">
          <span class="li"><span class="sw accent"></span>当前点（这次判断）</span>
          <span class="li"><span class="sw line"></span>坡度方向（该往哪边挪）</span>
        </div>
        <div class="p6-chartwrap no-pan">
          <div id="p6chart"></div>
        </div>
      </div>
    </div>

  </div>

  <div class="p6-foot">
    <div class="p6-lead">曲线上任意一点，往坡度更低的一侧挪一点，loss 就会变小——这就是"学习"的最小动作。</div>
    <div class="p6-next">不管从曲线的哪个位置起步，一直顺着坡度往下走，会走到哪里？</div>
  </div>

</div>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(function(){
  Deck.init({ index:6, total:19 });

  function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  var COLOR = {
    primary: cssVar('--primary'),
    accent:  cssVar('--accent'),
    line:    cssVar('--line'),
    muted:   cssVar('--muted'),
    text:    cssVar('--text')
  };

  var X_MIN = -1.5, X_MAX = 2.5;
  var Y_MAX = 16;

  // loss(w) = mse(2w, 1) —— 用 Lec.P 现算，不预录数值
  function lossFn(warr){
    var z = Lec.P.weightedSum([2], [warr[0]], 0);
    return Lec.P.mse([z], [1]);
  }
  function lossOf(w){ return lossFn([w]); }
  function gradOf(w){ return Lec.P.numericalGradient(lossFn, [w], Lec.K.NUM_GRAD_H)[0]; }

  // 预采样曲线
  var N = 100;
  var curveData = [];
  for (var i = 0; i < N; i++) {
    var w = X_MIN + (X_MAX - X_MIN) * i / (N - 1);
    curveData.push([w, lossOf(w)]);
  }

  var chartDom = document.getElementById('p6chart');
  var chart = echarts.init(chartDom, null, { renderer: 'svg' });

  var baseOption = {
    grid: { left: 62, right: 30, top: 26, bottom: 52 },
    xAxis: {
      type: 'value', min: X_MIN, max: X_MAX,
      name: 'w（权重）', nameLocation: 'middle', nameGap: 30,
      nameTextStyle: { fontSize: 15, color: COLOR.text },
      axisLabel: { fontSize: 13, color: COLOR.muted },
      axisLine: { lineStyle: { color: COLOR.line } },
      splitLine: { lineStyle: { color: COLOR.line } }
    },
    yAxis: {
      type: 'value', min: 0, max: Y_MAX,
      name: 'loss', nameLocation: 'middle', nameGap: 44,
      nameTextStyle: { fontSize: 15, color: COLOR.text },
      axisLabel: { fontSize: 13, color: COLOR.muted },
      axisLine: { lineStyle: { color: COLOR.line } },
      splitLine: { lineStyle: { color: COLOR.line } }
    },
    series: [{
      type: 'line',
      data: curveData,
      showSymbol: false,
      smooth: false,
      lineStyle: { color: COLOR.primary, width: 3 },
      z: 2
    }],
    graphic: []
  };
  chart.setOption(baseOption);

  var NEAR_EPS = 0.15; // |grad| 小于此值视为到谷底

  function updateGraphic(w){
    var loss = lossOf(w);
    var grad = gradOf(w);
    var pix = chart.convertToPixel({ xAxisIndex: 0, yAxisIndex: 0 }, [w, loss]);
    var px = pix[0], py = pix[1];
    var near = Math.abs(grad) < NEAR_EPS;

    var graphics = [
      { id: 'p6pt', type: 'circle', shape: { cx: px, cy: py, r: 9 },
        style: { fill: COLOR.accent, stroke: '#fff', lineWidth: 2 }, z: 10 }
    ];

    if (!near) {
      var dir = grad < 0 ? 1 : -1; // 负梯度 -> 向右下(增大w)；正梯度 -> 向左下(减小w)
      var dx = dir * 52, dy = 34;
      var tipx = px + dx, tipy = py + dy;
      var ang = Math.atan2(dy, dx);
      var s = 12;
      var a1x = tipx - s * Math.cos(ang - 0.5), a1y = tipy - s * Math.sin(ang - 0.5);
      var a2x = tipx - s * Math.cos(ang + 0.5), a2y = tipy - s * Math.sin(ang + 0.5);

      graphics.push({ id: 'p6ln', type: 'line',
        shape: { x1: px, y1: py, x2: tipx, y2: tipy },
        style: { stroke: COLOR.primary, lineWidth: 4 }, z: 9 });
      graphics.push({ id: 'p6head', type: 'polygon',
        shape: { points: [[tipx, tipy], [a1x, a1y], [a2x, a2y]] },
        style: { fill: COLOR.primary }, z: 9 });
      graphics.push({ id: 'p6msg', type: 'text',
        style: { text: '', fill: COLOR.primary, fontSize: 16, fontWeight: 'bold' },
        x: 0, y: 0 });
    } else {
      graphics.push({ id: 'p6ln', type: 'line',
        shape: { x1: px, y1: py, x2: px, y2: py },
        style: { stroke: 'transparent', lineWidth: 0 } });
      graphics.push({ id: 'p6head', type: 'polygon',
        shape: { points: [[px, py], [px, py], [px, py]] },
        style: { fill: 'transparent' } });
      var mx = px, my = py - 26;
      var align = 'center';
      if (mx < 90) align = 'left';
      if (mx > chartDom.clientWidth - 90) align = 'right';
      graphics.push({ id: 'p6msg', type: 'text',
        style: { text: '到谷底了', fill: COLOR.primary, fontSize: 16, fontWeight: 'bold', align: align },
        x: mx, y: my });
    }

    chart.setOption({ graphic: graphics });

    // 左栏文字读数
    document.getElementById('p6wval').textContent = w.toFixed(2);
    document.getElementById('p6lval').textContent = loss.toFixed(2);

    var gradText;
    if (near) {
      gradText = '坡度接近 0——到谷底了，误差已经降不动了。';
    } else if (grad < 0) {
      gradText = '坡度为<strong>负</strong>，脚下往右是下坡——该增大 w。';
    } else {
      gradText = '坡度为<strong>正</strong>，脚下往左是下坡——该减小 w。';
    }
    document.getElementById('p6gradtext').innerHTML = gradText;
  }

  var slider = document.getElementById('p6w');
  slider.addEventListener('input', function(){
    updateGraphic(parseFloat(slider.value));
  });

  updateGraphic(parseFloat(slider.value));

  var offResize = Deck.onResize(function(){ chart.resize(); updateGraphic(parseFloat(slider.value)); });

  window.addEventListener('pagehide', function(){
    offResize && offResize();
    chart.dispose();
  });
})();
</script>
</body>
</html>
