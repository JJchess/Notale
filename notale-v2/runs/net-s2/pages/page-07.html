<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{ gap:18px; }

  .head{ flex:0 0 auto; }
  .kicker{
    font-size: var(--fs-label);
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  #gen{ flex:1; min-height:0; gap:14px; }
  #gen .claim{
    font-size: var(--fs-h1);
    line-height: 1.25;
    padding: 12px 22px;
  }
  #gen .trunk{ min-height:16px; }
  #gen .supports{ flex:1; min-height:0; margin-top:0; }

  .chart-row{
    display:flex;
    gap: 26px;
    height: 100%;
    align-items: stretch;
  }
  .chart-wrap{
    position: relative;
    flex: 0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--panel-bg);
    border: 2px solid var(--line);
    border-radius: 14px;
  }
  #chart{ display:block; cursor: pointer; }
  #chart.disabled{ cursor: default; }

  .side-panel{
    flex: 0 0 380px;
    display:flex;
    flex-direction: column;
    gap: 16px;
    height: 100%;
    box-sizing: border-box;
  }
  .side-panel .legend{ font-size: var(--fs-label); }
  .side-panel .hint{ font-size: var(--fs-label); }

  .ctl-block .ctl-label{
    display:flex;
    justify-content: space-between;
    font-size: var(--fs-label);
    color: var(--text);
    margin-bottom: 8px;
  }
  .ctl-block .ctl-label .num{ color: var(--accent); font-weight:700; }

  .readouts{ display:flex; flex-direction:column; gap:10px; }
  .ro{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .ro .lbl{ font-size: var(--fs-label); color: var(--muted); }
  .ro .val{ font-family: var(--font-mono); font-size: var(--fs-big-sm); font-weight:700; color: var(--primary); font-variant-numeric: tabular-nums; }
  .ro .val.accent{ color: var(--accent); }
  .ro .val .u{ font-family: var(--font-sans); font-size: var(--fs-label); color: var(--muted); margin-left:4px; font-weight:400; }

  .btns{ margin-top:auto; }
  .btn:disabled{ cursor:not-allowed; }

  .foot{ flex:0 0 auto; display:flex; flex-direction:column; gap:6px; }

  /* --- svg 元素样式（原生 SVG，用 CSS var 上色） --- */
  .grid-line{ stroke: var(--line); stroke-width:1; }
  .axis-line{ stroke: var(--line-strong); stroke-width:1.5; }
  .axis-tick{ fill: var(--muted); font-size: 13px; font-family: var(--font-sans); }
  .axis-label{ fill: var(--muted); font-size: 14px; font-family: var(--font-sans); font-weight:600; }
  .curve-path{ fill:none; stroke: var(--line-strong); stroke-width: 3; }
  .valley-line{ stroke: var(--primary); stroke-width:1.5; stroke-dasharray: 4 4; opacity:.6; }
  .valley-label{ fill: var(--primary); font-size:13px; font-family: var(--font-sans); font-weight:700; }

  .ref-path{ fill:none; stroke: var(--primary); stroke-width:2; stroke-dasharray: 5 5; opacity:.65; }
  .ref-dot{ fill: var(--primary); opacity:.55; }
  .ref-start{ fill: var(--panel-bg); stroke: var(--primary); stroke-width:2.5; }
  .ref-end{ fill: var(--primary); }
  .ref-label{ fill: var(--primary); font-size:14px; font-weight:700; font-family: var(--font-sans); }

  .pending-dot{ fill: var(--panel-bg); stroke: var(--accent); stroke-width:3; }
  .active-path{ fill:none; stroke: var(--accent); stroke-width:3; }
  .active-dot{ fill: var(--accent); stroke: var(--panel-bg); stroke-width:2; }

  .click-overlay{ fill: transparent; }

  @media (prefers-reduced-motion: reduce){
    #chart *{ transition: none !important; }
  }
</style>
</head>
<body data-page="07" data-total="19">
<div id="stage">

  <div class="head">
    <div class="kicker">ANY-START-SAME-VALLEY</div>
  </div>

  <div class="k-generalization" id="gen">
    <div class="claim">不管从曲线哪里出发，坡度都会把你带到同一个谷底</div>
    <div class="trunk"></div>
    <div class="supports">
      <div class="chart-row">

        <div class="chart-wrap min0 no-pan">
          <svg id="chart" width="940" height="560" viewBox="0 0 940 560"
               role="img" aria-label="误差曲线：横轴是权重 w，纵轴是 loss。三条深蓝虚线是已经走完的参考轨迹 A、B、C，都收敛到 w≈3 的谷底。橙色圆点是你选的新起点。">
            <defs>
              <clipPath id="plotClip"><rect x="70" y="24" width="820" height="486"></rect></clipPath>
            </defs>

            <g id="gridLayer"></g>
            <g id="axisLayer"></g>

            <line id="valleyLine" class="valley-line"></line>
            <text id="valleyLabel" class="valley-label"></text>

            <path id="curvePath" class="curve-path" clip-path="url(#plotClip)"></path>

            <g id="refLayer"></g>

            <g id="activeLayer">
              <path id="activePath" class="active-path"></path>
              <circle id="activeDot" class="active-dot" r="8" visibility="hidden"></circle>
            </g>

            <circle id="pendingDot" class="pending-dot" r="7"></circle>

            <rect id="clickOverlay" class="click-overlay" x="0" y="0" width="940" height="560"
                  tabindex="-1" aria-hidden="true"></rect>
          </svg>
        </div>

        <div class="panel side-panel min0">
          <div class="legend">
            <span class="li"><span class="sw line dash" style="border-color:var(--primary)"></span>参考轨迹 A / B / C（常显）</span>
            <span class="li"><span class="sw accent"></span>你选的新起点</span>
          </div>

          <p class="hint" id="instr" aria-live="polite">拖动下面的滑块，或直接点曲线上的一点，选一个新的起点；再按"开始下坡"，看它是不是也会滑到同一个谷底。</p>

          <div class="ctl-block">
            <div class="ctl-label">
              <label for="wSlider">新起点 w</label>
              <span>w ≈ <span class="num" id="wSliderVal">6.00</span></span>
            </div>
            <div class="ctl">
              <input type="range" id="wSlider" min="-1" max="7" step="0.1" value="6"
                     aria-label="选择新起点的权重 w，范围 -1 到 7">
            </div>
          </div>

          <div class="readouts">
            <div class="ro">
              <span class="lbl">步数</span>
              <span class="val" id="stepNum">0<span class="u">/ 20</span></span>
            </div>
            <div class="ro">
              <span class="lbl">loss</span>
              <span class="val accent" id="lossNum">0.00</span>
            </div>
            <div class="ro">
              <span class="lbl">当前 w</span>
              <span class="val" id="wNowNum" style="font-size:var(--fs-lead)">0.00</span>
            </div>
          </div>

          <div class="btns">
            <button class="btn" id="startBtn" type="button">开始下坡</button>
            <button class="btn" id="resetBtn" type="button">复位</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="foot">
    <p class="lead">三条起点不同的轨迹，20步以内都从各自的高处滑到了同一处 loss≈0.05 附近的谷底——下坡这个动作对起点不敏感。</p>
    <p class="small">如果每一步跨得更大或更小，还能同样稳稳地走到谷底吗？</p>
  </div>

</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  'use strict';

  // ---------- 教学常量 / 公式（page-owned，非硬编码数值） ----------
  var LR = Lec.K.DEFAULT_LEARNING_RATE;   // 0.1
  var STEPS = 20;
  var VALLEY_W = 3;
  function lossFn(w){ return 0.5 * Math.pow(w - VALLEY_W, 2) + 0.05; }
  function gradFn(w){ return w - VALLEY_W; }

  var REF_STARTS = [
    { id:'A', label:'A', w0: 0.8 },
    { id:'B', label:'B', w0: 5.2 },
    { id:'C', label:'C', w0: 3.9 }
  ];
  var DEFAULT_PENDING_W = 6.0;

  // ---------- 比例尺 ----------
  var PLOT = { x0:70, x1:890, y0:24, y1:510 };
  var xScale = d3.scaleLinear().domain([-1, 7]).range([PLOT.x0, PLOT.x1]);
  var yScale = d3.scaleLinear().domain([0, 5]).range([PLOT.y1, PLOT.y0]);
  function clampY(loss){ return Deck.clamp(yScale(loss), PLOT.y0, PLOT.y1); }

  var lineGen = d3.line().x(function(d){ return xScale(d.w); }).y(function(d){ return yScale(d.loss); });

  var svg = document.getElementById('chart');
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // ---------- 静态：网格 + 坐标轴 ----------
  var gridLayer = document.getElementById('gridLayer');
  var axisLayer = document.getElementById('axisLayer');

  yScale.ticks(5).forEach(function(t){
    var y = yScale(t);
    gridLayer.appendChild(el('line', { class:'grid-line', x1:PLOT.x0, x2:PLOT.x1, y1:y, y2:y }));
    var txt = el('text', { class:'axis-tick', x: PLOT.x0 - 12, y: y + 4, 'text-anchor':'end' });
    txt.textContent = t.toFixed(0);
    axisLayer.appendChild(txt);
  });
  xScale.ticks(9).forEach(function(t){
    var x = xScale(t);
    var txt = el('text', { class:'axis-tick', x:x, y: PLOT.y1 + 22, 'text-anchor':'middle' });
    txt.textContent = t.toFixed(0);
    axisLayer.appendChild(txt);
  });
  axisLayer.appendChild(el('line', { class:'axis-line', x1:PLOT.x0, x2:PLOT.x1, y1:PLOT.y1, y2:PLOT.y1 }));
  axisLayer.appendChild(el('line', { class:'axis-line', x1:PLOT.x0, x2:PLOT.x0, y1:PLOT.y0, y2:PLOT.y1 }));
  var xLab = el('text', { class:'axis-label', x: PLOT.x1, y: PLOT.y1 + 44, 'text-anchor':'end' });
  xLab.textContent = 'w（权重）→';
  axisLayer.appendChild(xLab);
  var yLab = el('text', { class:'axis-label', x: PLOT.x0 - 12, y: PLOT.y0 - 8, 'text-anchor':'end' });
  yLab.textContent = 'loss ↑';
  axisLayer.appendChild(yLab);

  // 谷底标线
  var valleyX = xScale(VALLEY_W);
  var vl = document.getElementById('valleyLine');
  vl.setAttribute('x1', valleyX); vl.setAttribute('x2', valleyX);
  vl.setAttribute('y1', clampY(lossFn(VALLEY_W))); vl.setAttribute('y2', PLOT.y1);
  var vlab = document.getElementById('valleyLabel');
  vlab.setAttribute('x', valleyX + 8); vlab.setAttribute('y', PLOT.y1 - 8);
  vlab.textContent = '谷底 w≈3, loss≈0.05';

  // 误差曲线（完整解析式，一次性画出；只画 loss<=5 的部分，避免越出坐标系顶部）
  var curvePts = [];
  for (var i = 0; i <= 240; i++){
    var w = -1 + (8 * i / 240);
    var loss = lossFn(w);
    if (loss <= 5.02) curvePts.push({ w:w, loss: loss });
  }
  document.getElementById('curvePath').setAttribute('d', lineGen(curvePts));

  // ---------- 参考轨迹 A / B / C（静态常显） ----------
  var refLayer = document.getElementById('refLayer');
  REF_STARTS.forEach(function(ref){
    var trace = Lec.P.gradientDescentTrace(ref.w0, gradFn, LR, STEPS).map(function(p){
      return { w: p.x, loss: lossFn(p.x) };
    });
    var g = el('g', {});
    g.appendChild(el('path', { class:'ref-path', d: lineGen(trace) }));
    trace.forEach(function(p, idx){
      if (idx === 0 || idx === trace.length - 1) return;
      g.appendChild(el('circle', { class:'ref-dot', cx:xScale(p.w), cy:clampY(p.loss), r:2.4 }));
    });
    var start = trace[0], end = trace[trace.length - 1];
    g.appendChild(el('circle', { class:'ref-start', cx:xScale(start.w), cy:clampY(start.loss), r:7 }));
    g.appendChild(el('circle', { class:'ref-end', cx:xScale(end.w), cy:clampY(end.loss), r:5 }));
    var lab = el('text', { class:'ref-label', x:xScale(start.w) - 4, y:clampY(start.loss) - 14, 'text-anchor':'middle' });
    lab.textContent = ref.label;
    g.appendChild(lab);
    refLayer.appendChild(g);
  });

  // ---------- 交互状态 ----------
  var pendingDot = document.getElementById('pendingDot');
  var activePath = document.getElementById('activePath');
  var activeDot = document.getElementById('activeDot');
  var instr = document.getElementById('instr');
  var stepNum = document.getElementById('stepNum');
  var lossNum = document.getElementById('lossNum');
  var wNowNum = document.getElementById('wNowNum');
  var slider = document.getElementById('wSlider');
  var wSliderVal = document.getElementById('wSliderVal');
  var startBtn = document.getElementById('startBtn');
  var resetBtn = document.getElementById('resetBtn');
  var clickOverlay = document.getElementById('clickOverlay');

  var state = {
    pendingW: DEFAULT_PENDING_W,
    running: false,
    done: false,
    stopLoop: null
  };

  function setReadout(w, loss, stepLabel){
    wNowNum.textContent = w.toFixed(2);
    lossNum.textContent = loss.toFixed(3);
    stepNum.innerHTML = stepLabel + '<span class="u">/ 20</span>';
  }

  function renderPending(){
    var w = state.pendingW;
    var loss = lossFn(w);
    pendingDot.setAttribute('cx', xScale(w));
    pendingDot.setAttribute('cy', clampY(loss));
    pendingDot.setAttribute('visibility', state.running ? 'hidden' : 'visible');
    wSliderVal.textContent = w.toFixed(2);
    if (!state.running && !state.done){
      setReadout(w, loss, '0');
    }
  }

  function setControlsEnabled(enabled){
    slider.disabled = !enabled;
    startBtn.disabled = !enabled || state.running;
    clickOverlay.style.pointerEvents = enabled ? 'auto' : 'none';
    svg.classList.toggle('disabled', !enabled);
  }

  function clearActive(){
    activePath.setAttribute('d', '');
    activeDot.setAttribute('visibility', 'hidden');
  }

  function toInitialState(){
    if (state.stopLoop) { state.stopLoop(); state.stopLoop = null; }
    state.running = false;
    state.done = false;
    state.pendingW = DEFAULT_PENDING_W;
    slider.value = String(DEFAULT_PENDING_W);
    clearActive();
    renderPending();
    setControlsEnabled(true);
    instr.textContent = '拖动下面的滑块，或直接点曲线上的一点，选一个新的起点；再按"开始下坡"，看它是不是也会滑到同一个谷底。';
  }

  function onPendingChange(w){
    if (state.running) return;
    state.done = false;
    state.pendingW = Deck.clamp(w, -1, 7);
    clearActive();
    renderPending();
    instr.textContent = '起点已设为 w≈' + state.pendingW.toFixed(2) + '，loss≈' + lossFn(state.pendingW).toFixed(3) + '。按"开始下坡"看它落到哪。';
  }

  slider.addEventListener('input', function(){
    onPendingChange(parseFloat(slider.value));
  });

  function wFromPointer(e){
    var p = Deck.pt(svg, e);
    return xScale.invert(p.x);
  }
  function handleChartPick(e){
    if (state.running) return;
    var w = Deck.clamp(wFromPointer(e), -1, 7);
    slider.value = String(Math.round(w * 10) / 10);
    onPendingChange(w);
  }
  clickOverlay.addEventListener('pointerdown', handleChartPick);
  clickOverlay.addEventListener('click', handleChartPick);

  function runAnimation(){
    if (state.running) return;
    var w0 = state.pendingW;
    var trace = Lec.P.gradientDescentTrace(w0, gradFn, LR, STEPS).map(function(p){
      return { step: p.step, w: p.x, loss: lossFn(p.x) };
    });

    state.running = true;
    state.done = false;
    setControlsEnabled(false);
    pendingDot.setAttribute('visibility', 'hidden');
    activeDot.setAttribute('visibility', 'visible');
    instr.textContent = '下坡中……起点 w≈' + w0.toFixed(2) + '。';

    if (Deck.reduced()){
      activePath.setAttribute('d', lineGen(trace));
      var last = trace[trace.length - 1];
      activeDot.setAttribute('cx', xScale(last.w));
      activeDot.setAttribute('cy', clampY(last.loss));
      finishAnimation(trace);
      return;
    }

    var stepDur = 110; // ms
    var totalDur = stepDur * STEPS;
    var stop = Deck.loop(function(t){
      var raw = Deck.clamp(t / stepDur, 0, STEPS);
      var idx = Math.min(Math.floor(raw), STEPS - 1);
      var frac = raw - idx;
      var eased = 1 - Math.pow(1 - frac, 2);
      var curW = Deck.lerp(trace[idx].w, trace[idx + 1].w, eased);
      var curLoss = lossFn(curW);

      var pathPts = trace.slice(0, idx + 1).concat([{ w:curW, loss:curLoss }]);
      activePath.setAttribute('d', lineGen(pathPts));
      activeDot.setAttribute('cx', xScale(curW));
      activeDot.setAttribute('cy', clampY(curLoss));
      setReadout(curW, curLoss, String(Math.min(STEPS, Math.round(raw))));

      if (t >= totalDur){
        stop();
        state.stopLoop = null;
        activePath.setAttribute('d', lineGen(trace));
        var f = trace[trace.length - 1];
        activeDot.setAttribute('cx', xScale(f.w));
        activeDot.setAttribute('cy', clampY(f.loss));
        finishAnimation(trace);
      }
    });
    state.stopLoop = stop;
  }

  function finishAnimation(trace){
    state.running = false;
    state.done = true;
    var f = trace[trace.length - 1];
    setReadout(f.w, f.loss, String(STEPS));
    setControlsEnabled(true);
    instr.textContent = '到达谷底附近：w≈' + f.w.toFixed(2) + '，loss≈' + f.loss.toFixed(3) + '——和 A/B/C 一样，落点几乎相同。';
  }

  startBtn.addEventListener('click', runAnimation);
  resetBtn.addEventListener('click', function(){
    toInitialState();
    slider.focus();
  });

  // ---------- 初始态 ----------
  toInitialState();
})();
</script>
</body>
</html>
