<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .p09-hd{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .p09-hd .kicker{
    font:600 15px/1.2 var(--font-sans);
    letter-spacing:.14em;
    color:var(--accent);
    text-transform:uppercase;
  }
  .p09-hd h1{
    margin:0;
    font:700 34px/1.3 var(--font-sans);
    color:var(--text);
    max-width:1250px;
  }

  .p09-viz{
    flex:1;
    min-height:0;
    position:relative;
    display:flex;
    align-items:stretch;
    justify-content:center;
  }
  .p09-viz svg{
    width:100%;
    height:100%;
    display:block;
  }

  .p09-ft{
    flex:0 0 auto;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:32px;
    padding-top:6px;
    border-top:1px solid var(--line);
  }
  .p09-ft .concl{
    display:flex;
    flex-direction:column;
    gap:4px;
    max-width:980px;
  }
  .p09-ft .concl .lead{
    margin:0;
    font:600 19px/1.4 var(--font-sans);
    color:var(--text);
  }
  .p09-ft .concl .hook{
    margin:0;
    font:400 16px/1.4 var(--font-sans);
    color:var(--muted);
  }

  .p09-legend{
    list-style:none;
    margin:0 0 4px 0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:7px;
    flex:0 0 auto;
  }
  .p09-legend li{
    display:flex;
    align-items:center;
    gap:9px;
    font:400 14px/1.2 var(--font-sans);
    color:var(--muted);
    white-space:nowrap;
  }
  .p09-legend .sw{
    width:13px;height:13px;border-radius:50%;
    background:var(--primary);
    flex:0 0 auto;
    box-sizing:border-box;
  }
  .p09-legend .sw.hollow{
    background:var(--panel-bg);
    border:2px solid var(--primary);
  }
  .p09-legend .sw.line{
    width:20px;height:4px;border-radius:2px;
    background:var(--primary);
  }

  .p09-lbl{
    font:600 15px/1.2 var(--font-sans);
    fill:var(--text);
  }

  .p09-note{
    position:absolute;
    top:2px;
    left:50%;
    transform:translateX(-50%);
    font:400 14px/1.35 var(--font-sans);
    color:var(--muted);
    z-index:1;
    text-align:center;
    max-width:560px;
  }
</style>
</head>
<body data-page="09" data-total="19">
<div id="stage">

  <header class="p09-hd">
    <div class="kicker">LIMIT OF ONE NEURON</div>
    <h1>两类点绕圈分布，一条直线怎么摆都分不开</h1>
  </header>

  <main class="p09-viz">
    <div class="p09-note">同一份点阵、同一比例尺——三条直线叠在一起比，才看得出没有一条能把两类分开</div>
    <svg id="ringSvg" viewBox="0 0 1488 620" preserveAspectRatio="xMidYMid meet" role="img"
         aria-label="内圈20个实心点与外圈20个空心点呈环形分布，三条不同角度的直线尝试分界，均有点被分错">
    </svg>
  </main>

  <footer class="p09-ft">
    <div class="concl">
      <p class="lead">单个神经元只能画直线分界，遇到环绕的数据它就无能为力</p>
      <p class="hook">想要弯曲的边界，是不是该把神经元叠起来？</p>
    </div>
    <ul class="p09-legend">
      <li><span class="sw"></span>类 A（内圈，实心）</li>
      <li><span class="sw hollow"></span>类 B（外圈，空心）</li>
      <li><span class="sw line"></span>单神经元分界线尝试</li>
    </ul>
  </footer>

</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function(){
  const svg = document.getElementById('ringSvg');
  const NS = 'http://www.w3.org/2000/svg';
  const VW = 1488, VH = 620;
  const cx = VW*0.5, cy = VH*0.5;
  const Rout = 225, Rin = Rout*0.3; // 0.3 : 1.0 相对半径，按 plan 规定

  function el(tag, attrs){
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  const primary = 'var(--primary)';
  const line = 'var(--line)';
  const panelBg = 'var(--panel-bg)';

  // --- 共享坐标参照：淡十字轴 + 淡外框虚线圆，表明三条线共用同一比例尺 ---
  svg.appendChild(el('line', {x1:cx-Rout-60, y1:cy, x2:cx+Rout+60, y2:cy, stroke:line, 'stroke-width':1, 'stroke-dasharray':'3 5'}));
  svg.appendChild(el('line', {x1:cx, y1:cy-Rout-40, x2:cx, y2:cy+Rout+40, stroke:line, 'stroke-width':1, 'stroke-dasharray':'3 5'}));
  svg.appendChild(el('circle', {cx, cy, r:Rout+18, fill:'none', stroke:line, 'stroke-width':1, 'stroke-dasharray':'2 6'}));

  // --- 40 个数据点：内圈 20 实心（类 A），外圈 20 空心（类 B） ---
  const N = 20;
  const rPt = 7;
  for (let i=0;i<N;i++){
    const a = -Math.PI/2 + i*(2*Math.PI/N);
    const x = cx + Rin*Math.cos(a), y = cy + Rin*Math.sin(a);
    svg.appendChild(el('circle', {cx:x, cy:y, r:rPt, fill:primary, stroke:'none'}));
  }
  for (let i=0;i<N;i++){
    const a = -Math.PI/2 + Math.PI/N + i*(2*Math.PI/N); // 错开半步，避免与内圈完全对径
    const x = cx + Rout*Math.cos(a), y = cy + Rout*Math.sin(a);
    svg.appendChild(el('circle', {cx:x, cy:y, r:rPt, fill:panelBg, stroke:primary, 'stroke-width':2.5}));
  }

  // --- 三条分界线尝试：角度、偏移量固定，保证同时穿过内外圈 ---
  const attempts = [
    { deg: 6,   off: -16, labelSide: 1,  text:'仍有点分错' },   // 近水平，穿过点阵中段
    { deg: 45,  off: -30, labelSide: -1, text:'仍有点分错' },   // 斜45°，偏向左上
    { deg: -30, off: 28,  labelSide: 1,  text:'仍有点分错' },   // 斜-30°，偏向右下
  ];
  const halfLen = Rout + 95;

  attempts.forEach(function(atmpt){
    const th = atmpt.deg*Math.PI/180;
    const dir = { x: Math.cos(th), y: Math.sin(th) };
    const perp = { x: -Math.sin(th), y: Math.cos(th) };
    const ox = cx + perp.x*atmpt.off, oy = cy + perp.y*atmpt.off;
    const x1 = ox - dir.x*halfLen, y1 = oy - dir.y*halfLen;
    const x2 = ox + dir.x*halfLen, y2 = oy + dir.y*halfLen;
    svg.appendChild(el('line', {x1, y1, x2, y2, stroke:primary, 'stroke-width':4, 'stroke-linecap':'round'}));

    // 标注放在线段较空的一端外侧，避免压住点阵或彼此重叠
    const side = atmpt.labelSide;
    const lx = ox + dir.x*halfLen*side + perp.x*22*side;
    const ly = oy + dir.y*halfLen*side + perp.y*22*side;
    const anchor = (dir.x*side) > 0.15 ? 'start' : ((dir.x*side) < -0.15 ? 'end' : 'middle');
    const t = el('text', {x:lx, y:ly, class:'p09-lbl', 'text-anchor':anchor, 'dominant-baseline':'middle'});
    t.textContent = atmpt.text;
    svg.appendChild(t);
  });
})();
</script>
</body>
</html>
