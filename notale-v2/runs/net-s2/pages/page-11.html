<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .p11{ width:100%; height:100%; display:flex; flex-direction:column; min-height:0; }

  /* ---- 头部 ---- */
  .p11-head{ flex:0 0 auto; padding-bottom:10px; }
  .p11-head .kicker{
    font-size:16px; font-weight:700; letter-spacing:.06em;
    color:var(--primary); text-transform:uppercase; margin-bottom:4px;
  }
  .p11-head h1{ font-size:var(--fs-h1); line-height:1.25; max-width:1200px; }

  /* ---- 主体 ---- */
  .p11-main{
    flex:1; min-height:0; width:100%;
    display:flex; flex-direction:column; align-items:center;
    gap:10px;
  }
  .p11-main .claim{ margin:0; font-size:24px; padding:10px 22px; }
  .p11-main .trunk{ margin:0; width:4px; height:22px; min-height:0; }

  .k-generalization .compare.supports{
    flex:1; min-height:0; width:100%; max-width:1488px;
    display:flex; flex-direction:row; align-items:stretch;
    gap:0; margin:0; padding:0; border-left:none;
  }
  .pane{
    flex:1; min-width:0; min-height:0;
    display:flex; flex-direction:column; align-items:center;
    padding:6px 26px 0;
  }
  .pane + .pane{ border-left:2px solid var(--line); }
  .pane .ptitle{
    font-size:var(--fs-sec); font-weight:700; color:var(--text);
    margin-bottom:6px; text-align:center;
  }

  .icon-wrap{ flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; position:relative; }
  .icon-wrap svg{ width:100%; height:100%; max-height:100%; }

  .baseline{ width:100%; height:3px; background:var(--primary); border-radius:2px; margin:8px 0 10px; flex:0 0 auto; }

  .readout{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; }
  .readout .row1{ display:flex; align-items:baseline; gap:8px; }
  .readout .cap{ font-size:var(--fs-label); color:var(--muted); }

  .layer-tags{ display:flex; gap:10px; margin:6px 0 4px; flex:0 0 auto; }
  .layer-tags .tag{ font-size:14px; padding:2px 9px; }

  .breakdown{ width:100%; max-width:420px; flex:0 0 auto; margin-top:4px; }
  .breakdown .brow{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:4px 2px; border-bottom:1px solid var(--line); font-size:14px;
  }
  .breakdown .brow:last-child{ border-bottom:none; border-top:2px solid var(--text); margin-top:2px; padding-top:6px; font-weight:700; }
  .breakdown .brow .k{ color:var(--muted); }
  .breakdown .brow .v{ font-family:var(--font-mono); font-variant-numeric: tabular-nums; }
  .breakdown .brow:last-child .v{ color:var(--primary); font-size:16px; }

  /* svg 图元颜色：等高线/单参数下坡 */
  .icon-slope .ring{ fill:none; stroke:var(--primary); stroke-width:2; }
  .icon-slope .pt{ fill:var(--primary); }
  .icon-slope .arrow{ stroke:var(--primary); stroke-width:2.6; fill:none; }
  .icon-slope .arrowhead{ fill:var(--primary); }
  .icon-slope .axislabel{ font-size:14px; fill:var(--muted); font-family:var(--font-sans); }
  .icon-slope .anno{ font-size:14px; fill:var(--primary); font-family:var(--font-sans); font-weight:600; }
  .icon-slope .axline{ stroke:var(--line-strong); stroke-width:1.4; stroke-dasharray:3 3; }

  /* svg 图元颜色：网络结构 */
  .icon-net .card{ fill:var(--panel-bg); stroke:var(--line-strong); stroke-width:2; }
  .icon-net .wline{ stroke:var(--line-strong); stroke-width:1; opacity:.55; }
  .icon-net .node{ fill:var(--panel-bg); stroke:var(--primary); stroke-width:1.6; }
  .icon-net .node.io{ stroke-width:2.2; }

  /* ---- 底部收束 ---- */
  .p11-foot{
    flex:0 0 auto; padding-top:12px; margin-top:8px; border-top:1px solid var(--line);
    display:flex; flex-direction:column; gap:6px; align-items:center; text-align:center;
  }
  .p11-foot .lead{ max-width:1200px; }
  .p11-foot .nextq{ font-size:17px; color:var(--text); font-style:italic; }
  .p11-foot .nextq::before{ content:"下一问 → "; font-style:normal; color:var(--muted); }
</style>
</head>
<body data-page="11" data-total="19">
<div id="stage">
  <div class="p11">

    <header class="p11-head">
      <div class="kicker">IV · 反向传播前夜</div>
      <h1>一个隐藏层20个神经元，就有上百个权重</h1>
    </header>

    <main class="p11-main k-generalization">
      <div class="claim">下坡的道理没变</div>
      <div class="trunk"></div>

      <div class="compare supports" style="display:flex;flex-direction:row;">

        <!-- 左：单参数下坡（p06–p08 母题延续） -->
        <div class="pane">
          <div class="ptitle">单变量：沿一条线找下坡</div>
          <div class="icon-wrap">
            <svg class="icon-slope" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
              <line class="axline" x1="30" y1="170" x2="270" y2="170"></line>
              <line class="axline" x1="42" y1="184" x2="42" y2="20"></line>
              <text class="axislabel" x="262" y="164">参数 w</text>
              <text class="axislabel" x="30" y="18">误差 E</text>

              <ellipse class="ring" cx="150" cy="140" rx="118" ry="34"></ellipse>
              <ellipse class="ring" cx="150" cy="118" rx="82" ry="22" opacity=".85"></ellipse>
              <ellipse class="ring" cx="152" cy="98" rx="46" ry="13" opacity=".7"></ellipse>
              <circle class="pt" cx="178" cy="92" r="7"></circle>
              <line class="arrow" x1="178" y1="92" x2="228" y2="138"></line>
              <polygon class="arrowhead" points="228,138 210,131 220,150"></polygon>
              <text class="anno" x="198" y="158">负梯度方向 →</text>
            </svg>
          </div>
          <div class="readout">
            <div class="row1"><span class="big sm">1</span><span class="unit">个参数</span></div>
            <div class="cap">只需在一条线上挑方向</div>
          </div>
        </div>

        <!-- 右：20神经元网络（p10 层结构延续） -->
        <div class="pane">
          <div class="ptitle">一个隐藏层：20 个神经元</div>
          <div class="layer-tags">
            <span class="tag">输入层 · 2</span>
            <span class="tag">隐藏层 · 20</span>
            <span class="tag">输出层 · 1</span>
          </div>
          <div class="icon-wrap">
            <svg class="icon-net" id="netSvg" viewBox="0 0 400 224" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
          </div>
          <div class="breakdown">
            <div class="brow"><span class="k">输入 → 隐藏权重（2×20）</span><span class="v">40</span></div>
            <div class="brow"><span class="k">隐藏层偏置（20 个神经元各 1）</span><span class="v">20</span></div>
            <div class="brow"><span class="k">隐藏 → 输出权重（20×1）</span><span class="v">20</span></div>
            <div class="brow"><span class="k">输出层偏置</span><span class="v">1</span></div>
            <div class="brow"><span class="k">合计需要方向的参数</span><span class="v"><span id="wnum">1</span></span></div>
          </div>
        </div>

      </div>

      <div class="baseline" aria-hidden="true"></div>
    </main>

    <footer class="p11-foot">
      <p class="lead">下坡的道理没变——只是现在要同时给上百个权重找方向</p>
      <p class="nextq">谁该为最终的错误，负多少责任？</p>
    </footer>

  </div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Deck.init({ index: 11, total: 19 });

  // ---- 生成网络结构：2 输入 → 20 隐藏 → 1 输出，连线数=真实权重数(40+20) ----
  (function buildNet(){
    const svg = document.getElementById('netSvg');
    const NS = 'http://www.w3.org/2000/svg';
    const mk = (tag, attrs) => {
      const el = document.createElementNS(NS, tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      return el;
    };

    const inX = 42, inNodes = [ [inX, 82], [inX, 142] ];
    const hidNodes = [];
    const hCols = 4, hRows = 5;
    const hX0 = 170, hX1 = 262, hY0 = 30, hY1 = 194;
    for (let c = 0; c < hCols; c++) {
      for (let r = 0; r < hRows; r++) {
        const x = hX0 + (hX1 - hX0) * (c / (hCols - 1));
        const y = hY0 + (hY1 - hY0) * (r / (hRows - 1));
        hidNodes.push([x, y]);
      }
    }
    const outNode = [358, 112];

    svg.appendChild(mk('rect', { class: 'card', x: 14, y: 62, width: 56, height: 100, rx: 10 }));
    svg.appendChild(mk('rect', { class: 'card', x: 148, y: 10, width: 136, height: 204, rx: 12 }));
    svg.appendChild(mk('rect', { class: 'card', x: 330, y: 84, width: 56, height: 56, rx: 10 }));

    inNodes.forEach(([x1, y1]) => {
      hidNodes.forEach(([x2, y2]) => {
        svg.appendChild(mk('line', { class: 'wline', x1, y1, x2, y2 }));
      });
    });
    hidNodes.forEach(([x1, y1]) => {
      svg.appendChild(mk('line', { class: 'wline', x1, y1, x2: outNode[0], y2: outNode[1] }));
    });

    inNodes.forEach(([x, y]) => svg.appendChild(mk('circle', { class: 'node io', cx: x, cy: y, r: 8 })));
    hidNodes.forEach(([x, y]) => svg.appendChild(mk('circle', { class: 'node', cx: x, cy: y, r: 4.4 })));
    svg.appendChild(mk('circle', { class: 'node io', cx: outNode[0], cy: outNode[1], r: 9 }));
  })();

  // ---- 一次性数字动效：1 → 81（进场强化跃升感，不循环） ----
  (function animateCount(){
    const el = document.getElementById('wnum');
    const from = 1, to = 81, dur = 900;
    if (Deck.reduced()) { el.textContent = to; return; }
    const t0 = performance.now() + 350;
    function step(t) {
      if (t < t0) { requestAnimationFrame(step); return; }
      const p = Math.min(1, (t - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(from + (to - from) * eased);
      if (p < 1) requestAnimationFrame(step);
      else el.textContent = to;
    }
    requestAnimationFrame(step);
  })();
</script>
</body>
</html>
