<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{ display:flex; flex-direction:column; gap:14px; }

  .p13-head{ flex:0 0 auto; display:flex; flex-direction:column; gap:8px; }
  .p13-head h1{ margin:0; }
  .p13-legend{ flex:0 0 auto; }

  .p13-main{ flex:1 1 auto; min-height:0; display:flex; }
  .p13-main .lv{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:10px; }
  .p13-lv-label{ font-size:16px; color:var(--muted); flex:0 0 auto; }

  .p13-cards{
    flex:1 1 auto; min-height:0;
    display:flex; align-items:stretch; justify-content:center;
    gap:34px; padding:6px 4px 0;
  }
  .p13-card{
    flex:1 1 0; min-width:0; min-height:0;
    display:flex; flex-direction:column; gap:8px;
    padding:12px 14px 14px;
    cursor:pointer;
    background:var(--panel-bg);
    border:2px solid var(--line);
    border-radius:14px;
    transition: transform .35s ease, border-color .25s ease, box-shadow .25s ease, opacity .25s ease;
    transform-origin:50% 60%;
  }
  .p13-card:nth-child(1){ transform: rotate(-2.4deg) translateY(6px); }
  .p13-card:nth-child(2){ transform: rotate(1.6deg) translateY(-6px); }
  .p13-card:nth-child(3){ transform: rotate(-1.2deg) translateY(10px); }
  .p13-card:hover{ border-color: var(--accent); }

  .p13-cards.revealed .p13-card{ transform:none; opacity:.55; }
  .p13-cards.revealed .p13-card.is-picked{ opacity:1; border-color: var(--accent); box-shadow:0 6px 18px rgba(0,0,0,.10); z-index:2; }
  .p13-cards.revealed .p13-card.is-answer{ opacity:1; transform:scale(1.05); border-color: var(--primary); box-shadow:0 10px 26px rgba(0,0,0,.14); z-index:3; }

  .p13-card-top{ display:flex; align-items:center; justify-content:space-between; flex:0 0 auto; }
  .p13-card-title{ font-size:16px; font-weight:700; color:var(--text); }
  .p13-badge{ font-size:14px; font-weight:700; padding:3px 10px; border-radius:999px; visibility:hidden; }
  .p13-badge.correct{ visibility:visible; color:#fff; background:var(--primary); }
  .p13-badge.wrong{ visibility:visible; color:#fff; background:var(--accent); }
  .p13-badge.tagonly{ visibility:visible; color:var(--primary); background:transparent; border:1.5px solid var(--primary); }

  .p13-svgwrap{ flex:1 1 auto; min-height:0; position:relative; }
  .p13-svgwrap svg{ width:100%; height:100%; display:block; }

  .p13-foot{ flex:0 0 auto; display:flex; flex-direction:column; gap:6px; padding-top:2px; }
  #p13-explain{ margin:0; min-height:1.4em; }
  #p13-closing{ margin:0; opacity:0; transform:translateY(-2px); transition:opacity .3s ease, transform .3s ease; color:var(--primary); font-weight:700; }
  #p13-closing.show{ opacity:1; transform:translateY(0); }
  .p13-hint{ margin:0; }
</style>
</head>
<body data-page="13" data-total="19">
<div id="stage">

  <div class="p13-head">
    <div class="tag">PREDICT · REVEAL</div>
    <h1>训练开始前，先猜一猜：这张环形数据，网络最后会画出什么边界？</h1>
    <p class="small" style="margin:0;color:var(--muted);">三张卡背后是同一份数据、同一个坐标范围，唯一的差别只是候选边界的形状</p>
  </div>

  <div class="legend p13-legend">
    <div class="li"><span class="sw"></span>内圈实心点 = 类别 A</div>
    <div class="li"><span class="sw hollow"></span>外圈空心点 = 类别 B</div>
    <div class="li" style="color:var(--muted); font-size:15px;">三张卡叠放的是同一份数据，只有边界形状不同</div>
    <div class="li" style="color:var(--muted); font-size:15px;">共 40 个点，内外各 20 个，半径比 1:2.2</div>
  </div>

  <div class="k-classification p13-main">
    <div class="lv">
      <div class="p13-lv-label">预测：训练结束后，网络画出的决策边界最接近哪一张？点一张卡揭示答案。</div>
      <div class="stage-cards p13-cards" id="p13cards">

        <button class="box p13-card" type="button" data-key="line" aria-label="预测：直线边界">
          <div class="p13-card-top">
            <span class="p13-card-title"><span style="color:var(--muted);font-weight:400;">候选 1 ·</span> 直线分割</span>
            <span class="bt p13-badge" data-badge></span>
          </div>
          <p class="small" style="margin:0;color:var(--muted);">一条贯穿数据的直线，把两类点粗暴分成两半</p>
          <div class="p13-svgwrap" data-svg="line"></div>
        </button>

        <button class="box p13-card" type="button" data-key="blocks" aria-label="预测：色块边界">
          <div class="p13-card-top">
            <span class="p13-card-title"><span style="color:var(--muted);font-weight:400;">候选 2 ·</span> 零散色块</span>
            <span class="bt p13-badge" data-badge></span>
          </div>
          <p class="small" style="margin:0;color:var(--muted);">若干块互不相连的矩形色区，东一块西一块</p>
          <div class="p13-svgwrap" data-svg="blocks"></div>
        </button>

        <button class="box p13-card" type="button" data-key="ring" aria-label="预测：环形边界">
          <div class="p13-card-top">
            <span class="p13-card-title"><span style="color:var(--muted);font-weight:400;">候选 3 ·</span> 环形闭合曲线</span>
            <span class="bt p13-badge" data-badge></span>
          </div>
          <p class="small" style="margin:0;color:var(--muted);">一条闭合曲线，把内圈的点整个包起来</p>
          <div class="p13-svgwrap" data-svg="ring"></div>
        </button>

      </div>
    </div>
  </div>

  <div class="p13-foot">
    <p class="lead" id="p13-explain">点击一张卡，猜猜训练结束后，网络画出的边界会是哪种形状。</p>
    <p id="p13-closing">隐藏层能把直线拧成曲线——正确答案是环形，不是一条直线，也不是零散色块。</p>
    <p class="hint p13-hint">猜对了形状，但网络到底怎么一步步把边界拧成这样？下一页开始真正训练。</p>
  </div>

</div>
<script src="assets/base.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/lec.js"></script>
<script>
(function(){
  Deck.init({ index:13, total:19 });

  // ---- 生成同心圆数据点：内圈 20 实心 + 外圈 20 空心，半径比 1:2.2，固定种子 ----
  var rng = new Math.seedrandom('page-13-ring');
  var CX = 120, CY = 120;
  var R_IN = 44, R_OUT = 96.8; // 44*2.2 = 96.8
  var N = 20;
  var inner = [], outer = [];
  for (var i = 0; i < N; i++) {
    var a = (i / N) * Math.PI * 2 + (rng() - 0.5) * 0.28;
    var r = R_IN + (rng() - 0.5) * 6;
    inner.push([CX + r * Math.cos(a), CY + r * Math.sin(a)]);
  }
  for (var j = 0; j < N; j++) {
    var a2 = (j / N) * Math.PI * 2 + (rng() - 0.5) * 0.22 + 0.15;
    var r2 = R_OUT + (rng() - 0.5) * 8;
    outer.push([CX + r2 * Math.cos(a2), CY + r2 * Math.sin(a2)]);
  }

  function pointsSVG() {
    var s = '';
    inner.forEach(function(p){
      s += '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.4" fill="var(--text)"></circle>';
    });
    outer.forEach(function(p){
      s += '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.4" fill="var(--panel-bg)" stroke="var(--text)" stroke-width="1.6"></circle>';
    });
    return s;
  }

  function boundarySVG(key, stroke) {
    if (key === 'line') {
      return '<line x1="14" y1="222" x2="228" y2="16" stroke="'+stroke+'" stroke-width="4" stroke-linecap="round" fill="none"></line>';
    }
    if (key === 'blocks') {
      var rects = [
        [18,26,52,40],[142,16,62,36],[26,150,48,56],[150,140,58,50],[92,182,44,32]
      ];
      var s = '';
      rects.forEach(function(rc){
        s += '<rect x="'+rc[0]+'" y="'+rc[1]+'" width="'+rc[2]+'" height="'+rc[3]+'" rx="7" fill="'+stroke+'" opacity="0.42"></rect>';
      });
      return s;
    }
    // ring
    var rr = (R_IN + R_OUT) / 2;
    return '<circle cx="'+CX+'" cy="'+CY+'" r="'+rr.toFixed(1)+'" stroke="'+stroke+'" stroke-width="4" fill="none"></circle>';
  }

  function buildSVG(key, stroke) {
    return '<svg viewBox="0 0 240 240" preserveAspectRatio="xMidYMid meet">' +
             boundarySVG(key, stroke) +
             pointsSVG() +
           '</svg>';
  }

  var NEUTRAL = 'var(--line-strong)';
  var wraps = document.querySelectorAll('[data-svg]');
  wraps.forEach(function(w){
    w.innerHTML = buildSVG(w.getAttribute('data-svg'), NEUTRAL);
  });

  var RATIONALE = {
    line:   '✗ 错——单个神经元只能画一条直线（见 p09），画不出这样的环形边界。',
    blocks: '✗ 错——这是没训练时随机瞎猜的样子，色块互不相连，说明网络还没学到规律。',
    ring:   '✓ 对——隐藏层能把直线拧成曲线（见 p10），最终围出一条包住内圈点的闭合边界。'
  };

  var cardsEl = document.getElementById('p13cards');
  var cards = Array.prototype.slice.call(document.querySelectorAll('.p13-card'));
  var explainEl = document.getElementById('p13-explain');
  var closingEl = document.getElementById('p13-closing');

  function reveal(key) {
    cardsEl.classList.add('revealed');
    cards.forEach(function(card){
      var k = card.getAttribute('data-key');
      var badge = card.querySelector('[data-badge]');
      card.classList.remove('is-picked','is-answer');
      badge.className = 'bt p13-badge';
      var stroke = NEUTRAL;

      if (k === key) {
        card.classList.add('is-picked');
        stroke = 'var(--accent)';
        badge.classList.add(k === 'ring' ? 'correct' : 'wrong');
        badge.textContent = k === 'ring' ? '✓ 对' : '✗ 错';
      }
      if (k === 'ring') {
        card.classList.add('is-answer');
        stroke = 'var(--primary)';
        if (k !== key) {
          badge.classList.add('tagonly');
          badge.textContent = '实际答案';
        }
      }
      card.querySelector('.p13-svgwrap').innerHTML = buildSVG(k, stroke);
    });
    explainEl.textContent = RATIONALE[key];
    closingEl.classList.add('show');
  }

  cards.forEach(function(card){
    card.addEventListener('click', function(){
      reveal(card.getAttribute('data-key'));
    });
  });
})();
</script>
</body>
</html>
