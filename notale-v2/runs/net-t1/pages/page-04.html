<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F6F1E7;--text:#1E2A30;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E56B3F;--param:#246B8F;--ink-soft:#59676a;--rule:#b8b1a5;--paper:#fffdf7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
#stage{height:900px;padding:28px 56px;display:flex;flex-direction:column;overflow:hidden;font-family:var(--font-sans)}
header{height:126px;flex:0 0 126px;border-bottom:1px solid var(--rule);display:flex;align-items:flex-start;justify-content:space-between;padding-top:6px}
.kicker{font-size:var(--fs-label);font-weight:700;letter-spacing:.14em;color:var(--param);margin:0 0 10px}
h1{font-size:var(--fs-h1);line-height:1.2;letter-spacing:-.035em;margin:0;font-weight:720}
.header-note{width:320px;margin-top:8px;font-family:var(--font-serif);font-size:var(--fs-sec);line-height:1.45;color:var(--ink-soft);padding-left:18px;border-left:3px solid var(--focus)}
.split-lr{flex:1;min-height:0;display:flex;gap:58px;padding:28px 0 38px}
.experiment{width:860px;min-width:0;display:flex;flex-direction:column}
.plot-intro{height:42px;display:flex;justify-content:space-between;align-items:flex-start}
.plot-intro p{margin:0;font-size:var(--fs-sec);line-height:1.4;color:var(--ink-soft)}
.legend{display:flex;gap:18px;align-items:center;font-size:var(--fs-label);white-space:nowrap;color:var(--text)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}.legend .yes{background:var(--param)}.legend .no{border:2px solid var(--focus);background:var(--paper)}
.plot-wrap{position:relative;flex:1;min-height:0;border:1px solid #777c76;background:var(--paper);overflow:hidden}
.plot-wrap:before{content:"位置读数";position:absolute;left:16px;top:12px;font-size:var(--fs-label);font-weight:700;letter-spacing:.08em;color:#657176;z-index:1}
svg{width:100%;height:100%;display:block}
.observation{width:510px;min-width:0;border-left:1px solid var(--rule);padding-left:38px;display:flex;flex-direction:column}
.section-label{font-size:var(--fs-label);font-weight:700;letter-spacing:.12em;color:var(--ink-soft);margin:3px 0 16px}
.question{font-family:var(--font-serif);font-size:var(--fs-lead);line-height:1.48;margin:0 0 20px;max-width:430px}
.quiz{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;width:100%;min-height:62px;text-align:left;border:1px solid #91948d;background:transparent;border-radius:0;padding:12px 16px;display:flex;align-items:center;gap:14px;color:var(--text);font:inherit;cursor:pointer;transition:border-color .16s,background .16s}
.opt:hover{background:#f0ece2}.opt:focus-visible,.reset:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.opt[aria-pressed="true"]{border:3px solid var(--focus);padding:10px 14px;background:#fff8ef}
.letter{width:30px;height:30px;flex:0 0 30px;border:1px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700}.opt[aria-pressed="true"] .letter{background:var(--focus);color:white;border-color:var(--focus)}
.choice-copy{display:flex;flex-direction:column;gap:2px}.choice-copy strong{font-size:var(--fs-body);line-height:1.15}.choice-copy span{font-size:var(--fs-label);line-height:1.25;color:var(--ink-soft)}
.fb{margin-top:22px;border-top:1px solid var(--rule);padding:18px 0 0;min-height:113px}.fb .status{font-size:var(--fs-body);font-weight:650;line-height:1.42;margin:0}.fb .detail{font-size:var(--fs-sec);line-height:1.45;color:var(--ink-soft);margin:8px 0 0}
.actions{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:15px;border-top:1px solid var(--rule)}
.keyhint{font-size:var(--fs-label);line-height:1.4;color:var(--ink-soft)}
kbd{font-family:var(--font-mono);font-size:var(--fs-tick);border:1px solid #989a93;padding:2px 5px;background:#eeeadf;color:var(--text)}
.reset{font:inherit;font-size:var(--fs-label);font-weight:700;color:var(--param);background:transparent;border:1px solid var(--param);border-radius:0;padding:9px 15px;cursor:pointer}.reset:hover{background:#e7f0f3}
footer{height:48px;flex:0 0 48px;border-top:1px solid var(--rule);display:flex;align-items:flex-end;justify-content:space-between;padding-top:12px}.takeaway{font-family:var(--font-serif);font-size:var(--fs-lead);line-height:1.35}.next{font-size:var(--fs-label);color:var(--param);font-weight:700}.step{font-family:var(--font-mono);font-size:var(--fs-tick);color:var(--ink-soft);letter-spacing:.08em}
.axis{stroke:#45565d;stroke-width:1.5}.grid{stroke:#d6d1c7;stroke-width:1}.tick{fill:#687277;font-family:var(--font-mono);font-size:13px}.axis-label{fill:#35444a;font-family:var(--font-sans);font-size:15px;font-weight:650}.candidate{stroke:#1e2a30;stroke-width:4;fill:none}.candidate-label{fill:#1e2a30;font-family:var(--font-sans);font-size:15px;font-weight:700}.region-label{font-family:var(--font-sans);font-size:14px;font-weight:700;letter-spacing:.05em}.yes-region{fill:#246B8F}.no-region{fill:#9b542f}.point-yes{fill:#246B8F;stroke:#246B8F;stroke-width:2}.point-no{fill:#fffdf7;stroke:#E56B3F;stroke-width:3}.mis{fill:none;stroke:#E56B3F;stroke-width:4}.point-label{fill:#334349;font-family:var(--font-mono);font-size:13px}.mis-label{fill:#bc5129;font-family:var(--font-sans);font-size:14px;font-weight:700}
</style>
</head>
<body data-page="04" data-total="20">
<div id="stage">
  <header>
    <div><p class="kicker">EXPERIMENT 01 · CLASSIFY</p><h1>面对两项位置读数，它先只能画一条线</h1></div>
    <div class="header-note">同一批位置点，不换坐标尺度。<br>只比较一条线能否分开两类。</div>
  </header>
  <main class="split-lr" aria-label="候选分界实验">
    <section class="experiment min0" aria-labelledby="plot-title">
      <div class="plot-intro"><p id="plot-title">8 个位置点 · 横向位置与纵向位置均从 −1.00 到 1.00</p><div class="legend" aria-label="类别图例"><span><i class="yes"></i>是作业区</span><span><i class="no"></i>否作业区</span></div></div>
      <div class="plot-wrap min0"><svg id="plot" viewBox="0 0 860 570" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">同一批位置点上的候选直线</title><desc id="svg-desc">蓝色实心点是作业区，橙色空心点是否作业区。选择候选线后会标出错分点。</desc></svg></div>
    </section>
    <aside class="observation min0" aria-labelledby="vote-title">
      <p class="section-label">记录 01 / 投票</p>
      <h2 id="vote-title" class="question">选一条线：它能把两类位置完全分开吗？</h2>
      <div class="quiz" role="group" aria-label="选择候选分界线">
        <button class="opt" type="button" data-choice="A" aria-pressed="false"><span class="letter">A</span><span class="choice-copy"><strong>斜线</strong><span>从左上到右下</span></span></button>
        <button class="opt" type="button" data-choice="B" aria-pressed="false"><span class="letter">B</span><span class="choice-copy"><strong>竖线</strong><span>穿过横向位置 0.00</span></span></button>
        <button class="opt" type="button" data-choice="C" aria-pressed="false"><span class="letter">C</span><span class="choice-copy"><strong>横线</strong><span>穿过纵向位置 0.00</span></span></button>
      </div>
      <div class="fb" aria-live="polite"><p class="status" id="status">尚未投票</p><p class="detail" id="detail">选择一条线后，图上会显示它与错分位置点。</p></div>
      <div class="actions"><span class="keyhint">也可按 <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> 选择</span><button id="reset" class="reset" type="button">重投</button></div>
    </aside>
  </main>
  <footer><div class="takeaway">单个神经元的“是／否”判断，在平面上只能形成直线分界。</div><div><span class="next">如果想让这条线转个方向，该动哪个旋钮？</span><span class="step">　实验步数 01 / 04</span></div></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  Deck.init({index:4,total:20});
  const svg=document.getElementById('plot'), status=document.getElementById('status'), detail=document.getElementById('detail');
  const buttons=[...document.querySelectorAll('.opt')], reset=document.getElementById('reset');
  const initialState=()=>({selectedCandidate:null}); let state=initialState();
  const points=[{x:.7,y:.4,yes:true},{x:.3,y:.6,yes:true},{x:.8,y:-.1,yes:true},{x:-.1,y:.5,yes:true},{x:-.7,y:-.4,yes:false},{x:-.3,y:-.6,yes:false},{x:-.8,y:.1,yes:false},{x:.1,y:-.5,yes:false}];
  const candidates={A:{label:'A：8 个点分居线的两侧，没有错分。',detail:'这条线把“是”和“否”完全分开。',line:[[-1,1],[1,-1]],score:p=>p.x+p.y,yesSide:1},B:{label:'B：有 2 个点落在错误一侧。',detail:'仍有错分；一条竖线没有把两类位置完全分开。',line:[[0,-1],[0,1]],score:p=>p.x,yesSide:1},C:{label:'C：有 2 个点落在错误一侧。',detail:'仍有错分；一条横线没有把两类位置完全分开。',line:[[-1,0],[1,0]],score:p=>p.y,yesSide:1}};
  // Both coordinates use 220 logical pixels per unit: a slope of −1 is visibly a 45° line.
  const X=v=>180+(v+1)*220, Y=v=>510-(v+1)*220;
  const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  function render(){
    const chosen=state.selectedCandidate, c=chosen&&candidates[chosen];
    let out='<rect x="0" y="0" width="860" height="570" fill="#fffdf7"/>';
    [-1,-.5,0,.5,1].forEach(v=>{out+=`<line class="grid" x1="${X(v)}" y1="70" x2="${X(v)}" y2="510"/><line class="grid" x1="180" y1="${Y(v)}" x2="620" y2="${Y(v)}"/>`;});
    out+=`<line class="axis" x1="180" y1="510" x2="650" y2="510"/><line class="axis" x1="180" y1="530" x2="180" y2="55"/>`;
    [-1,-.5,0,.5,1].forEach(v=>{const t=v.toFixed(2);out+=`<text class="tick" x="${X(v)}" y="535" text-anchor="middle">${t}</text><text class="tick" x="164" y="${Y(v)+5}" text-anchor="end">${t}</text>`});
    out+='<text class="axis-label" x="400" y="563" text-anchor="middle">横向位置</text><text class="axis-label" x="115" y="290" text-anchor="middle" transform="rotate(-90 115 290)">纵向位置</text>';
    if(c){ const [[x1,y1],[x2,y2]]=c.line;out+=`<line class="candidate" x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}"/><text class="candidate-label" x="750" y="85">候选 ${chosen}</text>`;
      const regions=chosen==='A'?[['yes-region',555,148,'预测：是'],['no-region',180,440,'预测：否']]:chosen==='B'?[['yes-region',545,112,'预测：是'],['no-region',192,112,'预测：否']]:[['yes-region',545,190,'预测：是'],['no-region',545,440,'预测：否']];
      regions.forEach(r=>out+=`<text class="region-label ${r[0]}" x="${r[1]}" y="${r[2]}">${r[3]}</text>`);
    }
    points.forEach((p,i)=>{const bad=c && ((c.score(p)*c.yesSide>0)!==p.yes);const px=X(p.x),py=Y(p.y);if(bad)out+=`<circle class="mis" cx="${px}" cy="${py}" r="13"/><text class="mis-label" x="${px+16}" y="${py-13}">错分</text>`;out+=`<circle class="${p.yes?'point-yes':'point-no'}" cx="${px}" cy="${py}" r="7"/>`;});
    svg.innerHTML=out;
    buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.choice===chosen)));
    if(!c){status.textContent='尚未投票';detail.textContent='选择一条线后，图上会显示它与错分位置点。'}else{status.textContent=c.label;detail.textContent=c.detail;}
  }
  function select(candidate){if(!candidates[candidate])return;state={selectedCandidate:candidate};render();}
  function doReset(){state=initialState();render();reset.focus();status.textContent='已重投：尚未选择候选线。';}
  const onKey=e=>{if(e.altKey||e.ctrlKey||e.metaKey||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;const key=e.key.toUpperCase();if(candidates[key]){e.preventDefault();select(key);document.querySelector(`[data-choice="${key}"]`).focus();}};
  buttons.forEach(b=>b.addEventListener('click',()=>select(b.dataset.choice))); reset.addEventListener('click',doReset); document.addEventListener('keydown',onKey);
  function cleanup(){buttons.forEach(b=>b.replaceWith(b.cloneNode(true)));document.removeEventListener('keydown',onKey);}
  window.addEventListener('pagehide',cleanup,{once:true});
  render();
})();
</script>
</body>
</html>
