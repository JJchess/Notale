<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F6F1E7;--text:#1E2A30;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E56B3F;--param:#246B8F;--paper:#F6F1E7;}
*{box-sizing:border-box} body{margin:0;overflow:hidden} #stage{padding:28px 56px;display:flex;flex-direction:column;color:var(--text);background:var(--bg)}
.header{height:112px;border-bottom:1px solid rgba(30,42,48,.35);display:flex;justify-content:space-between;align-items:flex-start;padding-top:3px}.kicker{font:700 var(--fs-label) var(--font-mono);letter-spacing:.12em;color:var(--param);margin:0 0 8px}.title{font:700 var(--fs-h1) var(--font-sans);letter-spacing:.01em;margin:0}.formula{margin-top:20px;font:var(--fs-sec) var(--font-mono);color:#536067}.formula b{font-weight:700;color:var(--text)}
.comparison{flex:1;min-height:0;padding:25px 0 18px;display:flex;flex-direction:column}.instruction{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;font:var(--fs-sec) var(--font-sans)}.instruction strong{color:var(--attention)}.scale-note{font:var(--fs-label) var(--font-mono);color:#59656b}
.triptych{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.14fr 1fr;gap:28px;align-items:stretch}.chart-col{min-width:0;display:flex;flex-direction:column}.chart-head{height:45px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid var(--text);padding-top:3px}.chart-name{font:700 var(--fs-h2) var(--font-sans)}.btag{font:700 var(--fs-label) var(--font-mono);padding:4px 8px;border:1.5px solid var(--text);background:#eee8dc}.btag.param{color:var(--param);border-color:var(--param);background:#e8f0f3}
.svgbox{flex:1;min-height:0;margin-top:12px;border:1px solid rgba(30,42,48,.38);background:rgba(255,255,255,.22);padding:4px}.chart-svg{width:100%;height:100%;display:block}.chart-svg .grid{stroke:#bfc1b9;stroke-width:1}.chart-svg .axis{stroke:#1e2a30;stroke-width:1.4}.chart-svg .tick{font:13px var(--font-mono);fill:#536067}.chart-svg .axislabel{font:15px var(--font-mono);fill:#1e2a30}.chart-svg .pt{fill:#858b89;stroke:#f6f1e7;stroke-width:2}.chart-svg .line{stroke:#1e2a30;stroke-width:4;fill:none}.chart-svg .active{stroke:var(--attention);stroke-width:5}.chart-svg .equation{font:700 16px var(--font-mono);fill:#1e2a30}.chart-svg .current-outline{fill:none;stroke:var(--attention);stroke-width:3}
.caption{height:45px;padding:10px 2px 0;font:var(--fs-sec) var(--font-serif);line-height:1.35}.center{position:relative}.center .svgbox{border:3px solid var(--attention);padding:2px}.control-panel{margin-top:12px;border:1.5px solid var(--param);background:#edf3f3;padding:12px 14px 11px;min-height:123px}.ctl-top{display:flex;justify-content:space-between;align-items:baseline}.ctl-title{font:700 var(--fs-label) var(--font-sans);color:var(--param)}.readout{font:700 25px var(--font-mono);color:var(--param)}.control-row{display:flex;gap:12px;align-items:center;margin-top:8px}.range-wrap{flex:1;display:flex;flex-direction:column;gap:3px}.range-scale{display:flex;justify-content:space-between;font:var(--fs-tick) var(--font-mono);color:#536067}input[type=range]{width:100%;accent-color:var(--param);height:20px;margin:0}.reset{border:1.5px solid var(--text);background:transparent;border-radius:0;padding:7px 10px;font:700 var(--fs-label) var(--font-sans);color:var(--text);cursor:pointer;white-space:nowrap}.reset:hover{background:#e6e0d4}.reset:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.move-note{height:45px;margin-top:10px;display:flex;align-items:center;gap:9px;font:var(--fs-label) var(--font-sans)}.move-arrow{font-size:26px;line-height:1;color:var(--attention)}.move-note strong{color:var(--attention)}
.footer{height:92px;border-top:1px solid rgba(30,42,48,.35);display:flex;align-items:center;justify-content:space-between;gap:30px}.takeaway{font:var(--fs-lead) var(--font-serif);line-height:1.4}.next{font:var(--fs-sec) var(--font-sans);color:#536067;text-align:right;max-width:530px}.step{position:absolute;right:56px;bottom:18px;font:var(--fs-tick) var(--font-mono);letter-spacing:.08em;color:#748078}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-page="06" data-total="20">
<div id="stage">
  <header class="header">
    <div><p class="kicker">EXPERIMENT 06 · BIAS</p><h1 class="title">偏置只推线，不拧线</h1></div>
    <div class="formula"><b>边界：</b>x + y + b = 0</div>
  </header>
  <main class="comparison k-comparison" aria-label="三种偏置下的同尺度边界比较">
    <div class="instruction"><span><strong>拖动 b，</strong>观察中间的线如何移动；六个灰点与倾斜角保持不动。</span><span class="scale-note">共用位置读数 x, y：−1.00 至 1.00</span></div>
    <section class="triptych" aria-label="偏置比较图">
      <article class="chart-col min0" aria-label="偏置较小，b 等于负零点四五">
        <div class="chart-head"><span class="chart-name">偏置较小</span><span class="btag">b = −0.45</span></div>
        <div class="svgbox"><svg class="chart-svg" id="leftChart" viewBox="0 0 360 300" role="img" aria-label="x 加 y 等于零点四五的边界"></svg></div>
        <div class="caption">同样斜率；边界向右上平移。</div>
      </article>
      <article class="chart-col center min0" aria-label="正在调节的偏置">
        <div class="chart-head"><span class="chart-name">正在调节</span><span class="btag param">可调参数 b</span></div>
        <div class="svgbox"><svg class="chart-svg" id="middleChart" viewBox="0 0 360 300" role="img" aria-label="当前可调偏置的边界"></svg></div>
        <div class="control-panel panel">
          <div class="ctl-top"><label class="ctl-title" for="biasRange">偏置 b</label><output id="biasReadout" class="readout" for="biasRange">0.00</output></div>
          <div class="control-row"><div class="range-wrap"><input id="biasRange" type="range" min="-0.45" max="0.45" step="0.05" value="0" aria-describedby="biasHelp"><div class="range-scale"><span>−0.45</span><span>0.00</span><span>0.45</span></div></div><button class="reset" id="resetBtn" type="button">回到 0.00</button></div>
        </div>
        <div class="move-note" id="biasHelp" aria-live="polite"><span class="move-arrow" id="moveArrow" aria-hidden="true">↔</span><span id="moveText"><strong>默认位置</strong>：线尚未平移。</span></div>
      </article>
      <article class="chart-col min0" aria-label="偏置较大，b 等于正零点四五">
        <div class="chart-head"><span class="chart-name">偏置较大</span><span class="btag">b = +0.45</span></div>
        <div class="svgbox"><svg class="chart-svg" id="rightChart" viewBox="0 0 360 300" role="img" aria-label="x 加 y 等于负零点四五的边界"></svg></div>
        <div class="caption">同样斜率；边界向左下平移。</div>
      </article>
    </section>
  </main>
  <footer class="footer"><div class="takeaway">改变偏置，边界保持同样倾斜，只是整体平移。</div><div class="next">把线推到位之后，怎样把位置算成“在作业区”的概率？</div></footer>
  <div class="step" aria-hidden="true">实验步数 06 / 20</div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  Deck.init({index:6,total:20});
  const points=[[-.72,.64],[-.45,.08],[-.12,.57],[.18,-.3],[.52,.14],[.75,-.55]];
  const range=document.getElementById('biasRange'), readout=document.getElementById('biasReadout');
  const moveArrow=document.getElementById('moveArrow'), moveText=document.getElementById('moveText');
  let state=fresh(); let disposed=false;
  function fresh(){return {b:0};}
  const fmt=b => (b>0?'+':'')+b.toFixed(2);
  const xmap=x=>42+(x+1)*138, ymap=y=>258-(y+1)*114;
  function clippedLine(b){
    const vals=[]; const add=(x,y)=>{if(x>=-1.001&&x<=1.001&&y>=-1.001&&y<=1.001)vals.push([x,y]);};
    add(-1,1-b); add(1,-1-b); add(1-b,-1); add(-1-b,1);
    const unique=[]; vals.forEach(p=>{if(!unique.some(q=>Math.abs(q[0]-p[0])<.001&&Math.abs(q[1]-p[1])<.001))unique.push(p)});
    return unique.slice(0,2);
  }
  function chart(svg,b,active){
    const grid=[-1,-.5,0,.5,1].map(v=>`<line class="grid" x1="${xmap(v)}" y1="30" x2="${xmap(v)}" y2="258"/><line class="grid" x1="42" y1="${ymap(v)}" x2="318" y2="${ymap(v)}"/>`).join('');
    const ticks=[-1,0,1].map(v=>`<text class="tick" x="${xmap(v)}" y="276" text-anchor="middle">${v.toFixed(2)}</text><text class="tick" x="32" y="${ymap(v)+4}" text-anchor="end">${v.toFixed(2)}</text>`).join('');
    const p=clippedLine(b), eq=`x + y = ${(-b).toFixed(2)}`;
    svg.innerHTML=`${grid}<line class="axis" x1="42" y1="258" x2="324" y2="258"/><line class="axis" x1="42" y1="264" x2="42" y2="25"/>${ticks}<text class="axislabel" x="327" y="263">x</text><text class="axislabel" x="34" y="23">y</text>${points.map(q=>`<circle class="pt" cx="${xmap(q[0])}" cy="${ymap(q[1])}" r="5.5"/>`).join('')}<path class="line ${active?'active':''}" d="M ${xmap(p[0][0])} ${ymap(p[0][1])} L ${xmap(p[1][0])} ${ymap(p[1][1])}"/>${active?'<rect class="current-outline" x="8" y="7" width="344" height="282"/>':''}<text class="equation" x="180" y="22" text-anchor="middle">${eq}</text>`;
  }
  function render(announce=false){
    chart(document.getElementById('leftChart'),-.45,false); chart(document.getElementById('rightChart'),.45,false); chart(document.getElementById('middleChart'),state.b,true);
    range.value=state.b; readout.value=fmt(state.b); readout.textContent=fmt(state.b);
    if(state.b < 0){moveArrow.textContent='↗';moveText.innerHTML='<strong>向右上平移</strong>：斜率仍然相同。';}
    else if(state.b > 0){moveArrow.textContent='↙';moveText.innerHTML='<strong>向左下平移</strong>：斜率仍然相同。';}
    else {moveArrow.textContent='↔';moveText.innerHTML='<strong>默认位置</strong>：线尚未平移。';}
  }
  function setBias(v,announce=true){const n=Number(v); if(!Number.isFinite(n)||n<-.45||n>.45)return; state={b:Math.round(n*100)/100}; render(announce);}
  const onInput=e=>setBias(e.target.value,true); range.addEventListener('input',onInput);
  const onReset=()=>{state=fresh();render(true);range.focus();}; document.getElementById('resetBtn').addEventListener('click',onReset);
  function cleanup(){if(disposed)return;disposed=true;range.removeEventListener('input',onInput);document.getElementById('resetBtn').removeEventListener('click',onReset);}
  window.addEventListener('pagehide',cleanup,{once:true});
  render(false);
})();
</script>
</body>
</html>
