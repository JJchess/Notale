<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F6F1E7;--text:#1E2A30;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E56B3F;--param:#246B8F;}
*{box-sizing:border-box}
#stage{padding:28px 56px;display:flex;flex-direction:column;gap:0;overflow:hidden;background:var(--bg);color:var(--text)}
header{height:126px;border-bottom:1px solid rgba(30,42,48,.32);display:flex;align-items:flex-start;justify-content:space-between;padding-top:8px;flex:none}
.kicker{font:700 var(--fs-label) var(--font-mono);letter-spacing:.14em;color:var(--param);margin:0 0 9px}
h1{font:700 var(--fs-h1) var(--font-sans);letter-spacing:-.03em;margin:0;line-height:1.18}
.header-note{width:315px;margin:12px 0 0;font:var(--fs-sec)/1.45 var(--font-serif);color:#526068;border-left:3px solid var(--focus);padding-left:14px}
main{flex:1;min-height:0;padding:26px 0 18px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:44px}
.terrain-side{min-width:0;min-height:0;display:flex;flex-direction:column}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 11px}.section-title h2{font:700 var(--fs-h2) var(--font-sans);margin:0}.section-title span{font:var(--fs-label) var(--font-sans);color:#59666c}
.terrain-frame{position:relative;flex:1;min-height:0;border:1px solid rgba(30,42,48,.44);background:rgba(255,255,255,.24);overflow:hidden}
#terrain{width:100%;height:100%;display:block;outline:none;cursor:crosshair;touch-action:manipulation}
#terrain:focus-visible{outline:3px solid var(--focus);outline-offset:-4px}
.terrain-caption{font:var(--fs-label)/1.4 var(--font-sans);margin:10px 0 0;color:#46555c}
.record{min-width:0;border-left:1px solid rgba(30,42,48,.35);padding-left:26px;display:flex;flex-direction:column}
.record h2{font:700 var(--fs-h2) var(--font-sans);margin:0 0 16px}.panel{border:1px solid rgba(30,42,48,.46);background:#fbf8f1;padding:18px 18px 16px;box-shadow:none}.field{border-bottom:1px solid rgba(30,42,48,.2);padding:0 0 13px;margin:0 0 13px}.field:last-of-type{margin-bottom:14px}.field-label{display:block;font:var(--fs-label) var(--font-sans);color:#526068;margin-bottom:4px}.field-value{font:600 var(--fs-body) var(--font-mono);font-variant-numeric:tabular-nums}.big.num{font:700 42px/1 var(--font-mono);letter-spacing:-.05em;color:var(--text);font-variant-numeric:tabular-nums;display:inline-block;transition:transform 160ms ease,color 160ms ease}.loss-low{color:var(--focus)!important;transform:translateY(4px)}.loss-high{transform:translateY(-4px)}
#step-message{min-height:46px;font:var(--fs-sec)/1.42 var(--font-serif);margin:10px 0 0;color:#45545b}.step-focus{color:var(--focus);font-weight:700}
.controls{margin-top:18px}.controls-title{font:700 var(--fs-label) var(--font-sans);margin:0 0 9px}.ctl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:206px}.ctl-grid .blank{visibility:hidden}.btn{appearance:none;border:1px solid #4a565b;background:transparent;border-radius:0;color:var(--text);font:600 var(--fs-label) var(--font-sans);height:38px;cursor:pointer}.btn:hover{background:#ebe5da}.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.btn:active{background:#ded7ca}.reset{width:100%;margin-top:12px;border-color:var(--param);color:var(--param)}
.keyhint{font:var(--fs-label)/1.4 var(--font-sans);color:#526068;margin:11px 0 0}.key{font:600 var(--fs-tick) var(--font-mono);border:1px solid #798287;padding:1px 4px;color:var(--text);background:#f6f1e7}
footer{height:78px;border-top:1px solid rgba(30,42,48,.32);padding-top:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:30px;flex:none}.takeaway{font:var(--fs-lead)/1.45 var(--font-serif);max-width:980px;margin:0}.next{font:var(--fs-sec)/1.45 var(--font-sans);width:310px;margin:0;color:#526068}.stepmark{position:absolute;right:56px;bottom:16px;font:var(--fs-tick) var(--font-mono);color:#788187;letter-spacing:.1em}
svg .gridline{stroke:#c8c4bc;stroke-width:1}svg .axis{stroke:#233139;stroke-width:1.7}svg .contour{fill:none;stroke:#4e595d;stroke-width:1.35}svg .contour.light{stroke:#899095;stroke-width:1}svg .track{fill:none;stroke:#33434a;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}svg .past{fill:#F6F1E7;stroke:#33434a;stroke-width:1.8}svg .current{fill:var(--focus);stroke:#1E2A30;stroke-width:2.2;transition:cx 180ms ease,cy 180ms ease}svg .candidate{fill:#fbf8f1;stroke:var(--focus);stroke-width:1.6;cursor:pointer}svg .candidate:hover,svg .candidate:focus{fill:#f4d5c8;outline:none}svg text{font-family:var(--font-sans);fill:#39474d}svg .axislabel{fill:var(--param);font-weight:700;font-size:15px}svg .tick{font-family:var(--font-mono);font-size:13px}svg .clabel{font-size:15px;fill:#566167}svg .candidate-text{font-family:var(--font-mono);font-size:13px;fill:#a94b28;font-weight:700;pointer-events:none}
@media(prefers-reduced-motion:reduce){.big.num,svg .current{transition:none}}
</style>
</head>
<body data-page="09" data-total="20">
<div id="stage">
<header>
  <div><p class="kicker">LOSS LANDSCAPE</p><h1>学习，就是在参数地形上往低处走</h1></div>
  <p class="header-note">同一批练习样本，换一组参数，就会测到另一份总差距。</p>
</header>
<main class="k-generalization">
  <section class="terrain-side min0" aria-labelledby="terrain-heading">
    <div class="section-title"><h2 id="terrain-heading">参数平面</h2><span>点击相邻格点，或用方向键踏出一步</span></div>
    <div class="terrain-frame">
      <svg id="terrain" class="no-pan" viewBox="0 0 980 530" role="application" aria-label="误差地形。当前位置在右上角，可点击橙色圈出的相邻格点，或按方向键移动。" tabindex="0"></svg>
    </div>
    <p class="terrain-caption">每个格点是一种参数组合；数字是同一批练习样本的损失测量值。</p>
  </section>
  <aside class="record min0" aria-labelledby="record-heading">
    <h2 id="record-heading">测量记录</h2>
    <div class="panel">
      <div class="field"><span class="field-label">当前位置</span><span class="field-value" id="position">w = 0.80，b = 0.60</span></div>
      <div class="field"><span class="field-label">当前损失</span><span class="big num" id="loss">0.92</span></div>
      <div class="field"><span class="field-label">已踏步数</span><span class="field-value" id="steps">0</span></div>
      <p id="step-message" aria-live="polite">从这里出发：比较相邻格点的测量值。</p>
    </div>
    <div class="controls" aria-label="踏点操作">
      <p class="controls-title">踏向相邻参数</p>
      <div class="ctl-grid">
        <span class="blank"></span><button class="btn" data-dir="up" aria-label="向上，偏置增加">↑ 上</button><span class="blank"></span>
        <button class="btn" data-dir="left" aria-label="向左，权重减小">← 左</button><span class="blank"></span><button class="btn" data-dir="right" aria-label="向右，权重增加">右 →</button>
        <span class="blank"></span><button class="btn" data-dir="down" aria-label="向下，偏置减小">↓ 下</button><span class="blank"></span>
      </div>
      <button class="btn reset" id="reset">重走</button>
      <p class="keyhint"><span class="key">←</span> <span class="key">↑</span> <span class="key">↓</span> <span class="key">→</span> 也可踏点</p>
    </div>
  </aside>
</main>
<footer><p class="takeaway">每一种参数组合都有一个损失高度；训练是在反复测量后，逐步离开高损失处。</p><p class="next">到了坡脚，究竟怎样判断每个旋钮该往哪边挪？</p></footer>
<div class="stepmark" aria-label="实验步数 09">STEP 09 / 20</div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(()=>{
  const vals=[[.55,.36,.31,.48,.74],[.39,.20,.16,.30,.58],[.36,.17,.12,.28,.55],[.52,.34,.31,.45,.68],[.76,.60,.58,.70,.92]];
  const ws=[0,.2,.4,.6,.8], bs=[-.2,0,.2,.4,.6];
  const initial=()=>({x:4,y:4,path:[{x:4,y:4}],steps:0,last:null});
  let state=initial();
  const svg=document.getElementById('terrain'), pos=document.getElementById('position'), loss=document.getElementById('loss'), steps=document.getElementById('steps'), message=document.getElementById('step-message');
  const X=160,Y=445,DX=154,DY=78;
  const value=(x,y)=>vals[y][x];
  const xy=(x,y)=>({x:X+x*DX,y:Y-y*DY});
  function esc(s){return String(s)}
  function render(){
    const p=xy(state.x,state.y), cur=value(state.x,state.y);
    pos.textContent=`w = ${ws[state.x].toFixed(2)}，b = ${bs[state.y].toFixed(2)}`;
    steps.textContent=state.steps;
    loss.textContent=cur.toFixed(2);
    loss.className='big num '+(state.last==='low'?'loss-low':state.last==='high'?'loss-high':'');
    const contours=`
      <path class="contour light" d="M90 115 C210 55 370 72 470 110 C595 158 702 82 892 139"/>
      <path class="contour" d="M92 204 C196 132 323 157 416 204 C516 254 635 164 881 218"/>
      <path class="contour" d="M94 300 C188 236 273 249 360 299 C470 360 590 234 870 312"/>
      <path class="contour light" d="M90 398 C194 335 292 349 379 404 C488 463 640 340 887 410"/>
      <ellipse class="contour" cx="470" cy="294" rx="126" ry="76"/><ellipse class="contour light" cx="470" cy="294" rx="68" ry="39"/>`;
    let grid=''; for(let i=0;i<5;i++){let a=xy(i,0),b=xy(i,4);grid+=`<line class="gridline" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;a=xy(0,i);b=xy(4,i);grid+=`<line class="gridline" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`}
    let labels=''; for(let i=0;i<5;i++){let a=xy(i,0),b=xy(0,i);labels+=`<text class="tick" text-anchor="middle" x="${a.x}" y="478">${ws[i].toFixed(2)}</text><text class="tick" text-anchor="end" x="128" y="${b.y+5}">${bs[i].toFixed(2)}</text>`}
    const path=state.path.map(q=>{const a=xy(q.x,q.y);return `${a.x},${a.y}`}).join(' ');
    let past=state.path.slice(0,-1).map(q=>{const a=xy(q.x,q.y);return `<circle class="past" cx="${a.x}" cy="${a.y}" r="7"/>`}).join('');
    const dirs=[['left',-1,0],['right',1,0],['up',0,1],['down',0,-1]];
    const candidates=dirs.map(([d,dx,dy])=>{const nx=state.x+dx,ny=state.y+dy;if(nx<0||nx>4||ny<0||ny>4)return '';const a=xy(nx,ny);return `<g role="button" tabindex="-1" data-x="${nx}" data-y="${ny}" aria-label="${d}，损失 ${value(nx,ny).toFixed(2)}"><circle class="candidate" cx="${a.x}" cy="${a.y}" r="25"/><text class="candidate-text" text-anchor="middle" x="${a.x}" y="${a.y+5}">${value(nx,ny).toFixed(2)}</text></g>`}).join('');
    svg.innerHTML=`<title>参数平面与损失等高线</title><desc>蓝色横轴是权重 w，蓝色纵轴是偏置 b。橙色圆点是当前参数位置，邻近圆圈标出可踏的参数组合和损失。</desc>${grid}${contours}<line class="axis" x1="130" y1="445" x2="840" y2="445"/><line class="axis" x1="160" y1="475" x2="160" y2="78"/>${labels}<text class="axislabel" x="500" y="515" text-anchor="middle">权重 w</text><text class="axislabel" transform="translate(42 284) rotate(-90)" text-anchor="middle">偏置 b</text><text class="clabel" x="700" y="120">损失较高</text><text class="clabel" x="520" y="260">损失较低</text><polyline class="track" points="${path}"/>${past}${candidates}<circle class="current" cx="${p.x}" cy="${p.y}" r="12"/><text x="${p.x+18}" y="${p.y-17}" font-size="14" font-weight="700">现在</text>`;
  }
  function move(dx,dy){const nx=state.x+dx,ny=state.y+dy;if(nx<0||nx>4||ny<0||ny>4){message.textContent='已经到了表格边缘；请选择仍在参数平面内的方向。';return}const before=value(state.x,state.y), after=value(nx,ny);state.x=nx;state.y=ny;state.steps++;state.path.push({x:nx,y:ny});state.last=after<before?'low':after>before?'high':'same';message.innerHTML=after<before?'<span class="step-focus">这一步更低。</span> 当前位置的损失下降了。':after>before?'<span class="step-focus">这一步更高，仍可换方向再试。</span> 当前位置的损失上升了。':'这一步测到相同的损失；也可比较其他方向。';render()}
  function reset(){state=initial();message.textContent='已重走：回到初始脚印，比较相邻格点的测量值。';render();document.getElementById('reset').focus()}
  svg.addEventListener('click',e=>{const g=e.target.closest('[data-x]');if(g){svg.focus();move(+g.dataset.x-state.x,+g.dataset.y-state.y)}});
  document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>{const d={left:[-1,0],right:[1,0],up:[0,1],down:[0,-1]}[b.dataset.dir];move(...d)}));
  document.getElementById('reset').addEventListener('click',reset);
  document.getElementById('stage').addEventListener('keydown',e=>{const map={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]};if(map[e.key] && (e.target.closest('#terrain, .controls'))){e.preventDefault();e.stopPropagation();move(...map[e.key])}});
  render();
  Deck.init({index:9,total:20});
})();
</script>
</body>
</html>
