<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F6F1E7;--text:#1E2A30;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E56B3F;--param:#246B8F;--paper:#F6F1E7;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text)}
#stage{height:900px;padding:28px 56px;display:flex;flex-direction:column;overflow:hidden;font-family:var(--font-sans)}
header{height:126px;border-bottom:1px solid rgba(30,42,48,.26);padding:3px 0 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:40px}
.kicker{font:700 var(--fs-label) var(--font-mono);letter-spacing:1.7px;color:var(--param);margin-bottom:10px}.title{font-size:var(--fs-h1);line-height:1.25;font-weight:750;letter-spacing:-.5px}.header-note{font:var(--fs-sec)/1.45 var(--font-serif);width:305px;padding-top:19px;color:rgba(30,42,48,.78)}
main{flex:1;min-height:0;display:flex;gap:48px;padding:26px 0 17px}.network-zone{flex:1.16;min-width:0;display:flex;flex-direction:column}.order-zone{flex:.84;min-width:0;border-left:1px solid rgba(30,42,48,.26);padding-left:40px;display:flex;flex-direction:column}
.section-head{font-size:var(--fs-h2);font-weight:700;margin:0 0 7px}.instruction{font-size:var(--fs-sec);line-height:1.45;margin:0;color:rgba(30,42,48,.78)}
.network-panel{flex:1;min-height:0;margin-top:18px;border:1.5px solid var(--text);background:rgba(255,255,255,.2);position:relative;overflow:hidden}.flow-label{position:absolute;left:24px;top:18px;font:600 var(--fs-label) var(--font-sans);z-index:1}.flow-label span{color:var(--param)}.legend{position:absolute;left:24px;bottom:18px;display:flex;gap:18px;align-items:center;font-size:var(--fs-label);z-index:1}.line-key{width:42px;border-top:3px solid var(--text);display:inline-block;margin-right:7px;vertical-align:middle}.line-key.back{border-top-color:var(--param);border-top-style:dashed}.svgwrap{position:absolute;inset:55px 14px 55px}.network{width:100%;height:100%;overflow:visible}.forward{stroke:var(--text);stroke-width:4;fill:none;marker-end:url(#forwardArrow)}.back{stroke:var(--param);stroke-width:5;stroke-dasharray:11 9;fill:none;marker-end:url(#backArrow);opacity:0;transition:opacity .16s ease,stroke .16s ease}.back.active{opacity:1;stroke:var(--focus)}.back.done{opacity:1}.node{fill:var(--bg);stroke:var(--text);stroke-width:3}.node.on{stroke:var(--focus);stroke-width:5}.layer-label{font-family:var(--font-sans);font-size:18px;fill:var(--text);font-weight:700}.nodeword{font-family:var(--font-mono);font-size:15px;fill:var(--text)}
.sort-head{display:flex;justify-content:space-between;align-items:start;gap:16px}.reset{font:600 var(--fs-label) var(--font-sans);padding:8px 12px;border:1.5px solid var(--text);border-radius:4px;background:transparent;color:var(--text);cursor:pointer;white-space:nowrap}.reset:hover{background:rgba(30,42,48,.07)}
.cards{list-style:none;padding:0;margin:17px 0 0;display:flex;flex-direction:column;gap:10px}.responsibility{border:1.5px solid rgba(30,42,48,.72);border-left:6px solid var(--param);background:rgba(255,255,255,.26);display:flex;align-items:stretch;min-height:80px;cursor:grab;transition:transform .14s ease,border-color .14s ease,background .14s ease}.responsibility[draggable="true"]:active{cursor:grabbing}.responsibility.active{border-color:var(--focus);background:rgba(229,107,63,.09)}.responsibility.dragging{opacity:.45}.rank{width:42px;display:flex;align-items:center;justify-content:center;font:700 22px var(--font-mono);color:var(--param);border-right:1px solid rgba(30,42,48,.2)}.cardcopy{flex:1;min-width:0;padding:12px 8px 11px 13px;font-size:var(--fs-sec);line-height:1.35}.move{width:41px;border:0;border-left:1px solid rgba(30,42,48,.2);background:transparent;color:var(--text);font-size:20px;cursor:pointer}.move:hover,.move:focus-visible{background:rgba(36,107,143,.12)}.move:disabled{opacity:.28;cursor:default}
.feedback{margin-top:15px;border-top:3px solid var(--text);padding:14px 12px 0;font:var(--fs-lead)/1.4 var(--font-serif);min-height:72px}.feedback.good{border-color:var(--focus)}.feedback b{font-family:var(--font-sans);font-size:var(--fs-label);letter-spacing:.4px}.subhint{font-size:var(--fs-label);line-height:1.45;margin:8px 0 0;color:rgba(30,42,48,.73)}
footer{height:68px;border-top:1px solid rgba(30,42,48,.26);padding-top:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:40px}.takeaway{font:var(--fs-lead)/1.35 var(--font-serif);max-width:1020px}.next{font-size:var(--fs-label);line-height:1.4;width:360px}.next b{display:block;color:var(--param);font-size:var(--fs-tick);letter-spacing:1px;margin-bottom:3px}.stepmark{position:absolute;right:56px;bottom:19px;font:var(--fs-tick) var(--font-mono);color:rgba(30,42,48,.58)}
button:focus-visible,.responsibility:focus-visible{outline:3px solid var(--focus);outline-offset:3px}@media(prefers-reduced-motion:reduce){.back,.responsibility{transition:none}}
</style>
</head>
<body data-page="11" data-total="20">
<div id="stage">
<header><div><div class="kicker">STEP 03 · BACKWARD</div><div class="title">先从输出的错误开始，责任才能一路分回每条连接</div></div><div class="header-note">错误不是从输入端猜出来的。它先出现在预测和答案相遇的地方。</div></header>
<main class="split-lr">
<section class="network-zone min0" aria-labelledby="network-title"><h2 id="network-title" class="section-head">责任信号在网络里的路径</h2><p class="instruction">观察实线向右传递预测；虚线只能从输出端逐段往回走。</p>
<div class="network-panel panel"><div class="flow-label">前向：<span>位置读数 → 预测</span></div><div class="svgwrap"><svg class="network" viewBox="0 0 760 440" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">三层神经网络与反向责任信号</title><desc id="svgDesc">两个输入节点连接两个隐藏节点，再连接一个输出节点。实线向右，虚线从输出层逐段向左。</desc><defs><marker id="forwardArrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8Z" fill="#1E2A30"/></marker><marker id="backArrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M9,0 L0,4 L9,8Z" fill="#246B8F"/></marker></defs>
<text class="layer-label" x="88" y="49" text-anchor="middle">输入层</text><text class="layer-label" x="382" y="49" text-anchor="middle">隐藏层</text><text class="layer-label" x="662" y="49" text-anchor="middle">输出层</text>
<path class="forward" d="M122 150 L344 174"/><path class="forward" d="M122 150 L344 296"/><path class="forward" d="M122 318 L344 174"/><path class="forward" d="M122 318 L344 296"/><path class="forward" d="M420 174 L620 232"/><path class="forward" d="M420 296 L620 232"/>
<path id="path-b" class="back" d="M610 214 L432 163"/><path id="path-c" class="back" d="M334 162 L132 141"/><path class="back" d="M334 307 L132 326"/>
<circle id="in1" class="node" cx="88" cy="150" r="34"/><circle id="in2" class="node" cx="88" cy="318" r="34"/><circle id="hid1" class="node" cx="382" cy="174" r="34"/><circle id="hid2" class="node" cx="382" cy="296" r="34"/><circle id="out" class="node" cx="662" cy="232" r="34"/>
<text class="nodeword" x="88" y="155" text-anchor="middle">x₁</text><text class="nodeword" x="88" y="323" text-anchor="middle">x₂</text><text class="nodeword" x="382" y="179" text-anchor="middle">h₁</text><text class="nodeword" x="382" y="301" text-anchor="middle">h₂</text><text class="nodeword" x="662" y="237" text-anchor="middle">ŷ</text>
</svg></div><div class="legend"><span><i class="line-key"></i>前向：位置读数</span><span><i class="line-key back"></i>反向：责任信号 ←</span></div></div>
</section>
<section class="order-zone k-classification min0" aria-labelledby="order-title"><div class="sort-head"><div><h2 id="order-title" class="section-head">把责任排回去</h2><p class="instruction">把三张卡排成责任信号经过网络的顺序。</p></div><button class="reset" id="reset" type="button">重新排序</button></div>
<ol id="cards" class="cards" aria-label="责任信号排序卡"></ol><div id="feedback" class="feedback" aria-live="polite"></div><p class="subhint">可拖动卡片；也可聚焦卡片后按 ↑ ↓，或使用每张卡右侧的移动按钮。</p></section>
</main>
<footer><div class="takeaway">反向传播传回的不是答案，而是“这条连接对错误该负责多少”的信号。</div><div class="next"><b>下一问</b>拿到一条连接的责任信号后，权重究竟要挪多少？</div></footer><div class="stepmark">实验步数 03 / 20</div>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script>
<script>
(()=>{'use strict';
const initial=()=>({order:['c','b','a'],active:null,complete:false,drag:null,played:false});let state=initial();let timer=null;const cards=document.getElementById('cards'),feedback=document.getElementById('feedback'),reset=document.getElementById('reset');
const data={a:'比较预测与答案：错误先在输出端被看见',b:'输出层 → 隐藏层：分给靠近输出的连接',c:'隐藏层 → 输入层：再分给更早的连接'};const correct=['a','b','c'];
function isCorrect(){return state.order.every((v,i)=>v===correct[i])}function skipped(){for(let i=0;i<3;i++)if(state.order[i]!==correct[i])return correct[i];return null}
function clearTimers(){if(timer){clearTimeout(timer);timer=null}}
function setState(action){clearTimers();if(action.type==='reset'){state=initial();render();reset.focus();return}if(action.type==='move'){let i=state.order.indexOf(action.id),j=i+action.delta;if(j<0||j>=3)return;[state.order[i],state.order[j]]=[state.order[j],state.order[i]];state.active=action.id;state.complete=isCorrect();render();if(state.complete)playBackprop();return}if(action.type==='drop'){let from=state.order.indexOf(action.from),to=state.order.indexOf(action.to);if(from<0||to<0||from===to)return;let [item]=state.order.splice(from,1);state.order.splice(to,0,item);state.active=item;state.complete=isCorrect();state.drag=null;render();if(state.complete)playBackprop()}}
function render(){cards.innerHTML='';state.order.forEach((id,index)=>{let li=document.createElement('li');li.className='responsibility'+(state.active===id?' active':'');li.draggable=true;li.tabIndex=0;li.dataset.id=id;li.setAttribute('aria-label','第'+(index+1)+'位：'+data[id]+'。按上下方向键移动');li.innerHTML='<div class="rank">'+(index+1)+'</div><div class="cardcopy">'+data[id]+'</div><button class="move" type="button" aria-label="上移">↑</button><button class="move" type="button" aria-label="下移">↓</button>';let [up,down]=li.querySelectorAll('button');up.disabled=index===0;down.disabled=index===2;up.onclick=e=>{e.stopPropagation();setState({type:'move',id,delta:-1})};down.onclick=e=>{e.stopPropagation();setState({type:'move',id,delta:1})};li.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();setState({type:'move',id,delta:-1})}if(e.key==='ArrowDown'){e.preventDefault();setState({type:'move',id,delta:1})}});li.addEventListener('dragstart',e=>{state.drag=id;li.classList.add('dragging');e.dataTransfer.effectAllowed='move'});li.addEventListener('dragend',()=>{state.drag=null;li.classList.remove('dragging')});li.addEventListener('dragover',e=>e.preventDefault());li.addEventListener('drop',e=>{e.preventDefault();setState({type:'drop',from:state.drag,to:id})});cards.appendChild(li)});renderEvidence()}
function renderEvidence(){document.querySelectorAll('.back').forEach(x=>x.classList.remove('active','done'));document.querySelectorAll('.node').forEach(x=>x.classList.remove('on'));if(state.complete){if(state.played){document.querySelectorAll('.back').forEach(x=>x.classList.add('done'));['out','hid1','hid2','in1','in2'].forEach(x=>document.getElementById(x).classList.add('on'))}feedback.className='feedback good';feedback.innerHTML='<b>顺序正确</b>：先知道错在哪里，才能往前追问是谁造成的。';return}if(state.active){let target=skipped();if(target==='a')document.getElementById('out').classList.add('on');if(target==='b'){document.getElementById('path-b').classList.add('active');document.getElementById('out').classList.add('on')}if(target==='c'){document.getElementById('path-c').classList.add('active');document.getElementById('hid1').classList.add('on')}feedback.className='feedback';feedback.innerHTML='<b>还没有接上</b>：这一步太早了：前一层要先等后面传来责任信号。';}else{feedback.className='feedback';feedback.innerHTML='<b>从输出端开始</b>：先移动一张卡，检查责任有没有跳过该经过的层。'}}
function playBackprop(){if(state.played)return;if(Deck.reduced()){state.played=true;renderEvidence();return}document.getElementById('path-b').classList.add('done');document.getElementById('out').classList.add('on');timer=setTimeout(()=>{document.getElementById('hid1').classList.add('on');document.getElementById('hid2').classList.add('on');document.getElementById('path-c').classList.add('done');timer=setTimeout(()=>{state.played=true;renderEvidence()},420)},600)}
reset.addEventListener('click',()=>setState({type:'reset'}));render();Deck.init({index:11,total:20});window.addEventListener('pagehide',clearTimers,{once:true});
})();
</script>
</body></html>
