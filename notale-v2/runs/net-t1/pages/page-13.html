<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="13" data-total="20">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;gap:0;color:var(--text);background:var(--bg);}
    .p13-head{height:112px;flex:0 0 112px;border-bottom:1px solid rgba(30,42,48,.32);display:flex;align-items:center;justify-content:space-between;padding-bottom:16px}
    .p13-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--attention)}
    .p13-title{margin:9px 0 0;font:700 var(--fs-h1)/1.22 var(--font-sans);letter-spacing:-.025em}
    .p13-step{font:600 var(--fs-label)/1.2 var(--font-mono);color:rgba(30,42,48,.58);border-left:1px solid rgba(30,42,48,.35);padding-left:16px;white-space:nowrap}
    .p13-main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:28px;padding:20px 0 12px}
    .p13-rail{width:270px;flex:0 0 270px;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:18px}
    .p13-note{position:relative;border-left:3px solid var(--text);padding:8px 10px 8px 15px}
    .p13-note:after{content:"";position:absolute;right:-28px;top:50%;width:27px;border-top:1.5px solid var(--text)}
    .p13-note:before{content:"";position:absolute;right:-30px;top:calc(50% - 3px);border-left:6px solid var(--text);border-top:4px solid transparent;border-bottom:4px solid transparent}
    .p13-note .micro{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.08em;color:var(--param);margin-bottom:9px}
    .p13-note p{margin:0;font:var(--fs-body)/1.45 var(--font-sans)}
    .p13-evidence{width:100%;border-top:1px solid rgba(30,42,48,.35);border-bottom:1px solid rgba(30,42,48,.35);padding:13px 0 12px;font:var(--fs-sec)/1.45 var(--font-sans)}
    .p13-evidence b{font-family:var(--font-mono);font-size:var(--fs-label);color:var(--text)}
    .p13-evidence .line{display:block;margin-top:5px}
    .p13-figure{width:760px;height:570px;flex:0 0 760px;position:relative;display:flex;align-items:center;justify-content:center}
    .p13-figure svg{width:760px;height:570px;overflow:visible;transform:scale(1.08)}
    .p13-caption{position:absolute;left:98px;bottom:3px;font:var(--fs-label)/1.3 var(--font-sans);color:rgba(30,42,48,.76)}
    .p13-outcome{border-left-color:var(--attention)}
    .p13-outcome:after{border-color:var(--attention);border-width:1.5px}.p13-outcome:before{border-left-color:var(--attention)}
    .p13-outcome .micro{color:var(--attention)}
    .p13-outcome p{font-family:var(--font-serif);font-size:var(--fs-lead);line-height:1.42}
    .p13-footer{height:110px;flex:0 0 110px;border-top:1px solid rgba(30,42,48,.32);display:flex;align-items:center;gap:30px;position:relative;padding-right:118px}
    .p13-take{font:600 var(--fs-lead)/1.4 var(--font-serif);max-width:785px}
    .p13-next{border-left:3px solid var(--attention);padding-left:16px;font:600 var(--fs-body)/1.4 var(--font-sans)}
    .p13-next small{display:block;font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.09em;color:var(--attention);margin-bottom:7px}
    .p13-counter{position:absolute;right:0;bottom:17px;font:600 var(--fs-label)/1 var(--font-mono);color:rgba(30,42,48,.62);letter-spacing:.05em}
    .svg-axis{stroke:#1E2A30;stroke-width:2}.svg-grid{stroke:#1E2A30;stroke-width:1;opacity:.15}.svg-boundary{stroke:#1E2A30;stroke-width:4}.svg-region{fill:rgba(30,42,48,.14);stroke:#1E2A30;stroke-width:3}.svg-leader{fill:none;stroke:#E56B3F;stroke-width:1.8}.svg-dot{fill:#F6F1E7;stroke:#1E2A30;stroke-width:3}.svg-cross{stroke:#1E2A30;stroke-width:3}.svg-error{stroke:#E56B3F;stroke-width:4;fill:#F6F1E7}.svg-text{fill:#1E2A30;font-family:var(--font-sans)}.svg-label{font-size:15px;font-weight:600}.svg-tick{font-size:13px;font-family:var(--font-mono)}.svg-tag{fill:#F6F1E7;stroke:#1E2A30;stroke-width:1.5}.svg-tag-text{font-size:15px;font-weight:700}.svg-small{font-size:14px}.svg-attn{fill:#E56B3F;font-size:15px;font-weight:700}
  </style>

  <header class="p13-head">
    <div class="min0">
      <div class="p13-kicker">CHAPTER III · LIMIT</div>
      <h1 class="p13-title">一条线已经会学习了；但真实问题未必能被一条线切开。</h1>
    </div>
    <div class="p13-step">实验步数 · 13 / 20</div>
  </header>

  <main class="p13-main min0">
    <aside class="p13-rail min0" aria-label="已有能力">
      <section class="p13-note">
        <div class="micro">ALREADY LEARNED</div>
        <p>一条直线边界，能把位于两侧的样本分开。</p>
      </section>
      <div class="tag" style="align-self:flex-start">一条直线边界</div>
      <div class="p13-evidence"><b>它能表达：</b><span class="line">这侧 / 那侧，两个半边。</span><span class="line">一侧只能给一种判断。</span></div>
    </aside>

    <figure class="p13-figure focus min0" aria-labelledby="plot-cap">
      <svg viewBox="0 0 760 570" role="img" aria-label="同一坐标图中，中央作业区和外侧位置无法被一条斜线同时正确分开">
        <defs><marker id="arrowHead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9z" fill="#1E2A30"/></marker></defs>
        <!-- coordinate frame: -1 to 1 on both axes -->
        <line class="svg-grid" x1="170" y1="55" x2="170" y2="455"/><line class="svg-grid" x1="370" y1="55" x2="370" y2="455"/><line class="svg-grid" x1="570" y1="55" x2="570" y2="455"/>
        <line class="svg-grid" x1="170" y1="55" x2="570" y2="55"/><line class="svg-grid" x1="170" y1="255" x2="570" y2="255"/><line class="svg-grid" x1="170" y1="455" x2="570" y2="455"/>
        <rect x="170" y="55" width="400" height="400" fill="none" class="svg-axis"/>
        <line class="svg-axis" x1="170" y1="255" x2="583" y2="255" marker-end="url(#arrowHead)"/><line class="svg-axis" x1="370" y1="455" x2="370" y2="42" marker-end="url(#arrowHead)"/>
        <text class="svg-text svg-tick" x="162" y="477">−1.00</text><text class="svg-text svg-tick" x="360" y="477">0</text><text class="svg-text svg-tick" x="556" y="477">1.00</text>
        <text class="svg-text svg-tick" x="130" y="60">1.00</text><text class="svg-text svg-tick" x="149" y="260">0</text><text class="svg-text svg-tick" x="122" y="458">−1.00</text>
        <text class="svg-text svg-label" x="594" y="261">位置 x</text><text class="svg-text svg-label" x="379" y="43">位置 y</text>

        <!-- central target region -->
        <path class="svg-region" d="M370 126 C438 126 493 180 493 254 C493 328 441 382 369 383 C298 383 246 331 246 255 C246 180 301 126 370 126Z"/>
        <rect class="svg-tag" x="313" y="225" width="114" height="29" rx="0"/><text class="svg-text svg-tag-text" x="329" y="245">作业区内</text>
        <!-- one straight boundary -->
        <line class="svg-boundary" x1="176" y1="125" x2="564" y2="400"/>
        <rect class="svg-tag" x="443" y="105" width="130" height="29" rx="0"/><text class="svg-text svg-tag-text" x="454" y="125">一条直线边界</text>
        <line class="svg-axis" x1="447" y1="136" x2="499" y2="172"/>
        <text class="svg-text svg-small" x="190" y="104">判为作业区外</text><text class="svg-text svg-small" x="431" y="430">判为作业区内</text>

        <!-- correctly placed target dots -->
        <circle class="svg-dot" cx="346" cy="286" r="7"/><circle class="svg-dot" cx="394" cy="300" r="7"/><circle class="svg-dot" cx="321" cy="318" r="7"/><circle class="svg-dot" cx="420" cy="342" r="7"/>
        <!-- correctly placed outer crosses -->
        <g class="svg-cross"><path d="M216 185l14 14m0-14l-14 14"/><path d="M504 185l14 14m0-14l-14 14"/><path d="M246 373l14 14m0-14l-14 14"/><path d="M510 325l14 14m0-14l-14 14"/></g>
        <!-- two unavoidable errors -->
        <circle class="svg-error" cx="360" cy="174" r="9"/><path class="svg-leader" d="M354 166 L286 123 L228 123"/><text class="svg-attn" x="178" y="118">区内点被分到外侧</text>
        <circle class="svg-error" cx="498" cy="365" r="9"/><path class="svg-leader" d="M505 371 L585 413 L670 413"/><text class="svg-attn" x="578" y="437">区外点被分到内侧</text>

        <!-- legend -->
        <circle class="svg-dot" cx="190" cy="520" r="6"/><text class="svg-text svg-small" x="203" y="525">作业区内</text>
        <path class="svg-cross" d="M294 514l12 12m0-12l-12 12"/><text class="svg-text svg-small" x="314" y="525">作业区外</text>
        <circle class="svg-error" cx="402" cy="520" r="7"/><text class="svg-text svg-small" x="416" y="525">顾此失彼</text>
      </svg>
      <figcaption id="plot-cap" class="p13-caption">同一批位置点：目标区域在中间，非目标位置围在外侧。</figcaption>
    </figure>

    <aside class="p13-rail min0" aria-label="观察结论">
      <section class="p13-note p13-outcome">
        <div class="micro">NEW SHAPE</div>
        <p>线无论怎么摆，总有一侧顾不过来。</p>
      </section>
      <div class="tag" style="align-self:flex-start">两个被分错的点</div>
      <div class="p13-evidence"><b>问题要求：</b><span class="line">中间 / 外围，像一圈边界。</span><span class="line">同一条线要兼顾整一圈。</span></div>
    </aside>
  </main>

  <footer class="p13-footer">
    <div class="p13-take">学习不只是在一条边界上调旋钮，也要有能力表示问题真正的形状。</div>
    <div class="p13-next"><small>NEXT QUESTION</small>如果让几个简单判断器协作，边界会怎样变化？</div>
    <div class="p13-counter">实验步数 · 13 / 20</div>
  </footer>
</div>

</body>
