<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F6F1E7;--text:#1E2A30;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E56B3F}
*{box-sizing:border-box}
#stage{height:900px;padding:28px 56px;display:flex;flex-direction:column;color:var(--text);background:var(--bg);overflow:hidden}
.page-head{height:108px;flex:none;border-bottom:1px solid rgba(30,42,48,.28);display:flex;align-items:flex-start;justify-content:space-between;padding-top:7px}
.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--param);margin-bottom:12px}
h1{margin:0;font:700 var(--fs-h1)/1.25 var(--font-sans);letter-spacing:.01em}
.head-note{font:var(--fs-sec)/1.45 var(--font-serif);width:250px;margin:32px 0 0;color:#526067;border-left:3px solid var(--attention);padding-left:13px}
.ledger{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0, 1.78fr) minmax(360px, .82fr);column-gap:54px;padding-top:22px}
.questions,.records{min-width:0;min-height:0;display:flex;flex-direction:column}
.column-label{height:28px;flex:none;font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.09em;color:#526067;border-bottom:1px solid rgba(30,42,48,.2);padding-bottom:10px}
.question-list,.record-list{flex:1;min-height:0;display:grid;grid-template-rows:repeat(3,1fr)}
.question-row,.record-row{min-width:0;border-bottom:1px solid rgba(30,42,48,.2)}
.question-row{padding:14px 16px 12px 14px;display:grid;grid-template-columns:55px minmax(0,1fr);column-gap:13px;background-color:#dcd6ca;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 17px,rgba(30,42,48,.12) 17px,rgba(30,42,48,.12) 19px)}
.q-index{font:700 21px/1 var(--font-mono);color:var(--param);padding-top:3px}
.q-main{min-width:0}
.q-text{font:600 var(--fs-body)/1.38 var(--font-sans);margin:0 0 10px}
.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.opt{position:relative;min-width:0;min-height:64px;border:1px solid #809097;background:#d4cdc0;display:flex;align-items:center;padding:8px 10px;cursor:pointer;font:var(--fs-label)/1.24 var(--font-sans);transition:background .12s,border-color .12s}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt-letter{font:700 var(--fs-label)/1 var(--font-mono);flex:none;margin-right:7px;color:#526067}
.opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.question-row.is-answered .opt:has(input:checked){background:#e5ecec;border-color:#1E2A30}
.question-row.is-answered .opt.correct{outline:3px solid var(--attention);outline-offset:-3px;border-color:var(--attention)}
.question-row.is-answered .opt.wrong-choice:has(input:checked){border:2px solid #7a4c43;background:#f1e1d9}
.fb{height:52px;margin-top:7px;padding:6px 10px;border-left:3px solid #9ba5a5;background:#f3eee5;font:var(--fs-sec)/1.35 var(--font-serif);color:#526067;overflow:hidden}
.question-row.is-answered .fb{color:var(--text)}
.record-row{display:flex;align-items:stretch;padding:14px 18px 12px 20px;position:relative;background-color:#dcd6ca;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 17px,rgba(30,42,48,.14) 17px,rgba(30,42,48,.14) 19px)}
.record-row::before{content:"";position:absolute;left:0;top:25%;bottom:25%;border-left:3px solid #9ba5a5}
.record-row.answered::before{border-color:var(--attention)}
.record-number{font:700 var(--fs-label)/1 var(--font-mono);color:var(--param);width:33px;flex:none}
.record-text{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;font:var(--fs-lead)/1.35 var(--font-serif)}
.record-label{display:block;font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.05em;color:#526067;margin-bottom:3px}
.record-field{display:block;min-height:25px;padding:3px 7px;margin:0 0 7px;border-bottom:1px solid #809097;font:var(--fs-label)/1.3 var(--font-sans);color:#526067}
.record-result{display:block;padding-left:7px}
.record-row.answered .record-text{font-weight:700}
.page-foot{height:78px;width:100%;flex:none;display:flex;align-items:flex-end;border-top:1px solid rgba(30,42,48,.28);padding-top:18px;position:relative}
.takeaway{font:var(--fs-lead)/1.42 var(--font-serif);margin:0;max-width:820px}
.next{position:absolute;right:0;bottom:20px;text-align:right;font:var(--fs-sec)/1.4 var(--font-sans);max-width:300px;color:#526067}
.next strong{color:var(--text)}
.reset{position:absolute;right:330px;top:15px;border:1px solid #526067;background:transparent;border-radius:0;padding:7px 11px;color:var(--text);font:600 var(--fs-label)/1 var(--font-sans);cursor:pointer}
.reset:hover{background:#e5ecec}.reset:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.complete{position:absolute;left:0;top:15px;font:700 var(--fs-sec)/1.3 var(--font-sans);color:var(--attention);opacity:0;transition:opacity .12s}
.complete.show{opacity:1}
.step{position:absolute;right:0;bottom:0;font:var(--fs-tick)/1 var(--font-mono);color:#526067;letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body data-page="18" data-total="20">
<div id="stage">
  <header class="page-head">
    <div><div class="kicker">CHECKPOINT 03</div><h1>能说清这三件事，才算看懂“学习”在做什么</h1></div>
    <p class="head-note">逐题判断：每个动作解决的是哪一种问题？</p>
  </header>
  <main class="ledger k-comparison" aria-label="三问诊断">
    <section class="questions min0" aria-labelledby="questions-label">
      <div class="column-label" id="questions-label">作答 · 选一项，再看判断依据</div>
      <div class="question-list" id="questionList"></div>
    </section>
    <aside class="records min0" aria-labelledby="records-label">
      <div class="column-label" id="records-label">观察记录 · 与左侧逐行对应</div>
      <div class="record-list" id="recordList"></div>
    </aside>
  </main>
  <footer class="page-foot">
    <p class="takeaway">调参数、反向分责任、留出新题，分别解决学习循环中不同的问题。</p>
    <div class="complete" id="complete" aria-live="polite"></div>
    <button class="reset" type="button" id="reset">重做三问</button>
    <div class="next"><strong>下一问</strong>　那么，这套学习循环可以压缩成哪五步？</div>
    <div class="step">实验步数 18 / 20</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  const questions = [
    {id:'01', text:'一批样本的预测和答案差得很远，首先该调什么？', options:[['A','参数旋钮（权重、偏置）'],['B','已知答案'],['C','测试题']], correct:0, record:'调参数', good:'对：权重和偏置是可调整的量；答案用来量出错多少。', bad:'答案不是旋钮；测试题也不参与这次参数更新。'},
    {id:'02', text:'为什么责任信号要从输出端往前传？', options:[['A','为了让每条连接知道自己造成了多少错误'],['B','为了把答案倒着输入网络'],['C','为了让预测回到输入']], correct:0, record:'传责任', good:'对：往前传的是“这条连接该承担多少”的信号，不是答案。', bad:'反向传播不把答案倒灌，也不把预测退回输入。'},
    {id:'03', text:'为什么要留一批训练时没见过的位置点？', options:[['A','检查新位置上是否仍判断正确'],['B','让训练样本数变少'],['C','让损失一定变成零']], correct:0, record:'留新题', good:'对：新点表现好，才支持它没有只记住训练点。', bad:'留测试点不是为了凑更小的损失，也不是故意少给训练例子。'}
  ];
  const fresh = () => ({answers:[null,null,null]});
  let state = fresh();
  const qList = document.getElementById('questionList');
  const rList = document.getElementById('recordList');
  const complete = document.getElementById('complete');
  const reset = document.getElementById('reset');
  const cleanup = [];
  function render(){
    qList.innerHTML = questions.map((q,i) => {
      const answer=state.answers[i], answered=answer!==null, right=answer===q.correct;
      const options=q.options.map((o,j)=>`<label class="opt ${j===q.correct?'correct':''} ${answered && j===answer && !right?'wrong-choice':''}"><input type="radio" name="q${i}" value="${j}" ${answer===j?'checked':''} aria-describedby="fb${i}"><span class="opt-letter">${o[0]}</span><span>${o[1]}</span></label>`).join('');
      const feedback=answered?(right?q.good:q.bad):'判断依据：请选择一项，判断这个动作处理的问题。';
      return `<article class="question-row quiz ${answered?'is-answered':''} ${answered&&right?'is-correct':'is-wrong'}"><div class="q-index">${q.id}</div><div class="q-main"><p class="q-text">${q.text}</p><div class="options" role="radiogroup" aria-label="第 ${q.id} 题选项">${options}</div><div class="fb" id="fb${i}">${feedback}</div></div></article>`;
    }).join('');
    rList.innerHTML = questions.map((q,i)=>{const a=state.answers[i], answered=a!==null;return `<div class="record-row ${answered?'answered':''}" data-question="${i}"><span class="record-number">${q.id}</span><div class="record-text"><span class="record-label">选择的内容</span><span class="record-field">${answered?q.options[a][0]+' '+q.options[a][1]:'—'}</span><span class="record-label">本题动作</span><span class="record-field">${answered?q.record:'—'}</span><span class="record-label">观察记录</span><span class="record-result">${answered?'已判断':'等待判断'}</span></div></div>`}).join('');
    const done=state.answers.every(a=>a!==null);
    complete.textContent=done?'3 个关键动作已区分；可改选重做。':'';
    complete.classList.toggle('show',done);
  }
  function choose(index,value){
    if(!Number.isInteger(index)||!Number.isInteger(value)||index<0||index>2||value<0||value>2) return;
    state={...state,answers:state.answers.map((a,i)=>i===index?value:a)};
    render();
  }
  function onChange(e){if(e.target.matches('input[type="radio"]')) choose(Number(e.target.name.slice(1)),Number(e.target.value));}
  qList.addEventListener('change',onChange); cleanup.push(()=>qList.removeEventListener('change',onChange));
  function resetAll(){state=fresh();render();reset.focus();complete.textContent='已恢复为三题未判断状态。';}
  reset.addEventListener('click',resetAll); cleanup.push(()=>reset.removeEventListener('click',resetAll));
  window.addEventListener('pagehide',()=>cleanup.splice(0).forEach(fn=>fn()),{once:true});
  Deck.init({index:18,total:20});
  render();
})();
</script>
</body>
</html>
