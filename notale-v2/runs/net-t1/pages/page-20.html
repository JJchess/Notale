<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="20" data-total="20">
<div id="stage">
  <style>
    #stage.page20-stage{display:flex;flex-direction:column;color:var(--text);}
    .page20-stage *{box-sizing:border-box;}
    .p20-header{height:106px;flex:0 0 106px;display:flex;flex-direction:column;align-items:center;text-align:center;border-bottom:1px solid rgba(30,42,48,.28);}
    .p20-kicker{font:700 var(--fs-label)/1.2 var(--font-sans);letter-spacing:.16em;color:var(--param);}
    .p20-title{margin:10px 0 0;font:700 var(--fs-h1)/1.2 var(--font-sans);letter-spacing:.01em;}
    .p20-main{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding-top:38px;}
    .p20-claim{position:relative;z-index:2;width:660px;text-align:center;padding:20px 28px 21px;border:3px solid var(--text);background:var(--bg);font:700 var(--fs-lead)/1.45 var(--font-serif);}
    .p20-claim strong{font-family:var(--font-sans);}
    .p20-tree{position:absolute;z-index:0;top:128px;left:50%;width:1120px;height:420px;transform:translateX(-50%);pointer-events:none;}
    .p20-tree path,.p20-tree line{fill:none;stroke:rgba(30,42,48,.7);stroke-width:2;}
    .p20-tree .end{stroke:var(--param);stroke-width:3;}
    .p20-questions{position:relative;z-index:1;width:1050px;margin-top:49px;margin-left:70px;display:flex;flex-direction:column;gap:23px;}
    .p20-question{min-height:98px;display:flex;align-items:center;border-top:1px solid rgba(30,42,48,.58);border-bottom:1px solid rgba(30,42,48,.22);background:rgba(246,241,231,.94);padding:13px 22px 13px 0;}
    .p20-tag{width:146px;flex:0 0 146px;align-self:stretch;display:flex;align-items:center;justify-content:center;margin-right:24px;border-right:1px solid rgba(30,42,48,.32);background:rgba(36,107,143,.11);color:var(--param);font:700 var(--fs-sec)/1 var(--font-sans);letter-spacing:.11em;}
    .p20-qtext{flex:1;font:500 var(--fs-h2)/1.38 var(--font-sans);letter-spacing:.01em;}.p20-proof{flex:0 0 105px;margin-left:14px;border-left:1px solid rgba(30,42,48,.22);padding-left:14px;color:rgba(30,42,48,.63);font:600 var(--fs-tick)/1.35 var(--font-mono);}.p20-qtext small{display:block;margin-top:3px;color:rgba(30,42,48,.68);font:500 var(--fs-label)/1.35 var(--font-sans);letter-spacing:0;}
    .p20-focusword{color:var(--attention);font-weight:800;border-bottom:2px solid var(--attention);}
    .p20-bottom{height:122px;flex:0 0 122px;display:flex;align-items:flex-end;justify-content:center;position:relative;padding-bottom:13px;}
    .p20-close{width:950px;text-align:center;padding-top:13px;border-top:2px solid var(--text);font:500 var(--fs-lead)/1.42 var(--font-serif);}
    .p20-next{position:absolute;left:0;bottom:13px;width:250px;font:500 var(--fs-label)/1.42 var(--font-sans);color:rgba(30,42,48,.78);text-align:left;}
    .p20-step{position:absolute;right:0;bottom:13px;color:rgba(30,42,48,.62);font:600 var(--fs-tick)/1 var(--font-mono);letter-spacing:.12em;}
  </style>
  <header class="p20-header">
    <div class="p20-kicker">TAKE THE CLAIM APART</div>
    <h1 class="p20-title">听到“模型学会了”，先追问三件事。</h1>
  </header>
  <main class="p20-main min0" aria-label="检查模型是否学会的三项证据">
    <div class="p20-claim"><strong>“学会了”</strong> 是一句笼统的结论；把它拆成可检查的证据。</div>
    <svg class="p20-tree" viewBox="0 0 1050 400" aria-hidden="true">
      <path d="M560 0 V46 H35 V370"/>
      <line class="end" x1="35" y1="96" x2="70" y2="96"/>
      <line class="end" x1="35" y1="217" x2="70" y2="217"/>
      <line class="end" x1="35" y1="338" x2="70" y2="338"/>
    </svg>
    <section class="p20-questions k-generalization min0" aria-label="三条追问">
      <article class="p20-question panel min0">
        <div class="p20-tag tag">参数</div>
        <div class="p20-qtext">它调了什么参数？<small>核查：哪些量在训练中被改动</small></div><div class="p20-proof">训练<br>记录</div>
      </article>
      <article class="p20-question panel min0">
        <div class="p20-tag tag">误差</div>
        <div class="p20-qtext">它用什么误差判断自己猜错了多少？<small>核查：预测和答案怎样被比较</small></div><div class="p20-proof">损失<br>定义</div>
      </article>
      <article class="p20-question panel min0">
        <div class="p20-tag tag">检验</div>
        <div class="p20-qtext">它又在哪些没见过的<span class="p20-focusword">新数据</span>上通过了检验？<small>核查：证据是否来自未参与训练的题目</small></div><div class="p20-proof">新题<br>证据</div>
      </article>
    </section>
  </main>
  <footer class="p20-bottom">
    <div class="p20-next">下一次听到“学会了”，<br>你会先查哪一项证据？</div>
    <div class="p20-close">“学会”不是一句结论，而是一组可检查的训练与新题证据。</div>
    <div class="p20-step">实验步数&nbsp; 20 / 20</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>document.getElementById('stage').classList.add('page20-stage'); Deck.init({index:20,total:20});</script>
</body>
</html>
