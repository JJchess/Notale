<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/lib/katex.min.css">
  <script src="assets/lib/katex.min.js"></script>
  <style>
    #stage {
      padding: 44px 56px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      box-sizing: border-box;
      color: var(--text);
      font-family: var(--font-sans);
    }

    /* 顶部标题区 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: var(--fs-h1);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header-formula {
      font-size: 22px;
      color: var(--structure);
      font-weight: 500;
    }

    /* 主工作台：左右对比两栏 */
    .workbench {
      display: grid;
      grid-template-columns: 780px 1fr;
      column-gap: 56px;
      flex: 1;
      align-items: start;
    }

    .section-title {
      font-size: var(--fs-h2);
      font-weight: 600;
      margin: 0 0 16px 0;
      color: var(--text);
    }

    /* 左侧：计算图流向 */
    .flow-col {
      display: flex;
      flex-direction: column;
    }

    .svg-container {
      width: 780px;
      height: 400px;
    }

    .flow-verdict {
      margin-top: 14px;
      font-size: var(--fs-sec);
      color: var(--text);
      line-height: 1.45;
      border-left: 3px solid var(--structure);
      padding-left: 14px;
    }

    /* 右侧：线性坍塌证明与常用激活 */
    .proof-col {
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .proof-box {
      border-left: 3px solid var(--signal);
      padding-left: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .proof-title {
      font-size: var(--fs-lead);
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    .proof-eq {
      font-size: 19px;
      color: var(--structure);
    }

    .proof-text {
      font-size: var(--fs-sec);
      color: var(--text);
      margin: 0;
      line-height: 1.45;
    }

    /* 激活函数小卡 */
    .act-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .act-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      column-gap: 16px;
    }

    .act-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .act-item canvas {
      width: 192px;
      height: 144px;
      border: 1px solid var(--rule);
      background: #FFFFFF;
      display: block;
    }

    .act-name {
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--text);
    }

    .act-math {
      font-size: var(--fs-tick);
      color: var(--text);
    }
  </style>
</head>
<body data-page="NN" data-total="32">
  <div id="stage">
    <header>
      <h1>人工神经元与非线性激活</h1>
      <div class="header-formula" id="math-top"></div>
    </header>

    <div class="workbench">
      <!-- 左列：解剖计算图 -->
      <div class="flow-col">
        <h2 class="section-title">计算分解：仿射加权与非线性映射</h2>
        <div class="svg-container">
          <svg viewBox="0 0 780 400" width="780" height="400">
            <defs>
              <marker id="m-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 2 L 8 5 L 0 8 z" fill="#1C4436"/>
              </marker>
              <marker id="m-arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 2 L 8 5 L 0 8 z" fill="#D43811"/>
              </marker>
            </defs>

            <!-- 输入节点 x1, x2, x3 -->
            <circle cx="90" cy="90" r="30" fill="#FFFFFF" stroke="#1C4436" stroke-width="2"/>
            <text x="90" y="96" text-anchor="middle" font-size="19" font-family="KaTeX_Math, serif" fill="#151A18">x₁</text>

            <circle cx="90" cy="210" r="30" fill="#FFFFFF" stroke="#1C4436" stroke-width="2"/>
            <text x="90" y="216" text-anchor="middle" font-size="19" font-family="KaTeX_Math, serif" fill="#151A18">x₂</text>

            <circle cx="90" cy="330" r="30" fill="#FFFFFF" stroke="#1C4436" stroke-width="2"/>
            <text x="90" y="336" text-anchor="middle" font-size="19" font-family="KaTeX_Math, serif" fill="#151A18">x₃</text>

            <!-- 权重连线及标签 -->
            <line x1="120" y1="90" x2="330" y2="192" stroke="#1C4436" stroke-width="2" marker-end="url(#m-arrow)"/>
            <text x="210" y="126" text-anchor="middle" font-size="16" font-family="KaTeX_Math, serif" fill="#1C4436">w₁</text>

            <line x1="120" y1="210" x2="330" y2="210" stroke="#1C4436" stroke-width="2" marker-end="url(#m-arrow)"/>
            <text x="210" y="200" text-anchor="middle" font-size="16" font-family="KaTeX_Math, serif" fill="#1C4436">w₂</text>

            <line x1="120" y1="330" x2="330" y2="228" stroke="#1C4436" stroke-width="2" marker-end="url(#m-arrow)"/>
            <text x="210" y="292" text-anchor="middle" font-size="16" font-family="KaTeX_Math, serif" fill="#1C4436">w₃</text>

            <!-- 偏置 b -->
            <line x1="360" y1="75" x2="360" y2="145" stroke="#1C4436" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#m-arrow)"/>
            <rect x="338" y="44" width="44" height="30" rx="3" fill="#FFFFFF" stroke="#1C4436" stroke-width="1.5"/>
            <text x="360" y="65" text-anchor="middle" font-size="16" font-family="KaTeX_Math, serif" fill="#151A18">+b</text>

            <!-- 求和单元 -->
            <circle cx="360" cy="210" r="54" fill="#FFFFFF" stroke="#1C4436" stroke-width="2.5"/>
            <text x="360" y="206" text-anchor="middle" font-size="34" font-weight="600" fill="#1C4436">Σ</text>
            <text x="360" y="238" text-anchor="middle" font-size="13" font-family="KaTeX_Math, serif" fill="#5B6661">z=wᵀx+b</text>

            <!-- 中间标量 z -->
            <line x1="414" y1="210" x2="518" y2="210" stroke="#1C4436" stroke-width="2.5" marker-end="url(#m-arrow)"/>
            <text x="466" y="200" text-anchor="middle" font-size="18" font-family="KaTeX_Math, serif" fill="#1C4436">z</text>

            <!-- 激活单元 -->
            <circle cx="560" cy="210" r="38" fill="#FFFFFF" stroke="#D43811" stroke-width="2.5"/>
            <text x="560" y="219" text-anchor="middle" font-size="28" font-family="KaTeX_Math, serif" font-style="italic" fill="#D43811">σ</text>
            <text x="560" y="270" text-anchor="middle" font-size="13" fill="#5B6661">非线性映射</text>

            <!-- 输出激活 a -->
            <line x1="598" y1="210" x2="706" y2="210" stroke="#D43811" stroke-width="2.5" marker-end="url(#m-arrow-red)"/>
            <circle cx="732" cy="210" r="24" fill="#FFFFFF" stroke="#D43811" stroke-width="2"/>
            <text x="732" y="217" text-anchor="middle" font-size="19" font-family="KaTeX_Math, serif" fill="#D43811">a</text>
          </svg>
        </div>
        <div class="flow-verdict">
          输入与权重内积加偏置生成仿射标量 <span id="math-verdict-z"></span>，再经由激活函数输出 <span id="math-verdict-a"></span>。
        </div>
      </div>

      <!-- 右列：线性坍塌证明与常用激活 -->
      <div class="proof-col">
        <div class="proof-box">
          <h3 class="proof-title">线性叠加坍塌证明</h3>
          <div class="proof-eq" id="math-collapse"></div>
          <p class="proof-text">
            没有非线性函数 <span style="color:var(--signal);font-weight:600;">σ</span> 时，多层复合仍可等价收缩为单一仿射矩阵，决策边界局限于超平面。
          </p>
        </div>

        <div class="act-group">
          <h3 class="proof-title">三种基准激活函数</h3>
          <div class="act-row">
            <div class="act-item">
              <canvas id="cv-sigmoid" width="192" height="144"></canvas>
              <div class="act-name">Sigmoid</div>
              <div class="act-math" id="math-sigmoid"></div>
            </div>

            <div class="act-item">
              <canvas id="cv-tanh" width="192" height="144"></canvas>
              <div class="act-name">Tanh</div>
              <div class="act-math" id="math-tanh"></div>
            </div>

            <div class="act-item">
              <canvas id="cv-relu" width="192" height="144"></canvas>
              <div class="act-name">ReLU</div>
              <div class="act-math" id="math-relu"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    人工神经元是网络的基础算子。
    它首先执行仿射变换，即各路输入与权重的内积再加上偏置项 b。
    关键看右侧公式：如果省去非线性激活函数，无论堆叠多少层隐藏层，线性变换的复合依然是线性变换，决策边界始终是平面。
    正是非线性激活弯曲了特征空间，使网络能够逼近非线性函数和任意复杂的分类边界。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      katex.render("a = \\sigma(\\mathbf{w}^T \\mathbf{x} + b)", document.getElementById("math-top"), { throwOnError: false });
      katex.render("z = \\mathbf{w}^T \\mathbf{x} + b", document.getElementById("math-verdict-z"), { throwOnError: false });
      katex.render("a = \\sigma(z)", document.getElementById("math-verdict-a"), { throwOnError: false });
      katex.render("\\mathbf{W}_2 (\\mathbf{W}_1 \\mathbf{x} + \\mathbf{b}_1) + \\mathbf{b}_2 = \\mathbf{W}' \\mathbf{x} + \\mathbf{b}'", document.getElementById("math-collapse"), { throwOnError: false });
      katex.render("\\sigma(z) = \\frac{1}{1 + e^{-z}}", document.getElementById("math-sigmoid"), { throwOnError: false });
      katex.render("\\tanh(z)", document.getElementById("math-tanh"), { throwOnError: false });
      katex.render("\\max(0, z)", document.getElementById("math-relu"), { throwOnError: false });

      drawActivation('cv-sigmoid', z => 1 / (1 + Math.exp(-z)), -5, 5, -0.2, 1.2);
      drawActivation('cv-tanh', z => Math.tanh(z), -5, 5, -1.3, 1.3);
      drawActivation('cv-relu', z => Math.max(0, z), -5, 5, -0.8, 5.2);

      Deck.init({ index: 5, total: 32 });
    });

    function drawActivation(cvId, fn, minX, maxX, minY, maxY) {
      const cv = document.getElementById(cvId);
      if (!cv) return;
      const ctx = cv.getContext('2d');
      const w = cv.width;
      const h = cv.height;

      const mapX = x => ((x - minX) / (maxX - minX)) * (w - 28) + 14;
      const mapY = y => h - (((y - minY) / (maxY - minY)) * (h - 28) + 14);

      ctx.fillStyle = '#FAFCFB';
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = '#BAC4BF';
      ctx.lineWidth = 1;
      
      // X 轴
      if (minY <= 0 && maxY >= 0) {
        const y0 = mapY(0);
        ctx.beginPath();
        ctx.moveTo(10, y0);
        ctx.lineTo(w - 10, y0);
        ctx.stroke();
      }

      // Y 轴
      if (minX <= 0 && maxX >= 0) {
        const x0 = mapX(0);
        ctx.beginPath();
        ctx.moveTo(x0, 10);
        ctx.lineTo(x0, h - 10);
        ctx.stroke();
      }

      // 曲线
      ctx.strokeStyle = '#D43811';
      ctx.lineWidth = 2.4;
      ctx.beginPath();

      const steps = 80;
      for (let i = 0; i <= steps; i++) {
        const x = minX + (i / steps) * (maxX - minX);
        const y = fn(x);
        const cx = mapX(x);
        const cy = mapY(y);
        if (i === 0) ctx.moveTo(cx, cy);
        else ctx.lineTo(cx, cy);
      }
      ctx.stroke();

      ctx.fillStyle = '#5B6661';
      ctx.font = '13px sans-serif';
      if (minY <= 0 && maxY >= 0 && minX <= 0 && maxX >= 0) {
        ctx.fillText('0', mapX(0) + 4, mapY(0) - 4);
      }
    }
  </script>
</body>
</html>
