<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/lib/katex.min.css">
  <style>
    :root {
      --bg: #F1F4F2;
      --text: #151A18;
      --muted: #5B6661;
      --rule: #BAC4BF;
      --structure: #1C4436;
      --signal: #D43811;
      --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      box-sizing: border-box;
      padding: 48px 56px 36px 56px;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: var(--fs-h1);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--structure);
    }

    .main-canvas {
      width: 100%;
      height: 610px;
      margin-top: 20px;
    }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--rule);
      padding-top: 14px;
      margin-top: 6px;
    }

    .formula-box {
      font-size: var(--fs-h2);
      color: var(--structure);
    }

    .legend-row {
      display: flex;
      gap: 32px;
      font-size: var(--fs-label);
      color: var(--text);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 2px;
    }

    /* SVG 内部排版样式，字号完全对应主题 token */
    svg text {
      font-family: var(--font-sans);
    }
    .text-title {
      font-size: 22px;
      font-weight: 600;
      fill: var(--text);
    }
    .text-lead {
      font-size: 18px;
      fill: var(--muted);
    }
    .text-math {
      font-family: "KaTeX_Math", "Times New Roman", serif;
      font-size: 22px;
      fill: var(--text);
      text-anchor: middle;
      dominant-baseline: central;
    }
    .text-math-sub {
      font-family: "KaTeX_Math", "Times New Roman", serif;
      font-size: 16px;
      fill: var(--text);
    }
    .text-param {
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .text-annotation {
      font-size: 15px;
      fill: var(--muted);
      text-anchor: middle;
      dominant-baseline: central;
    }
    .text-tick {
      font-size: 13px;
      fill: var(--muted);
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
  <script src="assets/lib/katex.min.js"></script>
</head>
<body data-page="20" data-total="32">
  <div id="stage">
    <header>
      <h1>时序递推与时间展开</h1>
    </header>

    <div class="main-canvas">
      <svg viewBox="0 0 1488 620">
        <defs>
          <marker id="arr-structure" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1C4436"/>
          </marker>
          <marker id="arr-signal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D43811"/>
          </marker>
        </defs>

        <!-- 分割虚线 -->
        <line x1="420" y1="20" x2="420" y2="580" stroke="#BAC4BF" stroke-dasharray="4 4" stroke-width="1.5"/>

        <!-- ======================= 左侧：闭环紧凑表示 ======================= -->
        <text x="30" y="46" class="text-title">单步闭环表示</text>
        <text x="30" y="80" class="text-lead">当前输入与上一时刻隐状态共同产生新状态</text>

        <!-- 闭环输入 x_t -->
        <g transform="translate(190, 480)">
          <circle cx="0" cy="0" r="34" fill="#FFFFFF" stroke="#BAC4BF" stroke-width="2"/>
          <text x="0" y="0" class="text-math">x_t</text>
          <text x="0" y="52" class="text-annotation">输入序列</text>
        </g>

        <!-- x_t -> h_t 连线 -->
        <line x1="190" y1="446" x2="190" y2="330" stroke="#1C4436" stroke-width="3" marker-end="url(#arr-structure)"/>
        <rect x="204" y="375" width="56" height="28" rx="4" fill="#FFFFFF" stroke="#BAC4BF" stroke-width="1"/>
        <text x="232" y="389" class="text-param" fill="#1C4436">W_xh</text>

        <!-- 隐状态单元 h_t -->
        <rect x="120" y="240" width="140" height="84" rx="12" fill="#FFFFFF" stroke="#D43811" stroke-width="3"/>
        <text x="190" y="272" class="text-math" font-weight="bold">h_t</text>
        <text x="190" y="302" class="text-tick">tanh</text>

        <!-- 自反馈回路：右侧出，环绕上方，左侧回入 -->
        <path d="M 260 282 C 345 282, 345 150, 190 150 C 60 150, 60 282, 112 282" 
              fill="none" stroke="#D43811" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arr-signal)"/>
        <rect x="162" y="136" width="56" height="28" rx="4" fill="#FFFFFF" stroke="#BAC4BF" stroke-width="1"/>
        <text x="190" y="150" class="text-param" fill="#D43811">W_hh</text>
        <text x="190" y="118" class="text-annotation" fill="#D43811">自反馈延迟传递</text>

        <!-- ======================= 右侧：沿时间展开计算图 ======================= -->
        <g transform="translate(470, 0)">
          <text x="0" y="46" class="text-title">计算图沿时间展开</text>
          <text x="0" y="80" class="text-lead">任意时间步 t 完全复用相同的参数矩阵</text>

          <!-- 初始隐状态 h_0 -->
          <g transform="translate(35, 282)">
            <circle cx="0" cy="0" r="30" fill="#F4F7F5" stroke="#BAC4BF" stroke-width="2" stroke-dasharray="4 3"/>
            <text x="0" y="0" class="text-math" fill="#5B6661">h_0</text>
            <text x="0" y="48" class="text-tick">初态 0</text>
          </g>

          <!-- h_0 -> h_1 连线 -->
          <line x1="65" y1="282" x2="164" y2="282" stroke="#D43811" stroke-width="3" marker-end="url(#arr-signal)"/>
          <rect x="94" y="268" width="54" height="28" rx="4" fill="#FFFFFF" stroke="#BAC4BF" stroke-width="1"/>
          <text x="121" y="282" class="text-param" fill="#D43811">W_hh</text>

          <!-- STEP 1 (t=1) -->
          <g transform="translate(170, 0)">
            <text x="70" y="205" class="text-annotation" fill="#1C4436">t = 1</text>
            <!-- 隐状态节点 h_1 -->
            <rect x="0" y="240" width="140" height="84" rx="12" fill="#FFFFFF" stroke="#1C4436" stroke-width="3"/>
            <text x="70" y="272" class="text-math" font-weight="bold">h_1</text>
            <text x="70" y="302" class="text-tick">tanh</text>

            <!-- 输入 x_1 -->
            <g transform="translate(70, 480)">
              <circle cx="0" cy="0" r="34" fill="#FFFFFF" stroke="#BAC4BF" stroke-width="2"/>
              <text x="0" y="0" class="text-math">x_1</text>
              <text x="0" y="52" class="text-annotation">词元 1</text>
            </g>

            <!-- x_1 -> h_1 连线 -->
            <line x1="70" y1="446" x2="70" y2="330" stroke="#1C4436" stroke-width="3" marker-end="url(#arr-structure)"/>
            <rect x="84" y="375" width="56" height="28" rx="4" fill="#FFFFFF" stroke="#BAC4BF" stroke-width="1"/>
            <text x="112" y="389" class="text-param" fill="#1C4436">W_xh</text>
          </g>

          <!-- h_1 -> h_2 连线 -->
          <line x1="310" y1="282" x2="444" y2="282" stroke="#D43811" stroke-width="3" marker-end="url(#arr-signal)"/>
          <rect x="357" y="268" width="54" height="28" rx="4" fill="#FFFFFF" stroke="#BAC4BF" stroke-width="1"/>
          <text x="384" y="282" class="text-param" fill="#D43811">W_hh</text>

          <!-- STEP 2 (t=2) -->
          <g transform="translate(450, 0)">
            <text x="70" y="205" class="text-annotation" fill="#1C4436">t = 2</text>
            <!-- 隐状态节点 h_2 -->
            <rect x="0" y="240" width="140" height="84" rx="12" fill="#FFFFFF" stroke="#1C4436" stroke-width="3"/>
            <text x="70" y="272" class="text-math" font-weight="bold">h_2</text>
            <text x="70" y="302" class="text-tick">tanh</text>

            <!-- 输入 x_2 -->
            <g transform="translate(70, 480)">
              <circle cx="0" cy="0" r="34" fill="#FFFFFF" stroke="#BAC4BF" stroke-width="2"/>
              <text x="0" y="0" class="text-math">x_2</text>
              <text x="0" y="52" class="text-annotation">词元 2</text>
            </g>

            <!-- x_2 -> h_2 连线 -->
            <line x1="70" y1="446" x2="70" y2="330" stroke="#1C4436" stroke-width="3" marker-end="url(#arr-structure)"/>
            <rect x="84" y="375" width="56" height="28" rx="4" fill="#FFFFFF" stroke="#BAC4BF" stroke-width="1"/>
            <text x="112" y="389" class="text-param" fill="#1C4436">W_xh</text>
          </g>

          <!-- h_2 -> h_3 连线 -->
          <line x1="590" y1="282" x2="724" y2="282" stroke="#D43811" stroke-width="3" marker-end="url(#arr-signal)"/>
          <rect x="637" y="268" width="54" height="28" rx="4" fill="#FFFFFF" stroke="#BAC4BF" stroke-width="1"/>
          <text x="664" y="282" class="text-param" fill="#D43811">W_hh</text>

          <!-- STEP 3 (t=3) -->
          <g transform="translate(730, 0)">
            <text x="70" y="205" class="text-annotation" fill="#D43811">t = 3</text>
            <!-- 隐状态节点 h_3 当前焦点 -->
            <rect x="0" y="240" width="140" height="84" rx="12" fill="#FFFFFF" stroke="#D43811" stroke-width="3"/>
            <text x="70" y="272" class="text-math" font-weight="bold">h_3</text>
            <text x="70" y="302" class="text-tick">tanh</text>

            <!-- 输入 x_3 -->
            <g transform="translate(70, 480)">
              <circle cx="0" cy="0" r="34" fill="#FFFFFF" stroke="#BAC4BF" stroke-width="2"/>
              <text x="0" y="0" class="text-math">x_3</text>
              <text x="0" y="52" class="text-annotation">词元 3</text>
            </g>

            <!-- x_3 -> h_3 连线 -->
            <line x1="70" y1="446" x2="70" y2="330" stroke="#1C4436" stroke-width="3" marker-end="url(#arr-structure)"/>
            <rect x="84" y="375" width="56" height="28" rx="4" fill="#FFFFFF" stroke="#BAC4BF" stroke-width="1"/>
            <text x="112" y="389" class="text-param" fill="#1C4436">W_xh</text>
          </g>

          <!-- 序列持续省略 -->
          <line x1="870" y1="282" x2="940" y2="282" stroke="#D43811" stroke-width="3" stroke-dasharray="6 5"/>
          <text x="965" y="282" class="text-math" fill="#5B6661">⋯</text>
        </g>
      </svg>
    </div>

    <div class="footer-bar">
      <div class="formula-box" id="eq-main"></div>
      <div class="legend-row">
        <div class="legend-item">
          <span class="swatch" style="background:#1C4436"></span>
          <span>输入矩阵 W_xh 跨步固定</span>
        </div>
        <div class="legend-item">
          <span class="swatch" style="background:#D43811"></span>
          <span>隐状态循环矩阵 W_hh 跨步固定</span>
        </div>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    循环神经网络利用序列结构的关键是：参数跨时间步完全共享。
    左图是单步闭环图，当前输入与前一时刻隐状态汇合更新；右图是将其沿时间轴展开为前向无环图。
    虽然时间展开图看起来像许多层，但每一时间步的权重矩阵 W_xh 与 W_hh 都是同一组参数。
    这保证了模型可以用固定参数量处理变长序列，历史信息全部压缩在定长向量 h_t 中传递。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      Deck.init({ index: 20, total: 32 });
      const eqEl = document.getElementById("eq-main");
      if (window.katex && eqEl) {
        katex.render("h_t = \\tanh(W_{hh} h_{t-1} + W_{xh} x_t + b)", eqEl, { throwOnError: false });
      }
    });
  </script>
</body>
</html>
