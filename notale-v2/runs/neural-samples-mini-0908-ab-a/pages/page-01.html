<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>神经网络：从可学习的函数到 CNN、RNN 与注意力机制</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      contain: layout paint;
      padding: var(--pad-y) var(--pad-x);
    }

    #field-canvas {
      z-index: 1;
      pointer-events: none;
    }

    /* 封面排版区域：左侧保护区，坚守白板与纯粹文字层级 */
    .title-region {
      position: absolute;
      top: 200px;
      left: 104px;
      width: 780px;
      z-index: 4;
      pointer-events: none;
    }

    .main-title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: 1.35;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
      margin: 0 0 24px 0;
      max-width: 680px;
    }

    .lead-copy {
      font-family: var(--font-sans);
      font-size: var(--fs-lead);
      line-height: 1.55;
      color: var(--muted);
      margin: 0 0 38px 0;
      max-width: 580px;
    }

    /* 架构演进指示轴：极简墨绿线连接核心范式 */
    .paradigm-rail {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: var(--font-mono);
      font-size: var(--fs-sec);
      color: var(--structure);
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .paradigm-rail .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--structure);
      display: inline-block;
    }

    .paradigm-rail .sep {
      color: var(--muted);
      opacity: 0.6;
    }

    /* 右侧图例与参数空间状态标记 */
    .field-legend {
      position: absolute;
      bottom: 48px;
      right: 72px;
      z-index: 4;
      display: flex;
      gap: 32px;
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      color: var(--muted);
      pointer-events: none;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-stroke {
      width: 24px;
      height: 2px;
    }

    .stroke-forward {
      background: var(--structure);
      height: 2.5px;
    }

    .stroke-gradient {
      background: var(--signal);
      height: 2px;
      position: relative;
    }
    .stroke-gradient::after {
      content: "";
      position: absolute;
      right: 0;
      top: -3px;
      border-left: 5px solid var(--signal);
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
    }
  </style>
</head>
<body data-page="NN" data-total="32">
  <div id="stage">
    <canvas id="field-canvas" class="cv-fill"></canvas>

    <div class="title-region">
      <h1 class="main-title">神经网络：从可学习的函数到 CNN、RNN 与注意力机制</h1>
      <p class="lead-copy">数据有什么结构，网络如何利用这种结构，以及参数怎样从误差中学会。</p>
      <div class="paradigm-rail">
        <span class="dot"></span>
        <span>MLP</span>
        <span class="sep">→</span>
        <span>CNN</span>
        <span class="sep">→</span>
        <span>RNN</span>
        <span class="sep">→</span>
        <span>ATTENTION</span>
      </div>
    </div>

    <div class="field-legend">
      <div class="legend-item">
        <span class="legend-stroke stroke-forward"></span>
        <span style="color: var(--text);">前向映射通路</span>
      </div>
      <div class="legend-item">
        <span class="legend-stroke stroke-gradient"></span>
        <span style="color: var(--text);">误差梯度反向更新</span>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    欢迎来到神经网络与深度学习课程。这是一堂 120 分钟的入门课，我们将从最核心的问题出发：为什么全连接网络不能高效处理一切数据？从图像的局部空间平移、序列的时间递推，到注意力的内容寻址，我们将探究网络如何针对数据结构设计先验，以及参数如何通过链式法则与反向传播从误差信号中完成自我演进。
  </aside>

  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      const WIDTH = 1600;
      const HEIGHT = 900;
      const SEED = "neural-cover-2025";
      const REPRESENTATIVE_TIME = 4200;

      const canvas = document.getElementById("field-canvas");
      const staticLayer = document.createElement("canvas");
      let ctx;
      let model;
      let stopLoop = () => {};
      let removeResize = () => {};

      Deck.init({ index: 1, total: 32, keys: false });

      // 标题避让保护区：位于左半侧
      function insideTitleSafe(x, y) {
        // 使用更柔和的椭圆势场避让，消除生硬的垂直截断缝隙
        const dx = (x - 420) / 440;
        const dy = (y - 360) / 240;
        return (dx * dx + dy * dy) < 1.0;
      }

      // 计算高维损失曲面的二维映射流场：
      // 在右侧构建一个明显的收敛凹陷（极值点在 (1240, 470)）
      function vectorField(x, y) {
        const targetX = 1240;
        const targetY = 470;
        const dx = x - targetX;
        const dy = y - targetY;
        const r2 = dx * dx + dy * dy + 4500;

        // 旋转与收缩混合动力学
        let fx = -dx / Math.pow(r2, 0.46) - dy * 0.0016;
        let fy = -dy / Math.pow(r2, 0.46) + dx * 0.0016;

        // 添加曲面起伏，但在标题区域平滑衰减
        const distToCenter = Math.hypot(x - 500, y - 400);
        const waveWeight = Math.min(1, Math.max(0, (distToCenter - 300) / 200));
        fx += Math.sin(y * 0.006) * 0.35 * waveWeight;
        fy += Math.cos(x * 0.005) * 0.32 * waveWeight;

        const len = Math.hypot(fx, fy) || 1;
        return { x: fx / len, y: fy / len };
      }

      // 积分生成前向张量流线
      function traceForwardStreamline(startX, startY, steps, stepSize) {
        let curX = startX;
        let curY = startY;
        const points = [];

        for (let i = 0; i < steps; i++) {
          points.push({ x: curX, y: curY });
          const v = vectorField(curX, curY);
          curX += v.x * stepSize;
          curY += v.y * stepSize;

          if (curX < -60 || curX > WIDTH + 60 || curY < -60 || curY > HEIGHT + 60) break;
          // 靠近核心收敛点
          if (Math.hypot(curX - 1240, curY - 470) < 18) break;
        }

        return points;
      }

      // 积分生成反向梯度刺入线（沿着梯度反向即负场方向追踪）
      function traceGradientLine(startX, startY, steps, stepSize) {
        let curX = startX;
        let curY = startY;
        const points = [];

        for (let i = 0; i < steps; i++) {
          points.push({ x: curX, y: curY });
          const v = vectorField(curX, curY);
          // 反向反梯度穿刺
          curX -= v.x * stepSize;
          curY -= v.y * stepSize;

          if (curX < -60 || curX > WIDTH + 60 || curY < -60 || curY > HEIGHT + 60) break;
        }

        return points;
      }

      function buildModel() {
        const rng = new Math.seedrandom(SEED);
        const forwardPaths = [];
        const gradientPaths = [];

        // 1. 生成前向墨绿实线通路（覆盖画布右侧与底层，避让标题核心区）
        const numForward = 52;
        for (let i = 0; i < numForward; i++) {
          const startX = rng() * (WIDTH * 0.7) + WIDTH * 0.3;
          const startY = rng() * HEIGHT;
          // 跳过靠近左下角密集杂线的起点
          if (startX < 650 && startY > 520) continue;
          const pts = traceForwardStreamline(startX, startY, 140, 6.5);
          if (pts.length > 18) {
            forwardPaths.push({
              points: pts,
              width: 1.1 + rng() * 1.3,
              alpha: 0.18 + rng() * 0.26
            });
          }
        }

        // 2. 生成若干条锐利的朱红梯度反向脉冲通路
        const numGrad = 9;
        for (let i = 0; i < numGrad; i++) {
          // 从收敛点附近向外反向刺出
          const startX = 1240 + (rng() - 0.5) * 80;
          const startY = 470 + (rng() - 0.5) * 80;
          const pts = traceGradientLine(startX, startY, 95, 7.5);
          if (pts.length > 20) {
            gradientPaths.push({
              points: pts,
              width: 1.6 + rng() * 0.8,
              alpha: 0.72 + rng() * 0.25,
              phase: rng(),
              period: 4500 + rng() * 2500
            });
          }
        }

        // 挑选 2 条前向主干流作为粒子前向行进通道
        const tracers = [
          { path: forwardPaths[4] || forwardPaths[0], phase: 0.1, period: 7200, color: 'structure' },
          { path: forwardPaths[12] || forwardPaths[1], phase: 0.6, period: 8400, color: 'structure' }
        ];

        return { forwardPaths, gradientPaths, tracers };
      }

      function drawStaticLayer() {
        staticLayer.width = canvas.width;
        staticLayer.height = canvas.height;
        const sctx = staticLayer.getContext("2d");
        const ratio = canvas.__r || 1;
        sctx.setTransform(ratio, 0, 0, ratio, 0, 0);

        // 背景
        sctx.fillStyle = Deck.token("--bg") || "#F1F4F2";
        sctx.fillRect(0, 0, WIDTH, HEIGHT);

        // 绘制微弱的实验室网格参考线
        sctx.strokeStyle = Deck.rgba("--rule", 0.35);
        sctx.lineWidth = 1;
        sctx.setLineDash([4, 8]);
        for (let x = 160; x < WIDTH; x += 160) {
          sctx.beginPath();
          sctx.moveTo(x, 0);
          sctx.lineTo(x, HEIGHT);
          sctx.stroke();
        }
        for (let y = 150; y < HEIGHT; y += 150) {
          sctx.beginPath();
          sctx.moveTo(0, y);
          sctx.lineTo(WIDTH, y);
          sctx.stroke();
        }
        sctx.setLineDash([]);

        // 绘制前向深墨绿通路
        const structureRgb = Deck.rgb("--structure") || [28, 68, 54];
        sctx.lineCap = "round";
        sctx.lineJoin = "round";

        for (const p of model.forwardPaths) {
          sctx.strokeStyle = `rgba(${structureRgb.join(",")}, ${p.alpha})`;
          sctx.lineWidth = p.width;
          sctx.beginPath();
          let drawing = false;

          for (const pt of p.points) {
            // 避让主标题文字核心区域，降低笔画对文字的干扰
            if (insideTitleSafe(pt.x, pt.y)) {
              drawing = false;
              continue;
            }
            if (!drawing) {
              sctx.moveTo(pt.x, pt.y);
              drawing = true;
            } else {
              sctx.lineTo(pt.x, pt.y);
            }
          }
          sctx.stroke();
        }

        // 绘制静止的反向梯度通路（细朱红线）
        const signalRgb = Deck.rgb("--signal") || [212, 56, 17];
        for (const g of model.gradientPaths) {
          sctx.strokeStyle = `rgba(${signalRgb.join(",")}, ${g.alpha * 0.45})`;
          sctx.lineWidth = g.width;
          sctx.beginPath();
          let drawing = false;

          for (const pt of g.points) {
            if (insideTitleSafe(pt.x, pt.y)) {
              drawing = false;
              continue;
            }
            if (!drawing) {
              sctx.moveTo(pt.x, pt.y);
              drawing = true;
            } else {
              sctx.lineTo(pt.x, pt.y);
            }
          }
          sctx.stroke();
        }

        // 极值点/收敛中心标记
        sctx.fillStyle = Deck.rgba("--structure", 0.85);
        sctx.beginPath();
        sctx.arc(1240, 470, 4.5, 0, Math.PI * 2);
        sctx.fill();

        sctx.strokeStyle = Deck.rgba("--structure", 0.4);
        sctx.lineWidth = 1.5;
        sctx.beginPath();
        sctx.arc(1240, 470, 12, 0, Math.PI * 2);
        sctx.stroke();

        sctx.font = '13px var(--font-mono)';
        sctx.fillStyle = Deck.rgba("--muted", 0.95);
        sctx.fillText("min L(w)", 1262, 474);
      }

      function samplePath(points, progress) {
        const total = points.length - 1;
        const pos = Math.max(0, Math.min(1, progress)) * total;
        const idx = Math.floor(pos);
        const rem = pos - idx;
        const p1 = points[idx];
        const p2 = points[Math.min(total, idx + 1)];
        return {
          x: p1.x + (p2.x - p1.x) * rem,
          y: p1.y + (p2.y - p1.y) * rem
        };
      }

      function drawTracers(time) {
        const signalRgb = Deck.rgb("--signal") || [212, 56, 17];
        const structRgb = Deck.rgb("--structure") || [28, 68, 54];

        // 1. 动态朱红梯度更新脉冲：从收敛处逆流刺回网络骨架
        for (const g of model.gradientPaths) {
          const prog = (g.phase + time / g.period) % 1;
          const head = samplePath(g.points, prog);
          if (insideTitleSafe(head.x, head.y)) continue;

          // 拖尾
          const tailLen = 16;
          let prev = null;
          ctx.lineCap = "round";
          for (let i = tailLen; i >= 0; i--) {
            const tProg = prog - i * 0.0035;
            if (tProg <= 0) continue;
            const pt = samplePath(g.points, tProg);
            if (insideTitleSafe(pt.x, pt.y)) {
              prev = null;
              continue;
            }
            if (prev) {
              const alpha = (1 - i / tailLen) * 0.9;
              ctx.strokeStyle = `rgba(${signalRgb.join(",")}, ${alpha})`;
              ctx.lineWidth = 1.2 + (1 - i / tailLen) * 2.2;
              ctx.beginPath();
              ctx.moveTo(prev.x, prev.y);
              ctx.lineTo(pt.x, pt.y);
              ctx.stroke();
            }
            prev = pt;
          }

          // 头部脉冲点
          ctx.fillStyle = `rgba(${signalRgb.join(",")}, 0.95)`;
          ctx.beginPath();
          ctx.arc(head.x, head.y, 2.8, 0, Math.PI * 2);
          ctx.fill();
        }

        // 2. 前向特征流动轻微脉动
        for (const t of model.tracers) {
          if (!t.path) continue;
          const prog = (t.phase + time / t.period) % 1;
          const head = samplePath(t.path.points, prog);
          if (insideTitleSafe(head.x, head.y)) continue;

          ctx.fillStyle = `rgba(${structRgb.join(",")}, 0.8)`;
          ctx.beginPath();
          ctx.arc(head.x, head.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function render(time) {
        if (!ctx || !model) return;
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        ctx.drawImage(staticLayer, 0, 0, WIDTH, HEIGHT);
        drawTracers(time);
      }

      function rebuild() {
        ctx = Deck.fit(canvas);
        if (!ctx) return;
        model = buildModel();
        drawStaticLayer();
        render(0);
      }

      function startMotion() {
        stopLoop();
        stopLoop = Deck.loop(time => {
          render(time);
        }, { still: REPRESENTATIVE_TIME });
      }

      rebuild();
      startMotion();
      removeResize = Deck.onResize(() => {
        rebuild();
      });
    })();
  </script>
</body>
</html>
