<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>MLP 与训练原理：参数如何从误差中更新</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 500px 1fr;
      padding: 76px 84px 72px;
      box-sizing: border-box;
      gap: 68px;
    }

    /* 左侧：标题与课程章程 */
    .title-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
    }

    .chapter-tag {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: var(--fs-sec);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--structure);
      margin-bottom: 28px;
    }
    .chapter-tag::before {
      content: "";
      display: inline-block;
      width: 28px;
      height: 2px;
      background: var(--structure);
    }

    h1 {
      margin: 0 0 20px;
      font-size: var(--fs-h1);
      line-height: 1.25;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .lead-p {
      margin: 0;
      font-size: var(--fs-lead);
      line-height: 1.5;
      color: var(--muted);
      max-width: 440px;
    }

    .core-questions {
      margin-top: auto;
      border-top: 1px solid var(--rule);
      padding-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .q-item {
      display: flex;
      gap: 14px;
      font-size: var(--fs-sec);
      line-height: 1.4;
      color: var(--text);
    }

    .q-num {
      color: var(--signal);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* 右侧：白板拓扑图解 */
    .diagram-col {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    svg.network-scene {
      width: 100%;
      height: 100%;
      max-height: 720px;
    }

    .svg-node-label {
      font-family: var(--font-sans);
      font-size: var(--fs-h2);
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .svg-flow-label {
      font-family: var(--font-sans);
      font-size: var(--fs-sec);
      letter-spacing: 0.04em;
      font-weight: 700;
    }

    .svg-math-label {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      text-anchor: middle;
      dominant-baseline: central;
    }

    .svg-tick-label {
      font-family: var(--font-sans);
      font-size: var(--fs-tick);
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
</head>
<body data-page="NN" data-total="32">
  <div id="stage">
    <div class="title-col">
      <div>
        <div class="chapter-tag">第二部分 · 30 分钟</div>
        <h1>MLP 与训练原理<br>参数如何从误差中更新</h1>
        <p class="lead-p">
          前向传播复合非线性映射建立预测，反向传播沿计算图应用链式法则分发局部梯度。
        </p>
      </div>

      <div class="core-questions">
        <div class="q-item">
          <span class="q-num">01</span>
          <span>非线性激活突破线性分类边界</span>
        </div>
        <div class="q-item">
          <span class="q-num">02</span>
          <span>链式法则反向刺入计算参数梯度</span>
        </div>
        <div class="q-item">
          <span class="q-num">03</span>
          <span>学习率与正则化防范过拟合陷阱</span>
        </div>
      </div>
    </div>

    <div class="diagram-col">
      <svg class="network-scene" viewBox="0 0 820 680" aria-label="MLP前向计算与反向梯度传播架构">
        <defs>
          <marker id="fwd-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1C4436"/>
          </marker>
          <marker id="bwd-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#D43811"/>
          </marker>
        </defs>

        <!-- 坐标与基底参考线 -->
        <g stroke="var(--rule)" stroke-dasharray="4 4" opacity="0.45">
          <line x1="80" y1="100" x2="740" y2="100" />
          <line x1="80" y1="580" x2="740" y2="580" />
        </g>

        <!-- 顶部：前向流动标注 -->
        <g transform="translate(380, 78)">
          <text class="svg-flow-label" fill="var(--structure)" text-anchor="middle">前向计算：加权求和与非线性映射</text>
          <line x1="-120" y1="28" x2="120" y2="28" stroke="var(--structure)" stroke-width="2.5" marker-end="url(#fwd-arr)"/>
        </g>

        <!-- 前向网络连接线（墨绿体系） -->
        <!-- x1, x2 -> h1, h2, h3 -->
        <g stroke="var(--structure)" stroke-width="2" fill="none" opacity="0.42">
          <line x1="124" y1="250" x2="354" y2="190" />
          <line x1="124" y1="250" x2="354" y2="340" />
          <line x1="124" y1="250" x2="354" y2="490" />
          <line x1="124" y1="430" x2="354" y2="190" />
          <line x1="124" y1="430" x2="354" y2="340" />
          <line x1="124" y1="430" x2="354" y2="490" />
        </g>

        <!-- h1, h2, h3 -> ŷ -->
        <g stroke="var(--structure)" stroke-width="2.5" fill="none" opacity="0.55">
          <line x1="406" y1="190" x2="574" y2="340" />
          <line x1="406" y1="340" x2="574" y2="340" />
          <line x1="406" y1="490" x2="574" y2="340" />
        </g>

        <!-- ŷ -> Loss (加粗实线) -->
        <line x1="626" y1="340" x2="702" y2="340" stroke="var(--structure)" stroke-width="3" marker-end="url(#fwd-arr)"/>

        <!-- 权重张量标签 W1, W2 -->
        <g transform="translate(236, 210)">
          <rect x="-22" y="-12" width="44" height="24" rx="4" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.2"/>
          <text class="svg-math-label" fill="var(--structure)" font-weight="700">W₁</text>
        </g>
        <g transform="translate(488, 252)">
          <rect x="-22" y="-12" width="44" height="24" rx="4" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.2"/>
          <text class="svg-math-label" fill="var(--structure)" font-weight="700">W₂</text>
        </g>

        <!-- 底部：反向传播标注 -->
        <g transform="translate(380, 622)">
          <text class="svg-flow-label" fill="var(--signal)" text-anchor="middle">反向传播：误差刺入与局部梯度链式分发</text>
          <line x1="120" y1="-24" x2="-120" y2="-24" stroke="var(--signal)" stroke-width="2.5" marker-end="url(#bwd-arr)"/>
        </g>

        <!-- 朱红反向刺入流动（双弧线穿透回传） -->
        <path d="M 726 384 C 680 500, 520 540, 410 496" stroke="var(--signal)" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#bwd-arr)"/>
        <path d="M 354 506 C 260 550, 190 520, 130 454" stroke="var(--signal)" stroke-width="2.2" stroke-dasharray="6 4" fill="none" marker-end="url(#bwd-arr)"/>

        <!-- 输入层节点 -->
        <g transform="translate(100, 250)">
          <circle r="26" fill="var(--bg)" stroke="var(--structure)" stroke-width="2.5"/>
          <text class="svg-node-label" fill="var(--structure)">x₁</text>
          <text class="svg-tick-label" fill="var(--muted)" y="40">输入特征</text>
        </g>
        <g transform="translate(100, 430)">
          <circle r="26" fill="var(--bg)" stroke="var(--structure)" stroke-width="2.5"/>
          <text class="svg-node-label" fill="var(--structure)">x₂</text>
          <text class="svg-tick-label" fill="var(--muted)" y="40">输入特征</text>
        </g>

        <!-- 隐藏层节点 -->
        <g transform="translate(380, 190)">
          <circle r="26" fill="var(--bg)" stroke="var(--structure)" stroke-width="2.5"/>
          <text class="svg-node-label" fill="var(--structure)">h₁</text>
          <text class="svg-tick-label" fill="var(--muted)" y="40">激活映射</text>
        </g>
        <g transform="translate(380, 340)">
          <circle r="26" fill="var(--bg)" stroke="var(--structure)" stroke-width="2.5"/>
          <text class="svg-node-label" fill="var(--structure)">h₂</text>
          <text class="svg-tick-label" fill="var(--muted)" y="40">隐层单元</text>
        </g>
        <g transform="translate(380, 490)">
          <circle r="26" fill="var(--bg)" stroke="var(--structure)" stroke-width="2.5"/>
          <text class="svg-node-label" fill="var(--structure)">h₃</text>
          <text class="svg-tick-label" fill="var(--muted)" y="40">特征组合</text>
        </g>

        <!-- 输出预测节点 -->
        <g transform="translate(600, 340)">
          <circle r="26" fill="var(--bg)" stroke="var(--structure)" stroke-width="2.5"/>
          <text class="svg-node-label" fill="var(--structure)">ŷ</text>
          <text class="svg-tick-label" fill="var(--muted)" y="40">预测输出</text>
        </g>

        <!-- 损失 Loss 节点（朱红框线焦点） -->
        <g transform="translate(730, 340)">
          <rect x="-26" y="-26" width="52" height="52" rx="6" fill="#FDF3F0" stroke="var(--signal)" stroke-width="2.5"/>
          <text class="svg-node-label" fill="var(--signal)">L</text>
          <text class="svg-tick-label" fill="var(--signal)" font-weight="700" y="44">Loss</text>
        </g>

        <!-- 反向梯度更新标牌 -->
        <g transform="translate(520, 520)">
          <rect x="-38" y="-13" width="76" height="26" rx="4" fill="#FDF3F0" stroke="var(--signal)" stroke-width="1.4"/>
          <text class="svg-math-label" fill="var(--signal)" font-weight="700">∇W₂</text>
        </g>
      </svg>
    </div>
  </div>

  <aside class="notes" hidden>
    这一章我们将系统剖析多层感知机（MLP）的计算内核与训练动力学。
    在白板图解中，深墨绿实线表示前向推导：输入经过权重聚合与非线性激活函数，映射为最终的预测输出与损失；
    而鲜艳的朱红色箭头则表示反向传播：损失值通过链式法则刺入内部各层，精确计算每个参数的局部梯度，并由优化器驱动参数更新。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 4, total: 32, keys: false });
  </script>
</body>
</html>
