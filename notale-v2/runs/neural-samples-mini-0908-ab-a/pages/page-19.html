<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>RNN 与 LSTM：利用时间与时序结构</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">

    }
    .legend-panel {

</head>
<body data-page="19" data-total="32">
  <div id="stage">
    <canvas id="field-canvas" class="cv-fill" aria-hidden="true"></canvas>

    <header class="header-group">
      <div class="chapter-tag">第 04 章 · 序列与时序结构</div>
      <h1>RNN 与 LSTM</h1>
      <div class="subhead">利用时间与时序结构</div>
      <p class="core-thesis">同一组循环参数在时序推进中复用，将变长序列逐步压缩进隐状态向量。</p>
    </header>

    <footer class="legend-panel">
      <div class="legend-item">
        <span class="legend-bar bar-forward"></span>
        <span>前向状态递推：h_t = tanh(W_h h_{t-1} + W_x x_t)</span>
      </div>
      <div class="legend-item">
        <span class="legend-bar bar-backward"></span>
        <span>时序反向梯度：跨时间展开与雅可比连乘衰减</span>
      </div>
    </footer>
  </div>

  <aside class="notes" hidden>
    本章我们讨论序列数据。不同于图像的空间局部性，文本和时间序列依赖严格的时序因果。
    循环网络通过在时间维度展开同一组权重 W_h 和 W_x，持续递推更新隐状态。
    我们将剖析状态压缩机制、跨时间反向传播中的梯度消失，以及 LSTM 门控如何提供恒常流动记忆通道。
  </aside>

  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
  (() => {
    "use strict";

    Deck.init({ index: 19, total: 32, keys: false });

    const canvas = document.getElementById("field-canvas");
    let ctx = null;

    // Horizontal time progression layout to keep clear margins and visual stability
    // Nodes unfold along x-axis from x=660 to x=1420 at balanced height
    const SEED = "rnn-lstm-cover-seed-2024";
    const STEPS = [
      { t: 0, x: 660, hy: 460 },
      { t: 1, x: 850, hy: 460 },
      { t: 2, x: 1040, hy: 460 },
      { t: 3, x: 1230, hy: 460 },
      { t: 4, x: 1420, hy: 460 }
    ];

    const NODES = STEPS.map(s => ({
      t: s.t,
      x: s.x,
      y: s.hy + 160,    // input x_t position (below h_t)
      hx: s.x,
      hy: s.hy,         // hidden cell h_t position
      yx: s.x,
      yy: s.hy - 160    // output projection y_t position (above h_t)
    }));

    function readTheme() {
      return {
        bg: Deck.rgb("bg") || [241, 244, 242],
        text: Deck.rgb("text") || [21, 26, 24],
        muted: Deck.rgb("muted") || [91, 102, 97],
        rule: Deck.rgb("rule") || [186, 196, 191],
        structure: Deck.rgb("structure") || [28, 68, 54],
        signal: Deck.rgb("signal") || [212, 56, 17]
      };
    }

    let theme = readTheme();

    function buildStreamlines() {
      const rng = new Math.seedrandom(SEED);
      const lines = [];

      // Forward recurrent streamlines flowing along hidden states h_0 -> h_1 -> ... -> h_4
      for (let i = 0; i < 30; i++) {
        const offset = (rng() - 0.5) * 54;
        const speed = 0.0005 + rng() * 0.0004;
        const phase = rng() * Math.PI * 2;
        const line = [];
        for (let seg = 0; seg <= 100; seg++) {
          const u = seg / 100;
          const totalT = (NODES.length - 1) * u;
          const idx = Math.min(NODES.length - 2, Math.floor(totalT));
          const f = totalT - idx;
          const p1 = NODES[idx];
          const p2 = NODES[idx + 1];
          const x = p1.hx + (p2.hx - p1.hx) * f;
          const y = p1.hy + offset * Math.sin(u * Math.PI * 4 + phase * 0.3);
          line.push({ x, y });
        }
        lines.push({ points: line, speed, phase, type: "forward", alpha: 0.16 + rng() * 0.22 });
      }

      // Backward gradient streams flowing backwards from h_4 to h_0 (slightly lower band)
      for (let i = 0; i < 20; i++) {
        const offset = (rng() - 0.5) * 44;
        const speed = 0.0007 + rng() * 0.0005;
        const phase = rng() * Math.PI * 2;
        const line = [];
        for (let seg = 0; seg <= 100; seg++) {
          const u = 1 - (seg / 100);
          const totalT = (NODES.length - 1) * u;
          const idx = Math.min(NODES.length - 2, Math.floor(totalT));
          const f = totalT - idx;
          const p1 = NODES[idx];
          const p2 = NODES[idx + 1];
          const x = p1.hx + (p2.hx - p1.hx) * f;
          const y = p1.hy + 50 + offset * Math.cos(u * Math.PI * 3 + phase);
          line.push({ x, y });
        }
        lines.push({ points: line, speed, phase, type: "backward", alpha: 0.18 + rng() * 0.24 });
      }

      return lines;
    }

    let streamlines = buildStreamlines();

    function drawSystem(time) {
      if (!ctx) return;
      ctx.clearRect(0, 0, 1600, 900);

      // 1. Draw structural graph
      ctx.save();
      for (let i = 0; i < NODES.length; i++) {
        const n = NODES[i];

        // Vertical link: x_t -> h_t
        ctx.beginPath();
        ctx.moveTo(n.x, n.y);
        ctx.lineTo(n.hx, n.hy);
        ctx.strokeStyle = `rgba(${theme.rule.join(",")}, 0.8)`;
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.stroke();

        // Vertical link: h_t -> y_t
        ctx.beginPath();
        ctx.moveTo(n.hx, n.hy);
        ctx.lineTo(n.yx, n.yy);
        ctx.strokeStyle = `rgba(${theme.rule.join(",")}, 0.8)`;
        ctx.setLineDash([]);
        ctx.stroke();

        // Parameter labels W_x, W_y
        ctx.fillStyle = `rgba(${theme.muted.join(",")}, 0.85)`;
        ctx.font = "13px monospace";
        ctx.textAlign = "right";
        ctx.fillText("W_x", n.x - 10, (n.y + n.hy) / 2 + 4);
        ctx.fillText("W_y", n.hx - 10, (n.hy + n.yy) / 2 + 4);

        // Input node x_t
        ctx.beginPath();
        ctx.arc(n.x, n.y, 7, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${theme.bg.join(",")}, 1)`;
        ctx.fill();
        ctx.strokeStyle = `rgba(${theme.muted.join(",")}, 0.9)`;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = `rgba(${theme.text.join(",")}, 0.9)`;
        ctx.font = "15px monospace";
        ctx.textAlign = "center";
        ctx.fillText(`x_${n.t}`, n.x, n.y + 26);

        // Output node y_t
        ctx.beginPath();
        ctx.arc(n.yx, n.yy, 7, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${theme.bg.join(",")}, 1)`;
        ctx.fill();
        ctx.strokeStyle = `rgba(${theme.structure.join(",")}, 0.9)`;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = `rgba(${theme.structure.join(",")}, 0.95)`;
        ctx.fillText(`y_${n.t}`, n.yx, n.yy - 14);

        // Hidden state cell h_t
        ctx.beginPath();
        ctx.arc(n.hx, n.hy, 22, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${theme.bg.join(",")}, 1)`;
        ctx.fill();
        ctx.strokeStyle = `rgba(${theme.structure.join(",")}, 1)`;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = `rgba(${theme.structure.join(",")}, 1)`;
        ctx.font = "bold 15px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(`h_${n.t}`, n.hx, n.hy);
      }

      // Recurrent links between consecutive hidden states
      for (let i = 0; i < NODES.length - 1; i++) {
        const a = NODES[i];
        const b = NODES[i + 1];
        ctx.beginPath();
        ctx.moveTo(a.hx + 22, a.hy);
        ctx.lineTo(b.hx - 22, b.hy);
        ctx.strokeStyle = `rgba(${theme.structure.join(",")}, 0.75)`;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = `rgba(${theme.structure.join(",")}, 1)`;
        ctx.font = "bold 13px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillText("W_h", (a.hx + b.hx) / 2, a.hy - 8);
      }
      ctx.restore();

      // 2. Dynamic streamlines
      ctx.save();
      for (let line of streamlines) {
        const pts = line.points;
        const isFwd = line.type === "forward";
        const baseColor = isFwd ? theme.structure : theme.signal;

        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let p = 1; p < pts.length; p++) {
          ctx.lineTo(pts[p].x, pts[p].y);
        }
        ctx.strokeStyle = `rgba(${baseColor.join(",")}, ${line.alpha * 0.45})`;
        ctx.lineWidth = isFwd ? 1.5 : 1.2;
        ctx.stroke();

        // Animated pulse
        const cycle = ((time * line.speed + line.phase) % 1 + 1) % 1;
        const pIdx = Math.floor(cycle * (pts.length - 1));
        const currPt = pts[pIdx];
        if (currPt) {
          let pulseAlpha = line.alpha * 1.6;
          if (!isFwd) {
            // Gradient attenuation: right (t=4) -> left (t=0)
            const xFrac = Math.max(0, Math.min(1, (currPt.x - 660) / (1420 - 660)));
            pulseAlpha *= (0.12 + 0.88 * xFrac);
          }

          ctx.beginPath();
          ctx.arc(currPt.x, currPt.y, isFwd ? 2.8 : 2.2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${baseColor.join(",")}, ${pulseAlpha})`;
          ctx.fill();
        }
      }
      ctx.restore();

      // 3. Mathematical recurrence identity in subtle watermark style
      ctx.save();
      ctx.font = "14px monospace";
      ctx.fillStyle = `rgba(${theme.muted.join(",")}, 0.8)`;
      ctx.textAlign = "left";
      ctx.fillText("∂L/∂h_0 = ∂L/∂h_T · ∏_{k=1}^T (W_h^T · diag(1 - h_k^2))", 660, 720);
      ctx.fillText("循环参数矩阵 W_h 跨时间连续作用，主导时序梯度的留存或指数衰减", 660, 746);
      ctx.restore();
    }

    function initCanvas() {
      ctx = Deck.fit(canvas);
      theme = readTheme();
      streamlines = buildStreamlines();
    }

    initCanvas();
    Deck.onResize(() => {
      initCanvas();
      drawSystem(0);
    });

    Deck.loop((time) => {
      drawSystem(time);
    }, { still: 2400 });

  })();
  </script>
</body>
</html>
