<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{ padding:0; }

  .head{ position:absolute; inset:56px 72px auto; }
  .head .nt-kicker{ margin-bottom:14px; }
  .head .nt-title{ font-size: var(--fs-h2); max-width: 30em; }
  .head .nt-lead{ margin-top:14px; max-width: 46em; }

  .rule{ position:absolute; left:72px; right:72px; top:222px; width:auto; }

  .panel{ position:absolute; top:250px; bottom:100px; }
  .panel-net{ left:72px; width:680px; }
  .panel-bnd{ left:800px; width:728px; }

  .panel-title{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:6px; }
  .panel-title .nt-label{ text-transform:uppercase; letter-spacing:.06em; flex:0 1 auto; min-width:0; }
  .panel-title .nt-tag{ font-size:13px; min-height:24px; padding:2px 8px; flex:0 0 auto; white-space:nowrap; }

  .panel-body{ position:absolute; top:38px; left:0; right:0; bottom:0; }

  svg{ width:100%; height:100%; display:block; overflow:visible; }

  .nt-node{ fill: var(--paper); stroke: var(--line-strong); stroke-width: var(--diagram-line-width); }
  .nt-node[data-role="input"]{ stroke: var(--stable); }
  .nt-node[data-role="hidden"]{ stroke: var(--accent); }
  .nt-node[data-role="output"]{ stroke: var(--text); }
  .nt-node-label{ fill: var(--text); font-family: var(--font-mono); font-size: 20px; text-anchor: middle; dominant-baseline: central; font-weight:600; }

  .nt-diagram-line{ fill:none; stroke: var(--line-strong); stroke-width: var(--diagram-line-width); }
  .nt-diagram-line[data-active="true"]{ stroke: var(--accent); }

  .h-annot{ font-family: var(--font-mono); font-size: 14px; fill: var(--muted); text-anchor: middle; }
  .h-annot[data-on="true"]{ fill: var(--accent); font-weight: 600; }

  .layer-cap{ font-family: var(--font-sans); font-size: var(--fs-label); fill: var(--muted); text-anchor: middle; font-weight:600; }

  .bnd-axis{ stroke: var(--line); stroke-width: 1px; }
  .bnd-line{ fill:none; stroke-width: 2.5px; stroke-dasharray: 7 6; opacity: 0; transition: opacity .3s; }
  .bnd-line[data-shown="true"]{ opacity: .9; }
  .bnd-region{ opacity: 0; transition: opacity .4s; }
  .bnd-region[data-shown="true"]{ opacity: 1; }
  .bnd-final{ fill:none; stroke: var(--text); stroke-width: 3.5px; opacity: 0; transition: opacity .4s; }
  .bnd-final[data-shown="true"]{ opacity: 1; }
  .pt{ r: 6px; }
  .pt-a{ fill: var(--accent); }
  .pt-b{ fill: var(--stable); }

  .foot-note{ position:absolute; left:72px; right:72px; bottom:24px; }

  .legend{ display:flex; gap:22px; align-items:center; }
  .legend-item{ display:flex; align-items:center; gap:8px; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
  .legend-swatch{ width:14px; height:3px; }
</style>
</head>
<body data-page="NN" data-total="44">
<div id="stage">

  <div class="head">
    <span class="nt-kicker">MLP · 分层组合</span>
    <h1 class="nt-title">两层网络把多个简单判决拼成一条弯曲边界</h1>
    <p class="nt-lead">每个隐藏单元仍是上一页那种加权和加激活，只画出一条直线判决。输出层把三条直线的判断再加权求和，组合出一条单条直线画不出的边界。</p>
  </div>

  <hr class="nt-rule rule">

  <div class="panel panel-net">
    <div class="panel-title">
      <span class="nt-label">网络结构</span>
      <span class="nt-tag" data-tone="accent" id="netTag">step 0 · 前向路径</span>
    </div>
    <div class="panel-body">
      <svg id="netSvg" viewBox="0 0 700 560" preserveAspectRatio="xMidYMid meet" aria-label="两层网络结构图">
        <!-- connections drawn by JS for active highlighting -->
        <g id="netLines"></g>
        <g id="netNodes"></g>
        <text class="layer-cap" x="70" y="40">输入层</text>
        <text class="layer-cap" x="350" y="40">隐藏层 · 3 个神经元</text>
        <text class="layer-cap" x="620" y="40">输出层</text>
      </svg>
    </div>
  </div>

  <div class="panel panel-bnd">
    <div class="panel-title">
      <span class="nt-label">决策边界 · 二维输入平面</span>
      <span class="nt-tag" id="bndTag">3 条直线的组合</span>
    </div>
    <div class="panel-body">
      <svg id="bndSvg" viewBox="0 0 712 470" preserveAspectRatio="xMidYMid meet" aria-label="决策边界演示">
        <g id="bndData"></g>
      </svg>
      <div class="legend" style="position:absolute; left:0; bottom:-2px;">
        <div class="legend-item"><span class="legend-swatch" style="background:var(--accent)"></span>A 类样本</div>
        <div class="legend-item"><span class="legend-swatch" style="background:var(--stable)"></span>B 类样本</div>
        <div class="legend-item"><span class="legend-swatch" style="border-top:2.5px dashed var(--muted); background:none; height:0;"></span>单个隐藏单元的直线</div>
        <div class="legend-item"><span class="legend-swatch" style="background:var(--text)"></span>组合后的最终边界</div>
      </div>
    </div>
  </div>

  <p class="nt-note foot-note" id="footNote">h₁、h₂、h₃ 各自只能画一条直线，把平面切成两半；输出层对三条直线的判断结果再做一次加权求和，才描出一条弯曲边界——这条边界本身不是任何一层单独学到的，是两层组合的产物。</p>

</div>
<script src="assets/base.js"></script>
<script>
(function(){
  "use strict";

  // ---- network diagram ----
  const netNodes = document.getElementById("netNodes");
  const netLines = document.getElementById("netLines");
  const netTag = document.getElementById("netTag");

  const INPUTS = [ {id:"x1", x:70, y:200, label:"x₁"}, {id:"x2", x:70, y:360, label:"x₂"} ];
  const HIDDEN = [ {id:"h1", x:350, y:130, label:"h₁"}, {id:"h2", x:350, y:280, label:"h₂"}, {id:"h3", x:350, y:430, label:"h₃"} ];
  const OUTPUT = [ {id:"y", x:620, y:280, label:"ŷ"} ];
  const R = 34;

  function svgEl(tag, attrs){
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  function drawLine(a, b, active){
    const line = svgEl("line", {
      class: "nt-diagram-line", x1: a.x, y1: a.y, x2: b.x, y2: b.y,
      "data-from": a.id, "data-to": b.id
    });
    if (active) line.setAttribute("data-active", "true");
    netLines.appendChild(line);
    return line;
  }

  function drawNode(n, role){
    const g = svgEl("g", {});
    const circle = svgEl("circle", { class:"nt-node", "data-role": role, cx:n.x, cy:n.y, r:R });
    const label = svgEl("text", { class:"nt-node-label", x:n.x, y:n.y });
    label.textContent = n.label;
    g.appendChild(circle); g.appendChild(label);
    netNodes.appendChild(g);
    return g;
  }

  const allLines = [];
  INPUTS.forEach(i => HIDDEN.forEach(h => allLines.push(drawLine(i, h, false))));
  HIDDEN.forEach(h => allLines.push(drawLine(h, OUTPUT[0], false)));
  INPUTS.forEach(n => drawNode(n, "input"));
  HIDDEN.forEach(n => drawNode(n, "hidden"));
  OUTPUT.forEach(n => drawNode(n, "output"));

  // per-hidden-unit annotation (weighted sum + activation), placed beside each hidden node
  const annotG = svgEl("g", {});
  HIDDEN.forEach((h, idx) => {
    const t = svgEl("text", { class:"h-annot", x:h.x, y:h.y + R + 22, "data-hidden": idx });
    t.textContent = "Σ→σ";
    annotG.appendChild(t);
  });
  document.getElementById("netSvg").appendChild(annotG);

  // ---- decision boundary diagram ----
  const bndData = document.getElementById("bndData");
  const bndTag = document.getElementById("bndTag");
  const W = 712, H = 470, PAD = 46;

  // fixed synthetic 2D points, two classes, seeded pattern (deterministic, hand-placed to need >1 line)
  // class A (accent) forms a bent band; class B (stable) fills the rest
  const POINTS = [
    {x:0.18,y:0.24,c:"A"},{x:0.24,y:0.34,c:"A"},{x:0.30,y:0.20,c:"A"},{x:0.34,y:0.42,c:"A"},
    {x:0.42,y:0.30,c:"A"},{x:0.46,y:0.50,c:"A"},{x:0.52,y:0.62,c:"A"},{x:0.58,y:0.70,c:"A"},
    {x:0.64,y:0.60,c:"A"},{x:0.60,y:0.78,c:"A"},{x:0.50,y:0.40,c:"A"},{x:0.38,y:0.28,c:"A"},
    {x:0.08,y:0.10,c:"B"},{x:0.14,y:0.62,c:"B"},{x:0.10,y:0.80,c:"B"},{x:0.22,y:0.86,c:"B"},
    {x:0.30,y:0.90,c:"B"},{x:0.44,y:0.86,c:"B"},{x:0.56,y:0.90,c:"B"},{x:0.70,y:0.82,c:"B"},
    {x:0.78,y:0.66,c:"B"},{x:0.82,y:0.46,c:"B"},{x:0.86,y:0.26,c:"B"},{x:0.76,y:0.14,c:"B"},
    {x:0.62,y:0.10,c:"B"},{x:0.48,y:0.08,c:"B"},{x:0.36,y:0.06,c:"B"},{x:0.90,y:0.60,c:"B"},
    {x:0.20,y:0.52,c:"B"},{x:0.68,y:0.36,c:"B"}
  ];

  function toX(u){ return PAD + u*(W-2*PAD); }
  function toY(v){ return PAD + v*(H-2*PAD); }

  // axes
  bndData.appendChild(svgEl("line", { class:"bnd-axis", x1:PAD, y1:H-PAD, x2:W-PAD, y2:H-PAD }));
  bndData.appendChild(svgEl("line", { class:"bnd-axis", x1:PAD, y1:PAD, x2:PAD, y2:H-PAD }));
  const xlab = svgEl("text", { class:"nt-tick", x:W-PAD, y:H-PAD+22, "text-anchor":"end" }); xlab.textContent = "x₁";
  const ylab = svgEl("text", { class:"nt-tick", x:PAD-10, y:PAD, "text-anchor":"end" }); ylab.textContent = "x₂";
  bndData.appendChild(xlab); bndData.appendChild(ylab);

  // three hidden-unit lines: linear boundaries u·x + v·y = c  (in unit square coords)
  // chosen so that intersection of half-planes approximates the bent A-band above
  const LINES = [
    { a:1, b:0.15, c:0.33, color:"var(--accent)", id:"h1" },   // roughly x1 + small x2 > 0.33  (excludes far-left B)
    { a:-1, b:0.9, c:0.05, color:"var(--stable)", id:"h2" },   // roughly -x1 + .9x2 > .05 (cuts lower-right B wedge)... will refine visually
    { a:0.3, b:-1, c:-0.62, color:"var(--text)", id:"h3" }
  ];
  // recompute with cleaner coefficients tuned to point cloud above, three lines forming a wedge that contains the "A" band
  const HLINES = [
    { p1:{x:0.33,y:0.0}, p2:{x:0.0,y:0.62}, color:"var(--accent)", id:"h1" },
    { p1:{x:1.0,y:0.02}, p2:{x:0.30,y:1.0}, color:"var(--stable)", id:"h2" },
    { p1:{x:0.86,y:0.0}, p2:{x:0.30,y:1.0}, color:"var(--text)", id:"h3" }
  ];

  const lineEls = [];
  HLINES.forEach(l => {
    const el = svgEl("line", {
      class:"bnd-line", x1:toX(l.p1.x), y1:toY(l.p1.y), x2:toX(l.p2.x), y2:toY(l.p2.y),
      stroke: l.color, "data-line": l.id
    });
    bndData.appendChild(el);
    lineEls.push(el);
  });

  // final combined boundary: a hand-authored polygon approximating the intersection of relevant half-planes,
  // matching the visual band occupied by class A points above
  const finalPath = "M " + toX(0.33) + " " + toY(0.0) +
    " L " + toX(0.86) + " " + toY(0.0) +
    " L " + toX(0.64) + " " + toY(0.60) +
    " L " + toX(0.60) + " " + toY(0.86) +
    " L " + toX(0.30) + " " + toY(0.55) +
    " Z";
  const region = svgEl("path", { class:"bnd-region", d: finalPath, fill:"color-mix(in srgb, var(--accent) 14%, transparent)" });
  bndData.appendChild(region);
  const finalLine = svgEl("path", { class:"bnd-final", d: finalPath });
  bndData.appendChild(finalLine);

  // data points on top
  POINTS.forEach(p => {
    const c = svgEl("circle", { class: "pt " + (p.c==="A" ? "pt-a" : "pt-b"), cx: toX(p.x), cy: toY(p.y) });
    bndData.appendChild(c);
  });

  // ---- step choreography ----
  const STEP_TEXT = [
    "step 0 · 前向路径",
    "step 1 · 三条直线判决",
    "step 2 · 组合成弯曲边界"
  ];
  const BND_TAG = [
    "3 条直线的组合",
    "每条虚线是一个隐藏单元",
    "实线区域是最终判定为 A 类的地方"
  ];
  const FOOT = [
    "输入 x₁、x₂ 送入三个隐藏单元，每个单元各自算一次加权和加激活；箭头标出这一次前向计算的路径。",
    "h₁、h₂、h₃ 各自只能画一条直线，把平面切成两半——单独看任何一条都分不开 A、B 两类样本。",
    "输出层对三条直线的判断结果再做一次加权求和，才描出这条弯曲边界；边界不是某一层单独学到的，是两层组合的产物。"
  ];

  function render(step){
    netTag.textContent = STEP_TEXT[step];
    bndTag.textContent = BND_TAG[step];
    document.getElementById("footNote").textContent = FOOT[step];

    allLines.forEach(l => l.removeAttribute("data-active"));
    annotG.querySelectorAll(".h-annot").forEach(t => t.removeAttribute("data-on"));
    lineEls.forEach(l => l.removeAttribute("data-shown"));
    region.removeAttribute("data-shown");
    finalLine.removeAttribute("data-shown");

    if (step === 0) {
      allLines.forEach(l => l.setAttribute("data-active", "true"));
    } else if (step === 1) {
      annotG.querySelectorAll(".h-annot").forEach(t => t.setAttribute("data-on", "true"));
      lineEls.forEach(l => l.setAttribute("data-shown", "true"));
    } else {
      annotG.querySelectorAll(".h-annot").forEach(t => t.setAttribute("data-on", "true"));
      lineEls.forEach(l => l.setAttribute("data-shown", "true"));
      region.setAttribute("data-shown", "true");
      finalLine.setAttribute("data-shown", "true");
    }
  }

  Deck.onStep(function(step, max){ render(Math.min(step, 2)); }, 2);
  Deck.init({ index:6, total:44 });
})();
</script>
</body>
</html>
