<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{position:relative}
  .fwd-header{position:absolute;inset:50px 70px auto 70px}
  .fwd-kicker-row{display:flex;align-items:baseline;justify-content:space-between}
  .fwd-title{margin-top:10px;max-width:1200px}
  .fwd-lead{margin-top:12px;max-width:1080px}
  .fwd-note{margin-top:14px;max-width:640px}

  .fwd-readout{position:absolute;top:96px;right:70px;text-align:right;
    opacity:0;transform:translateY(-6px);transition:opacity .5s,transform .5s}
  .fwd-readout[data-shown="true"]{opacity:1;transform:translateY(0)}
  .fwd-readout .nt-equation{font-size:34px;color:var(--accent);margin-top:4px}

  .fwd-diagram{position:absolute;inset:246px 40px 44px 40px}
  .fwd-diagram svg{width:100%;height:100%;display:block;overflow:visible}

  .fwd-hint{position:absolute;right:70px;bottom:20px;color:var(--muted)}

  .tier-label{fill:var(--muted);font:600 20px var(--font-sans);text-transform:none}
  .node-id{fill:var(--text);font:600 30px var(--font-sans);text-anchor:middle;dominant-baseline:central}
  .node-sub{fill:var(--muted);font:400 16px var(--font-sans);text-anchor:middle;dominant-baseline:central}

  .conn{fill:none;stroke:var(--line);stroke-width:var(--diagram-line-width,2.2);
    transition:stroke .45s,stroke-width .45s}
  .conn.is-active{stroke:var(--accent);stroke-width:calc(var(--diagram-line-width,2.2) + 2px)}
  .conn.is-done{stroke:var(--stable);stroke-width:var(--diagram-line-width,2.2)}

  .wt{font:600 18px var(--font-sans);text-anchor:middle;dominant-baseline:central;
    fill:var(--stable);transition:fill .45s}
  .wt.is-active{fill:var(--accent)}
  .wt.is-done{fill:var(--stable)}

  .panel{opacity:0;transition:opacity .45s}
  .panel.is-shown{opacity:1}
  .panel .nt-equation{font-size:19px}
  .panel .nt-equation.final{font-size:22px}
  .panel-mark{fill:var(--accent)}
</style>
</head>
<body data-page="NN" data-total="44">
<div id="stage">

  <header class="fwd-header">
    <div class="fwd-kicker-row">
      <span class="nt-kicker">MLP · 前向计算</span>
      <span class="nt-tag">教学简化数值例 · 非真实训练结果</span>
    </div>
    <h1 class="nt-title fwd-title">两个数字，代入同一组公式，一步步算成一个概率</h1>
    <p class="nt-lead fwd-lead">权重与偏置固定不变，从 x₁、x₂ 出发依次求两个隐藏激活，再合成输出概率。</p>
    <p class="nt-note fwd-note">σ(z) = 1 / (1 + e<sup>−z</sup>)，把任意实数压到 (0, 1) 之间，读作“越大越接近 1”。</p>
  </header>

  <div class="fwd-readout" id="readout" data-shown="false">
    <div class="nt-label">最终输出</div>
    <div class="nt-equation">ŷ = 0.520</div>
  </div>

  <div class="fwd-diagram">
    <svg viewBox="0 0 1520 640" preserveAspectRatio="xMidYMid meet">

      <!-- tier labels -->
      <text class="tier-label" x="110" y="38" text-anchor="middle">输入</text>
      <text class="tier-label" x="660" y="38" text-anchor="middle">隐藏层（σ）</text>
      <text class="tier-label" x="1330" y="38" text-anchor="middle">输出层（σ）</text>

      <!-- connectors -->
      <path class="conn" data-group="1" d="M147.9,147.25 L618.1,113.05"/>
      <path class="conn" data-group="2" d="M141.3,171.6 L625.4,506.1"/>
      <path class="conn" data-group="1" d="M141.3,468.4 L625.4,133.9"/>
      <path class="conn" data-group="2" d="M147.9,492.75 L618.1,526.95"/>
      <path class="conn" data-group="3" d="M700.1,122.6 L1284.2,305.6"/>
      <path class="conn" data-group="3" d="M700.1,517.4 L1284.2,334.4"/>

      <!-- weight labels -->
      <text class="wt" data-group="1" x="453" y="100">0.60</text>
      <text class="wt" data-group="2" x="286" y="255">−0.40</text>
      <text class="wt" data-group="1" x="480" y="215">−0.30</text>
      <text class="wt" data-group="2" x="453" y="540">0.50</text>
      <text class="wt" data-group="3" x="1021" y="205">0.70</text>
      <text class="wt" data-group="3" x="1021" y="435">−0.90</text>

      <!-- nodes -->
      <circle class="nt-node" cx="110" cy="150" r="38"/>
      <text class="node-id" x="110" y="144">x₁</text>
      <text class="node-sub" x="110" y="172">0.50</text>

      <circle class="nt-node" cx="110" cy="490" r="38"/>
      <text class="node-id" x="110" y="484">x₂</text>
      <text class="node-sub" x="110" y="512">0.80</text>

      <circle class="nt-node" cx="660" cy="110" r="42"/>
      <text class="node-id" x="660" y="110">h₁</text>

      <circle class="nt-node" cx="660" cy="530" r="42"/>
      <text class="node-id" x="660" y="530">h₂</text>

      <circle class="nt-node" cx="1330" cy="320" r="48"/>
      <text class="node-id" x="1330" y="320">ŷ</text>

      <!-- equation panels -->
      <g class="panel" id="panel-1">
        <rect class="panel-mark" x="782" y="94" width="10" height="10"/>
        <text class="nt-equation" x="800" y="30">
          <tspan x="800" dy="0">z₁ = 0.60×0.50 + (−0.30)×0.80 + 0.10</tspan>
          <tspan x="800" dy="28">　 = 0.30 − 0.24 + 0.10 = 0.16</tspan>
        </text>
        <text class="nt-equation final" x="800" y="102">a₁ = σ(0.16) = 0.540</text>
      </g>

      <g class="panel" id="panel-2">
        <rect class="panel-mark" x="782" y="604" width="10" height="10"/>
        <text class="nt-equation" x="800" y="540">
          <tspan x="800" dy="0">z₂ = (−0.40)×0.50 + 0.50×0.80 + (−0.20)</tspan>
          <tspan x="800" dy="28">　 = −0.20 + 0.40 − 0.20 = 0.00</tspan>
        </text>
        <text class="nt-equation final" x="800" y="612">a₂ = σ(0.00) = 0.500</text>
      </g>

      <g class="panel" id="panel-3">
        <rect class="panel-mark" x="1132" y="464" width="10" height="10"/>
        <text class="nt-equation" x="1150" y="410">
          <tspan x="1150" dy="0">z₃ = 0.70×0.540 + (−0.90)×0.500 + 0.15</tspan>
          <tspan x="1150" dy="28">　 = 0.378 − 0.450 + 0.15 = 0.078</tspan>
        </text>
        <text class="nt-equation final" x="1150" y="472">ŷ = σ(0.078) = 0.520</text>
      </g>

    </svg>
  </div>

  <div class="nt-label fwd-hint" id="hint">步骤 1 / 4 · 方向键切换</div>

</div>
<script src="assets/base.js"></script>
<script>
  Deck.init({ index: 8, total: 44 });

  const hint = document.getElementById("hint");
  const readout = document.getElementById("readout");
  const conns = [...document.querySelectorAll(".conn")];
  const weights = [...document.querySelectorAll(".wt")];

  const panel1 = document.getElementById("panel-1");
  const panel2 = document.getElementById("panel-2");
  const panel3 = document.getElementById("panel-3");

  function applyStep(step, max) {
    hint.textContent = "步骤 " + (step + 1) + " / " + (max + 1) + " · 方向键切换";
    readout.dataset.shown = step >= 3 ? "true" : "false";
    const setState = (el) => {
      const g = Number(el.dataset.group);
      el.classList.remove("is-active", "is-done");
      if (g === step) el.classList.add("is-active");
      else if (g < step) el.classList.add("is-done");
    };
    conns.forEach(setState);
    weights.forEach(setState);
    panel1.classList.toggle("is-shown", step >= 1);
    panel2.classList.toggle("is-shown", step >= 2);
    panel3.classList.toggle("is-shown", step >= 3);
  }

  Deck.onStep(applyStep, 3);
</script>
</body>
</html>
