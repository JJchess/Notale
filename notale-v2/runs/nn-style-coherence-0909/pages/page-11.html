<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{ background:var(--bg); overflow:hidden; }

  .head{ position:absolute; left:64px; top:44px; right:64px; }
  .kicker{ margin-bottom:14px; }
  .title{ max-width:1180px; }

  .sub{ position:absolute; left:64px; top:150px; right:64px; }

  .board{ position:absolute; left:64px; top:206px; right:64px; bottom:196px; }

  .foot{ position:absolute; left:64px; right:64px; bottom:44px; display:grid; grid-template-columns: 1.35fr 1fr; gap:56px; align-items:end; }
  .foot-note{ }
  .foot-tally{ text-align:right; }
  .tally-row{ display:flex; justify-content:flex-end; gap:28px; align-items:baseline; margin-top:6px; }
  .tally-num{ font-family:var(--font-mono); font-weight:750; font-size:30px; color:var(--accent); font-variant-numeric:tabular-nums; }
  .tally-label{ color:var(--muted); font-size:var(--fs-label); }

  svg{ width:100%; height:100%; display:block; overflow:visible; }

  .delta-tag{ fill:var(--accent-ink); font-family:var(--font-mono); font-size:15px; font-weight:750; text-anchor:middle; dominant-baseline:middle; }
  .delta-ring{ fill:var(--accent); stroke:var(--accent); }
  .delta-ring[data-pending="true"]{ fill:var(--paper); stroke:var(--line-strong); }
  .delta-ring[data-pending="true"] + .delta-tag{ fill:var(--muted); }

  .grad-box{ fill:var(--paper); stroke:var(--line-strong); stroke-width:var(--diagram-line-width); vector-effect:non-scaling-stroke; }
  .grad-box[data-hot="true"]{ stroke:var(--accent); }
  .grad-formula{ font-family:var(--font-mono); font-size:14px; fill:var(--text); }
  .grad-formula[data-dim="true"]{ fill:var(--muted); }
  .grad-value{ font-family:var(--font-mono); font-size:16px; font-weight:750; fill:var(--accent); }
  .grad-value[data-dim="true"]{ fill:var(--muted); font-weight:500; }

  .col-label{ font-family:var(--font-sans); font-size:var(--fs-label); font-weight:650; fill:var(--muted); text-anchor:middle; }
  .op-label{ font-family:var(--font-mono); font-size:14px; fill:var(--muted); text-anchor:middle; }
  .op-label[data-hot="true"]{ fill:var(--accent); font-weight:700; }

  .layer-caption{ font-family:var(--font-sans); font-size:14px; fill:var(--muted); text-anchor:middle; }

  .stamp{ font-family:var(--font-mono); font-size:14px; fill:var(--accent-ink); font-weight:700; text-anchor:middle; }
  .stamp-box{ fill:var(--accent); }
</style>
</head>
<body data-page="NN" data-total="44">
<div id="stage">

  <header class="head">
    <div class="nt-kicker">MLP 与训练原理 · 反向传播</div>
    <h1 class="nt-title title">反向传播复用中间结果，一次算出全部梯度</h1>
  </header>

  <p class="sub nt-lead">上一步链式法则算的是一条路径。真正的反向传播只从输出往回算三个 δ，每个 δ 被存下来，反复用在它连到的每一条权重上——不必为九个参数各自重新展开一条链。</p>

  <div class="board">
    <svg id="graph" viewBox="0 0 1472 498" preserveAspectRatio="xMidYMid meet">
      <!-- filled by script -->
    </svg>
  </div>

  <footer class="foot">
    <p class="foot-note nt-note">δ 是"责任信号"：δ_out 说输出的误差有多大、往哪个方向推；δ_h1、δ_h2 说这份误差落在两个隐藏单元头上各占多少。算出一个 δ，就能把它乘到这个节点连出去的每一条权重和偏置上——<strong style="color:var(--text)">这九个数是梯度 ∂L/∂w，是"往哪改、改多少"的信号，不是更新后的新参数。</strong></p>
    <div class="foot-tally">
      <div class="tally-row"><span class="tally-num" id="tallyDelta">0</span><span class="tally-label">次 δ 计算</span></div>
      <div class="tally-row"><span class="tally-num" id="tallyGrad">0</span><span class="tally-label">个参数梯度得出</span></div>
    </div>
  </footer>

</div>
<script src="assets/base.js"></script>
<script>
(function(){
  "use strict";

  // ---- canonical numbers (must match the forward pass used on preceding pages) ----
  const x1=1.0, x2=0.5;
  const w11=0.6, w21=-0.3, b1=0.1, h1=0.6341355910108007;
  const w12=0.4, w22=0.8,  b2=-0.1, h2=0.6681877721681662;
  const wout1=0.9, wout2=-0.5, bout=0.2;
  const yhat=0.607455292763738, y=1.0;

  const dOut=-0.392544707236262;      // dL/dz_out
  const dH1=-0.08196603514741091;     // dL/dz1
  const dH2=0.04351610746867697;      // dL/dz2

  const gWout1=dOut*h1, gWout2=dOut*h2, gBout=dOut*1;
  const gW11=dH1*x1, gW21=dH1*x2, gB1=dH1*1;
  const gW12=dH2*x1, gW22=dH2*x2, gB2=dH2*1;

  const fmt = v => (v>=0?"+":"") + v.toFixed(3);

  const svg = document.getElementById("graph");
  const NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, text){
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text!=null) n.textContent = text;
    return n;
  }

  // ---- layout ----
  // columns: inputs(x120) -> hidden(x560) -> output(x900) -> grad boxes(x1080..1472)
  const X_IN=120, X_H=560, X_OUT=900;
  const Y_H1=150, Y_H2=348, Y_OUT=249, Y_X1=120, Y_X2=378;

  const nodes = [
    {id:"x1", x:X_IN, y:Y_X1, label:"x₁", state:"stable"},
    {id:"x2", x:X_IN, y:Y_X2, label:"x₂", state:"stable"},
    {id:"h1", x:X_H, y:Y_H1, label:"h₁"},
    {id:"h2", x:X_H, y:Y_H2, label:"h₂"},
    {id:"out", x:X_OUT, y:Y_OUT, label:"ŷ"}
  ];

  // forward edges (thin stable lines, always visible as context)
  const fwdEdges = [
    ["x1","h1"], ["x2","h1"], ["x1","h2"], ["x2","h2"],
    ["h1","out"], ["h2","out"]
  ];

  const layer = document.createElementNS(NS,"g"); svg.appendChild(layer);
  const gFwd = el("g",{id:"fwd"}); layer.appendChild(gFwd);
  const gGrad = el("g",{id:"grad"}); layer.appendChild(gGrad);
  const gDelta = el("g",{id:"delta"}); layer.appendChild(gDelta);
  const gNode = el("g",{id:"nodes"}); layer.appendChild(gNode);
  const gCap = el("g",{id:"cap"}); layer.appendChild(gCap);
  const gStamp = el("g",{id:"stamp"}); layer.appendChild(gStamp);

  function nodeById(id){ return nodes.find(n=>n.id===id); }

  function drawForward(){
    fwdEdges.forEach(([a,b])=>{
      const A=nodeById(a), B=nodeById(b);
      gFwd.appendChild(el("path",{class:"nt-diagram-line", d:`M${A.x+26},${A.y} L${B.x-26},${B.y}`}));
    });
  }

  function drawNodes(){
    nodes.forEach(n=>{
      gNode.appendChild(el("circle",{class:"nt-node", cx:n.x, cy:n.y, r:26, "data-state": n.state||""}));
      gNode.appendChild(el("text",{class:"nt-node-label", x:n.x, y:n.y+1}, n.label));
    });
    gCap.appendChild(el("text",{class:"layer-caption", x:X_IN, y:60}, "输入"));
    gCap.appendChild(el("text",{class:"layer-caption", x:X_H, y:60}, "隐藏层"));
    gCap.appendChild(el("text",{class:"layer-caption", x:X_OUT, y:60}, "输出"));
    gCap.appendChild(el("text",{class:"layer-caption", x:1276, y:60}, "对应梯度"));
  }

  // ---- gradient boxes (right side), grouped by which delta feeds them ----
  // three groups stacked; each row: label formula = value
  const BOX_X = 1080, BOX_W = 392, ROW_H = 40;
  function gradGroup(y0, rows, hotFlag){
    const g = el("g",{"data-hot":hotFlag?"true":"false"});
    gGrad.appendChild(g);
    const boxH = rows.length*ROW_H + 14;
    g.appendChild(el("rect",{class:"grad-box", x:BOX_X, y:y0, width:BOX_W, height:boxH, rx:0, "data-hot":hotFlag?"true":"false"}));
    rows.forEach((r,i)=>{
      const ry = y0 + 22 + i*ROW_H;
      g.appendChild(el("text",{class:"grad-formula", x:BOX_X+16, y:ry, "data-dim": hotFlag?"false":"true"}, r.formula));
      g.appendChild(el("text",{class:"grad-value", x:BOX_X+BOX_W-16, y:ry, "text-anchor":"end", "data-dim": hotFlag?"false":"true"}, r.value));
    });
    return {g, box:{x:BOX_X,y:y0,w:BOX_W,h:boxH}};
  }

  const groupOut = gradGroup(96, [
    {formula:"∂L/∂w_out1 = δ_out · h₁", value: fmt(gWout1)},
    {formula:"∂L/∂w_out2 = δ_out · h₂", value: fmt(gWout2)},
    {formula:"∂L/∂b_out = δ_out · 1",   value: fmt(gBout)}
  ], false);

  const groupH1 = gradGroup(226, [
    {formula:"∂L/∂w11 = δ_h1 · x₁", value: fmt(gW11)},
    {formula:"∂L/∂w21 = δ_h1 · x₂", value: fmt(gW21)},
    {formula:"∂L/∂b1 = δ_h1 · 1",   value: fmt(gB1)}
  ], false);

  const groupH2 = gradGroup(360, [
    {formula:"∂L/∂w12 = δ_h2 · x₁", value: fmt(gW12)},
    {formula:"∂L/∂w22 = δ_h2 · x₂", value: fmt(gW22)},
    {formula:"∂L/∂b2 = δ_h2 · 1",   value: fmt(gB2)}
  ], false);

  // ---- delta nodes: sit between network and grad boxes ----
  const D_X = 900+140; // 1040, between out node and grad boxes, aligned with out row
  const D_X_H = 760; // delta_h sits between hidden column and output column
  const deltas = [
    {id:"dOut", x:D_X, y:Y_OUT, label:"δ_out", value: fmt(dOut), from:"out", group: groupOut, targets:["h1","h2"]},
    {id:"dH1",  x:D_X_H, y:Y_H1-64, label:"δ_h1", value: fmt(dH1), from:"h1", group: groupH1, backTo:"dOut"},
    {id:"dH2",  x:D_X_H, y:Y_H2+64, label:"δ_h2", value: fmt(dH2), from:"h2", group: groupH2, backTo:"dOut"}
  ];

  function drawDeltaBackEdge(from, to, pending){
    const A=nodeById(from), B=deltas.find(d=>d.id===to)||{x:D_X,y:Y_OUT};
    return el("path",{class:"nt-diagram-line", "data-kind":"gradient", "data-state": pending?"":"active",
      d:`M${B.x-16},${B.y} L${A.x+30},${A.y}`});
  }

  // ---- reuse fan-out lines: from a delta circle to the top of its grad box rows ----
  function fanLines(delta){
    const g = el("g");
    const rowYs = [delta.group.box.y+22, delta.group.box.y+22+ROW_H, delta.group.box.y+22+2*ROW_H];
    rowYs.forEach(ry=>{
      g.appendChild(el("path",{class:"nt-diagram-line", "data-kind":"gradient",
        d:`M${delta.x+18},${delta.y} C${delta.x+70},${delta.y} ${BOX_X-40},${ry} ${BOX_X-6},${ry}`}));
    });
    return g;
  }

  drawForward();
  drawNodes();

  // delta circle group, built per step
  const deltaEls = {};
  deltas.forEach(d=>{
    const grp = el("g",{id:d.id});
    gDelta.appendChild(grp);
    deltaEls[d.id]=grp;
  });

  function renderDelta(d, active){
    const grp = deltaEls[d.id];
    grp.innerHTML="";
    const src = nodeById(d.from);
    if (d.id==="dOut"){
      grp.appendChild(el("path",{class:"nt-diagram-line", "data-kind":"gradient", "data-state": active?"active":"",
        d:`M${src.x+26},${src.y} L${d.x-20},${d.y}`}));
    } else {
      const upstream = deltas[0];
      const bend = d.id==="dH1" ? -30 : 30;
      grp.appendChild(el("path",{class:"nt-diagram-line", "data-kind":"gradient", "data-state": active?"active":"",
        d:`M${upstream.x-8},${upstream.y+(bend>0?18:-18)} Q${d.x+150},${d.y+bend} ${d.x+22},${d.y}`}));
    }
    if (active){
      grp.appendChild(fanLines(d));
    }
    grp.appendChild(el("circle",{class:"delta-ring", cx:d.x, cy:d.y, r:24, "data-pending": active?"false":"true"}));
    grp.appendChild(el("text",{class:"delta-tag", x:d.x, y:d.y+1}, d.label));
    if (active){
      grp.appendChild(el("text",{class:"grad-value", x:d.x, y:d.y+40, "text-anchor":"middle"}, d.value));
    }
  }

  function setGroupHot(group, hot){
    group.g.setAttribute("data-hot", hot?"true":"false");
    const box = group.g.querySelector(".grad-box");
    box.setAttribute("data-hot", hot?"true":"false");
    group.g.querySelectorAll(".grad-formula, .grad-value").forEach(t=>t.setAttribute("data-dim", hot?"false":"true"));
  }

  function opLabel(x,y,text,hot){
    return el("text",{class:"op-label", x:x, y:y, "data-hot":hot?"true":"false"}, text);
  }

  function paint(step){
    // reset dynamic layers
    gStamp.innerHTML="";
    setGroupHot(groupOut, false);
    setGroupHot(groupH1, false);
    setGroupHot(groupH2, false);
    renderDelta(deltas[0], false);
    renderDelta(deltas[1], false);
    renderDelta(deltas[2], false);

    let dCount=0, gCount=0;

    if (step>=1){
      renderDelta(deltas[0], true);
      setGroupHot(groupOut, true);
      dCount = 1; gCount = 3;
    }
    if (step>=2){
      renderDelta(deltas[1], true);
      renderDelta(deltas[2], true);
      dCount = 3;
      // out group stays visible but no longer "hot" once we move on
      setGroupHot(groupOut, step===2?false:false);
    }
    if (step>=3){
      setGroupHot(groupH1, true);
      setGroupHot(groupH2, true);
      gCount = 9;
    }

    document.getElementById("tallyDelta").textContent = dCount;
    document.getElementById("tallyGrad").textContent = gCount;

    if (step>=3){
      const stampW=372, stampX= D_X-186, stampY=Y_H2+120;
      gStamp.appendChild(el("rect",{class:"stamp-box", x:stampX, y:stampY, width:stampW, height:34}));
      gStamp.appendChild(el("text",{class:"stamp", x:stampX+stampW/2, y:stampY+22}, "3 次 δ → 9 个梯度，无需重算"));
    }
  }

  Deck.onStep(function(step, max){ paint(step); }, 3);
})();
</script>
</body>
</html>
