<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
.kicker{position:absolute;left:80px;top:56px}
.kicker .n{font-size:var(--fs-kicker,15px)}
h1.nt-title{position:absolute;left:80px;top:88px;width:1000px;font-size:var(--fs-h1);line-height:1.18;margin:0}

.evidence{position:absolute;left:80px;top:266px;width:900px;height:460px}
.evidence svg{width:100%;height:100%;overflow:visible}

.side{position:absolute;left:1030px;top:266px;width:490px}
.side .block{margin-bottom:26px}
.side .block:last-child{margin-bottom:0}
.side .tag{display:inline-block;margin-bottom:8px}
.side p{margin:0}
.side .block[data-dim="true"]{opacity:.32}

.axis-label{fill:var(--muted);font-family:var(--font-sans)}
.line-label{font-family:var(--font-sans);font-weight:600}

.legend{position:absolute;left:80px;top:742px;width:900px;display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.legend .item{display:flex;align-items:center;gap:8px}
.legend .swatch{width:22px;height:3px;border-radius:2px}
.legend .item span{font-size:var(--fs-label);color:var(--muted)}

.step-note{position:absolute;left:80px;top:784px;width:900px;line-height:1.5}
</style>
</head>
<body data-page="15" data-total="44">
<div id="stage">

  <div class="kicker"><span class="nt-kicker n">03 · 训练原理</span></div>
  <h1 class="nt-title">压小 gap 靠两种真办法，泄漏做出的是假成绩</h1>

  <div class="evidence">
    <svg viewBox="0 0 900 460" id="chart" aria-hidden="true"></svg>
  </div>

  <div class="legend" id="legend"></div>

  <p class="nt-note step-note" id="stepNote"></p>

  <div class="side">
    <div class="block" data-step-block="1">
      <span class="nt-tag">正则化</span>
      <p class="nt-body">权重衰减、dropout 或早停给模型加约束，逼它不去记住训练集里的噪声。同一份数据，验证损失的峰值下降，gap 变窄。</p>
    </div>
    <div class="block" data-step-block="2">
      <span class="nt-tag">更多有效数据</span>
      <p class="nt-body">样本量增加后，训练集里的噪声更难被模型当成规律记住。模型不变、约束不变，gap 也会变窄——这是另一条独立起作用的路径。</p>
    </div>
    <div class="block" data-step-block="3">
      <span class="nt-tag">数据泄漏</span>
      <p class="nt-body">验证样本的信息提前混进了训练过程（预处理用了全量统计、重复样本跨越了切分、特征里藏着标签本身的痕迹）。验证损失因此看起来一路走低，可这个成绩在新数据上兑现不了。</p>
    </div>
  </div>

</div>
<script src="assets/base.js"></script>
<script>
(function(){
  const svg = document.getElementById("chart");
  const NS = "http://www.w3.org/2000/svg";
  const stepNote = document.getElementById("stepNote");
  const legendEl = document.getElementById("legend");

  // 逻辑坐标：0..900 x, 0..560 y (0 顶部)
  const padL = 56, padB = 56, padT = 20, padR = 20;
  const plotW = 900 - padL - padR, plotH = 460 - padT - padB;
  const EPOCHS = 24; // x 轴：训练轮次
  const xAt = i => padL + (i/(EPOCHS-1)) * plotW;
  const yAt = v => padT + (1 - v) * plotH; // v: 0(损失低,好) .. 1(损失高,差)

  function el(tag, attrs){
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  function pathFrom(values){
    return values.map((v,i)=> (i===0?"M":"L") + xAt(i).toFixed(1) + "," + yAt(v).toFixed(1)).join(" ");
  }

  // ---- 数据：教学简化曲线，非真实训练结果 ----
  function trainCurve(n, floor, decay){
    const out=[];
    for (let i=0;i<n;i++){
      const t=i/(n-1);
      out.push(floor + (0.92-floor)*Math.exp(-decay*t*8));
    }
    return out;
  }
  // 基线：训练持续下降，验证过了中段开始回升（过拟合）
  const train = trainCurve(EPOCHS, 0.06, 1.0);
  const valBaseline = (()=>{
    const out=[];
    for (let i=0;i<EPOCHS;i++){
      const t=i/(EPOCHS-1);
      const descend = 0.90*Math.exp(-1.05*t*6);
      const rise = Math.max(0, t-0.4) * 0.62;
      out.push(0.05 + descend + rise);
    }
    return out;
  })();
  // 正则化：验证曲线降到较低点后保持平稳，不回升
  const valRegularized = (()=>{
    const out=[];
    for (let i=0;i<EPOCHS;i++){
      const t=i/(EPOCHS-1);
      const descend = 0.86*Math.exp(-1.05*t*6);
      const settle = 0.14*(1-Math.exp(-3*t));
      out.push(0.045 + Math.max(descend, settle));
    }
    return out;
  })();
  // 更多数据：验证曲线更贴近训练曲线，峰值更低
  const valMoreData = (()=>{
    const out=[];
    for (let i=0;i<EPOCHS;i++){
      const t=i/(EPOCHS-1);
      const descend = 0.80*Math.exp(-1.15*t*6);
      out.push(0.05 + descend + 0.03*(1-Math.exp(-4*t)));
    }
    return out;
  })();
  // 数据泄漏：验证损失异常低、几乎贴地，与训练一起下降甚至更低
  const valLeak = (()=>{
    const out=[];
    for (let i=0;i<EPOCHS;i++){
      const t=i/(EPOCHS-1);
      out.push(0.05 + 0.05*Math.exp(-1.6*t*8));
    }
    return out;
  })();
  const REAL_TEST_LEAK = 0.62; // 数据泄漏模型在真实新数据上的实际损失（教学假设值）

  function norm(arr){
    // 归一到 0..1 供 yAt 使用；参照本页曲线自身的量级范围
    const max = 0.95;
    return arr.map(v=>Deck.clamp(v/max, 0, 1));
  }

  const colorStable = Deck.token("--stable");
  const colorAccent = Deck.token("--accent");
  const colorLine   = Deck.token("--line");

  // ---- 静态框架：坐标轴、网格、训练线（每步都在）----
  function buildFrame(){
    svg.innerHTML = "";
    const grid = el("g", {});
    // y 网格（损失刻度）
    [0,0.25,0.5,0.75,1].forEach(v=>{
      const y = yAt(v);
      grid.appendChild(el("line", {x1:padL, x2:900-padR, y1:y.toFixed(1), y2:y.toFixed(1), class:"nt-grid-line"}));
    });
    svg.appendChild(grid);

    // 轴线
    svg.appendChild(el("line", {x1:padL, x2:padL, y1:padT, y2:460-padB, stroke:colorLine, "stroke-width":1}));
    svg.appendChild(el("line", {x1:padL, x2:900-padR, y1:460-padB, y2:460-padB, stroke:colorLine, "stroke-width":1}));

    const yLab = el("text", {x:padL-12, y:yAt(0)+4, "text-anchor":"end", class:"axis-label", "font-size":13});
    yLab.textContent = "损失低";
    svg.appendChild(yLab);
    const yLab2 = el("text", {x:padL-12, y:yAt(1)+4, "text-anchor":"end", class:"axis-label", "font-size":13});
    yLab2.textContent = "损失高";
    svg.appendChild(yLab2);

    const xLab = el("text", {x:padL, y:460-padB+34, "text-anchor":"start", class:"axis-label", "font-size":13});
    xLab.textContent = "训练轮次 →";
    svg.appendChild(xLab);

    // 训练损失（共享，所有对照都用同一条）
    const trainPath = el("path", {d: pathFrom(norm(train)), class:"nt-data-line", stroke:colorStable, "stroke-width":2.5, fill:"none"});
    svg.appendChild(trainPath);
    svg.appendChild(el("circle", {cx:xAt(EPOCHS-1), cy:yAt(norm(train)[EPOCHS-1]), r:4, fill:colorStable}));

    return {grid};
  }

  function drawVal(values, color, dashed, id){
    const path = el("path", {d: pathFrom(norm(values)), stroke:color, "stroke-width":2.5, fill:"none", id:id});
    if (dashed) path.setAttribute("stroke-dasharray", "6 5");
    svg.appendChild(path);
    const ny = norm(values)[EPOCHS-1];
    svg.appendChild(el("circle", {cx:xAt(EPOCHS-1), cy:yAt(ny), r:4, fill:color}));
  }

  function markGap(values, atIndex, color){
    const i = atIndex;
    const y1 = yAt(norm(train)[i]);
    const y2 = yAt(norm(values)[i]);
    const x = xAt(i);
    svg.appendChild(el("line", {x1:x, x2:x, y1, y2, stroke:color, "stroke-width":1.5, "stroke-dasharray":"3 3", opacity:0.7}));
  }

  function markLeakTruth(){
    // 在最后一轮标出真实测试损失，戳破验证曲线的假象
    const x = xAt(EPOCHS-1);
    const yLeak = yAt(norm(valLeak)[EPOCHS-1]);
    const yTrue = yAt(Deck.clamp(REAL_TEST_LEAK/0.95,0,1));
    svg.appendChild(el("line", {x1:x, x2:x, y1:yLeak, y2:yTrue, stroke:colorAccent, "stroke-width":1.5, "stroke-dasharray":"3 3"}));
    svg.appendChild(el("circle", {cx:x, cy:yTrue, r:5, fill:colorAccent}));
    const lbl = el("text", {x:x-14, y:yTrue+4, "text-anchor":"end", class:"line-label", "font-size":13, fill:colorAccent});
    lbl.textContent = "真实测试损失（部署后）";
    svg.appendChild(lbl);
  }

  const STEP_LEGEND = [
    [ {c:colorStable,t:"训练损失"}, {c:colorAccent,t:"验证损失（基线，过拟合）"} ],
    [ {c:colorStable,t:"训练损失"}, {c:colorAccent,t:"验证（基线）"}, {c:"#5f8f66",t:"验证（加正则化）"} ],
    [ {c:colorStable,t:"训练损失"}, {c:colorAccent,t:"验证（基线）"}, {c:"#5f8f66",t:"验证（正则化）"}, {c:"#4d7fa8",t:"验证（更多数据）"} ],
    [ {c:colorStable,t:"训练损失"}, {c:"#5f8f66",t:"验证（正则化）"}, {c:"#4d7fa8",t:"验证（更多数据）"}, {c:colorAccent,t:"验证（数据泄漏，虚假）"} ]
  ];
  const STEP_NOTES = [
    "基线：验证损失先降后升，训练损失持续下降——上一页判定的过拟合。gap 在中段之后越拉越大。",
    "加正则化后，同一批数据、同一个模型容量，验证损失不再回升，稳定在更低的位置。gap 被压窄了。",
    "换成更多有效数据，模型和约束都不变，验证损失同样贴近训练损失。两条路径分别起作用，可以同时用。",
    "验证损失几乎跟训练损失一起趴到底，看起来是全场最好的模型——但它在真实新数据上的损失远高于图上显示的数值，因为验证集的信息早就漏进了训练过程。"
  ];

  Deck.onStep(function(step, max){
    buildFrame();
    drawVal(valBaseline, colorAccent, false, "val-baseline");
    markGap(valBaseline, EPOCHS-1, colorAccent);

    if (step >= 1){
      drawVal(valRegularized, "#5f8f66", false, "val-reg");
    }
    if (step >= 2){
      drawVal(valMoreData, "#4d7fa8", false, "val-data");
    }
    if (step >= 3){
      drawVal(valLeak, colorAccent, true, "val-leak");
      markLeakTruth();
    }

    const cfg = STEP_LEGEND[step];
    legendEl.innerHTML = cfg.map(function(it){
      return '<div class="item"><span class="swatch" style="background:'+it.c+'"></span><span>'+it.t+'</span></div>';
    }).join("");
    stepNote.textContent = STEP_NOTES[step];

    document.querySelectorAll(".side .block").forEach(function(b){
      const s = +b.dataset.stepBlock;
      b.dataset.dim = (s <= step) ? "false" : "true";
    });
  }, 3);

  Deck.init({ index:15, total:44 });
})();
</script>
</body>
</html>
