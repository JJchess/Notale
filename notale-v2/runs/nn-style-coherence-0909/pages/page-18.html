<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{ position:relative; overflow:hidden; }

  .kicker{ position:absolute; left:70px; top:44px; }
  h1.nt-title{ position:absolute; left:70px; top:78px; width:920px; }
  .nt-lead{ position:absolute; left:70px; top:186px; width:1000px; }

  /* 主证据区：输入网格 + 卷积核窗口 */
  .evidence{ position:absolute; left:70px; top:250px; width:700px; height:560px; }
  .grid-label{ position:absolute; left:0; top:0; }
  svg#gridSvg{ position:absolute; left:0; top:36px; width:590px; height:590px; }

  /* 右侧：算式展开 */
  .formula-panel{ position:absolute; left:850px; top:250px; width:680px; height:560px; }
  .formula-title{ position:absolute; left:0; top:0; }
  .terms{ position:absolute; left:0; top:56px; width:680px; }
  .term-row{ display:flex; align-items:baseline; gap:10px; font-family:var(--font-sans); font-size:var(--fs-body); line-height:1.5; color:var(--muted); padding:5px 0; opacity:.32; transition:opacity .25s; }
  .term-row.on{ opacity:1; color:var(--text); }
  .term-row .idx{ width:34px; color:var(--muted); font-family:"Times New Roman",serif; font-style:italic; }
  .term-row .nums{ font-family:"Times New Roman",serif; font-style:italic; }
  .term-row .prod{ margin-left:auto; font-family:"Times New Roman",serif; }

  .sum-line{ position:absolute; left:0; top:432px; width:680px; border-top:1px solid var(--line); padding-top:16px; }
  .sum-eq{ font-family:"Times New Roman",serif; font-size:30px; color:var(--text); }
  .sum-eq .accent{ color:var(--accent); font-weight:700; }
  .sum-note{ margin-top:10px; font-family:var(--font-sans); font-size:var(--fs-label); color:var(--muted); }

  .out-cell-note{ position:absolute; left:0; top:520px; width:680px; font-family:var(--font-sans); font-size:var(--fs-label); color:var(--muted); }

  .legend{ position:absolute; left:70px; top:850px; display:flex; gap:34px; font-family:var(--font-sans); font-size:var(--fs-label); color:var(--muted); }
  .legend span{ display:inline-flex; align-items:center; gap:8px; }
  .swatch{ width:14px; height:14px; display:inline-block; }
</style>
</head>
<body data-page="NN" data-total="44">
<div id="stage">

  <p class="nt-kicker kicker">CNN · 卷积操作</p>
  <h1 class="nt-title">卷积核覆盖一个窗口，乘加得到一个数</h1>
  <p class="nt-lead nt-body">3×3 卷积核对齐输入的一个 3×3 局部窗口，九对数值逐一相乘后求和，结果就是特征图里对应位置的这一个数——卷积在每个位置重复同一次运算。</p>

  <div class="evidence">
    <p class="nt-label grid-label">输入（5×5）与核覆盖的窗口</p>
    <svg id="gridSvg" viewBox="0 0 620 620"></svg>
  </div>

  <div class="formula-panel">
    <p class="nt-label formula-title">窗口取值 × 核权重，逐项展开</p>
    <div class="terms" id="terms"></div>
    <div class="sum-line">
      <div class="sum-eq" id="sumEq"></div>
      <p class="sum-note">这个和就是输出特征图中，与该窗口对应位置上的唯一数值。</p>
    </div>
  </div>

  <div class="legend">
    <span><i class="swatch" style="background:var(--accent)"></i>核当前覆盖的窗口</span>
    <span><i class="swatch" style="background:var(--stable);opacity:.5"></i>窗口外的输入像素</span>
  </div>

</div>
<script src="assets/base.js"></script>
<script>
Deck.init({ index:18, total:44 });

// ---- 教学数据：5x5 输入，3x3 核，固定窗口在 (row=1, col=1) ----
const INPUT = [
  [1,0,2,1,0],
  [0,3,1,2,1],
  [2,1,0,1,2],
  [1,2,1,0,1],
  [0,1,2,1,0]
];
const KERNEL = [
  [ 1, 0,-1],
  [ 1, 0,-1],
  [ 1, 0,-1]
];
const WIN_R = 1, WIN_C = 1; // 窗口左上角在输入坐标

const pairs = [];
for(let r=0;r<3;r++){
  for(let c=0;c<3;c++){
    const x = INPUT[WIN_R+r][WIN_C+c];
    const w = KERNEL[r][c];
    pairs.push({r,c,x,w,p:x*w});
  }
}
const total = pairs.reduce((s,t)=>s+t.p,0);

// ---- SVG: 5x5 grid with 3x3 window highlighted, kernel weights overlaid ----
const svg = document.getElementById('gridSvg');
const CELL = 108, PAD = 8, GRID_W = 5*CELL, ORIGIN = 20;
const accent = Deck.token('--accent');
const stable = Deck.token('--stable');
const text = Deck.token('--text');
const line = Deck.token('--line');
const muted = Deck.token('--muted');

let svgMarkup = '';
// background cells
for(let r=0;r<5;r++){
  for(let c=0;c<5;c++){
    const x = ORIGIN + c*CELL, y = ORIGIN + r*CELL;
    const inWin = r>=WIN_R && r<WIN_R+3 && c>=WIN_C && c<WIN_C+3;
    svgMarkup += `<rect x="${x+PAD/2}" y="${y+PAD/2}" width="${CELL-PAD}" height="${CELL-PAD}"
      fill="${inWin? 'none' : stable}" fill-opacity="${inWin? 0 : 0.14}"
      stroke="${line}" stroke-width="1.5"/>`;
    svgMarkup += `<text x="${x+CELL/2}" y="${y+CELL/2+9}" text-anchor="middle"
      font-family="'Times New Roman',serif" font-size="30" fill="${inWin? text : muted}"
      fill-opacity="${inWin? 1 : 0.55}">${INPUT[r][c]}</text>`;
  }
}
// window highlight border
const wx = ORIGIN + WIN_C*CELL, wy = ORIGIN + WIN_R*CELL;
svgMarkup += `<rect x="${wx+3}" y="${wy+3}" width="${3*CELL-6}" height="${3*CELL-6}"
  fill="none" stroke="${accent}" stroke-width="4"/>`;
// kernel weight labels, small, top-left corner of each window cell
for(let r=0;r<3;r++){
  for(let c=0;c<3;c++){
    const x = wx + c*CELL, y = wy + r*CELL;
    const w = KERNEL[r][c];
    svgMarkup += `<rect x="${x+8}" y="${y+8}" width="34" height="26" fill="${accent}"/>`;
    svgMarkup += `<text x="${x+25}" y="${y+27}" text-anchor="middle"
      font-family="'Times New Roman',serif" font-style="italic" font-size="17" fill="#fff">${w>0? '+'+w : w}</text>`;
  }
}
// caption row for kernel legend
svg.innerHTML = svgMarkup;

// ---- terms list ----
const termsEl = document.getElementById('terms');
termsEl.innerHTML = pairs.map((t,i)=>{
  const sign = t.w>0 ? '+'+t.w : String(t.w);
  return `<div class="term-row" data-i="${i}">
    <span class="idx">${i+1}</span>
    <span class="nums">x=${t.x}&nbsp;&nbsp;w=${sign}</span>
    <span class="prod">${t.x}&nbsp;×&nbsp;(${sign})&nbsp;=&nbsp;${t.p>=0? '+'+t.p : t.p}</span>
  </div>`;
}).join('');

const sumParts = pairs.map(t => (t.p>=0?'+':'') + t.p).join(' ').replace(/^\+/, '');
document.getElementById('sumEq').innerHTML =
  `Σ = ${sumParts.trim()} = <span class="accent">${total}</span>`;

// ---- step reveal driven by Deck.onStep ----
Deck.onStep(function(step, max){
  const rows = termsEl.querySelectorAll('.term-row');
  rows.forEach((row, i) => row.classList.toggle('on', i < step));
  document.getElementById('sumEq').style.opacity = step >= 9 ? 1 : 0.15;
}, 10);
</script>
</body>
</html>
