<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{
  padding:56px 72px 44px;
  display:grid;
  grid-template-rows:auto 1fr;
  gap:18px;
}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:40px}
.head h1{margin:0;font-size:var(--fs-h2);font-weight:800;color:var(--text)}
.head .nt-label{color:var(--muted)}

main{
  display:grid;
  grid-template-columns:auto auto 1fr;
  align-items:start;
  gap:56px;
}

.board-block{display:flex;flex-direction:column;gap:10px}
.board-title{font-size:var(--fs-label);color:var(--muted);letter-spacing:.02em}

/* input grid */
#inputGrid{
  position:relative;
  width:432px;height:432px;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(6,1fr);
  border:2px solid var(--text);
  background:var(--bg);
}
.px{
  position:relative;
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-sans);
  font-size:15px;
  color:var(--text);
  user-select:none;
}
#kernelBox{
  position:absolute;
  width:216px;height:216px;
  border:3px solid var(--accent);
  box-shadow:0 0 0 9999px rgba(20,18,17,0.42);
  pointer-events:none;
  transition:left .16s ease, top .16s ease;
  z-index:5;
}
@media (prefers-reduced-motion:reduce){#kernelBox{transition:none}}
.px .w{
  position:absolute;
  top:2px;right:3px;
  font-size:11px;
  color:var(--accent);
  font-family:var(--font-sans);
  opacity:0;
  font-weight:700;
}
.px.active .w{opacity:1}

/* kernel readout */
.kernel-block{display:flex;flex-direction:column;gap:10px}
#kernelMini{
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  width:132px;height:132px;border:2px solid var(--accent);
}
#kernelMini div{
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-sans);font-size:16px;font-weight:700;color:var(--accent);
}

.equation-wrap{margin-top:6px;min-height:118px}
.nt-equation{
  font-family:var(--font-sans);
  font-size:15px;
  line-height:1.7;
  color:var(--text);
  white-space:pre-wrap;
}
.nt-equation b{color:var(--accent);font-weight:700}
.result-line{
  margin-top:10px;
  font-size:22px;
  font-family:var(--font-sans);
  font-weight:800;
  color:var(--accent);
}

/* right column: feature map + controls */
.right-col{display:flex;flex-direction:column;gap:22px}
.fmap-block{display:flex;flex-direction:column;gap:10px}
#featGrid{
  display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);
  width:288px;height:288px;
  border:2px solid var(--text);
}
.fx{
  position:relative;
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-sans);
  font-size:18px;font-weight:700;
  color:var(--muted);
  background:var(--bg);
}
.fx.filled{color:var(--text)}
.fx.current{outline:3px solid var(--accent);outline-offset:-3px;background:color-mix(in srgb, var(--accent) 14%, var(--bg))}
.fx.flash{animation:flashcell .5s ease}
@keyframes flashcell{0%{background:var(--accent);color:var(--bg)}100%{background:var(--bg)}}
@media (prefers-reduced-motion:reduce){.fx.flash{animation:none}}

.controls-block{display:flex;flex-direction:column;gap:12px}
.nt-controls{display:flex;flex-direction:column;gap:10px;padding:0}
.nt-control-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nt-button{
  font-family:var(--font-sans);
  font-size:14px;
  padding:8px 16px;
  border:1.5px solid var(--text);
  background:none;
  color:var(--text);
  cursor:pointer;
}
.nt-button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.nt-button:disabled{opacity:.35;cursor:default}
.nt-button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.nt-readout{font-family:var(--font-sans);font-size:15px;color:var(--muted)}
.nt-readout b{color:var(--text);font-weight:700}

.progress-line{font-size:15px;color:var(--muted);font-family:var(--font-sans)}
.progress-line b{color:var(--text)}
.done-note{
  margin-top:4px;font-size:15px;line-height:1.5;color:var(--text);
  border-left:3px solid var(--accent);padding-left:12px;
  max-width:300px;
}
.hidden{display:none}
</style>
</head>
<body data-page="NN" data-total="44">
<div id="stage">
  <div class="head">
    <h1>卷积核在小图像上的逐格滑动</h1>
    <span class="nt-label">6×6 输入 · 3×3 卷积核 · stride 1 · 无填充 → 4×4 特征图</span>
  </div>

  <main>
    <div class="board-block">
      <span class="board-title">输入（方向键或点击移动窗口）</span>
      <div id="inputGrid" tabindex="0" aria-label="6×6 输入像素网格，方向键移动卷积窗口"></div>
    </div>

    <div class="kernel-block">
      <span class="board-title">卷积核权重</span>
      <div id="kernelMini"></div>
      <div class="equation-wrap">
        <div class="nt-equation" id="equation"></div>
        <div class="result-line" id="resultLine"></div>
      </div>
    </div>

    <div class="right-col">
      <div class="fmap-block">
        <span class="board-title">特征图（逐格填入）</span>
        <div id="featGrid"></div>
      </div>
      <div class="controls-block">
        <div class="nt-controls">
          <div class="nt-control-row">
            <button class="nt-button" id="fillBtn">乘加填入当前格</button>
            <button class="nt-button" id="resetBtn">重置</button>
          </div>
          <div class="progress-line" id="progress"></div>
        </div>
        <div class="done-note hidden" id="doneNote">
          16 个窗口位置都算完了，特征图里的每个数都来自同一组 9 个核权重，只是覆盖的输入窗口不同——参数没变，位置变了。
        </div>
      </div>
    </div>
  </main>
</div>
<script src="assets/base.js"></script>
<script>
(() => {
  "use strict";
  const IN_SIZE = 6, K = 3, OUT = IN_SIZE - K + 1; // 4
  const CELL = 432 / IN_SIZE; // 72
  const FCELL = 288 / OUT; // 72

  // 教学简化数值：固定输入与卷积核（非真实图像/训练权重）
  const INPUT = [
    [1,2,0,1,3,0],
    [0,1,2,1,0,2],
    [2,0,1,3,1,0],
    [1,3,0,2,2,1],
    [0,1,1,0,3,2],
    [2,0,2,1,0,1]
  ];
  const KERNEL = [
    [1,0,-1],
    [1,0,-1],
    [1,0,-1]
  ];

  function computeAt(row, col) {
    let sum = 0;
    const terms = [];
    for (let i = 0; i < K; i++) {
      for (let j = 0; j < K; j++) {
        const v = INPUT[row + i][col + j];
        const w = KERNEL[i][j];
        const p = v * w;
        sum += p;
        terms.push({ v, w, p });
      }
    }
    return { sum, terms };
  }

  function createInitialState() {
    return {
      pos: { row: 0, col: 0 },
      results: Array.from({ length: OUT }, () => Array(OUT).fill(null)),
      flashRC: null
    };
  }
  let state = createInitialState();

  // build input grid DOM
  const inputGrid = document.getElementById("inputGrid");
  const pxCells = [];
  for (let r = 0; r < IN_SIZE; r++) {
    const rowArr = [];
    for (let c = 0; c < IN_SIZE; c++) {
      const d = document.createElement("div");
      d.className = "px";
      d.textContent = INPUT[r][c];
      const w = document.createElement("span");
      w.className = "w";
      d.appendChild(w);
      inputGrid.appendChild(d);
      rowArr.push(d);
    }
    pxCells.push(rowArr);
  }
  const kernelBox = document.createElement("div");
  kernelBox.id = "kernelBox";
  inputGrid.appendChild(kernelBox);

  // kernel mini
  const kernelMini = document.getElementById("kernelMini");
  for (let i = 0; i < K; i++) {
    for (let j = 0; j < K; j++) {
      const d = document.createElement("div");
      d.textContent = KERNEL[i][j];
      kernelMini.appendChild(d);
    }
  }

  // feature grid
  const featGrid = document.getElementById("featGrid");
  const fxCells = [];
  for (let r = 0; r < OUT; r++) {
    const rowArr = [];
    for (let c = 0; c < OUT; c++) {
      const d = document.createElement("div");
      d.className = "fx";
      featGrid.appendChild(d);
      rowArr.push(d);
    }
    fxCells.push(rowArr);
  }

  const equation = document.getElementById("equation");
  const resultLine = document.getElementById("resultLine");
  const progress = document.getElementById("progress");
  const fillBtn = document.getElementById("fillBtn");
  const resetBtn = document.getElementById("resetBtn");
  const doneNote = document.getElementById("doneNote");

  function filledCount() {
    let n = 0;
    state.results.forEach(row => row.forEach(v => { if (v !== null) n++; }));
    return n;
  }

  function render() {
    const { row, col } = state.pos;
    kernelBox.style.left = (col * CELL) + "px";
    kernelBox.style.top = (row * CELL) + "px";

    // highlight active window pixels + weight labels
    for (let r = 0; r < IN_SIZE; r++) {
      for (let c = 0; c < IN_SIZE; c++) {
        const inWindow = r >= row && r < row + K && c >= col && c < col + K;
        pxCells[r][c].classList.toggle("active", inWindow);
        const wEl = pxCells[r][c].querySelector(".w");
        wEl.textContent = inWindow ? KERNEL[r - row][c - col] : "";
      }
    }

    const { sum, terms } = computeAt(row, col);
    const lines = [];
    for (let i = 0; i < K; i++) {
      const rowTerms = terms.slice(i * K, i * K + K);
      lines.push(rowTerms.map(t => `${t.v}×<b>${t.w}</b>`).join(" + "));
    }
    equation.innerHTML = lines.join("\n") + "\n" + terms.map(t => t.p).join(" + ") + " =";
    resultLine.textContent = sum;

    const already = state.results[row][col];
    fillBtn.disabled = already !== null;
    fillBtn.textContent = already !== null ? `此格已填入 ${already}` : "乘加填入当前格";

    for (let r = 0; r < OUT; r++) {
      for (let c = 0; c < OUT; c++) {
        const val = state.results[r][c];
        const el = fxCells[r][c];
        el.textContent = val === null ? "" : val;
        el.classList.toggle("filled", val !== null);
        el.classList.toggle("current", r === row && c === col);
        el.classList.toggle("flash", state.flashRC && state.flashRC[0] === r && state.flashRC[1] === c);
      }
    }

    const n = filledCount();
    progress.innerHTML = `已算 <b>${n}</b> / ${OUT * OUT} 格`;
    doneNote.classList.toggle("hidden", n < OUT * OUT);
  }

  function moveTo(row, col) {
    row = Math.max(0, Math.min(OUT - 1, row));
    col = Math.max(0, Math.min(OUT - 1, col));
    state.pos = { row, col };
    state.flashRC = null;
    render();
  }

  function fillCurrent() {
    const { row, col } = state.pos;
    if (state.results[row][col] !== null) return;
    const { sum } = computeAt(row, col);
    state.results[row][col] = sum;
    state.flashRC = [row, col];
    render();
    setTimeout(() => { state.flashRC = null; render(); }, 500);
  }

  function reset() {
    state = createInitialState();
    render();
  }

  inputGrid.addEventListener("keydown", (e) => {
    const { row, col } = state.pos;
    if (e.key === "ArrowUp") { e.preventDefault(); moveTo(row - 1, col); }
    else if (e.key === "ArrowDown") { e.preventDefault(); moveTo(row + 1, col); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); moveTo(row, col - 1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); moveTo(row, col + 1); }
    else if (e.key === " " || e.key === "Enter") { e.preventDefault(); fillCurrent(); }
  });
  inputGrid.addEventListener("click", (e) => {
    const rect = inputGrid.getBoundingClientRect();
    const scale = rect.width / inputGrid.offsetWidth || 1;
    const x = (e.clientX - rect.left) / scale;
    const y = (e.clientY - rect.top) / scale;
    let col = Math.floor(x / CELL) - Math.floor((K - 1) / 2);
    let row = Math.floor(y / CELL) - Math.floor((K - 1) / 2);
    moveTo(row, col);
    inputGrid.focus();
  });
  fxCells.forEach((rowArr, r) => rowArr.forEach((el, c) => {
    el.style.cursor = "pointer";
    el.addEventListener("click", () => { moveTo(r, c); inputGrid.focus(); });
  }));

  fillBtn.addEventListener("click", fillCurrent);
  resetBtn.addEventListener("click", reset);

  Deck.init({ index: 19, total: 44 });
  render();
})();
</script>
</body>
</html>
