<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{ position:relative; overflow:hidden; }

.head{
  position:absolute; left:76px; top:52px; right:76px;
}
.head .nt-kicker{ display:block; margin-bottom:8px; }
.head h1{
  font-family:var(--font-sans);
  font-weight:700;
  font-size:32px;
  color:var(--text);
  line-height:1.16;
  letter-spacing:-.01em;
  max-width:1200px;
}
.head .nt-lead{
  margin-top:8px;
  max-width:1220px;
  color:var(--muted);
  font-size:15px;
  line-height:1.4;
}

.evidence{
  position:absolute; left:76px; right:76px; top:196px; bottom:148px;
}

svg#diagram{ width:100%; height:100%; display:block; overflow:visible; }

.chan-label{ font-family:var(--font-sans); font-size:var(--fs-label); fill:var(--muted); }
.big-num{ font-family:var(--font-sans); font-weight:600; font-size:15px; fill:var(--text); }
.cell-num{ font-family:var(--font-sans); font-size:13px; fill:var(--text); }
.kernel-num{ font-family:var(--font-sans); font-weight:600; font-size:13px; fill:var(--accent); }
.op-sign{ font-family:var(--font-sans); font-weight:600; font-size:22px; fill:var(--muted); }
.head-tag{ font-family:var(--font-sans); font-weight:600; font-size:var(--fs-label); fill:var(--text); }

.footnote{
  position:absolute; left:76px; right:76px; bottom:54px;
}
.footnote .nt-note{ max-width:1220px; }
</style>
</head>
<body data-page="20" data-total="44">
<div id="stage" data-step="2">

  <div class="head">
    <span class="nt-kicker">CNN · 多通道卷积</span>
    <h1>一个输出通道，来自对所有输入通道求和</h1>
    <p class="nt-lead">每个输入通道各配一个卷积核，三路乘加结果逐元素相加，再加一个偏置，才得到输出特征图里的一个数。一组这样的核只产出一个输出通道；要几个输出通道，就配几组核。</p>
  </div>

  <div class="evidence">
    <svg id="diagram" viewBox="0 0 1448 560" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div class="footnote">
    <p class="nt-note" id="noteText">当前：3 个输入通道 × 1 组 2×2 卷积核 → 1 个输出通道。这一组核共有 3×2×2=12 个权重，加 1 个偏置。</p>
  </div>

</div>
<script src="assets/base.js"></script>
<script>
(function(){
  const svg = document.getElementById('diagram');
  const NS = 'http://www.w3.org/2000/svg';
  const note = document.getElementById('noteText');

  function el(tag, attrs, parent){
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function text(x, y, str, cls, parent, anchor){
    const t = el('text', {x:x, y:y, class:cls, 'text-anchor':anchor||'middle'}, parent);
    t.textContent = str;
    return t;
  }

  // ---- fixed teaching data ----
  // 3 input channels, each a 3x3 grid; a 2x2 kernel per channel; valid conv -> 2x2 per-channel output
  const CH = [
    { name:'R 通道', data:[[1,0,2],[0,1,1],[2,1,0]], kernel:[[1,0],[0,-1]] },
    { name:'G 通道', data:[[0,1,1],[1,0,2],[1,2,0]], kernel:[[0,1],[1,0]] },
    { name:'B 通道', data:[[2,1,0],[0,2,1],[1,0,1]], kernel:[[-1,1],[1,0]] }
  ];
  const BIAS = 1;
  const CH2K = [ [[0,1],[1,0]], [[1,1],[0,-1]], [[1,0],[-1,1]] ];
  const BIAS2 = -1;

  function conv2x2(data, kernel){
    const out = [[0,0],[0,0]];
    for (let oy=0; oy<2; oy++){
      for (let ox=0; ox<2; ox++){
        let s = 0;
        for (let ky=0; ky<2; ky++){
          for (let kx=0; kx<2; kx++){
            s += data[oy+ky][ox+kx]*kernel[ky][kx];
          }
        }
        out[oy][ox] = s;
      }
    }
    return out;
  }

  const perChannelOut = CH.map(c => conv2x2(c.data, c.kernel));
  const summed = [[0,0],[0,0]];
  for (let y=0;y<2;y++) for (let x=0;x<2;x++){
    summed[y][x] = perChannelOut[0][y][x] + perChannelOut[1][y][x] + perChannelOut[2][y][x] + BIAS;
  }
  const perChannelOut2 = CH.map((c,i) => conv2x2(c.data, CH2K[i]));
  const summed2 = [[0,0],[0,0]];
  for (let y=0;y<2;y++) for (let x=0;x<2;x++){
    summed2[y][x] = perChannelOut2[0][y][x] + perChannelOut2[1][y][x] + perChannelOut2[2][y][x] + BIAS2;
  }

  // ---- layout constants shared by all render calls ----
  const rowY = [58, 200, 342];
  const inputX = 40, inputCell = 34;
  const kernelX = 300, kernelCell = 34;
  const midOutX = 470, midOutCell = 30;
  const sumX = 700, sumCell = 46;

  function drawGrid(parent, x, y, cell, data, cls){
    const n = data.length;
    for (let r=0;r<n;r++){
      for (let cc=0;cc<n;cc++){
        const gx = x + cc*cell, gy = y + r*cell;
        el('rect', {x:gx, y:gy, width:cell, height:cell, fill:'none', stroke:'var(--line)', 'stroke-width':1}, parent);
        text(gx+cell/2, gy+cell/2+4, data[r][cc], cls || 'cell-num', parent);
      }
    }
    return {x:x, y:y, cell:cell, n:n};
  }
  function drawKernelOverlay(parent, gridPos, kx, ky){
    const x = gridPos.x + kx*gridPos.cell, y = gridPos.y + ky*gridPos.cell;
    el('rect', {x:x, y:y, width:gridPos.cell*2, height:gridPos.cell*2, fill:'none', stroke:'var(--accent)', 'stroke-width':2}, parent);
  }
  function drawKernel(parent, x, y, cell, kernel){
    for (let r=0;r<2;r++){
      for (let c=0;c<2;c++){
        const gx = x+c*cell, gy = y+r*cell;
        el('rect', {x:gx, y:gy, width:cell, height:cell, fill:'var(--bg)', stroke:'var(--accent)', 'stroke-width':1.2}, parent);
        text(gx+cell/2, gy+cell/2+4, kernel[r][c], 'kernel-num', parent);
      }
    }
  }
  function drawOutGrid(parent, x, y, cell, data){
    for (let r=0;r<2;r++){
      for (let c=0;c<2;c++){
        const gx=x+c*cell, gy=y+r*cell;
        el('rect', {x:gx, y:gy, width:cell, height:cell, fill:'var(--bg)', stroke:'var(--text)', 'stroke-width':1.4}, parent);
        text(gx+cell/2, gy+cell/2+5, data[r][c], 'big-num', parent);
      }
    }
  }
  function drawArrow(parent, x1, y1, x2, y2, accent){
    el('path', {d:`M${x1} ${y1} L${x2} ${y2}`, stroke: accent?'var(--accent)':'var(--line)',
      'stroke-width': accent?2:1.4, fill:'none', 'marker-end': accent?'url(#arrowAccent)':'url(#arrow)'}, parent);
  }

  function renderBase(){
    const defs = el('defs', {}, svg);
    [['arrow','var(--line)'],['arrowAccent','var(--accent)']].forEach(([id,color])=>{
      const m = el('marker', {id:id, viewBox:'0 0 10 10', refX:8, refY:5, markerWidth:7, markerHeight:7, orient:'auto-start-reverse'}, defs);
      el('path', {d:'M0,0 L10,5 L0,10 Z', fill:color}, m);
    });

    CH.forEach((c, i) => {
      const y = rowY[i];
      text(inputX + 34, y - 14, c.name, 'chan-label', svg, 'start');
      const gp = drawGrid(svg, inputX, y, inputCell, c.data);
      drawKernelOverlay(svg, gp, 0, 0);

      text(kernelX - 30, y + inputCell + 5, '\u00D7', 'op-sign', svg);
      drawKernel(svg, kernelX, y, kernelCell, c.kernel);
      text(kernelX + kernelCell, y - 14, '核 ' + (i+1), 'chan-label', svg);

      drawArrow(svg, kernelX+kernelCell*2+14, y+kernelCell, midOutX-14, y+kernelCell, false);
      drawOutGrid(svg, midOutX, y + (kernelCell*2-midOutCell*2)/2, midOutCell, perChannelOut[i]);
      text(midOutX + midOutCell, y - 14, '通道 ' + (i+1) + ' 的乘加结果', 'chan-label', svg);
    });

    for (let i=0;i<2;i++){
      const y1 = rowY[i] + kernelCell, y2 = rowY[i+1] + kernelCell;
      text(midOutX + midOutCell, (y1+y2)/2 + 8, '+', 'op-sign', svg);
    }

    drawArrow(svg, midOutX+midOutCell*2+16, rowY[1]+kernelCell, sumX-16, rowY[1]+kernelCell, true);
    text(sumX+sumCell, rowY[1]-36, '逐元素相加 + 偏置 b', 'chan-label', svg);
    text(sumX+sumCell, rowY[1]-18, '= 该输出通道的特征图', 'chan-label', svg);
    drawOutGrid(svg, sumX, rowY[1]+kernelCell-sumCell, sumCell, summed);
    text(sumX+sumCell, rowY[1]+kernelCell+sumCell+24, '输出通道 1', 'head-tag', svg);
  }

  function renderSecondChannel(){
    const x2 = sumX + 220;
    text(x2, rowY[0]-60, '换一组核', 'chan-label', svg, 'start');
    text(x2, rowY[0]-42, '（仍看全部 3 个输入通道）', 'chan-label', svg, 'start');

    const tinyCell = 20;
    CH2K.forEach((k, i) => {
      const y = rowY[i] + kernelCell/2;
      drawKernel(svg, x2, y, tinyCell, k);
    });
    drawArrow(svg, x2+tinyCell*2+14, rowY[1]+kernelCell, x2+90, rowY[1]+kernelCell, true);
    drawOutGrid(svg, x2+96, rowY[1]+kernelCell-sumCell, sumCell, summed2);
    text(x2+96+sumCell, rowY[1]+kernelCell+sumCell+24, '输出通道 2', 'head-tag', svg);
  }

  function renderGeneralization(){
    const bx = sumX + 220 + 96 + sumCell*2 + 44;
    const top = rowY[0]-10, bottom = rowY[2]+kernelCell*2+10;
    el('path', {d:`M${bx} ${top} L${bx+14} ${top} L${bx+14} ${bottom} L${bx} ${bottom}`,
      stroke:'var(--muted)', 'stroke-width':1.4, fill:'none'}, svg);
    const t1 = text(bx+30, (top+bottom)/2 - 8, '再配第 3、4… 组核，', 'chan-label', svg, 'start');
    const t2 = text(bx+30, (top+bottom)/2 + 14, '就有第 3、4… 个输出通道', 'chan-label', svg, 'start');
    text(bx+30, (top+bottom)/2 + 40, 'K 组核 → K 个输出通道', 'head-tag', svg, 'start');
  }

  function render(step){
    svg.innerHTML = '';
    renderBase();
    if (step >= 1) renderSecondChannel();
    if (step >= 2) renderGeneralization();

    if (step === 0){
      note.textContent = '当前：3 个输入通道 × 1 组 2×2 卷积核 → 1 个输出通道。这一组核共有 3×2×2=12 个权重，加 1 个偏置。';
    } else if (step === 1){
      note.textContent = '现在：3 个输入通道 × 2 组核 → 2 个输出通道。每组核仍要覆盖全部 3 个输入通道，2 组核共 2×3×2×2=24 个权重，加 2 个偏置。';
    } else {
      note.textContent = 'K 组核就有 K 个输出通道。参数量为 K × C_in × k_h × k_w + K 个偏置，与输入的空间尺寸无关——这正是权重共享的结构性省参数。';
    }
  }

  if (window.Deck && Deck.onStep) {
    Deck.onStep(function(step){ render(step); }, 2);
  } else {
    render(0);
  }
})();
</script>
</body>
</html>
