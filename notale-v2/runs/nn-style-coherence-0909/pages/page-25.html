<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{position:relative;overflow:hidden}

.head{position:absolute;inset:44px 72px auto;display:flex;flex-direction:column;gap:10px}
.head .nt-title{font-size:var(--fs-sec)}

.evidence{position:absolute;inset:150px 72px 128px;display:flex;flex-direction:column;gap:0}
.chain{position:relative;flex:1;min-height:0}
svg#chain-svg{position:absolute;inset:0;width:100%;height:100%}

.stagelabel{
  position:absolute;top:0;font-family:var(--font-mono);font-size:var(--fs-label);
  color:var(--muted);text-align:center;letter-spacing:.01em;line-height:1.35;
}
.stagelabel b{display:block;color:var(--text);font-weight:700;font-size:var(--fs-body);margin-bottom:2px}

.readout{
  position:absolute;inset:auto 72px 40px;height:64px;
  display:flex;align-items:center;gap:22px;
  border-top:1px solid var(--line);padding-top:14px;
}
.readout .nt-note{flex:0 0 auto;padding-top:0;padding-bottom:0}
.readout .verdict{font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--accent)}

.src{position:absolute;right:72px;bottom:8px;font-size:11px;color:var(--muted);font-family:var(--font-mono)}
</style>
</head>
<body data-page="NN" data-total="44">
<div id="stage">

  <div class="head">
    <span class="nt-kicker">CNN 证据链</span>
    <h1 class="nt-title">像素怎样变成一个类别分数</h1>
    <p class="nt-lead">一张 28×28 的手写数字图像，经过卷积、池化与全连接层的固定顺序，逐步变成 10 个数字的置信度。每一步都能追踪尺寸与内容的变化。</p>
  </div>

  <div class="evidence">
    <div class="chain">
      <svg id="chain-svg" viewBox="0 0 1456 560" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </div>

  <div class="readout">
    <p class="nt-note" id="readout-note">输入的“7”经过六层固定变换后，只有编号 7 的分数条明显更高——这条链条把空间像素逐步压成十个数字，压缩过程本身就是分类依据。</p>
    <span class="verdict" id="readout-verdict"></span>
  </div>

  <span class="src">MNIST 测试集样例 · Wikipedia; LeNet-5 结构示意 · Wikipedia</span>
</div>
<script src="assets/base.js"></script>
<script>
Deck.init({ index: 25, total: 44 });

const svg = document.getElementById('chain-svg');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){
  const n = document.createElementNS(NS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  (parent||svg).appendChild(n);
  return n;
}
function text(x, y, str, cls, parent){
  const t = el('text', {x, y, class: cls||'nt-node-label'}, parent);
  t.textContent = str;
  return t;
}
function multiline(x, y, lines, cls, lh, parent){
  const t = el('text', {x, y, class: cls||'nt-node-label'}, parent);
  lines.forEach((line, i) => {
    const ts = document.createElementNS(NS,'tspan');
    ts.setAttribute('x', x); ts.setAttribute('dy', i===0?0:lh);
    ts.textContent = line;
    t.appendChild(ts);
  });
  return t;
}

/* ---- 数据: 一条真实的 LeNet 式尺寸链 ---- */
const STAGES = [
  { key:'input',  title:'输入', size:'28×28×1', note:'原始像素' },
  { key:'conv1',  title:'卷积 C1', size:'24×24×6', note:'6 个 5×5 卷积核\n局部边缘/笔画特征' },
  { key:'pool1',  title:'池化 S2', size:'12×12×6', note:'2×2 下采样\n位置更粗略' },
  { key:'conv2',  title:'卷积 C3', size:'8×8×16', note:'16 个 5×5 卷积核\n特征组合成笔画结构' },
  { key:'pool2',  title:'池化 S4', size:'4×4×16', note:'2×2 下采样\n压缩到 256 个数' },
  { key:'fc',     title:'全连接', size:'120→84', note:'展平后线性组合\n不再有空间位置' },
  { key:'out',    title:'类别分数', size:'10', note:'每个数字一个分数' }
];

const W = 1456, H = 560;
const laneY = 30;           // 阶段标题起始 y
const bandTop = 96, bandBottom = 430;
const n = STAGES.length;
const colW = W / n;

/* 连接箭头层先画在下面 */
const arrowLayer = el('g', {});
const nodeLayer = el('g', {});
const labelLayer = el('g', {});

/* 中心线 y */
const midY = (bandTop+bandBottom)/2;

/* 每级中心 x */
const cx = STAGES.map((s,i)=> colW*i + colW/2);

/* 画连接箭头(阶段边界到边界) */
STAGES.forEach((s,i)=>{
  if(i===0) return;
  const x1 = cx[i-1] + 46, x2 = cx[i] - 46;
  const path = el('path', {
    d: `M${x1},${midY} L${x2},${midY}`,
    class: 'nt-diagram-line'
  }, arrowLayer);
  // arrowhead
  el('path', {
    d: `M${x2-10},${midY-6} L${x2},${midY} L${x2-10},${midY+6}`,
    class: 'nt-diagram-line'
  }, arrowLayer);
});

/* --- 输入: 真实 MNIST 网格缩略作为矩形代表(用像素方块示意一个"7"轮廓,基于素材图直觉重绘的简化像素) --- */
const digitGrid = [
 "0000000000000000",
 "0000000000000000",
 "0011111111111000",
 "0000000000110000",
 "0000000001100000",
 "0000000011000000",
 "0000000110000000",
 "0000001100000000",
 "0000011000000000",
 "0000111000000000",
 "0000110000000000",
 "0001100000000000",
 "0001100000000000",
 "0001100000000000",
 "0000000000000000",
 "0000000000000000"
];

function drawInputStage(x0){
  const cell = 12.5, cols = 16, rows = 16;
  const gx = x0 - cols*cell/2, gy = midY - rows*cell/2;
  const g = el('g', {}, nodeLayer);
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const v = digitGrid[r][c] === '1';
      el('rect', {
        x: gx + c*cell, y: gy + r*cell, width: cell-1, height: cell-1,
        fill: v ? 'var(--text)' : 'var(--paper)',
        stroke: 'var(--line)', 'stroke-width': 0.5
      }, g);
    }
  }
  el('rect', {x:gx-2,y:gy-2,width:cols*cell+4,height:rows*cell+4,fill:'none',stroke:'var(--line-strong)','stroke-width':'var(--diagram-line-width)'}, g);
}

/* --- 特征图堆叠(通道数用叠层数量表示,层内用简化纹理表示响应) --- */
function drawFeatureStack(x0, channels, spatial, active){
  const g = el('g', {}, nodeLayer);
  const shown = Math.min(channels, 6);
  const base = Math.max(34, Math.min(72, spatial*3.1));
  const step = 6.4;
  for(let i=shown-1;i>=0;i--){
    const off = i*step;
    const w = base, h = base;
    const x = x0 - w/2 + off*0.55, y = midY - h/2 - off*0.55;
    el('rect', {
      x, y, width: w, height: h,
      fill: i===0 ? 'color-mix(in srgb, var(--accent) 20%, var(--paper))' : 'var(--paper)',
      stroke: i===0 ? 'var(--accent)' : 'var(--line-strong)',
      'stroke-width': i===0 ? 2.5 : 'var(--diagram-line-width)'
    }, g);
    if(i===0 && active){
      // 简化的内部纹理线,示意学到的响应模式而非固定边缘算子
      for(let k=0;k<3;k++){
        el('path', {
          d:`M${x+6},${y+8+k*(h-16)/2} l${w-12},${(k%2?1:-1)*10}`,
          class:'nt-diagram-line', 'stroke-width':1.6
        }, g);
      }
    }
  }
  el('text', {x:x0, y: midY + base/2 + 24, class:'nt-tick', 'text-anchor':'middle'}, g).textContent = `${channels} 个通道`;
}

/* --- 全连接: 一列圆点 --- */
function drawDenseStage(x0, count, spread){
  const g = el('g', {}, nodeLayer);
  const shown = Math.min(count, 9);
  const gap = spread / (shown-1);
  const top = midY - spread/2;
  for(let i=0;i<shown;i++){
    el('circle', {cx:x0, cy: top + i*gap, r: 6, class:'nt-node'}, g);
  }
  el('text', {x:x0, y: top + spread + 26, class:'nt-tick', 'text-anchor':'middle'}, g).textContent = `${count} 个单元`;
}

/* --- 输出: 十个类别的横向分数条,真实来自一个固定教学 softmax 示例(非训练结果,已标注) --- */
const scores = [0.02,0.03,0.02,0.01,0.02,0.02,0.01,0.83,0.02,0.02]; // 教学简化,峰值在数字 7
function drawScoreStage(x0){
  const g = el('g', {}, nodeLayer);
  const barW = 15, gap = 4, totalW = 10*barW + 9*gap;
  const startX = x0 - totalW/2;
  const baseY = midY + 78;
  const maxH = 150;
  for(let i=0;i<10;i++){
    const h = Math.max(3, scores[i]*maxH);
    const x = startX + i*(barW+gap);
    const isMax = scores[i] === Math.max(...scores);
    el('rect', {
      x, y: baseY - h, width: barW, height: h,
      fill: isMax ? 'var(--accent)' : 'var(--stable-soft)',
      stroke: isMax ? 'var(--accent)' : 'var(--line-strong)',
      'stroke-width': 1
    }, g);
    el('text', {x:x+barW/2, y: baseY+18, class:'nt-tick', 'text-anchor':'middle'}, g).textContent = i;
    if(isMax){
      el('text', {x:x+barW/2, y: baseY-h-10, class:'nt-tick', 'text-anchor':'middle', fill:'var(--accent)', 'font-weight':'700'}, g).textContent = (scores[i]*100).toFixed(0)+'%';
    }
  }
}

/* 绘制每一阶段 */
STAGES.forEach((s,i)=>{
  const x0 = cx[i];
  if(s.key === 'input'){
    drawInputStage(x0);
  } else if(s.key === 'conv1'){
    drawFeatureStack(x0, 6, 24, true);
  } else if(s.key === 'pool1'){
    drawFeatureStack(x0, 6, 12, false);
  } else if(s.key === 'conv2'){
    drawFeatureStack(x0, 16, 8, true);
  } else if(s.key === 'pool2'){
    drawFeatureStack(x0, 16, 4, false);
  } else if(s.key === 'fc'){
    drawDenseStage(x0, 120, 220);
  } else if(s.key === 'out'){
    drawScoreStage(x0);
  }

  /* 阶段标题与尺寸标签 */
  const lab = el('g', {}, labelLayer);
  const title = el('text', {x:x0, y: laneY, class:'nt-label', 'text-anchor':'middle'}, lab);
  title.setAttribute('style','font-weight:700;color:var(--text);fill:var(--text)');
  title.textContent = s.title;
  const size = el('text', {x:x0, y: laneY+24, class:'nt-mono', 'text-anchor':'middle'}, lab);
  size.setAttribute('style','fill:var(--accent);font-size:17px;font-weight:700');
  size.textContent = s.size;

  const noteLines = s.note.split('\n');
  const noteText = el('text', {x:x0, y: bandBottom+34, class:'nt-tick', 'text-anchor':'middle'}, lab);
  noteLines.forEach((line, li)=>{
    const ts = document.createElementNS(NS,'tspan');
    ts.setAttribute('x', x0); ts.setAttribute('dy', li===0?0:15);
    ts.textContent = line;
    noteText.appendChild(ts);
  });
});

/* 分隔基线 */
el('line', {x1:0, y1:bandBottom+8, x2:W, y2:bandBottom+8, class:'nt-grid-line'}, arrowLayer);

document.getElementById('readout-verdict').textContent = '预测:数字 7（83%）';
</script>
</body>
</html>
