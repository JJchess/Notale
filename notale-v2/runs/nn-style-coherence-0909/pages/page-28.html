<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{ background:var(--bg); color:var(--text); font-family:var(--font-sans); overflow:hidden; }

.kicker{ position:absolute; left:80px; top:56px; }
h1{ position:absolute; left:80px; top:92px; width:1200px; }

.lede{ position:absolute; left:80px; top:172px; width:1200px; }

/* ===== evidence stage ===== */
#evidence{ position:absolute; left:80px; top:264px; width:1440px; height:380px; }

.loop-label, .unroll-label{
  font-size: var(--fs-label); fill: var(--muted); font-family: var(--font-sans);
}

.formula-box{
  position:absolute; left:80px; top:668px; width:1440px; height:44px;
  padding-top:26px; border-top:1px solid var(--line);
}
.formula-row{ display:flex; align-items:baseline; gap:28px; }
.formula-row .eq{ font-size: var(--fs-lead); }
.formula-row .arrow{ color:var(--muted); font-size:.8em; }

.legend{ position:absolute; left:80px; top:748px; width:1440px; display:flex; gap:48px; align-items:center; }
.legend-item{ display:flex; align-items:center; gap:10px; }
.legend-swatch{ width:22px; height:14px; border-radius:2px; flex:none; }
.legend-item span{ font-size: var(--fs-label); color: var(--muted); }

.note{ position:absolute; left:80px; top:800px; width:1300px; }
</style>
</head>
<body data-page="NN" data-total="44">
<div id="stage">

  <p class="kicker nt-kicker">RNN · 循环结构</p>
  <h1 class="nt-title">同一组参数,在序列每一步重复使用</h1>
  <p class="lede nt-lead">当前输入与上一步隐藏状态共同生成新状态；把这一步骤沿时间展开，权重矩阵 W<tspan>ₓₕ</tspan>、W<tspan>ₕₕ</tspan>、W<tspan>ₕᵥ</tspan> 在每一步都是同一份参数，不随步数增加。</p>

  <svg id="evidence" viewBox="0 0 1440 380" width="1440" height="380">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10Z" fill="var(--line-strong)"/>
      </marker>
      <marker id="arrow-stable" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10Z" fill="var(--stable)"/>
      </marker>
    </defs>

    <!-- ============ LEFT: single-step recurrent cell with self-loop ============ -->
    <g id="single-step">
      <text x="130" y="24" class="loop-label" text-anchor="middle">单步(折叠视角)</text>

      <!-- self loop arrow from h_t back to hidden node input, labelled W_hh -->
      <path d="M 172 118 C 226 52, 46 52, 82 112" class="nt-diagram-line" data-state="stable" marker-end="url(#arrow-stable)"/>
      <text x="127" y="46" text-anchor="middle" font-size="15" fill="var(--stable)" font-family="var(--font-sans)" font-weight="600">W_hh</text>

      <!-- x_t input -->
      <circle cx="58" cy="222" r="26" class="nt-node"/>
      <text x="58" y="227" class="nt-node-label">x_t</text>

      <!-- hidden node (active) -->
      <circle cx="130" cy="122" r="34" class="nt-node" data-state="active"/>
      <text x="130" y="127" class="nt-node-label">h_t</text>

      <!-- x_t -> h_t -->
      <path d="M 76 205 L 110 145" class="nt-diagram-line" marker-end="url(#arrow)"/>
      <text x="66" y="172" font-size="14" fill="var(--muted)" font-family="var(--font-sans)">W_xh</text>

      <!-- h_t -> y_t -->
      <path d="M 149 99 L 180 42" class="nt-diagram-line" marker-end="url(#arrow)"/>
      <text x="188" y="66" font-size="14" fill="var(--muted)" font-family="var(--font-sans)">W_hy</text>
      <circle cx="198" cy="20" r="20" class="nt-node"/>
      <text x="198" y="25" class="nt-node-label" font-size="16">y_t</text>

      <text x="120" y="272" text-anchor="middle" font-size="14" fill="var(--muted)" font-family="var(--font-sans)">h_t 同时送去下一步与当前输出</text>
    </g>

    <!-- divider -->
    <line x1="280" y1="6" x2="280" y2="300" stroke="var(--line)" stroke-width="1"/>
    <text x="298" y="60" class="unroll-label">沿时间展开(同一份参数重复出现)</text>

    <!-- ============ RIGHT: unrolled across 3 steps ============ -->
    <g id="unrolled" transform="translate(320,0)">
      <!-- h0 initial state -->
      <circle cx="26" cy="122" r="24" class="nt-node" stroke-dasharray="4 3"/>
      <text x="26" y="127" class="nt-node-label" font-size="15">h₀</text>
      <text x="26" y="164" text-anchor="middle" font-size="13" fill="var(--muted)" font-family="var(--font-sans)">初始状态</text>

      <g id="steps"></g>
    </g>
  </svg>

  <div class="formula-box">
    <div class="formula-row nt-mono eq">
      <span>h<tspan style="font-size:.7em">t</tspan> = f( W_xh · x<tspan style="font-size:.7em">t</tspan> + W_hh · h<tspan style="font-size:.7em">t-1</tspan> + b_h )</span>
      <span class="arrow">→</span>
      <span>y<tspan style="font-size:.7em">t</tspan> = g( W_hy · h<tspan style="font-size:.7em">t</tspan> + b_y )</span>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:var(--accent)"></div><span>隐藏状态 h（每步更新，携带历史信息）</span></div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--stable)"></div><span>W_xh、W_hh、W_hy（跨所有时间步共享，不随 t 增加）</span></div>
  </div>

  <p class="note nt-note">展开图里的三步画的是同一个单元、同一组权重；差异只在输入 x_t 和携带的历史 h_t-1，参数矩阵的形状与数值处处相同。</p>

</div>
<script src="assets/base.js"></script>
<script>
Deck.init({ index:28, total:44 });

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

const stepsG = document.getElementById("steps");
const COL_W = 330;
const CY_HIDDEN = 122;
const labels = ["x₁","x₂","x₃"];

for (let i = 0; i < 3; i++){
  const cx = 116 + i * COL_W;
  const prevCx = i === 0 ? 26 : (116 + (i-1)*COL_W);
  const prevR = i === 0 ? 24 : 30;

  // connector from previous hidden (or h0) to this hidden, labelled W_hh
  const path1 = el("path", {
    d: `M ${prevCx+prevR} ${CY_HIDDEN} L ${cx-30} ${CY_HIDDEN}`,
    class: "nt-diagram-line", "data-state":"stable",
    "marker-end": "url(#arrow-stable)"
  });
  stepsG.appendChild(path1);
  const midX = (prevCx + prevR + cx - 30) / 2;
  const whhLabel = el("text", { x: midX, y: CY_HIDDEN - 14, "text-anchor":"middle", "font-size":"14", fill:"var(--stable)", "font-family":"var(--font-sans)", "font-weight":"600" });
  whhLabel.textContent = "W_hh";
  stepsG.appendChild(whhLabel);

  // input x_i below
  const xNode = el("circle", { cx, cy: 222, r: 24, class:"nt-node" });
  stepsG.appendChild(xNode);
  const xLabel = el("text", { x: cx, y: 227, class:"nt-node-label" });
  xLabel.textContent = labels[i];
  stepsG.appendChild(xLabel);

  // x_i -> hidden
  const path2 = el("path", { d:`M ${cx} ${222-24} L ${cx} ${CY_HIDDEN+30}`, class:"nt-diagram-line", "marker-end":"url(#arrow)" });
  stepsG.appendChild(path2);
  const wxhLabel = el("text", { x: cx+32, y: 177, "font-size":"13", fill:"var(--muted)", "font-family":"var(--font-sans)" });
  wxhLabel.textContent = "W_xh";
  stepsG.appendChild(wxhLabel);

  // hidden node (active)
  const hNode = el("circle", { cx, cy: CY_HIDDEN, r: 30, class:"nt-node", "data-state":"active" });
  stepsG.appendChild(hNode);
  const hLabel = el("text", { x: cx, y: CY_HIDDEN+5, class:"nt-node-label" });
  hLabel.textContent = "h" + labels[i][1];
  stepsG.appendChild(hLabel);

  // hidden -> output
  const path3 = el("path", { d:`M ${cx+19} ${CY_HIDDEN-19} L ${cx+48} ${CY_HIDDEN-84}`, class:"nt-diagram-line", "marker-end":"url(#arrow)" });
  stepsG.appendChild(path3);
  const whyLabel = el("text", { x: cx+64, y: CY_HIDDEN-48, "font-size":"13", fill:"var(--muted)", "font-family":"var(--font-sans)" });
  whyLabel.textContent = "W_hy";
  stepsG.appendChild(whyLabel);

  const yNode = el("circle", { cx: cx+56, cy: CY_HIDDEN-92, r: 18, class:"nt-node" });
  stepsG.appendChild(yNode);
  const yLabel = el("text", { x: cx+56, y: CY_HIDDEN-87, class:"nt-node-label", "font-size":"15" });
  yLabel.textContent = "y" + labels[i][1];
  stepsG.appendChild(yLabel);

  const stepCaption = el("text", { x: cx, y: 272, "text-anchor":"middle", "font-size":"13", fill:"var(--muted)", "font-family":"var(--font-sans)" });
  stepCaption.textContent = "t = " + (i+1);
  stepsG.appendChild(stepCaption);
}
</script>
</body>
</html>
