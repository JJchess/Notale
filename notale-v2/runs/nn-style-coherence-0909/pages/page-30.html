<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
.kicker{ position:absolute; left:68px; top:44px; }
h1.nt-title{ position:absolute; left:68px; top:74px; width:1200px; font-size:var(--fs-h1); line-height:1.14; }
.lead{ position:absolute; left:68px; top:160px; width:1140px; }

#graph-wrap{ position:absolute; left:64px; top:290px; width:1472px; height:354px; }
svg#graph{ width:100%; height:100%; display:block; overflow:visible; }

.fwd-line{ stroke:var(--muted); stroke-width:var(--diagram-line-width, 2px); fill:none; opacity:.85; }
.param-feed{ stroke:var(--line); stroke-width:1.5px; fill:none; stroke-dasharray:3 5; opacity:.55; }
.grad-line{ stroke:var(--accent); stroke-width:2.6px; fill:none; opacity:0; transition:opacity .35s ease; }
.contrib-line{ stroke:var(--accent); stroke-width:1.8px; fill:none; stroke-dasharray:2 4; opacity:0; transition:opacity .35s ease; }

.node-h0 circle, .node-group[data-id="h0"] circle{ fill:var(--bg); stroke:var(--stable); stroke-width:2px; }
.node-h circle{ fill:var(--bg); stroke:var(--stable); stroke-width:2.4px; }
.nt-node-label{ font-family:var(--font-sans); fill:var(--text); font-size:22px; text-anchor:middle; dominant-baseline:middle; }
.time-label{ font-family:var(--font-sans); fill:var(--muted); font-size:var(--fs-label); text-anchor:middle; }

.loss-box{ fill:var(--bg); stroke:var(--accent); stroke-width:2.4px; }
.loss-label{ fill:var(--accent); font-weight:600; }

.param-box{ fill:var(--bg); stroke:var(--stable); stroke-width:2.2px; transition:stroke .3s ease, filter .3s ease; }
.param-box.param-pulsing{ stroke:var(--accent); filter:drop-shadow(0 0 0 var(--accent)); }
.param-label{ fill:var(--text); font-size:18px; font-weight:600; }
.param-sub{ font-family:var(--font-sans); fill:var(--muted); font-size:14px; text-anchor:middle; }

.node-active circle{ stroke:var(--accent); stroke-width:3.2px; }

.note{ position:absolute; left:64px; top:704px; width:756px; }
#note-text{ min-height:76px; }

.nt-controls{ position:absolute; left:868px; top:704px; width:668px; }
.term-pill{ display:inline-block; margin:0 10px 8px 0; padding:5px 12px; border:1px solid var(--line);
  font-family:var(--font-sans); font-size:var(--fs-label); color:var(--muted); }
.term-pill--on{ color:var(--accent); border-color:var(--accent); }
#terms-row{ display:flex; flex-wrap:wrap; margin-top:4px; }
</style>
</head>
<body data-page="NN" data-total="44">
<div id="stage">

  <p class="kicker nt-kicker">05 · RNN 与 LSTM</p>
  <h1 class="nt-title">展开图就是一个深层网络，参数共享</h1>
  <p class="lead nt-lead">时间展开后，t=1…4 的每一步都在用<b>同一组参数</b> W。反向传播时，损失沿这条链逐步往回走，每经过一步就往同一个参数上再记一份责任——最终梯度是这些份额的总和，不是某一步单独的结果。</p>

  <div id="graph-wrap">
    <svg id="graph" viewBox="0 0 1472 354" aria-label="RNN 时间展开图与跨时间反向传播">
      <defs>
        <marker id="arrow-fwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0L10 5L0 10Z" fill="var(--muted)"></path>
        </marker>
        <marker id="arrow-grad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M0 0L10 5L0 10Z" fill="var(--accent)"></path>
        </marker>
      </defs>
    </svg>
  </div>

  <div class="note nt-note" id="note">
    <p class="nt-body" id="note-text"></p>
  </div>

  <div class="nt-controls" id="controls" aria-live="polite">
    <div class="nt-control-row">
      <span class="nt-control-label">总梯度 ∂L/∂W</span>
      <span class="nt-readout nt-mono" id="total-readout">0</span>
    </div>
    <div id="terms-row"></div>
  </div>

</div>
<script src="assets/base.js"></script>
<script>
Deck.init({ index:30, total:44 });

const svg = document.getElementById('graph');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

// ---- layout (logical coords match viewBox 1472x354) ----
const Y_H = 106;
const Y_PARAM = 254;
const X0 = 230, DX = 310;
const xs = [X0, X0+DX, X0+DX*2, X0+DX*3];
const xh0 = X0 - DX*0.62;

const nodes = xs.map((x,i)=>({ x, y:Y_H, id:'h'+(i+1) }));
const h0 = { x: xh0, y: Y_H, id:'h0' };
const lossNode = { x: xs[3]+150, y: 46, id:'L' };
const paramNode = { x: (xs[0]+xs[3])/2, y: Y_PARAM+40, id:'W' };

const gFwd = el('g', {id:'g-fwd'});
const gGrad = el('g', {id:'g-grad'});
const gTerms = el('g', {id:'g-terms'});
const gNodes = el('g', {id:'g-nodes'});
svg.append(gFwd, gGrad, gTerms, gNodes);

function curvePath(x1,y1,x2,y2,bend){
  const mx=(x1+x2)/2, my=(y1+y2)/2 + bend;
  return `M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}`;
}

// forward arrows h_{t-1} -> h_t
let prev = h0;
nodes.forEach((n)=>{
  const p = el('path', { d: curvePath(prev.x+34, prev.y, n.x-34, n.y, 0), class:'fwd-line', 'marker-end':'url(#arrow-fwd)' });
  gFwd.appendChild(p);
  prev = n;
});
// h4 -> L
gFwd.appendChild(el('path', {
  d: curvePath(nodes[3].x+34, nodes[3].y-6, lossNode.x-30, lossNode.y+18, -40),
  class:'fwd-line', 'marker-end':'url(#arrow-fwd)'
}));

// param feed lines (dashed) from W up into each transition's midpoint
[h0, ...nodes.slice(0,3)].forEach((from, i)=>{
  const to = nodes[i];
  const midx = (from.x+to.x)/2;
  gFwd.appendChild(el('path', {
    d:`M${paramNode.x} ${paramNode.y-30} Q${midx} ${Y_PARAM-40} ${midx} ${Y_H+38}`,
    class:'param-feed'
  }));
});

// nodes
function drawNode(n, label, radius, extraClass){
  const g = el('g', {class:'node-group '+(extraClass||''), 'data-id':n.id});
  g.append(
    el('circle', {cx:n.x, cy:n.y, r:radius}),
    Object.assign(el('text', {x:n.x, y:n.y+1, class:'nt-node-label'}), {textContent:label})
  );
  gNodes.appendChild(g);
}
drawNode(h0, 'h₀', 28, 'node-h0');
nodes.forEach((n,i)=> drawNode(n, 'h'+(i+1), 32, 'node-h'));

{
  const g = el('g', {class:'node-group', 'data-id':'L'});
  const r = el('rect', {x:lossNode.x-24, y:lossNode.y-24, width:48, height:48, rx:6, class:'loss-box',
    transform:`rotate(45 ${lossNode.x} ${lossNode.y})`});
  const t = Object.assign(el('text', {x:lossNode.x, y:lossNode.y+1, class:'nt-node-label loss-label'}), {textContent:'L'});
  g.append(r,t);
  gNodes.appendChild(g);
}
{
  const g = el('g', {class:'node-group', 'data-id':'W'});
  const r = el('rect', {x:paramNode.x-66, y:paramNode.y-30, width:132, height:60, rx:8, class:'param-box'});
  const t1 = Object.assign(el('text', {x:paramNode.x, y:paramNode.y-4, class:'param-label'}), {textContent:'W（共享）'});
  const t2 = Object.assign(el('text', {x:paramNode.x, y:paramNode.y+18, class:'param-sub'}), {textContent:'W_hh, W_xh, b'});
  g.append(r,t1,t2);
  gNodes.appendChild(g);
}

nodes.forEach((n,i)=>{
  gNodes.appendChild(Object.assign(el('text', {x:n.x, y:n.y+60, class:'time-label'}), {textContent:'t = '+(i+1)}));
});

// ---- backward chain: L -> h4 -> h3 -> h2 -> h1 ----
const backChain = [lossNode, nodes[3], nodes[2], nodes[1], nodes[0]];
const gradPaths = [];
const contribLines = [];
for (let i=0;i<backChain.length-1;i++){
  const a = backChain[i], b = backChain[i+1];
  const path = el('path', {
    d: curvePath(a.x-28, a.y+(i===0?16:0), b.x+28, b.y-6, i===0? -6 : 26),
    class:'grad-line', 'marker-end':'url(#arrow-grad)'
  });
  gGrad.appendChild(path);
  gradPaths.push(path);

  const contrib = el('path', {
    d: curvePath(b.x, b.y+ (i===0? 22 : 32), paramNode.x, paramNode.y-30, 0),
    class:'contrib-line', 'marker-end':'url(#arrow-grad)'
  });
  gTerms.appendChild(contrib);
  contribLines.push(contrib);
}

const termsRow = document.getElementById('terms-row');
const totalReadout = document.getElementById('total-readout');
const noteText = document.getElementById('note-text');
const paramBoxEl = document.querySelector('.param-box');

// teaching-simplified scalars: dL/dh4 defined as unit gradient, decayed by fixed local Jacobian 0.62 per step back
const decay = 0.62;
const localDW = 0.8; // fixed local d(h_t)/dW teaching constant
const gradAtH = [1.00];
for (let i=1;i<4;i++) gradAtH.push(+(gradAtH[i-1]*decay).toFixed(3));
const contribs = gradAtH.map(g => +(g*localDW).toFixed(3));

const stepNotes = [
  '前向：h0 经过共享参数 W 依次生成 h1、h2、h3、h4，最后由 h4 算出损失 L。灰色箭头是这条计算路径。',
  '先算 L 对 h4 的梯度：∂L/∂h4 = 1.00（定义为这一步的单位梯度）。这份梯度立刻在 W 上记一笔贡献。',
  '梯度往回走一步，乘上局部导数 0.62：∂L/∂h3 = 0.62。t=4 用的也是同一个 W，这里再记一笔贡献。',
  '再往回一步：∂L/∂h2 = 0.62×0.62 ≈ 0.384。同一个 W 又被记一笔——参数没变，只是又多欠了一份责任。',
  '走到最早的 t=1：∂L/∂h1 ≈ 0.238。四份贡献相加，就是 W 收到的总梯度——它把四个时间步的责任都担了。'
];

function fmt(v){ return v.toFixed(3); }

function renderTerms(step){
  termsRow.innerHTML = '';
  const labels = ['t=4','t=3','t=2','t=1'];
  for (let i=0;i<4;i++){
    const show = step > i;
    const span = document.createElement('span');
    span.className = 'term-pill' + (show ? ' term-pill--on' : '');
    span.textContent = show ? (labels[i]+'：+'+fmt(contribs[i])) : (labels[i]+'：—');
    termsRow.appendChild(span);
  }
  let total = 0;
  for (let i=0;i<Math.min(step,4);i++) total += contribs[i];
  totalReadout.textContent = fmt(total);
}

Deck.onStep(function(step){
  gradPaths.forEach((p,i)=>{ p.style.opacity = (step > i) ? '1' : '0'; });
  contribLines.forEach((p,i)=>{ p.style.opacity = (step > i) ? '1' : '0'; });

  const chainIds = ['L','h4','h3','h2','h1'];
  gNodes.querySelectorAll('.node-group').forEach(g=>{
    const idx = chainIds.indexOf(g.getAttribute('data-id'));
    g.classList.toggle('node-active', idx>=0 && idx === step);
  });
  if (paramBoxEl) paramBoxEl.classList.toggle('param-pulsing', step>0 && step<=4);

  noteText.textContent = stepNotes[Math.min(step, stepNotes.length-1)];
  renderTerms(step);
}, 4);
</script>
</body>
</html>
