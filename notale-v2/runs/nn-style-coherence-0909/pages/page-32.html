<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{background:var(--bg);color:var(--text);font-family:var(--font-sans);overflow:hidden}

.kicker{position:absolute;left:70px;top:52px;font-size:var(--fs-label)}
h1.nt-title{position:absolute;left:70px;top:80px;width:1300px;font-size:var(--fs-h2);line-height:1.16;margin:0;white-space:nowrap}
.lead{position:absolute;left:70px;top:158px;width:1460px;font-size:var(--fs-lead);line-height:1.4;color:var(--muted)}

/* sentence strip */
.sentence{position:absolute;left:70px;top:250px;width:1460px;display:flex;gap:8px;align-items:flex-end}
.tok{position:relative;padding:8px 12px 10px;font-size:20px;font-family:var(--font-sans);border-bottom:2px solid var(--line);color:var(--muted);opacity:.32;transition:opacity .25s}
.tok[data-seen="true"]{opacity:1;color:var(--text)}
.tok[data-active="true"]{opacity:1;color:var(--accent);border-bottom-color:var(--accent)}
.tok[data-clue="true"]{color:var(--accent);font-weight:600}
.tok .tag{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-size:var(--fs-tick);color:var(--accent);white-space:nowrap;opacity:0}
.tok[data-clue="true"] .tag{opacity:1}

/* main evidence stage: hidden-state bars evolving across steps */
.evidence{position:absolute;left:70px;top:338px;width:1460px;height:388px}
.evlabel{position:absolute;left:0;top:0;font-size:var(--fs-label);color:var(--muted)}

#chart{position:absolute;left:0;top:34px;width:1460px;height:300px}

.readout{position:absolute;left:0;top:352px;width:1460px;display:flex;justify-content:space-between;align-items:baseline}
.readout .claim{font-size:var(--fs-body);color:var(--text)}
.readout .claim b{color:var(--accent);font-weight:700}
.readout .step{font-size:var(--fs-tick);color:var(--muted);font-family:var(--font-sans)}
</style>
</head>
<body data-page="NN" data-total="44">
<div id="stage">
  <div class="kicker nt-kicker">长程依赖 · 信息压缩</div>
  <h1 class="nt-title">关键线索越早，普通 RNN 越容易把它冲掉</h1>
  <p class="lead nt-body">隐藏状态大小固定。句首代词的性别信息要活过 13 个无关词，才能在句尾被正确读出——每进入一个新词，旧信息就被压缩、覆盖一次。</p>

  <div class="sentence" id="sentence"></div>

  <div class="evidence">
    <div class="evlabel nt-label">隐藏状态中「主语性别」分量的强度（教学模拟，非真实训练值）</div>
    <svg id="chart" viewBox="0 0 1460 300"></svg>
    <div class="readout">
      <div class="claim nt-body" id="claim">第 1 步：读入「她」，性别线索被写入隐藏状态，强度 <b id="claimVal">1.00</b>。</div>
      <div class="step nt-tick" id="stepLabel">STEP 1 / 15</div>
    </div>
  </div>
</div>
<script src="assets/base.js"></script>
<script>
(function(){
"use strict";

// ---- content data -------------------------------------------------
const WORDS = ["她","收拾","好","行李","冒着","大雨","穿过","拥挤","嘈杂","的","车站","赶","上","了","末班车"];
const CLUE_INDEX = 0; // "她" carries the gender clue
// teaching-simplified decay model: each new token overwrites part of the hidden state.
// clue component: multiplies by a retention factor (<1) and gets partially masked by new-token noise.
const RETAIN = 0.80;      // per-step retention of the clue signal (illustrative constant)
const NOISE_SEED = [0.62,0.58,0.71,0.44,0.66,0.51,0.69,0.47,0.60,0.55,0.64,0.49,0.57,0.63];
// other-component strength (interference) per step, deterministic, in [0,1]
function otherStrength(i){ return 0.35 + 0.5*NOISE_SEED[i % NOISE_SEED.length]; }

const N = WORDS.length;
const clueSeries = [1.0];
for(let i=1;i<N;i++){
  const prev = clueSeries[i-1];
  const decayed = prev*RETAIN;
  clueSeries.push(decayed);
}
// readability: clue strength relative to interference at that step (0..1 legible threshold ~0.3)
function legible(i){ return clueSeries[i] > otherStrength(i)*0.55; }

const NOTES = WORDS.map((w,i)=>{
  if(i===0) return `第 1 步：读入「她」，性别线索被写入隐藏状态，强度 ${clueSeries[0].toFixed(2)}。`;
  const legibleNow = legible(i);
  const val = clueSeries[i].toFixed(2);
  if(i===N-1) return `第 ${i+1} 步：读完全句，性别线索强度仅剩 ${val}，${legibleNow?'仍勉强可读':'已被新信息淹没，几乎读不出「她」'}。`;
  return `第 ${i+1} 步：读入「${w}」，旧状态被覆盖一部分，线索强度降到 ${val}。`;
});

// ---- DOM: sentence tokens ------------------------------------------
const sentenceEl = document.getElementById("sentence");
WORDS.forEach((w,i)=>{
  const span = document.createElement("span");
  span.className = "tok";
  span.dataset.step = String(i+1);
  if(i===CLUE_INDEX) span.dataset.clue = "true";
  span.textContent = w;
  if(i===CLUE_INDEX){
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = "性别线索";
    span.appendChild(tag);
  }
  sentenceEl.appendChild(span);
});
const tokens = [...sentenceEl.children];

// ---- SVG chart: two series across 15 steps -------------------------
const svg = document.getElementById("chart");
const W = 1460, H = 300;
const padL = 40, padR = 20, padT = 10, padB = 34;
const plotW = W - padL - padR, plotH = H - padT - padB;
const xAt = i => padL + plotW * (i/(N-1));
const yAt = v => padT + plotH * (1 - v);

function svgEl(tag, attrs){
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

// axes
const axisG = svgEl("g", {});
svg.appendChild(axisG);
[0,0.25,0.5,0.75,1].forEach(v=>{
  const line = svgEl("line", {class:"nt-grid-line", x1:padL, x2:W-padR, y1:yAt(v), y2:yAt(v)});
  axisG.appendChild(line);
  const t = svgEl("text", {x: padL-10, y: yAt(v)+4, "text-anchor":"end", class:"nt-tick"});
  t.textContent = v.toFixed(2);
  axisG.appendChild(t);
});
const baseline = svgEl("line", {x1:padL, x2:W-padR, y1:yAt(0), y2:yAt(0), stroke:"var(--line)", "stroke-width":1});
svg.appendChild(baseline);

// legibility threshold line (illustrative)
const thresholdG = svgEl("g", {});
svg.appendChild(thresholdG);

// interference series (other content, area-ish line)
const interferencePath = svgEl("path", {class:"nt-data-line", fill:"none", stroke:"var(--muted)", "stroke-width":"var(--chart-line-width)", "stroke-dasharray":"4 4"});
svg.appendChild(interferencePath);

// clue series line
const cluePath = svgEl("path", {class:"nt-data-line", fill:"none", stroke:"var(--accent)", "stroke-width":"var(--chart-line-width)"});
svg.appendChild(cluePath);

const clueDotsG = svgEl("g", {});
svg.appendChild(clueDotsG);
const interDotsG = svgEl("g", {});
svg.appendChild(interDotsG);

// x labels (words) under axis, sparse to avoid clutter -> show step numbers
for(let i=0;i<N;i++){
  const t = svgEl("text", {x:xAt(i), y:H-10, "text-anchor":"middle", class:"nt-tick"});
  t.textContent = String(i+1);
  svg.appendChild(t);
}

// legend
const legend = svgEl("g", {});
svg.appendChild(legend);
function legendItem(x, color, dash, text){
  const line = svgEl("line", {x1:x, x2:x+28, y1:20, y2:20, stroke:color, "stroke-width":3, "stroke-dasharray": dash||""});
  legend.appendChild(line);
  const t = svgEl("text", {x:x+36, y:24, class:"nt-label"});
  t.textContent = text;
  t.setAttribute("fill", "var(--text)");
  legend.appendChild(t);
}
legendItem(padL, "var(--accent)", "", "主语性别线索的分量强度");
legendItem(padL+260, "var(--muted)", "4 4", "当前词带来的新信息强度（干扰）");

function pathD(values){
  return values.map((v,i)=> (i===0?"M":"L") + xAt(i).toFixed(1) + "," + yAt(v).toFixed(1)).join(" ");
}

function render(step){ // step: 1..N, how many tokens revealed
  tokens.forEach((tok,i)=>{
    tok.dataset.seen = i < step ? "true" : "false";
    tok.dataset.active = i === step-1 ? "true" : "false";
  });

  const shownClue = clueSeries.slice(0, step);
  const shownOther = Array.from({length:step}, (_,i)=>otherStrength(i));

  cluePath.setAttribute("d", pathD(shownClue));
  interferencePath.setAttribute("d", pathD(shownOther));

  clueDotsG.innerHTML = "";
  shownClue.forEach((v,i)=>{
    const isLast = i === step-1;
    const c = svgEl("circle", {class:"nt-data-point", cx:xAt(i), cy:yAt(v), r: isLast? 6:4, fill:"var(--accent)"});
    clueDotsG.appendChild(c);
  });
  interDotsG.innerHTML = "";
  shownOther.forEach((v,i)=>{
    const c = svgEl("circle", {cx:xAt(i), cy:yAt(v), r:3, fill:"var(--muted)"});
    interDotsG.appendChild(c);
  });

  // threshold marker at legibility boundary illustrative line
  thresholdG.innerHTML = "";
  const lastIdx = step-1;
  if(lastIdx>=0){
    const readableNow = legible(lastIdx);
    const marker = svgEl("text", {x: xAt(lastIdx), y: yAt(shownClue[lastIdx]) - 14, "text-anchor":"middle", class:"nt-label"});
    marker.setAttribute("fill", readableNow ? "var(--accent)" : "var(--muted)");
    marker.textContent = readableNow ? "尚可读出「她」" : "已难以读出「她」";
    thresholdG.appendChild(marker);
  }

  const noteText = NOTES[lastIdx];
  const valStr = clueSeries[lastIdx].toFixed(2);
  const parts = noteText.split(valStr);
  document.getElementById("claim").replaceChildren(
    document.createTextNode(parts[0]),
    (function(){ const b=document.createElement("b"); b.id="claimVal"; b.textContent=valStr; return b; })(),
    document.createTextNode(parts.slice(1).join(valStr))
  );
  document.getElementById("stepLabel").textContent = "STEP " + step + " / " + N;
}

Deck.onStep(function(step, max){
  const shown = Math.max(1, Math.min(N, step + 1));
  render(shown);
}, N-1);

})();
</script>
</body>
</html>
